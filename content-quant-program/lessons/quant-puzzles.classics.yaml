unit: quant-puzzles.classics
opening: >
  Classic brainteasers reward a different skill than most of the tree: the
  interviewer already assumes you may have met the puzzle before, so the score
  is not the final number but whether you can rebuild the winning idea live
  and name the family it belongs to. This unit opens with the one distinction
  that governs how every puzzle here should be read — a guaranteed worst case
  is not an average — then groups the rest by the move that cracks them:
  information-counting for weighing and searching, rate-and-phase reasoning
  for scheduling puzzles, protocol design for players who cannot communicate,
  and invariants for reachability questions. Work the sequence once, then
  treat each lesson as a standalone entry: know which family a new puzzle
  belongs to and the specific numbers fall out fast.
lessons:
  - node: quant-puzzles.classics.guarantee-vs-average
    hook: >
      Interviewers routinely ask "how many" twice in the same sitting — once
      wanting a guarantee, once wanting an average — and answering the wrong
      question, however cleanly reasoned, earns no credit.
    explanation: >
      A guarantee is a claim about the worst outcome an adversary can arrange
      against a fixed procedure; an average is a claim about a stated random
      process. The two demand entirely different proofs: a guarantee needs a
      lower bound (why no scheme can do better) and a matching scheme (one
      that actually attains the bound), while an average needs nothing but a
      probability model and direct summation.

      The lower bound for a guarantee is almost always a counting argument:
      count how many final answers a procedure must distinguish, count how
      many distinct outcomes your available moves can produce, and note that
      the second number must reach the first. This is the same move whether
      the "moves" are weighings, questions, or guesses, and it's what turns "I
      found a scheme with three steps" into "three steps is also provably
      necessary."

      Worst-case thinking additionally means imagining an adversary who sees
      your entire deterministic plan in advance and then picks the hidden
      configuration to hurt you most — a plan that's fast on most inputs and
      slow on one is scored at its slowest branch, full stop. An average
      question instead needs an actual distribution stated or assumed, and any
      answer given without one is not wrong so much as incomplete.
    interview: >
      The tell is the phrase itself: "what's the minimum number of weighings
      that always works" wants a guarantee, "what's the expected number of
      guesses" wants an average — state out loud which one you're answering
      before touching arithmetic, since interviewers deliberately phrase some
      questions ambiguously to see if you ask.
    pitfalls: >
      Computing an average number of steps and presenting it as the answer to
      a stated guarantee question (or the reverse) is the single most common
      miss in this whole family of puzzles. Supplying only the scheme half of
      a guarantee answer, with no argument for why fewer steps cannot possibly
      work, leaves the harder half unanswered.
    recap: >
      Guarantee answers need a lower bound and a matching scheme under an
      adversary; average answers need a stated distribution — never let one
      stand in for the other.
    steps:
      - teach: >
          "How many weighings does it take" can mean two different things: a
          guarantee that a fixed procedure never needs more, whatever the
          hidden configuration turns out to be, or an average over a stated
          random process. The number answering one question is rarely the
          number answering the other.
      - teach: >
          A guarantee answer has two separate halves, and both are required: a
          lower bound showing fewer steps cannot possibly work, and an
          explicit scheme that actually achieves that bound. An average
          answer needs neither — only a probability distribution and a direct
          weighted sum.
      - ask: >
          An interviewer asks, "What is the minimum number of weighings that
          *always* finds the fake coin, no matter which one it is?" Which
          answer does this call for?
        choices:
          - text: >
              An average, computed once a distribution over which coin is
              fake is assumed
            feedback: >
              "Always" is worst-case language — there is no distribution to
              assume here, only an adversary who picks the hardest
              configuration.
          - text: >
              A guarantee: a lower bound on the number of weighings plus a
              scheme that meets it
            correct: true
            feedback: >
              Correct. "Always" means the scheme must work on every
              configuration, which is exactly a worst-case guarantee, not an
              average.
          - text: >
              Either framing is fine, provided the final number is correct
            feedback: >
              The two framings need different proofs — a guarantee needs a
              lower bound and a matching scheme, an average needs a
              distribution — so a correct number reached the wrong way still
              misses the question.
        feedback: >
          "Always" signals a guarantee: name the lower bound, then the scheme
          that attains it.
      - teach: >
          Worst-case thinking means imagining an adversary who has already
          seen your entire deterministic plan and then picks the hidden
          configuration to hurt you most. A plan that is fast on most inputs
          and slow on one is scored at its slowest branch, in full.
      - ask: >
          A deterministic scheme takes $2$ steps on five of its eight equally
          likely branches and $6$ steps on the other three. What is its
          *guaranteed* (worst-case) number of steps?
        expects: "6"
        hint: >
          The guarantee is a claim about every branch, not about the typical
          one.
        feedback: >
          An adversary steers you into whichever branch is slowest, so the
          guarantee is the maximum over branches, $6$ — the $2$-step branches
          never enter a worst-case claim at all.
      - teach: >
          An average claim instead needs a distribution stated or assumed
          before any arithmetic starts; without one, a quoted average is not
          wrong so much as unanswerable.
      - ask: >
          A deterministic scheme's branches occur with probability $5/8$
          (costing $2$ steps) and $3/8$ (costing $6$ steps). What is its
          *average* number of steps under that distribution?
        expects: "3.5"
        hint: >
          Weight each branch's cost by its probability and add.
        feedback: >
          $\frac{5}{8}(2) + \frac{3}{8}(6) = \frac{10}{8} + \frac{18}{8} =
          \frac{28}{8} = 3.5$ — a different number from the guarantee of $6$,
          because it answers a different question.
      - teach: >
          Before computing anything, say out loud which question you are
          answering. The two numbers rarely coincide, and supplying one when
          the other was asked earns no credit even when the arithmetic is
          flawless.

  - node: quant-puzzles.classics.coin-weighing
    hook: >
      This is the single most-recycled puzzle in the whole interview canon, so
      the actual scoring event is never "do you know the answer is three" —
      it's whether you can rebuild the counting bound and the pan-splitting
      scheme from scratch under a clock.
    explanation: >
      Each weighing has exactly three possible outcomes — left pan down,
      right pan down, balanced — so $w$ weighings can in principle distinguish
      $3^{w}$ final states. The unknown here is a pair (which of twelve coins,
      heavy or light), so there are $24$ states to separate; since
      $3^{2}=9<24$ but $3^{3}=27\ge 24$, three is the first weighing count
      that could possibly work, and the whole puzzle becomes proving a scheme
      actually reaches that ceiling.

      The scheme has to make every weighing worth close to its full three
      outcomes of information, which is why the first split is four against
      four rather than six against six: leaving four coins off the scale
      keeps the balanced branch informative (narrowing to four suspects,
      still requiring real work) instead of wasting most of the outcome space
      on a lopsided partition.

      The second-weighing trick — moving specific coins between the two pans
      and pulling in known-genuine coins to pad — is what makes the scheme,
      not just the count, work: reshuffling suspects between pans is what
      lets a single weighing simultaneously test "is coin X heavy" and "is
      coin Y light," separating all the surviving cases with one three-way
      split.
    worked: >
      Nine coins, one heavier than the rest, direction already known — two
      weighings. Split into three groups of three, A, B, C, and weigh A
      against B. A balance puts the heavy coin in C; an imbalance puts it in
      whichever pan went down. Either way you're left with three suspects and
      one weighing: weigh any two of the three against each other — a balance
      names the third as heavy, an imbalance names the heavier pan. Nine
      coins collapse to one in exactly two weighings, matching $3^{2}=9$
      exactly.
    interview: >
      The disguise is almost always a change to what's unknown: "direction
      known" cuts the state count per suspect in half, while "no known-genuine
      coins available as reference" removes the padding trick and can force an
      extra weighing. Listen for whether the interviewer states the direction
      as known or unknown before committing to a group size.
    pitfalls: >
      Forgetting that an unknown direction doubles the state count (twenty-four,
      not twelve) is the most common miscount, and it silently invalidates a
      plan built for the direction-known version. Splitting into unequal
      groups, or reusing the exact same coins in the same pans on the second
      weighing, wastes the informative branches the first weighing bought.
    recap: >
      Three weighings suffice for twelve coins because $3^{3}=27$ just clears
      the $24$ states to separate, and the scheme earns that bound by
      reshuffling suspects across pans rather than repeating the same split.
    steps:
      - teach: >
          Each weighing has exactly three possible outcomes — left pan down,
          right pan down, balanced — so $w$ weighings can in principle
          distinguish $3^{w}$ final states. Whatever is unknown, count how
          many states there are and find the smallest $w$ with $3^{w}$ at
          least that large.
      - teach: >
          When the fake coin's direction is unknown, the unknown is a pair —
          which coin, heavy or light — so the state count is twice the number
          of coins. That doubling is exactly what direction-known variants of
          this puzzle remove.
      - ask: >
          Twenty coins, one counterfeit of unknown direction. By the counting
          bound alone, what is the fewest weighings that could possibly find
          it and name its direction?
        expects: "4"
        hint: >
          The state count is twice the coin count here; find the smallest $w$
          with $3^{w}$ at least that large.
        feedback: >
          States to separate: $2 \times 20 = 40$. $3^{3} = 27 < 40$, but
          $3^{4} = 81 \ge 40$, so four weighings is the first count that could
          possibly work.
      - teach: >
          Meeting that ceiling also requires the scheme to use nearly the
          full three-outcome capacity of every weighing, which is why the
          first split leaves several coins off the scale rather than putting
          every coin on one pan or the other.
      - ask: >
          For the first weighing on twelve coins, which split makes the
          balanced outcome genuinely informative?
        choices:
          - text: >
              Six against six, with none aside
            feedback: >
              With every coin on the scale, the one fake coin must tip its
              side — the pans can never balance, so this split wastes the
              balanced outcome entirely.
          - text: >
              Four against four, with four aside
            correct: true
            feedback: >
              Leaving four coins aside makes a balance (fake among the four
              aside) a real, informative outcome, splitting the suspects
              close to evenly across all three branches.
          - text: >
              It doesn't matter, since three weighings suffice either way
            feedback: >
              An uninformative first split can push the scheme past three
              weighings — the split has to earn the bound, not just approach
              it.
        feedback: >
          Leave enough coins aside that a balance is still possible: that is
          what lets one weighing carry close to its full three outcomes of
          information.
      - teach: >
          The second weighing's trick is reshuffling suspects between the two
          pans and pulling in known-genuine coins to pad — this is what makes
          the scheme, not just the state count, actually work.
      - ask: >
          Fifteen coins, one counterfeit whose *direction is already known*.
          By the counting bound alone, what is the fewest weighings needed?
        expects: "3"
        hint: >
          A known direction means the unknown is only "which coin," not
          "which coin and which direction."
        feedback: >
          States to separate: just $15$, since direction is no longer
          unknown. $3^{2} = 9 < 15$, but $3^{3} = 27 \ge 15$, so three
          weighings is the first count that could possibly work.
      - teach: >
          Listen for whether the interviewer states the direction as known or
          unknown before committing to a group size — that single word
          changes the state count and can change the answer.

  - node: quant-puzzles.classics.coin-weighing-scaling
    hook: >
      The interviewer's natural follow-up to the twelve-coin puzzle is "and
      with four weighings?" — answering instantly from the formula, rather
      than re-deriving the whole scheme, is what separates having solved the
      puzzle from having understood it.
    explanation: >
      The counting bound from three weighings generalises directly: $n$
      weighings distinguish at most $3^{n}$ outcomes, but three of those are
      wasted. Two are lost because the all-left and all-right tilt sequences
      each need to single out a specific coin with no counterpart, which
      symmetry forbids; a third is lost because the all-balanced sequence only
      says "no fake found among the suspects weighed," carrying no direction
      information at all. Net usable capacity is $3^{n}-3$ states, and since
      each of the two directions needs its own state, the coin count is
      $(3^{n}-3)/2$.

      A reference coin fixes the other wasted pair, not the all-balanced one:
      the all-balanced sequence can only ever mean "no counterfeit found
      among the coins actually weighed," which never carries a direction and
      stays wasted regardless. What's actually unusable without a reference
      is a coin whose codeword rides one pan every single weighing, since
      such a coin would leave that pan permanently one coin ahead of the
      other in count, violating the requirement that both pans hold equally
      many coins each round. One known-genuine reference coin can pad the
      opposite pan on every such round, legalising that one extra coin's two
      possible states and recovering exactly the two outcome sequences that
      were otherwise off-limits, pushing the bound from $3^{n}-3$ to
      $3^{n}-1$.

      The scheme achieving this bound doesn't need to be adaptive — you don't
      need to see weighing one's result before planning weighing two. Assign
      each coin a fixed length-$n$ code over left, right, and off in advance,
      place it on the left or right pan (or aside) exactly as its code says on
      each weighing, and read the sequence of three tilts as one base-$3$
      number that names the fake and its direction directly.
    worked: >
      Five weighings, no reference coin: $(3^{5}-3)/2 = (243-3)/2 = 120$
      coins. Adding one known-genuine reference coin to pad whichever pan
      would otherwise fall short legalises the one coin whose codeword rides
      a single pan every round, and pushes the bound to
      $(3^{5}-1)/2 = (243-1)/2 = 121$ coins — one extra coin identified for
      the cost of borrowing a coin you already trust.
    interview: >
      A common trap question is "so doubling the weighings doubles the coins
      you can check" — it doesn't; the bound is exponential in the number of
      weighings, not linear, so going from three to four weighings jumps from
      twelve to thirty-nine coins. Expect to be asked to justify the $-3$ or
      $-1$ correction rather than just quote the formula.
    pitfalls: >
      Using $3^{n}/2$ without subtracting the wasted states overcounts by
      exactly the amount the all-balanced and all-tilted-one-way sequences
      fail to distinguish. Forgetting that a reference coin only buys back the
      all-tilted-one-way pair, and never the all-balanced sequence, is the
      other common overreach.
    recap: >
      The information bound $(3^{n}-3)/2$, or $(3^{n}-1)/2$ with one
      reference coin, is tight and achieved by a fixed, non-adaptive base-$3$
      coding of every coin across all $n$ weighings.
    steps:
      - teach: >
          The three-weighing bound generalises directly: $n$ weighings can
          distinguish at most $3^{n}$ outcomes, but three of those outcomes
          are wasted and carry no usable information at all.
      - teach: >
          Two are lost because the all-left and all-right tilt sequences
          would each have to single out one specific coin with no
          counterpart, which symmetry forbids; a third is lost because the
          all-balanced sequence only says "no fake found among the suspects
          weighed," with no direction attached. Net usable capacity is
          $3^{n}-3$ states, and since both directions need their own state,
          the coin count is $(3^{n}-3)/2$.
      - ask: >
          With six weighings and no reference coin, what is the largest
          number of coins that can always be found and its direction
          determined?
        expects: "363"
        hint: >
          Apply $(3^{n}-3)/2$ with $n=6$.
        feedback: >
          $(3^{6}-3)/2 = (729-3)/2 = 363$.
      - teach: >
          A reference coin recovers exactly the all-tilted-one-way pair, not
          the all-balanced sequence — that one still only ever means "no
          counterfeit among the coins weighed," never a direction, and stays
          wasted regardless of any reference. The recovered pair pushes the
          bound from $3^{n}-3$ to $3^{n}-1$.
      - ask: >
          With six weighings and one known-genuine reference coin to pad a
          pan whenever needed, what is the largest coin count the scheme can
          handle?
        expects: "364"
        hint: >
          Apply $(3^{n}-1)/2$ with $n=6$.
        feedback: >
          $(3^{6}-1)/2 = (729-1)/2 = 364$ — one extra coin identified for the
          cost of borrowing a coin you already trust.
      - ask: >
          "If four weighings handle thirty-nine coins, doesn't three times
          the weighings handle roughly three times the coins?" Which response
          is correct?
        choices:
          - text: >
              Yes — the bound grows in direct proportion to the number of
              weighings
            feedback: >
              It doesn't: the bound is exponential in the weighing count, not
              linear, so a small increase in weighings produces a far larger
              jump in coins than proportional scaling would predict.
          - text: >
              No — the bound is exponential in the number of weighings, so a
              small increase in weighings produces a vastly larger increase
              in coins
            correct: true
            feedback: >
              Right. Doubling $n$ roughly squares the raw capacity $3^{n}$,
              not doubles it — going from three to four weighings alone jumps
              from twelve coins to thirty-nine.
          - text: >
              No — extra weighings beyond three or four add nothing, since
              the scheme is already optimal
            feedback: >
              More weighings do keep adding capacity, and by a lot —
              multiplicatively, not by a fixed amount each time.
        feedback: >
          The bound is exponential in $n$: linear reasoning about "twice the
          weighings, twice the coins" badly undershoots the real growth.
      - teach: >
          None of this needs adaptivity. Assign each coin a fixed length-$n$
          code over left, right, and off in advance, weigh exactly as the
          code says on every round, and read the resulting sequence of tilts
          as one base-$3$ number that names the fake and its direction
          directly.

  - node: quant-puzzles.classics.mislabeled-jars
    hook: >
      This puzzle is over in one draw, and the entire interview is about
      whether you can explain why zero draws fail and why any other single
      draw might not — not about performing the arithmetic.
    explanation: >
      Before any fruit is drawn, count how many labelings are still
      consistent with "every label is wrong": with three categories, the
      number of ways to assign contents so that no jar's true content matches
      its label is the number of derangements of three items, exactly two.
      Zero draws leaves both possibilities open, so some information is
      unavoidably required — the guarantee's lower bound is this count of
      surviving worlds, not a physical argument about jars.

      A single well-chosen draw eliminates one of the two worlds outright only
      if it's taken from the jar labelled "mixed," because that jar's true
      content is forced away from "mixed" by the constraint, leaving exactly
      two possible contents for it — whichever one the drawn fruit reveals
      collapses both derangements to one immediately. A draw from a jar
      labelled with an actual fruit name doesn't have this property: that jar
      could still hold either of the other fruits or the mix, so a single
      fruit doesn't always separate the two surviving worlds.

      Once the "mixed"-labelled jar's true content is known, the rest cascades
      by elimination rather than more draws: the jar labelled with the fruit
      you just identified cannot hold that fruit and cannot be mixed either,
      so its content is forced, and the third jar's follows by exhaustion.
    worked: >
      With two categories instead of three — say two jars holding only red or
      only blue marbles, both labels swapped — there's only one derangement
      of two items, so "all labels wrong" already pins the full assignment:
      the jar labelled red holds blue and vice versa, with zero draws needed.
      Contrast four categories: the derangement count jumps to nine, and a
      single draw, with at most four distinguishable outcomes, can no longer
      guarantee collapsing all nine surviving worlds to one, so the three-jar
      puzzle's "one draw always suffices" doesn't extend to four labels
      without a second draw.
    interview: >
      The question is almost always asked with the constraint stated exactly
      as here — every label wrong — so watch for a weakened version ("at
      least one jar is correctly labelled") where the surviving-worlds count
      differs and one draw may no longer suffice; naming the derangement count
      out loud is the fast way to check.
    pitfalls: >
      Drawing from a jar whose label names an actual fruit, rather than the
      jar labelled "mixed," can leave more than one world consistent with what
      you see — an orange from the jar labelled "apples" leaves that jar as
      either oranges or mixed. Assuming the one-draw answer generalises
      unchanged to more than three categories ignores that the number of
      surviving worlds grows far faster than what a single draw can
      distinguish.
    recap: >
      One draw from the jar labelled "mixed" collapses the two consistent
      derangements to one, and every other jar's true label then follows by
      elimination.
    steps:
      - teach: >
          Before any draw, count how many labelings are still consistent with
          "every label is wrong." With three categories that count is the
          number of derangements of three items — exactly two — and this
          count, not a physical argument about jars, is the guarantee's lower
          bound.
      - teach: >
          A single draw eliminates one of the two worlds outright only if it
          comes from the container labeled with the "everything" category,
          because that container's true content is forced away from
          "everything" by the constraint, leaving exactly two candidates for
          it and one fruit to decide between them.
      - ask: >
          Three casks are labeled "red wine," "white wine," and "blend," and
          every label is wrong. From which cask should the one guaranteed
          draw come?
        choices:
          - text: >
              The cask labeled "red wine"
            feedback: >
              That cask could still hold white wine or the blend — a single
              draw from it does not always separate the two surviving worlds.
          - text: >
              The cask labeled "blend"
            correct: true
            feedback: >
              Right: "blend" is wrong, so that cask must hold red or white
              outright, and the single draw reveals which.
          - text: >
              Any cask works equally well
            feedback: >
              A cask labeled with an actual variety could still hold either
              the other variety or the blend, so a draw from it does not
              always pin the answer.
        feedback: >
          Draw from whichever container is labeled with the "everything"
          category — its true content is forced to be one specific real
          thing.
      - teach: >
          Once that container's true content is known, the rest follows by
          elimination rather than more draws: the container labeled with the
          item just identified cannot hold that item and cannot be the
          "everything" category either, forcing its content, and the last
          container's content follows by exhaustion.
      - ask: >
          Three tins of paint are labeled "red," "blue," and "mixed," and
          every label is wrong. What is the guaranteed minimum number of tins
          you must sample to correctly relabel all three?
        expects: "1"
        hint: >
          Count how many worlds a zero-draw guess leaves open, and whether
          one well-chosen draw can close the gap.
        feedback: >
          Zero draws leaves both derangements open. One draw from the tin
          labeled "mixed" forces its true colour, collapsing the two worlds
          to one — so the guaranteed minimum is $1$.
      - ask: >
          With four categories instead of three, all labels wrong (nine
          consistent worlds instead of two), does one guaranteed draw still
          relabel everything correctly?
        choices:
          - text: >
              No — a single draw has at most four outcomes, which cannot
              always separate nine surviving worlds down to one
            correct: true
            feedback: >
              Right. The three-jar shortcut relied on the surviving-world
              count being small enough for one draw to resolve; nine worlds
              badly outnumber what one draw can distinguish.
          - text: >
              Yes — the "everything"-labeled category still pins its
              identity in one draw, exactly as with three categories
            feedback: >
              With four categories there is no single label guaranteed to be
              the "everything" category the way "mixed" was among three, and
              the surviving-world count has grown far past what one draw
              resolves.
          - text: >
              Yes, as long as you draw from whichever label seems least
              likely
            feedback: >
              No such shortcut exists in the worst case — nine surviving
              worlds cannot be safely collapsed to one by a single draw,
              whichever container it comes from.
        feedback: >
          The derangement count for four categories is nine, which badly
          outpaces what one draw's handful of outcomes can distinguish — the
          three-jar answer does not extend as-is.
      - teach: >
          The guarantee's lower bound is always this surviving-worlds count,
          not a physical fact about jars — which is why it changes sharply
          once the number of categories changes.

  - node: quant-puzzles.classics.egg-drop
    hook: >
      This is the purest test of working backwards from a budget rather than
      searching forward through drop sequences, and the interviewer is
      listening for the triangular-number argument, not just a memorised
      fourteen.
    explanation: >
      Frame the state as a budget: with a given number of eggs and drops
      remaining, ask how many floors that budget can certify. Once the first
      egg breaks on some drop, only one egg is left, and it must sweep the
      untested floors below it one at a time — no shortcuts, since a second
      break with the last egg tells you nothing further. So a jump of $s$
      floors costs $s$ drops in the worst case, whether the egg breaks
      immediately or survives.

      Working backwards from a total budget of $n$ drops: the very first drop
      can go no higher than floor $n$, because a break there must still be
      resolved by sweeping $n-1$ remaining floors one at a time, using up the
      rest of the budget exactly. If it survives, the budget for the next jump
      is $n-1$, forcing the next jump height down by exactly one, and so on —
      the jump heights must be $n, n-1, n-2, \ldots, 1$, summing to
      $n(n+1)/2$ floors covered for a budget of $n$ drops.

      Solving $n(n+1)/2 \ge \text{floor count}$ for the smallest integer $n$
      gives the answer directly, with no simulation of individual drop
      sequences required.
    worked: >
      A $200$-floor building, two eggs: solve $n(n+1)/2 \ge 200$. At $n=19$,
      $19 \cdot 20/2 = 190 < 200$; at $n=20$, $20 \cdot 21/2 = 210 \ge 200$, so
      $20$ drops suffice and $19$ do not. The schedule is floors
      $20, 39, 57, 74, 90, 105, 119, 132, 144, 155, 165, 174, 182, 189, 195,
      200$, from jumps shrinking $20, 19, 18, \ldots$; a break anywhere costs
      at most $19$ more one-floor sweeps, and no branch exceeds $20$ drops
      total.
    interview: >
      Expect the floor count to change, or the egg count to change to three,
      which needs a genuinely different two-dimensional recursion rather than
      a simple triangular sum — naming that the two-egg formula doesn't extend
      by the same argument is itself a signal you understand why it worked.
    pitfalls: >
      Reusing the same jump size after a surviving drop, rather than shrinking
      it by one, silently assumes an unlimited egg budget and produces a
      schedule that fails on the worst branch. Treating this like binary
      search and halving the remaining floors each time ignores that a second
      break with the last egg is fatal to the search, not just uninformative.
    recap: >
      Two eggs and a budget of $n$ drops cover $n(n+1)/2$ floors via jump
      sizes that shrink by one after every survival, so the minimum drops for
      $100$ floors is $14$ and for $200$ floors is $20$.
    steps:
      - teach: >
          Frame the state as a budget: with some number of drops remaining,
          ask how many floors that budget can certify. Once the first egg
          breaks, only one egg is left, and it must sweep the untested floors
          below it one at a time — a jump of $s$ floors costs $s$ drops in the
          worst case.
      - teach: >
          Working backwards from a total budget of $n$ drops, the very first
          drop can go no higher than floor $n$: a break there must still be
          resolved by sweeping $n-1$ remaining floors one at a time, using up
          the rest of the budget exactly. Each surviving drop shrinks the
          next jump by one, so the jump sizes are $n, n-1, n-2, \ldots, 1$,
          covering $n(n+1)/2$ floors in total.
      - ask: >
          A $150$-floor building, two eggs. What is the minimum number of
          drops that guarantees finding the threshold?
        expects: "17"
        hint: >
          Find the smallest $n$ with $n(n+1)/2 \ge 150$.
        feedback: >
          At $n=16$, $16 \cdot 17/2 = 136 < 150$; at $n=17$,
          $17 \cdot 18/2 = 153 \ge 150$, so $17$ drops suffice and $16$ do
          not.
      - teach: >
          The schedule itself falls straight out of the same budget: drop
          first at floor $n$, and after every survival shrink the next jump
          by exactly one floor, so no branch ever exceeds the budget.
      - ask: >
          A $300$-floor building, two eggs. What is the minimum number of
          drops that guarantees finding the threshold?
        expects: "24"
        hint: >
          Find the smallest $n$ with $n(n+1)/2 \ge 300$.
        feedback: >
          At $n=23$, $23 \cdot 24/2 = 276 < 300$; at $n=24$,
          $24 \cdot 25/2 = 300 \ge 300$, so $24$ drops suffice exactly.
      - ask: >
          Which mistake produces a schedule that fails on some worst-case
          branch?
        choices:
          - text: >
              Using the same jump size after every surviving drop, instead of
              shrinking it by one
            correct: true
            feedback: >
              Right — a constant jump size silently assumes an unlimited egg
              budget, which stops being true as drops are spent.
          - text: >
              Treating this like binary search and halving the remaining
              floors on every drop
            feedback: >
              A second break with the last egg is fatal to the search, not
              merely uninformative — halving throws away the last egg's real
              job, sweeping one floor at a time below the break.
          - text: >
              Starting the first drop above floor $n$, hoping to save a drop
              if it survives
            feedback: >
              Starting higher than floor $n$ leaves too little budget to
              sweep every floor below if that first drop breaks — floor $n$
              is the highest the budget can actually afford.
        feedback: >
          A constant jump size assumes you can always afford a full sweep
          with the surviving egg — an assumption that fails as the drop
          budget runs down.
      - teach: >
          This is not binary search: a second break with the last egg is
          fatal to the search, not merely uninformative, which is exactly why
          the jumps shrink instead of halving.

  - node: quant-puzzles.classics.phase-scheduling
    hook: >
      Any puzzle that asks for the minimum total time or cost of a sequence of
      moves is quietly asking you to find a rate, not to search over
      orderings — missing this reframe is why these puzzles feel
      combinatorial when they're actually arithmetic.
    explanation: >
      The reframe is to stop asking which sequence of moves is fastest and
      instead ask what progress costs per unit, and whether that cost ever
      changes. Cut the process into phases inside which the marginal cost per
      unit of progress is constant, count how many units each phase must
      cover, and let the only real decision be where the phase boundaries
      fall.

      This works because listing the rates does two jobs at once: it turns
      the optimization into comparing a handful of numbers instead of
      searching a combinatorial space of orderings, and it supplies the
      matching lower bound for free — no schedule can beat the best available
      rate in whichever phase it's currently in, so a schedule that matches
      the rate in every phase is automatically optimal.

      The skill is spotting where the rate actually changes. It's rarely
      announced explicitly; it's usually a hidden threshold in the problem's
      physical setup — a resource crossing a capacity boundary, a group's
      bottleneck member changing, a process switching from parallel to serial
      effort.
    worked: >
      A battery charges at $2\%$ per minute while its charge is below $80\%$,
      then drops to $0.5\%$ per minute above that; find the minimum time from
      empty to $95\%$. Phase one covers $0$ to $80\%$ at the fast rate:
      $80/2=40$ minutes. Phase two covers the remaining $15$ points at the
      slow rate: $15/0.5=30$ minutes. Total: $40+30=70$ minutes, with the
      phase boundary sitting exactly where the rate itself changes.
    interview: >
      The bridge, camel, and fuse puzzles are literally this technique
      applied to three different resources — time, banana inventory, and burn
      length — so once you're asked any "minimum time or cost" puzzle, naming
      the phases and their rates out loud before computing anything is the
      expected first move.
    pitfalls: >
      Searching over move orderings by hand, rather than identifying the rate
      structure first, wastes time and tends to land on a locally-good but
      globally suboptimal schedule. Missing a rate change — treating the
      whole process as one phase when a threshold is crossed partway through —
      silently uses the wrong constant and gives a wrong total.
    recap: >
      Split the process into constant-rate phases, size each phase, and
      optimize only the boundaries — the rate list is simultaneously the
      schedule and its own lower-bound proof.
    steps:
      - teach: >
          The reframe: stop asking which sequence of moves is fastest and ask
          instead what progress costs per unit, and whether that cost ever
          changes. Cut the process into phases where the marginal cost per
          unit is constant, and let the only free choice be where the phase
          boundaries fall.
      - teach: >
          This works because listing the rates does two jobs at once: it
          turns the optimization into comparing a handful of numbers instead
          of searching orderings, and it supplies the matching lower bound for
          free, since no schedule can beat the best rate available in
          whichever phase it is currently in.
      - ask: >
          A tank fills at $5$ litres per minute while its level is below $60$
          litres, then at $2$ litres per minute above that. What is the
          minimum time, in minutes, to fill it from empty to $90$ litres?
        expects: "27"
        hint: >
          Split at the $60$-litre threshold and time each phase separately.
        feedback: >
          Phase one covers $0$ to $60$ litres at $5$ per minute: $60/5=12$
          minutes. Phase two covers the remaining $30$ litres at $2$ per
          minute: $30/2=15$ minutes. Total: $12+15=27$ minutes.
      - teach: >
          The skill is spotting where the rate actually changes. It is rarely
          announced; it is usually a hidden threshold in the setup — a
          resource crossing a capacity boundary, a group's bottleneck member
          changing, a process switching from parallel to serial effort.
      - ask: >
          A process runs at $4$ units of work per minute for the first $20$
          units, then at $1$ unit per minute for the remaining work up to
          $50$ units total. What is the minimum total time, in minutes?
        expects: "35"
        hint: >
          Time the $20$-unit phase and the remaining $30$-unit phase
          separately, then add.
        feedback: >
          Phase one: $20/4=5$ minutes. Phase two: the remaining
          $50-20=30$ units at $1$ per minute is $30$ minutes. Total:
          $5+30=35$ minutes.
      - ask: >
          A schedule's true rate changes at a hidden threshold partway
          through, but the threshold was never located. Which mistake does
          this produce?
        choices:
          - text: >
              Treating the whole process as one phase at the initial rate,
              missing where the rate actually changes
            correct: true
            feedback: >
              Right — applying one rate across a boundary it doesn't hold
              past silently uses the wrong constant for part of the process.
          - text: >
              Assuming the threshold sits exactly halfway through the total
              distance or time, without locating it from the problem's own
              setup
            feedback: >
              The threshold is a specific capacity or bottleneck point fixed
              by the problem — assuming it's the midpoint substitutes a guess
              for the actual crossing point.
          - text: >
              Applying the phase reached last to the entire process, since it
              is the rate the schedule ends on
            feedback: >
              This errs in the opposite direction, overstating how much of
              the process runs at the final phase's rate and ignoring the
              time actually spent in the earlier phase.
        feedback: >
          The single most common error is missing a threshold crossing and
          applying one rate throughout, which over- or undercounts depending
          on whether the true rate nearby is higher or lower than assumed.
      - teach: >
          Name the phases and their rates out loud before computing anything
          — the same move that solves any "minimum time or cost" puzzle
          built from a resource that changes its behaviour partway through.

  - node: quant-puzzles.classics.bridge-crossing
    hook: >
      The instinctive plan — let the fastest person ferry everyone else
      across one at a time — is a trap that costs extra minutes here, and the
      interviewer is watching for whether you notice before committing to it.
    explanation: >
      The naive plan pays for the two slowest people separately, once each,
      as they cross alone with an escort. The fix is a rate-phase reframe:
      instead of asking who escorts whom, ask how many times you have to pay
      for your slowest people, and whether you can pay for both at once.
      Sending the two slowest across together in the same trip pays their
      cost exactly once — the price of that trip is set by whichever of the
      two is slower, not by adding both times.

      That saving isn't free: pairing the two slow people together requires
      the torch to already be on their side and to get back afterward, which
      costs two extra fast round trips. The trade is worth it exactly when the
      second-slowest person's solo crossing cost exceeds what those extra fast
      trips cost — true whenever the two slow times are large next to the fast
      ones.

      The optimality argument mirrors the rate-and-phase lower bound
      directly: whichever single crossing carries the slowest person either
      carries the second-slowest along too, paying for both at once, or it
      doesn't, forcing a separate crossing — and the second structure is
      provably worse whenever the fast pair is cheap enough to shuttle twice.
    worked: >
      Crossing times $1, 2, 8, 9$ minutes. Fastest-ferries-everyone:
      $2+1+8+1+9=21$ minutes. Pairing the two slowest: the two fastest cross
      first ($2$), the fastest returns ($1$), the two slowest cross together
      ($9$), the second-fastest returns ($2$), the two fastest cross again
      ($2$) — total $2+1+9+2+2=16$ minutes, five minutes faster than the
      naive plan.
    interview: >
      Expect the numbers to be swapped in, or the party size to grow to five
      or six — the same pairing logic extends, but the optimal grouping among
      more than two slow people needs checking case by case rather than a
      single formula.
    pitfalls: >
      Assuming the fastest person should personally escort every crossing
      overlooks that the point isn't who's fastest, it's how many times the
      slow times get paid. Sending the two slowest across in separate trips
      rather than together is the single most common suboptimal choice, even
      when candidates correctly identify that the fast pair should shuttle
      the torch.
    recap: >
      Pair the two slowest people into one crossing so their cost is paid
      once, not twice — the same reframe that generalizes to any four
      crossing times.
    steps:
      - teach: >
          The naive plan — the fastest person escorts everyone else across
          one at a time — pays for the two slowest people separately, once
          each, as they cross alone with an escort.
      - teach: >
          The fix pays for both slowest crossers once: send them across
          together in the same trip, at a cost set by whichever of the two is
          slower. That saving isn't free — pairing them requires the torch to
          reach their side and return, costing two extra fast round trips.
      - ask: >
          Four people cross with times $2, 4, 15, 20$ minutes. What is the
          minimum total crossing time, in minutes?
        expects: "34"
        hint: >
          Send the two fastest across, return the fastest, send the two
          slowest across together, return the second-fastest, send the two
          fastest across again.
        feedback: >
          $2$ and $4$ cross ($4$), $2$ returns ($2$), $15$ and $20$ cross
          together ($20$), $4$ returns ($4$), $2$ and $4$ cross again ($4$):
          $4+2+20+4+4=34$ minutes.
      - teach: >
          The optimality argument mirrors the reframe directly: whichever
          single crossing carries the slowest person either carries the
          second-slowest along too, paying for both at once, or it doesn't,
          forcing a separate crossing that is worse whenever the fast pair is
          cheap enough to shuttle twice.
      - ask: >
          Four people with crossing times $t_1<t_2<t_3<t_4$ want the
          guaranteed minimum total time. Which single change to the
          fastest-escorts-everyone plan achieves it?
        choices:
          - text: >
              Have the second-fastest, not the fastest, do all the returning
            feedback: >
              This doesn't address the real cost driver, which is how many
              times the two slow crossing times get paid for.
          - text: >
              Send the two slowest across together in one crossing, paying
              their cost once
            correct: true
            feedback: >
              Right — pairing the two slowest pays $t_4$ (or $t_3$, whichever
              structure is cheaper) once instead of paying for two separate
              slow crossings.
          - text: >
              Have the two slowest cross separately, each escorted by the
              fastest
            feedback: >
              That is exactly the naive plan's structure, which pays for both
              slow crossings separately.
          - text: >
              Send the fastest and the slowest across first
            feedback: >
              Pairing the fastest with the slowest wastes the fast person's
              speed on the crossing that costs the most either way — the slow
              time still gets paid in full.
        feedback: >
          Pay for the two slowest people once, together, rather than twice,
          separately — the fast pair's extra shuttling is worth its cost
          whenever the slow times are large next to the fast ones.
      - ask: >
          Four people cross with times $5, 8, 25, 30$ minutes. What is the
          minimum total crossing time, in minutes?
        expects: "59"
        hint: >
          Use the same pairing plan: fast pair over, fastest back, slow pair
          over together, second-fastest back, fast pair over again.
        feedback: >
          $5$ and $8$ cross ($8$), $5$ returns ($5$), $25$ and $30$ cross
          together ($30$), $8$ returns ($8$), $5$ and $8$ cross again ($8$):
          $8+5+30+8+8=59$ minutes.
      - teach: >
          The same reframe extends to a larger party, though with more than
          four people the best grouping among the slow crossers needs
          checking case by case rather than a single formula.

  - node: quant-puzzles.classics.camel-bananas
    hook: >
      The answer isn't a single division — the cost per mile itself falls in
      steps as the pile shrinks, and missing a threshold crossing is the
      single most common way to get this puzzle's number wrong.
    explanation: >
      Treat the banana stock as the state variable that sets the rate. Moving
      the entire stock forward one mile needs $\lceil \text{stock} /
      \text{capacity} \rceil$ loaded trips and one fewer return trip, since
      the final forward trip never needs to come back, so the cost is
      $2\lceil \text{stock}/\text{capacity}\rceil - 1$ bananas per mile. That
      cost only changes at the exact miles where the stock crosses a multiple
      of the capacity, so those crossings are the phase boundaries, and
      everywhere between them the rate is constant.

      The number of phases scales with how many multiples of the capacity the
      starting stock exceeds — a stock more than twice the capacity needs an
      expensive first phase, a cheaper middle phase once it's below twice
      capacity, and a final, cheapest phase once it's down to a single load.
      A larger starting stock relative to capacity just adds more phases at
      the top, each cheaper than the last.

      Within any one phase, the arithmetic is just distance covered equals
      bananas burned divided by that phase's per-mile rate — the same rate
      bookkeeping as any other rate-and-phase puzzle, just with a resource
      pile instead of a clock.
    worked: >
      $2000$ bananas, capacity $1000$, target only $400$ miles. The stock
      starts inside the three-bananas-per-mile phase (between $1000$ and
      $2000$) and stays there until it burns down to $1000$, which takes
      $(2000-1000)/3 \approx 333.33$ miles. The remaining
      $400-333.33\approx 66.67$ miles are covered at one banana per mile,
      burning $66.67$ more bananas. Delivered at mile $400$:
      $1000-66.67 \approx 933.33$ bananas.
    interview: >
      A common extension asks for the largest distance reachable at all with
      a given stock and capacity, or how many phases a stock of several
      capacities' worth requires — the pattern is one phase per multiple of
      capacity the stock starts above, each cheaper than the last.
    pitfalls: >
      Using $2\lceil \text{stock}/\text{capacity}\rceil$ instead of
      subtracting the one saved return trip overcounts every phase's cost by
      one trip's worth. Applying a single phase's rate across the whole
      journey, without checking whether the stock crosses a capacity
      threshold partway through, silently uses the wrong constant for part of
      the distance.
    recap: >
      The cost per mile is $2\lceil \text{stock}/\text{capacity}\rceil - 1$
      bananas, constant within each capacity-multiple band and cheaper in
      every band below it — sum distance covered phase by phase until the
      stock or the distance runs out.
    steps:
      - teach: >
          Treat the banana stock as the state variable that sets the rate.
          Moving the entire stock forward one mile needs
          $\lceil \text{stock}/\text{capacity} \rceil$ loaded trips and one
          fewer return trip, since the final forward trip never needs to come
          back, giving a cost of $2\lceil \text{stock}/\text{capacity}\rceil -
          1$ bananas per mile.
      - teach: >
          That cost only changes at the exact miles where the stock crosses a
          multiple of the capacity, so those crossings are the phase
          boundaries. Everywhere between two crossings the rate is constant,
          and each phase is cheaper than the one before it.
      - ask: >
          A camel starts with $3000$ bananas, carries at most $1000$ at a
          time, and eats one banana per mile in either direction. How many
          bananas remain after $250$ miles?
        expects: "1850"
        hint: >
          The stock starts above $2000$, so find how many miles it takes to
          burn down to $2000$ before switching rates.
        feedback: >
          Phase one (stock above $2000$, rate $5$/mile) burns $1000$ bananas
          to reach stock $2000$, covering $1000/5=200$ miles. The remaining
          $250-200=50$ miles fall in phase two (rate $3$/mile), burning
          $3 \times 50=150$ bananas. Total burned: $1000+150=1150$, so
          $3000-1150=1850$ bananas remain.
      - teach: >
          Within any one phase the bookkeeping is simple: distance covered
          equals bananas burned divided by that phase's own rate — the same
          rate accounting as any other rate-and-phase puzzle, just tracking a
          resource pile instead of a clock.
      - ask: >
          A camel starts with $2500$ bananas, carries at most $1000$ at a
          time, and eats one banana per mile in either direction. How many
          bananas remain after $400$ miles?
        expects: "1100"
        hint: >
          The stock starts above $2000$; find the mile where it drops to
          $2000$ before switching to the next phase's rate.
        feedback: >
          Phase one (stock above $2000$, rate $5$/mile) burns $500$ bananas
          to reach stock $2000$, covering $500/5=100$ miles. The remaining
          $400-100=300$ miles fall in phase two (rate $3$/mile, and $300$
          miles is well under the $1000/3$ miles that phase can cover),
          burning $3 \times 300=900$ bananas. Total burned:
          $500+900=1400$, so $2500-1400=1100$ bananas remain.
      - ask: >
          Which mistake most commonly produces a wrong delivered-banana
          count in this puzzle?
        choices:
          - text: >
              Applying one phase's per-mile rate across the whole journey
              without checking whether the stock crosses a capacity threshold
              partway through
            correct: true
            feedback: >
              Right — missing a threshold crossing silently uses the wrong
              constant rate for part of the distance.
          - text: >
              Using $2\lceil \text{stock}/\text{capacity}\rceil$ bananas per
              mile, without subtracting the one saved return trip
            feedback: >
              This overcounts every phase's cost by one trip's worth, since
              the final forward trip in a phase never needs to come back.
          - text: >
              Recomputing the rate only once the stock drops to a single
              load, rather than at every capacity multiple it crosses
            feedback: >
              The rate changes at every multiple of the capacity the stock
              crosses, not just at the final one-load threshold — skipping an
              earlier crossing misprices that whole phase.
        feedback: >
          The number of phases scales with how many multiples of the capacity
          the starting stock exceeds; skipping a threshold crossing is the
          single most common way to misprice a phase.
      - teach: >
          A larger starting stock relative to capacity just adds more phases
          at the top of the trip, each one cheaper than the last, until the
          stock drops to a single load and the rate falls to one banana per
          mile.

  - node: quant-puzzles.classics.fuses
    hook: >
      The whole puzzle turns on one fact worth having ready cold — lighting a
      fuse at both ends always halves its total burn time, no matter how
      unevenly it burns — and the rest is just applying that fact twice.
    explanation: >
      A fuse lit from one end has a well-defined total burn time $T$ purely
      by definition — however uneven its rate along the length, "burns for
      $T$ minutes from one end" is just what $T$ means. Lighting it from both
      ends at once puts two flame fronts consuming the same total length
      between them, and because they advance concurrently from opposite
      directions, they must meet at exactly $T/2$: any uneven segment slowing
      one front down is being attacked from the other direction too, so the
      irregular rate cancels out of the meeting time even though it doesn't
      cancel out of where the two fronts physically meet.

      The same fact applies recursively to any unburned remainder, not just a
      whole fresh fuse — a partially-burned stretch, considered on its own,
      still has a well-defined remaining one-end burn time, and lighting its
      free end while it's already burning from the other end again halves
      whatever time was left. Chaining this twice is exactly the classic
      trick: burn one fuse from both ends to measure $T/2$, then use that
      elapsed time to identify how much single-end time remains on a second
      fuse, then halve that remainder too.

      This is the rate-and-phase idea in a different costume: burning both
      ends is a rate change, doubling the consumption rate for as long as
      it's applied, and choosing when to apply it is choosing a phase
      boundary exactly as in the bridge or camel puzzles.
    worked: >
      Two fresh $40$-minute fuses, measure $30$ minutes. Light fuse A at both
      ends and fuse B at one end at time $0$. A finishes at $t=20$ (half of
      $40$), at which point B — burning normally the whole time — has
      $40-20=20$ minutes of single-end burn time left. Light B's free end
      now: its remaining stretch finishes in half of that remaining time,
      $10$ more minutes, landing at $t=20+10=30$ — exactly the target, and
      $3/4$ of the original $40$.
    interview: >
      Expect the fuse lengths to change so the target is some other multiple
      of a quarter of the total time — the technique always lands on $T/2$
      after the first both-ends burn and $3T/4$ after the second, so a target
      that isn't a quarter-fraction of the fuse length signals you need a
      third fuse or a different combination.
    pitfalls: >
      Conflating "half the elapsed clock time so far" with "half of a fuse's
      own remaining burn time" causes errors once more than one fuse is in
      play — the halving fact is always about a fuse's own total or remaining
      time. Relighting the end that's already burning, instead of the fuse's
      unlit free end, doesn't create a second flame front and doesn't halve
      anything.
    recap: >
      Lighting a fuse at both ends always consumes it in exactly half its
      normal single-end time regardless of profile, and applying that fact
      twice reaches $45$ minutes from two $60$-minute fuses, or $30$ from two
      $40$-minute ones.
    steps:
      - teach: >
          A fuse lit from one end has a well-defined total burn time $T$ by
          definition, however unevenly it burns along its length. Lighting it
          from both ends puts two flame fronts consuming the same length
          between them, and they must meet at exactly $T/2$: an uneven
          segment slowing one front is being attacked from the other
          direction too.
      - teach: >
          The same fact applies recursively to any unburned remainder, not
          just a fresh fuse. A partially-burned stretch still has a
          well-defined remaining one-end burn time, and lighting its free end
          while it is already burning from the other end halves whatever time
          was left.
      - ask: >
          Two fresh $24$-minute fuses. Light one at both ends and the other
          at one end, both at time $0$; the moment the first fuse finishes,
          light the second fuse's remaining free end. At what time does the
          second fuse finish?
        expects: "18"
        hint: >
          The first fuse finishes at half its total time; find how much
          single-end time the second fuse has left at that moment, then halve
          it.
        feedback: >
          The both-ends fuse finishes at $24/2=12$ minutes. The one-end fuse
          has $24-12=12$ minutes of single-end burn time left; lighting its
          free end halves that to $6$ more minutes, landing at $12+6=18$.
      - teach: >
          This is the rate-and-phase idea in a different costume: burning
          both ends doubles the consumption rate for as long as it is
          applied, and choosing when to apply it is choosing a phase
          boundary, exactly as in the bridge or camel puzzles.
      - ask: >
          At the moment a both-ends-lit fuse finishes burning, the other
          fresh fuse (lit at one end from the same start time) still has
          unburned length left. What should happen next to keep measuring
          time with this trick?
        choices:
          - text: >
              Light that fuse's still-unlit free end now, halving whatever
              single-end time it has left
            correct: true
            feedback: >
              Right — this is the second application of the halving fact,
              and it is what produces the target time.
          - text: >
              Light the end of that fuse that is already burning
            feedback: >
              Relighting the end already on fire creates no second flame
              front and halves nothing.
          - text: >
              Wait until that fuse finishes burning from its one lit end
              before doing anything else
            feedback: >
              That abandons the trick — the whole point is to intervene
              before the fuse finishes, so its *remaining* time gets halved.
          - text: >
              Relight the first fuse, which has just finished
            feedback: >
              The first fuse is fully consumed; the technique now needs
              action on the second fuse's unlit end.
        feedback: >
          Light the unlit free end of whichever fuse is still burning from
          one end — that is the second halving, and it is what lands on the
          target time.
      - ask: >
          Using two fresh, equal-length fuses and this two-step trick
          (both-ends burn, then halve the remainder), what must each fuse's
          full one-end burn time be to measure exactly $21$ minutes?
        expects: "28"
        hint: >
          The trick always lands at three-quarters of a fuse's total time
          after the second halving.
        feedback: >
          The technique reaches $3T/4$, so $3T/4=21$ gives $T=28$ minutes:
          check, $T/2=14$, remaining $28-14=14$, halved to $7$, landing at
          $14+7=21$.
      - teach: >
          Confusing "half the elapsed clock time so far" with "half of a
          fuse's own remaining burn time" is the error to guard against once
          more than one fuse is in play — the halving fact is always about a
          fuse's own total or remaining time, never the clock.

  - node: quant-puzzles.classics.protocol-design
    hook: >
      Every "no communication after this point" puzzle is secretly the same
      design problem — build every player's action off one shared public
      statistic — and recognising that shape immediately is worth more than
      knowing any single puzzle's answer.
    explanation: >
      These puzzles share a rigid shape: the players agree a strategy while
      still together, are then separated, and each must act using only their
      own private observation plus whatever was agreed in advance. That makes
      each player's action a fixed, pre-committed function of their private
      view — nothing adaptive can happen once the private observations are
      revealed, since there's no channel left to be clever through.

      The design goal that actually matters is almost never "make each
      individual more likely to be right" — for many of these puzzles that
      number is fixed by symmetry and can't be moved. The goal instead is to
      make the players' mistakes coincide rather than scatter: independent
      guessers each fail independently, so a group succeeds only with the
      product of each person's success chance, which collapses fast;
      correlated guessers can be arranged so the wrongness concentrates onto a
      single predictable player or event, rather than spreading across the
      group.

      The recipe is to find some function of the full joint configuration — a
      parity, a residue, a count, a signal one designated player controls —
      that each individual can approximately reconstruct from their own
      private view plus the agreed rule, and have every player act as if that
      shared statistic is exactly true. When it holds for everyone
      simultaneously, correctness is a shared event, not many separate coin
      flips.
    worked: >
      Two prisoners, each seeing only the other's hat colour, must
      simultaneously guess their own. Agree: player one guesses the same
      colour they see, player two guesses the opposite. Checking all four hat
      combinations: whenever the hats match, player one guesses correctly
      (seeing the same colour as their own hat); whenever the hats differ,
      player two guesses correctly (the opposite of what they see is exactly
      their own hat). Every combination has at least one correct guess, even
      though each player alone is still right only half the time.
    interview: >
      The tell is a phrase like "design a strategy so that at least one of
      you is right" or "so that all but one of you survive" — the
      interviewer is checking whether you reach for correlating errors
      immediately, rather than trying to make each individual's private
      reasoning better, which for most of these puzzles is a dead end.
    pitfalls: >
      Spending effort trying to improve any one player's individual odds, when
      the structure of the puzzle fixes that number by symmetry no matter the
      strategy, wastes time that should go into the correlation design
      instead. Assuming any real-time signalling is available during the
      separated phase, beyond what the puzzle explicitly grants, breaks the
      whole premise these puzzles are built on.
    recap: >
      Pre-agreed protocols win by correlating who's wrong, not by improving
      anyone's individual chance — every scheme in this family reduces to
      finding one shared statistic every player can act on.
    steps:
      - teach: >
          These puzzles share a rigid shape: the players agree a strategy
          while still together, are then separated, and each acts using only
          a private observation plus whatever was agreed in advance — nothing
          adaptive can happen once separation begins.
      - teach: >
          The design goal is almost never to raise any individual player's
          own chance of being right, since that number is often fixed by
          symmetry no matter the strategy. The goal instead is to make the
          players' mistakes coincide rather than scatter.
      - ask: >
          Ten players each guess independently, with each individual guess
          correct with probability $1/2$. What is the probability that all
          ten guesses are correct at once?
        expects: "1/1024"
        hint: >
          Independent successes multiply.
        feedback: >
          $(1/2)^{10} = 1/1024$ — independent guessers fail independently, so
          the joint success chance collapses to the product of ten small
          chances.
      - teach: >
          The recipe: find some function of the full joint configuration — a
          parity, a residue, a signal one designated player controls — that
          each individual can approximately reconstruct from their own
          private view plus the agreed rule, and have every player act as if
          that shared statistic is exactly true.
      - ask: >
          A team will each act on a private observation with no further
          communication once separated. Which goal should the pre-agreed
          strategy pursue?
        choices:
          - text: >
              Maximize each individual player's own probability of guessing
              correctly
            feedback: >
              For many of these puzzles that number is fixed by symmetry and
              cannot be moved — chasing it wastes the design effort.
          - text: >
              Make the players' mistakes coincide, concentrating failure into
              as few scenarios as possible
            correct: true
            feedback: >
              Right — correlating errors is what turns many independent low
              chances into one manageable failure event.
          - text: >
              Allow players to signal covertly beyond what the puzzle
              explicitly grants
            feedback: >
              That breaks the whole premise these puzzles are built on — no
              channel is available once the private observations are
              revealed.
          - text: >
              Have every player guess completely independently of the others
            feedback: >
              Independent guessers fail independently, and the joint success
              probability collapses to the product of each person's
              individually small chance.
        feedback: >
          Correctness becomes a shared event, not many separate coin flips,
          exactly when every player's action is built off the same reasoning
          rather than their own isolated guess.
      - ask: >
          A pre-agreed strategy correlates every player's error into a single
          shared failure scenario that occurs with probability $1/8$, while
          each individual player's own accuracy stays exactly $1/2$. What is
          the joint probability that every player answers correctly?
        expects: "7/8"
        hint: >
          The design makes the shared scenario the only way the group fails.
        feedback: >
          If the shared bad scenario is the only failure mode, the group
          succeeds whenever it doesn't occur: $1 - 1/8 = 7/8$ — far higher
          than the product of individually-$1/2$ chances would give.
      - teach: >
          Correctness for the whole group is a single chain built on one
          shared statistic, unbroken as long as that statistic is
          transmitted and used correctly — not a pile of independent coin
          flips that all happen to land right.

  - node: quant-puzzles.classics.hat-parity
    hook: >
      The rearmost prisoner's job is to spend his own life broadcasting one
      bit of parity, and the interviewer wants to see you name that trade
      explicitly, not just recite the announce-and-decode mechanics.
    explanation: >
      The rearmost prisoner sees every hat ahead of him and nothing else, so
      he's the only one with enough information to compute a global parity of
      the whole line — the number of black hats among everyone in front of
      him, reduced mod $2$. He announces that parity directly as a colour
      word, spending his own guess on pure noise with respect to his own hat.
      That's exactly why he only survives with probability $1/2$: whether the
      announced parity happens to also match his own hat colour is
      essentially a coin flip.

      Every later prisoner recovers his own hat by combining three things:
      the original announced parity, the hats he can see ahead of himself,
      and the true colours of everyone already correctly identified behind
      him, trustworthy by induction since every prisoner after the first is
      proven correct. Whatever parity is missing once those known pieces are
      accounted for must be supplied by his own hat, which pins it exactly.

      This is protocol design's shared-statistic idea in its cleanest form:
      parity is the one bit every subsequent prisoner can reconstruct from
      public information plus what he personally sees, so correctness for the
      rest of the line is not many independent coin flips — it's a single
      chain, unbroken as long as the first transmission and every following
      deduction are correct.
    worked: >
      Three prisoners in a line, hats front to back $B, W, W$. The rearmost
      (hat $W$) sees $B, W$ ahead — one black, odd — and announces "black."
      The middle prisoner hears "black," sees $B$ ahead of himself, so his own
      hat must contribute zero more blacks to keep the count at one: he
      guesses white, correctly. The front prisoner hears "black," knows the
      middle prisoner's hat is white from the correct guess just made, sees
      nothing ahead, so his own hat must supply the missing black: he guesses
      black, correctly. Two of three survive with certainty; the rearmost's
      own guess of "black" happens to be wrong here, since his real hat was
      white — the expected number saved is $n-1/2 = 2.5$.
    interview: >
      A frequent twist swaps which end goes first — starting from the front
      instead of the back breaks the scheme immediately, since the front
      prisoner sees nobody and has no parity to broadcast, so listen for
      which end announces before you commit to a direction.
    pitfalls: >
      Confusing which direction "ahead" points is fatal to the whole scheme:
      the announcer must be the one with maximal visibility, not minimal.
      Losing track of exactly one prisoner's correctly-deduced hat colour
      breaks every deduction behind that point in the chain, since each guess
      depends on all previously revealed colours being right, not just the
      original broadcast parity.
    recap: >
      One sacrificed parity bit from the prisoner who sees everyone else
      saves the remaining $n-1$ with certainty, for an expected total of
      $n-1/2$ survivors.
    steps:
      - teach: >
          The rearmost prisoner sees every hat ahead of him and nothing else,
          so he is the only one able to compute a global parity of the whole
          line ahead. He announces that parity directly as a colour word,
          spending his own guess on pure noise with respect to his own hat.
      - teach: >
          Every later prisoner recovers his own hat from three things: the
          originally announced parity, the hats he can see ahead of himself,
          and the true colours of everyone already correctly identified
          behind him — trustworthy by induction, since each prisoner after
          the first is proven correct.
      - ask: >
          Four prisoners stand in a line, hats front to back $B, B, W, B$.
          The rearmost prisoner announces "black" if he sees an odd number of
          black hats ahead of him and "white" otherwise, and every later
          prisoner deduces his own hat from that announcement plus what he
          can see and what has already been correctly deduced. How many of
          the four prisoners guess correctly?
        expects: "3"
        hint: >
          Work out the announcement first, then deduce each hat starting
          with the prisoner just ahead of the rearmost and moving forward
          toward the front of the line.
        feedback: >
          The rearmost sees $B,B,W$ ahead — two blacks, even — and announces
          "white." Each later prisoner then deduces correctly: the third
          prisoner (white), the second (black), and the first (black) all
          match their true hats. The rearmost's own announced colour,
          "white," does not match his true hat, black, so exactly $3$ of the
          $4$ prisoners are correct.
      - teach: >
          This is protocol design's shared-statistic idea in its cleanest
          form: parity is the one bit every subsequent prisoner can
          reconstruct from public information plus what he personally sees,
          turning the rest of the line into a single unbroken chain of
          correct deductions.
      - ask: >
          In a hat-parity line of prisoners, which prisoner should announce
          the parity signal?
        choices:
          - text: >
              The frontmost prisoner, since he goes first in the line
            feedback: >
              The frontmost prisoner sees no one else's hat and has no
              parity to compute — he has minimal, not maximal, visibility.
          - text: >
              The rearmost prisoner, since he sees every other hat and can
              compute a genuine global parity
            correct: true
            feedback: >
              Right — only the prisoner with maximal visibility can compute
              the parity everyone else needs.
          - text: >
              Whichever prisoner is told to go first, regardless of position
            feedback: >
              The scheme depends on the announcer having maximal visibility,
              not merely on being first to speak.
          - text: >
              The prisoner in the middle of the line, splitting visibility
              evenly
            feedback: >
              A middle prisoner sees only part of the line and cannot compute
              the parity of everyone else.
        feedback: >
          The announcer must be whoever can see the whole line ahead — the
          rearmost prisoner — since the scheme depends on a genuinely global
          parity, not a partial one.
      - ask: >
          With $5$ prisoners using the standard parity scheme, what is the
          expected number of survivors?
        expects: "4.5"
        hint: >
          Everyone but the announcer survives with certainty; the announcer's
          own guess is a coin flip.
        feedback: >
          $n-1=4$ survive with certainty, and the announcer survives with
          probability $1/2$, giving an expected total of $4+0.5=4.5$.
      - teach: >
          Losing track of exactly one prisoner's correctly-deduced hat colour
          breaks every deduction behind that point in the chain, since each
          guess depends on all previously revealed colours being right, not
          just the original broadcast parity.

  - node: quant-puzzles.classics.hat-mod-n
    hook: >
      Making everyone guess at once, with no order to lean on, forces a
      completely different trick than sacrificing one announcer — mixing the
      two up mid-interview is the fastest way to stall.
    explanation: >
      With simultaneous guessing there's no "first mover" who can broadcast a
      bit for everyone else to decode, so no one can sacrifice themselves the
      way the line puzzle's rearmost prisoner does. The fix is to have every
      prisoner bet on a different value instead: label the colours $0$
      through $n-1$, and have prisoner $i$ assume the hat-colour total,
      summed mod $n$, equals $i$, then compute what his own hat would have to
      be for that to hold, given what he can see of everyone else's.

      The true sum has exactly one residue mod $n$, so exactly one prisoner's
      assumption is correct, and that prisoner's computed guess is
      automatically right too — the others', built on a false assumed total,
      are automatically wrong. Guaranteeing "at least one correct" no longer
      needs anyone to broadcast anything; it's built into the fact that $n$
      people betting on $n$ different residues necessarily cover the one
      that's actually true.

      Individually, each prisoner is still only right with probability $1/n$,
      exactly what a blind guess would achieve. What the protocol buys is not
      individual accuracy but the guarantee that the $n$ individual failures
      can never all occur together, since one of the $n$ mutually exclusive
      assumed totals must hold.
    worked: >
      Three prisoners, colours labelled $0,1,2$; true hats $h_0=1, h_1=2,
      h_2=0$, summing to $3 \equiv 0 \pmod 3$. Prisoner $0$ assumes the total
      is $0$: seeing $h_1+h_2=2$, he guesses $g_0 = 0-2 \equiv 1 \pmod 3$ —
      correct. Prisoner $1$ assumes the total is $1$: seeing $h_0+h_2=1$, he
      guesses $g_1=1-1=0$ — wrong. Prisoner $2$ assumes the total is $2$:
      seeing $h_0+h_1=3 \equiv 0$, he guesses $g_2=2-0=2$ — wrong. Exactly
      prisoner $0$ is right, matching the true residue $0$.
    interview: >
      A standard follow-up asks what happens if the number of prisoners
      doesn't match the number of colours — the scheme needs exactly $n$
      prisoners for $n$ colours, since it relies on the $n$ assumed residues
      exactly covering every value once each; naming that limitation
      unprompted reads as understanding rather than memorisation.
    pitfalls: >
      Assuming more than one prisoner can be correct in a favourable
      configuration is a common misreading — the structure guarantees exactly
      one correct guess in every configuration, never zero and never more
      than one. Applying the scheme when prisoner count and colour count
      differ silently breaks the residue-covering argument the guarantee
      depends on.
    recap: >
      Each prisoner bets on a distinct residue of the hat total mod $n$;
      exactly one bet matches the true total, guaranteeing one correct guess
      from $n$ individually-blind ones.
    steps:
      - teach: >
          Simultaneous guessing removes the "first mover" who could broadcast
          a bit for everyone else to decode. The fix is to have every
          prisoner bet on a different value instead: label the colours
          $0,\ldots,n-1$, and have prisoner $i$ assume the hat total, mod
          $n$, equals $i$.
      - teach: >
          Prisoner $i$ computes what his own hat would have to be for that
          assumption to hold, given everyone else's hats:
          $g_i \equiv i - \sum_{j \ne i} h_j \pmod n$. The true sum has
          exactly one residue, so exactly one prisoner's assumption is
          correct, and that prisoner's guess is automatically right too.
      - ask: >
          Four prisoners, colours labelled $0,1,2,3$. Hats are $h_0=2$,
          $h_1=0$, $h_2=3$, $h_3=1$. Using the assumed-total protocol, which
          prisoner's guess is correct?
        expects: "2"
        hint: >
          Find the true sum's residue mod $4$ — that residue names the
          correct prisoner.
        feedback: >
          The true total is $2+0+3+1=6 \equiv 2 \pmod 4$, so prisoner $2$,
          who assumed the total was $2$, is the one whose computed guess
          matches his real hat.
      - teach: >
          Individually, each prisoner is still only right with probability
          $1/n$, exactly what a blind guess would achieve. The protocol buys
          not individual accuracy but the guarantee that the $n$ individual
          failures can never all occur together.
      - ask: >
          With the same hats, $h_0=2$, $h_1=0$, $h_2=3$, $h_3=1$ over
          colours $0,1,2,3$, what value does prisoner $1$ guess for his own
          hat under the assumed-total protocol?
        expects: "3"
        hint: >
          Compute $g_1 \equiv 1 - (h_0+h_2+h_3) \pmod 4$.
        feedback: >
          $g_1 \equiv 1 - (2+3+1) = 1-6 = -5 \equiv 3 \pmod 4$. His true hat
          is $0$, so this guess is wrong — consistent with only prisoner $2$
          being correct in this configuration.
      - ask: >
          The protocol guarantees exactly one correct guess when the number
          of prisoners equals the number of colour labels. Four prisoners
          instead use only three colours, $0,1,2$, with three of them
          assuming totals $0$, $1$, $2$ and the fourth left without a
          distinct residue to claim. What happens to the guarantee?
        choices:
          - text: >
              It breaks: with only three assumed residues covering four
              prisoners, at least one residue is left unclaimed or claimed
              twice, so "someone is always right" is no longer guaranteed
            correct: true
            feedback: >
              Right — the guarantee depends on the assumed residues exactly
              covering every possible value of the true sum, once each.
          - text: >
              Nothing changes, since the true sum still has exactly one
              residue mod $3$
            feedback: >
              The true sum having one residue only helps if every possible
              residue is claimed by exactly one prisoner, which fails once
              prisoner count and colour count differ.
          - text: >
              The scheme still works, but two prisoners are always correct
              instead of one
            feedback: >
              Mismatched counts break the one-to-one correspondence entirely
              — there is no guarantee of exactly two correct either.
        feedback: >
          The scheme needs exactly $n$ prisoners for $n$ colours, since it
          relies on the $n$ assumed residues exactly covering every value
          once each.
      - teach: >
          Naming this limitation unprompted — that the count of prisoners
          must match the count of colours — reads as understanding the
          mechanism rather than having memorised the answer.

  - node: quant-puzzles.classics.light-bulb
    hook: >
      The correctness of this protocol is exact and easy to see; the part
      worth rehearsing is the timing argument, since the interviewer's real
      question is almost always how long this takes, roughly.
    explanation: >
      Correctness rests on giving exactly one prisoner a bookkeeping role no
      one else touches: every non-counter turns the lamp on only the first
      time they ever find it off, and never touches it again; the counter is
      the only one who ever turns it off, incrementing a private tally each
      time. Because each of the other prisoners contributes exactly one
      on-switch over the whole process, the counter's tally reaching that
      exact number is a certainty, not a probabilistic near-guarantee.

      Timing has two separate components that need to be added, not
      conflated. With $j$ non-counters still to signal, the expected wait
      until one of them finds the lamp off is roughly $n/j$ days, since only
      about $j$ of the $n$ prisoners are still "live" signalers. Once a signal
      is waiting to be cleared, the expected wait for the counter specifically
      to be drawn next is $n$ days, since the counter is just one prisoner
      among $n$ chosen uniformly at random.

      The counter's own waits dominate the total: there are $n-1$ of them,
      each costing $n$ days in expectation, for $n(n-1)$ days total, while the
      signalers' waits sum to only $n H_{n-1}$, a harmonic sum that grows far
      more slowly. Almost the entire multi-year duration is spent waiting for
      the counter specifically to be drawn next, not waiting for a signal to
      be ready.
    worked: >
      Fifty prisoners instead of a hundred, same rules. Total expected days
      is $n(n-1) + n H_{n-1}$ with $n=50$: the counter-wait term is
      $50 \cdot 49=2450$ days, and the signal-wait term is
      $50 H_{49} \approx 50 \times 4.479 \approx 224$ days, for a total of
      about $2674$ days, roughly $7.3$ years — noticeably shorter than the
      hundred-prisoner version's $28$ years, since both terms shrink with $n$.
    interview: >
      A frequent extension asks whether two counters could split the work to
      go faster — they can't safely, since simultaneous clearing risks a
      double count or a missed signal with no way for either counter to know
      the other's tally, so the design needs exactly one prisoner in that
      role.
    pitfalls: >
      Letting more than one prisoner turn the lamp off breaks the exact-count
      guarantee outright — the counter's tally is only trustworthy because no
      one else ever touches the switch in that direction. Treating the
      $n(n-1)$ and $n H_{n-1}$ terms as comparable in size misses that the
      counter-wait term dominates almost entirely once $n$ is more than a
      handful.
    recap: >
      One designated counter and a one-shot signal per prisoner make the
      count exact, at an expected cost of $n(n-1)+nH_{n-1}$ days, dominated
      by the counter's $n-1$ waits of $n$ days each.
    steps:
      - teach: >
          Correctness rests on giving exactly one prisoner a bookkeeping role
          no one else touches: every non-counter turns the lamp on only the
          first time he ever finds it off, and never touches it again; the
          counter is the only one who ever turns it off, tallying once per
          clear.
      - teach: >
          Timing has two separate components that add rather than conflate:
          with $j$ non-counters still to signal, the expected wait for one of
          them to find the lamp off is roughly $n/j$ days, and once a signal
          is waiting, the expected wait for the counter specifically to be
          drawn next is $n$ days.
      - ask: >
          With $n=20$ prisoners, what is the counter-wait component alone,
          $n(n-1)$ days?
        expects: "380"
        hint: >
          There are $n-1$ waits of $n$ days each for the counter to be drawn.
        feedback: >
          $n(n-1) = 20 \times 19 = 380$ days.
      - teach: >
          The counter's own waits dominate the total: there are $n-1$ of
          them, each costing $n$ days in expectation, while the signalers'
          waits sum to only $nH_{n-1}$, a harmonic sum that grows far more
          slowly.
      - ask: >
          With $n=5$ prisoners, what is the total expected number of days,
          $n(n-1) + nH_{n-1}$?
        expects: "30.42"
        tolerance: 0.01
        hint: >
          Compute $H_4 = 1+1/2+1/3+1/4$ first, then combine both terms.
        feedback: >
          $H_4 = 1+0.5+0.333+0.25 = 2.0833$. $n(n-1)=5 \times 4=20$ and
          $nH_{n-1} = 5 \times 2.0833 = 10.417$, giving a total of
          $20+10.417 \approx 30.42$ days.
      - ask: >
          Could using two designated counters instead of one speed up the
          process?
        choices:
          - text: >
              Yes — splitting the counting work in half roughly halves the
              expected duration
            feedback: >
              This doesn't work safely: two counters clearing signals
              independently can double-count a signal or miss one entirely,
              since neither knows the other's running tally.
          - text: >
              No — with two counters clearing signals independently, a
              signal can be double-counted or missed, since neither counter
              knows the other's running tally
            correct: true
            feedback: >
              Right — the exact-count guarantee depended on exactly one
              prisoner ever touching the lamp in the off direction.
          - text: >
              Yes, provided the two counters alternate which days they check
              the lamp
            feedback: >
              Alternating doesn't fix the coordination problem — correctness
              still needed exactly one prisoner ever turning the lamp off.
        feedback: >
          The design needs exactly one prisoner in the counting role, since
          two counters clearing the lamp with no way to share a tally breaks
          the exact-count guarantee outright.
      - teach: >
          The formula's two terms are not comparable in size once $n$ is more
          than a handful: the counter-wait term $n(n-1)$ grows quadratically
          and swamps the signal-wait term's much slower harmonic growth.

  - node: quant-puzzles.classics.prisoners-boxes
    hook: >
      The jump from vanishingly small to roughly one in three is the single
      most quoted number in this puzzle family, and the interviewer is
      testing whether you can explain why correlating the searches, not
      making any individual search smarter, is what buys it.
    explanation: >
      Independent random searching fails because each prisoner's success is
      its own coin flip, and a hundred independent flips of probability $1/2$
      succeed jointly with probability $2^{-100}$ — the protocol-design
      lesson that correlated failure beats independent failure applies here
      at its most dramatic scale. Cycle-following correlates every prisoner's
      search through the single hidden object they all share: the
      permutation itself.

      Prisoner $i$ opening box $i$, then the box named by whatever he finds,
      and repeating, is exactly walking the cycle of the permutation that
      contains $i$ — he finds his own name within the opening limit precisely
      when that cycle is short enough. Since every prisoner does this
      simultaneously against the same permutation, either every cycle is
      short enough and everyone succeeds together, or some cycle is too long
      and everyone whose name lives in it fails together — there's no
      in-between case where some searches are doomed independently of the
      others.

      At most one cycle can exceed the halfway length, because two disjoint
      cycles both longer than that would need more elements than the
      permutation has. That fact plus a direct count of how many permutations
      contain a $k$-cycle turns "does everyone succeed" into a single tail
      sum, $\sum_{k=51}^{100} 1/k = H_{100}-H_{50}$, for the failure
      probability.
    worked: >
      Eight prisoners, eight boxes, each opening four. Failure is "some cycle
      exceeds length four," with probability $\sum_{k=5}^{8} 1/k = H_8-H_4$.
      Numerically $H_8 \approx 2.7179$ and $H_4 \approx 2.0833$, so failure
      $\approx 0.6345$ and the escape probability is $\approx 0.3655$, about
      $36.5\%$ — noticeably higher than the eventual limit near $30.7\%$,
      since the harmonic tail approaches that limit only as the prisoner
      count grows large.
    interview: >
      A common variant changes how many boxes each prisoner opens relative to
      the total — opening more than half shifts the threshold in the tail sum
      and raises the escape probability; the interviewer is checking whether
      you re-derive the sum with the new threshold rather than reusing the
      memorised $31\%$.
    pitfalls: >
      Confusing "expected number of prisoners who find their own name"
      (always exactly half, by linearity, regardless of strategy) with
      "probability that everyone finds their name" (close to $31\%$ under the
      best strategy) is the most common conflation — these are genuinely
      different quantities and both get asked. Forgetting that at most one
      cycle can exceed the opening limit is what makes the tail-sum count
      exact rather than an overcount.
    recap: >
      Cycle-following turns a hundred coin flips into one shared event —
      does any cycle exceed length fifty — lifting the escape probability
      from $2^{-100}$ to about $31\%$.
    steps:
      - teach: >
          Independent random searching fails because each prisoner's success
          is its own coin flip, and a hundred independent flips of
          probability $1/2$ succeed jointly with probability $2^{-100}$ —
          correlated failure beats independent failure here at its most
          dramatic scale.
      - teach: >
          Cycle-following correlates every prisoner's search through the one
          hidden object they all share: prisoner $i$ opening box $i$, then
          the box named by whatever he finds, and repeating, is exactly
          walking the cycle of the permutation containing $i$. Either every
          cycle is short enough and everyone wins together, or some cycle is
          too long and everyone in it loses together.
      - ask: >
          Twelve prisoners, twelve boxes, each opening six. Failure is "some
          cycle exceeds length six," with probability
          $\sum_{k=7}^{12} 1/k = H_{12}-H_{6}$. What is the escape
          probability (the probability every prisoner finds his own name)?
        expects: "0.3468"
        tolerance: 0.0005
        hint: >
          Compute $H_{12}$ and $H_{6}$ separately, subtract, then take one
          minus that failure probability.
        feedback: >
          $H_{6} \approx 2.45$ and $H_{12} \approx 3.1032$, so failure
          $\approx 0.6532$ and escape $= 1-0.6532 \approx 0.3468$, about
          $34.7\%$.
      - teach: >
          At most one cycle can exceed the halfway length, since two disjoint
          cycles both longer than that would need more elements than the
          permutation has. That fact plus a direct count of permutations
          containing a $k$-cycle turns "does everyone succeed" into a single
          tail sum.
      - ask: >
          Sixteen prisoners, sixteen boxes, each opening eight. What is the
          failure probability, $\sum_{k=9}^{16} 1/k = H_{16}-H_{8}$?
        expects: "0.6629"
        tolerance: 0.0005
        hint: >
          Compute $H_{16}$ and $H_{8}$ separately and subtract.
        feedback: >
          $H_{8} \approx 2.7179$ and $H_{16} \approx 3.3807$, so
          $H_{16}-H_{8} \approx 0.6629$ — the escape probability here is
          about $33.7\%$.
      - ask: >
          For $100$ prisoners each opening $50$ boxes, which statement is
          correct?
        choices:
          - text: >
              Both the expected number of prisoners who find their own name
              and the probability that everyone succeeds are close to $1/2$
              under cycle-following
            feedback: >
              Only the expected-number-correct is close to $50$ out of
              $100$; the joint success probability is close to $31\%$, not
              $50\%$.
          - text: >
              The expected number who find their own name is exactly $50$
              regardless of strategy, but the probability that all $100$
              succeed jumps from about $2^{-100}$ under independent search to
              about $31\%$ under cycle-following
            correct: true
            feedback: >
              Right — these are genuinely different quantities, and only the
              joint probability is transformed by the strategy.
          - text: >
              Cycle-following raises each individual prisoner's own chance of
              finding his name above $1/2$
            feedback: >
              Each individual's own marginal chance stays exactly $1/2$ under
              any strategy — only the *joint* probability changes.
        feedback: >
          Confusing "expected number correct" (always $n/2$, by linearity,
          regardless of strategy) with "probability everyone succeeds"
          (transformed from tiny to about $31\%$ by cycle-following) is the
          most common conflation in this puzzle.
      - teach: >
          Forgetting that at most one cycle can exceed the opening limit is
          what would make the tail-sum count an overcount — it's exactly
          what keeps the sum exact.

  - node: quant-puzzles.classics.prisoners-boxes-optimality
    hook: >
      Two follow-ups always come after the headline number — does it get
      worse at scale, and can any cleverer strategy beat it — and having sharp
      one-line answers to both separates having solved this puzzle from
      having merely memorised it.
    explanation: >
      The scale-invariance follows from treating the harmonic tail sum as an
      integral: $H_{2n}-H_n = \sum_{k=n+1}^{2n} 1/k$ approximates
      $\int_{n}^{2n} dx/x = \ln 2$, and the approximation error shrinks as $n$
      grows, so the failure probability converges to exactly $\ln 2 \approx
      0.6931$ regardless of scale — a genuinely different qualitative
      behaviour from independent search, whose success probability collapses
      toward zero as $2^{-n}$.

      The optimality claim is a cited result rather than something to
      re-derive live, but the intuition worth having ready is this: the only
      randomness in the whole problem is the hidden permutation, and
      cycle-following is the one strategy that aligns every prisoner's search
      directly with that permutation's own structure; any strategy ignoring
      the permutation's cycle structure is throwing away the one piece of
      shared structure correlation could be built on.

      The individual-fairness fact is a short, self-contained argument worth
      keeping separate from the joint-probability number: from any single
      prisoner's own perspective, before conditioning on anyone else, their
      own name is equally likely to sit in any box, so any fixed set of half
      the boxes opened catches it with probability exactly $1/2$ — true for
      cycle-following and for independent random search alike. The joint
      probability differs wildly between strategies; the marginal probability
      does not move at all.
    worked: >
      A thousand prisoners, five hundred boxes opened each. Estimating
      $H_{1000}-H_{500}$ via $H_m \approx \ln m + \gamma + 1/(2m)$ gives
      $H_{1000}\approx 7.4855$ and $H_{500}\approx 6.7928$, a difference of
      about $0.6926$, within a few thousandths of $\ln 2 \approx 0.6931$.
      Escape probability $\approx 0.3074$, already indistinguishable in
      practice from the limiting $1-\ln 2 \approx 0.3069$.
    interview: >
      "Does the probability decay as the number of prisoners grows" is
      answered immediately with the limit $1-\ln 2 \approx 30.7\%$, not with
      an appeal to any specific size; "why can't a smarter strategy do
      better" is answered by citing the optimality result and adding the
      marginal-probability argument as the intuition that makes it plausible.
    pitfalls: >
      Assuming this probability shrinks toward zero the way the naive
      independent-search probability does is the most common wrong instinct,
      and it's exactly backward — this is the qualitative point of the whole
      puzzle. Treating the roughly $1/2$ individual chance and the roughly
      $31\%$ joint chance as if they should move together, rather than as
      genuinely independent facts about the same protocol, blurs two
      different quantities the interviewer is testing separately.
    recap: >
      The escape probability converges to $1-\ln 2 \approx 30.7\%$ at any
      scale and is provably unbeatable, even though every individual
      prisoner's own chance stays fixed at exactly $1/2$ regardless of
      strategy.
    steps:
      - teach: >
          The scale-invariance follows from treating the harmonic tail sum as
          an integral: $H_{2n}-H_{n}$ approximates $\int_{n}^{2n} dx/x = \ln
          2$, with the approximation error shrinking as $n$ grows, so the
          failure probability converges to a fixed constant rather than to
          zero or one.
      - teach: >
          The optimality claim is a cited result rather than something to
          re-derive live: cycle-following is the one strategy that aligns
          every prisoner's search directly with the permutation's own
          structure, the only source of randomness in the whole problem.
      - ask: >
          For $40$ prisoners and $40$ boxes, each opening $20$, what is the
          escape probability, $1-(H_{40}-H_{20})$?
        expects: "0.3192"
        tolerance: 0.0005
        hint: >
          Compute $H_{40}-H_{20}$ as a tail sum, or note it should sit close
          to $\ln 2$.
        feedback: >
          $H_{40}-H_{20} \approx 0.6808$, so the escape probability is
          $1-0.6808 \approx 0.3192$ — already close to the limiting
          $1-\ln 2 \approx 0.3069$, but not yet equal to it.
      - teach: >
          The individual-fairness fact is separate and self-contained: from
          any single prisoner's own perspective, his name is equally likely
          to sit in any box, so any fixed half the boxes catches it with
          probability exactly $1/2$ — true for cycle-following and
          independent search alike.
      - ask: >
          For $300$ prisoners each opening $150$ boxes, under
          cycle-following, what is any single prisoner's own marginal
          probability of finding his name?
        expects: "1/2"
        hint: >
          This fact does not depend on the strategy or on how many prisoners
          there are.
        feedback: >
          Each prisoner's own name is equally likely to sit in any of the
          $300$ boxes, and he opens half of them, so his marginal probability
          is exactly $1/2$ — unaffected by the joint-success number.
      - ask: >
          As the number of prisoners grows very large, keeping the
          box-opening fraction at half, what happens to the escape
          probability under cycle-following?
        choices:
          - text: >
              It shrinks toward zero, the same way independent random search
              collapses toward $2^{-n}$
            feedback: >
              This is exactly backward — it's the qualitative point of the
              whole puzzle: cycle-following does not behave like independent
              search at all.
          - text: >
              It converges to a fixed positive limit, $1-\ln 2 \approx
              30.7\%$, and barely moves once $n$ is reasonably large
            correct: true
            feedback: >
              Right — the harmonic tail sum converges to $\ln 2$, so the
              failure probability, and hence the escape probability, settles
              near a fixed constant rather than drifting to $0$ or $1$.
          - text: >
              It grows toward $100\%$, since cycle-following gets more
              effective with more prisoners
            feedback: >
              The probability converges to a fixed limit near $31\%$, not to
              certainty — more prisoners does not make the strategy more
              effective in this sense.
        feedback: >
          The escape probability is qualitatively different from independent
          search's collapsing $2^{-n}$: it converges to $1-\ln 2 \approx
          30.7\%$ and stays there.
      - teach: >
          Treating the roughly $1/2$ individual chance and the roughly $31\%$
          joint chance as if they should move together blurs two genuinely
          separate facts about the same protocol — the interviewer is
          testing them independently.

  - node: quant-puzzles.classics.ants-stick
    hook: >
      You never actually need to track a single collision to answer this
      puzzle — the entire trick is recognising that the observable state
      doesn't care whether ants bounce or walk through each other.
    explanation: >
      Two identical ants that collide and reverse are, from the outside,
      indistinguishable from two ants that walk straight through each other
      and swap names — both pictures produce the exact same set of occupied
      positions at every instant, because the two ants involved are
      physically identical and moving at the same speed either way. Since
      "when is the stick clear" is a question purely about occupied
      positions over time, not about which specific ant is where, the two
      pictures give the same answer even though they disagree about which
      ant ends up where.

      Under the pass-through picture, every phantom ant walks in a straight
      line at constant speed toward whichever end its own original direction
      points, completely ignorant of any other ant, and leaves within
      length-over-speed seconds no matter where it started. So the real,
      colliding stick clears by that same time bound — the worst case is one
      ant starting at an end and walking the full length, and the bound
      doesn't depend on how many ants there are or where they started.

      The same relabeling computes the clearing time for a specific
      configuration directly, not just the universal bound: each real ant's
      exit time equals its own phantom counterpart's straight-line exit time,
      so the clearing time for any particular arrangement is the maximum,
      over all ants, of the distance to the end that ant's own direction
      points toward, divided by the speed — no simulation of any collision
      required.
    worked: >
      A $100$ cm stick, ants at $10$ cm facing right, $50$ cm facing left, and
      $80$ cm facing right. Phantom exit times: the ant at $10$ exits after
      $100-10=90$ s; the ant at $50$ exits after $50$ s; the ant at $80$ exits
      after $100-80=20$ s. The stick clears at $t=90$ s, set by the leftmost
      ant's long walk to the right end, even though relabeling means the
      actual ant that exits there by then carries a different identity than
      the one that started at $10$.
    interview: >
      A frequent extension asks how many collisions occur, or when the first
      one happens — genuinely different questions the pass-through trick
      still answers cleanly: each collision corresponds to exactly one pair
      of a right-facing and a left-facing ant with the right-facing one
      starting to the left of the left-facing one, and the first collision
      happens at half the smallest such gap.
    pitfalls: >
      Using the relabeling trick to claim which specific ant exits which end
      is a direct misuse — identity is genuinely scrambled by the argument,
      only positions and timing survive it. Applying the same reasoning when
      the ants move at different speeds breaks it immediately, since "bounce
      equals pass-through swap" only holds for identical, equal-speed
      particles.
    recap: >
      Collisions are just relabelings of identical particles, so the stick
      clears by the time the slowest-to-exit phantom would take walking
      straight to its own end — at most the stick length divided by the
      speed, whatever the starting configuration.
    steps:
      - teach: >
          Two identical ants that collide and reverse are, from the outside,
          indistinguishable from two ants that walk straight through each
          other and swap names — both pictures produce the exact same set of
          occupied positions at every instant.
      - teach: >
          Since "when is the stick clear" only depends on occupied positions
          over time, not on which ant is which, the pass-through picture
          answers it directly: every phantom ant walks in a straight line
          toward its own original direction and leaves within
          length-over-speed seconds, whatever the real ants do.
      - ask: >
          A $60$ cm stick, ants moving at $2$ cm/s: one ant at $8$ cm facing
          right, one at $40$ cm facing left, one at $50$ cm facing right. How
          long, in seconds, until the stick is clear?
        expects: "26"
        hint: >
          Find each ant's phantom exit time (distance to its own end, divided
          by speed) and take the maximum.
        feedback: >
          Exit times: the ant at $8$ travels $60-8=52$ cm right, taking
          $52/2=26$ s; the ant at $40$ travels $40$ cm left, taking
          $40/2=20$ s; the ant at $50$ travels $60-50=10$ cm right, taking
          $10/2=5$ s. The stick clears at the maximum, $26$ s.
      - teach: >
          The same relabeling gives the exact clearing time for a specific
          configuration, not just the universal bound: it is the maximum,
          over all ants, of the distance to the end each one's own direction
          points toward, divided by the speed.
      - ask: >
          A stick $75$ cm long, ants moving at $3$ cm/s. What is the
          worst-case guaranteed time, in seconds, for the stick to clear,
          whatever the ants' positions and directions?
        expects: "25"
        hint: >
          The universal bound is the stick length divided by the speed.
        feedback: >
          The worst case is one ant starting at an end and walking the full
          length: $75/3=25$ seconds, independent of how many ants there are
          or where they start.
      - ask: >
          After the stick has cleared, can you say which original ant
          physically exited last?
        choices:
          - text: >
              No — the relabeling argument scrambles identity; only
              positions and exit timing survive the pass-through picture,
              not which original ant ends up where
            correct: true
            feedback: >
              Right — the trick trades identity for a tractable computation,
              so it can answer "when" but not "which ant."
          - text: >
              Yes — the ant that started closest to the left, facing right,
              is guaranteed to be the last to exit
            feedback: >
              That is true of the exit time attributed to a phantom
              trajectory, but not of which real, identity-preserved ant
              physically exits there — identity is exactly what the trick
              discards.
          - text: >
              Yes, because collisions preserve each ant's original identity
            feedback: >
              Real collisions do preserve identity — it is the relabeling
              trick that discards it for computational convenience, which is
              exactly why the trick cannot answer identity questions.
        feedback: >
          Using the relabeling trick to claim which specific ant exits which
          end is a direct misuse — only positions and timing survive it.
      - teach: >
          The trick also breaks if the ants move at different speeds: "bounce
          equals pass-through swap" only holds for identical particles moving
          at the same speed.

  - node: quant-puzzles.classics.chameleons
    hook: >
      The state space here is far too large to search by hand, which is
      exactly the signal to look for a single number every move leaves
      untouched, rather than trying to plan a sequence of meetings.
    explanation: >
      Any meeting changes the three colour counts by $-1, -1, +2$ in some
      order — two colours each lose one chameleon to the meeting, the third
      gains two. Track what this does to a pairwise difference: the
      difference between the two colours that met changes by $0$, since both
      dropped by exactly one, while the difference between either of those
      and the colour that gained changes by $2-(-1)=3$. So every pairwise
      difference shifts by a multiple of $3$ on every single move, regardless
      of which two colours happen to meet — the residue of each difference
      mod $3$ is an invariant.

      A monochrome island needs two of the three counts to be exactly zero,
      which forces the difference between those two colours to be exactly
      zero, and in particular $\equiv 0 \pmod 3$. So checking whether any
      pairwise difference among the starting counts is already $\equiv 0
      \pmod 3$ is a complete test: if no pair agrees mod $3$, monochrome is
      impossible from that starting count, no search required.

      This is the invariant strategy in its cleanest form — a numeric
      certificate replaces a search over an enormous space of meeting
      sequences, and it works because it's checked once against the moves'
      structure rather than against any particular sequence of them.
    worked: >
      Reds $11$, greens $16$, blues $20$. Mod $3$: $11 \equiv 2$,
      $16 \equiv 1$, $20 \equiv 2$ — red and blue share residue $2$, while
      green's residue $1$ disagrees with both. Since it's the pair sharing a
      residue whose difference can reach zero, red and blue are the two
      counts that could simultaneously hit zero, leaving green as the colour
      not excluded from becoming the island's monochrome colour — unlike
      $13, 15, 17$, where all three residues were distinct and no pairwise
      difference could ever reach zero.
    interview: >
      A common follow-up asks for the smallest change to the starting counts
      — add or remove one chameleon of a chosen colour — that would make
      monochrome achievable; that's answered by checking which single change
      makes two residues agree, not by searching for a meeting sequence.
    pitfalls: >
      Checking only one of the three pairwise differences mod $3$, rather
      than all three, risks missing the one pair that actually agrees, since
      a move could occur between any two of the colours. Assuming any
      recolouring you like is achievable in one step ignores that every legal
      move is constrained to exactly the $-1, -1, +2$ pattern on the counts.
    recap: >
      Every meeting shifts each pairwise colour-count difference by a
      multiple of $3$, so monochrome is only reachable when some pair of
      starting counts already agrees mod $3$ — a one-line check that replaces
      any search.
    steps:
      - teach: >
          Any meeting changes the three colour counts by $-1,-1,+2$ in some
          order. Track a pairwise difference: the two colours that met keep
          the same difference between them, since both dropped by exactly
          one, while either of those colours' difference from the one that
          gained shifts by $3$.
      - teach: >
          So every pairwise difference is invariant mod $3$, whichever pair
          meets. A monochrome island needs two counts to hit exactly zero,
          forcing their difference to be exactly $0$, hence $\equiv 0 \pmod
          3$ — a complete test requiring no search at all.
      - ask: >
          Reds $9$, greens $14$, blues $20$. What is $(\text{blue} -
          \text{green}) \bmod 3$?
        expects: "0"
        hint: >
          Reduce each count mod $3$ first, then subtract.
        feedback: >
          $20-14=6$, and $6 \bmod 3 = 0$ — this pair's difference is already
          $\equiv 0 \pmod 3$, consistent with monochrome being reachable with
          green and blue as the pair that can simultaneously hit zero.
      - teach: >
          This is the invariant strategy in its cleanest form: a numeric
          certificate, checked once against the structure of the moves,
          replaces a search over an enormous space of meeting sequences.
      - ask: >
          Reds $5$, greens $11$, blues $19$. What is $(\text{red} -
          \text{green}) \bmod 3$?
        expects: "0"
        hint: >
          Reduce each count mod $3$ first, then subtract.
        feedback: >
          $5-11=-6$, and $-6 \bmod 3 = 0$ — red and green share a residue,
          so they are the pair that could simultaneously reach zero.
      - ask: >
          Reds $4$, greens $8$, blues $9$. Is an all-one-colour island
          reachable?
        choices:
          - text: >
              Yes — because $9-4=5$ is close to a multiple of $3$
            feedback: >
              "Close to" is not the same as an exact multiple: $5 \bmod 3 =
              2 \ne 0$, so this pairwise difference does not qualify.
          - text: >
              No — the three counts are $1$, $2$, $0 \pmod 3$, all pairwise
              distinct, so no pairwise difference is a multiple of $3$
            correct: true
            feedback: >
              Right — $4 \equiv 1$, $8 \equiv 2$, $9 \equiv 0 \pmod 3$, all
              different, so monochrome is provably unreachable.
          - text: >
              Yes — any starting counts can eventually be driven to a single
              colour with enough meetings
            feedback: >
              The mod-$3$ invariant is a hard obstruction, not a matter of
              trying long enough: if no pair agrees mod $3$, monochrome is
              impossible, full stop.
        feedback: >
          Reduce all three counts mod $3$ and compare: here they are $1$,
          $2$, $0$, all distinct, so no pairwise difference can ever reach
          zero.
      - teach: >
          Checking only one of the three pairwise differences risks missing
          the one pair that actually agrees, since a move could occur between
          any two of the colours — always check all three.

  - node: quant-puzzles.classics.water-jugs
    hook: >
      The same certificate move as the chameleons applies here with number
      theory standing in for modular colour-counting — checking one gcd tells
      you instantly whether an amount is reachable at all, before you plan a
      single pour.
    explanation: >
      Every legal move with two jugs of sizes $a$ and $b$ — filling one from
      the tap, emptying one down the drain, or pouring between them until the
      source empties or the target fills — changes each jug's content by a
      whole multiple of $a$ or $b$. That means at every intermediate moment,
      both jugs' contents are expressible as integer combinations $ax+by$ for
      some integers $x,y$, and by Bézout's identity the full set of integers
      reachable this way is exactly the multiples of $\gcd(a,b)$, capped by
      whichever jug is being read.

      When $\gcd(a,b)=1$, every whole number up to the larger jug's capacity
      is reachable, and the exact recipe comes straight out of Bézout's
      identity: writing the target as $ax-by$ for integers $x,y \ge 0$ tells
      you to perform $x$ fills of one jug and $y$ empties of the other,
      interleaved with the forced pours between them, to land on exactly that
      amount.

      When $\gcd(a,b)>1$, the obstruction is exactly as sharp as the
      chameleons' mod-$3$ check — no sequence of moves, however long, reaches
      an amount that isn't a multiple of the gcd, because every move
      preserves that property from the very first fill.
    worked: >
      A $4$-gallon and a $7$-gallon jug, target $5$ gallons; $\gcd(4,7)=1$ so
      it's reachable, via $4 \times 3 - 7 \times 1 = 5$. Fill $4$: $(4,0)$.
      Pour into $7$: $(0,4)$. Fill $4$: $(4,4)$. Pour into $7$, which takes
      $3$ before it's full: $(1,7)$. Empty $7$: $(1,0)$. Pour the $1$ across:
      $(0,1)$. Fill $4$: $(4,1)$. Pour into $7$, which has room for all $4$:
      $(0,5)$ — the $7$-gallon jug now holds exactly $5$, using three fills
      of the $4$-jug and one emptying of the $7$-jug, matching the identity
      exactly.
    interview: >
      A direct follow-up asks which amounts are unreachable with a given pair
      of jug sizes, answered instantly by gcd without searching pour
      sequences, while a harder one asks for the minimum number of moves to
      reach a specific reachable amount, which the gcd alone doesn't
      determine.
    pitfalls: >
      Assuming any amount up to the larger jug's capacity is reachable with
      any two jug sizes ignores the gcd obstruction entirely — $6$- and
      $8$-gallon jugs, gcd $2$, can never measure an odd amount. Trying to
      "pour half" or otherwise create a fractional intermediate amount isn't
      a legal move at all — every move is exactly fill-to-top, empty-to-zero,
      or pour-until-one-jug-hits-a-limit.
    recap: >
      Reachable amounts with jugs $a$ and $b$ are exactly the multiples of
      $\gcd(a,b)$, with Bézout's identity supplying both the proof and the
      actual fill-and-empty recipe.
    steps:
      - teach: >
          Every legal move — filling from the tap, emptying down the drain,
          or pouring between the two jugs — changes each jug's content by a
          whole multiple of $a$ or $b$. So every reachable amount is an
          integer combination $ax+by$, and by Bézout's identity that set is
          exactly the multiples of $\gcd(a,b)$.
      - teach: >
          When $\gcd(a,b)=1$, every whole number up to the larger jug's
          capacity is reachable, and the recipe comes straight out of writing
          the target as $ax-by$: perform $x$ fills of one jug and $y$ empties
          of the other, interleaved with the forced pours between them.
      - ask: >
          Unmarked jugs of size $9$ and $12$ gallons. What is the smallest
          positive amount always reachable, whatever sequence of moves is
          used?
        expects: "3"
        hint: >
          The finest measurement possible is the greatest common divisor of
          the two jug sizes.
        feedback: >
          $\gcd(9,12)=3$: fill the $12$-gallon jug, pour into the $9$-gallon
          jug until it is full, and the $12$-gallon jug is left holding
          exactly $3$ gallons.
      - teach: >
          When $\gcd(a,b)>1$ the obstruction is exactly as sharp as the
          chameleons' mod-$3$ check: no sequence of moves, however long,
          reaches an amount that isn't a multiple of the gcd, since every
          move preserves that property from the very first fill.
      - ask: >
          Unmarked jugs of size $6$ and $10$ gallons. Which amount can never
          be measured, whatever sequence of fills, empties, and pours is
          used?
        choices:
          - text: >
              $8$ gallons
            feedback: >
              $8$ is a multiple of $\gcd(6,10)=2$, so it is reachable.
          - text: >
              $7$ gallons
            correct: true
            feedback: >
              Right: $\gcd(6,10)=2$, and every reachable amount is a multiple
              of $2$; $7$ is odd, so it can never be measured.
          - text: >
              $4$ gallons
            feedback: >
              $4$ is a multiple of $\gcd(6,10)=2$, so it is reachable.
        feedback: >
          Reachable amounts with jugs $a$ and $b$ are exactly the multiples
          of $\gcd(a,b)$; here $\gcd(6,10)=2$, so only even amounts are ever
          measurable.
      - ask: >
          Unmarked $4$- and $9$-gallon jugs, target $6$ gallons;
          $\gcd(4,9)=1$ so it is reachable. Writing $6 = 4x - 9y$ with $y=2$,
          what must $x$ equal?
        expects: "6"
        hint: >
          Solve $4x - 9(2) = 6$ for $x$.
        feedback: >
          $4x = 6+18=24$, so $x=6$: check, $4(6)-9(2)=24-18=6$ — six fills of
          the $4$-gallon jug and two emptyings of the $9$-gallon jug, with
          the forced pours between them, reach exactly six gallons.
      - teach: >
          Trying to "pour half" or otherwise create a fractional intermediate
          amount isn't a legal move at all — every move is exactly
          fill-to-top, empty-to-zero, or pour-until-one-jug-hits-a-limit.
