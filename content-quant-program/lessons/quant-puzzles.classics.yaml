unit: quant-puzzles.classics
opening: >
  Classic brainteasers reward a different skill than most of the tree: the
  interviewer already assumes you may have met the puzzle before, so the score
  is not the final number but whether you can rebuild the winning idea live
  and name the family it belongs to. This unit opens with the one distinction
  that governs how every puzzle here should be read — a guaranteed worst case
  is not an average — then groups the rest by the move that cracks them:
  information-counting for weighing and searching, rate-and-phase reasoning
  for scheduling puzzles, protocol design for players who cannot communicate,
  and invariants for reachability questions. Work the sequence once, then
  treat each lesson as a standalone entry: know which family a new puzzle
  belongs to and the specific numbers fall out fast.
lessons:
  - node: quant-puzzles.classics.guarantee-vs-average
    hook: >
      Interviewers routinely ask "how many" twice in the same sitting — once
      wanting a guarantee, once wanting an average — and answering the wrong
      question, however cleanly reasoned, earns no credit.
    explanation: >
      A guarantee is a claim about the worst outcome an adversary can arrange
      against a fixed procedure; an average is a claim about a stated random
      process. The two demand entirely different proofs: a guarantee needs a
      lower bound (why no scheme can do better) and a matching scheme (one
      that actually attains the bound), while an average needs nothing but a
      probability model and direct summation.

      The lower bound for a guarantee is almost always a counting argument:
      count how many final answers a procedure must distinguish, count how
      many distinct outcomes your available moves can produce, and note that
      the second number must reach the first. This is the same move whether
      the "moves" are weighings, questions, or guesses, and it's what turns "I
      found a scheme with three steps" into "three steps is also provably
      necessary."

      Worst-case thinking additionally means imagining an adversary who sees
      your entire deterministic plan in advance and then picks the hidden
      configuration to hurt you most — a plan that's fast on most inputs and
      slow on one is scored at its slowest branch, full stop. An average
      question instead needs an actual distribution stated or assumed, and any
      answer given without one is not wrong so much as incomplete.
    interview: >
      The tell is the phrase itself: "what's the minimum number of weighings
      that always works" wants a guarantee, "what's the expected number of
      guesses" wants an average — state out loud which one you're answering
      before touching arithmetic, since interviewers deliberately phrase some
      questions ambiguously to see if you ask.
    pitfalls: >
      Computing an average number of steps and presenting it as the answer to
      a stated guarantee question (or the reverse) is the single most common
      miss in this whole family of puzzles. Supplying only the scheme half of
      a guarantee answer, with no argument for why fewer steps cannot possibly
      work, leaves the harder half unanswered.
    recap: >
      Guarantee answers need a lower bound and a matching scheme under an
      adversary; average answers need a stated distribution — never let one
      stand in for the other.
    dialogue:
      - part: Two plans for one hidden number
        teach: >
          An interviewer picks a whole number from $1$ to $4$ and answers
          yes-or-no questions truthfully. Plan H halves: "is it at most $2$?",
          then one more question splits the surviving pair. Plan L bets on a
          hunch: "is it $3$?", then "is it $1$?", then "is it $2$?", stopping
          the moment the number is known.
      - ask: >
          What is the largest number of questions Plan L can need?
        expects: "3"
        hint: >
          Run Plan L against each of the four numbers.
        feedback: >
          A $3$ costs one question and a $1$ costs two. A $2$ or a $4$ answers
          "no" twice and needs the third question to tell them apart — three.
          Plan H, by contrast, takes exactly two on every number.
      - ask: >
          The interviewer is told your plan before he picks. Which number does
          he choose against Plan L?
        choices:
          - text: >
              $3$, because it is the number he likes best
            feedback: >
              He is not picking for pleasure. Against Plan L a $3$ ends the game
              in one question; a player trying to make you work avoids it.
          - text: >
              A number chosen at random, since he cannot do better
            feedback: >
              He can: he has read your plan, so he knows exactly which numbers
              cost you three questions and picks one of them.
          - text: >
              A $2$ or a $4$
            correct: true
            feedback: >
              Those are the slowest branches, and an opponent who has seen a
              fixed plan steers you into its slowest branch every time.
        feedback: >
          Scored against an opponent, Plan L is worth $3$ and Plan H is worth
          $2$. Plan L's quick finish on a $3$ counts for nothing.
      - ask: >
          A colleague who sat this interview says the number is $3$ half the
          time and each of $1$, $2$, $4$ a sixth of the time. Under that
          distribution, what is Plan L's average number of questions?
        expects: "11/6"
        tolerance: 0.005
        hint: >
          Weight each number's cost by its probability and add.
        feedback: >
          $\tfrac{1}{2}(1) + \tfrac{1}{6}(2) + \tfrac{1}{6}(3) +
          \tfrac{1}{6}(3) = \tfrac{1}{2} + \tfrac{8}{6} = \tfrac{11}{6}
          \approx 1.83$. Plan H still averages exactly $2$, so on this
          distribution Plan L wins.
      - reflect: >
          Plan L loses one comparison and wins the other, on the same game.
          What are the two different questions you have been answering, and
          what does each one need from you before it has an answer at all?
        answer: >
          One question is a guarantee: how many questions suffice whatever the
          number is. It is scored at the slowest branch, as if an opponent
          picked the number after reading your plan, and it needs no
          probabilities. The other is an average: how many questions you
          expect to use. It is a weighted sum, and it needs a distribution
          over the numbers — without the colleague's tip it has no answer.

      - part: Two questions behind "how many"
        teach: >
          A *guarantee* is a claim about every case: a fixed plan is scored at
          its worst branch, with an adversary choosing the hidden
          configuration after seeing the plan. Proving one takes two halves —
          a scheme that meets the number, and a lower bound showing no scheme
          does better. An *average* is a claim about a stated random process,
          computed as a weighted sum, and it is meaningless until the
          distribution is named.
      - ask: >
          Without any tip, the interviewer asks: "on average, how many
          questions does Plan L take?" What is the honest reply?
        choices:
          - text: >
              Three, since that is what Plan L can be forced to use.
            feedback: >
              That answers the guarantee question. An average weights the
              cheap branches too, so it comes out below the worst case on any
              distribution that puts weight on a $1$ or a $3$.
          - text: >
              It depends on how the number is chosen; if uniformly, it is
              $9/4$.
            correct: true
            feedback: >
              Under uniform odds, $\tfrac{1}{4}(1 + 2 + 3 + 3) = 9/4$. Saying
              the assumption out loud is what turns the number into an answer.
          - text: >
              $11/6$, the figure computed a moment ago.
            feedback: >
              That figure rests on the colleague's distribution. A different
              interviewer with a different habit gives a different average;
              the number does not travel without its distribution.
        feedback: >
          An average always comes with the sentence "assuming the number is
          chosen ...". If nobody stated a distribution, either ask or say
          which one you are assuming.
      - ask: >
          The interviewer says only: "how many questions do you need?" What
          is the strongest first sentence?
        choices:
          - text: >
              "Two."
            feedback: >
              Probably the number wanted, but it leaves the interviewer to
              guess whether you mean always or on average, and gives no reason
              to believe either.
          - text: >
              "Two, always: halving reaches it, and one question has only two
              answers, so it cannot separate four numbers."
            correct: true
            feedback: >
              It says which question is being answered and supplies both
              halves of a guarantee — the scheme and the bound — in one
              breath.
          - text: >
              "About $1.83$, if we use the hunch plan."
            feedback: >
              That is an average under one particular distribution, offered
              for a question that did not name one. It is also a worse
              guarantee, at three.
        feedback: >
          Decide out loud which question you are answering before any
          arithmetic. Interviewers phrase some prompts ambiguously on purpose.

      - part: The half that gets skipped
        ask: >
          Now the number is from $1$ to $20$. What is the fewest questions
          that *guarantees* finding it?
        expects: "5"
        hint: >
          How many different answer patterns can $k$ yes-or-no questions
          produce?
        feedback: >
          $k$ questions produce at most $2^{k}$ answer patterns. $2^{4} = 16 <
          20$, so with four questions two numbers share a pattern and the
          adversary picks one of them; $2^{5} = 32 \ge 20$, and halving
          ($20, 10, 5, 3, 2, 1$) finishes in five. Bound and scheme meet at
          $5$.
      - ask: >
          A colleague claims a plan for $1$ to $20$ that finishes within four
          questions on $19$ of the numbers and needs a fifth only for the
          last. Can such a plan exist?
        choices:
          - text: >
              Yes: its guarantee is still five, so it respects the bound.
            feedback: >
              The bound limits more than the worst case. Count the numbers that
              can be pinned down within four questions: there are only $16$
              answer patterns of length at most four.
          - text: >
              No: within four questions there are at most $16$ answer patterns,
              so at most $16$ numbers can be settled that fast.
            correct: true
            feedback: >
              The counting argument caps every branch, not just the slowest
              one. At least four of the twenty numbers need a fifth question.
          - text: >
              Yes, and it would beat halving's guarantee on average.
            feedback: >
              It would beat halving's average, which is why it is tempting,
              but it cannot be built: $19$ numbers cannot share $16$ answer
              patterns.
        feedback: >
          The same count that proves a guarantee also limits how often a plan
          can be fast — a useful check on any scheme that looks too good.
      - ask: >
          Halving on $1$ to $20$ settles $12$ numbers in four questions and
          $8$ in five. If the number is chosen uniformly, what is its average?
        expects: "4.4"
        feedback: >
          $\tfrac{12 \cdot 4 + 8 \cdot 5}{20} = \tfrac{88}{20} = 4.4$. The same
          plan has a guarantee of $5$ and a uniform average of $4.4$: two
          numbers, two different questions.
      - teach: >
          Said aloud: "Do you want worst case or average? Worst case is five:
          four questions give only sixteen patterns, and halving achieves
          five. Average under a uniform pick is $4.4$." That one sentence of
          triage is most of what this family of puzzles is testing.

  - node: quant-puzzles.classics.coin-weighing
    hook: >
      This is the single most-recycled puzzle in the whole interview canon, so
      the actual scoring event is never "do you know the answer is three" —
      it's whether you can rebuild the counting bound and the pan-splitting
      scheme from scratch under a clock.
    explanation: >
      Each weighing has exactly three possible outcomes — left pan down,
      right pan down, balanced — so $w$ weighings can in principle distinguish
      $3^{w}$ final states. The unknown here is a pair (which of twelve coins,
      heavy or light), so there are $24$ states to separate; since
      $3^{2}=9<24$ but $3^{3}=27\ge 24$, three is the first weighing count
      that could possibly work, and the whole puzzle becomes proving a scheme
      actually reaches that ceiling.

      The scheme has to make every weighing worth close to its full three
      outcomes of information, which is why the first split is four against
      four rather than six against six: leaving four coins off the scale
      keeps the balanced branch informative (narrowing to four suspects,
      still requiring real work) instead of wasting most of the outcome space
      on a lopsided partition.

      The second-weighing trick — moving specific coins between the two pans
      and pulling in known-genuine coins to pad — is what makes the scheme,
      not just the count, work: reshuffling suspects between pans is what
      lets a single weighing simultaneously test "is coin X heavy" and "is
      coin Y light," separating all the surviving cases with one three-way
      split.
    worked: >
      Nine coins, one heavier than the rest, direction already known — two
      weighings. Split into three groups of three, A, B, C, and weigh A
      against B. A balance puts the heavy coin in C; an imbalance puts it in
      whichever pan went down. Either way you're left with three suspects and
      one weighing: weigh any two of the three against each other — a balance
      names the third as heavy, an imbalance names the heavier pan. Nine
      coins collapse to one in exactly two weighings, matching $3^{2}=9$
      exactly.
    interview: >
      The disguise is almost always a change to what's unknown: "direction
      known" cuts the state count per suspect in half, while "no known-genuine
      coins available as reference" removes the padding trick and can force an
      extra weighing. Listen for whether the interviewer states the direction
      as known or unknown before committing to a group size.
    pitfalls: >
      Forgetting that an unknown direction doubles the state count (twenty-four,
      not twelve) is the most common miscount, and it silently invalidates a
      plan built for the direction-known version. Splitting into unequal
      groups, or reusing the exact same coins in the same pans on the second
      weighing, wastes the informative branches the first weighing bought.
    recap: >
      Three weighings suffice for twelve coins because $3^{3}=27$ just clears
      the $24$ states to separate, and the scheme earns that bound by
      reshuffling suspects across pans rather than repeating the same split.
    dialogue:
      - part: What three weighings can say
        ask: >
          Twelve coins, one counterfeit, heavier or lighter — you are not told
          which. The finished answer names a coin and a direction, such as
          "coin $7$, light". How many different finished answers are there?
        expects: "24"
        feedback: >
          Twelve coins times two directions: $24$. Forgetting the direction
          halves the count to $12$ and quietly solves an easier puzzle.
      - ask: >
          Each weighing ends one of three ways: left down, right down, or
          balanced. How many different outcome sequences can three weighings
          produce?
        expects: "27"
        feedback: >
          $3 \times 3 \times 3 = 27$. Two weighings give only $9$, fewer than
          the $24$ answers, so two weighings can never always work.
      - ask: >
          $27 \ge 24$. What does that settle?
        choices:
          - text: >
              Three weighings always suffice.
            feedback: >
              The count only says three is not ruled out. A scheme still has to
              send the $24$ answers to $24$ different outcome sequences, and a
              careless one will not.
          - text: >
              Two weighings cannot always work, and three might.
            correct: true
            feedback: >
              That is the lower bound half of a guarantee. The other half is a
              scheme that actually spreads the answers across the outcomes.
          - text: >
              Nothing until you know the direction of the fake.
            feedback: >
              The direction is already in the count: that is why it is $24$ and
              not $12$.
        feedback: >
          The count is a ceiling on what any scheme can do, and it says three
          weighings is the first candidate. Now the scheme has to earn it.
      - ask: >
          The natural first move is six against six. It tips left. How many
          of the $24$ answers are still possible?
        expects: "12"
        hint: >
          A coin on the falling pan could be heavy; a coin on the rising pan
          could be light.
        feedback: >
          Coins $1$ to $6$ heavy or coins $7$ to $12$ light: $12$ answers,
          with only $9$ outcome sequences left in two weighings. The plan is
          already dead. And it could never have balanced — every coin was on
          the scale.

      - part: Choosing the first split
        reflect: >
          Six against six wasted the balanced outcome and left too many
          answers on each tilt. Think of the first weighing as sorting the
          $24$ answers into three piles, one per outcome. How big may each
          pile be, and what does that say about how many coins to leave off
          the scale?
        hint: >
          Two weighings remain after the first.
        answer: >
          Each pile must fit in the $9$ outcomes of the remaining two
          weighings, so no pile may exceed $9$ — and three piles of at most $9$
          holding $24$ answers means roughly $8$ each. With $k$ coins per pan,
          a tilt leaves $2k$ answers ($k$ possibly heavy, $k$ possibly light)
          and a balance leaves $2(12 - 2k)$ for the coins kept off. Both are at
          most $9$ only when $k = 4$.
      - ask: >
          So how many coins go on each pan in the first weighing?
        expects: "4"
        feedback: >
          Four against four with four aside: a tilt leaves $2 \cdot 4 = 8$
          answers, and a balance leaves the four aside in either direction,
          also $8$. Every pile fits in $9$.
      - teach: >
          That is the design rule for the whole scheme: every weighing should
          split the surviving answers into three piles small enough for the
          weighings left. Weigh $\{1, 2, 3, 4\}$ against $\{5, 6, 7, 8\}$. If
          it balances, the fake is among $9$ to $12$, in either direction,
          and coins $1$ to $8$ are now known to be genuine.
      - ask: >
          It balances. Eight answers remain and two weighings. Which second
          weighing keeps every pile at most $3$?
        choices:
          - text: >
              $\{9, 10\}$ against $\{11, 12\}$
            feedback: >
              Every suspect is on the scale, so a balance is impossible again,
              and a left tilt leaves $9$ or $10$ heavy or $11$ or $12$ light —
              four answers for one weighing of three outcomes.
          - text: >
              $9$ against $10$
            feedback: >
              A balance leaves $11$ and $12$ in either direction: four answers,
              one weighing, three outcomes. Too many.
          - text: >
              $\{9, 10, 11\}$ against three of the genuine coins
            correct: true
            feedback: >
              Heavier side down: one of $9, 10, 11$ heavy, $3$ answers. Up: one
              of them light, $3$ answers. Balance: coin $12$, heavy or light, $2$
              answers. The genuine coins are what let you weigh three suspects
              against nothing suspicious.
        feedback: >
          Padding a pan with known-genuine coins is how the scheme puts an
          odd number of suspects on the scale without breaking the balance.
      - ask: >
          The suspect side $\{9, 10, 11\}$ goes down. What is the third
          weighing?
        choices:
          - text: >
              $9$ against a genuine coin
            feedback: >
              If it balances, $10$ and $11$ are both still possible heavy
              coins, and the weighings are spent.
          - text: >
              $9$ against $10$
            correct: true
            feedback: >
              The heavy one goes down; a balance names $11$. The direction was
              already known from the second weighing.
          - text: >
              $\{9, 10\}$ against $\{11, \text{genuine}\}$
            feedback: >
              A left tilt then means $9$ or $10$ heavy — two answers left,
              no weighings to separate them.
        feedback: >
          Three heavy-only suspects, one weighing, three outcomes: one suspect
          per outcome. The balanced branch is done.

      - part: The tilted branch
        reflect: >
          Back to the first weighing: suppose the left pan fell. The answers
          left are $1, 2, 3, 4$ heavy or $5, 6, 7, 8$ light — each coin now has
          only one way to be guilty. Why does that make it useful to move some
          suspects to the *other* pan for the second weighing?
        hint: >
          Ask what a heavy-only suspect can do to its pan, and what a
          light-only suspect can do.
        answer: >
          A coin that can only be heavy can only push its own pan down; a coin
          that can only be light can only let its own pan rise. Put a
          heavy-suspect on the left and a light-suspect on the right and both
          predict "left down", so one outcome can point at a chosen handful of
          suspects. Swapping coins across pans lets a single weighing test
          "is coin $a$ heavy" and "is coin $b$ light" at once.
      - ask: >
          Coins $9$ to $12$ are now known genuine. Which second weighing
          leaves at most $3$ answers in every outcome?
        choices:
          - text: >
              $\{1, 2\}$ against $\{3, 4\}$
            feedback: >
              A balance clears all four heavy suspects and leaves $5, 6, 7, 8$
              light: four answers, one weighing.
          - text: >
              $\{1, 2, 5\}$ against $\{3, 4, 6\}$
            correct: true
            feedback: >
              Left down: $1$ or $2$ heavy, or $6$ light. Right down: $3$ or $4$
              heavy, or $5$ light. Balance: $7$ or $8$ light. Piles of $3$, $3$
              and $2$.
          - text: >
              $\{1, 2, 3, 5\}$ against $\{4, 6, 7, 9\}$
            feedback: >
              Left down then means $1, 2, 3$ heavy or $6, 7$ light: five
              answers, far more than one weighing can separate.
        feedback: >
          Two heavy-suspects stay put, one light-suspect crosses over, and two
          suspects of each kind sit out. That reshuffle is the whole trick.
      - ask: >
          $\{1, 2, 5\}$ against $\{3, 4, 6\}$ tips left. What is the third
          weighing?
        choices:
          - text: >
              $1$ against $6$
            feedback: >
              "$1$ heavy" and "$6$ light" both send the left pan down. The
              outcome you most need to split is the one this weighing merges.
          - text: >
              $1$ against $2$
            correct: true
            feedback: >
              The heavier goes down; a balance clears both and names $6$ light.
              One suspect per outcome.
          - text: >
              $6$ against a genuine coin
            feedback: >
              Rising names $6$ light, but a balance leaves $1$ or $2$ heavy with
              no weighing left.
        feedback: >
          The right-down branch is the mirror image, and a balance on the
          second weighing ($7$ or $8$ light) is settled by $7$ against $8$.
          Every branch ends in three weighings.
      - teach: >
          Said aloud: "Twenty-four answers, twenty-seven outcome sequences, so
          three is the floor. Four against four keeps every branch at eight.
          Then reshuffle the suspects across the pans, padding with genuine
          coins, so each weighing splits the survivors three ways."

  - node: quant-puzzles.classics.coin-weighing-scaling
    hook: >
      The interviewer's natural follow-up to the twelve-coin puzzle is "and
      with four weighings?" — answering instantly from the formula, rather
      than re-deriving the whole scheme, is what separates having solved the
      puzzle from having understood it.
    explanation: >
      The counting bound from three weighings generalises directly: $n$
      weighings distinguish at most $3^{n}$ outcomes, but three of those are
      wasted. Two are lost because the all-left and all-right tilt sequences
      each need to single out a specific coin with no counterpart, which
      symmetry forbids; a third is lost because the all-balanced sequence only
      says "no fake found among the suspects weighed," carrying no direction
      information at all. Net usable capacity is $3^{n}-3$ states, and since
      each of the two directions needs its own state, the coin count is
      $(3^{n}-3)/2$.

      A reference coin fixes the other wasted pair, not the all-balanced one:
      the all-balanced sequence can only ever mean "no counterfeit found
      among the coins actually weighed," which never carries a direction and
      stays wasted regardless. What's actually unusable without a reference
      is a coin whose codeword rides one pan every single weighing, since
      such a coin would leave that pan permanently one coin ahead of the
      other in count, violating the requirement that both pans hold equally
      many coins each round. One known-genuine reference coin can pad the
      opposite pan on every such round, legalising that one extra coin's two
      possible states and recovering exactly the two outcome sequences that
      were otherwise off-limits, pushing the bound from $3^{n}-3$ to
      $3^{n}-1$.

      The scheme achieving this bound doesn't need to be adaptive — you don't
      need to see weighing one's result before planning weighing two. Assign
      each coin a fixed length-$n$ code over left, right, and off in advance,
      place it on the left or right pan (or aside) exactly as its code says on
      each weighing, and read the sequence of three tilts as one base-$3$
      number that names the fake and its direction directly.
    worked: >
      Five weighings, no reference coin: $(3^{5}-3)/2 = (243-3)/2 = 120$
      coins. Adding one known-genuine reference coin to pad whichever pan
      would otherwise fall short legalises the one coin whose codeword rides
      a single pan every round, and pushes the bound to
      $(3^{5}-1)/2 = (243-1)/2 = 121$ coins — one extra coin identified for
      the cost of borrowing a coin you already trust.
    interview: >
      A common trap question is "so doubling the weighings doubles the coins
      you can check" — it doesn't; the bound is exponential in the number of
      weighings, not linear, so going from three to four weighings jumps from
      twelve to thirty-nine coins. Expect to be asked to justify the $-3$ or
      $-1$ correction rather than just quote the formula.
    pitfalls: >
      Using $3^{n}/2$ without subtracting the wasted states overcounts by
      exactly the amount the all-balanced and all-tilted-one-way sequences
      fail to distinguish. Forgetting that a reference coin only buys back the
      all-tilted-one-way pair, and never the all-balanced sequence, is the
      other common overreach.
    recap: >
      The information bound $(3^{n}-3)/2$, or $(3^{n}-1)/2$ with one
      reference coin, is tight and achieved by a fixed, non-adaptive base-$3$
      coding of every coin across all $n$ weighings.
    dialogue:
      - part: The count says four
        ask: >
          Two weighings this time, one counterfeit of unknown direction, and
          nothing on hand but the suspect coins. By counting alone — answers
          against outcome sequences — what is the largest pile two weighings
          could possibly handle?
        expects: "4"
        hint: >
          Each coin contributes two answers; two weighings have $3^{2}$
          outcome sequences.
        feedback: >
          $N$ coins give $2N$ answers and two weighings give $9$ sequences.
          $2 \cdot 4 = 8 \le 9$ but $2 \cdot 5 = 10 > 9$, so the count allows
          four.
      - ask: >
          Try four coins. Which first weighing leaves a branch that one
          remaining weighing can always finish?
        choices:
          - text: >
              One coin against one, two aside
            feedback: >
              If it balances, either aside coin could be heavy or light: four
              answers, and one weighing has only three outcomes.
          - text: >
              Two coins against two, none aside
            feedback: >
              A tilt to the left leaves the two left coins possibly heavy and
              the two right coins possibly light: four answers again, three
              outcomes.
          - text: >
              Neither: every first weighing leaves some branch with four
              answers.
            correct: true
            feedback: >
              One against one fails on the balance, two against two fails on a
              tilt, and those are the only shapes. Four coins cannot be done,
              even though $8 \le 9$.
        feedback: >
          The count promised four and the scale delivers fewer. Some of the
          nine outcome sequences cannot be used, and the question is which.

      - part: Where the slack goes
        reflect: >
          Look at the tilt branches. With $k$ suspects on each pan, a tilt
          leaves $2k$ answers, to be settled by $n - 1$ more weighings with
          $3^{n-1}$ sequences. What do you notice about those two numbers, and
          what does it cost?
        hint: >
          One of them is always even. Is the other?
        answer: >
          $2k$ is even, because the pans hold equally many coins, and $3^{n-1}$
          is odd. An even pile can at best fill $3^{n-1} - 1$ of the slots, so
          each of the two tilt branches wastes one sequence. With two weighings
          a tilt can leave at most $2$ answers, not $3$ — which is why one
          against one is the largest legal first split.
      - ask: >
          Now the branch where every weighing balances. The fake must then be
          a coin that never touched the scale. What can that outcome
          sequence tell you?
        choices:
          - text: >
              Nothing at all, so no coin may sit out every weighing.
            feedback: >
              It can name a coin: if exactly one coin sat out throughout, an
              all-balanced run says it is the fake. That is not nothing.
          - text: >
              Which coin it is, at most, and never whether it is heavy or
              light.
            correct: true
            feedback: >
              A coin that was never weighed leaves no trace of its direction.
              The all-balanced sequence can hold at most one of a coin's two
              answers, so it is useless for a full answer.
          - text: >
              The coin and its direction, provided the earlier weighings were
              well chosen.
            feedback: >
              The earlier weighings all balanced, so the fake never moved a
              pan. No choice of weighings extracts a direction from a coin
              that was never weighed.
        feedback: >
          Three sequences are lost in all: one in each tilt branch to the
          parity of the pans, and the all-balanced one to the missing
          direction.
      - teach: >
          That accounting is the whole proposition. With $n$ weighings and
          only the suspects, the largest pile is $(3^{n} - 3)/2$: three
          sequences are unusable and the rest pair up, one per coin per
          direction. With one known-genuine coin you can pad a pan, so a tilt
          pile can be odd — $k$ suspects against $k - 1$ and the reference —
          and the two tilt sequences come back. The bound becomes
          $(3^{n} - 1)/2$. The all-balanced sequence never comes back.
      - ask: >
          Four weighings, suspects only: $(3^{4} - 3)/2 = 39$ coins. The first
          weighing must leave each tilt branch at most $3^{3} - 1 = 26$
          answers. How many coins go on each pan?
        expects: "13"
        feedback: >
          A tilt leaves $2k \le 26$, so $k = 13$. That puts $26$ coins on the
          scale and $13$ aside; a balance leaves $13$ suspects with $26$
          genuine coins to pad, which is the reference-coin case at three
          weighings, $(27 - 1)/2 = 13$. It fits exactly — the same shape as
          four, four and four for twelve coins.
      - ask: >
          Four weighings and one reference coin: $(3^{4} - 1)/2 = 40$ coins.
          The first weighing puts $k$ suspects on the left and $k - 1$ plus the
          reference on the right, so a tilt leaves $2k - 1$ answers, at most
          $27$. How many suspects go on the left pan?
        expects: "14"
        feedback: >
          $2k - 1 \le 27$ gives $k = 14$: fourteen against thirteen and the
          reference. A tilt now uses all $27$ sequences, and the $13$ coins
          aside are handled exactly as before.

      - part: What the formula does and does not buy
        ask: >
          Someone hands you a whole bag of genuine coins. Can three weighings
          now handle fourteen suspects?
        choices:
          - text: >
              Yes: $2 \cdot 14 = 28$ answers against $27$ sequences is close
              enough once every pan can be padded.
            feedback: >
              Close is not enough: $28 > 27$ already fails the raw count, and
              the all-balanced sequence is still unusable, so the honest
              capacity is $26$ answers.
          - text: >
              No: padding recovers the tilt sequences, but the all-balanced
              sequence still carries no direction, so the limit is $13$.
            correct: true
            feedback: >
              Extra genuine coins buy back what parity cost and nothing more.
              $(3^{3} - 1)/2 = 13$ is the ceiling however many references you
              hold.
          - text: >
              Yes, if the weighings are chosen adaptively.
            feedback: >
              The counting bound holds for every scheme, adaptive or not.
              Adaptivity changes how the scheme is described, not how many
              outcome sequences exist.
        feedback: >
          One reference coin is worth exactly one more suspect, and a hundred
          references are worth the same one.
      - ask: >
          The scheme does not even need to look at earlier results: each coin
          gets a fixed code over left, right and off, one letter per weighing.
          A coin with code (left, right, off) is light. What do the three
          weighings show?
        choices:
          - text: >
              Left down, right down, balanced
            feedback: >
              That is what the coin shows if it is heavy. A light coin lifts
              whichever pan it sits on.
          - text: >
              Right down, left down, balanced
            correct: true
            feedback: >
              A light coin on the left lets the right pan fall, then on the
              right lets the left fall, then sits out. The heavy answer reads
              the mirror image, so one code covers both directions.
          - text: >
              Balanced, balanced, balanced
            feedback: >
              The coin is on the scale in two of the three weighings, and as
              the fake it tips the pan both times.
        feedback: >
          Each coin owns a code and its mirror. Reading the three tilts as one
          base-$3$ word names the coin and its direction at once, with no
          adaptivity at all.
      - ask: >
          With suspects only, what is the fewest weighings that handles a pile
          of $300$ coins?
        expects: "6"
        hint: >
          Find the smallest $n$ with $(3^{n} - 3)/2 \ge 300$.
        feedback: >
          $(3^{5} - 3)/2 = 120 < 300$ and $(3^{6} - 3)/2 = 363 \ge 300$, so
          six. The capacity roughly triples with each extra weighing — two
          more weighings take you from $39$ coins to $363$.
      - teach: >
          Said aloud: "$(3^{n} - 3)/2$. Three outcome sequences are wasted —
          the pans hold equal counts, so each tilt branch is even against an
          odd capacity, and an all-balanced run never shows a direction. A
          reference coin fixes the parity, giving $(3^{n} - 1)/2$."

  - node: quant-puzzles.classics.mislabeled-jars
    hook: >
      This puzzle is over in one draw, and the entire interview is about
      whether you can explain why zero draws fail and why any other single
      draw might not — not about performing the arithmetic.
    explanation: >
      Before any fruit is drawn, count how many labelings are still
      consistent with "every label is wrong": with three categories, the
      number of ways to assign contents so that no jar's true content matches
      its label is the number of derangements of three items, exactly two.
      Zero draws leaves both possibilities open, so some information is
      unavoidably required — the guarantee's lower bound is this count of
      surviving worlds, not a physical argument about jars.

      A single well-chosen draw eliminates one of the two worlds outright only
      if it's taken from the jar labelled "mixed," because that jar's true
      content is forced away from "mixed" by the constraint, leaving exactly
      two possible contents for it — whichever one the drawn fruit reveals
      collapses both derangements to one immediately. A draw from a jar
      labelled with an actual fruit name doesn't have this property: that jar
      could still hold either of the other fruits or the mix, so a single
      fruit doesn't always separate the two surviving worlds.

      Once the "mixed"-labelled jar's true content is known, the rest cascades
      by elimination rather than more draws: the jar labelled with the fruit
      you just identified cannot hold that fruit and cannot be mixed either,
      so its content is forced, and the third jar's follows by exhaustion.
    worked: >
      With two categories instead of three — say two jars holding only red or
      only blue marbles, both labels swapped — there's only one derangement
      of two items, so "all labels wrong" already pins the full assignment:
      the jar labelled red holds blue and vice versa, with zero draws needed.
      Contrast four categories: the derangement count jumps to nine, and a
      single draw, with at most four distinguishable outcomes, can no longer
      guarantee collapsing all nine surviving worlds to one, so the three-jar
      puzzle's "one draw always suffices" doesn't extend to four labels
      without a second draw.
    interview: >
      The question is almost always asked with the constraint stated exactly
      as here — every label wrong — so watch for a weakened version ("at
      least one jar is correctly labelled") where the surviving-worlds count
      differs and one draw may no longer suffice; naming the derangement count
      out loud is the fast way to check.
    pitfalls: >
      Drawing from a jar whose label names an actual fruit, rather than the
      jar labelled "mixed," can leave more than one world consistent with what
      you see — an orange from the jar labelled "apples" leaves that jar as
      either oranges or mixed. Assuming the one-draw answer generalises
      unchanged to more than three categories ignores that the number of
      surviving worlds grows far faster than what a single draw can
      distinguish.
    recap: >
      One draw from the jar labelled "mixed" collapses the two consistent
      derangements to one, and every other jar's true label then follows by
      elimination.
    dialogue:
      - part: How many worlds are left
        teach: >
          Three closed boxes of chocolates: one all dark, one all milk, one
          assorted. Their labels read "dark", "milk" and "assorted", and every
          label is on the wrong box. You may draw chocolates blind, one at a
          time, and look at each.
      - ask: >
          Before drawing anything, how many complete assignments of contents
          to boxes are consistent with every label being wrong?
        expects: "2"
        hint: >
          Decide what the box labelled "dark" holds, then see what is forced.
        feedback: >
          If the "dark" box holds milk, the "milk" box holds dark or
          assorted; dark would leave the "assorted" box truly assorted, a
          right label, so it holds assorted and the "assorted" box holds dark.
          If the "dark" box holds assorted, the "milk" box holds dark and the
          "assorted" box holds milk. Two worlds — the two derangements of
          three things.
      - ask: >
          A candidate says no draw is needed: "every label is wrong, so move
          each label one box along." Does that work?
        choices:
          - text: >
              Yes: a shift puts every label on a different box, so none can
              stay wrong.
            feedback: >
              There are two ways to shift three labels one box along, one in
              each direction, and they disagree on every box. You still have
              to know which one.
          - text: >
              No: the two shifts are exactly the two worlds, and nothing yet
              tells them apart.
            correct: true
            feedback: >
              Moving every label "one along" is a derangement, but so is moving
              them the other way. Zero draws leaves a coin flip, so at least
              one draw is needed.
          - text: >
              No, because a shifted label can land on its own box again.
            feedback: >
              A shift of three labels never returns a label to its box — that
              is not the problem. The problem is that there are two shifts.
        feedback: >
          The lower bound is a count of surviving worlds: two worlds, so zero
          draws cannot be a guarantee.
      - ask: >
          You draw from the box labelled "dark" and get a milk chocolate. What
          do you now know?
        choices:
          - text: >
              That box is the milk box.
            feedback: >
              It might be, or it might be the assorted box, which also
              contains milk chocolates. Both worlds survive.
          - text: >
              Nothing that separates the two worlds.
            correct: true
            feedback: >
              In one world this box holds milk, in the other assorted, and a
              milk chocolate fits both. The draw was spent and nothing moved.
          - text: >
              That box is the assorted box, since it cannot be milk.
            feedback: >
              Nothing forbids it from being milk — its label says "dark", and
              only dark is ruled out.
        feedback: >
          Had the chocolate been dark, the box would be the assorted one and
          everything would follow. So this draw sometimes settles the puzzle —
          and an adversary filling the boxes makes sure it does not.

      - part: The box that cannot be mixed
        reflect: >
          For each box, write what it holds in the first world and in the
          second. Which box should you draw from, so that whatever chocolate
          comes out, only one world fits?
        hint: >
          Look for a box that is pure in both worlds.
        answer: >
          The "dark" box holds milk or assorted, and the "milk" box holds
          assorted or dark — each is mixed in one world, so a single chocolate
          from it can be ambiguous. The box labelled "assorted" holds dark in
          one world and milk in the other. It is pure either way, and the two
          worlds disagree on its contents, so one chocolate from it names the
          world.
      - teach: >
          That is the whole solution: draw once from the box labelled with the
          mixed category. The all-wrong constraint forbids it from being
          mixed, so one chocolate names its contents outright. The rest
          follows without drawing, by elimination.
      - ask: >
          From the "assorted" box you draw a milk chocolate. What does the box
          labelled "dark" hold?
        choices:
          - text: >
              Milk
            feedback: >
              The milk chocolates were just found, in the "assorted" box.
          - text: >
              Dark
            feedback: >
              Then its label would be right, and every label is wrong.
          - text: >
              Assorted
            correct: true
            feedback: >
              It cannot be milk (found elsewhere) or dark (its own label), so it
              is assorted, and the "milk" box holds dark.
        feedback: >
          One draw, then two eliminations. The number of draws is $1$, and
          both halves of the guarantee are in place: two worlds need at least
          one draw, and this one always suffices.

      - part: Change the constraint
        ask: >
          The interviewer changes one word: exactly *one* label is right. How
          many complete assignments are consistent with that?
        expects: "3"
        hint: >
          Choose which label is right; what must the other two do?
        feedback: >
          Pick the correct label in $3$ ways; the other two boxes must then
          swap. Three worlds instead of two.
      - ask: >
          Does one chocolate from the "assorted" box still settle everything?
        choices:
          - text: >
              Yes: it still holds a single kind.
            feedback: >
              Not any more. In the world where its label is the right one, it
              really is assorted.
          - text: >
              No: in one world that box really is assorted, so a milk chocolate
              fits two worlds.
            correct: true
            feedback: >
              The worlds give that box milk, dark, or assorted. A milk
              chocolate fits both "milk" and "assorted", so one draw can leave
              two worlds standing.
          - text: >
              Yes, if you draw from the "dark" box instead.
            feedback: >
              That box holds dark, assorted or milk across the three worlds. A
              dark chocolate fits two of them, so the trouble just moves.
        feedback: >
          The one-draw trick rested entirely on the all-wrong constraint
          forcing one box to be pure. Weaken the constraint and the trick
          goes; recount the worlds before reaching for it.
      - ask: >
          Still with exactly one label right, what is the fewest draws that
          guarantees relabelling every box?
        expects: "2"
        hint: >
          After a milk chocolate from the "assorted" box, which two worlds
          remain, and which box do they disagree about most cleanly?
        feedback: >
          One draw never suffices: whichever box you pick, across the three
          worlds it holds one pure kind, the other pure kind, and assorted, so
          a pure chocolate fits two worlds. Two do: a milk chocolate from the
          "assorted" box leaves the world where "dark" is right (the "dark"
          box holds dark) and the world where "assorted" is right (the "dark"
          box holds milk), and one chocolate from the "dark" box separates
          them. A dark chocolate first is the mirror case.
      - teach: >
          Said aloud: "One draw, from the box labelled mixed. With every label
          wrong there are only two consistent worlds, so zero draws cannot
          work, and that box must be pure, so one fruit names it. The other
          two follow by elimination."

  - node: quant-puzzles.classics.egg-drop
    hook: >
      This is the purest test of working backwards from a budget rather than
      searching forward through drop sequences, and the interviewer is
      listening for the triangular-number argument, not just a memorised
      fourteen.
    explanation: >
      Frame the state as a budget: with a given number of eggs and drops
      remaining, ask how many floors that budget can certify. Once the first
      egg breaks on some drop, only one egg is left, and it must sweep the
      untested floors below it one at a time — no shortcuts, since a second
      break with the last egg tells you nothing further. So a jump of $s$
      floors costs $s$ drops in the worst case, whether the egg breaks
      immediately or survives.

      Working backwards from a total budget of $n$ drops: the very first drop
      can go no higher than floor $n$, because a break there must still be
      resolved by sweeping $n-1$ remaining floors one at a time, using up the
      rest of the budget exactly. If it survives, the budget for the next jump
      is $n-1$, forcing the next jump height down by exactly one, and so on —
      the jump heights must be $n, n-1, n-2, \ldots, 1$, summing to
      $n(n+1)/2$ floors covered for a budget of $n$ drops.

      Solving $n(n+1)/2 \ge \text{floor count}$ for the smallest integer $n$
      gives the answer directly, with no simulation of individual drop
      sequences required.
    worked: >
      A $200$-floor building, two eggs: solve $n(n+1)/2 \ge 200$. At $n=19$,
      $19 \cdot 20/2 = 190 < 200$; at $n=20$, $20 \cdot 21/2 = 210 \ge 200$, so
      $20$ drops suffice and $19$ do not. The schedule is floors
      $20, 39, 57, 74, 90, 105, 119, 132, 144, 155, 165, 174, 182, 189, 195,
      200$, from jumps shrinking $20, 19, 18, \ldots$; a break anywhere costs
      at most $19$ more one-floor sweeps, and no branch exceeds $20$ drops
      total.
    interview: >
      Expect the floor count to change, or the egg count to change to three,
      which needs a genuinely different two-dimensional recursion rather than
      a simple triangular sum — naming that the two-egg formula doesn't extend
      by the same argument is itself a signal you understand why it worked.
    pitfalls: >
      Reusing the same jump size after a surviving drop, rather than shrinking
      it by one, silently assumes an unlimited egg budget and produces a
      schedule that fails on the worst branch. Treating this like binary
      search and halving the remaining floors each time ignores that a second
      break with the last egg is fatal to the search, not just uninformative.
    recap: >
      Two eggs and a budget of $n$ drops cover $n(n+1)/2$ floors via jump
      sizes that shrink by one after every survival, so the minimum drops for
      $100$ floors is $14$ and for $200$ floors is $20$.
    dialogue:
      - part: Halving with two eggs
        teach: >
          Two identical eggs and a $36$-storey building. Somewhere between
          floor $0$ and floor $36$ is the highest floor from which an egg
          survives a drop; from every floor above it, an egg breaks. A
          surviving egg can be reused, a broken one cannot. You want the
          threshold, with as few drops as possible in the worst case.
      - ask: >
          The first instinct is binary search: drop from floor $18$. It
          breaks. With one egg left, how many more drops might you need?
        expects: "17"
        hint: >
          What happens if the last egg breaks before the threshold is pinned?
        feedback: >
          The last egg cannot risk a break above an untested floor, so it
          climbs from floor $1$ one storey at a time: floors $1$ to $17$, up
          to $17$ drops, $18$ in all. Halving was fine for the first egg and
          ruinous for the second.
      - ask: >
          Why can the second egg not halve as well?
        choices:
          - text: >
              It can; it just takes one or two extra drops.
            feedback: >
              Drop the last egg from floor $9$ and watch it break: floors $1$
              to $8$ are untested and you have nothing left to test them with.
              That is not slower, it is a failed search.
          - text: >
              A break with the last egg must leave no untested floor below it,
              so it can only step up one floor at a time.
            correct: true
            feedback: >
              The last egg's break is the final piece of information, so it may
              only happen just above a floor already known to be safe.
          - text: >
              Because the threshold is more likely to be near the bottom.
            feedback: >
              No distribution is involved — this is a worst-case question. The
              constraint is about what a break leaves untested, not where the
              threshold tends to be.
        feedback: >
          So the second egg is a linear sweep, and the whole design question is
          how to place the first egg's drops.
      - ask: >
          Suppose the first egg survives floor $20$ and then breaks at floor
          $27$. How many more drops might the sweep need?
        expects: "6"
        feedback: >
          Floors $21$ through $26$ are untested: six drops. Counting the drop
          that broke, a jump of $7$ floors cost up to $7$ drops. A jump of $s$
          floors costs up to $s$ drops.

      - part: Spend the budget backwards
        reflect: >
          Give yourself a total budget of $n$ drops. How high can the very
          first drop go? If it survives, how big can the next jump be? Say
          what pattern the jumps must follow, and how many floors $n$ drops
          can cover.
        hint: >
          A break on any drop must leave a sweep that fits in the drops still
          unspent.
        answer: >
          The first drop can go no higher than floor $n$: a break there leaves
          $n - 1$ floors to sweep with $n - 1$ drops. If it survives, one drop
          is spent, so the next jump can be at most $n - 1$ floors, then
          $n - 2$, and so on down to $1$. The jumps shrink by one each time,
          and together they cover $n + (n - 1) + \dots + 1 = n(n + 1)/2$
          floors.
      - teach: >
          That is the whole solution. A budget of $n$ drops certifies
          $n(n + 1)/2$ floors with jumps $n, n - 1, \dots, 1$, every branch
          landing exactly on budget. The answer for a building is the smallest
          $n$ with $n(n + 1)/2$ at least the number of floors. The argument
          runs in both directions: any schedule's first drop must sit at most
          $n$ up, each later jump at most one less, so no schedule covers
          more.
      - ask: >
          What is the fewest drops that guarantees the threshold in the
          $36$-storey building?
        expects: "8"
        feedback: >
          $7 \cdot 8/2 = 28 < 36$ and $8 \cdot 9/2 = 36$, so $8$ — the
          building is exactly triangular, and every branch uses all $8$.
      - ask: >
          With that budget, the first drop is from floor $8$. If the first two
          drops survive, from which floor is the third drop?
        expects: "21"
        feedback: >
          Jumps of $8$, then $7$, then $6$: floors $8$, $15$, $21$. The full
          ladder is $8, 15, 21, 26, 30, 33, 35, 36$.
      - ask: >
          Why can no schedule at all guarantee the $36$ floors in $7$ drops?
        choices:
          - text: >
              Binary search needs about $\log_2 36 \approx 5.2$ drops, so $7$
              should leave room.
            feedback: >
              Binary search is not available: its second egg can break above an
              untested floor. The count that matters is the triangular one.
          - text: >
              With $7$ drops the first can sit at most on floor $7$ and each
              later jump is one shorter, so at most $28$ floors are covered.
            correct: true
            feedback: >
              That is the lower bound half, and it applies to every schedule,
              not just the shrinking-jump one.
          - text: >
              Fixed jumps of $6$ floors take more than $7$ drops on some
              branch.
            feedback: >
              True of that plan, but one bad plan proves nothing about the
              others. A lower bound has to cover every schedule.
        feedback: >
          Bound and scheme meet at $8$: the backwards argument limits every
          schedule, and the shrinking ladder achieves it.

      - part: Where the ladder breaks
        ask: >
          A colleague, budget $8$, opens at floor $10$ to cover ground
          faster. The egg breaks. What is the worst-case total number of
          drops?
        expects: "10"
        feedback: >
          One drop at floor $10$, then floors $1$ to $9$ swept one by one:
          $1 + 9 = 10$, two over budget. The first drop sits at most at the
          budget.
      - ask: >
          Another colleague opens correctly at floor $8$, survives, and jumps
          $8$ floors again, to $16$. It breaks. What is the worst-case total
          now?
        expects: "9"
        feedback: >
          Two drops so far, then floors $9$ to $15$: $2 + 7 = 9$. Keeping the
          jump size after a survival forgets that a drop was spent; each jump
          must be one shorter than the last.
      - teach: >
          Said aloud: "Once the first egg breaks, the second sweeps one floor
          at a time, so a budget of $n$ allows jumps of $n, n - 1, \dots$,
          covering $n(n + 1)/2$ floors. For $100$ floors that is $14$, since
          $14 \cdot 15/2 = 105$ and $13$ gives only $91$."

  - node: quant-puzzles.classics.phase-scheduling
    hook: >
      Any puzzle that asks for the minimum total time or cost of a sequence of
      moves is quietly asking you to find a rate, not to search over
      orderings — missing this reframe is why these puzzles feel
      combinatorial when they're actually arithmetic.
    explanation: >
      The reframe is to stop asking which sequence of moves is fastest and
      instead ask what progress costs per unit, and whether that cost ever
      changes. Cut the process into phases inside which the marginal cost per
      unit of progress is constant, count how many units each phase must
      cover, and let the only real decision be where the phase boundaries
      fall.

      This works because listing the rates does two jobs at once: it turns
      the optimization into comparing a handful of numbers instead of
      searching a combinatorial space of orderings, and it supplies the
      matching lower bound for free — no schedule can beat the best available
      rate in whichever phase it's currently in, so a schedule that matches
      the rate in every phase is automatically optimal.

      The skill is spotting where the rate actually changes. It's rarely
      announced explicitly; it's usually a hidden threshold in the problem's
      physical setup — a resource crossing a capacity boundary, a group's
      bottleneck member changing, a process switching from parallel to serial
      effort.
    worked: >
      A battery charges at $2\%$ per minute while its charge is below $80\%$,
      then drops to $0.5\%$ per minute above that; find the minimum time from
      empty to $95\%$. Phase one covers $0$ to $80\%$ at the fast rate:
      $80/2=40$ minutes. Phase two covers the remaining $15$ points at the
      slow rate: $15/0.5=30$ minutes. Total: $40+30=70$ minutes, with the
      phase boundary sitting exactly where the rate itself changes.
    interview: >
      The bridge, camel, and fuse puzzles are literally this technique
      applied to three different resources — time, banana inventory, and burn
      length — so once you're asked any "minimum time or cost" puzzle, naming
      the phases and their rates out loud before computing anything is the
      expected first move.
    pitfalls: >
      Searching over move orderings by hand, rather than identifying the rate
      structure first, wastes time and tends to land on a locally-good but
      globally suboptimal schedule. Missing a rate change — treating the
      whole process as one phase when a threshold is crossed partway through —
      silently uses the wrong constant and gives a wrong total.
    recap: >
      Split the process into constant-rate phases, size each phase, and
      optimize only the boundaries — the rate list is simultaneously the
      schedule and its own lower-bound proof.
    dialogue:
      - part: Three pancakes, one pan
        teach: >
          A pan holds two pancakes at a time. Each pancake needs $2$ minutes on
          one side and then $2$ minutes on the other; flipping and swapping
          take no time. You have three pancakes to cook.
      - ask: >
          Cook them the obvious way: two pancakes on both sides, then the
          third on both sides. How many minutes does that take?
        expects: "8"
        feedback: >
          $2 + 2$ minutes for the first pair, then $2 + 2$ for the third
          pancake alone: $8$.
      - ask: >
          Where do those $8$ minutes go to waste?
        choices:
          - text: >
              In the flips: each pancake is turned over once.
            feedback: >
              Flips are free here. The waste is in minutes the pan spends doing
              less than it could.
          - text: >
              In the last $4$ minutes, when half the pan is empty.
            correct: true
            feedback: >
              For four of the eight minutes the pan cooks one side instead of
              two. The schedule ran at half rate for a whole phase.
          - text: >
              Nowhere: each pancake has to sit in the pan for $4$ minutes.
            feedback: >
              Each does, but two can sit there at once. Three pancakes times
              $4$ minutes is $12$ pancake-minutes, and the pan supplies $2$
              per minute.
        feedback: >
          The obvious plan has two phases, one at full rate and one at half
          rate. The question is whether the slow phase can be avoided.
      - reflect: >
          Stop thinking about which pancake goes in when. Count the total work
          and the pan's capacity per minute. What is the least time any
          schedule could take, and what would a schedule have to do to reach
          it?
        answer: >
          Six sides at $2$ minutes each is $12$ side-minutes of work, and the
          pan delivers at most $2$ side-minutes per minute, so no schedule
          beats $6$ minutes. Reaching it means never letting a slot go empty:
          cook the first side of pancakes $1$ and $2$, then pancake $1$'s
          second side alongside pancake $3$'s first, then the second sides of
          $2$ and $3$.
      - ask: >
          Which schedule finishes in $6$ minutes?
        choices:
          - text: >
              $1$ and $2$ first side; $1$ and $2$ second side; $3$ both sides
            feedback: >
              That is the obvious plan, $8$ minutes: the last phase runs at
              half rate.
          - text: >
              $1$ and $2$ first side; $1$ second side with $3$ first side; $2$
              and $3$ second side
            correct: true
            feedback: >
              Three phases of $2$ minutes with the pan full in every one, so
              the schedule meets the bound exactly.
          - text: >
              $1$ and $3$ first side; $1$ and $3$ second side; $2$ both sides
            feedback: >
              Relabelling the pancakes does not help: the last phase is still
              one pancake in a two-slot pan.
        feedback: >
          The fix did not come from searching orders. It came from the rate:
          once you know the bound is $6$, the only job is to keep the pan full
          in every phase.
      - teach: >
          That is the technique. For a minimum-time or minimum-cost puzzle,
          find the cost per unit of progress, cut the plan into phases inside
          which that cost is constant, and count the units in each phase. The
          only free choices are the phase boundaries. And the same list of
          rates is the lower bound: no schedule beats the best rate available
          in each phase.

      - part: Counting the rate, not the moves
        ask: >
          Nine people must cross a river in a boat that holds three, one of
          whom rows; it cannot cross empty. Each crossing takes $5$ minutes.
          On a round trip — over and back — what is the most the far bank can
          gain?
        expects: "2"
        feedback: >
          Three go over and at least one must row back: a net gain of $2$
          people per $10$ minutes. That is the rate for every phase but the
          last.
      - ask: >
          What is the least total time to get all nine across?
        expects: "35"
        hint: >
          The final crossing does not come back.
        feedback: >
          The last crossing carries $3$ and returns no one, so the other $6$
          people need three round trips at $2$ each. That is $3 \cdot 10 + 5 =
          35$ minutes: three phases at the round-trip rate, one at the
          final-crossing rate.
      - ask: >
          Why can no plan get everyone across faster than $35$ minutes?
        choices:
          - text: >
              With $f$ trips over there are $f - 1$ trips back, so at most
              $3f - (f - 1) = 2f + 1$ people end on the far bank; that needs
              $f \ge 4$, so $7$ crossings.
            correct: true
            feedback: >
              The rate gives the bound directly, for every plan at once, and
              the schedule above meets it.
          - text: >
              Because sending three every time is the greedy plan, and greedy
              is optimal.
            feedback: >
              Greedy plans fail all the time — the pancakes were one. What
              makes $35$ optimal is a count that applies to every plan.
          - text: >
              Because you tried several orders and none beat it.
            feedback: >
              A handful of failed attempts is evidence, not proof. The bound
              comes from the rate: $2f + 1 \ge 9$.
        feedback: >
          Listing the rate did both jobs: it built the schedule and it proved
          nothing does better.

      - part: Where the rate bound fails
        ask: >
          Back to the pan. The work-over-capacity bound for a single pancake
          says $4/2 = 2$ minutes. The true answer is $4$. Why?
        choices:
          - text: >
              The bound is wrong in general; it only worked for three.
            feedback: >
              It holds for every number of pancakes; it is a lower bound. The
              question is when a schedule can meet it.
          - text: >
              One pancake cannot fill both slots, so every phase runs at half
              rate.
            correct: true
            feedback: >
              A bound from capacity is reached only if the capacity can be kept
              full. A lone pancake occupies one slot, and its two sides cannot
              cook at the same time.
          - text: >
              Flipping a single pancake takes longer.
            feedback: >
              Flips are free. The obstacle is that two sides of one pancake
              cannot be in the pan simultaneously.
        feedback: >
          Always check whether the best rate is actually available in a phase.
          When it is not, that phase gets its own, slower rate.
      - ask: >
          How many minutes for five pancakes in the same pan?
        expects: "10"
        feedback: >
          Ten sides at $2$ minutes is $20$ side-minutes, at $2$ per minute:
          $10$. With two or more pancakes the pan can always be kept full —
          rotate them as with three — so the bound is met.
      - teach: >
          The next three puzzles are this move with different resources. A
          torch party pays its slowest walker per crossing, so the question is
          how often each slow walker is paid. A camel's cost per mile falls as
          its stock shrinks. A fuse burns at a fixed total rate that doubles
          when lit from both ends.

  - node: quant-puzzles.classics.bridge-crossing
    hook: >
      The instinctive plan — let the fastest person ferry everyone else
      across one at a time — is a trap that costs extra minutes here, and the
      interviewer is watching for whether you notice before committing to it.
    explanation: >
      The naive plan pays for the two slowest people separately, once each,
      as they cross alone with an escort. The fix is a rate-phase reframe:
      instead of asking who escorts whom, ask how many times you have to pay
      for your slowest people, and whether you can pay for both at once.
      Sending the two slowest across together in the same trip pays their
      cost exactly once — the price of that trip is set by whichever of the
      two is slower, not by adding both times.

      That saving isn't free: pairing the two slow people together requires
      the torch to already be on their side and to get back afterward, which
      costs two extra fast round trips. The trade is worth it exactly when the
      second-slowest person's solo crossing cost exceeds what those extra fast
      trips cost — true whenever the two slow times are large next to the fast
      ones.

      The optimality argument mirrors the rate-and-phase lower bound
      directly: whichever single crossing carries the slowest person either
      carries the second-slowest along too, paying for both at once, or it
      doesn't, forcing a separate crossing — and the second structure is
      provably worse whenever the fast pair is cheap enough to shuttle twice.
    worked: >
      Crossing times $1, 2, 8, 9$ minutes. Fastest-ferries-everyone:
      $2+1+8+1+9=21$ minutes. Pairing the two slowest: the two fastest cross
      first ($2$), the fastest returns ($1$), the two slowest cross together
      ($9$), the second-fastest returns ($2$), the two fastest cross again
      ($2$) — total $2+1+9+2+2=16$ minutes, five minutes faster than the
      naive plan.
    interview: >
      Expect the numbers to be swapped in, or the party size to grow to five
      or six — the same pairing logic extends, but the optimal grouping among
      more than two slow people needs checking case by case rather than a
      single formula.
    pitfalls: >
      Assuming the fastest person should personally escort every crossing
      overlooks that the point isn't who's fastest, it's how many times the
      slow times get paid. Sending the two slowest across in separate trips
      rather than together is the single most common suboptimal choice, even
      when candidates correctly identify that the fast pair should shuttle
      the torch.
    recap: >
      Pair the two slowest people into one crossing so their cost is paid
      once, not twice — the same reframe that generalizes to any four
      crossing times.
    dialogue:
      - part: Four walkers, one torch
        teach: >
          Four people must cross a bridge at night. They take $1$, $3$, $7$
          and $8$ minutes to cross alone. The bridge holds two at a time, a
          pair walks at the slower one's pace, and every crossing needs the
          single torch, which must be walked back.
      - ask: >
          The natural plan: the $1$-minute walker escorts each of the others
          across in turn, bringing the torch back each time. How many minutes
          does it take?
        expects: "20"
        hint: >
          Three trips over, two trips back.
        feedback: >
          Over with $3$, back ($1$), over with $7$, back ($1$), over with $8$:
          $3 + 1 + 7 + 1 + 8 = 20$. The order of the three escorts does not
          change the sum.
      - ask: >
          Which minutes in that $20$ are worth attacking?
        choices:
          - text: >
              The two returns: $2$ minutes spent walking backwards.
            feedback: >
              Those are already the cheapest returns possible — nobody walks
              faster than $1$ minute. There is little to win there.
          - text: >
              The $7$ and the $8$, paid on two separate crossings.
            correct: true
            feedback: >
              The $8$ must be paid once whatever you do. The $7$ is only paid
              because the slow walkers cross on different trips.
          - text: >
              The $3$: the second-fastest should not need an escort.
            feedback: >
              The $3$ needs the torch like everyone else, and someone has to
              walk it back. At $3$ minutes that crossing is cheap anyway; the
              big numbers are elsewhere.
        feedback: >
          Look at the expensive people first. Each crossing costs its slowest
          walker, so the question is how many times each slow walker gets
          paid for.
      - reflect: >
          How could the $7$ stop being paid separately? Say what you would do,
          and what it forces you to arrange before and after that crossing.
        hint: >
          After the slow pair crosses, someone has to bring the torch back.
        answer: >
          Send the $7$ and $8$ over together, so that crossing costs $8$ and
          the $7$ rides free. But neither of them should carry the torch back —
          that would pay a slow walker again — so a fast walker must already be
          waiting on the far side. That means the two fast walkers cross first
          and one of them returns, and afterwards the other fast walker brings
          the torch back to collect.

      - part: Paying the slow pair once
        ask: >
          In that plan, after the $7$ and $8$ cross together, who brings the
          torch back?
        choices:
          - text: >
              The $1$-minute walker
            feedback: >
              The $1$ already came back once to hand the torch to the slow
              pair, so the $1$ is on the near side.
          - text: >
              The $3$-minute walker
            correct: true
            feedback: >
              The $3$ crossed first with the $1$ and stayed on the far side,
              ready to return. That is the price of the plan: the $3$ is paid
              twice more.
          - text: >
              The $7$-minute walker, as the faster of the pair
            feedback: >
              Then the $7$ is paid again on the way back and again on the way
              over — the saving is gone.
        feedback: >
          $1$ and $3$ over, $1$ back, $7$ and $8$ over, $3$ back, $1$ and $3$
          over.
      - ask: >
          How many minutes does that plan take?
        expects: "18"
        feedback: >
          $3 + 1 + 8 + 3 + 3 = 18$, two minutes better than escorting. The $7$
          is never paid, and the $1$-minute return it replaced is gone too; the
          cost is two extra trips by the $3$.
      - teach: >
          This is the rate view. Write the times as $a \le b \le c \le d$.
          Escorting costs $2a + b + c + d$: everyone is paid once, plus two
          returns by the fastest. Pairing the slow two costs $a + 3b + d$: the
          slowest is paid once, the second-slowest never, and the
          second-fastest three times. Pairing wins exactly when $2b < a + c$.
      - ask: >
          Why can no plan beat $18$ for these four?
        choices:
          - text: >
              Because $18$ is smaller than $20$, the only other plan.
            feedback: >
              There are many other plans. A minimum needs an argument that
              covers all of them.
          - text: >
              The crossing that carries the $8$ either carries the $7$ too or
              does not; the best plan of each shape is $18$ and $20$.
            correct: true
            feedback: >
              Splitting on the slowest walker's crossing leaves two structures.
              If the $7$ crosses separately it is paid in full, which leaves
              escorting as the best of that shape.
          - text: >
              Because the fastest walker should always carry the torch back.
            feedback: >
              The $18$-minute plan has the $3$ carrying it back once. A rule of
              thumb is not a lower bound.
        feedback: >
          Look at the extremes first: the slowest walker's crossing decides the
          structure, and each structure has an obvious best schedule.

      - part: When pairing loses
        ask: >
          Now the times are $1$, $4$, $5$ and $9$. What is the minimum total
          time?
        expects: "20"
        hint: >
          Compare $2b$ with $a + c$, or just price both plans.
        feedback: >
          Escorting: $2 + 4 + 5 + 9 = 20$. Pairing: $1 + 12 + 9 = 22$. Here
          $2b = 8 > a + c = 6$, so escorting wins.
      - ask: >
          Why does pairing the slow two lose this time?
        choices:
          - text: >
              The $9$ is too slow to pair with anyone.
            feedback: >
              The $9$ is paid exactly once in both plans. Its size does not
              decide anything.
          - text: >
              Pairing saves the $5$ and one $1$-minute return, but pays the $4$
              twice: $8$ against $6$.
            correct: true
            feedback: >
              The second-fastest is expensive here. Shuttling it costs more
              than the slow crossing it saves.
          - text: >
              With four people, escorting is always optimal.
            feedback: >
              The first set of times, $1, 3, 7, 8$, gave $18$ by pairing
              against $20$ by escorting. Which plan wins depends on the times.
        feedback: >
          The rate comparison is the whole decision: what pairing saves
          ($a + c$) against what it costs ($2b$).
      - teach: >
          Said aloud: "Each crossing costs its slowest walker, so I count how
          often each slow walker is paid. Pairing the two slowest saves the
          second-slowest's crossing and a fast return, at the price of two
          trips by the second-fastest. For $1, 2, 5, 10$ that is $17$ against
          $19$."

  - node: quant-puzzles.classics.camel-bananas
    hook: >
      The answer isn't a single division — the cost per mile itself falls in
      steps as the pile shrinks, and missing a threshold crossing is the
      single most common way to get this puzzle's number wrong.
    explanation: >
      Treat the banana stock as the state variable that sets the rate. Moving
      the entire stock forward one mile needs $\lceil \text{stock} /
      \text{capacity} \rceil$ loaded trips and one fewer return trip, since
      the final forward trip never needs to come back, so the cost is
      $2\lceil \text{stock}/\text{capacity}\rceil - 1$ bananas per mile. That
      cost only changes at the exact miles where the stock crosses a multiple
      of the capacity, so those crossings are the phase boundaries, and
      everywhere between them the rate is constant.

      The number of phases scales with how many multiples of the capacity the
      starting stock exceeds — a stock more than twice the capacity needs an
      expensive first phase, a cheaper middle phase once it's below twice
      capacity, and a final, cheapest phase once it's down to a single load.
      A larger starting stock relative to capacity just adds more phases at
      the top, each cheaper than the last.

      Within any one phase, the arithmetic is just distance covered equals
      bananas burned divided by that phase's per-mile rate — the same rate
      bookkeeping as any other rate-and-phase puzzle, just with a resource
      pile instead of a clock.
    worked: >
      $2000$ bananas, capacity $1000$, target only $400$ miles. The stock
      starts inside the three-bananas-per-mile phase (between $1000$ and
      $2000$) and stays there until it burns down to $1000$, which takes
      $(2000-1000)/3 \approx 333.33$ miles. The remaining
      $400-333.33\approx 66.67$ miles are covered at one banana per mile,
      burning $66.67$ more bananas. Delivered at mile $400$:
      $1000-66.67 \approx 933.33$ bananas.
    interview: >
      A common extension asks for the largest distance reachable at all with
      a given stock and capacity, or how many phases a stock of several
      capacities' worth requires — the pattern is one phase per multiple of
      capacity the stock starts above, each cheaper than the last.
    pitfalls: >
      Using $2\lceil \text{stock}/\text{capacity}\rceil$ instead of
      subtracting the one saved return trip overcounts every phase's cost by
      one trip's worth. Applying a single phase's rate across the whole
      journey, without checking whether the stock crosses a capacity
      threshold partway through, silently uses the wrong constant for part of
      the distance.
    recap: >
      The cost per mile is $2\lceil \text{stock}/\text{capacity}\rceil - 1$
      bananas, constant within each capacity-multiple band and cheaper in
      every band below it — sum distance covered phase by phase until the
      stock or the distance runs out.
    dialogue:
      - part: One load, or many
        teach: >
          A donkey stands by a pile of $180$ carrots; the market is $50$ km
          away. It carries at most $60$ carrots at a time and eats one carrot
          for every kilometre it walks, loaded or not. You may drop carrots
          anywhere along the road and pick them up later.
      - ask: >
          The simplest plan: load $60$ and walk straight to market. How many
          carrots arrive?
        expects: "10"
        feedback: >
          $60 - 50 = 10$, and $120$ carrots never leave the pile. To use them,
          the donkey has to shuttle the pile forward in stages.
      - ask: >
          To move the whole pile of $180$ forward by one kilometre, how many
          carrots does the donkey eat?
        expects: "5"
        hint: >
          Count the loaded trips forward, then the empty trips back.
        feedback: >
          Three loads, so three trips forward, and two walks back to fetch the
          second and third — the last trip never returns. That is $5$ km
          walked per km of progress: $5$ carrots per km.
      - ask: >
          Does the pile keep costing $5$ carrots per km all the way to market?
        choices:
          - text: >
              Yes: the donkey's appetite and load never change.
            feedback: >
              Appetite per km walked is fixed, but the number of km walked per
              km of progress depends on how many loads the pile needs.
          - text: >
              No: once the pile fits in two loads, it costs $3$ per km, and in
              one load, $1$.
            correct: true
            feedback: >
              Two loads take two trips forward and one back: $3$. One load is a
              single walk: $1$. The rate falls each time the pile shrinks past
              a multiple of $60$.
          - text: >
              No: it gets cheaper by one carrot per km as the pile shrinks.
            feedback: >
              The rate does not slide smoothly. It is $5$ for any pile from
              $121$ to $180$ and jumps to $3$ only at $120$.
        feedback: >
          The cost per km is set by the size of the pile, and it changes only
          at $120$ and $60$. Those are the phase boundaries.

      - part: Cross each boundary exactly
        reflect: >
          Suppose the donkey stops shuttling at a cache holding $122$ carrots.
          What does the pile cost per km from there, and what would have been
          the better place to stop? State the rule this suggests.
        hint: >
          How many loads is $122$ carrots?
        answer: >
          $122$ carrots is three loads, one of them just $2$ carrots, so every
          km still costs $5$ — two extra km of walking per km, to move two
          carrots. Shuttling another $0.4$ km at the $5$-rate would have
          burned those $2$ and left exactly $120$, after which every km costs
          $3$. The rule: keep shuttling at the current rate until the pile is
          exactly a whole number of loads, then drop to the cheaper rate;
          never drag a partial extra load.
      - teach: >
          So the plan is a list of rates and the distances at which they
          change. A pile of $s$ carrots with loads of $C$ costs
          $2\lceil s/C \rceil - 1$ carrots per km — loaded trips forward, one
          fewer back. Each phase burns exactly one load, $C$ carrots, at its
          rate, and the phase boundaries sit where the pile hits a multiple of
          $C$.
      - ask: >
          How many km does the first phase cover, burning $60$ carrots at $5$
          per km?
        expects: "12"
        feedback: >
          $60/5 = 12$ km, leaving $120$ carrots cached at km $12$.
      - ask: >
          The second phase burns $60$ more at $3$ per km. At which kilometre
          does the pile become a single load?
        expects: "32"
        feedback: >
          $60/3 = 20$ km more, so km $12 + 20 = 32$, with $60$ carrots.
      - ask: >
          How many carrots reach the market?
        expects: "42"
        feedback: >
          The last $50 - 32 = 18$ km are walked once, at $1$ per km:
          $60 - 18 = 42$. Phases of $12$, $20$ and $18$ km at rates $5$, $3$
          and $1$.

      - part: Why nothing beats it
        ask: >
          Why can no plan deliver more than $42$?
        choices:
          - text: >
              Because the shuttling plan above is the most natural one.
            feedback: >
              Natural is not a proof. The argument has to hold for any plan,
              including strange ones with many small caches.
          - text: >
              At every point of the road, while more than $120$ carrots must
              pass it, the donkey crosses it at least $5$ times; while more than
              $60$, at least $3$.
            correct: true
            feedback: >
              Each crossing eats a carrot per km, so the rates are lower bounds
              on any plan, km by km. A plan that pays exactly those rates — like
              this one — is optimal.
          - text: >
              Because the donkey can carry only $60$, so at most $60$ can
              ever arrive.
            feedback: >
              That caps the answer at $60$, a true but weak bound. The real
              question is how many of those $60$ survive the road.
        feedback: >
          The rate list is the schedule and the proof at once: no plan beats
          the best available rate in any phase.
      - ask: >
          A candidate prices the first phase at $6$ carrots per km — three
          trips out and three back. What has gone wrong?
        choices:
          - text: >
              Nothing: the donkey must return to the start after each trip.
            feedback: >
              After the last load moves forward there is nothing left behind to
              fetch, so that walk back is never needed.
          - text: >
              The last load never needs a return trip, so it is $5$, not $6$.
            correct: true
            feedback: >
              Loaded trips forward, one fewer back: $2 \cdot 3 - 1 = 5$. The
              extra return would cost one carrot per km for $12$ km.
          - text: >
              The rate should be $3$, one per load.
            feedback: >
              That forgets the walks back entirely. The donkey has to return to
              fetch the second and third loads.
        feedback: >
          $2\lceil s/C \rceil - 1$: the minus one is the return that the final
          load never makes.
      - teach: >
          Said aloud for the classic: "Three thousand bananas cost $5$ a mile
          until $2000$ are left, which takes $200$ miles; then $3$ a mile until
          $1000$ are left, another $333\tfrac{1}{3}$; then $1$ a mile for the
          rest. $533$ arrive."

  - node: quant-puzzles.classics.fuses
    hook: >
      The whole puzzle turns on one fact worth having ready cold — lighting a
      fuse at both ends always halves its total burn time, no matter how
      unevenly it burns — and the rest is just applying that fact twice.
    explanation: >
      A fuse lit from one end has a well-defined total burn time $T$ purely
      by definition — however uneven its rate along the length, "burns for
      $T$ minutes from one end" is just what $T$ means. Lighting it from both
      ends at once puts two flame fronts consuming the same total length
      between them, and because they advance concurrently from opposite
      directions, they must meet at exactly $T/2$: any uneven segment slowing
      one front down is being attacked from the other direction too, so the
      irregular rate cancels out of the meeting time even though it doesn't
      cancel out of where the two fronts physically meet.

      The same fact applies recursively to any unburned remainder, not just a
      whole fresh fuse — a partially-burned stretch, considered on its own,
      still has a well-defined remaining one-end burn time, and lighting its
      free end while it's already burning from the other end again halves
      whatever time was left. Chaining this twice is exactly the classic
      trick: burn one fuse from both ends to measure $T/2$, then use that
      elapsed time to identify how much single-end time remains on a second
      fuse, then halve that remainder too.

      This is the rate-and-phase idea in a different costume: burning both
      ends is a rate change, doubling the consumption rate for as long as
      it's applied, and choosing when to apply it is choosing a phase
      boundary exactly as in the bridge or camel puzzles.
    worked: >
      Two fresh $40$-minute fuses, measure $30$ minutes. Light fuse A at both
      ends and fuse B at one end at time $0$. A finishes at $t=20$ (half of
      $40$), at which point B — burning normally the whole time — has
      $40-20=20$ minutes of single-end burn time left. Light B's free end
      now: its remaining stretch finishes in half of that remaining time,
      $10$ more minutes, landing at $t=20+10=30$ — exactly the target, and
      $3/4$ of the original $40$.
    interview: >
      Expect the fuse lengths to change so the target is some other multiple
      of a quarter of the total time — the technique always lands on $T/2$
      after the first both-ends burn and $3T/4$ after the second, so a target
      that isn't a quarter-fraction of the fuse length signals you need a
      third fuse or a different combination.
    pitfalls: >
      Conflating "half the elapsed clock time so far" with "half of a fuse's
      own remaining burn time" causes errors once more than one fuse is in
      play — the halving fact is always about a fuse's own total or remaining
      time. Relighting the end that's already burning, instead of the fuse's
      unlit free end, doesn't create a second flame front and doesn't halve
      anything.
    recap: >
      Lighting a fuse at both ends always consumes it in exactly half its
      normal single-end time regardless of profile, and applying that fact
      twice reaches $45$ minutes from two $60$-minute fuses, or $30$ from two
      $40$-minute ones.
    dialogue:
      - part: A fuse that burns unevenly
        teach: >
          A fuse burns for exactly $48$ minutes end to end, but not evenly.
          This one happens to be made so that its left half takes $40$
          minutes to burn and its right half only $8$. In general you will not
          know the profile — only the total.
      - ask: >
          Light it at the left end. How many minutes until the flame reaches
          the midpoint?
        expects: "40"
        feedback: >
          The whole left half has to burn: $40$ minutes, not $24$. Halfway
          along the fuse is not halfway through its time, so cutting or
          marking a fuse measures nothing.
      - ask: >
          Now light a fresh copy at both ends at once. After how many minutes
          do the two flames meet?
        expects: "24"
        hint: >
          The right flame finishes the right half at minute $8$. How much of
          the left half's $40$ minutes is still unburned then, and how many
          flames are eating it?
        feedback: >
          By minute $8$ the right half is gone and the left flame has eaten $8$
          of the left half's $40$ minutes, leaving $32$. Two flames now work on
          it, so it lasts $16$ more: they meet at $8 + 16 = 24$ — half of $48$,
          even though they meet far from the middle.
      - reflect: >
          You got exactly half of $48$ from a wildly lopsided fuse. Would any
          other profile have given a different answer? Explain why or why not
          without doing another computation.
        hint: >
          Measure the fuse in minutes of burning rather than in centimetres.
        answer: >
          No. Think of the fuse as $48$ minutes of burning laid end to end.
          Each flame eats one minute's worth per minute, wherever it happens
          to be, so two flames eat two minutes' worth per minute and the whole
          fuse is gone in $24$. The profile decides *where* the flames meet,
          never *when*.

      - part: Halving, then halving the rest
        teach: >
          That is the one fact the puzzle runs on. A fuse, or any unburned
          remainder of one, lit at both ends lasts exactly half of its own
          remaining one-end burn time, whatever the profile. Lighting the
          second end is a rate change — consumption doubles from that moment —
          so the design question is only when to make it.
      - ask: >
          You have two $48$-minute fuses, A and B, and matches. Which plan
          measures $36$ minutes from the moment you start?
        choices:
          - text: >
              Light A at both ends; when it dies, light B at both ends.
            feedback: >
              That gives $24 + 24 = 48$. B sat unlit for the first $24$
              minutes, so its time was wasted rather than half spent.
          - text: >
              Light A at both ends and B at one end together; when A dies,
              light B's other end.
            correct: true
            feedback: >
              B burns at the single rate while A measures $24$, then at the
              double rate for the rest.
          - text: >
              Light A at one end; when it dies, light B at both ends.
            feedback: >
              That gives $48 + 24 = 72$. A at one end only measures its full
              length.
        feedback: >
          Two phases: B at one flame while A measures half, then B at two
          flames until it dies.
      - ask: >
          In that plan, A dies at minute $24$. What do you know about B at
          that moment?
        choices:
          - text: >
              Half of its length has burned.
            feedback: >
              Only if it burns evenly, and it need not. Length tells you
              nothing; time is the only thing you can account for.
          - text: >
              Exactly $24$ minutes of one-end burn time remain on it.
            correct: true
            feedback: >
              It has burned at one flame for $24$ of its $48$ minutes, so the
              unburned stretch would take $24$ more minutes from one end —
              wherever along the fuse that stretch begins.
          - text: >
              Nothing, because its profile is unknown.
            feedback: >
              The profile hides where the flame is, not how much burning time
              is left. That is $48 - 24$, whatever the profile.
        feedback: >
          The halving fact is about a fuse's own remaining time, and the
          remaining time is all you ever need to track.
      - ask: >
          You light B's free end at minute $24$. At what minute does B die?
        expects: "36"
        feedback: >
          $24$ minutes of burn time left, eaten from both ends: $12$ more
          minutes, so B dies at $24 + 12 = 36$. That is $3/4$ of $48$, the same
          shape as $45$ from two $60$-minute fuses.

      - part: Reading the clock correctly
        ask: >
          With the same two fuses, can you measure exactly $12$ minutes?
        choices:
          - text: >
              No: the only times available are $24$ and $48$.
            feedback: >
              Two moments in the plan above are $24$ and $36$, and the stretch
              between them is a timer in its own right.
          - text: >
              Yes: it is the interval from A's death at $24$ to B's death at
              $36$.
            correct: true
            feedback: >
              Start whatever needs timing when A dies; stop it when B dies.
              Every event in the schedule is a usable mark.
          - text: >
              Yes: light one fuse at both ends and wait until a quarter of it
              has burned.
            feedback: >
              "A quarter of it" is a length, and lengths measure nothing on an
              uneven fuse. You cannot see a quarter of the time.
        feedback: >
          The schedule makes marks at $24$ and $36$; any difference of marks
          is a measurable interval.
      - ask: >
          At minute $24$ a candidate relights B at the end that is already
          burning, instead of the far end. When does B die?
        choices:
          - text: >
              At minute $36$, the same as before.
            feedback: >
              A second match at a burning end adds no second flame front. The
              rate stays single.
          - text: >
              At minute $48$, as if nothing had been done.
            correct: true
            feedback: >
              One flame front, still at the single rate, so B finishes its
              remaining $24$ minutes at minute $48$.
          - text: >
              At minute $30$, since it is now burning twice as hard.
            feedback: >
              The rate doubles only when a second front starts from the other
              end. A match at the burning end changes nothing.
        feedback: >
          The doubling comes from two fronts working from opposite ends of the
          unburned stretch, so the second match always goes on the free end.
      - teach: >
          Said aloud: "Both ends halves the time whatever the profile, since
          two flames eat burn time twice as fast. Light A at both ends and B at
          one; A dies at $30$, B has $30$ left; light B's other end and it dies
          at $45$."

  - node: quant-puzzles.classics.protocol-design
    hook: >
      Every "no communication after this point" puzzle is secretly the same
      design problem — build every player's action off one shared public
      statistic — and recognising that shape immediately is worth more than
      knowing any single puzzle's answer.
    explanation: >
      These puzzles share a rigid shape: the players agree a strategy while
      still together, are then separated, and each must act using only their
      own private observation plus whatever was agreed in advance. That makes
      each player's action a fixed, pre-committed function of their private
      view — nothing adaptive can happen once the private observations are
      revealed, since there's no channel left to be clever through.

      The design goal that actually matters is almost never "make each
      individual more likely to be right" — for many of these puzzles that
      number is fixed by symmetry and can't be moved. The goal instead is to
      make the players' mistakes coincide rather than scatter: independent
      guessers each fail independently, so a group succeeds only with the
      product of each person's success chance, which collapses fast;
      correlated guessers can be arranged so the wrongness concentrates onto a
      single predictable player or event, rather than spreading across the
      group.

      The recipe is to find some function of the full joint configuration — a
      parity, a residue, a count, a signal one designated player controls —
      that each individual can approximately reconstruct from their own
      private view plus the agreed rule, and have every player act as if that
      shared statistic is exactly true. When it holds for everyone
      simultaneously, correctness is a shared event, not many separate coin
      flips.
    worked: >
      Two prisoners, each seeing only the other's hat colour, must
      simultaneously guess their own. Agree: player one guesses the same
      colour they see, player two guesses the opposite. Checking all four hat
      combinations: whenever the hats match, player one guesses correctly
      (seeing the same colour as their own hat); whenever the hats differ,
      player two guesses correctly (the opposite of what they see is exactly
      their own hat). Every combination has at least one correct guess, even
      though each player alone is still right only half the time.
    interview: >
      The tell is a phrase like "design a strategy so that at least one of
      you is right" or "so that all but one of you survive" — the
      interviewer is checking whether you reach for correlating errors
      immediately, rather than trying to make each individual's private
      reasoning better, which for most of these puzzles is a dead end.
    pitfalls: >
      Spending effort trying to improve any one player's individual odds, when
      the structure of the puzzle fixes that number by symmetry no matter the
      strategy, wastes time that should go into the correlation design
      instead. Assuming any real-time signalling is available during the
      separated phase, beyond what the puzzle explicitly grants, breaks the
      whole premise these puzzles are built on.
    recap: >
      Pre-agreed protocols win by correlating who's wrong, not by improving
      anyone's individual chance — every scheme in this family reduces to
      finding one shared statistic every player can act on.
    dialogue:
      - part: Two coins, two guesses
        teach: >
          Ana and Ben may agree a plan, then are put in separate rooms. Each
          flips a fair coin and sees only their own. Each then writes down a
          guess at the *other* person's coin. They win only if both guesses
          are right.
      - ask: >
          If each simply writes "heads", what is the probability that both
          guesses are right?
        expects: "1/4"
        feedback: >
          Ana is right when Ben's coin is heads, Ben is right when Ana's is
          heads: $\tfrac{1}{2} \cdot \tfrac{1}{2} = \tfrac{1}{4}$. Any pair of
          blind guesses gives the same.
      - ask: >
          Can any plan make Ana's own guess right more than half the time?
        choices:
          - text: >
              Yes: she should guess her own coin's face, since that is real
              information.
            feedback: >
              It is real information about her coin, and none about Ben's. Ben's
              coin is independent of everything Ana sees, so any guess she
              writes is right with probability exactly $1/2$.
          - text: >
              No: Ben's coin is independent of everything Ana sees.
            correct: true
            feedback: >
              Each person's accuracy is pinned at $1/2$ by independence, whatever
              the plan.
          - text: >
              Yes, if they agree in advance that Ben's coin will be heads.
            feedback: >
              Agreement cannot touch a fair coin. Ben's flip lands as it lands.
        feedback: >
          No plan improves either individual's odds. If a plan helps at all, it
          has to work some other way.
      - reflect: >
          Each guess is stuck at $1/2$, yet the team's chance is not obviously
          stuck at $1/4$. Look at the four possible coin pairs. What could a
          plan change about *which* pairs make Ana wrong and which make Ben
          wrong?
        hint: >
          Under "both write heads", in how many pairs is exactly one of them
          wrong?
        answer: >
          Under the blind plan their mistakes are spread out: in two of the
          four pairs exactly one of them is wrong, which wastes a pair. The
          plan cannot shrink each person's set of bad pairs, but it can make
          the two sets coincide. If each guesses "the other's coin matches
          mine", both are right whenever the coins match and both are wrong
          whenever they differ: the losses pile onto the same two pairs.
      - ask: >
          Under "guess that the other's coin matches mine", what is the
          probability that both are right?
        expects: "1/2"
        feedback: >
          Both are right exactly when the coins match: $HH$ or $TT$, $2$ of
          $4$ pairs. Each person is still right half the time; the team now is
          too.

      - part: Making the mistakes coincide
        teach: >
          That is protocol design. Once separated, each player's action is a
          fixed function of a private view, agreed in advance. Individual
          accuracy is usually fixed by symmetry, so the lever is correlation:
          build every action off one shared statistic, so that everyone is
          right on the same configurations and wrong on the same ones,
          instead of failing independently.
      - ask: >
          Four players each get a black or white hat by a fair coin. Each sees
          the other three hats but not their own, and all four write a guess
          at their own colour at once. They win only if all four are right.
          Guessing independently, what is the chance of winning?
        expects: "1/16"
        feedback: >
          Each is right with probability $1/2$, independently:
          $(1/2)^{4} = 1/16$.
      - ask: >
          Which agreed plan wins far more often?
        choices:
          - text: >
              Each writes the colour that is in the majority among the three
              hats they see.
            feedback: >
              On a hat pattern like black, black, black, white, the white
              player sees three blacks and writes black. The plan wins only on
              all-black or all-white: $2/16$.
          - text: >
              Each assumes the total number of black hats is even and writes
              the colour that makes it so.
            correct: true
            feedback: >
              Every player bets on the same statistic. If the total really is
              even, all four are right at once; if it is odd, all four are
              wrong at once.
          - text: >
              Each writes the opposite of the hat to their left.
            feedback: >
              The players' guesses then depend on different hats, so their
              mistakes stay largely independent. Nothing makes them win
              together.
        feedback: >
          The shared statistic is the parity of the total, and every player
          can compute what their own hat must be if it is even.
      - ask: >
          Under the even-total plan, in how many of the $16$ hat assignments
          does everyone guess right?
        expects: "8"
        hint: >
          Count the assignments with $0$, $2$ or $4$ black hats.
        feedback: >
          $\binom{4}{0} + \binom{4}{2} + \binom{4}{4} = 1 + 6 + 1 = 8$. The
          team wins $8/16 = 1/2$, against $1/16$ for independent guessing.
      - ask: >
          Under that plan, what is each individual player's chance of being
          right?
        choices:
          - text: >
              $1/2$, the same as a blind guess
            correct: true
            feedback: >
              Each player's guess is right exactly when the total is even,
              which happens half the time. The plan moved no one's odds.
          - text: >
              Higher than $1/2$, since the team now wins half the time
            feedback: >
              The team wins half the time precisely because each player is
              right half the time — on the same half.
          - text: >
              $1/16$, since only one assignment in sixteen is special
            feedback: >
              Eight assignments make everyone right, not one. Each player is
              right on those eight and wrong on the other eight.
        feedback: >
          Individual accuracy unchanged, joint success multiplied by eight:
          that is the signature of a good protocol.

      - part: The ceiling
        ask: >
          Could a cleverer plan push the all-four-right chance above $1/2$?
        choices:
          - text: >
              Yes, with a statistic finer than parity, such as the total
              modulo $4$.
            feedback: >
              A finer statistic does not help: whatever the rule, player one
              alone is right only half the time, and the team needs player one.
          - text: >
              No: winning needs player one to be right, and that happens with
              probability exactly $1/2$ under any plan.
            correct: true
            feedback: >
              The joint event sits inside one player's success, which is pinned
              at $1/2$. Parity reaches that ceiling, so it is optimal.
          - text: >
              Yes, if the players look at each other's guesses before writing.
            feedback: >
              The guesses are written at once, with no communication. A plan
              that needs a channel the puzzle does not grant is not a plan.
        feedback: >
          The best a protocol can do is make every player's failures land on
          the same configurations. Here that means one coin flip for the whole
          team.
      - teach: >
          The prisoner puzzles that follow are this move with different shared
          statistics: the parity of the hats one person can see, a running
          count kept by one designated player, and the cycle structure of a
          permutation.

  - node: quant-puzzles.classics.hat-parity
    hook: >
      The rearmost prisoner's job is to spend his own life broadcasting one
      bit of parity, and the interviewer wants to see you name that trade
      explicitly, not just recite the announce-and-decode mechanics.
    explanation: >
      The rearmost prisoner sees every hat ahead of him and nothing else, so
      he's the only one with enough information to compute a global parity of
      the whole line — the number of black hats among everyone in front of
      him, reduced mod $2$. He announces that parity directly as a colour
      word, spending his own guess on pure noise with respect to his own hat.
      That's exactly why he only survives with probability $1/2$: whether the
      announced parity happens to also match his own hat colour is
      essentially a coin flip.

      Every later prisoner recovers his own hat by combining three things:
      the original announced parity, the hats he can see ahead of himself,
      and the true colours of everyone already correctly identified behind
      him, trustworthy by induction since every prisoner after the first is
      proven correct. Whatever parity is missing once those known pieces are
      accounted for must be supplied by his own hat, which pins it exactly.

      This is protocol design's shared-statistic idea in its cleanest form:
      parity is the one bit every subsequent prisoner can reconstruct from
      public information plus what he personally sees, so correctness for the
      rest of the line is not many independent coin flips — it's a single
      chain, unbroken as long as the first transmission and every following
      deduction are correct.
    worked: >
      Three prisoners in a line, hats front to back $B, W, W$. The rearmost
      (hat $W$) sees $B, W$ ahead — one black, odd — and announces "black."
      The middle prisoner hears "black," sees $B$ ahead of himself, so his own
      hat must contribute zero more blacks to keep the count at one: he
      guesses white, correctly. The front prisoner hears "black," knows the
      middle prisoner's hat is white from the correct guess just made, sees
      nothing ahead, so his own hat must supply the missing black: he guesses
      black, correctly. Two of three survive with certainty; the rearmost's
      own guess of "black" happens to be wrong here, since his real hat was
      white — the expected number saved is $n-1/2 = 2.5$.
    interview: >
      A frequent twist swaps which end goes first — starting from the front
      instead of the back breaks the scheme immediately, since the front
      prisoner sees nobody and has no parity to broadcast, so listen for
      which end announces before you commit to a direction.
    pitfalls: >
      Confusing which direction "ahead" points is fatal to the whole scheme:
      the announcer must be the one with maximal visibility, not minimal.
      Dropping one called colour from the count kills the prisoner who drops
      it, and his wrong word then misleads the next speaker too, since each
      guess depends on every colour called after the announcer, not just the
      original broadcast parity; the two errors cancel in every later sum, so
      one slip costs two lives rather than the whole chain.
    recap: >
      One sacrificed parity bit from the prisoner who sees everyone else
      saves the remaining $n-1$ with certainty, for an expected total of
      $n-1/2$ survivors.
    dialogue:
      - part: Six in a line
        teach: >
          Six prisoners stand in a line, all facing the front, each with a
          black or white hat from a fair coin. Each sees every hat ahead of him
          and none behind, nor his own. Starting from the back, each says one
          word, "black" or "white", which everyone hears; a wrong word for your
          own hat is fatal. They may agree a plan beforehand.
      - ask: >
          A first plan works in pairs: the rearmost names the hat of the man
          directly in front of him, who then repeats it; the next two do the
          same, and so on. How many prisoners does that guarantee to save?
        expects: "3"
        feedback: >
          The front man of each of the three pairs hears his own colour and is
          safe; the back man of each pair is a coin flip. Three certain, plus
          $3 \cdot \tfrac{1}{2}$ expected: $4.5$ on average.
      - reflect: >
          The rearmost prisoner's word is heard by all five others, and the
          pair plan spends it on a single hat. What one fact about the five
          hats he sees could be useful to *every* listener at once?
        hint: >
          Each listener sees some of those hats himself. What would he need to
          be told to work out the one he cannot see?
        answer: >
          Their parity: whether the number of black hats among the five is odd
          or even. Each listener can see every hat ahead of him and hear every
          call behind him, so the only black he cannot count is his own — and
          knowing the total's parity tells him whether it is there. One bit,
          broadcast once, serves everybody.

      - part: One bit, decoded down the line
        teach: >
          The plan: the rearmost says "black" if he sees an odd number of black
          hats, "white" if even. His own hat is unrelated to that word, so he
          is a coin flip. Every later prisoner adds up the black hats he sees
          ahead and the black hats called by those who spoke after the
          announcer, and names his own hat as whatever restores the announced
          parity.
      - ask: >
          The announcer says "black". The second speaker says "black". You
          speak third, and ahead of you see white, black, white. What is your
          hat?
        choices:
          - text: >
              White
            feedback: >
              That counts the announcer's "black" as a black hat. His word is a
              parity, not his colour. Count only the second speaker's black and
              the one you see: $2$, even, so your hat must be black to make it
              odd.
          - text: >
              It cannot be known without the announcer's own colour.
            feedback: >
              The announcer's hat is not in the parity at all: he reported the
              five hats ahead of him. Everything you need is the announced
              parity, the calls since, and what you see.
          - text: >
              Black
            correct: true
            feedback: >
              The announced parity covers the five hats ahead of the announcer,
              you included. You account for the second speaker's black and one
              black ahead of you: $2$. Odd was announced, so the missing black
              is yours.
        feedback: >
          The decode is one sum: blacks called since the announcer, plus blacks
          you see, plus your own, must match the announced parity.
      - ask: >
          Why may you take the second speaker's "black" as his true colour?
        choices:
          - text: >
              Because nobody in the line would lie.
            feedback: >
              Honesty is not the issue: the announcer is honest and still
              usually says something unrelated to his own hat. What matters is
              that the plan makes the second speaker right.
          - text: >
              Because under the plan, every speaker after the announcer is
              right — by the same argument applied one place earlier.
            correct: true
            feedback: >
              The second speaker knows the parity and sees the other four hats,
              so he is right for certain; that makes his word a fact for you,
              and your word a fact for the next man. Correctness passes down
              the line by induction.
          - text: >
              You may not; you are guessing that he got it right.
            feedback: >
              There is no guess in it. The second speaker has all the
              information he needs, so his word is certainly his colour.
        feedback: >
          Every call after the first is a known hat colour, and that is what
          keeps the decoding exact all the way to the front.
      - ask: >
          What is the probability that the announcer himself survives?
        expects: "1/2"
        feedback: >
          His word reports the parity of the five hats ahead, and his own hat
          is an independent fair coin, so his word matches it half the time.
      - ask: >
          What is the expected number of survivors among the six?
        expects: "11/2"
        feedback: >
          Five certain, plus $\tfrac{1}{2}$ for the announcer: $5.5$, against
          $4.5$ for the pair plan. In general, $n - \tfrac{1}{2}$.

      - part: What the bit cannot buy
        ask: >
          Could any plan save all six with certainty?
        choices:
          - text: >
              Yes, if the announcer encodes two bits by choosing which word to
              stress.
            feedback: >
              The rules allow one of two words and nothing else. A plan cannot
              lean on a channel the puzzle does not grant.
          - text: >
              No: the announcer hears nothing and his hat is independent of
              everything he sees, so any word is right with probability $1/2$.
            correct: true
            feedback: >
              The rearmost prisoner has no information about his own hat under
              any plan. Parity saves everyone else, which is the most possible.
          - text: >
              Yes, if the front prisoner speaks first instead.
            feedback: >
              The front prisoner sees nobody, so he has nothing to broadcast,
              and his own hat is still a coin flip. The announcer must be the
              one who sees the most.
        feedback: >
          The trade is explicit: one prisoner's odds are spent to publish the
          bit that fixes everyone else.
      - ask: >
          Suppose the third speaker miscounts and calls the wrong colour. What
          happens to the prisoners in front of him?
        choices:
          - text: >
              Every one of them dies, since each trusts the wrong call.
            feedback: >
              The fourth speaker does trust it and is wrong. But then his call
              is wrong too, and the fifth speaker counts both wrong calls: two
              errors cancel modulo $2$.
          - text: >
              Only the next speaker dies; after that the parity sum is correct
              again.
            correct: true
            feedback: >
              The fourth speaker's error echoes the third's, so from the fifth
              on, the two wrong calls cancel in every sum. One slip costs two
              lives, not the whole line.
          - text: >
              Nobody else is affected, since each prisoner sees the hats ahead.
            feedback: >
              The fourth speaker cannot see the third's hat — it is behind him —
              so he relies on the call, and the wrong call costs him.
        feedback: >
          Parity arithmetic is forgiving in pairs: an error and its echo cancel.
          Every call after the announcer must still be counted, but a single
          slip does not unravel the chain.
      - teach: >
          Said aloud: "The back prisoner announces the parity of the black hats
          he sees. Everyone else knows every hat but his own — ahead by sight,
          behind by the calls — so parity pins it. All but the announcer
          survive for sure, and he is a coin flip: $n - \tfrac{1}{2}$
          expected."

  - node: quant-puzzles.classics.hat-mod-n
    hook: >
      Making everyone guess at once, with no order to lean on, forces a
      completely different trick than sacrificing one announcer — mixing the
      two up mid-interview is the fastest way to stall.
    explanation: >
      With simultaneous guessing there's no "first mover" who can broadcast a
      bit for everyone else to decode, so no one can sacrifice themselves the
      way the line puzzle's rearmost prisoner does. The fix is to have every
      prisoner bet on a different value instead: label the colours $0$
      through $n-1$, and have prisoner $i$ assume the hat-colour total,
      summed mod $n$, equals $i$, then compute what his own hat would have to
      be for that to hold, given what he can see of everyone else's.

      The true sum has exactly one residue mod $n$, so exactly one prisoner's
      assumption is correct, and that prisoner's computed guess is
      automatically right too — the others', built on a false assumed total,
      are automatically wrong. Guaranteeing "at least one correct" no longer
      needs anyone to broadcast anything; it's built into the fact that $n$
      people betting on $n$ different residues necessarily cover the one
      that's actually true.

      Individually, each prisoner is still only right with probability $1/n$,
      exactly what a blind guess would achieve. What the protocol buys is not
      individual accuracy but the guarantee that the $n$ individual failures
      can never all occur together, since one of the $n$ mutually exclusive
      assumed totals must hold.
    worked: >
      Three prisoners, colours labelled $0,1,2$; true hats $h_0=1, h_1=2,
      h_2=0$, summing to $3 \equiv 0 \pmod 3$. Prisoner $0$ assumes the total
      is $0$: seeing $h_1+h_2=2$, he guesses $g_0 = 0-2 \equiv 1 \pmod 3$ —
      correct. Prisoner $1$ assumes the total is $1$: seeing $h_0+h_2=1$, he
      guesses $g_1=1-1=0$ — wrong. Prisoner $2$ assumes the total is $2$:
      seeing $h_0+h_1=3 \equiv 0$, he guesses $g_2=2-0=2$ — wrong. Exactly
      prisoner $0$ is right, matching the true residue $0$.
    interview: >
      A standard follow-up asks what happens if the number of prisoners
      doesn't match the number of colours — the scheme needs exactly $n$
      prisoners for $n$ colours, since it relies on the $n$ assumed residues
      exactly covering every value once each; naming that limitation
      unprompted reads as understanding rather than memorisation.
    pitfalls: >
      Assuming more than one prisoner can be correct in a favourable
      configuration is a common misreading — the structure guarantees exactly
      one correct guess in every configuration, never zero and never more
      than one. Applying the scheme when prisoner count and colour count
      differ silently breaks the residue-covering argument the guarantee
      depends on.
    recap: >
      Each prisoner bets on a distinct residue of the hat total mod $n$;
      exactly one bet matches the true total, guaranteeing one correct guess
      from $n$ individually-blind ones.
    dialogue:
      - part: Four hats, four colours, one instant
        teach: >
          Four prisoners, numbered $0$ to $3$, each get a hat in one of four
          colours, also labelled $0$ to $3$. Each sees the other three hats but
          not his own, and all four write a guess at their own colour at the
          same instant. They go free if at least one guess is right.
      - ask: >
          If the hats are uniformly random and each prisoner guesses
          independently, what is the probability that at least one is right?
        expects: "175/256"
        tolerance: 0.001
        hint: >
          Compute the chance that all four are wrong first.
        feedback: >
          Each is wrong with probability $3/4$, independently, so all four are
          wrong with probability $(3/4)^{4} = 81/256$, and at least one is right
          with $175/256 \approx 0.68$. Good odds, but no guarantee: a warden who
          knows the guesses can make all four wrong.
      - ask: >
          Out of the $4^{4} = 256$ possible hat assignments, on how many is
          prisoner $0$ right — under any plan at all?
        expects: "64"
        hint: >
          Fix the three hats he sees. How many of the four possible colours of
          his own hat match his one guess?
        feedback: >
          For each of the $64$ ways the other three hats can look, his guess is
          one fixed colour, and exactly one of the four possible hats matches
          it. So $64$ of $256$, a quarter — no plan changes that.
      - reflect: >
          Each of the four prisoners is right on exactly $64$ assignments, and
          there are $256$ assignments in all. What would have to be true of
          those four sets of $64$ for *every* assignment to have someone right?
          What kind of rule could arrange it?
        hint: >
          $4 \times 64 = 256$. Is there any room for overlap?
        answer: >
          The four sets would have to be disjoint and together cover all
          $256$: every assignment has exactly one prisoner right, with no
          overlap to spare. So the assignments must be split into four classes
          of $64$, each prisoner owning one class and guessing correctly
          whenever the hats fall in it. A statistic every prisoner can reason
          about, with four equally common values — the total of the hats
          modulo $4$ — does exactly that.

      - part: Every prisoner bets on a different total
        teach: >
          The protocol: prisoner $i$ assumes the total of all four hats is
          $i$ modulo $4$, and writes the one colour that would make it so,
          $g_i \equiv i - (\text{the three hats he sees}) \pmod 4$. The true
          total has exactly one residue $r$, so prisoner $r$'s assumption is
          true and his guess is right.
      - ask: >
          The hats are $h_0 = 3$, $h_1 = 1$, $h_2 = 2$, $h_3 = 2$. Which
          prisoner guesses right?
        expects: "0"
        hint: >
          Find the true total modulo $4$.
        feedback: >
          $3 + 1 + 2 + 2 = 8 \equiv 0 \pmod 4$, so prisoner $0$'s assumption
          is the true one. He sees $1 + 2 + 2 = 5 \equiv 1$ and writes
          $0 - 1 \equiv 3$, his actual hat.
      - ask: >
          Can two prisoners ever be right on the same assignment?
        choices:
          - text: >
              Yes, when several hats share a colour.
            feedback: >
              Repeated colours do not matter. Prisoner $i$ is right exactly when
              the total is $i$ modulo $4$, and the total has only one residue.
          - text: >
              No: prisoner $i$ is right exactly when the total is $i$ modulo
              $4$, and the total has one residue.
            correct: true
            feedback: >
              A prisoner whose assumed total is off by some $d$ that is not a
              multiple of $4$ writes a guess off by $d$ too, so he is wrong.
              Exactly one prisoner is right on every assignment.
          - text: >
              Yes, about a quarter of the time by luck.
            feedback: >
              No luck enters. Given the hats, each guess is determined, and the
              argument shows only the prisoner matching the residue is right.
        feedback: >
          Exactly one correct guess, always: the four right-sets are the four
          residue classes, disjoint and covering.
      - ask: >
          Under the protocol, with uniformly random hats, what is the
          probability that prisoner $2$ is right?
        expects: "1/4"
        feedback: >
          He is right exactly when the total is $2$ modulo $4$, which happens
          on $64$ of $256$ assignments. The protocol did not make anyone more
          accurate; it made the four failures impossible to have all at once.

      - part: When the bets cannot cover
        ask: >
          Only three prisoners, still four colours. Can any plan guarantee
          that at least one is right?
        choices:
          - text: >
              Yes: use the same rule with residues $0, 1, 2$.
            feedback: >
              Then nobody bets on a total of $3$ modulo $4$, and on those
              assignments all three are wrong.
          - text: >
              No: each is right on a quarter of the assignments, and three
              quarters cannot cover all of them.
            correct: true
            feedback: >
              The counting argument kills every plan at once: some assignment
              is missed by all three right-sets.
          - text: >
              Yes, if one prisoner guesses twice as often.
            feedback: >
              Each prisoner writes one guess. A quarter each, three prisoners,
              at most three quarters covered.
        feedback: >
          The guarantee needs at least as many prisoners as colours, so their
          right-sets can cover everything.
      - ask: >
          Compare with the line of hats, where the rearmost prisoner announced
          a parity. Why can no one here do the same?
        choices:
          - text: >
              Because with four colours parity is meaningless.
            feedback: >
              Parity would just become a residue modulo $4$. The obstacle is not
              the statistic but the timing.
          - text: >
              Because everyone writes at once, so no guess can carry information
              to anyone else.
            correct: true
            feedback: >
              With no order, no one hears anything before guessing. The shared
              statistic cannot be broadcast, so each prisoner bets on a
              different value of it instead.
          - text: >
              Because the prisoners can see every other hat already.
            feedback: >
              Seeing every other hat is what lets each one compute his guess.
              What is missing is any way to learn the total.
        feedback: >
          Line puzzle: one man spends his guess to publish the statistic.
          Simultaneous puzzle: everyone assumes a different value of it, and
          exactly one assumption is true.
      - teach: >
          Said aloud: "Label the colours $0$ to $n - 1$. Prisoner $i$ assumes
          the hat total is $i$ modulo $n$ and writes what that forces. The true
          total has one residue, so exactly one prisoner is right — each still
          only $1/n$ alone."

  - node: quant-puzzles.classics.light-bulb
    hook: >
      The correctness of this protocol is exact and easy to see; the part
      worth rehearsing is the timing argument, since the interviewer's real
      question is almost always how long this takes, roughly.
    explanation: >
      Correctness rests on giving exactly one prisoner a bookkeeping role no
      one else touches: every non-counter turns the lamp on only the first
      time they ever find it off, and never touches it again; the counter is
      the only one who ever turns it off, incrementing a private tally each
      time. Because each of the other prisoners contributes exactly one
      on-switch over the whole process, the counter's tally reaching that
      exact number is a certainty, not a probabilistic near-guarantee.

      Timing has two separate components that need to be added, not
      conflated. With $j$ non-counters still to signal, the expected wait
      until one of them finds the lamp off is roughly $n/j$ days, since only
      about $j$ of the $n$ prisoners are still "live" signalers. Once a signal
      is waiting to be cleared, the expected wait for the counter specifically
      to be drawn next is $n$ days, since the counter is just one prisoner
      among $n$ chosen uniformly at random.

      The counter's own waits dominate the total: there are $n-1$ of them,
      each costing $n$ days in expectation, for $n(n-1)$ days total, while the
      signalers' waits sum to only $n H_{n-1}$, a harmonic sum that grows far
      more slowly. Almost the entire multi-year duration is spent waiting for
      the counter specifically to be drawn next, not waiting for a signal to
      be ready.
    worked: >
      Fifty prisoners instead of a hundred, same rules. Total expected days
      is $n(n-1) + n H_{n-1}$ with $n=50$: the counter-wait term is
      $50 \cdot 49=2450$ days, and the signal-wait term is
      $50 H_{49} \approx 50 \times 4.479 \approx 224$ days, for a total of
      about $2674$ days, roughly $7.3$ years — noticeably shorter than the
      hundred-prisoner version's $28$ years, since both terms shrink with $n$.
    interview: >
      A frequent extension asks whether two counters could split the work to
      go faster — they can't safely, since simultaneous clearing risks a
      double count or a missed signal with no way for either counter to know
      the other's tally, so the design needs exactly one prisoner in that
      role.
    pitfalls: >
      Letting more than one prisoner turn the lamp off breaks the exact-count
      guarantee outright — the counter's tally is only trustworthy because no
      one else ever touches the switch in that direction. Treating the
      $n(n-1)$ and $n H_{n-1}$ terms as comparable in size misses that the
      counter-wait term dominates almost entirely once $n$ is more than a
      handful.
    recap: >
      One designated counter and a one-shot signal per prisoner make the
      count exact, at an expected cost of $n(n-1)+nH_{n-1}$ days, dominated
      by the counter's $n-1$ waits of $n$ days each.
    dialogue:
      - part: One lamp, no calendar
        teach: >
          Five prisoners. Each day one of them, chosen uniformly at random
          with repetition, is led into a room with a lamp that starts off and
          that only they can switch. At any visit a prisoner may declare that
          all five have now been in the room: right, and all go free; wrong,
          and all die. They may agree a plan once, before the visits start.
      - ask: >
          A first plan: each prisoner switches the lamp on at his first visit.
          A prisoner who walks in and finds it on — what does he know?
        choices:
          - text: >
              That everyone has visited at least once.
            feedback: >
              One "on" is consistent with a single earlier visitor. The lamp
              does not record how many times it has been switched on.
          - text: >
              That at least one other prisoner has visited, and nothing more.
            correct: true
            feedback: >
              Once the lamp is on, the next four first-visits leave it exactly
              as it was. Every later signal is swallowed.
          - text: >
              That exactly one other prisoner has visited.
            feedback: >
              Two or three may have come and gone; each found it on and could
              not add anything.
        feedback: >
          The lamp stores one bit, and a count from $0$ to $4$ needs more. The
          plan has to store the count somewhere else.
      - reflect: >
          Where could the count live, if not in the lamp? Describe a plan, and
          say who must be the only one ever allowed to switch the lamp off.
        hint: >
          The lamp can still carry one message at a time, if someone empties
          it.
        answer: >
          The count lives in one person's head. Designate a counter; he is the
          only one who ever switches the lamp off, and each time he does, he
          adds one. Every other prisoner uses the lamp as a one-way mailbox:
          he switches it on the first time he finds it off, and never again.
          Each signal is then read exactly once, so the counter's tally is an
          exact count of distinct prisoners who have visited.

      - part: A counter and one-shot signals
        teach: >
          That is the protocol. One counter clears the lamp and counts; each of
          the others turns it on once, the first time he finds it off, and
          then never touches it. Correctness is exact: every off-switch the
          counter makes answers a distinct prisoner's single on-switch.
      - ask: >
          With five prisoners, at what tally does the counter declare?
        expects: "4"
        feedback: >
          Four other prisoners, one signal each. The counter does not signal
          himself: his own visits are certain the moment he counts anything.
      - ask: >
          A prisoner who has already signalled finds the lamp off again. What
          should he do, and why?
        choices:
          - text: >
              Switch it on again, to speed things up.
            feedback: >
              Then the counter counts him twice and can declare while somebody
              has never visited. Exactness depends on one signal per person.
          - text: >
              Leave it alone.
            correct: true
            feedback: >
              One on-switch per prisoner is what makes the tally a count of
              people rather than a count of visits.
          - text: >
              Switch it on only if he has not seen the counter recently.
            feedback: >
              He has no way to know what the counter has seen, and a second
              signal is still a double count.
        feedback: >
          The protocol trades speed for certainty: every rule exists to keep
          the counter's tally equal to the number of distinct visitors.

      - part: How long it takes
        ask: >
          The lamp is off and three non-counters have not yet signalled. What
          is the expected number of days until one of them visits?
        expects: "5/3"
        tolerance: 0.01
        hint: >
          Each day is a fresh draw. What is the chance that today's visitor is
          one of the three?
        feedback: >
          Each day one of them is chosen with probability $3/5$, so the wait is
          geometric with mean $5/3$ days.
      - ask: >
          He switches it on. What is the expected number of days until the
          counter visits and clears it?
        expects: "5"
        feedback: >
          Only the counter can clear it, and he is drawn with probability
          $1/5$ a day: $5$ days on average. While the lamp is on, every other
          visit is wasted.
      - ask: >
          What is the expected total number of days until the counter
          declares?
        expects: "365/12"
        tolerance: 0.05
        hint: >
          Four signals. Each has a wait for a fresh signaller, with $j$ of them
          left, plus a wait for the counter.
        feedback: >
          With $j = 4, 3, 2, 1$ signallers left, the waits are $5/j$ and then
          $5$: $5(1 + \tfrac{1}{2} + \tfrac{1}{3} + \tfrac{1}{4}) + 4 \cdot 5 =
          \tfrac{125}{12} + 20 = \tfrac{365}{12} \approx 30.4$ days.
      - ask: >
          Which part of that total grows faster as the number of prisoners
          $n$ grows?
        choices:
          - text: >
              The waits for a fresh signaller, about $n \ln n$ in all
            feedback: >
              They form a harmonic sum, $n H_{n-1}$, which grows only like
              $n \ln n$. The other part is much larger.
          - text: >
              The waits for the counter, $n$ days each, $n(n - 1)$ in all
            correct: true
            feedback: >
              Quadratic against $n \ln n$. With $100$ prisoners it is $9900$
              days of the roughly $10418$: the protocol spends most of its life
              waiting for one particular man.
          - text: >
              Both grow at the same rate.
            feedback: >
              The counter waits are $n$ each for $n - 1$ signals, quadratic. The
              signaller waits are $n/j$, harmonic. Already at $n = 5$ they are
              $20$ against about $10.4$.
        feedback: >
          Total: $n(n - 1) + n H_{n-1}$. For a hundred prisoners about $10418$
          days, roughly $28$ years, almost all of it waiting for the counter.

      - part: Why not two counters
        ask: >
          To speed things up, a prisoner proposes two counters. Each clears the
          lamp whenever he finds it on, and either may declare once his own
          tally reaches $2$. What goes wrong?
        choices:
          - text: >
              Nothing: the signals split between them, so each needs only half.
            feedback: >
              Nothing makes them split evenly. Whoever happens to visit more
              often collects more, and the other counter's tally is invisible
              to him.
          - text: >
              A tally of $2$ proves only that two others have visited; the rest
              may never have come.
            correct: true
            feedback: >
              The lamp carries no sender and no running total. A counter cannot
              tell whether the other has cleared the remaining signals, so his
              declaration can be wrong.
          - text: >
              The two counters might both switch it off on the same day.
            feedback: >
              Only one prisoner visits per day, so that cannot happen. The real
              problem is that the count is split where nobody can add it up.
        feedback: >
          Exactly one prisoner switches the lamp off, so exactly one head holds
          the whole count. That single rule is the protocol's correctness.
      - teach: >
          Said aloud: "One counter, who alone turns the lamp off and counts;
          everyone else turns it on once. The count is exact. Time is about
          $n(n - 1) + n H_{n-1}$ days — $10418$ for a hundred, nearly all of
          it waiting for the counter to be drawn."

  - node: quant-puzzles.classics.prisoners-boxes
    hook: >
      The jump from vanishingly small to roughly one in three is the single
      most quoted number in this puzzle family, and the interviewer is
      testing whether you can explain why correlating the searches, not
      making any individual search smarter, is what buys it.
    explanation: >
      Independent random searching fails because each prisoner's success is
      its own coin flip, and a hundred independent flips of probability $1/2$
      succeed jointly with probability $2^{-100}$ — the protocol-design
      lesson that correlated failure beats independent failure applies here
      at its most dramatic scale. Cycle-following correlates every prisoner's
      search through the single hidden object they all share: the
      permutation itself.

      Prisoner $i$ opening box $i$, then the box named by whatever he finds,
      and repeating, is exactly walking the cycle of the permutation that
      contains $i$ — he finds his own name within the opening limit precisely
      when that cycle is short enough. Since every prisoner does this
      simultaneously against the same permutation, either every cycle is
      short enough and everyone succeeds together, or some cycle is too long
      and everyone whose name lives in it fails together — there's no
      in-between case where some searches are doomed independently of the
      others.

      At most one cycle can exceed the halfway length, because two disjoint
      cycles both longer than that would need more elements than the
      permutation has. That fact plus a direct count of how many permutations
      contain a $k$-cycle turns "does everyone succeed" into a single tail
      sum, $\sum_{k=51}^{100} 1/k = H_{100}-H_{50}$, for the failure
      probability.
    worked: >
      Eight prisoners, eight boxes, each opening four. Failure is "some cycle
      exceeds length four," with probability $\sum_{k=5}^{8} 1/k = H_8-H_4$.
      Numerically $H_8 \approx 2.7179$ and $H_4 \approx 2.0833$, so failure
      $\approx 0.6345$ and the escape probability is $\approx 0.3655$, about
      $36.5\%$ — noticeably higher than the eventual limit near $30.7\%$,
      since the harmonic tail approaches that limit only as the prisoner
      count grows large.
    interview: >
      A common variant changes how many boxes each prisoner opens relative to
      the total — opening more than half shifts the threshold in the tail sum
      and raises the escape probability; the interviewer is checking whether
      you re-derive the sum with the new threshold rather than reusing the
      memorised $31\%$.
    pitfalls: >
      Confusing "expected number of prisoners who find their own name"
      (always exactly half, by linearity, regardless of strategy) with
      "probability that everyone finds their name" (close to $31\%$ under the
      best strategy) is the most common conflation — these are genuinely
      different quantities and both get asked. Forgetting that at most one
      cycle can exceed the opening limit is what makes the tail-sum count
      exact rather than an overcount.
    recap: >
      Cycle-following turns a hundred coin flips into one shared event —
      does any cycle exceed length fifty — lifting the escape probability
      from $2^{-100}$ to about $31\%$.
    dialogue:
      - part: Four prisoners, two boxes each
        teach: >
          Four prisoners, numbered $1$ to $4$. Four boxes, also numbered $1$ to
          $4$, hold their numbers in a uniformly random order, one per box.
          One at a time, each prisoner may open two boxes; all four must find
          their own number, or all fail. Nothing can be passed on between
          searches.
      - ask: >
          If each prisoner opens two boxes at random, independently of the
          others, what is the probability that all four succeed?
        expects: "1/16"
        feedback: >
          Each finds his number with probability $2/4 = 1/2$; four independent
          halves give $(1/2)^{4} = 1/16$. With $100$ prisoners it would be
          $2^{-100}$.
      - ask: >
          Can any strategy make prisoner $1$'s own chance better than $1/2$?
        choices:
          - text: >
              Yes, by opening boxes in a cleverer order.
            feedback: >
              His number is equally likely to be in each of the four boxes, so
              any two boxes he ends up opening hold it with probability $1/2$,
              in whatever order or by whatever rule.
          - text: >
              No: his number is equally likely to be in any box, and he opens
              half of them.
            correct: true
            feedback: >
              The individual odds are frozen at $1/2$. Anything gained has to
              come from making the four successes happen together.
          - text: >
              Yes, if he goes last and can see which boxes the others opened.
            feedback: >
              The boxes are closed again after each search, and nothing passes
              between prisoners. He learns nothing from going last.
        feedback: >
          As in every protocol puzzle, the lever is correlation, not individual
          accuracy.
      - reflect: >
          The only thing the four searches have in common is the arrangement
          itself. Invent a rule in which the box a prisoner opens next depends
          on the number he just found, so that whether he succeeds is decided
          by the arrangement's structure rather than by luck.
        hint: >
          A number found in a box is also the label of a box.
        answer: >
          Prisoner $i$ opens box $i$. If it holds number $m$, he opens box $m$
          next, and so on. The arrangement is a permutation: box $b$ points to
          the number inside it, which names another box. Following the pointers
          from box $i$ walks round the cycle containing $i$, and the box that
          points back to $i$ is the one holding his number. He succeeds exactly
          when that cycle is short enough — a property of the arrangement that
          every prisoner on the same cycle shares.

      - part: Walking the cycle
        teach: >
          That is cycle-following. Read the arrangement as a permutation that
          sends each box to the number inside it. Prisoner $i$, starting at box
          $i$ and following the numbers, walks the cycle containing $i$, and
          finds his own number on the last box of that cycle. With two opens
          allowed, he succeeds exactly when his cycle has length at most $2$.
      - ask: >
          Box $1$ holds $3$, box $2$ holds $2$, box $3$ holds $4$, box $4$
          holds $1$. How many boxes would prisoner $1$ need to open to find his
          number?
        expects: "3"
        feedback: >
          Box $1$ shows $3$, box $3$ shows $4$, box $4$ shows $1$: three opens.
          His cycle is $1 \to 3 \to 4 \to 1$, of length $3$, one too long.
      - ask: >
          In that same arrangement, who succeeds?
        choices:
          - text: >
              Prisoner $2$ only
            correct: true
            feedback: >
              Box $2$ holds $2$, a cycle of length $1$. Prisoners $1$, $3$ and
              $4$ share the $3$-cycle, so all three walk it and all three run
              out of opens.
          - text: >
              Prisoners $2$ and $3$
            feedback: >
              Prisoner $3$ opens box $3$ (finds $4$), then box $4$ (finds $1$),
              and is out of opens. He is on the long cycle too.
          - text: >
              Nobody, since prisoner $1$ failed
            feedback: >
              Prisoner $2$ opens his own box and finds his number at once. Only
              those on the long cycle fail.
        feedback: >
          Failures come in blocks: everyone on a long cycle fails, everyone on
          a short one succeeds. All four succeed exactly when no cycle is longer
          than $2$.

      - part: Counting the long cycles
        ask: >
          Of the $24$ arrangements of four numbers, how many are a single
          $4$-cycle?
        expects: "6"
        hint: >
          Start the cycle at $1$ and choose the order of the other three.
        feedback: >
          Writing the cycle from $1$, the other three can follow in $3! = 6$
          orders. In general, when $k > n/2$, exactly $n!/k$ permutations of
          $n$ contain a cycle of length $k$; here $24/4 = 6$.
      - ask: >
          Arrangements containing a $3$-cycle number $24/3 = 8$. How many of
          the $24$ let all four prisoners succeed?
        expects: "10"
        feedback: >
          $24 - 8 - 6 = 10$, so the prisoners win with probability
          $10/24 = 5/12 \approx 0.42$, against $1/16$ for independent search.
          Equivalently, failure is $\tfrac{1}{3} + \tfrac{1}{4} = \tfrac{7}{12}$.
      - ask: >
          Why may the two counts, $8$ and $6$, simply be added — and for $100$
          prisoners, the counts for every length from $51$ to $100$?
        choices:
          - text: >
              Because the cycle lengths are independent random variables.
            feedback: >
              They are far from independent: the lengths of all cycles must add
              up to $n$. The reason is a hard limit, not independence.
          - text: >
              Because an arrangement can hold at most one cycle longer than
              half the boxes.
            correct: true
            feedback: >
              Two such cycles would need more than $n$ boxes between them. So no
              arrangement is counted twice, and failure is exactly
              $\sum_{k > n/2} 1/k$ — for $100$ prisoners, $H_{100} - H_{50}
              \approx 0.688$.
          - text: >
              They may not; the sum overcounts and is only an upper bound.
            feedback: >
              It would be an overcount if an arrangement could contain two long
              cycles. It cannot, so the sum is exact.
        feedback: >
          At most one long cycle: that is what makes the failure probability a
          clean tail of the harmonic series, and the success about $31\%$ for
          a hundred.
      - ask: >
          A prisoner proposes a variation: start at a random box instead of
          your own, then follow the numbers. What happens?
        choices:
          - text: >
              Nothing changes, since every box is on some cycle.
            feedback: >
              Every box is on some cycle, but not necessarily on *his*. He may
              walk round a cycle that never contains his number at all.
          - text: >
              He may walk a cycle that does not contain his number, so success
              stops being tied to the arrangement's cycle lengths.
            correct: true
            feedback: >
              Starting at box $i$ is what guarantees his number lies ahead of
              him on the walk. Lose it and the correlation is gone.
          - text: >
              It helps, because the random start breaks up long cycles.
            feedback: >
              Where he starts cannot change the arrangement's cycles; the
              boxes are fixed before anyone walks in.
        feedback: >
          Own box first is not a detail: it is what places each prisoner's
          number on the cycle he walks.
      - teach: >
          Said aloud: "Open your own box, then the box named by what you find.
          You walk your own cycle, so everyone succeeds iff no cycle exceeds
          $50$. At most one can, and $100!/k$ permutations have a $k$-cycle, so
          failure is $H_{100} - H_{50} \approx 0.688$: escape about $31\%$."

  - node: quant-puzzles.classics.prisoners-boxes-optimality
    hook: >
      Two follow-ups always come after the headline number — does it get
      worse at scale, and can any cleverer strategy beat it — and having sharp
      one-line answers to both separates having solved this puzzle from
      having merely memorised it.
    explanation: >
      The scale-invariance follows from treating the harmonic tail sum as an
      integral: $H_{2n}-H_n = \sum_{k=n+1}^{2n} 1/k$ approximates
      $\int_{n}^{2n} dx/x = \ln 2$, and the approximation error shrinks as $n$
      grows, so the failure probability converges to exactly $\ln 2 \approx
      0.6931$ regardless of scale — a genuinely different qualitative
      behaviour from independent search, whose success probability collapses
      toward zero as $2^{-n}$.

      The optimality claim is a cited result rather than something to
      re-derive live, but the intuition worth having ready is this: the only
      randomness in the whole problem is the hidden permutation, and
      cycle-following is the one strategy that aligns every prisoner's search
      directly with that permutation's own structure; any strategy ignoring
      the permutation's cycle structure is throwing away the one piece of
      shared structure correlation could be built on.

      The individual-fairness fact is a short, self-contained argument worth
      keeping separate from the joint-probability number: from any single
      prisoner's own perspective, before conditioning on anyone else, their
      own name is equally likely to sit in any box, so any fixed set of half
      the boxes opened catches it with probability exactly $1/2$ — true for
      cycle-following and for independent random search alike. The joint
      probability differs wildly between strategies; the marginal probability
      does not move at all.
    worked: >
      A thousand prisoners, five hundred boxes opened each. Estimating
      $H_{1000}-H_{500}$ via $H_m \approx \ln m + \gamma + 1/(2m)$ gives
      $H_{1000}\approx 7.4855$ and $H_{500}\approx 6.7928$, a difference of
      about $0.6926$, within a few thousandths of $\ln 2 \approx 0.6931$.
      Escape probability $\approx 0.3074$, already indistinguishable in
      practice from the limiting $1-\ln 2 \approx 0.3069$.
    interview: >
      "Does the probability decay as the number of prisoners grows" is
      answered immediately with the limit $1-\ln 2 \approx 30.7\%$, not with
      an appeal to any specific size; "why can't a smarter strategy do
      better" is answered by citing the optimality result and adding the
      marginal-probability argument as the intuition that makes it plausible.
    pitfalls: >
      Assuming this probability shrinks toward zero the way the naive
      independent-search probability does is the most common wrong instinct,
      and it's exactly backward — this is the qualitative point of the whole
      puzzle. Treating the roughly $1/2$ individual chance and the roughly
      $31\%$ joint chance as if they should move together, rather than as
      genuinely independent facts about the same protocol, blurs two
      different quantities the interviewer is testing separately.
    recap: >
      The escape probability converges to $1-\ln 2 \approx 30.7\%$ at any
      scale and is provably unbeatable, even though every individual
      prisoner's own chance stays fixed at exactly $1/2$ regardless of
      strategy.
    dialogue:
      - part: Does it decay
        ask: >
          Six prisoners, six boxes, three opens each, all following cycles.
          What is the probability that all six escape?
        expects: "23/60"
        tolerance: 0.001
        hint: >
          Failure means a cycle of length $4$, $5$ or $6$; each length $k$ has
          probability $1/k$.
        feedback: >
          Failure is $\tfrac{1}{4} + \tfrac{1}{5} + \tfrac{1}{6} =
          \tfrac{37}{60}$, so escape is $\tfrac{23}{60} \approx 0.383$. With
          four prisoners it was $5/12 \approx 0.417$: it is drifting down.
      - ask: >
          It drifts down as the prison grows. What happens with a million
          prisoners, each opening half a million boxes?
        choices:
          - text: >
              It collapses toward $0$, like $2^{-n}$.
            feedback: >
              That is independent search. Cycle-following's failure is a
              single event — a long cycle exists — and its probability does not
              compound prisoner by prisoner.
          - text: >
              It settles just above $30\%$ and stays there.
            correct: true
            feedback: >
              The drift slows and stops. A million prisoners escape about as
              often as a hundred.
          - text: >
              It decays slowly to $0$, like $1/\ln n$.
            feedback: >
              Slow decay would still reach zero. The failure sum is bounded
              well below $1$ for every $n$, as the next step shows.
        feedback: >
          The headline: the escape probability does not decay with scale. The
          reason is in the shape of the failure sum.
      - reflect: >
          With $2n$ prisoners, failure is $\tfrac{1}{n+1} + \tfrac{1}{n+2} +
          \dots + \tfrac{1}{2n}$. Without computing it, explain why this sum
          cannot grow toward $1$ as $n$ grows, and what number it should
          approach.
        hint: >
          How many terms are there, and how big is each one?
        answer: >
          There are $n$ terms, each between $\tfrac{1}{2n}$ and
          $\tfrac{1}{n}$, so the sum sits between $\tfrac{1}{2}$ and $1$ for
          every $n$ — more terms, but each one smaller in proportion. It is a
          Riemann sum for $\int_{1}^{2} dx/x$, so it tends to $\ln 2 \approx
          0.693$, and escape tends to $1 - \ln 2$.

      - part: The two facts behind the number
        teach: >
          The proposition has two halves. Scale: with $2n$ prisoners each
          opening $n$ boxes, escape is $1 - (H_{2n} - H_{n}) \to 1 - \ln 2
          \approx 0.3069$. Optimality: no strategy, deterministic or
          randomized, does better (Curtin and Warshauer, 2006). Meanwhile each
          prisoner's own chance is exactly $1/2$, under this strategy or any
          other.
      - ask: >
          Every term in the failure sum is at least $\tfrac{1}{2n}$, and there
          are $n$ of them. So under cycle-following, the escape probability is
          never more than what?
        expects: "1/2"
        feedback: >
          Failure is at least $n \cdot \tfrac{1}{2n} = \tfrac{1}{2}$, so escape
          is at most $\tfrac{1}{2}$ — reached only with two prisoners, and
          falling to $1 - \ln 2$.
      - ask: >
          What is $1 - \ln 2$, to three decimal places?
        expects: "0.307"
        tolerance: 0.0006
        feedback: >
          $\ln 2 \approx 0.6931$, so $1 - \ln 2 \approx 0.3069$, about $30.7\%$.
          The hundred-prisoner figure, $0.312$, is already within half a point
          of it.
      - ask: >
          Under cycle-following with six prisoners, what is the probability
          that prisoner $4$ finds his own number?
        expects: "1/2"
        hint: >
          In a uniformly random permutation of six, the cycle containing a
          given element is equally likely to have any length from $1$ to $6$.
        feedback: >
          He succeeds when his cycle has length $1$, $2$ or $3$: $3/6 = 1/2$.
          The strategy leaves his individual chance exactly where blind
          searching left it.
      - ask: >
          Six events of probability $1/2$ each, and yet all six happen with
          probability $0.38$, not $1/64$. How?
        choices:
          - text: >
              The strategy secretly raises each prisoner's chance above $1/2$.
            feedback: >
              Each prisoner is at exactly $1/2$, as you just computed. Nothing
              about any one search improved.
          - text: >
              The successes are strongly positively correlated: failures pile
              onto the same arrangements.
            correct: true
            feedback: >
              On an arrangement with a long cycle, everyone on it fails at once;
              on any other, everyone succeeds. The losses are concentrated
              instead of spread.
          - text: >
              The six events are independent, but $0.38$ is a rounding of
              $1/64$.
            feedback: >
              $1/64 \approx 0.016$. Independence would give exactly that; the
              gap is the correlation.
        feedback: >
          Individual chance and joint chance are different quantities. The
          interviewer will ask both, and the answers are $1/2$ and about
          $31\%$.

      - part: Can anything beat it
        ask: >
          Why can no strategy at all push the escape probability above $1/2$?
        choices:
          - text: >
              Because cycle-following never exceeds $1/2$.
            feedback: >
              That limits one strategy. A bound on every strategy has to come
              from something every strategy shares.
          - text: >
              Because everyone escaping requires prisoner $1$ to succeed, and he
              does so with probability exactly $1/2$ under any strategy.
            correct: true
            feedback: >
              The joint event sits inside one prisoner's success. That gives
              $1/2$ for free; the much harder theorem is that $1 - \ln 2$, not
              $1/2$, is the true ceiling at scale.
          - text: >
              Because the boxes are random, so nothing beats chance.
            feedback: >
              Chance alone gives $2^{-n}$, and cycle-following beats it by an
              astronomical factor. Randomness does not cap a strategy at chance.
        feedback: >
          In an interview: cite the optimality result rather than prove it, and
          give the reason it is plausible — the arrangement is the only shared
          randomness, and following its cycles aligns every search with it.
      - ask: >
          Now a hundred prisoners may each open $60$ boxes. What happens to the
          escape probability under cycle-following?
        choices:
          - text: >
              Still about $31\%$, since $1 - \ln 2$ does not depend on the
              boxes.
            feedback: >
              $1 - \ln 2$ is the limit for opening exactly half. Change the
              fraction and the tail sum changes.
          - text: >
              About $49\%$: failure becomes $H_{100} - H_{60} \approx 0.51$.
            correct: true
            feedback: >
              Failure is now a cycle longer than $60$, and there is still at
              most one. The tail sum runs from $61$ to $100$, close to
              $\ln(100/60) \approx 0.51$.
          - text: >
              About $60\%$, since each prisoner now opens $60\%$ of the boxes.
            feedback: >
              That is each prisoner's individual chance. The joint chance is
              one minus the tail sum, about $0.49$.
        feedback: >
          Re-derive the tail with the new threshold rather than reaching for
          the memorised $31\%$.

  - node: quant-puzzles.classics.ants-stick
    hook: >
      You never actually need to track a single collision to answer this
      puzzle — the entire trick is recognising that the observable state
      doesn't care whether ants bounce or walk through each other.
    explanation: >
      Two identical ants that collide and reverse are, from the outside,
      indistinguishable from two ants that walk straight through each other
      and swap names — both pictures produce the exact same set of occupied
      positions at every instant, because the two ants involved are
      physically identical and moving at the same speed either way. Since
      "when is the stick clear" is a question purely about occupied
      positions over time, not about which specific ant is where, the two
      pictures give the same answer even though they disagree about which
      ant ends up where.

      Under the pass-through picture, every phantom ant walks in a straight
      line at constant speed toward whichever end its own original direction
      points, completely ignorant of any other ant, and leaves within
      length-over-speed seconds no matter where it started. So the real,
      colliding stick clears by that same time bound — the worst case is one
      ant starting at an end and walking the full length, and the bound
      doesn't depend on how many ants there are or where they started.

      The same relabeling computes the clearing time for a specific
      configuration directly, not just the universal bound: each real ant's
      exit time equals its own phantom counterpart's straight-line exit time,
      so the clearing time for any particular arrangement is the maximum,
      over all ants, of the distance to the end that ant's own direction
      points toward, divided by the speed — no simulation of any collision
      required.
    worked: >
      A $100$ cm stick, ants at $10$ cm facing right, $50$ cm facing left, and
      $80$ cm facing right. Phantom exit times: the ant at $10$ exits after
      $100-10=90$ s; the ant at $50$ exits after $50$ s; the ant at $80$ exits
      after $100-80=20$ s. The stick clears at $t=90$ s, set by the leftmost
      ant's long walk to the right end, even though relabeling means the
      actual ant that exits there by then carries a different identity than
      the one that started at $10$.
    interview: >
      A frequent extension asks how many collisions occur, or when the first
      one happens — genuinely different questions the pass-through trick
      still answers cleanly: each collision corresponds to exactly one pair
      of a right-facing and a left-facing ant with the right-facing one
      starting to the left of the left-facing one, and the first collision
      happens at half the smallest such gap.
    pitfalls: >
      Using the relabeling trick to claim which specific ant exits which end
      is a direct misuse — identity is genuinely scrambled by the argument,
      only positions and timing survive it. Applying the same reasoning when
      the ants move at different speeds breaks it immediately, since "bounce
      equals pass-through swap" only holds for identical, equal-speed
      particles.
    recap: >
      Collisions are just relabelings of identical particles, so the stick
      clears by the time the slowest-to-exit phantom would take walking
      straight to its own end — at most the stick length divided by the
      speed, whatever the starting configuration.
    dialogue:
      - part: Two ants that bounce
        teach: >
          A stick $60$ cm long. Ants walk at $1$ cm/s; when two meet head-on,
          both reverse instantly, and an ant that reaches an end falls off.
          One ant starts at $10$ cm facing right, another at $25$ cm facing
          left, measured from the left end.
      - ask: >
          After how many seconds do they collide?
        expects: "7.5"
        feedback: >
          The gap is $15$ cm and it closes at $2$ cm/s: $7.5$ s, at the point
          $17.5$ cm.
      - ask: >
          After the bounce, each walks to an end. When is the stick clear?
        expects: "50"
        hint: >
          From $17.5$ cm, one ant walks left and one walks right.
        feedback: >
          The first ant turns back and walks $17.5$ cm left, falling off at
          $7.5 + 17.5 = 25$ s. The second walks $60 - 17.5 = 42.5$ cm right,
          falling off at $7.5 + 42.5 = 50$ s.
      - reflect: >
          Now imagine the ants are ghosts that pass straight through each
          other. When would each ghost fall off, and how does that compare
          with the real ants? What does the comparison suggest about
          collisions in general?
        hint: >
          The ghost from $10$ cm walks right the whole way; the ghost from
          $25$ cm walks left the whole way.
        answer: >
          The ghost from $10$ cm exits the right end at $50$ s and the ghost
          from $25$ cm exits the left end at $25$ s — the same two times as the
          real ants, with the names swapped. At a collision, two identical ants
          reversing look exactly like two ants passing through each other and
          trading names. Nobody watching positions alone could tell the
          pictures apart, so collisions change nothing but labels.

      - part: Collisions are relabelings
        teach: >
          That is the whole trick. Since the ants are identical and equally
          fast, the set of occupied positions is the same at every instant in
          the bouncing picture and in the pass-through picture. In the
          pass-through picture each ant walks straight off, so the stick
          clears when the slowest ghost leaves: the largest distance from an
          ant to the end it faces, divided by the speed.
      - ask: >
          Same stick and speed, five ants: at $5$ cm facing right, $12$ cm
          left, $30$ cm right, $41$ cm left, $52$ cm left. When is the stick
          clear?
        expects: "55"
        hint: >
          Each ghost walks to the end it faces. Which walk is longest?
        feedback: >
          Ghost walks: $60 - 5 = 55$, $12$, $60 - 30 = 30$, $41$, $52$. The
          longest is $55$ s. All the bouncing in between changes no exit time.
      - ask: >
          What is the worst case over every possible configuration on this
          stick, any number of ants?
        choices:
          - text: >
              It grows with the number of ants, since each collision costs time.
            feedback: >
              Collisions cost nothing: in the ghost picture there are none. Ten
              thousand ants clear exactly as fast as their longest ghost walk.
          - text: >
              $60$ s: no ghost walks more than $60$ cm, and one ant at an end
              facing inward walks exactly that.
            correct: true
            feedback: >
              Both halves of the guarantee: the ghost picture bounds every
              configuration by $60$, and a single ant at $0$ facing right
              attains it.
          - text: >
              $30$ s, since an ant is never more than $30$ cm from the nearer
              end.
            feedback: >
              An ant has to walk to the end it faces, not the nearer one. An ant
              at $1$ cm facing right walks $59$ cm.
        feedback: >
          The answer is the stick's length over the speed, whatever the number
          or placement of ants.

      - part: What else the ghosts answer
        ask: >
          In the five-ant configuration, after how many seconds does the first
          collision happen?
        expects: "3.5"
        hint: >
          Only a right-facing ant with a left-facing ant somewhere to its
          right can collide. Which such pair starts closest?
        feedback: >
          Facing pairs that close in on each other: $5$ and $12$, gap $7$;
          $30$ and $41$, gap $11$. The smaller gap closes at $2$ cm/s, so
          $7/2 = 3.5$ s.
      - ask: >
          How many collisions happen in total in that configuration?
        expects: "5"
        hint: >
          In the ghost picture, a collision is a crossing of two ghosts.
        feedback: >
          Two ghosts cross exactly when a right-facing one starts left of a
          left-facing one. The right-facer at $5$ crosses all three
          left-facers ($12$, $41$, $52$) and the one at $30$ crosses two
          ($41$, $52$): $3 + 2 = 5$.
      - ask: >
          Now one ant walks at $2$ cm/s and the rest at $1$. Does the ghost
          argument still give the clearing time?
        choices:
          - text: >
              Yes: collisions are still just relabelings.
            feedback: >
              A swap of names would hand the fast ant's speed to the slow ant's
              path. Two ants of different speeds bouncing do not look like two
              ghosts passing through.
          - text: >
              No: a bounce equals a pass-through only for identical ants at
              equal speed.
            correct: true
            feedback: >
              The relabeling needed both ants to be interchangeable. Once the
              speeds differ, the bouncing motion is genuinely different and has
              to be tracked.
          - text: >
              Yes, using the fast ant's speed for everyone.
            feedback: >
              That overstates every slow ant's pace. The picture breaks as soon
              as the ants are not interchangeable.
        feedback: >
          The symmetry is the hypothesis: identical ants, equal speeds. Drop it
          and the trick is gone.
      - teach: >
          Said aloud: "A collision between identical ants is the same as them
          passing through and swapping names, so each ant effectively walks
          straight off. The stick clears within $100$ seconds, the length over
          the speed, and one ant at an end attains it."

  - node: quant-puzzles.classics.chameleons
    hook: >
      The state space here is far too large to search by hand, which is
      exactly the signal to look for a single number every move leaves
      untouched, rather than trying to plan a sequence of meetings.
    explanation: >
      Any meeting changes the three colour counts by $-1, -1, +2$ in some
      order — two colours each lose one chameleon to the meeting, the third
      gains two. Track what this does to a pairwise difference: the
      difference between the two colours that met changes by $0$, since both
      dropped by exactly one, while the difference between either of those
      and the colour that gained changes by $2-(-1)=3$. So every pairwise
      difference shifts by a multiple of $3$ on every single move, regardless
      of which two colours happen to meet — the residue of each difference
      mod $3$ is an invariant.

      A monochrome island needs two of the three counts to be exactly zero,
      which forces the difference between those two colours to be exactly
      zero, and in particular $\equiv 0 \pmod 3$. So checking whether any
      pairwise difference among the starting counts is already $\equiv 0
      \pmod 3$ is a complete test: if no pair agrees mod $3$, monochrome is
      impossible from that starting count, no search required.

      This is the invariant strategy in its cleanest form — a numeric
      certificate replaces a search over an enormous space of meeting
      sequences, and it works because it's checked once against the moves'
      structure rather than against any particular sequence of them.
    worked: >
      Reds $11$, greens $16$, blues $20$. Mod $3$: $11 \equiv 2$,
      $16 \equiv 1$, $20 \equiv 2$ — red and blue share residue $2$, while
      green's residue $1$ disagrees with both. Since it's the pair sharing a
      residue whose difference can reach zero, red and blue are the two
      counts that could simultaneously hit zero, leaving green as the colour
      not excluded from becoming the island's monochrome colour — unlike
      $13, 15, 17$, where all three residues were distinct and no pairwise
      difference could ever reach zero.
    interview: >
      A common follow-up asks for the smallest change to the starting counts
      — add or remove one chameleon of a chosen colour — that would make
      monochrome achievable; that's answered by checking which single change
      makes two residues agree, not by searching for a meeting sequence.
    pitfalls: >
      Checking only one of the three pairwise differences mod $3$, rather
      than all three, risks missing the one pair that actually agrees, since
      a move could occur between any two of the colours. Assuming any
      recolouring you like is achievable in one step ignores that every legal
      move is constrained to exactly the $-1, -1, +2$ pattern on the counts.
    recap: >
      Every meeting shifts each pairwise colour-count difference by a
      multiple of $3$, so monochrome is only reachable when some pair of
      starting counts already agrees mod $3$ — a one-line check that replaces
      any search.
    dialogue:
      - part: Six chameleons
        teach: >
          An island holds $1$ red, $2$ green and $3$ blue chameleons. Whenever
          two of different colours meet, both turn the third colour. The
          question: can the whole island ever be a single colour?
      - ask: >
          A red meets a green. How many blue chameleons are there now?
        expects: "5"
        feedback: >
          Both turn blue: $(r, g, b)$ goes from $(1, 2, 3)$ to $(0, 1, 5)$.
          One green left to convert.
      - ask: >
          From $(0, 1, 5)$, can one more meeting make the island monochrome?
        choices:
          - text: >
              Yes: the green meets a blue, and both become blue.
            feedback: >
              Two chameleons of different colours take the *third* colour. A
              green and a blue both turn red, giving $(2, 0, 4)$.
          - text: >
              No: the only possible meeting, green with blue, produces two reds.
            correct: true
            feedback: >
              $(0, 1, 5)$ becomes $(2, 0, 4)$, further from monochrome than
              before. Close is not the same as reachable.
          - text: >
              Yes, if the green waits until it meets another green.
            feedback: >
              Two of the same colour meeting changes nothing. Only mixed
              meetings move the counts.
        feedback: >
          You can wander like this for a long time. Searching sequences will
          never prove the answer is no.
      - reflect: >
          Stop searching. Every meeting changes the counts by $-1$, $-1$, $+2$
          in some order. Look for a quantity that no meeting can change, and
          show it rules out a monochrome island here.
        hint: >
          Watch the differences between two counts, and think modulo $3$.
        answer: >
          A difference such as $b - g$ changes by $0$ or $\pm 3$ at every
          meeting, so each pairwise difference is fixed modulo $3$. A
          monochrome island has two counts equal to zero, so one difference is
          $0$. But $1, 2, 3$ leave remainders $1, 2, 0$ modulo $3$, all
          different, so no difference is ever a multiple of $3$. No sequence of
          meetings, however long, reaches one colour.

      - part: The invariant is the proof
        teach: >
          That is the method: find an invariant, a quantity every legal move
          preserves, and compare its value at the start with its value at the
          target. If they differ, the target is unreachable, and the argument
          covers every sequence at once — a proof, not a failed search. Here
          the invariant is the three counts' remainders modulo $3$, up to a
          common shift.
      - ask: >
          A red–green meeting sends $(r, g, b)$ to $(r - 1, g - 1, b + 2)$. By
          how much does $b - g$ change?
        expects: "3"
        feedback: >
          $(b + 2) - (g - 1) = (b - g) + 3$. Meanwhile $r - g$ does not change
          at all. Every pairwise difference moves by a multiple of $3$,
          whichever pair meets.
      - ask: >
          Another island: $4$ red, $6$ green, $10$ blue. Which single colour
          could the whole island become?
        choices:
          - text: >
              Red
            feedback: >
              All red needs green and blue both at zero, so $g - b \equiv 0$.
              But $6 - 10 = -4 \equiv 2 \pmod 3$. Ruled out.
          - text: >
              Green
            correct: true
            feedback: >
              All green needs $r - b \equiv 0$, and $4 - 10 = -6$ is a multiple
              of $3$. The invariant allows it, and it is in fact reachable.
          - text: >
              Blue
            feedback: >
              All blue needs $r - g \equiv 0$, but $4 - 6 = -2 \equiv 1
              \pmod 3$. Ruled out.
          - text: >
              None
            feedback: >
              The remainders are $1, 0, 1$: red and blue agree, so the pair that
              can both hit zero is red and blue, and green survives.
        feedback: >
          The pair of colours whose counts agree modulo $3$ are the ones that
          can vanish together; the third colour is the only candidate.
      - ask: >
          Heading for all green: a red meets a blue four times in a row. How
          many green chameleons are there now?
        expects: "14"
        feedback: >
          Each red–blue meeting adds two greens: $6 + 4 \cdot 2 = 14$, with
          counts $(0, 14, 6)$. Red and blue still differ by a multiple of $3$,
          as they must.

      - part: What an invariant can and cannot say
        ask: >
          For $5$ red, $8$ green and $9$ blue, a candidate computes
          $g - b = -1$, not a multiple of $3$, and declares that no colour can
          ever take over. Verdict?
        choices:
          - text: >
              Correct: one difference not divisible by $3$ is enough.
            feedback: >
              It rules out only the colour that needs green and blue both at
              zero, which is red. Two more differences remain to check.
          - text: >
              Wrong: $r - g = -3$ is a multiple of $3$, so all blue is not
              ruled out.
            correct: true
            feedback: >
              Each target colour has its own difference. Check all three pairs;
              any meeting can involve any two colours.
          - text: >
              Wrong: the invariant only applies when all counts are odd.
            feedback: >
              Parity plays no part. The invariant is the differences modulo
              $3$, for any counts.
        feedback: >
          Three target colours, three differences. Checking one and stopping
          is the classic slip.
      - ask: >
          An island of $3$ red, $0$ green, $0$ blue. Red minus green is $3$, a
          multiple of $3$, so the invariant does not rule out all blue. Can
          the island become all blue?
        choices:
          - text: >
              Yes: the invariant allows it, so some sequence reaches it.
            feedback: >
              An invariant only rules things out. Here no meeting can happen at
              all — every chameleon is red — so nothing ever changes.
          - text: >
              No: it is already monochrome red and no two different colours can
              ever meet.
            correct: true
            feedback: >
              The invariant is a necessary condition, not a sufficient one.
              Showing a target is reachable takes an actual sequence of moves.
          - text: >
              Yes, after exactly one meeting.
            feedback: >
              A meeting needs two different colours, and there is only red.
        feedback: >
          Mismatched invariant: impossible, with proof. Matching invariant: say
          "not ruled out", then exhibit the moves.
      - teach: >
          Said aloud for $13, 15, 17$: "Each meeting changes every pairwise
          difference by $0$ or $\pm 3$, so differences are invariant modulo
          $3$. The counts are $1, 0, 2$ modulo $3$, all distinct, so no two can
          reach zero together. No."

  - node: quant-puzzles.classics.water-jugs
    hook: >
      The same certificate move as the chameleons applies here with number
      theory standing in for modular colour-counting — checking one gcd tells
      you instantly whether an amount is reachable at all, before you plan a
      single pour.
    explanation: >
      Every legal move with two jugs of sizes $a$ and $b$ — filling one from
      the tap, emptying one down the drain, or pouring between them until the
      source empties or the target fills — changes each jug's content by a
      whole multiple of $a$ or $b$. That means at every intermediate moment,
      both jugs' contents are expressible as integer combinations $ax+by$ for
      some integers $x,y$, and by Bézout's identity the full set of integers
      reachable this way is exactly the multiples of $\gcd(a,b)$, capped by
      whichever jug is being read.

      When $\gcd(a,b)=1$, every whole number up to the larger jug's capacity
      is reachable, and the exact recipe comes straight out of Bézout's
      identity: writing the target as $ax-by$ for integers $x,y \ge 0$ tells
      you to perform $x$ fills of one jug and $y$ empties of the other,
      interleaved with the forced pours between them, to land on exactly that
      amount.

      When $\gcd(a,b)>1$, the obstruction is exactly as sharp as the
      chameleons' mod-$3$ check — no sequence of moves, however long, reaches
      an amount that isn't a multiple of the gcd, because every move
      preserves that property from the very first fill.
    worked: >
      A $4$-gallon and a $7$-gallon jug, target $5$ gallons; $\gcd(4,7)=1$ so
      it's reachable, via $4 \times 3 - 7 \times 1 = 5$. Fill $4$: $(4,0)$.
      Pour into $7$: $(0,4)$. Fill $4$: $(4,4)$. Pour into $7$, which takes
      $3$ before it's full: $(1,7)$. Empty $7$: $(1,0)$. Pour the $1$ across:
      $(0,1)$. Fill $4$: $(4,1)$. Pour into $7$, which has room for all $4$:
      $(0,5)$ — the $7$-gallon jug now holds exactly $5$, using three fills
      of the $4$-jug and one emptying of the $7$-jug, matching the identity
      exactly.
    interview: >
      A direct follow-up asks which amounts are unreachable with a given pair
      of jug sizes, answered instantly by gcd without searching pour
      sequences, while a harder one asks for the minimum number of moves to
      reach a specific reachable amount, which the gcd alone doesn't
      determine.
    pitfalls: >
      Assuming any amount up to the larger jug's capacity is reachable with
      any two jug sizes ignores the gcd obstruction entirely — $6$- and
      $8$-gallon jugs, gcd $2$, can never measure an odd amount. Trying to
      "pour half" or otherwise create a fractional intermediate amount isn't
      a legal move at all — every move is exactly fill-to-top, empty-to-zero,
      or pour-until-one-jug-hits-a-limit.
    recap: >
      Reachable amounts with jugs $a$ and $b$ are exactly the multiples of
      $\gcd(a,b)$, with Bézout's identity supplying both the proof and the
      actual fill-and-empty recipe.
    dialogue:
      - part: Four and nine
        teach: >
          Unmarked jugs of $4$ and $9$ gallons, a tap and a drain. A move is
          filling a jug to the brim, emptying a jug, or pouring one into the
          other until the source is empty or the target is full. You want
          exactly $6$ gallons standing in one jug.
      - ask: >
          Fill the $9$ and pour it into the empty $4$. How much is left in the
          $9$?
        expects: "5"
        feedback: >
          The $4$ takes $4$ and is full, leaving $9 - 4 = 5$.
      - ask: >
          Empty the $4$ and pour from the $9$ again. How much is left in the
          $9$ now?
        expects: "1"
        feedback: >
          Another $4$ leaves $5 - 4 = 1$. Pouring off whole loads of the small
          jug is how odd amounts appear: $9 - 2 \cdot 4 = 1$.
      - ask: >
          You have $1$ gallon in the $9$, and the $4$ to work with. How do
          you finish?
        choices:
          - text: >
              Fill the $4$ and pour it onto the $1$ in the $9$.
            feedback: >
              That gives $5$, not $6$. Adding to a small amount climbs by $4$s;
              you need a way to take $3$ off a full $9$.
          - text: >
              Empty the $4$, move the $1$ into it, fill the $9$, and top up the
              $4$ from the $9$.
            correct: true
            feedback: >
              The $4$ holding $1$ has room for exactly $3$, so topping it up
              leaves $9 - 3 = 6$ in the big jug.
          - text: >
              Pour half of the $9$ into the $4$.
            feedback: >
              "Half" is not a move. A pour stops only when the source empties
              or the target fills; there are no markings to stop at.
        feedback: >
          $9$ filled twice, $4$-loads taken off three times: $2 \cdot 9 - 3
          \cdot 4 = 6$.
      - reflect: >
          A friend with $6$- and $10$-gallon jugs has been pouring for an hour
          trying to get $5$. Before she pours again, what can you tell her
          about every amount she has ever seen in either jug, and why must it
          stay that way?
        hint: >
          Fill, empty and pour each move water in amounts set by the jugs.
        answer: >
          Every amount has been even. Filling gives $6$ or $10$, emptying gives
          $0$, and a pour moves either all of the source, which is even, or
          exactly the room left in the target, a capacity minus an even
          amount, also even. So "both jugs hold even amounts" is true at the
          start and survives every move. $5$ is odd, so she will never see it.

      - part: The gcd is the invariant
        teach: >
          In general, every amount that ever stands in a jug is an integer
          combination $a x + b y$ of the capacities, so it is a multiple of
          $\gcd(a, b)$: that is the invariant. Conversely, Bézout's identity
          writes every multiple of the gcd as such a combination, and the
          fill-pour-empty routine realises it. The reachable amounts are
          exactly the multiples of $\gcd(a, b)$ up to the larger jug.
      - ask: >
          Why does a pour keep both contents multiples of $\gcd(a, b)$?
        choices:
          - text: >
              Because pours always move a whole jugful.
            feedback: >
              A pour often moves part of a jug: with $5$ gallons in the $9$ and
              the $4$ empty, a pour moves only $4$ of the $5$. What is true is
              that the amount moved is a multiple of the gcd.
          - text: >
              It moves either the whole source or the target's remaining room,
              and both are multiples of the gcd.
            correct: true
            feedback: >
              The source's contents are a multiple by the invariant so far, and
              the room is a capacity minus a multiple. Either way the transfer
              is a multiple, so the invariant survives.
          - text: >
              Because the total water in the two jugs never changes.
            feedback: >
              The total changes with every fill and every empty. A pour keeps the
              total fixed, but the invariant is about each jug's contents.
        feedback: >
          The same certificate logic as the chameleons: check the start, check
          that every move preserves the property, and conclude about every
          sequence at once.
      - ask: >
          Write $6 = 9 x + 4 y$ with $x = 2$, as your sequence did. What is
          $y$?
        expects: "-3"
        feedback: >
          $6 = 2 \cdot 9 - 3 \cdot 4$. The two fills of the $9$ are the $2$;
          the $-3$ is three $4$-gallon loads taken out of the big jug, two
          drained and one left standing in the small jug.
      - ask: >
          With $6$- and $10$-gallon jugs, which of these can stand in one jug?
        choices:
          - text: >
              $3$
            feedback: >
              $3$ is odd, and every amount is even. The gcd is $2$, not $1$.
          - text: >
              $4$
            correct: true
            feedback: >
              $4 = 10 - 6$: fill the $10$ and pour into the $6$. It is a
              multiple of $\gcd(6, 10) = 2$, as it must be.
          - text: >
              $5$
            feedback: >
              Odd, so ruled out by the invariant, however long anyone pours.
        feedback: >
          The gcd decides the reachable set without a single trial pour.

      - part: What the gcd does not tell you
        ask: >
          The gcd tells you $6$ is reachable with jugs of $4$ and $9$. What
          else does it tell you?
        choices:
          - text: >
              The fewest moves needed.
            feedback: >
              It does not. Reachability is a divisibility fact; the move count
              depends on which combination you realise and in which jug, and
              needs a short search or careful bookkeeping.
          - text: >
              Which jug the $6$ will end up in.
            feedback: >
              $6$ can only stand in the $9$-gallon jug here, but that comes
              from the capacities, not from the gcd.
          - text: >
              Only that some sequence of moves exists.
            correct: true
            feedback: >
              That is all the invariant and Bézout say together: possible, and
              how to build one route. The shortest route is a separate
              question.
        feedback: >
          Interviewers often ask both: "which amounts are possible" is a gcd
          answer; "in how few moves" is a search.
      - teach: >
          Said aloud for $3$ and $5$ with target $4$: "Every amount is a
          combination of $3$ and $5$, so a multiple of $\gcd(3, 5) = 1$ —
          nothing is ruled out. $4 = 2 \cdot 5 - 2 \cdot 3$: fill the $5$ twice
          and pour off two $3$s."
