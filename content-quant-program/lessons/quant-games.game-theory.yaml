unit: quant-games.game-theory
opening: >
  Game theory turns "what should I do" into "what should I do given what everyone else will do" — this unit builds that machinery from a bare payoff matrix upward. It opens with normal-form games, dominance, and Nash equilibrium, the two solution concepts that settle most one-shot problems outright, then adds mixed strategies and the indifference principle for games where no pure prediction survives, worked through matching pennies, battle of the sexes, and von Neumann's minimax theorem for zero-sum play. It moves next to sequential games — extensive-form trees, backward induction, credible threats, and first-mover logic — and closes with two set pieces on where the theory bends against real opponents: guess-two-thirds-of-the-average with the levels-of-reasoning model, and repeated-game cooperation, where patience rather than goodwill sustains what one-shot dominance forbids.
lessons:
  - node: quant-games.game-theory.normal-form
    hook: >
      Every "here's a game" prompt in an interview is really asking you to name three things — players, strategies, payoffs — before you touch any solution concept, and skipping straight to "the answer" without naming them is the most common tell of an unprepared candidate.
    explanation: >
      A normal-form game is nothing but a payoff table: finitely many players, a finite menu of pure strategies for each, and a number assigned to every player at every combination of choices. The number matters as a cardinal utility, not just a ranking, precisely because the fair-value logic you already know for a single random payoff — pricing it by its expectation — only makes sense to apply to a mixed strategy if averaging payoffs is meaningful in the first place. That is the entire reason payoffs are utilities and not, say, ordinal ranks.
      Two features do the real work: everyone chooses once, simultaneously, with no communication, and the whole structure — every player's strategies and every payoff — is common knowledge to all players. Common knowledge is stronger than "each player knows the payoffs": it means each player knows the others know, knows that they know that, and so on, which is what licenses reasoning about what a rational opponent will conclude rather than just what they happen to prefer.
      Writing the matrix as prose row lists, one row per strategy of the row player and one payoff pair per column, is just notation — the object being described is the same whether you draw a grid or write it out. "Solve the game" means predict which cell rational, common-knowledge-sharing players land on, and every technique in this unit is a different route to that prediction.
    worked: >
      Take a game with three players who each choose between two strategies, with no dominance or symmetry assumed yet — just the bookkeeping. The payoff function must specify a number for every player at every combination of choices, and the count of combinations is the product of the strategy-set sizes: $2 \times 2 \times 2 = 8$ strategy profiles, each needing three payoff numbers written down. A fourth player with three strategies instead of two would push the count to $2^3 \times 3 = 24$ profiles — the size of the object you're solving grows fast, which is exactly why later techniques exist to avoid checking every cell by hand.
    interview: >
      "Set up the game" is the opening move of nearly every game-theory prompt, and interviewers are listening for players, strategy sets, and payoffs named explicitly — including whether the payoffs are genuinely cardinal — before any talk of equilibria.
    pitfalls: >
      Writing payoffs as rankings ("row prefers this to that") instead of numbers quietly breaks every later tool that needs expectations, since mixed strategies and indifference conditions are arithmetic on the numbers themselves. Forgetting the common-knowledge assumption leads to solving a different, harder problem — one with private information — that the stated game never asked for.
    recap: >
      A normal-form game is players, strategy sets, and a cardinal payoff at every profile, common knowledge to all, simultaneous and communication-free — the one object every solution concept in this unit operates on.
    steps:
      - teach: >
          A normal-form game is nothing but a payoff table: finitely many
          players, a finite menu of pure strategies for each, and a number
          assigned to every player at every combination of choices.
      - teach: >
          Those numbers must be cardinal utilities, not rankings, because
          pricing a mixed strategy by its expected payoff only makes sense if
          averaging the numbers is meaningful in the first place.
      - ask: >
          Why must payoffs be cardinal numbers rather than just a ranking of
          outcomes from best to worst?
        choices:
          - text: >
              Because interviewers find numbers easier to grade than words
            feedback: >
              True but beside the point — the requirement is mathematical, not
              stylistic.
          - text: >
              Because evaluating a mixed strategy means averaging payoffs, and
              only cardinal numbers can be averaged meaningfully
            correct: true
            feedback: >
              Right — the fair-value logic behind pricing a random payoff by
              its expectation only applies once the payoffs are numbers, not
              an ordering.
          - text: >
              Because ties between outcomes are impossible once numbers are
              used
            feedback: >
              Numbers can tie just as easily as rankings can — that isn't why
              cardinality matters here.
        feedback: >
          Rankings support comparisons; only cardinal utilities support the
          expectations that mixed-strategy analysis needs.
      - teach: >
          Two more features complete the definition: everyone chooses once,
          simultaneously, with no communication, and the whole structure is
          common knowledge — each player knows the others know it, knows that
          they know that, without end.
      - ask: >
          A fresh instance, just the bookkeeping: $4$ players each choose
          between $3$ pure strategies. How many strategy profiles does the
          payoff function need to cover?
        expects: "81"
        hint: >
          The count of profiles is the product of the strategy-set sizes, one
          factor per player.
        feedback: >
          $3\times 3\times 3\times 3 = 3^{4} = 81$ profiles, each needing four
          payoff numbers written down — which is exactly why later techniques
          exist to avoid checking every cell by hand.
      - ask: >
          "Common knowledge" is stronger than "every player knows the
          payoffs." What does it add?
        choices:
          - text: >
              Nothing extra — common knowledge just means each player has seen
              the payoff matrix
            feedback: >
              That's mutual knowledge, one level. Common knowledge is the
              infinite tower built on top of it.
          - text: >
              Each player knows the others know the payoffs, knows that they
              know that, and so on without end
            correct: true
            feedback: >
              That infinite regress is what licenses reasoning about what a
              rational opponent will conclude, not just what they prefer.
          - text: >
              The payoffs must also be visible to a neutral outside referee
            feedback: >
              The game needs no referee at all — common knowledge is about
              what the players know about each other.
        feedback: >
          Common knowledge means the payoffs, and the fact that everyone knows
          them, and the fact that everyone knows that, iterate without end —
          it's what makes strategic reasoning about the opponent's reasoning
          valid.
      - teach: >
          Writing the matrix as prose row lists rather than a drawn grid is
          just notation. "Solving" the game means predicting which cell
          rational, common-knowledge-sharing players land on — every technique
          in this unit is a route to that one prediction.

  - node: quant-games.game-theory.dominance
    hook: >
      Dominance is the first move at the board, not the last resort: an easy game solves itself the instant you spot a strategy that beats everything else no matter what the opponent does, and reaching for equilibrium machinery before checking this is wasted effort.
    explanation: >
      A strategy dominates another for a player if it pays at least as much against every possible opponent profile — strictly if it always pays more, weakly if it ties somewhere and wins elsewhere. The force of "every possible opponent profile" is what makes this the cheapest kind of reasoning available: a player who has a dominant strategy needs zero beliefs about what the opponent will actually do, since the comparison already holds against all of them simultaneously.
      Once a strategy is strictly dominated, deleting it and repeating the check on the smaller game is safe — iterated elimination — because a rational player never plays a strictly dominated strategy regardless of what survives elsewhere, so removing it changes nothing about anyone's remaining incentives. That safety is specific to strict dominance: deleting a weakly dominated strategy can depend on the order you delete in, and can delete equilibria that strict elimination never would, so a solution reached via weak elimination needs that caveat stated explicitly.
      The general pattern worth carrying forward: whenever a matrix has an entire row or column that's uniformly worse, cross it out and re-examine the smaller matrix — sometimes one pass is enough, sometimes deleting a strategy exposes a new dominance relation that wasn't visible before.
    worked: >
      Take row strategies $X, Y$ against column strategies $L, R$, with payoffs (row, column): row $X$: $(3,2)$ against $L$, $(2,5)$ against $R$; row $Y$: $(3,1)$ against $L$, $(1,0)$ against $R$. Comparing $X$ to $Y$ for the row player: against $L$ they tie at $3$, against $R$, $X$ pays $2$ against $Y$'s $1$ — so $X$ weakly dominates $Y$, and $Y$ can be deleted. The column player, facing only row $X$ now, compares $2$ (from $L$) against $5$ (from $R$) and plays $R$. The game resolves to $(X,R)$, paying $(2,5)$.
    interview: >
      "Is there a dominant strategy here" wants the check run explicitly — compare each pair of strategies across every opponent action, not just the one that seems likely — and "can you simplify this matrix first" is asking for exactly the delete-and-repeat move before any equilibrium concept is invoked.
    pitfalls: >
      Confusing "this beats that against the opponent's most likely move" with true dominance, which must hold against every opponent action without exception. Using weak-dominance elimination without flagging that the result can depend on deletion order and can discard equilibria that survive strict elimination.
    recap: >
      A dominant strategy needs no guess about the opponent at all; delete strictly dominated rows and columns and repeat, and many games solve themselves before any equilibrium concept is needed.
    steps:
      - teach: >
          A strategy dominates another for a player if it pays at least as
          much against every possible opponent profile — strictly if it always
          pays more, weakly if it ties somewhere and wins elsewhere.
      - teach: >
          "Every possible opponent profile" is what makes this the cheapest
          reasoning available: a player with a dominant strategy needs zero
          beliefs about what the opponent will actually do.
      - ask: >
          Fresh matrix, payoffs $(\text{row}, \text{column})$: row $A$:
          $(4,3)$ against $L$, $(6,1)$ against $R$; row $B$: $(2,5)$ against
          $L$, $(2,0)$ against $R$. Which row strategy is strictly dominated?
        choices:
          - text: >
              Row $A$
            feedback: >
              $A$ pays $4$ and $6$ against $L$ and $R$ — both larger than
              $B$'s $2$ and $2$. $A$ is the one doing the dominating.
          - text: >
              Row $B$
            correct: true
            feedback: >
              Against $L$, $B$'s $2$ loses to $A$'s $4$; against $R$, $B$'s
              $2$ loses to $A$'s $6$. $A$ pays strictly more no matter what
              the column player does, so $B$ is strictly dominated.
          - text: >
              Neither — the rows aren't comparable without knowing the column
              player's move
            feedback: >
              That's exactly what dominance rules out: the comparison holds
              against every column action simultaneously, so no guess about
              the opponent is needed.
        feedback: >
          $A$ beats $B$ against both $L$ and $R$, so $B$ is strictly dominated
          and can be deleted.
      - ask: >
          After deleting the dominated row, only row $A$ remains: $(4,3)$
          against $L$, $(6,1)$ against $R$. What payoff does the column player
          secure by playing optimally?
        expects: "3"
        hint: >
          Compare the column player's two remaining numbers, $3$ from $L$ and
          $1$ from $R$, and take the larger.
        feedback: >
          With $B$ gone, the column player compares $3$ (from $L$) against $1$
          (from $R$) and plays $L$ for a payoff of $3$ — the game resolves to
          $(A,L)$.
      - teach: >
          The general pattern: whenever a matrix has an entire row or column
          that's uniformly worse, cross it out and re-examine the smaller
          matrix. Sometimes deleting one strategy exposes a new dominance
          relation that wasn't visible before.
      - ask: >
          A solution reached by deleting a weakly dominated strategy (ties
          somewhere, strictly worse elsewhere) — is it as safe as deleting a
          strictly dominated one?
        choices:
          - text: >
              Yes — weak and strict elimination are interchangeable
            feedback: >
              They aren't. Strict elimination is order-independent and never
              removes an equilibrium; weak elimination has neither guarantee.
          - text: >
              No — weak elimination can depend on the order strategies are
              deleted in, and can discard equilibria that strict elimination
              never would
            correct: true
            feedback: >
              Exactly — that dependence is why a solution reached via weak
              elimination needs the caveat stated explicitly.
          - text: >
              No — weak elimination is never safe to use at all
            feedback: >
              It's usable, just riskier: state the caveat rather than avoiding
              it entirely.
        feedback: >
          Strict dominance elimination is safe and order-free; weak dominance
          elimination is order-dependent and can delete genuine equilibria, so
          flag it when you use it.

  - node: quant-games.game-theory.prisoners-dilemma
    hook: >
      Every "why do cartels collapse" or "why does everyone advertise even though it hurts margins" question is this exact skeleton wearing a different costume, and naming the payoff ordering $T>R>P>S$ out loud is the fastest way to signal you recognize it.
    explanation: >
      The mechanism is pure dominance: whichever action pays more regardless of the opponent's choice wins the comparison against every alternative, so the specific numbers matter far less than their ordering. Call the temptation payoff $T$ (defecting against a cooperator), the reward $R$ (mutual cooperation), the punishment $P$ (mutual defection), and the sucker's payoff $S$ (cooperating against a defector); whenever $T>R>P>S$ holds, defection strictly dominates for both players by the same logic worked in the dominance node, and the unique equilibrium is mutual defection at $P$, strictly worse for both than the unreachable $R$.
      The result that makes this worth a name of its own is the gap between what's individually rational and what's collectively best: nobody deviates unilaterally from mutual defection, since deviating alone only trades $P$ for the even worse $S$, yet an outside observer who could dictate both moves would pick mutual cooperation instantly. Recognizing this shape — individually optimal, jointly destructive — is the actual skill, since the surface story changes constantly: price wars, arms races, doping, tariffs, all reduce to the same four numbers in the same order.
    worked: >
      Two oil producers each choose to Cut output or Flood the market. Both cutting pays $(6,6)$; one flooding while the other cuts pays the flooder $9$ and the cutter $2$; both flooding pays $(4,4)$. Here $T=9$, $R=6$, $P=4$, $S=2$, and $9>6>4>2$ confirms the ordering. Flooding dominates for each producer — against a cutting rival it pays $9$ versus $6$, against a flooding rival it pays $4$ versus $2$ — so both flood, collecting $4$ each instead of the $6$ each they'd get by holding output down.
    interview: >
      "Why does a cartel break down even though everyone would be better off holding the line?" is the standard phrasing, and the interviewer is listening for the dominance argument stated explicitly, plus the phrase "individually rational, collectively destructive," not just the observation that cooperation would be nicer.
    pitfalls: >
      Picking the jointly best cell $(R,R)$ as "the answer" because it's Pareto-superior — that's a description of what's efficient, not a prediction of what dominance-driven play actually produces. Assuming this one-shot analysis automatically extends to repeated play, where a different logic about patience and discount factors takes over.
    recap: >
      Whenever payoffs satisfy $T>R>P>S$, defection strictly dominates for both players and the unique equilibrium is the mutually worse $P$, not the jointly better $R$ neither can reach alone.
    steps:
      - teach: >
          The mechanism is pure dominance applied to a specific shape:
          whichever action pays more regardless of the opponent's choice wins
          the comparison against every alternative.
      - teach: >
          Label the payoffs temptation $T$ (defecting against a cooperator),
          reward $R$ (mutual cooperation), punishment $P$ (mutual defection),
          and sucker $S$ (cooperating against a defector). Whenever $T>R>P>S$,
          defection strictly dominates for both players.
      - ask: >
          Two firms each choose to Hold price or Advertise heavily. Payoffs
          $(\text{row},\text{column})$: both Hold: $(5,5)$; one Advertises
          while the other Holds: advertiser $8$, holder $1$; both Advertise:
          $(3,3)$. Which action strictly dominates for each firm?
        choices:
          - text: >
              Hold
            feedback: >
              Holding pays $5$ against a holding rival but only $1$ against an
              advertising one — worse than Advertise's $3$ there. Hold is
              dominated, not dominant.
          - text: >
              Advertise
            correct: true
            feedback: >
              Against a holding rival, Advertise pays $8$ versus Hold's $5$;
              against an advertising rival, it pays $3$ versus $1$. Advertise
              pays more regardless of the rival's move.
          - text: >
              It depends on what the rival firm does
            feedback: >
              That's precisely what dominance rules out — the comparison holds
              against every rival action at once, so no prediction about the
              rival is needed.
        feedback: >
          $T=8$, $R=5$, $P=3$, $S=1$, and $8>5>3>1$ confirms the ordering:
          Advertise strictly dominates for both firms.
      - ask: >
          What payoff does each firm collect at the unique equilibrium?
        expects: "3"
        hint: >
          Both firms play their dominant strategy against each other.
        feedback: >
          Both firms advertise, landing on the mutual-defection cell $(3,3)$ —
          the punishment payoff $P=3$, strictly worse for both than the
          unreachable $R=5$.
      - teach: >
          Nobody deviates unilaterally from mutual defection: deviating alone
          only trades $P$ for the even worse $S$. An outside observer who
          could dictate both moves would pick mutual cooperation instantly —
          but neither firm can get there alone.
      - ask: >
          Which cell does dominance-driven rational play actually reach in
          this game?
        choices:
          - text: >
              $(R,R)$, both Holding, since it pays the most in total
            feedback: >
              That's the Pareto-superior outcome, a description of what's
              efficient — not a prediction of what dominance-driven play
              produces.
          - text: >
              $(P,P)$, both Advertising, even though it's worse for both than
              $(R,R)$
            correct: true
            feedback: >
              Dominance forces both firms to Advertise regardless of what
              would be jointly better — individually rational, collectively
              destructive.
          - text: >
              Whichever cell has the highest total combined payoff
            feedback: >
              Dominance is about each player's own comparison across opponent
              actions, not about maximizing the sum of payoffs.
        feedback: >
          The unique equilibrium is the mutually worse $(P,P)$, not the
          jointly better $(R,R)$ that neither firm can reach alone.
      - teach: >
          The surface story changes constantly — price wars, arms races,
          doping, tariffs — but all of them reduce to the same four numbers in
          the same order. Naming $T>R>P>S$ out loud is the fastest way to
          signal you recognize the shape.

  - node: quant-games.game-theory.nash
    hook: >
      "What's the equilibrium here" is the single most common question in this unit, and the correct first move is naming best response before anything else — everything downstream, mixed or pure, is one instance of the same fixed-point idea.
    explanation: >
      A strategy is a best response if nothing else a player could do pays more, holding every other player's choice fixed; a Nash equilibrium is a full profile where every player's piece is simultaneously a best response to everyone else's. Two ways of saying this are worth having cold: it's the only prediction that stays correct even after being announced to every player, since knowing the profile in advance gives nobody a reason to deviate, and it's the profile you could publish without regret, because no unilateral deviation would have paid better.
      Dominance and Nash equilibrium connect directly: if a profile consists entirely of dominant strategies, it's automatically a Nash equilibrium, since a strategy that beats everything beats the specific thing the opponent chose. Iterated elimination of strictly dominated strategies never removes a genuine equilibrium either, which is why checking for dominance first, as in the dominance node, never costs you the right answer.
      What Nash equilibrium does not promise is worth stating just as plainly: nothing about efficiency, since the prisoners' dilemma's unique equilibrium is strictly worse for both players than an unreachable alternative, and nothing about uniqueness — a game can have several equilibria with no ranking between them supplied by the definition itself.
    worked: >
      Take row strategies $U,D$ against column strategies $L,R$ with payoffs (row, column): $U$ vs $L$: $(3,2)$, $U$ vs $R$: $(1,1)$; $D$ vs $L$: $(0,0)$, $D$ vs $R$: $(2,3)$. Check $(U,L)$: the row player's alternative $D$ against $L$ pays $0$, worse than $3$, so no incentive to switch; the column player's alternative $R$ against $U$ pays $1$, worse than $2$, so no incentive there either — $(U,L)$ is a Nash equilibrium worth $(3,2)$. The identical check confirms $(D,R)$ is also an equilibrium, worth $(2,3)$: this game has two pure equilibria, exactly the non-uniqueness the definition allows.
    interview: >
      "Is this profile an equilibrium?" tests one specific check, run for every player in turn: fix everyone else, does this player have a strictly better alternative. "How many equilibria does this game have?" is listening for whether you assume uniqueness by default — don't.
    pitfalls: >
      Checking only one player's incentive to deviate and declaring victory — every player must be simultaneously unable to improve. Treating "the best outcome for both players" as automatically the equilibrium; efficiency is not part of the definition at all.
    recap: >
      A Nash equilibrium is a profile where every player's strategy is a best response to the rest — self-consistent once announced, but silent on efficiency and on uniqueness.
    steps:
      - teach: >
          A strategy is a best response if nothing else a player could do pays
          more, holding every other player's choice fixed. A Nash equilibrium
          is a full profile where every player's piece is simultaneously a
          best response to everyone else's.
      - teach: >
          Two readings are worth having cold: it's the only prediction that
          stays correct even after being announced to every player, and it's
          the profile you could publish without regret, since no unilateral
          deviation would have paid better.
      - ask: >
          Fresh matrix, payoffs $(\text{row},\text{column})$: row $P$: $(2,4)$
          against $M$, $(5,1)$ against $N$; row $Q$: $(3,3)$ against $M$,
          $(1,2)$ against $N$. Is $(P,N)$, paying $(5,1)$, a Nash equilibrium?
        choices:
          - text: >
              Yes — $5$ is the highest payoff either player earns anywhere in
              the matrix
            feedback: >
              The size of one player's payoff never settles the question; both
              players must be simultaneously unable to improve.
          - text: >
              No — holding row fixed at $P$, the column player earns $4$ by
              switching to $M$ versus only $1$ from $N$, so column wants to
              deviate
            correct: true
            feedback: >
              Exactly the check that matters: with row at $P$, column compares
              $M$'s $4$ against $N$'s $1$ and strictly prefers $M$, so $(P,N)$
              is not stable.
          - text: >
              No — holding column fixed at $N$, the row player would rather
              switch to $Q$
            feedback: >
              Row's alternative $Q$ against $N$ pays only $1$, worse than
              $P$'s $5$ — row has no reason to deviate here.
        feedback: >
          $(P,N)$ fails because column, seeing row play $P$, strictly prefers
          $M$'s $4$ to $N$'s $1$ — one unhappy player is enough to break an
          equilibrium.
      - ask: >
          What is the row player's payoff at the actual Nash equilibrium of
          this matrix?
        expects: "3"
        hint: >
          Check $(Q,M)$: does either player have a profitable unilateral
          deviation?
        feedback: >
          At $(Q,M)$, row's alternative $P$ against $M$ pays $2 < 3$, and
          column's alternative $N$ against $Q$ pays $2 < 3$ — neither wants to
          move, so $(Q,M)$ is the equilibrium, paying row a payoff of $3$.
      - teach: >
          Dominance and Nash connect directly: a profile of dominant
          strategies is automatically a Nash equilibrium, and iterated
          elimination of strictly dominated strategies never removes a genuine
          equilibrium either.
      - ask: >
          If a strategy profile consists entirely of dominant strategies, is
          it automatically a Nash equilibrium?
        choices:
          - text: >
              Yes — a strategy that beats everything also beats the specific
              thing the opponent actually chose
            correct: true
            feedback: >
              Right — dominance is a stronger condition than best response, so
              it implies best response against whatever the opponents settle
              on.
          - text: >
              No — dominance and Nash equilibrium are unrelated concepts
            feedback: >
              They're closely related: dominance is the strongest way a
              strategy can be a best response, since it beats every opponent
              action, not just the one played.
          - text: >
              Only if there is exactly one dominant strategy per player
            feedback: >
              There's at most one strictly dominant strategy per player
              anyway; the implication holds regardless of how many players
              have one.
        feedback: >
          A dominant strategy beats every opponent action, so it beats
          whatever the opponent actually plays — dominant-strategy profiles
          are always Nash equilibria.
      - teach: >
          What Nash equilibrium does not promise is just as important: nothing
          about efficiency, and nothing about uniqueness — a game can have
          several equilibria with no ranking supplied by the definition
          itself.

  - node: quant-games.game-theory.mixed-strategy
    hook: >
      The moment a matrix has no dominant strategy and every cell tempts someone to switch, the fix is randomizing your own play — quant desks call the result "balanced" or "unexploitable," and the machinery behind that word is exactly this node.
    explanation: >
      A mixed strategy is a probability distribution over a player's pure strategies, realized by private randomization the opponent never observes before acting. Payoffs against a mix are plain expectations: with row probabilities $p_i$, column probabilities $q_j$, and row payoffs $a_{ij}$, the row player's expected payoff is $\sum_{i,j} p_i a_{ij} q_j$ — linear in $p$ for fixed $q$, and linear in $q$ for fixed $p$, since mixing never interacts nonlinearly with the payoff numbers themselves.
      Linearity has one consequence worth internalizing before anything else: because expected payoff is a weighted average, the best mixed reply can never beat the best pure reply — it can only tie it. That forces the optimality condition used everywhere downstream: a mix is optimal exactly when every pure strategy receiving positive probability is itself already a best reply, tied with every other strategy in the mix. The set of strategies actually receiving positive weight is the support, and strategies outside it must pay strictly less, or including them would improve the mix.
    worked: >
      Take row payoffs $a_{UL}=4$, $a_{UR}=1$, $a_{DL}=2$, $a_{DR}=5$, and suppose the row player mixes $p=0.6$ on $U$ while the column player mixes $q=0.4$ on $L$. The row player's expected payoff is $pq(4) + p(1-q)(1) + (1-p)q(2) + (1-p)(1-q)(5) = 0.24(4)+0.36(1)+0.16(2)+0.24(5) = 0.96+0.36+0.32+1.2 = 2.84$. Nothing here claims these particular $p,q$ are optimal — the number just confirms the formula's mechanics: a weighted average over all four cells, nothing more exotic.
    interview: >
      "If you randomize 60/40, what's your expected payoff against this opponent?" wants the double sum computed directly; a sharper follow-up, "why would you ever put positive weight on a strategy that isn't your single best reply," is testing whether you know optimal mixes only ever include tied best replies.
    pitfalls: >
      Treating a mixed strategy as something the opponent can condition on in real time — it's private, so only the distribution, never the realized draw, factors into anyone else's decision. Confusing the support with the full strategy set; strategies outside the support are typically strictly worse, not merely unused by convention.
    recap: >
      Payoffs against a mix are linear weighted averages, so an optimal mix can only place weight on strategies that are themselves tied for best reply — the support.
    steps:
      - teach: >
          A mixed strategy is a probability distribution over a player's pure
          strategies, realized by private randomization the opponent never
          observes before acting.
      - teach: >
          Payoffs against a mix are plain expectations: with row probabilities
          $p_i$, column probabilities $q_j$, and row payoffs $a_{ij}$, the row
          player's expected payoff is $\sum_{i,j} p_i a_{ij} q_j$ — linear in
          $p$ for fixed $q$, and linear in $q$ for fixed $p$.
      - ask: >
          Fresh payoffs $a_{UL}=3$, $a_{UR}=6$, $a_{DL}=5$, $a_{DR}=2$. The
          row player mixes $p=0.5$ on $U$, the column player mixes $q=0.3$ on
          $L$. What is the row player's expected payoff?
        expects: "4"
        hint: >
          Weight each of the four cells by the probability of landing there:
          $pq$, $p(1-q)$, $(1-p)q$, $(1-p)(1-q)$.
        feedback: >
          $pq(3)+p(1-q)(6)+(1-p)q(5)+(1-p)(1-q)(2) =
          0.15(3)+0.35(6)+0.15(5)+0.35(2) = 0.45+2.1+0.75+0.7 = 4$.
      - teach: >
          Because expected payoff is a weighted average, the best mixed reply
          can never beat the best pure reply — it can only tie it. That forces
          the optimality condition: a mix is optimal exactly when every
          strategy in it is itself a best reply, tied with the others in the
          mix.
      - ask: >
          Row's optimal mix places positive weight on both $U$ and $D$. What
          must be true of $U$ and $D$'s expected payoffs against column's mix
          for that to be optimal?
        choices:
          - text: >
              $U$ must pay strictly more than $D$
            feedback: >
              If $U$ paid strictly more, putting any weight on $D$ would be
              wasteful — $D$ would have to be excluded from the mix entirely.
          - text: >
              $U$ and $D$ must pay exactly the same expected payoff against
              column's mix
            correct: true
            feedback: >
              That shared value is what "indifference" means: any strategy
              receiving positive weight in an optimal mix must tie every other
              strategy in the mix.
          - text: >
              The expected payoff must exceed every other cell in the matrix
            feedback: >
              Optimality is about comparing $U$ and $D$'s expected payoffs to
              each other, not to individual cell entries.
        feedback: >
          An optimal mix only ever places weight on strategies tied for best
          reply — the strategies outside that tie, outside the support, must
          pay strictly less.
      - teach: >
          The set of strategies actually receiving positive weight is the
          support. Strategies outside it aren't merely unused by convention —
          including them would strictly worsen the mix.
      - ask: >
          Can the opponent factor the specific realized draw of your mixed
          strategy into their decision before they act?
        choices:
          - text: >
              Yes, if they're rational they can infer the realized draw
            feedback: >
              Rationality doesn't grant information the opponent doesn't have
              — the randomization is private.
          - text: >
              No — only the distribution, never the realized draw, factors
              into anyone else's decision
            correct: true
            feedback: >
              Mixing is private randomization: the opponent best-responds to
              your distribution, not to a draw they haven't seen.
          - text: >
              Only after the game has been played many times
            feedback: >
              Even in a single play, the opponent never observes the draw
              before acting — that's what makes it a mixed strategy rather
              than a signal.
        feedback: >
          A mixed strategy is private by definition; the opponent's best
          response is to the distribution, never to a realized draw they can't
          see.

  - node: quant-games.game-theory.nash-existence
    hook: >
      "Does this game even have an equilibrium?" is a real question worth two seconds of thought before diving into algebra, and the honest answer for any finite game is yes — immediately followed by "but that doesn't tell us what it is."
    explanation: >
      Nash's theorem guarantees that every game with finitely many players, each holding finitely many pure strategies, has at least one Nash equilibrium once mixed strategies are allowed. The proof applies Kakutani's fixed-point theorem to the best-response correspondence defined on the product of the players' probability simplices — a compact, convex domain mapped to nonempty, convex sets by a correspondence that behaves continuously enough for the fixed-point argument to bite. A fixed point of that correspondence is, by construction, a profile where everyone is simultaneously best-responding to everyone else, which is exactly a Nash equilibrium.
      The theorem is a pure existence statement: it names no algorithm, so finding the guaranteed equilibrium is always separate work, typically the indifference reasoning built next in this unit. It also buys nothing beyond existence — a game can have many equilibria or exactly one, and none of them are guaranteed efficient, so "an equilibrium exists" answers a narrower question than it might sound like.
    worked: >
      Consider a game with $3$ players, each holding $4$ pure strategies — a genuinely large object, with $4^3 = 64$ strategy profiles in total. Nash's theorem guarantees at least one of those $64$ profiles' worth of mixed-strategy space contains an equilibrium, regardless of how the payoffs are actually filled in, as long as every player's strategy set stays finite. Swapping in a continuous strategy space, like a price chosen from an interval, drops the hypothesis the theorem needs and existence has to be argued separately.
    interview: >
      "Does this game have an equilibrium?" wants "yes, by Nash's theorem, since it's finite" stated immediately, with a same-breath follow-up that existence doesn't hand you the equilibrium itself — interviewers are checking that you don't confuse the two.
    pitfalls: >
      Assuming the guaranteed equilibrium is pure; the theorem only promises one in mixed strategies, and pure equilibria can genuinely fail to exist. Applying the theorem to a game with an infinite or continuous strategy space without checking that the finiteness hypothesis actually holds.
    recap: >
      Every finite game has a mixed Nash equilibrium by a fixed-point argument — an existence guarantee only, with no construction, no uniqueness, and no efficiency attached.
    steps:
      - teach: >
          Nash's theorem guarantees that every game with finitely many
          players, each holding finitely many pure strategies, has at least
          one Nash equilibrium once mixed strategies are allowed.
      - teach: >
          The proof applies Kakutani's fixed-point theorem to the
          best-response correspondence on the product of the players'
          probability simplices — a fixed point of that correspondence is, by
          construction, a profile where everyone is simultaneously
          best-responding to everyone else.
      - ask: >
          A fresh instance: $4$ players, each holding $5$ pure strategies. How
          many strategy profiles exist in total?
        expects: "625"
        hint: >
          Multiply the strategy-set sizes across all four players.
        feedback: >
          $5\times5\times5\times5 = 5^{4} = 625$ profiles — Nash's theorem
          guarantees at least one point of that space's mixed-strategy
          extension is an equilibrium, regardless of how the payoffs are
          filled in.
      - teach: >
          The theorem is a pure existence statement: it names no algorithm, so
          finding the guaranteed equilibrium is always separate work —
          typically the indifference reasoning built next in this unit.
      - ask: >
          Does Nash's theorem guarantee a pure-strategy equilibrium?
        choices:
          - text: >
              Yes, every finite game has a pure equilibrium
            feedback: >
              Pure equilibria can genuinely fail to exist — matching pennies
              is the standard counterexample.
          - text: >
              No — only in mixed strategies; pure equilibria can fail to exist
              entirely
            correct: true
            feedback: >
              Right — mixing is part of the theorem's hypothesis, not a
              refinement added afterward, precisely because pure equilibria
              aren't always there.
          - text: >
              Yes, but only for two-player games
            feedback: >
              The theorem covers any finite number of players, not just two,
              and still only guarantees a mixed equilibrium.
        feedback: >
          Nash's theorem promises a mixed equilibrium only; pure equilibria
          are not guaranteed, as matching pennies shows.
      - ask: >
          A player chooses any real-valued price in the interval $[0,10]$ — a
          continuous strategy space. Does Nash's theorem apply directly?
        choices:
          - text: >
              Yes, since the interval is bounded
            feedback: >
              Boundedness isn't the hypothesis the theorem needs — finiteness
              of the strategy set is.
          - text: >
              No — the theorem requires finitely many pure strategies, so a
              continuous space needs a separate existence argument
            correct: true
            feedback: >
              Correct — dropping the finiteness hypothesis means Nash's
              theorem simply doesn't apply, whether or not existence happens
              to hold for other reasons.
          - text: >
              Yes, equilibria always exist for any bounded interval of prices
            feedback: >
              That isn't a free guarantee — it would need its own existence
              proof, separate from Nash's finite-game theorem.
        feedback: >
          Nash's theorem is stated for finite strategy sets; a continuous
          space drops that hypothesis and existence must be argued separately.
      - teach: >
          Existence buys nothing beyond existence: a game can have many
          equilibria or exactly one, and none of them are guaranteed efficient
          — "an equilibrium exists" answers a narrower question than it might
          sound like.

  - node: quant-games.game-theory.mixed-indifference
    hook: >
      "How often should you bluff in this spot" is the canonical open-ended prompt this technique answers, and the four-step recipe recited cleanly is worth more than any single memorized number.
    explanation: >
      Since an optimal mix can only place weight on strategies tied for best reply, every strategy in a player's support must earn exactly the same expected payoff against whatever the opponent does — that shared number is what "indifference" means here. The step that trips people up is whose payoffs go into the equation: to solve for your own mixing probabilities, you write the indifference condition using the opponent's payoffs, not yours, because it's the opponent who must be left unable to prefer one of their own strategies over another, and their preferences are governed entirely by their own numbers.
      The recipe: guess a support, usually every strategy available; write one indifference equation per opponent strategy in that support, built from the opponent's payoffs as a function of your probabilities; solve for your probabilities; then check two things — every solved probability lies in $[0,1]$, and no strategy you excluded from the support would actually beat the common equilibrium value. A negative or out-of-range probability doesn't mean you made an arithmetic error — it means the guessed support was wrong, and the fix is dropping that strategy and re-solving with a smaller support.
    worked: >
      Two firms each choose to Escalate a price war or Hold, with payoffs (row, column): Escalate vs Escalate: $(0,0)$; Escalate vs Hold: $(3,1)$; Hold vs Escalate: $(1,3)$; Hold vs Hold: $(2,2)$. To find $p$, the row firm's probability of escalating, write the column firm's indifference using column's own payoffs: column's expected payoff from Escalate is $p(0)+(1-p)(3)=3(1-p)$, from Hold is $p(1)+(1-p)(2)=2-p$. Setting them equal: $3(1-p)=2-p$ gives $p=1/2$; by the matrix's symmetry the column firm also escalates with probability $1/2$, and each firm's expected payoff at equilibrium is $3(1-1/2)=1.5$.
    interview: >
      "Walk me through computing a mixed equilibrium" wants the four steps named explicitly, in order; "how often should you bluff here" is this exact technique dressed as a poker question, and the interviewer is listening for whose payoffs go into the equations.
    pitfalls: >
      Writing the indifference equation from your own payoffs instead of the opponent's — the single most common reversal, and it produces numbers that look plausible but solve the wrong problem. Forgetting to verify a solved probability actually lands in $[0,1]$, or that no excluded strategy secretly beats the common value.
    recap: >
      Mix to make the opponent indifferent across their support, solved from their payoffs, then check every probability lands in $[0,1]$ and no excluded strategy beats the common value.
    steps:
      - teach: >
          Since an optimal mix only places weight on strategies tied for best
          reply, every strategy in a player's support must earn exactly the
          same expected payoff against the opponent's mix — that shared number
          is what "indifference" means.
      - teach: >
          The step that trips people up is whose payoffs go into the equation:
          to solve for your own mixing probabilities, you use the opponent's
          payoffs, because it's the opponent who must be left unable to prefer
          one of their own strategies over another.
      - ask: >
          A trader chooses to Quote Tight or Quote Wide; a counterparty
          chooses to Aggress or Wait. Payoffs $(\text{trader},
          \text{counterparty})$: Tight vs Aggress: $(2,5)$; Tight vs Wait:
          $(6,1)$; Wide vs Aggress: $(5,2)$; Wide vs Wait: $(1,4)$. To solve
          for $p$, the trader's probability of Tight, whose payoffs belong in
          the indifference equation?
        choices:
          - text: >
              The trader's own payoffs, since it's the trader choosing $p$
            feedback: >
              This is the single most common reversal — it produces numbers
              that look plausible but solve the wrong problem.
          - text: >
              The counterparty's payoffs, because it's the counterparty who
              must be left unable to prefer Aggress over Wait
            correct: true
            feedback: >
              Right — $p$ is chosen precisely to make the counterparty
              indifferent, so the counterparty's own numbers are what the
              equation is built from.
          - text: >
              An equal average of both players' payoffs
            feedback: >
              There's no averaging across players — the equation uses one
              player's payoffs entirely, to pin down the other player's
              probability.
        feedback: >
          Solve for your own probability by writing the opponent's
          indifference condition, built entirely from their payoffs.
      - teach: >
          The recipe: guess a support (usually everything), write one
          indifference equation per opponent strategy in that support from the
          opponent's payoffs, solve for your probabilities, then check they
          land in $[0,1]$ and no excluded strategy beats the common value.
      - ask: >
          Using the counterparty's payoffs from the trader-counterparty game
          above, solve for $p$, the trader's probability of Tight.
        expects: "1/3"
        hint: >
          Counterparty's expected payoff from Aggress is $5p+2(1-p)$, from
          Wait is $1p+4(1-p)$ — set them equal.
        feedback: >
          $5p+2(1-p) = 2+3p$ and $1p+4(1-p) = 4-3p$. Setting them equal: $2+3p
          = 4-3p$, so $6p=2$ and $p=1/3$.
      - ask: >
          After solving $p=1/3$, what must still be checked before calling it
          the equilibrium mix?
        choices:
          - text: >
              Nothing further — solving the equation is the whole job
            feedback: >
              A negative or out-of-range solved probability doesn't mean
              arithmetic error — it means the guessed support was wrong, and
              that only surfaces by checking.
          - text: >
              That $p$ lies in $[0,1]$, and that no strategy excluded from the
              support actually beats the common equilibrium value
            correct: true
            feedback: >
              Both checks matter: an out-of-range probability signals the
              wrong support, and an excluded strategy beating the tied value
              means it belongs in the support after all.
          - text: >
              That $p$ equals exactly $1/2$
            feedback: >
              There's no reason a mixing probability must equal $1/2$ — that's
              only true for specially symmetric payoffs.
        feedback: >
          Two checks close the recipe: every solved probability in $[0,1]$,
          and no excluded strategy secretly outperforming the tied equilibrium
          value.

  - node: quant-games.game-theory.matching-pennies
    hook: >
      The recognition trick matters more than the arithmetic: no dominant strategy and every pure cell inviting the loser to switch is the signature of a game with no pure equilibrium at all, and matching pennies is the cleanest instance to pattern-match against.
    explanation: >
      What makes a pure profile unstable here is a cycle: whichever player is currently losing strictly prefers to flip, which then makes the other player want to flip, which makes the first player want to flip back — no cell survives a single round of "does either side want to deviate." That cyclic structure, not the specific $\pm 1$ payoffs, is the actual signature to watch for; it appears in rock–paper–scissors, in soccer penalty-kick direction, in any head-to-head guessing contest with strictly opposed interests.
      The mental model worth keeping precise is that an equilibrium mix here is defensive, not aggressive: it guarantees the equilibrium value against any opponent play whatsoever, but it does nothing to punish a biased opponent, since deliberately exploiting a known bias means deviating from the equilibrium mix on purpose. "Unexploitable" and "exploiting" are opposite postures, and confusing them is the most common practical mistake once the equilibrium arithmetic is understood.
      The symmetric $1/2$–$1/2$ and $1/3$-each answers are special to symmetric payoffs — when the payoffs aren't symmetric, the equilibrium mix isn't $1/2$ either, and has to be rederived from indifference rather than pattern-matched.
    worked: >
      Take an asymmetric version: row payoffs are $+4$ if $H$ matches $H$, $-1$ if $H$ meets $T$, $-2$ if $T$ meets $H$, $+1$ if $T$ matches $T$, with the column player taking the opposite. Column's indifference, as a function of row's probability $p$ of playing $H$: from playing $H$, $-4p+2(1-p)=2-6p$; from playing $T$, $p-(1-p)=2p-1$. Setting these equal gives $p=3/8$. The mirrored computation for row's indifference gives $q=1/4$ for column's probability of $H$, and the game's value works out to $0.25$ to the row player — asymmetric payoffs shift both probabilities away from $1/2$ and make the value nonzero, unlike the symmetric case.
    interview: >
      "Rock–paper–scissors against a strong opponent — what do you play?" wants "uniform $1/3$, unexploitable, value $0$" said instantly; the sharper follow-up, "what if the payoffs aren't symmetric," is testing whether you can rederive the mix from indifference rather than reciting $1/2$.
    pitfalls: >
      Pattern-matching $1/2$–$1/2$ or uniform-$1/n$ onto any two-strategy conflict game without checking the payoffs are actually symmetric — asymmetric payoffs move the equilibrium mix and its value, as above. Confusing the equilibrium mix, a guarantee against any play, with a strategy meant to exploit a known biased opponent, which requires deliberately deviating from equilibrium.
    recap: >
      No pure profile survives the cyclic "loser wants to flip" check in matching-pennies-shaped games; the equilibrium mix is $1/2$ only when the payoffs are symmetric, and it guarantees the value without ever exploiting anyone.
    steps:
      - teach: >
          No cell survives a single round of "does either side want to
          deviate": whichever player is currently losing strictly prefers to
          flip, which then makes the other player want to flip too — a cycle,
          not a coincidence of these particular payoffs.
      - teach: >
          An equilibrium mix here is defensive, not aggressive: it guarantees
          the equilibrium value against any opponent play whatsoever, but does
          nothing to punish a biased opponent, since exploiting a known bias
          means deviating from the equilibrium mix on purpose.
      - ask: >
          Asymmetric version, row payoffs: $+5$ if $H$ matches $H$, $-1$ if
          $H$ meets $T$, $-3$ if $T$ meets $H$, $+2$ if $T$ matches $T$,
          column taking the opposite. Solve for $p$, row's probability of $H$,
          from column's indifference.
        expects: "5/11"
        hint: >
          Column's payoff from playing $H$ is $-5p+3(1-p)$; from playing $T$
          it's $1p-2(1-p)$. Set them equal.
        feedback: >
          Column's expected payoff from $H$ is $-5p+3(1-p)=3-8p$; from $T$
          it's $1p-2(1-p)=3p-2$. Setting them equal: $3-8p=3p-2$, so $5=11p$
          and $p=5/11$.
      - teach: >
          The symmetric $1/2$–$1/2$ and $1/3$-each answers are special to
          symmetric payoffs. When the payoffs aren't symmetric, as just shown,
          the equilibrium mix isn't $1/2$ either.
      - ask: >
          You learn your opponent actually plays $H$ $80\%$ of the time.
          Should you deviate from the equilibrium mix $p=5/11$ to exploit that
          bias?
        choices:
          - text: >
              No — the equilibrium mix already accounts for any opponent
              frequency
            feedback: >
              The equilibrium mix guarantees a floor against any play; it does
              not extract extra value from a known bias.
          - text: >
              Yes — the equilibrium mix is merely unexploitable, not designed
              to exploit a known bias, so deviating on purpose can do better
            correct: true
            feedback: >
              Right — "unexploitable" and "exploiting" are opposite postures.
              Deliberately exploiting a biased opponent means leaving the
              equilibrium mix behind.
          - text: >
              It doesn't matter, the value is always $0$ regardless of the
              payoffs
            feedback: >
              Value $0$ is special to the symmetric case. This matrix is
              asymmetric, so its equilibrium value isn't $0$ either.
        feedback: >
          The equilibrium mix is a guarantee against any play, not an attack
          on a known bias — exploiting one means deviating from equilibrium on
          purpose.
      - ask: >
          A colleague claims any two-strategy head-to-head conflict game has a
          $1/2$–$1/2$ equilibrium mix. Is that right?
        choices:
          - text: >
              Yes, every such cyclic game is a $50/50$ game
            feedback: >
              The matrix above is cyclic in the same way as standard matching
              pennies, yet its mix is $5/11$, not $1/2$.
          - text: >
              Only when the payoffs are symmetric — asymmetric payoffs shift
              the mix away from $1/2$, as just computed
            correct: true
            feedback: >
              Right — the cyclic "loser wants to flip" structure is the
              signature to watch for; the exact mix still has to be rederived
              from indifference whenever payoffs aren't symmetric.
          - text: >
              No such game ever lands on exactly $1/2$
            feedback: >
              Too strong — the standard symmetric matching-pennies payoffs do
              give exactly $1/2$; it's only guaranteed when symmetry holds.
        feedback: >
          Pattern-matching $1/2$ onto any conflict game is the common mistake;
          check the payoffs are actually symmetric before reusing that number.

  - node: quant-games.game-theory.battle-of-sexes
    hook: >
      "Two people need to agree on something without talking" is the coordination-with-conflicting-preferences shape — product launch timing, a meeting slot, a market convention — and the tell is two pure equilibria plus a mixed one that both players like less than either.
    explanation: >
      This shape differs from matching pennies in the one fact worth contrasting directly: there, mixing is unavoidable and optimal, since no pure profile is stable at all; here, two perfectly good pure equilibria exist, and the mixed equilibrium is the outcome of failing to coordinate on either one. Each player's own mixing probability is pinned down by the indifference principle applied to the other player's payoffs, exactly as before, which produces the specific and slightly counterintuitive fact that how often you play your own preferred option depends entirely on the other player's numbers, not the strength of your own preference.
      Because the mixed equilibrium leaves real probability on the miscoordination outcomes — where the two players pick different venues and both get nothing — its expected payoff to each player is strictly worse than either pure equilibrium's payoff. That gap is the whole practical lesson: absent communication, a convention, or some way to signal ahead of time, rational play alone doesn't select one of the good outcomes; it can land on the worse, self-inflicted one instead.
    worked: >
      Two coworkers pick Morning or Afternoon for a meeting, payoffs (first coworker, second): Morning vs Morning: $(3,1)$; Morning vs Afternoon: $(0,0)$; Afternoon vs Morning: $(0,0)$; Afternoon vs Afternoon: $(1,4)$. Let $p$ be the first coworker's probability of Morning: the second coworker's indifference gives $p = 4(1-p)$, so $p=4/5$. Let $q$ be the second coworker's probability of Morning: the first coworker's indifference gives $3q=1-q$, so $q=1/4$. Miscoordination probability is $p(1-q)+(1-p)q = (4/5)(3/4)+(1/5)(1/4) = 13/20$, and each coworker's expected payoff falls to $0.75$ and $0.8$ respectively — both below what either pure equilibrium would have paid them.
    interview: >
      "What happens if they can't talk to each other first?" wants recognition of the multiple equilibria plus the inferior mixed outcome, and the practical point that real coordination usually relies on a focal point, a stated convention, or someone committing first to pick one of the good equilibria instead of leaving it to chance.
    pitfalls: >
      Assuming the mixed equilibrium is a "fair" $50$–$50$ split — it's whatever probability makes the other player indifferent, generally asymmetric and rarely $1/2$. Treating the mixed equilibrium as efficient because it's an equilibrium at all; here it's strictly worse for both players than either pure alternative.
    recap: >
      Battle of the sexes has two good pure equilibria and one mixed equilibrium that both players like less, with each player's own mixing probability set entirely by the other's payoff numbers.
    steps:
      - teach: >
          This shape contrasts directly with matching pennies: there, mixing
          is unavoidable since no pure profile is stable at all; here, two
          perfectly good pure equilibria exist, and the mixed equilibrium is
          the outcome of failing to coordinate on either.
      - teach: >
          Each player's own mixing probability is pinned down by the
          indifference principle applied to the other player's payoffs — so
          how often you play your own preferred option depends entirely on the
          other player's numbers, not the strength of your own preference.
      - ask: >
          Two friends pick Concert or Movie without communicating. Payoffs
          $(\text{Friend 1}, \text{Friend 2})$: Concert vs Concert: $(5,2)$;
          Concert vs Movie: $(0,0)$; Movie vs Concert: $(0,0)$; Movie vs
          Movie: $(2,6)$. Solve for $q$, Friend $2$'s probability of Concert,
          from Friend $1$'s indifference.
        expects: "2/7"
        hint: >
          Friend $1$'s expected payoff from Concert is $5q$, from Movie is
          $2(1-q)$. Set them equal.
        feedback: >
          Friend $1$'s payoff from Concert is $5q$; from Movie it's
          $2(1-q)=2-2q$. Setting them equal: $5q=2-2q$, so $7q=2$ and $q=2/7$.
      - ask: >
          Whose payoffs determine Friend $1$'s own mixing probability, $p$?
        choices:
          - text: >
              Friend $1$'s own payoffs, since Friend $1$ is the one choosing
              $p$
            feedback: >
              The same reversal as elsewhere in this unit — your own
              probability is set by the other player's indifference, not your
              own preferences.
          - text: >
              Friend $2$'s payoffs — $p$ is set to make Friend $2$ indifferent
              between Concert and Movie
            correct: true
            feedback: >
              Right — $p$ makes Friend $2$ unable to prefer either action,
              which is exactly why it's built from Friend $2$'s numbers.
          - text: >
              An equal split of both friends' payoffs
            feedback: >
              There's no averaging — each player's own mixing probability
              comes entirely from the other player's payoffs.
        feedback: >
          $p$ is Friend $2$'s indifference condition solved with Friend $2$'s
          own numbers, exactly mirroring how $q$ came from Friend $1$'s
          numbers.
      - teach: >
          Because the mixed equilibrium leaves real probability on the
          miscoordination outcomes — different venues, both getting nothing —
          its expected payoff to each player is strictly worse than either
          pure equilibrium's payoff.
      - ask: >
          Compared to the two pure equilibria paying $(5,2)$ and $(2,6)$, how
          does the mixed equilibrium's payoff to each friend compare?
        choices:
          - text: >
              Better for both, since randomizing hedges against the worse
              outcome
            feedback: >
              Randomizing here doesn't hedge — it introduces a genuine chance
              of miscoordinating on nothing, which no pure equilibrium risks.
          - text: >
              Worse for both — real probability mass sits on the
              miscoordination outcomes where both get $0$
            correct: true
            feedback: >
              Right — absent communication or a convention, rational play
              alone doesn't reliably select one of the two good equilibria; it
              can land on the worse, self-inflicted mixed outcome instead.
          - text: >
              Identical to both pure equilibria, since all Nash equilibria pay
              the same
            feedback: >
              Nothing in the definition of Nash equilibrium equalizes payoffs
              across different equilibria of the same game.
        feedback: >
          The mixed equilibrium strictly underperforms either pure equilibrium
          for both players — the whole practical lesson of this game.

  - node: quant-games.game-theory.zero-sum
    hook: >
      "What can I guarantee no matter what they do" is the zero-sum question, and the first move before any equilibrium computation is checking the row and column security levels for a saddle — sometimes the game is already solved without touching probabilities.
    explanation: >
      A two-player game is zero-sum when the two payoffs in every cell sum to a constant, which lets the entire game be described by a single matrix of row payoffs, with the row player maximizing that number and the column player minimizing it — there's no room for coordination, since one player's gain is exactly the other's loss. Committing to a row before the column is revealed guarantees the row player at least the smallest payoff in that row, so the best guaranteed floor across all rows is $\max_i \min_j a_{ij}$, the maximin; the column player symmetrically guarantees a ceiling of $\min_j \max_i a_{ij}$, the minimax.
      Maximin can never exceed minimax, because committing to a choice before your opponent reveals theirs can only be as good as or worse than choosing after — moving first never helps under an adversary who gets to respond. When the two numbers coincide, that shared cell is a saddle point: neither player can improve by deviating from it alone, so it's a genuine pure Nash equilibrium and the game is fully solved without any mixing at all. Checking for a saddle first is worth the thirty seconds it costs, since it's often the entire answer.
    worked: >
      Take rows $R_1$: $(2,6)$ and $R_2$: $(5,1)$. Row minima are $2$ for $R_1$ and $1$ for $R_2$, so the row player's maximin is $2$. Column maxima are $5$ for the first column and $6$ for the second, so the column player's minimax is $5$. Checking cell by cell, no cell is simultaneously its row's minimum and its column's maximum — $(R_1,C_1)=2$ is $R_1$'s minimum but not $C_1$'s maximum ($5$), and no other cell qualifies either — confirming no saddle point exists. The gap between the maximin $2$ and the minimax $5$ means this game genuinely needs mixed strategies to pin down its value.
    interview: >
      "Is there a pure solution to this zero-sum game?" wants the maximin and minimax computed explicitly, with the saddle check stated as both conditions at once — the cell must be its row's minimum and its column's maximum together, not just a numeric coincidence between the two summary numbers.
    pitfalls: >
      Checking only that the maximin and minimax numbers are equal without verifying an actual cell achieves both conditions simultaneously. Assuming "zero-sum" requires the payoffs to literally sum to zero — constant-sum games reduce to the same analysis after subtracting the constant.
    recap: >
      Maximin never exceeds minimax in a zero-sum game; when they coincide, that cell is a saddle point and a pure equilibrium, and when they don't, mixing is unavoidable.
    steps:
      - teach: >
          A two-player game is zero-sum when the two payoffs in every cell sum
          to a constant, so the entire game is described by a single matrix of
          row payoffs, with the row player maximizing and the column player
          minimizing.
      - teach: >
          Committing to a row before the column is revealed guarantees the row
          player at least the smallest payoff in that row, so the best
          guaranteed floor across all rows, $\max_i \min_j a_{ij}$, is the
          maximin; the column player symmetrically guarantees a ceiling, the
          minimax.
      - ask: >
          Fresh matrix of row payoffs: $R_1$: $(7,4)$, $R_2$: $(3,9)$. What is
          the row player's maximin?
        expects: "4"
        hint: >
          Take the minimum of each row, then the largest of those minima.
        feedback: >
          Row minima are $4$ for $R_1$ and $3$ for $R_2$, so the maximin is
          $\max(4,3)=4$.
      - ask: >
          What is the column player's minimax for the same matrix?
        expects: "7"
        hint: >
          Take the maximum of each column, then the smallest of those maxima.
        feedback: >
          Column maxima are $7$ for the first column and $9$ for the second,
          so the minimax is $\min(7,9)=7$.
      - teach: >
          Maximin can never exceed minimax, since committing first can only be
          as good as or worse than choosing after an opponent reveals their
          move. When the two numbers coincide at an actual cell, that cell is
          a saddle point and a genuine pure Nash equilibrium.
      - ask: >
          Does this matrix have a saddle point?
        choices:
          - text: >
              Yes, at $(R_1,C_1)$, since $7$ is the largest number in the
              matrix
            feedback: >
              Being the largest entry overall isn't the test — the cell must
              be simultaneously its row's minimum and its column's maximum.
              $(R_1,C_1)=7$ is not $R_1$'s minimum.
          - text: >
              No — no cell is simultaneously its row's minimum and its
              column's maximum, and the maximin ($4$) doesn't equal the
              minimax ($7$)
            correct: true
            feedback: >
              Right — checking cell by cell confirms it: nothing is both
              conditions at once, matching the gap between maximin and
              minimax.
          - text: >
              Yes, whenever both maximin and minimax are positive numbers
            feedback: >
              Sign has nothing to do with it — a saddle point requires the two
              summary numbers to actually coincide.
        feedback: >
          No cell is both its row's minimum and its column's maximum, matching
          the gap between maximin $4$ and minimax $7$ — this game genuinely
          needs mixed strategies.
      - teach: >
          Checking for a saddle first is worth the thirty seconds it costs:
          when it exists, the game is completely solved without any mixing at
          all, and no equilibrium-selection question ever arises.

  - node: quant-games.game-theory.minimax
    hook: >
      "What's this zero-sum game actually worth" is the question this closes for good: once mixing is allowed, the security gap from a moment ago doesn't just shrink, it vanishes to a single exact number both sides can guarantee.
    explanation: >
      Von Neumann's theorem says that in a finite two-player zero-sum game, allowing mixed strategies makes the maximin and minimax coincide exactly: $\max_p \min_q \sum_{i,j} p_i a_{ij} q_j = \min_q \max_p \sum_{i,j} p_i a_{ij} q_j = v$. The shared number $v$, the value of the game, is simultaneously the most the row player can guarantee in expectation against any column play and the least the column player can be forced to concede — not an average outcome under some assumed opponent behavior, but a genuine two-sided guarantee.
      What makes zero-sum games special compared to the general case is that every Nash equilibrium pays exactly $v$ and the equilibria are interchangeable, so there's no equilibrium-selection problem the way there is in a game like battle of the sexes — whichever optimal mix either side plays, the outcome is the same guaranteed number. Practically, this reduces to solving two linear programs that turn out to be duals of each other, which is the algorithmic path once the game is too large for indifference equations to be convenient by hand.
    worked: >
      Return to the matrix from a moment ago, $R_1$: $(2,6)$, $R_2$: $(5,1)$, which had no saddle. Let the row player mix $p$ on $R_1$: the row payoff against a pure column $C_1$ is $5-3p$, against $C_2$ it's $1+5p$, and setting them equal gives $p=1/2$ with value $3.5$. Let the column player mix $q$ on $C_1$: the row payoff against pure $R_1$ is $6-4q$, against $R_2$ it's $1+4q$, and setting them equal gives $q=5/8$, again yielding value $3.5$. The value $3.5$ sits strictly between the original maximin of $2$ and minimax of $5$, exactly as mixing should close a security gap rather than push past either endpoint.
    interview: >
      "Solve this zero-sum game" wants a saddle check first, and if none exists, indifference equations set up from the opponent's payoffs — same technique as any mixed equilibrium — solved for both sides' probabilities and the single value both agree on.
    pitfalls: >
      Computing a value outside the range of the original maximin and minimax — that's a sign of an arithmetic error, since mixing can only close the gap, never overshoot it. Assuming the specific optimal mix found is uniquely special; in a zero-sum game every optimal mix pays the same value, so there's nothing more to select between them.
    recap: >
      Every finite zero-sum game has a value $v$ that both sides can guarantee by mixing, with all optimal strategies interchangeable and paying exactly $v$ — the game is completely solved.
    steps:
      - teach: >
          Von Neumann's theorem says that once mixed strategies are allowed,
          the maximin and minimax of a finite two-player zero-sum game
          coincide exactly at a single number $v$, the value of the game.
      - teach: >
          $v$ is a genuine two-sided guarantee: the most the row player can
          guarantee in expectation against any column play, and the least the
          column player can be forced to concede — not an average outcome
          under some assumed opponent behavior.
      - ask: >
          Fresh matrix, no saddle: $R_1$: $(1,8)$, $R_2$: $(6,3)$. Row mixes
          $p$ on $R_1$. Solve for $p$ from the equal-payoff condition against
          either pure column.
        expects: "3/10"
        hint: >
          Row's payoff against pure $C_1$ is $1p+6(1-p)$; against pure $C_2$
          it's $8p+3(1-p)$. Set them equal.
        feedback: >
          Against $C_1$: $1p+6(1-p)=6-5p$. Against $C_2$: $8p+3(1-p)=3+5p$.
          Setting them equal: $6-5p=3+5p$, so $3=10p$ and $p=3/10$.
      - ask: >
          Using $p=3/10$ from the matrix above, what is the value $v$ of the
          game?
        expects: "4.5"
        hint: >
          Plug $p=3/10$ back into either expression from the previous check.
        feedback: >
          $6-5(0.3)=6-1.5=4.5$, and $3+5(0.3)=3+1.5=4.5$ confirms it —
          $v=4.5$, strictly between the matrix's maximin ($3$) and minimax
          ($6$), exactly as mixing should close a security gap rather than
          push past either endpoint.
      - teach: >
          Every Nash equilibrium of a zero-sum game pays exactly $v$, and the
          equilibria are interchangeable — there's no equilibrium-selection
          problem the way there is in a game like battle of the sexes.
      - ask: >
          If the row player switched to a different optimal mix that also
          satisfies the indifference condition, would the resulting value
          change?
        choices:
          - text: >
              Yes — different optimal mixes can pay different values
            feedback: >
              That's exactly the equilibrium-selection problem that zero-sum
              games don't have — every optimal mix pays the same value.
          - text: >
              No — in a zero-sum game every optimal mix pays exactly the same
              value $v$, so optimal strategies are interchangeable
            correct: true
            feedback: >
              Right — this is what makes zero-sum games special compared to
              the general case: nothing to select between optimal strategies,
              since they're all worth the same.
          - text: >
              Only if the column player also switches to a different mix
            feedback: >
              The interchangeability holds regardless of what the other side
              does — every optimal mix on either side pays $v$.
        feedback: >
          Interchangeability is specific to zero-sum games: any optimal mix,
          on either side, pays exactly $v$.
      - teach: >
          Practically, solving for $v$ reduces to two linear programs that
          turn out to be duals of each other — the algorithmic path once a
          game is too large for indifference equations to be convenient by
          hand.

  - node: quant-games.game-theory.extensive-form
    hook: >
      Whenever a prompt says "first X moves, then Y responds," you're being asked to build a tree, not a matrix, and mistaking the two is the fastest way to answer a question nobody asked.
    explanation: >
      An extensive-form game is a tree: each decision node names the player to move, each edge is an action available there, and each leaf carries the payoff every player receives if play reaches it. Information sets group together the nodes a mover can't tell apart at the moment of choosing; the game has perfect information exactly when every information set is a single node, and a simultaneous move — where neither player has seen the other's action yet — is modeled as an information set containing several nodes rather than as a timing difference.
      A strategy in this setting is a complete contingent plan: one action specified at every decision node belonging to that player, including nodes that player's own earlier choices already rule out from ever being reached. That inflation is easy to underestimate — two binary decisions in sequence already produce four complete strategies for the second mover, not two, because a full plan must say what happens down both branches even though only one is ever actually walked.
      Once every strategy profile is mapped to the payoff at the leaf it induces, the tree collapses back into an ordinary normal-form game — a matrix indexed by complete plans rather than single moves — so dominance, Nash equilibrium, and mixing all still apply exactly as before, just to a larger and more structured object.
    worked: >
      Player $1$ chooses $L$ or $R$. If $L$, Player $2$ chooses $U$, leading to payoffs $(3,2)$, or $D$, leading to $(1,4)$. If $R$, Player $2$ chooses $U'$, leading to $(2,1)$, or $D'$, leading to $(5,0)$. A complete strategy for Player $2$ specifies an action at both of their decision nodes, giving $\{U,D\}\times\{U',D'\}$, or $4$ strategies, even though only one of the two nodes is ever actually reached in any single play. Combined with Player $1$'s $2$ options, the induced normal form has $2\times 4=8$ strategy profiles, even though the tree itself has only $4$ leaves — strategy counts and outcome counts are different objects entirely.
    interview: >
      "Model this as a tree" wants nodes, edges, and leaves named explicitly, with information sets flagged wherever a move is actually simultaneous; "how many strategies does the second mover have?" is testing whether you remember a strategy specifies an action everywhere, not just along the path you happen to be imagining.
    pitfalls: >
      Defining a player's strategy only at nodes reached along one imagined line of play — this undercounts strategies and breaks the conversion back to normal form. Modeling a simultaneous move as a sequence of separate tree nodes instead of one shared information set, which secretly grants one player information they never actually had.
    recap: >
      An extensive-form game is a tree with information sets marking what each mover can't distinguish, and a strategy is a complete plan at every node — collapsing every profile to its leaf payoff recovers an ordinary normal-form game.
    steps:
      - teach: >
          An extensive-form game is a tree: each decision node names the
          player to move, each edge is an action available there, and each
          leaf carries the payoff every player receives if play reaches it.
      - teach: >
          The game has perfect information exactly when every information set
          is a single node. A simultaneous move — neither player having seen
          the other's action yet — is modeled as an information set containing
          several nodes rather than a timing difference.
      - ask: >
          Two players move at literally the same instant, so player $2$ must
          choose without having observed player $1$'s move. How should this be
          represented as a tree?
        choices:
          - text: >
              As two separate sequential decision nodes, since someone
              technically has to be drawn first
            feedback: >
              Drawing it as strictly sequential secretly grants player $2$
              information — knowledge of player $1$'s move — that they never
              actually had.
          - text: >
              As a single information set containing multiple nodes for player
              $2$, one per possible move of player $1$
            correct: true
            feedback: >
              Right — grouping the nodes player $2$ can't distinguish is
              exactly what an information set is for; it encodes simultaneity
              without needing a timing trick.
          - text: >
              It cannot be represented as a tree at all
            feedback: >
              Extensive-form trees handle simultaneous moves routinely, via
              information sets — no special exception is needed.
        feedback: >
          A simultaneous move is one information set holding several nodes,
          one per possible move of the player who acted "first" on the tree
          but whose action the mover can't yet see.
      - teach: >
          A strategy is a complete contingent plan: one action specified at
          every decision node belonging to that player, including nodes their
          own earlier choices already rule out from ever being reached.
      - ask: >
          Player $A$ chooses among $3$ options, each leading to a separate
          decision node for player $B$ with $2$ actions each (so $B$ faces $3$
          distinct nodes, one per branch). How many complete strategies does
          $B$ have?
        expects: "8"
        hint: >
          A strategy specifies an action at every one of $B$'s $3$ nodes, not
          just the one actually reached.
        feedback: >
          $2\times2\times2=2^{3}=8$ — a complete plan says what happens at all
          three of $B$'s nodes even though only one is ever actually walked in
          a single play.
      - ask: >
          Using the same tree — $A$'s $3$ branches, each ending in $2$ of
          $B$'s actions — how many leaves does the tree have in total?
        expects: "6"
        hint: >
          Each of $A$'s $3$ branches ends in $B$'s $2$ actions, and each
          action is one leaf.
        feedback: >
          $3\times2=6$ leaves — far fewer than $B$'s $8$ strategies, since
          strategy counts and outcome counts are entirely different objects.
      - teach: >
          Once every strategy profile is mapped to the payoff at the leaf it
          induces, the tree collapses back into an ordinary normal-form game,
          so dominance, Nash equilibrium, and mixing all still apply exactly
          as before.

  - node: quant-games.game-theory.backward-induction-games
    hook: >
      "Solve this game" in sequential form always means one procedure, and the interview tell is starting at the very last decision instead of guessing the first move and hoping it works out.
    explanation: >
      Start at whichever decision nodes have only leaves as children, replace each with the payoff vector of the action its mover actually prefers there, and fold the tree upward one layer at a time until the root itself has been reduced to a single payoff vector. Each fold is forced rather than guessed: the mover at a node being folded already knows, with certainty, the payoff every one of their available actions leads to, because everything below has already been solved — there's no remaining strategic uncertainty at that step, only ordinary optimization.
      This recursive certainty is what earlier movers get for free: by the time backward induction reaches an earlier node, the entire continuation from every one of that node's actions is already known, converting what looks like a strategic guess about the future into a plain comparison of known numbers. The resulting retained actions form a subgame-perfect equilibrium, which exists in pure strategies for every finite game of perfect information — Zermelo's theorem — and is unique as long as no mover is ever exactly indifferent between two actions at some node.
    worked: >
      Player $A$ moves first: Down ends the game immediately at $(2,2)$; Up passes to Player $B$, who can choose Right, ending the game at $(0,5)$, or Left, passing back to $A$ for a second decision between $X$, paying $(4,1)$, and $Y$, paying $(1,4)$. Folding from the bottom: at $A$'s second node, $X$ pays $A$ more than $Y$ ($4>1$), so that subtree collapses to $(4,1)$. At $B$'s node, Right pays $B$ more than the collapsed Left value ($5>1$), so $B$ plays Right and the Up subtree collapses to $(0,5)$. At the root, $A$ compares Down's $2$ against Up's collapsed $0$ and plays Down — the tempting $(4,1)$ leaf is never reached, because $B$, anticipating it, would rather grab $(0,5)$ one level up, which is exactly why $A$ avoids Up in the first place.
    interview: >
      "Walk me through solving this step by step" wants the last decision solved first, narrated explicitly, with each earlier fold stated as a comparison of already-known numbers rather than an intuited final answer.
    pitfalls: >
      Solving from the root downward, which forces guessing an early move before the later nodes that actually determine its value are known. Reporting only the payoffs along the equilibrium path as "the strategy" and omitting what each player would do at nodes never actually reached — a subgame-perfect equilibrium is a complete plan, on-path and off.
    recap: >
      Fold the tree from the leaves upward, one layer at a time, replacing each node by its mover's preferred already-known continuation — the surviving actions form a subgame-perfect equilibrium.
    steps:
      - teach: >
          Start at whichever decision nodes have only leaves as children,
          replace each with the payoff vector of the action its mover actually
          prefers, and fold the tree upward one layer at a time until the root
          has been reduced to a single payoff vector.
      - teach: >
          Each fold is forced rather than guessed: the mover at a node being
          folded already knows, with certainty, the payoff every available
          action leads to, because everything below has already been solved.
      - ask: >
          Player $1$ moves first: Out ends the game at $(3,3)$; In passes to
          Player $2$, who chooses Split, ending at $(4,4)$, or Grab, passing
          to a final choice for Player $1$ between Accept, paying $(1,6)$, and
          Reject, paying $(0,0)$. At that last decision node, what does
          folding collapse Player $1$'s payoff to?
        expects: "1"
        hint: >
          Player $1$ compares Accept's $1$ against Reject's $0$.
        feedback: >
          Player $1$ prefers Accept ($1>0$), so that node collapses to a
          payoff of $1$ for Player $1$ (and $6$ for Player $2$).
      - ask: >
          At Player $2$'s node, Split pays $(4,4)$ and Grab leads to the
          already-collapsed continuation worth $(1,6)$. Which does Player $2$
          choose?
        choices:
          - text: >
              Split, since Player $1$ would prefer it
            feedback: >
              Player $2$ optimizes for Player $2$'s own payoff at this node,
              not Player $1$'s.
          - text: >
              Grab, since Player $2$'s payoff there ($6$) beats Split's ($4$)
            correct: true
            feedback: >
              Right — comparing only Player $2$'s own numbers, $6$ from the
              collapsed Grab continuation beats $4$ from Split.
          - text: >
              Player $2$ is indifferent between the two
            feedback: >
              $6$ and $4$ are not equal — Player $2$ has a strict preference,
              so this node folds to a single value, not a tie.
        feedback: >
          Player $2$ compares $4$ (Split) against $6$ (Grab's collapsed value)
          and picks Grab, so this node also folds to $(1,6)$.
      - ask: >
          Folding all the way to the root, Player $1$ compares Out's $3$
          against In's collapsed value of $1$. What is Player $1$'s
          equilibrium payoff?
        expects: "3"
        hint: >
          Compare the two numbers Player $1$ actually faces at the root.
        feedback: >
          $3>1$, so Player $1$ plays Out for a payoff of $3$ — the tempting
          $(4,4)$ Split outcome is never reached, because Player $2$,
          anticipating it, would rather Grab one level up.
      - teach: >
          The retained actions form a subgame-perfect equilibrium, which
          exists in pure strategies for every finite game of perfect
          information (Zermelo's theorem) and is unique as long as no mover is
          ever exactly indifferent between two actions.
      - teach: >
          Solving from the root downward instead forces guessing an early move
          before the later nodes that actually determine its value are known —
          always fold from the leaves, never from the root.

  - node: quant-games.game-theory.credible-threats
    hook: >
      "Would you actually do that?" is the single question that separates a Nash equilibrium from a subgame-perfect one, and an interviewer probing credibility is testing exactly this gap.
    explanation: >
      Nash equilibrium can rest on a threat that's never actually tested: if the branch where the threat would be carried out is never reached along the equilibrium path, declaring an intention to fight there costs nothing in the normal-form check, since a player's payoff doesn't depend on what they'd do off the path they never take. Backward induction removes this loophole entirely, because it forces every mover to optimize at every node, including the ones that equilibrium play never visits — a threatened action has to also be genuinely optimal to carry out if the node is actually reached, not merely optimal to have announced in advance.
      Making a threat credible in practice means changing your own payoffs before the interaction starts, so that following through becomes the optimal choice once you're actually standing at that node — a signed contract, capacity built before demand materializes, or a reputation expensive enough to be worth protecting. Absent that kind of commitment, a stated threat is cheap talk that a sophisticated opponent, reasoning backward through the tree, will correctly ignore.
    worked: >
      A retailer chooses to stay Loyal to a supplier or order from a Rival; if Rival, the supplier chooses to Punish (cut future discounts) or Ignore. Payoffs (retailer, supplier): Loyal: $(4,6)$; Rival then Punish: $(0,1)$; Rival then Ignore: $(5,3)$. The profile (Loyal, Punish-if-Rival) is Nash: against the threat of Punish, staying Loyal beats Rival's $0$, and since Rival never happens, the supplier's off-path plan doesn't cost them anything in the check. It fails subgame perfection: if Rival actually occurred, the supplier compares Punish's $1$ against Ignore's $3$ and strictly prefers Ignore. Anticipating that, the retailer compares Loyal's $4$ against Rival-then-Ignore's $5$ and switches — the subgame-perfect outcome is (Rival, Ignore), paying $(5,3)$.
    interview: >
      "Is that threat believable?" wants a two-step answer: confirm it's a Nash equilibrium of the normal form first, then check separately whether the threatened action is still optimal in the exact subgame where it would have to be carried out.
    pitfalls: >
      Stopping at "it's a Nash equilibrium" and treating that as sufficient — Nash alone never rules out an incredible threat, only subgame perfection does. Assuming any stated commitment makes a threat credible; it only works if it genuinely changes the payoffs at the node where the threat would actually be executed, not just at the moment it's announced.
    recap: >
      A threat is credible only if carrying it out is still optimal once the node where it fires is actually reached; subgame perfection checks that, Nash equilibrium alone does not.
    steps:
      - teach: >
          Nash equilibrium can rest on a threat that's never actually tested:
          if the branch where the threat would fire is never reached along the
          equilibrium path, declaring an intention to fight there costs
          nothing in the normal-form check.
      - teach: >
          Backward induction removes this loophole because it forces every
          mover to optimize at every node, including the ones equilibrium play
          never visits — a threatened action also has to be genuinely optimal
          to carry out if the node is actually reached.
      - ask: >
          An entrant chooses Stay Out or Enter; if Enter, the incumbent
          chooses Fight or Share. Payoffs $(\text{entrant},
          \text{incumbent})$: Stay Out: $(2,8)$; Enter then Fight: $(-3,1)$;
          Enter then Share: $(4,5)$. Is (Stay Out, Fight-if-Enter) a Nash
          equilibrium of the normal form?
        choices:
          - text: >
              No, because Fight only pays the incumbent $1$
            feedback: >
              The size of the incumbent's off-path payoff is beside the point
              — since Enter never happens on this path, that payoff is never
              actually collected.
          - text: >
              Yes — since Enter never happens, the incumbent's off-path threat
              costs nothing in the check, and against that threat the
              entrant's best response is genuinely to stay out
            correct: true
            feedback: >
              Right — against the threat of Fight, Enter would pay the entrant
              only $-3$, worse than Stay Out's $2$, so the entrant has no
              incentive to deviate. That's all Nash equilibrium checks.
          - text: >
              No, because the entrant would rather enter and collect $4$
            feedback: >
              That $4$ only arises under Share, not under the threatened Fight
              — given the stated threat, the entrant's best response really is
              to stay out.
        feedback: >
          (Stay Out, Fight-if-Enter) is a Nash equilibrium precisely because
          the threat is never tested along the equilibrium path, so its cost
          never enters the check.
      - ask: >
          If Enter actually occurred, the incumbent compares Fight's $1$
          against Share's $5$ and prefers Share. Anticipating that, what is
          the entrant's payoff in the subgame-perfect equilibrium?
        expects: "4"
        hint: >
          With the threat no longer credible, compare the entrant's Stay Out
          payoff to Enter-then-Share.
        feedback: >
          Since Share beats Fight for the incumbent once Enter actually
          happens, the entrant compares Stay Out's $2$ against
          Enter-then-Share's $4$ and enters — the subgame-perfect outcome pays
          the entrant $4$.
      - ask: >
          Having confirmed (Stay Out, Fight-if-Enter) is a Nash equilibrium,
          is it also the correct prediction for how the game will actually be
          played?
        choices:
          - text: >
              Yes — any Nash equilibrium is automatically the correct
              prediction
            feedback: >
              Nash equilibrium alone never rules out an incredible threat —
              only subgame perfection does that.
          - text: >
              No — it isn't subgame perfect, since Fight isn't actually
              optimal once the incumbent is forced to the node where it would
              fire; only Share survives backward induction
            correct: true
            feedback: >
              Right — a sophisticated entrant, reasoning backward, correctly
              ignores the cheap-talk threat and enters.
          - text: >
              No, because the payoffs in the two branches don't sum to the
              same constant
            feedback: >
              That's a zero-sum consideration, irrelevant here — this game
              isn't zero-sum, and credibility has nothing to do with constant
              sums.
        feedback: >
          A threat surviving the Nash check is not enough; only subgame
          perfection confirms whether carrying it out would actually be
          optimal if the node is reached.
      - teach: >
          Making a threat credible in practice means changing your own payoffs
          before the interaction starts — a signed contract, capacity built
          before demand materializes, or a reputation expensive enough to be
          worth protecting.

  - node: quant-games.game-theory.first-mover
    hook: >
      "Would you rather move first or second?" sounds like small talk, but the right answer flips entirely depending on whether your move is a commitment the opponent must believe or a leak they can exploit.
    explanation: >
      Commitment helps the first mover precisely because it changes the follower's optimization problem: an action taken publicly and irreversibly before the follower moves becomes a fact they must best-respond to, which is exactly the backward-induction logic that made a threat credible earlier — the same mechanism, now working in the mover's own favor rather than against a bluff. Concealment helps the second mover in any game whose equilibria are genuinely mixed, since revealing a realized action collapses your own randomization: the opponent, having seen it, simply best-responds with certainty, converting what would have been the equilibrium value into your worst-case payoff instead.
      The practical diagnostic is two questions asked in order: can I commit to this move in a way the opponent must actually believe, and does moving first leak information worth more to them than that commitment is worth to me? A public, binding action answers the first question yes; a private mixed strategy that gets forced into the open answers the second question badly, since a mixed equilibrium's entire value comes from the opponent's uncertainty about which pure action was realized.
    worked: >
      Return to the asymmetric matching-pennies game from earlier, with row payoffs $+4$ on $H$-$H$, $-1$ on $H$-$T$, $-2$ on $T$-$H$, $+1$ on $T$-$T$, whose simultaneous-play value to the row player was $0.25$. If the row player is instead forced to reveal $H$ or $T$ before the column player moves, revealing $H$ lets column pick between giving row $+4$ or $-1$, and column, minimizing row's payoff, picks $-1$; revealing $T$ lets column choose between $-2$ and $+1$, and column picks $-2$. Row, anticipating this, reveals $H$ to guarantee the less bad $-1$ — a drop from the hidden value of $0.25$ to a forced-reveal value of $-1$, a swing of $1.25$ purely from losing concealment.
    interview: >
      "Would you want to move first in this game?" wants the two-question diagnostic stated explicitly, with the matching-pennies-style value collapse cited as the standard cautionary number for why concealment sometimes beats commitment.
    pitfalls: >
      Defaulting to "moving first is always an advantage" without checking whether the game's equilibria are pure, where commitment helps, or mixed, where revealing hurts. Confusing genuine, binding commitment with mere cheap-talk announcement, which changes nothing about the follower's incentives since it isn't actually enforceable.
    recap: >
      Move first when you can commit in a way the opponent must believe; move second when your move would leak information — any game whose equilibria are all mixed punishes revealing your hand.
    steps:
      - teach: >
          Commitment helps the first mover because it changes the follower's
          optimization problem: an action taken publicly and irreversibly
          becomes a fact the follower must best-respond to.
      - teach: >
          Concealment helps the second mover in any game whose equilibria are
          genuinely mixed, since revealing a realized action collapses your
          own randomization — the opponent simply best-responds with
          certainty.
      - ask: >
          Fresh asymmetric matching-pennies payoffs: $+4$ if $H$ matches $H$,
          $-2$ if $H$ meets $T$, $-1$ if $T$ meets $H$, $+2$ if $T$ matches
          $T$, column taking the opposite. Solve for $p$, row's probability of
          $H$, from column's indifference in the hidden, simultaneous game.
        expects: "1/3"
        hint: >
          Column's payoff from playing $H$ is $-4p+1(1-p)$; from playing $T$
          it's $2p-2(1-p)$. Set them equal.
        feedback: >
          Column's payoff from $H$ is $-4p+1(1-p)=1-5p$; from $T$ it's
          $2p-2(1-p)=4p-2$. Setting them equal: $1-5p=4p-2$, so $3=9p$ and
          $p=1/3$.
      - teach: >
          Now force row to reveal before column moves. Revealing $H$ lets
          column pick the response that hurts row most between $+4$ and $-2$;
          revealing $T$ lets column pick between $-1$ and $+2$ — in both cases
          column, minimizing row's payoff, takes the smaller number.
      - ask: >
          Row must reveal $H$ or $T$ before column moves. Reveal $H$ leaves
          column able to force row down to $-2$; reveal $T$ leaves column able
          to force row down to $-1$. Which reveal minimizes row's loss?
        choices:
          - text: >
              Reveal $H$, guaranteeing $-2$
            feedback: >
              $-2$ is worse than the alternative reveal's guaranteed $-1$ —
              row should pick the less damaging option.
          - text: >
              Reveal $T$, guaranteeing $-1$ — the less bad of the two forced
              outcomes
            correct: true
            feedback: >
              Right — row, anticipating column will exploit whichever reveal
              is made, picks $T$ to cap the damage at $-1$ rather than $-2$.
          - text: >
              It doesn't matter — both reveals guarantee the same payoff to
              row
            feedback: >
              $-2$ and $-1$ are different numbers; the reveal choice genuinely
              changes row's guaranteed outcome here.
        feedback: >
          Row reveals $T$ to guarantee the less-bad $-1$, a real drop from the
          hidden equilibrium value of $2/3$ purely from losing concealment.
      - teach: >
          That swing, from a hidden value of $2/3$ down to a forced-reveal
          value of $-1$, is the entire cost of losing concealment — the
          mechanism behind "move second when your move would leak
          information."
      - ask: >
          True or false: moving first is always at least as good as moving
          second.
        choices:
          - text: >
              True — commitment can only help, never hurt
            feedback: >
              Commitment helps only when the equilibria are pure and
              believable; in a mixed-equilibrium game, being forced to move
              first is exactly what destroys your value.
          - text: >
              False — in any game whose equilibria are all mixed, revealing
              first collapses your own randomization and can only hurt, as the
              swing above shows
            correct: true
            feedback: >
              Right — the two-question diagnostic is: can you commit
              believably, and does moving first leak information worth more
              than that commitment?
          - text: >
              True, as long as the game is zero-sum
            feedback: >
              Zero-sum has nothing to do with it — the asymmetric
              matching-pennies game above is zero-sum and still punishes
              moving first.
        feedback: >
          There's no universal answer: ask whether your move is a believable
          commitment or a leak, and the matching-pennies swing is the standard
          cautionary number for the second case.

  - node: quant-games.game-theory.two-thirds
    hook: >
      "Guess two-thirds of the average" is the standard test of whether you can carry an elimination argument all the way to its logical, and losing, conclusion — the equilibrium answer is also the answer that loses against real people.
    explanation: >
      The elimination cascade only forces the target all the way to zero because the multiplier, $2/3$, is strictly less than one: each round the ceiling on plausible guesses shrinks by that same factor, so the sequence of ceilings converges to zero regardless of where it starts. That strictness matters more than it looks — if the multiplier were exactly $1$ instead, so the game asked players to guess the average itself, any common guess $x$ would trivially satisfy "match the target," making every number in the range a Nash equilibrium simultaneously, since the elimination argument that forces uniqueness never gets off the ground when the ceiling doesn't shrink at all.
      Real populations never iterate the reasoning to its limit, which is exactly why the equilibrium answer, $0$, is also the practically wrong one: most people stop after one or two rounds of "what will others guess," not infinitely many, so the observed average lands well above zero and the winning guess is never the game-theoretically correct one. Recognizing this shape — a target defined as a shrinking fraction of what the crowd does — is the actual transferable skill, since the same cascade argument applies to any multiplier strictly between $0$ and $1$.
    worked: >
      Suppose the rule instead asks for half the average, still on $[0,100]$. The ceiling starts at $100$, and each round it's cut in half: $100 \to 50 \to 25 \to 12.5$, so after four rounds the ceiling on plausible guesses has fallen to $100\times(1/2)^4 = 6.25$, still shrinking toward zero. Contrast this with a multiplier of exactly $1$: if everyone guesses the same number, say $37$, the average is $37$ and the target is $37$ too, so $37$ satisfies the equilibrium condition — and so does every other number in $[0,100]$, since nothing ever forces the ceiling to shrink.
    interview: >
      "Guess two-thirds of the average — what do you say, and why doesn't the game-theoretic answer win?" wants both halves: the elimination argument for why $0$ is the unique equilibrium, and the practical answer, typically a small positive number reflecting where real populations actually land.
    pitfalls: >
      Deriving the cascade correctly and then actually submitting $0$ against real opponents — that guess is only optimal against infinitely deep reasoners who don't exist in practice. Assuming any "closest to a fraction of the average" game reduces to the same zero equilibrium regardless of the multiplier; a multiplier at or above $1$ breaks the argument entirely.
    recap: >
      Iterated elimination forces the target to zero whenever the multiplier is strictly below one, but real populations stop reasoning after a round or two, so the equilibrium answer is also the losing one against humans.
    steps:
      - teach: >
          The elimination cascade forces the target all the way to $0$ because
          the multiplier, $2/3$, is strictly less than one: each round the
          ceiling on plausible guesses shrinks by that same factor.
      - teach: >
          That strictness matters: if the multiplier were exactly $1$ instead,
          so the game asked players to guess the average itself, any common
          guess $x$ would trivially satisfy "match the target," and the
          elimination argument that forces uniqueness never gets off the
          ground.
      - ask: >
          A fresh rule: guess $3/5$ of the average on $[0,100]$. What is the
          ceiling on plausible guesses after $2$ rounds of elimination?
        expects: "36"
        hint: >
          Multiply the starting ceiling of $100$ by $3/5$ twice.
        feedback: >
          $100\times(3/5) = 60$ after one round, then $60\times(3/5)=36$ after
          two — the ceiling shrinks by the multiplier $3/5$ each round.
      - ask: >
          As the number of elimination rounds goes to infinity, what does the
          ceiling converge to, given that $3/5$ is strictly less than $1$?
        choices:
          - text: >
              $36$, since that's where real players tend to stop
            feedback: >
              $36$ is only the ceiling after two rounds — the elimination
              argument itself keeps going, in principle, forever.
          - text: >
              $0$ — the cascade always reaches zero whenever the multiplier is
              strictly below $1$, regardless of the starting range
            correct: true
            feedback: >
              Right — a geometric decay by a factor strictly less than $1$
              converges to $0$ no matter where it starts.
          - text: >
              It depends on the exact starting range chosen
            feedback: >
              The starting range only sets the first ceiling — the limit of
              the shrinking sequence is $0$ regardless of that starting value.
        feedback: >
          Any multiplier strictly between $0$ and $1$ drives the ceiling — and
          so the unique Nash equilibrium — to $0$.
      - ask: >
          Suppose the rule instead asks players to guess exactly the average
          (multiplier $1$). What does the elimination argument conclude?
        choices:
          - text: >
              It still converges to $0$, since elimination always drives the
              target down eventually
            feedback: >
              With multiplier $1$ the ceiling never shrinks at all — there's
              no decay to converge with.
          - text: >
              The elimination argument stalls — every number in $[0,100]$
              satisfies the equilibrium condition once the ceiling stops
              shrinking
            correct: true
            feedback: >
              Right — if everyone guesses the same $x$, the average is $x$ and
              the target is $x$ too, so every $x$ is simultaneously a Nash
              equilibrium.
          - text: >
              The unique equilibrium becomes $50$, the midpoint of the range
            feedback: >
              Nothing singles out $50$ specifically — the argument fails to
              pin down any unique value at all once the multiplier hits $1$.
        feedback: >
          A multiplier of exactly $1$ breaks the elimination argument
          entirely, since the ceiling never shrinks.
      - teach: >
          Real populations never iterate the reasoning to its limit, which is
          exactly why the equilibrium answer, $0$, is also the practically
          wrong one against people who stop after a round or two.

  - node: quant-games.game-theory.levels-of-reasoning
    hook: >
      "What would you actually guess, not the theoretical answer" is the real question behind two-thirds-of-the-average, and this model is what lets you compute a live number instead of reciting one from memory.
    explanation: >
      The cognitive-hierarchy model treats a population as a mixture of reasoning depths rather than as uniformly rational: level $0$ plays without modeling anyone else at all, and level $k$ best-responds to the belief that every opponent sits exactly one level below, at $k-1$. The Nash equilibrium is the limit of this ladder taken to infinity — the top rung nobody actually reaches, which is exactly why it's the wrong prediction for real play even though it remains the correct benchmark for how sophisticated a counterparty could in principle be.
      The strategic rule that follows is to model the depth of the specific opponents in front of you, not the theoretical fixed point: reasoning one level deeper than where the actual crowd sits wins, reasoning many levels deeper wastes effort beating opponents who don't exist, and reasoning too shallow leaves you the level-$0$ player everyone else exploits. This is genuinely useful outside the toy game too — a market of retail counterparties plausibly sits shallow, while a fellow trading desk might sit two or three levels deeper, and guessing that gap correctly is itself a skill worth having.
    worked: >
      Apply the same ladder to a "guess three-quarters of the average" variant on $[0,100]$. Level $0$, playing uniformly at random, averages $50$. Level $1$ best-responds with $0.75\times 50 = 37.5$. Level $2$ best-responds to that with $0.75\times 37.5 = 28.125$. Level $3$ gives $0.75\times 28.125 \approx 21.09$. Compare this to the two-thirds game, where level $2$ already lands near $22$: because $3/4$ is closer to $1$ than $2/3$ is, the ladder shrinks more slowly here, so matching where a real population sits generally takes reasoning one level deeper.
    interview: >
      "What would you actually guess, and why?" wants a specific level named for the specific counterparty pool, derived live from the multiplier and a level-$0$ baseline, rather than a memorized "$22$" detached from whichever game is actually being asked about.
    pitfalls: >
      Treating "level $2$" as a universal answer regardless of who you're playing against — a room of game theorists sits far deeper than a room of casual players, and the right level depends on the actual pool. Conflating the cognitive-hierarchy equilibrium, the theoretical top of the ladder, with a prediction of real behavior, which it explicitly is not.
    recap: >
      Model the reasoning depth of the opponents actually in front of you and play one level deeper — the equilibrium is the limit of that ladder, useful as a benchmark but reached by nobody real.
    steps:
      - teach: >
          The cognitive-hierarchy model treats a population as a mixture of
          reasoning depths: level $0$ plays without modeling anyone else, and
          level $k$ best-responds to the belief that every opponent sits
          exactly one level below, at $k-1$.
      - teach: >
          The Nash equilibrium is the limit of this ladder taken to infinity —
          the top rung nobody actually reaches, which is exactly why it's the
          wrong prediction for real play even though it stays the correct
          benchmark for a maximally sophisticated counterparty.
      - ask: >
          Fresh multiplier: "guess $4/5$ of the average" on $[0,100]$. Level
          $0$ plays uniformly, averaging $50$. Level $1$ best-responds with
          $0.8\times50=40$. What does level $2$ answer?
        expects: "32"
        hint: >
          Apply the same $0.8$ multiplier to level $1$'s answer.
        feedback: >
          Level $2$ best-responds to level $1$'s $40$: $0.8\times40=32$.
      - ask: >
          The multiplier here, $4/5$, is closer to $1$ than the original
          game's $2/3$. What does that imply about how many levels of
          reasoning are needed to approximate where a real population lands?
        choices:
          - text: >
              Fewer levels — the ladder converges faster with a bigger
              multiplier
            feedback: >
              A multiplier closer to $1$ makes each step shrink less, so the
              ladder actually moves toward $0$ more slowly, not faster.
          - text: >
              More levels — the ladder shrinks more slowly toward zero, so
              matching real play typically needs reasoning one level deeper
            correct: true
            feedback: >
              Right — with $2/3$, level $2$ already lands near $22$; with
              $4/5$ closer to $1$, the same depth of reasoning gets you less
              far down the ladder.
          - text: >
              The same number of levels — multiplier size doesn't affect
              convergence speed
            feedback: >
              It does: the multiplier is exactly the shrink factor per level,
              so a multiplier nearer $1$ shrinks the ceiling more slowly.
        feedback: >
          A multiplier nearer $1$ flattens the ladder, so matching a real
          population's landing point generally takes reasoning one level
          deeper than a smaller multiplier would.
      - teach: >
          The operating rule is to model the depth of the specific opponents
          in front of you, not the theoretical fixed point: reasoning one
          level deeper than where the actual crowd sits wins, and reasoning
          many levels deeper wastes effort beating opponents who don't exist.
      - ask: >
          A candidate answers "level $2$" to every guess-the-average style
          question, regardless of who else is in the room. What's wrong with
          that?
        choices:
          - text: >
              Nothing — level $2$ is always the theoretically correct depth
            feedback: >
              There's no universally correct level; the whole point of the
              model is that the right level tracks the actual pool of
              opponents.
          - text: >
              The right level depends on the actual pool of opponents — a room
              of game theorists sits deeper than a room of casual players
            correct: true
            feedback: >
              Right — the transferable skill is estimating the depth of the
              specific counterparty pool, then playing one step beyond it.
          - text: >
              Level $2$ is never correct — only the Nash equilibrium answer is
            feedback: >
              The Nash equilibrium is the limit nobody real reaches; a shallow
              finite level is usually the better prediction against actual
              people.
        feedback: >
          The model's payoff is tracking the depth of the actual counterparty,
          not reciting a fixed level or the theoretical top of the ladder.

  - node: quant-games.game-theory.repeated-cooperation
    hook: >
      "Would a cartel survive indefinitely, or eventually collapse?" hinges entirely on whether the horizon is a known, finite number of rounds or not — and stating that distinction first is the whole answer to whether patience can rescue cooperation.
    explanation: >
      A known finite horizon unravels cooperation completely by the same folding logic used elsewhere in this unit: the final round is a one-shot dilemma with nothing beyond it, so both players defect there regardless of history, which makes the second-to-last round's continuation independent of what happens in it too, and the unraveling runs all the way back to the very first round. An infinite or genuinely unknown-length horizon removes the anchor that backward induction needs to start folding from, which is exactly what lets a credible ongoing threat sustain cooperation instead.
      Grim trigger — cooperate until any defection is observed, then defect forever after — is self-enforcing without needing any of the fresh commitment machinery from credible threats, because the punishment phase is just repeating the one-shot dominant strategy indefinitely, something neither player has any independent reason to deviate from. With temptation payoff $T$, mutual-cooperation payoff $R$, mutual-defection payoff $P$, and discount factor $\delta$, cooperating forever is worth $R/(1-\delta)$ while defecting once and then facing permanent punishment is worth $T+\delta P/(1-\delta)$; cooperation survives exactly when $\delta \ge (T-R)/(T-P)$ — patience, not goodwill, is the entire mechanism, and the threshold itself depends on the specific payoff numbers, not on some universal constant.
    worked: >
      Return to the OPEC output game, where mutual cutting pays $(6,6)$, flooding against a cutter pays the flooder $9$ and the cutter $2$, and mutual flooding pays $(4,4)$, so $T=9$, $R=6$, $P=4$. Cooperating forever under grim trigger is worth $6/(1-\delta)$; flooding once and then facing permanent mutual flooding is worth $9+4\delta/(1-\delta)$. Setting $6/(1-\delta)\ge 9+4\delta/(1-\delta)$ and clearing denominators gives $6\ge 9-5\delta$, so $\delta\ge 3/5$. Using the general formula directly, $(T-R)/(T-P)=(9-6)/(9-4)=3/5$, confirming the same threshold — notably higher than the $1/2$ threshold for the original prisoners' dilemma numbers, since the temptation-to-defect gain here is relatively larger.
    interview: >
      "Would you expect this cartel to hold together?" wants the known-versus-unknown horizon distinction stated first, then the general threshold $\delta^{*}=(T-R)/(T-P)$ derived live from whatever specific payoffs are given, not a memorized $1/2$.
    pitfalls: >
      Assuming any repeated prisoners' dilemma sustains cooperation regardless of horizon — a known finite horizon unravels it completely no matter how many rounds remain. Reciting "$\delta\ge 1/2$" as if it were a universal constant instead of rederiving $(T-R)/(T-P)$ from the actual payoff numbers of the game in front of you.
    recap: >
      A known finite horizon unravels cooperation entirely by backward induction, while an open-ended one sustains it under grim trigger whenever $\delta\ge (T-R)/(T-P)$ — patience, not goodwill, and a threshold that depends on the actual payoffs.
    steps:
      - teach: >
          A known finite horizon unravels cooperation completely by the same
          folding logic as backward induction: the final round is a one-shot
          dilemma with nothing beyond it, so both defect there regardless of
          history.
      - teach: >
          That unraveling runs all the way back to the first round, since the
          second-to-last round's continuation becomes independent of behavior
          there too, once the last round is already known to end in defection.
      - teach: >
          An infinite or genuinely unknown-length horizon removes the anchor
          backward induction needs to start folding from. Under grim trigger —
          cooperate until any defection, then defect forever — cooperation
          survives exactly when $\delta \ge (T-R)/(T-P)$.
      - ask: >
          Two firms repeat a pricing game. Mutual Fair Price: $(7,7)$; one
          Undercuts while the other stays Fair: undercutter $10$, the other
          $1$; both Undercut: $(3,3)$. What is the minimum discount factor
          $\delta$ that sustains cooperation under grim trigger?
        expects: "3/7"
        hint: >
          Identify $T=10$, $R=7$, $P=3$, then apply $\delta^{*} =
          (T-R)/(T-P)$.
        feedback: >
          $T=10$, $R=7$, $P=3$, so $\delta^{*} = (10-7)/(10-3) = 3/7$.
      - ask: >
          The two firms play this game for a known, fixed $50$ rounds and then
          stop forever. Does grim trigger sustain cooperation throughout,
          given $\delta \ge 3/7$?
        choices:
          - text: >
              Yes, as long as $\delta \ge 3/7$ as computed
            feedback: >
              The threshold formula assumes an open-ended horizon — a known,
              fixed endpoint changes the analysis entirely, regardless of
              $\delta$.
          - text: >
              No — a known finite horizon unravels cooperation completely by
              backward induction, regardless of $\delta$ or how many rounds
              remain
            correct: true
            feedback: >
              Right — the final round is a one-shot dilemma, and the
              unraveling runs all the way back to round one no matter how
              large $\delta$ is.
          - text: >
              Yes, but only in the very first round
            feedback: >
              It fails at every round, not just the last — the unraveling
              propagates backward through the entire finite horizon.
          - text: >
              It depends on whether $50$ is an even or odd number of rounds
            feedback: >
              Parity of the round count plays no role — what matters is only
              that the horizon is known and finite.
        feedback: >
          A known finite horizon defeats grim trigger entirely, no matter how
          patient the firms are — the discount-factor threshold only applies
          to an open-ended horizon.
      - ask: >
          A colleague recalls "cooperation needs $\delta \ge 1/2$" from a
          different problem and applies it here without recomputing. What's
          wrong?
        choices:
          - text: >
              Nothing — $1/2$ is a universal constant for every repeated
              prisoners' dilemma
            feedback: >
              It's specific to whatever $T$, $R$, $P$ produced it — here those
              numbers give $3/7$, not $1/2$.
          - text: >
              The threshold $(T-R)/(T-P)$ depends on the actual payoff numbers
              of the specific game — here it's $3/7$, not $1/2$
            correct: true
            feedback: >
              Right — patience, not goodwill, sustains cooperation, and how
              much patience is required depends entirely on the game's own
              $T$, $R$, $P$.
          - text: >
              The formula should instead be $(R-P)/(T-P)$
            feedback: >
              That's a different, incorrect ratio — the threshold is
              specifically $(T-R)/(T-P)$, comparing the temptation gain to the
              full temptation-to-punishment spread.
        feedback: >
          Rederive $\delta^{*}=(T-R)/(T-P)$ from the actual payoffs of the
          game in front of you rather than reusing a memorized number from a
          different problem.
