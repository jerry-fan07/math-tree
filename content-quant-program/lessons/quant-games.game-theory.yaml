unit: quant-games.game-theory
opening: >
  Game theory turns "what should I do" into "what should I do given what everyone else will do" — this unit builds that machinery from a bare payoff matrix upward. It opens with normal-form games, dominance, and Nash equilibrium, the two solution concepts that settle most one-shot problems outright, then adds mixed strategies and the indifference principle for games where no pure prediction survives, worked through matching pennies, battle of the sexes, and von Neumann's minimax theorem for zero-sum play. It moves next to sequential games — extensive-form trees, backward induction, credible threats, and first-mover logic — and closes with two set pieces on where the theory bends against real opponents: guess-two-thirds-of-the-average with the levels-of-reasoning model, and repeated-game cooperation, where patience rather than goodwill sustains what one-shot dominance forbids.
lessons:
  - node: quant-games.game-theory.normal-form
    hook: >
      Every "here's a game" prompt in an interview is really asking you to name three things — players, strategies, payoffs — before you touch any solution concept, and skipping straight to "the answer" without naming them is the most common tell of an unprepared candidate.
    explanation: >
      A normal-form game is nothing but a payoff table: finitely many players, a finite menu of pure strategies for each, and a number assigned to every player at every combination of choices. The number matters as a cardinal utility, not just a ranking, precisely because the fair-value logic you already know for a single random payoff — pricing it by its expectation — only makes sense to apply to a mixed strategy if averaging payoffs is meaningful in the first place. That is the entire reason payoffs are utilities and not, say, ordinal ranks.
      Two features do the real work: everyone chooses once, simultaneously, with no communication, and the whole structure — every player's strategies and every payoff — is common knowledge to all players. Common knowledge is stronger than "each player knows the payoffs": it means each player knows the others know, knows that they know that, and so on, which is what licenses reasoning about what a rational opponent will conclude rather than just what they happen to prefer.
      Writing the matrix as prose row lists, one row per strategy of the row player and one payoff pair per column, is just notation — the object being described is the same whether you draw a grid or write it out. "Solve the game" means predict which cell rational, common-knowledge-sharing players land on, and every technique in this unit is a different route to that prediction.
    worked: >
      Take a game with three players who each choose between two strategies, with no dominance or symmetry assumed yet — just the bookkeeping. The payoff function must specify a number for every player at every combination of choices, and the count of combinations is the product of the strategy-set sizes: $2 \times 2 \times 2 = 8$ strategy profiles, each needing three payoff numbers written down. A fourth player with three strategies instead of two would push the count to $2^3 \times 3 = 24$ profiles — the size of the object you're solving grows fast, which is exactly why later techniques exist to avoid checking every cell by hand.
    interview: >
      "Set up the game" is the opening move of nearly every game-theory prompt, and interviewers are listening for players, strategy sets, and payoffs named explicitly — including whether the payoffs are genuinely cardinal — before any talk of equilibria.
    pitfalls: >
      Writing payoffs as rankings ("row prefers this to that") instead of numbers quietly breaks every later tool that needs expectations, since mixed strategies and indifference conditions are arithmetic on the numbers themselves. Forgetting the common-knowledge assumption leads to solving a different, harder problem — one with private information — that the stated game never asked for.
    recap: >
      A normal-form game is players, strategy sets, and a cardinal payoff at every profile, common knowledge to all, simultaneous and communication-free — the one object every solution concept in this unit operates on.
    dialogue:
      - part: Two desks, one quote each
        teach: >
          Two market-making desks, Alder and Birch, must each post a quote on
          the same block of bonds at 9:00, neither seeing the other's. Each
          quotes Tight or Wide. Your notes give (Alder, Birch): both Tight,
          $(1,1)$; Alder Tight and Birch Wide, $(4,0)$; Alder Wide and Birch
          Tight, $(0,4)$; both Wide, $(6,6)$.
      - ask: >
          Alder's head of desk asks one question: what does quoting Tight
          earn us?
        choices:
          - text: >
              $4$, since Tight beats a Wide quote.
            feedback: >
              Only if Birch quotes Wide. If Birch also quotes Tight, Alder
              earns $1$. You picked Birch's move for her.
          - text: >
              $1$, the worst case.
            feedback: >
              $1$ is what Tight earns if Birch also quotes Tight. It is a
              floor, and a useful one, but it is not what Tight earns.
          - text: >
              It cannot be answered until you know, or guess, Birch's quote.
            correct: true
            feedback: >
              Right. Tight earns $1$ or $4$ depending on a choice Alder does
              not control. That dependence is what makes this a game rather
              than a decision.
        feedback: >
          Every payoff here is indexed by both quotes at once. Answering
          "what should Alder do" means forming a view of Birch, and Birch is
          forming a view of Alder.
      - ask: >
          Alder decides Birch is equally likely to quote either way. On that
          view, what does Tight earn Alder on average?
        expects: "2.5"
        feedback: >
          $\frac{1}{2}(1) + \frac{1}{2}(4) = 2.5$. A belief about the other
          desk turns a row of payoffs into one number.
      - ask: >
          On the same view, what does Wide earn Alder on average?
        expects: "3"
        feedback: >
          $\frac{1}{2}(0) + \frac{1}{2}(6) = 3$, so on that belief Wide is
          the better quote by half a point.
      - ask: >
          A colleague says the numbers are overkill: Alder's ranking of the
          four outcomes — both Wide, then Tight against Wide, then both Tight,
          then Wide against Tight — carries all the information. Does it?
        choices:
          - text: >
              Yes: the ranking says which outcome is better, and that is all
              a rational desk uses.
            feedback: >
              Replace the $6$ by $4.5$. The ranking is unchanged, but Wide's
              average drops to $\frac{1}{2}(0) + \frac{1}{2}(4.5) = 2.25$,
              below Tight's $2.5$. Same ranking, opposite verdict.
          - text: >
              No: the comparison of averages depends on how far apart the
              outcomes are, which a ranking throws away.
            correct: true
            feedback: >
              Exactly. With $6$ Wide wins by $0.5$; with $4.5$ in its place,
              a relabelling that keeps the order, Tight wins by $0.25$. Only
              numbers on a scale where averaging means something can settle
              it.
          - text: >
              Yes, as long as you turn the ranks into scores $4, 3, 2, 1$.
            feedback: >
              Then Tight averages $\frac{1}{2}(2) + \frac{1}{2}(3) = 2.5$ and
              Wide $\frac{1}{2}(1) + \frac{1}{2}(4) = 2.5$: a tie that the real
              numbers do not show. Rank scores are one arbitrary relabelling
              among many.
        feedback: >
          The moment anyone averages over uncertainty about the other side,
          payoffs must be cardinal: numbers whose differences mean something,
          exactly as when you priced a random payoff by its expectation.

      - part: What else the table quietly assumes
        ask: >
          Written out in full, how many payoff numbers does the Alder–Birch
          table contain?
        expects: "8"
        hint: >
          Count the combinations of quotes first, then ask how many numbers
          each combination carries.
        feedback: >
          $2 \times 2 = 4$ combinations, and each carries one number for each
          of the $2$ desks: $4 \times 2 = 8$.
      - reflect: >
          Those $8$ numbers are not the whole story. Your reasoning about
          Alder used facts about how the quotes are posted and about who
          knows what. Name them: what would have to change for the table to
          stop being a fair description of the situation?
        answer: >
          Three things beyond the numbers. Both desks choose once and at the
          same time, so neither can react to the other's quote. They cannot
          talk first and strike a deal. And the whole table is common
          knowledge: Alder knows Birch's payoffs, Birch knows Alder knows,
          and so on up — which is what lets Alder reason about what Birch
          will conclude, not just what Birch likes.
      - teach: >
          That package has a name. A normal-form game is a finite list of
          players, a finite set of pure strategies for each, and a payoff for
          every player at every strategy profile — one strategy per player —
          measured on a scale where averaging is meaningful. Everyone chooses
          once, simultaneously, without communication, and the whole object
          is common knowledge. "Solve the game" means predict the profile
          rational players land on.

      - part: Clause by clause on new versions
        ask: >
          A client's broker becomes a third player: at 9:00, without seeing
          either quote, she routes the order to Alder, to Birch, or splits it.
          Each desk still has two quotes. How many payoff numbers does the
          full game need?
        expects: "36"
        hint: >
          A profile is one choice from each of the three players.
        feedback: >
          $2 \times 2 \times 3 = 12$ profiles, each carrying $3$ numbers, one
          per player: $12 \times 3 = 36$. Stopping at $12$ counts cells, not
          the numbers inside them.
      - ask: >
          Back to two desks, but Birch now posts at 9:05 after seeing Alder's
          9:00 quote. Is the same $2 \times 2$ table still the right
          description?
        choices:
          - text: >
              Yes: the payoffs for each pair of quotes have not changed.
            feedback: >
              The payoffs have not, but Birch's options have. She can now
              quote Wide if Alder is Tight and Tight if Alder is Wide — a
              plan that reacts, which no row of the old table describes.
          - text: >
              No, because the quotes are no longer posted at the same clock
              time.
            feedback: >
              Clock time alone is harmless: if Birch posted at 9:05 without
              seeing Alder's quote, the table would still be exact. What
              breaks it is that she observes before choosing.
          - text: >
              No: Birch sees Alder's quote, so her choice can depend on it.
            correct: true
            feedback: >
              Right. The simultaneity clause is about information, not
              timing. Once one side observes the other, you need a richer
              object, built later in this unit.
        feedback: >
          "Simultaneous" in the definition means nobody acts on the other's
          choice. Sequence with observation is a different game.
      - ask: >
          Another version: the original table, but Birch's payoff numbers are
          private to Birch — Alder knows only her own row of numbers. Which
          clause fails?
        choices:
          - text: >
              Payoffs must be cardinal.
            feedback: >
              The numbers are still numbers on a meaningful scale. Nothing
              about their kind has changed; only who sees them has.
          - text: >
              Common knowledge of the game.
            correct: true
            feedback: >
              Alder can no longer work out what Birch prefers, let alone what
              Birch expects Alder to do. Everything else — players, quotes,
              numbers, simultaneity — is intact; this one clause is gone.
          - text: >
              Simultaneous choice.
            feedback: >
              Both still quote at 9:00 without seeing each other. The timing
              is fine; the failure is in what each desk knows about the
              other's payoffs.
        feedback: >
          A game with private payoffs is a genuinely harder problem, with
          beliefs about types attached. When an interview states a matrix,
          the common-knowledge clause is what lets you treat it as given to
          both sides.
      - teach: >
          Said aloud in an interview: "Two players, Alder and Birch; each
          quotes Tight or Wide; here are the four payoff pairs; they choose
          simultaneously and the table is common knowledge." Thirty seconds,
          and every later tool has something to work on.

  - node: quant-games.game-theory.dominance
    hook: >
      Dominance is the first move at the board, not the last resort: an easy game solves itself the instant you spot a strategy that beats everything else no matter what the opponent does, and reaching for equilibrium machinery before checking this is wasted effort.
    explanation: >
      A strategy dominates another for a player if it pays at least as much against every possible opponent profile — strictly if it always pays more, weakly if it ties somewhere and wins elsewhere. The force of "every possible opponent profile" is what makes this the cheapest kind of reasoning available: a player who has a dominant strategy needs zero beliefs about what the opponent will actually do, since the comparison already holds against all of them simultaneously.
      Once a strategy is strictly dominated, deleting it and repeating the check on the smaller game is safe — iterated elimination — because a rational player never plays a strictly dominated strategy regardless of what survives elsewhere, so removing it changes nothing about anyone's remaining incentives. That safety is specific to strict dominance: deleting a weakly dominated strategy can depend on the order you delete in, and can delete equilibria that strict elimination never would, so a solution reached via weak elimination needs that caveat stated explicitly.
      The general pattern worth carrying forward: whenever a matrix has an entire row or column that's uniformly worse, cross it out and re-examine the smaller matrix — sometimes one pass is enough, sometimes deleting a strategy exposes a new dominance relation that wasn't visible before.
    worked: >
      Take row strategies $X, Y$ against column strategies $L, R$, with payoffs (row, column): row $X$: $(3,2)$ against $L$, $(2,5)$ against $R$; row $Y$: $(3,1)$ against $L$, $(1,0)$ against $R$. Comparing $X$ to $Y$ for the row player: against $L$ they tie at $3$, against $R$, $X$ pays $2$ against $Y$'s $1$ — so $X$ weakly dominates $Y$, and $Y$ can be deleted. The column player, facing only row $X$ now, compares $2$ (from $L$) against $5$ (from $R$) and plays $R$. The game resolves to $(X,R)$, paying $(2,5)$.
    interview: >
      "Is there a dominant strategy here" wants the check run explicitly — compare each pair of strategies across every opponent action, not just the one that seems likely — and "can you simplify this matrix first" is asking for exactly the delete-and-repeat move before any equilibrium concept is invoked.
    pitfalls: >
      Confusing "this beats that against the opponent's most likely move" with true dominance, which must hold against every opponent action without exception. Using weak-dominance elimination without flagging that the result can depend on deletion order and can discard equilibria that survive strict elimination.
    recap: >
      A dominant strategy needs no guess about the opponent at all; delete strictly dominated rows and columns and repeat, and many games solve themselves before any equilibrium concept is needed.
    dialogue:
      - part: A choice that needs no forecast
        teach: >
          You and a rival fund each decide, without seeing the other, where
          to put a new analyst team: Rates or Credit. Your payoffs: Rates
          earns $2$ if the rival also picks Rates and $6$ if she picks Credit;
          Credit earns $5$ if she picks Rates and $7$ if she picks Credit.
      - ask: >
          Which do you pick?
        choices:
          - text: >
              Credit, but only if you expect the rival to pick Rates.
            feedback: >
              If she picks Credit instead, your Credit still earns $7$ against
              Rates' $6$. The forecast never entered the comparison.
          - text: >
              Rates: she will probably crowd into Credit, and Rates then
              earns $6$.
            feedback: >
              In that same column your Credit earns $7$. The $6$ has to be
              compared with what Credit earns against the same rival move,
              not with Credit's number in the other column.
          - text: >
              Credit, whatever the rival does.
            correct: true
            feedback: >
              Column by column: $5 > 2$ if she picks Rates, $7 > 6$ if she
              picks Credit. The same row wins both comparisons.
          - text: >
              It cannot be decided without a forecast of the rival.
            feedback: >
              Usually true, and not here. Compare the two rows one rival move
              at a time: Credit wins $5$ to $2$ and $7$ to $6$.
        feedback: >
          Most choices in a game hang on a view of the other side. This one
          does not, and spotting that is the cheapest reasoning in the subject.
      - ask: >
          A consultant offers to tell you the rival's choice before you
          commit. What is that information worth to you, in payoff?
        expects: "0"
        hint: >
          Would either answer she could give change what you do?
        feedback: >
          $0$. If she says Rates you pick Credit and earn $5$; if she says
          Credit you pick Credit and earn $7$ — exactly what you earn without
          her. Information that never changes your action is worth nothing.
      - reflect: >
          Say exactly what you checked about Credit and Rates that made the
          consultant worthless. Then say how the conclusion changes if
          Credit's $7$ were a $6$ instead.
        answer: >
          You compared the two rows one rival move at a time and Credit paid
          strictly more in every column. That is a statement about all of her
          options at once, so no belief about her is needed. With a $6$ in
          place of the $7$, Credit wins one column and ties the other: it is
          never worse and sometimes better, a weaker relation that still
          favours Credit but leaves a tie to argue over.
      - teach: >
          Strategy $s$ strictly dominates $t$ when $s$ pays strictly more
          than $t$ against every profile of opponent strategies. It weakly
          dominates $t$ when it pays at least as much against every profile
          and strictly more against at least one. A strategy that strictly
          dominates all your others is dominant: you can play it without
          predicting anyone.

      - part: Cross out, then look again
        teach: >
          A new game, payoffs $(\text{you}, \text{rival})$, your rows $U, M,
          D$ against her columns $L, C, R$. Row $U$: $(4,3)$ against $L$,
          $(5,1)$ against $C$, $(6,2)$ against $R$. Row $M$: $(2,1)$, $(8,4)$,
          $(3,6)$. Row $D$: $(3,0)$, $(9,6)$, $(2,8)$.
      - ask: >
          Looking only at your own payoffs, does any of your rows strictly
          dominate another?
        choices:
          - text: >
              Yes: $U$ dominates $M$, winning against $L$ and $R$.
            feedback: >
              Against $C$, $M$ pays $8$ and $U$ pays $5$. Two columns out of
              three is not dominance; it has to be every column.
          - text: >
              Yes: $D$ dominates $M$, winning against $L$ and $C$.
            feedback: >
              $3 > 2$ and $9 > 8$, but against $R$ the order flips: $M$ pays
              $3$ and $D$ pays $2$.
          - text: >
              No: every pair of rows flips order in some column.
            correct: true
            feedback: >
              $U$ against $M$ flips at $C$, $U$ against $D$ flips at $C$, $M$
              against $D$ flips at $R$. On your own numbers you have nothing
              to delete.
        feedback: >
          Column $C$ is what protects $M$ and $D$: it is where they pay $8$ and
          $9$. Whether that protection is real depends on whether the rival
          would ever play $C$.
      - ask: >
          Now read her payoffs, the second number in each pair. Which of her
          columns is strictly dominated?
        choices:
          - text: >
              $L$, by $R$.
            feedback: >
              Against your $U$, $L$ pays her $3$ and $R$ pays her $2$. $R$ wins
              the other two rows, but not all three.
          - text: >
              $C$, by $R$.
            correct: true
            feedback: >
              $C$ pays her $1, 4, 6$ down your rows and $R$ pays $2, 6, 8$:
              strictly more in every row. She never has a reason to play $C$.
          - text: >
              $C$, by $L$.
            feedback: >
              Against your $D$, $C$ pays her $6$ and $L$ pays $0$. $L$ beats
              $C$ only in the top row.
        feedback: >
          $R$ strictly dominates $C$ for her. That is a fact about her
          numbers; your rows have not changed.
      - reflect: >
          Her $C$ is dominated for her, not for you. Why are you entitled to
          cross it out before choosing your own row — and what do you see in
          your own rows once it is gone?
        hint: >
          Ask what you know about her, and then reread your rows with $C$
          covered.
        answer: >
          She is rational and you know it, so she never plays a strictly
          dominated column; a cell she will never reach cannot be your reason
          to choose a row. With $C$ covered, $U$ pays $4$ and $6$ against $M$'s
          $2$ and $3$ and $D$'s $3$ and $2$ — $U$ now strictly dominates both.
          The deletion exposed a dominance that $C$ was hiding, and each new
          round leans on one more layer of "she knows that I know".
      - teach: >
          This is iterated elimination of strictly dominated strategies:
          delete every strictly dominated row and column, reread the smaller
          game, and repeat until nothing more goes. The order of deletion
          never matters for strict dominance — a strategy that loses to
          another against every opponent profile still loses against any
          subset of them.
      - ask: >
          Run it to the end. What payoff do you receive at the surviving
          cell?
        expects: "4"
        hint: >
          After your $M$ and $D$ go, she has two columns left against your
          single row.
        feedback: >
          Delete $C$; then $U$ strictly dominates $M$ and $D$; facing only
          $U$, she compares $3$ from $L$ with $2$ from $R$ and plays $L$. The
          game solves to $(U, L)$, paying $(4, 3)$.

      - part: When the win is only a tie
        teach: >
          One more game, payoffs $(\text{you}, \text{rival})$. Row $U$:
          $(3,2)$ against $L$, $(0,0)$ against $R$. Row $M$: $(3,2)$ against
          $L$, $(5,2)$ against $R$. Row $D$: $(0,0)$ against $L$, $(5,2)$
          against $R$. Nothing is strictly dominated, but $M$ weakly dominates
          both $U$ (tie at $L$, $5 > 0$ at $R$) and $D$ ($3 > 0$ at $L$, tie
          at $R$).
      - ask: >
          Delete $U$ first. In the game that remains, one of her columns is
          weakly dominated; delete it too. What do you earn at the end?
        expects: "5"
        hint: >
          With $U$ gone, compare her payoffs from $L$ and $R$ against $M$
          and $D$.
        feedback: >
          Against $M$ and $D$, her $L$ pays $2, 0$ and her $R$ pays $2, 2$, so
          $R$ weakly dominates $L$. Delete $L$ and you earn $5$ with either
          remaining row.
      - ask: >
          Start again, and delete $D$ first instead. Then delete her weakly
          dominated column. What do you earn now?
        expects: "3"
        feedback: >
          Against $U$ and $M$, her $L$ pays $2, 2$ and her $R$ pays $0, 2$,
          so now $L$ weakly dominates $R$. Delete $R$ and you earn $3$.
          Same game, two legal orders, two different answers.
      - ask: >
          What do you say in an interview when your solution used weak
          elimination?
        choices:
          - text: >
              Nothing: pick the order that gives the higher payoff, since
              that is the one a smart player would choose.
            feedback: >
              The order is a choice made by you, the analyst, not by either
              player. The rival is not bound by it, and the $5$ outcome has
              no better claim than the $3$.
          - text: >
              That weak elimination is invalid, so you would redo the
              problem without it.
            feedback: >
              Too strong. Discarding a strategy that is never better and
              sometimes worse is often sensible — truthful bidding in a
              second-price auction is exactly a weakly dominant strategy. It
              just needs a caveat.
          - text: >
              That you eliminated weakly, so another deletion order could
              give a different answer and discard outcomes strict
              elimination keeps.
            correct: true
            feedback: >
              Right. Strict elimination has neither problem; weak elimination
              has both, and saying so is part of the answer.
        feedback: >
          Strict dominance: delete freely, in any order. Weak dominance: delete
          if you must, and name it. In both cases the opening move at the
          board is the same — scan for a row or column that loses everywhere
          before reaching for anything heavier.

  - node: quant-games.game-theory.prisoners-dilemma
    hook: >
      Every "why do cartels collapse" or "why does everyone advertise even though it hurts margins" question is this exact skeleton wearing a different costume, and naming the payoff ordering $T>R>P>S$ out loud is the fastest way to signal you recognize it.
    explanation: >
      The mechanism is pure dominance: whichever action pays more regardless of the opponent's choice wins the comparison against every alternative, so the specific numbers matter far less than their ordering. Call the temptation payoff $T$ (defecting against a cooperator), the reward $R$ (mutual cooperation), the punishment $P$ (mutual defection), and the sucker's payoff $S$ (cooperating against a defector); whenever $T>R>P>S$ holds, defection strictly dominates for both players by the same logic worked in the dominance node, and the unique equilibrium is mutual defection at $P$, strictly worse for both than the unreachable $R$.
      The result that makes this worth a name of its own is the gap between what's individually rational and what's collectively best: nobody deviates unilaterally from mutual defection, since deviating alone only trades $P$ for the even worse $S$, yet an outside observer who could dictate both moves would pick mutual cooperation instantly. Recognizing this shape — individually optimal, jointly destructive — is the actual skill, since the surface story changes constantly: price wars, arms races, doping, tariffs, all reduce to the same four numbers in the same order.
    worked: >
      Two oil producers each choose to Cut output or Flood the market. Both cutting pays $(6,6)$; one flooding while the other cuts pays the flooder $9$ and the cutter $2$; both flooding pays $(4,4)$. Here $T=9$, $R=6$, $P=4$, $S=2$, and $9>6>4>2$ confirms the ordering. Flooding dominates for each producer — against a cutting rival it pays $9$ versus $6$, against a flooding rival it pays $4$ versus $2$ — so both flood, collecting $4$ each instead of the $6$ each they'd get by holding output down.
    interview: >
      "Why does a cartel break down even though everyone would be better off holding the line?" is the standard phrasing, and the interviewer is listening for the dominance argument stated explicitly, plus the phrase "individually rational, collectively destructive," not just the observation that cooperation would be nicer.
    pitfalls: >
      Picking the jointly best cell $(R,R)$ as "the answer" because it's Pareto-superior — that's a description of what's efficient, not a prediction of what dominance-driven play actually produces. Assuming this one-shot analysis automatically extends to repeated play, where a different logic about patience and discount factors takes over.
    recap: >
      Whenever payoffs satisfy $T>R>P>S$, defection strictly dominates for both players and the unique equilibrium is the mutually worse $P$, not the jointly better $R$ neither can reach alone.
    dialogue:
      - part: Two funds and one illiquid bond
        teach: >
          Two funds hold the same thinly traded bond into quarter end. Each
          decides overnight, alone, to Hold or to Dump. Payoffs
          $(\text{you}, \text{her})$: both Hold, $(5,5)$; you Dump while she
          Holds, $(8,-1)$; you Hold while she Dumps, $(-1,8)$; both Dump,
          $(1,1)$ — the bid collapses under two sellers.
      - ask: >
          Suppose she Holds. How much more do you earn by Dumping than by
          Holding?
        expects: "3"
        feedback: >
          Dumping into her Hold earns $8$, Holding alongside her earns $5$:
          $8 - 5 = 3$ more.
      - ask: >
          Suppose instead she Dumps. How much more do you earn by Dumping
          than by Holding?
        expects: "2"
        hint: >
          Read the column where she Dumps: your Hold and your Dump.
        feedback: >
          Dumping alongside her earns $1$, Holding while she sells earns $-1$:
          $1 - (-1) = 2$ more.
      - ask: >
          What do you do, and what did you need to know about her?
        choices:
          - text: >
              Hold, if you trust her to Hold too.
            feedback: >
              If she Holds, Dumping earns $8$ against your $5$. Trusting her
              makes Dumping more attractive, not less.
          - text: >
              Dump, and you needed nothing about her.
            correct: true
            feedback: >
              Dumping wins by $3$ if she Holds and by $2$ if she Dumps. It
              strictly dominates Holding, so no forecast of her is required.
          - text: >
              Dump, because you expect her to Dump.
            feedback: >
              Your expectation is idle. If she Holds, you Dump anyway, and
              earn $8$ rather than $5$.
        feedback: >
          The comparison never depended on her move. She faces the mirror
          image of your table and reaches the same conclusion.
      - ask: >
          Both funds play their dominant strategy. What does each earn?
        expects: "1"
        feedback: >
          Both Dump, landing on $(1,1)$ — while both Holding would have paid
          $(5,5)$.

      - part: The cell nobody can reach
        ask: >
          Both funds prefer $(5,5)$ to $(1,1)$. Why do two rational funds not
          end up there?
        choices:
          - text: >
              They do not trust each other enough to Hold.
            feedback: >
              Trust is not the problem. Even if you *knew* she would Hold,
              Dumping pays $8$ against $5$. Certainty about her makes the
              temptation larger.
          - text: >
              At $(\text{Hold}, \text{Hold})$ each gains $3$ by switching
              alone to Dump, so neither stays.
            correct: true
            feedback: >
              The good cell is unstable from the inside: either fund, holding
              the other fixed, does better by leaving.
          - text: >
              Holding is risky and both funds are risk-averse.
            feedback: >
              Nothing here is random. The payoffs are already utilities, and
              Dump beats Hold in each column with certainty.
        feedback: >
          The outcome each fund prefers is not one either can reach alone, and
          from the outcome they reach, neither gains by moving alone.
      - reflect: >
          Your argument used the four payoffs $8$, $5$, $1$, $-1$. Which
          facts about them did it actually need? Say what you could change
          about the numbers without changing the conclusion.
        hint: >
          Your two comparisons were $8$ against $5$ and $1$ against $-1$. The
          regret was $5$ against $1$.
        answer: >
          Only their order. Dump dominates because the temptation $8$ beats
          the mutual-hold $5$ and the mutual-dump $1$ beats the stranded
          holder's $-1$; the result is a shame because $5$ beats $1$. Any
          numbers in the order $8 > 5 > 1 > -1$ give the same game, which is
          why one skeleton covers price wars, arms races and fire sales.
      - teach: >
          That skeleton is the prisoners' dilemma. Name the payoffs: the
          temptation $T$ (defecting on a cooperator), the reward $R$ (both
          cooperate), the punishment $P$ (both defect) and the sucker's payoff
          $S$. Whenever $T > R > P > S$, defection strictly dominates for both
          players — $T > R$ and $P > S$ — and the unique outcome $(P, P)$ is
          worse for both than $(R, R)$.

      - part: Bending the numbers
        ask: >
          A dilemma has $R = 6$, $P = 2$ and $S = 0$. What is the smallest
          whole-number temptation $T$ that keeps it a prisoners' dilemma?
        expects: "7"
        hint: >
          Which inequality involves $T$?
        feedback: >
          The ordering needs $T > R = 6$, so the smallest whole number is
          $7$. At $T = 6$ a cooperator facing a cooperator is indifferent
          between staying and defecting, and dominance is only weak.
      - ask: >
          Back to the funds, but a regulator now fines any fund that dumps
          into a collapsing bid: both Dump pays $(-2,-2)$, everything else
          unchanged. Does Dump still dominate?
        choices:
          - text: >
              Yes: it still earns $8$ against a holder.
            feedback: >
              Dominance needs every column. If she Dumps, your Dump now earns
              $-2$ and your Hold earns $-1$, so Hold wins that column.
          - text: >
              No: against a dumper, Holding now pays more, so your best move
              depends on hers.
            correct: true
            feedback: >
              Now $P = -2 < S = -1$, breaking $P > S$. Dump is best against
              Hold, Hold is best against Dump — a different game, in which
              each wants to do the opposite of the other.
          - text: >
              No: Holding now dominates.
            feedback: >
              Against a holder, Dumping still earns $8$ against $5$. Neither
              row wins both columns.
        feedback: >
          Each inequality carries weight. Drop $P > S$ and the dominance
          argument loses one of its two columns; the dilemma's logic goes with
          it.
      - ask: >
          Which of these situations is a prisoners' dilemma?
        choices:
          - text: >
              Two drivers meet on a one-lane bridge; if both push on they
              crash, and the worst outcome is the crash.
            feedback: >
              Mutual "defection" is the worst cell, so $P < S$: yielding to a
              pusher beats crashing. That is the game the fine just created,
              not a dilemma.
          - text: >
              Two hunters can catch a stag only together, and each would
              rather share a stag than catch a hare alone.
            feedback: >
              Here mutual cooperation pays the most to each, so $R > T$:
              against a cooperator you want to cooperate. No dominance at all.
          - text: >
              Two shops can each run ads that only steal customers from the
              other, and each would rather run them whatever the other does.
            correct: true
            feedback: >
              Advertising is privately better against either choice, and
              mutual advertising leaves both paying for ads that cancel out:
              $T > R > P > S$.
        feedback: >
          The test is the ordering, not the story. Read off $T$, $R$, $P$, $S$
          and check the three inequalities before naming the game.
      - teach: >
          Said aloud: "Defect strictly dominates for both, because $T > R$ and
          $P > S$; the unique outcome is mutual defection at $P$, though both
          prefer $R$ — individually rational, jointly destructive." What
          changes the answer is not goodwill but a change to the payoffs, and
          playing the same game again tomorrow turns out to be one.

  - node: quant-games.game-theory.nash
    hook: >
      "What's the equilibrium here" is the single most common question in this unit, and the correct first move is naming best response before anything else — everything downstream, mixed or pure, is one instance of the same fixed-point idea.
    explanation: >
      A strategy is a best response if nothing else a player could do pays more, holding every other player's choice fixed; a Nash equilibrium is a full profile where every player's piece is simultaneously a best response to everyone else's. Two ways of saying this are worth having cold: it's the only prediction that stays correct even after being announced to every player, since knowing the profile in advance gives nobody a reason to deviate, and it's the profile you could publish without regret, because no unilateral deviation would have paid better.
      Dominance and Nash equilibrium connect directly: if a profile consists entirely of dominant strategies, it's automatically a Nash equilibrium, since a strategy that beats everything beats the specific thing the opponent chose. Iterated elimination of strictly dominated strategies never removes a genuine equilibrium either, which is why checking for dominance first, as in the dominance node, never costs you the right answer.
      What Nash equilibrium does not promise is worth stating just as plainly: nothing about efficiency, since the prisoners' dilemma's unique equilibrium is strictly worse for both players than an unreachable alternative, and nothing about uniqueness — a game can have several equilibria with no ranking between them supplied by the definition itself.
    worked: >
      Take row strategies $U,D$ against column strategies $L,R$ with payoffs (row, column): $U$ vs $L$: $(3,2)$, $U$ vs $R$: $(1,1)$; $D$ vs $L$: $(0,0)$, $D$ vs $R$: $(2,3)$. Check $(U,L)$: the row player's alternative $D$ against $L$ pays $0$, worse than $3$, so no incentive to switch; the column player's alternative $R$ against $U$ pays $1$, worse than $2$, so no incentive there either — $(U,L)$ is a Nash equilibrium worth $(3,2)$. The identical check confirms $(D,R)$ is also an equilibrium, worth $(2,3)$: this game has two pure equilibria, exactly the non-uniqueness the definition allows.
    interview: >
      "Is this profile an equilibrium?" tests one specific check, run for every player in turn: fix everyone else, does this player have a strictly better alternative. "How many equilibria does this game have?" is listening for whether you assume uniqueness by default — don't.
    pitfalls: >
      Checking only one player's incentive to deviate and declaring victory — every player must be simultaneously unable to improve. Treating "the best outcome for both players" as automatically the equilibrium; efficiency is not part of the definition at all.
    recap: >
      A Nash equilibrium is a profile where every player's strategy is a best response to the rest — self-consistent once announced, but silent on efficiency and on uniqueness.
    dialogue:
      - part: A forecast that undoes itself
        teach: >
          Two venues each set a tick size — Fine, Medium or Coarse — without
          seeing the other's choice. Payoffs $(\text{row}, \text{column})$.
          Row Fine: $(2,2)$ against Fine, $(5,1)$ against Medium, $(0,0)$
          against Coarse. Row Medium: $(1,5)$, $(4,4)$, $(1,3)$. Row Coarse:
          $(0,0)$, $(3,1)$, $(3,3)$. An analyst publishes her forecast: both
          pick Medium, the cell with the largest total.
      - ask: >
          The row venue reads the forecast and believes the column venue will
          pick Medium. What is the most the row venue can earn by choosing its
          own row?
        expects: "5"
        feedback: >
          Against Medium, the row venue's options pay $5$ (Fine), $4$
          (Medium) and $3$ (Coarse). It switches to Fine and earns $5$, and the
          forecast is wrong the moment it is believed.
      - ask: >
          Can you settle the game the cheap way, by crossing out strictly
          dominated strategies?
        choices:
          - text: >
              Yes: Coarse is dominated by Fine for the row venue.
            feedback: >
              Against the column's Coarse, row Coarse pays $3$ and row Fine
              pays $0$. Fine does not win every column.
          - text: >
              No: every pair of strategies flips order against some opponent
              choice.
            correct: true
            feedback: >
              Fine beats Medium except against Coarse ($0 < 1$); Medium beats
              Coarse except against Coarse ($1 < 3$); Fine beats Coarse except
              against Coarse. The game is symmetric, so the column venue has
              nothing to cross out either.
          - text: >
              Yes: Medium is dominated, since nobody stays there.
            feedback: >
              Instability is not dominance. Against the column's Coarse, row
              Medium pays $1$ and row Fine pays $0$, so Fine does not dominate
              it.
        feedback: >
          Dominance settles nothing here. You need a test that a prediction
          can pass or fail on its own terms.
      - ask: >
          Test the forecast "both pick Coarse" the same way. If the row venue
          believes the column picks Coarse, what is the most it can earn?
        expects: "3"
        feedback: >
          Against Coarse the rows pay $0$, $1$ and $3$, so Coarse itself is
          best and the row venue stays. The game is symmetric, so the column
          venue, believing the row picks Coarse, stays too.
      - reflect: >
          "Both Medium" fell apart once announced; "both Coarse" did not.
          Say exactly what you checked, and for whom, that tells the two
          forecasts apart.
        answer: >
          For each venue in turn, hold the other's choice fixed at the
          forecast and ask whether any alternative of its own pays more. A
          forecast survives being announced only if the answer is no for
          every player at once. At "both Medium" the row venue gains $1$ by
          moving to Fine; at "both Coarse" neither venue gains by moving.
      - teach: >
          A strategy is a best response to the others' strategies when no
          alternative of yours pays more with theirs held fixed. A profile is
          a Nash equilibrium when every player's strategy is a best response
          to the rest: nobody gains by deviating alone. It is the prediction
          you could publish without anyone wanting to prove it wrong — a fixed
          point of everyone's best responses.

      - part: Every stable cell, and what they promise
        ask: >
          How many pure-strategy Nash equilibria does the tick-size game have?
        expects: "2"
        hint: >
          In each column, mark the row venue's best payoff; in each row, mark
          the column venue's best payoff. A cell marked twice is an
          equilibrium.
        feedback: >
          Row bests: Fine against Fine ($2$), Fine against Medium ($5$),
          Coarse against Coarse ($3$). Column bests, by symmetry: Fine against
          row Fine, Fine against row Medium, Coarse against row Coarse. The
          cells marked twice are (Fine, Fine) at $(2,2)$ and (Coarse, Coarse)
          at $(3,3)$.
      - ask: >
          Both venues prefer $(3,3)$ to $(2,2)$. Is (Fine, Fine) still an
          equilibrium?
        choices:
          - text: >
              No: both would rather be at (Coarse, Coarse), so they leave.
            feedback: >
              They would have to leave together. The row venue moving alone to
              Coarse earns $0$ against the column's Fine; Medium earns $1$.
              Both are worse than $2$.
          - text: >
              Yes: neither venue gains by switching alone, which is all the
              definition asks.
            correct: true
            feedback: >
              The definition tests one deviator at a time. A jointly better
              cell that needs two players to move together does not unsettle
              it.
          - text: >
              Only if it is the unique equilibrium.
            feedback: >
              Nothing in the definition mentions uniqueness. This game has two
              equilibria, and the definition does not rank them.
        feedback: >
          Equilibrium promises self-consistency and nothing more: not that the
          outcome is efficient — $(4,4)$ was not even stable — and not that it
          is unique.

      - part: Where the check goes wrong
        ask: >
          A candidate claims (Medium, Fine), paying $(1,5)$, is an
          equilibrium: "against row Medium, the column venue's best is Fine at
          $5$, so nobody wants to move." What is wrong?
        choices:
          - text: >
              Nothing; the column venue is at its best response.
            feedback: >
              The column venue is, but the row venue is not. Against the
              column's Fine, row Fine pays $2$, which beats the $1$ it gets
              from Medium.
          - text: >
              The row venue gains $1$ by switching to Fine.
            correct: true
            feedback: >
              The candidate checked one player. An equilibrium needs every
              player's deviation tested, and the row venue's fails.
          - text: >
              The total $1 + 5 = 6$ is less than the $8$ at (Medium, Medium).
            feedback: >
              Totals play no part in the definition; (Medium, Medium) has the
              larger total and is not an equilibrium. The flaw is the row
              venue's profitable switch.
        feedback: >
          The check is per player, every player: fix the others, scan your own
          alternatives. Skipping one player is the most common way to certify
          a cell that is not stable.
      - ask: >
          A different game, payoffs $(\text{row}, \text{column})$. Row $U$:
          $(2,0)$ against $L$, $(0,1)$ against $R$. Row $D$: $(0,3)$ against
          $L$, $(1,0)$ against $R$. How many pure-strategy Nash equilibria
          does it have?
        expects: "0"
        hint: >
          Start at any cell and let whoever gains by moving, move.
        feedback: >
          From $(U, L)$ the column moves to $R$ ($1 > 0$); from $(U, R)$ the
          row moves to $D$ ($1 > 0$); from $(D, R)$ the column moves to $L$
          ($3 > 0$); from $(D, L)$ the row moves to $U$ ($2 > 0$). The
          deviations chase each other round all four cells.
      - teach: >
          So a pure equilibrium can fail to exist, and when one exists there
          may be several, ranked or not. In an interview, test each candidate
          cell player by player, and when asked how many equilibria there are,
          mark best responses across the whole table rather than stopping at
          the first one found. Games like the last one need a new kind of
          strategy before anything is stable.

  - node: quant-games.game-theory.mixed-strategy
    hook: >
      The moment a matrix has no dominant strategy and every cell tempts someone to switch, the fix is randomizing your own play — quant desks call the result "balanced" or "unexploitable," and the machinery behind that word is exactly this node.
    explanation: >
      A mixed strategy is a probability distribution over a player's pure strategies, realized by private randomization the opponent never observes before acting. Payoffs against a mix are plain expectations: with row probabilities $p_i$, column probabilities $q_j$, and row payoffs $a_{ij}$, the row player's expected payoff is $\sum_{i,j} p_i a_{ij} q_j$ — linear in $p$ for fixed $q$, and linear in $q$ for fixed $p$, since mixing never interacts nonlinearly with the payoff numbers themselves.
      Linearity has one consequence worth internalizing before anything else: because expected payoff is a weighted average, the best mixed reply can never beat the best pure reply — it can only tie it. That forces the optimality condition used everywhere downstream: a mix is optimal exactly when every pure strategy receiving positive probability is itself already a best reply, tied with every other strategy in the mix. The set of strategies actually receiving positive weight is the support, and strategies outside it must pay strictly less, or including them would improve the mix.
    worked: >
      Take row payoffs $a_{UL}=4$, $a_{UR}=1$, $a_{DL}=2$, $a_{DR}=5$, and suppose the row player mixes $p=0.6$ on $U$ while the column player mixes $q=0.4$ on $L$. The row player's expected payoff is $pq(4) + p(1-q)(1) + (1-p)q(2) + (1-p)(1-q)(5) = 0.24(4)+0.36(1)+0.16(2)+0.24(5) = 0.96+0.36+0.32+1.2 = 2.84$. Nothing here claims these particular $p,q$ are optimal — the number just confirms the formula's mechanics: a weighted average over all four cells, nothing more exotic.
    interview: >
      "If you randomize 60/40, what's your expected payoff against this opponent?" wants the double sum computed directly; a sharper follow-up, "why would you ever put positive weight on a strategy that isn't your single best reply," is testing whether you know optimal mixes only ever include tied best replies.
    pitfalls: >
      Treating a mixed strategy as something the opponent can condition on in real time — it's private, so only the distribution, never the realized draw, factors into anyone else's decision. Confusing the support with the full strategy set; strategies outside the support are typically strictly worse, not merely unused by convention.
    recap: >
      Payoffs against a mix are linear weighted averages, so an optimal mix can only place weight on strategies that are themselves tied for best reply — the support.
    dialogue:
      - part: A server with a habit
        teach: >
          You serve to a receiver who must lean one way before you strike.
          Your payoff is points won per $10$ serves. Serve Wide: $4$ if she
          leans Wide, $8$ if she leans Body. Serve Body: $7$ if she leans
          Wide, $3$ if she leans Body. She is watching for patterns.
      - ask: >
          You always serve Wide. Once she notices, she leans accordingly. What
          do you earn?
        expects: "4"
        feedback: >
          She leans Wide every time and you win $4$ per $10$. Always serving
          Body is worse still: she leans Body and you win $3$.
      - ask: >
          Instead you flip a fair coin, out of her sight, before every serve:
          heads Wide, tails Body. If she leans Wide, what do you earn on
          average?
        expects: "5.5"
        feedback: >
          $\frac{1}{2}(4) + \frac{1}{2}(7) = 5.5$. If she leans Body instead,
          $\frac{1}{2}(8) + \frac{1}{2}(3) = 5.5$ as well. Whichever way she
          leans, the coin guarantees $5.5$ — more than either habit's $4$ or
          $3$.
      - ask: >
          Now suppose she can glimpse the coin before she leans. What happens?
        choices:
          - text: >
              Nothing changes: the coin is still fair, so you still average
              $5.5$.
            feedback: >
              She leans Wide on heads and Body on tails, so you earn $4$ on
              heads and $3$ on tails: $\frac{1}{2}(4) + \frac{1}{2}(3) = 3.5$.
              Fairness of the coin does not help if she reads it.
          - text: >
              You fall to $3.5$: she matches every serve.
            correct: true
            feedback: >
              Seen, the coin is just a schedule of pure serves, and she answers
              each one. Its value rests on her not knowing the draw.
          - text: >
              You rise above $5.5$, since she now knows which serve is coming
              and may freeze.
            feedback: >
              Knowledge only helps the one who has it. She leans the right
              way every time and you win $4$ or $3$.
        feedback: >
          The randomization has to be private. She may know the *odds* — that
          is part of the game — but never the draw.
      - reflect: >
          The coin is a strategy, and you just scored it. What do you need to
          write down to describe a strategy like it, and how would you score
          it against a receiver who also randomizes her lean?
        answer: >
          A probability for each pure serve — $p$ on Wide and $1 - p$ on Body.
          Against her probabilities $q$ and $1 - q$, the four cells occur
          with probabilities $pq$, $p(1-q)$, $(1-p)q$ and $(1-p)(1-q)$, and
          your score is the probability-weighted sum of the four payoffs: an
          expectation, priced exactly as you would price any random payoff.
      - teach: >
          That is a mixed strategy: a probability distribution over your pure
          strategies, drawn privately. With row probabilities $p_i$, column
          probabilities $q_j$ and row payoffs $a_{ij}$, the row player
          expects $\sum_{i,j} p_i a_{ij} q_j$, which is linear in your own
          probabilities once hers are fixed. The pure strategies you give
          positive weight are the support of your mix.

      - part: A mix against a mix
        ask: >
          You serve Wide with probability $0.3$; she leans Wide with
          probability $0.6$. What do you earn on average?
        expects: "5.46"
        tolerance: 0.005
        hint: >
          Four cells, each with probability (your weight) times (her weight).
        feedback: >
          $0.3(0.6)(4) + 0.3(0.4)(8) + 0.7(0.6)(7) + 0.7(0.4)(3)
          = 0.72 + 0.96 + 2.94 + 0.84 = 5.46$.
      - ask: >
          Hold her at $0.6$ on Wide. What do you earn by always serving Wide?
        expects: "5.6"
        tolerance: 0.005
        feedback: >
          $0.6(4) + 0.4(8) = 5.6$, while always serving Body earns
          $0.6(7) + 0.4(3) = 5.4$. Your mix's $5.46$ is
          $0.3(5.6) + 0.7(5.4)$: a weighted average of the two pure serves,
          with your own probabilities as the weights.

      - part: Can a mix beat the best pure serve
        ask: >
          A new receiver leans Wide $70\%$ of the time, and you know it.
          Against her, Wide earns $0.7(4) + 0.3(8) = 5.2$ and Body earns
          $0.7(7) + 0.3(3) = 5.8$. Could some mix of Wide and Body earn more
          than $5.8$?
        choices:
          - text: >
              Yes: mixing keeps her guessing, which is worth something.
            feedback: >
              She is not adapting; her $70\%$ is fixed. Against a fixed
              opponent, keeping her guessing earns nothing.
          - text: >
              No: a mix earns a weighted average of $5.2$ and $5.8$.
            correct: true
            feedback: >
              Putting $p$ on Wide earns $5.2p + 5.8(1-p)$, which is largest at
              $p = 0$. Every weight on Wide costs $0.6$ per unit.
          - text: >
              Yes: the fair coin guaranteed $5.5$ against anything, which a
              habit never did.
            feedback: >
              A guarantee is not a best reply. Against this receiver the coin
              earns $\frac{1}{2}(5.2) + \frac{1}{2}(5.8) = 5.5$, below Body's
              $5.8$. The coin's virtue was protection against a receiver who
              adapts, and this one does not.
        feedback: >
          Linearity again: against fixed opponent probabilities, your expected
          payoff is a weighted average of your pure strategies' payoffs.
      - reflect: >
          So when could it ever be optimal to put positive weight on Wide?
          Say it as a condition on the two pure serves.
        answer: >
          Only when Wide is itself a best reply — when it ties Body for the top
          payoff against her mix. If Wide earned less, moving its weight to
          Body would raise the average. So an optimal mix puts weight only on
          pure strategies tied for best, and anything outside the support
          earns no more than they do.
      - teach: >
          That is the working consequence of linearity: the best mixed reply
          is worth exactly as much as the best pure reply, and a mix is
          optimal precisely when every strategy in its support is itself a
          best reply.
      - ask: >
          At what lean probability $q$ on Wide does Wide earn exactly what
          Body earns?
        expects: "5/8"
        hint: >
          Set $4q + 8(1-q)$ equal to $7q + 3(1-q)$.
        feedback: >
          $8 - 4q = 3 + 4q$, so $q = 5/8$, and both serves earn
          $4(5/8) + 8(3/8) = 5.5$.
      - ask: >
          Against a receiver leaning Wide with probability exactly $5/8$,
          which of your strategies are optimal?
        choices:
          - text: >
              Only the fair coin, since it guaranteed $5.5$ earlier.
            feedback: >
              The coin earns $5.5$, but so does always serving Wide, and so
              does any other mix: every one is an average of two $5.5$s.
          - text: >
              Every mix of Wide and Body, pure serves included.
            correct: true
            feedback: >
              Both pure serves are best replies, so any weights on them are
              optimal. Against this lean you have no reason to prefer one
              mix — a fact the next lessons put to work.
          - text: >
              None: there is no best reply when the two serves tie.
            feedback: >
              A tie means several best replies, not none. Each earns $5.5$, and
              nothing earns more.
        feedback: >
          When the support's strategies tie, the weights are free from your
          own point of view. What pins them down has to come from somewhere
          else — from what your weights do to the other side.

  - node: quant-games.game-theory.nash-existence
    hook: >
      "Does this game even have an equilibrium?" is a real question worth two seconds of thought before diving into algebra, and the honest answer for any finite game is yes — immediately followed by "but that doesn't tell us what it is."
    explanation: >
      Nash's theorem guarantees that every game with finitely many players, each holding finitely many pure strategies, has at least one Nash equilibrium once mixed strategies are allowed. The proof applies Kakutani's fixed-point theorem to the best-response correspondence defined on the product of the players' probability simplices — a compact, convex domain mapped to nonempty, convex sets by a correspondence that behaves continuously enough for the fixed-point argument to bite. A fixed point of that correspondence is, by construction, a profile where everyone is simultaneously best-responding to everyone else, which is exactly a Nash equilibrium.
      The theorem is a pure existence statement: it names no algorithm, so finding the guaranteed equilibrium is always separate work, typically the indifference reasoning built next in this unit. It also buys nothing beyond existence — a game can have many equilibria or exactly one, and none of them are guaranteed efficient, so "an equilibrium exists" answers a narrower question than it might sound like.
    worked: >
      Consider a game with $3$ players, each holding $4$ pure strategies — a genuinely large object, with $4^3 = 64$ strategy profiles in total. Nash's theorem guarantees at least one of those $64$ profiles' worth of mixed-strategy space contains an equilibrium, regardless of how the payoffs are actually filled in, as long as every player's strategy set stays finite. Swapping in a continuous strategy space, like a price chosen from an interval, drops the hypothesis the theorem needs and existence has to be argued separately.
    interview: >
      "Does this game have an equilibrium?" wants "yes, by Nash's theorem, since it's finite" stated immediately, with a same-breath follow-up that existence doesn't hand you the equilibrium itself — interviewers are checking that you don't confuse the two.
    pitfalls: >
      Assuming the guaranteed equilibrium is pure; the theorem only promises one in mixed strategies, and pure equilibria can genuinely fail to exist. Applying the theorem to a game with an infinite or continuous strategy space without checking that the finiteness hypothesis actually holds.
    recap: >
      Every finite game has a mixed Nash equilibrium by a fixed-point argument — an existence guarantee only, with no construction, no uniqueness, and no efficiency attached.
    dialogue:
      - part: An audit with nowhere to rest
        teach: >
          A trader decides whether to Comply or Cheat on a reporting rule; an
          auditor, without seeing that choice, decides whether to Inspect or
          Skip. Payoffs $(\text{trader}, \text{auditor})$. Cheat: $(-4, 2)$
          if inspected, $(3, -3)$ if skipped. Comply: $(0, -1)$ if inspected,
          $(0, 0)$ if skipped — an inspection that finds nothing costs the
          auditor $1$.
      - ask: >
          How many pure-strategy Nash equilibria does the audit game have?
        expects: "0"
        hint: >
          Start at (Comply, Skip) and let whoever gains by moving alone, move.
        feedback: >
          At (Comply, Skip) the trader cheats ($3 > 0$); at (Cheat, Skip) the
          auditor inspects ($2 > -3$); at (Cheat, Inspect) the trader complies
          ($0 > -4$); at (Comply, Inspect) the auditor skips ($0 > -1$).
          Round and round, no cell stable.
      - ask: >
          The auditor tries inspecting at random, half the time. What does
          Cheat now earn the trader on average?
        expects: "-0.5"
        feedback: >
          $\frac{1}{2}(-4) + \frac{1}{2}(3) = -0.5$, below Comply's $0$. The
          trader never cheats — and then every inspection is a wasted $1$, so
          the auditor wants to inspect less.
      - ask: >
          What inspection probability leaves the trader exactly indifferent
          between Cheat and Comply?
        expects: "3/7"
        hint: >
          Cheat earns $-4i + 3(1 - i)$ when the auditor inspects with
          probability $i$; Comply earns $0$ regardless.
        feedback: >
          $3 - 7i = 0$ gives $i = 3/7$. Below that cheating pays, above it
          complying does.
      - ask: >
          What cheating probability leaves the auditor exactly indifferent
          between Inspect and Skip?
        expects: "1/6"
        hint: >
          With cheating probability $c$, Inspect earns $2c - (1 - c)$ and Skip
          earns $-3c$.
        feedback: >
          $3c - 1 = -3c$ gives $c = 1/6$. Both of the auditor's options then
          earn $-1/2$.
      - ask: >
          Is the profile "trader cheats with probability $1/6$, auditor
          inspects with probability $3/7$" a Nash equilibrium?
        choices:
          - text: >
              No: the trader would rather Comply for sure, since Comply is
              never punished.
            feedback: >
              Against $i = 3/7$, Comply earns $0$ and Cheat earns
              $3 - 7(3/7) = 0$. Complying for sure earns $0$, no more than the
              mix. No gain from deviating.
          - text: >
              Yes: each side's two pure options tie, so each side's mix is a
              best reply.
            correct: true
            feedback: >
              Against $i = 3/7$ every trader mix earns $0$; against $c = 1/6$
              every auditor mix earns $-1/2$. Nobody can gain by moving alone.
          - text: >
              It cannot be, because the game has no equilibrium.
            feedback: >
              It has no *pure* equilibrium. Once mixes are allowed, this
              profile passes the deviation test for both players.
        feedback: >
          Mixing created a resting point where none of the four cells was one.
          Each player's randomness is exactly what makes the other willing to
          randomize.

      - part: Why there is always one
        reflect: >
          You found the resting point by solving two equations. Why should one
          exist in every finite game, even one far too big to solve by hand?
          Think of best responses as a map that sends each profile to the
          profiles everyone would rather play against it.
        hint: >
          What is an equilibrium, in terms of that map?
        answer: >
          An equilibrium is a profile the best-response map sends back to
          itself: a fixed point. With mixes allowed, each player's strategies
          fill a simplex — a solid, convex, bounded shape — and wherever a
          best response would flip from one strategy to another, every blend
          in between is a best response too, so the map has no gaps to jump
          across. That is enough for a fixed-point theorem. On the four pure
          cells there is no room
          in between, and the audit game's map simply cycles.
      - teach: >
          Nash's theorem: every game with finitely many players, each with
          finitely many pure strategies, has at least one Nash equilibrium in
          mixed strategies. The proof applies Kakutani's fixed-point theorem
          to the best-response correspondence on the product of the players'
          probability simplices: a compact convex set, mapped to nonempty
          convex sets, continuously enough. It proves existence and constructs
          nothing.
      - ask: >
          Which property, missing from pure strategies, does the fixed-point
          argument need?
        choices:
          - text: >
              Convexity: the set of strategies must contain every blend of its
              members.
            correct: true
            feedback: >
              Between Inspect and Skip there is nothing among pure strategies,
              so best responses can only jump from one corner to another — and
              jumps can cycle forever. The simplex fills in the blends.
          - text: >
              Uniqueness: each player must have exactly one best response.
            feedback: >
              At a tie a player has a whole interval of best responses, and the
              argument allows that. What it needs is that each set of best
              responses has no gaps — convexity again.
          - text: >
              Symmetry between the players.
            feedback: >
              The audit game is not symmetric and still has an equilibrium.
              Nash's theorem places no symmetry requirement on the game.
        feedback: >
          Mixing is part of the definition rather than a refinement because
          without it existence fails, exactly as the four cells showed.

      - part: What the guarantee does not cover
        ask: >
          A new game: two players each name a whole number, and whoever names
          the larger wins $1$ from the other, with $0$ on a tie. Your opponent
          names $1{,}000{,}000$. What does your best reply earn?
        expects: "1"
        feedback: >
          Name $1{,}000{,}001$ and win $1$. Against any mix over numbers,
          naming something large enough wins with probability as close to $1$
          as you like. Each side can push its payoff toward $1$, and both
          cannot get there at once, so no profile is stable.
      - ask: >
          The bigger-number game has no equilibrium even in mixed strategies.
          Why does Nash's theorem not rule that out?
        choices:
          - text: >
              Ties pay $0$, and the theorem needs strict preferences.
            feedback: >
              The theorem puts no condition on ties or on how the payoffs
              compare. Any finite game qualifies, ties and all; this one is
              not finite.
          - text: >
              Each player has infinitely many pure strategies, so the
              hypothesis fails.
            correct: true
            feedback: >
              The theorem needs finite strategy sets. Here a best reply always
              lies further out, and no compact simplex contains the play.
          - text: >
              Its payoffs are not cardinal.
            feedback: >
              Payoffs of $1$, $0$ and $-1$ are ordinary numbers, and averages
              of them are meaningful. The failure is in the strategy sets.
        feedback: >
          Check finiteness before quoting the theorem. With infinitely many
          strategies existence has to be argued separately, and sometimes it is
          false.
      - ask: >
          A colleague says: "By Nash's theorem, the trader in the audit game
          cheats $1/6$ of the time." What is wrong with that sentence?
        choices:
          - text: >
              Nothing; the theorem produced the $1/6$.
            feedback: >
              The theorem only said some equilibrium exists. The $1/6$ came
              from solving the auditor's indifference equation by hand.
          - text: >
              The theorem promises existence only; finding the equilibrium,
              and whether it is unique, is separate work.
            correct: true
            feedback: >
              Right. Existence, then computation, then the question of whether
              there are others — three different claims, and the theorem makes
              only the first.
          - text: >
              The theorem guarantees a pure equilibrium, so it says the trader
              never randomizes.
            feedback: >
              The audit game has no pure equilibrium at all; the guarantee is
              in mixed strategies. When a pure one exists, it counts as a mix
              putting all weight on one strategy.
        feedback: >
          Said aloud: "Yes, an equilibrium exists — the game is finite, so
          Nash's theorem applies. That doesn't tell us what it is, whether it
          is pure, or whether it is the only one." Then go and find it.

  - node: quant-games.game-theory.mixed-indifference
    hook: >
      "How often should you bluff in this spot" is the canonical open-ended prompt this technique answers, and the four-step recipe recited cleanly is worth more than any single memorized number.
    explanation: >
      Since an optimal mix can only place weight on strategies tied for best reply, every strategy in a player's support must earn exactly the same expected payoff against whatever the opponent does — that shared number is what "indifference" means here. The step that trips people up is whose payoffs go into the equation: to solve for your own mixing probabilities, you write the indifference condition using the opponent's payoffs, not yours, because it's the opponent who must be left unable to prefer one of their own strategies over another, and their preferences are governed entirely by their own numbers.
      The recipe: guess a support, usually every strategy available; write one indifference equation per opponent strategy in that support, built from the opponent's payoffs as a function of your probabilities; solve for your probabilities; then check two things — every solved probability lies in $[0,1]$, and no strategy you excluded from the support would actually beat the common equilibrium value. A negative or out-of-range probability doesn't mean you made an arithmetic error — it means the guessed support was wrong, and the fix is dropping that strategy and re-solving with a smaller support.
    worked: >
      Two firms each choose to Escalate a price war or Hold, with payoffs (row, column): Escalate vs Escalate: $(0,0)$; Escalate vs Hold: $(3,1)$; Hold vs Escalate: $(1,3)$; Hold vs Hold: $(2,2)$. To find $p$, the row firm's probability of escalating, write the column firm's indifference using column's own payoffs: column's expected payoff from Escalate is $p(0)+(1-p)(3)=3(1-p)$, from Hold is $p(1)+(1-p)(2)=2-p$. Setting them equal: $3(1-p)=2-p$ gives $p=1/2$; by the matrix's symmetry the column firm also escalates with probability $1/2$, and each firm's expected payoff at equilibrium is $3(1-1/2)=1.5$.
    interview: >
      "Walk me through computing a mixed equilibrium" wants the four steps named explicitly, in order; "how often should you bluff here" is this exact technique dressed as a poker question, and the interviewer is listening for whose payoffs go into the equations.
    pitfalls: >
      Writing the indifference equation from your own payoffs instead of the opponent's — the single most common reversal, and it produces numbers that look plausible but solve the wrong problem. Forgetting to verify a solved probability actually lands in $[0,1]$, or that no excluded strategy secretly beats the common value.
    recap: >
      Mix to make the opponent indifferent across their support, solved from their payoffs, then check every probability lands in $[0,1]$ and no excluded strategy beats the common value.
    dialogue:
      - part: A coin that does not hold up
        teach: >
          Ana picks Top or Bottom while Ben picks Left or Right, neither seeing
          the other. Payoffs $(\text{Ana}, \text{Ben})$. Top: $(5,1)$ against
          Left, $(2,3)$ against Right. Bottom: $(1,6)$ against Left, $(4,2)$
          against Right. Every cell tempts someone to switch, so Ana decides
          to be unpredictable and flips a fair coin.
      - ask: >
          Ben knows Ana's coin is fair. What does his best reply earn him?
        expects: "3.5"
        hint: >
          Price Left and Right against a $\frac{1}{2}$–$\frac{1}{2}$ Ana.
        feedback: >
          Left earns $\frac{1}{2}(1) + \frac{1}{2}(6) = 3.5$ and Right earns
          $\frac{1}{2}(3) + \frac{1}{2}(2) = 2.5$, so Ben plays Left and earns
          $3.5$.
      - ask: >
          Ben now plays Left for sure, and against Left Ana's coin earns $3$
          while Top alone earns $5$. The coin has unravelled. For Ben to be
          willing to randomize at all, what must Ana's mix do?
        choices:
          - text: >
              Make Ana herself indifferent between Top and Bottom.
            feedback: >
              Ana's indifference depends on what Ben does, not on her own
              mix. Her mix can only move Ben's payoffs, and Ben will mix only
              if his two options pay the same.
          - text: >
              Be as close to $\frac{1}{2}$–$\frac{1}{2}$ as possible.
            feedback: >
              The fair coin is what just failed: it left Ben a full point
              better off on Left. Unpredictable to a human is not the same as
              unexploitable.
          - text: >
              Make Ben's Left and Right earn him exactly the same.
            correct: true
            feedback: >
              A mix is optimal only when every strategy in it is a best reply.
              Ben's two columns are both best replies only when they tie
              against Ana's mix.
          - text: >
              Earn Ana as much as possible against Ben's current choice.
            feedback: >
              Against Ben's current Left that means Top for sure — and then Ben
              switches to Right. Chasing the current choice is the cycle you
              are trying to escape.
        feedback: >
          A mixed resting point needs each player's mix to leave the other
          with nothing to choose between.
      - reflect: >
          So whose payoff numbers determine Ana's probabilities? Write the
          equation that pins down $p$, her probability of Top, before solving
          it.
        answer: >
          Ben's. With Ana on Top with probability $p$, Ben's Left earns
          $1 \cdot p + 6(1 - p)$ and his Right earns $3p + 2(1 - p)$, and the
          equation sets these equal. Ana's own $5$, $2$, $1$, $4$ appear
          nowhere: she mixes to neutralize Ben, so Ben's numbers set her
          weights.
      - teach: >
          That is the indifference principle: in a mixed equilibrium, every
          pure strategy in a player's support earns the same against the
          opponent's mix, and nothing outside the support earns more. The
          recipe: guess the supports, usually everything; write one
          indifference equation per opponent strategy in their support, in
          the opponent's payoffs; solve for your probabilities; check they lie
          in $[0,1]$ and that no excluded strategy beats the common value.

      - part: Running the recipe
        ask: >
          Solve Ben's indifference. With what probability does Ana play Top?
        expects: "2/3"
        feedback: >
          $6 - 5p = 2 + p$, so $p = 2/3$. Check: Ben's Left earns
          $\frac{2}{3}(1) + \frac{1}{3}(6) = 8/3$, and his Right earns
          $\frac{2}{3}(3) + \frac{1}{3}(2) = 8/3$.
      - ask: >
          Now the other side. With what probability does Ben play Left?
        expects: "1/3"
        hint: >
          Ben's probability $q$ must leave Ana indifferent, so it comes from
          Ana's payoffs.
        feedback: >
          Ana's Top earns $5q + 2(1 - q) = 2 + 3q$ and her Bottom earns
          $q + 4(1 - q) = 4 - 3q$. Setting them equal gives $q = 1/3$.
      - ask: >
          A candidate solves $5q + 2(1-q) = q + 4(1-q)$, gets $1/3$, and
          announces "Ana plays Top with probability $1/3$." What went wrong?
        choices:
          - text: >
              An arithmetic slip; the equation is right.
            feedback: >
              The arithmetic is fine — $1/3$ solves that equation. The
              equation is about Ana's payoffs, so its solution is Ben's
              probability.
          - text: >
              He wrote the equation from Ana's own payoffs, which pins down
              Ben's mix, not hers.
            correct: true
            feedback: >
              The single most common reversal. Ana's numbers decide what Ben
              must do to keep her indifferent; Ana's mix is set by Ben's
              numbers and is $2/3$.
          - text: >
              Nothing: in a $2 \times 2$ game both players mix the same way.
            feedback: >
              Only in a game whose payoffs are symmetric. Here Ana plays Top
              $2/3$ of the time and Ben plays Left $1/3$ of the time.
        feedback: >
          Your mix is dictated by their payoffs. Say it to yourself before
          writing either equation.
      - ask: >
          What does Ana earn on average in the mixed equilibrium?
        expects: "3"
        hint: >
          Any strategy in her support earns the common value.
        feedback: >
          Against $q = 1/3$, Top earns $2 + 3(1/3) = 3$ and Bottom earns
          $4 - 3(1/3) = 3$. Indifference hands you the value for free: price
          any one pure strategy in the support.

      - part: When the algebra says no
        teach: >
          A new game. Ana's payoffs are irrelevant for a moment; Ben's are
          $4$ from Left and $1$ from Right when Ana plays Top, $3$ from Left
          and $2$ from Right when she plays Bottom.
      - ask: >
          Run the recipe anyway with full supports. Solve Ben's indifference
          for $p$, Ana's probability of Top.
        expects: "-1/2"
        hint: >
          Left earns $4p + 3(1-p)$ and Right earns $p + 2(1-p)$.
        feedback: >
          $3 + p = 2 - p$ gives $p = -1/2$, which is not a probability.
      - ask: >
          What is the negative probability telling you?
        choices:
          - text: >
              You made an arithmetic mistake; recheck the equation.
            feedback: >
              The equation and its solution are right. No $p$ in $[0,1]$
              makes Ben indifferent, because Left pays him more than Right
              whatever Ana does: $4 > 1$ and $3 > 2$.
          - text: >
              The support guess was wrong: Right is never a best reply for
              Ben, so drop it and re-solve.
            correct: true
            feedback: >
              Left strictly dominates for Ben, so he plays it for sure and Ana
              simply best-responds to Left. A probability outside $[0,1]$
              always means a strategy in the guessed support does not belong
              there.
          - text: >
              The game has no equilibrium.
            feedback: >
              Every finite game has one. This game has a pure equilibrium,
              and the full-support guess was looking for a mixed one that does
              not exist.
        feedback: >
          Step four of the recipe is not decoration. Check that every solved
          probability lies in $[0,1]$ — and when you shrink a support, check
          the dropped strategy does not beat the common value. In an interview,
          "I mix to make you indifferent, so your payoffs set my odds" is the
          sentence they are listening for.

  - node: quant-games.game-theory.matching-pennies
    hook: >
      The recognition trick matters more than the arithmetic: no dominant strategy and every pure cell inviting the loser to switch is the signature of a game with no pure equilibrium at all, and matching pennies is the cleanest instance to pattern-match against.
    explanation: >
      What makes a pure profile unstable here is a cycle: whichever player is currently losing strictly prefers to flip, which then makes the other player want to flip, which makes the first player want to flip back — no cell survives a single round of "does either side want to deviate." That cyclic structure, not the specific $\pm 1$ payoffs, is the actual signature to watch for; it appears in rock–paper–scissors, in soccer penalty-kick direction, in any head-to-head guessing contest with strictly opposed interests.
      The mental model worth keeping precise is that an equilibrium mix here is defensive, not aggressive: it guarantees the equilibrium value against any opponent play whatsoever, but it does nothing to punish a biased opponent, since deliberately exploiting a known bias means deviating from the equilibrium mix on purpose. "Unexploitable" and "exploiting" are opposite postures, and confusing them is the most common practical mistake once the equilibrium arithmetic is understood.
      The symmetric $1/2$–$1/2$ and $1/3$-each answers are special to symmetric payoffs — when the payoffs aren't symmetric, the equilibrium mix isn't $1/2$ either, and has to be rederived from indifference rather than pattern-matched.
    worked: >
      Take an asymmetric version: row payoffs are $+4$ if $H$ matches $H$, $-1$ if $H$ meets $T$, $-2$ if $T$ meets $H$, $+1$ if $T$ matches $T$, with the column player taking the opposite. Column's indifference, as a function of row's probability $p$ of playing $H$: from playing $H$, $-4p+2(1-p)=2-6p$; from playing $T$, $p-(1-p)=2p-1$. Setting these equal gives $p=3/8$. The mirrored computation for row's indifference gives $q=1/4$ for column's probability of $H$, and the game's value works out to $0.25$ to the row player — asymmetric payoffs shift both probabilities away from $1/2$ and make the value nonzero, unlike the symmetric case.
    interview: >
      "Rock–paper–scissors against a strong opponent — what do you play?" wants "uniform $1/3$, unexploitable, value $0$" said instantly; the sharper follow-up, "what if the payoffs aren't symmetric," is testing whether you can rederive the mix from indifference rather than reciting $1/2$.
    pitfalls: >
      Pattern-matching $1/2$–$1/2$ or uniform-$1/n$ onto any two-strategy conflict game without checking the payoffs are actually symmetric — asymmetric payoffs move the equilibrium mix and its value, as above. Confusing the equilibrium mix, a guarantee against any play, with a strategy meant to exploit a known biased opponent, which requires deliberately deviating from equilibrium.
    recap: >
      No pure profile survives the cyclic "loser wants to flip" check in matching-pennies-shaped games; the equilibrium mix is $1/2$ only when the payoffs are symmetric, and it guarantees the value without ever exploiting anyone.
    dialogue:
      - part: Odds and evens for a dollar
        teach: >
          You and a colleague each hold out one or two fingers at the same
          moment. If the total is even you win $1$; if it is odd you lose $1$.
          You are Evens, so you want to match; he wants to mismatch.
      - ask: >
          Is there a pair of choices that neither of you would want to change
          after seeing the other's?
        choices:
          - text: >
              Yes: both show one finger, since the game is symmetric.
            feedback: >
              At one–one you win and he loses $1$. Seeing that, he switches to
              two and wins instead.
          - text: >
              No: in every cell the loser gains $2$ by switching alone.
            correct: true
            feedback: >
              Whoever loses $1$ can turn it into a win of $1$ by changing his
              finger count. No pure pair is stable.
          - text: >
              Yes: one each and two each are both stable, since you win
              there.
            feedback: >
              You are happy there; he is not. Stability needs both players
              unwilling to move, and the loser always wants to.
        feedback: >
          Pure play cycles forever. Any resting point has to be a mix.
      - ask: >
          You show one finger with probability $0.7$, and he knows it. What
          does his best reply earn him per round?
        expects: "0.4"
        hint: >
          He wins whenever the total is odd. Which count makes that most
          likely?
        feedback: >
          He shows two, mismatching your one-finger $70\%$ of the time:
          $0.7(1) + 0.3(-1) = 0.4$ per round.
      - reflect: >
          What probability of one finger leaves him nothing to exploit — and
          can you say it before writing any equation?
        hint: >
          Swap the words "one" and "two" everywhere. Does the game change?
        answer: >
          One half. Relabelling the two counts leaves the game exactly as it
          was, so any mix you could defend must be unchanged by the swap too,
          and only $\frac{1}{2}$–$\frac{1}{2}$ is. The indifference equation
          agrees: against your $p$, his one-finger earns $1 - 2p$ and his
          two-finger earns $2p - 1$, equal only at $p = \frac{1}{2}$.
      - teach: >
          This is matching pennies, the canonical game with no pure
          equilibrium. Each side mixes $\frac{1}{2}$–$\frac{1}{2}$, and since
          every outcome is then a fair coin flip of $+1$ or $-1$, the game is
          worth $0$ to both. Neither player can do better than $0$ against the
          other's mix, and neither can be held below it.

      - part: Three throws instead of two
        ask: >
          Rock–paper–scissors, a win paying $1$, a loss $-1$ and a tie $0$.
          What probability on Rock leaves your opponent indifferent among all
          three throws?
        expects: "1/3"
        hint: >
          Relabel Rock to Paper to Scissors to Rock. What does the game look
          like?
        feedback: >
          Against your $r, p, s$, her Rock earns $s - p$, her Paper $r - s$,
          her Scissors $p - r$. All three are equal only when $r = p = s =
          1/3$, and then each earns $0$. Symmetry gives the same answer at a
          glance.
      - ask: >
          You throw uniformly. Your opponent throws Scissors half the time and
          Rock and Paper a quarter each. What do you earn per round on
          average?
        expects: "0"
        feedback: >
          Against your uniform mix every one of her throws earns $0$, so any
          mix of them does too: your expected payoff is exactly $0$ whatever
          she does.
      - ask: >
          Against that same opponent, what does your best single throw earn
          per round?
        expects: "0.25"
        tolerance: 0.005
        hint: >
          Price Rock, Paper and Scissors separately against her $0.25$,
          $0.25$, $0.5$.
        feedback: >
          Rock beats her Scissors ($0.5$), loses to her Paper ($0.25$):
          $0.5 - 0.25 = 0.25$. Paper earns $0.25 - 0.5 = -0.25$ and Scissors
          $0.25 - 0.25 = 0$. Always throwing Rock earns $0.25$ a round.

      - part: Unexploitable is not exploiting
        ask: >
          You know her habit. Which statement is right?
        choices:
          - text: >
              Stay uniform: the equilibrium mix is optimal against everyone.
            feedback: >
              It is *safe* against everyone, earning $0$ whatever she does. It
              is not optimal against her: Rock earns $0.25$ a round more.
          - text: >
              Throw Rock, knowing that this exposes you if she adapts.
            correct: true
            feedback: >
              Exploiting her means leaving equilibrium. Always-Rock is beaten
              by Paper, so the edge lasts only while her habit does.
          - text: >
              Throw Scissors, to match her favourite throw.
            feedback: >
              Matching ties. Against her Scissors-heavy mix, Scissors earns
              $0.25(1) - 0.25(1) = 0$, no better than uniform.
        feedback: >
          The equilibrium mix guarantees the value and no more. Beating a known
          bias means stepping off it, and taking on the risk that comes back.
      - teach: >
          Back to fingers, with a change: you win $3$ when both show one, $1$
          when both show two, and still lose $1$ on any mismatch. The swap of
          "one" and "two" no longer leaves the game unchanged.
      - ask: >
          With what probability do you show one finger now?
        expects: "1/3"
        hint: >
          Your probability is set by his payoffs: his one-finger earns
          $-3p + (1-p)$, his two-finger earns $p - (1-p)$.
        feedback: >
          $1 - 4p = 2p - 1$ gives $p = 1/3$. His mirrored computation gives
          him one finger with probability $1/3$ as well, and the game is worth
          $3(1/3) - (2/3) = 1/3$ to you.
      - ask: >
          One finger carries your big win of $3$, yet you show it less often.
          Why?
        choices:
          - text: >
              You are hedging: big wins are risky, so you play them less.
            feedback: >
              Payoffs are utilities and risk is already priced into them.
              The reason is about his incentives, not your appetite.
          - text: >
              Your mix must leave him indifferent, and he dreads one–one more,
              so it takes less weight there to deter his one finger.
            correct: true
            feedback: >
              One–one costs him $3$. A small chance of it already makes his
              one finger as bad as his two finger. Your odds are set by his
              losses.
          - text: >
              It is a slip; you should show one finger more often to collect
              the $3$.
            feedback: >
              Show one finger more often and he simply shows two, collecting
              $1$ from you on every mismatch. That is the coin that unravels.
        feedback: >
          Symmetry is a shortcut, not a law: the $\frac{1}{2}$ and the
          $\frac{1}{3}$ hold only when relabelling leaves the game unchanged.
          When it does not, solve the indifference equations, in the
          opponent's payoffs.

  - node: quant-games.game-theory.battle-of-sexes
    hook: >
      "Two people need to agree on something without talking" is the coordination-with-conflicting-preferences shape — product launch timing, a meeting slot, a market convention — and the tell is two pure equilibria plus a mixed one that both players like less than either.
    explanation: >
      This shape differs from matching pennies in the one fact worth contrasting directly: there, mixing is unavoidable and optimal, since no pure profile is stable at all; here, two perfectly good pure equilibria exist, and the mixed equilibrium is the outcome of failing to coordinate on either one. Each player's own mixing probability is pinned down by the indifference principle applied to the other player's payoffs, exactly as before, which produces the specific and slightly counterintuitive fact that how often you play your own preferred option depends entirely on the other player's numbers, not the strength of your own preference.
      Because the mixed equilibrium leaves real probability on the miscoordination outcomes — where the two players pick different venues and both get nothing — its expected payoff to each player is strictly worse than either pure equilibrium's payoff. That gap is the whole practical lesson: absent communication, a convention, or some way to signal ahead of time, rational play alone doesn't select one of the good outcomes; it can land on the worse, self-inflicted one instead.
    worked: >
      Two coworkers pick Morning or Afternoon for a meeting, payoffs (first coworker, second): Morning vs Morning: $(3,1)$; Morning vs Afternoon: $(0,0)$; Afternoon vs Morning: $(0,0)$; Afternoon vs Afternoon: $(1,4)$. Let $p$ be the first coworker's probability of Morning: the second coworker's indifference gives $p = 4(1-p)$, so $p=4/5$. Let $q$ be the second coworker's probability of Morning: the first coworker's indifference gives $3q=1-q$, so $q=1/4$. Miscoordination probability is $p(1-q)+(1-p)q = (4/5)(3/4)+(1/5)(1/4) = 13/20$, and each coworker's expected payoff falls to $0.75$ and $0.8$ respectively — both below what either pure equilibrium would have paid them.
    interview: >
      "What happens if they can't talk to each other first?" wants recognition of the multiple equilibria plus the inferior mixed outcome, and the practical point that real coordination usually relies on a focal point, a stated convention, or someone committing first to pick one of the good equilibria instead of leaving it to chance.
    pitfalls: >
      Assuming the mixed equilibrium is a "fair" $50$–$50$ split — it's whatever probability makes the other player indifferent, generally asymmetric and rarely $1/2$. Treating the mixed equilibrium as efficient because it's an equilibrium at all; here it's strictly worse for both players than either pure alternative.
    recap: >
      Battle of the sexes has two good pure equilibria and one mixed equilibrium that both players like less, with each player's own mixing probability set entirely by the other's payoff numbers.
    dialogue:
      - part: Two pubs and no phones
        teach: >
          After work Cleo and Dev each head to a pub, Harbour or Station, with
          no way to message each other. They want to end up together, but not
          equally. Payoffs $(\text{Cleo}, \text{Dev})$: both at Harbour,
          $(4,2)$; both at Station, $(1,3)$; apart, $(0,0)$.
      - ask: >
          How many pure-strategy Nash equilibria does the game have?
        expects: "2"
        feedback: >
          Both at Harbour and both at Station. At either, a lone switch leaves
          the switcher alone with $0$. The two mismatched cells are not
          stable: each player there gains by joining the other.
      - ask: >
          Which equilibrium will they land on?
        choices:
          - text: >
              Both at Harbour: its total, $6$, beats Station's $4$.
            feedback: >
              Dev gets $3$ at Station and only $2$ at Harbour. Totals are no
              one's payoff, and nothing in the game makes Dev give way.
          - text: >
              Both at Station, since Dev's preference is the stronger one.
            feedback: >
              Cleo's preference is the stronger one, $4$ against $1$. Either
              way, nothing in the game converts the size of a preference into
              a reason for the other to yield.
          - text: >
              The game does not say: each prefers a different equilibrium and
              nothing selects one.
            correct: true
            feedback: >
              Two equilibria, ranked oppositely by the two players. Without a
              convention or a message, the definition gives no way to choose.
        feedback: >
          Multiple equilibria with conflicting preferences is the whole point
          of this game. Without a way to coordinate, each may end up
          randomizing.
      - reflect: >
          Suppose both randomize. Before any algebra: whose numbers decide
          how often Cleo goes to Harbour — and will each of them go to their
          own favourite pub more or less than half the time?
        answer: >
          Cleo's mix must leave Dev indifferent, so it is set by Dev's numbers,
          $2$ and $3$; Dev's mix is set by Cleo's, $4$ and $1$. Dev slightly
          prefers Station, so Cleo needs a bit more than half on Harbour to
          make him indifferent; Cleo strongly prefers Harbour, so Dev needs
          only a little Harbour to make her indifferent. Each ends up at their
          own favourite more often than not — which is why they keep missing.

      - part: Each side solved from the other's numbers
        ask: >
          With what probability does Cleo go to Harbour?
        expects: "3/5"
        hint: >
          Dev earns $2p$ from Harbour and $3(1-p)$ from Station.
        feedback: >
          $2p = 3(1 - p)$ gives $p = 3/5$. Both of Dev's pubs then earn him
          $6/5$.
      - ask: >
          With what probability does Dev go to Harbour?
        expects: "1/5"
        hint: >
          Cleo earns $4q$ from Harbour and $1 - q$ from Station.
        feedback: >
          $4q = 1 - q$ gives $q = 1/5$. Dev goes to his own favourite, Station,
          $4/5$ of the time.
      - ask: >
          In this mixed equilibrium, with what probability do they end up in
          different pubs?
        expects: "14/25"
        hint: >
          Two ways to miss: Cleo at Harbour with Dev at Station, or the
          reverse.
        feedback: >
          $\frac{3}{5} \cdot \frac{4}{5} + \frac{2}{5} \cdot \frac{1}{5} =
          \frac{12}{25} + \frac{2}{25} = \frac{14}{25}$, more than half the
          evenings.
      - ask: >
          What does Cleo earn on average in the mixed equilibrium?
        expects: "4/5"
        hint: >
          Price either pub against Dev's $q = 1/5$.
        feedback: >
          Harbour earns her $4 \cdot \frac{1}{5} = \frac{4}{5}$, and Station
          earns $1 - \frac{1}{5} = \frac{4}{5}$, as indifference promises.
      - ask: >
          How does the mixed equilibrium compare for the two of them with the
          two pure ones?
        choices:
          - text: >
              It is a fair compromise, between the two pure outcomes for
              each.
            feedback: >
              Cleo gets $4/5$, below even her worse pure outcome of $1$; Dev
              gets $6/5$, below his worse pure outcome of $2$. It is not
              between them for anyone.
          - text: >
              Both are worse off than at either pure equilibrium.
            correct: true
            feedback: >
              Missing $14/25$ of the time costs more than conceding ever
              would. The mixed equilibrium is self-consistent and
              inefficient.
          - text: >
              Cleo is better off and Dev worse off, since Cleo's stakes are
              larger.
            feedback: >
              Both lose: $4/5 < 1$ for Cleo and $6/5 < 2$ for Dev.
        feedback: >
          This is the battle of the sexes: two pure equilibria the players
          rank oppositely, and a mixed one worse for both than either.
          Equilibrium is about stability, not welfare; any way to coordinate —
          a convention, a coin they both see, one phone call — beats it for
          both.

      - part: What moves the mix
        ask: >
          Harbour gets a new chef, and Cleo's payoff from both at Harbour
          rises from $4$ to $9$. Everything else is unchanged. What happens to
          Cleo's probability of going to Harbour?
        choices:
          - text: >
              It rises: she likes Harbour more.
            feedback: >
              Her probability is fixed by Dev's indifference, and Dev's
              numbers did not change: $2p = 3(1-p)$ still gives $3/5$.
          - text: >
              It stays at $3/5$.
            correct: true
            feedback: >
              Her mix exists to keep Dev indifferent, and only Dev's payoffs
              enter that equation. Her own enthusiasm moves his mix, not hers.
          - text: >
              It falls, because Dev will now avoid Harbour.
            feedback: >
              Dev's behaviour does change, but Cleo's probability is still
              pinned by $2p = 3(1-p)$, which has not moved.
        feedback: >
          The counter-intuitive half of the indifference principle: your
          payoffs move the other player's mix.
      - ask: >
          With the new chef, with what probability does Dev go to Harbour?
        expects: "1/10"
        feedback: >
          Cleo's indifference is now $9q = 1 - q$, so $q = 1/10$, down from
          $1/5$. The better Harbour is for Cleo, the less often Dev needs to
          appear there to make her indifferent. Said aloud in an interview:
          "each player's mix is set by the other's payoffs, so it is
          asymmetric, and both do worse than at either pure equilibrium."

  - node: quant-games.game-theory.zero-sum
    hook: >
      "What can I guarantee no matter what they do" is the zero-sum question, and the first move before any equilibrium computation is checking the row and column security levels for a saddle — sometimes the game is already solved without touching probabilities.
    explanation: >
      A two-player game is zero-sum when the two payoffs in every cell sum to a constant, which lets the entire game be described by a single matrix of row payoffs, with the row player maximizing that number and the column player minimizing it — there's no room for coordination, since one player's gain is exactly the other's loss. Committing to a row before the column is revealed guarantees the row player at least the smallest payoff in that row, so the best guaranteed floor across all rows is $\max_i \min_j a_{ij}$, the maximin; the column player symmetrically guarantees a ceiling of $\min_j \max_i a_{ij}$, the minimax.
      Maximin can never exceed minimax, because committing to a choice before your opponent reveals theirs can only be as good as or worse than choosing after — moving first never helps under an adversary who gets to respond. When the two numbers coincide, that shared cell is a saddle point: neither player can improve by deviating from it alone, so it's a genuine pure Nash equilibrium and the game is fully solved without any mixing at all. Checking for a saddle first is worth the thirty seconds it costs, since it's often the entire answer.
    worked: >
      Take rows $R_1$: $(2,6)$ and $R_2$: $(5,1)$. Row minima are $2$ for $R_1$ and $1$ for $R_2$, so the row player's maximin is $2$. Column maxima are $5$ for the first column and $6$ for the second, so the column player's minimax is $5$. Checking cell by cell, no cell is simultaneously its row's minimum and its column's maximum — $(R_1,C_1)=2$ is $R_1$'s minimum but not $C_1$'s maximum ($5$), and no other cell qualifies either — confirming no saddle point exists. The gap between the maximin $2$ and the minimax $5$ means this game genuinely needs mixed strategies to pin down its value.
    interview: >
      "Is there a pure solution to this zero-sum game?" wants the maximin and minimax computed explicitly, with the saddle check stated as both conditions at once — the cell must be its row's minimum and its column's maximum together, not just a numeric coincidence between the two summary numbers.
    pitfalls: >
      Checking only that the maximin and minimax numbers are equal without verifying an actual cell achieves both conditions simultaneously. Assuming "zero-sum" requires the payoffs to literally sum to zero — constant-sum games reduce to the same analysis after subtracting the constant.
    recap: >
      Maximin never exceeds minimax in a zero-sum game; when they coincide, that cell is a saddle point and a pure equilibrium, and when they don't, mixing is unavoidable.
    dialogue:
      - part: A fixed pie of orders
        teach: >
          Two brokers split a fixed $100$ lots of client flow each day. Each
          picks a pitch — Price, Speed or Service — without seeing the
          other's. The table gives the row broker's lots. Price: $50$ against
          Price, $30$ against Speed, $60$ against Service. Speed: $65$, $55$,
          $70$. Service: $40$, $35$, $50$. The column broker gets the rest.
      - ask: >
          The column broker wants to do as well as she can. What should she
          read off the table?
        choices:
          - text: >
              Her own lots, which the table leaves out — so it is incomplete.
            feedback: >
              Nothing is missing. Her lots are $100$ minus each entry: $50$,
              $70$, $40$ across the top row, and so on.
          - text: >
              The row broker's lots, which she wants as small as possible.
            correct: true
            feedback: >
              Every lot the row broker does not get is hers. Minimizing his
              number and maximizing hers are the same instruction.
          - text: >
              The total of the two, which she wants as large as possible.
            feedback: >
              The total is $100$ in every cell. There is nothing to grow, only
              a split to fight over.
        feedback: >
          One number per cell carries the whole game: the row broker pushes it
          up, the column broker pushes it down.
      - reflect: >
          In plenty of games both players prefer the same cell — two desks who
          would both rather quote wide, say. Why can that never happen here — and what can you do to
          the table so that each cell's two payoffs sum to $0$?
        answer: >
          Every cell splits the same $100$, so a cell better for one broker is
          worse for the other by exactly as much: there is no outcome both
          prefer and nothing to coordinate on. Subtract $50$ from each
          broker's lots and the payoffs become $x - 50$ and $50 - x$, which
          sum to $0$ without changing anyone's ranking or any comparison of
          averages.
      - teach: >
          A two-player game is zero-sum when the payoffs in every cell sum to
          $0$; constant-sum games, like this one, are the same thing after
          subtracting the constant. A single matrix $A$ of row payoffs
          describes it: the row player maximizes $a_{ij}$ and the column
          player minimizes it.

      - part: What each side can guarantee
        ask: >
          Suppose the row broker had to announce his pitch first. How many
          lots can he guarantee himself, whatever the column broker then does?
        expects: "55"
        hint: >
          For each pitch, find the worst the column broker can do to him.
          Then pick the pitch whose worst is best.
        feedback: >
          The row minima are $30$ (Price), $55$ (Speed) and $35$ (Service).
          Pitching Speed guarantees $55$.
      - ask: >
          Now suppose the column broker announces first. What is the fewest
          lots she can hold the row broker to?
        expects: "55"
        hint: >
          For each of her pitches, find the most he can take. Then pick the
          pitch where that is smallest.
        feedback: >
          The column maxima are $65$ (Price), $55$ (Speed) and $70$
          (Service). Pitching Speed holds him to $55$.
      - teach: >
          These are the security levels. The row player's is the maximin,
          $\max_i \min_j a_{ij}$; the column player's is the minimax,
          $\min_j \max_i a_{ij}$. When they agree, the cell where they meet is
          a saddle point: the smallest entry in its row and the largest in its
          column.
      - ask: >
          Both levels are $55$, at (Speed, Speed). What does that tell you?
        choices:
          - text: >
              Nothing yet: the two brokers might still do better by guessing
              each other's pitch.
            feedback: >
              At (Speed, Speed), the row broker's alternatives earn $30$ and
              $35$, both worse; the column broker's alternatives give him $65$
              and $70$, both worse for her. Guessing gains no one anything.
          - text: >
              Neither broker gains by switching alone, and announcing first
              costs nothing.
            correct: true
            feedback: >
              $55$ is the least in its row and the most in its column. Each
              side can guarantee it, neither can beat it, and the game is
              settled in pure strategies.
          - text: >
              The game is fair, since the split is close to even.
            feedback: >
              The split is $55$–$45$ in the row broker's favour. A saddle
              point says where play settles, not that the split is even.
        feedback: >
          Look for a saddle before anything else: one pass over row minima and
          column maxima, and if the two numbers agree, you are done.

      - part: When the guarantees disagree
        ask: >
          A new zero-sum game, row payoffs $R_1$: $7$ against $C_1$, $1$
          against $C_2$; $R_2$: $3$ against $C_1$, $5$ against $C_2$. What is
          the row player's maximin?
        expects: "3"
        feedback: >
          Row minima are $1$ and $3$, so committing to $R_2$ guarantees $3$.
          The column maxima are $7$ and $5$, so the column player's minimax is
          $5$. The levels no longer meet.
      - ask: >
          Why can the maximin never exceed the minimax, in any matrix?
        choices:
          - text: >
              Because in a zero-sum game the column player is always at an
              advantage.
            feedback: >
              Neither side is favoured in general. The inequality is about
              who commits first, and it holds for any matrix of numbers.
          - text: >
              If the row picks $i^{*}$ and the column $j^{*}$, the entry
              $a_{i^{*} j^{*}}$ is at least row $i^{*}$'s minimum and at most
              column $j^{*}$'s maximum.
            correct: true
            feedback: >
              Take $i^{*}$ to be the maximin row and $j^{*}$ the minimax
              column: maximin $\le a_{i^{*} j^{*}} \le$ minimax. One cell sits
              between the two numbers.
          - text: >
              Because the matrix has more columns than rows.
            feedback: >
              Shape plays no part. The argument works for any matrix, square
              or not.
        feedback: >
          Committing first can only hurt you, never help. When the gap is
          strict, as with $3$ against $5$, whoever announces a pure choice gets
          exploited.
      - ask: >
          In that $3$-to-$5$ game, what is the honest conclusion?
        choices:
          - text: >
              The value is $4$, halfway between.
            feedback: >
              Nothing so far justifies averaging the two levels. They are
              guarantees under opposite announcement orders, and neither
              describes play when nobody announces.
          - text: >
              No pure cell is stable; play needs something besides committing
              to a single row or column.
            correct: true
            feedback: >
              From $(R_2, C_2)$ at $5$ the column moves to $C_1$ for $3$, then
              the row to $R_1$ for $7$, then the column to $C_2$ for $1$, and
              round again. The gap is the signal that pure play cycles.
          - text: >
              The row player should take the $3$ and stop there.
            feedback: >
              $3$ is what he is sure of if he must announce first. When
              nobody announces, he can aim higher — how much higher is a
              question about randomizing.
        feedback: >
          A saddle point settles a zero-sum game outright. Without one, the
          security levels bracket the answer, and closing the bracket is the
          job of the next result.

  - node: quant-games.game-theory.minimax
    hook: >
      "What's this zero-sum game actually worth" is the question this closes for good: once mixing is allowed, the security gap from a moment ago doesn't just shrink, it vanishes to a single exact number both sides can guarantee.
    explanation: >
      Von Neumann's theorem says that in a finite two-player zero-sum game, allowing mixed strategies makes the maximin and minimax coincide exactly: $\max_p \min_q \sum_{i,j} p_i a_{ij} q_j = \min_q \max_p \sum_{i,j} p_i a_{ij} q_j = v$. The shared number $v$, the value of the game, is simultaneously the most the row player can guarantee in expectation against any column play and the least the column player can be forced to concede — not an average outcome under some assumed opponent behavior, but a genuine two-sided guarantee.
      What makes zero-sum games special compared to the general case is that every Nash equilibrium pays exactly $v$ and the equilibria are interchangeable, so there's no equilibrium-selection problem the way there is in a game like battle of the sexes — whichever optimal mix either side plays, the outcome is the same guaranteed number. Practically, this reduces to solving two linear programs that turn out to be duals of each other, which is the algorithmic path once the game is too large for indifference equations to be convenient by hand.
    worked: >
      Return to the matrix from a moment ago, $R_1$: $(2,6)$, $R_2$: $(5,1)$, which had no saddle. Let the row player mix $p$ on $R_1$: the row payoff against a pure column $C_1$ is $5-3p$, against $C_2$ it's $1+5p$, and setting them equal gives $p=1/2$ with value $3.5$. Let the column player mix $q$ on $C_1$: the row payoff against pure $R_1$ is $6-4q$, against $R_2$ it's $1+4q$, and setting them equal gives $q=5/8$, again yielding value $3.5$. The value $3.5$ sits strictly between the original maximin of $2$ and minimax of $5$, exactly as mixing should close a security gap rather than push past either endpoint.
    interview: >
      "Solve this zero-sum game" wants a saddle check first, and if none exists, indifference equations set up from the opponent's payoffs — same technique as any mixed equilibrium — solved for both sides' probabilities and the single value both agree on.
    pitfalls: >
      Computing a value outside the range of the original maximin and minimax — that's a sign of an arithmetic error, since mixing can only close the gap, never overshoot it. Assuming the specific optimal mix found is uniquely special; in a zero-sum game every optimal mix pays the same value, so there's nothing more to select between them.
    recap: >
      Every finite zero-sum game has a value $v$ that both sides can guarantee by mixing, with all optimal strategies interchangeable and paying exactly $v$ — the game is completely solved.
    dialogue:
      - part: A gap a coin only half closes
        teach: >
          A pitcher throws a Fastball or a Curve; the batter sits on one pitch
          before it arrives. The game is zero-sum, and the pitcher's payoff is
          the matrix. Fastball: $6$ if the batter sits Curve, $0$ if he sits
          Fastball. Curve: $1$ if he sits Curve, $4$ if he sits Fastball.
      - ask: >
          Committing to a single pitch in advance, what can the pitcher
          guarantee?
        expects: "1"
        feedback: >
          Fastball's worst case is $0$ and Curve's is $1$, so the maximin is
          $1$. The batter, committing first, can hold the pitcher to the
          smaller column maximum, $\min(6, 4) = 4$. The levels leave a gap from
          $1$ to $4$.
      - ask: >
          The pitcher flips a fair coin between the two pitches, privately.
          What does that guarantee him against the batter's best reply?
        expects: "2"
        hint: >
          Price the coin against each of the batter's choices; the batter
          takes the smaller.
        feedback: >
          Against sits-Curve the coin earns $\frac{1}{2}(6) + \frac{1}{2}(1) =
          3.5$; against sits-Fastball it earns $\frac{1}{2}(0) + \frac{1}{2}(4)
          = 2$. The batter sits Fastball and the coin guarantees $2$ — better
          than $1$, but the batter still has a column to lean on.
      - reflect: >
          With probability $p$ on Fastball, the pitcher earns $1 + 5p$ if the
          batter sits Curve and $4 - 4p$ if he sits Fastball, and the batter
          picks the smaller. Where is the smaller of two such lines as high as
          it can be, and why there?
        answer: >
          Where they cross. The first line rises with $p$ and the second
          falls, so to the left of the crossing the rising one is the minimum
          and to the right the falling one is; the minimum peaks exactly where
          they meet. At that $p$ the batter's two choices pay the same, so he
          has nothing to lean on.
      - ask: >
          What probability of Fastball maximizes the pitcher's guarantee?
        expects: "1/3"
        feedback: >
          $1 + 5p = 4 - 4p$ gives $p = 1/3$.
      - ask: >
          And what does that mix guarantee him?
        expects: "8/3"
        feedback: >
          $1 + 5 \cdot \frac{1}{3} = \frac{8}{3}$, and $4 - 4 \cdot \frac{1}{3} =
          \frac{8}{3}$. About $2.67$, inside the gap from $1$ to $4$.

      - part: The batter closes it from above
        ask: >
          Now the batter mixes, sitting Curve with probability $q$. What $q$
          holds the pitcher to the least, whatever he throws?
        expects: "4/9"
        hint: >
          Fastball then earns $6q$ and Curve earns $q + 4(1 - q)$; the
          pitcher takes the larger.
        feedback: >
          $6q = 4 - 3q$ gives $q = 4/9$, and both pitches earn
          $6 \cdot \frac{4}{9} = \frac{8}{3}$. The batter can hold the pitcher
          to exactly the number the pitcher can guarantee.
      - teach: >
          That is von Neumann's minimax theorem. In a finite two-player
          zero-sum game with row payoffs $a_{ij}$, $\max_p \min_q \sum_{i,j}
          p_i a_{ij} q_j = \min_q \max_p \sum_{i,j} p_i a_{ij} q_j = v$, the
          value of the game. Optimal mixes exist for both sides, the row
          player's guarantees at least $v$ against anything, and the column
          player's concedes at most $v$ against anything.
      - ask: >
          You already knew, without any theorem, that the row player's
          guarantee can never exceed the column player's. What does the
          theorem add?
        choices:
          - text: >
              That the value is the midpoint of the pure maximin and minimax.
            feedback: >
              Here the midpoint of $1$ and $4$ is $2.5$ and the value is
              $8/3$. The value lies in the gap, but where depends on the
              matrix.
          - text: >
              That once mixing is allowed the two guarantees are equal, so
              the gap closes completely.
            correct: true
            feedback: >
              The inequality is the easy half. Equality is the content: a
              mix exists that guarantees exactly what the opponent can hold
              you to. Its proof is a separating-hyperplane or linear-programming
              duality argument.
          - text: >
              That the row player can now guarantee the old minimax, $4$.
            feedback: >
              The batter's mix holds him to $8/3$, below $4$. Mixing moves
              both guarantees toward each other; neither side gets the other's
              old number.
        feedback: >
          Maximin $\le$ minimax always; mixing makes it $=$. That single
          number is what "solving" a zero-sum game means.

      - part: What the value promises
        ask: >
          The batter sits Curve with probability $4/9$. What does a pitcher
          who throws only Fastballs earn on average against him?
        expects: "8/3"
        feedback: >
          $6 \cdot \frac{4}{9} + 0 \cdot \frac{5}{9} = \frac{24}{9} =
          \frac{8}{3}$. Against the batter's optimal mix, every pitch — and so
          every mix — earns the value.
      - ask: >
          Then why should the pitcher bother with $p = 1/3$?
        choices:
          - text: >
              He should not: all strategies earn $8/3$, so pure Fastball is
              just as good.
            feedback: >
              Only against this batter. A batter who notices sits Fastball,
              and pure Fastball then earns $0$.
          - text: >
              Because $p = 1/3$ earns more than $8/3$ against the optimal
              batter.
            feedback: >
              Against $q = 4/9$ nothing earns more than $8/3$ — that is what
              the batter's optimal mix guarantees.
          - text: >
              Because $p = 1/3$ guarantees $8/3$ against every batter, not
              just the optimal one.
            correct: true
            feedback: >
              The optimal mix is a guarantee, not a best reply to one
              opponent. Pure Fastball ties the value only while the batter
              behaves.
        feedback: >
          An optimal strategy is defined by its worst case. Against a known,
          careless opponent you might do better; against an unknown one, it is
          the most you can be sure of.
      - ask: >
          Outside zero-sum, a game can have two pure equilibria paying
          $(2,2)$ and $(3,3)$ — two venues coordinating on a tick size, say.
          Can a zero-sum game have two equilibria that pay the row
          player different amounts?
        choices:
          - text: >
              Yes: equilibria are never unique, zero-sum or not.
            feedback: >
              Zero-sum games may have several equilibria, but they cannot pay
              differently. Each player's equilibrium strategy is optimal, so
              each one pays exactly $v$.
          - text: >
              No: every equilibrium pays $v$, and optimal strategies can be
              swapped freely between equilibria.
            correct: true
            feedback: >
              The equilibria are exactly the pairs of optimal strategies, so
              any row optimum with any column optimum is again an equilibrium.
              No selection problem, no coordination problem.
          - text: >
              Only if the game has a saddle point.
            feedback: >
              A saddle point is a pure equilibrium paying $v$. Saddle or no
              saddle, every equilibrium pays $v$.
        feedback: >
          Said aloud: "Zero-sum and finite, so by von Neumann the game has a
          value. I find each side's optimal mix by equating the opponent's
          options, check both give the same $v$, and $v$ sits between the pure
          maximin and minimax."

  - node: quant-games.game-theory.extensive-form
    hook: >
      Whenever a prompt says "first X moves, then Y responds," you're being asked to build a tree, not a matrix, and mistaking the two is the fastest way to answer a question nobody asked.
    explanation: >
      An extensive-form game is a tree: each decision node names the player to move, each edge is an action available there, and each leaf carries the payoff every player receives if play reaches it. Information sets group together the nodes a mover can't tell apart at the moment of choosing; the game has perfect information exactly when every information set is a single node, and a simultaneous move — where neither player has seen the other's action yet — is modeled as an information set containing several nodes rather than as a timing difference.
      A strategy in this setting is a complete contingent plan: one action specified at every decision node belonging to that player, including nodes that player's own earlier choices already rule out from ever being reached. That inflation is easy to underestimate — two binary decisions in sequence already produce four complete strategies for the second mover, not two, because a full plan must say what happens down both branches even though only one is ever actually walked.
      Once every strategy profile is mapped to the payoff at the leaf it induces, the tree collapses back into an ordinary normal-form game — a matrix indexed by complete plans rather than single moves — so dominance, Nash equilibrium, and mixing all still apply exactly as before, just to a larger and more structured object.
    worked: >
      Player $1$ chooses $L$ or $R$. If $L$, Player $2$ chooses $U$, leading to payoffs $(3,2)$, or $D$, leading to $(1,4)$. If $R$, Player $2$ chooses $U'$, leading to $(2,1)$, or $D'$, leading to $(5,0)$. A complete strategy for Player $2$ specifies an action at both of their decision nodes, giving $\{U,D\}\times\{U',D'\}$, or $4$ strategies, even though only one of the two nodes is ever actually reached in any single play. Combined with Player $1$'s $2$ options, the induced normal form has $2\times 4=8$ strategy profiles, even though the tree itself has only $4$ leaves — strategy counts and outcome counts are different objects entirely.
    interview: >
      "Model this as a tree" wants nodes, edges, and leaves named explicitly, with information sets flagged wherever a move is actually simultaneous; "how many strategies does the second mover have?" is testing whether you remember a strategy specifies an action everywhere, not just along the path you happen to be imagining.
    pitfalls: >
      Defining a player's strategy only at nodes reached along one imagined line of play — this undercounts strategies and breaks the conversion back to normal form. Modeling a simultaneous move as a sequence of separate tree nodes instead of one shared information set, which secretly grants one player information they never actually had.
    recap: >
      An extensive-form game is a tree with information sets marking what each mover can't distinguish, and a strategy is a complete plan at every node — collapsing every profile to its leaf payoff recovers an ordinary normal-form game.
    dialogue:
      - part: Instructions left with an assistant
        teach: >
          A seller posts a price, High or Low. The buyer sees it and then Buys
          or Walks. Payoffs $(\text{seller}, \text{buyer})$: High then Buy,
          $(5,1)$; Low then Buy, $(3,3)$; Walk after either price, $(0,0)$.
          The buyer is travelling and must leave written instructions with an
          assistant before any price is posted.
      - ask: >
          How many different instructions could she leave that tell the
          assistant what to do whatever the price turns out to be?
        expects: "4"
        hint: >
          The instruction has to cover a High price and a Low price.
        feedback: >
          Two prices, two responses to each: Buy at both; Buy at High only;
          Buy at Low only; Walk at both. $2 \times 2 = 4$. "Buy if Low" alone
          is not one of them — it leaves the assistant stuck at a High price.
      - ask: >
          Write the game as a table: the seller's $2$ prices against the
          buyer's complete instructions. How many cells does it have?
        expects: "8"
        feedback: >
          $2 \times 4 = 8$ cells. Each pairs a price with a full instruction,
          and each leads to one outcome: High against "Buy at Low only" ends
          in a Walk at $(0,0)$.
      - ask: >
          A colleague writes the game as a $2 \times 2$ table instead: seller
          High or Low against buyer Buy or Walk. What does that lose?
        choices:
          - text: >
              Nothing: the four outcomes are the same four outcomes.
            feedback: >
              The outcomes are, but the $2 \times 2$ table lets the buyer pick
              Buy or Walk without seeing the price — as if she chose blind.
              Her ability to respond is gone.
          - text: >
              It loses the buyer's ability to make her choice depend on the
              price.
            correct: true
            feedback: >
              In a normal-form table everyone chooses without seeing anyone.
              "Buy at Low only" is a column of the $8$-cell table and no
              column of the $2 \times 2$.
          - text: >
              It loses the seller's payoffs.
            feedback: >
              Both payoffs are in every cell of either table. What is missing
              is who sees what before moving.
        feedback: >
          The order of moves and what each mover has seen are part of the
          game, and a plain payoff table has nowhere to put them.
      - reflect: >
          Sketch the situation in a way that keeps the order of moves and
          who has seen what. What are the pieces, and what exactly is one of
          the buyer's strategies in that picture?
        answer: >
          A tree. The root is the seller's decision, with an edge for each
          price; each edge ends at a buyer decision node, with edges Buy and
          Walk; each leaf carries the payoff pair. The buyer has two decision
          nodes, and a strategy names one action at each — which is why there
          were four instructions, not two.
      - teach: >
          This is the extensive form. Each node is a decision point labelled
          with its mover, each edge an action, each leaf a payoff vector.
          Information sets group the nodes a mover cannot tell apart; with
          every set a single node, the game has perfect information. A
          strategy is a complete contingent plan: an action at every one of
          your decision nodes. Pairing strategies with the leaves they reach
          gives back a normal-form table.

      - part: Plans for nodes you never reach
        ask: >
          Another tree. Player $1$ chooses Stop or Go. After Go, player $2$
          chooses Left or Right. After Right, player $1$ chooses $a$, $b$ or
          $c$. How many strategies does player $1$ have?
        expects: "6"
        hint: >
          Player $1$ has two decision nodes. A strategy names an action at
          both, even when the first action makes the second unreachable.
        feedback: >
          $2$ choices at the root times $3$ at her later node: $6$. "Stop,
          and $c$ if it ever came to that" counts separately from "Stop, and
          $a$".
      - ask: >
          Why insist that a plan beginning with Stop still says what player
          $1$ would do after Right?
        choices:
          - text: >
              It does not matter: those plans lead to the same leaf, so they
              should be merged.
            feedback: >
              They lead to the same leaf against every player-$2$ strategy,
              yet player $2$'s choice between Left and Right depends on what
              player $1$ would do after Right. Without that, nobody can ask
              whether Stop was wise.
          - text: >
              Because the others' best choices, and so the wisdom of Stop,
              depend on what player $1$ would do there.
            correct: true
            feedback: >
              To judge Stop you compare it with Go, and Go's value runs
              through player $2$'s choice, which runs through player $1$'s
              plan after Right. The plan has to exist to be reasoned about.
          - text: >
              Because player $1$ might change her mind after choosing Stop.
            feedback: >
              Stop ends the game; there is no later moment. The off-path part
              of the plan matters for the reasoning, not for the play.
        feedback: >
          Complete plans make the conversion to a table well defined — every
          profile reaches exactly one leaf — and they are what later lets you
          ask whether a plan for an unreached node is believable.

      - part: When the second mover cannot see
        ask: >
          Back to the seller and buyer, but now the buyer must preorder before
          the price is shown. What changes in the tree?
        choices:
          - text: >
              The buyer moves first, so the tree is redrawn with her at the
              root.
            feedback: >
              Clock order is not the issue; seeing is. Leave the seller at the
              root and record that the buyer cannot tell which price she is
              facing.
          - text: >
              Nothing: the tree is the same, and the buyer simply guesses.
            feedback: >
              If the tree were unchanged, the buyer could still act on the
              price, and "Buy at Low only" would still be available. The
              picture must take that option away.
          - text: >
              The buyer's two nodes are joined into one information set, so
              she must take the same action at both.
            correct: true
            feedback: >
              She cannot distinguish the two nodes, so her plan cannot
              distinguish them either. This is how a tree encodes a
              simultaneous move.
        feedback: >
          The information set, not the drawing order, is what records
          simultaneity.
      - ask: >
          How many strategies does the preordering buyer have?
        expects: "2"
        feedback: >
          One information set with two actions: Buy or Walk. The game
          collapses to the $2 \times 2$ table — which was the right description
          all along, for this version and only this one. In an interview, the
          first count to get right is strategies, not leaves.

  - node: quant-games.game-theory.backward-induction-games
    hook: >
      "Solve this game" in sequential form always means one procedure, and the interview tell is starting at the very last decision instead of guessing the first move and hoping it works out.
    explanation: >
      Start at whichever decision nodes have only leaves as children, replace each with the payoff vector of the action its mover actually prefers there, and fold the tree upward one layer at a time until the root itself has been reduced to a single payoff vector. Each fold is forced rather than guessed: the mover at a node being folded already knows, with certainty, the payoff every one of their available actions leads to, because everything below has already been solved — there's no remaining strategic uncertainty at that step, only ordinary optimization.
      This recursive certainty is what earlier movers get for free: by the time backward induction reaches an earlier node, the entire continuation from every one of that node's actions is already known, converting what looks like a strategic guess about the future into a plain comparison of known numbers. The resulting retained actions form a subgame-perfect equilibrium, which exists in pure strategies for every finite game of perfect information — Zermelo's theorem — and is unique as long as no mover is ever exactly indifferent between two actions at some node.
    worked: >
      Player $A$ moves first: Down ends the game immediately at $(2,2)$; Up passes to Player $B$, who can choose Right, ending the game at $(0,5)$, or Left, passing back to $A$ for a second decision between $X$, paying $(4,1)$, and $Y$, paying $(1,4)$. Folding from the bottom: at $A$'s second node, $X$ pays $A$ more than $Y$ ($4>1$), so that subtree collapses to $(4,1)$. At $B$'s node, Right pays $B$ more than the collapsed Left value ($5>1$), so $B$ plays Right and the Up subtree collapses to $(0,5)$. At the root, $A$ compares Down's $2$ against Up's collapsed $0$ and plays Down — the tempting $(4,1)$ leaf is never reached, because $B$, anticipating it, would rather grab $(0,5)$ one level up, which is exactly why $A$ avoids Up in the first place.
    interview: >
      "Walk me through solving this step by step" wants the last decision solved first, narrated explicitly, with each earlier fold stated as a comparison of already-known numbers rather than an intuited final answer.
    pitfalls: >
      Solving from the root downward, which forces guessing an early move before the later nodes that actually determine its value are known. Reporting only the payoffs along the equilibrium path as "the strategy" and omitting what each player would do at nodes never actually reached — a subgame-perfect equilibrium is a complete plan, on-path and off.
    recap: >
      Fold the tree from the leaves upward, one layer at a time, replacing each node by its mover's preferred already-known continuation — the surviving actions form a subgame-perfect equilibrium.
    dialogue:
      - part: The leaf you aim for and the leaf you get
        teach: >
          Ava moves first, Left or Right. After Left, Bo picks $a$, ending at
          $(3,1)$, or $b$, ending at $(1,2)$. After Right, Bo picks $d$,
          ending at $(0,3)$, or $c$, after which Ava picks $x$, ending at
          $(2,4)$, or $y$, ending at $(5,0)$. Payoffs are
          $(\text{Ava}, \text{Bo})$, and everyone sees every earlier move.
      - ask: >
          Ava spots the $5$ at the end of Right and heads that way. Where does
          play actually end? Give Ava's payoff.
        expects: "0"
        hint: >
          Ask what Ava would do at her last node, and then what Bo, knowing
          that, does after Right.
        feedback: >
          If Bo picks $c$, Ava takes $y$ for $5$, leaving Bo $0$. So Bo picks
          $d$ instead, for $3$, and Ava ends with $0$.
      - ask: >
          What did "head for the best leaf" get wrong?
        choices:
          - text: >
              It aimed at the wrong leaf; Ava should have aimed for $(3,1)$.
            feedback: >
              Aiming for $(3,1)$ fails the same way: after Left, Bo picks $b$
              for $2$ rather than $a$ for $1$. Any plan that picks a leaf
              without asking what Bo will do is a guess.
          - text: >
              It assumed Bo would walk Ava to her favourite leaf, when Bo
              chooses for his own payoff.
            correct: true
            feedback: >
              Every later mover chooses by their own numbers. Ava's $5$ needs
              Bo to pick $c$, and $c$ pays Bo $0$ once he foresees Ava's $y$.
          - text: >
              Nothing: going Right was right, and Bo erred by not playing $c$.
            feedback: >
              Bo's $d$ pays him $3$; $c$ pays him $0$. He did not err. Ava's
              plan relied on him acting against himself.
        feedback: >
          A plan for an early move is only as good as the forecast of every
          move after it.
      - ask: >
          The safe, slow method converts the tree to a table: Ava's complete
          plans against Bo's. How many cells does that table have?
        expects: "16"
        hint: >
          Ava has two decision nodes with two actions each; so does Bo.
        feedback: >
          Ava has $2 \times 2 = 4$ plans, Bo has $2 \times 2 = 4$, so $16$
          cells — each to be filled and checked, for a tree with five leaves.
      - reflect: >
          Most of those $16$ cells are wasted effort. Which single decision in
          the tree can you settle without knowing anything else about the
          game — and once it is settled, what can you settle next?
        hint: >
          Look for a decision whose every option ends the game.
        answer: >
          Ava's last choice, $x$ or $y$: both options are leaves, so she just
          compares $2$ with $5$ and takes $y$. Replace that node by $(5,0)$.
          Now Bo's choice after Right has only leaves below it, $(0,3)$
          against $(5,0)$, so it is settled too. Each settled node turns the
          node above it into a choice between leaves; you never need a
          forecast you have not already computed.
      - teach: >
          That is backward induction. Start at the decision nodes whose
          children are all leaves, replace each by the payoff vector its mover
          prefers, and fold upward one layer at a time. The retained actions
          form a subgame-perfect equilibrium; in any finite game of perfect
          information one exists in pure strategies (Zermelo), and it is
          unique when no mover is ever indifferent.

      - part: Folding the tree by hand
        ask: >
          Finish the fold. What does Bo receive at the backward-induction
          outcome?
        expects: "2"
        hint: >
          You have Right collapsing to $(0,3)$. Fold Left, then compare at the
          root.
        feedback: >
          After Left, Bo picks $b$ ($2 > 1$): Left collapses to $(1,2)$.
          Right collapsed to $(0,3)$. At the root Ava compares $1$ with $0$
          and goes Left. Outcome $(1,2)$: Bo gets $2$.
      - ask: >
          Asked for "the equilibrium", which answer is complete?
        choices:
          - text: >
              Ava plays Left, Bo plays $b$.
            feedback: >
              That is the path, not the equilibrium. It omits Bo's $d$ after
              Right and Ava's $y$ at her last node — the very plans that
              explain why Ava avoids Right.
          - text: >
              Ava: Left, and $y$ at her last node. Bo: $b$ after Left, $d$
              after Right.
            correct: true
            feedback: >
              A subgame-perfect equilibrium is a complete plan for every node,
              on the path and off it. The off-path pieces carry the
              argument.
          - text: >
              The payoffs $(1,2)$.
            feedback: >
              That is the outcome. An equilibrium is a profile of strategies,
              and two different profiles can produce the same payoffs.
        feedback: >
          Report the plan at every node, then the path, then the payoffs. The
          tempting $(5,0)$ is never reached because the plan at Bo's Right node
          is $d$.

      - part: Where the fold needs care
        ask: >
          Change one leaf: $d$ now ends at $(0,0)$ instead of $(0,3)$. Suppose
          Bo, indifferent between $c$ and $d$ after Right, breaks the tie
          toward $c$. What does Ava get?
        expects: "5"
        feedback: >
          After Right, $c$ leads to Ava's $y$ and $(5,0)$; $d$ gives $(0,0)$.
          Bo gets $0$ either way. Tie broken toward $c$, Right is worth $5$ to
          Ava, beating Left's $1$: she goes Right and gets $5$.
      - ask: >
          And if Bo breaks the tie toward $d$?
        choices:
          - text: >
              Ava still goes Right; backward induction always gives one
              answer.
            feedback: >
              With the tie broken toward $d$, Right is worth $0$ to Ava and
              Left is worth $1$, so she goes Left. The uniqueness guarantee
              needs no indifference anywhere.
          - text: >
              Ava goes Left and gets $1$: two subgame-perfect equilibria,
              depending on the tie-break.
            correct: true
            feedback: >
              One indifferent mover, two folds, two different root decisions.
              State the tie-break when you report the answer.
          - text: >
              The tree has no subgame-perfect equilibrium now.
            feedback: >
              Zermelo's guarantee is existence in every finite game of
              perfect information. Ties create several equilibria, never none.
        feedback: >
          Fold from the leaves, keep every node's choice, and flag any tie. In
          an interview: "solve the last move first, replace it by its payoff,
          and work back to the root" — said before touching the root.

  - node: quant-games.game-theory.credible-threats
    hook: >
      "Would you actually do that?" is the single question that separates a Nash equilibrium from a subgame-perfect one, and an interviewer probing credibility is testing exactly this gap.
    explanation: >
      Nash equilibrium can rest on a threat that's never actually tested: if the branch where the threat would be carried out is never reached along the equilibrium path, declaring an intention to fight there costs nothing in the normal-form check, since a player's payoff doesn't depend on what they'd do off the path they never take. Backward induction removes this loophole entirely, because it forces every mover to optimize at every node, including the ones that equilibrium play never visits — a threatened action has to also be genuinely optimal to carry out if the node is actually reached, not merely optimal to have announced in advance.
      Making a threat credible in practice means changing your own payoffs before the interaction starts, so that following through becomes the optimal choice once you're actually standing at that node — a signed contract, capacity built before demand materializes, or a reputation expensive enough to be worth protecting. Absent that kind of commitment, a stated threat is cheap talk that a sophisticated opponent, reasoning backward through the tree, will correctly ignore.
    worked: >
      A retailer chooses to stay Loyal to a supplier or order from a Rival; if Rival, the supplier chooses to Punish (cut future discounts) or Ignore. Payoffs (retailer, supplier): Loyal: $(4,6)$; Rival then Punish: $(0,1)$; Rival then Ignore: $(5,3)$. The profile (Loyal, Punish-if-Rival) is Nash: against the threat of Punish, staying Loyal beats Rival's $0$, and since Rival never happens, the supplier's off-path plan doesn't cost them anything in the check. It fails subgame perfection: if Rival actually occurred, the supplier compares Punish's $1$ against Ignore's $3$ and strictly prefers Ignore. Anticipating that, the retailer compares Loyal's $4$ against Rival-then-Ignore's $5$ and switches — the subgame-perfect outcome is (Rival, Ignore), paying $(5,3)$.
    interview: >
      "Is that threat believable?" wants a two-step answer: confirm it's a Nash equilibrium of the normal form first, then check separately whether the threatened action is still optimal in the exact subgame where it would have to be carried out.
    pitfalls: >
      Stopping at "it's a Nash equilibrium" and treating that as sufficient — Nash alone never rules out an incredible threat, only subgame perfection does. Assuming any stated commitment makes a threat credible; it only works if it genuinely changes the payoffs at the node where the threat would actually be executed, not just at the moment it's announced.
    recap: >
      A threat is credible only if carrying it out is still optimal once the node where it fires is actually reached; subgame perfection checks that, Nash equilibrium alone does not.
    dialogue:
      - part: A threat that is never tested
        teach: >
          A tenant either pays rent On time or Late. If Late, the landlord
          either Evicts — slow, costly, an empty flat — or Tolerates it.
          Payoffs $(\text{tenant}, \text{landlord})$: On time, $(2,5)$; Late
          then Evict, $(-3,1)$; Late then Tolerate, $(4,3)$. The landlord
          announces: "Pay late and I evict."
      - ask: >
          If the tenant believes the announcement, what does she do?
        choices:
          - text: >
              Pays late: $4$ is her best payoff in the whole tree.
            feedback: >
              That $4$ needs the landlord to Tolerate, and she believes he
              will Evict. Against Evict, Late pays her $-3$.
          - text: >
              Pays on time: $2$ beats the $-3$ she expects from Late.
            correct: true
            feedback: >
              Believing the threat, she compares $2$ with $-3$. The threat
              works — if she believes it.
        feedback: >
          The whole question is whether she should believe it.
      - ask: >
          Is the profile "tenant pays On time; landlord plans to Evict if
          Late" a Nash equilibrium?
        choices:
          - text: >
              No: the landlord would never actually evict, so it cannot be an
              equilibrium.
            feedback: >
              That reasoning goes beyond the Nash test. Holding the tenant at
              On time, switching the landlord's plan to Tolerate earns him $5$
              — the same $5$. He has no strict gain, so the test passes.
          - text: >
              Yes: the tenant best-responds to the threat, and the landlord's
              plan costs him nothing because Late never happens.
            correct: true
            feedback: >
              Each strategy is a best response to the other. The plan to Evict
              is never executed, so the Nash test never prices it.
          - text: >
              No: the tenant gains by paying late.
            feedback: >
              Against a landlord who evicts, Late pays her $-3$, worse than
              $2$. Holding his plan fixed, she has no profitable deviation.
        feedback: >
          The Nash test asks whether changing your plan changes your payoff.
          Changing a plan for a node that is never reached changes nothing, so
          any such plan passes for free.
      - ask: >
          Now suppose she does pay late. At that node, how much more does the
          landlord earn by Tolerating than by Evicting?
        expects: "2"
        feedback: >
          Tolerate pays him $3$, Evict pays $1$: $3 - 1 = 2$ more. Once the
          rent is late, carrying out the threat only hurts him.
      - reflect: >
          The Nash test accepted the threat, and you have just shown the
          landlord would not carry it out. What requirement, applied at every
          node — reached or not — would throw that plan out? You already have
          the tool that enforces it.
        answer: >
          Require every player's plan to be optimal at every decision node,
          including nodes the plan itself keeps off the path. Backward
          induction does exactly this: at the landlord's node it keeps
          Tolerate, because $3 > 1$, and then the tenant compares Late's $4$
          with On time's $2$. The threat dies the moment the plan is checked
          where it would be executed.
      - teach: >
          A subgame-perfect equilibrium is a profile whose restriction to
          every subgame — every node and everything below it — is a Nash
          equilibrium of that subgame. In finite games of perfect information,
          backward induction finds it. A threat is credible when carrying it
          out is optimal at the node where it would be carried out;
          subgame perfection deletes every equilibrium that rests on one that
          is not.

      - part: Two equilibria, one survivor
        ask: >
          What does the tenant earn in the subgame-perfect equilibrium?
        expects: "4"
        feedback: >
          The landlord Tolerates after Late, so Late pays her $4$ against On
          time's $2$. She pays late and the outcome is $(4,3)$.
      - ask: >
          Count pure Nash equilibria of the normal form: the tenant's two
          choices against the landlord's two plans. How many are there?
        expects: "2"
        hint: >
          Four cells: (On time, Evict), (On time, Tolerate), (Late, Evict),
          (Late, Tolerate).
        feedback: >
          (On time, Evict) and (Late, Tolerate). (On time, Tolerate) fails
          because she would switch to Late for $4$; (Late, Evict) fails
          because he would switch to Tolerate for $3$. Two Nash equilibria,
          and only (Late, Tolerate) is subgame perfect.

      - part: Making a threat believable
        ask: >
          The landlord wants on-time rent. Which move makes his threat
          credible?
        choices:
          - text: >
              Repeating the threat in writing, signed and dated.
            feedback: >
              Paper changes no payoff. At the late-rent node, Tolerate still
              pays him $3$ and Evict $1$, and she knows it.
          - text: >
              Raising the cost of eviction to the tenant, so the threat is
              scarier.
            feedback: >
              Her loss was never the problem; his was. Credibility is about
              his payoffs at his node, and those are unchanged.
          - text: >
              Signing a contract with a third party that fines him whenever
              he tolerates late rent.
            correct: true
            feedback: >
              The fine lowers Tolerate at exactly the node where the threat
              would be executed. Big enough, and Evict becomes his genuine best
              reply.
        feedback: >
          Commitment works by changing your own payoffs in advance: contracts,
          capacity built before the fight, a reputation you would pay to keep.
      - ask: >
          What is the smallest whole-number fine that makes evicting strictly
          better for him than tolerating?
        expects: "3"
        feedback: >
          With fine $F$, Tolerate pays $3 - F$, and he needs $3 - F < 1$, so
          $F > 2$: the smallest whole number is $3$. Then the tenant pays on
          time and he earns $5$ — and never pays the fine, because it never
          triggers.
      - ask: >
          Suppose instead eviction were profitable for him — he could re-let
          the flat at a higher rent, so Late then Evict paid $(-3, 4)$. What
          happens?
        choices:
          - text: >
              The threat is still not credible: threats never are without a
              contract.
            feedback: >
              At the late-rent node he now compares Evict's $4$ with
              Tolerate's $3$ and evicts. A threat you want to carry out
              needs no contract.
          - text: >
              The threat is credible, and the tenant pays on time in the
              subgame-perfect equilibrium.
            correct: true
            feedback: >
              Backward induction keeps Evict ($4 > 3$), so the tenant compares
              $-3$ with $2$ and pays on time. Subgame perfection only deletes
              threats against the threatener's own interest.
          - text: >
              The tenant pays late anyway, since $4$ is still her best leaf.
            feedback: >
              Her $4$ needs him to Tolerate, and he no longer would. Aiming at
              a leaf without checking the mover in between is the backward
              induction error.
        feedback: >
          In an interview: "That profile is Nash but not subgame perfect — the
          threat is never tested on the path. Fold the tree and it disappears,
          unless something changes the payoff at the node where it would be
          carried out."

  - node: quant-games.game-theory.first-mover
    hook: >
      "Would you rather move first or second?" sounds like small talk, but the right answer flips entirely depending on whether your move is a commitment the opponent must believe or a leak they can exploit.
    explanation: >
      Commitment helps the first mover precisely because it changes the follower's optimization problem: an action taken publicly and irreversibly before the follower moves becomes a fact they must best-respond to, which is exactly the backward-induction logic that made a threat credible earlier — the same mechanism, now working in the mover's own favor rather than against a bluff. Concealment helps the second mover in any game whose equilibria are genuinely mixed, since revealing a realized action collapses your own randomization: the opponent, having seen it, simply best-responds with certainty, converting what would have been the equilibrium value into your worst-case payoff instead.
      The practical diagnostic is two questions asked in order: can I commit to this move in a way the opponent must actually believe, and does moving first leak information worth more to them than that commitment is worth to me? A public, binding action answers the first question yes; a private mixed strategy that gets forced into the open answers the second question badly, since a mixed equilibrium's entire value comes from the opponent's uncertainty about which pure action was realized.
    worked: >
      Return to the asymmetric matching-pennies game from earlier, with row payoffs $+4$ on $H$-$H$, $-1$ on $H$-$T$, $-2$ on $T$-$H$, $+1$ on $T$-$T$, whose simultaneous-play value to the row player was $0.25$. If the row player is instead forced to reveal $H$ or $T$ before the column player moves, revealing $H$ lets column pick between giving row $+4$ or $-1$, and column, minimizing row's payoff, picks $-1$; revealing $T$ lets column choose between $-2$ and $+1$, and column picks $-2$. Row, anticipating this, reveals $H$ to guarantee the less bad $-1$ — a drop from the hidden value of $0.25$ to a forced-reveal value of $-1$, a swing of $1.25$ purely from losing concealment.
    interview: >
      "Would you want to move first in this game?" wants the two-question diagnostic stated explicitly, with the matching-pennies-style value collapse cited as the standard cautionary number for why concealment sometimes beats commitment.
    pitfalls: >
      Defaulting to "moving first is always an advantage" without checking whether the game's equilibria are pure, where commitment helps, or mixed, where revealing hurts. Confusing genuine, binding commitment with mere cheap-talk announcement, which changes nothing about the follower's incentives since it isn't actually enforceable.
    recap: >
      Move first when you can commit in a way the opponent must believe; move second when your move would leak information — any game whose equilibria are all mixed punishes revealing your hand.
    dialogue:
      - part: An offer to go first
        ask: >
          You play odds and evens for $1$ a round: you win when the finger
          counts match, your opponent when they differ. The organizer offers
          you a privilege — you may show your fingers first, openly, every
          round. Do you take it?
        choices:
          - text: >
              Yes: moving first gives you the initiative.
            feedback: >
              The initiative is worthless when your move is information. Show
              one finger and he shows two; show two and he shows one. You lose
              every round.
          - text: >
              It makes no difference: the game is symmetric.
            feedback: >
              Symmetric when both move blind. Once your move is seen, the
              symmetry is gone: he answers it, and you cannot answer his.
          - text: >
              No: whatever you show, he mismatches it.
            correct: true
            feedback: >
              Your move tells him exactly how to beat you. The privilege is a
              handicap.
        feedback: >
          Moving first is not an advantage in itself. Here it hands over the
          one thing that protected you — his not knowing your move.
      - ask: >
          Played blind, the game is worth $0$ to you. What is it worth per
          round once you must show first?
        expects: "-1"
        feedback: >
          Folding the tree: whatever you show, he picks the count that
          mismatches it, so every branch ends at $-1$. Revealing costs you a
          full dollar a round.

      - part: A game where going first pays
        teach: >
          Two firms each choose capacity, Big or Small. Payoffs
          $(\text{A}, \text{B})$: both Big, $(1,1)$ — a glut; A Big and B
          Small, $(5,2)$; A Small and B Big, $(2,5)$; both Small, $(3,3)$.
          Played blind, each firm's best reply is the opposite of the other's
          choice.
      - ask: >
          Now A builds first, visibly, and B sees the plant before choosing.
          What does A earn?
        expects: "5"
        hint: >
          Fold: what does B do after seeing Big, and after seeing Small?
        feedback: >
          After Big, B picks Small ($2 > 1$); after Small, B picks Big
          ($5 > 3$). So Big leads to $5$ for A and Small to $2$, and A builds
          Big. Played blind, the equilibria give A $5$, $2$, or $7/3$ in the
          mixed one, and nothing tells B which to play.
      - reflect: >
          Showing your move first cost you a dollar a round at odds and
          evens and earned firm A up to $5$ here. What is different about the
          two games that decides whether going first helps?
        hint: >
          In each game, what does the second mover do with what she sees?
        answer: >
          At capacity, B's best reply to a visible Big is to back off, so a
          move B must believe pushes B where A wants: commitment. At odds and
          evens, the second mover's best reply to anything visible is to beat
          it, so showing your move only leaks information: the value of
          concealment. A game whose equilibria are all mixed is one where
          every visible pure move can be exploited, so going first always
          hurts there.
      - teach: >
          Whether moving first helps is not a fact about the tree but about
          which matters more, commitment or concealment. Ask two questions in
          order: can I commit in a way the opponent must believe — a built
          plant, not a promise — and does my move leak information worth more
          than that commitment?

      - part: Testing the rule on new cases
        ask: >
          Rock–paper–scissors, but you must announce first. You announce only
          your probabilities — one third each — and then draw your throw in
          private. What is the game worth to you per round?
        expects: "0"
        feedback: >
          Against your uniform mix every throw of his earns $0$, so knowing the
          mix tells him nothing he can use. What leaks is the draw, not the
          odds: announcing an equilibrium mix costs nothing.
      - ask: >
          In some game you have a strictly dominant strategy, and your opponent
          has a single best reply to it. Does being forced to move first, in
          the open, hurt you?
        choices:
          - text: >
              Yes: any move the opponent sees can be exploited.
            feedback: >
              Only a move that would otherwise be hidden behind randomness.
              Your dominant strategy is no secret — the opponent can work it
              out from the table and already best-responds to it when you move
              blind.
          - text: >
              No: play the dominant strategy first and the opponent answers it
              exactly as he would have anyway.
            correct: true
            feedback: >
              Showing a pure equilibrium strategy leaks nothing the opponent did
              not already know. Moving first then costs nothing, and the option
              to commit to something else can only add to it.
          - text: >
              It always helps, since the first mover sets the terms.
            feedback: >
              Odds and evens refutes "always". Here moving first cannot hurt,
              but whether it strictly helps depends on whether committing to
              some other move would push the opponent somewhere better for
              you.
        feedback: >
          Concealment matters exactly when your equilibrium play is
          randomized. When it is pure, showing it is harmless.
      - ask: >
          Firm A says loudly that it *will* build Big, but builds at the same
          time as B, out of sight. A rival analyst says this is as good as
          building first. Which is the right objection?
        choices:
          - text: >
              None: B hears the announcement either way.
            feedback: >
              Hearing is not believing. What made building first work was
              that B saw a plant that could not be undone. A sentence can be.
          - text: >
              A promise changes no payoff, so it is not the commitment that
              made moving first pay.
            correct: true
            feedback: >
              Commitment has to be visible and irreversible — capacity
              already built, a contract already signed. B can make the same
              speech, and nothing in the payoffs decides between them.
          - text: >
              Announcing hurts A, because it leaks A's plan.
            feedback: >
              Leakage hurts when the opponent can exploit what she learns. At
              capacity, B learning "Big" is what A wants; the trouble is that
              B has no reason to believe it.
        feedback: >
          Said aloud: "Moving first helps when I can commit and be believed;
          it hurts when my move leaks information the other side can use.
          Games with only mixed equilibria always punish showing your hand."

  - node: quant-games.game-theory.two-thirds
    hook: >
      "Guess two-thirds of the average" is the standard test of whether you can carry an elimination argument all the way to its logical, and losing, conclusion — the equilibrium answer is also the answer that loses against real people.
    explanation: >
      The elimination cascade only forces the target all the way to zero because the multiplier, $2/3$, is strictly less than one: each round the ceiling on plausible guesses shrinks by that same factor, so the sequence of ceilings converges to zero regardless of where it starts. That strictness matters more than it looks — if the multiplier were exactly $1$ instead, so the game asked players to guess the average itself, any common guess $x$ would trivially satisfy "match the target," making every number in the range a Nash equilibrium simultaneously, since the elimination argument that forces uniqueness never gets off the ground when the ceiling doesn't shrink at all.
      Real populations never iterate the reasoning to its limit, which is exactly why the equilibrium answer, $0$, is also the practically wrong one: most people stop after one or two rounds of "what will others guess," not infinitely many, so the observed average lands well above zero and the winning guess is never the game-theoretically correct one. Recognizing this shape — a target defined as a shrinking fraction of what the crowd does — is the actual transferable skill, since the same cascade argument applies to any multiplier strictly between $0$ and $1$.
    worked: >
      Suppose the rule instead asks for half the average, still on $[0,100]$. The ceiling starts at $100$, and each round it's cut in half: $100 \to 50 \to 25 \to 12.5$, so after four rounds the ceiling on plausible guesses has fallen to $100\times(1/2)^4 = 6.25$, still shrinking toward zero. Contrast this with a multiplier of exactly $1$: if everyone guesses the same number, say $37$, the average is $37$ and the target is $37$ too, so $37$ satisfies the equilibrium condition — and so does every other number in $[0,100]$, since nothing ever forces the ceiling to shrink.
    interview: >
      "Guess two-thirds of the average — what do you say, and why doesn't the game-theoretic answer win?" wants both halves: the elimination argument for why $0$ is the unique equilibrium, and the practical answer, typically a small positive number reflecting where real populations actually land.
    pitfalls: >
      Deriving the cascade correctly and then actually submitting $0$ against real opponents — that guess is only optimal against infinitely deep reasoners who don't exist in practice. Assuming any "closest to a fraction of the average" game reduces to the same zero equilibrium regardless of the multiplier; a multiplier at or above $1$ breaks the argument entirely.
    recap: >
      Iterated elimination forces the target to zero whenever the multiplier is strictly below one, but real populations stop reasoning after a round or two, so the equilibrium answer is also the losing one against humans.
    dialogue:
      - part: A ceiling on the target
        ask: >
          A thousand people each name a number in $[0, 100]$, and whoever is
          closest to two-thirds of the average wins. Before guessing anything
          about the people: what is the largest the target could possibly be?
        expects: "66.67"
        tolerance: 0.01
        hint: >
          How large can the average be?
        feedback: >
          The average can be at most $100$, so the target is at most
          $\frac{2}{3} \cdot 100 \approx 66.67$, whatever anyone does.
      - ask: >
          What follows for the guesses themselves?
        choices:
          - text: >
              Guesses above $50$ are out, since the average of random guesses
              is $50$.
            feedback: >
              That assumes the room guesses at random — a claim about people.
              The ceiling of $66.67$ assumes nothing about anyone.
          - text: >
              Nothing yet: someone could still win with a high guess if the
              room guesses high.
            feedback: >
              Even if everyone names $100$, the target is $66.67$, and $66.67$
              is closer to it than any guess above. Whatever the room does, a
              guess above $66.67$ is farther from the target than $66.67$ is.
          - text: >
              A guess above $66.67$ is always farther from the target than
              $66.67$ itself, so it can never do better.
            correct: true
            feedback: >
              So every guess above $66.67$ is weakly dominated by $66.67$, and
              a rational player can cross it out.
        feedback: >
          The first step uses only the rules, and no assumption about the
          room.
      - ask: >
          Suppose everyone has crossed out the guesses above $66.67$, and
          everyone knows it. What is the new ceiling on the target?
        expects: "44.44"
        tolerance: 0.01
        feedback: >
          The average is now at most $66.67$, so the target is at most
          $\frac{2}{3} \cdot 66.67 \approx 44.44$, and guesses above that go
          next.
      - reflect: >
          Keep going. Where does this end — and what are you assuming about
          the room each time you take one more step?
        answer: >
          Each step multiplies the ceiling by $\frac{2}{3}$: $100$, $66.67$,
          $44.44$, $29.63$, and on toward $0$. The first step needs only that
          you are rational; the second that everyone is and knows the others
          are; the $k$-th needs $k$ layers of "everyone knows that everyone
          knows". Reaching $0$ takes all the layers at once.
      - part: The only number that survives
        teach: >
          The cascade converges to $0$, and everyone naming $0$ is the unique
          Nash equilibrium: the target is then $0$, and no one gets closer by
          moving. Each round of deleting weakly dominated guesses is one more
          step of reasoning about other people's reasoning.
      - ask: >
          Suppose everyone else names $10$. To be closest, what should you
          name?
        expects: "6.67"
        tolerance: 0.01
        hint: >
          With a thousand players, your own guess barely moves the average.
        feedback: >
          The average is essentially $10$, so the target is
          $\frac{2}{3} \cdot 10 \approx 6.67$ and you name it. Any common
          guess above $0$ invites a deviation below it; only $0$ is its own
          two-thirds.

      - part: The room you are actually in
        ask: >
          In classroom and newspaper runs of this game, the average guess
          comes out near $22$. What was the winning target?
        expects: "14.67"
        tolerance: 0.01
        feedback: >
          $\frac{2}{3} \cdot 22 \approx 14.67$. Winning guesses in real runs
          sit in the teens.
      - ask: >
          In that room, you named $0$, the equilibrium. How did it go?
        choices:
          - text: >
              You won: the equilibrium is the rational answer, and the rational
              answer wins.
            feedback: >
              The winner is whoever is closest to $14.67$. Your $0$ is $14.67$
              away; anyone who named $15$ was $0.33$ away.
          - text: >
              You lost, by about $14.67$: the equilibrium is right only if
              everyone else plays it.
            correct: true
            feedback: >
              Equilibrium is a best reply to equilibrium play. Against a room
              that stops after a step or two, it is a best reply to no one in
              the room.
          - text: >
              You lost, but only because of bad luck in who showed up.
            feedback: >
              Rooms like this average near $22$ again and again. Losing with
              $0$ is the systematic result, not the unlucky one.
        feedback: >
          The cascade tells you where perfectly rational play ends up, not
          where people stop. The winning question is how many steps this room
          takes.
      - ask: >
          A different room: half the players guess uniformly at random, and
          the other half name two-thirds of $50$, expecting a random room.
          What target should you aim for?
        expects: "27.78"
        tolerance: 0.05
        hint: >
          Average the two halves: about $50$, and about $33.33$.
        feedback: >
          The average is $\frac{1}{2}(50) + \frac{1}{2}(33.33) \approx 41.67$,
          so the target is $\frac{2}{3} \cdot 41.67 \approx 27.78$. Said aloud
          in an interview: "Iterated elimination drives it to $0$, which is the
          unique equilibrium — but against real people I would guess where
          two-thirds of their likely average lands, somewhere in the teens or
          twenties."

  - node: quant-games.game-theory.levels-of-reasoning
    hook: >
      "What would you actually guess, not the theoretical answer" is the real question behind two-thirds-of-the-average, and this model is what lets you compute a live number instead of reciting one from memory.
    explanation: >
      The cognitive-hierarchy model treats a population as a mixture of reasoning depths rather than as uniformly rational: level $0$ plays without modeling anyone else at all, and level $k$ best-responds to the belief that every opponent sits exactly one level below, at $k-1$. The Nash equilibrium is the limit of this ladder taken to infinity — the top rung nobody actually reaches, which is exactly why it's the wrong prediction for real play even though it remains the correct benchmark for how sophisticated a counterparty could in principle be.
      The strategic rule that follows is to model the depth of the specific opponents in front of you, not the theoretical fixed point: reasoning one level deeper than where the actual crowd sits wins, reasoning many levels deeper wastes effort beating opponents who don't exist, and reasoning too shallow leaves you the level-$0$ player everyone else exploits. This is genuinely useful outside the toy game too — a market of retail counterparties plausibly sits shallow, while a fellow trading desk might sit two or three levels deeper, and guessing that gap correctly is itself a skill worth having.
    worked: >
      Apply the same ladder to a "guess three-quarters of the average" variant on $[0,100]$. Level $0$, playing uniformly at random, averages $50$. Level $1$ best-responds with $0.75\times 50 = 37.5$. Level $2$ best-responds to that with $0.75\times 37.5 = 28.125$. Level $3$ gives $0.75\times 28.125 \approx 21.09$. Compare this to the two-thirds game, where level $2$ already lands near $22$: because $3/4$ is closer to $1$ than $2/3$ is, the ladder shrinks more slowly here, so matching where a real population sits generally takes reasoning one level deeper.
    interview: >
      "What would you actually guess, and why?" wants a specific level named for the specific counterparty pool, derived live from the multiplier and a level-$0$ baseline, rather than a memorized "$22$" detached from whichever game is actually being asked about.
    pitfalls: >
      Treating "level $2$" as a universal answer regardless of who you're playing against — a room of game theorists sits far deeper than a room of casual players, and the right level depends on the actual pool. Conflating the cognitive-hierarchy equilibrium, the theoretical top of the ladder, with a prediction of real behavior, which it explicitly is not.
    recap: >
      Model the reasoning depth of the opponents actually in front of you and play one level deeper — the equilibrium is the limit of that ladder, useful as a benchmark but reached by nobody real.
    dialogue:
      - part: Climbing the ladder
        ask: >
          A large room plays "closest to $70\%$ of the average wins" on
          $[0, 100]$. You believe everyone else picks a number uniformly at
          random. What do you name?
        expects: "35"
        feedback: >
          A random room averages $50$, so the target is $0.7 \cdot 50 = 35$.
      - ask: >
          Now you believe everyone else reasons exactly as you just did. What
          do you name?
        expects: "24.5"
        tolerance: 0.01
        feedback: >
          If everyone names $35$, the average is $35$ and the target
          $0.7 \cdot 35 = 24.5$.
      - ask: >
          One more step: everyone else names $24.5$. What do you name?
        expects: "17.15"
        tolerance: 0.01
        feedback: >
          $0.7 \cdot 24.5 = 17.15$. Each step multiplies by $0.7$, and the
          ladder runs down toward the equilibrium at $0$.
      - reflect: >
          Every rung is a best reply to a belief about the room. Which rung
          should you actually submit, and what would you need to know to
          choose?
        answer: >
          How deep the room reasons. The right guess is one step above where
          the room actually is: below it you are the one being out-thought,
          above it you are best-responding to players who are not there. The
          equilibrium is the top of the ladder, and it wins only if the room
          has climbed all the way up.
      - teach: >
          The cognitive-hierarchy model reads a population as a mix of
          reasoning depths. Level $0$ plays without modelling anyone; level
          $k$ best-responds to the belief that everyone else is at level
          $k - 1$. In experiments, typical depths centre between $1$ and $2$.
          The operating rule: play one step above where the flow actually
          is, not where theory says it should be.

      - part: Too shallow, too deep
        ask: >
          The room turns out to be all level $1$: everyone names $35$. Which
          of your rungs wins?
        choices:
          - text: >
              $35$, matching the room.
            feedback: >
              The target is $0.7 \cdot 35 = 24.5$, and $35$ is $10.5$ away from
              it — along with everyone else.
          - text: >
              $24.5$, one step above the room.
            correct: true
            feedback: >
              The target is exactly $24.5$. One step above the room's actual
              depth hits it.
          - text: >
              $17.15$, since deeper reasoning is safer.
            feedback: >
              Deeper is not safer: $17.15$ is $7.35$ below the target. You
              out-thought a room that was not thinking that hard.
          - text: >
              $0$, the equilibrium.
            feedback: >
              $0$ is $24.5$ away, the farthest of all. Against this room the
              equilibrium is the worst guess on the list.
        feedback: >
          Too shallow and you are the sucker; too deep and you are beating
          opponents who do not exist. The cost of overshooting is as real as
          the cost of undershooting.
      - ask: >
          A more realistic room: $30\%$ level $0$ (averaging $50$), $50\%$
          level $1$ (naming $35$) and $20\%$ level $2$ (naming $24.5$). What is
          the target?
        expects: "26.18"
        tolerance: 0.05
        hint: >
          Average the three groups by their shares, then take $70\%$.
        feedback: >
          The average is $0.3(50) + 0.5(35) + 0.2(24.5) = 15 + 17.5 + 4.9 =
          37.4$, and the target is $0.7 \cdot 37.4 = 26.18$ — just above the
          level-$2$ answer, because the room as a whole sits near level $1$.

      - part: When the room changes
        ask: >
          Next week you play the same game at a conference of game theorists,
          who have all seen it before. What should change?
        choices:
          - text: >
              Nothing: humans average around level $1$ to $2$, so keep the
              same guess.
            feedback: >
              That figure describes typical rooms, not this one. A room of
              specialists who know the game sits much deeper, and last
              week's guess would now be too shallow.
          - text: >
              Guess lower: this room climbs further, so one step above it is
              further down the ladder.
            correct: true
            feedback: >
              Same rule, different room. Against specialists the equilibrium
              becomes a better forecast, which is exactly why it is worth
              knowing.
          - text: >
              Name $0$, since now everyone will.
            feedback: >
              Even specialists rarely all go to $0$ — some expect others not
              to. Estimate the room's depth; do not assume it is infinite.
        feedback: >
          Model the depth of the players you actually face. The equilibrium is
          still worth computing: it is the top of the ladder, and the place a
          sophisticated counterparty, or a room that plays repeatedly, drifts
          toward.
      - ask: >
          Which statement best captures when the equilibrium guess is the
          right one to submit?
        choices:
          - text: >
              Always: it is the only guess that is a best reply to itself.
            feedback: >
              It is a best reply to itself — that is, to a room that also
              plays it. Against any other room, some other guess does better.
          - text: >
              When the room you face is itself at, or very near, equilibrium.
            correct: true
            feedback: >
              A best reply is to the room, and the equilibrium is the best
              reply only to an equilibrium room.
          - text: >
              Never: equilibrium reasoning has nothing to say about real
              people.
            feedback: >
              It says where the ladder ends, which tells you which way
              deeper reasoning pushes and where experienced players converge.
              It is the limit, not the forecast.
        feedback: >
          In an interview, say both halves: "The equilibrium is $0$; but this
          room probably reasons one or two steps deep, so I would aim one step
          beyond that."

  - node: quant-games.game-theory.repeated-cooperation
    hook: >
      "Would a cartel survive indefinitely, or eventually collapse?" hinges entirely on whether the horizon is a known, finite number of rounds or not — and stating that distinction first is the whole answer to whether patience can rescue cooperation.
    explanation: >
      A known finite horizon unravels cooperation completely by the same folding logic used elsewhere in this unit: the final round is a one-shot dilemma with nothing beyond it, so both players defect there regardless of history, which makes the second-to-last round's continuation independent of what happens in it too, and the unraveling runs all the way back to the very first round. An infinite or genuinely unknown-length horizon removes the anchor that backward induction needs to start folding from, which is exactly what lets a credible ongoing threat sustain cooperation instead.
      Grim trigger — cooperate until any defection is observed, then defect forever after — is self-enforcing without needing any of the fresh commitment machinery from credible threats, because the punishment phase is just repeating the one-shot dominant strategy indefinitely, something neither player has any independent reason to deviate from. With temptation payoff $T$, mutual-cooperation payoff $R$, mutual-defection payoff $P$, and discount factor $\delta$, cooperating forever is worth $R/(1-\delta)$ while defecting once and then facing permanent punishment is worth $T+\delta P/(1-\delta)$; cooperation survives exactly when $\delta \ge (T-R)/(T-P)$ — patience, not goodwill, is the entire mechanism, and the threshold itself depends on the specific payoff numbers, not on some universal constant.
    worked: >
      Return to the OPEC output game, where mutual cutting pays $(6,6)$, flooding against a cutter pays the flooder $9$ and the cutter $2$, and mutual flooding pays $(4,4)$, so $T=9$, $R=6$, $P=4$. Cooperating forever under grim trigger is worth $6/(1-\delta)$; flooding once and then facing permanent mutual flooding is worth $9+4\delta/(1-\delta)$. Setting $6/(1-\delta)\ge 9+4\delta/(1-\delta)$ and clearing denominators gives $6\ge 9-5\delta$, so $\delta\ge 3/5$. Using the general formula directly, $(T-R)/(T-P)=(9-6)/(9-4)=3/5$, confirming the same threshold — notably higher than the $1/2$ threshold for the original prisoners' dilemma numbers, since the temptation-to-defect gain here is relatively larger.
    interview: >
      "Would you expect this cartel to hold together?" wants the known-versus-unknown horizon distinction stated first, then the general threshold $\delta^{*}=(T-R)/(T-P)$ derived live from whatever specific payoffs are given, not a memorized $1/2$.
    pitfalls: >
      Assuming any repeated prisoners' dilemma sustains cooperation regardless of horizon — a known finite horizon unravels it completely no matter how many rounds remain. Reciting "$\delta\ge 1/2$" as if it were a universal constant instead of rederiving $(T-R)/(T-P)$ from the actual payoff numbers of the game in front of you.
    recap: >
      A known finite horizon unravels cooperation entirely by backward induction, while an open-ended one sustains it under grim trigger whenever $\delta\ge (T-R)/(T-P)$ — patience, not goodwill, and a threshold that depends on the actual payoffs.
    dialogue:
      - part: Three known days
        teach: >
          Two desks share a client and each day choose to Cooperate, sharing
          their axes, or Defect, front-running the other. Daily payoffs
          $(\text{row}, \text{column})$: both Cooperate, $(7,7)$; Defect
          against Cooperate, $(10,0)$; Cooperate against Defect, $(0,10)$;
          both Defect, $(2,2)$. The client's account closes after exactly three
          days, and both desks know it.
      - ask: >
          What happens on day three, the last?
        choices:
          - text: >
              Both cooperate, having built trust over two days.
            feedback: >
              On the last day nothing comes after, so the day is a one-shot
              dilemma: Defect pays $10$ against $7$ and $2$ against $0$.
              Trust has nothing left to buy.
          - text: >
              Both defect: with no tomorrow, Defect strictly dominates.
            correct: true
            feedback: >
              Day three is the one-shot game, and defection dominates in it
              whatever happened before.
          - text: >
              Whoever was cheated earlier defects; the other cooperates.
            feedback: >
              Grudges and gratitude only matter if they change future
              payoffs. On the last day there is no future, and both defect.
        feedback: >
          Fold from the end: the last day is settled before anything else.
      - ask: >
          Day two. A desk reasons: "If I cooperate today, she will reward me
          tomorrow." Is that right?
        choices:
          - text: >
              Yes: cooperation today is repaid on day three.
            feedback: >
              Day three is mutual defection whatever happens today; you just
              showed that. Today's choice cannot change tomorrow, so it buys
              nothing.
          - text: >
              No: day three is defection regardless, so day two is a one-shot
              dilemma too.
            correct: true
            feedback: >
              With tomorrow's payoff fixed at $2$ whatever you do today, today
              is judged on its own, and Defect dominates.
          - text: >
              Only if she cooperated on day one.
            feedback: >
              Her day-one choice does not change the day-three outcome either.
              Nothing anyone does today moves tomorrow.
        feedback: >
          The same argument then covers day one. A known last round unravels
          cooperation all the way back to the start.
      - ask: >
          What does each desk collect over the three days in the
          subgame-perfect equilibrium?
        expects: "6"
        feedback: >
          Mutual defection every day: $2 + 2 + 2 = 6$, against the $21$ that
          three days of cooperation would have paid each.
      - reflect: >
          What would have to change about the horizon for cooperating today
          to be rewarded tomorrow?
        answer: >
          There must be no known last day. If the relationship might always
          continue — forever, or until an end date no one can see — then every
          day has a tomorrow in which to reward cooperation or punish
          defection, and the fold from the end never gets started. The weight
          on that tomorrow then decides whether the reward is big enough.

      - part: A relationship with no last day
        teach: >
          Suppose the desks share the client indefinitely and value a payoff
          one day out at $\delta$ times its value today. Each plays grim
          trigger: cooperate until the other defects once, then defect
          forever. A stream worth $x$ every day is worth
          $x + \delta x + \delta^{2} x + \cdots = x/(1 - \delta)$.
      - ask: >
          With $\delta = 0.5$, what is cooperating forever worth to a desk
          today?
        expects: "14"
        feedback: >
          $7/(1 - 0.5) = 14$.
      - ask: >
          With $\delta = 0.5$, what is defecting today worth, given that the
          other desk then defects forever?
        expects: "12"
        hint: >
          $10$ today, then $2$ a day starting tomorrow.
        feedback: >
          $10 + 2\delta/(1 - \delta) = 10 + 2(0.5)/0.5 = 12$. Cooperating's
          $14$ beats it, so neither desk defects.
      - ask: >
          What is the smallest $\delta$ at which grim trigger sustains
          cooperation?
        expects: "3/8"
        hint: >
          Set $7/(1 - \delta) \ge 10 + 2\delta/(1 - \delta)$ and clear the
          denominator.
        feedback: >
          $7 \ge 10(1 - \delta) + 2\delta = 10 - 8\delta$, so $\delta \ge 3/8$.
          That is $(T - R)/(T - P) = (10 - 7)/(10 - 2)$. Read it as a trade:
          defecting gains $T - R = 3$ today and loses $R - P = 5$ every day
          after, and $3 \le 5\delta/(1 - \delta)$ is the same condition.
      - teach: >
          So the proposition: repeat a prisoners' dilemma a known finite
          number of times and backward induction kills cooperation in every
          round. With an infinite horizon, grim trigger sustains cooperation
          exactly when $\delta \ge (T - R)/(T - P)$. Patience, not goodwill,
          does the work — and the folk theorem extends this to most
          individually rational payoff pairs.
      - ask: >
          The sucker's payoff $S = 0$ appears nowhere in $3/8$. Why?
        choices:
          - text: >
              Because $S = 0$ happens to vanish from the arithmetic.
            feedback: >
              Change $S$ to $1$ and the threshold is still $3/8$. It is
              absent for a structural reason, not an arithmetic one.
          - text: >
              Under grim trigger the deviator only ever meets cooperation and
              then defection, so nobody is ever the sucker.
            correct: true
            feedback: >
              The two paths compared are all-$R$ and one $T$ followed by
              all-$P$. $S$ is the payoff for cooperating against a defector,
              and neither path contains it.
          - text: >
              Because the sucker's payoff only matters in finite games.
            feedback: >
              The horizon is not what keeps it out. Under grim trigger, the
              two paths being compared never visit the cell where someone
              cooperates against a defector.
        feedback: >
          Read a threshold off the two paths it compares. Change the
          punishment and you change which payoffs appear.

      - part: Where patience runs out
        ask: >
          Front-running becomes more lucrative, raising $T$ from $10$ to
          $13$. What is the new threshold?
        expects: "6/11"
        feedback: >
          $(13 - 7)/(13 - 2) = 6/11 \approx 0.55$, up from $3/8$. A larger
          temptation needs more patience, and desks with $\delta = 0.5$ now
          defect.
      - ask: >
          Instead of an infinite horizon, the account closes some day without
          warning: each day there is a $10\%$ chance it is the last. The desks
          care about the future otherwise fully. With $T = 10$ again, does
          cooperation survive?
        choices:
          - text: >
              No: the game is finite with certainty, so it unravels.
            feedback: >
              Unravelling needs a *known* last day to fold back from. Here no
              day is ever known to be the last, so there is nowhere to start.
          - text: >
              Yes: a $90\%$ chance of another day acts like $\delta = 0.9$,
              well above $3/8$.
            correct: true
            feedback: >
              An unknown end date works exactly like discounting: tomorrow
              counts with weight $0.9$. Cooperation survives with room to
              spare.
          - text: >
              No: a $10\%$ daily risk of ending is too much; cooperation needs
              the end to be impossible.
            feedback: >
              The condition is only $\delta \ge 3/8$, and a $90\%$ chance of
              another day clears it easily. The end may be possible, even
              likely eventually; it just must never be known in advance.
        feedback: >
          Said aloud: "Known last round, it unravels by backward induction.
          Open-ended, cooperation holds under grim trigger iff
          $\delta \ge (T - R)/(T - P)$ — patience, not goodwill."
