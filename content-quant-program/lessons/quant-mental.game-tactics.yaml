unit: quant-mental.game-tactics
opening: >
  This unit turns an already-known scoring rule and an already-known
  arithmetic toolkit into a decision procedure for playing a timed
  quantitative round well: when a partial guess is worth the risk, how
  fast to actually go, in what order to attack the questions, and which
  checks are cheap enough to run on every single answer. The arc runs
  from the scoring rule itself, to the guessing threshold it implies,
  through a worked case where eliminating one option flips a break-even
  guess into a profitable one, into the physical fact that error rate
  bends upward sharply near your top speed, and out to pace, sequencing,
  checking, and the composure that keeps you off the steep part of that
  curve. Nothing here replaces arithmetic skill — it decides how to
  deploy the arithmetic skill you already have under a clock.
lessons:
  - node: quant-mental.game-tactics.scoring-rules
    hook: >
      Every guessing, pacing, and sequencing decision in this chapter
      reduces to a single number pulled from this rule — get the rule
      wrong and every downstream tactic computes the wrong answer with
      perfect internal consistency.
    explanation: >
      A scoring rule is nothing more than three numbers attached to
      three outcomes: reward $a$ for a correct answer, penalty $b$ for a
      wrong one, and usually $0$ for a skip. What matters downstream is
      never $a$ and $b$ individually, only their ratio $b/a$ — doubling
      both numbers doubles every score in the round but changes no
      decision, because every comparison later in this chapter is a
      comparison of expected values, and expected values scale linearly
      with the reward unit.

      Concretely, a $+2/-1$ rule and a $+6/-3$ rule are the same game in
      disguise — both have $b/a=1/2$ — so any guessing threshold, pacing
      choice, or sequencing decision you'd make under one is identical
      under the other. Only the units of the final score differ.

      This is why the first move on seeing a new timed test is to
      extract $a$ and $b$ and reduce them to that single ratio, not to
      memorize the raw point values. A no-penalty test ($b=0$) collapses
      every later guessing decision to "always attempt," since skipping
      can never beat a nonnegative expected score; a harsh $+1/-2$ test
      compresses the safe zone dramatically, since a wrong answer now
      costs twice what a right one earns.
    worked: >
      A trading-desk mental-math round scores $+4$ for a correct answer
      and $-3$ for a wrong one, nothing for a skip. Reduce it: $b/a=3/4
      =0.75$. That single number is already comparable across tests
      without touching a formula — it sits above the SAT's $1/4$ and
      even above the harsh $+1/-2$ example's $2/3$, so this round's
      break-even confidence bar will end up higher than either.
    interview: >
      When an interviewer states a scoring rule out loud, often as an
      aside mid-question, repeating it back as a reduced ratio ("so
      that's a three-to-four penalty") signals you've internalized the
      one number that drives everything that follows, rather than
      needing the raw values restated later.
    pitfalls: >
      Anchoring on the raw reward $a$ — assuming a bigger $+a$ always
      means a more forgiving test — ignores that only the ratio to $b$
      matters; a $+10/-10$ test is exactly as harsh as $+1/-1$. Treating
      a nonzero skip credit $c$ as irrelevant is also a mistake: it
      doesn't change the ratio comparison but does shift the zero
      baseline every expected-value calculation compares against.
    recap: >
      A scoring rule collapses to one number, $b/a$, and every guessing,
      pacing, and sequencing decision that follows depends on nothing
      else about it.

  - node: quant-mental.game-tactics.guessing-ev
    hook: >
      The instant an interviewer asks "would you guess here," this is
      the entire computation you're expected to produce in your head —
      one inequality, no scratch paper.
    explanation: >
      Attempting a question you'll answer correctly with probability $p$
      earns $a$ with probability $p$ and loses $b$ with probability
      $1-p$, so its expected score is $pa-(1-p)b$; skipping guarantees
      exactly $0$. Collecting the $p$ terms and dividing by $a+b$ turns
      "attempt beats skip" into the single inequality $p>b/(a+b)$ — the
      whole derivation is nothing but comparing two expected values, the
      same object from the expectation chapter, applied to two possible
      actions instead of one random payoff.

      Read the threshold as the reward's share of the total point swing
      $a+b$: a symmetric $+1/-1$ rule splits that swing down the middle,
      so any lean past even odds is worth taking, while an asymmetric
      rule shifts the split — a bigger penalty demands a bigger share of
      confidence before the reward side wins the comparison.

      Nothing here is new machinery beyond expectation itself; it's two
      expected values set against each other, and the threshold is just
      where they cross.
    worked: >
      Take a $+2/-3$ rule: correct answers earn $2$, wrong answers cost
      $3$. The threshold is $p>b/(a+b)=3/5=0.6$. At $p=0.55$ — a real
      lean, but short of confident — skip: expected score of attempting
      is $0.55(2)-0.45(3)=1.1-1.35=-0.25$, confirming the negative
      verdict. Push confidence to $p=0.65$ and the same rule flips:
      $0.65(2)-0.35(3)=1.3-1.05=0.25>0$, now worth attempting.
    interview: >
      "Would you guess on this one" is asked with a stated or implied
      scoring rule and an implied confidence level; the fluent answer
      states the threshold formula, plugs in the numbers, and gives a
      yes-or-no in one breath, not a vague "depends how sure I am."
    pitfalls: >
      Comparing $p$ to $1/2$ out of habit even when the rule isn't
      symmetric is the most common slip — the bar moves with the rule,
      and a $+1/-2$ test demands $p>2/3$, not $p>1/2$. Computing attempt
      EV as $pa-b$ instead of $pa-(1-p)b$ forgets the penalty term is
      itself weighted by $(1-p)$, which understates the value of every
      guess and tips you toward skipping when attempting was correct.
    recap: >
      Attempt exactly when your confidence clears $b/(a+b)$; below it,
      skipping's guaranteed $0$ beats the guess.

  - node: quant-mental.game-tactics.partial-credit-guessing
    hook: >
      "Down to two options — do you guess" is asked expecting a fresh
      computation, not a reflex "yes, elimination always helps" — the
      SAT case that motivates this generalizes, but not automatically.
    explanation: >
      Many standardized $n$-choice tests set $b=a/(n-1)$ specifically so
      a uniformly blind guess sits exactly at the threshold: with
      $p=1/n$ and $b/(a+b)=1/n$ forced by that choice of $b$, blind
      guessing is neither punished nor rewarded. This isn't an accident
      of the SAT's particular numbers — it's the calibration rule behind
      any $n$-choice test scored this way, and it generalizes the
      five-choice case directly.

      Eliminating $k$ wrong options raises your conditional confidence
      from $1/n$ to $1/(n-k)$ on the survivors, strictly increasing $p$
      while $a$, $b$, and the threshold stay fixed — so elimination
      always pushes you toward or past the bar. What it does not do is
      guarantee crossing it: how much elimination is needed depends on
      how far the rule's actual threshold sits above the calibrated
      $1/n$ starting point.
    worked: >
      A four-choice test scored $+1$ correct, $-\tfrac{1}{3}$ wrong
      follows the same calibration: $b=a/(n-1)=1/3$ exactly. Blind
      guess: $p=1/4$, and $\tfrac14(1)-\tfrac34(\tfrac13)=\tfrac14
      -\tfrac14=0$ — indifferent again, confirming the design principle
      holds for $n=4$, not just five choices. Eliminate one wrong option
      and $p$ rises to $1/3$: $\tfrac13(1)-\tfrac23(\tfrac13)=\tfrac13
      -\tfrac29=\tfrac19>0$ — profitable, the same qualitative jump as
      the five-choice case.
    interview: >
      The compressed version of this whole example is "down to two —
      guess or not?" The fast answer recomputes $p$ from the number of
      survivors and checks it against the rule's own threshold, rather
      than reciting "always guess after elimination" as a blanket rule.
    pitfalls: >
      Assuming any elimination automatically makes guessing worth it
      skips the check: under a harsher $+1/-2$ rule (threshold
      $p>2/3$) on the same four-choice test, eliminating one option
      gives $p=1/3$ and eliminating two gives $p=1/2$ — both still below
      the bar, so guessing stays wrong until only one choice is left.
    recap: >
      Elimination always raises your confidence toward the guessing bar,
      but whether it actually clears the bar is a fresh computation
      against the rule's own threshold, not a free pass.

  - node: quant-mental.game-tactics.speed-accuracy
    hook: >
      Racing to your top speed feels like it should maximize points, but
      the accuracy you're trading away accelerates exactly where the
      time you're saving slows down — the edge is close to the worst
      place on the curve to operate.
    explanation: >
      Error rate, plotted against how fast you're working, is not a
      straight line. Comfortably below your ceiling, going noticeably
      faster costs almost nothing in accuracy — you're cutting slack you
      didn't need. Close to your absolute limit, the same increment in
      speed produces a disproportionate jump in mistakes: the curve
      bends upward, convex rather than linear.

      Picture a mental-math drill where a comfortable pace of one answer
      every 10 seconds runs 2 percent errors; pushing to one every 7
      seconds might only raise that to 5 percent, but pushing further to
      one every 5 seconds can jump errors to 25 percent or more — the
      same 2-second cut in each step costs an increasingly larger
      accuracy price, because the fast regime forces you to skip steps
      (a recheck, a carry, a sign) that the slower regime had room for.

      The implication is where to aim: not the fastest pace you can
      sustain at all, but the knee of this curve — the point where the
      accuracy cost per unit of speed gained starts to explode. Locating
      that knee, not racing the edge, is what the rest of this chapter
      turns into an actual optimization.
    interview: >
      This rarely shows up as a question asked outright — it's a
      pattern watched for during a live mental-math or estimation round.
      An interviewer clocking your pace notes where your error rate
      visibly jumps, and easing off before that point shows you can feel
      the curve rather than needing it drawn for you.
    pitfalls: >
      Treating your error rate as roughly constant across paces and
      extrapolating from a slow, accurate trial run to a much faster
      pace ignores exactly the part of the curve that bends. Assuming
      the knee is fixed rather than personal is a second trap — it moves
      down as fatigue sets in, so a pace safe in the first ten minutes
      may not stay safe in the last ten.
    recap: >
      Error rate rises convexly, not linearly, as pace approaches your
      limit, so the last slice of speed costs far more accuracy than the
      slice before it.

  - node: quant-mental.game-tactics.optimal-pace
    hook: >
      This is the moment the guessing threshold and the speed-accuracy
      curve combine into an actual number: not "go as fast as you safely
      can," but a specific pace that beats every other pace at points
      scored per second.
    explanation: >
      Expected score rate is $(p(v)a-(1-p(v))b)/t(v)$: the numerator is
      exactly the attempt-EV from the guessing threshold, evaluated at
      the accuracy you'd have working at speed $v$, and the denominator
      is the time per question at that speed — the ratio is points
      earned per second of round time, the quantity a timed round
      actually pays on.

      At low speed the rate is held back only by wasted time, not by an
      accuracy problem, so speeding up from the slow end is close to
      free. Near your limit, $p(v)$ collapses fast enough (the convex
      bend from the speed-accuracy curve) that the numerator's drop
      outpaces the denominator's shrinkage, so the rate falls even
      though each question takes less time. The crossover between these
      two regimes is an interior maximum, strictly below top speed.

      The penalty $b$ controls how far below top speed that maximum
      sits: since the numerator's accuracy-loss term is weighted by $b$,
      a harsher penalty punishes the same speed increase more, pulling
      the optimum slower still. Under $b=0$ the accuracy term drops out
      of the numerator entirely, and the tradeoff collapses toward pure
      speed.
    worked: >
      Three candidate paces on a $+1/-1$ round: Pace A takes 10 seconds
      per question at 90 percent accuracy, Pace B takes 6 seconds at 75
      percent, Pace C takes 4 seconds at 55 percent. Attempt-EV per
      question is $2p-1$: $0.8$, $0.5$, and $0.1$ respectively. Dividing
      by time per question gives the rate: $0.8/10=0.08$,
      $0.5/6\approx0.083$, $0.1/4=0.025$ points per second. Pace B wins,
      narrowly beating even the safest option A, while the fastest pace
      C is worst by a wide margin — the maximum sits at the middle pace,
      and only computing the rate reveals it.
    interview: >
      "How much slower should you go than your fastest safe pace" is
      answered by naming the rate comparison, not intuition — the
      winning pace maximizes points per second, a genuinely different
      ranking from maximizing points per question or minimizing errors.
    pitfalls: >
      Ranking paces by raw per-question EV instead of EV per unit time
      silently favors the slowest safe pace every time — in the worked
      example, Pace A's $0.8$ EV per question looks better than Pace
      B's $0.5$, until time enters the comparison. Assuming "slower is
      always safer" ignores the no-penalty regime, where a low $b$
      shifts the optimum back toward raw speed.
    recap: >
      The pace that maximizes points per second is an interior point
      found by comparing rates directly, and it moves slower as the
      wrong-answer penalty grows.

  - node: quant-mental.game-tactics.sequencing
    hook: >
      The order you attack questions in is a second, independent lever
      from which questions you attempt — get it wrong and a round with
      plenty of points available on paper still ends with half of them
      unclaimed.
    explanation: >
      Treat a timed round as a fixed time budget with points of varying
      size and cost scattered across it: the allocation rule that
      maximizes total points is to clear the fast, confident questions
      first, because a hard question stuck early can consume time that
      easy, high-value points later in the set needed, and that always
      beats working through a fixed printed order.

      Mechanically this is a two-pass sweep: scan and classify first,
      clear everything fast and confident, flag anything slow or
      uncertain, and only return to the flagged set once the cheap sweep
      is exhausted — and even then, attempt a flagged item only if its
      confidence separately clears the guessing threshold.

      Wasted time is worse than a plain skip: time sunk into a question
      you never finish steals from questions you would have finished,
      while a clean skip at least costs nothing beyond the single
      question skipped.
    worked: >
      A $+1/-1$ round has 300 seconds left and 4 unattempted questions:
      three easy ones taking 60 seconds each at 90 percent confidence
      (EV $=2(0.9)-1=0.8$ each), and one hard one taking 240 seconds at
      60 percent confidence (EV $=2(0.6)-1=0.2$). Banking the easy ones
      first uses 180 seconds for $3(0.8)=2.4$ points, leaving 120
      seconds — not enough for the hard question, skipped for $0$.
      Working in a fixed order that puts the hard question first
      instead: 240 seconds buys its $0.2$, leaving only 60 seconds,
      enough for one easy question ($0.8$), with the other two never
      reached. Banking easy first scores $2.4$; fixed order scores
      $0.2+0.8=1.0$ — more than double, from reordering the identical
      four questions.
    interview: >
      "You won't finish this round" is the setup line; the fluent
      response states you'd scan and triage before answering anything,
      not describe grinding through in the printed order.
    pitfalls: >
      Continuing a hard question because of time already sunk into it
      is the sequencing version of the sunk-cost trap — the decision to
      keep going should depend only on the time and points left.
      Flagging a question and never returning to it, even when it would
      have cleared the guessing threshold, throws away points the
      triage pass was meant to preserve.
    recap: >
      Clearing every fast, confident question before touching a slow
      one beats working in printed order, because unclaimed easy points
      cost more than one skipped hard question.

  - node: quant-mental.game-tactics.cheap-checks
    hook: >
      These checks exist because they target the specific way fast
      arithmetic actually breaks — not a general "be more careful" but a
      short, reflexive battery run on every answer before it leaves your
      mouth.
    explanation: >
      You already have one member of this battery: digit-sum-mod-9 and
      last-digit checks. Two more belong next to it. Parity asks whether
      the problem structurally forces the answer to be odd or even, and
      whether your answer matches. Magnitude rounds the inputs, guesses
      the order of size, and checks that your computed answer lands in
      that ballpark.

      Each check is a filter tuned to a specific failure mode. Parity
      catches sign- and last-operation errors that leave the wrong
      parity residue. Magnitude catches decimal-point slips and
      factor-of-ten errors that a digit-sum check sails right past,
      since digit sums don't care where the decimal point sits.
      Mod-9 and last-digit catch transposed or substituted digits that
      parity and magnitude both miss, since those don't change an
      answer's rough size or evenness. No single check is complete,
      which is why you run more than one.

      None of these require recomputing anything, so they run almost in
      parallel with writing the answer down, at a cost close to zero —
      exactly why the next lesson can recommend running them
      unconditionally.
    worked: >
      Compute $24\times35$. Round each input to the nearest ten first:
      $20\times40=800$, so the true product should land in the
      hundreds. The exact product is $840$ — consistent. Parity: $24$
      is even, so the product must be even regardless of the other
      factor; $840$ is even — consistent. Now suppose a decimal slip
      during fast mental work produces $8400$ or $84$ instead: both fail
      the magnitude check instantly, one an order of magnitude too
      large and the other too small, while only $840$ survives — and
      the mod-9 check from before would miss this entirely, since
      $8400$, $840$, and $84$ all share the same digit sum, $12$,
      reducing to $3$ mod $9$.
    interview: >
      This rarely appears as a standalone question; an interviewer
      running you through a rapid mental-math set is listening for you
      to narrate a check out loud before stating your final answer,
      rather than staying silent and hoping.
    pitfalls: >
      A magnitude check only bounds the order of size — it won't catch
      a same-scale error like a transposed digit ($840$ vs $480$, both
      plausible-looking hundreds), which is exactly what the last-digit
      and mod-9 checks exist to catch instead. Treating a passed check
      as proof of a correct answer overstates a necessary condition — it
      rules out a category of error, it doesn't confirm the arithmetic.
    recap: >
      Parity and magnitude are cheap filters tuned to the errors mod-9
      and last-digit checks miss — decimal slips and sign flips — and
      running all of them together costs a fraction of a second.

  - node: quant-mental.game-tactics.verification-budget
    hook: >
      "Should I double-check that" has a real answer, and it isn't
      "always" or "never" — it's whichever side of a specific
      cost-benefit line the particular check falls on.
    explanation: >
      A check is worth its time exactly when the points it's expected
      to protect exceed the points you'd earn spending that same time at
      your optimal pace instead. If a check costs $T$ seconds and, with
      probability $q$, catches a mistake worth the full $a+b$ point
      swing, its expected benefit is $q(a+b)$ against an opportunity
      cost of $rT$, where $r$ is your optimal-pace score rate — worth
      running exactly when $q>rT/(a+b)$.

      A one-second check has a tiny $T$, so its break-even $q$ is tiny
      too — almost any nonzero catch rate clears it, which is why cheap
      checks are a default, run on everything. A full recompute has $T$
      on the order of the time to solve the problem itself, making $rT$
      large, so $q$ needs to be large — often unrealistically so — to
      clear the bar, which is why full rechecks are reserved for answers
      that already feel shaky, not run as routine.
    worked: >
      At an optimal-pace rate of $r=0.1$ points per second on a
      $+1/-1$ round ($a+b=2$), a check pays off when $q>rT/(a+b)$. A
      1-second parity check needs only $q>0.1(1)/2=0.05$ — a 5 percent
      catch rate justifies it, easily cleared by the checks from before.
      A full 20-second recompute needs $q>0.1(20)/2=1.0$ — certainty
      that you're wrong, a bar an answer you're merely unsure about
      essentially never honestly clears.
    interview: >
      "Do you check every answer" is answered with the cost-benefit
      framing directly — state the opportunity cost of the time at your
      own scoring rate, not a blanket policy in either direction.
    pitfalls: >
      Running a full recompute out of general caution burns round time
      the arithmetic says is essentially never worth it at typical
      paces. Skipping even the free parity and magnitude checks because
      "time is precious" is the opposite mistake, since their break-even
      catch rate is close to zero. The break-even bar also scales with
      $a+b$: on a harsher-penalty test the same check protects more
      points and is worth relatively more time.
    recap: >
      A check pays exactly when the points it's expected to protect
      beat the points you'd earn spending that time at your optimal pace
      instead — nearly always true for a cheap check, nearly never true
      for a full recompute.

  - node: quant-mental.game-tactics.composure
    hook: >
      Interviewers watching you work through a timed set are not only
      grading the final number — a visibly improvised process, sped up
      or slowed down on the fly, is itself the signal they're reading.
    explanation: >
      Improvising decisions live — whether to check, what order to
      take, how to react when stuck — adds variance to your realized
      pace question to question. Because the error curve bends up
      sharply only near your limit, that added variance disproportionately
      lands you in the steep region even when your average pace looks
      fine on paper, since the costly excursions are the ones close to
      the edge, not the ones comfortably below it.

      A pre-committed routine — a fixed default order, a fixed default
      check, a fixed default reaction to getting stuck, such as flagging
      it and moving on — works like a guardrail keeping your realized
      pace off that steep stretch, at the cost of a little average speed
      you'd otherwise gain by improvising a shortcut when things happen
      to be going well.

      This is also why composure reads as a signal to an interviewer
      beyond simple comfort: a rehearsed routine generalizes to problems
      the interviewer hasn't seen worked out, while an improvised one
      offers no evidence about how you'll behave on the next one.
    interview: >
      "What do you do when you get stuck" is a composure question
      wearing an arithmetic costume — the answer that scores is a
      specific, pre-decided default reaction, not a description of
      trying harder in the moment.
    pitfalls: >
      Treating composure as a purely psychological instruction ("stay
      calm") rather than a concrete procedural commitment means there's
      no actual guardrail in place when pressure hits — the routine only
      works if it was decided in advance, not improvised under the exact
      pressure it's meant to protect against. Over-building the routine
      so it's slower than necessary even when nothing is going wrong
      gives up more average speed than the reduced variance is worth.
    recap: >
      A rehearsed default response to getting stuck trades a little
      average speed for a lot less variance, which is what keeps you off
      the steep part of the speed-accuracy curve when it matters.
