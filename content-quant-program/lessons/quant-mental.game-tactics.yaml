unit: quant-mental.game-tactics
opening: >
  This unit turns an already-known scoring rule and an already-known
  arithmetic toolkit into a decision procedure for playing a timed
  quantitative round well: when a partial guess is worth the risk, how
  fast to actually go, in what order to attack the questions, and which
  checks are cheap enough to run on every single answer. The arc runs
  from the scoring rule itself, to the guessing threshold it implies,
  through a worked case where eliminating one option flips a break-even
  guess into a profitable one, into the physical fact that error rate
  bends upward sharply near your top speed, and out to pace, sequencing,
  checking, and the composure that keeps you off the steep part of that
  curve. Nothing here replaces arithmetic skill — it decides how to
  deploy the arithmetic skill you already have under a clock.
lessons:
  - node: quant-mental.game-tactics.scoring-rules
    hook: >
      Every guessing, pacing, and sequencing decision in this chapter
      reduces to a single number pulled from this rule — get the rule
      wrong and every downstream tactic computes the wrong answer with
      perfect internal consistency.
    explanation: >
      A scoring rule is nothing more than three numbers attached to
      three outcomes: reward $a$ for a correct answer, penalty $b$ for a
      wrong one, and usually $0$ for a skip. What matters downstream is
      never $a$ and $b$ individually, only their ratio $b/a$ — doubling
      both numbers doubles every score in the round but changes no
      decision, because every comparison later in this chapter is a
      comparison of expected values, and expected values scale linearly
      with the reward unit.

      Concretely, a $+2/-1$ rule and a $+6/-3$ rule are the same game in
      disguise — both have $b/a=1/2$ — so any guessing threshold, pacing
      choice, or sequencing decision you'd make under one is identical
      under the other. Only the units of the final score differ.

      This is why the first move on seeing a new timed test is to
      extract $a$ and $b$ and reduce them to that single ratio, not to
      memorize the raw point values. A no-penalty test ($b=0$) collapses
      every later guessing decision to "always attempt," since skipping
      can never beat a nonnegative expected score; a harsh $+1/-2$ test
      compresses the safe zone dramatically, since a wrong answer now
      costs twice what a right one earns.
    worked: >
      A trading-desk mental-math round scores $+4$ for a correct answer
      and $-3$ for a wrong one, nothing for a skip. Reduce it: $b/a=3/4
      =0.75$. That single number is already comparable across tests
      without touching a formula — it sits above the SAT's $1/4$ but
      below the harsh $+1/-2$ rule's $2$, so this round's break-even
      confidence bar will end up between those two tests' bars.
    interview: >
      When an interviewer states a scoring rule out loud, often as an
      aside mid-question, repeating it back as a reduced ratio ("so
      that's a three-to-four penalty") signals you've internalized the
      one number that drives everything that follows, rather than
      needing the raw values restated later.
    pitfalls: >
      Anchoring on the raw reward $a$ — assuming a bigger $+a$ always
      means a more forgiving test — ignores that only the ratio to $b$
      matters; a $+10/-10$ test is exactly as harsh as $+1/-1$. Treating
      a nonzero skip credit $c$ as irrelevant is also a mistake: it
      shifts the baseline every expected-value calculation compares
      against, and measured from that baseline the rule becomes
      $+(a-c)/-(b+c)/0$, a harsher ratio than the raw $b/a$.
    recap: >
      A scoring rule collapses to one number, $b/a$, and every guessing,
      pacing, and sequencing decision that follows depends on nothing
      else about it.
    dialogue:
      - part: Three rounds, one set of answers
        teach: >
          You sit three practice rounds of $20$ questions and play each one
          identically: $13$ right, $5$ wrong, $2$ left blank. Round X pays
          $+2$ for a right answer and $-1$ for a wrong one. Round Y pays $+6$
          and $-3$. Round Z pays $+2$ and $-2$. A blank scores $0$ in all
          three.
      - ask: >
          What do you score in round X?
        expects: "21"
        hint: >
          Thirteen rewards, five penalties, two zeros.
        feedback: >
          $13(2) - 5(1) = 26 - 5 = 21$. The blanks contribute nothing.
      - ask: >
          And in round Y?
        expects: "63"
        hint: >
          Same answers, new point values.
        feedback: >
          $13(6) - 5(3) = 78 - 15 = 63$, exactly $3 \times 21$. Every number
          in round Y is three times round X's, so every score is too.
      - ask: >
          On a question you are unsure of, you must decide whether to answer
          or leave it blank. In which two rounds is that decision guaranteed
          to come out the same way, whatever your confidence?
        choices:
          - text: >
              X and Z: both pay $2$ for a right answer.
            feedback: >
              The reward matches, but a wrong answer costs $1$ in X and $2$ in
              Z. A guess that is right $60$ percent of the time averages
              $0.6(2) - 0.4(1) = 0.8$ per try in X and $0.6(2) - 0.4(2) = 0.4$
              in Z; at $40$ percent it is $0.2$ in X and $-0.4$ in Z. Same
              reward, different verdicts.
          - text: >
              X and Y: Y is X with every number tripled.
            correct: true
            feedback: >
              Tripling every outcome triples every total, and tripling never
              turns a positive total negative. Whatever beats leaving it blank
              in X beats it in Y.
          - text: >
              None of them: different numbers mean different games.
            feedback: >
              Your two totals already say otherwise: $63$ is $21$ rescaled.
              Changing the unit of points changes the scoreboard, not the
              comparisons on it.
        feedback: >
          X and Y are one game written in two currencies. Z is genuinely
          different, even though it shares X's reward.
      - ask: >
          In round Z, one wrong answer exactly cancels one right answer. In
          round X, how many wrong answers does it take to cancel one right
          answer?
        expects: "2"
        hint: >
          A right answer is worth $2$; each wrong one takes away $1$.
        feedback: >
          Two: $2 - 1 - 1 = 0$. In round Y it is also two, since $6 - 3 - 3 =
          0$. That shared count is what makes X and Y the same game.
      - reflect: >
          Round Y has bigger numbers than round X and the same game; round Z
          shares X's reward and is a different game. What single number,
          built from a round's reward and penalty, would tell you at a glance
          which rounds play alike?
        hint: >
          Your last answer was the same for X and Y and different for Z.
        answer: >
          The penalty measured in units of the reward: $b/a$, where $a$ is the
          reward and $b$ the penalty. X and Y both have $b/a = 1/2$, Z has
          $b/a = 1$. Multiplying both numbers by the same positive constant
          rescales every score without reordering any of them, so the ratio
          is all a decision can see.

      - part: What a rule actually is
        teach: >
          A scoring rule is the triple $+a$ for a right answer, $-b$ for a
          wrong one, $0$ for a blank, with $a, b > 0$; write it $+a/-b/0$.
          Every guess-or-skip, pacing and ordering decision depends on it only
          through $b/a$. The common conventions: no penalty ($b = 0$, so
          always answer), symmetric $+1/-1$ ($b/a = 1$), the SAT's
          five-choice $+1/-\tfrac{1}{4}$, and harsher $+1/-2$ rounds at some
          trading firms. Before you decide anything on a timed test, say the
          rule and reduce it to that one number.
      - ask: >
          Which round is the same game as $+3/-2/0$?
        choices:
          - text: >
              $+4/-3/0$: one point added to each side.
            feedback: >
              Adding the same amount is not rescaling. $b/a$ moves from
              $2/3$ to $3/4$, so this round punishes a wrong answer slightly
              harder relative to the reward.
          - text: >
              $+6/-2/0$: the reward doubled.
            feedback: >
              Only one side moved, so $b/a$ fell from $2/3$ to $1/3$. This is
              a much gentler round.
          - text: >
              $+9/-6/0$: both numbers tripled.
            correct: true
            feedback: >
              $6/9 = 2/3$, the same ratio. Every score is three times as big
              and every decision is unchanged.
        feedback: >
          Multiplying both numbers by one constant preserves the game; adding
          to them, or scaling only one, does not.
      - ask: >
          Which of these rounds is the harshest to guess under?
        choices:
          - text: >
              $+50/-40/0$
            feedback: >
              Big numbers, but $b/a = 40/50 = 0.8$. A wrong answer costs less
              than a right one earns.
          - text: >
              $+3/-4/0$
            correct: true
            feedback: >
              $b/a = 4/3$, the only round here where a wrong answer costs more
              than a right one pays. It is also the one with the smallest raw
              numbers.
          - text: >
              $+1/-1/0$
            feedback: >
              $b/a = 1$: harsher than $+50/-40$, but a wrong answer here only
              cancels a right one; in one of the other rounds it more than
              cancels it.
          - text: >
              $+20/-10/0$
            feedback: >
              $b/a = 1/2$, the gentlest of the four. A penalty of $10$ sounds
              large until you set it against a reward of $20$.
        feedback: >
          Harshness lives in $b/a$ alone: $0.5$, $0.8$, $1$, $4/3$. The raw
          sizes rank these rounds almost backwards.

      - part: A round that pays you to leave a blank
        teach: >
          One firm's round pays $+5$ for a right answer, $-1$ for a wrong one,
          and $+1$ for every question you leave blank. That is not of the form
          $+a/-b/0$, so $b/a$ cannot be read off it yet. The decision you
          face on each question is still the same one: answer, or leave it
          blank.
      - ask: >
          Measured against leaving the question blank, how many points does a
          wrong answer cost you?
        expects: "2"
        hint: >
          A blank would have paid $+1$; the wrong answer pays $-1$.
        feedback: >
          $-1 - 1 = -2$. Answering wrongly does not just lose a point, it also
          forfeits the point the blank would have banked.
      - ask: >
          Rewrite the round as an equivalent $+a/-b/0$ rule. What is its
          $b/a$?
        expects: "1/2"
        hint: >
          Subtract the blank's $1$ point from every outcome.
        feedback: >
          Subtracting $1$ everywhere gives $+4/-2/0$, so $b/a = 2/4 = 1/2$.
          Reading the raw $+5/-1$ as $b/a = 1/5$ would make the round look
          two and a half times gentler than it is. Shifting every outcome by
          the same amount changes no decision, which is why the subtraction
          is allowed here even though growing the reward and the penalty by a
          point each, in the last part, was not.
      - teach: >
          Out loud, this is one sentence before any arithmetic: "relative to
          a blank that's plus four, minus two, so a one-to-two penalty." An
          interviewer who hears the rule reduced unprompted knows every
          decision you make next starts from the right number.

  - node: quant-mental.game-tactics.guessing-ev
    hook: >
      The instant an interviewer asks "would you guess here," this is
      the entire computation you're expected to produce in your head —
      one inequality, no scratch paper.
    explanation: >
      Attempting a question you'll answer correctly with probability $p$
      earns $a$ with probability $p$ and loses $b$ with probability
      $1-p$, so its expected score is $pa-(1-p)b$; skipping guarantees
      exactly $0$. Collecting the $p$ terms and dividing by $a+b$ turns
      "attempt beats skip" into the single inequality $p>b/(a+b)$ — the
      whole derivation is nothing but comparing two expected values, the
      same object from the expectation chapter, applied to two possible
      actions instead of one random payoff.

      Read the threshold as the penalty's share of the total point swing
      $a+b$: a symmetric $+1/-1$ rule splits that swing down the middle,
      so any lean past even odds is worth taking, while an asymmetric
      rule shifts the split — a bigger penalty demands a bigger share of
      confidence before the reward side wins the comparison.

      Nothing here is new machinery beyond expectation itself; it's two
      expected values set against each other, and the threshold is just
      where they cross.
    worked: >
      Take a $+2/-3$ rule: correct answers earn $2$, wrong answers cost
      $3$. The threshold is $p>b/(a+b)=3/5=0.6$. At $p=0.55$ — a real
      lean, but short of confident — skip: expected score of attempting
      is $0.55(2)-0.45(3)=1.1-1.35=-0.25$, confirming the negative
      verdict. Push confidence to $p=0.65$ and the same rule flips:
      $0.65(2)-0.35(3)=1.3-1.05=0.25>0$, now worth attempting.
    interview: >
      "Would you guess on this one" is asked with a stated or implied
      scoring rule and an implied confidence level; the fluent answer
      states the threshold formula, plugs in the numbers, and gives a
      yes-or-no in one breath, not a vague "depends how sure I am."
    pitfalls: >
      Comparing $p$ to $1/2$ out of habit even when the rule isn't
      symmetric is the most common slip — the bar moves with the rule,
      and a $+1/-2$ test demands $p>2/3$, not $p>1/2$. Computing attempt
      EV as $pa-b$ instead of $pa-(1-p)b$ forgets the penalty term is
      itself weighted by $(1-p)$, which understates the value of every
      guess and tips you toward skipping when attempting was correct.
    recap: >
      Attempt exactly when your confidence clears $b/(a+b)$; below it,
      skipping's guaranteed $0$ beats the guess.
    dialogue:
      - part: One shaky answer
        teach: >
          A firm's mental-math round pays $+5$ for a right answer, $-3$ for a
          wrong one and $0$ for a blank. On question fourteen you have an
          answer you would put at $45$ percent to be right. The alternative is
          to leave it blank and move on.
      - ask: >
          What is the expected score of writing your answer down?
        expects: "0.6"
        hint: >
          With probability $0.45$ you gain $5$; otherwise you lose $3$.
        feedback: >
          $0.45(5) - 0.55(3) = 2.25 - 1.65 = 0.6$ points, against exactly $0$
          for the blank.
      - ask: >
          So do you answer or leave it blank?
        choices:
          - text: >
              Leave it blank: you are less than $50$ percent sure.
            feedback: >
              Fifty percent is the bar only when a wrong answer costs exactly
              what a right one pays. Here a wrong answer costs $3$ and a right
              one pays $5$, and you just computed that answering is worth
              $+0.6$.
          - text: >
              Leave it blank: more often than not you lose $3$ points.
            feedback: >
              True of this one question, but a round is forty of these
              decisions, and what accumulates over forty is the average. Each
              time you answer at $45$ percent you bank $0.6$ points on
              average; each time you blank it you bank $0$.
          - text: >
              Answer: $0.6$ beats the blank's $0$.
            correct: true
            feedback: >
              The decision is a comparison of two expected values, and the
              answer side wins by $0.6$ points.
        feedback: >
          Answering is right here even though you expect to be wrong. The
          size of the penalty relative to the reward decides it, not whether
          you are past even odds.

      - part: A dozen shaky answers
        teach: >
          The round has $40$ questions and about a dozen will leave you
          unsure, each at its own confidence: $45$ percent here, $30$ there,
          $60$ on another. Each expected value takes five seconds of
          arithmetic you would rather spend on the next question.
      - ask: >
          Same round. On another question you are $35$ percent sure. What is
          the expected score of answering?
        expects: "-0.2"
        hint: >
          $0.35$ of the time you gain $5$; $0.65$ of the time you lose $3$.
        feedback: >
          $0.35(5) - 0.65(3) = 1.75 - 1.95 = -0.2$. Ten points of confidence
          lower and the verdict flips: leave this one blank.
      - reflect: >
          At $45$ percent answering wins and at $35$ percent it loses, so the
          verdict flips somewhere in between. What could you work out once,
          before the round starts, that settles all twelve decisions without
          another expected value?
        hint: >
          The verdict flips where the two options are worth the same.
        answer: >
          The confidence at which answering is worth exactly $0$, the same as
          the blank. Expected score rises steadily with confidence, so above
          that break-even point answering always wins and below it the blank
          always wins. Find it once per round, and every later decision is a
          single comparison of your confidence against it.
      - ask: >
          At what confidence $p$ is answering exactly break-even in this
          $+5/-3/0$ round?
        expects: "3/8"
        hint: >
          Set $5p - 3(1-p) = 0$ and solve for $p$.
        feedback: >
          $5p = 3 - 3p$, so $8p = 3$ and $p = 3/8 = 0.375$. The $45$ percent
          question clears it and the $35$ percent one does not, which is what
          your two expected values said.

      - part: The bar, and why it sits there
        teach: >
          This is the indifference threshold. Under a $+a/-b/0$ rule,
          answering at confidence $p$ is worth $pa - (1-p)b$, and that beats
          the blank's $0$ exactly when $p(a+b) > b$: answer iff $p >
          b/(a+b)$. Read it as the penalty's share of the whole swing $a+b$
          between a right and a wrong answer. Symmetric $+1/-1$ gives $1/2$,
          so any lean is enough; $+1/-2$ gives $2/3$; a no-penalty round
          gives $0$, so you always answer.
      - ask: >
          A candidate writes the expected score of answering in the
          $+5/-3/0$ round as $5p - 3$ and concludes the bar is $p > 3/5$.
          What went wrong?
        choices:
          - text: >
              Nothing: $3/5$ is $b/a$, and the bar is $b/a$.
            feedback: >
              The bar is $b/(a+b)$, not $b/a$. At $p = 0.45$, below $3/5$, you
              computed answering to be worth $+0.6$, so $3/5$ cannot be the
              break-even point.
          - text: >
              The penalty should be weighted by $1-p$, since you only pay it
              when wrong.
            correct: true
            feedback: >
              $5p - 3$ charges the penalty even on the answers you get right.
              Weighted properly, the bar falls from $3/5$ to $3/8$, and every
              question between $37.5$ and $60$ percent would have been
              wrongly left blank.
          - text: >
              The reward should be weighted by $1-p$ as well.
            feedback: >
              The reward is earned only when right, which happens with
              probability $p$, so $5p$ was already correct. The error is on
              the other side of the minus sign.
        feedback: >
          Each payoff is weighted by the probability of the outcome that
          triggers it: $p$ for the reward, $1-p$ for the penalty. Drop the
          $1-p$ and you skip questions you should answer.
      - ask: >
          A round pays $+7$ right, $-3$ wrong, $0$ blank. Below what
          confidence should you leave a question blank?
        expects: "3/10"
        hint: >
          The penalty's share of the whole swing.
        feedback: >
          $b/(a+b) = 3/(7+3) = 3/10$. Anything you are more than $30$ percent
          sure of is worth writing down.

      - part: Where the bar moves
        ask: >
          A round pays $+1$ right and $-2$ wrong. You are $60$ percent sure of
          an answer, and a friend says "past even odds, write it down". Do
          you?
        choices:
          - text: >
              Yes: $60$ percent is a real lean, and a lean is enough.
            feedback: >
              A lean is enough only under $+1/-1$. Here the bar is $2/(1+2) =
              2/3$, and answering at $0.6$ is worth $0.6(1) - 0.4(2) = -0.2$.
          - text: >
              No: the bar here is $2/3$, and $0.6$ falls short.
            correct: true
            feedback: >
              $0.6 - 0.8 = -0.2$. When a wrong answer costs twice what a right
              one pays, you need to be right twice as often as wrong.
          - text: >
              Yes, if there is plenty of time left in the round.
            feedback: >
              Time left affects how fast you work and which question you take
              next, not this comparison: the blank is worth $0$ and answering
              is worth $-0.2$ however much time remains.
        feedback: >
          Fifty percent is a habit from symmetric rounds. The bar moves with
          the rule, and only the rule.
      - ask: >
          A round pays $+5$ right, $-3$ wrong and $+1$ for a blank. A
          candidate uses the bar $3/8$ from the earlier round. What is the
          true break-even confidence?
        expects: "1/2"
        hint: >
          Measure every outcome against the blank first, as you would to
          reduce any rule with a skip credit.
        feedback: >
          Relative to the blank's $+1$, a right answer gains $4$ and a wrong
          one loses $4$: the rule is really $+4/-4/0$, so the bar is
          $4/(4+4) = 1/2$. Paying for blanks raised the bar from $3/8$ to
          $1/2$.
      - teach: >
          In an interview this is one breath: "the bar is $b$ over $a$ plus
          $b$, three-eighths here; I'm at forty-five, so I answer." Rule,
          threshold, verdict, in that order, before anyone asks how sure you
          are.

  - node: quant-mental.game-tactics.partial-credit-guessing
    hook: >
      "Down to two options — do you guess" is asked expecting a fresh
      computation, not a reflex "yes, elimination always helps" — the
      SAT case that motivates this generalizes, but not automatically.
    explanation: >
      Many standardized $n$-choice tests set $b=a/(n-1)$ specifically so
      a uniformly blind guess sits exactly at the threshold: with
      $p=1/n$ and $b/(a+b)=1/n$ forced by that choice of $b$, blind
      guessing is neither punished nor rewarded. This isn't an accident
      of the SAT's particular numbers — it's the calibration rule behind
      any $n$-choice test scored this way, and it generalizes the
      five-choice case directly.

      Eliminating $k$ wrong options raises your conditional confidence
      from $1/n$ to $1/(n-k)$ on the survivors, strictly increasing $p$
      while $a$, $b$, and the threshold stay fixed — so elimination
      always pushes you toward or past the bar. What it does not do is
      guarantee crossing it: how much elimination is needed depends on
      how far the rule's actual threshold sits above the calibrated
      $1/n$ starting point.
    worked: >
      A four-choice test scored $+1$ correct, $-\tfrac{1}{3}$ wrong
      follows the same calibration: $b=a/(n-1)=1/3$ exactly. Blind
      guess: $p=1/4$, and $\tfrac14(1)-\tfrac34(\tfrac13)=\tfrac14
      -\tfrac14=0$ — indifferent again, confirming the design principle
      holds for $n=4$, not just five choices. Eliminate one wrong option
      and $p$ rises to $1/3$: $\tfrac13(1)-\tfrac23(\tfrac13)=\tfrac13
      -\tfrac29=\tfrac19>0$ — profitable, the same qualitative jump as
      the five-choice case.
    interview: >
      The compressed version of this whole example is "down to two —
      guess or not?" The fast answer recomputes $p$ from the number of
      survivors and checks it against the rule's own threshold, rather
      than reciting "always guess after elimination" as a blanket rule.
    pitfalls: >
      Assuming any elimination automatically makes guessing worth it
      skips the check: under a harsher $+1/-2$ rule (threshold
      $p>2/3$) on the same four-choice test, eliminating one option
      gives $p=1/3$ and eliminating two gives $p=1/2$ — both still below
      the bar, so guessing stays wrong until only one choice is left.
    recap: >
      Elimination always raises your confidence toward the guessing bar,
      but whether it actually clears the bar is a fresh computation
      against the rule's own threshold, not a free pass.
    dialogue:
      - part: Six options and no idea
        teach: >
          An online numeracy screen gives six options per question and pays
          $+5$ for a right answer, $-1$ for a wrong one, $0$ for a blank.
          Question $22$ asks about something you have never seen, and all six
          options look equally plausible to you.
      - ask: >
          What is the expected score of picking one of the six at random?
        expects: "0"
        hint: >
          You are right with probability $1/6$ and wrong with probability
          $5/6$.
        feedback: >
          $\tfrac{1}{6}(5) - \tfrac{5}{6}(1) = \tfrac{5}{6} - \tfrac{5}{6} = 0$.
          The blind guess is worth exactly what the blank is worth.
      - ask: >
          What is this rule's break-even confidence, the bar from the guessing
          threshold?
        expects: "1/6"
        hint: >
          The penalty's share of the whole swing between right and wrong.
        feedback: >
          $b/(a+b) = 1/(5+1) = 1/6$: the bar sits exactly at the blind-guess
          probability. That is why the blind guess came out at $0$.
      - reflect: >
          The setter paid $5$ for a right answer and then chose a penalty of
          $1$, not $2$ and not $\tfrac{1}{2}$. What rule were they following,
          and how would you pick the penalty for a test with $n$ options and a
          reward of $a$?
        hint: >
          Ask what a random guesser's five wrong answers cost against the one
          right answer they collect, on average.
        answer: >
          They chose the penalty that makes a blind guess worth exactly $0$. A
          random guesser is right once for every $n - 1$ times wrong, so the
          $n - 1$ penalties must cancel one reward: $(n-1)b = a$, or $b =
          a/(n-1)$. Here $b = 5/5 = 1$. With that penalty the bar $b/(a+b)$
          works out to exactly $1/n$, so a guess with no information is
          neither punished nor rewarded.
      - teach: >
          This is the calibration behind the SAT's five-choice $+1/-\tfrac{1}{4}$
          and every $n$-choice test scored the same way: set $b = a/(n-1)$, and
          the bar $b/(a+b)$ equals $1/n$, the blind-guess probability. Pure
          guessing is break-even by design. The rule says nothing yet about a
          guess made with *some* information.
      - ask: >
          A three-option test pays $+4$ for a right answer. What penalty for a
          wrong answer calibrates it so that a blind guess is break-even?
        expects: "2"
        hint: >
          With three options, a random guesser is wrong twice for every time
          right.
        feedback: >
          $b = a/(n-1) = 4/2 = 2$. Check: $\tfrac{1}{3}(4) - \tfrac{2}{3}(2) =
          \tfrac{4}{3} - \tfrac{4}{3} = 0$.

      - part: One option crossed off
        ask: >
          Back on question $22$ of the six-option screen, you notice one option
          is larger than the number of people the question describes, so it
          cannot be right. You have no preference among the other five. What
          is the expected score of guessing now?
        expects: "1/5"
        hint: >
          The rule has not changed; only your chance of being right has.
        feedback: >
          $p = 1/5$, so $\tfrac{1}{5}(5) - \tfrac{4}{5}(1) = 1 - 0.8 = 0.2$
          points. One crossed-off option moved the guess from $0$ to $+0.2$.
      - ask: >
          A candidate says: "This test is calibrated so guessing pays nothing,
          so I never guess on it." What is wrong with that?
        choices:
          - text: >
              Nothing: the calibration makes every guess on this test worth
              $0$.
            feedback: >
              The calibration makes the *blind* guess worth $0$. You just
              computed $+0.2$ for a guess with one option ruled out, on the
              same test.
          - text: >
              Once you cross options off, the test is a five-option test, so
              the penalty should be recalibrated to $5/4$.
            feedback: >
              The rule is printed on the paper and stays $+5/-1$ whatever you
              cross off. Your knowledge changed; the scoring did not, so the bar
              stays at $1/6$.
          - text: >
              The calibration pins the bar at $1/6$; any real elimination lifts
              $p$ above $1/6$ while the bar stays put.
            correct: true
            feedback: >
              Exactly. Crossing off $k$ options raises $p$ from $1/n$ to
              $1/(n-k)$, and on a calibrated test anything above $1/n$ clears
              the bar.
        feedback: >
          Calibration is a statement about the guess made with no information.
          It is the reason the smallest piece of information is worth acting
          on.
      - ask: >
          Suppose you can rule out three of the six, leaving three you cannot
          separate. What is the guess worth now?
        expects: "1"
        hint: >
          $p = 1/3$; same $+5/-1$ rule.
        feedback: >
          $\tfrac{1}{3}(5) - \tfrac{2}{3}(1) = \tfrac{5}{3} - \tfrac{2}{3} = 1$
          point. Each option crossed off adds value: $0$, $0.2$, and now $1$.

      - part: The same eliminations under a harsher rule
        ask: >
          A different firm's six-option test pays $+3$ for a right answer and
          $-2$ for a wrong one. You again rule out three options and cannot
          separate the remaining three. What is the expected score of
          guessing?
        expects: "-1/3"
        hint: >
          $p = 1/3$ again; only the rule changed.
        feedback: >
          $\tfrac{1}{3}(3) - \tfrac{2}{3}(2) = 1 - \tfrac{4}{3} = -\tfrac{1}{3}$.
          This rule's bar is $2/(3+2) = 2/5$, and $1/3$ falls short of it.
          Three eliminations that were worth a full point on the calibrated
          test lose a third of a point here.
      - ask: >
          On this $+3/-2$ test, with no preference among whatever survives,
          what is the fewest options you must rule out before guessing has
          positive expected score?
        expects: "4"
        hint: >
          You need $1/(\text{survivors})$ to exceed $2/5$.
        feedback: >
          With $m$ survivors, $p = 1/m$, and you need $1/m > 2/5$, so $m <
          2.5$: at most $2$ survivors, which means ruling out $4$ of the $6$.
          Then $\tfrac{1}{2}(3) - \tfrac{1}{2}(2) = 0.5$ points.
      - ask: >
          A friend's rule of thumb is "once you have eliminated something,
          guess." When is it right?
        choices:
          - text: >
              Always: elimination raises $p$, and a higher $p$ means a
              positive guess.
            feedback: >
              Higher is not the same as high enough. On the $+3/-2$ test,
              three eliminations still left the guess at $-1/3$.
          - text: >
              Never: elimination does not change the rule, so it cannot change
              the verdict.
            feedback: >
              The rule and its bar stay fixed, but $p$ moves, and the verdict
              compares $p$ with the bar. One elimination turned $0$ into
              $+0.2$ on the calibrated test.
          - text: >
              On a test calibrated at $b = a/(n-1)$, or a gentler one; on a
              harsher rule, only once $p$ clears $b/(a+b)$.
            correct: true
            feedback: >
              Calibration puts the bar at $1/n$, so any elimination clears it.
              A harsher rule puts the bar higher, and how much elimination you
              need depends on how far above $1/n$ it sits.
        feedback: >
          Elimination always moves you toward the bar. Whether it gets you past
          it is a fresh computation against the rule in front of you.
      - teach: >
          Out loud: "six options, plus three minus two, so the bar is two
          fifths. I'm down to two, so I'm at one half, I guess, and it's worth
          half a point." Survivors, bar, verdict.

  - node: quant-mental.game-tactics.speed-accuracy
    hook: >
      Racing to your top speed feels like it should maximize points, but
      the accuracy you're trading away accelerates exactly where the
      time you're saving slows down — the edge is close to the worst
      place on the curve to operate.
    explanation: >
      Error rate, plotted against how fast you're working, is not a
      straight line. Comfortably below your ceiling, going noticeably
      faster costs almost nothing in accuracy — you're cutting slack you
      didn't need. Close to your absolute limit, the same increment in
      speed produces a disproportionate jump in mistakes: the curve
      bends upward, convex rather than linear.

      Picture a mental-math drill where a comfortable pace of one answer
      every 10 seconds runs 2 percent errors; pushing to one every 7
      seconds might only raise that to 5 percent, but pushing further to
      one every 5 seconds can jump errors to 25 percent or more — the
      same 2-second cut in each step costs an increasingly larger
      accuracy price, because the fast regime forces you to skip steps
      (a recheck, a carry, a sign) that the slower regime had room for.

      The implication is where to aim: not the fastest pace you can
      sustain at all, but the knee of this curve — the point where the
      accuracy cost per unit of speed gained starts to explode. Locating
      that knee, not racing the edge, is what the rest of this chapter
      turns into an actual optimization.
    interview: >
      This rarely shows up as a question asked outright — it's a
      pattern watched for during a live mental-math or estimation round.
      An interviewer clocking your pace notes where your error rate
      visibly jumps, and easing off before that point shows you can feel
      the curve rather than needing it drawn for you.
    pitfalls: >
      Treating your error rate as roughly constant across paces and
      extrapolating from a slow, accurate trial run to a much faster
      pace ignores exactly the part of the curve that bends. Assuming
      the knee is fixed rather than personal is a second trap — it moves
      down as fatigue sets in, so a pace safe in the first ten minutes
      may not stay safe in the last ten.
    recap: >
      Error rate rises convexly, not linearly, as pace approaches your
      limit, so the last slice of speed costs far more accuracy than the
      slice before it.
    dialogue:
      - part: A drill at four paces
        teach: >
          You drill sums of three two-digit numbers in blocks of $100$, a
          metronome setting the pace. At $7$ seconds per sum you get $2$
          wrong. At $6$ seconds you get $3$ wrong. Next come blocks at $5$
          seconds and at $4$.
      - ask: >
          Before you run them: how many do you expect to get wrong in the
          $4$-second block?
        choices:
          - text: >
              About $5$: one extra mistake for each second you cut.
            feedback: >
              That extends the first cut's price in a straight line. The block
              came back with $15$ wrong; the $5$-second block, in between, had
              $5$.
          - text: >
              About $3$: by then you are warmed up and the extra speed is
              absorbed.
            feedback: >
              Warming up helps across a session, but it does not make speed
              free. The $4$-second block came back with $15$ wrong.
          - text: >
              Well over $5$: each second you cut costs more than the one
              before.
            correct: true
            feedback: >
              It came back with $15$ wrong, and the $5$-second block had $5$.
              The extra mistakes per second cut ran $1$, then $2$, then $10$.
        feedback: >
          The four blocks: $7$ seconds, $2$ wrong; $6$ seconds, $3$; $5$
          seconds, $5$; $4$ seconds, $15$. Three equal one-second cuts, three
          very unequal prices.
      - ask: >
          The last one-second cut cost how many times as many mistakes as the
          first?
        expects: "10"
        hint: >
          Compare the jump from $5$ to $4$ seconds with the jump from $7$ to
          $6$.
        feedback: >
          The first cut cost $3 - 2 = 1$ mistake per hundred; the last cost
          $15 - 5 = 10$. The same second of speed is ten times as expensive at
          the fast end.

      - part: Where the extra mistakes come from
        reflect: >
          Taking a second off at $7$ seconds per sum cost almost nothing;
          taking a second off at $5$ cost ten times as much. What is different
          about the second you remove at $5$ from the second you removed at
          $7$?
        hint: >
          Think about what you were doing with your time at $7$ seconds that
          the arithmetic did not strictly need.
        answer: >
          At $7$ seconds you have slack: time for a glance back, a carry
          written twice, a pause. Cutting slack costs almost no accuracy,
          because nothing the arithmetic needs is lost. At $5$ seconds the
          slack is gone, so the next second has to come out of the work
          itself, a carry or a re-read of a digit, and every skipped step is a
          chance to be wrong. The first seconds you cut are free; the last ones
          are paid for in mistakes.
      - teach: >
          So error rate against pace is not a straight line. Well below your
          limit the curve is nearly flat; near the limit it bends up sharply,
          and the same increase in speed costs a disproportionate jump in
          mistakes. The curve is convex. The point where it turns from flat to
          steep is the *knee*, and a timed test rewards working near the knee,
          not at the edge.
      - ask: >
          Which block's pace sits at the knee of this drill's curve?
        choices:
          - text: >
              $7$ seconds: the most accurate pace is the one to aim for.
            feedback: >
              Moving from $7$ to $6$ seconds cost one mistake per hundred, and
              moving on to $5$ cost two more. At $7$ you are on the flat part,
              paying time for accuracy you would mostly keep anyway.
          - text: >
              $5$ seconds: the cuts up to it were cheap, the cut after it was
              not.
            correct: true
            feedback: >
              Getting to $5$ cost $1$ and then $2$ extra mistakes; the next
              second cost $10$. The bend is right there.
          - text: >
              $4$ seconds: the fastest pace you can hold at all.
            feedback: >
              That is the edge, not the knee. Reaching it took the single most
              expensive second of the drill.
        feedback: >
          The knee is where the price of the next second jumps, here between
          $5$ and $4$ seconds.
      - ask: >
          You have been running at $4$ seconds per sum. Backing off to $5$ makes
          each sum a quarter slower. What fraction of your mistakes does it
          remove?
        expects: "2/3"
        tolerance: 0.005
        hint: >
          Mistakes per hundred go from $15$ to $5$.
        feedback: >
          $(15 - 5)/15 = 10/15 = 2/3$. A $25$ percent slowdown removes two
          thirds of the mistakes. That is the practical shape of the knee: a
          small step back from the edge buys a large drop in errors.

      - part: Where the picture misleads
        ask: >
          A teammate logs his own drill: $10$ seconds per sum, $4$ wrong; $8$
          seconds, $6$ wrong; $6$ seconds, $8$ wrong. Two mistakes per two
          seconds, a straight line. What do his numbers say about his knee?
        choices:
          - text: >
              He has no knee, so he should work as fast as he can.
            feedback: >
              Every pace he tested lies on the flat part. A straight run of
              cheap cuts is what the curve looks like before the bend, and says
              nothing about what $4$ seconds will cost.
          - text: >
              His knee is somewhere faster than $6$ seconds; he has not tested
              far enough to find it.
            correct: true
            feedback: >
              Right. His data shows the flat region only. He finds the knee by
              stepping faster, a second at a time, until the price of a second
              jumps.
          - text: >
              His knee is at $10$ seconds, his most accurate pace.
            feedback: >
              The knee is where cutting gets expensive, not where errors are
              lowest. His cuts from $10$ down to $6$ were all cheap.
        feedback: >
          Extrapolating a straight line from slow, accurate blocks is the
          standard way to walk past the knee without seeing it coming.
      - ask: >
          Fresh, your $5$-second blocks run $5$ wrong per hundred. Forty
          minutes into a long round, what should you expect at $5$ seconds?
        choices:
          - text: >
              About $5$ wrong per hundred: the curve was measured, so it holds.
            feedback: >
              You measured it fresh. Fatigue lowers your limit, which slides
              the whole bend toward slower paces.
          - text: >
              More than $5$: the knee has drifted slower, so $5$ seconds may now
              sit on the steep part.
            correct: true
            feedback: >
              The knee is personal and it moves. A pace that was at the knee
              in the first ten minutes can be past it in the last ten.
          - text: >
              Fewer than $5$: forty minutes of practice has made you faster.
            feedback: >
              Practice moves the curve over weeks of drilling, not within one
              sitting. Inside a round, the drift is the other way.
        feedback: >
          Treat a fresh measurement of your knee as optimistic, and be ready to
          back off a notch late in a round.
      - teach: >
          The curve says where accuracy starts getting expensive. Whether that
          price is worth paying depends on the scoring rule: a heavy penalty
          for a wrong answer makes each extra mistake cost more, a no-penalty
          round makes it cost nothing. Putting the two together is how you
          choose a pace.

  - node: quant-mental.game-tactics.optimal-pace
    hook: >
      This is the moment the guessing threshold and the speed-accuracy
      curve combine into an actual number: not "go as fast as you safely
      can," but a specific pace that beats every other pace at points
      scored per second.
    explanation: >
      Expected score rate is $(p(v)a-(1-p(v))b)/t(v)$: the numerator is
      exactly the attempt-EV from the guessing threshold, evaluated at
      the accuracy you'd have working at speed $v$, and the denominator
      is the time per question at that speed — the ratio is points
      earned per second of round time, the quantity a timed round
      actually pays on.

      At low speed the rate is held back only by wasted time, not by an
      accuracy problem, so speeding up from the slow end is close to
      free. Near your limit, $p(v)$ collapses fast enough (the convex
      bend from the speed-accuracy curve) that the numerator's drop
      outpaces the denominator's shrinkage, so the rate falls even
      though each question takes less time. The crossover between these
      two regimes is an interior maximum, strictly below top speed.

      The penalty $b$ controls how far below top speed that maximum
      sits: since the numerator's accuracy-loss term is weighted by $b$,
      a harsher penalty punishes the same speed increase more, pulling
      the optimum slower still. Under $b=0$ the accuracy term drops out
      of the numerator entirely, and the tradeoff collapses toward pure
      speed.
    worked: >
      Three candidate paces on a $+1/-1$ round: Pace A takes 10 seconds
      per question at 90 percent accuracy, Pace B takes 6 seconds at 75
      percent, Pace C takes 4 seconds at 55 percent. Attempt-EV per
      question is $2p-1$: $0.8$, $0.5$, and $0.1$ respectively. Dividing
      by time per question gives the rate: $0.8/10=0.08$,
      $0.5/6\approx0.083$, $0.1/4=0.025$ points per second. Pace B wins,
      narrowly beating even the safest option A, while the fastest pace
      C is worst by a wide margin — the maximum sits at the middle pace,
      and only computing the rate reveals it.
    interview: >
      "How much slower should you go than your fastest safe pace" is
      answered by naming the rate comparison, not intuition — the
      winning pace maximizes points per second, a genuinely different
      ranking from maximizing points per question or minimizing errors.
    pitfalls: >
      Ranking paces by raw per-question EV instead of EV per unit time
      silently favors the slowest safe pace every time — in the worked
      example, Pace A's $0.8$ EV per question looks better than Pace
      B's $0.5$, until time enters the comparison. Assuming "slower is
      always safer" ignores the no-penalty regime, where a low $b$
      shifts the optimum back toward raw speed.
    recap: >
      The pace that maximizes points per second is an interior point
      found by comparing rates directly, and it moves slower as the
      wrong-answer penalty grows.
    dialogue:
      - part: Three ways to spend five minutes
        teach: >
          A $300$-second round of short questions, more than anyone finishes,
          pays $+2$ for a right answer, $-1$ for a wrong one, $0$ for a blank.
          From your drills you know three paces: careful, $15$ seconds a
          question at $95$ percent right; brisk, $10$ seconds at $85$ percent;
          flat out, $6$ seconds at $60$ percent.
      - ask: >
          At the careful pace, what is the expected score of one question?
        expects: "1.85"
        hint: >
          $p$ of the time you gain $2$; $1 - p$ of the time you lose $1$.
        feedback: >
          $0.95(2) - 0.05(1) = 1.9 - 0.05 = 1.85$. The same sum gives $1.55$
          for brisk and $0.8$ for flat out.
      - ask: >
          Per question the ranking is careful $1.85$, brisk $1.55$, flat out
          $0.8$. Which pace should you run?
        choices:
          - text: >
              Careful: it scores the most on every question it answers.
            feedback: >
              Every question, yes, but it answers the fewest. The round pays for
              $300$ seconds, not for one question, and careful fits only $20$
              questions into them.
          - text: >
              Flat out: it gets through the most questions.
            feedback: >
              Fifty questions at $0.8$ each is a real candidate, but so is thirty
              at $1.55$. Volume alone does not settle it any more than the
              per-question score does.
          - text: >
              None yet: you need what each pace earns over the whole $300$
              seconds.
            correct: true
            feedback: >
              The per-question score is half the picture; the other half is how
              many questions each pace fits into the round.
        feedback: >
          A timed round is a fixed budget of seconds. Compare paces by what
          they earn from the budget.
      - ask: >
          What is the careful pace's expected total for the round?
        expects: "37"
        hint: >
          How many $15$-second questions fit into $300$ seconds?
        feedback: >
          $300/15 = 20$ questions at $1.85$ each: $20 \times 1.85 = 37$
          points.
      - ask: >
          And the brisk pace's expected total?
        expects: "46.5"
        hint: >
          $300/10$ questions at $1.55$ each.
        feedback: >
          $30 \times 1.55 = 46.5$. Flat out gives $50 \times 0.8 = 40$. The
          middle pace beats both ends, by $9.5$ and $6.5$ points.

      - part: One number per pace
        reflect: >
          You ranked the paces by multiplying each one's score per question by
          the number of questions that fit in $300$ seconds. The round could
          have been $200$ seconds or $20$ minutes. What one number per pace
          would rank them without knowing the length of the round?
        hint: >
          Every total was the round length times something.
        answer: >
          Points per second: the expected score of one question divided by the
          seconds it takes. The total is the round length times that rate, so
          the round length multiplies every pace equally and cannot change the
          order. Careful earns $1.85/15 \approx 0.123$ a second, brisk
          $1.55/10 = 0.155$.
      - teach: >
          That is the expected score rate, $(p(v)a - (1 - p(v))b)/t(v)$ for
          working speed $v$, accuracy $p(v)$ and time per question $t(v)$. The
          numerator is the attempt value from the guessing threshold, taken at
          the accuracy that speed allows. Choosing a pace means maximizing
          this ratio, not the numerator and not $1/t(v)$ on its own.
      - ask: >
          What is the flat-out pace's rate, in points per second?
        expects: "0.1333"
        tolerance: 0.004
        hint: >
          Its score per question divided by its $6$ seconds.
        feedback: >
          $0.8/6 \approx 0.133$. Brisk earns $0.155$, careful $0.123$:
          brisk is the best of the three, and flat out is second.
      - ask: >
          Brisk beat careful by going faster, then flat out lost to brisk by
          going faster still. Why does the second speed-up lose?
        choices:
          - text: >
              Going faster always lowers the rate once a penalty exists.
            feedback: >
              Brisk is faster than careful and earns more per second, under
              the same $-1$ penalty. Speed-ups can win; this one did not.
          - text: >
              Cutting from $10$ to $6$ seconds saves $40$ percent of the time,
              but the score per question falls from $1.55$ to $0.8$, about
              $48$ percent.
            correct: true
            feedback: >
              The rate is a ratio. When the numerator falls faster than the
              denominator, the ratio falls. That happens past the knee of the
              error curve, where accuracy collapses with each second cut.
          - text: >
              A $60$ percent pace is barely better than guessing, so it should
              never be used.
            feedback: >
              At $60$ percent each question is still worth $+0.8$, and the pace
              earns $0.133$ a second, more than careful does. It loses to
              brisk, not to zero.
        feedback: >
          From careful to brisk, time fell by a third and the score per
          question fell by about $16$ percent: a gain. From brisk to flat out
          the order reversed. The best pace sits strictly below top speed.

      - part: When the penalty changes
        ask: >
          The firm doubles the penalty to $+2/-4/0$, with the same three paces.
          What is the brisk pace's expected score per question now?
        expects: "1.1"
        hint: >
          $0.85(2) - 0.15(4)$.
        feedback: >
          $1.7 - 0.6 = 1.1$, down from $1.55$. Careful gives $1.9 - 0.2 = 1.7$;
          flat out gives $1.2 - 1.6 = -0.4$.
      - ask: >
          Under $+2/-4/0$, which pace has the highest rate?
        choices:
          - text: >
              Brisk, as before: the best pace is a property of your error
              curve.
            feedback: >
              Brisk earns $1.1/10 = 0.11$ a second; careful earns $1.7/15
              \approx 0.113$. The curve did not change, but its mistakes now
              cost four points each.
          - text: >
              Careful, narrowly.
            correct: true
            feedback: >
              $0.113$ against $0.11$, with flat out negative at $-0.4/6
              \approx -0.067$. The harsher penalty pulled the best pace
              slower.
          - text: >
              Flat out: more attempts make up for the penalty.
            feedback: >
              Each flat-out answer is worth $-0.4$, so more of them lose more.
              Speed multiplies a negative number.
        feedback: >
          A bigger $b$ weights every lost point of accuracy more heavily, so
          the balance between time saved and accuracy lost tips at a slower
          pace.
      - ask: >
          Now a no-penalty round, $+2/0/0$. Which pace has the highest rate?
        choices:
          - text: >
              Careful: without a penalty you can afford to take your time.
            feedback: >
              Careful earns $1.9/15 \approx 0.127$ a second. With nothing lost
              on a wrong answer, accuracy is worth less, not more.
          - text: >
              Brisk: the middle pace is always the safe choice.
            feedback: >
              Brisk earns $1.7/10 = 0.17$, which is good but not best. The
              middle pace won one rule, not every rule.
          - text: >
              Flat out.
            correct: true
            feedback: >
              $0.6(2) = 1.2$ per question over $6$ seconds is $0.2$ a second.
              With $b = 0$ a wrong answer is just a blank, so speed wins.
        feedback: >
          Across the three rules the winner went careful, brisk, flat out as
          the penalty fell from $4$ to $1$ to $0$.
      - teach: >
          Out loud: "I'd rank paces by expected points per second, not per
          question. On plus two minus one my brisk pace wins, $0.155$ a second
          against $0.133$ flat out, and I'd slow down if the penalty went up."

  - node: quant-mental.game-tactics.sequencing
    hook: >
      The order you attack questions in is a second, independent lever
      from which questions you attempt — get it wrong and a round with
      plenty of points available on paper still ends with half of them
      unclaimed.
    explanation: >
      Treat a timed round as a fixed time budget with points of varying
      size and cost scattered across it: the allocation rule that
      maximizes total points is to clear the fast, confident questions
      first, because a hard question stuck early can consume time that
      easy, high-value points later in the set needed, and that always
      beats working through a fixed printed order.

      Mechanically this is a two-pass sweep: scan and classify first,
      clear everything fast and confident, flag anything slow or
      uncertain, and only return to the flagged set once the cheap sweep
      is exhausted — and even then, attempt a flagged item only if its
      confidence separately clears the guessing threshold.

      Wasted time is worse than a plain skip: time sunk into a question
      you never finish steals from questions you would have finished,
      while a clean skip at least costs nothing beyond the single
      question skipped.
    worked: >
      A $+1/-1$ round has 300 seconds left and 4 unattempted questions:
      three easy ones taking 60 seconds each at 90 percent confidence
      (EV $=2(0.9)-1=0.8$ each), and one hard one taking 240 seconds at
      60 percent confidence (EV $=2(0.6)-1=0.2$). Banking the easy ones
      first uses 180 seconds for $3(0.8)=2.4$ points, leaving 120
      seconds — not enough for the hard question, skipped for $0$.
      Working in a fixed order that puts the hard question first
      instead: 240 seconds buys its $0.2$, leaving only 60 seconds,
      enough for one easy question ($0.8$), with the other two never
      reached. Banking easy first scores $2.4$; fixed order scores
      $0.2+0.8=1.0$ — more than double, from reordering the identical
      four questions.
    interview: >
      "You won't finish this round" is the setup line; the fluent
      response states you'd scan and triage before answering anything,
      not describe grinding through in the printed order.
    pitfalls: >
      Continuing a hard question because of time already sunk into it
      is the sequencing version of the sunk-cost trap — the decision to
      keep going should depend only on the time and points left.
      Flagging a question and never returning to it, even when it would
      have cleared the guessing threshold, throws away points the
      triage pass was meant to preserve.
    recap: >
      Clearing every fast, confident question before touching a slow
      one beats working in printed order, because unclaimed easy points
      cost more than one skipped hard question.
    dialogue:
      - part: Six questions, three minutes
        teach: >
          A round pays $+3$ for a right answer, $-1$ for a wrong one, $0$ for a
          blank, and you may answer in any order. With $180$ seconds left, six
          questions remain. Question $15$ is a hard one you would need $120$
          seconds for, at $60$ percent confidence. Questions $16$ to $20$ are
          quick: $30$ seconds each, at $90$ percent.
      - ask: >
          Working in printed order, starting with question $15$, what is your
          expected score for the rest of the round?
        expects: "6.6"
        hint: >
          The hard question is worth $0.6(3) - 0.4(1)$ and uses $120$ of the
          $180$ seconds. A quick one is worth $0.9(3) - 0.1(1)$.
        feedback: >
          The hard question is worth $1.8 - 0.4 = 1.4$ and leaves $60$ seconds,
          room for two quick ones at $2.7 - 0.1 = 2.6$ each. Total: $1.4 +
          2(2.6) = 6.6$.
      - ask: >
          Now take the five quick ones first. What is your expected score?
        expects: "13"
        hint: >
          Five quick questions use $150$ seconds. Is there time for the hard
          one after?
        feedback: >
          $5 \times 2.6 = 13$ in $150$ seconds, leaving $30$, not enough for
          the hard question, which stays blank. Same six questions, same clock,
          and the order alone is worth $6.4$ points.
      - ask: >
          The hard question is worth $+1.4$ if you attempt it, a positive
          expected value. Why did taking it first cost you?
        choices:
          - text: >
              At $60$ percent it falls below the guessing threshold.
            feedback: >
              The bar here is $b/(a+b) = 1/4$, and $0.6$ clears it easily. It
              is a question worth answering, given the time.
          - text: >
              Its $120$ seconds could have bought four quick questions worth
              $10.4$ instead of $1.4$.
            correct: true
            feedback: >
              The hard question is not bad, it is expensive. It spends four
              quick questions' worth of time to earn about half of one.
          - text: >
              Hard questions are more likely to be wrong, so they should never
              be attempted under a clock.
            feedback: >
              With time to spare at the end, the hard question would add
              $1.4$. Its problem is when you do it, not whether.
        feedback: >
          On a clock, every question is bought with seconds that some other
          question could have used. The price matters as much as the payoff.

      - part: What to sort by
        reflect: >
          Five quick questions against one slow one was easy to order by eye.
          A real round has questions of every length and every confidence.
          What number would you compute for each question to decide which to
          take first?
        hint: >
          The hard question's flaw was its payoff relative to its price in
          seconds.
        answer: >
          Expected score per second: the question's expected value divided by
          the time it takes. A quick question here earns $2.6/30 \approx
          0.087$ points a second, the hard one $1.4/120 \approx 0.012$, about
          seven times less. Taking questions in decreasing order of that rate
          spends each second where it earns most.
      - teach: >
          That is the sequencing rule: when order is free, sort by expected
          score per unit time, not by position on the page. In practice it is
          two passes. Sweep the set once, answering everything quick and
          confident and flagging anything slow or doubtful. Return to the
          flagged pile only once every cheap point is banked, and even then
          attempt a flagged question only if its confidence clears $b/(a+b)$.
      - ask: >
          Same $+3/-1$ round. Question A takes $60$ seconds and you are $95$
          percent sure you will get it. Question B takes $25$ seconds and you
          would be $55$ percent sure. What is B's expected score per second?
        expects: "0.048"
        hint: >
          B is worth $0.55(3) - 0.45(1)$; divide by $25$.
        feedback: >
          $1.65 - 0.45 = 1.2$ points over $25$ seconds is $0.048$ a second.
      - ask: >
          Which of A and B do you take first?
        choices:
          - text: >
              A: you are nearly sure of it, and confidence comes first.
            feedback: >
              A is worth $2.85 - 0.05 = 2.8$, but over $60$ seconds that is
              about $0.047$ a second, just under B's $0.048$. Confidence
              is only half the ratio.
          - text: >
              B, narrowly: it earns slightly more per second.
            correct: true
            feedback: >
              $0.048$ against $0.047$. Close enough that either order costs
              little, but the point stands: a doubtful quick question can
              outrank a sure slow one.
          - text: >
              Neither until you know how many other questions remain.
            feedback: >
              The rate of each question does not depend on the rest of the
              paper. Sorting needs only each question's own expected value
              and time.
        feedback: >
          "Quick and confident first" is the rule of thumb; expected score per
          second is the rule it approximates.

      - part: Back to the flagged pile
        ask: >
          Every quick question is banked and $70$ seconds remain. A flagged
          question needs $60$ seconds, and your confidence on it is only $20$
          percent. What is the expected score of attempting it?
        expects: "-0.2"
        hint: >
          $0.2(3) - 0.8(1)$.
        feedback: >
          $0.6 - 0.8 = -0.2$. The bar is $1/4$, and $0.2$ is below it: leave
          it blank, even though there is time and nothing else to do. Spare
          seconds do not make a losing attempt worth taking.
      - ask: >
          A different moment. You have spent $80$ seconds on a flagged question
          you estimated at $120$; if you finish it you are $60$ percent sure.
          $60$ seconds remain, and one quick question ($30$ seconds, $90$
          percent) is still unanswered. What do you do?
        choices:
          - text: >
              Finish the flagged one: $80$ seconds are already in it.
            feedback: >
              Those $80$ seconds are spent whichever way you choose. Finishing
              takes $40$ more for $1.4$ and leaves $20$, too few for the quick
              question: $1.4$ in all.
          - text: >
              Take the quick one: $2.6$ for $30$ seconds, and the flagged one
              cannot be finished in the $30$ left.
            correct: true
            feedback: >
              $2.6$ against $1.4$. Only the time still on the clock and the
              points still available enter the decision.
          - text: >
              Neither: there is not enough time to do both, so stop here.
            feedback: >
              Not enough for both, but enough for either, and an empty
              $60$ seconds earns $0$.
        feedback: >
          Time already sunk into a question is not a reason to sink more. Each
          decision compares only what the remaining seconds can still buy.
      - teach: >
          "You won't finish this round" is the usual setup line. The answer
          that lands: "I'd sweep it once for the quick, confident ones, flag
          the slow ones, and come back to a flagged one only if I clear the
          bar, which is a quarter here."

  - node: quant-mental.game-tactics.cheap-checks
    hook: >
      These checks exist because they target the specific way fast
      arithmetic actually breaks — not a general "be more careful" but a
      short, reflexive battery run on every answer before it leaves your
      mouth.
    explanation: >
      You already have one member of this battery: digit-sum-mod-9 and
      last-digit checks. Two more belong next to it. Parity asks whether
      the problem structurally forces the answer to be odd or even, and
      whether your answer matches. Magnitude rounds the inputs, guesses
      the order of size, and checks that your computed answer lands in
      that ballpark.

      Each check is a filter tuned to a specific failure mode. Parity
      catches sign- and last-operation errors that leave the wrong
      parity residue. Magnitude catches decimal-point slips and
      factor-of-ten errors that a digit-sum check sails right past,
      since digit sums don't care where the decimal point sits.
      Mod-9 and last-digit catch a substituted digit that parity and
      magnitude both miss, since one wrong middle digit doesn't change
      an answer's rough size or evenness. A transposition gets past
      mod-9 too, since swapping two digits keeps the digit sum. No
      single check is complete, which is why you run more than one.

      None of these require recomputing anything, so they run almost in
      parallel with writing the answer down, at a cost close to zero —
      exactly why the next lesson can recommend running them
      unconditionally.
    worked: >
      Compute $24\times35$. Round each input to the nearest ten first:
      $20\times40=800$, so the true product should land in the
      hundreds. The exact product is $840$ — consistent. Parity: $24$
      is even, so the product must be even regardless of the other
      factor; $840$ is even — consistent. Now suppose a decimal slip
      during fast mental work produces $8400$ or $84$ instead: both fail
      the magnitude check instantly, one an order of magnitude too
      large and the other too small, while only $840$ survives — and
      the mod-9 check from before would miss this entirely, since
      $8400$, $840$, and $84$ all share the same digit sum, $12$,
      reducing to $3$ mod $9$.
    interview: >
      This rarely appears as a standalone question; an interviewer
      running you through a rapid mental-math set is listening for you
      to narrate a check out loud before stating your final answer,
      rather than staying silent and hoping.
    pitfalls: >
      A magnitude check only bounds the order of size — it won't catch
      a same-scale error like a wrong middle digit ($840$ vs $870$, both
      plausible-looking hundreds), which is exactly what the mod-9 check
      exists to catch instead. Treating a passed check
      as proof of a correct answer overstates a necessary condition — it
      rules out a category of error, it doesn't confirm the arithmetic.
    recap: >
      Parity and magnitude are cheap filters tuned to the errors mod-9
      and last-digit checks miss — decimal slips and sign flips — and
      running all of them together costs a fraction of a second.
    dialogue:
      - part: An answer that passed
        teach: >
          Mid-round you compute $0.48 \times 350$ and write down $1680$. Redoing
          the multiplication would take about eight seconds, and you are
          working at about twelve seconds a question.
      - ask: >
          Run the check you already have. Casting out nines on the digit
          strings $48$ and $350$, what residue mod $9$ must the product's
          digits have?
        expects: "6"
        hint: >
          Reduce each to its digit sum mod $9$, multiply, reduce again.
        feedback: >
          $48 \to 12 \to 3$ and $350 \to 8$, so $3 \times 8 = 24 \to 6$.
          $1680$ has digit sum $15 \to 6$. It matches.
      - ask: >
          The check passes. What does that tell you about $1680$?
        choices:
          - text: >
              That it is right.
            feedback: >
              A match is necessary, not sufficient. $168$, $1680$ and $16.8$
              all have digit sum $15$, and at most one of them is the product.
          - text: >
              That casting out nines does not apply once decimals are
              involved.
            feedback: >
              It applies to the digit string, and it would still catch a wrong
              digit. What it cannot see is where the decimal point sits.
          - text: >
              That the digits are plausible, and nothing about where the
              decimal point goes.
            correct: true
            feedback: >
              The digit sum ignores place value entirely. Every decimal slip
              passes it.
        feedback: >
          Casting out nines is blind to one of the commonest errors in fast
          arithmetic: an answer ten times too big or too small.
      - reflect: >
          What could you ask of $1680$, in one second and without redoing the
          multiplication, that the digit sum cannot ask?
        hint: >
          $0.48$ is close to a very easy number.
        answer: >
          How big the answer should be. $0.48$ is about a half, so the product
          is about half of $350$, near $175$, and $1680$ is ten times that. The
          true product is $175 - 0.02(350) = 175 - 7 = 168$. A rough size
          check sees exactly the place-value slips the digit sum is blind to.
      - ask: >
          Taking $0.48$ as $0.5$, what is your estimate of the product?
        expects: "175"
        hint: >
          Half of $350$.
        feedback: >
          $0.5 \times 350 = 175$. $168$ sits right next to it; $1680$ and
          $16.8$ are each a factor of ten away.

      - part: One check per failure mode
        teach: >
          These are the cheap checks: parity (must the answer be odd or even?),
          last digit, digit sum mod $9$, and rough magnitude. Each is blind
          where another sees. Digit sums miss decimal slips; magnitude misses
          a wrong digit that leaves the size alone. None of them redoes the
          problem, so the four together cost about a second, against eight for
          a recompute. Run them before the answer leaves your hand.
      - ask: >
          A trader's $13$ fills were each an odd number of lots, and you total
          them as $312$. Which check rejects that total without re-adding
          anything?
        choices:
          - text: >
              Casting out nines.
            feedback: >
              It would work, but it needs the digit sum of all $13$ fills,
              which is most of the way to re-adding them.
          - text: >
              Parity: thirteen odd numbers sum to an odd number.
            correct: true
            feedback: >
              Each pair of odd numbers sums to an even one, and one odd number
              is left over. $312$ is even, so it is wrong, and you knew that
              from the count alone.
          - text: >
              Magnitude: $312$ is too large for thirteen fills.
            feedback: >
              Nothing in the question bounds the fill sizes, so $312$ is
              perfectly plausible in size. Size is not where this error lives.
        feedback: >
          Parity is structural: often the shape of the problem fixes it before
          any digit is computed.
      - ask: >
          Before multiplying $6.1 \times 0.0395$, estimate the product to one
          significant figure.
        expects: "0.24"
        tolerance: 0.01
        hint: >
          Round each factor to one easy figure.
        feedback: >
          $6 \times 0.04 = 0.24$. The exact value is $0.24095$. A slip that
          writes $2.4095$ or $0.024095$ fails at once, and neither the digit
          sum nor the last digit could tell those three apart.

      - part: What gets through
        ask: >
          You compute $38 \times 27$ and write $1206$; the true product is
          $1026$, two digits swapped. Run parity, last digit, mod $9$ and a
          rough "about a thousand" estimate. Which fires?
        choices:
          - text: >
              Mod $9$.
            feedback: >
              $1206$ and $1026$ both have digit sum $9$. Swapping two digits
              never changes a digit sum, so a transposition always gets past
              casting out nines.
          - text: >
              Last digit.
            feedback: >
              $8 \times 7 = 56$ ends in $6$, and so does $1206$. The swap left
              the units digit alone.
          - text: >
              None of them.
            correct: true
            feedback: >
              Both are even, both end in $6$, both have digit sum $9$, and
              both are about a thousand. A passed battery rules out kinds of
              error; it does not prove the answer.
          - text: >
              Parity.
            feedback: >
              $38$ is even, so the product is even, and $1206$ is even. Parity
              only ever sees the last digit's evenness.
        feedback: >
          Every check is a necessary condition. A transposition is the classic
          error that slips past all four run loosely.
      - ask: >
          Tighten the estimate into a bound. $38 \times 27$ is less than
          $40 \times 27$. What is $40 \times 27$?
        expects: "1080"
        hint: >
          $4 \times 27$, then a zero.
        feedback: >
          $40 \times 27 = 1080$, so the product is under $1080$ and $1206$ is
          impossible. Rounding one factor in a known direction turns a vague
          size check into a hard bound for no extra time.
      - teach: >
          In a live mental-math round, say the checks as you go: "even, ends in
          six, digit sum nine, under ten-eighty: ten twenty-six." Narrating
          them is how an interviewer hears that you catch your own slips.

  - node: quant-mental.game-tactics.verification-budget
    hook: >
      "Should I double-check that" has a real answer, and it isn't
      "always" or "never" — it's whichever side of a specific
      cost-benefit line the particular check falls on.
    explanation: >
      A check is worth its time exactly when the points it's expected
      to protect exceed the points you'd earn spending that same time at
      your optimal pace instead. If a check costs $T$ seconds and, with
      probability $q$, catches a mistake worth the full $a+b$ point
      swing, its expected benefit is $q(a+b)$ against an opportunity
      cost of $rT$, where $r$ is your optimal-pace score rate — worth
      running exactly when $q>rT/(a+b)$.

      A one-second check has a tiny $T$, so its break-even $q$ is tiny
      too — almost any nonzero catch rate clears it, which is why cheap
      checks are a default, run on everything. A full recompute has $T$
      on the order of the time to solve the problem itself, making $rT$
      large, so $q$ needs to be large — often unrealistically so — to
      clear the bar, which is why full rechecks are reserved for answers
      that already feel shaky, not run as routine.
    worked: >
      At an optimal-pace rate of $r=0.1$ points per second on a
      $+1/-1$ round ($a+b=2$), a check pays off when $q>rT/(a+b)$. A
      1-second parity check needs only $q>0.1(1)/2=0.05$ — a 5 percent
      catch rate justifies it, easily cleared by the checks from before.
      A full 20-second recompute needs $q>0.1(20)/2=1.0$ — certainty
      that you're wrong, a bar an answer you're merely unsure about
      essentially never honestly clears.
    interview: >
      "Do you check every answer" is answered with the cost-benefit
      framing directly — state the opportunity cost of the time at your
      own scoring rate, not a blanket policy in either direction.
    pitfalls: >
      Running a full recompute out of general caution burns round time
      the arithmetic says is essentially never worth it at typical
      paces. Skipping even the free parity and magnitude checks because
      "time is precious" is the opposite mistake, since their break-even
      catch rate is close to zero. The break-even bar also scales with
      $a+b$: on a harsher-penalty test the same check protects more
      points and is worth relatively more time.
    recap: >
      A check pays exactly when the points it's expected to protect
      beat the points you'd earn spending that time at your optimal pace
      instead — nearly always true for a cheap check, nearly never true
      for a full recompute.
    dialogue:
      - part: Twelve seconds to be sure
        teach: >
          A round pays $+4$ for a right answer, $-2$ for a wrong one, $0$ for a
          blank, and at your pace you earn about $0.2$ points a second. You
          have just written an answer. A full recompute would take $12$
          seconds, and you think there is a $10$ percent chance the answer is
          wrong, in which case the recompute would catch it.
      - ask: >
          If the recompute does catch a mistake, how many points does that
          save you?
        expects: "6"
        hint: >
          Where does the question's score go from, and to?
        feedback: >
          A caught mistake moves the question from $-2$ to $+4$, a swing of
          $a + b = 6$ points, not just the $4$ you gain.
      - ask: >
          How many points does the recompute protect, in expectation?
        expects: "0.6"
        hint: >
          The swing times the chance it is needed.
        feedback: >
          $0.1 \times 6 = 0.6$ points.
      - ask: >
          The recompute is worth $+0.6$ points in expectation. Do you run it?
        choices:
          - text: >
              Yes: any check with positive expected value is worth running.
            feedback: >
              $+0.6$ is what it protects, not what it nets. Its twelve seconds
              would otherwise go to the next question.
          - text: >
              No: twelve seconds at $0.2$ a second is $2.4$ points of other
              questions.
            correct: true
            feedback: >
              It protects $0.6$ and costs $2.4$, a net loss of $1.8$ points.
              The check is diligent and still a bad trade.
          - text: >
              Yes: with a penalty in play, accuracy is worth more than speed.
            feedback: >
              The penalty is already priced into the $6$-point swing. Even
              with it, the twelve seconds earn four times as much spent on new
              questions.
        feedback: >
          On a clock, a check costs the points you would have earned in its
          time. Any honest comparison has to price that.

      - part: The price of a second
        reflect: >
          Write the condition for a check to be worth running, in terms of its
          length $T$ in seconds, the chance $q$ that it catches a mistake, the
          scoring rule $+a/-b/0$, and your rate $r$ in points per second.
        hint: >
          You just compared two quantities, one on each side.
        answer: >
          The check protects $q(a+b)$ points and costs $rT$ points of forgone
          questions, so it pays exactly when $q(a+b) > rT$, that is, when $q >
          rT/(a+b)$. Here the recompute needs $q > 0.2 \times 12/6 = 0.4$,
          and you put it at $0.1$.
      - teach: >
          That is the verification budget: a check is worth its time exactly
          when the points it protects beat the points the same time earns at
          your working pace. The break-even catch rate $rT/(a+b)$ grows with
          the check's length. A one-second check needs almost no catch rate to
          pay; a full recompute, which takes about as long as the question,
          needs a large one.
      - ask: >
          In the same round, the one-second battery of parity, last digit, mod
          $9$ and magnitude. What catch rate does it need to break even?
        expects: "1/30"
        tolerance: 0.0005
        hint: >
          $rT/(a+b)$ with $T = 1$.
        feedback: >
          $0.2 \times 1/6 = 1/30 \approx 0.033$. If it catches a mistake on
          more than one answer in thirty, it pays. That is why the cheap checks
          run on everything.
      - ask: >
          And the $12$-second recompute: what catch rate does it need?
        expects: "0.4"
        hint: >
          Same formula, $T = 12$.
        feedback: >
          $0.2 \times 12/6 = 0.4$. You would have to think the answer is more
          likely than $40$ percent to be wrong, and the recompute sure to find
          it, before it pays.

      - part: When the full recheck pays
        ask: >
          In this round, on which answer is the $12$-second recompute worth
          running?
        choices:
          - text: >
              Every answer: a recheck is never wasted when mistakes cost
              points.
            feedback: >
              On an answer that felt routine, with perhaps a $5$ percent chance
              of being wrong, it protects $0.05 \times 6 = 0.3$ points and
              costs $2.4$.
          - text: >
              The answer where you lost track of a carry and would put it at
              even odds of being wrong.
            correct: true
            feedback: >
              $q = 0.5$ clears the $0.4$ bar: it protects $0.5 \times 6 = 3$
              points against a cost of $2.4$.
          - text: >
              The answer to the hardest question, since hard questions have
              the most errors.
            feedback: >
              What matters is your chance of being wrong on this answer, not
              the question's difficulty. A hard question you solved cleanly can
              sit well under the bar.
        feedback: >
          Run the cheap checks on every answer and save the full recheck for
          answers that already feel shaky.
      - ask: >
          A harsher round pays $+4$ and $-8$, and suppose your rate is still
          $0.2$ points a second. What catch rate does the $12$-second
          recompute need now?
        expects: "0.2"
        hint: >
          The swing is now $4 + 8$.
        feedback: >
          $0.2 \times 12/12 = 0.2$. The bar halved from $0.4$ because each
          catch now saves $12$ points, not $6$.
      - ask: >
          Now a no-penalty round paying $+4$, rate still $0.2$. Compared with
          $+4/-2$, is the one-second battery worth more or less?
        choices:
          - text: >
              More: with no penalty you can afford to slow down and check.
            feedback: >
              With no penalty, a wrong answer costs nothing beyond the missed
              $4$, so a caught mistake saves only $4$, not $6$. Checks get
              cheaper to skip, not more valuable.
          - text: >
              Less: a catch saves only $4$, so it now needs a catch rate of
              $0.05$ instead of $1/30$.
            correct: true
            feedback: >
              $0.2 \times 1/4 = 0.05$. It still pays at any realistic catch
              rate, but the case for checking weakens as the penalty falls.
          - text: >
              The same: the check takes the same one second.
            feedback: >
              The cost is the same; the benefit is not. The swing a catch
              protects is $a + b$, and $b$ just went to $0$.
        feedback: >
          The bar is $rT/(a+b)$: longer checks and gentler penalties raise it,
          harsher penalties lower it.
      - teach: >
          Asked "do you check every answer?", the answer is a price: "the
          one-second checks, always; a full recheck only when I think I'm more
          than about forty percent likely to be wrong, because twelve seconds
          costs me two and a half points of other questions."

  - node: quant-mental.game-tactics.composure
    hook: >
      Interviewers watching you work through a timed set are not only
      grading the final number — a visibly improvised process, sped up
      or slowed down on the fly, is itself the signal they're reading.
    explanation: >
      Improvising decisions live — whether to check, what order to
      take, how to react when stuck — adds variance to your realized
      pace question to question. Because the error curve bends up
      sharply only near your limit, that added variance disproportionately
      lands you in the steep region even when your average pace looks
      fine on paper, since the costly excursions are the ones close to
      the edge, not the ones comfortably below it.

      A pre-committed routine — a fixed default order, a fixed default
      check, a fixed default reaction to getting stuck, such as flagging
      it and moving on — works like a guardrail keeping your realized
      pace off that steep stretch, at the cost of a little average speed
      you'd otherwise gain by improvising a shortcut when things happen
      to be going well.

      This is also why composure reads as a signal to an interviewer
      beyond simple comfort: a rehearsed routine generalizes to problems
      the interviewer hasn't seen worked out, while an improvised one
      offers no evidence about how you'll behave on the next one.
    interview: >
      "What do you do when you get stuck" is a composure question
      wearing an arithmetic costume — the answer that scores is a
      specific, pre-decided default reaction, not a description of
      trying harder in the moment.
    pitfalls: >
      Treating composure as a purely psychological instruction ("stay
      calm") rather than a concrete procedural commitment means there's
      no actual guardrail in place when pressure hits — the routine only
      works if it was decided in advance, not improvised under the exact
      pressure it's meant to protect against. Over-building the routine
      so it's slower than necessary even when nothing is going wrong
      gives up more average speed than the reduced variance is worth.
    recap: >
      A rehearsed default response to getting stuck trades a little
      average speed for a lot less variance, which is what keeps you off
      the steep part of the speed-accuracy curve when it matters.
    dialogue:
      - part: Same average, different rounds
        teach: >
          Two candidates share one error curve: at $6$ seconds a question they
          get $2$ in $100$ wrong, at $5$ seconds $4$, at $4$ seconds $16$. Both
          average $5$ seconds a question. A works every question at $5$. B
          swings: half the questions calm at $6$ seconds, half rushed at $4$,
          after getting rattled.
      - ask: >
          Who makes more mistakes?
        choices:
          - text: >
              Neither: the same average pace gives the same error rate.
            feedback: >
              That would hold if the curve were a straight line. B's calm half
              runs $2$ per hundred and the rushed half $16$, an average of $9$
              against A's $4$.
          - text: >
              B: the rushed half costs more than the calm half saves.
            correct: true
            feedback: >
              The calm questions save $2$ mistakes per hundred against A; the
              rushed ones cost $12$ more. Those do not cancel.
          - text: >
              A: B's slow questions are nearly error-free, which makes up for
              the fast ones.
            feedback: >
              Slowing from $5$ to $6$ seconds only takes errors from $4$ to $2$
              per hundred. There is not much left to save on the slow side.
        feedback: >
          Same average pace, more than twice the mistakes. The swings
          themselves cost accuracy.
      - ask: >
          What is B's error rate, in mistakes per $100$ questions?
        expects: "9"
        hint: >
          Average the two halves.
        feedback: >
          $(2 + 16)/2 = 9$, against $4$ for A.
      - ask: >
          Over a $40$-question round, how many more mistakes does B expect to
          make than A?
        expects: "2"
        hint: >
          The gap is $5$ per hundred.
        feedback: >
          $40 \times 0.09 = 3.6$ against $40 \times 0.04 = 1.6$: two extra
          mistakes, at the same average speed.

      - part: Why the swings cost
        reflect: >
          B is no slower than A on average. Where do B's extra mistakes come
          from, and what does that say about a round in which your pace
          lurches between relaxed and rushed?
        hint: >
          Compare what a second gained buys with what a second lost costs on
          this curve.
        answer: >
          The curve bends. Going a second slower than $5$ saves only $2$
          mistakes per hundred, while going a second faster costs $12$, so
          swings around an average land much harder on the steep side than
          they gain on the flat side. Any variation in your pace raises your
          error rate above the rate at your average pace. Steadiness is worth
          accuracy in its own right.
      - teach: >
          That is what composure is for. A pre-committed routine, a fixed order
          of work, a fixed check, a fixed reaction to getting stuck such as
          flagging the question after a set time, keeps your pace near a
          chosen point and off the steep stretch. It costs a little average
          speed, since you never cut a corner on a hot streak, and removes the
          excursions. The improvised move under pressure, rushing to catch up,
          is exactly the one that crosses the knee.
      - ask: >
          Which of these is a routine in that sense?
        choices:
          - text: >
              "Stay calm and focus when it gets tight."
            feedback: >
              That is a mood, not a procedure. Under pressure it tells you
              nothing about what to do next.
          - text: >
              "If I haven't cracked a question in $20$ seconds, I flag it and
              move on."
            correct: true
            feedback: >
              A concrete trigger and a concrete action, decided before the
              round, when you were not under pressure.
          - text: >
              "After a hard question, I make up the lost time on the next
              few."
            feedback: >
              That is a rule, but it encodes the panic move: it sends you onto
              the steep part of the curve exactly when you are most rattled.
        feedback: >
          A routine names the situation and the response in advance, so the
          decision is not made at the moment you are worst placed to make it.
      - ask: >
          On the same curve, a question you could not crack rattles you, and
          without noticing you take the next ten at $4$ seconds instead of $5$.
          How many extra mistakes do you expect on those ten?
        expects: "1.2"
        hint: >
          Each of the ten goes from $4$ to $16$ per hundred.
        feedback: >
          $10 \times (0.16 - 0.04) = 10 \times 0.12 = 1.2$ extra mistakes, to
          save $10$ seconds. Ten seconds bought at the price of more than a
          whole question's worth of accuracy.

      - part: What a routine costs
        ask: >
          Suppose a routine caps B's rushed questions at $5$ seconds, while
          the calm ones stay at $6$. What is B's error rate now, per $100$
          questions?
        expects: "3"
        hint: >
          Half the questions at $6$ seconds, half at $5$.
        feedback: >
          $(2 + 4)/2 = 3$, down from $9$. The price is speed: B's average pace
          slows from $5$ to $5.5$ seconds, ten percent, for two thirds fewer
          mistakes.
      - ask: >
          Which of these routines is over-built, costing more speed than the
          variance it removes is worth?
        choices:
          - text: >
              Working the questions in the same order every round.
            feedback: >
              That costs no time at all; it only removes a decision.
          - text: >
              Flagging any question not cracked in $20$ seconds.
            feedback: >
              That costs nothing on the questions that go well and caps the
              ones that do not. It is close to free.
          - text: >
              Redoing every answer from scratch before moving on.
            correct: true
            feedback: >
              It roughly doubles the time of every question, including the
              many that were never in danger, to guard against a slip that is
              rare. Steadiness bought at that price is not worth having.
        feedback: >
          A good routine is cheap when nothing is wrong and decisive when
          something is. One that slows every question is a different kind of
          mistake.
      - teach: >
          Asked "what do you do when you get stuck?", give the routine, not
          the mood: "after twenty seconds I flag it and move on, and the next
          question gets my normal pace." A stated default you follow is the
          evidence an interviewer is listening for.
