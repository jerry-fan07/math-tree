unit: quant-mental.game-tactics
opening: >
  This unit turns an already-known scoring rule and an already-known
  arithmetic toolkit into a decision procedure for playing a timed
  quantitative round well: when a partial guess is worth the risk, how
  fast to actually go, in what order to attack the questions, and which
  checks are cheap enough to run on every single answer. The arc runs
  from the scoring rule itself, to the guessing threshold it implies,
  through a worked case where eliminating one option flips a break-even
  guess into a profitable one, into the physical fact that error rate
  bends upward sharply near your top speed, and out to pace, sequencing,
  checking, and the composure that keeps you off the steep part of that
  curve. Nothing here replaces arithmetic skill — it decides how to
  deploy the arithmetic skill you already have under a clock.
lessons:
  - node: quant-mental.game-tactics.scoring-rules
    hook: >
      Every guessing, pacing, and sequencing decision in this chapter
      reduces to a single number pulled from this rule — get the rule
      wrong and every downstream tactic computes the wrong answer with
      perfect internal consistency.
    explanation: >
      A scoring rule is nothing more than three numbers attached to
      three outcomes: reward $a$ for a correct answer, penalty $b$ for a
      wrong one, and usually $0$ for a skip. What matters downstream is
      never $a$ and $b$ individually, only their ratio $b/a$ — doubling
      both numbers doubles every score in the round but changes no
      decision, because every comparison later in this chapter is a
      comparison of expected values, and expected values scale linearly
      with the reward unit.

      Concretely, a $+2/-1$ rule and a $+6/-3$ rule are the same game in
      disguise — both have $b/a=1/2$ — so any guessing threshold, pacing
      choice, or sequencing decision you'd make under one is identical
      under the other. Only the units of the final score differ.

      This is why the first move on seeing a new timed test is to
      extract $a$ and $b$ and reduce them to that single ratio, not to
      memorize the raw point values. A no-penalty test ($b=0$) collapses
      every later guessing decision to "always attempt," since skipping
      can never beat a nonnegative expected score; a harsh $+1/-2$ test
      compresses the safe zone dramatically, since a wrong answer now
      costs twice what a right one earns.
    worked: >
      A trading-desk mental-math round scores $+4$ for a correct answer
      and $-3$ for a wrong one, nothing for a skip. Reduce it: $b/a=3/4
      =0.75$. That single number is already comparable across tests
      without touching a formula — it sits above the SAT's $1/4$ and
      even above the harsh $+1/-2$ example's $2/3$, so this round's
      break-even confidence bar will end up higher than either.
    interview: >
      When an interviewer states a scoring rule out loud, often as an
      aside mid-question, repeating it back as a reduced ratio ("so
      that's a three-to-four penalty") signals you've internalized the
      one number that drives everything that follows, rather than
      needing the raw values restated later.
    pitfalls: >
      Anchoring on the raw reward $a$ — assuming a bigger $+a$ always
      means a more forgiving test — ignores that only the ratio to $b$
      matters; a $+10/-10$ test is exactly as harsh as $+1/-1$. Treating
      a nonzero skip credit $c$ as irrelevant is also a mistake: it
      doesn't change the ratio comparison but does shift the zero
      baseline every expected-value calculation compares against.
    recap: >
      A scoring rule collapses to one number, $b/a$, and every guessing,
      pacing, and sequencing decision that follows depends on nothing
      else about it.
    steps:
      - teach: >
          A scoring rule is three numbers: $+a$ for a correct answer, $-b$ for
          a wrong one, and usually $0$ for a skip. Every decision in this
          chapter — guess or skip, how fast to work, which question to attempt
          first — is computed from these three numbers and nothing else.
      - teach: >
          What matters is never $a$ and $b$ individually, only their ratio
          $b/a$. Doubling both numbers doubles every score in the round, but it
          changes no decision, because every comparison ahead is a comparison
          of expected values, and expected values scale linearly with the
          reward unit.
      - ask: >
          A test scores $+2$ correct, $-1$ wrong. A second test scores $+8$
          correct, $-4$ wrong. How do the two compare?
        choices:
          - text: >
              The second test is twice as harsh, since its penalty is $4$
              points instead of $1$.
            feedback: >
              The raw penalty grew, but so did the reward — compare the ratio,
              not the raw numbers.
          - text: >
              The two tests are identical in every decision that matters, since
              $b/a=1/2$ for both.
            correct: true
            feedback: >
              $1/2=4/8$: the same ratio, so the same guessing threshold, pacing
              choice, and sequencing decision apply to both — only the units of
              the final score differ.
          - text: >
              The first test is harsher, since its raw penalty is smaller and
              therefore stings less forgivingly.
            feedback: >
              Smaller raw numbers don't mean a harsher or gentler rule — only
              the ratio $b/a$ carries that information.
        feedback: >
          $b/a = 1/2$ for both rules — a $+2/-1$ test and a $+8/-4$ test are
          the same game in different units.
      - teach: >
          This is why the first move on a new timed test is to extract $a$ and
          $b$ and reduce them to that single ratio, not to memorize the point
          values. A no-penalty test ($b=0$) collapses every guessing decision
          to *always attempt*, since skipping can never beat a nonnegative
          expected score, while a harsh rule like $+1/-2$ compresses the safe
          zone sharply, since a wrong answer costs twice what a right one
          earns.
      - ask: >
          A round scores $+5$ for a correct answer, $-2$ for a wrong one, and
          $0$ for a skip. What is $b/a$ for this rule?
        expects: "2/5"
        hint: >
          Divide the penalty by the reward — don't touch the skip value.
        feedback: >
          $b/a = 2/5 = 0.4$. That single number is everything the guessing,
          pacing, and sequencing decisions ahead will use — the $5$ and the $2$
          individually never appear again.
      - teach: >
          A nonzero skip credit $c$ doesn't enter this ratio comparison — $b/a$
          still drives every decision — but it does shift the zero baseline
          every expected-value calculation compares against. Treat $c$ as
          changing what *break-even* means, never as changing the ratio itself.
      - ask: >
          Which of these three scoring rules is the harshest one to guess
          under?
        choices:
          - text: >
              $+10$ correct, $-10$ wrong
            feedback: >
              $b/a=1$, the same ratio as $+1/-1$ — a bigger raw reward doesn't
              make a rule gentler.
          - text: >
              $+1$ correct, $-1$ wrong
            feedback: >
              $b/a=1$ — identical harshness to $+10/-10$, just measured in
              smaller units.
          - text: >
              $+4$ correct, $-6$ wrong
            correct: true
            feedback: >
              $b/a = 6/4 = 1.5$, larger than the other two rules' ratio of $1$
              — the one rule here where a wrong answer costs more than a right
              one earns.
        feedback: >
          Harshness lives entirely in $b/a$: the first two rules tie at $b/a=1$
          despite different raw point values, and the third is strictly
          harsher.
      - teach: >
          One ratio, $b/a$, is the whole scoring rule as far as every tactic in
          this chapter is concerned — extract it first, and every guessing,
          pacing, and sequencing decision that follows starts from that single
          number.

  - node: quant-mental.game-tactics.guessing-ev
    hook: >
      The instant an interviewer asks "would you guess here," this is
      the entire computation you're expected to produce in your head —
      one inequality, no scratch paper.
    explanation: >
      Attempting a question you'll answer correctly with probability $p$
      earns $a$ with probability $p$ and loses $b$ with probability
      $1-p$, so its expected score is $pa-(1-p)b$; skipping guarantees
      exactly $0$. Collecting the $p$ terms and dividing by $a+b$ turns
      "attempt beats skip" into the single inequality $p>b/(a+b)$ — the
      whole derivation is nothing but comparing two expected values, the
      same object from the expectation chapter, applied to two possible
      actions instead of one random payoff.

      Read the threshold as the reward's share of the total point swing
      $a+b$: a symmetric $+1/-1$ rule splits that swing down the middle,
      so any lean past even odds is worth taking, while an asymmetric
      rule shifts the split — a bigger penalty demands a bigger share of
      confidence before the reward side wins the comparison.

      Nothing here is new machinery beyond expectation itself; it's two
      expected values set against each other, and the threshold is just
      where they cross.
    worked: >
      Take a $+2/-3$ rule: correct answers earn $2$, wrong answers cost
      $3$. The threshold is $p>b/(a+b)=3/5=0.6$. At $p=0.55$ — a real
      lean, but short of confident — skip: expected score of attempting
      is $0.55(2)-0.45(3)=1.1-1.35=-0.25$, confirming the negative
      verdict. Push confidence to $p=0.65$ and the same rule flips:
      $0.65(2)-0.35(3)=1.3-1.05=0.25>0$, now worth attempting.
    interview: >
      "Would you guess on this one" is asked with a stated or implied
      scoring rule and an implied confidence level; the fluent answer
      states the threshold formula, plugs in the numbers, and gives a
      yes-or-no in one breath, not a vague "depends how sure I am."
    pitfalls: >
      Comparing $p$ to $1/2$ out of habit even when the rule isn't
      symmetric is the most common slip — the bar moves with the rule,
      and a $+1/-2$ test demands $p>2/3$, not $p>1/2$. Computing attempt
      EV as $pa-b$ instead of $pa-(1-p)b$ forgets the penalty term is
      itself weighted by $(1-p)$, which understates the value of every
      guess and tips you toward skipping when attempting was correct.
    recap: >
      Attempt exactly when your confidence clears $b/(a+b)$; below it,
      skipping's guaranteed $0$ beats the guess.
    steps:
      - teach: >
          An attempted question earns $a$ with probability $p$ and costs $b$
          with probability $1-p$; a skipped one guarantees exactly $0$. *Should
          I guess* is really *which of these two numbers is bigger* — nothing
          more exotic than that.
      - teach: >
          Attempt-EV is $pa - (1-p)b$. Setting it above zero and solving for
          $p$ turns *attempt beats skip* into one inequality: $p > b/(a+b)$ —
          the reward's share of the total point swing $a+b$.
      - ask: >
          A round scores $+3$ correct, $-1$ wrong, $0$ skip. What confidence
          $p$ do you need before attempting is worth it?
        expects: "1/4"
        hint: >
          Compute $b/(a+b)$ with $a=3$, $b=1$.
        feedback: >
          $b/(a+b) = 1/4 = 0.25$: attempt whenever your confidence clears a
          quarter, a low bar because a wrong answer here costs a third of what
          a right one earns.
      - teach: >
          Read the threshold as the reward's share of the total swing $a+b$. A
          symmetric $+1/-1$ rule splits that swing down the middle at $p>1/2$;
          a harsher rule shifts the split — a bigger penalty demands a bigger
          share of confidence before the reward side wins.
      - ask: >
          A round scores $+1$ correct, $-3$ wrong. You're leaning toward an
          answer with confidence $p=0.6$. Should you attempt?
        choices:
          - text: >
              Yes — $p=0.6$ is past even odds, and that's always enough to
              guess.
            feedback: >
              Even odds is only the bar for a symmetric $+1/-1$ rule. Here
              $b/(a+b)=3/4=0.75$, well above $0.6$.
          - text: >
              No — the threshold here is $3/4$, and $0.6$ falls short of it.
            correct: true
            feedback: >
              $b/(a+b)=3/4=0.75$; at $p=0.6$, attempt-EV is
              $0.6(1)-0.4(3)=0.6-1.2=-0.6$, confirming skip is right.
          - text: >
              It depends on how many questions are left in the round.
            feedback: >
              The guess-or-skip comparison only needs $p$, $a$, and $b$ —
              remaining time governs pacing and sequencing, not this decision.
        feedback: >
          $b/(a+b)=3/4$ here — a much heavier penalty than $+1/-1$'s $1/2$, so
          a $0.6$ lean isn't nearly enough.
      - teach: >
          Nothing here is new machinery beyond expectation itself: it's two
          expected values, attempt and skip, set against each other, and the
          threshold is exactly where they cross.
      - ask: >
          A round scores $+2$ correct, $-4$ wrong. At $p=0.7$, what is the
          actual attempt-EV — not the shortcut $pa-b$, but the full
          $pa-(1-p)b$?
        expects: "0.2"
        hint: >
          The penalty term is weighted by $(1-p)$, not applied in full.
        feedback: >
          $0.7(2)-0.3(4)=1.4-1.2=0.2$. The common slip computes
          $pa-b=0.7(2)-4=-2.6$ instead, understating the attempt and tipping
          you toward skipping when attempting was actually correct.
      - teach: >
          Attempt exactly when your confidence clears $b/(a+b)$; below it,
          skipping's guaranteed $0$ beats the guess, and the bar moves with the
          rule, never with habit.

  - node: quant-mental.game-tactics.partial-credit-guessing
    hook: >
      "Down to two options — do you guess" is asked expecting a fresh
      computation, not a reflex "yes, elimination always helps" — the
      SAT case that motivates this generalizes, but not automatically.
    explanation: >
      Many standardized $n$-choice tests set $b=a/(n-1)$ specifically so
      a uniformly blind guess sits exactly at the threshold: with
      $p=1/n$ and $b/(a+b)=1/n$ forced by that choice of $b$, blind
      guessing is neither punished nor rewarded. This isn't an accident
      of the SAT's particular numbers — it's the calibration rule behind
      any $n$-choice test scored this way, and it generalizes the
      five-choice case directly.

      Eliminating $k$ wrong options raises your conditional confidence
      from $1/n$ to $1/(n-k)$ on the survivors, strictly increasing $p$
      while $a$, $b$, and the threshold stay fixed — so elimination
      always pushes you toward or past the bar. What it does not do is
      guarantee crossing it: how much elimination is needed depends on
      how far the rule's actual threshold sits above the calibrated
      $1/n$ starting point.
    worked: >
      A four-choice test scored $+1$ correct, $-\tfrac{1}{3}$ wrong
      follows the same calibration: $b=a/(n-1)=1/3$ exactly. Blind
      guess: $p=1/4$, and $\tfrac14(1)-\tfrac34(\tfrac13)=\tfrac14
      -\tfrac14=0$ — indifferent again, confirming the design principle
      holds for $n=4$, not just five choices. Eliminate one wrong option
      and $p$ rises to $1/3$: $\tfrac13(1)-\tfrac23(\tfrac13)=\tfrac13
      -\tfrac29=\tfrac19>0$ — profitable, the same qualitative jump as
      the five-choice case.
    interview: >
      The compressed version of this whole example is "down to two —
      guess or not?" The fast answer recomputes $p$ from the number of
      survivors and checks it against the rule's own threshold, rather
      than reciting "always guess after elimination" as a blanket rule.
    pitfalls: >
      Assuming any elimination automatically makes guessing worth it
      skips the check: under a harsher $+1/-2$ rule (threshold
      $p>2/3$) on the same four-choice test, eliminating one option
      gives $p=1/3$ and eliminating two gives $p=1/2$ — both still below
      the bar, so guessing stays wrong until only one choice is left.
    recap: >
      Elimination always raises your confidence toward the guessing bar,
      but whether it actually clears the bar is a fresh computation
      against the rule's own threshold, not a free pass.
    steps:
      - teach: >
          *Down to two options — do you guess* expects a fresh computation, not
          a reflex *yes, elimination always helps.* The SAT's five-choice case
          is one instance of a general calibration, not a rule that stops at
          five.
      - teach: >
          Many $n$-choice tests set $b=a/(n-1)$ specifically so a uniformly
          blind guess sits exactly at the threshold: with $p=1/n$ and that
          choice of $b$, $b/(a+b)=1/n$ too, so blind guessing is neither
          punished nor rewarded, whatever $n$ is.
      - ask: >
          A six-choice test scores $+1$ correct, $-\tfrac{1}{5}$ wrong —
          calibrated so $b=a/(n-1)=1/5$. What is the expected score of a blind
          guess?
        expects: "0"
        hint: >
          Blind guess confidence is $p=1/6$; plug it into $pa-(1-p)b$.
        feedback: >
          $\tfrac16(1)-\tfrac56(\tfrac15)=\tfrac16-\tfrac16=0$ — exactly
          indifferent, the calibration working as designed for $n=6$, not just
          five choices.
      - teach: >
          Eliminating $k$ wrong options raises your conditional confidence from
          $1/n$ to $1/(n-k)$ on the survivors, strictly increasing $p$ while
          $a$, $b$, and the threshold stay fixed — elimination always pushes
          you toward or past the bar. What it doesn't do is guarantee crossing
          it.
      - ask: >
          On that same six-choice test, you eliminate two wrong options,
          leaving four. What is the expected score of guessing now?
        expects: "1/10"
        hint: >
          Confidence rises to $p=1/4$; use the same $+1/-\tfrac15$ rule.
        feedback: >
          $\tfrac14(1)-\tfrac34(\tfrac15)=\tfrac14-\tfrac{3}{20}=\tfrac{5}{20}-\tfrac{3}{20}=\tfrac{2}{20}=\tfrac{1}{10}$,
          comfortably profitable.
      - ask: >
          A five-choice test scores $+1$ correct, $-2$ wrong — a much harsher
          rule with threshold $p>2/3$. You eliminate two wrong options, leaving
          three. Should you guess?
        choices:
          - text: >
              Yes — eliminating options always clears the bar eventually, and
              two is usually enough.
            feedback: >
              Elimination always helps, but *usually enough* isn't a number —
              check the actual $p$ against $2/3$.
          - text: >
              No — $p$ only rose to $1/3$, still well short of the $2/3$
              threshold.
            correct: true
            feedback: >
              $p=1/3$ against a $2/3$ bar: attempt-EV is
              $\tfrac13(1)-\tfrac23(2)=\tfrac13-\tfrac43<0$. Under this harsher
              rule you'd need to eliminate down to a single remaining choice
              before guessing pays.
          - text: >
              Yes — three choices is close enough to a coin flip to guess.
            feedback: >
              Three choices gives $p=1/3$, nowhere near a coin flip, and even a
              coin flip wouldn't clear this rule's $2/3$ bar.
        feedback: >
          The calibration only holds at $n$ choices with $b=a/(n-1)$; a harsher
          rule needs far more elimination — here, all the way down to one
          survivor — before guessing is worth it.
      - teach: >
          Elimination always raises your confidence toward the guessing bar,
          but whether it actually clears the bar is a fresh computation against
          that rule's own threshold, never a free pass copied from a different
          test.

  - node: quant-mental.game-tactics.speed-accuracy
    hook: >
      Racing to your top speed feels like it should maximize points, but
      the accuracy you're trading away accelerates exactly where the
      time you're saving slows down — the edge is close to the worst
      place on the curve to operate.
    explanation: >
      Error rate, plotted against how fast you're working, is not a
      straight line. Comfortably below your ceiling, going noticeably
      faster costs almost nothing in accuracy — you're cutting slack you
      didn't need. Close to your absolute limit, the same increment in
      speed produces a disproportionate jump in mistakes: the curve
      bends upward, convex rather than linear.

      Picture a mental-math drill where a comfortable pace of one answer
      every 10 seconds runs 2 percent errors; pushing to one every 7
      seconds might only raise that to 5 percent, but pushing further to
      one every 5 seconds can jump errors to 25 percent or more — the
      same 2-second cut in each step costs an increasingly larger
      accuracy price, because the fast regime forces you to skip steps
      (a recheck, a carry, a sign) that the slower regime had room for.

      The implication is where to aim: not the fastest pace you can
      sustain at all, but the knee of this curve — the point where the
      accuracy cost per unit of speed gained starts to explode. Locating
      that knee, not racing the edge, is what the rest of this chapter
      turns into an actual optimization.
    interview: >
      This rarely shows up as a question asked outright — it's a
      pattern watched for during a live mental-math or estimation round.
      An interviewer clocking your pace notes where your error rate
      visibly jumps, and easing off before that point shows you can feel
      the curve rather than needing it drawn for you.
    pitfalls: >
      Treating your error rate as roughly constant across paces and
      extrapolating from a slow, accurate trial run to a much faster
      pace ignores exactly the part of the curve that bends. Assuming
      the knee is fixed rather than personal is a second trap — it moves
      down as fatigue sets in, so a pace safe in the first ten minutes
      may not stay safe in the last ten.
    recap: >
      Error rate rises convexly, not linearly, as pace approaches your
      limit, so the last slice of speed costs far more accuracy than the
      slice before it.
    steps:
      - teach: >
          Racing to your absolute top speed feels like it should maximize
          points, since more attempts means more chances to score. But the
          accuracy you're trading away doesn't fall off at a constant rate — it
          accelerates exactly where the time you're saving slows down.
      - teach: >
          Error rate plotted against pace is convex, not linear. Comfortably
          below your ceiling, going faster costs almost nothing in accuracy;
          close to your absolute limit, the same increment in speed produces a
          disproportionate jump in mistakes.
      - teach: >
          Picture a drill where one calculation every 12 seconds runs 3 percent
          errors. Pushing to one every 9 seconds — a 3-second cut — raises that
          to 6 percent. Pushing the same 3-second cut further, to one every 6
          seconds, jumps errors to 30 percent.
      - ask: >
          In that drill, the first 3-second cut (from 12 seconds to 9 seconds
          per question) raised errors by 3 percentage points. The second
          3-second cut (from 9 seconds to 6 seconds) raised errors by 24
          percentage points. How many times larger is the second cut's accuracy
          cost than the first's?
        expects: "8"
        hint: >
          Divide the second jump by the first — both are equal-size cuts in
          time.
        feedback: >
          $24/3=8$: an identical 3-second cut costs eight times as much
          accuracy near the limit as it does further back — the curve's
          convexity in numbers, not just in shape.
      - teach: >
          The implication is where to aim: not the fastest pace you can sustain
          at all, but the *knee* of this curve — the point where the accuracy
          cost per unit of speed gained starts to explode. The rest of this
          chapter turns locating that knee into an actual optimization.
      - ask: >
          Given the three paces above — 12 seconds at 3 percent errors, 9
          seconds at 6 percent, and 6 seconds at 30 percent — which one sits
          closest to the knee of the curve?
        choices:
          - text: >
              12 seconds — the safest option is always the knee.
            feedback: >
              This pace is comfortably below the knee — you're leaving speed on
              the table for almost no accuracy gain.
          - text: >
              9 seconds — the last increment of speed here still cost little,
              but the next one didn't.
            correct: true
            feedback: >
              Cutting to 9 seconds cost only 3 points of accuracy; cutting
              further to 6 seconds cost 24 more — the bend happens between
              these two paces, exactly what the knee means.
          - text: >
              6 seconds — fastest is always best once you've practiced the
              drill.
            feedback: >
              This is well past the knee: the same 3-second cut that cost 3
              points now costs 24.
        feedback: >
          The knee sits where the next increment of speed starts costing
          disproportionate accuracy — here, that's around 9 seconds, not the
          fastest pace available.
      - teach: >
          Two traps follow from treating this curve as flat. Extrapolating from
          a slow, accurate trial run to a much faster pace ignores exactly the
          part of the curve that bends, and assuming the knee is fixed rather
          than personal ignores that it moves — closer as fatigue sets in, so a
          pace safe early in a round may not stay safe near the end.
      - ask: >
          You timed yourself at 9 seconds per question with 6 percent errors
          during a fresh, ten-minute practice block. Twenty minutes into the
          actual round, fatigue has set in. What should you expect?
        choices:
          - text: >
              The same 9-second pace still runs about 6 percent errors — the
              curve doesn't change.
            feedback: >
              The knee moves with fatigue; a pace that was comfortably below
              your limit early on can sit much closer to it later.
          - text: >
              The knee has likely shifted closer, so 9 seconds may now cost
              more than 6 percent.
            correct: true
            feedback: >
              Fatigue lowers your effective ceiling, sliding the knee toward
              slower paces — a pace measured fresh is not a pace guaranteed to
              hold.
          - text: >
              Errors only rise near the very end of a round, never in the
              middle.
            feedback: >
              Fatigue accumulates continuously, not only at the finish line —
              there's no clean rule pinning the rise to the last few minutes.
        feedback: >
          Treat an early measurement of your knee as optimistic, not fixed —
          re-check your pace, don't assume it holds for the whole round.
      - teach: >
          Error rate rises convexly, not linearly, as pace approaches your
          limit, so the last slice of speed always costs far more accuracy than
          the slice before it — find the knee, don't race the edge.

  - node: quant-mental.game-tactics.optimal-pace
    hook: >
      This is the moment the guessing threshold and the speed-accuracy
      curve combine into an actual number: not "go as fast as you safely
      can," but a specific pace that beats every other pace at points
      scored per second.
    explanation: >
      Expected score rate is $(p(v)a-(1-p(v))b)/t(v)$: the numerator is
      exactly the attempt-EV from the guessing threshold, evaluated at
      the accuracy you'd have working at speed $v$, and the denominator
      is the time per question at that speed — the ratio is points
      earned per second of round time, the quantity a timed round
      actually pays on.

      At low speed the rate is held back only by wasted time, not by an
      accuracy problem, so speeding up from the slow end is close to
      free. Near your limit, $p(v)$ collapses fast enough (the convex
      bend from the speed-accuracy curve) that the numerator's drop
      outpaces the denominator's shrinkage, so the rate falls even
      though each question takes less time. The crossover between these
      two regimes is an interior maximum, strictly below top speed.

      The penalty $b$ controls how far below top speed that maximum
      sits: since the numerator's accuracy-loss term is weighted by $b$,
      a harsher penalty punishes the same speed increase more, pulling
      the optimum slower still. Under $b=0$ the accuracy term drops out
      of the numerator entirely, and the tradeoff collapses toward pure
      speed.
    worked: >
      Three candidate paces on a $+1/-1$ round: Pace A takes 10 seconds
      per question at 90 percent accuracy, Pace B takes 6 seconds at 75
      percent, Pace C takes 4 seconds at 55 percent. Attempt-EV per
      question is $2p-1$: $0.8$, $0.5$, and $0.1$ respectively. Dividing
      by time per question gives the rate: $0.8/10=0.08$,
      $0.5/6\approx0.083$, $0.1/4=0.025$ points per second. Pace B wins,
      narrowly beating even the safest option A, while the fastest pace
      C is worst by a wide margin — the maximum sits at the middle pace,
      and only computing the rate reveals it.
    interview: >
      "How much slower should you go than your fastest safe pace" is
      answered by naming the rate comparison, not intuition — the
      winning pace maximizes points per second, a genuinely different
      ranking from maximizing points per question or minimizing errors.
    pitfalls: >
      Ranking paces by raw per-question EV instead of EV per unit time
      silently favors the slowest safe pace every time — in the worked
      example, Pace A's $0.8$ EV per question looks better than Pace
      B's $0.5$, until time enters the comparison. Assuming "slower is
      always safer" ignores the no-penalty regime, where a low $b$
      shifts the optimum back toward raw speed.
    recap: >
      The pace that maximizes points per second is an interior point
      found by comparing rates directly, and it moves slower as the
      wrong-answer penalty grows.
    steps:
      - teach: >
          This is where the guessing threshold and the speed-accuracy curve
          combine into an actual number: not *go as fast as you safely can*,
          but a specific pace that beats every other pace at points scored per
          second.
      - teach: >
          Expected score rate is $(p(v)a-(1-p(v))b)/t(v)$: the numerator is
          exactly the attempt-EV from the guessing threshold, evaluated at the
          accuracy you'd have at speed $v$, and the denominator is the time per
          question at that speed.
      - teach: >
          Consider a $+1/-2$ round with three candidate paces: Pace A takes 8
          seconds per question at 95 percent accuracy, Pace B takes 5 seconds
          at 80 percent, and Pace C takes 3 seconds at 60 percent. Attempt-EV
          per question is $p(1)-(1-p)(2)=3p-2$ at each pace.
      - ask: >
          Using that setup, what is Pace B's expected score rate, in points per
          second?
        expects: "0.08"
        hint: >
          First find attempt-EV at $p=0.8$, then divide by the 5 seconds it
          takes.
        feedback: >
          Attempt-EV is $3(0.8)-2=0.4$; dividing by the 5 seconds gives a rate
          of $0.4/5=0.08$ points per second.
      - teach: >
          At low speed the rate is held back only by wasted time, not by an
          accuracy problem, so speeding up from the slow end is close to free.
          Near your limit, accuracy collapses fast enough that the numerator's
          drop outpaces the denominator's shrinkage, so the rate falls even
          though each question takes less time — the crossover is an interior
          maximum, strictly below top speed.
      - ask: >
          Finish the comparison: Pace A's rate works out to about 0.106 points
          per second, and Pace C's to about -0.067. Which pace should you run
          this round at?
        choices:
          - text: >
              Pace C — it's the fastest, and speed always wins on a timed test.
            feedback: >
              Pace C's rate is negative: at 60 percent accuracy against this
              harsh $-2$ penalty, you're losing points, not gaining them,
              however many questions you get through.
          - text: >
              Pace B — the middle option is always the safe compromise.
            feedback: >
              Compromise isn't the criterion — Pace B's rate, $0.08$, is beaten
              by Pace A's $0.106$.
          - text: >
              Pace A — it has the highest rate, even though it's the slowest of
              the three.
            correct: true
            feedback: >
              The harsh $-2$ penalty pulls the optimum toward the slower, more
              accurate pace: Pace A's $0.106$ beats Pace B's $0.08$ and Pace
              C's negative rate outright.
        feedback: >
          Rank by rate, not by raw speed: here the harsh penalty pulls the
          maximum all the way to the slowest of the three candidate paces.
      - teach: >
          Ranking paces by raw per-question EV instead of EV per unit time
          silently favors whichever pace is safest, since a slow, accurate pace
          often has the best per-question number — it's only once time enters
          the comparison that a faster pace can win.
      - ask: >
          Under a no-penalty round ($b=0$), which way does the optimal pace
          shift compared to a harsh-penalty round?
        choices:
          - text: >
              Toward raw speed, since the accuracy-loss term drops out of the
              numerator entirely.
            correct: true
            feedback: >
              With $b=0$ the numerator is just $p(v)a$ — there's no penalty
              term to be weighted down by inaccuracy, so the tradeoff collapses
              toward working as fast as you can.
          - text: >
              Toward the slowest safe pace, since removing the penalty makes
              caution more valuable.
            feedback: >
              It's the opposite: removing the penalty removes the *cost* of
              inaccuracy, which pulls the optimum faster, not slower.
          - text: >
              It doesn't shift — the optimal pace never depends on $b$.
            feedback: >
              It depends directly on $b$: a harsher penalty pulls the optimum
              slower, and $b=0$ is the limiting case where that pull vanishes.
        feedback: >
          The penalty $b$ is what holds the optimum back from top speed; remove
          it and the tradeoff collapses toward pure speed.
      - teach: >
          The pace that maximizes points per second is an interior point found
          by comparing rates directly, and it moves slower as the wrong-answer
          penalty grows — all the way to the slowest of your candidates, if the
          penalty is harsh enough.

  - node: quant-mental.game-tactics.sequencing
    hook: >
      The order you attack questions in is a second, independent lever
      from which questions you attempt — get it wrong and a round with
      plenty of points available on paper still ends with half of them
      unclaimed.
    explanation: >
      Treat a timed round as a fixed time budget with points of varying
      size and cost scattered across it: the allocation rule that
      maximizes total points is to clear the fast, confident questions
      first, because a hard question stuck early can consume time that
      easy, high-value points later in the set needed, and that always
      beats working through a fixed printed order.

      Mechanically this is a two-pass sweep: scan and classify first,
      clear everything fast and confident, flag anything slow or
      uncertain, and only return to the flagged set once the cheap sweep
      is exhausted — and even then, attempt a flagged item only if its
      confidence separately clears the guessing threshold.

      Wasted time is worse than a plain skip: time sunk into a question
      you never finish steals from questions you would have finished,
      while a clean skip at least costs nothing beyond the single
      question skipped.
    worked: >
      A $+1/-1$ round has 300 seconds left and 4 unattempted questions:
      three easy ones taking 60 seconds each at 90 percent confidence
      (EV $=2(0.9)-1=0.8$ each), and one hard one taking 240 seconds at
      60 percent confidence (EV $=2(0.6)-1=0.2$). Banking the easy ones
      first uses 180 seconds for $3(0.8)=2.4$ points, leaving 120
      seconds — not enough for the hard question, skipped for $0$.
      Working in a fixed order that puts the hard question first
      instead: 240 seconds buys its $0.2$, leaving only 60 seconds,
      enough for one easy question ($0.8$), with the other two never
      reached. Banking easy first scores $2.4$; fixed order scores
      $0.2+0.8=1.0$ — more than double, from reordering the identical
      four questions.
    interview: >
      "You won't finish this round" is the setup line; the fluent
      response states you'd scan and triage before answering anything,
      not describe grinding through in the printed order.
    pitfalls: >
      Continuing a hard question because of time already sunk into it
      is the sequencing version of the sunk-cost trap — the decision to
      keep going should depend only on the time and points left.
      Flagging a question and never returning to it, even when it would
      have cleared the guessing threshold, throws away points the
      triage pass was meant to preserve.
    recap: >
      Clearing every fast, confident question before touching a slow
      one beats working in printed order, because unclaimed easy points
      cost more than one skipped hard question.
    steps:
      - teach: >
          The order you attack questions in is a second, independent lever from
          which questions you attempt — get it wrong and a round with plenty of
          points available on paper still ends with half of them unclaimed.
      - teach: >
          Sort by expected score per unit time, not by position on the page:
          clear the fast, confident questions first, flag anything slow or
          uncertain, and only return to the flagged set once every cheap point
          is banked. A flagged question, once revisited, is attempted only if
          its confidence separately clears the guessing threshold.
      - teach: >
          A $+1/-1$ round has 240 seconds left and five unattempted questions:
          four easy ones taking 40 seconds each at 85 percent confidence, and
          one hard one taking 160 seconds at 55 percent confidence. Attempt-EV
          per question is $2p-1$: $0.7$ for each easy question, $0.1$ for the
          hard one.
      - ask: >
          Banking the four easy questions first, how many points does that
          strategy earn in total from the 240 seconds?
        expects: "2.8"
        hint: >
          Four easy questions use $4\times 40=160$ seconds and earn $0.7$ each;
          check how much time is left for the hard one.
        feedback: >
          The four easy questions use 160 seconds for $4(0.7)=2.8$ points,
          leaving 80 seconds — not enough for the 160-second hard question,
          which goes unattempted for $0$. Total: $2.8$.
      - teach: >
          Wasted time is worse than a plain skip: time sunk into a question you
          never finish steals from questions you would have finished, while a
          clean skip at least costs nothing beyond the single question skipped.
      - ask: >
          Now suppose you'd worked in a fixed order that put the hard question
          first instead. How many points does that order earn from the same 240
          seconds?
        expects: "1.5"
        hint: >
          The hard question alone uses 160 of the 240 seconds — see how many
          easy questions fit in what's left.
        feedback: >
          The hard question uses 160 seconds for $0.1$ points, leaving 80
          seconds — enough for two easy questions at $0.7$ each. Total:
          $0.1+2(0.7)=1.5$, nearly half of what banking easy first earned from
          the identical five questions.
      - teach: >
          Continuing a hard question because of time already sunk into it is
          the sequencing version of the sunk-cost trap — the decision to keep
          going should depend only on the time and points left, not on what's
          already spent.
      - ask: >
          You've spent 100 seconds of an estimated 160 on a hard question, with
          30 seconds left in the round and every easy question already banked.
          What should you do?
        choices:
          - text: >
              Keep going — you've already invested 100 seconds, and stopping
              now wastes it.
            feedback: >
              Those 100 seconds are gone either way. The decision should use
              only what's left: 30 seconds against a question that needs far
              more.
          - text: >
              Stop — the remaining time can't finish this question, and nothing
              else is left to attempt.
            correct: true
            feedback: >
              With every easy point already banked and 30 seconds nowhere near
              enough to finish the hard one, there's nothing left to gain by
              continuing — the sunk 100 seconds don't change that.
          - text: >
              Flag it and never look at it again, regardless of how the rest of
              the round goes.
            feedback: >
              That overcorrects in the other direction: a flagged question
              should be reconsidered whenever time and confidence allow, not
              written off unconditionally.
        feedback: >
          Once a question is sunk-cost territory, judge only the time and
          points still on the table — here, 30 seconds against a question that
          needs 60 more isn't a decision the first 100 seconds should
          influence.
      - teach: >
          Clearing every fast, confident question before touching a slow one
          beats working in printed order, because unclaimed easy points cost
          more than one skipped hard question — and time already sunk into a
          question is not a reason to keep sinking more.

  - node: quant-mental.game-tactics.cheap-checks
    hook: >
      These checks exist because they target the specific way fast
      arithmetic actually breaks — not a general "be more careful" but a
      short, reflexive battery run on every answer before it leaves your
      mouth.
    explanation: >
      You already have one member of this battery: digit-sum-mod-9 and
      last-digit checks. Two more belong next to it. Parity asks whether
      the problem structurally forces the answer to be odd or even, and
      whether your answer matches. Magnitude rounds the inputs, guesses
      the order of size, and checks that your computed answer lands in
      that ballpark.

      Each check is a filter tuned to a specific failure mode. Parity
      catches sign- and last-operation errors that leave the wrong
      parity residue. Magnitude catches decimal-point slips and
      factor-of-ten errors that a digit-sum check sails right past,
      since digit sums don't care where the decimal point sits.
      Mod-9 and last-digit catch transposed or substituted digits that
      parity and magnitude both miss, since those don't change an
      answer's rough size or evenness. No single check is complete,
      which is why you run more than one.

      None of these require recomputing anything, so they run almost in
      parallel with writing the answer down, at a cost close to zero —
      exactly why the next lesson can recommend running them
      unconditionally.
    worked: >
      Compute $24\times35$. Round each input to the nearest ten first:
      $20\times40=800$, so the true product should land in the
      hundreds. The exact product is $840$ — consistent. Parity: $24$
      is even, so the product must be even regardless of the other
      factor; $840$ is even — consistent. Now suppose a decimal slip
      during fast mental work produces $8400$ or $84$ instead: both fail
      the magnitude check instantly, one an order of magnitude too
      large and the other too small, while only $840$ survives — and
      the mod-9 check from before would miss this entirely, since
      $8400$, $840$, and $84$ all share the same digit sum, $12$,
      reducing to $3$ mod $9$.
    interview: >
      This rarely appears as a standalone question; an interviewer
      running you through a rapid mental-math set is listening for you
      to narrate a check out loud before stating your final answer,
      rather than staying silent and hoping.
    pitfalls: >
      A magnitude check only bounds the order of size — it won't catch
      a same-scale error like a transposed digit ($840$ vs $480$, both
      plausible-looking hundreds), which is exactly what the last-digit
      and mod-9 checks exist to catch instead. Treating a passed check
      as proof of a correct answer overstates a necessary condition — it
      rules out a category of error, it doesn't confirm the arithmetic.
    recap: >
      Parity and magnitude are cheap filters tuned to the errors mod-9
      and last-digit checks miss — decimal slips and sign flips — and
      running all of them together costs a fraction of a second.
    steps:
      - teach: >
          These checks exist because they target the specific way fast
          arithmetic actually breaks — not a general *be more careful* but a
          short, reflexive battery you run on every answer before it leaves
          your mouth.
      - teach: >
          You already have digit-sum-mod-9 and last-digit checks. Two more
          belong next to them: parity asks whether the problem structurally
          forces an odd or even answer, and magnitude rounds the inputs,
          guesses the order of size, and checks that your computed answer lands
          in that ballpark.
      - ask: >
          You're computing $47\times 62$. Before finishing the arithmetic, what
          parity must the product have?
        choices:
          - text: >
              Odd, since $47$ is odd.
            feedback: >
              One odd factor isn't enough — the parity of a product is decided
              by whether *either* factor is even.
          - text: >
              Even, since $62$ is even and an odd number times an even number
              is always even.
            correct: true
            feedback: >
              Exactly one even factor is enough to force an even product,
              regardless of the other factor.
          - text: >
              It could go either way — you can't tell until you multiply it
              out.
            feedback: >
              Parity of a product is decided structurally, by the factors'
              parities, before any arithmetic happens.
        feedback: >
          47 is odd and 62 is even, so the product is forced even before you
          compute it — the check runs before the answer does.
      - teach: >
          Each check is a filter tuned to a specific failure mode. Parity
          catches sign- and last-operation errors that leave the wrong parity
          residue; magnitude catches decimal-point slips and factor-of-ten
          errors that a digit-sum check sails right past, since digit sums
          don't care where the decimal point sits. No single check is complete,
          which is why you run more than one.
      - ask: >
          Round each factor of $47\times 62$ to the nearest ten and estimate
          the product's order of size.
        expects: "3000"
        hint: >
          47 rounds to 50; 62 rounds to 60.
        feedback: >
          $50\times 60=3000$, so the true product should land in the thousands
          — a fast answer with a different number of digits fails this check
          instantly, before you even check the exact value.
      - ask: >
          The exact product is $2914$. A fast mental slip could instead produce
          $29140$, or $291$, or $2914$ itself. Which of these passes *both* the
          parity and magnitude checks?
        choices:
          - text: >
              $29140$ — it's even, matching the required parity.
            feedback: >
              It passes parity, but it's ten times the magnitude estimate of
              $3000$ — the check that catches this one is magnitude, not
              parity.
          - text: >
              $291$ — it's close to the magnitude estimate.
            feedback: >
              It's off by roughly a factor of ten in the other direction, and
              it's odd, which already fails the parity check on its own — the
              product must be even.
          - text: >
              $2914$ — even, and squarely in the thousands the estimate
              predicted.
            correct: true
            feedback: >
              Even, and in the right order of size — the only one of the three
              that survives both filters.
        feedback: >
          Parity alone lets $29140$ through, and magnitude alone lets an odd
          answer through if you forget to check it — running both together is
          what closes the gap.
      - teach: >
          A passed check is a necessary condition, not proof: it rules out a
          category of error, it doesn't confirm the arithmetic. A same-scale
          slip like a transposed digit can pass both parity and magnitude
          cleanly, which is exactly what the mod-9 and last-digit checks exist
          to catch instead.
      - teach: >
          Parity and magnitude are cheap filters tuned to the errors mod-9 and
          last-digit checks miss — decimal slips and structural sign flips —
          and running all four together, on every answer, costs a fraction of a
          second.

  - node: quant-mental.game-tactics.verification-budget
    hook: >
      "Should I double-check that" has a real answer, and it isn't
      "always" or "never" — it's whichever side of a specific
      cost-benefit line the particular check falls on.
    explanation: >
      A check is worth its time exactly when the points it's expected
      to protect exceed the points you'd earn spending that same time at
      your optimal pace instead. If a check costs $T$ seconds and, with
      probability $q$, catches a mistake worth the full $a+b$ point
      swing, its expected benefit is $q(a+b)$ against an opportunity
      cost of $rT$, where $r$ is your optimal-pace score rate — worth
      running exactly when $q>rT/(a+b)$.

      A one-second check has a tiny $T$, so its break-even $q$ is tiny
      too — almost any nonzero catch rate clears it, which is why cheap
      checks are a default, run on everything. A full recompute has $T$
      on the order of the time to solve the problem itself, making $rT$
      large, so $q$ needs to be large — often unrealistically so — to
      clear the bar, which is why full rechecks are reserved for answers
      that already feel shaky, not run as routine.
    worked: >
      At an optimal-pace rate of $r=0.1$ points per second on a
      $+1/-1$ round ($a+b=2$), a check pays off when $q>rT/(a+b)$. A
      1-second parity check needs only $q>0.1(1)/2=0.05$ — a 5 percent
      catch rate justifies it, easily cleared by the checks from before.
      A full 20-second recompute needs $q>0.1(20)/2=1.0$ — certainty
      that you're wrong, a bar an answer you're merely unsure about
      essentially never honestly clears.
    interview: >
      "Do you check every answer" is answered with the cost-benefit
      framing directly — state the opportunity cost of the time at your
      own scoring rate, not a blanket policy in either direction.
    pitfalls: >
      Running a full recompute out of general caution burns round time
      the arithmetic says is essentially never worth it at typical
      paces. Skipping even the free parity and magnitude checks because
      "time is precious" is the opposite mistake, since their break-even
      catch rate is close to zero. The break-even bar also scales with
      $a+b$: on a harsher-penalty test the same check protects more
      points and is worth relatively more time.
    recap: >
      A check pays exactly when the points it's expected to protect
      beat the points you'd earn spending that time at your optimal pace
      instead — nearly always true for a cheap check, nearly never true
      for a full recompute.
    steps:
      - teach: >
          *Should I double-check that* has a real answer, and it isn't *always*
          or *never* — it's whichever side of a specific cost-benefit line the
          particular check falls on.
      - teach: >
          A check is worth its time exactly when the points it's expected to
          protect exceed the points you'd earn spending that same time at your
          optimal pace instead. If a check costs $T$ seconds and, with
          probability $q$, catches a mistake worth the full $a+b$ point swing,
          it's worth running exactly when $q>rT/(a+b)$, where $r$ is your
          optimal-pace score rate.
      - teach: >
          Suppose your optimal-pace rate is $r=0.15$ points per second on a
          $+1/-2$ round, so $a+b=3$.
      - ask: >
          In that setup, what catch rate $q$ does a 1-second check need to be
          worth running?
        expects: "0.05"
        hint: >
          $q>rT/(a+b)$ with $T=1$.
        feedback: >
          $q>0.15(1)/3=0.05$ — a 5 percent catch rate justifies it, a bar
          almost any cheap check clears.
      - teach: >
          A one-second check has a tiny $T$, so its break-even $q$ is tiny too
          — almost any nonzero catch rate clears it, which is why cheap checks
          are a default, run on everything. A full recompute has $T$ on the
          order of the time to solve the problem itself, making $rT$ large, so
          $q$ needs to be large — often unrealistically so — to clear the bar.
      - ask: >
          In the same setup, what catch rate $q$ would a full 30-second
          recompute need to be worth running?
        expects: "1.5"
        hint: >
          Same formula, $T=30$ this time.
        feedback: >
          $q>0.15(30)/3=1.5$ — since $q$ is a probability and can never exceed
          $1$, no catch rate can clear this bar. A full recompute at this pace
          is never worth it, however unsure you feel.
      - teach: >
          Running a full recompute out of general caution burns time the
          arithmetic says is essentially never worth it. Skipping even the free
          parity and magnitude checks because *time is precious* is the
          opposite mistake, since their break-even catch rate sits close to
          zero.
      - ask: >
          The break-even bar also scales with $a+b$. On a harsher-penalty test,
          does the same 1-second check need a higher or lower catch rate $q$ to
          be worth running, compared to a lenient test?
        choices:
          - text: >
              Higher — a bigger point swing raises the bar a check has to
              clear.
            feedback: >
              It's the opposite direction: $q>rT/(a+b)$ shrinks as $a+b$ grows,
              since $a+b$ sits in the denominator.
          - text: >
              Lower — the same check now protects a bigger point swing per
              catch, so it clears the bar more easily.
            correct: true
            feedback: >
              A larger $a+b$ divides down the required $q$: the same mistake is
              worth more points on a harsher test, so the same catch rate is
              relatively more valuable there.
          - text: >
              Unchanged — $a+b$ doesn't appear in the formula.
            feedback: >
              $a+b$ is exactly the denominator of $rT/(a+b)$ — it's central to
              the formula, not absent from it.
        feedback: >
          A harsher rule raises what's at stake per catch, which lowers the bar
          a cheap check has to clear — the same check is worth relatively more
          time there, not less.
      - teach: >
          A check pays exactly when the points it's expected to protect beat
          the points you'd earn spending that time at your optimal pace instead
          — nearly always true for a cheap check, nearly never true for a full
          recompute, and more forgiving still on a harsher-penalty test.

  - node: quant-mental.game-tactics.composure
    hook: >
      Interviewers watching you work through a timed set are not only
      grading the final number — a visibly improvised process, sped up
      or slowed down on the fly, is itself the signal they're reading.
    explanation: >
      Improvising decisions live — whether to check, what order to
      take, how to react when stuck — adds variance to your realized
      pace question to question. Because the error curve bends up
      sharply only near your limit, that added variance disproportionately
      lands you in the steep region even when your average pace looks
      fine on paper, since the costly excursions are the ones close to
      the edge, not the ones comfortably below it.

      A pre-committed routine — a fixed default order, a fixed default
      check, a fixed default reaction to getting stuck, such as flagging
      it and moving on — works like a guardrail keeping your realized
      pace off that steep stretch, at the cost of a little average speed
      you'd otherwise gain by improvising a shortcut when things happen
      to be going well.

      This is also why composure reads as a signal to an interviewer
      beyond simple comfort: a rehearsed routine generalizes to problems
      the interviewer hasn't seen worked out, while an improvised one
      offers no evidence about how you'll behave on the next one.
    interview: >
      "What do you do when you get stuck" is a composure question
      wearing an arithmetic costume — the answer that scores is a
      specific, pre-decided default reaction, not a description of
      trying harder in the moment.
    pitfalls: >
      Treating composure as a purely psychological instruction ("stay
      calm") rather than a concrete procedural commitment means there's
      no actual guardrail in place when pressure hits — the routine only
      works if it was decided in advance, not improvised under the exact
      pressure it's meant to protect against. Over-building the routine
      so it's slower than necessary even when nothing is going wrong
      gives up more average speed than the reduced variance is worth.
    recap: >
      A rehearsed default response to getting stuck trades a little
      average speed for a lot less variance, which is what keeps you off
      the steep part of the speed-accuracy curve when it matters.
    steps:
      - teach: >
          Interviewers watching you work through a timed set are not only
          grading the final number — a visibly improvised process, sped up or
          slowed down on the fly, is itself the signal they're reading.
      - teach: >
          Improvising decisions live — whether to check, what order to take,
          how to react when stuck — adds variance to your realized pace
          question to question. Because the error curve bends up sharply only
          near your limit, that added variance disproportionately lands you in
          the steep region even when your average pace looks fine on paper.
      - teach: >
          A pre-committed routine — a fixed default order, a fixed default
          check, a fixed default reaction to getting stuck, such as flagging it
          and moving on — works like a guardrail keeping your realized pace off
          that steep stretch, at the cost of a little average speed you'd
          otherwise gain by improvising a shortcut when things happen to be
          going well.
      - ask: >
          Twenty minutes into a timed round you hit a question that isn't
          clicking. Your pre-committed routine says flag it and move on, but
          you feel close to cracking it. What should you do?
        choices:
          - text: >
              Keep pushing — you're close, and the routine is only a default,
              not a rule.
            feedback: >
              This is exactly the moment the routine exists to guard against:
              *I feel close* is an improvised judgement made under the same
              pressure the routine was built to remove.
          - text: >
              Follow the routine: flag it and move to the next question.
            correct: true
            feedback: >
              The routine's value is that it was decided in advance, away from
              this exact pressure — overriding it live reintroduces the
              variance it was built to remove.
          - text: >
              Slow down for the rest of the round to be safe.
            feedback: >
              This overcorrects: it trades away more average speed than the
              variance reduction is worth, for a problem this one question
              doesn't require.
        feedback: >
          A routine only works as a guardrail if it's followed under the exact
          pressure that tempts you to break it — that's the moment it was built
          for.
      - teach: >
          This is also why composure reads as a signal to an interviewer beyond
          simple comfort: a rehearsed routine generalizes to problems the
          interviewer hasn't seen worked out, while an improvised one offers no
          evidence about how you'll behave on the next question.
      - ask: >
          An interviewer asks, *What do you do when you get stuck?* Which
          answer scores best?
        choices:
          - text: >
              I try to stay calm and push through until it clicks.
            feedback: >
              This is a psychological instruction, not a procedural one — it
              names no concrete guardrail and offers no evidence about what
              you'll actually do under pressure.
          - text: >
              I flag it, move to the next question, and return only if time and
              confidence allow.
            correct: true
            feedback: >
              This is a specific, pre-decided default — exactly what the
              interviewer is listening for, since it generalizes to any
              question, not just the one in front of you.
          - text: >
              It depends on the problem — I'd have to see it.
            feedback: >
              This answers a different question than the one asked; the
              interviewer wants your default reaction, not a case-by-case
              judgement made live.
        feedback: >
          The answer that scores names a concrete, rehearsed default, not a
          mood or a case-by-case promise.
      - teach: >
          Treating composure as a purely psychological instruction rather than
          a concrete procedural commitment leaves no actual guardrail in place
          when pressure hits — the routine only works if it was decided in
          advance. Over-building the routine so it's slower than necessary even
          when nothing is going wrong gives up more average speed than the
          reduced variance is worth.
      - teach: >
          A rehearsed default response to getting stuck trades a little average
          speed for a lot less variance, which is what keeps you off the steep
          part of the speed-accuracy curve when it matters most.
