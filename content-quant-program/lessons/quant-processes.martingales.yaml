unit: quant-processes.martingales
opening: >
  Martingales formalize "fair game" precisely enough to compute with, and this
  unit builds the whole machine an interview draws on: the zoo of martingales
  built from a random walk, the vocabulary of stopping times, and the optional
  stopping theorem that turns "stop a fair game" into a hitting probability or
  an expected time — provided its conditions are checked. From there the unit
  works through the theorem's two headline applications, gambler's ruin and
  Wald's identity, before the ABRACADABRA casino shows the same machinery
  solving a genuine pattern-waiting puzzle, and the doubling-strategy fallacy
  and the maximal and convergence theorems close out the exact boundary of
  what optional stopping can and cannot deliver.
lessons:
  - node: quant-processes.martingales.filtration
    hook: >
      Every later definition in this unit — martingale, stopping time,
      predictable stake — is stated in terms of $\mathcal{F}_n$, so getting
      comfortable with "what does the filtration know" before the algebra
      starts is what makes the rest read like common sense.
    explanation: >
      Conditional expectation $\mathbb{E}[X\mid Y]$ already restricts an
      average to whatever $Y$ reveals. A filtration replaces the single
      variable $Y$ with an entire increasing history:
      $\mathcal{F}_0\subseteq\mathcal{F}_1\subseteq\cdots$, where
      $\mathcal{F}_n$ is everything you could know by watching the process
      through step $n$. For a sequence $X_1,X_2,\dots$,
      $\mathcal{F}_n=\sigma(X_1,\dots,X_n)$ just means "the first $n$
      observations, and anything computable from them."

      The two rules quoted in the statement are conditional expectation's two
      extreme cases restated for a filtration: a quantity already fixed by
      time $n$ passes straight through the conditioning, and a quantity that
      hasn't happened yet and is independent of the past collapses to its
      plain mean. Nearly every computation in this unit is one of these two
      facts applied to a single future increment.

      The adapted/predictable split is the difference between "known now" and
      "known one step ago." A gambler's fortune is adapted — revealed as it
      happens; a gambler's stake for the next round, chosen before that round
      is played, is predictable. That one-step lag is what protects a betting
      system from beating a fair game, later in this unit.
    worked: >
      Let $X_1,X_2,\dots$ be independent fair die rolls (values $1$ through
      $6$), and $\mathcal{F}_n=\sigma(X_1,\dots,X_n)$. Given $\mathcal{F}_2$
      with $X_1=4,X_2=1$, compute
      $\mathbb{E}[X_1+X_2+X_3+X_4\mid\mathcal{F}_2]$: $X_1+X_2=5$ is already
      known, and $X_3+X_4$ is independent of $\mathcal{F}_2$ with mean
      $3.5+3.5=7$, so the answer is $5+7=12$.
    interview: >
      "Write $\mathbb{E}[\cdot\mid\mathcal{F}_n]$ for this quantity" tests
      whether you split a sum into a known part and an independent part on
      sight. Interviewers also probe adapted-versus-predictable directly:
      "can you choose your bet size using today's close?" — yes, that's
      tomorrow's predictable stake.
    pitfalls: >
      Writing $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_{n+1}$, forgetting
      $X_{n+1}$ is exactly what's unknown at time $n$. Calling a quantity
      computed from $X_1,\dots,X_n$ "predictable" when it is really adapted —
      predictable means fixed one step earlier, at $\mathcal{F}_{n-1}$.
    recap: >
      $\mathcal{F}_n$ is shorthand for "everything observable by time $n$,"
      and the chapter runs on two facts: known quantities pass through
      conditioning unchanged, independent ones average out.
    steps:
      - teach: >
          Conditional expectation restricts an average to whatever a single
          variable reveals. A filtration replaces that one variable with an
          entire increasing history,
          $\mathcal{F}_0\subseteq\mathcal{F}_1\subseteq\cdots$, where
          $\mathcal{F}_n$ is everything you could know by watching the process
          through step $n$.
      - teach: >
          Two rules do almost all the labour: a quantity already fixed by time
          $n$ passes straight through $\mathbb{E}[\cdot\mid\mathcal{F}_n]$
          unchanged, and a quantity independent of the past collapses to its
          plain mean. Nearly every computation in this unit is one of these two
          facts applied to a single increment.
      - ask: >
          Let $Y_1,Y_2,\dots$ be independent fair die rolls, and
          $\mathcal{F}_3=\sigma(Y_1,Y_2,Y_3)$. Given $\mathcal{F}_3$ with
          $Y_1=2,Y_2=5,Y_3=6$, what is
          $\mathbb{E}[Y_1+Y_2+Y_3+Y_4+Y_5\mid\mathcal{F}_3]$?
        expects: "20"
        hint: >
          Split the sum into the part $\mathcal{F}_3$ already reveals and the
          part still independent of it.
        feedback: >
          $Y_1+Y_2+Y_3=2+5+6=13$ is already fixed by $\mathcal{F}_3$, and
          $Y_4+Y_5$ is independent of $\mathcal{F}_3$ with mean $3.5+3.5=7$, so
          the conditional expectation is $13+7=20$.
      - teach: >
          Adapted means determined by $\mathcal{F}_n$ — known now. Predictable
          means determined by $\mathcal{F}_{n-1}$ — fixed one step early. A
          gambler's fortune is adapted; the stake chosen before the next round
          is played is predictable.
      - ask: >
          Which of these is predictable with respect to $\mathcal{F}_n$, not
          merely adapted?
        choices:
          - text: >
              The closing price $X_n$ itself.
            feedback: >
              That is adapted — known at time $n$ — but it is exactly the value
              revealed at $n$, not fixed one step earlier.
          - text: >
              Tomorrow's stake $H_{n+1}$, chosen using only what is known
              through today, $\mathcal{F}_n$.
            correct: true
            feedback: >
              Fixed by $\mathcal{F}_n$, hence determined one step before it is
              used — exactly what predictable means.
          - text: >
              The next increment $X_{n+1}-X_n$.
            feedback: >
              This is not even adapted to $\mathcal{F}_n$; it is the very
              quantity not yet revealed.
        feedback: >
          Predictable is one step earlier than adapted: known before the round
          it governs is played, not merely by the time it ends.
      - ask: >
          Given $\mathcal{F}_4$ with $Y_1=3,Y_2=3,Y_3=3,Y_4=3$, what is
          $\mathbb{E}[Y_5\mid\mathcal{F}_4]$?
        expects: "3.5"
        hint: >
          $Y_5$ has not been observed yet, and nothing about the past rolls
          changes its distribution.
        feedback: >
          $Y_5$ is independent of $\mathcal{F}_4$ regardless of what the first
          four rolls were, so its conditional mean is just the mean of one fair
          die roll, $3.5$ — the history changes nothing.
      - teach: >
          Writing $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_{n+1}$ is the
          recurring mistake — $X_{n+1}$ is exactly what is unknown at time $n$.
          Always separate what $\mathcal{F}_n$ has already fixed from what is
          still independent of it before writing anything down.


  - node: quant-processes.martingales.martingale
    hook: >
      Every "is this a fair game" question reduces to checking one equation,
      $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_n$, so recognizing that shape on
      sight is worth more than reciting the definition.
    explanation: >
      The definition packages "fair game" precisely: given everything known
      through time $n$, tomorrow's expected fortune equals today's realized
      value — not its average, its actual value. That is stronger than
      $\mathbb{E}[X_{n+1}]=\mathbb{E}[X_n]$; it holds along every path, not
      just on average.

      The tower property upgrades a one-step promise into a promise at every
      future time: applying $\mathbb{E}[\cdot\mid\mathcal{F}_n]$ to
      $\mathbb{E}[X_{n+2}\mid\mathcal{F}_{n+1}]=X_{n+1}$ and using the tower
      property collapses two nested conditionings into
      $\mathbb{E}[X_{n+2}\mid\mathcal{F}_n]=X_n$, and induction extends this
      to every $m>n$. Setting $n=0$ removes the conditioning entirely, giving
      the constant-mean property $\mathbb{E}[X_n]=\mathbb{E}[X_0]$ — the one
      fact used to check almost every martingale identity in this unit.

      Linearity of conditional expectation makes sums of martingales on a
      shared filtration martingales again, which is the standing
      justification for building one complicated fair game out of several
      small ones.
    worked: >
      Let stakes grow with the round: bet $i$ pays $+i$ or $-i$ with equal
      probability, and $X_n$ is the running total, $X_0=0$. Realized path
      $+1,-2,+3$ gives $X_3=2$. Then
      $\mathbb{E}[X_4\mid\mathcal{F}_3]=2+\mathbb{E}[\text{bet }4]=2+0=2$,
      confirming the definition; unconditionally, $\mathbb{E}[X_4]=
      \mathbb{E}[X_0]=0$ regardless of the path taken to get there.
    interview: >
      "Is this process a martingale?" wants the one-line check
      $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_n$ verified, not "it's fair on
      average." A frequent follow-up, "what's $\mathbb{E}[X_{100}]$?", is
      answered instantly by the constant-mean property.
    pitfalls: >
      Checking only $\mathbb{E}[X_{n+1}]=\mathbb{E}[X_n]$ (unconditional) and
      calling it a martingale — necessary but not sufficient; the conditional
      version must hold path by path. Forgetting $\mathbb{E}|X_n|<\infty$: a
      process can satisfy the conditional equality formally and still fail to
      qualify if some $X_n$ isn't integrable.
    recap: >
      A martingale is a fair game frozen precisely:
      $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_n$, and the tower property
      promotes that single-step promise to $\mathbb{E}[X_n]=\mathbb{E}[X_0]$
      at every fixed time.
    steps:
      - teach: >
          The definition packages fair game precisely: given everything known
          through time $n$, tomorrow's expected fortune equals today's realized
          value — not its average, its actual value. That holds along every
          path, not just on average.
      - teach: >
          The tower property upgrades the one-step promise to every future
          time: $\mathbb{E}[X_m\mid\mathcal{F}_n]=X_n$ for every $m>n$. Setting
          $n=0$ removes the conditioning entirely, giving the constant-mean
          property $\mathbb{E}[X_n]=\mathbb{E}[X_0]$.
      - ask: >
          A martingale realizes $X_3=-1$ along a particular path. What is
          $\mathbb{E}[X_9\mid\mathcal{F}_3]$?
        expects: "-1"
        hint: >
          This uses the tower iteration at a general $n=3$, not the special
          case $n=0$.
        feedback: >
          Iterating the tower property gives
          $\mathbb{E}[X_m\mid\mathcal{F}_n]=X_n$ for every $m>n$, so
          $\mathbb{E}[X_9\mid\mathcal{F}_3]=X_3=-1$ — the realized value, not
          its unconditional mean.
      - teach: >
          Linearity of conditional expectation carries straight through sums:
          linear combinations of martingales on a shared filtration are
          martingales again, the standing justification for building one
          complicated fair game out of several small ones.
      - ask: >
          $(X_n)$ and $(Y_n)$ are both martingales on the same filtration.
          Which combination is guaranteed to also be a martingale?
        choices:
          - text: >
              $X_n\cdot Y_n$
            feedback: >
              Products of martingales are not generally martingales;
              $\mathbb{E}[X_{n+1}Y_{n+1}\mid\mathcal{F}_n]$ does not factor
              into $X_nY_n$ without an extra independence assumption.
          - text: >
              $5X_n-2Y_n$
            correct: true
            feedback: >
              Linearity of conditional expectation carries straight through:
              $\mathbb{E}[5X_{n+1}-2Y_{n+1}\mid\mathcal{F}_n]=5X_n-2Y_n$
              exactly.
          - text: >
              $X_n^{2}+Y_n^{2}$
            feedback: >
              Squares of martingales are submartingales by Jensen's inequality,
              not martingales, and a sum of submartingales is again only a
              submartingale.
        feedback: >
          Linear combinations survive because conditional expectation is
          linear; products and convex functions need a separate argument each.
      - teach: >
          Checking only $\mathbb{E}[X_{n+1}]=\mathbb{E}[X_n]$ is necessary but
          not sufficient — that is the $n=0$-style unconditional statement, and
          the definition demands the conditional equality hold path by path,
          plus $\mathbb{E}|X_n|<\infty$ at every $n$.
      - ask: >
          A martingale has $X_0=-3$. What is $\mathbb{E}[X_{100}]$?
        expects: "-3"
        hint: >
          Use the $n=0$ special case of the tower property.
        feedback: >
          The constant-mean corollary of the tower property,
          $\mathbb{E}[X_n]=\mathbb{E}[X_0]$, holds at every fixed time,
          including $n=100$, so the answer is $-3$ regardless of the path.
      - teach: >
          Two things distinguish a real check from a shortcut: the equality
          must hold conditionally, not just on average, and
          $\mathbb{E}|X_n|<\infty$ must hold at every $n$ — both are part of
          the definition, not fine print.


  - node: quant-processes.martingales.sub-supermartingale
    hook: >
      Recognizing which inequality direction you're looking at — and that a
      house edge is a supermartingale, not a submartingale — is a two-second
      sanity check that keeps every later sign right.
    explanation: >
      Relaxing the martingale's equality to an inequality gives two one-sided
      notions: a submartingale drifts up in conditional expectation, a
      supermartingale drifts down, and satisfying both at once is exactly
      being a martingale — the inequality in each direction forces equality.

      The naming is backwards from what intuition suggests, so memorize the
      mnemonic: a supermartingale is "super" only in size now, headed down —
      the game with the edge against you. A casino's house edge means your
      fortune is a supermartingale: each round's conditional expectation is at
      most your current stake.

      Jensen's inequality manufactures new submartingales from a martingale:
      for convex $f$, $\mathbb{E}[f(X_{n+1})\mid\mathcal{F}_n]\ge
      f(\mathbb{E}[X_{n+1}\mid\mathcal{F}_n])=f(X_n)$, so $f(X_n)$ is a
      submartingale whenever $X_n$ is a martingale. This is why $|X_n|$ and
      $X_n^{2}$ both drift upward even though $X_n$ itself drifts nowhere —
      convexity injects upward drift that wasn't there before.
    worked: >
      Let $X_n$ be a martingale with $X_0=0$ and each increment having
      variance $1$. Then $X_n^{2}$ is a submartingale:
      $\mathbb{E}[X_{n+1}^{2}\mid\mathcal{F}_n] =
      X_n^{2}+2X_n\,\mathbb{E}[\text{incr}\mid\mathcal{F}_n]+
      \mathbb{E}[\text{incr}^{2}] = X_n^{2}+0+1 = X_n^{2}+1 \ge X_n^{2}$,
      confirming a submartingale drift of exactly $+1$ per step.
    interview: >
      "Is your P&L a sub- or supermartingale under this rule" checks whether
      you can name the drift direction from the sign of the edge without
      hesitation. Expect the mnemonic check: "which one goes down?" —
      supermartingale, because life is not fair.
    pitfalls: >
      Swapping the two names under pressure — the single most common slip.
      Assuming any nonlinear function of a martingale increases the mean;
      it's specifically convexity that does it, so a concave function of a
      martingale is a supermartingale, not a submartingale.
    recap: >
      A submartingale drifts up, a supermartingale drifts down, being both is
      exactly being a martingale, and Jensen's inequality turns a martingale
      into a submartingale via any convex function.
    steps:
      - teach: >
          Relaxing the martingale's equality to an inequality gives two
          one-sided notions: a submartingale drifts up in conditional
          expectation, a supermartingale drifts down, and satisfying both at
          once is exactly being a martingale.
      - teach: >
          The naming is backwards from intuition, so keep the mnemonic ready: a
          supermartingale is "super" only in size now, headed down — life is
          not fair, so a supermartingale goes down. A casino's house edge makes
          your fortune a supermartingale.
      - ask: >
          A game has this rule: each round costs you $1$ unit in expectation
          regardless of your current fortune,
          $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_n-1$. Which is this process?
        choices:
          - text: >
              A submartingale.
            feedback: >
              Submartingales drift up; this one drifts down by exactly $1$ each
              round.
          - text: >
              A supermartingale.
            correct: true
            feedback: >
              $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_n-1\le X_n$ is exactly
              the supermartingale inequality — the house edge pulls expected
              fortune down every round.
          - text: >
              A martingale.
            feedback: >
              A martingale needs equality,
              $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_n$; here there is a
              strict $1$-unit expected loss each round.
        feedback: >
          House edge means expected fortune strictly decreases each round — the
          defining shape of a supermartingale.
      - teach: >
          Jensen's inequality manufactures submartingales from a martingale:
          for convex $f$, $\mathbb{E}[f(X_{n+1})\mid\mathcal{F}_n]\ge f(X_n)$,
          so $|X_n|$ and $X_n^{2}$ both drift upward even though $X_n$ itself
          drifts nowhere.
      - ask: >
          Let $(X_n)$ be a martingale with each increment having variance $4$
          (mean-zero increments given $\mathcal{F}_n$). What is
          $\mathbb{E}[X_{n+1}^{2}\mid\mathcal{F}_n]-X_n^{2}$, the one-step
          submartingale drift of $X_n^{2}$?
        expects: "4"
        hint: >
          Expand $(X_n+\Delta)^{2}$ and use that the increment has conditional
          mean $0$.
        feedback: >
          Expanding,
          $\mathbb{E}[(X_n+\Delta)^{2}\mid\mathcal{F}_n]=X_n^{2}+2X_n\mathbb{E}[\Delta\mid\mathcal{F}_n]+\mathbb{E}[\Delta^{2}\mid\mathcal{F}_n]=X_n^{2}+0+4=X_n^{2}+4$,
          so the drift is exactly $4$, matching the increment's variance.
      - ask: >
          If $(X_n)$ is a martingale and $f$ is concave, then $f(X_n)$ is a:
        choices:
          - text: >
              Submartingale.
            feedback: >
              That is the convex case; concavity reverses Jensen's inequality
              direction.
          - text: >
              Supermartingale.
            correct: true
            feedback: >
              Concavity flips Jensen's inequality,
              $\mathbb{E}[f(X_{n+1})\mid\mathcal{F}_n]\le f(X_n)$, giving a
              supermartingale.
          - text: >
              Martingale.
            feedback: >
              Equality would need $f$ to be both convex and concave — affine,
              not merely concave.
        feedback: >
          Convex flips a martingale up into a submartingale; concave flips it
          down into a supermartingale — the mirror of the earlier naming trap.
      - teach: >
          The two-second sanity check: match the inequality's direction to the
          drift's direction. Submartingale up, supermartingale down, and
          swapping the two names under pressure is the single most common slip
          in the unit.


  - node: quant-processes.martingales.examples-zoo
    hook: >
      These three constructions — the level, the compensated square, and the
      geometric martingale — are the entire toolkit optional stopping draws
      on; recognizing which one a problem wants is most of solving it.
    explanation: >
      Each entry is checked against the martingale definition by expanding
      one conditional expectation of a single increment. The centered walk
      works because $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=p-q$ regardless of
      the past (the increments are independent of everything already seen),
      so subtracting the running total of that drift, $n(p-q)$, leaves
      conditional expectation exactly zero at every step; when $p=1/2$ the
      drift is already zero and $S_n$ itself is the martingale.

      The compensated square is the same $(S_n-n\mu)^{2}-n\sigma^{2}$
      construction general iid increments always get, with $\mu=p-q$ and
      $\sigma^{2}$ computed directly: since $X_i^{2}=1$ always for a $\pm1$
      step, $\mathbb{E}[X_i^{2}]=1$, and
      $\operatorname{Var}(X_i)=1-(p-q)^{2}=4pq$ using $p+q=1$ — that variance
      is exactly the $4pq\,n$ compensator, no coincidence at all. At
      $p=1/2$ this collapses to the familiar $S_n^{2}-n$.

      The geometric martingale checks a multiplicative fair game instead of
      an additive one: $(q/p)^{S_n}$ multiplies by the random factor
      $(q/p)^{X_{n+1}}$ each step, and that factor's mean is exactly $1$ —
      $p\cdot(q/p)+q\cdot(p/q)=q+p=1$ — so "drift zero" for a multiplicative
      process means "multiplier averages to $1$," the natural analogue of
      additive drift zero.
    worked: >
      Take $p=1/4$, $q=3/4$, so $q/p=3$. Check
      $\mathbb{E}[3^{X_1}] = (1/4)(3)+(3/4)(1/3) = 3/4+1/4 = 1$, confirming
      $\mathbb{E}[3^{S_{n+1}}\mid\mathcal{F}_n]=3^{S_n}\cdot1=3^{S_n}$ — the
      martingale property verified directly for this biased walk.
    interview: >
      "Name a martingale built from this random walk" should produce the
      three-item list instantly, keyed to whether the walk is symmetric. A
      pointed follow-up — "why $4pq\,n$ and not just $n$?" — tests whether
      you actually computed $\operatorname{Var}(X_i)$ rather than memorizing
      the symmetric case only.
    pitfalls: >
      Using $S_n^{2}-n$ for a biased walk — that identity is special to
      $p=1/2$; the biased version needs the $4pq\,n$ compensator and the
      $p-q$ recentering. Writing the geometric martingale as $(p/q)^{S_n}$
      instead of $(q/p)^{S_n}$ — only one ratio has expectation $1$ per step.
    recap: >
      Three martingales cover nearly every random-walk problem: $S_n-n(p-q)$,
      $(S_n-n(p-q))^{2}-4pq\,n$, and $(q/p)^{S_n}$ — each checked by one line
      of conditional expectation algebra on a single increment.
    steps:
      - teach: >
          Each entry is checked the same way: expand one conditional
          expectation of a single increment. The centered walk works because
          $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=p-q$ always, so subtracting the
          running drift $n(p-q)$ leaves conditional expectation exactly zero at
          every step.
      - teach: >
          The compensated square is $(S_n-n(p-q))^{2}-4pq\,n$: since
          $X_i^{2}=1$ always for a $\pm1$ step,
          $\operatorname{Var}(X_i)=1-(p-q)^{2}=4pq$ using $p+q=1$ — the
          compensator is exactly that variance, no coincidence at all.
      - ask: >
          For a $\pm1$ walk with $p=0.3$, $q=0.7$, what is the per-step
          compensator $4pq$ in the compensated-square martingale
          $(S_n-n(p-q))^{2}-4pq\,n$?
        expects: "0.84"
        hint: >
          Compute $1-(p-q)^{2}$, or equivalently $4pq$, directly.
        feedback: >
          $\operatorname{Var}(X_i)=1-(p-q)^{2}=1-(-0.4)^{2}=1-0.16=0.84$,
          matching $4pq=4(0.3)(0.7)=0.84$ directly since $p+q=1$.
      - teach: >
          The geometric martingale $(q/p)^{S_n}$ checks a multiplicative fair
          game instead of an additive one: the random multiplier
          $(q/p)^{X_{n+1}}$ has mean $p\cdot(q/p)+q\cdot(p/q)=q+p=1$, so "drift
          zero" becomes "multiplier averages to $1$."
      - ask: >
          For a $\pm1$ walk with $p=0.6$, what is the base $q/p$ of its
          geometric martingale?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          Compute $q=1-p$ first, then divide.
        feedback: >
          $q=1-p=0.4$, so $q/p=0.4/0.6=2/3\approx0.6667$.
      - ask: >
          For a biased walk with $p=0.2$, which is the correct
          compensated-square martingale?
        choices:
          - text: >
              $S_n^{2}-n$
            feedback: >
              That identity is special to $p=1/2$; a biased walk needs the
              $n(p-q)$ recentering and the $4pq\,n$ compensator.
          - text: >
              $(S_n-n(p-q))^{2}-4pq\,n$
            correct: true
            feedback: >
              The general construction, valid for any $p$: here $p-q=-0.6$ and
              $4pq=0.64$.
          - text: >
              $(S_n-n(p-q))^{2}-n$
            feedback: >
              This uses compensator $n$ instead of $4pq\,n$ — correct only when
              $4pq=1$, which forces $p=q=1/2$, the case this question is
              specifically about avoiding.
        feedback: >
          The general martingale keeps both pieces, the recentering $n(p-q)$
          and the compensator $4pq\,n$; dropping either breaks away from the
          special case $p=1/2$.
      - teach: >
          The sign trap: the geometric martingale is $(q/p)^{S_n}$, not
          $(p/q)^{S_n}$ — only the ratio $q/p$ has a single-step multiplier
          with expectation exactly $1$.
      - teach: >
          Three constructions cover nearly every random-walk problem: the
          level, the compensated square, and the geometric martingale — each
          verified by one line of conditional-expectation algebra on a single
          increment.


  - node: quant-processes.martingales.exponential-martingale
    hook: >
      This is the general engine behind the geometric martingale — pick
      $\theta$ so the moment generating function equals $1$, and any random
      walk hands you a bounded martingale for free.
    explanation: >
      The geometric martingale is a special case of a much more general
      construction: for iid increments with finite
      $\phi(\theta)=\mathbb{E}[e^{\theta X_1}]$, the ratio
      $M_n=e^{\theta S_n}/\phi(\theta)^{n}$ is always a martingale, because
      the new increment's contribution $e^{\theta X_{n+1}}$ is independent of
      the past and averages to exactly $\phi(\theta)$, cancelling the extra
      factor picked up in the denominator — the same one-line check used
      throughout the zoo, carried out for exponentials.

      The move worth remembering is choosing $\theta$ to solve
      $\phi(\theta)=1$ rather than leaving the denominator in. When that root
      exists, the denominator becomes $1$ and $e^{\theta S_n}$ itself is a
      martingale — no time-dependent compensator to carry into optional
      stopping.

      For the $\pm1$ walk, $\phi(\theta)=pe^{\theta}+qe^{-\theta}$, and
      solving $\phi(\theta)=1$ gives the nontrivial root $e^{\theta}=q/p$
      ($\theta=0$ is the trivial root), recovering the geometric martingale
      exactly. The general construction is what to reach for once the
      increments aren't $\pm1$.
    worked: >
      Let $X_i=+1$ with probability $1/3$ and $X_i=-2$ with probability
      $2/3$ (mean $-1$, an unfavorable walk). Then
      $\phi(\theta)=(1/3)e^{\theta}+(2/3)e^{-2\theta}$. With $y=e^{\theta}$,
      $\phi(\theta)=1$ becomes $y^{3}-3y^{2}+2=0$; the trivial root is
      $y=1$, and factoring $(y-1)(y^{2}-2y-2)=0$ gives the nontrivial root
      $y=1+\sqrt3\approx2.732$, so $\theta=\ln(1+\sqrt3)\approx1.005$ and
      $M_n=e^{\theta S_n}$ is a martingale with $M_0=1$ — even though the
      walk itself drifts to $-\infty$.
    interview: >
      "Construct a bounded martingale for this random walk" is answered by
      writing $e^{\theta S_n}/\phi(\theta)^{n}$ and proposing to solve
      $\phi(\theta)=1$ for the nontrivial root, showing you know the general
      construction, not just the $\pm1$ special case.
    pitfalls: >
      Forgetting $\theta=0$ always solves $\phi(\theta)=1$ and stopping
      there — the useful root is the other one. Using $M_n=e^{\theta S_n}$
      without dividing by $\phi(\theta)^{n}$ for a $\theta$ that hasn't been
      tuned to make $\phi(\theta)=1$ — for a generic $\theta$ that's not a
      martingale at all.
    recap: >
      $e^{\theta S_n}/\phi(\theta)^{n}$ is a martingale for any $\theta$, and
      solving $\phi(\theta)=1$ for its nontrivial root removes the
      compensator, generalizing the $\pm1$ walk's geometric martingale to any
      iid step distribution.
    steps:
      - teach: >
          The geometric martingale generalizes: for iid increments with finite
          $\phi(\theta)=\mathbb{E}[e^{\theta X_1}]$, $M_n=e^{\theta
          S_n}/\phi(\theta)^{n}$ is a martingale for any $\theta$ — the same
          one-line check as the zoo, done for exponentials.
      - teach: >
          The useful move is solving $\phi(\theta)=1$ for the nontrivial root:
          the denominator becomes $1$ and $e^{\theta S_n}$ itself is a
          martingale, with no time-dependent compensator to carry into optional
          stopping.
      - ask: >
          For the $\pm1$ walk with $p=0.2,q=0.8$, what is the nontrivial root
          $e^{\theta}$ solving $\phi(\theta)=pe^{\theta}+qe^{-\theta}=1$?
        expects: "4"
        hint: >
          For the $\pm1$ walk the nontrivial root is exactly $q/p$.
        feedback: >
          $e^{\theta}=q/p=0.8/0.2=4$; checking,
          $\phi(\theta)=0.2(4)+0.8(1/4)=0.8+0.2=1$, confirming the root.
      - teach: >
          For the $\pm1$ walk this recovers the geometric martingale exactly,
          but the construction does not need $\pm1$ steps at all — it is the
          tool once increments take other values.
      - ask: >
          A geometric-style martingale for a $\pm1$ walk uses base $q/p=3$.
          Since $p+q=1$, what is $p$?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          Substitute $q=3p$ into $p+q=1$ and solve.
        feedback: >
          $q=3p$ and $p+q=1$ give $p+3p=1$, so $4p=1$ and $p=1/4$.
      - ask: >
          Solving $\phi(\theta)=1$ always has one solution called the trivial
          root. What is it?
        choices:
          - text: >
              $\theta=0$
            correct: true
            feedback: >
              $\phi(0)=\mathbb{E}[e^{0}]=1$ always, so $\theta=0$ trivially
              solves $\phi(\theta)=1$ — it gives $M_n=1$ for every $n$, so the
              useful root is the other one.
          - text: >
              $\theta$ equal to the increment's mean $\mu$.
            feedback: >
              No such general identity holds; $\phi(\theta)=1$ is an equation
              in $\theta$, not a statement about $\mu$.
          - text: >
              $\theta=1/\phi'(0)$
            feedback: >
              This is not generally a root of $\phi(\theta)=1$.
        feedback: >
          $\theta=0$ always solves $\phi(\theta)=1$ because $\phi(0)=1$ by
          definition of the moment generating function; the useful root is the
          nonzero one.
      - teach: >
          Using $M_n=e^{\theta S_n}$ without dividing by $\phi(\theta)^{n}$,
          for a $\theta$ that has not been tuned to solve $\phi(\theta)=1$, is
          not a martingale at all — the division only vanishes once the root is
          used.
      - teach: >
          $e^{\theta S_n}/\phi(\theta)^{n}$ is always a martingale, and solving
          $\phi(\theta)=1$ for the nontrivial root removes the compensator,
          generalizing the $\pm1$ walk's geometric martingale to any iid step
          distribution.


  - node: quant-processes.martingales.spotting-martingales
    hook: >
      This is the master recipe interviewers actually expect: compute one
      drift, read one case, done — memorizing the zoo's formulas is no
      substitute for deriving a fourth one live.
    explanation: >
      Every hitting-probability or hitting-time question reduces to the same
      computation: propose a candidate function $f$ of the current state,
      compute the one-step drift
      $D(x)=\mathbb{E}[f(X_{n+1})-f(X_n)\mid X_n=x]$, and read off which case
      you're in — exactly the calculation already done three times in the
      zoo, made systematic.

      Zero drift is the probability case: if $D\equiv0$ then $f(X_n)$ is
      itself a martingale, and optional stopping — once its conditions are
      checked — reads off a hitting probability with no further work.
      Constant nonzero drift is the time case: if $D\equiv c$, subtracting
      the running total $cn$ cancels the drift, so $f(X_n)-cn$ is a
      martingale, and stopping it returns an expected time instead.

      When the drift depends on the state $x$, the zero-drift equation
      $D(x)\equiv0$ is a functional equation for $f$ — for a Markov chain
      with transition matrix $P$ this is the harmonic equation $Pf=f$, solved
      subject to boundary values $1$ and $0$ at the two absorbing states,
      while $Pf-f=-1$ is the corresponding equation for an expected time.
      Probabilities want harmonic functions; times want a compensator.
    worked: >
      For the fair $\pm1$ walk absorbed at $0$ and $N$, try $f(x)=x$: its
      drift is $D(x)=\mathbb{E}[X_{n+1}-X_n]=0$ identically, so $f(X_n)=S_n$
      is already a martingale and needs no further solving — exactly why
      $S_n$, not some other function, hands the ruin probability straight to
      optional stopping.
    interview: >
      "How would you find the right martingale for this hitting-time
      problem" wants the drift computation stated as a general method, not a
      lookup in the zoo. A frequent follow-up asks you to solve $Pf=f$ for a
      small Markov chain live.
    pitfalls: >
      Guessing a function, finding nonzero non-constant drift, and giving up
      instead of solving the resulting functional equation. Forgetting the
      boundary conditions on the harmonic equation — $Pf=f$ alone has many
      solutions, and only the boundary values pick out the right one.
    recap: >
      Compute the one-step drift of a candidate function of the state; zero
      drift gives a martingale and a probability, constant drift gives a
      compensated martingale and an expected time.
    steps:
      - teach: >
          Every hitting-probability or hitting-time question reduces to the
          same computation: propose a candidate function $f$ of the state,
          compute the one-step drift $D(x)=\mathbb{E}[f(X_{n+1})-f(X_n)\mid
          X_n=x]$, and read off which case you are in.
      - teach: >
          Zero drift is the probability case: $D\equiv0$ makes $f(X_n)$ itself
          a martingale. Constant nonzero drift is the time case: $D\equiv c$
          means $f(X_n)-cn$ is the martingale instead, and stopping it returns
          an expected time.
      - ask: >
          For the biased $\pm1$ walk with $p=0.3,q=0.7$, take $f(x)=x$. What is
          its one-step drift $D(x)=\mathbb{E}[X_{n+1}-X_n\mid X_n=x]$?
        expects: "-0.4"
        hint: >
          The drift of $f(x)=x$ is just the increment's mean.
        feedback: >
          $D=\mathbb{E}[\text{increment}]=p-q=0.3-0.7=-0.4$, a nonzero constant
          — this lands in the time case, not the probability case.
      - teach: >
          When the drift is a nonzero constant $c$, subtracting the running
          total $cn$ is exactly how $S_n-n(p-q)$ was built in the zoo — the
          general recipe reproduces that level martingale rather than requiring
          it be looked up.
      - ask: >
          For a Markov chain with transition matrix $P$, you want an expected
          absorption TIME, not a probability. Which equation should $f$ solve?
        choices:
          - text: >
              $Pf=f$
            feedback: >
              That is the probability case — the harmonic equation for zero
              drift.
          - text: >
              $Pf-f=-1$
            correct: true
            feedback: >
              Constant drift $-1$: $f(X_n)+n$ is the martingale, and stopping
              it delivers an expected time.
          - text: >
              $Pf-f=0$ with boundary values $1$ and $0$.
            feedback: >
              That is the same probability equation restated with its boundary
              values attached, still not the time equation.
        feedback: >
          Times need constant drift subtracted off, $Pf-f=-1$; probabilities
          need zero drift, $Pf=f$, with boundary values.
      - teach: >
          When the drift depends on the state $x$ itself, $D(x)\equiv0$ becomes
          a functional equation for $f$: for a Markov chain that is the
          harmonic equation $Pf=f$, solved subject to boundary values $1$ and
          $0$ at the two absorbing states.
      - ask: >
          Same biased walk ($p=0.3$). Take $f(x)=x^{2}$ instead of $f(x)=x$;
          its drift works out to $D(x)=2x(p-q)+1=1-0.8x$. What kind of drift is
          this?
        choices:
          - text: >
              Zero.
            feedback: >
              It equals $1-0.8x$, not identically zero.
          - text: >
              Constant nonzero.
            feedback: >
              It depends on $x$ through the $-0.8x$ term, so it is not
              constant.
          - text: >
              State-dependent.
            correct: true
            feedback: >
              $D(x)=1-0.8x$ varies with the current state, so $f(x)=x^{2}$
              alone does not hand you a time martingale directly — you would
              need the harmonic-equation machinery, or reach for the
              compensated square from the zoo instead.
        feedback: >
          Not every candidate $f$ gives constant drift; $x^{2}$ here lands in
          the state-dependent case, which needs the general equation or a known
          construction, not a simple subtraction.
      - teach: >
          The failure mode is giving up the moment drift is not obviously $0$
          or constant: a state-dependent drift is not a dead end, it is the
          harmonic equation $Pf=f$ waiting to be solved with its boundary
          values attached.
      - teach: >
          Compute the one-step drift of a candidate function of the state; zero
          drift gives a probability, constant drift gives an expected time, and
          state-dependent drift means solving for $f$ directly.


  - node: quant-processes.martingales.martingale-transform
    hook: >
      This is the theorem behind "the house always wins in expectation" — no
      way of sizing your bets changes the mean of a fair game, only its
      spread.
    explanation: >
      A predictable stake $H_n$ is fixed by $\mathcal{F}_{n-1}$ — chosen
      before round $n$'s outcome is revealed, exactly the "no peeking"
      restriction the adapted/predictable distinction was built to express.
      The transform $(H\cdot X)_n=\sum_{k=1}^{n}H_k(X_k-X_{k-1})$ is just your
      cumulative winnings under that staking plan.

      The transform is a martingale because each term
      $H_k(X_k-X_{k-1})$ has conditional expectation zero given
      $\mathcal{F}_{k-1}$: $H_k$ is already known there and pulls out,
      leaving $H_k\cdot\mathbb{E}[X_k-X_{k-1}\mid\mathcal{F}_{k-1}]=H_k\cdot0=0$
      by the martingale property of $X$ itself. Summing zero-mean increments
      keeps the running total flat, so $\mathbb{E}[(H\cdot X)_n]=0$ at every
      fixed $n$.

      This is the formal version of "no betting system beats a fair game":
      doubling, stop-losses sized on past information — every one is a choice
      of $H_n$, and every one leaves the mean exactly where it started, only
      reshaping the distribution around it. The one lever the theorem does
      not touch is when to stop.
    worked: >
      Fair coin, $X_n$ the $\pm1$ walk, staking rule $H_n=2$ if the previous
      toss was heads, $H_n=1$ otherwise. Realized path H,T,H (increments
      $+1,-1,+1$) gives $H_1=1$ (no history), $H_2=2$ (previous was H),
      $H_3=1$ (previous was T), so $(H\cdot X)_3=1(1)+2(-1)+1(1)=0$;
      unconditionally $\mathbb{E}[(H\cdot X)_3]=0$ regardless of the staking
      rule chosen.
    interview: >
      "Can a clever staking strategy make a fair game profitable?" wants the
      transform-is-a-martingale argument named, with predictability of the
      stake identified as load-bearing. A sharp follow-up: "what if the stake
      could depend on the current outcome?" — then it isn't predictable and
      the theorem doesn't apply.
    pitfalls: >
      Letting $H_n$ depend on $X_n$ itself and still calling it predictable —
      that breaks $\mathcal{F}_{n-1}$-measurability entirely. Assuming
      boundedness of $H_n$ can be dropped for free; unbounded stakes are
      exactly what breaks optional stopping later.
    recap: >
      Any predictable stake sequence applied to a martingale produces another
      martingale with mean $0$ — sizing a bet reshapes variance, never
      expectation.
    steps:
      - teach: >
          A predictable stake $H_n$ is fixed by $\mathcal{F}_{n-1}$ — chosen
          before round $n$'s outcome is revealed. The transform $(H\cdot
          X)_n=\sum_{k=1}^{n}H_k(X_k-X_{k-1})$ is just your cumulative winnings
          under that staking plan.
      - teach: >
          Each term $H_k(X_k-X_{k-1})$ has conditional mean zero given
          $\mathcal{F}_{k-1}$: $H_k$ is already known there and pulls out,
          leaving $H_k\cdot0=0$ by the martingale property of $X$ itself —
          summing zero-mean terms keeps the running total flat.
      - ask: >
          Fair coin, $\pm1$ walk $X_n$, staking rule: $H_n=3$ if the previous
          toss was heads, $1$ otherwise ($H_1=1$, no history). Realized path
          $H,H,T$ gives increments $+1,+1,-1$. What is $(H\cdot X)_3$?
        expects: "1"
        hint: >
          Determine each $H_k$ from the PREVIOUS toss, then dot against the
          increments.
        feedback: >
          $H_1=1$ (no history), $H_2=3$ (previous was $H$), $H_3=3$ (previous
          was $H$ again), so $(H\cdot X)_3=1(1)+3(1)+3(-1)=1+3-3=1$ along this
          particular path.
      - teach: >
          Unconditionally, $\mathbb{E}[(H\cdot X)_n]=0$ always — the formal
          version of "no betting system beats a fair game." Sizing a bet
          reshapes the distribution and its variance, never the mean.
      - ask: >
          For the same staking rule and coin, what is $\mathbb{E}[(H\cdot
          X)_3]$ unconditionally, before any tosses are observed?
        expects: "0"
        hint: >
          This does not require redoing the path calculation — use the theorem
          directly.
        feedback: >
          Regardless of the specific predictable, bounded rule $H_n$, the
          transform is a martingale from $0$, so its expectation is $0$ at
          every fixed $n$ — even though the realized value on the $H,H,T$ path
          above was $1$.
      - ask: >
          Which of these staking rules is NOT predictable, and so falls outside
          this theorem?
        choices:
          - text: >
              $H_n=2$ if yesterday's close was up, $1$ otherwise.
            feedback: >
              Fixed using only $\mathcal{F}_{n-1}$ — genuinely predictable.
          - text: >
              $H_n=100$ for every $n$.
            feedback: >
              A constant is trivially predictable — known before anything
              happens at all.
          - text: >
              $H_n=2$ if today's toss (round $n$) is heads, $1$ otherwise.
            correct: true
            feedback: >
              This uses $X_n$ itself, not revealed until round $n$ is played —
              adapted to $\mathcal{F}_n$, not $\mathcal{F}_{n-1}$, so it is not
              predictable and the theorem does not apply.
        feedback: >
          Predictability means fixed one round before it is used; a rule that
          peeks at the very outcome it is betting on breaks the hypothesis
          entirely.
      - teach: >
          Boundedness of $H_n$ (or the integrability condition in its place)
          matters — dropping it is not free. Unbounded stakes are exactly what
          breaks optional stopping later in the unit.
      - teach: >
          Any predictable stake sequence applied to a martingale produces
          another martingale with mean $0$ — sizing a bet reshapes variance,
          never expectation.


  - node: quant-processes.martingales.stopping-time
    hook: >
      This definition — decide using only the past — is the single
      hypothesis every optional stopping argument lives or dies on, so
      knowing the non-examples cold matters as much as the examples.
    explanation: >
      A stopping time formalizes "a rule for quitting that a person actually
      watching the process could follow": at each time $n$ you must already
      be able to say whether you've stopped, using only what's been revealed
      through $\mathcal{F}_n$. Formally $\{T=n\}\in\mathcal{F}_n$ for every
      $n$ — the event "I stop exactly now" is decided by present information,
      never future.

      The examples share the same shape: hitting a level, completing a
      pattern, a fixed deterministic time, and combinations like min, max or
      a fixed shift of two stopping times — all decidable by watching,
      without knowing what comes next.

      The non-examples are worth memorizing precisely because they look
      almost legitimate: "the time the walk hits its maximum over $[0,N]$"
      needs the whole path first, to know it wasn't beaten later; "the step
      just before the first visit to $a$" requires already knowing when that
      visit happens; "the last visit to $0$" and every version of selling at
      the top need clairvoyance. Optional stopping has nothing to say about
      any of these.
    worked: >
      For the $\pm1$ walk started at $S_0=5$, let $T_1$ = first time $S_n$
      hits $0$ or $10$: a stopping time, since checking $S_n\in\{0,10\}$ at
      each $n$ uses only what's observed. Let $T_2$ = the last time before
      absorption that $S_n=5$: not a stopping time, since declaring "this is
      the last visit to $5$" requires already knowing the walk never returns
      — information only available from the entire future path.
    interview: >
      "Is this a valid stopping time?" is asked almost literally — the answer
      must be justified by "can you tell at time $n$, using only
      $\mathcal{F}_n$" rather than intuition about fairness. Expect several
      examples and non-examples in a row.
    pitfalls: >
      Calling "the time of the maximum" a stopping time because it feels
      natural — it needs the whole path to confirm no later value beats it.
      Assuming any reasonable-sounding trading rule ("sell when the price
      will never be this high again") is a stopping time; if it needs the
      future, it isn't, no matter how natural it sounds.
    recap: >
      $T$ is a stopping time exactly when $\{T=n\}$ is decided by
      $\mathcal{F}_n$ — a rule for quitting using only what has already
      happened, and every optional stopping argument requires exactly this.
    steps:
      - teach: >
          A stopping time formalizes deciding using only the past: at each time
          $n$ you must already be able to say whether you have stopped, using
          only $\mathcal{F}_n$. Formally $\{T=n\}\in\mathcal{F}_n$ for every
          $n$.
      - teach: >
          The examples share one shape — hitting a level, completing a pattern,
          a fixed deterministic time, and combinations like min, max, or a
          fixed shift of stopping times — all decidable by watching, without
          knowing what comes next.
      - ask: >
          Is a deterministic time $n_0=7$ (stop after exactly $7$ rounds, no
          matter what) a stopping time?
        choices:
          - text: >
              Yes.
            correct: true
            feedback: >
              $\{T=7\}=\Omega$ and $\{T=n\}=\emptyset$ for $n\ne7$, both
              trivially in every $\mathcal{F}_n$ — a fixed rule is always a
              (trivial) stopping time.
          - text: >
              No, since it ignores the process entirely.
            feedback: >
              Ignoring the process is fine; the requirement is only that
              stopping does not need the future, and a fixed time trivially
              satisfies that.
          - text: >
              Only if the process happens to hit a specific level at time $7$.
            feedback: >
              A deterministic stopping time does not depend on the process's
              path at all — that is what makes it deterministic.
        feedback: >
          A fixed time is the simplest possible stopping time — no information
          is needed at all, let alone future information.
      - teach: >
          The non-examples are worth memorizing precisely because they look
          almost legitimate: the time of the walk's maximum, the step just
          before a first visit, the last visit to a level, and every version of
          selling at the top all need the future.
      - ask: >
          Walk starts at $S_0=8$, absorbed at $0$ or $15$. Is $T=\text{first
          time } S_n=12$ a stopping time?
        choices:
          - text: >
              Yes.
            correct: true
            feedback: >
              Checking $S_n=12$ at each $n$ uses only what has been observed
              through time $n$ — exactly $\{T=n\}\in\mathcal{F}_n$.
          - text: >
              No, because it might never happen.
            feedback: >
              Possibly never occurring ($T=\infty$) does not disqualify a rule
              from being a stopping time; only needing the future does.
          - text: >
              No, because you would need to know the walk will not hit $12$
              again later.
            feedback: >
              That confuses first hit with last hit — a first hit is decided
              the instant it happens, with no lookahead.
        feedback: >
          "First time X happens" is always decidable by watching; it is "last
          time" or "the step just before" that needs the future.
      - ask: >
          Same walk. Is $T=\text{the step immediately before the walk's first
          return to } 8$ a stopping time?
        choices:
          - text: >
              Yes, it only depends on when the walk returns to $8$.
            feedback: >
              Knowing you are "the step before" a return requires already
              knowing the very next step lands on $8$ — genuine foresight.
          - text: >
              No.
            correct: true
            feedback: >
              Declaring "this is the step right before the first return" needs
              already knowing what happens next — the same shape as the "step
              just before" non-example.
          - text: >
              Yes, since the target level $8$ is already known at time $0$.
            feedback: >
              Knowing the target level does not help; the problem is needing to
              look one step ahead to confirm it is about to be hit.
        feedback: >
          This is the "step just before" non-example in a fresh disguise —
          declaring you have stopped requires knowing what happens next.
      - teach: >
          Trading rules that sound reasonable — "sell when the price will never
          be this high again" — are not stopping times if they need the future,
          however natural they feel while stated.
      - teach: >
          $T$ is a stopping time exactly when $\{T=n\}$ is decided by
          $\mathcal{F}_n$ — a rule for quitting using only what has already
          happened, and every optional stopping argument requires exactly this.


  - node: quant-processes.martingales.stopped-martingale
    hook: >
      This is the free half of optional stopping — truncating a fair game at
      any stopping time whatsoever costs nothing at any fixed horizon, and
      knowing exactly why makes the theorem after this one legible.
    explanation: >
      Write the stopped process as a telescoping sum:
      $X_{T\wedge n}=X_0+\sum_{k=1}^{n}\mathbf{1}\{T\ge k\}(X_k-X_{k-1})$ —
      each term contributes the increment if the process hasn't stopped yet,
      or zero if it has. This is exactly the martingale transform with stake
      $H_k=\mathbf{1}\{T\ge k\}$.

      The stake is predictable because $\{T\ge k\}=\{T\le k-1\}^{c}$, and
      $\{T\le k-1\}$ is decided by $\mathcal{F}_{k-1}$ by the very definition
      of a stopping time — whether you're "still in the game" at round $k$ is
      knowable one step early. That predictability is the entire proof.

      Because it's a martingale transform by a predictable, bounded stake,
      $X_{T\wedge n}$ is a martingale, so $\mathbb{E}[X_{T\wedge n}]=
      \mathbb{E}[X_0]$ holds for every fixed $n$, with no assumption on $T$
      beyond being a stopping time. Everything difficult in optional stopping
      lives entirely in the limit $n\to\infty$, where
      $\mathbb{E}[X_{T\wedge n}]\to\mathbb{E}[X_T]$ can fail.
    worked: >
      Fair walk from $S_0=3$, $T$ = first hit of $0$ or $8$. At $n=2$, before
      absorption is possible: with probability $1/4$ up-up ($S_2=5$), $1/2$
      mixed ($S_2=3$), $1/4$ down-down ($S_2=1$, not yet absorbed). So
      $\mathbb{E}[S_{T\wedge2}]=\frac14(5)+\frac12(3)+\frac14(1)=3$, matching
      $S_0=3$ exactly.
    interview: >
      "Why is $\mathbb{E}[X_{T\wedge n}]=\mathbb{E}[X_0]$ always true, with
      no conditions on $T$?" wants the martingale-transform argument named
      directly. A sharp follow-up asks where the argument would break trying
      to push $n\to\infty$.
    pitfalls: >
      Believing this already proves $\mathbb{E}[X_T]=\mathbb{E}[X_0]$ — it
      proves only the truncated version at every finite $n$; the limit is a
      separate, nontrivial step. Checking predictability of
      $\mathbf{1}\{T\ge k\}$ against $\mathcal{F}_k$ instead of
      $\mathcal{F}_{k-1}$ — the whole point is it's fixed one step early.
    recap: >
      Stopping a martingale at any stopping time and fixed horizon costs
      nothing — $X_{T\wedge n}$ is itself a martingale — and every difficulty
      in optional stopping lives in the limit $n\to\infty$.
    steps:
      - teach: >
          The stopped process telescopes: $X_{T\wedge
          n}=X_0+\sum_{k=1}^{n}\mathbf{1}\{T\ge k\}(X_k-X_{k-1})$ — each term
          contributes the increment if the process has not stopped yet, or zero
          if it has. This is exactly a martingale transform.
      - teach: >
          The stake $\mathbf{1}\{T\ge k\}$ is predictable because $\{T\ge
          k\}=\{T\le k-1\}^{c}$ is decided by $\mathcal{F}_{k-1}$ by the very
          definition of a stopping time — whether you are still in the game at
          round $k$ is knowable one step early.
      - ask: >
          Fair walk from $S_0=2$, absorbed at $0$ or $4$. What is
          $\mathbb{E}[S_{T\wedge2}]$?
        expects: "2"
        hint: >
          Enumerate all four two-step paths, noting which have already hit a
          barrier, and average.
        feedback: >
          The four two-step paths (probability $1/4$ each) give $S_2=4$
          (already absorbed), $S_2=2$, $S_2=2$, $S_2=0$ (already absorbed):
          $\frac14(4)+\frac14(2)+\frac14(2)+\frac14(0)=2$, matching $S_0=2$
          exactly.
      - teach: >
          Because it is a martingale transform by a predictable, bounded stake,
          $X_{T\wedge n}$ is a martingale, so $\mathbb{E}[X_{T\wedge
          n}]=\mathbb{E}[X_0]$ holds at every fixed $n$, for every stopping
          time $T$, with no assumption on $T$ at all.
      - ask: >
          For the same walk, what is $\mathbb{E}[S_{T\wedge50}]$?
        expects: "2"
        hint: >
          This holds at every finite $n$ — no new computation is needed beyond
          the theorem itself.
        feedback: >
          The identity $\mathbb{E}[S_{T\wedge n}]=\mathbb{E}[S_0]$ holds at
          every fixed $n$, not just $n=2$; since the walk is essentially
          certain to have exited $[0,4]$ long before $50$ steps, this also
          matches the fair-ruin mean $\mathbb{E}[S_T]=4(1/2)=2$.
      - ask: >
          Since $\mathbb{E}[S_{T\wedge n}]=2$ at every $n$, does it follow that
          $\mathbb{E}[S_T]=2$ as well, for free?
        choices:
          - text: >
              Yes, it is the same statement.
            feedback: >
              This conflates the free finite-horizon fact with the actual
              optional stopping conclusion — exchanging the limit and the
              expectation is a separate, nontrivial step.
          - text: >
              No, not without more justification.
            correct: true
            feedback: >
              $\mathbb{E}[X_{T\wedge n}]\to\mathbb{E}[X_0]$ holds at every
              finite $n$ for free, but passing the limit through the
              expectation to conclude $\mathbb{E}[X_T]=\mathbb{E}[X_0]$ needs
              one of the optional stopping conditions.
          - text: >
              No, because $X_{T\wedge n}$ is not actually a martingale.
            feedback: >
              It is a martingale — that is this lesson's entire point — the gap
              lies elsewhere, in the $n\to\infty$ limit.
        feedback: >
          The stopped process being a martingale at every finite $n$ is free;
          whether that survives the limit is exactly what optional stopping
          addresses next.
      - teach: >
          Checking predictability of $\mathbf{1}\{T\ge k\}$ against
          $\mathcal{F}_k$ instead of $\mathcal{F}_{k-1}$ is the recurring
          off-by-one — the whole point is that it is fixed one step early.
      - teach: >
          Stopping a martingale at any stopping time and fixed horizon costs
          nothing — $X_{T\wedge n}$ is itself a martingale — and every
          difficulty in optional stopping lives in the limit $n\to\infty$.


  - node: quant-processes.martingales.ost
    hook: >
      This theorem is asked constantly and gotten wrong constantly, because
      the three sufficient conditions, not the conclusion, are the actual
      content — name your condition or the argument is worthless.
    explanation: >
      The stopped process gives $\mathbb{E}[X_{T\wedge n}]=\mathbb{E}[X_0]$
      free at every finite $n$; optional stopping is entirely about pushing
      $n\to\infty$ to get $\mathbb{E}[X_T]=\mathbb{E}[X_0]$. Since
      $X_{T\wedge n}\to X_T$ almost surely, the only question is whether
      expectation commutes with that limit, and the three conditions are
      three different sufficient routes to that interchange.

      Condition (a), $T\le N$, needs nothing else — the sum stabilizes at
      $X_T$ for $n\ge N$. Condition (b), a bounded stopped process, invokes
      dominated convergence directly. Condition (c), the one most often
      needed in interview problems, pairs bounded increments with
      $\mathbb{E}[T]<\infty$: this bounds $|X_{T\wedge n}-X_0|$ by
      $C\cdot T$, and $\mathbb{E}[T]<\infty$ makes that dominating bound
      itself integrable.

      The sharp criterion behind all three — uniform integrability of
      $(X_{T\wedge n})_n$ — is worth knowing exists even if rarely checked
      directly; each named condition is a convenient way of guaranteeing it.
      For a supermartingale the identical conditions give
      $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ instead of equality.
    worked: >
      Fair walk from $S_0=2$, absorbed at $0$ or $6$. $T$ is unbounded
      (condition a fails), but $0\le S_{T\wedge n}\le6$ for every $n$ —
      condition (b) holds with $C=6$ — so $\mathbb{E}[S_T]=\mathbb{E}[S_0]=2$
      is licensed, giving $6\Pr(\text{hit }6)=2$, hitting probability $1/3$.
    interview: >
      "State optional stopping and its conditions" is asked almost verbatim;
      interviewers listen for which condition applies to this problem, not a
      recitation of all three. A common trap gives an unbounded stopping time
      and asks whether the conclusion still holds.
    pitfalls: >
      Applying $\mathbb{E}[X_T]=\mathbb{E}[X_0]$ to an unbounded stopping
      time without checking any condition — the single most common error in
      the unit. Confusing "$T<\infty$ almost surely" (required just to state
      the theorem) with "$T$ is bounded" (only one of three ways to satisfy
      it).
    recap: >
      $\mathbb{E}[X_T]=\mathbb{E}[X_0]$ holds under a bounded stopping time,
      a bounded stopped process, or bounded increments with
      $\mathbb{E}[T]<\infty$ — without naming one, the conclusion is false,
      not just unproved.
    steps:
      - teach: >
          The stopped process gives $\mathbb{E}[X_{T\wedge n}]=\mathbb{E}[X_0]$
          free at every finite $n$; optional stopping is entirely about pushing
          $n\to\infty$ to get $\mathbb{E}[X_T]=\mathbb{E}[X_0]$.
      - teach: >
          Three sufficient routes to that interchange: (a) $T\le N$, a bounded
          stopping time; (b) the stopped process is bounded; (c) bounded
          increments together with $\mathbb{E}[T]<\infty$ — the one most often
          reached for in interview problems.
      - ask: >
          Fair walk from $S_0=5$, absorbed at $0$ or $9$. Using condition (b) —
          the stopped process is bounded between $0$ and $9$ — what is
          $\Pr(\text{hit } 9)$?
        expects: "5/9"
        tolerance: 0.0005
        hint: >
          Combine the licensed identity $\mathbb{E}[S_T]=5$ with
          $S_T\in\{0,9\}$.
        feedback: >
          $\mathbb{E}[S_T]=\mathbb{E}[S_0]=5$, and
          $\mathbb{E}[S_T]=9\Pr(\text{hit }9)$, so $\Pr(\text{hit
          }9)=5/9\approx0.5556$.
      - teach: >
          Condition (c) bounds $|X_{T\wedge n}-X_0|$ by $C\cdot T$, and
          $\mathbb{E}[T]<\infty$ makes that dominating bound itself integrable
          — the reason it is usually the condition to reach for first.
      - ask: >
          A stopping time $T$ satisfies $\mathbb{E}[T]<\infty$ but the
          increments $X_n-X_{n-1}$ are unbounded. Which of the three
          conditions, if any, is satisfied?
        choices:
          - text: >
              Condition (c).
            feedback: >
              (c) needs BOTH $\mathbb{E}[T]<\infty$ AND bounded increments;
              unbounded increments alone breaks it.
          - text: >
              Condition (a).
            feedback: >
              Nothing here bounds $T$ by a fixed $N$ — that is a much stronger
              requirement than $\mathbb{E}[T]<\infty$.
          - text: >
              None of the three, as stated.
            correct: true
            feedback: >
              This is exactly the gap the three conditions are built to exclude
              — without a bounded $T$, a bounded stopped process, or the
              bounded-increments-plus-finite-mean pair, none of the three
              routes are available.
        feedback: >
          Each condition demands something specific; having only part of
          condition (c) satisfies none of them.
      - teach: >
          For a supermartingale the identical three conditions give
          $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ instead of equality — the
          finite-horizon inequality survives the same limit argument.
      - ask: >
          For a supermartingale under any of the three conditions, what does
          optional stopping give?
        choices:
          - text: >
              $\mathbb{E}[X_T]=\mathbb{E}[X_0]$
            feedback: >
              Equality is the martingale case; a supermartingale only
              guarantees a one-sided bound.
          - text: >
              $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$
            correct: true
            feedback: >
              Same three conditions, but drift is only $\le$ at each step, so
              the conclusion inherits $\le$ rather than $=$.
          - text: >
              $\mathbb{E}[X_T]\ge\mathbb{E}[X_0]$
            feedback: >
              That is the submartingale direction; supermartingales drift down,
              so the inequality points the other way.
        feedback: >
          The finite-horizon fact $\mathbb{E}[X_{T\wedge
          n}]\le\mathbb{E}[X_0]$, true for any supermartingale with no
          conditions at all, passes to the limit under (a)/(b)/(c), preserving
          $\le$.
      - teach: >
          Applying $\mathbb{E}[X_T]=\mathbb{E}[X_0]$ to an unbounded stopping
          time without naming a condition is the single most common error in
          the unit — and "$T<\infty$ almost surely" is not the same claim as
          "$T$ is bounded."
      - teach: >
          $\mathbb{E}[X_T]=\mathbb{E}[X_0]$ holds under a bounded stopping
          time, a bounded stopped process, or bounded increments with
          $\mathbb{E}[T]<\infty$ — without naming one, the conclusion is false,
          not just unproved.


  - node: quant-processes.martingales.ost-supermartingale
    hook: >
      This corollary is the formal reason a house edge can't be out-timed —
      no stop-loss, take-profit, or "quit while ahead" rule turns a
      negative-edge game into a nonnegative-edge one.
    explanation: >
      Applying the same three conditions to a supermartingale inherits the
      one-sided inequality from every finite horizon:
      $\mathbb{E}[X_{T\wedge n}]\le\mathbb{E}[X_0]$ holds unconditionally, so
      passing to the limit under (a), (b) or (c) preserves $\le$ rather than
      $=$. A submartingale reverses the inequality by the mirror argument.

      The practical reading: in a game with negative expected value per
      round, no exit rule — stop-loss, take-profit, quitting once ahead —
      can push the expected outcome above where it started. Every such rule
      is a stopping time, and stopping never helps a supermartingale, only
      preserves or worsens the built-in drift.

      The nonnegative case is genuinely stronger, with zero side conditions:
      if $X_n\ge0$, $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ holds even when
      $\Pr(T=\infty)>0$, using Fatou's lemma rather than any named condition
      — nonnegativity alone survives an unbounded, possibly infinite stopping
      time. Fair games can genuinely be broken by unboundedly patient
      stopping (the doubling strategy), but an unfavorable nonnegative one
      cannot be rescued by it.
    worked: >
      A trader's wealth $X_n\ge0$ is a supermartingale with $X_0=100$ under a
      strategy with a small negative edge, and they exit at $T$, the first
      time wealth doubles to $200$ or hits $0$, with $\Pr(T=\infty)>0$
      possible. Nonnegativity alone gives $\mathbb{E}[X_T]\le100$, so if
      wealth ever hits $200$ with probability $p$,
      $200p\le\mathbb{E}[X_T]\le100$ already forces $p\le0.5$ — a genuine
      bound with no further computation.
    interview: >
      "Can a stop-loss rule make a losing strategy profitable?" is answered
      immediately by this corollary. A sharper version asks about the
      nonnegative case ("what if the trader can't go into debt") to check
      whether you know it needs no side conditions at all.
    pitfalls: >
      Assuming the nonnegative-supermartingale bound needs one of the three
      optional-stopping conditions verified — it doesn't; nonnegativity alone
      suffices via Fatou. Reversing the sub-/supermartingale inequality
      direction under time pressure.
    recap: >
      Optional stopping never helps a supermartingale,
      $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ under the usual conditions, and for
      nonnegative wealth that bound holds even with an unbounded, possibly
      infinite stopping time.
    steps:
      - teach: >
          Applying the same three conditions to a supermartingale inherits the
          one-sided inequality from every finite horizon:
          $\mathbb{E}[X_{T\wedge n}]\le\mathbb{E}[X_0]$ holds unconditionally,
          so the limit preserves $\le$ rather than $=$. A submartingale mirrors
          this with $\ge$.
      - teach: >
          The practical reading: in a game with negative expected value per
          round, no exit rule — stop-loss, take-profit, quitting once ahead —
          can push the expected outcome above where it started.
      - ask: >
          A strategy has a small negative edge each round. Can a
          stop-loss/take-profit rule, applied cleverly, push the strategy's
          expected outcome above its starting value?
        choices:
          - text: >
              Yes, with the right threshold.
            feedback: >
              Any such exit rule is a stopping time, and stopping never helps a
              supermartingale — it only preserves or worsens the built-in
              downward drift.
          - text: >
              No.
            correct: true
            feedback: >
              Every stop-loss/take-profit/quit-while-ahead rule is a stopping
              time applied to a supermartingale, and
              $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ under the usual conditions —
              the edge cannot be timed away.
          - text: >
              Only if the rule uses future information.
            feedback: >
              Using future information is not clever, it is simply not a valid
              stopping time — the question concerns legitimate rules, and even
              those cannot help.
        feedback: >
          No exit-timing rule improves a negative-edge game's expectation; that
          is exactly this corollary's content.
      - teach: >
          The nonnegative case is genuinely stronger, needing zero side
          conditions: if $X_n\ge0$, $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ holds
          even when $\Pr(T=\infty)>0$, via Fatou's lemma rather than any of the
          three named conditions.
      - ask: >
          For a NONNEGATIVE supermartingale, which of the three optional
          stopping conditions must you verify before concluding
          $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$?
        choices:
          - text: >
              Condition (a).
            feedback: >
              Not needed; nonnegativity alone suffices via Fatou's lemma, no
              matter how $T$ behaves.
          - text: >
              Condition (c).
            feedback: >
              Same issue — none of the three named conditions is required here.
          - text: >
              None of them.
            correct: true
            feedback: >
              Nonnegativity alone gives $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$,
              even with $\Pr(T=\infty)>0$, via Fatou's lemma — genuinely
              stronger than the general theorem.
        feedback: >
          The nonnegative case is the one exception in the unit that needs no
          named condition at all.
      - ask: >
          A trader's wealth $X_0=50$ is a nonnegative supermartingale (small
          negative edge). They exit at $T$, the first time wealth triples to
          $150$ or hits $0$, with $\Pr(T=\infty)>0$ possible. What is the
          largest possible probability that wealth ever reaches $150$?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          Use $150p\le\mathbb{E}[X_T]\le50$ and solve for the largest possible
          $p$.
        feedback: >
          Nonnegativity alone gives $\mathbb{E}[X_T]\le\mathbb{E}[X_0]=50$ with
          no side conditions. Since reaching $150$ contributes at least $150p$
          to $\mathbb{E}[X_T]$, $150p\le50$ gives $p\le50/150=1/3$.
      - teach: >
          Fair games can genuinely be broken by unboundedly patient stopping —
          the doubling strategy ahead in this unit — but an unfavorable
          nonnegative one cannot be rescued by it.
      - teach: >
          Optional stopping never helps a supermartingale,
          $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ under the usual conditions, and
          for nonnegative wealth that bound holds even with an unbounded,
          possibly infinite stopping time.


  - node: quant-processes.martingales.ruin-via-ost
    hook: >
      This is the fastest legitimate derivation of both gambler's ruin
      formulas — three lines each, no recurrence to set up, once the right
      martingale and optional-stopping condition are named.
    explanation: >
      Recall the two-barrier absorbing walk: a walker at $k$ between $0$ and
      $N$, stopped at $T$, the first exit. Checking a condition is the first
      move, and it's the same for both cases: any run of $N$ consecutive
      up-moves ends the game, so $T$ is dominated by a geometric number of
      such blocks, giving $\mathbb{E}[T]<\infty$; and the walk is trapped in
      $[0,N]$ until it stops, so $0\le S_{T\wedge n}\le N$ — both (b) and (c)
      hold at once.

      In the fair case, $S_n$ itself is the zoo's martingale, so optional
      stopping gives $k=\mathbb{E}[S_0]=\mathbb{E}[S_T]$. Since $S_T$ is $N$
      with probability $\Pr(\text{hit }N)$ and $0$ otherwise,
      $\mathbb{E}[S_T]=N\Pr(\text{hit }N)$ directly, so
      $\Pr(\text{hit }N)=k/N$ — one substitution into optional stopping.

      The biased case swaps in the geometric martingale $(q/p)^{S_n}$, which
      is automatically bounded on $[0,N]$. Optional stopping gives
      $(q/p)^{k}=u(q/p)^{N}+(1-u)$ where $u=\Pr(\text{hit }N)$, a single
      linear equation solved for $u=\dfrac{1-(q/p)^{k}}{1-(q/p)^{N}}$.
    worked: >
      Take $k=3$, $N=5$, biased with $p=0.4$ so $q/p=1.5$. Then
      $u=\dfrac{1-1.5^{3}}{1-1.5^{5}}=\dfrac{1-3.375}{1-7.59375}=
      \dfrac{-2.375}{-6.59375}\approx0.3602$: about a $36\%$ chance of
      reaching $5$ before $0$, despite starting past the midpoint — the bias
      against the walker dominates the head start.
    interview: >
      "Derive the gambler's ruin probability using martingales" is a direct
      request for this argument — naming $S_n$ or $(q/p)^{S_n}$ and one of
      conditions (b)/(c) is expected within the first thirty seconds.
    pitfalls: >
      Invoking $\mathbb{E}[S_T]=\mathbb{E}[S_0]$ without verifying a
      condition first — boundedness is not automatic without the two-barrier
      setup. Using $S_n$ as the martingale in the biased case — it isn't one
      there; only the recentered or geometric version is.
    recap: >
      Both ruin formulas — $1-k/N$ fair,
      $\dfrac{1-(q/p)^{k}}{1-(q/p)^{N}}$ biased — drop out of optional
      stopping applied to $S_n$ and $(q/p)^{S_n}$, using that the two-barrier
      walk keeps both bounded.
    steps:
      - teach: >
          Two-barrier absorbing walk: a walker at $k$ between $0$ and $N$,
          stopped at $T$. Checking a condition comes first: any run of $N$
          up-moves ends the game, giving $\mathbb{E}[T]<\infty$, and $0\le
          S_{T\wedge n}\le N$ gives both (b) and (c) at once.
      - teach: >
          In the fair case, $S_n$ itself is the zoo's martingale, so optional
          stopping gives $k=\mathbb{E}[S_T]=N\Pr(\text{hit }N)$ directly — one
          substitution and the ruin probability drops out.
      - ask: >
          Fair walk from $k=7$, absorbed at $0$ or $N=20$. What is
          $\Pr(\text{hit } 20)$?
        expects: "7/20"
        tolerance: 0.0005
        hint: >
          Apply $\Pr(\text{hit }N)=k/N$ directly.
        feedback: >
          $k=\mathbb{E}[S_T]=N\Pr(\text{hit }N)$ gives $\Pr(\text{hit
          }20)=7/20=0.35$.
      - teach: >
          The biased case swaps in the geometric martingale $(q/p)^{S_n}$,
          automatically bounded on $[0,N]$. Optional stopping gives one linear
          equation, $(q/p)^{k}=u(q/p)^{N}+(1-u)$, solved for $u=\Pr(\text{hit
          }N)$.
      - ask: >
          In the biased case ($p\ne1/2$), which process is the correct
          martingale to stop for the hitting probability?
        choices:
          - text: >
              $S_n$
            feedback: >
              $S_n$ is a martingale only when $p=1/2$; a biased walk gives it
              nonzero drift.
          - text: >
              $(q/p)^{S_n}$
            correct: true
            feedback: >
              Bounded on $[0,N]$ and a genuine martingale for any $p$ — exactly
              what optional stopping needs here.
          - text: >
              $S_n^{2}-n$
            feedback: >
              That is the tool for the expected exit TIME, not the exit
              probability — it answers a different question.
        feedback: >
          The biased case needs the geometric martingale; $S_n$ has already
          failed to be a martingale the moment $p\ne1/2$.
      - ask: >
          Biased walk, $k=2$, $N=4$, $p=0.3$ so $q/p=7/3$. What is
          $\Pr(\text{hit } 4)$?
        expects: "9/58"
        tolerance: 0.0005
        hint: >
          Substitute $q/p=7/3$ into $u=\dfrac{1-(q/p)^{k}}{1-(q/p)^{N}}$ and
          simplify.
        feedback: >
          $u=\dfrac{1-(7/3)^{2}}{1-(7/3)^{4}}=\dfrac{1-49/9}{1-2401/81}=\dfrac{-40/9}{-2320/81}=9/58\approx0.1552$
          — just over a $15\%$ chance despite starting past the midpoint, the
          bias against the walker dominates.
      - teach: >
          Invoking $\mathbb{E}[S_T]=\mathbb{E}[S_0]$ without first checking a
          condition is the trap — boundedness is not automatic without the
          two-barrier setup, and $S_n$ is simply the wrong martingale once
          $p\ne1/2$.
      - teach: >
          Both ruin formulas drop out of optional stopping applied to $S_n$ and
          $(q/p)^{S_n}$, using that the two-barrier walk keeps both bounded.


  - node: quant-processes.martingales.hitting-time-quadratic
    hook: >
      Once the ruin derivation gives the exit probability, this is the
      one-line trick for the exit time: stop the compensated square instead
      of the level.
    explanation: >
      The setup is identical to the ruin derivation — same two barriers,
      same walker starting at $k$ — but the target is $\mathbb{E}[T]$ rather
      than a probability, so the level martingale $S_n$ (whose optional
      stopping identity already used up $S_T$'s information) is swapped for
      the compensated square $S_n^{2}-n$, built precisely to convert time
      into something optional stopping can extract.

      The same condition (c) applies for the same reason as before:
      increments of $S_n^{2}-n$ are bounded by $2N$ while the walk stays
      trapped in $[0,N]$, and $\mathbb{E}[T]<\infty$ is already established.
      Optional stopping gives $\mathbb{E}[S_T^{2}]-\mathbb{E}[T]=k^{2}$
      directly from $S_0^{2}-0=k^{2}$.

      The exit position $S_T$ is already known — $N$ with probability $k/N$,
      $0$ otherwise — so $\mathbb{E}[S_T^{2}]=N^{2}\cdot(k/N)=kN$, and
      rearranging gives $\mathbb{E}[T]=kN-k^{2}=k(N-k)$: the already-computed
      exit position feeds straight back in. Sending $N\to\infty$ in the fair
      case shows the walk reaches $0$ eventually with certainty, yet the
      expected time to do so is infinite — a hitting probability of $1$ says
      nothing about the mean waiting time.
    worked: >
      Start at $k=20$ between barriers $0$ and $N=30$: $\mathbb{E}[T]=
      20(30-20)=200$ tosses expected — smaller than the maximum possible
      duration $N^{2}/4=225$, attained at the midpoint $k=15$.
    interview: >
      "How long does gambler's ruin take, on average?" wants $k(N-k)$
      produced by stopping $S_n^{2}-n$, contrasted explicitly with the
      hitting-probability computation to show which martingale answers which
      question.
    pitfalls: >
      Reusing $S_n$ to try to extract an expected time — it was already
      spent on the hitting probability and carries no time information; only
      the compensated square does. Treating infinite expected time for the
      unbounded walk as a contradiction with certain absorption — it isn't;
      the two facts coexist.
    recap: >
      Stopping $S_n^{2}-n$ instead of $S_n$ converts the already-known exit
      position into the exit time, giving $\mathbb{E}[T]=k(N-k)$ in one line.
    steps:
      - teach: >
          Same two barriers, same walker starting at $k$, but now the target is
          $\mathbb{E}[T]$ rather than a probability, so $S_n$ (already spent on
          the exit probability) is swapped for the compensated square
          $S_n^{2}-n$.
      - teach: >
          The same condition (c) applies: increments of $S_n^{2}-n$ are bounded
          by $2N$ while trapped in $[0,N]$, and $\mathbb{E}[T]<\infty$ is
          already established. Optional stopping gives
          $\mathbb{E}[S_T^{2}]-\mathbb{E}[T]=k^{2}$.
      - ask: >
          Fair walk, $k=6$, absorbed at $0$ or $N=10$. What is
          $\mathbb{E}[S_T^{2}]$?
        expects: "60"
        hint: >
          Use the exit-position distribution $S_T\in\{0,N\}$ from the ruin
          derivation.
        feedback: >
          $S_T$ is $10$ with probability $6/10=0.6$ and $0$ otherwise (the fair
          ruin probability), so $\mathbb{E}[S_T^{2}]=10^{2}(0.6)=60$.
      - teach: >
          The exit position was already known from the ruin derivation and
          feeds straight back in: $\mathbb{E}[S_T^{2}]=N^{2}\cdot(k/N)=kN$, so
          the already-computed probability supplies everything needed.
      - ask: >
          Using the same instance ($k=6,N=10$), what does optional stopping
          give for $\mathbb{E}[T]$?
        expects: "24"
        hint: >
          Rearrange $\mathbb{E}[S_T^{2}]-\mathbb{E}[T]=k^{2}$ using
          $\mathbb{E}[S_T^{2}]=60$ from the previous card.
        feedback: >
          $\mathbb{E}[S_T^{2}]-\mathbb{E}[T]=k^{2}=36$, so
          $\mathbb{E}[T]=60-36=24$, matching $k(N-k)=6(4)=24$ directly.
      - ask: >
          Sending $N\to\infty$ in the fair case shows the walk reaches $0$
          eventually with probability $1$. What happens to $\mathbb{E}[T]$?
        choices:
          - text: >
              $\mathbb{E}[T]\to0$
            feedback: >
              No — the walk takes LONGER on average as the far barrier recedes,
              not shorter.
          - text: >
              $\mathbb{E}[T]$ stays finite, equal to $k$.
            feedback: >
              No closed finite limit like this holds; $k(N-k)\to\infty$ as
              $N\to\infty$ with $k$ fixed.
          - text: >
              $\mathbb{E}[T]\to\infty$
            correct: true
            feedback: >
              $k(N-k)\to\infty$ as $N\to\infty$: certain eventual absorption
              coexists with an infinite expected wait — the two facts do not
              contradict each other.
        feedback: >
          A hitting probability of $1$ says nothing about the mean hitting
          time; here they diverge sharply as the far barrier is pushed to
          infinity.
      - teach: >
          Reusing $S_n$ to try to extract an expected time is the recurring
          mistake — it was already spent on the hitting probability and carries
          no time information; only the compensated square does.
      - teach: >
          Stopping $S_n^{2}-n$ instead of $S_n$ converts the already-known exit
          position into the exit time, giving $\mathbb{E}[T]=k(N-k)$ in one
          line.


  - node: quant-processes.martingales.wald
    hook: >
      Wald's identity answers "how much do I expect to have accumulated by
      the time I decide to stop" — a shockingly common shape in problems
      about random sums and sequential stopping rules.
    explanation: >
      The cleanest proof of $\mathbb{E}[S_N]=\mu\,\mathbb{E}[N]$ avoids side
      conditions altogether: write
      $S_N=\sum_{i\ge1}X_i\mathbf{1}\{N\ge i\}$, and note
      $\{N\ge i\}=\{N\le i-1\}^{c}$ is decided by $X_1,\dots,X_{i-1}$ alone —
      the defining property of a stopping time — so it's independent of
      $X_i$ itself.

      That independence lets the sum's expectation split term by term:
      $\mathbb{E}[S_N]=\sum_i\mathbb{E}[X_i]\Pr(N\ge i)=
      \mu\sum_i\Pr(N\ge i)=\mu\,\mathbb{E}[N]$, using the standard tail-sum
      identity for expectation.

      That independence — $N$ may look backward at $X_1,\dots,X_{i-1}$ but
      never forward at $X_i$ — is the entire hypothesis, and it's exactly the
      stopping-time condition restated. A stopping rule chosen with
      foresight (knowing $X_i$ before deciding whether $N\ge i$) breaks the
      identity outright.
    worked: >
      Roll a fair six-sided die until the first $6$: $N$ is geometric with
      $\mathbb{E}[N]=6$, and $\mu=3.5$ is the mean of one roll. Wald gives
      $\mathbb{E}[S_N]=3.5\times6=21$. Directly: on average $5$ non-six rolls
      (each averaging $3$ among $\{1,\dots,5\}$) plus the final $6$ give
      $5(3)+6=21$, matching exactly.
    interview: >
      "What's the expected total of a randomly stopped sum?" is Wald's
      identity by name; interviewers listen for the independence hypothesis
      stated — the stopping rule can't look ahead — not just the formula
      recited.
    pitfalls: >
      Applying Wald's identity when $N$ depends on future increments (e.g.
      "stop after the sum first exceeds its own eventual maximum") — the
      needed independence is silently false there. Using the wrong $\mu$ —
      it's the increment mean, not a mean conditional on stopping.
    recap: >
      $\mathbb{E}[S_N]=\mu\,\mathbb{E}[N]$ because $\{N\ge i\}$ depends only
      on $X_1,\dots,X_{i-1}$ and is therefore independent of $X_i$ — a
      stopping rule that never looks ahead is the whole hypothesis.
    steps:
      - teach: >
          Wald's identity answers how much accumulates by the time you decide
          to stop — a shockingly common shape in problems about random sums and
          sequential stopping rules.
      - teach: >
          The proof avoids side conditions: write
          $S_N=\sum_{i\ge1}X_i\mathbf{1}\{N\ge i\}$, and note $\{N\ge
          i\}=\{N\le i-1\}^{c}$ is decided by $X_1,\dots,X_{i-1}$ alone, hence
          independent of $X_i$ itself.
      - ask: >
          Roll a fair $4$-sided die until the first $4$ appears. What is
          $\mathbb{E}[S_N]$, the expected total of all the rolls?
        expects: "10"
        hint: >
          Find $\mathbb{E}[N]$ from the geometric probability of rolling a $4$,
          and $\mu$ from the die's mean.
        feedback: >
          $N$ is geometric with $\mathbb{E}[N]=4$; $\mu=2.5$ is the mean of one
          roll. Wald gives $\mathbb{E}[S_N]=2.5\times4=10$ — directly, on
          average $3$ non-four rolls (averaging $2$ among $\{1,2,3\}$) plus the
          final $4$ give $3(2)+4=10$.
      - teach: >
          That independence — $N$ may look backward, never forward — is the
          entire hypothesis, restated exactly as the stopping-time condition. A
          stopping rule chosen with foresight breaks the identity outright.
      - ask: >
          Which stopping rule $N$ breaks Wald's identity?
        choices:
          - text: >
              $N=$ first time the die shows a value $\ge3$.
            feedback: >
              A genuine stopping time, decided by watching — Wald applies fine.
          - text: >
              $N=$ the roll number at which the running sum first exceeds its
              own eventual final value.
            correct: true
            feedback: >
              This needs already knowing the future final value — not a valid
              stopping time at all, so Wald does not apply, nor does the very
              definition of a stopping time.
          - text: >
              $N=$ a fixed number of rolls, say $10$, regardless of outcome.
            feedback: >
              A deterministic time is a trivial, valid stopping time; Wald
              reduces to ordinary linearity of expectation here.
        feedback: >
          Wald's identity needs only that $\{N\ge i\}$ is decided by
          $X_1,\dots,X_{i-1}$ — a rule that needs the future is not a stopping
          time and breaks the identity outright.
      - ask: >
          Flip a fair coin until the first heads, and let every flip contribute
          $1$ to the sum ($X_i=1$ always, so $S_N=N$). $\mathbb{E}[N]=2$. What
          is $\mathbb{E}[S_N]$?
        expects: "2"
        hint: >
          What is $\mu$ when every $X_i$ equals $1$?
        feedback: >
          Here $\mu=\mathbb{E}[X_i]=1$, so Wald's identity collapses to
          $\mathbb{E}[S_N]=\mu\mathbb{E}[N]=1\times2=2$ — a useful sanity check
          of the formula in this trivial case.
      - teach: >
          Using the wrong $\mu$ — a mean conditional on stopping, rather than
          the plain unconditional increment mean — is the quiet way this
          identity gets misapplied.
      - teach: >
          $\mathbb{E}[S_N]=\mu\,\mathbb{E}[N]$ because $\{N\ge i\}$ depends
          only on $X_1,\dots,X_{i-1}$ and is therefore independent of $X_i$ — a
          stopping rule that never looks ahead is the whole hypothesis.


  - node: quant-processes.martingales.wald-second
    hook: >
      The natural next question after Wald's mean identity is variance —
      and the honest answer is that the second-moment identity is easy while
      the actual variance of a stopped sum usually is not.
    explanation: >
      Wald's second identity is the compensated-square idea applied with a
      stopping time instead of a fixed time: $(S_n-n\mu)^{2}-n\sigma^{2}$ is
      a martingale (the general iid version of $S_n^{2}-n$), and stopping it
      at $N$ with $\mathbb{E}[N]<\infty$ gives
      $\mathbb{E}[(S_N-N\mu)^{2}]=\sigma^{2}\mathbb{E}[N]$ directly.

      When $\mu=0$ this reads $\mathbb{E}[S_N^{2}]=\sigma^{2}\mathbb{E}[N]$,
      the general form of exactly the computation already used for the fair
      walk's expected duration, restated for any mean-zero iid summands, not
      just $\pm1$ steps.

      What it is not: $\operatorname{Var}(S_N)$. The variance of a randomly
      stopped sum is
      $\operatorname{Var}(S_N)=\sigma^{2}\mathbb{E}[N]+\mu^{2}
      \operatorname{Var}(N)$, and that formula needs $N$ independent of the
      increment sequence — a strictly stronger hypothesis than "$N$ is a
      stopping time." For a walk stopped at a barrier, $N$ and the increments
      are as dependent as two quantities can be, so the random-sums variance
      formula is simply false there, while Wald's second identity — built
      for exactly this dependence — still holds.
    worked: >
      Fair $\pm1$ walk, $\mu=0$, $\sigma^{2}=1$, stopped at $T$ = first exit
      from $[0,10]$ starting at $k=4$: Wald's second identity gives
      $\mathbb{E}[S_T^{2}]=\mathbb{E}[T]$. From the duration formula,
      $\mathbb{E}[T]=k(N-k)=4(10-4)=24$, so $\mathbb{E}[S_T^{2}]=24$ as well
      — the same number read two ways.
    interview: >
      "Is $\mathbb{E}[(S_N-N\mu)^{2}]$ the same as $\operatorname{Var}(S_N)$?"
      is asked precisely to catch this conflation; the correct answer
      distinguishes them and names the independence hypothesis the variance
      formula needs that Wald's identity does not.
    pitfalls: >
      Quoting $\operatorname{Var}(S_N)=\sigma^{2}\mathbb{E}[N]$ for a
      stopping time dependent on the increments — that formula needs $N$
      independent of the sequence, which fails for essentially every
      barrier-hitting stopping time. Forgetting $\mu=0$ must hold literally,
      not just approximately.
    recap: >
      $\mathbb{E}[(S_N-N\mu)^{2}]=\sigma^{2}\mathbb{E}[N]$ holds for any
      stopping time with $\mathbb{E}[N]<\infty$, but it is not
      $\operatorname{Var}(S_N)$, which needs the strictly stronger hypothesis
      that $N$ is independent of the increments.
    steps:
      - teach: >
          The natural follow-up to Wald's mean identity is variance — and the
          honest answer is that the second-moment identity is easy while the
          actual variance of a stopped sum usually is not.
      - teach: >
          $(S_n-n\mu)^{2}-n\sigma^{2}$ is a martingale, the general iid version
          of $S_n^{2}-n$; stopping it at $N$ with $\mathbb{E}[N]<\infty$ gives
          $\mathbb{E}[(S_N-N\mu)^{2}]=\sigma^{2}\mathbb{E}[N]$ directly.
      - ask: >
          Fair $\pm1$ walk ($\mu=0,\sigma^{2}=1$), $T=$ first exit from
          $[0,15]$ starting at $k=5$. Using $\mathbb{E}[T]=k(N-k)=50$, what
          does Wald's second identity give for $\mathbb{E}[S_T^{2}]$ (the net
          displacement from start, squared)?
        expects: "50"
        hint: >
          With $\mu=0$ the identity simplifies to
          $\mathbb{E}[S_T^{2}]=\sigma^{2}\mathbb{E}[T]$.
        feedback: >
          With $\mu=0$, the identity reads
          $\mathbb{E}[S_T^{2}]=\sigma^{2}\mathbb{E}[T]=1\times50=50$ — the same
          number Wald's second identity and the duration formula both hand you.
      - teach: >
          What it is NOT:
          $\operatorname{Var}(S_N)=\sigma^{2}\mathbb{E}[N]+\mu^{2}\operatorname{Var}(N)$
          needs $N$ independent of the increment sequence, a strictly stronger
          hypothesis than being a stopping time — false for essentially every
          barrier-hitting time.
      - ask: >
          For a fair $\pm1$ walk stopped at a barrier (so $T$ depends heavily
          on the increments), which formula correctly gives
          $\operatorname{Var}(S_T)$?
        choices:
          - text: >
              $\sigma^{2}\mathbb{E}[T]$
            feedback: >
              That is $\mathbb{E}[S_T^{2}]$ when $\mu=0$ (Wald's second
              identity), not the variance — using it as the variance would
              additionally need $T$ independent of the increments, which fails
              here.
          - text: >
              $\sigma^{2}\mathbb{E}[T]+\mu^{2}\operatorname{Var}(T)$
            feedback: >
              The general random-sums variance formula, but it also needs $T$
              independent of the increments — still invalid for a
              barrier-hitting time.
          - text: >
              Neither of these applies directly.
            correct: true
            feedback: >
              The random-sums variance formula needs $T$ independent of the
              sequence, about as false as possible for a barrier-hitting time;
              Wald's second identity is the one guaranteed identity here, and
              it is not the variance.
        feedback: >
          Wald's second identity survives exactly this kind of dependence; the
          ordinary random-sums variance formula does not.
      - ask: >
          General iid increments with $\mu=0.5$, $\sigma^{2}=2$, stopped at $N$
          with $\mathbb{E}[N]=10$. What is $\mathbb{E}[(S_N-N\mu)^{2}]$?
        expects: "20"
        hint: >
          Apply $\sigma^{2}\mathbb{E}[N]$ directly; $\mu$ does not enter this
          identity's right-hand side.
        feedback: >
          Directly from the identity, regardless of $\mu$:
          $\mathbb{E}[(S_N-N\mu)^{2}]=\sigma^{2}\mathbb{E}[N]=2(10)=20$ — no
          need to separately track $\mathbb{E}[N]$ and $\operatorname{Var}(N)$
          the way the (wrong) variance formula would.
      - teach: >
          Forgetting $\mu=0$ must hold literally, not just approximately, is
          the trap for the simplified
          $\mathbb{E}[S_N^{2}]=\sigma^{2}\mathbb{E}[N]$ form — otherwise the
          $N\mu$ term inside the square cannot be dropped.
      - teach: >
          $\mathbb{E}[(S_N-N\mu)^{2}]=\sigma^{2}\mathbb{E}[N]$ holds for any
          stopping time with $\mathbb{E}[N]<\infty$, but it is not
          $\operatorname{Var}(S_N)$, which needs the strictly stronger
          hypothesis that $N$ is independent of the increments.


  - node: quant-processes.martingales.abracadabra
    hook: >
      This is the single most famous martingale interview problem — a team
      of gamblers betting on future letters converts a hopeless
      combinatorial waiting-time question into three lines of optional
      stopping.
    explanation: >
      The trick is a fair casino rather than direct analysis. Just before
      second $n$, a brand-new gambler stakes $1$ unit on letter $n$ being A
      at fair odds $26$-to-$1$; if correct, the entire $26$ units parlay onto
      the next letter being B, and so on — each gambler's wealth is a fair
      game (bet-then-parlay at fair odds has expectation $1$ at every
      stage), and any gambler who loses drops to $0$ and stays there.

      Because each gambler's process is a martingale starting at $1$, the
      pooled wealth $W_n$ makes $M_n=W_n-n$ a martingale starting at $0$ — an
      instance of the level-martingale idea, just decorated with a casino
      story. At $T$ (the word first completes), optional stopping applies
      once checked: increments are bounded and $\mathbb{E}[T]<\infty$
      (disjoint $11$-letter blocks each complete the word independently with
      probability $26^{-11}$), licensing $\mathbb{E}[W_T-T]=0$.

      What survives at $T$ is exactly the gamblers whose bets are still
      "live" — those started at a position matching a self-overlap of the
      word with its own prefix. ABRACADABRA overlaps itself at the full
      word, the final "ABRA," and the final "A," so survivors hold
      $26^{11}+26^{4}+26$ units, and $\mathbb{E}[T]$ is exactly that sum.
    worked: >
      Apply the same casino to the shorter word "AA." It overlaps itself at
      $j=2$ (the whole word) and $j=1$ (the final A matches the initial A),
      so survivors hold $26^{2}+26=676+26=702$ units, giving
      $\mathbb{E}[T]=702$ — a self-overlapping doublet, checked the same way.
    interview: >
      "How long until this pattern first appears?" is the canonical prompt;
      naming the casino-of-gamblers construction within the first minute is
      the expected move. Interviewers listen for correctly identifying which
      self-overlaps survive.
    pitfalls: >
      Forgetting a self-overlap — every prefix equal to a suffix of the same
      length contributes a surviving gambler, and missing one undercounts
      $\mathbb{E}[T]$. Assuming $\mathbb{E}[T]<\infty$ needs no
      justification — it's earned by the disjoint-block argument, not free.
    recap: >
      A team of fair gamblers, each parlaying winnings onto the next
      required letter, turns the expected typing time for a pattern into the
      sum of $26^{j}$ over its self-overlaps.
    steps:
      - teach: >
          The trick is a fair casino rather than direct analysis. Just before
          second $n$, a brand-new gambler stakes $1$ unit on letter $n$ at fair
          odds $26$-to-$1$; if correct, the whole stack parlays onto the next
          required letter, and so on.
      - teach: >
          Each gambler's wealth is itself a fair game, so the pooled wealth
          $W_n$ makes $M_n=W_n-n$ a martingale starting at $0$. At $T$, once
          checked via bounded increments and $\mathbb{E}[T]<\infty$, optional
          stopping licenses $\mathbb{E}[W_T-T]=0$.
      - ask: >
          Apply the same casino to the word "AB": no letter overlaps the start
          (prefix "A" does not equal suffix "B"), so only the full word
          survives. What is $\mathbb{E}[T]$?
        expects: "676"
        hint: >
          With no self-overlap, only the $j=\ell$ (full-word) term contributes.
        feedback: >
          With no self-overlap besides the trivial full word ($j=2$), the
          survivors hold exactly $26^{2}=676$ units, so $\mathbb{E}[T]=676$.
      - teach: >
          At $T$, the survivors are exactly the gamblers whose bets match a
          self-overlap of the word with its own prefix — one surviving stack
          per overlap length, plus the full word itself always.
      - ask: >
          Apply the casino to "CAC": the last letter ("C") matches the first
          letter, so there is a self-overlap at $j=1$ in addition to the full
          word at $j=3$; checking $j=2$, "CA" versus the suffix "AC" do not
          match. What is $\mathbb{E}[T]$?
        expects: "17602"
        hint: >
          Sum $26^{j}$ over every overlap length that survived: $j=1$ and
          $j=3$.
        feedback: >
          Survivors hold $26^{3}+26^{1}=17576+26=17602$ units, so
          $\mathbb{E}[T]=17602$.
      - ask: >
          Why is $M_n=W_n-n$ a martingale?
        choices:
          - text: >
              Because each gambler's individual wealth process is itself a
              martingale (bet-then-parlay at fair odds has conditional
              expectation equal to the current stake at every step).
            correct: true
            feedback: >
              Exactly right — pooled wealth is a sum of individually fair
              games, and subtracting the $1$ unit entering each second is
              exactly the compensator that removes the remaining drift.
          - text: >
              Because the alphabet has exactly $26$ letters.
            feedback: >
              The alphabet size does not affect the martingale property at all
              — it only changes the final formula's numbers.
          - text: >
              Because gamblers who lose immediately drop out.
            feedback: >
              Dropping to $0$ and staying there is consistent with a fair game,
              but it is the fair odds themselves that make it fair, not the
              dropping out.
        feedback: >
          A team of fair, self-financing bets pools into another fair game;
          subtracting the $1$ unit entering each second is exactly the
          compensator that makes $W_n-n$ driftless.
      - teach: >
          Forgetting a self-overlap undercounts $\mathbb{E}[T]$ — every prefix
          that equals a suffix of the same length contributes a surviving
          gambler, and missing one silently drops a term from the sum.
      - teach: >
          A team of fair gamblers, each parlaying winnings onto the next
          required letter, turns the expected typing time for a pattern into
          the sum of $26^{j}$ over its self-overlaps.


  - node: quant-processes.martingales.pattern-waiting
    hook: >
      This generalizes the ABRACADABRA casino into a formula you can apply
      to any pattern in seconds — no new construction, just counting
      self-overlaps.
    explanation: >
      The casino argument never actually used the alphabet size or word
      length specifically — only that letters are iid and a fair-odds parlay
      stays a martingale. Repeating it for a general target word $w$ of
      length $\ell$: survivors at $T$ are exactly the gamblers whose starting
      position matches a self-overlap of $w$, and each such gambler holds
      $1/\Pr(\text{the first }j\text{ letters of }w)$ units, the fair payout
      for correctly calling $j$ letters in a row.

      Summing over every self-overlap length $j$ (always including
      $j=\ell$, the whole word matching itself) gives
      $\mathbb{E}[T]=\sum_j 1/\Pr(\text{first }j\text{ letters of }w)$, one
      term per way the pattern restarts partway through itself.

      The fair-coin examples show self-overlap, not length, drives the
      answer. HH overlaps at $j=2$ and $j=1$ (the trailing H restarts
      progress), giving $4+2=6$; HT overlaps only at $j=2$, giving just $4$ —
      shorter to wait for despite the same length, because every near-miss
      on HT throws away all progress rather than partial progress. The
      single letter H recovers the geometric mean $2=1/p$, since a
      one-letter pattern trivially only overlaps itself.
    worked: >
      For the pattern THT: self-overlaps are $j=3$ (the whole word) and
      $j=1$ (the trailing T matches the leading T; checking $j=2$, "TH"
      versus the suffix "HT," these don't match). So
      $\mathbb{E}[T]=2^{3}+2^{1}=8+2=10$ tosses expected — less than HHH's
      $14$ despite the same length, because THT's only overlap is the
      shorter one.
    interview: >
      "Expected tosses to see [pattern]" wants the overlap-sum formula
      applied on sight. A frequent check compares two same-length patterns
      (HH vs HT) to confirm you understand why one takes longer, not just
      that you can compute both.
    pitfalls: >
      Checking the wrong alignment — $j$ ranges over lengths where the
      prefix equals the suffix, not the reverse. Forgetting to include
      $j=\ell$, the trivial full-word overlap, which every pattern includes.
    recap: >
      $\mathbb{E}[T]=\sum_j 1/\Pr(\text{first }j\text{ letters of }w)$ over
      the pattern's self-overlaps generalizes the ABRACADABRA casino to any
      target, and self-overlapping patterns always wait longer than
      non-overlapping ones of the same length.
    steps:
      - teach: >
          The casino argument never used the alphabet size or word length
          specifically — only that letters are iid and a fair-odds parlay stays
          a martingale. It repeats verbatim for any target word.
      - teach: >
          Summing over every self-overlap length $j$ (always including
          $j=\ell$) gives $\mathbb{E}[T]=\sum_j 1/\Pr(\text{first } j \text{
          letters})$, one term per way the pattern restarts partway through
          itself.
      - ask: >
          Fair coin, pattern "HTT": prefix "H" does not match suffix "T", and
          prefix "HT" does not match suffix "TT", so only the full word
          overlaps itself. What is $\mathbb{E}[T]$?
        expects: "8"
        hint: >
          No self-overlap means only the trivial $j=\ell$ term contributes.
        feedback: >
          With no self-overlap besides the full word ($j=3$),
          $\mathbb{E}[T]=2^{3}=8$.
      - teach: >
          Self-overlap, not length, drives the answer: a trailing partial match
          lets a near-miss retain progress instead of losing all of it, which
          is exactly why some patterns take longer than others of the same
          length.
      - ask: >
          Fair coin, pattern "THTH": the last two letters ("TH") match the
          first two, so there is a self-overlap at $j=2$ in addition to the
          full word at $j=4$; checking $j=1$, the last letter "H" does not
          match the first letter "T". What is $\mathbb{E}[T]$?
        expects: "20"
        hint: >
          Sum $2^{j}$ over every overlap length that survived: $j=2$ and $j=4$.
        feedback: >
          Summing over the surviving overlap lengths,
          $\mathbb{E}[T]=2^{4}+2^{2}=16+4=20$.
      - ask: >
          Compare the fair-coin patterns "TT" and "TH". Which takes longer to
          see on average, and why?
        choices:
          - text: >
              "TH" takes longer, because it is alphabetically later.
            feedback: >
              Alphabetical order has nothing to do with waiting times.
          - text: >
              "TT" takes longer, because it self-overlaps (a trailing T
              restarts progress toward another TT) while "TH" does not.
            correct: true
            feedback: >
              "TT" overlaps at $j=1$, giving $\mathbb{E}[T]=4+2=6$, while "TH"
              has no self-overlap beyond the full word, giving
              $\mathbb{E}[T]=4$ — the same asymmetry as HH versus HT, just
              relabeled.
          - text: >
              They take the same expected time, since both have length $2$.
            feedback: >
              Length alone does not determine the wait; self-overlap structure
              does, and TT and TH differ in exactly that structure.
        feedback: >
          Self-overlapping patterns always wait at least as long as
          non-overlapping patterns of the same length, because every near-miss
          throws away more progress.
      - teach: >
          The recurring slip is checking the wrong alignment — $j$ ranges over
          lengths where the prefix equals the suffix, not the reverse — and
          forgetting the trivial $j=\ell$ term every pattern includes.
      - teach: >
          $\mathbb{E}[T]=\sum_j 1/\Pr(\text{first } j \text{ letters})$ over
          the pattern's self-overlaps generalizes the ABRACADABRA casino to any
          target, and self-overlapping patterns always wait longer than
          non-overlapping ones of the same length.


  - node: quant-processes.martingales.martingale-betting-fallacy
    hook: >
      This is the standing counterexample every optional stopping condition
      earns its keep against — a genuine martingale, a genuine almost-sure
      win, yet $\mathbb{E}[X_T]\ne\mathbb{E}[X_0]$.
    explanation: >
      The doubling strategy — stake $1,2,4,\dots$ on fair even-money bets,
      quitting at the first win $T$ — genuinely produces $X_T=+1$ with
      $\Pr(T<\infty)=1$ and $\mathbb{E}[T]=2$: after $n$ straight losses the
      net is $-(2^{n}-1)$, and the next win of $2^{n}$ nets exactly
      $2^{n}-(2^{n}-1)=1$. So $\mathbb{E}[X_T]=1\ne0=X_0$, even though $X_n$
      is an honest martingale throughout.

      This is not a contradiction, because none of the three sufficient
      conditions hold: $T$ is unbounded, since $\Pr(T>N)=2^{-N}>0$ for every
      $N$, ruling out (a); the stopped process is unbounded below, reaching
      $-(2^{n}-1)$, ruling out (b); and while $\mathbb{E}[T]<\infty$ holds,
      the increments $2^{n-1}$ are themselves unbounded, ruling out (c) too.
      Every condition fails, so the theorem simply declines to apply — this
      is not a paradox.

      What restores the martingale property is a finite bankroll. With
      starting bankroll $2^{m}-1$, the strategy wins $1$ with probability
      $1-2^{-m}$ but loses the entire $2^{m}-1$ with probability $2^{-m}$:
      expectation exactly $(1-2^{-m})(1)+2^{-m}(-(2^{m}-1))=0$.
    worked: >
      With bankroll $2^{5}-1=31$: win $1$ unit with probability
      $1-2^{-5}=31/32$, lose $31$ units with probability $2^{-5}=1/32$.
      Expected outcome: $\frac{31}{32}(1)+\frac{1}{32}(-31)=
      \frac{31-31}{32}=0$, restoring the fair game the instant a finite
      bound is imposed.
    interview: >
      "Does doubling your bet after every loss guarantee a profit?" tests
      whether you can name which optional stopping condition fails, not
      just recite "no." Expect the follow-up: "what if you had infinite
      money and infinite time?" — the unrealizable regime where it works.
    pitfalls: >
      Answering "it fails because $\Pr(T<\infty)<1$" — wrong; $T$ is finite
      almost surely, the failure is entirely in boundedness. Concluding a
      finite bankroll alone fixes everything without noting it also forces a
      stop, restoring bounded increments and a bounded stopped process
      together.
    recap: >
      Doubling nets $+1$ with certainty only by needing unbounded losses for
      unboundedly long — all three optional stopping conditions fail at
      once, and any finite bankroll restores expectation exactly $0$.
    steps:
      - teach: >
          The doubling strategy — stake $1,2,4,\dots$, quitting at the first
          win $T$ — leaves net $-(2^{n}-1)$ after $n$ losses, and exactly $+1$
          at $T$, since the next win of $2^{n}$ nets $2^{n}-(2^{n}-1)=1$.
      - teach: >
          This genuinely gives $\Pr(T<\infty)=1$ and $\mathbb{E}[T]=2$, so
          $\mathbb{E}[X_T]=1\ne0=X_0$ even though $X_n$ is an honest martingale
          throughout — not a contradiction, since none of the three conditions
          hold.
      - ask: >
          For the doubling strategy without a bankroll limit, which optional
          stopping condition, if any, is satisfied?
        choices:
          - text: >
              (a) $T$ is bounded.
            feedback: >
              False; $\Pr(T>N)=2^{-N}>0$ for every $N$, so $T$ is unbounded.
          - text: >
              (b) The stopped process is bounded.
            feedback: >
              False; the stopped process is unbounded below, reaching
              $-(2^{n}-1)$ as losses accumulate.
          - text: >
              (c) $\mathbb{E}[T]<\infty$ and bounded increments.
            feedback: >
              $\mathbb{E}[T]=2<\infty$ holds, but the stakes $2^{n-1}$ are
              themselves unbounded, so this fails too.
          - text: >
              None of the three.
            correct: true
            feedback: >
              Every condition fails simultaneously — exactly why
              $\mathbb{E}[X_T]=1\ne0=X_0$ is not a contradiction; the theorem
              simply never applies here.
        feedback: >
          All three sufficient conditions fail at once; the doubling strategy
          is the standing counterexample proving they are not just fine print.
      - teach: >
          What restores fairness is a finite bankroll: with starting bankroll
          $2^{m}-1$, the strategy forces a stop, restoring bounded increments
          and a bounded stopped process together.
      - ask: >
          With bankroll $2^{4}-1=15$, what is the probability of losing the
          entire bankroll (four straight losses before a win)?
        expects: "1/16"
        tolerance: 0.0005
        hint: >
          Four straight losses, each independently with probability $1/2$.
        feedback: >
          Losing all four rounds needs four straight losses, each with
          probability $1/2$, so $\Pr=(1/2)^{4}=1/16=0.0625$.
      - ask: >
          With the same bankroll $15$, what is the expected net outcome of the
          strategy?
        expects: "0"
        hint: >
          Weight the $+1$ win outcome and the $-15$ ruin outcome by their
          probabilities and add.
        feedback: >
          Win $1$ unit with probability $15/16$, lose all $15$ units with
          probability $1/16$:
          $\frac{15}{16}(1)+\frac{1}{16}(-15)=\frac{15-15}{16}=0$ — fairness
          restored exactly once a finite bound is imposed.
      - teach: >
          Answering "it fails because $\Pr(T<\infty)<1$" is wrong — $T$ is
          finite almost surely; the failure is entirely about boundedness, not
          about whether the game ever ends.
      - teach: >
          Doubling nets $+1$ with certainty only by needing unbounded losses
          for unboundedly long — all three optional stopping conditions fail at
          once, and any finite bankroll restores expectation exactly $0$.


  - node: quant-processes.martingales.maximal-inequality
    hook: >
      This is Markov's inequality upgraded from a single time point to an
      entire path, delivering ruin-type bounds instantly with none of the
      barrier algebra the exact formulas need.
    explanation: >
      Fix $a>0$ and let $T$ be the first time the nonnegative supermartingale
      $X_n$ reaches $a$ — a genuine stopping time by construction. Stopping
      at $T\wedge n$ and using the free finite-horizon fact gives
      $\mathbb{E}[X_0]\ge\mathbb{E}[X_{T\wedge n}]$.

      Split that expectation over whether $T$ has occurred by time $n$: on
      $\{T\le n\}$, $X_{T\wedge n}=X_T\ge a$ by construction, and on the
      complement $X_{T\wedge n}\ge0$ by nonnegativity, so
      $\mathbb{E}[X_{T\wedge n}]\ge a\Pr(T\le n)$. Combining and letting
      $n\to\infty$ turns $\Pr(T\le n)$ into $\Pr(\sup_k X_k\ge a)$.

      This is genuinely Markov's inequality — $\Pr(X\ge a)\le
      \mathbb{E}[X]/a$ for nonnegative $X$ — applied to the entire
      trajectory's running supremum, at no extra cost beyond what stopping
      already earns free. The mirror statement for a nonnegative
      submartingale bounds the running maximum up to a fixed $n$ by
      $\mathbb{E}[X_n]/a$ instead, since a submartingale's mean is only
      controlled at its endpoint, not its start.
    worked: >
      A fair gambler starts with $k=15$ and stops at $0$: the stopped
      process is a nonnegative supermartingale, so
      $\Pr(\sup_n X_n\ge40)\le15/40=0.375$ — a ruin-avoidance bound obtained
      with no barrier at $40$ ever set up, unlike the exact two-barrier
      computation.
    interview: >
      "Bound the probability the process ever exceeds this level" wants
      Doob's maximal inequality named and applied directly — a fast answer
      where the exact ruin machinery would be overkill or the upper barrier
      isn't fixed in advance.
    pitfalls: >
      Applying the inequality to a process that isn't nonnegative — the
      split specifically used $X_{T\wedge n}\ge0$ on the untouched part.
      Using $\mathbb{E}[X_0]$ for the submartingale mirror version — that
      needs $\mathbb{E}[X_n]$, the mean at the horizon.
    recap: >
      A nonnegative supermartingale exceeds any level $a$ at some point with
      probability at most $\mathbb{E}[X_0]/a$ — Markov's inequality applied
      to the whole path via stopping, at no extra cost.
    steps:
      - teach: >
          Markov's inequality upgraded from one time point to an entire path:
          fix $a>0$ and let $T$ be the first time a nonnegative supermartingale
          $X_n$ reaches $a$ — a genuine stopping time by construction.
      - teach: >
          Splitting $\mathbb{E}[X_{T\wedge n}]$ over $\{T\le n\}$ (where
          $X_{T\wedge n}=X_T\ge a$) and $\{T>n\}$ (where $X_{T\wedge n}\ge0$ by
          nonnegativity) gives $\mathbb{E}[X_0]\ge a\Pr(T\le n)$; let
          $n\to\infty$.
      - ask: >
          A fair gambler starts with $k=10$ and stops at $0$. Using the maximal
          inequality, what is the upper bound on $\Pr(\sup_n X_n\ge25)$?
        expects: "2/5"
        tolerance: 0.0005
        hint: >
          Apply $\Pr(\sup_n X_n\ge a)\le\mathbb{E}[X_0]/a$ directly.
        feedback: >
          $\mathbb{E}[X_0]=10$, so $\Pr(\sup_n X_n\ge25)\le10/25=2/5=0.4$
          directly, with no barrier at $25$ ever set up.
      - teach: >
          Doob's submartingale mirror bounds the running maximum up to a fixed
          $n$ instead: $\Pr(\max_{k\le n}X_k\ge a)\le\mathbb{E}[X_n]/a$, since
          a submartingale's mean is only controlled at its endpoint, not its
          start.
      - ask: >
          A nonnegative submartingale has $\mathbb{E}[X_{20}]=8$. What does
          Doob's inequality give for $\Pr(\max_{k\le20}X_k\ge32)$?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          Use $\mathbb{E}[X_n]/a$ with $n=20$, not $\mathbb{E}[X_0]$.
        feedback: >
          The submartingale mirror uses the mean at the horizon,
          $\mathbb{E}[X_{20}]=8$: $\Pr(\max_{k\le20}X_k\ge32)\le8/32=1/4=0.25$.
      - ask: >
          The proof splits $\mathbb{E}[X_{T\wedge n}]$ using $X_{T\wedge
          n}\ge0$ on $\{T>n\}$. What breaks if $X_n$ is allowed to go negative?
        choices:
          - text: >
              Nothing; the inequality still holds.
            feedback: >
              It specifically needs $X_{T\wedge n}\ge0$ on $\{T>n\}$ to
              lower-bound that term by $0$ — without nonnegativity that step is
              invalid.
          - text: >
              The bound $\mathbb{E}[X_{T\wedge n}]\ge a\Pr(T\le n)$ no longer
              follows.
            correct: true
            feedback: >
              Dropping the $\{T>n\}$ contribution to $0$ relies on
              nonnegativity; a process that can go negative could make that
              discarded piece negative, breaking the inequality.
          - text: >
              Only the submartingale mirror version breaks, not the
              supermartingale one.
            feedback: >
              Both versions need nonnegativity for the identical reason — it is
              used the same way in each proof.
        feedback: >
          Nonnegativity is load-bearing exactly at the step discarding the
          $\{T>n\}$ contribution; without it, the inequality has no proof.
      - teach: >
          Applying the inequality to a process that is not nonnegative, or
          reaching for $\mathbb{E}[X_0]$ in the submartingale mirror (which
          needs $\mathbb{E}[X_n]$ instead), are the two ways this gets misused.
      - teach: >
          A nonnegative supermartingale exceeds any level $a$ at some point
          with probability at most $\mathbb{E}[X_0]/a$ — Markov's inequality
          applied to the whole path via stopping, at no extra cost.


  - node: quant-processes.martingales.convergence-theorem
    hook: >
      This theorem guarantees a game that stays bounded in expectation must
      eventually settle down — but "settles down" and "settles down to the
      right mean" are two different claims, and only one is free.
    explanation: >
      The hypothesis $\sup_n\mathbb{E}|X_n|<\infty$ says the process doesn't
      wander to infinite expected size, and the conclusion is almost-sure
      convergence to a finite limit $X_\infty$ — a deep fact, stated here to
      be used, not proved.

      Two specializations are worth memorizing directly. Every nonnegative
      supermartingale converges almost surely with no further hypothesis,
      since nonnegativity alone bounds
      $\mathbb{E}|X_n|=\mathbb{E}[X_n]\le\mathbb{E}[X_0]$. And a uniformly
      bounded martingale converges almost surely and in $L^{1}$, and in that
      case the limit's mean matches the start:
      $\mathbb{E}[X_\infty]=\mathbb{E}[X_0]$ — $L^{1}$ convergence is exactly
      what licenses passing the limit through the expectation.

      The attached warning is the one optional stopping already carries:
      almost sure convergence alone says nothing about the limit's mean
      unless a stronger mode — $L^{1}$, guaranteed only in the bounded case
      — is available. Polya's urn shows the limit can be genuinely
      informative: starting from one ball of each colour and adding a copy
      of whatever's drawn, the red fraction is confined to $[0,1]$ and hence
      a bounded martingale, so convergence is guaranteed — what boundedness
      alone does not reveal is that this particular limit is uniform on
      $(0,1)$, which needs the urn's own exchangeability structure.
    worked: >
      A fair gambler's fortune $S_{T\wedge n}$, stopped at the first exit
      from $\{0,\dots,10\}$ starting at $k=4$, is a bounded martingale
      ($0\le S_{T\wedge n}\le10$), so it converges almost surely — here
      visibly to $S_T$, which is $0$ or $10$ with probabilities $0.6$ and
      $0.4$, giving $\mathbb{E}[S_\infty]=10(0.4)=4$, matching $k=4$ exactly
      as $L^{1}$ convergence guarantees.
    interview: >
      "Does this bounded martingale converge, and to what?" wants the two
      specializations named directly, and Polya's urn cited as evidence the
      theorem does real work, not just guarantees existence.
    pitfalls: >
      Assuming almost sure convergence alone preserves
      $\mathbb{E}[X_\infty]=\mathbb{E}[X_0]$ — it doesn't without
      boundedness or another route to $L^{1}$ convergence; the same trap as
      optional stopping's unbounded-time failure. Treating "converges almost
      surely" as meaning the limit is deterministic — in Polya's urn the
      limit is itself random, uniform on $(0,1)$.
    recap: >
      A process bounded in $\mathbb{E}|X_n|$ converges almost surely to a
      finite limit, and only in the uniformly bounded case does that limit's
      mean match the process's starting mean.
    steps:
      - teach: >
          The hypothesis $\sup_n\mathbb{E}|X_n|<\infty$ says the process does
          not wander to infinite expected size, and the conclusion is
          almost-sure convergence to a finite limit $X_\infty$.
      - teach: >
          Two specializations are worth memorizing directly: every nonnegative
          supermartingale converges almost surely with no further hypothesis,
          and a uniformly bounded martingale converges almost surely and in
          $L^{1}$, so $\mathbb{E}[X_\infty]=\mathbb{E}[X_0]$.
      - ask: >
          A fair gambler's fortune $S_{T\wedge n}$, stopped at first exit from
          $\{0,\dots,15\}$ starting at $k=6$, is a bounded martingale, so it
          converges almost surely to $S_T$. What is $\mathbb{E}[S_\infty]$?
        expects: "6"
        hint: >
          Use the fair ruin probability $k/N$ for the exit level, then take its
          mean.
        feedback: >
          $\Pr(\text{hit }15)=6/15=0.4$ (fair ruin), so
          $\mathbb{E}[S_\infty]=\mathbb{E}[S_T]=15(0.4)+0(0.6)=6$, matching
          $k=6$ exactly, as $L^{1}$ convergence guarantees.
      - teach: >
          The warning: almost-sure convergence alone says nothing about the
          limit's mean without a stronger mode like $L^{1}$, guaranteed here
          only in the uniformly bounded case — the same gap optional stopping's
          unbounded-time failure already carries.
      - ask: >
          Which process converges almost surely with no further hypothesis
          beyond the stated property?
        choices:
          - text: >
              Any supermartingale.
            feedback: >
              Too broad; a general supermartingale still needs
              $\sup_n\mathbb{E}|X_n|<\infty$, which is not automatic.
          - text: >
              A nonnegative supermartingale.
            correct: true
            feedback: >
              Nonnegativity alone bounds
              $\mathbb{E}|X_n|=\mathbb{E}[X_n]\le\mathbb{E}[X_0]$,
              automatically satisfying the general theorem's hypothesis.
          - text: >
              A nonnegative submartingale.
            feedback: >
              Submartingales drift UP, so nonnegativity does not bound
              $\mathbb{E}[X_n]$ from above the way it does for a
              supermartingale — no automatic convergence here.
        feedback: >
          Nonnegativity plus a downward-or-flat drift automatically caps
          $\mathbb{E}|X_n|$; nonnegativity alone, or the wrong drift direction,
          does not.
      - ask: >
          A martingale converges almost surely to a limit $X_\infty$. Does
          $\mathbb{E}[X_\infty]=\mathbb{E}[X_0]$ necessarily follow?
        choices:
          - text: >
              Yes, always.
            feedback: >
              False in general; almost-sure convergence alone says nothing
              about the limit's mean without a stronger mode like $L^{1}$
              convergence.
          - text: >
              Only if the martingale is uniformly bounded.
            correct: true
            feedback: >
              Uniform boundedness is exactly what licenses $L^{1}$ convergence,
              which lets the limit pass through the expectation; without it the
              mean can genuinely drift away.
          - text: >
              Only if the martingale is nonnegative.
            feedback: >
              Nonnegativity alone guarantees almost-sure convergence, but not
              that the mean survives the limit.
        feedback: >
          This is the same gap as optional stopping's unbounded case:
          almost-sure convergence is free, but passing the limit through
          $\mathbb{E}[\cdot]$ needs a stronger mode, guaranteed here only by
          uniform boundedness.
      - teach: >
          Polya's urn shows the limit can be genuinely informative: the red
          fraction is confined to $[0,1]$ and hence a bounded martingale, so
          convergence is guaranteed — though boundedness alone does not reveal
          that this particular limit is uniform on $(0,1)$.
      - teach: >
          A process bounded in $\mathbb{E}|X_n|$ converges almost surely to a
          finite limit, and only in the uniformly bounded case does that
          limit's mean match the process's starting mean.

