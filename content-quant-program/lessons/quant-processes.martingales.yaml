unit: quant-processes.martingales
opening: >
  Martingales formalize "fair game" precisely enough to compute with, and this
  unit builds the whole machine an interview draws on: the zoo of martingales
  built from a random walk, the vocabulary of stopping times, and the optional
  stopping theorem that turns "stop a fair game" into a hitting probability or
  an expected time — provided its conditions are checked. From there the unit
  works through the theorem's two headline applications, gambler's ruin and
  Wald's identity, before the ABRACADABRA casino shows the same machinery
  solving a genuine pattern-waiting puzzle, and the doubling-strategy fallacy
  and the maximal and convergence theorems close out the exact boundary of
  what optional stopping can and cannot deliver.
lessons:
  - node: quant-processes.martingales.filtration
    hook: >
      Every later definition in this unit — martingale, stopping time,
      predictable stake — is stated in terms of $\mathcal{F}_n$, so getting
      comfortable with "what does the filtration know" before the algebra
      starts is what makes the rest read like common sense.
    explanation: >
      Conditional expectation $\mathbb{E}[X\mid Y]$ already restricts an
      average to whatever $Y$ reveals. A filtration replaces the single
      variable $Y$ with an entire increasing history:
      $\mathcal{F}_0\subseteq\mathcal{F}_1\subseteq\cdots$, where
      $\mathcal{F}_n$ is everything you could know by watching the process
      through step $n$. For a sequence $X_1,X_2,\dots$,
      $\mathcal{F}_n=\sigma(X_1,\dots,X_n)$ just means "the first $n$
      observations, and anything computable from them."

      The two rules quoted in the statement are conditional expectation's two
      extreme cases restated for a filtration: a quantity already fixed by
      time $n$ passes straight through the conditioning, and a quantity that
      hasn't happened yet and is independent of the past collapses to its
      plain mean. Nearly every computation in this unit is one of these two
      facts applied to a single future increment.

      The adapted/predictable split is the difference between "known now" and
      "known one step ago." A gambler's fortune is adapted — revealed as it
      happens; a gambler's stake for the next round, chosen before that round
      is played, is predictable. That one-step lag is what protects a betting
      system from beating a fair game, later in this unit.
    worked: >
      Let $X_1,X_2,\dots$ be independent fair die rolls (values $1$ through
      $6$), and $\mathcal{F}_n=\sigma(X_1,\dots,X_n)$. Given $\mathcal{F}_2$
      with $X_1=4,X_2=1$, compute
      $\mathbb{E}[X_1+X_2+X_3+X_4\mid\mathcal{F}_2]$: $X_1+X_2=5$ is already
      known, and $X_3+X_4$ is independent of $\mathcal{F}_2$ with mean
      $3.5+3.5=7$, so the answer is $5+7=12$.
    interview: >
      "Write $\mathbb{E}[\cdot\mid\mathcal{F}_n]$ for this quantity" tests
      whether you split a sum into a known part and an independent part on
      sight. Interviewers also probe adapted-versus-predictable directly:
      "can you choose your bet size using today's close?" — yes, that's
      tomorrow's predictable stake.
    pitfalls: >
      Writing $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_{n+1}$, forgetting
      $X_{n+1}$ is exactly what's unknown at time $n$. Calling a quantity
      computed from $X_1,\dots,X_n$ "predictable" when it is really adapted —
      predictable means fixed one step earlier, at $\mathcal{F}_{n-1}$.
    recap: >
      $\mathcal{F}_n$ is shorthand for "everything observable by time $n$,"
      and the chapter runs on two facts: known quantities pass through
      conditioning unchanged, independent ones average out.
    dialogue:
      - part: Forecasting from the close of day two
        teach: >
          A stock opens at $50$. Each day, independently, it closes $4$ higher
          or $2$ lower with probability $1/2$ each, so one day's move averages
          $+1$. Write $P_n$ for the close of day $n$. You have just watched two
          days: up $4$, then up $4$ again, so $P_2 = 58$.
      - ask: >
          Standing at the close of day $2$, what is your best forecast of
          $P_5$, the close three days from now?
        expects: "61"
        hint: >
          Split $P_5$ into what you have already seen and what has not
          happened yet.
        feedback: >
          $P_5 = P_2 + (\text{moves on days } 3, 4, 5)$. The first part is
          $58$, fixed. The three moves are still unknown and independent of
          what you saw, so each contributes its plain mean $+1$:
          $58 + 3 = 61$.
      - ask: >
          Go back to the morning of day $1$, before anything had moved. What
          was your forecast of $P_5$ then?
        expects: "55"
        feedback: >
          Five unseen moves averaging $+1$ each: $50 + 5 = 55$. Same random
          variable, different forecast — the forecast depends on what you
          know when you make it, and two lucky days moved it from $55$ to
          $61$.
      - ask: >
          At the close of day $2$, what is your forecast of $P_1$?
        expects: "54"
        feedback: >
          $P_1 = 54$ is already on the tape. Averaging over what you might
          see next cannot change a number you have already seen, so the
          forecast is the number itself.
      - reflect: >
          You just forecast three things and used two different moves to do
          it. Name the two moves, and say exactly what decides which one
          applies to a given quantity.
        answer: >
          A quantity already determined by what you have seen passes through
          unchanged — $P_1$ forecasts to $54$. A quantity built from moves you
          have not seen, and which are independent of everything you have,
          collapses to its plain mean. The dividing line is the information
          you hold at the moment of forecasting, and that information grows
          day by day: by the close of day $2$ you know everything you knew at
          the close of day $1$, and more.

      - part: Naming what you know, day by day
        teach: >
          That growing stock of information is a filtration:
          $\mathcal{F}_0 \subseteq \mathcal{F}_1 \subseteq \mathcal{F}_2
          \subseteq \cdots$, with $\mathcal{F}_n$ everything observable by the
          close of day $n$ — here $\mathcal{F}_n = \sigma(P_1, \dots, P_n)$,
          the first $n$ closes and anything computable from them. Your
          forecasts were conditional expectations
          $\mathbb{E}[\,\cdot \mid \mathcal{F}_n]$, and the two moves are the
          two working rules: known quantities pass through, independent ones
          average out. A process $(Y_n)$ is adapted if each $Y_n$ is
          determined by $\mathcal{F}_n$ — you can write it down at the close
          of day $n$.
      - ask: >
          Which of these is *not* adapted — not something you can write down
          at the close of day $n$?
        choices:
          - text: >
              The highest close so far, $\max(P_0, \dots, P_n)$.
            feedback: >
              Every close up to day $n$ is on the tape, so their maximum is
              too. Running maxima, running counts and running averages are all
              adapted.
          - text: >
              Tomorrow's move, $P_{n+1} - P_n$.
            correct: true
            feedback: >
              It needs $P_{n+1}$, which is not revealed until the close of day
              $n+1$. A process that uses tomorrow's close is the one thing an
              adapted process may not do.
          - text: >
              The number of up days among days $1$ through $n$.
            feedback: >
              Each of those days has closed, so you can count them. This is
              adapted.
        feedback: >
          Adapted means "computable from $\mathcal{F}_n$". The only failure in
          the list is the one that reads a close that has not happened yet.
      - ask: >
          Still at the close of day $2$, with $P_2 = 58$. Let $D_3$ be day
          $3$'s move. Compute $\mathbb{E}[P_2 \, D_3 \mid \mathcal{F}_2]$.
        expects: "58"
        hint: >
          One factor is known at the close of day $2$; the other is
          independent of everything you know.
        feedback: >
          $P_2 = 58$ is known, so it pulls out as a constant:
          $\mathbb{E}[P_2 D_3 \mid \mathcal{F}_2] = 58 \, \mathbb{E}[D_3] =
          58 \cdot 1 = 58$. Both rules in one line — this is the shape of
          nearly every computation in the unit.

      - part: Known now versus known the night before
        teach: >
          Your desk has to fix each day's position before the market opens.
          So the number of shares $H_n$ you hold through day $n$ must be
          chosen at the close of day $n-1$. Such a process is predictable:
          each $H_n$ is determined by $\mathcal{F}_{n-1}$, one step before the
          move it is exposed to.
      - ask: >
          Which sizing rule for day $n$ is predictable?
        choices:
          - text: >
              Hold $2$ shares if day $n$ closes up, otherwise $1$.
            feedback: >
              This rule needs day $n$'s move to set day $n$'s position. It
              is adapted — you can describe it at the close of day $n$ — but
              no desk can trade it, because the position had to be set before
              the move.
          - text: >
              Hold $P_n - 50$ shares.
            feedback: >
              $P_n$ is the close of the very day you are trading, so the
              position is not known at the open. Shift the index to
              $P_{n-1} - 50$ and it becomes predictable.
          - text: >
              Hold one share for every up day among days $1$ through $n-1$.
            correct: true
            feedback: >
              Every day it counts has closed by the night before, so the
              position is fixed by $\mathcal{F}_{n-1}$.
        feedback: >
          Predictable means fixed one step early. The distinction looks
          pedantic; later in this unit it is exactly what stops a betting
          system from beating a fair game.
      - ask: >
          Take $Y_n = P_n$, the close itself. Which description is right?
        choices:
          - text: >
              Predictable but not adapted.
            feedback: >
              That combination cannot happen: $\mathcal{F}_{n-1} \subseteq
              \mathcal{F}_n$, so anything fixed by the night before is also
              fixed today. Predictable always implies adapted.
          - text: >
              Both adapted and predictable.
            feedback: >
              Predictable would mean $P_n$ is known at the close of day
              $n-1$. It is not: from $P_{n-1}$ it can still go to
              $P_{n-1} + 4$ or $P_{n-1} - 2$.
          - text: >
              Adapted but not predictable.
            correct: true
            feedback: >
              $P_n$ is on the tape at the close of day $n$ and not a moment
              earlier. It passes the adapted clause and fails the predictable
              one by exactly one day.
        feedback: >
          The price is adapted, the position you hold against it is
          predictable, and the one-day lag between them is the whole
          difference. An interviewer who asks "can you size tomorrow's bet
          off today's close?" wants: yes — that is a predictable stake.


  - node: quant-processes.martingales.martingale
    hook: >
      Every "is this a fair game" question reduces to checking one equation,
      $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_n$, so recognizing that shape on
      sight is worth more than reciting the definition.
    explanation: >
      The definition packages "fair game" precisely: given everything known
      through time $n$, tomorrow's expected fortune equals today's realized
      value — not its average, its actual value. That is stronger than
      $\mathbb{E}[X_{n+1}]=\mathbb{E}[X_n]$; it holds along every path, not
      just on average.

      The tower property upgrades a one-step promise into a promise at every
      future time: applying $\mathbb{E}[\cdot\mid\mathcal{F}_n]$ to
      $\mathbb{E}[X_{n+2}\mid\mathcal{F}_{n+1}]=X_{n+1}$ and using the tower
      property collapses two nested conditionings into
      $\mathbb{E}[X_{n+2}\mid\mathcal{F}_n]=X_n$, and induction extends this
      to every $m>n$. Setting $n=0$ removes the conditioning entirely, giving
      the constant-mean property $\mathbb{E}[X_n]=\mathbb{E}[X_0]$ — the one
      fact used to check almost every martingale identity in this unit.

      Linearity of conditional expectation makes sums of martingales on a
      shared filtration martingales again, which is the standing
      justification for building one complicated fair game out of several
      small ones.
    worked: >
      Let stakes grow with the round: bet $i$ pays $+i$ or $-i$ with equal
      probability, and $X_n$ is the running total, $X_0=0$. Realized path
      $+1,-2,+3$ gives $X_3=2$. Then
      $\mathbb{E}[X_4\mid\mathcal{F}_3]=2+\mathbb{E}[\text{bet }4]=2+0=2$,
      confirming the definition; unconditionally, $\mathbb{E}[X_4]=
      \mathbb{E}[X_0]=0$ regardless of the path taken to get there.
    interview: >
      "Is this process a martingale?" wants the one-line check
      $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_n$ verified, not "it's fair on
      average." A frequent follow-up, "what's $\mathbb{E}[X_{100}]$?", is
      answered instantly by the constant-mean property.
    pitfalls: >
      Checking only $\mathbb{E}[X_{n+1}]=\mathbb{E}[X_n]$ (unconditional) and
      calling it a martingale — necessary but not sufficient; the conditional
      version must hold path by path. Forgetting $\mathbb{E}|X_n|<\infty$: a
      process can satisfy the conditional equality formally and still fail to
      qualify if some $X_n$ isn't integrable.
    recap: >
      A martingale is a fair game frozen precisely:
      $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=X_n$, and the tower property
      promotes that single-step promise to $\mathbb{E}[X_n]=\mathbb{E}[X_0]$
      at every fixed time.
    dialogue:
      - part: Three games that all look fair
        teach: >
          Three games, each starting you at $10$ chips. Game A: each round a
          fair coin moves you up or down $1$. Game B: with an even stack you
          win or lose $1$ with probability $1/2$ each; with an odd stack you
          win $1$ with probability $2/3$ and lose $2$ with probability $1/3$.
          Game C: round $1$ is a fair coin, up or down $1$, and every later
          round simply repeats round $1$'s move.
      - ask: >
          In game C, what is $\mathbb{E}[X_3]$, your expected stack after
          three rounds?
        expects: "10"
        hint: >
          Game C has only two possible paths.
        feedback: >
          Up, up, up gives $13$ and down, down, down gives $7$, each with
          probability $1/2$: $\mathbb{E}[X_3] = (13 + 7)/2 = 10$. The same
          holds at every $n$: $\mathbb{E}[X_n] = 10$ forever.
      - ask: >
          You are playing game C and the first two rounds went up, so
          $X_2 = 12$. Given that history, what is the expected value of
          $X_3$?
        expects: "13"
        feedback: >
          Round $3$ repeats round $1$, which you saw go up, so $X_3 = 13$ with
          certainty. Given the history, your expected next stack is $13$, not
          $12$.
      - ask: >
          So is game C a fair game?
        choices:
          - text: >
              Yes: $\mathbb{E}[X_n] = 10$ at every $n$, so on average nobody
              gains.
            feedback: >
              The average over all paths is flat only because the up-path and
              the down-path cancel. You never play the average — you play one
              path, and after round $1$ you know which.
          - text: >
              Yes: every single round is up or down with probability $1/2$.
            feedback: >
              Each round is a coin flip *before* you have seen anything. After
              round $1$, the next move is certain, and a bet on it is free
              money.
          - text: >
              No: after round $1$ the history tells you the next move.
            correct: true
            feedback: >
              A game is fair only if, *given everything seen so far*, the next
              move has mean zero. In game C the conditional drift is $+1$ or
              $-1$, whichever way round $1$ went.
        feedback: >
          "Fair on average over all paths" and "fair given what you have seen"
          are different claims, and only the second is worth anything to the
          person at the table.
      - ask: >
          In game B you hold $11$ chips. What is your expected stack after
          the next round?
        expects: "11"
        feedback: >
          $11$ is odd, so you win $1$ with probability $2/3$ or lose $2$ with
          probability $1/3$: $\tfrac{2}{3}(12) + \tfrac{1}{3}(9) = 8 + 3 =
          11$. With an even stack it is $\pm 1$, which also averages to zero.
          The rule changes with the stack, but the drift is zero in every
          state.
      - reflect: >
          Game B's rules change with your stack, and game C's average never
          moves. Write down the single test that game B passes and game C
          fails.
        answer: >
          Given the entire history up to now, the expected next stack equals
          the current stack. Game B passes it in every state, even though its
          rules depend on the state; game C fails it after round $1$, even
          though its unconditional mean never moves. The test is conditional
          on the past, path by path, not averaged over paths.

      - part: The test, written down
        teach: >
          A process $(X_n)$ adapted to a filtration $(\mathcal{F}_n)$ is a
          martingale if $\mathbb{E}|X_n| < \infty$ for every $n$ and
          $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n] = X_n$. Equivalently, the
          next increment has zero conditional mean:
          $\mathbb{E}[X_{n+1} - X_n \mid \mathcal{F}_n] = 0$. Games A and B
          are martingales; game C is not, whatever its average does.
      - ask: >
          Game D: you start at $10$ and each round your whole stack either
          doubles or drops to $0$, with probability $1/2$ each. Is your stack
          a martingale?
        choices:
          - text: >
              No: you will almost surely end at $0$.
            feedback: >
              True, and irrelevant to the definition. From a stack of $x$ the
              next stack is $2x$ or $0$, averaging $x$. Where the game ends
              up is a separate question — one this unit comes back to.
          - text: >
              Yes: from any stack $x$, the next stack averages
              $\tfrac{1}{2}(2x) + \tfrac{1}{2}(0) = x$.
            correct: true
            feedback: >
              The one-step test passes in every state. A martingale can be
              wildly risky; it only has to be driftless.
          - text: >
              No: the variance grows without bound.
            feedback: >
              The definition says nothing about variance. Game A's variance
              grows without bound too, and nobody doubts it is fair.
        feedback: >
          The definition constrains one thing — the conditional mean of the
          next step — and leaves risk, spread and long-run behaviour entirely
          free.

      - part: From one step to any horizon
        ask: >
          In game A you hold $12$ chips after round $4$. What is
          $\mathbb{E}[X_9 \mid \mathcal{F}_4]$?
        expects: "12"
        hint: >
          Go one step at a time, from round $8$ back to round $4$.
        feedback: >
          $\mathbb{E}[X_9 \mid \mathcal{F}_8] = X_8$, and conditioning that on
          $\mathcal{F}_7$ gives $X_7$, and so on down to $X_4 = 12$. Five
          nested one-step promises collapse into one.
      - ask: >
          What licenses collapsing $\mathbb{E}[\mathbb{E}[X_9 \mid
          \mathcal{F}_8] \mid \mathcal{F}_4]$ into
          $\mathbb{E}[X_9 \mid \mathcal{F}_4]$?
        choices:
          - text: >
              Independence of the rounds.
            feedback: >
              Game B's rounds are not independent of the past — its odds
              depend on your stack — and the collapse works there too. What
              it needs is that $\mathcal{F}_4 \subseteq \mathcal{F}_8$.
          - text: >
              The tower property: conditioning on more and then on less is
              conditioning on less.
            correct: true
            feedback: >
              Because $\mathcal{F}_4 \subseteq \mathcal{F}_8$, the inner
              conditioning is absorbed. Induction then turns the one-step
              promise into $\mathbb{E}[X_m \mid \mathcal{F}_n] = X_n$ for
              every $m > n$.
          - text: >
              Linearity of expectation.
            feedback: >
              Linearity splits sums; it says nothing about nested
              conditioning. The step here is about information sets being
              nested.
        feedback: >
          Tower property plus the one-step definition gives every horizon at
          once. Take $n = 0$ and the conditioning disappears:
          $\mathbb{E}[X_n] = \mathbb{E}[X_0]$ at every fixed time.
      - ask: >
          Back to game D, starting at $10$. What is $\mathbb{E}[X_{20}]$?
        expects: "10"
        feedback: >
          Constant mean: $\mathbb{E}[X_{20}] = X_0 = 10$. The whole mean sits
          on one path — twenty doublings, probability $2^{-20}$, stack
          $10 \cdot 2^{20}$ — and every other path is at $0$. The mean is
          honest at each fixed time; whether it survives "wait until the
          end" is the question optional stopping exists to answer.


  - node: quant-processes.martingales.sub-supermartingale
    hook: >
      Recognizing which inequality direction you're looking at — and that a
      house edge is a supermartingale, not a submartingale — is a two-second
      sanity check that keeps every later sign right.
    explanation: >
      Relaxing the martingale's equality to an inequality gives two one-sided
      notions: a submartingale drifts up in conditional expectation, a
      supermartingale drifts down, and satisfying both at once is exactly
      being a martingale — the inequality in each direction forces equality.

      The naming is backwards from what intuition suggests, so memorize the
      mnemonic: a supermartingale is "super" only in size now, headed down —
      the game with the edge against you. A casino's house edge means your
      fortune is a supermartingale: each round's conditional expectation is at
      most your current stake.

      Jensen's inequality manufactures new submartingales from a martingale:
      for convex $f$, $\mathbb{E}[f(X_{n+1})\mid\mathcal{F}_n]\ge
      f(\mathbb{E}[X_{n+1}\mid\mathcal{F}_n])=f(X_n)$, so $f(X_n)$ is a
      submartingale whenever $X_n$ is a martingale. This is why $|X_n|$ and
      $X_n^{2}$ both drift upward even though $X_n$ itself drifts nowhere —
      convexity injects upward drift that wasn't there before.
    worked: >
      Let $X_n$ be a martingale with $X_0=0$ and each increment having
      variance $1$. Then $X_n^{2}$ is a submartingale:
      $\mathbb{E}[X_{n+1}^{2}\mid\mathcal{F}_n] =
      X_n^{2}+2X_n\,\mathbb{E}[\text{incr}\mid\mathcal{F}_n]+
      \mathbb{E}[\text{incr}^{2}] = X_n^{2}+0+1 = X_n^{2}+1 \ge X_n^{2}$,
      confirming a submartingale drift of exactly $+1$ per step.
    interview: >
      "Is your P&L a sub- or supermartingale under this rule" checks whether
      you can name the drift direction from the sign of the edge without
      hesitation. Expect the mnemonic check: "which one goes down?" —
      supermartingale, because life is not fair.
    pitfalls: >
      Swapping the two names under pressure — the single most common slip.
      Assuming any nonlinear function of a martingale increases the mean;
      it's specifically convexity that does it, so a concave function of a
      martingale is a supermartingale, not a submartingale.
    recap: >
      A submartingale drifts up, a supermartingale drifts down, being both is
      exactly being a martingale, and Jensen's inequality turns a martingale
      into a submartingale via any convex function.
    dialogue:
      - part: A game with an edge against you
        teach: >
          A carnival game: each round you win $1$ chip with probability $0.45$
          and lose $1$ chip with probability $0.55$, independently of
          everything before. You sit down with $20$ chips, and $X_n$ is your
          stack after $n$ rounds.
      - ask: >
          What is your expected stack after one round?
        expects: "19.9"
        feedback: >
          $20 + 0.45(1) + 0.55(-1) = 20 - 0.1 = 19.9$. Each round costs you
          $0.1$ chips in expectation.
      - ask: >
          What is $\mathbb{E}[X_{10}]$, your expected stack after ten rounds?
        expects: "19"
        feedback: >
          Ten rounds at $-0.1$ each: $20 - 1 = 19$. The mean slides down by
          the same amount every round.
      - ask: >
          After some history you hold $X_n$ chips. How does
          $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n]$ compare with $X_n$?
        choices:
          - text: >
              It depends on the history: after a losing streak the game
              owes you.
            feedback: >
              The rounds are independent of the past, so the next round
              costs $0.1$ in expectation whatever happened before. Nothing is
              owed.
          - text: >
              It is always at most $X_n$ — exactly $X_n - 0.1$.
            correct: true
            feedback: >
              Given any history, the next round's mean is $-0.1$, so the
              conditional expectation sits below the current stack in every
              state.
          - text: >
              It equals $X_n$, because each round is a coin toss.
            feedback: >
              That is the martingale equation, and it needs a zero-mean
              round. This coin pays $0.45 - 0.55 = -0.1$.
        feedback: >
          The martingale equation, relaxed to an inequality that holds in
          every state. That relaxation has a name — and the name runs the
          opposite way to the one most people guess.

      - part: Names that run backwards
        teach: >
          Keep the adaptedness and integrability of a martingale and relax the
          equation. $(X_n)$ is a supermartingale if
          $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n] \le X_n$, and a
          submartingale if $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n] \ge X_n$.
          A supermartingale drifts *down*: life is not fair, so the super one
          goes down. A process that is both is a martingale, since the two
          inequalities force equality.
      - ask: >
          Your stack at the carnival game is which?
        choices:
          - text: >
              A submartingale, since the house edge is a "sub-par" game.
            feedback: >
              The names do invert intuition. A submartingale has
              $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n] \ge X_n$ — it drifts up
              — and your stack drifts down.
          - text: >
              A supermartingale.
            correct: true
            feedback: >
              $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n] = X_n - 0.1 \le X_n$. A
              gambler facing a house edge always holds a supermartingale.
          - text: >
              Neither, since it is not fair.
            feedback: >
              Unfair in a consistent direction is exactly what the two names
              describe. "Neither" is for a process whose drift changes sign
              from state to state.
        feedback: >
          Supermartingale for the player.
      - ask: >
          The carnival's chip count from your table — it gains whatever you
          lose. Which is it?
        choices:
          - text: >
              A submartingale.
            correct: true
            feedback: >
              The house gains $0.1$ per round in expectation, so its
              conditional expectation sits above its current count. One
              side's supermartingale is the other side's submartingale.
          - text: >
              A supermartingale, like yours.
            feedback: >
              Its increments are the negatives of yours, so every inequality
              flips: $+0.1$ drift, upward.
          - text: >
              A martingale, since chips are only moving between two parties.
            feedback: >
              The total is conserved, but each side's share is not. Your side
              drifts at $-0.1$ and theirs at $+0.1$.
        feedback: >
          Negate a supermartingale and you get a submartingale.

      - part: Bending a fair game
        teach: >
          Now a fair game: a coin moves your score $S_n$ up or down $1$ with
          probability $1/2$ each, so $S_n$ is a martingale. Watch a function
          of it instead — your distance from zero, $|S_n|$.
      - ask: >
          Your score is $S_n = 3$. What is $\mathbb{E}[\,|S_{n+1}| \mid
          \mathcal{F}_n]$?
        expects: "3"
        feedback: >
          $|S_{n+1}|$ is $4$ or $2$, each with probability $1/2$: the average
          is $3$. Away from zero, $|S|$ behaves exactly like $S$.
      - ask: >
          Your score is $S_n = 0$. What is $\mathbb{E}[\,|S_{n+1}| \mid
          \mathcal{F}_n]$?
        expects: "1"
        feedback: >
          $S_{n+1}$ is $+1$ or $-1$, and both have $|S_{n+1}| = 1$. From $0$,
          the distance can only grow: the expectation jumps from $0$ to $1$.
      - reflect: >
          $|S_n|$ never drifts down, and drifts up only at $0$. What property
          of the function $x \mapsto |x|$ produces this, and which other
          functions of a fair game would drift up for the same reason?
        answer: >
          Convexity. The next value of $S$ is a fair spread around the current
          one, and a convex function's average over a spread is at least its
          value at the centre — Jensen's inequality. $|x|$ is straight except
          at its kink at $0$, so it gains only there; $x^{2}$ curves
          everywhere and gains everywhere, exactly $+1$ per step for this
          coin. Any convex function of a martingale is a submartingale.
      - ask: >
          Now a concave function. With $S_n = 4$, compute
          $\mathbb{E}[\sqrt{S_{n+1}} \mid \mathcal{F}_n]$ to four decimal
          places.
        expects: "1.9841"
        tolerance: 0.0005
        hint: >
          $S_{n+1}$ is $5$ or $3$; average the two square roots and compare
          with $\sqrt{4}$.
        feedback: >
          $(\sqrt{5} + \sqrt{3})/2 \approx (2.2361 + 1.7321)/2 \approx 1.9841$,
          just under $\sqrt{4} = 2$. Jensen runs the other way for a concave
          function, so $\sqrt{S_n}$ drifts down — a supermartingale, for as
          long as $S$ stays positive. The trap is assuming every nonlinear
          function of a martingale drifts up; only convex ones do.


  - node: quant-processes.martingales.examples-zoo
    hook: >
      These three constructions — the level, the compensated square, and the
      geometric martingale — are the entire toolkit optional stopping draws
      on; recognizing which one a problem wants is most of solving it.
    explanation: >
      Each entry is checked against the martingale definition by expanding
      one conditional expectation of a single increment. The centered walk
      works because $\mathbb{E}[X_{n+1}\mid\mathcal{F}_n]=p-q$ regardless of
      the past (the increments are independent of everything already seen),
      so subtracting the running total of that drift, $n(p-q)$, leaves
      conditional expectation exactly zero at every step; when $p=1/2$ the
      drift is already zero and $S_n$ itself is the martingale.

      The compensated square is the same $(S_n-n\mu)^{2}-n\sigma^{2}$
      construction general iid increments always get, with $\mu=p-q$ and
      $\sigma^{2}$ computed directly: since $X_i^{2}=1$ always for a $\pm1$
      step, $\mathbb{E}[X_i^{2}]=1$, and
      $\operatorname{Var}(X_i)=1-(p-q)^{2}=4pq$ using $p+q=1$ — that variance
      is exactly the $4pq\,n$ compensator, no coincidence at all. At
      $p=1/2$ this collapses to the familiar $S_n^{2}-n$.

      The geometric martingale checks a multiplicative fair game instead of
      an additive one: $(q/p)^{S_n}$ multiplies by the random factor
      $(q/p)^{X_{n+1}}$ each step, and that factor's mean is exactly $1$ —
      $p\cdot(q/p)+q\cdot(p/q)=q+p=1$ — so "drift zero" for a multiplicative
      process means "multiplier averages to $1$," the natural analogue of
      additive drift zero.
    worked: >
      Take $p=1/4$, $q=3/4$, so $q/p=3$. Check
      $\mathbb{E}[3^{X_1}] = (1/4)(3)+(3/4)(1/3) = 3/4+1/4 = 1$, confirming
      $\mathbb{E}[3^{S_{n+1}}\mid\mathcal{F}_n]=3^{S_n}\cdot1=3^{S_n}$ — the
      martingale property verified directly for this biased walk.
    interview: >
      "Name a martingale built from this random walk" should produce the
      three-item list instantly, keyed to whether the walk is symmetric. A
      pointed follow-up — "why $4pq\,n$ and not just $n$?" — tests whether
      you actually computed $\operatorname{Var}(X_i)$ rather than memorizing
      the symmetric case only.
    pitfalls: >
      Using $S_n^{2}-n$ for a biased walk — that identity is special to
      $p=1/2$; the biased version needs the $4pq\,n$ compensator and the
      $p-q$ recentering. Writing the geometric martingale as $(p/q)^{S_n}$
      instead of $(q/p)^{S_n}$ — only one ratio has expectation $1$ per step.
    recap: >
      Three martingales cover nearly every random-walk problem: $S_n-n(p-q)$,
      $(S_n-n(p-q))^{2}-4pq\,n$, and $(q/p)^{S_n}$ — each checked by one line
      of conditional expectation algebra on a single increment.
    dialogue:
      - part: The level, re-centred
        teach: >
          A walk starts at $S_0 = 0$ and each step is $+1$ with probability
          $3/5$ and $-1$ with probability $2/5$, independently. An interviewer
          asks you to name martingales built from it — functions of $S_n$
          and $n$ whose conditional expectation does not move.
      - ask: >
          What is $\mathbb{E}[S_{n+1} - S_n \mid \mathcal{F}_n]$, the drift of
          one step?
        expects: "1/5"
        feedback: >
          $\tfrac{3}{5}(1) + \tfrac{2}{5}(-1) = \tfrac{1}{5}$, the same whatever
          the history, because the next step is independent of the past.
      - ask: >
          Which of these is a martingale?
        choices:
          - text: >
              $S_n$ itself.
            feedback: >
              Its conditional expectation rises by $1/5$ every step. $S_n$ is a
              martingale only when $p = 1/2$.
          - text: >
              $S_n - n$.
            feedback: >
              That subtracts $1$ per step, but the walk only gains $1/5$ per
              step. $\mathbb{E}[\text{next} - \text{now}] = 1/5 - 1 = -4/5$:
              a supermartingale.
          - text: >
              $S_n - n/5$.
            correct: true
            feedback: >
              The step adds $1/5$ in expectation and the compensator subtracts
              exactly $1/5$, so the drift is zero in every state.
        feedback: >
          The first martingale in the zoo: the walk minus its accumulated
          drift, $S_n - n(p - q)$.

      - part: Squaring without drift
        ask: >
          Switch to a fair coin, $p = 1/2$, and suppose $S_n = 5$. What is
          $\mathbb{E}[S_{n+1}^{2} \mid \mathcal{F}_n]$?
        expects: "26"
        feedback: >
          $S_{n+1}$ is $6$ or $4$: $(36 + 16)/2 = 26$. In general
          $\mathbb{E}[(S_n + X)^{2} \mid \mathcal{F}_n] = S_n^{2} + 2 S_n
          \mathbb{E}[X] + \mathbb{E}[X^{2}] = S_n^{2} + 0 + 1$.
      - ask: >
          So for the fair coin, which process is a martingale?
        choices:
          - text: >
              $S_n^{2} - n$.
            correct: true
            feedback: >
              The square gains exactly $1$ per step in every state, so
              subtracting $n$ cancels it. This is the compensated square.
          - text: >
              $S_n^{2}$, since $S_n$ is.
            feedback: >
              You just watched it rise from $25$ to $26$ in expectation. A
              convex function of a martingale drifts up.
          - text: >
              $S_n^{2} - S_n$.
            feedback: >
              The drift of $S_n^{2}$ is $+1$, not $+S_n$; subtracting $S_n$
              (itself driftless) leaves the $+1$ in place.
        feedback: >
          A constant drift is removed by a compensator linear in $n$. The
          question is what that constant is when the coin is biased.
      - ask: >
          Back to the $3/5$ walk. What is the variance of one step?
        expects: "24/25"
        hint: >
          $X^{2} = 1$ always, so $\operatorname{Var}(X) = 1 - (\mathbb{E}[X])^{2}$.
        feedback: >
          $1 - (1/5)^{2} = 24/25 = 0.96$. Equivalently $4pq =
          4 \cdot \tfrac{3}{5} \cdot \tfrac{2}{5} = \tfrac{24}{25}$.
      - ask: >
          Which is the compensated square for the $3/5$ walk?
        choices:
          - text: >
              $S_n^{2} - n$.
            feedback: >
              For this walk $\mathbb{E}[S_{n+1}^{2} \mid \mathcal{F}_n] =
              S_n^{2} + \tfrac{2}{5} S_n + 1$, a drift that depends on the
              state. No compensator in $n$ alone can cancel it.
          - text: >
              $(S_n - n/5)^{2} - n$.
            feedback: >
              The centring is right, but the compensator must be the variance
              of a step, $24/25$, not its second moment $1$. Once the walk is
              centred, what is left to accumulate is variance.
          - text: >
              $(S_n - n/5)^{2} - \tfrac{24}{25} n$.
            correct: true
            feedback: >
              Centre first, then the square of a driftless walk gains exactly
              one step's variance per step: $(S_n - n(p-q))^{2} - 4pq \, n$.
        feedback: >
          Centre, square, subtract $n$ times the variance. For general iid
          steps of mean $\mu$ and variance $\sigma^{2}$ it reads
          $(S_n - n\mu)^{2} - n\sigma^{2}$.

      - part: A multiplier that averages to one
        ask: >
          Try a multiplicative candidate for the $3/5$ walk:
          $2^{S_n}$. Each step multiplies it by $2^{X}$. What is
          $\mathbb{E}[2^{X}]$?
        expects: "7/5"
        feedback: >
          $\tfrac{3}{5}(2) + \tfrac{2}{5}(\tfrac{1}{2}) = 1.2 + 0.2 = 1.4$.
          The multiplier averages $1.4$, so $2^{S_n}$ grows by a factor $1.4$
          per step in expectation — not a martingale.
      - reflect: >
          You want a base $b \ne 1$ that makes $b^{S_n}$ a martingale. Before
          computing it: should $b$ be above or below $1$ for this walk, and
          what equation pins it down?
        answer: >
          The walk drifts up, and a base above $1$ rewards up-steps, so the
          multiplier averaged more than $1$. A base below $1$ penalises the
          frequent up-steps and rewards the rare down-steps, and the right one
          balances them exactly: $\mathbb{E}[b^{X}] = p\,b + q/b = 1$. That
          is a quadratic, $p b^{2} - b + q = 0$, and $b = 1$ is always one
          root.
      - ask: >
          Solve it: which $b \ne 1$ makes $b^{S_n}$ a martingale for the
          $3/5$ walk?
        expects: "2/3"
        hint: >
          Factor $(b - 1)$ out of $\tfrac{3}{5} b^{2} - b + \tfrac{2}{5}$.
        feedback: >
          $\tfrac{3}{5} b^{2} - b + \tfrac{2}{5} = (b - 1)(\tfrac{3}{5} b -
          \tfrac{2}{5})$, so $b = 2/3 = q/p$. Check: $\tfrac{3}{5} \cdot
          \tfrac{2}{3} + \tfrac{2}{5} \cdot \tfrac{3}{2} = \tfrac{2}{5} +
          \tfrac{3}{5} = 1$.
      - teach: >
          That completes the zoo for a $\pm 1$ walk with up-probability $p$
          and $q = 1 - p$: the centred walk $S_n - n(p - q)$, the compensated
          square $(S_n - n(p-q))^{2} - 4pq\,n$, and the geometric martingale
          $(q/p)^{S_n}$, whose step multiplier averages
          $p \cdot \tfrac{q}{p} + q \cdot \tfrac{p}{q} = q + p = 1$. Each is
          verified the same way: one conditional expectation of one step.
      - ask: >
          For a fair coin, what does the geometric martingale become?
        choices:
          - text: >
              $2^{S_n}$, since the coin is fair.
            feedback: >
              $\mathbb{E}[2^{X}] = (2 + \tfrac{1}{2})/2 = 1.25$, so $2^{S_n}$
              grows. The base must be $q/p$.
          - text: >
              The constant $1$, which tells you nothing.
            correct: true
            feedback: >
              $q/p = 1$ and $1^{S_n} = 1$. That is why fair-coin problems run
              on $S_n$ and $S_n^{2} - n$ instead.
          - text: >
              $(1/2)^{S_n}$, from $q = 1/2$.
            feedback: >
              The base is the ratio $q/p$, not $q$. Here
              $\mathbb{E}[(1/2)^{X}] = 1.25$ as well.
        feedback: >
          The geometric martingale is the tool for biased walks, and it
          degenerates exactly when the bias vanishes.
      - ask: >
          A process has iid steps equal to $+3$ with probability $1/4$ and
          $-1$ with probability $3/4$. Find the constant $c$ that makes
          $S_n^{2} - c\,n$ a martingale.
        expects: "3"
        hint: >
          First check the mean of a step.
        feedback: >
          The mean is $\tfrac{3}{4} - \tfrac{3}{4} = 0$, so no centring is
          needed, and $c$ is the variance:
          $\tfrac{1}{4}(9) + \tfrac{3}{4}(1) = 3$. The zoo works for any iid
          steps, not only $\pm 1$.


  - node: quant-processes.martingales.exponential-martingale
    hook: >
      This is the general engine behind the geometric martingale — pick
      $\theta$ so the moment generating function equals $1$, and any random
      walk hands you a bounded martingale for free.
    explanation: >
      The geometric martingale is a special case of a much more general
      construction: for iid increments with finite
      $\phi(\theta)=\mathbb{E}[e^{\theta X_1}]$, the ratio
      $M_n=e^{\theta S_n}/\phi(\theta)^{n}$ is always a martingale, because
      the new increment's contribution $e^{\theta X_{n+1}}$ is independent of
      the past and averages to exactly $\phi(\theta)$, cancelling the extra
      factor picked up in the denominator — the same one-line check used
      throughout the zoo, carried out for exponentials.

      The move worth remembering is choosing $\theta$ to solve
      $\phi(\theta)=1$ rather than leaving the denominator in. When that root
      exists, the denominator becomes $1$ and $e^{\theta S_n}$ itself is a
      martingale — no time-dependent compensator to carry into optional
      stopping.

      For the $\pm1$ walk, $\phi(\theta)=pe^{\theta}+qe^{-\theta}$, and
      solving $\phi(\theta)=1$ gives the nontrivial root $e^{\theta}=q/p$
      ($\theta=0$ is the trivial root), recovering the geometric martingale
      exactly. The general construction is what to reach for once the
      increments aren't $\pm1$.
    worked: >
      Let $X_i=+1$ with probability $1/3$ and $X_i=-2$ with probability
      $2/3$ (mean $-1$, an unfavorable walk). Then
      $\phi(\theta)=(1/3)e^{\theta}+(2/3)e^{-2\theta}$. With $y=e^{\theta}$,
      $\phi(\theta)=1$ becomes $y^{3}-3y^{2}+2=0$; the trivial root is
      $y=1$, and factoring $(y-1)(y^{2}-2y-2)=0$ gives the nontrivial root
      $y=1+\sqrt3\approx2.732$, so $\theta=\ln(1+\sqrt3)\approx1.005$ and
      $M_n=e^{\theta S_n}$ is a martingale with $M_0=1$ — even though the
      walk itself drifts to $-\infty$.
    interview: >
      "Construct a bounded martingale for this random walk" is answered by
      writing $e^{\theta S_n}/\phi(\theta)^{n}$ and proposing to solve
      $\phi(\theta)=1$ for the nontrivial root, showing you know the general
      construction, not just the $\pm1$ special case.
    pitfalls: >
      Forgetting $\theta=0$ always solves $\phi(\theta)=1$ and stopping
      there — the useful root is the other one. Using $M_n=e^{\theta S_n}$
      without dividing by $\phi(\theta)^{n}$ for a $\theta$ that hasn't been
      tuned to make $\phi(\theta)=1$ — for a generic $\theta$ that's not a
      martingale at all.
    recap: >
      $e^{\theta S_n}/\phi(\theta)^{n}$ is a martingale for any $\theta$, and
      solving $\phi(\theta)=1$ for its nontrivial root removes the
      compensator, generalizing the $\pm1$ walk's geometric martingale to any
      iid step distribution.
    dialogue:
      - part: A walk the zoo does not cover
        teach: >
          A strategy's daily P&L is $+2$ with probability $4/7$ and $-1$ with
          probability $3/7$, independently each day, and $S_n$ is the running
          total from $S_0 = 0$. The steps are not $\pm 1$, so the zoo's
          geometric martingale was not built for this walk.
      - ask: >
          What is the mean daily P&L?
        expects: "5/7"
        feedback: >
          $\tfrac{4}{7}(2) + \tfrac{3}{7}(-1) = \tfrac{8 - 3}{7} = \tfrac{5}{7}$.
          The walk drifts up.
      - ask: >
          Try the zoo's recipe anyway: with $p = 4/7$ and $q = 3/7$ it
          proposes $(3/4)^{S_n}$. Compute $\mathbb{E}[(3/4)^{X}]$ for one day's
          step $X$.
        expects: "25/28"
        feedback: >
          $\tfrac{4}{7} \cdot (\tfrac{3}{4})^{2} + \tfrac{3}{7} \cdot
          \tfrac{4}{3} = \tfrac{9}{28} + \tfrac{16}{28} = \tfrac{25}{28}$. Not
          $1$, so $(3/4)^{S_n}$ shrinks by a factor $25/28$ per step in
          expectation. The ratio $q/p$ worked only because a $\pm 1$ step
          makes $p(q/p) + q(p/q)$ collapse to $1$.
      - reflect: >
          The zoo's geometric martingale worked because its one-step
          multiplier averaged exactly $1$. For this walk, how could you turn
          *any* base $b$ into a martingale, and how would you then pick the
          best base?
        answer: >
          Whatever $b$ is, $b^{S_n}$ gets multiplied each step by $b^{X}$,
          independent of the past, with some mean $m(b)$. Divide by that mean
          once per step — $b^{S_n}/m(b)^{n}$ — and the expected multiplier
          becomes $1$. The best base is one with $m(b) = 1$, because then the
          divisor disappears and $b^{S_n}$ is a martingale on its own, with no
          time term to carry.

      - part: Divide out the average multiplier
        ask: >
          Take base $2$. What is $\mathbb{E}[2^{X}]$ for one day's step?
        expects: "5/2"
        feedback: >
          $\tfrac{4}{7}(4) + \tfrac{3}{7}(\tfrac{1}{2}) = \tfrac{32}{14} +
          \tfrac{3}{14} = \tfrac{35}{14} = \tfrac{5}{2}$.
      - ask: >
          Which process is a martingale?
        choices:
          - text: >
              $2^{S_n} - \tfrac{5}{2} n$.
            feedback: >
              The growth is multiplicative — a factor $5/2$ per step — so an
              additive compensator cannot cancel it. The drift of $2^{S_n}$ is
              $\tfrac{3}{2} \cdot 2^{S_n}$, which depends on the state.
          - text: >
              $2^{S_n} / (5/2)^{n}$.
            correct: true
            feedback: >
              The next step multiplies the numerator by $2^{X}$, averaging
              $5/2$, and the denominator by exactly $5/2$. The ratio has
              conditional mean equal to its current value.
          - text: >
              $2^{S_n} / 2^{n}$.
            feedback: >
              That divides by the base, not by the average multiplier. Its
              one-step factor averages $\tfrac{5}{2} / 2 = \tfrac{5}{4}$.
        feedback: >
          Divide by the moment generating function, once per step.
      - teach: >
          In general write $b = e^{\theta}$ and
          $\phi(\theta) = \mathbb{E}[e^{\theta X_1}]$, the moment generating
          function of a step. Then $M_n = e^{\theta S_n} / \phi(\theta)^{n}$
          is a martingale with $M_0 = 1$: given $\mathcal{F}_n$, the new
          factor $e^{\theta X_{n+1}}$ is independent of the past and averages
          $\phi(\theta)$, exactly cancelling the extra $\phi(\theta)$ in the
          denominator. This is the exponential martingale, and it needs
          nothing but iid steps with $\phi(\theta)$ finite.
      - ask: >
          Use it at base $2$: compute $\mathbb{E}[2^{S_3}]$.
        expects: "125/8"
        hint: >
          $\mathbb{E}[M_3] = M_0 = 1$.
        feedback: >
          $\mathbb{E}[2^{S_3} / (5/2)^{3}] = 1$, so $\mathbb{E}[2^{S_3}] =
          (5/2)^{3} = 125/8 = 15.625$. No enumeration of the eight paths
          needed.

      - part: Tuning the base until the divisor vanishes
        ask: >
          One value of $\theta$ always solves $\phi(\theta) = 1$, for any step
          distribution. Which?
        choices:
          - text: >
              $\theta = 0$, since $e^{0 \cdot X} = 1$.
            correct: true
            feedback: >
              $\phi(0) = \mathbb{E}[1] = 1$ always, and $M_n \equiv 1$ — a
              martingale that says nothing. The useful root is the other one.
          - text: >
              $\theta = \mu$, the mean step.
            feedback: >
              $\phi(5/7) = \mathbb{E}[e^{5X/7}]$ exceeds $1$ here; by Jensen it
              is at least $e^{(5/7)^{2}} > 1$. The mean is not a root.
          - text: >
              $\theta = \ln 2$.
            feedback: >
              You just computed $\phi(\ln 2) = \mathbb{E}[2^{X}] = 5/2$. Base
              $2$ needs the divisor.
        feedback: >
          The trivial root is free and useless; the work is finding the
          nontrivial one.
      - ask: >
          Find the nontrivial root: the $y = e^{\theta} \ne 1$ with
          $\tfrac{4}{7} y^{2} + \tfrac{3}{7} y^{-1} = 1$.
        expects: "1/2"
        hint: >
          Multiply through by $7y$ and factor out $(y - 1)$.
        feedback: >
          $4y^{3} - 7y + 3 = 0$, and $y = 1$ is a root, so it factors as
          $(y - 1)(4y^{2} + 4y - 3) = (y - 1)(2y - 1)(2y + 3)$. The positive
          root other than $1$ is $y = 1/2$. Check:
          $\tfrac{4}{7} \cdot \tfrac{1}{4} + \tfrac{3}{7} \cdot 2 = \tfrac{1}{7}
          + \tfrac{6}{7} = 1$. So $(1/2)^{S_n}$ is a martingale with no
          divisor at all.
      - ask: >
          The walk drifts up and its root came out below $1$. For a walk whose
          steps have negative mean, where does the nontrivial root
          $y = e^{\theta}$ lie?
        choices:
          - text: >
              Also below $1$: the root is always a fraction.
            feedback: >
              Below $1$ penalises up-steps, which is what an upward drift
              needs. A downward drift needs the opposite correction.
          - text: >
              Above $1$, at some $\theta > 0$.
            correct: true
            feedback: >
              $\phi$ is convex with $\phi(0) = 1$ and slope $\phi'(0) = \mu$.
              If $\mu < 0$, $\phi$ dips below $1$ for small $\theta > 0$ and
              climbs back to $1$ further out, so the second root has
              $\theta > 0$.
          - text: >
              There is none: only upward-drifting walks have one.
            feedback: >
              The picture is symmetric: a downward drift pushes the second
              root to $\theta > 0$ instead of $\theta < 0$.
        feedback: >
          The sign of the nontrivial $\theta$ is opposite to the sign of the
          drift, which is a quick check on any root you compute.
      - ask: >
          Now steps of $+2$ with probability $1/3$ and $-1$ with probability
          $2/3$. Does $\phi(\theta) = 1$ have a nontrivial root?
        choices:
          - text: >
              Yes, $y = 1/2$, as before.
            feedback: >
              Check: $\tfrac{1}{3} \cdot \tfrac{1}{4} + \tfrac{2}{3} \cdot 2 =
              \tfrac{17}{12} \ne 1$. Changing the probabilities moves the
              root.
          - text: >
              Yes, at $y = 2$.
            feedback: >
              $\tfrac{1}{3} \cdot 4 + \tfrac{2}{3} \cdot \tfrac{1}{2} =
              \tfrac{5}{3} \ne 1$.
          - text: >
              No: the mean step is $0$, and $y = 1$ is a double root.
            correct: true
            feedback: >
              $\tfrac{2}{3} - \tfrac{2}{3} = 0$. The equation becomes
              $y^{3} - 3y + 2 = (y - 1)^{2}(y + 2) = 0$: $\phi$ touches $1$ at
              $\theta = 0$ with zero slope and never comes back.
        feedback: >
          A driftless walk has no nontrivial root, just as the geometric
          martingale collapsed to $1$ for a fair coin. Driftless walks are
          handled by $S_n$ and the compensated square instead; the root is
          the tool for walks with drift.


  - node: quant-processes.martingales.spotting-martingales
    hook: >
      This is the master recipe interviewers actually expect: compute one
      drift, read one case, done — memorizing the zoo's formulas is no
      substitute for deriving a fourth one live.
    explanation: >
      Every hitting-probability or hitting-time question reduces to the same
      computation: propose a candidate function $f$ of the current state,
      compute the one-step drift
      $D(x)=\mathbb{E}[f(X_{n+1})-f(X_n)\mid X_n=x]$, and read off which case
      you're in — exactly the calculation already done three times in the
      zoo, made systematic.

      Zero drift is the probability case: if $D\equiv0$ then $f(X_n)$ is
      itself a martingale, and optional stopping — once its conditions are
      checked — reads off a hitting probability with no further work.
      Constant nonzero drift is the time case: if $D\equiv c$, subtracting
      the running total $cn$ cancels the drift, so $f(X_n)-cn$ is a
      martingale, and stopping it returns an expected time instead.

      When the drift depends on the state $x$, the zero-drift equation
      $D(x)\equiv0$ is a functional equation for $f$ — for a Markov chain
      with transition matrix $P$ this is the harmonic equation $Pf=f$, solved
      subject to boundary values $1$ and $0$ at the two absorbing states,
      while $Pf-f=-1$ is the corresponding equation for an expected time.
      Probabilities want harmonic functions; times want a compensator.
    worked: >
      For the fair $\pm1$ walk absorbed at $0$ and $N$, try $f(x)=x$: its
      drift is $D(x)=\mathbb{E}[X_{n+1}-X_n]=0$ identically, so $f(X_n)=S_n$
      is already a martingale and needs no further solving — exactly why
      $S_n$, not some other function, hands the ruin probability straight to
      optional stopping.
    interview: >
      "How would you find the right martingale for this hitting-time
      problem" wants the drift computation stated as a general method, not a
      lookup in the zoo. A frequent follow-up asks you to solve $Pf=f$ for a
      small Markov chain live.
    pitfalls: >
      Guessing a function, finding nonzero non-constant drift, and giving up
      instead of solving the resulting functional equation. Forgetting the
      boundary conditions on the harmonic equation — $Pf=f$ alone has many
      solutions, and only the boundary values pick out the right one.
    recap: >
      Compute the one-step drift of a candidate function of the state; zero
      drift gives a martingale and a probability, constant drift gives a
      compensated martingale and an expected time.
    dialogue:
      - part: The obvious candidate fails
        teach: >
          A particle lives on $\{0, 1, 2, 3\}$ and is absorbed at $0$ and $3$.
          From $1$ it moves to $2$ with probability $1/3$ and to $0$ with
          probability $2/3$. From $2$ it moves to $3$ or to $1$ with
          probability $1/2$ each. It starts at $1$, and you want the
          probability it is absorbed at $3$.
      - ask: >
          Try the candidate $f(x) = x$. What is its one-step drift at state
          $1$, $\mathbb{E}[X_{n+1} - X_n \mid X_n = 1]$?
        expects: "-1/3"
        feedback: >
          $\tfrac{1}{3}(+1) + \tfrac{2}{3}(-1) = -\tfrac{1}{3}$.
      - ask: >
          And its drift at state $2$?
        expects: "0"
        feedback: >
          $\tfrac{1}{2}(+1) + \tfrac{1}{2}(-1) = 0$.
      - ask: >
          A colleague says: "start $1$, walls at $0$ and $3$, so the answer is
          $1/3$, like a fair walk." What is wrong?
        choices:
          - text: >
              Nothing: the walk is fair at state $2$, and that is where the
              decision is made.
            feedback: >
              Every path to $3$ passes through state $1$ at the start, and
              there the position drifts down by $1/3$. The answer $1/3$ needs
              zero drift everywhere.
          - text: >
              The position $X_n$ is not a martingale — its drift is $-1/3$ at
              state $1$ — so "start over width" does not apply.
            correct: true
            feedback: >
              $k/N$ comes from the position being a martingale. Here the drift
              depends on the state, so the formula has nothing to stand on.
          - text: >
              It should be $2/3$, because the walls are at distance $1$ and
              $2$.
            feedback: >
              Distances are what the fair-walk formula uses, and this walk is
              not fair. The true answer is less than $1/3$, since the first
              move favours $0$.
        feedback: >
          The identity function has state-dependent drift: neither zero nor a
          constant. Guessing a second function is one option; there is a
          better one.
      - reflect: >
          Rather than guessing another $f$, what could you demand of $f$
          directly at the two interior states, and what values would you pin
          at $0$ and $3$ so that $f$ at the start *is* the answer?
        answer: >
          Demand zero drift at every interior state:
          $f(1) = \tfrac{1}{3} f(2) + \tfrac{2}{3} f(0)$ and
          $f(2) = \tfrac{1}{2} f(3) + \tfrac{1}{2} f(1)$. That makes $f(X_n)$ a
          martingale. Pin $f(0) = 0$ and $f(3) = 1$, so that at absorption
          $f(X)$ is the indicator of ending at $3$; then $f$ at the start is
          the probability you want. Two linear equations, two unknowns.

      - part: Solving for the function
        teach: >
          That is the drift recipe. For a candidate $f$ of the state compute
          $D(x) = \mathbb{E}[f(X_{n+1}) - f(X_n) \mid X_n = x]$. If
          $D \equiv 0$, $f(X_n)$ is a martingale and gives a probability. If
          $D \equiv c \ne 0$, then $f(X_n) - cn$ is a martingale and gives a
          time. If $D$ depends on the state, solve $D \equiv 0$ for $f$: for a
          chain with transition matrix $P$ that is the harmonic equation
          $Pf = f$, with boundary values $1$ and $0$ — the same equations as
          first-step analysis.
      - ask: >
          Solve the two equations with $f(0) = 0$ and $f(3) = 1$. What is
          $f(1)$?
        expects: "1/5"
        hint: >
          Substitute $f(2) = \tfrac{1}{2} + \tfrac{1}{2} f(1)$ into the first
          equation.
        feedback: >
          $f(1) = \tfrac{1}{3}(\tfrac{1}{2} + \tfrac{1}{2} f(1)) = \tfrac{1}{6}
          + \tfrac{1}{6} f(1)$, so $\tfrac{5}{6} f(1) = \tfrac{1}{6}$ and
          $f(1) = 1/5$. Then $f(2) = \tfrac{1}{2} + \tfrac{1}{10} =
          \tfrac{3}{5}$. The colleague's $1/3$ was too high.
      - ask: >
          The boundary values matter. Which pair would make $f(1)$ the
          probability of absorption at $0$ instead?
        choices:
          - text: >
              $f(0) = 0$, $f(3) = 1$ again; just read off $1 - f(1)$.
            feedback: >
              That gets the number, but this $f(1)$ is still the probability
              of absorption at $3$, and you derived the other answer from it.
              For $f$ itself to be the new probability, the boundary values
              must change.
          - text: >
              $f(0) = 1$, $f(3) = 0$.
            correct: true
            feedback: >
              Then $f(X)$ at absorption is the indicator of ending at $0$. The
              solution is $1 - $ the previous one: $f(1) = 4/5$.
          - text: >
              Any values, since $Pf = f$ determines $f$.
            feedback: >
              Constants solve $Pf = f$ too, and so does every combination of
              solutions. The interior equations have a whole family of
              solutions; the boundary values pick one.
        feedback: >
          Probabilities want harmonic functions, and the boundary values decide
          which probability.

      - part: When the drift is a constant
        teach: >
          Now a lazy walk on the integers: each step is $-1$, $0$ or $+1$ with
          probability $1/3$ each. The position has zero drift, so it cannot
          see time. Try a candidate that can: $f(x) = x^{2}$.
      - ask: >
          What is the drift of $f(x) = x^{2}$ at any state $x$?
        expects: "2/3"
        hint: >
          Expand $(x + X)^{2} - x^{2}$ and average over the step $X$.
        feedback: >
          $\mathbb{E}[2xX + X^{2}] = 2x \cdot 0 + \tfrac{1}{3}(1 + 0 + 1) =
          \tfrac{2}{3}$, the same at every $x$.
      - ask: >
          Which process is a martingale?
        choices:
          - text: >
              $X_n^{2} - n$.
            feedback: >
              That is the compensator for a $\pm 1$ walk, which moves every
              step. This walk rests a third of the time, so its square gains
              only $2/3$ per step.
          - text: >
              $X_n^{2} - \tfrac{2}{3} n$.
            correct: true
            feedback: >
              Constant drift $c = 2/3$, so subtract $cn$. Stopping this one
              returns an expected time.
          - text: >
              $X_n^{2}$, since the walk is fair.
            feedback: >
              The walk is fair; its square is not. You just computed its
              drift: $+2/3$ per step.
        feedback: >
          Times want a compensator. When the drift is state-dependent instead,
          the time version of the harmonic equation is $Pg - g = -1$: each
          step costs one unit of time.
      - ask: >
          Back to the particle on $\{0, 1, 2, 3\}$. Let $g(x)$ be the expected
          number of steps to absorption from $x$, so $g(0) = g(3) = 0$ and
          $g = 1 + Pg$ inside. What is $g(1)$?
        expects: "8/5"
        hint: >
          $g(1) = 1 + \tfrac{1}{3} g(2)$ and $g(2) = 1 + \tfrac{1}{2} g(1)$.
        feedback: >
          $g(1) = 1 + \tfrac{1}{3}(1 + \tfrac{1}{2} g(1)) = \tfrac{4}{3} +
          \tfrac{1}{6} g(1)$, so $\tfrac{5}{6} g(1) = \tfrac{4}{3}$ and
          $g(1) = 8/5$. The same transition probabilities as the harmonic
          equation, with one unit of time added per step and zero at both
          walls.


  - node: quant-processes.martingales.martingale-transform
    hook: >
      This is the theorem behind "the house always wins in expectation" — no
      way of sizing your bets changes the mean of a fair game, only its
      spread.
    explanation: >
      A predictable stake $H_n$ is fixed by $\mathcal{F}_{n-1}$ — chosen
      before round $n$'s outcome is revealed, exactly the "no peeking"
      restriction the adapted/predictable distinction was built to express.
      The transform $(H\cdot X)_n=\sum_{k=1}^{n}H_k(X_k-X_{k-1})$ is just your
      cumulative winnings under that staking plan.

      The transform is a martingale because each term
      $H_k(X_k-X_{k-1})$ has conditional expectation zero given
      $\mathcal{F}_{k-1}$: $H_k$ is already known there and pulls out,
      leaving $H_k\cdot\mathbb{E}[X_k-X_{k-1}\mid\mathcal{F}_{k-1}]=H_k\cdot0=0$
      by the martingale property of $X$ itself. Summing zero-mean increments
      keeps the running total flat, so $\mathbb{E}[(H\cdot X)_n]=0$ at every
      fixed $n$.

      This is the formal version of "no betting system beats a fair game":
      doubling, stop-losses sized on past information — every one is a choice
      of $H_n$, and every one leaves the mean exactly where it started, only
      reshaping the distribution around it. The one lever the theorem does
      not touch is when to stop.
    worked: >
      Fair coin, $X_n$ the $\pm1$ walk, staking rule $H_n=2$ if the previous
      toss was heads, $H_n=1$ otherwise. Realized path H,T,H (increments
      $+1,-1,+1$) gives $H_1=1$ (no history), $H_2=2$ (previous was H),
      $H_3=1$ (previous was T), so $(H\cdot X)_3=1(1)+2(-1)+1(1)=0$;
      unconditionally $\mathbb{E}[(H\cdot X)_3]=0$ regardless of the staking
      rule chosen.
    interview: >
      "Can a clever staking strategy make a fair game profitable?" wants the
      transform-is-a-martingale argument named, with predictability of the
      stake identified as load-bearing. A sharp follow-up: "what if the stake
      could depend on the current outcome?" — then it isn't predictable and
      the theorem doesn't apply.
    pitfalls: >
      Letting $H_n$ depend on $X_n$ itself and still calling it predictable —
      that breaks $\mathcal{F}_{n-1}$-measurability entirely. Assuming
      boundedness of $H_n$ can be dropped for free; unbounded stakes are
      exactly what breaks optional stopping later.
    recap: >
      Any predictable stake sequence applied to a martingale produces another
      martingale with mean $0$ — sizing a bet reshapes variance, never
      expectation.
    dialogue:
      - part: A system that wins most of the time
        teach: >
          A fair coin; heads wins your stake, tails loses it. Your system:
          stake $1$ unit each toss, except that right after two tails in a row
          you stake $4$, because heads is "due". You play exactly three
          tosses, so only the third stake can be $4$.
      - ask: >
          What is your net result on the sequence T, T, H?
        expects: "2"
        feedback: >
          $-1 - 1 + 4 = +2$. The two losses at stake $1$ are recovered by the
          raised third stake.
      - ask: >
          Of the $8$ equally likely three-toss sequences, in how many do you
          finish ahead?
        expects: "5"
        hint: >
          Only T, T, then anything uses the stake of $4$; every other sequence
          is three tosses at stake $1$.
        feedback: >
          TTH $+2$, HHH $+3$, HHT $+1$, HTH $+1$, THH $+1$ are ahead; HTT $-1$,
          THT $-1$ and TTT $-6$ are behind. Five of eight.
      - ask: >
          What is your expected net result?
        expects: "0"
        feedback: >
          $(2 + 3 + 1 + 1 + 1 - 1 - 1 - 6)/8 = 0/8 = 0$. Five small wins and
          one big loss, exactly balanced.
      - ask: >
          What is your worst possible result, and how likely is it?
        choices:
          - text: >
              $-3$, with probability $1/8$.
            feedback: >
              That is the worst case for a flat stake of $1$. The system
              raises the stake precisely on TTT's third toss, so that path
              loses $1 + 1 + 4 = 6$.
          - text: >
              $-6$, with probability $1/8$.
            correct: true
            feedback: >
              T, T, T: $-1 - 1 - 4$. The system did not remove risk; it moved
              it onto one path.
          - text: >
              $-6$, with probability $1/4$.
            feedback: >
              Only one of the eight sequences is TTT. TTH, the other path that
              raises the stake, wins $2$.
        feedback: >
          Flat staking gives $-3$ to $+3$ symmetrically. The system made
          winning likelier and the worst loss twice as large, and left the
          mean at exactly $0$.
      - reflect: >
          You can design any rule of this kind — more after losses, less after
          wins, anything based on what has happened. Why must each one leave
          the mean at $0$? Point at the single toss where the argument lives.
        answer: >
          Look at one toss $k$. Your stake on it is fixed by tosses $1$
          through $k-1$, before toss $k$ is made, and toss $k$ is fair given
          all of that. So given the past, that toss contributes stake times a
          mean-zero increment: zero. Every toss contributes zero, so the total
          does. The rule can move outcomes between paths, never create mean.

      - part: The transform, and what it needs
        teach: >
          Write $X_n$ for the fair walk and $H_k$ for your stake on toss $k$.
          Your winnings are the martingale transform
          $(H \cdot X)_n = \sum_{k=1}^{n} H_k (X_k - X_{k-1})$. If each $H_k$
          is predictable — fixed by $\mathcal{F}_{k-1}$ — and bounded, then
          $\mathbb{E}[H_k (X_k - X_{k-1}) \mid \mathcal{F}_{k-1}] = H_k \cdot 0
          = 0$, so $(H \cdot X)$ is a martingale and has mean $0$ at every
          fixed $n$. No betting system beats a fair game.
      - ask: >
          A different rule: stake $4$ on a toss if *that toss* comes up heads,
          and $1$ otherwise. What is your expected gain per toss?
        expects: "3/2"
        feedback: >
          $\tfrac{1}{2}(+4) + \tfrac{1}{2}(-1) = \tfrac{3}{2}$. The stake reads
          the toss it is betting on, so it is not predictable and the
          theorem says nothing. Pulling $H_k$ out of
          $\mathbb{E}[\cdot \mid \mathcal{F}_{k-1}]$ is the step that fails.
      - ask: >
          Which staking rule is predictable?
        choices:
          - text: >
              Stake $1$ more than the number of heads among all $n$ tosses.
            feedback: >
              On toss $k$ that counts tosses $k$ through $n$, which have not
              happened. Restrict the count to tosses before $k$ and it would
              qualify.
          - text: >
              Stake $1$ plus the longest run of tails among tosses $1$
              through $k-1$.
            correct: true
            feedback: >
              Every toss it inspects has already landed when toss $k$ is
              staked. However elaborate, a rule of this shape gives mean $0$.
          - text: >
              Stake $2$ on toss $k$ if toss $k$ and toss $k-1$ match.
            feedback: >
              Whether they match depends on toss $k$ itself, so the stake is
              set with knowledge of the outcome it is betting on.
        feedback: >
          Predictable means the stake for a round is fixed before the round —
          the same one-step lag as a position set at the previous close.

      - part: With an edge, and the lever left over
        ask: >
          Now the coin has a house edge: heads with probability $0.48$. Your
          stakes are predictable and never negative. What can you say about
          your expected winnings after $n$ tosses?
        choices:
          - text: >
              At most $0$, whatever the rule.
            correct: true
            feedback: >
              The walk is a supermartingale, and a nonnegative predictable
              stake times a nonpositive conditional drift is nonpositive.
              The transform is a supermartingale too.
          - text: >
              It can be positive if you stake more after losses.
            feedback: >
              Each toss still has conditional mean $H_k(0.48 - 0.52) \le 0$,
              however $H_k$ was chosen. Raising stakes after losses just loses
              faster on average.
          - text: >
              Exactly $0$, as in the fair game.
            feedback: >
              Each unit staked loses $0.04$ in expectation, so the mean is
              $-0.04$ times the expected total staked — strictly negative
              unless you never bet.
        feedback: >
          Nonnegative stakes on a supermartingale give a supermartingale.
      - ask: >
          Why does the edge theorem insist on $H_k \ge 0$?
        choices:
          - text: >
              Because negative stakes are not allowed at a casino.
            feedback: >
              It is a mathematical requirement, not a house rule. Multiplying
              an inequality by a negative number flips it.
          - text: >
              A negative stake is a bet on tails — taking the house's side —
              and that has positive mean.
            correct: true
            feedback: >
              $H_k = -1$ earns $0.04$ per toss in expectation. The inequality
              $H_k \cdot (\text{drift}) \le 0$ needs $H_k \ge 0$.
          - text: >
              Negative stakes would make $(H \cdot X)$ unbounded.
            feedback: >
              A stake of $-1$ is as bounded as a stake of $+1$. The issue is
              sign, not size.
        feedback: >
          Varying stakes reshapes the distribution and never the mean. The one
          lever this theorem leaves untouched is *when you stop* — which is
          where the rest of this unit goes.


  - node: quant-processes.martingales.stopping-time
    hook: >
      This definition — decide using only the past — is the single
      hypothesis every optional stopping argument lives or dies on, so
      knowing the non-examples cold matters as much as the examples.
    explanation: >
      A stopping time formalizes "a rule for quitting that a person actually
      watching the process could follow": at each time $n$ you must already
      be able to say whether you've stopped, using only what's been revealed
      through $\mathcal{F}_n$. Formally $\{T=n\}\in\mathcal{F}_n$ for every
      $n$ — the event "I stop exactly now" is decided by present information,
      never future.

      The examples share the same shape: hitting a level, completing a
      pattern, a fixed deterministic time, and combinations like min, max or
      a fixed shift of two stopping times — all decidable by watching,
      without knowing what comes next.

      The non-examples are worth memorizing precisely because they look
      almost legitimate: "the time the walk hits its maximum over $[0,N]$"
      needs the whole path first, to know it wasn't beaten later; "the step
      just before the first visit to $a$" requires already knowing when that
      visit happens; "the last visit to $0$" and every version of selling at
      the top need clairvoyance. Optional stopping has nothing to say about
      any of these.
    worked: >
      For the $\pm1$ walk started at $S_0=5$, let $T_1$ = first time $S_n$
      hits $0$ or $10$: a stopping time, since checking $S_n\in\{0,10\}$ at
      each $n$ uses only what's observed. Let $T_2$ = the last time before
      absorption that $S_n=5$: not a stopping time, since declaring "this is
      the last visit to $5$" requires already knowing the walk never returns
      — information only available from the entire future path.
    interview: >
      "Is this a valid stopping time?" is asked almost literally — the answer
      must be justified by "can you tell at time $n$, using only
      $\mathcal{F}_n$" rather than intuition about fairness. Expect several
      examples and non-examples in a row.
    pitfalls: >
      Calling "the time of the maximum" a stopping time because it feels
      natural — it needs the whole path to confirm no later value beats it.
      Assuming any reasonable-sounding trading rule ("sell when the price
      will never be this high again") is a stopping time; if it needs the
      future, it isn't, no matter how natural it sounds.
    recap: >
      $T$ is a stopping time exactly when $\{T=n\}$ is decided by
      $\mathcal{F}_n$ — a rule for quitting using only what has already
      happened, and every optional stopping argument requires exactly this.
    dialogue:
      - part: Four rules for calling stop
        teach: >
          A dealer turns the cards of a shuffled $52$-card deck face up, one at
          a time. Right after any card is shown you may call "stop", and you
          win something tied to that card. Four friends propose rules. A: stop
          at the first ace. B: stop at the card just before the first ace. C:
          stop at the first ace or at card $20$, whichever comes first. D:
          stop at the last heart in the deck.
      - ask: >
          Card $9$ has just been turned: a queen, and no ace has appeared yet.
          Under rule B, should you call stop?
        choices:
          - text: >
              Yes: no ace yet, so this could be the card before it.
            feedback: >
              It could be — if card $10$ is an ace. If card $10$ is not, you
              have stopped on the wrong card and cannot take it back.
          - text: >
              No: rule B only stops right before an ace, and none is showing.
            feedback: >
              Rule B never stops on an ace; it stops on the card *before* one.
              Card $9$ might be exactly that card.
          - text: >
              You cannot tell until card $10$ is turned.
            correct: true
            feedback: >
              Whether "stop now" was right depends on a card you have not
              seen. By then card $9$ is gone.
        feedback: >
          Rule B is a perfectly good description of a random card, and no one
          watching the deck can follow it.
      - ask: >
          Which rules can a player always carry out, deciding at each card
          from the cards shown so far?
        choices:
          - text: >
              A only.
            feedback: >
              Rule C needs only two checks at each card: is it an ace, and is
              it card $20$? Both are visible the moment the card is shown.
          - text: >
              A and C.
            correct: true
            feedback: >
              Both decide "stop now" from the cards shown so far. B needs the
              next card, and D needs every remaining card, to be sure no later
              heart follows.
          - text: >
              A, C and D.
            feedback: >
              At a heart, rule D must know no heart is still to come — the
              rest of the deck. Only the dealer knows that.
        feedback: >
          A and C watch; B and D peek.
      - ask: >
          Under rule A, what is the latest card on which you could possibly
          stop?
        expects: "49"
        hint: >
          How many cards can come before the first ace?
        feedback: >
          At most $48$ non-aces come first, so the first ace is at card $49$
          at the latest. Rule A stops at a random card, but never past $49$.
      - reflect: >
          Say precisely what you were checking about each rule, in terms of
          "card $n$" and "the cards shown so far".
        answer: >
          For every $n$, whether the rule stops at card $n$ has to be decided
          by cards $1$ through $n$ alone. A and C pass: at card $n$ you can
          see whether it is the first ace, and whether $n = 20$. B fails
          because "stop at $n$" depends on card $n+1$, and D fails because it
          depends on cards $n+1$ through $52$.

      - part: The definition, and what it allows
        teach: >
          A random time $T$ with values in $\{0, 1, 2, \dots\} \cup \{\infty\}$
          is a stopping time for a filtration $(\mathcal{F}_n)$ if
          $\{T = n\} \in \mathcal{F}_n$ for every $n$: the event "stop now" is
          decided by what has been seen. Equivalently
          $\{T \le n\} \in \mathcal{F}_n$ — at time $n$ you can tell whether
          you have already stopped. Rules A and C are stopping times; B and D
          are not.
      - ask: >
          Let $T$ be the position of the first ace and $S$ the position of the
          first heart. Which of these is *not* a stopping time?
        choices:
          - text: >
              $S \wedge T$, the first card that is an ace or a heart.
            feedback: >
              At card $n$ you can see whether an ace or a heart has appeared.
              $\{S \wedge T \le n\} = \{S \le n\} \cup \{T \le n\}$, both
              decided by card $n$.
          - text: >
              $T + 3$, three cards after the first ace.
            feedback: >
              Whether you are three cards past the first ace is decided by
              what you have seen. Shifting forward is safe.
          - text: >
              $T - 1$, the card just before the first ace.
            correct: true
            feedback: >
              That is rule B. Shifting back by one makes "stop now" depend on
              the next card.
          - text: >
              $S \vee T$, the first card by which both an ace and a heart
              have appeared.
            feedback: >
              $\{S \vee T \le n\} = \{S \le n\} \cap \{T \le n\}$, decided by
              card $n$.
        feedback: >
          Minimum, maximum and forward shifts of stopping times are stopping
          times. Backward shifts are not, in general.
      - ask: >
          Switch to a coin with heads probability $0.4$. $T$ is the first time
          heads lead tails by $10$. There is a positive probability this never
          happens. Is $T$ a stopping time?
        choices:
          - text: >
              No: a stopping time must actually stop.
            feedback: >
              The definition allows the value $\infty$. Whether $T$ is finite
              with probability $1$ is a separate hypothesis that later
              theorems ask for explicitly.
          - text: >
              Yes: at each toss you can see whether heads lead by $10$ yet.
            correct: true
            feedback: >
              $\{T = n\}$ is decided by the first $n$ tosses. That some paths
              never trigger it does not matter.
          - text: >
              Only if you cap it at some fixed number of tosses.
            feedback: >
              A cap makes it bounded, which is a stronger and useful property
              — but the uncapped rule is already a stopping time.
        feedback: >
          Being a stopping time is about information, not about finiteness.

      - part: The rule that looks fine and is not
        ask: >
          Back to the deck. Count red cards minus black cards as they are
          turned. Rule E: stop at the card where this count reaches its
          highest value over the whole deck. Why does rule E fail?
        choices:
          - text: >
              It does not fail: you can see the running count at every card.
            feedback: >
              You can see the count so far. Whether this is the highest it
              will *ever* get depends on the cards still to come.
          - text: >
              To know a value is the maximum, you must know no later card
              beats it.
            correct: true
            feedback: >
              The event "stop at card $n$" involves cards $n+1$ through $52$.
              This is selling at the top, and no stopping theorem says
              anything about it.
          - text: >
              It fails only because the maximum might be reached twice.
            feedback: >
              Breaking ties by taking the first time the maximum is reached
              does not help: you still need the future to know it is the
              maximum.
        feedback: >
          In an interview, the test for any proposed rule is one sentence: can
          you decide to stop at time $n$ using only what has happened by time
          $n$? Every "at the top", "just before" or "last time" rule fails it.


  - node: quant-processes.martingales.stopped-martingale
    hook: >
      This is the free half of optional stopping — truncating a fair game at
      any stopping time whatsoever costs nothing at any fixed horizon, and
      knowing exactly why makes the theorem after this one legible.
    explanation: >
      Write the stopped process as a telescoping sum:
      $X_{T\wedge n}=X_0+\sum_{k=1}^{n}\mathbf{1}\{T\ge k\}(X_k-X_{k-1})$ —
      each term contributes the increment if the process hasn't stopped yet,
      or zero if it has. This is exactly the martingale transform with stake
      $H_k=\mathbf{1}\{T\ge k\}$.

      The stake is predictable because $\{T\ge k\}=\{T\le k-1\}^{c}$, and
      $\{T\le k-1\}$ is decided by $\mathcal{F}_{k-1}$ by the very definition
      of a stopping time — whether you're "still in the game" at round $k$ is
      knowable one step early. That predictability is the entire proof.

      Because it's a martingale transform by a predictable, bounded stake,
      $X_{T\wedge n}$ is a martingale, so $\mathbb{E}[X_{T\wedge n}]=
      \mathbb{E}[X_0]$ holds for every fixed $n$, with no assumption on $T$
      beyond being a stopping time. Everything difficult in optional stopping
      lives entirely in the limit $n\to\infty$, where
      $\mathbb{E}[X_{T\wedge n}]\to\mathbb{E}[X_T]$ can fail.
    worked: >
      Fair walk from $S_0=3$, $T$ = first hit of $0$ or $8$. At $n=2$, before
      absorption is possible: with probability $1/4$ up-up ($S_2=5$), $1/2$
      mixed ($S_2=3$), $1/4$ down-down ($S_2=1$, not yet absorbed). So
      $\mathbb{E}[S_{T\wedge2}]=\frac14(5)+\frac12(3)+\frac14(1)=3$, matching
      $S_0=3$ exactly.
    interview: >
      "Why is $\mathbb{E}[X_{T\wedge n}]=\mathbb{E}[X_0]$ always true, with
      no conditions on $T$?" wants the martingale-transform argument named
      directly. A sharp follow-up asks where the argument would break trying
      to push $n\to\infty$.
    pitfalls: >
      Believing this already proves $\mathbb{E}[X_T]=\mathbb{E}[X_0]$ — it
      proves only the truncated version at every finite $n$; the limit is a
      separate, nontrivial step. Checking predictability of
      $\mathbf{1}\{T\ge k\}$ against $\mathcal{F}_k$ instead of
      $\mathcal{F}_{k-1}$ — the whole point is it's fixed one step early.
    recap: >
      Stopping a martingale at any stopping time and fixed horizon costs
      nothing — $X_{T\wedge n}$ is itself a martingale — and every difficulty
      in optional stopping lives in the limit $n\to\infty$.
    dialogue:
      - part: A gambler who quits when broke
        teach: >
          You hold $4$ chips. Each round a fair coin decides whether you win
          or lose $2$ chips, and you walk away for good the moment you hit
          $0$. Let $T$ be the round you go broke, and $X_{T \wedge n}$ your
          stack after round $n$, frozen at $0$ once you have quit.
      - ask: >
          What is the probability you have gone broke by the end of round
          $3$?
        expects: "1/4"
        hint: >
          From $4$, going broke takes two net losses of $2$.
        feedback: >
          The only way to $0$ within three rounds is to lose rounds $1$ and
          $2$: $4 \to 2 \to 0$, probability $1/4$. Lose-win-lose ends at $2$,
          not $0$.
      - ask: >
          What is $\mathbb{E}[X_{T \wedge 3}]$, your expected stack after
          round $3$?
        expects: "4"
        hint: >
          Six of the eight sign patterns are still playing after round $3$;
          the two starting with two losses are frozen at $0$.
        feedback: >
          The six live paths end at $10, 6, 6, 2, 6, 2$, each with probability
          $1/8$, and the frozen paths contribute $0$:
          $(10 + 6 + 6 + 2 + 6 + 2)/8 = 32/8 = 4$. Exactly your starting
          stack.
      - reflect: >
          Quitting at $0$ is a decision about whether to keep betting. Write
          your frozen stack as a betting system on the original game: what is
          your stake on round $k$, and when do you know it?
        answer: >
          On round $k$ you take the full bet if you are still playing and
          nothing if you have quit: a stake of $1$ when $T \ge k$, and $0$
          when $T \le k - 1$. Whether $T \le k - 1$ is
          settled by the end of round $k-1$, because $T$ is a stopping time.
          So quitting is a predictable stake, and a predictable stake on a
          fair game keeps the mean where it started.

      - part: Stopping is a betting system
        teach: >
          In symbols,
          $X_{T \wedge n} = X_0 + \sum_{k=1}^{n} \mathbf{1}\{T \ge k\}(X_k -
          X_{k-1})$: each round contributes its increment if you are still in
          and nothing once you have stopped. This is a martingale transform
          with stake $\mathbf{1}\{T \ge k\}$, so for any martingale $X$ and
          any stopping time $T$, the stopped process $X_{T \wedge n}$ is a
          martingale and $\mathbb{E}[X_{T \wedge n}] = \mathbb{E}[X_0]$ for
          every fixed $n$. No other hypothesis on $T$.
      - ask: >
          Why is the stake $\mathbf{1}\{T \ge k\}$ fixed by
          $\mathcal{F}_{k-1}$?
        choices:
          - text: >
              Because $T$ is bounded.
            feedback: >
              Your $T$ is not bounded — you could stay in the game for a very
              long time — and the stake is still predictable. Boundedness is
              not what is used.
          - text: >
              Because $\{T \ge k\}$ is the complement of $\{T \le k - 1\}$,
              which is decided by round $k-1$.
            correct: true
            feedback: >
              That is the stopping-time definition used one step early. Checking
              it against $\mathcal{F}_k$ instead of $\mathcal{F}_{k-1}$ misses
              the point.
          - text: >
              Because the game is fair.
            feedback: >
              Fairness is used afterwards, to make each term have conditional
              mean zero. Predictability of the stake is a statement about
              information only.
        feedback: >
          Predictability of "still playing" is the entire proof; the
          martingale transform does the rest.

      - part: Letting the horizon run out
        ask: >
          A fair walk eventually reaches every level. What is the probability
          you eventually go broke?
        expects: "1"
        feedback: >
          Your stack in units of $2$ chips is a fair $\pm 1$ walk from $2$, and
          it hits $0$ with probability $1$. So $X_T = 0$ almost surely and
          $\mathbb{E}[X_T] = 0$.
      - ask: >
          So $\mathbb{E}[X_{T \wedge n}] = 4$ at every $n$, yet
          $\mathbb{E}[X_T] = 0$. Where does the mean go?
        choices:
          - text: >
              The identity $\mathbb{E}[X_{T \wedge n}] = 4$ must fail for large
              $n$.
            feedback: >
              It holds at every fixed $n$, with no conditions — you proved it
              for all $n$ at once.
          - text: >
              Onto a shrinking set of paths still playing, whose stacks grow
              large enough to carry the whole mean.
            correct: true
            feedback: >
              As $n$ grows, the probability of still playing falls toward $0$
              but the stacks on those paths grow, and their product stays at
              $4$. In the limit the probability is $0$ and the mean is gone.
          - text: >
              $X_{T \wedge n}$ does not converge to $X_T$.
            feedback: >
              It does: on every path that goes broke, $X_{T \wedge n} = 0$ from
              round $T$ on. Pointwise convergence holds; the mean simply does
              not follow it.
        feedback: >
          $X_{T \wedge n} \to X_T$ on every path, and still the means do not
          converge. Everything hard about stopping a martingale lives in this
          one limit.
      - ask: >
          Check it at $n = 3$: given that you are still playing after round
          $3$, what is your expected stack?
        expects: "16/3"
        feedback: >
          Still playing has probability $3/4$, and the frozen paths contribute
          $0$, so $\tfrac{3}{4} m = 4$ and $m = 16/3 \approx 5.33$. The
          survivors are already richer than you started, and the gap widens
          with $n$.
      - ask: >
          Same quitting rule, but the coin now favours the house. What can you
          say about $\mathbb{E}[X_{T \wedge n}]$?
        choices:
          - text: >
              It is at most $4$ for every $n$.
            correct: true
            feedback: >
              The stopped process is a transform of a supermartingale by a
              nonnegative predictable stake, so it is a supermartingale.
          - text: >
              It equals $4$: stopping makes any game fair.
            feedback: >
              Stopping changes nothing about the rounds you do play, and each
              one still loses in expectation.
          - text: >
              It can exceed $4$, since you stop before losing everything.
            feedback: >
              Quitting at $0$ removes rounds you would have played broke; it
              cannot add positive drift to the rounds you play.
        feedback: >
          The supermartingale version holds identically, by the same argument.
      - ask: >
          Where the argument breaks: a rule that is not a stopping time. "Quit
          just before your first losing round." Starting from $4$, what is
          your expected stack after one round under this rule?
        expects: "5"
        feedback: >
          If round $1$ is a loss you quit beforehand and keep $4$; if it is a
          win you play it and hold $6$. $\tfrac{1}{2}(4) + \tfrac{1}{2}(6) =
          5$. Peeking at the outcome turned a fair round into a free option,
          which is why the stake must be fixed by $\mathcal{F}_{k-1}$.


  - node: quant-processes.martingales.ost
    hook: >
      This theorem is asked constantly and gotten wrong constantly, because
      the three sufficient conditions, not the conclusion, are the actual
      content — name your condition or the argument is worthless.
    explanation: >
      The stopped process gives $\mathbb{E}[X_{T\wedge n}]=\mathbb{E}[X_0]$
      free at every finite $n$; optional stopping is entirely about pushing
      $n\to\infty$ to get $\mathbb{E}[X_T]=\mathbb{E}[X_0]$. Since
      $X_{T\wedge n}\to X_T$ almost surely, the only question is whether
      expectation commutes with that limit, and the three conditions are
      three different sufficient routes to that interchange.

      Condition (a), $T\le N$, needs nothing else — the sum stabilizes at
      $X_T$ for $n\ge N$. Condition (b), a bounded stopped process, invokes
      dominated convergence directly. Condition (c), the one most often
      needed in interview problems, pairs bounded increments with
      $\mathbb{E}[T]<\infty$: this bounds $|X_{T\wedge n}-X_0|$ by
      $C\cdot T$, and $\mathbb{E}[T]<\infty$ makes that dominating bound
      itself integrable.

      The sharp criterion behind all three — uniform integrability of
      $(X_{T\wedge n})_n$ — is worth knowing exists even if rarely checked
      directly; each named condition is a convenient way of guaranteeing it.
      For a supermartingale the identical conditions give
      $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ instead of equality.
    worked: >
      Fair walk from $S_0=2$, absorbed at $0$ or $6$. $T$ is unbounded
      (condition a fails), but $0\le S_{T\wedge n}\le6$ for every $n$ —
      condition (b) holds with $C=6$ — so $\mathbb{E}[S_T]=\mathbb{E}[S_0]=2$
      is licensed, giving $6\Pr(\text{hit }6)=2$, hitting probability $1/3$.
    interview: >
      "State optional stopping and its conditions" is asked almost verbatim;
      interviewers listen for which condition applies to this problem, not a
      recitation of all three. A common trap gives an unbounded stopping time
      and asks whether the conclusion still holds.
    pitfalls: >
      Applying $\mathbb{E}[X_T]=\mathbb{E}[X_0]$ to an unbounded stopping
      time without checking any condition — the single most common error in
      the unit. Confusing "$T<\infty$ almost surely" (required just to state
      the theorem) with "$T$ is bounded" (only one of three ways to satisfy
      it).
    recap: >
      $\mathbb{E}[X_T]=\mathbb{E}[X_0]$ holds under a bounded stopping time,
      a bounded stopped process, or bounded increments with
      $\mathbb{E}[T]<\infty$ — without naming one, the conclusion is false,
      not just unproved.
    dialogue:
      - part: Two walls, and then one
        teach: >
          A fair $\pm 1$ walk starts at $S_0 = 0$ and stops at $T$, the first
          time it reaches $-3$ or $+7$. You want the probability it stops at
          $+7$. $S_n$ is a martingale, and the stopped walk has
          $\mathbb{E}[S_{T \wedge n}] = 0$ at every fixed $n$.
      - ask: >
          Suppose the $0$ survives to the end, so $\mathbb{E}[S_T] = 0$. What
          probability of stopping at $+7$ does that force?
        expects: "3/10"
        hint: >
          $S_T$ takes only two values.
        feedback: >
          With $u = \Pr(S_T = 7)$: $7u - 3(1 - u) = 0$, so $10u = 3$ and
          $u = 3/10$. The nearer wall is the likelier one.
      - ask: >
          Now remove the upper wall: $T'$ is the first time the walk reaches
          $-2$. A fair walk reaches $-2$ with probability $1$, so
          $S_{T'} = -2$ always and $\mathbb{E}[S_{T'}] = -2 \ne 0$. Which
          feature of the two-wall problem was doing the work?
        choices:
          - text: >
              The walk was fair.
            feedback: >
              It is equally fair now, and the $0$ is lost. Fairness gives you
              $\mathbb{E}[S_{T \wedge n}] = 0$ at every finite $n$ in both
              problems; something else carries it to the limit.
          - text: >
              $T$ was finite with probability $1$.
            feedback: >
              So is $T'$. Finiteness is needed even to write $S_T$ down, but
              it does not stop the mean leaking away.
          - text: >
              Until it stopped, the walk was trapped between $-3$ and $7$.
            correct: true
            feedback: >
              With one wall, the paths that have not yet hit $-2$ can wander
              arbitrarily high, and those rare high paths carry the mean. Two
              walls leave nowhere for it to hide.
        feedback: >
          Same martingale, same kind of stopping rule, opposite verdicts. The
          difference is in what the stopped process is allowed to do on its
          way to $T$.
      - reflect: >
          You have $\mathbb{E}[S_{T \wedge n}] = 0$ for every $n$, and
          $S_{T \wedge n} \to S_T$ as $n \to \infty$. In general terms, what
          has to be true for the expectation to follow that limit?
        answer: >
          The limit and the expectation have to commute, and that fails only
          when a vanishing probability carries a non-vanishing amount of mean
          — paths that are rarer and rarer but further and further out. Any
          control that stops that suffices: the stopped process staying
          bounded, or the time itself being bounded, or the steps being
          bounded with the time short enough on average. The sharp name for
          "no mass escapes" is uniform integrability.

      - part: Name the condition you are using
        teach: >
          Optional stopping: let $(X_n)$ be a martingale and $T$ a stopping
          time with $\Pr(T < \infty) = 1$. Then
          $\mathbb{E}[X_T] = \mathbb{E}[X_0]$ provided one of: (a) $T \le N$
          for a constant $N$; (b) $|X_{T \wedge n}| \le C$ for all $n$; (c)
          $\mathbb{E}[T] < \infty$ and $|X_n - X_{n-1}| \le C$. For a
          supermartingale the same conditions give
          $\mathbb{E}[X_T] \le \mathbb{E}[X_0]$. Without one of them, the
          conclusion is not unproved — it can be false.
      - ask: >
          For the walls at $-3$ and $+7$, which condition can you verify in one
          line, without knowing anything about the distribution of $T$?
        choices:
          - text: >
              (a), since the walk must exit within $10$ steps.
            feedback: >
              It need not: the walk can bounce between $-2$ and $6$ for as
              long as you like. $T$ is finite with probability $1$ but not
              bounded.
          - text: >
              (b), since $|S_{T \wedge n}| \le 7$ for every $n$.
            correct: true
            feedback: >
              Before $T$ the walk is strictly between the walls, and at $T$ it
              is on one. Bounded, done.
          - text: >
              (c), since the steps are $\pm 1$.
            feedback: >
              The steps are bounded, but (c) also needs
              $\mathbb{E}[T] < \infty$, which is true here and takes an
              argument. (b) needs none.
        feedback: >
          Say it out loud: "the stopped walk is bounded by $7$, so optional
          stopping applies". That sentence is what an interviewer is waiting
          for.
      - ask: >
          For the one-wall time $T'$, steps are bounded by $1$. Why does (c)
          still fail?
        choices:
          - text: >
              $\mathbb{E}[T'] = \infty$.
            correct: true
            feedback: >
              The fair walk reaches $-2$ for sure, but it takes infinitely
              long on average. (c) needs both halves, and this half is missing.
          - text: >
              $T'$ is infinite with positive probability.
            feedback: >
              The fair walk is recurrent: $\Pr(T' < \infty) = 1$. The time is
              finite on every path that matters; it is its *mean* that is
              infinite.
          - text: >
              (c) does hold, so optional stopping is wrong here.
            feedback: >
              If any condition held, the theorem would give $-2 = 0$. The
              contradiction is itself the proof that all three fail.
        feedback: >
          All three conditions fail for $T'$: unbounded time, unbounded
          stopped walk, infinite mean time.
      - ask: >
          The same walk, now stopped at $-3$, $+7$ or step $100$, whichever
          comes first. What is $\mathbb{E}[S_T]$?
        expects: "0"
        feedback: >
          $T \le 100$, so condition (a) gives $\mathbb{E}[S_T] = 0$ at once.
          A cap always buys optional stopping, at the cost of a stopped value
          that is no longer just $-3$ or $7$.

      - part: A multiplicative instance by hand
        ask: >
          A price starts at $4$. Each day it doubles with probability $1/3$ or
          halves with probability $2/3$. You stop the first time it reaches
          $32$ or falls to $1$. What is the probability it reaches $32$?
        expects: "3/31"
        hint: >
          Check that the price is a martingale, then do what you did for the
          walls.
        feedback: >
          One day's multiplier averages $\tfrac{1}{3}(2) + \tfrac{2}{3}(\tfrac{1}{2})
          = 1$, so the price is a martingale. Optional stopping:
          $32u + 1(1 - u) = 4$, so $31u = 3$ and $u = 3/31$.
      - ask: >
          Which condition licensed that?
        choices:
          - text: >
              None is needed, because the price is positive.
            feedback: >
              Positivity gives an inequality for supermartingales, not an
              equality for martingales. You need a named condition for the
              $=$.
          - text: >
              (b): until it stops the price is one of $2, 4, 8, 16$, and at the
              stop it is $1$ or $32$.
            correct: true
            feedback: >
              The stopped price never exceeds $32$. And the stopping is
              certain, since the exponent is a $\pm 1$ walk confined to a
              finite range.
          - text: >
              (a): from $4$ the price must reach $1$ or $32$ within $5$ days.
            feedback: >
              It can go $4, 8, 4, 8, \dots$ for as long as you like. The stop
              is certain but not bounded, so (a) is not available.
        feedback: >
          Same theorem, a martingale that is not a walk, and the same one-line
          condition.
      - ask: >
          Last: the fair walk from $0$, and $T$ is the step at which $S_n$
          attains its maximum over steps $0$ through $10$. What does optional
          stopping say about $\mathbb{E}[S_T]$?
        choices:
          - text: >
              $\mathbb{E}[S_T] = 0$, by condition (a), since $T \le 10$.
            feedback: >
              (a) is a condition on a *stopping time*. This $T$ needs the whole
              path to identify, and $S_T \ge S_0 = 0$ on every path, with
              strict inequality on most — so $\mathbb{E}[S_T] > 0$.
          - text: >
              Nothing: $T$ is not a stopping time.
            correct: true
            feedback: >
              $\{T = n\}$ depends on steps after $n$. The theorem has nothing to
              say, and indeed $\mathbb{E}[S_T] > 0$.
          - text: >
              $\mathbb{E}[S_T] \le 0$, by the supermartingale version.
            feedback: >
              $S_n$ is a martingale and $T$ is not a stopping time, so no
              version applies. The maximum is at least $S_0 = 0$ on every path.
        feedback: >
          Check the stopping time first and the condition second. Both are
          hypotheses, and either one missing voids the conclusion.


  - node: quant-processes.martingales.ost-supermartingale
    hook: >
      This corollary is the formal reason a house edge can't be out-timed —
      no stop-loss, take-profit, or "quit while ahead" rule turns a
      negative-edge game into a nonnegative-edge one.
    explanation: >
      Applying the same three conditions to a supermartingale inherits the
      one-sided inequality from every finite horizon:
      $\mathbb{E}[X_{T\wedge n}]\le\mathbb{E}[X_0]$ holds unconditionally, so
      passing to the limit under (a), (b) or (c) preserves $\le$ rather than
      $=$. A submartingale reverses the inequality by the mirror argument.

      The practical reading: in a game with negative expected value per
      round, no exit rule — stop-loss, take-profit, quitting once ahead —
      can push the expected outcome above where it started. Every such rule
      is a stopping time, and stopping never helps a supermartingale, only
      preserves or worsens the built-in drift.

      The nonnegative case is genuinely stronger, with zero side conditions:
      if $X_n\ge0$, $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ holds even when
      $\Pr(T=\infty)>0$, using Fatou's lemma rather than any named condition
      — nonnegativity alone survives an unbounded, possibly infinite stopping
      time. Fair games can genuinely be broken by unboundedly patient
      stopping (the doubling strategy), but an unfavorable nonnegative one
      cannot be rescued by it.
    worked: >
      A trader's wealth $X_n\ge0$ is a supermartingale with $X_0=100$ under a
      strategy with a small negative edge, and they exit at $T$, the first
      time wealth doubles to $200$ or hits $0$, with $\Pr(T=\infty)>0$
      possible. Nonnegativity alone gives $\mathbb{E}[X_T]\le100$, so if
      wealth ever hits $200$ with probability $p$,
      $200p\le\mathbb{E}[X_T]\le100$ already forces $p\le0.5$ — a genuine
      bound with no further computation.
    interview: >
      "Can a stop-loss rule make a losing strategy profitable?" is answered
      immediately by this corollary. A sharper version asks about the
      nonnegative case ("what if the trader can't go into debt") to check
      whether you know it needs no side conditions at all.
    pitfalls: >
      Assuming the nonnegative-supermartingale bound needs one of the three
      optional-stopping conditions verified — it doesn't; nonnegativity alone
      suffices via Fatou. Reversing the sub-/supermartingale inequality
      direction under time pressure.
    recap: >
      Optional stopping never helps a supermartingale,
      $\mathbb{E}[X_T]\le\mathbb{E}[X_0]$ under the usual conditions, and for
      nonnegative wealth that bound holds even with an unbounded, possibly
      infinite stopping time.
    dialogue:
      - part: Quitting while ahead
        teach: >
          A slot machine: each spin costs you $1$ chip and returns $5$ with
          probability $1/6$, so your stack moves $+4$ with probability $1/6$
          and $-1$ with probability $5/6$, independently each spin. You sit
          down with $30$ chips.
      - ask: >
          What is the expected change in your stack per spin?
        expects: "-1/6"
        feedback: >
          $\tfrac{1}{6}(4) + \tfrac{5}{6}(-1) = -\tfrac{1}{6}$. Your stack is a
          supermartingale.
      - ask: >
          A friend's rule: spin until you are ahead of $30$ by any amount, and
          give up after $100$ spins if that never happens. Most nights this
          rule walks away ahead. What about $\mathbb{E}[X_T]$?
        choices:
          - text: >
              Above $30$: the rule locks in a profit on most nights.
            feedback: >
              It does end ahead often — by a few chips. The nights it does not,
              it has played up to $100$ spins at $-1/6$ each. Frequency of
              winning is not the mean.
          - text: >
              At most $30$.
            correct: true
            feedback: >
              The rule is a stopping time bounded by $100$, and stopping a
              supermartingale cannot lift its mean.
          - text: >
              Exactly $30$, since stopping does not change the mean.
            feedback: >
              That is the fair-game statement. Here every spin you take costs
              $1/6$ in expectation, so the mean ends strictly below $30$.
        feedback: >
          Quitting while ahead reshapes the distribution — many small wins,
          occasional long losing nights — and leaves the mean below where it
          started.
      - reflect: >
          A stopping rule only decides whether to take another spin. Explain
          why no rule of this kind, however clever, can push the mean above
          $30$.
        answer: >
          Each spin you choose to take has conditional mean $-1/6$ given
          everything you have seen, and each spin you decline contributes
          $0$. Your final stack is $30$ plus a sum of terms, each of which is
          at most $0$ in conditional expectation — a nonnegative predictable
          stake ($1$ while playing, $0$ after) on a supermartingale. So the
          stopped stack is a supermartingale, and its mean can only fall.

      - part: The bound, and when it needs nothing
        teach: >
          Optional stopping for unfavourable games: if $(X_n)$ is a
          supermartingale and $T$ satisfies one of the optional stopping
          conditions, then $\mathbb{E}[X_T] \le \mathbb{E}[X_0]$; for a
          submartingale the inequality reverses. And if the supermartingale is
          nonnegative, $\mathbb{E}[X_T] \le \mathbb{E}[X_0]$ holds with no
          conditions at all — even when $\Pr(T = \infty) > 0$, reading $X_T$
          as the limit — by Fatou's lemma.
      - ask: >
          New rule: spin until you hold at least $40$ chips or are broke, with
          no cap on spins. Give the best upper bound this supplies for the
          probability you walk away with $40$ or more.
        expects: "3/4"
        hint: >
          Your stack never goes below $0$, so $\mathbb{E}[X_T] \ge 40 \Pr(X_T
          \ge 40)$.
        feedback: >
          $40 \Pr(X_T \ge 40) \le \mathbb{E}[X_T] \le 30$, so the probability
          is at most $30/40 = 3/4$. A crude bound — the edge makes the truth
          much smaller — but it costs one line.
      - ask: >
          Which hypothesis did you need to check for that bound?
        choices:
          - text: >
              That $T$ is bounded, which it is not — so the bound is
              unjustified.
            feedback: >
              Boundedness is one way in, but a nonnegative supermartingale
              needs none of the three conditions. Fatou's lemma handles
              unbounded, even infinite, $T$.
          - text: >
              That $\mathbb{E}[T] < \infty$ and the steps are bounded.
            feedback: >
              Both happen to be true here, but you did not need them. The
              nonnegative case is free.
          - text: >
              Only that the stack is a nonnegative supermartingale and $T$ is
              a stopping time.
            correct: true
            feedback: >
              You cannot owe the machine chips, so the stack is nonnegative,
              and that alone carries the inequality to any stopping time.
        feedback: >
          Nonnegativity is the side condition that comes for free whenever a
          player cannot go into debt.
      - ask: >
          Contrast: a *fair* coin game on unlimited credit, starting at $30$,
          stopped at the first time you hold $40$. The fair walk reaches $40$
          with probability $1$, so $\mathbb{E}[X_T] = 40$. Why does that not
          contradict the bound you just used?
        choices:
          - text: >
              A fair game is not a supermartingale.
            feedback: >
              A martingale is a supermartingale (and a submartingale). The
              inequality would apply if its hypotheses held.
          - text: >
              On credit the stack is not bounded below, and no optional
              stopping condition holds.
            correct: true
            feedback: >
              The paths that dip far below $0$ before recovering carry the
              missing mean. Remove the credit line and the stack is
              nonnegative; then $\mathbb{E}[X_T] \le 30$ again.
          - text: >
              $T$ is infinite with positive probability.
            feedback: >
              The fair walk reaches $40$ with probability $1$. The time is
              finite; its mean is not, and the walk is unbounded below.
        feedback: >
          Fair games can be broken by unbounded stopping; unfavourable
          nonnegative ones cannot. That asymmetry is the useful part.

      - part: Pricing a rule exactly
        ask: >
          From the machine's side: its take from your table is a submartingale.
          If you play exactly $60$ spins, what is its expected profit?
        expects: "10"
        feedback: >
          $60 \times \tfrac{1}{6} = 10$ chips. Here $T = 60$ is bounded, so
          the submartingale inequality applies, and with a constant edge it is
          an equality.
      - ask: >
          $X_n + n/6$ is a martingale, with bounded steps. A stopping rule has
          $\mathbb{E}[T] = 12$ spins. What is $\mathbb{E}[X_T]$?
        expects: "28"
        hint: >
          Apply optional stopping to the martingale, not to $X_n$.
        feedback: >
          Condition (c) holds — bounded steps and $\mathbb{E}[T] < \infty$ —
          so $\mathbb{E}[X_T + T/6] = 30$ and
          $\mathbb{E}[X_T] = 30 - \tfrac{12}{6} = 28$. In a game with an edge,
          expected loss is the edge times the expected number of bets, and
          the only way a rule helps is by betting less.


  - node: quant-processes.martingales.ruin-via-ost
    hook: >
      This is the fastest legitimate derivation of both gambler's ruin
      formulas — three lines each, no recurrence to set up, once the right
      martingale and optional-stopping condition are named.
    explanation: >
      Recall the two-barrier absorbing walk: a walker at $k$ between $0$ and
      $N$, stopped at $T$, the first exit. Checking a condition is the first
      move, and it's the same for both cases: any run of $N$ consecutive
      up-moves ends the game, so $T$ is dominated by a geometric number of
      such blocks, giving $\mathbb{E}[T]<\infty$; and the walk is trapped in
      $[0,N]$ until it stops, so $0\le S_{T\wedge n}\le N$ — both (b) and (c)
      hold at once.

      In the fair case, $S_n$ itself is the zoo's martingale, so optional
      stopping gives $k=\mathbb{E}[S_0]=\mathbb{E}[S_T]$. Since $S_T$ is $N$
      with probability $\Pr(\text{hit }N)$ and $0$ otherwise,
      $\mathbb{E}[S_T]=N\Pr(\text{hit }N)$ directly, so
      $\Pr(\text{hit }N)=k/N$ — one substitution into optional stopping.

      The biased case swaps in the geometric martingale $(q/p)^{S_n}$, which
      is automatically bounded on $[0,N]$. Optional stopping gives
      $(q/p)^{k}=u(q/p)^{N}+(1-u)$ where $u=\Pr(\text{hit }N)$, a single
      linear equation solved for $u=\dfrac{1-(q/p)^{k}}{1-(q/p)^{N}}$.
    worked: >
      Take $k=3$, $N=5$, biased with $p=0.4$ so $q/p=1.5$. Then
      $u=\dfrac{1-1.5^{3}}{1-1.5^{5}}=\dfrac{1-3.375}{1-7.59375}=
      \dfrac{-2.375}{-6.59375}\approx0.3602$: about a $36\%$ chance of
      reaching $5$ before $0$, despite starting past the midpoint — the bias
      against the walker dominates the head start.
    interview: >
      "Derive the gambler's ruin probability using martingales" is a direct
      request for this argument — naming $S_n$ or $(q/p)^{S_n}$ and one of
      conditions (b)/(c) is expected within the first thirty seconds.
    pitfalls: >
      Invoking $\mathbb{E}[S_T]=\mathbb{E}[S_0]$ without verifying a
      condition first — boundedness is not automatic without the two-barrier
      setup. Using $S_n$ as the martingale in the biased case — it isn't one
      there; only the recentered or geometric version is.
    recap: >
      Both ruin formulas — $1-k/N$ fair,
      $\dfrac{1-(q/p)^{k}}{1-(q/p)^{N}}$ biased — drop out of optional
      stopping applied to $S_n$ and $(q/p)^{S_n}$, using that the two-barrier
      walk keeps both bounded.
    dialogue:
      - part: A fair duel, in three lines
        teach: >
          Two traders flip a fair coin, and the loser of each flip pays the
          winner $1$. Ann starts with $6$ and Ben with $9$, and they play until
          one of them is broke. Track Ann's money $S_n$: it starts at $6$ and
          stops at $T$, the first time it hits $0$ or $15$.
      - ask: >
          Which martingale do you stop?
        choices:
          - text: >
              $S_n^{2} - n$.
            feedback: >
              That one has time in it, and is the tool for the expected length
              of the duel. For who wins, you want a martingale whose stopped
              value only depends on where the walk ends.
          - text: >
              $S_n$ itself.
            correct: true
            feedback: >
              The coin is fair, so Ann's money has zero drift, and its value at
              $T$ is $0$ or $15$ — exactly the outcome you are asking about.
          - text: >
              $(q/p)^{S_n}$.
            feedback: >
              With $p = q = 1/2$ that is the constant $1$ and says nothing.
        feedback: >
          For a probability, stop a martingale whose stopped value encodes the
          event.
      - ask: >
          Which optional stopping condition do you name?
        choices:
          - text: >
              (a): the duel lasts at most $15$ flips.
            feedback: >
              The money can slosh back and forth for as long as the coin
              likes. $T$ is finite with probability $1$ but not bounded.
          - text: >
              (b): $0 \le S_{T \wedge n} \le 15$ for every $n$.
            correct: true
            feedback: >
              Ann's money is trapped between the walls until it stops. One
              line.
          - text: >
              None: the walk is fair, so $\mathbb{E}[S_T] = \mathbb{E}[S_0]$
              automatically.
            feedback: >
              A fair walk stopped at its first visit to $15$, with no lower
              wall, would give $\mathbb{E}[S_T] = 15 \ne 6$. Fairness alone
              never licenses the limit.
        feedback: >
          Name the martingale, name the condition, then compute.
      - ask: >
          What is the probability Ann ends with all $15$?
        expects: "2/5"
        feedback: >
          $6 = \mathbb{E}[S_T] = 15 \Pr(\text{Ann wins}) + 0$, so the
          probability is $6/15 = 2/5$. Her share of the money is her chance of
          winning it all.

      - part: Deuce, with a better player
        teach: >
          Deuce in tennis: the game ends when one player is two points ahead.
          You win each point with probability $p = 2/3$, independently. Track
          your lead plus $2$: it starts at $S_0 = 2$, moves $\pm 1$ per point,
          and stops at $0$ (you lose) or $4$ (you win).
      - ask: >
          What is the drift of $S_n$ per point?
        expects: "1/3"
        feedback: >
          $\tfrac{2}{3} - \tfrac{1}{3} = \tfrac{1}{3}$. $S_n$ is not a
          martingale, so stopping it gives nothing directly.
      - reflect: >
          You need a function of the position, not of time, whose conditional
          expectation does not drift, and which stays bounded between the
          walls. Which one, and why does stopping it give the winning
          probability?
        answer: >
          The geometric martingale $(q/p)^{S_n} = (1/2)^{S_n}$: each point
          multiplies it by $2^{-1}$ or $2$ with probabilities $2/3$ and $1/3$,
          averaging $\tfrac{1}{3} + \tfrac{2}{3} = 1$. Between the walls it
          lies between $(1/2)^{4}$ and $1$, so condition (b) holds. At $T$ it
          takes one value at each wall, so its mean is a linear function of the
          probability you want.
      - ask: >
          What is $\mathbb{E}[(1/2)^{S_T}]$?
        expects: "1/4"
        feedback: >
          Optional stopping: $\mathbb{E}[(1/2)^{S_T}] = (1/2)^{S_0} =
          (1/2)^{2} = 1/4$.
      - ask: >
          Let $u$ be the probability you win the game from deuce. Solve for
          $u$.
        expects: "4/5"
        hint: >
          At a win $S_T = 4$; at a loss $S_T = 0$.
        feedback: >
          $u (1/2)^{4} + (1 - u)(1/2)^{0} = 1/4$, so $1 - \tfrac{15}{16}u =
          \tfrac{1}{4}$ and $u = \tfrac{3}{4} \cdot \tfrac{16}{15} =
          \tfrac{4}{5}$. Check against first-step reasoning from deuce:
          $p^{2}/(p^{2} + q^{2}) = \tfrac{4/9}{5/9} = \tfrac{4}{5}$.

      - part: Earning the condition, and where it breaks
        ask: >
          To use these arguments you need $\Pr(T < \infty) = 1$. Why does a
          walk between two walls stop with probability $1$?
        choices:
          - text: >
              Because it is biased, so it drifts to a wall.
            feedback: >
              The fair duel stops too, with no drift at all. Drift is not the
              reason.
          - text: >
              Because the walk is bounded between the walls.
            feedback: >
              Bounded in space does not rule out bouncing forever between
              them. Something must force an exit.
          - text: >
              Any run of $N$ straight up-moves ends it, and disjoint blocks of
              $N$ moves each do this with a fixed positive probability.
            correct: true
            feedback: >
              So $T$ is at most $N$ times a geometric number of blocks: finite
              with probability $1$, and $\mathbb{E}[T] < \infty$ as well, which
              is condition (c) for free.
        feedback: >
          The block argument gives both finiteness and a finite mean, and it
          works for any walk whose steps can push it across the gap.
      - ask: >
          The biased formula is
          $u = (1 - (q/p)^{k}) / (1 - (q/p)^{N})$. What happens if you plug in
          a fair coin?
        choices:
          - text: >
              It gives $0/0$: $(q/p)^{S_n}$ is the constant $1$, and you must
              stop $S_n$ instead.
            correct: true
            feedback: >
              The geometric martingale degenerates exactly when the drift
              vanishes. The limit $p \to 1/2$ of the formula is $k/N$, the
              fair answer, as it should be.
          - text: >
              It gives $k/N$ directly.
            feedback: >
              With $q/p = 1$ both numerator and denominator are $0$. You get
              $k/N$ only as a limit, or by switching martingales.
          - text: >
              It gives $1/2$, since the coin is fair.
            feedback: >
              The fair answer depends on the start: $k/N$, which was $2/5$ for
              Ann. Fairness of the coin is not fairness of the duel.
        feedback: >
          Two cases, two martingales, one condition. In an interview, say
          which martingale you stop and that the walk is trapped between the
          walls, and the formula takes three lines.


  - node: quant-processes.martingales.hitting-time-quadratic
    hook: >
      Once the ruin derivation gives the exit probability, this is the
      one-line trick for the exit time: stop the compensated square instead
      of the level.
    explanation: >
      The setup is identical to the ruin derivation — same two barriers,
      same walker starting at $k$ — but the target is $\mathbb{E}[T]$ rather
      than a probability, so the level martingale $S_n$ (whose optional
      stopping identity already used up $S_T$'s information) is swapped for
      the compensated square $S_n^{2}-n$, built precisely to convert time
      into something optional stopping can extract.

      The same condition (c) applies for the same reason as before:
      increments of $S_n^{2}-n$ are bounded by $2N$ while the walk stays
      trapped in $[0,N]$, and $\mathbb{E}[T]<\infty$ is already established.
      Optional stopping gives $\mathbb{E}[S_T^{2}]-\mathbb{E}[T]=k^{2}$
      directly from $S_0^{2}-0=k^{2}$.

      The exit position $S_T$ is already known — $N$ with probability $k/N$,
      $0$ otherwise — so $\mathbb{E}[S_T^{2}]=N^{2}\cdot(k/N)=kN$, and
      rearranging gives $\mathbb{E}[T]=kN-k^{2}=k(N-k)$: the already-computed
      exit position feeds straight back in. Sending $N\to\infty$ in the fair
      case shows the walk reaches $0$ eventually with certainty, yet the
      expected time to do so is infinite — a hitting probability of $1$ says
      nothing about the mean waiting time.
    worked: >
      Start at $k=20$ between barriers $0$ and $N=30$: $\mathbb{E}[T]=
      20(30-20)=200$ tosses expected — smaller than the maximum possible
      duration $N^{2}/4=225$, attained at the midpoint $k=15$.
    interview: >
      "How long does gambler's ruin take, on average?" wants $k(N-k)$
      produced by stopping $S_n^{2}-n$, contrasted explicitly with the
      hitting-probability computation to show which martingale answers which
      question.
    pitfalls: >
      Reusing $S_n$ to try to extract an expected time — it was already
      spent on the hitting probability and carries no time information; only
      the compensated square does. Treating infinite expected time for the
      unbounded walk as a contradiction with certain absorption — it isn't;
      the two facts coexist.
    recap: >
      Stopping $S_n^{2}-n$ instead of $S_n$ converts the already-known exit
      position into the exit time, giving $\mathbb{E}[T]=k(N-k)$ in one line.
    dialogue:
      - part: The martingale that cannot see time
        teach: >
          A fair $\pm 1$ walk starts at $3$ and is absorbed at $0$ or $8$. The
          interviewer already knows you can find who wins. This time the
          question is: how many steps does it take, on average?
      - ask: >
          Your first instinct is to stop $S_n$ again. What does that give you?
        choices:
          - text: >
              $\mathbb{E}[T]$, once you know where the walk ends.
            feedback: >
              $\mathbb{E}[S_T] = 3$ is an equation about the exit position.
              $T$ appears nowhere in it, so it cannot be solved for $T$.
          - text: >
              Only where it ends: $\Pr(S_T = 8) = 3/8$.
            correct: true
            feedback: >
              $8u = 3$. Useful — you will need it — but it says nothing about
              how long the walk took to get there.
          - text: >
              Nothing at all, since $S_n$ is not a martingale here.
            feedback: >
              The walk is fair, so $S_n$ is a martingale and the stopped walk
              is bounded. It gives the exit probability, just not the time.
        feedback: >
          $S_n$ has no $n$ in it. To read off a time you need a martingale that
          has time inside it.
      - reflect: >
          Which martingale from the zoo has $n$ in it, and why would stopping
          it turn the exit position — which you now know — into the expected
          time?
        answer: >
          The compensated square $S_n^{2} - n$. Stopping it gives
          $\mathbb{E}[S_T^{2}] - \mathbb{E}[T] = S_0^{2}$, and the only unknown
          is $\mathbb{E}[T]$, because $\mathbb{E}[S_T^{2}]$ depends only on
          where the walk exits — which the level martingale has just told you.
      - ask: >
          What is $\mathbb{E}[S_T^{2}]$?
        expects: "24"
        feedback: >
          $S_T = 8$ with probability $3/8$ and $0$ otherwise:
          $64 \cdot \tfrac{3}{8} = 24$.
      - ask: >
          So what is $\mathbb{E}[T]$?
        expects: "15"
        feedback: >
          $\mathbb{E}[S_T^{2}] - \mathbb{E}[T] = 3^{2}$, so
          $\mathbb{E}[T] = 24 - 9 = 15$. In general $kN - k^{2} = k(N - k)$:
          here $3 \times 5$.

      - part: Which condition, this time
        ask: >
          Which optional stopping condition licenses stopping
          $S_n^{2} - n$?
        choices:
          - text: >
              (b): the walk is trapped in $[0, 8]$, so the process is bounded.
            feedback: >
              $S_{T \wedge n}^{2}$ is bounded by $64$, but the $-n$ term is
              not: $-(T \wedge n)$ can be as negative as you like. (b) fails.
          - text: >
              (a): the walk exits within $64$ steps.
            feedback: >
              It need not; it can bounce inside $[1, 7]$ indefinitely. $T$ is
              not bounded.
          - text: >
              (c): before $T$ its increments are $2 S_n X_{n+1}$, at most $16$
              in size, and $\mathbb{E}[T] < \infty$.
            correct: true
            feedback: >
              $(S + X)^{2} - (n+1) - (S^{2} - n) = 2SX + X^{2} - 1 = 2SX$, and
              $|S| \le 8$ inside. The finite mean comes from the block argument
              for the two-wall walk.
        feedback: >
          The level martingale ran on (b); the compensated square runs on
          (c). Naming the right one is half the answer.
      - ask: >
          For the same walls $0$ and $8$, where should the walk start to make
          the game last longest on average, and how long is that?
        expects: "16"
        hint: >
          Maximise $k(8 - k)$ over $k$.
        feedback: >
          $k(N - k)$ is largest at the midpoint, $k = 4$: $4 \times 4 = 16 =
          N^{2}/4$. Starting one step from a wall gives only $1 \times 7 = 7$.

      - part: A biased walk needs a different compensator
        teach: >
          Now the walk steps $+1$ with probability $2/3$ and $-1$ with
          probability $1/3$, starts at $1$, and is absorbed at $0$ or $3$.
          The geometric martingale gives $\Pr(\text{reach } 3) = 4/7$.
      - ask: >
          Which martingale returns $\mathbb{E}[T]$ for this walk?
        choices:
          - text: >
              $S_n^{2} - n$, as before.
            feedback: >
              That is the fair walk's compensated square. Here
              $\mathbb{E}[S_{n+1}^{2} \mid \mathcal{F}_n] = S_n^{2} +
              \tfrac{2}{3} S_n + 1$, which depends on the state.
          - text: >
              $(1/2)^{S_n}$.
            feedback: >
              That is the geometric martingale. It has no $n$ in it, so it
              gives the exit probability, which you already have.
          - text: >
              $S_n - n/3$.
            correct: true
            feedback: >
              The drift is $\tfrac{2}{3} - \tfrac{1}{3} = \tfrac{1}{3}$ per step,
              so the centred walk carries time in its compensator. Its steps
              are bounded and $\mathbb{E}[T] < \infty$, so (c) applies.
        feedback: >
          With drift, the level itself already carries time: subtract the
          drift and stop.
      - ask: >
          Compute $\mathbb{E}[T]$.
        expects: "15/7"
        hint: >
          $\mathbb{E}[S_T] - \tfrac{1}{3}\mathbb{E}[T] = 1$, and
          $\mathbb{E}[S_T] = 3 \cdot \tfrac{4}{7}$.
        feedback: >
          $\mathbb{E}[S_T] = \tfrac{12}{7}$, so $\tfrac{1}{3}\mathbb{E}[T] =
          \tfrac{12}{7} - 1 = \tfrac{5}{7}$ and $\mathbb{E}[T] = \tfrac{15}{7}$.
          Check by first-step analysis: $t_1 = 1 + \tfrac{2}{3} t_2$ and
          $t_2 = 1 + \tfrac{1}{3} t_1$ give $t_1 = 15/7$.
      - ask: >
          Back to the fair walk from $3$, but remove the upper wall: $N \to
          \infty$. What happens?
        choices:
          - text: >
              The walk might never reach $0$, since there is no upper wall to
              push it back.
            feedback: >
              The probability of reaching $0$ is $1 - 3/N \to 1$. The fair walk
              reaches $0$ with certainty.
          - text: >
              It reaches $0$ with probability $1$, but $\mathbb{E}[T] = 3(N - 3)
              \to \infty$.
            correct: true
            feedback: >
              Certain to arrive, infinitely long to wait on average. The two
              facts coexist, and the infinite mean is exactly why optional
              stopping fails for a fair walk with only one wall.
          - text: >
              $\mathbb{E}[T]$ stays near $15$, since most paths are absorbed
              quickly.
            feedback: >
              Most paths are, but rare long excursions upward carry an
              ever-larger share of the mean. $3(N - 3)$ grows without bound.
        feedback: >
          The interview answer: stop $S_n$ for where, $S_n^{2} - n$ for how
          long, and name condition (c) for the second.


  - node: quant-processes.martingales.wald
    hook: >
      Wald's identity answers "how much do I expect to have accumulated by
      the time I decide to stop" — a shockingly common shape in problems
      about random sums and sequential stopping rules.
    explanation: >
      The cleanest proof of $\mathbb{E}[S_N]=\mu\,\mathbb{E}[N]$ avoids side
      conditions altogether: write
      $S_N=\sum_{i\ge1}X_i\mathbf{1}\{N\ge i\}$, and note
      $\{N\ge i\}=\{N\le i-1\}^{c}$ is decided by $X_1,\dots,X_{i-1}$ alone —
      the defining property of a stopping time — so it's independent of
      $X_i$ itself.

      That independence lets the sum's expectation split term by term:
      $\mathbb{E}[S_N]=\sum_i\mathbb{E}[X_i]\Pr(N\ge i)=
      \mu\sum_i\Pr(N\ge i)=\mu\,\mathbb{E}[N]$, using the standard tail-sum
      identity for expectation.

      That independence — $N$ may look backward at $X_1,\dots,X_{i-1}$ but
      never forward at $X_i$ — is the entire hypothesis, and it's exactly the
      stopping-time condition restated. A stopping rule chosen with
      foresight (knowing $X_i$ before deciding whether $N\ge i$) breaks the
      identity outright.
    worked: >
      Roll a fair six-sided die until the first $6$: $N$ is geometric with
      $\mathbb{E}[N]=6$, and $\mu=3.5$ is the mean of one roll. Wald gives
      $\mathbb{E}[S_N]=3.5\times6=21$. Directly: on average $5$ non-six rolls
      (each averaging $3$ among $\{1,\dots,5\}$) plus the final $6$ give
      $5(3)+6=21$, matching exactly.
    interview: >
      "What's the expected total of a randomly stopped sum?" is Wald's
      identity by name; interviewers listen for the independence hypothesis
      stated — the stopping rule can't look ahead — not just the formula
      recited.
    pitfalls: >
      Applying Wald's identity when $N$ depends on future increments (e.g.
      "stop after the sum first exceeds its own eventual maximum") — the
      needed independence is silently false there. Using the wrong $\mu$ —
      it's the increment mean, not a mean conditional on stopping.
    recap: >
      $\mathbb{E}[S_N]=\mu\,\mathbb{E}[N]$ because $\{N\ge i\}$ depends only
      on $X_1,\dots,X_{i-1}$ and is therefore independent of $X_i$ — a
      stopping rule that never looks ahead is the whole hypothesis.
    dialogue:
      - part: A guess and a doubt
        teach: >
          A fair coin is tossed repeatedly. Each head pays you $3$ and each
          tail costs you $1$. You stop at $N$, the first toss that matches the
          toss just before it — the first HH or TT. What are your expected
          total winnings $\mathbb{E}[S_N]$?
      - ask: >
          Start with the length. What is $\mathbb{E}[N]$?
        expects: "3"
        hint: >
          After the first toss, each new toss matches the previous one with
          probability $1/2$.
        feedback: >
          The first toss cannot end the game; after it, the wait for a match is
          geometric with success probability $1/2$, mean $2$. So
          $\mathbb{E}[N] = 1 + 2 = 3$.
      - ask: >
          Each toss pays $3$ or $-1$ with equal probability, mean $1$.
          Multiplying expected count by mean payoff, what do you get?
        expects: "3"
        feedback: >
          $3 \times 1 = 3$. That is the right answer here — but the reasoning
          deserves suspicion, because $N$ is decided by the very tosses being
          summed.
      - ask: >
          Test the multiplication on a different rule: keep tossing while you
          see heads, and stop just *before* the first tail, so $N_B$ counts
          the heads before the first tail. What is $\mathbb{E}[S_{N_B}]$?
        expects: "3"
        hint: >
          Every toss you keep is a head, and $\mathbb{E}[N_B] = 1$.
        feedback: >
          All kept tosses are heads, so $S_{N_B} = 3 N_B$ and
          $\mathbb{E}[S_{N_B}] = 3 \cdot 1 = 3$. But mean payoff times expected
          count is $1 \times 1 = 1$. The multiplication fails for this rule.
      - ask: >
          What distinguishes the rule where the multiplication failed?
        choices:
          - text: >
              It is shorter on average, so the law of averages has no time to
              act.
            feedback: >
              The identity is exact for any length, even $\mathbb{E}[N] = 1$.
              The problem is not sample size; it is which tosses get kept.
          - text: >
              Whether toss $i$ is kept depends on toss $i$ itself.
            correct: true
            feedback: >
              Rule B keeps toss $i$ only if it is a head — it peeks. The match
              rule decides whether to take toss $i$ from tosses $1$ through
              $i-1$, and only then looks.
          - text: >
              Its $N$ can be $0$.
            feedback: >
              An empty sum is $0$, which is harmless. Shift rule B to "stop at
              the first tail, inclusive" and it becomes legitimate, with
              $\mathbb{E}[N] = 2$ and $\mathbb{E}[S_N] = 2$.
        feedback: >
          One rule decides before looking; the other looks before deciding.
      - reflect: >
          Write $S_N = \sum_{i \ge 1} X_i \mathbf{1}\{N \ge i\}$. For the
          expected sum to split as $\mu \sum_i \Pr(N \ge i)$, what has to be
          true of each pair $X_i$ and $\mathbf{1}\{N \ge i\}$, and why does a
          stopping time guarantee it?
        answer: >
          Each indicator has to be independent of the $X_i$ it multiplies, so
          that $\mathbb{E}[X_i \mathbf{1}\{N \ge i\}] = \mu \Pr(N \ge i)$. For a
          stopping time, $\{N \ge i\}$ is the complement of $\{N \le i - 1\}$,
          decided by $X_1, \dots, X_{i-1}$, which are independent of $X_i$.
          Then $\sum_i \Pr(N \ge i) = \mathbb{E}[N]$ finishes it. Rule B fails
          the first step: $\{N_B \ge i\}$ requires $X_i$ to be a head.

      - part: Wald's identity, and an instance
        teach: >
          Wald's identity: let $X_1, X_2, \dots$ be iid with
          $\mathbb{E}|X_1| < \infty$ and mean $\mu$, and $N$ a stopping time
          for the sequence with $\mathbb{E}[N] < \infty$. Then
          $\mathbb{E}[S_N] = \mu \, \mathbb{E}[N]$. The stopping rule may look
          at everything already drawn, and nothing not yet drawn.
      - ask: >
          Roll a fair die until two consecutive rolls are equal. What is the
          expected total of all the rolls, including the last?
        expects: "49/2"
        hint: >
          Find $\mathbb{E}[N]$ the way you did for the coin.
        feedback: >
          After the first roll, each roll matches the previous with probability
          $1/6$, so $\mathbb{E}[N] = 1 + 6 = 7$. Wald gives
          $3.5 \times 7 = 24.5$, without ever asking how the rolls are
          distributed given that the game is still running.
      - ask: >
          Run Wald backwards. A walk steps $+1$ with probability $3/5$ and
          $-1$ with probability $2/5$, from $0$, and $N$ is the first time it
          reaches $+4$. What is $\mathbb{E}[N]$?
        expects: "20"
        hint: >
          You know $S_N$ exactly.
        feedback: >
          $S_N = 4$ and $\mu = \tfrac{3}{5} - \tfrac{2}{5} = \tfrac{1}{5}$, so
          $4 = \tfrac{1}{5}\mathbb{E}[N]$ and $\mathbb{E}[N] = 20$. The upward
          drift makes $\mathbb{E}[N]$ finite; that hypothesis is earned, not
          assumed.

      - part: Where the identity breaks
        ask: >
          A fair $\pm 1$ walk from $0$, and $N$ is the first time it reaches
          $+4$, which it does with probability $1$. Then $S_N = 4$ but
          $\mu \, \mathbb{E}[N] = 0 \cdot \mathbb{E}[N]$. What fails?
        choices:
          - text: >
              $N$ is not a stopping time.
            feedback: >
              "First time at $+4$" is decided by the path so far. It is a
              stopping time.
          - text: >
              The steps are not integrable.
            feedback: >
              They are $\pm 1$. Integrability is the easiest hypothesis here.
          - text: >
              $\mathbb{E}[N] = \infty$, so the right side is $0 \cdot \infty$
              and the identity does not apply.
            correct: true
            feedback: >
              A driftless walk reaches a level with certainty but takes
              infinitely long on average. Wald needs $\mathbb{E}[N] < \infty$,
              and the drift of $1/5$ in the last question is what supplied it.
        feedback: >
          Two hypotheses, both load-bearing: $N$ must not look ahead, and
          $\mathbb{E}[N]$ must be finite. Say both when you quote it.


  - node: quant-processes.martingales.wald-second
    hook: >
      The natural next question after Wald's mean identity is variance —
      and the honest answer is that the second-moment identity is easy while
      the actual variance of a stopped sum usually is not.
    explanation: >
      Wald's second identity is the compensated-square idea applied with a
      stopping time instead of a fixed time: $(S_n-n\mu)^{2}-n\sigma^{2}$ is
      a martingale (the general iid version of $S_n^{2}-n$), and stopping it
      at $N$ with $\mathbb{E}[N]<\infty$ gives
      $\mathbb{E}[(S_N-N\mu)^{2}]=\sigma^{2}\mathbb{E}[N]$ directly.

      When $\mu=0$ this reads $\mathbb{E}[S_N^{2}]=\sigma^{2}\mathbb{E}[N]$,
      the general form of exactly the computation already used for the fair
      walk's expected duration, restated for any mean-zero iid summands, not
      just $\pm1$ steps.

      What it is not: $\operatorname{Var}(S_N)$. The variance of a randomly
      stopped sum is
      $\operatorname{Var}(S_N)=\sigma^{2}\mathbb{E}[N]+\mu^{2}
      \operatorname{Var}(N)$, and that formula needs $N$ independent of the
      increment sequence — a strictly stronger hypothesis than "$N$ is a
      stopping time." For a walk stopped at a barrier, $N$ and the increments
      are as dependent as two quantities can be, so the random-sums variance
      formula is simply false there, while Wald's second identity — built
      for exactly this dependence — still holds.
    worked: >
      Fair $\pm1$ walk, $\mu=0$, $\sigma^{2}=1$, stopped at $T$ = first exit
      from $[0,10]$ starting at $k=4$: Wald's second identity gives
      $\mathbb{E}[S_T^{2}]=\mathbb{E}[T]$. From the duration formula,
      $\mathbb{E}[T]=k(N-k)=4(10-4)=24$, so $\mathbb{E}[S_T^{2}]=24$ as well
      — the same number read two ways.
    interview: >
      "Is $\mathbb{E}[(S_N-N\mu)^{2}]$ the same as $\operatorname{Var}(S_N)$?"
      is asked precisely to catch this conflation; the correct answer
      distinguishes them and names the independence hypothesis the variance
      formula needs that Wald's identity does not.
    pitfalls: >
      Quoting $\operatorname{Var}(S_N)=\sigma^{2}\mathbb{E}[N]$ for a
      stopping time dependent on the increments — that formula needs $N$
      independent of the sequence, which fails for essentially every
      barrier-hitting stopping time. Forgetting $\mu=0$ must hold literally,
      not just approximately.
    recap: >
      $\mathbb{E}[(S_N-N\mu)^{2}]=\sigma^{2}\mathbb{E}[N]$ holds for any
      stopping time with $\mathbb{E}[N]<\infty$, but it is not
      $\operatorname{Var}(S_N)$, which needs the strictly stronger hypothesis
      that $N$ is independent of the increments.
    dialogue:
      - part: An exit time that the mean cannot see
        teach: >
          A price ticks once a second: up $1$ with probability $1/4$, down $1$
          with probability $1/4$, unchanged with probability $1/2$,
          independently. It starts at $0$. How long, on average, until it is
          $3$ away from where it started?
      - ask: >
          What is the variance $\sigma^{2}$ of one tick?
        expects: "1/2"
        feedback: >
          The mean is $0$, so $\sigma^{2} = \mathbb{E}[X^{2}] = \tfrac{1}{4} +
          \tfrac{1}{4} = \tfrac{1}{2}$.
      - ask: >
          Let $T$ be the first time the price hits $\pm 3$. What does Wald's
          identity $\mathbb{E}[S_T] = \mu \, \mathbb{E}[T]$ tell you about
          $\mathbb{E}[T]$?
        choices:
          - text: >
              $\mathbb{E}[T] = 3/\mu$.
            feedback: >
              $\mu = 0$, so that divides by zero. And $\mathbb{E}[S_T]$ is $0$
              by symmetry, not $3$.
          - text: >
              Nothing: both sides are $0$ whatever $\mathbb{E}[T]$ is.
            correct: true
            feedback: >
              $\mathbb{E}[S_T] = 0$ by symmetry and $\mu = 0$, so the identity
              reads $0 = 0$. The first moment of a driftless walk carries no
              time.
          - text: >
              $\mathbb{E}[T] = \infty$, since a driftless walk takes forever.
            feedback: >
              That is true of a walk with one wall. With walls at $-3$ and
              $+3$, any six up-ticks in a row end the game, so $T$ is at most
              six times a geometric number of blocks, and its mean is
              finite.
        feedback: >
          The time must be hiding in the second moment.
      - reflect: >
          At the exit, $S_T^{2} = 9$ on every path. Which martingale would
          turn that fact into $\mathbb{E}[T]$, and what identity would it give
          for a general stopping time?
        answer: >
          The compensated square $S_n^{2} - n\sigma^{2}$: each tick adds
          $\sigma^{2}$ to $\mathbb{E}[S^{2}]$ and the compensator removes it.
          Stopping it gives $\mathbb{E}[S_T^{2}] = \sigma^{2}\mathbb{E}[T]$ —
          the exit position's second moment, which you know, equals the
          variance per step times the expected time, which you want.

      - part: Wald's second identity
        teach: >
          With iid steps of mean $\mu$ and variance $\sigma^{2} < \infty$, and
          a stopping time $N$ with $\mathbb{E}[N] < \infty$:
          $\mathbb{E}[(S_N - N\mu)^{2}] = \sigma^{2}\,\mathbb{E}[N]$. It is the
          compensated square $(S_n - n\mu)^{2} - n\sigma^{2}$, stopped. When
          $\mu = 0$ it reads $\mathbb{E}[S_N^{2}] = \sigma^{2}\mathbb{E}[N]$ —
          an exit position converted into an exit time.
      - ask: >
          Compute $\mathbb{E}[T]$ for the ticking price.
        expects: "18"
        feedback: >
          $\mathbb{E}[S_T^{2}] = 9$, so $9 = \tfrac{1}{2}\mathbb{E}[T]$ and
          $\mathbb{E}[T] = 18$ seconds.
      - ask: >
          A plain $\pm 1$ walk has $\sigma^{2} = 1$, so the same identity gives
          it $9$ steps on average to get $3$ away. Why does the ticking price
          take exactly twice as long?
        choices:
          - text: >
              It moves only half the time, so its variance per tick is halved.
            correct: true
            feedback: >
              $\sigma^{2} = 1/2$ instead of $1$. The exit time is
              $9/\sigma^{2}$, so halving the variance doubles it. Equivalently:
              throw away the idle ticks and it is the plain walk.
          - text: >
              Its steps are smaller on average.
            feedback: >
              Every nonzero step is still $\pm 1$. What changes is how often a
              step happens — which is exactly what the variance per tick
              records.
          - text: >
              It is a coincidence of the numbers.
            feedback: >
              It is exact for any width: $\mathbb{E}[T] = a^{2}/\sigma^{2}$ for
              walls at $\pm a$ with no overshoot.
        feedback: >
          For a driftless walk, exit time scales as distance squared over
          variance per step.

      - part: With drift, and the formula it is not
        teach: >
          Now a walk with drift: $+1$ with probability $3/4$, $-1$ with
          probability $1/4$, from $0$, and $N$ is the first time it reaches
          $+2$. So $\mu = 1/2$, $\sigma^{2} = 1 - \mu^{2} = 3/4$, and
          $S_N = 2$ on every path.
      - ask: >
          What is $\mathbb{E}[N]$?
        expects: "4"
        feedback: >
          Wald's first identity: $2 = \tfrac{1}{2}\mathbb{E}[N]$, so
          $\mathbb{E}[N] = 4$.
      - ask: >
          Now use the second identity to find $\operatorname{Var}(N)$.
        expects: "12"
        hint: >
          $S_N - N\mu = 2 - N/2$, and its mean is $0$.
        feedback: >
          $\mathbb{E}[(2 - N/2)^{2}] = \tfrac{3}{4} \cdot 4 = 3$. Since
          $2 - N/2$ has mean $0$, that is its variance, which is
          $\tfrac{1}{4}\operatorname{Var}(N)$. So $\operatorname{Var}(N) = 12$.
      - ask: >
          A colleague computes $\operatorname{Var}(S_N) = \sigma^{2}\mathbb{E}[N]
          + \mu^{2}\operatorname{Var}(N) = 3 + \tfrac{1}{4} \cdot 12 = 6$. But
          $S_N = 2$ always, so its variance is $0$. What went wrong?
        choices:
          - text: >
              The colleague should have used $\operatorname{Var}(N) = 4$.
            feedback: >
              No value of $\operatorname{Var}(N)$ rescues it: the formula gives
              at least $\sigma^{2}\mathbb{E}[N] = 3 > 0$. The formula itself
              does not apply.
          - text: >
              That formula needs $N$ independent of the steps, and here $N$ is
              decided by them.
            correct: true
            feedback: >
              The random-sum variance formula is for a count drawn separately
              from the summands. A stopping time at a barrier is as dependent
              on the steps as anything can be.
          - text: >
              That formula needs $\mu = 0$.
            feedback: >
              It is designed for any $\mu$ — the $\mu^{2}\operatorname{Var}(N)$
              term is there for drift. The missing hypothesis is independence.
        feedback: >
          $\mathbb{E}[(S_N - N\mu)^{2}]$ is not $\operatorname{Var}(S_N)$. The
          first holds for any stopping time with finite mean; the second needs
          $N$ independent of the sequence. Interviewers ask this exact question
          to see whether you keep them apart.


  - node: quant-processes.martingales.abracadabra
    hook: >
      This is the single most famous martingale interview problem — a team
      of gamblers betting on future letters converts a hopeless
      combinatorial waiting-time question into three lines of optional
      stopping.
    explanation: >
      The trick is a fair casino rather than direct analysis. Just before
      second $n$, a brand-new gambler stakes $1$ unit on letter $n$ being A
      at fair odds $26$-to-$1$; if correct, the entire $26$ units parlay onto
      the next letter being B, and so on — each gambler's wealth is a fair
      game (bet-then-parlay at fair odds has expectation $1$ at every
      stage), and any gambler who loses drops to $0$ and stays there.

      Because each gambler's process is a martingale starting at $1$, the
      pooled wealth $W_n$ makes $M_n=W_n-n$ a martingale starting at $0$ — an
      instance of the level-martingale idea, just decorated with a casino
      story. At $T$ (the word first completes), optional stopping applies
      once checked: increments are bounded and $\mathbb{E}[T]<\infty$
      (disjoint $11$-letter blocks each complete the word independently with
      probability $26^{-11}$), licensing $\mathbb{E}[W_T-T]=0$.

      What survives at $T$ is exactly the gamblers whose bets are still
      "live" — those started at a position matching a self-overlap of the
      word with its own prefix. ABRACADABRA overlaps itself at the full
      word, the final "ABRA," and the final "A," so survivors hold
      $26^{11}+26^{4}+26$ units, and $\mathbb{E}[T]$ is exactly that sum.
    worked: >
      Apply the same casino to the shorter word "AA." It overlaps itself at
      $j=2$ (the whole word) and $j=1$ (the final A matches the initial A),
      so survivors hold $26^{2}+26=676+26=702$ units, giving
      $\mathbb{E}[T]=702$ — a self-overlapping doublet, checked the same way.
    interview: >
      "How long until this pattern first appears?" is the canonical prompt;
      naming the casino-of-gamblers construction within the first minute is
      the expected move. Interviewers listen for correctly identifying which
      self-overlaps survive.
    pitfalls: >
      Forgetting a self-overlap — every prefix equal to a suffix of the same
      length contributes a surviving gambler, and missing one undercounts
      $\mathbb{E}[T]$. Assuming $\mathbb{E}[T]<\infty$ needs no
      justification — it's earned by the disjoint-block argument, not free.
    recap: >
      A team of fair gamblers, each parlaying winnings onto the next
      required letter, turns the expected typing time for a pattern into the
      sum of $26^{j}$ over its self-overlaps.
    dialogue:
      - part: Two words, one length
        teach: >
          A sequencer reads DNA bases one per second, each of A, C, G, T with
          probability $1/4$, independently. You want the expected number of
          seconds until the word ACA first appears. Compare it with ACG: same
          length, and each has probability $1/64$ at any given position.
      - ask: >
          Before computing: which word takes longer to appear, on average?
        choices:
          - text: >
              They take the same time: both have probability $1/64$ per
              position.
            feedback: >
              The probability per position is equal, but positions overlap
              and are not independent. How occurrences cluster changes the
              waiting time.
          - text: >
              ACG, since it uses three different bases.
            feedback: >
              Distinct letters make a word unable to overlap itself, and that
              makes it appear sooner, not later.
          - text: >
              ACA, because its last letter could start a new copy.
            correct: true
            feedback: >
              Its last letter can start the next copy, so occurrences of ACA
              come in clumps, as in ACACA. At the same long-run rate of $1/64$
              per position, clumped occurrences leave longer gaps, and a longer
              wait for the first one.
        feedback: >
          The intuition is right; the number needs a construction that
          accounts for overlaps exactly.
      - ask: >
          Run a casino. Just before each second a new gambler arrives with $1$
          unit and bets it that the next base is A, at fair odds: a correct
          call pays $4$ units. If he wins he bets all $4$ on C, then all of
          that on A, and stops once the word is complete. What does a gambler
          hold if he calls all three right?
        expects: "64"
        feedback: >
          $1 \to 4 \to 16 \to 64$. Each bet is fair:
          $\tfrac{1}{4} \cdot 4x + \tfrac{3}{4} \cdot 0 = x$.
      - ask: >
          ACA has just been completed for the first time, at second $T$. What
          is the total held by all the gamblers at that moment?
        expects: "68"
        hint: >
          Check the gamblers who arrived three, two and one seconds ago. Every
          earlier one is already broke.
        feedback: >
          The one who arrived for the final A, C, A holds $64$. The one who
          arrived for the C bet A and lost: $0$. The one who arrived for the
          last A bet A and won: $4$. Total $68$, on every path.
      - reflect: >
          Each gambler plays a fair game, and one unit enters the casino every
          second. Turn that into $\mathbb{E}[T]$.
        answer: >
          Let $W_n$ be the gamblers' total holding after $n$ seconds. Each
          gambler's holding is a martingale starting at $1$, and $n$ of them
          have arrived, so $W_n - n$ is a martingale starting at $0$. Stop it at
          $T$: $\mathbb{E}[W_T - T] = 0$. But $W_T = 68$ on every path, so
          $\mathbb{E}[T] = 68$. The casino pays out exactly what was staked, in
          expectation.

      - part: The casino, and its licence
        teach: >
          The survivors at $T$ are the gamblers whose run started at a
          self-overlap: a length $j$ for which the first $j$ letters of the word
          equal its last $j$ letters. ACA overlaps at $j = 3$ and $j = 1$, so
          $\mathbb{E}[T] = 4^{3} + 4^{1} = 68$. The original problem —
          ABRACADABRA on $26$ letters — overlaps at $11$, $4$ and $1$, giving
          $26^{11} + 26^{4} + 26$.
      - ask: >
          What is the expected waiting time for ACG?
        expects: "64"
        feedback: >
          At its first completion, the gambler who arrived for the C bet A and
          lost, and the one who arrived for the G bet A and lost. Only the
          full-word gambler survives: $4^{3} = 64$. Four seconds less than
          ACA.
      - ask: >
          Which optional stopping condition licenses $\mathbb{E}[W_T - T] = 0$?
        choices:
          - text: >
              (b): at most three gamblers are alive, so $W_n$ is bounded.
            feedback: >
              $W_n$ is bounded, but $W_n - n$ is not: the $-n$ runs off to
              $-\infty$. (b) is about the stopped martingale itself.
          - text: >
              (c): increments are bounded, and $\mathbb{E}[T] < \infty$ because
              each disjoint block of $3$ bases completes the word with
              probability $1/64$.
            correct: true
            feedback: >
              Each second changes $W_n - n$ by a bounded amount, and $T$ is at
              most $3$ times a geometric number of blocks.
          - text: >
              (a): the word must appear within $64$ seconds.
            feedback: >
              Nothing forces that. $T$ is unbounded; its mean is finite.
        feedback: >
          $\mathbb{E}[T] < \infty$ is earned by the disjoint-block argument,
          not assumed.
      - ask: >
          A monkey on a $26$-letter keyboard. Expected keystrokes until ABBA
          first appears?
        expects: "457002"
        hint: >
          Check $j = 1, 2, 3, 4$: does the prefix of length $j$ equal the
          suffix of length $j$?
        feedback: >
          $j = 4$: yes. $j = 3$: ABB versus BBA, no. $j = 2$: AB versus BA, no.
          $j = 1$: A versus A, yes. So $26^{4} + 26 = 456976 + 26 = 457002$.

      - part: What the argument really needs
        ask: >
          Suppose the bases are not uniform: A has probability $1/2$ and C, G,
          T have $1/6$ each, still independent. Does the casino still work?
        choices:
          - text: >
              No: the argument needed every letter equally likely.
            feedback: >
              It needed every bet to be fair. Fair odds on a letter of
              probability $r$ pay $1/r$, and the parlay stays a martingale.
          - text: >
              Yes, with each bet paying $1/r$ for a letter of probability $r$.
            correct: true
            feedback: >
              A survivor whose run has called $j$ letters holds
              $1/\Pr(\text{those } j \text{ letters})$. For ACA that is
              $\tfrac{1}{(1/2)(1/6)(1/2)} + \tfrac{1}{1/2} = 24 + 2 = 26$.
          - text: >
              Yes, and the answer is unchanged at $68$.
            feedback: >
              Payouts change with the letter probabilities, so the survivors'
              total changes. ACA becomes $24 + 2 = 26$: A is now common.
        feedback: >
          What the argument does need is independence: if each base depended
          on the last one, a fair bet on the next letter would depend on the
          history, and the fixed payouts would no longer be fair.


  - node: quant-processes.martingales.pattern-waiting
    hook: >
      This generalizes the ABRACADABRA casino into a formula you can apply
      to any pattern in seconds — no new construction, just counting
      self-overlaps.
    explanation: >
      The casino argument never actually used the alphabet size or word
      length specifically — only that letters are iid and a fair-odds parlay
      stays a martingale. Repeating it for a general target word $w$ of
      length $\ell$: survivors at $T$ are exactly the gamblers whose starting
      position matches a self-overlap of $w$, and each such gambler holds
      $1/\Pr(\text{the first }j\text{ letters of }w)$ units, the fair payout
      for correctly calling $j$ letters in a row.

      Summing over every self-overlap length $j$ (always including
      $j=\ell$, the whole word matching itself) gives
      $\mathbb{E}[T]=\sum_j 1/\Pr(\text{first }j\text{ letters of }w)$, one
      term per way the pattern restarts partway through itself.

      The fair-coin examples show self-overlap, not length, drives the
      answer. HH overlaps at $j=2$ and $j=1$ (the trailing H restarts
      progress), giving $4+2=6$; HT overlaps only at $j=2$, giving just $4$ —
      shorter to wait for despite the same length, because every near-miss
      on HT throws away all progress rather than partial progress. The
      single letter H recovers the geometric mean $2=1/p$, since a
      one-letter pattern trivially only overlaps itself.
    worked: >
      For the pattern THT: self-overlaps are $j=3$ (the whole word) and
      $j=1$ (the trailing T matches the leading T; checking $j=2$, "TH"
      versus the suffix "HT," these don't match). So
      $\mathbb{E}[T]=2^{3}+2^{1}=8+2=10$ tosses expected — less than HHH's
      $14$ despite the same length, because THT's only overlap is the
      shorter one.
    interview: >
      "Expected tosses to see [pattern]" wants the overlap-sum formula
      applied on sight. A frequent check compares two same-length patterns
      (HH vs HT) to confirm you understand why one takes longer, not just
      that you can compute both.
    pitfalls: >
      Checking the wrong alignment — $j$ ranges over lengths where the
      prefix equals the suffix, not the reverse. Forgetting to include
      $j=\ell$, the trivial full-word overlap, which every pattern includes.
    recap: >
      $\mathbb{E}[T]=\sum_j 1/\Pr(\text{first }j\text{ letters of }w)$ over
      the pattern's self-overlaps generalizes the ABRACADABRA casino to any
      target, and self-overlapping patterns always wait longer than
      non-overlapping ones of the same length.
    dialogue:
      - part: The slow way works
        teach: >
          A fair coin is tossed until the pattern TTH first appears. You
          already know the slow method from the HH-versus-HT problem: track
          how much of the pattern you currently hold — nothing, T, or TT —
          and write one first-step equation per state.
      - ask: >
          What is the expected number of tosses until TTH?
        expects: "8"
        hint: >
          From TT, another T leaves you at TT; an H finishes.
        feedback: >
          $e_{TT} = 1 + \tfrac{1}{2} e_{TT}$ gives $e_{TT} = 2$. Then
          $e_{T} = 1 + \tfrac{1}{2} e_{TT} + \tfrac{1}{2} e_{0} = 2 +
          \tfrac{1}{2} e_0$, and $e_0 = 1 + \tfrac{1}{2} e_T + \tfrac{1}{2}
          e_0$. Substituting, $\tfrac{1}{4} e_0 = 2$, so $e_0 = 8$.
      - ask: >
          Now the pattern is TTHTT: five states. You hold TT and toss another
          T. Which state are you in?
        choices:
          - text: >
              Back to nothing: the toss broke the pattern.
            feedback: >
              The last two tosses are still TT, which is the start of the
              pattern. Throwing that away undercounts your progress.
          - text: >
              TT: the last two tosses still begin the pattern.
            correct: true
            feedback: >
              After TTT, the longest ending that is also a beginning of TTHTT
              is TT.
          - text: >
              T: only the last toss can be kept.
            feedback: >
              The last two tosses are TT, and TT is a prefix of TTHTT, so you
              keep both.
        feedback: >
          Every mismatch needs this check — the longest ending of what you
          hold that is also a beginning of the pattern. For five states and
          two outcomes that is ten checks and five linear equations, and every
          one of them is really a question about how the pattern overlaps
          itself.
      - reflect: >
          The ABRACADABRA casino handled all of that bookkeeping in one line.
          For a coin, what pays out at fair odds, who is still holding money
          at the moment the pattern completes, and how much?
        answer: >
          A fair bet on one toss doubles the stake, so a gambler who has
          called $j$ tosses right holds $2^{j}$ — in general
          $1/\Pr(\text{those } j \text{ tosses})$. At completion the survivors
          are the gamblers whose runs began at a self-overlap: lengths $j$
          where the first $j$ letters of the pattern equal its last $j$. The
          expected time is the total they hold.

      - part: Counting overlaps instead
        teach: >
          For iid letters and a target word $w$ of length $\ell$:
          $\mathbb{E}[T] = \sum_j 1/\Pr(\text{the first } j \text{ letters of }
          w)$, summed over every $j$ for which the first $j$ letters equal the
          last $j$ letters, always including $j = \ell$. The first-step
          equations and the overlap sum compute the same number; the second
          just skips to it.
      - ask: >
          Which lengths $j$ are self-overlaps of TTHTT?
        choices:
          - text: >
              $5$ and $1$.
            feedback: >
              You missed $j = 2$: the first two letters TT equal the last two,
              TT.
          - text: >
              $5$, $3$ and $1$.
            feedback: >
              $j = 3$ compares TTH with HTT — not equal. And $j = 2$ is missing.
          - text: >
              $5$, $2$ and $1$.
            correct: true
            feedback: >
              $j = 5$ always; $j = 4$: TTHT versus THTT, no; $j = 3$: TTH versus
              HTT, no; $j = 2$: TT versus TT, yes; $j = 1$: T versus T, yes.
        feedback: >
          Check every $j$ from $\ell$ down to $1$; skipping one undercounts.
      - ask: >
          So what is the expected number of tosses until TTHTT?
        expects: "38"
        feedback: >
          $2^{5} + 2^{2} + 2^{1} = 32 + 4 + 2 = 38$. TTH, with no overlaps
          beyond itself, gives $2^{3} = 8$ — the same answer the first-step
          equations produced.
      - ask: >
          A biased coin shows heads with probability $3/4$. Expected tosses
          until HTH?
        expects: "76/9"
        tolerance: 0.0005
        hint: >
          HTH overlaps at $j = 3$ and $j = 1$. Use the probabilities of the
          first $j$ letters.
        feedback: >
          $\Pr(\text{HTH}) = \tfrac{3}{4} \cdot \tfrac{1}{4} \cdot \tfrac{3}{4} =
          \tfrac{9}{64}$ and $\Pr(\text{H}) = \tfrac{3}{4}$, so
          $\mathbb{E}[T] = \tfrac{64}{9} + \tfrac{4}{3} = \tfrac{76}{9} \approx
          8.44$.

      - part: Why overlap costs time
        ask: >
          Every five-toss pattern appears at a given position with probability
          $1/32$. Why does TTHTT wait $38$ tosses on average, when a pattern
          with no self-overlap, like TTTTH, waits only $32$?
        choices:
          - text: >
              Overlapping patterns are less likely at any given position.
            feedback: >
              Both have probability exactly $1/32$ at every position. The
              difference is in how occurrences are spaced, not how often they
              occur.
          - text: >
              Occurrences of an overlapping pattern clump together, so at the
              same long-run rate the gaps before the first one are longer.
            correct: true
            feedback: >
              TTHTT can recur three tosses after itself, as in TTHTTHTT. Both
              patterns average one occurrence per $32$ positions, but bunched
              occurrences leave longer empty stretches, and the first
              occurrence sits at the end of one.
          - text: >
              The overlap sum double-counts the shorter overlaps.
            feedback: >
              Each surviving gambler holds a distinct amount, counted once.
              The extra $4 + 2$ is real waiting time.
        feedback: >
          Self-overlap, not length, is what lengthens the wait.
      - ask: >
          The overlap sum assumes independent tosses. Suppose instead each toss
          repeats the previous one with probability $0.7$. What happens to the
          formula?
        choices:
          - text: >
              It still holds, with each letter's probability set to its
              long-run frequency $1/2$.
            feedback: >
              The long-run frequency is $1/2$, but a bet on the next toss at
              odds $2$ is no longer fair given the history: after a T, the next
              toss is T with probability $0.7$.
          - text: >
              It fails: fair odds now depend on the previous toss, so the
              fixed-payout casino is not a martingale.
            correct: true
            feedback: >
              The casino needs every bet fair given the past. With dependent
              tosses, go back to first-step equations, now with transition
              probabilities in them.
          - text: >
              It holds with odds of $1/0.7$ on every bet.
            feedback: >
              A toss repeats with probability $0.7$ and switches with
              probability $0.3$, so fair odds depend on which letter you need
              and what came before. One fixed payout cannot be fair for both.
        feedback: >
          In an interview, say the overlaps out loud — "TTHTT overlaps itself
          at $5$, $2$ and $1$, so $32 + 4 + 2$" — and mention the iid
          assumption it rests on.


  - node: quant-processes.martingales.martingale-betting-fallacy
    hook: >
      This is the standing counterexample every optional stopping condition
      earns its keep against — a genuine martingale, a genuine almost-sure
      win, yet $\mathbb{E}[X_T]\ne\mathbb{E}[X_0]$.
    explanation: >
      The doubling strategy — stake $1,2,4,\dots$ on fair even-money bets,
      quitting at the first win $T$ — genuinely produces $X_T=+1$ with
      $\Pr(T<\infty)=1$ and $\mathbb{E}[T]=2$: after $n$ straight losses the
      net is $-(2^{n}-1)$, and the next win of $2^{n}$ nets exactly
      $2^{n}-(2^{n}-1)=1$. So $\mathbb{E}[X_T]=1\ne0=X_0$, even though $X_n$
      is an honest martingale throughout.

      This is not a contradiction, because none of the three sufficient
      conditions hold: $T$ is unbounded, since $\Pr(T>N)=2^{-N}>0$ for every
      $N$, ruling out (a); the stopped process is unbounded below, reaching
      $-(2^{n}-1)$, ruling out (b); and while $\mathbb{E}[T]<\infty$ holds,
      the increments $2^{n-1}$ are themselves unbounded, ruling out (c) too.
      Every condition fails, so the theorem simply declines to apply — this
      is not a paradox.

      What restores the martingale property is a finite bankroll. With
      starting bankroll $2^{m}-1$, the strategy wins $1$ with probability
      $1-2^{-m}$ but loses the entire $2^{m}-1$ with probability $2^{-m}$:
      expectation exactly $(1-2^{-m})(1)+2^{-m}(-(2^{m}-1))=0$.
    worked: >
      With bankroll $2^{5}-1=31$: win $1$ unit with probability
      $1-2^{-5}=31/32$, lose $31$ units with probability $2^{-5}=1/32$.
      Expected outcome: $\frac{31}{32}(1)+\frac{1}{32}(-31)=
      \frac{31-31}{32}=0$, restoring the fair game the instant a finite
      bound is imposed.
    interview: >
      "Does doubling your bet after every loss guarantee a profit?" tests
      whether you can name which optional stopping condition fails, not
      just recite "no." Expect the follow-up: "what if you had infinite
      money and infinite time?" — the unrealizable regime where it works.
    pitfalls: >
      Answering "it fails because $\Pr(T<\infty)<1$" — wrong; $T$ is finite
      almost surely, the failure is entirely in boundedness. Concluding a
      finite bankroll alone fixes everything without noting it also forces a
      stop, restoring bounded increments and a bounded stopped process
      together.
    recap: >
      Doubling nets $+1$ with certainty only by needing unbounded losses for
      unboundedly long — all three optional stopping conditions fail at
      once, and any finite bankroll restores expectation exactly $0$.
    dialogue:
      - part: A system that cannot lose
        teach: >
          Fair even-money bets: stake $1$; after every loss double the stake;
          quit at $T$, the first win. A friend calls it free money, and you
          are asked to find the flaw. Start by following one bad night.
      - ask: >
          You lose the first three bets. What is your net position?
        expects: "-7"
        feedback: >
          $-1 - 2 - 4 = -7$. After $n$ straight losses you are down
          $2^{n} - 1$.
      - ask: >
          You stake $8$ on the fourth bet and win. What is your net position
          when you quit?
        expects: "1"
        feedback: >
          $-7 + 8 = +1$. Whenever the first win comes, it repays every loss
          and leaves exactly $1$ over.
      - ask: >
          What is $\mathbb{E}[T]$, the expected number of bets you make?
        expects: "2"
        feedback: >
          $T$ is geometric with success probability $1/2$, mean $2$. The game
          is short on average, and $\Pr(T < \infty) = 1$.
      - ask: >
          Your fortune $X_n$ is a martingale with $X_0 = 0$, yet $X_T = 1$ on
          every path. Which optional stopping condition fails?
        choices:
          - text: >
              (c) fails because $\mathbb{E}[T]$ is infinite.
            feedback: >
              $\mathbb{E}[T] = 2$. That half of (c) holds; the other half does
              not.
          - text: >
              None fail; optional stopping is simply wrong here.
            feedback: >
              If any condition held, the theorem would give $\mathbb{E}[X_T] =
              0$. Since $X_T = 1$, every condition must fail — and each one
              does.
          - text: >
              All three: $T$ is unbounded, the stopped fortune is unbounded
              below, and the stakes — the increments — are unbounded.
            correct: true
            feedback: >
              (a) fails since $\Pr(T > n) = 2^{-n} > 0$ for every $n$. (b)
              fails since the fortune can reach $-(2^{n} - 1)$. (c) has
              $\mathbb{E}[T] < \infty$ but increments of size $2^{n-1}$.
        feedback: >
          Not a paradox: the theorem declines to apply, and the doubling
          system sits exactly where all three conditions fail.
      - reflect: >
          At every fixed $n$, $\mathbb{E}[X_{T \wedge n}] = 0$. Yet in the limit
          the mean is $1$. Where is the negative mass at time $n$, and what
          happens to it as $n \to \infty$?
        answer: >
          It sits on the single path that has lost every bet so far:
          probability $2^{-n}$, position $-(2^{n} - 1)$, contributing
          $-(1 - 2^{-n})$ — almost exactly $-1$, at every $n$. As $n$ grows the
          probability of that path vanishes but the loss on it doubles, so the
          $-1$ never shrinks; it is carried off to infinity on a path of
          probability zero. Collecting the $+1$ requires unlimited credit and
          unlimited time.

      - part: Give the player a bankroll
        teach: >
          Real players have a bankroll. With $15$ units you can stake
          $1, 2, 4, 8$ — totalling $15$ — and a fifth loss is unaffordable.
          So you stop at the first win or after four straight losses. Now $T
          \le 4$, condition (a) holds, and optional stopping must give $0$.
      - ask: >
          What is the probability you lose the whole $15$?
        expects: "1/16"
        feedback: >
          Four straight losses: $(1/2)^{4} = 1/16$.
      - ask: >
          What is your expected net result?
        expects: "0"
        feedback: >
          $\tfrac{15}{16}(+1) + \tfrac{1}{16}(-15) = \tfrac{15 - 15}{16} = 0$.
          A $94\%$ chance of a small win, paid for by a $6\%$ chance of losing
          everything.
      - ask: >
          What is the expected total amount you stake over the evening?
        expects: "4"
        hint: >
          Stake $2^{k-1}$ on bet $k$, which you reach with probability
          $2^{-(k-1)}$.
        feedback: >
          $1 + 2 \cdot \tfrac{1}{2} + 4 \cdot \tfrac{1}{4} + 8 \cdot
          \tfrac{1}{8} = 4$. Each round contributes exactly $1$ unit of
          expected action — which matters the moment the house has an edge.

      - part: The system against a house edge
        ask: >
          Same system, same $15$-unit bankroll, but each bet wins with
          probability $0.48$. Can a larger bankroll make the expected result
          nonnegative?
        choices:
          - text: >
              Yes: with enough doublings the probability of ruin becomes
              negligible.
            feedback: >
              Ruin becomes rarer, and the loss when it happens grows to match.
              Each unit staked still loses $0.04$ in expectation, and a larger
              bankroll means more units staked on average.
          - text: >
              No: every bet has negative expectation, and no staking rule or
              stopping rule changes the sign.
            correct: true
            feedback: >
              Your fortune is a supermartingale, the stakes are nonnegative and
              predictable, and the stopping time is bounded, so
              $\mathbb{E}[X_T] \le 0$. With $15$ units it is
              $-0.04 \times \mathbb{E}[\text{total staked}] < 0$.
          - text: >
              Yes, if you triple after each loss instead, so one win recovers
              more.
            feedback: >
              Tripling is another nonnegative predictable stake. It makes the
              rare ruin larger and the usual win bigger, and every unit staked
              still loses $0.04$ on average.
        feedback: >
          The interview answer to "does doubling guarantee a profit?": it wins
          $1$ with probability $1$ only with unbounded credit, where every
          optional stopping condition fails; with any finite bankroll the
          expectation is exactly zero in a fair game, and negative with an
          edge.


  - node: quant-processes.martingales.maximal-inequality
    hook: >
      This is Markov's inequality upgraded from a single time point to an
      entire path, delivering ruin-type bounds instantly with none of the
      barrier algebra the exact formulas need.
    explanation: >
      Fix $a>0$ and let $T$ be the first time the nonnegative supermartingale
      $X_n$ reaches $a$ — a genuine stopping time by construction. Stopping
      at $T\wedge n$ and using the free finite-horizon fact gives
      $\mathbb{E}[X_0]\ge\mathbb{E}[X_{T\wedge n}]$.

      Split that expectation over whether $T$ has occurred by time $n$: on
      $\{T\le n\}$, $X_{T\wedge n}=X_T\ge a$ by construction, and on the
      complement $X_{T\wedge n}\ge0$ by nonnegativity, so
      $\mathbb{E}[X_{T\wedge n}]\ge a\Pr(T\le n)$. Combining and letting
      $n\to\infty$ turns $\Pr(T\le n)$ into $\Pr(\sup_k X_k\ge a)$.

      This is genuinely Markov's inequality — $\Pr(X\ge a)\le
      \mathbb{E}[X]/a$ for nonnegative $X$ — applied to the entire
      trajectory's running supremum, at no extra cost beyond what stopping
      already earns free. The mirror statement for a nonnegative
      submartingale bounds the running maximum up to a fixed $n$ by
      $\mathbb{E}[X_n]/a$ instead, since a submartingale's mean is only
      controlled at its endpoint, not its start.
    worked: >
      A fair gambler starts with $k=15$ and stops at $0$: the stopped
      process is a nonnegative supermartingale, so
      $\Pr(\sup_n X_n\ge40)\le15/40=0.375$ — a ruin-avoidance bound obtained
      with no barrier at $40$ ever set up, unlike the exact two-barrier
      computation.
    interview: >
      "Bound the probability the process ever exceeds this level" wants
      Doob's maximal inequality named and applied directly — a fast answer
      where the exact ruin machinery would be overkill or the upper barrier
      isn't fixed in advance.
    pitfalls: >
      Applying the inequality to a process that isn't nonnegative — the
      split specifically used $X_{T\wedge n}\ge0$ on the untouched part.
      Using $\mathbb{E}[X_0]$ for the submartingale mirror version — that
      needs $\mathbb{E}[X_n]$, the mean at the horizon.
    recap: >
      A nonnegative supermartingale exceeds any level $a$ at some point with
      probability at most $\mathbb{E}[X_0]/a$ — Markov's inequality applied
      to the whole path via stopping, at no extra cost.
    dialogue:
      - part: Markov's inequality, one day at a time
        teach: >
          A fund's value $X_n$ is a nonnegative martingale — a fair game that
          cannot go below zero — starting at $X_0 = 20$. Risk wants a bound on
          the probability that it touches $100$ at any point in the next
          $30$ days.
      - ask: >
          Markov's inequality at a single day: what bound does it give for
          $\Pr(X_{30} \ge 100)$?
        expects: "1/5"
        feedback: >
          $\mathbb{E}[X_{30}] = 20$ by the constant-mean property, so
          $\Pr(X_{30} \ge 100) \le 20/100 = 1/5$.
      - ask: >
          "Touches $100$ at some point" is a union of $30$ daily events. What
          does the union bound give, adding Markov's bound over the days?
        expects: "6"
        feedback: >
          $30 \times \tfrac{1}{5} = 6$ — a bound on a probability that exceeds
          $1$, so it says nothing. The days overlap heavily, and the union
          bound pays for every one of them separately.
      - reflect: >
          Markov's inequality works at one time. Which single random time
          could you apply it at, so that "the fund is at or above $100$ at
          that time" is the same event as "it touched $100$ by day $30$"?
        answer: >
          Stop at $T \wedge 30$, where $T$ is the first day the value reaches
          $100$. If it touched $100$ by day $30$, then $X_{T \wedge 30} =
          X_T \ge 100$; otherwise $X_{T \wedge 30} = X_{30} \ge 0$. The stopped
          process is a martingale with mean $20$, so
          $20 \ge 100 \Pr(T \le 30)$. One application of Markov, at a random
          time.

      - part: Markov for the whole path
        teach: >
          The maximal inequality: if $(X_n)$ is a nonnegative supermartingale,
          then $\Pr(\sup_{n \ge 0} X_n \ge a) \le \mathbb{E}[X_0]/a$ for every
          $a > 0$ — your argument, with the horizon $30$ sent to infinity. For
          a nonnegative submartingale, Doob's form bounds the running maximum
          to a fixed horizon by the mean at the end:
          $\Pr(\max_{k \le n} X_k \ge a) \le \mathbb{E}[X_n]/a$.
      - ask: >
          Where exactly did the argument use that the fund cannot go below
          zero?
        choices:
          - text: >
              To make $T$ a stopping time.
            feedback: >
              "First day at or above $100$" is a stopping time for any process.
              Sign plays no role there.
          - text: >
              To bound $X_{T \wedge 30}$ below by $0$ on the paths that never
              reached $100$.
            correct: true
            feedback: >
              The bound $\mathbb{E}[X_{T \wedge 30}] \ge 100 \Pr(T \le 30)$
              drops the other paths' contribution, which is only safe if it is
              not negative.
          - text: >
              To make $\mathbb{E}[X_{T \wedge 30}] = 20$.
            feedback: >
              That holds for any martingale and any stopping time, signed or
              not. Nonnegativity enters one line later.
        feedback: >
          The supremum bound costs nothing beyond what stopping gives free;
          nonnegativity is the only extra hypothesis.
      - ask: >
          A walk steps $+1$ with probability $1/3$ and $-1$ with probability
          $2/3$, from $0$, with no walls. $2^{S_n}$ is a nonnegative martingale
          starting at $1$. Bound the probability the walk ever reaches $+5$.
        expects: "1/32"
        feedback: >
          The walk reaches $+5$ exactly when $2^{S_n}$ reaches $32$, so the
          probability is at most $1/32$. For this walk the bound is exact,
          because it cannot overshoot: $(p/q)^{5} = (1/2)^{5}$. No barrier
          algebra, no second wall.
      - ask: >
          Back to the fund starting at $20$. For which version is
          $\Pr(\text{ever touches } 100)$ exactly $1/5$, so that the maximal
          inequality is tight?
        choices:
          - text: >
              One that can jump from $90$ straight to $150$ in a day.
            feedback: >
              Overshoot puts more than $100$ on the paths that cross, so fewer
              paths are needed to carry the mean of $20$: the probability is
              strictly below $1/5$.
          - text: >
              One that moves $\pm 1$ a day fairly and is closed for good at
              $0$.
            correct: true
            feedback: >
              It ends at $0$ or touches exactly $100$, so
              $100 \Pr(\text{touch}) = 20$. The bound is the gambler's ruin
              answer, with no second wall to set up.
          - text: >
              One that never moves at all.
            feedback: >
              It stays at $20$ and never touches $100$: probability $0$, far
              below the bound.
        feedback: >
          The bound is attained when the process lands exactly on the level
          and otherwise ends at $0$; any overshoot or leftover value makes it
          slack.
      - ask: >
          A fair $\pm 1$ walk runs for $100$ steps from $0$. Use Doob's form on
          the nonnegative submartingale $S_n^{2}$ to bound
          $\Pr(\max_{k \le 100} |S_k| \ge 20)$.
        expects: "1/4"
        hint: >
          $|S_k| \ge 20$ exactly when $S_k^{2} \ge 400$.
        feedback: >
          $\mathbb{E}[S_{100}^{2}] = 100$, so the bound is $100/400 = 1/4$ —
          the same number Chebyshev gives for the single time $100$, now for
          the whole path. This is Kolmogorov's inequality.

      - part: Where the bound breaks
        ask: >
          Try it on a fair $\pm 1$ walk from $0$, which can go negative: the
          formula would give $\Pr(\sup_n S_n \ge 10) \le 0/10 = 0$. The walk
          reaches $10$ with probability $1$. Which hypothesis failed?
        choices:
          - text: >
              $S_n$ is not a supermartingale.
            feedback: >
              A martingale is a supermartingale. That hypothesis holds.
          - text: >
              Nonnegativity: paths that dip below $0$ before rising cancel the
              mass at $10$.
            correct: true
            feedback: >
              On the paths that have not reached $10$ the stopped walk can be
              very negative, so dropping them is no longer a lower bound.
          - text: >
              The supremum over infinitely many times needs a finite horizon.
            feedback: >
              The nonnegative version handles $n \to \infty$ with no trouble.
              The failure here is the sign, not the horizon.
        feedback: >
          Bound a fair gambler's chance of ever reaching a level only after
          making his fortune nonnegative — stopping him at $0$ does it.
          Interviewers want the one-line answer: "nonnegative supermartingale,
          so at most the start over the level".


  - node: quant-processes.martingales.convergence-theorem
    hook: >
      This theorem guarantees a game that stays bounded in expectation must
      eventually settle down — but "settles down" and "settles down to the
      right mean" are two different claims, and only one is free.
    explanation: >
      The hypothesis $\sup_n\mathbb{E}|X_n|<\infty$ says the process doesn't
      wander to infinite expected size, and the conclusion is almost-sure
      convergence to a finite limit $X_\infty$ — a deep fact, stated here to
      be used, not proved.

      Two specializations are worth memorizing directly. Every nonnegative
      supermartingale converges almost surely with no further hypothesis,
      since nonnegativity alone bounds
      $\mathbb{E}|X_n|=\mathbb{E}[X_n]\le\mathbb{E}[X_0]$. And a uniformly
      bounded martingale converges almost surely and in $L^{1}$, and in that
      case the limit's mean matches the start:
      $\mathbb{E}[X_\infty]=\mathbb{E}[X_0]$ — $L^{1}$ convergence is exactly
      what licenses passing the limit through the expectation.

      The attached warning is the one optional stopping already carries:
      almost sure convergence alone says nothing about the limit's mean
      unless a stronger mode — $L^{1}$, guaranteed only in the bounded case
      — is available. Polya's urn shows the limit can be genuinely
      informative: starting from one ball of each colour and adding a copy
      of whatever's drawn, the red fraction is confined to $[0,1]$ and hence
      a bounded martingale, so convergence is guaranteed — what boundedness
      alone does not reveal is that this particular limit is uniform on
      $(0,1)$, which needs the urn's own exchangeability structure.
    worked: >
      A fair gambler's fortune $S_{T\wedge n}$, stopped at the first exit
      from $\{0,\dots,10\}$ starting at $k=4$, is a bounded martingale
      ($0\le S_{T\wedge n}\le10$), so it converges almost surely — here
      visibly to $S_T$, which is $0$ or $10$ with probabilities $0.6$ and
      $0.4$, giving $\mathbb{E}[S_\infty]=10(0.4)=4$, matching $k=4$ exactly
      as $L^{1}$ convergence guarantees.
    interview: >
      "Does this bounded martingale converge, and to what?" wants the two
      specializations named directly, and Polya's urn cited as evidence the
      theorem does real work, not just guarantees existence.
    pitfalls: >
      Assuming almost sure convergence alone preserves
      $\mathbb{E}[X_\infty]=\mathbb{E}[X_0]$ — it doesn't without
      boundedness or another route to $L^{1}$ convergence; the same trap as
      optional stopping's unbounded-time failure. Treating "converges almost
      surely" as meaning the limit is deterministic — in Polya's urn the
      limit is itself random, uniform on $(0,1)$.
    recap: >
      A process bounded in $\mathbb{E}|X_n|$ converges almost surely to a
      finite limit, and only in the uniformly bounded case does that limit's
      mean match the process's starting mean.
    dialogue:
      - part: Double or nothing, forever
        teach: >
          You hold $1$ unit and play double-or-nothing on a fair coin each
          round, all in: your holding doubles or drops to $0$ with probability
          $1/2$ each, and at $0$ you stay at $0$. Your holding $X_n$ is a
          nonnegative martingale.
      - ask: >
          What is $\mathbb{E}[X_{10}]$?
        expects: "1"
        feedback: >
          Constant mean: $\mathbb{E}[X_{10}] = X_0 = 1$, carried entirely by
          the one path that won ten times, worth $2^{10} = 1024$.
      - ask: >
          What is $\Pr(X_{10} > 0)$?
        expects: "1/1024"
        feedback: >
          Ten straight wins: $2^{-10} = 1/1024$. Every other path is already
          at $0$ and stays there.
      - ask: >
          What happens to $X_n$ as $n \to \infty$?
        choices:
          - text: >
              It does not converge: the surviving holding keeps doubling.
            feedback: >
              The surviving path keeps doubling, but the probability of being
              on it goes to $0$. With probability $1$ some round is lost, and
              from then on $X_n = 0$ exactly.
          - text: >
              It converges to $0$ with probability $1$.
            correct: true
            feedback: >
              Every path eventually hits $0$ and stays: $X_\infty = 0$ almost
              surely.
          - text: >
              It converges to $1$, its mean.
            feedback: >
              The mean stays $1$ at every finite $n$, but almost every path
              ends at $0$. The limit and the mean disagree.
        feedback: >
          The holding settles down — to $0$ — while its mean sits at $1$
          forever.
      - reflect: >
          $\mathbb{E}[X_n] = 1$ at every $n$, $X_n \to 0$ almost surely, so
          $\mathbb{E}[X_\infty] = 0$. What would have to be true of the process
          for the limit to keep the mean?
        answer: >
          No mass may escape to rare, enormous values. Here at each $n$ the
          whole mean sits on a path of probability $2^{-n}$ at height $2^{n}$
          — a vanishing probability carrying a fixed amount. If the process were bounded, a vanishing probability could
          only carry a vanishing amount of mean, and the limit would keep it.

      - part: The theorem, and the bounded case
        teach: >
          The martingale convergence theorem: if $(X_n)$ is a martingale,
          submartingale or supermartingale with
          $\sup_n \mathbb{E}|X_n| < \infty$, then $X_n$ converges almost
          surely to a finite limit $X_\infty$. Every nonnegative
          supermartingale qualifies, since $\mathbb{E}|X_n| = \mathbb{E}[X_n]
          \le \mathbb{E}[X_0]$ — double-or-nothing among them. A uniformly
          bounded martingale converges almost surely *and* in $L^{1}$, so
          $\mathbb{E}[X_\infty] = \mathbb{E}[X_0]$.
      - ask: >
          A best-of-seven series between evenly matched teams; each game is a
          fair coin. Let $M_n$ be the probability team A wins the series given
          the first $n$ games. A leads $3$ games to $1$. What is $M_4$?
        expects: "7/8"
        hint: >
          A needs one win in the next three games.
        feedback: >
          A loses the series only by losing all three remaining games:
          $1 - (1/2)^{3} = 7/8$.
      - ask: >
          B wins game $5$, making it $3$ to $2$. What is $M_5$ now?
        expects: "3/4"
        feedback: >
          A needs one win in two games: $1 - (1/2)^{2} = 3/4$. Check the
          martingale property: from $7/8$, the next value is $1$ or $3/4$ with
          probability $1/2$ each, and $\tfrac{1}{2}(1) + \tfrac{1}{2}(\tfrac{3}{4})
          = \tfrac{7}{8}$.
      - ask: >
          $M_n$ lives in $[0, 1]$. What does the theorem say about it?
        choices:
          - text: >
              It converges, but its limit could have any mean.
            feedback: >
              That is the double-or-nothing situation. $M_n$ is bounded, so
              convergence is in $L^{1}$ too and the mean is kept:
              $\mathbb{E}[M_\infty] = M_0 = 1/2$.
          - text: >
              It converges almost surely and in $L^{1}$, to $0$ or $1$, with
              $\Pr(M_\infty = 1) = M_0 = 1/2$.
            correct: true
            feedback: >
              The series ends, so the limit is the indicator that A won, and
              its mean is the starting probability. Bounded martingales keep
              their mean in the limit.
          - text: >
              Nothing, since the series stops after at most $7$ games.
            feedback: >
              The theorem applies — $M_n$ just becomes constant once the
              series is decided. The conclusion is the familiar one: the
              final indicator averages to $M_0$.
        feedback: >
          A conditional probability given more and more information is the
          standard bounded martingale, and it always converges to the answer.

      - part: When the hypothesis fails
        ask: >
          The fair $\pm 1$ walk $S_n$ from $0$ is a martingale. Does it
          converge?
        choices:
          - text: >
              Yes: every martingale converges.
            feedback: >
              Only those with $\sup_n \mathbb{E}|X_n| < \infty$. The fair walk
              fails that: $\mathbb{E}|S_n|$ grows like $\sqrt{n}$.
          - text: >
              No: it keeps revisiting every level, and $\mathbb{E}|S_n|$ is
              unbounded.
            correct: true
            feedback: >
              The walk is recurrent, so it oscillates forever, and the
              hypothesis fails: $\mathbb{E}|S_n| \approx \sqrt{2n/\pi}$.
          - text: >
              Yes, to $0$, its mean.
            feedback: >
              It visits $0$ infinitely often, and also $5$, and $-5$,
              infinitely often. A sequence that keeps visiting two levels
              converges to neither.
        feedback: >
          Stop the walk at $0$ from a positive start and it becomes a
          nonnegative martingale, which converges — to $0$, as gambler's
          ruin says. Boundedness in mean is what turns a wandering game into
          one that settles.

