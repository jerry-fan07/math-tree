unit: quant-processes.markov-chains
opening: >
  This unit builds the two vocabularies of a Markov chain from the transition
  matrix up: the finite-horizon side, which asks where the chain ends up or how
  long it takes to get there via first-step linear systems, and the long-run
  side, which asks where the chain spends its time in equilibrium. The first
  several steps set up machinery — the Markov property, the transition matrix,
  Chapman–Kolmogorov, and the classification of states into recurrent,
  transient and periodic — that the rest of the unit reuses without
  re-deriving. Absorption problems (tennis deuce, a mouse in a maze) and
  stationary-distribution problems (a weather chain, a random walk on a graph)
  are worked end to end, because these two question shapes cover almost
  everything a Markov chain interview asks. By the end, seeing any process that
  resets its own future given only its current state should trigger naming
  states and writing one equation per state before anything else.
lessons:
  - node: quant-processes.markov-chains.markov-property
    hook: >
      Interviewers rarely test the definition directly — they hand you a
      process that visibly remembers its own past, like a pattern-matching
      game or a queue with a backlog, and expect you to enlarge the state
      until the property becomes true.
    explanation: >
      The Markov property says the current state is a sufficient statistic
      for the future: once you know $X_n$, no additional fact about
      $X_{n-1}, X_{n-2}, \dots$ changes the distribution of $X_{n+1}$. That's
      a strong claim about what information matters, and it's what collapses
      "reason about an arbitrarily long history" down to "reason about one
      number."

      Almost nothing is handed to you already Markov. The real skill is
      choosing the state so the property holds: if the obvious description of
      "where things stand" fails — because two different histories that agree
      on that description still predict different futures — the fix is to
      fold the missing information into a bigger state, not to abandon the
      Markov framework. A running total, a count of successes, a raw position
      are common descriptions that look sufficient but aren't; what's usually
      missing is some notion of recency or configuration, like how far into a
      pattern you've matched or how long since the last change.

      Time-homogeneity is a separate, usually-assumed convenience: the
      transition law $p_{ij}$ itself doesn't drift with $n$. Nothing in this
      unit uses a time-varying chain, so treat $p_{ij}$ as fixed once and for
      all.
    worked: >
      Chase the pattern $HH$ with a fair coin and compare two states after
      three tosses: history $TTH$ has one head total and its last toss was
      $H$, while history $THT$ also has one head total but its last toss was
      $T$. Conditioning only on "one head so far," the chance the very next
      toss completes $HH$ is either $0.5$ (from $TTH$) or $0$ (a single $T$
      can't complete $HH$, from $THT$) — two different numbers from the same
      state, so "total heads" is not Markov. Conditioning instead on the
      current run of consecutive heads ($1$ versus $0$) gives the same
      $\Pr(\text{next toss completes }HH)=0.5$ for every history ending in a
      single $H$, confirming run-length is the right state.
    interview: >
      Comes up as "is this process Markov?" for something like inventory with
      lagged demand, a random walk with momentum, or a pattern-matching game.
      The strong answer isn't a flat no — it names the smallest enlarged
      state (last $k$ observations, current progress toward a target) that
      restores the property.
    pitfalls: >
      Concluding a process "isn't Markov" and stopping there, rather than
      enlarging the state, misses the actual interview point — nearly every
      such process becomes Markov with the right state. Ignoring the
      positive-probability caveat on the conditioning history makes the
      defining equation vacuous whenever that particular past has
      probability $0$.
    recap: >
      The future depends on the past only through the present state — and the
      state is whatever you must define to make that literally true.
    dialogue:
      - part: A price that remembers its last move
        teach: >
          A stock moves one tick up or one tick down every second, and it has
          momentum: each move repeats the direction of the move before it with
          probability $0.7$ and reverses it with probability $0.3$. Right now
          the price is $50$.
      - ask: >
          The last three prices were $48$, $49$, $50$. What is the probability
          that the next price is $51$?
        expects: "0.7"
        feedback: >
          The last move was up, and $51$ means repeating it: $0.7$.
      - ask: >
          A different history: the last three prices were $52$, $51$, $50$.
          Now what is the probability that the next price is $51$?
        expects: "0.3"
        feedback: >
          The last move was down, so $51$ means reversing it: $0.3$. Same
          price, same question, a different answer.
      - ask: >
          A colleague models this as a chain whose state is the current price.
          What is wrong with that?
        choices:
          - text: >
              Nothing: a price of $50$ is all you need to say where it goes
              next.
            feedback: >
              You just computed two different answers, $0.7$ and $0.3$, for
              the next step from a price of $50$. The price alone does not
              pin down the next step's law.
          - text: >
              The probabilities $0.7$ and $0.3$ are unequal, so the moves are
              biased.
            feedback: >
              Bias is harmless. A walk that steps up with probability $0.7$
              every second, whatever happened before, is lopsided and still
              needs nothing but the current price.
          - text: >
              Given the price is $50$, the law of the next price still depends
              on the price one second ago.
            correct: true
            feedback: >
              Exactly. Conditioning on more of the past changes the forecast,
              so the current price is not a sufficient summary of the history.
        feedback: >
          The price process remembers one step further back than its current
          value. That is the failure to repair.
      - reflect: >
          You still want to reason one step at a time. What could you record
          each second, instead of the price alone, so that the next step's
          law depends only on what you recorded?
        hint: >
          What extra fact separated your two answers?
        answer: >
          Record the pair (price, direction of the last move). From
          $(50, \text{up})$ the next state is $(51, \text{up})$ with probability
          $0.7$ and $(49, \text{down})$ with probability $0.3$, and nothing
          earlier in the path changes that. The process did not become
          simpler; the state became big enough to carry everything the future
          needs.

      - part: The property, and an engineered state
        teach: >
          That is the Markov property. A process $X_0, X_1, \dots$ on a
          countable set of states is a Markov chain if
          $\Pr(X_{n+1} = j \mid X_n = i, X_{n-1} = i_{n-1}, \dots, X_0 = i_0) = \Pr(X_{n+1} = j \mid X_n = i)$
          whenever the conditioning event has positive probability: given the
          present, the past adds nothing. The price alone fails it; the pair
          (price, last direction) passes. When the one-step law $p_{ij}$ also
          does not change with $n$, the chain is time-homogeneous, as here.
      - ask: >
          Use the pair as the state. Starting from $(50, \text{up})$, what is
          the probability that two seconds later the price is back at $50$?
        expects: "0.3"
        hint: >
          There are two routes: up then down, and down then up. Track the
          direction after each move.
        feedback: >
          Up then down: $0.7 \times 0.3 = 0.21$. Down then up: the first move
          reverses ($0.3$), and the second move up reverses a down move
          ($0.3$), giving $0.09$. Total $0.21 + 0.09 = 0.3$. With the price
          alone you could not even have written the second factor.
      - ask: >
          The desk refines the model: each move repeats the previous direction
          with probability $0.9$ if the previous two moves agreed, and $0.6$ if
          they disagreed. What is the smallest state that makes this Markov?
        choices:
          - text: >
              (price, direction of the last move)
            feedback: >
              From $(50, \text{up})$ you cannot tell whether the repeat
              probability is $0.9$ or $0.6$ — that depends on the move before.
              Two histories with the same pair still forecast differently.
          - text: >
              (price, directions of the last two moves)
            correct: true
            feedback: >
              The next move's law needs exactly the last two directions, and
              after the move the new last-two pair is known. Four directional
              configurations per price.
          - text: >
              The whole path of prices so far
            feedback: >
              That is Markov — any process is, with the entire history as its
              state — but it is useless: the state space grows without bound.
              The skill is finding the smallest state that works.
        feedback: >
          The state must hold whatever the next step's law reads. If the law
          looks back $k$ moves, the state carries the last $k$ moves.

      - part: A pattern game, and the fine print
        teach: >
          A new game: you roll a fair die until a $1$ is immediately followed
          by a $2$. You want a chain that tracks how close you are to stopping.
      - ask: >
          Which description of "where things stand" is Markov for this game?
        choices:
          - text: >
              The number of $1$s rolled so far
            feedback: >
              Two histories with one $1$ each: $\dots 1$ and $1 \dots 5$. From
              the first, the next roll stops the game with probability $1/6$;
              from the second it cannot. Same count, different futures.
          - text: >
              Whether the last roll was a $1$ (or the game is over)
            correct: true
            feedback: >
              Progress toward the pattern is all that matters: either you have
              the $1$ matched or you have nothing. Three states: no progress,
              $1$ matched, done.
          - text: >
              The total of all rolls so far
            feedback: >
              The total cannot even tell you whether the last roll was a $1$:
              a total of $7$ could end in a $1$ or in a $6$.
        feedback: >
          For a pattern, the state is how much of the pattern the most recent
          rolls currently match — not a running count of anything.
      - ask: >
          You are in the state "the last roll was a $1$". What is the
          probability that after the next roll you are still in that state?
        expects: "1/6"
        hint: >
          Which roll leaves a $1$ as the last roll without finishing?
        feedback: >
          Only another $1$ does it: probability $1/6$. A $2$ ends the game
          ($1/6$), and any of the other four faces drops you to no progress
          ($4/6$). The row out of this state is $(4/6, 1/6, 1/6)$, and it sums
          to $1$.
      - ask: >
          Back to the momentum stock. Why does the definition only demand the
          equation when the conditioning history has positive probability?
        choices:
          - text: >
              Because rare histories are allowed to break the property.
            feedback: >
              Any history with positive probability, however small, must obey
              the equation. The caveat is about probability exactly $0$.
          - text: >
              Because a history such as $48, 50$ — a two-tick jump — cannot
              happen, and conditioning on it divides by $0$.
            correct: true
            feedback: >
              $\Pr(A \mid B) = \Pr(A \cap B)/\Pr(B)$ means nothing when
              $\Pr(B) = 0$. The definition simply stays silent about pasts
              that never occur.
          - text: >
              Because the property only applies once the chain has run long
              enough to forget its start.
            feedback: >
              The property holds at every step from $n = 0$. Forgetting the
              start is a different, later phenomenon.
        feedback: >
          The caveat costs nothing in practice, but writing the definition
          without it makes the equation undefined on impossible histories.
      - teach: >
          In an interview, "is this process Markov?" is never answered with a
          bare no. Say which two histories share the obvious state and predict
          different futures, then name the smallest enlarged state — last $k$
          moves, progress through a pattern — that restores the property.

  - node: quant-processes.markov-chains.transition-matrix
    hook: >
      Once you've named the states, writing the transition matrix is pure
      bookkeeping — the one habit worth automating is checking every row
      sums to $1$ before trusting any downstream algebra.
    explanation: >
      $P$ collects every state's one-step law into a single object: row $i$
      is the probability distribution of $X_{n+1}$ given $X_n=i$, so entries
      are nonnegative and each row sums to $1$ — that row-sum-$1$ property is
      called stochastic, and it's the cheapest correctness check available on
      any Markov setup. Columns carry no such constraint; a column can sum to
      anything.

      Distributions are naturally row vectors multiplied on the left,
      $\mu_{n+1}=\mu_nP$, because the $j$-th entry of $\mu_nP$ is exactly
      $\sum_i\mu_n(i)p_{ij}$ — the law of total probability applied one step
      ahead. Iterating gives $\mu_n=\mu_0P^{n}$, so the entire trajectory of
      laws is generated by repeated left-multiplication by the same fixed
      matrix.

      The construction habit that survives every interview chain: write out
      the rows in words first ("from state $i$, go to $j$ with probability
      ...") before touching any matrix notation, because the algebra is
      trivial once the rows are right and error-prone if a transition is
      silently missing or double-counted.
    worked: >
      A user session is Active or Idle. From Active, the next check finds
      Active with probability $0.8$ and Idle with probability $0.2$; from
      Idle, it finds Active with probability $0.3$ and Idle with probability
      $0.7$ — rows $(0.8,0.2)$ and $(0.3,0.7)$. Starting Active,
      $\mu_0=(1,0)$, so $\mu_1=\mu_0P=(0.8,0.2)$, and
      $\mu_2=\mu_1P=(0.8\cdot0.8+0.2\cdot0.3,\,0.8\cdot0.2+0.2\cdot0.7)
      =(0.70,0.30)$: after two checks, the session is Active with probability
      $0.70$.
    interview: >
      "Write down the transition matrix for ..." is usually the very first
      ask in a Markov-chain question, and the interviewer is watching for the
      row-sums-to-$1$ check done out loud, not just a correct-looking grid of
      numbers.
    pitfalls: >
      Writing probabilities as columns instead of rows silently transposes
      the whole problem — check that each row, not column, sums to $1$.
      Leaving out a transition (so a row sums to less than $1$) is the single
      most common setup error.
    recap: >
      $P$'s row $i$ is state $i$'s next-step law; rows sum to $1$, and
      $\mu_n=\mu_0P^{n}$ generates every future distribution from the same
      fixed matrix.
    dialogue:
      - part: A bond's rating, one day at a time
        teach: >
          A bond is rated Good, Watch or Default, and the rating moves once a
          day. From Good it stays Good with probability $0.85$, drops to Watch
          with $0.1$ and defaults with $0.05$. From Watch it recovers to Good
          with $0.3$, stays on Watch with $0.5$ and defaults with $0.2$. Default
          is permanent.
      - ask: >
          The bond is Good today. What is the probability it is on Watch two
          days from now?
        expects: "0.135"
        hint: >
          Split on tomorrow's rating, then multiply along each route.
        feedback: >
          Good then Watch: $0.85 \times 0.1 = 0.085$. Watch then Watch:
          $0.1 \times 0.5 = 0.05$. Default then Watch is impossible. Total
          $0.085 + 0.05 = 0.135$.
      - ask: >
          Three analysts write the rules as a table, states in the order Good,
          Watch, Default. Which table records them correctly, with row $i$
          describing what follows state $i$?
        choices:
          - text: >
              Rows $(0.85, 0.3, 0)$, $(0.1, 0.5, 0)$, $(0.05, 0.2, 1)$
            feedback: >
              Read the first row: from Good, it says the bond goes to Watch
              with probability $0.3$ — but $0.3$ is the chance of leaving
              Watch for Good. This table has each state's law written down a
              column. Its rows sum to $1.15$, $0.6$ and $1.25$, which is the
              giveaway.
          - text: >
              Rows $(0.85, 0.1, 0.05)$, $(0.3, 0.5, 0.2)$, $(0, 0, 0)$
            feedback: >
              The Default row cannot be empty. After default there is still a
              tomorrow, and the bond is in Default then with probability $1$.
              A zero row would say the bond vanishes from the model.
          - text: >
              Rows $(0.85, 0.1, 0.05)$, $(0.3, 0.5, 0.2)$, $(0, 0, 1)$
            correct: true
            feedback: >
              Each row is one state's complete forecast for tomorrow, and each
              sums to $1$.
        feedback: >
          A row answers "given today's state, what is tomorrow's law?", so it
          must list every possible tomorrow and account for all the
          probability.
      - ask: >
          In the correct table, what does the Default column sum to?
        expects: "1.25"
        feedback: >
          $0.05 + 0.2 + 1 = 1.25$. Columns mix the forecasts of different
          states, so their sums mean nothing and can be anything.
      - reflect: >
          You accepted one table and rejected two. State exactly what you were
          checking about each row, and why the same check on columns would be
          meaningless.
        answer: >
          Row $i$ is the conditional law $\Pr(X_{n+1} = \cdot \mid X_n = i)$,
          so its entries are probabilities — nonnegative — and they cover
          every possible next state, so they sum to $1$. A column collects
          $\Pr(X_{n+1} = j \mid X_n = i)$ across different conditioning
          events $i$, and probabilities under different conditions have no
          reason to add up to anything.

      - part: Rows, row vectors and tomorrow's law
        teach: >
          The table is the transition matrix $P$, with $p_{ij} = \Pr(X_{n+1} = j \mid X_n = i)$.
          A matrix with nonnegative entries and every row summing to $1$ is
          called stochastic. A distribution over the states is a row vector
          $\mu_n$, and the law of total probability one step ahead is the
          product $\mu_{n+1} = \mu_n P$; iterating, $\mu_n = \mu_0 P^{n}$.
      - ask: >
          You do not know today's rating: it is Good or Watch with probability
          $0.5$ each. What is the probability the bond is in Default tomorrow?
        expects: "0.125"
        hint: >
          This is the Default entry of $\mu_0 P$ with $\mu_0 = (0.5, 0.5, 0)$.
        feedback: >
          $0.5 \times 0.05 + 0.5 \times 0.2 + 0 \times 1 = 0.025 + 0.1 = 0.125$.
          The full vector is $\mu_1 = (0.575, 0.3, 0.125)$, which sums to $1$.
      - ask: >
          A colleague computes tomorrow's law as $P$ times the column vector
          $(0.5, 0.5, 0)$ instead. What comes out?
        choices:
          - text: >
              The same numbers, just written as a column.
            feedback: >
              Multiplying on the right dots each row of $P$ with $\mu_0$, which
              mixes one state's forecast with today's weights on other states.
              The result here is $(0.475, 0.4, 0)$ — not $\mu_1$.
          - text: >
              $(0.475, 0.4, 0)$, which is not a distribution at all.
            correct: true
            feedback: >
              It sums to $0.875$. The Good entry is
              $0.85 \times 0.5 + 0.1 \times 0.5$, which multiplies the chance
              of a Good-to-Watch move by the weight on Watch — a meaningless
              product.
          - text: >
              The law of today's state given tomorrow's.
            feedback: >
              Reversing time needs Bayes' rule and the current law, not a
              transposed product. The right-hand product has no
              probabilistic meaning here.
        feedback: >
          Distributions act on the left. Entry $j$ of $\mu P$ is
          $\sum_i \mu(i) p_{ij}$: weight on each today, times the chance of
          moving from it to $j$.
      - ask: >
          Your very first answer, $0.135$, is one entry of $P^{2}$. Which?
        choices:
          - text: >
              Row Watch, column Good
            feedback: >
              That entry is the chance of going from Watch to Good in two
              days. Rows index where you start.
          - text: >
              Row Good, column Watch
            correct: true
            feedback: >
              Start in Good, so $\mu_0 = (1, 0, 0)$ picks out row Good of
              $P^{2}$; the Watch column is the two-day chance of Watch.
          - text: >
              The sum of the Watch column of $P^{2}$
            feedback: >
              Column sums of $P^{2}$ mean as little as column sums of $P$.
              You started from one specific state, so the answer is one entry.
        feedback: >
          Row $i$ of $P^{n}$ is the law of $X_n$ from $X_0 = i$. Your two-route
          sum was exactly a row of $P$ dotted with a column of $P$.

      - part: A table that fails one clause
        ask: >
          A quant fits transition probabilities by regression and gets the row
          $(1.05, 0, -0.05)$ out of Good. Is that a valid row of a transition
          matrix?
        choices:
          - text: >
              Yes: it sums to $1$, and that is the check.
            feedback: >
              Summing to $1$ is half the check. The row would give the event
              "the bond defaults tomorrow" probability $-0.05$, and no event
              has negative probability.
          - text: >
              No: $1.05$ exceeds $1$, but the negative entry is fine if it is
              small.
            feedback: >
              The two faults are the same fault. Once every entry is
              nonnegative and the row sums to $1$, no entry can exceed $1$;
              the $1.05$ exists only because of the $-0.05$.
          - text: >
              No: every entry must be nonnegative, and $-0.05$ is not.
            correct: true
            feedback: >
              One clause fails. Fitted matrices need clipping and
              renormalising before they are a chain.
        feedback: >
          Stochastic means two things: nonnegative entries, and rows summing
          to $1$. Columns carry no condition.
      - teach: >
          When an interviewer says "write down the transition matrix", say
          the rows in words first — "from Watch: Good $0.3$, Watch $0.5$,
          Default $0.2$" — and check each row sums to $1$ out loud. A missing
          transition shows up there before it ruins any algebra.

  - node: quant-processes.markov-chains.chapman-kolmogorov
    hook: >
      Whenever a question wants the probability of being in state $j$ after a
      specific number of steps rather than in the limit, this is the identity
      that turns it into a matrix power instead of a case-by-case recursion.
    explanation: >
      To go from $i$ to $j$ in $m+n$ steps, the chain must occupy some state
      $k$ at the midpoint, and the Markov property lets you multiply the two
      independent-looking legs: condition on $X_m=k$, and the probability of
      reaching $j$ from there in the remaining $n$ steps depends only on $k$,
      not on how the chain got to $k$. Summing over every possible midpoint
      $k$ gives $p^{(m+n)}_{ij}=\sum_kp^{(m)}_{ik}p^{(n)}_{kj}$ — the law of
      total probability, applied at one intermediate time.

      That sum is, symbol for symbol, the definition of matrix
      multiplication: $(P^mP^n)_{ij}=\sum_k(P^m)_{ik}(P^n)_{kj}$. So $n$-step
      probabilities are nothing but entries of $P^n$, with $P^0=I$ recording
      that zero steps leaves you exactly where you started.

      A useful corollary follows immediately: if $i$ can reach some $k$ in
      $m$ steps with positive probability, and $k$ can reach $j$ in $n$ steps
      with positive probability, then $i$ can reach $j$ in $m+n$ steps with
      positive probability. Reachability is transitive precisely because
      probabilities compose by this sum, not because of any separate
      graph-theoretic argument.
    worked: >
      For a 2-state market model with rows $P_U=(0.6,0.4)$ and
      $P_D=(0.5,0.5)$, compute $p^{(2)}_{UD}$ by summing over the midpoint:
      $p^{(2)}_{UD}=p_{UU}p_{UD}+p_{UD}p_{DD}=0.6\cdot0.4+0.4\cdot0.5
      =0.24+0.20=0.44$. Multiplying $P$ by itself directly gives row $U$ of
      $P^2$ as $(0.56,0.44)$ — the second entry matches exactly, confirming
      the sum-over-midpoint formula and the matrix power compute the same
      number.
    interview: >
      "What's the probability of being in state $j$ after exactly $n$ steps"
      is answered by naming $P^n$ and, if pressed for the reasoning, by
      writing the midpoint sum rather than treating $P^n$ as a black box.
    pitfalls: >
      Forgetting $P^0=I$ leads to off-by-one errors when a problem asks for
      "$n$ steps from now" versus "after the $n$-th transition." Summing over
      the wrong index in the midpoint sum silently computes a transposed
      product instead of $P^{m+n}$.
    recap: >
      $n$-step probabilities are entries of $P^n$ because matrix
      multiplication is exactly the law of total probability applied at an
      intermediate time.
    dialogue:
      - part: Counting routes to an outage
        teach: >
          A server is Up, Slow or Down, checked once a minute. From Up it stays
          Up with probability $0.8$ and turns Slow with $0.2$. From Slow it
          recovers to Up with $0.4$, stays Slow with $0.4$ and goes Down with
          $0.2$. From Down it comes back Up with $0.5$ and stays Down with
          $0.5$.
      - ask: >
          The server is Up now. What is the probability it is Down two minutes
          from now?
        expects: "0.04"
        hint: >
          Up cannot go straight to Down. List the routes.
        feedback: >
          The only route is Up, Slow, Down: $0.2 \times 0.2 = 0.04$.
      - ask: >
          Starting Up, what is the probability it is Down three minutes from
          now?
        expects: "0.068"
        hint: >
          Three routes end in Down at minute $3$. Write each as a word of
          three moves.
        feedback: >
          Up, Up, Slow, Down: $0.8 \times 0.2 \times 0.2 = 0.032$. Up, Slow,
          Slow, Down: $0.2 \times 0.4 \times 0.2 = 0.016$. Up, Slow, Down,
          Down: $0.2 \times 0.2 \times 0.5 = 0.02$. Total $0.068$. At ten
          minutes there would be thousands of routes.
      - reflect: >
          Group your three routes by where the server is after the first
          minute. What is each group's total, and how could you have produced
          $0.068$ from numbers you already had, without listing a route?
        hint: >
          After one minute the server is Up or Slow. From each, you need the
          chance of being Down two minutes later.
        answer: >
          Condition on the state at minute $1$. With probability $0.8$ it is
          Up, and from Up the two-minute chance of Down is $0.04$, giving
          $0.032$. With probability $0.2$ it is Slow, and from Slow the
          two-minute chance of Down is $0.4 \times 0.2 + 0.2 \times 0.5 = 0.18$,
          giving $0.036$. Total $0.068$. Splitting on an intermediate time
          turns a long horizon into short pieces you multiply and add.

      - part: Split at the midpoint
        teach: >
          Write $p^{(n)}_{ij} = \Pr(X_n = j \mid X_0 = i)$. Conditioning on the
          state $k$ at time $m$ gives the Chapman–Kolmogorov equations,
          $p^{(m+n)}_{ij} = \sum_{k} p^{(m)}_{ik}\,p^{(n)}_{kj}$. The right side
          is the $(i,j)$ entry of the product $P^{m}P^{n}$, so the $n$-step
          probabilities are exactly the entries of the matrix power:
          $p^{(n)}_{ij} = (P^{n})_{ij}$, with $P^{0} = I$.
      - ask: >
          The proof writes $\Pr(X_{m+n} = j \mid X_0 = i)$ as
          $\sum_k \Pr(X_m = k \mid X_0 = i)\,\Pr(X_{m+n} = j \mid X_m = k, X_0 = i)$.
          Which step needs the Markov property?
        choices:
          - text: >
              Splitting the event into the cases $X_m = k$ and adding them.
            feedback: >
              That is the law of total probability, which holds for any
              process: the events $X_m = k$ partition the space whatever the
              dynamics.
          - text: >
              Replacing $\Pr(X_{m+n} = j \mid X_m = k, X_0 = i)$ by $p^{(n)}_{kj}$.
            correct: true
            feedback: >
              Dropping the condition $X_0 = i$ is exactly "given the present,
              the past adds nothing" — and time-homogeneity lets the $n$ steps
              from $k$ start at time $m$ rather than $0$.
          - text: >
              Using that every row of $P$ sums to $1$.
            feedback: >
              Row sums never enter the identity. They are why $P^{n}$ is again
              stochastic, a separate fact.
        feedback: >
          Total probability splits on the midpoint; the Markov property lets
          the second leg forget how it got there. Matrix multiplication is the
          bookkeeping of those two moves.
      - ask: >
          Down never moves straight to Slow. What is $p^{(2)}_{\text{Down},\text{Slow}}$?
        expects: "0.1"
        feedback: >
          Split at minute $1$: Down to Up ($0.5$), then Up to Slow ($0.2$),
          gives $0.1$; the Down-to-Down route adds $0.5 \times 0 = 0$. A zero
          in $P$ can become positive in $P^{2}$: if $i$ reaches $k$ and $k$
          reaches $j$, then $i$ reaches $j$ in the combined number of steps.

      - part: Four minutes in two halves
        ask: >
          From Up, the two-minute law is $(0.72, 0.24, 0.04)$ over Up, Slow,
          Down, and the two-minute chance of Down is $0.04$ from Up, $0.18$
          from Slow and $0.25$ from Down. What is the probability the server
          is Down four minutes after being Up?
        expects: "0.082"
        hint: >
          Split at minute $2$: $p^{(4)}_{\text{Up},\text{Down}} = \sum_k p^{(2)}_{\text{Up},k}\,p^{(2)}_{k,\text{Down}}$.
        feedback: >
          $0.72 \times 0.04 + 0.24 \times 0.18 + 0.04 \times 0.25 = 0.0288 + 0.0432 + 0.01 = 0.082$.
          Row Up of $P^{2}$ times column Down of $P^{2}$ — four minutes from
          two two-minute pieces, with no route listed.
      - ask: >
          A colleague wants "the chance the server is Down at the current
          check", with no minutes elapsed, starting from Up. Which matrix
          entry is that?
        choices:
          - text: >
              $(P^{1})_{\text{Up},\text{Down}} = 0$, the one-step entry.
            feedback: >
              One step means one minute has passed. With zero minutes the
              question is about $P^{0}$.
          - text: >
              $(P^{0})_{\text{Up},\text{Down}} = 0$, since $P^{0} = I$.
            correct: true
            feedback: >
              Zero steps leaves the chain where it started, so $P^{0}$ is the
              identity. Both answers happen to be $0$ here; from Down to Down
              they would differ, $1$ against $0.5$.
          - text: >
              It is undefined: $n$-step probabilities start at $n = 1$.
            feedback: >
              $n = 0$ is allowed and needed — it is what makes
              $P^{m+0} = P^{m}P^{0}$ consistent.
        feedback: >
          Off-by-one errors between "after $n$ transitions" and "at time $n$"
          disappear once $P^{0} = I$ is part of the picture.

      - part: When the split lies
        teach: >
          A process that is not Markov: $X_0$ is a fair coin flip, $0$ or $1$;
          $X_1$ is a fresh, independent fair flip; and $X_2$ simply copies
          $X_0$. Each one-step conditional law is $(1/2, 1/2)$, whatever the
          current value.
      - ask: >
          Apply the midpoint sum blindly with one-step probabilities $1/2$
          everywhere. What does it predict for $\Pr(X_2 = 0 \mid X_0 = 0)$?
        expects: "0.5"
        feedback: >
          $\sum_k \tfrac12 \cdot \tfrac12 = \tfrac14 + \tfrac14 = \tfrac12$.
          The truth is $1$, because $X_2$ copies $X_0$.
      - ask: >
          Which part of the argument broke?
        choices:
          - text: >
              The law of total probability over $X_1$.
            feedback: >
              That split is always valid: $\Pr(X_2 = 0 \mid X_0 = 0)$ really
              is the sum over $X_1 = 0, 1$ of the joint pieces.
          - text: >
              Treating $\Pr(X_2 = 0 \mid X_1 = k, X_0 = 0)$ as
              $\Pr(X_2 = 0 \mid X_1 = k) = 1/2$.
            correct: true
            feedback: >
              Given $X_0 = 0$ as well, $X_2 = 0$ for sure. The second leg
              remembers the start, so it cannot be replaced by a one-step
              probability.
          - text: >
              The one-step probabilities are wrong.
            feedback: >
              They are right: $X_2$ given $X_1$ alone really is a fair coin,
              since $X_1$ carries no information about $X_0$.
        feedback: >
          Matrix powers give $n$-step probabilities only for a chain. In an
          interview, "the probability of $j$ after exactly $n$ steps" is
          $(P^{n})_{ij}$, and if pressed you justify it with the midpoint sum
          and the Markov property, in that order.

  - node: quant-processes.markov-chains.matrix-powers
    hook: >
      When a problem wants $P^n$ as a formula in $n$ rather than a number for
      one specific $n$, diagonalizing $P$ is the only route that doesn't mean
      multiplying matrices by hand $n$ times.
    explanation: >
      Writing $P=VDV^{-1}$ with $D$ diagonal turns $P^n=VD^nV^{-1}$ into
      something computable in closed form, because $D^n$ is just each
      diagonal eigenvalue raised to the $n$-th power. Every entry of $P^n$ is
      therefore a fixed linear combination of $\lambda_1^n,\dots,\lambda_m^n$,
      with the combination's coefficients coming from $V$ and $V^{-1}$ and
      not depending on $n$ at all.

      Every stochastic matrix carries $\lambda=1$ as an eigenvalue
      automatically — the all-ones vector is a right eigenvector, since every
      row sums to $1$ — and every eigenvalue satisfies $|\lambda|\le1$. That
      $\lambda=1$ term is the only one that doesn't decay, so it alone
      survives as $n\to\infty$ and produces the constant limiting behavior;
      every other term shrinks like $|\lambda_i|^n$.

      The mental model worth keeping: the second-largest eigenvalue in
      modulus, $\lambda_2$, sets the clock. A chain with $\lambda_2$ close to
      $0$ forgets its start almost immediately; one with $\lambda_2$ close to
      $1$ mixes slowly, and the deviation from equilibrium after $n$ steps is
      on the order of $|\lambda_2|^n$.
    worked: >
      For the market chain with rows $(0.6,0.4)$ and $(0.5,0.5)$, the
      characteristic equation $\lambda^2-1.1\lambda+0.1=0$ factors to give
      $\lambda=1$ and $\lambda=0.1$ — matching the two-state shortcut
      $1-a-b=1-0.4-0.5=0.1$. Writing $c=5/9$ for the constant $p^{(n)}_{UU}$
      settles to, the closed form $p^{(n)}_{UU}=c+(1-c)(0.1)^n$ gives, at
      $n=2$,
      $5/9+(4/9)(0.01)\approx0.556+0.004=0.560$ — matching the direct matrix
      product computed by hand, and showing the chain is already within
      $0.004$ of equilibrium after two steps because $\lambda_2=0.1$ is so
      small.
    interview: >
      "Find $P^n$ in closed form" wants eigenvalues and eigenvectors named,
      not a promise to multiply matrices repeatedly; a strong finish adds
      that the second eigenvalue controls how fast the chain settles, since
      that's usually the actual follow-up question.
    pitfalls: >
      Assuming $P^n$ converges for every stochastic $P$ ignores that a
      complex or negative $\lambda_2$ can make the approach oscillate rather
      than settle monotonically. Forgetting that $\lambda=1$ is guaranteed
      for every stochastic matrix wastes time hunting for it as if it might
      be absent.
    recap: >
      Diagonalizing $P$ turns $P^n$ into a combination of $\lambda^n$ terms,
      with the guaranteed eigenvalue $1$ giving the limit and the
      second-largest $|\lambda_2|$ setting the speed of approach.
    dialogue:
      - part: The slow way to fifty days
        teach: >
          A market is Trending or Choppy, one regime per day. Trending stays
          Trending with probability $0.8$ and turns Choppy with $0.2$; Choppy
          turns Trending with $0.4$ and stays Choppy with $0.6$. Today is
          Trending.
      - ask: >
          What is $p^{(2)}_{TT}$, the probability it is Trending two days from
          now?
        expects: "0.72"
        feedback: >
          $0.8 \times 0.8 + 0.2 \times 0.4 = 0.64 + 0.08 = 0.72$.
      - ask: >
          And $p^{(3)}_{TT}$?
        expects: "0.688"
        hint: >
          From day $2$ you are Trending with $0.72$ and Choppy with $0.28$.
        feedback: >
          $0.72 \times 0.8 + 0.28 \times 0.4 = 0.576 + 0.112 = 0.688$.
      - ask: >
          The sequence $1, 0.8, 0.72, 0.688$ seems to be settling near
          $2/3$. The gaps to $2/3$ are $1/3$, then about $0.133$, $0.053$ and
          $0.021$. By what factor does each gap shrink?
        expects: "0.4"
        feedback: >
          $0.133/0.333 = 0.4$, $0.053/0.133 = 0.4$, $0.021/0.053 = 0.4$.
          Exactly the same factor every day — that regularity is a clue.
      - ask: >
          The desk wants $p^{(n)}_{TT}$ as a formula in $n$, not a number for
          one $n$. What is the trouble with the method you just used?
        choices:
          - text: >
              Nothing: multiply $P$ by itself $n$ times, symbolically.
            feedback: >
              Written out symbolically, the $(T,T)$ entry of $P^{n}$ is a sum
              over all $2^{n}$ day-by-day paths. That is a computation, not a
              formula.
          - text: >
              It gives one number per $n$, at a cost that grows with $n$, and
              never shows the pattern behind the constant factor $0.4$.
            correct: true
            feedback: >
              Right. You saw the gap shrink by $0.4$ but nothing in the
              step-by-step method explains why, or gives day $n$ directly.
          - text: >
              It is wrong after a few steps because rounding errors pile up.
            feedback: >
              The arithmetic is exact. Accuracy is not the problem; the
              absence of a closed form is.
        feedback: >
          Repeated multiplication repeats the same work forever. A closed form
          needs a description of $P$ in which powers are easy.
      - reflect: >
          For which kind of matrix is the $n$-th power trivial to write down?
          How could you use that to explain why the gap shrinks by exactly
          $0.4$ every day?
        hint: >
          Think about what $D^{n}$ is when $D$ is diagonal.
        answer: >
          A diagonal matrix: $D^{n}$ just raises each diagonal entry to the
          $n$-th power. If $P = VDV^{-1}$, then $P^{n} = VD^{n}V^{-1}$, so
          every entry of $P^{n}$ is a fixed combination of $\lambda_1^{n}$ and
          $\lambda_2^{n}$. A gap shrinking by $0.4$ per step is a term
          $c \cdot 0.4^{n}$ — so $0.4$ should be an eigenvalue, and the
          constant $2/3$ should come from an eigenvalue $1$.

      - part: Eigenvalues of a stochastic matrix
        teach: >
          Diagonalize: with $P = VDV^{-1}$, $P^{n} = VD^{n}V^{-1}$, and every
          entry of $P^{n}$ is a fixed linear combination of
          $\lambda_1^{n}, \dots, \lambda_m^{n}$. A stochastic matrix always has
          $\lambda = 1$, and every eigenvalue has $|\lambda| \le 1$. For two
          states with rows $(1-a, a)$ and $(b, 1-b)$ the eigenvalues are $1$
          and $1 - a - b$, so $p^{(n)}_{11} = c + (1 - c)(1-a-b)^{n}$ for a
          constant $c$.
      - ask: >
          Why is $1$ an eigenvalue of every stochastic matrix?
        choices:
          - text: >
              Because the entries of $P$ are probabilities, at most $1$.
            feedback: >
              Small entries bound the eigenvalues; they do not produce one
              equal to $1$. The reason is in the rows.
          - text: >
              Because $P$ times the all-ones column vector is the all-ones
              vector.
            correct: true
            feedback: >
              Entry $i$ of $P\mathbf{1}$ is the row sum $\sum_j p_{ij} = 1$, so
              $\mathbf{1}$ is a right eigenvector for eigenvalue $1$.
          - text: >
              Because every column of $P$ sums to $1$.
            feedback: >
              Columns of a stochastic matrix sum to anything. The eigenvector
              comes from the row sums, acting on the right.
        feedback: >
          No search needed: $\lambda = 1$ comes with every transition matrix,
          and it is the term that never decays.
      - ask: >
          The eigenvalues sum to the trace. Use that to find $\lambda_2$ for
          the market chain without solving any equation.
        expects: "0.4"
        feedback: >
          The trace is $0.8 + 0.6 = 1.4$, and one eigenvalue is $1$, so
          $\lambda_2 = 0.4$ — matching $1 - a - b = 1 - 0.2 - 0.4$, and the
          factor you saw in the gaps.

      - part: Day four from the formula
        ask: >
          With $c = 2/3$ and $\lambda_2 = 0.4$, $p^{(n)}_{TT} = 2/3 + (1/3)(0.4)^{n}$.
          What is $p^{(4)}_{TT}$, to four decimals?
        expects: "0.6752"
        tolerance: 0.0001
        hint: >
          $0.4^{4} = 0.0256$.
        feedback: >
          $2/3 + 0.0256/3 = 0.66667 + 0.00853 = 0.6752$. One step of the slow
          way agrees: $0.688 \times 0.8 + 0.312 \times 0.4 = 0.6752$.
      - ask: >
          Starting Choppy instead, what does $p^{(n)}_{CT}$ tend to as $n$
          grows?
        choices:
          - text: >
              $0$, because the chain started away from Trending.
            feedback: >
              The start only sets the coefficient of the $0.4^{n}$ term, and
              that term dies. Choppy turns Trending often enough to forget it
              started there.
          - text: >
              $1/3$, the mirror image of the Trending start.
            feedback: >
              $1/3$ is the long-run chance of Choppy. Both rows of $P^{n}$
              tend to the same vector, $(2/3, 1/3)$.
          - text: >
              $2/3$, the same limit as from Trending.
            correct: true
            feedback: >
              In fact $p^{(n)}_{CT} = 2/3 - (2/3)(0.4)^{n}$: the same constant,
              a different coefficient on the decaying term.
        feedback: >
          The $\lambda = 1$ term is the limit and does not care where you
          started; $|\lambda_2|^{n}$ is how much of the start is still
          remembered.

      - part: When the second eigenvalue is negative
        ask: >
          Another chain has rows $(0.1, 0.9)$ and $(0.7, 0.3)$, so
          $\lambda_2 = 1 - 0.9 - 0.7 = -0.6$. How does $p^{(n)}_{11}$ approach
          its limit?
        choices:
          - text: >
              It climbs steadily toward the limit from below.
            feedback: >
              A monotone approach needs $\lambda_2 > 0$. Here
              $(-0.6)^{n}$ changes sign each step.
          - text: >
              It never settles, because a negative eigenvalue blocks
              convergence.
            feedback: >
              $|{-0.6}| < 1$, so $(-0.6)^{n} \to 0$ and the term still dies.
              Only $|\lambda_2| = 1$, as in a chain that swaps state every
              step, prevents convergence.
          - text: >
              It overshoots, alternating above and below the limit, with the
              gap shrinking by $0.6$ each step.
            correct: true
            feedback: >
              A chain that usually switches state oscillates around its
              equilibrium. $p^{(1)}_{11} = 0.1$, $p^{(2)}_{11} = 0.01 + 0.63 = 0.64$:
              below, then above, the limit $7/16 \approx 0.44$.
        feedback: >
          The sign of $\lambda_2$ decides the shape of the approach; its
          modulus decides the speed. Asked for $P^{n}$ in closed form, name
          the eigenvalues first and say that $|\lambda_2|$ sets how fast the
          chain forgets its start — that is usually the follow-up.

  - node: quant-processes.markov-chains.communicating-classes
    hook: >
      Before setting up any first-step equations, sort the states into
      classes — the whole shape of the problem, a single absorption
      computation versus a system to solve for equilibrium, follows from how
      many classes there are and which ones are closed.
    explanation: >
      Accessibility ($i\to j$ if some $p^{(n)}_{ij}>0$) is one-directional;
      communication requires it both ways, and communication is an
      equivalence relation — reflexive via $n=0$, symmetric by definition,
      transitive by the Chapman–Kolmogorov composition of positive-probability
      paths. That means the state space always splits cleanly into disjoint
      communicating classes, with no ambiguity about which class a state
      belongs to.

      A class is closed if no transition ever leaves it — once inside, the
      chain stays inside forever — and a closed class of size one, where
      $p_{ii}=1$, is an absorbing state. Irreducibility is the single-class
      case: every state reaches every other, so there's nothing to trap the
      chain permanently in a sub-region.

      This classification is the fork in the road for everything that
      follows in the unit: a chain with a closed proper subset, in
      particular any absorbing state, is never irreducible, and it's exactly
      these chains that support genuine absorption questions ("which class do
      we end up in?"). Irreducible chains, having nowhere to get trapped, are
      instead the setting for equilibrium questions ("where does the chain
      spend its time?").
    worked: >
      Take states $1,2,3,4,5$ with $1\to2$, $2\to1$, $2\to3$, $3\to3$, and
      $4\to5$, $5\to4$. States $1$ and $2$ communicate (each reaches the
      other directly) but the class $\{1,2\}$ isn't closed, since $2\to3$
      escapes it. State $3$ is absorbing, a closed class of size one. States
      $4$ and $5$ communicate and no transition leaves $\{4,5\}$, so it's a
      closed class. That's three communicating classes total, exactly one of
      them absorbing.
    interview: >
      "Is this chain irreducible?" or "identify the classes" is a setup
      question asked before the real one — the interviewer wants the classes
      named and each one flagged closed or not before any equation gets
      written.
    pitfalls: >
      Calling a class "closed" just because it looks self-contained without
      checking every outgoing transition misses classes that leak through a
      single low-probability edge. Treating one-directional accessibility
      ($i\to j$ but not $j\to i$) as communication merges states that don't
      actually belong in the same class.
    recap: >
      States split into communicating classes by mutual reachability; a
      chain with more than one class is never irreducible, and a closed
      class of size one is an absorbing state.
    dialogue:
      - part: Who can get back to whom
        teach: >
          A sales pipeline has six states: Lead, Demo, Trial, Customer,
          Renewal and Lost. Each week the account moves along one of these
          arrows, each with positive probability: Lead to Demo; Demo to Lead
          or Trial; Trial to Demo, Customer or Lost; Customer to Renewal;
          Renewal to Customer or Lost; Lost stays Lost.
      - ask: >
          A Lead can become a Customer. Can a Customer ever become a Lead
          again?
        choices:
          - text: >
              Yes: Lead reaches Customer, so the path runs both ways.
            feedback: >
              Arrows have directions. From Customer the only arrows lead to
              Renewal, and from Renewal only to Customer or Lost — none of
              them ever returns to the Demo side.
          - text: >
              No: from Customer the chain only ever visits Customer, Renewal
              and Lost.
            correct: true
            feedback: >
              Reachability is one-directional. Lead reaches Customer, and
              Customer does not reach Lead.
          - text: >
              Only if the transition probabilities are large enough.
            feedback: >
              Reachability asks only whether some path has positive
              probability. No path exists, whatever the sizes of the
              probabilities on the existing arrows.
        feedback: >
          "Can $i$ get to $j$?" and "can $j$ get to $i$?" are separate
          questions, and the pipeline answers them differently.
      - ask: >
          Put two states in the same group exactly when each can reach the
          other. How many groups do the six states form?
        expects: "3"
        hint: >
          Start from Lead and collect every state that both reaches Lead and
          is reached from it. Then take a state not yet used.
        feedback: >
          $\{\text{Lead}, \text{Demo}, \text{Trial}\}$ all reach one another
          through Demo. $\{\text{Customer}, \text{Renewal}\}$ reach each
          other. $\{\text{Lost}\}$ reaches nothing else. Three groups.
      - reflect: >
          What exactly were you checking when you grouped two states, and why
          did every state land in exactly one group, never two?
        hint: >
          If $i$ shares a group with $j$, and $j$ with $k$, must $i$ share one
          with $k$?
        answer: >
          You checked mutual reachability: a path of positive probability from
          $i$ to $j$ and one back. That relation is reflexive (zero steps),
          symmetric (by definition) and transitive (follow one path, then the
          other), so it is an equivalence relation, and its equivalence
          classes split the states with no overlaps.

      - part: Classes, closed and not
        teach: >
          $j$ is accessible from $i$, written $i \to j$, if $p^{(n)}_{ij} > 0$
          for some $n \ge 0$; $i$ and $j$ communicate if $i \to j$ and
          $j \to i$. Communication is an equivalence relation, and its classes
          are the communicating classes. A class is closed if no transition
          leaves it, an absorbing state is a closed class of size one
          ($p_{ii} = 1$), and the chain is irreducible when there is only one
          class.
      - ask: >
          Which classes of the pipeline are closed?
        choices:
          - text: >
              $\{\text{Customer}, \text{Renewal}\}$ and $\{\text{Lost}\}$
            feedback: >
              Renewal has an arrow to Lost, so the Customer class leaks. A
              class is closed only if no single arrow leaves it.
          - text: >
              Only $\{\text{Lost}\}$
            correct: true
            feedback: >
              Lost stays Lost with probability $1$: closed, and of size one,
              so absorbing. The other two classes each have an exit.
          - text: >
              $\{\text{Lead}, \text{Demo}, \text{Trial}\}$, because nothing
              outside it ever comes back in.
            feedback: >
              That describes arrows coming in. Closed is about arrows going
              out, and Trial sends arrows to Customer and Lost.
        feedback: >
          The pipeline is not irreducible: three classes, one of them
          absorbing.
      - ask: >
          Transitivity rests on this: if $p^{(2)}_{ik} > 0$ and
          $p^{(3)}_{kj} > 0$, then $p^{(5)}_{ij} > 0$. Why?
        choices:
          - text: >
              Chapman–Kolmogorov gives $p^{(5)}_{ij} = \sum_{l} p^{(2)}_{il}\,p^{(3)}_{lj} \ge p^{(2)}_{ik}\,p^{(3)}_{kj} > 0$.
            correct: true
            feedback: >
              Every term of the sum is nonnegative, so the sum is at least
              the single term through $k$, which is positive.
          - text: >
              Because probabilities multiply: $p^{(5)}_{ij} = p^{(2)}_{ik}\,p^{(3)}_{kj}$.
            feedback: >
              That is only one route, through $k$ at time $2$. The true
              five-step probability adds every midpoint; equality would be
              wrong, though the inequality is enough.
          - text: >
              Because the chain is irreducible.
            feedback: >
              The pipeline is not irreducible, and transitivity still holds
              in it. It holds in every chain.
        feedback: >
          Reachability composes because probabilities of paths compose — no
          separate graph argument needed.

      - part: Testing a new chain
        ask: >
          A new chain on states $1, 2, 3, 4$ has arrows $1 \to 2$, $2 \to 3$,
          $3 \to 4$, $4 \to 1$ and $1 \to 3$, each with positive probability.
          How many communicating classes does it have?
        expects: "1"
        feedback: >
          The cycle $1 \to 2 \to 3 \to 4 \to 1$ passes through every state,
          so each reaches each. The shortcut $1 \to 3$ changes nothing: one
          class, and the chain is irreducible.
      - ask: >
          Back to the pipeline. The renewal team points out that Renewal goes
          to Lost only $1\%$ of the time, and argues the Customer class is
          closed "for practical purposes". What does that one small arrow
          decide?
        choices:
          - text: >
              Very little: $99\%$ of the time the account stays in the class.
            feedback: >
              That is one week. The account visits Renewal again and again,
              and each visit is another $1\%$ chance to leave — over enough
              visits, leaving becomes certain.
          - text: >
              Everything: the class is not closed, so no account stays a
              Customer forever, and Lost is the only place the chain settles.
            correct: true
            feedback: >
              Closedness has no threshold. One arrow out, however light,
              means the class is passed through, not settled in.
          - text: >
              It makes the Customer class absorbing instead of Lost.
            feedback: >
              An absorbing state has $p_{ii} = 1$, and the Customer class has
              two states and an exit. It is the leak that matters.
        feedback: >
          Before writing any equation for a chain, name its classes and mark
          each closed or not by checking every outgoing arrow. Absorption
          questions live on chains with closed classes to fall into;
          equilibrium questions live on irreducible ones.

  - node: quant-processes.markov-chains.classification
    hook: >
      "Is state $i$ recurrent?" sounds qualitative, but the interview wants
      the quantitative handle — $f_i=1$, or the divergence of
      $\sum_np^{(n)}_{ii}$ — not an intuition about whether the chain "tends
      to come back."
    explanation: >
      $f_i$ is the probability of ever returning to $i$ having started
      there. When $f_i=1$, the chain returns to $i$ with certainty, and by
      restarting the same argument at each return it returns infinitely
      often with probability $1$ — that's recurrence. When $f_i<1$, each
      visit independently has probability $f_i$ of being followed by
      another, so the total number of visits to $i$ is geometric with
      parameter $1-f_i$ and finite mean $1/(1-f_i)$ — that's transience, and
      it comes with a genuine number of expected visits rather than an
      all-or-nothing outcome.

      The equivalent series test, $i$ recurrent iff
      $\sum_{n\ge1}p^{(n)}_{ii}=\infty$, is often easier to check directly
      than computing $f_i$, since $p^{(n)}_{ii}$ is sometimes read off a
      chain's structure without solving any system.

      Recurrence, positive recurrence (finite mean return time, as opposed to
      null recurrence) and the period are all class properties: every state
      in a communicating class shares them, so classifying one
      representative state classifies the whole class. On a finite chain
      this collapses further — every closed class is positive recurrent
      automatically, and null recurrence, which needs an infinite state
      space to spread its mean return time to infinity, simply cannot occur.
    worked: >
      State $A$ transitions to itself with probability $0.4$ and to
      absorbing state $B$ with probability $0.6$. Returning to $A$ can only
      happen by staying there on the very first step (once you leave to $B$
      you're stuck forever), so $f_A=\Pr(X_1=A)=0.4<1$: $A$ is transient. The
      expected total number of visits to $A$, including the start, is
      $1/(1-f_A)=1/0.6=5/3\approx1.67$.
    interview: >
      "Is state $X$ recurrent or transient" in a chain with an obvious
      escape hatch (an absorbing state reachable from $X$) is answered by
      computing $f_X$ directly from the escape probability, not by invoking
      the series test, which is better suited to infinite chains like random
      walks.
    pitfalls: >
      Computing $f_i$ as the probability of returning on the very next step
      alone, rather than ever, undercounts it whenever multi-step return
      paths exist. Assuming positive recurrence automatically once you've
      shown $f_i=1$ ignores that null recurrence is a real possibility on an
      infinite state space.
    recap: >
      Recurrent means $f_i=1$ (infinitely many visits, certain); transient
      means $f_i<1$ (geometric visits, mean $1/(1-f_i)$); and recurrence,
      positive recurrence and period are shared by every state in a class.
    dialogue:
      - part: Will the robot come home?
        teach: >
          A delivery robot starts at the Dock. Each hour at the Dock it leaves
          on route $A$ or route $B$, with probability $1/2$ each. From route
          $A$ it always returns to the Dock the next hour. From route $B$ it
          returns with probability $0.4$; otherwise it breaks down, and Broken
          is permanent.
      - ask: >
          Starting at the Dock, what is the probability the robot ever returns
          to the Dock?
        expects: "0.7"
        hint: >
          It cannot be back after one hour. Split on the route it takes.
        feedback: >
          $\tfrac12 \times 1 + \tfrac12 \times 0.4 = 0.5 + 0.2 = 0.7$. The
          chance of being at the Dock one hour later is $0$, yet the chance
          of *ever* returning is $0.7$.
      - ask: >
          What is the probability it returns at least twice?
        expects: "0.49"
        hint: >
          After the first return, the robot is at the Dock again with no
          memory of the trip.
        feedback: >
          Each return starts the same experiment afresh, so
          $0.7 \times 0.7 = 0.49$.
      - ask: >
          What is the expected number of times the robot is at the Dock,
          counting the start?
        expects: "10/3"
        tolerance: 0.005
        hint: >
          The number of visits is $k$ with probability $0.7^{k-1} \times 0.3$.
        feedback: >
          Each visit is the last with probability $0.3$, so the count is
          geometric with mean $1/0.3 = 10/3 \approx 3.33$.
      - ask: >
          Now suppose route $B$ always returned to the Dock as well. How many
          visits would the Dock get?
        choices:
          - text: >
              About twice as many, since the return chance went from $0.7$ to
              more.
            feedback: >
              The mean $1/(1 - 0.7)$ does not scale smoothly to the new case:
              with a return chance of $1$ the formula divides by $0$.
          - text: >
              Infinitely many, with probability $1$.
            correct: true
            feedback: >
              Every visit is followed by another with certainty, so the
              returns never stop.
          - text: >
              A large but finite number, because it might eventually take a
              very long route.
            feedback: >
              Every trip takes exactly two hours here. Certain return, applied
              at each visit, leaves no room for a last visit.
        feedback: >
          A return chance below $1$ gives finitely many visits; a return
          chance of exactly $1$ gives infinitely many. There is nothing in
          between.
      - reflect: >
          What single number decided between "a few visits" and "infinitely
          many", and why did the visit count come out geometric?
        answer: >
          The probability $f$ of ever returning to the state you started in.
          Each time the chain is back, the Markov property makes the future
          a fresh copy of the original experiment, so each visit is followed
          by another with the same probability $f$, independently of the
          past. If $f < 1$ the count is geometric with mean $1/(1-f)$; if
          $f = 1$ the chain comes back forever.

      - part: Recurrent, transient, and the period
        teach: >
          With $f_i = \Pr(\text{ever return to } i \mid X_0 = i)$, state $i$ is
          recurrent if $f_i = 1$ and transient if $f_i < 1$, in which case the
          number of visits is geometric with mean $1/(1-f_i)$. Equivalently,
          $i$ is recurrent exactly when $\sum_{n \ge 1} p^{(n)}_{ii} = \infty$.
          A recurrent state is positive recurrent if its mean return time is
          finite, null recurrent otherwise. The period is
          $d(i) = \gcd\{n \ge 1 : p^{(n)}_{ii} > 0\}$. All three are class
          properties.
      - ask: >
          In the original robot chain, which states are recurrent?
        choices:
          - text: >
              The Dock: the robot returns to it most of the time.
            feedback: >
              Most of the time is $0.7$, and recurrence needs $1$. The Dock is
              transient.
          - text: >
              Route $A$: from there the robot always returns to the Dock.
            feedback: >
              Recurrence is about returning to $A$ itself. Route $A$ shares a
              class with the Dock, and class properties are shared — so it is
              transient too.
          - text: >
              Only Broken.
            correct: true
            feedback: >
              Broken returns to itself every hour, so $f = 1$. The class
              $\{\text{Dock}, A, B\}$ leaks into Broken and is transient as a
              whole.
        feedback: >
          Classify one state per class and you have classified the class.
      - ask: >
          $\sum_{n \ge 1} p^{(n)}_{ii}$ is the expected number of returns to
          $i$, by adding indicators. For the Dock, what is it?
        expects: "7/3"
        tolerance: 0.005
        feedback: >
          Expected visits counting the start were $10/3$, so expected returns
          are $10/3 - 1 = 7/3$. Term by term: $0.7 + 0.49 + 0.343 + \cdots = 0.7/0.3$.
          A finite sum, as a transient state demands.
      - ask: >
          What is the period of the Dock?
        expects: "2"
        feedback: >
          Every trip out and back takes exactly two hours, by either route,
          so returns happen only at even times: $d = \gcd\{2, 4, 6, \dots\} = 2$.

      - part: What a finite chain rules out
        ask: >
          A colleague claims a state of a finite chain that is certain to
          return, $f_i = 1$, but whose mean return time is infinite. What do
          you say?
        choices:
          - text: >
              That is null recurrence, and it is common.
            feedback: >
              It needs room to wander: the simple symmetric walk on the
              integers is the standard example. On finitely many states a
              certain return always has a finite mean.
          - text: >
              It cannot happen: in a finite chain, closed classes are
              positive recurrent and null recurrence never occurs.
            correct: true
            feedback: >
              With finitely many states, the chain cannot spread its return
              time thinly enough to make the mean infinite.
          - text: >
              It cannot happen, because $f_i = 1$ forces a return within one
              step.
            feedback: >
              The Dock needs two steps for every return, and other states
              need many more. Certainty says nothing about speed.
        feedback: >
          In an interview, "recurrent or transient?" for a chain with an
          escape hatch is answered with $f_i$ computed from the escape
          probability. Say the number out loud: here $f = 0.7$, so the Dock
          is transient and visited $10/3$ times on average.

  - node: quant-processes.markov-chains.periodicity
    hook: >
      A chain with period $2$ is the specific trap behind "why doesn't $P^n$
      converge here" — recognizing bipartite structure on sight saves you
      from debugging a correct computation that simply doesn't have a limit.
    explanation: >
      The period $d(i)=\gcd\{n\ge1:p^{(n)}_{ii}>0\}$ measures the common
      divisor of every length of path that returns to $i$. Because period is
      a class property, an irreducible chain has one period shared by every
      state, and $d=1$ (aperiodic) is the case where $P^n$ can actually
      converge to a single limiting matrix.

      The two cheap tests worth having automatic: a self-loop anywhere
      ($p_{ii}>0$ for some $i$) forces $d=1$ immediately, since $1$ itself is
      then in the gcd set; and finding two return paths of coprime lengths
      through the same state (a $3$-cycle and a $4$-cycle sharing a vertex,
      say) does the same without needing a self-loop.

      Bipartite structure is the mechanism behind essentially every
      period-$2$ chain that shows up in interviews: split the states into two
      sides such that every transition crosses sides, and a return to your
      starting side is only possible after an even number of steps, so
      $d\ge2$. This is why a walk on any even cycle, or any bipartite graph,
      never settles into a fixed limiting distribution even though it may be
      perfectly irreducible.
    worked: >
      On the $4$-cycle $w$–$x$–$y$–$z$–$w$, stepping to a uniformly chosen
      neighbor each move: $p^{(1)}_{ww}=0$, since every neighbor of $w$ is
      $x$ or $z$, never $w$ itself. But
      $p^{(2)}_{ww}=\Pr(w\to x\to w)+\Pr(w\to z\to w)=0.25+0.25=0.5>0$. Every
      return to $w$ takes an even number of steps, so
      $d(w)=\gcd\{2,4,6,\dots\}=2$: the walk is irreducible yet periodic.
    interview: >
      "Does $P^n$ converge for this chain?" after a bipartite-looking graph
      or an even-length cycle wants period checked before anything else —
      the interviewer is testing whether you spot period $2$ rather than
      debugging non-convergent numerics.
    pitfalls: >
      Checking only $p_{ii}$ for a single small $n$ and declaring the state
      periodic misses that a self-loop elsewhere in the same class already
      forces aperiodicity for every state in it, including this one.
      Assuming irreducibility alone guarantees convergence overlooks
      periodicity as the second, independent condition that can still block
      it.
    recap: >
      Period is the gcd of return-path lengths; a self-loop or two coprime
      cycle lengths force aperiodicity, while bipartite structure — the case
      that keeps appearing — forces period $2$.
    dialogue:
      - part: A knight that cannot come home on time
        teach: >
          A knight starts on a1 of an ordinary chessboard and, each turn,
          jumps to a uniformly chosen legal square. The knight can reach every
          square from every other, so the chain has a single class.
      - ask: >
          Can the knight be back on a1 after exactly $5$ moves?
        choices:
          - text: >
              Yes: the chain is irreducible, so every square is reachable at
              every large enough time.
            feedback: >
              Irreducible says every square is reachable at *some* time, not
              at every time. Look at the colour of the square after each jump.
          - text: >
              No: every knight move changes the colour of the square, so after
              an odd number of moves the knight is on a light square, and a1
              is dark.
            correct: true
            feedback: >
              Colours alternate with every jump, so the knight is back on a
              dark square only after an even number of moves.
          - text: >
              Only with a small probability, since a five-move loop is rare.
            feedback: >
              The probability is exactly $0$, not small. No five-move route
              from a1 to a1 exists.
        feedback: >
          Returns to a1 can only happen at even times, whatever route the
          knight takes.
      - ask: >
          What is the smallest number of moves in which the knight can return
          to a1?
        expects: "2"
        feedback: >
          a1 to b3 and back, or a1 to c2 and back. The possible return times
          are $2, 4, 6, \dots$ — every one even.
      - ask: >
          Does $\Pr(\text{knight on a1 after } n \text{ moves})$ converge as
          $n \to \infty$?
        choices:
          - text: >
              Yes, to $1/64$, since the knight spreads over the board.
            feedback: >
              At every odd $n$ the probability is exactly $0$. A sequence that
              returns to $0$ every other term cannot settle on a positive
              number.
          - text: >
              Yes, to $0$, because the board is large.
            feedback: >
              At even times the knight is on a dark square, one of $32$, and
              a1 keeps a positive chance. The even terms stay away from $0$.
          - text: >
              No: it is $0$ at every odd $n$ and positive at every even $n$.
            correct: true
            feedback: >
              The sequence oscillates forever. The chain is irreducible and
              still has no limiting law from a fixed start.
        feedback: >
          Irreducibility is not enough to settle down. Something else is
          blocking the limit.
      - reflect: >
          What feature of the knight's moves forces every return to take an
          even number of steps, and what is the smallest change to the chain
          that would break that rhythm?
        hint: >
          What would a single return of odd length do to the set of return
          times?
        answer: >
          The squares split into two colours and every move crosses from one
          to the other — the chain is bipartite — so leaving and coming back
          takes an even number of crossings. Any return of odd length breaks
          it — for instance, let the knight sometimes stay where it is. A
          stay is a return of length $1$, and then the return times have no
          common factor above $1$.

      - part: The period, and the cheap tests
        teach: >
          The period of state $i$ is $d(i) = \gcd\{n \ge 1 : p^{(n)}_{ii} > 0\}$,
          and $i$ is aperiodic when $d(i) = 1$. The period is a class property,
          so an irreducible chain has one period. Bipartite structure forces
          $d = 2$. Two sufficient conditions for aperiodicity in an
          irreducible chain: some $p_{ii} > 0$, or two return lengths through
          the same state with greatest common divisor $1$. A chain of period
          $d$ cycles through $d$ subclasses in a fixed rotation.
      - ask: >
          A token walks on a triangle with corners $X$, $Y$, $Z$, moving to
          one of the two other corners with probability $1/2$ each. What is
          the period of $X$?
        expects: "1"
        hint: >
          Find a return of length $2$ and a return of length $3$.
        feedback: >
          $X \to Y \to X$ takes $2$ steps and $X \to Y \to Z \to X$ takes $3$,
          so $d(X)$ divides $\gcd(2, 3) = 1$. No self-loop anywhere, and the
          walk is still aperiodic: the triangle is an odd cycle.
      - ask: >
          Which single change makes the knight's chain aperiodic?
        choices:
          - text: >
              On a1 only, the knight stays put with probability $0.1$.
            correct: true
            feedback: >
              One self-loop gives a1 period $1$, and the period is shared by
              the whole class — every square becomes aperiodic.
          - text: >
              Remove the corner squares, so the knight has fewer awkward moves.
            feedback: >
              Every remaining move still changes colour. The board is still
              bipartite and the period is still $2$.
          - text: >
              Let the knight make two jumps per turn instead of one.
            feedback: >
              Two jumps return a dark square to a dark square, so from a1 the
              chain never visits a light square at all. The light squares
              split off into a separate class and the chain stops being
              irreducible.
        feedback: >
          A self-loop anywhere in an irreducible chain makes every state
          aperiodic. You do not need one at the state you care about.

      - part: Reading the period off a picture
        ask: >
          A walk on the path $1$–$2$–$3$ steps to a uniform neighbour, except
          that at $3$ it stays put with probability $1/2$. State $1$ has no
          self-loop and its two shortest returns take $2$ and $4$ steps. A
          colleague concludes $d(1) = 2$. What is wrong?
        choices:
          - text: >
              Nothing: two even return lengths give an even period.
            feedback: >
              The gcd is over every return length, not the two shortest.
              $1 \to 2 \to 3 \to 3 \to 2 \to 1$ takes $5$ steps.
          - text: >
              The period is a class property, and state $3$ has a self-loop,
              so $d(1) = 1$.
            correct: true
            feedback: >
              The chain is irreducible and $d(3) = 1$, so $d(1) = 1$. The
              five-step return through the loop at $3$ shows it directly:
              $\gcd(2, 5) = 1$.
          - text: >
              State $1$ is transient, so it has no period.
            feedback: >
              Every state of this finite irreducible chain is recurrent, and
              every state with some return has a period.
        feedback: >
          Checking one state's short returns and stopping is the classic
          slip. Look for any self-loop or odd cycle in the class.
      - ask: >
          Back to the plain knight, with no staying put. Into how many cyclic
          subclasses, visited in fixed rotation, does its chain split?
        expects: "2"
        feedback: >
          The dark squares and the light squares, visited alternately. When a
          chain refuses to converge, check the period before blaming the
          algebra: say "it is bipartite, so period $2$" and name the two
          sides.

  - node: quant-processes.markov-chains.absorption
    hook: >
      "Which absorbing state does this end in?" is answered by one linear
      equation per transient state, not by simulating or by summing an
      infinite series of paths.
    explanation: >
      Fix the target absorbing state $a$ and define
      $h_i=\Pr(\text{absorbed at }a\mid X_0=i)$ for every state $i$.
      Conditioning on the very next step — first-step analysis — expresses
      $h_i$ in terms of its immediate neighbors' own $h$-values:
      $h_i=\sum_jp_{ij}h_j$. The boundary values are known outright: $h_a=1$,
      and $h_b=0$ at every other absorbing state, since once absorbed
      there's no escaping.

      On a finite chain where every transient state can actually reach
      absorption, this system has a unique solution and absorption happens
      with probability $1$ — the transient states earn their name honestly.
      On an infinite state space that guarantee can fail, and the
      probabilistically meaningful solution is the minimal nonnegative one,
      not just any solution to the linear equations.

      The practical recipe: one unknown per transient state, exploit every
      symmetry in the problem to merge unknowns before solving (a symmetric
      problem often needs far fewer equations than states), then solve by
      substitution or elimination.
    worked: >
      A counter starts on $\{0,1,2,3\}$, absorbing at $0$ and $3$; from $1$
      it moves to $0$ or $2$ with probability $0.5$ each, and from $2$ it
      moves to $1$ or $3$ with probability $0.5$ each. With
      $h_i=\Pr(\text{absorbed at }3\mid X_0=i)$: $h_1=0.5h_0+0.5h_2=0.5h_2$,
      and $h_2=0.5h_1+0.5h_3=0.5h_1+0.5$. Substituting,
      $h_1=0.5(0.5h_1+0.5)=0.25h_1+0.25$, so $h_1=1/3$ and $h_2=2/3$.
    interview: >
      "What's the probability this process ends up at $A$ rather than $B$?"
      is first-step analysis every time; the interviewer listens for the
      boundary conditions stated explicitly ($h=1$ at the target, $0$ at
      every other absorbing state) before the system gets solved.
    pitfalls: >
      Forgetting to set $h=0$ at every other absorbing state, not just the
      ones that seem relevant, leaves the system under-determined. Solving
      for $h_i$ without first confirming every transient state can actually
      reach some absorbing state risks trusting a system whose real-world
      answer is only a probability, not a certainty.
    recap: >
      One equation $h_i=\sum_jp_{ij}h_j$ per transient state, with $h=1$ at
      the target absorbing state and $h=0$ at every other, solved as
      ordinary linear algebra.
    dialogue:
      - part: A game that might go on for a while
        teach: >
          You roll a fair die repeatedly. You win the moment a $6$ appears.
          You lose the moment two $1$s appear on consecutive rolls. Any other
          roll just continues the game.
      - ask: >
          What is the probability the game is decided within the first two
          rolls?
        expects: "1/3"
        hint: >
          Add three cases: a $6$ first; something other than a $6$ and then
          a $6$; a $1$ and then a $1$.
        feedback: >
          Win at roll $1$: $6/36$. Win at roll $2$: $(5/6)(1/6) = 5/36$. Lose
          at roll $2$: $(1/6)(1/6) = 1/36$. Total $12/36 = 1/3$.
      - ask: >
          Two thirds of the time the game is still going after two rolls. What
          stands in the way of computing your winning chance by adding up the
          ways the game can end?
        choices:
          - text: >
              The game might never end, so the winning chance is undefined.
            feedback: >
              Each roll has at least a $1/6$ chance of a $6$, so the chance of
              lasting $n$ rolls is at most $(5/6)^{n} \to 0$. The game ends
              with probability $1$.
          - text: >
              It is an infinite sum over histories of every length, and the
              histories branch on whether the last roll was a $1$.
            correct: true
            feedback: >
              Right. Each extra roll adds a new layer of cases, and the
              bookkeeping of "was the last roll a $1$?" makes the series
              awkward to sum.
          - text: >
              Nothing: the answer is just $1/6$ divided by $1/6 + 1/36$.
            feedback: >
              That ratio treats the game as a race between two fixed events
              per roll, but losing needs two rolls and a $6$ in between
              resets it. The real answer is different.
        feedback: >
          Summing over histories repeats the same sub-problem at every depth.
          The fix is to notice the repetition.
      - reflect: >
          Call $h$ your winning chance at the start. After a first roll of
          $2$, $3$, $4$ or $5$, what is your winning chance from that moment?
          What does that suggest instead of an infinite sum?
        hint: >
          What is different about the game after a $3$, compared with the
          very start?
        answer: >
          Nothing is different: the game has forgotten the $3$, so the
          winning chance is $h$ again. After a $1$ the situation is genuinely
          new — one more $1$ loses — so give it its own unknown. Conditioning
          on the first roll writes each unknown in terms of the others, and
          the infinite sum collapses into a small linear system.

      - part: One equation per transient state
        teach: >
          Name the states: Neutral, One (last roll a $1$), Win, Lose, the last
          two absorbing. For a target absorbing state $a$, let
          $h_i = \Pr(\text{absorbed at } a \mid X_0 = i)$. First-step analysis
          gives $h_i = \sum_j p_{ij} h_j$ for each transient $i$, with
          $h_a = 1$ and $h_b = 0$ at every other absorbing state. On a finite
          chain where every transient state can reach absorption, the solution
          is unique.
      - ask: >
          Which equation holds for the state One?
        choices:
          - text: >
              $h_{\text{One}} = \tfrac16 + \tfrac16 h_{\text{One}} + \tfrac46 h_{\text{Neutral}}$
            feedback: >
              A $1$ from the state One is the second consecutive $1$ — you
              lose. It does not keep you in One.
          - text: >
              $h_{\text{One}} = \tfrac16 + \tfrac46 h_{\text{Neutral}}$
            correct: true
            feedback: >
              A $6$ wins ($h = 1$), a $1$ loses ($h = 0$, so the term
              vanishes), and $2$ to $5$ reset to Neutral.
          - text: >
              $h_{\text{One}} = \tfrac16 + \tfrac16 + \tfrac46 h_{\text{Neutral}}$
            feedback: >
              That scores the losing roll as $h_{\text{Lose}} = 1$. The
              boundary value at the other absorbing state is $0$.
        feedback: >
          From Neutral, the same reasoning gives
          $h_{\text{Neutral}} = \tfrac16 + \tfrac16 h_{\text{One}} + \tfrac46 h_{\text{Neutral}}$.
      - ask: >
          Solve the two equations. What is $h_{\text{Neutral}}$, your winning
          chance at the start?
        expects: "7/8"
        hint: >
          The Neutral equation rearranges to
          $2h_{\text{Neutral}} = 1 + h_{\text{One}}$. Substitute the One
          equation.
        feedback: >
          $2h_{\text{N}} = 1 + \tfrac16 + \tfrac23 h_{\text{N}}$, so
          $\tfrac43 h_{\text{N}} = \tfrac76$ and $h_{\text{N}} = 7/8$.
      - ask: >
          And $h_{\text{One}}$?
        expects: "3/4"
        feedback: >
          $h_{\text{One}} = \tfrac16 + \tfrac46 \cdot \tfrac78 = \tfrac16 + \tfrac{7}{12} = \tfrac34$.
          Having a $1$ showing costs you $1/8$ of winning chance.
      - ask: >
          The equation for Neutral replaced "your chance after rolling a $3$"
          by $h_{\text{Neutral}}$. What licenses that?
        choices:
          - text: >
              The Markov property: given the state is Neutral, the future of
              the game does not depend on the rolls that led there.
            correct: true
            feedback: >
              That is the load-bearing step. The law of total probability
              splits on the first roll; the Markov property says each branch
              is the same problem restarted from its new state.
          - text: >
              The law of large numbers: over many rolls the game averages out.
            feedback: >
              No averaging over time happens here. The step is exact, and it
              holds after a single roll.
          - text: >
              The fact that rolls are equally likely.
            feedback: >
              A loaded die would change the coefficients, not the method. The
              restart works for any per-roll probabilities.
        feedback: >
          Total probability on the first step, then the Markov property on
          what follows: that is all first-step analysis is.

      - part: A state that never finishes
        ask: >
          A variant: rolling a $3$ from Neutral sends you to a Lounge you
          never leave, and the game never ends there. Its equation reads
          $h_{\text{Lounge}} = h_{\text{Lounge}}$. What should you do?
        choices:
          - text: >
              Nothing special: solve the system as usual.
            feedback: >
              The Lounge equation holds for every value, so the system has
              infinitely many solutions. The equations alone cannot pick one.
          - text: >
              Set $h_{\text{Lounge}} = 0$, because from the Lounge the chain
              never reaches Win.
            correct: true
            feedback: >
              The Lounge is a closed class without the target in it, so it
              gets a boundary value just as Lose does. Every closed class
              needs one.
          - text: >
              Set $h_{\text{Lounge}} = 1/2$, since the game is undecided.
            feedback: >
              $h$ is the probability of ever reaching Win, and from the Lounge
              that event is impossible. Undecided games are lost games for
              this question.
        feedback: >
          The uniqueness promise needs every transient state to reach
          absorption. When a closed class traps the chain, give it its
          boundary value before solving. In an interview, say the boundary
          conditions out loud first — $h = 1$ at the target, $0$ at every
          other closed class — then write one equation per transient state.

  - node: quant-processes.markov-chains.tennis-deuce
    hook: >
      Deuce looks like it could spiral into an infinite rally of
      advantage-back-to-deuce swings, but first-step analysis collapses it to
      three unknowns precisely because the chain restarts at $D$ every time
      the score returns there.
    explanation: >
      The five raw states $D,A,B,W,L$ hide a huge amount of repeated
      structure: every trip through $A$ or $B$ that doesn't end the game
      lands back at $D$, so the chain's memory never extends further than
      "who currently has advantage." That's what licenses treating
      $h=\Pr(\text{win}\mid D)$ as a single unknown rather than tracking how
      many times the score has oscillated.

      The algebra is standard first-step analysis applied twice — once from
      $D$ using $h_A,h_B$, and once from $A,B$ back in terms of $h$ itself —
      and substituting collapses everything to $h=p^2+2pq\,h$, a single
      equation in one unknown. The $p^2$ term is the direct route (win the
      next two points outright from deuce), and $2pq\,h$ is the fact that
      any single split of the next two points returns exactly to deuce, at
      which point the problem is identical to the original one — restart,
      not partial progress.

      The resulting formula $h=p^2/(p^2+q^2)$ is worth reading as a ratio of
      two rates rather than memorizing: winning from deuce is a race between
      reaching a two-point lead as one side versus the other, and squaring
      both probabilities is what a race between two geometric-style margins
      produces.
    worked: >
      At $p=0.55$ (a modest edge), $q=0.45$, so
      $h=p^2/(p^2+q^2)=0.3025/(0.3025+0.2025)=0.3025/0.505=121/202\approx
      0.599$. A $55\%$ point-winner converts deuce only about $60\%$ of the
      time — far closer to even than the $69\%$ a $60\%$ server gets,
      showing how sharply this probability responds to the per-point edge.
    interview: >
      "From deuce, what's the probability of winning the game?" wants the
      three-state reduction stated explicitly (advantage states feed back to
      $D$, so no infinite case analysis is needed) before the formula
      appears; a good answer also notes the amplification — a small
      per-point edge becomes a much larger game-winning edge.
    pitfalls: >
      Trying to sum an infinite series over every possible number of
      $D$-to-$D$ oscillations instead of writing the self-referential
      equation wastes time solving a problem that first-step analysis avoids
      entirely. Reporting $h=p^2$ alone, forgetting the $2pq\,h$ term for the
      case where the score returns to deuce, drops most of the probability
      mass.
    recap: >
      Deuce reduces to $h=p^2+2pq\,h$, giving $h=p^2/(p^2+q^2)$ — about
      $60\%$ at $p=0.55$, and $69\%$ at $p=0.6$.
    dialogue:
      - part: Two points from deuce
        teach: >
          The score is deuce. You win each point independently with
          probability $2/3$, and the game goes to whoever first leads by two
          points.
      - ask: >
          What is the probability the game is decided within the next two
          points?
        expects: "5/9"
        hint: >
          Decided means the same player took both points.
        feedback: >
          You take both: $(2/3)^{2} = 4/9$. Your opponent takes both:
          $(1/3)^{2} = 1/9$. Total $5/9$.
      - ask: >
          What is the probability the score is back at deuce after two points?
        expects: "4/9"
        feedback: >
          Win then lose, or lose then win: $2 \times \tfrac23 \times \tfrac13 = 4/9$.
          The three cases add to $4/9 + 1/9 + 4/9 = 1$.
      - reflect: >
          Deuce can come back two, five, twenty times. Instead of summing over
          the number of returns, what can you say about your winning chance at
          the moment the score is back at deuce?
        answer: >
          It is exactly the chance you started with. Deuce after a split pair
          is the same position as the original deuce — nothing about the
          earlier points matters — so the game restarts. Calling the winning
          chance $h$, the returns feed $h$ back into its own equation, and one
          self-referential equation replaces the infinite series.

      - part: The chain on five scores
        teach: >
          The scores form a chain on $\{D, A, B, W, L\}$: deuce, your
          advantage, their advantage, and the two absorbing results. With
          $p = 2/3$, $q = 1/3$ and $h$ the win probability from deuce,
          first-step analysis gives $h_A = p + q\,h$, $h_B = p\,h$ and
          $h = p\,h_A + q\,h_B$.
      - ask: >
          Substitute and solve. What is $h$?
        expects: "4/5"
        hint: >
          Substituting gives $h = p^{2} + 2pq\,h$.
        feedback: >
          $h = \tfrac49 + \tfrac49 h$, so $\tfrac59 h = \tfrac49$ and
          $h = 4/5$. In general $h = p^{2}/(1 - 2pq) = p^{2}/(p^{2} + q^{2})$.
      - ask: >
          What is $h_A$, your chance of winning from your own advantage?
        expects: "14/15"
        feedback: >
          $h_A = \tfrac23 + \tfrac13 \cdot \tfrac45 = \tfrac{10}{15} + \tfrac{4}{15} = \tfrac{14}{15}$.
          And $h_B = \tfrac23 \cdot \tfrac45 = \tfrac{8}{15}$: even at their
          advantage you are the favourite.
      - ask: >
          The answer $4/5$ equals $(4/9)/(5/9)$: your share of the
          decided two-point pairs. Why does that shortcut work?
        choices:
          - text: >
              Every split pair returns the game to deuce, so the game ends on
              the first pair of points that is not split, and that pair is
              yours with probability $p^{2}/(p^{2} + q^{2})$.
            correct: true
            feedback: >
              Group the points in pairs from deuce. Split pairs change
              nothing; the first unsplit pair decides, and conditioning on a
              pair being unsplit gives your share.
          - text: >
              It is a coincidence of $p = 2/3$.
            feedback: >
              The general formula $h = p^{2}/(p^{2} + q^{2})$ is exactly this
              ratio for every $p$.
          - text: >
              Because the game ends within two points with probability $1$.
            feedback: >
              It ends within two points only with probability $5/9$. The
              shortcut works because the other $4/9$ returns to the same
              position.
        feedback: >
          The algebra and the pairing argument say the same thing: deuce is a
          race between two squared probabilities.

      - part: Where the formula stops working
        ask: >
          A candidate answers "$4/9$: you need two points in a row". What did
          they drop?
        choices:
          - text: >
              The chance of losing two in a row.
            feedback: >
              Losing two in a row is a loss; it does not belong in the
              winning probability. The missing piece is the games that
              continue.
          - text: >
              The $2pq\,h$ term — every split pair returns to deuce, and you
              can still win from there.
            correct: true
            feedback: >
              $4/9$ counts only the direct route. The returns add another
              $\tfrac49 \times \tfrac45 = 16/45$, which is exactly the gap up to
              $4/5$.
          - text: >
              Nothing: $4/9$ is the probability of winning from deuce.
            feedback: >
              $4/9$ is the probability of winning the next two points. If the
              points split you are back at deuce, still able to win.
        feedback: >
          $h = p^{2} + 2pq\,h$: the direct route plus the restart.
      - ask: >
          Now the player tightens up: at their own advantage they still win
          the point with probability $2/3$, but from deuce or from their
          opponent's advantage they win it with probability $1/2$. What is
          the probability of winning from deuce?
        expects: "4/7"
        hint: >
          The formula assumed one $p$ for every point. Redo the three
          first-step equations with the right probability in each.
        feedback: >
          $h_A = \tfrac23 + \tfrac13 h$, $h_B = \tfrac12 h$, and
          $h = \tfrac12 h_A + \tfrac12 h_B = \tfrac13 + \tfrac16 h + \tfrac14 h$.
          So $\tfrac{7}{12} h = \tfrac13$ and $h = 4/7 \approx 0.571$. The
          closed form would give $1/2$ or $4/5$ depending on which $p$ you
          fed it; the chain gives the truth.
      - teach: >
          In an interview, say the reduction before the formula: "advantage
          states feed back to deuce, so I need three unknowns, not an
          infinite series." Then give the number and the moral — a $2/3$
          point-winner converts deuce $80\%$ of the time, because the two-point
          margin amplifies a per-point edge.

  - node: quant-processes.markov-chains.absorption-time
    hook: >
      Every first-step expectation equation needs a $+1$ that the
      corresponding probability equation doesn't — forgetting it is the
      single most common way to turn a correct absorption-probability setup
      into a wrong expected-time one.
    explanation: >
      With $k_i$ the expected number of steps to absorption from $i$,
      conditioning on the next step costs exactly one unit of time no matter
      where that step lands: $k_i=1+\sum_{j\text{ transient}}p_{ij}k_j$.
      Absorbing states carry $k_a=0$ and drop out of every sum that reaches
      them, since no more steps get taken once absorbed.

      The matrix form is worth having as a check: writing $Q$ for the
      sub-stochastic block of $P$ restricted to transient states,
      $k=(I-Q)^{-1}\mathbf{1}$. The fundamental matrix $(I-Q)^{-1}$ is not
      just an algebraic convenience — its $(i,j)$ entry is the expected
      number of visits to transient state $j$ before absorption, starting
      from $i$, so summing a row gives exactly $k_i$.

      The structural resemblance to the absorption-probability equations is
      deliberate and worth naming out loud: same states, same transition
      coefficients, only the constant term and the boundary values change.
      Setting up both systems together, side by side, catches sign and
      boundary errors that are easy to miss doing them separately.
    worked: >
      A counter on $\{0,1,2,3\}$, absorbing at $0$ and $3$, moving to each
      neighbor with probability $0.5$: $k_1=1+0.5k_0+0.5k_2=1+0.5k_2$ and
      $k_2=1+0.5k_1+0.5k_3=1+0.5k_1$. Substituting,
      $k_1=1+0.5(1+0.5k_1)=1.5+0.25k_1$, so $k_1=2$, and then
      $k_2=1+0.5(2)=2$ as well — by the position's left-right symmetry, both
      interior states take $2$ steps on average to reach a boundary.
    interview: >
      "What's the expected number of steps until this process ends?" is the
      same first-step machinery as the absorption-probability question,
      distinguished only by the additive $1$; the interviewer is
      specifically listening for that $+1$ being justified as "this step
      costs one unit of time regardless of outcome," not just appearing by
      rote.
    pitfalls: >
      Dropping the $+1$ collapses the equation to the probability-style form
      and produces a number with the wrong units. Including absorbing states
      in the sum $\sum_jp_{ij}k_j$ as if they contributed further expected
      steps double-counts time that was never actually spent.
    recap: >
      $k_i=1+\sum_jp_{ij}k_j$ for transient $i$, with $k=0$ at absorption —
      the same system as for absorption probabilities, plus the $+1$ that
      accounts for the step just taken.
    dialogue:
      - part: How long until it ships?
        teach: >
          A software release moves one stage per day. From Dev it always goes
          to QA. From QA it passes to Staging with probability $1/2$ and is
          bounced back to Dev with probability $1/2$. From Staging it ships
          with probability $1/2$ and is bounced back to Dev with probability
          $1/2$. Shipped is final. The release is in Dev today.
      - ask: >
          What is the probability it ships in exactly $3$ days, the fastest
          possible?
        expects: "1/4"
        feedback: >
          Dev, QA, Staging, Shipped: $1 \times \tfrac12 \times \tfrac12 = \tfrac14$.
      - ask: >
          A colleague reasons: "each pass through the pipeline ships with
          probability $1/4$, so the expected time is $4$ days". What is wrong?
        choices:
          - text: >
              Nothing: a success chance of $1/4$ means $4$ tries on average,
              and that is the answer.
            feedback: >
              Four tries, yes — but a try is not a day. A try bounced at QA
              takes $2$ days and one that reaches Staging takes $3$.
          - text: >
              $4$ is the expected number of passes; each pass lasts $2$ or $3$
              days, so the expected number of days is larger.
            correct: true
            feedback: >
              Right. Counting passes and counting days are different
              questions, and the day count needs the length of each pass.
          - text: >
              The answer must be $3$, the length of the only direct route.
            feedback: >
              $3$ is the minimum, achieved a quarter of the time. Every bounce
              adds days, so the mean is well above $3$.
        feedback: >
          Summing $n \Pr(T = n)$ over every possible shipping day is an
          infinite series with branching routes. There is a shorter way.
      - reflect: >
          Write $k_{\text{Staging}}$ for the expected days still to come when
          the release sits in Staging. Express it using the other unknowns,
          and say where every term comes from.
        hint: >
          Whatever happens next, one day passes.
        answer: >
          $k_{\text{Staging}} = 1 + \tfrac12 \cdot 0 + \tfrac12 k_{\text{Dev}}$.
          The $1$ is the day spent making the move, which is paid whatever
          the move turns out to be. Shipping ends the clock, contributing $0$,
          and a bounce restarts from Dev, contributing $k_{\text{Dev}}$. It is
          the absorption-probability equation with a $1$ added and $0$ at the
          absorbing state.

      - part: The equations, and the plus one
        teach: >
          For each transient $i$, with $k_i$ the expected number of steps to
          absorption, $k_i = 1 + \sum_{j \text{ transient}} p_{ij} k_j$ and
          $k_a = 0$ at absorbing states. In matrix form, with $Q$ the block of
          $P$ on the transient states, $k = (I - Q)^{-1}\mathbf{1}$. The entry
          $(i, j)$ of the fundamental matrix $(I - Q)^{-1}$ is the expected
          number of visits to $j$ before absorption, starting from $i$.
      - ask: >
          Which equation holds for QA?
        choices:
          - text: >
              $k_{\text{QA}} = \tfrac12 k_{\text{Staging}} + \tfrac12 k_{\text{Dev}}$
            feedback: >
              The day spent at QA is missing. Without it, the equations never
              count a single day.
          - text: >
              $k_{\text{QA}} = 1 + \tfrac12 k_{\text{Staging}} + \tfrac12 k_{\text{Dev}}$
            correct: true
            feedback: >
              One day for the move, then the expected remainder from wherever
              the release lands.
          - text: >
              $k_{\text{QA}} = 2 + \tfrac12 k_{\text{Staging}} + \tfrac12 k_{\text{Dev}}$
            feedback: >
              That charges the next stage's day as well, but $k_{\text{Staging}}$
              and $k_{\text{Dev}}$ already count their own days. Each step is
              paid once.
        feedback: >
          The third equation is $k_{\text{Dev}} = 1 + k_{\text{QA}}$.
      - ask: >
          Solve the system. What is $k_{\text{Dev}}$?
        expects: "10"
        hint: >
          Substitute $k_{\text{Staging}} = 1 + \tfrac12 k_{\text{Dev}}$ into the
          QA equation, then the QA equation into the Dev one.
        feedback: >
          $k_{\text{QA}} = 1 + \tfrac12(1 + \tfrac12 k_{\text{Dev}}) + \tfrac12 k_{\text{Dev}} = 1.5 + 0.75\,k_{\text{Dev}}$,
          so $k_{\text{Dev}} = 2.5 + 0.75\,k_{\text{Dev}}$ and
          $k_{\text{Dev}} = 10$ days.
      - ask: >
          What is $k_{\text{Staging}}$?
        expects: "6"
        feedback: >
          $1 + \tfrac12 \times 10 = 6$. Being one step from shipping still
          leaves $6$ days on average, because half the time you go back to
          the start.

      - part: Ten days, counted by visits
        ask: >
          Starting in Dev, what is the expected number of days the release
          spends in Staging before it ships?
        expects: "2"
        hint: >
          Each pass from Dev reaches Staging with probability $1/2$, and you
          found $4$ passes on average.
        feedback: >
          $4 \times \tfrac12 = 2$. Dev is visited $4$ times (once per pass)
          and QA $4$ times, so the visits total $4 + 4 + 2 = 10$ — exactly
          $k_{\text{Dev}}$. That is the fundamental matrix at work: expected
          time is the sum of expected visits to each transient state.
      - ask: >
          A candidate writes the three equations without the $1$s. What does
          their system give?
        choices:
          - text: >
              $10$ anyway: the constants only shift the answer slightly.
            feedback: >
              The constants are the only source of time in the equations.
              Remove them and nothing is counted.
          - text: >
              $k = 0$ in every state, since the system becomes homogeneous
              and its only solution is zero.
            correct: true
            feedback: >
              $(I - Q)k = 0$ with $I - Q$ invertible forces $k = 0$. A zero
              is the tell-tale sign of a dropped $+1$.
          - text: >
              $k = 1$ in every state, the absorption probability.
            feedback: >
              The absorption-probability system has $h = 1$ at the target as
              a boundary value. Here the absorbing state carries $0$, so no
              $1$ enters anywhere.
        feedback: >
          The $+1$ is "this step costs a day whatever happens". In an
          interview, justify it in those words; a $+1$ that appears by rote
          is the one interviewers probe.
      - ask: >
          Another candidate keeps the $1$s but includes Shipped in the sum
          with $k_{\text{Shipped}} = 1$, reasoning that shipping takes a day.
          What happens?
        choices:
          - text: >
              The answer comes out too large: the day of the final move is
              already the $1$ in Staging's equation.
            correct: true
            feedback: >
              The move into Shipped is the step Staging's $+1$ pays for. After
              absorption no more days pass, so $k_{\text{Shipped}} = 0$.
          - text: >
              The answer is unchanged, since Shipped is reached only once.
            feedback: >
              It is reached once, and that one extra day is counted every
              time the release passes through Staging's equation. The answer
              rises.
          - text: >
              The answer comes out too small, because shipping is now slower.
            feedback: >
              Adding a positive constant to the right-hand side can only push
              the expected times up.
        feedback: >
          Absorbing states contribute nothing to the sum. Same states and
          coefficients as the absorption-probability system — only the
          constant and the boundary values change.

  - node: quant-processes.markov-chains.mouse-maze
    hook: >
      This is absorption-time technique applied to a maze with a genuine
      dead end, and the dead end is exactly what should make you expect a
      larger answer than a naive average of the room count.
    explanation: >
      The setup habit that matters here is translating "the mouse picks
      uniformly among the doors of its current room" into the right
      transition probabilities per room — a room with two doors contributes
      $\tfrac12$ to each neighbor, one with three contributes $\tfrac13$
      each, and a dead end sends the mouse back the way it came with
      probability $1$, which still counts as a full step.

      Back-substitution is the efficient solving order once the equations
      are written: express the room closest to being fully determined (often
      the dead end, since it only depends on one other room) in terms of the
      others, then substitute inward until only one unknown survives.

      The dead end's cost is worth internalizing as a pattern, not just a
      number for this maze: every visit there is a wasted round trip, one
      step in and one step back with nothing gained, so a maze with a dead
      end always has a strictly larger expected escape time than the same
      maze with that dead end replaced by a direct path.
    worked: >
      Rooms $X,Y,Z,\text{Exit}$: three doors leave $X$ (to $Y$, $Z$, Exit,
      each $1/3$); two doors leave $Y$ (to $X$, Exit, each $1/2$); $Z$ is a
      dead end, single door back to $X$. Then $k_Y=1+\tfrac12k_X$,
      $k_Z=1+k_X$, and $k_X=1+\tfrac13k_Y+\tfrac13k_Z$. Substituting,
      $k_X=1+\tfrac13(1+\tfrac12k_X)+\tfrac13(1+k_X)=\tfrac53+\tfrac12k_X$,
      so $k_X=10/3\approx3.33$. Then $k_Y=1+\tfrac12(10/3)=8/3\approx2.67$
      and $k_Z=1+10/3=13/3\approx4.33$.
    interview: >
      "A mouse (or a random surfer, or a particle) wanders a maze with a
      dead end — expected time to exit?" wants the per-room transition
      probabilities read directly off the door count, then back-substitution
      starting from whichever room has the fewest unknowns feeding into it.
    pitfalls: >
      Giving the dead end the same door-count treatment as a normal room
      (splitting probability across multiple exits) rather than sending it
      back with probability $1$ misstates its entire contribution. Solving
      the system in an arbitrary order instead of starting from the room
      nearest to being fully expressed in one other unknown makes the algebra
      needlessly tangled.
    recap: >
      One first-step equation per room, with a dead end contributing
      $k=1+k_{\text{previous}}$ — here $10/3$, $8/3$, and $13/3$ steps from
      $X$, $Y$, $Z$ respectively.
    dialogue:
      - part: A maze with a long dead end
        teach: >
          A mouse starts in room $A$. Room $A$ has two doors, to $B$ and to $C$.
          Room $B$ has two doors, to $A$ and to the exit. Room $C$ has two
          doors, to $A$ and to $D$, and $D$ is a dead end whose single door
          leads back to $C$. Each minute the mouse walks through a uniformly
          chosen door of its current room.
      - ask: >
          What is the probability the mouse is out within $2$ minutes?
        expects: "1/4"
        feedback: >
          The only fast route is $A$, $B$, exit: $\tfrac12 \times \tfrac12 = \tfrac14$.
          Three times in four, the mouse is still inside.
      - ask: >
          Write $k_R$ for the expected minutes to the exit from room $R$.
          Which equation is right for the dead end $D$?
        choices:
          - text: >
              $k_D = k_C$, since the mouse simply returns to $C$.
            feedback: >
              Walking back to $C$ takes a minute. Every move costs one, even
              a forced one.
          - text: >
              $k_D = 1 + \tfrac12 k_C$, since rooms have two doors.
            feedback: >
              $D$ has one door. Read the probabilities off the door count of
              each room: one door means probability $1$.
          - text: >
              $k_D = 1 + k_C$
            correct: true
            feedback: >
              One minute, and then the mouse is in $C$ with no other option.
        feedback: >
          The other three are $k_A = 1 + \tfrac12 k_B + \tfrac12 k_C$,
          $k_B = 1 + \tfrac12 k_A$ (the exit contributes $0$) and
          $k_C = 1 + \tfrac12 k_A + \tfrac12 k_D$.
      - reflect: >
          Four unknowns. Where would you start substituting, and what single
          fact about the corridor $C$–$D$ do you expect to come out of it?
        hint: >
          The dead end depends on only one other room.
        answer: >
          Start at the dead end, the room with the fewest unknowns feeding it,
          and substitute inward: $k_D = 1 + k_C$ turns the $C$ equation into
          one relating $k_C$ to $k_A$ alone. What comes out is the price of
          the corridor: from $C$, every route out passes back through $A$,
          so $k_C = k_A + (\text{expected minutes to get from } C \text{ back to } A)$.

      - part: Solving from the dead end in
        ask: >
          Substitute $k_D = 1 + k_C$ into the equation for $C$. What is
          $k_C - k_A$, the expected time for a mouse in $C$ to get back to $A$?
        expects: "3"
        feedback: >
          $k_C = 1 + \tfrac12 k_A + \tfrac12(1 + k_C)$, so
          $\tfrac12 k_C = \tfrac32 + \tfrac12 k_A$ and $k_C = k_A + 3$. A trip
          into the corridor costs $3$ minutes on average before the mouse is
          back where it started.
      - ask: >
          Now substitute into the equation for $A$. What is $k_A$?
        expects: "12"
        hint: >
          Use $k_B = 1 + \tfrac12 k_A$ and $k_C = 3 + k_A$.
        feedback: >
          $k_A = 1 + \tfrac12(1 + \tfrac12 k_A) + \tfrac12(3 + k_A) = 3 + \tfrac34 k_A$,
          so $\tfrac14 k_A = 3$ and $k_A = 12$ minutes.
      - ask: >
          What is $k_B$, starting next to the exit?
        expects: "7"
        feedback: >
          $k_B = 1 + \tfrac12 \times 12 = 7$. Half the time the mouse walks
          away from the exit, and then it faces the full $12$ again. For the
          record, $k_C = 15$ and $k_D = 16$.

      - part: What the dead end costs
        ask: >
          Seal off $D$, so that $C$ has a single door back to $A$. What is
          $k_A$ now?
        expects: "8"
        hint: >
          Now $k_C = 1 + k_A$.
        feedback: >
          $k_A = 1 + \tfrac12(1 + \tfrac12 k_A) + \tfrac12(1 + k_A) = 2 + \tfrac34 k_A$,
          so $k_A = 8$ — the classic maze. Lengthening the dead end from one
          room to two raised the time to get from $C$ back to $A$ from $1$
          minute to $3$, and the answer from $8$ to $12$.
      - ask: >
          Unseal $D$ and give it a second door, to the outside: $D$ now has
          two doors, back to $C$ and out. What is $k_A$?
        expects: "6"
        hint: >
          Now $k_D = 1 + \tfrac12 k_C$. Solve the $C$ equation for $k_C$ in
          terms of $k_A$ first.
        feedback: >
          $k_C = 1 + \tfrac12 k_A + \tfrac12(1 + \tfrac12 k_C)$ gives
          $k_C = 2 + \tfrac23 k_A$. Then
          $k_A = 1 + \tfrac12(1 + \tfrac12 k_A) + \tfrac12(2 + \tfrac23 k_A) = \tfrac52 + \tfrac{7}{12} k_A$,
          so $k_A = 6$. The same corridor, with an exit at the far end,
          halves the answer.
      - ask: >
          A smarter mouse never walks back through the door it just came
          through, unless it is in a dead end. Can you keep the four rooms as
          the states and solve the same kind of system?
        choices:
          - text: >
              Yes, with smaller probabilities on the doors it avoids.
            feedback: >
              Which door it avoids depends on where it came from, and the room
              alone does not record that. The same room would need different
              rows on different visits.
          - text: >
              No: the next move depends on the previous room, so the state
              must be the pair (current room, room it came from).
            correct: true
            feedback: >
              Enlarge the state until the Markov property holds, then write
              one first-step equation per enlarged state. The method survives;
              the state space grows.
          - text: >
              No: first-step analysis needs every door to be equally likely.
            feedback: >
              Unequal probabilities are fine — they just become the
              coefficients. The problem is memory, not unevenness.
        feedback: >
          The room is a valid state only because the mouse forgets how it
          arrived. In an interview, read the door counts into probabilities,
          start from the dead end, and give the number with its reason: every
          entry into the two-room dead end costs $4$ minutes, one in and three
          on average to get back out.

  - node: quant-processes.markov-chains.drunkard-path
    hook: >
      Before reaching for the gambler's-ruin formulas, this is the check
      worth doing first: confirm the chain actually has the absorbing
      structure those formulas assume, because the same first-step system
      looks completely different on a chain that never gets absorbed.
    explanation: >
      Reading the two-barrier walk as a Markov chain rather than just a
      random-walk picture exposes its class structure directly: $\{0\}$ and
      $\{N\}$ are each closed classes of size one (absorbing), and
      $\{1,\dots,N-1\}$ is the one remaining class, which is not closed since
      every interior state has some chance of stepping to a barrier
      eventually.

      Certainty of absorption follows from a simple bound, not from solving
      anything: from any interior state, there's a path of length at most
      $N$ that walks straight to a barrier in one direction, and that
      specific path has some fixed positive probability ($p^{N}$ or $q^{N}$
      depending on direction). A positive lower bound on the escape
      probability within a bounded number of steps, repeated over and over,
      forces the probability of never being absorbed down to $0$.

      That's the entire contribution of this example: it identifies which
      chain-theory facts (finite absorbing structure, certain absorption)
      apply before any formula is written. The actual closed forms for the
      hitting probability and the expected duration are the gambler's-ruin
      recursions, solved elsewhere — reading this chain correctly is what
      tells you those formulas are the right tool to reach for.
    worked: >
      On $\{0,\dots,6\}$ with $p=q=0.5$, starting at the middle state $3$:
      the distance to the nearest barrier is $3$ steps. Three consecutive
      up-steps reach $6$ with probability $(0.5)^3=1/8$, and three
      consecutive down-steps reach $0$ with probability $1/8$ as well; these
      are disjoint events, so
      $\Pr(\text{absorbed within 3 steps}\mid X_0=3)\ge1/8+1/8=1/4$. That's
      already a concrete, nonzero floor on absorption within a short, fixed
      horizon — the full certainty argument just repeats this at every later
      opportunity.
    interview: >
      "Model this as a Markov chain" after a random-walk-with-boundaries
      setup wants the class structure named first — two absorbing
      singletons, one transient interior class — before any ruin formula
      gets quoted; naming the structure is what shows you understand why
      absorption is certain, not just that it is.
    pitfalls: >
      Quoting the gambler's-ruin closed forms without first checking that
      both boundaries are actually absorbing (rather than, say, reflecting)
      applies the wrong formula to a chain that isn't the one those formulas
      describe. Treating "the walk is recurrent" and "absorption is certain"
      as needing separate proofs misses that here they're the same fact.
    recap: >
      The two-barrier walk is one transient class between two absorbing
      singletons, with certain absorption guaranteed by a positive-probability
      straight-line path to a barrier — the ruin formulas belong to a
      different unit.
    dialogue:
      - part: A walker on a pier
        teach: >
          A walker stands on a pier marked at positions $0, 1, \dots, 5$.
          Position $0$ is the shore and position $5$ is the end of the pier,
          where the walker falls in; both end the walk. From any position in
          between the walker steps toward the water with probability $0.4$ and
          toward the shore with probability $0.6$. The walker starts at $2$.
      - ask: >
          How many communicating classes does this chain have?
        expects: "3"
        hint: >
          Which states can each reach the other?
        feedback: >
          $\{0\}$ and $\{5\}$ are absorbing, closed classes of size one. The
          interior $\{1, 2, 3, 4\}$ communicates internally but leaks at both
          ends, so it is a single class that is not closed.
      - ask: >
          What is the probability the walk has ended within $2$ steps?
        expects: "0.36"
        feedback: >
          The water is $3$ steps away, so only the shore can be reached in
          time, by stepping toward it twice: $0.6^{2} = 0.36$.
      - reflect: >
          Could the walker shuffle among positions $1$ to $4$ forever? Give an
          argument that needs no equations.
        hint: >
          From any interior position, how many steps does a straight march to
          the shore take, at most?
        answer: >
          No. From any interior position the walker can march straight to the
          shore in at most $4$ steps, with probability at least
          $0.6^{4} = 0.1296$. So every block of $4$ steps ends the walk with
          probability at least $0.1296$, whatever happened before, and the
          chance of surviving $k$ blocks is at most $(1 - 0.1296)^{k} \to 0$.
          A positive floor on escape, repeated, makes escape certain.

      - part: The structure before the formula
        teach: >
          That is the whole structure of the two-barrier walk: two absorbing
          classes, one transient class between them, and absorption with
          probability $1$, because a straight run to a barrier has positive
          probability from everywhere. The first-step equations for the
          chance of hitting one end, and for the expected duration, are then
          the gambler's ruin recursions.
      - ask: >
          Using that floor, what upper bound do you get on the probability the
          walker is still on the pier after $40$ steps?
        expects: "0.25"
        tolerance: 0.005
        hint: >
          $40$ steps are $10$ blocks of $4$.
        feedback: >
          $(1 - 0.1296)^{10} = 0.8704^{10} \approx 0.25$. A crude bound, but it
          goes to $0$, and that is all certainty of absorption needs.
      - ask: >
          With $h_i$ the probability of ending in the water from position $i$,
          which system is right?
        choices:
          - text: >
              $h_i = 0.6\,h_{i+1} + 0.4\,h_{i-1}$, with $h_0 = 0$, $h_5 = 1$
            feedback: >
              The coefficients are swapped. Stepping to $i + 1$ is the move
              toward the water, which has probability $0.4$.
          - text: >
              $h_i = 0.4\,h_{i+1} + 0.6\,h_{i-1}$, with $h_0 = 0$, $h_5 = 1$
            correct: true
            feedback: >
              One equation per interior position, and the boundary values at
              the two absorbing states. These are the gambler's ruin
              equations exactly.
          - text: >
              $h_i = 1 + 0.4\,h_{i+1} + 0.6\,h_{i-1}$, with $h_0 = h_5 = 0$
            feedback: >
              That is the expected-duration system. Probabilities carry no
              $+1$; their boundary values are $1$ at the target and $0$ at the
              other end.
        feedback: >
          Same coefficients, different constants and boundaries: the duration
          system adds $1$ to each equation and puts $0$ at both ends.
      - ask: >
          Shorten the pier to positions $0$ to $3$, same probabilities, and
          start at $1$. What is the probability of ending in the water?
        expects: "4/19"
        hint: >
          $h_1 = 0.4\,h_2$ and $h_2 = 0.4 + 0.6\,h_1$.
        feedback: >
          $h_1 = 0.4(0.4 + 0.6\,h_1) = 0.16 + 0.24\,h_1$, so
          $h_1 = 0.16/0.76 = 4/19 \approx 0.21$. Two unknowns by hand; the
          general closed form belongs to the gambler's ruin.
      - ask: >
          On the same short pier, starting at $1$, what is the expected number
          of steps until the walk ends?
        expects: "35/19"
        tolerance: 0.005
        hint: >
          $k_1 = 1 + 0.4\,k_2$ and $k_2 = 1 + 0.6\,k_1$, with $k = 0$ at both
          ends.
        feedback: >
          $k_1 = 1 + 0.4(1 + 0.6\,k_1) = 1.4 + 0.24\,k_1$, so
          $k_1 = 1.4/0.76 = 35/19 \approx 1.84$ steps. The same two
          coefficients as the $h$ system, a $+1$ in each equation, and $0$ at
          both barriers.

      - part: When one barrier is a railing
        ask: >
          A railing goes up at the end of the pier: from position $5$ the
          walker is turned back to $4$. What changes?
        choices:
          - text: >
              Nothing structural: the ruin formula for hitting $5$ still
              applies.
            feedback: >
              The formula assumes $5$ is absorbing. With a railing, $5$ is
              just another transient state, and "ending at $5$" never
              happens.
          - text: >
              The walker now wanders forever, since only one end is
              absorbing.
            feedback: >
              The shore is still absorbing and still reachable from every
              position, so the same floor argument applies: absorption is
              still certain.
          - text: >
              The shore is now the only absorbing state, $\{1, \dots, 5\}$ is
              one transient class, and the walk ends on the shore with
              probability $1$.
            correct: true
            feedback: >
              Classes first, formulas second. With the railing, "which end?"
              has the trivial answer, and only the duration is a real
              question.
        feedback: >
          Before quoting the ruin formulas in an interview, name the classes
          out loud — two absorbing singletons and one transient interior —
          and check both ends really are absorbing. That is what this example
          contributes: the structure that tells you which formula applies.

  - node: quant-processes.markov-chains.stationary
    hook: >
      "What fraction of the time is the chain in state $j$, eventually?" is
      answered by solving $\pi P=\pi$ — a linear system, not a limit
      computed by brute-force iteration.
    explanation: >
      A stationary distribution is a probability vector left unchanged by
      one step of the chain: $\pi P=\pi$, equivalently
      $\pi_j=\sum_i\pi_ip_{ij}$ for every $j$. Starting the chain from $\pi$
      makes every $X_n$ have the exact same law $\pi$ — stationarity is a
      property of the whole trajectory's law, not just a fixed point of one
      equation.

      Because $\pi P=\pi$ says $\pi$ is a left eigenvector of $P$ for
      eigenvalue $1$, and every stochastic matrix has $1$ as an eigenvalue,
      existence of some solution is automatic in the finite case; what needs
      care is normalization and uniqueness. In practice the $m$ balance
      equations are always linearly dependent (they sum to a trivial
      identity), so solve any $m-1$ of them together with $\sum_i\pi_i=1$
      for the remaining constraint.

      For a chain that's both irreducible and aperiodic, $\pi$ is more than
      just an algebraic fixed point — it's the actual limiting law,
      $(P^n)_{ij}\to\pi_j$ regardless of where the chain started. Without
      those two hypotheses $\pi$ can fail to exist at all, or fail to be
      unique.
    worked: >
      A machine is Up or Down. From Up it stays Up with probability $0.7$
      and drops to Down with probability $0.3$; from Down it recovers to Up
      with probability $0.4$ and stays Down with probability $0.6$. Balance
      gives $\pi_U\cdot0.3=\pi_D\cdot0.4$, so $\pi_U=\tfrac43\pi_D$; with
      $\pi_U+\pi_D=1$, $\tfrac73\pi_D=1$, so $\pi_D=3/7$ and
      $\pi_U=4/7\approx0.571$.
    interview: >
      "In the long run, what fraction of the time is the chain in state $X$?"
      is solved by writing the balance equations and the normalization
      together, then solving the linear system directly — not by iterating
      $P^n$ for a large $n$ and reading off an approximate answer.
    pitfalls: >
      Using all $m$ balance equations plus normalization over-determines the
      system, since the balance equations are always linearly dependent —
      drop exactly one before adding normalization. Solving for $\pi$ on a
      chain that isn't irreducible without checking uniqueness first can
      produce a technically-correct stationary vector that isn't the one the
      problem actually wants.
    recap: >
      $\pi P=\pi$ defines the law the chain leaves unchanged; solve $m-1$
      balance equations plus normalization, and for an irreducible aperiodic
      chain that same $\pi$ is also the limit from any start.
    dialogue:
      - part: A thousand bikes overnight
        teach: >
          A bike-share scheme has $1000$ bikes and three docks: City, Park and
          Uni. Each night every bike moves independently. A bike at City stays
          with probability $0.6$ and goes to Park or Uni with $0.2$ each. A
          bike at Park stays with $0.6$ and goes to City with $0.4$. A bike at
          Uni stays with $0.6$ and goes to City with $0.4$.
      - ask: >
          Tonight there are $500$ bikes at City, $250$ at Park and $250$ at
          Uni. How many do you expect at City tomorrow morning?
        expects: "500"
        feedback: >
          $0.6 \times 500 + 0.4 \times 250 + 0.4 \times 250 = 300 + 100 + 100 = 500$.
      - ask: >
          And at Park?
        expects: "250"
        feedback: >
          $0.2 \times 500 + 0.6 \times 250 = 100 + 150 = 250$. By symmetry Uni
          keeps its $250$ too. Bikes moved all night, and the split did not
          change.
      - ask: >
          Now start with all $1000$ bikes at City. How many do you expect at
          City after two nights?
        expects: "520"
        hint: >
          After one night the split is $600$, $200$, $200$.
        feedback: >
          $0.6 \times 600 + 0.4 \times 200 + 0.4 \times 200 = 360 + 80 + 80 = 520$.
          From $1000$ to $600$ to $520$: the split is moving, and it seems to
          be heading for $500$.
      - reflect: >
          The split $500, 250, 250$ reproduced itself. Write what you checked
          as equations in the fractions $\pi_{\text{City}}, \pi_{\text{Park}}, \pi_{\text{Uni}}$,
          and say what else those fractions must satisfy.
        answer: >
          For every dock $j$, the inflow matched the stock:
          $\pi_j = \sum_i \pi_i p_{ij}$, which is the row-vector equation
          $\pi P = \pi$. And the fractions are a probability vector: none
          negative, summing to $1$. Here $\pi = (1/2, 1/4, 1/4)$ — and the
          same equations describe one bike's chance of being at each dock,
          not only the fleet's split.

      - part: The law one step leaves alone
        teach: >
          A probability vector $\pi$ is stationary for $P$ if $\pi P = \pi$:
          $\pi_j = \sum_i \pi_i p_{ij}$ for every $j$. Start the chain from $\pi$
          and every $X_n$ has law $\pi$. Equivalently, $\pi$ is a left
          eigenvector of $P$ for eigenvalue $1$, scaled to sum to $1$. For a
          chain in which every state reaches every other and the timing does
          not cycle, $\pi$ is also the limit of $\mu_0 P^{n}$ from any start.
      - ask: >
          The zero vector satisfies $0 \cdot P = 0$. Is it a stationary
          distribution?
        choices:
          - text: >
              Yes: it satisfies the balance equations, which is the
              definition.
            feedback: >
              The balance equations are half the definition. A stationary
              distribution is a probability vector, and the zero vector puts
              total mass $0$ on the states.
          - text: >
              No: its entries sum to $0$, not $1$.
            correct: true
            feedback: >
              It fails exactly one clause. Every multiple $c\pi$ satisfies
              $\pi P = \pi$ too; normalising is what picks out the one that is
              a distribution.
          - text: >
              No: a stationary vector needs a positive entry on every state.
            feedback: >
              Zero entries are allowed: if state $1$ never leaves itself,
              $(1, 0, 0)$ is stationary. The clause the zero vector fails is
              the sum.
        feedback: >
          Balance equations fix $\pi$ only up to scale. Normalisation fixes
          the scale.
      - ask: >
          You write all three balance equations for the bikes and nothing else.
          What can you determine?
        choices:
          - text: >
              $\pi$ itself: three equations, three unknowns.
            feedback: >
              The three equations are dependent — add them and both sides
              become $\sum_j \pi_j$, an identity. They leave a whole line of
              solutions $c(2, 1, 1)$.
          - text: >
              Only the ratios $\pi_{\text{City}} : \pi_{\text{Park}} : \pi_{\text{Uni}} = 2 : 1 : 1$.
            correct: true
            feedback: >
              Balance gives shape, not size. Drop one balance equation, add
              $\sum_i \pi_i = 1$, and the answer is $(1/2, 1/4, 1/4)$.
          - text: >
              Nothing: you need the limit of $P^{n}$ first.
            feedback: >
              No limit is needed. $\pi$ is defined by a linear system, and
              solving it is the fast route.
        feedback: >
          The recipe: $m - 1$ balance equations plus normalisation.
      - ask: >
          A different chain on states $1, 2, 3$ has rows $(0.5, 0.5, 0)$,
          $(0, 0.5, 0.5)$ and $(0.5, 0, 0.5)$. What is $\pi_2$?
        expects: "1/3"
        hint: >
          Try the uniform vector and check one balance equation.
        feedback: >
          Balance at $2$: $\pi_2 = 0.5\,\pi_1 + 0.5\,\pi_2$, so $\pi_1 = \pi_2$;
          by the same step at $3$, $\pi_2 = \pi_3$. With the sum equal to $1$,
          each is $1/3$. Here every column also sums to $1$, which is exactly
          when the uniform vector is stationary.

      - part: When one answer becomes many
        ask: >
          A two-state chain never moves: rows $(1, 0)$ and $(0, 1)$. Which
          probability vectors are stationary?
        choices:
          - text: >
              None: the chain never mixes, so it has no equilibrium.
            feedback: >
              $\pi P = \pi$ holds trivially when $P = I$. Not mixing is the
              opposite of having no equilibrium — everything is an
              equilibrium.
          - text: >
              Only $(1/2, 1/2)$, by symmetry.
            feedback: >
              Check $(0.3, 0.7)$: $P$ is the identity, so it is returned
              unchanged. Symmetry of the chain does not force symmetry of
              $\pi$.
          - text: >
              Every probability vector $(t, 1 - t)$.
            correct: true
            feedback: >
              $P = I$ fixes every vector. Stationary distributions exist here
              but are not unique, because neither state can ever reach the
              other.
        feedback: >
          A stationary $\pi$ can fail to be unique, and on infinite chains it
          can fail to exist. When the question is "what fraction of the time,
          in the long run?", say $\pi P = \pi$ plus normalisation, solve the
          linear system, and only then worry about whether the answer is
          unique.

  - node: quant-processes.markov-chains.stationary-uniqueness
    hook: >
      "Does this chain have a unique equilibrium?" splits into two separate
      yes/no checks — irreducibility for uniqueness, positive recurrence for
      existence — and interviewers expect both named, not just a single
      hand-wave at "well-behaved."
    explanation: >
      Irreducibility is what buys uniqueness. With more than one
      communicating class, each closed class can support its own stationary
      distribution concentrated entirely on that class, and any convex
      combination of those is stationary too — there's no single privileged
      $\pi$ to point to. Irreducibility rules this out by leaving only one
      class for probability mass to settle on.

      Positive recurrence is what buys existence, and on a finite chain it's
      automatic: with finitely many states, the chain can't spread its
      expected return time out to infinity the way an infinite chain can, so
      every finite irreducible chain is positive recurrent for free. On an
      infinite state space that guarantee disappears — a chain can be
      irreducible and recurrent (certain to return) while still being null
      recurrent, with a mean return time of infinity, in which case no
      stationary probability vector exists at all.

      Notice what's absent from the hypotheses: aperiodicity. A period-$2$
      chain still has exactly one stationary $\pi$ under irreducibility and
      positive recurrence; periodicity only affects whether $P^n$ actually
      converges to it, a separate question.
    worked: >
      A three-state chain has $A$ and $B$ absorbing and $C$ transient,
      moving to $A$ or $B$ with probability $0.5$ each. Check
      $\pi=(0.3,0.7,0)$: $(\pi P)_A=\pi_A\cdot1+\pi_C\cdot0.5=0.3+0=0.3=\pi_A$,
      and similarly $(\pi P)_B=0.7=\pi_B$, $(\pi P)_C=0$. So
      $\pi=(0.3,0.7,0)$ is stationary — and so is $(1,0,0)$, $(0,1,0)$, and
      every convex combination between them, since this chain has two closed
      classes and is not irreducible.
    interview: >
      "Show the stationary distribution is unique" or "why might it not be"
      wants irreducibility and positive recurrence named as the two separate
      conditions, with a one-line counterexample ready for each — two
      absorbing states for non-uniqueness, an infinite null-recurrent walk
      for non-existence.
    pitfalls: >
      Assuming irreducibility alone forces existence overlooks null
      recurrence, which only threatens infinite chains — every finite
      irreducible chain is safe automatically. Treating aperiodicity as part
      of this theorem's hypotheses confuses uniqueness of $\pi$ with
      convergence of $P^n$ to it, a genuinely separate statement.
    recap: >
      Irreducible plus positive recurrent gives exactly one stationary
      $\pi$; drop irreducibility and uniqueness fails, drop positive
      recurrence and existence fails, and aperiodicity plays no role in this
      particular guarantee.
    dialogue:
      - part: One inventory, one equilibrium
        teach: >
          A market maker's inventory is Short, Flat or Long, checked each
          minute. From Short it stays Short or goes Flat with probability
          $1/2$ each. From Flat it stays Flat with $1/2$ and goes Short or Long
          with $1/4$ each. From Long it stays Long or goes Flat with $1/2$
          each.
      - ask: >
          Solve $\pi P = \pi$. What is $\pi_{\text{Flat}}$?
        expects: "1/2"
        hint: >
          Balance at Short: $\pi_S = \tfrac12 \pi_S + \tfrac14 \pi_F$. Symmetry
          gives $\pi_L = \pi_S$.
        feedback: >
          $\tfrac12 \pi_S = \tfrac14 \pi_F$, so $\pi_F = 2\pi_S$, and with
          $\pi_L = \pi_S$ the normalisation $4\pi_S = 1$ gives
          $\pi = (1/4, 1/2, 1/4)$.
      - ask: >
          How many stationary distributions does this chain have?
        expects: "1"
        feedback: >
          The balance equations force $\pi_F = 2\pi_S$ and $\pi_L = \pi_S$,
          leaving one free scale, and normalisation fixes it. Exactly one.
      - ask: >
          A separate question: starting Flat, what is the expected number of
          minutes until the inventory is next Flat?
        expects: "2"
        hint: >
          With probability $1/2$ it is Flat again after one minute. Otherwise
          it sits at Short or Long, leaving with probability $1/2$ each
          minute.
        feedback: >
          $m_F = \tfrac12 \times 1 + \tfrac12 \times (1 + 2) = 2$: one minute
          to leave, then a geometric wait with mean $2$ to come back.
      - reflect: >
          $\pi_{\text{Flat}} = 1/2$ and the mean return time to Flat is $2$.
          Why should these be reciprocals — and what does that suggest about
          why there was only one possible $\pi$?
        hint: >
          Think of $\pi_{\text{Flat}}$ as a fraction of time.
        answer: >
          If the chain returns to Flat every $2$ minutes on average, it spends
          about half its time there, so $\pi_F = 1/m_F$. The return times
          $m_i$ are facts about the chain, not choices, so a $\pi$ built from
          them has nothing left to choose. That needs every state to be
          revisited whatever the start — one class — and every $m_i$ to be
          finite.

      - part: The theorem and its two hypotheses
        teach: >
          If a chain is irreducible and positive recurrent, it has exactly one
          stationary distribution, and $\pi_i = 1/m_i$ with $m_i$ the mean
          return time to $i$. Positive recurrence is automatic for a finite
          irreducible chain. Irreducibility buys uniqueness; positive
          recurrence buys existence; aperiodicity is not needed.
      - ask: >
          What is the mean return time to Short?
        expects: "4"
        feedback: >
          $m_S = 1/\pi_S = 1/(1/4) = 4$ minutes — no linear system needed
          once $\pi$ is known.
      - ask: >
          Which change to the inventory chain leaves it with more than one
          stationary distribution?
        choices:
          - text: >
              From Flat, with probability $0.1$ the desk is shut down for good
              (a new absorbing state Halted).
            feedback: >
              The chain is no longer irreducible, but it has only one closed
              class, $\{\text{Halted}\}$, and every stationary distribution
              puts all its mass there. Still unique.
          - text: >
              Two desks each run this chain and never trade with each other,
              making one chain on six states.
            correct: true
            feedback: >
              Two closed classes, each with its own equilibrium, and any
              mixture $t\pi^{(1)} + (1-t)\pi^{(2)}$ is stationary too.
              Infinitely many.
          - text: >
              Flat stays Flat with probability $0.9$ instead of $1/2$.
            feedback: >
              The chain is still irreducible and finite, so $\pi$ is still
              unique — it just leans harder on Flat.
        feedback: >
          Uniqueness fails when probability can settle in two places that
          never talk to each other. Irreducibility rules that out.

      - part: Existence, and what is not needed
        ask: >
          The simple symmetric walk on the integers is irreducible and returns
          to its start with probability $1$, but its mean return time is
          infinite. What does $\pi_i = 1/m_i$ say about it?
        choices:
          - text: >
              $\pi_i = 0$ for every $i$, which sums to $0$: no stationary
              distribution exists.
            correct: true
            feedback: >
              Null recurrence leaves no mass anywhere. The uniform measure is
              invariant but cannot be normalised over infinitely many
              integers.
          - text: >
              $\pi$ is uniform on the integers.
            feedback: >
              A uniform assignment $c$ to infinitely many states sums to $0$
              or to infinity. No probability vector is uniform on the
              integers.
          - text: >
              $\pi$ is concentrated at the start, since the walk returns there
              for sure.
            feedback: >
              The walk returns for sure but leaves again, and the walk is
              symmetric under shifts — no state can be special.
        feedback: >
          Recurrence alone is not enough for existence; the mean return time
          must be finite. On finitely many states it always is.
      - ask: >
          Remove every self-loop: Short always goes Flat, Flat goes Short or
          Long with $1/2$ each, Long always goes Flat. The chain now returns
          to Flat only at even times. What is $\pi_{\text{Flat}}$?
        expects: "1/2"
        hint: >
          Balance at Flat: $\pi_F = \pi_S + \pi_L$.
        feedback: >
          $\pi_F = \pi_S + \pi_L$ and $\pi_S = \tfrac12 \pi_F$, so
          $\pi = (1/4, 1/2, 1/4)$ again — unique, although $P^{n}$ now
          oscillates and never converges. Asked "is the equilibrium unique?",
          name two checks, irreducible for uniqueness and positive recurrent
          for existence, with a counterexample ready for each.

  - node: quant-processes.markov-chains.convergence-to-equilibrium
    hook: >
      "Does $P^n$ actually converge?" needs a yes/no distinct from "does a
      stationary $\pi$ exist" — the two questions have different hypotheses,
      and conflating them is the fastest way to mishandle a periodic chain.
    explanation: >
      Irreducibility alone isn't enough for $P^n$ to converge to a single
      limit, because a periodic chain keeps cycling through a fixed rotation
      of states rather than settling: a period-$d$ chain splits into $d$
      cyclic subclasses, and $P^n$ visits a different one of $d$ distinct
      patterns depending on $n\bmod d$, forever. Aperiodicity is precisely
      the condition that collapses that rotation to a single steady pattern.

      The two hypotheses fail independently. Drop irreducibility: a chain
      with two absorbing states still has $(P^n)_{ij}$ converge for each
      fixed $i$, but the limit depends on where you started, so there's no
      single $\pi$ that every row converges to. Drop aperiodicity: the
      two-state swap chain, rows $(0,1)$ and $(1,0)$, is irreducible with a
      perfectly good $\pi=(1/2,1/2)$, yet $P^n$ alternates forever between
      the identity matrix and the swap matrix and never settles anywhere.

      Once both hypotheses hold, the statement is genuinely strong: every
      row of $P^n$ converges to the same $\pi$, meaning the chain's current
      distribution eventually stops depending on where it started at all —
      $\mu_0P^n\to\pi$ for every initial law $\mu_0$, not just for
      point-mass starts.
    worked: >
      Using the Up/Down machine chain ($0.7$/$0.3$ from Up, $0.4$/$0.6$ from
      Down, with $\pi=(4/7,3/7)\approx(0.571,0.429)$), start at $\mu_0=(1,0)$
      and iterate: $\mu_1=(0.7,0.3)$, $\mu_2=(0.61,0.39)$,
      $\mu_3=(0.583,0.417)$ — each step visibly closing the gap to $\pi$,
      from $0.429$ away at $n=0$ down to about $0.012$ away at $n=3$, exactly
      the geometric approach irreducibility and aperiodicity guarantee here.
    interview: >
      "Does this chain converge to equilibrium, and why?" wants both
      conditions checked explicitly — irreducible (one class, no absorbing
      states, no isolated regions) and aperiodic (no bipartite or otherwise
      cyclic structure) — with a specific counterexample ready to explain
      what breaks if either is dropped.
    pitfalls: >
      Verifying irreducibility and stopping, without separately checking for
      period $2$, is the single most common gap. Concluding non-convergence
      means "no stationary distribution exists" conflates this theorem with
      the separate existence-and-uniqueness statement; a period-$2$ chain
      still has a perfectly good $\pi$, it just never converges to it.
    recap: >
      Irreducible and aperiodic together force $(P^n)_{ij}\to\pi_j$ from any
      start; drop either one and the chain either converges to the wrong
      thing or never converges at all, even though $\pi$ can still exist.
    dialogue:
      - part: A pager that never forgets
        teach: >
          Three engineers, $A$, $B$ and $C$, share an on-call pager. Each week
          it passes along the rota $A \to B \to C \to A$, with no exceptions.
          $A$ holds it in week $0$.
      - ask: >
          What is the probability that $A$ holds the pager in week $30$?
        expects: "1"
        feedback: >
          $30$ is a multiple of $3$, so the rota has gone round exactly ten
          times. Certainty.
      - ask: >
          And in week $31$?
        expects: "0"
        feedback: >
          Week $31$ is one step past a full cycle, so $B$ has it. The
          probability that $A$ holds the pager runs $1, 0, 0, 1, 0, 0, \dots$
          forever.
      - ask: >
          The chain is finite and irreducible. What do you conclude?
        choices:
          - text: >
              It has no stationary distribution, since $P^{n}$ does not
              converge.
            feedback: >
              It has one: $(1/3, 1/3, 1/3)$, unique because the chain is finite
              and irreducible. Existence and convergence are different
              questions.
          - text: >
              It has the unique stationary distribution $(1/3, 1/3, 1/3)$,
              and $P^{n}$ still never converges to it.
            correct: true
            feedback: >
              Started from $\pi$ it stays at $\pi$; started from a single
              engineer it cycles forever. The rhythm of period $3$ blocks the
              limit.
          - text: >
              $P^{n}$ converges, just slowly.
            feedback: >
              The sequence $1, 0, 0, 1, 0, 0$ has no limit at all. Nothing is
              slow about it; it is exactly periodic.
        feedback: >
          A unique $\pi$ does not mean the chain approaches it.
      - reflect: >
          What is the smallest change to the rota that would make "who holds
          the pager in week $1000$?" independent of who held it in week $0$,
          and why would it work?
        hint: >
          What made the week number modulo $3$ decide everything?
        answer: >
          Break the rhythm: let the holder keep the pager for another week
          with some probability, say $1/2$. A self-loop makes the chain
          aperiodic, so returns can happen at any length of time and the
          position stops being locked to the week number modulo $3$. Then
          the start is gradually forgotten and every row of $P^{n}$ should
          approach $(1/3, 1/3, 1/3)$.

      - part: Irreducible, aperiodic, and forgetful
        teach: >
          If a chain is irreducible, aperiodic and positive recurrent, then
          $(P^{n})_{ij} \to \pi_j$ for every $i$ and $j$, so $\mu_0 P^{n} \to \pi$
          for every starting law: the chain forgets where it started. On a
          finite chain the approach is geometric, at the rate $|\lambda_2|$
          of the second-largest eigenvalue modulus.
      - ask: >
          In the relaxed rota, the holder keeps the pager with probability
          $1/2$ and otherwise passes it on. Starting from $A$, the law after
          two weeks is $(1/4, 1/2, 1/4)$. What is the probability that $B$
          holds the pager in week $3$?
        expects: "3/8"
        hint: >
          $B$ in week $3$: either $A$ passed it on, or $B$ kept it.
        feedback: >
          $\tfrac14 \times \tfrac12 + \tfrac12 \times \tfrac12 = \tfrac18 + \tfrac14 = \tfrac38$.
          The week-$3$ law is $(1/4, 3/8, 3/8)$, already near $1/3$ each.
      - ask: >
          Starting instead from $C$, what does the probability that $A$ holds
          the pager in week $n$ tend to?
        expects: "1/3"
        feedback: >
          The relaxed rota is irreducible, aperiodic and finite, so every row
          of $P^{n}$ tends to $\pi = (1/3, 1/3, 1/3)$, whatever the start.
      - ask: >
          From $A$, the largest gap to $1/3$ is $1/12$ in week $3$, and the
          week-$4$ law is $(5/16, 5/16, 3/8)$. By what factor did the largest
          gap shrink?
        expects: "0.5"
        feedback: >
          The week-$4$ gaps are $1/48$, $1/48$ and $1/24$, and
          $(1/24)/(1/12) = 1/2$. The non-unit eigenvalues of the relaxed rota
          are $\tfrac12 + \tfrac12\omega$ for the complex cube roots $\omega$
          of $1$, with modulus $1/2$ — the rate the theorem promises.

      - part: Two hypotheses, two failures
        ask: >
          A chain has two absorbing states, $L$ and $R$, and a middle state
          that moves to each with probability $1/2$. Does $P^{n}$ converge?
        choices:
          - text: >
              No: without irreducibility there is no convergence.
            feedback: >
              Each row does converge: from $L$ to $(1, 0, 0)$, from $R$ to
              $(0, 0, 1)$, from the middle to $(1/2, 0, 1/2)$. What fails is
              agreement between rows.
          - text: >
              Yes, row by row, but to different limits for different starts.
            correct: true
            feedback: >
              Dropping irreducibility keeps convergence and loses forgetting:
              the limit remembers where the chain began.
          - text: >
              Yes, every row to the same limit, since the middle state empties
              out.
            feedback: >
              A chain started at $L$ stays at $L$ and one started at $R$ stays
              at $R$. The rows cannot share a limit.
        feedback: >
          Irreducibility is what makes the limit the same from every start;
          aperiodicity is what makes there be a limit at all.
      - ask: >
          A colleague checks that a finite chain is irreducible and declares
          that $P^{n}$ converges to $\pi$. What should you ask?
        choices:
          - text: >
              Whether $\pi$ exists.
            feedback: >
              For a finite irreducible chain, $\pi$ exists and is unique
              automatically. That is not where the gap is.
          - text: >
              Whether the eigenvalues are real.
            feedback: >
              The relaxed rota has complex eigenvalues and converges anyway.
              What matters is whether some eigenvalue other than $1$ has
              modulus $1$.
          - text: >
              Whether the chain is aperiodic — a self-loop, or return lengths
              with greatest common divisor $1$.
            correct: true
            feedback: >
              Irreducible without aperiodic is the strict rota. That missing
              check is the most common gap in "does it converge?" answers.
        feedback: >
          In an interview, check both conditions out loud — one class, no
          rhythm — and keep a counterexample for each: two absorbing states,
          and a chain that swaps or rotates deterministically.

  - node: quant-processes.markov-chains.weather-chain
    hook: >
      This is the two-state stationary computation done so often it's worth
      having the shortcut $\pi=(b/(a+b),a/(a+b))$ memorized, not just the
      method to rederive it.
    explanation: >
      For a two-state chain with rows $(1-a,a)$ and $(b,1-b)$, the balance
      equation reduces to one line: $\pi_1(1-a)+\pi_2b=\pi_1$ rearranges to
      $\pi_1a=\pi_2b$, so $\pi_1/\pi_2=b/a$ — the ratio of the two "leaving"
      probabilities, inverted. Normalizing gives the closed form
      $\pi=(b/(a+b),\,a/(a+b))$ directly, without ever writing a matrix.

      The mental model behind that ratio: a state with a small leaving
      probability ($a$ small, meaning a large self-loop $1-a$) is "sticky"
      and the chain lingers there, so it should get more stationary weight —
      and indeed $\pi_1$ grows as $a$ shrinks, matching intuition.

      Once $\pi$ is known, the two-state chain hands over its eigenvalues
      almost for free: they're always $1$ and $1-a-b$, so the same numbers
      that built $\pi$ also tell you how fast deviations from $\pi$ decay
      each step, and $1/\pi_i$ reads off the average number of steps between
      visits to state $i$.
    worked: >
      A machine is Up or Down. From Up it fails with probability $0.05$ (so
      $a=0.05$) and otherwise stays Up; from Down it's repaired with
      probability $0.6$ (so $b=0.6$) and otherwise stays Down. Then
      $\pi_{\text{Up}}=0.6/0.65=12/13\approx0.923$ and
      $\pi_{\text{Down}}=0.05/0.65=1/13\approx0.077$. The eigenvalues are $1$
      and $1-0.05-0.6=0.35$, and the machine is Down on average once every
      $13$ checks.
    interview: >
      A two-state chain with named transition probabilities is meant to be
      solved by the ratio shortcut in one line, not by writing out $\pi P=\pi$
      from scratch every time — the interviewer is checking whether the
      two-state case is automatic before moving on to anything with more
      states.
    pitfalls: >
      Mixing up which probability is $a$ and which is $b$ flips the ratio and
      swaps the answer for the two states — always double-check
      $\pi_1=b/(a+b)$ pairs the larger stationary weight with the smaller
      leaving probability. Quoting the eigenvalue $1-a-b$ as though it were
      always positive misses that a chain that swaps almost every step has
      $a,b$ close to $1$, making this eigenvalue negative and the approach
      oscillate.
    recap: >
      For rows $(1-a,a)$ and $(b,1-b)$, $\pi=(b/(a+b),a/(a+b))$ in one line —
      here $(12/13,1/13)$ — with eigenvalues $1$ and $1-a-b$ setting both the
      ratio and the mixing speed.
    dialogue:
      - part: Sun and rain, two days out
        teach: >
          In a coastal town a sunny day is followed by another sunny day with
          probability $0.8$ and by rain with $0.2$. A rainy day is followed by
          rain with probability $0.4$ and by sun with $0.6$. Today it is
          raining.
      - ask: >
          What is the probability that the day after tomorrow is sunny?
        expects: "0.72"
        hint: >
          Split on tomorrow's weather.
        feedback: >
          Sun tomorrow then sun: $0.6 \times 0.8 = 0.48$. Rain tomorrow then
          sun: $0.4 \times 0.6 = 0.24$. Total $0.72$.
      - ask: >
          In the long run, what fraction of days are sunny?
        expects: "3/4"
        hint: >
          Write the balance equation for sunny days: $\pi_S = 0.8\,\pi_S + 0.6\,\pi_R$.
        feedback: >
          $0.2\,\pi_S = 0.6\,\pi_R$, so $\pi_S = 3\pi_R$, and with
          $\pi_S + \pi_R = 1$, $\pi = (3/4, 1/4)$.
      - reflect: >
          The equation $0.2\,\pi_S = 0.6\,\pi_R$ can be read as a statement
          about traffic between the two kinds of day. Read it that way, and
          turn it into a shortcut for every two-state chain.
        answer: >
          The left side is the long-run rate of sunny-to-rainy switches, the
          right side the rate of rainy-to-sunny switches, and in equilibrium
          the switches must balance. For rows $(1-a, a)$ and $(b, 1-b)$ that
          says $\pi_1 a = \pi_2 b$, so $\pi = (b/(a+b),\, a/(a+b))$: each
          state's weight is the *other* state's leaving probability, scaled.
          Sticky states, with small leaving probability, get more weight.

      - part: The whole chain in three numbers
        teach: >
          For rows $(1-a, a)$ and $(b, 1-b)$: $\pi = (b/(a+b),\, a/(a+b))$,
          here $(0.6/0.8,\, 0.2/0.8)$. Both self-loops are positive, so the
          chain is irreducible and aperiodic, $\pi$ is unique, and $P^{n}$
          converges to the matrix whose rows are both $\pi$. The eigenvalues
          are $1$ and $1 - a - b$, and deviations from $\pi$ shrink by that
          second factor each day.
      - ask: >
          What is the second eigenvalue for the coastal town?
        expects: "0.2"
        feedback: >
          $1 - 0.2 - 0.6 = 0.2$. Each day, whatever remains of today's
          information shrinks to a fifth.
      - ask: >
          Starting from a rainy day, $p^{(n)}_{RS} = \tfrac34(1 - 0.2^{n})$.
          (At $n = 2$ that is $\tfrac34 \times 0.96 = 0.72$, your first
          answer.) What is $p^{(5)}_{RS}$, to five decimals?
        expects: "0.74976"
        tolerance: 0.00001
        feedback: >
          $0.2^{5} = 0.00032$, so $\tfrac34 \times 0.99968 = 0.74976$. After
          five days, today's rain is almost invisible.
      - ask: >
          On average, how many days pass from one rainy day to the next?
        expects: "4"
        feedback: >
          The mean return time is $1/\pi_R = 1/(1/4) = 4$ days. Sunny days
          recur every $1/\pi_S = 4/3$ days on average.

      - part: Two ways to get it wrong
        ask: >
          A candidate reports $\pi_S = 1/4$. What went wrong?
        choices:
          - text: >
              They used $a/(a+b)$ for the sunny weight: $0.2/0.8$.
            correct: true
            feedback: >
              The ratio is inverted. Sunny days have the smaller leaving
              probability, $0.2$, so they must carry the larger weight. Check
              that pairing before quoting the answer.
          - text: >
              Nothing: rain is less sticky, so it should be rarer, and
              $1/4$ is the sunny share.
            feedback: >
              Rain is less sticky and rarer — so rain gets $1/4$ and sun gets
              $3/4$. The reasoning is right; the label is on the wrong state.
          - text: >
              They forgot to normalise.
            feedback: >
              $1/4$ is already part of a vector summing to $1$. The error is
              which of the two numbers belongs to which state.
        feedback: >
          $\pi_1 = b/(a+b)$: the weight on state $1$ is the chance of
          *entering* it from state $2$, scaled.
      - ask: >
          In a different town the weather almost always flips: rows
          $(0.1, 0.9)$ and $(0.95, 0.05)$. How does the chance of sun approach
          its long-run value?
        choices:
          - text: >
              Quickly and smoothly, because the chain changes state so often.
            feedback: >
              Changing state often makes the chain *alternate*. Here
              $1 - a - b = 1 - 0.9 - 0.95 = -0.85$.
          - text: >
              It never approaches it, because the chain is periodic.
            feedback: >
              Both self-loops are positive ($0.1$ and $0.05$), so the chain is
              aperiodic and does converge — just badly.
          - text: >
              It alternates above and below the limit, and slowly: the gap
              shrinks only by a factor $0.85$ per day.
            correct: true
            feedback: >
              $\lambda_2 = -0.85$: the sign makes it alternate and the size
              makes it slow. Nearly periodic chains converge, but reluctantly.
        feedback: >
          Asked about a two-state chain, give $\pi$ by the ratio shortcut in
          one line, then the second eigenvalue $1 - a - b$ for the speed, and
          $1/\pi_i$ for the return times — three numbers that settle the
          whole chain.

  - node: quant-processes.markov-chains.ergodic-fraction
    hook: >
      "Long-run frequency" and "stationary probability" are the same number,
      and this theorem is the reason — it licenses answering a "what
      fraction of the time..." question with $\pi_i$ even without ever
      proving $P^n$ converges.
    explanation: >
      This is the law of large numbers transplanted to dependent data:
      instead of averaging i.i.d. draws, you're averaging indicator
      variables along a single trajectory of a chain, and irreducibility
      plus positive recurrence does the job that independence does in the
      classical law. The result,
      $\frac1n\sum_{k=0}^{n-1}\mathbf{1}\{X_k=i\}\to\pi_i$ with probability
      $1$, holds from any starting state — it doesn't even need $\pi$ to
      already be known as a limit of $P^n$, only as the solution of
      $\pi P=\pi$.

      What makes this genuinely stronger than the convergence-to-equilibrium
      statement is what's missing from its hypotheses: aperiodicity. A
      period-$2$ chain never has $(P^n)_{ij}$ settle to a single value,
      since it alternates between two patterns forever, but averaging over
      time smooths that oscillation completely away — spending exactly half
      the visits in each of two alternating phases produces a time-average
      that still hits $\pi_i$ on the nose.

      The generalization to $\frac1n\sum f(X_k)\to\sum_i\pi_if(i)$ applies
      the same idea to any bounded (or absolutely summable) function of the
      state rather than just a single indicator — it's what justifies
      computing a long-run average cost, reward, or count directly as an
      expectation under $\pi$.
    worked: >
      On the two-state swap chain (rows $(0,1)$ and $(1,0)$, period $2$,
      $\pi=(0.5,0.5)$), start at state $1$ and track visits over the first
      $10$ steps, $k=0,\dots,9$: state $1$ occurs at $k=0,2,4,6,8$, exactly
      $5$ of $10$, giving a time-average fraction of $0.5=\pi_1$ exactly —
      even though $P^n$ itself never converges, alternating forever between
      the identity and the swap matrix.
    interview: >
      "What fraction of days is the machine in state $X$, long-run?" is
      answered with $\pi_X$, citing this theorem by name if pressed on why a
      time average should equal a probability computed from a static
      equation — the interviewer is listening for "law of large numbers for
      a dependent sequence," not just the number.
    pitfalls: >
      Assuming this theorem needs aperiodicity, by analogy with the
      convergence-to-equilibrium statement, leads to unnecessarily checking a
      condition that isn't actually required here. Applying the generalized
      version with an $f$ whose sum $\sum_i\pi_if(i)$ doesn't converge
      absolutely invalidates the conclusion silently.
    recap: >
      Time averages along one trajectory converge to $\pi$ for any
      irreducible positive recurrent chain, no aperiodicity required —
      "long-run frequency" and "stationary probability" are the same number
      for exactly this reason.
    dialogue:
      - part: One taxi, many trips
        teach: >
          A taxi works trip by trip. A trip from the Airport always ends in
          the City. A trip from the City ends at the Airport with probability
          $1/3$ and stays in the City with probability $2/3$. A trip starting
          at the Airport pays $40$; a trip starting in the City pays $10$.
      - ask: >
          Solve for the stationary distribution. What is $\pi_{\text{Airport}}$?
        expects: "1/4"
        hint: >
          Balance at the Airport: $\pi_A = \tfrac13 \pi_C$.
        feedback: >
          $\pi_A = \tfrac13 \pi_C$ and $\pi_A + \pi_C = 1$ give
          $\pi = (1/4, 3/4)$.
      - ask: >
          A driver works this taxi for years. Predict the long-run average fare
          per trip.
        expects: "17.5"
        feedback: >
          If a quarter of trips start at the Airport:
          $\tfrac14 \times 40 + \tfrac34 \times 10 = 10 + 7.5 = 17.5$.
      - ask: >
          That prediction quietly assumed something. $\pi$ describes the law
          of the taxi's position at one time; the driver experiences one long
          sequence of trips. What stands between the two?
        choices:
          - text: >
              Nothing: the law of large numbers turns probabilities into
              frequencies.
            feedback: >
              The law of large numbers you know is for independent draws.
              Consecutive trips here are strongly dependent — an Airport trip
              is always followed by a City one.
          - text: >
              The driver's trips are dependent, so the usual law of large
              numbers does not apply directly.
            correct: true
            feedback: >
              Right. The prediction needs a law of large numbers for a
              dependent sequence, and that has to be earned.
          - text: >
              The chain must first converge to $\pi$, so the prediction only
              holds after a burn-in.
            feedback: >
              Convergence of the law is a separate matter, and as you will
              see the time average does not even need it.
        feedback: >
          A frequency along one path and a probability at one time are
          different objects. Something must connect them.
      - reflect: >
          Find independence hiding in the driver's path. Cut the sequence of
          trips at every visit to the Airport. What can you say about the
          pieces, and how does that give the fraction of trips starting at
          the Airport?
        hint: >
          What does the Markov property say about the future each time the
          taxi is back at the Airport?
        answer: >
          Each time the taxi is at the Airport, its future is a fresh copy of
          the same process, so the excursions between Airport visits are
          independent and identically distributed. The ordinary law of large
          numbers applies to them: over $N$ excursions the number of trips is
          about $N m_A$, with $m_A$ the mean excursion length. So the fraction
          of trips starting at the Airport tends to $1/m_A$, which the
          existence-and-uniqueness theorem identifies with $\pi_A$.

      - part: Time averages are stationary averages
        teach: >
          For an irreducible positive recurrent chain, with probability $1$ and
          from any start,
          $\frac{1}{n}\sum_{k=0}^{n-1}\mathbf{1}\{X_k = i\} \to \pi_i$, and more
          generally $\frac{1}{n}\sum_{k=0}^{n-1} f(X_k) \to \sum_i \pi_i f(i)$
          when that sum converges absolutely. It is the law of large numbers
          for dependent data. Aperiodicity is not a hypothesis.
      - ask: >
          What is the mean excursion length $m_A$, in trips, from the Airport
          back to the Airport?
        expects: "4"
        hint: >
          One trip to the City, then a geometric wait with success
          probability $1/3$.
        feedback: >
          $1 + 3 = 4$ trips, and $1/m_A = 1/4 = \pi_A$, as the excursion
          argument said.
      - ask: >
          A new contract makes the taxi alternate strictly: Airport, City,
          Airport, City, and so on. The chain is periodic and $P^{n}$ never
          converges. What is the long-run fraction of trips that start at the
          Airport?
        expects: "1/2"
        feedback: >
          Exactly half, from any start: $\pi = (1/2, 1/2)$ and the time
          average hits it. The probability of being at the Airport at time
          $n$ alternates $1, 0, 1, 0$, but averaging over time smooths the
          oscillation away.

      - part: Dropping the other hypotheses
        ask: >
          A second taxi company adds a Suburb zone: a City trip can end in the
          Suburb with small probability, and Suburb trips only ever end in
          the Suburb or a neighbouring Village, never back in the City. What
          happens to the long-run fraction of trips at the Airport?
        choices:
          - text: >
              It is still $\pi_A$ for a single stationary $\pi$.
            feedback: >
              The chain is no longer irreducible: Suburb and Village form a
              closed class the taxi eventually falls into. There is no single
              $\pi$ to point to.
          - text: >
              It tends to $0$: the taxi is eventually trapped in the Suburb
              and Village and never sees the Airport again.
            correct: true
            feedback: >
              Airport and City are transient; the time average is set by the
              closed class the path ends in. With several closed classes it
              would depend on which one the path happened to reach.
          - text: >
              It does not converge at all.
            feedback: >
              It converges — to $0$ here. Losing irreducibility changes the
              limit, not its existence.
        feedback: >
          Irreducibility is what makes the time average the same number for
          every path.
      - ask: >
          The simple symmetric walk on the integers is irreducible and
          returns to $0$ with probability $1$. What is the long-run fraction
          of time it spends at $0$?
        choices:
          - text: >
              $0$: returns are certain but their mean spacing is infinite.
            correct: true
            feedback: >
              With $m_0 = \infty$, the excursion argument gives a fraction
              $1/m_0 = 0$. Positive recurrence is what makes the fractions
              positive and add to $1$.
          - text: >
              A small positive number, since the walk keeps returning.
            feedback: >
              Infinitely many returns can still occupy a vanishing fraction of
              time. That is what infinite mean spacing means.
          - text: >
              It has no long-run fraction, because the walk has period $2$.
            feedback: >
              The walk does have period $2$, but periodicity plays no role in
              time averages — the strict Airport–City alternation had a
              perfectly good one.
        feedback: >
          When asked "what fraction of the time?", answer $\pi_i$, and if
          pressed on why a time average equals a probability, say "the law
          of large numbers for a dependent sequence: excursions between
          visits are independent".

  - node: quant-processes.markov-chains.mean-return-time
    hook: >
      "How often does state $X$ recur?" is a one-line answer, $1/\pi_X$,
      once you have $\pi$ — no separate first-step system for the return
      time is needed.
    explanation: >
      The identity $m_i=1/\pi_i$ drops directly out of the ergodic theorem's
      time-average interpretation: if the chain spends a fraction $\pi_i$ of
      its steps at $i$, and consecutive visits to $i$ are spaced $m_i$ steps
      apart on average, then over a long stretch of $n$ steps there are
      about $n/m_i$ visits, and that count divided by $n$ must equal
      $\pi_i$ — forcing $\pi_im_i=1$.

      This gives a genuinely useful shortcut: any time you've already solved
      for $\pi$, the return time to every state is free, just its
      reciprocal, with no additional linear system to set up. Rare states
      (small $\pi_i$) are, unsurprisingly, visited rarely and waited for a
      long time between visits; common states are visited often and the
      gaps are short.

      The one distinction worth keeping sharp: $m_i$ is specifically the
      return time to $i$ starting from $i$ itself. The expected time to hit
      $i$ starting from some other state $j\ne i$ is a genuinely different
      quantity, computed by its own first-step system exactly like an
      absorption-time problem, and $1/\pi_i$ says nothing directly about it.
    worked: >
      For the Up/Down machine with $\pi=(4/7,3/7)$: the mean return time to
      Up is $m_{\text{Up}}=1/\pi_{\text{Up}}=7/4=1.75$ steps, and to Down is
      $m_{\text{Down}}=1/\pi_{\text{Down}}=7/3\approx2.33$ steps — Down is
      visited less often (smaller $\pi$) and correspondingly takes longer,
      on average, to recur.
    interview: >
      "On average, how many steps between visits to state $X$?" is answered
      immediately as $1/\pi_X$ whenever $\pi$ is already known, and the
      interviewer is checking that you reach for this reciprocal rather than
      setting up a fresh first-step system for return time.
    pitfalls: >
      Applying $1/\pi_i$ to a hitting-time question that starts from a
      different state confuses return time with hitting time — they
      coincide only when the starting state is $i$ itself. Using this
      identity on a chain that isn't irreducible and positive recurrent
      borrows a formula whose derivation assumed exactly those hypotheses.
    recap: >
      Mean return time to $i$ is exactly $1/\pi_i$, free once $\pi$ is
      known — but only for return to $i$ starting from $i$, not for hitting
      $i$ from anywhere else.
    dialogue:
      - part: Back to the home page
        teach: >
          A shopper clicks through a site with three pages. From Home the next
          click always goes to Search. From Search it goes to Product or back
          to Home with probability $1/2$ each. From Product it goes to Home or
          to Search with probability $1/2$ each.
      - ask: >
          Starting on Home, what is the expected number of clicks until the
          shopper is next on Home?
        expects: "3"
        hint: >
          One click to Search, then a first-step system for the time to reach
          Home: $k_S = 1 + \tfrac12 k_P$ and $k_P = 1 + \tfrac12 k_S$.
        feedback: >
          $k_S = 1 + \tfrac12(1 + \tfrac12 k_S)$, so $\tfrac34 k_S = \tfrac32$
          and $k_S = 2$. The return takes $1 + 2 = 3$ clicks on average.
      - ask: >
          Now solve $\pi P = \pi$. What is $\pi_{\text{Product}}$?
        expects: "2/9"
        hint: >
          Balance at Product: $\pi_P = \tfrac12 \pi_S$. Balance at Home:
          $\pi_H = \tfrac12 \pi_S + \tfrac12 \pi_P$.
        feedback: >
          Set $\pi_P = x$, so $\pi_S = 2x$ and $\pi_H = x + \tfrac12 x = \tfrac32 x$.
          The sum $\tfrac92 x = 1$ gives $x = 2/9$, and
          $\pi = (1/3, 4/9, 2/9)$.
      - reflect: >
          $\pi_{\text{Home}} = 1/3$ and the mean return time to Home was $3$.
          Explain why that is no coincidence, using what you know about
          long-run fractions of time.
        hint: >
          Over $n$ clicks, roughly how many visits to Home are there, if
          visits are $m$ clicks apart on average?
        answer: >
          By the ergodic theorem the shopper is on Home a fraction $\pi_H$ of
          the time. If consecutive visits are $m_H$ clicks apart on average,
          then $n$ clicks contain about $n/m_H$ visits, a fraction $1/m_H$.
          Both describe the same long-run frequency, so $\pi_H m_H = 1$.

      - part: Return times for free
        teach: >
          For an irreducible positive recurrent chain, the mean return time to
          $i$, $m_i = \mathbb{E}[\min\{n \ge 1 : X_n = i\} \mid X_0 = i]$,
          equals $1/\pi_i$. Once $\pi$ is solved, every return time is a
          reciprocal — no further linear system.
      - ask: >
          What is the mean return time to Product?
        expects: "9/2"
        feedback: >
          $1/\pi_P = 1/(2/9) = 9/2 = 4.5$ clicks. And to Search,
          $1/(4/9) = 9/4$.
      - ask: >
          A fraud monitor flags a state the chain occupies $0.4\%$ of the
          time. On average, how many steps pass between flags?
        expects: "250"
        feedback: >
          $1/0.004 = 250$. Rare states are waited for in exact proportion to
          their rarity.

      - part: Returning is not arriving
        ask: >
          Starting on Home, what is the expected number of clicks until the
          shopper first reaches Product?
        expects: "4"
        hint: >
          Set up a hitting-time system with $k_P = 0$: $k_H = 1 + k_S$ and
          $k_S = 1 + \tfrac12 k_H$.
        feedback: >
          $k_H = 1 + 1 + \tfrac12 k_H$, so $k_H = 4$. Not $4.5$.
      - ask: >
          Why is the hitting time from Home ($4$) different from $1/\pi_P = 4.5$?
        choices:
          - text: >
              One of the two computations has an arithmetic slip; they must
              agree.
            feedback: >
              Both are right. They answer different questions.
          - text: >
              $1/\pi_P$ is the mean time to come back to Product starting
              from Product; the time to reach Product from Home is a different
              quantity with its own first-step system.
            correct: true
            feedback: >
              From Product the shopper first moves to Home or Search and then
              has to find the way back: $1 + \tfrac12 \times 4 + \tfrac12 \times 3 = 4.5$,
              where $3$ is the hitting time from Search.
          - text: >
              $1/\pi_P$ only holds once the chain has reached equilibrium.
            feedback: >
              $m_i = 1/\pi_i$ is exact for a chain started at $i$; no burn-in
              is involved. The issue is the starting state, not timing.
        feedback: >
          $1/\pi_i$ answers "how often does $i$ recur?", nothing else.
      - ask: >
          A chain has an absorbing state $Z$ and a transient state $T$ that
          leads to it. A colleague computes $\pi_T = 0$ and quotes a mean
          return time to $T$ of $1/0$. What is the right reading?
        choices:
          - text: >
              The formula breaks: the chain is not irreducible, so
              $m_i = 1/\pi_i$ was never promised. From $T$ the chain may never
              return at all.
            correct: true
            feedback: >
              The identity was derived from the ergodic theorem, whose
              hypotheses are irreducibility and positive recurrence. Outside
              them, compute directly.
          - text: >
              $T$ is visited every $\infty$ steps, which is a valid answer.
            feedback: >
              "Mean return time" presumes a return. From a transient state
              the chain may never come back, so the question itself needs
              rephrasing.
          - text: >
              $\pi_T$ must be wrong, since every state has positive weight.
            feedback: >
              Transient states get weight $0$ in any stationary distribution.
              $\pi_T = 0$ is correct; the reciprocal is what is invalid.
        feedback: >
          In an interview: "on average, how many steps between visits to
          $X$?" — answer $1/\pi_X$ at once, and say the condition aloud: it is
          a return time from $X$ itself, in an irreducible chain.

  - node: quant-processes.markov-chains.detailed-balance
    hook: >
      Checking $\pi_ip_{ij}=\pi_jp_{ji}$ edge by edge is almost always
      faster than solving $\pi P=\pi$ directly, and for any walk on a graph
      it hands you the answer, $\pi\propto\deg$, without solving anything at
      all.
    explanation: >
      Detailed balance asks for something stronger and more local than
      stationarity: not just that the total probability flowing into each
      state matches what flows out overall, but that the flow across every
      single edge matches in both directions, $\pi_ip_{ij}=\pi_jp_{ji}$.
      Summing this edge-by-edge identity over $i$ collapses to
      $\sum_i\pi_ip_{ij}=\pi_j\sum_ip_{ji}=\pi_j$ — exactly the stationarity
      equation — so detailed balance is always sufficient for stationarity,
      and a chain started at such a $\pi$ is statistically indistinguishable
      from its own time-reversal, hence "reversible."

      The converse genuinely fails: a chain that cycles $1\to2\to3\to1$ with
      probability $1$ has $\pi=(1/3,1/3,1/3)$ stationary (every state
      receives exactly the flow it sends out, in aggregate) but no detailed
      balance on any edge, since probability only ever flows one direction
      around the cycle. Any deterministic cycle of length at least $3$ is
      stationary without being reversible, because a one-way circulating
      flow is the signature of broken detailed balance even when the totals
      still add up.

      The payoff that makes this worth checking first: for a walk on any
      connected undirected graph that steps to a uniformly chosen neighbor,
      $\pi_i\propto\deg(i)$ solves detailed balance instantly, because both
      $\pi_ip_{ij}$ and $\pi_jp_{ji}$ reduce to the same number,
      $1/(2|E|)$, on every edge.
    worked: >
      On the path $1$–$2$–$3$–$4$ (edges $12,23,34$, so $2|E|=6$), degrees
      are $1,2,2,1$, giving $\pi=(1/6,1/3,1/3,1/6)$. Check the edge
      $(1,2)$: $\pi_1p_{12}=(1/6)(1)=1/6$, since state $1$'s only neighbor
      is $2$; and $\pi_2p_{21}=(1/3)(1/2)=1/6$, since state $2$ splits
      evenly between neighbors $1$ and $3$. The two sides match exactly,
      confirming detailed balance on this edge without ever writing
      $\pi P=\pi$.
    interview: >
      "Find the stationary distribution of a random walk on this graph" is
      meant to be answered with $\pi\propto\deg$ immediately, with detailed
      balance cited as the one-line justification — solving $\pi P=\pi$
      from scratch on a graph walk is the slow way to get the same answer.
    pitfalls: >
      Assuming stationarity implies detailed balance runs the implication
      backward — the one-way cycle is the standard counterexample, and it's
      worth having ready. Applying $\pi\propto\deg$ to a directed graph, or
      to a walk that isn't uniform-over-neighbors, uses a formula whose
      derivation specifically assumed an undirected graph and uniform
      neighbor choice.
    recap: >
      Detailed balance, $\pi_ip_{ij}=\pi_jp_{ji}$, is a stronger and more
      local condition than stationarity that always implies it but not
      conversely — and it hands over $\pi\propto\deg$ for any uniform walk
      on an undirected graph.
    dialogue:
      - part: Three fleas, two dogs
        teach: >
          Three fleas live on two dogs. Each second one of the three fleas,
          chosen uniformly, jumps to the other dog. The state is the number of
          fleas on dog $A$, from $0$ to $3$.
      - ask: >
          From state $1$, what is the probability the next state is $2$?
        expects: "2/3"
        feedback: >
          The jumper is one of the two fleas on dog $B$ with probability
          $2/3$, and then dog $A$ gains one. From $1$ the chain goes to $0$
          with probability $1/3$ and to $2$ with probability $2/3$.
      - reflect: >
          You could solve four balance equations for $\pi$. Instead, think
          about a long run of the chain and the edge between states $0$ and
          $1$. How do the number of jumps $0 \to 1$ and the number of jumps
          $1 \to 0$ compare, and what equation does that give for $\pi$?
        hint: >
          Can the chain cross from $0$ to $1$ twice without crossing back in
          between?
        answer: >
          They differ by at most one, since the chain cannot cross the edge
          upward twice without crossing it downward in between. So in the
          long run the two crossing rates are equal: $\pi_0 p_{01} = \pi_1 p_{10}$,
          that is $\pi_0 \cdot 1 = \pi_1 \cdot \tfrac13$. Every edge of this
          chain gives one such equation, and each is far simpler than a full
          balance equation.
      - ask: >
          From the edge $0$–$1$, what is the ratio $\pi_1/\pi_0$?
        expects: "3"
        feedback: >
          $\pi_0 \cdot 1 = \pi_1 \cdot \tfrac13$, so $\pi_1 = 3\pi_0$.
      - ask: >
          The edge $1$–$2$ gives $\pi_1 \cdot \tfrac23 = \pi_2 \cdot \tfrac23$,
          and the edge $2$–$3$ gives $\pi_2 \cdot \tfrac13 = \pi_3 \cdot 1$.
          What is $\pi_0$?
        expects: "1/8"
        feedback: >
          $\pi = \pi_0(1, 3, 3, 1)$, and normalising gives $\pi_0 = 1/8$:
          $\pi = (1/8, 3/8, 3/8, 1/8)$, the law of three fair coin flips. In
          equilibrium each flea is equally likely to be on either dog,
          independently.

      - part: Balance edge by edge
        teach: >
          A probability vector satisfies detailed balance for $P$ if
          $\pi_i p_{ij} = \pi_j p_{ji}$ for all $i, j$: probability flows
          along each edge equally in both directions. Detailed balance implies
          $\pi P = \pi$, and a chain started from such a $\pi$ looks
          statistically the same run backwards — it is reversible.
      - ask: >
          The proof sums $\pi_i p_{ij} = \pi_j p_{ji}$ over $i$, giving
          $\sum_i \pi_i p_{ij} = \pi_j \sum_i p_{ji}$. What finishes it?
        choices:
          - text: >
              $\sum_i p_{ji} = 1$, because row $j$ of $P$ is a probability
              distribution.
            correct: true
            feedback: >
              The sum runs along row $j$, so it is $1$, and the right side is
              $\pi_j$: exactly the balance equation at $j$.
          - text: >
              $\sum_i p_{ji} = 1$, because every column of $P$ sums to $1$.
            feedback: >
              Columns need not sum to $1$. Look at the indices: $p_{ji}$ with
              $j$ fixed and $i$ varying runs along a row.
          - text: >
              $\sum_i \pi_i = 1$, by normalisation.
            feedback: >
              Normalisation is not used here; the identity holds for any
              vector satisfying detailed balance, normalised or not.
        feedback: >
          Detailed balance is local, and summing the local equations
          reproduces the global one.
      - ask: >
          In equilibrium, what fraction of the time are all three fleas on
          the same dog?
        expects: "1/4"
        feedback: >
          $\pi_0 + \pi_3 = 1/8 + 1/8 = 1/4$.

      - part: When the flow circulates
        ask: >
          A bus runs on a ring of four stops. Each minute it moves one stop
          clockwise with probability $3/4$ and waits with probability $1/4$.
          Its stationary distribution is uniform, $1/4$ per stop. Does it
          satisfy detailed balance?
        choices:
          - text: >
              Yes: $\pi$ is stationary, and stationary means balanced.
            feedback: >
              Stationary means each stop's total inflow equals its total
              outflow. Detailed balance asks for more: each edge balanced on
              its own.
          - text: >
              No: from stop $1$ to stop $2$ the flow is $\tfrac14 \cdot \tfrac34$,
              and from $2$ to $1$ it is $0$.
            correct: true
            feedback: >
              Probability circulates one way round the ring. Every stop is in
              balance overall; no edge is. A film of this bus run backwards
              would show it going anticlockwise — not reversible.
          - text: >
              Yes, because the uniform vector satisfies everything.
            feedback: >
              Check the edge from stop $1$ to stop $2$: $3/16$ one way and $0$
              the other. Uniformity does not help an edge that is only used
              in one direction.
        feedback: >
          Detailed balance implies stationarity; the converse fails whenever
          the chain has a net circulation.
      - ask: >
          A walk on a star — a hub joined to $4$ leaves — steps to a uniformly
          chosen neighbour. Detailed balance holds with $\pi_i$ proportional
          to the degree of $i$. What is $\pi_{\text{hub}}$?
        expects: "1/2"
        hint: >
          Degrees are $4$ for the hub and $1$ for each leaf.
        feedback: >
          The degrees sum to $8$, so $\pi_{\text{hub}} = 4/8 = 1/2$. Check one
          edge: $\tfrac12 \cdot \tfrac14 = \tfrac18 \cdot 1$. On any undirected
          graph both sides equal $1/(2|E|)$ — which is why, asked for $\pi$ of
          a graph walk, you check detailed balance first and solve nothing.

  - node: quant-processes.markov-chains.graph-walk
    hook: >
      Once you spot "random walk on a graph, uniform neighbor choice," the
      stationary distribution is degrees, normalized — this is the fastest
      possible finish to that entire class of question.
    explanation: >
      Reading off $\pi_i=\deg(i)/(2|E|)$ requires nothing but a degree count
      and an edge count, both directly visible from the graph's picture, no
      equations to set up or solve — the detailed-balance argument does all
      the work in advance. Mean return times then come for free too, as
      $1/\pi_i=2|E|/\deg(i)$: high-degree vertices are visited often and
      recur quickly, low-degree ones are visited rarely and recur slowly.

      The one condition still worth checking before quoting the limiting
      behavior is periodicity: $\pi$ itself doesn't care whether the graph
      is bipartite, but $P^n$'s actual convergence to it does. Any odd cycle
      anywhere in the graph is enough to force aperiodicity for the whole
      (connected, hence irreducible) walk, while a purely bipartite graph —
      no odd cycles at all — keeps the same $\pi$ stationary but leaves
      $P^n$ oscillating forever, never actually converging to it.
    worked: >
      Vertices $A,B,C,D$ with edges $AB,BC,CD,DA,AC$: a $4$-cycle with one
      diagonal. Degrees are $A{:}3$, $B{:}2$, $C{:}3$, $D{:}2$, summing to
      $2|E|=10$, so $\pi=(0.3,0.2,0.3,0.2)$ with no linear system solved.
      Mean return times are $2|E|/\deg(i)$: $10/3\approx3.33$ for $A$ and
      $C$, $5$ for $B$ and $D$. The diagonal creates the triangle
      $A$–$B$–$C$–$A$, an odd cycle, so despite the underlying $4$-cycle's
      bipartite shape the whole graph is non-bipartite and the walk is
      aperiodic — $P^n$ genuinely converges to $\pi$ from any start.
    interview: >
      "What's the stationary distribution of a simple random walk on this
      graph" wants $\pi\propto\deg$ produced immediately from a glance at
      the picture, with mean return times as an easy follow-up — and "does
      it converge" answered by checking for an odd cycle, not by computing
      eigenvalues.
    pitfalls: >
      Forgetting that $2|E|$, not $|E|$, is the normalizing constant
      undercounts the total by exactly a factor of $2$, since each edge
      contributes to two vertices' degrees. Declaring a graph aperiodic just
      because it "doesn't look bipartite" without actually finding an odd
      cycle is a guess, not a verification.
    recap: >
      A uniform random walk on a connected graph has $\pi_i=\deg(i)/(2|E|)$
      and mean return time $2|E|/\deg(i)$ immediately, converging whenever
      the graph has an odd cycle and merely oscillating stationarily
      otherwise.
    dialogue:
      - part: A robot in a house of five rooms
        teach: >
          A robot vacuum wanders five rooms. Doorways join $A$–$B$, $B$–$C$,
          $C$–$D$, $D$–$A$, $A$–$T$ and $B$–$T$: a square $ABCD$ with a
          triangle $ABT$ on top, like the outline of a house. Each minute the
          robot leaves through a uniformly chosen doorway of its current room.
      - ask: >
          Without computing anything, which rooms does the robot occupy most
          in the long run?
        choices:
          - text: >
              All rooms equally, since every doorway is used at random.
            feedback: >
              Uniform choice at each room does not make rooms equal. A room
              with more doorways is entered from more places.
          - text: >
              $T$, the room at the top of the house.
            feedback: >
              $T$ has only two doorways. Position in the drawing means
              nothing; the count of connections is what matters.
          - text: >
              $A$ and $B$, which have three doorways each.
            correct: true
            feedback: >
              They are the best-connected rooms, and in the long run the
              robot's share of time in a room grows with its doorway count.
        feedback: >
          Degrees: $A$ and $B$ have $3$; $C$, $D$ and $T$ have $2$.
      - reflect: >
          Why should the long-run share of a room be proportional to its
          number of doorways? Check what happens on a single doorway between
          rooms $i$ and $j$ if $\pi_i = \deg(i)/(2|E|)$.
        hint: >
          The probability flow from $i$ to $j$ is $\pi_i p_{ij}$, and
          $p_{ij} = 1/\deg(i)$.
        answer: >
          The flow from $i$ to $j$ is $\tfrac{\deg(i)}{2|E|} \cdot \tfrac{1}{\deg(i)} = \tfrac{1}{2|E|}$,
          and the flow back is the same number. Every doorway is balanced
          both ways, so detailed balance holds, and detailed balance makes
          $\pi$ stationary. The normalising constant $2|E|$ is the sum of the
          degrees, because every edge has two ends.

      - part: Degrees, normalised
        ask: >
          What is $\pi_A$?
        expects: "1/4"
        hint: >
          The house has $6$ doorways, so the degrees sum to $12$.
        feedback: >
          $\pi_A = 3/12 = 1/4$. The full vector is
          $(3, 3, 2, 2, 2)/12$ for $A, B, C, D, T$.
      - ask: >
          Starting in room $C$, how many minutes on average until the robot is
          next in $C$?
        expects: "6"
        feedback: >
          $1/\pi_C = 12/2 = 6$. In general the mean return time is
          $2|E|/\deg(i)$.
      - ask: >
          In the long run, what fraction of the robot's moves pass through
          the doorway $A$–$B$, in either direction?
        expects: "1/6"
        hint: >
          The flow along one doorway in one direction is $\pi_A p_{AB}$.
        feedback: >
          $\pi_A p_{AB} = \tfrac14 \cdot \tfrac13 = \tfrac{1}{12}$ from $A$ to
          $B$, and the same from $B$ to $A$, so $1/6$ of all moves. Every
          doorway carries $1/(2|E|)$ of the traffic each way: in equilibrium
          the walk uses its edges uniformly, not its rooms.
      - ask: >
          A new doorway is cut between $C$ and $T$. What is $\pi_C$ now?
        expects: "3/14"
        feedback: >
          Seven doorways, so the degrees sum to $14$; $C$ now has degree $3$,
          giving $\pi_C = 3/14$. One new edge changes two degrees and the
          normaliser, and nothing else.
      - ask: >
          Back to the original house. Does the law of the robot's room converge
          to $\pi$ from any starting room?
        choices:
          - text: >
              No: the square $ABCD$ makes the walk bipartite, so it oscillates.
            feedback: >
              The square alone would be bipartite, but the triangle $ABT$ is
              an odd cycle, and one odd cycle breaks the two-colouring for
              the whole connected graph.
          - text: >
              Yes: the graph is connected, and the triangle $ABT$ gives returns
              of length $2$ and $3$, so the walk is aperiodic.
            correct: true
            feedback: >
              $A \to B \to A$ and $A \to B \to T \to A$ have lengths $2$ and
              $3$, with greatest common divisor $1$.
          - text: >
              Only if the robot starts in $A$ or $B$.
            feedback: >
              Convergence for a connected aperiodic walk does not depend on the
              start; the start is forgotten.
        feedback: >
          For convergence, look for an odd cycle, not for eigenvalues.

      - part: Where the shortcut stops
        ask: >
          The roof is sealed off: room $T$ and its two doorways are removed,
          leaving the square $ABCD$. Which statement is right?
        choices:
          - text: >
              $\pi = (1/4, 1/4, 1/4, 1/4)$ is still stationary, but from $A$
              the robot is in $\{A, C\}$ only at even times, so its law never
              converges.
            correct: true
            feedback: >
              Every degree is $2$, so $\pi$ is uniform. The square is
              bipartite with sides $\{A, C\}$ and $\{B, D\}$, so the walk has
              period $2$: stationary, but oscillating.
          - text: >
              There is no stationary distribution, since the walk oscillates.
            feedback: >
              Degrees still give a $\pi$ satisfying detailed balance. The
              period affects convergence, not existence.
          - text: >
              The robot settles evenly on all four rooms from any start.
            feedback: >
              Start in $A$: after one minute it is in $B$ or $D$, after two
              in $A$ or $C$, and so on forever. The law never settles.
        feedback: >
          Bipartite graph: same $\pi \propto \deg$, no convergence.
      - ask: >
          In the original house, the robot is reprogrammed to prefer room $T$:
          from $A$ and $B$ it takes the doorway to $T$ with probability $1/2$,
          splitting the rest evenly. Does $\pi \propto \deg$ still hold?
        choices:
          - text: >
              Yes: the graph has not changed, so neither have the degrees.
            feedback: >
              The degrees have not changed, but the walk has. The flow along
              $A$–$T$ is now $\pi_A \cdot \tfrac12$ one way and
              $\pi_T \cdot \tfrac12$ the other; with the degree vector these
              are $1/8$ and $1/12$, no longer equal.
          - text: >
              No: $\pi \propto \deg$ was derived for a walk choosing doorways
              uniformly, and this walk does not.
            correct: true
            feedback: >
              The shortcut needs an undirected graph and a uniform choice of
              neighbour. Change either and you are back to solving for $\pi$ —
              or to checking detailed balance with the new probabilities.
          - text: >
              Yes, after adding $1$ to the degree of $T$ to account for its
              popularity.
            feedback: >
              No patch of the degrees is guaranteed to work. Detailed balance
              must be rechecked edge by edge with the actual transition
              probabilities.
        feedback: >
          Asked for the stationary law of a walk on a graph, count degrees,
          divide by $2|E|$, read return times as $2|E|/\deg(i)$, and settle
          convergence by finding an odd cycle — all from the picture.

  - node: quant-processes.markov-chains.pagerank
    hook: >
      "How would you rank web pages by importance" is really asking whether
      you can turn any vague notion of importance into the equilibrium of a
      Markov chain you get to design — PageRank is the canonical worked
      instance of that move.
    explanation: >
      The raw idea — importance is the fraction of time a random surfer
      following links spends on a page — is elegant but broken on a real
      link graph, because dead-end pages (no outgoing links) and
      disconnected regions make the naive chain neither irreducible nor
      reliably aperiodic, so convergence to a single equilibrium isn't
      guaranteed by that construction alone.

      The damping term is the fix, and it's worth seeing exactly why it
      works rather than treating it as a tuning knob: at every step, with
      probability $d\approx0.85$ follow a uniformly chosen outgoing link,
      and with probability $1-d$ teleport to a uniformly chosen page
      anywhere in the whole graph. That teleport term makes every single
      entry of the resulting transition matrix strictly positive — from any
      page, every other page is reachable in exactly one step with
      probability at least $(1-d)$ divided by the number of pages. Strict
      positivity of every entry is a much stronger fact than merely being
      irreducible and aperiodic; it implies both immediately, since every
      state communicates with every other in one step and a positive
      self-return in one step rules out any periodic rotation.

      Once irreducibility and aperiodicity are secured this mechanically,
      convergence to equilibrium is exactly the theorem already established
      for any such chain — the scores are computed in practice by power
      iteration, repeatedly applying $\mu\mapsto\mu P$, with the error
      shrinking roughly like $d^n$ per step. The transferable habit for
      interviews: whenever asked to define an "importance" or "influence"
      score for anything with a natural flow structure — citations,
      followers, recommendations — define the flow as a chain and take its
      stationary distribution, patching whatever breaks irreducibility or
      aperiodicity along the way.
    interview: >
      "How does PageRank work" wants the damping factor's actual purpose
      named — repairing irreducibility and aperiodicity so the equilibrium
      is guaranteed to exist and be reachable by iteration — not just "it's
      a random surfer model" recited without the mechanism. A strong finish
      generalizes: any equilibrium-of-a-flow ranking idea is this same move.
    pitfalls: >
      Describing the random surfer model without mentioning why the
      teleport term is necessary (dead ends and disconnected components
      break the naive chain) misses the actual interview point. Treating
      $d$ as an arbitrary tuning parameter rather than the dial that trades
      off "trust the link structure" against "guarantee convergence"
      undersells what it's doing.
    recap: >
      PageRank is the stationary distribution of a damped random surfer,
      with the teleport term chosen specifically to force every transition
      probability strictly positive, which guarantees the irreducibility
      and aperiodicity that convergence to equilibrium needs.

    dialogue:
      - part: A surfer who gets stuck
        teach: >
          A tiny web has three pages. Page $A$ links only to $B$. Page $B$
          links to $A$ and to $C$. Page $C$ links to nothing. Proposal: rank
          the pages by the fraction of time a random surfer spends on each,
          following a uniformly chosen link every step, and staying put on a
          page with no links.
      - ask: >
          In the long run, what fraction of the time does this surfer spend
          on page $C$?
        expects: "1"
        hint: >
          Every visit to $B$ has a $1/2$ chance of sending the surfer to $C$.
          What happens after that?
        feedback: >
          All of it. The surfer reaches $C$ with probability $1$ and never
          leaves, so $C$ takes the whole ranking and $A$ and $B$ score $0$ —
          though each page has exactly one incoming link.
      - reflect: >
          The ranking idea is sound; the chain is broken. What could you add
          to the surfer's behaviour so that no page can trap it and every page
          keeps a positive share of the time?
        hint: >
          What if the surfer occasionally ignored the links altogether?
        answer: >
          Let the surfer, at every step, jump to a uniformly random page with
          some probability, and follow links otherwise; from a page with no
          links, always jump. Then every page reaches every other in one step,
          so the chain is irreducible, and every page can return to itself in
          one step, so it is aperiodic. Convergence to a unique equilibrium
          is then guaranteed, and that equilibrium is the ranking.

      - part: Damping repairs the chain
        teach: >
          PageRank: with probability $d \approx 0.85$ follow a uniformly chosen
          outgoing link, and with probability $1 - d$ teleport to a uniformly
          chosen page; from a dead end, teleport. Every entry of $P$ is then
          positive, so the chain is irreducible and aperiodic, and the scores
          are its stationary distribution, computed by power iteration
          $\mu \mapsto \mu P$ with error shrinking like $d^{n}$.
      - ask: >
          Take an even smaller web: page $X$ links to $Y$, and $Y$ is a dead
          end. With $d = 1/2$, the rows are $(1/4, 3/4)$ from $X$ and
          $(1/2, 1/2)$ from $Y$. What is the PageRank of $Y$?
        expects: "3/5"
        hint: >
          Two states: $\pi_X$ times the chance of leaving $X$ equals $\pi_Y$
          times the chance of leaving $Y$.
        feedback: >
          $\tfrac34 \pi_X = \tfrac12 \pi_Y$, so $\pi_Y = \tfrac32 \pi_X$ and
          $\pi = (2/5, 3/5)$. $Y$ ranks higher — it receives $X$'s link —
          but no longer swallows everything.
      - ask: >
          With $d = 0.85$, how many power-iteration steps does it take to
          shrink the error by a factor of $1000$?
        expects: "43"
        hint: >
          Solve $0.85^{n} \le 0.001$.
        feedback: >
          $n \ge \ln 1000 / \ln(1/0.85) \approx 6.91/0.1625 \approx 42.5$, so
          $43$ steps — the same few dozen whether the web has three pages or
          billions.

      - part: What the intuition gets right and wrong
        ask: >
          Is PageRank just a count of incoming links?
        choices:
          - text: >
              Yes, in the long run each incoming link adds the same amount.
            feedback: >
              A link passes on a share of the linking page's own rank, split
              among its outgoing links. A link from a high-ranked page with
              two outgoing links is worth far more than one from an obscure
              page with fifty.
          - text: >
              No: a page is important if important pages link to it, which is
              exactly what $\pi_j = \sum_i \pi_i p_{ij}$ says.
            correct: true
            feedback: >
              The balance equation is a recursive definition of importance:
              your score is the score flowing in from the pages pointing at
              you.
          - text: >
              No: it counts outgoing links, since active pages matter more.
            feedback: >
              Outgoing links dilute a page's influence rather than raise its
              score. Linking out to everything earns nothing.
        feedback: >
          The intuition "more links in, higher rank" holds roughly, and
          misleads exactly where the linking pages differ in rank.
      - ask: >
          What happens as the damping factor $d$ is pushed toward $1$?
        choices:
          - text: >
              The ranking becomes uniform, since the surfer teleports more.
            feedback: >
              That is $d \to 0$: teleport always, links ignored, every page
              scores the same.
          - text: >
              The ranking trusts the links more, but power iteration slows,
              and traps like dead ends and closed regions regain their pull.
            correct: true
            feedback: >
              The error shrinks like $d^{n}$, and at $d = 1$ the repair
              disappears altogether — the stuck surfer returns.
          - text: >
              Nothing changes, because the stationary distribution does not
              depend on $d$.
            feedback: >
              $\pi$ depends on $d$ through every entry of $P$. In the $X$–$Y$
              web, $d = 0$ gives $(1/2, 1/2)$ and $d = 1/2$ gives
              $(2/5, 3/5)$.
        feedback: >
          $d$ is the dial between "believe the link structure" and "guarantee
          a clean equilibrium".
      - ask: >
          An interviewer asks how you would rank traders by influence, given
          who copies whose trades. What is the PageRank answer?
        choices:
          - text: >
              Count how many traders copy each trader.
            feedback: >
              That is in-degree, which ignores who the copiers are. Being
              copied by influential traders should count for more.
          - text: >
              Define a chain that moves from a trader to someone they copy,
              add teleportation so it is irreducible and aperiodic, and rank
              by its stationary distribution.
            correct: true
            feedback: >
              The transferable move: importance is the equilibrium of a flow
              you design, repaired wherever it would fail to converge.
          - text: >
              Rank by profit, since influence follows performance.
            feedback: >
              That may be a fine metric, but it ignores the network the
              question hands you. The question is about influence through
              copying.
        feedback: >
          Say the purpose of the teleport term aloud: it buys irreducibility
          and aperiodicity, so the equilibrium exists, is unique and is
          reached by iteration. "It is a random surfer model" without that is
          the answer interviewers mark down.
