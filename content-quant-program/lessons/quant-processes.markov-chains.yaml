unit: quant-processes.markov-chains
opening: >
  This unit builds the two vocabularies of a Markov chain from the transition
  matrix up: the finite-horizon side, which asks where the chain ends up or how
  long it takes to get there via first-step linear systems, and the long-run
  side, which asks where the chain spends its time in equilibrium. The first
  several steps set up machinery — the Markov property, the transition matrix,
  Chapman–Kolmogorov, and the classification of states into recurrent,
  transient and periodic — that the rest of the unit reuses without
  re-deriving. Absorption problems (tennis deuce, a mouse in a maze) and
  stationary-distribution problems (a weather chain, a random walk on a graph)
  are worked end to end, because these two question shapes cover almost
  everything a Markov chain interview asks. By the end, seeing any process that
  resets its own future given only its current state should trigger naming
  states and writing one equation per state before anything else.
lessons:
  - node: quant-processes.markov-chains.markov-property
    hook: >
      Interviewers rarely test the definition directly — they hand you a
      process that visibly remembers its own past, like a pattern-matching
      game or a queue with a backlog, and expect you to enlarge the state
      until the property becomes true.
    explanation: >
      The Markov property says the current state is a sufficient statistic
      for the future: once you know $X_n$, no additional fact about
      $X_{n-1}, X_{n-2}, \dots$ changes the distribution of $X_{n+1}$. That's
      a strong claim about what information matters, and it's what collapses
      "reason about an arbitrarily long history" down to "reason about one
      number."

      Almost nothing is handed to you already Markov. The real skill is
      choosing the state so the property holds: if the obvious description of
      "where things stand" fails — because two different histories that agree
      on that description still predict different futures — the fix is to
      fold the missing information into a bigger state, not to abandon the
      Markov framework. A running total, a count of successes, a raw position
      are common descriptions that look sufficient but aren't; what's usually
      missing is some notion of recency or configuration, like how far into a
      pattern you've matched or how long since the last change.

      Time-homogeneity is a separate, usually-assumed convenience: the
      transition law $p_{ij}$ itself doesn't drift with $n$. Nothing in this
      unit uses a time-varying chain, so treat $p_{ij}$ as fixed once and for
      all.
    worked: >
      Chase the pattern $HH$ with a fair coin and compare two states after
      three tosses: history $HTH$ has one head total and its last toss was
      $H$, while history $THT$ also has one head total but its last toss was
      $T$. Conditioning only on "one head so far," the chance the very next
      toss completes $HH$ is either $0.5$ (from $HTH$) or $0$ (a single $T$
      can't complete $HH$, from $THT$) — two different numbers from the same
      state, so "total heads" is not Markov. Conditioning instead on the
      current run of consecutive heads ($1$ versus $0$) gives the same
      $\Pr(\text{next toss completes }HH)=0.5$ for every history ending in a
      single $H$, confirming run-length is the right state.
    interview: >
      Comes up as "is this process Markov?" for something like inventory with
      lagged demand, a random walk with momentum, or a pattern-matching game.
      The strong answer isn't a flat no — it names the smallest enlarged
      state (last $k$ observations, current progress toward a target) that
      restores the property.
    pitfalls: >
      Concluding a process "isn't Markov" and stopping there, rather than
      enlarging the state, misses the actual interview point — nearly every
      such process becomes Markov with the right state. Ignoring the
      positive-probability caveat on the conditioning history makes the
      defining equation vacuous whenever that particular past has
      probability $0$.
    recap: >
      The future depends on the past only through the present state — and the
      state is whatever you must define to make that literally true.
    steps:
      - teach: >
          You are rarely handed a process that already satisfies the Markov
          property. The actual interview skill is engineering it: choosing a
          state so that knowing it makes the past irrelevant, not checking
          whether some obvious description already has that property.
      - teach: >
          Formally, the current state must be a sufficient statistic for the
          future: once $X_n$ is known, no further fact about $X_{n-1}, X_{n-2},
          \dots$ changes the distribution of $X_{n+1}$. That collapses an
          arbitrarily long history down to a single number.
      - teach: >
          When an obvious description fails, fold the missing information into
          a bigger state. What's usually missing is some notion of recency or
          configuration — a running total or a raw position rarely carries
          that, while a run length or a match-progress count often does.
      - ask: >
          A warehouse restocks on an irregular schedule, and tomorrow's demand
          depends only on how many days have passed since the last restock, not
          on the calendar date. Which description is the right Markov state for
          predicting tomorrow's stock level?
        choices:
          - text: >
              The total number of restocks since the warehouse opened
            feedback: >
              A running total carries no information about how much time has
              passed since the most recent restock, which is exactly what
              demand depends on here.
          - text: >
              Today's stock level and the number of days since the last restock
            correct: true
            feedback: >
              This is exactly the information tomorrow's demand depends on —
              nothing further back adds anything once these two numbers are
              known.
          - text: >
              The day of the week
            feedback: >
              The setup says demand tracks time since restock, not the weekday,
              so this description misses the actual driver entirely.
        feedback: >
          "Days since last restock" is the enlarged state that restores the
          Markov property — a raw total or a calendar fact doesn't carry the
          information the future actually depends on.
      - teach: >
          Time-homogeneity is a separate, usually-assumed convenience: the
          transition law $p_{ij}$ itself doesn't drift with $n$. Nothing in
          this unit uses a time-varying chain, so $p_{ij}$ stays fixed
          throughout.
      - ask: >
          A chain's transition probabilities $p_{ij}(n)$ genuinely depend on
          $n$ — day-shift and night-shift traffic patterns differ, say. Does
          the Markov property itself fail?
        choices:
          - text: >
              Yes — a process whose transitions change over time cannot be
              Markov
            feedback: >
              This confuses two separate properties. The Markov property is
              about conditioning only on the present state, not about whether
              that conditional law stays fixed over time.
          - text: >
              No — it can still be Markov, just not time-homogeneous
            correct: true
            feedback: >
              Exactly right: Markov and time-homogeneous are independent
              assumptions, and only the second one is being violated here.
          - text: >
              No, unless $p_{ij}(n)$ eventually stops changing as $n$ grows
            feedback: >
              Time-homogeneity requires $p_{ij}$ to be constant in $n$ from the
              start, not merely to settle down eventually.
        feedback: >
          Markov and time-homogeneous are two different claims. A chain can
          fail the second while still satisfying the first.
      - teach: >
          Concluding "this isn't Markov" and stopping there misses the actual
          interview point — nearly every such process becomes Markov once the
          state is enlarged correctly. The positive-probability caveat matters
          too: the defining equation says nothing about a history with
          probability $0$.
      - teach: >
          Carry one line out of this: the future depends on the past only
          through the present, and the state is whatever you had to define to
          make that literally true — engineer it before reaching for a formula.

  - node: quant-processes.markov-chains.transition-matrix
    hook: >
      Once you've named the states, writing the transition matrix is pure
      bookkeeping — the one habit worth automating is checking every row
      sums to $1$ before trusting any downstream algebra.
    explanation: >
      $P$ collects every state's one-step law into a single object: row $i$
      is the probability distribution of $X_{n+1}$ given $X_n=i$, so entries
      are nonnegative and each row sums to $1$ — that row-sum-$1$ property is
      called stochastic, and it's the cheapest correctness check available on
      any Markov setup. Columns carry no such constraint; a column can sum to
      anything.

      Distributions are naturally row vectors multiplied on the left,
      $\mu_{n+1}=\mu_nP$, because the $j$-th entry of $\mu_nP$ is exactly
      $\sum_i\mu_n(i)p_{ij}$ — the law of total probability applied one step
      ahead. Iterating gives $\mu_n=\mu_0P^{n}$, so the entire trajectory of
      laws is generated by repeated left-multiplication by the same fixed
      matrix.

      The construction habit that survives every interview chain: write out
      the rows in words first ("from state $i$, go to $j$ with probability
      ...") before touching any matrix notation, because the algebra is
      trivial once the rows are right and error-prone if a transition is
      silently missing or double-counted.
    worked: >
      A user session is Active or Idle. From Active, the next check finds
      Active with probability $0.8$ and Idle with probability $0.2$; from
      Idle, it finds Active with probability $0.3$ and Idle with probability
      $0.7$ — rows $(0.8,0.2)$ and $(0.3,0.7)$. Starting Active,
      $\mu_0=(1,0)$, so $\mu_1=\mu_0P=(0.8,0.2)$, and
      $\mu_2=\mu_1P=(0.8\cdot0.8+0.2\cdot0.3,\,0.8\cdot0.2+0.2\cdot0.7)
      =(0.70,0.30)$: after two checks, the session is Active with probability
      $0.70$.
    interview: >
      "Write down the transition matrix for ..." is usually the very first
      ask in a Markov-chain question, and the interviewer is watching for the
      row-sums-to-$1$ check done out loud, not just a correct-looking grid of
      numbers.
    pitfalls: >
      Writing probabilities as columns instead of rows silently transposes
      the whole problem — check that each row, not column, sums to $1$.
      Leaving out a transition (so a row sums to less than $1$) is the single
      most common setup error.
    recap: >
      $P$'s row $i$ is state $i$'s next-step law; rows sum to $1$, and
      $\mu_n=\mu_0P^{n}$ generates every future distribution from the same
      fixed matrix.
    steps:
      - teach: >
          $P$ packages every state's next-step law into one object, and the
          cheapest correctness check available on any Markov setup is verifying
          every row sums to $1$ before trusting any downstream algebra.
      - teach: >
          Row $i$ holds $p_{ij} = \Pr(X_{n+1} = j \mid X_n = i)$ for every $j$,
          so entries are nonnegative and the row totals $1$ — that's what
          "stochastic" means. Columns carry no such constraint.
      - ask: >
          A row of $P$ lists probabilities $0.35$ and $0.15$ to the only two
          other reachable states, plus an unlisted probability of staying put.
          For $P$ to be stochastic, what must that third probability equal?
        expects: "0.5"
        hint: >
          A stochastic row's three entries must add to $1$.
        feedback: >
          $1 - 0.35 - 0.15 = 0.5$. Leaving out this kind of entry, so the row
          sums to less than $1$, is the single most common setup error.
      - teach: >
          Distributions are row vectors acting on the left: $\mu_{n+1} = \mu_n
          P$, because the $j$-th entry of $\mu_n P$ is $\sum_i \mu_n(i) p_{ij}$
          — total probability applied one step ahead. Iterating gives $\mu_n =
          \mu_0 P^{n}$.
      - ask: >
          A fleet of devices is $40\%$ Connected and $60\%$ Disconnected. From
          Connected, the next check finds Connected with probability $0.85$ and
          Disconnected with probability $0.15$; from Disconnected, it finds
          Connected with probability $0.6$ and Disconnected with probability
          $0.4$. What fraction is Connected after one check?
        expects: "0.7"
        hint: >
          Compute $\mu_1 = \mu_0 P$ using $\mu_0 = (0.4, 0.6)$.
        feedback: >
          $0.4 \times 0.85 + 0.6 \times 0.6 = 0.34 + 0.36 = 0.7$.
      - teach: >
          The same fixed matrix generates every future step: $\mu_2 = \mu_1 P$,
          $\mu_3 = \mu_2 P$, and so on, all built from the one $P$ you wrote
          down. Writing rows out in words first ("from $i$, go to $j$ with
          probability ...") before touching notation is what keeps this algebra
          error-free.
      - ask: >
          Continuing the device fleet from $\mu_1 = (0.7, 0.3)$, what fraction
          is Connected after the second check?
        expects: "0.775"
        hint: >
          Compute $\mu_2 = \mu_1 P$ using the same two rows.
        feedback: >
          $0.7 \times 0.85 + 0.3 \times 0.6 = 0.595 + 0.18 = 0.775$.
      - teach: >
          Writing probabilities as columns instead of rows silently transposes
          the whole problem — always check that rows, not columns, sum to $1$.
      - teach: >
          $P$'s row $i$ is state $i$'s next-step law; rows sum to $1$, and the
          single fixed matrix $P$ generates $\mu_1, \mu_2, \dots$ by repeated
          left multiplication.

  - node: quant-processes.markov-chains.chapman-kolmogorov
    hook: >
      Whenever a question wants the probability of being in state $j$ after a
      specific number of steps rather than in the limit, this is the identity
      that turns it into a matrix power instead of a case-by-case recursion.
    explanation: >
      To go from $i$ to $j$ in $m+n$ steps, the chain must occupy some state
      $k$ at the midpoint, and the Markov property lets you multiply the two
      independent-looking legs: condition on $X_m=k$, and the probability of
      reaching $j$ from there in the remaining $n$ steps depends only on $k$,
      not on how the chain got to $k$. Summing over every possible midpoint
      $k$ gives $p^{(m+n)}_{ij}=\sum_kp^{(m)}_{ik}p^{(n)}_{kj}$ — the law of
      total probability, applied at one intermediate time.

      That sum is, symbol for symbol, the definition of matrix
      multiplication: $(P^mP^n)_{ij}=\sum_k(P^m)_{ik}(P^n)_{kj}$. So $n$-step
      probabilities are nothing but entries of $P^n$, with $P^0=I$ recording
      that zero steps leaves you exactly where you started.

      A useful corollary follows immediately: if $i$ can reach some $k$ in
      $m$ steps with positive probability, and $k$ can reach $j$ in $n$ steps
      with positive probability, then $i$ can reach $j$ in $m+n$ steps with
      positive probability. Reachability is transitive precisely because
      probabilities compose by this sum, not because of any separate
      graph-theoretic argument.
    worked: >
      For a 2-state market model with rows $P_U=(0.6,0.4)$ and
      $P_D=(0.5,0.5)$, compute $p^{(2)}_{UD}$ by summing over the midpoint:
      $p^{(2)}_{UD}=p_{UU}p_{UD}+p_{UD}p_{DD}=0.6\cdot0.4+0.4\cdot0.5
      =0.24+0.20=0.44$. Multiplying $P$ by itself directly gives row $U$ of
      $P^2$ as $(0.56,0.44)$ — the second entry matches exactly, confirming
      the sum-over-midpoint formula and the matrix power compute the same
      number.
    interview: >
      "What's the probability of being in state $j$ after exactly $n$ steps"
      is answered by naming $P^n$ and, if pressed for the reasoning, by
      writing the midpoint sum rather than treating $P^n$ as a black box.
    pitfalls: >
      Forgetting $P^0=I$ leads to off-by-one errors when a problem asks for
      "$n$ steps from now" versus "after the $n$-th transition." Summing over
      the wrong index in the midpoint sum silently computes a transposed
      product instead of $P^{m+n}$.
    recap: >
      $n$-step probabilities are entries of $P^n$ because matrix
      multiplication is exactly the law of total probability applied at an
      intermediate time.
    steps:
      - teach: >
          Whenever a question wants the probability of landing in state $j$
          after a specific number of steps, this identity turns that into a
          matrix power instead of a fresh case-by-case recursion.
      - teach: >
          To go from $i$ to $j$ in $m+n$ steps the chain occupies some midpoint
          state $k$, and the Markov property lets the two legs multiply
          independently: summing over every possible $k$ gives $p^{(m+n)}_{ij}
          = \sum_k p^{(m)}_{ik} p^{(n)}_{kj}$ — total probability applied at
          one intermediate time.
      - ask: >
          A weather chain has rows Sunny $= (0.7, 0.3)$ and Rainy $= (0.4,
          0.6)$. Starting Sunny, what is $p^{(2)}_{SR}$, the probability of
          Rainy two steps out, computed by summing over the midpoint state?
        expects: "0.39"
        hint: >
          Sum $p_{SS} p_{SR} + p_{SR} p_{RR}$ over the two possible midpoint
          states.
        feedback: >
          $p_{SS} p_{SR} + p_{SR} p_{RR} = 0.7 \times 0.3 + 0.3 \times 0.6 =
          0.21 + 0.18 = 0.39$.
      - teach: >
          That sum is, symbol for symbol, matrix multiplication, so $n$-step
          probabilities are nothing but entries of $P^{n}$, with $P^{0} = I$
          recording that zero steps leaves you exactly where you started.
      - ask: >
          For the same weather chain, what is $p^{(2)}_{SS}$, computed directly
          as an entry of $P^{2}$?
        expects: "0.61"
        hint: >
          Sum $p_{SS} p_{SS} + p_{SR} p_{RS}$.
        feedback: >
          $0.7 \times 0.7 + 0.3 \times 0.4 = 0.49 + 0.12 = 0.61$, and since row
          $S$ of $P^{2}$ must sum to $1$, this forces $p^{(2)}_{SR} = 0.39$ —
          matching the midpoint-sum computation exactly.
      - teach: >
          A useful corollary follows immediately: if $i$ can reach some $k$ in
          $m$ steps with positive probability, and $k$ can reach $j$ in $n$
          steps with positive probability, then $i$ can reach $j$ in $m+n$
          steps with positive probability.
      - ask: >
          Suppose $p^{(3)}_{ik} > 0$ and $p^{(2)}_{kj} > 0$ for some state $k$.
          What does this let you conclude about $p^{(5)}_{ij}$?
        choices:
          - text: >
              It equals $p^{(3)}_{ik} \times p^{(2)}_{kj}$ exactly
            feedback: >
              $p^{(5)}_{ij}$ is a sum over every possible midpoint state, not
              just $k$, so this term is only one contribution to it, not the
              whole value.
          - text: >
              It is positive
            correct: true
            feedback: >
              The midpoint sum $p^{(5)}_{ij} = \sum_l p^{(3)}_{il}
              p^{(2)}_{lj}$ has at least one positive term (from $l = k$), and
              every term is nonnegative, so the whole sum is positive.
          - text: >
              It is zero
            feedback: >
              A positive term inside a sum of nonnegative terms cannot leave
              the sum at zero.
        feedback: >
          Reachability composes as a positivity statement, via the sum having
          at least one positive term — not as an equality between
          $p^{(5)}_{ij}$ and any single path's probability.
      - teach: >
          Forgetting $P^{0} = I$ causes off-by-one errors on "$n$ steps from
          now" versus "after the $n$-th transition," and summing over the wrong
          index silently computes a transposed product instead of $P^{m+n}$.
      - teach: >
          $n$-step probabilities are entries of $P^{n}$ because matrix
          multiplication is exactly total probability applied at an
          intermediate time.

  - node: quant-processes.markov-chains.matrix-powers
    hook: >
      When a problem wants $P^n$ as a formula in $n$ rather than a number for
      one specific $n$, diagonalizing $P$ is the only route that doesn't mean
      multiplying matrices by hand $n$ times.
    explanation: >
      Writing $P=VDV^{-1}$ with $D$ diagonal turns $P^n=VD^nV^{-1}$ into
      something computable in closed form, because $D^n$ is just each
      diagonal eigenvalue raised to the $n$-th power. Every entry of $P^n$ is
      therefore a fixed linear combination of $\lambda_1^n,\dots,\lambda_m^n$,
      with the combination's coefficients coming from $V$ and $V^{-1}$ and
      not depending on $n$ at all.

      Every stochastic matrix carries $\lambda=1$ as an eigenvalue
      automatically — the all-ones vector is a right eigenvector, since every
      row sums to $1$ — and every eigenvalue satisfies $|\lambda|\le1$. That
      $\lambda=1$ term is the only one that doesn't decay, so it alone
      survives as $n\to\infty$ and produces the constant limiting behavior;
      every other term shrinks like $|\lambda_i|^n$.

      The mental model worth keeping: the second-largest eigenvalue in
      modulus, $\lambda_2$, sets the clock. A chain with $\lambda_2$ close to
      $0$ forgets its start almost immediately; one with $\lambda_2$ close to
      $1$ mixes slowly, and the deviation from equilibrium after $n$ steps is
      on the order of $|\lambda_2|^n$.
    worked: >
      For the market chain with rows $(0.6,0.4)$ and $(0.5,0.5)$, the
      characteristic equation $\lambda^2-1.1\lambda+0.1=0$ factors to give
      $\lambda=1$ and $\lambda=0.1$ — matching the two-state shortcut
      $1-a-b=1-0.4-0.5=0.1$. Writing $c=5/9$ for the constant $p^{(n)}_{UU}$
      settles to, the closed form $p^{(n)}_{UU}=c+(1-c)(0.1)^n$ gives, at
      $n=2$,
      $5/9+(4/9)(0.01)\approx0.556+0.004=0.560$ — matching the direct matrix
      product computed by hand, and showing the chain is already within
      $0.004$ of equilibrium after two steps because $\lambda_2=0.1$ is so
      small.
    interview: >
      "Find $P^n$ in closed form" wants eigenvalues and eigenvectors named,
      not a promise to multiply matrices repeatedly; a strong finish adds
      that the second eigenvalue controls how fast the chain settles, since
      that's usually the actual follow-up question.
    pitfalls: >
      Assuming $P^n$ converges for every stochastic $P$ ignores that a
      complex or negative $\lambda_2$ can make the approach oscillate rather
      than settle monotonically. Forgetting that $\lambda=1$ is guaranteed
      for every stochastic matrix wastes time hunting for it as if it might
      be absent.
    recap: >
      Diagonalizing $P$ turns $P^n$ into a combination of $\lambda^n$ terms,
      with the guaranteed eigenvalue $1$ giving the limit and the
      second-largest $|\lambda_2|$ setting the speed of approach.
    steps:
      - teach: >
          When a problem wants $P^{n}$ as a formula in $n$, not a number for
          one fixed $n$, diagonalizing $P$ is the route that avoids multiplying
          matrices by hand $n$ times.
      - teach: >
          Writing $P = VDV^{-1}$ with $D$ diagonal gives $P^{n} =
          VD^{n}V^{-1}$, so every entry of $P^{n}$ is a fixed linear
          combination of $\lambda_1^{n}, \dots, \lambda_m^{n}$ whose
          coefficients don't depend on $n$.
      - ask: >
          Which statement about the eigenvalues of any stochastic matrix $P$ is
          always true?
        choices:
          - text: >
              $\lambda = 1$ is always an eigenvalue, and every eigenvalue
              satisfies $|\lambda| \le 1$
            correct: true
            feedback: >
              The all-ones vector is a right eigenvector for $\lambda = 1$
              since every row sums to $1$, and no eigenvalue can exceed modulus
              $1$ for a stochastic matrix.
          - text: >
              All eigenvalues are strictly less than $1$
            feedback: >
              This directly contradicts the guaranteed eigenvalue $1$ that
              every stochastic matrix carries.
          - text: >
              The eigenvalues are always real and positive
            feedback: >
              Eigenvalues can be negative (producing an oscillating approach)
              or complex — only the modulus is bounded by $1$.
        feedback: >
          Every stochastic matrix has $\lambda = 1$ guaranteed and every
          eigenvalue satisfies $|\lambda| \le 1$; nothing else about sign or
          realness is guaranteed.
      - teach: >
          For a two-state chain with rows $(1-a, a)$ and $(b, 1-b)$, the
          eigenvalues are always $1$ and $1 - a - b$. The mental model: the
          second-largest eigenvalue $\lambda_2$ sets the clock for how fast the
          chain forgets its start.
      - ask: >
          A two-state chain has rows $(0.7, 0.3)$ and $(0.2, 0.8)$. What is the
          second eigenvalue $\lambda_2 = 1 - a - b$?
        expects: "0.5"
        hint: >
          Here $a = 0.3$ is the row-$1$ leaving probability and $b = 0.2$ is
          the row-$2$ leaving probability.
        feedback: >
          $1 - 0.3 - 0.2 = 0.5$.
      - ask: >
          Using $\lambda_2 = 0.5$, by roughly what factor has an initial
          deviation from equilibrium shrunk after $3$ steps?
        expects: "0.125"
        hint: >
          The deviation after $n$ steps scales like $|\lambda_2|^{n}$.
        feedback: >
          $0.5^{3} = 0.125$ — the chain is already within about an eighth of
          its starting deviation after just three steps.
      - teach: >
          A complex or negative $\lambda_2$ makes the approach to equilibrium
          oscillate rather than settle monotonically, and $\lambda = 1$ is
          guaranteed for every stochastic matrix — there's no need to hunt for
          it as if it might be absent.
      - teach: >
          Diagonalizing $P$ turns $P^{n}$ into a combination of $\lambda^{n}$
          terms, with the guaranteed eigenvalue $1$ giving the limit and
          $|\lambda_2|$ setting the speed of approach to it.

  - node: quant-processes.markov-chains.communicating-classes
    hook: >
      Before setting up any first-step equations, sort the states into
      classes — the whole shape of the problem, a single absorption
      computation versus a system to solve for equilibrium, follows from how
      many classes there are and which ones are closed.
    explanation: >
      Accessibility ($i\to j$ if some $p^{(n)}_{ij}>0$) is one-directional;
      communication requires it both ways, and communication is an
      equivalence relation — reflexive via $n=0$, symmetric by definition,
      transitive by the Chapman–Kolmogorov composition of positive-probability
      paths. That means the state space always splits cleanly into disjoint
      communicating classes, with no ambiguity about which class a state
      belongs to.

      A class is closed if no transition ever leaves it — once inside, the
      chain stays inside forever — and a closed class of size one, where
      $p_{ii}=1$, is an absorbing state. Irreducibility is the single-class
      case: every state reaches every other, so there's nothing to trap the
      chain permanently in a sub-region.

      This classification is the fork in the road for everything that
      follows in the unit: a chain with a closed proper subset, in
      particular any absorbing state, is never irreducible, and it's exactly
      these chains that support genuine absorption questions ("which class do
      we end up in?"). Irreducible chains, having nowhere to get trapped, are
      instead the setting for equilibrium questions ("where does the chain
      spend its time?").
    worked: >
      Take states $1,2,3,4,5$ with $1\to2$, $2\to1$, $2\to3$, $3\to3$, and
      $4\to5$, $5\to4$. States $1$ and $2$ communicate (each reaches the
      other directly) but the class $\{1,2\}$ isn't closed, since $2\to3$
      escapes it. State $3$ is absorbing, a closed class of size one. States
      $4$ and $5$ communicate and no transition leaves $\{4,5\}$, so it's a
      closed class. That's three communicating classes total, exactly one of
      them absorbing.
    interview: >
      "Is this chain irreducible?" or "identify the classes" is a setup
      question asked before the real one — the interviewer wants the classes
      named and each one flagged closed or not before any equation gets
      written.
    pitfalls: >
      Calling a class "closed" just because it looks self-contained without
      checking every outgoing transition misses classes that leak through a
      single low-probability edge. Treating one-directional accessibility
      ($i\to j$ but not $j\to i$) as communication merges states that don't
      actually belong in the same class.
    recap: >
      States split into communicating classes by mutual reachability; a
      chain with more than one class is never irreducible, and a closed
      class of size one is an absorbing state.
    steps:
      - teach: >
          Before writing any first-step equations, sort the states into classes
          — the whole shape of the problem, one absorption computation versus a
          system for equilibrium, follows from how many classes there are and
          which are closed.
      - teach: >
          Accessibility ($i \to j$ if some $p^{(n)}_{ij} > 0$) is
          one-directional; communication needs it both ways, and communication
          is an equivalence relation, so the state space always splits cleanly
          into disjoint communicating classes.
      - teach: >
          A class is closed if no transition ever leaves it, and a closed class
          of size one is an absorbing state. Irreducibility is the single-class
          case: every state reaches every other, with nowhere to get
          permanently trapped.
      - ask: >
          A chain has states $A, B, C, D, E, F$ with transitions $A \to B$, $B
          \to A$, $B \to C$, $C \to C$, and $D \to E$, $E \to F$, $F \to D$.
          How many communicating classes does this chain have in total?
        expects: "3"
        hint: >
          Find every pair of mutually-reachable states first, then count the
          resulting groups.
        feedback: >
          Three: $\{A, B\}$ (mutual, but not closed since $B \to C$ escapes
          it), $\{C\}$ (absorbing, a closed class of size one), and $\{D, E,
          F\}$ (a closed cycle, since no transition leaves it).
      - ask: >
          In that same chain, is $\{A, B\}$ a closed class?
        choices:
          - text: >
              Yes, because $A$ and $B$ communicate
            feedback: >
              Communicating is not the same as closed — closure requires that
              no outgoing transition leaves the set at all.
          - text: >
              No, because $B \to C$ leaves the set
            correct: true
            feedback: >
              Exactly: a single outgoing edge, from $B$ to $C$, is enough to
              make the class not closed, no matter how tightly $A$ and $B$
              communicate with each other.
          - text: >
              No, because $A$ and $B$ don't actually communicate
            feedback: >
              They do — $A \to B$ and $B \to A$ both hold directly, so this
              pair communicates by definition.
        feedback: >
          Checking closure means checking every outgoing transition from every
          state in the set, not just whether the states inside it communicate
          with each other.
      - teach: >
          This classification is the fork in the road for the rest of the unit:
          a chain with a closed proper subset, especially an absorbing state,
          supports genuine absorption questions, while an irreducible chain has
          nowhere to get trapped and is instead the setting for equilibrium
          questions.
      - ask: >
          A chain has at least one absorbing state. Can that chain be
          irreducible?
        choices:
          - text: >
              No
            correct: true
            feedback: >
              An absorbing state is a closed class of size one. Any closed
              class smaller than the whole state space is a second class, so
              the chain has more than one class and cannot be irreducible.
          - text: >
              Yes, as long as the absorbing state is reachable from every other
              state
            feedback: >
              Reachability into the absorbing state doesn't help — the
              absorbing state itself cannot reach anything else, which is
              exactly what blocks irreducibility.
        feedback: >
          An absorbing state is a closed class of size one, so it is always a
          second class alongside the rest of the chain — irreducible and "has
          an absorbing state" are mutually exclusive.
      - teach: >
          Calling a class "closed" without checking every outgoing transition
          misses classes that leak through a single low-probability edge, and
          treating one-directional accessibility as communication merges states
          that don't belong together.
      - teach: >
          States split into communicating classes by mutual reachability; a
          chain with more than one class is never irreducible, and a closed
          class of size one is an absorbing state.

  - node: quant-processes.markov-chains.classification
    hook: >
      "Is state $i$ recurrent?" sounds qualitative, but the interview wants
      the quantitative handle — $f_i=1$, or the divergence of
      $\sum_np^{(n)}_{ii}$ — not an intuition about whether the chain "tends
      to come back."
    explanation: >
      $f_i$ is the probability of ever returning to $i$ having started
      there. When $f_i=1$, the chain returns to $i$ with certainty, and by
      restarting the same argument at each return it returns infinitely
      often with probability $1$ — that's recurrence. When $f_i<1$, each
      visit independently has probability $f_i$ of being followed by
      another, so the total number of visits to $i$ is geometric with
      parameter $1-f_i$ and finite mean $1/(1-f_i)$ — that's transience, and
      it comes with a genuine number of expected visits rather than an
      all-or-nothing outcome.

      The equivalent series test, $i$ recurrent iff
      $\sum_{n\ge1}p^{(n)}_{ii}=\infty$, is often easier to check directly
      than computing $f_i$, since $p^{(n)}_{ii}$ is sometimes read off a
      chain's structure without solving any system.

      Recurrence, positive recurrence (finite mean return time, as opposed to
      null recurrence) and the period are all class properties: every state
      in a communicating class shares them, so classifying one
      representative state classifies the whole class. On a finite chain
      this collapses further — every closed class is positive recurrent
      automatically, and null recurrence, which needs an infinite state
      space to spread its mean return time to infinity, simply cannot occur.
    worked: >
      State $A$ transitions to itself with probability $0.4$ and to
      absorbing state $B$ with probability $0.6$. Returning to $A$ can only
      happen by staying there on the very first step (once you leave to $B$
      you're stuck forever), so $f_A=\Pr(X_1=A)=0.4<1$: $A$ is transient. The
      expected total number of visits to $A$, including the start, is
      $1/(1-f_A)=1/0.6=5/3\approx1.67$.
    interview: >
      "Is state $X$ recurrent or transient" in a chain with an obvious
      escape hatch (an absorbing state reachable from $X$) is answered by
      computing $f_X$ directly from the escape probability, not by invoking
      the series test, which is better suited to infinite chains like random
      walks.
    pitfalls: >
      Computing $f_i$ as the probability of returning on the very next step
      alone, rather than ever, undercounts it whenever multi-step return
      paths exist. Assuming positive recurrence automatically once you've
      shown $f_i=1$ ignores that null recurrence is a real possibility on an
      infinite state space.
    recap: >
      Recurrent means $f_i=1$ (infinitely many visits, certain); transient
      means $f_i<1$ (geometric visits, mean $1/(1-f_i)$); and recurrence,
      positive recurrence and period are shared by every state in a class.
    steps:
      - teach: >
          "Is state $i$ recurrent?" wants the quantitative handle $f_i = 1$, or
          the divergence of $\sum_n p^{(n)}_{ii}$, not an intuition about
          whether the chain "tends to come back."
      - teach: >
          $f_i$ is the probability of ever returning to $i$ having started
          there. When $f_i = 1$, the chain returns infinitely often with
          probability $1$ (recurrent); when $f_i < 1$, the number of visits is
          geometric with finite mean $1/(1-f_i)$ (transient).
      - teach: >
          The equivalent series test — $i$ is recurrent iff $\sum_{n \ge 1}
          p^{(n)}_{ii} = \infty$ — is often easier to check directly than
          computing $f_i$, especially on infinite state spaces like random
          walks.
      - ask: >
          State $X$ transitions to itself with probability $0.25$ and to an
          absorbing state $Y$ with probability $0.75$. What is $f_X$?
        expects: "0.25"
        hint: >
          Once the chain leaves to the absorbing state, it can never return to
          $X$.
        feedback: >
          The only way to return to $X$ is to stay there on the very first
          step, so $f_X = \Pr(\text{stay}) = 0.25 < 1$: $X$ is transient.
      - ask: >
          For that same state $X$, what is the expected total number of visits,
          including the starting visit?
        expects: "4/3"
        tolerance: 0.0005
        hint: >
          Use $1/(1-f_X)$.
        feedback: >
          $1/(1-0.25) = 1/0.75 = 4/3 \approx 1.333$.
      - teach: >
          Recurrence, positive recurrence, and period are all class properties,
          shared by every state in a communicating class. On a finite chain,
          every closed class is automatically positive recurrent, so null
          recurrence cannot occur at all.
      - ask: >
          On a finite chain, can a state be null recurrent?
        choices:
          - text: >
              No
            correct: true
            feedback: >
              Null recurrence needs an infinite state space to spread the mean
              return time out to infinity. Every closed class of a finite chain
              is automatically positive recurrent.
          - text: >
              Yes, as long as the chain has enough states
            feedback: >
              No finite number of states is enough — null recurrence is
              specifically an infinite-state-space phenomenon.
        feedback: >
          Finiteness alone rules out null recurrence: a closed class with
          finitely many states cannot have an infinite mean return time.
      - teach: >
          Computing $f_i$ as the probability of returning on the very next step
          alone, rather than ever, undercounts it whenever multi-step return
          paths exist — and $f_i = 1$ alone doesn't guarantee positive
          recurrence on an infinite state space.
      - teach: >
          Recurrent means $f_i = 1$; transient means $f_i < 1$ with mean
          $1/(1-f_i)$ visits; and recurrence, positive recurrence, and period
          are shared by every state in a class.

  - node: quant-processes.markov-chains.periodicity
    hook: >
      A chain with period $2$ is the specific trap behind "why doesn't $P^n$
      converge here" — recognizing bipartite structure on sight saves you
      from debugging a correct computation that simply doesn't have a limit.
    explanation: >
      The period $d(i)=\gcd\{n\ge1:p^{(n)}_{ii}>0\}$ measures the common
      divisor of every length of path that returns to $i$. Because period is
      a class property, an irreducible chain has one period shared by every
      state, and $d=1$ (aperiodic) is the case where $P^n$ can actually
      converge to a single limiting matrix.

      The two cheap tests worth having automatic: a self-loop anywhere
      ($p_{ii}>0$ for some $i$) forces $d=1$ immediately, since $1$ itself is
      then in the gcd set; and finding two return paths of coprime lengths
      through the same state (a $3$-cycle and a $4$-cycle sharing a vertex,
      say) does the same without needing a self-loop.

      Bipartite structure is the mechanism behind essentially every
      period-$2$ chain that shows up in interviews: split the states into two
      sides such that every transition crosses sides, and a return to your
      starting side is only possible after an even number of steps, so
      $d\ge2$. This is why a walk on any even cycle, or any bipartite graph,
      never settles into a fixed limiting distribution even though it may be
      perfectly irreducible.
    worked: >
      On the $4$-cycle $w$–$x$–$y$–$z$–$w$, stepping to a uniformly chosen
      neighbor each move: $p^{(1)}_{ww}=0$, since every neighbor of $w$ is
      $x$ or $z$, never $w$ itself. But
      $p^{(2)}_{ww}=\Pr(w\to x\to w)+\Pr(w\to z\to w)=0.25+0.25=0.5>0$. Every
      return to $w$ takes an even number of steps, so
      $d(w)=\gcd\{2,4,6,\dots\}=2$: the walk is irreducible yet periodic.
    interview: >
      "Does $P^n$ converge for this chain?" after a bipartite-looking graph
      or an even-length cycle wants period checked before anything else —
      the interviewer is testing whether you spot period $2$ rather than
      debugging non-convergent numerics.
    pitfalls: >
      Checking only $p_{ii}$ for a single small $n$ and declaring the state
      periodic misses that a self-loop elsewhere in the same class already
      forces aperiodicity for every state in it, including this one.
      Assuming irreducibility alone guarantees convergence overlooks
      periodicity as the second, independent condition that can still block
      it.
    recap: >
      Period is the gcd of return-path lengths; a self-loop or two coprime
      cycle lengths force aperiodicity, while bipartite structure — the case
      that keeps appearing — forces period $2$.
    steps:
      - teach: >
          A chain with period $2$ is the specific trap behind "why doesn't
          $P^{n}$ converge here" — recognizing bipartite structure on sight
          saves you from debugging a correct computation that simply has no
          limit.
      - teach: >
          The period $d(i) = \gcd\{n \ge 1 : p^{(n)}_{ii} > 0\}$ measures the
          common divisor of every return-path length to $i$. Since period is a
          class property, an irreducible chain has one period shared by every
          state, and $d = 1$ is the aperiodic case where $P^{n}$ can actually
          converge.
      - teach: >
          Two cheap tests: a self-loop anywhere forces $d = 1$ immediately,
          since $1$ itself joins the gcd set; and two return paths of coprime
          lengths through the same state do the same without any self-loop.
      - ask: >
          A state $i$ in an irreducible chain has $p_{ii} = 0.3 > 0$. What is
          the period $d(i)$?
        expects: "1"
        hint: >
          A self-loop is a return path of length $1$.
        feedback: >
          A return of length $1$ puts $1$ in the gcd set, and $\gcd$ of any set
          containing $1$ is $1$ — so $d(i) = 1$, and since period is a class
          property this forces the whole class aperiodic.
      - ask: >
          A state lies on both a length-$3$ and a length-$4$ return path, with
          no shorter return possible. What is its period?
        expects: "1"
        hint: >
          Compute $\gcd(3, 4)$.
        feedback: >
          $\gcd(3, 4) = 1$, since consecutive integers share no common factor
          larger than $1$.
      - teach: >
          Bipartite structure is the mechanism behind essentially every
          period-$2$ chain in interviews: split states into two sides so every
          transition crosses sides, and a return to your starting side is only
          possible after an even number of steps.
      - ask: >
          A random walk on a hexagon (a $6$-cycle) steps to a uniformly chosen
          neighbor each move. What is the period of every state?
        choices:
          - text: >
              $1$
            feedback: >
              That would need a self-loop or an odd return path somewhere, and
              a pure even cycle has neither.
          - text: >
              $2$
            correct: true
            feedback: >
              From any vertex, two neighbors both lead back in exactly $2$
              steps (there-and-back along either edge), and every return takes
              an even number of steps, so $d = \gcd\{2, 4, 6, \dots\} = 2$.
          - text: >
              $6$
            feedback: >
              That's the cycle length, not the gcd of all possible return
              lengths — a $2$-step return already exists, well short of going
              all the way around.
        feedback: >
          Every even cycle gives period $2$: the bipartition forces every
          return to take an even number of steps, and $2$-step returns already
          exist.
      - teach: >
          Checking only $p_{ii}$ for one small $n$ and declaring a state
          periodic misses that a self-loop elsewhere in the same class already
          forces aperiodicity for the whole class, this state included.
          Irreducibility alone doesn't guarantee convergence — periodicity is a
          separate condition.
      - teach: >
          Period is the gcd of return-path lengths; a self-loop or two coprime
          cycle lengths force aperiodicity, while bipartite structure forces
          period $2$.

  - node: quant-processes.markov-chains.absorption
    hook: >
      "Which absorbing state does this end in?" is answered by one linear
      equation per transient state, not by simulating or by summing an
      infinite series of paths.
    explanation: >
      Fix the target absorbing state $a$ and define
      $h_i=\Pr(\text{absorbed at }a\mid X_0=i)$ for every state $i$.
      Conditioning on the very next step — first-step analysis — expresses
      $h_i$ in terms of its immediate neighbors' own $h$-values:
      $h_i=\sum_jp_{ij}h_j$. The boundary values are known outright: $h_a=1$,
      and $h_b=0$ at every other absorbing state, since once absorbed
      there's no escaping.

      On a finite chain where every transient state can actually reach
      absorption, this system has a unique solution and absorption happens
      with probability $1$ — the transient states earn their name honestly.
      On an infinite state space that guarantee can fail, and the
      probabilistically meaningful solution is the minimal nonnegative one,
      not just any solution to the linear equations.

      The practical recipe: one unknown per transient state, exploit every
      symmetry in the problem to merge unknowns before solving (a symmetric
      problem often needs far fewer equations than states), then solve by
      substitution or elimination.
    worked: >
      A counter starts on $\{0,1,2,3\}$, absorbing at $0$ and $3$; from $1$
      it moves to $0$ or $2$ with probability $0.5$ each, and from $2$ it
      moves to $1$ or $3$ with probability $0.5$ each. With
      $h_i=\Pr(\text{absorbed at }3\mid X_0=i)$: $h_1=0.5h_0+0.5h_2=0.5h_2$,
      and $h_2=0.5h_1+0.5h_3=0.5h_1+0.5$. Substituting,
      $h_1=0.5(0.5h_1+0.5)=0.25h_1+0.25$, so $h_1=1/3$ and $h_2=2/3$.
    interview: >
      "What's the probability this process ends up at $A$ rather than $B$?"
      is first-step analysis every time; the interviewer listens for the
      boundary conditions stated explicitly ($h=1$ at the target, $0$ at
      every other absorbing state) before the system gets solved.
    pitfalls: >
      Forgetting to set $h=0$ at every other absorbing state, not just the
      ones that seem relevant, leaves the system under-determined. Solving
      for $h_i$ without first confirming every transient state can actually
      reach some absorbing state risks trusting a system whose real-world
      answer is only a probability, not a certainty.
    recap: >
      One equation $h_i=\sum_jp_{ij}h_j$ per transient state, with $h=1$ at
      the target absorbing state and $h=0$ at every other, solved as
      ordinary linear algebra.
    steps:
      - teach: >
          "Which absorbing state does this end in?" is answered by one linear
          equation per transient state, obtained by conditioning on the very
          next step — not by simulating or summing an infinite series of paths.
      - teach: >
          Fix the target absorbing state $a$ and set $h_i = \Pr(\text{absorbed
          at } a \mid X_0 = i)$. First-step analysis gives $h_i = \sum_j p_{ij}
          h_j$, with $h_a = 1$ and $h_b = 0$ at every other absorbing state.
      - teach: >
          On a finite chain where every transient state can reach absorption,
          this system has a unique solution. The practical recipe: one unknown
          per transient state, merged using every symmetry available, then
          solved by substitution.
      - ask: >
          A counter on $\{0, 1, 2, 3\}$ absorbs at $0$ and $3$. From $1$ it
          moves to $0$ or $2$, each with probability $0.5$; from $2$ it moves
          to $1$ with probability $0.25$ and to $3$ with probability $0.75$.
          What boundary values must $h_i = \Pr(\text{absorbed at } 3 \mid X_0 =
          i)$ satisfy?
        choices:
          - text: >
              $h_0 = 0$ and $h_3 = 1$
            correct: true
            feedback: >
              Right: $h$ equals $1$ at the target absorbing state and $0$ at
              every other absorbing state, since once absorbed there's no
              escaping.
          - text: >
              $h_0 = 1$ and $h_3 = 0$
            feedback: >
              This is reversed — the target absorbing state gets $h = 1$, and
              $3$ is the target here, not $0$.
          - text: >
              $h_0 = h_3 = 0.5$
            feedback: >
              Absorbing states have deterministic outcomes once reached, not a
              coin-flip probability.
        feedback: >
          $h_0 = 0$ and $h_3 = 1$ are the boundary values; the two transient
          states $1$ and $2$ are what the linear system actually solves for.
      - ask: >
          Using that same setup, what is $h_1$?
        expects: "3/7"
        tolerance: 0.0005
        hint: >
          Write $h_1 = 0.5 h_2$ and $h_2 = 0.25 h_1 + 0.75$, then substitute.
        feedback: >
          $h_1 = 0.5 h_2$ and $h_2 = 0.25 h_1 + 0.75$, so $h_1 = 0.5(0.25 h_1 +
          0.75) = 0.125 h_1 + 0.375$, giving $h_1 = 0.375 / 0.875 = 3/7 \approx
          0.429$.
      - ask: >
          What is $h_2$?
        expects: "6/7"
        tolerance: 0.0005
        hint: >
          Use $h_2 = 2 h_1$, which follows from $h_1 = 0.5 h_2$.
        feedback: >
          $h_1 = 0.5 h_2$ gives $h_2 = 2 h_1 = 2 \times 3/7 = 6/7 \approx
          0.857$.
      - teach: >
          Forgetting to set $h = 0$ at every other absorbing state, not just
          the ones that seem relevant, leaves the system under-determined — and
          it's worth confirming every transient state can actually reach
          absorption before trusting the answer as a genuine probability.
      - teach: >
          One equation $h_i = \sum_j p_{ij} h_j$ per transient state, with $h =
          1$ at the target and $h = 0$ at every other absorbing state, solved
          as ordinary linear algebra.

  - node: quant-processes.markov-chains.tennis-deuce
    hook: >
      Deuce looks like it could spiral into an infinite rally of
      advantage-back-to-deuce swings, but first-step analysis collapses it to
      three unknowns precisely because the chain restarts at $D$ every time
      the score returns there.
    explanation: >
      The five raw states $D,A,B,W,L$ hide a huge amount of repeated
      structure: every trip through $A$ or $B$ that doesn't end the game
      lands back at $D$, so the chain's memory never extends further than
      "who currently has advantage." That's what licenses treating
      $h=\Pr(\text{win}\mid D)$ as a single unknown rather than tracking how
      many times the score has oscillated.

      The algebra is standard first-step analysis applied twice — once from
      $D$ using $h_A,h_B$, and once from $A,B$ back in terms of $h$ itself —
      and substituting collapses everything to $h=p^2+2pq\,h$, a single
      equation in one unknown. The $p^2$ term is the direct route (win the
      next two points outright from deuce), and $2pq\,h$ is the fact that
      any single split of the next two points returns exactly to deuce, at
      which point the problem is identical to the original one — restart,
      not partial progress.

      The resulting formula $h=p^2/(p^2+q^2)$ is worth reading as a ratio of
      two rates rather than memorizing: winning from deuce is a race between
      reaching a two-point lead as one side versus the other, and squaring
      both probabilities is what a race between two geometric-style margins
      produces.
    worked: >
      At $p=0.55$ (a modest edge), $q=0.45$, so
      $h=p^2/(p^2+q^2)=0.3025/(0.3025+0.2025)=0.3025/0.505=121/202\approx
      0.599$. A $55\%$ point-winner converts deuce only about $60\%$ of the
      time — far closer to even than the $69\%$ a $60\%$ server gets,
      showing how sharply this probability responds to the per-point edge.
    interview: >
      "From deuce, what's the probability of winning the game?" wants the
      three-state reduction stated explicitly (advantage states feed back to
      $D$, so no infinite case analysis is needed) before the formula
      appears; a good answer also notes the amplification — a small
      per-point edge becomes a much larger game-winning edge.
    pitfalls: >
      Trying to sum an infinite series over every possible number of
      $D$-to-$D$ oscillations instead of writing the self-referential
      equation wastes time solving a problem that first-step analysis avoids
      entirely. Reporting $h=p^2$ alone, forgetting the $2pq\,h$ term for the
      case where the score returns to deuce, drops most of the probability
      mass.
    recap: >
      Deuce reduces to $h=p^2+2pq\,h$, giving $h=p^2/(p^2+q^2)$ — about
      $60\%$ at $p=0.55$, and $69\%$ at $p=0.6$.
    steps:
      - teach: >
          Deuce looks like it could spiral into an infinite rally of
          advantage-back-to- deuce swings, but first-step analysis collapses it
          to three unknowns because every un-ended trip through advantage lands
          back at exactly the same state, $D$.
      - teach: >
          Writing $h = \Pr(\text{win} \mid D)$ and applying first-step analysis
          twice — once from $D$, once from the advantage states — collapses to
          a single self-referential equation: $h = p^{2} + 2pq\,h$.
      - ask: >
          Why does the equation use $2pq\,h$ rather than treating "the position
          after one split of the next two points" as a brand-new unknown?
        choices:
          - text: >
              Because any split of the next two points returns exactly to
              deuce, and from there the problem is identical to the original
              one, so it's again $h$
            correct: true
            feedback: >
              Exactly — the position after such a split has no memory of how
              many times this has already happened, so its win probability is
              the same $h$ you started with.
          - text: >
              Because $2pq$ is the probability of losing outright
            feedback: >
              $2pq$ is the probability of a split that returns to deuce, not
              the probability of losing — losing outright is the separate term
              $q^{2}$, which doesn't appear here since it contributes $0$ to
              $h$.
          - text: >
              Because deuce can only be revisited a bounded number of times
            feedback: >
              Deuce can recur indefinitely — the self-referential equation is
              exactly what lets you avoid tracking how many times, rather than
              assuming a bound.
        feedback: >
          A split returning to deuce is a genuine restart of the identical
          problem, which is what licenses writing $h$ again on the right-hand
          side instead of a fresh unknown.
      - teach: >
          Solving $h = p^{2} + 2pq\,h$ gives the closed form $h =
          p^{2}/(p^{2}+q^{2})$ — a ratio of two rates, worth reading rather
          than memorizing: winning from deuce is a race between reaching a
          two-point lead as one side versus the other.
      - ask: >
          At $p = 0.65$, what is $h$, the probability of winning from deuce?
        expects: "169/218"
        tolerance: 0.0005
        hint: >
          Compute $p^{2}$ and $q^{2}$ with $q = 0.35$, then form
          $p^{2}/(p^{2}+q^{2})$.
        feedback: >
          $p^{2} = 0.4225$, $q^{2} = 0.1225$, so $h = 0.4225/0.545 = 169/218
          \approx 0.775$. A $65\%$ point-winner converts deuce almost $78\%$ of
          the time.
      - ask: >
          As a sanity check, what does the formula give for $h$ at a perfectly
          fair game, $p = q = 0.5$?
        expects: "0.5"
        hint: >
          Compute $p^{2}/(p^{2}+q^{2})$ with $p = q = 0.5$.
        feedback: >
          $0.25/(0.25+0.25) = 0.5$ — with no per-point edge, deuce is a coin
          flip, exactly as it should be.
      - teach: >
          Trying to sum an infinite series over every possible number of
          oscillations wastes time the self-referential equation avoids
          entirely, and reporting $h = p^{2}$ alone — forgetting the $2pq\,h$
          term — drops most of the probability mass.
      - teach: >
          Deuce reduces to $h = p^{2} + 2pq\,h$, giving $h =
          p^{2}/(p^{2}+q^{2})$ — about $78\%$ at $p = 0.65$, and $60\%$ at $p =
          0.55$.

  - node: quant-processes.markov-chains.absorption-time
    hook: >
      Every first-step expectation equation needs a $+1$ that the
      corresponding probability equation doesn't — forgetting it is the
      single most common way to turn a correct absorption-probability setup
      into a wrong expected-time one.
    explanation: >
      With $k_i$ the expected number of steps to absorption from $i$,
      conditioning on the next step costs exactly one unit of time no matter
      where that step lands: $k_i=1+\sum_{j\text{ transient}}p_{ij}k_j$.
      Absorbing states carry $k_a=0$ and drop out of every sum that reaches
      them, since no more steps get taken once absorbed.

      The matrix form is worth having as a check: writing $Q$ for the
      sub-stochastic block of $P$ restricted to transient states,
      $k=(I-Q)^{-1}\mathbf{1}$. The fundamental matrix $(I-Q)^{-1}$ is not
      just an algebraic convenience — its $(i,j)$ entry is the expected
      number of visits to transient state $j$ before absorption, starting
      from $i$, so summing a row gives exactly $k_i$.

      The structural resemblance to the absorption-probability equations is
      deliberate and worth naming out loud: same states, same transition
      coefficients, only the constant term and the boundary values change.
      Setting up both systems together, side by side, catches sign and
      boundary errors that are easy to miss doing them separately.
    worked: >
      A counter on $\{0,1,2,3\}$, absorbing at $0$ and $3$, moving to each
      neighbor with probability $0.5$: $k_1=1+0.5k_0+0.5k_2=1+0.5k_2$ and
      $k_2=1+0.5k_1+0.5k_3=1+0.5k_1$. Substituting,
      $k_1=1+0.5(1+0.5k_1)=1.5+0.25k_1$, so $k_1=2$, and then
      $k_2=1+0.5(2)=2$ as well — by the position's left-right symmetry, both
      interior states take $2$ steps on average to reach a boundary.
    interview: >
      "What's the expected number of steps until this process ends?" is the
      same first-step machinery as the absorption-probability question,
      distinguished only by the additive $1$; the interviewer is
      specifically listening for that $+1$ being justified as "this step
      costs one unit of time regardless of outcome," not just appearing by
      rote.
    pitfalls: >
      Dropping the $+1$ collapses the equation to the probability-style form
      and produces a number with the wrong units. Including absorbing states
      in the sum $\sum_jp_{ij}k_j$ as if they contributed further expected
      steps double-counts time that was never actually spent.
    recap: >
      $k_i=1+\sum_jp_{ij}k_j$ for transient $i$, with $k=0$ at absorption —
      the same system as for absorption probabilities, plus the $+1$ that
      accounts for the step just taken.
    steps:
      - teach: >
          Every first-step expectation equation needs a $+1$ that the
          corresponding probability equation doesn't. Forgetting it is the
          single most common way to turn a correct absorption-probability setup
          into a wrong expected-time one.
      - teach: >
          With $k_i$ the expected steps to absorption from $i$, conditioning on
          the next step costs exactly one unit of time regardless of where it
          lands: $k_i = 1 + \sum_{j \text{ transient}} p_{ij} k_j$, with $k_a =
          0$ at every absorbing state.
      - teach: >
          The resemblance to the absorption-probability system is deliberate:
          same states, same transition coefficients — only the constant term
          and the boundary values change.
      - ask: >
          Which change turns the absorption-probability system for a chain into
          its absorption-time system?
        choices:
          - text: >
              Replace the boundary values $h_a = 1, h_b = 0$ with $k_a = 0$ at
              every absorbing state, and add $+1$ to the right side of each
              equation
            correct: true
            feedback: >
              Right — the coefficients $p_{ij}$ stay exactly the same; only the
              constant term and the boundary values differ.
          - text: >
              Multiply every transition probability by the number of steps
            feedback: >
              The transition probabilities themselves are untouched — only the
              constant term added on the right side changes.
          - text: >
              Nothing changes; the same numbers answer both questions
            feedback: >
              The two questions have different units entirely — a probability
              between $0$ and $1$ versus an expected count of steps — so the
              same numbers can't answer both.
        feedback: >
          Same coefficients, different constant and boundary values: $+1$ on
          the right for the cost of the step just taken, and $k = 0$, not $1$,
          at every absorbing state.
      - ask: >
          A fair walk on $\{0, 1, 2, 3, 4\}$ absorbs at $0$ and $4$, moving to
          each neighbor with probability $0.5$. What is $k_1$, the expected
          number of steps to absorption starting from $1$?
        expects: "3"
        hint: >
          By symmetry $k_1 = k_3$; write $k_1 = 1 + 0.5 k_2$ and $k_2 = 1 +
          k_1$.
        feedback: >
          By symmetry $k_1 = k_3 = x$ and $k_2 = y$. Then $x = 1 + 0.5y$ and $y
          = 1 + x$. Substituting, $x = 1 + 0.5(1+x) = 1.5 + 0.5x$, so $x = 3$.
      - ask: >
          What is $k_2$?
        expects: "4"
        hint: >
          Use $k_2 = 1 + k_1$ with $k_1 = 3$.
        feedback: >
          $k_2 = 1 + k_1 = 1 + 3 = 4$.
      - teach: >
          Dropping the $+1$ collapses the equation to the probability-style
          form and produces a number with the wrong units, and including
          absorbing states in the sum $\sum_j p_{ij} k_j$ double-counts time
          that was never spent.
      - teach: >
          $k_i = 1 + \sum_j p_{ij} k_j$ for transient $i$, with $k = 0$ at
          absorption — the same system as for absorption probabilities, plus
          the $+1$ for the step just taken.

  - node: quant-processes.markov-chains.mouse-maze
    hook: >
      This is absorption-time technique applied to a maze with a genuine
      dead end, and the dead end is exactly what should make you expect a
      larger answer than a naive average of the room count.
    explanation: >
      The setup habit that matters here is translating "the mouse picks
      uniformly among the doors of its current room" into the right
      transition probabilities per room — a room with two doors contributes
      $\tfrac12$ to each neighbor, one with three contributes $\tfrac13$
      each, and a dead end sends the mouse back the way it came with
      probability $1$, which still counts as a full step.

      Back-substitution is the efficient solving order once the equations
      are written: express the room closest to being fully determined (often
      the dead end, since it only depends on one other room) in terms of the
      others, then substitute inward until only one unknown survives.

      The dead end's cost is worth internalizing as a pattern, not just a
      number for this maze: every visit there is a wasted round trip, one
      step in and one step back with nothing gained, so a maze with a dead
      end always has a strictly larger expected escape time than the same
      maze with that dead end replaced by a direct path.
    worked: >
      Rooms $X,Y,Z,\text{Exit}$: three doors leave $X$ (to $Y$, $Z$, Exit,
      each $1/3$); two doors leave $Y$ (to $X$, Exit, each $1/2$); $Z$ is a
      dead end, single door back to $X$. Then $k_Y=1+\tfrac12k_X$,
      $k_Z=1+k_X$, and $k_X=1+\tfrac13k_Y+\tfrac13k_Z$. Substituting,
      $k_X=1+\tfrac13(1+\tfrac12k_X)+\tfrac13(1+k_X)=\tfrac53+\tfrac12k_X$,
      so $k_X=10/3\approx3.33$. Then $k_Y=1+\tfrac12(10/3)=8/3\approx2.67$
      and $k_Z=1+10/3=13/3\approx4.33$.
    interview: >
      "A mouse (or a random surfer, or a particle) wanders a maze with a
      dead end — expected time to exit?" wants the per-room transition
      probabilities read directly off the door count, then back-substitution
      starting from whichever room has the fewest unknowns feeding into it.
    pitfalls: >
      Giving the dead end the same door-count treatment as a normal room
      (splitting probability across multiple exits) rather than sending it
      back with probability $1$ misstates its entire contribution. Solving
      the system in an arbitrary order instead of starting from the room
      nearest to being fully expressed in one other unknown makes the algebra
      needlessly tangled.
    recap: >
      One first-step equation per room, with a dead end contributing
      $k=1+k_{\text{previous}}$ — here $10/3$, $8/3$, and $13/3$ steps from
      $X$, $Y$, $Z$ respectively.
    steps:
      - teach: >
          This is absorption-time technique applied to a maze with a genuine
          dead end, and the dead end should make you expect a larger answer
          than a naive average of the room count.
      - teach: >
          Translate "uniformly among the doors of the current room" directly
          into transition probabilities per room, and treat a dead end as a
          room whose single door sends the mouse back the way it came with
          probability $1$ — still a full step.
      - teach: >
          Back-substitution is the efficient solving order: express the room
          closest to being fully determined — often a dead end, since it
          depends on only one other room — in terms of the others, then
          substitute inward.
      - ask: >
          A maze has room $A$ with four doors — to $B$, to $C$, to $D$, and to
          the exit, each with probability $1/4$. Room $D$ has two doors, back
          to $A$ and to the exit, each with probability $1/2$. Rooms $B$ and
          $C$ are both dead ends whose single door returns to $A$. What is
          $k_A$, the expected number of minutes to exit starting from $A$?
        expects: "14/3"
        tolerance: 0.0005
        hint: >
          Write $k_B = k_C = 1 + k_A$ and $k_D = 1 + 0.5 k_A$, then substitute
          all three into $k_A$'s own equation.
        feedback: >
          $k_A = 1 + \tfrac14 k_B + \tfrac14 k_C + \tfrac14 k_D$ with $k_B =
          k_C = 1+k_A$ and $k_D = 1+0.5k_A$ gives $k_A = 1 + \tfrac34(1+k_A) +
          \tfrac14(1+0.5k_A) = \tfrac74 + \tfrac58 k_A$, so $k_A = 14/3 \approx
          4.667$.
      - ask: >
          What is $k_B$, starting from the dead end $B$?
        expects: "17/3"
        tolerance: 0.0005
        hint: >
          Use $k_B = 1 + k_A$ with $k_A = 14/3$.
        feedback: >
          $k_B = 1 + 14/3 = 17/3 \approx 5.667$ — one full wasted round trip on
          top of $k_A$, exactly the dead-end cost.
      - ask: >
          What is $k_D$, starting from the two-door room $D$?
        expects: "10/3"
        tolerance: 0.0005
        hint: >
          Use $k_D = 1 + 0.5 k_A$ with $k_A = 14/3$.
        feedback: >
          $k_D = 1 + 0.5 \times 14/3 = 1 + 7/3 = 10/3 \approx 3.333$ — the
          smallest of the three, since $D$ reaches the exit directly half the
          time.
      - teach: >
          Every visit to a dead end is a wasted round trip — one step in, one
          step back, with nothing gained — so a maze with a dead end always
          takes strictly longer to escape than the same maze with that dead end
          replaced by a direct path.
      - teach: >
          Giving a dead end the same multi-exit treatment as a normal room
          misstates its whole contribution, and solving the system in an
          arbitrary order instead of starting from the most-determined room
          makes the algebra needlessly tangled.
      - teach: >
          One first-step equation per room, with a dead end contributing $k = 1
          + k_{\text{previous}}$ — here $14/3$, $17/3$, and $10/3$ minutes from
          $A$, $B$, and $D$ respectively.

  - node: quant-processes.markov-chains.drunkard-path
    hook: >
      Before reaching for the gambler's-ruin formulas, this is the check
      worth doing first: confirm the chain actually has the absorbing
      structure those formulas assume, because the same first-step system
      looks completely different on a chain that never gets absorbed.
    explanation: >
      Reading the two-barrier walk as a Markov chain rather than just a
      random-walk picture exposes its class structure directly: $\{0\}$ and
      $\{N\}$ are each closed classes of size one (absorbing), and
      $\{1,\dots,N-1\}$ is the one remaining class, which is not closed since
      every interior state has some chance of stepping to a barrier
      eventually.

      Certainty of absorption follows from a simple bound, not from solving
      anything: from any interior state, there's a path of length at most
      $N$ that walks straight to a barrier in one direction, and that
      specific path has some fixed positive probability ($p^{N}$ or $q^{N}$
      depending on direction). A positive lower bound on the escape
      probability within a bounded number of steps, repeated over and over,
      forces the probability of never being absorbed down to $0$.

      That's the entire contribution of this example: it identifies which
      chain-theory facts (finite absorbing structure, certain absorption)
      apply before any formula is written. The actual closed forms for the
      hitting probability and the expected duration are the gambler's-ruin
      recursions, solved elsewhere — reading this chain correctly is what
      tells you those formulas are the right tool to reach for.
    worked: >
      On $\{0,\dots,6\}$ with $p=q=0.5$, starting at the middle state $3$:
      the distance to the nearest barrier is $3$ steps. Three consecutive
      up-steps reach $6$ with probability $(0.5)^3=1/8$, and three
      consecutive down-steps reach $0$ with probability $1/8$ as well; these
      are disjoint events, so
      $\Pr(\text{absorbed within 3 steps}\mid X_0=3)\ge1/8+1/8=1/4$. That's
      already a concrete, nonzero floor on absorption within a short, fixed
      horizon — the full certainty argument just repeats this at every later
      opportunity.
    interview: >
      "Model this as a Markov chain" after a random-walk-with-boundaries
      setup wants the class structure named first — two absorbing
      singletons, one transient interior class — before any ruin formula
      gets quoted; naming the structure is what shows you understand why
      absorption is certain, not just that it is.
    pitfalls: >
      Quoting the gambler's-ruin closed forms without first checking that
      both boundaries are actually absorbing (rather than, say, reflecting)
      applies the wrong formula to a chain that isn't the one those formulas
      describe. Treating "the walk is recurrent" and "absorption is certain"
      as needing separate proofs misses that here they're the same fact.
    recap: >
      The two-barrier walk is one transient class between two absorbing
      singletons, with certain absorption guaranteed by a positive-probability
      straight-line path to a barrier — the ruin formulas belong to a
      different unit.
    steps:
      - teach: >
          Before reaching for gambler's-ruin formulas, confirm the chain
          actually has the absorbing structure those formulas assume — the same
          first-step system looks completely different on a chain that never
          gets absorbed.
      - teach: >
          Reading the two-barrier walk as a Markov chain exposes its class
          structure directly: $\{0\}$ and $\{N\}$ are each closed classes of
          size one, and $\{1, \dots, N-1\}$ is the one remaining class, not
          closed since every interior state can eventually reach a barrier.
      - teach: >
          Certainty of absorption follows from a bound, not from solving
          anything: any interior state has a path of length at most $N$
          straight to a barrier, with some fixed positive probability.
          Repeating that positive floor forces the probability of never being
          absorbed down to $0$.
      - ask: >
          On $\{0, \dots, 6\}$ with $p = 0.6$, $q = 0.4$, starting at the
          middle state $3$: what is a floor on $\Pr(\text{absorbed within 3
          steps} \mid X_0 = 3)$, using only the two straight-line paths to a
          barrier?
        expects: "0.28"
        hint: >
          Three consecutive up-steps reach $6$; three consecutive down-steps
          reach $0$. These are disjoint events.
        feedback: >
          $p^{3} + q^{3} = 0.6^{3} + 0.4^{3} = 0.216 + 0.064 = 0.28$.
      - ask: >
          What does a bound like this one actually establish?
        choices:
          - text: >
              A concrete lower bound on the probability of absorption within
              that many steps, whose repetition forces eventual absorption to
              be certain
            correct: true
            feedback: >
              Right — it's a floor on a bounded horizon, and repeating that
              same positive floor at every later opportunity is what drives the
              never-absorbed probability to $0$.
          - text: >
              The exact total probability of ever being absorbed
            feedback: >
              The certainty argument needs this floor repeated infinitely
              often, not a single bounded-horizon computation, to conclude
              absorption is certain overall.
          - text: >
              Nothing about absorption timing, only about class structure
            feedback: >
              This dismisses the actual numeric content — the bound is
              specifically a probability of absorption within a fixed number of
              steps.
        feedback: >
          It's a lower bound on absorption within a bounded horizon; certainty
          of eventual absorption comes from repeating that same positive floor
          over and over.
      - ask: >
          How many communicating classes does this chain have in total?
        expects: "3"
        hint: >
          Count the two absorbing singletons plus the one transient interior
          class.
        feedback: >
          Three: $\{0\}$, $\{N\}$, and the transient interior class $\{1,
          \dots, N-1\}$.
      - teach: >
          Quoting gambler's-ruin closed forms without first checking that both
          boundaries are actually absorbing — rather than, say, reflecting —
          applies the wrong formula to a chain that isn't the one those
          formulas describe.
      - teach: >
          The two-barrier walk is one transient class between two absorbing
          singletons, with certain absorption guaranteed by a
          positive-probability straight-line path to a barrier — the ruin
          formulas themselves belong to a different unit.

  - node: quant-processes.markov-chains.stationary
    hook: >
      "What fraction of the time is the chain in state $j$, eventually?" is
      answered by solving $\pi P=\pi$ — a linear system, not a limit
      computed by brute-force iteration.
    explanation: >
      A stationary distribution is a probability vector left unchanged by
      one step of the chain: $\pi P=\pi$, equivalently
      $\pi_j=\sum_i\pi_ip_{ij}$ for every $j$. Starting the chain from $\pi$
      makes every $X_n$ have the exact same law $\pi$ — stationarity is a
      property of the whole trajectory's law, not just a fixed point of one
      equation.

      Because $\pi P=\pi$ says $\pi$ is a left eigenvector of $P$ for
      eigenvalue $1$, and every stochastic matrix has $1$ as an eigenvalue,
      existence of some solution is automatic in the finite case; what needs
      care is normalization and uniqueness. In practice the $m$ balance
      equations are always linearly dependent (they sum to a trivial
      identity), so solve any $m-1$ of them together with $\sum_i\pi_i=1$
      for the remaining constraint.

      For a chain that's both irreducible and aperiodic, $\pi$ is more than
      just an algebraic fixed point — it's the actual limiting law,
      $(P^n)_{ij}\to\pi_j$ regardless of where the chain started. Without
      those two hypotheses $\pi$ can fail to exist at all, or fail to be
      unique.
    worked: >
      A machine is Up or Down. From Up it stays Up with probability $0.7$
      and drops to Down with probability $0.3$; from Down it recovers to Up
      with probability $0.4$ and stays Down with probability $0.6$. Balance
      gives $\pi_U\cdot0.3=\pi_D\cdot0.4$, so $\pi_U=\tfrac43\pi_D$; with
      $\pi_U+\pi_D=1$, $\tfrac73\pi_D=1$, so $\pi_D=3/7$ and
      $\pi_U=4/7\approx0.571$.
    interview: >
      "In the long run, what fraction of the time is the chain in state $X$?"
      is solved by writing the balance equations and the normalization
      together, then solving the linear system directly — not by iterating
      $P^n$ for a large $n$ and reading off an approximate answer.
    pitfalls: >
      Using all $m$ balance equations plus normalization over-determines the
      system, since the balance equations are always linearly dependent —
      drop exactly one before adding normalization. Solving for $\pi$ on a
      chain that isn't irreducible without checking uniqueness first can
      produce a technically-correct stationary vector that isn't the one the
      problem actually wants.
    recap: >
      $\pi P=\pi$ defines the law the chain leaves unchanged; solve $m-1$
      balance equations plus normalization, and for an irreducible aperiodic
      chain that same $\pi$ is also the limit from any start.
    steps:
      - teach: >
          "What fraction of the time is the chain in state $j$, eventually?" is
          answered by solving $\pi P = \pi$ — a linear system, not a limit
          computed by brute-force iteration.
      - teach: >
          A stationary distribution is a probability vector left unchanged by
          one step of the chain: $\pi P = \pi$, equivalently $\pi_j = \sum_i
          \pi_i p_{ij}$ for every $j$. Starting the chain from $\pi$ makes
          every $X_n$ have that exact same law.
      - teach: >
          The $m$ balance equations are always linearly dependent, so solve any
          $m-1$ of them together with $\sum_i \pi_i = 1$. When the chain is
          irreducible and aperiodic, that same $\pi$ is also the actual
          limiting law.
      - ask: >
          For an $m$-state chain, the $m$ balance equations $\pi_j = \sum_i
          \pi_i p_{ij}$ are...
        choices:
          - text: >
              Always linearly independent, so all $m$ must be solved together
              with normalization
            feedback: >
              This over-determines the system — the balance equations always
              have a built-in redundancy.
          - text: >
              Always linearly dependent, so solve any $m-1$ of them together
              with $\sum_i \pi_i = 1$
            correct: true
            feedback: >
              Right — the $m$ balance equations sum to a trivial identity, so
              one of them is always redundant, and normalization supplies the
              missing constraint.
          - text: >
              Irrelevant, since $\pi$ can only be found by computing $\lim_n
              P^{n}$
            feedback: >
              $\pi$ is found by solving the linear system directly; the
              limiting-law interpretation only applies once irreducibility and
              aperiodicity are also known.
        feedback: >
          The $m$ balance equations are always linearly dependent — drop
          exactly one and add normalization.
      - ask: >
          A device is On or Off. From On it stays On with probability $0.75$;
          from Off it recovers to On with probability $0.6$. What is
          $\pi_{\text{On}}$?
        expects: "12/17"
        tolerance: 0.0005
        hint: >
          Balance gives $\pi_{\text{On}} \times 0.25 = \pi_{\text{Off}} \times
          0.6$; then normalize.
        feedback: >
          $0.25\,\pi_{\text{On}} = 0.6\,\pi_{\text{Off}}$ gives
          $\pi_{\text{On}} = 2.4\,\pi_{\text{Off}}$. With $\pi_{\text{On}} +
          \pi_{\text{Off}} = 1$, $3.4\,\pi_{\text{Off}} = 1$, so
          $\pi_{\text{Off}} = 5/17$ and $\pi_{\text{On}} = 12/17 \approx
          0.706$.
      - ask: >
          What is $\pi_{\text{Off}}$?
        expects: "5/17"
        tolerance: 0.0005
        hint: >
          Use $\pi_{\text{Off}} = 1 - \pi_{\text{On}}$.
        feedback: >
          $1 - 12/17 = 5/17 \approx 0.294$.
      - teach: >
          Using all $m$ balance equations plus normalization over-determines
          the system, since the balance equations are always linearly dependent
          — drop exactly one. Solving for $\pi$ without first checking
          uniqueness can hand back a technically-correct vector that isn't the
          one the problem wants.
      - teach: >
          $\pi P = \pi$ defines the law the chain leaves unchanged; solve $m-1$
          balance equations plus normalization, and for an irreducible
          aperiodic chain that same $\pi$ is also the limit from any start.

  - node: quant-processes.markov-chains.stationary-uniqueness
    hook: >
      "Does this chain have a unique equilibrium?" splits into two separate
      yes/no checks — irreducibility for uniqueness, positive recurrence for
      existence — and interviewers expect both named, not just a single
      hand-wave at "well-behaved."
    explanation: >
      Irreducibility is what buys uniqueness. With more than one
      communicating class, each closed class can support its own stationary
      distribution concentrated entirely on that class, and any convex
      combination of those is stationary too — there's no single privileged
      $\pi$ to point to. Irreducibility rules this out by leaving only one
      class for probability mass to settle on.

      Positive recurrence is what buys existence, and on a finite chain it's
      automatic: with finitely many states, the chain can't spread its
      expected return time out to infinity the way an infinite chain can, so
      every finite irreducible chain is positive recurrent for free. On an
      infinite state space that guarantee disappears — a chain can be
      irreducible and recurrent (certain to return) while still being null
      recurrent, with a mean return time of infinity, in which case no
      stationary probability vector exists at all.

      Notice what's absent from the hypotheses: aperiodicity. A period-$2$
      chain still has exactly one stationary $\pi$ under irreducibility and
      positive recurrence; periodicity only affects whether $P^n$ actually
      converges to it, a separate question.
    worked: >
      A three-state chain has $A$ and $B$ absorbing and $C$ transient,
      moving to $A$ or $B$ with probability $0.5$ each. Check
      $\pi=(0.3,0.7,0)$: $(\pi P)_A=\pi_A\cdot1+\pi_C\cdot0.5=0.3+0=0.3=\pi_A$,
      and similarly $(\pi P)_B=0.7=\pi_B$, $(\pi P)_C=0$. So
      $\pi=(0.3,0.7,0)$ is stationary — and so is $(1,0,0)$, $(0,1,0)$, and
      every convex combination between them, since this chain has two closed
      classes and is not irreducible.
    interview: >
      "Show the stationary distribution is unique" or "why might it not be"
      wants irreducibility and positive recurrence named as the two separate
      conditions, with a one-line counterexample ready for each — two
      absorbing states for non-uniqueness, an infinite null-recurrent walk
      for non-existence.
    pitfalls: >
      Assuming irreducibility alone forces existence overlooks null
      recurrence, which only threatens infinite chains — every finite
      irreducible chain is safe automatically. Treating aperiodicity as part
      of this theorem's hypotheses confuses uniqueness of $\pi$ with
      convergence of $P^n$ to it, a genuinely separate statement.
    recap: >
      Irreducible plus positive recurrent gives exactly one stationary
      $\pi$; drop irreducibility and uniqueness fails, drop positive
      recurrence and existence fails, and aperiodicity plays no role in this
      particular guarantee.
    steps:
      - teach: >
          "Does this chain have a unique equilibrium?" splits into two separate
          yes/no checks — irreducibility for uniqueness, positive recurrence
          for existence — and both need naming, not a single hand-wave at
          "well-behaved."
      - teach: >
          Irreducibility buys uniqueness: with more than one communicating
          class, each closed class supports its own stationary distribution,
          and any convex combination of those is stationary too. Irreducibility
          leaves only one class for probability mass to settle on.
      - teach: >
          Positive recurrence buys existence, and it's automatic on a finite
          chain, since finitely many states can't spread the mean return time
          to infinity. On an infinite state space that guarantee disappears —
          the walk on $\mathbb{Z}$ is irreducible and recurrent, yet null
          recurrent, with no stationary probability vector at all.
      - ask: >
          A finite chain has two absorbing states, $A$ and $B$, and one
          transient state $C$ that always eventually reaches $A$ or $B$. Is its
          stationary distribution unique?
        choices:
          - text: >
              No — it has two closed classes, so infinitely many stationary
              vectors exist
            correct: true
            feedback: >
              Right: any convex combination of the point-mass-at-$A$ and
              point-mass-at-$B$ distributions is stationary here.
          - text: >
              Yes, because the chain is positive recurrent
            feedback: >
              Positive recurrence is about existence, not uniqueness — what's
              missing here is irreducibility, since $A$ and $B$ are two
              separate closed classes.
          - text: >
              Yes, because the chain is finite
            feedback: >
              Finiteness only guarantees positive recurrence automatically; it
              says nothing about how many communicating classes the chain has.
        feedback: >
          Two absorbing states means two closed classes, so uniqueness fails
          regardless of finiteness or positive recurrence.
      - ask: >
          For that same chain (absorbing $A$, $B$; transient $C$ moving to $A$
          with probability $0.3$ and to $B$ with probability $0.7$), which of
          these is *not* a valid stationary distribution?
        choices:
          - text: >
              $(1, 0, 0)$
            feedback: >
              This is stationary — it's the point mass on the absorbing state
              $A$.
          - text: >
              $(0, 1, 0)$
            feedback: >
              This is stationary too — the point mass on the absorbing state
              $B$.
          - text: >
              $(0.5, 0.2, 0.3)$
            correct: true
            feedback: >
              Right — a transient state can never carry nonzero weight in a
              stationary distribution, so any vector with $\pi_C > 0$ here
              fails to be stationary.
        feedback: >
          Every stationary vector on this chain has the form $(x, 1-x, 0)$ for
          some $x \in [0,1]$ — the transient state always gets exactly zero
          weight.
      - ask: >
          Which chain can be irreducible, recurrent, and yet have no stationary
          distribution at all?
        choices:
          - text: >
              A finite irreducible chain
            feedback: >
              Every finite irreducible chain is automatically positive
              recurrent, so it always has a stationary distribution.
          - text: >
              The simple symmetric random walk on $\mathbb{Z}$
            correct: true
            feedback: >
              Right — it's irreducible and recurrent, but null recurrent: its
              mean return time is infinite, and it has no stationary
              probability vector.
          - text: >
              A chain with an absorbing state
            feedback: >
              That's an uniqueness failure, not an existence one — such a chain
              typically has infinitely many stationary distributions, not zero.
        feedback: >
          Null recurrence is specifically an infinite-state-space phenomenon;
          the walk on $\mathbb{Z}$ is the standard example.
      - teach: >
          Notice what's absent from this theorem's hypotheses: aperiodicity. A
          period-$2$ chain still has exactly one stationary $\pi$ under
          irreducibility and positive recurrence — periodicity only affects
          whether $P^{n}$ converges to it, a separate question.
      - teach: >
          Assuming irreducibility alone forces existence overlooks null
          recurrence, which only threatens infinite chains, and treating
          aperiodicity as part of this theorem's hypotheses confuses uniqueness
          of $\pi$ with convergence of $P^{n}$ to it.
      - teach: >
          Irreducible plus positive recurrent gives exactly one stationary
          $\pi$; drop irreducibility and uniqueness fails, drop positive
          recurrence and existence fails, and aperiodicity plays no role in
          this particular guarantee.

  - node: quant-processes.markov-chains.convergence-to-equilibrium
    hook: >
      "Does $P^n$ actually converge?" needs a yes/no distinct from "does a
      stationary $\pi$ exist" — the two questions have different hypotheses,
      and conflating them is the fastest way to mishandle a periodic chain.
    explanation: >
      Irreducibility alone isn't enough for $P^n$ to converge to a single
      limit, because a periodic chain keeps cycling through a fixed rotation
      of states rather than settling: a period-$d$ chain splits into $d$
      cyclic subclasses, and $P^n$ visits a different one of $d$ distinct
      patterns depending on $n\bmod d$, forever. Aperiodicity is precisely
      the condition that collapses that rotation to a single steady pattern.

      The two hypotheses fail independently. Drop irreducibility: a chain
      with two absorbing states still has $(P^n)_{ij}$ converge for each
      fixed $i$, but the limit depends on where you started, so there's no
      single $\pi$ that every row converges to. Drop aperiodicity: the
      two-state swap chain, rows $(0,1)$ and $(1,0)$, is irreducible with a
      perfectly good $\pi=(1/2,1/2)$, yet $P^n$ alternates forever between
      the identity matrix and the swap matrix and never settles anywhere.

      Once both hypotheses hold, the statement is genuinely strong: every
      row of $P^n$ converges to the same $\pi$, meaning the chain's current
      distribution eventually stops depending on where it started at all —
      $\mu_0P^n\to\pi$ for every initial law $\mu_0$, not just for
      point-mass starts.
    worked: >
      Using the Up/Down machine chain ($0.7$/$0.3$ from Up, $0.4$/$0.6$ from
      Down, with $\pi=(4/7,3/7)\approx(0.571,0.429)$), start at $\mu_0=(1,0)$
      and iterate: $\mu_1=(0.7,0.3)$, $\mu_2=(0.61,0.39)$,
      $\mu_3=(0.583,0.417)$ — each step visibly closing the gap to $\pi$,
      from $0.429$ away at $n=0$ down to about $0.012$ away at $n=3$, exactly
      the geometric approach irreducibility and aperiodicity guarantee here.
    interview: >
      "Does this chain converge to equilibrium, and why?" wants both
      conditions checked explicitly — irreducible (one class, no absorbing
      states, no isolated regions) and aperiodic (no bipartite or otherwise
      cyclic structure) — with a specific counterexample ready to explain
      what breaks if either is dropped.
    pitfalls: >
      Verifying irreducibility and stopping, without separately checking for
      period $2$, is the single most common gap. Concluding non-convergence
      means "no stationary distribution exists" conflates this theorem with
      the separate existence-and-uniqueness statement; a period-$2$ chain
      still has a perfectly good $\pi$, it just never converges to it.
    recap: >
      Irreducible and aperiodic together force $(P^n)_{ij}\to\pi_j$ from any
      start; drop either one and the chain either converges to the wrong
      thing or never converges at all, even though $\pi$ can still exist.
    steps:
      - teach: >
          "Does $P^{n}$ actually converge?" needs a yes/no distinct from "does
          a stationary $\pi$ exist" — the two questions have different
          hypotheses, and conflating them is the fastest way to mishandle a
          periodic chain.
      - teach: >
          If a chain is irreducible, aperiodic, and positive recurrent, then
          $(P^{n})_{ij} \to \pi_j$ for every pair of states, so $\mu_0 P^{n}
          \to \pi$ for every initial law $\mu_0$ — the chain forgets where it
          started.
      - teach: >
          The two hypotheses fail independently. Drop irreducibility: a chain
          with two absorbing states still converges for each fixed start, but
          to a start-dependent limit. Drop aperiodicity: the two-state swap
          chain has a perfectly good $\pi$, yet never settles anywhere.
      - ask: >
          A two-state chain has rows $(0.8, 0.2)$ (state $R$) and $(0.5, 0.5)$
          (state $S$). Starting at $R$, what is $\mu_2$'s $R$-component?
        expects: "0.74"
        hint: >
          First find $\mu_1 = \mu_0 P$, then $\mu_2 = \mu_1 P$.
        feedback: >
          $\mu_1 = (0.8, 0.2)$, so $\mu_2(R) = 0.8 \times 0.8 + 0.2 \times 0.5
          = 0.64 + 0.1 = 0.74$.
      - ask: >
          Continuing from $\mu_2 = (0.74, 0.26)$, what is $\mu_3$'s
          $R$-component?
        expects: "0.722"
        hint: >
          Compute $\mu_3(R) = \mu_2(R) \times 0.8 + \mu_2(S) \times 0.5$.
        feedback: >
          $0.74 \times 0.8 + 0.26 \times 0.5 = 0.592 + 0.13 = 0.722$ — visibly
          closing in on $\pi_R = 5/7 \approx 0.714$.
      - ask: >
          The two-state swap chain has rows $(0, 1)$ and $(1, 0)$. It's
          irreducible with $\pi = (0.5, 0.5)$. Does $P^{n}$ converge to the
          matrix with both rows equal to $\pi$?
        choices:
          - text: >
              No — $P^{n}$ alternates forever between the identity and the swap
              matrix, since the chain has period $2$
            correct: true
            feedback: >
              Right — irreducibility alone isn't enough; this chain fails
              aperiodicity, so it never settles despite having a perfectly good
              $\pi$.
          - text: >
              Yes, since it's irreducible and $\pi$ exists
            feedback: >
              This conflates existence of $\pi$ with convergence to it — the
              swap chain has both hypotheses of the uniqueness theorem but
              fails aperiodicity, which convergence additionally requires.
          - text: >
              No, because $\pi$ doesn't actually exist for this chain
            feedback: >
              $\pi = (0.5, 0.5)$ genuinely is stationary here — the chain just
              never converges to it.
        feedback: >
          Period $2$ blocks convergence even though $\pi$ exists and is unique
          — existence and convergence are separate statements with separate
          hypotheses.
      - teach: >
          Verifying irreducibility and stopping, without separately checking
          for period $2$, is the single most common gap. Concluding
          "non-convergence means no stationary distribution exists" conflates
          this theorem with the separate existence-and-uniqueness statement.
      - teach: >
          Irreducible and aperiodic together force $(P^{n})_{ij} \to \pi_j$
          from any start; drop either one and the chain either converges to the
          wrong thing or never converges, even though $\pi$ can still exist.

  - node: quant-processes.markov-chains.weather-chain
    hook: >
      This is the two-state stationary computation done so often it's worth
      having the shortcut $\pi=(b/(a+b),a/(a+b))$ memorized, not just the
      method to rederive it.
    explanation: >
      For a two-state chain with rows $(1-a,a)$ and $(b,1-b)$, the balance
      equation reduces to one line: $\pi_1(1-a)+\pi_2b=\pi_1$ rearranges to
      $\pi_1a=\pi_2b$, so $\pi_1/\pi_2=b/a$ — the ratio of the two "leaving"
      probabilities, inverted. Normalizing gives the closed form
      $\pi=(b/(a+b),\,a/(a+b))$ directly, without ever writing a matrix.

      The mental model behind that ratio: a state with a small leaving
      probability ($a$ small, meaning a large self-loop $1-a$) is "sticky"
      and the chain lingers there, so it should get more stationary weight —
      and indeed $\pi_1$ grows as $a$ shrinks, matching intuition.

      Once $\pi$ is known, the two-state chain hands over its eigenvalues
      almost for free: they're always $1$ and $1-a-b$, so the same numbers
      that built $\pi$ also tell you how fast deviations from $\pi$ decay
      each step, and $1/\pi_i$ reads off the average number of steps between
      visits to state $i$.
    worked: >
      A machine is Up or Down. From Up it fails with probability $0.05$ (so
      $a=0.05$) and otherwise stays Up; from Down it's repaired with
      probability $0.6$ (so $b=0.6$) and otherwise stays Down. Then
      $\pi_{\text{Up}}=0.6/0.65=12/13\approx0.923$ and
      $\pi_{\text{Down}}=0.05/0.65=1/13\approx0.077$. The eigenvalues are $1$
      and $1-0.05-0.6=0.35$, and the machine is Down on average once every
      $13$ checks.
    interview: >
      A two-state chain with named transition probabilities is meant to be
      solved by the ratio shortcut in one line, not by writing out $\pi P=\pi$
      from scratch every time — the interviewer is checking whether the
      two-state case is automatic before moving on to anything with more
      states.
    pitfalls: >
      Mixing up which probability is $a$ and which is $b$ flips the ratio and
      swaps the answer for the two states — always double-check
      $\pi_1=b/(a+b)$ pairs the larger stationary weight with the smaller
      leaving probability. Quoting the eigenvalue $1-a-b$ as though it were
      always positive misses that a chain that swaps almost every step has
      $a,b$ close to $1$, making this eigenvalue negative and the approach
      oscillate.
    recap: >
      For rows $(1-a,a)$ and $(b,1-b)$, $\pi=(b/(a+b),a/(a+b))$ in one line —
      here $(12/13,1/13)$ — with eigenvalues $1$ and $1-a-b$ setting both the
      ratio and the mixing speed.
    steps:
      - teach: >
          This is the two-state stationary computation done so often it's worth
          having the shortcut $\pi = (b/(a+b), a/(a+b))$ memorized, not just
          the method to rederive it.
      - teach: >
          For rows $(1-a, a)$ and $(b, 1-b)$, balance reduces to one line:
          $\pi_1 a = \pi_2 b$, so $\pi_1/\pi_2 = b/a$. Normalizing gives $\pi =
          (b/(a+b), a/(a+b))$ directly, with no matrix ever written.
      - teach: >
          A state with a small leaving probability $a$ (a large self-loop) is
          "sticky" and gets more stationary weight — and once $\pi$ is known,
          the two-state chain hands over its eigenvalues almost for free:
          always $1$ and $1-a-b$.
      - ask: >
          A signal is Strong or Weak. From Strong it fails (drops to Weak) with
          probability $0.1$; from Weak it recovers to Strong with probability
          $0.75$. What is $\pi_{\text{Strong}}$?
        expects: "15/17"
        tolerance: 0.0005
        hint: >
          Here $a = 0.1$ (leaving Strong) and $b = 0.75$ (leaving Weak); use
          $\pi_1 = b/(a+b)$.
        feedback: >
          $\pi_{\text{Strong}} = 0.75/(0.1+0.75) = 0.75/0.85 = 15/17 \approx
          0.882$.
      - ask: >
          What is the second eigenvalue, $1-a-b$, for this same chain?
        expects: "0.15"
        hint: >
          Subtract both leaving probabilities from $1$.
        feedback: >
          $1 - 0.1 - 0.75 = 0.15$ — deviations from equilibrium shrink by this
          factor each step.
      - ask: >
          For rows $(1-a, a)$ and $(b, 1-b)$, the stationary weight $\pi_1$
          equals...
        choices:
          - text: >
              $b/(a+b)$
            correct: true
            feedback: >
              Right — the state's own leaving probability sits in the
              denominator paired with the other state's leaving probability in
              the numerator.
          - text: >
              $a/(a+b)$
            feedback: >
              This is the swapped ratio — it gives $\pi_2$, not $\pi_1$.
          - text: >
              $a/b$
            feedback: >
              This doesn't normalize to sum to $1$ across both states in
              general.
        feedback: >
          $\pi_1 = b/(a+b)$ pairs the larger stationary weight with the smaller
          leaving probability — mixing up $a$ and $b$ flips the answer for both
          states.
      - teach: >
          Mixing up which probability is $a$ and which is $b$ flips the ratio
          and swaps the two states' answers, and quoting $1-a-b$ as though it
          were always positive misses that a chain which swaps almost every
          step has this eigenvalue negative, making the approach oscillate.
      - teach: >
          For rows $(1-a, a)$ and $(b, 1-b)$, $\pi = (b/(a+b), a/(a+b))$ in one
          line — here $(15/17, 2/17)$ — with eigenvalues $1$ and $1-a-b$
          setting both the ratio and the mixing speed.

  - node: quant-processes.markov-chains.ergodic-fraction
    hook: >
      "Long-run frequency" and "stationary probability" are the same number,
      and this theorem is the reason — it licenses answering a "what
      fraction of the time..." question with $\pi_i$ even without ever
      proving $P^n$ converges.
    explanation: >
      This is the law of large numbers transplanted to dependent data:
      instead of averaging i.i.d. draws, you're averaging indicator
      variables along a single trajectory of a chain, and irreducibility
      plus positive recurrence does the job that independence does in the
      classical law. The result,
      $\frac1n\sum_{k=0}^{n-1}\mathbf{1}\{X_k=i\}\to\pi_i$ with probability
      $1$, holds from any starting state — it doesn't even need $\pi$ to
      already be known as a limit of $P^n$, only as the solution of
      $\pi P=\pi$.

      What makes this genuinely stronger than the convergence-to-equilibrium
      statement is what's missing from its hypotheses: aperiodicity. A
      period-$2$ chain never has $(P^n)_{ij}$ settle to a single value,
      since it alternates between two patterns forever, but averaging over
      time smooths that oscillation completely away — spending exactly half
      the visits in each of two alternating phases produces a time-average
      that still hits $\pi_i$ on the nose.

      The generalization to $\frac1n\sum f(X_k)\to\sum_i\pi_if(i)$ applies
      the same idea to any bounded (or absolutely summable) function of the
      state rather than just a single indicator — it's what justifies
      computing a long-run average cost, reward, or count directly as an
      expectation under $\pi$.
    worked: >
      On the two-state swap chain (rows $(0,1)$ and $(1,0)$, period $2$,
      $\pi=(0.5,0.5)$), start at state $1$ and track visits over the first
      $10$ steps, $k=0,\dots,9$: state $1$ occurs at $k=0,2,4,6,8$, exactly
      $5$ of $10$, giving a time-average fraction of $0.5=\pi_1$ exactly —
      even though $P^n$ itself never converges, alternating forever between
      the identity and the swap matrix.
    interview: >
      "What fraction of days is the machine in state $X$, long-run?" is
      answered with $\pi_X$, citing this theorem by name if pressed on why a
      time average should equal a probability computed from a static
      equation — the interviewer is listening for "law of large numbers for
      a dependent sequence," not just the number.
    pitfalls: >
      Assuming this theorem needs aperiodicity, by analogy with the
      convergence-to-equilibrium statement, leads to unnecessarily checking a
      condition that isn't actually required here. Applying the generalized
      version with an $f$ whose sum $\sum_i\pi_if(i)$ doesn't converge
      absolutely invalidates the conclusion silently.
    recap: >
      Time averages along one trajectory converge to $\pi$ for any
      irreducible positive recurrent chain, no aperiodicity required —
      "long-run frequency" and "stationary probability" are the same number
      for exactly this reason.
    steps:
      - teach: >
          "Long-run frequency" and "stationary probability" are the same
          number, and this theorem is why — it licenses answering a "what
          fraction of the time" question with $\pi_i$ even without ever proving
          $P^{n}$ converges.
      - teach: >
          This is the law of large numbers for dependent data: irreducibility
          plus positive recurrence does the job independence does classically.
          The result, $\frac1n\sum_{k=0}^{n-1}\mathbf{1}\{X_k=i\} \to \pi_i$
          with probability $1$, holds from any starting state.
      - teach: >
          What's missing from the hypotheses is aperiodicity. A period-$2$
          chain never has $(P^{n})_{ij}$ settle to a single value, yet
          averaging over time smooths that oscillation completely away, since
          it spends exactly half its visits in each alternating phase.
      - ask: >
          A chain cycles deterministically $1 \to 2 \to 3 \to 1$ with
          probability $1$ (period $3$), so $\pi = (1/3, 1/3, 1/3)$ by symmetry.
          Starting at state $1$, track the first $9$ steps ($k = 0, \dots, 8$).
          What fraction of those steps land in state $1$?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          State $1$ is visited exactly when $k$ is a multiple of $3$.
        feedback: >
          State $1$ occurs at $k = 0, 3, 6$: exactly $3$ of $9$ steps, giving
          $3/9 = 1/3 = \pi_1$ exactly — even though $P^{n}$ itself never
          settles to a single matrix.
      - teach: >
          The generalization $\frac1n\sum f(X_k) \to \sum_i \pi_i f(i)$ applies
          the same idea to any bounded function of the state, not just a single
          indicator — this is what justifies computing a long-run average
          reward directly as an expectation under $\pi$.
      - ask: >
          On that same $3$-cycle, assign a reward of $6$ whenever the chain is
          in state $1$, and $0$ otherwise. What is the long-run average reward
          per step?
        expects: "2"
        hint: >
          Compute $\sum_i \pi_i f(i)$ with $f(1)=6, f(2)=f(3)=0$.
        feedback: >
          $\pi_1 \times 6 + \pi_2 \times 0 + \pi_3 \times 0 = \tfrac13 \times 6
          = 2$.
      - ask: >
          Does this theorem require the chain to be aperiodic?
        choices:
          - text: >
              No — it holds for any irreducible positive recurrent chain,
              periodic or not, since averaging over time smooths out the
              oscillation
            correct: true
            feedback: >
              Right — this is exactly what makes it stronger than the
              convergence-to- equilibrium statement, which does need
              aperiodicity.
          - text: >
              Yes, exactly like the convergence-to-equilibrium theorem
            feedback: >
              That's a different, stronger theorem with a stricter hypothesis
              list — this one specifically doesn't need aperiodicity.
        feedback: >
          Time averages converge to $\pi$ regardless of periodicity — that's
          the entire point of contrasting this theorem with $P^{n}$
          convergence.
      - teach: >
          Assuming this theorem needs aperiodicity, by analogy with the
          convergence theorem, leads to checking a condition that isn't
          actually required, and applying the generalized version with an $f$
          whose sum doesn't converge absolutely invalidates the conclusion
          silently.
      - teach: >
          Time averages along one trajectory converge to $\pi$ for any
          irreducible positive recurrent chain, no aperiodicity required —
          which is exactly why "long-run frequency" and "stationary
          probability" are the same number.

  - node: quant-processes.markov-chains.mean-return-time
    hook: >
      "How often does state $X$ recur?" is a one-line answer, $1/\pi_X$,
      once you have $\pi$ — no separate first-step system for the return
      time is needed.
    explanation: >
      The identity $m_i=1/\pi_i$ drops directly out of the ergodic theorem's
      time-average interpretation: if the chain spends a fraction $\pi_i$ of
      its steps at $i$, and consecutive visits to $i$ are spaced $m_i$ steps
      apart on average, then over a long stretch of $n$ steps there are
      about $n/m_i$ visits, and that count divided by $n$ must equal
      $\pi_i$ — forcing $\pi_im_i=1$.

      This gives a genuinely useful shortcut: any time you've already solved
      for $\pi$, the return time to every state is free, just its
      reciprocal, with no additional linear system to set up. Rare states
      (small $\pi_i$) are, unsurprisingly, visited rarely and waited for a
      long time between visits; common states are visited often and the
      gaps are short.

      The one distinction worth keeping sharp: $m_i$ is specifically the
      return time to $i$ starting from $i$ itself. The expected time to hit
      $i$ starting from some other state $j\ne i$ is a genuinely different
      quantity, computed by its own first-step system exactly like an
      absorption-time problem, and $1/\pi_i$ says nothing directly about it.
    worked: >
      For the Up/Down machine with $\pi=(4/7,3/7)$: the mean return time to
      Up is $m_{\text{Up}}=1/\pi_{\text{Up}}=7/4=1.75$ steps, and to Down is
      $m_{\text{Down}}=1/\pi_{\text{Down}}=7/3\approx2.33$ steps — Down is
      visited less often (smaller $\pi$) and correspondingly takes longer,
      on average, to recur.
    interview: >
      "On average, how many steps between visits to state $X$?" is answered
      immediately as $1/\pi_X$ whenever $\pi$ is already known, and the
      interviewer is checking that you reach for this reciprocal rather than
      setting up a fresh first-step system for return time.
    pitfalls: >
      Applying $1/\pi_i$ to a hitting-time question that starts from a
      different state confuses return time with hitting time — they
      coincide only when the starting state is $i$ itself. Using this
      identity on a chain that isn't irreducible and positive recurrent
      borrows a formula whose derivation assumed exactly those hypotheses.
    recap: >
      Mean return time to $i$ is exactly $1/\pi_i$, free once $\pi$ is
      known — but only for return to $i$ starting from $i$, not for hitting
      $i$ from anywhere else.
    steps:
      - teach: >
          "How often does state $X$ recur?" is a one-line answer, $1/\pi_X$,
          once $\pi$ is known — no separate first-step system for the return
          time is needed.
      - teach: >
          The identity $m_i = 1/\pi_i$ drops out of the ergodic theorem's
          time-average reading: the chain spends a fraction $\pi_i$ of its
          steps at $i$, and consecutive visits are spaced $m_i$ steps apart on
          average, forcing $\pi_i m_i = 1$.
      - teach: >
          Keep one distinction sharp: $m_i$ is the return time to $i$ starting
          from $i$ itself. The expected time to hit $i$ starting from a
          different state needs its own first-step system, exactly like an
          absorption-time problem.
      - ask: >
          For the signal chain with $\pi_{\text{Strong}} = 15/17$ and
          $\pi_{\text{Weak}} = 2/17$, what is the mean return time to Weak?
        expects: "17/2"
        tolerance: 0.0005
        hint: >
          Use $m_i = 1/\pi_i$.
        feedback: >
          $m_{\text{Weak}} = 1/(2/17) = 17/2 = 8.5$ steps.
      - ask: >
          What is the mean return time to Strong?
        expects: "17/15"
        tolerance: 0.0005
        hint: >
          Use $m_i = 1/\pi_i$ with $\pi_{\text{Strong}} = 15/17$.
        feedback: >
          $m_{\text{Strong}} = 1/(15/17) = 17/15 \approx 1.133$ steps — a
          common state recurs almost immediately, exactly as expected.
      - ask: >
          A chain has $\pi_X = 0.01$. A colleague asks for the expected number
          of steps to first reach $X$ starting from some other state $Y$. Can
          you answer with $1/\pi_X = 100$?
        choices:
          - text: >
              No — $1/\pi_X$ is the return time from $X$ to itself; the hitting
              time from $Y$ needs its own first-step system
            correct: true
            feedback: >
              Right — these two quantities coincide only when the starting
              state is $X$ itself.
          - text: >
              Yes, hitting time and return time are always equal
            feedback: >
              They're only equal in the special case where the starting state
              and the target state coincide.
        feedback: >
          $1/\pi_X$ answers only "how long, on average, between visits to $X$,"
          which is a different question from "how long to first arrive at $X$
          from somewhere else."
      - teach: >
          Applying $1/\pi_i$ to a hitting-time question that starts from a
          different state confuses return time with hitting time, and using
          this identity on a chain that isn't irreducible and positive
          recurrent borrows a formula whose derivation assumed exactly those
          hypotheses.
      - teach: >
          Mean return time to $i$ is exactly $1/\pi_i$, free once $\pi$ is
          known — but only for return to $i$ starting from $i$, not for hitting
          $i$ from anywhere else.

  - node: quant-processes.markov-chains.detailed-balance
    hook: >
      Checking $\pi_ip_{ij}=\pi_jp_{ji}$ edge by edge is almost always
      faster than solving $\pi P=\pi$ directly, and for any walk on a graph
      it hands you the answer, $\pi\propto\deg$, without solving anything at
      all.
    explanation: >
      Detailed balance asks for something stronger and more local than
      stationarity: not just that the total probability flowing into each
      state matches what flows out overall, but that the flow across every
      single edge matches in both directions, $\pi_ip_{ij}=\pi_jp_{ji}$.
      Summing this edge-by-edge identity over $i$ collapses to
      $\sum_i\pi_ip_{ij}=\pi_j\sum_ip_{ji}=\pi_j$ — exactly the stationarity
      equation — so detailed balance is always sufficient for stationarity,
      and a chain started at such a $\pi$ is statistically indistinguishable
      from its own time-reversal, hence "reversible."

      The converse genuinely fails: a chain that cycles $1\to2\to3\to1$ with
      probability $1$ has $\pi=(1/3,1/3,1/3)$ stationary (every state
      receives exactly the flow it sends out, in aggregate) but no detailed
      balance on any edge, since probability only ever flows one direction
      around the cycle. Any deterministic cycle of length at least $3$ is
      stationary without being reversible, because a one-way circulating
      flow is the signature of broken detailed balance even when the totals
      still add up.

      The payoff that makes this worth checking first: for a walk on any
      connected undirected graph that steps to a uniformly chosen neighbor,
      $\pi_i\propto\deg(i)$ solves detailed balance instantly, because both
      $\pi_ip_{ij}$ and $\pi_jp_{ji}$ reduce to the same number,
      $1/(2|E|)$, on every edge.
    worked: >
      On the path $1$–$2$–$3$–$4$ (edges $12,23,34$, so $2|E|=6$), degrees
      are $1,2,2,1$, giving $\pi=(1/6,1/3,1/3,1/6)$. Check the edge
      $(1,2)$: $\pi_1p_{12}=(1/6)(1)=1/6$, since state $1$'s only neighbor
      is $2$; and $\pi_2p_{21}=(1/3)(1/2)=1/6$, since state $2$ splits
      evenly between neighbors $1$ and $3$. The two sides match exactly,
      confirming detailed balance on this edge without ever writing
      $\pi P=\pi$.
    interview: >
      "Find the stationary distribution of a random walk on this graph" is
      meant to be answered with $\pi\propto\deg$ immediately, with detailed
      balance cited as the one-line justification — solving $\pi P=\pi$
      from scratch on a graph walk is the slow way to get the same answer.
    pitfalls: >
      Assuming stationarity implies detailed balance runs the implication
      backward — the one-way cycle is the standard counterexample, and it's
      worth having ready. Applying $\pi\propto\deg$ to a directed graph, or
      to a walk that isn't uniform-over-neighbors, uses a formula whose
      derivation specifically assumed an undirected graph and uniform
      neighbor choice.
    recap: >
      Detailed balance, $\pi_ip_{ij}=\pi_jp_{ji}$, is a stronger and more
      local condition than stationarity that always implies it but not
      conversely — and it hands over $\pi\propto\deg$ for any uniform walk
      on an undirected graph.
    steps:
      - teach: >
          Checking $\pi_i p_{ij} = \pi_j p_{ji}$ edge by edge is often faster
          than solving $\pi P = \pi$ directly, and for a walk on a graph it
          hands over the answer, $\pi \propto \deg$, with no linear system
          solved at all.
      - teach: >
          Detailed balance asks for something stronger than stationarity — flow
          across every single edge matches in both directions. Summing this
          edge-by-edge identity over $i$ collapses to $\sum_i \pi_i p_{ij} =
          \pi_j$, exactly the stationarity equation, so detailed balance always
          implies it.
      - teach: >
          The converse fails: a chain cycling $1 \to 2 \to 3 \to 1$ with
          probability $1$ has $\pi = (1/3, 1/3, 1/3)$ stationary — every state
          receives exactly the flow it sends out, in aggregate — but no
          detailed balance on any edge, since probability only ever flows one
          direction.
      - ask: >
          For that deterministic cycle $1 \to 2 \to 3 \to 1$ with $\pi = (1/3,
          1/3, 1/3)$, does detailed balance hold on the edge $(1, 2)$?
        choices:
          - text: >
              No — $\pi_1 p_{12} = 1/3$ but $\pi_2 p_{21} = 0$, since state $2$
              never transitions directly to state $1$
            correct: true
            feedback: >
              Right — the flow only runs one way around the cycle, so the two
              sides of the balance equation can't match on any edge.
          - text: >
              Yes, since both states have equal stationary weight $1/3$
            feedback: >
              Equal stationary weight is not enough — detailed balance is about
              the edge-level flow in each direction, and this chain only ever
              flows $1 \to 2$, never $2 \to 1$.
        feedback: >
          $\pi_2 p_{21} = 0$ since $2 \to 1$ never happens directly, while
          $\pi_1 p_{12} = 1/3 \ne 0$ — the two sides of detailed balance
          disagree on this edge.
      - teach: >
          The payoff: for a walk on any connected undirected graph that steps
          to a uniformly chosen neighbor, $\pi_i \propto \deg(i)$ solves
          detailed balance instantly, since both $\pi_i p_{ij}$ and $\pi_j
          p_{ji}$ reduce to the same number, $1/(2|E|)$, on every edge.
      - ask: >
          A star graph has a center $C$ joined to three leaves, each by one
          edge. What is $\pi_C$?
        expects: "1/2"
        tolerance: 0.0005
        hint: >
          Degrees are $3$ for the center and $1$ for each leaf; $2|E|$ is the
          sum of all degrees.
        feedback: >
          Degrees are $3, 1, 1, 1$, summing to $2|E| = 6$, so $\pi_C = 3/6 =
          1/2$.
      - ask: >
          For that same star graph, what is $\pi_C\,p_{C,L_1}$, the flow from
          $C$ to one specific leaf $L_1$?
        expects: "1/6"
        tolerance: 0.0005
        hint: >
          From $C$, each of the three leaves is chosen with probability $1/3$.
        feedback: >
          $\pi_C\,p_{C,L_1} = \tfrac12 \times \tfrac13 = 1/6$, which matches
          $\pi_{L_1}\,p_{L_1,C} = \tfrac16 \times 1 = 1/6$ exactly, confirming
          detailed balance on this edge.
      - teach: >
          Assuming stationarity implies detailed balance runs the implication
          backward — the one-way cycle is the standard counterexample. Applying
          $\pi \propto \deg$ to a directed graph, or a walk that isn't uniform
          over neighbors, uses a formula whose derivation assumed neither.
      - teach: >
          Detailed balance, $\pi_i p_{ij} = \pi_j p_{ji}$, is stronger and more
          local than stationarity, always implying it but not conversely — and
          it hands over $\pi \propto \deg$ for any uniform walk on an
          undirected graph.

  - node: quant-processes.markov-chains.graph-walk
    hook: >
      Once you spot "random walk on a graph, uniform neighbor choice," the
      stationary distribution is degrees, normalized — this is the fastest
      possible finish to that entire class of question.
    explanation: >
      Reading off $\pi_i=\deg(i)/(2|E|)$ requires nothing but a degree count
      and an edge count, both directly visible from the graph's picture, no
      equations to set up or solve — the detailed-balance argument does all
      the work in advance. Mean return times then come for free too, as
      $1/\pi_i=2|E|/\deg(i)$: high-degree vertices are visited often and
      recur quickly, low-degree ones are visited rarely and recur slowly.

      The one condition still worth checking before quoting the limiting
      behavior is periodicity: $\pi$ itself doesn't care whether the graph
      is bipartite, but $P^n$'s actual convergence to it does. Any odd cycle
      anywhere in the graph is enough to force aperiodicity for the whole
      (connected, hence irreducible) walk, while a purely bipartite graph —
      no odd cycles at all — keeps the same $\pi$ stationary but leaves
      $P^n$ oscillating forever, never actually converging to it.
    worked: >
      Vertices $A,B,C,D$ with edges $AB,BC,CD,DA,AC$: a $4$-cycle with one
      diagonal. Degrees are $A{:}3$, $B{:}2$, $C{:}3$, $D{:}2$, summing to
      $2|E|=10$, so $\pi=(0.3,0.2,0.3,0.2)$ with no linear system solved.
      Mean return times are $2|E|/\deg(i)$: $10/3\approx3.33$ for $A$ and
      $C$, $5$ for $B$ and $D$. The diagonal creates the triangle
      $A$–$B$–$C$–$A$, an odd cycle, so despite the underlying $4$-cycle's
      bipartite shape the whole graph is non-bipartite and the walk is
      aperiodic — $P^n$ genuinely converges to $\pi$ from any start.
    interview: >
      "What's the stationary distribution of a simple random walk on this
      graph" wants $\pi\propto\deg$ produced immediately from a glance at
      the picture, with mean return times as an easy follow-up — and "does
      it converge" answered by checking for an odd cycle, not by computing
      eigenvalues.
    pitfalls: >
      Forgetting that $2|E|$, not $|E|$, is the normalizing constant
      undercounts the total by exactly a factor of $2$, since each edge
      contributes to two vertices' degrees. Declaring a graph aperiodic just
      because it "doesn't look bipartite" without actually finding an odd
      cycle is a guess, not a verification.
    recap: >
      A uniform random walk on a connected graph has $\pi_i=\deg(i)/(2|E|)$
      and mean return time $2|E|/\deg(i)$ immediately, converging whenever
      the graph has an odd cycle and merely oscillating stationarily
      otherwise.
    steps:
      - teach: >
          Once you spot "random walk on a graph, uniform neighbor choice," the
          stationary distribution is degrees, normalized — the fastest possible
          finish to this entire class of question.
      - teach: >
          $\pi_i = \deg(i)/(2|E|)$ needs nothing but a degree count and an edge
          count, both visible directly from the graph. Mean return times come
          for free too: $1/\pi_i = 2|E|/\deg(i)$.
      - teach: >
          Periodicity is still worth checking before quoting convergence: $\pi$
          itself doesn't care about bipartiteness, but $P^{n}$'s convergence to
          it does. Any odd cycle anywhere forces aperiodicity for the whole
          connected walk, while a purely bipartite graph leaves $P^{n}$
          oscillating forever.
      - ask: >
          A graph has vertices $P, Q, R, S, T$ with edges $PQ$, $QR$, $RP$ (a
          triangle), plus $RS$ and $ST$ (a tail hanging off $R$). What is
          $\pi_T$?
        expects: "0.1"
        hint: >
          Degrees are $P{:}2, Q{:}2, R{:}3, S{:}2, T{:}1$; sum them for $2|E|$.
        feedback: >
          Degrees sum to $2+2+3+2+1=10=2|E|$, so $\pi_T = 1/10 = 0.1$.
      - ask: >
          For the same graph, what is $\pi_R$?
        expects: "0.3"
        hint: >
          $R$ has degree $3$, connecting to $P$, $Q$, and $S$.
        feedback: >
          $\pi_R = \deg(R)/(2|E|) = 3/10 = 0.3$ — the largest weight, matching
          $R$ being the highest-degree vertex.
      - ask: >
          Does $P^{n}$ converge to $\pi$ for the walk on this graph?
        choices:
          - text: >
              Yes — the triangle $P$-$Q$-$R$ is an odd cycle, forcing the whole
              connected graph to be aperiodic
            correct: true
            feedback: >
              Right — a single odd cycle anywhere in a connected graph is
              enough to force aperiodicity for every state, tail included.
          - text: >
              No — the tail $R$-$S$-$T$ is bipartite, which blocks convergence
              everywhere
            feedback: >
              Periodicity is a class property of the whole (irreducible) chain
              — one odd cycle anywhere overrides any bipartite-looking piece
              elsewhere.
          - text: >
              It's impossible to tell without computing eigenvalues
            feedback: >
              An odd cycle is a directly checkable, sufficient condition for
              aperiodicity — no eigenvalues needed.
        feedback: >
          The triangle supplies an odd cycle, so the whole connected graph is
          aperiodic and $P^{n}$ genuinely converges to $\pi$ from any start.
      - teach: >
          Forgetting that $2|E|$, not $|E|$, is the normalizing constant
          undercounts the total by a factor of $2$, since each edge contributes
          to two vertices' degrees. Declaring a graph aperiodic just because it
          "doesn't look bipartite," without finding an actual odd cycle, is a
          guess.
      - teach: >
          A uniform random walk on a connected graph has $\pi_i =
          \deg(i)/(2|E|)$ and mean return time $2|E|/\deg(i)$ immediately,
          converging whenever the graph has an odd cycle and merely oscillating
          stationarily otherwise.

  - node: quant-processes.markov-chains.pagerank
    hook: >
      "How would you rank web pages by importance" is really asking whether
      you can turn any vague notion of importance into the equilibrium of a
      Markov chain you get to design — PageRank is the canonical worked
      instance of that move.
    explanation: >
      The raw idea — importance is the fraction of time a random surfer
      following links spends on a page — is elegant but broken on a real
      link graph, because dead-end pages (no outgoing links) and
      disconnected regions make the naive chain neither irreducible nor
      reliably aperiodic, so convergence to a single equilibrium isn't
      guaranteed by that construction alone.

      The damping term is the fix, and it's worth seeing exactly why it
      works rather than treating it as a tuning knob: at every step, with
      probability $d\approx0.85$ follow a uniformly chosen outgoing link,
      and with probability $1-d$ teleport to a uniformly chosen page
      anywhere in the whole graph. That teleport term makes every single
      entry of the resulting transition matrix strictly positive — from any
      page, every other page is reachable in exactly one step with
      probability at least $(1-d)$ divided by the number of pages. Strict
      positivity of every entry is a much stronger fact than merely being
      irreducible and aperiodic; it implies both immediately, since every
      state communicates with every other in one step and a positive
      self-return in one step rules out any periodic rotation.

      Once irreducibility and aperiodicity are secured this mechanically,
      convergence to equilibrium is exactly the theorem already established
      for any such chain — the scores are computed in practice by power
      iteration, repeatedly applying $\mu\mapsto\mu P$, with the error
      shrinking roughly like $d^n$ per step. The transferable habit for
      interviews: whenever asked to define an "importance" or "influence"
      score for anything with a natural flow structure — citations,
      followers, recommendations — define the flow as a chain and take its
      stationary distribution, patching whatever breaks irreducibility or
      aperiodicity along the way.
    interview: >
      "How does PageRank work" wants the damping factor's actual purpose
      named — repairing irreducibility and aperiodicity so the equilibrium
      is guaranteed to exist and be reachable by iteration — not just "it's
      a random surfer model" recited without the mechanism. A strong finish
      generalizes: any equilibrium-of-a-flow ranking idea is this same move.
    pitfalls: >
      Describing the random surfer model without mentioning why the
      teleport term is necessary (dead ends and disconnected components
      break the naive chain) misses the actual interview point. Treating
      $d$ as an arbitrary tuning parameter rather than the dial that trades
      off "trust the link structure" against "guarantee convergence"
      undersells what it's doing.
    recap: >
      PageRank is the stationary distribution of a damped random surfer,
      with the teleport term chosen specifically to force every transition
      probability strictly positive, which guarantees the irreducibility
      and aperiodicity that convergence to equilibrium needs.

    steps:
      - teach: >
          "How would you rank web pages by importance" is really asking whether
          you can turn a vague notion of importance into the equilibrium of a
          Markov chain you get to design.
      - teach: >
          The raw idea — importance is the fraction of time a link-following
          surfer spends on a page — is broken on a real link graph, because
          dead-end pages and disconnected regions make the naive chain neither
          irreducible nor reliably aperiodic.
      - teach: >
          The fix: with probability $d \approx 0.85$ follow a uniformly chosen
          outgoing link, and with probability $1-d$ teleport to a uniformly
          chosen page anywhere. That makes every entry of the transition matrix
          strictly positive, which implies both irreducibility and aperiodicity
          at once.
      - ask: >
          Suppose the damping factor is $d = 0.9$ instead of the standard
          $0.85$. What is the teleport probability, $1-d$?
        expects: "0.1"
        hint: >
          Subtract $d$ from $1$.
        feedback: >
          $1 - 0.9 = 0.1$.
      - teach: >
          Once irreducibility and aperiodicity are secured this mechanically,
          convergence to equilibrium is exactly the theorem already established
          for any such chain, computed in practice by power iteration $\mu
          \mapsto \mu P$, with error shrinking roughly like $d^{n}$.
      - ask: >
          With $d = 0.9$, by what factor has the power-iteration error shrunk
          after $3$ iterations?
        expects: "0.729"
        hint: >
          Use the error scaling $d^{n}$ with $n=3$.
        feedback: >
          $0.9^{3} = 0.729$.
      - ask: >
          Why does the teleport term guarantee both irreducibility and
          aperiodicity, rather than merely fixing dead ends?
        choices:
          - text: >
              Because it makes every entry of the transition matrix strictly
              positive, so every state reaches every other in one step, and a
              positive chance of an immediate return rules out any periodic
              rotation
            correct: true
            feedback: >
              Right — strict positivity of every entry is a single, stronger
              fact that implies both hypotheses mechanically, without checking
              either one directly.
          - text: >
              Because it removes all dead-end pages from the graph entirely
            feedback: >
              Teleporting doesn't delete any page — it patches the transition
              out of a dead end rather than removing the dead end itself.
          - text: >
              Because it forces $d = 1$ so the chain always follows links
            feedback: >
              This is backward — $d=1$ would mean no teleporting at all, which
              is exactly what breaks irreducibility and aperiodicity on a real
              link graph.
        feedback: >
          Strict positivity of every transition probability is what buys both
          hypotheses at once, since every state then reaches every other in
          exactly one step.
      - teach: >
          Describing the random-surfer model without explaining why the
          teleport term is necessary misses the actual interview point, and
          treating $d$ as an arbitrary tuning knob undersells the trade-off it
          actually controls: trust the link structure versus guarantee
          convergence.
      - teach: >
          PageRank is the stationary distribution of a damped random surfer,
          and the transferable idea is broader: any "importance" score is the
          equilibrium of a flow you define, patched wherever it breaks
          irreducibility or aperiodicity.
