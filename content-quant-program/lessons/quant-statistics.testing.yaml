unit: quant-statistics.testing
opening: >
  Hypothesis testing turns a hunch about a mean, a rate or a strategy into a
  pre-committed decision rule you can defend under pressure. This unit builds
  that machinery in the order an interview actually pressures it: name the
  null and the rejection rule, price the two ways a test can be wrong and the
  power that trades them off, read a p-value correctly and rule out its
  standard misreadings, then run the z-test and t-test recipes end to end and
  invert them into confidence intervals. It closes with the two questions
  that decide whether any of this mattered — how much data a target effect
  actually needs, and what happens to your error rate once you test more
  than one thing at a time.
lessons:
  - node: quant-statistics.testing.hypotheses
    hook: >
      Every interview testing question starts with the same unglamorous
      step: pin down a null hypothesis specific enough to compute
      probabilities under. Skip it and "fail to reject" quietly gets
      misquoted as "the null is true."
    explanation: >
      A test needs somewhere to stand — a hypothesis specific enough that
      you can actually compute $\Pr_{H_0}(T \in R)$ for a statistic $T$ of
      your choosing. That's the null's entire job description, not that
      it's the boring or default claim: it's the one law precise enough to
      hand you a sampling distribution to test against. The alternative can
      stay vague, because you never need its exact law, only the null's.

      Simple versus composite tracks exactly how much the null pins down. A
      simple null like $p = 0.5$ fixes the sampling law completely — one
      number, one distribution. A composite null like $\mu \le 0$ covers
      infinitely many laws at once, one for every value satisfying the
      constraint; testing it still works because the boundary value is the
      hardest one to distinguish from the alternative, so controlling the
      error there controls it everywhere in the null's range.

      The logic runs one direction only. A rejection region $R$, fixed
      before you look at data, is chosen so that data landing inside it
      would be rare under $H_0$ — rare enough to treat as evidence against
      it. Data landing outside $R$ only means this particular test had
      nothing to complain about; it never establishes that $H_0$ generated
      the data, since plenty of other laws would have produced the same
      unremarkable result just as easily. That asymmetry is why the
      vocabulary is "reject" or "fail to reject," never "accept."
    worked: >
      A pit boss suspects a die has been doctored to land on six more than
      it should. Formal setup: $H_0: p_6 = 1/6$ (simple — it pins the law
      exactly), $H_1: p_6 > 1/6$ (composite — every value above $1/6$
      satisfies it). The test statistic is $T$, the count of sixes in $60$
      rolls; under $H_0$, $T$ has an $\operatorname{Binomial}(60, 1/6)$ law
      with mean $10$. The rejection region is fixed before rolling:
      $R = \{T \ge 16\}$. Rolling the die and counting $17$ sixes lands $T$
      inside $R$, so the test rejects — not because $17$ "proves" the die
      is loaded, only because a fair die producing $17$ or more sixes in
      $60$ rolls is exactly the kind of event this pre-committed rule was
      built to flag.
    interview: >
      "Is this coin/pricing model/execution algorithm fair or unbiased"
      always wants the same three things named in order: the null stated
      precisely enough to compute with, the test statistic, and the
      pre-committed rejection region — before any mention of the actual
      data.
    pitfalls: >
      Saying "we accept $H_0$" when the data lands outside $R$ is never
      correct — the honest phrase is "fail to reject." Choosing the
      rejection region after seeing which way the data leans, rather than
      fixing it in advance, breaks the guarantee the whole framework rests
      on.
    recap: >
      A test pits a null precise enough to compute probabilities under
      against a looser alternative, with a rejection rule fixed in advance
      that can discredit the null but never confirm it.
    steps:
      - teach: >
          The null's job is not to be the "boring" or default claim — it's
          whichever hypothesis is precise enough to compute
          $\Pr_{H_0}(T \in R)$ under. The alternative can stay loose, because
          a test never needs to compute anything under $H_1$.
      - teach: >
          Simple versus composite tracks how much the null pins down. A
          simple null like $p = 0.5$ fixes one exact sampling law; a
          composite null like $\mu \le 0$ covers every law satisfying the
          inequality at once.
      - ask: >
          A quant tests a signal's daily variance with $H_0: \sigma^{2} = 4$
          against $H_1: \sigma^{2} \ne 4$. Is $H_0$ simple or composite?
        choices:
          - text: >
              Composite, since $H_1$ allows many values
            feedback: >
              The alternative's shape doesn't decide this — only what the
              null itself pins down does, and $H_0$ names one exact number.
          - text: >
              Simple, since it fixes $\sigma^{2}$ to exactly one value
            correct: true
            feedback: >
              Right: $\sigma^{2} = 4$ is one number, one sampling law — that
              is exactly what makes a null simple.
          - text: >
              Neither — that classification only applies to means, not
              variances
            feedback: >
              Simple versus composite is about how many laws a hypothesis
              names, not which parameter it names.
        feedback: >
          $H_0: \sigma^{2} = 4$ pins down one exact law, so it's simple; a
          null like $\sigma^{2} \ge 4$ would be composite, since it covers a
          whole range of laws.
      - teach: >
          A rejection region $R$ is fixed *before* the data arrives, chosen
          so that $\Pr_{H_0}(T \in R) \le \alpha$. That advance commitment is
          what turns the $\alpha$ you name into the false-alarm rate you
          actually get.
      - ask: >
          A researcher runs a backtest, looks at the resulting statistic, and
          only then decides which range of values counts as "rejecting."
          What breaks?
        choices:
          - text: >
              Nothing — $R$ can be chosen any time before the verdict is
              announced
            feedback: >
              The guarantee $\Pr_{H_0}(T \in R) \le \alpha$ is a promise
              about the procedure, made before data is seen — choosing $R$
              after looking at $T$ voids it.
          - text: >
              The pre-commitment guarantee on the false-alarm rate no longer
              holds
            correct: true
            feedback: >
              Exactly — $R$ chosen to match data already in hand can always
              be drawn around whatever happened, so the stated $\alpha$ stops
              meaning anything.
          - text: >
              $H_1$ becomes simple instead of composite
            feedback: >
              Choosing $R$ after the fact doesn't touch the alternative's
              shape at all — it invalidates the significance level.
        feedback: >
          Fixing $R$ in advance is what makes $\Pr_{H_0}(T \in R) \le \alpha$
          true; choose it after seeing $T$ and the number $\alpha$ no longer
          describes anything real.
      - teach: >
          The logic runs one direction: data landing in $R$ discredits $H_0$,
          but data landing outside $R$ only means this test found nothing to
          complain about — plenty of other laws would have produced the same
          unremarkable result.
      - ask: >
          A pit boss suspects a different die is biased toward showing a
          $2$. She commits to $H_0: p_2 = 1/6$ against $H_1: p_2 > 1/6$, with
          $T$ the count of $2$s in $90$ rolls. Under $H_0$, what is
          $\mathbb{E}[T]$?
        expects: "15"
        hint: >
          Under $H_0$, $T$ is $\operatorname{Binomial}(90, 1/6)$; its mean is
          $np$.
        feedback: >
          $\mathbb{E}[T] = 90 \times 1/6 = 15$ under $H_0$ — the same move
          the worked die example used to get a mean of $10$ from $60$ rolls.
      - teach: >
          "Fail to reject" is the only honest phrase for data outside $R$ —
          never "accept $H_0$." Interview prompts like "is this coin fair" or
          "does this signal have positive mean" want exactly this: the null
          stated precisely, the statistic, and the rejection region, before
          any data is mentioned.

  - node: quant-statistics.testing.type-errors
    hook: >
      Every "how confident are you" follow-up is really asking you to name
      a probability that depends on which hypothesis is actually true —
      and there are two different such probabilities, not one.
    explanation: >
      A Type I error rejects a true null; a Type II error fails to reject
      when a specific alternative is actually true. The first has one clean
      number, the size, held at the significance level $\alpha$ you choose
      before looking at data — it doesn't depend on which alternative is
      true, because it's computed entirely under $H_0$. The second, $\beta$,
      does depend on which alternative: an alternative barely different from
      the null is hard to catch, one far away is easy, so there is no single
      $\beta$, only a $\beta$ for every point in the alternative.

      Power, $1 - \beta$ at a given alternative, is the chance the test
      actually catches an effect of that size. Picture the null and
      alternative sampling distributions overlapping: the rejection region
      is a fixed slice carved out of the null's distribution to hold
      $\alpha$ area; power is however much of the alternative's distribution
      happens to fall in that same slice.

      That picture is also why the two errors trade off at fixed sample
      size. Pushing the rejection threshold outward to shrink $\alpha$
      shrinks the slice under the null's curve, but it shrinks by the same
      absolute amount under every alternative's curve too, raising $\beta$
      everywhere at once. The only way to lower both simultaneously is to
      bring in something new — more data, or a statistic with less inherent
      noise — which narrows both curves rather than just relocating the
      boundary between them.
    worked: >
      Screen $100$ traders for manipulative order flow, of whom $5$ are
      truly manipulative and $95$ are clean. Run a test with size
      $\alpha = 0.05$: applied to the $95$ clean traders, the expected
      number wrongly flagged is $95 \times 0.05 \approx 4.75$ — call it $5$
      innocent traders flagged purely from the Type I rate, batch after
      batch. Suppose the test also has power $0.70$ against the actual
      manipulation pattern used: of the $5$ genuinely manipulative traders,
      the expected number caught is $5 \times 0.70 = 3.5$, so about $1.5$
      slip through. Tightening $\alpha$ to $0.01$ would cut the false flags
      toward $1$, but drags power down too — fewer clean traders flagged,
      and fewer guilty ones caught.
    interview: >
      "What's the difference between a Type I and Type II error" is asked
      constantly, sometimes disguised as "what does a p-value of 0.05
      actually control." A sharp answer states that $\alpha$ is fixed and
      known by design while $\beta$ is a function of the true alternative,
      then names the fixed-$n$ tradeoff between them unprompted.
    pitfalls: >
      Quoting "the" Type II error as if it were a single number ignores
      that $\beta$ changes with every alternative considered. Believing a
      lower $\alpha$ is a free upgrade ignores that it raises $\beta$ at
      every alternative simultaneously, unless sample size or the statistic
      itself also changes.
    recap: >
      $\alpha$ is the false-alarm rate fixed by design under the null;
      $\beta$ is the miss rate that depends on which alternative is true,
      and shrinking one at fixed $n$ inflates the other.
    steps:
      - teach: >
          A Type I error rejects a true null; its probability is exactly
          $\alpha$, fixed before data, computed entirely under $H_0$ — it
          doesn't depend on which alternative is true.
      - teach: >
          A Type II error fails to reject when a specific alternative is
          actually true; its probability $\beta$ depends on *which*
          alternative — near the null it's hard to catch, far away it's
          easy. Power, $1-\beta$ at that alternative, is the chance the test
          actually catches it.
      - ask: >
          A screening test for fraudulent trades has size $\alpha = 0.02$,
          applied to $300$ confirmed-legitimate trades. How many of these
          legitimate trades are expected to be wrongly flagged?
        expects: "6"
        hint: >
          Multiply the false-positive rate by the number of legitimate
          trades it's applied to.
        feedback: >
          $300 \times 0.02 = 6$ legitimate trades flagged purely from the
          Type I rate — the same move that gave $4.75$ false flags from $95$
          clean traders at $\alpha = 0.05$ in the worked example.
      - teach: >
          The two errors trade off at fixed sample size. Pushing the
          rejection threshold outward to shrink $\alpha$ shrinks power at
          every alternative simultaneously; only more data or a less noisy
          statistic can lower both together.
      - ask: >
          A team tightens $\alpha$ from $0.05$ to $0.01$ without collecting
          more data or changing the statistic. What happens to power against
          a fixed alternative?
        choices:
          - text: >
              Power increases, since a stricter test is a better test
            feedback: >
              A stricter rejection region is smaller under every curve, not
              just the null's — it also shrinks how much of the alternative's
              distribution falls inside it.
          - text: >
              Power decreases
            correct: true
            feedback: >
              Right — shrinking $\alpha$ moves the rejection threshold
              outward, which shrinks the slice of the alternative's
              distribution that clears it too.
          - text: >
              Power stays the same, since it only depends on the alternative
            feedback: >
              Power depends on both the alternative and the threshold —
              moving the threshold without touching $n$ or the statistic
              changes power at every alternative.
        feedback: >
          At fixed $n$, a smaller $\alpha$ always costs power; only more data
          or a sharper statistic can improve both at once.
      - ask: >
          Applied to $40$ traders who are genuinely manipulative, this same
          test has power $0.65$ against the manipulation pattern used. How
          many of the $40$ are expected to slip through undetected?
        expects: "14"
        hint: >
          The expected miss count is $n$ times $\beta$, and $\beta = 1 -
          \text{power}$.
        feedback: >
          $40 \times (1 - 0.65) = 40 \times 0.35 = 14$ manipulative traders
          expected to go undetected — the same computation that left $1.5$
          of $5$ slipping through in the worked example.
      - teach: >
          $\alpha$ is chosen and known by design; $\beta$ is not a single
          number but a property of wherever the truth actually sits — "the"
          Type II error is always shorthand for one specific alternative.

  - node: quant-statistics.testing.power-curve
    hook: >
      The interview wants you to produce the power formula's derivation
      live, in about three lines, because the derivation is also the
      fastest way to remember which quantities push power up and which
      push it down.
    explanation: >
      Start from the rejection rule itself: reject when
      $\bar{x} > \mu_0 + z_{\alpha}\sigma/\sqrt{n}$, a threshold built
      entirely from the null. Power asks a different question about the
      same rule — if the true mean is actually $\mu_0 + \delta$, how often
      does $\bar{x}$ clear that same fixed threshold?

      Under the true mean, $\bar{x}$ is normal with mean $\mu_0 + \delta$
      and standard deviation $\sigma/\sqrt{n}$. Standardizing the threshold
      against this shifted distribution is the one load-bearing step:
      $\Pr(\bar{x} > \mu_0 + z_\alpha \sigma/\sqrt{n}) =
      \Pr\left(Z > z_\alpha - \dfrac{\delta\sqrt{n}}{\sigma}\right) =
      \Phi\left(\dfrac{\delta\sqrt{n}}{\sigma} - z_\alpha\right)$ —
      subtracting the shifted mean before standardizing is exactly what
      pulls a fresh term, $\delta\sqrt{n}/\sigma$, out of the threshold's
      own $z_\alpha$.

      Everything about power lives in that one ratio, the signal-to-noise
      ratio $\delta\sqrt{n}/\sigma$: a bigger true effect, more data, or
      less noise all move it up, and $\Phi$ is increasing, so power rises
      with each. Set $\delta = 0$ and the ratio collapses to $-z_\alpha$,
      giving power exactly $\alpha$ — a test is never less likely to fire
      under the null than its own level, a useful sanity check on any power
      calculation.
    worked: >
      Take an effect three tenths of a standard deviation, $\delta =
      0.3\sigma$, sample size $n = 64$, and a two-sided test at
      $\alpha = 0.05$, so $z_{\alpha/2} = 1.96$. The signal-to-noise ratio
      is $\delta\sqrt{n}/\sigma = 0.3 \times 8 = 2.4$, so power is
      $\Phi(2.4 - 1.96) = \Phi(0.44) \approx 0.67$ — roughly two chances in
      three of catching this effect at this sample size.
    interview: >
      "How does power depend on sample size and effect size" is answered by
      naming the ratio $\delta\sqrt{n}/\sigma$ directly, not by re-deriving
      from scratch. A fast follow-up — "what's the power exactly at the
      null" — checks that you know it equals $\alpha$.
    pitfalls: >
      Forgetting to use $z_{\alpha/2}$ in place of $z_\alpha$ for a
      two-sided test understates power (or overstates the sample size
      needed). Treating $\sigma$ as something power grows with, rather than
      shrinks with, inverts the formula's one negative dependence.
    recap: >
      Power is $\Phi(\delta\sqrt{n}/\sigma - z_\alpha)$ — a single
      increasing function of the signal-to-noise ratio
      $\delta\sqrt{n}/\sigma$, equal to $\alpha$ exactly at $\delta = 0$.
    steps:
      - teach: >
          Start from the rejection rule itself: reject when $\bar{x} > \mu_0
          + z_\alpha\sigma/\sqrt{n}$, a threshold built entirely from the
          null. Power asks how often $\bar{x}$ clears that same fixed
          threshold if the truth is actually $\mu_0 + \delta$.
      - teach: >
          Standardizing the threshold against the shifted distribution is
          the one load-bearing step: it pulls a fresh term,
          $\delta\sqrt{n}/\sigma$, out of the threshold's own $z_\alpha$,
          giving power $= \Phi(\delta\sqrt{n}/\sigma - z_\alpha)$.
      - ask: >
          For an effect $\delta = 0.4\sigma$ and $n = 49$, what is the
          signal-to-noise ratio $\delta\sqrt{n}/\sigma$?
        expects: "2.8"
        hint: >
          Multiply $\delta/\sigma$ by $\sqrt{n}$.
        feedback: >
          $0.4 \times \sqrt{49} = 0.4 \times 7 = 2.8$ — the whole content of
          power lives in this one ratio.
      - teach: >
          A bigger true effect, more data, or less noise all move that ratio
          up, and $\Phi$ is increasing, so power rises with each. At
          $\delta = 0$ the ratio collapses to $-z_\alpha$, a useful sanity
          check on any power calculation.
      - ask: >
          For a one-sided test at $\alpha = 0.05$ (so $z_\alpha = 1.645$),
          what is the power exactly at $\delta = 0$?
        expects: "0.05"
        hint: >
          Power at $\delta = 0$ is $\Phi(-z_\alpha)$, and $z_\alpha$ is
          defined so that $\Phi(-z_\alpha) = \alpha$ exactly.
        feedback: >
          Exactly $\alpha = 0.05$ — a test is never less likely to fire
          under the null than its own level.
      - teach: >
          Forgetting to swap in $z_{\alpha/2}$ for a two-sided test
          understates the power a two-sided test actually has, since
          $z_{\alpha/2} > z_\alpha$ makes the ratio's second term too large.
      - ask: >
          Same instance as above ($\delta = 0.4\sigma$, $n = 49$), but now
          one-sided at $\alpha = 0.05$. Using $\Phi(1.155) \approx 0.876$,
          what is the power?
        expects: "0.876"
        tolerance: 0.0005
        hint: >
          Power $= \Phi(\delta\sqrt{n}/\sigma - z_\alpha) = \Phi(2.8 -
          1.645)$.
        feedback: >
          $\Phi(2.8 - 1.645) = \Phi(1.155) \approx 0.876$ — roughly seven
          chances in eight of catching this effect at this sample size.
      - teach: >
          Power is one increasing function of one ratio,
          $\delta\sqrt{n}/\sigma$ — a bigger effect, more data, or a quieter
          statistic all push it, and its value, up.

  - node: quant-statistics.testing.pvalue
    hook: >
      "What's your p-value" has one correct definition and at least four
      common wrong ones — the interview is testing whether you can state
      the right one under pressure, not whether you've heard the term.
    explanation: >
      The p-value is a tail probability computed entirely under the null:
      $p = \Pr_{H_0}(T \ge t)$ for the observed value $t$, with the
      direction of "extreme" set by the alternative — the right tail for a
      right-tailed alternative, both tails for a two-sided one. Nothing
      about the alternative's own law enters the computation; only $H_0$'s
      law does.

      The reason it's worth computing rather than just comparing $T$ to one
      fixed threshold: rejecting whenever $p \le \alpha$ reproduces the
      level-$\alpha$ rejection region exactly, because $p$ is a strictly
      decreasing function of how extreme $t$ is. That makes $p$ the
      smallest significance level at which this particular data would have
      rejected — report it once, and every reader can apply their own
      $\alpha$ without you rerunning the test.

      There's a clean fact under the null worth having automatic: when $T$
      is continuous, $p$ itself is $\operatorname{Uniform}(0,1)$-distributed
      under $H_0$, which is exactly why $\Pr(p \le \alpha) = \alpha$ — the
      false-alarm rate you set is the false-alarm rate you get. With a
      discrete statistic the set of attainable p-values is coarse, so the
      true rejection probability sits at or below $\alpha$ rather than
      hitting it exactly — conservative, not exact.
    worked: >
      A one-sided test for a positive trading edge produces a standardized
      statistic $t = 1.8$. The p-value is
      $p = \Pr_{H_0}(T \ge 1.8) = 1 - \Phi(1.8) \approx 1 - 0.9641 = 0.0359$.
      Since $0.0359 \le 0.05$, this data would reject at the conventional
      $5\%$ level — and it's also the smallest level at which it would,
      since any $\alpha$ below $0.0359$ would fail to reject the same data.
    interview: >
      Precisely stating $p = \Pr_{H_0}(T \ge t)$ — under the null, oriented
      by the alternative — is the bar; "the probability the result is due
      to chance" or "the probability $H_0$ is true" both fail it
      immediately. A strong answer adds the smallest-rejecting-level
      reading unprompted.
    pitfalls: >
      Computing the tail probability under some other law than the null —
      the alternative, or the marginal distribution of the data — isn't a
      p-value at all. Reporting a p-value from a discrete statistic as if
      $\Pr(p \le \alpha) = \alpha$ exactly ignores that discreteness only
      gives a conservative bound.
    recap: >
      The p-value is $\Pr_{H_0}(T \ge t)$, oriented by the alternative —
      the smallest level at which the observed data would reject, and
      uniform on $(0,1)$ under the null when $T$ is continuous.
    steps:
      - teach: >
          The p-value is a tail probability computed entirely under the
          null: $p = \Pr_{H_0}(T \ge t)$, with the direction of "extreme" set
          by the alternative. Nothing about the alternative's own law enters
          the computation.
      - teach: >
          Rejecting whenever $p \le \alpha$ reproduces the level-$\alpha$
          rejection region exactly, because $p$ decreases as $t$ gets more
          extreme — so $p$ is the smallest significance level at which this
          data would have rejected.
      - ask: >
          A one-sided test produces a standardized statistic $t = 2.1$. Using
          $\Phi(2.1) \approx 0.9821$, what is the p-value $p =
          \Pr_{H_0}(T \ge 2.1)$?
        expects: "0.0179"
        tolerance: 0.0005
        hint: >
          For a right-tailed alternative, $p = 1 - \Phi(t)$.
        feedback: >
          $p = 1 - \Phi(2.1) \approx 1 - 0.9821 = 0.0179$ — this data would
          reject at any $\alpha \ge 0.0179$.
      - teach: >
          When $T$ is continuous, $p$ itself is
          $\operatorname{Uniform}(0,1)$-distributed under $H_0$ — the
          false-alarm rate you set is exactly the false-alarm rate you get.
          A discrete statistic makes this only conservative, not exact.
      - ask: >
          $T$ is continuous and $H_0$ is true. What is $\Pr(p \le 0.1)$?
        choices:
          - text: >
              $0.05$, since that's the conventional significance level
            feedback: >
              The conventional $\alpha = 0.05$ isn't part of this question —
              the uniformity fact holds for *any* threshold under a
              continuous $T$.
          - text: >
              $0.1$
            correct: true
            feedback: >
              Right — $p \sim \operatorname{Uniform}(0,1)$ under $H_0$ when
              $T$ is continuous, so $\Pr(p \le 0.1) = 0.1$ exactly.
          - text: >
              It can't be determined without knowing the alternative
            feedback: >
              This probability is computed entirely under $H_0$ — the
              alternative never enters it.
        feedback: >
          $\Pr(p \le \alpha) = \alpha$ exactly whenever $T$ is continuous,
          for every $\alpha$ — that's what makes $p \le 0.1$ have probability
          $0.1$ here.
      - teach: >
          With a discrete statistic the set of attainable p-values is
          coarse, so the true rejection probability sits at or below
          $\alpha$ rather than hitting it exactly — conservative, never
          exact.
      - ask: >
          A two-sided test produces $t = 1.3$. Using $\Phi(1.3) \approx
          0.9032$, what is $p = 2\Pr_{H_0}(T \ge 1.3)$?
        expects: "0.1936"
        tolerance: 0.0005
        hint: >
          Compute $2(1 - \Phi(1.3))$.
        feedback: >
          $2(1 - 0.9032) = 2 \times 0.0968 = 0.1936$ — far above any
          conventional $\alpha$, so this data would fail to reject.

  - node: quant-statistics.testing.pvalue-misreadings
    hook: >
      "A low p-value means the effect is probably real" is the single most
      common wrong sentence said in a stats interview, and naming exactly
      which fallacy it commits is worth more than any formula.
    explanation: >
      The p-value answers $\Pr(\text{data this extreme} \mid H_0)$; the
      sentence people want to say is about $\Pr(H_0 \mid \text{data})$ — a
      completely different conditional, related to the first only through
      Bayes' rule, which needs a prior on $H_0$ that the p-value never
      supplies. Swapping the order of a conditional probability is the same
      error as the prosecutor's fallacy, and it's the source of most of the
      other misreadings too.

      Two consequences worth having concrete. Because the p-value depends
      on sample size as much as on the true effect, it is not an effect
      size: with $n$ large enough, standardizing $\delta/(\sigma/\sqrt{n})$
      sends the statistic to infinity and $p$ to $0$ for literally any
      nonzero $\delta$, however economically tiny. And because a small $n$
      can leave a genuinely large effect underpowered, failing to reject is
      usually a low-power problem, not evidence that the effect is zero —
      it's the same distinction as "innocent" versus "not proven guilty."

      There's also no threshold in nature at $p = 0.05$: $0.049$ and
      $0.051$ carry essentially the same evidence, since $p$ is a
      continuous statistic, not a light switch. The discipline that
      survives all of this: quote the point estimate and its standard
      error first, and let the p-value answer only the narrow question it's
      built for.
    worked: >
      A signal earns an edge of just $0.001$ standard deviations per trade,
      economically negligible after any real transaction cost. Over
      $n = 10^{8}$ trades the standard error is $1/\sqrt{10^{8}} = 0.0001$
      (in units of $\sigma$), so the standardized statistic is
      $0.001 / 0.0001 = 10$ — a $z$ of $10$ carries a p-value on the order
      of $10^{-23}$. The print would read like the discovery of the decade;
      the underlying effect is still $0.001\sigma$ per trade, exactly as
      small as when the search began.
    interview: >
      "Does $p = 0.001$ mean this is a big effect" or "you failed to reject
      at $5\%$ — does that mean there's no edge" both test the same list:
      p-value is not a posterior, not an effect size, and a null result is
      not proof of nothing there. A fluent answer names which specific
      misreading is being tested.
    pitfalls: >
      Reading $1 - p$ as "the probability the result replicates" has no
      basis in the definition at all. Treating a large-sample significant
      result as automatically important skips straight past the size of
      the effect, which the p-value never measured.
    recap: >
      The p-value is a statement about data under the null, not about the
      probability the null is true, the size of the effect, or whether a
      null result means nothing is there.
    steps:
      - teach: >
          The p-value answers $\Pr(\text{data this extreme} \mid H_0)$; the
          sentence people want to say is about $\Pr(H_0 \mid \text{data})$ —
          a different conditional entirely, reachable only through Bayes'
          rule and a prior the p-value never supplies.
      - ask: >
          A test yields $p = 0.02$. Which is the correct reading?
        choices:
          - text: >
              There's a $2\%$ chance $H_0$ is true
            feedback: >
              That swaps the conditional — it needs a prior on $H_0$ that
              this computation never used.
          - text: >
              Data this extreme, or more, would occur $2\%$ of the time if
              $H_0$ were true
            correct: true
            feedback: >
              Right — that's the definition, nothing more, computed entirely
              under $H_0$.
          - text: >
              The effect explains $98\%$ of the variation
            feedback: >
              That confuses a tail probability with an effect size — the
              p-value says nothing about how large the effect is.
        feedback: >
          A p-value is a statement about the data given the null, never a
          statement about the null given the data.
      - teach: >
          The p-value is not an effect size: with $n$ large enough,
          standardizing sends the statistic to infinity and $p$ to $0$ for
          any nonzero effect, however economically tiny.
      - ask: >
          A signal earns just $0.0005$ standard deviations per trade. Over
          $n = 64{,}000{,}000$ trades the standard error is $1/\sqrt{n}$ (in
          units of $\sigma$). What is the resulting z-statistic,
          $0.0005 \times \sqrt{64{,}000{,}000}$?
        expects: "4"
        hint: >
          $\sqrt{64{,}000{,}000} = 8000$.
        feedback: >
          $0.0005 \times 8000 = 4$ — a decisively significant z-score from an
          effect that hasn't grown at all, purely because $n$ got large
          enough.
      - teach: >
          There's no threshold in nature at $p = 0.05$: $0.049$ and $0.051$
          carry essentially the same evidence, since $p$ is a continuous
          statistic, not a light switch.
      - ask: >
          A promising new strategy tested on limited data gives $p = 0.25$,
          so the test fails to reject at $5\%$. What's the honest
          conclusion?
        choices:
          - text: >
              The strategy has no edge
            feedback: >
              That treats "not proven" as "disproven" — the most common
              misreading of a null result.
          - text: >
              The test lacked power to detect edges of the observed size;
              the effect could still be real
            correct: true
            feedback: >
              Right — failing to reject on limited data is usually a
              low-power problem, not evidence the effect is zero.
          - text: >
              $H_0$ is definitely true
            feedback: >
              A test can only discredit $H_0$, never confirm it — this
              phrasing claims a confirmation the logic doesn't permit.
        feedback: >
          A null result on a small sample is "not proven," not "disproven" —
          the discipline is to quote the estimate and its standard error
          first, and let the p-value answer only its narrow question.

  - node: quant-statistics.testing.one-two-sided
    hook: >
      "Should this be one-sided or two-sided" is asked to catch a very
      specific cheat: picking the direction after seeing which way the
      data leans, which quietly doubles your real false-alarm rate.
    explanation: >
      A two-sided test of $\mu = \mu_0$ splits the $\alpha$ budget between
      both tails and rejects when $|z| \ge z_{\alpha/2}$ — $1.96$ at the
      conventional $5\%$. A one-sided test of $\mu > \mu_0$ spends the
      whole budget on one tail and rejects at the smaller threshold
      $z_\alpha$, $1.645$ at $5\%$. For a symmetric null law, the two-sided
      p-value is exactly twice the one-sided tail probability, since both
      tails contribute equally by symmetry.

      The direction has to be fixed before the data is seen, and the
      reason is arithmetic, not etiquette. If you look at the sign of
      $\hat{\mu}$ first and then decide to test in whichever direction the
      data happens to point, you've effectively built a rule that rejects
      on either tail depending on what showed up — the real Type I rate is
      the sum of both tails' probabilities under $H_0$, turning a nominal
      one-sided $5\%$ test into an actual $10\%$ test.

      Default to two-sided unless a deviation in the "wrong" direction is
      genuinely uninteresting — not merely unexpected. A pricing signal
      that works backwards, or a strategy that loses money in a way that
      would have been a discovery if it made money, is exactly the case
      where the unexpected direction still matters, so two-sided is the
      honest choice even when you privately expect one sign.
    worked: >
      A market maker tests whether a repriced quoting model shifts average
      slippage away from zero and observes $z = 1.75$. Committed to
      two-sided in advance: $|1.75| < 1.96$, fail to reject, with
      $p = 2(1 - \Phi(1.75)) \approx 2 \times 0.0401 = 0.0802$. Had the
      direction (slippage can only worsen) been fixed in advance as
      one-sided instead: $1.75 \ge 1.645$, reject, with $p \approx 0.0401$.
      Same data, opposite verdicts — which is exactly why the direction has
      to be nailed down before the data arrives, not after.
    interview: >
      "One-sided or two-sided here" is answered by first asking whether the
      opposite-direction outcome would still be interesting, then
      committing before any data is examined. A sharp follow-up, "what
      happens to your error rate if you pick the tail after looking," is
      answered with the doubled Type I rate.
    pitfalls: >
      Choosing one-sided purely because it's easier to reject with — a
      smaller critical value — without a genuine reason the opposite
      direction is uninteresting, invalidates the stated $\alpha$.
      Comparing a one-sided p-value directly to a two-sided critical value
      (or vice versa) silently uses the wrong threshold.
    recap: >
      Two-sided spends $\alpha$ on both tails ($1.96$) and one-sided spends
      it all on one ($1.645$) — cheap insurance against exactly the failure
      mode of picking the tail after seeing the data.
    steps:
      - teach: >
          The direction question is really about whether the "wrong-way"
          result would still matter. Picking the tail after seeing which way
          the data leans doubles your real false-alarm rate.
      - teach: >
          A two-sided test rejects when $|z| \ge z_{\alpha/2}$ ($1.96$ at
          $5\%$); a one-sided test rejects when $z \ge z_\alpha$ ($1.645$).
          For a symmetric null law, the two-sided p-value is exactly twice
          the one-sided tail probability.
      - ask: >
          Committed to a two-sided test in advance, a statistic comes out
          $z = 2.10$. Using $\Phi(2.1) \approx 0.9821$, what is the two-sided
          p-value?
        expects: "0.0357"
        tolerance: 0.0005
        hint: >
          Two-sided $p = 2(1 - \Phi(|z|))$.
        feedback: >
          $2(1 - 0.9821) = 2 \times 0.0179 = 0.0357$ — below $0.05$, so this
          data rejects at the conventional two-sided level.
      - teach: >
          The direction has to be fixed before the data is seen, and the
          reason is arithmetic: looking at the sign of $\hat{\mu}$ first and
          testing in whichever direction it points effectively rejects on
          either tail, turning a nominal $5\%$ one-sided test into a real
          $10\%$ test.
      - ask: >
          A researcher runs a two-sided test, sees the estimate is positive,
          then switches to a one-sided test in that direction before
          finalizing the verdict. What is the real Type I rate of this
          two-step procedure at a nominal $5\%$?
        choices:
          - text: >
              $5\%$
            feedback: >
              That's only true if the direction was fixed before the sign
              was seen — here it wasn't.
          - text: >
              $10\%$
            correct: true
            feedback: >
              Right — switching to whichever tail the data favors effectively
              tests both tails at $5\%$ each, doubling the real rate.
          - text: >
              $2.5\%$
            feedback: >
              That's the rate for *one* fixed tail of a two-sided test, the
              opposite of what happened here.
        feedback: >
          Choosing the tail after seeing the data's sign doubles the real
          false-alarm rate — the whole reason the direction is fixed in
          advance.
      - teach: >
          Default to two-sided unless a deviation in the "wrong" direction
          is genuinely uninteresting, not merely unexpected — a pricing
          signal that works backwards is exactly the case where it still
          matters.
      - ask: >
          Committed to a one-sided test in advance ($\alpha = 0.05$), a
          statistic comes out $z = 1.80$. Using $\Phi(1.8) \approx 0.9641$,
          what is the one-sided p-value?
        expects: "0.0359"
        tolerance: 0.0005
        hint: >
          One-sided $p = 1 - \Phi(z)$.
        feedback: >
          $1 - 0.9641 = 0.0359$, below $0.05$: this data rejects the
          one-sided test, since $1.80 \ge 1.645$ as well.
      - teach: >
          Two-sided costs $1.96$ instead of $1.645$ — cheap insurance against
          the doubled error rate that picking the tail after the fact would
          otherwise cause.

  - node: quant-statistics.testing.ztest
    hook: >
      "Test whether this sample mean differs from zero" is the single most
      common quant stats question, and the z-test recipe needs to come out
      in one breath, cold.
    explanation: >
      The z-test is licensed whenever the statistic's null law is
      approximately normal — either because $\sigma$ is genuinely known, or
      because $n$ is large enough that the sample mean's own distribution
      has already collapsed into a normal shape regardless of the
      underlying data's shape. That collapse is exactly what makes
      standardizing legal: with $\bar{x}$ approximately
      $\operatorname{Normal}(\mu_0, \sigma^2/n)$ under $H_0$,
      $z = (\bar{x} - \mu_0)/(\sigma/\sqrt{n})$ is approximately standard
      normal, and every subsequent step just reads off a fixed table.

      The recipe: fix $H_0$ so it pins down $\mu_0$ and the null standard
      deviation; form $z = (\bar{x} - \mu_0)/(\sigma/\sqrt{n})$; compare
      $|z|$ to $z_{\alpha/2}$, or convert to $p = 2(1 - \Phi(|z|))$; report
      the estimate with its uncertainty, $\bar{x} \pm
      z_{\alpha/2}\sigma/\sqrt{n}$, alongside the verdict rather than the
      verdict alone. For a proportion, the null variance is $p_0(1-p_0)$ —
      the value fixed by $H_0$, not whatever the sample happened to
      produce, since the whole computation runs under the null.

      Three quantiles earn automatic recall because they set every
      two-sided threshold in this unit: $1.645$, $1.96$, $2.576$ for
      $90\%$, $95\%$, $99\%$ two-sided confidence.
    worked: >
      A strategy's daily returns over $n = 100$ days average
      $\bar{x} = 0.5\%$, against a known historical daily volatility
      $\sigma = 2\%$. Testing $H_0: \mu = 0$ two-sided:
      $z = 0.005 / (0.02/\sqrt{100}) = 0.005/0.002 = 2.5$, giving
      $p = 2(1 - \Phi(2.5)) \approx 2 \times 0.0062 = 0.0124$ — reject at
      $5\%$. The accompanying interval,
      $0.5\% \pm 1.96 \times 0.2\% = [0.108\%, 0.892\%]$, excludes zero,
      consistent with the rejection.
    interview: >
      "Walk me through testing whether this sample mean is significantly
      different from zero" wants the four-step recipe produced without
      hesitation, including naming the CLT (or known $\sigma$) as the
      reason the normal table applies at all. A common trap swaps in a
      proportion and checks whether you use $p_0(1-p_0)$, not the sample's
      own variance.
    pitfalls: >
      Plugging the sample's own standard deviation into the proportion
      variance instead of the null value $p_0(1-p_0)$ computes the wrong
      test entirely. Reaching for a z-test with $\sigma$ genuinely unknown
      and $n$ too small for the CLT to have taken hold silently understates
      the true uncertainty — that's exactly the gap the t-test exists to
      close.
    recap: >
      Standardize $\bar{x}$ by its null standard error and compare to the
      normal table — legal whenever $\sigma$ is known or $n$ is large
      enough for the CLT to apply, with $1.645/1.96/2.576$ as the three
      thresholds to know cold.
    steps:
      - teach: >
          The z-test is licensed whenever the statistic's null law is
          approximately normal — $\sigma$ genuinely known, or $n$ large
          enough that $\bar{x}$'s own distribution has already collapsed
          into a normal shape.
      - teach: >
          The recipe: form $z = (\bar{x} - \mu_0)/(\sigma/\sqrt{n})$, compare
          $|z|$ to $z_{\alpha/2}$ or convert to $p = 2(1 - \Phi(|z|))$, and
          report the estimate with its uncertainty,
          $\bar{x} \pm z_{\alpha/2}\sigma/\sqrt{n}$, alongside the verdict.
      - ask: >
          A strategy's daily returns over $n = 64$ days average $\bar{x} =
          1.2\%$, against a known $\sigma = 4\%$. Testing $H_0: \mu = 0$,
          what is $z = (\bar{x} - \mu_0)/(\sigma/\sqrt{n})$?
        expects: "2.4"
        hint: >
          $\sigma/\sqrt{n} = 4\%/8 = 0.5\%$.
        feedback: >
          $z = 1.2\%/0.5\% = 2.4$.
      - teach: >
          For a proportion, use the null variance $p_0(1-p_0)$, not the
          sample's own — the entire computation runs under $H_0$, and that
          includes the variance it standardizes by.
      - ask: >
          A signal fires "positive" on $58$ of the last $100$ days. Testing
          $H_0: p = 0.5$ with the null variance, what is $z$?
        expects: "1.6"
        hint: >
          The null standard error is $\sqrt{p_0(1-p_0)/n} = \sqrt{0.25/100}
          = 0.05$.
        feedback: >
          $z = (0.58 - 0.5)/0.05 = 0.08/0.05 = 1.6$ — using $p_0(1-p_0)$, not
          $0.58 \times 0.42$, since $H_0$ fixes the variance too.
      - teach: >
          Three quantiles earn automatic recall, since they set every
          two-sided threshold in this unit: $1.645$, $1.96$, $2.576$ for
          $90\%$, $95\%$, $99\%$ two-sided confidence.
      - ask: >
          Using the $n = 64$ instance above ($\bar{x} = 1.2\%$,
          $\sigma/\sqrt{n} = 0.5\%$), what is the upper endpoint of the
          $95\%$ interval $\bar{x} + 1.96 \times \sigma/\sqrt{n}$, in
          percent?
        expects: "2.18"
        tolerance: 0.0005
        hint: >
          $1.96 \times 0.5\% = 0.98\%$.
        feedback: >
          $1.2\% + 0.98\% = 2.18\%$ — the full interval is $[0.22\%,
          2.18\%]$, excluding zero, consistent with the rejection.
      - teach: >
          Reaching for a z-test with $\sigma$ genuinely unknown and $n$ too
          small for the CLT to have taken hold understates the true
          uncertainty — exactly the gap the t-test exists to close.

  - node: quant-statistics.testing.coin-sixty-heads
    hook: >
      A borderline z-score right at the classroom-famous "$z = 2$, reject
      at $5\%$" threshold is exactly where the normal approximation's own
      error matters most — the interview wants you to know that, not just
      recompute $z$.
    explanation: >
      Raw counts are discrete; the normal curve used to approximate them is
      continuous and assigns zero probability to any single point.
      Comparing a count like $60$ directly against a continuous curve, with
      no adjustment, systematically overstates how extreme it looks,
      because the entire probability "belonging" to the integer $60$ gets
      counted as if it sat exactly at the boundary rather than spread
      across $[59.5, 60.5]$.

      That's the whole content of the continuity correction: shift the
      boundary by half a unit toward the observed count before
      standardizing. It matters most exactly at round, borderline-looking
      z-scores — a raw $z$ of $2.0$ can visibly cross a nominal threshold
      while the corrected value, or the exact binomial probability, sits
      just on the other side of it. When a z-score lands close to a
      critical value, treat that as a signal to check the exact or
      corrected version, not as a stronger result.

      Scale is what actually resolves ambiguity, not squinting at the third
      decimal of a borderline p-value: the identical proportion at ten
      times the sample size pushes $z$ up by a factor of $\sqrt{10}$,
      moving a coin-flip verdict from "inside the approximation's own error
      bars" to "not remotely in question."
    worked: >
      Suppose $220$ heads turn up in $400$ tosses. Under $H_0: p=0.5$, the
      mean is $200$ and the standard deviation is
      $\sqrt{400 \times 0.25} = 10$, so the naive $z = (220-200)/10 = 2.0$
      and two-sided $p = 2(1-\Phi(2)) = 0.0455$ — a bare rejection at
      $5\%$. With the continuity correction, $z = (219.5-200)/10 = 1.95$,
      giving $p \approx 2(1-\Phi(1.95)) \approx 0.0512$ — now just short of
      rejecting. As with the classic $100$-toss version, the honest
      verdict at $400$ tosses and a $55\%$ rate sits right inside the
      approximation's own error margin.
    interview: >
      "$60$ heads out of $100$ — is the coin biased" is the textbook
      prompt, and the strong answer computes the naive $z$, then volunteers
      the continuity-corrected or exact version without being asked, naming
      the direction the correction moves the answer.
    pitfalls: >
      Reporting only the naive z-score on a borderline count and stopping
      there misses that the correction (or the exact binomial) can flip the
      verdict. Applying the continuity correction in the wrong direction —
      shifting away from the observed count instead of toward it — makes
      the approximation worse, not better.
    recap: >
      A borderline naive z-score deserves the continuity correction or the
      exact binomial before trusting the verdict — the correction alone can
      flip a bare rejection into a bare non-rejection.
    steps:
      - teach: >
          Raw counts are discrete; the normal curve used to approximate them
          is continuous and assigns zero probability to any single point.
          Comparing a count directly against it, with no adjustment,
          systematically overstates how extreme it looks.
      - teach: >
          The continuity correction shifts the boundary half a unit toward
          the observed count before standardizing. It matters most exactly
          at round, borderline-looking z-scores.
      - ask: >
          Suppose $61$ heads turn up in $100$ tosses. Under $H_0: p = 0.5$,
          the mean is $50$ and the standard deviation is $5$. What is the
          naive $z = (61 - 50)/5$?
        expects: "2.2"
        hint: >
          Divide the gap between the count and the mean by the standard
          deviation.
        feedback: >
          $z = 11/5 = 2.2$ — comfortably past $1.96$, a naive rejection at
          $5\%$.
      - ask: >
          Same instance, now with the continuity correction: what is $z =
          (60.5 - 50)/5$?
        expects: "2.1"
        hint: >
          Shift the boundary half a unit toward $61$ before subtracting the
          mean.
        feedback: >
          $z = 10.5/5 = 2.1$ — smaller than the naive $2.2$, since the
          correction pulls the boundary back toward the observed count.
      - teach: >
          Scale, not squinting at the third decimal of a borderline
          p-value, is what actually resolves ambiguity: the identical
          proportion at ten times the sample size pushes $z$ up by a factor
          of $\sqrt{10}$.
      - ask: >
          Which statement about the continuity correction is correct?
        choices:
          - text: >
              It always makes the z-score more extreme
            feedback: >
              The opposite happens for a count above the mean: shifting the
              boundary toward the observed count pulls $z$ *toward* zero.
          - text: >
              It shifts the boundary half a unit toward the observed count,
              pulling the z-score toward zero when the count sits above the
              mean
            correct: true
            feedback: >
              Right — the correction credits the whole probability
              "belonging" to the integer as spread across a unit interval
              around it, not concentrated at the boundary.
          - text: >
              It only matters for two-sided tests
            feedback: >
              The correction adjusts the statistic itself, before any
              comparison to a one- or two-sided threshold.
        feedback: >
          The correction moves the boundary half a unit toward the observed
          count — for a count above the mean, that pulls $z$ down, which is
          exactly why it can flip a bare rejection into a bare
          non-rejection.
      - teach: >
          A borderline naive z-score is a signal to check the corrected or
          exact version, not a stronger result — treat "close to a critical
          value" as a prompt to look closer, not to stop looking.

  - node: quant-statistics.testing.t-distribution
    hook: >
      "Why can't I just use the z-table when I don't know $\sigma$" is
      answered by naming exactly what estimating $\sigma$ from the same
      small sample costs you — extra tail weight, not just a formality.
    explanation: >
      Swap the unknown $\sigma$ for the sample standard deviation $s$ and
      the standardized quantity is no longer exactly standard normal,
      because $s$ itself carries sampling noise. When $s$ happens to land
      small by chance, dividing by it inflates $|t|$ beyond what the same
      data would have produced against the true $\sigma$ — an extra source
      of spread that has to show up somewhere in the resulting law's shape.

      That extra spread is fat tails: for iid normal data,
      $t = (\bar{x}-\mu)/(s/\sqrt{n})$ follows the t-distribution with
      $\nu = n-1$ degrees of freedom, constructed as a standard normal
      divided by an independent estimate of its own scale,
      $Z/\sqrt{V/\nu}$ with $V \sim \chi^2_\nu$. Symmetric about $0$ like
      the normal, but with variance $\nu/(\nu-2)$ — strictly larger than
      $1$ for every finite $\nu$, and not even defined once $\nu \le 2$, a
      warning that very small samples can leave $s$ too unstable to trust
      at all.

      The degrees of freedom set exactly how much premium you pay:
      two-sided $95\%$ critical values run $2.776$ at $\nu=4$, $2.228$ at
      $\nu=10$, $2.042$ at $\nu=30$, closing in on the normal's $1.96$ only
      as $\nu$ grows large — the smaller the sample, the more the fat tail
      insures against having estimated the noise level from that same
      small sample.
    worked: >
      With $n=6$ observations ($\nu=5$), a computed statistic comes out
      $|t|=2.4$. The two-sided $5\%$ critical value at $\nu=5$ is $2.571$,
      so $2.4 < 2.571$: fail to reject. Reading the same statistic off the
      z-table instead — $1.96$ — would have wrongly rejected, since
      $2.4 > 1.96$; that gap is exactly the tail-weight premium the
      t-distribution charges for not knowing $\sigma$ at such a small $n$.
    interview: >
      "Why does the t-distribution have fatter tails than the normal"
      wants the estimation-noise explanation, not just "because degrees of
      freedom." A fast follow-up, "what happens as $\nu \to \infty$," is
      answered by naming convergence to the standard normal, since $s$
      becomes an essentially exact estimate of $\sigma$ at large $n$.
    pitfalls: >
      Using the z critical value $1.96$ at small $n$ because "it's close
      enough" understates the true uncertainty exactly where it matters
      most. Forgetting that the t-distribution's variance itself is
      undefined for $\nu \le 2$ can lead to nonsensical variance claims at
      very small samples.
    recap: >
      Standardizing by the estimated $s$ instead of the true $\sigma$ turns
      the exact standard normal into the fatter-tailed $t_{n-1}$,
      converging back to normal only as the degrees of freedom grow.
    steps:
      - teach: >
          Swap the unknown $\sigma$ for the sample standard deviation $s$
          and the standardized quantity is no longer exactly standard
          normal, because $s$ itself carries sampling noise — an extra
          source of spread that shows up as fatter tails.
      - teach: >
          For iid normal data, $t = (\bar{x}-\mu)/(s/\sqrt{n})$ follows the
          $t_{n-1}$ law, symmetric about $0$ with variance $\nu/(\nu-2)$ for
          $\nu > 2$, undefined once $\nu \le 2$.
      - ask: >
          What is $\operatorname{Var}(t)$ for $\nu = 8$ degrees of freedom?
        expects: "4/3"
        tolerance: 0.0005
        hint: >
          $\operatorname{Var}(t) = \nu/(\nu - 2)$.
        feedback: >
          $8/(8-2) = 8/6 = 4/3$ — strictly larger than $1$, the extra spread
          from estimating $\sigma$.
      - teach: >
          The degrees of freedom set exactly how much premium you pay:
          two-sided $95\%$ critical values run $2.776$ at $\nu=4$, $2.228$
          at $\nu=10$, $2.042$ at $\nu=30$, closing in on the normal's
          $1.96$ only as $\nu$ grows.
      - ask: >
          A test with $\nu = 10$ produces $|t| = 2.5$. Using the two-sided
          $5\%$ critical value $2.228$, what's the verdict?
        choices:
          - text: >
              Reject
            correct: true
            feedback: >
              Right — $2.5 > 2.228$, so this clears the $t_{10}$ threshold.
          - text: >
              Fail to reject
            feedback: >
              $2.5$ is larger than the critical value $2.228$, not smaller —
              this rejects.
          - text: >
              Can't tell without the exact p-value
            feedback: >
              Comparing $|t|$ directly to the critical value is enough; the
              exact p-value isn't needed to reach a verdict.
        feedback: >
          $2.5 > 2.228$: reject at $\nu = 10$. Reading the same $2.5$ off the
          $z$-table's $1.96$ would have rejected too, but for the wrong
          reason at small $\nu$.
      - teach: >
          Using $1.96$ at small $n$ because "it's close enough" understates
          the true uncertainty exactly where it matters most — the fat tail
          is the price of estimating the noise level from the same small
          sample that produced $\bar{x}$.
      - ask: >
          What is the two-sided $95\%$ critical value for $\nu = 30$?
        expects: "2.042"
        tolerance: 0.0005
        hint: >
          It's one of the three values worth having memorized:
          $2.776$/$2.228$/$2.042$ at $\nu = 4/10/30$.
        feedback: >
          $2.042$ — already close to the normal's $1.96$, which is why the
          t-test and z-test nearly agree past $n \approx 30$.
      - teach: >
          Everything about the t-distribution is the normal paying a
          premium for one estimated quantity — the premium shrinks as $\nu$
          grows because $s$ becomes an ever more exact estimate of $\sigma$.

  - node: quant-statistics.testing.ttest
    hook: >
      "Z-test or t-test" is a fast diagnostic question, and the correct
      answer hinges on whether $\sigma$ is known — not, strictly, on sample
      size, even though small $n$ is where the choice actually bites.
    explanation: >
      The t-test is the z-test recipe unchanged except for two swaps: the
      sample standard deviation $s$ in place of the true $\sigma$, and the
      $t_{n-1}$ table in place of the normal table. Compute
      $t = (\bar{x}-\mu_0)/(s/\sqrt{n})$ and reject when
      $|t| \ge t_{n-1,\alpha/2}$.

      The swap matters enormously at small $n$ and almost not at all past
      roughly $n \approx 30$: at $n=5$, the critical value $2.776$ is over
      $40\%$ wider than the normal's $1.96$, so treating a small sample
      with the z-table's thinner tails would falsely reject far more often
      than the stated $\alpha$ promises. As $n$ grows, $s$ becomes a nearly
      exact estimate of $\sigma$ and the two tests converge.

      Its hypothesis is approximately normal underlying data, or an $n$
      large enough that $\bar{x}$ itself is close to normal by the CLT — it
      tolerates mild skew reasonably well, but not heavy tails or serial
      dependence in the raw data. Daily P&L typically has both, so a raw
      t-statistic on daily returns tends to overstate significance relative
      to what the formula assumes.

      For paired data — the same units measured twice, matched trades,
      before/after — reduce the two series to their differences
      $d_i = x_i - y_i$ first, then run the one-sample t-test on those
      differences alone; this sidesteps ever having to model the
      correlation between the two series directly.
    worked: >
      Over $n=25$ trading days, a strategy's mean daily return is
      $\bar{x}=0.5\%$ with sample standard deviation $s=1\%$. Testing
      $H_0: \mu=0$: $t = 0.005/(0.01/\sqrt{25}) = 0.005/0.002 = 2.5$. With
      $\nu=24$, the two-sided $5\%$ critical value is about $2.064$, and
      $2.5 > 2.064$: reject. Using the z critical value $1.96$ instead
      would have reached the same verdict here, but only because $n=25$
      already sits close to where the two tests agree.
    interview: >
      "When do you use a t-test instead of a z-test" is answered with
      $\sigma$ unknown and estimated from the data, not just "small
      sample" — then volunteer that the practical bite is concentrated at
      small $n$. A common follow-up asks about paired versus independent
      data, checking that you reduce paired data to differences first.
    pitfalls: >
      Running an unpaired test on two series that share a common source of
      noise — the same trading day, the same market regime — throws away
      the variance reduction pairing would have bought and can miss a real
      effect. Running a raw t-test on daily P&L without acknowledging fat
      tails or serial correlation overstates the significance the formula
      actually earns.
    recap: >
      The t-test standardizes by $s/\sqrt{n}$ and reads the $t_{n-1}$ tail
      instead of the normal — nearly identical to the z-test past
      $n \approx 30$, materially wider at small $n$, and only valid for
      independent, roughly normal draws.
    steps:
      - teach: >
          The t-test is the z-test recipe with two swaps: $s$ in place of
          $\sigma$, and the $t_{n-1}$ table in place of the normal table.
          Compute $t = (\bar{x}-\mu_0)/(s/\sqrt{n})$ and reject when
          $|t| \ge t_{n-1,\alpha/2}$.
      - teach: >
          The swap matters enormously at small $n$: at $n=5$ the critical
          value $2.776$ is over $40\%$ wider than the normal's $1.96$. Past
          $n \approx 30$, $s$ is a nearly exact estimate of $\sigma$ and the
          two tests converge.
      - ask: >
          By what percentage is the $n=5$ critical value $2.776$ wider than
          the normal's $1.96$?
        expects: "41.63%"
        tolerance: 0.0005
        hint: >
          Compute $(2.776/1.96 - 1) \times 100\%$.
        feedback: >
          $2.776/1.96 - 1 \approx 0.4163$, about $41.6\%$ wider — treating a
          small sample with the normal's thinner tails would falsely reject
          far more often than the stated $\alpha$ promises.
      - teach: >
          Its hypothesis is approximately normal data, or $n$ large enough
          for $\bar{x}$ itself to be close to normal — it tolerates mild
          skew, but not the heavy tails and serial dependence typical of
          daily P&L.
      - ask: >
          Over $n = 16$ trading days, a strategy's mean daily return is
          $\bar{x} = 0.8\%$ with sample standard deviation $s = 2\%$. What
          is $t = (\bar{x} - 0)/(s/\sqrt{n})$?
        expects: "1.6"
        hint: >
          $s/\sqrt{n} = 2\%/4 = 0.5\%$.
        feedback: >
          $t = 0.8\%/0.5\% = 1.6$ — with $\nu = 15$, the two-sided $5\%$
          critical value is $2.131$, so $1.6 < 2.131$: fail to reject.
      - teach: >
          For paired data — the same units measured twice, matched trades,
          before and after — reduce the two series to their differences
          $d_i = x_i - y_i$ first, then run the one-sample t-test on those
          differences alone.
      - ask: >
          Two strategies trade the same instrument and are compared on
          $30$ matched trading days. Which test correctly uses that
          matching?
        choices:
          - text: >
              An unpaired t-test on the two series' separate daily returns
            feedback: >
              Treating the two series as independent throws away the fact
              that they're matched on the same days.
          - text: >
              A one-sample t-test on the $30$ daily differences
            correct: true
            feedback: >
              Right — reducing matched observations to their differences and
              testing those is exactly the paired form.
          - text: >
              A z-test with a known $\sigma$
            feedback: >
              Nothing here says $\sigma$ is known — the question is about
              pairing, not about which table to read.
        feedback: >
          Paired data reduces to a one-sample t-test on the differences
          $d_i$ — it sidesteps ever having to model the correlation between
          the two series directly.
      - teach: >
          Nearly identical to the z-test past $n \approx 30$, materially
          wider at small $n$ — and only trustworthy for independent, roughly
          normal draws, which daily P&L rarely is.

  - node: quant-statistics.testing.two-sample
    hook: >
      "Compare two trading strategies' returns" is asked constantly, and
      the two things that separate a strong answer from a rote one are
      reaching for Welch's test by default and pairing whenever the two
      series see the same shocks.
    explanation: >
      For two independent samples, the natural statistic is the
      standardized difference of means,
      $t = (\bar{x}_1-\bar{x}_2)/\sqrt{s_1^2/n_1 + s_2^2/n_2}$ — the
      denominator is just the variance-of-a-difference formula,
      $\operatorname{Var}(\bar{x}_1) + \operatorname{Var}(\bar{x}_2)$, since
      independent variances add. Welch's version lets $s_1^2/n_1$ and
      $s_2^2/n_2$ differ freely and uses a fractional degrees-of-freedom
      correction; the pooled-variance alternative assumes the two
      populations share one true variance, an assumption rarely worth
      making for two different strategies or two different assets.

      Pairing changes the comparison entirely, and it's worth reaching for
      whenever the two series are measured on the same underlying event —
      the same trading day, the same client. With equal variances $\sigma^2$
      and correlation $\rho$ between the matched pair,
      $\operatorname{Var}(x_1-x_2) = \operatorname{Var}(x_1) +
      \operatorname{Var}(x_2) - 2\operatorname{Cov}(x_1,x_2) =
      2\sigma^2 - 2\rho\sigma^2 = 2\sigma^2(1-\rho)$ — the correlation term
      subtracts directly, so any shared shock cancels out of the difference
      rather than adding uncertainty to both sides independently.

      The bigger $\rho$ is, the more this buys: comparing two strategies
      day by day, so the shared market factor cancels inside each day's
      difference, is exactly this move in practice, and it's why paired
      comparisons of correlated series routinely find significance that an
      unpaired comparison of the same two series' separate averages would
      miss entirely.
    worked: >
      Two strategies each have daily standard deviation $\sigma = 2\%$ and
      same-day correlation $\rho=0.6$. Unpaired, the difference's standard
      error is $\sqrt{2 \times (0.02)^2} = \sqrt{0.0008} \approx 2.83\%$.
      Paired, it's
      $\sqrt{2 \times (0.02)^2 \times (1-0.6)} = \sqrt{0.00032} \approx
      1.79\%$ — about $37\%$ smaller, equivalent to running the unpaired
      comparison with roughly $1/(1-0.6) = 2.5$ times as much data.
    interview: >
      "How would you test whether strategy A outperforms strategy B" should
      default to Welch, not pooled variance, unless there's a real reason
      to assume equal variances — and should immediately ask whether the
      two series share a common driver worth pairing on.
    pitfalls: >
      Using the pooled-variance test out of habit when the two series
      plainly have different variances biases the standard error.
      Comparing two strategies' separately-averaged returns instead of
      pairing them day by day throws away the variance reduction that
      cancels the shared market factor.
    recap: >
      Welch's test is the default for independent samples; pairing
      observations that share a common shock cuts the standard error by a
      factor of $\sqrt{1-\rho}$ instead of leaving the full, uncancelled
      variance in the comparison.
    steps:
      - teach: >
          For two independent samples, the natural statistic standardizes
          the difference of means by its own standard error,
          $\sqrt{s_1^2/n_1 + s_2^2/n_2}$ — just the variance-of-a-difference
          formula, since independent variances add.
      - teach: >
          Welch's version lets $s_1^2/n_1$ and $s_2^2/n_2$ differ freely with
          a fractional degrees-of-freedom correction; the pooled-variance
          alternative assumes one shared true variance, rarely worth
          assuming for two different strategies.
      - ask: >
          Strategy A has $\bar{x}_1 = 3\%$, $s_1 = 2\%$, $n_1 = 25$; Strategy
          B has $\bar{x}_2 = 2\%$, $s_2 = 3\%$, $n_2 = 100$. What is Welch's
          $t = (\bar{x}_1 - \bar{x}_2)/\sqrt{s_1^2/n_1 + s_2^2/n_2}$?
        expects: "2"
        hint: >
          $s_1^2/n_1 = 4/25 = 0.16$ and $s_2^2/n_2 = 9/100 = 0.09$.
        feedback: >
          $\sqrt{0.16 + 0.09} = \sqrt{0.25} = 0.5$, so $t = (3-2)/0.5 = 2$.
      - teach: >
          Pairing changes the comparison entirely: with correlation $\rho$
          between the matched pair, $\operatorname{Var}(x_1-x_2) =
          2\sigma^2(1-\rho)$ — the correlation term subtracts directly, so
          any shared shock cancels rather than adding uncertainty to both
          sides.
      - ask: >
          Two matched series share correlation $\rho = 0.84$ and equal
          variances. By what factor does pairing reduce the standard error
          relative to treating them as unpaired?
        expects: "2.5"
        hint: >
          The unpaired standard error is $\sqrt{2\sigma^2}$; the paired one
          is $\sqrt{2\sigma^2(1-\rho)}$ — their ratio is
          $1/\sqrt{1-\rho}$.
        feedback: >
          $1/\sqrt{1 - 0.84} = 1/\sqrt{0.16} = 1/0.4 = 2.5$ — pairing here is
          worth two and a half times the unpaired precision.
      - teach: >
          The bigger $\rho$ is, the more this buys: comparing two strategies
          day by day, so the shared market factor cancels inside each day's
          difference, is exactly this move in practice.
      - ask: >
          Two strategies trade the same underlying futures contract and see
          nearly identical daily P&L swings from macro news. Which test
          captures this correctly?
        choices:
          - text: >
              Welch's test on the two series' separately averaged returns
            feedback: >
              That throws away the cancellation pairing would buy — the
              shared macro shock inflates both series' variance instead of
              cancelling.
          - text: >
              A paired test on the daily differences between the two
              strategies
            correct: true
            feedback: >
              Right — differencing day by day cancels the shared shock
              before any variance is computed.
          - text: >
              A pooled-variance test assuming the two strategies share one
              true variance
            feedback: >
              That's an unrelated assumption about the two series'
              variances, not about whether they share a common shock.
        feedback: >
          Whenever two series see the same underlying event, pairing on it
          — not pooling or treating them as independent — is what cancels
          the shared shock.
      - teach: >
          Welch is the default for two independent samples; pairing on a
          shared shock is a separate, usually larger, lever that a merely
          independent test leaves entirely on the table.

  - node: quant-statistics.testing.ci
    hook: >
      "Give me a range, not a point estimate" is really asking you to
      invert the test you already know how to run — a confidence interval
      and a hypothesis test are the same computation viewed from two
      directions.
    explanation: >
      A $1-\alpha$ confidence interval for $\theta$ is a random interval
      $C(X)$, built from the data, satisfying
      $\Pr_\theta(\theta \in C(X)) \ge 1-\alpha$ for every possible true
      $\theta$ — a promise about the procedure that generates the interval,
      made before any data is collected, not a claim about one particular
      interval after the fact. The canonical interval for a mean is
      $\bar{x} \pm z_{\alpha/2}\sigma/\sqrt{n}$, or
      $\bar{x} \pm t_{n-1,\alpha/2}\,s/\sqrt{n}$ once $\sigma$ has to be
      estimated.

      The duality with testing falls straight out of the rejection rule:
      the two-sided level-$\alpha$ z-test rejects $\mu_0$ exactly when
      $|\bar{x}-\mu_0| > z_{\alpha/2}\sigma/\sqrt{n}$, which is precisely
      the statement that $\mu_0$ lies outside
      $[\bar{x}-z_{\alpha/2}\sigma/\sqrt{n},\ \bar{x}+z_{\alpha/2}\sigma/\sqrt{n}]$.
      So the confidence interval is nothing but the set of null values this
      data would fail to reject — invert a test at every possible $\mu_0$
      and the collection of survivors is the interval; conversely, check
      whether $\mu_0$ sits inside the interval and you've run the test.

      Width, $2z_{\alpha/2}\sigma/\sqrt{n}$, shrinks only like
      $1/\sqrt{n}$ — the same rate governing every estimate built this way,
      so cutting the interval in half costs four times the data, not
      twice.
    worked: >
      Over $n=50$ measurements of execution slippage, $\bar{x}=1.2$ basis
      points with a known historical $\sigma=3$ basis points. The $95\%$
      interval is $1.2 \pm 1.96 \times 3/\sqrt{50} = 1.2 \pm 0.832$, or
      $[0.368, 2.032]$ basis points. Since $0$ falls outside this interval,
      the equivalent two-sided test of $H_0: \text{slippage}=0$ rejects at
      $5\%$ — the same conclusion the interval and the test give by
      construction.
    interview: >
      "How would you build a confidence interval for this mean" is
      answered with the formula plus, unprompted, the duality with the
      test — that the interval is exactly the set of null values the data
      fails to reject. A common follow-up asks how much data is needed to
      halve the width, checking the $1/\sqrt{n}$ rate.
    pitfalls: >
      Reporting an interval without stating the confidence level attached
      to the procedure that built it strips it of its actual meaning.
      Assuming halving the width only needs twice the data, rather than
      four times, misreads the $1/\sqrt{n}$ shrinkage rate.
    recap: >
      A confidence interval is exactly the set of null values a two-sided
      test at that level would fail to reject, with width shrinking only
      as $1/\sqrt{n}$.
    steps:
      - teach: >
          A $1-\alpha$ confidence interval $C(X)$ satisfies
          $\Pr_\theta(\theta \in C(X)) \ge 1-\alpha$ for every possible true
          $\theta$ — a promise about the procedure that generates the
          interval, not a claim about one particular interval after the
          fact.
      - teach: >
          The canonical form is $\bar{x} \pm z_{\alpha/2}\sigma/\sqrt{n}$, or
          $\bar{x} \pm t_{n-1,\alpha/2}\,s/\sqrt{n}$ once $\sigma$ has to be
          estimated.
      - ask: >
          Over $n = 36$ measurements, $\sigma = 6$ basis points is known.
          What is the $95\%$ margin, $1.96 \times \sigma/\sqrt{n}$?
        expects: "1.96"
        hint: >
          $\sigma/\sqrt{n} = 6/6 = 1$.
        feedback: >
          $1.96 \times 1 = 1.96$ basis points.
      - teach: >
          The duality with testing falls out of the rejection rule directly:
          the two-sided level-$\alpha$ z-test rejects $\mu_0$ exactly when
          $\mu_0$ lies outside $[\bar{x}-z_{\alpha/2}\sigma/\sqrt{n},\
          \bar{x}+z_{\alpha/2}\sigma/\sqrt{n}]$ — so the interval is exactly
          the set of survivors.
      - ask: >
          Using the instance above with $\bar{x} = 2.5$ basis points and the
          margin $1.96$, what is the lower endpoint of the $95\%$ interval?
        expects: "0.54"
        tolerance: 0.0005
        hint: >
          Subtract the margin from $\bar{x}$.
        feedback: >
          $2.5 - 1.96 = 0.54$ basis points, so the interval is
          $[0.54, 4.46]$.
      - teach: >
          Width, $2z_{\alpha/2}\sigma/\sqrt{n}$, shrinks only like
          $1/\sqrt{n}$ — the same rate governing every estimate built this
          way, so cutting the interval in half costs four times the data,
          not twice.
      - ask: >
          A $95\%$ CI for daily slippage is $[0.5, 4.5]$ basis points from
          $n = 36$ days. To halve this width at the same confidence level,
          how much data is needed in total?
        choices:
          - text: >
              $72$ days — twice as much
            feedback: >
              Width shrinks like $1/\sqrt{n}$, not $1/n$ — doubling the data
              only shrinks the width by a factor of $\sqrt{2}$.
          - text: >
              $144$ days — four times as much
            correct: true
            feedback: >
              Right — width is proportional to $1/\sqrt{n}$, so halving it
              requires quadrupling $n$.
          - text: >
              $18$ days — half as much
            feedback: >
              Less data always widens the interval, never narrows it.
        feedback: >
          Halving the width of an interval built as $z_{\alpha/2}\sigma
          /\sqrt{n}$ needs $4\times$ the data, since width falls only as
          $1/\sqrt{n}$.
      - teach: >
          The interval and the test are two views of one computation: check
          whether $\mu_0$ sits inside the interval, and you've run the test.

  - node: quant-statistics.testing.ci-interpretation
    hook: >
      "What does 95% confidence actually mean" is a classic trap, and the
      natural-sounding answer — a 95% chance $\mu$ is in this interval — is
      precisely the wrong one to give.
    explanation: >
      The $95\%$ attaches to the recipe, not to the specific numbers on the
      page. Imagine repeating the entire experiment many times, each time
      computing a fresh interval by the same formula: across that whole
      batch of repetitions, $95\%$ of the resulting intervals cover the one
      fixed, unknown $\theta$. The particular interval you actually
      computed either contains $\theta$ or it doesn't — there's no
      probability left to discuss about that single, already-realized
      outcome, only about the machine that produced it.

      "There is a $95\%$ probability that $\mu$ lies in $[a,b]$" is a
      different statement entirely — the credible-interval reading, which
      treats $\mu$ itself as random and needs a prior distribution on it to
      even be well-defined. Confidence intervals are built without any
      prior at all, so that sentence describes a Bayesian object the
      frequentist procedure never promised to deliver.

      What the interval legitimately does say: values outside it are
      exactly the ones the corresponding test would reject at that level,
      and its width states how precisely this much data can resolve the
      unknown. A wide interval that spans both zero and an economically
      large value is not evidence the effect is absent — it's a statement
      that the experiment simply wasn't informative enough to tell the two
      apart.
    worked: >
      An analyst runs $20$ independent studies, each producing its own
      $95\%$ confidence interval for a different unknown parameter. Across
      this batch, the expected number of intervals that contain their
      respective true parameter is $20 \times 0.95 = 19$ — that's the
      long-run batting average the procedure guarantees. It says nothing
      about whether interval number $7$, once computed and stared at, is
      one of the $19$ or the $1$; there's no probability statement left to
      make about that specific already-computed interval.
    interview: >
      "What exactly does the 95% mean" is a standard trap after any
      confidence interval question — a correct answer names the
      repeated-sampling coverage property explicitly and flags the
      credible-interval reading as a different, Bayesian object that needs
      a prior.
    pitfalls: >
      Saying "there's a $95\%$ chance $\mu$ is in this interval" smuggles
      in a prior on $\mu$ that the frequentist construction never used.
      Reading a wide interval containing zero as proof of no effect
      confuses low information with a negative finding.
    recap: >
      The $95\%$ describes the long-run coverage of the procedure across
      repeated samples, not a probability about the one interval already
      computed — that reading requires a prior and belongs to Bayesian
      credible intervals instead.
    steps:
      - teach: >
          The $95\%$ attaches to the recipe, not to the numbers on the page.
          Imagine repeating the whole experiment many times, each producing
          a fresh interval: across that batch, $95\%$ of the intervals cover
          the one fixed, unknown $\theta$.
      - teach: >
          "There's a $95\%$ probability $\mu$ is in $[a,b]$" is a different
          statement — the credible-interval reading, which treats $\mu$ as
          random and needs a prior the confidence-interval construction
          never used.
      - ask: >
          $40$ independent studies each produce their own $95\%$ confidence
          interval for a different unknown parameter. How many of these
          intervals are expected to contain their respective true
          parameter?
        expects: "38"
        hint: >
          Multiply the number of studies by the coverage rate.
        feedback: >
          $40 \times 0.95 = 38$ — the long-run batting average the procedure
          guarantees across the batch.
      - teach: >
          Values outside the interval are exactly the ones the corresponding
          test would reject at that level, and the width states how
          precisely this much data can resolve the unknown.
      - ask: >
          A $95\%$ CI for a new signal's daily edge is $[-2, +6]$ basis
          points, wide and straddling zero. What's the honest read?
        choices:
          - text: >
              The effect is zero
            feedback: >
              A wide interval containing zero says the data can't resolve
              the effect, not that it's absent — a large positive value is
              still inside the same interval.
          - text: >
              The experiment wasn't informative enough to distinguish "no
              effect" from "a large effect"
            correct: true
            feedback: >
              Right — the width states what this much data can resolve, and
              here it can't tell zero from an economically large number.
          - text: >
              There's a $95\%$ chance the true edge is between $-2$ and $6$
              basis points
            feedback: >
              That's the credible-interval reading — it needs a prior on the
              edge that this frequentist construction never used.
        feedback: >
          A wide interval spanning zero and an economically large value is
          undecided, not a null result — the honest read is that more data
          is needed, not that the effect is absent.
      - ask: >
          You compute one $95\%$ CI, and it happens to be $[1.1, 3.4]$.
          What's the correct probability statement about whether the true
          $\theta$ is in $[1.1, 3.4]$?
        choices:
          - text: >
              $95\%$
            feedback: >
              That attaches the procedure's long-run coverage to this one
              already-realized interval, which the frequentist construction
              doesn't support.
          - text: >
              Either $0\%$ or $100\%$ — it either contains $\theta$ or it
              doesn't, and there's no probability left to state about this
              one fixed, already-computed interval
            correct: true
            feedback: >
              Right — the randomness was in which interval got produced;
              once produced, it's just a fixed set that does or doesn't
              contain $\theta$.
          - text: >
              It depends on the sample size used to build it
            feedback: >
              Sample size affects the interval's width, not whether a
              probability statement about this one realized interval is
              meaningful.
        feedback: >
          The $95\%$ lives in the machine that produced the interval, not in
          the one interval you're staring at — that particular interval
          either contains $\theta$ or it doesn't.
      - teach: >
          Coverage is a property of the repeated-sampling recipe; a
          probability statement about one already-computed interval belongs
          to a different, Bayesian object that needs a prior.

  - node: quant-statistics.testing.sample-size
    hook: >
      "How many samples do I need to detect this edge" is answered by
      inverting the power formula, and the interview wants the inversion
      done live, not quoted from memory.
    explanation: >
      Start from the power equation and solve for $n$ directly: setting
      $\Phi(\delta\sqrt{n}/\sigma - z_\alpha) = 1-\beta$ and applying
      $\Phi^{-1}$ to both sides gives $\delta\sqrt{n}/\sigma - z_\alpha =
      z_\beta$, using $z_\beta$ for the value with $\Phi(z_\beta)=1-\beta$.
      Rearranging, $\delta\sqrt{n}/\sigma = z_\alpha + z_\beta$, hence
      $n \approx \left(\dfrac{(z_\alpha+z_\beta)\sigma}{\delta}\right)^{2}$,
      with $z_{\alpha/2}$ replacing $z_\alpha$ for a two-sided test.

      The content worth remembering isn't the algebra, it's the scaling:
      $n$ grows like $(\sigma/\delta)^2$, a square-law relationship, so an
      effect half as large needs four times the data, not twice. Every
      "how much data to detect a smaller edge" question is this same
      square-law read backwards.

      Two multipliers are worth having memorized at the conventional
      two-sided $\alpha=0.05$: power $0.80$ gives
      $(1.96+0.84)^2 = 7.85$, power $0.90$ gives $(1.96+1.28)^2=10.5$ — so
      $n \approx 8(\sigma/\delta)^2$ is the fast back-of-envelope answer
      whenever $80\%$ power is the target.
    worked: >
      A strategy's daily returns have $\sigma=1\%$, and the goal is to
      reliably detect an edge of $\delta=0.05\%$ per day at two-sided
      $\alpha=0.05$ and power $0.90$, so the multiplier is $10.5$. Then
      $n \approx 10.5 \times (1\%/0.05\%)^2 = 10.5 \times 400 = 4200$
      trading days — roughly $16$ years of daily data just to resolve an
      edge this small at $90\%$ power.
    interview: >
      "How much data do I need to detect an edge of size $\delta$" is
      answered by writing $n \approx ((z_\alpha+z_\beta)\sigma/\delta)^2$
      from the power equation, then naming the square-law scaling out loud
      before plugging in numbers. A quick sanity check the interviewer
      often wants: halving $\delta$ should roughly quadruple your answer.
    pitfalls: >
      Scaling $n$ linearly with $1/\delta$ instead of quadratically badly
      undersizes the sample needed. Using the two-sided multiplier
      $z_{\alpha/2}+z_\beta$ when the actual test is one-sided (or vice
      versa) mismatches the sample size to the wrong critical value.
    recap: >
      Inverting the power equation gives
      $n \approx ((z_\alpha+z_\beta)\sigma/\delta)^2$, about
      $8(\sigma/\delta)^2$ at the standard $5\%/80\%$ settings — a
      square-law in the effect size, not a linear one.
    steps:
      - teach: >
          Start from the power equation and solve for $n$ directly: setting
          $\Phi(\delta\sqrt{n}/\sigma - z_\alpha) = 1-\beta$ and applying
          $\Phi^{-1}$ to both sides gives $\delta\sqrt{n}/\sigma = z_\alpha +
          z_\beta$, hence $n \approx ((z_\alpha+z_\beta)\sigma/\delta)^2$.
      - teach: >
          The content worth remembering is the scaling, not the algebra:
          $n$ grows like $(\sigma/\delta)^2$, a square law, so an effect
          half as large needs four times the data, not twice.
      - ask: >
          Using the memorized multiplier $7.85$ for two-sided $\alpha=0.05$,
          power $0.80$, what sample size does $\sigma = 2\%$ and $\delta =
          0.1\%$ require, from $n \approx 7.85 \times (\sigma/\delta)^2$?
        expects: "3140"
        hint: >
          $\sigma/\delta = 2\%/0.1\% = 20$.
        feedback: >
          $7.85 \times 20^2 = 7.85 \times 400 = 3140$.
      - teach: >
          Two multipliers are worth having memorized at two-sided
          $\alpha=0.05$: power $0.80$ gives $7.85$, power $0.90$ gives
          $10.5$ — so $n \approx 8(\sigma/\delta)^2$ is the fast
          back-of-envelope answer.
      - ask: >
          Using the back-of-envelope approximation $n \approx
          8(\sigma/\delta)^2$, what sample size does $\sigma/\delta = 15$
          require?
        expects: "1800"
        hint: >
          Square $15$ first, then multiply by $8$.
        feedback: >
          $8 \times 15^2 = 8 \times 225 = 1800$.
      - teach: >
          Scaling $n$ linearly with $1/\delta$ instead of quadratically
          badly undersizes the sample needed — halving $\delta$ should
          roughly quadruple the answer, never just double it.
      - ask: >
          A team computes $n = 1000$ to detect an effect $\delta$ at fixed
          power and $\alpha$. What sample size do they need to detect an
          effect only half as large, same settings?
        choices:
          - text: >
              $500$
            feedback: >
              That's linear scaling, treating $n$ as proportional to
              $1/\delta$ — it isn't.
          - text: >
              $2000$
            feedback: >
              Doubling $n$ only accounts for halving $\delta$ if the
              relationship were linear; it's quadratic.
          - text: >
              $4000$
            correct: true
            feedback: >
              Right — $n \propto (\sigma/\delta)^2$, so halving $\delta$
              quadruples $n$.
        feedback: >
          The square law means a target effect half the size needs four
          times the data — the single fact worth carrying out of this
          formula.
      - teach: >
          $n \approx ((z_\alpha+z_\beta)\sigma/\delta)^2$ is a square law in
          the effect size — every "how much data to detect a smaller edge"
          question is this scaling read backward.

  - node: quant-statistics.testing.detect-coin-edge
    hook: >
      "How many flips to catch a coin that's slightly biased" is the
      canonical worked instance of the sample-size formula, and the
      arithmetic — not just the formula — needs to come out fast and
      clean.
    explanation: >
      The recipe is exactly the general one, specialized to a coin: null
      per-flip standard deviation $\sigma=\sqrt{p_0(1-p_0)}$, an effect
      $\delta$ equal to how far the true rate sits from $p_0$, and the same
      $n \approx ((z_\alpha+z_\beta)\sigma/\delta)^2$. The only judgment
      calls are which $\sigma$ to plug in and which side of the test you
      actually need.

      Two refinements are worth doing live rather than stopping at the
      first-pass number. Using the alternative's own variance
      $\sqrt{p(1-p)}$ in place of the null's $\sqrt{p_0(1-p_0)}$ nudges
      $\sigma$ slightly — usually a small correction near $p=0.5$, since
      $p(1-p)$ is flat there. Switching from two-sided to one-sided, when
      the direction of the suspected bias is known in advance, replaces
      $z_{\alpha/2}$ with the smaller $z_\alpha$, which meaningfully cuts
      the required $n$ because the entire error budget goes toward the one
      tail you actually care about.

      The other half of this pattern is reading the formula backward:
      stopping well short of the required $n$ doesn't just weaken the
      result a little, it can leave power near what a coin flip itself
      would give — a reason to distrust any "edge" claimed from a sample
      far smaller than the sizing calculation demands.
    worked: >
      Detect a coin biased at $52\%$ instead of $55\%$ — a smaller edge,
      $\delta = 0.02$ — at the same two-sided $\alpha=0.05$, power $0.80$
      settings, using the null $\sigma=0.5$: the multiplier is still
      $1.96+0.84=2.80$, so $n \approx (2.80 \times 0.5/0.02)^2 = 70^2 =
      4900$ flips. Dropping the true edge from $0.05$ to $0.02$ — less than
      a third the size — pushes the requirement from $784$ flips to
      $4900$, over six times as many, exactly the square-law the formula
      predicts for a smaller $\delta$.
    interview: >
      "How many flips would you need to tell a $52\%$ (or $55\%$, or
      $60\%$) coin from fair" is a stock prompt — plug into
      $n\approx((z_\alpha+z_\beta)\times 0.5/\delta)^2$ live, and volunteer
      that a one-sided version, if the direction of bias is known, needs
      meaningfully fewer flips.
    pitfalls: >
      Reusing a sample-size answer computed for one edge size $\delta$ when
      the actual suspected edge is smaller ignores the square-law
      blowup — a coin only half as biased needs roughly four times the
      flips, not the same number. Quoting the required flip count without
      stating the power target it assumes leaves the number meaningless,
      since a lower power target needs far fewer flips for the same
      $\delta$.
    recap: >
      The coin version of the sample-size formula gives about $4900$ flips
      to detect a $52\%$ coin and $784$ for a $55\%$ coin at the standard
      $5\%/80\%$ settings — the square-law dependence on the edge size made
      concrete.
    steps:
      - teach: >
          The recipe is exactly the general sample-size formula specialized
          to a coin: null $\sigma = \sqrt{p_0(1-p_0)}$, and $\delta$ equal to
          how far the true rate sits from $p_0$.
      - teach: >
          Two refinements are worth doing live: using the alternative's own
          variance $\sqrt{p(1-p)}$ instead of the null's nudges $\sigma$
          slightly, and switching to one-sided when the bias direction is
          known replaces $z_{\alpha/2}$ with the smaller $z_\alpha$,
          meaningfully cutting $n$.
      - ask: >
          Detect a coin biased at $54\%$ ($\delta = 0.04$) at two-sided
          $\alpha=0.05$, power $0.80$, using the null $\sigma = 0.5$ and
          multiplier $2.80$. What is $n \approx (2.80 \times
          0.5/0.04)^2$?
        expects: "1225"
        hint: >
          $2.80 \times 0.5/0.04 = 35$, then square it.
        feedback: >
          $35^2 = 1225$ flips — more than the $784$ needed for a $55\%$
          coin, since the edge here is smaller.
      - teach: >
          Reading the formula backward matters too: stopping well short of
          the required $n$ doesn't just weaken the result a little, it can
          leave power near what a coin flip itself would give.
      - ask: >
          For the same $\delta$ and power target, does switching from
          two-sided to one-sided (bias direction known in advance) need
          more or fewer flips?
        choices:
          - text: >
              Fewer
            correct: true
            feedback: >
              Right — $z_\alpha < z_{\alpha/2}$, so the multiplier
              $z_\alpha+z_\beta$ shrinks, and with it $n$.
          - text: >
              More
            feedback: >
              A one-sided test spends the whole $\alpha$ budget on one tail,
              which shrinks the required threshold and the sample size with
              it.
          - text: >
              Exactly the same
            feedback: >
              The multiplier changes ($z_\alpha$ replaces $z_{\alpha/2}$), so
              the required $n$ changes too.
        feedback: >
          Committing to one-sided in advance, when the direction is genuinely
          known, buys a smaller multiplier and therefore fewer flips.
      - teach: >
          Near $p = 0.5$, $p(1-p)$ barely moves, so refining $\sigma$ from
          the null value to the alternative's own value is usually a small
          correction, not a large one.
      - ask: >
          At $n = 100$ trades and a per-trade edge $\delta = 0.1\sigma$, what
          is the signal-to-noise ratio $\delta\sqrt{n}/\sigma$?
        expects: "1"
        hint: >
          Multiply $\delta/\sigma$ by $\sqrt{n}$.
        feedback: >
          $0.1 \times \sqrt{100} = 0.1 \times 10 = 1$. Plugged into the
          power formula at two-sided $\alpha=0.05$, that gives $\Phi(1 -
          1.96) = \Phi(-0.96) \approx 0.17$ — under one chance in five of
          catching an edge this size at only $100$ trades.
      - teach: >
          The square law is the whole story: $1225$ flips for a $54\%$ coin,
          $4900$ for a $52\%$ coin, $784$ for a $55\%$ coin — and stopping
          well short of the calculated $n$ risks power little better than
          a coin flip.

  - node: quant-statistics.testing.multiple-testing
    hook: >
      "You ran 50 backtests and one came back significant" is the standard
      follow-up to any p-value question, and the interviewer wants the
      family-wise error rate computed on the spot, not just the word
      "Bonferroni."
    explanation: >
      Run $m$ tests, each at level $\alpha$, when every null happens to be
      true. If the tests are independent, the chance every single one
      correctly fails to reject is $(1-\alpha)^m$, so the family-wise error
      rate — at least one false rejection — is $1 - (1-\alpha)^m$: a
      multiplication of $m$ independent "no false alarm" events, each
      falling short of certainty, compounds fast.

      Independence isn't needed for a bound, only for the exact formula:
      the union bound gives
      $\Pr(\text{at least one false rejection}) \le \sum_i
      \Pr(\text{test } i \text{ falsely rejects}) = m\alpha$ regardless of
      how the tests are correlated, since the union bound never assumes
      independence in the first place. Bonferroni just runs this bound
      backward: test each hypothesis at $\alpha/m$ instead of $\alpha$, and
      the union bound guarantees the family-wise rate stays at or below
      $\alpha$.

      The price is power — a stricter per-test threshold makes every
      individual test harder to pass — and the bound itself is loose
      exactly when the tests are correlated, which overlapping backtests
      on the same market data almost always are. Sharper tools exist for
      exactly this: Holm's step-down procedure dominates Bonferroni
      uniformly at no extra cost, and Benjamini–Hochberg trades
      family-wise control for control of the false discovery proportion
      instead, useful when some false positives are tolerable as long as
      most flagged results are real.
    worked: >
      Run $m=50$ independent backtests, each at $\alpha=0.05$, on
      strategies that are all pure noise. The family-wise error rate is
      $1 - 0.95^{50} \approx 1 - 0.077 = 0.923$ — over $92\%$ chance at
      least one looks significant by luck alone. Bonferroni's fix: test
      each at $0.05/50 = 0.001$, a two-sided cutoff of roughly
      $|z| \ge 3.29$ instead of the usual $1.96$.
    interview: >
      "How do you account for testing many strategies at once" wants the
      family-wise error rate computed for the actual number tested, not a
      vague "multiple comparisons correction." A sharp follow-up, "is
      Bonferroni exact here," checks whether you flag that the bound is
      conservative and loose under correlation.
    pitfalls: >
      Reporting a single test's p-value from a search over many
      specifications without any correction wildly understates the true
      false-alarm rate. Applying Bonferroni's independence-derived exact
      formula, $1-(1-\alpha)^m$, to strongly correlated tests overstates
      how bad the true family-wise rate actually is — the union bound,
      $m\alpha$, is the safe one to quote when tests are correlated.
    recap: >
      Fifty independent noise strategies each tested at $5\%$ give a
      $92\%$ chance of a false alarm; dividing the per-test level by the
      number of tests caps the family-wise rate at $\alpha$, at the cost
      of power.
    steps:
      - teach: >
          Running $m$ tests each at level $\alpha$, when every null is true,
          is like multiplying $m$ independent "no false alarm" events
          together — each individually likely, but the product erodes fast
          as $m$ grows.
      - teach: >
          If independent, the family-wise error rate is $1-(1-\alpha)^m$;
          without independence, the union bound still gives
          $\Pr(\text{at least one false rejection}) \le m\alpha$ regardless
          of correlation, since the union bound never assumes independence
          in the first place.
      - ask: >
          Run $m = 10$ independent tests, each at $\alpha = 0.05$, on nulls
          that are all true. Using $1 - (1-\alpha)^m$, what is the
          family-wise error rate?
        expects: "0.4013"
        tolerance: 0.0005
        hint: >
          $0.95^{10} \approx 0.5987$.
        feedback: >
          $1 - 0.95^{10} \approx 1 - 0.5987 = 0.4013$ — over a $40\%$ chance
          of at least one false alarm from just $10$ tests.
      - teach: >
          Bonferroni runs the union bound backward: test each hypothesis at
          $\alpha/m$ instead of $\alpha$, and the same bound guarantees the
          family-wise rate stays at or below $\alpha$.
      - ask: >
          For $m = 10$ tests and a target family-wise rate $\alpha = 0.05$,
          what per-test level does Bonferroni's correction require?
        expects: "0.005"
        hint: >
          Divide $\alpha$ by $m$.
        feedback: >
          $0.05/10 = 0.005$ per test.
      - teach: >
          The price is power — a stricter per-test threshold makes every
          individual test harder to pass — and the bound is loose exactly
          when the tests are correlated, as overlapping backtests on the
          same market data almost always are.
      - ask: >
          You ran $15$ highly correlated backtests on overlapping data.
          Which family-wise error bound should you trust?
        choices:
          - text: >
              The independence formula $1-(1-\alpha)^{15}$, since it's more
              precise
            feedback: >
              That formula assumes independence, which correlated backtests
              on overlapping data don't have.
          - text: >
              The union bound $m\alpha = 15\alpha$, since it holds regardless
              of correlation
            correct: true
            feedback: >
              Right — the union bound never assumed independence, so it
              stays valid however the tests are correlated.
          - text: >
              Neither bound applies once tests are correlated
            feedback: >
              The union bound is specifically the one that survives
              correlation — it's the exact formula that needs independence.
        feedback: >
          The union bound $m\alpha$ is the safe one under correlation; the
          independence formula can understate the true family-wise rate
          when tests share the same underlying data.
      - teach: >
          Sharper tools exist for exactly this: Holm's step-down dominates
          Bonferroni uniformly, and Benjamini–Hochberg controls the false
          discovery proportion instead when some false positives are
          tolerable.

  - node: quant-statistics.testing.data-snooping
    hook: >
      "We tried thirty parameter combinations and this one had a great
      Sharpe ratio" should trigger an immediate red flag — the p-value of
      a search's winner is not a p-value at all.
    explanation: >
      The correct null for the best result out of a search isn't "this one
      strategy is noise" — it's "the best of $m$ noise strategies," and the
      maximum of many noise statistics sits far out in the tail even when
      every individual one is unremarkable. Judging the survivor of a
      search against the single-test null massively overstates how
      surprising its result actually is.

      This is the multiple-testing problem in its most common practical
      disguise: every specification tried, including the ones that were
      tweaked, abandoned, or never wrote up, is a member of the search, and
      the honest correction needs the true count of everything tried — a
      number research desks rarely keep accurately, which is exactly what
      makes this trap so persistent.

      Discipline that actually works: hold out data that hasn't been
      touched by any part of the search, and prefer a hypothesis stated and
      frozen before the fit begins, so there's no search left to correct
      for by the time the data is examined. Corrections specific to
      backtest evaluation — adjustments for the number of trials in a
      research pipeline — belong to that later stage of the process, but
      the underlying logic is this node's.
    worked: >
      A desk tests $m=40$ pure-noise parameter combinations, each judged at
      $\alpha=0.05$. The chance at least one looks significant is
      $1 - 0.95^{40} \approx 1 - 0.129 = 0.871$, about $87\%$, and the
      expected number of false discoveries by chance alone is
      $40 \times 0.05 = 2$. Finding exactly two "significant" results out
      of forty backtests is precisely what pure noise predicts — on its
      own, zero evidence of a real edge.
    interview: >
      "How do you know your backtest result isn't just data snooping" wants
      the max-of-noise reframing named directly, plus a concrete question
      back: how many specifications were actually tried, including the
      discarded ones. A strong answer volunteers a held-out sample as the
      real test.
    pitfalls: >
      Quoting the p-value of the single winning specification as if it
      were computed against the honest search null wildly overstates
      significance. Undercounting the number of specifications tried —
      forgetting abandoned variants and parameter sweeps — understates the
      correction that's actually needed.
    recap: >
      The best of many noise strategies looks significant far more often
      than a single test's p-value would suggest — count everything tried,
      and trust only a result confirmed on data the search never touched.
    steps:
      - teach: >
          The correct null for the survivor of a search isn't "this one
          strategy is noise" — it's "the best of $m$ noise strategies," and
          the maximum of many noise statistics sits far out in the tail even
          when each one individually is unremarkable.
      - ask: >
          A desk tests $m = 15$ pure-noise parameter combinations, each
          judged at $\alpha = 0.05$. What is the expected number of
          "significant" results by chance alone?
        expects: "0.75"
        hint: >
          Multiply $m$ by $\alpha$.
        feedback: >
          $15 \times 0.05 = 0.75$ — under one false discovery expected from
          pure noise.
      - teach: >
          Every specification tried — including tweaked, abandoned, or
          never-written-up ones — is a member of the search, and research
          desks rarely keep an accurate count, which is exactly what makes
          this trap persistent.
      - ask: >
          For the same $m = 15$ noise specifications each at $\alpha =
          0.05$, using $1-(1-\alpha)^m$, what is the chance at least one
          looks significant?
        expects: "0.5367"
        tolerance: 0.0005
        hint: >
          $0.95^{15} \approx 0.4633$.
        feedback: >
          $1 - 0.95^{15} \approx 1 - 0.4633 = 0.5367$ — over half, even
          though every specification is pure noise.
      - teach: >
          Discipline that actually works: hold out data untouched by any
          part of the search, and prefer a hypothesis frozen before the fit
          begins, so there's no search left to correct for by the time the
          data is examined.
      - ask: >
          A desk reports the p-value of the single best-performing strategy
          out of $15$ tried, with no correction. What's wrong?
        choices:
          - text: >
              Nothing — the p-value is computed correctly for that one
              strategy
            feedback: >
              Correct arithmetic for the wrong null: the survivor of a
              search should be judged against "the best of $15$ noise
              strategies," not a single fresh test.
          - text: >
              The naive p-value is judged against the wrong null; it should
              account for the search over all $15$ specifications, making
              the true result look far less surprising
            correct: true
            feedback: >
              Right — the honest null is the maximum of $15$ noise
              strategies, whose tail is far heavier than a single test's.
          - text: >
              The correction only matters once more than $100$
              specifications are tried
            feedback: >
              Even $m = 15$ already gives over a $50\%$ chance of a false
              discovery — the correction matters well before $100$.
        feedback: >
          The naive p-value answers the wrong question once a search has
          happened — it needs to be judged against the best-of-$m$ null, not
          a fresh single test.
      - teach: >
          Count everything tried, and trust only a result confirmed on data
          the search never touched — the discipline that survives every
          version of this trap.

  - node: quant-statistics.testing.practical-significance
    hook: >
      "Is this result significant" and "is this worth trading" are
      different questions with different answers, and conflating them in
      front of an interviewer reads as not understanding what a p-value
      measures.
    explanation: >
      Significance answers whether an effect is distinguishable from zero
      given the data collected — nothing about whether it's large enough
      to matter economically. With enough data, an edge far too small to
      survive transaction costs becomes statistically significant; with
      too little data, a genuinely large and tradeable edge can fail to
      clear the conventional bar.

      The fix is to read the interval, not the star next to the p-value. A
      precisely measured but tiny effect — narrow interval, entirely below
      any reasonable cost threshold — is significant and worthless. A wide
      interval spanning both zero and an economically large number isn't a
      null result at all; it's an undecided one, saying the experiment
      collected too little data to tell the two apart, not that the effect
      is absent.

      What actually converts an effect into money is its size measured
      against costs, capacity, and turnover — none of which a t-statistic
      touches. The t-statistic only answers how confident you can be that
      the true effect isn't exactly zero; every other question about
      whether it pays lives entirely outside that number.
    worked: >
      A high-frequency signal earns a mean of $0.03$ basis points per trade
      over $2{,}000{,}000$ trades, standard error $0.008$ basis points:
      $t = 0.03/0.008 = 3.75$, decisively significant. But round-trip costs
      run $0.5$ basis points — more than sixteen times the measured edge —
      so the signal is unprofitable despite the overwhelming significance.
      Contrast a slower signal earning $2$ basis points per trade over just
      $40$ trades, standard error $1.5$ basis points: $t=2/1.5\approx1.33$,
      not significant at $5\%$. If real, that edge would clear the same
      $0.5$ basis-point cost many times over — the honest read is
      "undetermined," not "no edge," since $40$ trades simply isn't enough
      data to tell.
    interview: >
      "This result is statistically significant — does that mean you'd
      trade it" is a direct test of this distinction; the strong answer
      asks for the point estimate, its interval, and the cost structure
      before answering, rather than treating the p-value as the whole
      verdict.
    pitfalls: >
      Treating a significant result as automatically tradeable skips the
      comparison against costs and capacity entirely. Treating a
      non-significant result on a small sample as proof of no edge ignores
      that low power, not a genuinely absent effect, is the more common
      explanation.
    recap: >
      Large samples make trivial effects significant and small samples
      hide real ones — quote the effect size and its interval first, and
      ask separately whether it clears costs.
    steps:
      - teach: >
          Significance answers whether an effect is distinguishable from
          zero given the data collected — nothing about whether it's large
          enough to matter economically.
      - teach: >
          With enough data, an edge too small to survive costs becomes
          statistically significant; with too little data, a genuinely
          large, tradeable edge can fail to clear the conventional bar.
      - ask: >
          A signal's estimated edge is $0.6$ basis points with a standard
          error of $0.2$ basis points. What is $t = \text{estimate}/\text{SE}$?
        expects: "3"
        hint: >
          Divide the estimate by its standard error.
        feedback: >
          $0.6/0.2 = 3$ — comfortably significant.
      - teach: >
          The fix is to read the interval, not the star: a precisely
          measured but tiny effect is significant and worthless, while a
          wide interval spanning zero and an economically large number is
          undecided, not "no effect."
      - ask: >
          The signal above has a roughly $95\%$ interval of $[0.2, 1.0]$
          basis points, and round-trip costs run $1.5$ basis points. What's
          the honest read?
        choices:
          - text: >
              Significant and profitable — trade it
            feedback: >
              Significant only says the effect isn't zero; the entire
              interval sits below the $1.5$ basis-point cost, so it doesn't
              pay.
          - text: >
              Significant, but the entire interval sits below the cost
              threshold — not worth trading
            correct: true
            feedback: >
              Right — the t-statistic confirms the edge is real, but its
              whole plausible range is smaller than what it costs to
              capture.
          - text: >
              Not significant, so there's no edge
            feedback: >
              $t = 3$ is decisively significant here — the problem is size
              against costs, not statistical significance.
        feedback: >
          What converts an effect into money is its size against costs, not
          its t-statistic — a significant result whose whole interval sits
          under the cost threshold still doesn't pay.
      - teach: >
          What actually converts an effect into money is its size measured
          against costs, capacity, and turnover — none of which the
          t-statistic touches; it only answers whether the true effect is
          exactly zero.
      - ask: >
          A slower signal earns an estimated $3$ basis points per trade with
          standard error $2.5$ basis points on a small sample, giving
          $t = 1.2$, not significant at $5\%$. Does this mean there's no
          edge?
        choices:
          - text: >
              Yes — failing to reach significance means there's no edge
            feedback: >
              That treats a low-power result as a disproof — a small sample
              can leave a genuinely large edge short of the conventional
              bar.
          - text: >
              No — the sample may simply be too small to resolve an edge of
              this size, even if it's real
            correct: true
            feedback: >
              Right — an edge that would clear costs many times over if
              real can still fail to reach significance on a small sample.
          - text: >
              No — but only because the estimate is positive
            feedback: >
              The sign of the point estimate isn't what makes the
              conclusion "undetermined" — the width of the interval relative
              to the sample size is.
        feedback: >
          A non-significant result on a small sample is "undetermined," not
          "no edge" — low power, not a genuinely absent effect, is the more
          common explanation.
      - teach: >
          Quote the point estimate and its interval first, compare that
          range to costs, capacity and turnover, and only then ask what the
          t-statistic added — a confirmation the effect isn't exactly zero,
          nothing more.
