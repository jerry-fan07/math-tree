unit: quant-statistics.testing
opening: >
  Hypothesis testing turns a hunch about a mean, a rate or a strategy into a
  pre-committed decision rule you can defend under pressure. This unit builds
  that machinery in the order an interview actually pressures it: name the
  null and the rejection rule, price the two ways a test can be wrong and the
  power that trades them off, read a p-value correctly and rule out its
  standard misreadings, then run the z-test and t-test recipes end to end and
  invert them into confidence intervals. It closes with the two questions
  that decide whether any of this mattered — how much data a target effect
  actually needs, and what happens to your error rate once you test more
  than one thing at a time.
lessons:
  - node: quant-statistics.testing.hypotheses
    hook: >
      Every interview testing question starts with the same unglamorous
      step: pin down a null hypothesis specific enough to compute
      probabilities under. Skip it and "fail to reject" quietly gets
      misquoted as "the null is true."
    explanation: >
      A test needs somewhere to stand — a hypothesis specific enough that
      you can actually compute $\Pr_{H_0}(T \in R)$ for a statistic $T$ of
      your choosing. That's the null's entire job description, not that
      it's the boring or default claim: it's the one law precise enough to
      hand you a sampling distribution to test against. The alternative can
      stay vague, because you never need its exact law, only the null's.

      Simple versus composite tracks exactly how much the null pins down. A
      simple null like $p = 0.5$ fixes the sampling law completely — one
      number, one distribution. A composite null like $\mu \le 0$ covers
      infinitely many laws at once, one for every value satisfying the
      constraint; testing it still works because the boundary value is the
      hardest one to distinguish from the alternative, so controlling the
      error there controls it everywhere in the null's range.

      The logic runs one direction only. A rejection region $R$, fixed
      before you look at data, is chosen so that data landing inside it
      would be rare under $H_0$ — rare enough to treat as evidence against
      it. Data landing outside $R$ only means this particular test had
      nothing to complain about; it never establishes that $H_0$ generated
      the data, since plenty of other laws would have produced the same
      unremarkable result just as easily. That asymmetry is why the
      vocabulary is "reject" or "fail to reject," never "accept."
    worked: >
      A pit boss suspects a die has been doctored to land on six more than
      it should. Formal setup: $H_0: p_6 = 1/6$ (simple — it pins the law
      exactly), $H_1: p_6 > 1/6$ (composite — every value above $1/6$
      satisfies it). The test statistic is $T$, the count of sixes in $60$
      rolls; under $H_0$, $T$ has an $\operatorname{Binomial}(60, 1/6)$ law
      with mean $10$. The rejection region is fixed before rolling:
      $R = \{T \ge 16\}$. Rolling the die and counting $17$ sixes lands $T$
      inside $R$, so the test rejects — not because $17$ "proves" the die
      is loaded, only because a fair die producing $17$ or more sixes in
      $60$ rolls is exactly the kind of event this pre-committed rule was
      built to flag.
    interview: >
      "Is this coin/pricing model/execution algorithm fair or unbiased"
      always wants the same three things named in order: the null stated
      precisely enough to compute with, the test statistic, and the
      pre-committed rejection region — before any mention of the actual
      data.
    pitfalls: >
      Saying "we accept $H_0$" when the data lands outside $R$ is never
      correct — the honest phrase is "fail to reject." Choosing the
      rejection region after seeing which way the data leans, rather than
      fixing it in advance, breaks the guarantee the whole framework rests
      on.
    recap: >
      A test pits a null precise enough to compute probabilities under
      against a looser alternative, with a rejection rule fixed in advance
      that can discredit the null but never confirm it.
    dialogue:
      - part: A four-sided die that favours its 4
        teach: >
          A casino's four-sided die is suspected of landing on $4$ too often.
          You are allowed five rolls, and before rolling you must say which
          results would make you call the die loaded. Accuse a fair die and
          the casino sues; the rule has to be one you can defend in advance.
      - ask: >
          Suppose the die is fair. What is the probability that all five
          rolls show a $4$?
        expects: "1/1024"
        hint: >
          The rolls are independent, and a fair die shows $4$ with
          probability $1/4$.
        feedback: >
          $(1/4)^{5} = 1/1024$, about $0.001$.
      - ask: >
          A colleague wants to compute the same probability under "the die is
          loaded" instead. Which of the two claims lets you compute it at all?
        choices:
          - text: >
              "The die is loaded": that is the claim you suspect.
            feedback: >
              Loaded how much? A die landing $4$ with probability $0.3$ gives
              $(0.3)^{5} \approx 0.0024$, one with $0.9$ gives about $0.59$.
              The claim names no single law, so it yields no single number.
          - text: >
              "The die is fair": it fixes $\Pr(4) = 1/4$ and with it the whole
              law of the count.
            correct: true
            feedback: >
              One number pins down the distribution of the count of $4$s in
              five rolls, so every probability you might want is computable.
          - text: >
              Both equally: each is a statement about the same die.
            feedback: >
              Both are statements, but only one is precise. "Loaded" covers
              every probability above $1/4$, and each gives a different
              answer.
        feedback: >
          The claim you test against is chosen for computability, not because
          you believe it: it is the one that hands you a distribution.
      - ask: >
          Let $T$ be the number of $4$s in five rolls. If the die is fair,
          what is $\Pr(T \ge 4)$?
        expects: "1/64"
        hint: >
          Exactly four $4$s: five places for the one roll that is not a $4$,
          which happens with probability $3/4$.
        feedback: >
          Exactly four: $5 \cdot (1/4)^{4} \cdot (3/4) = 15/1024$. Exactly
          five: $1/1024$. Together $16/1024 = 1/64 \approx 0.0156$.
      - ask: >
          You will accuse the die when $T$ lands in a set you name now, and
          you want a fair die accused at most $5\%$ of the time. Which set?
        choices:
          - text: >
              $\{T \ge 3\}$
            feedback: >
              Exactly three $4$s has probability
              $\binom{5}{3}(1/4)^{3}(3/4)^{2} = 90/1024$, so a fair die lands
              here $106/1024 \approx 10.4\%$ of the time. Twice the budget.
          - text: >
              Decide after the rolls, once you see what is unusual.
            feedback: >
              Whatever five rolls you see, some feature of them is unusual.
              A set drawn around data already in hand has no false-accusation
              rate you can compute in advance.
          - text: >
              $\{T \ge 4\}$
            correct: true
            feedback: >
              A fair die lands there with probability $1/64 \approx 1.6\%$,
              inside the $5\%$ budget. The count is discrete, so you cannot hit
              $5\%$ exactly; you take the largest set that stays under it.
        feedback: >
          You now have a complete rule: a claim to compute under, a number to
          watch, a set of values that triggers the accusation, and a ceiling
          on wrongly accusing a fair die.
      - reflect: >
          Why must that set be fixed before the five rolls, and not after?
          Say what goes wrong with the $5\%$ ceiling if you choose it later.
        answer: >
          The ceiling is a probability computed over all the rolls you might
          see, for a rule that does not depend on which ones you did see. If
          the set is drawn after looking, it bends to fit the data — any
          outcome can be made to look extreme — and the fair die is accused
          far more often than $5\%$. The guarantee belongs to a pre-committed
          procedure, so the commitment has to come first.

      - part: The names for what you built
        teach: >
          The claim you computed under is the null hypothesis $H_0$: the die
          is fair, $p = 1/4$. The claim you suspect is the alternative $H_1$:
          $p > 1/4$. $T$ is the test statistic, $R = \{T \ge 4\}$ the
          rejection region, and the ceiling is the level $\alpha$, with
          $\Pr_{H_0}(T \in R) \le \alpha$. A null that fixes the law exactly,
          like $p = 1/4$, is simple; one that only constrains it, like
          $p \le 1/4$, is composite.
      - ask: >
          A spinner is meant to land red with probability $1/3$. Which of
          these could serve as a simple null?
        choices:
          - text: >
              The spinner lands red with probability at most $1/3$.
            feedback: >
              That covers every value from $0$ to $1/3$ — many laws, so it
              is composite. It can still be a null, but not a simple one.
          - text: >
              The spinner lands red with probability exactly $1/3$.
            correct: true
            feedback: >
              One value, one law for every count of reds. That is what simple
              means.
          - text: >
              The spinner is unfair.
            feedback: >
              That names no law at all; it is the shape of an alternative,
              not of a null.
        feedback: >
          Simple or composite is a question of how many laws the hypothesis
          allows, not of which parameter it talks about.

      - part: Five rolls outside the region
        ask: >
          Suppose the die is in fact loaded, landing $4$ with probability
          $0.4$. What is the probability that five rolls land outside
          $R = \{T \ge 4\}$?
        expects: "0.913"
        tolerance: 0.0005
        hint: >
          Compute $\Pr(T \ge 4)$ under $p = 0.4$ and subtract from $1$.
        feedback: >
          $\Pr(T \ge 4) = 5(0.4)^{4}(0.6) + (0.4)^{5} = 0.0768 + 0.01024 =
          0.08704$, so $\Pr(T \notin R) = 0.91296 \approx 0.913$. A genuinely
          loaded die escapes this rule more than nine times in ten.
      - ask: >
          You roll and see two $4$s, outside $R$. What do you report?
        choices:
          - text: >
              The die is fair.
            feedback: >
              You just computed that a die loaded to $0.4$ lands outside $R$
              with probability $0.913$. Two $4$s is exactly what such a die
              typically produces; the data cannot tell the two apart.
          - text: >
              We accept $H_0$ at the $95\%$ level.
            feedback: >
              The level controls how often a fair die is wrongly accused. It
              says nothing about how often a loaded die is let off, so it
              cannot back a claim of fairness.
          - text: >
              We fail to reject $H_0$: five rolls give no grounds to call the
              die loaded.
            correct: true
            feedback: >
              Data can discredit $H_0$, never confirm it. Outside $R$ means
              only that nothing unusual happened under fairness.
        feedback: >
          "Fail to reject" is not a timid way of saying "accept". It is the
          accurate statement: a loaded die would very often have produced the
          same rolls.
      - ask: >
          The casino rewrites the null as $H_0: p \le 1/4$. Under which value
          of $p$ should you check that $\Pr(T \ge 4) \le 5\%$?
        choices:
          - text: >
              $p = 1/8$, a typical value inside the null
            feedback: >
              At $p = 1/8$ the rejection probability is about $0.001$, but a
              die at $p = 1/4$ also belongs to the null and is rejected about $14$
              times as often. The ceiling must hold for every law in $H_0$.
          - text: >
              $p = 1/4$, the boundary
            correct: true
            feedback: >
              Fewer $4$s means fewer rejections, so $\Pr(T \ge 4)$ is largest
              at the top of the null range. If the boundary passes, every
              $p \le 1/4$ passes.
          - text: >
              An average over all $p$ from $0$ to $1/4$
            feedback: >
              The level is a guarantee, not an average. A test that wrongly
              accuses some dice in the null too often fails, however well it
              does on the rest.
        feedback: >
          A composite null is tested at its least favourable member, which is
          usually the boundary value. That is why "$\mu \le 0$" and
          "$\mu = 0$" lead to the same rejection region.
      - teach: >
          Asked "is this coin fair?" or "does my signal make money?", say the
          four pieces before any data: $H_0$, the one you can compute under;
          $H_1$; the statistic; and the region, with its level. Then a result
          outside the region is reported as "fail to reject", never as proof
          of the null.

  - node: quant-statistics.testing.type-errors
    hook: >
      Every "how confident are you" follow-up is really asking you to name
      a probability that depends on which hypothesis is actually true —
      and there are two different such probabilities, not one.
    explanation: >
      A Type I error rejects a true null; a Type II error fails to reject
      when a specific alternative is actually true. The first has one clean
      number, the size, held at the significance level $\alpha$ you choose
      before looking at data — it doesn't depend on which alternative is
      true, because it's computed entirely under $H_0$. The second, $\beta$,
      does depend on which alternative: an alternative barely different from
      the null is hard to catch, one far away is easy, so there is no single
      $\beta$, only a $\beta$ for every point in the alternative.

      Power, $1 - \beta$ at a given alternative, is the chance the test
      actually catches an effect of that size. Picture the null and
      alternative sampling distributions overlapping: the rejection region
      is a fixed slice carved out of the null's distribution to hold
      $\alpha$ area; power is however much of the alternative's distribution
      happens to fall in that same slice.

      That picture is also why the two errors trade off at fixed sample
      size. Pushing the rejection threshold outward to shrink $\alpha$
      shrinks the slice under the null's curve, but it shrinks by the same
      absolute amount under every alternative's curve too, raising $\beta$
      everywhere at once. The only way to lower both simultaneously is to
      bring in something new — more data, or a statistic with less inherent
      noise — which narrows both curves rather than just relocating the
      boundary between them.
    worked: >
      Screen $100$ traders for manipulative order flow, of whom $5$ are
      truly manipulative and $95$ are clean. Run a test with size
      $\alpha = 0.05$: applied to the $95$ clean traders, the expected
      number wrongly flagged is $95 \times 0.05 \approx 4.75$ — call it $5$
      innocent traders flagged purely from the Type I rate, batch after
      batch. Suppose the test also has power $0.70$ against the actual
      manipulation pattern used: of the $5$ genuinely manipulative traders,
      the expected number caught is $5 \times 0.70 = 3.5$, so about $1.5$
      slip through. Tightening $\alpha$ to $0.01$ would cut the false flags
      toward $1$, but drags power down too — fewer clean traders flagged,
      and fewer guilty ones caught.
    interview: >
      "What's the difference between a Type I and Type II error" is asked
      constantly, sometimes disguised as "what does a p-value of 0.05
      actually control." A sharp answer states that $\alpha$ is fixed and
      known by design while $\beta$ is a function of the true alternative,
      then names the fixed-$n$ tradeoff between them unprompted.
    pitfalls: >
      Quoting "the" Type II error as if it were a single number ignores
      that $\beta$ changes with every alternative considered. Believing a
      lower $\alpha$ is a free upgrade ignores that it raises $\beta$ at
      every alternative simultaneously, unless sample size or the statistic
      itself also changes.
    recap: >
      $\alpha$ is the false-alarm rate fixed by design under the null;
      $\beta$ is the miss rate that depends on which alternative is true,
      and shrinking one at fixed $n$ inflates the other.
    dialogue:
      - part: An alarm on the morning print
        teach: >
          Each morning a desk reads one number $X$, the overnight order
          imbalance in standard units. On an ordinary day $X$ is standard
          normal. On a day a large fund is unwinding, $X$ is normal with mean
          $2.5$ and standard deviation $1$. The desk sounds an alarm whenever
          $X > 2$.
      - ask: >
          On an ordinary day, what is the probability the alarm sounds?
        expects: "0.0228"
        tolerance: 0.0005
        hint: >
          $\Phi(2) \approx 0.9772$.
        feedback: >
          $\Pr(X > 2) = 1 - \Phi(2) \approx 0.0228$: about one ordinary day in
          $44$ sets off a false alarm.
      - ask: >
          On an unwinding day, what is the probability the alarm stays silent?
        expects: "0.3085"
        tolerance: 0.0005
        hint: >
          Standardize $2$ against mean $2.5$ and standard deviation $1$;
          $\Phi(0.5) \approx 0.6915$.
        feedback: >
          $\Pr(X \le 2) = \Phi(2 - 2.5) = \Phi(-0.5) \approx 0.3085$. Almost a
          third of real unwinds go unnoticed.
      - ask: >
          A bigger fund unwinds more violently: $X$ has mean $4$. Same rule.
          What is the probability the alarm stays silent?
        expects: "0.0228"
        tolerance: 0.0005
        feedback: >
          $\Phi(2 - 4) = \Phi(-2) \approx 0.0228$. The same alarm that misses
          $31\%$ of moderate unwinds misses about $2\%$ of violent ones.
      - ask: >
          Risk asks for "the miss rate of the alarm" as a single figure. What
          do you tell them?
        choices:
          - text: >
              $0.3085$, the miss rate on an unwinding day.
            feedback: >
              That is the miss rate for an unwind of mean $2.5$. For mean $4$
              it is $0.0228$, and for mean $2$ it is exactly $0.5$. Which one is
              "the" rate?
          - text: >
              $1 - 0.0228 = 0.9772$.
            feedback: >
              $0.0228$ is computed on ordinary days. Subtracting it from $1$
              gives the chance an ordinary day passes quietly, which says
              nothing about unwinding days.
          - text: >
              There is no single miss rate: it depends on how large the unwind
              is.
            correct: true
            feedback: >
              The false-alarm rate is one number, because "ordinary" is one
              law. "Unwinding" is a family of laws, and each has its own miss
              rate.
        feedback: >
          The two mistakes are not symmetric. One is computed under a single
          law you chose; the other has to be quoted at a particular
          alternative.

      - part: One dial, two mistakes
        ask: >
          The head of desk hates false alarms and moves the threshold from $2$
          to $2.5$. On a day with a mean-$2.5$ unwind, what happens to the
          chance the alarm stays silent?
        choices:
          - text: >
              It is unchanged; the threshold only concerns ordinary days.
            feedback: >
              The threshold cuts the unwinding distribution too. Silence on an
              unwinding day is $\Pr(X \le 2.5)$ with $X$ centred at $2.5$.
          - text: >
              It rises from about $0.31$ to exactly $0.5$.
            correct: true
            feedback: >
              $\Phi(2.5 - 2.5) = \Phi(0) = 0.5$. The false-alarm rate fell to
              $1 - \Phi(2.5) \approx 0.006$, and the miss rate rose to a coin
              flip.
          - text: >
              It falls, since a stricter alarm is a better alarm.
            feedback: >
              Stricter means harder to set off, by anything. A real unwind
              must now push $X$ past $2.5$, which it does only half the time.
        feedback: >
          Moving the threshold trades one mistake for the other: both are
          areas on opposite sides of the same cut.
      - reflect: >
          With one number $X$, the threshold is your only dial, and it cannot
          push both mistakes down at once. Why not, and what would you have to
          change to shrink both?
        hint: >
          Picture the two bell curves and the cut between them.
        answer: >
          The false-alarm rate is the ordinary curve's area to the right of
          the cut; the miss rate is the unwinding curve's area to the left.
          Sliding the cut right shrinks the first and grows the second, so at
          a fixed design they trade off. To shrink both you need the two
          curves further apart relative to their width — more data averaged
          into the statistic, or a sharper statistic.
      - teach: >
          Rejecting a true $H_0$ is a Type I error; its probability is the
          size, held at the level $\alpha$ chosen in advance. Failing to
          reject when a specific alternative is true is a Type II error, with
          probability $\beta$ that depends on the alternative. Power at that
          alternative is $1 - \beta$. Here $\alpha = 0.0228$, and the power is
          $0.6915$ against a mean-$2.5$ unwind and $0.9772$ against a mean-$4$
          one.

      - part: Reading the conventions
        ask: >
          A test is designed with $\alpha = 0.05$ and power $0.80$ at the
          effect it was built for. Over $30$ independent periods in which that
          effect is genuinely present, how many does it expect to miss?
        expects: "6"
        feedback: >
          Each period is missed with probability $\beta = 0.2$, so
          $30 \times 0.2 = 6$. The standard design misses one real effect in
          five, by choice.
      - ask: >
          A colleague says: "my test runs at $\alpha = 1\%$ and yours at
          $5\%$, so mine is more reliable." Same data, same statistic. What is
          missing from the comparison?
        choices:
          - text: >
              Nothing: a smaller $\alpha$ is a stricter, better test.
            feedback: >
              Stricter against false alarms, and therefore weaker against real
              effects. You just watched the miss rate go from $0.31$ to $0.5$
              when the threshold moved out.
          - text: >
              The power: at the same sample size, the $1\%$ test misses more
              real effects.
            correct: true
            feedback: >
              Lowering $\alpha$ moves the critical value out and raises
              $\beta$ at every alternative. Only more data or a sharper
              statistic improves both.
          - text: >
              Nothing: $\alpha = 1\%$ means $99\%$ power.
            feedback: >
              $1 - \alpha$ is the chance of not rejecting a true null. Power
              is computed under an alternative, and the two are unrelated
              numbers.
        feedback: >
          A level quoted without the power at the effect you care about is
          half a description of a test.
      - ask: >
          A strategy with a genuine edge is shelved because its backtest
          failed to clear $5\%$. The null was "no edge". Which error is this?
        choices:
          - text: >
              Type I: the test made a mistake at level $\alpha$.
            feedback: >
              Type I needs a true null that gets rejected. Here the null was
              false and survived.
          - text: >
              Type II: a false null was not rejected.
            correct: true
            feedback: >
              The edge is the alternative, and the test failed to catch it.
              Its probability is $\beta$ at the size of that edge.
          - text: >
              No error: the test correctly found no evidence.
            feedback: >
              The test behaved as a test of that power does, but the verdict
              was wrong: a real edge was let go. That miss is an error, with a
              name and a probability.
        feedback: >
          Name the null first and the error type follows: rejecting it wrongly
          is Type I, keeping it wrongly is Type II.
      - teach: >
          In an interview, quote both numbers and the alternative: "five
          percent false alarms; eighty percent power at an effect of this
          size". A test described by $\alpha$ alone has told you only half of
          what it does.

  - node: quant-statistics.testing.power-curve
    hook: >
      The interview wants you to produce the power formula's derivation
      live, in about three lines, because the derivation is also the
      fastest way to remember which quantities push power up and which
      push it down.
    explanation: >
      Start from the rejection rule itself: reject when
      $\bar{x} > \mu_0 + z_{\alpha}\sigma/\sqrt{n}$, a threshold built
      entirely from the null. Power asks a different question about the
      same rule — if the true mean is actually $\mu_0 + \delta$, how often
      does $\bar{x}$ clear that same fixed threshold?

      Under the true mean, $\bar{x}$ is normal with mean $\mu_0 + \delta$
      and standard deviation $\sigma/\sqrt{n}$. Standardizing the threshold
      against this shifted distribution is the one load-bearing step:
      $\Pr(\bar{x} > \mu_0 + z_\alpha \sigma/\sqrt{n}) =
      \Pr\left(Z > z_\alpha - \dfrac{\delta\sqrt{n}}{\sigma}\right) =
      \Phi\left(\dfrac{\delta\sqrt{n}}{\sigma} - z_\alpha\right)$ —
      subtracting the shifted mean before standardizing is exactly what
      pulls a fresh term, $\delta\sqrt{n}/\sigma$, out of the threshold's
      own $z_\alpha$.

      Everything about power lives in that one ratio, the signal-to-noise
      ratio $\delta\sqrt{n}/\sigma$: a bigger true effect, more data, or
      less noise all move it up, and $\Phi$ is increasing, so power rises
      with each. Set $\delta = 0$ and the ratio collapses to $-z_\alpha$,
      giving power exactly $\alpha$ — a test is never less likely to fire
      under the null than its own level, a useful sanity check on any power
      calculation.
    worked: >
      Take an effect three tenths of a standard deviation, $\delta =
      0.3\sigma$, sample size $n = 64$, and a two-sided test at
      $\alpha = 0.05$, so $z_{\alpha/2} = 1.96$. The signal-to-noise ratio
      is $\delta\sqrt{n}/\sigma = 0.3 \times 8 = 2.4$, so power is
      $\Phi(2.4 - 1.96) = \Phi(0.44) \approx 0.67$ — roughly two chances in
      three of catching this effect at this sample size.
    interview: >
      "How does power depend on sample size and effect size" is answered by
      naming the ratio $\delta\sqrt{n}/\sigma$ directly, not by re-deriving
      from scratch. A fast follow-up — "what's the power exactly at the
      null" — checks that you know it equals $\alpha$.
    pitfalls: >
      Forgetting to use $z_{\alpha/2}$ in place of $z_\alpha$ for a
      two-sided test understates power (or overstates the sample size
      needed). Treating $\sigma$ as something power grows with, rather than
      shrinks with, inverts the formula's one negative dependence.
    recap: >
      Power is $\Phi(\delta\sqrt{n}/\sigma - z_\alpha)$ — a single
      increasing function of the signal-to-noise ratio
      $\delta\sqrt{n}/\sigma$, equal to $\alpha$ exactly at $\delta = 0$.
    dialogue:
      - part: One strategy, one edge, one test
        teach: >
          A market-making strategy's per-trade P&L has a known standard
          deviation of $\sigma = 15$ basis points. You will run $n = 225$
          trades and test $H_0: \mu = 0$ against $\mu > 0$ at the one-sided
          $5\%$ level. Suppose the true edge is $2.5$ basis points per trade.
      - ask: >
          What is the standard deviation of the average $\bar{x}$ of the
          $225$ trades, in basis points?
        expects: "1"
        feedback: >
          $\sigma/\sqrt{n} = 15/15 = 1$ basis point. The rule rejects when
          $\bar{x} > 1.645 \times 1 = 1.645$.
      - ask: >
          With a true edge of $2.5$, what is the probability the rule
          rejects?
        expects: "0.804"
        tolerance: 0.002
        hint: >
          Now $\bar{x}$ is normal with mean $2.5$ and standard deviation $1$.
          $\Phi(0.855) \approx 0.804$.
        feedback: >
          $\Pr(\bar{x} > 1.645) = \Pr(Z > 1.645 - 2.5) = \Phi(0.855) \approx
          0.804$. Four times in five the test catches this edge.
      - ask: >
          And if the true edge is exactly $0$?
        expects: "0.05"
        feedback: >
          Then $\bar{x}$ is standard normal and rejects with probability
          $1 - \Phi(1.645) = 0.05$, the level. At no effect, the power is the
          false-alarm rate.

      - part: Which dials move it
        ask: >
          You quadruple the sample to $900$ trades, same $5\%$ level, same
          $2.5$ edge. Roughly what is the power now?
        choices:
          - text: >
              Still about $0.80$: power depends on the edge, not on $n$.
            feedback: >
              The standard error halves to $0.5$, so the cutoff falls to
              $0.82$ while $\bar{x}$ still centres on $2.5$. The edge now sits
              much further past the cutoff.
          - text: >
              Above $0.999$
            correct: true
            feedback: >
              Cutoff $1.645 \times 0.5 \approx 0.82$; then
              $\Pr(\bar{x} > 0.8225) = \Phi((2.5 - 0.8225)/0.5) = \Phi(3.355)
              \approx 0.9996$.
          - text: >
              About $0.90$: four times the data, a modest gain.
            feedback: >
              The gain is not modest. $(2.5 - 0.8225)/0.5 = 3.355$ standard
              errors, and $\Phi(3.355) \approx 0.9996$.
        feedback: >
          More data narrows both the null curve and the alternative curve,
          and pulls the cutoff toward $0$ while the edge stays put.
      - reflect: >
          You have now computed power twice by hand. Do it once in symbols:
          true mean $\mu_0 + \delta$, known $\sigma$, $n$ observations,
          one-sided level $\alpha$. Which single combination of $\delta$,
          $\sigma$ and $n$ decides the answer?
        hint: >
          The rule rejects when $\bar{x} > \mu_0 + z_{\alpha}\sigma/\sqrt{n}$.
          Standardize under the alternative.
        answer: >
          Under the alternative,
          $(\bar{x} - \mu_0 - \delta)/(\sigma/\sqrt{n})$ is standard normal,
          so the rule rejects when that $Z$ exceeds
          $z_{\alpha} - \delta\sqrt{n}/\sigma$. The power is
          $\Phi(\delta\sqrt{n}/\sigma - z_{\alpha})$, and only the
          signal-to-noise ratio $\delta\sqrt{n}/\sigma$ enters. For the
          strategy, $2.5 \times 15/15 = 2.5$, and $\Phi(2.5 - 1.645)$ is the
          $0.804$ you found.
      - teach: >
          Power as a function of everything:
          $1 - \beta = \Phi(\delta\sqrt{n}/\sigma - z_{\alpha})$. It rises with
          the effect $\delta$, with $\sqrt{n}$ and with $\alpha$; it falls
          with $\sigma$; at $\delta = 0$ it equals $\alpha$. For a two-sided
          test replace $z_{\alpha}$ by $z_{\alpha/2}$ and ignore the
          negligible far tail.
      - ask: >
          A quieter strategy has $\sigma = 7.5$ basis points, the same
          $2.5$ edge and the original $225$ trades. How does its power compare
          with the $900$-trade case?
        choices:
          - text: >
              It is identical.
            correct: true
            feedback: >
              $\delta\sqrt{n}/\sigma = 2.5 \times 15/7.5 = 5$, and the
              $900$-trade case gave $2.5 \times 30/15 = 5$. Halving $\sigma$
              is worth quadrupling $n$.
          - text: >
              Lower: halving the noise is worth only doubling the data.
            feedback: >
              $\sigma$ enters as $1/\sigma$ but $n$ as $\sqrt{n}$, so halving
              $\sigma$ matches multiplying $n$ by four, not two.
          - text: >
              Higher: less noise always beats more data.
            feedback: >
              Neither beats the other; they enter the same ratio. Both cases
              give a signal-to-noise ratio of exactly $5$.
        feedback: >
          The formula has one input that matters, $\delta\sqrt{n}/\sigma$, so
          any change that leaves it fixed leaves the power fixed.

      - part: Tightening, flipping and pointing the wrong way
        ask: >
          Back to $225$ trades and $\sigma = 15$. Risk insists on $\alpha =
          1\%$ one-sided, with $z_{0.01} = 2.326$. What is the power at the
          $2.5$ edge now?
        choices:
          - text: >
              About $0.99$
            feedback: >
              That reads $1 - \alpha$ as power. The power is
              $\Phi(2.5 - 2.326) = \Phi(0.174)$, close to a coin flip.
          - text: >
              About $0.57$
            correct: true
            feedback: >
              $\Phi(2.5 - 2.326) = \Phi(0.174) \approx 0.57$. The stricter
              level cost nearly a third of the power.
          - text: >
              Still about $0.80$
            feedback: >
              The level sits inside the formula: $z_{\alpha}$ grew from
              $1.645$ to $2.326$, eating most of the $2.5$ signal-to-noise
              ratio.
        feedback: >
          Shrinking $\alpha$ at fixed $n$ lowers power at every alternative —
          the trade-off between the two errors, now with a number on it.
      - ask: >
          A colleague runs the test two-sided at $5\%$ but plugs in $1.645$.
          What should the power at the $2.5$ edge be?
        expects: "0.705"
        tolerance: 0.002
        hint: >
          Two-sided at $5\%$ uses $1.96$. $\Phi(0.54) \approx 0.705$.
        feedback: >
          $\Phi(2.5 - 1.96) = \Phi(0.54) \approx 0.705$, not the $0.804$ the
          colleague would report. The far tail adds
          $\Phi(-2.5 - 1.96) \approx 0.000004$, which is why it is ignored.
      - ask: >
          Suppose the strategy actually loses $1$ basis point per trade. What
          is the probability the one-sided test for $\mu > 0$ rejects?
        choices:
          - text: >
              $0.05$, the level, as always under no edge.
            feedback: >
              The level is the rejection rate at exactly $\delta = 0$. Here
              $\delta = -1$, below the null.
          - text: >
              About $0.004$, below the level.
            correct: true
            feedback: >
              $\Phi(-1 - 1.645) = \Phi(-2.645) \approx 0.004$. A one-sided
              test is nearly blind to an effect in the other direction.
          - text: >
              About $0.5$: a large effect either way gets caught.
            feedback: >
              Only effects in the direction of the alternative push $\bar{x}$
              past the cutoff. A losing strategy pushes it the other way.
        feedback: >
          The power curve rises from near $0$ for negative $\delta$, through
          $\alpha$ at $\delta = 0$, toward $1$. A test is never less likely
          to fire at an effect it is looking for than under its own null.
      - teach: >
          In an interview, compute the signal-to-noise ratio first and
          subtract the critical value: "two and a half standard errors,
          minus $1.645$, is $\Phi(0.855)$, about eighty percent." Then say
          which way each dial moves it.

  - node: quant-statistics.testing.pvalue
    hook: >
      "What's your p-value" has one correct definition and at least four
      common wrong ones — the interview is testing whether you can state
      the right one under pressure, not whether you've heard the term.
    explanation: >
      The p-value is a tail probability computed entirely under the null:
      $p = \Pr_{H_0}(T \ge t)$ for the observed value $t$, with the
      direction of "extreme" set by the alternative — the right tail for a
      right-tailed alternative, both tails for a two-sided one. Nothing
      about the alternative's own law enters the computation; only $H_0$'s
      law does.

      The reason it's worth computing rather than just comparing $T$ to one
      fixed threshold: rejecting whenever $p \le \alpha$ reproduces the
      level-$\alpha$ rejection region exactly, because $p$ is a strictly
      decreasing function of how extreme $t$ is. That makes $p$ the
      smallest significance level at which this particular data would have
      rejected — report it once, and every reader can apply their own
      $\alpha$ without you rerunning the test.

      There's a clean fact under the null worth having automatic: when $T$
      is continuous, $p$ itself is $\operatorname{Uniform}(0,1)$-distributed
      under $H_0$, which is exactly why $\Pr(p \le \alpha) = \alpha$ — the
      false-alarm rate you set is the false-alarm rate you get. With a
      discrete statistic the set of attainable p-values is coarse, so the
      true rejection probability sits at or below $\alpha$ rather than
      hitting it exactly — conservative, not exact.
    worked: >
      A one-sided test for a positive trading edge produces a standardized
      statistic $t = 1.8$. The p-value is
      $p = \Pr_{H_0}(T \ge 1.8) = 1 - \Phi(1.8) \approx 1 - 0.9641 = 0.0359$.
      Since $0.0359 \le 0.05$, this data would reject at the conventional
      $5\%$ level — and it's also the smallest level at which it would,
      since any $\alpha$ below $0.0359$ would fail to reject the same data.
    interview: >
      Precisely stating $p = \Pr_{H_0}(T \ge t)$ — under the null, oriented
      by the alternative — is the bar; "the probability the result is due
      to chance" or "the probability $H_0$ is true" both fail it
      immediately. A strong answer adds the smallest-rejecting-level
      reading unprompted.
    pitfalls: >
      Computing the tail probability under some other law than the null —
      the alternative, or the marginal distribution of the data — isn't a
      p-value at all. Reporting a p-value from a discrete statistic as if
      $\Pr(p \le \alpha) = \alpha$ exactly ignores that discreteness only
      gives a conservative bound.
    recap: >
      The p-value is $\Pr_{H_0}(T \ge t)$, oriented by the alternative —
      the smallest level at which the observed data would reject, and
      uniform on $(0,1)$ under the null when $T$ is continuous.
    dialogue:
      - part: One statistic, three thresholds
        teach: >
          A signal's backtest produces a score $Z$ that is standard normal if
          the signal is noise and tends to be larger if it works. Today it
          prints $Z = 2.2$. Your boss asks whether that passes at $5\%$, risk
          asks about $1\%$, and a colleague about $10\%$ — all one-sided, with
          cutoffs $1.645$, $2.326$ and $1.282$.
      - ask: >
          Which of the three levels does $Z = 2.2$ reject at?
        choices:
          - text: >
              All three
            feedback: >
              The $1\%$ cutoff is $2.326$, and $2.2$ falls short of it.
          - text: >
              $10\%$ and $5\%$ only
            correct: true
            feedback: >
              $2.2$ clears $1.282$ and $1.645$, and misses $2.326$.
          - text: >
              $10\%$ only
            feedback: >
              $2.2 > 1.645$, so the $5\%$ test rejects as well.
        feedback: >
          Three questions, three comparisons, and a fourth person with a
          fourth level would need a fourth.
      - ask: >
          If the signal is noise, what is the probability of a score at least
          as large as $2.2$?
        expects: "0.0139"
        tolerance: 0.0005
        hint: >
          $\Phi(2.2) \approx 0.9861$.
        feedback: >
          $\Pr(Z \ge 2.2) = 1 - \Phi(2.2) \approx 0.0139$.
      - reflect: >
          That one number answers all three people at once. How, and why does
          comparing it with a level give the same verdict as comparing $2.2$
          with that level's cutoff?
        hint: >
          The cutoff $z_{\alpha}$ is defined by $\Pr(Z \ge z_{\alpha}) =
          \alpha$.
        answer: >
          The tail probability $\Pr(Z \ge z)$ falls as $z$ rises, so
          $2.2 \ge z_{\alpha}$ exactly when $\Pr(Z \ge 2.2) \le
          \Pr(Z \ge z_{\alpha}) = \alpha$. Any level of at least $0.0139$
          rejects and any smaller one does not: $0.0139$ is the smallest level
          at which this data rejects. Report it, and every reader applies
          their own $\alpha$.
      - teach: >
          That tail probability is the p-value: the probability under $H_0$
          of a result at least as extreme as the one observed, with "extreme"
          oriented by the alternative — $\Pr_{H_0}(T \ge t)$ for a right
          tail, $\Pr_{H_0}(|T| \ge |t|)$ for a two-sided test. Rejecting when
          $p \le \alpha$ is the same test as rejecting when $T$ lands in the
          level-$\alpha$ region.

      - part: Which direction counts as extreme
        ask: >
          Suppose instead the alternative was two-sided: the signal might
          work, or work in reverse. What is the p-value for $Z = 2.2$?
        expects: "0.0278"
        tolerance: 0.001
        feedback: >
          $\Pr(|Z| \ge 2.2) = 2 \times 0.0139 = 0.0278$. A score of $-2.2$
          would be just as extreme, so both tails count.
      - ask: >
          Back to the one-sided alternative "the signal works". The next
          backtest prints $Z = -2.2$. What is the p-value?
        expects: "0.9861"
        tolerance: 0.0005
        hint: >
          Extreme means extreme in the direction of the alternative.
        feedback: >
          $\Pr(Z \ge -2.2) = \Phi(2.2) \approx 0.9861$. Against "the signal
          works", a strongly negative score is about the least extreme result
          possible; the p-value is near $1$, not near $0.0139$.
      - ask: >
          A colleague computes the tail probability of $Z \ge 2.2$ assuming
          the signal works, with $Z$ centred at $3$. Is that a p-value?
        choices:
          - text: >
              Yes: any tail probability of the observed score is a p-value.
            feedback: >
              The tail has to be computed under $H_0$. Under an alternative it
              answers a different question: how surprising the data is if
              the signal works.
          - text: >
              No: a p-value is computed under the null, not the alternative.
            correct: true
            feedback: >
              The null is the one law you can compute under; that is its job.
              $\Pr(Z \ge 2.2)$ with $Z$ centred at $3$ is about $0.79$ and
              measures nothing about the null.
          - text: >
              Yes, and it is the better one, since it uses what you believe.
            feedback: >
              Belief does not enter. The p-value asks how unusual the data is
              if the signal is noise; that is the claim being tested.
        feedback: >
          Three things fix a p-value: the observed statistic, the null law,
          and the direction of the alternative.

      - part: The p-value as a random number
        ask: >
          The signal is pure noise and you rerun the backtest on many fresh,
          independent datasets. In what fraction of runs is the one-sided
          p-value at most $0.10$?
        choices:
          - text: >
              About $0.05$
            feedback: >
              $p \le 0.10$ happens exactly when $Z \ge 1.282$, which has
              probability $0.10$ under the null.
          - text: >
              Almost none: noise should give large p-values.
            feedback: >
              Noise gives every p-value equally often. Small ones are no rarer
              than any other interval of the same width.
          - text: >
              $0.10$
            correct: true
            feedback: >
              $\Pr(p \le a) = \Pr(Z \ge z_a) = a$ for every $a$, so under
              the null $p$ is uniform on $(0,1)$.
        feedback: >
          For a continuous statistic, $p$ is uniform under $H_0$, which is
          why $\Pr(p \le \alpha) = \alpha$ exactly.
      - ask: >
          Now a discrete statistic. A coin is tossed $6$ times, testing
          $p = 1/2$ against a bias toward heads. It lands $5$ heads. What is
          the one-sided p-value?
        expects: "7/64"
        hint: >
          At least as extreme as $5$ heads means $5$ or $6$.
        feedback: >
          $\Pr(X \ge 5) = (\binom{6}{5} + \binom{6}{6})/64 = 7/64 \approx
          0.109$.
      - ask: >
          With that coin, you reject whenever $p \le 0.05$. What is the
          probability, under a fair coin, that you reject?
        expects: "1/64"
        hint: >
          List the attainable p-values: $6$ heads, $5$ heads, and so on.
        feedback: >
          Only $6$ heads gives $p \le 0.05$ (it gives $1/64$); $5$ heads
          already gives $7/64$. So the test rejects with probability
          $1/64 \approx 0.016$, well under the nominal $5\%$. A discrete
          statistic has a coarse ladder of attainable p-values, and the test
          is conservative.

  - node: quant-statistics.testing.pvalue-misreadings
    hook: >
      "A low p-value means the effect is probably real" is the single most
      common wrong sentence said in a stats interview, and naming exactly
      which fallacy it commits is worth more than any formula.
    explanation: >
      The p-value answers $\Pr(\text{data this extreme} \mid H_0)$; the
      sentence people want to say is about $\Pr(H_0 \mid \text{data})$ — a
      completely different conditional, related to the first only through
      Bayes' rule, which needs a prior on $H_0$ that the p-value never
      supplies. Swapping the order of a conditional probability is the same
      error as the prosecutor's fallacy, and it's the source of most of the
      other misreadings too.

      Two consequences worth having concrete. Because the p-value depends
      on sample size as much as on the true effect, it is not an effect
      size: with $n$ large enough, standardizing $\delta/(\sigma/\sqrt{n})$
      sends the statistic to infinity and $p$ to $0$ for literally any
      nonzero $\delta$, however economically tiny. And because a small $n$
      can leave a genuinely large effect underpowered, failing to reject is
      usually a low-power problem, not evidence that the effect is zero —
      it's the same distinction as "innocent" versus "not proven guilty."

      There's also no threshold in nature at $p = 0.05$: $0.049$ and
      $0.051$ carry essentially the same evidence, since $p$ is a
      continuous statistic, not a light switch. The discipline that
      survives all of this: quote the point estimate and its standard
      error first, and let the p-value answer only the narrow question it's
      built for.
    worked: >
      A signal earns an edge of just $0.001$ standard deviations per trade,
      economically negligible after any real transaction cost. Over
      $n = 10^{8}$ trades the standard error is $1/\sqrt{10^{8}} = 0.0001$
      (in units of $\sigma$), so the standardized statistic is
      $0.001 / 0.0001 = 10$ — a $z$ of $10$ carries a p-value on the order
      of $10^{-23}$. The print would read like the discovery of the decade;
      the underlying effect is still $0.001\sigma$ per trade, exactly as
      small as when the search began.
    interview: >
      "Does $p = 0.001$ mean this is a big effect" or "you failed to reject
      at $5\%$ — does that mean there's no edge" both test the same list:
      p-value is not a posterior, not an effect size, and a null result is
      not proof of nothing there. A fluent answer names which specific
      misreading is being tested.
    pitfalls: >
      Reading $1 - p$ as "the probability the result replicates" has no
      basis in the definition at all. Treating a large-sample significant
      result as automatically important skips straight past the size of
      the effect, which the p-value never measured.
    recap: >
      The p-value is a statement about data under the null, not about the
      probability the null is true, the size of the effect, or whether a
      null result means nothing is there.
    dialogue:
      - part: A bag of coins and a flagged one
        teach: >
          A bag holds $200$ coins: $10$ are biased toward heads, the other
          $190$ are fair. Every coin is tossed and tested at the $5\%$ level,
          and the test flags a biased coin $60\%$ of the time. You pull out
          one flagged coin. A colleague says: "flagged at $5\%$, so there is
          at most a $5\%$ chance it is fair."
      - ask: >
          How many fair coins do you expect the test to flag?
        expects: "9.5"
        feedback: >
          Each fair coin is flagged with probability $0.05$, so
          $190 \times 0.05 = 9.5$.
      - ask: >
          What fraction of the flagged coins do you expect to be fair?
        expects: "0.613"
        tolerance: 0.002
        hint: >
          The biased coins contribute $10 \times 0.6 = 6$ flags.
        feedback: >
          $9.5/(9.5 + 6) = 9.5/15.5 = 19/31 \approx 0.613$. Of the flagged
          coins, more than six in ten are fair — not "at most $5\%$".
      - reflect: >
          Every coin was tested at $5\%$, yet $61\%$ of flagged coins are
          fair. What ingredient did your computation use that a p-value, by
          its definition, never contains?
        answer: >
          The make-up of the bag: $190$ fair coins against $10$ biased ones.
          A p-value is a probability of data computed assuming $H_0$; the
          chance $H_0$ is true given the data runs the conditional the other
          way, and turning one into the other needs a prior — here, the
          $95\%$ of coins that were fair before anyone tossed them. With a bag
          that was half biased, the same $5\%$ test would flag mostly biased
          coins.
      - teach: >
          So the first misreading: $p$ is not $\Pr(H_0 \text{ true} \mid
          \text{data})$, which is a posterior and needs a prior. For the same
          reason it is not "the probability the result was due to chance".
          The p-value is a statement about data under the null, and every
          misreading of it reverses or stretches that sentence.

      - part: How big, versus how sure
        ask: >
          Study A measures an edge of $0.02\sigma$ per trade over $n = 40{,}000$
          trades. What is its z-statistic?
        expects: "4"
        hint: >
          The standard error of the mean is $\sigma/\sqrt{n}$.
        feedback: >
          $0.02\sigma/(\sigma/200) = 0.02 \times 200 = 4$, a two-sided p-value
          near $0.00006$.
      - ask: >
          Study B measures an edge of $0.5\sigma$ per trade over $n = 9$
          trades, so $z = 0.5 \times 3 = 1.5$ and $p \approx 0.13$. Which
          statement is right?
        choices:
          - text: >
              A found the larger effect: its p-value is far smaller.
            feedback: >
              A's effect is $0.02\sigma$, B's is $0.5\sigma$ — twenty-five
              times larger. A's p-value is small because $n$ is huge.
          - text: >
              A is more certain to be nonzero; B is the larger effect, measured
              poorly.
            correct: true
            feedback: >
              A p-value mixes effect size with sample size through
              $\delta\sqrt{n}/\sigma$. Large $n$ drives any nonzero effect
              to tiny $p$; small $n$ leaves a big effect at $p = 0.13$.
          - text: >
              B found no effect, since it is not significant.
            feedback: >
              B's best estimate is the larger edge of the two. "Not
              significant" at $n = 9$ says the estimate is noisy, not that it
              is zero.
        feedback: >
          The p-value is not an effect size. Quote the estimate first.
      - ask: >
          Two analysts run the same two-sided test on different weeks and get
          $p = 0.048$ and $p = 0.053$. What separates their evidence?
        choices:
          - text: >
              One found a real effect and the other did not.
            feedback: >
              Those p-values correspond to $|z| \approx 1.98$ and
              $|z| \approx 1.93$ — a gap of $0.04$ standard errors. Nature
              drew no line at $0.05$.
          - text: >
              Almost nothing: the z-statistics are about $1.98$ and $1.93$.
            correct: true
            feedback: >
              The same evidence, landing on either side of a convention. The
              $5\%$ line is a decision rule, not a threshold in the world.
          - text: >
              The second analyst found a $5.3\%$ chance the null is true.
            feedback: >
              That is the posterior misreading again. $0.053$ is the
              probability of a result this extreme if the null holds.
        feedback: >
          $p = 0.049$ and $p = 0.051$ are the same evidence; treat them so.

      - part: What a large or small p does not promise
        ask: >
          A study gets $p = 0.01$, two-sided, so $|z| = 2.576$. Assume the true
          effect is exactly the estimated one. What is the chance an identical
          replication gets $p \le 0.05$?
        choices:
          - text: >
              $0.99$, which is $1 - p$.
            feedback: >
              $1 - p$ is not a replication probability under any reading. The
              replication rejects when its $z$ exceeds $1.96$, and its $z$ is
              centred at $2.576$ with standard deviation $1$.
          - text: >
              About $0.73$
            correct: true
            feedback: >
              $\Phi(2.576 - 1.96) = \Phi(0.616) \approx 0.73$, and that is the
              optimistic case: estimates that just cleared a bar tend to
              overstate the true effect.
          - text: >
              $0.95$, the confidence level.
            feedback: >
              $0.95$ is the chance a true null is not rejected. The
              replication's chance is its power at the true effect, here
              $\Phi(0.616) \approx 0.73$.
        feedback: >
          A replication rejects with probability equal to its power, which the
          original p-value does not tell you.
      - ask: >
          A test with power $0.25$ at the effect that matters returns
          $p = 0.40$. What follows?
        choices:
          - text: >
              The effect is absent.
            feedback: >
              A real effect of that size produces a non-rejection $75\%$ of the
              time. The test was never likely to find it.
          - text: >
              The data supports the null at $60\%$.
            feedback: >
              $1 - p$ is no measure of support for anything. The p-value is
              computed assuming the null; it cannot score it.
          - text: >
              Very little: the experiment was too weak to tell.
            correct: true
            feedback: >
              Failing to reject at low power is mostly a statement about the
              experiment. Report the estimate and its standard error and let
              the width speak.
        feedback: >
          Failing to reject is not evidence of no effect when the power was
          low.
      - teach: >
          The practical rule: quote the estimate and its standard error first,
          the p-value second. Asked what a p-value is, say the sentence whole —
          the probability, if the null were true, of data at least this
          extreme — and stop there. Every misreading adds something to that
          sentence it never contained.

  - node: quant-statistics.testing.one-two-sided
    hook: >
      "Should this be one-sided or two-sided" is asked to catch a very
      specific cheat: picking the direction after seeing which way the
      data leans, which quietly doubles your real false-alarm rate.
    explanation: >
      A two-sided test of $\mu = \mu_0$ splits the $\alpha$ budget between
      both tails and rejects when $|z| \ge z_{\alpha/2}$ — $1.96$ at the
      conventional $5\%$. A one-sided test of $\mu > \mu_0$ spends the
      whole budget on one tail and rejects at the smaller threshold
      $z_\alpha$, $1.645$ at $5\%$. For a symmetric null law, the two-sided
      p-value is exactly twice the one-sided tail probability, since both
      tails contribute equally by symmetry.

      The direction has to be fixed before the data is seen, and the
      reason is arithmetic, not etiquette. If you look at the sign of
      $\hat{\mu}$ first and then decide to test in whichever direction the
      data happens to point, you've effectively built a rule that rejects
      on either tail depending on what showed up — the real Type I rate is
      the sum of both tails' probabilities under $H_0$, turning a nominal
      one-sided $5\%$ test into an actual $10\%$ test.

      Default to two-sided unless a deviation in the "wrong" direction is
      genuinely uninteresting — not merely unexpected. A pricing signal
      that works backwards, or a strategy that loses money in a way that
      would have been a discovery if it made money, is exactly the case
      where the unexpected direction still matters, so two-sided is the
      honest choice even when you privately expect one sign.
    worked: >
      A market maker tests whether a repriced quoting model shifts average
      slippage away from zero and observes $z = 1.75$. Committed to
      two-sided in advance: $|1.75| < 1.96$, fail to reject, with
      $p = 2(1 - \Phi(1.75)) \approx 2 \times 0.0401 = 0.0802$. Had the
      direction (slippage can only worsen) been fixed in advance as
      one-sided instead: $1.75 \ge 1.645$, reject, with $p \approx 0.0401$.
      Same data, opposite verdicts — which is exactly why the direction has
      to be nailed down before the data arrives, not after.
    interview: >
      "One-sided or two-sided here" is answered by first asking whether the
      opposite-direction outcome would still be interesting, then
      committing before any data is examined. A sharp follow-up, "what
      happens to your error rate if you pick the tail after looking," is
      answered with the doubled Type I rate.
    pitfalls: >
      Choosing one-sided purely because it's easier to reject with — a
      smaller critical value — without a genuine reason the opposite
      direction is uninteresting, invalidates the stated $\alpha$.
      Comparing a one-sided p-value directly to a two-sided critical value
      (or vice versa) silently uses the wrong threshold.
    recap: >
      Two-sided spends $\alpha$ on both tails ($1.96$) and one-sided spends
      it all on one ($1.645$) — cheap insurance against exactly the failure
      mode of picking the tail after seeing the data.
    dialogue:
      - part: Same z, two verdicts
        teach: >
          You changed a quoting model and test whether the average fill rate
          moved. The statistic $Z$ is standard normal if nothing changed. The
          data prints $z = 1.85$.
      - ask: >
          Suppose a drop in fill rate would have alarmed you as much as a
          rise. Under the null, what is the probability of a $z$ at least
          $1.85$ away from $0$ in either direction?
        expects: "0.0643"
        tolerance: 0.001
        hint: >
          $\Phi(1.85) \approx 0.9678$. Count both tails.
        feedback: >
          $\Pr(|Z| \ge 1.85) = 2(1 - 0.9678) \approx 0.0643$. Not significant
          at $5\%$.
      - ask: >
          Suppose instead you had decided, before seeing anything, that only a
          rise mattered. What is $\Pr(Z \ge 1.85)$ under the null?
        expects: "0.0322"
        tolerance: 0.0005
        feedback: >
          $1 - 0.9678 \approx 0.0322$, half the two-tailed figure. Significant
          at $5\%$. Same data, opposite verdicts.
      - ask: >
          At $\alpha = 0.05$, what must $z$ clear in each version?
        choices:
          - text: >
              $1.96$ either way; the level is the level.
            feedback: >
              The level is the total false-alarm budget. Spent on one tail it
              buys a cutoff of $1.645$; split across two, each tail gets
              $2.5\%$ and the cutoff is $1.96$.
          - text: >
              $|z| \ge 1.645$ when both directions count, $z \ge 1.96$ when one
              does.
            feedback: >
              Backwards. Spreading $5\%$ over two tails leaves less in each, so
              the two-sided cutoff is the larger one.
          - text: >
              $|z| \ge 1.96$ when both directions count, $z \ge 1.645$ when only
              a rise does.
            correct: true
            feedback: >
              $\Pr(|Z| \ge 1.96) = 0.05 = \Pr(Z \ge 1.645)$. Your $1.85$ sits
              between the two cutoffs, which is why the verdicts split.
        feedback: >
          A two-sided test splits $\alpha$ between the tails and rejects when
          $|z| \ge z_{\alpha/2}$; a one-sided test spends it all on one side
          and rejects when $z \ge z_{\alpha}$. For a symmetric null, the
          two-sided p-value is twice the one-sided tail.

      - part: Picking the tail after the fact
        ask: >
          An analyst always runs a one-sided $5\%$ test but chooses the
          direction after seeing the sign of $z$. If nothing changed, how
          often does the analyst reject?
        expects: "0.1"
        hint: >
          Which values of $z$ lead to a rejection under this habit?
        feedback: >
          Any $z \ge 1.645$ is tested to the right and rejects; any
          $z \le -1.645$ is tested to the left and rejects. That is
          $\Pr(|Z| \ge 1.645) = 0.10$: a nominal $5\%$ test running at $10\%$.
      - reflect: >
          Why does choosing the tail after seeing the data double the error
          rate, and what has to be true for a one-sided test to be honest?
        answer: >
          The rejection region is whatever values would have led to a
          rejection, and under this habit that is both tails at $1.645$ —
          the one-sided cutoff applied twice. A one-sided test is honest only
          when the direction is fixed before the data is seen, and only when
          a deviation the other way would genuinely change nothing you do.
          Then the other tail truly holds no rejections, and the $5\%$ is
          real.
      - teach: >
          So the direction is part of the hypothesis, written down before the
          data arrives. Default to two-sided. The price is small — $1.96$
          instead of $1.645$ — and it buys a test that cannot be tuned after
          the fact.

      - part: When one side is honest
        ask: >
          You test a signal one-sided for positive returns, and it prints
          $z = -3.1$: it reliably loses money. What does your test report?
        choices:
          - text: >
              Reject: $|z| = 3.1$ is far beyond $1.645$.
            feedback: >
              A one-sided test for $\mu > 0$ only rejects in the right tail.
              Its p-value here is $\Pr(Z \ge -3.1) \approx 0.999$.
          - text: >
              Switch to the left tail now; the evidence is overwhelming.
            feedback: >
              That is choosing the tail after the fact — exactly the habit
              that turned $5\%$ into $10\%$.
          - text: >
              Fail to reject, with $p \approx 0.999$: the test cannot see a
              signal that works backwards.
            correct: true
            feedback: >
              And a signal that reliably loses $3$ standard errors is
              tradeable in reverse. It was never uninteresting, so the test
              should have been two-sided.
        feedback: >
          "A signal that works backwards is not uninteresting" is the usual
          reason a one-sided test of a trading signal is the wrong one.
      - ask: >
          What critical value does a two-sided test at $\alpha = 0.10$ use?
        expects: "1.645"
        tolerance: 0.001
        hint: >
          Each tail gets half of $0.10$.
        feedback: >
          $5\%$ in each tail puts the cutoff at $z_{0.05} = 1.645$, the same
          as a one-sided $5\%$ test. A one-sided $5\%$ test rejects in the
          right tail exactly when a two-sided $10\%$ test rejects with a
          positive $z$.
      - ask: >
          Which situation honestly warrants a one-sided test?
        choices:
          - text: >
              A latency patch, because the one-sided test passes more easily.
            feedback: >
              Easier to pass is the reason not to. A patch that made latency
              worse would matter a great deal.
          - text: >
              A capital buffer checked only for a shortfall below the
              regulatory minimum, where a surplus triggers no action.
            correct: true
            feedback: >
              Only one direction changes what anyone does, and that is
              settled before the data. The other tail is honestly empty.
          - text: >
              A trading signal, because you would only ever trade it long.
            feedback: >
              If it reliably loses, you can trade it short or must at least
              know it is broken. A deviation the other way is not
              uninteresting.
        feedback: >
          The test is one-sided when the question is one-sided — fixed in
          advance, with nothing you would do differently on the other side.

  - node: quant-statistics.testing.ztest
    hook: >
      "Test whether this sample mean differs from zero" is the single most
      common quant stats question, and the z-test recipe needs to come out
      in one breath, cold.
    explanation: >
      The z-test is licensed whenever the statistic's null law is
      approximately normal — either because $\sigma$ is genuinely known, or
      because $n$ is large enough that the sample mean's own distribution
      has already collapsed into a normal shape regardless of the
      underlying data's shape. That collapse is exactly what makes
      standardizing legal: with $\bar{x}$ approximately
      $\operatorname{Normal}(\mu_0, \sigma^2/n)$ under $H_0$,
      $z = (\bar{x} - \mu_0)/(\sigma/\sqrt{n})$ is approximately standard
      normal, and every subsequent step just reads off a fixed table.

      The recipe: fix $H_0$ so it pins down $\mu_0$ and the null standard
      deviation; form $z = (\bar{x} - \mu_0)/(\sigma/\sqrt{n})$; compare
      $|z|$ to $z_{\alpha/2}$, or convert to $p = 2(1 - \Phi(|z|))$; report
      the estimate with its uncertainty, $\bar{x} \pm
      z_{\alpha/2}\sigma/\sqrt{n}$, alongside the verdict rather than the
      verdict alone. For a proportion, the null variance is $p_0(1-p_0)$ —
      the value fixed by $H_0$, not whatever the sample happened to
      produce, since the whole computation runs under the null.

      Three quantiles earn automatic recall because they set every
      two-sided threshold in this unit: $1.645$, $1.96$, $2.576$ for
      $90\%$, $95\%$, $99\%$ two-sided confidence.
    worked: >
      A strategy's daily returns over $n = 100$ days average
      $\bar{x} = 0.5\%$, against a known historical daily volatility
      $\sigma = 2\%$. Testing $H_0: \mu = 0$ two-sided:
      $z = 0.005 / (0.02/\sqrt{100}) = 0.005/0.002 = 2.5$, giving
      $p = 2(1 - \Phi(2.5)) \approx 2 \times 0.0062 = 0.0124$ — reject at
      $5\%$. The accompanying interval,
      $0.5\% \pm 1.96 \times 0.2\% = [0.108\%, 0.892\%]$, excludes zero,
      consistent with the rejection.
    interview: >
      "Walk me through testing whether this sample mean is significantly
      different from zero" wants the four-step recipe produced without
      hesitation, including naming the CLT (or known $\sigma$) as the
      reason the normal table applies at all. A common trap swaps in a
      proportion and checks whether you use $p_0(1-p_0)$, not the sample's
      own variance.
    pitfalls: >
      Plugging the sample's own standard deviation into the proportion
      variance instead of the null value $p_0(1-p_0)$ computes the wrong
      test entirely. Reaching for a z-test with $\sigma$ genuinely unknown
      and $n$ too small for the CLT to have taken hold silently understates
      the true uncertainty — that's exactly the gap the t-test exists to
      close.
    recap: >
      Standardize $\bar{x}$ by its null standard error and compare to the
      normal table — legal whenever $\sigma$ is known or $n$ is large
      enough for the CLT to apply, with $1.645/1.96/2.576$ as the three
      thresholds to know cold.
    dialogue:
      - part: An average and a yardstick
        teach: >
          Over $n = 400$ trades a strategy averaged $\bar{x} = 4.6$ basis
          points per trade. Years of history put the per-trade standard
          deviation at $\sigma = 40$ basis points. Is the edge real, or noise
          around zero?
      - ask: >
          If the true mean were $0$, what would be the standard deviation of
          the average of $400$ trades, in basis points?
        expects: "2"
        feedback: >
          $\sigma/\sqrt{n} = 40/20 = 2$. By the central limit theorem the
          average is close to normal with this spread, whatever single trades
          look like.
      - ask: >
          Is $4.6$ basis points far from $0$?
        choices:
          - text: >
              No: $4.6$ is tiny next to a standard deviation of $40$.
            feedback: >
              $40$ is the spread of a single trade. The average of $400$
              trades spreads $20$ times less, and that is the yardstick for
              an average.
          - text: >
              It is $2.3$ standard errors from $0$.
            correct: true
            feedback: >
              $4.6/2 = 2.3$. Distance is only meaningful in units of the
              spread of the thing you measured.
          - text: >
              Yes: any positive edge is far from zero.
            feedback: >
              Noise alone produces averages of a few basis points all the
              time: $\pm 2$ is one standard error.
        feedback: >
          The question "is it far?" has no answer until the distance is
          measured against the standard error of the average.
      - ask: >
          What is the two-sided p-value for $H_0: \mu = 0$?
        expects: "0.0214"
        tolerance: 0.001
        hint: >
          $\Phi(2.3) \approx 0.9893$.
        feedback: >
          $2(1 - \Phi(2.3)) \approx 2 \times 0.0107 = 0.0214$. Reject at
          $5\%$, not at $1\%$.
      - reflect: >
          You would do exactly this for any average. Say the steps in order,
          and say what had to be true for the normal table to be the right
          table.
        answer: >
          Write the null mean $\mu_0$; divide the distance
          $\bar{x} - \mu_0$ by the standard error $\sigma/\sqrt{n}$; read
          the normal tail. The table is right because the standardized
          average is standard normal under the null — exactly so for normal
          data with known $\sigma$, approximately so whenever $n$ is large
          enough for the central limit theorem to have taken hold.

      - part: The recipe, and the interval alongside
        teach: >
          That is the z-test: (1) a null that fixes $\mu_0$ and the null
          standard deviation; (2) $z = (\bar{x} - \mu_0)/(\sigma/\sqrt{n})$;
          (3) compare with $z_{\alpha/2}$, or $p = 2(1 - \Phi(|z|))$; (4)
          report $\bar{x} \pm z_{\alpha/2}\sigma/\sqrt{n}$ alongside. The
          quantiles to know cold are $1.645$, $1.96$ and $2.576$ for two-sided
          $90\%$, $95\%$ and $99\%$.
      - ask: >
          What is the lower end of the $95\%$ interval for the strategy's
          mean edge, in basis points?
        expects: "0.68"
        tolerance: 0.005
        feedback: >
          $4.6 - 1.96 \times 2 = 0.68$; the upper end is $8.52$. Zero is
          outside, which matches the rejection. The interval says what the
          p-value does not: the edge could be under one basis point.
      - ask: >
          With the same $4.6$ average, how many trades would put it $4.6$
          standard errors from $0$?
        expects: "1600"
        hint: >
          You need a standard error of $1$.
        feedback: >
          $40/\sqrt{n} = 1$ gives $\sqrt{n} = 40$, $n = 1600$. Four times the
          trades doubles the $z$: evidence grows like $\sqrt{n}$.

      - part: A proportion, and which variance
        ask: >
          An options desk expects $20\%$ of its short puts to be exercised.
          Of $1600$ puts, $352$ were. Testing $H_0: p = 0.20$, which standard
          deviation goes under the observed $\hat{p} - 0.20$?
        choices:
          - text: >
              $\sqrt{0.22 \times 0.78/1600}$, from the observed rate
            feedback: >
              That is the spread if the rate were $0.22$. The test asks how
              unusual $0.22$ is if the rate is $0.20$, so the spread must be
              the null's.
          - text: >
              $\sqrt{0.20 \times 0.80/1600}$, from the null rate
            correct: true
            feedback: >
              The null fixes the variance as well as the mean:
              $p_0(1 - p_0)/n$. That is what makes it a z-test with no
              estimated spread.
          - text: >
              $\sqrt{0.20/1600}$
            feedback: >
              A single exercise is a Bernoulli trial with variance
              $p(1 - p)$, not $p$. This overstates the spread.
        feedback: >
          For a proportion the null hands you both numbers. Use them.
      - ask: >
          What is $z$?
        expects: "2"
        tolerance: 0.005
        hint: >
          $\hat{p} = 352/1600$.
        feedback: >
          $\hat{p} = 0.22$ and $\sqrt{0.16/1600} = 0.01$, so
          $z = 0.02/0.01 = 2.0$, two-sided $p \approx 0.046$. With the
          observed rate's spread, $0.01036$, you would get $1.93$ and the
          verdict flips. And $np_0 = 320$ is far above $10$, so the normal
          approximation is safe.
      - ask: >
          A new strategy has made $8$ trades, and $\sigma$ is estimated from
          those same $8$. Is the z-test right?
        choices:
          - text: >
              Yes: the average of independent trades is always normal.
            feedback: >
              Only approximately, and only for large $n$. Eight trades is not
              large, and the denominator is now random as well.
          - text: >
              Yes, provided you use $1.96$.
            feedback: >
              The cutoff is the problem: with an estimated $\sigma$ from $8$
              points the standardized average has heavier tails than the
              normal, and $1.96$ rejects too often.
          - text: >
              No: $\sigma$ is unknown and $n$ is small, so the standardized
              average is not normal.
            correct: true
            feedback: >
              Both conditions fail. The z-test's licence is a normal null law
              for the statistic; here the table understates the uncertainty,
              which is the gap the t-test closes.
        feedback: >
          Reach for the z-test when $\sigma$ is known or $n$ is large; check
          which before quoting $1.96$.
      - teach: >
          Said aloud: "$4.6$ over a standard error of $2$ is $2.3$ sigma, $p$
          about $2\%$; the $95\%$ interval runs from $0.7$ to $8.5$ basis
          points." The estimate, its standard error, the p-value and the
          interval, in that order.

  - node: quant-statistics.testing.coin-sixty-heads
    hook: >
      A borderline z-score right at the classroom-famous "$z = 2$, reject
      at $5\%$" threshold is exactly where the normal approximation's own
      error matters most — the interview wants you to know that, not just
      recompute $z$.
    explanation: >
      Raw counts are discrete; the normal curve used to approximate them is
      continuous and assigns zero probability to any single point.
      Comparing a count like $60$ directly against a continuous curve, with
      no adjustment, systematically overstates how extreme it looks,
      because the entire probability "belonging" to the integer $60$ gets
      counted as if it sat exactly at the boundary rather than spread
      across $[59.5, 60.5]$.

      That's the whole content of the continuity correction: shift the
      boundary by half a unit toward the observed count before
      standardizing. It matters most exactly at round, borderline-looking
      z-scores — a raw $z$ of $2.0$ can visibly cross a nominal threshold
      while the corrected value, or the exact binomial probability, sits
      just on the other side of it. When a z-score lands close to a
      critical value, treat that as a signal to check the exact or
      corrected version, not as a stronger result.

      Scale is what actually resolves ambiguity, not squinting at the third
      decimal of a borderline p-value: the identical proportion at ten
      times the sample size pushes $z$ up by a factor of $\sqrt{10}$,
      moving a coin-flip verdict from "inside the approximation's own error
      bars" to "not remotely in question."
    worked: >
      Suppose $220$ heads turn up in $400$ tosses. Under $H_0: p=0.5$, the
      mean is $200$ and the standard deviation is
      $\sqrt{400 \times 0.25} = 10$, so the naive $z = (220-200)/10 = 2.0$
      and two-sided $p = 2(1-\Phi(2)) = 0.0455$ — a bare rejection at
      $5\%$. With the continuity correction, $z = (219.5-200)/10 = 1.95$,
      giving $p \approx 2(1-\Phi(1.95)) \approx 0.0512$ — now just short of
      rejecting. As with the classic $100$-toss version, the honest
      verdict at $400$ tosses and a $55\%$ rate sits right inside the
      approximation's own error margin.
    interview: >
      "$60$ heads out of $100$ — is the coin biased" is the textbook
      prompt, and the strong answer computes the naive $z$, then volunteers
      the continuity-corrected or exact version without being asked, naming
      the direction the correction moves the answer.
    pitfalls: >
      Reporting only the naive z-score on a borderline count and stopping
      there misses that the correction (or the exact binomial) can flip the
      verdict. Applying the continuity correction in the wrong direction —
      shifting away from the observed count instead of toward it — makes
      the approximation worse, not better.
    recap: >
      A borderline naive z-score deserves the continuity correction or the
      exact binomial before trusting the verdict — the correction alone can
      flip a bare rejection into a bare non-rejection.
    dialogue:
      - part: Forty heads in sixty-four
        teach: >
          An interviewer tosses a coin $64$ times and it lands heads $40$
          times, a $62.5\%$ rate. "Is the coin biased?" You test
          $H_0: p = 0.5$ two-sided at $5\%$, committed to before the tosses.
      - ask: >
          Under $H_0$, what is the standard deviation of the head count?
        expects: "4"
        feedback: >
          $\sqrt{np(1 - p)} = \sqrt{64 \times 0.25} = \sqrt{16} = 4$, around a
          mean of $32$.
      - ask: >
          What is the z-statistic, using the normal approximation as it
          stands?
        expects: "2"
        feedback: >
          $(40 - 32)/4 = 2.0$.
      - ask: >
          What does that z say at $5\%$, two-sided?
        choices:
          - text: >
              Reject, barely: $p = 2(1 - \Phi(2)) \approx 0.046$.
            correct: true
            feedback: >
              That is what the formula as written produces. Hold on to the
              word "barely".
          - text: >
              Fail to reject: $2$ is below the cutoff.
            feedback: >
              The two-sided $5\%$ cutoff is $1.96$, and $2.0$ clears it.
          - text: >
              Reject decisively: $2$ standard deviations is a lot.
            feedback: >
              $p \approx 0.046$ against a $0.05$ bar is as close as a
              rejection gets. Any small error in the approximation decides
              the verdict.
        feedback: >
          A verdict this close is only as good as the approximation behind
          it, so the approximation is the next thing to check.

      - part: Where the approximation is off
        reflect: >
          The head count only takes whole values; the normal curve is
          continuous. The binomial bar at $40$ covers the stretch from
          $39.5$ to $40.5$. Which part of that bar did your tail from $40$
          leave out, and where should the normal tail start to stand for "at
          least $40$ heads"?
        answer: >
          Starting the tail at exactly $40$ drops the left half of the bar at
          $40$, so it understates $\Pr(X \ge 40)$ and the p-value comes out
          too small. The tail should start at $39.5$, the bar's left edge —
          the continuity correction, shifting the count half a unit toward
          the mean.
      - ask: >
          What is the continuity-corrected z-statistic?
        expects: "1.875"
        tolerance: 0.001
        feedback: >
          $(39.5 - 32)/4 = 7.5/4 = 1.875$.
      - ask: >
          What is the corrected two-sided p-value?
        expects: "0.0608"
        tolerance: 0.002
        hint: >
          $\Phi(1.875) \approx 0.9696$.
        feedback: >
          $2(1 - 0.9696) \approx 0.0608$. Not significant at $5\%$: the
          correction moved the verdict.
      - teach: >
          The exact answer needs no approximation at all: summing the binomial
          tail, $\Pr(X \ge 40) \approx 0.0300$, so the two-sided p-value is
          $2 \times 0.0300 \approx 0.0599$. The corrected normal, $0.061$,
          lands right beside it; the uncorrected $0.046$ was the outlier.
      - ask: >
          What do you tell the interviewer?
        choices:
          - text: >
              The coin is biased at $5\%$, $p = 0.046$.
            feedback: >
              That verdict rests entirely on the half-unit the naive
              approximation dropped. The exact test does not reject.
          - text: >
              Not significant at $5\%$: $p \approx 0.06$ exactly and with the
              correction, so the verdict sits inside the approximation error.
            correct: true
            feedback: >
              Honest and complete: the naive $z$ looks significant, the
              careful versions do not, and the evidence is weak either way.
          - text: >
              The coin is fair.
            feedback: >
              Failing to reject is not acceptance. A coin landing heads
              $62.5\%$ of the time would often produce exactly this result.
        feedback: >
          On a borderline count, the correction or the exact binomial is not
          a refinement; it is the answer.

      - part: What scale settles
        ask: >
          The same $62.5\%$ rate over $256$ tosses: $160$ heads. What is the
          uncorrected z-statistic?
        expects: "4"
        hint: >
          Mean $128$; standard deviation $\sqrt{256 \times 0.25}$.
        feedback: >
          $(160 - 128)/8 = 4.0$, a two-sided p-value near $0.00006$.
      - ask: >
          And the continuity-corrected z at $256$ tosses?
        expects: "3.9375"
        tolerance: 0.001
        feedback: >
          $(159.5 - 128)/8 = 3.9375$. The correction moves $z$ by $0.5/\sigma$:
          $0.125$ at $64$ tosses, $0.0625$ at $256$. It matters only when the
          verdict is close and the count is small.
      - ask: >
          Why did quadrupling the tosses at the same rate double $z$?
        choices:
          - text: >
              The excess heads grow like $n$ and the standard deviation like
              $\sqrt{n}$.
            correct: true
            feedback: >
              Excess $0.125n$ over standard deviation $0.5\sqrt{n}$ gives
              $z = 0.25\sqrt{n}$: $2$ at $n = 64$, $4$ at $n = 256$.
          - text: >
              The bias got stronger with more tosses.
            feedback: >
              The rate stayed at $62.5\%$. Only the precision changed.
          - text: >
              The standard deviation of the count shrank.
            feedback: >
              The count's standard deviation grew, from $4$ to $8$. The
              excess grew faster, from $8$ to $32$.
        feedback: >
          The same rate is borderline at $64$ tosses and decisive at
          $256$; scale, not the rate, settles it.
      - teach: >
          Said aloud: "$z = 2$, which looks like a rejection; with the
          continuity correction it is $1.875$ and $p \approx 0.06$, matching
          the exact binomial — not significant. At four times the tosses the
          same rate would be $z = 4$."

  - node: quant-statistics.testing.t-distribution
    hook: >
      "Why can't I just use the z-table when I don't know $\sigma$" is
      answered by naming exactly what estimating $\sigma$ from the same
      small sample costs you — extra tail weight, not just a formality.
    explanation: >
      Swap the unknown $\sigma$ for the sample standard deviation $s$ and
      the standardized quantity is no longer exactly standard normal,
      because $s$ itself carries sampling noise. When $s$ happens to land
      small by chance, dividing by it inflates $|t|$ beyond what the same
      data would have produced against the true $\sigma$ — an extra source
      of spread that has to show up somewhere in the resulting law's shape.

      That extra spread is fat tails: for iid normal data,
      $t = (\bar{x}-\mu)/(s/\sqrt{n})$ follows the t-distribution with
      $\nu = n-1$ degrees of freedom, constructed as a standard normal
      divided by an independent estimate of its own scale,
      $Z/\sqrt{V/\nu}$ with $V \sim \chi^2_\nu$. Symmetric about $0$ like
      the normal, but with variance $\nu/(\nu-2)$ — strictly larger than
      $1$ for every finite $\nu$, and not even defined once $\nu \le 2$, a
      warning that very small samples can leave $s$ too unstable to trust
      at all.

      The degrees of freedom set exactly how much premium you pay:
      two-sided $95\%$ critical values run $2.776$ at $\nu=4$, $2.228$ at
      $\nu=10$, $2.042$ at $\nu=30$, closing in on the normal's $1.96$ only
      as $\nu$ grows large — the smaller the sample, the more the fat tail
      insures against having estimated the noise level from that same
      small sample.
    worked: >
      With $n=6$ observations ($\nu=5$), a computed statistic comes out
      $|t|=2.4$. The two-sided $5\%$ critical value at $\nu=5$ is $2.571$,
      so $2.4 < 2.571$: fail to reject. Reading the same statistic off the
      z-table instead — $1.96$ — would have wrongly rejected, since
      $2.4 > 1.96$; that gap is exactly the tail-weight premium the
      t-distribution charges for not knowing $\sigma$ at such a small $n$.
    interview: >
      "Why does the t-distribution have fatter tails than the normal"
      wants the estimation-noise explanation, not just "because degrees of
      freedom." A fast follow-up, "what happens as $\nu \to \infty$," is
      answered by naming convergence to the standard normal, since $s$
      becomes an essentially exact estimate of $\sigma$ at large $n$.
    pitfalls: >
      Using the z critical value $1.96$ at small $n$ because "it's close
      enough" understates the true uncertainty exactly where it matters
      most. Forgetting that the t-distribution's variance itself is
      undefined for $\nu \le 2$ can lead to nonsensical variance claims at
      very small samples.
    recap: >
      Standardizing by the estimated $s$ instead of the true $\sigma$ turns
      the exact standard normal into the fatter-tailed $t_{n-1}$,
      converging back to normal only as the degrees of freedom grow.
    dialogue:
      - part: A yardstick cut from the same cloth
        teach: >
          You take two independent draws from a normal distribution whose
          mean $\mu$ and standard deviation $\sigma$ are both unknown. With
          $\sigma$ known, $(\bar{x} - \mu)/(\sigma/\sqrt{2})$ would be
          standard normal and exceed $1.96$ in size $5\%$ of the time. You
          have to use the sample standard deviation $s$ from the same two
          points instead.
      - ask: >
          With $s$ in place of $\sigma$, how often does
          $|\bar{x} - \mu|/(s/\sqrt{2})$ exceed $1.96$?
        choices:
          - text: >
              About $5\%$: $s$ is a fair estimate of $\sigma$, so nothing
              changes.
            feedback: >
              $s$ is right on average, but the ratio is not: dividing by a
              random number that is sometimes tiny produces huge values far
              more often than dividing by the fixed $\sigma$.
          - text: >
              Less than $5\%$: the extra randomness averages out.
            feedback: >
              Randomness in a denominator does not average out. A small $s$
              inflates the ratio without limit, while a large $s$ can shrink
              it only toward $0$.
          - text: >
              Far more than $5\%$
            correct: true
            feedback: >
              About $30\%$ of the time, in fact. Whenever the two draws happen
              to land close together, $s$ is tiny and the ratio explodes.
        feedback: >
          The trouble is entirely in the denominator, so look at it directly.
      - ask: >
          With two points, $s = \sigma|Z|$ for a standard normal $Z$. What is
          the probability that $s$ is less than a tenth of $\sigma$?
        expects: "0.0797"
        tolerance: 0.001
        hint: >
          $\Pr(|Z| < 0.1) = 2\Phi(0.1) - 1$, and $\Phi(0.1) \approx 0.5398$.
        feedback: >
          $2(0.5398) - 1 \approx 0.0797$. About one sample in thirteen
          measures the noise at under a tenth of its true size, and on those
          samples the ratio is more than ten times what $\sigma$ would give.
      - reflect: >
          The numerator is still normal. What does a random denominator do to
          the tails of the ratio, and should the $5\%$ cutoff be larger or
          smaller than $1.96$? How should that depend on the sample size?
        answer: >
          Small values of $s$ blow the ratio up, so its tails are heavier than
          the normal's and the $5\%$ cutoff must be larger than $1.96$. As $n$
          grows, $s$ is computed from more points and settles near $\sigma$,
          so the denominator stops being random in effect, the ratio
          approaches the standard normal, and the cutoff falls back toward
          $1.96$.
      - teach: >
          For iid normal data, $t = (\bar{x} - \mu)/(s/\sqrt{n})$ has the
          t-distribution with $\nu = n - 1$ degrees of freedom: the law of
          $Z/\sqrt{V/\nu}$ with $Z$ standard normal independent of
          $V \sim \chi^{2}_{\nu}$. It is symmetric about $0$, heavier-tailed
          than the normal, and tends to it as $\nu \to \infty$. For your two
          points, $\nu = 1$ and the two-sided $5\%$ cutoff is $12.71$, not
          $1.96$.

      - part: Reading the table
        ask: >
          A sample of $11$ observations is standardized by its own $s$. How
          many degrees of freedom does the t-distribution have?
        expects: "10"
        feedback: >
          $\nu = n - 1 = 10$. One degree is spent estimating the mean that $s$
          measures deviations from. The two-sided $5\%$ cutoff is $2.228$.
      - ask: >
          At $\nu = 4$ the two-sided $5\%$ cutoff is $2.776$. By what factor
          is that wider than $1.96$?
        expects: "1.416"
        tolerance: 0.003
        feedback: >
          $2.776/1.96 \approx 1.416$: an interval more than $40\%$ wider, the
          premium for estimating the noise from five points. At $\nu = 30$,
          $2.042/1.96 \approx 1.04$, and the premium is nearly gone.
      - ask: >
          The variance of $t_{\nu}$ is $\nu/(\nu - 2)$ for $\nu > 2$. What is
          it at $\nu = 6$?
        expects: "1.5"
        feedback: >
          $6/4 = 1.5$, half again the standard normal's $1$. The excess is the
          heavy tails, measured.
      - ask: >
          What is the variance of $t_{2}$?
        choices:
          - text: >
              $1$, like the normal
            feedback: >
              Heavy tails at small $\nu$ go the other way: the variance is
              larger, not equal.
          - text: >
              $2$
            feedback: >
              Plugging $\nu = 2$ into $\nu/(\nu - 2)$ divides by zero. The
              formula holds only for $\nu > 2$.
          - text: >
              It is infinite: the tails are too heavy for a finite variance.
            correct: true
            feedback: >
              At $\nu \le 2$ the integral for the second moment diverges. At
              $\nu = 1$, the Cauchy case, even the mean fails to exist.
        feedback: >
          The variance $\nu/(\nu - 2)$ falls toward $1$ as $\nu$ grows, and
          is undefined at and below $\nu = 2$.

      - part: Which ratios are t
        ask: >
          $Z$ is standard normal. Which ratio has exactly a t-distribution?
        choices:
          - text: >
              $Z/\sqrt{Z^{2}}$
            feedback: >
              The chi-square here is built from the same $Z$, so the
              independence clause fails. The ratio is just the sign of $Z$,
              $\pm 1$.
          - text: >
              $(\bar{x} - \mu)/(s/\sqrt{n})$ from $6$ iid exponential draws
            feedback: >
              The data must be normal. With skewed exponential data the ratio
              is not symmetric and not exactly t, though it approaches the
              normal for large $n$.
          - text: >
              $Z/\sqrt{V/5}$ with $V \sim \chi^{2}_{5}$ independent of $Z$
            correct: true
            feedback: >
              Every clause holds: a standard normal over the root of an
              independent chi-square divided by its degrees of freedom. This
              is $t_{5}$.
          - text: >
              $(\bar{x} - \mu)/(\sigma/\sqrt{n})$ from iid normal data
            feedback: >
              With the true $\sigma$ the ratio is exactly standard normal. The
              t appears only when $\sigma$ is replaced by $s$.
        feedback: >
          Three clauses: a normal numerator, an independent chi-square in the
          denominator, and the right scaling. Drop any one and the law is
          something else.

  - node: quant-statistics.testing.ttest
    hook: >
      "Z-test or t-test" is a fast diagnostic question, and the correct
      answer hinges on whether $\sigma$ is known — not, strictly, on sample
      size, even though small $n$ is where the choice actually bites.
    explanation: >
      The t-test is the z-test recipe unchanged except for two swaps: the
      sample standard deviation $s$ in place of the true $\sigma$, and the
      $t_{n-1}$ table in place of the normal table. Compute
      $t = (\bar{x}-\mu_0)/(s/\sqrt{n})$ and reject when
      $|t| \ge t_{n-1,\alpha/2}$.

      The swap matters enormously at small $n$ and almost not at all past
      roughly $n \approx 30$: at $n=5$, the critical value $2.776$ is over
      $40\%$ wider than the normal's $1.96$, so treating a small sample
      with the z-table's thinner tails would falsely reject far more often
      than the stated $\alpha$ promises. As $n$ grows, $s$ becomes a nearly
      exact estimate of $\sigma$ and the two tests converge.

      Its hypothesis is approximately normal underlying data, or an $n$
      large enough that $\bar{x}$ itself is close to normal by the CLT — it
      tolerates mild skew reasonably well, but not heavy tails or serial
      dependence in the raw data. Daily P&L typically has both, so a raw
      t-statistic on daily returns tends to overstate significance relative
      to what the formula assumes.

      For paired data — the same units measured twice, matched trades,
      before/after — reduce the two series to their differences
      $d_i = x_i - y_i$ first, then run the one-sample t-test on those
      differences alone; this sidesteps ever having to model the
      correlation between the two series directly.
    worked: >
      Over $n=25$ trading days, a strategy's mean daily return is
      $\bar{x}=0.5\%$ with sample standard deviation $s=1\%$. Testing
      $H_0: \mu=0$: $t = 0.005/(0.01/\sqrt{25}) = 0.005/0.002 = 2.5$. With
      $\nu=24$, the two-sided $5\%$ critical value is about $2.064$, and
      $2.5 > 2.064$: reject. Using the z critical value $1.96$ instead
      would have reached the same verdict here, but only because $n=25$
      already sits close to where the two tests agree.
    interview: >
      "When do you use a t-test instead of a z-test" is answered with
      $\sigma$ unknown and estimated from the data, not just "small
      sample" — then volunteer that the practical bite is concentrated at
      small $n$. A common follow-up asks about paired versus independent
      data, checking that you reduce paired data to differences first.
    pitfalls: >
      Running an unpaired test on two series that share a common source of
      noise — the same trading day, the same market regime — throws away
      the variance reduction pairing would have bought and can miss a real
      effect. Running a raw t-test on daily P&L without acknowledging fat
      tails or serial correlation overstates the significance the formula
      actually earns.
    recap: >
      The t-test standardizes by $s/\sqrt{n}$ and reads the $t_{n-1}$ tail
      instead of the normal — nearly identical to the z-test past
      $n \approx 30$, materially wider at small $n$, and only valid for
      independent, roughly normal draws.
    dialogue:
      - part: Five trades and no sigma
        teach: >
          A new strategy has made five trades, returning $-1$, $1$, $3$, $5$
          and $7$ basis points. There is no history, so $\sigma$ is unknown.
          Does it have an edge, testing $H_0: \mu = 0$ two-sided at $5\%$?
      - ask: >
          What is the sample mean, in basis points?
        expects: "3"
        feedback: >
          $(-1 + 1 + 3 + 5 + 7)/5 = 15/5 = 3$.
      - ask: >
          What is the sample standard deviation $s$, dividing by $n - 1$?
        expects: "3.162"
        tolerance: 0.005
        hint: >
          The deviations from $3$ are $-4, -2, 0, 2, 4$.
        feedback: >
          Squared deviations sum to $16 + 4 + 0 + 4 + 16 = 40$; divided by
          $4$ that is $10$, so $s = \sqrt{10} \approx 3.162$.
      - ask: >
          What is $\bar{x}/(s/\sqrt{5})$?
        expects: "2.121"
        tolerance: 0.005
        feedback: >
          $s/\sqrt{5} = \sqrt{10}/\sqrt{5} = \sqrt{2} \approx 1.414$, and
          $3/1.414 \approx 2.121$.
      - ask: >
          What is the verdict at $5\%$?
        choices:
          - text: >
              Reject: $2.121$ clears $1.96$.
            feedback: >
              $1.96$ is the cutoff when $\sigma$ is known. Here the yardstick
              $s$ came from the same five points, and the ratio has the heavy
              tails of $t_{4}$.
          - text: >
              Fail to reject: compare with $t_{5}$, whose cutoff is $2.571$.
            feedback: >
              The verdict happens to come out right, but five observations
              give $\nu = n - 1 = 4$, not $5$. One degree of freedom went into
              estimating the mean that $s$ is measured around.
          - text: >
              Fail to reject: the $t_{4}$ cutoff is $2.776$.
            correct: true
            feedback: >
              $2.121 < 2.776$. The normal table would have called this edge
              real; the honest table does not.
        feedback: >
          The arithmetic is the z-test's. Only the yardstick and the table
          changed: $s$ for $\sigma$, and $t_{n-1}$ for the normal.
      - teach: >
          That is the t-test: $t = (\bar{x} - \mu_0)/(s/\sqrt{n})$, rejecting
          when $|t| \ge t_{n-1,\alpha/2}$. It matters when $n$ is small, and
          it assumes independent draws from a roughly normal distribution.

      - part: Two algorithms on the same days
        teach: >
          Two hedging rules run side by side on the same four days. Rule A
          costs $12$, $20$, $7$ and $15$ basis points; rule B costs $10$,
          $17$, $6$ and $11$. The days themselves differ wildly, from $6$ to
          $20$, yet B is cheaper on every one.
      - reflect: >
          Most of the day-to-day swing is the market, which both rules feel.
          What single series could you test so that the shared swing drops
          out, and why would its spread be smaller?
        answer: >
          The daily differences $d_i = A_i - B_i$: $2, 3, 1, 4$. The market's
          effect on a given day hits both rules, so it cancels in the
          difference, and the differences vary far less than either series.
          Then run the one-sample t-test on the $d_i$ against $\mu_d = 0$ —
          the paired t-test.
      - ask: >
          The differences have mean $2.5$ and $s_d \approx 1.291$. What is
          the paired t-statistic?
        expects: "3.873"
        tolerance: 0.005
        hint: >
          $n = 4$ differences, so the standard error is $s_d/2$.
        feedback: >
          $1.291/2 \approx 0.645$, and $2.5/0.645 \approx 3.873$.
      - ask: >
          What cutoff applies at two-sided $5\%$?
        choices:
          - text: >
              $t_{7}$: there are eight observations in all.
            feedback: >
              After pairing there are four numbers, the differences. The
              degrees of freedom are $4 - 1 = 3$.
          - text: >
              $t_{3}$, cutoff $3.182$: four differences.
            correct: true
            feedback: >
              $3.873 > 3.182$: reject. B is cheaper, on four days of data,
              because the comparison was made day by day.
          - text: >
              $1.96$: the differences are just numbers.
            feedback: >
              Their standard deviation was estimated from four of them, which
              is exactly when the t table matters most.
        feedback: >
          Compared as two separate averages, $13.5$ against $11$, the gap of
          $2.5$ sits under a standard error of about $3.5$, a t near $0.7$.
          Paired, the same gap is almost four standard errors.

      - part: What the t-test assumes
        ask: >
          At $n = 400$ the same $t = 2.121$ arrives. Does the choice of table
          matter now?
        choices:
          - text: >
              Yes: the t table always gives a larger cutoff.
            feedback: >
              Larger, but only just: $t_{399}$'s cutoff is about $1.966$.
              Both tables reject.
          - text: >
              Barely: the $t_{399}$ cutoff is about $1.966$, and both reject.
            correct: true
            feedback: >
              Past $n \approx 30$ the t and normal tables nearly agree, and the
              distinction stops deciding verdicts.
          - text: >
              No, but only because $2.121$ happens to be large.
            feedback: >
              It is not about $2.121$: at $n = 400$ the two cutoffs differ by
              $0.006$, so they agree on almost every statistic.
        feedback: >
          The t-test is the small-sample correction. At large $n$ it is the
          z-test with a cosmetic adjustment.
      - ask: >
          An option-selling strategy shows twelve monthly gains between $1\%$
          and $2\%$, no losses, and a large t-statistic. What is the strongest
          objection?
        choices:
          - text: >
              Twelve is too few: a t-test needs at least thirty observations.
            feedback: >
              Small samples are what the t-test is for; twelve independent,
              roughly normal draws are fine. The problem is what the twelve
              months did not contain.
          - text: >
              The returns are not roughly normal: the strategy carries a rare
              large loss that twelve months have not sampled.
            correct: true
            feedback: >
              Selling options earns small steady premiums and occasionally
              loses many months' worth at once. $s$ measures only what
              happened, so it understates the true spread, and the t-test's
              normality hypothesis fails exactly where it matters.
          - text: >
              None: twelve gains out of twelve is decisive.
            feedback: >
              Twelve calm months are what this strategy produces most of the
              time whether or not it has an edge once the crash is counted.
        feedback: >
          The t-test tolerates mild skew. It does not tolerate heavy tails or
          dependence, and P&L series often have both.
      - teach: >
          Said aloud: "$t = 2.1$ on four degrees of freedom; the cutoff is
          $2.78$, so not significant — the normal table would have misled. If
          the comparison is two strategies on the same days, pair them first."

  - node: quant-statistics.testing.two-sample
    hook: >
      "Compare two trading strategies' returns" is asked constantly, and
      the two things that separate a strong answer from a rote one are
      reaching for Welch's test by default and pairing whenever the two
      series see the same shocks.
    explanation: >
      For two independent samples, the natural statistic is the
      standardized difference of means,
      $t = (\bar{x}_1-\bar{x}_2)/\sqrt{s_1^2/n_1 + s_2^2/n_2}$ — the
      denominator is just the variance-of-a-difference formula,
      $\operatorname{Var}(\bar{x}_1) + \operatorname{Var}(\bar{x}_2)$, since
      independent variances add. Welch's version lets $s_1^2/n_1$ and
      $s_2^2/n_2$ differ freely and uses a fractional degrees-of-freedom
      correction; the pooled-variance alternative assumes the two
      populations share one true variance, an assumption rarely worth
      making for two different strategies or two different assets.

      Pairing changes the comparison entirely, and it's worth reaching for
      whenever the two series are measured on the same underlying event —
      the same trading day, the same client. With equal variances $\sigma^2$
      and correlation $\rho$ between the matched pair,
      $\operatorname{Var}(x_1-x_2) = \operatorname{Var}(x_1) +
      \operatorname{Var}(x_2) - 2\operatorname{Cov}(x_1,x_2) =
      2\sigma^2 - 2\rho\sigma^2 = 2\sigma^2(1-\rho)$ — the correlation term
      subtracts directly, so any shared shock cancels out of the difference
      rather than adding uncertainty to both sides independently.

      The bigger $\rho$ is, the more this buys: comparing two strategies
      day by day, so the shared market factor cancels inside each day's
      difference, is exactly this move in practice, and it's why paired
      comparisons of correlated series routinely find significance that an
      unpaired comparison of the same two series' separate averages would
      miss entirely.
    worked: >
      Two strategies each have daily standard deviation $\sigma = 2\%$ and
      same-day correlation $\rho=0.6$. Unpaired, the difference's standard
      error is $\sqrt{2 \times (0.02)^2} = \sqrt{0.0008} \approx 2.83\%$.
      Paired, it's
      $\sqrt{2 \times (0.02)^2 \times (1-0.6)} = \sqrt{0.00032} \approx
      1.79\%$ — about $37\%$ smaller, equivalent to running the unpaired
      comparison with roughly $1/(1-0.6) = 2.5$ times as much data.
    interview: >
      "How would you test whether strategy A outperforms strategy B" should
      default to Welch, not pooled variance, unless there's a real reason
      to assume equal variances — and should immediately ask whether the
      two series share a common driver worth pairing on.
    pitfalls: >
      Using the pooled-variance test out of habit when the two series
      plainly have different variances biases the standard error.
      Comparing two strategies' separately-averaged returns instead of
      pairing them day by day throws away the variance reduction that
      cancels the shared market factor.
    recap: >
      Welch's test is the default for independent samples; pairing
      observations that share a common shock cuts the standard error by a
      factor of $\sqrt{1-\rho}$ instead of leaving the full, uncancelled
      variance in the comparison.
    dialogue:
      - part: Two desks, two averages
        teach: >
          Desk A made $25$ trades averaging $8$ basis points with sample
          standard deviation $10$. Desk B made $36$ trades averaging $3$ with
          sample standard deviation $12$. Different traders, different days,
          nothing shared. Is A's edge really bigger?
      - ask: >
          What is the standard error of Desk A's average, in basis points?
        expects: "2"
        feedback: >
          $s_1/\sqrt{n_1} = 10/5 = 2$. Desk B's is $12/6 = 2$ as well.
      - ask: >
          What is the standard error of the difference of the two averages?
        expects: "2.828"
        tolerance: 0.005
        hint: >
          The desks are independent, so the variances of their averages add.
        feedback: >
          $\sqrt{2^{2} + 2^{2}} = \sqrt{8} \approx 2.828$. Not $2 + 2 = 4$:
          variances add, so standard errors add in quadrature.
      - ask: >
          What is the t-statistic for $H_0$: equal means?
        expects: "1.768"
        tolerance: 0.005
        feedback: >
          $(8 - 3)/2.828 \approx 1.768$. Not significant at two-sided $5\%$:
          a five-point gap is under two standard errors of the difference.
      - ask: >
          A colleague instead pools both samples into one variance estimate.
          What does pooling assume?
        choices:
          - text: >
              That the two desks have equal sample sizes.
            feedback: >
              Pooling handles unequal sizes fine; it weights each sample's
              variance by its degrees of freedom. What it needs is something
              else.
          - text: >
              That the two desks have the same underlying variance.
            correct: true
            feedback: >
              One pooled $s^{2}$ means one true $\sigma^{2}$ for both. With
              $10$ against $12$ here, and real desks rarely matched, the
              assumption is seldom worth making.
          - text: >
              That the two desks have the same mean.
            feedback: >
              Equal means is the null being tested, under either method.
              Pooling adds an assumption about the spreads.
        feedback: >
          What you computed is Welch's test:
          $t = (\bar{x}_1 - \bar{x}_2)/\sqrt{s_1^{2}/n_1 + s_2^{2}/n_2}$, with a
          fractional degrees of freedom read from software. It drops the
          equal-variance assumption at almost no cost.

      - part: Two strategies on the same days
        teach: >
          Now two strategies trade the same book for $50$ days. Each has daily
          P&L standard deviation $\sigma = 3$ basis points, and their same-day
          P&Ls correlate at $\rho = 0.8$, because both ride the same market.
      - ask: >
          Treated as two independent samples of $50$, what is the standard
          error of the difference in mean daily P&L?
        expects: "0.6"
        tolerance: 0.001
        feedback: >
          $\sqrt{9/50 + 9/50} = \sqrt{0.36} = 0.6$ basis points.
      - reflect: >
          Most of each day's P&L is the market the two share. What could you
          compute each day so that the shared part cancels, and what does the
          correlation do to its spread?
        hint: >
          $\operatorname{Var}(X - Y) = \operatorname{Var}(X) +
          \operatorname{Var}(Y) - 2\operatorname{Cov}(X, Y)$.
        answer: >
          Take the daily difference $d_i$ and test its mean, a one-sample
          t-test on $50$ numbers. Its variance is
          $\sigma^{2} + \sigma^{2} - 2\rho\sigma^{2} = 2\sigma^{2}(1 - \rho)$:
          the covariance term subtracts the shared part. At $\rho = 0.8$ only
          a fifth of the unpaired variance is left.
      - ask: >
          What is the standard error of the mean daily difference, paired?
        expects: "0.268"
        tolerance: 0.002
        feedback: >
          $\operatorname{Var}(d_i) = 2 \times 9 \times 0.2 = 3.6$, so the
          standard error is $\sqrt{3.6/50} = \sqrt{0.072} \approx 0.268$.
      - ask: >
          By what factor did pairing shrink the standard error?
        expects: "2.236"
        tolerance: 0.005
        feedback: >
          $0.6/0.268 \approx 2.236 = \sqrt{5} = 1/\sqrt{1 - 0.8}$. To match it
          unpaired you would need five times the days.
      - teach: >
          Pair whenever the two series see the same shocks: reduce them to
          differences and run the one-sample t-test. With equal variances the
          standard error shrinks by $\sqrt{1 - \rho}$. Comparing strategies
          day by day rather than by their separate averages is this move; the
          market factor cancels.

      - part: When pairing does nothing, or worse
        ask: >
          Strategy C is a hedge for strategy D: their same-day P&Ls correlate
          at $\rho = -0.5$. Should you pair them to compare their means?
        choices:
          - text: >
              Yes: pairing always reduces the standard error.
            feedback: >
              $2\sigma^{2}(1 - \rho) = 2\sigma^{2}(1.5) = 3\sigma^{2}$, more
              than the unpaired $2\sigma^{2}$. Opposite moves add in the
              difference instead of cancelling.
          - text: >
              Pairing is still the honest analysis, but here it widens the
              standard error by $\sqrt{1.5}$.
            correct: true
            feedback: >
              The pairing reflects how the data was produced, so it is the
              right variance. It just turns out larger, about $22\%$ larger in
              standard error.
          - text: >
              It makes no difference; correlation only matters when positive.
            feedback: >
              The formula is $1 - \rho$ for any sign. Negative correlation
              inflates the variance of the difference.
        feedback: >
          The gain from pairing is the shared shock. When the two move against
          each other, the difference amplifies the shock rather than removing
          it.
      - ask: >
          Could you pair Desk A's $25$ trades with Desk B's $36$?
        choices:
          - text: >
              Yes: sort each desk's trades and pair them in order.
            feedback: >
              Sorted pairs share no shock; the pairing would be invented, and
              the difference's variance formula would not apply.
          - text: >
              No: pairing needs matched observations that share a shock, and
              these share nothing.
            correct: true
            feedback: >
              Different traders on different days have nothing to cancel.
              Unmatched groups get Welch's test.
          - text: >
              Yes, after dropping $11$ of Desk B's trades at random.
            feedback: >
              Equal counts are not the point. A pair has to be two
              measurements of the same day, the same instrument or the same
              shock.
        feedback: >
          Welch for independent groups; pairing for matched observations.
          The design decides, not the arithmetic.

  - node: quant-statistics.testing.ci
    hook: >
      "Give me a range, not a point estimate" is really asking you to
      invert the test you already know how to run — a confidence interval
      and a hypothesis test are the same computation viewed from two
      directions.
    explanation: >
      A $1-\alpha$ confidence interval for $\theta$ is a random interval
      $C(X)$, built from the data, satisfying
      $\Pr_\theta(\theta \in C(X)) \ge 1-\alpha$ for every possible true
      $\theta$ — a promise about the procedure that generates the interval,
      made before any data is collected, not a claim about one particular
      interval after the fact. The canonical interval for a mean is
      $\bar{x} \pm z_{\alpha/2}\sigma/\sqrt{n}$, or
      $\bar{x} \pm t_{n-1,\alpha/2}\,s/\sqrt{n}$ once $\sigma$ has to be
      estimated.

      The duality with testing falls straight out of the rejection rule:
      the two-sided level-$\alpha$ z-test rejects $\mu_0$ exactly when
      $|\bar{x}-\mu_0| > z_{\alpha/2}\sigma/\sqrt{n}$, which is precisely
      the statement that $\mu_0$ lies outside
      $[\bar{x}-z_{\alpha/2}\sigma/\sqrt{n},\ \bar{x}+z_{\alpha/2}\sigma/\sqrt{n}]$.
      So the confidence interval is nothing but the set of null values this
      data would fail to reject — invert a test at every possible $\mu_0$
      and the collection of survivors is the interval; conversely, check
      whether $\mu_0$ sits inside the interval and you've run the test.

      Width, $2z_{\alpha/2}\sigma/\sqrt{n}$, shrinks only like
      $1/\sqrt{n}$ — the same rate governing every estimate built this way,
      so cutting the interval in half costs four times the data, not
      twice.
    worked: >
      Over $n=50$ measurements of execution slippage, $\bar{x}=1.2$ basis
      points with a known historical $\sigma=3$ basis points. The $95\%$
      interval is $1.2 \pm 1.96 \times 3/\sqrt{50} = 1.2 \pm 0.832$, or
      $[0.368, 2.032]$ basis points. Since $0$ falls outside this interval,
      the equivalent two-sided test of $H_0: \text{slippage}=0$ rejects at
      $5\%$ — the same conclusion the interval and the test give by
      construction.
    interview: >
      "How would you build a confidence interval for this mean" is
      answered with the formula plus, unprompted, the duality with the
      test — that the interval is exactly the set of null values the data
      fails to reject. A common follow-up asks how much data is needed to
      halve the width, checking the $1/\sqrt{n}$ rate.
    pitfalls: >
      Reporting an interval without stating the confidence level attached
      to the procedure that built it strips it of its actual meaning.
      Assuming halving the width only needs twice the data, rather than
      four times, misreads the $1/\sqrt{n}$ shrinkage rate.
    recap: >
      A confidence interval is exactly the set of null values a two-sided
      test at that level would fail to reject, with width shrinking only
      as $1/\sqrt{n}$.
    dialogue:
      - part: Which nulls survive
        teach: >
          Over $n = 36$ trades a signal averaged $\bar{x} = 2.5$ basis points,
          with known $\sigma = 6$, so the standard error is $1$. Four
          colleagues each have a favourite value for the true mean: $0$, $1$,
          $4$ and $5$ basis points. You run the two-sided $5\%$ z-test of each.
      - ask: >
          Which of the four values does the data reject?
        choices:
          - text: >
              Only $0$
            feedback: >
              $\mu_0 = 0$ gives $z = 2.5$, rejected. But $\mu_0 = 5$ gives
              $z = (2.5 - 5)/1 = -2.5$, rejected just as firmly.
          - text: >
              $0$ and $5$
            correct: true
            feedback: >
              $z = 2.5$ and $z = -2.5$ clear $1.96$; $\mu_0 = 1$ and
              $\mu_0 = 4$ give $z = 1.5$ and $-1.5$, which do not.
          - text: >
              $0$ and $1$
            feedback: >
              $\mu_0 = 1$ gives $z = 1.5$, inside $\pm 1.96$. And the test is
              two-sided: values above the estimate can be rejected too.
        feedback: >
          The data rules out values on both sides of $2.5$ and keeps the ones
          close to it.
      - ask: >
          What is the largest value of $\mu_0$ the test fails to reject, in
          basis points?
        expects: "4.46"
        tolerance: 0.005
        feedback: >
          Fail to reject when $|2.5 - \mu_0| < 1.96$, so up to
          $2.5 + 1.96 = 4.46$.
      - ask: >
          And the smallest?
        expects: "0.54"
        tolerance: 0.005
        feedback: >
          $2.5 - 1.96 = 0.54$. Every value strictly between $0.54$ and $4.46$
          survives the test, and nothing else does.
      - reflect: >
          You have found the edges of a set. Describe the set in one line, and
          say what the probability is, before the trades happen, that it will
          contain the true mean.
        hint: >
          The set contains the true $\mu$ exactly when the test of that $\mu$
          fails to reject.
        answer: >
          It is $\bar{x} \pm 1.96\,\sigma/\sqrt{n}$, a random interval because
          $\bar{x}$ is random. It contains the true $\mu$ exactly when the
          $5\%$ test of the true $\mu$ fails to reject, which happens with
          probability $0.95$. So the set of unrejected nulls is a $95\%$
          confidence interval.

      - part: Intervals and tests, both ways
        teach: >
          A $1 - \alpha$ confidence interval is a random interval $C(X)$ with
          $\Pr_{\theta}(\theta \in C(X)) \ge 1 - \alpha$ for every $\theta$.
          Duality: it is exactly the set of null values the two-sided
          level-$\alpha$ test fails to reject. Every test inverts to an
          interval, and every interval is a test — does it contain $\mu_0$?
      - ask: >
          A colleague's $95\%$ interval for an edge is $[-0.3, 2.9]$ basis
          points. Which nulls does the two-sided $5\%$ test reject?
        choices:
          - text: >
              $\mu_0 = 0$, since the estimate is positive.
            feedback: >
              $0$ lies inside the interval, so the test of $\mu_0 = 0$ fails
              to reject. A positive estimate is not a rejection.
          - text: >
              $\mu_0 = 3$ but not $\mu_0 = 0$
            correct: true
            feedback: >
              $3$ is outside, so rejected; $0$ is inside, so not. No test
              needs to be run — the interval already holds every verdict.
          - text: >
              Neither: you would need the raw data.
            feedback: >
              The interval is the set of unrejected nulls. Reading verdicts
              off it is the whole point of the duality.
        feedback: >
          Reading an interval as a test costs nothing: inside means "not
          rejected", outside means "rejected".
      - ask: >
          Back to the signal, with interval width $2 \times 1.96 = 3.92$. How
          many trades would halve that width?
        expects: "144"
        hint: >
          The width is proportional to $1/\sqrt{n}$.
        feedback: >
          Halving the width means halving $\sigma/\sqrt{n}$, so $\sqrt{n}$
          doubles from $6$ to $12$ and $n = 144$. Halving the width costs four
          times the data.
      - ask: >
          From the same $36$ trades you build a $90\%$ interval and a $99\%$
          one. Which is wider, and by what multiplier on the standard error?
        choices:
          - text: >
              The $90\%$ one: it makes a more precise claim.
            feedback: >
              A narrower interval is the less confident one. Covering the
              truth $99\%$ of the time takes a wider net.
          - text: >
              The $99\%$ one: $\pm 2.576$ against $\pm 1.645$.
            correct: true
            feedback: >
              $[-0.08, 5.08]$ against $[0.86, 4.14]$. Note that the $99\%$
              interval contains $0$: at the $1\%$ level the edge is not
              established.
          - text: >
              Neither: the width depends only on $\sigma$ and $n$.
            feedback: >
              The width is $2z_{\alpha/2}\sigma/\sqrt{n}$, and $z_{\alpha/2}$
              depends on the level.
        feedback: >
          Width is the level's quantile times the standard error, times two.
      - ask: >
          Suppose $\sigma$ were not known and you estimated $s = 6$ from the
          $36$ trades. What changes in the $95\%$ interval?
        choices:
          - text: >
              Nothing: $s$ came out equal to the old $\sigma$.
            feedback: >
              The estimate is the same, but its uncertainty is not: the
              quantile must come from the t table.
          - text: >
              $1.96$ becomes $t_{35, 0.025} \approx 2.03$, a slightly wider
              interval.
            correct: true
            feedback: >
              $2.5 \pm 2.03$, about $[0.47, 4.53]$. With $35$ degrees of
              freedom the premium is small.
          - text: >
              The interval is no longer valid: duality needs known $\sigma$.
            feedback: >
              Duality holds for any test. Inverting the t-test gives
              $\bar{x} \pm t_{n-1,\alpha/2}\,s/\sqrt{n}$.
        feedback: >
          The z-interval and the t-interval are the same idea with different
          quantiles.

      - part: One-sided tests and two-sided intervals
        ask: >
          A different signal gives $z = 1.8$ against $\mu_0 = 0$. The
          one-sided $5\%$ test of $\mu > 0$ rejects. Does the $95\%$ two-sided
          interval exclude $0$?
        choices:
          - text: >
              Yes: a test and its interval always agree.
            feedback: >
              They agree when they match. The $95\%$ two-sided interval is
              dual to the two-sided $5\%$ test, which needs $|z| \ge 1.96$.
          - text: >
              No: $1.8 < 1.96$, so $0$ lies inside the two-sided interval.
            correct: true
            feedback: >
              The interval is $\bar{x} \pm 1.96$ standard errors, and
              $\bar{x}$ sits only $1.8$ above $0$. The one-sided test's dual
              is a one-sided bound, $\bar{x} - 1.645$ standard errors, which
              does exclude $0$.
          - text: >
              It depends on the sample size.
            feedback: >
              Everything is already in $z$: the interval excludes $0$ exactly
              when $|z| \ge 1.96$.
        feedback: >
          Duality pairs a test with the interval built from the same tails.
          Mix a one-sided test with a two-sided interval and they can
          disagree.

  - node: quant-statistics.testing.ci-interpretation
    hook: >
      "What does 95% confidence actually mean" is a classic trap, and the
      natural-sounding answer — a 95% chance $\mu$ is in this interval — is
      precisely the wrong one to give.
    explanation: >
      The $95\%$ attaches to the recipe, not to the specific numbers on the
      page. Imagine repeating the entire experiment many times, each time
      computing a fresh interval by the same formula: across that whole
      batch of repetitions, $95\%$ of the resulting intervals cover the one
      fixed, unknown $\theta$. The particular interval you actually
      computed either contains $\theta$ or it doesn't — there's no
      probability left to discuss about that single, already-realized
      outcome, only about the machine that produced it.

      "There is a $95\%$ probability that $\mu$ lies in $[a,b]$" is a
      different statement entirely — the credible-interval reading, which
      treats $\mu$ itself as random and needs a prior distribution on it to
      even be well-defined. Confidence intervals are built without any
      prior at all, so that sentence describes a Bayesian object the
      frequentist procedure never promised to deliver.

      What the interval legitimately does say: values outside it are
      exactly the ones the corresponding test would reject at that level,
      and its width states how precisely this much data can resolve the
      unknown. A wide interval that spans both zero and an economically
      large value is not evidence the effect is absent — it's a statement
      that the experiment simply wasn't informative enough to tell the two
      apart.
    worked: >
      An analyst runs $20$ independent studies, each producing its own
      $95\%$ confidence interval for a different unknown parameter. Across
      this batch, the expected number of intervals that contain their
      respective true parameter is $20 \times 0.95 = 19$ — that's the
      long-run batting average the procedure guarantees. It says nothing
      about whether interval number $7$, once computed and stared at, is
      one of the $19$ or the $1$; there's no probability statement left to
      make about that specific already-computed interval.
    interview: >
      "What exactly does the 95% mean" is a standard trap after any
      confidence interval question — a correct answer names the
      repeated-sampling coverage property explicitly and flags the
      credible-interval reading as a different, Bayesian object that needs
      a prior.
    pitfalls: >
      Saying "there's a $95\%$ chance $\mu$ is in this interval" smuggles
      in a prior on $\mu$ that the frequentist construction never used.
      Reading a wide interval containing zero as proof of no effect
      confuses low information with a negative finding.
    recap: >
      The $95\%$ describes the long-run coverage of the procedure across
      repeated samples, not a probability about the one interval already
      computed — that reading requires a prior and belongs to Bayesian
      credible intervals instead.
    dialogue:
      - part: Thirty analysts, one true mean
        teach: >
          A referee simulates a strategy whose true mean edge is exactly $2$
          basis points. She hands $30$ analysts each a fresh, independent
          sample, and each builds a $90\%$ confidence interval for the mean.
          The analysts do not know the true value; the referee does.
      - ask: >
          How many of the $30$ intervals do you expect to contain $2$?
        expects: "27"
        feedback: >
          Each covers with probability $0.9$, so $30 \times 0.9 = 27$. About
          three will miss.
      - ask: >
          Before analyst 12 draws a sample, what is the probability that the
          interval they are about to build will contain $2$?
        expects: "0.9"
        feedback: >
          $0.9$: the interval is still a random object, and the recipe covers
          the truth $90\%$ of the time.
      - ask: >
          Analyst 12 then reports $[2.3, 3.9]$. Knowing the true mean is $2$,
          what is the probability that this interval contains it?
        expects: "0"
        feedback: >
          $2$ is not in $[2.3, 3.9]$, so the probability is $0$. Once
          computed, an interval either contains the fixed true value or it
          does not; there is nothing random left to have a probability.
      - ask: >
          Analyst 5, who does not know the truth, reports $[0.8, 3.1]$ and
          writes: "there is a $90\%$ probability that the true mean lies in
          $[0.8, 3.1]$." Is the sentence right?
        choices:
          - text: >
              Yes: that is what $90\%$ confidence means.
            feedback: >
              The referee knows the mean is $2$, so for her the probability is
              $1$; for analyst 12's interval it was $0$. A fixed interval and
              a fixed mean leave no $90\%$ anywhere.
          - text: >
              Yes, if the interval is narrow enough.
            feedback: >
              Width has nothing to do with it. The $90\%$ was never a property
              of one interval, narrow or wide.
          - text: >
              No: the $90\%$ describes the recipe across samples, not this
              particular interval.
            correct: true
            feedback: >
              The mean is fixed and the interval is now fixed; it covers or it
              does not. What was $90\%$ was the procedure, before the data.
        feedback: >
          Confidence attaches to the procedure. The probability statement
          about a particular interval needs something the procedure never
          used.
      - reflect: >
          Then what does the $90\%$ buy analyst 5, if not a probability about
          $[0.8, 3.1]$? And what would it take to make their sentence true?
        answer: >
          It buys a track record: intervals built this way cover the truth
          $90\%$ of the time, and analyst 5 used that method. It also buys a
          test reading — every value outside $[0.8, 3.1]$ is rejected at
          $10\%$ — and a width that says how finely this much data resolves
          the mean. To say "$90\%$ probability $\mu$ is in here", you need a
          prior on $\mu$ and a posterior: that is a credible interval, a
          Bayesian object.

      - part: Readings you are allowed
        teach: >
          So the confidence level is a statement about the procedure: across
          repeated samples, $90\%$ of the intervals it produces cover the
          fixed $\theta$, and the one you computed either does or does not.
          The probability statement about a particular interval is the
          credible-interval reading, which needs a prior and a Bayesian setup.
      - ask: >
          Which statement about analyst 5's interval $[0.8, 3.1]$ is
          legitimate?
        choices:
          - text: >
              The probability that $\mu < 0.8$ is $5\%$.
            feedback: >
              The same Bayesian reading, applied to one tail. $\mu$ is fixed;
              it has no probability of being below $0.8$ without a prior.
          - text: >
              A two-sided $10\%$ test would reject $\mu_0 = 0.5$.
            correct: true
            feedback: >
              $0.5$ lies outside the interval, and outside is exactly the set
              of nulls the matching test rejects.
          - text: >
              If the analysis were repeated, $90\%$ of new intervals would
              contain $[0.8, 3.1]$.
            feedback: >
              New intervals cover the true mean $90\%$ of the time; they say
              nothing about containing this old interval.
        feedback: >
          Duality gives the interval a reading that needs no prior: it is the
          list of values the data cannot reject.
      - ask: >
          A strategy's $90\%$ interval for its edge is $[-1.5, 6]$ basis
          points, and costs are $2$. What is the right summary?
        choices:
          - text: >
              No edge: the interval contains $0$.
            feedback: >
              It also contains $4$, $5$ and $6$, all comfortably profitable.
              The data cannot reject zero, and cannot reject a large edge
              either.
          - text: >
              The edge is $2.25$ basis points with $90\%$ probability.
            feedback: >
              $2.25$ is the midpoint, the estimate. The interval's job is to
              say how uncertain that estimate is, and here the answer is
              "very".
          - text: >
              Uninformative: values from losing money to a large edge all
              survive.
            correct: true
            feedback: >
              A wide interval containing both zero and an economically large
              value means the experiment was too small, not that the effect
              is absent.
        feedback: >
          Read the width before the verdict. An interval this wide is a
          request for more data.

      - part: The analysts who missed
        ask: >
          Three of the $30$ analysts' intervals miss $2$. What most likely
          happened to them?
        choices:
          - text: >
              They made arithmetic mistakes.
            feedback: >
              A correctly computed $90\%$ interval misses $10\%$ of the time;
              three misses in $30$ is exactly the expected count.
          - text: >
              Their samples happened to land far from the mean; the recipe
              promises such misses.
            correct: true
            feedback: >
              The $10\%$ miss rate is built in. From the inside, a missing
              interval looks exactly like a covering one.
          - text: >
              Their intervals were too narrow because their $n$ was smaller.
            feedback: >
              Everyone used the same recipe at the same level. Smaller $n$
              gives a wider interval, still covering $90\%$ of the time.
        feedback: >
          No one can tell from their own interval whether they are among the
          $27$ or the $3$. That is why the $90\%$ cannot be moved onto any
          single interval.
      - teach: >
          Asked "what does a $95\%$ confidence interval mean?", say: "if I
          repeated the experiment, $95\%$ of the intervals built this way
          would contain the true value; this one either does or does not.
          Values outside it are rejected at $5\%$."

  - node: quant-statistics.testing.sample-size
    hook: >
      "How many samples do I need to detect this edge" is answered by
      inverting the power formula, and the interview wants the inversion
      done live, not quoted from memory.
    explanation: >
      Start from the power equation and solve for $n$ directly: setting
      $\Phi(\delta\sqrt{n}/\sigma - z_\alpha) = 1-\beta$ and applying
      $\Phi^{-1}$ to both sides gives $\delta\sqrt{n}/\sigma - z_\alpha =
      z_\beta$, using $z_\beta$ for the value with $\Phi(z_\beta)=1-\beta$.
      Rearranging, $\delta\sqrt{n}/\sigma = z_\alpha + z_\beta$, hence
      $n \approx \left(\dfrac{(z_\alpha+z_\beta)\sigma}{\delta}\right)^{2}$,
      with $z_{\alpha/2}$ replacing $z_\alpha$ for a two-sided test.

      The content worth remembering isn't the algebra, it's the scaling:
      $n$ grows like $(\sigma/\delta)^2$, a square-law relationship, so an
      effect half as large needs four times the data, not twice. Every
      "how much data to detect a smaller edge" question is this same
      square-law read backwards.

      Two multipliers are worth having memorized at the conventional
      two-sided $\alpha=0.05$: power $0.80$ gives
      $(1.96+0.84)^2 = 7.85$, power $0.90$ gives $(1.96+1.28)^2=10.5$ — so
      $n \approx 8(\sigma/\delta)^2$ is the fast back-of-envelope answer
      whenever $80\%$ power is the target.
    worked: >
      A strategy's daily returns have $\sigma=1\%$, and the goal is to
      reliably detect an edge of $\delta=0.05\%$ per day at two-sided
      $\alpha=0.05$ and power $0.90$, so the multiplier is $10.5$. Then
      $n \approx 10.5 \times (1\%/0.05\%)^2 = 10.5 \times 400 = 4200$
      trading days — roughly $16$ years of daily data just to resolve an
      edge this small at $90\%$ power.
    interview: >
      "How much data do I need to detect an edge of size $\delta$" is
      answered by writing $n \approx ((z_\alpha+z_\beta)\sigma/\delta)^2$
      from the power equation, then naming the square-law scaling out loud
      before plugging in numbers. A quick sanity check the interviewer
      often wants: halving $\delta$ should roughly quadruple your answer.
    pitfalls: >
      Scaling $n$ linearly with $1/\delta$ instead of quadratically badly
      undersizes the sample needed. Using the two-sided multiplier
      $z_{\alpha/2}+z_\beta$ when the actual test is one-sided (or vice
      versa) mismatches the sample size to the wrong critical value.
    recap: >
      Inverting the power equation gives
      $n \approx ((z_\alpha+z_\beta)\sigma/\delta)^2$, about
      $8(\sigma/\delta)^2$ at the standard $5\%/80\%$ settings — a
      square-law in the effect size, not a linear one.
    dialogue:
      - part: Guessing the trade count
        teach: >
          A signal is believed to earn $2$ basis points per trade, and its
          per-trade P&L has $\sigma = 30$ basis points. You will test
          $H_0: \mu = 0$ two-sided at $5\%$ and want to catch an edge of that
          size with probability $0.80$. How many trades do you need?
      - ask: >
          Try $n = 400$. What is the signal-to-noise ratio
          $\delta\sqrt{n}/\sigma$?
        expects: "1.333"
        tolerance: 0.005
        feedback: >
          $2 \times 20/30 = 4/3 \approx 1.333$.
      - ask: >
          What is the power at $n = 400$?
        expects: "0.265"
        tolerance: 0.003
        hint: >
          Two-sided at $5\%$, so subtract $1.96$. $\Phi(-0.627) \approx
          0.265$.
        feedback: >
          $\Phi(1.333 - 1.96) = \Phi(-0.627) \approx 0.265$. A real edge
          would be missed nearly three times in four.
      - ask: >
          Quadruple to $n = 1600$. Roughly what is the power now?
        choices:
          - text: >
              About $1$: four times $0.265$.
            feedback: >
              Power is not proportional to $n$. The ratio doubles to $2.667$,
              and $\Phi(2.667 - 1.96) = \Phi(0.707) \approx 0.76$.
          - text: >
              About $0.76$, still short of $0.80$.
            correct: true
            feedback: >
              The ratio doubled to $2.667$, and $\Phi(0.707) \approx 0.76$.
              Close, and still short.
          - text: >
              About $0.53$: double the power for four times the data.
            feedback: >
              Doubling happens to the signal-to-noise ratio, not to the power.
              $\Phi(2.667 - 1.96) \approx 0.76$.
        feedback: >
          Guess, compute, guess again: it converges, slowly, and every step
          needs a normal table.
      - reflect: >
          Rather than guessing $n$ and checking, what could you set the
          signal-to-noise ratio equal to, so that $n$ comes out in one step?
        hint: >
          Power $0.80$ means $\Phi(\text{something}) = 0.80$. What is the
          something?
        answer: >
          $\Phi(x) = 0.80$ at $x = z_{0.20} \approx 0.84$. So power $0.80$
          needs $\delta\sqrt{n}/\sigma - 1.96 = 0.84$, that is
          $\delta\sqrt{n}/\sigma = 2.80$. Solve for $n$:
          $\sqrt{n} = 2.80\,\sigma/\delta$, and square.
      - ask: >
          How many trades?
        expects: "1764"
        tolerance: 1
        feedback: >
          $\sqrt{n} = 2.80 \times 30/2 = 42$, so $n = 42^{2} = 1764$. Just
          above the $1600$ that fell short.
      - teach: >
          In general $\delta\sqrt{n}/\sigma = z_{\alpha} + z_{\beta}$, so
          $n \approx ((z_{\alpha} + z_{\beta})\sigma/\delta)^{2}$, with
          $z_{\alpha/2}$ for a two-sided test. At two-sided $5\%$: power $0.80$
          gives the multiplier $(1.96 + 0.84)^{2} = 7.85$ and power $0.90$
          gives $(1.96 + 1.28)^{2} = 10.5$. The back-of-envelope answer is
          $n \approx 8(\sigma/\delta)^{2}$.

      - part: The square law
        ask: >
          The edge turns out to be only $1$ basis point. Same $\sigma$, level
          and power. How many trades?
        expects: "7056"
        tolerance: 2
        hint: >
          How does $n$ scale with $1/\delta$?
        feedback: >
          $(2.80 \times 30/1)^{2} = 84^{2} = 7056$, four times $1764$. Half the
          edge, four times the data.
      - ask: >
          Back to the $2$ basis point edge, now with power $0.90$. How many
          trades?
        expects: "2362"
        tolerance: 5
        feedback: >
          $10.5 \times (30/2)^{2} = 10.5 \times 225 \approx 2362$, or exactly
          $(3.24 \times 15)^{2} = 48.6^{2} \approx 2362$. Going from $80\%$
          to $90\%$ power costs about a third more data.
      - ask: >
          And at power $0.80$, one-sided $5\%$, with $z_{\alpha} = 1.645$?
        expects: "1390"
        tolerance: 3
        feedback: >
          $((1.645 + 0.84) \times 15)^{2} = 37.275^{2} \approx 1389.4$, so
          $1390$ trades. Spending all of $\alpha$ on one tail saves about a
          fifth of the data — honest only if the direction was fixed in
          advance.

      - part: When the input is optimistic
        ask: >
          The $2$ basis point edge came from a backtest, and the live edge is
          really $1.5$. With the $1764$ trades sized for $2$, what is the
          power?
        choices:
          - text: >
              Still $0.80$: the test was designed for it.
            feedback: >
              It was designed for $\delta = 2$. The ratio is now
              $1.5 \times 42/30 = 2.1$, and $\Phi(2.1 - 1.96) = \Phi(0.14)$.
          - text: >
              About $0.56$
            correct: true
            feedback: >
              $\Phi(2.1 - 1.96) = \Phi(0.14) \approx 0.56$. A quarter less
              edge took away nearly a third of the power.
          - text: >
              About $0.60$: three quarters of $0.80$.
            feedback: >
              Power is not linear in $\delta$. It runs through $\Phi$, and
              here the drop is to $\Phi(0.14) \approx 0.56$.
        feedback: >
          Sample sizes inherit every optimism in $\delta$ and $\sigma$
          squared. Size for the smallest edge worth trading, not the one
          the backtest printed.
      - teach: >
          Said aloud: "about eight times $(\sigma/\delta)^{2}$ — here
          $8 \times 225$, call it eighteen hundred trades. Half the edge needs
          four times the data."

  - node: quant-statistics.testing.detect-coin-edge
    hook: >
      "How many flips to catch a coin that's slightly biased" is the
      canonical worked instance of the sample-size formula, and the
      arithmetic — not just the formula — needs to come out fast and
      clean.
    explanation: >
      The recipe is exactly the general one, specialized to a coin: null
      per-flip standard deviation $\sigma=\sqrt{p_0(1-p_0)}$, an effect
      $\delta$ equal to how far the true rate sits from $p_0$, and the same
      $n \approx ((z_\alpha+z_\beta)\sigma/\delta)^2$. The only judgment
      calls are which $\sigma$ to plug in and which side of the test you
      actually need.

      Two refinements are worth doing live rather than stopping at the
      first-pass number. Using the alternative's own variance
      $\sqrt{p(1-p)}$ in place of the null's $\sqrt{p_0(1-p_0)}$ nudges
      $\sigma$ slightly — usually a small correction near $p=0.5$, since
      $p(1-p)$ is flat there. Switching from two-sided to one-sided, when
      the direction of the suspected bias is known in advance, replaces
      $z_{\alpha/2}$ with the smaller $z_\alpha$, which meaningfully cuts
      the required $n$ because the entire error budget goes toward the one
      tail you actually care about.

      The other half of this pattern is reading the formula backward:
      stopping well short of the required $n$ doesn't just weaken the
      result a little, it can leave power near what a coin flip itself
      would give — a reason to distrust any "edge" claimed from a sample
      far smaller than the sizing calculation demands.
    worked: >
      Detect a coin biased at $52\%$ instead of $55\%$ — a smaller edge,
      $\delta = 0.02$ — at the same two-sided $\alpha=0.05$, power $0.80$
      settings, using the null $\sigma=0.5$: the multiplier is still
      $1.96+0.84=2.80$, so $n \approx (2.80 \times 0.5/0.02)^2 = 70^2 =
      4900$ flips. Dropping the true edge from $0.05$ to $0.02$ — less than
      a third the size — pushes the requirement from $784$ flips to
      $4900$, over six times as many, exactly the square-law the formula
      predicts for a smaller $\delta$.
    interview: >
      "How many flips would you need to tell a $52\%$ (or $55\%$, or
      $60\%$) coin from fair" is a stock prompt — plug into
      $n\approx((z_\alpha+z_\beta)\times 0.5/\delta)^2$ live, and volunteer
      that a one-sided version, if the direction of bias is known, needs
      meaningfully fewer flips.
    pitfalls: >
      Reusing a sample-size answer computed for one edge size $\delta$ when
      the actual suspected edge is smaller ignores the square-law
      blowup — a coin only half as biased needs roughly four times the
      flips, not the same number. Quoting the required flip count without
      stating the power target it assumes leaves the number meaningless,
      since a lower power target needs far fewer flips for the same
      $\delta$.
    recap: >
      The coin version of the sample-size formula gives about $4900$ flips
      to detect a $52\%$ coin and $784$ for a $55\%$ coin at the standard
      $5\%/80\%$ settings — the square-law dependence on the edge size made
      concrete.
    dialogue:
      - part: A coin that lands heads a little too often
        teach: >
          A dealer hands you a coin and says it lands heads $54\%$ of the
          time. You will test $H_0: p = 0.5$ two-sided at $5\%$ and want to
          catch a bias that size with probability $0.80$. How many flips?
      - ask: >
          Under the null, what is the standard deviation of a single flip,
          scored $1$ for heads and $0$ for tails?
        expects: "0.5"
        hint: >
          A Bernoulli variable has variance $p(1 - p)$.
        feedback: >
          $\sqrt{0.5 \times 0.5} = 0.5$. The variance is $0.25$; the standard
          deviation is its root.
      - ask: >
          The edge is $\delta = 0.04$ per flip. What is $\sigma/\delta$?
        expects: "12.5"
        feedback: >
          $0.5/0.04 = 12.5$. The noise on one flip is twelve and a half times
          the signal.
      - ask: >
          With the multiplier $z_{\alpha/2} + z_{\beta} = 2.80$, how many
          flips?
        expects: "1225"
        tolerance: 1
        feedback: >
          $n = (2.80 \times 12.5)^{2} = 35^{2} = 1225$.

      - part: What fewer flips buy
        ask: >
          The dealer offers you $300$ flips. What is the power?
        expects: "0.283"
        tolerance: 0.003
        hint: >
          The signal-to-noise ratio is $0.04\sqrt{300}/0.5$.
          $\Phi(-0.574) \approx 0.283$.
        feedback: >
          $0.04 \times 17.32/0.5 \approx 1.386$, and
          $\Phi(1.386 - 1.96) = \Phi(-0.574) \approx 0.283$. Seven times in
          ten, a genuinely biased coin passes as fair.
      - reflect: >
          $54\%$ against $50\%$ sounds like an obvious difference, yet $300$
          flips catch it less than a third of the time. Why?
        answer: >
          The standard error of the head rate after $300$ flips is
          $0.5/\sqrt{300} \approx 0.029$, so a $0.04$ bias sits only about
          $1.4$ standard errors from $0.5$ — less than the $1.96$ needed.
          Each flip carries a $0.5$ standard deviation of noise against a
          $0.04$ signal, and averaging only beats that down like
          $1/\sqrt{n}$.
      - ask: >
          Using the alternative's own standard deviation in the power term
          refines $1225$ to about $1223$. What does that say?
        choices:
          - text: >
              The first answer was wrong and must be redone.
            feedback: >
              Two flips in $1225$ is far inside the rounding of any interview
              answer. The shortcut was right to the precision anyone uses.
          - text: >
              The refinement barely matters: $\sqrt{0.54 \times 0.46} =
              0.498$ is almost $0.5$.
            correct: true
            feedback: >
              Near $p = 0.5$, $p(1 - p)$ is flat, so the two standard
              deviations nearly agree. Say "about $1200$".
          - text: >
              The refined count is the one to quote, to the flip.
            feedback: >
              The inputs $1.96$ and $0.84$ are themselves rounded. A count
              to the flip is false precision.
        feedback: >
          Quote the round number and the settings behind it: "about $1200$
          flips at $5\%$ two-sided and $80\%$ power".

      - part: Other edges, other tests
        ask: >
          The coin turns out to land heads $57\%$ of the time. How many flips
          now, same settings?
        expects: "400"
        tolerance: 1
        hint: >
          $\sigma/\delta = 0.5/0.07$.
        feedback: >
          $(2.80 \times 0.5/0.07)^{2} = 20^{2} = 400$. The edge is $7/4$ as
          large, so the count drops by $(7/4)^{2} \approx 3.06$.
      - ask: >
          Back to the $54\%$ coin, one-sided at $5\%$, so the multiplier is
          $1.645 + 0.84 = 2.485$. How many flips?
        expects: "965"
        tolerance: 2
        feedback: >
          $(2.485 \times 12.5)^{2} \approx 31.06^{2} \approx 965$. About a
          fifth fewer — legitimate only if a coin biased toward tails would
          truly not interest you, decided before flipping.
      - ask: >
          A trader wins $54\%$ of trades, each winning or losing the same
          amount. Roughly how many trades establish the edge at the same
          settings?
        choices:
          - text: >
              About $1225$: the same problem as the coin.
            correct: true
            feedback: >
              Score a trade $+1$ or $-1$: the mean is $0.08$ and the standard
              deviation is about $1$. Both are double the coin's, so
              $\sigma/\delta$ is the same $12.5$ and so is $n$.
          - text: >
              About $306$: the per-trade edge $0.08$ is double the coin's.
            feedback: >
              The edge doubles, but so does the noise: a $\pm 1$ payoff has
              standard deviation $1$, not $0.5$. Only the ratio counts.
          - text: >
              About $4900$: P&L is noisier than a coin.
            feedback: >
              A $\pm 1$ payoff is exactly a rescaled coin. Rescaling moves
              signal and noise together and leaves $n$ unchanged.
        feedback: >
          Only $\sigma/\delta$ matters, so any win-rate edge with symmetric
          payoffs is the coin problem in disguise.
      - teach: >
          Said aloud: "$(2.8 \times 0.5/0.04)^{2}$, about $1200$ flips at five
          percent two-sided and eighty percent power; at $300$ flips the power
          is under thirty percent."

  - node: quant-statistics.testing.multiple-testing
    hook: >
      "You ran 50 backtests and one came back significant" is the standard
      follow-up to any p-value question, and the interviewer wants the
      family-wise error rate computed on the spot, not just the word
      "Bonferroni."
    explanation: >
      Run $m$ tests, each at level $\alpha$, when every null happens to be
      true. If the tests are independent, the chance every single one
      correctly fails to reject is $(1-\alpha)^m$, so the family-wise error
      rate — at least one false rejection — is $1 - (1-\alpha)^m$: a
      multiplication of $m$ independent "no false alarm" events, each
      falling short of certainty, compounds fast.

      Independence isn't needed for a bound, only for the exact formula:
      the union bound gives
      $\Pr(\text{at least one false rejection}) \le \sum_i
      \Pr(\text{test } i \text{ falsely rejects}) = m\alpha$ regardless of
      how the tests are correlated, since the union bound never assumes
      independence in the first place. Bonferroni just runs this bound
      backward: test each hypothesis at $\alpha/m$ instead of $\alpha$, and
      the union bound guarantees the family-wise rate stays at or below
      $\alpha$.

      The price is power — a stricter per-test threshold makes every
      individual test harder to pass — and the bound itself is loose
      exactly when the tests are correlated, which overlapping backtests
      on the same market data almost always are. Sharper tools exist for
      exactly this: Holm's step-down procedure dominates Bonferroni
      uniformly at no extra cost, and Benjamini–Hochberg trades
      family-wise control for control of the false discovery proportion
      instead, useful when some false positives are tolerable as long as
      most flagged results are real.
    worked: >
      Run $m=50$ independent backtests, each at $\alpha=0.05$, on
      strategies that are all pure noise. The family-wise error rate is
      $1 - 0.95^{50} \approx 1 - 0.077 = 0.923$ — over $92\%$ chance at
      least one looks significant by luck alone. Bonferroni's fix: test
      each at $0.05/50 = 0.001$, a two-sided cutoff of roughly
      $|z| \ge 3.29$ instead of the usual $1.96$.
    interview: >
      "How do you account for testing many strategies at once" wants the
      family-wise error rate computed for the actual number tested, not a
      vague "multiple comparisons correction." A sharp follow-up, "is
      Bonferroni exact here," checks whether you flag that the bound is
      conservative and loose under correlation.
    pitfalls: >
      Reporting a single test's p-value from a search over many
      specifications without any correction wildly understates the true
      false-alarm rate. Applying Bonferroni's independence-derived exact
      formula, $1-(1-\alpha)^m$, to strongly correlated tests overstates
      how bad the true family-wise rate actually is — the union bound,
      $m\alpha$, is the safe one to quote when tests are correlated.
    recap: >
      Fifty independent noise strategies each tested at $5\%$ give a
      $92\%$ chance of a false alarm; dividing the per-test level by the
      number of tests caps the family-wise rate at $\alpha$, at the cost
      of power.
    dialogue:
      - part: Ten signals, all noise
        teach: >
          A researcher tests $10$ unrelated signals, each at the $5\%$ level.
          Unknown to anyone, all ten are pure noise and the tests are
          independent.
      - ask: >
          How many signals do you expect to come out significant?
        expects: "0.5"
        feedback: >
          $10 \times 0.05 = 0.5$ false rejections on average.
      - ask: >
          What is the probability that at least one comes out significant?
        expects: "0.401"
        tolerance: 0.001
        hint: >
          Find the probability that none does.
        feedback: >
          All ten pass quietly with probability $0.95^{10} \approx 0.599$, so
          at least one fires with probability $1 - 0.599 \approx 0.401$. Ten
          honest $5\%$ tests give a $40\%$ chance of a false discovery.
      - ask: >
          Suppose instead the ten signals are near-copies of one idea, so the
          tests are strongly positively correlated. The chance of at least one
          false rejection is then:
        choices:
          - text: >
              Higher than $0.401$: more overlap, more chances.
            feedback: >
              Overlap means the tests tend to fire together. In the extreme of
              ten identical tests, there is really only one, and the chance is
              $0.05$.
          - text: >
              Between $0.05$ and $0.401$
            correct: true
            feedback: >
              Correlated tests duplicate one another's false alarms, so fewer
              distinct chances exist. Identical tests give $0.05$; independent
              ones give $0.401$.
          - text: >
              Exactly $0.401$: each test is still at $5\%$.
            feedback: >
              $1 - 0.95^{10}$ multiplies probabilities, which is only valid for
              independent tests.
        feedback: >
          Dependence changes the number. What you want is a bound that holds
          whatever the dependence.
      - ask: >
          Whatever the dependence, what is the largest the chance of at least
          one false rejection can be?
        expects: "0.5"
        hint: >
          The union bound.
        feedback: >
          $\Pr(A_1 \cup \cdots \cup A_{10}) \le \sum \Pr(A_i) = 10 \times
          0.05 = 0.5$, with no assumption about how the events overlap. It
          equals the expected count above, which always bounds the chance of
          at least one.
      - reflect: >
          You want the chance of any false rejection among the ten to be at
          most $5\%$, without knowing how the tests depend on one another.
          What level should each test run at, and why does that work?
        answer: >
          Run each at $0.05/10 = 0.005$. The union bound then gives
          $\Pr(\text{any false rejection}) \le 10 \times 0.005 = 0.05$, and
          the union bound holds for any dependence. Dividing the level by the
          number of tests turns the bound you just computed into a
          guarantee.
      - teach: >
          The probability of at least one false rejection when all nulls are
          true is the family-wise error rate. For $m$ independent tests at
          level $\alpha$ it is $1 - (1 - \alpha)^{m}$, and in general at most
          $m\alpha$. Bonferroni: test each hypothesis at $\alpha/m$ and the
          family-wise rate stays at or below $\alpha$.

      - part: The price of the guarantee
        ask: >
          At a per-test level of $0.005$, two-sided, what $|z|$ must a signal
          clear?
        expects: "2.807"
        tolerance: 0.01
        hint: >
          $0.0025$ in each tail. $\Phi(2.807) \approx 0.9975$.
        feedback: >
          $z_{0.0025} \approx 2.807$, up from $1.96$.
      - ask: >
          One of the ten signals is real, with signal-to-noise ratio $3.5$. Its
          power alone at $5\%$ is $\Phi(3.5 - 1.96) \approx 0.94$. What is its
          power under Bonferroni?
        choices:
          - text: >
              About $0.94$: Bonferroni only affects the noise signals.
            feedback: >
              The cutoff rises for every test, real ones included. A real
              signal must now clear $2.807$, not $1.96$.
          - text: >
              About $0.76$
            correct: true
            feedback: >
              $\Phi(3.5 - 2.807) = \Phi(0.693) \approx 0.76$. Protecting
              against false alarms across the family cost this signal nearly
              a fifth of its power.
          - text: >
              About $0.09$: the power is divided by ten, like the level.
            feedback: >
              The level is divided by ten; the power runs through $\Phi$ and
              falls far less, to $\Phi(0.693) \approx 0.76$.
        feedback: >
          The price of Bonferroni is power, and it grows with $m$.
      - ask: >
          The ten signals are near-copies, strongly correlated, and you apply
          Bonferroni anyway. What is true of the family-wise error rate?
        choices:
          - text: >
              It is well below $5\%$: the bound is loose, and power was given
              up for nothing.
            correct: true
            feedback: >
              With near-identical tests the true rate approaches the per-test
              $0.005$. The guarantee holds; it is just far stronger than you
              asked for.
          - text: >
              It exceeds $5\%$: Bonferroni assumes independence.
            feedback: >
              The union bound needs no independence. That is the whole reason
              to use it.
          - text: >
              It is exactly $5\%$.
            feedback: >
              Only in special cases. For correlated tests it is lower, and
              that slack is power thrown away.
        feedback: >
          Bonferroni is always valid and often conservative, most of all on
          overlapping backtests.

      - part: Sharper than Bonferroni
        ask: >
          Four tests return p-values $0.003$, $0.009$, $0.02$ and $0.2$.
          At family-wise $5\%$, how many does Bonferroni reject?
        expects: "2"
        feedback: >
          The cutoff is $0.05/4 = 0.0125$, cleared by $0.003$ and $0.009$
          only.
      - teach: >
          Holm's step-down does better at no cost. Sort the p-values from
          smallest; compare the smallest with $\alpha/m$, the next with
          $\alpha/(m - 1)$, and so on, and stop at the first that fails —
          rejecting everything before it. It controls the family-wise rate
          just as Bonferroni does, and rejects at least as much.
      - ask: >
          How many of the four does Holm reject?
        expects: "3"
        feedback: >
          $0.003 \le 0.05/4$, $0.009 \le 0.05/3 \approx 0.0167$, and
          $0.02 \le 0.05/2 = 0.025$; then $0.2 > 0.05$ stops it. Three
          rejections against Bonferroni's two. When you can afford fewer
          guarantees — a false discovery proportion rather than any false
          discovery at all — Benjamini–Hochberg goes further still.

  - node: quant-statistics.testing.data-snooping
    hook: >
      "We tried thirty parameter combinations and this one had a great
      Sharpe ratio" should trigger an immediate red flag — the p-value of
      a search's winner is not a p-value at all.
    explanation: >
      The correct null for the best result out of a search isn't "this one
      strategy is noise" — it's "the best of $m$ noise strategies," and the
      maximum of many noise statistics sits far out in the tail even when
      every individual one is unremarkable. Judging the survivor of a
      search against the single-test null massively overstates how
      surprising its result actually is.

      This is the multiple-testing problem in its most common practical
      disguise: every specification tried, including the ones that were
      tweaked, abandoned, or never wrote up, is a member of the search, and
      the honest correction needs the true count of everything tried — a
      number research desks rarely keep accurately, which is exactly what
      makes this trap so persistent.

      Discipline that actually works: hold out data that hasn't been
      touched by any part of the search, and prefer a hypothesis stated and
      frozen before the fit begins, so there's no search left to correct
      for by the time the data is examined. Corrections specific to
      backtest evaluation — adjustments for the number of trials in a
      research pipeline — belong to that later stage of the process, but
      the underlying logic is this node's.
    worked: >
      A desk tests $m=40$ pure-noise parameter combinations, each judged at
      $\alpha=0.05$. The chance at least one looks significant is
      $1 - 0.95^{40} \approx 1 - 0.129 = 0.871$, about $87\%$, and the
      expected number of false discoveries by chance alone is
      $40 \times 0.05 = 2$. Finding exactly two "significant" results out
      of forty backtests is precisely what pure noise predicts — on its
      own, zero evidence of a real edge.
    interview: >
      "How do you know your backtest result isn't just data snooping" wants
      the max-of-noise reframing named directly, plus a concrete question
      back: how many specifications were actually tried, including the
      discarded ones. A strong answer volunteers a held-out sample as the
      real test.
    pitfalls: >
      Quoting the p-value of the single winning specification as if it
      were computed against the honest search null wildly overstates
      significance. Undercounting the number of specifications tried —
      forgetting abandoned variants and parameter sweeps — understates the
      correction that's actually needed.
    recap: >
      The best of many noise strategies looks significant far more often
      than a single test's p-value would suggest — count everything tried,
      and trust only a result confirmed on data the search never touched.
    dialogue:
      - part: Twenty-four backtests and a winner
        teach: >
          A researcher backtests a momentum rule with $8$ lookback windows and
          $3$ entry thresholds: $24$ variants on the same history. Treat them
          as independent and, for now, all pure noise. The best variant prints
          $|z| = 2.5$, a two-sided p-value of $0.012$, and goes into the memo.
      - ask: >
          If all $24$ are noise, how many do you expect to clear $5\%$?
        expects: "1.2"
        feedback: >
          $24 \times 0.05 = 1.2$. A search this size is expected to produce a
          "significant" variant even when there is nothing to find.
      - ask: >
          What is the probability that at least one of the $24$ clears $5\%$?
        expects: "0.708"
        tolerance: 0.002
        hint: >
          $0.95^{24} \approx 0.292$.
        feedback: >
          $1 - 0.95^{24} \approx 1 - 0.292 = 0.708$. Seven searches in ten
          over pure noise produce a winner for the memo.
      - ask: >
          What does the winner's $p = 0.012$ actually measure?
        choices:
          - text: >
              A $1.2\%$ chance that the winner is noise.
            feedback: >
              That is the posterior misreading, and it is worse here: among
              searches like this one, most winners are noise.
          - text: >
              How often one pre-chosen noise variant does this well — not how
              often the best of $24$ does.
            correct: true
            feedback: >
              The p-value was computed as if this variant had been the only
              one tested. The search that picked it is not in the model.
          - text: >
              Nothing to worry about: $0.012$ clears even a strict $5\%$ bar
              with room to spare.
            feedback: >
              Bonferroni over $24$ tests asks for $0.05/24 \approx 0.0021$,
              and $0.012$ is six times too large.
        feedback: >
          A p-value answers "how unusual is this result if I had tested only
          this?". The researcher did not test only this.
      - reflect: >
          What null distribution should the winner's $|z| = 2.5$ be compared
          with, given how it was found? Say how you would compute its honest
          p-value.
        answer: >
          The distribution of the largest $|z|$ among $24$ independent noise
          variants. Each exceeds $2.5$ with probability
          $q = \Pr(|Z| \ge 2.5) \approx 0.0124$, so the best of $24$ does with
          probability $1 - (1 - q)^{24}$. That is the p-value of "the best of
          $24$ noise strategies", the null the search actually tested.
      - ask: >
          Compute it: the probability that the best of $24$ noise variants
          has $|z| \ge 2.5$.
        expects: "0.259"
        tolerance: 0.003
        feedback: >
          $1 - (1 - 0.0124)^{24} \approx 1 - 0.741 = 0.259$. The honest
          p-value is about $0.26$, not $0.012$: the search inflated the
          evidence twentyfold.

      - part: Counting what you tried
        ask: >
          Before this rule, the researcher tried three other rule families of
          $24$ variants each and dropped them. How many tests belong in the
          correction?
        choices:
          - text: >
              $24$: the abandoned families are not in the memo.
            feedback: >
              They were tried on the same data, and any of them could have
              produced the winner. Leaving them out understates the search
              by a factor of four.
          - text: >
              $1$: only one strategy is being proposed.
            feedback: >
              Proposing one is the end of the search, not its size. The
              chance of a spurious winner grows with everything examined.
          - text: >
              $96$: every variant tried, including the abandoned ones.
            correct: true
            feedback: >
              Every specification looked at, every parameter tweak, every
              family dropped — the search is all of it.
        feedback: >
          The count that matters is the count of things you looked at, not
          the count of things you report.
      - ask: >
          Over all $96$ noise variants, how many false discoveries at $5\%$ do
          you expect?
        expects: "4.8"
        feedback: >
          $96 \times 0.05 = 4.8$. Finding four or five "significant" variants
          in this research history is what pure noise predicts.
      - ask: >
          With $96$ tests, Bonferroni puts the per-test level at
          $0.05/96 \approx 0.00052$. Roughly what $|z|$ must the winner
          clear?
        choices:
          - text: >
              $1.96$, as for any $5\%$ test
            feedback: >
              That is the cutoff for a single test. Across $96$ it lets
              through a false discovery almost surely.
          - text: >
              About $3.5$
            correct: true
            feedback: >
              $z_{0.00026} \approx 3.47$. The winner's $2.5$ falls well short.
          - text: >
              About $2.5$, which the winner just meets
            feedback: >
              $|z| = 2.5$ corresponds to $p \approx 0.012$, more than twenty
              times the Bonferroni level.
        feedback: >
          The bar rises slowly with the number of tests, but it rises, and a
          winner found by search has to clear it.

      - part: When the variants overlap
        ask: >
          Neighbouring lookback windows give highly correlated backtests. What
          does that do to the correction?
        choices:
          - text: >
              Nothing: $96$ tests is $96$ tests.
            feedback: >
              Correlated tests tend to fire together, so they offer fewer
              independent chances for a spurious winner.
          - text: >
              It removes the problem: correlated variants are really one test.
            feedback: >
              Fewer effective tests is still more than one. Overlapping
              windows reduce the inflation; they do not remove it.
          - text: >
              The effective number of tests is smaller than $96$, so
              Bonferroni overcorrects, but some correction is still owed.
            correct: true
            feedback: >
              The honest null still involves a maximum over many related
              backtests. Bonferroni stays valid, only conservative.
        feedback: >
          The discipline outlasts the arithmetic: count every specification,
          state the hypothesis before the fit, and keep data the search never
          touched.

  - node: quant-statistics.testing.practical-significance
    hook: >
      "Is this result significant" and "is this worth trading" are
      different questions with different answers, and conflating them in
      front of an interviewer reads as not understanding what a p-value
      measures.
    explanation: >
      Significance answers whether an effect is distinguishable from zero
      given the data collected — nothing about whether it's large enough
      to matter economically. With enough data, an edge far too small to
      survive transaction costs becomes statistically significant; with
      too little data, a genuinely large and tradeable edge can fail to
      clear the conventional bar.

      The fix is to read the interval, not the star next to the p-value. A
      precisely measured but tiny effect — narrow interval, entirely below
      any reasonable cost threshold — is significant and worthless. A wide
      interval spanning both zero and an economically large number isn't a
      null result at all; it's an undecided one, saying the experiment
      collected too little data to tell the two apart, not that the effect
      is absent.

      What actually converts an effect into money is its size measured
      against costs, capacity, and turnover — none of which a t-statistic
      touches. The t-statistic only answers how confident you can be that
      the true effect isn't exactly zero; every other question about
      whether it pays lives entirely outside that number.
    worked: >
      A high-frequency signal earns a mean of $0.03$ basis points per trade
      over $2{,}000{,}000$ trades, standard error $0.008$ basis points:
      $t = 0.03/0.008 = 3.75$, decisively significant. But round-trip costs
      run $0.5$ basis points — more than sixteen times the measured edge —
      so the signal is unprofitable despite the overwhelming significance.
      Contrast a slower signal earning $2$ basis points per trade over just
      $40$ trades, standard error $1.5$ basis points: $t=2/1.5\approx1.33$,
      not significant at $5\%$. If real, that edge would clear the same
      $0.5$ basis-point cost many times over — the honest read is
      "undetermined," not "no edge," since $40$ trades simply isn't enough
      data to tell.
    interview: >
      "This result is statistically significant — does that mean you'd
      trade it" is a direct test of this distinction; the strong answer
      asks for the point estimate, its interval, and the cost structure
      before answering, rather than treating the p-value as the whole
      verdict.
    pitfalls: >
      Treating a significant result as automatically tradeable skips the
      comparison against costs and capacity entirely. Treating a
      non-significant result on a small sample as proof of no edge ignores
      that low power, not a genuinely absent effect, is the more common
      explanation.
    recap: >
      Large samples make trivial effects significant and small samples
      hide real ones — quote the effect size and its interval first, and
      ask separately whether it clears costs.
    dialogue:
      - part: Two signals, two verdicts
        teach: >
          Signal A earns an estimated $0.1$ basis points per trade, with
          standard error $0.02$, over four million trades. Signal B earns an
          estimated $3$ basis points per trade, with standard error $2$, over
          $100$ trades. Each trade costs $0.4$ basis points. The portfolio
          manager wants to fund whichever is significant.
      - ask: >
          What is signal A's z-statistic against $H_0: \mu = 0$?
        expects: "5"
        feedback: >
          $0.1/0.02 = 5$, a p-value below one in a million.
      - ask: >
          And signal B's?
        expects: "1.5"
        feedback: >
          $3/2 = 1.5$, two-sided $p \approx 0.13$. Not significant at $5\%$.
      - ask: >
          Which should be funded?
        choices:
          - text: >
              A: it is overwhelmingly significant.
            feedback: >
              Significant, and losing: it earns $0.1$ and pays $0.4$, so every
              trade loses about $0.3$ basis points. Four million trades made
              that loss very precisely measured.
          - text: >
              Neither yet: A is precisely measured and unprofitable; B is
              undecided.
            correct: true
            feedback: >
              A's edge is real and too small to pay for itself. B's estimate
              would clear costs many times over, but its standard error is as
              large as the edge.
          - text: >
              B: its edge is thirty times A's.
            feedback: >
              Its estimate is, but at $z = 1.5$ the data cannot rule out zero,
              or even a loss. B deserves more data, not capital.
        feedback: >
          The z-statistic ranked them backwards from what matters. One signal
          is certain and useless; the other is promising and unproven.
      - ask: >
          What is the upper end of A's $95\%$ interval, in basis points?
        expects: "0.139"
        tolerance: 0.001
        feedback: >
          $0.1 + 1.96 \times 0.02 \approx 0.139$. Even the most optimistic
          edge the data allows is about a third of the $0.4$ cost.
      - reflect: >
          A's z is more than three times B's. What does a z-statistic
          actually measure, and what question about A did it never answer?
        answer: >
          It measures how many standard errors the estimate sits from zero —
          how sure you can be that the effect is not exactly zero. With four
          million trades the standard error is tiny, so any nonzero edge,
          however small, is significant. Whether the edge is large enough to
          pay for its costs is a question about its size, which the interval
          answers and the z does not.
      - teach: >
          Significance says an effect is distinguishable from zero, not that
          it is worth trading. Large $n$ makes trivial effects significant;
          small $n$ hides real ones. Read the interval, not the star: what
          turns an effect into money is its size against costs, capacity and
          turnover.

      - part: What would settle B
        ask: >
          B's standard error is $2$ from $100$ trades. How many trades would
          bring it down to $0.5$?
        expects: "1600"
        hint: >
          The standard error falls like $1/\sqrt{n}$.
        feedback: >
          A quarter of the standard error needs $4^{2} = 16$ times the trades:
          $1600$. If the $3$ basis point estimate held, its $95\%$ interval
          would be about $[2.0, 4.0]$, clear of costs.
      - ask: >
          After $1600$ trades B's estimate settles at $0.6$ basis points with
          standard error $0.5$. What is the honest summary?
        choices:
          - text: >
              Fund it: the estimate is positive and costs are $0.4$.
            feedback: >
              The $95\%$ interval is about $[-0.38, 1.58]$: it includes zero
              and every value below costs. Positive is not profitable.
          - text: >
              Kill it: it is not significant.
            feedback: >
              The interval still reaches $1.58$, four times costs. Not
              significant is not the same as no edge.
          - text: >
              Still undecided: the interval spans losses and real profits,
              so the data cannot yet tell.
            correct: true
            feedback: >
              The estimate shrank, as early estimates that look large often
              do, and the interval still straddles both answers.
        feedback: >
          The verdict comes from where the interval sits against zero and
          against costs — two different lines.

      - part: Size, capacity, turnover
        ask: >
          Signal C earns $5$ basis points per trade but can trade only $20$
          times a year. Signal D earns $1$ basis point and can trade $10{,}000$
          times a year. Both edges are precisely measured and costs are $0.4$.
          Which earns more per year?
        choices:
          - text: >
              C: the larger edge per trade.
            feedback: >
              $20 \times (5 - 0.4) = 92$ basis points of net edge a year,
              against $10{,}000 \times (1 - 0.4) = 6000$ for D.
          - text: >
              D, by a factor of about sixty-five.
            correct: true
            feedback: >
              $6000$ against $92$. The edge per trade is one input; how often
              you can apply it is another.
          - text: >
              They are equal, since both are significant.
            feedback: >
              Significance is the same yes for both and says nothing about
              money. Net edge times turnover does.
        feedback: >
          What pays is net edge times turnover, within capacity. A t-statistic
          measures none of the three.
      - teach: >
          Said to a portfolio manager: "A is real and loses $0.3$ basis points
          a trade after costs; B, at $100$ trades, is unproven — its interval
          runs from a loss to over fifteen times costs, so it needs data, not
          capital." The
          estimate and interval first, the star last.
