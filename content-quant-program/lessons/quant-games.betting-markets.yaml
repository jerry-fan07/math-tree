unit: quant-games.betting-markets
opening: >
  Odds are prices, and this unit teaches you to read them the way a trader
  reads a quote sheet: convert any format to a common currency, flip it into
  the market's implied probability, and spot the standing margin — the
  overround — baked into every full set of prices a bookmaker posts. From
  there the unit turns operational: stripping that margin out to recover fair
  probabilities, weighing your own view against a price to find genuine edge,
  locking in a riskless profit across two mispriced books or on a bet you
  already hold, and reading what a moving line actually says about who is
  betting and why.
lessons:
  - node: quant-games.betting-markets.odds-formats
    hook: >
      A live market or an interviewer will hand you whichever format is on
      screen — American on a US book, fractional on a UK racing board,
      decimal everywhere else — and expect you to see the same price under
      all three without reaching for a converter.
    explanation: >
      Decimal odds are already the easy case: $d$ is the total amount
      returned per unit staked, so its implied probability is simply $1/d$.
      Fractional odds report something narrower — profit only, not total
      return — as $b/a$ per unit staked, so converting to decimal means
      adding the stake back: $d = b/a + 1$.

      American odds anchor to a stake of $100$ and split into two regimes by
      sign. Positive odds $A$ report the profit on a $100$ stake directly, so
      $d = 1 + A/100$. Negative odds $A$ report how much you must risk to
      profit $100$, so $d = 1 + 100/|A|$ — the risk sits in the denominator
      rather than the numerator, which is why the formula inverts instead of
      just flipping a sign. The two regimes meet at even money: $+100$ and
      $-100$ both mean decimal $2.00$, and nothing sits between them —
      American odds never read $+0$ or $-50$.

      Convert through decimal as the common currency rather than memorizing a
      direct fractional-to-American cross-formula. Once a price sits in
      decimal form, implied probability, edge, and every later calculation in
      this unit apply the same way regardless of which format it started in.
    worked: >
      Fractional odds $5/2$ convert to decimal as $d = 5/2 + 1 = 3.5$. Since
      $d \ge 2$, that's the positive-American regime: $A = 100(d-1) =
      100(2.5) = 250$, so $5/2$ is $+250$. Now the other direction: a
      short-priced favorite at decimal $1.40$ has $d < 2$, so it's negative
      American: $A = -100/(d-1) = -100/0.4 = -250$ — stake $250$ to profit
      $100$.
    interview: >
      Expect a price fired at you cold in whichever format the interviewer
      prefers, with the ask being instant, correct conversion — the right
      branch picked without hesitation, not just the formula recited. A
      common follow-up is the break-even stake implied by a negative-odds
      favorite, testing the $100/|A|$ piece specifically.
    pitfalls: >
      Applying the positive-odds formula to a negative number, or the reverse,
      is the single most common slip — check the sign before picking a
      branch. Fractional odds are profit, not total return; plugging $b/a$
      straight into $p = 1/d$ without adding the stake back understates the
      price. And there is no American quote between $-100$ and $+100$: the
      two regimes touch only at even money.
    recap: >
      Decimal is the common currency — fractional adds one stake back and
      American branches by sign around the $100$ anchor, but every format
      converts through $d$ into the same price.
    steps:
      - teach: >
          Decimal, fractional, and American are three labels for the same
          payout multiple. A live market or an interviewer hands you
          whichever one is on screen, and you need to read it instantly
          without reaching for a converter.
      - teach: >
          Decimal odds $d$ already are the total return per unit staked.
          Fractional odds $b/a$ report profit only, so converting to
          decimal means adding the stake back: $d = b/a + 1$.
      - ask: >
          Fractional odds of $9/4$ are quoted on a horse. What is that
          price in decimal odds?
        expects: "3.25"
        hint: >
          Add the stake back onto the profit ratio: $d = b/a + 1$.
        feedback: >
          $d = 9/4 + 1 = 3.25$ — fractional odds are profit only, so the
          stake you get back has to be added on separately.
      - teach: >
          American odds anchor to a stake of $100$ and split by sign:
          positive $A$ gives $d = 1 + A/100$, negative $A$ gives
          $d = 1 + 100/|A|$. The two regimes meet only at even money,
          $+100$ and $-100$ both equal to decimal $2.00$.
      - ask: >
          A price is quoted as American $-140$. Which formula correctly
          converts it to decimal odds?
        choices:
          - text: >
              $d = 1 + 140/100$
            feedback: >
              That is the positive-odds formula, applied to a negative
              number. Negative American odds report risk, not profit, on
              the $100$ anchor.
          - text: >
              $d = 1 + 100/140$
            correct: true
            feedback: >
              Negative American odds report how much you must risk to
              profit $100$, so the risk sits in the denominator:
              $d = 1 + 100/|A|$.
          - text: >
              $d = 140/100 + 1$
            feedback: >
              That's the fractional-odds conversion, adding a stake back
              onto a profit ratio. Nothing here is quoted as a fraction.
          - text: >
              $d = 100/140$
            feedback: >
              This is the risk-to-profit ratio alone, without adding the
              stake back — it drops the $1$ that turns a profit ratio into
              a total return.
        feedback: >
          Negative American odds invert instead of just flipping a sign:
          $d = 1 + 100/|A|$, since the risk, not the profit, sits on the
          $100$ anchor.
      - ask: >
          Using that formula, what decimal odds does American $-140$
          convert to?
        expects: "1.7143"
        tolerance: 0.0005
        hint: >
          Compute $100/140$ first, then add $1$.
        feedback: >
          $d = 1 + 100/140 \approx 1.7143$ — a short-priced favorite, since
          $d$ sits well under $2.00$.
      - teach: >
          Check the sign before picking a branch: applying the positive
          formula to a negative number, or the reverse, is the single most
          common slip. There is no American quote between $-100$ and
          $+100$ — the two regimes only touch at even money.
      - teach: >
          Convert through decimal as the common currency rather than
          memorizing a direct fractional-to-American cross-formula. Every
          later calculation in this unit — implied probability, edge,
          arbitrage — starts from a decimal price.

  - node: quant-games.betting-markets.implied-probability
    hook: >
      Every later calculation in this unit — overround, edge, arbitrage —
      starts by turning a quoted price back into a probability, so this
      one-line flip has to be reflexive.
    explanation: >
      Once a price is in decimal form, $p = 1/d$ falls straight out of what
      "break-even" means: staking $1$ at decimal odds $d$ returns $d$ with
      probability $p$ and $0$ otherwise, and the bet is fair exactly when
      $p \cdot d = 1$. That single formula is why converting to decimal first
      is worth the extra step — fractional and American odds each need their
      own inversion, but decimal only ever needs a reciprocal.

      Treat the output as a price, not a fact. A bookmaker's quote reflects
      what the bookmaker is willing to pay, shaped by its own risk exposure
      and margin, and a full market's worth of implied probabilities will
      typically sum to more than $100\%$ rather than land exactly on it. That
      gap is structural, not noise, and the next few nodes exist to name and
      remove it.

      For now, the discipline is just this: whenever a price is quoted, in
      any format, convert to decimal and take the reciprocal before doing
      anything else with it.
    worked: >
      American $+120$ converts to decimal as $d = 1 + 120/100 = 2.20$, so the
      implied probability is $p = 1/2.20 \approx 0.4545$, about $45.5\%$ —
      the win rate at which betting this side breaks even in the long run.
    interview: >
      "The market's offering you this price, what's it implying" is asked as
      a reflex check before any harder question. A sharper follow-up — "is
      that the true probability?" — is listening for the answer that it is
      only the market's price, not a claim about reality.
    pitfalls: >
      Inverting a fractional or American number directly, instead of
      converting to decimal first, is a common arithmetic slip. Reading an
      implied probability as the actual chance of the outcome, rather than as
      a price that may carry margin, sets up the overround mistake that
      follows.
    recap: >
      Convert to decimal, then invert: $p = 1/d$ is the market's break-even
      price, not a claim about the true probability.
    steps:
      - teach: >
          Every later calculation in this unit — overround, edge, arbitrage
          — starts by flipping a quoted price back into a probability, so
          this conversion has to be reflexive.
      - teach: >
          Once a price sits in decimal form, $p = 1/d$ falls straight out
          of what "break-even" means: staking $1$ returns $d$ with
          probability $p$ and $0$ otherwise, and the bet is fair exactly
          when $p \cdot d = 1$.
      - ask: >
          A price is quoted at decimal odds $4.00$. What probability does
          that imply?
        expects: "0.25"
        hint: >
          Take the reciprocal of the decimal price.
        feedback: >
          $p = 1/4.00 = 0.25$ — the win rate at which staking on this side
          breaks even in the long run.
      - teach: >
          Treat the output as a price, not a fact. A bookmaker's quote is
          shaped by its own risk exposure and margin, and a full market's
          implied probabilities typically sum to more than $100\%$ rather
          than land exactly on it.
      - ask: >
          American odds of $+125$ are quoted. What probability does that
          price imply?
        expects: "0.4444"
        tolerance: 0.0005
        hint: >
          Convert to decimal first — $d = 1 + A/100$ — then take the
          reciprocal.
        feedback: >
          $d = 1 + 125/100 = 2.25$, so $p = 1/2.25 \approx 0.4444$.
          Converting to decimal first means only one inversion is ever
          needed, whatever format the price started in.
      - ask: >
          A bookmaker quotes decimal odds $1.80$ on a horse, giving implied
          probability $1/1.80 \approx 55.6\%$. What does that $55.6\%$
          actually represent?
        choices:
          - text: >
              The true probability the horse wins the race
            feedback: >
              It isn't a claim about reality — it's the price the
              bookmaker is willing to pay, shaped by its own risk exposure
              and margin.
          - text: >
              The price at which betting this side breaks even in the long
              run
            correct: true
            feedback: >
              Exactly: $p \cdot d = 1$ is the break-even condition, and
              $55.6\%$ is the $p$ that makes it hold at this $d$.
          - text: >
              The probability once the bookmaker's margin has been removed
            feedback: >
              That's a further step applied on top of the raw implied
              probability, not what the raw number itself is.
        feedback: >
          Implied probability is the market's break-even price, not a
          claim about the true chance — and, on a full market, it still
          carries whatever margin the book has priced in.
      - teach: >
          The discipline: whenever a price is quoted, in any format,
          convert to decimal and take the reciprocal before doing anything
          else with it.

  - node: quant-games.betting-markets.overround
    hook: >
      "What's the vig on this line" is a standard interview ask, and it is
      nothing more than summing implied probabilities and subtracting one.
    explanation: >
      A single price only tells you the break-even rate for one side. The
      overround is a property of the whole market: convert every outcome's
      price to an implied probability and add them up. On a theoretical,
      zero-margin book, those probabilities would sum to exactly $100\%$,
      mirroring the true chances. A real book prices every side a little
      conservatively, so the sum comes in above $100\%$, and that excess is
      margin extracted regardless of which outcome actually happens.

      The overround is not charged separately or visible as a fee — it's
      baked directly into each individual price, which is exactly why you
      have to sum across the whole market to see it at all. A single quote in
      isolation looks perfectly ordinary; the tell only shows up once every
      side is accounted for.

      Nothing requires the margin to be split evenly across outcomes — two
      sides of the same market can carry very different amounts of it, and
      the total is still what matters for measuring the house's edge.
    worked: >
      A two-way market quotes decimal $1.80$ on one side and $2.05$ on the
      other. Implied probabilities are $1/1.80 \approx 0.5556$ and
      $1/2.05 \approx 0.4878$, summing to about $1.0434$ — an overround of
      roughly $4.3\%$, even though the two prices aren't symmetric.
    interview: >
      Given a full set of prices, sum the implied probabilities and subtract
      $1$ — the interviewer is watching for that reflex, done quickly and
      without needing every side to look alike.
    pitfalls: >
      Leaving out a leg of the market — forgetting the draw in a three-way
      soccer line, say — understates the true overround by omitting real
      margin. Treating the overround as a separate fee rather than something
      embedded in the prices themselves misses where to actually look for it.
    recap: >
      Sum every side's implied probability; the amount over $100\%$ is the
      overround, the bookmaker's structural edge before any outcome is
      decided.
    steps:
      - teach: >
          "What's the vig on this line" is a standard ask, and it reduces
          to one move: sum every outcome's implied probability and
          subtract $1$.
      - teach: >
          Convert every outcome's price to an implied probability and add
          them up. A theoretical zero-margin book sums to exactly $100\%$;
          a real book prices every side conservatively, so the sum comes in
          above it, and that excess is margin extracted regardless of
          outcome.
      - ask: >
          A two-way market quotes decimal $1.95$ on both sides. What is the
          overround?
        expects: "0.0256"
        tolerance: 0.0005
        hint: >
          Sum the two implied probabilities, $1/1.95$ twice, then subtract
          $1$.
        feedback: >
          $1/1.95 \approx 0.5128$ on each side, summing to about $1.0256$
          — an overround of about $2.56\%$.
      - teach: >
          The overround isn't a separate, visible fee — it's baked directly
          into each individual price. Nothing requires it to be split
          evenly across outcomes either; two sides of the same market can
          carry very different amounts of it.
      - ask: >
          A three-way market quotes decimal $2.05$, $3.30$, $3.75$ on its
          three outcomes. What is the overround?
        expects: "0.0575"
        tolerance: 0.001
        hint: >
          Sum all three implied probabilities before subtracting $1$ —
          skipping a leg understates the total.
        feedback: >
          $1/2.05 + 1/3.30 + 1/3.75 \approx 0.4878 + 0.3030 + 0.2667 =
          1.0575$, an overround of about $5.75\%$.
      - teach: >
          Since the margin only shows up once every side is accounted for,
          summing anything less than the full market silently understates
          it.
      - ask: >
          A three-way soccer line prices home, draw, and away. You compute
          the overround using only the home and away prices, leaving out
          the draw. What happens to your result?
        choices:
          - text: >
              It correctly reports the market's total margin
            feedback: >
              A real leg's margin has been left out entirely, so the total
              can't be correct.
          - text: >
              It understates the true overround, since a real leg's margin
              is missing
            correct: true
            feedback: >
              Right — the draw's price carries margin too, and omitting it
              understates the sum.
          - text: >
              It's unaffected, since the draw is priced separately from the
              two-way odds
            feedback: >
              The draw isn't a separate market — it's one of the three
              mutually exclusive outcomes this market prices.
          - text: >
              Overround only applies to two-way markets, so this is fine
            feedback: >
              Overround is a property of any full market's prices, however
              many outcomes it has.
        feedback: >
          Sum every side actually quoted. Forgetting a leg — the draw in a
          three-way soccer line is the classic case — always understates
          the real margin.
      - teach: >
          Sum every side's implied probability; the amount over $100\%$ is
          the overround, extracted regardless of which outcome happens.

  - node: quant-games.betting-markets.devigging
    hook: >
      To compare your own view against a market honestly, you need its price
      with the margin stripped out — this is the standard first move whenever
      an edge calculation needs a "true" probability.
    explanation: >
      The mechanics are one line: sum the implied probabilities to get
      $S > 1$, then divide each one by $S$. This works because dividing every
      term of a sum by that same sum's total forces the new terms to add to
      exactly $1$ — $\sum_i (p_i / S) = S / S = 1$ — so the results are valid
      probabilities by construction, not just numbers that happen to look
      like some.

      The method is proportional: it assumes the margin sits evenly across
      outcomes in probability space, scaling every side down by the same
      factor $1/S$. That's a simplification — a real book's margin can lean
      more heavily on one side than another — but it needs no information
      beyond the quoted prices themselves, which makes it the standard
      baseline whenever a "fair" probability is needed on the spot.

      The reason it matters: comparing your own probability estimate against
      the raw implied probability silently hands the bookmaker's margin to
      you as if it were part of your edge. De-vigging first isolates what the
      market actually believes from what it charges to take the bet.
    worked: >
      A three-way market quotes decimal $2.20$, $3.40$, $3.60$ on the three
      outcomes. Implied probabilities are $0.4545$, $0.2941$, $0.2778$,
      summing to $S \approx 1.0264$. Dividing each by $S$ gives fair
      probabilities of about $44.3\%$, $28.7\%$, and $27.1\%$ — which add
      back to $100\%$.
    interview: >
      "Strip the vig out of this line" wants exactly the normalize-by-sum
      move applied live, across every outcome quoted — not a more elaborate
      model, unless one is explicitly asked for.
    pitfalls: >
      Normalizing only some of the market's outcomes — missing a leg —
      understates $S$ and distorts every resulting probability. Treating the
      proportional result as the single objectively correct fair price,
      rather than a stated simplifying assumption about how margin is
      spread, overstates how much the method actually proves.
    recap: >
      Divide every implied probability by their sum; the results are
      nonnegative, sum to exactly $100\%$, and are the standard fair-price
      estimate once the margin is removed.
    steps:
      - teach: >
          To compare your own view against a market honestly, you need its
          price with the margin stripped out — the standard first move
          whenever an edge calculation needs a "true" probability.
      - teach: >
          Sum the implied probabilities to get $S > 1$, then divide each
          one by $S$. Dividing every term of a sum by that sum's own total
          forces the new terms to add to exactly $1$:
          $\sum_i (p_i/S) = S/S = 1$.
      - ask: >
          A two-way market quotes decimal $1.90$ and $2.00$. What is the
          de-vigged fair probability of the $1.90$ side?
        expects: "0.5128"
        tolerance: 0.0005
        hint: >
          Sum $1/1.90$ and $1/2.00$ to get $S$, then divide $1/1.90$ by
          $S$.
        feedback: >
          $1/1.90 \approx 0.5263$, $1/2.00 = 0.5$, so $S \approx 1.0263$,
          and $0.5263/1.0263 \approx 0.5128$.
      - teach: >
          The method is proportional: it assumes the margin sits evenly
          across outcomes, scaling every side down by the same factor
          $1/S$. That's a simplification, but it needs no information
          beyond the quoted prices themselves.
      - ask: >
          The same two-way market — decimal $1.90$ and $2.00$ — is
          de-vigged. What is the fair probability of the $2.00$ side?
        expects: "0.4872"
        tolerance: 0.0005
        hint: >
          Divide $1/2.00$ by the same $S \approx 1.0263$ used for the other
          side.
        feedback: >
          $0.5/1.0263 \approx 0.4872$ — and the two fair probabilities,
          $0.5128$ and $0.4872$, sum back to exactly $1$.
      - ask: >
          You're comparing your own probability estimate against a
          market's price. Why compare it to the de-vigged fair probability
          rather than the raw implied probability?
        choices:
          - text: >
              Because the raw implied probability is always mathematically
              incorrect
            feedback: >
              The raw number isn't wrong — it's just a price that includes
              margin, not the market's belief on its own.
          - text: >
              Because comparing against the raw number silently credits the
              bookmaker's margin to you as if it were genuine edge
            correct: true
            feedback: >
              Right — part of the gap between your estimate and the raw
              price is just the cost of taking the bet at all.
          - text: >
              Because de-vigging changes the price you're actually paid at
            feedback: >
              De-vigging doesn't change the price on the board — it only
              produces a benchmark to compare your own estimate against.
        feedback: >
          De-vigging isolates what the market actually believes from what
          it charges to take the bet. Benchmarking against the raw implied
          number hands the bookmaker's margin to you as if it were part of
          your edge.
      - teach: >
          This is the standard baseline whenever a fair probability is
          needed on the spot — not because the margin is provably spread
          evenly, but because it needs nothing beyond the prices already on
          the board.
      - teach: >
          Divide every implied probability by their sum; the results are
          nonnegative, sum to exactly $100\%$, and are the standard
          fair-price estimate once the margin is removed.

  - node: quant-games.betting-markets.favorite-underdog-vig
    hook: >
      American moneylines are the single most common two-sided quote you'll
      be handed, and this is the full odds-to-implied-to-devigged pipeline
      run start to finish on one.
    explanation: >
      The favorite is conventionally quoted negative and the underdog
      positive precisely because negative American odds describe "risk more
      to win less" and positive odds describe "risk less to win more" — the
      sign is doing real work, not just a labeling convention, and mixing up
      which raw number belongs to which side flips every downstream number.

      The pipeline itself is just the previous three nodes chained: convert
      each side to decimal, invert to get implied probabilities, sum them to
      find the overround, then divide by that sum to recover fair
      probabilities. Nothing new happens here mechanically — the value of
      running it end to end on a moneyline is building the reflex to do all
      four steps without dropping one, since a real interview question rarely
      stops after just the first.

      The same four-step chain applies unchanged to three-way lines, totals,
      and prop bets — anywhere a book prices a full set of mutually exclusive
      outcomes.
    worked: >
      A moneyline quotes a favorite at American $-150$ and an underdog at
      $+130$. Decimal: $-150$ gives $d = 1 + 100/150 \approx 1.667$, implied
      $p \approx 0.600$; $+130$ gives $d = 1 + 130/100 = 2.30$, implied
      $p \approx 0.4348$. The sum is about $1.0348$, a $3.5\%$ overround.
      Dividing by $1.0348$: the favorite's fair probability is about
      $58.0\%$ and the underdog's about $42.0\%$.
    interview: >
      Handed a raw moneyline, the expectation is the full pipeline stated out
      loud — convert, invert, sum, divide — ending in an actual fair
      probability for each side, not just the overround percentage.
    pitfalls: >
      Rounding aggressively at an intermediate step compounds by the final
      division — carry a few extra digits of precision through decimal and
      implied probability before dividing by $S$. Swapping which raw American
      number is the favorite when both are given unlabeled is an easy
      sign-reading error to make under time pressure.
    recap: >
      Convert both sides to decimal, invert, sum for the overround, divide by
      that sum — the standard four-step read of any moneyline.
    steps:
      - teach: >
          The favorite is quoted negative and the underdog positive because
          the sign is doing real work: negative American odds mean "risk
          more to win less," positive odds mean "risk less to win more."
      - teach: >
          The pipeline is the previous three nodes chained: convert each
          side to decimal, invert to get implied probabilities, sum them
          for the overround, then divide by that sum for fair
          probabilities. Nothing new happens mechanically — the value is
          running all four steps without dropping one.
      - ask: >
          A moneyline shows two unlabeled American numbers, $-160$ and
          $+140$. Which one is the favorite?
        choices:
          - text: >
              $-160$, since negative odds mean risking more to win less —
              what a favorite offers
            correct: true
            feedback: >
              Right — the sign marks the favorite directly, not just the
              size of the number.
          - text: >
              $+140$, since it's the larger of the two numbers
            feedback: >
              Size isn't the test; the sign is. A larger positive number
              still means "risk less to win more," the underdog's profile.
          - text: >
              Neither — you'd need to see the actual payout table to tell
            feedback: >
              The sign alone determines it: negative American odds always
              mark the favorite.
          - text: >
              Whichever number is listed first
            feedback: >
              Listing order carries no information; only the sign does.
        feedback: >
          Negative American odds always mark the favorite — it's a
          direction, not a size, and mixing up which number belongs to
          which side flips every downstream number.
      - ask: >
          Convert the favorite's American $-160$ to decimal odds.
        expects: "1.625"
        hint: >
          $d = 1 + 100/|A|$ for negative American odds.
        feedback: >
          $d = 1 + 100/160 = 1.625$.
      - teach: >
          The underdog's price converts the same way: American $+140$ is
          $d = 1 + 140/100 = 2.40$. Both sides now sit in decimal, ready
          for the next two pipeline steps.
      - ask: >
          Using decimal odds $1.625$ and $2.40$, what is the overround on
          this moneyline?
        expects: "0.0321"
        tolerance: 0.001
        hint: >
          Invert both decimal prices and add, then subtract $1$.
        feedback: >
          $1/1.625 \approx 0.6154$ and $1/2.40 \approx 0.4167$ sum to about
          $1.0321$, an overround of about $3.21\%$.
      - teach: >
          Rounding aggressively at an intermediate step compounds by the
          final division — carry a few extra digits through decimal and
          implied probability before dividing by $S$.
      - ask: >
          A moneyline's favorite carries implied probability $0.6154$, and
          the market's implied probabilities sum to $S \approx 1.0321$.
          What is the favorite's de-vigged fair probability?
        expects: "0.5963"
        tolerance: 0.001
        hint: >
          Divide the favorite's implied probability by $S$.
        feedback: >
          $0.6154/1.0321 \approx 0.5963$ — about $59.6\%$, the market's
          best estimate for the favorite once the margin is removed.
      - teach: >
          The same four-step chain applies unchanged to three-way lines,
          totals, and prop bets — anywhere a book prices a full set of
          mutually exclusive outcomes.

  - node: quant-games.betting-markets.bet-ev
    hook: >
      "Would you actually bet it" is the question every de-vigging exercise
      is building toward, and this is the one number that answers it.
    explanation: >
      Treat a bet as a payoff you already know how to value: staking $1$ at
      decimal odds $d$ returns $d - 1$ profit with probability $p$ (your own
      estimate) and loses the stake with probability $1-p$. Its expected
      profit per unit is $p(d-1) + (1-p)(-1) = pd - 1$ — the same expectation
      machinery applied to a two-outcome payoff, just written out.

      A positive result only requires your $p$ to differ from what the price
      implies; it says nothing about how confident you should be in $p$ or
      how much variance the bet carries, so a small positive edge on a
      long-shot price can still be a poor bet once size and uncertainty in
      your own estimate are considered.

      What you compare $p$ against matters. Use the de-vigged fair
      probability from the market, not the raw implied one — comparing
      against the raw number silently credits the bookmaker's margin to you
      as though it were genuine edge, when part of the gap is just the price
      of taking the bet at all.
    worked: >
      You estimate a $35\%$ chance for an outcome priced at decimal $3.20$
      (implied about $31.25\%$). Edge is
      $\text{EV} = 0.35 \times 3.20 - 1 = 0.12$, a $12\%$ expected profit per
      unit staked — computed from the actual price paid, $3.20$.
    interview: >
      "You think it's a $35\%$ chance, the market's offering this price, is
      it a good bet" wants the formula applied on the spot, ending in a
      signed number, not a qualitative yes or no.
    pitfalls: >
      Using the raw implied probability as the bar to clear, instead of the
      de-vigged fair probability, overstates how much genuine edge exists.
      Treating any positive EV as equally worth taking ignores that the same
      formula says nothing about variance or how reliable $p$ itself is.
    recap: >
      Edge is $p \cdot d - 1$ — your probability against the price you're
      actually paid at, benchmarked against the de-vigged fair price, not the
      raw implied one.
    steps:
      - teach: >
          "Would you actually bet it" is the question every de-vigging
          exercise builds toward — this is the one number that answers it.
      - teach: >
          Staking $1$ at decimal odds $d$ returns $d - 1$ profit with
          probability $p$ (your own estimate) and loses the stake with
          probability $1-p$. Expected profit per unit is
          $\text{EV} = p(d-1) + (1-p)(-1) = pd - 1$.
      - ask: >
          You estimate a $45\%$ chance for an outcome priced at decimal
          odds $2.50$. What is the expected value per unit staked?
        expects: "0.125"
        hint: >
          Compute $p \cdot d - 1$ directly.
        feedback: >
          $\text{EV} = 0.45 \times 2.50 - 1 = 0.125$, a $12.5\%$ expected
          profit per unit staked.
      - teach: >
          A positive result only requires your $p$ to differ from what the
          price implies — it says nothing about how confident you should
          be in $p$, so a small edge on a long-shot price can still be a
          poor bet at size.
      - ask: >
          You estimate a $20\%$ chance for an outcome priced at decimal
          odds $4.00$. What is the expected value per unit staked?
        expects: "-0.2"
        hint: >
          The same formula, $pd - 1$, applies whether the result is
          positive or negative.
        feedback: >
          $\text{EV} = 0.20 \times 4.00 - 1 = -0.2$ — a $20\%$ expected
          loss per unit staked, since your own estimate falls well short of
          the price's $25\%$ break-even.
      - teach: >
          What you compare $p$ against matters: use the de-vigged fair
          probability, not the raw implied one, or the bookmaker's margin
          looks like part of your edge.
      - ask: >
          A bet shows $\text{EV} = 0.02$ per unit staked, computed
          correctly against the de-vigged fair probability. What does this
          number guarantee?
        choices:
          - text: >
              That this specific bet is worth placing at any size
            feedback: >
              The formula is silent on variance and on how reliable your
              own $p$ is — neither is captured by the sign of EV alone.
          - text: >
              That your probability estimate differs from the market's
              enough to clear it in expectation, nothing about variance or
              confidence in that estimate
            correct: true
            feedback: >
              Right — a positive edge is a statement about expectation
              only, not about how much to trust it or how much to risk on
              it.
          - text: >
              That the bookmaker has definitely mispriced this outcome
            feedback: >
              EV is computed from your own probability estimate, not proof
              that the market itself is wrong.
        feedback: >
          Positive EV only requires $p$ to differ from the price paid — it
          carries no information about variance or about how much
          confidence to place in $p$ itself.
      - teach: >
          Edge is $p \cdot d - 1$ — your probability against the price
          you're actually paid at, benchmarked against the de-vigged fair
          price.

  - node: quant-games.betting-markets.ev-bet-worked
    hook: >
      Turning the EV formula into an actual verdict on one specific price is
      the version an interviewer wants said out loud within seconds, number
      included.
    explanation: >
      The decimal odds that go into $\text{EV} = pd - 1$ are always the raw
      price you're actually paid at — never a de-vigged or adjusted number.
      De-vigging answers a different question (what does the market really
      believe, stripped of margin) used only as a benchmark to sanity-check
      that your $p$ genuinely differs from consensus; the payout itself is
      fixed by whatever price is on the board.

      Once the number is computed, the size of it is the point, not just its
      sign. A tiny positive edge and a large one both clear zero, but an
      interviewer asking for "the number" wants the actual percentage stated,
      since that magnitude is what a real sizing decision would be built on.
    worked: >
      You estimate a $30\%$ chance for an outcome priced at decimal $4.00$
      (implied $25\%$). $\text{EV} = 0.30 \times 4.00 - 1 = 0.20$, so the
      answer is a $20\%$ expected profit per unit staked.
    interview: >
      Given a specific probability estimate and a specific price, the ask is
      the exact percentage, computed live — stopping at "yes, it's positive"
      under-answers a question that asked for a number.
    pitfalls: >
      Substituting the de-vigged fair probability in place of the actual
      decimal odds in the formula is a category error — $d$ always comes from
      the price actually offered. Reporting only the sign of the edge instead
      of its magnitude leaves the sizing-relevant information on the table.
    recap: >
      A $30\%$ true probability against $4.00$ decimal odds is a $20\%$ edge,
      computed straight from the price actually paid.
    steps:
      - teach: >
          Turning the EV formula into a verdict on one specific price is
          what an interviewer wants said out loud within seconds — number
          included, not just a sign.
      - teach: >
          The decimal odds in $\text{EV} = pd - 1$ are always the raw price
          you're actually paid at, never a de-vigged or adjusted number.
          De-vigging only supplies a benchmark to check that your $p$
          genuinely differs from consensus.
      - ask: >
          You estimate a $38\%$ chance for an outcome priced at decimal
          odds $2.80$. What is the exact expected value per unit staked?
        expects: "0.064"
        hint: >
          Plug the raw decimal price straight into $pd - 1$.
        feedback: >
          $\text{EV} = 0.38 \times 2.80 - 1 = 0.064$, a $6.4\%$ expected
          profit per unit staked.
      - teach: >
          The magnitude is the point, not just the sign. A tiny edge and a
          large one both clear zero, but a real sizing decision is built on
          the actual percentage, not on "yes, it's positive."
      - ask: >
          You estimate a $62\%$ chance for an outcome priced at decimal
          odds $1.80$. What is the exact expected value per unit staked?
        expects: "0.116"
        hint: >
          Plug the raw decimal price straight into $pd - 1$.
        feedback: >
          $\text{EV} = 0.62 \times 1.80 - 1 = 0.116$, an $11.6\%$ expected
          profit per unit staked.
      - ask: >
          An outcome is priced at decimal odds $2.50$. Its de-vigged fair
          probability is $38\%$, but you estimate $42\%$. Which decimal
          odds value belongs in $\text{EV} = pd - 1$?
        choices:
          - text: >
              $2.50$, the actual price on the board
            correct: true
            feedback: >
              Right — $d$ always comes from what's actually offered,
              regardless of what the fair probability would imply.
          - text: >
              The decimal odds implied by the $38\%$ fair probability,
              $1/0.38 \approx 2.63$
            feedback: >
              That substitutes a de-vigged benchmark for the actual price
              paid — a category error, since de-vigging only checks that
              $p$ differs from consensus.
          - text: >
              The average of $2.50$ and $2.63$
            feedback: >
              There's no averaging step in this formula — the payout is
              fixed by whatever price is actually on the board.
        feedback: >
          $d$ is always the raw price you're actually paid at; de-vigging
          supplies a separate benchmark, not a substitute for $d$ itself.
      - teach: >
          A $38\%$ true probability against $2.80$ decimal odds is a
          $6.4\%$ edge, computed straight from the price actually paid —
          the number to say out loud, not just its sign.

  - node: quant-games.betting-markets.dutch-book
    hook: >
      Two books disagreeing enough about the same event is a concrete,
      book-against-book arbitrage — the standard test of whether you can turn
      a probability calculation into an actual trade.
    explanation: >
      Two bookmakers pricing complementary outcomes of the same event are, in
      effect, one combined market. Sum their implied probabilities: if the
      total $S$ comes in below $1$, the two books together are underpricing
      the event, the mirror image of overround, and a riskless profit is
      available regardless of which side wins.

      Sizing each stake proportional to its own implied probability, $T \cdot
      p_i / S$, is what makes the payout equal across outcomes: staking
      $T p_i / S$ at decimal odds $d_i = 1/p_i$ returns $T p_i d_i / S =
      T/S$, since $p_i d_i = 1$ by definition — the same payout, $T/S$, no
      matter which outcome resolves. Total stakes committed sum to exactly
      $T$, since the $p_i/S$ terms are themselves probabilities that add to
      $1$, so the whole bankroll is deployed and the profit is
      $T/S - T = T(1-S)/S$, strictly positive exactly when $S < 1$.

      The mental model: you're not predicting an outcome at all, only
      converting a gap between two books' prices into cash by matching the
      stake to each book's own implied probability.
    worked: >
      Book A offers decimal $1.95$ on outcome X ($p_X \approx 0.5128$); book
      B offers decimal $2.30$ on outcome Y ($p_Y \approx 0.4348$), so
      $S \approx 0.9476$. With $T = 500$: stake about $270.6$ on X and
      $229.4$ on Y; either outcome pays about $527.6$, a guaranteed profit of
      about $27.6$ (roughly $5.5\%$ of bankroll).
    interview: >
      Handed two books' lines on the same event, the ask is to check $S < 1$
      first, then produce the proportional stake split live — the
      interviewer is listening for the sizing formula, not just recognizing
      that an arbitrage exists.
    pitfalls: >
      Splitting the bankroll evenly instead of proportionally to each
      implied probability fails to equalize the payout, leaving one outcome
      more profitable than the other. This only works when the two books'
      outcomes are genuinely complementary and mutually exclusive across the
      same event — near-matching but not identical markets don't actually
      cover each other.
    recap: >
      When two books' implied probabilities sum below $100\%$, sizing stakes
      proportional to each implied probability guarantees the identical
      payout, $T/S$, whichever side wins.
    steps:
      - teach: >
          Two books disagreeing enough about the same event is a concrete,
          book-against-book arbitrage — the standard test of turning a
          probability calculation into an actual trade.
      - teach: >
          Two bookmakers pricing complementary outcomes of the same event
          are, in effect, one combined market. If the sum of their implied
          probabilities $S$ comes in below $1$, the two books together are
          underpricing the event — the mirror image of overround.
      - ask: >
          Book A offers decimal $2.05$ on outcome X; book B offers decimal
          $2.15$ on outcome Y. What is $S$, the sum of the two implied
          probabilities?
        expects: "0.9529"
        tolerance: 0.0005
        hint: >
          Invert both decimal prices and add them.
        feedback: >
          $1/2.05 \approx 0.4878$ and $1/2.15 \approx 0.4651$ sum to about
          $0.9529$ — below $1$, so a riskless profit is available.
      - teach: >
          Sizing each stake proportional to its own implied probability,
          $T \cdot p_i/S$, is what equalizes the payout: since
          $p_i d_i = 1$ by definition, staking $T p_i/S$ at odds $d_i$
          returns $T/S$ no matter which outcome resolves.
      - ask: >
          Book A offers decimal $2.05$ on outcome X; book B offers decimal
          $2.15$ on outcome Y, with $S \approx 0.9529$. With a total
          bankroll of $800$ split proportionally across both, what is the
          guaranteed payout, whichever outcome wins?
        expects: "839.52"
        tolerance: 0.05
        hint: >
          The guaranteed payout is $T/S$.
        feedback: >
          $800/0.9529 \approx 839.52$ — a guaranteed profit of about
          $39.52$, since every unit of the bankroll is deployed and pays
          the same amount regardless of outcome.
      - ask: >
          You've found two books whose implied probabilities sum below $1$
          on complementary outcomes of the same event. How should you split
          your bankroll to guarantee the identical payout whichever side
          wins?
        choices:
          - text: >
              Evenly, half the bankroll on each side
            feedback: >
              An even split doesn't equalize the payout when the two
              decimal odds differ — one side pays more than the other.
          - text: >
              Proportional to each side's own implied probability
            correct: true
            feedback: >
              Right — staking $T p_i/S$ on each side, where $p_i = 1/d_i$,
              forces every outcome to pay the same amount, $T/S$.
          - text: >
              All of it on the side with the higher decimal odds
            feedback: >
              That maximizes the payout if that one side wins, but leaves
              you with nothing if the other side does — no longer riskless.
        feedback: >
          Sizing $T p_i/S$ on each outcome is what forces the payout to
          land on the same number, $T/S$, whichever side actually wins.
      - teach: >
          This only works when the two outcomes are genuinely complementary
          and mutually exclusive across the same event — near-matching but
          not identical markets don't actually cover each other.
      - teach: >
          When two books' implied probabilities sum below $100\%$, sizing
          stakes proportional to each implied probability guarantees the
          identical payout whichever side wins.

  - node: quant-games.betting-markets.hedging-bets
    hook: >
      Once a bet is already placed and the price has since moved, this is the
      mechanical move that turns a still-live position into a fixed,
      guaranteed number before the outcome is known.
    explanation: >
      This is a different situation from pricing a fresh bet: you already
      hold a stake $S_0$ at decimal odds $O_0$, committed to a payout of
      $S_0 O_0$ if it wins and $0$ if it loses. A later price $O_1$ on the
      opposite outcome lets you buy your way out of that uncertainty. Setting
      the new stake $H$ so both outcomes pay identically —
      $S_0 O_0 = H O_1$ — gives $H = S_0 O_0 / O_1$, solved directly from the
      one equation that has to hold.

      Once $H$ is placed, your profit is fixed at $S_0 O_0 - (S_0 + H)$
      regardless of which side wins — hedging converts an uncertain payoff
      into a certain one, but nothing about the arithmetic guarantees that
      certain number is positive. Whether it is depends entirely on how
      favorable $O_1$ has become relative to $O_0$ by the time you hedge.

      Read it as buying insurance on a position you already hold, priced at
      whatever the opposing side currently offers — not as betting against
      yourself, since the two stakes were placed at two different prices, at
      two different times, on two mutually exclusive results of the same
      event.
    worked: >
      $200$ staked at decimal $2.20$ (payout $440$ if it wins). The opposing
      outcome later trades at decimal $2.05$, so
      $H = 200 \times 2.20 / 2.05 \approx 214.63$. Either way the payout is
      $440$, against total stakes of about $414.63$, locking a guaranteed
      profit of about $25.37$ (roughly $6.1\%$ of the total committed).
    interview: >
      "You've got a live bet and the price has since moved — do you hedge,
      and for how much" wants the $H$ formula solved live, plus a comment on
      whether the resulting locked number is actually worth taking.
    pitfalls: >
      Computing $H$ from the hedge-side odds alone, without keeping the
      original payout $S_0 O_0$ fixed as the target, solves the wrong
      equation. Assuming a hedge is automatically profitable is wrong too — if
      $O_1$ hasn't moved favorably enough, the locked-in result can be a
      smaller guaranteed loss rather than a profit, sometimes still worth
      taking purely to remove variance.
    recap: >
      Stake $H = S_0 O_0 / O_1$ on the opposite outcome at today's price to
      equalize the payout, turning an open bet into a fixed, known result.
    steps:
      - teach: >
          Once a bet is already placed and the price has since moved, this
          is the mechanical move that turns a still-live position into a
          fixed, guaranteed number before the outcome is known.
      - teach: >
          You hold a stake $S_0$ at decimal odds $O_0$, committed to a
          payout of $S_0 O_0$ if it wins. Setting a new stake $H$ on the
          opposite outcome so both sides pay identically —
          $S_0 O_0 = H O_1$ — gives $H = S_0 O_0 / O_1$.
      - ask: >
          $150$ is staked at decimal odds $2.50$. The opposing outcome is
          now available at decimal $1.75$. What hedge stake $H$ equalizes
          the payout?
        expects: "214.29"
        tolerance: 0.01
        hint: >
          $H = S_0 O_0 / O_1$.
        feedback: >
          $H = 150 \times 2.50 / 1.75 \approx 214.29$.
      - teach: >
          Once $H$ is placed, profit is fixed at $S_0 O_0 - (S_0 + H)$
          regardless of which side wins — but nothing about the arithmetic
          guarantees that number is positive. It depends entirely on how
          favorable $O_1$ has become since the original bet.
      - ask: >
          $150$ is staked at decimal odds $2.50$, hedged with $214.29$ on
          the opposing outcome at decimal $1.75$. What is the locked-in
          profit, whichever side wins?
        expects: "10.71"
        tolerance: 0.01
        hint: >
          Payout is $S_0 O_0$; total stakes are $S_0 + H$; profit is the
          difference.
        feedback: >
          Payout is $150 \times 2.50 = 375$, total stakes are
          $150 + 214.29 = 364.29$, so profit is $375 - 364.29 \approx
          10.71$.
      - teach: >
          Read it as buying insurance on a position you already hold,
          priced at whatever the opposing side currently offers — not as
          betting against yourself, since the two stakes sit at two
          different prices, at two different times.
      - ask: >
          $100$ is staked at decimal odds $2.50$ (payout $250$ if it wins).
          The opposing outcome later trades at decimal $1.30$, and you
          hedge with $H = 100 \times 2.50 / 1.30 \approx 192.31$. What does
          this guarantee?
        choices:
          - text: >
              A guaranteed profit of about $42.31$
            feedback: >
              That reverses the sign — total stakes here exceed the
              payout, not the other way around.
          - text: >
              A fixed result whichever side wins — here a guaranteed loss
              of about $42.31$, since total stakes of $292.31$ exceed the
              $250$ payout
            correct: true
            feedback: >
              Right — hedging always fixes the outcome, but the arithmetic
              doesn't guarantee that fixed number is positive; here $O_1$
              hasn't moved favorably enough.
          - text: >
              An uncertain result, depending on which side actually wins
            feedback: >
              The entire point of matching $H$ to the original payout is
              that the result no longer depends on which side wins.
        feedback: >
          Hedging converts an uncertain payoff into a certain one, but a
          certain number can still be a loss — here a smaller, locked-in
          one, which can still be worth taking purely to remove variance.
      - teach: >
          Stake $H = S_0 O_0 / O_1$ on the opposite outcome at today's
          price to equalize the payout, turning an open bet into a fixed,
          known result.

  - node: quant-games.betting-markets.line-movement
    hook: >
      "The line moved against me" gets read as bad news by reflex; separating
      why it moved is the actual signal an interviewer is probing for.
    explanation: >
      A bookmaker's price is a function of two things at once: its own
      exposure across the two sides of the bet, and its read on new
      information about the true probability. Heavy one-sided action shortens
      a price for both reasons simultaneously — balancing the book and
      updating the estimate — so a real price genuinely does move when real
      money moves it.

      Not all money carries the same information. "Sharp" money is
      edge-driven and tends to arrive early, closer to a genuine update to
      the fair probability. "Square" money is public, narrative- or
      loyalty-driven volume that tends to push lines in predictable
      directions unrelated to the true chance, which is exactly why sharp
      bettors like to bet before that public volume arrives and moves the
      price against them.

      The practical consequence: a line moving against a bet you've already
      placed is not itself evidence that your original edge was wrong — it
      may simply mean square money pushed an already-fair price further off
      fair. The size of the move tells you nothing on its own; figuring out
      who moved it is the actual read.
    interview: >
      "You bet this side and the line's since moved against you — does that
      change how you feel about your edge" wants reasoning about who likely
      drove the move, not a reflexive "yes, the market disagrees with me
      now."
    pitfalls: >
      Treating any adverse line move as automatic evidence against your
      original edge conflates price movement with new information. Assuming
      all volume is informed — reading a big move as "the market knows
      something" — ignores how much of it is public and narrative-driven
      rather than edge-driven.
    recap: >
      Lines move because money moves them, but only sharp money is genuine
      evidence about the true probability — a move against you is signal or
      noise depending on which kind pushed it.
    steps:
      - teach: >
          "The line moved against me" gets read as bad news by reflex.
          Separating why it moved — not just noting that it did — is the
          actual signal an interviewer is probing for.
      - teach: >
          A bookmaker's price is a function of two things at once: its own
          exposure across the two sides of the bet, and its read on new
          information about the true probability. Heavy one-sided action
          shortens a price for both reasons simultaneously.
      - teach: >
          "Sharp" money is edge-driven and tends to arrive early, closer to
          a genuine update to the fair probability.
      - teach: >
          "Square" money is public, narrative- or loyalty-driven volume
          that pushes lines in predictable directions unrelated to the true
          chance — which is exactly why sharp bettors like to bet before
          that public volume arrives.
      - ask: >
          You bet a side Monday morning. By game time the line has moved
          noticeably against your side, driven mostly by heavy public
          betting after a viral highlight clip. Does this line move mean
          your original edge was wrong?
        choices:
          - text: >
              Yes — the market has spoken and now disagrees with your
              original view
            feedback: >
              This conflates any price movement with new information. A
              move can happen with no real update to the true probability
              behind it.
          - text: >
              No — this looks like square, narrative-driven money, which
              doesn't carry genuine information about the true probability
            correct: true
            feedback: >
              Right — public volume chasing a highlight clip is the
              textbook case of a move that isn't itself evidence against
              your original edge.
          - text: >
              Yes, since line movement is always proportional to how wrong
              the original price was
            feedback: >
              There's no such relationship — the size of a move on its own
              says nothing about whether the original price was mispriced.
          - text: >
              It's impossible to say without knowing the final score
            feedback: >
              The outcome doesn't tell you whether the move was
              informative — who drove the move does.
        feedback: >
          A line moving against a bet you've already placed isn't itself
          evidence your original edge was wrong — it may simply mean square
          money pushed an already-fair price further off fair.
      - teach: >
          The size of a move alone tells you nothing — figuring out who
          moved it, sharp money or square money, is the actual read.
      - ask: >
          Which kind of money is more likely to represent a genuine update
          to the true probability of an outcome?
        choices:
          - text: >
              Square money, since it reflects the majority of public
              opinion
            feedback: >
              Majority opinion isn't the same as informed opinion — square
              money is narrative- and loyalty-driven, not edge-driven.
          - text: >
              Sharp money, since it is edge-driven and tends to arrive
              early, before public volume pushes the price around
            correct: true
            feedback: >
              Right — sharp money is exactly the kind that reflects a real
              update to the fair probability.
          - text: >
              Whichever side the bookmaker itself favors
            feedback: >
              A bookmaker balances exposure across both sides; it isn't
              taking a side of its own.
        feedback: >
          Sharp money is edge-driven and tends to move first; square money
          is public volume that can push a line without reflecting any real
          information.
      - teach: >
          Lines move because money moves them, but only sharp money is
          genuine evidence about the true probability — a move against you
          is signal or noise depending on which kind pushed it.
