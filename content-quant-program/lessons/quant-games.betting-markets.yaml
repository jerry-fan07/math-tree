unit: quant-games.betting-markets
opening: >
  Odds are prices, and this unit teaches you to read them the way a trader
  reads a quote sheet: convert any format to a common currency, flip it into
  the market's implied probability, and spot the standing margin — the
  overround — baked into every full set of prices a bookmaker posts. From
  there the unit turns operational: stripping that margin out to recover fair
  probabilities, weighing your own view against a price to find genuine edge,
  locking in a riskless profit across two mispriced books or on a bet you
  already hold, and reading what a moving line actually says about who is
  betting and why.
lessons:
  - node: quant-games.betting-markets.odds-formats
    hook: >
      A live market or an interviewer will hand you whichever format is on
      screen — American on a US book, fractional on a UK racing board,
      decimal everywhere else — and expect you to see the same price under
      all three without reaching for a converter.
    explanation: >
      Decimal odds are already the easy case: $d$ is the total amount
      returned per unit staked, so its implied probability is simply $1/d$.
      Fractional odds report something narrower — profit only, not total
      return — as $b/a$ per unit staked, so converting to decimal means
      adding the stake back: $d = b/a + 1$.

      American odds anchor to a stake of $100$ and split into two regimes by
      sign. Positive odds $A$ report the profit on a $100$ stake directly, so
      $d = 1 + A/100$. Negative odds $A$ report how much you must risk to
      profit $100$, so $d = 1 + 100/|A|$ — the risk sits in the denominator
      rather than the numerator, which is why the formula inverts instead of
      just flipping a sign. The two regimes meet at even money: $+100$ and
      $-100$ both mean decimal $2.00$, and nothing sits between them —
      American odds never read $+0$ or $-50$.

      Convert through decimal as the common currency rather than memorizing a
      direct fractional-to-American cross-formula. Once a price sits in
      decimal form, implied probability, edge, and every later calculation in
      this unit apply the same way regardless of which format it started in.
    worked: >
      Fractional odds $5/2$ convert to decimal as $d = 5/2 + 1 = 3.5$. Since
      $d \ge 2$, that's the positive-American regime: $A = 100(d-1) =
      100(2.5) = 250$, so $5/2$ is $+250$. Now the other direction: a
      short-priced favorite at decimal $1.40$ has $d < 2$, so it's negative
      American: $A = -100/(d-1) = -100/0.4 = -250$ — stake $250$ to profit
      $100$.
    interview: >
      Expect a price fired at you cold in whichever format the interviewer
      prefers, with the ask being instant, correct conversion — the right
      branch picked without hesitation, not just the formula recited. A
      common follow-up is the break-even stake implied by a negative-odds
      favorite, testing the $100/|A|$ piece specifically.
    pitfalls: >
      Applying the positive-odds formula to a negative number, or the reverse,
      is the single most common slip — check the sign before picking a
      branch. Fractional odds are profit, not total return; plugging $b/a$
      straight into $p = 1/d$ without adding the stake back understates the
      price. And there is no American quote between $-100$ and $+100$: the
      two regimes touch only at even money.
    recap: >
      Decimal is the common currency — fractional adds one stake back and
      American branches by sign around the $100$ anchor, but every format
      converts through $d$ into the same price.
    dialogue:
      - part: Three boards, one horse
        teach: >
          Three boards price the same horse in the same race. The first shows
          $7/2$, the second $+350$, the third $4.50$. You have $10$ to stake
          and want to know which board to take it to.
      - ask: >
          On the first board, $7/2$ means you profit $7$ for every $2$ you
          stake. You stake $10$ there and the horse wins. How much do you
          collect in total, your stake included?
        expects: "45"
        hint: >
          Work out the profit first, then remember the bookmaker hands the
          stake back too.
        feedback: >
          The profit is $10 \times 7/2 = 35$, and the $10$ stake comes back
          with it: $35 + 10 = 45$ in total.
      - ask: >
          The third board's $4.50$ is the total returned per $1$ staked,
          stake included, so $10$ there also collects $45$. The second
          board's $+350$ is an American quote: the profit on a stake of
          $100$. Against the other two, the $+350$ board pays
        choices:
          - text: >
              more, because $350$ is by far the biggest number on the three
              boards.
            feedback: >
              The number is big because its unit is big: it is quoted per
              $100$ staked, not per $1$ or per $2$. Scale the board down to a
              $10$ stake and it pays a profit of $35$.
          - text: >
              exactly the same.
            correct: true
            feedback: >
              A stake of $100$ profits $350$ and collects $450$, which is
              $4.50$ per $1$ staked. A $10$ stake collects $45$, as on the
              other two boards.
          - text: >
              less, since the American board needs a stake of $100$ before it
              pays anything.
            feedback: >
              The $100$ is only the unit the quote is written in; you may
              stake any amount and the payout scales with it. Per $1$ staked
              it returns $4.50$, like the decimal board.
        feedback: >
          Three notations, one price. Each board reports the same deal in its
          own unit: profit per $2$, profit per $100$, total return per $1$.
      - reflect: >
          You had to translate every board before you could compare them.
          If you could keep just one kind of number for every quote, what
          would you choose, and what does each of the other two formats need
          done to it to reach that number?
        answer: >
          Keep the total return per $1$ staked, which is what the decimal
          board already shows. A fractional quote reports profit only, so
          add the stake back: $7/2 + 1 = 4.50$. A positive American quote
          reports profit per $100$, so divide by $100$ and add the stake
          back: $1 + 350/100 = 4.50$. Profit per unit would work too, but
          total return is the one a bettor actually walks away with, and
          every later calculation on a price starts from it.
      - teach: >
          That common currency is decimal odds $d$: the total returned per
          unit staked if the bet wins, so the profit is $d - 1$. Fractional
          odds $b/a$ quote the profit per unit, so $d = b/a + 1$. Positive
          American odds $A$ quote the profit on a stake of $100$, so
          $d = 1 + A/100$. Decimal, fractional and American are three labels
          for one payout multiple.

      - part: A favourite with a minus sign
        ask: >
          In another race, a US book quotes a strong favourite at American
          $-125$. A minus sign means you must risk $125$ to profit $100$.
          What are the decimal odds?
        expects: "1.8"
        hint: >
          Risk $125$; if it wins you collect the $125$ back plus the $100$
          profit. Divide the total by the stake.
        feedback: >
          You collect $125 + 100 = 225$ on a stake of $125$, so
          $d = 225/125 = 1.80$. Equivalently, the profit per unit is
          $100/125 = 0.8$, and $d = 1 + 0.8 = 1.80$.
      - ask: >
          A colleague runs $-125$ through the positive formula
          $d = 1 + A/100$ and gets nonsense. What is the real reason that
          formula does not apply?
        choices:
          - text: >
              It only trips over the sign: use $|A|$ instead and you get
              $1 + 125/100 = 2.25$.
            feedback: >
              $2.25$ is the price of $+125$: risk $100$ to win $125$, an
              underdog's deal. The favourite at $-125$ risks more to win
              less, so its decimal price must sit below $2.00$, and it does
              at $1.80$.
          - text: >
              A negative quote names the stake, not the profit, so $100$ and
              $|A|$ trade places: $d = 1 + 100/|A|$.
            correct: true
            feedback: >
              Right. On the positive side $A$ is the profit on $100$; on the
              negative side $|A|$ is the stake that earns $100$. The profit
              per unit is therefore $100/|A|$, here $0.8$.
          - text: >
              Negative American odds are a different kind of bet and have no
              decimal equivalent.
            feedback: >
              Every bet that pays a fixed multiple has a decimal price, and
              you just computed this one: $1.80$. The minus sign is notation,
              not a different product.
        feedback: >
          Negative American odds $A$ convert as $d = 1 + 100/|A|$. The sign
          tells you which number sits on the $100$ anchor: the profit when
          positive, the stake when negative.
      - ask: >
          A screen shows a price of American $-80$. What do you make of it?
        choices:
          - text: >
              Decimal $1 + 100/80 = 2.25$, a slight underdog.
            feedback: >
              The formula returns a number, but no book prints it this way.
              A price of $2.25$ pays more than even money, and above even
              money the quote is written positive, as $+125$.
          - text: >
              Decimal $1.80$, the same as $-125$.
            feedback: >
              $1.80$ is what $-125$ means: risk $125$ to win $100$. Risking
              $80$ to win $100$ would be a better-than-even deal, which is
              not what a minus sign reports.
          - text: >
              It is not a legal American quote.
            correct: true
            feedback: >
              Both $+100$ and $-100$ mean decimal $2.00$, even money. Every
              price above $2.00$ is quoted positive and every price below
              it negative, so nothing ever reads between $-100$ and $+100$.
        feedback: >
          The two American regimes touch only at even money. A quote between
          $-100$ and $+100$ is a typo or a misread, and the check is to ask
          whether the price should sit above or below $2.00$.

      - part: Every format, through decimal
        ask: >
          A UK racing board shows a hot favourite at fractional $1/4$. What
          are the decimal odds?
        expects: "1.25"
        hint: >
          Fractional odds report profit only. Add the stake back.
        feedback: >
          $d = 1/4 + 1 = 1.25$: stake $4$, profit $1$, collect $5$, and
          $5/4 = 1.25$.
      - ask: >
          Quote that same favourite in American odds. Give the number with
          its sign.
        expects: "-400"
        hint: >
          The decimal price is below $2.00$, so you are in the negative
          regime. Solve $d = 1 + 100/|A|$ for $|A|$.
        feedback: >
          $d - 1 = 0.25 = 100/|A|$, so $|A| = 100/0.25 = 400$, and the quote
          is $-400$: risk $400$ to profit $100$, the same deal as risking $4$
          to profit $1$.
      - teach: >
          No direct fractional-to-American formula was needed: you went
          fractional to decimal, then decimal to American. In an interview
          the answer to "what is $1/4$ in American?" is said as the route,
          "$1.25$ decimal, below two, so minus: $-400$", because the regime
          check is what the interviewer is listening for.

  - node: quant-games.betting-markets.implied-probability
    hook: >
      Every later calculation in this unit — overround, edge, arbitrage —
      starts by turning a quoted price back into a probability, so this
      one-line flip has to be reflexive.
    explanation: >
      Once a price is in decimal form, $p = 1/d$ falls straight out of what
      "break-even" means: staking $1$ at decimal odds $d$ returns $d$ with
      probability $p$ and $0$ otherwise, and the bet is fair exactly when
      $p \cdot d = 1$. That single formula is why converting to decimal first
      is worth the extra step — fractional and American odds each need their
      own inversion, but decimal only ever needs a reciprocal.

      Treat the output as a price, not a fact. A bookmaker's quote reflects
      what the bookmaker is willing to pay, shaped by its own risk exposure
      and margin, and a full market's worth of implied probabilities will
      typically sum to more than $100\%$ rather than land exactly on it. That
      gap is structural, not noise, and the next few nodes exist to name and
      remove it.

      For now, the discipline is just this: whenever a price is quoted, in
      any format, convert to decimal and take the reciprocal before doing
      anything else with it.
    worked: >
      American $+120$ converts to decimal as $d = 1 + 120/100 = 2.20$, so the
      implied probability is $p = 1/2.20 \approx 0.4545$, about $45.5\%$ —
      the win rate at which betting this side breaks even in the long run.
    interview: >
      "The market's offering you this price, what's it implying" is asked as
      a reflex check before any harder question. A sharper follow-up — "is
      that the true probability?" — is listening for the answer that it is
      only the market's price, not a claim about reality.
    pitfalls: >
      Inverting a fractional or American number directly, instead of
      converting to decimal first, is a common arithmetic slip. Reading an
      implied probability as the actual chance of the outcome, rather than as
      a price that may carry margin, sets up the overround mistake that
      follows.
    recap: >
      Convert to decimal, then invert: $p = 1/d$ is the market's break-even
      price, not a claim about the true probability.
    dialogue:
      - part: What a price demands
        teach: >
          A book offers decimal $5.00$ on a horse. You decide to stake $1$ on
          it in each of $100$ races just like this one, at the same price
          every time.
      - ask: >
          How many of the $100$ races must the horse win for you to finish
          exactly even?
        expects: "20"
        hint: >
          You stake $100$ in total. Each win hands back $5$, stake included.
        feedback: >
          You put in $100$. Each win returns $5$, so $20$ wins return
          $20 \times 5 = 100$ and you are exactly even. Fewer wins lose money;
          more make it.
      - ask: >
          A favourite in another race is offered at decimal $1.60$. At what
          win rate does a bettor backing it break even? Give it as a
          decimal.
        expects: "0.625"
        hint: >
          Over $N$ races at $1$ each you stake $N$; you need the wins to hand
          back $N$.
        feedback: >
          With a win rate $p$, each $1$ staked returns $1.60$ with
          probability $p$, so on average $1.60p$ comes back. Break-even needs
          $1.60p = 1$, so $p = 1/1.60 = 0.625$.
      - reflect: >
          You found a break-even win rate for two prices. Write the rule for
          a decimal price $d$, and say what that rate means to someone
          deciding whether to bet.
        answer: >
          Per unit staked the bet returns $d$ with probability $p$ and
          nothing otherwise, so the average return is $pd$, and break-even
          is $pd = 1$: $p = 1/d$. That rate is the bar the price sets. If you
          believe the outcome happens more often than $1/d$, the price is
          generous to you; less often, and it is not.
      - teach: >
          That rate has a name: the implied probability of decimal odds $d$
          is $p = 1/d$, the win rate at which the bet is exactly fair. It is
          a probability read off a price, and for any quoted format the
          route is the same: convert to decimal, then take the reciprocal.

      - part: Any format, one flip
        ask: >
          A board shows a runner at fractional $4/1$. A colleague says
          "four to one, so $1/4$, a $25\%$ chance". What is wrong?
        choices:
          - text: >
              Nothing: fractional odds $b/a$ imply $a/b$.
            feedback: >
              Flipping the fraction inverts the profit, not the total
              return. Stake $1$ at $4/1$ and a win returns $5$, so break-even
              needs one win in five, not one in four.
          - text: >
              $4/1$ quotes profit only, so the decimal price is $5$, and the
              implied probability is $1/5 = 20\%$.
            correct: true
            feedback: >
              Right: add the stake back first. This is the same price as the
              horse at decimal $5.00$, and it demands the same $20$ wins in
              $100$.
          - text: >
              The implied probability should be $4/5 = 80\%$, the chance the
              runner wins.
            feedback: >
              $4/5$ is closer to the chance the runner *loses*. A long price
              like $4/1$ belongs to an outsider: break-even is $1/5 = 20\%$.
        feedback: >
          Invert decimal odds and nothing else. Fractional and American
          numbers each need converting first, and skipping that step on
          fractional odds always overstates the implied probability.
      - ask: >
          A heavy favourite is quoted at American $-300$. What probability
          does that price imply?
        expects: "0.75"
        hint: >
          Negative American: $d = 1 + 100/|A|$. Then flip.
        feedback: >
          $d = 1 + 100/300 \approx 1.3333$, so $p = 1/1.3333 = 0.75$.
          Check it against the quote: risk $300$ to win $100$, so you need to
          win three times for each loss, three in four.

      - part: A price, not a forecast
        teach: >
          A tennis match has two players and no draw. A book quotes player A
          at decimal $1.25$ and player B at decimal $3.75$.
      - ask: >
          Add the two implied probabilities. Give the sum to four decimal
          places.
        expects: "1.0667"
        tolerance: 0.0005
        hint: >
          Flip each price, then add.
        feedback: >
          $1/1.25 = 0.8$ and $1/3.75 \approx 0.2667$, which sum to about
          $1.0667$. Exactly one player wins, yet the two numbers add to
          more than $1$.
      - ask: >
          What does a sum above $1$ tell you about the two implied
          probabilities?
        choices:
          - text: >
              The book has made an arithmetic error in one of the two
              prices.
            feedback: >
              Real books post sums like this on purpose, on almost every
              market. Nothing was miscomputed; the numbers just are not
              what the objection assumes.
          - text: >
              They are break-even rates the book demands, not its forecast,
              with the book's margin built in.
            correct: true
            feedback: >
              Right. A price is what the book is willing to pay, set with its
              own margin in it, so together the two bars overshoot any honest
              pair of chances, which would have to add to exactly $1$.
          - text: >
              One of the players must be overrated, and it is the
              favourite.
            feedback: >
              Nothing here says which side carries the extra, or that only
              one does. Both implied numbers can sit above the players' true
              chances at once, and a sum above $1$ says that at least one of
              them does.
        feedback: >
          An implied probability is the market's price, not a claim about
          the true chance. When an interviewer follows "what does $3.75$
          imply?" with "is that the probability B wins?", the answer is that
          $26.7\%$ is what the price demands, and since the two sides sum to
          $106.7\%$, part of every implied number is the book's margin.

  - node: quant-games.betting-markets.overround
    hook: >
      "What's the vig on this line" is a standard interview ask, and it is
      nothing more than summing implied probabilities and subtracting one.
    explanation: >
      A single price only tells you the break-even rate for one side. The
      overround is a property of the whole market: convert every outcome's
      price to an implied probability and add them up. On a theoretical,
      zero-margin book, those probabilities would sum to exactly $100\%$,
      mirroring the true chances. A real book prices every side a little
      conservatively, so the sum comes in above $100\%$, and that excess is
      margin extracted regardless of which outcome actually happens.

      The overround is not charged separately or visible as a fee — it's
      baked directly into each individual price, which is exactly why you
      have to sum across the whole market to see it at all. A single quote in
      isolation looks perfectly ordinary; the tell only shows up once every
      side is accounted for.

      Nothing requires the margin to be split evenly across outcomes — two
      sides of the same market can carry very different amounts of it, and
      the total is still what matters for measuring the house's edge.
    worked: >
      A two-way market quotes decimal $1.80$ on one side and $2.05$ on the
      other. Implied probabilities are $1/1.80 \approx 0.5556$ and
      $1/2.05 \approx 0.4878$, summing to about $1.0434$ — an overround of
      roughly $4.3\%$, even though the two prices aren't symmetric.
    interview: >
      Given a full set of prices, sum the implied probabilities and subtract
      $1$ — the interviewer is watching for that reflex, done quickly and
      without needing every side to look alike.
    pitfalls: >
      Leaving out a leg of the market — forgetting the draw in a three-way
      soccer line, say — understates the true overround by omitting real
      margin. Treating the overround as a separate fee rather than something
      embedded in the prices themselves misses where to actually look for it.
    recap: >
      Sum every side's implied probability; the amount over $100\%$ is the
      overround, the bookmaker's structural edge before any outcome is
      decided.
    dialogue:
      - part: Running a book on a coin
        teach: >
          You run a book on one toss of a fair coin. You quote heads at
          decimal $1.80$ and tails at decimal $1.80$. A hundred customers
          each stake $1$ on heads, and a hundred each stake $1$ on tails.
      - ask: >
          The coin lands heads. What is your profit as the bookmaker?
        expects: "20"
        hint: >
          You took in every stake. Only the winning side gets paid, at
          $1.80$ each.
        feedback: >
          You collected $200$ and pay the $100$ heads backers $1.80$ each,
          $180$ in all, keeping $20$. Had it landed tails you would pay the
          other hundred the same $180$ and keep the same $20$.
      - ask: >
          What price, quoted on both sides, would leave you with exactly
          nothing whatever the toss?
        expects: "2"
        hint: >
          You collect $200$; the winning hundred must take all of it.
        feedback: >
          Paying $200$ to $100$ winners is $2$ each, so decimal $2.00$ on
          both sides. Each side then implies $1/2.00 = 0.5$, the coin's true
          chance, and the two implied probabilities sum to exactly $1$.
      - ask: >
          Back at $1.80$ on both sides, add the two implied probabilities.
          Give the sum to four decimal places.
        expects: "1.1111"
        tolerance: 0.0005
        hint: >
          Each side implies $1/1.80$.
        feedback: >
          $1/1.80 \approx 0.5556$, twice, is about $1.1111$: about $11\%$
          more than any set of real probabilities can add up to.
      - reflect: >
          At $2.00$ the sum was $1$ and you kept nothing; at $1.80$ the sum
          was $1.1111$ and you kept $20$ whatever happened. Suppose all you
          had were the two prices, no customers. What would you look at to
          see that the book makes money regardless of the result, and why
          does it work?
        answer: >
          Add the implied probabilities across every outcome. Each price
          $1/d_i$ is the win rate it demands; shorten every price below fair
          and every demand rises above the true chance, so the total climbs
          past $1$. The amount over $1$ is margin built into the prices
          themselves. When the money arrives in proportion to the implied
          probabilities, as it did here, the book keeps the same cut on
          every outcome: $1 - 1/1.1111 = 10\%$ of the $200$ turnover.
      - teach: >
          The excess has a name. Over a complete set of mutually exclusive
          outcomes, the overround (vig, juice) is $\sum_i 1/d_i - 1$. A
          zero-margin book has overround $0$; your coin book at $1.80$ has
          about $0.111$, or $11.1\%$. It is never charged as a fee: it lives
          inside every price, and only the sum reveals it.

      - part: Every leg of the market
        ask: >
          A football match, three outcomes: home win at decimal $2.40$, draw
          at $3.20$, away win at $3.00$. What is the overround? Give it as a
          decimal.
        expects: "0.0625"
        tolerance: 0.0005
        hint: >
          Flip all three prices, add, subtract $1$.
        feedback: >
          $1/2.40 \approx 0.4167$, $1/3.20 = 0.3125$ and $1/3.00 \approx
          0.3333$ sum to $1.0625$, so the overround is $0.0625$, or
          $6.25\%$.
      - ask: >
          A colleague computes the same market from the home and away prices
          alone, gets $0.4167 + 0.3333 = 0.75$, and reports a negative
          overround of $-25\%$: a book giving money away. What went wrong?
        choices:
          - text: >
              Nothing: a three-way market is just less efficient, and this
              one is underpriced.
            feedback: >
              Underpricing would show up in the sum over all three outcomes,
              and that sum is $1.0625$. A sum under $1$ from two legs of
              three says nothing about the book.
          - text: >
              The draw is a real outcome. Without it the two legs cover only
              part of what can happen, so their sum is not an overround at
              all.
            correct: true
            feedback: >
              Right. The overround is defined over a complete set of
              outcomes. Drop a leg and you drop both its probability and its
              margin; here the missing $0.3125$ turns a $6.25\%$ margin into
              a phantom $-25\%$.
          - text: >
              The overround should be computed from the prices, not the
              implied probabilities: $2.40 + 3.00$.
            feedback: >
              Adding prices measures nothing; a long shot at $50.00$ would
              swamp the sum. Margin shows up in the reciprocals, which are
              what the book demands on each side.
        feedback: >
          The sum runs over every outcome the market prices. The draw is the
          classic leg to forget in football, and forgetting it does not just
          understate the margin; it can invent an arbitrage that is not
          there.

      - part: One price says nothing on its own
        ask: >
          A darts match is quoted at decimal $1.25$ on player A. You do not
          see the price on player B. What can you say about this book's
          overround?
        choices:
          - text: >
              About $25\%$: the gap between $1.25$ and $1$.
            feedback: >
              $0.25$ is the profit per unit on A, nothing more. A short price
              is not a high margin; the overround depends on how B is priced
              too.
          - text: >
              It is at least $0.8 + 0.5 - 1 = 0.3$, since B must imply at
              least $0.5$.
            feedback: >
              B is the outsider here and can imply far less than $0.5$:
              nothing forces its price to $2.00$ or shorter. With A at $1.25$
              the book can quote B anywhere it likes, and B's price sets the
              overround.
          - text: >
              Nothing yet: the overround is a property of the full market,
              and B's price is missing.
            correct: true
            feedback: >
              Right. One price tells you one break-even rate. The margin is
              only visible once every outcome is accounted for.
        feedback: >
          A single quote in isolation always looks ordinary. The overround
          lives in the sum.
      - ask: >
          The book's overround on that darts match turns out to be exactly
          $0.05$. What decimal price does it quote on B?
        expects: "4"
        hint: >
          The two implied probabilities must sum to $1.05$. A takes $0.8$ of
          that.
        feedback: >
          $1/1.25 = 0.8$, so B's implied probability is $1.05 - 0.8 = 0.25$,
          and B's price is $1/0.25 = 4.00$. Asked "what's the vig on
          $1.25$ / $4.00$?" in an interview, the answer is one line said
          aloud: "$0.8$ plus $0.25$ is $1.05$, so five percent."

  - node: quant-games.betting-markets.devigging
    hook: >
      To compare your own view against a market honestly, you need its price
      with the margin stripped out — this is the standard first move whenever
      an edge calculation needs a "true" probability.
    explanation: >
      The mechanics are one line: sum the implied probabilities to get
      $S > 1$, then divide each one by $S$. This works because dividing every
      term of a sum by that same sum's total forces the new terms to add to
      exactly $1$ — $\sum_i (p_i / S) = S / S = 1$ — so the results are valid
      probabilities by construction, not just numbers that happen to look
      like some.

      The method is proportional: it assumes the margin sits evenly across
      outcomes in probability space, scaling every side down by the same
      factor $1/S$. That's a simplification — a real book's margin can lean
      more heavily on one side than another — but it needs no information
      beyond the quoted prices themselves, which makes it the standard
      baseline whenever a "fair" probability is needed on the spot.

      The reason it matters: the raw implied probability carries the
      bookmaker's margin, so comparing your own probability estimate against
      it silently credits that margin to the market's belief and misreads how
      far you actually disagree with it. De-vigging first isolates what the
      market actually believes from what it charges to take the bet.
    worked: >
      A three-way market quotes decimal $2.20$, $3.40$, $3.60$ on the three
      outcomes. Implied probabilities are $0.4545$, $0.2941$, $0.2778$,
      summing to $S \approx 1.0264$. Dividing each by $S$ gives fair
      probabilities of about $44.3\%$, $28.7\%$, and $27.1\%$ — which add
      back to $100\%$.
    interview: >
      "Strip the vig out of this line" wants exactly the normalize-by-sum
      move applied live, across every outcome quoted — not a more elaborate
      model, unless one is explicitly asked for.
    pitfalls: >
      Normalizing only some of the market's outcomes — missing a leg —
      understates $S$ and distorts every resulting probability. Treating the
      proportional result as the single objectively correct fair price,
      rather than a stated simplifying assumption about how margin is
      spread, overstates how much the method actually proves.
    recap: >
      Divide every implied probability by their sum; the results are
      nonnegative, sum to exactly $100\%$, and are the standard fair-price
      estimate once the margin is removed.
    dialogue:
      - part: A price that is not a probability
        teach: >
          A book prices a two-player match at decimal $1.60$ on A and $2.40$
          on B. You want one number from it: the market's own estimate of
          A's chance, so you can set your view against it.
      - ask: >
          What probability does A's price imply?
        expects: "0.625"
        hint: >
          Flip the decimal price.
        feedback: >
          $1/1.60 = 0.625$: A has to win $62.5\%$ of the time for a backer
          to break even.
      - ask: >
          Add both sides' implied probabilities. Give the sum to four
          decimal places.
        expects: "1.0417"
        tolerance: 0.0005
        hint: >
          B implies $1/2.40$.
        feedback: >
          $0.625 + 1/2.40 \approx 0.625 + 0.4167 = 1.0417$, an overround of
          about $4.2\%$.
      - ask: >
          So is $0.625$ the market's estimate of A's chance?
        choices:
          - text: >
              Yes: it is the number the market itself put on A.
            feedback: >
              Then the market would also be saying B wins $41.7\%$ of the
              time, and the two estimates would add up to $104.2\%$ for a
              match exactly one player wins. The price carries margin, so it
              cannot be the estimate.
          - text: >
              No: it is $0.625 - 0.0417 = 0.5833$, the price less the whole
              overround.
            feedback: >
              That charges A for the entire margin and leaves B's $0.4167$
              untouched, as if B's price carried none of it. Nothing in the
              two prices says the margin sits on A.
          - text: >
              No: it carries margin, so the market's estimate is below
              $0.625$, by an amount you have not worked out yet.
            correct: true
            feedback: >
              Right. The two implied numbers together overshoot $1$ by
              $0.0417$, and some of that excess is inside A's $0.625$.
        feedback: >
          The raw implied probability is a price, inflated by margin. To get
          an estimate out of it you need to take the margin back out, and the
          only clue to how much is the total, $1.0417$.

      - part: Shrinking both sides at once
        reflect: >
          You want two numbers that add to exactly $1$ and keep the market's
          view of the match intact: A still the favourite, by the same
          proportion relative to B as in the prices. What one operation on
          $0.625$ and $0.4167$ does that, and why does the result add to
          $1$?
        hint: >
          Keeping A's share relative to B fixed means treating both numbers
          the same way. What can you do to both that changes their sum to
          $1$?
        answer: >
          Divide both by their total $S = 1.0417$. Dividing by the same
          number keeps the ratio $0.625 : 0.4167$ exactly as it was, and the
          new numbers add to $S/S = 1$, so they are honest probabilities by
          construction. In effect each side gives up the same fraction of
          its implied probability to pay for the margin.
      - teach: >
          That move is de-vigging. Sum the implied probabilities of every
          outcome in the market to get $S > 1$, then divide each one by $S$.
          The results $p_i/S$ are nonnegative and add to exactly $1$. The
          method is proportional: it assumes the book's margin is spread
          across outcomes in proportion to their implied probabilities, an
          assumption, but one that needs nothing beyond the prices on the
          board.
      - ask: >
          What is A's de-vigged fair probability?
        expects: "0.6"
        tolerance: 0.0005
        hint: >
          Divide $0.625$ by $1.0417$, or keep it exact: $0.625$ divided by
          $25/24$.
        feedback: >
          $S = 0.625 + 0.41\overline{6} = 25/24$, so A's fair probability is
          $0.625 \times 24/25 = 0.6$ and B's is $0.41\overline{6} \times
          24/25 = 0.4$. The market's estimate is $60/40$; the prices sit
          $4.2\%$ above it.
      - ask: >
          A newsletter reads the same board and writes "the market makes A a
          $62.5\%$ shot". If you set your own estimate of A against that
          figure, what goes wrong?
        choices:
          - text: >
              Nothing: $62.5\%$ is the stricter number, so the comparison is
              only more conservative.
            feedback: >
              Stricter for one question, wrong for another. Asking "do I
              disagree with the market, and which way?" needs the market's
              estimate, $60\%$. A reader at $61\%$ would think the market
              rates A higher than they do, when in fact they rate A higher
              than the market.
          - text: >
              The book's margin gets counted as part of the market's
              belief, so you misread where you stand relative to it.
            correct: true
            feedback: >
              Right. $2.5$ of the $62.5$ points are the cost of betting, not
              anyone's opinion about A. Strip it out before you measure how
              far your view is from the market's.
          - text: >
              The newsletter should have used $0.625 - 0.0417 \approx 58.3\%$
              instead.
            feedback: >
              That charges A for the whole overround and leaves B's price
              untouched. The proportional method takes $2.5$ points from A
              and $1.7$ from B.
        feedback: >
          De-vigging separates what a market believes from what it charges.
          Comparing a view against the raw implied number silently credits
          the margin to the market's opinion.

      - part: Three legs and a long shot
        ask: >
          A football match is priced at decimal $2.25$ for a home win,
          $3.25$ for the draw and $3.30$ for an away win. What is the draw's
          de-vigged fair probability? Give it to four decimal places.
        expects: "0.2916"
        tolerance: 0.0005
        hint: >
          Flip all three, add to get $S$, then divide the draw's implied
          probability by $S$.
        feedback: >
          The implied probabilities are $1/2.25 \approx 0.4444$, $1/3.25
          \approx 0.3077$ and $1/3.30 \approx 0.3030$, so $S \approx
          1.0552$. The draw's fair probability is $0.3077/1.0552 \approx
          0.2916$, and the three fair numbers, about $0.4212$, $0.2916$ and
          $0.2872$, add back to $1$.
      - ask: >
          A five-runner race has implied probabilities summing to $1.10$,
          with the outsider at decimal $51.00$. A colleague de-vigs by
          subtracting an equal share of the overround, $0.10/5 = 0.02$, from
          every runner. What happens to the outsider?
        choices:
          - text: >
              Its fair probability comes out at $0.0196 - 0.02 \approx
              -0.0004$, which is not a probability.
            correct: true
            feedback: >
              Right. $1/51.00 \approx 0.0196$ is smaller than the share
              being removed. Proportional de-vigging gives $0.0196/1.10
              \approx 0.0178$ and can never go negative, because it scales
              rather than subtracts.
          - text: >
              Nothing unusual: equal shares are the fairest way to split the
              margin.
            feedback: >
              Equal shares in probability ignore that $0.02$ is almost all of
              the outsider's implied probability and a sliver of the
              favourite's. On this race the method produces a negative
              number.
          - text: >
              It comes out the same as the proportional method, since both
              remove $0.10$ in total.
            feedback: >
              Both remove $0.10$ in total, but they split it differently. The
              proportional method takes about $0.0018$ from the outsider;
              equal shares take $0.02$, more than it has.
        feedback: >
          Proportional scaling always returns valid probabilities. It still
          rests on an assumption: real books often load extra margin onto
          long shots, so the proportional fair price of an outsider is, if
          anything, a little generous to it.
      - teach: >
          The ten-second version for an interview: "Flip every price, add
          them up to get $S$, divide each by $S$. That's the proportional
          de-vig; it assumes the margin is spread evenly in probability
          terms, which is the standard first cut, not the truth."

  - node: quant-games.betting-markets.favorite-underdog-vig
    hook: >
      American moneylines are the single most common two-sided quote you'll
      be handed, and this is the full odds-to-implied-to-devigged pipeline
      run start to finish on one.
    explanation: >
      The favorite is conventionally quoted negative and the underdog
      positive precisely because negative American odds describe "risk more
      to win less" and positive odds describe "risk less to win more" — the
      sign is doing real work, not just a labeling convention, and mixing up
      which raw number belongs to which side flips every downstream number.

      The pipeline itself is just the previous three nodes chained: convert
      each side to decimal, invert to get implied probabilities, sum them to
      find the overround, then divide by that sum to recover fair
      probabilities. Nothing new happens here mechanically — the value of
      running it end to end on a moneyline is building the reflex to do all
      four steps without dropping one, since a real interview question rarely
      stops after just the first.

      The same four-step chain applies unchanged to three-way lines, totals,
      and prop bets — anywhere a book prices a full set of mutually exclusive
      outcomes.
    worked: >
      A moneyline quotes a favorite at American $-150$ and an underdog at
      $+130$. Decimal: $-150$ gives $d = 1 + 100/150 \approx 1.667$, implied
      $p \approx 0.600$; $+130$ gives $d = 1 + 130/100 = 2.30$, implied
      $p \approx 0.4348$. The sum is about $1.0348$, a $3.5\%$ overround.
      Dividing by $1.0348$: the favorite's fair probability is about
      $58.0\%$ and the underdog's about $42.0\%$.
    interview: >
      Handed a raw moneyline, the expectation is the full pipeline stated out
      loud — convert, invert, sum, divide — ending in an actual fair
      probability for each side, not just the overround percentage.
    pitfalls: >
      Rounding aggressively at an intermediate step compounds by the final
      division — carry a few extra digits of precision through decimal and
      implied probability before dividing by $S$. Swapping which raw American
      number is the favorite when both are given unlabeled is an easy
      sign-reading error to make under time pressure.
    recap: >
      Convert both sides to decimal, invert, sum for the overround, divide by
      that sum — the standard four-step read of any moneyline.
    dialogue:
      - part: Two unlabelled numbers
        teach: >
          A boxing moneyline flashes up on your screen with the names cut
          off: one fighter at American $-270$, the other at $+220$. An
          interviewer asks for each fighter's fair chance of winning.
      - ask: >
          Which number belongs to the favourite?
        choices:
          - text: >
              $+220$: it is the bigger number.
            feedback: >
              Size is not the test. $+220$ means risk $100$ to profit $220$,
              a payout only an outsider earns. Read the sign before the
              digits.
          - text: >
              You cannot tell without the payout table.
            feedback: >
              The sign is the payout table. A minus sign means you risk more
              than you win, and only a favourite is priced that way.
          - text: >
              $-270$: you must risk $270$ to win $100$.
            correct: true
            feedback: >
              Right. Risking more to win less is the favourite's deal, so the
              minus side is the favourite whatever the digits say.
        feedback: >
          Negative is the favourite, positive the underdog. Swap them and
          every number downstream lands on the wrong fighter.
      - ask: >
          What probability does the favourite's $-270$ imply? Give it to
          four decimal places.
        expects: "0.7297"
        tolerance: 0.0005
        hint: >
          Convert to decimal first: $d = 1 + 100/|A|$. Then flip.
        feedback: >
          $d = 1 + 100/270 = 370/270 \approx 1.3704$, so $p = 270/370
          \approx 0.7297$. For a negative quote the shortcut is
          $|A|/(|A| + 100)$: the stake over the total returned.
      - ask: >
          What probability does the underdog's $+220$ imply?
        expects: "0.3125"
        hint: >
          Positive American: $d = 1 + A/100$.
        feedback: >
          $d = 1 + 220/100 = 3.20$, so $p = 1/3.20 = 0.3125$. For a positive
          quote the shortcut is $100/(A + 100)$.

      - part: Finding the margin
        ask: >
          What is the overround on this moneyline? Give it as a decimal.
        expects: "0.0422"
        tolerance: 0.0005
        hint: >
          Add the two implied probabilities and subtract $1$.
        feedback: >
          $0.7297 + 0.3125 = 1.0422$, so the overround is about $0.0422$, or
          $4.2\%$. Keep $S \approx 1.0422$; the next step divides by it.
      - ask: >
          A colleague skips that step: "The favourite implies $72.97\%$, so
          the underdog's fair chance is whatever is left, $27.03\%$." What
          is wrong with that?
        choices:
          - text: >
              Nothing: two outcomes, so the fair chances must add to $1$,
              and they do.
            feedback: >
              They add to $1$, but so would infinitely many other pairs. This
              one takes the favourite's price at face value, so the whole
              $4.2\%$ margin is charged to the underdog, which then comes
              out below even its own price's demand of $31.25\%$.
          - text: >
              It loads the entire margin onto the underdog and treats the
              favourite's price as if it carried none.
            correct: true
            feedback: >
              Right. Both prices carry margin. Taking one at face value and
              the other as the remainder puts all of it on one side; the
              mirror-image error, $1 - 0.3125 = 68.75\%$ for the favourite,
              puts it all on the other.
          - text: >
              It should use the underdog's price instead: $1 - 0.3125 =
              68.75\%$ for the favourite is the fair split.
            feedback: >
              Same mistake from the other end: now the underdog's price is
              taken at face value and the favourite absorbs all the margin.
              Neither price is margin-free.
        feedback: >
          The complement shortcut only works on a zero-margin book. With an
          overround, both sides have to give some back.
      - reflect: >
          Before you divide: proportional de-vigging will shrink both
          numbers. Which fighter's probability drops by more percentage
          points, and why?
        answer: >
          The favourite's. Dividing by $S$ takes the same *fraction* of each
          side, $1 - 1/S \approx 4.05\%$ of it. A fraction of $72.97$ is
          bigger than the same fraction of $31.25$, so the favourite gives
          back about $3.0$ points and the underdog about $1.3$. In
          proportional de-vigging the bigger the implied probability, the
          bigger its share of the margin.

      - part: The fair line
        ask: >
          What is the favourite's fair probability once the margin is
          removed? Four decimal places.
        expects: "0.7002"
        tolerance: 0.0005
        hint: >
          Divide $0.7297$ by $S \approx 1.0422$, and carry the extra digits.
        feedback: >
          $0.72973/1.04223 \approx 0.7002$. Rounding early costs you here:
          $0.73/1.04$ gives $0.7019$, off in the second decimal place.
      - ask: >
          And the underdog's fair probability?
        expects: "0.2998"
        tolerance: 0.0005
        hint: >
          Divide $0.3125$ by the same $S$, then check the two add to $1$.
        feedback: >
          $0.3125/1.04223 \approx 0.2998$, and $0.7002 + 0.2998 = 1$. The
          favourite gave back about $3.0$ points and the underdog about
          $1.3$, as the proportional method predicts.
      - ask: >
          Your own model gives the underdog a $33\%$ chance. By how many
          percentage points does your view exceed the market's fair
          estimate?
        expects: "3.02"
        tolerance: 0.05
        hint: >
          Compare against the de-vigged number, not the raw $31.25\%$.
        feedback: >
          $33 - 29.98 \approx 3.02$ points. Against the raw $31.25\%$ you
          would have measured only $1.75$, because the raw number has the
          margin folded into the market's view.
      - teach: >
          Said aloud, the whole read takes one breath: "Minus $270$ is $270$
          over $370$, $73.0\%$; plus $220$ is $100$ over $320$, $31.3\%$;
          that's $104.2\%$, so about four points of vig; divide through and
          it's $70$–$30$."

  - node: quant-games.betting-markets.bet-ev
    hook: >
      "Would you actually bet it" is the question every de-vigging exercise
      is building toward, and this is the one number that answers it.
    explanation: >
      Treat a bet as a payoff you already know how to value: staking $1$ at
      decimal odds $d$ returns $d - 1$ profit with probability $p$ (your own
      estimate) and loses the stake with probability $1-p$. Its expected
      profit per unit is $p(d-1) + (1-p)(-1) = pd - 1$ — the same expectation
      machinery applied to a two-outcome payoff, just written out.

      A positive result only requires your $p$ to exceed what the price
      implies; it says nothing about how confident you should be in $p$ or
      how much variance the bet carries, so a small positive edge on a
      long-shot price can still be a poor bet once size and uncertainty in
      your own estimate are considered.

      What you compare $p$ against matters. The bar a bet has to clear is the
      raw implied probability $1/d$ of the price you are paid at, since
      $pd - 1 > 0$ exactly when $p > 1/d$. The de-vigged fair probability
      answers a different question — how far your view sits from the
      market's — and it sits below $1/d$ by the bookmaker's margin, so a $p$
      that beats the fair number but not the raw one disagrees with the
      market and still loses money. Counting that gap as edge credits the
      bookmaker's margin to you, when it is just the price of taking the bet
      at all.
    worked: >
      You estimate a $35\%$ chance for an outcome priced at decimal $3.20$
      (implied about $31.25\%$). Edge is
      $\text{EV} = 0.35 \times 3.20 - 1 = 0.12$, a $12\%$ expected profit per
      unit staked — computed from the actual price paid, $3.20$.
    interview: >
      "You think it's a $35\%$ chance, the market's offering this price, is
      it a good bet" wants the formula applied on the spot, ending in a
      signed number, not a qualitative yes or no.
    pitfalls: >
      Using the de-vigged fair probability as the bar to clear, instead of
      the raw implied probability of the price actually offered, overstates
      how much genuine edge exists.
      Treating any positive EV as equally worth taking ignores that the same
      formula says nothing about variance or how reliable $p$ itself is.
    recap: >
      Edge is $p \cdot d - 1$ — your probability against the price you're
      actually paid at, positive exactly when $p$ clears the raw implied
      $1/d$, not merely the de-vigged fair price.
    dialogue:
      - part: A hundred bets, counted slowly
        teach: >
          You rate a horse a $40\%$ chance to win. A book offers decimal
          $2.80$ on it. Picture staking $1$ on this exact bet in $100$
          identical races, the horse winning in $40$ of them.
      - ask: >
          What is your total profit over the $100$ races?
        expects: "12"
        hint: >
          Count what comes back from the $40$ wins, then subtract everything
          you staked.
        feedback: >
          The $40$ wins return $40 \times 2.80 = 112$ against $100$ staked, a
          profit of $12$: on average $0.12$ per unit staked.
      - ask: >
          A second book offers only decimal $2.40$ on the same horse. Using
          the same count, what is your average profit per unit staked?
          Give the sign.
        expects: "-0.04"
        hint: >
          $40$ wins at $2.40$ each, against $100$ staked, then divide by
          $100$.
        feedback: >
          $40 \times 2.40 = 96$ comes back on $100$ staked: a loss of $4$, or
          $-0.04$ per unit.
      - ask: >
          A colleague shortcuts the second case: "The price implies
          $1/2.40 = 41.7\%$, I say $40\%$, so I'm $1.7$ points short: the
          bet loses $0.017$ per unit." Where does that go wrong?
        choices:
          - text: >
              It doesn't: the probability gap is the expected loss per unit.
            feedback: >
              The count says $-0.04$, not $-0.017$. A gap in probability is
              not yet money: each extra win or loss is worth a full payout,
              not one unit.
          - text: >
              The sign is right but the gap has to be multiplied by the
              price: $2.40 \times (0.40 - 0.4167) = -0.04$.
            correct: true
            feedback: >
              Right. Each point of probability you are short costs a point of
              the $2.40$ return. The gap tells you which way the bet goes,
              and the price tells you how much.
          - text: >
              The implied probability is irrelevant; only the profit per win,
              $1.40$, matters.
            feedback: >
              The profit per win matters, but so does how often it comes,
              and the implied probability is exactly the win rate the price
              needs. Ignore it and a $1\%$ shot at $2.40$ would look as good
              as a $99\%$ one.
        feedback: >
          The probability gap gives the sign of the bet; the size needs the
          payout. You need one formula that carries both.

      - part: The hundred races, in one line
        reflect: >
          You twice counted a hundred bets to get a per-unit average. Write
          the per-unit result for any probability $p$ and decimal price $d$
          without the hundred bets, and say when it is positive.
        hint: >
          Per unit staked: what is your profit when it wins, what when it
          loses, and how often each?
        answer: >
          With probability $p$ you profit $d - 1$; with probability $1 - p$
          you lose the $1$ staked. The average is $p(d - 1) - (1 - p) =
          pd - 1$. Written as $d(p - 1/d)$, it is positive exactly when your
          $p$ beats the implied probability $1/d$, and its size is that gap
          scaled by the price, which is what the colleague left out.
      - teach: >
          That number is the expected value of the bet, its edge per unit
          staked: $\text{EV} = pd - 1$, with $p$ your own probability and $d$
          the decimal price you are actually paid. It is the fair-value
          calculation for a two-outcome payoff. The bet is worth taking in
          expectation exactly when $p > 1/d$, and $\text{EV} = d(p - 1/d)$
          says the same gap is worth more on a longer price.
      - ask: >
          You give an outsider a $22\%$ chance; it is priced at decimal
          $5.00$, implying $20\%$. What is the EV per unit staked?
        expects: "0.1"
        hint: >
          $pd - 1$, or the $2$-point gap times the price.
        feedback: >
          $0.22 \times 5.00 - 1 = 0.10$, or $5.00 \times 0.02 = 0.10$. The
          same $2$ points beaten on a price of $1.25$ would be worth only
          $1.25 \times 0.02 = 0.025$.
      - ask: >
          You give a team a $45\%$ chance, and the book quotes it at American
          $+140$. What is the EV per unit staked?
        expects: "0.08"
        hint: >
          Convert to decimal first.
        feedback: >
          $+140$ is $d = 1 + 140/100 = 2.40$, so $\text{EV} = 0.45 \times
          2.40 - 1 = 0.08$, an $8\%$ expected profit per unit staked.
      - ask: >
          Return to a match priced at $1.60$ on A and $2.40$ on B, where
          de-vigging gave A a fair $60\%$. You rate A at $61\%$, above the
          market's view. Do you back A at $1.60$?
        choices:
          - text: >
              Yes: you rate A above the market's fair estimate, and that
              disagreement is your edge.
            feedback: >
              Disagreeing with the market is not the same as beating the
              price. $\text{EV} = 0.61 \times 1.60 - 1 = -0.024$: your one
              point of disagreement does not cover the $2.5$ points of
              margin the price charges on A.
          - text: >
              No: you would need $p > 1/1.60 = 62.5\%$, and $61\%$ gives
              $\text{EV} = 0.61 \times 1.60 - 1 = -0.024$.
            correct: true
            feedback: >
              Right. The fair $60\%$ tells you which way you disagree with
              the market; the raw $62.5\%$ is the bar the bet must clear,
              because $1.60$ is what you are actually paid.
          - text: >
              Only if you de-vig the price too and bet at the fair decimal
              price $1/0.60 \approx 1.67$.
            feedback: >
              You are paid at the price on the board, $1.60$, not at a fair
              price nobody is offering. De-vigging changes your benchmark,
              never your payout.
        feedback: >
          Two numbers, two questions. The de-vigged probability measures your
          disagreement with the market; the raw $1/d$ decides whether the bet
          makes money. Between them sits the margin, and a view that lands
          there is right about the market and still a losing bet.

      - part: Same edge, different bets
        ask: >
          Bet X: you rate an outsider at $2\%$, priced at decimal $55.00$.
          Bet Y: you rate a coin-flip match at $55\%$, priced at decimal
          $2.00$. Both have $\text{EV} = 0.10$ per unit. What does the
          equal EV tell you?
        choices:
          - text: >
              The two bets are interchangeable: same expected profit per
              unit, same bet.
            feedback: >
              Same mean, wildly different spread. X loses $98$ times in $100$
              and pays $54$ once in fifty; Y loses $45$ times in $100$ and
              pays $1$ each time it wins.
          - text: >
              Only the average per unit; it says nothing about how often you
              lose or how much your $2\%$ could be off.
            correct: true
            feedback: >
              Right. EV is a statement about the mean. Variance, and how far
              you trust your own $p$, are separate questions; an estimate of
              $2\%$ that is really $1.5\%$ turns X's edge into
              $0.015 \times 55 - 1 = -0.175$.
          - text: >
              X is better: a long shot that clears its price shows more
              skill.
            feedback: >
              The formula gives both the same $0.10$. A long shot is also
              where a small error in $p$ does the most damage, since every
              point of probability is multiplied by $55$.
        feedback: >
          A positive edge says the bet pays on average. It says nothing about
          the size of the swings, or about the size of your stake.
      - ask: >
          You place bet X, $1$ unit each time, on $20$ independent races
          like it. What is the probability that all $20$ lose? Four decimal
          places.
        expects: "0.6676"
        tolerance: 0.0005
        hint: >
          Each one loses with probability $0.98$.
        feedback: >
          $0.98^{20} \approx 0.6676$. Two times in three, a run of twenty
          positive-EV bets ends with nothing but losses. In an interview, the
          answer to "is it a good bet?" is the signed number first,
          "$+10\%$ per unit", then the caveat about variance and about
          trusting $p$.

  - node: quant-games.betting-markets.ev-bet-worked
    hook: >
      Turning the EV formula into an actual verdict on one specific price is
      the version an interviewer wants said out loud within seconds, number
      included.
    explanation: >
      The decimal odds that go into $\text{EV} = pd - 1$ are always the raw
      price you're actually paid at — never a de-vigged or adjusted number.
      De-vigging answers a different question (what does the market really
      believe, stripped of margin) used only as a benchmark to sanity-check
      that your $p$ genuinely differs from consensus; the payout itself is
      fixed by whatever price is on the board.

      Once the number is computed, the size of it is the point, not just its
      sign. A tiny positive edge and a large one both clear zero, but an
      interviewer asking for "the number" wants the actual percentage stated,
      since that magnitude is what a real sizing decision would be built on.
    worked: >
      You estimate a $30\%$ chance for an outcome priced at decimal $4.00$
      (implied $25\%$). $\text{EV} = 0.30 \times 4.00 - 1 = 0.20$, so the
      answer is a $20\%$ expected profit per unit staked.
    interview: >
      Given a specific probability estimate and a specific price, the ask is
      the exact percentage, computed live — stopping at "yes, it's positive"
      under-answers a question that asked for a number.
    pitfalls: >
      Substituting the de-vigged fair probability in place of the actual
      decimal odds in the formula is a category error — $d$ always comes from
      the price actually offered. Reporting only the sign of the edge instead
      of its magnitude leaves the sizing-relevant information on the table.
    recap: >
      A $30\%$ true probability against $4.00$ decimal odds is a $20\%$ edge,
      computed straight from the price actually paid.
    dialogue:
      - part: One view, one price
        teach: >
          A two-way market prices your side at decimal $2.70$ and the other
          side at $1.48$. Your model gives your side a $42\%$ chance. The
          interviewer asks: "Do you bet it, and what is it worth?"
      - ask: >
          First, the bar. What win rate does a price of $2.70$ demand? Four
          decimal places.
        expects: "0.3704"
        tolerance: 0.0005
        hint: >
          The implied probability of decimal odds $d$ is $1/d$.
        feedback: >
          $1/2.70 \approx 0.3704$. Your $0.42$ clears it by about $5$
          points, so the sign of the bet is settled: positive.
      - ask: >
          Now the number the interviewer actually asked for. What is the
          expected profit per unit staked?
        expects: "0.134"
        tolerance: 0.0005
        hint: >
          $\text{EV} = pd - 1$, with $d$ the price you are paid.
        feedback: >
          $0.42 \times 2.70 - 1 = 1.134 - 1 = 0.134$: a $13.4\%$ expected
          profit per unit staked.

      - part: Which price goes into the formula
        ask: >
          A colleague wants the market's margin-free view first. What is the
          sum $S$ of the two implied probabilities? Four decimal places.
        expects: "1.046"
        tolerance: 0.0005
        hint: >
          $1/2.70 + 1/1.48$.
        feedback: >
          $0.3704 + 0.6757 \approx 1.0460$, an overround of about $4.6\%$.
      - ask: >
          And your side's de-vigged fair probability? Four decimal places.
        expects: "0.3541"
        tolerance: 0.0005
        hint: >
          Divide your side's implied probability by $S$.
        feedback: >
          $0.37037/1.04605 \approx 0.3541$. The market's own view of your
          side is about $35.4\%$; you say $42\%$.
      - ask: >
          The colleague now converts that fair probability back to a price,
          $1/0.3541 \approx 2.824$, and reports
          $\text{EV} = 0.42 \times 2.824 - 1 \approx 0.186$. Which edge is
          right?
        choices:
          - text: >
              $0.186$: the fair price strips out the book's margin, so it is
              the honest one to use.
            feedback: >
              Nobody is offering $2.824$. If the bet wins, the book pays
              $2.70$ per unit, the price on the board, and the expected value
              of what you will actually receive uses that price.
          - text: >
              $0.134$: you are paid at $2.70$, so $2.70$ is the $d$ in
              $pd - 1$.
            correct: true
            feedback: >
              Right. $d$ is always the price actually offered. The extra
              $0.052$ in the colleague's number is the margin, credited to
              you as if you could avoid paying it.
          - text: >
              Somewhere between: average the two prices to $2.76$ and split
              the difference.
            feedback: >
              There is no step in the formula where two prices are blended.
              The payout is fixed by the one price you transact at, $2.70$.
        feedback: >
          The edge comes from the price on the board. The fair probability
          belongs to a different question.
      - reflect: >
          Then what is the de-vigged $35.4\%$ for, if it never enters the EV?
          Say what it tells you here that $0.134$ does not.
        answer: >
          It measures how far your view sits from the market's: $42\%$
          against $35.4\%$, a gap of about $6.6$ points. That is a large
          disagreement with a market whose prices are usually informed, so
          it is a reason to check your model before trusting the $13.4\%$.
          The EV says what the bet is worth if your $p$ is right; the fair
          probability is the benchmark that tells you how bold that $p$ is.

      - part: Saying the number
        ask: >
          A second book offers only $2.55$ on your side. With the same $42\%$,
          what is the EV per unit there?
        expects: "0.071"
        tolerance: 0.0005
        hint: >
          Same formula, new $d$.
        feedback: >
          $0.42 \times 2.55 - 1 = 0.071$. A price $0.15$ shorter costs
          $0.42 \times 0.15 = 0.063$ of edge, almost half of it. The size of
          the number, not just its sign, is what separates the two books.
      - ask: >
          Back at $2.70$, which answer do you give the interviewer?
        choices:
          - text: >
              "Yes, it's positive EV, so I'd bet it."
            feedback: >
              True and under-answered. The question asked for a number, and
              without one there is nothing to compare against the $2.55$
              book or to size a stake from.
          - text: >
              "About $6.6$ points of edge: I say $42$, the market says
              $35.4$."
            feedback: >
              That is the gap to the market's view, a probability, not
              money. The expected profit is $0.134$ per unit, computed from
              the price paid.
          - text: >
              "$0.42$ times $2.70$ is $1.134$, so plus $13.4\%$ per unit.
              The market's fair view is about $35\%$, so I'd check my
              model."
            correct: true
            feedback: >
              The number, how it was computed, and the one caveat that
              matters, in three sentences.
        feedback: >
          Lead with the signed number from the price actually offered, then
          the benchmark. That order is what the question is testing.
      - teach: >
          The $2.55$ book showed what a price is worth to a fixed view: each
          $0.01$ of decimal price adds $p \times 0.01$ of edge per unit. That
          is why bettors shop the same view across books, and why, when two
          books disagree sharply enough on opposite sides, there is a trade
          that needs no view at all: the Dutch book.

  - node: quant-games.betting-markets.dutch-book
    hook: >
      Two books disagreeing enough about the same event is a concrete,
      book-against-book arbitrage — the standard test of whether you can turn
      a probability calculation into an actual trade.
    explanation: >
      Two bookmakers pricing complementary outcomes of the same event are, in
      effect, one combined market. Sum their implied probabilities: if the
      total $S$ comes in below $1$, the two books together are underpricing
      the event, the mirror image of overround, and a riskless profit is
      available regardless of which side wins.

      Sizing each stake proportional to its own implied probability, $T \cdot
      p_i / S$, is what makes the payout equal across outcomes: staking
      $T p_i / S$ at decimal odds $d_i = 1/p_i$ returns $T p_i d_i / S =
      T/S$, since $p_i d_i = 1$ by definition — the same payout, $T/S$, no
      matter which outcome resolves. Total stakes committed sum to exactly
      $T$, since the $p_i/S$ terms are themselves probabilities that add to
      $1$, so the whole bankroll is deployed and the profit is
      $T/S - T = T(1-S)/S$, strictly positive exactly when $S < 1$.

      The mental model: you're not predicting an outcome at all, only
      converting a gap between two books' prices into cash by matching the
      stake to each book's own implied probability.
    worked: >
      Book A offers decimal $1.95$ on outcome X ($p_X \approx 0.5128$); book
      B offers decimal $2.30$ on outcome Y ($p_Y \approx 0.4348$), so
      $S \approx 0.9476$. With $T = 500$: stake about $270.6$ on X and
      $229.4$ on Y; either outcome pays about $527.6$, a guaranteed profit of
      about $27.6$ (roughly $5.5\%$ of bankroll).
    interview: >
      Handed two books' lines on the same event, the ask is to check $S < 1$
      first, then produce the proportional stake split live — the
      interviewer is listening for the sizing formula, not just recognizing
      that an arbitrage exists.
    pitfalls: >
      Splitting the bankroll evenly instead of proportionally to each
      implied probability fails to equalize the payout, leaving one outcome
      more profitable than the other. This only works when the two books'
      outcomes are genuinely complementary and mutually exclusive across the
      same event — near-matching but not identical markets don't actually
      cover each other.
    recap: >
      When two books' implied probabilities sum below $100\%$, sizing stakes
      proportional to each implied probability guarantees the identical
      payout, $T/S$, whichever side wins.
    dialogue:
      - part: Two books, opposite sides
        teach: >
          A tennis match, two players, no draw. Book A offers decimal $2.25$
          on player X. Book B, across the street, offers decimal $2.25$ on
          player Y. You put $100$ on X at A and $100$ on Y at B.
      - ask: >
          What is your profit, whichever player wins?
        expects: "25"
        hint: >
          Exactly one bet pays. You staked $200$ in all.
        feedback: >
          The winning bet returns $100 \times 2.25 = 225$ against $200$
          staked, a profit of $25$ either way. No view on the match was
          needed.
      - ask: >
          Add the implied probabilities of the two prices you took. Four
          decimal places.
        expects: "0.8889"
        tolerance: 0.0005
        hint: >
          $1/2.25$, twice.
        feedback: >
          $2 \times 1/2.25 \approx 0.8889$, below $1$. A single book's prices
          sum above $1$; here two books, each pricing only one side, have
          between them left a gap.

      - part: When the prices differ
        teach: >
          The next day the prices are lopsided: book A offers $3.00$ on X and
          book B offers $1.60$ on Y. You split $200$ evenly again, $100$ on
          each.
      - ask: >
          What is your profit if Y wins? Give the sign.
        expects: "-40"
        hint: >
          Only the $100$ on Y pays, at $1.60$.
        feedback: >
          $100 \times 1.60 = 160$ comes back on $200$ staked: $-40$. If X wins
          instead you collect $300$ and make $+100$. The even split turned a
          riskless trade into a bet on X.
      - ask: >
          So is there still a riskless profit to be had at $3.00$ and $1.60$?
        choices:
          - text: >
              No: the even split loses on Y, so these prices do not allow
              one.
            feedback: >
              The even split is one way to stake, not the only one. Move some
              money from X to Y and the Y outcome improves while the X
              outcome, now $+100$, has room to give.
          - text: >
              Yes, but only by putting all $200$ on X, the bigger price.
            feedback: >
              All on X pays $600$ if X wins and nothing if Y does: that is a
              bet, not an arbitrage. Riskless means every outcome pays more
              than you staked.
          - text: >
              Yes: $1/3.00 + 1/1.60 \approx 0.9583 < 1$, so some split works;
              the even split is just the wrong one.
            correct: true
            feedback: >
              Right. The implied sum is still below $1$, as on the first
              day. What went wrong was the sizing, not the prices.
        feedback: >
          With unequal prices the stakes have to be unequal too. The question
          is how to choose them.
      - reflect: >
          Find the split of $200$ that makes X and Y pay out the same amount.
          Then look at the ratio of your two stakes: what is it, in terms of
          the two prices or their implied probabilities?
        hint: >
          Call the stake on X $s$. Set $3.00s$ equal to $1.60(200 - s)$.
        answer: >
          $3.00s = 1.60(200 - s)$ gives $4.6s = 320$, so $s \approx 69.57$ on
          X and $130.43$ on Y, and either outcome pays about $208.70$. The
          stakes on X and Y stand in the ratio $1.60 : 3.00$, which is
          $0.3333 : 0.625$, the ratio of their implied probabilities. Stake each
          outcome in proportion to its implied probability and every outcome
          pays the same.
      - teach: >
          That is a Dutch book. When the best available prices on every
          outcome of an event imply probabilities $p_i = 1/d_i$ with
          $S = \sum_i p_i < 1$, stake $T p_i / S$ on outcome $i$, out of a
          total $T$. The stakes add to $T$, every outcome pays $T/S > T$, and
          the profit $T/S - T$ is locked in the moment the last bet is
          placed.

      - part: Sizing it by hand
        ask: >
          Same prices, $3.00$ on X and $1.60$ on Y, but now you commit
          $T = 500$. How much goes on X? Two decimal places.
        expects: "173.91"
        tolerance: 0.01
        hint: >
          $T p_X / S$ with $p_X = 1/3$ and $S \approx 0.9583$.
        feedback: >
          $500 \times 0.3333/0.9583 \approx 173.91$ on X, and the other
          $326.09$ on Y: the same $1.60 : 3.00$ ratio as your split of
          $200$, scaled up.
      - ask: >
          What profit do you lock in on the $500$? Two decimal places.
        expects: "21.74"
        tolerance: 0.01
        hint: >
          Every outcome pays $T/S$.
        feedback: >
          $500/0.9583 \approx 521.74$, so the profit is about $21.74$,
          whichever player wins. That is the same $4.3\%$ of the committed
          total as the $8.70$ on $200$: the return $1/S - 1$ depends only on
          the prices.
      - ask: >
          Why does staking $T p_i / S$ on outcome $i$ make every outcome pay
          the same?
        choices:
          - text: >
              Because the stakes add up to $T$.
            feedback: >
              They do, but so does the even split, which paid $300$ or
              $160$. Adding to $T$ fixes what you spend, not what comes
              back.
          - text: >
              Because the return $T p_i/S \times d_i$ is $T/S$, since
              $p_i d_i = 1$ for every outcome.
            correct: true
            feedback: >
              Right. Each stake is scaled by its own implied probability,
              and the price multiplies it by exactly the reciprocal. The
              outcome-specific factor cancels, leaving $T/S$.
          - text: >
              Because $S < 1$ guarantees it.
            feedback: >
              $S < 1$ is what makes the common payout beat $T$. The payouts
              are equal for any $S$; a single book's prices, with $S > 1$,
              would give an equal payout too, just a smaller one.
        feedback: >
          Equal payouts come from $p_i d_i = 1$; profit comes from $S < 1$.
          Two separate facts, and the interview wants both.

      - part: When it is not an arbitrage
        ask: >
          One book prices a match at $1.72$ and $2.15$. You stake $200$ in
          proportion to the implied probabilities anyway. What comes back,
          whichever side wins? Two decimal places.
        expects: "191.11"
        tolerance: 0.01
        hint: >
          The same rule holds: everything pays $T/S$. Find $S$ first.
        feedback: >
          $S = 1/1.72 + 1/2.15 \approx 0.5814 + 0.4651 = 1.0465$, so each
          outcome returns $200/1.0465 \approx 191.11$: a locked-in loss of
          $8.89$. With $S > 1$ the same staking guarantees the book's margin,
          paid by you.
      - ask: >
          Book A offers $3.00$ on "X wins in regulation time" in an ice-hockey
          game; book B offers $1.60$ on "Y wins the game, overtime included".
          Sized as before, is this a Dutch book?
        choices:
          - text: >
              Yes: the prices are the same as before, so $S \approx 0.9583$
              and the profit is locked.
            feedback: >
              The arithmetic is the same; the outcomes are not. If X wins in
              overtime, X has not won in regulation and Y has not won the
              game, so both bets lose.
          - text: >
              No: "X wins in overtime" is covered by neither bet, so there is
              an outcome where you lose everything.
            correct: true
            feedback: >
              Right. A Dutch book needs the outcomes to be mutually exclusive
              and to cover every possibility of one event. Near-matching
              markets leave a gap, and the gap is where the loss lives.
          - text: >
              Yes, as long as both books settle at the same time.
            feedback: >
              Timing is not the issue. The two bets do not cover the event:
              an overtime win for X falls through both.
        feedback: >
          Check $S < 1$, then check that the bets cover every outcome exactly
          once. Said aloud: "Implied sum $0.958$, under one; stake in
          proportion to $1/d$; every outcome pays $T/S$, so about $4.3\%$
          locked, provided the two markets really are complements."

  - node: quant-games.betting-markets.hedging-bets
    hook: >
      Once a bet is already placed and the price has since moved, this is the
      mechanical move that turns a still-live position into a fixed,
      guaranteed number before the outcome is known.
    explanation: >
      This is a different situation from pricing a fresh bet: you already
      hold a stake $S_0$ at decimal odds $O_0$, committed to a payout of
      $S_0 O_0$ if it wins and $0$ if it loses. A later price $O_1$ on the
      opposite outcome lets you buy your way out of that uncertainty. Setting
      the new stake $H$ so both outcomes pay identically —
      $S_0 O_0 = H O_1$ — gives $H = S_0 O_0 / O_1$, solved directly from the
      one equation that has to hold.

      Once $H$ is placed, your profit is fixed at $S_0 O_0 - (S_0 + H)$
      regardless of which side wins — hedging converts an uncertain payoff
      into a certain one, but nothing about the arithmetic guarantees that
      certain number is positive. Whether it is depends entirely on how
      favorable $O_1$ has become relative to $O_0$ by the time you hedge.

      Read it as buying insurance on a position you already hold, priced at
      whatever the opposing side currently offers — not as betting against
      yourself, since the two stakes were placed at two different prices, at
      two different times, on two mutually exclusive results of the same
      event.
    worked: >
      $200$ staked at decimal $2.20$ (payout $440$ if it wins). The opposing
      outcome later trades at decimal $2.05$, so
      $H = 200 \times 2.20 / 2.05 \approx 214.63$. Either way the payout is
      $440$, against total stakes of about $414.63$, locking a guaranteed
      profit of about $25.37$ (roughly $6.1\%$ of the total committed).
    interview: >
      "You've got a live bet and the price has since moved — do you hedge,
      and for how much" wants the $H$ formula solved live, plus a comment on
      whether the resulting locked number is actually worth taking.
    pitfalls: >
      Computing $H$ from the hedge-side odds alone, without keeping the
      original payout $S_0 O_0$ fixed as the target, solves the wrong
      equation. Assuming a hedge is automatically profitable is wrong too — if
      $O_1$ hasn't moved favorably enough, the locked-in result can be a
      smaller guaranteed loss rather than a profit, sometimes still worth
      taking purely to remove variance.
    recap: >
      Stake $H = S_0 O_0 / O_1$ on the opposite outcome at today's price to
      equalize the payout, turning an open bet into a fixed, known result.
    dialogue:
      - part: A ticket worth a lot or nothing
        teach: >
          Before the season you staked $50$ on a team to win the title at
          decimal $6.00$. They have reached the final, and the bookmakers now
          offer their opponent at decimal $1.25$. Your ticket is still a
          bet.
      - ask: >
          If you do nothing and your team wins, what is your profit?
        expects: "250"
        hint: >
          The ticket returns $50 \times 6.00$, stake included.
        feedback: >
          $50 \times 6.00 = 300$ comes back on $50$ staked, a profit of
          $250$. If the opponent wins, you lose the $50$. A swing of $300$
          rides on one match.
      - ask: >
          A friend suggests hedging with the same $50$ on the opponent at
          $1.25$. What is your total profit if the opponent wins? Give the
          sign.
        expects: "-37.5"
        hint: >
          The hedge returns $50 \times 1.25$; you have now staked $100$ in
          all.
        feedback: >
          The hedge returns $62.50$ against $100$ staked: $-37.50$. If your
          team wins you collect $300$ and make $+200$. Matching the stake did
          not match anything that matters.
      - ask: >
          Another friend stakes just enough on the opponent to get every
          penny back if the opponent wins: $200$, since $200 \times 1.25 =
          250 = 50 + 200$. Is the result now locked in?
        choices:
          - text: >
              Yes: you can no longer lose money.
            feedback: >
              Unable to lose is not the same as locked. If your team wins you
              collect $300$ on $250$ staked, $+50$; if the opponent wins,
              $0$. The result still depends on the match.
          - text: >
              No: it pays $+50$ or $0$, so the outcome still decides what you
              make.
            correct: true
            feedback: >
              Right. This is a partial hedge: it removes the downside but
              keeps a bet on your team. A full hedge makes both branches
              identical.
          - text: >
              No: any hedge at $1.25$ loses money, since $1.25$ is so short.
            feedback: >
              A short price only means the hedge stake is large. This one
              never loses; whether some hedge locks a profit depends on both
              prices, not on one being short.
        feedback: >
          Two attempts, two leftover bets. Locking the result means choosing
          the hedge so the two branches pay exactly the same.

      - part: The one equation that has to hold
        reflect: >
          Call the hedge stake $H$. Without solving yet, what single
          equation forces both branches to the same profit? Notice what is
          the same in both branches before you write it.
        hint: >
          Whatever happens, you have staked $50 + H$. What differs between
          the branches is only what comes back.
        answer: >
          The total staked, $50 + H$, is paid out of pocket in both
          branches, so equal profits mean equal payouts: $300$ from the
          ticket if your team wins, $1.25H$ from the hedge if the opponent
          does. The equation is $1.25H = 50 \times 6.00$, and the hedge is
          sized against what the original ticket pays, not against what it
          cost.
      - teach: >
          That is the equalizing hedge. You hold a stake $S_0$ at decimal
          odds $O_0$, so the bet pays $S_0 O_0$ if it wins. With the opposite
          outcome available at $O_1$, stake $H = S_0 O_0 / O_1$ on it; both
          branches then pay $S_0 O_0$, and your profit is fixed at
          $S_0 O_0 - (S_0 + H)$ whatever happens.
      - ask: >
          What hedge stake equalizes your title ticket?
        expects: "240"
        hint: >
          $H = S_0 O_0 / O_1$ with $S_0 = 50$, $O_0 = 6.00$, $O_1 = 1.25$.
        feedback: >
          $H = 50 \times 6.00/1.25 = 300/1.25 = 240$. If the opponent wins,
          $240 \times 1.25 = 300$, the same as the ticket.
      - ask: >
          What profit have you locked in?
        expects: "10"
        hint: >
          Both branches pay $300$. Subtract everything you staked.
        feedback: >
          $300 - (50 + 240) = 10$, whichever team wins. The $250$ you could
          have made is gone, and so is the chance of losing $50$.
      - ask: >
          Why does the hedge equation set payouts equal rather than
          profits?
        choices:
          - text: >
              Because profits cannot be computed until the match is over.
            feedback: >
              Both profits can be computed now, $300 - 290$ either way. The
              point is that setting payouts equal makes them equal.
          - text: >
              Because the total staked is the same in both branches, so equal
              payouts and equal profits are the same condition.
            correct: true
            feedback: >
              Right. Both bets are paid for whatever happens, so the outlay
              $S_0 + H$ subtracts from both branches alike, and only the
              payouts can differ.
          - text: >
              Because only the hedge's payout matters; the original stake is
              already spent.
            feedback: >
              The original stake is spent, but its payout, $300$, is the
              very target the hedge has to match. Drop it and you cannot
              size $H$.
        feedback: >
          The hedge is sized against the original payout $S_0 O_0$. That is
          the number you keep fixed.

      - part: A hedge that locks a loss
        ask: >
          Rewind: suppose instead the opponent had strengthened and were
          offered at $1.15$ when you hedged. What is the locked-in result
          now? Give the sign, to two decimal places.
        expects: "-10.87"
        tolerance: 0.01
        hint: >
          The hedge is $300/1.15$. Both branches still pay $300$.
        feedback: >
          $H = 300/1.15 \approx 260.87$, so the outlay is $50 + 260.87 =
          310.87$ against a payout of $300$: about $-10.87$ either way. The
          hedge still fixed the result; the result is a loss.
      - ask: >
          Is a hedge that locks in a loss of $10.87$ ever worth placing?
        choices:
          - text: >
              Never: a hedge exists to lock a profit, and this one locks a
              loss.
            feedback: >
              A hedge exists to fix the result. Paying $10.87$ to remove a
              swing between $+250$ and $-50$ can be a sensible trade for
              someone who cannot afford the $-50$, or simply wants the
              variance gone.
          - text: >
              It can be: it trades a swing between $+250$ and $-50$ for a
              certain $-10.87$, a price paid to remove the variance.
            correct: true
            feedback: >
              Right. Whether that price is worth paying depends on your
              view of the final and on how much the variance costs you.
              The arithmetic only tells you what the certainty costs.
          - text: >
              Yes, because hedging always improves expected value.
            feedback: >
              Hedging at a bookmaker's price usually costs expected value,
              since the hedge is itself a bet at the book's margin. What it
              buys is certainty.
        feedback: >
          Hedging turns an open bet into a fixed number, and nothing
          guarantees that number is positive.
      - teach: >
          Whether it is depends on both prices together. With $6.00$ and
          $1.25$, $1/6.00 + 1/1.25 \approx 0.967$, below $1$; with $6.00$ and
          $1.15$ it is about $1.036$, above. A fully hedged bet is a Dutch
          book with one leg placed earlier, so the same test decides it. In
          an interview: "Hedge $S_0 O_0 / O_1$; it locks
          $S_0 O_0 - S_0 - H$; positive only if the reciprocals sum under
          one."

  - node: quant-games.betting-markets.line-movement
    hook: >
      "The line moved against me" gets read as bad news by reflex; separating
      why it moved is the actual signal an interviewer is probing for.
    explanation: >
      A bookmaker's price is a function of two things at once: its own
      exposure across the two sides of the bet, and its read on new
      information about the true probability. Heavy one-sided action shortens
      a price for both reasons simultaneously — balancing the book and
      updating the estimate — so a real price genuinely does move when real
      money moves it.

      Not all money carries the same information. "Sharp" money is
      edge-driven and tends to arrive early, closer to a genuine update to
      the fair probability. "Square" money is public, narrative- or
      loyalty-driven volume that tends to push lines in predictable
      directions unrelated to the true chance, which is exactly why sharp
      bettors like to bet before that public volume arrives and moves the
      price against them.

      The practical consequence: a line moving against a bet you've already
      placed is not itself evidence that your original edge was wrong — it
      may simply mean square money pushed an already-fair price further off
      fair. The size of the move tells you nothing on its own; figuring out
      who moved it is the actual read.
    interview: >
      "You bet this side and the line's since moved against you — does that
      change how you feel about your edge" wants reasoning about who likely
      drove the move, not a reflexive "yes, the market disagrees with me
      now."
    pitfalls: >
      Treating any adverse line move as automatic evidence against your
      original edge conflates price movement with new information. Assuming
      all volume is informed — reading a big move as "the market knows
      something" — ignores how much of it is public and narrative-driven
      rather than edge-driven.
    recap: >
      Lines move because money moves them, but only sharp money is genuine
      evidence about the true probability — a move against you is signal or
      noise depending on which kind pushed it.
    dialogue:
      - part: A price that drifted
        teach: >
          On Monday you back team A at decimal $1.95$; your model gives A a
          $53\%$ chance. By Saturday the same book offers A at $2.25$. The
          line has moved against you: anyone backing A today gets a longer
          price than you did.
      - ask: >
          What probability does the book's Saturday price imply for A? Four
          decimal places.
        expects: "0.4444"
        tolerance: 0.0005
        hint: >
          Flip the decimal price.
        feedback: >
          $1/2.25 \approx 0.4444$, down from $1/1.95 \approx 0.5128$ on
          Monday: a drop of nearly $7$ points in what the price demands for
          A.
      - ask: >
          What should the drift do to your $53\%$?
        choices:
          - text: >
              Cut it: the market has moved $7$ points against you, and the
              market knows more than you do.
            feedback: >
              That treats every move as information. A book also moves a
              price simply because too much money landed on one side, and a
              move made only to balance the book says nothing about who
              wins.
          - text: >
              Nothing: lines move for all sorts of reasons, so ignore them.
            feedback: >
              Some moves are information. If the money that moved this line
              came from bettors who are usually right, ignoring it means
              ignoring evidence about A.
          - text: >
              It depends on who bet B heavily enough to move the line, which
              the board alone does not show.
            correct: true
            feedback: >
              Right. The price tells you that money arrived on B, and how
              much the book reacted. It does not tell you whose money it was.
        feedback: >
          A price moves because money moves it. Before updating your view,
          you need to know whose money it was.

      - part: Who moved the line
        ask: >
          Two stories fit the same drift. In the first, a viral clip of B's
          star sends thousands of small bets onto B. In the second, three
          large accounts with long winning records back B within an hour of
          the open. In which story should you lower your $53\%$?
        choices:
          - text: >
              The first: thousands of bettors carry more information than
              three.
            feedback: >
              Thousands of bettors reacting to the same clip are one opinion
              repeated, formed by a highlight rather than by a model. Volume
              is not the same as information.
          - text: >
              The second: accounts that win over long records are betting on
              something they know or model better than the clip-watchers.
            correct: true
            feedback: >
              Right. Money from bettors with a demonstrated edge is evidence
              about the true probability, and it should move your estimate
              too.
          - text: >
              Both equally: the line moved by the same amount either way.
            feedback: >
              The same move, for different reasons. The book moved the line
              in the first story to balance its exposure, and in the second
              because it believed the bets.
        feedback: >
          The same drift can be signal or noise. What separates them is who
          placed the money.
      - reflect: >
          Why should a book move its price in both stories, and why does
          only one of them say anything about who wins?
        answer: >
          A book moves a price for two reasons at once: to balance its
          exposure, so one result does not ruin it, and to update its own
          estimate when it sees informed money. The flood of clip-driven
          bets triggers only the first reason, so the new price is a
          balanced book, not a better forecast, and may now sit off the
          fair probability. The three winning accounts trigger both, and the
          book is right to treat their bets as evidence.
      - teach: >
          Bettors call the two kinds of money sharp and square. Sharp money
          is edge-driven: it comes from bettors whose bets carry information,
          and it tends to arrive early. Square money is public volume driven
          by narrative, loyalty or a highlight, and it pushes lines in
          predictable directions unrelated to the true chance. A move
          against your bet is evidence against your edge only to the extent
          that sharp money made it.

      - part: Betting before the crowd
        ask: >
          Suppose the first story is true and your $53\%$ stands. What is the
          EV per unit of a new bet on A at Saturday's $2.25$?
        expects: "0.1925"
        tolerance: 0.0005
        hint: >
          $\text{EV} = pd - 1$.
        feedback: >
          $0.53 \times 2.25 - 1 = 0.1925$, against $0.53 \times 1.95 - 1 =
          0.0335$ on Monday's ticket. Square money pushed the price away from
          fair, and the side it pushed away from became the better bet.
      - ask: >
          Sharp bettors tend to bet early, before the public volume arrives.
          Why?
        choices:
          - text: >
              Books charge less margin early in the week.
            feedback: >
              Margin is not the reason. Timing matters because of what other
              people's money will do to the price later.
          - text: >
              Square money arrives late and pushes the price in predictable
              directions; betting first gets the price before that push.
            correct: true
            feedback: >
              Right. If the public is going to back B, the price on B
              shortens later. Taking B early gets the longer price, and
              backing A late collects the drift.
          - text: >
              An early bet is less likely to lose.
            feedback: >
              When you bet does not change who wins. It changes only the
              price you get, which is the whole of the edge in
              $pd - 1$.
        feedback: >
          Edge lives in the price, so sharp bettors want the price before the
          predictable money moves it, and books know it, which is one reason
          they treat early, large action as informed.
      - ask: >
          Back to the board alone: A drifted from $1.95$ to $2.25$, and you
          have no idea who bet. What does the size of the move tell you about
          whether it was sharp or square?
        choices:
          - text: >
              A big move must be sharp: only informed money moves a line that
              far.
            feedback: >
              Enough square volume moves a line just as far. A book
              protecting itself from a flood of public bets can shift a price
              further than a single sharp bet would.
          - text: >
              Nothing on its own: the same move can come from either kind of
              money.
            correct: true
            feedback: >
              Right. Size measures how much the book reacted, not why. The
              source, the timing and who placed the money are the read.
          - text: >
              A big move must be square: sharps bet small to hide their
              edge.
            feedback: >
              Some do, some do not, and the board cannot tell you which. The
              size of a move does not settle where it came from.
        feedback: >
          Asked "the line moved against you, does that change your view?",
          the answer is a question back: who moved it. A move made by sharp
          money is a reason to lower your number. One made by the public may
          be a reason to bet more.
