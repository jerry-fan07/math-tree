unit: quant-finance.greeks
opening: >
  Every option risk report is a Taylor expansion in disguise — delta, gamma,
  theta, vega and rho are just the partial derivatives of the Black–Scholes
  value, and reading them fluently is the daily language of an options desk.
  This unit builds each one in turn, its shape across moneyness and time, then
  turns them into a discipline: delta hedging as a rebalancing process, and the
  gamma-theta bargain that ties every unit of convexity a book owns to a fixed
  rate of decay. It closes with the mental-math shortcuts — 0.4σS√T for an
  at-the-money option and its straddle cousin — that a desk quotes cold.
lessons:
  - node: quant-finance.greeks.greeks-overview
    hook: >
      An interviewer who asks "what is delta, really" before ever mentioning a
      formula is checking that you see it as one partial derivative of a single
      pricing function, not as an isolated number to memorize — get that wrong
      and every later question about hedging a book gets harder.
    explanation: >
      Black–Scholes value is one smooth function of five inputs, and a Greek is
      what you get from freezing four of them and asking how the fifth moves the
      price. That is the whole idea: there is no separate "delta model" or
      "vega model", only one pricing function differentiated in different
      directions. The Greeks you trade off of are computed by first calibrating
      the model — solving for the implied volatility that reproduces the
      market's price — and then reading its other partial derivatives at that
      same point. A Greek is therefore only as trustworthy as the model it came
      from, and it moves the instant the market re-quotes the price and the
      calibration is redone.

      Because differentiation is linear, the Greeks of a book are just the sum
      of the Greeks of its legs — a call's delta plus a put's delta plus a
      share position's delta is the portfolio's delta, no extra machinery
      required. That additivity is what makes a Greek sheet useful at all: a
      desk with a thousand line items reduces its entire spot risk to one
      number.

      Two quoting habits are worth internalizing now because every later Greek
      inherits them: theta is reported per calendar day, so divide the raw
      annual number by 365, and vega is reported per volatility point, so
      divide the raw derivative by 100.
    worked: >
      A book holds three legs on the same underlying: 100 long calls at delta
      0.52 each, 200 short puts at delta -0.30 each, and a bare short position
      of 80 shares. The calls contribute $100(0.52) = 52$. Being short the puts
      flips the sign of their per-option delta: $-200(-0.30) = 60$. The shares
      contribute $-80$ directly, since a share's delta is $1$. Portfolio delta
      is $52 + 60 - 80 = 32$ — the desk is net long the equivalent of 32
      shares, read straight off three very different instruments.
    interview: >
      "Why can you just add deltas across different products" is really
      asking whether you know they are all partial derivatives of the same
      book value, so adding them is ordinary linearity of differentiation.
      Expect a quick check on the quoting conventions too — get the per-day or
      per-point divisor wrong and a stated Greek is off by a factor of 100 or
      365.
    pitfalls: >
      Quoting a Greek without knowing which implied volatility it was computed
      at is quoting a number attached to nothing — it is a model output, not a
      market-observed fact. Forgetting the per-point vega convention overstates
      a position's volatility exposure by a factor of 100 the moment someone
      asks "what's your vega" expecting the per-point number.
    recap: >
      Each Greek is one partial derivative of Black–Scholes evaluated at the
      market's implied volatility, and they sum linearly across a book because
      differentiation itself is linear.
    dialogue:
      - part: One call, three things moved
        teach: >
          A one-year call struck at $64$ on a stock at $64$, with $r = 0$, is
          marked at $6.37$ off an implied volatility of $25\%$. Overnight the
          stock goes to $65$, implied vol goes to $26\%$, and a calendar day
          passes. The morning mark is $7.17$. Your head of desk wants to know
          how much of the $0.80$ came from the stock.
      - ask: >
          Can you answer from the two marks alone?
        choices:
          - text: >
              Yes: the stock rose a point, so the $0.80$ is the stock's.
            feedback: >
              Vol rose a point as well, and a day went by. Both move the price,
              so pinning the whole change on the one input you noticed first
              is a guess, not an attribution.
          - text: >
              Yes: three inputs changed, so each gets a third, about $0.27$.
            feedback: >
              Nothing makes the three pieces equal. One day off a one-year
              option is worth almost nothing, while a vol point on it is worth
              a good deal. An even split is bookkeeping, not measurement.
          - text: >
              No: you need a price with only the stock moved and everything
              else left where it was.
            correct: true
            feedback: >
              Two marks give the total. The split needs prices that never
              traded — the option repriced with one input changed — and only
              the model can produce those.
        feedback: >
          The market shows one price at a time. The model can price any
          combination of inputs, which is what makes an attribution possible.
      - ask: >
          The model prices the call with the stock at $65$ but vol still at
          $25\%$ and still exactly one year left: $6.93$. How much of the
          overnight move belongs to the stock?
        expects: "0.56"
        tolerance: 0.005
        feedback: >
          $6.93 - 6.37 = 0.56$. Moving spot alone, with vol and time frozen,
          isolates the stock's share of the change.
      - ask: >
          Repeat the trick. Vol alone moved to $26\%$ (stock $64$, one year
          left): $6.62$. Time alone moved by one day (stock $64$, vol
          $25\%$): $6.36$. Add the three single-input pieces — spot, vol and
          time. What do they total?
        expects: "0.80"
        tolerance: 0.01
        hint: >
          Each piece is its repriced value minus $6.37$; the time piece is
          negative.
        feedback: >
          $0.56 + (6.62 - 6.37) + (6.36 - 6.37) = 0.56 + 0.25 - 0.01 = 0.80$,
          the whole overnight change. Moved one at a time, the inputs account
          for the move, with only a sliver left over from their interacting.
      - reflect: >
          Each piece came from nudging one input and holding the others
          fixed. Divide each piece by the size of its nudge. What are you
          estimating, and how many such numbers does one option carry?
        answer: >
          A partial derivative of one function, the option value
          $V(S, t; \sigma, r)$: $0.56$ per point of spot estimates
          $\partial V/\partial S$, $0.25$ per vol point estimates
          $\partial V/\partial \sigma$, and the day's $-0.01$ estimates
          $\partial V/\partial t$. There is one first derivative per input
          that can move, plus the curvature in spot. These are the Greeks,
          and they all come from the same pricing function.

      - part: One function, differentiated five ways
        teach: >
          With $V(S, t; \sigma, r)$ the Black–Scholes value, the Greeks are
          delta $\partial V/\partial S$, gamma $\partial^{2} V/\partial S^{2}$,
          theta $\partial V/\partial t$, vega $\partial V/\partial \sigma$ and
          rho $\partial V/\partial r$. There is no delta model and no vega
          model: one function, differentiated in different directions, and
          evaluated at the implied vol that reproduces the market's price.
      - ask: >
          The model's raw vega for this call is $25.33$, the derivative per
          one unit of $\sigma$. You measured about $0.25$ when vol went from
          $25\%$ to $26\%$. Why the factor of $100$?
        choices:
          - text: >
              The model's number is per $100$ options; the desk's is per one.
            feedback: >
              Both numbers are per option. The $100$ comes from how $\sigma$ is
              measured, not from position size.
          - text: >
              A vol point is $0.01$ of $\sigma$, so the move you made was a
              hundredth of a unit.
            correct: true
            feedback: >
              $25\%$ to $26\%$ is $\delta\sigma = 0.01$, and
              $25.33 \times 0.01 = 0.2533$. One unit of $\sigma$ would be a move
              from $25\%$ to $125\%$, which nobody trades.
          - text: >
              Raw vega is in cents and the desk quotes in dollars.
            feedback: >
              Both are in the option's price units. The scale is set by the
              step in $\sigma$: a hundredth of a unit.
        feedback: >
          Desks quote vega per volatility point: the raw derivative divided by
          $100$. For this call, $0.25$ per point.
      - ask: >
          The raw theta is $-3.17$, the derivative per year of calendar time.
          The one-day piece you measured was about $-0.0087$. What divisor
          turns the first into the second?
        expects: "365"
        tolerance: 2
        feedback: >
          $-3.17/365 = -0.0087$. Theta is quoted per calendar day, so the
          divisor is $365$, not the $252$ trading days: the weekend decays the
          option even though nothing trades. Dividing by $252$ would overstate
          the daily bleed by almost half.

      - part: Adding up a book
        ask: >
          On this stock you are long $40$ of these calls at delta $0.55$,
          short $25$ puts at delta $-0.45$ each, and short $12$ shares. What is
          the book's delta, in shares?
        expects: "21.25"
        hint: >
          Each leg is position times per-unit delta, with short positions
          negative. A share has delta $1$.
        feedback: >
          Calls: $40(0.55) = 22$. Short puts: $-25(-0.45) = +11.25$ — selling
          a put leaves you long the stock's direction. Shares: $-12$. Total
          $22 + 11.25 - 12 = 21.25$.
      - ask: >
          What actually licenses adding three different instruments' deltas
          into one number?
        choices:
          - text: >
              All three legs are marked at the same implied vol.
            feedback: >
              The legs could sit at three different vols and the sum would
              still be right. A shared vol is not what makes adding valid.
          - text: >
              Every delta lies between $-1$ and $1$.
            feedback: >
              Bounded or not, the share leg alone has delta $-12$. The size of
              each number has nothing to do with whether they add.
          - text: >
              The book's value is the sum of the legs' values, and the
              derivative of a sum is the sum of the derivatives.
            correct: true
            feedback: >
              Linearity of differentiation is the whole argument, and it works
              for every Greek: a thousand-line book has one delta, one vega,
              one theta.
        feedback: >
          Greeks add across a book because differentiation is linear. That is
          what lets a desk summarize its spot risk in one number.

      - part: A number with a model attached
        ask: >
          A junior on the desk thinks the stock will realize $20\%$ vol and
          recomputes the call's delta at $20\%$, getting $0.54$ instead of
          $0.55$. The market still quotes the call at $25\%$ implied. Which
          delta goes on the risk report?
        choices:
          - text: >
              $0.55$: Greeks are read off the model at the vol that reproduces
              the market price.
            correct: true
            feedback: >
              Calibrate first, then differentiate. A forecast of realized vol
              is a trading view, and it belongs somewhere other than the
              Greeks.
          - text: >
              $0.54$: it uses the better forecast of what the stock will do.
            feedback: >
              The book is marked at the market's price, and the risk report
              must describe that mark. A delta at $20\%$ is the slope of a
              price nobody is quoting.
          - text: >
              It makes no difference: delta does not depend on vol.
            feedback: >
              $\sigma$ sits inside $d_1$. At $25\%$ the call's $d_1$ is
              $0.125$ and its delta $0.55$; at $20\%$, $d_1 = 0.10$ and the
              delta is $0.54$.
        feedback: >
          A Greek is a model output, computed at the implied vol, and it moves
          the moment the market requotes the price. Quote one without its vol
          and you have quoted a number attached to nothing.

  - node: quant-finance.greeks.delta
    hook: >
      Delta is the first number a market maker asks for after pricing a trade
      because it is not an abstract sensitivity — it is literally the share
      order that goes to the hedge desk next.
    explanation: >
      Think of delta as answering one operational question: how many shares,
      right now, replicate the option's next small move. That reading is what
      makes it tradeable rather than merely descriptive — a market maker who
      sells a call does not sit exposed to spot, they immediately buy delta
      shares and are flat to first order.

      The bound between 0 and 1 for a call is not a coincidence of the formula;
      an option can never be worth more, per unit of spot move, than the stock
      itself, since a call is a capped, optional claim on the stock's upside. A
      put's delta lives in the mirror range, negative because owning a put pays
      off when spot falls.

      The S-curve shape across moneyness reflects how "optional" the claim
      still is: deep out of the money, a small move in spot barely changes the
      odds of ever mattering, so delta sits near zero; deep in the money, the
      option already behaves like owning the stock outright, so delta
      approaches one. Near expiry that curve steepens into almost a step
      function at the strike, because there is no time left for anything to
      change the outcome; far from expiry it flattens, since a lot can still
      happen before the option's fate is decided.
    worked: >
      Take a fresh instance: $S = K = 50$, $\sigma = 30\%$, $T = 1$, $r = 0$.
      Then $d_1 = [\ln(S/K) + (\sigma^{2}/2)T]/(\sigma\sqrt{T}) = 0.15$, so
      $\Delta_C = N(0.15) = 0.56$. On a 100-lot of these calls, the hedge is to
      short $56$ shares — not a rounded guess, the exact number the formula
      hands you.
    interview: >
      "What's your delta on this position" expects the number and the trade in
      the same breath — value, then share count. A common follow-up asks how
      delta behaves as expiry approaches for a fixed strike near spot, checking
      whether you know the S-curve steepens into a step rather than staying
      put.
    pitfalls: >
      Treating a computed delta as fixed until the next report is the fastest
      way to end up mis-hedged, since it moves with every tick in spot.
      Assuming at-the-money delta is always exactly one-half ignores the
      $(r + \sigma^{2}/2)T$ term in $d_1$, which nudges it slightly above a
      half for any positive rate or vol.
    recap: >
      Delta is the local hedge ratio — the share count that cancels an
      option's first-order spot risk — bounded between 0 and 1 for a call and
      shaped like an S-curve across moneyness.
    dialogue:
      - part: Sell calls, then what
        teach: >
          You have just sold $100$ six-month calls struck at $48$ on a stock
          at $48$, at $30\%$ implied vol and $r = 0$; each is worth $4.055$.
          The model says each would be worth $4.164$ with the stock at $48.20$,
          and $3.947$ with it at $47.80$. You want a small move in either
          direction to cost you nothing.
      - ask: >
          How many shares of the stock should you buy?
        expects: "54"
        tolerance: 0.6
        hint: >
          Find how much one call gains per point of stock, from the two
          nearby prices. Then match the whole position.
        feedback: >
          Per call, $(4.164 - 3.947)/0.40 = 0.54$ per point. You are short
          $100$ calls, so a one-point rise costs you about $54$; owning $54$
          shares earns it back. Down moves cancel the same way.
      - ask: >
          Overnight the stock drops to $44$. Is $54$ shares still the right
          hedge?
        choices:
          - text: >
              Yes: the hedge was set for this option, and the option has not
              changed.
            feedback: >
              The contract has not changed, but its slope in spot has. Reprice
              at $43.9$ and $44.1$ and you get about $0.38$ per point, not
              $0.54$.
          - text: >
              No: the call is cheaper now, so you need more shares to cover
              it.
            feedback: >
              The hedge matches how fast the option's value moves, not its
              level. Further out of the money, a point of stock moves the call
              by less, so you need fewer shares.
          - text: >
              No: further out of the money the call gains less per point, so
              you hold fewer shares.
            correct: true
            feedback: >
              At $44$ the slope is about $0.38$, so the hedge is $38$ shares
              and you sell $16$. A hedge is good for the spot it was set at,
              and only near it.
        feedback: >
          The slope moves as spot moves, so the share count does too. At $54$
          the same call would need about $75$ shares.
      - reflect: >
          At $44$, $48$ and $54$ the slope came out $0.38$, $0.54$ and
          $0.75$. Why must a call's slope in spot always lie between $0$ and
          $1$, and what does it approach far from the strike on either side?
        answer: >
          At expiry the call pays $\max(S_T - K, 0)$, which never falls when
          the stock rises and never rises faster than the stock itself, so the
          value today cannot either: the slope is between $0$ and $1$. Far out
          of the money a point of stock barely changes the chance the option
          ever matters, so the slope is near $0$; far in the money the call
          is the stock less a fixed strike, so the slope is near $1$.

      - part: The slope gets a name
        teach: >
          That slope is delta, $\Delta = \partial V/\partial S$: the change in
          option value per one-point move in spot, and the number of shares
          that replicate the option locally. One long call is hedged by
          shorting $\Delta$ shares. For a European call on a non-dividend
          stock $\Delta_C = N(d_1)$, between $0$ and $1$; for the put
          $\Delta_P = N(d_1) - 1$, between $-1$ and $0$. Your $48$ call has
          $d_1 = 0.106$ and $N(0.106) = 0.542$ — the $0.54$ you measured.
      - ask: >
          A three-month put struck at $36$ on a stock at $36$, vol $40\%$,
          $r = 0$. With $d_1 = [\ln(S/K) + (r + \sigma^{2}/2)T]/(\sigma\sqrt{T})$,
          what is $d_1$?
        expects: "0.1"
        tolerance: 0.001
        hint: >
          $\ln(S/K) = 0$ at the money, and $\sqrt{0.25} = 0.5$.
        feedback: >
          $d_1 = (0.16/2)(0.25)/(0.40 \times 0.5) = 0.02/0.20 = 0.10$.
      - ask: >
          Given $N(0.10) = 0.5398$, what is the put's delta?
        expects: "-0.4602"
        tolerance: 0.0005
        feedback: >
          $\Delta_P = N(d_1) - 1 = 0.5398 - 1 = -0.4602$. Answering $-0.5398$
          uses $-N(d_1)$, which is the wrong reflection of the S-curve; the
          put's delta is the call's delta shifted down by one.
      - ask: >
          You own $30$ of these puts. How many shares do you buy to sit flat?
        expects: "13.8"
        tolerance: 0.1
        hint: >
          Find the position's delta first; then trade shares of the opposite
          sign.
        feedback: >
          The puts carry $30(-0.4602) = -13.8$ shares of delta, so you buy
          $13.8$ shares. Long puts are short the stock's direction, and the
          hedge is a purchase.

      - part: How the curve bends with time
        ask: >
          Two calls struck at $50$ on a stock at $52$, both at $30\%$ vol: one
          has three days left, the other three years. Which delta is closer
          to $1$?
        choices:
          - text: >
              The three-year call: it has more time to finish deeper in the
              money.
            feedback: >
              More time also means more time to fall back below $50$. Its
              delta is about $0.63$ — still a long way from settled.
          - text: >
              The three-day call: two points in the money with three days left
              is nearly decided.
            correct: true
            feedback: >
              Its delta is about $0.93$. Three days of $30\%$ vol is a typical
              move of under a point and a half, so two points in the money is
              close to a sure exercise.
          - text: >
              They are equal: both are two points in the money.
            feedback: >
              Moneyness alone does not fix delta. The same two points are
              decisive with three days left and nearly irrelevant with three
              years.
        feedback: >
          As expiry nears, the S-curve sharpens toward a step at the strike:
          $0$ below, $1$ above. Far from expiry it flattens, because a lot can
          still happen.
      - ask: >
          Your $48$ call sat exactly at the money and still had delta $0.54$,
          not $0.50$. Where does the extra come from?
        choices:
          - text: >
              The $\sigma^{2}T/2$ term puts $d_1$ above zero even when
              $S = K$.
            correct: true
            feedback: >
              With $\ln(S/K) = 0$ and $r = 0$, $d_1 = \sigma\sqrt{T}/2 = 0.106$,
              and $N$ of anything positive exceeds $0.5$. A positive rate would
              push it higher still.
          - text: >
              The call is slightly in the money once you count the premium.
            feedback: >
              Moneyness compares $S$ with $K$, and here $S = K = 48$. The
              premium paid does not enter $d_1$.
          - text: >
              Rounding: delta at the money is exactly $0.5$ in theory.
            feedback: >
              The gap is not rounding. $N(0.106) = 0.542$, and it grows with
              $\sigma\sqrt{T}$: a two-year call at $60\%$ vol has at-the-money
              delta $N(0.42) = 0.66$.
        feedback: >
          At-the-money delta is a little above one half, by an amount that
          grows with $\sigma\sqrt{T}$. Said aloud in an interview: "about
          fifty, a touch over".

  - node: quant-finance.greeks.delta-n-d1
    hook: >
      "Isn't a 30-delta option 30% likely to expire in the money" is one of
      the most reliably planted traps in an options interview, and the
      interviewer is listening for exactly this distinction.
    explanation: >
      The confusion is easy to fall into because the second term of the
      pricing formula genuinely is a probability-weighted payment: it is $K$
      times the risk-neutral chance of exercise. It is tempting to assume the
      first term's coefficient carries the same reading, but it does not — it
      is a probability under a different accounting, one that weights outcomes
      by the stock's own value rather than by a fixed unit of cash. Delta is
      the exercise probability measured in "shares" rather than in dollars,
      which is why it differs from the plain exercise probability by exactly
      the same $\sigma\sqrt{T}$ shift that separates $d_1$ from $d_2$.

      That gap is not a rounding artifact; it scales directly with total
      variance over the option's life. Short-dated, low-volatility options have
      it be small, so the desk shorthand is nearly harmless there — which is
      exactly why the shorthand survives. The moment maturity or volatility
      grows, the two numbers pull apart, and quoting one for the other stops
      being a harmless simplification.
    worked: >
      With $S = K = 50$, $\sigma = 30\%$, $T = 1$, $r = 0$: $\Delta = N(0.15) =
      0.56$, while the true exercise probability is $N(d_2) = N(-0.15) =
      0.44$ — a gap of about $0.12$. Compare that to a short-dated, low-vol
      case with $\sigma\sqrt{T} = 0.10$, where the gap is only about $0.04$: the
      gap roughly triples here because $\sigma\sqrt{T} = 0.30$ is three times
      as large.
    interview: >
      "Is a 30-delta call 30% likely to finish in the money" is answered "no —
      that's $N(d_1)$, the exercise probability is $N(d_2)$, and the two differ
      by $\sigma\sqrt{T}$." A sharper follow-up asks for which kind of option
      the two are nearly interchangeable, and the answer is short-dated,
      low-volatility, near the money.
    pitfalls: >
      Presenting delta as a probability to a risk committee overstates
      precision it does not have twice over — it is the wrong probability
      measure, and even the right measure, $N(d_2)$, is a pricing-model
      probability, not the real-world odds an actual trader would bet on.
    recap: >
      Delta is exactly $N(d_1)$ and only resembles the exercise probability
      $N(d_2)$ — a gap driven by $\sigma\sqrt{T}$ that widens with maturity and
      volatility rather than staying fixed.
    dialogue:
      - part: A 62-delta call and a client
        teach: >
          A two-year call struck at $60$ on a stock at $60$, $45\%$ implied
          vol, $r = 0$, prints a delta of $0.62$. A salesperson tells a client
          the option is "$62\%$ to finish in the money". For this option
          $d_1 = 0.318$ and $d_2 = d_1 - \sigma\sqrt{T} = -0.318$.
      - ask: >
          Given $N(-0.318) = 0.375$, what is the risk-neutral probability that
          the call finishes in the money?
        expects: "0.375"
        tolerance: 0.001
        hint: >
          Recall which term of the Black–Scholes formula carries the chance of
          exercise.
        feedback: >
          The strike term is $Ke^{-rT}N(d_2)$, the strike paid times the
          risk-neutral chance it is paid, so the exercise probability is
          $N(d_2) = 0.375$. The salesperson overstated it by $25$ points.
      - ask: >
          A $25$-point gap on one option. Which reading survives?
        choices:
          - text: >
              The delta is a rough estimate of $N(d_2)$; a better model would
              make the two agree.
            feedback: >
              Both numbers come out of the same model, exactly. A better model
              would move both and leave them apart.
          - text: >
              The salesperson was quoting a real-world probability, which is
              higher because stocks drift up.
            feedback: >
              The $0.62$ came off the delta screen, which knows nothing about
              the stock's drift. No forecast went into it.
          - text: >
              Delta is a different quantity that only sits near $N(d_2)$ when
              something is small.
            correct: true
            feedback: >
              The two are different objects. What the "something" is — and why
              delta comes out as clean as $N(d_1)$ — is the next thing to
              find.
        feedback: >
          Delta is $0.62$ and the exercise probability is $0.375$: two numbers
          from one formula, and the desk shorthand treats them as one.

      - part: Differentiating the formula
        teach: >
          Delta is $\partial C/\partial S$ of $C = SN(d_1) - Ke^{-rT}N(d_2)$,
          and $d_1$ and $d_2$ both depend on $S$. The product and chain rules
          give three terms:
          $N(d_1) + S\varphi(d_1)\,\partial d_1/\partial S
          - Ke^{-rT}\varphi(d_2)\,\partial d_2/\partial S$, with $\varphi$ the
          standard normal density.
      - ask: >
          Why is $\partial d_2/\partial S$ the same as $\partial d_1/\partial S$?
        choices:
          - text: >
              Because at the money $d_2 = -d_1$.
            feedback: >
              That would make the derivatives opposite, not equal, and it only
              holds at one spot level anyway. The claim has to hold at every
              $S$.
          - text: >
              Because $d_2 = d_1 - \sigma\sqrt{T}$, and $\sigma\sqrt{T}$ does
              not involve $S$.
            correct: true
            feedback: >
              The two differ by a constant in $S$, so their slopes in $S$
              agree. Both equal $1/(S\sigma\sqrt{T})$.
          - text: >
              Because $N(d_1)$ and $N(d_2)$ have the same derivative.
            feedback: >
              They do not: one is $\varphi(d_1)$ times the slope, the other
              $\varphi(d_2)$ times it. The equality is between the slopes of
              the arguments, $d_1$ and $d_2$.
        feedback: >
          So delta is $N(d_1) + [S\varphi(d_1) - Ke^{-rT}\varphi(d_2)]\,
          \partial d_1/\partial S$.
      - reflect: >
          The screen says delta is exactly $N(d_1)$, with nothing added. What
          has to be true of the bracket, and why might it be true at every
          spot, not just at the money?
        answer: >
          The bracket must vanish: $S\varphi(d_1) = Ke^{-rT}\varphi(d_2)$ for
          all inputs. It is plausible because $d_2$ is $d_1$ shifted by
          $\sigma\sqrt{T}$, so $\varphi(d_2) = \varphi(d_1)e^{d_1\sigma\sqrt{T}
          - \sigma^{2}T/2}$, and the exponent is exactly $\ln(S/K) + rT$ by the
          definition of $d_1$. That turns $Ke^{-rT}\varphi(d_2)$ into
          $S\varphi(d_1)$: the two extra terms cancel identically.
      - ask: >
          Check it away from the money. Stock at $66$, same $60$ strike,
          $45\%$, two years: $d_1 = 0.468$ and $d_2 = -0.168$, with
          $\varphi(0.468) = 0.3576$ and $\varphi(-0.168) = 0.3933$. Then
          $S\varphi(d_1) = 66(0.3576) = 23.60$. What is $K\varphi(d_2)$?
        expects: "23.6"
        tolerance: 0.02
        feedback: >
          $60(0.3933) = 23.60$. The two extra terms are equal and opposite,
          and the derivative collapses to its leading coefficient.
      - teach: >
          So call delta is exactly $\Delta = N(d_1)$, with
          $d_1 = [\ln(S/K) + (r + \sigma^{2}/2)T]/(\sigma\sqrt{T})$: the extra
          terms from differentiating cancel. The risk-neutral probability of
          finishing in the money is $N(d_2)$, with $d_2 = d_1 - \sigma\sqrt{T}$,
          which is strictly smaller. The "something small" is $\sigma\sqrt{T}$,
          the shift between the two arguments.

      - part: When the shorthand is harmless
        ask: >
          A one-month at-the-money call at $15\%$ vol: $N(d_1) = 0.5087$ and
          $N(d_2) = 0.4913$. How far does delta overstate the exercise
          probability?
        expects: "0.0174"
        tolerance: 0.0005
        feedback: >
          $0.5087 - 0.4913 = 0.0174$, under two points, because
          $\sigma\sqrt{T} = 0.15\sqrt{1/12} = 0.043$. Compare $25$ points on
          the two-year $45\%$ call, where $\sigma\sqrt{T} = 0.64$.
      - ask: >
          Which of these at-the-money calls has the widest gap between delta
          and exercise probability?
        choices:
          - text: >
              One week, $20\%$ vol
            feedback: >
              $\sigma\sqrt{T} = 0.20\sqrt{1/52} = 0.028$: almost no gap. This is
              where the shorthand is nearly harmless.
          - text: >
              Two years, $15\%$ vol
            feedback: >
              $\sigma\sqrt{T} = 0.15\sqrt{2} = 0.21$. Long-dated, but the low
              vol keeps the shift moderate.
          - text: >
              One year, $60\%$ vol
            correct: true
            feedback: >
              $\sigma\sqrt{T} = 0.60$, the largest of the four, so $d_1$ and
              $d_2$ sit furthest apart: $N(0.30) = 0.62$ against
              $N(-0.30) = 0.38$.
          - text: >
              One year, $20\%$ vol
            feedback: >
              $\sigma\sqrt{T} = 0.20$, about a third of the widest. Time and
              vol enter only through their combination.
        feedback: >
          The gap is governed by $\sigma\sqrt{T}$ alone: time and vol trade
          off against each other, and either can open it.
      - ask: >
          Delta always exceeds the exercise probability. Which explanation
          holds up?
        choices:
          - text: >
              Delta includes the option's time value; $N(d_2)$ does not.
            feedback: >
              Both are numbers between $0$ and $1$ read off the same
              terminal distribution. Time value is a price, and neither of
              these is a price.
          - text: >
              Delta also counts how deep the option finishes: it weights each
              in-the-money outcome by the stock received, so high finishes
              count for more.
            correct: true
            feedback: >
              $N(d_2)$ asks only whether $S_T > K$. $N(d_1)$ is the same event
              weighted by the stock's own value, which leans toward the high
              outcomes and so comes out bigger.
          - text: >
              Delta uses the stock's real drift; $N(d_2)$ uses the rate $r$.
            feedback: >
              Neither uses the real drift. Both come from the pricing formula,
              which runs on $r$ alone.
        feedback: >
          Exercise probability counts outcomes; delta weights them by what you
          receive. That is the shift from $d_2$ to $d_1$.

      - part: A third probability
        ask: >
          The client is sure the stock drifts up $12\%$ a year. Is $0.375$ the
          chance he should bet on the call finishing in the money?
        choices:
          - text: >
              Yes: $N(d_2)$ is the probability of exercise.
            feedback: >
              It is the probability under the pricing measure, where the stock
              grows at $r$. A trader betting on real outcomes needs the
              stock's real drift.
          - text: >
              No: the real chance is the delta, $0.62$.
            feedback: >
              Delta is a hedge ratio and contains no drift at all. It is not
              the real-world probability either.
          - text: >
              No: the real-world probability runs off the true drift, not $r$,
              and differs again.
            correct: true
            feedback: >
              With a $12\%$ drift the real chance is higher than $0.375$.
              Three numbers, three meanings: hedge ratio, pricing
              probability, real odds.
        feedback: >
          In an interview, the ten-second answer: "No — delta is $N(d_1)$, the
          exercise probability is $N(d_2)$, and they differ by $\sigma\sqrt{T}$
          in the argument; even $N(d_2)$ is risk-neutral, not real-world."

  - node: quant-finance.greeks.put-call-delta
    hook: >
      Handed an inconsistent set of quoted Greeks, the fastest way to catch it
      — faster than re-pricing anything — is to check these four relations,
      which is exactly why interviewers ask for them cold.
    explanation: >
      Any identity that holds for every value of the inputs can be
      differentiated in each input and still hold — that single fact is the
      whole derivation, and it is a technique worth having beyond options.
      Recall put–call parity: a long call and short put at the same strike and
      expiry replicate a forward contract, long the stock and short the
      discounted strike.

      A forward has trivial Greeks of its own: delta one, and flat in every
      other direction, since its value is linear in spot and does not depend
      on volatility at all. That is the mental shortcut behind three of the
      four relations. Because the call-minus-put position is exactly a
      forward, whatever curvature or volatility sensitivity the call carries,
      the put must carry identically, since the forward contributes none —
      hence equal gamma and equal vega. Delta differs by exactly one, the
      forward's own delta.

      Rho and theta are the exceptions, and the reason is the same forward:
      it still depends on the discounted strike $Ke^{-rT}$, which does move
      with both rate and time, so those two Greeks differ by precisely the
      derivative of that discount factor rather than lining up exactly.
    worked: >
      Using $S = K = 50$, $\sigma = 30\%$, $T = 1$, $r = 0$: $\Delta_C = 0.56$,
      $\Delta_P = -0.44$, difference exactly $1$. $\Gamma_C = \Gamma_P = 0.026$
      and $\operatorname{Vega}_C = \operatorname{Vega}_P = 19.72$, identical as
      predicted. $\rho_C = 22.02$ and $\rho_P = -27.98$, a difference of
      $50.00$, matching $KT = 50 \times 1$ exactly since $r = 0$. And
      $\Theta_C = \Theta_P$ here, since the $r = 0$ special case removes the
      gap entirely.
    interview: >
      "A call has delta 0.6 — what's the put's delta at the same strike and
      expiry" wants "-0.4" instantly, from the parity relation, not a fresh
      calculation. A related favorite: "why do a call and put share gamma" —
      because their difference is a forward, which has none.
    pitfalls: >
      Adding instead of subtracting one when converting between call and put
      delta flips the sign of the whole answer. Assuming vega also differs
      between call and put, the way rho does, confuses the two — vega is
      identical, rho is not, because only the discounted strike carries rate
      sensitivity.
    recap: >
      Differentiate the parity identity $C - P = S - Ke^{-rT}$ in each input
      and every call-put Greek relation falls out for free — the fastest
      consistency check on a quoted Greek sheet.
    dialogue:
      - part: A pair you have met before
        teach: >
          A stock at $50$, no dividends, $r = 3\%$. You buy the six-month
          European call struck at $52$ and sell the six-month European put at
          the same strike. The call's delta is $0.491$. Nobody has told you the
          put's.
      - ask: >
          What is the delta of the pair, long call and short put together?
        expects: "1"
        hint: >
          What does a long call and a short put at one strike and expiry
          replicate?
        feedback: >
          Put–call parity: $C - P = S - Ke^{-rT}$. The pair is the stock less a
          fixed discounted strike, so it moves one-for-one with the stock.
          Its delta is $1$, whatever the call's delta happens to be.
      - ask: >
          So what is the put's delta?
        expects: "-0.509"
        tolerance: 0.001
        feedback: >
          $\Delta_C - \Delta_P = 1$, so $\Delta_P = 0.491 - 1 = -0.509$. Adding
          the one instead, $0.491 + 1$, would give the put a delta above $1$:
          a put that gains more than a share when the stock rises, which no
          put does.
      - ask: >
          The call's gamma is $0.0403$. What is the put's?
        choices:
          - text: >
              $-0.0403$: the put's delta has the opposite sign, so its gamma
              does too.
            feedback: >
              The put's delta is negative, but it *rises* with spot, from
              $-1$ deep in the money toward $0$, just as the call's rises from
              $0$ to $1$. A rising delta is a positive gamma.
          - text: >
              $0.9597$: one minus the call's gamma, like the deltas.
            feedback: >
              That carries the delta relation one level too far.
              Differentiating $\Delta_C - \Delta_P = 1$ again turns the $1$
              into $0$, not into another $1$.
          - text: >
              $0.0403$, the same.
            correct: true
            feedback: >
              The right side of parity, $S - Ke^{-rT}$, is linear in $S$, so
              its second derivative is zero and $\Gamma_C - \Gamma_P = 0$.
        feedback: >
          Gamma is a property of the strike and expiry, not of call versus
          put. A reported gap between them is an error to chase down.
      - reflect: >
          You differentiated parity in $S$, twice, and trusted the results.
          What made that legitimate, and which other inputs could you
          differentiate it in?
        answer: >
          Parity is an identity: it holds at every spot, every vol, every
          rate and every time for these European contracts, not just at
          today's numbers. An identity in a variable can be differentiated in
          that variable and stay true. So it can be differentiated in
          $\sigma$, $r$ and $t$ too, and each gives a relation between the
          call's Greek and the put's.

      - part: Every input, one identity
        ask: >
          The call's vega is $14.10$. What is the put's vega?
        expects: "14.1"
        tolerance: 0.01
        hint: >
          Look for $\sigma$ on the right side of parity.
        feedback: >
          $\sigma$ does not appear in $S - Ke^{-rT}$, so
          $\operatorname{Vega}_C - \operatorname{Vega}_P = 0$. Assuming vega
          differs between call and put, the way rho does, confuses the two.
      - ask: >
          Now differentiate $S - Ke^{-rT}$ in $r$. With $K = 52$, $T = 0.5$ and
          $e^{-0.015} = 0.9851$, what is $\rho_C - \rho_P$?
        expects: "25.61"
        tolerance: 0.02
        hint: >
          $\partial(-Ke^{-rT})/\partial r = KTe^{-rT}$.
        feedback: >
          $KTe^{-rT} = 52(0.5)(0.9851) = 25.61$. Here $\rho_C = 10.56$ and
          $\rho_P = -15.05$, and $10.56 + 15.05 = 25.61$. Rate enters parity
          only through the discounted strike, so that is all the rhos can
          differ by.
      - teach: >
          Differentiating $C - P = S - Ke^{-rT}$ (European, same strike and
          expiry, no dividends) in each input: $\Delta_C - \Delta_P = 1$;
          $\Gamma_C = \Gamma_P$; $\operatorname{Vega}_C = \operatorname{Vega}_P$;
          $\rho_C - \rho_P = KTe^{-rT}$; and, since theta differentiates in
          calendar time with $T$ the time remaining,
          $\Theta_C - \Theta_P = -rKe^{-rT}$, which vanishes when $r = 0$.
      - ask: >
          The call's theta is $-4.58$ per year, and $rKe^{-rT} = 1.54$. What is
          the put's theta?
        expects: "-3.04"
        tolerance: 0.015
        hint: >
          Solve $\Theta_C - \Theta_P = -rKe^{-rT}$ for $\Theta_P$.
        feedback: >
          $\Theta_P = \Theta_C + rKe^{-rT} = -4.58 + 1.54 = -3.04$. The put
          decays more slowly here because, as time passes, the strike its
          holder may receive is discounted less.

      - part: Where the identity stops
        ask: >
          A screen shows the six-month $52$ call with gamma $0.0403$ and the
          three-month $52$ put with gamma $0.0563$. Is something wrong?
        choices:
          - text: >
              No: the two expire at different times, so parity says nothing
              about them.
            correct: true
            feedback: >
              Different expiries carry different gammas. The relations hold
              only inside a matched pair.
          - text: >
              Yes: at one strike, call and put gamma must match.
            feedback: >
              Parity ties a call and a put with the same strike *and* the same
              expiry. These two expire three months apart, so no identity
              connects them.
          - text: >
              Yes: the longer-dated option should carry more gamma.
            feedback: >
              Whatever the shape across expiries, parity is not what governs
              it. The relation needs one strike and one expiry.
        feedback: >
          Check the hypotheses before applying the check: European, same
          strike, same expiry, no dividends.
      - ask: >
          The same stock also lists American options. Does
          $\Delta_C - \Delta_P = 1$ still hold exactly for the American pair?
        choices:
          - text: >
              Yes: without dividends the American call is worth the same as
              the European one.
            feedback: >
              The call side is fine, but the American put can be worth more
              than the European put, since exercising it early to collect the
              strike can pay. Parity becomes an inequality, and an inequality
              cannot be differentiated into an equality.
          - text: >
              No: early exercise turns parity into an inequality, so the
              derived relations go with it.
            correct: true
            feedback: >
              The Greek relations are only as exact as the identity they come
              from. For American puts they hold approximately at best.
          - text: >
              Yes: delta is the same concept for any option.
            feedback: >
              The concept is the same; the identity linking the two contracts
              is not. Without exact parity there is no exact relation.
        feedback: >
          No identity, no differentiated identity.
      - ask: >
          A quote sheet for a European call and put, same strike and expiry,
          no dividends, shows call delta $0.62$ and put delta $-0.42$. What do
          you say?
        choices:
          - text: >
              Fine: the vol smile can make the deltas disagree.
            feedback: >
              Both options sit at the same strike and expiry, so a smile in
              strike has nothing to separate them. Parity is model-free.
          - text: >
              Fine: with positive rates the gap can exceed $1$.
            feedback: >
              Rates enter parity through $Ke^{-rT}$, which has no $S$ in it.
              They shift the rhos and thetas, never the delta gap.
          - text: >
              Inconsistent: $0.62 + 0.42 = 1.04$, and the gap must be exactly
              $1$.
            correct: true
            feedback: >
              Long the call and short the put is a forward, delta $1$. A sheet
              that says $1.04$ has a stale or mismatched number in it.
        feedback: >
          Said aloud: "call delta minus put delta is one, gammas and vegas are
          equal, thetas and rhos differ by the carry on the strike." The
          fastest consistency check on a Greek sheet.

  - node: quant-finance.greeks.gamma
    hook: >
      Ask a market maker what a "gamma of 0.03" means to them, and the answer
      is never the second-derivative definition — it is how fast their hedge
      is about to go stale.
    explanation: >
      Gamma is delta's own rate of change, and reading it that way turns it
      from a curvature abstraction into an operational fact: a big gamma means
      your last hedge trade is already wrong and getting more wrong by the
      tick. That is why gamma is a genuine cost center for a desk, not just a
      risk number — it drives how often the hedge has to be touched.

      The sign carries the entire economic content. A long option's value
      curve sits above its own tangent line in spot, so any move away from the
      hedge point — up or down, it does not matter which — leaves the position
      ahead of what the linear delta hedge alone would predict. That is
      convexity paying off in both directions at once, which is the single
      most important fact about owning gamma. A short option has the mirror
      shape, a curve sitting below its tangent, so any move costs money against
      the hedge regardless of direction.

      Because gamma measures how fast delta itself moves, it is the number
      that tells you how aggressively to rebalance, not merely how risky the
      position looks on a static snapshot.
    worked: >
      With $S = K = 50$, $\sigma = 30\%$, $T = 1$: $\Gamma =
      \varphi(d_1)/(S\sigma\sqrt{T}) = 0.026$. If spot ticks to $51$, delta
      should move by about $\Gamma \times 1 = 0.026$, from $0.56$ toward
      $0.586$ — and the exact recomputed value is $0.5855$, matching the
      linear estimate to three decimals. On a 100-lot, that one-point move
      requires buying roughly $2.6$ more shares to stay flat.
    interview: >
      "What does a gamma of 0.03 actually mean for your hedge" wants the
      translation into shares — delta moves 0.03 per point, so a 100-lot needs
      3 shares traded per point just to stay flat. The interviewer is checking
      you can turn the number into an action, not just recite the formula.
    pitfalls: >
      Thinking gamma only helps on moves in one direction misses the entire
      point of convexity — a long position gains from either an up-move or a
      down-move against its hedge. Comparing raw gamma across two differently
      priced underlyings without any scaling compares numbers that are not on
      the same footing.
    recap: >
      Gamma is the rate delta itself moves — positive for any long option,
      meaning every rebalance edges the hedge back toward flat no matter which
      way spot moved.
    dialogue:
      - part: A hedge that wins both ways
        teach: >
          You own $100$ three-month calls struck at $40$ on a stock at $40$,
          $35\%$ vol, $r = 0$. Each is worth $2.789$ with delta $0.535$, so
          you are short $53.5$ shares and flat. The stock jumps to $42$, where
          each call is worth $3.969$. You have not touched the hedge.
      - ask: >
          What is the P&L of the calls plus the short shares?
        expects: "11"
        tolerance: 0.1
        hint: >
          Price each leg separately: $100$ calls at the new value, and $53.5$
          shares that moved $2$ points against you.
        feedback: >
          Calls: $100(3.969 - 2.789) = 118.0$. Shares: $-53.5(2) = -107.0$.
          Net $+11.0$. A hedge that was flat still made money.
      - ask: >
          Now suppose the stock had fallen to $38$ instead, where each call is
          worth $1.835$. Before computing, what happens to the hedged
          position?
        choices:
          - text: >
              It loses about $11$: the mirror image of the rally.
            feedback: >
              Compute it. The calls lose $100(2.789 - 1.835) = 95.4$ and the
              short shares gain $53.5(2) = 107.0$, so the position makes
              $11.6$. The mirror image is not a loss.
          - text: >
              It makes money again, about as much.
            correct: true
            feedback: >
              The calls lose $95.4$, the shares gain $107.0$: net $+11.6$. On
              the way up the calls gained more than the shares lost; on the way
              down they lost less than the shares gained.
          - text: >
              Nothing: the position was hedged.
            feedback: >
              Hedged at $40$ means flat for a *small* move. A two-point move is
              big enough for the gap between the call and the shares to show,
              here $11.6$ in your favour.
        feedback: >
          Up two points, $+11.0$. Down two points, $+11.6$. The hedge was
          flat at $40$ and you win on a move in either direction.
      - reflect: >
          Your shares trace a straight line through today's call value with
          slope $0.535$. What must the call's value curve look like relative
          to that line for both moves to pay, and what is happening to its
          slope as spot rises?
        answer: >
          The curve must sit above its tangent line on both sides: it is
          convex. Equivalently, its slope rises with spot, so on a rally the
          calls gain faster and faster than $0.535$ per point, and on a drop
          they lose slower and slower. A long call against a delta hedge
          gains on any move, and the size of the gain is set by how fast the
          slope bends.

      - part: How fast the slope moves
        ask: >
          The call's delta is $0.643$ at $42$ and $0.419$ at $38$. About how
          much does delta change per point of spot near $40$?
        expects: "0.056"
        tolerance: 0.002
        feedback: >
          $(0.643 - 0.419)/4 = 0.056$ per point. That number is how fast your
          hedge goes stale.
      - teach: >
          That rate is gamma: $\Gamma = \partial\Delta/\partial S =
          \partial^{2}V/\partial S^{2}$, the change in delta per one-point
          move in spot, and so the curvature of value in spot. A long option
          has $\Gamma > 0$. In Black–Scholes,
          $\Gamma = \varphi(d_1)/(S\sigma\sqrt{T})$, with $\varphi$ the
          standard normal density.
      - ask: >
          For the $40$ call, $d_1 = 0.0875$ and $\varphi(0.0875) = 0.3974$.
          What is $\Gamma$?
        expects: "0.0568"
        tolerance: 0.0005
        hint: >
          The denominator is $S\sigma\sqrt{T} = 40 \times 0.35 \times 0.5$.
        feedback: >
          $S\sigma\sqrt{T} = 7$, so $\Gamma = 0.3974/7 = 0.0568$, in line with
          the $0.056$ you measured from the two deltas.

      - part: Gamma as a share count
        ask: >
          Using $\Gamma = 0.0568$, after the stock rises $2$ points how many
          more shares must the $100$-lot hedge sell to be flat again?
        expects: "11.4"
        tolerance: 0.15
        hint: >
          Delta moves by $\Gamma$ per point, for each of the $100$ calls.
        feedback: >
          $100 \times 0.0568 \times 2 = 11.4$ shares. Repricing exactly gives
          $100(0.643 - 0.535) = 10.8$; the difference is gamma itself drifting
          over a two-point move. For a desk the estimate is the point: gamma
          turns a price move into a trade size.
      - ask: >
          The second-order Taylor term says the hedged position should make
          about $\tfrac{1}{2}\Gamma(\delta S)^{2}$ per call. For the $100$ calls
          and a $2$-point move, what does that give?
        expects: "11.36"
        tolerance: 0.1
        feedback: >
          $100 \times \tfrac{1}{2}(0.0568)(4) = 11.36$, between the $11.0$ and
          $11.6$ you computed by full repricing. The delta term cancelled
          against the shares; what survived is curvature, and it carries
          $(\delta S)^{2}$, which is positive whichever way spot went.

      - part: The other side of the trade
        ask: >
          The dealer who sold you these calls hedged by buying $53.5$ shares.
          What does a two-point move do to the dealer?
        choices:
          - text: >
              It gains on a rally and loses on a drop.
            feedback: >
              That is a directional position, and the dealer's is hedged. The
              surviving term is curvature, which ignores direction.
          - text: >
              Nothing: the dealer is delta-hedged.
            feedback: >
              So were you, and you made $11$ either way. The dealer holds the
              opposite of your position, so the dealer loses that.
          - text: >
              It loses about $11$ whichever way spot goes.
            correct: true
            feedback: >
              Short options mean $\Gamma < 0$: the value curve, seen from the
              dealer's side, sits below its tangent, and any move costs money
              against the hedge.
        feedback: >
          Long gamma gains on a move in either direction against a delta
          hedge; short gamma loses on any move. Quoted to a market maker,
          "gamma $0.057$" means: every point, re-trade $5.7$ shares per $100$
          options, and that trade is the cost or the profit.

  - node: quant-finance.greeks.gamma-profile
    hook: >
      "Where does your pin risk concentrate into expiry" is asking you to
      locate exactly where gamma lives, and the answer is a specific shape, not
      a vague "near the strike."
    explanation: >
      Gamma vanishes wherever delta has stopped moving. Deep in or out of the
      money, delta is already pinned near one or zero, so there is no more
      curvature left to have — the option has effectively resolved into either
      "the stock" or "nothing," and small spot moves change neither view.
      Gamma is only large where the outcome is still genuinely undecided, which
      is precisely at the strike.

      The $1/\sqrt{T}$ blow-up into expiry is the same undecidedness argument
      run against a shrinking clock. As $T\to 0$, the remaining uncertainty
      $\sigma\sqrt{T}$ collapses toward zero, so a fixed dollar move in spot
      represents an ever-larger share of everything that can still happen
      before expiry — delta has to swing from near zero to near one across an
      increasingly narrow band of strikes, and that swing packed into less time
      is exactly what a diverging gamma describes.

      Because raw gamma is not comparable across different underlyings — a
      fixed gamma means something different on a 20 stock than on a 500 stock —
      the number that actually enters a P&L calculation is scaled by
      $S^{2}$, so it can be compared, added, and risk-managed sensibly across
      names.
    worked: >
      With $S = K = 50$, $\sigma = 30\%$: at $T = 1$, $\Gamma \approx 0.026$;
      shrink to $T = 1/12$ (one month) and $\Gamma \approx 0.092$, a factor of
      about $3.5\times$ — close to the $\sqrt{12} \approx 3.46$ scaling the
      $1/\sqrt{T}$ rule predicts for a twelvefold shrink in time.
    interview: >
      "Why is the last week before expiry dangerous for a short options book"
      is answered with the $1/\sqrt{T}$ blow-up concentrated at strikes near
      spot. A common follow-up: "is gamma different for a call versus a put at
      the same strike" — no, they are identical, from put-call parity.
    pitfalls: >
      Assuming gamma keeps rising into expiry at every strike is wrong — it
      only rises where spot actually sits; strikes far from the money decay
      toward zero even as expiry nears. Comparing unscaled gamma across two
      underlyings priced very differently is comparing numbers with no common
      unit.
    recap: >
      Gamma peaks at the strike and grows like $1/\sqrt{T}$ into expiry,
      identical for call and put — which is why short-dated at-the-money risk
      is where pin risk concentrates.
    dialogue:
      - part: Three strikes, one month
        teach: >
          A stock at $70$, $30\%$ vol, $r = 0$. You are looking at one-month
          calls struck at $55$, $70$ and $85$. Their deltas are $0.998$,
          $0.517$ and $0.014$.
      - ask: >
          Which of the three has the largest gamma?
        choices:
          - text: >
              The $55$ call: it is deepest in the money and worth the most.
            feedback: >
              Its delta is already $0.998$ and has nowhere left to go, so a
              move barely changes it. Its gamma is about $0.001$.
          - text: >
              The $70$ call.
            correct: true
            feedback: >
              About $0.066$, against $0.001$ at $55$ and $0.006$ at $85$. Its
              delta is $0.517$, right on the steep part of the S-curve.
          - text: >
              The $85$ call: it is cheapest, so it is the most leveraged.
            feedback: >
              Cheap is not curved. Its delta is $0.014$ and a point of spot
              hardly moves it; its gamma is about $0.006$.
        feedback: >
          Value is largest deep in the money; curvature is largest at the
          strike. Different questions, different answers.
      - ask: >
          What is the gamma of the one-month $55$ *put*?
        choices:
          - text: >
              The same as the $55$ call's, about $0.001$.
            correct: true
            feedback: >
              The put's delta is $N(d_1) - 1$, the call's minus a constant, so
              their slopes in spot are identical. One gamma per strike and
              expiry.
          - text: >
              Large: the put is far out of the money and cheap, so it reacts
              sharply.
            feedback: >
              Out of the money, the put's delta is near $0$ and stays there
              for small moves. Small delta changes mean small gamma.
          - text: >
              Negative, because put deltas are negative.
            feedback: >
              A put's delta is negative but it rises with spot, toward $0$. A
              rising delta is a positive gamma for anyone long the put.
        feedback: >
          Gamma is a property of the strike and expiry: call and put share
          $\varphi(d_1)/(S\sigma\sqrt{T})$.
      - reflect: >
          Gamma died at both ends, around deltas of $0.998$ and $0.014$. Say
          why it must vanish deep in or out of the money and where it must be
          largest.
        answer: >
          Gamma is the slope of delta. Deep in the money the option has
          resolved into the stock, delta is pinned near $1$, and a small move
          cannot change it; deep out of the money it has resolved into
          nothing, with delta pinned near $0$. Delta moves fastest where the
          outcome is still undecided, which is with spot near the strike, so
          gamma peaks there — exactly where $\varphi(d_1)$ peaks, at
          $d_1 \approx 0$.

      - part: Running the clock down
        ask: >
          The at-the-money $70$ call has gamma $0.0188$ with a year left and
          $0.0657$ with a month left. By what factor did gamma grow?
        expects: "3.5"
        tolerance: 0.03
        feedback: >
          $0.0657/0.0188 = 3.49$. Time to expiry shrank by a factor of $12$,
          and gamma grew by a factor of about $3.5$.
      - ask: >
          Which rule fits a twelvefold cut in time producing a $3.5$-fold rise
          in gamma?
        choices:
          - text: >
              Gamma grows like $1/T$.
            feedback: >
              That would multiply gamma by $12$, not $3.5$.
          - text: >
              Gamma grows like $1/\sqrt{T}$.
            correct: true
            feedback: >
              $\sqrt{12} = 3.46$. The $\sqrt{T}$ in the denominator of
              $\varphi(d_1)/(S\sigma\sqrt{T})$ does it, with $\varphi(d_1)$
              barely moving at the money.
          - text: >
              Gamma is fixed by moneyness and does not depend on time.
            feedback: >
              The same at-the-money strike carried $0.0188$ and $0.0657$. Time
              is half the story.
        feedback: >
          At the money, gamma runs like $1/\sqrt{T}$ and has no ceiling as
          expiry approaches.
      - teach: >
          Gamma $\Gamma = \varphi(d_1)/(S\sigma\sqrt{T})$ is the same for the
          call and the put at a given strike and expiry. In spot it peaks near
          the strike and decays toward zero deep in or out of the money, where
          delta is pinned at $1$ or $0$. At the money $d_1$ is near zero and
          $\varphi(0) \approx 0.4$, so $\Gamma \approx 0.4/(S\sigma\sqrt{T})$,
          which blows up like $1/\sqrt{T}$ into expiry. Long-dated gamma is
          small and nearly flat across strikes.
      - ask: >
          Use the at-the-money rule for the $70$ call with one calendar day
          left, $T = 1/365$, where $\sqrt{T} = 0.0523$. What is $\Gamma$?
        expects: "0.364"
        tolerance: 0.004
        feedback: >
          $0.4/(70 \times 0.30 \times 0.0523) = 0.4/1.099 = 0.364$. A one-point
          move now shifts delta by more than a third.
      - ask: >
          With one day left and the stock at $70$, you are short $1{,}000$ of
          these calls, delta-hedged. What is the problem?
        choices:
          - text: >
              Little: one day of time value is almost nothing.
            feedback: >
              The premium left is small, but the position's sensitivity is
              not. Every point now changes your hedge by about $364$ shares.
          - text: >
              Every point moves the hedge by hundreds of shares, and each
              re-hedge on a short-gamma book locks in a loss.
            correct: true
            feedback: >
              Delta swings between near $0$ and near $1$ across a couple of
              points, and you are on the losing side of every swing. That is
              pin risk: short gamma, concentrated at a strike with open
              interest, in the last days.
          - text: >
              The risk is spread over every strike in the book.
            feedback: >
              One day out, gamma lives only within a point or two of spot. An
              $85$ strike with a day left has essentially none.
        feedback: >
          Short-dated, at-the-money gamma is where short books get hurt.
      - ask: >
          Does gamma rise into expiry at every strike?
        choices:
          - text: >
              Yes: it grows like $1/\sqrt{T}$ everywhere.
            feedback: >
              The $1/\sqrt{T}$ rule is the at-the-money rule. At $85$, with
              spot $70$, $d_1$ runs off toward $-\infty$ as $T \to 0$ and
              $\varphi(d_1)$ collapses faster than $\sqrt{T}$ does.
          - text: >
              No: it falls everywhere as the option's value decays.
            feedback: >
              At the money it explodes, as the one-day $0.364$ showed. Value
              and curvature move in opposite directions there.
          - text: >
              No: it rises only near spot; far strikes decay to zero.
            correct: true
            feedback: >
              As expiry nears, the peak gets taller and narrower. Strikes off
              to the side see their gamma vanish.
        feedback: >
          The gamma profile sharpens into a spike at spot as expiry
          approaches.

      - part: Gamma in money
        ask: >
          Back to the one-month at-the-money call: $\Gamma = 0.0657$, $S = 70$.
          What does a $1\%$ move earn against a delta hedge,
          $\tfrac{1}{2}\Gamma(\delta S)^{2}$, per option?
        expects: "0.0161"
        tolerance: 0.0003
        hint: >
          A $1\%$ move on a $70$ stock is $0.7$ points.
        feedback: >
          $\tfrac{1}{2}(0.0657)(0.49) = 0.0161$.
      - ask: >
          That is $\tfrac{1}{2}\Gamma S^{2}(0.01)^{2}$. Why do desks compare
          names by $\tfrac{1}{2}\Gamma S^{2}$, dollar gamma, instead of by raw
          $\Gamma$?
        choices:
          - text: >
              Raw gamma is per point squared, and a point means more on a
              cheap stock than on an expensive one.
            correct: true
            feedback: >
              A $1\%$ move is $0.7$ points here and $7$ points on a $700$
              stock. The P&L of a percentage move scales with $\Gamma S^{2}$,
              so that is the comparable number.
          - text: >
              Expensive stocks have larger raw gamma, which exaggerates their
              risk.
            feedback: >
              The opposite: raw gamma carries $1/S$, so expensive stocks show
              smaller raw gamma and look safer than they are.
          - text: >
              Raw gamma ignores volatility.
            feedback: >
              $\sigma$ sits in its denominator. The issue is units: per point
              squared does not compare across price levels.
        feedback: >
          Rank convexity across underlyings by dollar gamma. Raw gamma ranks
          by price level as much as by risk.

  - node: quant-finance.greeks.theta
    hook: >
      Theta is the one Greek guaranteed negative for a long option almost
      always, and an interviewer wants the no-arbitrage reason it must be that
      way, not just the fact of it.
    explanation: >
      An option's value above its intrinsic worth is entirely a payment for
      remaining uncertainty — the chance that spot still moves in your favor
      before expiry. Time passing with everything else held fixed removes some
      of that uncertainty and nothing replaces it, so the value has nowhere to
      go but down. That is the mechanism, not merely the observation, behind a
      negative theta.

      The decay is not spread evenly across the option's life; it accelerates
      as $T\to 0$ for the same reason gamma explodes there — the remaining
      uncertainty $\sigma\sqrt{T}$ is shrinking fastest right before expiry, so
      the largest single chunk of an at-the-money option's value evaporates in
      its final stretch rather than smoothly throughout.

      The one sign flip worth holding onto — a deep in-the-money European put
      with $r > 0$ — makes sense once you stop thinking purely about
      uncertainty: that holder is functionally waiting to receive a fixed cash
      strike, and every extra day of waiting only delays interest on cash
      already effectively owed to them. Time there is a cost to holding, not a
      source of value.
    worked: >
      With $S = K = 50$, $\sigma = 30\%$, $T = 1$, $r = 0$: $\Theta = -S
      \varphi(d_1)\sigma/(2\sqrt{T}) = -2.96$ per year, or about $-0.0081$ per
      day. On a 100-lot, that is roughly $0.81$ given up every calendar day
      just from time passing, with spot, vol and rates unchanged.
    interview: >
      "Why must theta be negative for a long option" wants the uncertainty
      argument stated directly, not just "because time decay." A sharper
      follow-up, "can theta ever be positive," is answered with the deep
      in-the-money European put under a positive rate, and why: delayed
      receipt of the strike.
    pitfalls: >
      Treating decay as roughly linear and "amortizing" the premium evenly
      across the option's life misreads the shape entirely — it accelerates
      like $1/\sqrt{T}$, so most of it is back-loaded into the final stretch.
      Dividing the annual figure by 252 instead of 365 mixes up a trading-day
      convention used elsewhere with theta's calendar-day convention.
    recap: >
      Theta is the price of remaining uncertainty running out — negative for a
      long option except a rate-driven exception on deep in-the-money puts,
      and it accelerates like $1/\sqrt{T}$ into expiry.
    dialogue:
      - part: A year of nothing happening
        teach: >
          A one-year call struck at $60$ on a stock at $60$, $25\%$ vol,
          $r = 0$, costs $5.97$. Suppose nothing happens for the whole year:
          the stock sits at $60$, vol stays at $25\%$, rates stay at zero. The
          model prices the call at $5.17$ with nine months left and $2.99$
          with three months left.
      - ask: >
          How much value does the call lose over its first three months?
        expects: "0.80"
        tolerance: 0.005
        feedback: >
          $5.97 - 5.17 = 0.80$, about an eighth of the premium, with nothing
          moving.
      - ask: >
          And over its final three months, ending at expiry with the stock
          still at $60$?
        expects: "2.99"
        tolerance: 0.005
        hint: >
          At expiry, exactly at the money, what does the call pay?
        feedback: >
          It expires worth $\max(60 - 60, 0) = 0$, so it loses all $2.99$ —
          nearly four times the first quarter's loss, and half of the
          original premium gone in the last quarter of the option's life.
      - reflect: >
          Nothing moved, and the buyer lost all $5.97$. What was the buyer
          paying for, and why does it run out fastest at the end?
        answer: >
          The premium above intrinsic value pays for the chance that the stock
          moves in your favour before expiry. Each day that passes with
          nothing happening removes some of that chance, and nothing replaces
          it. The remaining uncertainty scales like $\sigma\sqrt{T}$, and
          $\sqrt{T}$ falls fastest as $T$ nears zero: here the value went from
          $5.97$ at one year to $2.99$ at a quarter, almost exactly the factor
          $\sqrt{1/4} = 1/2$.

      - part: Decay, measured per day
        teach: >
          That rate of loss is theta, $\Theta = \partial V/\partial t$: the
          change in value from time passing with spot, vol and rates held
          fixed, quoted per calendar day as the annual figure over $365$. For
          a European call with no dividends,
          $\Theta = -S\varphi(d_1)\sigma/(2\sqrt{T}) - rKe^{-rT}N(d_2)$. Both
          terms are negative: long options decay.
      - ask: >
          Take the call with three months left: $d_1 = 0.0625$ and
          $\varphi(0.0625) = 0.3982$, with $r = 0$. What is $\Theta$, per year?
        expects: "-5.97"
        tolerance: 0.02
        hint: >
          With $r = 0$ only the first term survives; $\sqrt{0.25} = 0.5$.
        feedback: >
          $-60(0.3982)(0.25)/(2 \times 0.5) = -5.97$ per year. The
          same call with a full year left has $\Theta = -2.97$: a quarter of
          the time remaining, twice the rate of decay.
      - ask: >
          What does the desk quote for that theta, per calendar day?
        expects: "-0.0164"
        tolerance: 0.0003
        feedback: >
          $-5.97/365 = -0.0164$ per day. Dividing by $252$ trading days gives
          $-0.0237$ and overstates the daily bleed by nearly half: theta runs
          on calendar time, and the option decays over a weekend even though
          nothing trades.
      - ask: >
          Also with three months left: the $75$-strike call on the same stock
          at $60$. Which decays more per day?
        choices:
          - text: >
              The $75$ call: it is out of the money, so time is running out on
              it faster.
            feedback: >
              It is worth only $0.12$, so it has little to lose. Its theta is
              about $-0.0037$ a day, under a quarter of the at-the-money
              call's.
          - text: >
              The at-the-money $60$ call.
            correct: true
            feedback: >
              About $-0.0164$ a day against $-0.0037$. Theta is largest where
              the outcome is least settled, with spot at the strike.
          - text: >
              The same: both have three months left.
            feedback: >
              Time left is the same; what time is worth is not. The
              out-of-the-money call carries far less time value to lose.
        feedback: >
          Decay is biggest at the money and accelerates like $1/\sqrt{T}$ into
          expiry.

      - part: The put that gains from waiting
        ask: >
          Now $r = 5\%$. A one-year European put struck at $100$ on a stock at
          $40$, $30\%$ vol, is so deep in the money that it is worth almost
          exactly $Ke^{-rT} - S = 100e^{-0.05} - 40 = 55.12$. A month passes,
          the stock still at $40$. Using the same approximation with eleven
          months left, what is the put worth?
        expects: "55.52"
        tolerance: 0.02
        hint: >
          $e^{-0.05 \times 11/12} = 0.9552$.
        feedback: >
          $100(0.9552) - 40 = 55.52$. The put gained $0.40$ in a month with
          nothing moving. Its theta is positive, about $+4.69$ a year.
      - ask: >
          Why does this long option gain from the mere passage of time?
        choices:
          - text: >
              Puts gain value over time because stocks tend to fall.
            feedback: >
              Theta holds spot fixed; no fall was assumed. And the
              at-the-money put on the $60$ stock decays like its call.
          - text: >
              Any option gains value once it is far enough in the money.
            feedback: >
              A deep in-the-money call pays the strike rather than receiving
              it, so waiting costs its holder carry. The sign depends on which
              side of the strike payment you are on.
          - text: >
              Its holder is all but certain to receive $100$ in cash at
              expiry, and waiting less means less discounting.
            correct: true
            feedback: >
              Deep in the money, the optionality is nearly worthless, so the
              decay term nearly vanishes. What remains is
              $+rKe^{-rT}N(-d_2)$: the strike is coming, and every day brings
              it closer.
        feedback: >
          Positive theta on a long option needs a reason other than
          optionality: here, carry on a strike you are owed.
      - ask: >
          Set $r = 0$ and keep everything else. Does the deep in-the-money put
          still gain from waiting?
        choices:
          - text: >
              No: with no carry left, only the small decay term remains, and
              theta turns slightly negative.
            correct: true
            feedback: >
              The carry term $rKe^{-rT}N(-d_2)$ is zero, and what is left is
              the always-negative optionality term, here about $-0.035$ a
              year.
          - text: >
              Yes: it is still deep in the money.
            feedback: >
              Moneyness was not the engine. With $r = 0$ there is no
              discounting, so receiving $100$ sooner or later is worth the
              same.
          - text: >
              It gains even more, since nothing is discounted.
            feedback: >
              Without discounting there is nothing for the passage of time to
              undo. The gain came entirely from the rate.
        feedback: >
          The exception needs both conditions: deep in the money and a
          positive rate. In an interview: "a deep in-the-money European put
          with positive rates, because waiting only delays receipt of the
          strike."

  - node: quant-finance.greeks.theta-carry
    hook: >
      "Why would anyone sign up to lose money every single day" is the natural
      objection to owning options, and this is the one-line answer a desk
      gives back.
    explanation: >
      Selling premium looks, day to day, exactly like collecting steady income
      — small, reliable, positive theta showing up on the P&L with nothing
      obviously happening in return. That resemblance to income is precisely
      what makes it dangerous: the position is short a rare, large loss rather
      than genuinely riskless, a pattern that shows up throughout finance
      wherever a frequent small gain is funded by an infrequent large one.

      From the long side, the same asymmetry reads as a slow bleed with an
      uncertain payoff date. Paying theta every day with no visible return
      feels like a losing position right up until a real move arrives, at
      which point the accumulated convexity that was quietly being paid for
      shows up all at once. The P&L pattern of a long-gamma book is therefore
      smoothly negative punctuated by occasional sharp gains — the mirror image
      of the short side's smoothly positive, occasionally catastrophic pattern.

      Neither side is "wrong" to hold its position; the trade is a bet on
      whether the rate being charged for convexity will turn out to be more or
      less than what the market actually delivers.
    worked: >
      A short-gamma book collects theta of about $5$ a day. Over $250$ quiet
      trading days that is $+1{,}250$. A single sharp move then produces a
      gamma loss of $3{,}000$ in one day. Net for the year: $1{,}250 - 3{,}000
      = -1{,}750$, despite $250$ of the $251$ trading days showing a profit.
    interview: >
      "Would you rather be long or short gamma here" has no single right
      answer, but the expected response states the trade-off precisely: a
      fixed daily cost or credit against a convex or concave payoff, decided
      by whether realized moves beat what was priced in.
    pitfalls: >
      Judging a short-gamma strategy by its win rate rather than its expected
      value is the exact error the worked example is built to expose — a
      strategy profitable on 250 of 251 days can still lose money overall.
    recap: >
      Long options pay theta to rent convexity; short options collect that
      rent and are exposed to the rare large move it was pricing in.
    dialogue:
      - part: Two desks, one option
        teach: >
          Desk L buys $1{,}000$ one-month at-the-money calls on a $50$ stock and
          delta-hedges them. Desk S sells the same $1{,}000$ and delta-hedges
          too. Across the position, gamma is $79$ shares per point and theta is
          $33$ per day: desk L pays it, desk S collects it.
      - ask: >
          A quiet day: spot moves $0.40$. Against its hedge, desk L earns
          $\tfrac{1}{2}\Gamma(\delta S)^{2}$ and pays a day of theta. What is
          desk L's P&L for the day?
        expects: "-26.68"
        tolerance: 0.05
        feedback: >
          $\tfrac{1}{2}(79)(0.16) = 6.32$ from convexity, minus $33$ of theta:
          $-26.68$. Desk S makes $+26.68$.
      - ask: >
          A wild day: spot moves $3$ points. What is desk L's P&L?
        expects: "322.5"
        tolerance: 0.5
        feedback: >
          $\tfrac{1}{2}(79)(9) = 355.5$, minus $33$: $+322.5$. Desk S loses
          $322.5$ — about twelve quiet days of income in one session.
      - ask: >
          Over twenty days, nineteen quiet like the first and one wild like
          the second. What is desk L's total?
        expects: "-184.42"
        tolerance: 0.5
        hint: >
          Nineteen copies of the quiet day, plus one wild day.
        feedback: >
          $19(-26.68) + 322.5 = -506.92 + 322.5 = -184.42$. Desk L lost on
          nineteen days and lost overall; desk S won nineteen days and made
          $184.42$. This month, the moves did not pay the rent.
      - reflect: >
          Describe each desk's daily P&L pattern in a sentence, and say what
          desk L is actually buying with the $33$ a day it pays.
        answer: >
          Desk L bleeds a little every day and makes it back, or more, in a
          few sharp moves; desk S earns a little every day and gives it back,
          or more, when a large move comes. The $33$ is rent, and what it buys
          is convexity: against a delta hedge, any move up or down pays
          $\tfrac{1}{2}\Gamma(\delta S)^{2}$, which grows with the square of the
          move. Desk S has sold that right and is short the tail.

      - part: Rent and what it buys
        teach: >
          Theta is rent and gamma is what the rent buys. The long-option side
          pays theta every day and owns convexity. The short side collects
          theta and is short convexity: quiet days pay, and one large move
          takes back weeks of premium. That is why selling premium looks like
          steady income and is really a short-tail position, and why being
          long gamma feels like bleeding right up until it does not.
      - ask: >
          Suppose the wild day had been $4$ points instead. Desk S's loss that
          day wipes out how many quiet days of its income?
        expects: "22.45"
        tolerance: 0.1
        hint: >
          Desk S's loss is $\tfrac{1}{2}(79)(16)$ less the day's theta it still
          collects.
        feedback: >
          $\tfrac{1}{2}(79)(16) = 632$, less the $33$ collected: a $599$ loss.
          At $26.68$ a quiet day that is $599/26.68 = 22.45$ days. Going from
          $3$ points to $4$ nearly doubled the damage, because the loss grows
          with the square of the move.
      - ask: >
          Desk S hedges its delta every evening. Does that make its theta
          riskless income?
        choices:
          - text: >
              Yes: the hedge removes the market risk, and theta is what is
              left.
            feedback: >
              The hedge removes the first-order, directional risk. The
              convexity term, $\tfrac{1}{2}\Gamma(\delta S)^{2}$, is untouched,
              and for desk S it is a loss on every move.
          - text: >
              Yes, as long as the hedge is rebalanced often enough.
            feedback: >
              Rebalancing more often keeps delta near zero, but each
              rebalance locks in the convexity loss of the move just made.
              Frequency does not remove the short tail.
          - text: >
              No: hedging removes direction, not convexity, and desk S is
              short convexity.
            correct: true
            feedback: >
              A delta hedge leaves the square of the move. Short gamma pays on
              any large move, up or down, which is exactly what the theta was
              compensating for.
        feedback: >
          Theta and gamma come as a pair. Hedging delta leaves both in place.

      - part: Choosing a side
        ask: >
          You expect a takeover announcement on this stock some time this
          month, size unknown, direction unknown. Which desk would you rather
          be?
        choices:
          - text: >
              Desk S: it collects $33$ a day while waiting.
            feedback: >
              It collects until the announcement, and then pays
              $\tfrac{1}{2}(79)(\delta S)^{2}$ on a move of unknown but likely
              large size. A $6$-point jump costs it $1{,}422$.
          - text: >
              Desk L: it pays rent for exactly the large move you expect.
            correct: true
            feedback: >
              Long gamma is indifferent to direction and convex in size. If
              the move is big enough, the rent was cheap.
          - text: >
              Neither: both are hedged, so the news cannot matter.
            feedback: >
              Both are delta-hedged, which makes them indifferent to direction
              only. They are opposite bets on the size of the move.
        feedback: >
          Choosing a side is a forecast about move sizes. The rent is not
          arbitrary: Black–Scholes sets it so that at the implied vol the
          expected gamma gain exactly offsets the decay, and the trade is a
          bet on whether the market delivers more or less than that.

  - node: quant-finance.greeks.vega
    hook: >
      Vega is the one Greek about a belief rather than an observable market
      fact — nobody can look up the model's own volatility input the way they
      look up a spot price.
    explanation: >
      Every other Greek reacts to a quantity the market posts somewhere; vega
      reacts to the one input a trader has to estimate. That is what makes it
      the purest expression of a volatility view, separate from any opinion
      about direction.

      Vega is positive for both calls and puts, unlike delta, because more
      uncertainty always helps a capped-downside, open-upside claim regardless
      of which side of the strike it sits on — a call and a put are both long
      optionality, so both are long vega. It grows like $\sqrt{T}$ rather than
      exploding near expiry the way gamma does, because vega concerns the
      level of accumulated uncertainty over the option's whole remaining life,
      and more time simply means more of it, monotonically, with no singular
      collapse at the end.

      That different shape across maturity is why gamma and vega trade off
      along the term structure: short-dated options carry large gamma and
      small vega, long-dated options the reverse, so a desk that wants a clean
      volatility view without much gamma exposure reaches for longer-dated,
      at-the-money options rather than short-dated ones.
    worked: >
      With $S = K = 50$, $\sigma = 30\%$, $T = 1$: $\operatorname{Vega} =
      S\varphi(d_1)\sqrt{T} = 19.72$ per unit of $\sigma$, about $0.20$ per
      volatility point. On a 100-lot, that is about $20$ per point of implied
      vol; if implied vol jumps two points on an earnings surprise, the
      position gains roughly $40$ from that repricing alone, independent of
      what spot does.
    interview: >
      "Your book is short a lot of vega into an earnings print — what's the
      risk" wants the answer that an implied-vol move hits P&L directly
      through this term, whether or not spot moves at all, and that the
      exposure concentrates in longer-dated, at-the-money strikes.
    pitfalls: >
      Quoting the raw derivative instead of the per-point convention
      overstates exposure by a factor of 100 the moment someone asks for a
      per-point number. Assuming vega is negligible on short-dated names
      forgets that an earnings-driven implied-vol jump can still be large
      enough to matter even where the per-unit sensitivity is small.
    recap: >
      Vega is exposure to the market's own implied-vol quote, positive for any
      vanilla option and growing like $\sqrt{T}$ — long-dated, at-the-money
      options are where volatility risk really concentrates.
    dialogue:
      - part: The stock sat still
        teach: >
          A stock at $44$ has not moved all morning, but ahead of a court
          ruling the implied vol on its options has risen from $28\%$ to
          $31\%$. You own a six-month call struck at $44$ and a six-month put
          struck at $44$, with $r = 0$.
      - ask: >
          Which of the two gained value this morning?
        choices:
          - text: >
              The call only: more volatility means more upside.
            feedback: >
              More volatility means more downside too, and the put owns the
              downside. The put went from $3.470$ to $3.840$, exactly like the
              call.
          - text: >
              Neither: the stock did not move.
            feedback: >
              Spot is only one input. The price is a function of $\sigma$ as
              well, and $\sigma$ moved three points.
          - text: >
              Both.
            correct: true
            feedback: >
              Each went from $3.470$ to $3.840$. A call and a put are opposite
              bets on direction and the same bet on volatility.
          - text: >
              The put only: a court ruling is a downside risk.
            feedback: >
              The model does not know what the ruling is about. Vol rose, and
              vol raises both prices.
        feedback: >
          Same stock, same day, both options up $0.37$: the whole move came
          from implied vol.
      - ask: >
          The call gained $0.37$ on a $3$-point rise in vol. What did it gain
          per volatility point?
        expects: "0.1234"
        tolerance: 0.001
        feedback: >
          $(3.840 - 3.470)/3 = 0.1234$ per point.
      - reflect: >
          Why should more uncertainty raise the value of both a call and a
          put, when they bet in opposite directions?
        answer: >
          Both payoffs are floored at zero on the bad side and open on the
          good side. Spreading out the terminal distribution pushes more
          weight into the open side, which pays, and into the floored side,
          which costs nothing extra. So more uncertainty helps any long
          option, whichever side of the strike its payoff lives on: both are
          long optionality, so both are long volatility.

      - part: Vega, and where it lives
        teach: >
          That sensitivity is vega — not actually a Greek letter —
          $\operatorname{Vega} = \partial V/\partial\sigma$, quoted per
          volatility point, that is per $0.01$ of $\sigma$. For European calls
          and puts alike $\operatorname{Vega} = S\varphi(d_1)\sqrt{T} > 0$:
          both are long volatility.
      - ask: >
          For the six-month $44$ call, $d_1 = 0.099$ and
          $\varphi(0.099) = 0.3970$, with $\sqrt{0.5} = 0.7071$. What is its
          vega per volatility point?
        expects: "0.1235"
        tolerance: 0.001
        hint: >
          Compute $S\varphi(d_1)\sqrt{T}$ per unit of $\sigma$, then divide by
          $100$.
        feedback: >
          $44(0.3970)(0.7071) = 12.35$ per unit of $\sigma$, so $0.1235$ per
          point — the $0.1234$ you measured from the two prices.
      - ask: >
          On the same stock at $28\%$ vol, which of these carries the most
          vega?
        choices:
          - text: >
              The six-month $44$ call.
            correct: true
            feedback: >
              About $0.124$ a point: at the strike and with time to run, both
              of the things vega needs.
          - text: >
              The one-week $44$ call.
            feedback: >
              At the money, but with a week left its vega is about $0.024$ a
              point. Vega grows like $\sqrt{T}$, and a week is short.
          - text: >
              The six-month $60$ call.
            feedback: >
              Long enough, but $16$ points out of the money, where vega fades:
              about $0.042$ a point.
        feedback: >
          Vega wants spot near the strike and plenty of time. The vol risk of
          a book lives in its long-dated, at-the-money options.

      - part: When the vol comes out
        ask: >
          You own $500$ of the six-month calls. After the ruling, implied vol
          falls $2.5$ points and the stock does not move. What is your P&L?
        expects: "-154.4"
        tolerance: 0.3
        feedback: >
          $500 \times 0.1235 \times (-2.5) = -154.4$. A trader who multiplied
          by the raw vega, $12.35$, would report a loss a hundred times too
          large.
      - ask: >
          A one-week at-the-money call on the same stock, ahead of earnings,
          trades at $60\%$ implied, worth $1.46$. Its vega is only $0.0243$ a
          point. After earnings, with the stock unchanged, implied drops to
          $30\%$. What does the call lose?
        expects: "0.73"
        tolerance: 0.01
        feedback: >
          $0.0243 \times 30 = 0.73$, half the premium. Full repricing agrees:
          $1.46$ to $0.73$.
      - ask: >
          What does that say about ignoring vega on short-dated options?
        choices:
          - text: >
              It is safe: short-dated vega is small.
            feedback: >
              Small per point, yes. But implied vol on short-dated options can
              move thirty points overnight, and small times thirty took half
              the premium.
          - text: >
              It is safe only for puts.
            feedback: >
              Calls and puts carry the same vega. The crush hits both.
          - text: >
              Per-point vega is small, but the vol moves around events can be
              large enough to dominate.
            correct: true
            feedback: >
              Exposure is vega times the size of the vol move. Around an event
              the second factor is what matters.
        feedback: >
          Read vega with the size of the likely vol move beside it. In an
          interview: "long options are long vega; it peaks at the money and
          grows with root-$T$; around events, short-dated vol moves are big
          enough to matter anyway."

  - node: quant-finance.greeks.rho
    hook: >
      Rho is the Greek most desks quietly ignore on a standard equity option,
      and an interviewer wants to hear precisely why that's usually safe rather
      than a shrug.
    explanation: >
      Rho enters through the discounted strike, and the sign follows from what
      each side is owed. A call holder effectively defers paying the strike
      until expiry, so a higher rate makes that future payment cheaper in
      today's terms and the call more valuable — positive rho. A put holder is
      on the receiving end of that same deferred cash, so a higher rate
      discounts what they will eventually collect and makes the put less
      valuable — negative rho.

      Because this is a discounting effect, it only accumulates over the time
      the cash flow is actually deferred, which is why rho scales directly
      with maturity: a one-week option barely notices a rate move, while a
      multi-year option genuinely does. That single scaling fact is the whole
      reason rho gets deprioritized in most trading conversations — not
      because the logic is unimportant, but because the standard interview
      option is short-dated enough that the effect is small in absolute terms.

      The practical rule is to check maturity before dismissing it: long-dated
      contracts, or any instrument whose underlying is itself a rate, are
      exactly where rho stops being an afterthought.
    worked: >
      With $S = K = 50$, $T = 1$, $\sigma = 30\%$, $r = 0$: $\rho_C = KT
      N(d_2) = 50 \times 1 \times 0.44 = 22.02$ per unit of rate, about $0.22$
      for a one-percentage-point move. Compare that to delta's $0.56$ on a
      one-point spot move — even at a full year to expiry, a percentage-point
      rate move still matters less than a single point of spot.
    interview: >
      "Rank the five Greeks by how much you'd worry about each on a 3-month
      equity option" puts rho last, and the expected justification names the
      maturity scaling directly. A quick follow-up, "does rho ever matter," is
      answered with long-dated contracts or rate-linked underlyings.
    pitfalls: >
      Dismissing rho unconditionally, without checking maturity first, misses
      the cases — multi-year options, rates products — where it stops being
      negligible. Flipping the sign under pressure, forgetting calls are
      positive and puts negative, is an easy slip.
    recap: >
      Rho scales with maturity, so it is negligible on the short-dated options
      most interviews probe and material only for multi-year contracts.
    dialogue:
      - part: A surprise hike
        teach: >
          The central bank surprises with a one-percentage-point hike, from
          $2\%$ to $3\%$, and nothing else moves. You own two calls struck at
          $75$ on a stock at $75$, both at $30\%$ vol: one expires in three
          months, the other in three years.
      - ask: >
          Which way do the calls move?
        choices:
          - text: >
              Down: higher rates discount the payoff more heavily.
            feedback: >
              The payoff is discounted more, but the part of it you *pay*, the
              strike, is discounted more too. The second effect wins: the
              three-month call rises from $4.662$ to $4.753$.
          - text: >
              Up: the strike is paid at expiry, and a higher rate makes that
              deferred payment cheaper today.
            correct: true
            feedback: >
              A call holder is, in effect, deferring payment of $75$. Raising
              the rate shrinks $Ke^{-rT}$, and the call is worth more. The
              three-month call gains $0.09$.
          - text: >
              Neither: rates do not enter an equity option's value.
            feedback: >
              The strike is discounted at $r$: the formula's second term is
              $Ke^{-rT}N(d_2)$. Rates enter, if quietly.
        feedback: >
          Calls rise when rates rise, because the call holder is the one who
          will pay the strike.
      - ask: >
          The three-month call went from $4.662$ to $4.753$. The three-year
          call went from $17.207$ to $18.155$. How many times larger is the
          three-year call's gain?
        expects: "10.4"
        tolerance: 0.1
        feedback: >
          $0.948/0.091 = 10.4$. Twelve times the maturity, about ten times the
          rate sensitivity.
      - reflect: >
          Why should a rate move matter roughly in proportion to the time
          left?
        answer: >
          Rates act on the option only by discounting the strike, and the
          discount $e^{-rT}$ compounds over the whole time the payment is
          deferred: $\partial(Ke^{-rT})/\partial r = -TKe^{-rT}$, with $T$ out
          in front. A strike paid in a week barely notices a hike; one paid in
          three years notices it every year. The factor came out a little
          under $12$ because the chance of paying the strike differs between
          the two.

      - part: Rho, sized against delta
        teach: >
          That sensitivity is rho, $\rho = \partial V/\partial r$. For a
          European call $\rho_C = KTe^{-rT}N(d_2) > 0$: the strike you pay,
          discounted, times the chance you pay it, times $T$. Quoted per
          percentage point, divide by $100$.
      - ask: >
          For the three-month call at the old $2\%$ rate,
          $KTe^{-rT} = 75(0.25)(0.995) = 18.66$ and $N(d_2) = 0.4834$. What is
          its rho per percentage point?
        expects: "0.0902"
        tolerance: 0.0005
        feedback: >
          $18.66 \times 0.4834 = 9.02$ per unit of rate, so $0.0902$ per
          point — the $0.09$ you saw from repricing.
      - ask: >
          On the three-month call delta is $0.543$ per point of spot. How many
          percentage points would rates have to move to shift the call as much
          as one point of spot does?
        expects: "6.02"
        tolerance: 0.05
        feedback: >
          $0.543/0.0902 = 6.02$. A six-point rate move, the kind that happens
          over years, matches a one-point stock move, the kind that happens
          before lunch. That ratio is why rho is the Greek nobody hedges
          first on short-dated equity options.
      - ask: >
          A colleague owns the three-year $75$ put. What did the hike do to
          it?
        choices:
          - text: >
              It gained: rates went up and option values rose.
            feedback: >
              The calls rose because their holders pay the strike. The put's
              holder receives it, so the sign flips: the put fell from $12.84$
              to $11.70$, a loss of about $1.14$.
          - text: >
              Nothing: puts are about the stock falling, not about rates.
            feedback: >
              The put pays $K - S_T$, and $K$ arrives in three years. Its
              present value fell with the hike.
          - text: >
              It lost: a higher rate discounts the strike the put holder will
              receive.
            correct: true
            feedback: >
              $\rho_P = -KTe^{-rT}N(-d_2) < 0$, here about $-1.18$ per point,
              and repricing shows a loss of $1.14$. Long-dated puts carry real
              negative rho.
        feedback: >
          Calls positive, puts negative: it follows from who pays the strike
          and who receives it.

      - part: When rho earns attention
        ask: >
          A desk runs two books: one-month equity options, and five-year
          warrants on the same names. Where does rho belong in each risk
          ranking?
        choices:
          - text: >
              Last in both: rho is always the smallest Greek.
            feedback: >
              The three-year call already showed $0.94$ per point, ten times
              the three-month's. At five years rho is a real risk.
          - text: >
              Last for the one-month book; a real line item for the warrants.
            correct: true
            feedback: >
              Rho scales with $T$. A month of discounting is negligible; five
              years of it is not.
          - text: >
              Equally important in both: rates affect every option.
            feedback: >
              Every option has a rho, but a one-month at-the-money call here
              carries about $0.03$ per point — a rounding error next to its
              delta.
        feedback: >
          Check maturity before dismissing rho. Long-dated contracts, and
          anything whose underlying is itself a rate, are where it stops
          being an afterthought.

  - node: quant-finance.greeks.pnl-expansion
    hook: >
      This identity is the one line every risk report is secretly computing —
      being able to write it from memory and plug in real numbers is what
      separates "knows the Greeks" from "can attribute a day's P&L."
    explanation: >
      This is an ordinary multivariate Taylor expansion of the pricing
      function, with one deliberate asymmetry: spot gets kept to second order
      while time, volatility and rate are kept only to first. The reason is
      practical rather than mathematical — over a realistic short interval, a
      spot move is large enough relative to the option's curvature that the
      linear term alone leaves real error on the table, while the analogous
      curvature in time or volatility over that same short interval is small
      enough to ignore.

      Reading the four surviving terms as an attribution turns an abstract
      formula into a trading report: delta explains the move you'd expect from
      direction alone, gamma explains what convexity added on top of that,
      theta explains what time passing cost you, and vega explains what a
      repricing of the market's own volatility view was worth. Every later
      hedging argument in this unit is this one identity with particular terms
      set to zero or substituted for another.

      The convexity term deserves special notice: since it is multiplied by a
      squared spot move, its sign is fixed by the position alone before
      anything happens — a long-gamma book knows in advance that this term
      will help, and a short-gamma book knows it will hurt, regardless of which
      way the market goes.
    worked: >
      Using $\Delta = 0.56$, $\Gamma = 0.026$, $\Theta = -2.96$ per year, and
      $\operatorname{Vega} = 19.72$: over one day with $\delta S = 1$, $\delta
      t = 1/365$, $\delta\sigma = 0.01$, $\delta V \approx 0.56(1) +
      \tfrac{1}{2}(0.026)(1)^{2} + (-2.96)(1/365) + 19.72(0.01) = 0.56 +
      0.013 - 0.008 + 0.197 = 0.762$ — the day's move, decay and one point of
      vol combine to a gain of about $0.76$ per option.
    interview: >
      "Decompose today's P&L on this book" wants the four terms named and
      plugged in, not "it went up because delta." A sharp follow-up, "what's
      missing from this expansion," is answered with the cross terms vanna and
      volga, which surface as unexplained residual whenever spot and vol move
      together.
    pitfalls: >
      Dropping the one-half in the gamma term is the single most common slip
      in this identity. Treating the expansion as exact rather than a
      truncation overstates its reach on a genuinely large single-day move,
      where third-order and cross terms leave a real residual.
    recap: >
      Over a short interval, option P&L is $\Delta\,\delta S +
      \tfrac{1}{2}\Gamma(\delta S)^{2} + \Theta\,\delta t +
      \operatorname{Vega}\,\delta\sigma$ — the whole language of risk
      attribution collapsed into one Taylor expansion.
    dialogue:
      - part: A mark delta cannot explain
        teach: >
          You own one call with delta $0.540$, gamma $0.0338$, theta $-0.016$
          per day and vega $0.146$ per vol point. Overnight the stock rises
          $2$ points, implied vol falls $1.5$ points, and a calendar day
          passes. The call is re-marked up $0.913$.
      - ask: >
          How much did delta alone say the call should gain?
        expects: "1.08"
        tolerance: 0.005
        feedback: >
          $0.540 \times 2 = 1.08$. The call actually gained $0.913$, so delta
          alone overshoots by about $0.17$.
      - ask: >
          The call rose less than delta predicts. Which change explains most
          of the shortfall?
        choices:
          - text: >
              The stock's curvature: a $2$-point move is large.
            feedback: >
              You are long the call, so curvature works *for* you on any move.
              It would push the gain above $1.08$, not below.
          - text: >
              The day that passed.
            feedback: >
              One day of theta is $-0.016$, a tenth of the gap. It helps, but
              it is not the main piece.
          - text: >
              The $1.5$-point fall in implied vol.
            correct: true
            feedback: >
              The call is long vega, so a vol drop costs it money while the
              stock is rising. That is the big negative piece.
        feedback: >
          Several inputs moved at once, and each takes its own share of the
          mark.
      - ask: >
          What is the vol piece, vega times the change in vol?
        expects: "-0.219"
        tolerance: 0.002
        feedback: >
          $0.146 \times (-1.5) = -0.219$.
      - ask: >
          Add the delta, vega and theta pieces. How much of the $0.913$ is
          still unexplained?
        expects: "0.068"
        tolerance: 0.003
        feedback: >
          $1.080 - 0.219 - 0.016 = 0.845$, and $0.913 - 0.845 = 0.068$. Small,
          positive, and not yet accounted for.
      - reflect: >
          What term is missing, and would that leftover still be positive had
          the stock *fallen* $2$ points instead?
        answer: >
          The second-order term in spot,
          $\tfrac{1}{2}\Gamma(\delta S)^{2} = \tfrac{1}{2}(0.0338)(4) = 0.068$:
          the convexity you own. It carries $(\delta S)^{2}$, which is the
          same $4$ for a rise or a fall, so a long-gamma position collects it
          in either direction. Its sign is set by the position before anything
          happens.

      - part: The expansion, term by term
        teach: >
          Over a short interval, $\delta V \approx \Delta\,\delta S +
          \tfrac{1}{2}\Gamma(\delta S)^{2} + \Theta\,\delta t +
          \operatorname{Vega}\,\delta\sigma$, plus a rate term $\rho\,\delta r$
          that is negligible short-dated: second order in spot, first order
          in everything else. Read as an attribution, the terms are
          direction, convexity, decay and a repricing of volatility. Dropped
          are the cross terms, vanna $\partial^{2}V/\partial S\,\partial\sigma$
          and volga $\partial^{2}V/\partial\sigma^{2}$.
      - ask: >
          Same call, same day, but the stock *falls* $2$ points while vol
          still falls $1.5$. What does the expansion predict for $\delta V$?
        expects: "-1.247"
        tolerance: 0.005
        hint: >
          Only the delta term changes sign.
        feedback: >
          $-1.080 + 0.068 - 0.016 - 0.219 = -1.247$. Full repricing gives
          $-1.238$. The convexity term still added $0.068$, even on a down
          day.
      - ask: >
          A colleague writes the convexity term as $\Gamma(\delta S)^{2}$ and
          gets $0.135$ on the $2$-point day. What went wrong?
        choices:
          - text: >
              Nothing: the one-half is a convention some desks drop.
            feedback: >
              It is not a convention. With it, the attribution closed to
              within $0.001$; without it, it misses by $0.07$.
          - text: >
              The second-order Taylor term is $\tfrac{1}{2}f''h^{2}$; he
              dropped the one-half and doubled it.
            correct: true
            feedback: >
              Dropping the one-half is the single most common slip in this
              identity, and it overstates convexity P&L by exactly a factor
              of two.
          - text: >
              The term should be $\Gamma\,\delta S$, not squared.
            feedback: >
              $\Gamma\,\delta S$ is the change in delta, a share count. The
              P&L from curvature is second order in the move.
        feedback: >
          $\tfrac{1}{2}\Gamma(\delta S)^{2}$, with the one-half: that is what
          Taylor's theorem gives.
      - ask: >
          Why keep spot to second order but vol only to first?
        choices:
          - text: >
              Over a day, a spot move is big enough that its curvature term
              is a real number, while the vol curvature times a squared vol
              move is usually tiny.
            correct: true
            feedback: >
              Here $\tfrac{1}{2}\Gamma(\delta S)^{2} = 0.068$ was needed to
              close the books. A $1.5$-point vol move squared is $0.000225$,
              and almost nothing multiplied by it shows up.
          - text: >
              Implied vol cannot move much in a day.
            feedback: >
              It can: ahead of earnings it moves tens of points. The reason
              is about what is large relative to the curvature, not about vol
              being calm.
          - text: >
              Gamma is the only second derivative an option has.
            feedback: >
              Vanna and volga are second derivatives too. They are dropped for
              size, not because they do not exist.
        feedback: >
          The truncation is practical: keep what is large on a typical day.

      - part: A day the expansion strains
        ask: >
          A violent day for the same call: the stock falls $6$ points and
          implied vol jumps $6$ points. What does the expansion predict?
        expects: "-1.772"
        tolerance: 0.006
        feedback: >
          $0.540(-6) + \tfrac{1}{2}(0.0338)(36) - 0.016 + 0.146(6) = -3.240
          + 0.608 - 0.016 + 0.876 = -1.772$. Full repricing says $-1.900$.
      - teach: >
          The $0.13$ gap is what the truncation left out: higher-order spot
          terms, and the cross terms in spot and vol, which are invisible on
          a quiet day and grow when spot and vol move together and move far.
          Asked to decompose a day's P&L, name the four terms with numbers,
          then say what is left over and why.

  - node: quant-finance.greeks.delta-hedging
    hook: >
      "Walk me through delta hedging" is close to a guaranteed prompt on a
      derivatives desk, and the answer that scores is the mechanics plus the
      two frictions that keep it from being perfect — not just "buy or sell
      shares to stay flat."
    explanation: >
      Delta hedging is the continuous-time version of an idea already familiar
      from the one-step binomial: hold exactly the share count that replicates
      the option's next move, and the combined position has no first-order
      spot risk left. Running that computation over and over, rebalancing as
      spot and time move, is what "continuous hedging" actually means — it is
      the same replication argument, repeated.

      Rebalancing is not optional bookkeeping; it is required precisely because
      gamma exists. The moment spot moves, delta has already changed, so the
      share count that was correct a moment ago is now stale, and the position
      is quietly re-exposed until the next trade.

      In practice two frictions decide how the theoretical ideal gets
      compromised. Hedging at a finite number of times leaves a residual
      tracking error that shrinks only like $1/\sqrt{n}$ as the number of
      rebalances $n$ grows, so doubling trading frequency does not halve the
      error. Meanwhile every rebalance crosses the bid-ask spread, so trading
      more often to shrink that error also bleeds more into transaction costs
      — which is why real desks hedge to a no-trade band around flat rather
      than chase continuous perfection.
    worked: >
      A one-step binomial: $S = 50$ moves to $S_u = 55$ with call value $C_u =
      8$, or to $S_d = 45$ with $C_d = 2$. The replicating hedge is $\Delta =
      (C_u - C_d)/(S_u - S_d) = (8-2)/(55-45) = 0.6$ — holding $0.6$ shares
      against a short call exactly matches its payoff at either outcome, the
      same computation continuous delta hedging repeats at every instant.
    interview: >
      "How would you delta hedge this, and what's the biggest practical
      headache" wants the discretization error's $1/\sqrt{n}$ shrinkage and
      the transaction-cost drag both named, landing on a no-trade band as the
      realistic answer rather than "trade continuously."
    pitfalls: >
      Describing delta hedging as a single trade rather than an ongoing
      process skips the exact frictions the topic is about. Assuming finer
      rebalancing is strictly better ignores that shrinking the tracking error
      trades off directly against paying more spread.
    recap: >
      Delta hedging holds $-\Delta$ shares and rebalances as delta drifts — the
      continuous-time echo of the binomial replicating portfolio, tuned in
      practice by a frequency-versus-cost trade-off rather than run to
      perfection.
    dialogue:
      - part: One step, one share count
        teach: >
          A stock at $30$ will move to $33$ or to $27$ over the next step, and
          $r = 0$. You have just sold a call struck at $30$, which will be
          worth $3$ if the stock goes up and $0$ if it goes down.
      - ask: >
          How many shares should you hold so that your position — short the
          call, long the shares — is worth the same in both states?
        expects: "0.5"
        hint: >
          Write the position's value in each state with $h$ shares and set the
          two equal.
        feedback: >
          Up: $33h - 3$. Down: $27h - 0$. Equal when $6h = 3$, so $h = 0.5$ —
          the difference quotient $(C_u - C_d)/(S_u - S_d) = 3/6$, a discrete
          delta.
      - ask: >
          Did you need the probability of the up move to find that number?
        choices:
          - text: >
              Yes: the two states have to be weighted by how likely they are.
            feedback: >
              You made the position worth the same in *both* states. Once it
              is, the weights do not matter: every outcome gives the same
              value.
          - text: >
              No: the hedge matches in every state, so it holds whatever the
              probabilities are.
            correct: true
            feedback: >
              Replication is state by state. That is why a hedge ratio never
              needs a forecast of direction.
          - text: >
              Yes: you need the stock's expected return to know how much
              to hold.
            feedback: >
              The expected return never appeared in $6h = 3$. Two states and
              two prices pin the number down.
        feedback: >
          The share count that replicates an option is forced by the payoffs,
          not chosen by a view.

      - part: Two steps, two trades
        teach: >
          Now the same stock takes two steps, each up $10\%$ or down $10\%$:
          from $30$ to $33$ or $27$, then to $36.3$, $29.7$ or $24.3$. The call
          struck at $30$ pays $6.3$, $0$ or $0$ at the end. With $r = 0$ it is
          worth $3.15$ at the $33$ node and $0$ at the $27$ node.
      - ask: >
          What is the hedge ratio at the start, at $30$?
        expects: "0.525"
        tolerance: 0.001
        feedback: >
          $(3.15 - 0)/(33 - 27) = 3.15/6 = 0.525$ shares per call.
      - ask: >
          The stock goes to $33$. What is the hedge ratio there?
        expects: "0.9545"
        tolerance: 0.001
        hint: >
          Same difference quotient, using the two final states that can follow
          $33$.
        feedback: >
          $(6.3 - 0)/(36.3 - 29.7) = 6.3/6.6 = 0.9545$. At $33$ the call is
          likely to finish in the money, and its hedge looks almost like a
          whole share.
      - ask: >
          You are short one call. At the $33$ node, how many shares must you
          buy to stay hedged?
        expects: "0.43"
        tolerance: 0.005
        feedback: >
          $0.9545 - 0.525 = 0.43$ shares, bought after the stock rose. Had the
          stock gone to $27$ instead, the hedge ratio there is $0$ and you
          would sell all $0.525$.
      - reflect: >
          A share count that was exactly right for one step was wrong for the
          next. With the stock moving every instant, what does staying
          replicated require, and why?
        answer: >
          Recomputing delta at the current spot and time and re-trading to
          it, over and over, because delta changes whenever spot or time
          does. Each rebalance is the one-step replication argument run
          again; continuous hedging is that computation repeated without end.
          Leave the hedge alone and it goes stale, and the position is
          quietly re-exposed to direction.

      - part: The two frictions
        teach: >
          Delta hedging: hold $-\Delta$ shares per long option (or $+\Delta$
          per short one), compute $\Delta$ at the current spot and implied
          vol, trade to flat, and rebalance as $\Delta$ moves. The one-step
          binomial $\Delta = (C_u - C_d)/(S_u - S_d)$ is the exact
          replicating share count; continuous hedging repeats it. Two
          frictions decide how it is really done: hedging at $n$ discrete
          times leaves an error that shrinks only like $1/\sqrt{n}$, and every
          rebalance pays the spread.
      - ask: >
          Hedging once a day, a desk's hedging error over a month has a
          standard deviation of $900$. What does it become if the desk hedges
          four times a day?
        expects: "450"
        tolerance: 2
        feedback: >
          Four times the rebalances divides the error by $\sqrt{4} = 2$:
          $450$. Not $225$ — that would need the error to fall like $1/n$.
          Halving the error costs four times the trading.
      - ask: >
          Each rebalance costs about $12$ in spread. Over a $21$-day month,
          what does hedging four times a day cost in spread?
        expects: "1008"
        tolerance: 1
        feedback: >
          $4 \times 21 \times 12 = 1{,}008$, against $252$ for once a day. The
          error fell by half; the cost went up fourfold.
      - ask: >
          Error falls like $1/\sqrt{n}$ and cost rises like $n$. What policy do
          real desks run?
        choices:
          - text: >
              Hedge continuously: a perfect hedge is worth any cost.
            feedback: >
              Cost grows without bound as $n$ does, while the error shrinks
              ever more slowly. Continuous trading would bleed the position
              dry in spread.
          - text: >
              Hedge on a fixed clock, say hourly, whatever the market does.
            feedback: >
              A clock trades on quiet days when the hedge has barely moved and
              waits on busy days when it has moved a lot. It ignores the one
              thing that matters: how stale the hedge is.
          - text: >
              A no-trade band: rebalance only once delta has drifted far
              enough from flat that the spread is worth paying.
            correct: true
            feedback: >
              The band ties trading to how far the hedge has gone stale, which
              is what decides whether a trade earns its spread.
        feedback: >
          In an interview: "hold minus delta in shares and rebalance as delta
          moves — it is the binomial replication run in real time; the error
          falls like one over root-$n$ and every trade pays the spread, so you
          hedge to a band, not continuously."

  - node: quant-finance.greeks.rebalance-example
    hook: >
      Reproducing this exact number on the spot — the dollar take from one
      rebalance — is what separates having memorized the gamma formula from
      having actually hedged a book.
    explanation: >
      The mechanics generalize past the specific numbers: whichever direction
      spot moves, the linear piece of the option's value change is cancelled
      exactly by the opposite move on the hedge shares, because that
      cancellation is the entire point of being delta-hedged. What survives
      after that cancellation is pure convexity, and because it comes from a
      squared spot move, it carries the same sign — a gain for a long position
      — no matter which way spot went.

      That residual is not free money sitting on the table; it is the exact
      quantity the earlier gamma-theta bargain says theta is charging for in
      advance. A single rebalance's gamma gain can be compared directly to a
      day's worth of decay to see whether that particular move "paid for
      itself."

      After the move, delta has shifted by roughly gamma times the move, so
      the hedge itself needs a follow-up trade — and the direction of that
      trade is informative on its own: a rally forces a sale, a drop forces a
      purchase, the seed of the mechanical pattern that shows up again once
      hedging is repeated many times.
    worked: >
      Take a 300-contract position in the $S = K = 50$, $\sigma = 30\%$, $T =
      1$ calls ($\Delta = 0.56$, $\Gamma = 0.026$), initially hedged short about
      $168$ shares. Spot drops $3$ points to $47$: the options lose about
      $468$, the short shares gain about $504$, netting $+35.50$ — matching
      $\tfrac{1}{2}(300)(0.026)(3)^{2} = 35.50$ exactly, the pure gamma term on
      a down-move. Delta has fallen to about $0.48$, so about $24$ of the
      shorted shares are bought back to re-flatten. That $35.50$ gain covers
      roughly $14.6$ days of this lot's theta, which runs about $2.43$ per
      day.
    interview: >
      "Spot moved X points and you're delta-hedged — what's your P&L, and
      why" is answered by walking through the cancellation: the linear pieces
      net out by construction, leaving $\tfrac{1}{2}\Gamma(\delta S)^{2}$ times
      position size, regardless of direction.
    pitfalls: >
      Forgetting to scale the per-option Greeks by position size before
      quoting a P&L number is a common arithmetic slip. Treating the gamma
      gain as costless ignores that it was funded by the theta already paid
      for owning that convexity in the first place.
    recap: >
      A delta-hedged move's P&L is pure gamma — the linear pieces cancel by
      construction, leaving $\tfrac{1}{2}\Gamma(\delta S)^{2}$ regardless of
      which way spot moved.
    dialogue:
      - part: Sitting flat
        teach: >
          You buy $200$ calls struck at $84$ on a stock at $84$, about three
          and a half months out at $24\%$ vol, $r = 0$. Each has
          $\Delta = 0.526$ and $\Gamma = 0.036$, and the $200$ together decay
          about $4.01$ per calendar day.
      - ask: >
          How many shares do you short to sit flat?
        expects: "105.2"
        tolerance: 0.05
        feedback: >
          $200 \times 0.526 = 105.2$ shares. Scaling the per-option delta by
          the position size is the step people skip.

      - part: The stock drops
        ask: >
          The stock falls $2.5$ points to $81.5$. Using delta and gamma, what
          do the $200$ calls lose?
        expects: "-240.5"
        tolerance: 0.3
        hint: >
          Per call, $\Delta\,\delta S + \tfrac{1}{2}\Gamma(\delta S)^{2}$ with
          $\delta S = -2.5$.
        feedback: >
          $200[0.526(-2.5) + \tfrac{1}{2}(0.036)(6.25)] = 200(-1.315 + 0.1125)
          = -240.5$. Full repricing gives $-240.3$.
      - ask: >
          Add the $105.2$ short shares. What is the hedged position's P&L?
        expects: "22.5"
        tolerance: 0.2
        feedback: >
          The short shares gain $105.2 \times 2.5 = 263.0$, so the net is
          $263.0 - 240.5 = +22.5$.
      - ask: >
          Spot fell, you own calls, and you made $22.5$. Where did it come
          from?
        choices:
          - text: >
              The short shares: the stock fell, and shorts profit from a fall.
            feedback: >
              They gained $263.0$, but the calls lost $240.5$, and most of
              that pair cancels by design. The question is what survives the
              cancellation.
          - text: >
              Luck in the direction: a $2.5$-point rise would have lost about
              $22.5$.
            feedback: >
              Run the rise: the calls gain $200(1.315 + 0.1125) = 285.5$ and
              the shares lose $263.0$, net $+22.5$ again.
          - text: >
              The delta pieces cancel by construction; what is left is
              $200 \times \tfrac{1}{2}\Gamma(\delta S)^{2}$.
            correct: true
            feedback: >
              $200 \times \tfrac{1}{2}(0.036)(6.25) = 22.5$ exactly: pure
              convexity, the same sign whichever way spot went.
        feedback: >
          A delta-hedged move's P&L is the gamma term times position size.

      - part: The re-hedge and the round trip
        ask: >
          After the fall, what is each call's delta, using gamma?
        expects: "0.436"
        tolerance: 0.001
        feedback: >
          $0.526 - 0.036(2.5) = 0.436$. Full repricing at $81.5$ gives
          $0.435$.
      - ask: >
          What trade puts the position back to flat?
        choices:
          - text: >
              Short $18$ more shares.
            feedback: >
              Delta fell, so the calls now need *less* short stock against
              them. Shorting more makes you net short the stock.
          - text: >
              Buy back $18$ shares.
            correct: true
            feedback: >
              The hedge should be $200 \times 0.436 = 87.2$ short, and you are
              $105.2$ short, so you buy $18$. A fall forced a purchase.
          - text: >
              Buy back all $105.2$ and start again.
            feedback: >
              The calls still carry delta $0.436$ each; with no shares
              against them you would be long $87.2$ shares of exposure.
          - text: >
              Nothing: the position just made money.
            feedback: >
              It made money on the last move; it is now long $18$ shares of
              delta and exposed to the next one.
        feedback: >
          The re-hedge is gamma times the move times the position:
          $200 \times 0.036 \times 2.5 = 18$ shares.
      - ask: >
          The stock returns to $84$. What did the $18$ shares you bought at
          $81.5$ earn?
        expects: "45"
        tolerance: 0.1
        feedback: >
          $18 \times 2.5 = 45$. That is the round trip's whole take:
          $200\,\Gamma(\delta S)^{2} = 200(0.036)(6.25) = 45$, two legs of
          $22.5$. Back at $84$ you sell those $18$ to be flat again.
      - reflect: >
          Over the round trip, the hedge made you buy after the fall and sell
          after the rise. What kind of trading program is a long-gamma hedge
          running, and why does it profit even though the stock ended where
          it started?
        answer: >
          A mechanical buy-low, sell-high program: delta falls on a dip, so
          flattening means buying; it rises on a rally, so flattening means
          selling. The profit comes from the back-and-forth itself,
          $\Gamma(\delta S)^{2}$ per round trip, not from where the stock
          ends up. It is not free: theta is the fee for owning the convexity
          that forces those trades.

      - part: Against the rent
        ask: >
          The lot decays about $4.01$ a day. How many days of theta does the
          round trip's $45$ pay for?
        expects: "11.2"
        tolerance: 0.05
        feedback: >
          $45/4.01 = 11.2$ days. One clean $2.5$-point round trip covers well
          over a week of rent.
      - ask: >
          Suppose instead the round trip had been only $1.25$ points each way.
          What would it have earned?
        expects: "11.25"
        tolerance: 0.05
        hint: >
          The take is $200\,\Gamma(\delta S)^{2}$.
        feedback: >
          $200(0.036)(1.25)^{2} = 11.25$: half the move, a quarter of the
          take, under three days of theta. The gamma P&L is quadratic in the
          move.
      - teach: >
          Said aloud under pressure: "hedged, the delta pieces cancel; I make
          one half gamma times the move squared times the position — $22.5$
          here — whichever way it went, and I re-hedge by gamma times the
          move. A round trip earns twice that, against about $4$ a day of
          theta."

  - node: quant-finance.greeks.gamma-theta
    hook: >
      Being able to reproduce $\Theta \approx -\tfrac{1}{2}\sigma^{2}S^{2}
      \Gamma$ from Itô's lemma cold, rather than quoting it, is one of the
      strongest signals an interviewer has that hedging is actually understood.
    explanation: >
      The mental model is a no-arbitrage constraint rather than a coincidence:
      once a book is delta-hedged, its remaining drift is not free to be
      anything — recall Itô's lemma applied to the pricing function shows that
      drift is fixed, and no-arbitrage pins it to the riskless rate, no more
      and no less. Any drift the quadratic, gamma-driven term would otherwise
      contribute has to be exactly cancelled by something, and theta is that
      something. Gamma and theta are therefore not two independent risk
      numbers on a report — quoting a gamma without a matching theta, or vice
      versa, is the same kind of inconsistency the put-call parity relations
      catch, just for one option against itself.

      This is the precise version of the earlier idea that theta is rent for
      owning convexity: the rate of that rent is not set by desk convention,
      it is set by Black–Scholes to be exactly $\tfrac{1}{2}\sigma^{2}S^{2}
      \Gamma$ at the volatility the option was priced at.

      Setting $r = 0$ isolates the core identity cleanly, but the more general
      relation with rates carries an extra $rS\Delta$ term on the hedged side
      and $rV$ on the riskless side — worth naming if asked, since dropping
      rates silently is a modeling choice, not a law.
    worked: >
      With $\sigma = 30\%$, $S = 50$, $\Gamma = 0.026$: $\tfrac{1}{2}
      \sigma^{2}S^{2}\Gamma = 0.5(0.09)(2500)(0.026) = 2.96$, matching the
      $\Theta = -2.96$ computed directly from the theta formula to two decimal
      places.
    interview: >
      "If I give you gamma, can you tell me theta" is answered yes, to leading
      order, via $\Theta \approx -\tfrac{1}{2}\sigma^{2}S^{2}\Gamma$, stated
      cold. The expected justification for why it must hold is no-arbitrage:
      a delta-hedged portfolio's drift is fixed by the riskless rate, so
      gamma's contribution to that drift has to be offset by theta.
    pitfalls: >
      Applying the $r = 0$ form when rates are not actually negligible drops
      real terms from the identity. Assuming the relation holds instant to
      instant for a book that is not perfectly, continuously hedged mistakes
      an average-case identity for an exact one.
    recap: >
      For a delta-hedged option, theta is not independent — it equals minus
      one half of $\sigma^{2}S^{2}\Gamma$ exactly, the price Black–Scholes
      charges for every unit of convexity.
    dialogue:
      - part: A pattern on a Greek sheet
        teach: >
          A Greek sheet, all at $r = 0$. Option A: stock $72$, implied vol
          $28\%$, $\Gamma = 0.02785$, $\Theta = -5.66$ per year. Option B: stock
          $110$, strike $100$, vol $40\%$, $\Gamma = 0.01536$,
          $\Theta = -14.87$. Option C: stock $31$, strike $36$, vol $50\%$,
          $\Gamma = 0.02571$, $\Theta = -3.09$.
      - ask: >
          For option A, compute $\tfrac{1}{2}\sigma^{2}S^{2}\Gamma$.
        expects: "5.66"
        tolerance: 0.01
        hint: >
          $\sigma^{2} = 0.0784$ and $S^{2} = 5184$.
        feedback: >
          $\tfrac{1}{2}(0.0784)(5184)(0.02785) = 5.66$ — exactly minus option
          A's theta.
      - ask: >
          Now option B: what is $\tfrac{1}{2}\sigma^{2}S^{2}\Gamma$?
        expects: "14.87"
        tolerance: 0.02
        feedback: >
          $\tfrac{1}{2}(0.16)(12100)(0.01536) = 14.87$. Minus theta again.
      - ask: >
          Two out of two. What is going on?
        choices:
          - text: >
              A coincidence of at-the-money options.
            feedback: >
              Option B is ten points in the money, and it matched too. So does
              option C, out of the money: $\tfrac{1}{2}(0.25)(961)(0.02571)
              = 3.09$.
          - text: >
              The sheet computed theta from gamma as a shortcut.
            feedback: >
              The sheet used the separate Black–Scholes formulas for each. The
              match is a fact about the pricing function, not a shortcut.
          - text: >
              Something forces theta and gamma to be tied together.
            correct: true
            feedback: >
              Three options, three moneyness levels, three vols, and
              $\Theta = -\tfrac{1}{2}\sigma^{2}S^{2}\Gamma$ every time. The
              question is what forces it.
        feedback: >
          In and out of the money, high vol and low: theta is minus one half
          of $\sigma^{2}S^{2}\Gamma$.
      - reflect: >
          Delta-hedge option A. Over a short interval, the P&L expansion
          leaves $\tfrac{1}{2}\Gamma(\delta S)^{2} + \Theta\,\delta t$. If the
          stock moves as its $28\%$ vol says, $(\delta S)^{2}$ averages
          $\sigma^{2}S^{2}\,\delta t$. Why can that average not be positive, or
          negative, at $r = 0$?
        answer: >
          The hedged position has no directional exposure left. If its average
          P&L were positive, you could buy and hedge for a sure-looking
          profit; if negative, sell and hedge. With $r = 0$ cash earns
          nothing, so the hedged option must earn nothing too:
          $\tfrac{1}{2}\Gamma\sigma^{2}S^{2}\,\delta t + \Theta\,\delta t = 0$.
          Theta is the price of the convexity, fixed at exactly what the
          convexity is expected to earn.

      - part: Making it exact
        teach: >
          Itô's lemma makes the average exact. For $V(S, t)$ with
          $dS = \mu S\,dt + \sigma S\,dB$,
          $dV = (\Theta + \mu S\Delta + \tfrac{1}{2}\sigma^{2}S^{2}\Gamma)\,dt
          + \sigma S\Delta\,dB$, the $(dS)^{2} = \sigma^{2}S^{2}\,dt$ term
          surviving at order $dt$. Now hold $-\Delta$ shares, which adds
          $-\Delta\,dS = -\mu S\Delta\,dt - \sigma S\Delta\,dB$.
      - ask: >
          What is left of the hedged portfolio's change?
        choices:
          - text: >
              $(\Theta + \tfrac{1}{2}\sigma^{2}S^{2}\Gamma)\,dt$, with no
              random part.
            correct: true
            feedback: >
              Both the $dB$ term and the $\mu$ term cancel. What remains is
              deterministic, and does not depend on $\mu$ at all.
          - text: >
              $(\Theta + \mu S\Delta + \tfrac{1}{2}\sigma^{2}S^{2}\Gamma)\,dt$:
              the hedge removes the noise.
            feedback: >
              The share leg also carries $-\mu S\Delta\,dt$, which cancels the
              drift term. The hedge removes the stock's expected return along
              with its noise.
          - text: >
              $\sigma S\Delta\,dB$: hedging leaves only the noise.
            feedback: >
              That is the term the hedge exists to cancel. What it leaves is
              the drift from time and curvature.
        feedback: >
          A riskless change in value, over $dt$.
      - teach: >
          A riskless portfolio must earn the cash return, or there is
          arbitrage. At $r = 0$ that return is zero, so
          $\Theta + \tfrac{1}{2}\sigma^{2}S^{2}\Gamma = 0$: the gamma–theta
          balance, $\Theta = -\tfrac{1}{2}\sigma^{2}S^{2}\Gamma$. With rates it
          reads $\Theta + \tfrac{1}{2}\sigma^{2}S^{2}\Gamma + rS\Delta = rV$.
          Gamma and theta are one quantity with two signs: every unit of
          convexity is paid for in decay.

      - part: Using it, and where it bends
        ask: >
          A new line on the sheet, theta left blank: stock $125$, vol $22\%$,
          $\Gamma = 0.01597$, $r = 0$. What is its theta per calendar day?
        expects: "-0.01654"
        tolerance: 0.0002
        hint: >
          $\sigma^{2} = 0.0484$ and $S^{2} = 15625$; divide the annual figure
          by $365$.
        feedback: >
          $-\tfrac{1}{2}(0.0484)(15625)(0.01597) = -6.04$ per year, and
          $-6.04/365 = -0.0165$ per day. Given gamma and the vol, theta is
          not a separate input.
      - ask: >
          Now $r = 4\%$. Option A is struck at $72$ with six months left, so
          its numbers become $V = 6.363$, $\Delta = 0.579$ and
          $\tfrac{1}{2}\sigma^{2}S^{2}\Gamma = 5.574$. Using the full relation,
          what is $\Theta$ per year?
        expects: "-6.99"
        tolerance: 0.01
        hint: >
          $\Theta = rV - rS\Delta - \tfrac{1}{2}\sigma^{2}S^{2}\Gamma$.
        feedback: >
          $0.04(6.363) - 0.04(72)(0.579) - 5.574 = 0.255 - 1.668 - 5.574
          = -6.99$. The $r = 0$ form would have said $-5.57$, off by about
          a fifth: dropping rates is a modelling choice, not a law.
      - ask: >
          A junior checks option A's theta against his own forecast of $33\%$
          realized vol: $\tfrac{1}{2}(0.1089)(5184)(0.02785) = 7.86$, not
          $5.66$. Which is right?
        choices:
          - text: >
              $7.86$: the identity should use the best estimate of the vol
              the stock will actually realize.
            feedback: >
              The identity is a fact about the pricing function, and the
              price, gamma and theta were all computed at $28\%$. Plug in a
              different $\sigma$ and you are mixing two different functions.
          - text: >
              $5.66$: $\sigma$ in the identity is the vol the option is priced
              and hedged at.
            correct: true
            feedback: >
              Theta is the rent charged at the implied vol. Whether the stock
              then realizes $33\%$ decides whether the rent was cheap — a
              separate question, and a profitable one.
          - text: >
              Neither: the identity holds only for at-the-money options.
            feedback: >
              Options B and C were in and out of the money, and both matched.
              Moneyness is not a hypothesis.
        feedback: >
          The balance holds at the implied vol, for a continuously hedged
          book. A mismatch on a sheet means a stale number or two different
          vols. Said aloud: "theta is minus one half sigma squared S squared
          gamma — the hedged book has no risk, so it must earn the riskless
          rate."

  - node: quant-finance.greeks.vol-pnl
    hook: >
      "Is this hedged position a bet on direction or on volatility" has one
      answer once you see this identity, and interviewers use it to check that
      you can cleanly separate a delta bet from a vol bet.
    explanation: >
      Substituting the gamma-theta identity into the P&L expansion removes
      theta as a free-standing term and replaces it with the volatility the
      option was hedged at — recall implied volatility as exactly that number.
      What is left is striking: once delta-hedged, the position's P&L no
      longer depends on direction at all, only on how much spot actually moved
      squared against how much the price assumed it would move squared. Every
      instant, you are paid the realized variance that happened and charged
      the implied variance that was priced in.

      That framing makes the trade concrete: buy and hedge when you believe
      realized volatility will beat implied, sell and hedge when you believe
      the reverse, and the position's fate has nothing to do with whether spot
      ends up higher or lower than where it started.

      The dollar-gamma weighting is not a footnote — recall that gamma peaks
      at the strike, so this bet is not a clean, uniform statement about
      volatility everywhere; it is concentrated almost entirely in whatever
      happens while spot is near the strike, and largely indifferent to
      variance realized far away from it.
    worked: >
      With $\Gamma = 0.026$, $S = 50$ hedged at implied $\sigma = 30\%$:
      suppose one trading day ($\delta t = 1/252$) realizes at an annualized
      $45\%$. Expected hedging P&L for that day is $\tfrac{1}{2}\Gamma S^{2}
      \delta t(\sigma_{\text{real}}^{2} - \sigma_{\text{imp}}^{2}) =
      0.5(0.026)(2500)(1/252)(0.2025 - 0.09) \approx 0.0147$ per option — about
      $7.34$ across a 500-lot book, positive because realized beat implied.
    interview: >
      "You bought and delta-hedged an option — under what condition do you
      make money" wants "realized volatility exceeding the implied volatility
      you hedged at," independent of which way spot ultimately moved.
    pitfalls: >
      Assuming a delta-hedged long option only pays off if the market "goes
      your way" directionally ignores that direction has already been hedged
      away — only the variance mismatch matters. Forgetting the dollar-gamma
      weighting overstates how much a large move far from the strike, where
      gamma has already decayed away, actually contributes.
    recap: >
      A delta-hedged option's P&L is entirely a bet on realized variance
      against the implied variance it was hedged at, weighted continuously by
      dollar gamma.
    dialogue:
      - part: Two days of a hedged call
        teach: >
          You buy a three-month at-the-money call on a stock at $95$ at an
          implied vol of $25\%$, $r = 0$, and delta-hedge it at every close.
          Its gamma is $0.0335$. Count time in trading days,
          $\delta t = 1/252$.
      - ask: >
          By the gamma–theta balance, what does one trading day of theta cost
          this option?
        expects: "0.0375"
        tolerance: 0.0005
        hint: >
          $|\Theta|\,\delta t = \tfrac{1}{2}\sigma^{2}S^{2}\Gamma\,\delta t$, with
          $\sigma^{2} = 0.0625$ and $S^{2} = 9025$.
        feedback: >
          $\tfrac{1}{2}(0.0625)(9025)(0.0335) = 9.45$ a year, and
          $9.45/252 = 0.0375$ a day.
      - ask: >
          Day one, the stock closes up $2\%$, a move of $1.9$. What does the
          hedged call make that day, convexity minus theta?
        expects: "0.023"
        tolerance: 0.0006
        feedback: >
          $\tfrac{1}{2}(0.0335)(1.9)^{2} = 0.0605$, less $0.0375$: $+0.023$.
      - ask: >
          On another day, starting from $95$, the stock moves only $0.5\%$, a
          move of $0.475$. What does the hedged call make?
        expects: "-0.0337"
        tolerance: 0.0005
        feedback: >
          $\tfrac{1}{2}(0.0335)(0.2256) = 0.0038$, less $0.0375$: $-0.0337$.
          A small move does not pay the day's rent.
      - reflect: >
          Write the day's P&L as $\tfrac{1}{2}\Gamma(\delta S)^{2} -
          \tfrac{1}{2}\sigma^{2}S^{2}\Gamma\,\delta t$ and pull out
          $\tfrac{1}{2}\Gamma S^{2}$. What is left in the bracket, in words,
          and what decides whether a day makes money?
        answer: >
          The bracket is $(\delta S/S)^{2} - \sigma^{2}\,\delta t$: the squared
          return that actually happened, minus the variance the option's
          price implied for one day. A day makes money exactly when the
          realized squared return beats the implied one — when the move,
          in percent, exceeds $\sigma\sqrt{\delta t}$, whichever way it went.
      - ask: >
          At $25\%$ implied, what is that daily threshold $\sigma\sqrt{\delta t}$,
          as a fraction of the stock price?
        expects: "0.01575"
        tolerance: 0.0001
        feedback: >
          $0.25/\sqrt{252} = 0.25/15.87 = 0.01575$, about $1.575\%$. The $2\%$
          day beat it and paid; the $0.5\%$ day fell short and cost.

      - part: A bet on variance
        teach: >
          One period of a delta-hedged long option earns
          $\tfrac{1}{2}\Gamma S^{2}[(\delta S/S)^{2} - \sigma_{\text{imp}}^{2}
          \,\delta t]$: you collect the squared return that occurred and pay
          for the variance the price implied. Summed to expiry,
          $\tfrac{1}{2}\int \Gamma_t S_t^{2}(\sigma_{\text{real}}^{2} -
          \sigma_{\text{imp}}^{2})\,dt$. Buy and hedge when you expect realized
          to beat implied; sell and hedge when you expect the reverse.
      - ask: >
          Over a month the stock swings about $2\%$ most days and ends exactly
          at $95$. What has the hedged long call done?
        choices:
          - text: >
              Roughly nothing: the stock ended where it started.
            feedback: >
              The hedge removed direction, so where the stock ended is beside
              the point. Each $2\%$ day paid more than its rent.
          - text: >
              Lost: a month of theta and no net move to show for it.
            feedback: >
              Theta was charged for $1.575\%$ days. The stock delivered $2\%$
              days, so the convexity more than paid for it.
          - text: >
              Made money: the squared returns beat the implied variance, and
              direction never entered.
            correct: true
            feedback: >
              Realized vol of about $2\% \times 15.87 = 32\%$ against $25\%$
              implied. That is the whole bet.
        feedback: >
          A delta-hedged option is a variance trade. Net displacement is not
          in the formula.
      - ask: >
          Suppose realized comes in at $32\%$ over $21$ trading days with the
          stock near the strike throughout, so $\tfrac{1}{2}\Gamma S^{2}$ stays
          near $151$. Using
          $\tfrac{1}{2}\Gamma S^{2}(\sigma_{\text{real}}^{2} -
          \sigma_{\text{imp}}^{2})\,T$, what does the call make?
        expects: "0.503"
        tolerance: 0.006
        feedback: >
          $151 \times (0.1024 - 0.0625) \times 21/252 = 151 \times 0.0399 \times
          0.0833 = 0.502$, about half a dollar per option on a call that cost
          about $4.7$.
      - ask: >
          You expect this stock to realize $18\%$, against $25\%$ implied.
          What trade expresses that view?
        choices:
          - text: >
              Buy puts: low vol means the stock will drift down.
            feedback: >
              Low vol says nothing about direction. That trade is a
              directional bet that happens to be long vol, the opposite of
              your view.
          - text: >
              Buy the call and delta-hedge.
            feedback: >
              That is long variance: it pays when realized beats implied. You
              expect the reverse.
          - text: >
              Sell the call and delta-hedge.
            correct: true
            feedback: >
              Short and hedged, you collect the implied variance and pay the
              realized. At $18\%$ against $25\%$, the rent exceeds the damage.
        feedback: >
          Long and hedged is long realized variance; short and hedged is short
          it. Direction is hedged away either way.

      - part: Weighted by dollar gamma
        ask: >
          Two and a half weeks later the stock has slid to $80$, far below the
          $95$ strike, and dollar gamma $\tfrac{1}{2}\Gamma S^{2}$ is down to
          $47.7$ from about $151$. A $2\%$ day there earns what fraction of
          the same $2\%$ day near the strike?
        expects: "0.32"
        tolerance: 0.01
        hint: >
          The bracket is the same; only the weight in front changes.
        feedback: >
          $47.7/151 = 0.32$. The same squared return, a third of the payout,
          because the option has less convexity away from the strike.
      - ask: >
          What does that weighting mean for the variance bet?
        choices:
          - text: >
              Every day's variance counts equally toward the P&L.
            feedback: >
              Each day is weighted by that day's dollar gamma, which is far
              from constant. Big days far from the strike are nearly wasted.
          - text: >
              The bet is decided mostly by what happens while spot is near the
              strike.
            correct: true
            feedback: >
              Dollar gamma peaks at the strike and fades away from it, so that
              is where realized variance gets paid. It is a bet on gamma-weighted
              variance, not on variance plain.
          - text: >
              Days far from the strike count more, because the option has
              further to go.
            feedback: >
              Far from the strike, gamma has decayed: a $2\%$ day there paid a
              third of what it paid at the strike.
        feedback: >
          In an interview: "a hedged option earns one half gamma S squared
          times realized minus implied variance — a bet on variance, not
          direction, decided mostly near the strike."

  - node: quant-finance.greeks.gamma-scalping
    hook: >
      "Gamma scalping" is jargon interviewers use directly, and the expected
      answer is the specific mechanical trading pattern it names, not a vague
      restatement of "being long gamma."
    explanation: >
      The key realization is that the hedge trades themselves are the profit,
      not a separate strategy layered on top of them. A long-gamma position's
      delta rises on a rally and falls on a dip, so rebalancing to stay flat
      mechanically means selling into the rally and buying into the dip — a
      buy-low-sell-high discipline enforced automatically by the hedge, funded
      by the theta already established as the cost of owning that convexity.

      What decides the payoff is accumulated squared movement along the path,
      not net displacement — recall that this hedged P&L is exactly the
      realized-versus-implied variance bet. A market that oscillates
      constantly but ends exactly where it started can still have generated a
      month of scalping profit, while a market that drifts smoothly in one
      direction with little oscillation generates comparatively little, even
      if it travels further in net terms.

      Short gamma runs the identical machinery in reverse: staying flat means
      buying into strength and selling into weakness, chasing the market in
      whatever direction it is already moving — which is exactly why a
      short-gamma book's losses accelerate precisely when conditions get fast
      and volatile, rather than staying proportional to the size of the move.
    worked: >
      A 100-lot with total $\Gamma = 2.63$: spot oscillates up 2, back down 2,
      down 2, back up 2 over a week — two round trips of size $2$. Capture per
      round trip is about $\Gamma_{\text{total}}(\delta S)^{2} = 2.63(4) =
      10.52$, so about $21.04$ for the week. Weekly theta cost on the same lot
      is about $5.69$. Net for the week: $21.04 - 5.69 \approx 15.35$ — a week
      where realized oscillation beat the decay it was priced against.
    interview: >
      "Explain gamma scalping in one breath" wants: a long-gamma delta hedge
      automatically sells rallies and buys dips, banking roughly
      $\Gamma(\delta S)^{2}$ per round trip, funded by theta. A common
      follow-up asks what happens to a short-gamma hedger in a fast market —
      forced to chase the move, which is why their losses accelerate.
    pitfalls: >
      Assuming a large net directional move implies a large scalping profit
      confuses accumulated oscillation with net displacement — a smooth trend
      with little back-and-forth pays comparatively little. Assuming ever
      finer rebalancing is strictly better ignores the same transaction-cost
      cap that limits delta hedging generally.
    recap: >
      Long gamma turns delta hedging into an automatic buy-dips-sell-rallies
      program funded by theta; short gamma runs the same mechanics backwards,
      chasing the market in whichever direction it is already moving.
    dialogue:
      - part: A choppy morning
        teach: >
          You own $300$ at-the-money calls on a stock at $50$, delta-hedged,
          each with $\Gamma = 0.05$, so the position's delta moves $15$ shares
          per point. The stock rallies to $51$.
      - ask: >
          What do you trade to stay flat?
        choices:
          - text: >
              Buy $15$ shares, to stay with the rally.
            feedback: >
              Your calls' delta *rose* by $15$ shares, so you are now long
              $15$ shares of exposure. Buying more makes it $30$.
          - text: >
              Sell $15$ shares.
            correct: true
            feedback: >
              Delta rose by $\Gamma\,\delta S \times 300 = 15$, so you sell
              $15$ shares at $51$ — into the rally.
          - text: >
              Nothing: the hedge was set this morning.
            feedback: >
              The hedge was right at $50$. At $51$ it is $15$ shares stale, and
              you are exposed to the next move.
        feedback: >
          Long gamma makes the hedge sell after a rise.
      - ask: >
          The stock falls back to $50$, your delta drops back, and you buy the
          $15$ shares back. What did that round trip make?
        expects: "15"
        tolerance: 0.05
        feedback: >
          Sold $15$ at $51$, bought $15$ at $50$: $15$. In general a round trip
          of size $\delta S$ takes $\Gamma(\delta S)^{2}$ per option,
          $300(0.05)(1)^{2} = 15$.

      - part: Two weeks, two paths
        ask: >
          Path A: over a week the stock does that ten times, $50$ to $51$ and
          back, ending at $50$. Re-hedging at every turn, what do the
          round trips make in total?
        expects: "150"
        tolerance: 0.5
        feedback: >
          $10 \times 15 = 150$, on a stock that ended exactly where it began.
      - ask: >
          Path B: over another week the stock climbs steadily from $50$ to
          $55$ in five one-point steps, and you re-hedge after each step. What
          does convexity make on this path?
        expects: "37.5"
        tolerance: 0.2
        hint: >
          Each one-way step earns $\tfrac{1}{2}\Gamma(\delta S)^{2}$ per option
          against the hedge.
        feedback: >
          Each step earns $300 \times \tfrac{1}{2}(0.05)(1)^{2} = 7.5$, and
          there are five: $37.5$. A quarter of path A's take, on a path that
          moved five points net against path A's zero.
      - reflect: >
          Path A went nowhere and paid four times as much as path B. What is
          the scalper actually paid for?
        answer: >
          Accumulated squared movement along the path, not net displacement.
          Path A logged twenty one-point moves, each contributing
          $\tfrac{1}{2}\Gamma(\delta S)^{2}$; path B logged five. Every
          reversal lets the hedge sell high and then buy low, or buy low and
          sell high, and a trend gives few reversals to trade. That is the
          realized-variance bet, collected one round trip at a time.

      - part: The machine and its fee
        teach: >
          This is gamma scalping. A long-gamma hedger is forced to sell after
          every rally and buy after every dip, because delta rose and then
          fell: a buy-low, sell-high machine whose take per round trip is about
          $\Gamma(\delta S)^{2}$ and whose subscription fee is theta. Short
          gamma runs the same machine backwards. What pays is accumulated
          squared movement, not net direction.
      - ask: >
          The position's theta is about $4.6$ per calendar day. A dealer is
          short these $300$ calls, hedged, through path A's seven-day week.
          What is the dealer's P&L?
        expects: "-117.8"
        tolerance: 0.3
        feedback: >
          The dealer pays the $150$ the scalper made and collects
          $7 \times 4.6 = 32.2$ of theta: $-150 + 32.2 = -117.8$. Each re-hedge
          made the dealer buy after the rise and sell after the fall.
      - ask: >
          To save on trading, you re-hedge only when the stock moves $2$ points
          from your last hedge. What does path A pay you now?
        choices:
          - text: >
              About nothing: the swings never reach the band, so you never
              trade and each round trip returns what it made.
            correct: true
            feedback: >
              A band wider than the oscillation scalps none of it. You still
              pay the $32.2$ of theta for the week.
          - text: >
              The same $150$: gamma pays regardless of the hedging schedule.
            feedback: >
              The payment is collected through the hedge trades. Here no trade
              ever happens, so at $51$ you are up $7.5$ on paper and back at
              $50$ you have given it all back, ten times over.
          - text: >
              More than $150$: fewer trades means less spread paid.
            feedback: >
              Less spread, but also no scalps. Savings on trading are only
              worth it if the band still catches the moves.
        feedback: >
          Rebalance frequency is the tuning knob: hedge more often and you
          capture smaller oscillations, but pay more spread.
      - ask: >
          Back to re-hedging at every point on path A: twenty trades of $15$
          shares. At a cost of $0.05$ per share in spread, what does the
          hedging cost for the week?
        expects: "15"
        tolerance: 0.05
        feedback: >
          $20 \times 15 \times 0.05 = 15$, a tenth of the $150$ scalped. On
          smaller oscillations the take falls with the square of the move
          while the spread falls only in proportion to it, which is what sets
          the band.

  - node: quant-finance.greeks.atm-approx
    hook: >
      This is the number a desk carries in their head to sanity-check a quote
      before any model even loads — quoting it live, and inverting it for
      implied vol, is a genuine interview skill.
    explanation: >
      The approximation comes from linearizing the normal CDF right at the
      center of its curve: near zero, $N(x)$ is well approximated by its
      tangent line, $N(x) \approx \tfrac{1}{2} + \varphi(0)x$. At the money,
      $d_1$ is small and proportional to $\sigma\sqrt{T}$, so plugging that
      linearization into the call formula collapses everything to a single
      product of $S$, $\sigma$ and $\sqrt{T}$.

      Recognizing that this is really the vega formula in disguise makes the
      rule easy to reconstruct rather than memorize: an at-the-money call's
      value is, to leading order, proportional to the same $\varphi(d_1)$ that
      defines vega, scaled by how far $d_1$ has moved off center — which is
      itself proportional to $\sigma\sqrt{T}$.

      The practical payoff is a mental-math round trip: given price, back out
      implied volatility on the spot, without a model, whenever an at-the-money
      quote crosses the desk and there is no time to run one.
    worked: >
      A fresh instance, $S = K = 80$, $\sigma = 25\%$, $T = 0.5$: the
      approximation gives $0.4(0.25)(80)\sqrt{0.5} \approx 5.66$ against a
      true Black–Scholes value of $5.63$ — under half a percent off. Running it
      backward: a 6-month at-the-money call on that same 80 stock trading at
      $5$ implies $\sigma \approx 5/(0.4 \times 80 \times \sqrt{0.5}) \approx
      22.1\%$.
    interview: >
      "This 6-month at-the-money option is trading at X on an 80 stock —
      roughly what implied vol is that" wants the inverted rule computed live
      in your head. A related ask, deriving the constant $0.4$ on the spot, is
      answered with $1/\sqrt{2\pi}$.
    pitfalls: >
      Applying the rule away from the money is a category error — it is
      specifically an at-the-money-forward approximation and the error grows
      quickly off it. Using it for $\sigma\sqrt{T}$ well above about $0.3$ pushes
      past where the linear approximation of $N$ stays accurate.
    recap: >
      An at-the-money option costs about $0.4\sigma S\sqrt{T}$, the vega
      formula linearized at the money — invertible in your head to read
      implied vol straight off a quoted price.
    dialogue:
      - part: Thirty seconds, no calculator
        teach: >
          The interviewer says: "Four-month at-the-money call, stock at $66$,
          vol $36\%$, zero rates. Price it. You have thirty seconds and no
          calculator." Start the honest way, with Black–Scholes. Take
          $\sqrt{1/3} = 0.577$.
      - ask: >
          With $S = K$ and $r = 0$, $d_1 = \sigma\sqrt{T}/2$. What is $d_1$?
        expects: "0.104"
        tolerance: 0.001
        feedback: >
          $\sigma\sqrt{T} = 0.36 \times 0.577 = 0.208$, so $d_1 = 0.104$, and
          $d_2 = -0.104$.
      - ask: >
          At the money with $r = 0$, $C = S[N(d_1) - N(-d_1)] = S[2N(d_1) - 1]$.
          Given $N(0.104) = 0.5414$, what is $C$?
        expects: "5.46"
        tolerance: 0.01
        feedback: >
          $66(2 \times 0.5414 - 1) = 66(0.0828) = 5.46$. Correct, and it needed
          a normal table you will not have.
      - reflect: >
          The table is gone. $d_1$ is small, so you only need $N$ very near
          zero. What could you replace $N(x)$ with there, and what does it
          turn $S[2N(d_1) - 1]$ into?
        hint: >
          What is the slope of $N$ at $0$?
        answer: >
          Its tangent line: $N(x) \approx \tfrac{1}{2} + \varphi(0)x$, with
          $\varphi(0) = 1/\sqrt{2\pi} = 0.399$. Then
          $2N(d_1) - 1 \approx 2\varphi(0)d_1 = \varphi(0)\sigma\sqrt{T}$, and
          the call collapses to $S\sigma\sqrt{T}/\sqrt{2\pi}$, about
          $0.4\,\sigma S\sqrt{T}$: one product, no table.

      - part: The rule, both directions
        teach: >
          An at-the-money-forward European call or put is worth about
          $0.4\,\sigma S\sqrt{T}$, where $0.4$ is $1/\sqrt{2\pi} = 0.3989$. The
          error stays under about $1\%$ for $\sigma\sqrt{T} \le 0.3$, which
          covers nearly every listed option. Run it backwards to read
          volatility off a price: $\sigma \approx C/(0.4\,S\sqrt{T})$.
      - ask: >
          Price the interviewer's call by the rule.
        expects: "5.49"
        tolerance: 0.01
        feedback: >
          $0.4(0.36)(66)(0.577) = 5.49$, against the true $5.46$: half a
          percent off, in one line of arithmetic.
      - ask: >
          The follow-up: same stock and vol, but sixteen months instead of
          four. What does the rule say now?
        expects: "10.97"
        tolerance: 0.03
        hint: >
          Four times the time is how many times $\sqrt{T}$?
        feedback: >
          $\sqrt{T}$ doubles, so the price doubles: $2 \times 5.487 = 10.97$.
          The true value is $10.87$, a $1\%$ miss, because
          $\sigma\sqrt{T} = 0.42$ is past the comfortable range.
      - ask: >
          The four-month at-the-money call on this stock is quoted at $4.50$.
          What implied vol is that?
        expects: "0.295"
        tolerance: 0.002
        feedback: >
          $4.50/(0.4 \times 66 \times 0.577) = 4.50/15.24 = 0.295$, about
          $29.5\%$.
      - ask: >
          The number $0.4\,S\sqrt{T} = 15.24$ you just divided by — what is it?
        choices:
          - text: >
              The at-the-money delta, scaled up.
            feedback: >
              Delta is near $0.5$ at the money and has no $\sqrt{T}$ in it.
              This number is a price per unit of vol.
          - text: >
              The at-the-money vega, $S\varphi(d_1)\sqrt{T}$ with
              $\varphi(d_1) \approx 0.4$.
            correct: true
            feedback: >
              The full formula gives $15.12$ per unit of $\sigma$. At the money
              the price is nearly linear in $\sigma$, so price is vega times
              vol, and inverting it is dividing by vega.
          - text: >
              The one-standard-deviation move of the stock.
            feedback: >
              That is $\sigma S\sqrt{T}$, with the $\sigma$ in it: $5.49/0.4$.
              The divisor here has no $\sigma$, because it is what you are
              solving for.
        feedback: >
          The rule is the vega formula in disguise: $C \approx
          \operatorname{Vega} \times \sigma$ at the money.

      - part: Where the rule stops
        ask: >
          Which of these can you safely price with $0.4\,\sigma S\sqrt{T}$?
        choices:
          - text: >
              A three-month $72.6$-strike call on the $66$ stock at $20\%$
              vol.
            feedback: >
              Ten percent out of the money. The rule says $2.64$; the true
              value is $0.63$. It is an at-the-money rule, and off the money
              it has nothing to say.
          - text: >
              A two-year at-the-money call at $60\%$ vol.
            feedback: >
              $\sigma\sqrt{T} = 0.85$, far past where the tangent line tracks
              $N$. The rule says $22.40$ against a true $21.69$, more than
              $3\%$ off.
          - text: >
              A one-month at-the-money call at $45\%$ vol.
            correct: true
            feedback: >
              $\sigma\sqrt{T} = 0.13$, comfortably small: the rule gives
              $3.43$ against a true $3.42$.
        feedback: >
          Two conditions: at the money (forward), and $\sigma\sqrt{T}$ not much
          above $0.3$. Said aloud: "point four sigma S root T — the vega
          times the vol — good to about a percent for anything listed."

  - node: quant-finance.greeks.straddle-approx
    hook: >
      "Give me a rough one-sigma move" often gets answered by quoting this
      exact rule, since the straddle price and the expected absolute move
      share the same underlying constant.
    explanation: >
      A straddle pays $|S_T - K|$ at expiry, and since the terminal move is
      roughly normal with standard deviation $\sigma S\sqrt{T}$, its expected
      payoff is that standard deviation scaled by $\mathbb{E}|Z|$ for a
      standard normal — which is where the different constant comes from.

      Seeing why it is exactly double the call's constant, rather than some
      unrelated number, is the useful check: the call rule's $0.4$ is
      essentially half of $\sqrt{2/\pi} \approx 0.798$, because a call only
      captures the upside half of the terminal move, its downside floored at
      zero rather than contributing negatively the way a straddle's does.
      Doubling the call rule to get the straddle rule is therefore not a
      coincidence to memorize separately — it falls straight out of what a
      straddle actually captures that a lone call does not.

      The same inversion used for a single call applies here: a quoted
      straddle price, divided by $0.8S\sqrt{T}$, is a direct read on implied
      volatility, and the ratio of the straddle price to the true one-sigma
      move tells you how much of that move the market is charging you to break
      even on.
    worked: >
      A fresh instance, $S = K = 80$, $\sigma = 25\%$, $T = 0.5$:
      $0.8(0.25)(80)\sqrt{0.5} \approx 11.31$, with breakevens at about $68.69$
      and $91.31$. The one-sigma move itself is $\sigma S\sqrt{T} \approx
      14.14$, so the straddle costs almost exactly $0.8$ of the move it needs
      to break even — $11.31/14.14 = 0.8$.
    interview: >
      "What's a rough price for the 6-month at-the-money straddle on this 80
      stock at 25 vol" wants about $11$ computed live. A related ask, "what
      does the price tell you about the expected move," is answered with
      roughly $80\%$ of the one-sigma move.
    pitfalls: >
      Memorizing $0.8$ as an unrelated constant rather than the call rule
      doubled makes the number harder to reconstruct under pressure and easier
      to misremember. Applying it off the money repeats the same error the
      call version makes there.
    recap: >
      An at-the-money straddle costs about $0.8\sigma S\sqrt{T}$ — exactly
      twice the call rule, since $\sqrt{2/\pi}$ is $\mathbb{E}|Z|$ for the full
      two-sided payoff a straddle captures.
    dialogue:
      - part: What move is priced in
        teach: >
          A stock at $120$ reports earnings after Thursday's close. The
          at-the-money straddle expiring a week out — the $120$ call plus the
          $120$ put — costs $6.00$, with rates at zero. A colleague asks what
          move the options market is pricing.
      - ask: >
          At expiry the straddle pays $|S_T - 120|$. If $6.00$ is a fair price,
          what absolute move, on average under the pricing measure, is the
          market expecting?
        expects: "6"
        tolerance: 0.01
        feedback: >
          With $r = 0$ the price is the expected payoff, and the payoff is the
          absolute move. So the market prices an average move of $6$ points,
          $5\%$, either way.
      - ask: >
          By the at-the-money rule each leg is worth about $0.4\,\sigma S\sqrt{T}$.
          The straddle is then what multiple of the one-standard-deviation
          move $\sigma S\sqrt{T}$?
        expects: "0.8"
        tolerance: 0.005
        feedback: >
          Call plus put, each $0.4\,\sigma S\sqrt{T}$: the straddle is
          $0.8\,\sigma S\sqrt{T}$.
      - ask: >
          So what one-standard-deviation move, in points, is the market
          pricing for the week?
        expects: "7.5"
        tolerance: 0.02
        feedback: >
          $6.00/0.8 = 7.5$ points, about $6.25\%$. The straddle costs less than
          the one-sigma move: you pay for the *average* absolute move, which
          is smaller.
      - reflect: >
          Model the terminal move as $\sigma S\sqrt{T}\,Z$ with $Z$ standard
          normal. Where does the $0.8$ come from, and why is the call's
          constant exactly half of it?
        answer: >
          The straddle pays $|S_T - K| \approx \sigma S\sqrt{T}\,|Z|$, so it is
          worth about $\sigma S\sqrt{T}\,\mathbb{E}|Z|$, and
          $\mathbb{E}|Z| = \sqrt{2/\pi} = 0.798$. A call keeps only the
          positive part, $\mathbb{E}[\max(Z, 0)] = 1/\sqrt{2\pi} = 0.399$:
          by symmetry, exactly half of $\mathbb{E}|Z|$, which is the $0.4$ of
          the call rule.

      - part: The rule, and two ways to use it
        teach: >
          An at-the-money-forward straddle costs about $0.8\,\sigma S\sqrt{T}$,
          twice the call rule, with $0.8$ standing for
          $\sqrt{2/\pi} = 0.798 = \mathbb{E}|Z|$. Two uses: the straddle price
          is a direct vol quote, $\sigma \approx \text{straddle}/(0.8\,S\sqrt{T})$;
          and it is about $0.8$ of the implied one-sigma move it needs to
          break even.
      - ask: >
          With a week to expiry, $\sqrt{1/52} = 0.1387$. What implied vol is
          the $6.00$ straddle quoting?
        expects: "0.451"
        tolerance: 0.003
        feedback: >
          $6.00/(0.8 \times 120 \times 0.1387) = 6.00/13.31 = 0.451$, about
          $45\%$ — high for a stock, as it should be with earnings inside the
          week.
      - ask: >
          Over its last eight earnings, the stock moved $9$ points on average,
          either way. Is the straddle cheap or dear?
        choices:
          - text: >
              Cheap: it prices an average move of $6$, and history averages
              $9$.
            correct: true
            feedback: >
              The straddle price is the expected absolute move. If $9$ is the
              better forecast, paying $6$ for it is cheap — subject to how
              much eight observations really tell you.
          - text: >
              Dear: $9$ points is more than the $7.5$-point one-sigma move, so
              moves that size are unusual.
            feedback: >
              Compare like with like. The straddle prices the *average*
              absolute move at $6$; history's average absolute move is $9$.
              On that evidence the market is underpricing the move.
          - text: >
              Neither: the straddle has no view on direction, so history does
              not matter.
            feedback: >
              It has no view on direction, but it is entirely a view on size,
              and history speaks to size.
        feedback: >
          A straddle price is a statement about the size of the move. Compare
          it with your forecast of the average absolute move.

      - part: Stretching the rule
        ask: >
          If a one-month at-the-money straddle on this stock traded at the
          same $45.1\%$ vol, what would the rule price it at? Take
          $\sqrt{1/12} = 0.2887$.
        expects: "12.5"
        tolerance: 0.05
        feedback: >
          $0.8(0.451)(120)(0.2887) = 12.5$. About twice the one-week price,
          for a bit over four times the time: $\sqrt{52/12} = 2.08$.
      - ask: >
          Before you trade, the stock jumps to $132$. Does
          $0.8\,\sigma S\sqrt{T}$ still price the $120$ straddle?
        choices:
          - text: >
              Yes, with $S = 132$ in place of $120$.
            feedback: >
              That gives about $0.8(0.451)(132)(0.1387) = 6.6$, but the $120$
              call is now $12$ points in the money: the straddle is worth at
              least $12$. The rule has no intrinsic value in it.
          - text: >
              No: the straddle is now $12$ points in the money on one side,
              and the rule is for at-the-money.
            correct: true
            feedback: >
              Off the money the straddle is mostly intrinsic value plus a
              smaller time value. The $0.8$ rule, like the $0.4$ rule, only
              speaks at the money.
          - text: >
              Yes: a straddle has no direction, so moneyness does not matter.
            feedback: >
              Direction-free at the strike, yes. Twelve points away, one leg
              carries $12$ of intrinsic value and the rule misses it
              entirely.
        feedback: >
          In an interview: "an at-the-money straddle is point eight sigma S
          root T — expected absolute move, about eighty percent of one sigma —
          so the price is a vol quote." Use it at the money and nowhere else.
