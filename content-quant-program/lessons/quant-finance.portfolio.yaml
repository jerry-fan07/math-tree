unit: quant-finance.portfolio
opening: >
  Diversification is not a slogan; it is an algebra identity, and this unit
  exists to make that identity load-bearing. It opens with portfolio return
  and variance as direct consequences of linearity and the variance-of-a-sum
  rule you already have, then follows the covariance structure from a single
  pair of assets — where correlation alone decides how much risk cancels — to
  a large book, where only the average covariance survives, splitting every
  asset's risk into a compensated systematic part and an uncompensated
  idiosyncratic part. From there it turns operational: the minimum-variance
  and efficient-frontier machinery that produces optimal weights, the Sharpe
  ratio that scores a strategy independent of its size, and the leverage and
  CAPM results built on top of it. It closes on the fundamental law of active
  management, where the same diversification arithmetic that canceled
  idiosyncratic risk turns a small forecasting edge, repeated across many
  independent bets, into a real track record.
lessons:
  - node: quant-finance.portfolio.portfolio-weights
    hook: >
      Every later result in this unit — variance, Sharpe, beta — is a
      function of these same weights, so getting the definition exactly
      right here keeps every downstream formula honest. The one place people
      slip: summing to one bounds nothing about how large or how negative an
      individual weight can be.
    explanation: >
      A portfolio is nothing but a rule for combining $n$ existing return
      random variables $R_1,\dots,R_n$ with fixed numbers $w_1,\dots,w_n$
      chosen before the period starts, subject only to $\sum_i w_i = 1$. The
      portfolio return $R_p = \sum_i w_i R_i$ is a weighted sum of random
      variables with constant weights, so its expectation follows
      immediately from linearity: $\mathbb{E}[R_p] = \sum_i w_i \mu_i$. No
      assumption about how the $R_i$ move together enters this step —
      the mean of a sum never needs independence or a covariance structure,
      only the expectations of the individual pieces.

      The constraint is $\sum_i w_i = 1$, not $0 \le w_i \le 1$ for each
      $i$, and that gap is where two structural features of real portfolios
      live. A negative $w_i$ is a short position — you have sold the asset
      and used the proceeds elsewhere, so its return subtracts from the
      portfolio when the asset rises. And $\sum_i |w_i| > 1$ is leverage:
      long and short positions whose absolute sizes exceed the capital you
      actually have, financed by borrowing. Nothing about the expectation
      formula changes; $w$ is a number, positive, negative, or exceeding $1$
      in magnitude, and the formula treats it identically.

      One structural warning belongs here before it becomes a habit: this
      additivity is a property of simple returns, $R = (P_1-P_0)/P_0$.
      Simple returns aggregate cleanly across assets in a single period —
      exactly what made the linearity step work — but not across time, since
      compounding multiplies gross returns rather than adding them. Log
      returns are the mirror image: additive across time, not across
      assets, since the log of a weighted sum is not the weighted sum of
      logs. Using log returns inside $R_p=\sum_i w_i R_i$ is the standard
      error the formula tempts you into.
    worked: >
      Take a portfolio levered at $120\%$ long an asset with $\mu_1=7\%$ and
      $20\%$ short another with $\mu_2=3\%$, weights $w_1=1.2$ and
      $w_2=-0.2$ (summing to $1$). The expected return is
      $1.2(7)+(-0.2)(3)=8.4-0.6=7.8\%$ — the same weighted-average
      mechanics as a long-only two-asset mix, unaffected by one weight being
      negative and the other exceeding $1$.
    interview: >
      The question is usually stated flatly — "you hold weights $w_i$ in
      assets with means $\mu_i$, what's the portfolio's expected return?" —
      and the interviewer is listening for $\sum_i w_i\mu_i$ produced
      instantly, with no hedging about correlation, since correlation plays
      no role in the mean. A sharper follow-up tests whether you notice
      weights can be negative or sum past $1$ in absolute value.
    pitfalls: >
      Assuming long-only, treating each $w_i$ as bounded in $[0,1]$ because
      the weights sum to $1$ — the constraint says nothing of the kind. And
      plugging log returns into $R_p=\sum_i w_i R_i$: log returns are the
      right tool for compounding across time, not for combining across
      assets in one period.
    recap: >
      Portfolio return is the weighted sum $\sum_i w_i R_i$ with $\sum_i
      w_i=1$, so its expectation is exactly $\sum_i w_i\mu_i$ regardless of
      correlation — weights can be negative (short) or sum past one in
      magnitude (leverage).
    dialogue:
      - part: Forty thousand dollars, fifty thousand of stock
        teach: >
          You have $40{,}000$ dollars of capital. You sell short $10{,}000$
          dollars of a utility stock Y and put those proceeds, plus all your
          own money, into a tech stock X — so you hold $50{,}000$ dollars of X.
          Over the coming year X is expected to return $10\%$ and Y $6\%$.
      - ask: >
          Measured as a fraction of your capital, how much of X do you hold?
        expects: "1.25"
        hint: >
          Divide the dollars in X by the dollars you actually own.
        feedback: >
          $50{,}000 / 40{,}000 = 1.25$. The denominator is your capital, not
          the size of the position, so a fraction above $1$ is perfectly
          possible: it means part of the position is paid for with someone
          else's money.
      - ask: >
          On the same scale, what number describes your position in Y? Give
          it with its sign.
        expects: "-0.25"
        hint: >
          You owe the stock. If Y rises, does your capital go up or down?
        feedback: >
          $-10{,}000 / 40{,}000 = -0.25$. A short position loses when Y rises,
          so its fraction enters with a minus sign — and $1.25 + (-0.25) = 1$,
          which is just the statement that the net of everything you hold is
          the $40{,}000$ dollars you started with.
      - ask: >
          What is the expected return on your $40{,}000$ dollars, in percent?
        expects: "11"
        hint: >
          Each dollar of X earns $10\%$ for you; each dollar of Y you owe
          costs you $6\%$. Work in fractions of capital.
        feedback: >
          $1.25(10) + (-0.25)(6) = 12.5 - 1.5 = 11\%$. In dollars: X earns
          $5{,}000$, the short costs $600$, net $4{,}400$ on $40{,}000$, which
          is $11\%$.
      - ask: >
          A risk manager says you cannot quote that $11\%$ until you know how
          X and Y move together. Is that right?
        choices:
          - text: >
              Yes: if X and Y are strongly correlated the short hedges the long
              and the expected return falls.
            feedback: >
              Correlation changes how *spread out* the outcome is, not where it
              is centred. Each leg's expected dollars are what they are whatever
              the other leg does, and the expected total is their sum.
          - text: >
              Only if X and Y are independent can the means simply be added.
            feedback: >
              Independence is what lets you add *variances*. Means add for any
              two random variables at all: $\mathbb{E}[X + Y] = \mathbb{E}[X] +
              \mathbb{E}[Y]$ holds even when $Y = X$.
          - text: >
              No: the expected return needs only each asset's own mean.
            correct: true
            feedback: >
              Right. Expectation is linear, so the joint behaviour of X and Y
              never enters the mean — it will enter the variance, which is the
              next thing this unit builds.
        feedback: >
          The $11\%$ came from multiplying fixed numbers by expectations and
          adding: linearity of expectation, and nothing else.
      - reflect: >
          Your two fractions were $1.25$ and $-0.25$: one above $1$, one
          negative. What single condition did they still satisfy, and why is
          that the only condition worth imposing on them?
        answer: >
          They summed to $1$. Each fraction is a dollar position divided by the
          same capital, so their sum is net holdings over capital, which is
          $1$ by construction. Nothing forces a single fraction into $[0, 1]$:
          a negative one is a short, and one above $1$ is financed by a short
          or a loan. Bounding them individually would forbid the two most
          ordinary trades on a desk.

      - part: The definition, checked clause by clause
        teach: >
          Those fractions are the portfolio's weights. A portfolio of $n$
          assets is a vector $w = (w_1, \dots, w_n)$ with $\sum_i w_i = 1$,
          where $w_i$ is the fraction of capital in asset $i$. A weight
          $w_i < 0$ is a short; $\sum_i \lvert w_i \rvert > 1$ is leverage. The
          one-period simple return is $R_p = \sum_i w_i R_i$, so
          $\mathbb{E}[R_p] = \sum_i w_i \mu_i$ — exactly your computation.
      - ask: >
          Three proposed weight vectors over the same three assets:
          (a) $(0.5, 0.3, 0.2)$, (b) $(0.9, 0.4, -0.3)$,
          (c) $(0.7, 0.5, 0)$. Which is not a portfolio as written?
        choices:
          - text: >
              (b), because a weight of $0.9$ plus a short is too much risk.
            feedback: >
              Risky, perhaps, but legal: $0.9 + 0.4 - 0.3 = 1$. The definition
              has no opinion about how bold the weights are, only about their
              sum.
          - text: >
              (c), because its weights sum to $1.2$.
            correct: true
            feedback: >
              Right. $1.2$ of capital is invested and nothing says where the
              extra $0.2$ came from. Add the loan as a fourth holding — cash at
              weight $-0.2$ — and it becomes a legitimate levered portfolio.
          - text: >
              (c), because a zero weight means the asset is not in the
              portfolio at all.
            feedback: >
              A zero weight is allowed; the asset is simply not held. The fault
              in (c) is elsewhere — add up its weights.
        feedback: >
          The sum-to-one clause is bookkeeping: every dollar of exposure has to
          be paid for by capital, a short, or a loan, and the weights must say
          which.
      - ask: >
          Take vector (b). What is its gross exposure
          $\sum_i \lvert w_i \rvert$?
        expects: "1.6"
        hint: >
          Add the sizes of the positions, ignoring their signs.
        feedback: >
          $0.9 + 0.4 + 0.3 = 1.6$. Net exposure is $1$, gross is $1.6$: the
          book carries $1.6$ dollars of positions per dollar of capital, which
          is leverage even though no weight exceeds $1$.

      - part: The returns the formula will accept
        teach: >
          Split $100$ dollars evenly between two stocks. Over one month stock A
          doubles and stock B halves.
      - ask: >
          What is the portfolio's return over the month, in percent?
        expects: "25"
        hint: >
          Follow the dollars: what is each $50$ worth at month end?
        feedback: >
          A's $50$ becomes $100$ and B's $50$ becomes $25$, so $125$ dollars
          in all: $+25\%$. As weights times simple returns,
          $0.5(100) + 0.5(-50) = 25\%$.
      - ask: >
          An analyst stores log returns: $\ln 2 \approx 0.693$ for A and
          $\ln 0.5 \approx -0.693$ for B. Weighting those $50/50$ gives $0$, so
          the analyst reports the book flat for the month. What went wrong?
        choices:
          - text: >
              Nothing: log returns are the more accurate measure, and the $25\%$
              is a compounding artefact.
            feedback: >
              The $25\%$ is $25$ real dollars on $100$; no measure can make
              them disappear. The weighted sum of log returns is simply not the
              portfolio's log return, which is $\ln 1.25 \approx 0.223$.
          - text: >
              The weights should have been recomputed at month end.
            feedback: >
              Weights are fixed at the start of the period, and $50/50$ was
              correct then. The error is in which returns were fed to the
              weighted sum.
          - text: >
              Log returns add across time, not across assets; only simple
              returns combine by weights.
            correct: true
            feedback: >
              Right. $R_p = \sum_i w_i R_i$ is an identity about dollars, and
              dollars are what simple returns measure. The log of a weighted
              sum is not the weighted sum of logs.
        feedback: >
          Combine assets with simple returns; chain periods with log returns.
          Asked in an interview for a portfolio's expected return, say
          $\sum_i w_i \mu_i$ at once, add that no correlation enters, and note
          that the weights may be negative or exceed one.
  - node: quant-finance.portfolio.portfolio-variance
    hook: >
      Variance is where correlation finally enters the story, and the rest
      of this unit — diversification, the frontier, beta — is downstream of
      one fact: a portfolio's risk is not the weighted average of the
      assets' individual risks.
    explanation: >
      Portfolio variance needs no new machinery: it is the
      variance-of-a-weighted-sum identity, $\operatorname{Var}(\sum_i a_i
      X_i)=\sum_i\sum_j a_i a_j\operatorname{Cov}(X_i,X_j)$, applied with
      $a_i=w_i$ and $X_i=R_i$. Collecting all the covariances
      $\operatorname{Cov}(R_i,R_j)$ into a matrix $\Sigma$ with
      $\Sigma_{ii}=\sigma_i^{2}$ on the diagonal gives
      $\operatorname{Var}(R_p)=\sum_i\sum_j w_i w_j\Sigma_{ij}=w'\Sigma w$:
      the double sum written as a matrix product, nothing more.

      The double sum has $n$ diagonal terms, each an individual variance,
      against $n(n-1)$ off-diagonal terms, each a covariance. Once $n$ is
      more than a handful, the covariance terms outnumber the variance
      terms by an order of magnitude, so the object that decides portfolio
      risk in a real book is the covariance structure, not any one asset's
      standalone volatility — a theme the rest of this unit only sharpens.

      For two assets the sum expands by hand: $\Sigma_{11}=\sigma_1^{2}$,
      $\Sigma_{22}=\sigma_2^{2}$, and the two off-diagonal entries
      $\Sigma_{12}=\Sigma_{21}=\rho\sigma_1\sigma_2$ each get weight
      $w(1-w)$, appearing once in each order — hence the factor of $2$:
      $\sigma_p^{2}=w^{2}\sigma_1^{2}+(1-w)^{2}\sigma_2^{2}
      +2w(1-w)\rho\sigma_1\sigma_2$. Every later two-asset formula in this
      unit is built directly on this expansion.
    worked: >
      Put $w=0.4$ in an asset with $\sigma_1=25\%$ and $0.6$ in one with
      $\sigma_2=15\%$, correlated at $\rho=-0.2$. Then
      $\sigma_p^{2}=0.16(0.0625)+0.36(0.0225)
      +2(0.4)(0.6)(-0.2)(0.25)(0.15)=0.01+0.0081-0.0036=0.0145$, so
      $\sigma_p\approx12.0\%$ — well under the weighted-average volatility
      $0.4(25)+0.6(15)=19\%$, the negative correlation doing extra work
      beyond what positive correlation would.
    interview: >
      "Derive the variance of a two-asset portfolio" is close to verbatim,
      and the interviewer wants the double-sum expansion produced live, not
      just the formula recited — in particular, catching the factor of $2$
      on the cross term because $\Sigma_{12}$ and $\Sigma_{21}$ are the same
      number appearing twice in the sum.
    pitfalls: >
      Dropping the factor of $2$ on the covariance term — it is not
      optional, the sum genuinely visits the $(1,2)$ and $(2,1)$ entries
      separately. And writing $\rho$ where $\Sigma_{ij}$ belongs in the
      general $w'\Sigma w$ formula: the matrix holds covariances, and
      converting requires $\Sigma_{ij}=\rho_{ij}\sigma_i\sigma_j$.
    recap: >
      Portfolio variance is the weighted-sum-of-covariances identity
      applied to $R_p$, written $w'\Sigma w$ — $n$ variance terms against
      $n(n-1)$ covariance terms, so covariance structure dominates once you
      hold more than a few names.
    dialogue:
      - part: Two stocks at twenty percent each
        teach: >
          Two stocks each have annual volatility $20\%$. You put half your
          capital in each. For now, assume the two are independent: nothing
          one does tells you anything about the other.
      - ask: >
          What is the portfolio's volatility, in percent? Two decimals.
        expects: "14.14"
        tolerance: 0.05
        hint: >
          Work with variances: $\operatorname{Var}(aX) = a^{2}\operatorname{Var}(X)$,
          and independent variances add. Take the square root at the end.
        feedback: >
          $\operatorname{Var}(0.5A + 0.5B) = 0.25(0.04) + 0.25(0.04) = 0.02$,
          and $\sqrt{0.02} \approx 0.1414$, so $14.14\%$ — well under the
          $20\%$ each stock carries alone.
      - ask: >
          The weighted average of the two volatilities is $20\%$. Why did the
          portfolio come out lower?
        choices:
          - text: >
              Some of A's bad days land on B's good days, and the halves
              partly cancel.
            correct: true
            feedback: >
              Right. Because they move independently, a loss in one is often
              offset by a gain in the other, so the sum is less spread out than
              either half.
          - text: >
              The weights got squared, and $0.5^{2}$ shrinks everything.
            feedback: >
              Squaring alone cannot be the reason. If B were a copy of A, the
              same squared weights would give $0.25(0.04) + 0.25(0.04) +
              2(0.25)(0.04) = 0.04$, a volatility of exactly $20\%$. The
              shrinkage comes from the cross term being small — and independence
              makes it zero.
          - text: >
              It is a slip: volatilities of a mix should average, so the answer
              is $20\%$.
            feedback: >
              Volatilities are not linear in the weights; variances of sums
              are built from covariances. The $14.14\%$ is right, and the $20\%$
              holds only when the two stocks move in lockstep.
        feedback: >
          Mixing lowers risk to the extent the pieces fail to move together.
          What remains is to say exactly how much.
      - ask: >
          Same two stocks, same $50/50$, but now their correlation is $0.5$.
          What is the portfolio's volatility, in percent? Two decimals.
        expects: "17.32"
        tolerance: 0.05
        hint: >
          $\operatorname{Var}(X + Y) = \operatorname{Var}(X) +
          \operatorname{Var}(Y) + 2\operatorname{Cov}(X, Y)$, with
          $\operatorname{Cov}(A, B) = \rho\sigma_A\sigma_B$.
        feedback: >
          $\operatorname{Cov}(A, B) = 0.5(0.2)(0.2) = 0.02$. Then
          $0.25(0.04) + 0.25(0.04) + 2(0.5)(0.5)(0.02) = 0.02 + 0.01 = 0.03$,
          and $\sqrt{0.03} \approx 17.32\%$: between the independent $14.14\%$
          and the lockstep $20\%$.
      - reflect: >
          Going from independent to correlated added exactly one piece to the
          variance. Describe that piece, and say what the variance would be
          built from with three stocks, or with ten.
        answer: >
          The added piece is a covariance term: each pair's covariance times
          the product of the two weights, counted once for $(A, B)$ and once
          for $(B, A)$. With more stocks every ordered pair contributes such a
          term, so the variance is a sum over all pairs $i, j$ of
          $w_i w_j \operatorname{Cov}(R_i, R_j)$ — the variances are just the
          terms with $i = j$.

      - part: Every pair, counted twice
        teach: >
          Collect the covariances into a matrix $\Sigma$ with
          $\Sigma_{ij} = \operatorname{Cov}(R_i, R_j)$ and
          $\Sigma_{ii} = \sigma_i^{2}$. Then
          $\operatorname{Var}(R_p) = \sum_i \sum_j w_i w_j \Sigma_{ij}$,
          written $w'\Sigma w$. For two assets at weights $w$ and $1 - w$ it
          expands to $\sigma_p^{2} = w^{2}\sigma_1^{2} + (1-w)^{2}\sigma_2^{2}
          + 2w(1-w)\rho\sigma_1\sigma_2$.
      - ask: >
          Where does the $2$ on the cross term come from?
        choices:
          - text: >
              It is a convention that makes the formula match the $\rho = 1$
              case.
            feedback: >
              It does make $\rho = 1$ a perfect square, but that is a
              consequence. The $2$ is forced by the double sum itself.
          - text: >
              The double sum visits $\Sigma_{12}$ and $\Sigma_{21}$ separately,
              and they are the same number.
            correct: true
            feedback: >
              Right. The sum runs over ordered pairs, and covariance is
              symmetric, so the $(1, 2)$ and $(2, 1)$ terms are equal and
              combine into $2w_1 w_2 \Sigma_{12}$.
          - text: >
              Covariance is defined with a factor of $2$ built in.
            feedback: >
              $\operatorname{Cov}(X, Y) = \mathbb{E}[XY] - \mathbb{E}[X]\mathbb{E}[Y]$
              has no $2$ in it. The $2$ counts terms; it does not live inside
              any of them.
        feedback: >
          Dropping that $2$ is the classic slip when the expansion is done
          live. Write the $2 \times 2$ grid of terms and it cannot happen.
      - ask: >
          Put $0.7$ in an asset with $\sigma_1 = 10\%$ and $0.3$ in one with
          $\sigma_2 = 40\%$, correlation $0.25$. What is $\sigma_p$, in
          percent? Two decimals.
        expects: "15.33"
        tolerance: 0.05
        hint: >
          Three terms: $0.49\sigma_1^{2}$, $0.09\sigma_2^{2}$, and
          $2(0.7)(0.3)\rho\sigma_1\sigma_2$.
        feedback: >
          $0.49(0.01) + 0.09(0.16) + 2(0.21)(0.25)(0.1)(0.4) = 0.0049 +
          0.0144 + 0.0042 = 0.0235$, and $\sqrt{0.0235} \approx 15.33\%$. The
          weighted average volatility is $0.7(10) + 0.3(40) = 19\%$.
      - ask: >
          Now a book of $10$ assets. How many of the terms in
          $\sum_i \sum_j w_i w_j \Sigma_{ij}$ are covariance terms, with
          $i \ne j$?
        expects: "90"
        hint: >
          The grid is $10 \times 10$. How many cells are on the diagonal?
        feedback: >
          $100$ cells minus $10$ diagonal ones leaves $90$, that is
          $n(n-1)$. Variances are $10$ terms, covariances $90$.
      - ask: >
          Hold the $10$ assets at equal weights $0.1$. Each term carries
          weight $w_i w_j = 0.01$. What fraction of the total weight sits on
          the diagonal, on the variances?
        expects: "0.1"
        hint: >
          The weights $w_i w_j$ over the whole grid sum to
          $(\sum_i w_i)^{2}$.
        feedback: >
          The whole grid's weight is $(\sum_i w_i)^{2} = 1$, and the diagonal
          holds $10(0.01) = 0.1$ of it. The other $0.9$ multiplies
          covariances, which is why in a large book the covariances, not the
          individual volatilities, decide the risk.

      - part: When the weighted average stops being a ceiling
        ask: >
          Back to two uncorrelated $20\%$ stocks. Go $1.5$ long the first and
          $0.5$ short the second. What is $\sigma_p$, in percent? Two
          decimals.
        expects: "31.62"
        tolerance: 0.05
        hint: >
          With $\rho = 0$ only the two squared-weight terms survive.
        feedback: >
          $2.25(0.04) + 0.25(0.04) = 0.09 + 0.01 = 0.1$, and
          $\sqrt{0.1} \approx 31.62\%$. The weighted average of the
          volatilities is $1.5(20) - 0.5(20) = 20\%$.
      - ask: >
          So when is $\sigma_p \le \sum_i w_i \sigma_i$ guaranteed?
        choices:
          - text: >
              Always: portfolio risk never exceeds the weighted average risk.
            feedback: >
              The book you just built has $31.62\%$ against a weighted
              average of $20\%$. A short weight makes the "average" subtract a
              risk that, uncorrelated, still adds variance.
          - text: >
              Whenever every correlation is below $1$.
            feedback: >
              Your book had $\rho = 0$ and still broke the bound. Low
              correlation helps only when the weights are positive; with a
              short leg, low correlation means the hedge fails to hedge.
          - text: >
              When every weight is nonnegative.
            correct: true
            feedback: >
              Right. With $w_i \ge 0$, each covariance is at most
              $\sigma_i\sigma_j$, so $w'\Sigma w \le (\sum_i w_i\sigma_i)^{2}$,
              with equality only in lockstep. In general the bound is
              $\sum_i \lvert w_i \rvert \sigma_i$.
        feedback: >
          Asked to derive two-asset variance in an interview, write the
          $2 \times 2$ grid aloud, collect the symmetric pair into the $2$,
          and say that for long-only weights the answer sits strictly under
          the weighted average volatility whenever $\rho < 1$.
  - node: quant-finance.portfolio.covariance-psd
    hook: >
      "Is this correlation matrix even valid?" is a real question a desk
      asks about an estimated $\Sigma$, and the answer is a hard
      constraint, not a judgment call: no set of pairwise correlations is
      admissible unless it keeps $\Sigma$ positive semidefinite.
    explanation: >
      Portfolio variance gives $\operatorname{Var}(w'R)=w'\Sigma w$ for
      every weight vector $w$, and variance of any random variable can
      never be negative. So $w'\Sigma w\ge0$ must hold for every $w$ —
      exactly the defining property of a positive semidefinite matrix,
      applied to $\Sigma$ instead of an abstract $A$. Nothing new is being
      assumed; PSD-ness of the covariance matrix is a direct restatement of
      "variance is nonnegative."

      Singularity is the boundary case: $\Sigma$ is singular exactly when
      some nonzero $w$ achieves $w'\Sigma w=0$, i.e. some portfolio has
      exactly zero variance — a genuinely riskless combination built from
      risky assets, which happens when one holding duplicates another or
      some spread is identically constant. A practically common route to a
      singular $\Sigma$: an estimate built from $T$ return observations on
      $n$ assets has rank at most $T$, so whenever $T<n$ the estimate is
      automatically singular, and an optimizer handed it will manufacture
      "riskless" portfolios that are pure sampling artifacts.

      PSD-ness also constrains which correlation numbers can coexist, since
      correlations that are individually valid ($|\rho|\le1$ each) can
      still be jointly impossible. For a three-asset correlation matrix
      with entries $\rho_{12}=a$, $\rho_{13}=b$, $\rho_{23}=c$, PSD requires
      the determinant $1-a^{2}-b^{2}-c^{2}+2abc\ge0$: fixing two
      correlations pins the third into a band, not a free choice.
    worked: >
      With $\rho_{12}=0.7$ and $\rho_{13}=0.6$, the third correlation
      $\rho_{23}=c$ must satisfy $1-0.49-0.36-c^{2}+2(0.7)(0.6)c\ge0$, i.e.
      $c^{2}-0.84c-0.15\le0$. The roots of that quadratic are
      $c=(0.84\pm\sqrt{0.84^{2}+0.6})/2\approx(0.84\pm1.143)/2$, giving
      $c\in[-0.15,0.99]$ — so quoting $\rho_{23}=-0.3$ alongside those two
      numbers would already be inconsistent, before a single price is
      observed.
    interview: >
      Interviewers sometimes hand you two correlations and ask for the
      feasible range of the third, or ask directly why a covariance matrix
      can't have arbitrary entries; the strong answer starts from
      $w'\Sigma w=\operatorname{Var}(w'R)\ge0$ rather than quoting "PSD" as
      an isolated fact.
    pitfalls: >
      Checking only that each pairwise $|\rho_{ij}|\le1$ and declaring the
      matrix valid — individually valid correlations can still be jointly
      inconsistent, as the worked bound shows. And forgetting that $T<n$
      makes an estimated $\Sigma$ singular by construction, not by bad luck
      — feeding it to an unconstrained optimizer is asking it to find and
      exploit the artifact.
    recap: >
      $\Sigma$ must be PSD because $w'\Sigma w$ is a variance and variances
      can't be negative — which bounds what correlation numbers can
      coexist and flags an estimate with $T<n$ as automatically singular.
    dialogue:
      - part: A risk report that cannot be true
        teach: >
          A risk system reports three stocks, each with volatility $10\%$, and
          correlations $\rho_{AB} = 0.8$, $\rho_{AC} = 0.8$ and
          $\rho_{BC} = -0.8$.
      - ask: >
          Taken one number at a time, is anything wrong with this report?
        choices:
          - text: >
              Yes: $-0.8$ is not a valid correlation.
            feedback: >
              Any number in $[-1, 1]$ is a valid correlation for a single
              pair. $-0.8$ alone is unremarkable.
          - text: >
              No: every correlation lies in $[-1, 1]$.
            correct: true
            feedback: >
              Right — one number at a time, each is fine. Hold on to the
              phrase "one at a time".
          - text: >
              Yes: correlations of $0.8$ are too high for real stocks.
            feedback: >
              Two stocks in the same industry can easily correlate at $0.8$.
              Nothing about a single number here is implausible.
        feedback: >
          Every pairwise check passes. Now test the three numbers together.
      - ask: >
          Hold $1$ dollar long A and $1$ dollar short each of B and C. Using
          the reported numbers, what is the variance of this position's
          return in squared dollars? Keep the sign.
        expects: "-0.018"
        hint: >
          Variances $0.01$ each; covariances $\rho \times 0.01$. The weights
          are $(1, -1, -1)$: add $w_i^{2}\sigma_i^{2}$ for each stock, then
          $2w_i w_j\operatorname{Cov}$ for each of the three pairs.
        feedback: >
          The variances give $3(0.01) = 0.03$. The pairs: $AB$ gives
          $2(1)(-1)(0.008) = -0.016$, $AC$ the same $-0.016$, and $BC$ gives
          $2(-1)(-1)(-0.008) = -0.016$. Total $0.03 - 0.048 = -0.018$.
      - ask: >
          A variance of $-0.018$. What does that tell you?
        choices:
          - text: >
              The position is better than riskless, a kind of arbitrage.
            feedback: >
              No random variable has negative variance: it is an average of
              squares. The number is not a property of the position but a
              proof that the inputs describe no possible world.
          - text: >
              One of the volatilities must be misreported.
            feedback: >
              Scale every volatility however you like and the variance
              scales with them, still negative. The fault is in how the three
              correlations fit together.
          - text: >
              The three correlations cannot hold at once.
            correct: true
            feedback: >
              Right. If A tracks B closely and A tracks C closely, then B and C
              must track each other too; $-0.8$ contradicts the other two.
        feedback: >
          Each number passed alone; the set fails together. A single
          position's variance was enough to expose it.
      - reflect: >
          You refuted the report by finding one weight vector with a negative
          variance. Turn that around: what must be true of a matrix, for every
          weight vector, before it can be anyone's covariance matrix?
        answer: >
          For every $w$, $w'\Sigma w$ is the variance of the position
          $w'R$, and a variance cannot be negative. So $w'\Sigma w \ge 0$ for
          all $w$ — the matrix must be positive semidefinite. Checking
          entries one at a time is not enough; the condition is about every
          combination at once.

      - part: Every weight vector at once
        teach: >
          That is the proposition: every covariance matrix is symmetric positive
          semidefinite, $w'\Sigma w \ge 0$ for every $w$. It is singular exactly when some nonzero $w$ has
          $\operatorname{Var}(w'R) = 0$ — some combination of the assets is
          riskless. For three correlations $a, b, c$, PSD comes down to the
          determinant $1 - a^{2} - b^{2} - c^{2} + 2abc \ge 0$.
      - ask: >
          The proof is one line. Which step carries it?
        choices:
          - text: >
              Every entry of $\Sigma$ is a covariance, and covariances are
              bounded by $\sigma_i\sigma_j$.
            feedback: >
              That bound holds entry by entry, and the bad report satisfied
              it. Entry-wise facts cannot give PSD, which is about every
              combination.
          - text: >
              $w'\Sigma w$ is the variance of a real position, and variances
              are nonnegative.
            correct: true
            feedback: >
              Right. Portfolio variance turns the quadratic form into a
              variance, and the rest is the fact that a mean of squares is at
              least $0$.
          - text: >
              $\Sigma$ is symmetric, and symmetric matrices are PSD.
            feedback: >
              Symmetric matrices can have negative eigenvalues: the report's
              correlation matrix is symmetric and has one. Symmetry is
              needed, not sufficient.
        feedback: >
          Name the step aloud in an interview: $w'\Sigma w$ is a variance.
          Quoting "covariance matrices are PSD" as a bare fact earns less.
      - ask: >
          Keep $\rho_{AB} = \rho_{AC} = 0.8$. What is the smallest value of
          $\rho_{BC}$ the determinant condition allows?
        expects: "0.28"
        hint: >
          With $a = b = 0.8$ the condition is
          $1 - 0.64 - 0.64 - c^{2} + 1.28c \ge 0$. Find the roots in $c$.
        feedback: >
          The condition is $c^{2} - 1.28c + 0.28 \le 0$, with roots
          $c = (1.28 \pm \sqrt{1.6384 - 1.12})/2 = (1.28 \pm 0.72)/2$, so
          $c \in [0.28, 1]$. Equivalently $ab - \sqrt{(1-a^{2})(1-b^{2})} =
          0.64 - 0.36 = 0.28$.
      - ask: >
          At the boundary $\rho_{BC} = 0.28$ exactly, what is true of the
          correlation matrix?
        choices:
          - text: >
              It is invalid, since the determinant is zero.
            feedback: >
              Zero satisfies $\ge 0$. The boundary is attainable; only values
              below $0.28$ are impossible.
          - text: >
              It is singular: some nonzero combination of A, B and C has zero
              variance.
            correct: true
            feedback: >
              Right. A zero determinant means a zero eigenvalue, and its
              eigenvector is a riskless combination of three risky stocks.
          - text: >
              It is positive definite, since every eigenvalue is now positive.
            feedback: >
              The determinant is the product of the eigenvalues. If it is $0$,
              at least one eigenvalue is $0$, so the matrix is semidefinite
              and not definite.
        feedback: >
          Inside the band the matrix is definite; on its edge it is singular,
          and a riskless combination exists.

      - part: Riskless portfolios that are not there
        ask: >
          Stock A, stock B, and a fund C that holds exactly half A and half B.
          Which weight vector on $(A, B, C)$ has zero variance?
        choices:
          - text: >
              $(1, 1, -2)$
            correct: true
            feedback: >
              Right: $A + B - 2C = A + B - (A + B) = 0$ in every state of the
              world. The estimated $\Sigma$ for these three is singular, and
              that is a fact about the holdings, not the data.
          - text: >
              $(0.5, 0.5, 0)$
            feedback: >
              That is just C's own mix, which carries C's full risk. To cancel
              it you have to hold C against it.
          - text: >
              $(1, -1, 0)$
            feedback: >
              A minus B is a spread with real risk unless A and B are the same
              stock. C plays no part in it.
        feedback: >
          A duplicated holding is the honest way to get a singular $\Sigma$.
          The other way is less honest.
      - ask: >
          A quant estimates $\Sigma$ for $50$ stocks from $20$ monthly returns
          and hands it to an optimizer, which reports a $50$-stock portfolio
          with estimated volatility $0.0\%$. What happened?
        choices:
          - text: >
              The optimizer found a genuine hedge the market has missed.
            feedback: >
              Any $50$ stocks would produce the same miracle from $20$
              months. The zero is a property of the estimate's shape, not of
              the stocks.
          - text: >
              The estimate has rank at most $20$, so at least $30$ directions
              show zero variance, and the optimizer found one.
            correct: true
            feedback: >
              Right. Each observation is one vector, and $20$ vectors span at
              most $20$ dimensions of a $50$-dimensional space. Every direction
              orthogonal to them looks riskless in-sample and is not.
          - text: >
              Rounding: the true volatility is small but positive.
            feedback: >
              Rounding cannot produce an exact zero across a whole subspace.
              The estimate is exactly singular, by construction, whenever $T$
              is below $n$.
        feedback: >
          With $T < n$ the sample $\Sigma$ is singular automatically, and an
          optimizer will invent riskless portfolios out of sampling noise.
          Asked whether a covariance matrix can have arbitrary entries, start
          from $w'\Sigma w = \operatorname{Var}(w'R) \ge 0$ and give the three
          correlations that break it.
  - node: quant-finance.portfolio.correlation-extremes
    hook: >
      The two extreme values of $\rho$ bracket the entire diversification
      story in one picture: at one extreme risk adds like ordinary numbers,
      and at the other it can be made to vanish completely.
    explanation: >
      Set $\rho=1$ in the two-asset variance formula:
      $\sigma_p^{2}=w^{2}\sigma_1^{2}+(1-w)^{2}\sigma_2^{2}
      +2w(1-w)\sigma_1\sigma_2=(w\sigma_1+(1-w)\sigma_2)^{2}$, a perfect
      square, so $\sigma_p=w\sigma_1+(1-w)\sigma_2$ exactly — portfolio risk
      is the plain weighted average of the two standalone risks.
      Diversification buys nothing at $\rho=1$: the two assets move as one,
      just at different amplitudes.

      Set $\rho=-1$ instead and the cross term flips sign, giving the other
      perfect square: $\sigma_p=|w\sigma_1-(1-w)\sigma_2|$. This hits
      exactly zero at the weight that balances the two amplitudes,
      $w=\sigma_2/(\sigma_1+\sigma_2)$ — a portfolio built from two risky
      assets with strictly zero variance, the extreme case of the riskless
      combination a PSD covariance matrix allows.

      In between, differentiating $\sigma_p^{2}$ with respect to $\rho$
      gives slope $2w(1-w)\sigma_1\sigma_2>0$ for any interior weight:
      variance rises monotonically with $\rho$ across the whole range, so
      every unit of diversification benefit you get is purely a function of
      how far $\rho$ sits below $1$, not the sign of $\rho$ by itself —
      $\rho=0$ and $\rho=-0.3$ both help, just by different amounts.
    worked: >
      Two assets have $\sigma_1=15\%$ and $\sigma_2=45\%$. At $\rho=-1$,
      the riskless weight is $w=45/(15+45)=0.75$: check, $0.75(15)=11.25$
      and $0.25(45)=11.25$, equal, so $\sigma_p=|11.25-11.25|=0$ exactly.
      At $\rho=1$ and the same weight, $\sigma_p=0.75(15)+0.25(45)
      =11.25+11.25=22.5\%$ — the same weights, the same two assets, and the
      entire gap between $0\%$ and $22.5\%$ of risk is attributable to
      correlation alone.
    interview: >
      A common opener is "what's the minimum possible variance of a
      two-asset portfolio if you can choose $\rho$?" — the expected answer
      is zero, achieved at $\rho=-1$ with the amplitude-balancing weight,
      stated cold rather than derived from scratch each time.
    pitfalls: >
      Assuming $\rho=-1$ requires equal weights — it requires weights that
      balance $w\sigma_1=(1-w)\sigma_2$, which is $50/50$ only when the
      volatilities happen to match. And treating $\rho=0$ as "no
      diversification benefit" — the benefit is smaller than at $\rho=-1$,
      not absent; only $\rho=1$ kills it entirely.
    recap: >
      At $\rho=1$ risk is the weighted-average volatility with no benefit
      at all; at $\rho=-1$ the right weight cancels risk exactly to zero;
      variance rises monotonically in $\rho$ between them.
    dialogue:
      - part: A perfect hedge that is not riskless
        teach: >
          Asset 1 has volatility $10\%$ and asset 2 has $40\%$, and their
          correlation is exactly $-1$: every move in one comes with an exactly
          opposite, proportional move in the other. A trader holds them $50/50$
          and calls the book a perfect hedge.
      - ask: >
          What is the book's volatility, in percent?
        expects: "15"
        hint: >
          Two-asset variance with $\rho = -1$: the cross term is
          $-2w(1-w)\sigma_1\sigma_2$.
        feedback: >
          $0.25(0.01) + 0.25(0.16) - 2(0.25)(0.1)(0.4) = 0.0025 + 0.04 - 0.02
          = 0.0225$, so $\sigma_p = 15\%$. Perfect negative correlation, and
          still $15\%$ of risk.
      - ask: >
          Why is the $50/50$ book not riskless?
        choices:
          - text: >
              Correlation $-1$ only cancels risk on average, not every day.
            feedback: >
              At $\rho = -1$ the two returns are exact linear functions of
              each other, every single day. The leftover risk is not bad luck;
              it is a sizing error.
          - text: >
              Asset 2 moves four times as far as asset 1, so equal dollars do
              not cancel.
            correct: true
            feedback: >
              Right. When asset 1 drops one standard deviation, $10\%$, asset 2
              rises $40\%$. Half a dollar in each gains $20$ cents and loses
              $5$, leaving $15$ cents of net exposure, which is the $15\%$.
          - text: >
              No two-asset book can be riskless; that would be an arbitrage.
            feedback: >
              A riskless book is perfectly possible; it simply has to earn the
              risk-free rate. Nothing forbids building one out of two risky
              assets.
        feedback: >
          The direction is opposite, but the amplitudes are not equal, and
          equal dollars leave the bigger mover in charge.
      - reflect: >
          What has to be equal between the two legs for them to cancel
          exactly, and why does the variance formula agree?
        answer: >
          The dollar size of each leg's move: $w\sigma_1$ must equal
          $(1-w)\sigma_2$. At $\rho = -1$ the variance is
          $w^{2}\sigma_1^{2} + (1-w)^{2}\sigma_2^{2} - 2w(1-w)\sigma_1\sigma_2
          = (w\sigma_1 - (1-w)\sigma_2)^{2}$, a perfect square, and a square
          is zero exactly when what is inside it is.
      - ask: >
          What weight $w$ in asset 1 makes this book riskless?
        expects: "0.8"
        hint: >
          Solve $w(10) = (1-w)(40)$.
        feedback: >
          $10w = 40 - 40w$ gives $w = 40/50 = 0.8$. Check: $0.8(10) = 8$ and
          $0.2(40) = 8$, so the legs cancel exactly. The riskless weight is
          $\sigma_2/(\sigma_1 + \sigma_2)$: the *less* volatile asset gets the
          larger weight.

      - part: The other square, and everything between
        ask: >
          Same two assets, same $w = 0.8$, but now the correlation is $+1$.
          What is $\sigma_p$, in percent?
        expects: "16"
        hint: >
          At $\rho = +1$ the cross term carries a plus sign, and the three
          terms again form a square.
        feedback: >
          $(0.8(10) + 0.2(40))^{2}$ in percent squared, so
          $\sigma_p = 8 + 8 = 16\%$: exactly the weighted average of the two
          volatilities.
      - teach: >
          The two extremes, in general. At $\rho = 1$ the variance is
          $(w\sigma_1 + (1-w)\sigma_2)^{2}$, so for $w \in [0, 1]$ risk is the
          weighted average of risks and diversification buys nothing. At
          $\rho = -1$ it is $(w\sigma_1 - (1-w)\sigma_2)^{2}$, so
          $\sigma_p = \lvert w\sigma_1 - (1-w)\sigma_2 \rvert$, which is zero
          at $w = \sigma_2/(\sigma_1 + \sigma_2)$. In between, $\sigma_p^{2}$
          rises with $\rho$ at slope $2w(1-w)\sigma_1\sigma_2$.
      - ask: >
          At $w = 0.8$, the variance runs from $0$ at $\rho = -1$ to $0.0256$
          at $\rho = +1$, linearly in $\rho$. What is $\sigma_p$ at $\rho = 0$,
          in percent? Two decimals.
        expects: "11.31"
        tolerance: 0.05
        hint: >
          Linear in $\rho$ means $\rho = 0$ sits halfway. Or drop the cross
          term and add the other two.
        feedback: >
          $0.64(0.01) + 0.04(0.16) = 0.0064 + 0.0064 = 0.0128$, halfway
          between $0$ and $0.0256$, and $\sqrt{0.0128} \approx 11.31\%$.
      - ask: >
          A colleague says uncorrelated assets give no diversification
          benefit — only negative correlation does. What is right?
        choices:
          - text: >
              The colleague: at $\rho = 0$ the assets ignore each other, so
              nothing cancels.
            feedback: >
              At $\rho = 0$ the book above carries $11.31\%$ against a
              weighted average of $16\%$. Independent moves partly offset
              without any negative correlation.
          - text: >
              Diversification depends on volatilities, not on correlation.
            feedback: >
              At fixed volatilities and weights the book above ranges from
              $0\%$ to $16\%$ purely as $\rho$ moves. Correlation is the whole
              lever.
          - text: >
              The benefit is the gap between $\rho$ and $1$, whatever its
              sign.
            correct: true
            feedback: >
              Right. Variance is increasing in $\rho$ with positive slope, so
              every step below $1$ helps: $\rho = 0.5$ a little, $\rho = 0$
              more, $\rho = -1$ the most.
        feedback: >
          Only $\rho = 1$ kills the benefit; every lower correlation buys some.

      - part: Stepping outside the unit interval
        ask: >
          Back to $\rho = +1$. Now shorts are allowed. What weight in asset 1
          makes the book riskless? An exact fraction.
        expects: "4/3"
        hint: >
          You need $w\sigma_1 + (1-w)\sigma_2 = 0$, so $1 - w$ must be
          negative.
        feedback: >
          $10w + 40(1-w) = 0$ gives $30w = 40$, so $w = 4/3$ and
          $1 - w = -1/3$. Check: $(4/3)(10) = 40/3$ and $(-1/3)(40) = -40/3$.
          Long one asset against a short in its perfect twin is the oldest
          hedge there is.
      - ask: >
          So what does "at $\rho = 1$ diversification buys nothing" depend on?
        choices:
          - text: >
              The weights staying in $[0, 1]$, so the two legs add.
            correct: true
            feedback: >
              Right. With both weights nonnegative the square root of
              $(w\sigma_1 + (1-w)\sigma_2)^{2}$ is the weighted average; with a
              short, the two terms can cancel.
          - text: >
              Nothing: at $\rho = 1$ there is never any benefit.
            feedback: >
              You just built a riskless book at $\rho = 1$. A short leg turns
              lockstep correlation into a perfect hedge.
          - text: >
              The two volatilities being equal.
            feedback: >
              Volatilities do not enter it: with long-only weights the legs add
              whatever $\sigma_1$ and $\sigma_2$ are. Unequal volatilities matter
              only once you short — with $\sigma_1 = \sigma_2$ you get
              $w\sigma_1 + (1-w)\sigma_1 = \sigma_1$ for every $w$, and no
              weight summing to one hedges at all.
        feedback: >
          Long-only, $\rho = 1$ is worthless and $\rho = -1$ is perfect;
          allow shorts and either extreme hedges to zero. Asked for the
          lowest possible variance of a two-asset book, say zero, at
          $\rho = -1$ with the amplitude-balancing weight
          $\sigma_2/(\sigma_1 + \sigma_2)$.
  - node: quant-finance.portfolio.diversification
    hook: >
      The single most quoted fact in portfolio management — "diversification
      has a floor" — is a two-line manipulation of the variance formula you
      already have, and the floor it finds is the average covariance, not
      zero.
    explanation: >
      Hold $n$ assets at equal weight $w_i=1/n$ and expand $w'\Sigma w$
      directly: the $n$ diagonal terms each contribute
      $(1/n)^{2}\sigma^{2}$, summing to $\sigma^{2}/n$, and the $n(n-1)$
      off-diagonal terms each contribute $(1/n)^{2}$ times some pairwise
      covariance; summing those and dividing by their count $n(n-1)$
      defines the average covariance $\bar c$, so the off-diagonal sum is
      exactly $n(n-1)(1/n)^{2}\bar c=(1-1/n)\bar c$. Adding the two pieces:
      $\sigma_p^{2}=\sigma^{2}/n+(1-1/n)\bar c$.

      As $n\to\infty$, the first term vanishes and the second approaches
      $\bar c$: portfolio variance converges to the average covariance, not
      to zero. The individual variances $\sigma^{2}$ get diversified away
      at rate $1/n$; the shared covariance does not get diversified away at
      all, because every asset you add still shares that same average
      co-movement with everything already held.

      With a common correlation $\bar\rho$, write $\bar c=\bar\rho\sigma^{2}$
      and the formula becomes $\sigma_p^{2}=\sigma^{2}[\bar\rho+(1-\bar\rho)/n]$.
      Risk only falls all the way to zero in the special case $\bar c=0$
      (uncorrelated assets), at rate $\sigma/\sqrt n$. In practice the
      descent from $n=1$ to a floor near $\sigma\sqrt{\bar\rho}$ is fast for
      the first ten or twenty names and then very slow, since the $1/n$
      term is already small once $n$ is a few dozen.
    worked: >
      With $\sigma=25\%$ and average correlation $\bar\rho=0.15$: one name
      gives $\sigma_p=25\%$. Twenty names give
      $\sigma_p^{2}=0.0625(0.15+0.85/20)=0.0625(0.1925)\approx0.01203$, so
      $\sigma_p\approx11.0\%$. The floor as $n\to\infty$ is
      $\sigma\sqrt{\bar\rho}=25\sqrt{0.15}\approx9.68\%$ — twenty names
      already captures almost all of the available reduction, from $25\%$
      down to $11\%$ against a floor of $9.68\%$.
    interview: >
      "What happens to portfolio risk as you add more and more uncorrelated
      — or correlated — stocks?" is asked almost verbatim; the strong
      answer states the floor $\sigma\sqrt{\bar\rho}$ by name and the
      $\sigma^{2}/n+(1-1/n)\bar c$ decomposition that produces it, not just
      "risk goes down."
    pitfalls: >
      Believing that holding enough names drives risk to zero — it only
      does that if $\bar c=0$ exactly; any positive average covariance
      leaves a nonzero floor no matter how large $n$ gets. And forgetting
      the $(1-1/n)$ factor and using $\bar c$ itself as the answer for
      finite $n$ — the correction matters at small $n$ and is easy to drop.
    recap: >
      Equal-weighting $n$ assets gives $\sigma_p^{2}=\sigma^{2}/n+(1-1/n)
      \bar c\to\bar c$: individual variances wash out at rate $1/n$,
      average covariance does not wash out at all.
    dialogue:
      - part: Adding names to a forty percent stock
        teach: >
          Every stock in a sector has volatility $40\%$, and any two of them
          have correlation $0.16$. You start with one name and keep adding
          more, always rebalancing to equal weights.
      - ask: >
          With two names at $50/50$, what is the portfolio's volatility, in
          percent? Two decimals.
        expects: "30.46"
        tolerance: 0.05
        hint: >
          Two-asset variance with $w = 0.5$, $\sigma = 0.4$ for both, and
          covariance $\rho\sigma^{2} = 0.16(0.16)$.
        feedback: >
          $0.25(0.16) + 0.25(0.16) + 2(0.25)(0.0256) = 0.08 + 0.0128 =
          0.0928$, and $\sqrt{0.0928} \approx 30.46\%$. One extra name took
          almost ten points off.
      - ask: >
          Keep going: $10$ names, $100$, $10{,}000$. Where does the volatility
          end up?
        choices:
          - text: >
              At $0$: with enough names everything cancels.
            feedback: >
              Everything cancels only if nothing is shared. These stocks share
              a $0.16$ correlation, and adding a name adds that shared movement
              too, so something survives every $n$.
          - text: >
              At $40\%/\sqrt{n}$, which goes to $0$.
            feedback: >
              That is the rate for *independent* names. At $n = 2$ it predicts
              $28.3\%$, and you just computed $30.46\%$ — the correlation is
              already holding risk up.
          - text: >
              At some positive level, set by the correlation.
            correct: true
            feedback: >
              Right. The question is which level, and the answer comes from
              watching which terms of the variance shrink as $n$ grows.
        feedback: >
          Risk falls, and falls fast at first, but it does not fall to zero.
      - reflect: >
          Picture $w'\Sigma w$ for $n$ names at weight $1/n$ as an $n \times n$
          grid of terms, each carrying weight $1/n^{2}$. Which cells shrink in
          total as $n$ grows, and which do not?
        hint: >
          Count the diagonal cells and the off-diagonal cells, and multiply
          each count by $1/n^{2}$.
        answer: >
          The $n$ diagonal cells carry total weight $n/n^{2} = 1/n$, so the
          individual variances fade like $1/n$. The $n(n-1)$ off-diagonal
          cells carry total weight $n(n-1)/n^{2} = 1 - 1/n$, which climbs
          towards $1$. The covariances never fade: each new name brings fresh
          covariance cells with every name already held.

      - part: The floor, named and computed
        teach: >
          That is the theorem. Hold $n$ assets at weights $1/n$, each with
          variance $\sigma^{2}$ and average pairwise covariance $\bar c$. Then
          $\sigma_p^{2} = \sigma^{2}/n + (1 - 1/n)\bar c \to \bar c$. With a
          common correlation $\bar\rho$, $\bar c = \bar\rho\sigma^{2}$ and
          $\sigma_p^{2} = \sigma^{2}[\bar\rho + (1 - \bar\rho)/n]$, so the
          floor on volatility is $\sigma\sqrt{\bar\rho}$.
      - ask: >
          In a $25$-name equal-weighted book, what fraction of the total
          weight in $w'\Sigma w$ multiplies covariances rather than variances?
        expects: "0.96"
        hint: >
          The off-diagonal share is $1 - 1/n$.
        feedback: >
          $25 \times 24 = 600$ off-diagonal cells at $1/625$ each, so
          $600/625 = 0.96$. By $25$ names the variances carry $4\%$ of the
          weight.
      - ask: >
          For the sector stocks, $\sigma = 40\%$ and $\bar\rho = 0.16$. What
          is the floor on volatility, in percent?
        expects: "16"
        hint: >
          $\sigma\sqrt{\bar\rho}$.
        feedback: >
          $40\sqrt{0.16} = 40(0.4) = 16\%$. However many sector names you
          hold, the book never drops below $16\%$.
      - ask: >
          What is the volatility with $16$ names, in percent? Two decimals.
        expects: "18.44"
        tolerance: 0.05
        hint: >
          $\sigma^{2}[\bar\rho + (1 - \bar\rho)/n]$ with $n = 16$.
        feedback: >
          $0.16[0.16 + 0.84/16] = 0.16(0.2125) = 0.034$, and
          $\sqrt{0.034} \approx 18.44\%$: $40\%$ down to $18.44\%$, against a
          floor of $16\%$.
      - ask: >
          And with $64$ names? Two decimals.
        expects: "16.64"
        tolerance: 0.05
        hint: >
          Only the $(1 - \bar\rho)/n$ term changes.
        feedback: >
          $0.16[0.16 + 0.84/64] = 0.16(0.173125) = 0.0277$, and
          $\sqrt{0.0277} \approx 16.64\%$. Forty-eight more names bought
          $1.8$ points. The first sixteen did almost all the work; the rest is
          a slow crawl to the floor.

      - part: When the floor moves
        ask: >
          Suppose instead the names were uncorrelated, $\bar\rho = 0$, still
          at $40\%$ each. What is the volatility of $16$ of them, in percent?
        expects: "10"
        hint: >
          With $\bar c = 0$ only $\sigma^{2}/n$ is left.
        feedback: >
          $\sigma_p^{2} = 0.16/16 = 0.01$, so $\sigma_p = 10\%$, which is
          $40/\sqrt{16}$. With no shared movement the floor is $0$, reached
          at the $\sigma/\sqrt{n}$ rate. This is the only case in which
          diversification removes all risk.
      - ask: >
          A fund holds $1{,}000$ uncorrelated names, but half its capital sits
          in one of them and the rest is spread evenly. Has the specific risk
          washed out?
        choices:
          - text: >
              Yes: $1{,}000$ names is far past the point where $1/n$ matters.
            feedback: >
              The $1/n$ came from every weight being $1/n$. Here one weight is
              $0.5$, and its variance term is $0.25\sigma^{2}$ — a quarter of a
              single name's variance, at any $n$.
          - text: >
              No: the big position's term $w^{2}\sigma^{2}$ does not shrink
              with $n$.
            correct: true
            feedback: >
              Right. The variance terms total $\sum_i w_i^{2}\sigma_i^{2}$, and
              that is small only when every weight is small. Counting names
              is not the same as spreading capital.
          - text: >
              Yes, because uncorrelated names diversify regardless of weights.
            feedback: >
              Zero correlation removes the covariance cells, not the diagonal
              ones. The diagonal is $\sum_i w_i^{2}\sigma_i^{2}$, and one weight
              of $0.5$ keeps it large.
        feedback: >
          The theorem needs the weights to shrink as well as the names to
          multiply. Asked what happens to risk as you add stocks, give the
          decomposition $\sigma^{2}/n + (1 - 1/n)\bar c$, name the floor
          $\sigma\sqrt{\bar\rho}$, and say that it is zero only for
          uncorrelated names.
  - node: quant-finance.portfolio.systematic-idiosyncratic
    hook: >
      This is the mental model that makes every later beta and alpha
      calculation make sense before you've seen a single formula: a stock's
      own volatility is close to irrelevant to how much return it should
      earn.
    explanation: >
      The diversification floor $\bar c$ splits every asset's risk into two
      pieces with completely different economics. The piece that cancels as
      you add more names — the specific, idiosyncratic part, everything
      beyond the shared average covariance — can be eliminated for free by
      anyone willing to hold a broad enough book. A competitive market has
      no reason to pay a premium for bearing a risk that costs nothing to
      remove.

      The piece that survives diversification — the common exposure baked
      into $\bar c$ — is the risk a diversified holder is still stuck with
      no matter how many names they add, and only that piece can command a
      return premium in equilibrium. This is the conceptual seed of
      everything that follows under the names beta and alpha: beta will
      turn out to measure exactly the undiversifiable piece, and alpha the
      leftover a genuinely diversified holder does not have to bear.

      Two consequences interviewers probe directly. First, a stock that is
      wildly volatile on its own but essentially uncorrelated with
      everything else in a book is a low-risk addition to that book — its
      standalone volatility overstates its actual contribution to portfolio
      risk, because nearly all of it is the diversifiable kind. Second, if
      you are the one investor holding a concentrated, undiversified
      position and being compensated for its full standalone volatility,
      that compensation exists precisely because you, unlike a diversified
      market, cannot make the idiosyncratic part disappear for free.
    interview: >
      Expect a scenario question in disguise: "stock A has $40\%$
      volatility and is uncorrelated with the market, stock B has $20\%$
      volatility and moves with it — which is riskier to add to a
      diversified book?" The expected answer names A as the lower-risk
      addition and explains why in terms of what survives diversification,
      not raw volatility.
    pitfalls: >
      Ranking two assets by standalone volatility when the question is
      about their contribution to a diversified book — total volatility and
      marginal, undiversifiable risk are different numbers. Treating
      "idiosyncratic" as meaning "small" — an idiosyncratic component can be
      the largest piece of an asset's total variance and still earn no
      premium.
    recap: >
      Only the part of an asset's risk that survives diversification is
      compensated; the part that cancels in a large book is priced at zero
      no matter how large it looks in isolation.
    dialogue:
      - part: Ten thousand fire policies
        teach: >
          An insurer sells one-year fire policies. Each house has a $1\%$
          chance of burning down, in which case the policy pays $200{,}000$
          dollars, so the expected payout is $2{,}000$ dollars. Fires in
          different houses are independent.
      - ask: >
          What is the standard deviation of a single policy's payout, in
          dollars? Round to the nearest hundred.
        expects: "19900"
        tolerance: 100
        hint: >
          A payout of $200{,}000$ with probability $p = 0.01$: the variance is
          $200{,}000^{2}\,p(1-p)$.
        feedback: >
          $200{,}000\sqrt{0.01(0.99)} = 200{,}000\sqrt{0.0099} \approx 19{,}900$
          dollars — ten times the expected payout. One policy alone is a very
          risky thing to hold.
      - ask: >
          The insurer writes $10{,}000$ such policies. What is the standard
          deviation of its *average* payout per policy, in dollars?
        expects: "199"
        tolerance: 2
        hint: >
          Averaging $n$ independent copies divides the standard deviation by
          $\sqrt{n}$.
        feedback: >
          $19{,}900/\sqrt{10{,}000} = 19{,}900/100 = 199$ dollars. Per policy,
          the insurer's risk has all but vanished.
      - ask: >
          Many insurers each write $10{,}000$ such policies and compete on
          price. Towards what premium does competition push a policy?
        choices:
          - text: >
              Well above $2{,}000$ dollars, since each policy is a one-in-a-hundred
              chance of a $200{,}000$-dollar loss.
            feedback: >
              That loss is frightening to a homeowner, not to the insurer, who
              bears $199$ dollars of risk per policy. A rival charging just
              over $2{,}000$ takes the whole market from you.
          - text: >
              Close to $2{,}000$ dollars, the expected payout.
            correct: true
            feedback: >
              Right. Pooling removes almost all the risk at no cost, so nobody
              is paid for bearing it. The homeowner still pays only about the
              expected loss for removing a $19{,}900$-dollar risk.
          - text: >
              Below $2{,}000$ dollars, since the pooled risk is so small.
            feedback: >
              Below the expected payout the insurer loses money on average,
              however small the risk. Small risk pushes the premium *down to*
              the expected loss, not under it.
        feedback: >
          A risk that pooling removes for free commands no price in a
          competitive market.

      - part: One flood plain
        ask: >
          Now the $10{,}000$ houses all sit in one flood plain. There is a $1\%$
          chance a year that the river floods, and then every policy pays
          $200{,}000$ dollars. What is the standard deviation of the average
          payout per policy, in dollars, to the nearest hundred?
        expects: "19900"
        tolerance: 100
        hint: >
          How different are the $10{,}000$ payouts from one another in any
          given year?
        feedback: >
          The policies pay together or not at all, so the average payout is
          $200{,}000$ with probability $0.01$ and $0$ otherwise — the same
          $19{,}900$ dollars of risk as one policy. Ten thousand copies of one
          bet is one bet.
      - reflect: >
          The flood insurer can charge more than the expected payout and still
          win business; the fire insurer cannot. Say what separates the two
          risks, in terms you could apply to a stock.
        answer: >
          Fire risk is specific to each house, so it cancels in a large pool
          and costs nothing to remove; competition prices it at zero. Flood
          risk is common to every house, so no amount of pooling removes it,
          and whoever carries it must be paid to. A stock's return has the same
          two parts: what cancels across many names, and what every name
          shares.
      - teach: >
          Those are the two kinds of risk. The diversification floor $\bar c$
          is the shared part: a diversified holder is stuck with it, so it is
          *systematic* risk, and only it can command expected return. The rest
          of each asset's variance cancels across a large book; it is
          *idiosyncratic* or specific risk, and a competitive market pays no
          premium for it.
      - ask: >
          A stock has volatility $50\%$, and its average covariance with other
          stocks is $\bar c = 0.05$. What fraction of its variance is the
          systematic part?
        expects: "0.2"
        hint: >
          Its variance is $0.25$. Which part of that survives in a large
          book?
        feedback: >
          $0.05/0.25 = 0.2$. Four fifths of this stock's variance is specific
          and earns nothing; the fifth that a diversified holder cannot shed
          is what any premium is for. "Idiosyncratic" does not mean "small".

      - part: Volatile is not the same as risky
        ask: >
          A diversified book can add a small slice of one of two stocks. P has
          volatility $70\%$ and is uncorrelated with the book; Q has volatility
          $22\%$ and correlation $0.95$ with the book. Which adds more risk to
          the book?
        choices:
          - text: >
              Q: its moves line up with the book's, so a slice of Q adds to them.
            correct: true
            feedback: >
              Right. At small weight, what counts is the covariance with the
              book, $2w\operatorname{Cov}(R, R_B)$: positive for Q and zero for
              P. A slice of P, taken from the book, can even lower its risk.
          - text: >
              P: $70\%$ is more than three times $22\%$.
            feedback: >
              Standalone volatility measures P held alone. Inside the book, a
              small slice of P adds variance of order $w^{2}(0.49)$, which is
              negligible for small $w$, while its cross term with the book is
              zero.
          - text: >
              The same: risk added depends only on the size of the slice.
            feedback: >
              The slice size multiplies the effect; which stock fills it
              decides the sign. P's moves are noise against the book, Q's echo
              it.
        feedback: >
          A position's risk is its contribution to the book, not its own
          volatility.
      - ask: >
          A founder holds all her wealth in her own company's stock, $60\%$
          volatility, almost all of it specific to the company. Does the market
          price of the stock owe her a premium for that $60\%$?
        choices:
          - text: >
              Yes: she bears the full $60\%$, so the stock must pay for it.
            feedback: >
              She bears it, but the price is set by diversified holders, who
              can shed the specific part for free and pay nothing for it. Her
              risk is real and uncompensated.
          - text: >
              No: specific risk is small, so there is nothing to price.
            feedback: >
              Here specific risk is nearly the whole $60\%$. It goes unpriced
              not because it is small but because anyone else can remove it.
          - text: >
              No: only the systematic part is priced, and she carries the rest
              because she cannot diversify.
            correct: true
            feedback: >
              Right. If you are being asked to carry standalone volatility,
              you are the one investor who could not diversify it away — and
              the market will not pay you for that.
        feedback: >
          In an interview, when asked which of two stocks is riskier to add,
          answer with what survives diversification — correlation with the
          book — and say aloud that total volatility is the wrong yardstick.
  - node: quant-finance.portfolio.min-variance
    hook: >
      This is the one closed-form optimization in the whole unit you should
      be able to produce from a blank page under time pressure — the
      two-asset case is exactly one derivative away from an answer.
    explanation: >
      Portfolio variance $\sigma_p^{2}(w)=w^{2}\sigma_1^{2}+(1-w)^{2}
      \sigma_2^{2}+2w(1-w)\rho\sigma_1\sigma_2$ is a single-variable
      quadratic in $w$ with a strictly positive leading coefficient (it is,
      after all, a variance), so it has a unique interior minimum where the
      derivative vanishes. Differentiating and solving gives
      $w^{*}=(\sigma_2^{2}-\rho\sigma_1\sigma_2)/(\sigma_1^{2}+\sigma_2^{2}
      -2\rho\sigma_1\sigma_2)$, with the minimized variance itself equal to
      $\sigma_1^{2}\sigma_2^{2}(1-\rho^{2})/(\sigma_1^{2}+\sigma_2^{2}
      -2\rho\sigma_1\sigma_2)$.

      At $\rho=0$ the formula collapses to
      $w^{*}=\sigma_2^{2}/(\sigma_1^{2}+\sigma_2^{2})$ — inverse-variance
      weighting, tilting toward whichever asset is quieter, in exact
      proportion to how much quieter it is. This special case is worth
      holding onto separately, since it generalizes cleanly to more than
      two assets in a way the full two-asset formula does not.

      The optimal weight can leave $[0,1]$ entirely, meaning the
      minimum-variance portfolio shorts one of the two assets — this
      happens exactly when $\rho$ exceeds $\min(\sigma_1,\sigma_2)
      /\max(\sigma_1,\sigma_2)$, the same ratio that shows up as the
      boundary in the amplitude-balancing weight at $\rho=-1$. High
      correlation between two assets of very different volatility makes
      shorting the riskier one, rather than merely underweighting it, the
      variance-minimizing move.
    worked: >
      With $\sigma_1=10\%$, $\sigma_2=25\%$, $\rho=-0.3$: numerator
      $=0.0625-(-0.3)(0.10)(0.25)=0.0625+0.0075=0.07$, denominator
      $=0.01+0.0625-2(-0.3)(0.10)(0.25)=0.0725+0.015=0.0875$, so
      $w^{*}=0.07/0.0875=0.8$. Achieved variance:
      $0.01(0.0625)(1-0.09)/0.0875\approx0.0065$, so $\sigma_p\approx8.1\%$
      — under both standalone volatilities, courtesy of the negative
      correlation doing extra work beyond the $\rho=0$ case.
    interview: >
      "Derive the minimum-variance weight for two assets" wants the
      calculus done live — set the derivative of the quadratic to zero and
      solve — not the formula recited from memory; a good follow-up is
      naming the $\rho=0$ inverse-variance special case unprompted.
    pitfalls: >
      Assuming $w^{*}\in[0,1]$ always — it does not, and a candidate who
      reports a weight above $1$ or below $0$ without recognizing it as a
      short position has gotten the algebra right and the interpretation
      wrong. Also skipping straight to inverse-variance weighting when
      $\rho\ne0$ — that shortcut is only valid at zero correlation.
    recap: >
      The two-asset minimum-variance weight is $w^{*}=(\sigma_2^{2}
      -\rho\sigma_1\sigma_2)/(\sigma_1^{2}+\sigma_2^{2}-2\rho\sigma_1
      \sigma_2)$, inverse-variance weighting at $\rho=0$, and it shorts the
      riskier asset once correlation exceeds the volatility ratio.
    dialogue:
      - part: The safer asset is not the safest portfolio
        teach: >
          Asset 1 has volatility $15\%$ and asset 2 has $20\%$, and the two
          are uncorrelated. You must hold some mix of the two, weights $w$ and
          $1 - w$, and you want the lowest possible risk.
      - ask: >
          Before computing anything: where is the lowest-risk mix?
        choices:
          - text: >
              All in asset 1: adding any of the riskier asset adds risk.
            feedback: >
              Adding asset 2 adds its variance at weight $(1-w)^{2}$, which is
              tiny for a small slice, while the slice it replaces removes
              asset-1 variance at first order. Try a number before trusting it.
          - text: >
              At $50/50$: equal weights diversify best.
            feedback: >
              Equal weights ignore that asset 1 is quieter. The best mix leans
              towards the quieter asset without going all the way.
          - text: >
              Mostly asset 1, with some asset 2.
            correct: true
            feedback: >
              Right. Uncorrelated risk partly cancels, so a little of the
              noisier asset beats none of it. How much is the question.
        feedback: >
          The intuition "hold the safest thing" ignores cancellation. One
          computation settles it.
      - ask: >
          What is the volatility of $0.8$ in asset 1 and $0.2$ in asset 2, in
          percent? Two decimals.
        expects: "12.65"
        tolerance: 0.05
        hint: >
          With $\rho = 0$ there are only the two squared-weight terms.
        feedback: >
          $0.64(0.0225) + 0.04(0.04) = 0.0144 + 0.0016 = 0.016$, and
          $\sqrt{0.016} \approx 12.65\%$ — well under the $15\%$ of asset 1
          alone.
      - reflect: >
          $0.8$ beats $1$. You could keep trying weights, but you do not have
          to. What kind of function of $w$ is the variance, and how do you find
          its lowest point exactly?
        answer: >
          $\sigma_p^{2}(w) = w^{2}\sigma_1^{2} + (1-w)^{2}\sigma_2^{2} +
          2w(1-w)\rho\sigma_1\sigma_2$ is a quadratic in $w$. Its leading
          coefficient is $\sigma_1^{2} + \sigma_2^{2} - 2\rho\sigma_1\sigma_2$,
          positive, so it is an upward parabola with one minimum, where the
          derivative is zero. One derivative and one linear equation give the
          answer.
      - ask: >
          Set the derivative to zero for these two uncorrelated assets. What
          is the variance-minimizing weight $w^{*}$ in asset 1?
        expects: "0.64"
        hint: >
          With $\rho = 0$: $2w\sigma_1^{2} - 2(1-w)\sigma_2^{2} = 0$.
        feedback: >
          $w^{*} = \sigma_2^{2}/(\sigma_1^{2} + \sigma_2^{2}) = 0.04/0.0625 =
          0.64$. The variance there is $0.4096(0.0225) + 0.1296(0.04) =
          0.0144$, a volatility of exactly $12\%$. Each asset is weighted in
          proportion to the *other's* variance: inverse-variance weighting.

      - part: The general weight
        teach: >
          Keep $\rho$ in and the same derivative gives the proposition:
          $w^{*} = (\sigma_2^{2} - \rho\sigma_1\sigma_2)/(\sigma_1^{2} +
          \sigma_2^{2} - 2\rho\sigma_1\sigma_2)$ in asset 1, with minimized
          variance $\sigma_1^{2}\sigma_2^{2}(1 - \rho^{2})/(\sigma_1^{2} +
          \sigma_2^{2} - 2\rho\sigma_1\sigma_2)$. At $\rho = 0$ it is the
          inverse-variance weight you just found.
      - ask: >
          Why is that stationary point a minimum and never a maximum?
        choices:
          - text: >
              The denominator $\sigma_1^{2} + \sigma_2^{2} - 2\rho\sigma_1\sigma_2$
              is the variance of $R_1 - R_2$, so the parabola opens upwards.
            correct: true
            feedback: >
              Right. The leading coefficient is $\operatorname{Var}(R_1 -
              R_2) \ge 0$, strictly positive unless the two assets are the
              same up to a constant. An upward parabola has a minimum.
          - text: >
              Because $\rho$ lies between $-1$ and $1$, the derivative can
              only vanish once.
            feedback: >
              A quadratic's derivative vanishes once whatever its sign; that
              point could be a maximum. What decides it is the sign of the
              $w^{2}$ coefficient.
          - text: >
              Variances are positive, so any stationary point of a variance is
              a minimum.
            feedback: >
              Positivity of the values does not fix the shape: $1 - w^{2}$ is
              positive near $0$ and has a maximum there. The argument needs
              the $w^{2}$ coefficient itself to be a variance.
        feedback: >
          The curvature is $\operatorname{Var}(R_1 - R_2)$: the more two assets
          differ, the sharper the bowl.
      - ask: >
          Same two assets, now with $\rho = 0.5$. What is $w^{*}$? Three
          decimals.
        expects: "0.769"
        tolerance: 0.0005
        hint: >
          $\rho\sigma_1\sigma_2 = 0.5(0.15)(0.2) = 0.015$.
        feedback: >
          Numerator $0.04 - 0.015 = 0.025$, denominator $0.0625 - 0.03 =
          0.0325$, so $w^{*} = 0.025/0.0325 = 10/13 \approx 0.769$. More
          correlation, more weight on the quieter asset: the noisier one
          cancels less and earns less room.
      - ask: >
          What volatility does that minimum achieve, in percent? Two
          decimals.
        expects: "14.41"
        tolerance: 0.05
        hint: >
          $\sigma_1^{2}\sigma_2^{2}(1 - \rho^{2})$ over the same denominator.
        feedback: >
          $0.0225(0.04)(0.75)/0.0325 = 0.000675/0.0325 \approx 0.02077$, and
          $\sqrt{0.02077} \approx 14.41\%$. Still under $15\%$, but only just:
          at $\rho = 0.5$ there is little left to cancel.

      - part: When the best mix shorts a leg
        ask: >
          Keep raising $\rho$. At what correlation does $w^{*}$ reach exactly
          $1$, so the minimum-variance mix holds none of asset 2?
        expects: "0.75"
        hint: >
          $w^{*} = 1$ when the numerator equals the denominator.
        feedback: >
          $\sigma_2^{2} - \rho\sigma_1\sigma_2 = \sigma_1^{2} + \sigma_2^{2} -
          2\rho\sigma_1\sigma_2$ gives $\rho\sigma_1\sigma_2 = \sigma_1^{2}$,
          so $\rho = \sigma_1/\sigma_2 = 15/20 = 0.75$: the volatility ratio.
      - ask: >
          At $\rho = 0.9$ the formula gives $w^{*} = 0.013/0.0085 \approx 1.53$.
          What does that weight mean?
        choices:
          - text: >
              An algebra error: weights must lie in $[0, 1]$.
            feedback: >
              The algebra is fine; the constraint is $w + (1-w) = 1$, nothing
              more. A weight of $1.53$ is a real, tradeable position.
          - text: >
              Hold all of asset 1 and none of asset 2, since the weight caps
              at $1$.
            feedback: >
              Capping at $1$ gives the best *long-only* mix, and it is not the
              minimum. Variance keeps falling past $w = 1$ until $1.53$.
          - text: >
              Hold $1.53$ in asset 1 and short $0.53$ of asset 2.
            correct: true
            feedback: >
              Right. When asset 2 is mostly a louder copy of asset 1, the
              lowest-risk move is to short some of it as a hedge, not merely to
              hold less of it.
        feedback: >
          The minimum-variance portfolio shorts the noisier leg exactly when
          $\rho$ exceeds $\min(\sigma_1, \sigma_2)/\max(\sigma_1, \sigma_2)$.
          Asked to derive the weight, set the derivative to zero aloud, name
          inverse-variance weighting at $\rho = 0$, and flag a weight outside
          $[0, 1]$ as a short.
  - node: quant-finance.portfolio.markowitz-lagrange
    hook: >
      This is the general-$n$ machine behind the two-asset minimum-variance
      formula, and the punchline worth memorizing is that the global
      minimum-variance weights depend on the covariance matrix alone, never
      on expected returns.
    explanation: >
      The problem is minimize $w'\Sigma w$ subject to the single linear
      constraint $w'\mathbf{1}=1$. Form the Lagrangian
      $L=w'\Sigma w-\lambda(w'\mathbf{1}-1)$ and set its gradient with
      respect to $w$ to zero: $2\Sigma w=\lambda\mathbf{1}$, so
      $w=(\lambda/2)\Sigma^{-1}\mathbf{1}$. Since $\lambda/2$ is just a
      scalar, $w$ is proportional to $\Sigma^{-1}\mathbf{1}$; the
      constraint $w'\mathbf{1}=1$ then fixes the proportionality constant
      by rescaling so the weights sum to one.

      Nowhere in that derivation does an expected return $\mu_i$ appear —
      the global minimum-variance portfolio is a pure function of $\Sigma$.
      Adding a second constraint, a target mean $w'\mu=\mu_0$, brings in a
      second multiplier, and the same stationarity argument now gives
      $w\propto\Sigma^{-1}(a\mathbf{1}+b\mu)$ for scalars $a,b$ fixed by the
      two constraints — every target-return portfolio is still a linear
      combination of just two fixed vectors, $\Sigma^{-1}\mathbf{1}$ and
      $\Sigma^{-1}\mu$.

      The formula also shows you its own weakness: it inverts $\Sigma$, and
      an estimated $\Sigma$ is noisiest exactly along its near-singular
      directions — the same near-zero-variance combinations that make a
      covariance matrix a risk. Inverting amplifies that noise, which is
      the standard explanation for why textbook Markowitz weights on real,
      estimated data come out enormous, offsetting, and unstable from one
      estimation window to the next.
    worked: >
      Three uncorrelated assets ($\Sigma$ diagonal) with variances $0.04$,
      $0.09$, $0.01$: $\Sigma^{-1}\mathbf{1}=(1/0.04,\,1/0.09,\,1/0.01)
      =(25,\,11.11,\,100)$, summing to $136.11$. Rescaling to sum to one:
      $w\approx(18.4\%,\,8.2\%,\,73.5\%)$ — inverse-variance weighting
      again, this time across three assets, exactly as the diagonal case of
      the general formula should produce.
    interview: >
      If asked to set up the Lagrangian for minimum-variance weights, the
      expected chain is: write $L$, differentiate, get $2\Sigma w
      =\lambda\mathbf{1}$, and state $w\propto\Sigma^{-1}\mathbf{1}$ —
      interviewers are checking that you recognize the answer depends only
      on $\Sigma$, since that surprises people the first time.
    pitfalls: >
      Forgetting the constraint is what pins down the scale —
      $\Sigma^{-1}\mathbf{1}$ alone is only a direction, and reporting it
      unnormalized as "the weights" is a common half-answer. Also citing
      this formula as production-ready: without shrinkage on $\Sigma$, the
      inverted-noise problem makes the raw weights close to useless on real
      estimated covariances.
    recap: >
      Minimizing $w'\Sigma w$ subject to $w'\mathbf{1}=1$ gives
      $w\propto\Sigma^{-1}\mathbf{1}$ — depending on $\Sigma$ alone, and
      unstable exactly because it inverts a noisy estimate.
    dialogue:
      - part: Three funds, the slow way
        teach: >
          Three uncorrelated funds have return variances $0.02$, $0.05$ and
          $0.10$. You will split your capital among them, weights summing to
          $1$, to make the variance $0.02w_1^{2} + 0.05w_2^{2} + 0.10w_3^{2}$
          as small as possible.
      - ask: >
          The two-asset trick was one derivative. Here, substitute
          $w_3 = 1 - w_1 - w_2$ and set $\partial/\partial w_1$ to zero. What
          does that equation say?
        choices:
          - text: >
              $0.02w_1 = 0$, so $w_1 = 0$.
            feedback: >
              That forgets that $w_3$ depends on $w_1$ after the substitution.
              Raising $w_1$ lowers $w_3$, and the chain rule brings in
              $-2(0.10)w_3$.
          - text: >
              $0.02w_1 = 0.10w_3$.
            correct: true
            feedback: >
              Right: $2(0.02)w_1 + 2(0.10)w_3(-1) = 0$. Moving a sliver of
              capital from fund 3 to fund 1 must neither raise nor lower the
              variance.
          - text: >
              $w_1 = w_3$.
            feedback: >
              Equal weights would ignore that the funds have different
              variances. The derivative weighs each weight by its own
              variance.
        feedback: >
          The $\partial/\partial w_2$ equation is the same shape:
          $0.05w_2 = 0.10w_3$.
      - ask: >
          So $0.02w_1 = 0.05w_2 = 0.10w_3$, and the weights sum to $1$. What is
          $w_1$?
        expects: "0.625"
        hint: >
          Write $w_1$ and $w_2$ as multiples of $w_3$.
        feedback: >
          $w_1 = 5w_3$ and $w_2 = 2w_3$, so $8w_3 = 1$: $w_3 = 0.125$,
          $w_2 = 0.25$, $w_1 = 0.625$. Each weight is proportional to
          $1/\sigma_i^{2}$: $50$, $20$ and $10$ out of $80$.
      - reflect: >
          The substitution singled out fund 3, yet the answer treats all three
          alike: $0.02w_1$, $0.05w_2$ and $0.10w_3$ are one common number. What
          condition could you write down directly, for every asset at once,
          without choosing one to eliminate?
        answer: >
          At the optimum every asset's marginal variance is the same — the
          derivative of the variance with respect to $w_i$ is one constant for
          all $i$, otherwise shifting capital from a high-marginal asset to a
          low one would lower risk. In vectors: the gradient $2\Sigma w$ is a
          multiple of $\mathbf{1}$, the constraint's gradient. Name the
          multiple $\lambda$ and the asymmetry disappears.

      - part: One multiplier, any covariance
        teach: >
          That is the Lagrange technique. Form $L = w'\Sigma w -
          \lambda(w'\mathbf{1} - 1)$; stationarity in $w$ gives
          $2\Sigma w = \lambda\mathbf{1}$, so $w = (\lambda/2)\Sigma^{-1}
          \mathbf{1}$. Whatever $\lambda$ turns out to be, the global
          minimum-variance portfolio points along $\Sigma^{-1}\mathbf{1}$.
      - ask: >
          Two correlated assets, with $\Sigma$ given as rows $(0.04, 0.01)$
          and $(0.01, 0.09)$. What is the global minimum-variance weight in
          asset 1? An exact fraction.
        expects: "8/11"
        hint: >
          The inverse of rows $(a, b), (b, d)$ is proportional to rows
          $(d, -b), (-b, a)$. Apply it to $(1, 1)$, then rescale.
        feedback: >
          $\Sigma^{-1}\mathbf{1} \propto (0.09 - 0.01,\, -0.01 + 0.04) =
          (0.08,\, 0.03)$, which rescales to $(8/11,\, 3/11)$. The two-asset
          formula agrees: $(0.09 - 0.01)/(0.04 + 0.09 - 0.02) = 0.08/0.11$.
      - ask: >
          A junior reports $\Sigma^{-1}\mathbf{1}$ itself, about $(22.9, 8.6)$
          here, as "the minimum-variance weights". What is wrong?
        choices:
          - text: >
              Nothing: the inverse already accounts for the constraint.
            feedback: >
              The inverse knows nothing about the budget. These numbers sum to
              about $31.4$: thirty-one dollars of positions per dollar of
              capital.
          - text: >
              The multiplier should be negative, which flips the signs.
            feedback: >
              For a positive definite $\Sigma$ and this constraint, $\lambda$
              is positive (it is twice the minimized variance), and the
              weights here are both positive.
          - text: >
              They are the right direction at the wrong scale; dividing by
              their sum gives the weights.
            correct: true
            feedback: >
              Right. Stationarity fixes $w$ only up to the unknown
              $\lambda/2$; the constraint $w'\mathbf{1} = 1$ is what pins the
              scale. $22.9/31.4 \approx 0.727 = 8/11$.
        feedback: >
          $\Sigma^{-1}\mathbf{1}$ is a direction; the budget turns it into
          weights.
      - ask: >
          Two analysts share the covariance estimate above. One expects asset
          1 to return $12\%$, the other $3\%$. How do their global
          minimum-variance portfolios compare?
        choices:
          - text: >
              They are identical.
            correct: true
            feedback: >
              Right. The objective $w'\Sigma w$ and the budget
              $w'\mathbf{1} = 1$ involve only $\Sigma$, so expected returns
              cannot enter the answer.
          - text: >
              The first analyst tilts towards asset 1.
            feedback: >
              Look at the formula: $\Sigma^{-1}\mathbf{1}$ contains no $\mu$.
              The global minimum-variance problem never asks about returns.
          - text: >
              They cannot be compared without a target return.
            feedback: >
              A target return is a second, optional constraint. Without it the
              problem is fully specified by $\Sigma$, and both analysts get
              $(8/11, 3/11)$.
        feedback: >
          Add a target-return constraint $w'\mu = \mu_0$ with a second
          multiplier and stationarity becomes $2\Sigma w = \lambda\mathbf{1} +
          \gamma\mu$, so $w = \Sigma^{-1}(a\mathbf{1} + b\mu)$ — only then do
          returns enter.

      - part: Where inverting hurts
        teach: >
          Two stocks have volatilities $20\%$ and $21\%$ and an estimated
          correlation of $0.98$. The two-asset formula puts weight about
          $1.65$ on the first: long $1.65$, short $0.65$.
      - ask: >
          Next month's estimate of the correlation is $0.99$. What is the new
          minimum-variance weight on the first stock? Two decimals.
        expects: "2.68"
        tolerance: 0.01
        hint: >
          $\rho\sigma_1\sigma_2 = 0.99(0.042) = 0.04158$; the numerator is
          $0.0441$ minus that.
        feedback: >
          Numerator $0.0441 - 0.04158 = 0.00252$, denominator
          $0.0841 - 0.08316 = 0.00094$, so $w^{*} \approx 2.68$. A $0.01$
          change in one estimated correlation moved the position from $1.65$
          long to $2.68$ long.
      - ask: >
          Why is the solution so touchy here?
        choices:
          - text: >
              The Lagrange method is unstable; solving by substitution would
              not be.
            feedback: >
              Both methods give the same exact answer. The touchiness is in the
              problem, not the algebra.
          - text: >
              The spread between the two stocks has tiny variance, so
              $\Sigma$ is nearly singular and inverting it magnifies small
              errors along that direction.
            correct: true
            feedback: >
              Right. The denominator is $\operatorname{Var}(R_1 - R_2)$, about
              $0.001$. Divide by a near-zero, noisily estimated number and the
              weights swing wildly.
          - text: >
              Correlations near $1$ are not valid inputs.
            feedback: >
              $0.98$ and $0.99$ are perfectly valid. They describe two near
              twins, which is exactly the near-null direction $\Sigma^{-1}$
              blows up.
        feedback: >
          This is why unconstrained Markowitz weights on estimated data come
          out enormous and offsetting. In an interview, set up $L$,
          differentiate to $2\Sigma w = \lambda\mathbf{1}$, normalize, and
          volunteer that the answer depends on $\Sigma$ alone and inherits its
          estimation noise.
  - node: quant-finance.portfolio.efficient-frontier
    hook: >
      "Only half the minimum-variance curve is worth holding" is the
      sentence that turns a symmetric parabola into the efficient frontier,
      and knowing which half — and why the other half is never optimal —
      is the entire content of this node.
    explanation: >
      Solve the constrained minimum-variance problem once per attainable
      target mean $\mu_0$ and plot the resulting $(\sigma,\mu)$ pairs:
      because the solutions are linear in the multipliers $a,b$, the mean
      and the achieved variance trace a smooth curve — a parabola in
      $(\sigma^{2},\mu)$, equivalently a hyperbola in $(\sigma,\mu)$ —
      whose leftmost point is exactly the global minimum-variance portfolio,
      the special case with no return constraint at all.

      Because variance is quadratic in $w$ and mean is linear in $w$, two
      different weight vectors can achieve the same variance while giving
      different means — symmetric about the minimum-variance point. For any
      portfolio on the lower half of that curve there is a partner on the
      upper half with identical risk and strictly higher mean, so the lower
      half is dominated outright and nobody should ever hold it; only the
      upper branch is the efficient frontier.

      Two-fund separation follows directly from the linear-in-multipliers
      structure: every frontier portfolio's weights are some linear
      combination of any two other distinct frontier portfolios' weights,
      so two frontier portfolios span the entire frontier. And adding a new
      asset can only move the frontier up-and-left, since every previously
      optimal portfolio remains attainable at zero weight in the new name
      — the frontier with more assets available dominates the frontier
      with fewer.
    worked: >
      Two assets, $\mu_1=6\%,\sigma_1=15\%$ and $\mu_2=11\%,\sigma_2=25\%$,
      correlated at $\rho=0.3$. The minimum-variance weight works out to
      $w^{*}\approx0.82$ in asset $1$. Weights symmetric around $w^{*}$
      give equal variance: at $w=0.92$ and $w=0.72$, both give
      $\sigma_p^{2}\approx0.0211$ ($\sigma_p\approx14.5\%$), but the means
      differ — $w=0.92$ gives $6.4\%$, $w=0.72$ gives $7.4\%$. Same risk, a
      full point of mean apart: $w=0.72$ sits on the efficient upper
      branch, $w=0.92$ is its dominated twin.
    interview: >
      "Why is only half the minimum-variance curve called efficient?"
      wants the domination argument stated directly — same risk, strictly
      higher mean available elsewhere on the curve — not just "the top part
      looks better on the graph." Two-fund separation is the natural
      follow-up.
    pitfalls: >
      Calling the entire minimum-variance curve "the efficient frontier" —
      only the upper branch earns that name; the lower branch is real and
      attainable, just never optimal. Also assuming adding an asset can
      hurt the frontier — it cannot, by the zero-weight argument, though it
      can leave the frontier unchanged if the new asset adds nothing a
      combination of existing ones didn't already provide.
    recap: >
      The efficient frontier is the upper branch of the minimum-variance
      curve — the lower branch is dominated at every point — and any two
      frontier portfolios span the whole thing by linearity.
    dialogue:
      - part: Same risk, more return
        teach: >
          Two uncorrelated assets: asset 1 has expected return $4\%$ and
          volatility $10\%$; asset 2 has expected return $10\%$ and volatility
          $20\%$. A cautious client holds only asset 1, on the grounds that it
          is the safer of the two.
      - ask: >
          Consider instead $0.6$ in asset 1 and $0.4$ in asset 2. What is its
          volatility, in percent?
        expects: "10"
        hint: >
          With $\rho = 0$: $0.36(0.01) + 0.16(0.04)$.
        feedback: >
          $0.0036 + 0.0064 = 0.01$, so $\sigma_p = 10\%$ — exactly the
          client's current risk, despite holding $40\%$ of the noisier asset.
      - ask: >
          And its expected return, in percent?
        expects: "6.4"
        feedback: >
          $0.6(4) + 0.4(10) = 6.4\%$, against the client's $4\%$.
      - ask: >
          What is the verdict on holding asset 1 alone?
        choices:
          - text: >
              Reasonable: it is the lowest-risk asset available.
            feedback: >
              Lowest-risk *asset*, not lowest-risk portfolio. The $60/40$ mix
              carries the same $10\%$ and pays $2.4$ points more; nothing about
              asset 1 alone is worth that.
          - text: >
              A matter of taste: a cautious client may prefer it.
            feedback: >
              Taste decides between more risk and more return. Here the risk is
              identical and the return is higher, so every investor who likes
              return prefers the mix.
          - text: >
              Dominated: another portfolio has the same risk and a strictly
              higher mean.
            correct: true
            feedback: >
              Right. No preference that likes return and dislikes risk can
              choose $(10\%, 4\%)$ over $(10\%, 6.4\%)$.
        feedback: >
          Two mixes with the same volatility, $1.0$ and $0.6$ in asset 1, and
          one of them is never the right choice.

      - part: Which half of the curve
        ask: >
          Sweep $w$ in asset 1 and plot each mix as a point $(\sigma_p, \mu_p)$.
          The leftmost point is the minimum-variance mix, at $w = 0.8$. What
          is its expected return, in percent?
        expects: "5.2"
        hint: >
          $0.8(4) + 0.2(10)$.
        feedback: >
          $3.2 + 2 = 5.2\%$, at volatility $\sqrt{0.0064 + 0.0016} =
          \sqrt{0.008} \approx 8.94\%$. Mixes with $w$ above $0.8$ have lower
          means; mixes with $w$ below $0.8$ have higher means.
      - reflect: >
          Every point on the curve has a twin at the same volatility, one on
          each side of $w = 0.8$. Which points would anyone who prefers a
          higher mean at a given risk ever hold, and why?
        answer: >
          Only those at or above the leftmost point. Variance is symmetric
          about $w = 0.8$ while the mean falls as $w$ rises, so each mix with
          $w > 0.8$ has a twin with $w < 0.8$ at identical risk and a strictly
          higher mean. The lower half is attainable and never optimal; the
          upper half, starting from the minimum-variance point, is what
          remains.
      - teach: >
          That remaining set is the efficient frontier. Solving the
          minimum-variance problem for each target mean traces the
          minimum-variance frontier, a hyperbola in $(\sigma, \mu)$ whose
          leftmost point is the global minimum-variance portfolio. Only the
          upper branch, from that point up, is efficient; the lower branch is
          attainable and dominated.
      - ask: >
          Three mixes: $w = 0.9$, $w = 0.7$ and $w = -0.2$ in asset 1. Which
          is on the minimum-variance frontier but not efficient?
        choices:
          - text: >
              $w = -0.2$, because a short position cannot be efficient.
            feedback: >
              Shorting asset 1 to hold $1.2$ of asset 2 gives mean
              $-0.8 + 12 = 11.2\%$, on the upper branch. Efficiency is about
              where the point sits, not about the signs of the weights.
          - text: >
              $w = 0.9$
            correct: true
            feedback: >
              Right. It lies above $0.8$, on the lower branch: variance
              $0.81(0.01) + 0.01(0.04) = 0.0085$ and mean $4.6\%$.
          - text: >
              $w = 0.7$
            feedback: >
              $w = 0.7$ sits on the upper branch, with mean $5.8\%$. It is the
              portfolio that beats one of the others.
        feedback: >
          On a two-asset curve the test is simple: which side of the
          minimum-variance weight the mix sits on.
      - ask: >
          Which weight in asset 1 is the efficient twin of $w = 0.9$, with
          the same variance and a higher mean?
        expects: "0.7"
        hint: >
          Reflect $0.9$ through the minimum-variance weight.
        feedback: >
          $0.8 - 0.1 = 0.7$: variance $0.49(0.01) + 0.09(0.04) = 0.0085$,
          the same, and mean $0.7(4) + 0.3(10) = 5.8\%$ against $4.6\%$.

      - part: Two funds span it, a new asset can only help
        ask: >
          With five assets, a desk has computed two distinct frontier
          portfolios. A client asks for a third target mean. What is the
          least work that answers her?
        choices:
          - text: >
              Rerun the full optimization at her target.
            feedback: >
              That works, but it is unnecessary. The frontier solutions are
              linear in the multipliers, so the two portfolios you have
              already generate the rest.
          - text: >
              Blend the two frontier portfolios to hit her target mean.
            correct: true
            feedback: >
              Right — two-fund separation. Any two distinct frontier
              portfolios span the whole frontier, so one weight $\lambda$ on
              one and $1 - \lambda$ on the other does it.
          - text: >
              Find a third frontier portfolio first, since two points only fix
              a line.
            feedback: >
              In the $(\sigma, \mu)$ plane the frontier is curved, but in
              weight space the frontier portfolios lie on a line. Blending the
              two weight vectors traces the whole curve.
        feedback: >
          Blend weights, not points: the blend's mean is linear in $\lambda$,
          and its volatility follows the hyperbola.
      - ask: >
          A third asset becomes available: expected return $3\%$, volatility
          $30\%$, poor on both counts. What can it do to the efficient
          frontier?
        choices:
          - text: >
              Drag it down, since it is worse than both existing assets.
            feedback: >
              Every old portfolio is still available with zero weight in the
              new asset, so nothing on the old frontier is lost. The frontier
              cannot get worse.
          - text: >
              Nothing, since no efficient portfolio would hold a poor asset.
            feedback: >
              A poor standalone asset can still help if it hedges: with low or
              negative correlation to the others it may lower risk at the
              margin. It might leave the frontier unchanged, but that is not
              guaranteed.
          - text: >
              Move it up and to the left, or leave it where it is.
            correct: true
            feedback: >
              Right. The old portfolios survive at zero weight, so the new
              frontier contains or improves on the old one.
        feedback: >
          Asked why only half the curve is efficient, give the twin argument —
          same risk, strictly higher mean on the other side of the
          minimum-variance point — and then two-fund separation.
  - node: quant-finance.portfolio.sharpe
    hook: >
      Sharpe ratio questions almost always hide a units trap: quoting a
      daily number as if it were annual, or annualizing return and
      volatility by different powers of time, and the fix is remembering
      which quantity actually scales like $\sqrt t$.
    explanation: >
      $S=(\mathbb{E}[R_p]-r_f)/\sigma_p$ is excess return per unit of
      volatility — geometrically, the slope of the line from $(0,r_f)$ to
      the portfolio's point in the $(\sigma,\mu)$ plane. Scaling a position
      by any positive constant scales both the numerator and the
      denominator by that same constant, so $S$ is invariant to leverage:
      it measures the quality of a strategy's risk-return trade-off,
      separate from how large a position you choose to run.

      Under the iid hypothesis, summing $t$ independent identically
      distributed one-period returns makes the mean grow linearly in $t$
      while the standard deviation grows like $\sqrt t$ (variances add,
      standard deviations do not). The ratio therefore grows like
      $t/\sqrt t=\sqrt t$: a Sharpe ratio measured over a longer horizon is
      always larger than the same strategy's Sharpe over a shorter one,
      purely from this scaling. Annualizing a daily figure multiplies it by
      $\sqrt{252}\approx15.87$; the same logic annualizes a monthly figure
      by $\sqrt{12}$, a weekly one by $\sqrt{52}$ — the general rule is
      multiply by the square root of periods per year, and $\sqrt{252}$ is
      only the daily special case of it.

      The iid assumption is the entire argument, not a footnote: positive
      autocorrelation in returns means successive periods are not
      independent, so true multi-period variance grows faster than the iid
      rate, actual risk exceeds $\sigma\sqrt t$, and a naively annualized
      $S$ overstates the true ratio. This is the standard reason a
      backtested Sharpe looks better than live performance once
      autocorrelated effects show up.
    worked: >
      A strategy has a monthly excess mean of $0.5\%$ on a monthly
      volatility of $4\%$: monthly Sharpe $=0.5/4=0.125$. Annualizing by
      $\sqrt{12}\approx3.464$ gives an annual Sharpe of about $0.433$ —
      equivalently, annual excess return $12(0.5)=6\%$ over annual
      volatility $4\sqrt{12}\approx13.86\%$, and $6/13.86\approx0.433$
      matches either way.
    interview: >
      "Given a daily mean and daily volatility, what's the annualized
      Sharpe?" is close to automatic; the interviewer is testing whether
      $\sqrt{252}$ (or the general $\sqrt{\text{periods per year}}$) comes
      out instantly and whether you volunteer that the iid assumption is
      what licenses it.
    pitfalls: >
      Annualizing return by $252$ but forgetting volatility annualizes by
      $\sqrt{252}$, not $252$ — mixing the two throws the ratio off by a
      factor of $\sqrt{252}$. And quoting an annualized Sharpe from
      autocorrelated returns without flagging that true annual risk likely
      exceeds $\sigma\sqrt t$, which means the true $S$ is smaller than the
      naive annualization reports.
    recap: >
      Sharpe is excess return over volatility, invariant to leverage, and
      scales like $\sqrt t$ under iid returns — annualize a daily figure by
      $\sqrt{252}$, but only if the iid assumption actually holds.
    dialogue:
      - part: Two strategies and a margin account
        teach: >
          Cash earns $3\%$. Strategy A is expected to return $12\%$ a year at
          $20\%$ volatility; strategy B $7\%$ at $8\%$ volatility. Your risk
          budget is $20\%$ volatility, and you can borrow at $3\%$ to run either
          strategy at any size.
      - ask: >
          By what factor must you lever B to bring its volatility up to the
          $20\%$ budget?
        expects: "2.5"
        hint: >
          Volatility scales with the size of the position.
        feedback: >
          $20/8 = 2.5$: two and a half dollars of B per dollar of capital, the
          extra $1.5$ borrowed at $3\%$.
      - ask: >
          What is the expected return of B levered $2.5$ times, in percent?
        expects: "13"
        hint: >
          You earn B's return on $2.5$ dollars and pay $3\%$ on the $1.5$ you
          borrowed. Equivalently, $3\%$ plus $2.5$ times B's excess return.
        feedback: >
          $3 + 2.5(7 - 3) = 3 + 10 = 13\%$. At the same $20\%$ risk, levered B
          beats A's $12\%$.
      - ask: >
          What made B the better strategy, even though A has the higher
          expected return?
        choices:
          - text: >
              B is less risky, and less risk is always better.
            feedback: >
              You ran B at exactly A's risk. Low volatility by itself is just a
              smaller position; it was what B paid *per unit* of risk that won.
          - text: >
              B earns more excess return per unit of volatility.
            correct: true
            feedback: >
              Right. B pays $4$ points of excess return on $8$ of volatility,
              $0.5$ per unit; A pays $9$ on $20$, $0.45$ per unit. Leverage
              carries the ratio to any risk level you choose.
          - text: >
              Leverage always improves a strategy.
            feedback: >
              Lever A to $40\%$ and you get $3 + 2(9) = 21\%$, still $0.45$
              per unit of risk. Leverage moves you along a line; it never
              changes the line's slope.
        feedback: >
          Return alone ranks strategies by how big they are run, not by how
          good they are.
      - reflect: >
          What single number, computed for each strategy before any
          leverage, would have told you B wins at every risk budget? Say why
          it does not care how large you run the position.
        answer: >
          Excess return divided by volatility: $(\mu - r_f)/\sigma$. Levering
          by a factor $a$ multiplies the excess return by $a$ and the
          volatility by $a$, so the ratio is unchanged. It measures the
          quality of the risk-return trade, and size is a separate choice.

      - part: The slope out of the risk-free rate
        teach: >
          That number is the Sharpe ratio, $S = (\mathbb{E}[R_p] - r_f)/
          \sigma_p$: the slope of the line from $(0, r_f)$ to the portfolio in
          the $(\sigma, \mu)$ plane, invariant to leverage. Under iid returns,
          means grow like $t$ and volatilities like $\sqrt{t}$, so $S$ grows
          like $\sqrt{t}$: annualize a daily Sharpe by $\sqrt{252} \approx
          15.87$, a monthly one by $\sqrt{12}$.
      - ask: >
          What is the Sharpe ratio of B levered $2.5$ times?
        expects: "0.5"
        feedback: >
          $(13 - 3)/20 = 0.5$, the same as unlevered B, $(7 - 3)/8 = 0.5$.
      - ask: >
          A strategy's daily excess mean is $0.08\%$ on a daily volatility of
          $1.6\%$, with iid days and $252$ trading days a year. What is its
          annualized Sharpe ratio? Two decimals.
        expects: "0.79"
        tolerance: 0.01
        hint: >
          Daily Sharpe first, then one factor of $\sqrt{252}$.
        feedback: >
          Daily $S = 0.08/1.6 = 0.05$, and $0.05(15.87) \approx 0.79$.
          Equivalently, $252(0.08) = 20.16\%$ excess over
          $1.6(15.87) \approx 25.4\%$ volatility.
      - ask: >
          A colleague annualizes the same strategy and reports a Sharpe of
          $0.05$. What did they do?
        choices:
          - text: >
              Multiplied the mean and the volatility each by $252$.
            correct: true
            feedback: >
              Right. That leaves the ratio unchanged at the daily $0.05$.
              Means add over days, but volatilities add only in quadrature,
              so volatility scales by $\sqrt{252}$, not $252$.
          - text: >
              Multiplied the daily Sharpe by $\sqrt{252}$.
            feedback: >
              That gives $0.79$, the right answer, not $0.05$. Whatever the
              colleague did, it left the daily ratio where it was.
          - text: >
              Multiplied the daily Sharpe by $252$.
            feedback: >
              That gives $12.6$, the opposite error: it scales the volatility
              by $1$ while scaling the mean by $252$.
        feedback: >
          Means scale by $t$, volatilities by $\sqrt{t}$, the ratio by
          $\sqrt{t}$. Mixing up the powers is the units trap these questions
          are built around.

      - part: When days are not independent
        ask: >
          What justifies scaling the volatility by $\sqrt{252}$?
        choices:
          - text: >
              Volatility is quoted as a square root, so time enters as one.
            feedback: >
              The square root comes from variances adding, and they add only
              under a hypothesis about the days. Without that hypothesis there
              is no $\sqrt{t}$.
          - text: >
              Uncorrelated days, so the $252$ daily variances simply add.
            correct: true
            feedback: >
              Right. With zero covariance between days the annual variance is
              $252\sigma^{2}$, and its root is $\sigma\sqrt{252}$. Every
              covariance between days enters that sum too.
          - text: >
              Normally distributed returns.
            feedback: >
              Normality is neither needed nor enough. Correlated normal days
              break the rule, and uncorrelated fat-tailed days obey it.
        feedback: >
          The iid hypothesis carries the whole annualization.
      - ask: >
          Suppose consecutive days' returns have correlation $0.5$. The
          variance of a two-day return is how many times a single day's
          variance?
        expects: "3"
        hint: >
          $\operatorname{Var}(R_1 + R_2) = \sigma^{2} + \sigma^{2} +
          2\operatorname{Cov}(R_1, R_2)$.
        feedback: >
          $\sigma^{2} + \sigma^{2} + 2(0.5)\sigma^{2} = 3\sigma^{2}$, not the
          iid $2\sigma^{2}$. Risk compounds faster than $\sqrt{t}$ says.
      - ask: >
          For a strategy with positively autocorrelated daily returns, what
          does the naive $\sqrt{252}$ annualization do to the Sharpe ratio?
        choices:
          - text: >
              Understates it, since trends add to the return.
            feedback: >
              Autocorrelation leaves the mean untouched: a sum's mean is the
              sum of the means. It is the variance that grows, by the extra
              covariance terms you just counted.
          - text: >
              Nothing, as long as the daily Sharpe is measured correctly.
            feedback: >
              The daily figure can be exact and the annual one still wrong:
              the error is in the step from one day to $252$.
          - text: >
              Overstates it, since true annual risk exceeds
              $\sigma\sqrt{252}$.
            correct: true
            feedback: >
              Right. The numerator is right, the denominator too small, so
              the ratio is inflated.
        feedback: >
          Asked to annualize a Sharpe in an interview, give the
          $\sqrt{\text{periods per year}}$ factor at once and say, unprompted,
          that it assumes uncorrelated periods.
  - node: quant-finance.portfolio.tangency
    hook: >
      The moment a risk-free asset enters the picture, an infinite menu of
      risky portfolios collapses to one decision: how much of a single
      fixed risky portfolio to hold, and separately, how much cash.
    explanation: >
      Mix any risky portfolio $P$ with the risk-free asset at weight $a$ in
      $P$ and $1-a$ in cash: mean $r_f+a(\mu_P-r_f)$, volatility
      $a\sigma_P$ (cash contributes no risk). As $a$ ranges over all
      values, including $a>1$ funded by borrowing at $r_f$, the pair sweeps
      out a straight line starting at $(0,r_f)$ with slope
      $(\mu_P-r_f)/\sigma_P$ — exactly $P$'s Sharpe ratio. A steeper line is
      strictly better at every risk level, so an investor wants the
      steepest achievable line.

      The steepest line achievable is the one tangent to the efficient
      frontier, and the frontier portfolio it touches — the tangency
      portfolio — is by construction the single maximum-Sharpe risky
      portfolio available. Its weights come from maximizing
      $(w'\mu-r_f)/\sqrt{w'\Sigma w}$, which, by the same stationarity
      argument as the minimum-variance case, gives
      $w\propto\Sigma^{-1}(\mu-r_f\mathbf{1})$ — the minimum-variance
      formula's $\Sigma^{-1}\mathbf{1}$ with the mean vector shifted down
      by $r_f$ in place of $\mathbf{1}$.

      Two-fund separation follows immediately: every investor, regardless
      of risk appetite, wants to hold the same risky portfolio (the
      tangency portfolio) and differs from every other investor only in
      $a$, the split between it and cash. $a>1$ is a levered position
      further out along the same capital allocation line, still holding
      the identical risky mix, just financed partly with borrowed money.
    worked: >
      Two assets pay excess returns over $r_f$ of $5\%$ and $8\%$ and are
      uncorrelated with variances $0.04$ and $0.01$. Diagonal
      $\Sigma^{-1}(\mu-r_f\mathbf{1})=(5/0.04,\,8/0.01)=(125,\,800)$,
      summing to $925$; rescaled, tangency weights are
      $w\approx(13.5\%,\,86.5\%)$ — most of the risky allocation goes to
      the asset whose excess return does more work per unit of variance it
      carries.
    interview: >
      "With a risk-free asset available, how should an investor's risky
      holdings differ by risk tolerance?" wants two-fund separation stated
      directly — everyone holds the same risky portfolio, they just choose
      a different $a$ — and, if pushed for the formula,
      $w\propto\Sigma^{-1}(\mu-r_f\mathbf{1})$.
    pitfalls: >
      Confusing the tangency portfolio with the global minimum-variance
      portfolio — they coincide only by coincidence; the tangency portfolio
      uses $\mu-r_f\mathbf{1}$, the min-variance one uses $\mathbf{1}$
      alone. Also treating $a>1$ as impossible — it's leverage, financed at
      $r_f$, and is exactly how an aggressive investor stays on the capital
      allocation line past the tangency point.
    recap: >
      With a risk-free asset, every efficient portfolio is cash plus the
      single maximum-Sharpe tangency portfolio
      $w\propto\Sigma^{-1}(\mu-r_f\mathbf{1})$, in a proportion $a$ that
      alone encodes risk appetite.
    dialogue:
      - part: Two clients, two portfolios, one bank account
        teach: >
          Cash earns $2\%$, and you can borrow at the same rate. Two portfolios
          sit on the efficient frontier: P, with expected return $6\%$ and
          volatility $10\%$, and Q, with $11\%$ and $20\%$. A cautious client
          wants exactly $5\%$ volatility, and you will give her one of them
          plus cash.
      - ask: >
          Using P: half in P, half in cash gives $5\%$ volatility. What is the
          expected return, in percent?
        expects: "4"
        hint: >
          Cash adds no risk. The mean is $r_f$ plus the weight in P times P's
          excess return.
        feedback: >
          $2 + 0.5(6 - 2) = 4\%$, at volatility $0.5(10) = 5\%$.
      - ask: >
          Using Q instead: a quarter in Q and the rest in cash also gives $5\%$
          volatility. What is the expected return, in percent?
        expects: "4.25"
        feedback: >
          $2 + 0.25(11 - 2) = 2 + 2.25 = 4.25\%$, at volatility
          $0.25(20) = 5\%$ — more than P delivers at the same risk.
      - ask: >
          The cautious client does better with the riskier portfolio. Why?
        choices:
          - text: >
              Q has the higher expected return, so any amount of it helps.
            feedback: >
              She holds only a quarter of Q, so its raw $11\%$ barely matters.
              What matters is how much excess return each unit of Q's risk
              brings with it.
          - text: >
              It is a coincidence of the $5\%$ target.
            feedback: >
              Try any target. At $15\%$, P levered $1.5$ times gives $8\%$ and Q
              at $0.75$ gives $8.75\%$. A steeper line is higher everywhere.
          - text: >
              Mixed with cash, each portfolio gives a straight line from
              $(0, 2\%)$, and Q's line is steeper.
            correct: true
            feedback: >
              Right. Weight $a$ in a portfolio gives mean $r_f + a(\mu - r_f)$
              at volatility $a\sigma$: a line whose slope is the Sharpe ratio.
              Q's slope is $9/20 = 0.45$, P's is $4/10 = 0.4$.
        feedback: >
          With cash available, a risky portfolio is judged by the slope of its
          line, not by where it sits on its own.
      - reflect: >
          If you could choose any portfolio on the frontier to combine with
          cash, which would you choose, and would the answer change for a
          client who wanted $30\%$ volatility instead of $5\%$?
        answer: >
          The one giving the steepest line out of $(0, r_f)$: the line that
          just touches the frontier, at the point of maximum Sharpe ratio. Any
          steeper line misses the frontier altogether; any flatter one is
          beaten everywhere. Risk appetite only chooses how far along that line
          to go, so the bold client and the cautious client pick the same
          risky portfolio.

      - part: The steepest line
        teach: >
          That is the proposition. Mixing a risky $P$ with cash at weight $a$
          gives mean $r_f + a(\mu_P - r_f)$ and volatility $a\sigma_P$, the
          capital allocation line with slope equal to $P$'s Sharpe ratio. The
          optimal risky holding is the frontier portfolio where the line is
          tangent: the tangency portfolio, the maximum-Sharpe portfolio, with
          weights $\propto \Sigma^{-1}(\mu - r_f\mathbf{1})$. Everyone holds it
          and chooses only $a$; $a > 1$ is leverage.
      - ask: >
          Suppose Q is the tangency portfolio. The bold client wants $30\%$
          volatility. What is her expected return, in percent?
        expects: "15.5"
        hint: >
          $a = 30/20$, financed by borrowing at $2\%$.
        feedback: >
          $a = 1.5$: $2 + 1.5(9) = 15.5\%$. She holds the same Q as the
          cautious client, at $1.5$ times capital instead of a quarter.
      - ask: >
          A frontier portfolio R further up the curve has expected return
          $14\%$ at $30\%$ volatility. Should the bold client hold R instead
          of levered Q?
        choices:
          - text: >
              Yes: R reaches $30\%$ volatility without borrowing.
            feedback: >
              Borrowing at $r_f$ is not a cost in itself; it is just another
              point on the line. R gives $14\%$ where levered Q gives $15.5\%$.
          - text: >
              No: R's Sharpe ratio is $0.4$, below Q's $0.45$, so levered Q
              earns more at the same risk.
            correct: true
            feedback: >
              Right. $(14 - 2)/30 = 0.4$. Past the tangency point the frontier
              bends away from the line, and levering the tangency portfolio
              beats every portfolio out there.
          - text: >
              They are equivalent, since both sit at $30\%$ volatility.
            feedback: >
              Equal risk, unequal return: $15.5\%$ against $14\%$. Same
              volatility is where the comparison starts, not where it ends.
        feedback: >
          Off the tangency point, every frontier portfolio is dominated by
          some mix of the tangency portfolio and cash.
      - ask: >
          Two uncorrelated assets have excess returns $4\%$ and $6\%$ and
          variances $0.04$ and $0.09$. What weight does the tangency portfolio
          put on the first?
        expects: "0.6"
        hint: >
          For a diagonal $\Sigma$, $\Sigma^{-1}(\mu - r_f\mathbf{1})$ is each
          excess return divided by its own variance. Then rescale to sum to
          one.
        feedback: >
          $(4/0.04,\, 6/0.09) = (100,\, 66.7)$, summing to $166.7$, so the
          first asset gets $100/166.7 = 0.6$. The asset with the smaller excess
          return gets more weight, because it buys that return with much less
          variance.

      - part: Where everyone stops agreeing
        ask: >
          The global minimum-variance portfolio has weights
          $\propto \Sigma^{-1}\mathbf{1}$. When does it coincide with the
          tangency portfolio?
        choices:
          - text: >
              Always: the safest portfolio is also the best one.
            feedback: >
              In the two-asset example just computed, the minimum-variance
              weights are $\propto (25, 11.1)$, about $0.69$ on the first
              asset, against the tangency $0.6$. Different portfolios.
          - text: >
              When every asset has the same expected excess return.
            correct: true
            feedback: >
              Right. Then $\mu - r_f\mathbf{1}$ is a multiple of $\mathbf{1}$,
              and the two formulas point the same way. Otherwise they differ.
          - text: >
              When the risk-free rate is zero.
            feedback: >
              With $r_f = 0$ the tangency weights are $\propto \Sigma^{-1}\mu$,
              still not $\Sigma^{-1}\mathbf{1}$ unless all means are equal.
        feedback: >
          Minimum variance ignores returns; tangency is driven by them. Do not
          let the shared $\Sigma^{-1}$ blur the two.
      - ask: >
          Now cash still earns $2\%$, but borrowing costs $5\%$. Do the
          cautious and the bold client still hold the same risky portfolio?
        choices:
          - text: >
              No: lenders use the line from $2\%$ and borrowers the line from
              $5\%$, which touch the frontier at different portfolios.
            correct: true
            feedback: >
              Right. Two-fund separation needs one rate for borrowing and
              lending. With two rates, clients in between hold frontier
              portfolios with no cash at all.
          - text: >
              Yes: the tangency portfolio depends only on $\Sigma$ and $\mu$.
            feedback: >
              It also depends on the rate the line starts from. A borrower's
              line starts at $5\%$, and the line from $(0, 5\%)$ touches the
              frontier at a different, riskier point.
          - text: >
              No: the bold client should hold Q, the cautious one P.
            feedback: >
              Separation does break, but not into those two. The lending line
              still picks the maximum-Sharpe portfolio measured from $2\%$; the
              borrowing line picks the one measured from $5\%$.
        feedback: >
          Asked how risky holdings should differ by risk tolerance, say that
          they should not: everyone holds the tangency portfolio and varies
          only the cash weight — provided borrowing and lending happen at one
          rate.
  - node: quant-finance.portfolio.growth-optimal-leverage
    hook: >
      "How much leverage should you run on a strategy with a given Sharpe
      ratio?" has a one-line answer that surprises people the first time:
      growth-optimal leverage on a low-volatility edge is routinely well
      above $1$, and that isn't a red flag by itself.
    explanation: >
      Run leverage $f$ on a portfolio with excess mean $\mu_e$ and
      volatility $\sigma$, continuously rebalanced. Log wealth grows at
      $g(f)=r_f+f\mu_e-f^{2}\sigma^{2}/2$: a linear reward $f\mu_e$ from the
      leveraged exposure minus a quadratic penalty $f^{2}\sigma^{2}/2$, the
      cost of holding a position whose own volatility scales with $f$.

      This is a downward parabola in $f$, so its maximum is where the
      derivative vanishes: $g'(f)=\mu_e-f\sigma^{2}=0$ gives
      $f^{*}=\mu_e/\sigma^{2}$. Substituting back,
      $g(f^{*})=r_f+(\mu_e/\sigma^{2})\mu_e-(\mu_e/\sigma^{2})^{2}
      \sigma^{2}/2=r_f+\mu_e^{2}/\sigma^{2}-\mu_e^{2}/(2\sigma^{2})$, and
      the two fractions combine to $\mu_e^{2}/(2\sigma^{2})$, exactly
      $S^{2}/2$ where $S=\mu_e/\sigma$ is the Sharpe ratio.

      Two readings matter more than the algebra. First, the best
      achievable growth rate above $r_f$ depends on the strategy only
      through its Sharpe ratio — $S$ is literally what compounds, the
      deepest reason Sharpe is the universal quality score in this unit.
      Second, $f^{*}=\mu_e/\sigma^{2}$ is inversely proportional to
      variance, so a strategy with modest excess return but very low
      volatility calls for large leverage; running the full theoretical
      $f^{*}$ is estimation-error suicide in practice precisely because
      $\mu_e$ is never known exactly, so real desks run some fraction of
      it.
    worked: >
      A strategy has excess mean $\mu_e=8\%$ and volatility $\sigma=25\%$,
      so $\sigma^{2}=0.0625$ and $f^{*}=0.08/0.0625=1.28$ — leveraged
      $28\%$ beyond the unlevered position. Its Sharpe ratio is
      $S=0.08/0.25=0.32$, so the maximum excess growth is
      $S^{2}/2=0.1024/2=0.0512$, about $5.12\%$ a year above $r_f$.
    interview: >
      "What leverage maximizes long-run growth, and what does that growth
      rate come out to?" wants $f^{*}=\mu_e/\sigma^{2}$ and the identity
      $g(f^{*})=r_f+S^{2}/2$ both produced, ideally with the observation
      that the answer collapses to Sharpe alone.
    pitfalls: >
      Reporting $f^{*}$ without checking whether it's a sane leverage
      number for the estimation uncertainty involved — a formula returning
      $f^{*}=6$ off a short backtest is telling you more about noise in
      $\hat\mu_e$ than about true optimal leverage. Also dropping $r_f$
      from the total growth rate while correctly keeping it out of
      $f^{*}$ — $r_f$ doesn't affect optimal leverage, but it does still
      add to total growth.
    recap: >
      Growth-optimal leverage is $f^{*}=\mu_e/\sigma^{2}$, and the
      resulting growth rate collapses to $r_f+S^{2}/2$ — depending on the
      strategy only through its Sharpe ratio.
    dialogue:
      - part: More leverage, less growth
        teach: >
          A strategy has excess drift $\mu_e = 6\%$ a year over cash at
          $r_f = 2\%$, and volatility $\sigma = 20\%$. Run at leverage $f$ and
          rebalanced continuously, its log wealth grows at
          $g(f) = r_f + f\mu_e - f^{2}\sigma^{2}/2$ a year.
      - ask: >
          What is the growth rate unlevered, at $f = 1$, in percent?
        expects: "6"
        hint: >
          $\sigma^{2}/2 = 0.02$.
        feedback: >
          $2 + 6 - 2 = 6\%$. The arithmetic excess return is $6$ points, but
          the volatility costs $2$ of them in compounding.
      - ask: >
          A trader runs it at $f = 2.5$. What is the growth rate, in percent?
        expects: "4.5"
        hint: >
          $f\mu_e = 15\%$ and $f^{2}\sigma^{2}/2 = 6.25(0.04)/2$.
        feedback: >
          $2 + 15 - 12.5 = 4.5\%$. Two and a half times the exposure, and
          *less* growth than unlevered.
      - ask: >
          Why did more leverage lower long-run growth?
        choices:
          - text: >
              Borrowing costs eat the extra return.
            feedback: >
              Borrowing at $r_f$ is already netted out: $\mu_e$ is the excess
              over the financing rate. The loss comes from the variance term.
          - text: >
              The extra return grows like $f$, but the volatility drag grows
              like $f^{2}$.
            correct: true
            feedback: >
              Right. At $f = 1$ the drag is $2$ points; at $f = 2.5$ it is
              $12.5$. Past some leverage the quadratic overtakes the line.
          - text: >
              A levered strategy has a lower Sharpe ratio.
            feedback: >
              Leverage leaves the Sharpe ratio exactly where it was, $0.3$ here.
              The strategy is not worse; it is run too large for compounding.
        feedback: >
          Arithmetic return rewards size linearly; compounded growth punishes
          volatility quadratically.
      - ask: >
          $g$ is a downward parabola in $f$. At what leverage is it highest?
        expects: "1.5"
        hint: >
          Set $g'(f) = \mu_e - f\sigma^{2}$ to zero.
        feedback: >
          $f^{*} = 0.06/0.04 = 1.5$. Above $1$, below the trader's $2.5$.
      - ask: >
          What is the growth rate at $f^{*}$, in percent?
        expects: "6.5"
        feedback: >
          $2 + 1.5(6) - 2.25(0.04)/2 = 2 + 9 - 4.5 = 6.5\%$, half a point more
          than unlevered.
      - reflect: >
          At the optimum the growth above $r_f$ was $4.5$ points. Write that in
          terms of $\mu_e$ and $\sigma$, and say which single quantity of the
          strategy it depends on.
        hint: >
          Substitute $f^{*} = \mu_e/\sigma^{2}$ into $f\mu_e - f^{2}\sigma^{2}/2$.
        answer: >
          $\mu_e^{2}/\sigma^{2} - \mu_e^{2}/(2\sigma^{2}) = \mu_e^{2}/(2\sigma^{2})$,
          which is $S^{2}/2$ for the Sharpe ratio $S = \mu_e/\sigma$. Here
          $0.3^{2}/2 = 0.045$. The best growth a strategy can deliver depends on
          nothing but its Sharpe ratio: that is the quantity that compounds.

      - part: Sharpe is what compounds
        teach: >
          That is the proposition. With leverage $f$ on excess mean $\mu_e$ and
          volatility $\sigma$, $g(f) = r_f + f\mu_e - f^{2}\sigma^{2}/2$ is
          maximized at $f^{*} = \mu_e/\sigma^{2}$, where
          $g(f^{*}) = r_f + S^{2}/2$. It is the continuous form of Kelly
          sizing: the same expected-log-wealth objective, with drift and
          variance in place of edge and odds.
      - ask: >
          A quieter strategy has $\mu_e = 3\%$ and $\sigma = 5\%$. What is its
          growth-optimal leverage?
        expects: "12"
        hint: >
          $\sigma^{2} = 0.0025$.
        feedback: >
          $f^{*} = 0.03/0.0025 = 12$. Half the excess return of the first
          strategy and eight times the leverage: $f^{*}$ goes as
          $1/\sigma^{2}$.
      - ask: >
          What is its maximum growth above $r_f$, in percent?
        expects: "18"
        hint: >
          $S = 0.03/0.05$.
        feedback: >
          $S = 0.6$, so $S^{2}/2 = 0.18$: $18\%$ a year above cash, against
          $4.5\%$ for the $S = 0.3$ strategy. Doubling the Sharpe ratio
          quadruples the best achievable excess growth.

      - part: Running it at the wrong size
        ask: >
          Your estimate of the quiet strategy's drift was $50\%$ too high, so
          you run $f = 18$ when the true optimum is $12$. What is the true
          growth above $r_f$, in percent?
        expects: "13.5"
        hint: >
          $f\mu_e - f^{2}\sigma^{2}/2$ with the true $\mu_e = 0.03$.
        feedback: >
          $18(0.03) - 324(0.0025)/2 = 0.54 - 0.405 = 0.135$, so $13.5\%$
          against the $18\%$ available, at $1.5$ times the volatility.
      - ask: >
          And at $f = 6$, half the optimum?
        expects: "13.5"
        feedback: >
          $6(0.03) - 36(0.0025)/2 = 0.18 - 0.045 = 0.135$: the same $13.5\%$.
          The parabola is symmetric about $f^{*}$, so running $6$ below costs
          the same growth as running $6$ above — with a third of the
          volatility of $f = 18$.
      - ask: >
          Why do practitioners run a fraction of $f^{*}$ rather than the full
          amount?
        choices:
          - text: >
              Because $f^{*}$ maximizes the mean of wealth, not its growth.
            feedback: >
              $f^{*}$ maximizes the growth rate of log wealth; that was the
              objective all along. The reason is the uncertainty in its input.
          - text: >
              Because leverage above $1$ is always unsafe.
            feedback: >
              Leverage of $12$ is optimal for the quiet strategy if its
              inputs are right. The danger is not leverage as such but
              leverage computed from a drift you cannot measure precisely.
          - text: >
              Because $\mu_e$ is estimated with error, and overshooting
              $f^{*}$ costs the same growth as undershooting while adding far
              more risk.
            correct: true
            feedback: >
              Right. Undershooting by half keeps three quarters of the
              optimal excess growth at half the volatility; an overestimated
              drift pushes you past $f^{*}$, where growth falls and risk keeps
              rising.
        feedback: >
          Asked what leverage maximizes growth, give $f^{*} = \mu_e/\sigma^{2}$
          and $g = r_f + S^{2}/2$ together, then add that the full amount is
          only as good as the estimate of $\mu_e$.
  - node: quant-finance.portfolio.beta-capm
    hook: >
      Beta is a regression slope wearing a finance costume, and CAPM is one
      sentence built on top of it: interviewers will ask for both the
      number and the one-line argument for why only that number should
      earn a return.
    explanation: >
      $\beta_i=\operatorname{Cov}(R_i,R_m)/\operatorname{Var}(R_m)$ is
      exactly the simple-regression slope of $R_i$ on $R_m$ — covariance
      over the regressor's variance, the identity from linear regression
      applied with the market as the single predictor. Rewriting through
      correlation, $\beta_i=\rho_{im}\sigma_i/\sigma_m$, makes the same
      slope visible as correlation rescaled by the ratio of the two
      volatilities.

      Beta is linear in weights because covariance is bilinear:
      $\operatorname{Cov}(\sum_i w_i R_i,R_m)=\sum_i w_i
      \operatorname{Cov}(R_i,R_m)$, so a portfolio's beta is the weighted
      average of its holdings' betas, with no correction term. The market
      portfolio's own beta against itself is
      $\operatorname{Cov}(R_m,R_m)/\operatorname{Var}(R_m)=1$ by
      construction, the natural anchor: assets riskier than the market in
      the systematic sense have $\beta>1$, defensive ones have $\beta<1$.

      CAPM asserts that in equilibrium only this systematic exposure is
      compensated — the direct pricing consequence of the systematic
      versus idiosyncratic split: $\mathbb{E}[R_i]-r_f=\beta_i
      (\mathbb{E}[R_m]-r_f)$, the security market line, a straight line in
      $\beta$ with intercept $r_f$ and slope the market's own excess
      return. A practical use runs the logic backward: to remove market
      exposure from a position, short $\beta$ dollars of the index per
      dollar of the position, leaving a beta-neutral book whose remaining
      risk is, by construction, entirely idiosyncratic.
    worked: >
      An asset has $\operatorname{Cov}(R_i,R_m)=0.0018$ against a market
      with $\sigma_m=6\%$, so $\operatorname{Var}(R_m)=0.0036$ and
      $\beta=0.0018/0.0036=0.5$. With $r_f=3\%$ and an equity premium of
      $7\%$, CAPM gives $\mathbb{E}[R_i]=3+0.5(7)=6.5\%$.
    interview: >
      Two things get asked back to back: "what is beta" (the regression
      slope $\operatorname{Cov}/\operatorname{Var}$, stated without
      hesitation) and "why does CAPM say only beta is priced" (because the
      idiosyncratic remainder can be diversified away for free, so a
      competitive market pays nothing for carrying it).
    pitfalls: >
      Computing beta as a correlation rather than a regression slope —
      $\rho_{im}$ and $\beta_i=\rho_{im}\sigma_i/\sigma_m$ are different
      numbers unless $\sigma_i=\sigma_m$. And forgetting the hedge amount
      is $\beta$ dollars of index per dollar of stock, not one dollar of
      index per dollar of stock — a $\beta=0.5$ stock needs half as much
      index shorted to go flat.
    recap: >
      Beta is the regression slope of an asset's returns on the market's,
      $\operatorname{Cov}(R_i,R_m)/\operatorname{Var}(R_m)$, and CAPM
      prices only that slope: $\mathbb{E}[R_i]-r_f=\beta_i
      (\mathbb{E}[R_m]-r_f)$.
    dialogue:
      - part: How much index to sell
        teach: >
          You hold $1{,}000{,}000$ dollars of stock X and want to stop caring
          which way the market goes. Suppose X moves exactly $1.5$ times the
          index every day: when the index is up $2\%$, X is up $3\%$; when the
          index is down $1\%$, X is down $1.5\%$.
      - ask: >
          How many dollars of the index must you sell short so that a market
          move leaves the combined position unchanged?
        expects: "1500000"
        hint: >
          On a day the index rises $1\%$, how many dollars does X make?
        feedback: >
          An index move of $1\%$ moves X $1.5\%$, which is $15{,}000$ dollars.
          A short of $1{,}500{,}000$ dollars of index loses exactly
          $15{,}000$ on that day, so the book is flat whatever the market
          does.
      - ask: >
          A real stock is not an exact multiple. Y has volatility $30\%$, the
          index $15\%$, and their correlation is $0.4$. Per dollar of Y, how
          much index removes the market exposure?
        choices:
          - text: >
              $0.4$ dollars: the correlation.
            feedback: >
              Correlation has no units and ignores how far each one moves. Y
              swings twice as hard as the index, so a correlation of $0.4$
              understates how much of Y's move the market explains.
          - text: >
              $2$ dollars: the ratio of the volatilities.
            feedback: >
              That would be right if Y were a perfect multiple of the index,
              $\rho = 1$. At $\rho = 0.4$ most of Y's volatility has nothing to
              do with the market, and hedging it with index adds risk.
          - text: >
              $0.8$ dollars: the correlation times the volatility ratio.
            correct: true
            feedback: >
              Right. $0.4 \times 30/15 = 0.8$. Only the part of Y that moves
              with the market can be hedged with the market, and that part is
              $\rho\sigma_Y/\sigma_m$ per unit of index move.
        feedback: >
          The hedge ratio is the expected move in Y per unit move in the index:
          $0.8$, not $0.4$ and not $2$.
      - reflect: >
          "The expected move in Y per unit move in the index" — you have met
          that quantity before, in another setting. What is it, and how is it
          computed from covariances?
        answer: >
          It is the slope of the regression of Y's returns on the index's:
          $\operatorname{Cov}(R_Y, R_m)/\operatorname{Var}(R_m)$, which
          rewrites as $\rho\sigma_Y/\sigma_m$. The hedge ratio is a regression
          coefficient before it is anything else — and it carries its own name
          in finance.

      - part: Beta, and what the market pays for
        teach: >
          That slope is beta: $\beta_i = \operatorname{Cov}(R_i, R_m)/
          \operatorname{Var}(R_m) = \rho_{im}\sigma_i/\sigma_m$. It is linear in
          weights, so a portfolio's beta is the weighted average of its
          holdings' betas, and the market has $\beta = 1$. The CAPM asserts
          that in equilibrium only this exposure is paid:
          $\mathbb{E}[R_i] - r_f = \beta_i(\mathbb{E}[R_m] - r_f)$, the security
          market line.
      - ask: >
          A book holds $60\%$ in Y, with $\beta = 0.8$, and $40\%$ in a stock
          with $\beta = 1.5$. What is the book's beta?
        expects: "1.08"
        hint: >
          Covariance is linear in each argument, so beta is too.
        feedback: >
          $0.6(0.8) + 0.4(1.5) = 0.48 + 0.6 = 1.08$. No correction term:
          $\operatorname{Cov}(\sum_i w_i R_i, R_m) = \sum_i w_i
          \operatorname{Cov}(R_i, R_m)$.
      - ask: >
          Cash pays $2\%$ and the market is expected to return $8\%$. What
          expected return does the CAPM assign to Y, in percent?
        expects: "6.8"
        hint: >
          The market premium is $8 - 2$, not $8$.
        feedback: >
          $2 + 0.8(8 - 2) = 2 + 4.8 = 6.8\%$. Using $8\%$ as the premium would
          give $8.4\%$, the standard slip.
      - ask: >
          Y's total volatility is $30\%$, twice the market's, yet the CAPM
          gives it less expected return than the market. Why?
        choices:
          - text: >
              The CAPM is wrong about volatile stocks.
            feedback: >
              The CAPM can be tested and argued with, but this result is its
              central point, not a bug: total volatility is the wrong measure
              of what a diversified holder is paid to carry.
          - text: >
              Only the market-driven part of Y's risk is priced, and that part
              is smaller than the market's own risk.
            correct: true
            feedback: >
              Right. Y's systematic volatility is $\beta\sigma_m = 0.8(15) =
              12\%$; the rest of its $30\%$ is idiosyncratic, removable for
              free in a large book, so it earns nothing.
          - text: >
              Correlation $0.4$ means Y is mostly uncorrelated, so it should
              earn the risk-free rate.
            feedback: >
              Low correlation shrinks the priced part, but $\beta = 0.8$ is far
              from $0$. Y earns $0.8$ of the market premium, not none of it.
        feedback: >
          Beta is the systematic share of an asset's risk, measured in units
          of market risk, and the CAPM prices that share alone.

      - part: Betas of zero and below
        ask: >
          A biotech has volatility $60\%$ and correlation $0$ with the market.
          What does the CAPM say about its expected return?
        choices:
          - text: >
              It equals the risk-free rate.
            correct: true
            feedback: >
              Right. $\beta = 0 \times 60/15 = 0$, so the security market line
              gives $r_f + 0 = r_f$, here $2\%$.
          - text: >
              It must be high, to pay for $60\%$ volatility.
            feedback: >
              All $60\%$ is idiosyncratic: a diversified holder sheds it for
              free, so no premium is owed. Its $\beta$ is $0$.
          - text: >
              The CAPM cannot price an asset uncorrelated with the market.
            feedback: >
              It can; $\beta = 0$ is a perfectly good input. Uncorrelated assets
              sit at the intercept of the security market line.
        feedback: >
          A zero-beta asset earns cash, however wild it is on its own.
      - ask: >
          A stock tends to rise when the market falls, with $\beta = -0.3$.
          With cash at $2\%$ and the market expected at $8\%$, what does the
          CAPM give, in percent?
        expects: "0.2"
        hint: >
          The same line, with a negative slope coefficient.
        feedback: >
          $2 + (-0.3)(6) = 2 - 1.8 = 0.2\%$, below cash. A negative-beta asset
          is insurance against the market falling, and investors pay for
          insurance by accepting a lower return. In an interview, give beta as
          the regression slope $\operatorname{Cov}/\operatorname{Var}$ at once,
          then say why only it is priced: the rest diversifies away for free.
  - node: quant-finance.portfolio.alpha-information-ratio
    hook: >
      "What's your alpha and what's your information ratio" is the
      two-number scorecard every market-neutral book is judged on, and both
      only mean anything once an asset's variance is correctly split into
      its market piece and everything left over.
    explanation: >
      Write excess return as $R_i-r_f=\alpha_i+\beta_i(R_m-r_f)
      +\varepsilon_i$ with $\mathbb{E}[\varepsilon_i]=0$ and $\varepsilon_i$
      uncorrelated with the market — beta's regression equation, written
      with its residual made explicit instead of dropped. Alpha is the
      intercept: the average excess return left over after the
      market-exposure term is subtracted out, the part CAPM's pricing
      logic says should not exist in a market where only systematic risk
      is compensated.

      Because $\varepsilon_i$ is uncorrelated with $R_m$, variance splits
      with no cross term: $\sigma_i^{2}=\beta_i^{2}\sigma_m^{2}
      +\omega_i^{2}$, where $\omega_i=\sigma(\varepsilon_i)$ is residual
      (idiosyncratic) risk — the exact quantity named as uncompensated one
      step earlier. The fraction of variance the market explains is the
      regression $R^{2}=\rho_{im}^{2}=\beta_i^{2}\sigma_m^{2}/\sigma_i^{2}$,
      leaving $1-R^{2}$ as the idiosyncratic share.

      The information ratio $\operatorname{IR}=\alpha/\omega$ is exactly a
      Sharpe ratio computed on the residual alone — excess return per unit
      of the risk that is actually yours to be judged on, since the
      market-driven part of return and risk cancels out of both numerator
      and denominator by construction. This is why a market-neutral book
      reports IR rather than raw Sharpe: raw Sharpe would credit market
      beta as if it were skill. One caveat that matters in practice: alpha
      is always relative to whichever factor model defines $\beta$, so
      adding a new systematic factor to the model can turn what looked like
      alpha into beta against that new factor overnight.
    worked: >
      An asset has $\beta=0.8$ against a market with $\sigma_m=18\%$
      ($\sigma_m^{2}=0.0324$) and total volatility $\sigma_i=20\%$
      ($\sigma_i^{2}=0.04$). Systematic variance: $0.64(0.0324)=0.020736$.
      Residual variance: $0.04-0.020736=0.019264$, so $\omega\approx13.9\%$,
      and $R^{2}=0.020736/0.04\approx0.518$. If observed alpha is $2.5\%$ a
      year, $\operatorname{IR}=2.5/13.9\approx0.18$ — a modest information
      ratio despite a healthy $\alpha$, because the residual risk that
      alpha is judged against is still almost $14\%$.
    interview: >
      Given a beta, a market volatility, and a total volatility, produce
      the variance split $\sigma_i^{2}=\beta_i^{2}\sigma_m^{2}+\omega_i^{2}$
      before reaching for the information ratio — interviewers often
      front-load the question with exactly those three numbers to see if
      residual risk is computed correctly.
    pitfalls: >
      Using total volatility $\sigma_i$ in place of residual volatility
      $\omega_i$ when computing IR — that silently understates the ratio by
      mixing in compensated systematic risk. And treating alpha as a
      fixed, model-independent property of an asset — it is defined
      relative to whatever factor model produced $\beta$, and changing the
      model changes it.
    recap: >
      Alpha is the market-adjusted intercept, residual risk $\omega$
      splits cleanly out of total variance via $\sigma_i^{2}=\beta_i^{2}
      \sigma_m^{2}+\omega_i^{2}$, and the information ratio $\alpha/\omega$
      is the Sharpe ratio of what's left after market exposure is stripped
      out.
    dialogue:
      - part: Two funds against one market
        teach: >
          The market's average excess return over cash is $6\%$ a year, at
          volatility $15\%$. Fund F averages $9\%$ excess with a market beta of
          $1.2$. Fund G averages $4\%$ excess with a beta of $0.25$. Both
          managers claim skill.
      - ask: >
          How many points of F's $9\%$ excess return does its market exposure
          account for?
        expects: "7.2"
        hint: >
          Beta times the market's excess return.
        feedback: >
          $1.2(6) = 7.2$. Anyone could have earned that by holding $1.2$
          dollars of index per dollar of capital, financed at the cash rate.
          F's leftover is $9 - 7.2 = 1.8$ points.
      - ask: >
          And G's leftover, after its market exposure is taken out?
        expects: "2.5"
        feedback: >
          $4 - 0.25(6) = 4 - 1.5 = 2.5$ points: more left over than F's
          $1.8$, from a fund with less than half F's return.
      - ask: >
          Which fund shows more return beyond what market exposure explains?
        choices:
          - text: >
              F: $9\%$ beats $4\%$.
            feedback: >
              Most of F's $9\%$ is beta: $7.2$ points of it come from holding
              the market at $1.2$ times. Raw return credits market exposure as
              if it were skill.
          - text: >
              Neither: both earned less than a levered index position would.
            feedback: >
              A levered index at F's beta earns $7.2$, less than F's $9$; at
              G's beta, $1.5$, less than G's $4$. Both beat their own market
              exposure.
          - text: >
              G: $2.5$ points of leftover against F's $1.8$.
            correct: true
            feedback: >
              Right. Strip out what beta explains and G has more left. Whether
              that leftover is impressive depends on how much risk came with
              it.
        feedback: >
          The leftover is the intercept of the regression of the fund's excess
          return on the market's — it has a name.
      - reflect: >
          To judge G's $2.5$ points, you need a risk to divide them by. Why
          not G's total volatility — and what risk should it be instead?
        answer: >
          Total volatility includes the market-driven part, which anyone can
          buy or hedge with index for nothing and which earned the
          $1.5$ points you already set aside. The leftover return should be
          judged against the leftover risk: the volatility of the part of G's
          return the market does not explain. That is what a market-neutral
          version of G, hedged to zero beta, would actually carry.

      - part: Alpha, residual risk, and their ratio
        teach: >
          Write $R_i - r_f = \alpha_i + \beta_i(R_m - r_f) + \varepsilon_i$,
          with $\varepsilon_i$ mean zero and uncorrelated with the market.
          Alpha is the intercept; $\omega_i = \sigma(\varepsilon_i)$ is residual
          risk. Because $\varepsilon_i$ is uncorrelated with $R_m$, the
          variance splits as $\sigma_i^{2} = \beta_i^{2}\sigma_m^{2} +
          \omega_i^{2}$. The information ratio $\operatorname{IR} =
          \alpha/\omega$ is the Sharpe ratio of the residual.
      - ask: >
          F's total volatility is $30\%$. What is its residual volatility
          $\omega$, in percent?
        expects: "24"
        hint: >
          Systematic variance is $\beta^{2}\sigma_m^{2} = 1.44(0.0225)$.
        feedback: >
          $0.09 - 0.0324 = 0.0576$, so $\omega = 24\%$. F's systematic
          volatility is $1.2(15) = 18\%$, and $18^{2} + 24^{2} = 30^{2}$: the
          pieces add in squares, not in volatilities.
      - ask: >
          What is F's information ratio?
        expects: "0.075"
        feedback: >
          $1.8/24 = 0.075$. Under a tenth of a unit of alpha per unit of
          residual risk: barely distinguishable from luck.
      - ask: >
          G's residual volatility is $5\%$. What is G's information ratio?
        expects: "0.5"
        feedback: >
          $2.5/5 = 0.5$, more than six times F's. Hedged to zero beta, G is a
          strategy worth running; F is mostly an expensive index fund.
      - ask: >
          An analyst scores F by dividing its alpha by its total volatility,
          $1.8/30 = 0.06$. What is wrong with that?
        choices:
          - text: >
              Nothing: total volatility is the risk the investor actually
              experiences.
            feedback: >
              An investor who hedges F's beta experiences only the $24\%$.
              Alpha is the return of that hedged position, so its risk is the
              matching yardstick.
          - text: >
              It mixes compensated market risk into the denominator, so it
              understates the ratio.
            correct: true
            feedback: >
              Right. The $18\%$ of systematic volatility is paid for by the
              $7.2$ points of beta return already set aside. Leaving it in the
              denominator charges the alpha for risk it did not bring.
          - text: >
              It should use the market's volatility, $15\%$.
            feedback: >
              The market's volatility measures the market, not F's residual.
              The alpha came with $24\%$ of risk that has nothing to do with
              the market.
        feedback: >
          Alpha over residual risk: numerator and denominator both describe the
          hedged position.

      - part: Alpha is relative to a model
        ask: >
          Later, G's returns are regressed on the market *and* a small-company
          factor. G's intercept falls from $2.5\%$ to $0.5\%$. What happened
          to the other $2$ points?
        choices:
          - text: >
              They were estimation noise, now removed.
            feedback: >
              Adding a regressor does not remove noise from the intercept; it
              moves return that the new factor explains out of the intercept
              and into a new beta.
          - text: >
              G's manager lost skill when the model changed.
            feedback: >
              G's returns are the same numbers as before. Only the benchmark
              changed, and with it the definition of what counts as left over.
          - text: >
              They were exposure to the small-company factor, which the first
              model counted as alpha.
            correct: true
            feedback: >
              Right. Yesterday's alpha is today's beta: return from a
              systematic factor that anyone could buy cheaply once it is named.
        feedback: >
          Alpha is always benchmark-relative. Given a beta, a market volatility
          and a total volatility in an interview, split the variance into
          $\beta^{2}\sigma_m^{2} + \omega^{2}$ first, then divide alpha by
          $\omega$, and say which model the alpha is relative to.
  - node: quant-finance.portfolio.breadth
    hook: >
      This is the formula that explains why quant firms trade thousands of
      tiny, barely-detectable edges instead of a handful of big convictions:
      skill alone says almost nothing about performance without knowing how
      many independent times it gets to compound.
    explanation: >
      Let $\operatorname{IC}$ (information coefficient) be the correlation
      between your forecast and the realized outcome on one bet, and
      $\operatorname{BR}$ (breadth) the number of independent bets made per
      year. Under three conditions — the same $\operatorname{IC}$ on every
      bet, the bets are independent, and risk is allocated across them
      optimally — the fundamental law of active management gives
      $\operatorname{IR}\approx\operatorname{IC}\sqrt{\operatorname{BR}}$.

      The $\sqrt{\operatorname{BR}}$ is the exact same $\sqrt t$ scaling
      behind Sharpe's annualization: each independent bet is one more
      roughly-iid observation of your edge, and stacking $n$ independent
      observations grows the signal linearly while the noise only grows
      like $\sqrt n$, so the signal-to-noise ratio improves like
      $\sqrt{\operatorname{BR}}$. Breadth is doing for a forecasting edge
      exactly what sample size does for detecting any small effect: it is
      literally the sample size of your skill.

      The scaling has a brutal consequence for how skill should be
      deployed: doubling $\operatorname{IR}$ needs quadrupling breadth, so
      an edge repeated a thousand times a year is a career, and the same
      edge used four times a year is statistical noise. This is the
      quantitative case for market-making and high-frequency strategies
      over discretionary, low-frequency ones with a similar-sized per-trade
      edge — frequency compounds skill in a way size of edge alone cannot
      match.
    worked: >
      An edge of $\operatorname{IC}=0.02$ applied once a year gives
      $\operatorname{IR}=0.02\sqrt1=0.02$ — indistinguishable from noise.
      The identical skill applied once a trading day,
      $\operatorname{BR}=252$, gives $\operatorname{IR}=0.02\sqrt{252}
      \approx0.02(15.87)\approx0.317$ — nearly sixteen times larger, from
      the same forecasting ability, purely because it now compounds across
      $252$ independent trials instead of one, and $\operatorname{IR}$
      grows only like the square root of that count.
    interview: >
      Interviewers often frame this as "would you rather have a strategy
      with a bigger edge traded rarely, or a smaller edge traded
      constantly?" — the strong answer reaches for
      $\operatorname{IR}\approx\operatorname{IC}\sqrt{\operatorname{BR}}$
      and notes that quadrupling breadth buys the same $\operatorname{IR}$
      gain as doubling skill.
    pitfalls: >
      Counting positions instead of independent bets as breadth — a
      hundred correlated variations on one idea is not a hundred
      independent bets. Also forgetting the three conditions behind the
      approximation: unequal $\operatorname{IC}$ across bets, correlated
      bets, or suboptimal risk allocation all make the actual
      $\operatorname{IR}$ fall short of
      $\operatorname{IC}\sqrt{\operatorname{BR}}$.
    recap: >
      The fundamental law $\operatorname{IR}\approx\operatorname{IC}
      \sqrt{\operatorname{BR}}$ says information ratio scales with the
      square root of independent bets — quadrupling breadth substitutes
      for doubling skill.
    dialogue:
      - part: A fifty-two percent edge
        teach: >
          Each of your trades is a bet that wins $1$ unit with probability
          $0.52$ and loses $1$ unit otherwise, and the trades are independent.
          The standard deviation of one bet is almost exactly $1$.
      - ask: >
          What is the expected profit of one bet, in units?
        expects: "0.04"
        feedback: >
          $0.52(1) + 0.48(-1) = 0.04$. Against a standard deviation of about
          $1$, that is an edge of $0.04$ per unit of risk: invisible on any
          single trade.
      - ask: >
          You place $400$ such bets in a year. What is the ratio of the year's
          expected profit to its standard deviation? Two decimals.
        expects: "0.8"
        tolerance: 0.01
        hint: >
          Means add across independent bets; so do variances.
        feedback: >
          Expected profit $400(0.04) = 16$ units; variance about $400$, so a
          standard deviation of about $\sqrt{400} = 20$. The ratio is
          $16/20 = 0.8$, a respectable year from an edge you could not see on
          one trade.
      - ask: >
          Same edge, but only $4$ bets a year. What is the ratio now? Two
          decimals.
        expects: "0.08"
        tolerance: 0.005
        feedback: >
          $4(0.04) = 0.16$ over $\sqrt{4} = 2$, so $0.08$: one tenth of the
          busier trader's figure, with exactly the same skill per bet.
      - ask: >
          Why does the busier trader's year look ten times better when each
          bet is equally good?
        choices:
          - text: >
              Expected profit grows like the number of bets, the noise only
              like its square root.
            correct: true
            feedback: >
              Right. $100$ times the bets gives $100$ times the mean and
              $\sqrt{100} = 10$ times the standard deviation, so the ratio
              improves tenfold.
          - text: >
              More bets mean more profit, and the ratio tracks profit.
            feedback: >
              Profit is $100$ times larger, but the ratio is only $10$ times
              larger. Something grows along with the profit and eats part of
              it.
          - text: >
              With more bets the edge per bet gets larger by averaging.
            feedback: >
              The edge per bet is $0.04$ either way. Averaging shrinks the
              *noise* relative to the edge; it does not create edge.
        feedback: >
          This is the $\sqrt{t}$ scaling of the Sharpe ratio, counted in bets
          instead of days.
      - reflect: >
          Write the year's ratio in terms of the per-bet edge and the number
          of bets. What does that formula say about where a strong track record
          comes from?
        answer: >
          Ratio $\approx$ (edge per unit risk) $\times \sqrt{\text{number of
          independent bets}}$: $0.04\sqrt{400} = 0.8$. A strong record can come
          from a large edge used rarely or a small edge used often, and since
          large edges are scarce, it almost always comes from the second:
          many small independent bets.

      - part: The fundamental law
        teach: >
          In the general form, the per-bet edge is the information coefficient
          $\operatorname{IC}$, the correlation between your forecast and the
          realized return on one bet, and $\operatorname{BR}$, breadth, is the
          number of independent bets a year. If $\operatorname{IC}$ is the same
          across bets, the bets are independent, and risk is allocated across
          them optimally, then $\operatorname{IR} \approx \operatorname{IC}
          \sqrt{\operatorname{BR}}$.
      - ask: >
          A stat-arb signal has $\operatorname{IC} = 0.03$ and is applied to
          $900$ independent bets a year. What information ratio does the law
          predict?
        expects: "0.9"
        feedback: >
          $0.03\sqrt{900} = 0.03(30) = 0.9$.
      - ask: >
          A discretionary manager makes $9$ independent calls a year. What
          $\operatorname{IC}$ would she need to match that $0.9$?
        expects: "0.3"
        hint: >
          Solve $\operatorname{IC}\sqrt{9} = 0.9$.
        feedback: >
          $0.9/3 = 0.3$: ten times the stat-arb signal's skill, a forecast
          correlation almost no one sustains. Breadth is the cheaper road.
      - ask: >
          The stat-arb desk, keeping its $\operatorname{IC}$ of $0.03$, wants
          to triple its information ratio to $2.7$. How many independent bets
          a year does it need?
        expects: "8100"
        hint: >
          $\operatorname{IR}$ goes as $\sqrt{\operatorname{BR}}$, so tripling it
          costs a factor of $3^{2}$ in breadth.
        feedback: >
          $(2.7/0.03)^{2} = 90^{2} = 8100$, nine times the original $900$.
          Every doubling of $\operatorname{IR}$ costs four times the breadth;
          every tripling, nine.

      - part: What counts as a bet
        ask: >
          To raise breadth, a trader splits every order into two halves sent a
          minute apart, on the same signal. What happens to
          $\operatorname{BR}$?
        choices:
          - text: >
              It doubles, so $\operatorname{IR}$ rises by $\sqrt{2}$.
            feedback: >
              Two halves of one bet win and lose together: their outcomes are
              almost perfectly correlated. The law counts independent bets, and
              this adds none.
          - text: >
              It is unchanged: two halves of one bet are one bet.
            correct: true
            feedback: >
              Right. Breadth is the number of independent forecasts, not the
              number of tickets. Splitting orders changes execution, not
              information.
          - text: >
              It halves, since each half is a smaller bet.
            feedback: >
              Bet size is set by the risk allocation; breadth counts how many
              separate pieces of information you act on. Splitting changes
              neither.
        feedback: >
          The square root rewards independence, not activity.
      - ask: >
          A fund holds $900$ positions, all chosen by one sector-wide view of
          the same news. How does its information ratio compare with
          $\operatorname{IC}\sqrt{900}$?
        choices:
          - text: >
              It matches, since there are $900$ positions.
            feedback: >
              The law's independence condition fails: one view expressed $900$
              times moves as roughly one bet, and the noise does not average
              away.
          - text: >
              It is higher, because concentrated conviction adds edge.
            feedback: >
              Concentration adds risk that moves together; it does not raise
              the per-bet $\operatorname{IC}$. Correlated bets push the ratio
              down, not up.
          - text: >
              It falls well short, because correlated positions are far fewer
              independent bets.
            correct: true
            feedback: >
              Right. With correlated bets the noise grows faster than
              $\sqrt{N}$, so the effective breadth — and the ratio — is far
              smaller than the position count suggests.
        feedback: >
          Asked whether you would rather have a bigger edge traded rarely or a
          smaller one traded constantly, reach for
          $\operatorname{IR} \approx \operatorname{IC}\sqrt{\operatorname{BR}}$
          and say that quadrupling independent breadth buys what doubling skill
          does.
  - node: quant-finance.portfolio.effective-breadth
    hook: >
      "You have a hundred positions" sounds like a hundred independent
      bets, and the desk that treats it that way is routinely off by an
      order of magnitude — correlation quietly caps how much breadth you
      can ever actually buy.
    explanation: >
      Breadth counts independent bets, not raw position count. If $N$ bets
      each have variance $1$ (in whatever units) and average pairwise
      correlation $\bar\rho$, the variance-of-a-sum identity gives the
      equal-weighted sum a variance of $N[1+(N-1)\bar\rho]$ — the $N$
      own-variance terms plus $N(N-1)$ covariance terms, each $\bar\rho$.
      If the $N$ bets were genuinely independent, that variance would just
      be $N$; the ratio $[1+(N-1)\bar\rho]$ is exactly the factor by which
      correlation inflates it above the independent case.

      Effective breadth is defined so that an equivalent fully-independent
      portfolio of that size would produce the same variance inflation,
      giving $N_{\text{eff}}=N/[1+(N-1)\bar\rho]$. As $N\to\infty$ this
      does not grow without bound — it converges to $1/\bar\rho$, a hard
      ceiling set entirely by the correlation, no matter how many nominal
      positions you add beyond that point.

      This is the diversification floor read from the opposite side of the
      ledger: there, average covariance capped how much portfolio variance
      could fall; here, average correlation caps how much genuine breadth a
      set of forecasts can deliver, feeding directly into the fundamental
      law's $\operatorname{IR}\approx\operatorname{IC}
      \sqrt{\operatorname{BR}}$ with $N_{\text{eff}}$ in place of the naive
      position count. A hundred analysts independently rediscovering the
      same signal, or a hundred parameter variations of one model, is one
      bet, no matter how the position count looks on a risk report.
    worked: >
      $N=50$ positions with average pairwise correlation $\bar\rho=0.2$:
      $N_{\text{eff}}=50/[1+49(0.2)]=50/10.8\approx4.63$, already close to
      the theoretical cap $1/0.2=5$. If treated (wrongly) as independent,
      $\operatorname{IR}$ would scale as $\operatorname{IC}\sqrt{50}
      \approx7.07\operatorname{IC}$; correctly, it scales as
      $\operatorname{IC}\sqrt{4.63}\approx2.15\operatorname{IC}$ — more
      than a threefold overstatement from ignoring correlation.
    interview: >
      "You have a hundred correlated positions — what's your real
      information ratio?" wants the effective-breadth substitution named
      directly, $N_{\text{eff}}=N/[1+(N-1)\bar\rho]$, capped at
      $1/\bar\rho$, rather than an answer that treats position count as
      breadth.
    pitfalls: >
      Adding more correlated positions expecting IR to keep improving —
      past a point set by $1/\bar\rho$, it essentially stops, no matter how
      many more names get added. Also underestimating $\bar\rho$:
      strategies that look different on the surface often share a hidden
      common factor, and the correlation that matters is the realized one,
      not the one assumed at design time.
    recap: >
      Effective breadth is $N/[1+(N-1)\bar\rho]$, capped at $1/\bar\rho$
      regardless of how large $N$ grows — correlated positions are the
      same bet wearing different labels.
    dialogue:
      - part: Eighty-one bets that lean together
        teach: >
          A desk runs $81$ bets of equal size, each with the same small edge
          and unit variance. Any two of them have correlation $0.05$ — they
          lean on a shared market view, but only slightly.
      - ask: >
          Before computing: how many independent bets is this book worth?
        choices:
          - text: >
              Essentially $81$: a correlation of $0.05$ is negligible.
            feedback: >
              Negligible for one pair, but every bet has $80$ partners, and the
              small correlation is paid $80$ times over. Compute before you
              trust it.
          - text: >
              Far fewer than $81$.
            correct: true
            feedback: >
              Right, and the count is surprising. The next two computations
              find it.
          - text: >
              Exactly $81 \times 0.95$, about $77$.
            feedback: >
              The correlation does not shave a fixed share off each bet. It
              enters once per *pair*, and there are $81 \times 80$ ordered
              pairs.
        feedback: >
          The test is the variance of the book, which counts every pair.
      - ask: >
          What is the variance of the sum of the $81$ bets, in units of one
          bet's variance?
        expects: "405"
        hint: >
          $81$ variance terms of $1$, plus $81 \times 80$ covariance terms of
          $0.05$.
        feedback: >
          $81 + 81(80)(0.05) = 81 + 324 = 405$. Independent bets would give
          $81$; the correlation has multiplied the variance by $5$.
      - ask: >
          $n$ independent bets with edge $\mu$ give a mean-to-noise ratio of
          $n\mu/\sqrt{n} = \mu\sqrt{n}$. The desk's book gives
          $81\mu/\sqrt{405}$. What $n$ matches it?
        expects: "16.2"
        hint: >
          Square both sides: $n = 81^{2}/405$.
        feedback: >
          $6561/405 = 16.2$. Eighty-one positions buy the information ratio of
          about sixteen independent bets.
      - reflect: >
          A correlation of $0.05$ looked harmless and cost four fifths of the
          breadth. What does each additional bet bring into the book besides
          its own edge and its own noise?
        answer: >
          A covariance with every bet already held. The $n$-th bet adds one
          variance term but $2(n-1)$ covariance terms, so as the book grows
          the shared part of the noise comes to dominate and stops averaging
          away. Past some size, a new bet mostly adds another copy of the
          common view.

      - part: The cap on breadth
        teach: >
          The general count: $N$ bets with average pairwise correlation
          $\bar\rho$ have a sum whose variance is $N[1 + (N-1)\bar\rho]$ times
          one bet's, so the effective number of independent bets is
          $N/[1 + (N-1)\bar\rho]$. As $N \to \infty$ it rises not to infinity
          but to $1/\bar\rho$. This is the diversification floor seen from the
          alpha side.
      - ask: >
          The desk grows to $400$ bets, still at $\bar\rho = 0.05$. What is
          the effective breadth? Two decimals.
        expects: "19.09"
        tolerance: 0.01
        feedback: >
          $400/[1 + 399(0.05)] = 400/20.95 \approx 19.09$. Five times the
          positions, not even $1.2$ times the breadth of $81$ bets.
      - ask: >
          What is the most effective breadth any number of such bets can
          reach?
        expects: "20"
        feedback: >
          $1/\bar\rho = 1/0.05 = 20$. The desk is already at $19.09$; the next
          thousand positions buy less than one independent bet.
      - ask: >
          The desk wants a higher information ratio. Which move helps more?
        choices:
          - text: >
              Add $400$ more positions on the same signal.
            feedback: >
              That takes effective breadth from $19.09$ to about $19.5$, a
              percent or two of $\operatorname{IR}$. The cap is $20$ however
              many positions you add.
          - text: >
              Raise the size of every position.
            feedback: >
              Size scales mean and noise together, so it leaves the
              information ratio where it was. Breadth is about how many
              independent pieces of information, not how much capital.
          - text: >
              Find a second signal uncorrelated with the first.
            correct: true
            feedback: >
              Right. A genuinely new source of bets lifts the cap itself: the
              ceiling $1/\bar\rho$ belongs to one idea, and only a different
              idea escapes it.
        feedback: >
          Past the cap, breadth comes from new ideas, not more tickets.

      - part: One idea, many tickets
        ask: >
          Sixty analysts each pick a stock, but they all read the same news
          and their picks have average correlation $0.4$. What is the
          effective breadth? Two decimals.
        expects: "2.44"
        tolerance: 0.01
        hint: >
          $1 + 59(0.4)$ in the denominator.
        feedback: >
          $60/[1 + 23.6] = 60/24.6 \approx 2.44$. Sixty analysts, two and a
          half bets; the cap is $1/0.4 = 2.5$.
      - ask: >
          Where does the intuition "a small correlation barely matters"
          actually hold?
        choices:
          - text: >
              In a large book, where the small correlation averages out.
            feedback: >
              The opposite: in a large book it is multiplied by the number of
              partners. At $\bar\rho = 0.05$, $500$ bets are worth about $19$.
          - text: >
              Nowhere: any correlation above zero destroys most of the
              breadth.
            feedback: >
              Five bets at $\bar\rho = 0.05$ are worth $5/1.2 \approx 4.2$, most
              of the five. The damage depends on how many partners each bet
              has.
          - text: >
              In a small book: with $5$ bets, $\bar\rho = 0.05$ costs less than
              one bet.
            correct: true
            feedback: >
              Right. $(N - 1)\bar\rho$ is what matters. It is $0.2$ for five
              bets and about $25$ for five hundred.
        feedback: >
          Asked for the real information ratio of a hundred correlated
          positions, name $N/[1 + (N-1)\bar\rho]$, give its cap $1/\bar\rho$,
          and put the effective count, not the position count, under the
          square root.
