unit: quant-probability.continuous
opening: >
  Continuous distributions swap the pmf's point masses for a density, but the
  interview toolkit is really just a short list of named laws and the moves
  that connect them. The unit opens with the uniform and its Beta relative —
  the exact law behind order statistics and random spacings — then spends
  its center of gravity on the exponential, where memorylessness and
  additive rates power races between competing clocks and waiting-time
  puzzles. It turns next to the normal, where standardization and the
  68–95–99.7 table do the daily work, and closes with three laws built from
  the normal by one simple operation each — exponentiating (lognormal),
  squaring and summing (chi-square), and dividing (Cauchy) — each showing
  what survives and what breaks when you transform a bell curve.
lessons:
  - node: quant-probability.continuous.uniform
    hook: >
      "Pick a point at random on this interval" questions are uniform
      problems in disguise, and the whole point of this law is that you
      measure lengths instead of integrating.
    explanation: >
      Because a continuous variable assigns probability zero to any single
      point, "no value favored" has to mean something about intervals
      instead: every subinterval's probability should be proportional to its
      length. Demanding that forces a constant density, and normalizing so
      the total is $1$ over $[a,b]$ pins it at $f(x)=1/(b-a)$ — the one flat
      function on that interval that integrates to $1$.

      Integrating the constant density gives the CDF $F(x)=(x-a)/(b-a)$, but
      you rarely need to integrate at all: since the density never changes,
      $\Pr(c\le X\le d)$ is just $(d-c)/(b-a)$, a ratio of lengths read off
      directly. Symmetry places the mean and median at the midpoint
      $(a+b)/2$ with no computation.

      For the variance, standardize first: on $U(0,1)$,
      $\mathbb{E}[X^{2}]=\int_0^1 x^2\,dx=1/3$, so
      $\operatorname{Var}(X)=1/3-1/4=1/12$. Since every uniform is an affine
      image of $U(0,1)$, $X=a+(b-a)U$, and variance scales by the square of
      the coefficient, $\operatorname{Var}(X)=(b-a)^{2}/12$ in general.
    worked: >
      Let $X\sim U(2,14)$. Then $\Pr(5\le X\le 9)=(9-5)/(14-2)=4/12=1/3$. The
      mean is $(2+14)/2=8$, and $\operatorname{Var}(X)=(14-2)^{2}/12
      =144/12=12$, so the standard deviation is $\sqrt{12}=2\sqrt{3}
      \approx 3.464$.
    interview: >
      "A point is dropped uniformly on $[0,L]$" or "you arrive at a random
      time" both signal a uniform law; the interviewer wants probability
      treated as a length ratio, not a fresh integral each time.
    pitfalls: >
      Writing $f(x)=1$ by default only holds for $U(0,1)$ — on a general
      interval the density is $1/(b-a)$, not $1$. Confusing the standard
      variance $1/12$ with the second moment $1/3$ is the other common slip.
    recap: >
      Under a uniform law probability is pure length — $(d-c)/(b-a)$ for any
      subinterval — the mean sits at the midpoint, and the variance is
      $(b-a)^{2}/12$.
    dialogue:
      - part: A courier with no favourite moment
        teach: >
          A courier promises delivery between $1$ pm and $5$ pm, and in your
          experience no part of that window is likelier than any other. Let
          $X$ be the arrival time in hours after noon, so $X$ lies somewhere
          between $1$ and $5$.
      - ask: >
          What is the probability the courier arrives between $2$ pm and
          2:30 pm?
        expects: "1/8"
        hint: >
          How much of the four-hour window does that half hour take up?
        feedback: >
          The half hour is $0.5$ of the $4$ hours, so the probability is
          $0.5/4 = 1/8$. With no moment favoured, every stretch of the window
          gets probability in proportion to its length.
      - ask: >
          What is the probability the courier arrives at exactly 3:00:00
          pm, to the last decimal place of the second?
        choices:
          - text: >
              $1/4$, since $3$ pm is one of the four hours
            feedback: >
              $1/4$ belongs to the whole hour from $3$ to $4$ pm. A single
              instant is a stretch of length zero inside that hour.
          - text: >
              $1/240$, since it is one minute out of $240$
            feedback: >
              That is the probability of the minute from 3:00 to 3:01.
              Shrink the stretch to a second, a millisecond, an instant, and
              the length ratio shrinks with it.
          - text: >
              $0$
            correct: true
            feedback: >
              Right. The instant has length $0$, so its probability is $0$ —
              and yet the courier certainly arrives at some instant.
        feedback: >
          Every single instant has probability $0$, so probabilities for this
          $X$ cannot be listed point by point the way a die's can. They have
          to be attached to stretches of time.
      - reflect: >
          Single instants carry nothing, yet every stretch of the window
          carries its share. What could you draw above the interval from $1$
          to $5$ so that the probability of any stretch is an area — and what
          does "no part likelier" force that drawing to look like?
        hint: >
          The area above the whole window has to be the total probability.
        answer: >
          A curve whose area over any stretch is that stretch's probability.
          "No part likelier" means equal-length stretches get equal areas,
          which forces the curve to be flat; total area $1$ over a base of
          length $4$ then forces the height to be $1/4$. The flat height is the
          density, and the area under it from $1$ to $x$ is the probability
          of arriving by $x$.
      - teach: >
          That is the continuous uniform law. $X \sim U(a,b)$ has density
          $f(x) = 1/(b-a)$ on $[a,b]$ and $0$ elsewhere, so
          $\Pr(c \le X \le d) = (d-c)/(b-a)$ for any stretch inside, and the
          CDF is $F(x) = \Pr(X \le x) = (x-a)/(b-a)$ on the interval, $0$
          below it and $1$ above. The courier is $U(1,5)$.
      - ask: >
          For the courier, what is $F(2.5)$, the probability of arriving by
          2:30 pm?
        expects: "3/8"
        hint: >
          Measure from the start of the window, not from noon.
        feedback: >
          $F(2.5) = (2.5 - 1)/(5 - 1) = 1.5/4 = 3/8$. Measuring from noon
          gives $2.5/4$, which counts an hour in which the courier never
          comes.

      - part: Which of these is uniform
        ask: >
          Four proposed laws for a point on $[0, 2]$. Which one is
          $U(0,2)$?
        choices:
          - text: >
              Density $1$ on $[0,2]$
            feedback: >
              Flat, but the area is $1 \times 2 = 2$, so it claims a total
              probability of $2$. Height $1$ is right only on an interval of
              length $1$.
          - text: >
              Density $x/2$ on $[0,2]$
            feedback: >
              The area is $1$, but the curve rises: the stretch $[1.5, 2]$
              gets $7/16$ and $[0, 0.5]$ only $1/16$. Late points are
              favoured.
          - text: >
              Density $1/2$ on $[0,2]$
            correct: true
            feedback: >
              Flat and of area $1/2 \times 2 = 1$: both conditions you were
              checking hold.
          - text: >
              $X = 2B$ with $B$ a fair coin showing $0$ or $1$
            feedback: >
              Mean $1$ like $U(0,2)$, but all the probability sits on two
              points, $0$ and $2$, and every stretch between them gets
              nothing.
        feedback: >
          Two checks, one per wrong answer: the density must be constant on
          the interval (so no stretch is favoured), and its height must be
          one over the length (so the total is $1$).

      - part: Centre and spread
        ask: >
          What is the courier's expected arrival time, in hours after noon?
        expects: "3"
        hint: >
          Where does a flat density balance?
        feedback: >
          A flat density balances at its midpoint, $(1+5)/2 = 3$, so
          $3$ pm. The median is also $3$: half the window lies on each side.
      - ask: >
          Take $U \sim U(0,1)$. Integrating, $\mathbb{E}[U^{2}] = \int_0^1
          u^{2}\,du = 1/3$. What is $\operatorname{Var}(U)$?
        expects: "1/12"
        hint: >
          Variance is the second moment minus the square of the mean.
        feedback: >
          $\operatorname{Var}(U) = 1/3 - (1/2)^{2} = 1/3 - 1/4 = 1/12$. The
          $1/3$ is the second moment, not the variance — a slip worth
          watching for.
      - ask: >
          The courier's time can be written $X = 1 + 4U$ with
          $U \sim U(0,1)$. What is $\operatorname{Var}(X)$?
        expects: "4/3"
        hint: >
          A shift changes nothing; a scale factor enters squared.
        feedback: >
          $\operatorname{Var}(X) = 4^{2} \times 1/12 = 16/12 = 4/3$, the
          general $(b-a)^{2}/12$ with $b - a = 4$. Answering $4/12 = 1/3$
          forgets to square the stretch factor.

      - part: Where no uniform exists
        ask: >
          A colleague asks for "a number chosen uniformly at random from all
          positive reals". What goes wrong?
        choices:
          - text: >
              Nothing: take the density to be $0$ everywhere, since the
              interval is infinite
            feedback: >
              Then every stretch has probability $0$ and the total is $0$,
              not $1$. Some number has to come out.
          - text: >
              Nothing: take the density to be $1$, as for $U(0,1)$
            feedback: >
              Area $1$ over each unit stretch adds up to infinite total
              probability.
          - text: >
              No flat density has total area $1$ over an infinite interval
            correct: true
            feedback: >
              Height $h > 0$ gives infinite area and height $0$ gives zero.
              The normalizing height $1/(b-a)$ needs $b - a$ finite.
        feedback: >
          A uniform law exists only on a bounded interval. When an interview
          says "pick a point at random", the first move is to name the
          interval; after that every answer is a length divided by the
          interval's length.

  - node: quant-probability.continuous.uniform-sum
    hook: >
      Deriving the sum-of-two-uniforms density by computing an area in the
      unit square, rather than convolving densities, is the reusable trick —
      the same picture answers "$\Pr(U_1+\dots+U_n\le 1)=1/n!$" instantly.
    explanation: >
      $S=U_1+U_2$ with both draws in $(0,1)$: rather than convolving
      densities, picture $(U_1,U_2)$ as a uniform point in the unit square.
      The event $\{S\le t\}$ for $t\le 1$ is a corner right triangle with
      both legs $t$, so its area — and hence its probability, since area
      equals probability on a uniform square — is $t^{2}/2$. Differentiating
      gives the density $f(t)=t$ on that range.

      Past $t=1$, don't re-derive: the square is symmetric under
      $(u_1,u_2)\mapsto(1-u_1,1-u_2)$, which sends $S\mapsto 2-S$, so the
      density mirrors to $f(s)=2-s$ on $[1,2]$ — a triangle peaking at $1$.

      The same area idea scales: $\Pr(U_1+\dots+U_n\le 1)$ is the volume of
      the simplex cut off by that hyperplane inside the unit cube, which is
      exactly $1/n!$ — so the expected number of uniforms you must add
      before the running total passes $1$ is $\sum_{n\ge 0}1/n!=e$.
    worked: >
      Using $\Pr(S\le 1/2)=1/8$ from the corner-triangle formula and the
      reflection $s\mapsto 2-s$, $\Pr(S\ge 3/2)=\Pr(S\le 1/2)=1/8$ too, so
      $\Pr(1/2\le S\le 3/2)=1-1/8-1/8=3/4$ — three quarters of the mass sits
      in the middle third of the triangle's support.
    interview: >
      "What's the distribution of the sum of two uniforms" tests whether you
      reach for the area-in-the-square argument instead of grinding a
      convolution integral; naming the triangle shape and its peak at $1$ is
      the fast, correct answer.
    pitfalls: >
      Using the formula $t^{2}/2$ past $t=1$ forgets the density is
      piecewise — the triangle folds back down after its peak. Reporting
      the mode ($1$) as if it were also the mean confuses the peak of a
      triangle with its balance point, though here they coincide by symmetry.
    recap: >
      Two uniforms convolve into a triangle density found by measuring
      corner areas in the unit square, the same picture that gives
      $\Pr(\text{sum of }n\le 1)=1/n!$.
    dialogue:
      - part: Two relays in a row
        teach: >
          A message passes through two relays. Each adds a delay uniform on
          $(0,1)$ milliseconds, independently of the other. The total delay
          $S = U_1 + U_2$ can be anything from $0$ to $2$ milliseconds.
      - ask: >
          Before computing anything: is $S$ uniform on $(0,2)$?
        choices:
          - text: >
              Yes: each delay is uniform, so their sum is too
            feedback: >
              Two fair dice say otherwise. Each die is uniform on $1$ to $6$,
              but a total of $7$ comes up six ways and a total of $2$ only one
              way. Sums pile up in the middle.
          - text: >
              No: totals near $1$ are commoner than totals near $0$ or $2$
            correct: true
            feedback: >
              Right. A total near $0$ needs both delays tiny; a total near $1$
              can be built from many splits — small plus large, large plus
              small, half and half.
          - text: >
              No: totals near $0$ and $2$ are commoner, since that is where
              the delays are extreme
            feedback: >
              Extremes are the hard case: a total near $2$ needs both delays
              near $1$ at once, which is rarer than either one being near $1$.
        feedback: >
          So the sum is not flat, and the length-ratio rule for one uniform
          does not apply to it directly. Something has to replace "length".
      - reflect: >
          For one uniform, probability was length. You now have two
          independent uniforms. What plays the role of length for the pair
          $(U_1, U_2)$, and which region is the event $\{S \le 0.4\}$?
        hint: >
          Plot the pair as a point.
        answer: >
          The pair is a point spread evenly over the unit square, so
          probability is area. The event $\{S \le 0.4\}$ is the part of the
          square below the line $u_1 + u_2 = 0.4$: a right triangle in the
          corner at the origin, with both legs $0.4$.
      - ask: >
          What is $\Pr(S \le 0.4)$?
        expects: "0.08"
        hint: >
          The area of the corner triangle.
        feedback: >
          The triangle has legs $0.4$, so area $0.4^{2}/2 = 0.08$. A flat law
          on $(0,2)$ would have said $0.4/2 = 0.2$, more than twice too much.
      - ask: >
          The same triangle gives $\Pr(S \le t) = t^{2}/2$ for every $t$ in
          $[0,1]$. What is the density of $S$ at $t = 0.4$?
        expects: "0.4"
        hint: >
          A density is the derivative of the CDF.
        feedback: >
          $\frac{d}{dt}(t^{2}/2) = t$, which is $0.4$ at $t = 0.4$. On the
          first half of its range the density climbs as a straight line,
          $f(t) = t$.

      - part: Past the peak
        ask: >
          Plugging $t = 1.5$ into $t^{2}/2$ gives $1.125$. What went wrong?
        choices:
          - text: >
              Nothing: probabilities of sums may exceed $1$
            feedback: >
              No probability exceeds $1$, sum or not. The number is a sign that
              the formula has been pushed outside the range where it was
              derived.
          - text: >
              Past $t = 1$ the line cuts the square differently, so the region
              is no longer a corner triangle
            correct: true
            feedback: >
              Right. For $t > 1$ the line $u_1 + u_2 = t$ crosses the top and
              right edges, and the region below it is the whole square minus a
              triangle in the opposite corner.
          - text: >
              The formula should be $t/2$ once $t > 1$
            feedback: >
              $t/2$ is the flat law on $(0,2)$ again, which the corner
              triangle already ruled out. The region past $1$ is a square
              with a corner removed.
        feedback: >
          The derivation was for $t \le 1$ only. Past the peak, measure the
          triangle that is missing instead.
      - ask: >
          What is $\Pr(S \le 1.7)$?
        expects: "0.955"
        hint: >
          The part of the square above the line $u_1 + u_2 = 1.7$ is a
          triangle in the corner at $(1,1)$. How long are its legs?
        feedback: >
          The missing corner has legs $2 - 1.7 = 0.3$, so area
          $0.3^{2}/2 = 0.045$, and $\Pr(S \le 1.7) = 1 - 0.045 = 0.955$.
      - teach: >
          So the density of $S$ is a triangle: $f(s) = s$ on $[0,1]$ and
          $f(s) = 2 - s$ on $[1,2]$, peaking at $1$. The two halves mirror
          each other because flipping the square,
          $(u_1, u_2) \mapsto (1 - u_1, 1 - u_2)$, sends $S$ to $2 - S$, so
          the tail above $2 - t$ always equals the tail below $t$.
      - ask: >
          Each delay has variance $1/12$. What is $\operatorname{Var}(S)$?
        expects: "1/6"
        hint: >
          The delays are independent.
        feedback: >
          Variances of independent terms add: $1/12 + 1/12 = 1/6$. The mean
          is $1/2 + 1/2 = 1$, the peak of the triangle. No convolution is
          needed for either.

      - part: Three relays, and a famous constant
        ask: >
          Add a third relay. What is $\Pr(U_1 + U_2 + U_3 \le 1)$?
        expects: "1/6"
        hint: >
          The region is a corner of the unit cube cut off by a slanted plane:
          a pyramid with a right-triangle base. A pyramid's volume is a third
          of base times height.
        feedback: >
          The base is the triangle $\{u_1 + u_2 \le 1\}$ of area $1/2$, the
          height is $1$, so the volume is $(1/3)(1/2)(1) = 1/6$.
      - ask: >
          The pattern so far is $1$, $1/2$, $1/6$ for one, two and three
          uniforms. What is $\Pr(U_1 + U_2 + U_3 + U_4 \le 1)$?
        expects: "1/24"
        hint: >
          Look at the denominators.
        feedback: >
          $1/4! = 1/24$. In general $\Pr(U_1 + \dots + U_n \le 1) = 1/n!$,
          the volume of the corner simplex of the unit cube.
      - ask: >
          Keep adding uniforms until the running total first exceeds $1$,
          and call the number used $N$. You need more than $n$ of them exactly
          when the first $n$ sum to at most $1$. Which is $\mathbb{E}[N]$?
        choices:
          - text: >
              $2$, since each uniform averages $1/2$
            feedback: >
              Two average-sized draws only reach $1$ on average; half the time
              they fall short and a third is needed. Plugging in averages
              ignores the overshoot.
          - text: >
              $e \approx 2.718$
            correct: true
            feedback: >
              By the tail-sum formula, $\mathbb{E}[N] = \sum_{n \ge 0}
              \Pr(N > n) = \sum_{n \ge 0} 1/n! = e$.
          - text: >
              $3$, since three relays always suffice
            feedback: >
              Three can fall short: $\Pr(U_1 + U_2 + U_3 \le 1) = 1/6$, so a
              fourth is needed one time in six.
        feedback: >
          The events $\{N > n\}$ are exactly the simplex events, so their
          probabilities $1/n!$ add up to $e$. Said aloud in an interview: the
          sum of two uniforms is a triangle on $(0,2)$ peaking at $1$, found
          by measuring areas in the unit square.

  - node: quant-probability.continuous.beta
    hook: >
      "What's the distribution of the median of $n$ uniform draws" looks
      like it needs fresh calculus every time — it doesn't, because the
      answer is always some Beta$(a,b)$ read off by matching exponents.
    explanation: >
      $\operatorname{Beta}(a,b)$ is the flexible law on $(0,1)$ with density
      $x^{a-1}(1-x)^{b-1}/B(a,b)$; at integer arguments the normalizer is a
      factorial ratio, $B(a,b)=(a-1)!(b-1)!/(a+b-1)!$, the same
      combinatorial shape that shows up as a continuous binomial
      coefficient. A sanity check worth keeping: $\operatorname{Beta}(1,1)$
      has density $1$ on $(0,1)$, exactly $U(0,1)$, and its mean formula
      $a/(a+b)=1/2$ agrees.

      The interview signature is order statistics. The $k$-th smallest of
      $n$ iid uniforms has density $\frac{n!}{(k-1)!(n-k)!}
      x^{k-1}(1-x)^{n-k}$ — and that exponent pattern $x^{k-1}(1-x)^{n-k}$ is
      exactly the Beta shape with $a=k$, $b=n-k+1$. No separate derivation
      is needed: pattern-match the exponents and read off
      $\operatorname{Beta}(k,n-k+1)$, whose mean is immediately $k/(n+1)$.

      That single fact answers a whole family of questions at once — the
      median of three uniforms is $\operatorname{Beta}(2,2)$, mean $1/2$;
      the maximum of $n$ uniforms is $\operatorname{Beta}(n,1)$, mean
      $n/(n+1)$ — all without touching an order-statistic density directly.
    worked: >
      The second smallest of $5$ iid uniform draws is
      $\operatorname{Beta}(2,4)$: mean $2/6=1/3\approx 0.333$, and variance
      $ab/((a+b)^{2}(a+b+1))=(2\cdot 4)/(36\cdot 7)=8/252=2/63\approx0.0317$.
    interview: >
      "What's the mean of the $k$-th of $n$ uniform draws" should be
      answered with $k/(n+1)$ immediately via
      $\operatorname{Beta}(k,n-k+1)$; the framing also appears as "the
      conjugate prior for a coin's bias."
    pitfalls: >
      Swapping the parameters — writing $\operatorname{Beta}(n-k+1,k)$
      instead of $\operatorname{Beta}(k,n-k+1)$ — flips which tail carries
      more mass. Skipping the $\operatorname{Beta}(1,1)=U(0,1)$ check means
      missing an easy way to catch a sign or index error.
    recap: >
      The $k$-th smallest of $n$ uniform draws is exactly
      $\operatorname{Beta}(k,n-k+1)$ with mean $k/(n+1)$, found by matching
      exponents against the general Beta density.
    dialogue:
      - part: A second-price auction
        teach: >
          Six bidders submit sealed bids, each independently uniform on
          $(0,1)$. The highest bidder wins but pays the second-highest bid.
          Call that price $P$; it is the $5$th smallest of the $6$ bids.
      - ask: >
          By the order-statistic density, the density of $P$ is a constant
          times which function on $(0,1)$?
        choices:
          - text: >
              $x^{5}(1-x)$
            feedback: >
              That puts five bids below $x$, but only four lie below the
              $5$th smallest: one bid sits at $x$ itself, and the exponent
              counts the others.
          - text: >
              $x^{4}(1-x)$
            correct: true
            feedback: >
              Right: four bids below $x$, one at $x$, one above. Each below
              contributes a factor $x$ and the one above a factor $1 - x$.
          - text: >
              $x(1-x)^{4}$
            feedback: >
              That is the $2$nd smallest — one below, four above. The price
              is the second *highest*, so four bids sit below it.
        feedback: >
          The $k$-th smallest of $n$ uniforms has density proportional to
          $x^{k-1}(1-x)^{n-k}$. Here $k = 5$, $n = 6$.
      - ask: >
          The constant in front is $n!/((k-1)!\,(n-k)!)$. What is it for the
          auction price?
        expects: "30"
        hint: >
          $n = 6$, $k = 5$.
        feedback: >
          $6!/(4!\,1!) = 720/24 = 30$: six ways to choose the bid that sits
          at $x$, then five ways to choose which of the rest sits above it,
          $6 \times 5 = 30$.
      - ask: >
          What is the expected price, $\mathbb{E}[P] = \int_0^1 x \cdot
          30x^{4}(1-x)\,dx$?
        expects: "5/7"
        hint: >
          Expand to $30(x^{5} - x^{6})$ and integrate term by term.
        feedback: >
          $30(1/6 - 1/7) = 30/42 = 5/7 \approx 0.714$. The seller collects
          noticeably less than the top bid but well above a typical bid of
          $1/2$.
      - reflect: >
          You integrated $x^{a-1}(1-x)^{b-1}$ over $(0,1)$ twice: once
          hidden in the constant $30$, once for the mean. Every order
          statistic of uniforms produces the same shape with different
          exponents. What would you want to know once and for all, so you
          never integrate one of these again?
        hint: >
          Recall the Beta function.
        answer: >
          The value of $\int_0^1 x^{a-1}(1-x)^{b-1}\,dx$ as a function of $a$
          and $b$ — the Beta function $B(a,b)$, equal to
          $(a-1)!\,(b-1)!/(a+b-1)!$ at integers. Dividing by it makes the
          shape a density, and the mean is a ratio of two of its values,
          $B(a+1,b)/B(a,b) = a/(a+b)$. One family covers every order
          statistic of uniforms.

      - part: One family for all of them
        teach: >
          That family is the Beta law: for $a, b > 0$,
          $X \sim \operatorname{Beta}(a,b)$ has density
          $x^{a-1}(1-x)^{b-1}/B(a,b)$ on $(0,1)$, mean $a/(a+b)$, and
          variance $ab/((a+b)^{2}(a+b+1))$. Matching exponents, the $k$-th
          smallest of $n$ uniforms is $\operatorname{Beta}(k, n-k+1)$ with
          mean $k/(n+1)$. The auction price is $\operatorname{Beta}(5,2)$.
      - ask: >
          Check the constant: what is $B(5,2)$?
        expects: "1/30"
        hint: >
          $(a-1)!\,(b-1)!/(a+b-1)!$ with $a = 5$, $b = 2$.
        feedback: >
          $4!\,1!/6! = 24/720 = 1/30$, so the density is
          $x^{4}(1-x)/B(5,2) = 30x^{4}(1-x)$ — the same $30$ you counted.
      - ask: >
          Which Beta is the winning bid, the largest of the six?
        choices:
          - text: >
              $\operatorname{Beta}(1,6)$
            feedback: >
              That is the smallest bid: $k = 1$ gives $a = 1$, $b = 6$. Its
              density $6(1-x)^{5}$ piles up near $0$.
          - text: >
              $\operatorname{Beta}(6,0)$
            feedback: >
              The parameters must be positive. With $k = n = 6$, the second
              parameter is $n - k + 1 = 1$, not $0$.
          - text: >
              $\operatorname{Beta}(6,1)$
            correct: true
            feedback: >
              Right: density $6x^{5}$, the CDF $x^{6}$ of the maximum
              differentiated, with mean $6/7$.
        feedback: >
          The maximum of $n$ uniforms is $\operatorname{Beta}(n,1)$ and the
          minimum is $\operatorname{Beta}(1,n)$.
      - ask: >
          On average, how much does the winner save by paying the second
          bid instead of their own?
        expects: "1/7"
        hint: >
          Subtract the two means.
        feedback: >
          $6/7 - 5/7 = 1/7$. Linearity lets you subtract means even though
          the two order statistics are dependent. The $k/(n+1)$ means space
          the six bids evenly at $1/7, 2/7, \dots, 6/7$.

      - part: A shape that fails one clause
        ask: >
          Which of these is *not* a Beta density on $(0,1)$?
        choices:
          - text: >
              $x^{-1/2}/2$
            feedback: >
              This one is $\operatorname{Beta}(1/2, 1)$: $\int_0^1
              x^{-1/2}\,dx = 2$, so the area is $1$. A density may be
              unbounded near $0$ as long as the area stays finite.
          - text: >
              $12x(1-x)^{2}$
            feedback: >
              This is $\operatorname{Beta}(2,3)$: $B(2,3) = 1!\,2!/4! = 1/12$,
              so the constant $12$ is exactly right.
          - text: >
              $6x^{2}(1-x)$
            correct: true
            feedback: >
              The shape is $\operatorname{Beta}(3,2)$, but $B(3,2) = 2!\,1!/4!
              = 1/12$, so the density needs $12$ in front. With $6$ the area is
              $1/2$ — the right shape, the wrong constant.
          - text: >
              $1$
            feedback: >
              This is $\operatorname{Beta}(1,1)$, which is exactly $U(0,1)$
              — a quick check that any Beta formula you recall reduces
              correctly.
        feedback: >
          A Beta density is a shape $x^{a-1}(1-x)^{b-1}$ and a constant
          $1/B(a,b)$, and the constant is not optional. In an interview,
          "the $k$-th of $n$ uniforms" is answered with
          $\operatorname{Beta}(k, n-k+1)$ and mean $k/(n+1)$ in one breath.

  - node: quant-probability.continuous.uniform-spacings
    hook: >
      "What's the expected size of the biggest gap between $n$ random
      points" is a size-bias trap — the naive answer $1/(n+1)$ is wrong, and
      knowing why separates genuine understanding from pattern matching.
    explanation: >
      Drop $n$ uniform points on $(0,1)$; they cut it into $n+1$ spacings
      that sum to exactly $1$ and are exchangeable — no position is
      structurally distinguished — so every spacing shares the same mean
      $1/(n+1)$. The first spacing is literally the minimum of the $n$
      points, which by the order-statistics match is
      $\operatorname{Beta}(1,n)$ with density $n(1-x)^{n-1}$; exchangeability
      then hands that same marginal law to every other spacing too, even
      though the spacings are far from independent.

      Summing spacings recovers $\mathbb{E}[X_{(k)}]=k/(n+1)$, consistent
      with the Beta mean already known for order statistics.

      The largest gap is where intuition breaks: it is not just "one of the
      $n+1$ exchangeable pieces," because *which* spacing gets picked is
      itself biased toward the larger ones. Its mean works out to
      $H_{n+1}/(n+1)$, strictly above the naive guess $1/(n+1)$, since the
      harmonic number $H_{n+1}$ exceeds $1$.
    worked: >
      With $n=2$ points, there are $3$ spacings of mean $1/3$ each. The
      largest gap has mean $H_3/3=(1+1/2+1/3)/3=(11/6)/3=11/18\approx0.611$
      — nearly double the naive guess of $1/3\approx0.333$.
    interview: >
      "Drop $n$ points on a segment — how big is the largest gap, on
      average" is answered with $H_{n+1}/(n+1)$, and the interviewer is
      listening for the size-bias reasoning, not just the memorized formula.
    pitfalls: >
      Assuming the maximum spacing shares the ordinary spacing mean
      $1/(n+1)$ ignores that selecting the largest is a biased choice.
      Treating the spacings as independent (rather than merely exchangeable
      and summing to $1$) leads to wrong higher-moment computations.
    recap: >
      $n$ uniform points cut $(0,1)$ into $n+1$ exchangeable
      $\operatorname{Beta}(1,n)$ gaps averaging $1/(n+1)$ each, but the
      largest one runs bigger, averaging $H_{n+1}/(n+1)$.
    dialogue:
      - part: Four trucks in an hour
        teach: >
          Four delivery trucks each arrive at an independent, uniformly
          random moment in a $60$-minute window. Their arrivals cut the hour
          into five gaps: from the start to the first truck, three gaps
          between consecutive trucks, and from the last truck to the end.
      - ask: >
          What is the expected length, in minutes, of the first gap — the
          wait from the start of the hour to the first truck?
        expects: "12"
        hint: >
          The first truck is the smallest of four uniforms, a Beta law. Find
          its mean on $(0,1)$ and scale to the hour.
        feedback: >
          The minimum of four uniforms on $(0,1)$ is
          $\operatorname{Beta}(1,4)$ with mean $1/5$, so the first gap
          averages $60/5 = 12$ minutes.
      - ask: >
          Using the means of the order statistics, what is the expected gap
          between the second and third trucks, in minutes?
        expects: "12"
        hint: >
          The $k$-th of $n$ uniforms has mean $k/(n+1)$.
        feedback: >
          $60(3/5) - 60(2/5) = 36 - 24 = 12$ minutes. A middle gap averages
          exactly what the edge gap does, which is not obvious: one might
          expect gaps squeezed between two trucks to run shorter.
      - reflect: >
          Every gap you have computed averages $12$ minutes, and the five
          gaps must add up to $60$. Find a reason that every gap has the same
          law, without computing any Beta means.
        hint: >
          Bend the hour into a circle.
        answer: >
          Join the two ends of the hour into a circle and throw a fifth,
          independent uniform point on it; cutting the circle there gives
          back the hour with four uniform points. On the circle all five
          points are interchangeable, so no gap is special: the five gaps
          are exchangeable, each with the same law, and since they sum to
          $60$ each averages $60/5 = 12$.
      - teach: >
          In general, $n$ independent uniform points on $(0,1)$ cut it into
          $n+1$ spacings that are exchangeable and sum to $1$. So each has
          mean $1/(n+1)$, and each has the law of the first spacing, the
          minimum, which is $\operatorname{Beta}(1,n)$ with density
          $n(1-x)^{n-1}$. Summing the first $k$ spacings puts the $k$-th point
          at $k/(n+1)$ on average. The spacings are not independent — they
          are tied by their sum.

      - part: One gap's whole law
        ask: >
          What is the probability the first gap exceeds $30$ minutes?
        expects: "1/16"
        hint: >
          The first gap exceeds $30$ minutes exactly when every truck comes
          in the second half hour.
        feedback: >
          Each truck independently lands after minute $30$ with probability
          $1/2$, so $(1/2)^{4} = 1/16$. Equivalently,
          $\Pr(\operatorname{Beta}(1,4) > 1/2) = (1 - 1/2)^{4}$.
      - ask: >
          At the other extreme, what is the probability the first gap is
          shorter than $6$ minutes?
        expects: "0.3439"
        tolerance: 0.0005
        hint: >
          Work with the complement: no truck in the first $6$ minutes.
        feedback: >
          No truck arrives in the first $6$ minutes with probability
          $(54/60)^{4} = 0.9^{4} = 0.6561$, so the gap is that short with
          probability $1 - 0.6561 = 0.3439$. The density $4(1-x)^{3}$ is
          tallest at $0$: short gaps are the commonest single size.
      - ask: >
          What is the probability that the gap between the second and third
          trucks exceeds $30$ minutes?
        choices:
          - text: >
              Less than $1/16$: an inner gap is hemmed in on both sides
            feedback: >
              That is the intuition exchangeability overrules. On the circle
              picture, the inner gap is no different from the edge gap.
          - text: >
              Exactly $1/16$
            correct: true
            feedback: >
              Right. Exchangeable spacings share one law, so any statement
              about one gap holds for every gap.
          - text: >
              It cannot be found without the joint density of the second and
              third trucks
            feedback: >
              You could grind it out that way, but exchangeability hands it
              over: the inner gap has the law of the first gap.
        feedback: >
          Every one of the five gaps exceeds $30$ minutes with probability
          $1/16$. Any spacing question can be moved to the end gap, where it
          is a statement about the minimum.

      - part: The longest gap is not a typical gap
        ask: >
          Now the longest of the five gaps. Roughly how long is it on
          average?
        choices:
          - text: >
              $12$ minutes, since it is one of five gaps of mean $12$
            feedback: >
              Picking the longest is not picking one at random. The longest
              is at least as long as every other gap, so it must average more
              than the average gap.
          - text: >
              About $48$ minutes
            feedback: >
              $48 = 60 \times 4/5$ is the average arrival time of the *last*
              truck, a point in the hour, not a gap length.
          - text: >
              About $27$ minutes
            correct: true
            feedback: >
              The exact value is $60 \times H_5/5 = 60 \times (137/60)/5 =
              27.4$ minutes, more than twice the typical gap.
        feedback: >
          Choosing the largest is a biased selection: whichever gap happens
          to be long is the one you pick, so its mean sits above $1/(n+1)$.
      - ask: >
          Check the bias in the smallest case. One truck arrives uniformly in
          the hour, cutting it into two gaps. What is the expected length of
          the longer gap, in minutes?
        expects: "45"
        hint: >
          With the truck at minute $X$, the longer gap is $\max(X, 60 - X)$,
          which is uniform on an interval.
        feedback: >
          $\max(X, 60 - X)$ is uniform on $(30, 60)$, so it averages $45$
          minutes, against $30$ for a typical gap. In units of the hour that
          is $3/4 = (1 + 1/2)/2 = H_2/2$.
      - teach: >
          The general answer is $\mathbb{E}[\text{longest spacing}] =
          H_{n+1}/(n+1)$, with $H_m = 1 + 1/2 + \dots + 1/m$ the harmonic
          number; it exceeds the typical $1/(n+1)$ by the factor $H_{n+1}$,
          which grows like $\ln n$. Said aloud: the spacings are exchangeable,
          so each one averages $1/(n+1)$ — but the largest one is a selected
          gap, and selection costs a factor of $H_{n+1}$.

  - node: quant-probability.continuous.exponential
    hook: >
      Every "how long until the next arrival" question is fitting an
      exponential whether or not the interviewer says so, and the fact that
      its mean equals its standard deviation is the fingerprint worth
      recognizing on sight.
    explanation: >
      Think of $\lambda$ as arrivals per unit time: in a tiny window $dt$,
      the chance of an arrival is about $\lambda\,dt$, independent of how
      long you've already waited. Chaining that constant hazard over many
      small windows gives the survival probability
      $\Pr(X>x)=(1-\lambda\,dt)^{x/dt}\to e^{-\lambda x}$ — the continuous
      limit of a geometric waiting time, which is exactly why $X\sim
      \operatorname{Exp}(\lambda)$ has density $f(x)=\lambda e^{-\lambda x}$
      and CDF $1-e^{-\lambda x}$.

      Integrating $x f(x)$ by parts gives $\mathbb{E}[X]=1/\lambda$, and a
      second integration by parts gives $\mathbb{E}[X^{2}]=2/\lambda^{2}$,
      so $\operatorname{Var}(X)=2/\lambda^{2}-1/\lambda^{2}=1/\lambda^{2}$ —
      mean and standard deviation are both exactly $1/\lambda$, a signature
      no other common continuous law shares.

      The median, $\ln 2/\lambda$, sits well below the mean because the law
      is right-skewed: most of the probability mass sits near $0$, with a
      long thin tail carrying the rest. Rescaling stays in the family,
      $cX\sim\operatorname{Exp}(\lambda/c)$ for $c>0$.
    worked: >
      Calls arrive at a help desk at rate $\lambda=5$ per hour. The mean
      wait for the next call is $1/5$ hour $=12$ minutes. The probability
      the wait exceeds $20$ minutes ($1/3$ hour) is
      $e^{-5/3}\approx0.1889$, and the median wait is $\ln2/5\approx0.1386$
      hour $\approx8.3$ minutes, well under the $12$-minute mean.
    interview: >
      "How long until the next trade / arrival / failure" triggers $1/\lambda$
      immediately; a sharp candidate volunteers that mean equals standard
      deviation here, a fact worth stating unprompted as a check.
    pitfalls: >
      Mixing up the CDF $1-e^{-\lambda x}$ with the survival function
      $e^{-\lambda x}$ under time pressure is the classic sign error.
      Plugging $\lambda$ directly in as if it were the mean, instead of
      $1/\lambda$, is the other common slip.
    recap: >
      $\operatorname{Exp}(\lambda)$ has density $\lambda e^{-\lambda x}$,
      survival $e^{-\lambda x}$, and mean and standard deviation both
      $1/\lambda$ — the continuous waiting-time law.
    dialogue:
      - part: Orders with no rhythm
        teach: >
          Large orders reach a dark pool at an average of $6$ per hour, with
          no rhythm at all. Chop time into $1$-minute slices: each slice
          independently contains an order with probability $0.1$, whatever
          happened in earlier slices.
      - ask: >
          In this sliced model, what is the probability that no order arrives
          in the next $10$ minutes?
        expects: "0.3487"
        tolerance: 0.0005
        hint: >
          Ten independent slices, each empty with probability $0.9$.
        feedback: >
          $0.9^{10} \approx 0.3487$. The answer depends on the slicing,
          though: with $1$-second slices, each holding an order with
          probability $1/600$, it becomes $(1 - 1/600)^{600} \approx
          0.3676$.
      - ask: >
          Keep the rate fixed at $6$ per hour and make the slices ever
          thinner: $n$ slices in the $10$ minutes, each holding an order with
          probability $1/n$. What does $(1 - 1/n)^{n}$ approach?
        choices:
          - text: >
              $0$, because there are infinitely many slices to fill
            feedback: >
              More slices, but each is proportionally less likely to hold an
              order. The expected count in $10$ minutes stays exactly $1$.
          - text: >
              $e^{-1} \approx 0.3679$
            correct: true
            feedback: >
              Right: $(1 - x/n)^{n} \to e^{-x}$, here with $x = 1$, the
              expected number of orders in the stretch.
          - text: >
              $0.9^{10}$, since slicing finer changes nothing
            feedback: >
              It changed from $0.3487$ to $0.3676$ when you went from minutes
              to seconds. The coarse model allows at most one order per
              minute, and thinner slices remove that artificial cap.
        feedback: >
          The limit no longer depends on the slicing: the chance of an empty
          stretch is $e^{-(\text{expected count})}$.
      - reflect: >
          Let $X$ be the waiting time, in hours, until the next order, with
          rate $\lambda$ orders per hour. Write $\Pr(X > t)$ for any $t$, and
          say how you would get the density of $X$ from it.
        hint: >
          The expected count in $t$ hours is $\lambda t$.
        answer: >
          The wait exceeds $t$ exactly when the stretch $(0, t]$ is empty, so
          $\Pr(X > t) = e^{-\lambda t}$. The CDF is $1 - e^{-\lambda t}$, and
          differentiating it gives the density $\lambda e^{-\lambda t}$ for
          $t \ge 0$. Everything about the wait is in that one survival curve.
      - teach: >
          That is the exponential law. For a rate $\lambda > 0$,
          $X \sim \operatorname{Exp}(\lambda)$ has density
          $\lambda e^{-\lambda x}$ on $x \ge 0$, CDF $1 - e^{-\lambda x}$, and
          survival function $\Pr(X > x) = e^{-\lambda x}$. Read $\lambda$ as
          arrivals per unit time. The dark-pool wait is
          $\operatorname{Exp}(6)$ in hours, or rate $0.1$ per minute.

      - part: How long, on average
        ask: >
          Using the tail-sum formula $\mathbb{E}[X] = \int_0^\infty
          \Pr(X > t)\,dt$, what is the expected wait for the next order, in
          minutes?
        expects: "10"
        hint: >
          Integrate $e^{-0.1t}$ from $0$ to $\infty$.
        feedback: >
          $\int_0^\infty e^{-0.1t}\,dt = 1/0.1 = 10$ minutes. In general
          $\mathbb{E}[X] = 1/\lambda$: six orders an hour means one every ten
          minutes on average.
      - ask: >
          A second integration gives $\mathbb{E}[X^{2}] = 2/\lambda^{2} =
          200$ square minutes. What is the standard deviation of the wait, in
          minutes?
        expects: "10"
        hint: >
          Variance is the second moment minus the squared mean.
        feedback: >
          $\operatorname{Var}(X) = 200 - 10^{2} = 100$, so the standard
          deviation is $10$ minutes — equal to the mean. That equality is the
          exponential's fingerprint.
      - ask: >
          What is the median wait, in minutes?
        expects: "6.93"
        tolerance: 0.01
        hint: >
          Solve $e^{-0.1t} = 1/2$.
        feedback: >
          $t = 10\ln 2 \approx 6.93$ minutes, well below the $10$-minute mean.
          Most waits are short; a thin tail of long ones drags the mean up.
      - ask: >
          What is the probability the wait exceeds $20$ minutes?
        choices:
          - text: >
              $1 - e^{-2} \approx 0.865$
            feedback: >
              That is the CDF, the chance the wait is *at most* $20$ minutes.
              The tail is the survival function, $e^{-\lambda t}$ itself.
          - text: >
              $e^{-120}$, essentially $0$
            feedback: >
              That mixes units: rate $6$ is per hour, and $20$ is minutes.
              Either use $6 \times (1/3) = 2$ or $0.1 \times 20 = 2$.
          - text: >
              $e^{-2} \approx 0.135$
            correct: true
            feedback: >
              Right: $\lambda t = 0.1 \times 20 = 2$ expected orders in the
              stretch, so the chance it is empty is $e^{-2}$.
          - text: >
              $0.1e^{-2} \approx 0.0135$
            feedback: >
              That is the density at $20$ minutes, a rate per minute, not a
              probability of a tail.
        feedback: >
          Tail questions are answered by the survival function directly, with
          $\lambda$ and $t$ in the same units.

      - part: What does not fit
        ask: >
          Which of these waits is plainly *not* exponential?
        choices:
          - text: >
              The time until the next customer walks into a busy shop
            feedback: >
              Many independent customers, none coordinating: arrivals with no
              rhythm, which is the exponential's home.
          - text: >
              The wait for a train that leaves every $15$ minutes, when you
              turn up at a random moment
            correct: true
            feedback: >
              That wait is $U(0,15)$: it can never exceed $15$, its mean is
              $7.5$, and its standard deviation is $15/\sqrt{12} \approx
              4.33$, nowhere near the mean. The schedule is a rhythm.
          - text: >
              The time until the next click of a Geiger counter
            feedback: >
              Each atom decays independently of the others and of its past —
              the textbook exponential.
        feedback: >
          Exponential waits come from events with no schedule and no memory.
          A quick test: if the standard deviation is far from the mean, it is
          not exponential.
      - ask: >
          The dark-pool wait is $\operatorname{Exp}(6)$ in hours. Measured in
          minutes it is $60$ times larger. What is its rate per minute?
        expects: "0.1"
        hint: >
          Stretching time by $c$ divides the rate by $c$.
        feedback: >
          $cX \sim \operatorname{Exp}(\lambda/c)$, so the rate is
          $6/60 = 0.1$ per minute — the same law in new units. In an
          interview, "rate $6$ an hour" should come out as "a ten-minute mean
          wait, ten-minute standard deviation, median about seven" without a
          pause.

  - node: quant-probability.continuous.memoryless-exponential
    hook: >
      "This bulb has burned for $3$ hours — how much longer will it last"
      is the single most common trap in probability interviews, and
      memorylessness is exactly what forces the answer to stay $1/\lambda$.
    explanation: >
      Condition directly: $\Pr(X>s+t\mid X>s)
      =\Pr(X>s+t)/\Pr(X>s)=e^{-\lambda(s+t)}/e^{-\lambda s}=e^{-\lambda t}$.
      The $s$ cancels because exponential decay is multiplicative —
      $e^{-\lambda(s+t)}=e^{-\lambda s}e^{-\lambda t}$ — so conditioning on
      survival to $s$ rescales the whole future by exactly the same factor
      that got you there. The remaining life given survival to $s$ has
      literally the same law as a fresh draw, so
      $\mathbb{E}[X\mid X>s]=s+1/\lambda$.

      This isn't a coincidence of the exponential's particular shape — it's
      forced. The survival function must satisfy the functional equation
      $G(s+t)=G(s)G(t)$, and the only right-continuous solutions are
      $G(t)=e^{-\lambda t}$, so the exponential is the unique continuous law
      on $[0,\infty)$ with this property.

      Read backward, the "head start" a partially-used item appears to have
      is worth nothing under this law — a used exponential component is
      exactly as good as new, never better or worse.
    worked: >
      A lightbulb's lifetime is $\operatorname{Exp}(\lambda)$ with mean
      $2000$ hours ($\lambda=1/2000$). Given it has already burned for $500$
      hours, its expected remaining life is still $1/\lambda=2000$ hours,
      not $1500$. The probability it lasts at least $1000$ more hours given
      that survival is $e^{-1000/2000}=e^{-0.5}\approx0.6065$.
    interview: >
      "Bulb burning $3$ hours — how much longer" is answered with $1/\lambda$
      regardless of the $3$ hours; the interviewer wants the functional
      equation reasoning stated, not just the memorized conclusion.
    pitfalls: >
      Adding the elapsed time to the answer, reasoning the item is "used up"
      and has less time left, is backwards for the exponential — that
      intuition is correct only for wearing-out laws with rising hazard.
      The property is unique to the exponential; don't apply it to a
      uniform or normal lifetime.
    recap: >
      Given survival past $s$, an exponential's remaining life is again
      $\operatorname{Exp}(\lambda)$ — the exponential is the only continuous
      law where elapsed waiting carries zero information.
    dialogue:
      - part: A server that has been up a month
        teach: >
          A server's time to its next crash, $X$ days, is exponential with
          mean $50$ days, so $\Pr(X > t) = e^{-t/50}$. It has now been up for
          $30$ days without crashing.
      - ask: >
          Given that, what is the probability it stays up at least another
          $10$ days?
        expects: "0.8187"
        tolerance: 0.0005
        hint: >
          You want $\Pr(X > 40 \mid X > 30)$. Write it as a ratio of two
          survival probabilities.
        feedback: >
          $\Pr(X > 40)/\Pr(X > 30) = e^{-40/50}/e^{-30/50} = e^{-10/50} =
          e^{-0.2} \approx 0.8187$.
      - ask: >
          Compare that with a brand-new identical server's chance of lasting
          its first $10$ days.
        choices:
          - text: >
              The new server does better: the old one has worn
            feedback: >
              The new server's chance is $e^{-10/50} = e^{-0.2}$ — the very
              number you just computed. Nothing in this law wears.
          - text: >
              The old server does better: a month up has proved it reliable
            feedback: >
              That would be true of a law whose risk falls with age. Here the
              two chances are both $e^{-0.2}$, to every decimal place.
          - text: >
              They are exactly equal
            correct: true
            feedback: >
              Right: both are $e^{-0.2}$. Thirty days of survival changed
              nothing about the next ten.
        feedback: >
          The server that has run a month and the server just switched on
          face the same future.
      - reflect: >
          The $30$ days vanished from your answer. Point to the step where
          they cancelled, and say what property of the function
          $e^{-\lambda t}$ made that happen.
        hint: >
          Write $e^{-\lambda(s+t)}$ another way.
        answer: >
          In the ratio $e^{-\lambda(s+t)}/e^{-\lambda s}$ the numerator splits
          as $e^{-\lambda s}e^{-\lambda t}$, and the $e^{-\lambda s}$ cancels.
          The survival function turns a sum of times into a product of
          survival probabilities: $G(s+t) = G(s)G(t)$. Surviving $s$ and then
          $t$ more costs the same as surviving $s$, then starting over.
      - teach: >
          That is memorylessness: for $X \sim \operatorname{Exp}(\lambda)$
          and all $s, t \ge 0$, $\Pr(X > s+t \mid X > s) = \Pr(X > t)$. A
          lifetime that has already run $s$ faces the same future as one that
          has not started.

      - part: What the elapsed time is worth
        ask: >
          Given the server has been up $30$ days, what is its expected
          *remaining* time until a crash?
        choices:
          - text: >
              $20$ days: it was expected to last $50$, and $30$ are used up
            feedback: >
              That treats the lifetime as a budget being spent. The overshoot
              is a fresh $\operatorname{Exp}(1/50)$, whose mean is the full
              $50$.
          - text: >
              $50$ days
            correct: true
            feedback: >
              Right. Given $X > 30$, the overshoot $X - 30$ is again
              $\operatorname{Exp}(1/50)$ — the same law as a new server's
              whole lifetime, so the same mean.
          - text: >
              $0$ days: it is overdue
            feedback: >
              "Overdue" assumes crashes come on a schedule. The exponential
              has none: the chance of crashing in the next hour is the same
              on day $31$ as on day $1$.
        feedback: >
          The elapsed time is worth nothing under this law — it neither uses
          up the lifetime nor certifies it.
      - ask: >
          What is $\mathbb{E}[X \mid X > 30]$, the expected total lifetime of
          a server known to have survived $30$ days?
        expects: "80"
        hint: >
          Total lifetime is the $30$ days already run plus the remaining time.
        feedback: >
          $30 + 50 = 80$ days. In general $\mathbb{E}[X \mid X > s] =
          s + 1/\lambda$. Answering $50$ forgets that the total includes the
          days already lived.

      - part: Only the exponential forgets
        ask: >
          Suppose some lifetime's survival function $G$ satisfies
          $G(s+t) = G(s)G(t)$ for all $s, t \ge 0$, and $G(1) = 0.9$. What is
          $G(3)$?
        expects: "0.729"
        hint: >
          $3 = 1 + 1 + 1$.
        feedback: >
          $G(3) = G(1)G(1)G(1) = 0.9^{3} = 0.729$. Every whole number of
          days is forced.
      - ask: >
          Same $G$. What is $G(1/2)$?
        expects: "0.9487"
        tolerance: 0.0005
        hint: >
          $G(1) = G(1/2 + 1/2)$.
        feedback: >
          $G(1/2)^{2} = G(1) = 0.9$, so $G(1/2) = \sqrt{0.9} \approx 0.9487$.
          By the same move $G(t) = 0.9^{t}$ for every rational $t$, and
          right-continuity extends it to all $t$: $G(t) = e^{-\lambda t}$
          with $\lambda = \ln(10/9)$.
      - teach: >
          So the equation $G(s+t) = G(s)G(t)$ leaves no freedom beyond the
          value of $G(1)$: its only right-continuous solutions are
          $e^{-\lambda t}$. The exponential is the *only* continuous lifetime
          on $[0,\infty)$ that forgets its past. Any other law remembers.
      - ask: >
          A component's survival function is $\Pr(X > t) = 1/(1+t)^{2}$, in
          years. Given it has survived $1$ year, what is the probability it
          survives at least $1$ more?
        expects: "4/9"
        hint: >
          $\Pr(X > 2)/\Pr(X > 1)$.
        feedback: >
          $(1/9)/(1/4) = 4/9 \approx 0.444$, while a new component lasts its
          first year with probability only $1/4$.
      - ask: >
          What does that comparison say about this component?
        choices:
          - text: >
              It is memoryless, like the exponential
            feedback: >
              Memoryless would make the two chances equal. Here $4/9$ beats
              $1/4$: the past changed the future.
          - text: >
              A used one is a better bet than a new one
            correct: true
            feedback: >
              Right. Surviving a year screens out the weak ones, so survivors
              are more reliable — the opposite of wearing out.
          - text: >
              A used one is a worse bet than a new one
            feedback: >
              That is wear, which would make the conditional chance *lower*
              than $1/4$. It is higher.
        feedback: >
          Remembering can run either way: some laws age, some improve with
          survival. Only the exponential sits exactly in between. Asked how
          much longer a bulb that has burned for $3$ hours will last, say
          $1/\lambda$, and say why: the survival function factors.

  - node: quant-probability.continuous.hazard-rate
    hook: >
      Hazard rate is how an interviewer asks "does this thing wear out or
      age like new" without using the word memoryless — reading off flat
      versus rising versus falling hazard is the entire question.
    explanation: >
      The hazard rate $h(x)=f(x)/(1-F(x))$ is a conditional density: since
      $\Pr(x<X\le x+\varepsilon)\approx f(x)\varepsilon$, dividing by
      $\Pr(X>x)$ converts that into the conditional statement
      $\Pr(x<X\le x+\varepsilon\mid X>x)\approx h(x)\varepsilon$ — the
      instantaneous failure rate given survival so far. Solving the implied
      differential equation $dS/dx=-h(x)S(x)$ recovers the survival
      function as $\Pr(X>x)=\exp(-\int_0^x h(u)\,du)$, so the hazard alone
      determines the entire law.

      Check it against what you already know: constant hazard $h\equiv
      \lambda$ integrates to $e^{-\lambda x}$ — exactly the exponential
      survival function, and exactly memorylessness restated in different
      vocabulary. Flat hazard and "no memory" are the same fact.

      Away from that flat case, the shape tells the story: rising hazard
      means genuine aging — a used item is more likely to fail soon than a
      fresh one — while falling hazard means infant mortality, where
      survival so far is good news and a used item is actually safer.
    worked: >
      Let $X$ have density $f(x)=2x$ on $(0,1)$, so $F(x)=x^{2}$. Then
      $h(x)=2x/(1-x^{2})$; at $x=0.5$, $h(0.5)=1/(1-0.25)=1/0.75
      \approx1.333$, and $h(x)\to\infty$ as $x\to1$, since failure by $x=1$
      is certain — a clear picture of rising hazard.
    interview: >
      "What does rising hazard mean in plain terms" is answered with
      "used items are more likely to fail soon" — aging — and flat hazard
      should connect back to the exponential without hesitation.
    pitfalls: >
      Confusing hazard rate with the density itself — $h(x)\ge f(x)$ always,
      since dividing by the survival probability (at most $1$) can only
      increase it. Hazard determines the whole law only through integration;
      it is not a single summary number like the mean.
    recap: >
      Hazard rate is density divided by survival — the instantaneous risk
      of failure given survival so far — and it is exactly constant when
      the law is exponential.
    dialogue:
      - part: A fleet that thins out
        teach: >
          A fleet of $1000$ delivery drones goes into service. During the
          first month $50$ of them fail. During the second month $50$ more
          fail.
      - ask: >
          Of the drones still flying at the start of the second month, what
          fraction failed during it?
        expects: "1/19"
        hint: >
          How many were still flying when the second month began?
        feedback: >
          $950$ drones started the month and $50$ failed: $50/950 = 1/19
          \approx 0.0526$, against $50/1000 = 0.05$ in the first month.
      - ask: >
          Counted against the original $1000$, failures were flat: $5\%$ of
          the fleet each month. Was the risk to a drone that was still flying
          also flat?
        choices:
          - text: >
              Yes: the same number failed each month
            feedback: >
              The same number failed out of fewer drones. A drone flying at
              the start of month two faced $1/19$, not $1/20$.
          - text: >
              No: it rose, because the same failures came out of fewer
              survivors
            correct: true
            feedback: >
              Right. Flat failures per original drone mean rising failures per
              surviving drone — the fleet is aging.
          - text: >
              No: it fell, since the weak drones had already failed
            feedback: >
              That can happen, but these numbers show the reverse: the
              per-survivor rate went up from $0.05$ to about $0.0526$.
        feedback: >
          The density counts failures against the starting population; the
          risk you face as a survivor counts them against those still alive.
      - reflect: >
          Now let a lifetime $X$ have density $f$ and CDF $F$. Build the
          instant version of what you just computed: a rate at time $x$ that
          measures "chance per unit time of failing now, given still working
          now". What do you divide by what?
        hint: >
          The chance of failing in the short stretch $(x, x+\varepsilon]$ is
          about $f(x)\varepsilon$.
        answer: >
          Divide the chance of failing in $(x, x+\varepsilon]$, about
          $f(x)\varepsilon$, by the chance of being alive at $x$, which is
          $1 - F(x)$; then divide by $\varepsilon$ to make it a rate. The
          result is $f(x)/(1 - F(x))$ — failures per unit time, counted
          against the survivors rather than the original fleet.
      - teach: >
          That is the hazard rate: $h(x) = f(x)/(1 - F(x))$, so that
          $\Pr(x < X \le x + \varepsilon \mid X > x) \approx h(x)\,\varepsilon$
          for small $\varepsilon$. Rising hazard means aging; falling hazard
          means survivors get safer, as with infant mortality.

      - part: Reading the shape
        ask: >
          For $X \sim \operatorname{Exp}(0.3)$, what is $h(5)$?
        expects: "0.3"
        hint: >
          Write out $f(5)$ and $1 - F(5)$; something cancels.
        feedback: >
          $h(5) = 0.3e^{-1.5}/e^{-1.5} = 0.3$, and the same cancellation
          happens at every $x$: the exponential's hazard is the constant
          $\lambda$. Flat hazard is memorylessness said another way.
      - ask: >
          Recall the component in Memorylessness of the exponential whose
          used units beat new ones: survival $1/(1+x)^{2}$, density
          $2/(1+x)^{3}$. What is its hazard at $x = 3$?
        expects: "0.5"
        hint: >
          Divide the density by the survival function before plugging in.
        feedback: >
          $h(x) = \frac{2/(1+x)^{3}}{1/(1+x)^{2}} = 2/(1+x)$, so
          $h(3) = 2/4 = 0.5$, down from $h(0) = 2$. Falling hazard — which is
          why a component that had survived a year was a better bet than a
          new one.
      - ask: >
          Can a hazard rate exceed $1$?
        choices:
          - text: >
              No: it is a conditional probability, so it lies in $[0,1]$
            feedback: >
              $h(x)\varepsilon$ is a probability; $h(x)$ itself is a rate per
              unit time. The component above has $h(0) = 2$ per year.
          - text: >
              Yes: it is a rate, and only $h(x)\varepsilon$ for small
              $\varepsilon$ must be a probability
            correct: true
            feedback: >
              Right. $\operatorname{Exp}(5)$ has hazard $5$ per unit time
              everywhere, and nothing is wrong with that.
          - text: >
              Only for laws that are not exponential
            feedback: >
              $\operatorname{Exp}(\lambda)$ has $h \equiv \lambda$, and
              $\lambda$ can be any positive number.
        feedback: >
          Hazard is never below the density either: dividing by a survival
          probability at most $1$ can only raise $f(x)$.

      - part: From the rate back to the law
        ask: >
          A machine's hazard is $0.1$ per year for its first $2$ years. What
          is the probability it survives those $2$ years?
        expects: "0.8187"
        tolerance: 0.0005
        hint: >
          Constant hazard over the stretch is an exponential law there.
        feedback: >
          With hazard constant at $0.1$ the machine behaves like
          $\operatorname{Exp}(0.1)$ on that stretch: $e^{-0.1 \times 2} =
          e^{-0.2} \approx 0.8187$.
      - ask: >
          After year $2$ the hazard jumps to $0.4$ per year. What is the
          probability it survives past year $4$?
        expects: "0.3679"
        tolerance: 0.0005
        hint: >
          Survive the first stretch, then, given that, survive the second.
        feedback: >
          $e^{-0.2} \times e^{-0.4 \times 2} = e^{-0.2 - 0.8} = e^{-1}
          \approx 0.3679$. The exponents add: what matters is the total
          hazard accumulated, $\int_0^4 h(u)\,du = 0.2 + 0.8 = 1$.
      - teach: >
          That is the general rule: $\Pr(X > x) = \exp(-\int_0^x h(u)\,du)$,
          so the hazard function determines the whole law. Constant $h$ gives
          the exponential; a hazard that rises gives a law that wears out. In
          an interview, "does it age?" is a question about the hazard, and
          flat hazard is the exponential, with no exceptions.

  - node: quant-probability.continuous.min-exponentials
    hook: >
      "Which of two competing processes finishes first" — two traders'
      fills, two servers, two failure clocks — collapses to a rate-sharing
      ratio whenever both clocks are independent exponentials.
    explanation: >
      Independence turns the event $\{\min(X,Y)>t\}$ into $\{X>t\}\cap
      \{Y>t\}$, so survival functions multiply:
      $\Pr(\min(X,Y)>t)=e^{-\lambda_X t}e^{-\lambda_Y t}
      =e^{-(\lambda_X+\lambda_Y)t}$ — the minimum is exponential with the
      summed rate, mean $1/(\lambda_X+\lambda_Y)$, faster than either clock
      alone, exactly as competing clocks should finish sooner.

      "Who wins" comes from integrating over when $X$ fires:
      $\Pr(X<Y)=\int_0^\infty \lambda_X e^{-\lambda_X t}e^{-\lambda_Y
      t}\,dt$; factor the integrand as $\lambda_X/(\lambda_X+\lambda_Y)$
      times the density of an $\operatorname{Exp}(\lambda_X+\lambda_Y)$
      variable, whose integral is $1$, leaving exactly
      $\Pr(X<Y)=\lambda_X/(\lambda_X+\lambda_Y)$ — a share of the combined
      rate.

      Both facts extend to $n$ clocks without new work: the minimum is
      exponential with the summed rate, and each competitor wins in exact
      proportion to its own rate, with the identity of the winner
      independent of when the race finishes.
    worked: >
      Server $A$ completes tasks at rate $4$ per hour, server $B$ at rate
      $6$ per hour, independently. $\Pr(A\text{ finishes first})
      =4/(4+6)=0.4$, and the time until the first completion is
      $\operatorname{Exp}(10)$, with mean $1/10$ hour $=6$ minutes.
    interview: >
      "Two processes racing, both exponential — who wins, and how long" is
      the canonical phrasing; state $\Pr(X<Y)=\lambda_X/(\lambda_X
      +\lambda_Y)$ and $\min\sim\operatorname{Exp}(\lambda_X+\lambda_Y)$
      immediately, without re-deriving.
    pitfalls: >
      Using $\lambda_Y/(\lambda_X+\lambda_Y)$ for $\Pr(X<Y)$ swaps the
      numerator — a faster clock (higher $\lambda_X$) should win more
      often, so the numerator must match the variable in question.
      Independence is a real hypothesis; correlated clocks break both
      formulas.
    recap: >
      The minimum of independent exponentials is exponential with the
      summed rate, and each competitor wins in exact proportion to its own
      rate.
    dialogue:
      - part: Two kinds of seller
        teach: >
          You rest a buy order. Sellers of type A arrive at rate $2$ per
          minute and sellers of type B at rate $5$ per minute, as independent
          exponential clocks $X \sim \operatorname{Exp}(2)$ and
          $Y \sim \operatorname{Exp}(5)$, in minutes. The first seller to
          arrive fills you, at time $\min(X, Y)$.
      - ask: >
          What is the probability you are still unfilled after $0.1$ minute?
        expects: "0.4966"
        tolerance: 0.0005
        hint: >
          Unfilled means neither seller has arrived. Use independence.
        feedback: >
          $\Pr(X > 0.1)\Pr(Y > 0.1) = e^{-0.2}e^{-0.5} = e^{-0.7} \approx
          0.4966$.
      - reflect: >
          Write $\Pr(\min(X,Y) > t)$ for any $t$. What law is the fill time,
          and what happened to the two rates?
        hint: >
          Multiply the two survival functions and collect the exponents.
        answer: >
          $\Pr(\min(X,Y) > t) = e^{-2t}e^{-5t} = e^{-7t}$, which is the
          survival function of $\operatorname{Exp}(7)$. The minimum of the two
          clocks is itself an exponential clock, and its rate is the sum of
          the rates: survival functions multiply, so their exponents add.
      - ask: >
          What is the expected time until you are filled, in seconds?
        expects: "8.571"
        tolerance: 0.005
        hint: >
          The fill time is $\operatorname{Exp}(7)$ per minute.
        feedback: >
          $1/7$ minute, which is $60/7 \approx 8.571$ seconds. Averaging the
          two mean waits, $30$ and $12$ seconds, gives $21$ — far too slow,
          because whichever seller is quicker on the day does the filling.
      - teach: >
          In general, for independent $X \sim \operatorname{Exp}(\lambda_X)$
          and $Y \sim \operatorname{Exp}(\lambda_Y)$,
          $\min(X,Y) \sim \operatorname{Exp}(\lambda_X + \lambda_Y)$: rates
          add under a minimum, and the same holds for any number of
          independent exponential clocks.

      - part: Who wins the race
        ask: >
          What is the probability that a type A seller is the one who fills
          you?
        choices:
          - text: >
              $2/5$
            feedback: >
              That is the ratio of the two rates, A to B. A wins $2$ races for
              every $5$ that B wins, so A's share is $2$ out of $7$.
          - text: >
              $5/7$
            feedback: >
              That is B's share. The faster clock wins more often, and B is
              the faster one.
          - text: >
              $2/7$
            correct: true
            feedback: >
              Right. In any tiny stretch $dt$, A fires with chance $2\,dt$ and
              B with $5\,dt$; given that one of them fires, it is A with
              chance $2/7$.
          - text: >
              $1/2$, since each seller either comes first or not
            feedback: >
              Two outcomes need not be equally likely. With equal rates it
              would be $1/2$; here B arrives two and a half times as often.
        feedback: >
          The winner is decided in proportion to rate:
          $\Pr(X < Y) = \lambda_X/(\lambda_X + \lambda_Y)$.
      - ask: >
          To prove it, write $\Pr(X < Y) = \int_0^\infty 2e^{-2t} \cdot
          e^{-5t}\,dt$. What is the factor $e^{-5t}$ doing there?
        choices:
          - text: >
              It is the density of $Y$ at $t$
            feedback: >
              The density of $Y$ is $5e^{-5t}$. A density would ask for $Y$
              to fire at $t$, but A wins if B has not fired yet.
          - text: >
              It is $\Pr(Y > t)$: B has not arrived when A does
            correct: true
            feedback: >
              Right. Integrate over A's arrival time $t$ the chance that B is
              still absent. The integral is $2/(2+5) = 2/7$.
          - text: >
              It is $\Pr(Y < t)$: B arrived before A
            feedback: >
              That would compute the chance B wins, and it would need
              $1 - e^{-5t}$, not $e^{-5t}$.
        feedback: >
          $\int_0^\infty 2e^{-7t}\,dt = 2/7$: the rate share appears as the
          integrand's constant over the summed rate.
      - ask: >
          A third type, C, starts arriving at rate $3$ per minute. What is
          the probability a type C seller fills you?
        expects: "3/10"
        hint: >
          Share of the total rate.
        feedback: >
          $3/(2+5+3) = 3/10$. With $n$ independent exponential clocks, clock
          $i$ fires first with probability $\lambda_i/(\lambda_1 + \dots +
          \lambda_n)$.
      - ask: >
          With all three types arriving, what is the expected time until you
          are filled, in seconds?
        expects: "6"
        hint: >
          Add the three rates.
        feedback: >
          The fill time is $\operatorname{Exp}(10)$ per minute, mean $1/10$
          minute, which is $6$ seconds.

      - part: What the rule does and does not say
        ask: >
          You learn that you were filled within the first second. Is the
          seller now likelier to be type B than the usual $5/10$?
        choices:
          - text: >
              Yes: fast fills come from the fast sellers
            feedback: >
              Plausible but false here. The chance a given type wins is its
              rate share at every instant, so the fill time carries no
              information about the type.
          - text: >
              No: it is still $5/10$, however soon or late the fill came
            correct: true
            feedback: >
              Right. For exponential clocks the identity of the winner is
              independent of the winning time.
          - text: >
              No: it is lower, since B sellers cluster later
            feedback: >
              Exponential clocks do not cluster; each type keeps the same rate
              throughout.
        feedback: >
          Who wins and when are independent: $\Pr(\text{B first} \mid
          \min = t) = 5/10$ for every $t$.
      - ask: >
          Replace the exponentials by two independent $U(0,1)$ clocks. Is
          their minimum uniform, with the two "rates" combined?
        choices:
          - text: >
              Yes: minima of independent clocks always stay in the family
            feedback: >
              Survival functions still multiply, but $(1-t)(1-t) = (1-t)^{2}$
              is not the survival function of any uniform.
          - text: >
              No: the survival is $(1-t)^{2}$, a different shape
            correct: true
            feedback: >
              Right. Multiplying survival functions always works; the product
              stays in the family only for the exponential, because
              $e^{-at}e^{-bt} = e^{-(a+b)t}$.
          - text: >
              Yes, on $(0, 1/2)$, matching the doubled rate
            feedback: >
              The minimum can be anything in $(0,1)$; it is merely more often
              small, with density $2(1-t)$.
        feedback: >
          Said aloud in an interview: rates add under a minimum, and each
          clock wins in proportion to its rate — both resting on independence
          and on the exponential form.

  - node: quant-probability.continuous.bank-teller
    hook: >
      This is the classic "surprise, it's exactly $1/2$" showcase — testing
      whether you trust memorylessness enough to ignore the head start the
      customer ahead of you appears to have.
    explanation: >
      Two tellers serve $A$ and $B$; you're third, all services iid
      $\operatorname{Exp}(\lambda)$. The moment the first teller frees up,
      memorylessness erases the elapsed service time of whichever customer
      is still being served — their remaining time is a completely fresh
      $\operatorname{Exp}(\lambda)$, indistinguishable from your own
      about-to-start, independent $\operatorname{Exp}(\lambda)$ service. So
      the race you actually join is symmetric between two freshly started
      identical clocks, and you lose it — leave last — with probability
      exactly $1/2$, however long the original two services already ran.

      The apparent head start is worth nothing once conditioned correctly;
      that is the entire content of the puzzle.

      Your expected time in the bank adds two separate pieces: the wait
      until a teller frees up, which is $\min$ of two
      $\operatorname{Exp}(\lambda)$'s with mean $1/(2\lambda)$, plus your
      own service, mean $1/\lambda$, giving $1/(2\lambda)+1/\lambda
      =3/(2\lambda)$.
    worked: >
      With mean service time $10$ minutes ($\lambda=1/10$ per minute),
      $\Pr(\text{you leave last})=1/2$ regardless, and your expected total
      time in the bank is $3/(2\lambda)=3(10)/2=15$ minutes. With unequal
      rates $\lambda_1=1$, $\lambda_2=2$ per hour, the same race argument
      gives $\Pr(\text{you leave last})=2\lambda_1\lambda_2/(\lambda_1
      +\lambda_2)^{2}=2(1)(2)/9=4/9\approx0.444$, below $1/2$.
    interview: >
      The two-teller puzzle wants instant recognition that once the race
      begins, memorylessness makes the surviving customer's apparent head
      start irrelevant, giving $1/2$ with almost no calculation.
    pitfalls: >
      Trying to track the exact elapsed service times of the first two
      customers is unnecessary work memorylessness makes irrelevant.
      Confusing "$\Pr(\text{leave last})=1/2$" with "expected total time
      $=3/(2\lambda)$" treats two different questions as one.
    recap: >
      Memorylessness makes the race you eventually join always fair, so you
      leave last with probability exactly $1/2$, and your expected total
      time in the bank is $3/(2\lambda)$.
    dialogue:
      - part: Two chargers, both busy
        teach: >
          Two charging bays, both occupied: car A in one, car B in the other.
          You are next in line and will take whichever bay frees up first.
          Every charging time, yours included, is independent and exponential
          with mean $20$ minutes.
      - ask: >
          Before computing: what is the chance that you are the last of the
          three cars to finish?
        choices:
          - text: >
              $1/3$, by symmetry among three cars
            feedback: >
              The three cars are not in symmetric positions: two have started
              and you have not. Symmetry has to be found somewhere more
              specific.
          - text: >
              More than $1/2$, since you start last
            feedback: >
              Starting last feels decisive, but A and B's head start is spent
              on deciding who leaves *first*. The race you join is another
              matter.
          - text: >
              Exactly $1/2$
            correct: true
            feedback: >
              That is the answer, whatever the mean charging time. The next
              questions earn it.
          - text: >
              It depends on how long A and B have already been charging
            feedback: >
              With exponential charging times it does not, and the reason is
              the whole point of this puzzle.
        feedback: >
          Hold your guess and build the answer one step at a time.
      - ask: >
          How long, on average, do you wait for a bay to free up, in minutes?
        expects: "10"
        hint: >
          You wait for the first of two independent exponential clocks.
        feedback: >
          The minimum of two $\operatorname{Exp}(1/20)$ clocks is
          $\operatorname{Exp}(1/10)$, mean $10$ minutes. Rates add under a
          minimum.
      - reflect: >
          A bay frees up and you plug in. The other car has been charging for
          a while already. What do you know about its *remaining* charging
          time, and why?
        hint: >
          Which property of the exponential speaks about time already spent?
        answer: >
          Its remaining time is a fresh $\operatorname{Exp}(1/20)$, exactly
          like yours, by memorylessness: time already spent charging tells
          you nothing about the time left. So from the moment you plug in,
          two identical, independent, freshly started clocks race, and each
          finishes last with probability $1/2$.
      - teach: >
          That is the argument. When the first bay frees up, memorylessness
          resets the surviving car's clock, and your clock starts new. The
          race you actually join is symmetric, so you leave last with
          probability exactly $1/2$ — the head start the others had is worth
          nothing.
      - ask: >
          What is the probability that car A, specifically, is the last to
          finish?
        expects: "1/4"
        hint: >
          A is last only if B frees its bay first and then A loses the race
          with you.
        feedback: >
          B finishes before A with probability $1/2$; then A and you race on
          fresh clocks, and A loses with probability $1/2$: $1/4$. Likewise
          for B, and $1/4 + 1/4 + 1/2 = 1$.

      - part: How long you are there
        ask: >
          What is your expected total time at the chargers, from now until
          you finish, in minutes?
        expects: "30"
        hint: >
          The wait for a bay, then your own charge.
        feedback: >
          $10 + 20 = 30$ minutes: the minimum of two clocks, then a full
          independent charge of mean $20$. In rate form,
          $1/(2\lambda) + 1/\lambda = 3/(2\lambda)$.
      - ask: >
          What is the expected time until the last of the three cars
          finishes, in minutes?
        expects: "40"
        hint: >
          After you plug in, wait for the first of two fresh clocks, then for
          the second.
        feedback: >
          $10$ minutes until you plug in; then the first of the two remaining
          clocks finishes after $10$ more on average, and by memorylessness
          the survivor needs a fresh $20$: $10 + 10 + 20 = 40$ minutes.

      - part: Unequal chargers
        teach: >
          Now one bay is fast, with mean charging time $10$ minutes (rate $6$
          per hour), and the other slow, with mean $30$ minutes (rate $2$ per
          hour). A car occupies each. Whichever bay frees first, you take it
          and charge at that bay's rate.
      - ask: >
          What is the probability the fast bay frees up first?
        expects: "3/4"
        hint: >
          Share of the combined rate.
        feedback: >
          $6/(6+2) = 3/4$.
      - ask: >
          What is the probability that you finish last?
        expects: "3/8"
        hint: >
          Condition on which bay you get. On the fast bay you race the slow
          bay's car; on the slow bay you race the fast bay's car.
        feedback: >
          On the fast bay (chance $3/4$), you charge at rate $6$ against the
          slow car's $2$, and the slow car beats you with chance $2/8$. On the slow bay
          (chance $1/4$), the fast car beats you with chance $6/8$. Total:
          $(3/4)(1/4) + (1/4)(3/4) = 3/8$, which is
          $2\lambda_1\lambda_2/(\lambda_1 + \lambda_2)^{2} = 24/64$.
      - ask: >
          For which pair of bay speeds is your chance of finishing last the
          greatest?
        choices:
          - text: >
              One bay very fast and the other very slow
            feedback: >
              Then you almost surely land on the fast bay and beat the slow
              car: $2\lambda_1\lambda_2/(\lambda_1 + \lambda_2)^{2} \to 0$.
          - text: >
              Equal speeds
            correct: true
            feedback: >
              Right. By AM–GM, $(\lambda_1 + \lambda_2)^{2} \ge
              4\lambda_1\lambda_2$, so the chance is at most $1/2$, with
              equality exactly when the rates match.
          - text: >
              It does not matter: memorylessness always makes it $1/2$
            feedback: >
              Memorylessness makes the race fresh, not fair. With unequal
              bays you just computed $3/8$.
        feedback: >
          Said aloud in an interview: "when a teller frees up, the other
          customer's remaining time is a fresh exponential by
          memorylessness, so it is a fair coin — one half, and the head start
          is worth nothing."

  - node: quant-probability.continuous.geometric-limit
    hook: >
      Interviewers use this correspondence to test whether you see the
      exponential and the geometric as the same memoryless law told on two
      different clocks, not two formulas memorized separately.
    explanation: >
      Round an exponential up: for integer $k$, $\{\lceil X\rceil>k\}$ is
      the same event as $\{X>k\}$, so $\Pr(\lceil X\rceil>k)
      =e^{-\lambda k}$ exactly — which is the survival function of a
      geometric on $\{1,2,\dots\}$ with success probability
      $p=1-e^{-\lambda}$, since a geometric's survival is $(1-p)^{k}$ and
      matching gives $1-p=e^{-\lambda}$. This is an exact correspondence, no
      approximation involved.

      The reverse direction is genuinely a limit: if $G_p$ is geometric with
      parameter $p$, $\Pr(pG_p>t)=(1-p)^{\lfloor t/p\rfloor}\to e^{-t}$ as
      $p\to0$, using $(1-p)^{1/p}\to e^{-1}$ — so a rescaled geometric with
      vanishing success probability looks exponential, useful for
      approximating "many trials, rare success" waiting times.

      Both directions rest on the same fact: each law is the unique
      memoryless one in its setting, discrete or continuous, and each has
      mean equal to one over its rate parameter.
    worked: >
      Take $\lambda=\ln(4/3)\approx0.2877$, so $e^{-\lambda}=3/4$ and
      $p=1/4$. Then $\Pr(\lceil X\rceil>3)=e^{-3\lambda}=(3/4)^{3}=27/64
      \approx0.4219$, matching the geometric survival check
      $(1-1/4)^{3}=27/64$ exactly.
    interview: >
      "How are the geometric and exponential related" wants both directions
      named: rounding an exponential up gives an exact geometric, and
      shrinking a geometric's step size recovers the exponential in the
      limit.
    pitfalls: >
      Treating the correspondence as approximate in both directions is
      wrong — the round-up direction is exact, only the rescaling direction
      is asymptotic. Setting $p=\lambda$ directly ignores that they're
      linked by $p=1-e^{-\lambda}$, which only reduces to $p\approx\lambda$
      when $\lambda$ is small.
    recap: >
      Rounding an exponential up gives an exact geometric with
      $p=1-e^{-\lambda}$, and shrinking a geometric's step size recovers the
      exponential in the limit — the same memoryless law on two clocks.
    dialogue:
      - part: Outages, reported by the day
        teach: >
          A website's next outage comes after $X$ days, where $X$ is
          exponential with $\Pr(X > t) = 0.9^{t}$ — rate
          $\lambda = \ln(10/9) \approx 0.105$ per day. The daily report only
          records the day number of the outage: day $1$ if it happens in the
          first $24$ hours, day $2$ if in the next $24$, and so on. Call that
          number $N = \lceil X \rceil$.
      - ask: >
          What is $\Pr(N > 3)$?
        expects: "0.729"
        hint: >
          What does "$N > 3$" say about $X$?
        feedback: >
          $N > 3$ means the outage did not happen in days $1$ to $3$, which is
          exactly $X > 3$. So $\Pr(N > 3) = 0.9^{3} = 0.729$.
      - ask: >
          What law does $N$ follow?
        choices:
          - text: >
              Geometric with success probability $0.1$
            correct: true
            feedback: >
              Right: $\Pr(N > k) = 0.9^{k}$ for every whole $k$, the survival
              function of a geometric on $\{1, 2, \dots\}$ with $p = 0.1$.
          - text: >
              Geometric with success probability $\lambda \approx 0.105$
            feedback: >
              Close, but not equal. The daily chance of an outage is
              $1 - e^{-\lambda} = 1 - 0.9 = 0.1$, which is a little less than
              $\lambda$.
          - text: >
              Poisson with mean $\lambda$
            feedback: >
              A Poisson counts events in a fixed stretch. $N$ is the index of
              the first day with an event, a waiting time in days.
          - text: >
              Only approximately geometric, since rounding loses information
            feedback: >
              Rounding loses the time of day, but $\Pr(N > k) = \Pr(X > k)$
              holds exactly, so $N$ is exactly geometric.
        feedback: >
          Rounding an exponential up gives a geometric, with
          $p = 1 - e^{-\lambda}$.
      - reflect: >
          Why was rounding up guaranteed to produce a geometric, with no
          approximation anywhere? Describe the outage day by day.
        hint: >
          Given no outage in days $1$ to $k$, what is the chance of one on
          day $k+1$?
        answer: >
          Given no outage by the end of day $k$, memorylessness makes the rest
          of the wait a fresh exponential, so day $k+1$ brings an outage with
          the same chance $1 - e^{-\lambda}$ as day $1$ did, whatever $k$ is.
          A sequence of independent days, each a success with the same
          probability, waiting for the first success: that is a geometric. The
          exponential is memoryless in continuous time, the geometric in
          whole days, and rounding up carries one property to the other.
      - teach: >
          So for $X \sim \operatorname{Exp}(\lambda)$, $\lceil X \rceil$ is
          exactly geometric on $\{1, 2, \dots\}$ with $p = 1 - e^{-\lambda}$.
          Taking $\lambda = \ln 2$ gives $p = 1/2$: rounding up makes a
          fair-coin count.

      - part: When the daily chance and the rate part ways
        ask: >
          For a much rarer outage, with rate $\lambda = 0.02$ per day, what is
          the daily outage probability $p$?
        expects: "0.0198"
        tolerance: 0.0001
        hint: >
          $p = 1 - e^{-\lambda}$.
        feedback: >
          $1 - e^{-0.02} \approx 0.0198$, almost exactly $\lambda$. For small
          $\lambda$, $1 - e^{-\lambda} \approx \lambda$, so rare events let
          you blur the two.
      - ask: >
          A flaky job fails at rate $\lambda = 1.5$ per day. A colleague sets
          the daily failure probability to $p = \lambda$. What is wrong?
        choices:
          - text: >
              Nothing: $p$ and $\lambda$ are interchangeable
            feedback: >
              They agree only for small rates. At $1.5$ they are not even the
              same kind of number.
          - text: >
              $p = 1.5$ is not a probability; the right value is
              $1 - e^{-1.5} \approx 0.777$
            correct: true
            feedback: >
              Right. A rate can exceed $1$ — on average $1.5$ failures a day —
              but the chance of at least one failure in a day cannot.
          - text: >
              The right value is $1/1.5 \approx 0.667$
            feedback: >
              $1/\lambda$ is the mean wait in days, not a daily probability.
        feedback: >
          $p = 1 - e^{-\lambda}$ always; $p \approx \lambda$ only when
          $\lambda$ is small.
      - ask: >
          Back to the original website. $\mathbb{E}[N] = 1/p = 10$ days,
          while $\mathbb{E}[X] = 1/\lambda \approx 9.49$ days. Why the
          extra half day?
        choices:
          - text: >
              Rounding up adds a fraction of a day to every outage, about half
              a day on average
            correct: true
            feedback: >
              Right. $N - X$ is the unused part of the outage day, which
              averages close to $1/2$; here $10 - 9.49 = 0.51$.
          - text: >
              The geometric is only an approximation to the exponential
            feedback: >
              The correspondence is exact. The two means differ because $N$
              and $X$ are different quantities: one is rounded up.
          - text: >
              $N$ is not memoryless, so its mean is larger
            feedback: >
              The geometric is memoryless in whole days. The difference is the
              rounding, nothing more.
        feedback: >
          Exact correspondence, different variables: $N = \lceil X \rceil$ is
          never smaller than $X$.

      - part: Shrinking the clock
        teach: >
          Now run it the other way. An algorithm checks for a trading signal
          every millisecond; each check fires with probability $p = 0.001$,
          independently. $G$ is the number of checks until the first fire,
          geometric with mean $1000$, and $T = pG$ is the wait in seconds.
      - ask: >
          What is $\Pr(T > 2)$, a wait of more than $2$ seconds?
        expects: "0.1352"
        tolerance: 0.0005
        hint: >
          $T > 2$ means the first $2000$ checks all came up empty.
        feedback: >
          $0.999^{2000} \approx 0.1352$. Compare $e^{-2} \approx 0.1353$, the
          chance an $\operatorname{Exp}(1)$ wait exceeds $2$.
      - ask: >
          As $p \to 0$, what does the law of $pG$ approach?
        choices:
          - text: >
              $\operatorname{Exp}(1)$
            correct: true
            feedback: >
              Right: $\Pr(pG > t) = (1-p)^{\lfloor t/p \rfloor} \to e^{-t}$,
              because $(1-p)^{1/p} \to e^{-1}$.
          - text: >
              A geometric with $p = 0$
            feedback: >
              With $p = 0$ the first success never comes. Scaling by $p$ is
              what keeps the wait finite: $\mathbb{E}[pG] = p \cdot (1/p) = 1$.
          - text: >
              Uniform on $(0, 2)$, since the mean is $1$
            feedback: >
              A uniform on $(0,2)$ never exceeds $2$, yet you just found
              $\Pr(T > 2) \approx 0.135$. The limit keeps the geometric's long
              right tail.
        feedback: >
          The geometric on a finer and finer clock is the exponential. In an
          interview, name both directions: rounding an exponential up is
          exactly geometric with $p = 1 - e^{-\lambda}$, and shrinking a
          geometric's step recovers the exponential only in the limit.

  - node: quant-probability.continuous.gamma
    hook: >
      "Expected time until the $n$-th arrival, not the first" is answered
      instantly by recognizing a sum of iid exponentials — no new integral
      needed beyond what a sum already gives you.
    explanation: >
      Waiting for the $n$-th event in a stream with iid
      $\operatorname{Exp}(\lambda)$ inter-arrival times is literally summing
      $n$ of them, $T_n=X_1+\dots+X_n$. Because means always add and
      variances of independent summands always add, regardless of shape,
      $\mathbb{E}[T_n]=n/\lambda$ and $\operatorname{Var}(T_n)=n/\lambda^{2}$
      follow immediately from the sum, with no fresh derivation.

      The density of that sum works out to the Erlang form
      $\lambda^{n}x^{n-1}e^{-\lambda x}/(n-1)!$, and since you already know
      $\Gamma(n)=(n-1)!$, replacing $(n-1)!$ with $\Gamma(\alpha)$ is exactly
      how the Gamma function extends the integer factorial — so
      $\operatorname{Gamma}(\alpha,\lambda)$ is the natural real-valued
      generalization of "sum of $n$ exponentials" to non-integer shape.

      Summing more exponentials just adds more terms, so shapes at a common
      rate add too: $\operatorname{Gamma}(\alpha_1,\lambda)$ plus an
      independent $\operatorname{Gamma}(\alpha_2,\lambda)$ is
      $\operatorname{Gamma}(\alpha_1+\alpha_2,\lambda)$ — the same
      additivity fact restated.
    worked: >
      At rate $\lambda=4$ per hour, waiting for the $5$th arrival has mean
      $5/4=1.25$ hours, variance $5/16=0.3125$, and standard deviation
      $\sqrt{0.3125}\approx0.559$ hours.
    interview: >
      "Expected time until the $k$-th event" is answered with $k/\lambda$
      immediately, naming the sum-of-exponentials fact and the Gamma/Erlang
      name; the variance $k/\lambda^{2}$ is the natural follow-up.
    pitfalls: >
      Assuming the distribution is just "$n$ copies" of the exponential
      scaled up misses that it's a genuinely new, more concentrated shape,
      even though the mean scales linearly. Some references parameterize
      by scale $1/\lambda$ instead of rate $\lambda$ — always confirm which
      convention is in play.
    recap: >
      The wait for the $n$-th arrival is a sum of $n$ iid
      $\operatorname{Exp}(\lambda)$'s, hence $\operatorname{Gamma}(n,
      \lambda)$ with mean $n/\lambda$ and variance $n/\lambda^{2}$.
    dialogue:
      - part: Waiting for the third fill
        teach: >
          A resting order gets filled in pieces. Fills arrive with
          independent exponential gaps at rate $10$ per hour, and you need
          three of them. Let $T$ be the time until the third fill, so
          $T = X_1 + X_2 + X_3$ with each $X_i \sim \operatorname{Exp}(10)$.
      - ask: >
          What is the expected time until the third fill, in minutes?
        expects: "18"
        hint: >
          Each gap averages $1/10$ hour.
        feedback: >
          $3 \times 6 = 18$ minutes, by linearity. In general
          $\mathbb{E}[T] = n/\lambda$.
      - ask: >
          What is the standard deviation of $T$, in minutes?
        expects: "10.39"
        tolerance: 0.01
        hint: >
          Each gap has standard deviation $6$ minutes, and the gaps are
          independent.
        feedback: >
          Variances add: $3 \times 6^{2} = 108$, so the standard deviation is
          $\sqrt{108} = 6\sqrt{3} \approx 10.39$ minutes. In general
          $\operatorname{Var}(T) = n/\lambda^{2}$.
      - ask: >
          Is $T$ itself exponential, with mean $18$ minutes?
        choices:
          - text: >
              Yes: adding exponential waits gives an exponential wait
            feedback: >
              An exponential with mean $18$ would have standard deviation
              $18$. You just found $10.39$, so $T$ is something else.
          - text: >
              No: its density starts at $0$ and peaks later
            correct: true
            feedback: >
              Right. An exponential density is tallest at $0$; but $T$ near $0$
              needs three quick gaps in a row, which is very unlikely.
          - text: >
              No: $T$ is uniform on $(0, 36)$ minutes
            feedback: >
              The mean fits, but $T$ has no upper limit — three slow gaps can
              take any length of time.
        feedback: >
          Sums of exponentials form a new family, more concentrated relative
          to its mean: here the standard deviation is $10.39/18 \approx
          0.58$ of the mean, against $1$ for a single exponential.
      - reflect: >
          For the third fill to land in the short stretch $[t, t + dt]$, what
          must happen in $(0, t)$, and what must happen in $[t, t+dt]$? Use
          that to guess the density of $T$ at $t$.
        hint: >
          The number of fills in $(0, t)$ is Poisson with mean $\lambda t$.
        answer: >
          Exactly two fills in $(0, t)$, with probability
          $e^{-\lambda t}(\lambda t)^{2}/2!$, and then a fill in
          $[t, t + dt]$, with probability $\lambda\,dt$. So the density is
          $\lambda^{3}t^{2}e^{-\lambda t}/2!$: zero at $t = 0$ because of the
          $t^{2}$, then rising, then killed by the $e^{-\lambda t}$.
      - teach: >
          That is the Gamma law. The sum of $n$ independent
          $\operatorname{Exp}(\lambda)$ waits is
          $\operatorname{Gamma}(n, \lambda)$, the Erlang law, with density
          $\lambda^{n}x^{n-1}e^{-\lambda x}/(n-1)!$ for $x > 0$. Replacing
          $(n-1)!$ by $\Gamma(\alpha)$ allows any shape $\alpha > 0$:
          density $\lambda^{\alpha}x^{\alpha-1}e^{-\lambda x}/\Gamma(\alpha)$,
          mean $\alpha/\lambda$, variance $\alpha/\lambda^{2}$.

      - part: Checking the shape
        ask: >
          The constant must make the density integrate to $1$. With
          $\lambda = 1$ and $n = 3$, what is $\int_0^\infty x^{2}e^{-x}\,dx$?
        expects: "2"
        hint: >
          This is a value of the Gamma function.
        feedback: >
          $\Gamma(3) = 2! = 2$, so the density $x^{2}e^{-x}/2!$ has area $1$.
          Substituting $u = \lambda x$ handles any rate: the $\lambda^{n}$ in
          front absorbs the stretch.
      - ask: >
          At what time is the density of $T$ highest, in minutes?
        expects: "12"
        hint: >
          Differentiate $t^{2}e^{-10t}$ and set the derivative to zero.
        feedback: >
          $\frac{d}{dt}\,t^{2}e^{-10t} = (2t - 10t^{2})e^{-10t}$, zero at
          $t = 2/10$ hour $= 12$ minutes. In general the mode is
          $(n-1)/\lambda$, below the mean $n/\lambda = 18$ minutes: the long
          right tail pulls the mean past the peak.

      - part: Shapes add, rates must match
        ask: >
          You need $3$ fills from venue A, then $2$ fills from an independent
          venue B, both at rate $10$ per hour. What is the law of the total
          wait?
        choices:
          - text: >
              $\operatorname{Gamma}(5, 10)$
            correct: true
            feedback: >
              Right: it is five independent $\operatorname{Exp}(10)$ gaps in a
              row. $\operatorname{Gamma}(3, 10)$ plus an independent
              $\operatorname{Gamma}(2, 10)$ is $\operatorname{Gamma}(5, 10)$.
          - text: >
              $\operatorname{Gamma}(5, 20)$
            feedback: >
              Adding rates is what happens under a *minimum* of clocks. Here
              the waits run one after another, so the shapes add and the rate
              stays $10$.
          - text: >
              $\operatorname{Gamma}(6, 10)$
            feedback: >
              The shapes $3$ and $2$ add to $5$; the count of gaps is the
              count of fills.
        feedback: >
          At a common rate, Gamma shapes add: the count of exponential gaps is
          all that changes.
      - ask: >
          Now venue B fills at rate $20$ per hour instead. Is the total wait
          for $3$ fills from A and then $2$ from B still a Gamma?
        choices:
          - text: >
              Yes, $\operatorname{Gamma}(5, 15)$, averaging the rates
            feedback: >
              Its mean would be $5/15$ hour $= 20$ minutes, but the true mean
              is $3 \times 6 + 2 \times 3 = 24$ minutes. Averaging rates
              mismeasures the wait.
          - text: >
              No: the gaps are not identically distributed, so the sum is not
              a Gamma
            correct: true
            feedback: >
              Right. The mean $24$ minutes and variance still add, but the
              shape is not in the family. Shapes add only at a common rate.
          - text: >
              Yes, $\operatorname{Gamma}(5, 10)$, using the slower rate
            feedback: >
              That would give a mean of $30$ minutes, but two of the five gaps
              average only $3$ minutes.
        feedback: >
          In an interview, "expected time to the $n$-th arrival" is $n/\lambda$
          at once, with variance $n/\lambda^{2}$ as the follow-up — and the
          law is $\operatorname{Gamma}(n, \lambda)$, provided the rate is
          common.

  - node: quant-probability.continuous.normal
    hook: >
      "Assume returns are normally distributed" tests are rarely about the
      density formula itself — the real test is converting a probability
      question into a $\Phi$ lookup without a calculator.
    explanation: >
      The density $f(x)=\frac{1}{\sigma\sqrt{2\pi}}
      \exp(-(x-\mu)^{2}/(2\sigma^{2}))$ is symmetric about $\mu$, since
      $f(\mu+x)=f(\mu-x)$ term by term, so mean, median and mode coincide
      there with no separate computation. The inflection points at
      $\mu\pm\sigma$ mark where the curve switches from convex to concave —
      the "shoulders" of the bell.

      What matters most in practice is the tail: it decays like
      $e^{-x^{2}/2}$, far faster than an exponential tail, which is exactly
      why the normal badly underweights the extreme moves real markets
      actually produce. That gap between assumed and true tail weight is
      the standard critique of normal-return models.

      The standard case $\mu=0,\sigma=1$ has density $\varphi$ and CDF
      $\Phi$, and $\Phi$ has no elementary closed form — which is why
      interviews run entirely on memorized landmarks rather than live
      integration.
    worked: >
      Let $X\sim\mathcal{N}(50,100)$, so $\sigma=10$. The density at $x=60$
      is $f(60)=\frac{1}{10\sqrt{2\pi}}e^{-100/200}
      =0.03989\times e^{-0.5}\approx0.03989\times0.6065\approx0.0242$.
    interview: >
      "Why is $68$–$95$–$99.7$ memorized rather than computed" tests
      knowing $\Phi$ has no closed form; a strong answer also states, from
      the formula, why the normal underestimates tail risk relative to
      fatter-tailed alternatives.
    pitfalls: >
      Dropping the $1/\sigma$ normalizing factor and writing
      $\exp(-(x-\mu)^{2}/2)$ as if already normalized silently breaks the
      density for any $\sigma\ne1$. Defaulting to the normal for extreme
      events is precisely what its fast tail decay warns against.
    recap: >
      The normal is the symmetric bell parameterized directly by mean
      $\mu$ and variance $\sigma^{2}$, with a CDF $\Phi$ you look up rather
      than integrate.
    dialogue:
      - part: Three bells for one stock
        teach: >
          Three analysts model a stock's daily return $x$, in percent, with
          three densities, each symmetric about $0$ and tallest there:
          (a) proportional to $e^{-x^{2}/8}$, (b) proportional to
          $e^{-\lvert x \rvert/2}$, and (c) proportional to $1/(4 + x^{2})$.
          All three look like bells on a chart.
      - ask: >
          Under model (a), how tall is the density at an $8\%$ move, as a
          fraction of its height at $0$?
        expects: "0.000335"
        tolerance: 0.00001
        hint: >
          The constant in front cancels in the ratio.
        feedback: >
          $e^{-64/8}/e^{0} = e^{-8} \approx 0.000335$. The same ratio is
          $e^{-4} \approx 0.018$ for (b) and $4/68 \approx 0.059$ for (c).
      - ask: >
          Which model gives an $8\%$ move the least weight, and why?
        choices:
          - text: >
              (c), because its formula has no exponential in it
            feedback: >
              The opposite: $1/(4 + x^{2})$ shrinks only like $1/x^{2}$, the
              slowest of the three. At $8\%$ it keeps about $6\%$ of its peak.
          - text: >
              (b), because $\lvert x \rvert$ grows faster than $x^{2}$
            feedback: >
              $\lvert x \rvert$ grows *slower* than $x^{2}$ once
              $\lvert x \rvert > 1$, so $e^{-\lvert x \rvert/2}$ decays slower.
          - text: >
              (a), because its exponent falls like $-x^{2}$, faster than any
              linear exponent
            correct: true
            feedback: >
              Right. A squared exponent eventually beats any exponential tail
              and every power: $e^{-8}$ against $e^{-4}$ and $1/17$.
        feedback: >
          Three bells can disagree enormously in the tails. That is where a
          model of returns is tested, and where the next choice matters.
      - ask: >
          Which of the three is a normal density, once suitably scaled?
        choices:
          - text: >
              (a)
            correct: true
            feedback: >
              Right: the exponent is a negative quadratic in $x$, the
              defining feature.
          - text: >
              (b)
            feedback: >
              That is a two-sided exponential: a sharp peak at $0$ and
              straight-line decay of the log-density. A normal's log-density
              is a downward parabola.
          - text: >
              (c)
            feedback: >
              No exponential at all — its tails are far too heavy. Bell-shaped
              is not the same as normal.
        feedback: >
          Many laws are symmetric with a single peak. The normal is the one
          whose logarithm is a parabola.
      - reflect: >
          Model (a) has the right shape. What has to be read off its exponent,
          and what must the constant in front be, to make it an honest
          density?
        hint: >
          Match $x^{2}/8$ to $(x - \mu)^{2}/(2\sigma^{2})$, then recall the
          Gaussian integral.
        answer: >
          Matching $x^{2}/8$ with $(x-\mu)^{2}/(2\sigma^{2})$ gives $\mu = 0$
          and $2\sigma^{2} = 8$, so $\sigma = 2$. By the Gaussian integral,
          $\int e^{-x^{2}/8}\,dx = 2\sqrt{2\pi}$, so the constant must be
          $1/(2\sqrt{2\pi})$, which is $1/(\sigma\sqrt{2\pi})$. The centre and
          the width are in the exponent; the constant is forced by them.
      - teach: >
          That is the normal law. $X \sim \mathcal{N}(\mu, \sigma^{2})$, with
          $\sigma > 0$, has density $\frac{1}{\sigma\sqrt{2\pi}}
          \exp(-(x-\mu)^{2}/(2\sigma^{2}))$ on all of $\mathbb{R}$:
          symmetric about $\mu$, so mean, median and mode coincide there. The
          case $\mu = 0$, $\sigma = 1$ has density $\varphi$ and CDF $\Phi$,
          and $\Phi$ has no elementary formula — normal probabilities are
          read from a table. Model (a) is $\mathcal{N}(0, 4)$.

      - part: Reading a normal off its formula
        ask: >
          A density is proportional to $\exp(-(x+1)^{2}/50)$. What is its
          standard deviation?
        expects: "5"
        hint: >
          The denominator is $2\sigma^{2}$.
        feedback: >
          $2\sigma^{2} = 50$, so $\sigma^{2} = 25$ and $\sigma = 5$.
          Answering $50$ or $25$ reads the denominator as $\sigma$ or as
          $\sigma^{2}$; it is twice the variance.
      - ask: >
          What is its median?
        expects: "-1"
        hint: >
          Where is the density symmetric about?
        feedback: >
          $(x+1)^{2} = (x - (-1))^{2}$, so $\mu = -1$. Symmetry puts the
          median, mean and mode all at $-1$; reading $+1$ off the formula is
          the sign slip.
      - ask: >
          For $\mathcal{N}(0, 4)$, model (a), where does the bell switch from
          bending down to bending up?
        choices:
          - text: >
              At $\pm 4$
            feedback: >
              $4$ is the variance. The shape is governed by the standard
              deviation, in the same units as $x$.
          - text: >
              At $\pm 2$
            correct: true
            feedback: >
              Right: the inflection points sit at $\mu \pm \sigma$, one
              standard deviation either side — the bell's shoulders.
          - text: >
              Nowhere; the bell bends down everywhere
            feedback: >
              Far out the density flattens toward $0$ from above, so it must
              bend up there. The switch happens at $\mu \pm \sigma$.
        feedback: >
          The second derivative of $e^{-x^{2}/(2\sigma^{2})}$ is proportional
          to $(x^{2}/\sigma^{2} - 1)$, which changes sign at $x = \pm\sigma$.

      - part: A bell that is not normal
        ask: >
          A fourth analyst proposes a density proportional to $e^{-x^{4}}$.
          Is it normal?
        choices:
          - text: >
              Yes: it is symmetric, single-peaked and decays exponentially
            feedback: >
              All true, and still not normal. The exponent must be quadratic;
              this one is quartic.
          - text: >
              Yes, once divided by the right constant
            feedback: >
              A constant fixes the area, not the shape. No constant turns
              $-x^{4}$ into a parabola.
          - text: >
              No: its exponent is $-x^{4}$, not a quadratic
            correct: true
            feedback: >
              Right. Its tails are even thinner than the normal's, and its top
              is flatter. It fails exactly one clause.
        feedback: >
          The test is the exponent: a negative quadratic, nothing else. In an
          interview, say the normal's tails fall like $e^{-x^{2}/2}$, which is
          why a normal model of returns makes extreme days look impossibly
          rare.

  - node: quant-probability.continuous.normal-normalization
    hook: >
      Knowing where $1/(\sigma\sqrt{2\pi})$ actually comes from — rather
      than trusting it by convention — is what lets you rebuild the whole
      density, and its mean and variance, from a blank page.
    explanation: >
      Substitute $z=(x-\mu)/\sigma$, so $dx=\sigma\,dz$: the normalizing
      integral $\int f(x)\,dx$ becomes
      $\frac{1}{\sqrt{2\pi}}\int_{-\infty}^{\infty}e^{-z^{2}/2}\,dz$, and
      since the Gaussian integral equals $\sqrt{2\pi}$, this ratio collapses
      to exactly $1$ — the constant is forced by normalization, not chosen
      for convenience.

      The same substitution shows $\mu$ and $\sigma^{2}$ are genuinely the
      mean and variance, not arbitrary shape labels. $\mathbb{E}[X]=\mu$
      because $ze^{-z^{2}/2}$ is an odd function, so its integral over all
      of $\mathbb{R}$ vanishes by symmetry — positive and negative $z$
      cancel exactly, no computation needed beyond recognizing oddness.

      Every other named continuous law needs a formula to convert its
      parameters into a mean and variance; the normal is unusual in that
      $\mu,\sigma^{2}$ already are those quantities directly.
    worked: >
      Integrate $z^{2}\varphi(z)$ by parts with $u=z$,
      $dv=ze^{-z^{2}/2}\,dz$, $v=-e^{-z^{2}/2}$: the boundary term vanishes,
      leaving $\int z^{2}e^{-z^{2}/2}\,dz=\int e^{-z^{2}/2}\,dz$, exactly the
      Gaussian integral itself. Dividing by $\sqrt{2\pi}$,
      $\int z^{2}\varphi(z)\,dz=1$, so $\operatorname{Var}(X)=\sigma^{2}$
      falls out with no new integral beyond the one already used to
      normalize.
    interview: >
      "Prove the normal density integrates to $1$" or "why do we call
      $\sigma^{2}$ the variance" both want the $z$-substitution named
      explicitly alongside the Gaussian integral, not a hand-wave.
    pitfalls: >
      Trying to integrate $e^{-x^{2}/2}$ directly in one variable dead-ends
      — it has no elementary antiderivative, which is exactly why the
      Gaussian-integral trick exists. Assuming any two-parameter density is
      automatically parameterized by its mean and variance is false in
      general.
    recap: >
      Substituting $z=(x-\mu)/\sigma$ reduces normalization to the Gaussian
      integral itself, and the same move confirms $\mu$ and $\sigma^{2}$
      really are the mean and variance.
    dialogue:
      - part: A density off by a factor
        teach: >
          A junior quant models a spread $X$ as normal with mean $1$ and
          standard deviation $2$, and writes its density as
          $f(x) = \frac{1}{\sqrt{2\pi}}e^{-(x-1)^{2}/8}$, copying the constant
          from the standard normal.
      - ask: >
          What is the total area under the junior's $f$?
        expects: "2"
        hint: >
          Substitute $z = (x - 1)/2$ and use $\int e^{-z^{2}/2}\,dz =
          \sqrt{2\pi}$.
        feedback: >
          With $x = 1 + 2z$, $dx = 2\,dz$ and the exponent becomes $-z^{2}/2$,
          so the area is $\frac{1}{\sqrt{2\pi}} \cdot 2\sqrt{2\pi} = 2$. The
          junior's density claims total probability $2$.
      - ask: >
          Which part of the substitution produced the factor $2$?
        choices:
          - text: >
              The shift by the mean, $x \mapsto x - 1$
            feedback: >
              Sliding a curve sideways does not change its area. The mean
              never enters the constant.
          - text: >
              The stretch $dx = 2\,dz$
            correct: true
            feedback: >
              Right. A bell twice as wide, with the same height, has twice the
              area.
          - text: >
              The $8$ in the exponent, which is $2\sigma^{2}$
            feedback: >
              The $8$ fixes the width, but area scales with the width
              $\sigma = 2$, not with $\sigma^{2} = 4$ or $2\sigma^{2} = 8$.
        feedback: >
          Area scales with $\sigma$, so the correct constant for $\sigma = 2$
          is half the standard one.
      - reflect: >
          For a general mean $\mu$ and standard deviation $\sigma$, what must
          the constant in front of $e^{-(x-\mu)^{2}/(2\sigma^{2})}$ be, and
          why is it forced rather than a convention?
        hint: >
          Repeat the substitution with $z = (x - \mu)/\sigma$.
        answer: >
          With $z = (x-\mu)/\sigma$ and $dx = \sigma\,dz$, the area under
          $c\,e^{-(x-\mu)^{2}/(2\sigma^{2})}$ is $c\,\sigma\sqrt{2\pi}$. A
          density has area $1$, so $c = 1/(\sigma\sqrt{2\pi})$: the Gaussian
          integral fixes the $\sqrt{2\pi}$ and the stretch fixes the
          $\sigma$. Nobody chose it; normalization did.
      - teach: >
          That is the lemma. The substitution $z = (x-\mu)/\sigma$ turns the
          normal's total area into $\frac{1}{\sqrt{2\pi}}
          \int_{-\infty}^{\infty} e^{-z^{2}/2}\,dz$, which is $1$ exactly
          because the Gaussian integral is $\sqrt{2\pi}$. The same
          substitution answers the next question: are $\mu$ and $\sigma^{2}$
          really the mean and the variance, or only labels?

      - part: Are the labels honest
        ask: >
          After substituting, $\mathbb{E}[X] = \mu + \sigma\int z\varphi(z)\,dz$.
          Why is $\int z\varphi(z)\,dz = 0$?
        choices:
          - text: >
              Because $\varphi$ is a density, so it integrates to $1$
            feedback: >
              That is $\int \varphi = 1$, a different integral. The factor $z$
              changes it.
          - text: >
              Because $z\varphi(z)$ is odd, so the two halves cancel
            correct: true
            feedback: >
              Right. $\varphi$ is even, $z$ is odd, and their product's areas
              left and right of $0$ cancel exactly — and both halves are
              finite, so the cancellation is legitimate.
          - text: >
              Because $\mu$ was defined to be the mean
            feedback: >
              That assumes what is being checked. $\mu$ enters as a shift in
              the formula; that it is the mean is a computation.
        feedback: >
          So $\mathbb{E}[X] = \mu$. The variance needs
          $\int z^{2}\varphi(z)\,dz$, where no cancellation helps.
      - ask: >
          Integrate $\int z^{2}e^{-z^{2}/2}\,dz$ by parts, with $u = z$ and
          $dv = ze^{-z^{2}/2}\,dz$. The boundary term vanishes. What is left?
        choices:
          - text: >
              $0$, since the integrand is odd
            feedback: >
              $z^{2}e^{-z^{2}/2}$ is even and positive everywhere except $0$;
              its integral cannot vanish.
          - text: >
              $\int e^{-z^{2}/2}\,dz = \sqrt{2\pi}$
            correct: true
            feedback: >
              Right: $v = -e^{-z^{2}/2}$, and $-\int v\,du = \int
              e^{-z^{2}/2}\,dz$. Dividing by $\sqrt{2\pi}$ gives
              $\int z^{2}\varphi(z)\,dz = 1$.
          - text: >
              $2\sqrt{2\pi}$, twice the Gaussian integral
            feedback: >
              Track the parts: $du = dz$ and $v = -e^{-z^{2}/2}$, so the
              remaining integral is one Gaussian integral, not two.
        feedback: >
          $\operatorname{Var}(Z) = 1$, hence
          $\operatorname{Var}(X) = \sigma^{2}\operatorname{Var}(Z) =
          \sigma^{2}$. The labels are honest: $\mu$ is the mean and
          $\sigma^{2}$ the variance.

      - part: The same trick on other integrals
        ask: >
          What is $\int_0^\infty e^{-z^{2}/2}\,dz$?
        expects: "1.2533"
        tolerance: 0.0005
        hint: >
          The integrand is even.
        feedback: >
          Half the full integral: $\sqrt{2\pi}/2 \approx 1.2533$. No
          antiderivative exists; symmetry and the known total do the work.
      - ask: >
          What is $\mathbb{E}\lvert Z \rvert$ for a standard normal $Z$?
        expects: "0.7979"
        tolerance: 0.0005
        hint: >
          $\mathbb{E}\lvert Z \rvert = 2\int_0^\infty z\varphi(z)\,dz$, and
          $ze^{-z^{2}/2}$ has an antiderivative.
        feedback: >
          $\int_0^\infty ze^{-z^{2}/2}\,dz = [-e^{-z^{2}/2}]_0^\infty = 1$,
          so $\mathbb{E}\lvert Z \rvert = 2/\sqrt{2\pi} = \sqrt{2/\pi} \approx
          0.7979$. A normal's average distance from its mean is about $0.8$
          standard deviations.
      - ask: >
          A colleague writes a density as $c\,e^{-(x-a)^{2}/b}$ and reports
          "mean $a$, variance $b$". What is right and what is wrong?
        choices:
          - text: >
              Both are right: the two parameters are the mean and variance
            feedback: >
              The exponent is $-(x-\mu)^{2}/(2\sigma^{2})$, so $b$ is twice
              the variance.
          - text: >
              The mean is $a$; the variance is $b/2$
            correct: true
            feedback: >
              Right. Matching $b = 2\sigma^{2}$ gives $\sigma^{2} = b/2$, and
              then $c = 1/\sqrt{\pi b}$ is forced.
          - text: >
              The mean is $a/2$; the variance is $b$
            feedback: >
              The shift $x - a$ centres the bell at $a$, so the mean is $a$
              by the odd-function argument.
        feedback: >
          In an interview, "why does it integrate to $1$" is answered by
          naming the substitution $z = (x-\mu)/\sigma$ and the Gaussian
          integral $\sqrt{2\pi}$ — and the same substitution shows $\mu$ and
          $\sigma^{2}$ are the mean and variance.

  - node: quant-probability.continuous.standardization
    hook: >
      This single manipulation turns every normal-probability question into
      a $\Phi$ lookup, and it is the exact reflex an interviewer is testing
      when they ask for $\Pr(X>\text{threshold})$.
    explanation: >
      Affine images of a normal stay normal: $aX+b\sim\mathcal{N}(a\mu+b,
      a^{2}\sigma^{2})$, since the exponent $(x-\mu)^{2}/\sigma^{2}$ stays
      quadratic under any affine change of variable, just re-centered and
      re-scaled. In particular $Z=(X-\mu)/\sigma$ subtracts the mean to
      center at $0$ and divides by $\sigma$ to force standard deviation $1$
      — the mental model is "measure distance from the mean in units of
      $\sigma$."

      Once $Z$ is standard, every probability becomes a lookup:
      $\Pr(X\le x)=\Phi((x-\mu)/\sigma)$, and symmetry of $\varphi$ about
      $0$ gives $\Phi(-z)=1-\Phi(z)$, essential when only positive-$z$
      values are memorized.

      This is the single move to reach for the instant a normal probability
      is asked — convert to $\sigma$-units first, resolve everything else
      as arithmetic on $\Phi$.
    worked: >
      Exam scores are $X\sim\mathcal{N}(75,100)$, so $\sigma=10$. For
      $\Pr(X>90)$: $z=(90-75)/10=1.5$, $\Phi(1.5)\approx0.9332$, so
      $\Pr(X>90)\approx0.0668$. For $\Pr(60<X<80)$: $z_1=-1.5$, $z_2=0.5$,
      $\Phi(0.5)\approx0.6915$ and $\Phi(-1.5)=1-0.9332=0.0668$, so
      $\Pr(60<X<80)\approx0.6915-0.0668=0.6247$.
    interview: >
      Any "what fraction of $X$ exceeds/falls between" question is answered
      by standardizing first, always; the interviewer watches for a correct
      $(x-\mu)/\sigma$ conversion and correct use of $\Phi(-z)=1-\Phi(z)$.
    pitfalls: >
      Dividing by $\sigma^{2}$ instead of $\sigma$ when standardizing is the
      single most common slip. Getting the direction of
      $\Phi(-z)=1-\Phi(z)$ backwards under time pressure is the other.
    recap: >
      Standardize to $Z=(X-\mu)/\sigma$ and every normal probability
      collapses to a $\Phi$ lookup — the most-used manipulation in this
      chapter.
    dialogue:
      - part: Two funds, two bells
        teach: >
          Fund A's annual return, in percent, is $\mathcal{N}(8, 4^{2})$.
          Fund B's is $\mathcal{N}(12, 10^{2})$. You want to know which fund
          is likelier to lose money in a year, and the only table you have is
          of $\Phi$, the standard normal CDF.
      - ask: >
          Before any table: which fund is likelier to lose money?
        choices:
          - text: >
              Fund A, because its mean return is lower
            feedback: >
              A lower mean helps, but A is also much tighter: zero is $8/4 = 2$
              of its standard deviations below its mean.
          - text: >
              Fund B: zero sits only $1.2$ of its standard deviations below
              its mean, against $2$ for A
            correct: true
            feedback: >
              Right. B's higher mean is outweighed by its spread: in units of
              its own $\sigma$, a loss is a much smaller step for B.
          - text: >
              They cannot be compared without integrating each density
            feedback: >
              Integrating is possible but unnecessary — and with no closed
              form for $\Phi$ it is not even easy. Both questions can be put
              on one scale.
        feedback: >
          The comparison that decides it is distance from the mean in units of
          standard deviation.
      - reflect: >
          Your table only covers $\mathcal{N}(0,1)$. What transformation of
          fund B's return $X$ turns it into a standard normal, and what does
          the event "return below $0$" become?
        hint: >
          Remove the centre, then the scale.
        answer: >
          $Z = (X - 12)/10$: subtracting $12$ centres it at $0$, dividing by
          $10$ makes its standard deviation $1$, and an affine image of a
          normal is still normal. The map is increasing, so $X < 0$ is the
          same event as $Z < (0 - 12)/10 = -1.2$, with the same probability.
          The question becomes $\Phi(-1.2)$.
      - teach: >
          That is standardization. If $X \sim \mathcal{N}(\mu, \sigma^{2})$
          then $aX + b \sim \mathcal{N}(a\mu + b, a^{2}\sigma^{2})$ for
          $a \ne 0$, and in particular $Z = (X - \mu)/\sigma$ is standard
          normal. So $\Pr(X \le x) = \Phi((x-\mu)/\sigma)$, and by symmetry
          $\Phi(-z) = 1 - \Phi(z)$, which is all you need when the table
          lists only positive $z$.

      - part: Reading the table
        ask: >
          Using $\Phi(1.2) = 0.8849$, what is the probability fund B loses
          money?
        expects: "0.1151"
        tolerance: 0.0005
        hint: >
          $\Phi(-1.2) = 1 - \Phi(1.2)$.
        feedback: >
          $\Pr(X < 0) = \Phi(-1.2) = 1 - 0.8849 = 0.1151$, about one year in
          nine.
      - ask: >
          Using $\Phi(2) = 0.9772$, what is the probability fund A loses
          money?
        expects: "0.0228"
        tolerance: 0.0005
        hint: >
          Standardize $0$ against A's mean and standard deviation.
        feedback: >
          $z = (0 - 8)/4 = -2$, and $\Phi(-2) = 1 - 0.9772 = 0.0228$, about
          one year in forty-four — five times rarer than for B.
      - ask: >
          What is the probability fund B returns between $0\%$ and $32\%$?
          Use $\Phi(2) = 0.9772$ and $\Phi(1.2) = 0.8849$.
        expects: "0.8621"
        tolerance: 0.0005
        hint: >
          Standardize both endpoints, then subtract two values of $\Phi$.
        feedback: >
          The endpoints become $z = -1.2$ and $z = (32 - 12)/10 = 2$, so the
          answer is $\Phi(2) - \Phi(-1.2) = 0.9772 - 0.1151 = 0.8621$.

      - part: Running it backwards
        ask: >
          Fund B beats what return with probability $95\%$? Use
          $\Phi(1.645) = 0.95$.
        expects: "-4.45"
        tolerance: 0.01
        hint: >
          Find the $z$ with $5\%$ below it, then undo the standardization:
          $x = \mu + z\sigma$.
        feedback: >
          The $5\%$ point of $Z$ is $-1.645$, so $x = 12 - 1.645 \times 10 =
          -4.45$. In one year out of twenty, B loses more than $4.45\%$.
      - ask: >
          Which standardizes fund B's threshold of $0$ correctly?
        choices:
          - text: >
              $(0 - 12)/100 = -0.12$
            feedback: >
              That divides by the variance. It would make a loss look like an
              even bet, $\Phi(-0.12) \approx 0.45$. Distances are measured in
              standard deviations.
          - text: >
              $(12 - 0)/10 = 1.2$
            feedback: >
              The sign is flipped: $\Phi(1.2) = 0.885$ is the chance B returns
              *less than* $24\%$. Always compute $(x - \mu)/\sigma$, in that
              order.
          - text: >
              $(0 - 12)/10 = -1.2$
            correct: true
            feedback: >
              Right: subtract the mean, divide by the standard deviation,
              keep the sign.
        feedback: >
          The two classic slips are dividing by $\sigma^{2}$ and losing the
          sign. A negative $z$ means below the mean.
      - ask: >
          A leveraged product pays twice fund B's return minus a $3\%$ fee:
          $Y = 2X - 3$. What is its law?
        choices:
          - text: >
              $\mathcal{N}(21, 200)$
            feedback: >
              The scale factor enters the variance squared: $2^{2} \times 100
              = 400$, not $2 \times 100$.
          - text: >
              $\mathcal{N}(21, 400)$
            correct: true
            feedback: >
              Right: mean $2 \times 12 - 3 = 21$, variance $2^{2} \times 100
              = 400$, standard deviation $20$. The fee shifts the mean and
              leaves the spread alone.
          - text: >
              $\mathcal{N}(24, 397)$
            feedback: >
              The fee shifts the mean, $24 - 3 = 21$, and a constant has no
              effect on the variance at all.
        feedback: >
          In an interview, any normal probability starts the same way: say
          "standardize", write $(x - \mu)/\sigma$ with the sign, and read
          $\Phi$.

  - node: quant-probability.continuous.empirical-rule
    hook: >
      This table is expected cold, with no reference sheet, the instant an
      interviewer says "how many standard deviations away" — hesitating here
      reads as not having internalized standardization at all.
    explanation: >
      The three central landmarks — $68\%$, $95\%$, $99.7\%$ within one,
      two, three $\sigma$ — are just $\Pr(|X-\mu|\le k\sigma)
      =\Pr(|Z|\le k)=2\Phi(k)-1$ evaluated at $\Phi(1),\Phi(2),\Phi(3)$; the
      whole table is one formula plugged in three times.

      The inverted direction — "which $z$ gives this probability" — is the
      second table interviewers actually quiz: two-sided cutoffs $1.645$
      for $90\%$, $1.96$ for $95\%$, $2.576$ for $99\%$; one-tailed,
      $\Pr(Z>1.645)=5\%$, $\Pr(Z>1.96)=2.5\%$, $\Pr(Z>2.33)=1\%$.

      Far into the tail, where no exact number is memorized, use the
      asymptotic $\Pr(Z>z)\approx\varphi(z)/z$ — it overstates the true tail
      probability slightly, a useful estimate rather than an exact value.
    worked: >
      A stock's daily return is modeled as $\mathcal{N}(0,(2\%)^{2})$. A
      $6\%$ move is exactly $3\sigma$, so
      $\Pr(|\text{return}|>6\%)=1-0.9973=0.0027$, about $1$ day in $370$.
      Using the tail approximation for the one-sided version,
      $\Pr(Z>3)\approx\varphi(3)/3$: $\varphi(3)=e^{-4.5}/\sqrt{2\pi}
      \approx0.00443$, giving $\Pr(Z>3)\approx0.00148$, close to but above
      the true one-tailed value $0.00135$.
    interview: >
      "How many sigma is a $1$-in-$1000$ event" or "probability of a move
      beyond two standard deviations" are answered straight from this
      table with zero computation — recall speed is the whole test.
    pitfalls: >
      Confusing the two-sided $95\%$ cutoff ($1.96$) with the one-tailed
      $95\%$ cutoff ($1.645$) is the most common mix-up. Using the
      asymptotic tail approximation where an exact landmark value is
      already memorized wastes the more accurate number you already have.
    recap: >
      $68\%/95\%/99.7\%$ within one/two/three sigma, with $1.96$ the
      two-sided $95\%$ cutoff and $1.645$ the one-tailed version —
      memorized, not derived, under time pressure.
    dialogue:
      - part: Days inside the band
        teach: >
          A data centre's daily power draw is modelled as
          $\mathcal{N}(800, 25^{2})$ megawatt-hours. An engineer flags any day
          whose draw falls outside the band from $750$ to $850$.
      - ask: >
          Using $\Phi(2) = 0.97725$, what fraction of days fall inside the
          band?
        expects: "0.9545"
        tolerance: 0.0005
        hint: >
          Standardize both ends of the band.
        feedback: >
          The band is $z$ from $-2$ to $2$, so the fraction is
          $\Phi(2) - \Phi(-2) = 2\Phi(2) - 1 = 0.9545$.
      - reflect: >
          You turned a two-sided question into a single value of $\Phi$.
          Write the general recipe for $\Pr(\lvert X - \mu \rvert \le
          k\sigma)$, and say why the answer does not depend on $\mu$ or
          $\sigma$ at all.
        hint: >
          Standardize, then use $\Phi(-k) = 1 - \Phi(k)$.
        answer: >
          Standardizing turns the event into $\lvert Z \rvert \le k$, whose
          probability is $\Phi(k) - \Phi(-k) = 2\Phi(k) - 1$. The mean and
          standard deviation disappear in the standardization, so every
          normal puts the same mass within $k$ standard deviations of its
          mean. A handful of numbers, learned once, covers every normal there
          is.
      - teach: >
          Those numbers are the $68$–$95$–$99.7$ rule:
          $\Pr(\lvert X - \mu \rvert \le \sigma) = 0.6827$, $0.9545$ within
          $2\sigma$, $0.9973$ within $3\sigma$. Run backwards, the two-sided
          cutoffs are $1.645$ for $90\%$, $1.96$ for $95\%$ and $2.576$ for
          $99\%$: the central interval $\mu \pm 1.96\sigma$ holds exactly
          $95\%$ of the mass.

      - part: Reading the table both ways
        ask: >
          How many days a year (out of $365$) should the engineer expect to
          flag?
        expects: "16.6"
        tolerance: 0.1
        hint: >
          The flagged fraction is what lies outside two standard deviations.
        feedback: >
          $365 \times (1 - 0.9545) = 365 \times 0.0455 \approx 16.6$ days —
          more than one a month, from a model working perfectly.
      - ask: >
          The engineer widens the band to the central $95\%$. What is its
          upper end, in megawatt-hours?
        expects: "849"
        hint: >
          Central $95\%$ is the two-sided cutoff.
        feedback: >
          $800 + 1.96 \times 25 = 800 + 49 = 849$. The $2\sigma$ band held
          $95.45\%$; the exact $95\%$ band is a hair narrower, at
          $1.96\sigma$.
      - ask: >
          On what fraction of days does the draw exceed $849$?
        choices:
          - text: >
              $5\%$
            feedback: >
              $5\%$ lies outside the band in total, split between the two
              tails. The top tail alone is half of it.
          - text: >
              $2.5\%$
            correct: true
            feedback: >
              Right: $1.96$ is the two-sided $95\%$ cutoff and the one-tailed
              $2.5\%$ cutoff, the same number read two ways.
          - text: >
              $1\%$
            feedback: >
              $1\%$ in the top tail needs $z = 2.33$, which would be
              $800 + 2.33 \times 25 \approx 858$.
        feedback: >
          Two-sided versus one-tailed is the commonest mix-up here: $1.96$
          leaves $2.5\%$ in each tail, while $1.645$ leaves $5\%$ in one tail.

      - part: Far out, and off the bell
        ask: >
          Far beyond the table, $\Pr(Z > z) \approx \varphi(z)/z$. At
          $z = 3.5$, a draw above $887.5$, $\varphi(3.5) \approx 0.000873$.
          Estimate how many such days to expect in 10,000 days.
        expects: "2.49"
        tolerance: 0.02
        hint: >
          Estimate the tail probability first, then multiply.
        feedback: >
          $\varphi(3.5)/3.5 \approx 0.000873/3.5 \approx 0.000249$, so about
          $10000 \times 0.000249 \approx 2.49$ days.
      - ask: >
          The exact one-tailed probability at $3.5$ is $0.000233$. How does the
          approximation $\varphi(z)/z$ behave?
        choices:
          - text: >
              It overstates the tail slightly, and the error shrinks as $z$
              grows
            correct: true
            feedback: >
              Right: $0.000249$ against $0.000233$, about $7\%$ high here; at
              $z = 4$ the gap is about $6\%$. It is an upper estimate, good for
              orders of magnitude.
          - text: >
              It understates the tail
            feedback: >
              $0.000249 > 0.000233$: it overstates. That is the safer
              direction for a risk estimate.
          - text: >
              It is exact for $z > 3$
            feedback: >
              It is only asymptotic: the relative error behaves like
              $1/z^{2}$, small far out but never zero.
        feedback: >
          Use the table where it has an entry and $\varphi(z)/z$ beyond it.
      - ask: >
          These landmarks are facts about the normal. A wait that is
          exponential with mean $1$ minute also has standard deviation $1$.
          What fraction of such waits fall within one standard deviation of
          the mean?
        expects: "0.8647"
        tolerance: 0.0005
        hint: >
          The wait is never negative, so within one standard deviation of $1$
          means at most $2$.
        feedback: >
          $\Pr(X \le 2) = 1 - e^{-2} \approx 0.8647$, not $0.68$. The
          $68$–$95$–$99.7$ table belongs to the bell; quote it for a normal
          and only for a normal. In an interview, "how often is a $2\sigma$
          move" is $4.6\%$ two-sided, $2.3\%$ one-sided, without a pause.

  - node: quant-probability.continuous.normal-sums
    hook: >
      A portfolio's total return or a sample mean only stays tractable in
      closed form because independent normals add to a normal — lose
      independence and that closure vanishes entirely.
    explanation: >
      For independent $X\sim\mathcal{N}(\mu_1,\sigma_1^{2})$ and
      $Y\sim\mathcal{N}(\mu_2,\sigma_2^{2})$, $aX+bY\sim\mathcal{N}(a\mu_1
      +b\mu_2,\;a^{2}\sigma_1^{2}+b^{2}\sigma_2^{2})$. Separate what's
      genuinely new here: means always add, by linearity alone, needing no
      independence at all. Variances add only because
      $\operatorname{Var}(aX+bY)=a^{2}\operatorname{Var}(X)
      +b^{2}\operatorname{Var}(Y)+2ab\operatorname{Cov}(X,Y)$, and
      independence is exactly what kills the cross term. Staying normal —
      closure — is the one fact that needs the convolution (or
      moment-generating-function) argument, not derivable from moments
      alone.

      Independence is a real hypothesis, not decoration: $Z+SZ$ with
      $S=\pm1$ a fair independent sign equals $0$ half the time, a point
      mass no normal has, even though $Z$ and $SZ$ are each individually
      normal.

      One clean consequence: the average of $n$ iid
      $\mathcal{N}(\mu,\sigma^{2})$ draws is exactly
      $\mathcal{N}(\mu,\sigma^{2}/n)$ for every $n$ — a stronger, exact
      statement than the Central Limit Theorem's guarantee for non-normal
      data.
    worked: >
      Let $X\sim\mathcal{N}(20,9)$ and $Y\sim\mathcal{N}(30,16)$,
      independent. For $R=2X-Y$: mean $=2(20)-30=10$, variance
      $=4(9)+1(16)=52$, so $\sigma_R=\sqrt{52}\approx7.21$. Then
      $\Pr(R>20)$: $z=(20-10)/7.21\approx1.39$, $\Phi(1.39)\approx0.918$, so
      $\Pr(R>20)\approx0.082$.
    interview: >
      "Sum or difference of two independent normal quantities" wants means
      added and variances added — never subtracted, even for a
      difference — plus the closure fact, ideally with the independence
      caveat volunteered.
    pitfalls: >
      Subtracting variances for a difference $X-Y$ instead of adding them
      is the classic sign error; the minus sign never reaches the variance
      term. Assuming any two normal-looking variables sum to a normal even
      when dependence is unstated skips the one genuine hypothesis this
      result needs.
    recap: >
      Independent normals add to a normal with summed means and summed
      variances, so a normal sample mean is exactly $\mathcal{N}(\mu,
      \sigma^{2}/n)$ with no limit theorem required.
    dialogue:
      - part: A commute in two legs
        teach: >
          Your commute is a bus ride $B \sim \mathcal{N}(25, 9)$ minutes
          followed by a train ride $T \sim \mathcal{N}(40, 16)$ minutes, the
          two independent. You have $75$ minutes to get to work.
      - ask: >
          What is the expected total commute, in minutes?
        expects: "65"
        hint: >
          Means add.
        feedback: >
          $25 + 40 = 65$ minutes. Means add by linearity alone, independent or
          not.
      - ask: >
          What is the standard deviation of the total commute?
        choices:
          - text: >
              $7$ minutes, adding the standard deviations $3$ and $4$
            feedback: >
              Standard deviations do not add for independent pieces; that
              would only hold if the legs moved in lockstep. Variances add.
          - text: >
              $5$ minutes
            correct: true
            feedback: >
              Right: variances add for independent legs, $9 + 16 = 25$, and
              $\sqrt{25} = 5$.
          - text: >
              $25$ minutes
            feedback: >
              $25$ is the variance of the total. Its standard deviation is
              the square root, $5$.
        feedback: >
          $\operatorname{Var}(B + T) = \operatorname{Var}(B) +
          \operatorname{Var}(T)$ because independence kills the covariance
          term. Notice the $3$–$4$–$5$: spreads combine like the sides of a
          right triangle.
      - reflect: >
          You now have the mean and variance of the total from rules that hold
          for *any* independent pieces. What further fact do you need before
          you can read the chance of making it in $75$ minutes off a $\Phi$
          table — and what in the setup could break it?
        hint: >
          A mean and a variance do not determine a law.
        answer: >
          You need the total itself to be normal; only then is
          $\Pr(B + T < 75)$ a value of $\Phi$. Means and variances add for
          any independent variables, but staying inside the normal family is
          a separate fact about normals, proved by convolving the densities.
          It needs both legs to be normal and independent; drop either and
          the total can be some other shape with the same mean and variance.
      - teach: >
          That fact holds: if $X \sim \mathcal{N}(\mu_1, \sigma_1^{2})$ and
          $Y \sim \mathcal{N}(\mu_2, \sigma_2^{2})$ are independent, then
          $aX + bY \sim \mathcal{N}(a\mu_1 + b\mu_2,\; a^{2}\sigma_1^{2} +
          b^{2}\sigma_2^{2})$. Means add, variances add with squared
          coefficients, and the result is normal.
      - ask: >
          Using $\Phi(2) = 0.9772$, what is the probability you make it in
          $75$ minutes?
        expects: "0.9772"
        tolerance: 0.0005
        hint: >
          Standardize $75$ against the total's mean and standard deviation.
        feedback: >
          $B + T \sim \mathcal{N}(65, 25)$, so $z = (75 - 65)/5 = 2$ and the
          probability is $\Phi(2) = 0.9772$. You are late about one day in
          forty-four.

      - part: Differences, multiples and averages
        ask: >
          What is the variance of $T - B$, how much longer the train leg
          runs than the bus leg?
        expects: "25"
        hint: >
          The coefficient of $B$ is $-1$, and it enters squared.
        feedback: >
          $(1)^{2}(16) + (-1)^{2}(9) = 25$, the same as for the sum. The
          answer $16 - 9 = 7$ subtracts variances, but a difference is just as
          uncertain as a sum: either leg's surprise moves it.
      - ask: >
          Over $4$ independent days, what is the variance of your *average*
          commute?
        expects: "6.25"
        hint: >
          The sum of four independent totals has four times the variance;
          then divide by $4$, which enters squared.
        feedback: >
          $\operatorname{Var}(\bar{C}) = 4 \times 25/4^{2} = 25/4 = 6.25$, a
          standard deviation of $2.5$ minutes. The average of $n$ iid
          $\mathcal{N}(\mu, \sigma^{2})$ draws is exactly
          $\mathcal{N}(\mu, \sigma^{2}/n)$ — no approximation, for every $n$.
      - ask: >
          On a day trip you ride the same bus out and back. If both rides take
          exactly the same time, the round trip is $2B$. What is
          $\operatorname{Var}(2B)$?
        expects: "36"
        hint: >
          A constant multiple enters the variance squared.
        feedback: >
          $2^{2} \times 9 = 36$. Two *independent* rides $B_1 + B_2$ would
          have variance only $9 + 9 = 18$: independent pieces partly cancel
          each other's surprises, identical ones never do.

      - part: When the sum is not normal
        teach: >
          Let $Z$ be standard normal and $S$ an independent fair sign, $+1$ or
          $-1$. Then $SZ$ is also standard normal, since flipping a symmetric
          law changes nothing. Consider $W = Z + SZ$, a sum of two standard
          normals.
      - ask: >
          What is $\Pr(W = 0)$?
        expects: "1/2"
        hint: >
          What happens when $S = -1$?
        feedback: >
          When $S = -1$, $W = Z - Z = 0$, which happens with probability
          $1/2$. No normal puts positive probability on a single point, so $W$
          is not normal.
      - ask: >
          Which hypothesis of the theorem failed?
        choices:
          - text: >
              $SZ$ is not really normal
            feedback: >
              It is: $\Pr(SZ \le x) = \frac{1}{2}\Phi(x) + \frac{1}{2}(1 -
              \Phi(-x)) = \Phi(x)$. Each piece is a perfectly good standard
              normal.
          - text: >
              $Z$ and $SZ$ are not independent
            correct: true
            feedback: >
              Right. Knowing $Z$ pins $SZ$ down to $\pm Z$. They are even
              uncorrelated, $\mathbb{E}[Z \cdot SZ] = \mathbb{E}[S] = 0$, so
              the variance still adds to $2$ — but the shape is not normal.
          - text: >
              The means do not add
            feedback: >
              Both means are $0$ and $W$ has mean $0$. Means always add; the
              trouble is the shape.
        feedback: >
          Normal pieces are not enough; the theorem needs them independent.
          In an interview, for a sum or difference of independent normals say
          "means add, variances add — never subtract — and it stays normal",
          and volunteer the independence condition.

  - node: quant-probability.continuous.lognormal
    hook: >
      Whenever a quantity compounds multiplicatively — prices, portfolio
      value over many periods — its logarithm is modeled as normal, and the
      interview test is knowing the mean sits strictly above the median.
    explanation: >
      $Y=e^{X}$ for $X\sim\mathcal{N}(\mu,\sigma^{2})$ lives on
      $(0,\infty)$, matching quantities that can never go negative.
      Computing $\mathbb{E}[Y]=\int e^{x}f(x)\,dx$ means completing the
      square inside the normal's exponent: combining the $+x$ from $e^{x}$
      with the quadratic term shifts the center by $\sigma^{2}$ and peels
      off a multiplicative factor $e^{\mu+\sigma^{2}/2}$, after which the
      remaining integral collapses back to $1$ by the normalization already
      established — that factor is the entire mean.

      The median is $e^{\mu}$ directly, since exponentiation is monotonic
      and so commutes with quantiles, even though it does not commute with
      expectation. The gap between mean and median is exactly
      $e^{\sigma^{2}/2}$, driven purely by variance — the same convexity
      idea as Jensen's inequality, since $e^{x}$ is convex, so
      $\mathbb{E}[e^{X}]>e^{\mathbb{E}[X]}$ strictly whenever $X$ has any
      spread at all.

      Independent lognormals multiply to a lognormal because their logs
      add, and sums of independent normals stay normal — which is why
      compounding returns, where log-returns add across periods, is the
      natural home for this law rather than the normal itself.
    worked: >
      Let $X\sim\mathcal{N}(0.05,0.04)$ model a year's log-return
      ($\sigma=0.2$). The median growth multiplier is $e^{0.05}
      \approx1.0513$ ($5.13\%$), while the mean is
      $e^{0.05+0.02}=e^{0.07}\approx1.0725$ ($7.25\%$) — the mean overstates
      typical growth by about $2.1$ percentage points, purely from the
      variance term.
    interview: >
      "Why is quoted average return misleading for a compounding asset" is
      testing $\mathbb{E}[Y]=e^{\mu+\sigma^{2}/2}>e^{\mu}=\text{median}$;
      the strong answer cites convexity, not just the formula.
    pitfalls: >
      Reporting $e^{\mu}$ as "the mean price" when it is the median is a
      common and consequential mix-up in return reporting. Assuming a sum
      of lognormals is lognormal is false — only products are, since it's
      the underlying normal logs that add.
    recap: >
      A lognormal is $e^{X}$ for normal $X$, with mean
      $e^{\mu+\sigma^{2}/2}$ strictly above the median $e^{\mu}$ by
      convexity — the standard model wherever quantities compound
      multiplicatively.
    dialogue:
      - part: A price with a symmetric log
        teach: >
          A stock trades at $100$. Its log-return over the next year,
          $X = \ln(S/100)$, is $\mathcal{N}(0, 0.5^{2})$ — as likely to be
          $-0.3$ as $+0.3$. The price in a year is $S = 100e^{X}$.
      - ask: >
          What is the probability that the price in a year is above $100$?
        expects: "1/2"
        hint: >
          $S > 100$ exactly when $X > 0$.
        feedback: >
          $S > 100$ if and only if $X > 0$, which has probability $1/2$. So the
          median price is $100$: exponentiating preserves order, so it carries
          the median of $X$ to the median of $S$.
      - ask: >
          A toy version first. Suppose the log-return is exactly $+0.5$ or
          $-0.5$, each with probability $1/2$. What is the expected price?
        expects: "112.76"
        tolerance: 0.01
        hint: >
          Average $100e^{0.5}$ and $100e^{-0.5}$.
        feedback: >
          $(164.87 + 60.65)/2 = 112.76$. The log-return averages $0$, but the
          up-move gains $64.87$ while the down-move loses only $39.35$.
      - ask: >
          Back to the normal log-return. Is the expected price $100$?
        choices:
          - text: >
              Yes: the log-return averages $0$, so the price averages
              $100e^{0}$
            feedback: >
              $\mathbb{E}[e^{X}] \ne e^{\mathbb{E}[X]}$. The toy showed why:
              $e^{x}$ bends upward, so gains outweigh equal-sized losses.
          - text: >
              No: it is above $100$
            correct: true
            feedback: >
              Right. Every pair of log-returns $\pm x$ averages to
              $100\cosh x > 100$ in price, so the mean is pulled above the
              median.
          - text: >
              No: it is below $100$, because prices cannot go negative
            feedback: >
              The floor at $0$ limits the losses, which pushes the mean *up*,
              not down. The gains are unbounded.
        feedback: >
          The median price is $100$; the mean is higher. How much higher
          depends only on the spread of $X$.
      - reflect: >
          To get $\mathbb{E}[S]$ exactly you would integrate $e^{x}$ against
          the normal density. What algebraic move turns
          $\int e^{x}e^{-x^{2}/(2\sigma^{2})}\,dx$ into an integral you
          already know?
        hint: >
          Combine the two exponents into one quadratic.
        answer: >
          Complete the square: $x - x^{2}/(2\sigma^{2}) =
          -(x - \sigma^{2})^{2}/(2\sigma^{2}) + \sigma^{2}/2$. The first part
          is a normal density shifted to centre $\sigma^{2}$, which integrates
          to the same value as before; the second is a constant that comes
          outside. So $\mathbb{E}[e^{X}] = e^{\sigma^{2}/2}$ when $\mu = 0$,
          and $e^{\mu + \sigma^{2}/2}$ in general.
      - teach: >
          That is the lognormal law. $Y = e^{X}$ with
          $X \sim \mathcal{N}(\mu, \sigma^{2})$ lives on $(0, \infty)$, with
          median $e^{\mu}$ and mean $e^{\mu + \sigma^{2}/2}$ — the mean exceeds
          the median by the factor $e^{\sigma^{2}/2}$. Its density is the
          normal's with $\ln y$ in place of $x$ and an extra factor $1/y$:
          $\frac{1}{y\sigma\sqrt{2\pi}}\exp(-(\ln y - \mu)^{2}/(2\sigma^{2}))$.

      - part: Mean, median, and the gap
        ask: >
          What is the expected price in a year?
        expects: "113.31"
        tolerance: 0.01
        hint: >
          $\mu = 0$ and $\sigma^{2}/2 = 0.125$.
        feedback: >
          $100e^{0.125} \approx 113.31$, against a median of $100$. The toy
          two-point model gave $112.76$, close but not equal: the normal's
          spread is not concentrated at $\pm 0.5$.
      - ask: >
          What is the probability the price ends above its own mean, $113.31$?
          Use $\Phi(0.25) = 0.5987$.
        expects: "0.4013"
        tolerance: 0.0005
        hint: >
          Translate to the log-return: $\ln(1.1331) = 0.125$.
        feedback: >
          $S > 113.31$ means $X > 0.125$, that is $Z > 0.125/0.5 = 0.25$,
          with probability $1 - 0.5987 = 0.4013$. The mean is beaten less than
          half the time; a few large outcomes hold it up.

      - part: Products, not sums
        ask: >
          Over two years, with independent $\mathcal{N}(0, 0.25)$ log-returns
          each year, what is the expected price?
        expects: "128.40"
        tolerance: 0.01
        hint: >
          The two-year log-return is a sum of independent normals.
        feedback: >
          $S_2 = 100e^{X_1 + X_2}$ with $X_1 + X_2 \sim \mathcal{N}(0, 0.5)$,
          so $\mathbb{E}[S_2] = 100e^{0.25} \approx 128.40$ — the same as
          $113.31 \times 1.1331$. Log-returns add, so growth factors multiply
          and stay lognormal.
      - ask: >
          You hold one share each of two independent stocks, each priced
          lognormally. Is the value of your holding lognormal?
        choices:
          - text: >
              Yes, because each price is
            feedback: >
              A sum of lognormals is not lognormal: $\ln(e^{X_1} + e^{X_2})$
              is not normal. Only the product $e^{X_1}e^{X_2}$ is.
          - text: >
              Yes, provided the stocks are independent
            feedback: >
              Independence makes *products* lognormal, because their logs add
              to a normal. A sum of prices has no such log.
          - text: >
              No: products of lognormals are lognormal, sums are not
            correct: true
            feedback: >
              Right. Compounding one asset over time is a product, and stays
              lognormal; adding positions in different assets is a sum, and
              does not.
        feedback: >
          In an interview, say "the median is $e^{\mu}$, the mean is
          $e^{\mu + \sigma^{2}/2}$, and the gap is convexity" — reporting the
          median as the expected price is the mistake being tested.

  - node: quant-probability.continuous.chi-square
    hook: >
      This is the law behind every sample-variance and variance-test
      formula, and the fact worth having cold is that squared distance from
      the origin under a standard bivariate normal is exactly exponential.
    explanation: >
      $Q=Z_1^{2}+\dots+Z_k^{2}$ for iid standard normal $Z_i$ needs no new
      machinery: each squared normal individually turns out to have a
      $\operatorname{Gamma}(1/2,1/2)$ shape, and independent Gammas at a
      common rate add shapes, so summing $k$ of them gives directly
      $\operatorname{Gamma}(k/2,1/2)$.

      Moments follow the same way. Since $\mathbb{E}[Z^{2}]=1$ (that's just
      $\operatorname{Var}(Z)$) and $\mathbb{E}[Z^{4}]=3$,
      $\operatorname{Var}(Z^{2})=3-1=2$: each squared term contributes mean
      $1$, variance $2$, and additivity across the $k$ independent terms
      gives $\mathbb{E}[Q]=k$, $\operatorname{Var}(Q)=2k$ directly.

      The $k=2$ case is worth carrying on its own: $\chi^{2}_2
      =\operatorname{Gamma}(1,1/2)=\operatorname{Exp}(1/2)$ exactly — so if
      $(Z_1,Z_2)$ is a standard bivariate normal, the squared Euclidean
      distance from the origin, $Z_1^{2}+Z_2^{2}$, is genuinely
      memoryless, a fact with no obvious reason to be true until you see
      the Gamma-additivity argument.
    worked: >
      For $k=4$: $\mathbb{E}[Q]=4$, $\operatorname{Var}(Q)=8$, so
      $\sigma_Q=\sqrt{8}\approx2.828$. As a cross-check, $\chi^{2}_4
      =\operatorname{Gamma}(2,1/2)$ is the sum of two independent
      $\chi^{2}_2$'s, each $\operatorname{Exp}(1/2)$ with mean $2$, and
      $2+2=4$ matches $\mathbb{E}[Q]$ exactly.
    interview: >
      "Distribution of a sum of squared normals" wants
      $\operatorname{Gamma}(k/2,1/2)$ named with mean $k$; volunteering the
      $k=2\Rightarrow$ exponential fact is what separates fluency from
      recall.
    pitfalls: >
      Forgetting the $Z_i$ must be standardized first — squaring
      non-standard normals breaks the mean-$k$ correspondence entirely.
      Misremembering $\mathbb{E}[Z^{4}]=1$ instead of $3$ silently corrupts
      the variance calculation.
    recap: >
      A sum of $k$ squared standard normals is $\operatorname{Gamma}(k/2,
      1/2)$ with mean $k$ and variance $2k$, collapsing at $k=2$ to exactly
      $\operatorname{Exp}(1/2)$.
    dialogue:
      - part: A drone off its mark
        teach: >
          A drone hovering at a target point drifts by independent
          $\mathcal{N}(0,1)$ errors, in metres, east, north and up:
          $Z_1, Z_2, Z_3$. Its squared distance from the target is
          $Q = Z_1^{2} + Z_2^{2} + Z_3^{2}$.
      - ask: >
          What is $\mathbb{E}[Q]$, in square metres?
        expects: "3"
        hint: >
          What is $\mathbb{E}[Z^{2}]$ for a standard normal?
        feedback: >
          $\mathbb{E}[Z^{2}] = \operatorname{Var}(Z) = 1$, so by linearity
          $\mathbb{E}[Q] = 3$: one unit per axis.
      - ask: >
          What is $\mathbb{E}[Z^{4}]$ for a standard normal $Z$?
        expects: "3"
        hint: >
          The even moments of the Gaussian density are $(2k-1)!!$.
        feedback: >
          $\mathbb{E}[Z^{4}] = 3!! = 3 \times 1 = 3$. Misremembering it as $1$
          would make $Z^{2}$ look constant.
      - ask: >
          What is $\operatorname{Var}(Q)$?
        expects: "6"
        hint: >
          First find $\operatorname{Var}(Z^{2})$, then use independence.
        feedback: >
          $\operatorname{Var}(Z^{2}) = \mathbb{E}[Z^{4}] - (\mathbb{E}[Z^{2}])^{2}
          = 3 - 1 = 2$, and the three terms are independent, so
          $\operatorname{Var}(Q) = 3 \times 2 = 6$.
      - ask: >
          Is $Q$ normal?
        choices:
          - text: >
              Yes: it is a sum of independent pieces built from normals
            feedback: >
              Squares of normals are not normal, so sums of normals do not
              apply. $Q$ can never be negative, and no normal is.
          - text: >
              No: $Q \ge 0$ and it is skewed to the right
            correct: true
            feedback: >
              Right. Mean $3$, standard deviation $\sqrt{6} \approx 2.45$, and
              a floor at $0$ only $1.2$ standard deviations below the mean —
              the long side is on the right.
          - text: >
              No: it is uniform on $(0, 6)$
            feedback: >
              Mean $3$ fits, but large misses have no upper limit, and small
              squared distances are far more common than large ones.
        feedback: >
          $Q$ needs a law of its own, living on $(0, \infty)$.
      - reflect: >
          Start with one term. Find the law of $Z^{2}$ from
          $\Pr(Z^{2} \le x) = \Pr(-\sqrt{x} \le Z \le \sqrt{x})$, and say which
          family of waiting-time laws its density belongs to.
        hint: >
          Differentiate $2\Phi(\sqrt{x}) - 1$, and compare with a density of
          the form $c\,x^{\alpha - 1}e^{-\lambda x}$.
        answer: >
          $\Pr(Z^{2} \le x) = 2\Phi(\sqrt{x}) - 1$, whose derivative is
          $\varphi(\sqrt{x})/\sqrt{x} = x^{-1/2}e^{-x/2}/\sqrt{2\pi}$. That is
          a Gamma density with shape $1/2$ and rate $1/2$ (the constant checks,
          since $\Gamma(1/2) = \sqrt{\pi}$). Gammas at a common rate add their
          shapes, so a sum of $k$ independent squares is
          $\operatorname{Gamma}(k/2, 1/2)$.
      - teach: >
          That is the chi-square law. If $Z_1, \dots, Z_k$ are iid standard
          normal, $Q = Z_1^{2} + \dots + Z_k^{2}$ has the chi-square law with
          $k$ degrees of freedom, $\chi^{2}_{k}$, which is
          $\operatorname{Gamma}(k/2, 1/2)$: mean $k$, variance $2k$. The drone's
          $Q$ is $\chi^{2}_{3}$.

      - part: In the plane it is exponential
        ask: >
          Ignore altitude: the horizontal squared miss $Z_1^{2} + Z_2^{2}$ is
          $\chi^{2}_{2} = \operatorname{Gamma}(1, 1/2)$. Which familiar law is
          that?
        choices:
          - text: >
              $\operatorname{Exp}(1/2)$, with mean $2$
            correct: true
            feedback: >
              Right. A Gamma with shape $1$ is a single exponential, here at
              rate $1/2$, so its mean is $2 = k$.
          - text: >
              $\operatorname{Exp}(2)$, with mean $1/2$
            feedback: >
              That reads the $1/2$ as a mean. It is the rate; the mean is
              $1/(1/2) = 2$, matching $\mathbb{E}[Z_1^{2} + Z_2^{2}] = 2$.
          - text: >
              $U(0, 4)$
            feedback: >
              The mean is $2$ either way, but the squared miss has no upper
              limit and its density is tallest at $0$.
        feedback: >
          $\chi^{2}_{2}$ is exactly exponential: the squared distance of a
          standard bivariate normal point from the origin is memoryless.
      - ask: >
          Half the time, the horizontal squared miss is below what value, in
          square metres?
        expects: "1.3863"
        tolerance: 0.0005
        hint: >
          Solve $e^{-t/2} = 1/2$.
        feedback: >
          The median of $\operatorname{Exp}(1/2)$ is $2\ln 2 \approx 1.3863$,
          below the mean of $2$, as always for an exponential.

      - part: Where the count of k breaks
        ask: >
          A cheaper drone drifts by $\mathcal{N}(0, 4)$ errors on each of the
          three axes. Is its squared distance $\chi^{2}_{3}$, with mean $3$?
        choices:
          - text: >
              Yes: three squared normals make $\chi^{2}_{3}$
            feedback: >
              $\chi^{2}_{k}$ is a sum of squared *standard* normals. Each term
              here has mean $4$, so the sum has mean $12$.
          - text: >
              No: it is $4$ times a $\chi^{2}_{3}$, with mean $12$
            correct: true
            feedback: >
              Right. Each error is $2Z_i$, so the squared distance is
              $4(Z_1^{2} + Z_2^{2} + Z_3^{2})$. Divide by $\sigma^{2}$ first,
              then name the law.
          - text: >
              Yes, but with $12$ degrees of freedom
            feedback: >
              Degrees of freedom count the squared terms, which is still $3$.
              The scale goes outside, not into $k$.
        feedback: >
          Standardize before squaring, or carry $\sigma^{2}$ as a factor.
      - ask: >
          A faulty sensor reports the same error on all three axes:
          $Z_1 = Z_2 = Z_3 = Z$, so $Q = 3Z^{2}$. Its mean is still $3$. What
          is its variance?
        expects: "18"
        hint: >
          $\operatorname{Var}(cY) = c^{2}\operatorname{Var}(Y)$, and
          $\operatorname{Var}(Z^{2}) = 2$.
        feedback: >
          $3^{2} \times 2 = 18$, three times the $6$ of $\chi^{2}_{3}$. The
          mean only needs linearity, but the variance $2k$ needs independent
          terms. In an interview, "a sum of $k$ squared standard normals" is
          $\operatorname{Gamma}(k/2, 1/2)$, mean $k$, variance $2k$ — and at
          $k = 2$, an exponential with mean $2$.

  - node: quant-probability.continuous.cauchy
    hook: >
      This is the standard counterexample for whether you actually
      understand what "the mean exists" requires, rather than assuming
      every symmetric distribution automatically has one.
    explanation: >
      The density $1/(\pi(1+x^{2}))$ is symmetric about $0$ with quartiles
      $\pm1$, so $\Pr(|X|>1)=1/2$ — half the mass sits beyond distance $1$
      from center, a far more spread-out picture than the normal's tails.
      Two constructions produce it directly: the ratio $Z_1/Z_2$ of
      independent standard normals is Cauchy, and $\tan\Theta$ for $\Theta$
      uniform on $(-\pi/2,\pi/2)$ is Cauchy — a spinning pointer's crossing
      point on a distant wall, where angles near $\pm\pi/2$ map to enormous
      distances, is literally why the tails are so heavy.

      Since $|x|f(x)\sim1/(\pi|x|)$ for large $|x|$, $\int|x|f(x)\,dx$
      diverges logarithmically, so $\mathbb{E}|X|=\infty$: both tails
      separately fail, the same two-sided nonexistence pattern from
      general moment theory, so the mean is undefined, not just infinite.
      The median $0$ stays perfectly well-defined regardless, since it only
      needs the CDF, not any moment, to converge.

      The consequence for estimation is severe: averaging $n$ iid Cauchy
      draws produces another standard Cauchy exactly, not approximately, so
      the law of large numbers — which needs a finite mean to converge
      to — fails outright, and more samples buy zero extra precision.
    worked: >
      A lighthouse beam spins to a uniformly random angle
      $\Theta\sim U(-\pi/2,\pi/2)$ and hits a wall $1$ km away at
      $X=\tan\Theta$. The event $|X|\le1$ is equivalent to $|\Theta|\le
      \pi/4$, an interval of length $\pi/2$ inside the total range $\pi$, so
      $\Pr(|X|\le1)=(\pi/2)/\pi=1/2$ — matching the quartiles-at-$\pm1$ fact
      through a purely geometric computation, no calculus required.
    interview: >
      "Does this ratio of normals (or this symmetric law) have a mean" is
      testing whether you'll say "no, it doesn't exist" with confidence,
      rather than the classic wrong answer "$0$, by symmetry."
    pitfalls: >
      Answering "mean is $0$ by symmetry" skips the existence check —
      symmetry only pins down the mean once you've confirmed it exists,
      and here it provably doesn't. Assuming Gaussian intuition still
      applies (more samples average out noise) fails completely for a
      Cauchy-distributed quantity.
    recap: >
      The Cauchy — a ratio of independent normals, or $\tan$ of a uniform
      angle — has tails so heavy its mean doesn't exist, and averaging more
      samples never converges to anything.
    dialogue:
      - part: A laser on a turntable
        teach: >
          A laser pointer sits on a turntable $1$ metre from a long, straight
          wall. The turntable stops at an angle $\Theta$ from the
          perpendicular, uniform on $(-\pi/2, \pi/2)$, and the dot lands at
          position $X = \tan\Theta$ along the wall, measured from the point
          straight ahead.
      - ask: >
          What is the probability the dot lands more than $\sqrt{3} \approx
          1.73$ metres from the centre?
        expects: "1/3"
        hint: >
          $\tan(\pi/3) = \sqrt{3}$. Turn the question into one about the
          angle.
        feedback: >
          $\lvert X \rvert > \sqrt{3}$ exactly when $\lvert \Theta \rvert >
          \pi/3$, two stretches of angle of total length $\pi/3$ out of $\pi$:
          probability $1/3$. A uniform angle makes this a length ratio.
      - ask: >
          Which is the CDF of $X$, $\Pr(X \le x)$?
        choices:
          - text: >
              $1/2 + \arctan(x)/\pi$
            correct: true
            feedback: >
              Right: $X \le x$ exactly when $\Theta \le \arctan x$, which has
              probability $(\arctan x + \pi/2)/\pi$.
          - text: >
              $\arctan(x)/\pi$
            feedback: >
              That forgets the half of the angles below $0$: at $x = 0$ it
              gives $0$, but half the dots land left of centre.
          - text: >
              $1/2 + \tan(x)/\pi$
            feedback: >
              The angle is uniform, so the CDF needs the angle that reaches
              $x$, which is $\arctan x$, not $\tan x$.
        feedback: >
          Differentiating gives the density $1/(\pi(1 + x^{2}))$, symmetric
          about $0$.
      - ask: >
          What is the density of $X$ at $0$?
        expects: "0.3183"
        tolerance: 0.0005
        hint: >
          Evaluate $1/(\pi(1 + x^{2}))$ at $x = 0$.
        feedback: >
          $1/\pi \approx 0.3183$, lower than the standard normal's peak
          $\varphi(0) \approx 0.3989$. The mass missing from the middle has
          gone to the tails.

      - part: Does it have a mean
        ask: >
          What is the probability the dot lands more than $100$ metres from
          the centre?
        expects: "0.006366"
        tolerance: 0.00005
        hint: >
          $1 - 2\arctan(100)/\pi$, and for large $x$, $\arctan x \approx
          \pi/2 - 1/x$.
        feedback: >
          $1 - 2\arctan(100)/\pi \approx 2/(100\pi) \approx 0.006366$, about
          one spin in $157$. For a standard normal, a $100$-unit move has
          probability around $10^{-2173}$. Here the tail falls only like
          $2/(\pi x)$.
      - reflect: >
          The density behaves like $1/(\pi x^{2})$ far out. For the mean to
          exist, $\int \lvert x \rvert f(x)\,dx$ must be finite. What does the
          integrand look like for large $x$, and what follows?
        hint: >
          Multiply $1/(\pi x^{2})$ by $x$.
        answer: >
          $\lvert x \rvert f(x) \approx 1/(\pi\lvert x \rvert)$, and
          $\int^{A} dx/x = \ln A$ grows without bound, so each tail
          contributes an infinite amount — $+\infty$ on the right, $-\infty$
          on the left. The mean is $\infty - \infty$: not zero, not infinite,
          but undefined.
      - ask: >
          So what is $\mathbb{E}[X]$?
        choices:
          - text: >
              $0$, by symmetry
            feedback: >
              Symmetry places a mean that exists. Here the answer depends on
              how you cut off the tails: $\int_{-a}^{2a} x f(x)\,dx \to
              \ln 2/\pi \approx 0.22$ as $a \to \infty$, not $0$.
          - text: >
              $+\infty$
            feedback: >
              That would need the left tail to be finite, as for a positive
              variable. Here both tails are infinite and they do not cancel in
              any definite way.
          - text: >
              It does not exist
            correct: true
            feedback: >
              Right. $\mathbb{E}\lvert X \rvert = \infty$ in both directions,
              so the mean is undefined. The median, $0$, is perfectly fine.
        feedback: >
          The centre of a Cauchy is its median. A moment needs an integral that
          converges; a quantile only needs the CDF.
      - teach: >
          The dot's position is the standard Cauchy law: density
          $1/(\pi(1 + x^{2}))$, CDF $1/2 + \arctan(x)/\pi$, quartiles at
          $\pm 1$, and no mean. It also appears as the ratio $Z_1/Z_2$ of two
          independent standard normals.

      - part: Averaging does nothing
        ask: >
          Spin the turntable $1000$ times and average the positions. Compared
          with a single spin, the average is:
        choices:
          - text: >
              Concentrated near $0$, with spread about $1/\sqrt{1000}$ of a
              single spin's
            feedback: >
              That is the familiar behaviour of averages, and it rests on a
              finite variance — here not even the mean exists. The rare huge
              spins dominate any average.
          - text: >
              Exactly as spread out: again standard Cauchy
            correct: true
            feedback: >
              Right. The average of $n$ iid standard Cauchy draws is standard
              Cauchy for every $n$. One spin out of $157$ lands beyond $100$
              metres, and a single such spin moves the average of $1000$ by
              $0.1$ or more.
          - text: >
              More spread out, since the extremes accumulate
            feedback: >
              The extremes and the division by $n$ balance exactly. The
              average has the same law as one spin, no wider and no narrower.
        feedback: >
          Averaging buys no precision at all for a Cauchy; there is no mean
          for the averages to settle on.
      - ask: >
          Why is the ratio $Z_1/Z_2$ of two independent standard normals
          Cauchy?
        choices:
          - text: >
              The point $(Z_2, Z_1)$ looks the same in every direction, so its
              angle is uniform, and $Z_1/Z_2$ is the tangent of that angle
            correct: true
            feedback: >
              Right. The joint density depends only on $z_1^{2} + z_2^{2}$, so
              the direction is uniform; the ratio is the tangent of a uniform
              angle — the laser again.
          - text: >
              Dividing by a normal averages out the noise in the numerator
            feedback: >
              The denominator is often near $0$, which blows the ratio up.
              That is where the heavy tails come from.
          - text: >
              The ratio of two symmetric laws is always Cauchy
            feedback: >
              Two independent $U(-1,1)$ variables give a ratio with a
              different law. It is the rotational symmetry of the normal pair
              that produces a uniform angle.
        feedback: >
          In an interview, asked for the mean of a ratio of normals, the
          answer is "it does not exist": tails like $1/x^{2}$, so
          $\int \lvert x \rvert f$ diverges — and "$0$ by symmetry" is the
          wrong answer being fished for.
