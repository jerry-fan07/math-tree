unit: quant-probability.conditional
opening: >
  Conditioning is the single move that turns a hard probability question into
  a solvable one: fix what you now know, and recompute everything relative to
  that. This unit builds the machinery in the order you'll actually reach for
  it — the ratio definition of $\Pr(A \mid B)$ and the reduced-sample-space
  picture that makes it concrete, the fact that conditioning preserves every
  axiom in the left slot but not the right, the chain rule for sequential
  draws, and independence restated in conditional language along with the
  sharp edges around it. The back half is where interviews actually live: the
  two workhorse theorems, total probability and Bayes, in both their
  probability and odds forms; the fully worked disease-test calculation and
  why almost everyone gets it wrong; the general fallacy of swapping the bar;
  and how to fold in evidence one piece at a time without recomputing from
  scratch.
lessons:
  - node: quant-probability.conditional.conditional-probability
    hook: >
      Every "given that," "knowing," or "if" in an interview prompt is an
      instruction to divide by $\Pr(B)$ — swap numerator and denominator and
      no amount of careful arithmetic afterward saves the answer.
    explanation: >
      $\Pr(A\mid B)$ is defined as $\Pr(A\cap B)/\Pr(B)$ rather than derived —
      the definition is forced by one requirement: once you know $B$
      happened, $B$ itself should now be certain, $\Pr(B\mid B)=1$, and every
      event should keep its relative weight against every other event inside
      $B$. Dividing the joint probability by $\Pr(B)$ is the unique
      renormalization that achieves both at once.

      The rearranged form $\Pr(A\cap B)=\Pr(A\mid B)\Pr(B)$ is what you
      actually reach for in computation: most interview setups hand you a
      conditional probability directly — a rate, a test result, a rule — and
      ask for a joint or marginal probability built from it, not the reverse.

      $\Pr(A\mid B)$ and $\Pr(B\mid A)$ come from the same joint probability
      divided by two different marginals, so unless $\Pr(A)=\Pr(B)$ they are
      simply different numbers; there is no general shortcut relating them
      short of Bayes' theorem, met later in this unit.

      Every downstream identity — the chain rule, total probability, Bayes —
      carries the same hidden hypothesis that each conditioning event along
      the way has positive probability. When a setup makes some case
      impossible, that branch drops out; it never produces a legitimate
      $0/0$.
    worked: >
      Roll two fair dice. Let $A$ be "the sum is $8$" and $B$ be "the first
      die shows $5$." Directly, $\Pr(B) = 1/6$ and $A \cap B$ is the single
      outcome $(5,3)$, so $\Pr(A \cap B) = 1/36$ and $\Pr(A \mid B) =
      (1/36)/(1/6) = 1/6$. Now swap the bar: $A$ has the $5$ outcomes
      $(2,6),(3,5),(4,4),(5,3),(6,2)$, so $\Pr(A) = 5/36$ and $\Pr(B \mid A) =
      (1/36)/(5/36) = 1/5$ — a different number from $\Pr(A \mid B) = 1/6$,
      built from the same joint probability $1/36$ divided by two different
      marginals.
    interview: >
      "Given that X happened, what's the probability of Y" is answered by
      writing $\Pr(Y \mid X) = \Pr(X \cap Y)/\Pr(X)$ before touching any
      numbers — the interviewer is watching whether you identify the
      conditioning event correctly and put it in the denominator, not whether
      you know the final fraction.
    pitfalls: >
      Putting $\Pr(A)$ in the numerator instead of $\Pr(A \cap B)$ —
      forgetting that only outcomes inside both events survive — is the most
      common slip. A close second is quoting $\Pr(A \mid B)$ when the problem
      gave $\Pr(B \mid A)$, or assuming they're equal without checking
      $\Pr(A) = \Pr(B)$.
    recap: >
      $\Pr(A \mid B) = \Pr(A \cap B)/\Pr(B)$ renormalizes the joint
      probability by what you now know, and swapping the bar changes the
      answer unless the two events happen to share the same marginal
      probability.

  - node: quant-probability.conditional.reduced-sample-space
    hook: >
      Under time pressure, writing out the shrunken list of outcomes is
      almost always faster than invoking the ratio formula by name — this is
      the mental shortcut that makes conditioning feel like counting again.
    explanation: >
      Conditioning on $B$ deletes every outcome outside $B$ and rescales what
      survives by $1/\Pr(B)$ so the remaining mass sums back to $1$ — $B$
      becomes the new sample space, and every probability computed "given
      $B$" is really a probability inside that smaller world.

      When the original outcomes are equally likely, this rescaling is
      trivial: every surviving outcome still carries the same weight as every
      other surviving outcome, so $\Pr(A \mid B) = |A \cap B|/|B|$ —
      counting, not division by a probability. The habit worth building is
      writing the reduced list of outcomes first and counting directly
      inside it, rather than computing $\Pr(A \cap B)$ and $\Pr(B)$
      separately and dividing.

      This shortcut only works when equally likely outcomes were already
      earned at the finest level — the same discipline required before
      applying the classical model at all. If the underlying outcomes aren't
      equally likely, you can't shortcut to counting; fall back to the full
      ratio and rescale probabilities, not outcome counts.
    worked: >
      Roll two fair dice; condition on $B$, the two dice showing different
      values ($30$ of the $36$ outcomes). Which pairs inside $B$ sum to $8$?
      The pairs summing to $8$ are $(2,6),(3,5),(4,4),(5,3),(6,2)$, and
      $(4,4)$ is excluded by $B$, leaving $4$ pairs. So $\Pr(\text{sum}=8
      \mid B) = 4/30 = 2/15$, against the unconditional $\Pr(\text{sum}=8) =
      5/36$ — conditioning on "different values" removed exactly the one
      double contributing to that sum, and nothing else needed recomputing.
    interview: >
      When a problem restricts to a visibly smaller, still-equally-likely set
      — "given the two cards are different suits," "given no repeats" —
      write the restricted list and count, rather than reaching for
      $\Pr(A \cap B)/\Pr(B)$ symbolically; interviewers read the shortcut as
      fluency, not laziness.
    pitfalls: >
      Applying $|A \cap B|/|B|$ when the outcomes weren't equally likely to
      begin with silently assumes a uniformity that was never granted. For a
      large sample space, writing out the full reduced list is slower than
      the ratio formula — switch back to $\Pr(A \cap B)/\Pr(B)$ once
      enumeration stops being faster than arithmetic.
    recap: >
      Conditioning restricts and rescales the sample space, and when outcomes
      are equally likely that rescaling is free — just count inside the
      smaller list.

  - node: quant-probability.conditional.conditional-measure
    hook: >
      The classic slip under pressure is complementing on the wrong side of
      the bar — this is the one-line reason every identity you know still
      works after conditioning, but only in the event you're asking about,
      never in the event you conditioned on.
    explanation: >
      Fix $B$ with $\Pr(B) > 0$ and check the three axioms directly against
      $\Pr(A \mid B) = \Pr(A \cap B)/\Pr(B)$. Nonnegativity is immediate,
      since both pieces of the ratio are nonnegative. Normalization holds
      because $\Pr(\Omega \mid B) = \Pr(B)/\Pr(B) = 1$. Additivity holds
      because disjoint $A$ and $C$ keep $A \cap B$ and $C \cap B$ disjoint
      too, so the numerator $\Pr((A \cup C) \cap B)$ splits into a sum before
      you ever divide by $\Pr(B)$.

      So $\Pr(\cdot \mid B)$ is a genuine probability measure, and every
      identity built from the axioms holds with $\mid B$ appended throughout:
      the complement rule, the two- and three-event union formulas, the
      union bound, monotonicity — all of it, no new proof required.

      What breaks is manipulating the conditioning event itself as though it
      obeyed the same rules. $\Pr(A \mid B)$ and $\Pr(A \mid B^{c})$ come from
      two different renormalizations of two unrelated subsets of $\Omega$;
      nothing forces them to sum to anything, let alone to $1$. The event you
      condition on is fixed background, not a second variable you're free to
      complement, union, or split the way you can the event on the left.
    worked: >
      Draw one card from a $52$-card deck. Let $B$ be "the card is red" ($26$
      cards) and $A$ be "the card is a heart" ($13$ cards, all red).
      $\Pr(A \mid B) = 13/26 = 1/2$, and the complement rule in the left slot
      checks out: $\Pr(A^{c} \mid B) = 1 - 1/2 = 1/2$, matching the $13$
      non-heart red cards directly. Now try the right slot: $\Pr(A \mid
      B^{c})$ is "heart given black," which is $0/26 = 0$. Nothing forces
      $\Pr(A \mid B) + \Pr(A \mid B^{c})$ to equal $1$ — here it's $1/2 + 0 =
      1/2$ — because $B$ and $B^{c}$ are unrelated renormalizations, not
      complementary slices of one fixed world the way $A$ and $A^{c}$ are
      inside $B$.
    interview: >
      "If $\Pr(A \mid B) = 0.7$, what's $\Pr(A \mid B^{c})$" is a trap
      question — the honest answer is "not determined by that number alone,"
      and explaining why (different conditioning event, different
      renormalization) is what separates understanding from pattern-matching
      the complement rule.
    pitfalls: >
      Writing $\Pr(A \mid B^{c}) = 1 - \Pr(A \mid B)$ is the single most
      common error here — the complement rule applies to the left slot only.
      A related mistake is assuming $\Pr(A \mid B \cup C) = \Pr(A \mid B) +
      \Pr(A \mid C)$; a union in the conditioning slot doesn't distribute the
      way it does on the left.
    recap: >
      Conditioning on $B$ produces a genuine probability measure, so every
      identity you know applies with $\mid B$ appended — but only in the
      event being asked about, never in $B$ itself.

  - node: quant-probability.conditional.chain-rule
    hook: >
      Anything phrased as a sequence of dependent draws or events — cards,
      defaults, approvals in a row — factors into a product of conditionals
      along whichever order makes the numbers easiest to state.
    explanation: >
      The two-event case is just the definition of conditional probability
      rearranged: $\Pr(A\mid B) = \Pr(A\cap B)/\Pr(B)$, multiplied through by
      $\Pr(B)$, gives $\Pr(A\cap B) = \Pr(A)\Pr(B\mid A)$ once you swap which
      event plays which role.

      Extending to $n$ events is induction on that one step: treat
      $A_{1}\cap\dots\cap A_{n-1}$ as a single block, apply the two-event case
      to that block and $A_{n}$, then recurse inside the block. This
      telescopes into a product where each factor conditions on the
      intersection of every event chosen so far, not just the one immediately
      before it.

      The events can be taken in any order, since it's the same intersection
      relabelled — use that freedom to pick the order whose conditionals are
      easiest to read off the problem, rather than the order the problem
      happened to state them in.
    worked: >
      A weather model gives: probability of rain on day $1$ is $0.3$; given
      rain on day $1$, probability of rain on day $2$ is $0.6$; given rain on
      both days $1$ and $2$, probability of rain on day $3$ is $0.7$. The
      chain rule gives $\Pr(\text{rain all three days}) = 0.3 \times 0.6
      \times 0.7 = 0.126$ — three numbers handed to you directly, multiplied
      in the order given, no new event to separately compute.
    interview: >
      "What's the probability all $n$ of these sequential things happen" is
      answered by naming the chain rule and multiplying the conditionals as
      you read them off the problem; a sharper follow-up asks you to reorder
      the events to make an awkward conditional easy, testing whether you
      know the order is a free choice.
    pitfalls: >
      Conditioning each factor only on the immediately preceding event,
      instead of the intersection of every event so far, silently drops
      information — $\Pr(A_{3} \mid A_{2})$ is not generally
      $\Pr(A_{3} \mid A_{1} \cap A_{2})$. The identity also needs every
      partial intersection along the chosen order to have positive
      probability; an impossible intermediate case breaks the whole
      factorization.
    recap: >
      A joint probability of a sequence factors into conditionals in any
      order you choose, each one conditioned on everything chosen before it,
      not just the event immediately prior.

  - node: quant-probability.conditional.independence-conditioning
    hook: >
      "Does learning $B$ change what you think about $A$" is independence
      restated as a question you can actually ask mid-interview, and the
      answer turns out to be symmetric whichever direction you ask it.
    explanation: >
      Clearing the denominator in $\Pr(A\mid B) = \Pr(A)$ gives
      $\Pr(A\cap B) = \Pr(A)\Pr(B)$ — exactly the product definition of
      independence, valid whenever $\Pr(B) > 0$. The conditional phrasing
      isn't a new fact, only a restatement of the product identity for the
      one case where dividing by $\Pr(B)$ makes sense.

      The product form is the one worth stating out loud: it stays meaningful
      even when $\Pr(B) = 0$, and it's manifestly symmetric in $A$ and $B$,
      unlike the conditional phrasing which looks one-directional.

      That symmetry extends to dependence too. $\Pr(A\mid B) > \Pr(A)$ means
      $\Pr(A\cap B) > \Pr(A)\Pr(B)$ after clearing denominators, and that same
      inequality, read the other way, is exactly $\Pr(B\mid A) > \Pr(B)$ — one
      algebraic fact with two conditional readings. "Being evidence for" is
      never a one-way street.
    worked: >
      Roll two fair dice. Let $A$ be "first die shows $6$" and $B$ be "the
      sum is $7$." Unconditionally $\Pr(A) = 1/6$. Given $B$, the six equally
      likely pairs summing to $7$ are $(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)$,
      and exactly one has first die $6$, so $\Pr(A \mid B) = 1/6 = \Pr(A)$:
      independent. The symmetric check confirms it — $\Pr(B \mid A)$ needs
      the second die to be $1$, probability $1/6$, matching
      $\Pr(B) = 6/36 = 1/6$ exactly.
    interview: >
      "If $A$ tells you nothing new about $B$, does $B$ tell you anything new
      about $A$" is answered "no, automatically" — the interviewer wants the
      one-line algebraic reason, both reduce to $\Pr(A \cap B) =
      \Pr(A)\Pr(B)$, not a restatement of the conclusion.
    pitfalls: >
      Checking independence with approximately equal numbers instead of an
      exact equality — near-independence isn't independence, the product
      identity is exact or it's false. Trying to use the conditional
      characterization when $\Pr(B) = 0$ is undefined; fall back to the
      product form, which still makes sense there.
    recap: >
      $\Pr(A \mid B) = \Pr(A)$ is just $\Pr(A \cap B) = \Pr(A)\Pr(B)$
      rearranged, and being evidence for something is always a two-way
      relationship.

  - node: quant-probability.conditional.conditional-independence
    hook: >
      "Given the hidden state, these two readings tell you nothing about
      each other" is the assumption every naive Bayes classifier and every
      hidden-state model quietly makes — knowing when it's a modelling choice
      rather than a fact matters as much as the definition itself.
    explanation: >
      Fix a third event $C$ and redo the ordinary independence equivalence
      entirely inside the world where $C$ is known: $A$ and $B$ are
      conditionally independent given $C$ when
      $\Pr(A \cap B \mid C) = \Pr(A \mid C)\Pr(B \mid C)$, equivalently
      $\Pr(A \mid B \cap C) = \Pr(A \mid C)$. Nothing new is defined beyond
      independence applied to the conditional measure $\Pr(\cdot \mid C)$
      itself, which is already known to satisfy the axioms, so the ordinary
      product characterization transfers over verbatim.

      Read it operationally: once $C$ is pinned down, learning $B$ adds
      nothing further about $A$. This is a claim entirely about the
      $C$-world — it says nothing about whether $A$ and $B$ are related
      before $C$ is known, a gap made concrete in both directions by the
      coin examples of "Independence does not survive conditioning, and vice
      versa."

      This is also the assumption that makes multi-signal models tractable at
      all: with $n$ readings that are only conditionally independent given a
      hidden state, the joint likelihood collapses from an unwieldy joint
      distribution over all $n$ readings to a plain product of $n$ one-signal
      likelihoods, each easy to estimate on its own. That collapse is the
      entire mechanical payoff naive Bayes and hidden-state models are built
      on.
    worked: >
      A fire alarm system has two sensors. Let $C$ be "there is a fire," with
      $\Pr(C) = 0.01$. Given a fire, each sensor alarms with probability
      $0.9$, and neither sensor's behaviour given the fire state depends on
      the other, so $\Pr(\text{both alarm} \mid C) = 0.9 \times 0.9 = 0.81$.
      Given no fire, each false-alarms with probability $0.05$, so
      $\Pr(\text{both alarm} \mid C^{c}) = 0.05 \times 0.05 = 0.0025$. Both
      are instances of $\Pr(A \cap B \mid C) = \Pr(A \mid C)\Pr(B \mid C)$ —
      the sensors are conditionally independent given the fire state, which
      is exactly what lets you multiply their readings once the hidden state
      is fixed.
    interview: >
      "Are these signals independent" almost always means "conditionally
      independent given the thing you're trying to infer" — state which
      variable you're conditioning on explicitly, since "independent" without
      it is ambiguous between two different claims.
    pitfalls: >
      Treating "conditionally independent given $C$" as though it says
      something about $A$ and $B$ with $C$ unknown is unjustified — both
      directions of implication can fail, as the coin examples of
      "Independence does not survive conditioning, and vice versa" show.
      Assuming more than two signals are mutually conditionally independent
      because each pair checks out repeats the pairwise-versus-mutual gap
      from plain independence, just inside the conditioned world.
    recap: >
      $A$ and $B$ are conditionally independent given $C$ when learning $B$
      adds nothing to $A$ once $C$ is already known — ordinary independence,
      run entirely inside the world where $C$ is fixed.

  - node: quant-probability.conditional.conditioning-breaks-independence
    hook: >
      The instinct that independent things stay independent once you
      condition on something else, and that dependent things stay dependent,
      is wrong in both directions — and interviewers love a two-line
      counterexample for each.
    explanation: >
      A conditioning event links variables by carving out only the outcomes
      consistent with a constraint, and that carving can either introduce a
      dependency between two originally unlinked variables or delete a
      dependency between two originally linked ones. The constraint
      physically ties their values together in the first case, and
      physically separates the mechanism producing each in the second.

      Whenever a problem's constraint links what determines two variables —
      a fixed sum, a shared source, an observed common outcome — recompute
      independence fresh inside the reduced space rather than importing the
      marginal answer; conditioning is not a passive restriction, it can
      actively build or destroy structure.
    worked: >
      Roll two fair dice; unconditionally the two dice are independent, so
      $\Pr(\text{die}_{1} = 1) = 1/6$ regardless of die $2$. Now condition on
      $C$, "the sum is $7$." Within $C$, the six equally likely pairs are
      $(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)$: knowing die $2$ pins down die $1$
      completely. $\Pr(\text{die}_{1} = 1 \mid \text{die}_{2} = 6, C) = 1$, a
      jump from the unconditional $1/6$ — two independent dice became
      perfectly dependent the moment a joint constraint on their sum was
      imposed.
    interview: >
      "Two dice are independent — does that stay true if I tell you their
      sum is $7$" is a direct probe; the expected answer names the mechanism
      (the constraint ties the two values together) and produces a quick
      number, not just "no."
    pitfalls: >
      Carrying a marginal independence or dependence conclusion into a
      conditioned version of the same problem without recomputing is the core
      error. Forgetting to rebuild the reduced sample space before answering
      compounds it, since that reduced space is exactly where the new
      dependency lives, or the old one disappears.
    recap: >
      Conditioning can manufacture dependence between independent things or
      erase dependence between dependent things — always recheck inside the
      conditioned world rather than importing the unconditional answer.

  - node: quant-probability.conditional.explaining-away
    hook: >
      The burglar-alarm story is the standard illustration, but the pattern
      behind it — conditioning on something upstream removes dependence,
      conditioning on something downstream creates it — is worth having as a
      reflex, not just a memorized anecdote.
    explanation: >
      Common cause: if a hidden $C$ independently drives both $A$ and $B$,
      then unconditionally $A$ and $B$ end up correlated through $C$ — an
      event making $C$ more likely makes both more likely too — but once $C$
      is pinned down, whatever variation is left in $A$ and $B$ is unrelated,
      so conditioning on $C$ removes the dependence. The unknown-bias coin is
      exactly this shape.

      Common effect: if $A$ and $B$ independently contribute to an observed
      event $E$, they stay independent unconditionally, but once $E$ is known
      the two causes start competing to explain it — evidence that one was
      present makes the other less necessary, manufacturing a negative link
      that wasn't there before. Restricting a sample to cases sharing a
      downstream outcome is conditioning on exactly this kind of shared
      effect, and can fabricate correlation between traits that are genuinely
      unrelated in the full population.
    worked: >
      Two independent fair coins $A$ and $B$; let $E$ be "at least one shows
      heads." Unconditionally $\Pr(A = H) = 1/2$. Given $E$ alone, the three
      equally likely outcomes are $HH, HT, TH$, so $\Pr(A = H \mid E) =
      (1/2)/(3/4) = 2/3$ — learning the effect occurred already makes $A$
      look more likely heads. Now also learn $B = H$: since $B = H$ already
      guarantees $E$, $\Pr(A = H \mid E, B = H) = \Pr(A = H \mid B = H) = 1/2$
      by independence, back to the baseline. Confirming $B$ explained the
      effect pulled $A$'s posterior straight back to its prior — the same
      shape as the earthquake pulling down the burglar posterior.
    interview: >
      "Two independent risk factors both feed into one observed outcome — if
      I tell you the outcome happened, then confirm one factor was present,
      what happens to the other" tests explaining-away directly; the expected
      answer is "its probability drops, potentially below where it started."
    pitfalls: >
      Conditioning on a collider — including restricting a dataset to cases
      sharing a common downstream outcome — manufactures correlation between
      variables that are genuinely independent, and treating that as evidence
      of a real relationship is a live source of bogus findings in observed
      data. Confusing this with the common-cause direction runs the fix
      backward: controlling for a confounder is correct, controlling for a
      collider introduces bias instead of removing it.
    recap: >
      Conditioning on a shared cause removes dependence between its effects;
      conditioning on a shared effect creates dependence between its causes —
      the second is how selection effects fabricate correlations.

  - node: quant-probability.conditional.without-replacement-chain
    hook: >
      "Without replacement" is the trigger phrase for this technique: walk
      the draws one at a time and multiply shrinking fractions, rather than
      reaching for a combinations formula that needs a fresh setup for every
      follow-up clause.
    explanation: >
      Each draw without replacement changes both the favorable count and the
      total count by exactly the number removed of the matching type, and the
      chain rule turns that shrinking directly into a product, factor by
      factor — no separate combinatorial argument required.

      This beats counting whenever the question grows a follow-up clause:
      adding a condition on a later draw only appends one more factor to the
      product, while the combinations route needs an entirely new
      case-by-case setup each time the question's shape changes.

      The operative rule: counting answers "how many unordered hands,"
      the chain rule answers "what happens if I draw these in this order."
      Pick whichever matches the question's phrasing, and use the fact that
      they must agree, when both apply, as a cheap sanity check.
    worked: >
      An urn holds $6$ red and $4$ blue balls, $10$ total. Draw three without
      replacement: $\Pr(\text{all three red}) = (6/10)(5/9)(4/8) = 120/720 =
      1/6$, matching the combinatorial check
      $\binom{6}{3}/\binom{10}{3} = 20/120 = 1/6$. Extend the question: "all
      three red, then the fourth is blue." The chain rule just appends one
      more factor, $(6/10)(5/9)(4/8)(4/7) = (1/6)(4/7) = 2/21$ — no new
      combinatorial setup, while counting this directly would need a fresh
      case analysis over ordered blocks.
    interview: >
      Any "draw these one at a time, without putting them back" question is
      answered by naming the shrinking-fraction product immediately; a good
      follow-up tests whether you extend the same product cleanly when the
      interviewer adds one more clause mid-question.
    pitfalls: >
      Forgetting to shrink the denominator at each step — using the same
      total for every draw instead of decreasing it by one each time —
      silently converts the problem into sampling with replacement. Applying
      this shrinking-fraction pattern to a with-replacement setup is the
      mirror error: there, every factor should stay constant.
    recap: >
      Multiply shrinking favorable-over-total fractions draw by draw — it
      matches counting exactly and extends painlessly to any additional
      clause about later draws.

  - node: quant-probability.conditional.symmetry-exchangeability
    hook: >
      Deep positions in a shuffled deck feel like they should need the full
      chain rule, but a symmetry argument answers most single- and
      joint-position questions in one line, no shrinking fractions required.
    explanation: >
      A uniformly shuffled deck makes all orderings equally likely, and every
      position plays a structurally identical role in that uniform
      distribution — relabelling which position you call "first" doesn't
      change the probability of any pattern, so the marginal law of any
      single position, and the joint law of any $k$ positions, matches that
      of the first $k$.

      The payoff: any "what's in position $k$" question collapses to the
      same computation as "what's in position $1$," skipping the chain
      rule's bookkeeping entirely — and multiplying conditionals for the
      first $k$ positions the long way is exactly the proof that the
      shortcut is valid, so it also serves as the cross-check when you want
      one.

      The same symmetry answers questions about relative order, not just
      identity: for two named cards, "does card $X$ precede card $Y$" is
      $1/2$ by relabelling, since swapping their roles swaps which event
      you're computing without changing its probability — no position needs
      to be named at all, only the two cards involved.
    worked: >
      A deck is shuffled uniformly. What's $\Pr(\text{7th and 12th cards are
      both hearts})$? By exchangeability this joint law matches that of the
      first two cards: $\Pr(\text{1st and 2nd both hearts}) =
      (13/52)(12/51) = 156/2652 = 1/17$. No bookkeeping about which specific
      positions $7$ and $12$ are is needed — any two positions give the same
      $1/17$.
    interview: >
      "What's the probability the $23$rd card dealt is a king" is meant to
      be answered instantly with $4/52 = 1/13$, no chain rule; the
      interviewer is checking whether you reach for exchangeability or start
      needlessly multiplying $22$ conditional factors.
    pitfalls: >
      Exchangeability gives identical positions only before you condition on
      other specific cards — once you're told the $3$rd card is an ace, the
      $4$th card's law is no longer the marginal $4/52$, it's back to
      multiplying conditionals by hand. Exchangeable positions are also not
      independent: knowing one card narrows down what the others can be,
      even though each position's own marginal law is identical.
    recap: >
      Every position in a uniformly shuffled deck carries the same marginal
      and joint law as any other, so single- and multi-position questions
      answer instantly without multiplying out a chain of conditionals.

  - node: quant-probability.conditional.total-probability
    hook: >
      "Split into cases, solve each easy sub-problem, average with the case
      probabilities as weights" is the single most reusable structural move
      in the subject — most hard-looking probability questions are this in
      disguise.
    explanation: >
      For a partition $B_{1},\dots,B_{n}$, the events $A\cap B_{i}$ are
      pairwise disjoint (since the $B_{i}$ are) and their union is $A$ itself
      (since the $B_{i}$ cover everything), so additivity gives
      $\Pr(A) = \sum_{i}\Pr(A\cap B_{i})$. The two-event form of the chain
      rule turns each term into $\Pr(A\mid B_{i})\Pr(B_{i})$.

      Read $\Pr(A)$ as a weighted average of the conditional probabilities
      $\Pr(A \mid B_{i})$, with the case probabilities as weights — it always
      lands between the smallest and largest conditional value, and it's
      pulled toward whichever case has the most weight.

      The playbook: pick a partition on which $A$ is easy to state
      conditionally — usually "which regime, which population, which random
      first step" — and grind through the finite sum.
    worked: >
      A factory runs three machines producing $50\%$, $30\%$, $20\%$ of
      output, with defect rates $2\%$, $5\%$, $1\%$ respectively.
      Partitioning by machine, $\Pr(\text{defective}) = (0.5)(0.02) +
      (0.3)(0.05) + (0.2)(0.01) = 0.01 + 0.015 + 0.002 = 0.027$ — a $2.7\%$
      overall defect rate, pulled toward the middle machine's higher rate
      since it contributes the largest weighted term.
    interview: >
      "What's the overall probability" when the setup naturally splits into
      scenarios is answered by naming the partition out loud and writing the
      weighted sum immediately — the interviewer is checking that the
      partition is actually exhaustive and disjoint, not just
      plausible-sounding.
    pitfalls: >
      A partition that misses a case silently loses probability mass, and one
      where the pieces overlap double-counts it. Using population-level
      weights when the conditional probabilities were actually computed on a
      differently-defined subgroup mismatches numerator and denominator
      conventions and produces the wrong quantity entirely.
    recap: >
      $\Pr(A) = \sum_{i} \Pr(A \mid B_{i})\Pr(B_{i})$ turns a hard question
      into a weighted average over easy scenario-by-scenario answers.

  - node: quant-probability.conditional.simpson-warning
    hook: >
      A treatment that wins in every subgroup can still lose overall, and a
      department that admits women at a higher rate than men in every
      category can still admit men at a higher rate overall — total
      probability is exactly why neither of these is a paradox.
    explanation: >
      A pooled rate is a weighted average with case sizes as weights, and the
      two things being compared can draw on different mixes of cases — so the
      pooled comparison can reverse even though every within-case comparison
      agrees. Nothing is mathematically strange: the pooled number and the
      conditional numbers answer different questions, one about total
      realized outcomes across a specific mix, the other about typical
      performance within a case.

      The working rule: never compare two pooled rates whose underlying
      mixes differ, and treat a quoted conditional rate without its weights
      as unreadable. When you must compare pooled numbers fairly, hold the
      mix fixed — compare within strata, or standardize both groups to a
      common weighting — rather than comparing raw totals.
    worked: >
      A real clinical comparison: treatment $A$ succeeds on $81/87 \approx
      93.1\%$ of small stones and $192/263 \approx 73.0\%$ of large stones;
      treatment $B$ succeeds on $234/270 \approx 86.7\%$ of small stones and
      $55/80 \approx 68.8\%$ of large stones. $A$ wins in both size
      categories. But $A$ was used disproportionately on the harder
      large-stone cases: pooled, $A$ succeeds on $273/350 = 78.0\%$ overall
      while $B$ succeeds on $289/350 = 82.6\%$ — $B$ wins the pooled
      comparison because it was used mostly on the easier small stones, not
      because it's the better treatment stone-for-stone.
    interview: >
      "Can a treatment be worse in every subgroup and better overall, or the
      reverse" is answered "yes" with an immediate real or constructed
      example — the interviewer listens for you to name the mechanism
      (differing case mixes) rather than call it a paradox.
    pitfalls: >
      Assuming a favorable pooled statistic means every subgroup benefits
      runs the same trap in reverse. Trusting a headline pooled number
      without asking how the two groups were assigned across strata is the
      recurring real-world version — especially dangerous when assignment
      isn't random, since sicker patients getting the more reliable treatment
      is exactly what generates the reversal.
    recap: >
      A pooled rate is a weighted average, so two pooled rates built from
      different mixes can disagree with every one of their within-case
      comparisons — never compare pooled numbers without matching mixes.

  - node: quant-probability.conditional.bayes
    hook: >
      Your model naturally hands you $\Pr(\text{evidence} \mid
      \text{hypothesis})$ — simulate the mechanism forward and that's what
      falls out — but the question almost always wants the reverse, and
      Bayes' theorem is the one legal way to flip it.
    explanation: >
      The proof is assembling two already-proved facts. The numerator
      $\Pr(A \mid B_{k})\Pr(B_{k})$ is exactly $\Pr(A \cap B_{k})$ by the
      two-event chain rule. The denominator
      $\sum_{i}\Pr(A \mid B_{i})\Pr(B_{i})$ is exactly $\Pr(A)$ by total
      probability. Dividing recovers $\Pr(B_{k} \mid A)$ by the ratio
      definition of conditional probability itself — nothing new is proved
      here beyond that combination.

      Its whole purpose is reversing the conditioning: turning
      $\Pr(\text{evidence} \mid \text{hypothesis})$, which a model or a
      stated rate hands you directly, into
      $\Pr(\text{hypothesis} \mid \text{evidence})$, which is what's actually
      asked.

      The machinery still needs $\Pr(A) > 0$ and the $B_{i}$ to genuinely
      partition the sample space — if either fails, the numerator's
      justification from the chain rule and the denominator's justification
      from total probability are both lost at once.
    worked: >
      Two urns, chosen by a fair coin: urn $A$ holds $3$ red and $7$ blue
      balls, urn $B$ holds $6$ red and $4$ blue. You draw a red ball; which
      urn is it more likely to be? Total probability first:
      $\Pr(\text{red}) = (0.5)(0.3) + (0.5)(0.6) = 0.15 + 0.30 = 0.45$. Bayes
      then gives $\Pr(A \mid \text{red}) = 0.15/0.45 = 1/3$ — the numerator
      is the chain rule's term for urn $A$, the denominator is total
      probability's sum, and dividing reverses the bar from "red given urn"
      to "urn given red."
    interview: >
      "You're told $\Pr(\text{test positive} \mid \text{has condition})$ —
      what's $\Pr(\text{has condition} \mid \text{test positive})$" can't be
      answered without also knowing the prior and the false-positive rate;
      the interviewer wants you to say so and then assemble Bayes from its
      two known pieces.
    pitfalls: >
      Reporting $\Pr(A \mid B_{k})\Pr(B_{k})$ alone, without dividing by the
      sum across every hypothesis, gives an unnormalized score, not a
      probability. Using hypotheses that don't actually partition the sample
      space — overlapping or incomplete — breaks the numerator's
      justification from the chain rule and the denominator's justification
      from total probability at the same time.
    recap: >
      Bayes' theorem is the chain rule's numerator over total probability's
      denominator — nothing more — and its purpose is reversing which side
      of the bar you were given.

  - node: quant-probability.conditional.prior-likelihood-posterior
    hook: >
      Interviewers often hand you several candidate hypotheses at once and a
      string of data, and expect you to track the running score without ever
      writing a symbolic denominator — that's exactly what this vocabulary
      and the proportional form are for.
    explanation: >
      $\Pr(H)$ is the prior, $\Pr(E \mid H)$ the likelihood, $\Pr(H \mid E)$
      the posterior, and $\Pr(E)$ the marginal likelihood whose only job is
      to normalize — the same four pieces Bayes assembles, given names. The
      likelihood is a function of $H$ for the one $E$ you actually observed;
      it need not sum to $1$ across hypotheses, so treating it like a
      distribution over $H$ is a category error.

      The proportional form is the efficient device: score each enumerated
      hypothesis by prior times likelihood as you go, then divide every score
      by their sum exactly once, at the very end. This avoids carrying total
      probability's denominator symbolically through a multi-hypothesis
      problem — you never have to name it until the last step.

      Updating composes: the posterior after one observation is simply the
      prior fed into the next update, which is what makes sequential evidence
      tractable rather than requiring a fresh joint calculation each time.
    worked: >
      Three coins in a bag, equally likely to be drawn: coin $1$ has
      $\Pr(H) = 0.5$, coin $2$ has $\Pr(H) = 0.6$, coin $3$ has
      $\Pr(H) = 0.9$. Draw one, flip twice, see $HH$. Score by likelihood
      alone since the priors are equal and cancel: $0.5^{2} = 0.25$,
      $0.6^{2} = 0.36$, $0.9^{2} = 0.81$, summing to $1.42$. Normalizing once
      at the end, $\Pr(\text{coin }3 \mid HH) = 0.81/1.42 \approx 0.570$ —
      the loaded coin is now the leading hypothesis at about $57\%$, up from
      an equal $1/3$ prior.
    interview: >
      "You have three possible models and you observe some data — which
      model is most likely now" is answered by scoring prior times
      likelihood for each candidate and normalizing at the end, said out loud
      as "posterior proportional to prior times likelihood" — the phrase
      interviewers listen for.
    pitfalls: >
      Forgetting to include every hypothesis in the final sum silently
      rescales everyone's posterior. Reading likelihood values as though they
      must sum to $1$ across hypotheses is a category error — likelihood is a
      function of the hypothesis for fixed observed data, not a probability
      distribution over hypotheses.
    recap: >
      Score each hypothesis by prior times likelihood, normalize once at the
      end — the proportional form that avoids carrying a symbolic denominator
      through a multi-hypothesis update.

  - node: quant-probability.conditional.bayes-odds
    hook: >
      Professionals updating beliefs on the fly — in poker, in trading, in a
      live interview — work in odds, not probabilities, because the
      normalizing denominator cancels and updates become pure multiplication.
    explanation: >
      Divide the two-case Bayes formula for $\Pr(H \mid E)$ by the same
      formula for $\Pr(H^{c} \mid E)$: the shared denominator, total
      probability's sum, cancels entirely, leaving posterior odds equal to
      prior odds times the likelihood ratio $\Pr(E\mid H)/\Pr(E\mid H^{c})$.
      That cancellation is the whole derivation — one algebra step.

      Think of it as multiplicative accounting: each new piece of evidence
      multiplies the current odds by its likelihood ratio, and taking logs
      turns that into additive "bits" of evidence — a ratio of $2$ is one bit
      in favour, a ratio of $1$ is no evidence at all. Convert back to a
      probability with $p = O/(1+O)$ whenever the question wants one.

      This is the form to say out loud precisely because no normalizing
      constant ever needs computing, and folding in a second piece of
      evidence later is just one more multiplication, not a rebuilt fraction.
    worked: >
      A poker player assigns prior odds of $1:4$ that an opponent is
      bluffing ($20\%$). A particular bet size occurs with probability $0.6$
      given a bluff and $0.2$ given a real hand, a likelihood ratio of
      $0.6/0.2 = 3$. Posterior odds are $(1:4) \times 3 = 3:4$, so
      $\Pr(\text{bluff} \mid \text{bet size}) = 3/(3+4) = 3/7 \approx 0.429$
      — no denominator from total probability was ever computed, just prior
      odds times one ratio.
    interview: >
      "The prior odds are $X:Y$ and the likelihood ratio is $r$ — what are
      the posterior odds" should be answered instantly as $rX:Y$; a common
      follow-up asks you to convert back to a probability with
      $p = O/(1+O)$, checking that conversion is automatic too.
    pitfalls: >
      Leaving the final answer as an odds ratio when a probability was asked
      for skips the required conversion. Computing the likelihood ratio
      upside down — $\Pr(E \mid H^{c})/\Pr(E \mid H)$ instead of the reverse
      — silently inverts whether the evidence favors or disfavors $H$.
    recap: >
      Posterior odds equal prior odds times the likelihood ratio, with no
      denominator to compute — the version of Bayes you can do out loud.

  - node: quant-probability.conditional.coin-from-bag
    hook: >
      "Which of two types am I holding" — loaded die, biased trader,
      mislabeled batch — is a template interviewers reuse constantly, and the
      odds machinery turns every instance into a two-line computation.
    explanation: >
      The template is fixed: name two exhaustive hypotheses, state prior odds
      (often $1:1$ from "pick one at random from two equally likely
      options"), compute the likelihood ratio from the single observation,
      multiply. Nothing about the specific story — coins, dice, machines —
      changes the mechanics.

      Repeated observations compose by repeated multiplication of the same
      ratio, so the posterior after $k$ confirmations follows a clean
      geometric pattern in the odds — and because the ratio is finite, that
      posterior approaches certainty without ever reaching it.

      The same two-line computation is what's underneath "is this coin fair,"
      "is this trader's win streak luck or skill," "is this batch defective":
      strip away the story and every one of them is prior odds times a
      likelihood ratio built from whatever single observation you were
      handed.
    worked: >
      A bag has two dice: one fair, one loaded to show $6$ with probability
      $1/2$ (each other face $1/10$). Draw one at random and roll a $6$.
      Prior odds are $1:1$; the likelihood ratio is
      $\Pr(6 \mid \text{loaded})/\Pr(6 \mid \text{fair}) = (1/2)/(1/6) = 3$;
      posterior odds are $3:1$, so $\Pr(\text{loaded} \mid 6) = 3/4$. Direct
      check: $(0.5)(0.5)/[(0.5)(0.5) + (0.5)(1/6)] = 0.25/(1/3) = 3/4$. The
      next roll is a $6$ with probability $(3/4)(1/2) + (1/4)(1/6) = 5/12$,
      and after $k$ straight sixes the posterior on the loaded die is
      $3^{k}/(3^{k}+1)$, climbing toward but never reaching $1$.
    interview: >
      "You draw one of two indistinguishable-looking items and observe one
      data point — what's the chance you have the rare one" is solved with
      prior odds times a single likelihood ratio; the follow-up almost always
      asks for the pattern after $k$ repeated observations, testing whether
      you see the ratio just gets raised to the $k$-th power.
    pitfalls: >
      Computing the likelihood ratio upside down flips the direction of the
      update entirely. Rounding the posterior up to $100\%$ after a run of
      confirming observations is the wrong instinct — with a finite
      likelihood ratio, certainty is only approached, never reached, in
      finitely many steps.
    recap: >
      Prior odds times one likelihood ratio gives the posterior in a single
      step, and repeated confirmations raise that ratio to a power,
      approaching but never reaching certainty.

  - node: quant-probability.conditional.test-characteristics
    hook: >
      "The test is $95\%$ accurate" conflates four different conditional
      probabilities into one word, and which one is meant changes the entire
      answer — pin down which conditional is actually quoted before doing
      anything else.
    explanation: >
      Each of the four rates is a $\Pr(\cdot \mid \cdot)$ read off a
      contingency table with the truth as the conditioning event.
      Sensitivity and specificity condition on the truth, so they're
      properties of the test mechanism itself, not of any population it gets
      applied to — and the false positive rate is just $1 - \text{specificity}$
      by definition, not a separately measured number.

      What you actually want is usually the reverse conditioning,
      $\Pr(D \mid +)$, the positive predictive value — and reaching it needs
      Bayes, because reversing the bar requires the prevalence $\Pr(D)$ as an
      extra ingredient that neither sensitivity nor specificity supplies on
      its own.

      Moving the decision threshold trades sensitivity against specificity in
      opposite directions, and predictive value can still be dismal even when
      both are pushed high — "The positive screening test" computes exactly
      how dismal.
    worked: >
      An inspection machine is tested against $1\,000$ known-defective items
      and $5\,000$ known-good items. It flags $950$ of the defective items:
      sensitivity $= 950/1\,000 = 0.95$. Among the good items it correctly
      passes $4\,750$: specificity $= 4\,750/5\,000 = 0.95$, so it wrongly
      flags $250$ good items, a false positive rate of $250/5\,000 = 0.05$ —
      exactly $1 - 0.95$, not a separately measured number.
    interview: >
      "What's the difference between sensitivity and positive predictive
      value" is a standard vocabulary check; the expected answer is that one
      conditions on the truth and describes the test alone, the other
      conditions on the test result and additionally depends on the
      prevalence.
    pitfalls: >
      Quoting a test's sensitivity or specificity as if it directly answers
      "given a positive result, what's the chance of the condition" confuses
      the two directions of conditioning. Treating the false positive rate as
      an independent number to look up, rather than $1 - \text{specificity}$,
      wastes time and risks an inconsistent pair of numbers.
    recap: >
      Sensitivity and specificity condition on the truth and describe the
      test; predictive value conditions on the result and additionally needs
      the prevalence.

  - node: quant-probability.conditional.disease-test
    hook: >
      This exact calculation — turning a "highly accurate" test into a
      mostly-wrong positive result — is worth being able to reproduce cold,
      since it's the concrete case every base-rate question in an interview
      is secretly testing.
    explanation: >
      Nothing new is required beyond the odds form of Bayes applied to the
      sensitivity–specificity vocabulary: convert the prevalence into prior
      odds, convert sensitivity and the false positive rate into a likelihood
      ratio, multiply.

      The punchline is worth stating before the arithmetic: whenever the
      prevalence sits far below the false-positive rate, a positive result
      stays mostly a false alarm even with sensitivity and specificity both
      comfortably above $90\%$, because the far larger healthy population
      still contributes more false positives in absolute terms than the
      small diseased population contributes true positives.

      Watch what moves the answer: raising specificity shrinks the healthy
      population's contribution to the denominator, raising prevalence
      shrinks how much larger that healthy population is in the first place
      — either one lifts the predictive value, but neither sensitivity alone
      nor specificity alone determines it.
    worked: >
      A spam filter flags mail with prevalence $\Pr(\text{spam}) = 0.2$,
      sensitivity $0.9$ (catches $90\%$ of actual spam), and specificity
      $0.95$ (a $5\%$ false positive rate on legitimate mail). Total
      probability: $\Pr(\text{flagged}) = (0.2)(0.9) + (0.8)(0.05) = 0.18 +
      0.04 = 0.22$. Bayes gives $\Pr(\text{spam} \mid \text{flagged}) =
      0.18/0.22 = 9/11 \approx 0.818$. In odds: prior odds $1:4$, likelihood
      ratio $0.9/0.05 = 18$, posterior odds $18:4 = 4.5:1$, the same $9/11$
      — the higher $20\%$ prevalence, unlike a rare disease, is what keeps
      the predictive value this high.
    interview: >
      "A test is $99\%$ sensitive and $95\%$ specific for a condition with
      $1\%$ prevalence — what's the chance a positive result actually has it"
      is the canonical version of this question; the interviewer listens for
      total probability then Bayes, or the odds shortcut, computed to an
      actual fraction, not an intuitive guess near $95\%$.
    pitfalls: >
      Multiplying or averaging sensitivity and specificity together instead
      of actually running total probability followed by Bayes has no
      justification and gives a meaningless number. Forgetting that the false
      positive rate is already $1 - \text{specificity}$ leads to
      double-counting or misplacing it in total probability's sum.
    recap: >
      Combining prevalence, sensitivity, and specificity through Bayes gives
      the true predictive value, $9/11$ here, and that number moves with the
      prevalence, not with the test's own accuracy alone.

  - node: quant-probability.conditional.base-rate-neglect
    hook: >
      Asked the screening-test question cold, most people — physicians
      included — blurt out something near the sensitivity or specificity
      number; naming why that instinct is wrong, and having the counting fix
      ready, is worth more than any amount of algebra fluency.
    explanation: >
      The error is treating $\Pr(+ \mid D)$ as if it already answered
      $\Pr(D \mid +)$, skipping the prior entirely. It's a structural trap,
      not just carelessness: the sensitivity and specificity numbers sit
      stated vividly in the problem, while the prevalence has to be actively
      retrieved and combined through a renormalization step that's easy to
      skip under time pressure.

      The reliable fix is natural frequencies: pick a round total population,
      compute actual head counts in each cell of the contingency table, and
      take one division at the very end. This replaces an abstract
      multiply-then-divide with concrete counting that's easy to audit by
      hand and hard to get backwards, which is precisely why it works as a
      fix even for people who don't trust their own probability arithmetic.
    worked: >
      A fraud-detection system flags $98\%$ of fraudulent transactions and
      false-flags $3\%$ of legitimate ones, with $0.5\%$ of all transactions
      actually fraudulent. Out of $100\,000$ transactions: $500$ are
      fraudulent, and $98\%$ of those, $490$, get flagged; $99\,500$ are
      legitimate, and $3\%$ of those, $2\,985$, get flagged anyway. Total
      flagged: $490 + 2\,985 = 3\,475$. Of those, only $490$ are real fraud,
      so $\Pr(\text{fraud} \mid \text{flagged}) = 490/3\,475 \approx 14.1\%$
      — one division, at the very end, on numbers you can picture as actual
      transactions.
    interview: >
      "Does that surprise you" after walking through a base-rate calculation
      checks whether you can articulate the mechanism, not just compute the
      number; the strong answer restates the problem as counts out of a round
      population and shows the $95\%$-looking test producing mostly false
      alarms is arithmetic, not a trick.
    pitfalls: >
      Picking a population total that isn't a common denominator for the
      given percentages produces messy fractional "people," which slows you
      down and invites arithmetic slips — use $10\,000$ or $100\,000$,
      whichever clears every decimal cleanly. Reading $\Pr(+ \mid D)$ off the
      problem and reporting it directly as the answer, skipping the frequency
      table altogether, is exactly the error natural frequencies are meant to
      prevent.
    recap: >
      Reframing a Bayes question as headcounts out of a round population —
      flagged fraud here is $490$ real out of $3\,475$ total, about $14\%$ —
      turns error-prone multiply-and-divide into simple, auditable counting.

  - node: quant-probability.conditional.transposed-conditional
    hook: >
      Swapping which side of the conditioning bar you're talking about is the
      single most common probabilistic error made outside a math classroom —
      in courtrooms, headlines, and hiring decisions — and interviewers love
      handing you one to diagnose.
    explanation: >
      Two applications of the ratio definition give the load-bearing fact:
      $\Pr(A\mid B)/\Pr(B\mid A) = [\Pr(A\cap B)/\Pr(B)] /
      [\Pr(A\cap B)/\Pr(A)] = \Pr(A)/\Pr(B)$. Swapping the bar rescales by the
      ratio of the two base rates, which can be orders of magnitude when the
      two base rates are wildly different — this is just Bayes' theorem
      restated as a warning.

      The prosecutor's fallacy is the branded version of this arithmetic: a
      tiny $\Pr(\text{evidence} \mid \text{innocent})$ does not make
      $\Pr(\text{innocent} \mid \text{evidence})$ tiny, because a large pool
      of innocent people can still produce many matches by chance. Whenever a
      quoted probability sounds damning, the question to ask is which way the
      bar points and what the two base rates actually are.
    worked: >
      "$90\%$ of successful hedge fund managers went to a top-$10$
      university, so if you go to a top-$10$ university you have a $90\%$
      chance of running a successful fund" — check the base rates. Suppose
      top-$10$ universities graduate $50\,000$ people a year and there are
      only $500$ successful managers total, $450$ of them ($90\%$) from those
      universities. Then $\Pr(\text{successful manager} \mid \text{top-}10
      \text{ grad}) = 450/50\,000 = 0.9\%$ — nowhere near the quoted $90\%$,
      because the pool of top-$10$ graduates vastly outnumbers the pool of
      successful managers.
    interview: >
      "$X\%$ of successful people share trait $Y$ — does that mean trait $Y$
      predicts success at rate $X\%$" is the generic form of this question;
      the strong answer states
      $\Pr(A\mid B)/\Pr(B\mid A) = \Pr(A)/\Pr(B)$ and asks for the two base
      rates before answering anything numerically.
    pitfalls: >
      Accepting a lopsided conditional probability as damning without asking
      how large the pool of alternative candidates is. Treating "$A$ given
      $B$ is high" and "$B$ given $A$ is high" as the same claim, when
      they're related only through a ratio of base rates that can differ by
      orders of magnitude.
    recap: >
      $\Pr(A\mid B)$ and $\Pr(B\mid A)$ differ by the ratio of their base
      rates, $\Pr(A)/\Pr(B)$, which can be enormous — always ask which way
      the bar points before trusting a quoted conditional.

  - node: quant-probability.conditional.sequential-updating
    hook: >
      Evidence rarely arrives all at once — a second test, a second witness,
      a second data point — and multiplying likelihood ratios one at a time
      as each arrives is what lets you update live instead of rebuilding a
      joint table from scratch.
    explanation: >
      Apply the odds form of Bayes twice, once per piece of evidence, and use
      conditional independence of $E_{1}, E_{2}$ given $H$ and given $H^{c}$
      to split the combined likelihood ratio into a product of the two
      individual ratios: posterior odds equal prior odds times
      $\prod_{i} \Pr(E_{i} \mid H)/\Pr(E_{i} \mid H^{c})$. That splitting step
      is where conditional independence does all the work.

      Multiplication commutes, so the order the evidence arrives in doesn't
      matter — the same order-freedom the chain rule has, now expressed in
      odds space, letting you fold in evidence in whatever sequence it shows
      up.

      Conditional independence given $H$ and given $H^{c}$ is the load-bearing
      hypothesis, and it's often false: a second reading from the same
      miscalibrated instrument, or a question that just re-asks the first
      one, carries little or no additional information, and multiplying its
      ratio in anyway overstates confidence.
    worked: >
      A mail system's prior odds of spam are $1:4$, and one filter's positive
      flag has likelihood ratio $18$, giving posterior odds $4.5:1$ after the
      first flag. A second, genuinely independent filter — built on
      different rules, with the same $18$ likelihood ratio — also flags the
      message. Since the two filters are conditionally
      independent given the true label, the combined likelihood ratio is
      $18 \times 18 = 324$, so posterior odds after both flags are
      $1:4 \times 324 = 81:1$, giving $\Pr(\text{spam} \mid \text{both
      flagged}) = 81/82 \approx 98.8\%$ — two independent positive signals
      move the answer from uncertain to nearly certain.
    interview: >
      "You get a second, independent piece of evidence — how does the answer
      change" is answered by naming the multiply-the-likelihood-ratios move
      directly in odds space; the sharper follow-up asks what happens if the
      second piece of evidence isn't actually independent of the first,
      testing whether you flag that the whole computation depends on it.
    pitfalls: >
      Multiplying in a second likelihood ratio from evidence that shares a
      common source of error with the first — retesting with the same
      miscalibrated instrument, asking the same witness the same question
      twice — violates conditional independence and overstates the final
      confidence. A related slip is multiplying raw probabilities
      $\Pr(E_{i} \mid H)$ together instead of likelihood ratios, forgetting
      each term needs to be divided by $\Pr(E_{i} \mid H^{c})$ as well.
    recap: >
      Independent evidence combines by multiplying likelihood ratios in any
      order, but the whole trick collapses the moment the pieces of evidence
      share a common source of error.
