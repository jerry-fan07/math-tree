unit: quant-probability.counting
opening: >
  Counting is the arithmetic underneath classical probability: before any
  fraction can be computed, its numerator and denominator have to be counted
  by the same convention, and most errors in the interview canon are counting
  errors wearing a probability disguise. This unit builds the toolkit in
  order — the multiplication principle that licenses every other formula,
  permutations and combinations as its two basic derived counts, the
  labelling-then-dividing pattern that generates both, and then the
  techniques (multinomial splitting, stars and bars, lattice paths,
  inclusion–exclusion) that handle everything more elaborate. It closes with
  the set-piece examples worked to the end — derangements, the birthday
  problem, poker hands, the central binomial coefficient — plus pigeonhole
  and cycle structure, the two results that need no probability at all to be
  useful. By the end you should be able to classify any counting question by
  its sampling mode and reach for the matching formula without hesitation.
lessons:
  - node: quant-probability.counting.multiplication-principle
    hook: >
      Every combinatorial formula in this unit — factorials, binomial
      coefficients, the works — is this one principle applied two or three
      times in a row; state it precisely now and every later formula becomes
      a derivation instead of a rule to memorize.
    explanation: >
      A construction built in stages is a decision tree: draw a branch for
      each way to complete stage one, then from every one of those branches
      draw a branch for each way to complete stage two, and so on. If stage
      $i$ always offers exactly $n_i$ branches — no matter which choices led
      there — the tree has $n_1 n_2 \cdots n_k$ leaves, because multiplying
      out a tree with constant branching at each level is exactly what the
      arithmetic product means.

      The hypothesis to watch is subtler than it looks: it demands a
      constant *count* at each stage, not that the stages are unrelated.
      Dealing two cards without replacement: the first card has $52$ options,
      and whichever one is drawn, the second card always has exactly $51$
      options left — the specific $51$ cards differ by case, but the count of
      them never does, so the product rule applies cleanly even though the
      two draws are obviously dependent.

      When the count itself changes — stage two offers $5$ options after one
      first-stage choice and $3$ after another — the product rule breaks, and
      the fix is to split into cases by the first-stage outcome and add the
      per-case products instead of multiplying a single pair of numbers.
    worked: >
      A $4$-digit passcode uses distinct digits from $0$–$9$. The first digit
      has $10$ options; whichever one is chosen, the second always has
      exactly $9$ options left (whatever wasn't used), the third $8$, the
      fourth $7$ — the count shrinks by exactly one each stage regardless of
      which digits were picked, so the product rule applies for
      $10\cdot9\cdot8\cdot7=5040$ passcodes.
    interview: >
      Interviewers phrase this as "how many ways can you..." questions about
      a sequence of choices — license plates, PIN codes, seating a fixed
      number of distinguishable items into ordered slots. They're listening
      for you to
      check, out loud, that the option count at each stage doesn't depend on
      which specific earlier choice was made, not just that stages "feel"
      independent.
    pitfalls: >
      Confusing "the count is constant" with "the stages are independent" —
      dependent stages (dealing without replacement) still multiply as long
      as the *number* of remaining options doesn't vary by case. Applying the
      product rule when the option count genuinely does change across cases
      is the reverse and more consequential mistake.
    recap: >
      Stages with $n_1,\dots,n_k$ options each combine into $n_1\cdots n_k$
      outcomes whenever the option count at each stage is fixed, regardless
      of dependence between stages.
    steps:
      - teach: >
          Picture any multi-stage construction as a decision tree: one branch
          per way to complete the first stage, then from every one of those
          branches, one branch per way to complete the second stage, and so
          on. When every stage forks into the same number of branches,
          however you got there, the leaf count is exactly the product of
          the per-stage branch counts.
      - teach: >
          The requirement is subtler than "the stages don't affect each
          other" — only the *count* of options at each stage has to stay
          fixed, not which specific options they are. Dealing two cards
          without replacement is exactly this: the first draw has $52$
          options, and whichever card comes up, the second draw always has
          precisely $51$ left, so the draws are dependent yet the product
          rule still applies.
      - teach: >
          A café's lunch menu offers $5$ sandwiches, $3$ sides, and $4$
          drinks, and an order is one of each. No stage's option count
          depends on an earlier choice, so the multiplication principle
          applies directly across all three stages.
      - ask: >
          How many distinct lunch orders (one sandwich, one side, one drink)
          does the café offer?
        expects: "60"
        hint: >
          Multiply the three stage counts together — nothing about one stage
          depends on another here.
        feedback: >
          $5 \cdot 3 \cdot 4 = 60$: three independent stages with constant
          option counts at each.
      - teach: >
          The check that matters before multiplying anything is whether
          every case at a stage offers the same *number* of options, even
          when the specific options differ. If it does, the stages can be
          dependent in every other sense and the product rule still holds
          exactly.
      - ask: >
          Six distinct marbles sit in a bag. You draw one, set it aside,
          then draw a second — order matters. How many ordered pairs of
          draws are possible?
        expects: "30"
        hint: >
          The second draw's option count doesn't depend on which marble came
          out first — only on how many marbles remain.
        feedback: >
          The first draw has $6$ options; whichever marble comes out,
          exactly $5$ remain for the second draw, so $6 \cdot 5 = 30$.
      - teach: >
          When the option count itself changes across cases — not just
          which options are available, but how many — the product rule
          breaks. The fix is to split into cases by the stage that varies,
          count each case with its own product, and add the cases together.
      - ask: >
          A lunch special offers a size choice, small or large. A small
          comes with a choice of $2$ toppings; a large comes with a choice
          of $5$ toppings. How many size-and-topping combinations are there?
        expects: "7"
        hint: >
          The topping count depends on which size you picked, so "2 sizes
          times a topping count" won't work — handle each size as its own
          case and add.
        feedback: >
          Small gives $1 \cdot 2 = 2$ combinations and large gives
          $1 \cdot 5 = 5$; the stage-two count isn't constant across cases,
          so add rather than multiply: $2 + 5 = 7$.

  - node: quant-probability.counting.permutations
    hook: >
      Every "how many orderings" question in the interview canon reduces to a
      factorial or a falling factorial — knowing exactly which one, and why
      the repeated-item case needs a division, separates a fast correct
      answer from a guess.
    explanation: >
      The product rule turns into $n!$ the moment you watch it fill slots one
      at a time: slot one has $n$ choices, slot two has $n-1$ since one
      object is already placed, and so on down to a single remaining choice
      for the last slot — a product rule with $n$ stages whose option counts
      step down by one each time, giving $n\cdot(n-1)\cdots1=n!$. Restricting
      to the first $k$ slots stops the product after $k$ factors instead of
      continuing to $1$, giving $P(n,k)=n(n-1)\cdots(n-k+1)=n!/(n-k)!$:
      exactly $k$ falling factors, not $k!$ and not $n!$.

      The multiset case flips the logic. Imagine the $n_1$ copies of the
      first type were secretly distinguishable — label them
      $a_1,\dots,a_{n_1}$ — and likewise every other type; now all $n$
      objects are distinct and there are $n!$ orderings of the labelled
      version. Each true, unlabelled arrangement is produced by exactly
      $n_1!\cdots n_r!$ of these labelled orderings, one for every way of
      permuting the labels within each type without changing what you
      actually see, so the true count is the labelled count divided by that
      overcounting factor: $n!/(n_1!\cdots n_r!)$.
    worked: >
      Awarding gold, silver, and bronze among $12$ racers is a
      $3$-permutation: $P(12,3)=12\cdot11\cdot10=1320$. The letters of
      BANANA — three A's, two N's, one B, six letters total — rearrange in
      $6!/(3!\,2!\,1!)=720/12=60$ distinguishable ways.
    interview: >
      Ordering questions are phrased as "how many ways can you
      arrange/rank/seat..." — listen for whether every object is used (plain
      $n!$) or only some are (the falling factorial $P(n,k)$), and whether
      any items repeat (the multiset division). Saying "$n!/(n-k)!$, which is
      $k$ falling factors starting at $n$" out loud is the fluency check.
    pitfalls: >
      Using $n!$ when only $k$ of $n$ slots are filled overcounts by a factor
      of $(n-k)!$. Forgetting the division by $n_1!\cdots n_r!$ for repeated
      items — or dividing by the wrong factorial when items have different
      multiplicities — is the standard multiset slip.
    recap: >
      $n$ distinct objects order in $n!$ ways, $k$ of them in
      $P(n,k)=n!/(n-k)!$, and a multiset divides that labelled count by the
      repeats' internal permutations.
    steps:
      - teach: >
          Filling slots one at a time turns the multiplication principle
          into a factorial: the first slot has $n$ candidates, the second
          has $n-1$ since one candidate is already used, and continuing down
          to the last slot multiplies out to $n!$ full orderings of $n$
          distinct objects.
      - teach: >
          Stopping the slot-filling after $k$ slots instead of continuing to
          the last one gives the $k$-permutation count
          $P(n,k)=n(n-1)\cdots(n-k+1)$ — exactly $k$ falling factors starting
          at $n$, which equals $n!/(n-k)!$ once you multiply and divide by
          the unused $(n-k)!$ tail.
      - teach: >
          A robotics club with $9$ members elects a president, a vice
          president, and a treasurer from among themselves — three distinct
          roles, each held by a different member, filled from the same
          $9$-person pool.
      - ask: >
          How many ways can the club fill the three roles?
        expects: "504"
        hint: >
          Fill president, then vice president, then treasurer, one slot at a
          time.
        feedback: >
          $P(9,3)=9\cdot8\cdot7=504$: three falling factors starting at $9$.
      - teach: >
          When some of the $n$ objects are identical, imagine labelling the
          copies within each type as if they were distinguishable; that
          labelled version has $n!$ orderings, and every true arrangement is
          produced by exactly $n_1!\cdots n_r!$ of those labelled orderings
          — once per way to permute the labels inside each type without
          changing what you see — so dividing by that factor removes the
          artificial distinctions.
      - ask: >
          How many distinguishable ways can the letters of ALABAMA be
          arranged?
        expects: "210"
        hint: >
          Count the total letters, then divide by the factorial of each
          repeated letter's count.
        feedback: >
          ALABAMA has $7$ letters with $A$ repeated $4$ times and every
          other letter appearing once, so the count is $7!/4!=5040/24=210$.
      - teach: >
          Two slips recur constantly: using plain $n!$ when only $k$ of $n$
          slots are actually filled overcounts by the unused $(n-k)!$ tail,
          and dividing by the wrong factorial for repeated items — or
          forgetting the division altogether — is the standard multiset
          error.
      - ask: >
          A word-game rack holds $7$ distinct tiles, but only $4$ tiles fit
          on the display bar, and the order they sit in matters. Which count
          is correct?
        choices:
          - text: >
              $7! = 5040$
            feedback: >
              This counts arrangements of all $7$ tiles, but only $4$ slots
              are actually filled on the bar.
          - text: >
              $P(7,4) = 7\cdot6\cdot5\cdot4 = 840$
            correct: true
            feedback: >
              Right — four falling factors starting at $7$, exactly the
              tiles that reach the display.
          - text: >
              $7!/4! = 210$
            feedback: >
              This divides by $4!$, the size of the filled slots, rather
              than by the leftover $(7-4)!=3!$ — the two are easy to swap.
        feedback: >
          Only $4$ of the $7$ slots are filled, so it's
          $P(7,4)=7\cdot6\cdot5\cdot4=840$, not the full $7!$ and not a
          division by the wrong factorial.

  - node: quant-probability.counting.circular-arrangements
    hook: >
      Round-table and necklace questions are permutation problems wearing a
      twist — the moment you see "only relative position matters," the fix
      is dividing out the symmetry rather than recounting from scratch.
    explanation: >
      Seat $n$ distinct people in a row and there are $n!$ orderings, by the
      permutation count. Now glue the row into a circle: each circular
      arrangement corresponds to exactly $n$ different row arrangements — one
      per rotation, since sliding everyone around the same circle produces
      $n$ distinct linear lists but only one seating pattern. Dividing the
      labelled row count by that constant overcount of $n$ gives
      $n!/n=(n-1)!$ circular arrangements, the same "count the easy labelled
      version, then divide by the overcount" move behind the multiset
      permutation formula.

      A necklace or key ring adds a second symmetry: flipping it over
      reverses the cyclic order but leaves the physical object unchanged, so
      every arrangement is produced twice — once per direction of travel —
      and the count halves again to $(n-1)!/2$, valid once $n\ge3$ so a
      rotation is never confused with a reflection.

      The recurring trick for "these two must sit together" variants is to
      glue the pair into one block, count arrangements of the now-smaller set
      of units, then multiply by the $2$ internal orders of the block — fix a
      subset's relative order, then free its internal order, which is what
      most seating-constraint interview questions reduce to.
    worked: >
      Seven distinct beads threaded onto a necklace (rotations and flips
      identical) string in $(7-1)!/2=720/2=360$ distinguishable necklaces.
      Eight people seated at a round table, with two particular people
      insisting on sitting apart: $7!=5040$ total seatings, minus the
      $6!\cdot2=1440$ with them adjacent (glue the pair, arrange $7$ units,
      free the pair's internal order), leaving $5040-1440=3600$ seatings with
      them apart.
    interview: >
      Circular and necklace phrasing ("seated at a round table," "beads on a
      bracelet") is the trigger to divide by $n$ (rotation) or $2n$ (rotation
      and flip) rather than treat the count as $n!$ — interviewers listen for
      you naming which symmetry you're dividing out before writing a formula.
    pitfalls: >
      Treating a round-table seating as $n!$ instead of $(n-1)!$ ignores that
      rotations of the same seating are not distinct. Halving for reflection
      when the object is a table (which cannot physically flip) rather than
      a necklace or bracelet applies a symmetry that isn't actually there.
    recap: >
      A circle divides the linear count by $n$ for rotation, and by a
      further $2$ if the arrangement can also be flipped, giving $(n-1)!$
      and $(n-1)!/2$.
    steps:
      - teach: >
          A row of $n$ distinct people has $n!$ orderings, but glue the row
          into a circle and every seating pattern now corresponds to $n$
          different row arrangements — one per rotation — so the row count
          overcounts circular seatings by exactly that rotational factor.
      - teach: >
          Dividing the row count by the overcount of $n$ gives
          $n!/n=(n-1)!$ distinguishable circular arrangements. Letting the
          arrangement also be flipped over, as with a necklace or key ring,
          doubles the overcount to $2n$ and halves the count again, to
          $(n-1)!/2$, valid once $n\ge3$.
      - teach: >
          Five distinct charms are strung onto a bracelet, where rotating or
          flipping the bracelet produces the same physical object.
      - ask: >
          How many distinguishable bracelets can be made from the five
          charms?
        expects: "12"
        hint: >
          Start from the row count $5!$, divide by $5$ for rotation, then by
          $2$ more for the flip.
        feedback: >
          $(5-1)!/2 = 24/2 = 12$: divide the row count by the $5$ rotations
          and then by the $2$-fold flip.
      - teach: >
          Forcing two specific people to sit together is the same "fix a
          relative order, then free the internal order" move seen
          elsewhere: glue the pair into a single block, arrange the
          resulting smaller set of units around the circle, then multiply
          by the $2$ internal orders the glued pair can take.
      - ask: >
          Seven distinct friends sit at a round table. Two of them, Ana and
          Ben, insist on sitting next to each other. How many seatings put
          them together?
        expects: "240"
        hint: >
          Glue Ana and Ben into one block, seat the resulting six units
          around the table, then free the block's internal order.
        feedback: >
          Six units (the glued pair plus the other five people) seat in
          $(6-1)!=120$ ways, and the pair can face either direction, so
          $120\cdot2=240$.
      - teach: >
          Two mistakes are worth keeping apart: treating a round-table
          seating as the full $n!$ instead of $(n-1)!$ ignores that
          rotations of the same seating aren't distinct, and halving for a
          flip when the object genuinely can't be turned over — a table,
          not a necklace — divides out a symmetry that was never there.
      - ask: >
          Eight distinct guests are seated at a round table that cannot be
          physically flipped. Which of these correctly counts the seatings?
        choices:
          - text: >
              $8! = 40320$
            feedback: >
              This treats every rotation of the same seating as a different
              arrangement.
          - text: >
              $(8-1)! = 5040$
            correct: true
            feedback: >
              Right — divide the row count by the $8$ rotations, and stop
              there, since a table can't be flipped over.
          - text: >
              $(8-1)!/2 = 2520$
            feedback: >
              Halving for a flip only applies to an object that can
              genuinely be turned over, like a necklace; a table can't, so
              this divides out a symmetry that isn't there.
        feedback: >
          A round table only has rotational symmetry, so the count is
          $(8-1)! = 5040$ — no further halving, since flipping isn't
          physically meaningful here.

  - node: quant-probability.counting.combinations
    hook: >
      Combinations are the single most-used object in this unit — almost
      every later technique (multinomial, stars and bars,
      inclusion–exclusion, poker hands) is combinations counted from a
      different angle, so the derivation here has to be automatic.
    explanation: >
      Choosing an unordered $k$-element subset from $n$ items is a coarser
      question than ordering $k$ of them: the $k$-permutation count $P(n,k)$
      picks out the same subset once for every one of its $k!$ internal
      orderings, so dividing removes the ordering information and leaves
      $\binom{n}{k}=P(n,k)/k!=n!/(k!(n-k)!)$ — the labelled-count-divided
      by overcount move again, this time with overcount factor $k!$
      instead of $n$ or $n_1!\cdots n_r!$.

      The boundary values follow from direct enumeration: exactly one subset
      of size $0$ (the empty set) and one of size $n$ (everything), so
      $\binom{n}{0}=\binom{n}{n}=1$; exactly $n$ subsets of size $1$, one per
      element; and no subset of size $k>n$ exists at all, so
      $\binom{n}{k}=0$.

      Symmetry falls out of a bijection rather than algebra: choosing which
      $k$ elements to include is the same act as choosing which $n-k$
      elements to exclude, so $\binom{n}{k}=\binom{n}{n-k}$. Pascal's rule
      comes from conditioning on one fixed element: subsets of size $k$
      either include it, leaving $k-1$ more to choose from the other $n-1$
      ($\binom{n-1}{k-1}$ ways), or exclude it, leaving all $k$ to choose
      from the other $n-1$ ($\binom{n-1}{k}$ ways) — disjoint, exhaustive
      cases that add.
    worked: >
      A study group of $15$ students picks a $4$-person team:
      $\binom{15}{4}=1365$. Pascal's rule cross-checks a smaller case:
      $\binom{6}{2}=\binom{5}{1}+\binom{5}{2}=5+10=15$, matching the direct
      computation $6!/(2!\,4!)=15$.
    interview: >
      "How many ways to choose a committee/team/subset of size $k$" is
      answered with $\binom{n}{k}$ cold, and interviewers often follow up
      with "why not $k!$ times that" — because a committee has no internal
      order, so the $k!$ orderings the permutation count included all
      describe the same committee.
    pitfalls: >
      Using $\binom{n}{k}$ when the problem actually cares about order
      (assigning distinct roles, not an anonymous group) undercounts by the
      missing $k!$ factor. Forgetting the $\binom{n}{k}=0$ boundary for
      $k>n$ produces nonsense in a downstream inclusion–exclusion sum.
    recap: >
      $\binom{n}{k}=n!/(k!(n-k)!)$ counts unordered subsets by dividing the
      ordered count by $k!$, and it obeys $\binom{n}{k}=\binom{n}{n-k}$ and
      Pascal's addition rule by construction.
    steps:
      - teach: >
          Choosing an unordered subset is a coarser question than ordering
          one: the $k$-permutation count $P(n,k)$ picks out the same subset
          once for every one of its $k!$ internal orderings, so dividing by
          that overcount removes the ordering information entirely.
      - teach: >
          $\binom{n}{k}=P(n,k)/k!=n!/(k!(n-k)!)$ counts unordered
          $k$-subsets. At the boundaries, $\binom{n}{0}=\binom{n}{n}=1$
          (only the empty set or the whole set), $\binom{n}{1}=n$ (one
          subset per element), and $\binom{n}{k}=0$ once $k>n$, since no
          subset can be bigger than the set itself.
      - teach: >
          A book club of $11$ members needs to pick a $3$-person reading
          committee — an unordered subset, since no member of the committee
          holds a distinct role.
      - ask: >
          How many different reading committees are possible?
        expects: "165"
        hint: >
          Divide the ordered count $P(11,3)$ by the $3!$ orderings that
          describe the same committee.
        feedback: >
          $\binom{11}{3} = 11!/(3!\,8!) = 165$.
      - teach: >
          Symmetry, $\binom{n}{k}=\binom{n}{n-k}$, is a bijection rather
          than algebra: choosing which $k$ elements to include is the same
          act as choosing which $n-k$ to leave out. Pascal's rule splits on
          one fixed element — it's either in the subset, leaving
          $\binom{n-1}{k-1}$ ways to fill the rest, or it isn't, leaving
          $\binom{n-1}{k}$ ways — two disjoint, exhaustive cases that add.
      - ask: >
          Using Pascal's rule, what is $\binom{7}{3}$, given
          $\binom{6}{2}=15$ and $\binom{6}{3}=20$?
        expects: "35"
        hint: >
          Pascal's rule adds the two smaller combinations directly — no
          factorials needed.
        feedback: >
          $\binom{7}{3}=\binom{6}{2}+\binom{6}{3}=15+20=35$, matching the
          direct computation $7!/(3!\,4!)=35$.
      - teach: >
          Two slips recur: reaching for $\binom{n}{k}$ when the problem
          actually assigns distinct roles undercounts by the missing $k!$
          factor, and forgetting that $\binom{n}{k}=0$ once $k$ exceeds $n$
          produces nonsense if it's left unchecked inside a larger sum.
      - ask: >
          A $5$-person group needs a president and a separate treasurer,
          two distinct roles, chosen from the $5$ people. Which count is
          correct?
        choices:
          - text: >
              $\binom{5}{2}=10$
            feedback: >
              This is the unordered count of which two people get some
              role, but president and treasurer are distinct roles, so
              order among the chosen two matters.
          - text: >
              $P(5,2)=20$
            correct: true
            feedback: >
              Right — the two roles are distinguishable, so this is an
              ordered pick: $5\cdot4=20$.
          - text: >
              $5!=120$
            feedback: >
              This fills all $5$ slots with distinct roles, but only $2$
              roles actually exist here.
        feedback: >
          Distinct roles need an ordered count, $P(5,2)=5\cdot4=20$, not the
          unordered $\binom{5}{2}=10$.

  - node: quant-probability.counting.symmetry-division
    hook: >
      This is the pattern you've already used twice — the multiset
      permutation count and the circular count both secretly did this — now
      named explicitly so you can recognize when it applies and, just as
      importantly, when it silently fails.
    explanation: >
      Every unordered count so far has followed the same two-step recipe:
      count the labelled, ordered version — easy, since the multiplication
      principle applies directly — then divide by however many labelled
      versions correspond to one true, unlabelled object. A committee
      divided the ordered pick $P(n,k)$ by $k!$, since order among the
      chosen doesn't matter but was counted $k!$ times. A round-table seating
      divided the row count $n!$ by $n$, since one seating pattern was
      counted once per rotation.

      The division step is only legal when that overcounting factor is
      identical for every object being counted. Splitting six distinct
      people into two unlabelled teams of three: there are
      $\binom{6}{3}\binom{3}{3}=20$ ways to name a first team and a second,
      and every actual split into two teams is produced exactly $2!=2$
      times — once per order the two teams could be listed in — so the true
      count is $20/2=10$, division legal because both teams have the same
      size and hence the same overcount.

      Split six people into an unlabelled team of $2$ and an unlabelled team
      of $4$ instead, and no division is needed at all:
      $\binom{6}{2}\binom{4}{4}=15$ already counts each split exactly once,
      since a team of $2$ can never be mistaken for a team of $4$. The
      general rule: divide by $m!$ only when $m$ of the labelled pieces are
      truly interchangeable — same size, same role — and never when a size
      or role difference already keeps them distinct.
    worked: >
      Split eight distinct books into two unlabelled piles of four:
      $\binom{8}{4}\binom{4}{4}=70$ ordered pilings, each unlabelled split
      counted twice, so $70/2=35$ true splits. Splitting the same eight
      books into one pile of $3$ and one pile of $5$ needs no division:
      $\binom{8}{3}\binom{5}{5}=56$ is already the answer.
    interview: >
      The tell is "unlabelled" or "identical" attached to groups, teams, or
      pairs rather than to items — dividing by the extra symmetry is the
      fix, and interviewers listen for you checking that every group being
      merged this way has the same size before dividing.
    pitfalls: >
      Dividing by $2!$ (or $m!$) when the groups have different sizes
      double-divides a count that was never overcounted in the first place.
      Applying a single division factor to a structure where some elements
      have their own internal symmetry undercounts less symmetric objects
      along with the more symmetric ones.
    recap: >
      Count the labelled version, then divide by $m!$ — but only when
      exactly $m$ of the pieces are truly interchangeable in size and role;
      unequal groups need no division at all.
    steps:
      - teach: >
          The multiset permutation count and the circular count both
          secretly used the same recipe: count the easy labelled, ordered
          version first, then divide by however many labelled versions
          correspond to one true unlabelled object.
      - teach: >
          That division step is only legal when the overcounting factor is
          identical for every object being counted — dividing by $m!$
          removes exactly the $m!$ ways to reorder $m$ truly interchangeable
          pieces, so it fails the moment the pieces being merged aren't all
          the same size or role.
      - teach: >
          Ten distinct students split into two unlabelled study groups of
          five each — no group is designated "first" or "second."
      - ask: >
          How many ways can the ten students be split into two unlabelled
          groups of five?
        expects: "126"
        hint: >
          Count the labelled split first (name a "group A" and a "group
          B"), then divide by the number of ways to swap the two group
          labels.
        feedback: >
          $\binom{10}{5}\binom{5}{5}=252$ labelled splits, each unlabelled
          split counted twice (once per which group is called "A"), so
          $252/2=126$.
      - teach: >
          The moment the groups differ in size or role, the division step
          disappears entirely: a size-$3$ group can never be mistaken for a
          size-$7$ group, so no relabelling produces the same split twice,
          and the labelled count is already the final answer.
      - ask: >
          Ten distinct students split into one unlabelled group of $3$ and
          one unlabelled group of $7$. How many ways?
        expects: "120"
        hint: >
          The two groups have different sizes, so no relabelling produces
          the same split twice — check whether any division is actually
          needed here.
        feedback: >
          $\binom{10}{3}\binom{7}{7}=120$ already counts each split exactly
          once, since a group of $3$ can't be confused with a group of $7$
          — no division.
      - teach: >
          Dividing by $2!$ out of habit, without checking the group sizes
          match, silently halves a count that was never overcounted — and
          the reverse mistake, applying one division factor where some
          pieces carry their own internal symmetry, undercounts the less
          symmetric pieces along with the more symmetric ones.
      - ask: >
          Twelve distinct students split into an unlabelled group of $6$
          and a second unlabelled group of $6$. Which expression correctly
          counts the splits?
        choices:
          - text: >
              $\binom{12}{6}\binom{6}{6}$
            feedback: >
              This counts a labelled split (naming a "first" six and
              "second" six), and both groups have the same size, so it
              double-counts each true split.
          - text: >
              $\dfrac{1}{2}\binom{12}{6}\binom{6}{6}$
            correct: true
            feedback: >
              Right — the two groups are the same size, so divide the
              labelled split by $2!$ to remove the relabelling.
          - text: >
              $\binom{12}{6}$
            feedback: >
              This picks one group of six but never accounts for what
              happens to the other six people at all.
        feedback: >
          Both groups have size $6$, so divide the labelled split by $2!$:
          $\binom{12}{6}\binom{6}{6}/2 = 924/2 = 462$.

  - node: quant-probability.counting.multinomial
    hook: >
      Multinomial coefficients are what "divide labelled groups into more
      than two piles" turns into once you stop reaching for combinations
      twice in a row and use the one formula built for exactly this.
    explanation: >
      Splitting $n$ distinct items into labelled groups of sizes
      $n_1,\dots,n_k$ is a sequence of ordinary combinations: choose the
      $n_1$ items for group one in $\binom{n}{n_1}$ ways, then the $n_2$
      items for group two from what's left in $\binom{n-n_1}{n_2}$ ways, and
      so on. Expanding every binomial coefficient as a ratio of factorials,
      every intermediate factorial cancels except the numerator $n!$ and the
      group-size factorials in the denominators, leaving
      $n!/(n_1!\,n_2!\cdots n_k!)$ — the telescoping is the whole proof, and
      $k=2$ recovers $\binom{n}{n_1}$ exactly.

      The same number answers what looks like a different question:
      arranging a multiset with $n_1$ copies of one symbol, $n_2$ of
      another, and so on is equivalent to choosing which $n_1$ of the $n$
      positions get the first symbol, which $n_2$ of the remainder get the
      second, and so forth — the group-splitting problem with "items"
      relabelled as "positions." That's why the multiset arrangement formula
      and the multinomial coefficient are the same formula seen from two
      directions.

      The multinomial theorem is the algebraic shadow of the same counting
      fact: expanding $(x_1+\cdots+x_k)^n$ as a product of $n$ identical
      factors, the coefficient of $x_1^{n_1}\cdots x_k^{n_k}$ counts the ways
      to choose, from each of the $n$ factors, which variable it
      contributes — exactly a labelled split of the $n$ factors into groups
      of sizes $n_1,\dots,n_k$.
    worked: >
      A theater troupe of $9$ actors splits into a group of $4$ for act one,
      $3$ for act two, and $2$ for act three (labelled acts):
      $9!/(4!\,3!\,2!)=362880/288=1260$ ways. The word LETTER has two E's,
      two T's, and one each of L and R, six letters total, so it rearranges
      in $6!/(2!\,2!)=720/4=180$ distinct spellings.
    interview: >
      "How many ways to split a group into a team of $a$, a team of $b$, and
      a team of $c$ (playing different roles)" or "how many arrangements of
      this word with repeated letters" both want the multinomial coefficient
      by name, with the denominator matching the group or letter
      multiplicities exactly.
    pitfalls: >
      Forgetting a group's factorial in the denominator changes the answer,
      even a size-$1$ group's harmless-looking $1!$. Using the multinomial
      formula when the groups are actually unlabelled overcounts by the
      number of ways to permute equal-sized groups among themselves; that
      extra division is a separate step.
    recap: >
      $n!/(n_1!\cdots n_k!)$ counts labelled splits of $n$ items into groups
      of fixed sizes and, read as a positions-to-symbols assignment, is
      exactly the multiset arrangement count.
    steps:
      - teach: >
          Splitting $n$ distinct items into labelled groups of sizes
          $n_1,\dots,n_k$ is a sequence of ordinary combinations chained
          together — choose group one's items from everyone, then group
          two's from what's left, and so on — so the multinomial
          coefficient is combinations doing the same job it always does,
          just repeated.
      - teach: >
          Expanding each binomial coefficient as a ratio of factorials,
          $\binom{n}{n_1}\binom{n-n_1}{n_2}\cdots$, every intermediate
          factorial cancels except the numerator $n!$ and the group-size
          factorials in the denominators, leaving
          $n!/(n_1!\,n_2!\cdots n_k!)$ — the telescoping *is* the proof, and
          $k=2$ recovers the ordinary $\binom{n}{n_1}$.
      - teach: >
          Eight students split into three labelled project teams: Team A
          gets $3$ students, Team B gets $3$, and Team C gets $2$.
      - ask: >
          How many ways can the eight students be split into these three
          labelled teams?
        expects: "560"
        hint: >
          Divide $8!$ by the factorial of each team's size.
        feedback: >
          $8!/(3!\,3!\,2!) = 40320/72 = 560$.
      - teach: >
          The same number answers a seemingly different question: arranging
          a multiset with $n_1$ copies of one symbol and $n_2$ of another is
          exactly choosing which $n_1$ of the $n$ positions hold the first
          symbol, then which $n_2$ of what's left hold the second — the
          group-splitting problem with "items" relabelled as "positions."
      - ask: >
          How many distinct arrangements does the word KAYAK have ($K$
          appears twice, $A$ appears twice, $Y$ once)?
        expects: "30"
        hint: >
          Divide the total letters' factorial by the factorial of each
          repeated letter's count.
        feedback: >
          KAYAK has $5$ letters with $K$ and $A$ each repeated twice, so
          $5!/(2!\,2!\,1!) = 120/4 = 30$.
      - teach: >
          Forgetting a group's factorial in the denominator changes the
          answer — even a size-$1$ group's harmless-looking $1!$ matters if
          it's dropped. And using this formula when the groups are actually
          unlabelled overcounts, since permuting equal-sized groups among
          themselves needs an extra division this formula doesn't include.
      - ask: >
          Nine distinct books are split into three unlabelled piles of
          three each. Which correctly counts the splits?
        choices:
          - text: >
              $9!/(3!\,3!\,3!)=1680$
            feedback: >
              This is the labelled split (naming pile one, two, three); the
              piles here are unlabelled, so it triple-counts each true
              split.
          - text: >
              $9!/(3!\,3!\,3!\,3!)=280$
            correct: true
            feedback: >
              Right — the labelled multinomial split divided by $3!$, the
              number of ways to relabel three same-size interchangeable
              piles.
          - text: >
              $9!/(3!\,3!\,3!\,2!)=840$
            feedback: >
              There are three interchangeable piles here, not two, so the
              relabelling factor should be $3!$, not $2!$.
        feedback: >
          All three piles are size $3$ and unlabelled, so divide the
          labelled multinomial split by $3!=6$: $1680/6=280$.

  - node: quant-probability.counting.binomial-theorem
    hook: >
      The substitutions $x=y=1$ and $x=-1,y=1$ turn one expansion formula
      into two of the most quoted identities in the interview canon — row
      sums and the vanishing alternating sum — so the derivation is worth
      being able to redo from scratch.
    explanation: >
      Expanding $(x+y)^n$ means multiplying out $n$ identical factors
      $(x+y)(x+y)\cdots(x+y)$ and collecting like terms. Picking one term
      from the expansion means picking, from each of the $n$ factors, either
      its $x$ or its $y$ — exactly like choosing a subset of the $n$
      factor-positions to be the ones that contribute $x$. A monomial
      $x^ky^{n-k}$ arises once for every way to choose which $k$ of the $n$
      factors were the $x$-contributors, and that count is $\binom{n}{k}$ by
      definition — so the coefficient of $x^ky^{n-k}$ in the fully expanded
      sum is exactly $\binom{n}{k}$, with no algebra beyond counting
      required.

      Setting $x=y=1$ turns every monomial into $1$, so
      $\sum_k\binom{n}{k}=2^n$: choosing which factors contribute an "$x$" is
      literally choosing a subset of an $n$-element set, and there are $2^n$
      subsets total by the multiplication principle applied to $n$
      independent in-or-out decisions.

      Setting $x=-1$, $y=1$ instead gives $\sum_k(-1)^k\binom{n}{k}=0$ for
      $n\ge1$, since $(x+y)^n=(-1+1)^n=0^n=0$. Splitting the sum into its
      positive (even $k$) and negative (odd $k$) parts shows the count of
      even-sized subsets exactly equals the count of odd-sized ones — a fact
      with no obvious reason on its own, visible only once the substitution
      trick is in hand.
    worked: >
      The coefficient of $x^2$ in $(2+x)^6$ is $\binom{6}{2}\,2^4=15\cdot16
      =240$. As a check on the row-sum identity, the six binomial
      coefficients of that row are $1,6,15,20,15,6,1$, summing to
      $64=2^6$ exactly.
    interview: >
      "Find the coefficient of $x^k$ in $(a+bx)^n$" is answered directly
      from the counting proof — $\binom{n}{k}a^{n-k}b^k$ — and a common
      follow-up asks for $\sum_k\binom{n}{k}$ or the alternating sum cold,
      testing whether the two substitutions are memorized as a recipe or
      understood as one proof applied twice.
    pitfalls: >
      Forgetting that the coefficient carries $a^{n-k}b^k$, not just
      $\binom{n}{k}$, when the binomial isn't exactly $(x+y)^n$.
      Misremembering which substitution gives which identity — $x=y=1$ for
      the row sum, $x=-1,y=1$ for the vanishing alternating sum — swaps two
      very different answers.
    recap: >
      The coefficient of $x^ky^{n-k}$ in $(x+y)^n$ is $\binom{n}{k}$ because
      expanding is choosing, and $x=y=1$ / $x=-1,y=1$ turn that one fact
      into $2^n$ and $0$.
    steps:
      - teach: >
          Expanding $(x+y)^n$ means multiplying $n$ identical factors
          $(x+y)(x+y)\cdots(x+y)$ and collecting like terms. Picking one
          term from the product means picking, from each of the $n$
          factors, either its $x$ or its $y$ — exactly a choice of which
          factor-positions contribute an $x$.
      - teach: >
          A monomial $x^ky^{n-k}$ arises once for every way to choose which
          $k$ of the $n$ factors were the $x$-contributors, and that count
          is $\binom{n}{k}$ by definition — so the coefficient of
          $x^ky^{n-k}$ in the fully expanded sum is exactly $\binom{n}{k}$,
          with no algebra beyond counting required.
      - teach: >
          The coefficient of $x^2$ in $(3+x)^7$ comes from choosing which
          $2$ of the $7$ factors contribute the $x$, with the other $5$
          each contributing the constant $3$.
      - ask: >
          What is the coefficient of $x^2$ in $(3+x)^7$?
        expects: "5103"
        hint: >
          It's $\binom{7}{2}$ times $3$ raised to the power of the
          remaining $5$ factors.
        feedback: >
          $\binom{7}{2}\,3^{5} = 21 \cdot 243 = 5103$.
      - teach: >
          Setting $x=y=1$ turns every monomial into $1$, so
          $\sum_k\binom{n}{k}=2^n$ — choosing which factors contribute an
          "x" is literally choosing a subset of an $n$-element set. Setting
          $x=-1,y=1$ instead gives $\sum_k(-1)^k\binom{n}{k}=0$ for $n\ge1$,
          since $(x+y)^n=(-1+1)^n=0^n=0$.
      - ask: >
          What is $\sum_{k=0}^{7}\binom{7}{k}$?
        expects: "128"
        hint: >
          Set $x=y=1$ in the binomial theorem for $n=7$.
        feedback: >
          $\sum_k\binom{7}{k}=2^7=128$, the total number of subsets of a
          $7$-element set.
      - teach: >
          Two mix-ups recur: forgetting that the coefficient carries
          $a^{n-k}b^k$, not just $\binom{n}{k}$, whenever the binomial isn't
          exactly $(x+y)^n$; and swapping which substitution gives which
          identity — $x=y=1$ for the row sum, $x=-1,y=1$ for the vanishing
          alternating sum.
      - ask: >
          What is $\sum_{k=0}^{6}(-1)^k\binom{6}{k}$?
        expects: "0"
        hint: >
          This is the $x=-1$, $y=1$ substitution in $(x+y)^6$.
        feedback: >
          $(x+y)^6$ at $x=-1,y=1$ is $(-1+1)^6=0^6=0$, so the alternating
          sum of row $6$ vanishes.

  - node: quant-probability.counting.double-counting
    hook: >
      This is the fastest route to an unfamiliar identity mid-interview:
      instead of manipulating factorials, tell one counting story two
      different ways and read off the equation for free.
    explanation: >
      Double counting proves an identity by counting one and the same set of
      objects two different ways and setting the two expressions equal — no
      induction, no algebraic manipulation, just two honest counts of the
      same thing. Take a $k$-person committee with one designated chair,
      drawn from $n$ people. Counted one way: pick the committee first,
      $\binom{n}{k}$ ways, then pick the chair from within it, $k$ ways,
      giving $\binom{n}{k}k$. Counted the other way: pick the chair first,
      $n$ ways, then fill the remaining $k-1$ seats from the other $n-1$
      people, $\binom{n-1}{k-1}$ ways, giving $n\binom{n-1}{k-1}$. Both
      expressions count exactly the same set of (committee, chair) pairs, so
      $k\binom{n}{k}=n\binom{n-1}{k-1}$ — an identity that would take real
      algebra to verify from factorials directly but falls out immediately
      from the story.

      A bijection is the same idea run in reverse: instead of counting one
      set two ways, match your set one-to-one against a different set whose
      size you already know, which forces the two sizes to be equal. Subsets
      of an $n$-element set biject with binary strings of length $n$
      (include-or-exclude for each element is a $0$ or $1$), so both are
      counted by the same $2^n$ without redoing the counting argument.

      Reach for either move whenever an identity has a plausible story
      behind it — a set that can naturally be described two ways, or two
      sets that naturally pair up — since the story is typically faster than
      induction and, unlike an algebraic manipulation, never silently drops
      a factor partway through.
    worked: >
      How many diagonals does a convex hexagon have? Every pair of the $6$
      vertices is either an edge or a diagonal, so diagonals are pairs minus
      edges, $\binom{6}{2}-6=15-6=9$ — "all vertex pairs" split into the
      disjoint categories "adjacent" and "non-adjacent," with the adjacent
      count read directly off the hexagon's $6$ sides.
    interview: >
      "Prove this identity" with a binomial coefficient in it is an
      invitation to find the counting story rather than push symbols —
      interviewers reward "here's a set counted two ways" over a
      correct-but-opaque algebraic derivation, since it signals you
      understand what the formula counts.
    pitfalls: >
      Double counting a set that isn't quite the one in the identity —
      subtly changing what's being selected between the two counting
      methods — produces two expressions that don't actually match. A
      bijection has to be checked in both directions; a map that's only onto
      or only one-to-one doesn't establish equal sizes.
    recap: >
      Prove an identity by counting one set two ways, or by matching it
      one-to-one with a set you already know — both skip algebra entirely.
    steps:
      - teach: >
          Double counting proves an identity with no algebra at all: count
          one and the same set of objects two different ways, and the two
          resulting expressions must be equal, since they're both counting
          the identical collection.
      - teach: >
          Take a $k$-person committee with one designated chair, drawn from
          $n$ people. Counted one way — pick the committee first
          ($\binom{n}{k}$ ways), then the chair from within it ($k$ ways) —
          gives $\binom{n}{k}k$. Counted the other way — pick the chair
          first ($n$ ways), then fill the remaining $k-1$ seats from the
          other $n-1$ people ($\binom{n-1}{k-1}$ ways) — gives
          $n\binom{n-1}{k-1}$. Both expressions count the same (committee,
          chair) pairs.
      - teach: >
          A convex nonagon has $9$ vertices. Every pair of vertices is
          either an edge of the polygon or a diagonal, so "all vertex
          pairs" splits into exactly those two disjoint categories.
      - ask: >
          How many diagonals does a convex nonagon have?
        expects: "27"
        hint: >
          Count all vertex pairs, then subtract the pairs that are
          actually edges.
        feedback: >
          $\binom{9}{2}-9=36-9=27$: all pairs minus the $9$ edges read
          directly off the polygon's sides.
      - teach: >
          The chair identity, $k\binom{n}{k}=n\binom{n-1}{k-1}$, would take
          real algebraic manipulation to verify from factorials directly,
          but it falls out immediately once both sides are recognized as
          counting the same set of pairs — that's the leverage double
          counting offers over pushing symbols.
      - ask: >
          For a club of $8$ people forming a $3$-person committee with one
          chair, what is $3\binom{8}{3}$?
        expects: "168"
        hint: >
          Compute $\binom{8}{3}$ first, then multiply by $3$.
        feedback: >
          $3\binom{8}{3}=3\cdot56=168$, matching the other counting order
          $8\binom{7}{2}=8\cdot21=168$.
      - teach: >
          A double count only works when both sides genuinely describe the
          identical set — subtly changing what's being selected between the
          two counting methods produces two expressions that don't actually
          match, and a bijection has to be checked in both directions,
          since a map that's only onto or only one-to-one doesn't establish
          equal sizes.
      - ask: >
          To prove $\binom{n}{k}=\binom{n}{n-k}$ using double counting,
          which counting story works?
        choices:
          - text: >
              Count subsets of size $k$ two different times using the same
              formula
            feedback: >
              This isn't two independent stories — it's the same count
              restated, so it proves nothing new.
          - text: >
              Count subsets of size $k$ directly, and separately count them
              by first choosing which $n-k$ elements to exclude
            correct: true
            feedback: >
              Right — both counts describe exactly the same collection of
              subsets, built by two different rules, forcing
              $\binom{n}{k}=\binom{n}{n-k}$.
          - text: >
              Count subsets of size $k$, then count subsets of size $k+1$,
              and compare
            feedback: >
              These are different sets entirely, since they have different
              sizes, so equating their counts doesn't establish anything
              about $\binom{n}{k}$ alone.
        feedback: >
          A valid double count has to describe the identical set of
          objects two ways — choosing which $k$ to include is the same act
          as choosing which $n-k$ to exclude, exactly the bijection behind
          $\binom{n}{k}=\binom{n}{n-k}$.

  - node: quant-probability.counting.binomial-identities
    hook: >
      Hockey stick and Vandermonde are the two identities interviewers
      expect you to recognize on sight inside a bigger problem, not derive
      from scratch under time pressure — but the one-line proof of each is
      what lets you rebuild it if memory fails.
    explanation: >
      Row sums and their alternating cousin were already established:
      $\sum_k\binom{n}{k}=2^n$ and, for $n\ge1$, the alternating sum
      vanishes. Two more identities are worth having cold, both provable by
      telling one counting story two ways.

      Hockey stick: $\sum_{i=r}^{n}\binom{i}{r}=\binom{n+1}{r+1}$. Count the
      $(r+1)$-element subsets of $\{0,1,\dots,n\}$ directly: there are
      $\binom{n+1}{r+1}$ of them. Now classify each one by its largest
      element $i$ — the other $r$ elements must come from
      $\{0,\dots,i-1\}$, so there are $\binom{i}{r}$ subsets with largest
      element $i$, and $i$ ranges from $r$ up to $n$. Summing over that
      classification gives the left side, and both sides count the
      identical collection of subsets.

      Vandermonde: $\sum_k\binom{m}{k}\binom{n}{p-k}=\binom{m+n}{p}$.
      Choosing a $p$-person team from $m$ men and $n$ women is
      $\binom{m+n}{p}$ directly, or count by first fixing how many of the
      $p$ spots, $k$, go to men — $\binom{m}{k}\binom{n}{p-k}$ — and summing
      over every split $k$. Taking $m=n=p$ pairs each $\binom{n}{k}$ with
      $\binom{n}{n-k}=\binom{n}{k}$, giving the sum-of-squares corollary
      $\sum_k\binom{n}{k}^2=\binom{2n}{n}$.
    worked: >
      Vandermonde with $m=3$, $n=2$, $p=3$: the left side is
      $\binom{3}{1}\binom{2}{2}+\binom{3}{2}\binom{2}{1}+\binom{3}{3}
      \binom{2}{0}=3+6+1=10$ (the $k=0$ term vanishes since
      $\binom{2}{3}=0$), matching $\binom{5}{3}=10$. Hockey stick with
      $r=2$, $n=5$: $\binom{2}{2}+\binom{3}{2}+\binom{4}{2}+\binom{5}{2}
      =1+3+6+10=20$, matching $\binom{6}{3}=20$.
    interview: >
      These show up mid-problem, not as standalone questions — a sum of
      products of binomial coefficients is a cue to recognize the
      Vandermonde shape, and a running total across a column of Pascal's
      triangle is the hockey-stick shape.
    pitfalls: >
      Misindexing the hockey stick's starting point (it starts at $i=r$, not
      $i=0$) is a common misquote. Applying Vandermonde with mismatched
      totals — letting $k$ range past where either binomial coefficient
      vanishes — adds spurious terms.
    recap: >
      Hockey stick sums a column of Pascal's triangle to $\binom{n+1}{r+1}$,
      and Vandermonde convolves two rows into $\binom{m+n}{p}$, both proved
      by counting the same selection two ways.
    steps:
      - teach: >
          Row sums and the vanishing alternating sum came for free from the
          binomial theorem's own substitutions. Two further identities are
          worth having cold, and both are proved the same way as the
          committee-chair identity: tell one counting story two ways.
      - teach: >
          Hockey stick, $\sum_{i=r}^{n}\binom{i}{r}=\binom{n+1}{r+1}$: count
          the $(r+1)$-subsets of $\{0,\dots,n\}$ directly, giving
          $\binom{n+1}{r+1}$; then classify each one by its largest element
          $i$ — the other $r$ elements come from $\{0,\dots,i-1\}$, giving
          $\binom{i}{r}$ subsets per value of $i$ — and summing that
          classification over $i=r,\dots,n$ reproduces the left side.
      - teach: >
          The column $\binom{3}{3},\binom{4}{3},\binom{5}{3},\binom{6}{3}$
          runs straight down Pascal's triangle at fixed $r=3$, so the
          hockey stick says this running sum should collapse to a single
          binomial coefficient one row and one column further over.
      - ask: >
          What is $\binom{3}{3}+\binom{4}{3}+\binom{5}{3}+\binom{6}{3}$?
        expects: "35"
        hint: >
          By the hockey stick, this column sums to a single binomial
          coefficient one row and one column over.
        feedback: >
          $1+4+10+20=35$, matching $\binom{7}{4}=35$ — the hockey-stick
          identity with $r=3$, $n=6$.
      - teach: >
          Vandermonde, $\sum_k\binom{m}{k}\binom{n}{p-k}=\binom{m+n}{p}$:
          choosing a $p$-person team from $m$ men and $n$ women is
          $\binom{m+n}{p}$ directly, or count by fixing how many of the $p$
          spots, $k$, go to men — $\binom{m}{k}\binom{n}{p-k}$ — and summing
          over every split. Taking $m=n=p$ pairs $\binom{n}{k}$ with
          $\binom{n}{n-k}=\binom{n}{k}$, giving the corollary
          $\sum_k\binom{n}{k}^2=\binom{2n}{n}$.
      - ask: >
          A $2$-person team is chosen from $4$ men and $3$ women. What is
          $\sum_{k=0}^{2}\binom{4}{k}\binom{3}{2-k}$?
        expects: "21"
        hint: >
          This sum, split by how many of the two spots go to men, should
          match a single direct combination count.
        feedback: >
          $1\cdot3+4\cdot3+6\cdot1=3+12+6=21$, matching the direct count
          $\binom{7}{2}=21$.
      - teach: >
          Two misquotes recur: starting the hockey stick's sum at $i=0$
          instead of $i=r$, and letting $k$ range past where either
          binomial coefficient in Vandermonde's sum has already vanished,
          which adds spurious terms.
      - ask: >
          Which correctly states the hockey-stick identity?
        choices:
          - text: >
              $\sum_{i=0}^{n}\binom{i}{r}=\binom{n+1}{r+1}$
            feedback: >
              The sum has to start at $i=r$ — terms with $i<r$ are
              $\binom{i}{r}=0$ anyway, but writing the bound wrong is the
              standard misquote.
          - text: >
              $\sum_{i=r}^{n}\binom{i}{r}=\binom{n+1}{r+1}$
            correct: true
            feedback: >
              Right — classify each $(r+1)$-subset of $\{0,\dots,n\}$ by its
              largest element, which only ranges from $r$ to $n$.
          - text: >
              $\sum_{i=r}^{n}\binom{i}{r}=\binom{n}{r+1}$
            feedback: >
              The right side is one row too low — the direct count is over
              $\{0,\dots,n\}$, an $(n+1)$-element set, giving
              $\binom{n+1}{r+1}$.
        feedback: >
          The correct statement is $\sum_{i=r}^{n}\binom{i}{r}=
          \binom{n+1}{r+1}$, with the sum starting at $i=r$ and the right
          side one row above $n$.

  - node: quant-probability.counting.stars-bars
    hook: >
      "How many ways to distribute identical items" is one of the most
      common interview counting phrasings, and stars and bars turns it into
      a single binomial coefficient the moment you see the bijection.
    explanation: >
      A distribution of $n$ identical items among $k$ labelled boxes is
      fully described by $(x_1,\dots,x_k)$ with $x_1+\cdots+x_k=n$ and each
      $x_i\ge0$. Encode it as a string of $n$ stars and $k-1$ bars, where the
      bars cut the row of stars into $k$ runs — the stars before the first
      bar are box $1$'s contents, and so on. This encoding is a bijection:
      every distribution produces exactly one such string, and every string
      decodes back to exactly one distribution. Counting the strings is now
      a combinations question — the string has $n+k-1$ total symbols, and it
      is determined completely by which $k-1$ of those positions are bars —
      giving $\binom{n+k-1}{k-1}$.

      Requiring every box nonempty, $x_i\ge1$, is a change of variables: set
      $y_i=x_i-1\ge0$, so $y_1+\cdots+y_k=n-k$, and the nonnegative formula
      applied to this shifted problem gives $\binom{n-1}{k-1}$. The same
      count has a direct picture too: with the $n$ stars already laid out,
      there are only $n-1$ gaps strictly between consecutive stars, and
      placing one bar in each of $k-1$ of those gaps (never two in the same
      gap, which would create an empty box) is exactly $\binom{n-1}{k-1}$.

      Anything beyond a plain floor of zero or one needs more work: an upper
      cap like $x_i\le c$ isn't a simple substitution, since the trick above
      only handles a shifted lower bound, and caps are instead handled by
      inclusion–exclusion on the event that some box exceeds its cap.
    worked: >
      Fifteen identical stickers divided among $3$ kids, no restriction:
      $\binom{15+3-1}{3-1}=\binom{17}{2}=136$ ways. If every kid must get at
      least one sticker: $\binom{15-1}{3-1}=\binom{14}{2}=91$ ways.
    interview: >
      "How many ways to split $n$ identical coins/candies/units among $k$
      people/accounts" is the direct trigger; interviewers listen for you
      naming the bijection to stars and bars rather than enumerating, and
      for catching whether "at least one each" is implied by the wording.
    pitfalls: >
      Using $\binom{n+k-1}{k-1}$ when the problem actually requires every
      box nonempty (should be $\binom{n-1}{k-1}$) is the single most common
      slip. Applying stars and bars directly to a problem with an upper cap
      on some $x_i$ overcounts; caps need inclusion–exclusion layered on
      top, not a direct formula.
    recap: >
      $n$ identical items into $k$ labelled boxes: $\binom{n+k-1}{k-1}$
      nonnegative solutions, or $\binom{n-1}{k-1}$ if every box needs at
      least one.
    steps:
      - teach: >
          A distribution of $n$ identical items among $k$ labelled boxes is
          fully described by nonnegative integers $x_1,\dots,x_k$ summing
          to $n$. Encoding it as a row of $n$ stars cut by $k-1$ bars into
          $k$ runs is a bijection — every distribution gives exactly one
          such string, and every string decodes to exactly one
          distribution.
      - teach: >
          Counting the strings is now a combinations question: the string
          has $n+k-1$ total symbols, and it's determined completely by
          which $k-1$ of those positions hold bars, giving
          $\binom{n+k-1}{k-1}$ nonnegative solutions of
          $x_1+\cdots+x_k=n$.
      - teach: >
          Twelve identical tokens are distributed among $4$ players, with
          no restriction on how many tokens a player can receive, including
          zero.
      - ask: >
          How many ways can the twelve tokens be distributed among the
          four players?
        expects: "455"
        hint: >
          Use $\binom{n+k-1}{k-1}$ with $n=12$ and $k=4$.
        feedback: >
          $\binom{12+4-1}{4-1}=\binom{15}{3}=455$.
      - teach: >
          Requiring every box nonempty, $x_i\ge1$, is a change of
          variables: set $y_i=x_i-1\ge0$, so $y_1+\cdots+y_k=n-k$, and
          applying the nonnegative formula to this shifted problem gives
          $\binom{n-1}{k-1}$ — equivalently, placing the $k-1$ bars into
          the $n-1$ gaps strictly between stars, never two in the same gap.
      - ask: >
          The same twelve tokens are distributed among the four players,
          but now every player must receive at least one token. How many
          ways?
        expects: "165"
        hint: >
          Give each player one token first, then distribute what's left
          with no restriction.
        feedback: >
          $\binom{12-1}{4-1}=\binom{11}{3}=165$.
      - teach: >
          Anything beyond a plain floor of zero or one needs more work: an
          upper cap like $x_i\le c$ isn't a simple substitution, since the
          shift trick above only handles a lower bound, so caps are instead
          handled by inclusion–exclusion on the event that some box exceeds
          its cap.
      - ask: >
          Thirteen identical candies are split among $4$ children, and
          every child must receive at least one candy. Which is the
          correct count?
        choices:
          - text: >
              $\binom{13+4-1}{4-1}=\binom{16}{3}$
            feedback: >
              This is the unrestricted count, which allows a child to
              receive zero candies — it doesn't enforce "at least one."
          - text: >
              $\binom{13-1}{4-1}=\binom{12}{3}$
            correct: true
            feedback: >
              Right — give each child one candy first, then distribute the
              rest with no restriction.
          - text: >
              $\binom{13}{4}$
            feedback: >
              This treats the candies as if they were distinguishable
              objects being chosen into a subset, not identical items being
              distributed.
        feedback: >
          Every child needing at least one shifts the count to
          $\binom{13-1}{4-1}=\binom{12}{3}=220$, not the unrestricted
          $\binom{16}{3}$.

  - node: quant-probability.counting.sampling-table
    hook: >
      This is the classification step that should happen before any
      counting arithmetic: order or not, repeats or not, four boxes, and
      picking the wrong one is the most common way to get a probability
      question's denominator wrong.
    explanation: >
      Two independent questions classify every "draw $k$ from $n$ types"
      problem, and answering them first prevents formula-mixing. Does order
      matter — is $(1,2)$ different from $(2,1)$? And are repeats allowed —
      can the same type be drawn more than once? With replacement and order
      mattering, each of the $k$ draws independently has $n$ options, giving
      $n^k$ by the multiplication principle. Without replacement and order
      mattering, the count of options shrinks by one each draw, giving the
      falling factorial $n!/(n-k)!$. Without replacement and order not
      mattering, you're choosing a $k$-subset, giving $\binom{n}{k}$. With
      replacement and order not mattering, you're recording how many times
      each of the $n$ types was drawn — a distribution of $k$ identical
      draws among $n$ labelled types — which is exactly stars and bars:
      $\binom{n+k-1}{k}$.

      The trap lives entirely in that last cell. The $\binom{n+k-1}{k}$
      multisets are not equally likely outcomes of a physically symmetric
      draw, because different multisets are produced by different numbers
      of the truly equally likely ordered sequences — a multiset with all
      $k$ draws the same type comes from exactly one ordered sequence, while
      a multiset with $k$ distinct types comes from $k!$ of them. Whenever
      the mechanism (rolling dice, drawing with replacement) makes ordered
      outcomes equally likely, the unordered count is never a legitimate
      denominator for classical probability, even though it's a perfectly
      correct count of distinct multisets.
    worked: >
      For $n=4$ types and $k=2$ draws: with replacement and ordered,
      $4^2=16$; without replacement and ordered, $4\cdot3=12$; without
      replacement and unordered, $\binom{4}{2}=6$; with replacement and
      unordered, $\binom{5}{2}=10$. Rolling two four-sided dice has $16$
      equally likely ordered outcomes; the $10$ unordered outcomes are not
      equally likely, since "a $2$ and a $3$" arises from $2$ of the $16$
      ordered rolls while "double $1$" arises from only $1$.
    interview: >
      "If I draw with/without replacement, ordered/unordered, how many
      outcomes" is answered by naming both axes before reaching for a
      formula — interviewers often ask "are these equally likely?" right
      after, checking whether you catch the with-replacement-unordered trap
      unprompted.
    pitfalls: >
      Using the unordered-with-replacement count as a probability
      denominator when the physical mechanism actually produces equally
      likely ordered outcomes silently changes the answer. Mixing an
      ordered numerator with an unordered denominator, or the reverse, is
      the same error one level down.
    recap: >
      Order matters or not, repeats allowed or not, gives four formulas —
      $n^k$, $n!/(n-k)!$, $\binom{n}{k}$, $\binom{n+k-1}{k}$ — and the
      with-replacement-unordered outcomes are never equally likely even
      though they're a valid count.
    steps:
      - teach: >
          Two independent questions classify every "draw $k$ from $n$
          types" problem: does order matter, and are repeats allowed?
          Answering both before reaching for a formula prevents mixing up
          which of the four counts actually applies.
      - teach: >
          With replacement and order mattering, each of the $k$ draws
          independently has $n$ options, giving $n^k$. Without replacement
          and order mattering, the option count shrinks by one each draw,
          giving the falling factorial $n!/(n-k)!$. Without replacement and
          order not mattering, you're choosing a $k$-subset, giving
          $\binom{n}{k}$. With replacement and order not mattering, you're
          recording how many times each of the $n$ types was drawn —
          exactly stars and bars applied to $k$ draws among $n$ labelled
          types — giving $\binom{n+k-1}{k}$.
      - teach: >
          Fix $n=5$ types and $k=2$ draws and run all four classifications
          on that same setup — comparing the four resulting counts side by
          side is the fastest way to see how differently they treat the
          same physical draw.
      - ask: >
          With replacement allowed and order mattering, how many outcomes
          are there for two draws from five types?
        expects: "25"
        hint: >
          Each of the two draws independently has all five types available.
        feedback: >
          $5^2=25$: each draw is an independent choice among the $5$ types.
      - teach: >
          The trap sits entirely in the last cell. The $\binom{n+k-1}{k}$
          multisets recorded by that formula are not equally likely
          outcomes of a physically symmetric draw, because different
          multisets are produced by different numbers of the truly equally
          likely ordered sequences — a multiset with all $k$ draws the same
          type comes from exactly one ordered sequence, while a multiset
          with $k$ distinct types comes from $k!$ of them.
      - ask: >
          Without replacement and with order not mattering, how many
          outcomes are there for two draws from five types?
        expects: "10"
        hint: >
          This is choosing an unordered $2$-element subset of the $5$
          types.
        feedback: >
          $\binom{5}{2}=10$.
      - teach: >
          Whenever the mechanism — rolling dice, drawing with replacement —
          makes ordered outcomes equally likely, the
          unordered-with-replacement count is never a legitimate
          denominator for classical probability, even though it's a
          perfectly correct count of distinct multisets.
      - ask: >
          Two fair five-sided dice are rolled. Which statement is correct?
        choices:
          - text: >
              The $15$ unordered outcomes (via $\binom{5+2-1}{2}$) are
              equally likely, so a specific pair has probability $1/15$.
            feedback: >
              Unordered-with-replacement outcomes are not equally likely —
              "doubles" come from only $1$ ordered roll while a mixed pair
              comes from $2$.
          - text: >
              The $25$ ordered outcomes are equally likely, so rolling a
              specific ordered pair has probability $1/25$.
            correct: true
            feedback: >
              Right — the physical mechanism (two independent dice) makes
              the $25$ ordered outcomes the equally likely ones.
          - text: >
              The $20$ ordered-without-replacement outcomes are equally
              likely.
            feedback: >
              Dice rolls allow repeats (the same face on both dice), so
              this mode, which forbids repeats, doesn't even describe the
              mechanism.
        feedback: >
          Rolling two dice produces $5^2=25$ equally likely ordered
          outcomes; the $\binom{6}{2}=15$ unordered multisets exist but are
          not equally likely, since a "double" arises from only $1$ of the
          $25$ rolls.

  - node: quant-probability.counting.lattice-paths
    hook: >
      Grid-walk phrasing ("a robot moves right or up," "a driver on a street
      grid") is combinations in disguise the moment you see a path as a word
      instead of a picture.
    explanation: >
      A monotone path from $(0,0)$ to $(m,n)$ using only unit steps right
      (R) and up (U) is completely described by the order the steps are
      taken in — a word of length $m+n$ containing exactly $m$ R's and $n$
      U's, and conversely every such word traces out exactly one path.
      Counting the words is a combinations question: the word is determined
      by which $n$ of its $m+n$ positions hold a U (the rest are
      automatically R), so there are $\binom{m+n}{n}$ paths — the same
      "choose the positions of the minority symbol" logic that counts
      multiset arrangements generally.

      Forcing the path through a specific intermediate point $(a,b)$ splits
      the walk into two independent legs: reaching $(a,b)$ from the origin
      is $\binom{a+b}{b}$ paths, and continuing from $(a,b)$ to $(m,n)$ is a
      walk of $m-a$ rights and $n-b$ ups, $\binom{m-a+n-b}{n-b}$ paths —
      since every choice on the first leg pairs with every choice on the
      second, the multiplication principle gives the product
      $\binom{a+b}{b}\binom{m-a+n-b}{n-b}$. Paths required to avoid a
      blocked intersection are simply the total minus the ones forced
      through it, the same subtraction idea one level up.

      The same word-counting argument extends directly to three dimensions:
      a path using $m$ steps in one direction, $n$ in a second, and $p$ in a
      third is a word with three symbol types, and choosing where each
      type's positions go is exactly the group-splitting count
      $(m+n+p)!/(m!\,n!\,p!)$.
    worked: >
      Paths from $(0,0)$ to $(5,4)$ number $\binom{9}{4}=126$. Forcing the
      path through $(2,1)$: $\binom{3}{1}\binom{6}{3}=3\cdot20=60$ of them
      pass through that point.
    interview: >
      A grid/city-block/robot-movement question with only two allowed step
      directions is a cue to translate paths into words immediately —
      interviewers listen for $\binom{m+n}{n}$ named without hesitation, and
      for a product rule appearing when a checkpoint or blocked cell is
      added.
    pitfalls: >
      Counting the wrong grid dimensions — using $m+n$ steps when the path
      is actually spanning $m\times n$ unit squares, one step short in each
      direction — is a common off-by-one. Forgetting that a mandatory
      checkpoint splits into a *product*, not a sum, of the two leg counts
      undercounts badly.
    recap: >
      A monotone grid path is a word in R's and U's, so corner-to-corner
      paths number $\binom{m+n}{n}$, and forcing a checkpoint multiplies two
      smaller instances of the same count.
    steps:
      - teach: >
          A monotone path from $(0,0)$ to $(m,n)$ using only unit steps
          right (R) and up (U) is completely described by the order the
          steps are taken in — a word of length $m+n$ containing exactly
          $m$ R's and $n$ U's, and conversely every such word traces out
          exactly one path.
      - teach: >
          Counting the words is a combinations question: the word is
          determined by which $n$ of its $m+n$ positions hold a U (the rest
          are automatically R), so there are $\binom{m+n}{n}$ paths — the
          same "choose the positions of the minority symbol" logic behind
          counting multiset arrangements generally.
      - teach: >
          A path runs from $(0,0)$ to $(6,3)$ on the integer grid, using
          only unit steps right and up.
      - ask: >
          How many such paths are there?
        expects: "84"
        hint: >
          The path is a word of length $9$ containing exactly $3$ U's.
        feedback: >
          $\binom{6+3}{3}=\binom{9}{3}=84$.
      - teach: >
          Forcing the path through a specific intermediate point $(a,b)$
          splits the walk into two independent legs: reaching $(a,b)$ from
          the origin is $\binom{a+b}{b}$ paths, and continuing from $(a,b)$
          to $(m,n)$ is a walk of $m-a$ rights and $n-b$ ups,
          $\binom{m-a+n-b}{n-b}$ paths — since every choice on the first leg
          pairs with every choice on the second, the multiplication
          principle gives the product of the two.
      - ask: >
          How many paths from $(0,0)$ to $(6,3)$ pass through the
          checkpoint $(3,1)$?
        expects: "40"
        hint: >
          Multiply the count of paths to the checkpoint by the count of
          paths from the checkpoint to the end.
        feedback: >
          $\binom{3+1}{1}\binom{3+2}{2}=4\cdot10=40$: $4$ ways to reach
          $(3,1)$ and $10$ ways to continue to $(6,3)$.
      - teach: >
          Paths required to avoid a blocked intersection are simply the
          total minus the ones forced through it — the same subtraction
          idea one level up — and the standard mistake is treating a
          mandatory checkpoint as adding the two leg counts instead of
          multiplying them, which badly undercounts.
      - ask: >
          Paths from $(0,0)$ to $(4,4)$ must avoid the blocked point
          $(2,2)$. How many valid paths are there?
        expects: "34"
        hint: >
          Compute the total number of paths, then subtract the ones that
          pass through $(2,2)$.
        feedback: >
          Total paths: $\binom{8}{4}=70$. Paths through $(2,2)$:
          $\binom{4}{2}\binom{4}{2}=36$. Avoiding it: $70-36=34$.

  - node: quant-probability.counting.catalan
    hook: >
      The sequence $1,1,2,5,14,42$ recurs across balanced parentheses,
      non-crossing handshakes, and binary trees often enough that
      recognizing "this is secretly Catalan" is worth more than being able
      to derive the formula on demand.
    explanation: >
      A monotone path from $(0,0)$ to $(n,n)$ that never rises above the
      diagonal $y=x$ — equivalently, a sequence of $n$ R's and $n$ U's where
      every prefix has at least as many R's as U's — is the combinatorial
      shape behind balanced parentheses (R is "(", U is ")") and
      non-crossing structures generally. Counting the ones to avoid uses a
      bijection: take any path to $(n,n)$ that crosses above the diagonal,
      find the first step where it does, and reflect everything after that
      step across the line $y=x+1$ — this swaps every subsequent R for a U
      and vice versa, turning a path ending at $(n,n)$ into one ending at
      $(n-1,n+1)$. The reflection is invertible, so it's a genuine bijection
      between the diagonal-crossing paths to $(n,n)$ and *all* paths to
      $(n-1,n+1)$, of which there are $\binom{2n}{n+1}$ by the grid-path
      count. Subtracting bad from total gives
      $\binom{2n}{n}-\binom{2n}{n+1}$, algebraically the same number as
      $\dfrac{1}{n+1}\binom{2n}{n}$.

      The same integer sequence shows up everywhere because all these
      structures admit the identical bijection into diagonal-respecting
      paths: a balanced parenthesis string maps step by step to R's and
      U's, a non-crossing pairing of $2n$ points on a circle maps to which
      points are "openers" versus "closers" as you traverse the boundary,
      and a binary tree's recursive left/right structure maps to the same
      first-return decomposition that proves the recurrence
      $C_{n+1}=\sum_{i=0}^{n}C_iC_{n-i}$.
    worked: >
      The number of ways to correctly balance $4$ pairs of parentheses is
      $C_4$. Via the subtraction form, $C_4=\binom{8}{4}-\binom{8}{5}
      =70-56=14$, matching the direct value $\tfrac{1}{5}\binom{8}{4}
      =70/5=14$.
    interview: >
      "How many ways to balance $n$ pairs of parentheses," "non-crossing
      handshakes around a table," and "shapes of a binary tree with $n$
      nodes" are all the same question wearing different clothes — naming
      Catalan numbers and quoting $\binom{2n}{n}/(n+1)$ immediately is the
      expected fluency, with the reflection argument as backup if pressed to
      justify it.
    pitfalls: >
      Using $\binom{2n}{n}$ alone, forgetting the $1/(n+1)$ or the
      subtraction, massively overcounts, since most grid paths do cross the
      diagonal. Misidentifying which combinatorial objects are actually
      Catalan-counted is common — check the first few small values
      ($1,1,2,5,14$) against the problem before committing.
    recap: >
      $C_n=\binom{2n}{n}/(n+1)=\binom{2n}{n}-\binom{2n}{n+1}$ counts
      diagonal-avoiding paths, and the reflection bijection that proves the
      subtraction form is the same shape behind balanced parentheses,
      non-crossing pairings, and binary trees.
    steps:
      - teach: >
          A monotone path from $(0,0)$ to $(n,n)$ that never rises above
          the diagonal $y=x$ is the combinatorial shape behind balanced
          parentheses (R is "(", U is ")") and non-crossing structures
          generally — a sequence of $n$ R's and $n$ U's where every prefix
          has at least as many R's as U's.
      - teach: >
          Counting the diagonal-crossing paths uses a bijection: take any
          path to $(n,n)$ that crosses above the diagonal, find the first
          step where it does, and reflect everything after that step across
          the line $y=x+1$. This swaps every subsequent R for a U and vice
          versa, sending a path ending at $(n,n)$ to one ending at
          $(n-1,n+1)$ — a genuine bijection onto *all* $\binom{2n}{n+1}$
          paths to $(n-1,n+1)$, so subtracting bad from total gives
          $\binom{2n}{n}-\binom{2n}{n+1}$, algebraically the same number as
          $\dfrac{1}{n+1}\binom{2n}{n}$.
      - teach: >
          The number of ways to correctly balance $5$ pairs of parentheses
          is $C_5$.
      - ask: >
          What is $C_5$, computed via the subtraction form
          $\binom{10}{5}-\binom{10}{6}$?
        expects: "42"
        hint: >
          $\binom{10}{5}=252$ and $\binom{10}{6}=210$.
        feedback: >
          $C_5=\binom{10}{5}-\binom{10}{6}=252-210=42$, matching the direct
          value $\dfrac{1}{6}\binom{10}{5}=252/6=42$.
      - teach: >
          The same integer sequence shows up everywhere because all these
          structures admit the identical bijection into diagonal-respecting
          paths: a non-crossing pairing of $2n$ points on a circle maps to
          which points are "openers" versus "closers" as you traverse the
          boundary, and a binary tree's recursive left/right structure maps
          to the same first-return decomposition that proves
          $C_{n+1}=\sum_{i=0}^{n}C_iC_{n-i}$.
      - ask: >
          Using $C_{n+1}=\sum_{i=0}^{n}C_iC_{n-i}$ with $C_0=1$, $C_1=1$,
          $C_2=2$, what is $C_3$?
        expects: "5"
        hint: >
          Sum $C_0C_2 + C_1C_1 + C_2C_0$.
        feedback: >
          $C_3=C_0C_2+C_1C_1+C_2C_0=1\cdot2+1\cdot1+2\cdot1=5$.
      - teach: >
          Using $\binom{2n}{n}$ alone, forgetting the $1/(n+1)$ or the
          subtraction, massively overcounts, since most grid paths do cross
          the diagonal — and misidentifying which combinatorial objects are
          actually Catalan-counted is common, so check the first few small
          values, $1,1,2,5,14$, against the problem before committing.
      - ask: >
          A count matches $1,1,2,5,14,42,\dots$ for parameter $n=0,1,2,3,
          4,5$. What is the correct closed form for the $n$-th term?
        choices:
          - text: >
              $\binom{2n}{n}$
            feedback: >
              This overcounts massively — at $n=4$ it gives $70$, not the
              actual value $14$.
          - text: >
              $\dfrac{1}{n+1}\binom{2n}{n}$
            correct: true
            feedback: >
              Right — the Catalan number, which correctly gives $14$ at
              $n=4$ and $42$ at $n=5$.
          - text: >
              $\binom{2n}{n+1}$
            feedback: >
              At $n=4$ this gives $\binom{8}{5}=56$, not $14$ — it's the
              count of the diagonal-crossing paths being subtracted off,
              not the answer itself.
        feedback: >
          The Catalan number $C_n=\dfrac{1}{n+1}\binom{2n}{n}=
          \binom{2n}{n}-\binom{2n}{n+1}$ is the correct closed form,
          matching $1,1,2,5,14,42,\dots$

  - node: quant-probability.counting.complementary-counting
    hook: >
      "At least one" is the single most common phrase that should make you
      count the complement instead — the direct count needs
      inclusion–exclusion, while "none" is often one clean multiplication
      away.
    explanation: >
      Every set $U$ splits into $A$ and its complement $A^c$ with no overlap
      and nothing left over, so $|A|+|A^c|=|U|$ and therefore
      $|A|=|U|-|A^c|$ — a one-line fact, but the leverage comes from
      choosing which side to compute. When $A$ is phrased as "at least one
      of several things happens," $A^c$ is phrased as "none of them
      happen," and "none" is a single clean AND-condition across the
      individual stages — exactly the shape the multiplication principle
      handles directly, since "stage $i$ avoids its bad outcome" typically
      has a constant, easy-to-count number of options. The direct count of
      "at least one" has no such shape: it has to track which subset of the
      bad events actually occurred, and different subsets overlap in ways
      that need inclusion–exclusion to untangle.

      The same logic applies unchanged to probabilities, since $\Pr$
      satisfies $\Pr(A)+\Pr(A^c)=1$: $\Pr(A)=1-\Pr(A^c)$. The trigger
      phrases to listen for are "at least one," "not all," "none of," and
      "at most one" — each names a compound event whose complement collapses
      to a simpler condition, and the reflex should be to write down the
      complement before attempting the direct count.
    worked: >
      A password of length $6$ is drawn uniformly from the $26$ lowercase
      letters per slot; how many contain at least one vowel (a,e,i,o,u)?
      The complement "no vowels" has $21$ choices per slot, giving
      $21^6=85766121$ vowel-free passwords out of $26^6=308915776$ total, so
      at least one vowel occurs in $308915776-85766121=223149655$
      passwords.
    interview: >
      "At least one" triggers this move by itself — interviewers want the
      complement written down ("none of them") before any counting starts,
      and a candidate who launches straight into inclusion–exclusion on the
      direct event is doing more work than necessary.
    pitfalls: >
      Computing $\Pr(\text{none})$ correctly but forgetting the final
      $1-{}$ step is a common slip under time pressure. Applying the
      complement trick when the individual "none" events aren't actually
      independent (draws without replacement) requires the product to
      reflect shrinking counts at each stage, not a naive constant power.
    recap: >
      Compute what you don't want — "none" — and subtract from the whole;
      "at least one" is almost never easier attacked head-on.
    steps:
      - teach: >
          Every set $U$ splits into $A$ and its complement $A^c$ with no
          overlap and nothing left over, so $|A|+|A^c|=|U|$, and therefore
          $|A|=|U|-|A^c|$ — the leverage comes entirely from choosing which
          side is easier to compute.
      - teach: >
          When $A$ is phrased as "at least one of several things happens,"
          $A^c$ is phrased as "none of them happen" — a single clean
          AND-condition across the stages, exactly the shape the
          multiplication principle handles directly. The direct count of
          "at least one" has no such shape: it has to track which subset of
          the bad events occurred, tangled up in overlaps.
      - teach: >
          A $4$-digit PIN is drawn with repeats allowed, each digit from
          $0$ through $9$.
      - ask: >
          How many $4$-digit PINs contain at least one digit that is $7$,
          $8$, or $9$?
        expects: "7599"
        hint: >
          Count the PINs using only digits $0$–$6$ (the complement), then
          subtract from the total.
        feedback: >
          Complement: $7^4=2401$ PINs avoid $\{7,8,9\}$ entirely. Total:
          $10^4=10000$. At least one: $10000-2401=7599$.
      - teach: >
          The same logic applies unchanged to probabilities, since $\Pr$
          satisfies $\Pr(A)+\Pr(A^c)=1$: $\Pr(A)=1-\Pr(A^c)$. The trigger
          phrases to listen for are "at least one," "not all," "none of,"
          and "at most one" — each names a compound event whose complement
          collapses to a simpler condition.
      - ask: >
          A fair six-sided die is rolled $3$ times. What is the probability
          that at least one roll shows a $6$?
        expects: "91/216"
        tolerance: 0.0005
        hint: >
          Compute the probability that no roll shows a $6$, then subtract
          from $1$.
        feedback: >
          $\Pr(\text{no }6)=(5/6)^3=125/216$, so
          $\Pr(\text{at least one }6)=1-125/216=91/216\approx0.4213$.
      - teach: >
          Computing $\Pr(\text{none})$ correctly but forgetting the final
          $1-{}$ step is a common slip under time pressure, and applying
          the complement trick when the individual "none" events aren't
          independent — draws without replacement — requires the product
          to reflect shrinking counts at each stage, not a naive constant
          power.
      - ask: >
          Three cards are drawn without replacement from a standard
          $52$-card deck. Which is the correct expression for the
          probability of at least one heart?
        choices:
          - text: >
              $1-(39/52)^3$
            feedback: >
              This treats the three draws as independent with a constant
              $39/52$ chance of avoiding a heart each time, but without
              replacement the count of non-heart cards shrinks after each
              draw.
          - text: >
              $1-\dfrac{39\cdot38\cdot37}{52\cdot51\cdot50}$
            correct: true
            feedback: >
              Right — the complement "no hearts" requires each draw to
              avoid the $13$ hearts, and the non-heart count shrinks from
              $39$ to $38$ to $37$ as cards are removed.
          - text: >
              $1-\dfrac{13\cdot12\cdot11}{52\cdot51\cdot50}$
            feedback: >
              This computes the complement of "all three are hearts," not
              "at least one is a heart" — the wrong event was complemented.
        feedback: >
          Without replacement, the non-heart count shrinks at each draw, so
          the complement is $\dfrac{39\cdot38\cdot37}{52\cdot51\cdot50}
          \approx0.4135$, and $\Pr(\text{at least one heart})\approx
          1-0.4135=0.5865$.

  - node: quant-probability.counting.inclusion-exclusion
    hook: >
      This is the general formula the two- and three-event union rules were
      secretly special cases of, and "at least one of many overlapping
      events" basically never has another tractable route in an interview.
    explanation: >
      The alternating sum is exactly right because of a single counting
      fact applied to each outcome individually. Take an outcome lying in
      exactly $m$ of the $n$ sets ($m\ge1$; an outcome in none contributes
      nothing to any term). It's counted in $\binom{m}{k}$ of the $k$-wise
      intersection terms, since a $k$-wise intersection includes it exactly
      when built from $k$ of the $m$ sets containing it — so its net
      contribution to the formula is $\sum_{k=1}^{m}(-1)^{k+1}\binom{m}{k}$.
      This sum equals $1$ for every $m\ge1$: fixing one of the $m$ sets and
      toggling it in or out of any subset flips that subset's size by one,
      pairing every even-sized subset with an odd-sized one and forcing the
      $2^m$ subsets to split evenly, $2^{m-1}$ of each parity — so
      $\sum_{k=0}^{m}(-1)^k\binom{m}{k}=0$, and isolating the $k=0$ term
      ($=1$) and flipping signs gives the claimed sum $=1$. Every outcome in
      the union is therefore counted exactly once, and every outcome
      outside it is counted zero times.

      The complement form falls straight out of complementary counting
      applied to the whole union: the outcomes in *none* of the sets number
      $|U|$ minus the union, and substituting the alternating formula and
      collecting terms by intersection-order gives $\sum_{k=0}^{n}
      (-1)^kS_k$, where $S_0=|U|$ and $S_k$ is the total size of all
      $k$-wise intersections — the same alternating pattern, now counting
      absence instead of presence.

      Truncating the sum after any term still bounds the truth
      (Bonferroni): stopping after an odd number of terms overestimates,
      after an even number underestimates, useful whenever the higher-order
      intersections are too painful to compute exactly.
    worked: >
      A survey of $150$ people finds $80$ like coffee, $70$ like tea, $65$
      like juice; $40$ like coffee and tea, $35$ like coffee and juice, $30$
      like tea and juice; $15$ like all three. Inclusion–exclusion gives
      $80+70+65-40-35-30+15=125$ people who like at least one of the three
      drinks, so $150-125=25$ like none.
    interview: >
      Any "how many satisfy at least one of these several conditions"
      question with three or more conditions is answered with the full
      alternating sum, term by term, spoken out loud — interviewers check
      that the pattern continues correctly past three events, where most
      people's memorized formulas run out.
    pitfalls: >
      Stopping the alternating sum too early systematically over- or
      under-corrects depending on parity — count how many terms the
      problem's number of sets actually requires. Double-counting a
      $k$-wise intersection under a different case label elsewhere in the
      same solution silently violates the disjointness the formula relies
      on.
    recap: >
      Add the singles, subtract the pairs, add back the triples, and so on
      — every outcome ends up counted exactly once because the per-outcome
      alternating binomial sum equals $1$.
    steps:
      - teach: >
          The alternating sum is exactly right because of a single
          counting fact applied to each outcome individually: take an
          outcome lying in exactly $m$ of the $n$ sets ($m\ge1$), and count
          how many times the formula counts it.
      - teach: >
          An outcome in exactly $m$ sets is counted in $\binom{m}{k}$ of
          the $k$-wise intersection terms, and
          $\sum_{k=1}^{m}(-1)^{k+1}\binom{m}{k}=1$ for every $m\ge1$ —
          isolating the $k=0$ term of $\sum_{k=0}^{m}(-1)^k\binom{m}{k}=0$
          and flipping signs. So every outcome in the union is counted
          exactly once, and every outcome outside it is counted zero times.
      - teach: >
          A survey of $200$ gym members finds $90$ do yoga, $75$ do
          spinning, and $60$ do lifting; $30$ do yoga and spinning, $25$ do
          yoga and lifting, $20$ do spinning and lifting; $10$ do all
          three.
      - ask: >
          How many members do at least one of the three activities?
        expects: "160"
        hint: >
          Add the three singles, subtract the three pairwise overlaps, then
          add back the triple overlap.
        feedback: >
          $90+75+60-30-25-20+10=160$.
      - teach: >
          The complement form falls straight out of complementary counting
          applied to the whole union: the outcomes in *none* of the sets
          number $|U|$ minus the union. Truncating the alternating sum
          after any term still bounds the truth (Bonferroni) — stopping
          after an odd number of terms overestimates, after an even number
          underestimates.
      - ask: >
          Using the survey above, how many of the $200$ members do none of
          the three activities?
        expects: "40"
        hint: >
          Subtract the at-least-one count from the total membership.
        feedback: >
          $200-160=40$ members do none of the three activities.
      - teach: >
          Stopping the alternating sum too early systematically over- or
          under-corrects depending on parity — count how many terms the
          problem's number of sets actually requires. Double-counting a
          $k$-wise intersection under a different case label elsewhere in
          the same solution silently violates the disjointness the formula
          relies on.
      - ask: >
          A problem has four overlapping events. After adding all four
          singles and subtracting all six pairwise intersections, the
          running total (before the triple and quadruple terms) is used as
          an estimate of the union size. Which is true of that partial sum?
        choices:
          - text: >
              It's exactly correct — pairs are the last term needed
            feedback: >
              The alternating sum for four sets needs the triple and
              quadruple terms too; stopping at pairs is a truncation, not
              the exact answer.
          - text: >
              It's guaranteed to underestimate the true union
            correct: true
            feedback: >
              Right — this is Bonferroni: truncating after an even number
              of terms (here, two: singles and pairs) underestimates the
              union.
          - text: >
              It's guaranteed to overestimate the true union
            feedback: >
              Overestimation happens after truncating at an odd number of
              terms (like singles alone); this partial sum has stopped
              after an even count of terms.
        feedback: >
          Truncating the alternating inclusion–exclusion sum after an even
          number of terms — here, after singles and pairs — always
          underestimates the true union size (Bonferroni's inequality).

  - node: quant-probability.counting.derangements
    hook: >
      This is inclusion–exclusion's most quoted output: the answer
      converges to $1/e$ almost immediately and stays there, the kind of
      fact interviewers expect you to have ready as a number, not just a
      formula.
    explanation: >
      Let $A_i$ be the event that guest $i$ gets back their own hat under a
      uniformly random permutation of $n$ hats. A derangement has no fixed
      point at all, so counting derangements is complementary counting
      applied to $A_1\cup\cdots\cup A_n$: $D_n=n!-|A_1\cup\cdots\cup A_n|$.
      The union needs inclusion–exclusion: a $k$-wise intersection
      $A_{i_1}\cap\cdots\cap A_{i_k}$ fixes those $k$ specific hats and
      permutes the remaining $n-k$ freely, so it has size $(n-k)!$, and
      there are $\binom{n}{k}$ ways to choose which $k$ guests are fixed —
      every $k$-wise intersection has the same size regardless of which $k$
      guests are chosen, which is what makes the sum collapse to one term
      per $k$ rather than $\binom{n}{k}$ separate ones. Substituting and
      simplifying, $D_n=n!\sum_{k=0}^{n}\dfrac{(-1)^k}{k!}$, and dividing by
      $n!$ gives the no-match probability $\sum_{k=0}^{n}(-1)^k/k!$.

      That finite sum is the Maclaurin series for $e^{-1}$ truncated at
      degree $n$: as $n\to\infty$ it converges to $e^{-1}\approx0.3679$, and
      because the series alternates with rapidly shrinking terms
      ($1/k!$), the truncation error at any finite $n$ is bounded by the
      next omitted term, $1/(n+1)!$ — which is why the probability is
      already within a fraction of a percent of its limit by $n=5$ or $6$,
      long before $n$ is large in any other sense.

      The practical takeaway: whenever a random permutation's "nobody
      matches" probability is asked, the answer is "about $0.368$,
      converging fast," regardless of how large $n$ actually is, as long as
      it's at least $4$ or $5$.
    worked: >
      For $n=6$, $D_6=720\sum_{k=0}^{6}(-1)^k/k!=265$, so the probability
      nobody gets their own hat back is $265/720\approx0.3681$ — already
      matching $e^{-1}\approx0.3679$ to three decimal places.
    interview: >
      "$n$ people check their hats and they're returned at random — what's
      the probability nobody gets their own back" is asked almost verbatim;
      the expected answer names the inclusion–exclusion derivation in one
      sentence and quotes "$\approx1/e\approx0.368$, and it's already close
      by $n=5$ or $6$."
    pitfalls: >
      Forgetting that a $k$-wise intersection has size $(n-k)!$, not some
      other variant — the remaining $n-k$ hats really do permute completely
      freely. Assuming the $1/e$ answer only kicks in for very large $n$
      understates how fast the series converges.
    recap: >
      Derangements satisfy $D_n=n!\sum_{k=0}^{n}(-1)^k/k!$ by
      inclusion–exclusion on "guest $i$ keeps their hat," and the no-match
      probability converges to $e^{-1}\approx0.368$ within a few terms.
    steps:
      - teach: >
          Let $A_i$ be the event that guest $i$ gets back their own hat
          under a uniformly random permutation of $n$ hats. A derangement
          has no fixed point at all, so counting derangements is
          complementary counting applied to $A_1\cup\cdots\cup A_n$:
          $D_n=n!-|A_1\cup\cdots\cup A_n|$.
      - teach: >
          A $k$-wise intersection $A_{i_1}\cap\cdots\cap A_{i_k}$ fixes
          those $k$ specific hats and permutes the remaining $n-k$ freely,
          so it has size $(n-k)!$, the same size regardless of which $k$
          guests are chosen — which is what collapses inclusion–exclusion
          to one term per $k$. Substituting gives
          $D_n=n!\sum_{k=0}^{n}(-1)^k/k!$.
      - teach: >
          The recurrence $D_n=(n-1)(D_{n-1}+D_{n-2})$, with $D_5=44$ and
          $D_6=265$ already known, gives the next value in the sequence.
      - ask: >
          Using $D_7=6(D_6+D_5)$, what is $D_7$?
        expects: "1854"
        hint: >
          Compute $6\times(265+44)$.
        feedback: >
          $D_7=6(265+44)=6\cdot309=1854$.
      - teach: >
          That finite sum is the Maclaurin series for $e^{-1}$ truncated at
          degree $n$: as $n\to\infty$ it converges to $e^{-1}\approx0.3679$,
          and because the terms $1/k!$ shrink so fast, the truncation
          error at any finite $n$ is bounded by the next omitted term,
          $1/(n+1)!$ — already tiny by $n=5$ or $6$.
      - ask: >
          What is the probability that nobody gets their own hat back, for
          $n=7$, using $D_7=1854$?
        expects: "0.3679"
        tolerance: 0.0005
        hint: >
          Divide $D_7$ by $7!=5040$.
        feedback: >
          $1854/5040\approx0.3679$, already matching $e^{-1}\approx0.3679$
          to four decimal places.
      - teach: >
          Forgetting that a $k$-wise intersection has size $(n-k)!$, not
          some other variant — the remaining $n-k$ hats really do permute
          completely freely — is the standard slip, and assuming the
          $1/e$ answer only kicks in for very large $n$ understates how
          fast the series converges.
      - ask: >
          For $n=4$ guests, which expression correctly gives $D_4$?
        choices:
          - text: >
              $4!\sum_{k=0}^{3}(-1)^k/k!$
            feedback: >
              The sum should run all the way from $k=0$ to $k=n=4$, not
              stop one short at $k=3$.
          - text: >
              $4!\sum_{k=0}^{4}(-1)^k/k!$
            correct: true
            feedback: >
              Right — the sum runs to $k=n$; evaluating gives
              $24(1-1+1/2-1/6+1/24)=9$.
          - text: >
              $\binom{4}{2}\cdot2!$
            feedback: >
              This fixes $2$ guests and permutes the rest for one specific
              choice of $k$ — a single term of the inclusion–exclusion sum,
              not the whole alternating combination.
        feedback: >
          $D_4=4!\sum_{k=0}^{4}(-1)^k/k!=24(1-1+0.5-0.1667+0.0417)=9$,
          matching the known value.

  - node: quant-probability.counting.pigeonhole
    hook: >
      Pigeonhole is the cheapest existence proof in the whole toolkit — no
      probability, no counting formula, just a certainty argument that
      interviewers use to test whether you reach for counting or start
      guessing.
    explanation: >
      The claim needs no randomness and no formula beyond arithmetic: if
      $N$ objects are placed into $n$ boxes in any manner whatsoever, and
      every box held at most $\lceil N/n\rceil-1$ objects, the total across
      all boxes would be at most $n(\lceil N/n\rceil-1)<N$ — short of the
      actual count $N$, a contradiction. So some box must hold at least
      $\lceil N/n\rceil$. Nothing about *how* the placement happens
      matters; the argument is purely about totals, which is what makes it
      a certainty rather than a likelihood, and why it needs no probability
      machinery to state or prove.

      The base case $N=n+1$ objects into $n$ boxes forces some box to hold
      $2$, and this form shows up constantly disguised as something else:
      define $n$ "boxes" cleverly and $n+1$ (or more) "objects" fall out of
      the problem's own structure. The acquaintance-count argument is the
      classic disguise: in a group of $n$ people, everyone's number of
      acquaintances inside the group is one of $n$ values, $0$ through
      $n-1$, so there appear to be exactly enough boxes for no repeat —
      except $0$ and $n-1$ can never both occur simultaneously (the person
      who knows everyone can't coexist with the person who knows no one),
      so really only $n-1$ values are ever available for $n$ people,
      forcing a repeat.

      The skill being tested is recognizing the boxes: turning a vague
      "must some pair share a property" question into an explicit, finite
      partition small enough to force a collision.
    worked: >
      Choose any $5$ integers from $\{1,2,\dots,8\}$. Pair them into $4$
      boxes by their sum with $9$: $\{1,8\}$, $\{2,7\}$, $\{3,6\}$,
      $\{4,5\}$. Five numbers into $4$ boxes forces two into the same box,
      and any two numbers sharing a box sum to exactly $9$ — so some pair
      among the five chosen integers always sums to $9$.
    interview: >
      "Show that among any [several] items, two must share a property" is
      the pigeonhole tell; the interviewer listens for you to name the
      boxes explicitly rather than reach for a probability calculation the
      question never asked for.
    pitfalls: >
      Reaching for probability or expectation when the question only asks
      for existence wastes time — pigeonhole proves a guaranteed repeat
      with no distributional assumption needed at all. Miscounting the
      number of available boxes understates how few boxes are really
      available and misses the forced collision.
    recap: >
      $N$ objects into $n$ boxes force some box to hold at least
      $\lceil N/n\rceil$, a certainty with no randomness involved — the
      skill is naming the boxes.
    steps:
      - teach: >
          The claim needs no randomness and no formula beyond arithmetic:
          if $N$ objects are placed into $n$ boxes in any manner
          whatsoever, and every box held at most $\lceil N/n\rceil - 1$
          objects, the total across all boxes would fall short of $N$ — a
          contradiction.
      - teach: >
          So some box must hold at least $\lceil N/n\rceil$. Nothing about
          *how* the placement happens matters — the argument is purely
          about totals, which is what makes it a certainty rather than a
          likelihood.
      - teach: >
          A drawer holds socks of $5$ distinct colors, and you pull socks
          out one at a time without looking.
      - ask: >
          How many socks must you pull to be guaranteed at least $3$ of
          the same color?
        expects: "11"
        hint: >
          In the worst case, each color could reach $2$ socks before a
          third is forced — how many is that, plus one more?
        feedback: >
          Worst case: $2$ socks of each of the $5$ colors is $10$ socks
          with no color reaching $3$; the $11$th sock forces some color to
          $3$.
      - teach: >
          The base case $N=n+1$ forces some box to hold $2$, and this
          shows up constantly disguised as something else. The
          acquaintance-count argument is the classic disguise: each
          person's number of acquaintances inside a group of $n$ people
          looks like it has $n$ possible values, $0$ through $n-1$ —
          except $0$ and $n-1$ can never both occur, since the person who
          knows everyone can't coexist with the person who knows no one.
      - ask: >
          At a party of $10$ people, the number of acquaintances each
          person has, inside the group, is some value from $0$ to $9$.
          What is the largest number of *distinct* acquaintance-counts
          that can actually occur among all $10$ people at once?
        expects: "9"
        hint: >
          Two of the ten possible values, $0$ and $9$, can never both be
          realized in the same group — how many does that leave?
        feedback: >
          $0$ and $9$ can't both occur, leaving at most $9$ distinct values
          actually realized among the $10$ people — forcing a repeat by
          pigeonhole.
      - teach: >
          Reaching for probability or expectation when the question only
          asks for existence wastes time — pigeonhole proves a guaranteed
          repeat with no distributional assumption needed. Miscounting the
          number of available boxes understates how few boxes are really
          available and misses the forced collision.
      - ask: >
          Twenty-five points are placed inside a $4\times4$ square, divided
          into a grid of sixteen unit squares. What does pigeonhole
          guarantee?
        choices:
          - text: >
              Some unit square contains at least $2$ of the points
            correct: true
            feedback: >
              Right — $25$ points into $16$ boxes forces
              $\lceil25/16\rceil=2$ into some box.
          - text: >
              Every unit square contains at least $1$ point
            feedback: >
              Pigeonhole guarantees a collision somewhere, not that every
              box is occupied — the points could all cluster into a few
              squares.
          - text: >
              Some unit square contains at least $3$ of the points
            feedback: >
              $\lceil25/16\rceil=2$, not $3$ — twenty-five points can be
              spread as $9$ squares with $2$ points and $7$ squares with
              $1$ point, with no square reaching $3$.
        feedback: >
          With $25$ points into $16$ unit squares, pigeonhole guarantees
          $\lceil25/16\rceil=2$ points share some unit square.

  - node: quant-probability.counting.permutation-cycles
    hook: >
      Cycle structure is the natural way to describe what a random
      permutation "looks like," and an expected cycle count of
      $\approx\ln n$ is worth having cold whenever a question dresses up a
      permutation as a matching or a shuffle.
    explanation: >
      Since a permutation is a bijection from $\{1,\dots,n\}$ to itself,
      tracing where any element $i$ goes — $i\to\sigma(i)\to
      \sigma(\sigma(i))\to\cdots$ — must eventually return to $i$, because
      the sequence lives in a finite set and a bijection can't revisit an
      earlier element without looping back to the start first. That closed
      loop is $i$'s cycle, and every element belongs to exactly one cycle,
      so the cycles partition $\{1,\dots,n\}$ with lengths summing to $n$.
      A permutation consisting of a single $n$-cycle visits every element
      in one loop; fixing where $1$ maps determines the whole chain,
      counting these gives $(n-1)!$ such permutations out of $n!$ total, a
      fraction $1/n$.

      A uniform random permutation can be built one cycle at a time: start
      tracing the cycle through element $1$ by choosing its image uniformly
      among all $n$ elements. If $m$ elements remain unassigned at a given
      step, the next image is uniform among those $m$ possibilities
      (conditioning on a uniform permutation keeps the remaining structure
      uniform on what's left), and the current cycle closes — returns to
      its start — with probability exactly $1/m$, independently of earlier
      steps, since each step's randomness is a fresh, independent uniform
      choice among what remains.

      The total number of cycles is therefore a sum of independent
      indicator variables, one per step, with success probabilities
      $1/n,1/(n-1),\dots,1/1$ as the pool of remaining elements shrinks —
      so its expected value is $H_n\approx\ln n+\gamma$, growing painfully
      slowly: doubling $n$ adds only about $\ln2\approx0.69$ to the
      expected cycle count.
    worked: >
      For $n=20$, the expected number of cycles is
      $H_{20}\approx3.598$ — barely more than $H_{10}\approx2.929$ despite
      doubling the number of elements, the slow $\ln n$ growth. Separately,
      permutations of $6$ elements that are a single $6$-cycle number
      $(6-1)!=120$ out of $6!=720$ total, a fraction $1/6$.
    interview: >
      "What's the expected number of cycles in a random permutation of $n$
      elements" is a set-piece question testing whether you decompose into
      independent indicators via the cycle-tracing construction rather than
      reasoning about cycle lengths directly; the one-line answer is
      "$H_n\approx\ln n$."
    pitfalls: >
      Assuming the closing probabilities are all $1/n$ (using the initial
      pool size throughout) instead of $1/m$ for the current remaining pool
      misses that they shrink as elements get used up. Treating cycle
      count and cycle length as the same question is a separate error —
      they have very different distributions.
    recap: >
      A permutation decomposes uniquely into disjoint cycles, and building
      one uniformly at random shows the cycle count is a sum of independent
      indicators with mean $H_n\approx\ln n+\gamma$.
    steps:
      - teach: >
          Tracing where any element $i$ goes under a permutation —
          $i\to\sigma(i)\to\sigma(\sigma(i))\to\cdots$ — must eventually
          return to $i$, since the sequence lives in a finite set and a
          bijection can't revisit an earlier element without looping back
          to the start first. That closed loop is $i$'s cycle.
      - teach: >
          Every element belongs to exactly one cycle, so the cycles
          partition $\{1,\dots,n\}$. A permutation consisting of a single
          $n$-cycle is built by fixing where $1$ maps and chaining the
          rest, giving $(n-1)!$ such permutations out of $n!$ total — a
          fraction $1/n$.
      - teach: >
          Take $n=8$: a permutation that is a single $8$-cycle chains every
          one of the $8$ elements into one loop, so counting these
          permutations directly exercises the $(n-1)!$ formula just
          derived, rather than the full $n!$ count of all permutations.
      - ask: >
          How many permutations of $8$ elements are a single $8$-cycle?
        expects: "5040"
        hint: >
          It's $(n-1)!$ for $n=8$.
        feedback: >
          $(8-1)!=7!=5040$ out of $8!=40320$ total, a fraction $1/8$.
      - teach: >
          Building a uniform random permutation one cycle at a time shows
          the cycle count is a sum of independent indicators, one per
          step, with success probabilities $1/n,1/(n-1),\dots,1/1$ as the
          pool of remaining elements shrinks — so the expected number of
          cycles is the harmonic number $H_n\approx\ln n+\gamma$, growing
          painfully slowly.
      - ask: >
          What is $H_{15}=\sum_{k=1}^{15}1/k$, the expected number of
          cycles in a random permutation of $15$ elements?
        expects: "3.318"
        tolerance: 0.0015
        hint: >
          Add the reciprocals $1+1/2+1/3+\cdots+1/15$ directly.
        feedback: >
          $H_{15}=\sum_{k=1}^{15}1/k\approx3.318$, barely more than
          $H_{10}\approx2.929$ despite the extra $5$ elements — the slow
          $\ln n$ growth.
      - teach: >
          Assuming the closing probabilities are all $1/n$ throughout,
          rather than $1/m$ for the current remaining pool, misses that
          they shrink as elements get used up. Treating cycle count and
          cycle length as the same question is a separate error — they
          have very different distributions.
      - ask: >
          When building a uniform random permutation of $n=10$ elements by
          tracing cycles, after $4$ elements have already been placed into
          cycles, what is the probability that the current cycle closes at
          the next step?
        expects: "1/6"
        tolerance: 0.0005
        hint: >
          There are $10-4=6$ elements left in the pool; the closing
          probability is $1$ over that count.
        feedback: >
          With $6$ elements still unplaced, the next step closes the cycle
          with probability $1/6$ — not $1/10$, since the pool has already
          shrunk.

  - node: quant-probability.counting.birthday-problem
    hook: >
      This is the most quoted number in the interview canon — $23$ people
      for even odds — and the reason it surprises people is a mismatch
      between $n$ people and the $\binom{n}{2}$ pairs of people, not a
      mistake in the arithmetic.
    explanation: >
      Model $n$ people's birthdays as an ordered list of $n$ independent,
      uniform choices among $365$ days — the classical model applies since,
      by assumption, every one of the $365^n$ ordered lists is equally
      likely. Complementary counting is the efficient route: instead of
      tracking which pairs collide directly, count the lists where every
      birthday is distinct. The first person's birthday can be anything
      ($365$ options), the second must avoid the first's day ($364$
      options), the third must avoid both ($363$), and so on — a
      $k$-permutation of $365$ days taken $n$ at a time,
      $365\cdot364\cdots(365-n+1)$ all-distinct lists. Dividing by the
      total $365^n$ and subtracting from $1$ gives
      $\Pr(\text{some match})=1-\dfrac{365!}{(365-n)!\,365^n}$.

      The count grows uncomfortably fast because each new person has to
      avoid every day already taken, and the number of already-taken days
      grows with $n$: the product of "fraction of days still free" terms
      shrinks faster and faster as $n$ grows, which is why the crossover to
      even odds happens at a strikingly small $n=23$ rather than anywhere
      near $365/2$.

      The number to have memorized cold is $23$ people for just over
      $50\%$; everything past that (other numbers of days, sharper
      approximations) is a refinement of this same complementary-counting
      setup, not a different method.
    worked: >
      For $n=40$ people, the all-distinct fraction is
      $\dfrac{365!}{325!\cdot365^{40}}\approx0.1088$, so
      $\Pr(\text{some match})\approx1-0.1088=0.8912$ — already past $89\%$
      with fewer than $11\%$ as many people as days in the year.
    interview: >
      "How many people need to be in a room before two share a birthday
      with better-than-even odds" is asked expecting the number $23$ named
      immediately, followed by the complementary-counting derivation if
      pressed — interviewers listen for the shrinking-fraction structure,
      not a guess based on $365/2$.
    pitfalls: >
      Guessing the crossover scales like $365/2$ badly overstates it — the
      true scaling is around $\sqrt{365}$, driven by the number of pairs,
      not the number of people. Confusing "some two people share a
      birthday" with "someone shares your specific birthday" computes an
      entirely different, much smaller probability, since the second
      question has only $n-1$ chances rather than $\binom{n}{2}$.
    recap: >
      With $23$ people the chance two share a birthday just passes $50\%$,
      computed as $1$ minus the falling-factorial fraction of all-distinct
      ordered birthday lists.
    steps:
      - teach: >
          Model $n$ people's birthdays as an ordered list of $n$
          independent, uniform choices among $365$ days — the classical
          model applies since every one of the $365^n$ ordered lists is
          equally likely.
      - teach: >
          Complementary counting is the efficient route: count the lists
          where every birthday is distinct instead. The first person's
          birthday can be anything ($365$ options), the second must avoid
          the first's day ($364$), the third must avoid both ($363$), and
          so on — a $k$-permutation of $365$ days taken $n$ at a time.
          Dividing by $365^n$ and subtracting from $1$ gives
          $\Pr(\text{some match})=1-\dfrac{365!}{(365-n)!\,365^n}$.
      - teach: >
          A conference has $30$ attendees, well past the $23$-person
          crossover — plug $n=30$ into the same all-distinct fraction to
          see how quickly the match probability climbs beyond even odds.
      - ask: >
          What is the approximate probability that at least two of the
          $30$ attendees share a birthday?
        expects: "0.7063"
        tolerance: 0.0005
        hint: >
          Compute the all-distinct fraction
          $365\cdot364\cdots336/365^{30}$ first, then subtract from $1$.
        feedback: >
          The all-distinct fraction is
          $365\cdot364\cdots336/365^{30}\approx0.2937$, so
          $\Pr(\text{some match})\approx1-0.2937=0.7063$.
      - teach: >
          The count grows uncomfortably fast because each new person has
          to avoid every day already taken, and the fraction of days still
          free shrinks a little more with every addition — which is why
          the crossover to even odds happens at a strikingly small $n=23$,
          driven by how fast the number of *pairs of people* grows compared
          to the number of people themselves.
      - ask: >
          For $n=5$ people, what is
          $\Pr(\text{all distinct birthdays}) =
          \dfrac{365\cdot364\cdot363\cdot362\cdot361}{365^{5}}$, to four
          decimal places?
        expects: "0.9729"
        tolerance: 0.0005
        hint: >
          Multiply the five shrinking fractions
          $365/365,\,364/365,\,363/365,\,362/365,\,361/365$ together.
        feedback: >
          $\dfrac{365\cdot364\cdot363\cdot362\cdot361}{365^{5}}\approx
          0.9729$ — still close to $1$, since only $5$ people barely dent
          the $365$ days.
      - teach: >
          Guessing the crossover scales like $365/2$ badly overstates it —
          the true scaling is around $\sqrt{365}$, driven by the number of
          pairs, not the number of people. Confusing "some two people
          share a birthday" with "someone shares your specific birthday"
          computes an entirely different, much smaller probability, since
          the second question has only $n-1$ chances rather than pairing
          everyone against everyone.
      - ask: >
          In a room of $30$ people, which probability is smaller?
        choices:
          - text: >
              The probability that at least two people (any two) share a
              birthday
            feedback: >
              This is the larger one — every pair among the $30$ people
              gets a chance to collide, far more chances than a single
              targeted comparison.
          - text: >
              The probability that someone else in the room shares *your*
              specific birthday
            correct: true
            feedback: >
              Right — only $29$ people are being compared against your one
              fixed birthday, far fewer comparisons than every pair among
              all $30$ people.
          - text: >
              They are exactly equal
            feedback: >
              They're not: the "any two" version compares every pair of
              people, while the "shares yours" version only compares $29$
              people against one fixed day.
        feedback: >
          The "someone shares your specific birthday" probability is much
          smaller, since only $29$ comparisons are made against one fixed
          day, not every pair among all $30$ people.

  - node: quant-probability.counting.collision-scaling
    hook: >
      This is the birthday problem generalized and then weaponized: the
      same $\sqrt{N}$ scaling that makes $23$ people surprising is exactly
      why a hash digest needs twice as many bits as the population size
      would naively suggest.
    explanation: >
      Generalize the birthday count from $365$ days to $N$ equally likely
      cells, with $n$ items dropped in independently. There are
      $\binom{n}{2}$ pairs of items, and each pair collides — lands in the
      same cell — with probability exactly $1/N$. While $n$ stays small
      relative to $N$, these pairwise collision events are close enough to
      independent that the probability none of them happen is well
      approximated by $(1-1/N)^{\binom{n}{2}}\approx e^{-\binom{n}{2}/N}
      \approx e^{-n^2/(2N)}$, using $1-x\approx e^{-x}$ for small $x$ and
      $\binom{n}{2}\approx n^2/2$.

      Setting the no-collision probability to $1/2$ and solving,
      $n^2/(2N)\approx\ln2$, gives the crossover at
      $n\approx\sqrt{2N\ln2}\approx1.177\sqrt{N}$ — the scale is genuinely
      $\sqrt{N}$, not $N$, which is exactly why $365$ days needs only about
      $23$ people ($1.177\sqrt{365}\approx22.5$) rather than anything close
      to $365$ itself: the number of *pairs* grows quadratically in $n$
      while the number of cells grows only linearly in $N$.

      This scaling is a security fact in disguise: a hash function with a
      $b$-bit digest has $N=2^b$ possible outputs, so an attacker hunting
      for any two inputs that collide (not a specific target) succeeds
      after roughly $2^{b/2}$ attempts, not $2^b$ — the "birthday attack."
      A digest is therefore only as collision-resistant as its bit count
      *halved*, which is why cryptographic hashes are built with double the
      bit length their apparent security target would suggest.
    worked: >
      A system assigns each of $n$ requests a random ID out of
      $N=10^6$ possible values; even odds of two requests colliding arrive
      at $n\approx1.177\sqrt{10^6}=1177$ requests — barely $0.12\%$ of the
      ID space. A $48$-bit hash has $N=2^{48}\approx2.81\times10^{14}$
      outputs, so a birthday-style collision search needs only about
      $2^{24}\approx1.68\times10^7$ attempts, not the full $2^{48}$.
    interview: >
      "How many random IDs/UUIDs/hash outputs before a collision becomes
      likely" is answered with $\approx1.18\sqrt{N}$ directly, and "why do
      we need $256$-bit hashes for $128$-bit security" is answered by
      naming the birthday attack and the halved-exponent scaling.
    pitfalls: >
      Estimating the collision point as a fraction of $N$ itself (like
      $N/2$) drastically overstates how many draws are safe. The
      approximation needs $n\ll N$; once $n$ is a sizeable fraction of $N$,
      the pairwise-independence assumption breaks down.
    recap: >
      Collisions among $N$ equally likely values become likely at
      $n\approx1.18\sqrt{N}$, not $n\approx N$, which is why an attacker
      only needs about $2^{b/2}$ tries to collide a $b$-bit hash.
    steps:
      - teach: >
          Generalizing the birthday count from $365$ days to $N$ equally
          likely cells, with $n$ items dropped in independently: there are
          $\binom{n}{2}$ pairs of items, and each pair collides with
          probability exactly $1/N$.
      - teach: >
          While $n$ stays small relative to $N$, the pairwise collision
          events are close enough to independent that
          $\Pr(\text{no collision})\approx e^{-\binom{n}{2}/N}\approx
          e^{-n^2/(2N)}$. Setting this to $1/2$ and solving gives the
          crossover at $n\approx\sqrt{2N\ln2}\approx1.177\sqrt{N}$ —
          genuinely $\sqrt{N}$ scaling, not $N$.
      - teach: >
          A system assigns each of $n$ requests a random ID out of
          $N=10^4$ possible values.
      - ask: >
          Approximately how many requests are needed before there's even
          odds of two requests colliding?
        expects: "118"
        tolerance: 2
        hint: >
          Use $n\approx1.177\sqrt{N}$ with $N=10^4$.
        feedback: >
          $n\approx1.177\sqrt{10^4}=1.177\cdot100\approx118$ requests.
      - teach: >
          This scaling is a security fact in disguise: a hash function
          with a $b$-bit digest has $N=2^b$ possible outputs, so an
          attacker hunting for any two inputs that collide succeeds after
          roughly $2^{b/2}$ attempts, not $2^b$ — the birthday attack. A
          digest is therefore only as collision-resistant as its bit count
          *halved*.
      - ask: >
          A hash function has a $40$-bit digest. Roughly how many attempts
          does a birthday-style collision search need?
        expects: "1048576"
        tolerance: 50000
        hint: >
          The birthday attack needs about $2^{b/2}$ attempts for a $b$-bit
          digest.
        feedback: >
          $2^{40/2}=2^{20}=1048576$ attempts, not the full
          $2^{40}\approx1.1\times10^{12}$.
      - teach: >
          Estimating the collision point as a fraction of $N$ itself (like
          $N/2$) drastically overstates how many draws are safe, and the
          approximation needs $n\ll N$ — once $n$ is a sizeable fraction of
          $N$, the pairwise-independence assumption breaks down.
      - ask: >
          Why do systems needing $128$-bit security typically use a
          $256$-bit hash rather than a $128$-bit one?
        choices:
          - text: >
              Because a $256$-bit hash runs faster than a $128$-bit hash
            feedback: >
              Bit length is chosen for collision resistance, not speed.
          - text: >
              Because a $b$-bit digest only offers about $b/2$ bits of
              collision resistance, so $256$ bits are needed to get $128$
              bits of birthday-attack resistance
            correct: true
            feedback: >
              Right — the birthday attack finds a collision in about
              $2^{b/2}$ tries, so a $256$-bit digest gives roughly
              $2^{128}$ resistance, not $2^{256}$.
          - text: >
              Because a $128$-bit digest already gives $128$ bits of
              security against every attack, and $256$ is just a margin of
              safety
            feedback: >
              It doesn't: a birthday collision search against a
              $128$-bit digest needs only about $2^{64}$ tries, half the
              bits you'd guess from the digest length alone.
        feedback: >
          A $b$-bit digest only resists birthday-style collisions up to
          about $2^{b/2}$ attempts, so doubling the bit count to $256$ is
          what's needed to reach $128$ bits of actual collision
          resistance.

  - node: quant-probability.counting.poker-hands
    hook: >
      Poker-hand counting is the canonical worked example for a
      rank-then-suit discipline that keeps every structured five-card count
      from silently double- or under-counting.
    explanation: >
      Every hand type breaks into the same two-stage decision: first fix
      which card ranks are involved and in what role (the pair's rank, the
      kicker's rank, and so on), then fix which suits realize each of those
      ranks — the multiplication principle combines the two stages since
      the number of suit choices never depends on which ranks were picked.
      All $\binom{52}{5}=2598960$ five-card hands are equally likely under
      a uniform shuffle, by the classical model, so every hand-type
      probability is just that type's count divided by this fixed
      denominator.

      The discipline that prevents overcounting is choosing combinations,
      not ordered picks, whenever two roles are interchangeable. If a hand
      type calls for two different ranks each contributing a pair (two
      pair), the two ranks play a symmetric role — nothing distinguishes
      "rank $A$'s pair, then rank $B$'s pair" from the reverse as a hand —
      so the rank choice is $\binom{13}{2}$, not the ordered $13\cdot12$,
      which would count every actual hand twice. Roles that genuinely
      differ (the trip's rank versus the pair's rank in a full house) are
      chosen with two separate, ordinary counts multiplied together, since
      swapping them changes the hand type entirely.

      The suits step is always straightforward once ranks are fixed: a
      rank contributing $j$ cards to the hand needs $\binom{4}{j}$ suit
      choices, since all $4$ suits of that rank are interchangeable inputs
      to an unordered subset.
    worked: >
      Three of a kind (exactly three cards of one rank, plus two cards of
      two other, distinct ranks — not a full house): the trip's rank is
      $13$ choices with $\binom{4}{3}=4$ suit choices, and the other two
      ranks are $\binom{12}{2}=66$ choices (interchangeable roles) with $4$
      suit choices each, giving $13\cdot4\cdot66\cdot4^2=54912$ hands,
      probability $54912/2598960\approx0.02113$, about $1$ in $47$.
    interview: >
      "How many ways to get [some named hand]" is the format, and
      interviewers grade the setup — did ranks get chosen before suits, and
      did an interchangeable pair of roles get a combination rather than an
      ordered pick — more than the arithmetic itself.
    pitfalls: >
      Using $13\cdot12$ instead of $\binom{13}{2}$ whenever two chosen
      ranks play symmetric roles doubles the count. Forgetting that a rank
      contributing $j$ cards needs $\binom{4}{j}$, not $4^j$, suit choices
      is the standard slip on hands with a trip or a quad.
    recap: >
      Choose ranks first, suits second, and use $\binom{13}{2}$ rather than
      $13\cdot12$ whenever two chosen ranks are interchangeable — the
      discipline behind every structured poker-hand count.
    steps:
      - teach: >
          Every hand type breaks into the same two-stage decision: first
          fix which card ranks are involved and in what role, then fix
          which suits realize each of those ranks — the multiplication
          principle combines the two stages since the suit choices never
          depend on which ranks were picked.
      - teach: >
          All $\binom{52}{5}=2598960$ five-card hands are equally likely
          under a uniform shuffle, so every hand-type probability is just
          that type's count divided by this fixed denominator. A rank
          contributing $j$ cards to the hand needs $\binom{4}{j}$ suit
          choices, since all $4$ suits of that rank are interchangeable
          inputs to an unordered subset.
      - teach: >
          Four of a kind: all four cards of one rank, plus one card of a
          different rank (the kicker).
      - ask: >
          How many four-of-a-kind hands are there?
        expects: "624"
        hint: >
          Choose the quad's rank, its suits (all $4$, so only $1$ way),
          then the kicker from the remaining cards.
        feedback: >
          $13\cdot\binom{4}{4}\cdot48=13\cdot1\cdot48=624$ hands.
      - teach: >
          The discipline that prevents overcounting is choosing
          combinations, not ordered picks, whenever two roles are
          interchangeable. Two pair calls for two different ranks that
          play a symmetric role — nothing distinguishes "rank $A$'s pair,
          then rank $B$'s pair" from the reverse — so the rank choice is
          $\binom{13}{2}$, not the ordered $13\cdot12$, which would count
          every actual hand twice.
      - ask: >
          How many one-pair hands are there (one rank contributing $2$
          cards via $\binom{4}{2}$, and three other distinct ranks chosen
          as $\binom{12}{3}$, each contributing $1$ card with $4$ suit
          choices)?
        expects: "1098240"
        hint: >
          Multiply $13$, $\binom{4}{2}$, $\binom{12}{3}$, and $4^3$
          together.
        feedback: >
          $13\cdot\binom{4}{2}\cdot\binom{12}{3}\cdot4^3=13\cdot6\cdot220
          \cdot64=1098240$ hands.
      - teach: >
          Using $13\cdot12$ instead of $\binom{13}{2}$ whenever two chosen
          ranks play symmetric roles doubles the count, and forgetting
          that a rank contributing $j$ cards needs $\binom{4}{j}$, not
          $4^j$, suit choices is the standard slip on hands with a trip or
          a quad.
      - ask: >
          Which correctly counts two-pair hands (two different ranks each
          contributing a pair, plus one card of a third rank as the
          kicker)?
        choices:
          - text: >
              $\binom{13}{2}\cdot6^2\cdot44$
            correct: true
            feedback: >
              Right — the two pair-ranks are chosen as an unordered pair
              since their roles are symmetric, each pair gets
              $\binom{4}{2}=6$ suit choices, and the kicker has $44$
              remaining cards to choose from.
          - text: >
              $13\cdot12\cdot6^2\cdot44$
            feedback: >
              The two pair-ranks play a symmetric role — nothing
              distinguishes which one is "first" — so they should be
              chosen as $\binom{13}{2}$, not the ordered $13\cdot12$, which
              double-counts every hand.
          - text: >
              $\binom{13}{2}\cdot4^2\cdot44$
            feedback: >
              Each pair needs $2$ suits out of $4$ for its rank,
              $\binom{4}{2}=6$ ways, not a single-suit choice of $4$.
        feedback: >
          $\binom{13}{2}\cdot6^2\cdot44$ is correct: the two interchangeable
          pair-ranks as a combination, $6$ suit choices for each pair, and
          $44$ remaining cards for the kicker.

  - node: quant-probability.counting.central-binomial
    hook: >
      The $\sqrt{n}$-scale mass carried by the middle of Pascal's triangle
      is the counting fact underneath the width of a binomial distribution
      and the growth rate of Catalan numbers alike — worth knowing as a
      reflex Stirling application.
    explanation: >
      Among the $2n+1$ binomial coefficients in row $2n$ of Pascal's
      triangle, the middle one $\binom{2n}{n}$ is the largest — compare
      consecutive terms via the ratio
      $\binom{2n}{k+1}/\binom{2n}{k}=(2n-k)/(k+1)$, which is greater than
      $1$ exactly when $k<n$, so the terms strictly increase up to $k=n$
      and strictly decrease afterward.

      Stirling's approximation, $n!\sim\sqrt{2\pi n}\,(n/e)^n$, turns the
      exact ratio of factorials into a clean closed form. Writing
      $\binom{2n}{n}=(2n)!/(n!)^2$ and substituting the approximation for
      each factorial, the $e^{2n}$ terms in numerator and denominator
      cancel, and simplifying the remaining square-root and polynomial
      factors leaves $\binom{2n}{n}\sim4^n/\sqrt{\pi n}$ — a usable
      closed-form estimate for a number that would otherwise require
      computing two large factorials.

      A cross-check on the size comes from counting subsets directly: each
      $\binom{2n}{k}$ is the number of $k$-element subsets of a $2n$-element
      set, and every subset has *some* size $k$ between $0$ and $2n$, so
      summing over $k$ counts every subset exactly once, giving row total
      $4^n$ — the same $2^{2n}$ the multiplication principle gives directly
      for the number of subsets of a $2n$-set. Since the middle term
      dominates the row and the row totals $4^n$, the middle term alone
      must carry a share of order $1/\sqrt{n}$ of the entire row's mass,
      matching the Stirling estimate's $1/\sqrt{\pi n}$ factor exactly —
      the same $\sqrt{n}$ that shows up as the width of a binomial
      distribution and in the growth rate of Catalan numbers.
    worked: >
      At $n=15$, the exact value is $\binom{30}{15}=155117520$, against the
      Stirling estimate $4^{15}/\sqrt{15\pi}=1073741824/\sqrt{47.124}
      \approx156415000$ — high by about $0.84\%$, tightening further as
      $n$ grows.
    interview: >
      "Estimate $\binom{2n}{n}$ for large $n$ without a calculator" is
      answered by naming Stirling's estimate $4^n/\sqrt{\pi n}$ directly,
      and a common follow-up asks why the middle term dominates the row —
      the $1/\sqrt{n}$-share argument from the row summing to $4^n$.
    pitfalls: >
      Forgetting the $\sqrt{\pi n}$ denominator and quoting just $4^n$
      overstates the central term by an ever-growing factor as $n$
      increases. Applying the estimate at very small $n$ gives a
      misleadingly large relative error, since Stirling's approximation
      itself is only asymptotic.
    recap: >
      $\binom{2n}{n}\sim4^n/\sqrt{\pi n}$, the largest term in its Pascal
      row, carrying an order $1/\sqrt{n}$ share of the row's total mass of
      $4^n$.
    steps:
      - teach: >
          Among the $2n+1$ binomial coefficients in row $2n$ of Pascal's
          triangle, the middle one $\binom{2n}{n}$ is the largest — compare
          consecutive terms via the ratio
          $\binom{2n}{k+1}/\binom{2n}{k}=(2n-k)/(k+1)$, which exceeds $1$
          exactly when $k<n$, so the terms increase up to $k=n$ and
          decrease afterward.
      - teach: >
          Stirling's approximation, $n!\sim\sqrt{2\pi n}\,(n/e)^n$, turns
          $\binom{2n}{n}=(2n)!/(n!)^2$ into a closed form: substituting the
          approximation for each factorial, the $e^{2n}$ terms cancel, and
          simplifying the remaining square-root and polynomial factors
          leaves $\binom{2n}{n}\sim4^n/\sqrt{\pi n}$.
      - teach: >
          Take $n=8$, small enough to compute the exact central binomial
          coefficient by hand, and compare it against what the Stirling
          estimate predicts for the same row.
      - ask: >
          Using the Stirling estimate $4^n/\sqrt{\pi n}$, approximately
          what is $\binom{16}{8}$ at $n=8$?
        expects: "13073"
        tolerance: 5
        hint: >
          Compute $4^8$, then divide by $\sqrt{8\pi}$.
        feedback: >
          $4^8/\sqrt{8\pi}=65536/\sqrt{25.13}\approx13073$, against the
          exact value $\binom{16}{8}=12870$ — high by about $1.6\%$.
      - teach: >
          A cross-check on the size comes from counting subsets directly:
          summing $\binom{2n}{k}$ over every $k$ from $0$ to $2n$ counts
          every subset of a $2n$-element set exactly once, giving row
          total $4^n$. Since the middle term dominates the row and the row
          totals $4^n$, the middle term alone must carry a share of order
          $1/\sqrt{n}$ of the entire row's mass.
      - ask: >
          At $n=15$, using the exact value $\binom{30}{15}=155117520$ and
          the row total $4^{15}=1073741824$, what fraction of the row's
          total mass does the central term carry, to four decimal places?
        expects: "0.1445"
        tolerance: 0.0005
        hint: >
          Divide the central term by the row total.
        feedback: >
          $155117520/1073741824\approx0.1445$, consistent with the
          Stirling share $1/\sqrt{15\pi}\approx0.1456$.
      - teach: >
          Forgetting the $\sqrt{\pi n}$ denominator and quoting just $4^n$
          overstates the central term by an ever-growing factor as $n$
          increases, and applying the estimate at very small $n$ gives a
          misleadingly large relative error, since Stirling's
          approximation itself is only asymptotic.
      - ask: >
          Which is closest to $\binom{2n}{n}/4^n$ as $n$ grows large?
        choices:
          - text: >
              $1$
            feedback: >
              This would mean the central term carries the entire row's
              mass, but the row has $2n+1$ terms spreading that mass out.
          - text: >
              $1/\sqrt{\pi n}$
            correct: true
            feedback: >
              Right — the Stirling estimate $\binom{2n}{n}\sim
              4^n/\sqrt{\pi n}$ divided by $4^n$ leaves exactly this
              shrinking share.
          - text: >
              $1/n$
            feedback: >
              The share shrinks like $1/\sqrt{n}$, not the faster $1/n$ —
              the central term dominates its row more than a naive $1/n$
              spread would suggest.
        feedback: >
          $\binom{2n}{n}/4^n\sim1/\sqrt{\pi n}$: the central term's share
          of the row shrinks like $1/\sqrt{n}$, matching the $\sqrt{n}$
          width of a binomial distribution.
