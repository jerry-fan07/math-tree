unit: quant-games.auctions
opening: >
  Auctions formalize any deal that closes at whatever price a rule extracts from competing
  bidders, and this unit builds that machinery from the ground up. It opens with the shared
  skeleton — allocation and payment rules, the four standard formats, and the private-versus-common-value
  fork that decides everything downstream — then proves the two headline results under private
  values: truthful bidding is dominant in second-price, and first-price bidding shades to
  a closed form under uniform values, tied together by revenue equivalence. It closes on common-value
  ground, where the same machinery produces the winner's curse — winning is evidence your
  estimate ran high — and the correction that fixes it, worked through the jar-of-coins classic,
  a takeover-bid variant, and the two-directional effect of adding more bidders to the room.
lessons:
  - node: quant-games.auctions.setup
    hook: >
      Every take-home or live prompt that starts with "suppose you're selling X" is quietly
      asking you to name two functions before anything else: who gets the object, and what
      they pay for it.
    explanation: >
      An auction formalizes a specific decision problem: $n$ bidders each hold private information
      about an object, submit some action (a bid), and the auctioneer commits in advance to
      two rules — an allocation rule mapping bids to a winner, and a payment rule mapping
      bids to a price. Nothing about "highest bid wins" or "winner pays their own bid" is
      inherent to the word "auction"; those are just the most common choices for the two rules,
      and the whole subject is really about how different choices for either rule change what
      a rational bidder should submit.


      The payoff arithmetic is deliberately simple: if your value for the object is $v$ and
      you end up paying $p$, your payoff is $v - p$ on a win and $0$ on a loss. That $0$ for
      every loser is not a detail to skim past — it's what makes "profit comes only from winning
      below value" true, and it's why a bidder who pays exactly their own value has accomplished
      nothing, whatever the allocation rule handed them.


      Holding this frame — payoff $v - p$ on a win, an allocation rule, and a payment rule
      as three separate, freely choosable ingredients — is what lets you evaluate any auction
      variant an interviewer invents on the spot instead of pattern-matching to the one format
      you memorized. Unless a problem says otherwise, assume a single object, no reserve price,
      no budget constraint, no collusion, and no resale.
    worked: >
      Three bids arrive for a used forklift: $25$, $35$, and your own bid of $60$, all in
      dollars. The allocation rule says the highest bid wins, so you take the forklift regardless
      of which payment rule is in force. Under a pay-your-bid rule you owe $60$, so your payoff
      is $60 - 60 = 0$; under a pay-the-second-highest rule you owe $35$, so your payoff is
      $60 - 35 = 25$. Same three bids, same winner, but the payment rule alone turns an identical
      win into either zero profit or a profit of $25$ dollars — exactly why the payment rule,
      not the allocation rule, does almost all the work in every technique that follows.
    interview: >
      Any "design a mechanism" or "here's an auction, what happens" prompt wants the allocation
      rule and payment rule stated as two explicit, separate objects before you commit to
      any format — interviewers are listening for the $v - p$ payoff and the fact that losers
      earn zero, not a jump straight to "the highest bidder wins and pays their bid."
    pitfalls: >
      Assuming "auction" automatically means highest-bid-wins-and-pays-own-bid; that's one
      specific pair of rules among many, and this unit exists because other pairs behave completely
      differently. Forgetting that a bidder who pays exactly their value nets zero regardless
      of winning — "I won" and "I profited" are different claims.
    recap: >
      An auction is an allocation rule plus a payment rule layered on private information,
      and since every loser earns zero, all profit comes from winning at a price below your
      own value.
    dialogue:
      - part: Three envelopes and a missing rule
        teach: >
          A café is selling its old espresso machine by sealed bid. Three
          envelopes come in: $40$, $70$ and yours, $95$, all in dollars. The
          machine is worth $110$ dollars to you. The seller's notice says the
          highest envelope gets the machine and the winner pays what they
          wrote down.
      - ask: >
          What is your payoff, in dollars?
        expects: "15"
        hint: >
          You win. What is the machine worth to you, and what leaves your
          pocket?
        feedback: >
          Your $95$ is the highest, so you win and pay $95$. The machine is
          worth $110$ to you, so you are up $110 - 95 = 15$ dollars.
      - ask: >
          The seller reprints the notice: the highest envelope still gets the
          machine, but the winner now pays the second-highest number written.
          Same three envelopes. Your payoff now?
        expects: "40"
        hint: >
          Who wins has not changed. Which number is the price?
        feedback: >
          You still win, but the price is now the runner-up's $70$, so you are
          up $110 - 70 = 40$ dollars. Nothing about the bids moved.
      - ask: >
          Your payoff went from $15$ to $40$ dollars. What changed?
        choices:
          - text: >
              The winner changed.
            feedback: >
              You won both times. The rule that picks the winner — highest
              envelope — was identical in both notices.
          - text: >
              The rule that turns the envelopes into a price changed.
            correct: true
            feedback: >
              Right. One rule picks the winner and a separate rule sets the
              price, and only the second one was reprinted.
          - text: >
              Your value changed, because a cheaper machine is worth more to
              you.
            feedback: >
              The machine is worth $110$ dollars to you whatever you pay for
              it. Value is what you get; price is what you give up. Your payoff
              is the difference, and only the price moved.
        feedback: >
          Two notices, the same winner, a payoff that nearly tripled. "Who
          gets it" and "what is paid" are separate decisions, and the second
          one is where the money is.

      - part: What a seller has to announce
        ask: >
          A third seller's notice says only: "Highest envelope gets the
          machine." Can you compute your payoff from the same three envelopes?
        choices:
          - text: >
              Yes, $15$ dollars: an auction means you pay your bid.
            feedback: >
              That is one possible price rule, and the second notice already
              used a different one. Nothing on this notice says which applies.
          - text: >
              No: it names a winner but not a price.
            correct: true
            feedback: >
              You know you win and nothing else. Your payoff could be $40$, $15$
              or anything else, depending on a rule nobody has stated.
          - text: >
              Yes, $110$ dollars: no price was announced, so the winner pays
              nothing.
            feedback: >
              A sale at a price of $0$ is itself a price rule, and the notice
              does not say it either. Silence about the price is not a price of
              zero; it is a missing rule.
        feedback: >
          A notice with only a winner rule leaves the payoff undefined, and so
          it leaves your bid undefined too: you cannot choose a number when you
          do not know what it will cost you.
      - reflect: >
          Say exactly what a seller must commit to before anyone bids, so that
          every bidder can work out their payoff from any set of envelopes. Why
          must it be fixed before the envelopes are opened rather than after?
        answer: >
          Two rules, both stated in advance: an allocation rule that turns the
          bids into a winner, and a payment rule that turns the same bids into
          a price. With both, every possible set of envelopes maps to a payoff
          for every bidder, so each bidder can weigh one bid against another.
          A seller who picks the rules after reading the envelopes has made
          bids meaningless — your number would be judged by a rule you could
          not anticipate.
      - teach: >
          That is an auction as a game. Each of $n$ bidders holds private
          information about the object and submits a bid; an allocation rule
          maps the bids to a winner and a payment rule maps them to a price.
          With value $v$, winning at price $p$ pays $v - p$, and every loser
          gets $0$. Unless stated otherwise: one object, no reserve price, no
          budget limits, no collusion, no resale.
      - ask: >
          Under the first notice, pay your own bid, you write $110$ — exactly
          your value — and win. What is your payoff, in dollars?
        expects: "0"
        hint: >
          Value minus price.
        feedback: >
          $110 - 110 = 0$. You own the machine and are exactly as well off as
          the bidders who went home empty-handed. "I won" and "I profited" are
          different claims.

      - part: Rulebooks nobody has used before
        ask: >
          A fourth notice: the highest envelope gets the machine and pays the
          lowest number written by anyone. Same envelopes, $40$, $70$ and $95$.
          Your payoff?
        expects: "70"
        hint: >
          The allocation rule is unchanged. Read the payment rule literally.
        feedback: >
          You win, and the price is the lowest envelope, $40$, so you are up
          $110 - 40 = 70$ dollars. An unusual pair of rules is still a pair of
          rules, and the arithmetic does not care that you have never seen
          this one.
      - ask: >
          A fifth notice: "After reading all the envelopes, the owner will
          decide who gets the machine and what they pay." Which part of the
          definition does it fail?
        choices:
          - text: >
              It has no allocation rule, since the winner need not be the
              highest bid.
            feedback: >
              A winner rule need not favour the highest bid — "the lowest
              envelope wins" would still be a rule. The trouble is that no
              rule of any kind is fixed in advance.
          - text: >
              It is fine: the owner's choice is just a complicated rule.
            feedback: >
              A rule is a function of the bids, known before you bid. The
              owner's later mood is not; two bidders reading this notice
              cannot compute their payoff from any set of envelopes.
          - text: >
              Both rules are missing: nothing maps bids to a winner or a price
              before the envelopes arrive.
            correct: true
            feedback: >
              Right. Both functions are left to be chosen after the fact, so
              there is no game for the bidders to play — only a negotiation.
        feedback: >
          Committed-in-advance is the clause that turns a sale into a game:
          once the rules are fixed, your bid is the only thing you choose.
      - ask: >
          Back under the first notice, pay your own bid, with the machine worth
          $110$ dollars to you. Which bids could ever leave you with a
          positive payoff?
        choices:
          - text: >
              Only a bid of exactly $110$, since that is honest.
            feedback: >
              Winning at $110$ pays $110 - 110 = 0$. Honesty earns nothing when
              your bid is also your price.
          - text: >
              A bid above $110$, to make sure you win.
            feedback: >
              Winning at, say, $120$ pays $110 - 120 = -10$. Above your value,
              every win costs you money.
          - text: >
              Only bids below $110$.
            correct: true
            feedback: >
              Profit is $v - p$ and the price here is your bid, so only a bid
              below $110$ can win anything. The open question is how far below.
        feedback: >
          Every loser gets $0$ and a win at your value gets $0$, so all the
          profit in an auction lives below value. Every strategy question that
          follows asks how far below to aim — and the answer depends on which
          payment rule is in force.

  - node: quant-games.auctions.formats
    hook: >
      Four different-sounding formats collapse into two behaviors the moment you ask one question:
      does your own bid set the price you pay, or only whether you win at all?
    explanation: >
      The two rules from the general definition — allocation and payment — take four standard
      concrete forms. English (ascending): the price rises continuously, bidders drop out
      publicly and irreversibly, and the last one standing wins at roughly the price the second-to-last
      bidder quit at. Dutch (descending): the price falls from a high starting point until
      the first bidder to accept claims the object at whatever price the clock had reached.


      First-price sealed-bid: every bidder submits one number in secret, the highest wins,
      and the winner pays exactly their own bid. Second-price sealed-bid, or Vickrey: bids
      are again sealed and secret, the highest still wins, but the price charged is the second-highest
      bid, not the winner's own.


      The grouping that actually matters is the payment rule, not visibility. Dutch and
      first-price both make the winner's own number the price paid — the clock stops where
      you say, the sealed bid is what you wrote — call these pay-your-bid formats. English
      and second-price both make the price come from somewhere other than the number that
      decided the win — English from the runner-up's exit point, second-price from the
      runner-up's bid. Recognizing which bucket a described format falls
      into is worth more than memorizing four separate names.
    worked: >
      Three bidders value a delivery van at $20$, $50$, and $80$ dollars. Run it as English:
      the price climbs from zero, the $20$-value bidder drops out at $20$, the $50$-value
      bidder drops out at $50$, and the $80$-value bidder wins, paying just above $50$. Run
      the same three values as second-price sealed-bid, each bidding their true value: the
      highest bid, $80$, wins and pays the second-highest bid, $50$. Both formats land the
      winner at a price of $50$ here. The number that matters is not which format ran, but
      the price paid — first-price or Dutch would instead charge whatever price the $80$-value
      bidder personally chose to stop at, which need not be $50$ at all.
    interview: >
      "Walk me through the four auction formats" wants each one named by its allocation and
      payment behavior, not just its label, and the sharper question — "which two behave the
      same way?" — is testing whether you reach for the pay-your-bid-versus-pay-the-runner-up
      split rather than reciting definitions in isolation.
    pitfalls: >
      Describing second-price as "the second-highest bidder wins" — the highest bidder still
      wins; only the price they pay comes from the runner-up. Treating "sealed" and "first-price"
      as synonyms — second-price is also sealed-bid, and the sealed-versus-open distinction
      is orthogonal to the payment rule that actually drives strategy.
    recap: >
      The four formats split cleanly by payment rule: Dutch and first-price make your own
      bid the price you pay, English and second-price make the price come from someone else's
      number.
    dialogue:
      - part: One guitar, sold four ways
        teach: >
          Four collectors want the same guitar. Their values are $45$, $60$ and
          $85$ dollars, and yours is $120$. The seller has not yet picked how to
          run the sale, so you work through the options.
      - ask: >
          First option: a price starts at $0$ and rises steadily in public.
          Each collector stays in while the price is below their value and
          quits for good when it reaches it; the last one left buys at the
          current price. Roughly what price do you pay, in dollars?
        expects: "85"
        hint: >
          Who is the last rival to quit, and at what price?
        feedback: >
          The $45$ collector quits at $45$, the $60$ at $60$, the $85$ at $85$.
          The moment the last rival quits you are alone, so you buy at about
          $85$ dollars — the runner-up's value, not yours.
      - ask: >
          Second option: everyone writes one number in a sealed envelope, the
          highest envelope wins, and the winner pays the second-highest number
          written. Everyone writes their value. What do you pay?
        expects: "85"
        feedback: >
          Your $120$ wins and the price is the runner-up's envelope, $85$
          dollars. Same price as the rising clock, from one envelope each.
      - ask: >
          Third option: sealed envelopes again, highest wins, but the winner
          pays their own number. The rivals write $30$, $50$ and $75$; you
          write $100$. What is your payoff, in dollars?
        expects: "20"
        feedback: >
          $100$ beats $75$, so you win and pay your own $100$, for a payoff of
          $120 - 100 = 20$ dollars.
      - ask: >
          Fourth option: a price starts at $200$ and falls in public, and the
          first collector to call out takes the guitar at the price showing.
          The rivals had planned to call at $30$, $50$ and $75$; you planned
          $100$. What do you pay?
        expects: "100"
        feedback: >
          The clock passes through $100$ before any rival's stopping point, so
          you call first and pay $100$ dollars — the number you chose.

      - part: The question that splits them
        ask: >
          Across the four runs, in which ones would a different number from
          you — still high enough to win — have changed the price you paid?
        choices:
          - text: >
              All four: your bid always affects your price.
            feedback: >
              In the rising clock you could have planned to stay in up to
              $150$ or $200$; you would still have bought the moment the $85$
              collector quit, at $85$. Same in the second-highest-envelope
              sale.
          - text: >
              The two sealed-envelope sales, since only there do you write a
              number.
            feedback: >
              In the second-highest sale, writing $150$ instead of $120$ still
              charges you $85$. Sealed or open is a fact about what you see,
              not about what you pay.
          - text: >
              The pay-your-own-number envelope and the falling clock.
            correct: true
            feedback: >
              In both, the number you chose is the price. Write $90$ instead of
              $100$, or call at $90$, and you pay $10$ dollars less.
          - text: >
              None: the price always comes from the rivals.
            feedback: >
              In the pay-your-own-number sale the rivals' envelopes never
              enter the price at all. They decide only whether $100$ was
              enough to win.
        feedback: >
          Two runs charged you a rival's number and two charged you your own.
          That split, not open versus sealed, is what will decide how you bid.
      - reflect: >
          State the one question you would ask of any auction format to put
          it in the same group as one of these four runs, and say why that
          question matters more for your bid than whether the bids are sealed.
        answer: >
          Does my bid set the price I pay, or only decide whether I win? If it
          sets the price, every dollar you shade is a dollar saved when you
          win, at the cost of winning less often — a trade-off. If it only
          decides whether you win, shading saves nothing and only risks losing
          a sale you wanted. Sealed versus open changes what you can see while
          bidding; the payment rule changes what your bid is worth.
      - teach: >
          These are the four standard formats. English: an ascending clock,
          public dropouts, the last one standing pays roughly where the
          second-to-last quit. Dutch: a descending clock, the first to accept
          pays the price they stopped it at. First-price sealed-bid: highest
          wins, pays own bid. Second-price sealed-bid, or Vickrey: highest
          wins, pays the second-highest bid. Dutch and first-price are
          pay-your-bid; in English and Vickrey your bid only decides whether
          you win.

      - part: Testing the split on new numbers
        ask: >
          In the Vickrey sale, with rival envelopes $45$, $60$ and $85$, you
          raise your own envelope from $120$ to $150$. What do you pay now?
        expects: "85"
        feedback: >
          You still win, and the price is still the second-highest envelope,
          $85$ dollars. Raising your bid changed nothing; lowering it below
          $85$ would have lost the guitar.
      - ask: >
          In the first-price sale, with rival envelopes $30$, $50$ and $75$, you
          cut your envelope from $100$ to $80$. What is your payoff now?
        expects: "40"
        hint: >
          Do you still win? If so, what is the new price?
        feedback: >
          $80$ still beats $75$, so you win and pay $80$, for
          $120 - 80 = 40$ dollars — double the payoff at $100$. Cut to $70$ and
          you lose to the $75$ and get $0$. That trade-off exists only
          because your bid is your price.
      - ask: >
          A colleague summarises Vickrey as "the second-highest bidder wins".
          What is wrong?
        choices:
          - text: >
              Nothing: that is why it is called second-price.
            feedback: >
              In the run above the second-highest envelope was the $85$
              collector's, and they went home with nothing. "Second" names
              where the price comes from.
          - text: >
              The highest bidder wins; only the price comes from the
              second-highest bid.
            correct: true
            feedback: >
              Right. The allocation rule is the ordinary one; Vickrey changes
              only the payment rule.
          - text: >
              It should be "the second-highest bidder sets the clock".
            feedback: >
              There is no clock in Vickrey — it is sealed, one number each. The
              runner-up's number sets the price, not any clock.
        feedback: >
          Read every format as two rules. In all four standard formats the
          allocation rule is the same — the highest bidder wins — and only the
          payment rule differs.
      - ask: >
          An invented format: sealed envelopes, highest wins, and the winner
          pays the third-highest number. Which standard format does it behave
          like when you choose your bid?
        choices:
          - text: >
              First-price, because it is sealed.
            feedback: >
              Sealing is shared by both envelope formats. The payment rule here
              never reads your own number, which first-price always does.
          - text: >
              Vickrey: your bid decides only whether you win.
            correct: true
            feedback: >
              The price is a rival's number. Your envelope matters only through
              whether it is the highest, just as in second-price.
          - text: >
              Dutch, because the winner pays less than they bid.
            feedback: >
              In Dutch the winner pays exactly the price they stopped at, which
              is their own choice. Paying a rival's number is the opposite
              group.
        feedback: >
          The payment rule sorts any format, standard or invented, into one of
          two families before you do any algebra.

  - node: quant-games.auctions.value-models
    hook: >
      Before a single equation gets written, an interviewer's setup always answers one silent
      question — is the bidder estimating their own taste, or estimating a shared unknown
      fact — and misreading which one derails everything downstream.
    explanation: >
      Private values mean bidder $i$ already knows $v_i$ exactly, and nothing any rival knows
      or reveals would change that number — a specific concert ticket for a show you either
      want to attend or don't. Independent private values (IPV) adds a modeling convenience
      on top: the $v_i$ are independent draws from one shared distribution, which is what
      lets later formulas talk about "the distribution of values" at all.


      Common value describes the opposite extreme: the object is worth the same unknown amount
      $V$ to every bidder — an oil tract, a jar of coins, a company's future cash flows —
      and each bidder only observes a private, noisy signal of that shared $V$. Interdependent
      values sit between the two, where your true value depends partly on your own information
      and partly on what others privately know, closer to appraising a used car than to buying
      a ticket for yourself.


      The fork matters because it changes what winning teaches you. Under private values,
      learning that you won says nothing new — your value was fixed before the auction started,
      and nothing about rivals' bids revises it. Under common values, winning is itself evidence,
      because the winner is systematically the bidder whose signal happened to run highest,
      and that fact should update your belief about $V$ downward before you've spent a cent.
    worked: >
      Classify two live prompts before touching any math. First: you're bidding for a signed
      jersey you plan to keep and hang on your wall — nobody else's opinion of the jersey
      changes what it's worth to you, so this is private values, IPV if the room's tastes
      are also drawn from a common pool. Second: you're bidding for a sealed envelope containing
      a check for an unknown amount, and everyone in the room got to peek at it for one second
      — the envelope is worth the same amount to whoever holds it, only the peek differs person
      to person, so this is common value. Answering "private" to the second prompt is the
      single most common setup mistake this unit exists to prevent.
    interview: >
      "Is this a private-value or common-value setup?" is asked directly or, more often, buried
      in the story — a car you'll drive yourself signals private, a company you'll resell
      or a mineral deposit signals common — and interviewers are listening for you to extract
      the answer from the story before writing anything down.
    pitfalls: >
      Treating every valuation problem as private values by default because the math is simpler
      — real interview classics like the jar of coins and acquiring a company are common-value
      on purpose. Conflating interdependent values with common value; interdependent still
      lets your own information matter, common value does not.
    recap: >
      Private values mean winning teaches you nothing new about your own value; common values
      mean winning is itself evidence about a shared unknown, which is the fork the rest of
      this unit is built around.
    dialogue:
      - part: Two lots, one surprising piece of news
        teach: >
          An estate sale has two lots. Lot A is an old photograph of the street
          you grew up on, which you would hang at home and never sell; it is
          worth $300$ dollars to you. Lot B is a pallet of
          returned phones that the winner sells on to a refurbisher, who pays
          a fixed amount per working phone to whoever brings them. You tested
          a handful and estimate the pallet at $300$ dollars too.
      - ask: >
          Before bidding you learn that every other bidder in the room would
          pay at most $140$ dollars for lot A. What is the photograph worth to
          you now?
        choices:
          - text: >
              Less than $300$: if nobody else wants it much, you are
              overrating it.
            feedback: >
              Their indifference to the photograph says something about them,
              not about your wall. You grew up on that street; they did not.
          - text: >
              Still $300$ dollars.
            correct: true
            feedback: >
              The photograph is worth $300$ to you because of what you get out of
              it, and nothing the others know can change that. Their low
              numbers might make it cheaper to win — they do not make it worth
              less.
          - text: >
              More than $300$: you face no competition, so it is a bargain.
            feedback: >
              That is a statement about the price you may pay, not about what
              the photograph is worth to you. Value and price are separate, and
              only price depends on the room.
        feedback: >
          For lot A, everything that matters about your value is already in
          your head.
      - ask: >
          Now you learn that every other bidder also tested phones from lot B,
          and all of them estimate it at $140$ dollars or less. What happens to
          your $300$-dollar estimate?
        choices:
          - text: >
              It stays at $300$: it is your estimate, and theirs are theirs.
            feedback: >
              The pallet pays the same to whoever wins it. Their tests were of
              the same phones you are guessing about, so ignoring them is
              throwing away data on your own number.
          - text: >
              It should fall: their tests are evidence about the same unknown
              number.
            correct: true
            feedback: >
              Right. Several independent tests reading low make it likelier
              that your handful happened to include unusually good phones.
          - text: >
              It should rise: they are probably bluffing low.
            feedback: >
              These are honest estimates, not bids. Even taken at face value
              they point the other way, and nothing suggests they are biased.
        feedback: >
          Same news, opposite effect. For the photograph, other people's numbers
          are about other people; for the pallet, they are about the pallet.
      - ask: >
          Say four rivals' estimates of lot B are $120$, $100$, $140$ and $90$
          dollars, and you trust each test as much as your own. Weighting the
          five estimates equally, what is your best guess of the pallet's
          worth, in dollars?
        expects: "150"
        hint: >
          Average your $300$ with the four of theirs.
        feedback: >
          $(300 + 120 + 100 + 140 + 90)/5 = 750/5 = 150$ dollars. Your own
          estimate was the outlier, and the pooled guess is half of it.

      - part: Naming the fork
        reflect: >
          Before any name is given: what is it about lot A that made rivals'
          information useless, and about lot B that made it decisive? Put it
          in terms of what each lot is worth and to whom.
        answer: >
          Lot A's worth is personal: each bidder knows exactly what the photograph
          is worth to them, and it differs from person to person, so learning
          rivals' information cannot change it. Lot B's worth is one number,
          the same for whoever wins, and nobody knows it; each bidder holds
          only a noisy reading of it, so every rival's reading is extra data
          about the number you are trying to estimate.
      - teach: >
          Private values: bidder $i$ knows their own value $v_i$ exactly, and
          learning everything the rivals know would not change it. Independent
          private values, or IPV, adds that the $v_i$ are independent draws
          from one common distribution. Common value: the object is worth the
          same unknown $V$ to everyone, and each bidder sees only a noisy
          signal of it. Interdependent values sit in between. Lot A is private;
          lot B is common.
      - ask: >
          You win each lot at auction. What does the fact of winning tell you?
        choices:
          - text: >
              Nothing about either lot: winning is just the outcome.
            feedback: >
              For lot A, yes. For lot B, winning means everyone else's bid was
              lower — and bids follow estimates, so their estimates were
              probably lower than yours. That is data about $V$.
          - text: >
              Nothing new about lot A; for lot B, that the others' estimates
              were probably lower than yours.
            correct: true
            feedback: >
              Right. Under private values you already knew your value; under a
              common value, winning is itself a piece of evidence, and it
              points down.
          - text: >
              For both lots, that you valued them more than anyone else, so
              you got a good deal.
            feedback: >
              "You valued it most" is good news for a photograph. For a pallet with
              one true worth, "you estimated it highest" is a warning that your
              estimate may be the most optimistic in the room.
        feedback: >
          This is why the choice of model decides everything downstream:
          private values give clean bidding rules, and common values bring
          the question of what winning reveals.

      - part: Classifying a new room
        ask: >
          A rare first-edition book is auctioned. Each bidder plans to keep it
          on their shelf for about a decade and then sell it at whatever the
          market pays. Which model fits best?
        choices:
          - text: >
              Pure private values: they are buying it to keep.
            feedback: >
              Ten years of enjoyment is private, but the resale price is the
              same for whoever holds the book and nobody knows it. Rivals'
              views on that resale price are useful to you.
          - text: >
              Pure common value: it will be sold eventually.
            feedback: >
              The decade on the shelf is worth different amounts to different
              collectors, and each knows their own part exactly. The resale
              component is common; the enjoyment is not.
          - text: >
              Interdependent: a private part and a common part.
            correct: true
            feedback: >
              Right. Your value depends partly on your own taste and partly on
              a resale price that rivals' information helps you estimate.
        feedback: >
          Most real objects mix the two. Interview problems usually choose one
          extreme on purpose, and the first job is to say which.
      - ask: >
          Five members of one wine club bid for a tasting evening. Each knows
          exactly what the evening is worth to them, but members' tastes run
          together: when one loves an evening, the others usually do too.
          Which part of the IPV description fails?
        choices:
          - text: >
              Private values: their values are related, so they are common.
            feedback: >
              Each member knows their own value exactly and would not revise
              it after hearing the others. Related is not the same as shared;
              the values are still private.
          - text: >
              Independence: one member's value carries information about
              another's.
            correct: true
            feedback: >
              Exactly one clause breaks. The values are private, but they are
              not independent draws, so this is private values without the I.
          - text: >
              Nothing fails: any private-value room is IPV.
            feedback: >
              IPV adds a second clause, independent draws from one common
              distribution. Correlated tastes violate it, and the clean
              formulas of the next lessons assume it.
        feedback: >
          Check the two clauses separately: does each bidder know their value
          exactly, and are the values independent draws? A room can pass the
          first and fail the second.
      - ask: >
          Back to lot B, sold to the highest bidder at their own bid. If the
          pallet is in fact worth $150$ dollars and you win it by bidding your
          own estimate of $300$, what is your payoff, in dollars?
        expects: "-150"
        feedback: >
          $150 - 300 = -150$ dollars. You won precisely because your estimate
          was the highest, which is exactly when it was most likely to be too
          high. Under common values, an honest estimate is not yet a safe bid.

  - node: quant-games.auctions.strategic-equivalence
    hook: >
      Knowing that Dutch and first-price are literally the same game, not just similar ones,
      saves you from re-deriving an equilibrium twice under two different names.
    explanation: >
      Two games are strategically equivalent when they share the same strategy sets and the
      same payoff at every strategy profile — a much stronger claim than merely producing
      the same outcome. Dutch and first-price sealed-bid meet that bar exactly: in a Dutch
      auction nothing is revealed before the moment you accept a price, so choosing when to
      accept is really choosing one number in advance, precisely the same single decision
      a first-price sealed bid asks for. A bidder cannot condition on anything the clock reveals,
      because by the time it reaches a price low enough to reveal information, someone has
      already claimed the object.


      English and second-price are a weaker relationship — outcome-equivalent, not strategically
      equivalent, and only once private values are assumed. Under private values, staying
      in an English auction until the price reaches your own value costs nothing while you're
      still in and gains nothing once the price exceeds it, so that threshold is the natural
      stopping point for every bidder; the auction then ends with the price sitting just above
      the second-highest value, the same number a second-price sealed bid would have charged.
      The two games still have very different strategy spaces — one a sequence of stay-or-quit
      decisions, the other a single sealed number — they merely land on the same price.


      That equivalence leans on private values specifically. Under common values, watching
      rivals drop out in an English auction hands you information a sealed bid never gets
      to use — each exit is evidence about the shared $V$ — so the two formats stop lining
      up, and ascending auctions typically raise more revenue than sealed-bid ones on common-value
      objects precisely because they let bidders learn as they go.
    worked: >
      Three bidders privately value a delivery contract at $30$, $55$, and $70$ dollars. Run
      it as English: the $30$-value bidder drops when the clock passes $30$, the $55$-value
      bidder drops when it passes $55$, and the $70$-value bidder wins the instant the second
      bidder quits, paying just above $55$ — a payoff of about $70 - 55 = 15$. Run the identical
      three values as second-price sealed-bid, everyone bidding true value: the highest bid,
      $70$, wins and pays the second-highest bid, $55$, again a payoff of $15$. Both procedures
      hand the same bidder the same object at the same price, even though English is a live
      sequence of exits and second-price is one envelope each — exactly what outcome-equivalent
      but not strategically equivalent means in practice.
    interview: >
      "Are Dutch and English auctions basically the same thing?" wants a flat no, followed
      by the actual pairing — Dutch matches first-price as a game, English only matches second-price
      in outcome, and only under private values — since conflating ascending-versus-descending
      with sealed-versus-open is the wrong axis entirely.
    pitfalls: >
      Assuming English and second-price are the same game because they land on the same price
      — their strategy spaces, a sequence of decisions versus one sealed number, are entirely
      different, which matters the moment information can be inferred from the sequence. Applying
      the English-second-price equivalence to a common-value setup, where it silently breaks.
    recap: >
      Dutch and first-price are the same game in the strict sense; English and second-price
      merely land on the same price under private values, and that weaker link snaps under
      common values.
    dialogue:
      - part: A falling clock with nothing to watch
        teach: >
          A painting is sold by descending clock: the price starts at $400$
          dollars and falls steadily, and the first bidder to call out takes
          the painting at the price showing. The painting is worth $260$
          dollars to you. Your three rivals have privately decided to call at
          $180$, $210$ and $150$; you have decided to call at $230$.
      - ask: >
          What is your payoff, in dollars?
        expects: "30"
        hint: >
          Whose stopping point does the falling clock reach first?
        feedback: >
          The clock reaches your $230$ before any rival's number, so you call
          first and pay $230$, for $260 - 230 = 30$ dollars.
      - ask: >
          Now the same four people each write their number in a sealed
          envelope instead: highest envelope wins and pays what it says. You
          write $230$, the rivals write $180$, $210$ and $150$. Your payoff?
        expects: "30"
        feedback: >
          $230$ is the highest envelope, so you win and pay $230$: again $30$
          dollars. Same winner, same price, same payoff.
      - ask: >
          While the clock fell from $400$ to $230$, what did you see that
          could have changed your plan?
        choices:
          - text: >
              Each rival's stopping price, as the clock passed it.
            feedback: >
              The clock passes a rival's number only if that rival calls, and
              the first call ends the sale. Every rival number above $230$
              would have ended it before you had a chance to react.
          - text: >
              Only that nobody had called yet — which is the one situation in
              which your plan ever gets used.
            correct: true
            feedback: >
              Right. "Nobody has called above the current price" is true every
              time your turn to act arrives, so you knew it in advance. The
              clock teaches you nothing you could not have assumed when you
              wrote your plan.
          - text: >
              How many rivals were still interested, from how long they
              waited.
            feedback: >
              Everyone waits in silence until someone calls; a rival about to
              call at $210$ looks exactly like one who never will. Silence
              carries no information you did not already have.
        feedback: >
          On a descending clock, all you ever observe before acting is silence,
          and silence is the condition under which you act anyway.
      - reflect: >
          Say exactly what a complete plan for the descending clock has to
          specify, and why that makes it the same kind of object as a sealed
          envelope. What would have to be true for the two sales to be the
          same game, and not merely to have agreed this once?
        answer: >
          A complete plan is one number: the price at which you call if nobody
          has called first. A sealed pay-your-bid envelope is also one number,
          and the same four numbers produce the same winner, the same price and
          the same payoff for every bidder in both sales. Agreement on one set
          of numbers is luck; agreement on every possible set of numbers is
          what makes them one game.
      - teach: >
          Two games are strategically equivalent when they have the same
          strategy sets and the same payoff for every bidder at every strategy
          profile. Dutch and first-price sealed-bid are strategically
          equivalent: the Dutch clock reveals nothing before you act, so
          choosing when to call is choosing one number in advance. Anything you
          work out about first-price bidding is automatically true of Dutch.

      - part: A rising clock, where people do leave
        ask: >
          A delivery contract goes to an ascending clock. Rivals value it at
          $25$, $48$ and $66$ dollars and stay in exactly until the price
          reaches their value; it is worth $90$ to you. Roughly what price do
          you pay, in dollars?
        expects: "66"
        feedback: >
          The rivals quit at $25$, $48$ and $66$. When the $66$ leaves you are
          alone, so you pay about $66$ dollars, for a payoff of about
          $90 - 66 = 24$.
      - ask: >
          To keep the price down you instead plan to quit at $55$. How many
          dollars of payoff does that plan cost you, compared with staying in
          to $90$?
        expects: "24"
        hint: >
          At $55$, is the $66$ rival still in?
        feedback: >
          At $55$ the $66$ rival is still in, so you quit and lose: payoff $0$
          instead of $24$. Quitting early never lowers the price you pay; the
          price is set by when the last rival leaves. It only changes whether
          you are still there.
      - ask: >
          The same four values go to a sealed second-price sale, everyone
          writing their value. The price is the same $66$. Are the ascending
          clock and the second-price envelope the same game, in the strict
          sense the Dutch clock and first-price were?
        choices:
          - text: >
              Yes: they produce the same winner and price.
            feedback: >
              Same outcome is the weaker claim. On the clock you decide, at
              every price, whether to stay, and you can watch who has left; an
              envelope is one number written blind. The strategy sets are
              different objects.
          - text: >
              No: on the clock you choose again at every price and see each
              exit, while an envelope is one number chosen blind.
            correct: true
            feedback: >
              Right. They land on the same price because, with private values,
              staying in exactly to your value is the sensible plan on the clock
              and writing your value is the sensible envelope. Same outcome,
              different games.
          - text: >
              No: the clock always ends at a higher price than the envelope.
            feedback: >
              Here both end at $66$, the second-highest value. Price is where
              they agree; the strategy sets are where they differ.
        feedback: >
          The ascending clock and the second-price envelope are only
          outcome-equivalent: the same price, reached through different games.
          That weaker link is held together by private values.

      - part: When the exits carry news
        teach: >
          Now the clock sells the mineral rights to a parcel. The rights pay
          the same unknown amount to whoever wins, and every bidder has their
          own survey. Yours puts the parcel at $120$ dollars. As the price
          rises, two of your four rivals quit, at $50$ and at $55$.
      - ask: >
          What should those two exits do to your estimate of the parcel?
        choices:
          - text: >
              Nothing: they are out of the auction, so they no longer matter.
            feedback: >
              They quit because their surveys read low, and their surveys
              measured the same parcel yours did. An exit is a published
              reading.
          - text: >
              Pull it down: two independent surveys of the same parcel read
              low.
            correct: true
            feedback: >
              Right. With a common value, every exit price is evidence about
              the parcel, and you can revise as the clock rises.
          - text: >
              Push it up: fewer rivals means less competition.
            feedback: >
              Fewer rivals changes the price you may pay, not what the parcel
              is worth. And the reason they left points the other way.
        feedback: >
          Under a common value, the ascending clock leaks information as it
          runs.
      - ask: >
          In a sealed second-price sale of the same parcel, could you use what
          those two rivals know?
        choices:
          - text: >
              Yes: the price is set by the runner-up, so their information
              reaches you.
            feedback: >
              The runner-up's number sets the price after the envelopes are
              opened. Your own envelope was written before you saw anything.
          - text: >
              No: your envelope is written before anyone's information is
              revealed.
            correct: true
            feedback: >
              Right. The sealed bid is one number written blind, so the
              exits that the clock would have shown you never reach your bid.
          - text: >
              Only if all bidders agree to share their surveys.
            feedback: >
              Sharing surveys would be a different mechanism. Inside the
              sealed sale, nothing is revealed before you bid.
        feedback: >
          This is where the outcome-equivalence snaps: the clock lets bidders
          condition on exits, the envelope does not, and with a common value
          those exits are exactly what you want to condition on.
      - ask: >
          On a common-value object, which of the two should a seller expect to
          raise more?
        choices:
          - text: >
              They raise the same, since they are equivalent.
            feedback: >
              They were equivalent under private values. With a common value
              the clock gives bidders information the envelope withholds, so
              they bid differently.
          - text: >
              The sealed envelope, because bidders cannot see each other's
              weakness.
            feedback: >
              Blind bidders know they may be the most optimistic in the room
              and bid more cautiously. Hiding information makes them bid lower,
              not higher.
          - text: >
              The ascending clock, because bidders who learn from exits need
              less caution and bid more aggressively.
            correct: true
            feedback: >
              Right. Seeing the exits lets the remaining bidders pin down the
              common value, so each is less afraid of overpaying, and the price
              climbs.
        feedback: >
          The standard result: ascending auctions raise more on common-value
          objects, precisely because they let bidders learn as they go.
      - ask: >
          Does the Dutch and first-price equivalence also snap when the value
          is common?
        choices:
          - text: >
              Yes, for the same reason the ascending one did.
            feedback: >
              The ascending clock snapped because exits revealed information.
              A descending clock reveals nothing before the first call, common
              value or not.
          - text: >
              No: the falling clock reveals nothing before the first call, so
              both are still one number chosen blind.
            correct: true
            feedback: >
              Right. Strategic equivalence never used private values — only the
              fact that nothing is observed before you act.
          - text: >
              It depends on how fast the clock falls.
            feedback: >
              Speed changes nothing: however slowly the price falls, all you
              see is silence until someone calls and ends the sale.
        feedback: >
          The strong equivalence holds in every value model; the weak one holds
          only under private values. In an interview: Dutch is first-price as a
          game; English matches second-price only in outcome, and only when
          values are private.

  - node: quant-games.auctions.vickrey
    hook: >
      The instant you see "highest bid wins, pays the second-highest," the entire strategy
      question collapses to one line: bid your value, full stop, and the proof is worth being
      able to say cold.
    explanation: >
      Fix your true value $v$ and let $p$ denote the highest bid among your rivals — a number
      you never observe before deciding, but the argument works for every possible $p$ simultaneously,
      which is what makes it a dominance argument rather than a best-response-to-a-guess argument.
      The fact that makes the whole proof go through: your own bid decides only whether you
      win, never what you pay, since the price is fixed by someone else's number.


      Compare bidding $v$ itself against underbidding some $b < v$. The two strategies only
      disagree when the rival bid $p$ lands between $b$ and $v$ — everywhere else you win
      or lose identically either way. In that gap, bidding truthfully wins at profit $v -
      p \ge 0$, while the underbid loses and earns $0$; shading down never buys a lower price,
      it only risks forfeiting profitable wins.


      Now compare $v$ against overbidding $b > v$. The two strategies disagree only when $p$
      lands between $v$ and $b$ — again identical everywhere else. There, the inflated bid
      wins at profit $v - p < 0$, a loss, while truthful bidding correctly walks away with
      $0$. Since underbidding is weakly worse wherever it differs, and overbidding is weakly
      worse wherever it differs, and neither ever wins by deviating, $v$ itself is a weakly
      dominant strategy with no assumption at all about how rivals bid.
    worked: >
      Your true value for a storage unit's contents is $80$ dollars. Suppose the highest rival
      bid happens to be $70$. Bidding truthfully at $80$ wins, paying $70$, for a profit of
      $80 - 70 = 10$; underbidding at $60$ loses the auction outright, forfeiting that $10$-dollar
      profit for nothing. Now suppose instead the highest rival bid happens to be $85$. Bidding
      truthfully at $80$ loses, earning $0$, which is correct since the unit isn't worth $85$
      to you; overbidding to $95$ instead wins at a price of $85$, for a profit of $80 - 85
      = -5$ — a loss you'd never take by bidding truthfully. Both deviations are weakly worse
      in the scenario where they actually change the outcome.
    interview: >
      "Why is truthful bidding optimal in a second-price auction?" wants the dominance argument
      stated in one breath: your bid sets only whether you win, never the price, so shading
      forfeits profitable wins and inflating buys unprofitable ones — not just the conclusion
      "bid your value."
    pitfalls: >
      Carrying "bid your value" over to a first-price auction, where it is badly wrong — there
      your own bid does set the price, so bidding true value collects zero profit on every
      win. Assuming the result needs rivals to be rational or to bid sensibly; it needs neither,
      which is the entire point of a dominance argument.
    recap: >
      In second-price sealed-bid, your bid never sets your price, only whether you win, so
      bidding true value weakly dominates every shade or inflation regardless of what rivals
      do.
    dialogue:
      - part: Shading in a second-price sale
        teach: >
          A vintage synthesizer is sold sealed-bid: the highest envelope wins
          and pays the second-highest envelope. It is worth $150$ dollars to
          you. A friend says to write $120$ instead of $150$, "to save some
          money".
      - ask: >
          Say the highest rival envelope turns out to be $100$. How many dollars
          less do you pay by writing $120$ instead of $150$?
        expects: "0"
        hint: >
          With either envelope you win. What number sets your price?
        feedback: >
          Either envelope beats $100$, and either way the price is the
          runner-up's $100$. Your payoff is $150 - 100 = 50$ both times. The
          shaded envelope saved nothing.
      - ask: >
          Now say the highest rival envelope is $135$. How many dollars of
          payoff does writing $120$ cost you, compared with writing $150$?
        expects: "15"
        hint: >
          Which of your two envelopes still wins?
        feedback: >
          Writing $150$ wins at a price of $135$, for $150 - 135 = 15$ dollars.
          Writing $120$ loses to $135$ and earns $0$. Shading cost you a $15$
          dollar win and lowered no price.
      - ask: >
          For which highest rival envelopes $p$ do your two envelopes, $120$
          and $150$, lead to different outcomes?
        choices:
          - text: >
              For every $p$: a lower envelope always means a lower price.
            feedback: >
              The price is $p$ whenever you win, whatever you wrote. At
              $p = 100$ both envelopes paid exactly $100$.
          - text: >
              Only when $p$ lies between $120$ and $150$.
            correct: true
            feedback: >
              Right. Below $120$ both envelopes win at price $p$; above $150$
              both lose. In between, $150$ wins at a profit of $150 - p \ge 0$
              and $120$ loses.
          - text: >
              Only when $p$ is above $150$, where you would overpay.
            feedback: >
              Above $150$ both envelopes lose to $p$ and both earn $0$. The
              outcomes match there.
        feedback: >
          The two envelopes disagree only in a band, and in that band the
          higher one is the one that profits.
      - reflect: >
          You want to know that writing $150$ is never worse than any other
          envelope, without knowing anything about how the rivals bid. What
          exactly would you have to check, and why does the comparison you just
          made already contain the whole argument for every lower envelope?
        answer: >
          Fix the highest rival envelope $p$ at any value and compare outcomes
          for that $p$; if truth is at least as good for every single $p$, it is
          at least as good however the rivals choose $p$. The comparison works
          because your envelope never sets your price, only whether you win,
          so any lower envelope differs from truth only for $p$ between the two,
          and there it gives up a win worth $150 - p \ge 0$.
      - teach: >
          That is Vickrey's theorem. In a sealed-bid second-price auction with
          private values, bidding your true value $v$ weakly dominates every
          other bid, whatever the rivals do: for every highest rival bid $p$ it
          does at least as well, and for some $p$ strictly better. The proof is
          a case split on $p$, and it never uses anything about the rivals —
          not their values, not their rationality.

      - part: The other side of the case split
        ask: >
          Now you write $190$ instead of $150$, to be sure of winning, and the
          highest rival envelope is $170$. What is your payoff, in dollars?
        expects: "-20"
        hint: >
          You win. What do you pay, and what is the synthesizer worth to you?
        feedback: >
          $190$ beats $170$, so you win and pay $170$ for something worth $150$
          to you: $150 - 170 = -20$ dollars. Writing $150$ would have lost and
          earned $0$.
      - ask: >
          Where does the inflated envelope $190$ differ from $150$, and which
          does better there?
        choices:
          - text: >
              When $p$ is below $150$, where $190$ pays more.
            feedback: >
              Below $150$ both envelopes win at price $p$. Inflating never
              raises your price either; the price is still the runner-up's.
          - text: >
              When $p$ lies between $150$ and $190$, where $190$ wins at a
              loss and $150$ walks away with $0$.
            correct: true
            feedback: >
              Right. In that band the win costs $p > 150$, so profit is
              $150 - p < 0$. Everywhere else the two envelopes do the same.
          - text: >
              When $p$ is above $190$, where $190$ is safer.
            feedback: >
              Above $190$ both envelopes lose and earn $0$. Inflating buys a
              win only in the band where winning loses money.
        feedback: >
          Both deviations are weakly worse: shading forfeits profitable wins,
          inflating buys unprofitable ones, and neither ever changes the price.
          That is the theorem, both halves.

      - part: Where the advice stops working
        ask: >
          The same synthesizer, but now a first-price sale: highest envelope
          wins and pays its own number. You write your value, $150$, and win.
          What is your payoff, in dollars?
        expects: "0"
        feedback: >
          You pay your own $150$ for something worth $150$: payoff
          $150 - 150 = 0$. Writing your value guarantees that every win is worth
          nothing.
      - ask: >
          Which step of Vickrey's argument fails in the first-price sale?
        choices:
          - text: >
              The assumption that rivals bid their values.
            feedback: >
              The argument never assumed anything about rivals; it worked for
              every $p$. The step that fails is about your own envelope.
          - text: >
              The fact that your envelope never sets your price.
            correct: true
            feedback: >
              Right. In first-price a lower envelope does lower your price, so
              shading now has a benefit to weigh against the risk of losing.
              The dominance argument has nothing to say about that trade-off.
          - text: >
              The case split on $p$, since a sealed bid hides $p$.
            feedback: >
              The second-price sale hid $p$ as well; the argument never needed
              to see it. Fixing $p$ is a device of the proof, not information
              you hold.
        feedback: >
          Everything in the proof rests on one line: your bid decides whether
          you win, never what you pay. Remove it and "bid your value" becomes
          the worst bid that can still win.
      - ask: >
          Back to the second-price sale, but now you plan to resell the
          synthesizer at a price nobody knows yet, and each bidder has only an
          estimate of it. Is writing your estimate still weakly dominant?
        choices:
          - text: >
              Yes: the proof never used anything about the rivals.
            feedback: >
              It did use something about you: that you know $v$. With resale,
              the profit $v - p$ depends on a value you are only estimating,
              and the rivals' envelopes are evidence about it.
          - text: >
              Yes, as long as your estimate is unbiased.
            feedback: >
              Unbiased on average is not the same as known. Winning means the
              others wrote lower numbers, which says your estimate may have run
              high.
          - text: >
              No: the proof assumed you know your value exactly, which a
              common, uncertain value breaks.
            correct: true
            feedback: >
              Right. Vickrey's theorem is a private-values result. With a common
              value, what winning tells you about the object has to be folded
              into the bid.
        feedback: >
          The theorem's hypotheses are second-price and private values, and
          nothing else. Said aloud: your bid sets only whether you win, never
          the price, so shading forfeits good wins and inflating buys bad ones,
          whatever anyone else does.

  - node: quant-games.auctions.uniform-order-stats
    hook: >
      Nearly every closed-form bid or revenue number in this unit boils down to one order-statistic
      fact about uniforms, worth having memorized rather than re-derived under pressure.
    explanation: >
      Take $n$ iid uniform draws on $[0,1]$. Sorting them cuts the interval into $n+1$ gaps
      — before the smallest, between consecutive order statistics, and after the largest —
      and by symmetry each gap has the same expected length, $1/(n+1)$. Stacking $k$ of those
      gaps end to end gives the mean of the $k$-th largest directly: $\mathbb{E}[U_{(k)}]
      = (n+1-k)/(n+1)$. The largest averages $n/(n+1)$, one gap short of $1$; the runner-up
      averages $(n-1)/(n+1)$.


      Conditioning is just rescaling. If all $n$ values are known to lie below some $v$, they
      behave like $n$ iid uniforms on $[0,v]$ rather than $[0,1]$ — nothing about independence
      or uniformity is disturbed by truncating the support — so their maximum averages $vn/(n+1)$,
      the same formula scaled by $v$.


      The same equal-gaps logic on a symmetric interval $[-a,a]$ gives the $k$-th largest
      of $n$ a mean of $a(n+1-2k)/(n+1)$; plugging $k=1$ recovers the maximum's mean $a(n-1)/(n+1)$.
      Every closed-form bid and revenue number later in this unit is this one fact, evaluated
      at a different $k$, $n$, or $a$.
    worked: >
      Take $n = 8$ bidders with values iid uniform on $[0,100]$ — a standard interview setup.
      The largest averages $100 \cdot 8/9 \approx 88.9$, and the runner-up averages $100 \cdot
      7/9 \approx 77.8$, using $(n+1-k)/(n+1)$ with $n=8$ and $k=1$ or $2$. Check the gap
      logic directly: the largest sits $8/9$ of the way up the range, one gap of size $1/9$,
      or about $11.1$ dollars, short of the top — exactly what the equal-gaps picture predicts.
    interview: >
      "What's the expected second-highest of $n$ uniforms on an interval?" is a standalone
      set-piece computation; interviewers are listening for the one-line equal-gaps justification
      — $n+1$ gaps, each averaging a $1/(n+1)$ share — rather than a memorized integral.
    pitfalls: >
      Using $n$ instead of $n+1$ in the denominator, an easy slip that produces values outside
      the interval once $k$ gets large relative to $n$. Forgetting to rescale or re-center
      when the support isn't $[0,1]$ — a distribution on $[-a,a]$ or $[0,v]$ needs the interval
      width and midpoint folded back into the formula, not the bare $(n+1-k)/(n+1)$ fraction.
    recap: >
      The $k$-th largest of $n$ iid uniforms on an interval of width $w$ averages $w(n+1-k)/(n+1)$
      from the top of the range — one fact behind every closed-form auction number in this
      unit.
    dialogue:
      - part: Two points on a stick
        teach: >
          Two numbers are drawn independently, each uniform on $[0,1]$. Think
          of them as two cuts in a stick one metre long.
      - ask: >
          What is the expected value of the larger of the two?
        expects: "2/3"
        hint: >
          The larger is at most $t$ exactly when both are, so
          $\Pr(\max \le t) = t^{2}$. Differentiate for the density.
        feedback: >
          The density of the maximum is $2t$ on $[0,1]$, so its mean is
          $\int_0^1 t \cdot 2t \, dt = 2/3$.
      - ask: >
          What is the expected value of the smaller?
        expects: "1/3"
        hint: >
          The smaller plus the larger is the sum of the two draws.
        feedback: >
          $\min + \max = U_1 + U_2$, which averages $1$, so the smaller averages
          $1 - 2/3 = 1/3$.
      - ask: >
          The two cuts split the stick into three pieces: below the smaller,
          between them, above the larger. What is the expected length of the
          middle piece?
        expects: "1/3"
        feedback: >
          $2/3 - 1/3 = 1/3$. The bottom piece averages $1/3$ and the top piece
          $1 - 2/3 = 1/3$ as well. Three pieces, each a third on average.
      - reflect: >
          Before any formula: with $n$ independent uniform cuts, guess where
          the $k$-th largest sits on average. Then say why the pieces might all
          have the same expected length, even though the end pieces touch the
          ends of the stick and the middle ones do not.
        answer: >
          $n$ cuts make $n+1$ pieces; if each averages $1/(n+1)$, the $k$-th
          largest sits $k$ pieces below the top, at $(n+1-k)/(n+1)$. The reason
          is symmetry: drop $n+1$ independent uniform points on a circle of
          circumference $1$ and cut the circle open at one of them. The other
          $n$ are iid uniform on the resulting stick, and nothing distinguishes
          one gap of the circle from another — the stick's two end pieces are
          just the two gaps beside the cut.
      - teach: >
          For $U_1, \dots, U_n$ iid uniform on $[0,1]$, the order statistics cut
          the interval into $n+1$ gaps of equal expected length $1/(n+1)$, so
          the $k$-th largest has mean $(n+1-k)/(n+1)$: the largest averages
          $n/(n+1)$, the runner-up $(n-1)/(n+1)$. On any interval of width $w$,
          the $k$-th largest sits $k$ gaps of $w/(n+1)$ below the top.

      - part: Reading off any order statistic
        ask: >
          Four draws uniform on $[0,1]$. What is the expected value of the
          second-largest?
        expects: "3/5"
        hint: >
          How many gaps are there, and how many sit above the second-largest?
        feedback: >
          Four cuts make $5$ gaps; the second-largest has $2$ gaps above it, so
          it averages $1 - 2/5 = 3/5$, or $(n+1-k)/(n+1)$ with $n = 4$, $k = 2$.
      - ask: >
          Five values uniform on $[0,60]$ dollars. What is the expected
          largest, in dollars?
        expects: "50"
        hint: >
          Same gaps, scaled to the width of the interval.
        feedback: >
          Six gaps of $60/6 = 10$ dollars each; the largest sits one gap below
          the top, at $60 - 10 = 50$, or $60 \cdot 5/6$.
      - ask: >
          Three values are iid uniform on $[0,100]$, and you are told all three
          came in below $40$. What is the expected largest of the three now?
        expects: "30"
        hint: >
          What is the distribution of a uniform on $[0,100]$, given it is below
          $40$?
        feedback: >
          Conditioned on lying below $40$, each value is uniform on $[0,40]$,
          and the three stay independent. So the largest averages
          $40 \cdot 3/4 = 30$. Conditioning a uniform below a cutoff is just
          rescaling the interval.
      - ask: >
          Four errors are iid uniform on $[-20,20]$. What is the expected
          largest error?
        expects: "12"
        hint: >
          The interval has width $40$. Count gaps down from the top, $20$.
        feedback: >
          Five gaps of $40/5 = 8$; the largest sits one gap below $20$, at $12$.
          The general form is $a(n+1-2k)/(n+1) = 20 \cdot 3/5 = 12$.

      - part: The circle, and a formula checked at the ends
        ask: >
          You and two friends each mark an independent, uniformly random minute
          on a $60$-minute clock face. Going clockwise from your mark, how many
          minutes is it on average to the next mark?
        expects: "20"
        hint: >
          Cut the clock face open at your own mark. What are the other two
          marks now?
        feedback: >
          Three points on a circle make three gaps, and nothing distinguishes
          one from another, so each averages $60/3 = 20$ minutes. Cut open at
          your mark and the same answer appears as the smallest of two uniforms
          on $[0,60]$: one gap of $60/3$ above the floor. This is the symmetry
          that makes every gap on the stick equal.
      - ask: >
          A colleague remembers the formula as $(n-k)/n$ for the $k$-th
          largest of $n$ uniforms on $[0,1]$. Which check exposes it fastest?
        choices:
          - text: >
              It gives $0$ for the smallest, $k = n$, but the smallest of $n$
              uniforms is positive.
            correct: true
            feedback: >
              Right. With the correct $n+1$ the smallest averages $1/(n+1)$, one
              gap above the floor, mirroring the largest one gap below the top.
          - text: >
              It gives a number above $1$ for the largest.
            feedback: >
              For $k = 1$ it gives $(n-1)/n$, which is below $1$. It is wrong
              there too — the largest averages $n/(n+1)$ — but not by leaving
              the interval.
          - text: >
              Nothing: $n$ and $n+1$ agree for large $n$.
            feedback: >
              For $n = 2$ the colleague's largest is $1/2$, the same as a single
              draw — and the maximum of two draws cannot average the same as a single draw.
        feedback: >
          The ends are the quick test: the largest one gap below the top, the
          smallest one gap above the floor. In an interview: $n$ points, $n+1$
          equal gaps, count down $k$ of them.

  - node: quant-games.auctions.shading
    hook: >
      "How much below your value should you bid in a sealed first-price auction" is asked
      almost verbatim, and "less than value, because you set your own price" is only half
      the answer an interviewer wants — they want the actual fraction.
    explanation: >
      In first-price, your own bid sets your price, so the trade-off is explicit: bidding
      higher raises your win probability but shrinks the margin $v - b$ on every win, and
      bidding lower does the reverse. A Bayes-Nash equilibrium is a bid function $b(v)$ that's
      a best response to every rival playing that same function, so solving for it means optimizing
      your bid taking the rivals' strategy, not just their values, as given.


      Under $n$ iid uniform-on-$[0,1]$ private values, guess a symmetric increasing equilibrium
      and bid as if your value were some $z$: you win exactly when $z$ beats all $n-1$ rival
      values, probability $z^{n-1}$, so you're maximizing $(v - b(z)) z^{n-1}$ over $z$. Setting
      the derivative to zero at the truthful point $z = v$ and solving the resulting differential
      equation with $b(0) = 0$ gives the closed form $b(v) = \frac{n-1}{n} v$.


      The algebra matters less than what the fraction means: $(n-1)v/n$ is exactly the expected
      value of the highest of $n-1$ rivals, conditional on all of them being below $v$ — the
      order-statistics fact, rescaled to $[0,v]$. So the equilibrium rule in plain language
      is: bid what you expect the best rival to be, given that you beat them, which is the
      same as given that you win. Two bidders shade to half of value; ten bidders shade only
      to $90$ percent, since a crowded room leaves less room for the top rival to fall short
      of you.
    worked: >
      Four bidders draw private values iid uniform on $[0,100]$, and yours happens to be $80$
      dollars. The equilibrium bid is $\frac{n-1}{n}v = \frac{3}{4}\cdot 80 = 60$ dollars.
      Check the reading directly: conditional on your $80$ beating all three rivals, their
      maximum is uniform on $[0,80]$ with $n-1=3$ draws, averaging $80 \cdot 3/4 = 60$ — the
      same number, because the equilibrium bid is exactly that conditional expectation.
    interview: >
      "What do you bid in a first-price sealed auction with $n$ bidders and uniform values?"
      wants the fraction $(n-1)/n \cdot v$ stated along with the one-line reason — you're
      bidding the expected best rival conditional on winning — not just a memorized formula.
    pitfalls: >
      Treating $(n-1)/n$ as a universal shading rule; it's specific to iid uniform private
      values, and a different value distribution gives a different equilibrium bid function
      entirely. Shading by a fixed "safety margin" regardless of $n$, when the correct margin
      shrinks mechanically as more bidders crowd the room.
    recap: >
      Pay-your-bid forces a margin-versus-win-probability trade-off, and under $n$ iid uniform
      private values the equilibrium resolves it by bidding the fraction $(n-1)/n$ of your
      value — exactly the best rival's expected value, given that you beat them.
    dialogue:
      - part: One rival who bids half
        teach: >
          A first-price sealed-bid sale with one rival: highest envelope wins
          and pays its own number. Both values are independent and uniform on
          $[0,100]$ dollars. Yours is $60$. You know the rival always writes
          exactly half of her value.
      - ask: >
          You write $30$. What is your expected profit, in dollars?
        expects: "18"
        hint: >
          Her envelope is below $30$ exactly when her value is below $60$. On a
          win you keep $60 - 30$.
        feedback: >
          You win with probability $\Pr(V_r < 60) = 0.6$ and keep
          $60 - 30 = 30$ when you do, so the expected profit is
          $0.6 \cdot 30 = 18$ dollars.
      - ask: >
          You write $20$ instead. Expected profit?
        expects: "16"
        feedback: >
          You win when her value is below $40$, probability $0.4$, and keep
          $40$: $0.4 \cdot 40 = 16$ dollars. A fatter margin, won less often.
      - ask: >
          Going from $20$ to $30$ raised your expected profit. What would going
          all the way to $60$, your value, do?
        choices:
          - text: >
              Raise it further: a higher envelope wins more often.
            feedback: >
              At $60$ you win with probability $1$ and keep $60 - 60 = 0$. In a
              pay-your-bid sale every dollar you add to the envelope comes off
              the margin of every win.
          - text: >
              Drop it to $0$: you would win every time and keep nothing.
            correct: true
            feedback: >
              Right. Win probability climbs with the envelope and the margin
              shrinks with it; the profit is their product, so it rises and then
              falls.
          - text: >
              Nothing: in a sealed sale the envelope only decides who wins.
            feedback: >
              That is second-price. Here the envelope is the price.
        feedback: >
          Margin times probability of winning: one rises as the other falls, so
          the best envelope sits somewhere strictly between $0$ and your value.
      - ask: >
          Against this rival, which envelope maximises your expected profit, in
          dollars?
        expects: "30"
        hint: >
          Writing $b$ wins with probability $2b/100$. Maximise
          $(60 - b) \cdot 2b/100$.
        feedback: >
          $(60 - b) \cdot 2b/100$ has derivative zero at $60 - 2b = 0$, so
          $b = 30$, for an expected profit of $18$ dollars. Half your value.

      - part: A best reply to a best reply
        reflect: >
          She bids half her value, and your best reply with a value of $60$ is
          to bid half yours. Run the same calculation for any value $v$ and the
          answer is $v/2$ every time. Why is that coincidence exactly the
          thing to check — and what would it mean if your best reply had been
          some other rule?
        hint: >
          Ask what she would do if she reasoned about you the way you just
          reasoned about her.
        answer: >
          If your best reply were a different rule, a rival reasoning about you
          would change hers, and the pair would keep moving. "Bid half" being a
          best reply to "bid half", for every value, means neither bidder can
          gain by switching rules: a Nash equilibrium of a game where each
          player's value is private, called a Bayes–Nash equilibrium. Its bid
          rule is the answer to "how far below value should I aim?"
      - teach: >
          With $n \ge 2$ risk-neutral bidders, values iid uniform on $[0,1]$
          and a symmetric increasing equilibrium, the first-price equilibrium
          bid is $b(v) = \frac{n-1}{n}v$. Bidding as if your value were $z$ wins
          with probability $z^{n-1}$; maximising $(v - b(z))z^{n-1}$ at $z = v$
          gives $\frac{d}{dv}\left[b(v)v^{n-1}\right] = (n-1)v^{n-1}$, and
          $b(0) = 0$ integrates it to the formula. On $[0,100]$ the fraction is
          the same.
      - ask: >
          Now three bidders, values iid uniform on $[0,100]$, and yours is
          $60$. What is your equilibrium bid, in dollars?
        expects: "40"
        feedback: >
          $\frac{n-1}{n}v = \frac{2}{3} \cdot 60 = 40$ dollars. One more rival
          and you shade by $20$ instead of $30$.
      - ask: >
          Suppose your $60$ beats both rivals. Given that, what is the expected
          value of the higher of their two values, in dollars?
        expects: "40"
        hint: >
          Given they are below $60$, the two rival values are iid uniform on
          $[0,60]$.
        feedback: >
          The larger of two uniforms on $[0,60]$ averages $60 \cdot 2/3 = 40$ —
          the same number as your bid. That is the reading of the formula: bid
          what you expect the best rival to be, given that you beat them.

      - part: Where the fraction stops applying
        ask: >
          Six bidders, values iid uniform on $[0,100]$, your value $60$. Your
          equilibrium bid, in dollars?
        expects: "50"
        feedback: >
          $\frac{5}{6} \cdot 60 = 50$ dollars. The crowd leaves the best of
          five rivals close to you, so there is little room to shade: two
          bidders shade to half, ten to $90\%$.
      - ask: >
          Back to one rival, but now she writes a quarter of her value. Your
          value is $60$. Which envelope maximises your expected profit, in
          dollars?
        expects: "25"
        hint: >
          Her envelope can never exceed $25$. What happens to your win
          probability above that?
        feedback: >
          For $b \le 25$ you win with probability $4b/100$, and
          $(60 - b) \cdot 4b/100$ is still rising at $25$; at $b = 25$ you win
          for sure and keep $35$. Above $25$ you only pay more. So $25$, not
          $30$: the equilibrium bid is a best reply to rivals who play the
          equilibrium, not a bid that is best whatever they do. That is the
          difference from Vickrey's theorem.
      - ask: >
          Values are private and independent but not uniform. Does
          $\frac{n-1}{n}v$ still give the equilibrium bid?
        choices:
          - text: >
              Yes: the fraction comes from the trade-off, which every
              first-price sale has.
            feedback: >
              The trade-off is universal; the fraction is not. It came from
              $z^{n-1}$, the uniform's win probability, and a different
              distribution changes that factor.
          - text: >
              No, and nothing from the uniform case carries over.
            feedback: >
              The reading carries over: in a symmetric private-value first-price
              sale the equilibrium bid is the expected best rival value, given
              that it is below yours. Only its closed form is uniform-specific.
          - text: >
              No: the fraction is uniform-specific, but "bid the expected best
              rival, given you beat them" still holds.
            correct: true
            feedback: >
              Right. For uniforms that expectation happens to be
              $\frac{n-1}{n}v$; for other distributions it is some other
              function of $v$.
        feedback: >
          Said aloud: "Pay-your-bid trades margin against win probability.
          With $n$ uniform bidders the equilibrium bids $(n-1)/n$ of value,
          which is the expected best rival given I win."

  - node: quant-games.auctions.revenue-equivalence
    hook: >
      "Should a seller run first-price or second-price?" sounds like it needs a fresh calculation
      every time, and the honest opening line under the textbook assumptions is that it doesn't
      matter at all.
    explanation: >
      Under symmetric independent private values drawn from one atomless distribution, risk-neutral
      bidders, and any mechanism whose equilibrium hands the object to the highest value while
      giving the lowest possible type zero expected surplus, expected seller revenue is identical
      across mechanisms. Second-price and first-price both satisfy that description — Vickrey
      by dominant-strategy truthfulness, first-price by the equilibrium just derived — so
      despite charging completely different prices bidder by bidder, they average to the same
      number.


      Verifying this isn't hard given the order-statistics fact already in hand: second-price
      revenue is just the expected runner-up value, and first-price revenue is the expected
      value of $(n-1)/n$ times the winning value — two expressions that turn out numerically
      equal once both are written in terms of the same order statistics.


      The theorem's real use in an interview isn't the equality, it's naming which hypothesis
      a follow-up question breaks. Risk-averse bidders shade less in first-price than the
      risk-neutral formula predicts, since a first-price bid is a sure thing while a second-price
      bid carries residual uncertainty, so risk aversion tips revenue toward first-price.
      Common or correlated values tip revenue toward ascending formats instead, since drop-out
      order reveals information a sealed bid can't use. The theorem is a benchmark to state
      and then immediately break, not a law about real auction houses.
    worked: >
      Take $n=4$ bidders with values iid uniform on $[0,100]$. Second-price revenue is the
      expected runner-up: $100 \cdot (n-1)/(n+1) = 100 \cdot 3/5 = 60$ dollars. First-price
      revenue is $(n-1)/n$ times the expected winning value: $\frac{3}{4}\cdot\left[100 \cdot
      n/(n+1)\right] = \frac{3}{4}\cdot 80 = 60$ dollars. Both formats hand the seller exactly
      $60$ dollars in expectation, despite first-price collecting a shaded bid and second-price
      collecting an unshaded runner-up number.
    interview: >
      "Which format makes the seller more money?" wants revenue equivalence named immediately
      under its exact hypotheses, followed without prompting by the two standard breaks —
      risk aversion favors first-price, common or correlated values favor ascending formats
      — since stopping at "they're the same" misses what's actually being tested.
    pitfalls: >
      Quoting revenue equivalence without its hypotheses attached — symmetric IPV and risk
      neutrality are load-bearing, and dropping either invalidates the conclusion. Treating
      it as evidence that format choice never matters in practice, when real bidders are routinely
      risk-averse or facing a common-value object.
    recap: >
      Under symmetric IPV and risk neutrality, every efficient auction format yields the same
      expected revenue — a benchmark whose value is in knowing exactly which assumption a
      harder question is about to break.
    dialogue:
      - part: Two price rules, one seller
        teach: >
          A seller has three bidders for a painting, with values independent
          and uniform on $[0,80]$ dollars, all risk-neutral. Under first-price
          they bid the equilibrium $\frac{2}{3}$ of value; under second-price
          they bid their values. The seller wants to know which rule pays more.
      - ask: >
          What is the seller's expected revenue under second-price, in dollars?
        expects: "40"
        hint: >
          The price is the second-highest value. Count gaps down from $80$.
        feedback: >
          Three values make $4$ gaps of $20$; the runner-up sits two gaps below
          the top, at $80 \cdot 2/4 = 40$ dollars.
      - ask: >
          What is the expected revenue under first-price, in dollars?
        expects: "40"
        hint: >
          The winner is the highest value. Find its mean, then apply the
          shading.
        feedback: >
          The highest value averages $80 \cdot 3/4 = 60$, and the winner pays
          $\frac{2}{3}$ of it: $\frac{2}{3} \cdot 60 = 40$ dollars. The same as
          second-price.
      - ask: >
          One particular draw: the values come out $10$, $30$ and $75$. How
          many more dollars does first-price collect than second-price on this
          draw?
        expects: "20"
        feedback: >
          Second-price charges the runner-up's $30$. First-price charges the
          winner's bid, $\frac{2}{3} \cdot 75 = 50$. First-price collects $20$
          more here.
      - ask: >
          On another draw, $50$, $60$ and $66$, second-price collects $60$ and
          first-price $\frac{2}{3} \cdot 66 = 44$. What do the two draws and the
          two averages say together?
        choices:
          - text: >
              First-price is better: it won by more on the first draw than it
              lost on the second.
            feedback: >
              Two draws are anecdotes. The averages over every draw, which you
              computed, are both exactly $40$.
          - text: >
              Draw by draw the rules disagree in both directions, yet they
              average to the same revenue.
            correct: true
            feedback: >
              Right. First-price wins when the top value is far above the
              runner-up; second-price wins when they are close. Over the whole
              distribution the gains cancel exactly.
          - text: >
              The equality of the averages is a coincidence of these numbers.
            feedback: >
              Try any $n$: second-price averages the runner-up,
              $(n-1)/(n+1)$ of the range, and first-price averages
              $\frac{n-1}{n} \cdot \frac{n}{n+1}$ of it — the same thing.
        feedback: >
          Different prices on every draw, the same expected revenue. Something
          structural is forcing the averages together.
      - reflect: >
          In both formats the highest value wins on every draw, and a bidder
          whose value is $0$ expects nothing. Before any name: why might those
          two facts alone pin down the seller's average take, whatever the
          price rule?
        hint: >
          The seller's revenue is the bidders' expected value of what they win,
          minus their expected surplus.
        answer: >
          Expected revenue is the expected value of the object to whoever gets
          it, minus the bidders' expected surplus. The first term is fixed
          once the allocation is fixed. The second is too: a bidder can always
          act like a slightly lower value, so in equilibrium their surplus can
          only grow with value at the rate their win probability sets, and the
          zero-surplus bottom type anchors it. Same allocation, same anchor,
          same surplus at every value — so the same revenue.

      - part: The theorem and its hypotheses
        teach: >
          Revenue equivalence: with symmetric independent private values from
          one atomless distribution and risk-neutral bidders, every mechanism
          whose equilibrium gives the object to the highest value and leaves
          the lowest possible type zero expected surplus raises the same
          expected revenue. Second-price qualifies by truthful bidding,
          first-price by its equilibrium.
      - ask: >
          For $n$ bidders on $[0,1]$, which expression is the first-price
          expected revenue?
        choices:
          - text: >
              $\frac{n-1}{n}$
            feedback: >
              That is the shading fraction, the share of the winner's value
              they bid. It still has to multiply the winner's expected value.
          - text: >
              $\frac{n-1}{n} \cdot \frac{n-1}{n+1}$
            feedback: >
              That shades the runner-up's value. First-price is paid by the
              winner, whose value averages $\frac{n}{n+1}$.
          - text: >
              $\frac{n-1}{n} \cdot \frac{n}{n+1} = \frac{n-1}{n+1}$
            correct: true
            feedback: >
              Right: the shading fraction times the expected maximum, which
              collapses to the expected runner-up — second-price revenue.
        feedback: >
          On uniforms the theorem is a one-line identity: the expected shaded
          top value equals the expected runner-up.
      - ask: >
          Six bidders, values iid uniform on $[0,70]$, sold by ascending clock
          with private values. What expected revenue does the theorem predict,
          in dollars?
        expects: "50"
        hint: >
          You do not need the clock's details, only a format the theorem says
          it matches.
        feedback: >
          The clock gives the item to the highest value and leaves a zero-value
          bidder nothing, so it raises the same as second-price: the expected
          runner-up, $70 \cdot 5/7 = 50$ dollars.

      - part: Breaking one hypothesis at a time
        ask: >
          The bidders are risk-averse: they dislike uncertain outcomes.
          Otherwise the setting is unchanged. Which format should the seller
          expect to raise more?
        choices:
          - text: >
              Neither: the theorem says they are equal.
            feedback: >
              The theorem assumes risk neutrality, which this story drops.
          - text: >
              Second-price, because truthful bidding is unaffected by risk.
            feedback: >
              True that second-price bids stay at value, so its revenue does
              not move. The question is what risk does to first-price bids.
          - text: >
              First-price, because risk-averse bidders shade less to protect
              their chance of winning.
            correct: true
            feedback: >
              Right. Shading trades a fatter margin for a riskier win; a
              risk-averse bidder buys safety by bidding closer to value, and
              first-price revenue rises above second-price.
        feedback: >
          Risk aversion tips revenue toward first-price.
      - ask: >
          The object is an oil tract whose worth is common to all bidders, each
          holding a noisy survey. Which way does the comparison tip?
        choices:
          - text: >
              Toward an ascending clock, because each exit reveals another
              bidder's information.
            correct: true
            feedback: >
              Right. Learning from exits makes the remaining bidders less afraid
              of overpaying, so they bid higher than they would blind.
          - text: >
              Toward first-price, as with risk aversion.
            feedback: >
              The broken hypothesis is a different one, private values, and it
              breaks the other way: information released during the sale is what
              lifts the price.
          - text: >
              Nowhere: values are still symmetric.
            feedback: >
              Symmetric, but no longer private. The theorem needs both.
        feedback: >
          Common or correlated values tip revenue toward ascending formats.
      - ask: >
          One bidder's value is uniform on $[0,200]$, the other two on
          $[0,80]$. Which hypothesis fails?
        choices:
          - text: >
              Risk neutrality.
            feedback: >
              Nothing in the story changes anyone's attitude to risk.
          - text: >
              Symmetry: the values no longer come from one common distribution.
            correct: true
            feedback: >
              Right. With one strong bidder, first-price equilibria are no
              longer symmetric and need not give the item to the highest value,
              so revenues can differ.
          - text: >
              Independence.
            feedback: >
              The three values can still be independent draws; they are drawn
              from different distributions.
        feedback: >
          In an interview: name the theorem, attach its hypotheses — symmetric
          IPV, risk neutrality, efficient allocation, zero surplus at the
          bottom — and then say which one the follow-up breaks.

  - node: quant-games.auctions.common-value-model
    hook: >
      The moment a problem says "nobody knows the true value, but everyone gets a hint," you're
      being handed this exact model, and setting up its two conditional expectations correctly
      is most of the battle.
    explanation: >
      Every bidder values the object at the same unknown amount $V$, and bidder $i$ observes
      only a private signal $X_i$. The standard working model writes $X_i = V + \varepsilon_i$
      with the errors iid, mean zero, and independent of $V$, so each individual signal is
      unbiased: $\mathbb{E}[X_i \mid V] = V$. That equation is doing a specific job — it says
      the room's opinions are honest on average, not that any one opinion is correct.


      Two conditional expectations now have to be kept apart, and conflating them is the entire
      subject of the winner's curse. The naive one, $\mathbb{E}[V \mid X_i = x]$, is your
      best guess before you think about the auction at all — just your signal, processed against
      the prior on $V$. The relevant one, $\mathbb{E}[V \mid X_i = x, \text{you win}]$, folds
      in the extra fact that nobody outbid you, which is itself information about how your
      signal compares to everyone else's.


      Nothing about this model requires bad information or dishonest bidders — every signal
      can be perfectly unbiased and every bidder perfectly rational, and the gap between those
      two conditional expectations still opens up purely from the auction's own selection
      mechanics.
    worked: >
      A gem's true value is $V = 500$ dollars, unknown to every bidder. Three signals happen
      to be drawn as $X_1 = 480$, $X_2 = 505$, $X_3 = 530$ — each an unbiased draw in the
      sense that $\mathbb{E}[X_i \mid V] = V$, even though this particular set doesn't average
      to exactly $500$. The naive estimate for bidder $3$, before thinking about the auction
      at all, is just their own signal: $\mathbb{E}[V \mid X_3 = 530] \approx 530$ under a
      flat prior. That number treats the signal as the whole story; accounting for the extra
      information in winning at all is what the winner's curse corrects.
    interview: >
      "What's the difference between your appraisal and your appraisal given that you won?"
      is the standard verbal check that you can name the two conditional expectations distinctly
      before any auction-specific arithmetic starts — interviewers want both spelled out,
      not just the first one.
    pitfalls: >
      Treating an individually unbiased signal as though it settles the matter — unbiasedness
      is a property of the population of signals, not a guarantee about any one realized draw.
      Skipping straight to a bid without ever writing down which of the two conditional expectations
      is actually being estimated.
    recap: >
      In a common-value auction every signal is an unbiased estimate of the same unknown $V$,
      but the estimate that matters for bidding is the one conditioned on winning, not the
      raw signal itself.
    dialogue:
      - part: One reading, two questions
        teach: >
          A sealed tin of stamps will be sold, and whoever wins resells it to
          the same dealer, so it is worth one amount $V$ to every bidder.
          Nobody knows $V$ beyond "somewhere from $0$ to $500$ dollars, all
          equally plausible". Each bidder inspects it once: an inspection reads
          $V + 20$ or $V - 20$ on a fair coin, independently for each bidder.
      - ask: >
          Your inspection reads $80$. What is your best estimate of $V$, in
          dollars?
        expects: "80"
        hint: >
          Which two values of $V$ could have produced a reading of $80$, and
          is either more plausible?
        feedback: >
          $V$ is $60$ (your coin came up $+20$) or $100$ (it came up $-20$).
          The prior is flat and the coin is fair, so they are equally likely,
          and $\mathbb{E}[V \mid X = 80] = 80$.
      - ask: >
          Now you learn that the one other bidder's reading came in strictly
          below your $80$. What is your best estimate of $V$ now?
        expects: "60"
        hint: >
          Check each case. If $V = 100$, what can the rival's reading be?
        feedback: >
          If $V = 100$ the rival reads $80$ or $120$, never below $80$. If
          $V = 60$ the rival reads $40$ or $80$, below yours half the time. Only
          $V = 60$ survives, so the estimate drops to $60$ dollars.
      - ask: >
          Bids rise with readings, so "the rival read lower" is exactly what
          you learn by winning outright. Which number should your bid be built
          on?
        choices:
          - text: >
              $80$: your reading is honest, so your estimate is honest.
            feedback: >
              $80$ is honest about $V$ before the auction. But a bid only
              matters on the event that it wins, and on that event the honest
              estimate is $60$.
          - text: >
              $70$, the average of the two estimates.
            feedback: >
              The two numbers answer different questions; averaging them
              answers neither. The bid pays out only when you win, so only one
              of them is relevant.
          - text: >
              $60$: it is the value of the tin in the event that you actually
              win it.
            correct: true
            feedback: >
              Right. You pay only when you win, so the estimate that prices the
              bid is the one that already knows you won.
        feedback: >
          One reading, two estimates: $80$ before thinking about the sale, $60$
          once winning is folded in. The gap is not anyone's mistake.
      - reflect: >
          State the two different questions that $80$ and $60$ answer, and say
          why the second one, not the first, is the one a bidder must answer.
        answer: >
          $80$ answers "what is the tin worth, given my reading?"; $60$ answers
          "what is the tin worth, given my reading and given that I won?".
          Winning is information — it means the others read lower — and since
          a bid only costs or earns anything when it wins, the second
          expectation is the one the bid has to be built on. Every reading can
          be perfectly honest and the two numbers still differ.

      - part: The model, clause by clause
        teach: >
          The common-value signal model: the object is worth the same unknown
          $V$ to every bidder, and bidder $i$ sees $X_i = V + \varepsilon_i$,
          with errors iid, mean zero and independent of $V$. Then each signal
          is unbiased, $\mathbb{E}[X_i \mid V] = V$. The naive estimate is
          $\mathbb{E}[V \mid X_i = x]$; the relevant one is
          $\mathbb{E}[V \mid X_i = x, \text{you win}]$.
      - ask: >
          A new appraiser always reads exactly $15$ dollars above the tin's
          worth. Which clause fails?
        choices:
          - text: >
              Mean-zero errors: this error is always $+15$.
            correct: true
            feedback: >
              Right. Its error is constant, so $\mathbb{E}[X \mid V] = V + 15$,
              not $V$. Subtract $15$ and it is a perfect signal.
          - text: >
              Independence: the error never varies.
            feedback: >
              A constant is independent of everything. The problem is where it
              is centred, not how it varies.
          - text: >
              None: a known bias is harmless.
            feedback: >
              Harmless once corrected, but the model as stated assumes no
              correction is needed. As read, the signal is biased.
        feedback: >
          Mean zero is what "honest on average" means.
      - ask: >
          Two surveyors for an oil tract both work from the same flawed
          geological map, so when one overestimates, the other usually does
          too. Which clause fails?
        choices:
          - text: >
              Mean zero: a flawed map means biased readings.
            feedback: >
              The map can be wrong in either direction from tract to tract, so
              each reading can still be right on average. The trouble is that
              the two errors move together.
          - text: >
              Independence across bidders: their errors are correlated.
            correct: true
            feedback: >
              Right. iid errors mean each new signal is fresh information; two
              surveyors sharing a map are closer to one signal read twice.
          - text: >
              Common value: two surveyors means two different values.
            feedback: >
              The tract pays the same to whoever wins. Two readings of one
              unknown is exactly the common-value setting.
        feedback: >
          Check the clauses one at a time; a real room can pass some and fail
          others.
      - part: One clause broken, the rest intact
        ask: >
          A third appraiser errs by $10\%$ of the true worth, up or down on a
          fair coin, independently of everyone else. Which clause fails?
        choices:
          - text: >
              Unbiasedness: a percentage error is biased.
            feedback: >
              $+10\%$ and $-10\%$ on a fair coin average to zero, so
              $\mathbb{E}[X \mid V] = V$ still holds.
          - text: >
              Independence across bidders.
            feedback: >
              The coin is independent of everyone else's, so errors are
              independent across bidders.
          - text: >
              Independence of $V$: the size of the error grows with $V$.
            correct: true
            feedback: >
              Right. On a $1000$-dollar tin the error is $\pm 100$; on a
              $100$-dollar tin it is $\pm 10$. The error carries information
              about $V$, so it is not independent of it.
        feedback: >
          Unbiased, independent across bidders, and still outside the standard
          model: exactly one clause fails. In an interview, write
          $X_i = V + \varepsilon_i$ and both conditional expectations before any
          arithmetic.

  - node: quant-games.auctions.winners-curse
    hook: >
      "Why would a rational bidder with an honest estimate still lose money on average?" is
      the single most-tested idea in this unit, and the one-line answer — winning is itself
      bad news — has to come out instantly.
    explanation: >
      In a common-value auction where bids increase with the signal, the winner is whoever
      holds the highest signal — winning literally is the event $X_i = \max_j X_j$. That event
      carries information: conditional on being the maximum among $n$ unbiased draws, your
      signal is systematically the one that happened to overshoot $V$ the most, so $\mathbb{E}[V
      \mid X_i = x, X_i = \max_j X_j] < \mathbb{E}[V \mid X_i = x]$ for any $n \ge 2$.


      The gap grows with both ingredients you'd expect: more bidders means more draws competing
      to be the maximum, and $\mathbb{E}[\max_j \varepsilon_j]$ grows with $n$; more dispersed
      signals mean each individual overshoot can be larger, so the same maximum-of-$n$ logic
      scales up with the spread of the errors. Neither ingredient requires anyone to be irrational
      — the errors stay unbiased throughout, only the conditional-on-winning draw is inflated.


      A bidder who bids their raw, unconditional estimate wins precisely when that estimate
      happened to be the most inflated one in the room, and loses money on average despite
      every individual estimate being honest. This is selection, not bad luck, and it's the
      same shape a market maker meets as adverse selection: an informed counterparty only
      trades against a quote when the quote is mispriced in their favor, so being hit is itself
      evidence the price was wrong.
    worked: >
      A painting's true value is $V = 1000$ dollars. Six bidders each see an unbiased signal
      $X_i = 1000 + \varepsilon_i$ with $\varepsilon_i$ iid uniform on $[-100,100]$. Using
      the order-statistics fact, the maximum of $6$ draws on $[-100,100]$ averages $100 \cdot
      (6-1)/(6+1) = 100 \cdot 5/7 \approx 71.4$. So if every bidder simply bids their own
      signal, the expected winning bid is about $1000 + 71.4 \approx 1071.4$ — the winner
      overpays by roughly $71$ dollars relative to the painting's actual worth, purely from
      being the bidder whose error happened to run highest.
    interview: >
      "You've got an honest, unbiased estimate — why would bidding it lose money?" wants "selection,
      not bad luck" stated explicitly, followed by naming winning as the event of holding
      the maximum signal, which is itself evidence the estimate ran high.
    pitfalls: >
      Concluding the room's estimates must be biased because the winner overpays — the population
      of signals is fine; only the specific draw that wins is systematically inflated. Assuming
      the curse requires some bidders to be careless or irrational; it hits a room of perfectly
      unbiased, perfectly rational bidders with equal force.
    recap: >
      Winning a common-value auction means your signal beat every rival's, which is evidence
      it overshot the truth — bidding your raw estimate loses money on average even though
      every estimate in the room was honest.
    dialogue:
      - part: Two honest dealers
        teach: >
          A crate of returned headphones is worth $400$ dollars to anyone who
          owns it, though nobody bidding knows that. Two dealers each inspect
          it: a dealer's estimate is $430$ or $370$ on a fair coin, independently
          of the other. Each dealer bids their own estimate, sealed, highest
          wins and pays their bid.
      - ask: >
          What is one dealer's estimate on average, in dollars?
        expects: "400"
        feedback: >
          $\frac{1}{2} \cdot 430 + \frac{1}{2} \cdot 370 = 400$. Each estimate is
          unbiased.
      - ask: >
          What is the winning bid on average, in dollars?
        expects: "415"
        hint: >
          The winning bid is the larger estimate. It is $370$ only if both
          coins came up low.
        feedback: >
          Both low has probability $1/4$; otherwise someone holds $430$. So
          the winning bid averages $\frac{3}{4} \cdot 430 + \frac{1}{4} \cdot 370 = 415$
          dollars.
      - ask: >
          What is the winner's expected profit, in dollars?
        expects: "-15"
        feedback: >
          The crate is worth $400$ and the winner pays $415$ on average:
          $400 - 415 = -15$ dollars.
      - ask: >
          Both estimates are unbiased and both dealers bid them honestly. Why
          does the winner lose money on average?
        choices:
          - text: >
              Bad luck: on another day the errors would favour the winner.
            feedback: >
              The $-15$ is an average over every coin flip, not one unlucky
              day. Repeat the sale a thousand times and the winner loses about
              $15$ a time.
          - text: >
              The estimates must be biased upward after all.
            feedback: >
              Each estimate averages exactly $400$. The bias is not in the
              estimates; it is in which estimate gets to be the price.
          - text: >
              The sale picks the higher of the two estimates, and the higher
              one is more likely to be the one that ran high.
            correct: true
            feedback: >
              Right. The auction does not average the estimates; it selects the
              larger one, and the larger of two honest estimates is not honest.
        feedback: >
          Unbiased estimates, an unbiased room, and a winning price that
          overshoots on average. The bias comes from selection.

      - part: What winning tells you
        reflect: >
          You are one of the two dealers, and you have just learned you won.
          Before any name: what does that tell you about your own coin, and
          why should it change what you think the crate is worth?
        answer: >
          Winning means your estimate was at least the rival's, which is much
          more likely when your coin came up high. So the news "you won" shifts
          belief toward your estimate being an overestimate, and your best
          guess of the crate, given that you won, sits below your estimate.
          Your estimate was unbiased before the auction; conditioned on winning
          it is not.
      - ask: >
          Ties are broken by a fair coin. Given that you won, what is the
          probability that your own estimate was the high one, $430$?
        expects: "3/4"
        hint: >
          With a high estimate you win unless the rival also reads high and wins
          the tie. With a low one you win only on a tie.
        feedback: >
          A high estimate wins with probability $\frac{1}{2} + \frac{1}{2} \cdot \frac{1}{2} = \frac{3}{4}$;
          a low one with $\frac{1}{2} \cdot \frac{1}{2} = \frac{1}{4}$. With equal
          priors, $\Pr(\text{high} \mid \text{win}) = \frac{3/4}{3/4 + 1/4} = \frac{3}{4}$.
          Your error given a win averages $\frac{3}{4} \cdot 30 - \frac{1}{4} \cdot 30 = 15$
          — the $15$ the winner lost.
      - teach: >
          That is the winner's curse. In a common-value auction with iid
          signals and bids increasing in the signal, winning is the event
          $X_i = \max_j X_j$, and
          $\mathbb{E}[V \mid X_i = x, X_i = \max_j X_j] < \mathbb{E}[V \mid X_i = x]$
          for $n \ge 2$. A bidder who bids their unconditional estimate loses
          money on average, though every estimate is unbiased. The gap grows
          with $n$ and with the spread of the errors.
      - ask: >
          A third dealer joins, with the same kind of estimate. If all three
          bid their estimates, what is the winning bid on average, in dollars?
        expects: "422.5"
        hint: >
          The winning bid is $370$ only if all three coins come up low.
        feedback: >
          All low has probability $1/8$, so the winning bid averages
          $\frac{7}{8} \cdot 430 + \frac{1}{8} \cdot 370 = 422.5$ dollars. The
          winner now loses $22.5$ on average: more bidders, a more extreme
          winning error.
      - ask: >
          Back to two dealers, but their inspections are sloppier: an estimate
          is $460$ or $340$ on a fair coin. Average winning bid, in dollars?
        expects: "430"
        feedback: >
          $\frac{3}{4} \cdot 460 + \frac{1}{4} \cdot 340 = 345 + 85 = 430$
          dollars. Doubling the spread doubled the overshoot, from $15$ to
          $30$.

      - part: What the curse needs
        ask: >
          The seller changes the rules: the crate goes to one of the two
          dealers chosen by a fair coin, at that dealer's estimate. What does
          the buyer pay on average?
        choices:
          - text: >
              $415$, the same as the auction: the estimates have not changed.
            feedback: >
              The estimates have not changed, but which one becomes the price
              has. A coin picks each estimate equally often, and each averages
              $400$.
          - text: >
              $400$: a random dealer's estimate is unbiased.
            correct: true
            feedback: >
              Right. With no selection, there is no curse. The overshoot came
              entirely from the auction handing the crate to the highest
              estimate.
          - text: >
              Less than $400$, since sometimes the low estimate is chosen.
            feedback: >
              Sometimes the low one, sometimes the high one, equally often:
              the average is exactly $400$.
        feedback: >
          The curse is a property of the selection rule, not of the estimates.
      - ask: >
          Two people bid for a print that each will hang at home, each knowing
          exactly what the print is worth to them. Is the winner cursed?
        choices:
          - text: >
              Yes: the winner always holds the highest number in the room.
            feedback: >
              The highest value, not the highest estimate. With private values
              your number is not a noisy reading of anything, so being the
              highest says nothing about whether it is wrong.
          - text: >
              No: with private values, winning teaches you nothing about what
              the object is worth to you.
            correct: true
            feedback: >
              Right. The curse needs a common value that winning can be
              evidence about.
          - text: >
              Only if they bid above their values.
            feedback: >
              That is just overpaying, and it loses money in any auction. The
              curse is the loss that hits even honest, sensible bidders.
        feedback: >
          Common value, noisy signals, and a rule that selects the highest: all
          three are needed. A market maker meets the same shape as adverse
          selection — the quotes that get hit are the ones the informed side
          found mispriced. Said aloud: selection, not bad luck.

  - node: quant-games.auctions.bid-as-if-highest
    hook: >
      "What do you actually bid, then?" is the immediate follow-up to the winner's curse,
      and the fix is one sentence: bid the value you'd assign if you already knew your estimate
      was the highest in the room.
    explanation: >
      The correction is mechanical once you accept the diagnosis. Don't bid your signal $x$;
      bid the conditional expectation of $V$ given that your signal turns out to be the maximum
      of the $n$ in the room. With $X_i = V + \varepsilon_i$, that conditional expectation
      is your raw signal minus the expected overshoot of the largest of $n$ errors, $\mathbb{E}[\max_j
      \varepsilon_j]$ — the order-statistics quantity from earlier in this unit, evaluated
      at $k=1$.


      For errors uniform on $[-a,a]$, that expected overshoot is $a(n-1)/(n+1)$, the same
      formula used to find the maximum of $n$ uniforms, now read as a correction rather than
      a target. The correction climbs toward $a$ as more bidders join, which is the arithmetic
      behind shading harder as the room fills up.


      This correction is a break-even fix, not the full equilibrium — subtracting the expected
      overshoot brings expected profit conditional on winning to roughly zero, so an actual
      equilibrium bid shades a little further still to leave positive surplus. In a second-price
      common-value auction the sharp version conditions on barely winning rather than winning
      outright: $b(x) = \mathbb{E}[V \mid X_i = x, \max_{j \ne i} X_j = x]$, the value of
      the object exactly at the moment you're tied for the top signal.
    worked: >
      Ten bidders see signals for an antique clock modeled as $X_i = V + \varepsilon_i$ with
      $\varepsilon_i$ uniform on $[-50,50]$. The correction is $a(n-1)/(n+1) = 50 \cdot 9/11
      \approx 40.9$. Suppose your own signal reads $620$ dollars; bidding as if you're the
      highest means bidding about $620 - 40.9 \approx 579.1$ dollars rather than the raw $620$
      — and a real equilibrium bid would shade a bit further below even that, since $579.1$
      only zeroes out expected profit rather than leaving any margin.
    interview: >
      "You've got a signal — what do you bid?" in a common-value setup wants "not my signal
      — my signal minus the expected overshoot of the highest of $n$ errors," with the specific
      uniform-error correction $a(n-1)/(n+1)$ produced on the spot, not just the qualitative
      direction of the adjustment.
    pitfalls: >
      Plugging in $n-1$ rivals instead of $n$, the total number of signals in the room including
      your own, into the correction formula — the maximum being conditioned on runs over all
      $n$ signals, not just the rivals'. Stopping at the break-even correction and calling
      it the equilibrium bid, when a genuine equilibrium shades further still to secure positive
      expected profit.
    recap: >
      Correct a common-value bid by subtracting the expected overshoot of the largest of $n$
      signal errors from your raw estimate — $a(n-1)/(n+1)$ for uniform errors — and shade
      a touch further still for actual equilibrium profit.
    dialogue:
      - part: The only event your bid cares about
        teach: >
          Five firms bid sealed, first-price, for a lot of copper scrap worth
          the same unknown $V$ to each. Every firm's assay reads
          $X_i = V + \varepsilon_i$, errors iid uniform on $[-36,36]$ dollars.
          Your assay reads $700$. You know about the winner's curse, so you
          will not simply bid $700$ — but you need a number.
      - ask: >
          If every firm bid its own assay, by how much would the winning assay
          overshoot $V$ on average, in dollars?
        expects: "24"
        hint: >
          The winning assay carries the largest of five errors on $[-36,36]$.
        feedback: >
          The largest of $5$ uniforms on $[-36,36]$ averages
          $36 \cdot (5-1)/(5+1) = 36 \cdot 4/6 = 24$ dollars.
      - ask: >
          Suppose your assay is the highest of the five. Roughly what is your
          best estimate of $V$ then, in dollars?
        expects: "676"
        hint: >
          If yours is the highest assay, your error is the largest of the five.
        feedback: >
          Being the highest means your error is the maximum of five, which
          averages $24$, so $V$ is about $700 - 24 = 676$ dollars — not the
          $700$ you would say before thinking about the auction.
      - reflect: >
          Your assay says $700$. But your bid only costs or earns anything when
          it wins, and in that event you would estimate $676$. What number
          should you bid to break even, and what rule for any common-value bid
          does that suggest?
        answer: >
          Bid about $676$: the value of the scrap in the event that your bid
          wins. In general, do not bid your estimate; bid the estimate you
          would hold if you already knew it was the highest in the room, which
          means subtracting the expected overshoot of the largest of the $n$
          errors. The winner's curse is then priced in before you bid rather
          than discovered after you win.
      - teach: >
          Bid as if your estimate is the highest. With $X_i = V + \varepsilon_i$,
          subtract $\mathbb{E}[\max_j \varepsilon_j]$ from your estimate; for
          errors uniform on $[-a,a]$ that is $a(n-1)/(n+1)$, which climbs toward
          $a$ as bidders pile in. The subtraction brings expected profit, given
          that you win, to roughly zero; an equilibrium bid shades a little
          further to leave some surplus.

      - part: Counting the room correctly
        ask: >
          A colleague computes the correction with your four rivals,
          $36 \cdot 3/5 = 21.6$, rather than all five firms. Who is right?
        choices:
          - text: >
              The colleague: you are conditioning on beating your rivals, and
              there are four of them.
            feedback: >
              Beating four rivals means your assay is the largest of all five,
              your own included — so your error is the largest of five errors,
              not four.
          - text: >
              You: the error that matters is your own, and it is the largest of
              all five.
            correct: true
            feedback: >
              Right. The overshoot you are correcting is your error, conditioned
              on being the maximum of $n$ errors, so $n$ counts everyone in the
              room.
          - text: >
              Neither: you should average the two corrections.
            feedback: >
              One of them answers the question being asked. Your error given
              that it beats four others is the maximum of five errors, which
              averages $24$.
        feedback: >
          $n$ is the number of signals in the room, yours included.
      - ask: >
          Nine firms, errors uniform on $[-25,25]$, and your assay reads $480$.
          What do you bid, in dollars?
        expects: "460"
        feedback: >
          The correction is $25 \cdot 8/10 = 20$, so the bid is
          $480 - 20 = 460$ dollars.
      - ask: >
          Only two firms, errors uniform on $[-36,36]$. How large is the
          correction, in dollars?
        expects: "12"
        feedback: >
          $36 \cdot 1/3 = 12$ dollars, half the five-firm correction. Beating
          one rival is weak evidence of overshoot; beating many is strong.

      - part: Break-even, equilibrium, and second-price
        ask: >
          Is $676$, your bid in the five-firm room, the equilibrium bid?
        choices:
          - text: >
              Yes: it removes the winner's curse exactly.
            feedback: >
              It removes the expected loss, leaving expected profit near zero
              when you win. A bidder can do better than zero by shading a little
              further, trading a few wins for margin.
          - text: >
              No: it is a break-even bid, and equilibrium shades a little
              further to leave some profit.
            correct: true
            feedback: >
              Right. The correction fixes the curse; the extra shading is the
              same margin-versus-win-probability trade-off as in private-value
              first-price.
          - text: >
              No: equilibrium bids the raw assay, since everyone else shades
              too.
            feedback: >
              If others shade, winning still means your assay was the highest,
              and the highest assay still overshoots by $24$ on average. The
              curse does not cancel out.
        feedback: >
          Subtract the overshoot to break even; shade a touch more for profit.
      - ask: >
          Now the scrap is sold second-price: you pay the runner-up's bid. On
          which event should your bid be built?
        choices:
          - text: >
              Winning outright, as in first-price.
            feedback: >
              In second-price your bid does not set your price; it only decides
              whether you win. What matters is the case where your bid is the
              one that tips the outcome.
          - text: >
              Barely winning: the top rival's assay ties yours, so your bid is
              exactly what decides the sale.
            correct: true
            feedback: >
              Right. The sharp rule is
              $b(x) = \mathbb{E}[V \mid X_i = x, \max_{j \ne i} X_j = x]$: the
              value of the object at the margin where raising or lowering your
              bid changes whether you win.
          - text: >
              Losing, since that is when the runner-up's bid is yours.
            feedback: >
              When you lose you pay nothing, whatever anyone bids. The event
              that prices a bid is one where that bid matters.
        feedback: >
          The idea is the same in both formats: condition on the event in which
          your bid matters. Said aloud: "Not my estimate — my estimate minus the
          expected overshoot of the highest of $n$ errors."

  - node: quant-games.auctions.jar-of-coins
    hook: >
      "There's a jar of coins in the room — what do you bid for it?" is asked almost verbatim,
      and the entire trick is recognizing it as a common-value auction with $n$ signals, not
      a standalone estimation puzzle.
    explanation: >
      The jar-of-coins question is the winner's curse stripped to its purest form: a genuinely
      unknown total, a room full of honest guesses, and a first-price or second-price sale
      of the jar to the highest bidder. Framing it any other way — as "estimate the jar as
      accurately as you can" — answers a different, easier question than the one actually
      being asked.


      The right structure to state out loud, in order: name the model (each guess is the true
      total plus an unbiased error), name the mechanism (the winning bid is the maximum of
      those $n$ guesses, not their average), compute the expected overshoot of that maximum,
      and subtract it from your own guess before naming a number. Stating the model and the
      mechanism before reaching for arithmetic is worth more in an interview than getting
      to the right number by a shortcut, because it's the part that shows you recognize the
      shape of the problem.


      The generalizable lesson is that an auction never polls the room's opinion — it selects
      the largest error in it, and the size of that selection effect scales directly with
      how many people are guessing and how spread out their guesses are.
    worked: >
      A jar holds $250$ dollars in coins, unknown to a room of $15$ bidders, first-price sealed-bid.
      Model each guess as $X_i = 250 + \varepsilon_i$ with $\varepsilon_i$ uniform on $[-60,60]$.
      The expected overshoot of the maximum of $15$ draws is $60 \cdot (15-1)/(15+1) = 60
      \cdot 14/16 = 52.5$. Suppose your own guess of the jar is $275$ dollars; bidding your
      guess directly would put you right in the range that tends to win precisely when it's
      most inflated, so the corrected bid is about $275 - 52.5 = 222.5$ dollars instead —
      noticeably below your own honest estimate, which is exactly the point.
    interview: >
      The canonical phrasing is close to verbatim — "there's a jar of coins on the table,
      how much would you bid for it" — and interviewers listen for three things in order:
      naming it as common-value, stating that bidding your raw guess loses on average, and
      producing an actual corrected number rather than stopping at "I'd bid less."
    pitfalls: >
      Answering with "my best guess" — precisely the naive answer this unit exists to correct,
      since it wins exactly when it's the most inflated guess in the room. Forgetting that
      the correction scales with room size and guess spread — a jar guessed by $5$ people
      needs far less shading than one guessed by $50$.
    recap: >
      Treat "guess the jar" as a common-value auction: bid your estimate minus the expected
      overshoot of the largest error among $n$ guessers, not the estimate itself.
    dialogue:
      - part: Seven honest guesses
        teach: >
          A jar on the desk holds exactly $220$ dollars in coins, though nobody
          in the room knows that. Seven people each guess the total, and each
          guess is $X_i = 220 + \varepsilon_i$ with errors iid uniform on
          $[-48,48]$. The jar is sold first-price sealed-bid, and everyone
          bids their own guess.
      - ask: >
          On average, what is the mean of the seven guesses, in dollars?
        expects: "220"
        feedback: >
          Every error averages zero, so every guess, and their mean, averages
          $220$. Polled, the room is right.
      - ask: >
          What is the expected winning bid, in dollars?
        expects: "256"
        hint: >
          The winning bid is the largest guess, $220$ plus the largest of seven
          errors on $[-48,48]$.
        feedback: >
          The largest of $7$ errors averages $48 \cdot 6/8 = 36$, so the winning
          bid averages $220 + 36 = 256$ dollars.
      - ask: >
          What is the winner's expected profit, in dollars?
        expects: "-36"
        feedback: >
          They pay $256$ on average for $220$ in coins: $-36$ dollars. The
          room's consensus is exact and its winner still overpays.

      - part: Switching the price rule
        ask: >
          The seller switches to second-price: the highest guess wins and pays
          the second-highest. Everyone still bids their guess. What is the
          expected price, in dollars?
        expects: "244"
        hint: >
          The runner-up's error is the second-largest of seven on $[-48,48]$:
          two gaps below the top.
        feedback: >
          Eight gaps of $96/8 = 12$; the second-largest error sits two gaps
          below $48$, at $24$. The price averages $220 + 24 = 244$ dollars.
      - ask: >
          Does the second-price rule solve the winner's problem?
        choices:
          - text: >
              Yes: the winner no longer pays their own inflated guess.
            feedback: >
              They pay the runner-up's guess, and the runner-up's guess is
              the second most inflated in the room. The loss shrinks from $36$ to
              $24$; it does not disappear.
          - text: >
              It makes it worse, because the winner is still the most
              optimistic guesser.
            feedback: >
              The winner is the same person, but their price fell from $256$ to
              $244$ on average. The rule helps, just not enough.
          - text: >
              Only partly: the price is still an upper order statistic of the
              errors, so the winner loses $24$ on average.
            correct: true
            feedback: >
              Right. Second-price trades the largest error for the
              second-largest, and with seven guessers both are well above zero.
        feedback: >
          A different price rule moves which error you pay for; it cannot
          remove the selection.
      - reflect: >
          Averaged, the room's guesses are spot on; auctioned, they produce a
          price $36$ dollars too high. Say what an auction actually reads from a
          room of guesses that a poll does not, and what that means for the
          number you should put on your own envelope.
        answer: >
          A poll reads the average guess; an auction reads the largest one,
          which is the guess with the largest error. The overpayment is the
          expected largest error, and it is there whether or not anyone is
          careless. So your envelope should be your guess minus that expected
          largest error — the value of the jar given that your guess turns out
          to be the highest.
      - teach: >
          That is the jar of coins: an auction does not poll the room's opinion,
          it selects the largest error in it. Say it in order: the model (each
          guess is the total plus an unbiased error), the mechanism (the winning
          bid is the largest guess), the overshoot (here $36$), and the
          corrected bid.

      - part: Your own envelope
        ask: >
          Your guess is $250$ dollars, in the same room of seven. What do you
          bid?
        expects: "214"
        feedback: >
          $250 - 36 = 214$ dollars, $36$ below your honest guess.
      - ask: >
          If all seven bid their guess minus $36$, what is the winner's expected
          profit, in dollars?
        expects: "0"
        feedback: >
          The winning bid is the largest guess minus $36$, which averages
          $256 - 36 = 220$: the jar's worth. Expected profit $0$ — break-even,
          the curse priced out.
      - ask: >
          The same jar is shown to a lecture hall of $23$ guessers with the
          same spread of errors. How large is the correction now, in dollars?
        expects: "44"
        feedback: >
          $48 \cdot 22/24 = 44$ dollars, against $36$ in the room of seven. A
          bigger room selects a more extreme error, and the correction can only
          approach $48$, the largest error possible. In the interview: "It is
          a common-value auction; the winner holds the largest error; I bid my
          guess minus its expected size."

  - node: quant-games.auctions.acquire-a-company
    hook: >
      "You can make a takeover bid for a company you can't fully value, but you'd run it better
      than the current owner" sounds like ordinary due diligence, and the fact that the answer
      is often "bid nothing" is what makes it a favorite curveball.
    explanation: >
      The owner accepts your bid $b$ exactly when the firm's true value $T$ to them satisfies
      $T \le b$ — a trade that only happens when the informed party agrees to it, precisely
      the "you win only when your number was highest" structure from the winner's curse, wearing
      a different costume: here winning means the offer gets accepted at all.


      The tempting shortcut is using the unconditional expected value of $T$ and scaling it
      by your multiplier — that's the standard wrong answer, because it ignores that acceptance
      itself is informative: a firm only sells to you when its owner's true value sits at
      or below your bid, systematically the lower half of the distribution, not a representative
      draw from the whole thing.


      Conditioning on acceptance fixes it. Given $T \le b$, $T$ is distributed only over $[0,b]$,
      so its conditional mean is exactly half of what the unconditional mean would suggest
      for that same cutoff, and the firm you actually buy is worth your multiplier times that
      conditional mean, not the multiplier times the unconditional mean. Whenever that conditional
      value comes out below the bid itself, every positive bid loses money, and the only bid
      that doesn't lose is zero.
    worked: >
      A firm's value $T$ to its current owner is uniform on $[0,200]$, and under your management
      it would be worth $1.8T$. The owner accepts a bid $b$ exactly when $T \le b$. Conditional
      on acceptance, $T$ is uniform on $[0,b]$ with mean $b/2$, so the firm you actually acquire
      is worth $1.8 \cdot (b/2) = 0.9b$ under your management, while you paid $b$ — expected
      profit is $0.9b - b = -0.1b$, negative for every positive $b$. The correct bid is $0$
      dollars. Notice the upper bound of $T$'s range, $200$, never entered the final answer
      — only the multiplier did, since the $b/2$ conditional mean and the $b$ in the cost
      cancel the scale of the distribution.
    interview: >
      "You can acquire a company whose value you don't know, but you'd run it better than
      the current owner — how much do you bid?" wants the acceptance condition $T \le b$ written
      down explicitly and the conditional mean $b/2$ computed, not the unconditional expected
      value of $T$ multiplied by your synergy factor.
    pitfalls: >
      Computing the unconditional expected value of $T$ and scaling it by the multiplier —
      exactly the winner's-curse mistake of ignoring that the trade only happens when the
      counterparty agrees, which selects the lower half of the distribution. Assuming any
      positive multiplier justifies a positive bid; under this uniform model the breakeven
      multiplier is $2$, and anything below it makes every positive bid a loser.
    recap: >
      A takeover offer only executes when the seller accepts, so value the firm conditional
      on acceptance, not unconditionally — under a uniform-value model with multiplier below
      $2$, the only bid that doesn't lose money is zero.
    dialogue:
      - part: An offer the owner can refuse
        teach: >
          You can make one take-it-or-leave-it offer for a bakery chain. To its
          owner it is worth $T$ thousand dollars, and to you $T$ is uniform on
          $[0,120]$; the owner knows $T$ exactly. Under your management the
          chain would be worth $1.6T$. The owner accepts a bid $b$ exactly
          when $T \le b$.
      - ask: >
          Before making any offer, what is the chain worth to you on average,
          in thousands of dollars?
        expects: "96"
        feedback: >
          $\mathbb{E}[T] = 60$, so $1.6 \cdot 60 = 96$. A bid of $80$ looks
          like a $16$ thousand dollar bargain.
      - ask: >
          You bid $80$. What is the probability that the owner accepts?
        expects: "2/3"
        feedback: >
          The owner accepts when $T \le 80$, which has probability
          $80/120 = 2/3$.
      - ask: >
          Given that the owner accepts your $80$, what is your expected profit,
          in thousands of dollars?
        expects: "-16"
        hint: >
          Given $T \le 80$, how is $T$ distributed?
        feedback: >
          Given acceptance, $T$ is uniform on $[0,80]$ with mean $40$, so the
          chain you actually get is worth $1.6 \cdot 40 = 64$ to you, and you
          paid $80$: $64 - 80 = -16$.
      - ask: >
          The chain is worth $96$ to you on average, yet buying it at $80$
          loses money. What went wrong with the $96$?
        choices:
          - text: >
              Nothing: $-16$ is bad luck on this particular chain.
            feedback: >
              $-16$ is an average over every chain the owner would sell you at
              $80$, not one unlucky draw.
          - text: >
              It averages over all chains, but you only get the ones the owner
              is happy to sell at $80$ — the cheap ones.
            correct: true
            feedback: >
              Right. The owner says yes exactly when $T$ is low, so acceptance
              is evidence that $T$ is low. The trade happens only on the bad
              half of the distribution.
          - text: >
              The $1.6$ multiplier is too small to justify any purchase.
            feedback: >
              $1.6$ would make the purchase profitable if you got a typical
              chain. The problem is which chains you get.
        feedback: >
          The informed side agrees only when the deal is good for them. Winning
          the chain is the same kind of news as winning a common-value
          auction.
      - reflect: >
          For a general bid $b$, work out what the chain is worth to you given
          that the owner accepts, write your expected profit on acceptance, and
          say what you should bid.
        hint: >
          Given acceptance, $T$ is uniform on $[0,b]$.
        answer: >
          Given acceptance $T$ averages $b/2$, so the chain is worth
          $1.6 \cdot b/2 = 0.8b$ to you and the expected profit on acceptance
          is $0.8b - b = -0.2b$. Every positive bid loses money in expectation,
          and the more you bid the more you lose. The right bid is $0$.

      - part: Bidding nothing
        teach: >
          That is the acquiring-a-company problem. A trade that happens only
          when the informed party agrees must be valued conditional on their
          agreeing: given $T \le b$, $T$ averages $b/2$, the chain is worth
          $m \cdot b/2$, and the profit on acceptance is $(m/2 - 1)b$. For any
          multiplier $m$ below $2$, every positive bid loses, and the answer is
          to bid nothing.
      - ask: >
          You bid the top of the range, $120$, so the owner always accepts.
          What is your expected profit, in thousands of dollars?
        expects: "-24"
        feedback: >
          Now you get every chain, averaging $T = 60$ and worth $96$ to you,
          for $120$: $96 - 120 = -24$, which is $-0.2 \cdot 120$. Even buying
          every chain, you pay more than they are worth.
      - ask: >
          Suppose instead $T$ were uniform on $[0,500]$, still with multiplier
          $1.6$. What is your expected profit on acceptance from a bid of $80$?
        expects: "-16"
        feedback: >
          Given $T \le 80$, $T$ is still uniform on $[0,80]$ with mean $40$, so
          the profit is still $64 - 80 = -16$. The width of the range never
          enters; only the multiplier does.
      - ask: >
          Above what multiplier does a positive bid stop losing money?
        choices:
          - text: >
              $1$: above that the chain is worth more to you than to the owner.
            feedback: >
              Worth more than to the owner on average, yes. But you only buy
              the chains the owner values below your bid, which average half
              of it. At $m = 1.6$ that still loses.
          - text: >
              $2$: acceptance halves the expected $T$, and the multiplier has
              to make up the half.
            correct: true
            feedback: >
              Right. Profit on acceptance is $(m/2 - 1)b$, positive only when
              $m > 2$.
          - text: >
              None: a positive bid always loses to an informed owner.
            feedback: >
              At $m = 2.5$ the profit on acceptance is $(1.25 - 1)b = 0.25b$,
              which is positive. Informed counterparties are expensive, not
              unbeatable.
        feedback: >
          Breakeven is $m = 2$: the multiplier must beat the halving that
          acceptance imposes.

      - part: When acceptance carries no news
        ask: >
          A different seller: the chain belongs to an estate, and the executor,
          who has never seen the books, will accept any bid above $50$. With
          $T$ uniform on $[0,120]$ and multiplier $1.6$, should you still bid
          nothing?
        choices:
          - text: >
              Yes: a seller who accepts is always telling you something bad.
            feedback: >
              Only a seller who knows $T$. This executor's yes depends on your
              bid, not on $T$, so it says nothing about the chain.
          - text: >
              Yes, because the multiplier is below $2$.
            feedback: >
              The threshold $2$ came from acceptance halving the expected $T$.
              Here acceptance does not depend on $T$ at all, so you get a
              typical chain.
          - text: >
              No: acceptance is uninformative, so you get a typical chain worth
              $96$, and a bid just above $50$ wins about $46$.
            correct: true
            feedback: >
              Right. With no selection, the unconditional $96$ is the right
              number, and a bid a little over $50$ earns about $96 - 50 = 46$
              thousand dollars.
        feedback: >
          The curse comes from who decides and what they know, not from the
          multiplier. Said aloud: "The owner only says yes when $T$ is below my
          bid, so the firm I buy averages $b/2$; it is worth $0.8b$ to me and I
          paid $b$. Bid zero."

  - node: quant-games.auctions.more-bidders
    hook: >
      "There's more competition, so you should bid more aggressively" is true exactly half
      the time in this unit, and knowing which half is the entire test.
    explanation: >
      Under independent private values, a bigger room leaves less room to shade: the uniform
      equilibrium bid $(n-1)v/n$ climbs from $v/2$ at $n=2$ toward $v$ itself as $n$ grows,
      since beating more rivals means the top rival is more likely to sit close to your own
      value, and the seller's expected revenue $(n-1)/(n+1)$ climbs right along with it —
      exactly why a seller benefits from attracting a crowd.


      Under common values the same reasoning flips sign entirely. Winning against more rivals
      means your signal beat a larger field, which makes "you were the maximum" stronger evidence
      of overshoot, and the correction term — the expected overshoot of the largest of $n$
      errors — grows with $n$. So the right response to a fuller room on a common-value object
      is to shade further down, not to bid up.


      The reflex "there's more competition, so raise your bid" is the private-values instinct
      applied on autopilot, and it's exactly backwards the moment the object in front of you
      is common-value — the two forces pull in opposite directions for the same superficial
      reason, more rivals, and only the value model tells you which way to go.
    worked: >
      Compare the two models directly at $n=3$ versus $n=9$. Private values, uniform on $[0,100]$,
      your value $v=70$: at $n=3$ the equilibrium bid is $\frac{2}{3}\cdot 70 \approx 46.7$,
      and at $n=9$ it's $\frac{8}{9}\cdot 70 \approx 62.2$ — the bid climbs as the room fills.
      Common values, errors uniform on $[-30,30]$, your raw signal $x=500$: the correction
      at $n=3$ is $30 \cdot 2/4 = 15$, giving a corrected bid of $500 - 15 = 485$; at $n=9$
      the correction is $30 \cdot 8/10 = 24$, giving a corrected bid of $500 - 24 = 476$ —
      the bid falls as the room fills, the opposite direction from the private-values case
      with the same jump in $n$.
    interview: >
      "If more bidders show up, should you bid more aggressively?" wants "it depends on the
      value model" stated first, followed immediately by both directions with their mechanisms
      — private values tighten the bid toward true value, common values widen the correction
      — rather than a single reflexive answer.
    pitfalls: >
      Applying "more competition, bid closer to value" to a common-value object, which is
      exactly backwards — the winner's-curse correction grows, not shrinks, as the room fills.
      Forgetting the two effects run through different formulas, $(n-1)/n$ for private-value
      shading and $a(n-1)/(n+1)$ for the common-value correction, so they don't cancel or
      average against each other in a mixed setting without separate analysis.
    recap: >
      More bidders push a private-value equilibrium bid up toward true value, but push a common-value
      bid down as the winner's-curse correction grows — the same "more competition" fact demands
      opposite responses depending on the value model.
    dialogue:
      - part: Two rooms fill up
        teach: >
          Tomorrow you bid in two sealed first-price sales. Lot A is a watch
          you will keep: values are private, iid uniform on $[0,90]$ dollars,
          and yours is $72$. Lot B is a container of salvage worth one unknown
          $V$ to everyone: signals are $V + \varepsilon_i$, errors iid uniform
          on $[-54,54]$, and yours reads $560$. You expected one rival in each
          room. You now hear each will hold eight bidders.
      - ask: >
          With two bidders on lot A, what is your equilibrium bid, in dollars?
        expects: "36"
        feedback: >
          $\frac{n-1}{n}v = \frac{1}{2} \cdot 72 = 36$ dollars.
      - ask: >
          With eight bidders on lot A?
        expects: "63"
        feedback: >
          $\frac{7}{8} \cdot 72 = 63$ dollars, up $27$. With seven rivals the
          best of them is likely close to you, so there is little room to
          shade.
      - ask: >
          Before computing lot B: which way should your salvage bid move when
          the room grows from two to eight?
        choices:
          - text: >
              Up, as on lot A: more competition means bid closer to your
              number.
            feedback: >
              On lot A your number is your value, known exactly. On lot B it is
              a noisy signal, and beating seven signals says more about your
              error than beating one. Compute it next.
          - text: >
              It stays put: the salvage is worth the same however many bid.
            feedback: >
              Its worth does not change, but what winning tells you about your
              signal does. Your best estimate given a win depends on how many
              signals you beat.
          - text: >
              Down: beating seven signals is stronger evidence your signal ran
              high.
            correct: true
            feedback: >
              Right — and the computation will show by how much.
        feedback: >
          The same news, more bidders, might mean different things for the two
          lots. Test it.
      - ask: >
          With two bidders on lot B, bid your signal minus the expected
          overshoot of the winning signal, the bid that breaks even when you
          win. What is it, in dollars?
        expects: "542"
        hint: >
          The winning signal carries the larger of two errors on $[-54,54]$.
        feedback: >
          The correction is $54 \cdot 1/3 = 18$, so the bid is
          $560 - 18 = 542$ dollars.
      - ask: >
          With eight bidders on lot B?
        expects: "518"
        feedback: >
          The correction is $54 \cdot 7/9 = 42$, so the bid is
          $560 - 42 = 518$ dollars, down $24$. Lot A's bid rose $27$; lot B's
          fell $24$.

      - part: Same news, opposite moves
        reflect: >
          Eight bidders instead of two raised one bid and lowered the other.
          Say what "more rivals" changes on each lot, and why that pushes in
          opposite directions.
        answer: >
          On the watch, more rivals change the distribution of the best rival
          value, pushing it up toward yours, so shading costs more wins and
          the bid rises toward value. On the salvage, more rivals change what
          winning means: being the highest of eight signals is stronger
          evidence of a large positive error than being the higher of two, so
          the correction grows and the bid falls. One fact, more bidders; the
          value model decides which effect it has.
      - teach: >
          More bidders cuts both ways. Under independent private values, the
          uniform bid $(n-1)v/n$ climbs from $v/2$ toward $v$, and seller
          revenue climbs with it, which is why sellers want a crowd. Under
          common values, the correction $\mathbb{E}[\max_j \varepsilon_j]$
          grows with $n$, so the right response to a fuller room is to bid
          lower. "Competition, so bid up" is exactly backwards on a
          common-value object.
      - part: The reflex, and where the correction stops
        ask: >
          A colleague on the salvage desk says: "The room tripled. Everyone
          will be bidding hard, so we have to raise our number to stay in it."
          What is the flaw?
        choices:
          - text: >
              None: if we don't bid up, we will lose the lot.
            feedback: >
              Winning more often is not the goal. Winning a common-value lot
              with an uncorrected bid in a big room is exactly when you
              overpay most.
          - text: >
              It applies the private-value reflex: on a common value, a bigger
              room makes a win worse news, so the bid should fall.
            correct: true
            feedback: >
              Right. The more signals you beat, the more your own signal
              probably overshot. Bidding up on that news compounds the curse.
          - text: >
              Bidding hard is fine, but only in second-price.
            feedback: >
              The curse is not cured by second-price; the runner-up's signal
              also overshoots more in a bigger room. The direction holds there
              too.
        feedback: >
          The private-value instinct is right on the watch and wrong on the
          salvage; the reflex is the trap.
      - ask: >
          However many bidders crowd into lot B's room, what is the largest the
          correction can ever get, in dollars?
        expects: "54"
        feedback: >
          $54 \cdot (n-1)/(n+1)$ climbs toward $54$ but never reaches it: no
          error exceeds $54$. Your bid falls toward $560 - 54 = 506$ and stops.
          In an interview: "It depends on the value model. Private values, a
          crowd pushes my bid up toward value. Common value, it pushes my bid
          down, because winning against more signals means my signal ran
          higher."
