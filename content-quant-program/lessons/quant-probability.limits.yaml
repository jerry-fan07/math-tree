unit: quant-probability.limits
opening: >
  Large-$n$ behavior is what makes probability computable in practice: a
  single die roll tells you almost nothing, but the sum or average of many
  independent draws locks onto a predictable shape you can compute with. This
  unit builds that machinery in order — first pinning down what "converges"
  even means for a sequence of random variables, three competing modes,
  ranked, then the law of large numbers in its weak and strong forms, then the
  central limit theorem and the approximation toolkit it powers: the
  binomial-to-normal corollary, the continuity correction, and the Poisson
  alternative for rare events. It closes with the supporting cast an interview
  expects on demand — Slutsky's theorem and the delta method for pushing a
  limit through an estimate, Borel–Cantelli for almost-sure statements, and
  the one fact tying it all together: every error here shrinks like
  $1/\sqrt{n}$.
lessons:
  - node: quant-probability.limits.convergence-in-probability
    hook: >
      Every "does the sample average behave well" question is secretly asking
      you to state this definition correctly, and the two standard wrong
      answers are swapping the quantifiers or claiming it says something about
      one realized trajectory.
    explanation: >
      A sequence of random variables can't converge the way a sequence of
      numbers does — each $X_n$ is spread across many possible values, not
      pinned to one. The fix is to call $X_n$ close to $X$ when the
      *probability* of a large gap vanishes, for every tolerance you name in
      advance: pick $\varepsilon>0$ first, then send $n\to\infty$ and watch
      $\Pr(|X_n-X|>\varepsilon)\to0$.

      Picture, for each $n$, almost all of $X_n$'s mass sitting inside a
      window around the target $c$, with a shrinking sliver left outside. The
      definition only ever measures that sliver at one $n$ at a time — it
      never asks whether the slivers at $n=100$ and $n=200$ belong to the same
      run of bad luck. A rare miss can recur at infinitely many separate
      $n$'s and convergence in probability still holds, because the claim is
      about frequency at each $n$, not about a single trajectory settling
      down.

      Two working facts get used silently downstream: the limit is unique up
      to a probability-zero set, and continuous maps preserve the mode — if
      $g$ is continuous and $X_n\to c$ in probability, then $g(X_n)\to g(c)$
      in probability too, with no fresh epsilon argument required.
    worked: >
      Let $X_n$ equal $n$ with probability $1/n$ and $0$ otherwise. For any
      fixed $\varepsilon>0$ and $n>\varepsilon$, the event
      $\{|X_n|>\varepsilon\}$ is exactly $\{X_n=n\}$, so
      $\Pr(|X_n|>\varepsilon)=1/n\to0$: $X_n\to0$ in probability. Yet the
      sequence never settles in the ordinary sense — at $n=1000$ there's still
      a genuine $\Pr(X_{1000}=1000)=0.001$ chance of a huge value, and such
      spikes keep recurring at every scale.
    interview: >
      "State the definition of convergence in probability," or "does
      $X_n\to0$ in probability mean $X_n$ is eventually always close to $0$,"
      both fish for the same distinction: fixed $\varepsilon$ first, then
      $n\to\infty$, and no claim about the realized path. A good answer names
      the shrinking-but-recurring-sliver picture in one sentence.
    pitfalls: >
      Reversing the quantifiers — letting $n\to\infty$ before fixing
      $\varepsilon$ — trivializes the definition. Reading "$X_n\to c$ in
      probability" as "$X_n$ eventually stays near $c$ forever" smuggles in
      almost sure convergence, a strictly stronger claim.
    recap: >
      Convergence in probability says the chance of missing the target by
      more than any fixed tolerance shrinks to zero, one $n$ at a time, with
      no promise about the realized sequence itself.
    dialogue:
      - part: Three bots and one fair value
        teach: >
          Three pricing bots each estimate an asset worth exactly $50$. After
          its $n$th update, bot A reports $50 + 1/n$. Bot B reports $50$,
          except that with probability $2/n$ it glitches and reports $50 + n$.
          Bot C reports $49$ or $51$, with probability $1/2$ each, at every
          update.
      - ask: >
          At update $n = 200$, what is the probability that bot B's report
          misses $50$ by more than $0.5$?
        expects: "0.01"
        hint: >
          Bot B misses only when it glitches.
        feedback: >
          It misses exactly when it glitches, which happens with probability
          $2/200 = 0.01$. When it does miss, it misses by $200$.
      - ask: >
          What is bot B's expected report at $n = 200$?
        expects: "52"
        hint: >
          Weight $50$ by the chance of no glitch and $250$ by the chance of one.
        feedback: >
          $50(0.99) + 250(0.01) = 49.5 + 2.5 = 52$. In general it is
          $50 + n \cdot (2/n) = 52$ at every update: the glitch gets rarer
          exactly as fast as it gets bigger, so the average error never
          shrinks.
      - ask: >
          So, is bot B homing in on $50$?
        choices:
          - text: >
              No: its expected report is stuck at $52$.
            feedback: >
              The expectation is dragged by one rare, enormous value. At
              $n = 10\,000$ the bot reports exactly $50$ with probability
              $0.9998$. An average that a single rare glitch controls is a poor
              measure of "usually close".
          - text: >
              No: its glitches grow without bound.
            feedback: >
              They do grow, but a miss of size $n$ that happens with
              probability $2/n$ is still a miss you almost never see. Closeness
              for a random report has to say how often you miss, not how badly.
          - text: >
              Yes, in the sense that a miss of any given size becomes rare.
            correct: true
            feedback: >
              Right. Whatever size of miss you name, its probability is at most
              $2/n$, which goes to $0$.
        feedback: >
          For a random report, "close" cannot be a statement about one value or
          about the average. It has to be a statement about the probability of
          missing.

      - part: What you were checking
        reflect: >
          Bot A's error is never zero, bot B's is occasionally enormous, and
          bot C's is always exactly $1$. Say what test A and B pass and C
          fails, phrased so that it works for any tolerance someone might hand
          you.
        hint: >
          Name a tolerance first. Then look at one update at a time.
        answer: >
          Fix a tolerance $\varepsilon > 0$, look at the probability that the
          report misses $50$ by more than $\varepsilon$ at update $n$, and ask
          that this probability go to $0$ as $n$ grows, for every
          $\varepsilon$ however small. Bot A's miss probability is $0$ once
          $1/n \le \varepsilon$. Bot B's is at most $2/n$. Bot C's is $1$ at
          every update for any $\varepsilon < 1$.
      - teach: >
          That test is convergence in probability: $X_n \to c$ in probability
          when, for every fixed $\varepsilon > 0$,
          $\Pr(|X_n - c| > \varepsilon) \to 0$ as $n \to \infty$. Bots A and B
          converge in probability to $50$; bot C does not. The order is the
          content: the tolerance is named first and held fixed, and only then
          does $n$ run.
      - ask: >
          Hold bot A to $\varepsilon = 0.01$. From which update $n$ on is its
          miss probability exactly $0$?
        expects: "100"
        hint: >
          Bot A misses by $1/n$. When does $1/n > 0.01$ stop being true?
        feedback: >
          Bot A misses by $1/n$, and $1/n > 0.01$ exactly when $n < 100$. From
          $n = 100$ on the miss probability is $0$. A smaller tolerance pushes
          the threshold out, and that is fine: the definition lets $n$ depend
          on $\varepsilon$.
      - ask: >
          A colleague argues that bot C converges in probability to $50$: "take
          $\varepsilon = 2$; the miss probability is $0$ at every update."
          What is wrong?
        choices:
          - text: >
              Nothing: a tolerance exists that works.
            feedback: >
              By that standard bot C also converges to $49.5$ and to $51$, all
              at once. A test that lets you choose the tolerance to suit the
              sequence certifies nothing.
          - text: >
              He should have let $n \to \infty$ before choosing $\varepsilon$.
            feedback: >
              That order is his mistake, not the fix: he looked at the whole
              sequence and then picked a tolerance it passes. The definition
              fixes $\varepsilon$ first, any $\varepsilon$, and only then
              moves $n$.
          - text: >
              The test must pass for every $\varepsilon$, including $0.5$,
              where bot C misses with probability $1$ forever.
            correct: true
            feedback: >
              Right. "For every $\varepsilon$" is the clause he dropped, and
              $\varepsilon = 0.5$ is the tolerance that exposes bot C.
        feedback: >
          Swapping the quantifiers, so that the tolerance is chosen after the
          sequence is seen, makes every bounded sequence converge to almost
          anything.

      - part: Glitches that never stop
        ask: >
          Suppose bot B's glitches are independent from update to update. How
          many glitches do you expect between updates $1001$ and $2000$?
        expects: "1.386"
        tolerance: 0.01
        hint: >
          An expected count is a sum of probabilities, and $\sum 1/n$ over a
          block from $N$ to $2N$ is close to $\ln 2$.
        feedback: >
          $\sum_{n=1001}^{2000} 2/n \approx 2 \ln 2 \approx 1.386$. The block
          from $2001$ to $4000$ expects about the same, and so does every
          doubling after it. Glitches thin out, and they never stop.
      - ask: >
          Watched forever, bot B keeps glitching at later and later updates.
          Does it still converge in probability to $50$?
        choices:
          - text: >
              No: converging should mean the reports eventually stay near
              $50$, and bot B's never do.
            feedback: >
              "Eventually stays near" is a claim about one whole run of
              reports — a strictly stronger property, and not the test you
              wrote down. Your test grades each update on its own.
          - text: >
              Only if the glitches are dependent across updates.
            feedback: >
              Dependence never enters the test. Each update's miss probability
              is read off that update's law alone, so how the glitches relate
              to one another cannot change the verdict.
          - text: >
              Yes: the test grades one update at a time, and at each update the
              miss probability is at most $2/n$.
            correct: true
            feedback: >
              Right. Recurring rare misses are compatible with convergence in
              probability, because it never asks about a whole trajectory.
        feedback: >
          Convergence in probability is a per-$n$ statement about a shrinking
          chance. It makes no promise that a realized run of reports settles
          down.
      - ask: >
          A risk system stores not bot B's report $X_n$ but $(X_n - 40)^{2}$.
          What does that stored number converge to in probability?
        expects: "100"
        hint: >
          The map $g(x) = (x - 40)^{2}$ is continuous.
        feedback: >
          Continuous maps preserve the mode, so $g(X_n) \to g(50) = 100$ in
          probability. A glitch stores roughly $n^{2}$, which wrecks the
          expectation, but it still happens with probability only $2/n$.

      - part: The bot that passes one tolerance
        ask: >
          Bot D reports $50$ or $50.2$, with probability $1/2$ each, at every
          update. Does it converge in probability to $50$?
        choices:
          - text: >
              Yes: at $\varepsilon = 0.5$ its miss probability is $0$ at every
              update.
            feedback: >
              One generous tolerance is not the test. At $\varepsilon = 0.1$
              bot D misses with probability $1/2$ at every update, forever.
          - text: >
              Yes, to $50.1$, its average.
            feedback: >
              It never reports $50.1$. At $\varepsilon = 0.05$ it misses
              $50.1$ by $0.1$ every single time, so it converges in probability
              to no constant at all.
          - text: >
              No: at $\varepsilon = 0.1$ the miss probability sits at $1/2$
              forever.
            correct: true
            feedback: >
              Right. It passes the coarse tolerance and fails the fine one, and
              the definition demands every tolerance.
        feedback: >
          Said aloud in an interview: fix $\varepsilon$ first, then the
          probability of missing by more than $\varepsilon$ must go to zero —
          and that says nothing about a single path settling down.

  - node: quant-probability.limits.convergence-in-distribution
    hook: >
      The central limit theorem's actual conclusion is stated in this mode,
      not in probability, so knowing exactly what it does and doesn't promise
      is the difference between using it correctly and misusing it.
    explanation: >
      $X_n\to X$ in distribution compares CDFs directly: $F_n(x)\to F(x)$ at
      every point where $F$ is continuous. That caveat isn't pedantry — it
      routes around exactly the points where a discrete jump would otherwise
      make the comparison fail for no real reason. Away from those points, the
      convergence is a genuine, checkable, pointwise fact.

      This is a purely law-versus-law comparison, unlike convergence in
      probability's joint statement about $|X_n-X|$. The $X_n$ need not even
      share a probability space with $X$, and nothing about the *variables*
      getting numerically close is claimed — only that their probability
      tables line up in the limit. Two equivalent working forms show up
      constantly: $\mathbb{E}[h(X_n)]\to\mathbb{E}[h(X)]$ for bounded
      continuous $h$, and $\Pr(a<X_n\le b)\to\Pr(a<X\le b)$ at continuity
      points $a,b$.

      Whenever a problem says "for large $n$, treat $X_n$ as approximately
      $Y$," it means convergence in distribution: you may compute
      probabilities and expectations of bounded continuous functions of $X_n$
      using $Y$'s law instead, but you may not conclude anything about a
      specific realization of $X_n$ landing near a specific realization of
      $Y$.
    worked: >
      Let $X_n$ take the value $1$ with probability $1-1/n$ and the value $n$
      with probability $1/n$. For any fixed $x\ge1$, once $n>x$,
      $F_n(x)=\Pr(X_n\le x)=\Pr(X_n=1)=1-1/n\to1$, while for $x<1$,
      $F_n(x)=0$. So $F_n$ converges to the CDF of a point mass at $1$
      everywhere except at $x=1$ itself, the one discontinuity of the limit —
      exactly where the definition doesn't require convergence. At $n=100$,
      $F_{100}(50)=\Pr(X_{100}=1)=0.99$, already within $0.01$ of the limiting
      value $1$, even though $X_{100}$ still carries a genuine $1\%$ chance of
      landing at $100$.
    interview: >
      "What's the difference between convergence in probability and
      convergence in distribution" is the standard CLT follow-up — the
      interviewer wants same-space closeness versus law-only comparison
      stated precisely, plus the continuity-point caveat produced without
      prompting.
    pitfalls: >
      Checking $F_n$ at a point where the limiting $F$ jumps and concluding
      "convergence fails" misreads a definition that never required anything
      there. Treating "the laws converge" as "the variables get numerically
      close" is false in general — convergence in distribution alone gives no
      information about how $X_n$ and $X$ move together.
    recap: >
      Convergence in distribution matches CDFs pointwise wherever the limit
      is continuous — a comparison of laws alone, with no claim that the
      variables themselves ever get close.
    dialogue:
      - part: A fill price that settles on 100
        teach: >
          A broker fills its $n$th order at $X_n = 100 + Z_n/n$, where $Z_n$ is
          $+1$ or $-1$ with probability $1/2$ each. By the hundredth order the
          fill is $99.99$ or $100.01$. Write $F_n$ for the CDF of $X_n$.
      - ask: >
          What is $F_{100}(99.95)$?
        expects: "0"
        hint: >
          List the two values $X_{100}$ can take, and ask which are at most
          $99.95$.
        feedback: >
          $X_{100}$ is $99.99$ or $100.01$, and neither is at most $99.95$, so
          $F_{100}(99.95) = 0$. At any fixed point below $100$, $F_n$ is $0$
          once $1/n$ is small enough; at any fixed point above $100$ it is
          $1$.
      - ask: >
          What is $F_n(100)$, for any $n$?
        expects: "1/2"
        hint: >
          Which of the two fills is at most $100$?
        feedback: >
          Only the lower fill, $100 - 1/n$, is at most $100$, so
          $F_n(100) = 1/2$ at every $n$, forever. The obvious limit — the
          constant $100$ — has CDF $F(100) = 1$.
      - ask: >
          So does $X_n$ converge to the constant $100$, in any sensible
          meaning of "its law approaches"?
        choices:
          - text: >
              No: $F_n(100)$ sits at $1/2$ while $F(100) = 1$, so the CDFs never
              agree.
            feedback: >
              Every fill is within $1/n$ of $100$, with certainty. A comparison
              that calls that a failure is measuring the comparison, not the
              fills: at the one point $100$, an arbitrarily small shift of mass
              flips the CDF.
          - text: >
              It converges to a law with $F(100) = 1/2$.
            feedback: >
              No CDF is $0$ below $100$, $1$ above it and $1/2$ at it: a CDF is
              right-continuous, so a law with all its mass at $100$ has
              $F(100) = 1$. The limit is the constant, and the disagreement is
              at its jump.
          - text: >
              Yes, provided the comparison of CDFs skips the point $100$.
            correct: true
            feedback: >
              Right. Everywhere else $F_n(x) \to F(x)$, and $100$ is exactly
              where the limiting CDF jumps.
        feedback: >
          Pointwise convergence of CDFs is the right idea with one exception to
          carve out. The question is which points to excuse.

      - part: Which points to excuse
        reflect: >
          Say which points $x$ the comparison of $F_n$ with $F$ should be
          allowed to skip, and why exactly those and no others.
        hint: >
          What happened at $100$ that could not happen at $100.3$?
        answer: >
          Skip the points where the limiting $F$ jumps. At a jump, moving a
          lump of mass by an amount as small as you like carries it from one
          side of $x$ to the other and changes $F_n(x)$ by the whole lump, even
          though the laws are nearly identical. Where $F$ is continuous, a
          small shift of mass changes $F(x)$ only a little, so the comparison
          is honest there. A CDF has at most countably many jumps, so skipping
          them loses nothing.
      - teach: >
          That is convergence in distribution: $X_n \to X$ in distribution when
          $F_n(x) \to F(x)$ at every $x$ where $F$ is continuous. The broker's
          fills converge in distribution to $100$. An equivalent working form
          follows: $\Pr(a < X_n \le b) \to \Pr(a < X \le b)$ whenever $a$ and
          $b$ are continuity points of $F$.
      - ask: >
          A different desk posts orders that each fill, independently, with
          probability $1/n$. Let $T_n$ be the number of orders until the first
          fill, divided by $n$. At $n = 100$, what is $\Pr(T_{100} > 1)$?
        expects: "0.366"
        tolerance: 0.001
        hint: >
          $T_{100} > 1$ means the first $100$ orders all fail to fill.
        feedback: >
          $\Pr(T_{100} > 1) = (1 - 1/100)^{100} = 0.99^{100} \approx 0.366$.
      - ask: >
          As $n \to \infty$, $\Pr(T_n > t) = (1 - 1/n)^{\lfloor nt \rfloor}$.
          What law does $T_n$ converge to in distribution?
        choices:
          - text: >
              The exponential law with rate $1$.
            correct: true
            feedback: >
              Right: $(1 - 1/n)^{nt} \to e^{-t}$ at every $t > 0$, which is the
              exponential tail, and the exponential CDF has no jumps, so every
              point counts. At $t = 1$ the limit is $e^{-1} \approx 0.368$,
              already within $0.002$ of the value at $n = 100$.
          - text: >
              None: each $T_n$ is discrete and the exponential is continuous.
            feedback: >
              The broker's fills were discrete and converged to a constant.
              Convergence in distribution compares CDFs, and a staircase CDF
              can approach a smooth one at every point.
          - text: >
              The constant $0$, since each fill probability $1/n$ goes to $0$.
            feedback: >
              The count of orders grows like $n$ while you divide by $n$, so
              the rescaled time stays spread out: $\Pr(T_n > 1)$ tends to
              $0.368$, not $0$.
        feedback: >
          This is the everyday use of the mode: for large $n$, compute
          probabilities about $T_n$ from the limiting law instead.

      - part: Laws, not values
        teach: >
          Two dealers quote off the same uniform draw $U$ on $(0,1)$. Dealer P
          fills at $X = 100 + U$; dealer Q fills at $Y = 101 - U$. Set
          $X_n = Y$ for every $n$.
      - ask: >
          Does $X_n \to X$ in distribution?
        choices:
          - text: >
              No: $X_n$ and $X$ move in opposite directions.
            feedback: >
              The definition never looks at how they move together. It compares
              $F_n$ with $F$, and $101 - U$ is uniform on $(100, 101)$, exactly
              like $100 + U$.
          - text: >
              Yes: both are uniform on $(100, 101)$, so $F_n = F$ for every $n$.
            correct: true
            feedback: >
              Right. Identical laws converge trivially, whatever the variables
              do.
        feedback: >
          The mode is a statement about laws alone. The variables need not even
          live on the same probability space.
      - ask: >
          What is $\Pr(|X_n - X| > 0.5)$, at every $n$?
        expects: "1/2"
        hint: >
          $X_n - X = 1 - 2U$.
        feedback: >
          $|1 - 2U| > 0.5$ when $U < 1/4$ or $U > 3/4$, probability $1/2$, at
          every $n$. The laws agree exactly and the values never get close:
          convergence in distribution makes no claim about the variables.
      - ask: >
          Now $W_n$ equals $n^{2}$ with probability $1/n$ and $0$ otherwise, so
          $W_n \to 0$ in distribution. Can you conclude $\mathbb{E}[W_n] \to 0$?
        choices:
          - text: >
              Yes: the expectation is a feature of the law, and the laws
              converge.
            feedback: >
              The working form covers bounded continuous $h$ only.
              $\mathbb{E}[W_n] = n^{2}/n = n$, which goes to infinity: a vanishing
              sliver of mass placed far enough out controls the mean.
          - text: >
              No: $h(x) = x$ is unbounded, and $\mathbb{E}[W_n] = n$.
            correct: true
            feedback: >
              Right. $\mathbb{E}[h(W_n)] \to h(0)$ is guaranteed for bounded
              continuous $h$, such as $\min(|x|, 1)$, whose expectation is
              $1/n \to 0$.
          - text: >
              No, because $W_n$ does not converge in distribution at all.
            feedback: >
              It does: $F_n(x) = 1 - 1/n \to 1$ for every $0 \le x < n^{2}$,
              and $F_n(x) = 0$ for $x < 0$, which is the CDF of the constant
              $0$ at every point.
        feedback: >
          Said aloud: CDFs converge at continuity points of the limit, the
          statement is about laws only, and it moves expectations of bounded
          continuous functions — nothing more.

  - node: quant-probability.limits.almost-sure-convergence
    hook: >
      "With probability $1$" sounds stronger than it's worth unless you can
      say exactly what extra thing it buys over convergence in probability —
      a whole trajectory settling, not just each $n$ taken alone.
    explanation: >
      Convergence in probability assigns a probability to an event indexed by
      one $n$ at a time: $|X_n-X|>\varepsilon$. Almost sure convergence
      assigns a probability to an event about the *entire* infinite sequence
      at once — "does the numerical sequence $X_1,X_2,\dots$ converge to $X$"
      is itself one event, and the claim is that this event has probability
      $1$.

      The equivalent tail form makes the extra strength visible: for every
      $\varepsilon>0$, $\Pr(|X_m-X|>\varepsilon\text{ for some }m\ge n)\to0$
      as $n\to\infty$. This looks like the same condition as convergence in
      probability, but "for some $m\ge n$" sweeps the whole tail of the
      sequence into a single probability instead of checking each $m$ in
      isolation — that sweep is the entire technical difference.

      The mental model: convergence in probability samples a snapshot at each
      $n$ and asks the snapshot to be trustworthy; almost sure convergence
      watches the whole infinite run and asks it, with probability $1$, to
      eventually get trapped near the target and stay there.
    worked: >
      Let $U$ be uniform on $(0,1)$ and set $X_n=U^n$. For every outcome with
      $U<1$ — probability $1$, since $\Pr(U=1)=0$ — the real-number sequence
      $U^n\to0$ as $n\to\infty$, deterministically, for that single outcome.
      So $\Pr(\lim_n X_n=0)=1$: $X_n\to0$ almost surely. Concretely, at
      $U=0.5$, $X_{10}=0.5^{10}\approx0.000977$ — the trajectory is literally
      shrinking to $0$ for that outcome, not merely likely to be small at each
      $n$ checked separately.
    interview: >
      "What extra does 'almost surely' give you over 'in probability'"
      listens for: probability assigned to a property of the whole path, not
      a per-$n$ snapshot. A strong answer produces the tail-event
      reformulation on request.
    pitfalls: >
      Treating "almost surely" as a synonym for "very likely at large $n$"
      collapses it back into convergence in probability and misses the
      whole-trajectory content. "Probability $1$" still permits a genuine
      exceptional set — just one carrying no probability mass, not literally
      "every outcome."
    recap: >
      Almost sure convergence assigns probability $1$ to the event that the
      entire sequence $X_1,X_2,\dots$ converges, strictly more than
      convergence in probability's per-$n$ guarantee.
    dialogue:
      - part: Two sequences that both pass
        teach: >
          Strategy S is switched off for good after its first losing day, and
          each day, independently, it loses with probability $0.2$. Write
          $L_n = 1$ if S is still live after day $n$, and $0$ otherwise.
          Separately, a monitoring script raises a false alarm on day $n \ge 2$
          with probability $1/n$, independently across days; $G_n = 1$ on an
          alarm day.
      - ask: >
          What is $\Pr(L_{10} = 1)$?
        expects: "0.1074"
        tolerance: 0.0005
        hint: >
          Live after day $10$ means ten winning days in a row.
        feedback: >
          $0.8^{10} \approx 0.1074$. As $n$ grows, $\Pr(L_n = 1) = 0.8^{n} \to 0$.
      - ask: >
          And $\Pr(G_{10} = 1)$?
        expects: "0.1"
        feedback: >
          $1/10$. This also goes to $0$, more slowly. For any tolerance below
          $1$, both $L_n$ and $G_n$ miss $0$ with probability tending to $0$:
          both converge in probability to $0$.
      - ask: >
          What is the probability that S is live after *some* day $m \ge 10$?
        expects: "0.1074"
        tolerance: 0.0005
        hint: >
          Once S is switched off, can it be live again?
        feedback: >
          S is live after some day $m \ge 10$ exactly when it is live after day
          $10$, since a switched-off strategy stays off. So the answer is again
          $0.8^{10} \approx 0.1074$, and it goes to $0$ as the starting day
          grows.

      - part: Watching the whole run
        ask: >
          What is the probability that the script raises no alarm on any of
          days $10$ through $100$?
        expects: "0.09"
        hint: >
          Multiply $(1 - 1/n) = (n-1)/n$ over the days; the product
          telescopes.
        feedback: >
          $\tfrac{9}{10} \cdot \tfrac{10}{11} \cdots \tfrac{99}{100} = 9/100 = 0.09$.
          So an alarm somewhere in that stretch has probability $0.91$.
      - ask: >
          What is the probability that the script raises at least one alarm on
          some day $m \ge 10$, the run continuing forever?
        expects: "1"
        hint: >
          Through day $M$ the quiet probability is $9/M$. Let $M$ grow.
        feedback: >
          No alarm on days $10$ through $M$ has probability $9/M \to 0$, so an
          alarm after day $10$ is certain. The same holds after day $1000$, or
          any day: alarms never stop arriving.
      - ask: >
          Which sequence's path settles at $0$ and stays there?
        choices:
          - text: >
              Both: each converges in probability to $0$.
            feedback: >
              Convergence in probability grades one day at a time. The script
              passes that test and still, with probability $1$, raises alarms
              after any day you name — its path is never eventually $0$.
          - text: >
              Neither: there is always some chance of a $1$.
            feedback: >
              For S that chance belongs to one fixed set of outcomes: the run
              of all winning days, probability $\lim 0.8^{n} = 0$. On every
              other outcome S is switched off on some day and $L_n = 0$ from
              then on.
          - text: >
              Only $L_n$: S is switched off eventually, and stays off.
            correct: true
            feedback: >
              Right. The chance of a $1$ at some day $m \ge n$ goes to $0$ for
              S and is stuck at $1$ for the script.
        feedback: >
          The difference shows only when you ask about the whole run, not about
          one day.
      - reflect: >
          Both sequences pass the per-day test. Name the event about the whole
          run that separates them, and the probability you would demand of it.
        hint: >
          You computed a probability that sweeps in every day $m \ge n$ at
          once.
        answer: >
          The event is "the numerical sequence $X_1, X_2, \dots$ converges to
          $0$", a property of the entire path, and the demand is that it have
          probability $1$. An equivalent form is the one you computed: the
          probability of a miss at *some* $m \ge n$ must go to $0$ as $n$
          grows. For S it does, $0.8^{n}$; for the script it is $1$ at every
          $n$.
      - teach: >
          That is almost sure convergence: $X_n \to X$ almost surely when
          $\Pr(\lim_{n} X_n = X) = 1$. Equivalently, for every
          $\varepsilon > 0$, $\Pr(|X_m - X| > \varepsilon \text{ for some } m \ge n) \to 0$.
          It is the per-$n$ condition of convergence in probability with the
          whole tail swept inside one probability, which is why it is the
          stronger of the two. $L_n \to 0$ almost surely; $G_n$ does not.

      - part: What probability one allows
        ask: >
          Is there any single outcome on which $L_n$ fails to converge to $0$?
        choices:
          - text: >
              No: almost sure convergence means every outcome converges.
            feedback: >
              Almost surely means outside a set of probability zero. The run
              in which S wins every day is a genuine outcome, and on it
              $L_n = 1$ forever.
          - text: >
              Yes: the run where S wins every day, which has probability $0$.
            correct: true
            feedback: >
              Right. Its probability is $\lim 0.8^{n} = 0$, so it is excused.
              "Almost surely" permits an exceptional set, provided it carries no
              probability.
          - text: >
              Yes, and so $L_n$ does not converge almost surely.
            feedback: >
              The definition asks for probability $1$, not for every outcome.
              One exceptional run of probability $0$ does not break it.
        feedback: >
          Probability $1$ is not "every outcome". The exceptions are there; they
          just weigh nothing.
      - ask: >
          A second script alarms on day $n$ with probability $1/n^{2}$,
          independently. Using $\sum_{m \ge n} 1/m^{2} < 1/(n-1)$, does its
          alarm indicator converge to $0$ almost surely?
        choices:
          - text: >
              No: like the first script, it can alarm on any day.
            feedback: >
              Any single day can alarm, but that is not the test. The chance of
              an alarm on some day $m \ge n$ is at most
              $\sum_{m \ge n} 1/m^{2} < 1/(n-1)$, which goes to $0$.
          - text: >
              Yes: an alarm on some day $m \ge n$ has probability below
              $1/(n-1)$, which goes to $0$.
            correct: true
            feedback: >
              Right. The probability of a union is at most the sum, and here
              the sum of the tail shrinks. From day $101$ on, an alarm ever
              again has probability under $0.01$.
          - text: >
              Only if the alarms are dependent.
            feedback: >
              The bound used only that the probability of a union is at most
              the sum, which needs no assumption about dependence at all.
        feedback: >
          With alarm chances $1/n$ the tail never thins out; with $1/n^{2}$ it
          does. Said aloud: almost sure convergence puts probability one on
          the whole path converging, and you check it by sweeping the tail
          into a single probability.

  - node: quant-probability.limits.convergence-hierarchy
    hook: >
      Interviewers love asking you to rank the three modes and then produce a
      counterexample on the spot for each failed converse — the ranking alone
      doesn't survive that follow-up.
    explanation: >
      Almost sure convergence controls the whole trajectory at once, so it's
      the strongest; convergence in probability controls only one $n$ at a
      time, weaker; convergence in distribution only compares laws, without
      even requiring the variables to share a probability space, so it's the
      weakest of the three — and each implication is strict.

      The probability-but-not-almost-sure gap happens when a rare miss keeps
      recurring at ever-changing locations: each individual miss shrinks in
      probability, but the tail event "some miss occurs eventually" never
      drops to zero. The distribution-but-not-probability gap happens because
      a purely marginal comparison is blind to joint behavior — two variables
      can share a law while moving in lockstep, in perfect opposition, or
      anything in between, and convergence in distribution can't tell those
      apart.

      One partial converse is worth memorizing: convergence in distribution
      to a *constant* already forces convergence in probability to it. A
      constant target has no spread for the laws to disagree about, so once
      the laws match a fixed number, the mass really is concentrating near
      that single point — there's no room left for a distributional-only gap.
    worked: >
      Let $X$ be Bernoulli($1/2$) and set $X_n=1-X$ for every $n$. Since
      Bernoulli($1/2$) is its own complement, $X_n\sim X$ for every $n$, so
      $X_n\to X$ in distribution trivially. But $X$ and $X_n$ only take
      values in $\{0,1\}$ with $X_n=1-X$ always, so $|X_n-X|=|1-2X|=1$
      exactly, every time. Hence $\Pr(|X_n-X|>0.5)=1$ for every $n$ — it
      never shrinks, so there is no convergence in probability at all,
      despite the identical marginal laws.
    interview: >
      "Rank the three modes of convergence" plus "give an example where
      $X_n\to X$ in distribution but not in probability" is the standard
      pairing — produce a fresh example live (a complementary coin works) and
      name which converse the constant-limit exception rescues.
    pitfalls: >
      Assuming any distributional counterexample also breaks convergence to a
      constant — it doesn't; the exception applies precisely when the target
      has no spread. Citing the textbook counterexamples by name only,
      without being able to verify the probability that actually fails,
      doesn't survive a follow-up.
    recap: >
      Almost sure implies in probability implies in distribution, each
      strict, except that convergence in distribution to a constant already
      forces convergence in probability to it.
    dialogue:
      - part: A sweeping spotlight
        teach: >
          Draw $U$ uniform on $(0,1)$ once. In round $k = 1, 2, 3, \dots$, cut
          $(0,1)$ into $2^{k}$ equal pieces and light them one at a time, left
          to right, one piece per step. Let $X_n = 1$ if $U$ lies in the piece
          lit at step $n$, and $0$ otherwise. Round $1$ takes $2$ steps, round
          $2$ takes $4$, and so on.
      - ask: >
          At a step in round $6$, what is $\Pr(X_n = 1)$?
        expects: "1/64"
        hint: >
          The lit piece has length $2^{-6}$.
        feedback: >
          The lit piece has length $1/64$, so $\Pr(X_n = 1) = 1/64 \approx 0.0156$.
          In round $k$ it is $2^{-k}$, which goes to $0$.
      - ask: >
          Fix one value of $U$, not an endpoint of any piece. In each round, at
          how many steps does $X_n = 1$?
        expects: "1"
        hint: >
          The pieces of one round cover $(0,1)$ without overlap.
        feedback: >
          Exactly one: each round's pieces tile $(0,1)$, so the spotlight hits
          $U$ once per round, forever.
      - ask: >
          Which modes of convergence to $0$ does $X_n$ have?
        choices:
          - text: >
              Almost surely, since $\Pr(X_n = 1) \to 0$.
            feedback: >
              That is the per-step probability, which is the test for
              convergence in probability. Almost surely asks about each path,
              and every path has $X_n = 1$ once per round: no path converges.
          - text: >
              In probability, but not almost surely.
            correct: true
            feedback: >
              Right. Each step misses with probability $2^{-k} \to 0$, while
              every single path keeps returning to $1$.
          - text: >
              Neither: a sequence that is $1$ infinitely often cannot converge.
            feedback: >
              It cannot converge path by path, but convergence in probability
              never looks at a path. It grades each $n$ alone, and there the
              miss probability vanishes.
        feedback: >
          So convergence in probability does not imply almost sure convergence.
          The question is whether the arrows run the other way.

      - part: Why the arrows point down
        ask: >
          Suppose $X_n \to X$ almost surely. Which inequality hands you
          convergence in probability at once?
        choices:
          - text: >
              $\Pr(|X_n - X| > \varepsilon) \le \Pr(|X_m - X| > \varepsilon \text{ for some } m \ge n)$
            correct: true
            feedback: >
              Right. A miss at step $n$ is a miss at some $m \ge n$, and the
              right side goes to $0$ by the tail form of almost sure
              convergence.
          - text: >
              $\Pr(|X_n - X| > \varepsilon) \le \mathbb{E}|X_n - X|/\varepsilon$
            feedback: >
              Markov's inequality is true, but almost sure convergence says
              nothing about $\mathbb{E}|X_n - X|$, which can stay large or be
              infinite while the path converges.
          - text: >
              $\Pr(\lim_n X_n = X) \le \Pr(|X_n - X| \le \varepsilon)$
            feedback: >
              This fails for every fixed $n$: the path can converge and still be
              far from $X$ at step $n$. The link has to go through the whole
              tail beyond $n$, not one step.
        feedback: >
          The strong mode sweeps the tail into one probability; dropping all
          but one term of the tail gives the weak mode.
      - reflect: >
          Now suppose $X_n \to X$ in probability. If $X_n$ is within
          $\varepsilon$ of $X$ except on an event of small probability, how can
          you bound $F_n(x) = \Pr(X_n \le x)$ above using the CDF $F$ of $X$?
        hint: >
          If $X_n \le x$ and the two are within $\varepsilon$, where is $X$?
        answer: >
          Either $|X_n - X| > \varepsilon$, or $X \le x + \varepsilon$, so
          $F_n(x) \le F(x + \varepsilon) + \Pr(|X_n - X| > \varepsilon)$. The
          same argument the other way gives
          $F_n(x) \ge F(x - \varepsilon) - \Pr(|X_n - X| > \varepsilon)$. Let
          $n \to \infty$, then shrink $\varepsilon$: at a continuity point of
          $F$ both bounds close in on $F(x)$.
      - teach: >
          Together: almost sure convergence implies convergence in
          probability, which implies convergence in distribution. The
          spotlight shows the first arrow cannot be reversed. The second
          cannot either, and the reason is already in the definitions:
          convergence in distribution compares laws, and two variables can
          share a law while having nothing to do with each other.

      - part: Where the converse fails
        ask: >
          Let $X$ be uniform on $(-1, 1)$ and set $X_n = -X$ for every $n$. What
          is $\Pr(|X_n - X| > 1)$?
        expects: "1/2"
        hint: >
          $|X_n - X| = 2|X|$.
        feedback: >
          $2|X| > 1$ means $|X| > 1/2$, which has probability $1/2$, at every
          $n$. The miss probability never shrinks.
      - ask: >
          Does $X_n \to X$ in distribution?
        choices:
          - text: >
              No: it does not even converge in probability.
            feedback: >
              That is the arrow being run backwards. Failing the stronger mode
              says nothing about the weaker one.
          - text: >
              Yes: $-X$ is uniform on $(-1, 1)$, so $F_n = F$ for every $n$.
            correct: true
            feedback: >
              Right. The laws are identical, and the variables are as far apart
              as a symmetric law allows.
        feedback: >
          In distribution, but not in probability: the second arrow does not
          reverse.
      - ask: >
          Now the target is a constant. All you know is $F_n(4.9) = 0.02$ and
          $F_n(5.1) = 0.97$. Bound $\Pr(|X_n - 5| > 0.1)$ from above.
        expects: "0.05"
        hint: >
          Missing $5$ by more than $0.1$ means landing below $4.9$ or above
          $5.1$.
        feedback: >
          $\Pr(X_n < 4.9) + \Pr(X_n > 5.1) \le F_n(4.9) + (1 - F_n(5.1)) = 0.02 + 0.03 = 0.05$.
          The CDF alone bounds the miss probability.
      - ask: >
          Why does that bound need the target to be a constant?
        choices:
          - text: >
              Because constants are continuous.
            feedback: >
              The limiting CDF of a constant is a step, not continuous. The
              step is at $c$, and the bound only evaluates $F_n$ at $c \pm \varepsilon$,
              where the limit is $0$ and $1$.
          - text: >
              Because a miss from a constant is an event about $X_n$ alone,
              which its CDF can see.
            correct: true
            feedback: >
              Right. $|X_n - c| > \varepsilon$ involves only $X_n$. A miss from
              a random $X$ involves both variables jointly, which no pair of
              CDFs records. So distribution to a constant does force
              probability to that constant.
          - text: >
              It does not: the same bound works for any limit $X$.
            feedback: >
              The uniform example refutes it: identical CDFs, and still a miss
              by more than $1$ half the time.
        feedback: >
          This partial converse is why the weak law may be stated in either
          mode: its limit is the constant $\mu$.
      - ask: >
          Which of these can actually happen?
        choices:
          - text: >
              $X_n \to X$ almost surely, but not in distribution.
            feedback: >
              Impossible: almost surely gives in probability, which gives in
              distribution.
          - text: >
              $X_n \to 3$ in distribution, but not in probability to $3$.
            feedback: >
              Impossible: you just proved that distribution to a constant
              forces probability to it.
          - text: >
              $X_n \to N(0,1)$ in distribution, and in probability to nothing.
            correct: true
            feedback: >
              Right: take the $X_n$ iid standard normal. The law never changes,
              but $X_n - X_{n+1}$ has variance $2$ forever, so no single
              variable is approached.
        feedback: >
          Said aloud: almost surely beats in probability beats in
          distribution, both arrows strict, with a counterexample for each,
          and one exception — distribution to a constant.

  - node: quant-probability.limits.sample-mean-moments
    hook: >
      "How much does averaging $n$ measurements help" reduces to two lines
      you should produce without derivation — mean stays put, variance
      divides by $n$ — and misremembering which one shrinks costs the whole
      problem.
    explanation: >
      Linearity gives $\mathbb{E}[\bar{X}_n]=\mu$ immediately, exactly, for
      every $n$ — no large-$n$ needed. The real content is the variance: the
      general variance-of-a-sum formula has cross-covariance terms, and
      independence (in fact, merely pairwise uncorrelated already suffices)
      kills every one of them, leaving $\operatorname{Var}(S_n)=n\sigma^{2}$
      — the variances simply add, with no help from the number of terms.

      Dividing by $n$ to form the average is what buys the shrinkage:
      $\operatorname{Var}(\bar{X}_n)=\operatorname{Var}(S_n)/n^{2}=
      \sigma^{2}/n$. The standard error, the number you'd actually quote, is
      $\sigma/\sqrt{n}$ — the single most reused expression in this unit,
      saying every doubling of precision costs a quadrupling of data.

      Keep the two directions straight: the total $S_n$ spreads out as data
      accumulates ($\sqrt{n}$ growth), while the average tightens ($1/\sqrt{n}$
      shrinkage) — same underlying per-term variance, opposite consequence,
      because one divides by $n$ and the other doesn't.
    worked: >
      Let $X_i$ be iid Bernoulli($0.2$), so $\mu=0.2$,
      $\sigma^{2}=0.2\times0.8=0.16$. For $n=64$:
      $\mathbb{E}[\bar{X}_{64}]=0.2$ exactly, and
      $\operatorname{Var}(\bar{X}_{64})=0.16/64=0.0025$, so the standard
      error is $\sqrt{0.0025}=0.05$. The total $S_{64}$ has mean
      $64\times0.2=12.8$ and standard deviation $\sqrt{64\times0.16}=
      \sqrt{10.24}=3.2$.
    interview: >
      "If I average $n$ iid measurements, how does the variance behave" is
      asked constantly, sometimes as "how many trades to halve my
      estimation error" — answer with $\sigma^{2}/n$ and $\sigma/\sqrt{n}$
      cold, and note that independence is only used to zero the
      covariance terms.
    pitfalls: >
      Quoting $\operatorname{Var}(\bar{X}_n)=\sigma^{2}$ — forgetting the
      division by $n^{2}$, not just $n$, when passing from the sum's
      variance to the average's — is the most common slip. Claiming full
      independence is required overstates the hypothesis; pairwise
      uncorrelated already zeroes every cross term.
    recap: >
      The sample mean is unbiased for every $n$ and has variance exactly
      $\sigma^{2}/n$, so precision buys itself back only at rate
      $1/\sqrt{n}$.
    dialogue:
      - part: Twenty-five pings
        teach: >
          One ping to an exchange has a latency with mean $4$ milliseconds and
          standard deviation $2$ milliseconds, independently from ping to ping.
          You send $25$ pings and record the latencies $X_1, \dots, X_{25}$.
      - ask: >
          What is the standard deviation, in milliseconds, of the total latency
          $S_{25} = X_1 + \dots + X_{25}$?
        expects: "10"
        hint: >
          For independent summands, variances add. Standard deviations do not.
        feedback: >
          $\operatorname{Var}(S_{25}) = 25 \cdot 2^{2} = 100$, so the standard
          deviation is $10$. Adding standard deviations would give $50$, which
          is what you would get if all $25$ pings were the same ping.
      - ask: >
          Now the average $\bar{X}_{25} = S_{25}/25$. What is its standard
          deviation?
        expects: "0.4"
        hint: >
          Dividing a variable by $25$ divides its variance by $25^{2}$.
        feedback: >
          $\operatorname{Var}(\bar{X}_{25}) = 100/625 = 0.16$, so the standard
          deviation is $0.4$, one fifth of a single ping's $2$.
      - ask: >
          A colleague says averaging $25$ pings should cut the spread by a
          factor of $25$. Who is right, and why?
        choices:
          - text: >
              The colleague: an average of $25$ things is $25$ times more
              precise.
            feedback: >
              That would be $2/25 = 0.08$. It forgets that the total's spread
              grows as you add pings: dividing by $25$ undoes a total whose
              standard deviation is already $5$ times one ping's, not $1$ times.
          - text: >
              Neither: averaging cannot reduce the spread, since each ping
              still has standard deviation $2$.
            feedback: >
              Each ping does, but the errors partly cancel in the sum: the
              total's standard deviation is $10$, not $50$. Dividing by $25$
              then gives $0.4$.
          - text: >
              The factor is $5 = \sqrt{25}$: the total spreads by $\sqrt{25}$
              and the average divides by $25$.
            correct: true
            feedback: >
              Right. $25$ in the denominator against $\sqrt{25}$ of growth in
              the total leaves a net factor of $\sqrt{25}$.
        feedback: >
          The total and the average move in opposite directions, and the
          square root comes from variances adding while standard deviations do
          not.

      - part: Where independence was spent
        reflect: >
          Suppose instead that the $25$ recorded pings were all the same ping,
          copied. What would the average's standard deviation be, and what
          exactly did independence do in your computation that the copies
          cannot?
        hint: >
          Write out $\operatorname{Var}(X_1 + \dots + X_{25})$ in full.
        answer: >
          With copies, $\bar{X}_{25} = X_1$, so its standard deviation is still
          $2$: no gain at all. In general
          $\operatorname{Var}(S_n) = \sum_i \operatorname{Var}(X_i) + \sum_{i \ne j} \operatorname{Cov}(X_i, X_j)$.
          Independence only kills the covariance terms, which is why it is
          enough for the $X_i$ to be pairwise uncorrelated. Copies make every
          covariance equal to $\sigma^{2}$ and the variance becomes
          $n^{2}\sigma^{2}$ instead of $n\sigma^{2}$.
      - teach: >
          So for $X_1, \dots, X_n$ pairwise uncorrelated with mean $\mu$ and
          variance $\sigma^{2}$: $\mathbb{E}[\bar{X}_n] = \mu$ exactly, by
          linearity, and $\operatorname{Var}(\bar{X}_n) = \sigma^{2}/n$. The
          standard error of the mean is $\sigma/\sqrt{n}$. The total goes the
          other way: $\mathbb{E}[S_n] = n\mu$ and standard deviation
          $\sigma\sqrt{n}$.
      - ask: >
          Pairwise uncorrelated really is enough. Let $X_1$ and $X_2$ be
          independent, each $+1$ or $-1$ with probability $1/2$, and
          $X_3 = X_1X_2$. Each pair is uncorrelated, though $X_3$ is a function
          of the other two. What is $\operatorname{Var}(X_1 + X_2 + X_3)$?
        expects: "3"
        hint: >
          Each $X_i$ has variance $1$. Check one covariance, say
          $\mathbb{E}[X_1X_3] = \mathbb{E}[X_1^{2}X_2]$.
        feedback: >
          $\mathbb{E}[X_1X_3] = \mathbb{E}[X_2] = 0$, and likewise for the
          other pairs, so every covariance vanishes and the variance is
          $1 + 1 + 1 = 3$. The three are far from independent, and the formula
          does not notice.
      - ask: >
          Back to the link. You send $400$ pings. What is the standard
          deviation of the total latency, in milliseconds?
        expects: "40"
        hint: >
          $\sigma\sqrt{n}$.
        feedback: >
          $2\sqrt{400} = 40$. The average's standard deviation is
          $2/\sqrt{400} = 0.1$. Sixteen times the pings: the total is four
          times as uncertain, the average four times as precise.
      - ask: >
          With just $3$ pings, is $\mathbb{E}[\bar{X}_3]$ equal to $4$, or only
          close to it?
        choices:
          - text: >
              Only close: the sample mean is unbiased in the limit.
            feedback: >
              Linearity needs no limit:
              $\mathbb{E}[\bar{X}_3] = (4 + 4 + 4)/3 = 4$ exactly. Large $n$
              shrinks the spread, not the bias, which is zero from the start.
          - text: >
              Exactly $4$, by linearity, at every $n$.
            correct: true
            feedback: >
              Right, and this needs neither independence nor finite variance,
              only that each ping has mean $4$.
        feedback: >
          The mean is exact at every $n$; only the variance depends on $n$.

      - part: When the pings are correlated
        ask: >
          Suppose network congestion gives every pair of pings correlation
          $0.1$. Using $\operatorname{Var}(\bar{X}_n) = \sigma^{2}/n + \tfrac{n-1}{n}\rho\sigma^{2}$,
          what is the variance of the average of $25$ pings?
        expects: "0.544"
        hint: >
          $\sigma^{2} = 4$ and $\rho = 0.1$.
        feedback: >
          $4/25 + (24/25)(0.1)(4) = 0.16 + 0.384 = 0.544$, more than three
          times the uncorrelated $0.16$. Standard deviation $0.74$ instead of
          $0.4$.
      - ask: >
          Under that correlation, what happens to $\operatorname{Var}(\bar{X}_n)$
          as you send more and more pings?
        choices:
          - text: >
              It still goes to $0$, only more slowly.
            feedback: >
              The first term goes to $0$, but the second tends to
              $\rho\sigma^{2} = 0.4$. No number of pings gets the variance below
              that floor.
          - text: >
              It levels off at $\rho\sigma^{2} = 0.4$.
            correct: true
            feedback: >
              Right. The shared congestion is in every ping, and averaging
              cannot remove what every term has in common.
          - text: >
              It grows, since each new ping adds covariance terms.
            feedback: >
              The covariance terms grow like $n^{2}$, but the average divides
              by $n^{2}$, so their share settles at $\rho\sigma^{2}$ rather than
              growing.
        feedback: >
          Said aloud: the sample mean is unbiased with variance $\sigma^{2}/n$,
          standard error $\sigma/\sqrt{n}$, and the only use of independence is
          to zero the covariances — correlated errors put a floor under it.

  - node: quant-probability.limits.wlln
    hook: >
      This is the theorem "why does averaging work" reduces to, and the
      interview wants the one-line Chebyshev proof produced live, since that
      proof also tells you exactly how bad the resulting bound is.
    explanation: >
      A shrinking variance around a fixed mean is exactly the raw material
      Chebyshev's inequality wants. The sample mean's variance,
      $\sigma^{2}/n$, already tends to $0$ — feed that into Chebyshev and
      reading off the definition of convergence in probability is the entire
      proof.

      Apply Chebyshev to $\bar{X}_n$ around its mean $\mu$ with variance
      $\sigma^{2}/n$: $\Pr(|\bar{X}_n-\mu|\ge\varepsilon)\le
      \operatorname{Var}(\bar{X}_n)/\varepsilon^{2}=\sigma^{2}/
      (n\varepsilon^{2})$. As $n\to\infty$ with $\varepsilon$ fixed, the
      right side tends to $0$ — exactly the statement $\bar{X}_n\to\mu$ in
      probability.

      Be honest about the bound: finite variance is an artifact of using
      Chebyshev specifically — Khinchin's version needs only
      $\mathbb{E}|X_1|<\infty$, via a different argument — and the Chebyshev
      bound itself is deliberately crude, vacuous for small $n$ even though
      the true probability is already small.
    worked: >
      Let $\sigma^{2}=4$ and $\varepsilon=0.2$. Chebyshev gives
      $\Pr(|\bar{X}_n-\mu|\ge0.2)\le4/(n\times0.04)=100/n$. Pushing this bound
      itself below $0.05$ needs $n\ge2000$ — a large sample just to make
      Chebyshev's guarantee non-vacuous, even though the true probability at
      such $n$ is already far smaller in practice.
    interview: >
      "Prove the weak law of large numbers" is a stock question, answered by
      the two-line Chebyshev computation above, cold. A common follow-up,
      "is this bound tight," has the honest answer: no, it's known to be
      loose here.
    pitfalls: >
      Stating the law without the finite-variance hypothesis silently
      borrows Khinchin's weaker-hypothesis result, which needs a different
      proof entirely. Treating the Chebyshev bound as an accurate
      probability, rather than a crude worst-case cap, overstates what the
      arithmetic actually shows.
    recap: >
      Chebyshev applied to the sample mean's shrinking variance is the whole
      proof that $\bar{X}_n\to\mu$ in probability, and it happens to be a
      very loose bound.
    dialogue:
      - part: A guarantee with no shape
        teach: >
          A market-making desk earns, per trade, a P&L with mean $0.3$ ticks and
          standard deviation $3$ ticks, independently from trade to trade. You
          know nothing else about its law. The head of desk wants to know how
          reliably the average P&L over many trades reveals the $0.3$.
      - ask: >
          After $900$ trades, what is the standard deviation of the average
          P&L, in ticks?
        expects: "0.1"
        hint: >
          The standard error is $\sigma/\sqrt{n}$.
        feedback: >
          $3/\sqrt{900} = 0.1$, so the average's variance is $0.01$.
      - ask: >
          Knowing only that mean and variance, give the best upper bound you
          can on $\Pr(|\bar{X}_{900} - 0.3| \ge 0.2)$.
        expects: "0.25"
        hint: >
          Which inequality bounds a deviation probability using nothing but a
          variance?
        feedback: >
          Chebyshev: $\Pr(|\bar{X}_{900} - 0.3| \ge 0.2) \le 0.01/0.2^{2} = 0.25$.
          No shape was needed, only the variance of the average.
      - ask: >
          Keep the tolerance at $0.2$ and let the number of trades grow. What
          does that Chebyshev bound do?
        choices:
          - text: >
              It levels off, because each trade still has standard deviation
              $3$.
            feedback: >
              The bound uses the variance of the average, $9/n$, not of one
              trade. It reads $9/(0.04n) = 225/n$, which keeps falling.
          - text: >
              It shrinks like $1/\sqrt{n}$, like the standard error.
            feedback: >
              The bound divides a variance by $\varepsilon^{2}$, and variance
              falls like $1/n$: the bound is $225/n$, not $225/\sqrt{n}$.
          - text: >
              It falls like $225/n$, so it goes to $0$.
            correct: true
            feedback: >
              Right. At $n = 900$ it is $0.25$; at $n = 9000$ it is $0.025$.
        feedback: >
          A bound that tends to $0$ for a fixed tolerance is exactly what
          convergence in probability asks for.

      - part: What the argument used
        reflect: >
          You never used the shape of the P&L law. Say which properties of the
          trades your argument did use, and so for which sequences of iid
          draws it proves that the average converges in probability to the
          mean.
        hint: >
          Trace each number in $9/(0.04n)$ back to an assumption.
        answer: >
          Two things: that the average has variance $\sigma^{2}/n$, which needs
          the draws uncorrelated and $\sigma^{2}$ finite, and Chebyshev, which
          turns that variance into
          $\Pr(|\bar{X}_n - \mu| \ge \varepsilon) \le \sigma^{2}/(n\varepsilon^{2})$.
          For any fixed $\varepsilon$ the right side goes to $0$. So the
          argument proves convergence in probability for every iid sequence
          with finite variance, whatever its shape.
      - teach: >
          That is the weak law of large numbers: if $X_1, X_2, \dots$ are iid
          with mean $\mu$ and finite variance $\sigma^{2}$, then
          $\bar{X}_n \to \mu$ in probability, and Chebyshev on $\bar{X}_n$ is
          the whole proof. Finite variance belongs to this proof, not to the
          truth: Khinchin's version needs only $\mathbb{E}|X_1| < \infty$, by a
          different argument.
      - ask: >
          Where in the proof is independence consumed?
        choices:
          - text: >
              In Chebyshev's inequality.
            feedback: >
              Chebyshev applies to any single variable with finite variance;
              it knows nothing about how $\bar{X}_n$ was built.
          - text: >
              In $\mathbb{E}[\bar{X}_n] = \mu$.
            feedback: >
              Linearity of expectation needs no independence at all.
          - text: >
              In $\operatorname{Var}(\bar{X}_n) = \sigma^{2}/n$, where the
              covariances must vanish.
            correct: true
            feedback: >
              Right, and only there, so pairwise uncorrelated draws already
              satisfy the weak law by this proof.
        feedback: >
          The proof has two lines, and independence lives in the first.
      - ask: >
          Back on the desk. How many trades does Chebyshev need before it
          guarantees $\Pr(|\bar{X}_n - 0.3| \ge 0.1) \le 0.05$?
        expects: "18000"
        hint: >
          Set $\sigma^{2}/(n\varepsilon^{2}) = 0.05$ with $\sigma^{2} = 9$ and
          $\varepsilon = 0.1$.
        feedback: >
          $9/(0.01n) = 900/n \le 0.05$ gives $n \ge 18\,000$. That is the price
          of a guarantee that holds for every law with this mean and variance.

      - part: How crude, and where it fails
        ask: >
          For a fair coin tossed $100$ times, Chebyshev bounds the chance that
          the fraction of heads misses $1/2$ by at least $0.1$ by $0.25$. The
          exact binomial probability is about $0.057$. What does the gap tell
          you?
        choices:
          - text: >
              Chebyshev is miscalculated here; a correct bound would be tight.
            feedback: >
              $0.25/(100 \cdot 0.01) = 0.25$ is right. Chebyshev is tight only
              for one specially built three-point law; for a coin it is loose.
          - text: >
              The weak law is weaker for coins than for other laws.
            feedback: >
              The law holds for the coin exactly as for anything else. What is
              weak is the bound used to prove it, not the convergence.
          - text: >
              The bound proves convergence but misprices the probability by
              a factor of about $4$.
            correct: true
            feedback: >
              Right. Chebyshev is the proof, not the price. To quote the actual
              probability you need the shape of the average's law, which is a
              separate result.
        feedback: >
          In an interview, the Chebyshev line proves the law; it is never the
          number you quote.
      - ask: >
          A different desk's P&L has finite mean but infinite variance. What
          happens to its running average?
        choices:
          - text: >
              It still converges in probability to the mean, though this proof
              no longer runs.
            correct: true
            feedback: >
              Right: Khinchin's weak law needs only a finite mean. The
              Chebyshev proof fails because $\sigma^{2}/(n\varepsilon^{2})$ is
              infinite, not because the conclusion does.
          - text: >
              It cannot converge: without a variance the average has no
              spread to shrink.
            feedback: >
              Infinite variance does not stop the average from concentrating;
              it stops Chebyshev from measuring the concentration. A finite mean
              is the real requirement.
          - text: >
              It converges, and the Chebyshev bound still applies with
              $\sigma^{2} = \infty$.
            feedback: >
              A bound of $\infty/(n\varepsilon^{2})$ says nothing at any $n$.
              The conclusion survives; this proof of it does not.
        feedback: >
          Separate the theorem from its proof: finite variance is the price of
          the one-line proof.
      - ask: >
          Suppose instead the desk's trades are perfectly correlated: every
          trade's P&L equals the first one's. Does $\bar{X}_n \to 0.3$ in
          probability?
        choices:
          - text: >
              Yes: the mean and variance per trade are unchanged.
            feedback: >
              Per trade they are, but $\bar{X}_n = X_1$ for every $n$, so the
              average keeps the full standard deviation $3$ forever.
          - text: >
              No: $\bar{X}_n = X_1$, whose miss probability never shrinks.
            correct: true
            feedback: >
              Right. Without vanishing covariances there is nothing for $n$ to
              divide down.
        feedback: >
          Said aloud: Chebyshev on $\bar{X}_n$ with variance $\sigma^{2}/n$
          gives $\sigma^{2}/(n\varepsilon^{2}) \to 0$; independence is spent on
          the variance, and the bound is a proof, not a price.

  - node: quant-probability.limits.slln
    hook: >
      Interviews want the statement and the contrast with the weak law cold,
      never a proof — so knowing exactly what upgrades and what doesn't is
      the whole task.
    explanation: >
      The strong law changes the *mode* of convergence, not the target: same
      $\mu$, same $\bar{X}_n$, but now the claim is that the single infinite
      run of draws you'd actually observe has its running average settle at
      $\mu$ with probability $1$ — the whole-trajectory guarantee almost sure
      convergence promises, applied here.

      The hypothesis is weaker than the weak law's, not stronger: no
      variance assumption at all, only $\mathbb{E}|X_1|<\infty$. That's not a
      free lunch — the condition is sharp, since Cauchy draws (no finite
      mean) have $\limsup_n|\bar{X}_n|=\infty$ almost surely, the running
      average never settling anywhere.

      This is what licenses reading "probability" as "long-run frequency": it
      says the one sequence of trials you actually run, not some hypothetical
      ensemble of sequences, converges.
    worked: >
      Flip a fair coin repeatedly. The weak law's Chebyshev bound at
      $n=100$, $\sigma^{2}=0.25$, $\varepsilon=0.05$, reads
      $\Pr(|\bar{X}_{100}-0.5|\ge0.05)\le0.25/(100\times0.0025)=1$ —
      completely vacuous, no information at all. Yet the strong law still
      guarantees $\Pr(\bar{X}_n\to0.5\text{ as }n\to\infty)=1$ regardless —
      the whole-trajectory statement holds with certainty even where the
      weak law's per-$n$ bound has nothing to say.
    interview: >
      "State the strong law and contrast it with the weak law" checks two
      things: that you name almost sure convergence explicitly, not just
      "converges," and that you can say in one sentence what changed — mode,
      not target; weaker hypothesis, not stronger.
    pitfalls: >
      Describing the strong law as needing "more" than the weak law reverses
      the actual hypothesis comparison. Over-preparing a proof the interview
      doesn't want, at the expense of the sharp Cauchy counterexample it
      does, wastes prep time.
    recap: >
      The strong law needs only a finite first moment and upgrades the weak
      law's conclusion to almost sure convergence of the running average —
      a statement about the one sequence you actually observe.
    dialogue:
      - part: One game, played forever
        teach: >
          You play one game forever. Each round you roll a fair die and are
          paid the face value minus $3$, so a $1$ costs you $2$ and a $6$ pays
          $3$. Write $\bar{X}_n$ for your average payoff over the first $n$
          rounds. You will only ever see this one infinite run.
      - ask: >
          What is the expected payoff per round?
        expects: "0.5"
        feedback: >
          $3.5 - 3 = 0.5$. The variance per round is that of a die, $35/12$.
      - ask: >
          The weak law gives $\Pr(|\bar{X}_n - 0.5| \ge 0.1) \to 0$. Does that
          tell you that *your* run's average ends up at $0.5$ and stays there?
        choices:
          - text: >
              Yes: if a miss at each $n$ becomes unlikely, the run must settle.
            feedback: >
              Rare misses at each $n$ can still recur at infinitely many
              separate $n$ along one run. The weak law grades each $n$ alone and
              never rules that out.
          - text: >
              No: it is a statement about each $n$ separately, not about one
              whole run.
            correct: true
            feedback: >
              Right. To say your run settles you need the probability of a miss
              at *some* $m \ge n$ to vanish, which is almost sure convergence.
          - text: >
              No: nothing can be said about a single run, only about averages
              over many runs.
            feedback: >
              Something can be said about a single run: whether the event "this
              run's average converges" has probability $1$. That is the question
              still open.
        feedback: >
          The weak law is a per-$n$ statement. What you live through is one
          path.
      - ask: >
          Try to sweep the tail with the union bound. Chebyshev gives
          $\Pr(|\bar{X}_n - 0.5| \ge 0.1) \le (35/12)/(0.01n) \approx 292/n$.
          Does adding these bounds over all $n \ge N$ give a useful bound on a
          miss at some $n \ge N$?
        choices:
          - text: >
              Yes: each term goes to $0$, so the sum does too.
            feedback: >
              Terms going to $0$ is not a sum going to $0$:
              $\sum_{n \ge N} 292/n$ is a tail of the harmonic series, which is
              infinite for every $N$.
          - text: >
              No: $\sum_{n \ge N} 292/n$ diverges, so the bound is infinite.
            correct: true
            feedback: >
              Right. Chebyshev's $1/n$ is too slow to be summed.
        feedback: >
          The direct sweep fails. The bound per $n$ is fine; there are just too
          many $n$.

      - part: Fewer checkpoints
        reflect: >
          The union bound over every $n$ diverges. What could you sum over
          instead so that the series converges, and why might the average not
          stray far between the checkpoints you keep?
        hint: >
          Which sparse sequence of $n$ turns $1/n$ into a summable series?
        answer: >
          Check only at the squares $n = k^{2}$: the bounds become
          $292/k^{2}$, which is summable, so with probability $1$ only finitely
          many squares miss, and the average converges along the squares.
          Between $k^{2}$ and $(k+1)^{2}$ only about $2k$ new rounds arrive,
          a vanishing share of $k^{2}$, so for bounded payoffs like these the
          average cannot drift far before the next checkpoint. That is the
          classical route to the strong law under a finite variance.
      - teach: >
          The result is the strong law of large numbers (Kolmogorov): if
          $X_1, X_2, \dots$ are iid with $\mathbb{E}|X_1| < \infty$ and mean
          $\mu$, then $\bar{X}_n \to \mu$ almost surely. Your one run's average
          converges to $0.5$, except on a set of runs of probability $0$. It
          upgrades the mode of convergence, not the limit, and it needs no
          variance at all.
      - ask: >
          Apply it to an indicator. With probability one, what does the
          fraction of rounds in which you lose money converge to?
        expects: "1/3"
        tolerance: 0.001
        hint: >
          The indicator of a loss is iid across rounds, with mean equal to the
          probability of a loss.
        feedback: >
          You lose on a $1$ or a $2$, probability $1/3$, and the indicators
          have finite mean, so the running fraction converges to $1/3$ almost
          surely. This is the long-run-frequency reading of probability, made
          into a theorem.
      - ask: >
          With probability one, what does the running average of the
          *squared* payoffs converge to?
        expects: "19/6"
        tolerance: 0.005
        hint: >
          The squared payoffs are $4, 1, 0, 1, 4, 9$, equally likely.
        feedback: >
          $(4 + 1 + 0 + 1 + 4 + 9)/6 = 19/6 \approx 3.17$, which is
          $35/12 + 0.5^{2}$. Any function of the draws with a finite mean gets
          its own strong law.
      - ask: >
          Compare the hypotheses. Which law asks more of the draws?
        choices:
          - text: >
              The strong law: a stronger conclusion needs stronger hypotheses.
            feedback: >
              Here the opposite holds. The strong law needs only
              $\mathbb{E}|X_1| < \infty$; the Chebyshev proof of the weak law
              assumed a finite variance.
          - text: >
              Neither: both need a finite variance.
            feedback: >
              Finite variance belongs to the Chebyshev proof of the weak law,
              not to either theorem. The strong law asks only for a finite
              mean.
          - text: >
              The Chebyshev weak law: it assumes a finite variance; the strong
              law needs only a finite mean.
            correct: true
            feedback: >
              Right. The strong law changes the mode, not the target, and asks
              less. The price is a much harder proof.
        feedback: >
          Mode up, hypothesis down: that one sentence is the contrast an
          interviewer wants.

      - part: When the mean does not exist
        ask: >
          Now the payoff per round is standard Cauchy, which has no finite mean.
          The average of $n$ standard Cauchy draws is again standard Cauchy.
          What is $\Pr(|\bar{X}_{1000}| > 1)$?
        expects: "1/2"
        hint: >
          For standard Cauchy, $\Pr(|X| \le 1) = (2/\pi)\arctan 1$.
        feedback: >
          $1 - (2/\pi)(\pi/4) = 1/2$, exactly as for a single draw. A thousand
          rounds bought nothing.
      - ask: >
          What does the Cauchy running average do along one infinite run?
        choices:
          - text: >
              It settles at $0$, the centre of symmetry.
            feedback: >
              Symmetry gives a median of $0$, not a mean. Without
              $\mathbb{E}|X_1| < \infty$ the strong law is silent, and in fact
              $\limsup_n |\bar{X}_n| = \infty$ almost surely.
          - text: >
              It wanders forever: $\limsup_n |\bar{X}_n| = \infty$ almost surely.
            correct: true
            feedback: >
              Right. The finite-mean condition is sharp: without it the
              running average does not settle anywhere.
          - text: >
              It settles, but to a random limit.
            feedback: >
              A limit would require the average to stop moving, and now and then
              a single huge draw drags it somewhere new. It has no limit
              at all, random or not.
        feedback: >
          Said aloud: with a finite mean, the running average of one infinite
          run converges to $\mu$ with probability one — a statement about the
          path you actually observe — and without one, it never settles.

  - node: quant-probability.limits.clt
    hook: >
      This is the single most-tested fact in the curriculum, and interviews
      test not the formula but whether you know precisely what's held fixed
      and what's allowed to vary freely.
    explanation: >
      The sample mean already has mean $\mu$ and standard deviation
      $\sigma/\sqrt{n}$ exactly, for every $n$, regardless of the shape of
      the underlying law. The central limit theorem is the claim about what
      fills in that shrinking window: rescale the deviation $\bar{X}_n-\mu$
      by $\sqrt{n}/\sigma$ so it stops shrinking, and the resulting
      standardized quantity converges in distribution to a fixed law, the
      standard normal — no matter what the original law of $X_i$ looked like.

      Read the decomposition rather than just memorizing the formula: the
      sum is $n\mu$ plus a normal-shaped wobble of size $\sigma\sqrt{n}$; the
      average is $\mu$ plus a normal-shaped wobble of size $\sigma/\sqrt{n}$.
      That's the single most reusable move in the interview: for large $n$,
      treat sums and averages as approximately normal.

      What's genuinely free is the shape — discrete or continuous, skewed or
      symmetric, bounded or not — only the mean and the finite variance ever
      enter the limit. What's not negotiable is $0<\sigma^{2}<\infty$; drop
      that and there is no normal limit at all.
    worked: >
      Let $X_i$ be iid Exponential(rate $1$), so $\mu=1$, $\sigma^{2}=1$. For
      $n=225$ draws, $S_{225}$ is approximately normal with mean $225$ and
      standard deviation $\sqrt{225}=15$. So
      $\Pr(S_{225}>240)\approx1-\Phi((240-225)/15)=1-\Phi(1)\approx
      1-0.8413=0.1587$ — computed the same way regardless of the
      exponential shape, since only $\mu=1,\sigma^{2}=1$ mattered.
    interview: >
      "Why can you treat a sum of $n$ independent things as normal for large
      $n$" is answered by naming the standardization and stating that shape
      washes out while mean and variance don't. A fast follow-up, "what
      hypothesis can't be dropped," is answered with finite positive
      variance.
    pitfalls: >
      Quoting the theorem for infinite-variance (heavy-tailed) variables
      simply doesn't apply, no matter how large $n$ gets. Treating the
      unrescaled sum $S_n$ itself as converging to a fixed normal misses that
      only the standardized version converges.
    recap: >
      Standardizing a sum of iid finite-variance variables by $\sqrt{n}$
      always converges in distribution to the standard normal, whatever the
      shape of the underlying law.
    dialogue:
      - part: A book of lopsided bets
        teach: >
          You sell $400$ independent short-dated options. Each one nets you $+1$
          with probability $0.9$, when it expires worthless, and $-4$ with
          probability $0.1$, when it is exercised. Write $S$ for your total
          P&L. A single option's P&L is about as lopsided as a law gets.
      - ask: >
          What is the expected total P&L?
        expects: "200"
        hint: >
          Find one option's mean, then use linearity.
        feedback: >
          One option: $0.9(1) + 0.1(-4) = 0.5$. Four hundred: $200$.
      - ask: >
          What is the standard deviation of the total?
        expects: "30"
        hint: >
          One option has $\mathbb{E}[X^{2}] = 0.9(1) + 0.1(16)$.
        feedback: >
          $\mathbb{E}[X^{2}] = 2.5$, so $\operatorname{Var}(X) = 2.5 - 0.25 = 2.25$
          and $\sigma = 1.5$. The total has standard deviation
          $1.5\sqrt{400} = 30$.
      - ask: >
          Risk asks for $\Pr(S < 140)$, a total two standard deviations below
          its mean. What can you honestly say from what you have so far?
        choices:
          - text: >
              Nothing useful: the law of one option is badly skewed, so the
              total must be too.
            feedback: >
              One option is skewed; whether $400$ of them still are is exactly
              the open question. The mean and standard deviation already pin
              the total near $200 \pm 30$.
          - text: >
              At most $0.25$, by Chebyshev, and nothing sharper without more
              about the law of the total.
            correct: true
            feedback: >
              Right: Chebyshev with $k = 2$ bounds the two-sided miss by
              $1/4$, and that is all a mean and variance buy on their own. The
              exact answer needs the law of $S$, here
              $\Pr(\operatorname{Bin}(400, 0.1) \ge 53)$, a long sum.
          - text: >
              Exactly $0.025$: two standard deviations always leaves $2.5\%$ in
              each tail.
            feedback: >
              That rule is a property of one particular law, and nothing yet
              says the total follows it. Chebyshev allows up to $25\%$ for some
              law with this mean and variance.
        feedback: >
          The mean and spread of a total are easy. Its shape is the question.

      - part: What the total turns into
        reflect: >
          Standardize: $Z_n = (S_n - n\mu)/(\sigma\sqrt{n})$ has mean $0$ and
          variance $1$ at every $n$. Suppose its law settles to some limit $L$
          that does not depend on the summand. If $Z'$ and $Z''$ are
          independent with law $L$, what must be true of $(Z' + Z'')/\sqrt{2}$,
          and which law do you know that passes this test?
        hint: >
          Split $S_{2n}$ into its first $n$ terms and its last $n$ terms, and
          standardize each half.
        answer: >
          $Z_{2n}$ is $(Z_n' + Z_n'')/\sqrt{2}$, where the two halves are
          independent standardized sums. If both sides settle to $L$, then
          $(Z' + Z'')/\sqrt{2}$ must again have law $L$. The standard normal
          does: a sum of independent normals is normal, with variance
          $1 + 1 = 2$, so dividing by $\sqrt{2}$ restores $N(0,1)$. It is the
          one fixed point with finite variance, which is why the bell curve
          appears whatever you add up.
      - teach: >
          That is the central limit theorem (Lindeberg–Lévy): if
          $X_1, X_2, \dots$ are iid with mean $\mu$ and variance
          $0 < \sigma^{2} < \infty$, then
          $(S_n - n\mu)/(\sigma\sqrt{n}) \to N(0,1)$ in distribution. Read it as
          a decomposition: the total is $n\mu$ plus a normal wobble of size
          $\sigma\sqrt{n}$. Nothing else about the summand's law enters.
      - ask: >
          Estimate $\Pr(S < 140)$ with the CLT. Use $\Phi(2) = 0.9772$.
        expects: "0.0228"
        tolerance: 0.0005
        hint: >
          Standardize $140$ with mean $200$ and standard deviation $30$.
        feedback: >
          $z = (140 - 200)/30 = -2$, so $\Pr(S < 140) \approx \Phi(-2) = 1 - 0.9772 = 0.0228$.
          The exact binomial sum is $0.0217$: the lopsided option has nearly
          vanished in $400$ copies.
      - ask: >
          The transform proof expands the log-MGF of $Z_n$ as
          $n \ln M_X(t/(\sigma\sqrt{n}))$ for centred $X$ and lets
          $n \to \infty$. Which feature of the summand survives into the
          limit $t^{2}/2$?
        choices:
          - text: >
              Its whole law, through every moment.
            feedback: >
              The third moment enters with a factor $n \cdot n^{-3/2} = n^{-1/2}$,
              and higher moments with smaller factors still. All of them vanish
              in the limit.
          - text: >
              Only its variance, which the standardization divides away.
            correct: true
            feedback: >
              Right. The mean is subtracted, the second-order term gives
              $n \cdot t^{2}/(2n) = t^{2}/2$, and everything beyond it carries a
              negative power of $n$. Identification of MGFs then turns
              convergence of transforms into convergence of laws.
          - text: >
              Its mean and its skewness.
            feedback: >
              The mean is subtracted before anything starts, and skewness sits
              in the third-order term, which shrinks like $1/\sqrt{n}$. It
              affects how fast the limit arrives, not the limit itself.
        feedback: >
          This is why the shape of the summand washes out: only the second
          moment is of the right order to survive the rescaling.

      - part: Totals, averages, and the hypothesis you keep
        ask: >
          Now sell $900$ options. Estimate the probability that the average
          P&L per option is below $0.375$. Use $\Phi(2.5) = 0.9938$.
        expects: "0.0062"
        tolerance: 0.0005
        hint: >
          The average is $0.5$ plus a normal wobble of size $\sigma/\sqrt{n}$.
        feedback: >
          The average has standard deviation $1.5/\sqrt{900} = 0.05$, so
          $z = (0.375 - 0.5)/0.05 = -2.5$ and the estimate is $0.0062$. The
          exact answer is about $0.0075$; this far out, the skew still shows a
          little.
      - ask: >
          What does the CLT say about the unstandardized total $S_n$ itself as
          $n \to \infty$?
        choices:
          - text: >
              $S_n$ converges in distribution to a normal law.
            feedback: >
              $S_n$ has mean $0.5n$ and standard deviation $1.5\sqrt{n}$, both
              running off to infinity. Only the standardized version has a
              limit; for fixed large $n$, $S_n$ is approximately
              $N(0.5n, 2.25n)$, a different normal for every $n$.
          - text: >
              $S_n$ has no limit, but is approximately $N(n\mu, n\sigma^{2})$ for
              each large $n$.
            correct: true
            feedback: >
              Right. The theorem is about the standardized sum; the
              approximation for $S_n$ is how you use it.
          - text: >
              $S_n$ converges to $n\mu$ in probability.
            feedback: >
              $n\mu$ is not a fixed limit, and $S_n - n\mu$ has standard
              deviation $\sigma\sqrt{n}$, which grows. It is the average that
              concentrates.
        feedback: >
          The total wobbles by $\sigma\sqrt{n}$, the average by
          $\sigma/\sqrt{n}$, and both wobbles are normal.
      - ask: >
          Which hypothesis can you never drop?
        choices:
          - text: >
              That the summand is continuous.
            feedback: >
              Your options were a two-point law and the CLT worked at
              $400$. Discrete, continuous, skewed or symmetric — the shape is
              free.
          - text: >
              That the summand is symmetric.
            feedback: >
              Your summand was badly skewed. Skewness slows the convergence;
              it does not stop it.
          - text: >
              That the variance is finite and positive.
            correct: true
            feedback: >
              Right. With $\sigma^{2} = \infty$ there is nothing to standardize
              by and no normal limit: averages of Cauchy draws are Cauchy for
              every $n$.
        feedback: >
          Said aloud: the standardized sum of iid finite-variance draws goes to
          $N(0,1)$ whatever their shape — total $n\mu \pm \sigma\sqrt{n}$,
          average $\mu \pm \sigma/\sqrt{n}$.

  - node: quant-probability.limits.de-moivre-laplace
    hook: >
      "Approximate this binomial with a normal" is asked so often that
      recognizing the corollary instantly, rather than re-deriving from the
      raw CLT, is the time-saving move.
    explanation: >
      A Bernoulli($p$) summand is the simplest instance to run the central
      limit theorem on: mean $p$, variance $p(1-p)$, both automatically
      finite for $0<p<1$. Plugging directly into the standardization with
      $\mu=p,\sigma^{2}=p(1-p)$ turns
      $S_n=\sum\text{Bernoulli}_i\sim\operatorname{Bin}(n,p)$ into
      $(S_n-np)/\sqrt{np(1-p)}\to N(0,1)$ — nothing new to prove, the general
      theorem specialized to the one law that generates counts.

      This deserves its own name because binomial counts — defaults, clicks,
      heads — are the most common object in an interview, so this corollary
      gets invoked far more often than the raw CLT does directly.

      The usability threshold, $np(1-p)\ge10$, checks that the binomial has
      room to spread symmetrically before you trust the bell shape; as $p$
      moves away from $1/2$ the true binomial skews more and the
      approximation degrades faster for a given $n$. Small $p$ with $np$
      only moderate is the wrong regime entirely — the binomial's other
      limit there is Poisson, not normal.
    worked: >
      Let $S\sim\operatorname{Bin}(500,0.4)$. Then $np=200$,
      $np(1-p)=120\ge10$, so the approximation is trustworthy; $\sigma=
      \sqrt{120}\approx10.95$. Standardizing,
      $(S-200)/10.95\to N(0,1)$, so
      $\Pr(S\le185)\approx\Phi((185-200)/10.95)=\Phi(-1.37)\approx0.0853$.
    interview: >
      "When can I treat a binomial count as normal" is answered with the
      $np(1-p)\ge10$ threshold and the standardized form, cold. A common trap
      plants a small-$p$, large-$n$ binomial to see whether you catch that
      Poisson, not normal, is the right call.
    pitfalls: >
      Applying the normal approximation with $np(1-p)$ well below $10$, or
      $p$ near $0$ or $1$, compares a badly skewed count against a symmetric
      curve. This is a large-$n$, fixed-$p$ result — it says nothing about
      $p\to0$ with $np$ held fixed.
    recap: >
      Running the CLT on Bernoulli($p$) summands gives
      $(S_n-np)/\sqrt{np(1-p)}\to N(0,1)$, the workhorse binomial
      approximation once $np(1-p)\ge10$.
    dialogue:
      - part: Nine hundred chances to click
        teach: >
          An ad is shown to $900$ visitors, and each clicks independently with
          probability $0.1$. Write $S$ for the number of clicks. The campaign
          manager wants the chance of at least $105$ clicks.
      - ask: >
          What is the expected number of clicks?
        expects: "90"
        feedback: >
          $np = 900 \times 0.1 = 90$.
      - ask: >
          What is the standard deviation of the number of clicks?
        expects: "9"
        hint: >
          A binomial count has variance $np(1-p)$.
        feedback: >
          $np(1-p) = 900 \times 0.1 \times 0.9 = 81$, so the standard deviation
          is $9$.
      - ask: >
          A colleague proposes approximating $S$ by a Poisson law with
          $\lambda = 90$. What is wrong with that?
        choices:
          - text: >
              Nothing: a binomial with large $n$ is always close to Poisson.
            feedback: >
              The Poisson limit is for $p \to 0$ with $np$ held fixed. Here
              $p = 0.1$ is not small, and it shows in the spread.
          - text: >
              The Poisson has variance $90$, but the count has variance $81$.
            correct: true
            feedback: >
              Right. A Poisson's variance equals its mean, while a binomial's
              is smaller by the factor $1-p$. At $p = 0.1$ that is a $10\%$
              error in variance before you even reach the tail.
          - text: >
              A Poisson can exceed $900$, and the count cannot.
            feedback: >
              True, but the Poisson's mass above $900$ is astronomically small.
              The damaging error is in the middle of the law, where the
              variances disagree.
        feedback: >
          The count needs an approximation that keeps both its mean $90$ and
          its variance $81$.

      - part: A count is a sum
        reflect: >
          Write the click count as a sum of simpler variables. Which theorem
          you already hold then applies, what does it say about $S$, and what
          must be true of $p$ for it to apply?
        hint: >
          Each visitor contributes a $0$ or a $1$.
        answer: >
          $S$ is a sum of $900$ iid Bernoulli($0.1$) indicators, each with mean
          $p$ and variance $p(1-p)$. The central limit theorem applies as soon
          as that variance is finite and positive, which means $0 < p < 1$, and
          gives $(S - np)/\sqrt{np(1-p)} \to N(0,1)$. So $S$ is approximately
          normal with mean $90$ and standard deviation $9$.
      - teach: >
          This is De Moivre–Laplace: if $S_n \sim \operatorname{Bin}(n,p)$ with
          $0 < p < 1$, then $(S_n - np)/\sqrt{np(1-p)} \to N(0,1)$ in
          distribution — the first central limit theorem ever proved, de Moivre
          for $p = 1/2$ in 1733. The working rule: trust it once
          $np(1-p) \ge 10$.
      - ask: >
          Estimate $\Pr(S \ge 105)$ by the plain standardization. Use
          $\Phi(1.67) = 0.9525$.
        expects: "0.0475"
        tolerance: 0.001
        hint: >
          $z = (105 - 90)/9$.
        feedback: >
          $z = 15/9 \approx 1.67$, so $\Pr(S \ge 105) \approx 1 - 0.9525 = 0.0475$.
          The exact binomial value is $0.056$. Much of that gap comes from
          treating the integer $105$ as a point rather than a bar of width
          $1$, a repair worth its own lesson.
      - ask: >
          Why does the corollary insist on $0 < p < 1$?
        choices:
          - text: >
              So that the count can take every value from $0$ to $n$.
            feedback: >
              That is a consequence, not the reason. What the central limit
              theorem needs is a variance to standardize by.
          - text: >
              At $p = 0$ or $p = 1$ the summand has variance $0$, and there is
              no spread to standardize.
            correct: true
            feedback: >
              Right. $S_n$ is then the constant $0$ or $n$, and
              $\sqrt{np(1-p)} = 0$ leaves nothing to divide by.
          - text: >
              Because the normal law cannot describe probabilities $0$ or $1$.
            feedback: >
              The issue is the summand, not the normal: with $p(1-p) = 0$ the
              hypothesis $\sigma^{2} > 0$ of the central limit theorem fails.
        feedback: >
          The corollary is the theorem with $\mu = p$ and
          $\sigma^{2} = p(1-p)$; its hypothesis is the theorem's.

      - part: Checking the regime first
        ask: >
          A second campaign shows a banner to $900$ visitors who each click with
          probability $0.002$. What is $np(1-p)$?
        expects: "1.796"
        tolerance: 0.001
        feedback: >
          $900 \times 0.002 \times 0.998 = 1.796$, far below $10$.
      - ask: >
          Should you trust the normal approximation for this second count?
        choices:
          - text: >
              Yes: $n = 900$ is large.
            feedback: >
              The theorem is a limit with $p$ held fixed, and $n = 900$ does not
              make $p = 0.002$ behave. The count has mean $1.8$ and is piled
              against $0$: the normal gives $\Pr(S \le 0) \approx 0.09$, while
              the exact $\Pr(S = 0) = 0.998^{900} \approx 0.165$.
          - text: >
              No: the count has no room to spread symmetrically, and its other
              limit, the Poisson, is the right model.
            correct: true
            feedback: >
              Right. With $p$ small and $np$ moderate the binomial goes Poisson,
              not normal. Identify the regime before reaching for $\Phi$.
          - text: >
              Yes, provided you standardize with $\sqrt{np}$ instead.
            feedback: >
              Changing the scale does not change the shape. The count is piled
              against zero and badly skewed, whatever you divide by.
        feedback: >
          $np(1-p) \ge 10$ is the check that the count has room to look like a
          bell.
      - ask: >
          Two binomials both have $np(1-p) = 16$: one with $p = 0.5$, one with
          $p = 0.1$. Which is closer to normal?
        choices:
          - text: >
              The $p = 0.1$ one, since it has the larger $n$.
            feedback: >
              It has $n \approx 178$ against $64$, but its law is skewed to the
              right, with skewness $(1 - 2p)/\sqrt{np(1-p)} = 0.8/4 = 0.2$.
          - text: >
              They are equally close: the rule only looks at $np(1-p)$.
            feedback: >
              The rule is a threshold, not a full accuracy measure. Skewness
              $(1 - 2p)/\sqrt{np(1-p)}$ also matters, and it differs here.
          - text: >
              The $p = 0.5$ one: it is symmetric, with skewness $0$.
            correct: true
            feedback: >
              Right. Accuracy degrades as $p$ moves away from $1/2$, because a
              skewed count is being matched to a symmetric curve.
        feedback: >
          Said aloud: a binomial count standardizes to $N(0,1)$ with mean $np$
          and variance $np(1-p)$ — check $np(1-p) \ge 10$ first, and if $p$
          is tiny, go Poisson.

  - node: quant-probability.limits.normal-approx-binomial
    hook: >
      Skipping the half-unit shift is the single most common way to lose
      points here — it looks optional and changes the answer by a real
      margin, not a rounding error.
    explanation: >
      A binomial count only ever takes integer values, but the normal is a
      smooth density with zero mass at any single point — approximating
      $\Pr(S_n\ge k)$ directly at the integer $k$ discards exactly half of
      the probability that "belongs" to that integer under the
      discrete-to-continuous translation. Read the correction as granting
      the discrete atom at $k$ its own full unit of width, $[k-0.5,k+0.5]$,
      before crossing over to the continuous approximation.

      The two recipes point opposite directions for a reason: a "$\ge k$"
      tail pushes the boundary down half a unit before standardizing, so the
      atom at $k$ counts as "in"; a "$\le k$" tail pushes it up half a unit.
      The correction always moves the threshold toward including the
      boundary integer, not in one fixed numerical direction.

      The size of the error from skipping it isn't negligible at ordinary
      $n$ — it's a mismatch of roughly half a standard-error unit divided by
      $\sigma$, worse the smaller $\sigma$ is, exactly in the moderate-$n$
      range interviews favor.
    worked: >
      $S\sim\operatorname{Bin}(50,0.3)$; want $\Pr(S\le12)$. Here $\mu=15$,
      $\sigma=\sqrt{50\times0.3\times0.7}=\sqrt{10.5}\approx3.24$. With the
      correction, $z=(12+0.5-15)/3.24=-0.77$, giving
      $\Phi(-0.77)\approx0.2206$. Skipping the correction gives
      $z=(12-15)/3.24=-0.926$ and $\Phi(-0.926)\approx0.177$ — about a
      $20\%$ relative error against the corrected value.
    interview: >
      Estimating $\Pr(S\ge k)$ or $\Pr(S\le k)$ with the normal approximation
      always expects the half-integer shift produced automatically; a sharp
      interviewer asks you to justify the shift's direction, not just apply
      it by rote.
    pitfalls: >
      Shifting the boundary the wrong direction — up instead of down for a
      "$\ge$" tail, or vice versa — flips the correction into a bigger error
      than skipping it. Applying it to a genuinely continuous variable, with
      no integer atom to correct for, is a category error.
    recap: >
      Grant the boundary integer its own half-unit of width before
      standardizing — $z=(k\mp0.5-\mu)/\sigma$ — or the approximation
      mismatches the true binomial by a real margin.
    dialogue:
      - part: One event, two answers
        teach: >
          A signal calls the direction of each of $48$ independent trades
          correctly with probability $0.75$. Write $S$ for the number of
          correct calls, so $S \sim \operatorname{Bin}(48, 0.75)$ with mean
          $36$ and standard deviation $\sqrt{48 \times 0.75 \times 0.25} = 3$.
          A review wants the chance of at least $40$ correct calls.
      - ask: >
          Standardize $40$ directly and estimate $\Pr(S \ge 40)$. Use
          $\Phi(1.33) = 0.9082$.
        expects: "0.0918"
        tolerance: 0.001
        hint: >
          $z = (40 - 36)/3$.
        feedback: >
          $z = 4/3 \approx 1.33$, so the estimate is $1 - 0.9082 = 0.0918$.
      - ask: >
          "At least $40$" is the same event as "more than $39$". Standardize
          $39$ directly and estimate $\Pr(S > 39)$. Use $\Phi(1) = 0.8413$.
        expects: "0.1587"
        tolerance: 0.0005
        feedback: >
          $z = (39 - 36)/3 = 1$, so the estimate is $1 - 0.8413 = 0.1587$. One
          event, two estimates, and the second is about $73\%$ larger than the
          first.
      - ask: >
          The exact binomial answer is $0.1190$. What went wrong?
        choices:
          - text: >
              Nothing: $n = 48$ is simply too small for the normal.
            feedback: >
              $np(1-p) = 9$ is close to the usual threshold, and the exact value
              lies neatly between your two estimates. The approximation is
              fine; the cut point is what is ambiguous.
          - text: >
              The second phrasing is the right one; strict inequalities suit
              continuous laws.
            feedback: >
              $0.1587$ overshoots the exact $0.1190$ by $0.040$, further than
              $0.0918$ undershoots it. Neither integer is the right place to
              cut.
          - text: >
              The normal has no atoms, so where between $39$ and $40$ you cut
              decides how much of the boundary mass you count.
            correct: true
            feedback: >
              Right. For the count, nothing lies strictly between $39$ and
              $40$; for the normal, a strip a third of a standard deviation
              wide does, holding $0.067$ of probability, and the two phrasings
              assign all of it to opposite sides.
        feedback: >
          The binomial cannot tell $39.2$ from $39.8$, but the normal can, so
          you have to decide where each integer's share of the curve begins.

      - part: A unit of width for every integer
        reflect: >
          Think of the integer $40$ as a bar on the line. Which stretch of the
          normal should stand for it, and so where should the cut go for "at
          least $40$"? Check that your choice gives one answer for both
          phrasings.
        hint: >
          The bars for $39$ and $40$ should meet without overlapping.
        answer: >
          Give each integer $k$ the unit-wide stretch from $k - 0.5$ to
          $k + 0.5$. "At least $40$" is then everything from $39.5$ up, and so
          is "more than $39$": both phrasings cut at $39.5$, and the ambiguity
          disappears. The cut splits the disputed gap down the middle, which is
          why it lands near the truth.
      - teach: >
          That half-unit shift is the continuity correction. For
          $S \sim \operatorname{Bin}(n,p)$ with $\mu = np$ and
          $\sigma = \sqrt{np(1-p)}$: approximate $\Pr(S \ge k)$ by
          $1 - \Phi((k - 0.5 - \mu)/\sigma)$ and $\Pr(S \le k)$ by
          $\Phi((k + 0.5 - \mu)/\sigma)$. The shift always moves the cut so as
          to include the boundary integer's own bar.
      - ask: >
          Estimate $\Pr(S \ge 40)$ with the correction. Use
          $\Phi(1.17) = 0.8790$.
        expects: "0.121"
        tolerance: 0.001
        hint: >
          Cut at $39.5$.
        feedback: >
          $z = (39.5 - 36)/3 \approx 1.17$, so the estimate is
          $1 - 0.8790 = 0.1210$, against the exact $0.1190$. The plain
          estimates were off by $0.027$ and $0.040$; this one is off by
          $0.002$.
      - ask: >
          Now the review asks for $\Pr(S \le 33)$. Where do you cut?
        choices:
          - text: >
              At $32.5$: the correction always subtracts $0.5$.
            feedback: >
              That would exclude the bar for $33$, which the event includes.
              The correction moves the cut to take in the boundary bar, and for
              a lower tail that means up.
          - text: >
              At $33.5$, so the bar for $33$ is counted.
            correct: true
            feedback: >
              Right. "At most $33$" contains $33$, whose bar runs to $33.5$.
          - text: >
              At $33$: no correction is needed for a lower tail.
            feedback: >
              The lower tail has the same problem as the upper: cutting at the
              integer counts only half of the boundary bar.
        feedback: >
          Upper tail, cut at $k - 0.5$; lower tail, cut at $k + 0.5$. Shift
          the wrong way and the error is larger than not correcting at all.
      - ask: >
          Estimate $\Pr(S \le 33)$ with the correction. Use
          $\Phi(0.83) = 0.7967$.
        expects: "0.2033"
        tolerance: 0.001
        hint: >
          $z = (33.5 - 36)/3$.
        feedback: >
          $z = -2.5/3 \approx -0.83$, so the estimate is
          $1 - 0.7967 = 0.2033$. The exact value is $0.1999$.

      - part: When the half unit matters
        ask: >
          A different count has standard deviation $50$. By how much does the
          continuity correction move its $z$-value?
        expects: "0.01"
        hint: >
          The cut moves by $0.5$ on the count's own scale.
        feedback: >
          $0.5/50 = 0.01$, a change in the third decimal of the answer at
          most. With $\sigma = 3$ the same shift moved $z$ by $0.17$. The
          correction matters most exactly where interviews live: moderate
          $n$, small $\sigma$.
      - ask: >
          An order's fill time in milliseconds is modelled as continuous and
          approximately normal. Should you apply the continuity correction to
          $\Pr(\text{fill time} \ge 2)$?
        choices:
          - text: >
              Yes: always apply it, as with the binomial.
            feedback: >
              The correction repairs the mismatch between integer atoms and a
              density. A continuous quantity has no atoms, so there is no bar
              to grant and nothing to repair.
          - text: >
              No: there are no integer atoms, so there is nothing to correct.
            correct: true
            feedback: >
              Right. The correction belongs to a discrete count approximated by
              a continuous law, and only there.
          - text: >
              Yes, but by a quarter unit, since time is measured finely.
            feedback: >
              No width is right, because no atom exists. A correction applied
              to a continuous variable just biases the answer.
        feedback: >
          Said aloud: standardize with $np$ and $\sqrt{np(1-p)}$, shift the
          cut half a unit to take in the boundary integer, then read off
          $\Phi$.

  - node: quant-probability.limits.poisson-vs-normal
    hook: >
      "Should I use Poisson or normal here" is a diagnostic interviewers
      plant deliberately by choosing $p$ small enough that the normal answer
      is badly wrong — naming the regime before computing is the actual
      skill.
    explanation: >
      Both approximations start from $\operatorname{Bin}(n,p)$ with $n$
      large, but they trust different things about it. The normal
      approximation needs the count to spread symmetrically on both sides of
      its mean, checked by $np(1-p)\ge10$. The Poisson approximation instead
      trusts that $p$ itself is tiny, so the count is "how many rare events
      out of very many independent tries," with $\lambda=np$ the one number
      surviving the limit.

      The diagnostic: look at $p$, not just $n$. Rare-event settings —
      defaults, typos, arrivals — with $p$ small and $\lambda=np$ moderate
      are the Poisson regime, where Le Cam's bound caps the error at
      $np^{2}=\lambda p$, so accuracy *improves* as $p$ shrinks with
      $\lambda$ fixed. Once $np(1-p)$ clears $10$, the count is wide enough
      that the continuity-corrected normal is the accurate call instead.

      The trap is defaulting to whichever approximation you memorized first
      regardless of $p$ — a large $n$ alone never tells you which regime
      you're in.
    worked: >
      Consider $\operatorname{Bin}(2000,0.001)$. Here $\lambda=np=2$ and $p$
      is tiny, squarely the Poisson regime; Le Cam's bound is
      $np^{2}=2000\times0.000001=0.002$, negligible. So
      $\Pr(S=0)\approx e^{-2}\approx0.1353$. By contrast $np(1-p)\approx2$,
      far below the normal threshold of $10$ — confirming the normal
      approximation would be unusable here regardless of how large $n$ is.
    interview: >
      "A huge number of independent calls, each with a tiny complaint
      probability — approximate the number of complaints" is a stock
      Poisson-regime prompt; the interviewer wants $p$ checked small and
      $\lambda=np$ moderate before any formula is written.
    pitfalls: >
      Reaching for the normal approximation just because $n$ is large,
      without checking $np(1-p)$ actually clears $10$, fails badly when $p$
      is tiny. Using the Poisson approximation once $p$ is no longer small
      throws away accuracy the normal would have given for free.
    recap: >
      Diagnose by $p$, not $n$ alone — tiny $p$ with moderate $\lambda=np$
      means Poisson with error $\lambda p$; $np(1-p)\ge10$ means the
      continuity-corrected normal instead.
    dialogue:
      - part: A quiet day at the exchange
        teach: >
          An exchange gateway handles $5000$ orders a day, and each is
          rejected independently with probability $0.0006$. Write $S$ for the
          day's number of rejections. Operations wants the chance of a day with
          no rejections at all.
      - ask: >
          What is the expected number of rejections per day?
        expects: "3"
        feedback: >
          $np = 5000 \times 0.0006 = 3$. The standard deviation is
          $\sqrt{np(1-p)} \approx 1.73$.
      - ask: >
          Estimate $\Pr(S = 0)$ with the continuity-corrected normal, treating
          it as $\Pr(S \le 0)$. Use $\sigma \approx 1.73$ and
          $\Phi(1.44) = 0.9251$.
        expects: "0.0749"
        tolerance: 0.001
        hint: >
          Cut at $0.5$ and standardize with mean $3$.
        feedback: >
          $z = (0.5 - 3)/1.73 \approx -1.44$, so the estimate is
          $1 - 0.9251 = 0.0749$.
      - ask: >
          Now estimate $\Pr(S = 0)$ with a Poisson law of mean $3$.
        expects: "0.0498"
        tolerance: 0.0005
        hint: >
          A Poisson($\lambda$) law has $\Pr(0) = e^{-\lambda}$.
        feedback: >
          $e^{-3} \approx 0.0498$.
      - ask: >
          The exact value is $0.9994^{5000} \approx 0.0497$. Why did the
          normal come out half again too large?
        choices:
          - text: >
              It needed a larger $n$; $5000$ orders is too few.
            feedback: >
              Raising $n$ with $p$ fixed would eventually rescue the normal,
              but $5000$ is not the problem in itself. The problem is that only
              $3$ rejections are expected: the count has nowhere to spread
              below its mean.
          - text: >
              The continuity correction was applied in the wrong direction.
            feedback: >
              "At most $0$" takes in the bar for $0$, so the cut at $0.5$ is
              right. Even a perfectly placed cut cannot make a symmetric curve
              match a count piled against zero.
          - text: >
              The count sits $1.7$ standard deviations above a hard floor at
              $0$, so it is skewed, and the symmetric normal cannot follow it.
            correct: true
            feedback: >
              Right. With mean $3$ and standard deviation $1.73$, a normal would
              happily put mass on negative counts; the real law is lopsided
              against zero, which is exactly the Poisson's shape.
        feedback: >
          Large $n$ alone told you nothing. The regime was decided by how many
          events you expect and how much room they have to spread.

      - part: Reading the regime before computing
        reflect: >
          Before computing anything, what would you look at in $n$ and $p$ to
          know which approximation to trust, and why does a tiny $p$ favour
          the Poisson?
        hint: >
          One check measures room to spread; the other measures how rare each
          event is.
        answer: >
          Check $np(1-p)$: once it is at least about $10$, the count has room to
          spread symmetrically and the corrected normal is accurate. If instead
          $p$ is tiny and $\lambda = np$ is moderate, you are counting rare
          events among very many independent tries, the setting the Poisson
          limit describes. Le Cam's bound makes the second precise: the total
          variation error of the Poisson is at most $np^{2} = \lambda p$, so it
          shrinks as $p$ does.
      - teach: >
          So the technique is a diagnostic, run before any formula: small $p$
          with moderate $\lambda = np$ goes Poisson, with total-variation error
          at most $\lambda p$; $np(1-p) \ge 10$ goes to the
          continuity-corrected normal. Neither $n$ nor $p$ alone decides.
      - ask: >
          What does Le Cam's bound give for the gateway's Poisson
          approximation?
        expects: "0.0018"
        tolerance: 0.0001
        hint: >
          $np^{2}$ with $n = 5000$ and $p = 0.0006$.
        feedback: >
          $5000 \times 0.0006^{2} = 0.0018$. Every probability the Poisson
          quotes about $S$ is within $0.0018$ of the truth.

      - part: Same gateway, other flags
        ask: >
          A softer flag marks each order with probability $0.04$. What is
          $np(1-p)$ for its daily count?
        expects: "192"
        feedback: >
          $5000 \times 0.04 \times 0.96 = 192$, far above $10$.
      - ask: >
          Which approximation do you quote for the soft-flag count?
        choices:
          - text: >
              The Poisson, since the flag is still uncommon.
            feedback: >
              Le Cam's bound is $np^{2} = 5000 \times 0.0016 = 8$, which says
              nothing, and the Poisson's variance $200$ overstates the true
              $192$. A $4\%$ flag is not rare enough.
          - text: >
              The continuity-corrected normal, with mean $200$ and standard
              deviation $\sqrt{192} \approx 13.9$.
            correct: true
            feedback: >
              Right. With room to spread nearly $14$ either side of $200$, the
              count is close to symmetric and the corrected normal is accurate.
          - text: >
              Either: with $n = 5000$ they agree.
            feedback: >
              They agree only roughly, and the Poisson carries the wrong
              variance. When the normal regime applies, it is the one to quote.
        feedback: >
          $p = 0.0006$ and $p = 0.04$ on the same $5000$ orders land in
          different regimes.
      - ask: >
          Back to the $0.0006$ rejection rate, but now over a year:
          $5\,000\,000$ orders. Which regime is the yearly count in?
        choices:
          - text: >
              Poisson: $p$ is the same tiny $0.0006$.
            feedback: >
              $p$ alone does not decide. Now $\lambda = 3000$ and
              $np(1-p) \approx 3000$: the count has enormous room to spread,
              and Le Cam's $\lambda p = 1.8$ bound is useless.
          - text: >
              Normal: $np(1-p) \approx 3000$, so the count spreads
              symmetrically.
            correct: true
            feedback: >
              Right. A Poisson with mean $3000$ is itself nearly normal, so the
              two agree, but the normal is the natural one to compute with.
        feedback: >
          Said aloud: before quoting a number, check $np(1-p)$ against $10$
          and look at the size of $p$ — rare and moderate $\lambda$ means
          Poisson with error at most $\lambda p$, wide means corrected normal.

  - node: quant-probability.limits.dice-sum-clt
    hook: >
      This is the template for "sum of many small identical things, what's
      the chance it's unusually large" — only the mean and variance of one
      summand ever enter, never its exact shape.
    explanation: >
      The recipe: pin down one summand's mean and variance, multiply by $n$
      for the total's mean and variance, and hand those two numbers to the
      CLT — extracting $\mu=3.5,\sigma^{2}=35/12$ from a single fair die and
      never touching its actual pmf again.

      The two directions of the same standardization answer two
      different-sounding questions: a one-sided tail ("at least this much")
      reads off $1-\Phi(z)$, a two-sided band ("within this much of the
      mean") reads off $2\Phi(z)-1$, both from the identical $\mu,\sigma$
      once computed.

      The general lesson: a die's pmf is flat, about as far from
      bell-shaped as a law gets, yet it plays no role in the limit at all —
      a strong hint that any interview version of this pattern is really
      testing whether $\mu$ and $\sigma^{2}$ get extracted correctly and
      standardized, not whether you understand the specific die or coin
      involved.
    worked: >
      Roll a fair die $225$ times; how likely is the total to fall short of
      $750$? One die has $\mu=3.5,\sigma^{2}\approx2.917$, so $225$ dice have
      mean $787.5$ and variance $225\times2.917\approx656.4$, giving
      $\sigma\approx25.62$. With the continuity correction,
      $z=(749.5-787.5)/25.62\approx-1.483$, so
      $\Pr(S<750)\approx\Phi(-1.483)\approx0.069$ — about $6.9\%$, using
      nothing about the die beyond its mean and variance.
    interview: >
      "Roll a die (or flip a coin) $n$ times, what's the chance the total
      exceeds or falls short of some threshold" trains exactly this pattern
      — extract $\mu,\sigma^{2}$ of one trial, multiply by $n$, standardize,
      and apply the continuity correction unprompted.
    pitfalls: >
      Using a single die's variance as the total's variance instead of
      multiplying by $n$ is a common slip once the arithmetic gets busy.
      Forgetting the continuity correction on an explicitly integer total is
      exactly the setting it matters most in.
    recap: >
      A hundred-plus dice's total is governed entirely by one die's mean and
      variance fed through the CLT with a continuity correction — the die's
      actual shape never enters.
    dialogue:
      - part: One die, then four hundred and twenty
        teach: >
          A casino game rolls $420$ fair dice at once and pays a jackpot when
          the total reaches $1540$ or more. The house wants to know how often
          it pays.
      - ask: >
          Start with one die. What is its variance?
        expects: "35/12"
        tolerance: 0.001
        hint: >
          $\mathbb{E}[X^{2}] = (1 + 4 + 9 + 16 + 25 + 36)/6$, and the mean is
          $3.5$.
        feedback: >
          $\mathbb{E}[X^{2}] = 91/6$, so
          $\operatorname{Var}(X) = 91/6 - 3.5^{2} = 35/12 \approx 2.917$.
      - ask: >
          What is the mean of the total of $420$ dice?
        expects: "1470"
        feedback: >
          $420 \times 3.5 = 1470$.
      - ask: >
          What is the standard deviation of the total?
        expects: "35"
        hint: >
          Variances of independent dice add.
        feedback: >
          $420 \times 35/12 = 1225$, and $\sqrt{1225} = 35$. Not $420$ times
          one die's standard deviation of $1.71$, which would give $717$.
      - ask: >
          The total is an integer. Where do you cut the normal for "at least
          $1540$"?
        choices:
          - text: >
              At $1540$.
            feedback: >
              That counts only half of the bar for $1540$ itself. The total
              takes integer values, so the integer $1540$ owns the stretch from
              $1539.5$ to $1540.5$.
          - text: >
              At $1539.5$.
            correct: true
            feedback: >
              Right: the continuity correction, which takes in the boundary
              integer's whole bar.
          - text: >
              At $1540.5$.
            feedback: >
              That shifts the wrong way and drops the total $1540$ entirely,
              though it wins the jackpot.
        feedback: >
          An integer-valued total gets the continuity correction like any
          count.

      - part: Reading off the jackpot
        ask: >
          Estimate the probability of the jackpot. Use $\Phi(1.99) = 0.9767$.
        expects: "0.0233"
        tolerance: 0.0005
        hint: >
          $z = (1539.5 - 1470)/35$.
        feedback: >
          $z = 69.5/35 \approx 1.99$, so the estimate is
          $1 - 0.9767 = 0.0233$, about one game in $43$. The exact
          probability, by convolving $420$ dice, is $0.0235$.
      - reflect: >
          Nowhere did you use that every face is equally likely, except to get
          two numbers. Which two, and what would change if the die were loaded
          in a way that kept both of them?
        hint: >
          List every quantity that entered $z$.
        answer: >
          Only the die's mean $3.5$ and variance $35/12$ entered; the flat shape
          of its law never did. A loaded die with the same mean and variance
          would give the same normal approximation, and the central limit
          theorem says the true answers would agree in the limit too. With
          $420$ summands the remaining difference is small. The template is
          always: one summand's mean and variance, times $n$, standardize.
      - ask: >
          How likely is the total to land within $35$ of $1470$, that is,
          between $1435$ and $1505$ inclusive? Use $\Phi(1.01) = 0.8438$.
        expects: "0.6876"
        tolerance: 0.001
        hint: >
          Cut at $1434.5$ and $1505.5$, and use symmetry: $2\Phi(z) - 1$.
        feedback: >
          $z = 35.5/35 \approx 1.01$, so the band holds
          $2(0.8438) - 1 = 0.6876$. The exact value is $0.6894$. One standard
          deviation either side holds about two thirds, dice or not.

      - part: Setting the jackpot line
        ask: >
          The house wants the jackpot to hit at most $1\%$ of the time. Using
          $z_{0.99} = 2.326$ and the continuity correction, what is the lowest
          jackpot threshold, as an integer total, that achieves it?
        expects: "1552"
        hint: >
          You need $(k - 0.5 - 1470)/35 \ge 2.326$.
        feedback: >
          $k - 0.5 \ge 1470 + 2.326 \times 35 = 1551.41$, so $k \ge 1551.91$,
          and the lowest integer is $1552$. The exact probability of a total of
          at least $1552$ is $0.0099$; at $1551$ it would be $0.0107$.
      - ask: >
          A colleague redoes the jackpot estimate with the total's variance
          taken as $35/12$. What does he get, roughly?
        choices:
          - text: >
              About the same answer: variance is variance.
            feedback: >
              $35/12$ is one die's variance. The total's is $420$ times larger,
              and its standard deviation $\sqrt{420} \approx 20.5$ times larger.
          - text: >
              A probability of essentially $0$: he standardizes by $1.71$
              instead of $35$, so $z$ is about $41$.
            correct: true
            feedback: >
              Right. Using a single die's spread for the total inflates every
              $z$-value by a factor of about $20$.
          - text: >
              A probability near $1/2$, since the spread is too small to
              matter.
            feedback: >
              A small spread makes the jackpot look impossible, not a coin flip:
              $z = 69.5/1.71 \approx 41$.
        feedback: >
          Said aloud: one die is $3.5$ and $35/12$; times $n$ for the total;
          standardize with the continuity correction; read off $\Phi$.

  - node: quant-probability.limits.uniform-sum-normal
    hook: >
      This is the classic answer to "generate a normal variable with nothing
      but a uniform generator" before Box–Muller, and a fast sanity check on
      how quickly the CLT bites for a tame, bounded summand.
    explanation: >
      Twelve is not a magic number for the CLT in general — it's a magic
      number for this specific summand. A single $U(0,1)$ has mean $1/2$
      and variance $1/12$, chosen so that summing $12$ of them and
      subtracting the mean ($6$) lands the variance at exactly $1$ with no
      rescaling needed. A uniform's flat, bounded, symmetric shape converges
      unusually fast because there's no heavy tail or skew for the CLT's
      error to fight.

      The approximation is excellent near the centre, matching the true
      normal CDF to a few decimals, but structurally wrong far out in a way
      no larger $n$ fixes: the sum of $12$ uniforms is confined to $[-6,6]$
      by construction, so it assigns exactly zero probability to events a
      true normal would call merely rare, and its kurtosis sits slightly
      below the normal's, light-tailed rather than matching it.

      The general lesson: "large $n$" isn't one fixed threshold — a bounded,
      symmetric summand can look essentially normal at $n$ as small as a
      dozen, while a skewed or heavy-tailed summand can still look
      non-normal at $n$ in the hundreds.
    worked: >
      Using the fitted standard normal, $\Pr(S-6\le-3)=\Pr(Z\le-3)\approx
      1-\Phi(3)\approx0.00135$. But $S-6$ is confined to $[-6,6]$ with a
      density that vanishes faster than the normal's tail near $\pm6$, so the
      true probability is smaller than this estimate — the same light-tailed
      mismatch the kurtosis figure predicts, now visible as a concrete
      number rather than a moment.
    interview: >
      "Generate an approximately normal variable using only a uniform
      generator" is answered with sum-of-$12$-uniforms-minus-$6$. A sharp
      follow-up, "is it exactly normal," is answered by naming the bounded
      support and the negative excess kurtosis as the concrete way it fails.
    pitfalls: >
      Trusting the approximation arbitrarily far into the tails runs
      straight into the hard $[-6,6]$ boundary a true normal doesn't have.
      Assuming "$n=12$ is large" generalizes to every summand ignores that
      it's fast here specifically because a uniform is bounded and
      symmetric.
    recap: >
      Twelve uniforms minus six is close to standard normal near the centre
      by design, but strictly bounded to $[-6,6]$ and slightly light-tailed
      everywhere the true normal isn't.
    dialogue:
      - part: A normal from a uniform generator
        teach: >
          Your simulator has only a generator of independent $U(0,1)$ draws, and
          a quick risk check needs standard normal draws. You decide to add
          uniforms together and shift the sum.
      - ask: >
          What is the variance of one $U(0,1)$ draw?
        expects: "1/12"
        tolerance: 0.0005
        hint: >
          $\mathbb{E}[U^{2}] = 1/3$ and $\mathbb{E}[U] = 1/2$.
        feedback: >
          $1/3 - 1/4 = 1/12$.
      - ask: >
          How many uniforms must you add for the sum to have variance exactly
          $1$, so that no rescaling is needed?
        expects: "12"
        feedback: >
          Variances add: $n/12 = 1$ gives $n = 12$. That is the whole reason
          for the dozen.
      - ask: >
          What must you subtract from the sum of the $12$ uniforms to centre
          it at $0$?
        expects: "6"
        feedback: >
          The sum has mean $12 \times 1/2 = 6$. So $S - 6$ has mean $0$ and
          variance $1$, and the central limit theorem suggests it is close to
          $N(0,1)$.
      - ask: >
          Is $S - 6$ exactly standard normal?
        choices:
          - text: >
              Yes: it has mean $0$ and variance $1$, and the CLT does the rest.
            feedback: >
              Matching two moments does not match a law, and the CLT is a limit,
              not an identity at $n = 12$. Look at the range: $S - 6$ can never
              leave $[-6, 6]$.
          - text: >
              No: it is confined to $[-6, 6]$, which no normal is.
            correct: true
            feedback: >
              Right. The question is how close it is, and where the difference
              shows.
          - text: >
              No: it is uniform, since a sum of uniforms is uniform.
            feedback: >
              A sum of two uniforms is already triangular, peaked at the
              middle; adding more rounds the peak into a bell. Sums of uniforms
              are not uniform.
        feedback: >
          The construction is approximate. The useful questions are how fast it
          approaches the normal, and where it stays wrong.

      - part: How few is enough
        ask: >
          Try it with only two: $U_1 + U_2$ has the triangular law, with
          $\Pr(U_1 + U_2 \le s) = s^{2}/2$ for $s \le 1$. What is
          $\Pr(U_1 + U_2 \le 0.6)$?
        expects: "0.18"
        feedback: >
          $0.6^{2}/2 = 0.18$. The normal with the same mean $1$ and standard
          deviation $\sqrt{1/6} \approx 0.408$ gives
          $\Phi((0.6 - 1)/0.408) = \Phi(-0.98) \approx 0.164$. Two uniforms
          already land within $0.02$ in the body.
      - ask: >
          Still with two: standardized, the sum cannot fall below
          $-1/0.408 \approx -2.45$. A normal puts $\Phi(-2.5) \approx 0.0062$
          below $-2.5$. What is the true probability of falling below $-2.5$?
        expects: "0"
        feedback: >
          Zero: the sum of two uniforms is at least $0$, which standardizes to
          $-2.45$. The body was close and the tail is absent. With twelve the
          wall moves out to $\pm 6$, but it is still a wall.
      - reflect: >
          Two uniforms are already close in the body, and twelve are close to
          three decimals. A heavily skewed summand can still look non-normal
          after hundreds. What property of the uniform makes the CLT bite so
          fast?
        hint: >
          The first correction to the normal approximation is proportional to
          the summand's skewness and shrinks like $1/\sqrt{n}$.
        answer: >
          The uniform is symmetric, so its skewness is $0$ and the leading
          $1/\sqrt{n}$ correction vanishes altogether. It is also bounded, with
          no heavy tail to fight. What is left shrinks like $1/n$ and is driven
          by the excess kurtosis. "Large $n$" is not one number: it is set by
          the shape of the summand.
      - teach: >
          This is the classical generator: add twelve uniforms and subtract
          six. It matches the normal CDF to about three decimals near the
          centre, which is why it was used before Box–Muller. Its errors live
          in the tails, where the support stops at $\pm 6$ and the law is
          slightly light-tailed.

      - part: Where the dozen gives out
        ask: >
          One uniform has excess kurtosis $-6/5$, and excess kurtosis of a sum
          of $n$ iid terms is the summand's divided by $n$. What is the excess
          kurtosis of $S - 6$?
        expects: "-0.1"
        tolerance: 0.001
        feedback: >
          $(-6/5)/12 = -0.1$. Negative excess kurtosis means lighter tails than
          the normal: the generator undersells extreme draws.
      - ask: >
          Which use of the twelve-uniform generator is the risky one?
        choices:
          - text: >
              Estimating the median of a portfolio's simulated P&L.
            feedback: >
              The median lives in the body, where the generator matches the
              normal to about three decimals. That use is safe.
          - text: >
              Estimating the probability of a move beyond $4$ standard
              deviations.
            correct: true
            feedback: >
              Right. That probability lives where the generator is light-tailed
              and, past $6$, exactly zero. A normal gives a move beyond $4$
              standard deviations a probability of about $0.00006$; the
              generator understates it.
          - text: >
              Estimating the variance of the simulated draws.
            feedback: >
              The variance is exactly $1$ by construction, so that use cannot go
              wrong.
        feedback: >
          Said aloud: twelve uniforms minus six has mean $0$ and variance
          exactly $1$, is excellent near the centre because the uniform is
          bounded and symmetric, and is wrong in the far tails, which stop at
          $\pm 6$.

  - node: quant-probability.limits.law-of-averages-fallacy
    hook: >
      "The wheel is due for red" is the most common wrong intuition an
      interviewer will bait you with, and the correct rebuttal needs both the
      strong law and the CLT's $\sqrt{n}$ scaling to state precisely.
    explanation: >
      The strong law promises the *ratio* $\bar{X}_n=H_n/n$ converges — it
      says nothing about the *difference* $H_n-n/2$ ever shrinking, and that
      difference in fact does the opposite: as a sum of $n$ fair-coin
      indicators, $H_n$ has standard deviation $\sigma\sqrt{n}=\sqrt{n}/2$,
      which grows without bound. Both facts are true of the same sequence at
      once.

      What reconciles them: the ratio shrinks because the denominator $n$
      grows faster than the numerator's typical deviation $\sqrt{n}$ —
      dividing $\sqrt{n}/2$ by $n$ gives $1/(2\sqrt{n})\to0$. A deficit
      accumulated early gets diluted by an ever-larger pile of new data, not
      repaid by a compensating run in the other direction; the expected
      excess itself never shrinks in absolute terms.

      This is exactly why "the wheel is due" betting systems — doubling
      after losses, backing the cold number — are mispriced: they implicitly
      bet the absolute difference will correct itself, but the true theorem
      only ever promised the ratio would.
    worked: >
      Suppose after $n=400$ fair tosses there have been $220$ heads, an
      excess $H_n-n/2=20$. After $10{,}000$ more tosses (total
      $n=10{,}400$), the expected excess is still exactly $20$ — a fair coin
      has no corrective memory — but as a share of the total it has fallen
      from $20/400=5\%$ to $20/10400\approx0.19\%$: the ratio has visibly
      converged toward $1/2$ while the raw head-count is not one head closer
      to matching the tail-count.
    interview: >
      "After a long losing streak, are you due for a win," or "does the law
      of large numbers mean deficits get corrected," both test the same
      distinction — the ratio converges, the difference diverges like
      $\sqrt{n}$, and these are simultaneously true, not contradictory.
    pitfalls: >
      Concluding from "the average converges" that a specific run of bad
      luck must eventually be balanced out — it's diluted, not balanced.
      Quoting the strong law as a fact about the difference $H_n-n/2$ rather
      than the ratio $H_n/n$ misstates what the theorem covers.
    recap: >
      The sample average converges because the ever-growing denominator
      dilutes any fixed deficit, not because the deficit shrinks — it grows
      like $\sqrt{n}$ even as its share of the total vanishes.
    dialogue:
      - part: Thirty tails behind
        teach: >
          A fair coin has been tossed $900$ times: $435$ heads and $465$ tails,
          so heads are $30$ behind. A colleague says heads are now due, since
          the law of large numbers has to pull the counts back together. You
          are about to watch $900$ more tosses.
      - ask: >
          After those $900$ more tosses, what is the expected excess of tails
          over heads?
        expects: "30"
        hint: >
          What is the expected excess produced by the new tosses alone?
        feedback: >
          The new tosses add an expected excess of $0$: each is still fair, and
          a coin has no memory of the first $900$. The expected excess stays
          exactly $30$. Nothing is repaid.
      - ask: >
          The fraction of heads is now $435/900 \approx 0.4833$. What is the
          expected fraction of heads after all $1800$ tosses?
        expects: "0.4917"
        tolerance: 0.0005
        hint: >
          Expected heads: the $435$ you have, plus half of the new $900$.
        feedback: >
          $(435 + 450)/1800 = 885/1800 \approx 0.4917$. The fraction has moved
          halfway to $1/2$ while the expected deficit has not moved at all.
      - ask: >
          How did the fraction approach $1/2$ if the deficit did not shrink?
        choices:
          - text: >
              It did not really: the expected deficit and expected fraction
              cannot both be right.
            feedback: >
              Both are right. Heads sit $15$ below half the tosses before and
              after, but $15/900$ has become $15/1800$: a fixed gap is a smaller
              share of a longer record.
          - text: >
              The new tosses lean slightly towards heads to compensate.
            feedback: >
              They lean nowhere: each new toss is heads with probability
              exactly $1/2$, which is why the expected excess stays at $30$.
          - text: >
              The deficit is diluted: the same $30$ is a smaller share of a
              record twice as long.
            correct: true
            feedback: >
              Right. The ratio converges because the denominator grows, not
              because the past is corrected.
        feedback: >
          Averages converge by dilution. That is the whole content of the law
          of large numbers here, and it promises nothing about the counts
          evening out.

      - part: The gap that keeps growing
        ask: >
          Forget the history and toss a fresh fair coin $3600$ times. What is
          the standard deviation of $H - 1800$, the excess of heads over half
          the tosses?
        expects: "30"
        hint: >
          $H$ is a sum of $3600$ fair indicators, each with variance $1/4$.
        feedback: >
          $\operatorname{Var}(H) = 3600/4 = 900$, so the standard deviation is
          $30$. A gap of $30$ is not a disaster to be repaired: it is the
          typical size of the gap after $3600$ fair tosses, and it grows like
          $\sqrt{n}/2$.
      - ask: >
          And the standard deviation of the fraction $H/3600$?
        expects: "0.00833"
        tolerance: 0.0001
        feedback: >
          $30/3600 = 1/120 \approx 0.00833$, which is $1/(2\sqrt{n})$. The
          absolute gap grows like $\sqrt{n}$ while the fractional gap shrinks
          like $1/\sqrt{n}$.
      - reflect: >
          The fraction of heads converges to $1/2$, yet the gap between heads
          and half the tosses typically grows without bound. Say how both can
          be true at once, and what exactly the colleague who says heads are
          due is betting on.
        hint: >
          Divide the gap by $n$.
        answer: >
          The gap has standard deviation $\sqrt{n}/2$, which grows, but the
          fraction's error is the gap divided by $n$, about $1/(2\sqrt{n})$,
          which shrinks. Since $\sqrt{n}$ grows more slowly than $n$, both hold.
          The strong law is a statement about the ratio only. The colleague is
          betting that the gap itself will close, which no theorem promises:
          the next toss is fair, and the expected gap stays where it is.

      - part: Due, or diluted
        ask: >
          With heads $30$ behind, what is the probability the next toss is
          heads?
        expects: "1/2"
        feedback: >
          Exactly $1/2$, as on every toss. Doubling a stake or backing the
          "cold" side prices a correction that never arrives; in a fair game
          its expected value is still zero, and with a house edge it is still
          negative.
      - ask: >
          Which statement do the strong law and the central limit theorem
          together actually support?
        choices:
          - text: >
              Over a long run, heads will make up the $30$ they are behind.
            feedback: >
              The expected gap from here on stays at $30$, and the typical
              fluctuation grows like $\sqrt{n}$. Nothing pulls the counts back
              together.
          - text: >
              The fraction of heads converges to $1/2$ with probability one,
              while the gap typically grows like $\sqrt{n}$.
            correct: true
            feedback: >
              Right: the strong law for the ratio, the $\sqrt{n}$ scaling of
              the central limit theorem for the difference.
          - text: >
              Neither the fraction nor the gap settles, since the coin has no
              memory.
            feedback: >
              The fraction does settle, with probability one. Memorylessness
              explains why the gap is not repaid; it does not stop the ratio
              from converging.
        feedback: >
          Said aloud: the law of averages works by dilution, not correction —
          the ratio converges, the difference grows like $\sqrt{n}$, and both
          are true at once.

  - node: quant-probability.limits.clt-caveats
    hook: >
      "How accurate is the normal approximation, exactly" and "does the CLT
      ever just fail" are the two questions this node answers precisely,
      rather than waving at "it's approximate."
    explanation: >
      Rate: the CLT itself says nothing about how fast $F_n\to\Phi$, only
      that it happens. Berry–Esseen fills the gap:
      $C\rho/(\sigma^{3}\sqrt{n})$ for a constant $C<0.5$ and
      $\rho=\mathbb{E}|X_1-\mu|^{3}$, meaning the worst-case CDF error
      shrinks only like $1/\sqrt{n}$ — the same slow rate governing every
      estimate in this subbranch — and a skewed summand (large $\rho$) is
      punished directly in that leading term.

      Region: the guarantee is strongest exactly where it's least useful.
      Near the centre the approximation is excellent, but far in the tail,
      where $z$ is allowed to grow with $n$, the *relative* error in
      $1-\Phi(z)$ can be unbounded — precisely why genuine tail risk is
      priced with Chernoff bounds or large-deviation theory instead.

      Hypotheses: finite positive variance can't be relaxed. With infinite
      variance there's no normal limit to converge to, and the standing
      counterexample is the Cauchy law, whose sample average has exactly the
      same distribution as one single draw for every $n$ — sampling more
      buys zero extra precision.
    worked: >
      Berry–Esseen's $1/\sqrt{n}$ rate means quadrupling $n$ only halves the
      guaranteed error bound: if the bound reads $0.02$ at $n=2500$, it
      reads roughly $0.01$ at $n=10000$ — the same $1/\sqrt{n}$ scaling that
      governs the standard error itself, applied to the approximation's
      worst-case error rather than to a confidence interval.
    interview: >
      "Is the normal approximation accurate in the tail" and "what if the
      variance is infinite" are the two follow-ups a good CLT answer should
      already anticipate — Berry–Esseen's rate for the first, the Cauchy
      counterexample for the second.
    pitfalls: >
      Quoting the CLT to justify a tail probability far from the centre —
      rare-event or VaR-style questions — ignores that the relative error
      there isn't controlled by the theorem at all. Assuming any
      well-behaved-looking heavy-tailed variable eventually gets a normal
      limit is false without finite variance, at any $n$.
    recap: >
      The normal limit is accurate only at rate $1/\sqrt{n}$, only near the
      centre, and only when the variance is finite — each limit sharp, not
      a technicality.
    dialogue:
      - part: A reserve for rare claims
        teach: >
          An insurer writes $100$ independent policies, each of which claims
          with probability $0.01$. The claims count has mean $1$ and standard
          deviation $\sqrt{100 \times 0.01 \times 0.99} \approx 0.995$. The
          reserve covers $3$ claims, and the insurer wants the chance of $4$
          or more.
      - ask: >
          Estimate $\Pr(\text{claims} \ge 4)$ with the continuity-corrected
          normal. Use $\Phi(2.51) = 0.9940$.
        expects: "0.006"
        tolerance: 0.0005
        hint: >
          $z = (3.5 - 1)/0.995$.
        feedback: >
          $z \approx 2.51$, so the estimate is $1 - 0.9940 = 0.0060$.
      - ask: >
          The exact binomial answer is $0.0184$, three times larger. What went
          wrong?
        choices:
          - text: >
              Only the size: $100$ summands is too few for any CLT.
            feedback: >
              For a fair coin, $100$ tosses give normal estimates good to about
              two decimals. Size matters only in combination with the shape of
              one summand, and this one is extremely lopsided.
          - text: >
              The continuity correction pushed the cut the wrong way.
            feedback: >
              "At least $4$" takes in the bar for $4$, so cutting at $3.5$ is
              right. The error is in the shape, not the cut.
          - text: >
              One policy's law is badly skewed, a $0$ almost always and a rare
              $1$, and $100$ of them have not washed that out.
            correct: true
            feedback: >
              Right. The total inherits a long right tail that the symmetric
              normal does not have, and the tail is exactly where the reserve
              question lives.
        feedback: >
          The central limit theorem says the error goes to $0$. It does not say
          how fast, and here it has barely started.

      - part: How fast the normal arrives
        reflect: >
          What feature of one policy's law should control how fast the normal
          approximation becomes accurate, and how would you measure it so that
          the answer does not depend on the units of the claim?
        hint: >
          The normal has no asymmetry. Which moment measures asymmetry?
        answer: >
          Asymmetry: the third moment. Measured unit-free it is
          $\rho/\sigma^{3}$, where $\rho = \mathbb{E}|X_1 - \mu|^{3}$. The
          first correction to the normal approximation is proportional to the
          skewness and shrinks like $1/\sqrt{n}$, so a summand with large
          $\rho/\sigma^{3}$ needs many more terms before the bell is accurate.
      - teach: >
          The Berry–Esseen theorem makes this precise: the largest error
          between the CDF of the standardized sum and $\Phi$ is at most
          $C\rho/(\sigma^{3}\sqrt{n})$, with a constant $C < 0.5$. Two facts
          follow at once: the error shrinks only like $1/\sqrt{n}$, and skewed
          summands pay directly through $\rho/\sigma^{3}$.
      - ask: >
          For one policy, $\rho/\sigma^{3} \approx 9.85$. With $C = 0.5$, what
          does Berry–Esseen guarantee at $n = 100$?
        expects: "0.49"
        tolerance: 0.01
        feedback: >
          $0.5 \times 9.85/\sqrt{100} \approx 0.49$, an error bound so large it
          guarantees nothing. That is consistent with what you saw: the tail
          estimate was off by a factor of three.
      - ask: >
          For a fair coin, $\rho/\sigma^{3} = 1$. What is the bound at
          $n = 100$?
        expects: "0.05"
        feedback: >
          $0.5 \times 1/10 = 0.05$, and the true error is smaller still. A
          symmetric summand at $n = 100$ beats the skewed policy by a factor of
          about $10$, and the policy would need roughly $100$ times as many
          terms to match it.

      - part: The centre, not the tail
        ask: >
          A bigger book: $10\,000$ policies claiming with probability $0.1$
          each, so the count has mean $1000$ and standard deviation $30$. Here
          $\rho/\sigma^{3} \approx 2.73$. What is the Berry–Esseen bound with
          $C = 0.5$?
        expects: "0.0137"
        tolerance: 0.0005
        feedback: >
          $0.5 \times 2.73/100 \approx 0.0137$. Every probability read from the
          normal CDF is within about $0.014$ of the truth.
      - ask: >
          The regulator asks for $\Pr(\text{claims} \ge 1180)$, six standard
          deviations out. The normal says about $1.1 \times 10^{-9}$. What does
          the Berry–Esseen bound tell you about that number?
        choices:
          - text: >
              It is correct to within $0.0137$, so it is reliable.
            feedback: >
              An absolute error of $0.0137$ around a probability of
              $10^{-9}$ allows anything from $0$ to $0.0137$. The exact value
              is $2.6 \times 10^{-9}$, more than twice the normal's.
          - text: >
              Essentially nothing: an absolute error bound says nothing about a
              probability far smaller than the bound.
            correct: true
            feedback: >
              Right. The theorem controls the centre. In the far tail the
              relative error can be unbounded, which is why tail risk is priced
              with Chernoff or large-deviation bounds instead.
          - text: >
              That it is too large, since the normal overstates tails.
            feedback: >
              Here the normal understates: the count is skewed right, and the
              exact tail is $2.4$ times the normal's. Either way, the bound
              cannot tell you which direction the error goes.
        feedback: >
          Good near the centre, unreliable far out: quote the CLT for the body
          of a distribution, never for a one-in-a-billion event.

      - part: When there is no variance
        ask: >
          A desk's daily loss is standard Cauchy, whose quartiles are $-1$ and
          $1$. The average of $n$ standard Cauchy draws is again standard
          Cauchy. What is the interquartile range of the average of $400$
          days?
        expects: "2"
        feedback: >
          The average is standard Cauchy, so its quartiles are still $\pm 1$ and
          its interquartile range is $2$, the same as one day. With a finite
          variance, $400$ days would have shrunk the spread twentyfold.
      - ask: >
          What does the central limit theorem say about heavy-tailed summands
          with infinite variance?
        choices:
          - text: >
              The normal limit still holds; it just arrives more slowly.
            feedback: >
              There is no normal limit to arrive at. The Cauchy average is
              Cauchy at every $n$, and $\rho/\sigma^{3}$ is not even defined.
          - text: >
              Nothing: the hypothesis fails, and such sums can converge to
              non-normal stable laws or not settle at all.
            correct: true
            feedback: >
              Right. Finite positive variance is not a technicality of the
              proof: without it there is nothing to standardize by, and the
              limit, if any, is a different law.
          - text: >
              The normal limit holds once you standardize by the sample
              standard deviation instead.
            feedback: >
              The sample standard deviation of Cauchy draws does not settle
              either; it grows with $n$. No standardization recovers a normal
              limit.
        feedback: >
          Said aloud: the CLT is accurate to order $1/\sqrt{n}$, with skew as the
          leading penalty; it is reliable near the centre, not in the far
          tail; and it needs a finite variance.

  - node: quant-probability.limits.slutsky
    hook: >
      This is the theorem that quietly licenses plugging an estimated
      standard deviation into a standardized statistic — skip it and every
      confidence interval built from data alone is unjustified.
    explanation: >
      The setup pairs a sequence converging in distribution, possibly to
      something genuinely random, with a second sequence collapsing to a
      constant in probability. The claim — that the pair combines the way
      you'd hope, $X_n+Y_n\to X+c$, $X_nY_n\to cX$, $X_n/Y_n\to X/c$ for
      $c\ne0$ — looks almost too obvious to need a name, but distributional
      convergence alone carries no information about how two sequences move
      together; without $Y_n$'s target being a fixed, spread-free constant,
      none of these rules would hold.

      Why the constant matters: if $Y_n$ converged in distribution to
      something random instead, $X_n$ and $Y_n$ could correlate arbitrarily
      — two variables can each individually converge in distribution while
      their sum does something the marginals never predicted. A constant
      target correlates with nothing, so there's nothing left to go wrong.

      The everyday use is substitution: a standardized statistic uses the
      true $\sigma$, normally unknown, but if an estimator $s_n\to\sigma$ in
      probability, Slutsky says swapping $s_n$ in for $\sigma$ changes
      nothing about the limiting law — the one step turning a theoretical
      CLT statement into a number computable from data alone.
    worked: >
      Suppose $\sqrt{n}(\bar{X}_n-\mu)\to N(0,9)$ in distribution
      ($\sigma=3$), and a separate estimator $T_n\to3.2$ in probability
      rather than the true $3$. By Slutsky,
      $\sqrt{n}(\bar{X}_n-\mu)/T_n\to N(0,9)/3.2$, i.e. a $N(0,1)$ variable
      scaled by $3/3.2=0.9375$ — so a $95\%$ interval built by treating
      $T_n$ as if it were exactly $\sigma$ would come out about $6.7\%$ too
      wide, since $3.2/3\approx1.067$.
    interview: >
      "Why is it valid to plug the sample standard deviation into a
      standardized test statistic" is answered by naming Slutsky's theorem
      and $s_n\to\sigma$ in probability. A common trap asks whether the same
      substitution works when the "constant" is itself random.
    pitfalls: >
      Applying the product or quotient rule when the second sequence
      converges to something random, not a constant, is generally false —
      joint behavior can't be inferred from two separate marginal limits.
      Dividing by $Y_n\to c=0$ violates the explicit $c\ne0$ requirement.
    recap: >
      A distributional limit survives being added to, multiplied by, or
      divided by anything converging in probability to a fixed constant —
      the licence to substitute an estimate for an unknown parameter.
    dialogue:
      - part: A statistic with an estimate inside
        teach: >
          A strategy has $400$ daily returns with sample mean $0.12$ and sample
          standard deviation $s = 1.6$, in percent. You want to know whether
          its true mean could be $0$. The true standard deviation $\sigma$ is
          unknown.
      - ask: >
          Compute $t = \sqrt{n}\,\bar{X}_n/s$ for the hypothesis of a zero mean.
        expects: "1.5"
        feedback: >
          $\sqrt{400} \times 0.12/1.6 = 20 \times 0.075 = 1.5$.
      - ask: >
          Can you compare $1.5$ with the standard normal table?
        choices:
          - text: >
              Yes: the central limit theorem says this statistic is
              approximately $N(0,1)$.
            feedback: >
              The theorem standardizes by the true $\sigma$. Your statistic
              divides by $s$, which is itself random, and nothing yet says the
              ratio keeps the same limit.
          - text: >
              No: with an estimated $\sigma$ the statistic has no normal
              limit at all.
            feedback: >
              Too pessimistic. $s$ is a very good estimate at $n = 400$; the
              question is what licenses using it, not whether it can be used.
          - text: >
              Not yet: the CLT covers $\sqrt{n}\,\bar{X}_n/\sigma$, and you
              need a reason the random $s$ can stand in for $\sigma$.
            correct: true
            feedback: >
              Right. You have one sequence converging in distribution and a
              second, $s/\sigma$, converging to $1$. You need a rule for
              combining them.
        feedback: >
          Every confidence interval computed from data alone has this gap in
          it.

      - part: Combining two limits
        reflect: >
          $\sqrt{n}\,\bar{X}_n/\sigma \to N(0,1)$ in distribution, and
          $s_n/\sigma \to 1$ in probability. Why should their ratio still
          converge to $N(0,1)$? And why would the argument be in trouble if the
          second sequence converged only in distribution, to a random limit?
        hint: >
          Convergence in distribution says nothing about how two sequences
          move together. What kind of limit cannot move with anything?
        answer: >
          The second factor collapses onto the constant $1$: with probability
          tending to one it is within any tolerance of $1$, so dividing by it
          changes the first sequence by an arbitrarily small factor, whatever
          the two do jointly. A random limit could be tied to the first
          sequence — large exactly when it is large — and two marginal laws
          cannot tell you that. A constant correlates with nothing.
      - teach: >
          This is Slutsky's theorem: if $X_n \to X$ in distribution and
          $Y_n \to c$ in probability for a constant $c$, then
          $X_n + Y_n \to X + c$, $X_nY_n \to cX$, and $X_n/Y_n \to X/c$ when
          $c \ne 0$, all in distribution. With $s_n \to \sigma$, your
          statistic has the standard normal limit, so $1.5$ can be read off
          the table.
      - ask: >
          Suppose $X_n \to N(0,1)$ in distribution and $Y_n \to 2$ in
          probability. What does $\Pr(X_n + Y_n \le 3)$ converge to? Use
          $\Phi(1) = 0.8413$.
        expects: "0.8413"
        tolerance: 0.0005
        hint: >
          $X_n + Y_n \to Z + 2$ with $Z$ standard normal.
        feedback: >
          $\Pr(Z + 2 \le 3) = \Phi(1) = 0.8413$.
      - ask: >
          Same sequences. What does $\Pr(X_n/Y_n > 1)$ converge to? Use
          $\Phi(2) = 0.9772$.
        expects: "0.0228"
        tolerance: 0.0005
        hint: >
          $X_n/Y_n \to Z/2$.
        feedback: >
          $\Pr(Z/2 > 1) = \Pr(Z > 2) = 1 - 0.9772 = 0.0228$.

      - part: Why the constant is essential
        ask: >
          Let $Z$ be standard normal, $X_n = Z$ and $Y_n = -Z$ for every $n$.
          Each converges in distribution to $N(0,1)$. What is the variance of
          $X_n + Y_n$?
        expects: "0"
        feedback: >
          $X_n + Y_n = 0$ exactly. Had $Y_n$ been an independent standard
          normal, with the same marginal law, the sum would have variance $2$.
      - ask: >
          What does that example show?
        choices:
          - text: >
              Slutsky's theorem is false.
            feedback: >
              Slutsky needs $Y_n \to c$ in probability for a constant $c$.
              Here $Y_n$ has a random limit, so the theorem was never
              invoked.
          - text: >
              With a random second limit, the marginal limits do not determine
              the limit of the sum.
            correct: true
            feedback: >
              Right. The same two marginal limits gave a sum of $0$ here and a
              sum of variance $2$ with independence. Only a constant second
              limit removes the joint behaviour from the question.
          - text: >
              The two sequences must be independent for limits to add.
            feedback: >
              Independence would rescue this example, but Slutsky does not ask
              for it: $Y_n$ may depend on $X_n$ in any way at all, provided its
              limit is a constant. Your $s_n$ is computed from the very same
              data as $\bar{X}_n$.
        feedback: >
          Convergence in distribution carries no joint information, so the
          second limit must be a constant.
      - ask: >
          Now $Y_n = 1/n$, which converges to $0$ in probability. What happens
          to $X_n/Y_n = nX_n$ when $X_n \to N(0,1)$?
        choices:
          - text: >
              It converges to $Z/0$, which is infinite.
            feedback: >
              $Z/0$ is not a law. The quotient rule requires $c \ne 0$ exactly
              because dividing by something collapsing to $0$ has no
              distributional limit.
          - text: >
              It has no limit in distribution: its spread grows like $n$.
            correct: true
            feedback: >
              Right. For any fixed $K$, $\Pr(|nX_n| > K) \to 1$: the law
              spreads out without settling. The quotient rule's $c \ne 0$ is
              not decoration.
        feedback: >
          The sum and product rules hold for any constant; the quotient needs
          a nonzero one.
      - ask: >
          Back to the strategy. Using Slutsky's licence to replace $\sigma$ by
          $s = 1.6$, what is the half-width of a $95\%$ confidence interval for
          the mean, with $z = 1.96$?
        expects: "0.1568"
        tolerance: 0.0005
        hint: >
          $1.96 \times s/\sqrt{n}$.
        feedback: >
          $1.96 \times 1.6/20 = 0.1568$. The interval $0.12 \pm 0.157$ contains
          $0$, consistent with $t = 1.5 < 1.96$. Said aloud: the plug-in is
          valid because $s \to \sigma$ in probability, and Slutsky lets a
          distributional limit absorb anything converging to a constant.

  - node: quant-probability.limits.delta-method
    hook: >
      Whenever the quantity you care about is some nonlinear function of a
      sample average — a ratio, a log-return, an odds — this is the one-line
      recipe for its standard error, and forgetting the $g'(\mu)$ factor is
      the standard way to misprice it.
    explanation: >
      The engine is a first-order Taylor expansion of $g$ around $\mu$:
      $g(\bar{X}_n)\approx g(\mu)+g'(\mu)(\bar{X}_n-\mu)$. This is valid
      because $\bar{X}_n$ already concentrates tightly around $\mu$ — its
      standard error shrinks like $1/\sqrt{n}$ — so only the immediate
      neighborhood of $\mu$ is ever visited, and the higher-order terms
      become negligible relative to the linear one as $n$ grows.

      Once that linear approximation holds, $g(\bar{X}_n)-g(\mu)$ inherits
      the CLT's normal fluctuation directly, rescaled by the constant
      $g'(\mu)$ — a linear function of an asymptotically normal variable is
      itself asymptotically normal with variance scaled by the square of
      that constant. Formally, Slutsky's theorem is what licenses discarding
      the remainder term.

      The one condition that can't be dropped is $g'(\mu)\ne0$. At a
      critical point of $g$, the linear term the whole argument leans on
      vanishes identically, and the leading behavior is governed by the
      quadratic term instead — the limit becomes a scaled chi-square, an
      entirely different shape, not a normal forced through the same
      formula.
    worked: >
      From $n=400$ iid Bernoulli($0.3$) draws, estimate $g(p)=\sqrt{p}$.
      Here $g'(p)=1/(2\sqrt{p})$, so $g'(0.3)=1/(2\times0.5477)\approx
      0.9129$. The estimator $\hat{p}$ has standard error
      $\sqrt{0.3\times0.7/400}=\sqrt{0.000525}\approx0.0229$, so
      $g(\hat{p})=\sqrt{\hat{p}}$ has standard error approximately
      $0.9129\times0.0229\approx0.0209$ about the true value
      $\sqrt{0.3}\approx0.5477$.
    interview: >
      "If $\hat{p}$ has standard error $s$, what's the standard error of
      [some function of $\hat{p}$]" is answered directly with
      $|g'(\mu)|\times s$. The interviewer checks the derivative is
      evaluated at the true parameter and that squaring for variance versus
      the plain factor for standard error isn't confused.
    pitfalls: >
      Forgetting to square $g'(\mu)$ when writing the *variance* formula,
      versus using it unsquared for the standard error, is a constant
      source of factor-of-two errors. Applying the method where
      $g'(\mu)=0$ silently produces the wrong limit; a chi-square takes over
      instead.
    recap: >
      A smooth function of a sample mean is itself asymptotically normal,
      with standard error scaled by $|g'(\mu)|$ — valid because
      $\bar{X}_n$ concentrates near $\mu$, and only when that derivative is
      nonzero.
    dialogue:
      - part: Reporting a log, not an average
        teach: >
          A stock's daily traded volume, in millions of shares, is iid with
          mean $4$ and standard deviation $2$. You average $100$ days, but the
          risk model wants $\ln \bar{X}$, the log of the average, and its
          standard error.
      - ask: >
          First the average itself. What is the standard error of
          $\bar{X}_{100}$?
        expects: "0.2"
        feedback: >
          $2/\sqrt{100} = 0.2$. So $\bar{X}$ typically lands between about
          $3.8$ and $4.2$.
      - ask: >
          The slow way: push one standard error through the log. What is
          $\ln 4.2 - \ln 4$? Use $\ln 1.05 \approx 0.0488$.
        expects: "0.0488"
        tolerance: 0.0005
        feedback: >
          $\ln 4.2 - \ln 4 = \ln 1.05 \approx 0.0488$. On the other side,
          $\ln 3.8 - \ln 4 = \ln 0.95 \approx -0.0513$. A wobble of $\pm 0.2$
          in $\bar{X}$ became a wobble of about $\pm 0.05$ in $\ln \bar{X}$.
      - ask: >
          So what is the standard error of $\ln \bar{X}_{100}$, roughly?
        choices:
          - text: >
              About $\ln 0.2 \approx -1.6$: take the log of the standard error.
            feedback: >
              A standard error is a size of wobble, not a value of the
              variable, and logs of wobbles mean nothing. You just watched a
              wobble of $0.2$ become one of $0.05$.
          - text: >
              About $0.05$: the log turns a wobble of $0.2$ into one of about
              $0.05$.
            correct: true
            feedback: >
              Right. Near $4$ the log is nearly a straight line, so it scales
              small wobbles by a fixed factor, here about $1/4$.
          - text: >
              About $0.2$: a function of the average has the average's
              standard error.
            feedback: >
              Only if the function has slope $1$. The log rises by about
              $0.05$ when its input rises by $0.2$, so it shrinks wobbles near
              $4$.
        feedback: >
          The slow way works, but it took two logarithms and a guess that the
          two sides are nearly symmetric.

      - part: The one number that did the work
        reflect: >
          Without computing any logarithms, which single number tells you how
          a small wobble of $\bar{X}$ around $4$ becomes a wobble of
          $\ln \bar{X}$? And why does it get more accurate as $n$ grows?
        hint: >
          Write the first-order Taylor expansion of $g$ around $\mu$.
        answer: >
          The slope $g'(\mu)$: near $\mu$,
          $g(\bar{X}) \approx g(\mu) + g'(\mu)(\bar{X} - \mu)$, so the wobble
          is multiplied by $g'(4) = 1/4$, and $0.2/4 = 0.05$. As $n$ grows,
          $\bar{X}$ stays ever closer to $\mu$, where the straight-line
          approximation is ever better; the curvature term shrinks like $1/n$
          while the linear term shrinks only like $1/\sqrt{n}$.
      - teach: >
          This is the delta method. If
          $\sqrt{n}(\bar{X}_n - \mu) \to N(0, \sigma^{2})$ in distribution and
          $g$ is differentiable at $\mu$ with $g'(\mu) \ne 0$, then
          $\sqrt{n}(g(\bar{X}_n) - g(\mu)) \to N(0, g'(\mu)^{2}\sigma^{2})$. In
          practice: standard error of $g(\bar{X})$ is $|g'(\mu)|$ times the
          standard error of $\bar{X}$.
      - ask: >
          The model now wants $\bar{X}^{2}$ instead. What is its approximate
          standard error at $n = 100$?
        expects: "1.6"
        hint: >
          $g(x) = x^{2}$, so $g'(4) = 8$.
        feedback: >
          $|g'(4)| \times 0.2 = 8 \times 0.2 = 1.6$, about the true value
          $g(4) = 16$.
      - ask: >
          For the same $g(x) = x^{2}$, what is the asymptotic variance in
          $\sqrt{n}(g(\bar{X}_n) - g(\mu)) \to N(0, v)$?
        expects: "256"
        hint: >
          Variance scales by the square of the slope.
        feedback: >
          $v = g'(\mu)^{2}\sigma^{2} = 64 \times 4 = 256$. The standard error
          uses $|g'|$; the variance uses $g'^{2}$. Mixing them up is the usual
          slip.
      - ask: >
          In the proof, $g(\bar{X}_n) - g(\mu) = g'(\mu)(\bar{X}_n - \mu) + R_n$,
          and $\sqrt{n}R_n \to 0$ in probability. What licenses throwing
          $\sqrt{n}R_n$ away?
        choices:
          - text: >
              Slutsky's theorem: adding a sequence that converges to the
              constant $0$ in probability leaves the limit in distribution
              unchanged.
            correct: true
            feedback: >
              Right. The linear part converges to $N(0, g'(\mu)^{2}\sigma^{2})$
              by the central limit theorem, and the remainder is exactly the
              kind of term Slutsky absorbs.
          - text: >
              The central limit theorem applied to $R_n$.
            feedback: >
              $R_n$ is not a sum of iid terms; it is a Taylor remainder. What is
              needed is that it vanishes, and a rule that lets a vanishing term
              be dropped.
          - text: >
              Nothing: the remainder is exactly $0$ for smooth $g$.
            feedback: >
              For $g(x) = x^{2}$ the remainder is $(\bar{X}_n - \mu)^{2}$, not
              $0$. It is small, of order $1/n$, and that is what makes it
              negligible after multiplying by $\sqrt{n}$.
        feedback: >
          The delta method is the CLT for the linear part plus Slutsky for the
          rest.

      - part: When the slope is zero
        ask: >
          Now report $g(\bar{X}) = (\bar{X} - 4)^{2}$, a squared tracking error
          against the true mean. What standard error does the delta-method
          formula give?
        expects: "0"
        hint: >
          Evaluate $g'(x) = 2(x - 4)$ at $\mu = 4$.
        feedback: >
          $g'(4) = 0$, so the formula gives $0 \times 0.2 = 0$. That cannot be
          the truth: $(\bar{X} - 4)^{2}$ is random.
      - ask: >
          What is $\mathbb{E}[(\bar{X}_{100} - 4)^{2}]$?
        expects: "0.04"
        hint: >
          It is the variance of $\bar{X}_{100}$.
        feedback: >
          $\operatorname{Var}(\bar{X}_{100}) = 4/100 = 0.04$. The quantity is
          of order $1/n$, not $1/\sqrt{n}$, which is why the first-order term
          sees nothing.
      - ask: >
          What is the right description of $g(\bar{X}_n)$ when $g'(\mu) = 0$?
        choices:
          - text: >
              It is degenerate: its limit law is a point mass, as the formula
              says.
            feedback: >
              Only on the $\sqrt{n}$ scale. On the $n$ scale it has a genuine
              random limit, and quoting a standard error of $0$ would badly
              misstate the risk.
          - text: >
              The quadratic term takes over: $n(\bar{X}_n - 4)^{2}/\sigma^{2}$
              converges to a chi-square with one degree of freedom.
            correct: true
            feedback: >
              Right. With the linear term gone, the second-order Taylor term
              leads, and the limit is a squared normal, not a normal.
          - text: >
              It is still asymptotically normal, with a smaller variance.
            feedback: >
              $g(\bar{X}_n) \ge 0$ always, and its law piles up against $0$:
              a squared normal is badly skewed, not a normal of any variance.
        feedback: >
          Said aloud: the standard error of $g(\bar{X})$ is $|g'(\mu)|$ times
          that of $\bar{X}$, provided $g'(\mu) \ne 0$; at a flat point the
          quadratic term leads and the limit is chi-square.

  - node: quant-probability.limits.borel-cantelli
    hook: >
      This is the standard tool for upgrading a merely-summable sequence of
      small probabilities into a with-probability-one statement about an
      entire infinite sequence of events — exactly the machinery behind
      promoting convergence in probability to almost sure convergence.
    explanation: >
      First lemma, no independence needed: if $\sum_n\Pr(A_n)<\infty$, then
      with probability $1$ only finitely many of the $A_n$ occur. The proof
      is the union bound pushed to the tail: the chance that *some* event
      from $A_n$ onward happens is at most $\sum_{m\ge n}\Pr(A_m)$, and a
      summable series' tail sum shrinks to $0$ as $n\to\infty$ — so
      eventually the chance of any further occurrence is arbitrarily small.

      Second lemma needs independence to run the opposite direction: if the
      $A_n$ are independent and $\sum_n\Pr(A_n)=\infty$, then with
      probability $1$ infinitely many occur. Independence is not decoration
      — without it, a divergent sum is compatible with the same event
      repeated forever, which doesn't recur in any new way.

      The link back to convergence: if the deviation probabilities
      $\Pr(|X_n-X|>\varepsilon)$ are summable for every $\varepsilon$ — a
      strictly stronger hypothesis than merely tending to $0$ — the first
      lemma upgrades convergence in probability all the way to almost sure
      convergence, a concrete mechanism for proving it directly.
    worked: >
      Let $A_n$ be the event that toss $n$ of a biased coin, heads
      probability $1/n^{2}$, comes up heads. Since
      $\sum_n1/n^{2}=\pi^{2}/6<\infty$, the first lemma says with
      probability $1$ only finitely many heads occur across the entire
      infinite sequence — eventually every toss is tails. Contrast: if
      instead $\Pr(A_n)=1/n$ with independent tosses, $\sum_n1/n=\infty$
      diverges, so the second lemma says heads occurs infinitely often with
      probability $1$, despite each single toss's chance shrinking to $0$.
    interview: >
      "If independent events have probabilities summing to infinity, does
      at least one occur," or "does this shrinking-probability sequence
      eventually stop happening," are Borel–Cantelli questions — check
      summability first, and in the divergent case name independence
      explicitly as the extra ingredient.
    pitfalls: >
      Applying the second lemma's "infinitely often" conclusion to a
      divergent sum without checking independence is false in general.
      Confusing $\Pr(A_n)\to0$ with $\sum_n\Pr(A_n)<\infty$ — the first
      lemma needs the stronger, summable condition.
    recap: >
      Summable event probabilities mean only finitely many occur, with
      probability $1$ and no independence needed; a divergent sum of
      independent probabilities means infinitely many occur, with
      probability $1$.
    dialogue:
      - part: Glitches that fade fast
        teach: >
          A new matching engine can suffer a glitch on day $n$ with probability
          $0.9^{n}$: it beds in quickly. The vendor says nothing about whether
          glitches on different days are related. You want to know whether the
          engine eventually stops glitching for good.
      - ask: >
          What is the expected total number of glitches over all days, $n = 1,
          2, 3, \dots$?
        expects: "9"
        hint: >
          An expected count is a sum of probabilities; this one is geometric.
        feedback: >
          $\sum_{n \ge 1} 0.9^{n} = 0.9/(1 - 0.9) = 9$. Finite, whatever the
          dependence between days, since linearity needs none.
      - ask: >
          Bound the probability of any glitch at all from day $50$ onward.
        expects: "0.0515"
        tolerance: 0.0005
        hint: >
          The probability of a union is at most the sum:
          $\sum_{n \ge 50} 0.9^{n} = 0.9^{50}/0.1$. Use $0.9^{50} \approx 0.00515$.
        feedback: >
          $0.00515/0.1 = 0.0515$. From day $30$ the same bound is $0.424$;
          from day $100$ it is below $0.0003$. The tail of a convergent series
          goes to $0$.
      - ask: >
          So what is the probability that the engine glitches on infinitely
          many days?
        choices:
          - text: >
              Small but positive: each day still has some chance of a glitch.
            feedback: >
              Infinitely many glitches means a glitch after every day $N$, so
              its probability is at most the tail bound from any $N$ — $0.0515$,
              then $0.0003$, then anything you like. It must be $0$.
          - text: >
              $0$: it is below the tail sum from every day $N$, and those tails
              go to $0$.
            correct: true
            feedback: >
              Right. With probability $1$ only finitely many glitches occur: the
              engine eventually stops for good.
          - text: >
              It cannot be known without knowing how the days are related.
            feedback: >
              The union bound holds for any dependence at all, so the argument
              never needed it.
        feedback: >
          Summable probabilities, union bound on the tail, and the tail goes to
          zero.

      - part: What the argument needed
        reflect: >
          Look back at that argument. What exactly did it need from the numbers
          $0.9^{n}$, and did it use anything about how glitches on different
          days are related?
        hint: >
          Which step would fail for probabilities $1/n$?
        answer: >
          It needed only that $\sum_n \Pr(A_n) < \infty$, so that the tail sums
          $\sum_{m \ge n} \Pr(A_m)$ go to $0$; the union bound then pins the
          probability of infinitely many occurrences at $0$. Nothing about
          dependence was used, since the union bound holds for any events. For
          probabilities $1/n$ the tail sums are infinite and the argument says
          nothing.
      - teach: >
          This is the first Borel–Cantelli lemma: if
          $\sum_n \Pr(A_n) < \infty$, then with probability $1$ only finitely
          many of the $A_n$ occur, with no independence assumed. The second
          lemma runs the other way: if the $A_n$ are independent and
          $\sum_n \Pr(A_n) = \infty$, then with probability $1$ infinitely many
          occur.
      - ask: >
          A second engine glitches on day $n$ with probability $1/(2n)$,
          independently across days. Using $1 - x \le e^{-x}$ and
          $\sum_{n=100}^{10000} 1/n \approx \ln 100$, estimate the probability
          of no glitch on any of days $100$ through $10\,000$.
        expects: "0.1"
        tolerance: 0.005
        hint: >
          Independence turns "no glitch on any day" into a product of
          $(1 - 1/(2n))$.
        feedback: >
          $\prod (1 - 1/(2n)) \le \exp(-\tfrac{1}{2}\sum 1/n) \approx \exp(-\tfrac{1}{2}\ln 100) = 1/10$.
          The exact product is $0.0996$. Out to day $M$ the quiet probability
          is about $\sqrt{100/M}$, which goes to $0$.
      - ask: >
          What does that say about the second engine?
        choices:
          - text: >
              It glitches infinitely often, with probability $1$.
            correct: true
            feedback: >
              Right. After any day, a quiet stretch forever has probability
              $0$, so another glitch always comes. That is the second lemma,
              with $\sum 1/(2n) = \infty$.
          - text: >
              It eventually stops, since $1/(2n) \to 0$.
            feedback: >
              Shrinking probabilities are not enough; they must be summable.
              $\sum 1/(2n)$ diverges, and with independence the glitches never
              stop.
          - text: >
              It glitches on a positive fraction of days.
            feedback: >
              Infinitely many is not a positive fraction. Up to day $M$ it
              expects only about $\tfrac{1}{2}\ln M$ glitches, a vanishing
              share of the days, yet they keep coming.
        feedback: >
          Divergent sums of independent probabilities: the events never stop.

      - part: The hypothesis the second lemma cannot lose
        ask: >
          A third engine has a single latent bug, present with probability
          $1/2$; if present, it glitches every day, and otherwise never. Each
          day's glitch probability is $1/2$, so the sum diverges. What is the
          probability of infinitely many glitches?
        expects: "1/2"
        feedback: >
          Infinitely many glitches happen exactly when the bug is present:
          probability $1/2$, not $1$. Without independence a divergent sum can
          come from one event repeated, and the second lemma's conclusion
          fails.
      - ask: >
          Back to convergence: suppose that for each $\varepsilon > 0$ there is
          a constant $C$ with $\Pr(|X_n - X| > \varepsilon) \le C/n^{2}$. What
          follows?
        choices:
          - text: >
              Only convergence in probability, since the bound is per $n$.
            feedback: >
              The per-$n$ bounds are summable, and the first lemma converts
              summable per-$n$ bounds into a statement about the whole path.
          - text: >
              Almost sure convergence, but only if the deviations are
              independent across $n$.
            feedback: >
              The first lemma needs no independence. Deviations of a running
              average are heavily dependent, and the argument still works.
          - text: >
              Almost sure convergence: by the first lemma only finitely many
              $n$ miss by more than $\varepsilon$, with probability $1$.
            correct: true
            feedback: >
              Right. Summable deviation probabilities upgrade convergence in
              probability to almost sure convergence.
        feedback: >
          Said aloud: summable probabilities, finitely many occur, no
          independence needed; divergent sum plus independence, infinitely
          many occur — and independence is the hypothesis to name.

  - node: quant-probability.limits.root-n
    hook: >
      This is the one number every "how much data do I need" question
      collapses to, and inverting it on the spot — so many trades, so many
      observations — is worth more than any other single skill in this
      subbranch.
    explanation: >
      Every accuracy claim built on the CLT has the identical shape: an
      average of $n$ independent observations sits within roughly
      $\sigma/\sqrt{n}$ of the truth, with $95\%$-style confidence
      corresponding to about $1.96$ of those units. That one expression is
      the entire content behind confidence intervals, Monte Carlo error, and
      the reliability of a backtested trading edge — only the specific
      $\sigma$ and target change from problem to problem.

      The consequence worth having automatic: precision is quadratically
      expensive. To cut the error in half, $\sqrt{n}$ must double, so $n$
      must quadruple; to gain one more decimal digit of accuracy, $n$ must
      grow by a factor of $100$. This is why "just collect ten times more
      data" buys far less than intuition suggests.

      Two standard readings worth reproducing cold: pinning a mean to a
      target absolute tolerance at a given confidence solves
      $z\sigma/\sqrt{n}=\text{tolerance}$ for $n$; resolving a trading edge
      of a given size in standard-deviation units at a target number of
      standard errors solves $\sqrt{n}\times(\text{edge size})=
      (\text{target }z)$ for $n$ — the same inversion of the same formula,
      relabelled.
    worked: >
      A poll wants a proportion pinned to within $\pm2$ percentage points
      at $95\%$ confidence, using the conservative worst-case
      $\sigma=\sqrt{0.5\times0.5}=0.5$. Solve
      $1.96\times0.5/\sqrt{n}=0.02$: $\sqrt{n}=1.96\times0.5/0.02=49$, so
      $n=49^{2}=2401$ — matching the sample sizes real pollsters actually
      use, from the identical $1/\sqrt{n}$ formula that governs the trading
      and Monte Carlo cases.
    interview: >
      "How many samples do I need for [some target precision]" — polling
      margins, backtest sample size, Monte Carlo path count — is answered by
      inverting $\sigma/\sqrt{n}$; the interviewer checks that you square
      the tolerance's inverse, not scale linearly with it.
    pitfalls: >
      Solving for $n$ linearly in the tolerance instead of quadratically —
      halving a target error and only doubling $n$ — badly undersizes the
      sample. Using a stand-in $\sigma$ from an unrelated problem silently
      mis-scales the whole calculation.
    recap: >
      Accuracy costs quadratically under the CLT — $\sigma/\sqrt{n}$ per
      unit of error — so halving an error needs four times the data, the
      single inversion answering every "how much data" question in the
      subbranch.
    dialogue:
      - part: Ten times the data
        teach: >
          A backtest of $250$ trading days estimates a strategy's mean daily
          return with a standard error of $0.08$ percentage points. The
          research head offers you $2500$ days of history instead, ten times as
          much.
      - ask: >
          What standard error should you expect from the $2500$ days?
        expects: "0.0253"
        tolerance: 0.0005
        hint: >
          The standard error is $\sigma/\sqrt{n}$; $n$ is ten times larger.
        feedback: >
          $0.08/\sqrt{10} \approx 0.0253$. Not $0.008$: ten times the data buys
          a factor of $\sqrt{10} \approx 3.16$ in precision, not $10$.
      - ask: >
          How many trading days would bring the standard error down to $0.01$?
        expects: "16000"
        hint: >
          The error must fall by a factor of $8$. By what factor must $n$ grow?
        feedback: >
          A factor of $8$ in error needs $8^{2} = 64$ times the data:
          $250 \times 64 = 16\,000$ days, about $64$ years of history. The
          precision you want may not exist in the market's record at all.
      - ask: >
          Which statement about buying precision with data is right?
        choices:
          - text: >
              Doubling the data halves the error.
            feedback: >
              Doubling $n$ multiplies the error by $1/\sqrt{2} \approx 0.71$, a
              $29\%$ cut. Halving the error takes four times the data.
          - text: >
              Each extra decimal digit of precision costs $100$ times the data.
            correct: true
            feedback: >
              Right. One more digit is a factor of $10$ in error, which is a
              factor of $10^{2} = 100$ in $n$.
          - text: >
              Past a few thousand observations, more data stops helping.
            feedback: >
              It never stops helping; it keeps helping at the same slow rate.
              Every quadrupling halves the error, at $n = 10$ or at
              $n = 10^{6}$.
        feedback: >
          The returns diminish, but never stop: precision is quadratically
          expensive.

      - part: Why the square root is everywhere
        reflect: >
          Confidence intervals, Monte Carlo error bars, and the time it takes
          to prove a trading edge all scale the same way. Say what single fact
          they share, and why it makes precision cost the square of the gain.
        hint: >
          Each is an average of $n$ roughly independent observations.
        answer: >
          Each is an average of $n$ independent observations, so its spread is
          $\sigma/\sqrt{n}$: the noise in the total grows like $\sqrt{n}$
          while the total itself grows like $n$. Precision is the reciprocal of
          that spread, so it grows only like $\sqrt{n}$, and gaining a factor
          $k$ in precision costs a factor $k^{2}$ in data. Only $\sigma$ and the
          target change from problem to problem.
      - teach: >
          So every accuracy claim in this unit has one shape: an average of $n$
          independent observations sits within about $\sigma/\sqrt{n}$ of the
          truth. To pin it to a tolerance at confidence $z$, solve
          $z\sigma/\sqrt{n} = \text{tolerance}$. To see an edge of a given size
          at $z$ standard errors, solve $\sqrt{n} \times \text{edge} = z$.
      - ask: >
          A strategy has an annualized Sharpe ratio of $1.5$, so after $T$ years
          the $t$-statistic of its mean return is about $1.5\sqrt{T}$. How many
          years of live trading until that $t$-statistic reaches $3$?
        expects: "4"
        hint: >
          Solve $1.5\sqrt{T} = 3$.
        feedback: >
          $\sqrt{T} = 2$, so $T = 4$ years. An excellent strategy still needs
          years to prove itself, and one with Sharpe $0.75$ would need $16$.
      - ask: >
          A Monte Carlo pricer adds a control variate that cuts the variance per
          path by $75\%$. Its effect on the standard error is the same as
          multiplying the number of paths by what factor?
        expects: "4"
        hint: >
          The standard error is $\sqrt{\text{variance per path}/n}$.
        feedback: >
          Variance per path falls to $1/4$, which divides the standard error by
          $2$ — exactly what $4$ times the paths would do. Variance reduction
          beats buying paths because it attacks $\sigma$, which enters
          linearly, rather than $n$, which enters under a square root.

      - part: Where the square root misleads
        ask: >
          The pricer also has a discretization bias of $0.05$ in every path. What
          does running $100$ times as many paths do to the total error?
        choices:
          - text: >
              It divides the total error by $10$.
            feedback: >
              It divides the random part by $10$. The bias is the same $0.05$
              in every path, so averaging more paths cannot touch it.
          - text: >
              It shrinks the random error by $10$ and leaves the $0.05$ bias
              untouched.
            correct: true
            feedback: >
              Right. $\sigma/\sqrt{n}$ describes the noise in an average, not a
              systematic error. Once the noise is below the bias, more paths
              buy nothing.
          - text: >
              It removes the bias too, by the law of large numbers.
            feedback: >
              The law of large numbers sends the average to its expectation,
              and the expectation is the biased value. The average converges,
              to the wrong number.
        feedback: >
          The $1/\sqrt{n}$ law prices noise, never bias.
      - ask: >
          A researcher computes $20$-day returns starting on every one of
          $2500$ days and treats them as $2500$ independent observations. What
          is wrong with quoting $\sigma/\sqrt{2500}$?
        choices:
          - text: >
              Nothing: there are $2500$ windows, so $n = 2500$.
            feedback: >
              Neighbouring windows share $19$ of their $20$ days, so they are
              strongly correlated. The $1/\sqrt{n}$ law needs roughly independent
              observations.
          - text: >
              The windows overlap, so there are only about $125$ independent
              ones, and the true standard error is about $\sqrt{20} \approx 4.5$
              times larger.
            correct: true
            feedback: >
              Right. $2500/20 = 125$ non-overlapping windows carry essentially
              all the information. Counting overlapping ones overstates
              precision badly.
          - text: >
              The returns should be daily, not $20$-day, so the answer is too
              large.
            feedback: >
              The horizon is a choice; the error is in treating correlated
              windows as independent, which makes the quoted standard error too
              small, not too large.
        feedback: >
          Said aloud: error shrinks like $\sigma/\sqrt{n}$, so halving it costs
          four times the data — as long as the observations are independent and
          the error is noise, not bias.
