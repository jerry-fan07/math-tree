unit: quant-games.ev-games
opening: >
  Every game in this unit reduces to one question — what is the expected
  payoff, and does that number tell the whole story? The first stretch is
  pure pricing: fair value as expectation, the symmetry moves that answer
  a question before you write a sum, and conditioning on the first roll or
  draw to collapse a multi-stage game into one equation. From there the
  unit turns to optionality — the right to look before you commit is worth
  money, re-roll ladders read as price lists, and stopping games show when
  waiting for information pays and when it provably cannot. It closes on
  the limit of expected value itself: risk aversion, the certainty
  equivalent that prices it, and why a small repeatable edge still needs
  enormous volume before it is more than noise.
lessons:
  - node: quant-games.ev-games.fair-value
    hook: >
      "What would you pay to play this?" is the single most common opening
      of a quant interview, and it is always asking for $\mathbb{E}[X]$ by
      another name — everything else in this unit is a shortcut for
      computing that number faster.
    explanation: >
      Fair value is risk-neutral by construction: it is the price at which
      neither buying nor selling the game has a expected profit, so a
      rational counterparty is indifferent to which side of the trade they
      take. Once you fix that price at $\mathbb{E}[X]$, your edge at any
      other quoted price $p$ is just $\mathbb{E}[X]-p$ — positive when you
      pay less than fair value, negative when you pay more, with the sign
      flipping the moment you switch from buyer to seller.

      Two structural facts fall out immediately and both get tested. First,
      the price depends only on the law of the payoff, never on the
      physical mechanism producing it — a game described as "roll a die"
      and one described as "draw a numbered ball from a bag of six" price
      identically the moment their payoff distributions match. Second,
      because expectation is linear, a payoff built from several pieces
      prices by adding each piece's own fair value, with no need to work
      out how the pieces interact.

      This number says nothing yet about whether you should actually play —
      it assumes you are risk-neutral and the stake is small next to your
      bankroll, a assumption this unit revisits once variance enters.
    worked: >
      A spinner pays $12$ with probability $0.2$, $4$ with probability
      $0.5$, and nothing otherwise, and separately every player collects a
      flat $1$ loyalty credit regardless of outcome. Fair value is
      $0.2(12)+0.5(4)+1 = 2.4+2+1 = 5.4$, the two components simply added.
      Quoted at $5$, buying nets an edge of $0.4$; quoted at $6$, selling
      instead nets an edge of $0.6$.
    interview: >
      Expect the phrase verbatim — "what would you pay to play this game" —
      and the interviewer is listening for the weighted sum set up on the
      spot, not a guess at a "typical" outcome. A common follow-up asks you
      to state your edge at a specific quoted price, testing whether you
      remember the sign depends on which side of the trade you're on.
    pitfalls: >
      Averaging the possible payoffs without weighting by their
      probabilities is the single most common error at this step. Treating
      a multi-part payoff as needing the parts' dependence worked out before
      pricing wastes time the additivity of expectation makes unnecessary.
    recap: >
      Fair value is $\mathbb{E}[X]$, your edge is that number minus what
      you pay, and both depend only on the payoff's law, never on the
      mechanism that generates it.
    steps:
      - teach: >
          Fair value is the price at which neither side of a trade expects a
          profit: quote a game at $\mathbb{E}[X]$ and a buyer and a seller
          are equally happy to take either side. That single number answers
          "what would you pay to play this," and the rest of this unit is a
          faster way to reach it.
      - teach: >
          Your edge at a quoted price $p$ is $\mathbb{E}[X] - p$: positive
          when you pay less than fair value, negative when you pay more, and
          the sign reverses the instant you switch from buyer to seller.
          Fair value assumes risk-neutrality — bankroll doesn't enter yet.
      - ask: >
          A promotional game pays $8$ with probability $0.25$, $2$ with
          probability $0.5$, and nothing otherwise. What is its fair value?
        expects: "3"
        hint: >
          Weight each payoff by its own probability and add — do not average
          the raw numbers.
        feedback: >
          $0.25(8) + 0.5(2) + 0.25(0) = 2 + 1 + 0 = 3$, the weighted sum of
          the three payoffs.
      - teach: >
          Because expectation is linear, a payoff built from several pieces
          prices by adding each piece's own fair value. You never need to
          work out how the pieces interact — the sum is exact regardless.
      - ask: >
          The same promotional game also pays a flat $1$ show-up credit no
          matter what happens. What is the fair value including the credit?
        expects: "4"
        hint: >
          Price the credit on its own and add it to the game's own fair
          value — the two pieces don't need to be analyzed together.
        feedback: >
          The credit is worth $1$ by itself, so the total is
          $3 + 1 = 4$: additivity needs no knowledge of how the pieces
          interact.
      - teach: >
          Fair value also depends only on the payoff's distribution, never on
          the physical mechanism producing it. A die roll and a numbered
          draw from a bag price identically once their payoff distributions
          match.
      - ask: >
          Two games have the exact same payoff distribution: one flips a
          coin twice and pays based on the outcome, the other draws a
          numbered token from a bag. Do the two games have the same fair
          value?
        choices:
          - text: >
              No — different mechanisms need separately worked examples.
            feedback: >
              Fair value never reads the mechanism, only the law of the
              payoff. If the distributions match exactly, so do the prices.
          - text: >
              Yes — fair value depends only on the payoff's distribution.
            correct: true
            feedback: >
              Exactly. $\mathbb{E}[X]$ is computed from the payoff's law
              alone, so identical distributions give identical prices no
              matter how the randomness is generated.
          - text: >
              It depends on which game has the higher variance.
            feedback: >
              Variance affects how the game feels to play, not its fair
              price — fair value is a risk-neutral number computed from the
              law of the payoff alone.
        feedback: >
          Same distribution, same fair value — the price never looks past
          the payoff's law to ask how the randomness was generated.
      - teach: >
          Carry both facts into the room: additivity across payoff pieces
          and invariance to mechanism are what let you price a complicated-
          sounding game as a short sum instead of a full simulation.

  - node: quant-games.ev-games.pay-per-pip
    hook: >
      Interviewers reuse the same die with a different payoff function
      specifically to see whether you push the function through the
      expectation sign or redo the weighted sum from scratch.
    explanation: >
      A payoff rule is a function applied to each outcome before you
      average, never applied to the mean afterward. Changing "pay the face"
      to "pay some function of the face" changes which value gets weighted
      by which probability, and there is no shortcut that reuses the plain
      mean — you rebuild the weighted sum with the new payoff plugged in at
      every outcome.

      This matters because the gap between $\mathbb{E}[g(X)]$ and
      $g(\mathbb{E}[X])$ can be large even for an innocuous-looking $g$. A
      convex payoff like a square or a cube systematically rewards the
      outcomes far from the mean more than it rewards the mean itself, so
      averaging the transformed values always comes out above transforming
      the average — the gap is the whole reason "square the payoff" is a
      favorite interview variant of any base game.

      A threshold payoff (pay only if some condition holds) is the other
      common variant, and it collapses to a single term: the payout times
      the probability the condition holds, nothing more.
    worked: >
      Roll one fair six-sided die and collect the cube of the face. The
      payoff is $X^{3}$ for $X$ uniform on $\{1,\dots,6\}$, so the fair
      value is $\mathbb{E}[X^{3}] = (1+8+27+64+125+216)/6 = 441/6 = 73.5$ —
      far above $3.5^{3} = 42.875$, the number you'd get by cubing the mean
      instead of averaging the cubes.
    interview: >
      "Same die, but you're paid the square (or cube) of the face" tests
      exactly this reflex — the expected response sets up
      $\sum_x g(x)p(x)$ immediately rather than computing $g(\mathbb{E}[X])$
      and calling it done.
    pitfalls: >
      Sliding a nonlinear $g$ through the expectation sign is the classic
      error this node exists to catch. For a threshold payoff, forgetting
      to multiply by the probability the condition actually holds — instead
      averaging only over the outcomes where it does — silently drops the
      other outcomes from the sum.
    recap: >
      A payoff function is applied outcome by outcome before averaging, so
      paying the cube of a fair die's face is worth $73.5$, nowhere near
      the cube of its mean.
    steps:
      - teach: >
          A payoff function is applied to each outcome before you average,
          not to the mean afterward. Changing "pay the face" to "pay some
          function of the face" changes which value gets weighted by which
          probability, and there is no shortcut that reuses the plain mean.
      - teach: >
          The gap between $\mathbb{E}[g(X)]$ and $g(\mathbb{E}[X])$ can be
          large even for an innocuous-looking $g$. A convex payoff like a
          square rewards outcomes far from the mean more than it rewards the
          mean itself, so averaging the transformed values comes out above
          transforming the average.
      - ask: >
          Roll one fair four-sided die (faces $1$ through $4$) and collect
          the square of the face. What is the fair value of this game?
        expects: "7.5"
        hint: >
          Square each face first, then average the four squared values —
          don't square the mean.
        feedback: >
          $\mathbb{E}[X^{2}] = (1+4+9+16)/4 = 30/4 = 7.5$, well above
          $(\mathbb{E}[X])^{2} = 2.5^{2} = 6.25$: squaring is convex, so
          averaging after squaring beats squaring the average.
      - teach: >
          A threshold payoff — pay only if some condition holds — collapses
          to a single term instead: the payout times the probability the
          condition holds, nothing more.
      - ask: >
          Roll one fair six-sided die and collect $12$ dollars only if the
          face is $5$ or $6$, and nothing otherwise. What is the fair value?
        expects: "4"
        hint: >
          Multiply the payout by the probability that a $5$ or a $6$
          actually shows.
        feedback: >
          The condition holds with probability $2/6$, so the fair value is
          $12 \times (2/6) = 4$ — no averaging over the outcomes where the
          payout is zero is needed beyond that one multiplication.
      - teach: >
          Sliding a nonlinear $g$ through the expectation sign is the
          classic error this setup exists to catch, and interviewers reuse
          the same base die specifically to test the reflex.
      - ask: >
          For a fair die's face $X$, how does $\mathbb{E}[X^{2}]$ compare to
          $(\mathbb{E}[X])^{2}$ in general?
        choices:
          - text: >
              They're always equal — squaring can be pushed through the
              expectation.
            feedback: >
              Squaring is convex, and pushing it through the expectation is
              exactly the error this setup exists to catch — the two sides
              agree only when $X$ is constant.
          - text: >
              $\mathbb{E}[X^{2}]$ is strictly greater whenever $X$ is not
              constant.
            correct: true
            feedback: >
              A convex function averaged after transforming always
              dominates the same function applied to the average — the
              fair die's $91/6 \approx 15.17$ against $3.5^{2}=12.25$ is the
              standing example.
          - text: >
              $\mathbb{E}[X^{2}]$ is strictly smaller whenever $X$ is not
              constant.
            feedback: >
              That's backward: convexity pushes the transformed average up,
              not down, whenever the payoff genuinely varies.
        feedback: >
          For a nonconstant $X$ and a convex $g$, $\mathbb{E}[g(X)]$ always
          exceeds $g(\mathbb{E}[X])$ — the gap is the entire reason "square
          the payoff" is a favorite variant of any base game.
      - teach: >
          Two reflexes to leave the room with: rebuild the weighted sum from
          scratch whenever the payoff function changes, and for a threshold
          payoff, remember the probability multiplies the payout directly.

  - node: quant-games.ev-games.symmetry-pricing
    hook: >
      Symmetry answers or checks a pricing question before you write a
      single term of the sum, and interviewers use it to see whether you
      reach for it by reflex or grind through the algebra anyway.
    explanation: >
      Reflection symmetry and exchangeable-total symmetry already price
      most static games outright. The move genuinely new to game pricing is
      a third one: a zero-sum contest whose rules treat the two sides
      identically is worth $0$ to each, however complicated the mechanism.
      The reasoning is a swap argument, not a computation — if relabeling
      the two players leaves the joint law of the outcome unchanged, then
      player $A$'s expected net payoff must equal player $B$'s, but in a
      zero-sum game $B$'s payoff is always $-1$ times $A$'s, forcing
      $\mathbb{E}[\text{net to }A] = -\mathbb{E}[\text{net to }A]$, which
      only $0$ satisfies.

      The payoff of this move is that it needs no knowledge of the actual
      process — a multi-round race, a repeated draw-off, an arbitrarily
      intricate tie-breaking rule all fall to the same one-line argument, as
      long as the rule genuinely doesn't distinguish the two seats.

      Treat symmetry as a discipline: check the invariance actually holds —
      unequal antes, a first-mover edge, or hidden information all break
      it — before invoking it, and use it afterward to sanity-check a
      direct computation that looks asymmetric when it shouldn't be.
    worked: >
      Two traders repeatedly flip a fair coin in a race to three heads;
      whoever gets there first collects a fixed $50$ from the other, with
      any tie-breaking handled by a rule that treats both players the same
      way. Whatever that rule's details, swapping which trader is "player
      $A$" leaves the whole setup unchanged, so
      $\mathbb{E}[\text{net to }A] = -\mathbb{E}[\text{net to }A] = 0$ — the
      race is fair with no entry fee, without ever analyzing the race
      itself.
    interview: >
      "Is this fair to both sides?" or "what's your edge as player $A$" is
      answered fastest by naming the swap invariance directly rather than
      computing a stopping-time distribution. It also doubles as a check —
      if your direct computation of a symmetric setup doesn't collapse to
      $0$ or $c/2$, you've made an arithmetic error.
    pitfalls: >
      Invoking symmetry when a real asymmetry is hiding in the setup —
      unequal stakes, an information edge, who moves first — produces a
      confidently wrong $0$. Using a valid zero-sum symmetry to answer a
      question about variance or the full distribution overreaches, since
      symmetry only pins down the mean.
    recap: >
      A zero-sum game whose rules don't distinguish the two seats is worth
      $0$ to each side by a pure swap argument, no matter how complicated
      the underlying process is.
    steps:
      - teach: >
          Look for symmetry before writing a single term of the sum — it
          often prices a game outright, and even when it doesn't, it checks
          the algebra you were about to grind through by hand.
      - teach: >
          Reflection symmetry is the first move: if $c - X$ has the same law
          as $X$, the game is worth $c/2$. The sum of two ordinary
          six-sided dice is symmetric about $7$, so it prices at $7$ with no
          sum needed.
      - ask: >
          Two fair four-sided dice (faces $1$ through $4$ each) are rolled
          and summed. What is the fair value of this sum?
        expects: "2.5"
        hint: >
          Check what constant $c$ makes $c - X$ have the same distribution
          as the sum $X$, then take $c/2$.
        feedback: >
          The sum ranges from $2$ to $8$ and is symmetric about $c=5$
          (rolling $a,b$ and the pair $5-a,5-b$ are equally likely), so the
          fair value is $5/2 = 2.5$.
      - teach: >
          Second move, exchangeable parts of a known total: if a fixed
          total $T$ splits among $k$ exchangeable pieces, each piece is
          worth $T/k$, since no piece is treated differently from any other.
      - ask: >
          A contest distributes a fixed pool of $200$ points among $5$
          exchangeable winners, chosen by a process that treats all five
          symmetrically. What is the expected number of points to one
          specific winner?
        expects: "40"
        hint: >
          The five winners' shares are exchangeable and sum to the fixed
          total — divide evenly.
        feedback: >
          The $5$ shares are exchangeable and must sum to $200$, so by
          symmetry each averages $200/5 = 40$.
      - teach: >
          Third move, and the one genuinely new to game pricing: a zero-sum
          game whose rules treat the two seats identically is worth $0$ to
          each. Swapping the labels "player $A$" and "player $B$" leaves
          the joint law unchanged, forcing
          $\mathbb{E}[\text{net to }A] = -\mathbb{E}[\text{net to }A]$,
          which only $0$ satisfies.
      - ask: >
          A casino game between two players is billed as symmetric and
          zero-sum, but the rules actually give player $A$ the first move,
          and every tie breaks in $A$'s favor. What is the fair price to sit
          in seat $B$?
        choices:
          - text: >
              $0$, since it's zero-sum.
            feedback: >
              Being zero-sum alone isn't enough — the swap argument needs
              the rules to genuinely treat both seats the same, and here
              they don't: $A$ moves first and wins every tie.
          - text: >
              You can't conclude it's $0$ without checking whether the rule
              truly treats both seats identically.
            correct: true
            feedback: >
              Right — the described asymmetries (first move, favorable
              ties) break the invariance the swap argument depends on, so
              the symmetry shortcut simply doesn't apply here.
          - text: >
              It must be negative, since seat $B$ is described second.
            feedback: >
              Being named second in a description says nothing about the
              payoff — the actual rules (who moves first, who wins ties)
              determine the price, and that needs direct analysis here.
        feedback: >
          Symmetry is a discipline, not a reflex: check that the invariance
          genuinely holds — no first-mover edge, no unequal antes, no
          hidden information — before invoking it.
      - teach: >
          Use all three moves the same way: as a fast outright answer when
          the structure is clean, and afterward as a sanity check on any
          direct computation that looks asymmetric when the setup says it
          shouldn't be.

  - node: quant-games.ev-games.condition-first-draw
    hook: >
      Once a game restarts, shrinks, or changes state after the first roll,
      naming the value of "everything from here on" as an unknown and
      writing one equation for it turns an unbounded process into
      arithmetic.
    explanation: >
      Two distinct shapes show up under "condition on the first roll." In
      the first, the game genuinely restarts in an identical state after a
      failed first attempt — the same die, the same rules, nothing lost
      except whatever was already collected. Calling the game's value $V$
      and writing one equation that puts $V$ on both sides is exactly the
      right move here, because the continuation truly is a fresh copy of
      the whole game.

      In the second shape, the first outcome sets a parameter for a
      different, smaller sub-game rather than restarting the same one — a
      first roll of $N$ that determines how many dice you then roll and
      sum. There, conditioning gives a genuine weighted average across
      branches that differ structurally from each other and from the
      original game, and the average often collapses fast when the inner
      quantity is itself a plain expectation.

      Either way the discipline is the same: split on the first outcome,
      write down what happens on each branch including anything already
      collected, and solve — self-referentially when the branches loop
      back to $V$, by direct averaging when they don't.
    worked: >
      Flip a fair coin: heads (probability $1/2$) pays $3$ and ends the
      game; tails (probability $1/2$) costs $1$ and the coin is flipped
      again. With $V$ the value of the game,
      $V = \tfrac{1}{2}(3) + \tfrac{1}{2}(-1+V) = 1 + \tfrac{1}{2}V$, so
      $\tfrac{1}{2}V = 1$ and $V = 2$.
    interview: >
      Any "the game continues if..." setup should trigger naming the
      remaining game's value as an unknown before touching arithmetic.
      Interviewers listen for you to state out loud whether the
      continuation is the same game again (self-referential $V$) or a
      genuinely different sub-game (plain conditional average).
    pitfalls: >
      Forgetting to add back whatever was already collected on the
      continuing branch before folding in $V$ is an easy silent drop.
      Applying the self-referential trick to a game whose state actually
      changes after the first draw — cards removed without replacement,
      say — assumes a $V$ that isn't constant across branches and is wrong.
    recap: >
      Split on the first roll, write the not-yet-played remainder as an
      unknown, and solve one equation — self-referential when the game
      restarts identically, a weighted average otherwise.
    steps:
      - teach: >
          Once a game restarts, shrinks, or changes state after the first
          roll, name the value of "everything from here on" as an unknown
          and write one equation for it — that single move turns an
          unbounded process into ordinary algebra.
      - teach: >
          Two shapes exist. If the game genuinely restarts in an identical
          state after a failed first try, call its value $V$ and put $V$ on
          both sides of one equation — the continuation truly is a fresh
          copy of the whole game.
      - ask: >
          Flip a fair coin: heads (probability $1/2$) pays $5$ and ends the
          game; tails (probability $1/2$) costs $2$ and the coin is flipped
          again. With $V$ the value of the game, what is $V$?
        expects: "3"
        hint: >
          Write $V = \tfrac{1}{2}(5) + \tfrac{1}{2}(-2+V)$ and solve for
          $V$.
        feedback: >
          $V = \tfrac{1}{2}(5) + \tfrac{1}{2}(-2+V) = 2.5 - 1 +
          \tfrac{1}{2}V$, so $\tfrac{1}{2}V = 1.5$ and $V = 3$.
      - teach: >
          The second shape is different: the first outcome sets a
          parameter for a smaller sub-game rather than restarting the same
          one. Conditioning then gives a genuine weighted average across
          structurally different branches, with no self-reference needed.
      - ask: >
          Roll a fair die to get $N$, then flip $N$ fair coins, collecting a
          dollar for every head. What is the fair value of this game?
        expects: "1.75"
        hint: >
          Condition on $N$: each coin is worth $0.5$, so the inner game is
          worth $0.5N$ — then average over the die.
        feedback: >
          $\mathbb{E}[X] = \mathbb{E}[0.5N] = 0.5\,\mathbb{E}[N] = 0.5(3.5)
          = 1.75$: no self-referential equation is needed since $N$
          genuinely changes the sub-game rather than restarting it.
      - teach: >
          The discipline either way: split on the first outcome, write down
          what happens on each branch including anything already
          collected, and solve — self-referentially when a branch loops
          back to $V$, by direct averaging when it doesn't.
      - ask: >
          A player draws cards without replacement, collecting $2$ dollars
          per draw, and can keep drawing while cards remain. Someone sets
          the value of "continuing" at every stage to the same constant
          $V$, regardless of how many cards are left. What is wrong with
          this?
        choices:
          - text: >
              Nothing — the self-referential trick always applies to a game
              that keeps going.
            feedback: >
              It only applies when the continuation is truly a fresh copy
              of the same game. Here the deck shrinks every draw, so later
              states are not identical to earlier ones.
          - text: >
              The deck shrinks with each draw, so the continuation isn't
              the same game each time — $V$ isn't constant across
              branches.
            correct: true
            feedback: >
              Exactly. Cards removed without replacement change the state,
              so treating every "continue" branch as the same unknown $V$
              assumes something false.
          - text: >
              The only mistake is that the payoff should be reweighted by
              how many cards remain, nothing else.
            feedback: >
              Reweighting isn't the core issue — the deeper problem is that
              the remaining game is a genuinely different game at every
              stage, not a rescaled copy of the same one.
        feedback: >
          The self-referential trick needs the continuation to be an exact
          fresh copy of the original game. A shrinking, non-replacing deck
          breaks that, and the fix is to track the actual state instead of
          a single constant $V$.
      - teach: >
          Before writing anything down, say out loud which shape you're in:
          a genuine restart earns a self-referential $V$, a state-dependent
          sub-game earns a plain conditional average.

  - node: quant-games.ev-games.option-value
    hook: >
      Every re-roll, every free look, and every financial option is the
      same underlying object, and the interview question is almost always
      "how much is that option actually worth," not just "is it worth
      something."
    explanation: >
      The inequality $\mathbb{E}[\max(X,Y)]\ge\max(\mathbb{E}[X],
      \mathbb{E}[Y])$ has a one-line pointwise proof, and that proof is the
      whole intuition. For every single outcome $\omega$, $\max(X,Y)(\omega)$
      is at least $X(\omega)$ and at least $Y(\omega)$ — the max can never
      be smaller than either input at any specific outcome. Averaging a
      quantity that is pointwise at least as large as $X$ everywhere gives
      an expectation at least as large as $\mathbb{E}[X]$, and the same
      argument against $Y$ gives $\mathbb{E}[\max(X,Y)]\ge\mathbb{E}[Y]$
      too — combine the two and the max of the two means is beaten.

      Equality is the special case where the max never actually strayed
      from one fixed alternative: one of $X,Y$ dominates the other with
      probability $1$, so choosing after seeing the outcome never actually
      changes what you'd have picked anyway.

      The size of the gap tracks spread, not level: widening $X$'s variance
      around the same mean pushes more mass strictly above the fixed
      alternative, and each such outcome contributes a strictly positive
      bonus a precommitted choice can't capture, while the low outcomes are
      floored at the alternative instead of dragging the average down.
    worked: >
      A fair $8$-sided die has mean $4.5$. Against a guaranteed $5$,
      $\mathbb{E}[\max(X,5)]$ replaces faces $1$–$4$ with $5$ and keeps
      faces $5$–$8$ as they are: $(5+5+5+5+5+6+7+8)/8 = 46/8 = 5.75$. The
      option to look and then choose is worth $5.75-4.5 = 1.25$.
    interview: >
      "Would you rather have the average payoff guaranteed, or see the
      outcome first and then decide" is the canonical framing, and the
      expected answer prices the gap as a difference of two expectations
      rather than asserting qualitatively that seeing first is "obviously
      better."
    pitfalls: >
      Estimating the option's value as the gap between the best possible
      outcome and the mean overstates it badly — you only benefit on the
      fraction of outcomes that actually clear the alternative. Assuming
      equality in the inequality without checking domination is a second
      common overreach; most instances are strict.
    recap: >
      Choosing after seeing the outcome prices as $\mathbb{E}[\max(X,Y)]$,
      never less than $\max(\mathbb{E}[X],\mathbb{E}[Y])$ by a pointwise
      argument, worth $1.25$ for a fair $8$-sided die against a guaranteed
      $5$.
    steps:
      - teach: >
          Every re-roll, every free look, and every financial option is the
          same object: a choice made after seeing an outcome instead of
          before. The question worth answering precisely is how much that
          choice is worth, not just that it's worth something.
      - teach: >
          The inequality $\mathbb{E}[\max(X,Y)] \ge
          \max(\mathbb{E}[X],\mathbb{E}[Y])$ has a pointwise proof: at every
          single outcome, $\max(X,Y)$ is at least $X$ and at least $Y$, so
          averaging it gives an expectation at least as large as either
          $\mathbb{E}[X]$ or $\mathbb{E}[Y]$.
      - ask: >
          A fair $10$-sided die (faces $1$ through $10$) pays its face
          value. Against a guaranteed $6$, what is $\mathbb{E}[\max(X,6)]$?
        expects: "7"
        hint: >
          Faces $1$ through $6$ are all replaced by $6$; faces $7$ through
          $10$ keep their own value.
        feedback: >
          The ten values become $6,6,6,6,6,6,7,8,9,10$, summing to $70$, so
          $\mathbb{E}[\max(X,6)] = 70/10 = 7$.
      - teach: >
          Equality in the inequality is the special case where the max
          never actually strayed from one alternative — one side dominates
          the other with probability $1$, so choosing after seeing the
          outcome never changes what you'd have picked anyway.
      - ask: >
          For that same $10$-sided die (mean $5.5$), what is the value of
          the option to look and then choose between the die and the
          guaranteed $6$?
        expects: "1.5"
        hint: >
          Subtract the die's own mean from $\mathbb{E}[\max(X,6)]$.
        feedback: >
          $\mathbb{E}[\max(X,6)] - \mathbb{E}[X] = 7 - 5.5 = 1.5$: the
          right to look is worth $1.5$ here.
      - teach: >
          The size of the gap tracks spread, not level: widening $X$'s
          variance around the same mean pushes more mass strictly above the
          fixed alternative, and each such outcome adds a bonus a
          precommitted choice can never capture.
      - ask: >
          Which correctly estimates the option value for that $10$-sided
          die against a guaranteed $6$?
        choices:
          - text: >
              The best face minus the guaranteed value, $10 - 6 = 4$.
            feedback: >
              This overstates it badly — you only benefit on the fraction
              of outcomes that actually clear the guaranteed value, not on
              the single best outcome.
          - text: >
              $\mathbb{E}[\max(X,6)]$ minus the die's own mean, comparing
              every outcome to the guaranteed alternative.
            correct: true
            feedback: >
              Right — this is the actual difference of two expectations,
              and it comes out to $1.5$, far below the best-case estimate
              of $4$.
          - text: >
              $0$, since the guaranteed value already exceeds half the
              possible faces.
            feedback: >
              The faces above $6$ still contribute a strictly positive
              bonus on average, so the option value isn't zero just
              because the guarantee beats most individual faces.
        feedback: >
          The honest option value is a difference of two expectations,
          never the gap between a single extreme outcome and the
          alternative.
      - teach: >
          Carry the mechanism, not just the number: a re-roll, a free look,
          and an option on a stock all price the same way, because all
          three are exactly $\mathbb{E}[\max(X,Y)]$ against whatever you'd
          have taken without looking.

  - node: quant-games.ev-games.dice-reroll
    hook: >
      A capped re-roll ladder and an uncapped pay-per-reroll game feel like
      different problems, but interviewers switch between the two framings
      specifically to see whether you notice they're the same machinery.
    explanation: >
      Read the ladder $V_1,V_2,V_3,V_4$ as a menu of fair prices, one per
      allowed number of rolls: an entry fee quoted below $V_k$ is a buy, one
      quoted above is a sell, whatever $k$ the interviewer names. The
      marginal values $V_2-V_1=0.75$, $V_3-V_2\approx0.42$,
      $V_4-V_3\approx0.28$ are literally the price of the "right to look"
      one more time, and they shrink because the earlier rolls have already
      claimed most of the room between the mean and the die's ceiling of
      $6$ — the sequence creeps toward $6$ but a finite number of rerolls
      can never fully close the gap, since some probability always remains
      of never rolling the top face.

      Swap the rule from "$k$ rerolls allowed" to "unlimited rerolls, a fee
      $f$ each time" and the horizon disappears, so there is nothing to
      induct backward from. The value instead solves a fixed-point
      equation: keep face $x$ if it beats the net continuation value
      $V-f$, so $V = \mathbb{E}[\max(X, V-f)]$ with $V$ on both sides —
      solved the same way the self-referential restart games are, by
      guessing a threshold and checking it reproduces itself.
    worked: >
      Fair die, unlimited rerolls, a fee of $1$ each time. Guessing the
      threshold "keep $3$ or better": $V = \tfrac{3+4+5+6}{6} +
      \tfrac{2}{6}(V-1) = 3 + \tfrac{1}{3}(V-1)$, which solves to $V=4$.
      Checking consistency, $V-1=3$ is exactly the boundary assumed, so
      the fixed point holds: reroll only on $1$ or $2$, and the game is
      worth $4$.
    interview: >
      "Would you pay $4.50$ for three rerolls" tests reading the ladder as
      a price list; a common follow-up switches to "what if you instead
      pay a dollar every time you reroll" to see whether you recognize the
      fixed-point structure instead of trying to induct over an infinite
      horizon.
    pitfalls: >
      Quoting $V_k$ for the wrong $k$ by miscounting whether the initial
      roll counts toward the cap is an easy off-by-one. In the fee-per-
      reroll variant, subtracting the fee once at the end instead of
      inside the recursive $V$ ignores that it's paid on every reroll.
    recap: >
      The ladder is a price list whose marginal option values shrink toward
      a ceiling of $6$; charging per reroll instead of capping the count
      swaps backward induction for a fixed-point equation, worth $4$ at a
      fee of $1$.
    steps:
      - teach: >
          Read the ladder $V_1,V_2,V_3,V_4$ as a menu of fair prices, one
          per allowed number of rolls. An entry fee quoted below $V_k$ is a
          buy and one quoted above is a sell, whatever $k$ the interviewer
          names.
      - teach: >
          The marginal values $V_2-V_1$, $V_3-V_2$, $V_4-V_3$ are literally
          the price of the "right to look" one more time, and they shrink
          because earlier rolls have already claimed most of the room
          between the mean and the die's ceiling of $6$.
      - ask: >
          Given $V_3 = 14/3$ and $V_4 = 89/18$, what is the marginal value
          of the fourth roll, $V_4 - V_3$?
        expects: "5/18"
        tolerance: 0.0005
        hint: >
          Put both fractions over $18$ before subtracting.
        feedback: >
          $89/18 - 14/3 = 89/18 - 84/18 = 5/18 \approx 0.2778$, smaller
          than $V_3-V_2\approx0.42$: each extra roll is worth less than the
          last.
      - teach: >
          Swap the rule from "$k$ rerolls allowed" to "unlimited rerolls, a
          fee $f$ each time" and the horizon disappears, so there's nothing
          to induct backward from. The value instead solves the fixed-point
          equation $V = \mathbb{E}[\max(X, V-f)]$, guessed by a threshold
          and checked for self-consistency.
      - ask: >
          Fair die, unlimited rerolls, a fee of $2$ each time. Guessing the
          threshold "keep $2$ or better, reroll only on a $1$": solve for
          $V$.
        expects: "3.6"
        hint: >
          Write $V = \tfrac{2+3+4+5+6}{6} + \tfrac{1}{6}(V-2)$ and solve for
          $V$, then check $V-2$ against the assumed threshold.
        feedback: >
          $6V = 20 + (V-2)$ gives $5V = 18$, so $V = 3.6$. Checking
          consistency, $V-2=1.6$, which does fall below every face from
          $2$ through $6$ and above face $1$ — the assumed threshold holds.
      - teach: >
          A common off-by-one is quoting $V_k$ for the wrong $k$ by
          miscounting whether the initial roll counts toward the cap. In
          the fee-per-reroll variant, the fee belongs inside the recursive
          $V$, not subtracted once at the end.
      - ask: >
          In the fee-per-reroll game, which is the correct way to account
          for the fee paid on each reroll?
        choices:
          - text: >
              Subtract it once at the end from the final $V$.
            feedback: >
              That undercounts it — the fee is paid on every reroll taken,
              not once at the finish, so it has to sit inside the
              recursive equation for $V$.
          - text: >
              Subtract it inside the recursive equation, since it's paid on
              every reroll.
            correct: true
            feedback: >
              Right — $V = \mathbb{E}[\max(X, V-f)]$ charges the fee on
              every continuation, which is exactly how often it's actually
              paid.
          - text: >
              Add it to the mean of every face before comparing to the
              threshold.
            feedback: >
              The fee reduces the value of continuing, so it belongs
              subtracted from $V$ in the continuation term, not added to
              the face values.
        feedback: >
          The fee is paid every time you choose to continue, so it must sit
          inside the recursive continuation value $V-f$, never bolted on
          afterward.
      - teach: >
          Both variants are the same machinery: a capped ladder is solved
          by backward induction with a shrinking marginal value, an
          uncapped fee-per-reroll game is solved by a fixed point with a
          fee subtracted every time you keep playing.

  - node: quant-games.ev-games.commit-versus-see
    hook: >
      "Would you rather commit as you go, or see everything first and then
      choose" is a direct test of whether you can name the exact inequality
      that separates the two numbers, not just that one feels bigger.
    explanation: >
      The offline "pay the best" game and the online re-roll game share the
      same $n$ draws, and the offline value always dominates: whatever face
      you finally accept under any online, irrevocable rule is one of the
      $n$ faces actually rolled, so it can never exceed the maximum of all
      of them on any single outcome. Averaging a quantity that is pointwise
      at most the maximum gives an expectation at most $\mathbb{E}[\max]$,
      the same pointwise argument that priced a single option, now applied
      across a whole sequence of decisions instead of one.

      The gap is the price of irrevocability specifically — not the dice,
      not the number of rolls, but the constraint that each accept-or-
      reject decision is made before the rest of the sequence is known. It
      also isn't a fixed constant: more rolls mean more chances to regret
      an early commitment, so the gap widens as $n$ grows, even though both
      games' individual values are increasing in $n$ too.
    worked: >
      Compare the two-roll versions. The re-roll value is $V_2=4.25$. The
      pay-the-best value is the classic expected max of two fair dice:
      $\Pr(M=k)=(2k-1)/36$, so $\mathbb{E}[M] =
      \tfrac{1(1)+2(3)+3(5)+4(7)+5(9)+6(11)}{36} = \tfrac{161}{36}
      \approx4.472$. The gap is $161/36-17/4 = 8/36 = 2/9\approx0.222$ —
      smaller than the three-roll gap of about $0.29$, since fewer rolls
      leave less room for regret.
    interview: >
      Interviewers deliberately alternate the two phrasings mid-question to
      see if you notice the switch. State plainly which game is being
      described before computing anything, and name the inequality
      direction — offline always weakly dominates online — as the reason
      the two numbers can never cross.
    pitfalls: >
      Treating the two games as "basically the same" because both involve
      $n$ dice and keeping the best is exactly the trap — the sequential,
      irrevocable constraint is the entire difference. Assuming the gap is
      a fixed amount rather than growing with $n$ misreads what's driving
      it.
    recap: >
      The offline best-of-$n$ value always weakly dominates any online
      accept-or-reroll rule, since the accepted face is always one of the
      $n$ rolled; two rolls give $161/36\approx4.472$ against $4.25$, a
      smaller gap than three rolls give.
    steps:
      - teach: >
          "Would you rather commit as you go, or see everything first and
          then choose" is really asking you to name a specific inequality,
          not to guess which option feels bigger.
      - teach: >
          The offline "pay the best" game and the online re-roll game share
          the same $n$ draws, and the offline value always dominates:
          whatever face you finally accept under any irrevocable rule is
          one of the $n$ faces actually rolled, so it can never exceed the
          maximum of all of them on any single outcome.
      - ask: >
          For a single roll ($n=1$), what is the gap between the
          pay-the-best value and the accept-or-reroll value?
        expects: "0"
        hint: >
          With only one roll there's nothing to see later — both rules
          amount to keeping the one face you rolled.
        feedback: >
          With $n=1$ there is no later information to withhold, so both
          games are just "keep the one roll," and the gap is exactly $0$.
      - teach: >
          The gap isn't a fixed constant: more rolls mean more chances to
          regret an early commitment, so the gap widens as $n$ grows, even
          though both games' individual values are increasing in $n$ too.
      - ask: >
          Using $V_3 = 14/3$ for three-roll accept-or-reroll and the
          three-roll pay-the-best value $119/24$, what is the gap
          (pay-the-best minus reroll)?
        expects: "7/24"
        tolerance: 0.0005
        hint: >
          Put both fractions over $24$ before subtracting.
        feedback: >
          $119/24 - 14/3 = 119/24 - 112/24 = 7/24 \approx 0.2917$, larger
          than the two-roll gap of $2/9\approx0.222$: more rolls, more room
          for regret.
      - teach: >
          Treating the two games as "basically the same" because both
          involve $n$ dice and keep the best is exactly the trap — the
          sequential, irrevocable constraint is the entire difference
          between them.
      - ask: >
          Someone argues the pay-the-best and accept-or-reroll games are
          basically equivalent since both use the same $n$ dice and both
          keep a high value. What's wrong with that argument?
        choices:
          - text: >
              Nothing — with the same $n$ dice, the two games are equal.
            feedback: >
              They share the same $n$ draws but not the same information at
              decision time, and that difference is exactly what separates
              their values.
          - text: >
              The sequential, irrevocable commit constraint is the entire
              difference — accepting a face forecloses seeing the rest.
            correct: true
            feedback: >
              Right — the online game commits to each face before the next
              is revealed, while the offline game sees everything before
              choosing, and that constraint alone drives the whole gap.
          - text: >
              They differ only because the reroll game effectively uses
              fewer dice.
            feedback: >
              Both games use exactly $n$ dice each time — the reroll game
              doesn't lose draws, it loses the ability to revisit a
              decision once made.
        feedback: >
          Same dice, same count, different information at decision time —
          the irrevocability of each accept-or-reject choice is the whole
          source of the gap, and it grows rather than staying fixed as $n$
          grows.
      - teach: >
          State plainly which game is being described before computing
          anything: offline always weakly dominates online, and the two
          numbers can never cross.

  - node: quant-games.ev-games.next-card-red
    hook: >
      This is the canonical "can you beat a fair coin by waiting for
      information" question, and the honest answer — no, not by a cent —
      is what separates candidates who trust the arithmetic from those who
      trust a gambler's hunch.
    explanation: >
      The fraction of unseen cards that are red is fair not just on
      average from the start, but conditionally at every single reveal:
      whatever composition remains, the very next card is red with
      probability exactly (unseen reds)/(unseen total), the same formula
      whether it's the first card or the fortieth. Revealing a black card
      does swing that local fraction up in your favor, but it does so with
      correspondingly lower probability of having happened in the first
      place, and revealing a red card swings it down with correspondingly
      higher probability — the two effects are built to cancel exactly, on
      every single reveal, not just in the long run.

      This is why "wait for a black-heavy run before betting red" cannot
      manufacture an edge: the run you're waiting for is exactly as rare as
      it needs to be to keep the arithmetic fair, no matter how you define
      "black-heavy." No stopping rule, however clever, can make the card
      you eventually bet on redder than the $1/2$ you started with.
    worked: >
      Shrink to a $4$-card deck with $2$ red and $2$ black, and consider the
      rule "skip the first card, bet the second is red." If card $1$ is
      black (probability $1/2$), the remaining odds are $2$ red in $3$, so
      the payoff averages $2(2/3)-1=1/3$. If card $1$ is red (probability
      $1/2$), the remaining odds are $1$ red in $3$, so the payoff averages
      $2(1/3)-1=-1/3$. Overall,
      $\tfrac{1}{2}\left(\tfrac{1}{3}\right)+\tfrac{1}{2}\left(-\tfrac{1}{3}
      \right)=0$ — the two branches cancel exactly.
    interview: >
      "You can watch cards flip and bet whenever you like that the next one
      is red — what's this worth?" wants "$0$, because the red fraction is
      conditionally fair at every reveal" stated with the reasoning, not
      just intuition. A sharp follow-up changes the payoff to pay only on
      red and nothing on black, and the answer becomes $1/2$ for the same
      reason.
    pitfalls: >
      Believing a run of blacks makes the deck "due" for red confuses a
      real local shift in odds with an edge — that shift arrives with
      exactly the lower probability needed to offset it. Confusing this
      with the option-value intuition that "seeing more is worth more" is
      the other trap: here the payoff itself is symmetric, so looking
      longer buys nothing.
    recap: >
      The chance the next unseen card is red never drifts from where it
      started, conditionally or unconditionally, so no stopping rule turns
      free peeks at a shuffled deck into a positive-EV bet on red.
    steps:
      - teach: >
          "Can you beat a fair coin by waiting for information" is the
          question here, and the honest answer is no, not by a cent — the
          arithmetic, not a gambler's hunch, decides it.
      - teach: >
          The fraction of unseen cards that are red is fair at every single
          reveal, not just on average from the start: whatever composition
          remains, the very next card is red with probability exactly
          (unseen reds)/(unseen total), the same formula at the first card
          or the fortieth.
      - ask: >
          A fresh $8$-card deck has $4$ red and $4$ black cards. One card is
          revealed and it is black. What is the probability the next card
          is red?
        expects: "4/7"
        tolerance: 0.0005
        hint: >
          One black card is gone, leaving $4$ reds among $7$ unseen cards.
        feedback: >
          After one black card leaves, $4$ reds remain among $7$ unseen
          cards, so $\Pr(\text{next is red}) = 4/7 \approx 0.5714$ — a
          local swing above $1/2$.
      - teach: >
          That local swing cannot manufacture an edge, because it arrives
          with correspondingly lower probability of having happened at all.
          Revealing a red card instead swings the fraction down, with
          correspondingly higher probability — the two effects are built to
          cancel exactly, on every single reveal.
      - ask: >
          A fresh $6$-card deck has $3$ red and $3$ black cards. Using the
          rule "skip the first card, bet the second is red," what is the
          overall expected payoff of the win-a-dollar/lose-a-dollar bet?
        expects: "0"
        hint: >
          Average the payoff over both possibilities for the first card,
          weighting each by its own probability of $1/2$.
        feedback: >
          If card $1$ is black ($\Pr=1/2$), $3$ reds remain among $5$, so
          the payoff averages $2(3/5)-1=1/5$. If card $1$ is red
          ($\Pr=1/2$), $2$ reds remain among $5$, so the payoff averages
          $2(2/5)-1=-1/5$. Overall,
          $\tfrac{1}{2}(1/5)+\tfrac{1}{2}(-1/5)=0$ — the branches cancel.
      - teach: >
          A common confusion is applying this same "$0$" answer to a
          differently-shaped payoff without rechecking it. A variant paying
          a dollar for red and nothing for black is a different bet
          entirely, since it no longer nets to zero on each branch the way
          win/lose does.
      - ask: >
          A variant pays a dollar if the next unseen card is red and
          nothing if it's black (instead of the win/lose-a-dollar bet).
          What is this variant worth for a freshly shuffled deck?
        choices:
          - text: >
              $0$, by the same reasoning as the win/lose bet.
            feedback: >
              The win/lose bet nets to zero because a loss cancels a win of
              equal size on every branch. A pay-only-on-red bet has no
              matching loss branch, so the same conclusion doesn't carry
              over.
          - text: >
              $1/2$, exactly the unconditional probability the next card is
              red.
            correct: true
            feedback: >
              Right — this payoff is a dollar times an indicator, so its
              fair value is just $1 \times \Pr(\text{red}) = 1/2$, using
              the same conditional-fairness fact as before.
          - text: >
              It depends on how many cards have already been revealed.
            feedback: >
              Conditional fairness holds at every reveal, so the
              unconditional value from a freshly shuffled deck is fixed at
              $1/2$ regardless of any stopping rule applied afterward.
        feedback: >
          Don't reuse an answer across payoff shapes without rechecking:
          the symmetric win/lose bet is worth $0$, but the pay-only-on-red
          variant is worth $1/2$, for the same underlying conditional-
          fairness reason.
      - teach: >
          No stopping rule, however clever, can make the card you finally
          bet on redder than the $1/2$ you started with — the martingale
          property of the red fraction forbids it outright.

  - node: quant-games.ev-games.red-black-stopping
    hook: >
      The immediate follow-up to "why is betting on the next card worth
      $0$" is "then why is this nearly identical-looking game worth real
      money" — and the contrast is the entire point of pairing the two.
    explanation: >
      The difference is what the payoff is actually a bet on. Betting on
      the next single card is a bet on unrevealed information, and that bet
      is fair at every instant, as the previous game showed. Cashing out
      the running surplus of reds minus blacks is not a bet on anything
      unrevealed at all — it's harvesting a quantity that already-revealed
      cards have determined. You get to choose the moment, and the moment
      you choose can be a genuinely favorable one, because the surplus has
      wandered there through real, already-observed draws.

      Pricing it is backward induction on the state $(r,b)$ of reds and
      blacks left: at the boundary, $V(r,0)=r$ because nothing left can hurt
      you, so there's no reason to wait, and $V(0,b)=0$ because nothing left
      can help. In between, $V(r,b)$ is the larger of stopping now for
      $r-b$, or continuing, where the next card is red with probability
      $r/(r+b)$ and black with probability $b/(r+b)$, landing you in a
      smaller state either way.

      The martingale argument from the plain next-card game does not
      transfer here — it says something about the law of the next card,
      nothing about whether an already-accumulated surplus is worth
      cashing in.
    worked: >
      Build up from $V(1,1)=1/2$ and $V(2,2)=2/3$ toward $V(3,3)$. The
      needed asymmetric states along the way work out to $V(2,1)=1$,
      $V(1,2)=1/3$, $V(3,1)=2$, $V(1,3)=1/4$, $V(3,2)=6/5$, $V(2,3)=1/2$,
      each from the same recursion. Combining the last two,
      $V(3,3) = \max\left(0, \tfrac{1}{2}\left(\tfrac{1}{2}\right) +
      \tfrac{1}{2}\left(\tfrac{6}{5}\right)\right) = \max(0, 17/20) =
      0.85$ — a fourth data point climbing toward the full deck's $2.62$.
    interview: >
      The paired question "why does this one have value and the other
      doesn't" is asked precisely to see whether you can name that the
      payoff here is an already-determined running surplus, not a bet on
      an unseen card. State the boundary conditions $V(r,0)=r$,
      $V(0,b)=0$ before writing the recursion.
    pitfalls: >
      Applying the "can't beat $1/2$" martingale reasoning from the plain
      next-card game here is the single most common error — it answers a
      question about the law of the next card, not about whether a running
      surplus can be cashed in. Forgetting either boundary condition breaks
      the whole recursion.
    recap: >
      Cashing out the running red-minus-black surplus at the best moment is
      worth real money because it harvests already-revealed information,
      not a bet on the future — the recursion prices the full deck at
      about $2.62$, growing only like $\sqrt{n}$.
    steps:
      - teach: >
          The immediate follow-up to "why is betting on the next card worth
          $0$" is "then why is this nearly identical-looking game worth
          real money" — and the contrast between the two is the entire
          point of pairing them.
      - teach: >
          The difference is what the payoff actually bets on. Betting on
          the next single card bets on unrevealed information, which is
          fair at every instant. Cashing out the running surplus of reds
          minus blacks harvests a quantity that already-revealed cards
          have determined, and you get to choose a genuinely favorable
          moment to cash it in.
      - ask: >
          Using the boundary condition $V(r,0)=r$ and the given value
          $V(3,1)=2$, what is $V(4,1)$?
        expects: "3"
        hint: >
          Compare stopping now, worth $r-b=4-1$, against continuing, which
          lands you at $V(3,1)$ with probability $4/5$ or the boundary
          $V(4,0)=4$ with probability $1/5$.
        feedback: >
          Continuing gives $\tfrac{4}{5}(2) + \tfrac{1}{5}(4) = 1.6+0.8=
          2.4$, against stopping now for $4-1=3$. Since $3 > 2.4$,
          $V(4,1) = \max(3, 2.4) = 3$: stop immediately.
      - teach: >
          The recursion is the same at every state: $V(r,0)=r$ because
          nothing left can hurt you, $V(0,b)=0$ because nothing left can
          help you, and in between $V(r,b)$ is the larger of stopping now
          for $r-b$ or continuing into a smaller state.
      - ask: >
          Using the boundary condition $V(0,b)=0$ and the given value
          $V(1,3)=1/4$, what is $V(1,4)$?
        expects: "0.2"
        hint: >
          Compare stopping now, worth $r-b=1-4$, against continuing, which
          lands you at $V(0,4)=0$ with probability $1/5$ or $V(1,3)$ with
          probability $4/5$.
        feedback: >
          Continuing gives $\tfrac{1}{5}(0) + \tfrac{4}{5}(1/4) = 0.2$,
          against stopping now for $1-4=-3$. Since $0.2 > -3$,
          $V(1,4) = \max(-3, 0.2) = 0.2$.
      - teach: >
          The martingale argument from the plain next-card game does not
          transfer here. It says something about the law of the next card,
          nothing about whether an already-accumulated surplus is worth
          cashing in.
      - ask: >
          Someone argues this game must also be worth $0$, since it's
          built from the same red/black deck as the next-card guessing
          game, and the red fraction is a martingale there. Is this
          argument correct?
        choices:
          - text: >
              Yes — the martingale property carries over directly.
            feedback: >
              The martingale statement is about the conditional law of the
              next single card, not about whether a running,
              already-banked surplus can be cashed in at a chosen moment —
              it doesn't transfer.
          - text: >
              No — the martingale fact is about the law of the next card,
              not about whether an already-revealed running surplus can be
              cashed in.
            correct: true
            feedback: >
              Right — here the payoff is a function of cards already
              seen, and choosing the stopping moment lets you harvest a
              genuinely favorable state, which the martingale argument says
              nothing about.
          - text: >
              Yes, but only because the deck happens to start balanced.
            feedback: >
              Balance at the start isn't the relevant fact — the argument
              fails regardless, because it conflates a statement about
              future information with a statement about a
              already-determined running total.
        feedback: >
          Applying the "can't beat $1/2$" martingale reasoning here is the
          single most common error — it answers a question about the next
          card, not about whether a running surplus can be cashed in.
      - teach: >
          Both boundary conditions, $V(r,0)=r$ and $V(0,b)=0$, have to hold
          for the recursion to make sense at all — forgetting either one
          breaks every value built on top of it.

  - node: quant-games.ev-games.card-value-draw
    hook: >
      "Does dealing without replacement change the expected total of a
      hand?" is a one-word-answer trap — no — and the interviewer is really
      testing whether you can say why in one line.
    explanation: >
      Every position in a shuffled deck is marginally the same draw as the
      first card. Nothing about a uniform shuffle privileges position $3$
      over position $30$: relabeling the deck's positions doesn't change
      the shuffle's distribution, so the card sitting in any fixed position
      is equally likely to be any of the $52$ cards, exactly like the first
      card is. That gives every position the same mean value, $7$, even
      though the actual value drawn there is correlated with everything
      drawn before it.

      Summing several such positions to price a hand needs only linearity,
      which was never conditioned on independence in the first place — so
      a five-card hand prices at $5\times7=35$ whether the cards are dealt
      with or without replacement. What changes between the two dealing
      rules is the variance: without replacement, an extreme early draw
      removes an extreme card from what's left, so hands self-correct
      toward the mean and swing less than they would if draws were
      independent. The mean never sees any of that correction, because it
      never needed the draws to be independent to add correctly.

      A counting payoff prices the same way — a dollar for every card
      meeting some condition is just that condition's single-card
      probability, multiplied by however many cards are dealt.
    worked: >
      Deal a $3$-card hand from the same $A=1$ through $K=13$ deck. The
      total values at $3\times7=21$. A dollar for every ten-or-higher card
      ($10,J,Q,K$, $16$ of the $52$ cards) prices at
      $3\times(16/52) = 3\times(4/13) = 12/13\approx0.923$.
    interview: >
      "Does dependence from dealing without replacement change the fair
      price?" wants "no, only the variance" stated immediately, backed by
      the one-line reason — marginal uniformity plus linearity — rather
      than a hedge like "it should be close."
    pitfalls: >
      Assuming dependence between draws must show up somewhere in the mean,
      and trying to "correct" the naive sum-of-means answer, is the classic
      overreach — there's no correction, the naive sum is exact. Confusing
      "a dollar per ace" (an additive count) with "at least one ace" (a
      genuinely different quantity) is the other common slip.
    recap: >
      Every dealt position is marginally the same uniform draw as the
      first card, so a hand's total or any per-card counting payoff prices
      by plain multiplication, however strongly the draws are correlated
      with each other.
    steps:
      - teach: >
          "Does dealing without replacement change the expected total of a
          hand?" is a one-word-answer trap — no — and the interesting part
          is being able to say why in one line.
      - teach: >
          Every position in a shuffled deck is marginally the same draw as
          the first card: relabeling the deck's positions doesn't change
          the shuffle's distribution, so the card sitting in any fixed
          position is equally likely to be any of the $52$ cards, exactly
          like the first card is.
      - ask: >
          Deal a $4$-card hand from the $A=1$ through $K=13$ deck (total
          pips $364$, $52$ cards, single-card value $364/52=7$). What is
          the fair value of the hand's total?
        expects: "28"
        hint: >
          Multiply the single-card value by the number of cards dealt —
          linearity doesn't need independence.
        feedback: >
          Each of the $4$ positions is marginally worth $7$, and linearity
          adds regardless of dependence, so the hand totals
          $4 \times 7 = 28$.
      - teach: >
          A counting payoff prices the same way: a dollar for every card
          meeting some condition is just that condition's single-card
          probability, multiplied by however many cards are dealt.
      - ask: >
          A game pays a dollar for every face card ($J,Q,K$; $12$ of the
          $52$ cards) in a $6$-card hand. What is the fair value?
        expects: "18/13"
        tolerance: 0.0005
        hint: >
          Multiply the number of cards dealt by the single-card
          probability of a face card, $12/52$.
        feedback: >
          $6 \times (12/52) = 6 \times (3/13) = 18/13 \approx 1.3846$, the
          count of cards dealt times the single-card probability.
      - teach: >
          Assuming dependence between draws must show up somewhere in the
          mean, and trying to "correct" the naive sum-of-means answer, is
          the classic overreach — there's no correction, the naive sum is
          exact.
      - ask: >
          A five-card hand's total is computed as $5\times7=35$ using the
          naive sum-of-means approach. Because draws without replacement
          are dependent, should this be corrected?
        choices:
          - text: >
              Yes, subtract a small dependence correction.
            feedback: >
              There's nothing to correct — marginal uniformity plus
              linearity make the naive sum exact, dependence or not.
          - text: >
              No — marginal uniformity plus linearity make the naive sum
              exact regardless of dependence.
            correct: true
            feedback: >
              Right — the mean never needed the draws to be independent to
              add correctly; dependence only changes the variance, never
              the mean.
          - text: >
              Yes, but only if more than half the deck is drawn.
            feedback: >
              The exactness of the naive sum doesn't depend on how much of
              the deck is drawn — it holds for any hand size, from a
              single card to the whole deck.
        feedback: >
          Dependence from dealing without replacement moves the variance,
          never the price — the naive sum-of-means answer is exact at any
          hand size.
      - teach: >
          Keep "a dollar per ace" (an additive counting payoff, priced by
          this rule) separate from "at least one ace" (a genuinely
          different quantity that this rule does not price).

  - node: quant-games.ev-games.ace-positions
    hook: >
      Deck-position questions stop feeling hard the moment you stop
      tracking the aces and start tracking the gaps between them — the same
      exchangeability you already trust, aimed at a new object.
    explanation: >
      Picture the $48$ non-ace cards laid out and the $4$ aces dropped in
      as dividers, cutting the sequence into $5$ gaps. Nothing about a
      uniform shuffle privileges the gap before the first ace over the gap
      after the last one — reversing or relabeling the deck maps one valid
      gap configuration to another equally likely one — so the $5$ gap
      sizes are exchangeable, exactly the property that let a known total
      split evenly among exchangeable parts elsewhere. Their total is fixed
      at $48$, so each gap averages $48/5=9.6$.

      From there it's bookkeeping: "cards before the first ace" is exactly
      the first gap, $9.6$, while "position of the first ace" is one more
      than that, $10.6$, since the ace itself occupies the slot right after
      its gap. The last ace is priced by the mirror image of the same
      argument, landing at $53-10.6=42.4$.

      The pattern generalizes past aces: $k$ special cards cut the deck
      into $k+1$ exchangeable gaps of $(52-k)/(k+1)$ each, and the same
      $+1$ bookkeeping converts a gap size into a position.
    worked: >
      Price the two black aces specifically ($k=2$). The $50$ other cards
      split into $k+1=3$ exchangeable gaps, each averaging $50/3\approx
      16.67$. The first black ace sits at $50/3+1=53/3\approx17.67$ on
      average, and by the mirror argument the second sits at
      $53-53/3=106/3\approx35.33$.
    interview: >
      "What position do you expect the second heart to appear at" or any
      variant with a different special-card count tests whether you
      generalize past the ace-specific numbers to $k$ special cards and
      $k+1$ gaps, rather than trying to recall a memorized answer.
    pitfalls: >
      Using $k$ gaps instead of $k+1$ drops the gap after the last special
      card. Applying the $+1$ conversion between "cards before" and
      "position of" inconsistently between the first-occurrence and
      last-occurrence versions is the other reliable source of an
      off-by-one.
    recap: >
      $k$ special cards cut a shuffled deck into $k+1$ exchangeable gaps of
      $(52-k)/(k+1)$ each — the two black aces average $53/3\approx17.67$
      for the first and $106/3\approx35.33$ for the second.
    steps:
      - teach: >
          Deck-position questions stop feeling hard the moment you stop
          tracking the special cards and start tracking the gaps between
          them — the same exchangeability you already trust, aimed at a new
          object.
      - teach: >
          Picture the non-special cards laid out and the $k$ special cards
          dropped in as dividers, cutting the sequence into $k+1$ gaps.
          Nothing about a uniform shuffle privileges one gap over another,
          so all $k+1$ gap sizes are exchangeable, and their total is fixed
          at $52-k$.
      - ask: >
          Treat the three kings as special ($k=3$). What is the average
          size of one of the exchangeable gaps they cut the other $49$
          cards into?
        expects: "12.25"
        hint: >
          Three special cards make $k+1=4$ exchangeable gaps out of the
          $49$ remaining cards.
        feedback: >
          The $49$ other cards split into $k+1=4$ exchangeable gaps, so
          each averages $49/4 = 12.25$.
      - teach: >
          Converting a gap size into a position needs one bit of
          bookkeeping: "cards before the first special card" is exactly the
          first gap, while "position of the first special card" is one
          more than that, since the card itself occupies the slot right
          after its gap. The last special card is priced by the mirror
          image of the same argument.
      - ask: >
          Still with the three kings ($k=3$, first gap averaging $12.25$),
          what position does the last king occupy on average?
        expects: "39.75"
        hint: >
          First add $1$ to the gap size to get the position of the first
          king, then mirror it: $53$ minus that position.
        feedback: >
          The first king sits at $12.25+1=13.25$ on average, and by the
          mirror argument the last sits at $53-13.25=39.75$.
      - teach: >
          Using $k$ gaps instead of $k+1$ is the single most reliable
          off-by-one here — it drops the gap that sits after the last
          special card.
      - ask: >
          For $k=3$ special cards cutting a shuffled deck, how many
          exchangeable gaps are there?
        choices:
          - text: >
              $3$
            feedback: >
              This drops the gap after the last special card — $3$ dividers
              cut a line into $4$ pieces, not $3$.
          - text: >
              $4$
            correct: true
            feedback: >
              Right — $k$ special cards act as $k$ dividers, cutting the
              remaining cards into $k+1$ exchangeable gaps.
          - text: >
              It depends on which specific cards are special.
            feedback: >
              The count of gaps depends only on $k$, the number of special
              cards, never on which particular cards they are — that's
              exactly what exchangeability buys you.
        feedback: >
          $k$ special cards always cut a shuffled deck into $k+1$
          exchangeable gaps — count the dividers, then add one for the
          final gap.
      - teach: >
          The pattern generalizes past aces or kings to any $k$: $k+1$
          exchangeable gaps of $(52-k)/(k+1)$ each, with the same $+1$
          bookkeeping turning a gap size into a position.

  - node: quant-games.ev-games.risk-aversion
    hook: >
      "Here's a coin flip with clearly positive expected value — would you
      take it?" is a trap for anyone who answers with the EV alone; the
      interviewer wants to hear that a rational person can still say no.
    explanation: >
      Expected value treats every dollar the same regardless of how much
      wealth is already at stake, and that's precisely the assumption a
      concave utility $u$ gives up. A bettor with wealth $W$ maximizes
      $\mathbb{E}[u(W+X)]$, and because $u$ bends downward, a loss and an
      equally sized gain are not mirror images in utility terms — the loss
      costs more utility than the matching gain buys back. That asymmetry
      can flip the sign: a bet can have strictly positive
      $\mathbb{E}[X]$ and still strictly negative $\mathbb{E}[u(W+X)]-u(W)$,
      making decline the rational choice, not a failure of nerve.

      Two rules follow from taking this seriously rather than just
      asserting it. Refuse outright any bet carrying a real chance of ruin,
      however large the edge, because ruin is absorbing — there is no next
      game to average the loss against, so no finite edge compensates for
      an infinite downside in utility terms. Short of ruin, the right
      response to a positive-EV bet is not refusal but sizing: shrink the
      stake until concavity barely bites, a question about how much to bet
      rather than whether the edge is real, and one this unit sets aside
      for the log-wealth machinery of Kelly sizing.
    worked: >
      A log-utility investor with wealth $100$ is offered a fair coin flip:
      win $60$ or lose $40$. The outcomes are wealth $160$ or $60$, each
      with probability $0.5$, so $\mathbb{E}[\text{gain}] = 0.5(60)+0.5(-40)
      = 10$, clearly positive. But expected utility is
      $0.5\ln(160)+0.5\ln(60) \approx 0.5(5.075)+0.5(4.094) = 4.5848$,
      while not playing gives $\ln(100)\approx4.6052$ — since
      $4.5848 < 4.6052$, this log-utility investor rationally declines a
      $+10$-EV bet.
    interview: >
      The complete answer has two parts: confirm the EV is positive with
      the arithmetic, then explain why a rational agent can still decline
      by naming concavity and the stake's size relative to wealth — neither
      "just take it, it's positive EV" nor "no, too risky" alone answers
      what's being asked.
    pitfalls: >
      Treating "always take positive-EV bets" as a blanket rule ignores the
      stake-to-bankroll ratio entirely. Treating every refusal of a
      positive-EV bet as irrational makes the opposite mistake — expected
      utility, not expected value, is the actual objective once the stake
      is large.
    recap: >
      A positive-EV bet is one you can rationally refuse once the stake is
      large relative to bankroll, because a concave utility weighs the loss
      branch more heavily than the equal-sized gain branch — a fair
      $+60/-40$ flip on wealth $100$ has EV $+10$ yet lower expected
      log-utility than not playing.
    steps:
      - teach: >
          "Here's a coin flip with clearly positive expected value — would
          you take it?" is a trap for anyone who answers with the EV alone;
          the interviewer wants to hear that a rational person can still
          say no.
      - teach: >
          Expected value treats every dollar the same regardless of how
          much wealth is already at stake, and a concave utility $u$ gives
          that up: a bettor with wealth $W$ maximizes
          $\mathbb{E}[u(W+X)]$, and because $u$ bends downward, a loss costs
          more utility than an equally sized gain buys back.
      - ask: >
          Wealth $50$, a fair coin flip: win $30$ or lose $20$. What is
          $\mathbb{E}[\text{gain}]$?
        expects: "5"
        hint: >
          Weight each outcome by its own probability of $0.5$ and add.
        feedback: >
          $0.5(30) + 0.5(-20) = 15 - 10 = 5$: the flip is clearly
          positive-EV before any utility enters.
      - teach: >
          Two rules follow from taking concavity seriously. Refuse outright
          any bet carrying a real chance of ruin, however large the edge,
          because ruin is absorbing and there is no next game to average
          against. Short of ruin, the right response to a positive-EV bet
          is sizing it down, not refusing it.
      - ask: >
          Wealth $50$, log utility, that same fair $+30/-20$ flip. Using
          $\ln(80)\approx4.3820$, $\ln(30)\approx3.4012$, and
          $\ln(50)\approx3.9120$, does this log-utility investor take the
          bet?
        choices:
          - text: >
              Yes — $\mathbb{E}[\text{gain}]=5>0$, and that settles it.
            feedback: >
              A positive $\mathbb{E}[\text{gain}]$ only settles the
              risk-neutral question; expected utility, not expected value,
              is this investor's actual objective.
          - text: >
              No — expected log-utility, $0.5(4.3820)+0.5(3.4012)\approx
              3.8916$, is below $\ln(50)\approx3.9120$, despite the
              positive EV.
            correct: true
            feedback: >
              Right — $3.8916 < 3.9120$, so declining raises this
              investor's expected utility even though it turns down a
              genuinely positive-EV bet.
          - text: >
              It's impossible to tell without knowing this investor's risk
              tolerance beyond the utility function.
            feedback: >
              The utility function already pins the decision down
              completely — comparing $\mathbb{E}[u(W+X)]$ to $u(W)$
              answers it with no further information needed.
        feedback: >
          Positive $\mathbb{E}[X]$ and negative $\mathbb{E}[u(W+X)]-u(W)$
          can coexist, and when they do, declining is the rational choice
          for that utility, not a failure of nerve.
      - teach: >
          Treating "always take positive-EV bets" as a blanket rule ignores
          the stake-to-bankroll ratio entirely, and treating every refusal
          as irrational makes the opposite mistake.
      - ask: >
          A bettor with wealth $50$ is offered a bet with clearly positive
          EV but a real chance of losing everything (wealth going to $0$).
          What do the two rules say to do?
        choices:
          - text: >
              Take it, since the edge is positive.
            feedback: >
              A positive edge doesn't compensate for ruin — ruin is
              absorbing, so there's no next game left to average the loss
              against, however favorable the bet looks.
          - text: >
              Refuse it outright, regardless of the edge size, because ruin
              is absorbing.
            correct: true
            feedback: >
              Right — the first rule is unconditional: any real chance of
              ruin is refused however large the edge, full stop.
          - text: >
              Take it, but size the stake down until the ruin probability
              is merely small.
            feedback: >
              Sizing down is the right response to ordinary concavity, but
              it's the wrong tool for outright ruin risk — a real chance of
              wipeout is refused, not merely shrunk.
        feedback: >
          Ruin is the one case where sizing down isn't the answer: any real
          chance of it is refused outright, no matter how favorable the
          edge looks on paper.
      - teach: >
          The complete answer always has two parts: confirm the EV's sign
          with the arithmetic, then say whether a rational agent still
          takes it, naming concavity and the stake's size relative to
          wealth.

  - node: quant-games.ev-games.certainty-equivalent
    hook: >
      "What's the most you'd pay to make this risk go away?" is asking for
      the certainty equivalent by name, and it's the number that turns
      risk aversion from a qualitative story into an actual price.
    explanation: >
      The certainty equivalent $c$ solves $u(W+c)=\mathbb{E}[u(W+X)]$: it's
      the sure amount that produces exactly the same utility as playing the
      game, so it's the largest price at which you'd still rather play than
      walk away with cash instead. Since $u$ is strictly increasing it's
      invertible, so $c$ is uniquely determined, and for concave $u$ the
      risk premium $\mathbb{E}[X]-c$ comes out nonnegative — a concave
      function's value at the average input is never below the average of
      its values, so accepting the average payoff for certain is always at
      least as good in utility terms as facing the gamble.

      The Arrow-Pratt approximation comes from Taylor-expanding $u$ around
      $W$: $u(W+X)\approx u(W)+u'(W)X+\tfrac{1}{2}u''(W)X^{2}$, so
      $\mathbb{E}[u(W+X)]\approx u(W)+u'(W)\mathbb{E}[X]+
      \tfrac{1}{2}u''(W)\operatorname{Var}(X)$ once you center at $c$'s own
      first-order expansion, $u(W+c)\approx u(W)+u'(W)c$. Matching the two
      and solving for $c$ leaves the premium at roughly
      $\tfrac{1}{2}A(W)\operatorname{Var}(X)$, where $A=-u''/u'$ — a purely
      local fact, accurate only while the bet stays small next to $W$.
    worked: >
      Log utility, $W=50$, a fair coin flip of $\pm20$ (wealth $70$ or
      $30$). Exact: $\ln(50+c)=0.5\ln(70)+0.5\ln(30)\approx3.8248$, so
      $50+c\approx e^{3.8248}\approx45.83$ and $c\approx-4.17$, a risk
      premium of about $4.17$. Arrow-Pratt: $A(50)=1/50$, so the premium
      approximates to $\tfrac{1}{2}(1/50)(20^{2})=4$ — close, but already
      about $4\%$ off at a stake this large relative to $W$.
    interview: >
      "What guaranteed amount would make you indifferent to this bet?" is
      answered by setting up $u(W+c)=\mathbb{E}[u(W+X)]$ immediately; under
      time pressure, naming the Arrow-Pratt shortcut
      $\tfrac{1}{2}A(W)\operatorname{Var}(X)$ as a fast estimate is the
      fluent move.
    pitfalls: >
      Confusing the certainty equivalent (a dollar amount) with expected
      utility itself (a utility-scale number that isn't directly
      comparable to dollars) skips the inversion step. Trusting the
      Arrow-Pratt approximation as exact for a bet that isn't actually
      small relative to wealth — as this worked example's $4\%$ gap
      shows — overstates its precision.
    recap: >
      The certainty equivalent solves $u(W+c)=\mathbb{E}[u(W+X)]$ for the
      sure amount you'd trade the bet for, and the resulting risk premium
      is approximated for small bets by $\tfrac{1}{2}A(W)\operatorname{Var}
      (X)$ — about $4.17$ against an approximation of $4$ for a $\pm20$
      flip on wealth $50$.
    steps:
      - teach: >
          "What's the most you'd pay to make this risk go away?" is asking
          for the certainty equivalent by name — the number that turns risk
          aversion from a qualitative story into an actual price.
      - teach: >
          The certainty equivalent $c$ solves $u(W+c)=\mathbb{E}[u(W+X)]$:
          the sure amount that produces exactly the same utility as
          playing. Since $u$ is strictly increasing it's invertible, so
          $c$ is unique, and for concave $u$ the risk premium
          $\mathbb{E}[X]-c$ always comes out nonnegative.
      - ask: >
          Log utility, wealth $100$, Arrow-Pratt coefficient $A(100)=1/100$
          for a fair $\pm10$ flip (so $\operatorname{Var}(X)=100$). What
          does the Arrow-Pratt formula $\tfrac{1}{2}A(W)\operatorname{Var}
          (X)$ give for the approximate risk premium?
        expects: "0.5"
        hint: >
          Multiply $\tfrac{1}{2}$, $1/100$, and $100$ together.
        feedback: >
          $\tfrac{1}{2}(1/100)(100) = 0.5$: the local, small-bet
          approximation to the risk premium.
      - teach: >
          The approximation comes from Taylor-expanding $u$ around $W$ and
          matching first-order terms — it's a purely local fact, accurate
          only while the bet stays genuinely small next to $W$.
      - ask: >
          Same setup — log utility, $W=100$, fair $\pm10$ flip (wealth
          $110$ or $90$). Using $\ln(110)\approx4.7005$ and
          $\ln(90)\approx4.4998$, solve $\ln(100+c) =
          0.5(4.7005)+0.5(4.4998)$ for $c$, then state the exact risk
          premium $\mathbb{E}[X]-c$ (recall $\mathbb{E}[X]=0$ for a fair
          flip).
        expects: "0.5013"
        tolerance: 0.0005
        hint: >
          Average the two logs to get $\ln(100+c)$, exponentiate to solve
          for $100+c$, then subtract $100$ and flip the sign for the
          premium.
        feedback: >
          $0.5(4.7005)+0.5(4.4998)=4.60015$, so $100+c\approx
          e^{4.60015}\approx99.499$, giving $c\approx-0.501$ and a premium
          of $\mathbb{E}[X]-c\approx0-(-0.501)=0.501$ — very close to the
          Arrow-Pratt estimate of $0.5$, since the $\pm10$ stake is small
          next to $W=100$.
      - teach: >
          Confusing the certainty equivalent (a dollar amount) with
          expected utility itself (a utility-scale number, not directly
          comparable to dollars) skips the inversion step that actually
          defines $c$.
      - ask: >
          A candidate computes $\mathbb{E}[u(W+X)]\approx3.89$ for some
          game and states "the certainty equivalent is $3.89$." What's
          wrong?
        choices:
          - text: >
              Nothing — that's exactly the certainty equivalent.
            feedback: >
              $\mathbb{E}[u(W+X)]$ lives on the utility scale, not the
              dollar scale — reading it off directly as a dollar amount
              skips the step that actually defines $c$.
          - text: >
              Expected utility is on a utility scale, not dollars — you
              still need to solve $u(W+c)=\mathbb{E}[u(W+X)]$ for $c$.
            correct: true
            feedback: >
              Right — $3.89$ only becomes a dollar figure once you invert
              $u$ and solve for $c$; treating it as $c$ directly conflates
              two different scales.
          - text: >
              The mistake is computing $\mathbb{E}[u(W+X)]$ at all instead
              of $u(\mathbb{E}[W+X])$.
            feedback: >
              $\mathbb{E}[u(W+X)]$ is exactly the right quantity to
              compute — the missing step is inverting $u$ to convert it
              back into a dollar amount $c$, not avoiding it.
        feedback: >
          Expected utility and the certainty equivalent live on different
          scales; the inversion $u(W+c)=\mathbb{E}[u(W+X)]$ is what
          converts one into the other.
      - teach: >
          Trust the Arrow-Pratt shortcut for a quick estimate under time
          pressure, but remember it's only local — the gap between the
          exact and approximate premium widens as the stake grows relative
          to wealth.

  - node: quant-games.ev-games.repeated-edge
    hook: >
      "You have a small edge — how many times do you need to trade it
      before you actually know it's real?" is asking you to compare two
      growth rates, and the answer — a square root, not linear — is why
      thin edges are businesses only at real scale.
    explanation: >
      Two forces move at different speeds as the number of bets $n$ grows.
      The signal — mean profit — accumulates linearly: $n$ bets each
      contributing the same per-bet edge sum to $n$ times that edge,
      regardless of any correlation between the bets, since expectation
      never needed independence to add. The noise — the standard deviation
      of profit — grows only like $\sqrt{n}$, because each bet's
      fluctuation around its own mean is roughly independent of the others,
      and independent fluctuations partly cancel rather than stacking
      directly.

      Dividing the two gives the signal-to-noise ratio: $(n\cdot
      \text{edge})/(\sigma\sqrt{n}) = (\text{edge}/\sigma)\sqrt{n}$, which
      itself grows only like $\sqrt{n}$. Quadrupling the number of bets
      only doubles your confidence that the edge is real; getting ten times
      as confident costs a hundred times the volume.

      This is the quantitative reason sizing, not the existence of the
      edge, is the binding constraint in practice — surviving the long,
      noisy stretch before the signal clears the noise is a drawdown
      question, which this unit hands off to Kelly sizing rather than
      answering here.
    worked: >
      A strategy earns an edge of $0.02$ per trade with a per-trade
      standard deviation of $5$. At $n=2500$ trades, mean profit is
      $2500(0.02)=50$ and the standard deviation is $5\sqrt{2500}=250$, a
      signal-to-noise ratio of just $0.2$ — statistically indistinguishable
      from noise. At $n=250{,}000$ trades, mean profit is $5000$ against a
      standard deviation of $5\sqrt{250{,}000}=2500$, a ratio of $2$: a
      hundredfold increase in volume bought only a tenfold rise in
      confidence.
    interview: >
      "You've got a $2$-cent edge with $5$ dollars of volatility per
      trade — how many trades before you trust it?" wants the
      $(\text{edge}/\sigma)\sqrt{n}$ scaling stated explicitly, ideally
      followed by solving for the $n$ a target confidence level actually
      requires.
    pitfalls: >
      Treating a positive mean profit after some stretch of trading as
      proof the edge is real ignores the ratio entirely — the worked
      example's $2500$-trade result is a real, positive number that is
      still only $0.2$ standard deviations from noise. Assuming volume and
      confidence scale together linearly is the error the whole $\sqrt{n}$
      law exists to correct.
    recap: >
      Mean profit accumulates $n$ times the per-bet edge while its standard
      deviation grows only $\sqrt{n}$ times the per-bet volatility, so
      confidence in an edge grows only like $\sqrt{n}$ — a hundredfold
      increase in trades bought only a tenfold rise in signal-to-noise in
      the worked example.
    steps:
      - teach: >
          "You have a small edge — how many times do you need to trade it
          before you actually know it's real?" is asking you to compare two
          growth rates, and the answer, a square root rather than a line,
          is why thin edges are businesses only at real scale.
      - teach: >
          Mean profit accumulates linearly: $n$ bets each contributing the
          same per-bet edge sum to $n$ times that edge, regardless of any
          correlation between the bets. The standard deviation of profit
          grows only like $\sqrt{n}$, since independent fluctuations partly
          cancel rather than stacking directly.
      - ask: >
          A strategy has a per-trade edge of $0.01$ and a per-trade
          standard deviation of $2$. After $n=400$ trades, what is the mean
          profit?
        expects: "4"
        hint: >
          Multiply the number of trades by the per-trade edge.
        feedback: >
          $400 \times 0.01 = 4$: the signal after $400$ trades.
      - teach: >
          Dividing the two gives the signal-to-noise ratio,
          $(n\cdot\text{edge})/(\sigma\sqrt{n}) =
          (\text{edge}/\sigma)\sqrt{n}$, and this ratio itself grows only
          like $\sqrt{n}$ — quadrupling the trade count only doubles your
          confidence that the edge is real.
      - ask: >
          Same strategy (edge $0.01$, standard deviation $2$ per trade), now
          at $n=40{,}000$ trades — a hundredfold increase in volume from the
          previous card. What is the signal-to-noise ratio,
          $(n\cdot\text{edge})/(\sigma\sqrt{n})$?
        expects: "1"
        hint: >
          Mean profit is $400$ and the standard deviation is
          $2\sqrt{40{,}000}$ — divide one by the other.
        feedback: >
          Mean profit is $40{,}000(0.01)=400$ and the standard deviation is
          $2\sqrt{40{,}000}=400$, giving a ratio of exactly $1$ — a
          hundredfold increase in volume bought only a tenfold rise in
          signal-to-noise, from $0.1$ at $n=400$ to $1$ here.
      - teach: >
          Treating a positive mean profit after some stretch of trading as
          proof the edge is real ignores the ratio entirely — a real,
          positive profit can still sit far inside the noise.
      - ask: >
          After the $n=400$ trades above, mean profit is a positive $4$. A
          trader claims this proves the $1\%$ edge is real. What's wrong
          with that claim?
        choices:
          - text: >
              Nothing is wrong — positive profit proves the edge is real.
            feedback: >
              A positive number by itself says nothing about significance —
              it has to be compared to the noise, which here is much larger
              than the signal.
          - text: >
              The profit's signal-to-noise ratio is only $4/40=0.1$, far
              inside the noise — positive doesn't mean statistically
              significant.
            correct: true
            feedback: >
              Right — a ratio of $0.1$ is nowhere near enough to distinguish
              this result from pure noise, even though the sign happens to
              be positive.
          - text: >
              The trader needs to run negative trades to balance the sample.
            feedback: >
              Deliberately seeking losing trades doesn't address
              significance at all — the fix is more volume, not
              artificially balanced outcomes.
        feedback: >
          A positive result and a statistically significant result are not
          the same claim — check the signal-to-noise ratio before trusting
          either one.
      - teach: >
          Surviving the long, noisy stretch before the signal clears the
          noise is a drawdown question, which this unit hands off to
          sizing rather than answering here — the edge existing and the
          edge being tradable are two different problems.
