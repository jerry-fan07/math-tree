unit: quant-games.ev-games
opening: >
  Every game in this unit reduces to one question — what is the expected
  payoff, and does that number tell the whole story? The first stretch is
  pure pricing: fair value as expectation, the symmetry moves that answer
  a question before you write a sum, and conditioning on the first roll or
  draw to collapse a multi-stage game into one equation. From there the
  unit turns to optionality — the right to look before you commit is worth
  money, re-roll ladders read as price lists, and stopping games show when
  waiting for information pays and when it provably cannot. It closes on
  the limit of expected value itself: risk aversion, the certainty
  equivalent that prices it, and why a small repeatable edge still needs
  enormous volume before it is more than noise.
lessons:
  - node: quant-games.ev-games.fair-value
    hook: >
      "What would you pay to play this?" is the single most common opening
      of a quant interview, and it is always asking for $\mathbb{E}[X]$ by
      another name — everything else in this unit is a shortcut for
      computing that number faster.
    explanation: >
      Fair value is risk-neutral by construction: it is the price at which
      neither buying nor selling the game has a expected profit, so a
      rational counterparty is indifferent to which side of the trade they
      take. Once you fix that price at $\mathbb{E}[X]$, your edge at any
      other quoted price $p$ is just $\mathbb{E}[X]-p$ — positive when you
      pay less than fair value, negative when you pay more, with the sign
      flipping the moment you switch from buyer to seller.

      Two structural facts fall out immediately and both get tested. First,
      the price depends only on the law of the payoff, never on the
      physical mechanism producing it — a game described as "roll a die"
      and one described as "draw a numbered ball from a bag of six" price
      identically the moment their payoff distributions match. Second,
      because expectation is linear, a payoff built from several pieces
      prices by adding each piece's own fair value, with no need to work
      out how the pieces interact.

      This number says nothing yet about whether you should actually play —
      it assumes you are risk-neutral and the stake is small next to your
      bankroll, a assumption this unit revisits once variance enters.
    worked: >
      A spinner pays $12$ with probability $0.2$, $4$ with probability
      $0.5$, and nothing otherwise, and separately every player collects a
      flat $1$ loyalty credit regardless of outcome. Fair value is
      $0.2(12)+0.5(4)+1 = 2.4+2+1 = 5.4$, the two components simply added.
      Quoted at $5$, buying nets an edge of $0.4$; quoted at $6$, selling
      instead nets an edge of $0.6$.
    interview: >
      Expect the phrase verbatim — "what would you pay to play this game" —
      and the interviewer is listening for the weighted sum set up on the
      spot, not a guess at a "typical" outcome. A common follow-up asks you
      to state your edge at a specific quoted price, testing whether you
      remember the sign depends on which side of the trade you're on.
    pitfalls: >
      Averaging the possible payoffs without weighting by their
      probabilities is the single most common error at this step. Treating
      a multi-part payoff as needing the parts' dependence worked out before
      pricing wastes time the additivity of expectation makes unnecessary.
    recap: >
      Fair value is $\mathbb{E}[X]$, your edge is that number minus what
      you pay, and both depend only on the payoff's law, never on the
      mechanism that generates it.

  - node: quant-games.ev-games.pay-per-pip
    hook: >
      Interviewers reuse the same die with a different payoff function
      specifically to see whether you push the function through the
      expectation sign or redo the weighted sum from scratch.
    explanation: >
      A payoff rule is a function applied to each outcome before you
      average, never applied to the mean afterward. Changing "pay the face"
      to "pay some function of the face" changes which value gets weighted
      by which probability, and there is no shortcut that reuses the plain
      mean — you rebuild the weighted sum with the new payoff plugged in at
      every outcome.

      This matters because the gap between $\mathbb{E}[g(X)]$ and
      $g(\mathbb{E}[X])$ can be large even for an innocuous-looking $g$. A
      convex payoff like a square or a cube systematically rewards the
      outcomes far from the mean more than it rewards the mean itself, so
      averaging the transformed values always comes out above transforming
      the average — the gap is the whole reason "square the payoff" is a
      favorite interview variant of any base game.

      A threshold payoff (pay only if some condition holds) is the other
      common variant, and it collapses to a single term: the payout times
      the probability the condition holds, nothing more.
    worked: >
      Roll one fair six-sided die and collect the cube of the face. The
      payoff is $X^{3}$ for $X$ uniform on $\{1,\dots,6\}$, so the fair
      value is $\mathbb{E}[X^{3}] = (1+8+27+64+125+216)/6 = 441/6 = 73.5$ —
      far above $3.5^{3} = 42.875$, the number you'd get by cubing the mean
      instead of averaging the cubes.
    interview: >
      "Same die, but you're paid the square (or cube) of the face" tests
      exactly this reflex — the expected response sets up
      $\sum_x g(x)p(x)$ immediately rather than computing $g(\mathbb{E}[X])$
      and calling it done.
    pitfalls: >
      Sliding a nonlinear $g$ through the expectation sign is the classic
      error this node exists to catch. For a threshold payoff, forgetting
      to multiply by the probability the condition actually holds — instead
      averaging only over the outcomes where it does — silently drops the
      other outcomes from the sum.
    recap: >
      A payoff function is applied outcome by outcome before averaging, so
      paying the cube of a fair die's face is worth $73.5$, nowhere near
      the cube of its mean.

  - node: quant-games.ev-games.symmetry-pricing
    hook: >
      Symmetry answers or checks a pricing question before you write a
      single term of the sum, and interviewers use it to see whether you
      reach for it by reflex or grind through the algebra anyway.
    explanation: >
      Reflection symmetry and exchangeable-total symmetry already price
      most static games outright. The move genuinely new to game pricing is
      a third one: a zero-sum contest whose rules treat the two sides
      identically is worth $0$ to each, however complicated the mechanism.
      The reasoning is a swap argument, not a computation — if relabeling
      the two players leaves the joint law of the outcome unchanged, then
      player $A$'s expected net payoff must equal player $B$'s, but in a
      zero-sum game $B$'s payoff is always $-1$ times $A$'s, forcing
      $\mathbb{E}[\text{net to }A] = -\mathbb{E}[\text{net to }A]$, which
      only $0$ satisfies.

      The payoff of this move is that it needs no knowledge of the actual
      process — a multi-round race, a repeated draw-off, an arbitrarily
      intricate tie-breaking rule all fall to the same one-line argument, as
      long as the rule genuinely doesn't distinguish the two seats.

      Treat symmetry as a discipline: check the invariance actually holds —
      unequal antes, a first-mover edge, or hidden information all break
      it — before invoking it, and use it afterward to sanity-check a
      direct computation that looks asymmetric when it shouldn't be.
    worked: >
      Two traders repeatedly flip a fair coin in a race to three heads;
      whoever gets there first collects a fixed $50$ from the other, with
      any tie-breaking handled by a rule that treats both players the same
      way. Whatever that rule's details, swapping which trader is "player
      $A$" leaves the whole setup unchanged, so
      $\mathbb{E}[\text{net to }A] = -\mathbb{E}[\text{net to }A] = 0$ — the
      race is fair with no entry fee, without ever analyzing the race
      itself.
    interview: >
      "Is this fair to both sides?" or "what's your edge as player $A$" is
      answered fastest by naming the swap invariance directly rather than
      computing a stopping-time distribution. It also doubles as a check —
      if your direct computation of a symmetric setup doesn't collapse to
      $0$ or $c/2$, you've made an arithmetic error.
    pitfalls: >
      Invoking symmetry when a real asymmetry is hiding in the setup —
      unequal stakes, an information edge, who moves first — produces a
      confidently wrong $0$. Using a valid zero-sum symmetry to answer a
      question about variance or the full distribution overreaches, since
      symmetry only pins down the mean.
    recap: >
      A zero-sum game whose rules don't distinguish the two seats is worth
      $0$ to each side by a pure swap argument, no matter how complicated
      the underlying process is.

  - node: quant-games.ev-games.condition-first-draw
    hook: >
      Once a game restarts, shrinks, or changes state after the first roll,
      naming the value of "everything from here on" as an unknown and
      writing one equation for it turns an unbounded process into
      arithmetic.
    explanation: >
      Two distinct shapes show up under "condition on the first roll." In
      the first, the game genuinely restarts in an identical state after a
      failed first attempt — the same die, the same rules, nothing lost
      except whatever was already collected. Calling the game's value $V$
      and writing one equation that puts $V$ on both sides is exactly the
      right move here, because the continuation truly is a fresh copy of
      the whole game.

      In the second shape, the first outcome sets a parameter for a
      different, smaller sub-game rather than restarting the same one — a
      first roll of $N$ that determines how many dice you then roll and
      sum. There, conditioning gives a genuine weighted average across
      branches that differ structurally from each other and from the
      original game, and the average often collapses fast when the inner
      quantity is itself a plain expectation.

      Either way the discipline is the same: split on the first outcome,
      write down what happens on each branch including anything already
      collected, and solve — self-referentially when the branches loop
      back to $V$, by direct averaging when they don't.
    worked: >
      Flip a fair coin: heads (probability $1/2$) pays $3$ and ends the
      game; tails (probability $1/2$) costs $1$ and the coin is flipped
      again. With $V$ the value of the game,
      $V = \tfrac{1}{2}(3) + \tfrac{1}{2}(-1+V) = 1 + \tfrac{1}{2}V$, so
      $\tfrac{1}{2}V = 1$ and $V = 2$.
    interview: >
      Any "the game continues if..." setup should trigger naming the
      remaining game's value as an unknown before touching arithmetic.
      Interviewers listen for you to state out loud whether the
      continuation is the same game again (self-referential $V$) or a
      genuinely different sub-game (plain conditional average).
    pitfalls: >
      Forgetting to add back whatever was already collected on the
      continuing branch before folding in $V$ is an easy silent drop.
      Applying the self-referential trick to a game whose state actually
      changes after the first draw — cards removed without replacement,
      say — assumes a $V$ that isn't constant across branches and is wrong.
    recap: >
      Split on the first roll, write the not-yet-played remainder as an
      unknown, and solve one equation — self-referential when the game
      restarts identically, a weighted average otherwise.

  - node: quant-games.ev-games.option-value
    hook: >
      Every re-roll, every free look, and every financial option is the
      same underlying object, and the interview question is almost always
      "how much is that option actually worth," not just "is it worth
      something."
    explanation: >
      The inequality $\mathbb{E}[\max(X,Y)]\ge\max(\mathbb{E}[X],
      \mathbb{E}[Y])$ has a one-line pointwise proof, and that proof is the
      whole intuition. For every single outcome $\omega$, $\max(X,Y)(\omega)$
      is at least $X(\omega)$ and at least $Y(\omega)$ — the max can never
      be smaller than either input at any specific outcome. Averaging a
      quantity that is pointwise at least as large as $X$ everywhere gives
      an expectation at least as large as $\mathbb{E}[X]$, and the same
      argument against $Y$ gives $\mathbb{E}[\max(X,Y)]\ge\mathbb{E}[Y]$
      too — combine the two and the max of the two means is beaten.

      Equality is the special case where the max never actually strayed
      from one fixed alternative: one of $X,Y$ dominates the other with
      probability $1$, so choosing after seeing the outcome never actually
      changes what you'd have picked anyway.

      The size of the gap tracks spread, not level: widening $X$'s variance
      around the same mean pushes more mass strictly above the fixed
      alternative, and each such outcome contributes a strictly positive
      bonus a precommitted choice can't capture, while the low outcomes are
      floored at the alternative instead of dragging the average down.
    worked: >
      A fair $8$-sided die has mean $4.5$. Against a guaranteed $5$,
      $\mathbb{E}[\max(X,5)]$ replaces faces $1$–$4$ with $5$ and keeps
      faces $5$–$8$ as they are: $(5+5+5+5+5+6+7+8)/8 = 46/8 = 5.75$. The
      option to look and then choose is worth $5.75-4.5 = 1.25$.
    interview: >
      "Would you rather have the average payoff guaranteed, or see the
      outcome first and then decide" is the canonical framing, and the
      expected answer prices the gap as a difference of two expectations
      rather than asserting qualitatively that seeing first is "obviously
      better."
    pitfalls: >
      Estimating the option's value as the gap between the best possible
      outcome and the mean overstates it badly — you only benefit on the
      fraction of outcomes that actually clear the alternative. Assuming
      equality in the inequality without checking domination is a second
      common overreach; most instances are strict.
    recap: >
      Choosing after seeing the outcome prices as $\mathbb{E}[\max(X,Y)]$,
      never less than $\max(\mathbb{E}[X],\mathbb{E}[Y])$ by a pointwise
      argument, worth $1.25$ for a fair $8$-sided die against a guaranteed
      $5$.

  - node: quant-games.ev-games.dice-reroll
    hook: >
      A capped re-roll ladder and an uncapped pay-per-reroll game feel like
      different problems, but interviewers switch between the two framings
      specifically to see whether you notice they're the same machinery.
    explanation: >
      Read the ladder $V_1,V_2,V_3,V_4$ as a menu of fair prices, one per
      allowed number of rolls: an entry fee quoted below $V_k$ is a buy, one
      quoted above is a sell, whatever $k$ the interviewer names. The
      marginal values $V_2-V_1=0.75$, $V_3-V_2\approx0.42$,
      $V_4-V_3\approx0.28$ are literally the price of the "right to look"
      one more time, and they shrink because the earlier rolls have already
      claimed most of the room between the mean and the die's ceiling of
      $6$ — the sequence creeps toward $6$ but a finite number of rerolls
      can never fully close the gap, since some probability always remains
      of never rolling the top face.

      Swap the rule from "$k$ rerolls allowed" to "unlimited rerolls, a fee
      $f$ each time" and the horizon disappears, so there is nothing to
      induct backward from. The value instead solves a fixed-point
      equation: keep face $x$ if it beats the net continuation value
      $V-f$, so $V = \mathbb{E}[\max(X, V-f)]$ with $V$ on both sides —
      solved the same way the self-referential restart games are, by
      guessing a threshold and checking it reproduces itself.
    worked: >
      Fair die, unlimited rerolls, a fee of $1$ each time. Guessing the
      threshold "keep $3$ or better": $V = \tfrac{3+4+5+6}{6} +
      \tfrac{2}{6}(V-1) = 3 + \tfrac{1}{3}(V-1)$, which solves to $V=4$.
      Checking consistency, $V-1=3$ is exactly the boundary assumed, so
      the fixed point holds: reroll only on $1$ or $2$, and the game is
      worth $4$.
    interview: >
      "Would you pay $4.50$ for three rerolls" tests reading the ladder as
      a price list; a common follow-up switches to "what if you instead
      pay a dollar every time you reroll" to see whether you recognize the
      fixed-point structure instead of trying to induct over an infinite
      horizon.
    pitfalls: >
      Quoting $V_k$ for the wrong $k$ by miscounting whether the initial
      roll counts toward the cap is an easy off-by-one. In the fee-per-
      reroll variant, subtracting the fee once at the end instead of
      inside the recursive $V$ ignores that it's paid on every reroll.
    recap: >
      The ladder is a price list whose marginal option values shrink toward
      a ceiling of $6$; charging per reroll instead of capping the count
      swaps backward induction for a fixed-point equation, worth $4$ at a
      fee of $1$.

  - node: quant-games.ev-games.commit-versus-see
    hook: >
      "Would you rather commit as you go, or see everything first and then
      choose" is a direct test of whether you can name the exact inequality
      that separates the two numbers, not just that one feels bigger.
    explanation: >
      The offline "pay the best" game and the online re-roll game share the
      same $n$ draws, and the offline value always dominates: whatever face
      you finally accept under any online, irrevocable rule is one of the
      $n$ faces actually rolled, so it can never exceed the maximum of all
      of them on any single outcome. Averaging a quantity that is pointwise
      at most the maximum gives an expectation at most $\mathbb{E}[\max]$,
      the same pointwise argument that priced a single option, now applied
      across a whole sequence of decisions instead of one.

      The gap is the price of irrevocability specifically — not the dice,
      not the number of rolls, but the constraint that each accept-or-
      reject decision is made before the rest of the sequence is known. It
      also isn't a fixed constant: more rolls mean more chances to regret
      an early commitment, so the gap widens as $n$ grows, even though both
      games' individual values are increasing in $n$ too.
    worked: >
      Compare the two-roll versions. The re-roll value is $V_2=4.25$. The
      pay-the-best value is the classic expected max of two fair dice:
      $\Pr(M=k)=(2k-1)/36$, so $\mathbb{E}[M] =
      \tfrac{1(1)+2(3)+3(5)+4(7)+5(9)+6(11)}{36} = \tfrac{161}{36}
      \approx4.472$. The gap is $161/36-17/4 = 8/36 = 2/9\approx0.222$ —
      smaller than the three-roll gap of about $0.29$, since fewer rolls
      leave less room for regret.
    interview: >
      Interviewers deliberately alternate the two phrasings mid-question to
      see if you notice the switch. State plainly which game is being
      described before computing anything, and name the inequality
      direction — offline always weakly dominates online — as the reason
      the two numbers can never cross.
    pitfalls: >
      Treating the two games as "basically the same" because both involve
      $n$ dice and keeping the best is exactly the trap — the sequential,
      irrevocable constraint is the entire difference. Assuming the gap is
      a fixed amount rather than growing with $n$ misreads what's driving
      it.
    recap: >
      The offline best-of-$n$ value always weakly dominates any online
      accept-or-reroll rule, since the accepted face is always one of the
      $n$ rolled; two rolls give $161/36\approx4.472$ against $4.25$, a
      smaller gap than three rolls give.

  - node: quant-games.ev-games.next-card-red
    hook: >
      This is the canonical "can you beat a fair coin by waiting for
      information" question, and the honest answer — no, not by a cent —
      is what separates candidates who trust the arithmetic from those who
      trust a gambler's hunch.
    explanation: >
      The fraction of unseen cards that are red is fair not just on
      average from the start, but conditionally at every single reveal:
      whatever composition remains, the very next card is red with
      probability exactly (unseen reds)/(unseen total), the same formula
      whether it's the first card or the fortieth. Revealing a black card
      does swing that local fraction up in your favor, but it does so with
      correspondingly lower probability of having happened in the first
      place, and revealing a red card swings it down with correspondingly
      higher probability — the two effects are built to cancel exactly, on
      every single reveal, not just in the long run.

      This is why "wait for a black-heavy run before betting red" cannot
      manufacture an edge: the run you're waiting for is exactly as rare as
      it needs to be to keep the arithmetic fair, no matter how you define
      "black-heavy." No stopping rule, however clever, can make the card
      you eventually bet on redder than the $1/2$ you started with.
    worked: >
      Shrink to a $4$-card deck with $2$ red and $2$ black, and consider the
      rule "skip the first card, bet the second is red." If card $1$ is
      black (probability $1/2$), the remaining odds are $2$ red in $3$, so
      the payoff averages $2(2/3)-1=1/3$. If card $1$ is red (probability
      $1/2$), the remaining odds are $1$ red in $3$, so the payoff averages
      $2(1/3)-1=-1/3$. Overall,
      $\tfrac{1}{2}\left(\tfrac{1}{3}\right)+\tfrac{1}{2}\left(-\tfrac{1}{3}
      \right)=0$ — the two branches cancel exactly.
    interview: >
      "You can watch cards flip and bet whenever you like that the next one
      is red — what's this worth?" wants "$0$, because the red fraction is
      conditionally fair at every reveal" stated with the reasoning, not
      just intuition. A sharp follow-up changes the payoff to pay only on
      red and nothing on black, and the answer becomes $1/2$ for the same
      reason.
    pitfalls: >
      Believing a run of blacks makes the deck "due" for red confuses a
      real local shift in odds with an edge — that shift arrives with
      exactly the lower probability needed to offset it. Confusing this
      with the option-value intuition that "seeing more is worth more" is
      the other trap: here the payoff itself is symmetric, so looking
      longer buys nothing.
    recap: >
      The chance the next unseen card is red never drifts from where it
      started, conditionally or unconditionally, so no stopping rule turns
      free peeks at a shuffled deck into a positive-EV bet on red.

  - node: quant-games.ev-games.red-black-stopping
    hook: >
      The immediate follow-up to "why is betting on the next card worth
      $0$" is "then why is this nearly identical-looking game worth real
      money" — and the contrast is the entire point of pairing the two.
    explanation: >
      The difference is what the payoff is actually a bet on. Betting on
      the next single card is a bet on unrevealed information, and that bet
      is fair at every instant, as the previous game showed. Cashing out
      the running surplus of reds minus blacks is not a bet on anything
      unrevealed at all — it's harvesting a quantity that already-revealed
      cards have determined. You get to choose the moment, and the moment
      you choose can be a genuinely favorable one, because the surplus has
      wandered there through real, already-observed draws.

      Pricing it is backward induction on the state $(r,b)$ of reds and
      blacks left: at the boundary, $V(r,0)=r$ because nothing left can hurt
      you, so there's no reason to wait, and $V(0,b)=0$ because nothing left
      can help. In between, $V(r,b)$ is the larger of stopping now for
      $r-b$, or continuing, where the next card is red with probability
      $r/(r+b)$ and black with probability $b/(r+b)$, landing you in a
      smaller state either way.

      The martingale argument from the plain next-card game does not
      transfer here — it says something about the law of the next card,
      nothing about whether an already-accumulated surplus is worth
      cashing in.
    worked: >
      Build up from $V(1,1)=1/2$ and $V(2,2)=2/3$ toward $V(3,3)$. The
      needed asymmetric states along the way work out to $V(2,1)=1$,
      $V(1,2)=1/3$, $V(3,1)=2$, $V(1,3)=1/4$, $V(3,2)=6/5$, $V(2,3)=1/2$,
      each from the same recursion. Combining the last two,
      $V(3,3) = \max\left(0, \tfrac{1}{2}\left(\tfrac{1}{2}\right) +
      \tfrac{1}{2}\left(\tfrac{6}{5}\right)\right) = \max(0, 17/20) =
      0.85$ — a fourth data point climbing toward the full deck's $2.62$.
    interview: >
      The paired question "why does this one have value and the other
      doesn't" is asked precisely to see whether you can name that the
      payoff here is an already-determined running surplus, not a bet on
      an unseen card. State the boundary conditions $V(r,0)=r$,
      $V(0,b)=0$ before writing the recursion.
    pitfalls: >
      Applying the "can't beat $1/2$" martingale reasoning from the plain
      next-card game here is the single most common error — it answers a
      question about the law of the next card, not about whether a running
      surplus can be cashed in. Forgetting either boundary condition breaks
      the whole recursion.
    recap: >
      Cashing out the running red-minus-black surplus at the best moment is
      worth real money because it harvests already-revealed information,
      not a bet on the future — the recursion prices the full deck at
      about $2.62$, growing only like $\sqrt{n}$.

  - node: quant-games.ev-games.card-value-draw
    hook: >
      "Does dealing without replacement change the expected total of a
      hand?" is a one-word-answer trap — no — and the interviewer is really
      testing whether you can say why in one line.
    explanation: >
      Every position in a shuffled deck is marginally the same draw as the
      first card. Nothing about a uniform shuffle privileges position $3$
      over position $30$: relabeling the deck's positions doesn't change
      the shuffle's distribution, so the card sitting in any fixed position
      is equally likely to be any of the $52$ cards, exactly like the first
      card is. That gives every position the same mean value, $7$, even
      though the actual value drawn there is correlated with everything
      drawn before it.

      Summing several such positions to price a hand needs only linearity,
      which was never conditioned on independence in the first place — so
      a five-card hand prices at $5\times7=35$ whether the cards are dealt
      with or without replacement. What changes between the two dealing
      rules is the variance: without replacement, an extreme early draw
      removes an extreme card from what's left, so hands self-correct
      toward the mean and swing less than they would if draws were
      independent. The mean never sees any of that correction, because it
      never needed the draws to be independent to add correctly.

      A counting payoff prices the same way — a dollar for every card
      meeting some condition is just that condition's single-card
      probability, multiplied by however many cards are dealt.
    worked: >
      Deal a $3$-card hand from the same $A=1$ through $K=13$ deck. The
      total values at $3\times7=21$. A dollar for every ten-or-higher card
      ($10,J,Q,K$, $16$ of the $52$ cards) prices at
      $3\times(16/52) = 3\times(4/13) = 12/13\approx0.923$.
    interview: >
      "Does dependence from dealing without replacement change the fair
      price?" wants "no, only the variance" stated immediately, backed by
      the one-line reason — marginal uniformity plus linearity — rather
      than a hedge like "it should be close."
    pitfalls: >
      Assuming dependence between draws must show up somewhere in the mean,
      and trying to "correct" the naive sum-of-means answer, is the classic
      overreach — there's no correction, the naive sum is exact. Confusing
      "a dollar per ace" (an additive count) with "at least one ace" (a
      genuinely different quantity) is the other common slip.
    recap: >
      Every dealt position is marginally the same uniform draw as the
      first card, so a hand's total or any per-card counting payoff prices
      by plain multiplication, however strongly the draws are correlated
      with each other.

  - node: quant-games.ev-games.ace-positions
    hook: >
      Deck-position questions stop feeling hard the moment you stop
      tracking the aces and start tracking the gaps between them — the same
      exchangeability you already trust, aimed at a new object.
    explanation: >
      Picture the $48$ non-ace cards laid out and the $4$ aces dropped in
      as dividers, cutting the sequence into $5$ gaps. Nothing about a
      uniform shuffle privileges the gap before the first ace over the gap
      after the last one — reversing or relabeling the deck maps one valid
      gap configuration to another equally likely one — so the $5$ gap
      sizes are exchangeable, exactly the property that let a known total
      split evenly among exchangeable parts elsewhere. Their total is fixed
      at $48$, so each gap averages $48/5=9.6$.

      From there it's bookkeeping: "cards before the first ace" is exactly
      the first gap, $9.6$, while "position of the first ace" is one more
      than that, $10.6$, since the ace itself occupies the slot right after
      its gap. The last ace is priced by the mirror image of the same
      argument, landing at $53-10.6=42.4$.

      The pattern generalizes past aces: $k$ special cards cut the deck
      into $k+1$ exchangeable gaps of $(52-k)/(k+1)$ each, and the same
      $+1$ bookkeeping converts a gap size into a position.
    worked: >
      Price the two black aces specifically ($k=2$). The $50$ other cards
      split into $k+1=3$ exchangeable gaps, each averaging $50/3\approx
      16.67$. The first black ace sits at $50/3+1=53/3\approx17.67$ on
      average, and by the mirror argument the second sits at
      $53-53/3=106/3\approx35.33$.
    interview: >
      "What position do you expect the second heart to appear at" or any
      variant with a different special-card count tests whether you
      generalize past the ace-specific numbers to $k$ special cards and
      $k+1$ gaps, rather than trying to recall a memorized answer.
    pitfalls: >
      Using $k$ gaps instead of $k+1$ drops the gap after the last special
      card. Applying the $+1$ conversion between "cards before" and
      "position of" inconsistently between the first-occurrence and
      last-occurrence versions is the other reliable source of an
      off-by-one.
    recap: >
      $k$ special cards cut a shuffled deck into $k+1$ exchangeable gaps of
      $(52-k)/(k+1)$ each — the two black aces average $53/3\approx17.67$
      for the first and $106/3\approx35.33$ for the second.

  - node: quant-games.ev-games.risk-aversion
    hook: >
      "Here's a coin flip with clearly positive expected value — would you
      take it?" is a trap for anyone who answers with the EV alone; the
      interviewer wants to hear that a rational person can still say no.
    explanation: >
      Expected value treats every dollar the same regardless of how much
      wealth is already at stake, and that's precisely the assumption a
      concave utility $u$ gives up. A bettor with wealth $W$ maximizes
      $\mathbb{E}[u(W+X)]$, and because $u$ bends downward, a loss and an
      equally sized gain are not mirror images in utility terms — the loss
      costs more utility than the matching gain buys back. That asymmetry
      can flip the sign: a bet can have strictly positive
      $\mathbb{E}[X]$ and still strictly negative $\mathbb{E}[u(W+X)]-u(W)$,
      making decline the rational choice, not a failure of nerve.

      Two rules follow from taking this seriously rather than just
      asserting it. Refuse outright any bet carrying a real chance of ruin,
      however large the edge, because ruin is absorbing — there is no next
      game to average the loss against, so no finite edge compensates for
      an infinite downside in utility terms. Short of ruin, the right
      response to a positive-EV bet is not refusal but sizing: shrink the
      stake until concavity barely bites, a question about how much to bet
      rather than whether the edge is real, and one this unit sets aside
      for the log-wealth machinery of Kelly sizing.
    worked: >
      A log-utility investor with wealth $100$ is offered a fair coin flip:
      win $60$ or lose $40$. The outcomes are wealth $160$ or $60$, each
      with probability $0.5$, so $\mathbb{E}[\text{gain}] = 0.5(60)+0.5(-40)
      = 10$, clearly positive. But expected utility is
      $0.5\ln(160)+0.5\ln(60) \approx 0.5(5.075)+0.5(4.094) = 4.5848$,
      while not playing gives $\ln(100)\approx4.6052$ — since
      $4.5848 < 4.6052$, this log-utility investor rationally declines a
      $+10$-EV bet.
    interview: >
      The complete answer has two parts: confirm the EV is positive with
      the arithmetic, then explain why a rational agent can still decline
      by naming concavity and the stake's size relative to wealth — neither
      "just take it, it's positive EV" nor "no, too risky" alone answers
      what's being asked.
    pitfalls: >
      Treating "always take positive-EV bets" as a blanket rule ignores the
      stake-to-bankroll ratio entirely. Treating every refusal of a
      positive-EV bet as irrational makes the opposite mistake — expected
      utility, not expected value, is the actual objective once the stake
      is large.
    recap: >
      A positive-EV bet is one you can rationally refuse once the stake is
      large relative to bankroll, because a concave utility weighs the loss
      branch more heavily than the equal-sized gain branch — a fair
      $+60/-40$ flip on wealth $100$ has EV $+10$ yet lower expected
      log-utility than not playing.

  - node: quant-games.ev-games.certainty-equivalent
    hook: >
      "What's the most you'd pay to make this risk go away?" is asking for
      the certainty equivalent by name, and it's the number that turns
      risk aversion from a qualitative story into an actual price.
    explanation: >
      The certainty equivalent $c$ solves $u(W+c)=\mathbb{E}[u(W+X)]$: it's
      the sure amount that produces exactly the same utility as playing the
      game, so it's the largest price at which you'd still rather play than
      walk away with cash instead. Since $u$ is strictly increasing it's
      invertible, so $c$ is uniquely determined, and for concave $u$ the
      risk premium $\mathbb{E}[X]-c$ comes out nonnegative — a concave
      function's value at the average input is never below the average of
      its values, so accepting the average payoff for certain is always at
      least as good in utility terms as facing the gamble.

      The Arrow-Pratt approximation comes from Taylor-expanding $u$ around
      $W$: $u(W+X)\approx u(W)+u'(W)X+\tfrac{1}{2}u''(W)X^{2}$, so
      $\mathbb{E}[u(W+X)]\approx u(W)+u'(W)\mathbb{E}[X]+
      \tfrac{1}{2}u''(W)\operatorname{Var}(X)$ once you center at $c$'s own
      first-order expansion, $u(W+c)\approx u(W)+u'(W)c$. Matching the two
      and solving for $c$ leaves the premium at roughly
      $\tfrac{1}{2}A(W)\operatorname{Var}(X)$, where $A=-u''/u'$ — a purely
      local fact, accurate only while the bet stays small next to $W$.
    worked: >
      Log utility, $W=50$, a fair coin flip of $\pm20$ (wealth $70$ or
      $30$). Exact: $\ln(50+c)=0.5\ln(70)+0.5\ln(30)\approx3.8248$, so
      $50+c\approx e^{3.8248}\approx45.83$ and $c\approx-4.17$, a risk
      premium of about $4.17$. Arrow-Pratt: $A(50)=1/50$, so the premium
      approximates to $\tfrac{1}{2}(1/50)(20^{2})=4$ — close, but already
      about $4\%$ off at a stake this large relative to $W$.
    interview: >
      "What guaranteed amount would make you indifferent to this bet?" is
      answered by setting up $u(W+c)=\mathbb{E}[u(W+X)]$ immediately; under
      time pressure, naming the Arrow-Pratt shortcut
      $\tfrac{1}{2}A(W)\operatorname{Var}(X)$ as a fast estimate is the
      fluent move.
    pitfalls: >
      Confusing the certainty equivalent (a dollar amount) with expected
      utility itself (a utility-scale number that isn't directly
      comparable to dollars) skips the inversion step. Trusting the
      Arrow-Pratt approximation as exact for a bet that isn't actually
      small relative to wealth — as this worked example's $4\%$ gap
      shows — overstates its precision.
    recap: >
      The certainty equivalent solves $u(W+c)=\mathbb{E}[u(W+X)]$ for the
      sure amount you'd trade the bet for, and the resulting risk premium
      is approximated for small bets by $\tfrac{1}{2}A(W)\operatorname{Var}
      (X)$ — about $4.17$ against an approximation of $4$ for a $\pm20$
      flip on wealth $50$.

  - node: quant-games.ev-games.repeated-edge
    hook: >
      "You have a small edge — how many times do you need to trade it
      before you actually know it's real?" is asking you to compare two
      growth rates, and the answer — a square root, not linear — is why
      thin edges are businesses only at real scale.
    explanation: >
      Two forces move at different speeds as the number of bets $n$ grows.
      The signal — mean profit — accumulates linearly: $n$ bets each
      contributing the same per-bet edge sum to $n$ times that edge,
      regardless of any correlation between the bets, since expectation
      never needed independence to add. The noise — the standard deviation
      of profit — grows only like $\sqrt{n}$, because each bet's
      fluctuation around its own mean is roughly independent of the others,
      and independent fluctuations partly cancel rather than stacking
      directly.

      Dividing the two gives the signal-to-noise ratio: $(n\cdot
      \text{edge})/(\sigma\sqrt{n}) = (\text{edge}/\sigma)\sqrt{n}$, which
      itself grows only like $\sqrt{n}$. Quadrupling the number of bets
      only doubles your confidence that the edge is real; getting ten times
      as confident costs a hundred times the volume.

      This is the quantitative reason sizing, not the existence of the
      edge, is the binding constraint in practice — surviving the long,
      noisy stretch before the signal clears the noise is a drawdown
      question, which this unit hands off to Kelly sizing rather than
      answering here.
    worked: >
      A strategy earns an edge of $0.02$ per trade with a per-trade
      standard deviation of $5$. At $n=2500$ trades, mean profit is
      $2500(0.02)=50$ and the standard deviation is $5\sqrt{2500}=250$, a
      signal-to-noise ratio of just $0.2$ — statistically indistinguishable
      from noise. At $n=250{,}000$ trades, mean profit is $5000$ against a
      standard deviation of $5\sqrt{250{,}000}=2500$, a ratio of $2$: a
      hundredfold increase in volume bought only a tenfold rise in
      confidence.
    interview: >
      "You've got a $2$-cent edge with $5$ dollars of volatility per
      trade — how many trades before you trust it?" wants the
      $(\text{edge}/\sigma)\sqrt{n}$ scaling stated explicitly, ideally
      followed by solving for the $n$ a target confidence level actually
      requires.
    pitfalls: >
      Treating a positive mean profit after some stretch of trading as
      proof the edge is real ignores the ratio entirely — the worked
      example's $2500$-trade result is a real, positive number that is
      still only $0.2$ standard deviations from noise. Assuming volume and
      confidence scale together linearly is the error the whole $\sqrt{n}$
      law exists to correct.
    recap: >
      Mean profit accumulates $n$ times the per-bet edge while its standard
      deviation grows only $\sqrt{n}$ times the per-bet volatility, so
      confidence in an edge grows only like $\sqrt{n}$ — a hundredfold
      increase in trades bought only a tenfold rise in signal-to-noise in
      the worked example.
