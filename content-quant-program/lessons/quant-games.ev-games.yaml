unit: quant-games.ev-games
opening: >
  Every game in this unit reduces to one question — what is the expected
  payoff, and does that number tell the whole story? The first stretch is
  pure pricing: fair value as expectation, the symmetry moves that answer
  a question before you write a sum, and conditioning on the first roll or
  draw to collapse a multi-stage game into one equation. From there the
  unit turns to optionality — the right to look before you commit is worth
  money, re-roll ladders read as price lists, and stopping games show when
  waiting for information pays and when it provably cannot. It closes on
  the limit of expected value itself: risk aversion, the certainty
  equivalent that prices it, and why a small repeatable edge still needs
  enormous volume before it is more than noise.
lessons:
  - node: quant-games.ev-games.fair-value
    hook: >
      "What would you pay to play this?" is the single most common opening
      of a quant interview, and it is always asking for $\mathbb{E}[X]$ by
      another name — everything else in this unit is a shortcut for
      computing that number faster.
    explanation: >
      Fair value is risk-neutral by construction: it is the price at which
      neither buying nor selling the game has a expected profit, so a
      rational counterparty is indifferent to which side of the trade they
      take. Once you fix that price at $\mathbb{E}[X]$, your edge at any
      other quoted price $p$ is just $\mathbb{E}[X]-p$ — positive when you
      pay less than fair value, negative when you pay more, with the sign
      flipping the moment you switch from buyer to seller.

      Two structural facts fall out immediately and both get tested. First,
      the price depends only on the law of the payoff, never on the
      physical mechanism producing it — a game described as "roll a die"
      and one described as "draw a numbered ball from a bag of six" price
      identically the moment their payoff distributions match. Second,
      because expectation is linear, a payoff built from several pieces
      prices by adding each piece's own fair value, with no need to work
      out how the pieces interact.

      This number says nothing yet about whether you should actually play —
      it assumes you are risk-neutral and the stake is small next to your
      bankroll, a assumption this unit revisits once variance enters.
    worked: >
      A spinner pays $12$ with probability $0.2$, $4$ with probability
      $0.5$, and nothing otherwise, and separately every player collects a
      flat $1$ loyalty credit regardless of outcome. Fair value is
      $0.2(12)+0.5(4)+1 = 2.4+2+1 = 5.4$, the two components simply added.
      Quoted at $5$, buying nets an edge of $0.4$; quoted at $6$, selling
      instead nets an edge of $0.6$.
    interview: >
      Expect the phrase verbatim — "what would you pay to play this game" —
      and the interviewer is listening for the weighted sum set up on the
      spot, not a guess at a "typical" outcome. A common follow-up asks you
      to state your edge at a specific quoted price, testing whether you
      remember the sign depends on which side of the trade you're on.
    pitfalls: >
      Averaging the possible payoffs without weighting by their
      probabilities is the single most common error at this step. Treating
      a multi-part payoff as needing the parts' dependence worked out before
      pricing wastes time the additivity of expectation makes unnecessary.
    recap: >
      Fair value is $\mathbb{E}[X]$, your edge is that number minus what
      you pay, and both depend only on the payoff's law, never on the
      mechanism that generates it.
    dialogue:
      - part: A bag of chips and a price
        teach: >
          A bag holds ten chips: one marked $30$, three marked $5$, and six
          blank. You draw one, collect the number on it, and the chip goes
          back in the bag. A dealer will sell you a draw for $4$.
      - ask: >
          Before any arithmetic: what number should you hold the $4$ up
          against?
        choices:
          - text: >
              The most likely payoff, which is $0$.
            feedback: >
              Six draws in ten are blank, so $0$ is the typical draw. But the
              one chip marked $30$ pays for a lot of blanks; judging by the
              typical draw would have you refuse every lottery-shaped game,
              good or bad.
          - text: >
              The average of the three payoffs, $(30 + 5 + 0)/3 \approx 11.67$.
            feedback: >
              That treats $30$, $5$ and $0$ as equally likely, when a blank
              comes up six times as often as the $30$. Each payoff has to be
              weighted by how often it happens.
          - text: >
              What a draw pays on average over a long run of draws.
            correct: true
            feedback: >
              Right. If you would happily buy this draw a thousand times, the
              long-run average per draw is what the $4$ is buying.
          - text: >
              The largest payoff, $30$, since that is what you are playing
              for.
            feedback: >
              You are playing for $30$ one draw in ten. Pricing the best case
              is how lottery tickets get sold.
        feedback: >
          A single draw is noise; a price is something you pay again and
          again, so it is judged against the long-run average.
      - ask: >
          Imagine a thousand draws going exactly to the odds. How much do you
          collect per draw, on average?
        expects: "4.5"
        hint: >
          About how many of the thousand draws hit the $30$, and how many hit
          a $5$?
        feedback: >
          About $100$ draws pay $30$, for $3000$; about $300$ pay $5$, for
          $1500$; the $600$ blanks pay nothing. That is $4500/1000 = 4.5$, the
          same as $0.1(30) + 0.3(5) + 0.6(0)$.
      - ask: >
          Buying at $4$, what do you expect to make per draw?
        expects: "0.5"
        feedback: >
          You collect $4.5$ on average and pay $4$, so $4.5 - 4 = 0.5$ per
          draw.
      - ask: >
          The dealer turns it around: now *you* are the house, selling draws
          to the dealer at $4$. What do you expect to make per draw?
        expects: "-0.5"
        hint: >
          You receive the $4$, and you pay out whatever chip is drawn.
        feedback: >
          You take in $4$ and pay out $4.5$ on average: $4 - 4.5 = -0.5$. The
          same price is a gain to one side and exactly the same loss to the
          other.
      - reflect: >
          Some price makes the dealer equally content to be buyer or seller.
          Which price is it, and why is that the number you should say when
          asked what you would pay?
        answer: >
          $4.5$, the long-run average payoff. At that price neither side
          expects to make anything, so it favours nobody: below it the buyer
          gains, above it the seller does. That makes it the honest price of
          the draw itself, before anyone's taste for risk comes in, and every
          other price is that number plus or minus somebody's edge.

      - part: The name, and the sign of an edge
        teach: >
          That price is the fair value of the game: for a one-shot payoff $X$
          it is $\mathbb{E}[X]$. Your edge at a price $p$ is
          $\mathbb{E}[X] - p$ when you buy and $p - \mathbb{E}[X]$ when you
          sell. Fair value is risk-neutral: it ignores your bankroll and how
          much the spread of outcomes bothers you, both of which come later.
      - ask: >
          A second dealer will buy draws from you at $5.3$. What is your edge
          per draw as the seller?
        expects: "0.8"
        feedback: >
          Selling, you receive $5.3$ and pay out $4.5$ on average, so the edge
          is $5.3 - 4.5 = 0.8$. Quoted above fair value, sell; below it, buy.

      - part: Same law, different machine
        ask: >
          A ten-sided die pays $30$ on a $1$, pays $5$ on a $2$, $3$ or $4$,
          and pays nothing on $5$ through $10$. How does it price against the
          bag?
        choices:
          - text: >
              Differently: a die and a bag are different experiments, so each
              needs its own analysis.
            feedback: >
              The price only ever reads the payoff's distribution. Here both
              pay $30$ with probability $0.1$, $5$ with probability $0.3$ and
              $0$ with probability $0.6$, so the sums are identical term by
              term.
          - text: >
              The same, $4.5$: the payoffs have the same distribution.
            correct: true
            feedback: >
              Right. Fair value is a function of the law of the payoff, not of
              the story that produces it, which is why interviewers can
              disguise one game as another.
          - text: >
              Higher, because ten faces give more possible outcomes than three
              chip types.
            feedback: >
              Only the payoffs and their probabilities count. Ten faces
              collapsing to three payoff levels with the same probabilities is
              the same game.
        feedback: >
          Once you have the payoff's distribution, the mechanism has nothing
          left to say about the price.
      - ask: >
          Back to the bag. The dealer adds a sweetener: whenever you draw a
          blank, you get $1$ back. The refund depends entirely on which chip
          comes out. What is the draw worth now?
        expects: "5.1"
        hint: >
          Price the refund on its own, then add.
        feedback: >
          The refund pays $1$ with probability $0.6$, so it is worth $0.6$ on
          its own, and the whole draw is worth $4.5 + 0.6 = 5.1$. Expectation
          adds whether or not the pieces are related, so you never had to work
          out how the refund and the chip interact.
      - ask: >
          Now scale everything up by $10{,}000$: the chips are marked
          $300{,}000$, $50{,}000$ and blank, and a draw costs $40{,}000$.
          Which statement is right?
        choices:
          - text: >
              The fair value is still $\mathbb{E}[X] = 45{,}000$; whether you
              should buy depends on what a loss of $40{,}000$ does to you.
            correct: true
            feedback: >
              Right. The definition does not care about scale, but you might:
              six draws in ten lose the whole $40{,}000$, and fair value is the
              price for someone indifferent to that.
          - text: >
              The fair value drops below $45{,}000$, because big losses are
              worse.
            feedback: >
              That mixes two numbers. $\mathbb{E}[X]$ is $45{,}000$ by
              arithmetic; how much *you* would pay, given your bankroll, is a
              different number that sits beside it.
          - text: >
              Buying is always right: a $5{,}000$ edge is an edge at any size.
            feedback: >
              It is an edge, and it is still possible to be wiped out by the
              most likely outcome. Fair value says what the game is worth, not
              whether you can afford to play it once.
        feedback: >
          Quote $\mathbb{E}[X]$ when asked what a game is worth. In an
          interview, say the weighted sum aloud, then the edge at the quoted
          price with its sign, then, if the stake is large, that bankroll
          enters afterwards.

  - node: quant-games.ev-games.pay-per-pip
    hook: >
      Interviewers reuse the same die with a different payoff function
      specifically to see whether you push the function through the
      expectation sign or redo the weighted sum from scratch.
    explanation: >
      A payoff rule is a function applied to each outcome before you
      average, never applied to the mean afterward. Changing "pay the face"
      to "pay some function of the face" changes which value gets weighted
      by which probability, and there is no shortcut that reuses the plain
      mean — you rebuild the weighted sum with the new payoff plugged in at
      every outcome.

      This matters because the gap between $\mathbb{E}[g(X)]$ and
      $g(\mathbb{E}[X])$ can be large even for an innocuous-looking $g$. A
      convex payoff like a square or a cube systematically rewards the
      outcomes far from the mean more than it rewards the mean itself, so
      averaging the transformed values always comes out above transforming
      the average — the gap is the whole reason "square the payoff" is a
      favorite interview variant of any base game.

      A threshold payoff (pay only if some condition holds) is the other
      common variant, and it collapses to a single term: the payout times
      the probability the condition holds, nothing more.
    worked: >
      Roll one fair six-sided die and collect the cube of the face. The
      payoff is $X^{3}$ for $X$ uniform on $\{1,\dots,6\}$, so the fair
      value is $\mathbb{E}[X^{3}] = (1+8+27+64+125+216)/6 = 441/6 = 73.5$ —
      far above $3.5^{3} = 42.875$, the number you'd get by cubing the mean
      instead of averaging the cubes.
    interview: >
      "Same die, but you're paid the square (or cube) of the face" tests
      exactly this reflex — the expected response sets up
      $\sum_x g(x)p(x)$ immediately rather than computing $g(\mathbb{E}[X])$
      and calling it done.
    pitfalls: >
      Sliding a nonlinear $g$ through the expectation sign is the classic
      error this node exists to catch. For a threshold payoff, forgetting
      to multiply by the probability the condition actually holds — instead
      averaging only over the outcomes where it does — silently drops the
      other outcomes from the sum.
    recap: >
      A payoff function is applied outcome by outcome before averaging, so
      paying the cube of a fair die's face is worth $73.5$, nowhere near
      the cube of its mean.
    dialogue:
      - part: Top face times bottom face
        teach: >
          Opposite faces of a die always sum to $7$. A fair die is rolled and
          you are paid the top face times the bottom face: a $2$ on top, with
          $5$ underneath, pays $10$. The house sells a roll for $11$.
      - ask: >
          What is one roll worth?
        expects: "28/3"
        tolerance: 0.005
        hint: >
          Write down the payoff for each of the six top faces, then average.
        feedback: >
          Top faces $1$ to $6$ pay $1 \cdot 6, 2 \cdot 5, 3 \cdot 4, 4 \cdot 3,
          5 \cdot 2, 6 \cdot 1$, that is $6, 10, 12, 12, 10, 6$. They total
          $56$, so the roll is worth $56/6 = 28/3 \approx 9.33$, and at $11$
          it is a sell, not a buy.
      - ask: >
          A colleague priced it in one line, $3.5 \times 3.5 = 12.25$, and
          bought at $11$. Where does that go wrong?
        choices:
          - text: >
              The bottom face does not average $3.5$.
            feedback: >
              It does: each of $1$ to $6$ is underneath one roll in six. Both
              averages are right; what fails is combining them.
          - text: >
              It is fine; $9.33$ must contain an arithmetic slip.
            feedback: >
              No face pays more than $12$, so no average of the payoffs can be
              $12.25$. The list of six payoffs is the ground truth.
          - text: >
              It evaluates the payoff at the average face, $3.5(7 - 3.5)$,
              instead of averaging the payoff over the six faces.
            correct: true
            feedback: >
              Right. The payoff is $g(x) = x(7 - x)$, and $g(3.5) = 12.25$ is
              what a roll of $3.5$ would pay. No roll shows $3.5$.
        feedback: >
          The one-line answer computed $g(\mathbb{E}[X])$. The game pays
          $g(X)$, so what it is worth is the average of $g(X)$.
      - reflect: >
          No face pays more than $12$, yet the shortcut said $12.25$. What
          rule for pricing "you are paid $g$ of the face" can never make that
          mistake, and for which payoffs would the shortcut have been safe?
        hint: >
          Think of the payoffs as a column of six numbers.
        answer: >
          Apply the payoff to each outcome first, then weight by
          probability: the roll is worth $\sum_x g(x)\Pr(X = x)$. The shortcut
          of plugging in the mean face is safe exactly when $g$ is a straight
          line, $g(x) = a + bx$, because then averaging and applying $g$ can
          be done in either order. Any curve, up or down, breaks it.

      - part: When the shortcut is safe
        teach: >
          The rule is $\mathbb{E}[g(X)] = \sum_x g(x)\Pr(X = x)$, a weighted
          sum of the payoffs themselves. For a linear payoff,
          $\mathbb{E}[a + bX] = a + b\,\mathbb{E}[X]$, and the mean face does
          all the work. For a curved one it does not: a payoff that bends up,
          like the square, averages above $g(3.5)$, and one that bends down,
          like top times bottom, averages below it.
      - ask: >
          A roll pays $3$ dollars per pip, minus a flat $4$ dollar charge
          taken whatever the face. What is it worth?
        expects: "6.5"
        feedback: >
          The payoff $3x - 4$ is a straight line, so the shortcut is safe:
          $3(3.5) - 4 = 6.5$. Face by face it is
          $(-1 + 2 + 5 + 8 + 11 + 14)/6 = 39/6 = 6.5$, the same.
      - ask: >
          A roll pays the square of the distance between the face and $3$:
          a $5$ pays $4$, a $3$ pays nothing. What is it worth?
        expects: "19/6"
        tolerance: 0.005
        hint: >
          The shortcut would give $(3.5 - 3)^{2} = 0.25$. Do not trust it.
        feedback: >
          Faces $1$ to $6$ pay $4, 1, 0, 1, 4, 9$, totalling $19$, so the roll
          is worth $19/6 \approx 3.17$ — more than twelve times the shortcut's
          $0.25$. The square rewards the faces far from $3$, and the mean face
          sits close to $3$.

      - part: Paying only some of the time
        ask: >
          A roll pays $9$ if it shows $5$ or $6$, and nothing otherwise. What
          is it worth?
        expects: "3"
        hint: >
          Four of the six faces still count: they each pay $0$.
        feedback: >
          $9 \times 2/6 = 3$. Answering $9$ averages only over the faces that
          pay and silently drops the four that do not. A threshold payoff is
          always the prize times the probability of collecting it.

      - part: Two faces of one die
        ask: >
          Back to the opposite faces. Now you are paid the top face *plus*
          the bottom face. What is a roll worth?
        expects: "7"
        feedback: >
          It pays $7$ on every roll, so it is worth $7$, and adding the two
          averages gives $3.5 + 3.5 = 7$ as well — even though top and bottom
          are as dependent as two numbers can be.
      - ask: >
          Adding the two averages worked for top plus bottom, and multiplying
          them failed for top times bottom. Why the difference?
        choices:
          - text: >
              The sum only worked because it happens to be constant.
            feedback: >
              Try top plus twice the bottom: it pays $14 - x$ for top face $x$,
              worth $14 - 3.5 = 10.5$, and the averages give
              $3.5 + 2(3.5) = 10.5$ too. Nothing constant about it.
          - text: >
              Expectation adds for any pieces, related or not, but multiplies
              only for independent ones.
            correct: true
            feedback: >
              Right. Two independently rolled dice paying the product are
              worth $3.5 \times 3.5 = 12.25$ exactly; the top and bottom of
              one die are not independent, and the product drops to $28/3$.
          - text: >
              Multiplying averages fails for every pair of dice, independent
              or not.
            feedback: >
              For two independent dice $\mathbb{E}[XY] = \mathbb{E}[X]\,
              \mathbb{E}[Y] = 12.25$. Independence is exactly what the
              product needs, and opposite faces lack it.
        feedback: >
          Sums always split; products split under independence; any other
          curve has to be averaged outcome by outcome. In an interview,
          write the column of payoffs before you write a single mean.

  - node: quant-games.ev-games.symmetry-pricing
    hook: >
      Symmetry answers or checks a pricing question before you write a
      single term of the sum, and interviewers use it to see whether you
      reach for it by reflex or grind through the algebra anyway.
    explanation: >
      Reflection symmetry and exchangeable-total symmetry already price
      most static games outright. The move genuinely new to game pricing is
      a third one: a zero-sum contest whose rules treat the two sides
      identically is worth $0$ to each, however complicated the mechanism.
      The reasoning is a swap argument, not a computation — if relabeling
      the two players leaves the joint law of the outcome unchanged, then
      player $A$'s expected net payoff must equal player $B$'s, but in a
      zero-sum game $B$'s payoff is always $-1$ times $A$'s, forcing
      $\mathbb{E}[\text{net to }A] = -\mathbb{E}[\text{net to }A]$, which
      only $0$ satisfies.

      The payoff of this move is that it needs no knowledge of the actual
      process — a multi-round race, a repeated draw-off, an arbitrarily
      intricate tie-breaking rule all fall to the same one-line argument, as
      long as the rule genuinely doesn't distinguish the two seats.

      Treat symmetry as a discipline: check the invariance actually holds —
      unequal antes, a first-mover edge, or hidden information all break
      it — before invoking it, and use it afterward to sanity-check a
      direct computation that looks asymmetric when it shouldn't be.
    worked: >
      Two traders repeatedly flip a fair coin in a race to three heads;
      whoever gets there first collects a fixed $50$ from the other, with
      any tie-breaking handled by a rule that treats both players the same
      way. Whatever that rule's details, swapping which trader is "player
      $A$" leaves the whole setup unchanged, so
      $\mathbb{E}[\text{net to }A] = -\mathbb{E}[\text{net to }A] = 0$ — the
      race is fair with no entry fee, without ever analyzing the race
      itself.
    interview: >
      "Is this fair to both sides?" or "what's your edge as player $A$" is
      answered fastest by naming the swap invariance directly rather than
      computing a stopping-time distribution. It also doubles as a check —
      if your direct computation of a symmetric setup doesn't collapse to
      $0$ or $c/2$, you've made an arithmetic error.
    pitfalls: >
      Invoking symmetry when a real asymmetry is hiding in the setup —
      unequal stakes, an information edge, who moves first — produces a
      confidently wrong $0$. Using a valid zero-sum symmetry to answer a
      question about variance or the full distribution overreaches, since
      symmetry only pins down the mean.
    recap: >
      A zero-sum game whose rules don't distinguish the two seats is worth
      $0$ to each side by a pure swap argument, no matter how complicated
      the underlying process is.
    dialogue:
      - part: The middle of three dice
        teach: >
          Three fair dice are rolled and you are paid the middle face: a roll
          of $2, 6, 3$ pays $3$, and a roll of $5, 5, 1$ pays $5$. A colleague
          will sell you the game for $3.25$.
      - ask: >
          Start the direct way. Of the $216$ equally likely rolls, how many pay
          exactly $1$?
        expects: "16"
        hint: >
          The middle face is $1$ only when at least two of the dice show $1$.
        feedback: >
          Exactly two $1$s: pick the die that is not a $1$ ($3$ ways) and its
          face ($5$ ways), $15$ rolls. All three $1$s: one more. So $16$ rolls
          pay $1$, and the same count, $3 \times 5 + 1 = 16$, pays $6$.
      - ask: >
          A single die pays $1$ on $36$ rolls in $216$; the middle face pays
          $1$ on only $16$, and $6$ on only $16$. What does that tell you about
          its price against a single die's $3.5$?
        choices:
          - text: >
              It must be above $3.5$, since the low payoff has become rare.
            feedback: >
              The high payoff has become rare by exactly the same amount: $16$
              rolls each. Thinning both ends equally pushes the price neither
              way.
          - text: >
              It must differ from $3.5$, since the middle face is not uniform.
            feedback: >
              A different law can share a mean. The middle face piles up near
              $3$ and $4$ and thins at $1$ and $6$, and none of that moves the
              centre if it happens evenly on both sides.
          - text: >
              Nothing yet: the ends balance, and the price hinges on whether
              $2$ to $5$ balance the same way.
            correct: true
            feedback: >
              Right. The extremes cancel, and the counts for $2$ through $5$
              are the messy ones: a middle $3$ comes from $(3,3,x)$, from
              $(2,3,5)$, from $(1,3,6)$ and more.
        feedback: >
          Grinding out the four middle counts would finish the job. The
          matching $16$s suggest a reason that would make the grinding
          unnecessary.
      - reflect: >
          Turn every die upside down, so each face $x$ becomes $7 - x$. What
          happens to the payoff, and why does that settle the price without
          counting anything else?
        hint: >
          Flip the roll $2, 6, 3$ and read off the new middle face.
        answer: >
          Flipping sends $2, 6, 3$ to $5, 1, 4$, and the middle face $3$ to
          $4 = 7 - 3$: in general the middle face $M$ becomes $7 - M$. The flip
          pairs each of the $216$ equally likely rolls with exactly one other,
          so $M$ and $7 - M$ have the same law, hence the same mean:
          $\mathbb{E}[M] = 7 - \mathbb{E}[M]$, and $\mathbb{E}[M] = 3.5$. At
          $3.25$ the game is a buy with a $0.25$ edge.

      - part: Naming the move, then breaking it
        teach: >
          That is the first symmetry move. If $c - X$ has the same law as $X$,
          then $\mathbb{E}[X] = c - \mathbb{E}[X]$, so the game is worth $c/2$.
          The work is all in finding the map: a one-to-one pairing of equally
          likely outcomes that sends the payoff $X$ to $c - X$. For the middle
          die the map was the flip and $c = 7$.
      - ask: >
          Three tickets are drawn without replacement from a hat holding
          tickets $1$ through $20$, and you are paid the middle number of the
          three. What is the game worth?
        expects: "10.5"
        hint: >
          Relabel every ticket $n$ as $21 - n$. Is the hat still the same hat?
        feedback: >
          The relabelling $n \mapsto 21 - n$ maps the hat onto itself, so each
          set of three tickets is paired with an equally likely one whose
          middle number is $21$ minus the old one. Here $c = 21$, and the game
          is worth $21/2 = 10.5$. Quoting $21$ is the slip to avoid: $c$ is the
          sum of the paired payoffs, and the price is half of it.
      - ask: >
          Back to three dice, but now you are paid the *largest* face. Does
          the flip price this game at $3.5$ too?
        choices:
          - text: >
              Yes: the flip is still a pairing of equally likely rolls, so the
              same argument goes through.
            feedback: >
              The pairing is fine; the payoff is not. Flip $2, 6, 3$ to
              $5, 1, 4$: the largest face goes from $6$ to $5$, and $5$ is $7$
              minus the old *smallest* face, not the old largest.
          - text: >
              No: the flip sends the largest face to $7$ minus the smallest
              face, which is a different game.
            correct: true
            feedback: >
              Right. What the flip proves is
              $\mathbb{E}[\max] = 7 - \mathbb{E}[\min]$, a true link between two
              games, not a price for either. The largest of three dice is
              worth well above $3.5$.
          - text: >
              Yes, because the largest face, like any face, runs from $1$ to
              $6$.
            feedback: >
              The range is symmetric about $3.5$; the law is not. The largest
              face is $1$ on a single roll in $216$ and $6$ on $91$ of them,
              so its mean sits far above the middle of the range.
        feedback: >
          Symmetry is something you check, not something you assume: the map
          has to send this game's payoff to $c$ minus this same payoff.

      - part: A total fixed in advance
        ask: >
          Six players hold a round-robin: every pair plays once, a win scores
          $1$, and a draw scores $1/2$ to each side. However the games go, how
          many points are handed out in total?
        expects: "15"
        hint: >
          Count the games, then ask how much each game hands out.
        feedback: >
          There are $\binom{6}{2} = 15$ games and every game hands out exactly
          $1$ point, whether it is won or drawn. The total is $15$ whatever
          happens.
      - ask: >
          The six are equally matched and the schedule treats them alike. What
          is one named player's expected score?
        expects: "2.5"
        feedback: >
          No player is treated differently from any other, so the six scores
          are exchangeable and share the fixed $15$ evenly: $15/6 = 2.5$. That
          is the second symmetry move: a known total $T$ split among $k$
          exchangeable parts gives each part $T/k$. Game by game agrees: $5$
          games at $1/2$ apiece.
      - ask: >
          Change the field: one player is a grandmaster who wins every game she
          plays, and the other five are equally matched among themselves. What
          is one named other player's expected score?
        expects: "2"
        hint: >
          The six are no longer exchangeable. Which group still is, and what
          total does it share?
        feedback: >
          The grandmaster takes all $5$ of her games, so $15 - 5 = 10$ points
          are left, all from the $\binom{5}{2} = 10$ games among the other
          five. Those five are exchangeable, so each expects $10/5 = 2$.
          Dividing $15$ by $6$ would have priced a symmetry that is no longer
          there.

      - part: Two seats, one pot
        reflect: >
          Ana and Ben each roll a die at the same moment, round after round.
          The first to roll a $6$ alone collects $10$ from the other; a round
          in which both roll $6$ is void. Without working out how long this
          lasts, argue that Ana's seat is worth exactly $0$.
        hint: >
          What changes if Ana and Ben swap seats?
        answer: >
          Nothing in the rules tells Ana's seat from Ben's, so swapping the
          names leaves the whole game, and the law of what each side nets,
          unchanged: Ana's expected net equals Ben's. But every dollar Ana
          wins Ben loses, so Ben's net is minus Ana's. A number equal to its
          own negative is $0$. That is the third move: a zero-sum game
          invariant under swapping the players is worth $0$ to each seat.
      - ask: >
          Change one rule: they now roll in turn, Ana first, one die each, and
          the first $6$ collects $10$. What is Ana's seat worth now?
        expects: "10/11"
        tolerance: 0.005
        hint: >
          With $p$ the chance Ana wins, condition on the first two rolls: Ana
          hits, or both miss and the game starts over.
        feedback: >
          $p = 1/6 + (5/6)(5/6)p$, so $p(11/36) = 1/6$ and $p = 6/11$. Her seat
          is worth $10(6/11) - 10(5/11) = 10/11 \approx 0.91$. Moving first is
          exactly the asymmetry the swap argument cannot survive.
      - ask: >
          Back to simultaneous rolls, but now Ana stakes $10$ and Ben stakes
          $12$: the winner collects the loser's stake. What is Ana's seat
          worth?
        expects: "1"
        hint: >
          The rolling is still symmetric, so who wins is still a fair coin.
          Only the amounts are not.
        feedback: >
          The swap still shows Ana wins with probability $1/2$, but swapping
          the seats now changes the stakes, so the game is no longer invariant
          and its value is no longer forced to $0$:
          $\tfrac{1}{2}(12) - \tfrac{1}{2}(10) = 1$. In an interview, say which
          swap leaves the game unchanged before you say $0$, and name the
          first-move edge or the unequal stake when it does not.

  - node: quant-games.ev-games.condition-first-draw
    hook: >
      Once a game restarts, shrinks, or changes state after the first roll,
      naming the value of "everything from here on" as an unknown and
      writing one equation for it turns an unbounded process into
      arithmetic.
    explanation: >
      Two distinct shapes show up under "condition on the first roll." In
      the first, the game genuinely restarts in an identical state after a
      failed first attempt — the same die, the same rules, nothing lost
      except whatever was already collected. Calling the game's value $V$
      and writing one equation that puts $V$ on both sides is exactly the
      right move here, because the continuation truly is a fresh copy of
      the whole game.

      In the second shape, the first outcome sets a parameter for a
      different, smaller sub-game rather than restarting the same one — a
      first roll of $N$ that determines how many dice you then roll and
      sum. There, conditioning gives a genuine weighted average across
      branches that differ structurally from each other and from the
      original game, and the average often collapses fast when the inner
      quantity is itself a plain expectation.

      Either way the discipline is the same: split on the first outcome,
      write down what happens on each branch including anything already
      collected, and solve — self-referentially when the branches loop
      back to $V$, by direct averaging when they don't.
    worked: >
      Flip a fair coin: heads (probability $1/2$) pays $3$ and ends the
      game; tails (probability $1/2$) costs $1$ and the coin is flipped
      again. With $V$ the value of the game,
      $V = \tfrac{1}{2}(3) + \tfrac{1}{2}(-1+V) = 1 + \tfrac{1}{2}V$, so
      $\tfrac{1}{2}V = 1$ and $V = 2$.
    interview: >
      Any "the game continues if..." setup should trigger naming the
      remaining game's value as an unknown before touching arithmetic.
      Interviewers listen for you to state out loud whether the
      continuation is the same game again (self-referential $V$) or a
      genuinely different sub-game (plain conditional average).
    pitfalls: >
      Forgetting to add back whatever was already collected on the
      continuing branch before folding in $V$ is an easy silent drop.
      Applying the self-referential trick to a game whose state actually
      changes after the first draw — cards removed without replacement,
      say — assumes a $V$ that isn't constant across branches and is wrong.
    recap: >
      Split on the first roll, write the not-yet-played remainder as an
      unknown, and solve one equation — self-referential when the game
      restarts identically, a weighted average otherwise.
    dialogue:
      - part: A bag you could draw from forever
        teach: >
          A bag holds three red marbles and one green. You draw a marble, look
          at it and put it back. A red pays $2$ and you draw again; the green
          ends the game and pays nothing more. You keep everything you have
          banked.
      - ask: >
          What is the chance the game pays exactly $4$?
        expects: "9/64"
        tolerance: 0.001
        hint: >
          Paying exactly $4$ means a particular sequence of colours.
        feedback: >
          Red, red, then green: $(3/4)(3/4)(1/4) = 9/64 \approx 0.14$. In
          general the game pays $2k$ with probability $(3/4)^{k}(1/4)$, for
          every $k = 0, 1, 2, \dots$
      - reflect: >
          Pricing it that way means summing $2k(3/4)^{k}(1/4)$ over every $k$
          — an infinite series. Look instead at the moment just after a first
          red: you hold $2$. What is the rest of the game, and how could that
          price the whole thing without the series?
        hint: >
          Compare the bag and the rules after a red with the bag and the rules
          at the start.
        answer: >
          The rest of the game is an exact copy of the whole game: same bag,
          same rules, nothing used up. So if the game is worth $V$, a first red
          leaves you worth $2 + V$ and a first green leaves you worth $0$.
          Weighting the two branches by their chances gives one equation with
          $V$ on both sides, and solving it replaces the whole series.

      - part: One equation for the whole game
        teach: >
          This is pricing by conditioning on the first draw:
          $\mathbb{E}[X] = \sum_i \Pr(\text{first draw is } i)\,
          \mathbb{E}[X \mid \text{first draw is } i]$. The move that makes it
          work is naming the value of the not-yet-played remainder as an
          unknown. When the remainder is the game itself, the unknown appears
          on both sides.
      - ask: >
          Which equation prices the marble game?
        choices:
          - text: >
              $V = \tfrac{3}{4}V$
            feedback: >
              This drops the $2$ banked on the red branch, and its only
              solution is $V = 0$ — a game that pays $2$ three times in four
              is not worth nothing.
          - text: >
              $V = 2 + \tfrac{3}{4}V$
            feedback: >
              This pays the $2$ on every first draw, green included. The green
              branch pays $0$, so the $2$ belongs inside the red branch only.
          - text: >
              $V = \tfrac{3}{4}(2 + V) + \tfrac{1}{4}(0)$
            correct: true
            feedback: >
              Right: each branch carries what was collected on the way plus
              what the remaining game is worth from there.
          - text: >
              $V = \tfrac{3}{4}(2) + \tfrac{1}{4}(0)$
            feedback: >
              That prices one draw and stops. After a red the game goes on, and
              the continuation is worth another $V$.
        feedback: >
          On each branch write what you collected, then what the game is worth
          from where you stand.
      - ask: >
          Solve it. What is the marble game worth?
        expects: "6"
        feedback: >
          $V = 1.5 + \tfrac{3}{4}V$, so $\tfrac{1}{4}V = 1.5$ and $V = 6$. The
          series agrees: you expect $3$ reds before the green, at $2$ each.

      - part: When the first draw picks a different game
        ask: >
          A coin is flipped. Heads, you roll a four-sided die; tails, a
          twelve-sided die. You are paid the face. What is the game worth?
        expects: "4.5"
        feedback: >
          $\tfrac{1}{2}(2.5) + \tfrac{1}{2}(6.5) = 4.5$. Neither branch is a
          copy of the game, so no unknown appears on both sides: conditioning
          is a plain weighted average of two different sub-games.
      - ask: >
          Roll a four-sided die to get $N$, then play $N$ independent rounds of
          the marble game, keeping everything. What is the whole thing worth?
        expects: "15"
        hint: >
          Given $N = n$, what are $n$ rounds worth?
        feedback: >
          Given $N = n$ the rounds are worth $6n$, so the game is worth
          $\mathbb{E}[6N] = 6 \times 2.5 = 15$. The first roll set a parameter;
          the sub-game it chose was priced by the earlier equation.

      - part: When the bag does not refill
        ask: >
          Same bag, three red and one green, but now a drawn marble stays out.
          A red pays $2$ and you draw again; the green ends the game. What is
          the game worth?
        expects: "3"
        hint: >
          The four marbles come out in a random order. Where does the green
          sit?
        feedback: >
          The green is equally likely to be first, second, third or fourth, so
          $0, 1, 2$ or $3$ reds come out before it, $1.5$ on average, paying
          $2 \times 1.5 = 3$. The equation $V = \tfrac{3}{4}(2 + V)$ would
          still say $6$.
      - ask: >
          Why does the copy equation give $6$ when the game is worth $3$?
        choices:
          - text: >
              Conditioning on the first draw only works when draws are
              replaced.
            feedback: >
              Conditioning works on any staged game. What fails is the claim
              about what the branch is worth, not the split itself.
          - text: >
              After a red, two reds and the green remain, so the rest is a
              smaller game, not a copy of the whole.
            correct: true
            feedback: >
              Right. The remainder is a different game with its own value, and
              writing the same $V$ for it assumes a restart that never
              happens.
          - text: >
              The game can no longer last forever, so there is no unknown to
              solve for.
            feedback: >
              A bounded game still has an unknown remainder; it is just a
              different unknown at each stage, which you name and work down.
        feedback: >
          The unknown has to be the value of the game in the state you are
          actually in.
      - ask: >
          Condition on the first draw anyway, naming $W(r)$ for the game with
          $r$ reds and the green in the bag. $W(0) = 0$, and
          $W(1) = \tfrac{1}{2}(2 + W(0)) = 1$. What is $W(2)$?
        expects: "2"
        hint: >
          A red leaves the bag with one red fewer.
        feedback: >
          $W(2) = \tfrac{2}{3}(2 + W(1)) + \tfrac{1}{3}(0) = \tfrac{2}{3}(3) =
          2$, and then $W(3) = \tfrac{3}{4}(2 + 2) = 3$, matching the order
          argument. In an interview, say which shape you are in before you
          write an equation: a true restart earns one $V$ on both sides, a
          changing state earns a $V$ for each state.

  - node: quant-games.ev-games.option-value
    hook: >
      Every re-roll, every free look, and every financial option is the
      same underlying object, and the interview question is almost always
      "how much is that option actually worth," not just "is it worth
      something."
    explanation: >
      The inequality $\mathbb{E}[\max(X,Y)]\ge\max(\mathbb{E}[X],
      \mathbb{E}[Y])$ has a one-line pointwise proof, and that proof is the
      whole intuition. For every single outcome $\omega$, $\max(X,Y)(\omega)$
      is at least $X(\omega)$ and at least $Y(\omega)$ — the max can never
      be smaller than either input at any specific outcome. Averaging a
      quantity that is pointwise at least as large as $X$ everywhere gives
      an expectation at least as large as $\mathbb{E}[X]$, and the same
      argument against $Y$ gives $\mathbb{E}[\max(X,Y)]\ge\mathbb{E}[Y]$
      too — combine the two and the max of the two means is beaten.

      Equality is the special case where the max never actually strayed
      from one fixed alternative: one of $X,Y$ dominates the other with
      probability $1$, so choosing after seeing the outcome never actually
      changes what you'd have picked anyway.

      The size of the gap tracks spread, not level: widening $X$'s variance
      around the same mean pushes more mass strictly above the fixed
      alternative, and each such outcome contributes a strictly positive
      bonus a precommitted choice can't capture, while the low outcomes are
      floored at the alternative instead of dragging the average down.
    worked: >
      A fair $8$-sided die has mean $4.5$. Against a guaranteed $5$,
      $\mathbb{E}[\max(X,5)]$ replaces faces $1$–$4$ with $5$ and keeps
      faces $5$–$8$ as they are: $(5+5+5+5+5+6+7+8)/8 = 46/8 = 5.75$.
      Committing in advance you would take the guaranteed $5$ over the
      die's $4.5$, so the option to look and then choose is worth
      $5.75-5 = 0.75$.
    interview: >
      "Would you rather have the average payoff guaranteed, or see the
      outcome first and then decide" is the canonical framing, and the
      expected answer prices the gap as a difference of two expectations
      rather than asserting qualitatively that seeing first is "obviously
      better."
    pitfalls: >
      Estimating the option's value as the gap between the best possible
      outcome and the mean overstates it badly — you only benefit on the
      fraction of outcomes that actually clear the alternative. Assuming
      equality in the inequality without checking domination is a second
      common overreach; most instances are strict.
    recap: >
      Choosing after seeing the outcome prices as $\mathbb{E}[\max(X,Y)]$,
      never less than $\max(\mathbb{E}[X],\mathbb{E}[Y])$ by a pointwise
      argument, worth $0.75$ for a fair $8$-sided die against a guaranteed
      $5$.
    dialogue:
      - part: A sealed box and a sure thing
        teach: >
          A sealed box holds either $0$ or $20$, with equal chances. A host
          offers you a choice: walk away with a sure $12$, or take the box.
      - ask: >
          You must choose without opening the box. Choosing as well as you
          can, what do you collect on average?
        expects: "12"
        feedback: >
          The box is worth $\tfrac{1}{2}(0) + \tfrac{1}{2}(20) = 10$ and the
          sure thing $12$, so you take the $12$. Blind, the deal is worth
          $\max(10, 12) = 12$.
      - ask: >
          Now the host lets you open the box first, and then choose. What is
          the deal worth?
        expects: "16"
        hint: >
          Decide what you would do if the box shows $20$, and what if it shows
          $0$.
        feedback: >
          A $20$ you keep; a $0$ you swap for the $12$. That is
          $\tfrac{1}{2}(20) + \tfrac{1}{2}(12) = 16$.
      - ask: >
          What is the right to look worth — the most you would pay the host
          for it?
        expects: "4"
        hint: >
          Compare with what you would have collected without it.
        feedback: >
          $16 - 12 = 4$. Not $16 - 10 = 6$: without the look you would never
          have held the box, you would have held the $12$. The look is worth
          what it adds to your best blind choice.
      - reflect: >
          Why can the look never leave you worse off than choosing blind, and
          in what situation would it be worth exactly nothing?
        hint: >
          Compare what you collect with and without the look on each possible
          content of the box separately.
        answer: >
          On every outcome, choosing after looking collects the larger of the
          two payoffs, which is at least the box and at least the $12$.
          Averaging something that is at least $X$ everywhere gives at least
          $\mathbb{E}[X]$, and likewise for the $12$, so the look beats both
          blind choices. It is worth nothing exactly when one choice is at
          least as good on every outcome, so the look never changes your pick.

      - part: What the look is worth, and why
        teach: >
          In symbols, choosing after seeing is worth $\mathbb{E}[\max(X, Y)]$,
          choosing before is worth $\max(\mathbb{E}[X], \mathbb{E}[Y])$, and
          $\mathbb{E}[\max(X,Y)] \ge \max(\mathbb{E}[X], \mathbb{E}[Y])$, with
          equality only when one alternative dominates with probability $1$.
          The difference is the option value, and the question is always how
          big it is.
      - ask: >
          A second box holds $5$ or $15$ with equal chances: the same mean,
          $10$, but less spread. Against the same sure $12$, how does the look
          compare with the first box's $4$?
        choices:
          - text: >
              The same, since both boxes are worth $10$.
            feedback: >
              The means match, but the look does not care about the mean. It
              pays only on outcomes above the $12$, and how far above is set
              by the spread.
          - text: >
              Smaller, since the good outcome now clears $12$ by only $3$.
            correct: true
            feedback: >
              Right. The look turns a $5$ into a $12$, but you would have taken
              the $12$ anyway; its only gain is the $3$ by which a $15$ beats
              the sure thing.
          - text: >
              Larger, since the worst case has improved from $0$ to $5$.
            feedback: >
              The worst case never mattered: a bad box is swapped for the $12$
              either way. Raising the floor of something you discard buys
              nothing.
        feedback: >
          Optionality is paid for by spread: the low outcomes are floored at
          the alternative, so only the height of the high ones counts.
      - ask: >
          What is the look worth on the second box?
        expects: "1.5"
        feedback: >
          $\mathbb{E}[\max(X, 12)] = \tfrac{1}{2}(15) + \tfrac{1}{2}(12) =
          13.5$, and blind you get $12$, so the look is worth $1.5$ against
          the first box's $4$.
      - ask: >
          A third box holds $13$ or $15$ with equal chances. Against the sure
          $12$, what is the look worth?
        expects: "0"
        feedback: >
          The box beats $12$ on every outcome, so blind you take the box for
          $14$, and looking still leaves you with the box: $14 - 14 = 0$. One
          alternative dominates, and the inequality becomes an equality.

      - part: Where the hunch goes wrong
        ask: >
          Back to the first box, $0$ or $20$ against a sure $12$. A colleague
          prices the look at $20 - 12 = 8$, the best case minus the sure
          thing. What is wrong?
        choices:
          - text: >
              Nothing: $8$ is what the look gains you when it matters.
            feedback: >
              It matters half the time. On the other half you swap a $0$ for
              the $12$ you would have taken anyway, and the look gains you
              nothing there.
          - text: >
              The look is worthless, because the box averages less than $12$.
            feedback: >
              The average is the blind comparison, and it is exactly what the
              look lets you escape: you collect the box only on the outcomes
              where it beats $12$.
          - text: >
              The $8$ arrives only with probability $1/2$, so the look is worth
              $4$.
            correct: true
            feedback: >
              Right. The best-case gap overstates the option by counting the
              good outcome as certain; the honest price is the average gain
              over every outcome.
        feedback: >
          Price an option as a difference of two expectations, never as a gap
          between one extreme outcome and the alternative.
      - ask: >
          A stock will trade at $80$ or $120$ tomorrow, with equal chances. A
          contract lets you buy one share tomorrow at $100$, if you want to.
          What is the contract worth?
        expects: "10"
        hint: >
          Tomorrow you look at the price and then decide whether to buy.
        feedback: >
          At $120$ you buy and gain $20$; at $80$ you walk away with $0$. That
          is $\tfrac{1}{2}(20) = 10$. The contract is $\max(S, 100) - 100$:
          the same look against a sure $100$, which is why a re-roll, a free
          peek and a call option are one object.

  - node: quant-games.ev-games.dice-reroll
    hook: >
      A capped re-roll ladder and an uncapped pay-per-reroll game feel like
      different problems, but interviewers switch between the two framings
      specifically to see whether you notice they're the same machinery.
    explanation: >
      Read the ladder $V_1,V_2,V_3,V_4$ as a menu of fair prices, one per
      allowed number of rolls: an entry fee quoted below $V_k$ is a buy, one
      quoted above is a sell, whatever $k$ the interviewer names. The
      marginal values $V_2-V_1=0.75$, $V_3-V_2\approx0.42$,
      $V_4-V_3\approx0.28$ are literally the price of the "right to look"
      one more time, and they shrink because the earlier rolls have already
      claimed most of the room between the mean and the die's ceiling of
      $6$ — the sequence creeps toward $6$ but a finite number of rerolls
      can never fully close the gap, since some probability always remains
      of never rolling the top face.

      Swap the rule from "$k$ rerolls allowed" to "unlimited rerolls, a fee
      $f$ each time" and the horizon disappears, so there is nothing to
      induct backward from. The value instead solves a fixed-point
      equation: keep face $x$ if it beats the net continuation value
      $V-f$, so $V = \mathbb{E}[\max(X, V-f)]$ with $V$ on both sides —
      solved the same way the self-referential restart games are, by
      guessing a threshold and checking it reproduces itself.
    worked: >
      Fair die, unlimited rerolls, a fee of $1$ each time. Guessing the
      threshold "keep $3$ or better": $V = \tfrac{3+4+5+6}{6} +
      \tfrac{2}{6}(V-1) = 3 + \tfrac{1}{3}(V-1)$, which solves to $V=4$.
      Checking consistency, $V-1=3$ is exactly the boundary assumed, so
      the fixed point holds: reroll only on $1$ or $2$, and the game is
      worth $4$.
    interview: >
      "Would you pay $4.50$ for three rerolls" tests reading the ladder as
      a price list; a common follow-up switches to "what if you instead
      pay a dollar every time you reroll" to see whether you recognize the
      fixed-point structure instead of trying to induct over an infinite
      horizon.
    pitfalls: >
      Quoting $V_k$ for the wrong $k$ by miscounting whether the initial
      roll counts toward the cap is an easy off-by-one. In the fee-per-
      reroll variant, subtracting the fee once at the end instead of
      inside the recursive $V$ ignores that it's paid on every reroll.
    recap: >
      The ladder is a price list whose marginal option values shrink toward
      a ceiling of $6$; charging per reroll instead of capping the count
      swaps backward induction for a fixed-point equation, worth $4$ at a
      fee of $1$.
    dialogue:
      - part: A ten-sided die, rung by rung
        teach: >
          A fair ten-sided die shows $1$ through $10$ and pays its face. You
          may roll up to three times; after each roll you keep the face or roll
          again, and you are paid the face you keep. A booth sells the game for
          $7$.
      - ask: >
          Start with only two rolls allowed. What is the lowest first roll you
          should keep?
        expects: "6"
        hint: >
          What is the second roll worth if you take it?
        feedback: >
          The second roll is a plain roll, worth $5.5$. Keep any first face
          above $5.5$, so $6$ and up, and roll again on $1$ through $5$.
      - ask: >
          What is the two-roll game worth?
        expects: "6.75"
        feedback: >
          Half the time you keep a face from $6$ to $10$, which contributes
          $(6+7+8+9+10)/10 = 4$; the other half you roll again for $5.5$, which
          contributes $\tfrac{1}{2}(5.5) = 2.75$. Total $6.75$.
      - ask: >
          Now three rolls. What is the game worth?
        expects: "7.45"
        hint: >
          After a first roll you discard, you are playing the two-roll game.
        feedback: >
          Continuing is now worth $6.75$, so the first roll keeps only $7$ and
          up: $(7+8+9+10)/10 + \tfrac{6}{10}(6.75) = 3.4 + 4.05 = 7.45$. The
          threshold falls back to $6$ on the second roll.

      - part: Reading the ladder as prices
        ask: >
          The booth's sign reads "two re-rolls, $7$". What should you do?
        choices:
          - text: >
              Sell: two rolls are worth $6.75$, below the $7$.
            feedback: >
              Two re-rolls follow a first roll, so the sign sells three rolls
              in all. $6.75$ is the rung for one re-roll, and quoting it is the
              off-by-one this ladder invites.
          - text: >
              Buy: the sign sells three rolls, worth $7.45$, so the edge is
              $0.45$.
            correct: true
            feedback: >
              Right. A first roll plus two re-rolls is the three-roll rung, and
              $7.45 - 7 = 0.45$ in your favour.
          - text: >
              Neither: $7$ sits between two rungs, so it is fair.
            feedback: >
              Only one rung is being sold, and it is either above or below the
              price. Between two rungs means a buy of one game and a sell of
              the other.
        feedback: >
          Each rung is a fair price for its own number of rolls: below it buy,
          above it sell. Count the first roll before you read the rung.
      - reflect: >
          The ladder rose from $5.5$ to $6.75$ to $7.45$, by $1.25$ and then by
          $0.70$. Before computing the next rung, why must each extra roll add
          less than the last, and what number can the ladder never reach?
        hint: >
          An extra roll is the right to look at a fresh face against what you
          already have. What happens to that right as what you have improves?
        answer: >
          Each extra roll is an option: you look at a fresh face and keep it
          only if it beats the value of continuing. As the ladder climbs, the
          bar a fresh face has to clear rises, so fewer faces clear it and they
          clear it by less, and the option is worth less each time. The ladder
          creeps toward $10$ but never reaches it, since with finitely many
          rolls there is always some chance of never seeing a $10$.
      - ask: >
          What does a fourth roll add to the three-roll game?
        expects: "0.465"
        hint: >
          With continuation worth $7.45$, which first faces do you keep?
        feedback: >
          Keep $8$ and up: $V_{4} = (8+9+10)/10 + \tfrac{7}{10}(7.45) = 2.7 +
          5.215 = 7.915$, so the fourth roll adds $7.915 - 7.45 = 0.465$. The
          increments run $1.25$, $0.70$, $0.465$: each extra look is cheaper
          than the last.

      - part: Paying per roll instead of counting rolls
        ask: >
          New rules: no cap on rolls, but every re-roll costs $2$. There is no
          last roll to work backward from. If the game is worth $V$, what is a
          re-roll worth at the moment you decide?
        choices:
          - text: >
              $V$, since a re-roll puts you back at the start.
            feedback: >
              It puts you back at the start after you pay $2$. Leaving the fee
              out values every re-roll as free, and free re-rolls would let you
              wait for a $10$.
          - text: >
              $V - 2$: the same game again, less the fee.
            correct: true
            feedback: >
              Right. The game after a re-roll is a copy of the game, so the
              fee-per-roll version is one equation,
              $V = \mathbb{E}[\max(X, V - 2)]$, with $V$ on both sides.
          - text: >
              $5.5 - 2 = 3.5$, one fresh roll less the fee.
            feedback: >
              After that fresh roll you may re-roll again, so a re-roll is
              worth more than one plain roll. The continuation carries all the
              future choices, which is what $V$ stands for.
        feedback: >
          No horizon, so no backward induction: the value solves a fixed point.
          Guess a keeping threshold, solve, and check the guess.
      - ask: >
          Guess that you keep $6$ or better. Solve
          $V = (6+7+8+9+10)/10 + \tfrac{5}{10}(V - 2)$.
        expects: "6"
        feedback: >
          $V = 4 + \tfrac{1}{2}V - 1$, so $\tfrac{1}{2}V = 3$ and $V = 6$. Now
          check: a re-roll is worth $V - 2 = 4$, so a $5$ beats it, yet the
          guess threw the $5$ away. The guess contradicts itself.
      - ask: >
          Guess instead that you keep $5$ or better. What is $V$?
        expects: "37/6"
        tolerance: 0.005
        feedback: >
          $V = (5+6+7+8+9+10)/10 + \tfrac{4}{10}(V - 2) = 4.5 + 0.4V - 0.8$,
          so $0.6V = 3.7$ and $V = 37/6 \approx 6.17$. Check: $V - 2 \approx
          4.17$, so keep $5$ and up and re-roll $1$ through $4$ — exactly the
          guess. The fixed point holds.
      - ask: >
          A colleague prices the fee game at $8$: "unlimited rolls reach a
          $10$ eventually, then subtract the $2$ fee." Where does that go
          wrong?
        choices:
          - text: >
              The fee is paid on every re-roll, so it belongs inside the
              equation, and the value is $37/6$.
            correct: true
            feedback: >
              Right. Waiting for a $10$ takes $9$ re-rolls on average, $18$ in
              fees; the threshold rule stops long before that because each
              re-roll costs $2$.
          - text: >
              Nothing; $37/6$ came from a guess, and $8$ is exact.
            feedback: >
              The guess was checked: with $V = 37/6$ the rule it implies is
              the rule assumed. Waiting for a $10$ costs $18$ in expected fees
              to collect $10$.
          - text: >
              The fee should be charged ten times, the expected number of rolls
              to see a $10$: $10 - 20 = -10$.
            feedback: >
              Nobody has to wait for a $10$. Charging every roll of a bad rule
              prices that rule, not the best one, which keeps a $5$ and stops.
        feedback: >
          A capped ladder is solved backward from the last roll; a fee per
          roll is solved as a fixed point with the fee inside $V$. In an
          interview, say which rule you were given before you reach for
          either.

  - node: quant-games.ev-games.commit-versus-see
    hook: >
      "Would you rather commit as you go, or see everything first and then
      choose" is a direct test of whether you can name the exact inequality
      that separates the two numbers, not just that one feels bigger.
    explanation: >
      The offline "pay the best" game and the online re-roll game share the
      same $n$ draws, and the offline value always dominates: whatever face
      you finally accept under any online, irrevocable rule is one of the
      $n$ faces actually rolled, so it can never exceed the maximum of all
      of them on any single outcome. Averaging a quantity that is pointwise
      at most the maximum gives an expectation at most $\mathbb{E}[\max]$,
      the same pointwise argument that priced a single option, now applied
      across a whole sequence of decisions instead of one.

      The gap is the price of irrevocability specifically — not the dice,
      not the number of rolls, but the constraint that each accept-or-
      reject decision is made before the rest of the sequence is known. It
      also isn't a fixed constant: for a six-sided die it opens from $0$ at
      one roll to about $0.22$, $0.29$ and $0.30$ at two, three and four
      rolls, peaks just above $0.30$ at five, and then shrinks, because with
      many rolls both games all but guarantee a $6$ and are squeezed
      together against that ceiling.
    worked: >
      Compare the two-roll versions. The re-roll value is $V_2=4.25$. The
      pay-the-best value is the classic expected max of two fair dice:
      $\Pr(M=k)=(2k-1)/36$, so $\mathbb{E}[M] =
      \tfrac{1(1)+2(3)+3(5)+4(7)+5(9)+6(11)}{36} = \tfrac{161}{36}
      \approx4.472$. The gap is $161/36-17/4 = 8/36 = 2/9\approx0.222$ —
      smaller than the three-roll gap of about $0.29$, since fewer rolls
      leave less room for regret.
    interview: >
      Interviewers deliberately alternate the two phrasings mid-question to
      see if you notice the switch. State plainly which game is being
      described before computing anything, and name the inequality
      direction — offline always weakly dominates online — as the reason
      the two numbers can never cross.
    pitfalls: >
      Treating the two games as "basically the same" because both involve
      $n$ dice and keeping the best is exactly the trap — the sequential,
      irrevocable constraint is the entire difference. Assuming the gap is
      a fixed amount, or that it keeps growing with $n$, misreads what
      drives it: it opens over the first few rolls and closes again as both
      values approach the ceiling.
    recap: >
      The offline best-of-$n$ value always weakly dominates any online
      accept-or-reroll rule, since the accepted face is always one of the
      $n$ rolled; two rolls give $161/36\approx4.472$ against $4.25$, a
      smaller gap than three rolls give.
    dialogue:
      - part: Two ways to play the same two rolls
        teach: >
          A fair ten-sided die shows $1$ through $10$. In game A you roll it
          twice and are paid the larger face. In game B you roll, then either
          keep the face or roll once more and take the second face; played
          well, keeping $6$ or better, the re-roll ladder prices it at $6.75$.
      - ask: >
          In game A, what is the chance the larger face is at most $7$?
        expects: "0.49"
        hint: >
          The larger face is at most $7$ exactly when both faces are.
        feedback: >
          Both faces at most $7$: $(7/10)^{2} = 0.49$. In general
          $\Pr(M \le k) = (k/10)^{2}$, so
          $\Pr(M = k) = (k^{2} - (k-1)^{2})/100 = (2k - 1)/100$.
      - ask: >
          What is game A worth?
        expects: "7.15"
        hint: >
          Weight each face $k$ by $(2k - 1)/100$.
        feedback: >
          $\sum_{k=1}^{10} k(2k - 1)/100 = (2 \cdot 385 - 55)/100 = 715/100 =
          7.15$, using $\sum k^{2} = 385$ and $\sum k = 55$. Game A beats game
          B's $6.75$ by $0.40$.
      - reflect: >
          Same die, same two rolls. Why can no keep-or-roll rule for game B,
          however clever, ever be worth more than game A?
        hint: >
          Compare what the two games pay on one fixed pair of rolls.
        answer: >
          Whatever game B ends up holding is one of the two faces rolled, so on
          every pair of rolls it pays at most the larger face, which is what
          game A pays. A payoff that is at most game A's on every outcome
          averages to at most game A's value. The only thing game B lacks is
          the second face at the moment it decides about the first.

      - part: The price of deciding first
        teach: >
          Game A sees everything and then chooses; game B must judge each face
          before the next arrives, and a discarded face is gone. The first is
          worth $\mathbb{E}[\max]$, the second the backward-induction ladder,
          and the gap between them is the price of irrevocability: same rolls,
          less information at each decision.
      - ask: >
          Playing game B with the rule "keep $6$ or better", on what fraction
          of pairs of rolls does game B end up with a smaller face than game
          A?
        expects: "0.2"
        hint: >
          B falls short when it keeps a first face and the second is higher, or
          throws away a first face and the second is lower.
        feedback: >
          Keeping a first face $a \ge 6$, B falls short when the second beats
          it: $(4 + 3 + 2 + 1 + 0)/100$. Throwing away $a \le 5$, B falls short
          when the second is lower: $(0 + 1 + 2 + 3 + 4)/100$. Total
          $20/100 = 0.2$. One pair in five, and the shortfall then averages $2$,
          which is the $0.40$ gap.
      - ask: >
          Now three rolls. Game A pays the largest of three faces. What is it
          worth?
        expects: "7.975"
        hint: >
          $\Pr(M \ge k) = 1 - ((k-1)/10)^{3}$, and $\mathbb{E}[M]$ is the sum of
          these over $k = 1, \dots, 10$.
        feedback: >
          $\sum_{k=1}^{10} \left(1 - ((k-1)/10)^{3}\right) = 10 - (0^{3} + 1^{3}
          + \dots + 9^{3})/1000 = 10 - 2025/1000 = 7.975$.
      - ask: >
          Game B with three rolls is worth $7.45$, the next rung of the ladder.
          What is the gap now?
        expects: "0.525"
        feedback: >
          $7.975 - 7.45 = 0.525$, up from $0.40$ with two rolls: one more face
          to commit to before the rest arrive, one more chance to regret it.
      - ask: >
          The gap grew from $0$ with one roll to $0.40$ and then $0.525$. What
          happens to it with thirty rolls?
        choices:
          - text: >
              It keeps growing: every extra roll is another decision to regret.
            feedback: >
              More decisions, but each is made in a game already close to its
              ceiling. With thirty rolls game A is worth about $9.96$ and game
              B about $9.89$; there is no room left for a big gap.
          - text: >
              It shrinks toward $0$: both games all but guarantee a $10$.
            correct: true
            feedback: >
              Right. The gap peaks near $0.55$ at four or five rolls, then both
              values crowd against the ceiling of $10$, and at thirty rolls it
              is about $0.07$.
          - text: >
              It settles at a fixed amount, since irrevocability always costs
              the same.
            feedback: >
              The cost depends on how much a late face could still improve on
              an early one, and that room disappears as both games approach
              $10$.
        feedback: >
          Game A always weakly beats game B, by a margin that opens over the
          first few rolls and then closes.

      - part: Hearing which game you were asked
        ask: >
          An interviewer says: "Roll a ten-sided die three times, and then take
          whichever of the three faces you like." What is that game worth?
        choices:
          - text: >
              $7.45$
            feedback: >
              That is the game where each face is judged before the next. Here
              all three faces are on the table before you choose, so you take
              the largest.
          - text: >
              $7.975$
            correct: true
            feedback: >
              Right. "Then take whichever you like" means after all three
              rolls: the largest of three.
          - text: >
              $5.5$, since you end up with just one face.
            feedback: >
              You end up with one face, but you choose it after seeing all
              three, so it is the best of them, not a typical one.
        feedback: >
          The words that decide it are when you must choose.
      - ask: >
          And: "Roll up to three times; you may stop after any roll and take
          that face." What is that game worth?
        expects: "7.45"
        feedback: >
          Stopping on a face means committing before the next roll, so this is
          the three-rung ladder, $7.45$. In an interview, repeat the rules
          back — see all then choose, or decide as you go — before you name a
          number.

  - node: quant-games.ev-games.next-card-red
    hook: >
      This is the canonical "can you beat a fair coin by waiting for
      information" question, and the honest answer — no, not by a cent —
      is what separates candidates who trust the arithmetic from those who
      trust a gambler's hunch.
    explanation: >
      The fraction of unseen cards that are red is fair not just on
      average from the start, but conditionally at every single reveal:
      whatever composition remains, the very next card is red with
      probability exactly (unseen reds)/(unseen total), the same formula
      whether it's the first card or the fortieth. Revealing a black card
      does swing that local fraction up in your favor, but it does so with
      correspondingly lower probability of having happened in the first
      place, and revealing a red card swings it down with correspondingly
      higher probability — the two effects are built to cancel exactly, on
      every single reveal, not just in the long run.

      This is why "wait for a black-heavy run before betting red" cannot
      manufacture an edge: the run you're waiting for is exactly as rare as
      it needs to be to keep the arithmetic fair, no matter how you define
      "black-heavy." No stopping rule, however clever, can make the card
      you eventually bet on redder than the $1/2$ you started with.
    worked: >
      Shrink to a $4$-card deck with $2$ red and $2$ black, and consider the
      rule "skip the first card, bet the second is red." If card $1$ is
      black (probability $1/2$), the remaining odds are $2$ red in $3$, so
      the payoff averages $2(2/3)-1=1/3$. If card $1$ is red (probability
      $1/2$), the remaining odds are $1$ red in $3$, so the payoff averages
      $2(1/3)-1=-1/3$. Overall,
      $\tfrac{1}{2}\left(\tfrac{1}{3}\right)+\tfrac{1}{2}\left(-\tfrac{1}{3}
      \right)=0$ — the two branches cancel exactly.
    interview: >
      "You can watch cards flip and bet whenever you like that the next one
      is red — what's this worth?" wants "$0$, because the red fraction is
      conditionally fair at every reveal" stated with the reasoning, not
      just intuition. A sharp follow-up changes the payoff to pay only on
      red and nothing on black, and the answer becomes $1/2$ for the same
      reason.
    pitfalls: >
      Believing a run of blacks makes the deck "due" for red confuses a
      real local shift in odds with an edge — that shift arrives with
      exactly the lower probability needed to offset it. Confusing this
      with the option-value intuition that "seeing more is worth more" is
      the other trap: here the payoff itself is symmetric, so looking
      longer buys nothing.
    recap: >
      The chance the next unseen card is red never drifts from where it
      started, conditionally or unconditionally, so no stopping rule turns
      free peeks at a shuffled deck into a positive-EV bet on red.
    dialogue:
      - part: A rule that waits for black
        teach: >
          Six cards, three red and three black, are shuffled and turned face up
          one at a time. Before any card is turned you may call "red": if the
          card about to be turned is red you win $1$, if black you lose $1$.
          Never call, and you are betting on the last card. Your rule: turn one card; if it is
          black, call on the next; if it is red, wait for the last card.
      - ask: >
          The first card is black and you call. What is the chance the card you
          called on is red?
        expects: "3/5"
        tolerance: 0.0005
        feedback: >
          Three reds and two blacks are left, so the next card is red with
          probability $3/5$ — better than the $1/2$ you started with.
      - ask: >
          What do you expect to win on that branch?
        expects: "0.2"
        feedback: >
          $(3/5)(1) + (2/5)(-1) = 1/5 = 0.2$. Every win-or-lose-a-dollar bet on
          a card that is red with probability $q$ is worth $2q - 1$.
      - ask: >
          The first card is red instead, so you wait for the last card. What do
          you expect to win on that branch?
        expects: "-0.2"
        hint: >
          Five cards are unseen, two of them red. Which of the five is the last
          one is a matter of the shuffle.
        feedback: >
          Each of the five unseen cards is equally likely to be the last, and
          two are red, so the last card is red with probability $2/5$: worth
          $2(2/5) - 1 = -0.2$. Waiting did not rescue the bad branch.
      - ask: >
          What is the rule worth?
        expects: "0"
        feedback: >
          $\tfrac{1}{2}(0.2) + \tfrac{1}{2}(-0.2) = 0$. The black first card
          that made the next card redder happened only half the time, and the
          red first card that made things worse happened the other half.
      - reflect: >
          Before the first card, the next card is red with probability $1/2$.
          After it, that chance is $3/5$ or $2/5$, each with probability $1/2$.
          What does that say about any rule you could invent, not just this
          one?
        hint: >
          Average the chance of red over what the first card might be.
        answer: >
          Averaged over the reveal, the chance of red is still
          $\tfrac{1}{2}(3/5) + \tfrac{1}{2}(2/5) = 1/2$. Revealing a card moves
          the red fraction up or down, but never moves its expected value, and
          that holds at every card. A rule only chooses when to stop watching,
          and stopping a quantity whose expectation never drifts cannot make it
          drift, so the card you call on is red with probability $1/2$ under
          every rule, and the bet is worth $0$.

      - part: Why no rule can work
        teach: >
          With $R$ reds and $B$ blacks unseen, the next card is red with
          probability $R/(R+B)$, and that fraction is a martingale: one more
          reveal leaves its conditional expectation unchanged. Your call is a
          stopping time, bounded by the size of the deck, so optional stopping
          applies: the red fraction at the moment you call averages the
          starting $1/2$, and the bet averages $2(1/2) - 1 = 0$.
      - ask: >
          A sharper rule for the same six cards: call as soon as the blacks
          turned outnumber the reds by two, and otherwise ride the last card.
          What is it worth?
        choices:
          - text: >
              Positive, because when it calls, the deck really is red-rich.
            feedback: >
              When it calls the deck is red-rich: after two straight blacks,
              three reds face one black. But it fires on only $6$ of the $20$ colour
              orders, and on the other $14$ you bet the last card, which leans
              black. Those cancel the good ones exactly.
          - text: >
              $0$: the red fraction at the call still averages $1/2$.
            correct: true
            feedback: >
              Right. Counting the $20$ colour orders: the $6$ that fire net
              $+4$, and the $14$ that ride to the end net $-4$.
          - text: >
              Negative, because most of the time it never fires.
            feedback: >
              Most runs never fire and do lose on balance, but the runs that do
              fire win by exactly as much. The total is $0$, as it is for every
              rule.
        feedback: >
          A clever rule changes which runs you bet on, never the average red
          fraction you bet into.

      - part: Other payoffs, same deck
        ask: >
          Same six cards, but now a call pays $1$ if the card is red and
          nothing if it is black. What is the game worth under the best rule?
        expects: "0.5"
        feedback: >
          The payoff is $1$ times the event "the called card is red", worth the
          chance of that event, which is $1/2$ under every rule. No rule beats
          $0.5$ and none falls short of it.
      - ask: >
          The right to look is worth money: seeing an outcome before choosing
          beat choosing blind. Why is watching the cards worth nothing here?
        choices:
          - text: >
              The deck is too small; on a full deck watching would pay.
            feedback: >
              The argument never used the size of the deck. On fifty-two cards
              the red fraction is just as much a martingale, and the game is
              still worth $0$.
          - text: >
              You can never decline the bet, only time it, and the red fraction
              is fair at every moment.
            correct: true
            feedback: >
              Right. The look paid because a bad outcome could be swapped for a
              sure alternative. Here there is no alternative: you must bet on
              some card, and every moment offers the same average odds.
          - text: >
              Watching does help, but the forced bet on the last card takes the
              gain away again.
            feedback: >
              The forced last card is part of it, but the sharper fact is that
              even a rule that always calls early earns $0$: the call is made
              into odds that average $1/2$ at every moment.
        feedback: >
          In an interview: "$0$ — the red fraction is a martingale and the call
          is a bounded stopping time, so the card you bet on is red with
          probability $1/2$ whatever your rule."

  - node: quant-games.ev-games.red-black-stopping
    hook: >
      The immediate follow-up to "why is betting on the next card worth
      $0$" is "then why is this nearly identical-looking game worth real
      money" — and the contrast is the entire point of pairing the two.
    explanation: >
      The difference is what the payoff is actually a bet on. Betting on
      the next single card is a bet on unrevealed information, and that bet
      is fair at every instant, as the previous game showed. Cashing out
      the running surplus of reds minus blacks is not a bet on anything
      unrevealed at all — it's harvesting a quantity that already-revealed
      cards have determined. You get to choose the moment, and the moment
      you choose can be a genuinely favorable one, because the surplus has
      wandered there through real, already-observed draws.

      Pricing it is backward induction on the state $(r,b)$ of reds and
      blacks left: at the boundary, $V(r,0)=r$ because nothing left can hurt
      you, so there's no reason to wait, and $V(0,b)=0$ because nothing left
      can help. In between, $V(r,b)$ is the larger of stopping now for
      $r-b$, or continuing, where the next card is red with probability
      $r/(r+b)$ and black with probability $b/(r+b)$, landing you in a
      smaller state either way.

      The martingale argument from the plain next-card game does not
      transfer here — it says something about the law of the next card,
      nothing about whether an already-accumulated surplus is worth
      cashing in.
    worked: >
      Build up from $V(1,1)=1/2$ and $V(2,2)=2/3$ toward $V(3,3)$. The
      needed asymmetric states along the way work out to $V(2,1)=1$,
      $V(1,2)=1/3$, $V(3,1)=2$, $V(1,3)=1/4$, $V(3,2)=6/5$, $V(2,3)=1/2$,
      each from the same recursion. Combining the last two,
      $V(3,3) = \max\left(0, \tfrac{1}{2}\left(\tfrac{1}{2}\right) +
      \tfrac{1}{2}\left(\tfrac{6}{5}\right)\right) = \max(0, 17/20) =
      0.85$ — a fourth data point climbing toward the full deck's $2.62$.
    interview: >
      The paired question "why does this one have value and the other
      doesn't" is asked precisely to see whether you can name that the
      payoff here is an already-determined running surplus, not a bet on
      an unseen card. State the boundary conditions $V(r,0)=r$,
      $V(0,b)=0$ before writing the recursion.
    pitfalls: >
      Applying the "can't beat $1/2$" martingale reasoning from the plain
      next-card game here is the single most common error — it answers a
      question about the law of the next card, not about whether a running
      surplus can be cashed in. Forgetting either boundary condition breaks
      the whole recursion.
    recap: >
      Cashing out the running red-minus-black surplus at the best moment is
      worth real money because it harvests already-revealed information,
      not a bet on the future — the recursion prices the full deck at
      about $2.62$, growing only like $\sqrt{n}$.
    dialogue:
      - part: Five cards and a floor
        teach: >
          Five cards lie face down: one red, four black. You may stop now or
          after any card is turned, collecting $1$ for every red still face
          down and paying $1$ for every black still face down. Turn them all
          and you collect $0$. Stopping right now would cost you $3$.
      - ask: >
          What is the game worth?
        expects: "0.2"
        hint: >
          You can always turn every card and walk away with $0$. When would
          stopping ever pay you something positive?
        feedback: >
          Stopping pays more than $0$ only when the red is the single card
          left, and then you collect $1$. That happens exactly when the red is
          last, with probability $1/5$; otherwise you turn everything for
          $0$. The game is worth $0.2$, though stopping at the start was worth
          $-3$.
      - ask: >
          Track the surplus, reds minus blacks still face down: it is $-3$ now.
          After one card is turned, what is its expected value?
        expects: "-2.4"
        hint: >
          The card turned is red with probability $1/5$.
        feedback: >
          A red leaves $0 - 4 = -4$ (probability $1/5$); a black leaves
          $1 - 3 = -2$ (probability $4/5$). That averages
          $-0.8 - 1.6 = -2.4$, up from $-3$. The surplus drifts toward $0$.
      - ask: >
          In the game of betting that the next card is red, the red fraction
          never drifted, and no rule beat its starting value. Why does that
          argument not hold this game to its starting $-3$?
        choices:
          - text: >
              It does; the $0.2$ must count something twice.
            feedback: >
              The $0.2$ is a plain count: you collect $1$ exactly when the red
              comes last. A game whose worst case is $0$ cannot be worth $-3$.
          - text: >
              The martingale there was the red *fraction*; this payoff is the
              surplus, which drifts toward $0$, and running out pays $0$.
            correct: true
            feedback: >
              Right. The surplus is expected to shrink by a factor
              $1 - 1/n$ per card, with $n$ cards left, so a negative surplus
              tends to improve and a positive one to erode. A rule that waits
              while behind and quits while ahead can exploit that.
          - text: >
              Optional stopping fails because the deck is too short.
            feedback: >
              The stopping time is bounded by the five cards, which is exactly
              the case optional stopping covers. The theorem is fine; it is
              about a martingale, and the surplus is not one.
        feedback: >
          Same deck, different payoff. Before reusing a martingale argument,
          check that the payoff you are stopping is the martingale.
      - reflect: >
          At every moment you face one decision: take the current surplus, or
          turn one more card. How could you work out the value of turning one
          more card, and where would that calculation have to start?
        hint: >
          After one card you are in a smaller position of the same game.
        answer: >
          Turning a card lands you, with known chances, in one of two smaller
          positions: one red fewer or one black fewer. If you already know what
          those positions are worth, turning is worth their weighted average,
          and the position is worth the larger of that and the surplus in hand.
          So start from positions where nothing is left to decide — no blacks
          left, take every red; no reds left, run out for $0$ — and work back
          up.

      - part: Stop now or turn one more
        teach: >
          With $r$ reds and $b$ blacks face down, $V(r,b) = \max\left(r - b,\;
          \frac{r}{r+b}V(r-1,b) + \frac{b}{r+b}V(r,b-1)\right)$, with
          $V(r,0) = r$ and $V(0,b) = 0$. This is backward induction on the
          state $(r, b)$, and the opening game was $V(1,4) = 1/5$.
      - ask: >
          Two reds and one black are face down. What is $V(2,1)$? You may use
          $V(1,1) = 1/2$.
        expects: "1"
        feedback: >
          Stopping banks $2 - 1 = 1$. Turning gives
          $\tfrac{2}{3}V(1,1) + \tfrac{1}{3}V(2,0) = \tfrac{2}{3}(\tfrac{1}{2})
          + \tfrac{1}{3}(2) = 1$. A tie: $V(2,1) = 1$, and stopping is as good
          as going on.
      - ask: >
          Four reds and one black. Given $V(3,1) = 2$, what is $V(4,1)$?
        expects: "3"
        feedback: >
          Turning gives $\tfrac{4}{5}(2) + \tfrac{1}{5}V(4,0) =
          \tfrac{4}{5}(2) + \tfrac{1}{5}(4) = 2.4$, below the $3$ you bank by
          stopping. $V(4,1) = 3$: stop, before the surplus erodes.
      - ask: >
          Three reds and two blacks: stopping banks $1$. Given $V(2,2) = 2/3$
          and $V(3,1) = 2$, what should you do?
        choices:
          - text: >
              Stop: you are ahead, and a positive surplus tends to erode.
            feedback: >
              It tends to erode on average, but turning also keeps the option
              to stop later at a better moment. Turning is worth
              $\tfrac{3}{5}(\tfrac{2}{3}) + \tfrac{2}{5}(2) = 0.4 + 0.8 = 1.2$,
              more than the $1$ in hand.
          - text: >
              Turn: continuing is worth $6/5$, more than the $1$ in hand.
            correct: true
            feedback: >
              Right. $\tfrac{3}{5}(\tfrac{2}{3}) + \tfrac{2}{5}(2) = 6/5$. A
              black next lifts the surplus to $2$, which you then bank; a red
              costs less than that gains.
          - text: >
              Either: turning averages exactly the $1$ in hand.
            feedback: >
              That would be the surplus's own drift, $1 \times (1 - 1/5) = 0.8$,
              not the value of turning. Turning keeps every later choice open,
              and with them it is worth $1.2$.
        feedback: >
          Being ahead is not a reason to stop. Compare the surplus with the
          continuation value, and the recursion tells you which is larger.

      - part: How big it gets
        ask: >
          The recursion gives $V(5,5) \approx 1.12$ and, for a full deck,
          $V(26,26) \approx 2.62$. Roughly what is the game worth on four
          decks shuffled together, $208$ cards?
        choices:
          - text: >
              About $5.2$: twice the one-deck value, since the value grows
              like the square root of the deck.
            correct: true
            feedback: >
              Right. Four decks hold $104$ cards of each colour, four times
              $26$, and $\sqrt{4} = 2$ doubles the value: the recursion gives about
              $5.29$. The edge comes from the swings in the surplus, which grow
              like $\sqrt{n}$.
          - text: >
              About $10.5$: four times the cards of each colour, four times
              the value.
            feedback: >
              The value is not a per-card edge. It comes from how far the
              surplus wanders before you quit, and that grows like $\sqrt{n}$:
              the recursion gives about $5.29$.
          - text: >
              About $2.62$: a balanced deck is a balanced deck.
            feedback: >
              A longer deck gives the surplus longer to wander and larger peaks
              to quit on. The recursion gives about $5.29$.
          - text: >
              $0$: the red fraction is a martingale on any deck.
            feedback: >
              That settles the bet on the next card, not this one. Here the
              payoff is the surplus, and the recursion gives about $5.29$.
        feedback: >
          In an interview, open with why this game is worth money when the
          next-card bet is not, write the recursion with both boundary
          conditions, and quote $2.62$ for the full deck.

  - node: quant-games.ev-games.card-value-draw
    hook: >
      "Does dealing without replacement change the expected total of a
      hand?" is a one-word-answer trap — no — and the interviewer is really
      testing whether you can say why in one line.
    explanation: >
      Every position in a shuffled deck is marginally the same draw as the
      first card. Nothing about a uniform shuffle privileges position $3$
      over position $30$: relabeling the deck's positions doesn't change
      the shuffle's distribution, so the card sitting in any fixed position
      is equally likely to be any of the $52$ cards, exactly like the first
      card is. That gives every position the same mean value, $7$, even
      though the actual value drawn there is correlated with everything
      drawn before it.

      Summing several such positions to price a hand needs only linearity,
      which was never conditioned on independence in the first place — so
      a five-card hand prices at $5\times7=35$ whether the cards are dealt
      with or without replacement. What changes between the two dealing
      rules is the variance: without replacement, an extreme early draw
      removes an extreme card from what's left, so hands self-correct
      toward the mean and swing less than they would if draws were
      independent. The mean never sees any of that correction, because it
      never needed the draws to be independent to add correctly.

      A counting payoff prices the same way — a dollar for every card
      meeting some condition is just that condition's single-card
      probability, multiplied by however many cards are dealt.
    worked: >
      Deal a $3$-card hand from the same $A=1$ through $K=13$ deck. The
      total values at $3\times7=21$. A dollar for every ten-or-higher card
      ($10,J,Q,K$, $16$ of the $52$ cards) prices at
      $3\times(16/52) = 3\times(4/13) = 12/13\approx0.923$.
    interview: >
      "Does dependence from dealing without replacement change the fair
      price?" wants "no, only the variance" stated immediately, backed by
      the one-line reason — marginal uniformity plus linearity — rather
      than a hedge like "it should be close."
    pitfalls: >
      Assuming dependence between draws must show up somewhere in the mean,
      and trying to "correct" the naive sum-of-means answer, is the classic
      overreach — there's no correction, the naive sum is exact. Confusing
      "a dollar per ace" (an additive count) with "at least one ace" (a
      genuinely different quantity) is the other common slip.
    recap: >
      Every dealt position is marginally the same uniform draw as the
      first card, so a hand's total or any per-card counting payoff prices
      by plain multiplication, however strongly the draws are correlated
      with each other.
    dialogue:
      - part: Two cards, one after the other
        teach: >
          Score a deck $A = 1$ through $K = 13$, so it holds $364$ pips. Two
          cards are dealt from the shuffled deck, without replacement, and you
          are paid their total. A friend argues: "If the first card is a king,
          the second averages less, so the pair is worth less than $14$."
      - ask: >
          What is the first card worth on its own?
        expects: "7"
        feedback: >
          It is equally likely to be any of the $52$ cards: $364/52 = 7$.
      - ask: >
          The first card is a king. What is the second card worth now?
        expects: "351/51"
        tolerance: 0.005
        feedback: >
          The other $51$ cards hold $364 - 13 = 351$ pips, so the second card
          is worth $351/51 \approx 6.88$. Your friend is right that it drops.
      - ask: >
          The first card is an ace instead. What is the second card worth?
        expects: "363/51"
        tolerance: 0.005
        feedback: >
          The other $51$ cards hold $364 - 1 = 363$ pips: $363/51 \approx
          7.12$. After a low card the second card is worth more.
      - reflect: >
          After a king the second card is worth less than $7$, after an ace
          more. What is it worth before you know the first card, and what does
          that make the pair worth?
        hint: >
          Average $(364 - v)/51$ over the value $v$ of the first card.
        answer: >
          Averaging over the first card, the second is worth
          $(364 - 7)/51 = 357/51 = 7$, exactly the first card's value. The
          drops and rises cancel because the first card is as likely to be low
          as high. So the pair is worth $7 + 7 = 14$, and the friend's argument
          looks at one branch of the dependence and forgets the others.

      - part: Every position is the first card
        teach: >
          The same holds for every position: in a uniform shuffle the card in
          any fixed position is equally likely to be any of the $52$, so each
          is worth $7$. Expectation adds whether or not the cards are
          independent, so a $k$-card hand dealt without replacement totals
          $7k$, the same as with replacement. A payoff that counts cards of
          some kind is worth $k$ times the single-card probability.
      - ask: >
          A thirteen-card hand pays $1$ for every card ranked below $5$ — the
          aces, twos, threes and fours. What is it worth?
        expects: "4"
        feedback: >
          $16$ of the $52$ cards qualify, so each position is worth $16/52$ and
          the hand $13 \times 16/52 = 4$, however strongly the positions
          depend on one another.
      - ask: >
          A ten-card hand pays its total, less $5$ for every king in it. What
          is it worth?
        expects: "860/13"
        tolerance: 0.005
        hint: >
          Price the total and the king penalty separately, then combine.
        feedback: >
          The total is worth $10 \times 7 = 70$; the kings average
          $10 \times 4/52 = 10/13$, costing $50/13$. The hand is worth
          $70 - 50/13 = 860/13 \approx 66.15$. The penalty and the total are
          tangled together, and linearity never needed to untangle them.

      - part: What changes the price, and what does not
        ask: >
          A thirteen-card hand pays $1$ if it holds at least one ace. A
          colleague prices it at $13 \times 4/52 = 1$. What is wrong?
        choices:
          - text: >
              Nothing: an ace in any of the thirteen positions pays.
            feedback: >
              A hand with two aces pays $1$, not $2$, so the payoff is not a
              count of aces. Counting payoffs add; "at least one" does not.
          - text: >
              It counts aces, but a hand with several aces still pays only $1$;
              the true value is $1 - \binom{48}{13}/\binom{52}{13} \approx 0.70$.
            correct: true
            feedback: >
              Right. The count of aces is worth $1$; the event "at least one
              ace" misses with probability
              $\binom{48}{13}/\binom{52}{13} \approx 0.30$, so it is worth
              about $0.70$.
          - text: >
              It should use $4/51$ for the later cards, since the deck shrinks.
            feedback: >
              Every position is an ace with probability $4/52$ before the deal,
              so the count of aces really is worth $1$. The mistake is in the
              payoff, not the probability.
        feedback: >
          Price a count by adding positions; price "at least one" through the
          complement.
      - ask: >
          Compare a thirteen-card hand's total dealt without replacement with
          the same hand dealt with each card put back. What differs?
        choices:
          - text: >
              The mean: without replacement it is slightly below $91$.
            feedback: >
              Both are worth $13 \times 7 = 91$. Every position is a uniform
              card either way, and the mean only ever reads positions one at a
              time.
          - text: >
              Nothing: the two deals have the same law.
            feedback: >
              Push it to fifty-two cards: without replacement the total is
              $364$ every time, while with replacement it swings widely around
              $364$. The laws differ even though the means agree.
          - text: >
              The spread: without replacement the total varies less.
            correct: true
            feedback: >
              Right. A high early card leaves a lower deck behind, so hands
              self-correct toward the mean. In the extreme, all fifty-two cards
              total $364$ every time.
        feedback: >
          Dealing without replacement moves the variance, never the price. In
          an interview: "no change to the mean — every position is a uniform
          card and expectation adds without independence."

  - node: quant-games.ev-games.ace-positions
    hook: >
      Deck-position questions stop feeling hard the moment you stop
      tracking the aces and start tracking the gaps between them — the same
      exchangeability you already trust, aimed at a new object.
    explanation: >
      Picture the $48$ non-ace cards laid out and the $4$ aces dropped in
      as dividers, cutting the sequence into $5$ gaps. Nothing about a
      uniform shuffle privileges the gap before the first ace over the gap
      after the last one — reversing or relabeling the deck maps one valid
      gap configuration to another equally likely one — so the $5$ gap
      sizes are exchangeable, exactly the property that let a known total
      split evenly among exchangeable parts elsewhere. Their total is fixed
      at $48$, so each gap averages $48/5=9.6$.

      From there it's bookkeeping: "cards before the first ace" is exactly
      the first gap, $9.6$, while "position of the first ace" is one more
      than that, $10.6$, since the ace itself occupies the slot right after
      its gap. The last ace is priced by the mirror image of the same
      argument, landing at $53-10.6=42.4$.

      The pattern generalizes past aces: $k$ special cards cut the deck
      into $k+1$ exchangeable gaps of $(52-k)/(k+1)$ each, and the same
      $+1$ bookkeeping converts a gap size into a position.
    worked: >
      Price the two black aces specifically ($k=2$). The $50$ other cards
      split into $k+1=3$ exchangeable gaps, each averaging $50/3\approx
      16.67$. The first black ace sits at $50/3+1=53/3\approx17.67$ on
      average, and by the mirror argument the second sits at
      $53-53/3=106/3\approx35.33$.
    interview: >
      "What position do you expect the second heart to appear at" or any
      variant with a different special-card count tests whether you
      generalize past the ace-specific numbers to $k$ special cards and
      $k+1$ gaps, rather than trying to recall a memorized answer.
    pitfalls: >
      Using $k$ gaps instead of $k+1$ drops the gap after the last special
      card. Applying the $+1$ conversion between "cards before" and
      "position of" inconsistently between the first-occurrence and
      last-occurrence versions is the other reliable source of an
      off-by-one.
    recap: >
      $k$ special cards cut a shuffled deck into $k+1$ exchangeable gaps of
      $(52-k)/(k+1)$ each — the two black aces average $53/3\approx17.67$
      for the first and $106/3\approx35.33$ for the second.
    dialogue:
      - part: Five cards you can list
        teach: >
          Five cards, two jokers and three plain cards, are shuffled and turned
          over one at a time. You are paid the position of the first joker: a
          joker on top pays $1$, and jokers in positions $3$ and $5$ pay $3$.
      - ask: >
          The two jokers sit in one of $10$ equally likely pairs of positions.
          What is the game worth?
        expects: "2"
        hint: >
          How many of the $10$ pairs have their first joker at position $1$? At
          $2$, $3$, $4$?
        feedback: >
          First joker at $1$: $4$ pairs; at $2$: $3$; at $3$: $2$; at $4$: $1$.
          That is $(4 \cdot 1 + 3 \cdot 2 + 2 \cdot 3 + 1 \cdot 4)/10 = 20/10
          = 2$.
      - ask: >
          Now you are paid the number of plain cards turned before the first
          joker. What is that worth?
        expects: "1"
        feedback: >
          It is always one less than the joker's position, so it is worth
          $2 - 1 = 1$. Keep the two phrasings apart: they differ by exactly
          one.
      - ask: >
          The three plain cards fall into three groups: before the first joker,
          between the jokers, after the second. Which group is largest on
          average?
        choices:
          - text: >
              The first, since it is filled before any joker can appear.
            feedback: >
              The first group averages $1$ card, as you just found. Order of
              turning has nothing to do with it; a shuffle has no direction.
          - text: >
              The middle one, since it is squeezed between two jokers and so
              the jokers must be spread apart.
            feedback: >
              The jokers are adjacent, with an empty middle, on $4$ of the $10$
              pairs. Averaged over all ten, the middle group holds $1$ card,
              like the others.
          - text: >
              None: all three average $1$ card.
            correct: true
            feedback: >
              Right. The last group mirrors the first, and the middle one
              averages $(0 \cdot 4 + 1 \cdot 3 + 2 \cdot 2 + 3 \cdot 1)/10 = 1$.
        feedback: >
          Three groups, three plain cards, and each averages one.
      - reflect: >
          Why must the three groups have the same average size, and how would
          that answer "position of the first ace" in a full deck without
          listing $\binom{52}{4}$ placements?
        hint: >
          Is there anything about a uniform shuffle that favours one group over
          another?
        answer: >
          A uniform shuffle treats the groups alike: reverse the deck, or swap
          the contents of two groups, and you get an equally likely deck. So
          the group sizes are exchangeable, and since they always total the
          number of plain cards, each averages that total divided by the number
          of groups. In a full deck the four aces cut the $48$ other cards into
          five groups, each averaging $48/5 = 9.6$, and the first ace sits one
          past the first group, at $10.6$.

      - part: Gaps between the special cards
        teach: >
          Put generally: in a shuffled deck of $n$ cards, $k$ special cards cut
          the other $n - k$ into $k + 1$ exchangeable gaps, each averaging
          $(n - k)/(k + 1)$. "Cards before the first special card" is the first
          gap; "position of the first special card" is one more. The last
          special card mirrors the first: reverse the deck and it becomes the
          first, so its position averages $n + 1$ minus the first one's.
      - ask: >
          A full deck is turned over one card at a time. At what position does
          the first heart appear, on average?
        expects: "53/14"
        tolerance: 0.005
        hint: >
          Thirteen hearts cut the other $39$ cards into how many gaps?
        feedback: >
          $13$ hearts make $14$ gaps of $39/14 \approx 2.79$ cards, so the
          first heart sits at $39/14 + 1 = 53/14 \approx 3.79$.
      - ask: >
          At what position does the last heart appear, on average?
        expects: "689/14"
        tolerance: 0.005
        feedback: >
          Reversed, the last heart is the first: $53 - 53/14 = 689/14 \approx
          49.21$. Equivalently, the last gap averages $39/14$ and the last
          heart sits just before it: $52 - 39/14$.

      - part: Counting the gaps right
        ask: >
          A colleague says the cards before the first heart average
          $39/13 = 3$. What went wrong?
        choices:
          - text: >
              Nothing: $39$ other cards, $13$ hearts, $3$ per heart.
            feedback: >
              Thirteen hearts make fourteen gaps, not thirteen: the gap after
              the last heart counts too. Dividing by $13$ leaves it out.
          - text: >
              It divides by $13$ gaps, dropping the one after the last heart;
              the answer is $39/14 \approx 2.79$.
            correct: true
            feedback: >
              Right. $k$ dividers cut a line into $k + 1$ pieces, and the piece
              at the far end is as large on average as any other.
          - text: >
              It forgot the $+1$: the answer is $3 + 1 = 4$.
            feedback: >
              The $+1$ turns a count of cards before into a position, and the
              question asked for the count. The real slip is the number of
              gaps.
        feedback: >
          Count the dividers, add one for the last gap, then decide whether the
          question wants a count or a position.
      - ask: >
          On average, how many non-hearts lie between the first heart and the
          last heart?
        expects: "234/7"
        tolerance: 0.005
        hint: >
          Which of the fourteen gaps lie between the first and last heart?
        feedback: >
          All gaps except the first and the last: $12 \times 39/14 = 234/7
          \approx 33.43$. Check: $39 - 2(39/14) = 234/7$. In an interview,
          name the gaps, count them, and the position questions are one line
          each.

  - node: quant-games.ev-games.risk-aversion
    hook: >
      "Here's a coin flip with clearly positive expected value — would you
      take it?" is a trap for anyone who answers with the EV alone; the
      interviewer wants to hear that a rational person can still say no.
    explanation: >
      Expected value treats every dollar the same regardless of how much
      wealth is already at stake, and that's precisely the assumption a
      concave utility $u$ gives up. A bettor with wealth $W$ maximizes
      $\mathbb{E}[u(W+X)]$, and because $u$ bends downward, a loss and an
      equally sized gain are not mirror images in utility terms — the loss
      costs more utility than the matching gain buys back. That asymmetry
      can flip the sign: a bet can have strictly positive
      $\mathbb{E}[X]$ and still strictly negative $\mathbb{E}[u(W+X)]-u(W)$,
      making decline the rational choice, not a failure of nerve.

      Two rules follow from taking this seriously rather than just
      asserting it. Refuse outright any bet carrying a real chance of ruin,
      however large the edge, because ruin is absorbing — there is no next
      game to average the loss against, so no finite edge compensates for
      an infinite downside in utility terms. Short of ruin, the right
      response to a positive-EV bet is not refusal but sizing: shrink the
      stake until concavity barely bites, a question about how much to bet
      rather than whether the edge is real, and one this unit sets aside
      for the log-wealth machinery of Kelly sizing.
    worked: >
      A log-utility investor with wealth $100$ is offered a fair coin flip:
      win $60$ or lose $40$. The outcomes are wealth $160$ or $60$, each
      with probability $0.5$, so $\mathbb{E}[\text{gain}] = 0.5(60)+0.5(-40)
      = 10$, clearly positive. But expected utility is
      $0.5\ln(160)+0.5\ln(60) \approx 0.5(5.075)+0.5(4.094) = 4.5848$,
      while not playing gives $\ln(100)\approx4.6052$ — since
      $4.5848 < 4.6052$, this log-utility investor rationally declines a
      $+10$-EV bet.
    interview: >
      The complete answer has two parts: confirm the EV is positive with
      the arithmetic, then explain why a rational agent can still decline
      by naming concavity and the stake's size relative to wealth — neither
      "just take it, it's positive EV" nor "no, too risky" alone answers
      what's being asked.
    pitfalls: >
      Treating "always take positive-EV bets" as a blanket rule ignores the
      stake-to-bankroll ratio entirely. Treating every refusal of a
      positive-EV bet as irrational makes the opposite mistake — expected
      utility, not expected value, is the actual objective once the stake
      is large.
    recap: >
      A positive-EV bet is one you can rationally refuse once the stake is
      large relative to bankroll, because a concave utility weighs the loss
      branch more heavily than the equal-sized gain branch — a fair
      $+60/-40$ flip on wealth $100$ has EV $+10$ yet lower expected
      log-utility than not playing.
    dialogue:
      - part: A good bet that feels bad
        teach: >
          Your savings are $100$ thousand. A friend offers a fair coin flip:
          heads you win $40$ thousand, tails you lose $30$ thousand.
      - ask: >
          What is the flip worth in expected value, in thousands?
        expects: "5"
        feedback: >
          $\tfrac{1}{2}(40) + \tfrac{1}{2}(-30) = 5$. By fair value alone you
          should pay up to $5$ thousand for the chance to play.
      - ask: >
          Score each fortune by its natural log instead: $\ln 140 \approx
          4.9416$, $\ln 100 \approx 4.6052$, $\ln 70 \approx 4.2485$. How much
          does winning raise your score?
        expects: "0.3364"
        tolerance: 0.0005
        feedback: >
          $4.9416 - 4.6052 = 0.3364$.
      - ask: >
          And how much does losing lower it?
        expects: "0.3567"
        tolerance: 0.0005
        feedback: >
          $4.6052 - 4.2485 = 0.3567$. The $30$ thousand you might lose costs
          more score than the $40$ thousand you might win adds.
      - ask: >
          What is the expected change in your score from taking the flip?
        expects: "-0.0101"
        tolerance: 0.0005
        feedback: >
          $\tfrac{1}{2}(0.3364) - \tfrac{1}{2}(0.3567) \approx -0.0101$. On
          this score the flip makes you worse off, though it is worth $+5$
          thousand in expectation.
      - reflect: >
          Losing $30$ cost more score than winning $40$ gained. Why does the
          log score do that, and what would you expect if the stakes were $4$
          and $3$ thousand instead?
        hint: >
          Where on the curve do the lost dollars come from, and where do the
          won dollars land?
        answer: >
          The log is concave: each extra thousand adds less the richer you
          already are. The thousands you might lose come off the poorer stretch
          between $70$ and $100$, where each one counts for more, and the ones
          you might win land on the richer stretch between $100$ and $140$,
          where each counts for less. At stakes of $4$ and $3$ the curve is
          nearly straight over $97$ to $104$, so the score moves almost in
          proportion to the dollars, and the positive expectation should win.

      - part: Utility, and the size of the stake
        teach: >
          A bettor with wealth $W$ and a concave utility $u$ maximises
          $\mathbb{E}[u(W + X)]$, not $\mathbb{E}[X]$, and concavity makes a
          lost dollar weigh more than a won one. The gap between the two
          objectives is a matter of scale: a stake small against $W$ sees $u$
          as nearly a straight line, and expected value ranks it correctly. At
          size, a positive edge can lower expected utility.
      - ask: >
          Same odds at a tenth of the size: win $4$ or lose $3$ thousand. Using
          $\ln 104 \approx 4.6444$ and $\ln 97 \approx 4.5747$, what is the
          expected change in your score?
        expects: "0.0044"
        tolerance: 0.0003
        feedback: >
          $\tfrac{1}{2}(4.6444 - 4.6052) + \tfrac{1}{2}(4.5747 - 4.6052) =
          \tfrac{1}{2}(0.0392) - \tfrac{1}{2}(0.0305) \approx 0.0044$.
          Positive: the same bet, shrunk, is one this bettor takes. The answer
          to a good bet at the wrong size is usually a smaller size, not no.

      - part: Ruin, and the answer said aloud
        ask: >
          A different offer: heads you win $1{,}000$ thousand, tails you lose
          all $100$ thousand. What should a log-utility bettor do?
        choices:
          - text: >
              Take it: the expected gain of $450$ thousand swamps any curvature.
            feedback: >
              Tails leaves wealth $0$, and $\ln 0$ is minus infinity: no upside
              can average against it. Ruin ends the game, so there is no next
              flip to make the loss back.
          - text: >
              Refuse: a bet that can wipe you out is refused however large the
              edge.
            correct: true
            feedback: >
              Right. Ruin is absorbing. A smaller version of this bet might be
              worth taking, but the bet as offered stakes everything.
          - text: >
              Take it if the coin is fair, since a fair coin makes the risk
              symmetric.
            feedback: >
              The coin is fair; the consequences are not. A $50\%$ chance of
              losing everything is the whole problem, whatever the odds of
              heads.
        feedback: >
          Two rules: refuse any bet that risks ruin, and otherwise take the
          edge at a size where the curve barely bends. How large that size is
          belongs to bet sizing, not to the edge.
      - ask: >
          An interviewer offers a fair flip: win $1.1$ million or lose $1$
          million. Which answer is the complete one?
        choices:
          - text: >
              "I take it: it is worth $+50$ thousand."
            feedback: >
              Half an answer. The arithmetic is right, but a $1$ million loss
              would cost most people far more utility than a $1.1$ million gain
              adds, and declining is not irrational.
          - text: >
              "I decline: I never gamble with that kind of money."
            feedback: >
              The other half missing. Say the expected value first, then the
              reason it does not settle the decision at this size.
          - text: >
              "It is worth $+50$ thousand, but against my wealth a $1$ million
              loss costs far more utility than the gain adds, so I decline at
              this size and would take it scaled down."
            correct: true
            feedback: >
              Right: the sign of the edge, then why concavity overrides it at
              this stake, then what size would be acceptable.
        feedback: >
          The interviewer wants both halves: the expected value computed, and
          the reason a rational person can still say no.

  - node: quant-games.ev-games.certainty-equivalent
    hook: >
      "What's the most you'd pay to make this risk go away?" is asking for
      the certainty equivalent by name, and it's the number that turns
      risk aversion from a qualitative story into an actual price.
    explanation: >
      The certainty equivalent $c$ solves $u(W+c)=\mathbb{E}[u(W+X)]$: it's
      the sure amount that produces exactly the same utility as playing the
      game, so it's the largest price at which you'd still rather play than
      walk away with cash instead. Since $u$ is strictly increasing it's
      invertible, so $c$ is uniquely determined, and for concave $u$ the
      risk premium $\mathbb{E}[X]-c$ comes out nonnegative — a concave
      function's value at the average input is never below the average of
      its values, so accepting the average payoff for certain is always at
      least as good in utility terms as facing the gamble.

      The Arrow-Pratt approximation comes from Taylor-expanding $u$ around
      $W$: $u(W+X)\approx u(W)+u'(W)X+\tfrac{1}{2}u''(W)X^{2}$, so
      $\mathbb{E}[u(W+X)]\approx u(W)+u'(W)\mathbb{E}[X]+
      \tfrac{1}{2}u''(W)\operatorname{Var}(X)$ once you center at $c$'s own
      first-order expansion, $u(W+c)\approx u(W)+u'(W)c$. Matching the two
      and solving for $c$ leaves the premium at roughly
      $\tfrac{1}{2}A(W)\operatorname{Var}(X)$, where $A=-u''/u'$ — a purely
      local fact, accurate only while the bet stays small next to $W$.
    worked: >
      Log utility, $W=50$, a fair coin flip of $\pm20$ (wealth $70$ or
      $30$). Exact: $\ln(50+c)=0.5\ln(70)+0.5\ln(30)\approx3.8248$, so
      $50+c\approx e^{3.8248}\approx45.83$ and $c\approx-4.17$, a risk
      premium of about $4.17$. Arrow-Pratt: $A(50)=1/50$, so the premium
      approximates to $\tfrac{1}{2}(1/50)(20^{2})=4$ — close, but already
      about $4\%$ off at a stake this large relative to $W$.
    interview: >
      "What guaranteed amount would make you indifferent to this bet?" is
      answered by setting up $u(W+c)=\mathbb{E}[u(W+X)]$ immediately; under
      time pressure, naming the Arrow-Pratt shortcut
      $\tfrac{1}{2}A(W)\operatorname{Var}(X)$ as a fast estimate is the
      fluent move.
    pitfalls: >
      Confusing the certainty equivalent (a dollar amount) with expected
      utility itself (a utility-scale number that isn't directly
      comparable to dollars) skips the inversion step. Trusting the
      Arrow-Pratt approximation as exact for a bet that isn't actually
      small relative to wealth — as this worked example's $4\%$ gap
      shows — overstates its precision.
    recap: >
      The certainty equivalent solves $u(W+c)=\mathbb{E}[u(W+X)]$ for the
      sure amount you'd trade the bet for, and the resulting risk premium
      is approximated for small bets by $\tfrac{1}{2}A(W)\operatorname{Var}
      (X)$ — about $4.17$ against an approximation of $4$ for a $\pm20$
      flip on wealth $50$.
    dialogue:
      - part: The least you would sell it for
        teach: >
          Your wealth is $100$ and you score fortunes by their natural log. You
          hold a ticket that pays $0$ or $300$, with equal chances, and someone
          wants to buy it from you for cash.
      - ask: >
          What is the ticket's fair value?
        expects: "150"
        feedback: >
          $\tfrac{1}{2}(0) + \tfrac{1}{2}(300) = 150$.
      - ask: >
          A buyer offers $120$. Keeping the ticket scores
          $\tfrac{1}{2}\ln 100 + \tfrac{1}{2}\ln 400 = \ln 200$. Should you
          sell?
        choices:
          - text: >
              No: $120$ is below the ticket's fair value of $150$.
            feedback: >
              Fair value is the price for someone indifferent to risk. Selling
              leaves you a sure $220$, and $\ln 220$ beats the $\ln 200$ the
              ticket scores.
          - text: >
              Yes: a sure $220$ scores $\ln 220$, more than the ticket's
              $\ln 200$.
            correct: true
            feedback: >
              Right. On your log score the gamble is worth the same as a sure
              wealth of $200$, and $120$ in cash gets you past that.
          - text: >
              It cannot be decided without knowing how lucky you feel.
            feedback: >
              The log score already says how you feel about risk. Comparing
              $\ln 220$ with $\ln 200$ settles it.
        feedback: >
          Compare the sure wealth after selling with the sure wealth the ticket
          is worth on your score, $200$.
      - ask: >
          What is the lowest price you would accept for the ticket?
        expects: "100"
        hint: >
          Find the cash $c$ that leaves you exactly as well off as keeping the
          ticket.
        feedback: >
          You are indifferent when $\ln(100 + c) = \ln 200$, so $c = 100$.
          Below $100$ keep the ticket; above it, sell.
      - reflect: >
          Say exactly what defines that $100$, and why it comes out below the
          ticket's fair value of $150$.
        hint: >
          What equation did $c$ solve, and what shape is the log?
        answer: >
          It is the sure amount $c$ that you value exactly as much as the
          gamble: $u(W + c) = \mathbb{E}[u(W + X)]$. It sits below $150$
          because the log is concave: the average of the scores of $100$ and
          $400$ is below the score of their average, $250$, so the sure wealth
          that matches the gamble lies below $250$. The $50$ you give up is the
          price of not facing the risk.

      - part: Naming it, and testing it
        teach: >
          That $c$ is the certainty equivalent of the game $X$ at wealth $W$:
          the sure amount solving $u(W + c) = \mathbb{E}[u(W + X)]$, your
          reservation price for the game. The risk premium is
          $\mathbb{E}[X] - c$, here $150 - 100 = 50$, and it is never negative
          for a concave $u$.
      - ask: >
          A risk-neutral holder scores wealth by $u(w) = w$. What is the
          ticket's certainty equivalent for them?
        expects: "150"
        feedback: >
          $100 + c = \tfrac{1}{2}(100) + \tfrac{1}{2}(400) = 250$, so
          $c = 150$, the fair value, and the risk premium is $0$. Fair value is
          the certainty equivalent of a straight-line utility.
      - ask: >
          A candidate works out that keeping the ticket scores
          $\ln 200 \approx 5.30$ and says "the certainty equivalent is
          $5.30$". What is wrong?
        choices:
          - text: >
              Nothing: the certainty equivalent is the expected utility.
            feedback: >
              $5.30$ is a score, on the log scale; the certainty equivalent is
              an amount of money. A ticket that can pay $300$ is not worth
              $5.30$ to anyone with wealth $100$.
          - text: >
              It should be $\ln 250$, the score of the average wealth.
            feedback: >
              That scores the average outcome, which ignores risk entirely, and
              it is still a score rather than an amount.
          - text: >
              $5.30$ is a utility; solving $\ln(100 + c) = 5.30$ turns it into
              money, $c = 100$.
            correct: true
            feedback: >
              Right. The definition has two halves: compute the expected
              utility, then invert $u$ to read it back in money.
        feedback: >
          Expected utility and the certainty equivalent live on different
          scales; inverting $u$ connects them.

      - part: A shortcut for small bets
        teach: >
          For a small bet, expanding $u$ to second order around $W$ gives the
          Arrow–Pratt approximation: the risk premium is about
          $\tfrac{1}{2}A(W)\operatorname{Var}(X)$, where $A = -u''/u'$. For the
          log, $u' = 1/W$ and $u'' = -1/W^{2}$, so $A(W) = 1/W$.
      - ask: >
          Same bettor, wealth $100$, offered a fair coin flip for $\pm 5$. What
          risk premium does Arrow–Pratt give?
        expects: "0.125"
        feedback: >
          $\operatorname{Var}(X) = 25$ and $A(100) = 1/100$, so the premium is
          about $\tfrac{1}{2}(1/100)(25) = 0.125$.
      - ask: >
          Now solve it exactly: $\ln(100 + c) = \tfrac{1}{2}\ln 105 +
          \tfrac{1}{2}\ln 95$. Using $\sqrt{9975} \approx 99.8749$, what is the
          certainty equivalent $c$?
        expects: "-0.1251"
        tolerance: 0.0005
        hint: >
          Half the sum of two logs is the log of the square root of the
          product.
        feedback: >
          $100 + c = \sqrt{105 \times 95} = \sqrt{9975} \approx 99.8749$, so
          $c \approx -0.1251$ and the premium is $0 - c \approx 0.1251$:
          Arrow–Pratt was off in the fourth decimal.
      - ask: >
          Arrow–Pratt on the original ticket ($0$ or $300$, variance $22{,}500$)
          gives $\tfrac{1}{2}(1/100)(22{,}500) = 112.5$. The true premium is
          $50$. Why so far off?
        choices:
          - text: >
              The ticket's payoff is not symmetric about $0$, and Arrow–Pratt
              needs a zero-mean bet.
            feedback: >
              A nonzero mean shifts the expansion point but is not the main
              problem. The flip of $\pm 5$ worked because it was small, and
              this ticket is not.
          - text: >
              The approximation is local: a payoff as large as the wealth
              itself is far outside where a second-order expansion holds.
            correct: true
            feedback: >
              Right. Outcomes of $0$ and $300$ against wealth $100$ are not a
              small bet, so the curvature of the log changes across the range,
              and the quadratic overstates the premium more than twofold.
          - text: >
              It is not off: $112.5$ is the premium and $50$ is a slip.
            feedback: >
              $50$ comes straight from the definition: $150 - 100$. The
              definition is exact; the shortcut is the estimate.
        feedback: >
          Quote $\tfrac{1}{2}A\operatorname{Var}$ for a quick number on a small
          bet; for a large one, solve $u(W + c) = \mathbb{E}[u(W + X)]$
          directly.

  - node: quant-games.ev-games.repeated-edge
    hook: >
      "You have a small edge — how many times do you need to trade it
      before you actually know it's real?" is asking you to compare two
      growth rates, and the answer — a square root, not linear — is why
      thin edges are businesses only at real scale.
    explanation: >
      Two forces move at different speeds as the number of bets $n$ grows.
      The signal — mean profit — accumulates linearly: $n$ bets each
      contributing the same per-bet edge sum to $n$ times that edge,
      regardless of any correlation between the bets, since expectation
      never needed independence to add. The noise — the standard deviation
      of profit — grows only like $\sqrt{n}$, because each bet's
      fluctuation around its own mean is roughly independent of the others,
      and independent fluctuations partly cancel rather than stacking
      directly.

      Dividing the two gives the signal-to-noise ratio: $(n\cdot
      \text{edge})/(\sigma\sqrt{n}) = (\text{edge}/\sigma)\sqrt{n}$, which
      itself grows only like $\sqrt{n}$. Quadrupling the number of bets
      only doubles your confidence that the edge is real; getting ten times
      as confident costs a hundred times the volume.

      This is the quantitative reason sizing, not the existence of the
      edge, is the binding constraint in practice — surviving the long,
      noisy stretch before the signal clears the noise is a drawdown
      question, which this unit hands off to Kelly sizing rather than
      answering here.
    worked: >
      A strategy earns an edge of $0.02$ per trade with a per-trade
      standard deviation of $5$. At $n=2500$ trades, mean profit is
      $2500(0.02)=50$ and the standard deviation is $5\sqrt{2500}=250$, a
      signal-to-noise ratio of just $0.2$ — statistically indistinguishable
      from noise. At $n=250{,}000$ trades, mean profit is $5000$ against a
      standard deviation of $5\sqrt{250{,}000}=2500$, a ratio of $2$: a
      hundredfold increase in volume bought only a tenfold rise in
      confidence.
    interview: >
      "You've got a $2$-cent edge with $5$ dollars of volatility per
      trade — how many trades before you trust it?" wants the
      $(\text{edge}/\sigma)\sqrt{n}$ scaling stated explicitly, ideally
      followed by solving for the $n$ a target confidence level actually
      requires.
    pitfalls: >
      Treating a positive mean profit after some stretch of trading as
      proof the edge is real ignores the ratio entirely — the worked
      example's $2500$-trade result is a real, positive number that is
      still only $0.2$ standard deviations from noise. Assuming volume and
      confidence scale together linearly is the error the whole $\sqrt{n}$
      law exists to correct.
    recap: >
      Mean profit accumulates $n$ times the per-bet edge while its standard
      deviation grows only $\sqrt{n}$ times the per-bet volatility, so
      confidence in an edge grows only like $\sqrt{n}$ — a hundredfold
      increase in trades bought only a tenfold rise in signal-to-noise in
      the worked example.
    dialogue:
      - part: A hundred trades of a thin edge
        teach: >
          A strategy makes $0.04$ per trade on average, with a standard
          deviation of $2$ per trade, and its trades are independent. You run
          it $100$ times.
      - ask: >
          What is your expected profit after the $100$ trades?
        expects: "4"
        feedback: >
          $100 \times 0.04 = 4$. Expectation adds trade by trade.
      - ask: >
          Roughly how large is the standard deviation of that $100$-trade
          profit?
        choices:
          - text: >
              About $200$: a hundred trades of $2$ each.
            feedback: >
              That would hold if every trade swung the same way at once.
              Independent trades partly cancel: variances add, so the variance
              is $100 \times 2^{2} = 400$ and the standard deviation $20$.
          - text: >
              About $20$: the variance is $100 \times 4 = 400$.
            correct: true
            feedback: >
              Right. Variances of independent trades add, so the standard
              deviation is $2\sqrt{100} = 20$.
          - text: >
              About $2$: over many trades the noise averages away.
            feedback: >
              The noise in the *average* per trade shrinks, to
              $2/\sqrt{100} = 0.2$. The noise in the *total* grows, to $20$.
        feedback: >
          The edge has added up to $4$; the noise to $20$.
      - ask: >
          What is the ratio of expected profit to its standard deviation?
        expects: "0.2"
        feedback: >
          $4/20 = 0.2$. A fifth of a standard deviation: after $100$ trades,
          a profit or a loss says almost nothing about whether the edge is
          real.
      - reflect: >
          The expected profit grows in proportion to the number of trades. How
          does its standard deviation grow, and what does that do to the ratio
          as you keep trading?
        hint: >
          Write both for $n$ trades.
        answer: >
          Variances of independent trades add, so after $n$ trades the variance
          is $n\sigma^{2}$ and the standard deviation $\sigma\sqrt{n}$, while
          the mean is $n$ times the edge. Their ratio is
          $(\text{edge}/\sigma)\sqrt{n}$: it improves, but only like the square
          root of the volume. Being twice as sure takes four times as many
          trades.

      - part: Signal like n, noise like the root of n
        teach: >
          Edge accumulates like $n$ and noise like $\sqrt{n}$, so the
          signal-to-noise ratio after $n$ trades is
          $(\text{edge}/\sigma)\sqrt{n}$. Here that is $0.02\sqrt{n}$. A thin
          edge is a business only if it can be repeated, and repeated a great
          many times.
      - ask: >
          How many trades until the expected profit equals one standard
          deviation?
        expects: "2500"
        hint: >
          Solve $0.02\sqrt{n} = 1$.
        feedback: >
          $\sqrt{n} = 50$, so $n = 2500$: mean $100$, standard deviation
          $2\sqrt{2500} = 100$. Raising the ratio fivefold, from $0.2$, took
          twenty-five times the trades.
      - ask: >
          Competition halves the edge to $0.02$ per trade, with the same
          standard deviation of $2$. How many trades does one standard
          deviation take now?
        expects: "10000"
        feedback: >
          The ratio is now $0.01\sqrt{n}$, so $\sqrt{n} = 100$ and
          $n = 10{,}000$. Half the edge, four times the volume: the volume
          needed scales like $1/\text{edge}^{2}$.

      - part: What a stretch of results can and cannot tell you
        ask: >
          Back to the $0.04$ edge. After $2500$ trades you are down $30$. A
          colleague says this proves there is no edge. Is that right?
        choices:
          - text: >
              Yes: a strategy with an edge should not lose over $2500$ trades.
            feedback: >
              The expected profit is $100$ with standard deviation $100$. A
              loss of $30$ sits $1.3$ standard deviations below the mean,
              which happens roughly one time in ten.
          - text: >
              No: $-30$ is $1.3$ standard deviations below the expected $100$,
              well within the noise.
            correct: true
            feedback: >
              Right. At a ratio of $1$, about one run in six loses money
              outright. A result this size cannot confirm the edge or rule it
              out.
          - text: >
              No: any losing stretch is bad luck, so the edge must still be
              there.
            feedback: >
              A losing stretch is also what a strategy with no edge produces.
              The data are consistent with both; deciding needs a stretch long
              enough that the ratio is well above $1$.
        feedback: >
          Judge a result against the standard deviation of the profit, never by
          its sign alone.
      - ask: >
          To get there faster, a trader doubles the stake on every trade.
          What happens to the ratio after $n$ trades?
        choices:
          - text: >
              It doubles, since the profit per trade doubles.
            feedback: >
              The profit doubles and so does the standard deviation, trade by
              trade. Their ratio is exactly what it was.
          - text: >
              It is unchanged; only more independent trades raise it.
            correct: true
            feedback: >
              Right. Stake scales the edge and $\sigma$ together. What the
              bigger stake does change is the size of the drawdowns you must
              survive on the way, and that is a sizing question, not an
              edge question.
          - text: >
              It halves, because bigger bets are riskier.
            feedback: >
              The bets are riskier in money, and also more profitable in money,
              in the same proportion. The ratio does not move.
        feedback: >
          Only repetition turns an edge into a reliable profit, and surviving
          the noisy stretch before it does is the binding constraint. In an
          interview: "mean grows like $n$, noise like $\sqrt{n}$, so the
          ratio is $(\text{edge}/\sigma)\sqrt{n}$."
