unit: quant-mental.arithmetic
opening: >
  Mental arithmetic in a quant interview is not about doing hard math faster —
  it's about routing every calculation through the least effortful path: round
  to a friendly base and correct, recognize a square or a repeating fraction on
  sight, and verify the answer with a one-line residue check before anyone
  asks. This unit builds a small toolkit of moves — complements and near-base
  multiplication, squaring by expansion, the 5/11/25 shortcuts, a table of
  common fraction-decimal conversions, multiplicative percent chaining,
  weighted averages by anchor-and-gap, and the divisibility and digit-sum
  checks that catch a slip — and orders them so each new trick reuses the one
  before it. None of these replace understanding; they replace friction,
  which is exactly what a timed round is testing.
lessons:
  - node: quant-mental.arithmetic.base-tricks
    hook: >
      Every mental-math round opens with numbers deliberately chosen to sit
      just off a round base, and complements plus near-base multiplication
      are the two moves that turn that near-miss into free arithmetic instead
      of a slow carry-by-carry slog.
    explanation: >
      Round numbers cost nothing to add or subtract — no digit carries across
      the whole number — so the complement move's whole point is to spend one
      cheap step reaching a round number, then pay back the difference in a
      second cheap step, instead of carrying digit by digit through the
      original numbers.

      Near-base multiplication applies the identical reframing one level up.
      Writing each factor as a base plus a signed offset and expanding
      $(B+a)(B+b) = B^{2} + B(a+b) + ab$ splits an awkward product into three
      easy pieces: $B^{2}$ is a square of a round number (append zeros),
      $B(a+b)$ is another round-number multiplication, and $ab$ is a
      small-number product you already know. None of the three pieces
      requires the multi-digit long multiplication the raw product would.

      The mental model to keep is: replace every number near an anchor with
      "anchor plus a small signed offset," do all the arithmetic on the
      offsets, and only touch the anchor at the very end. That reframing is
      what makes both moves generalize — it works for any round base (10, 50,
      100, 1000), and it's the same offset-tracking discipline that other
      techniques elsewhere in this program specialize further.

      Reach for this the instant both operands in a sum, difference, or
      product sit within about 10 of the same round number — the closer the
      offsets are to zero, the smaller the correction terms, and the faster
      the whole calculation.
    worked: >
      Subtraction: $6003 - 1987$. Round $1987$ up to $2000$ (an offset of
      $+13$), so $6003 - 1987 = 6003 - 2000 + 13 = 4016$. Multiplication:
      $104 \times 97$, offsets $+4$ and $-3$ from base $100$:
      $100^{2} + 100(4-3) + (4)(-3) = 10000 + 100 - 12 = 10088$.
    interview: >
      This is the warm-up drill of nearly every timed arithmetic round — two-
      and three-digit sums, differences, and products chosen so both numbers
      sit near 10, 50, 100, or 1000. Interviewers expect the answer in one or
      two seconds with no visible carrying, and a candidate who visibly
      reaches for the anchor-and-offset framing before computing is showing
      exactly the skill being tested.
    pitfalls: >
      Getting the sign of the cross term wrong when the two offsets have
      opposite signs — $B(a+b)$ uses the signed offsets, so $104\times97$
      needs $100(4+(-3))=100$, not $100(4+3)$. Forgetting that $ab$ is
      positive whenever both offsets are negative, which is easy to drop when
      subtracting instead of adding it. Choosing an anchor that isn't
      actually close — once an offset exceeds about 10-15, the correction
      terms stop being fast mental arithmetic and the trick costs more than
      it saves.
    recap: >
      Replace numbers near a round base with anchor-plus-offset, do the
      arithmetic on the offsets, and only touch the anchor at the end.
    dialogue:
      - part: Two fills to add before the print
        teach: >
          A trader books two fills in the same name: $2{,}996$ shares in the
          morning and $1{,}847$ in the afternoon. The risk desk wants the total
          position before the confirmation prints, and nobody is reaching for a
          calculator.
      - ask: >
          What is the total, $2996 + 1847$?
        expects: "4843"
        hint: >
          Any route is fine for now. Notice which digits make you carry.
        feedback: >
          $4843$. Column by column it carries three times: $6 + 7 = 13$, then
          $9 + 4 + 1 = 14$, then $9 + 8 + 1 = 18$. Three carries is three
          chances to drop a digit while someone is waiting.
      - reflect: >
          $2996$ sits $4$ below a number you can add to anything with no carry
          at all. How would you use that to get the total in two moves instead
          of three carries?
        hint: >
          What is $3000 + 1847$?
        answer: >
          Add $3000$ instead, which only touches the thousands digit:
          $3000 + 1847 = 4847$. You added $4$ too much, so take it back:
          $4847 - 4 = 4843$. One free step to a round number, one small
          correction, no carries anywhere.
      - teach: >
          That is the complement move: replace a number near a round base by
          the base, do the easy operation, then pay back the offset. The only
          thing to keep straight is which way the payback goes.
      - ask: >
          To compute $5210 - 1996$ you first do $5210 - 2000 = 3210$. What
          comes next?
        choices:
          - text: >
              Subtract $4$, giving $3206$.
            feedback: >
              You were asked to remove $1996$ and you removed $2000$, which is
              $4$ too many. Subtracting another $4$ takes the answer further
              from the truth; $3206 + 1996 = 5202$, not $5210$.
          - text: >
              Add $4$, giving $3214$.
            correct: true
            feedback: >
              Right. You over-subtracted by $4$, so you give it back. Check:
              $3214 + 1996 = 5210$.
          - text: >
              Add $6$, giving $3216$, since $1996$ ends in a $6$.
            feedback: >
              The offset is the distance to the base, $2000 - 1996 = 4$, not
              the last digit. For a number just below a round base, the offset
              is $10$ minus the last digit, not the digit itself.
        feedback: >
          Rounding the subtracted number up means you took too much: add the
          offset back. Rounding an added number up means you added too much:
          take it off.
      - ask: >
          Compute $8002 - 3994$ with one complement and one correction.
        expects: "4008"
        hint: >
          Subtract the nearby round number first.
        feedback: >
          $8002 - 4000 = 4002$, and you removed $6$ too many, so
          $4002 + 6 = 4008$.

      - part: The same shortfall, multiplied
        ask: >
          Now $96 \times 93$. A candidate reasons: "both are near $100$, so
          about $10000$, minus $4$ and minus $7$, which is $9989$." What went
          wrong?
        choices:
          - text: >
              Nothing; that is the complement move applied to a product.
            feedback: >
              A quick bound kills it: $96 \times 93$ is less than
              $96 \times 100 = 9600$, so $9989$ is far too big. Complements
              correct a sum by the offset; a product needs more.
          - text: >
              Each unit missing from $96$ removes a whole copy of the other
              factor, not a single unit.
            correct: true
            feedback: >
              Right. Taking $4$ off the first factor removes $4$ copies of
              roughly $100$, about $400$, not $4$. The offsets get multiplied
              by the base.
          - text: >
              The offsets should be added, since both are below $100$:
              $10000 + 11 = 10011$.
            feedback: >
              Both factors are below $100$, so the product is below
              $100^{2} = 10000$. Whatever the correction is, it is a
              subtraction, and a large one.
        feedback: >
          In a product each offset is multiplied by the other factor. That is
          the obstacle the complement move cannot see.
      - reflect: >
          Write $96 \times 93$ as $(100 - 4)(100 - 7)$ and multiply out. Which
          pieces are cheap, and which small piece does a careless candidate
          forget?
        answer: >
          It is $10000 - 400 - 700 + 28$. The first three pieces are
          round-number arithmetic. The forgotten piece is $+28$: subtracting
          $4$ hundreds and $7$ hundreds takes away the $4 \times 7$ overlap
          twice, so it has to come back once.
      - teach: >
          That is near-base multiplication. Write each factor as base plus a
          signed offset, $B + a$ and $B + b$, and use
          $(B+a)(B+b) = B^{2} + B(a+b) + ab$. Here $B = 100$, $a = -4$,
          $b = -7$: the square of a round number, one round-number product,
          and one small product. The signs ride along with the offsets.
      - ask: >
          Finish it: what is $96 \times 93$?
        expects: "8928"
        feedback: >
          $10000 + 100(-11) + 28 = 10000 - 1100 + 28 = 8928$. Two negative
          offsets give a positive $ab$.
      - ask: >
          Compute $107 \times 95$ the same way.
        expects: "10165"
        hint: >
          The offsets are $+7$ and $-5$. Keep their signs in both corrections.
        feedback: >
          $10000 + 100(7 - 5) + (7)(-5) = 10000 + 200 - 35 = 10165$. With
          offsets on opposite sides of the base, the cross term shrinks and
          $ab$ turns negative.

      - part: Choosing the anchor
        ask: >
          You want $48 \times 53$. Which anchor makes the corrections smallest?
        choices:
          - text: >
              $100$, with offsets $-52$ and $-47$.
            feedback: >
              The algebra still holds, but $ab = 52 \times 47$ is harder than
              the product you started with. An anchor is only useful if it is
              close.
          - text: >
              $10$, with offsets $+38$ and $+43$.
            feedback: >
              Same problem from below: the offsets dwarf the base, and
              $38 \times 43$ is no easier than $48 \times 53$.
          - text: >
              $50$, with offsets $-2$ and $+3$.
            correct: true
            feedback: >
              Right. Any round number works as $B$, not only powers of ten,
              and $50^{2} = 2500$ is one you know cold.
        feedback: >
          The base is whatever round number both factors sit near. Pick it so
          both offsets are single digits.
      - ask: >
          Now compute $48 \times 53$ on base $50$.
        expects: "2544"
        feedback: >
          $2500 + 50(-2 + 3) + (-2)(3) = 2500 + 50 - 6 = 2544$.
      - ask: >
          Which of these products is a poor fit for near-base multiplication?
        choices:
          - text: >
              $1003 \times 996$
            feedback: >
              Base $1000$, offsets $+3$ and $-4$:
              $1000000 - 1000 - 12 = 998988$. A textbook fit.
          - text: >
              $68 \times 134$
            correct: true
            feedback: >
              Right. No single round number sits near both: around $100$ the
              offsets are $-32$ and $+34$, and $ab$ is a two-digit product of
              its own. Split it instead, $68 \times 134 = 68 \times 100 + 68
              \times 34$.
          - text: >
              $61 \times 59$
            feedback: >
              Base $60$, offsets $+1$ and $-1$: $3600 + 0 - 1 = 3599$. As
              good as it gets.
        feedback: >
          The trick pays only when both factors sit within roughly $10$ of a
          shared round number. Past that, the correction terms cost more than
          they save.
      - teach: >
          Said aloud under a stopwatch, the move sounds like this: "Ninety-six
          times ninety-three: ten thousand, minus eleven hundred, plus
          twenty-eight, so $8928$." Naming the base and the offsets first is
          what tells the interviewer you are routing, not guessing.

  - node: quant-mental.arithmetic.squares
    hook: >
      Squaring a two-digit number or spotting that two factors are equidistant
      from a midpoint are both just near-base multiplication with
      the offsets forced equal (or opposite), and recognizing that lets you
      skip straight to the shortcut instead of rederiving it.
    explanation: >
      Squares are the special case of near-base multiplication where both
      offsets are equal: setting $a=b=h$ in
      $(B+a)(B+b)=B^{2}+B(a+b)+ab$ collapses the two correction terms into
      one, $(x\pm h)^{2}=x^{2}\pm2xh+h^{2}$, and the last term is always
      added since $h^{2}$ is positive regardless of the sign of $h$. That's
      the same identity behind $47^{2}$ (anchor 50, $h=-3$) and $97^{2}$
      (anchor 100, $h=-3$) — only the anchor changes.

      Difference of squares is the opposite special case: make the two
      offsets exact negatives of each other, $a=+d$ and $b=-d$, and the
      linear correction term $B(a+b)$ vanishes entirely, leaving
      $(m-d)(m+d)=m^{2}-d^{2}$ — one square and one subtraction. Since $m$ is
      the average of the two original factors, spotting this shortcut is just
      noticing that two numbers are symmetric around an easy midpoint.

      Deciding which case applies is a glance, not a calculation: squaring a
      single number means reaching for $(x\pm h)^{2}$ around the nearest
      round anchor; multiplying two distinct numbers means first checking
      whether their average is a nice round number, and only falling back to
      the general near-base expansion if it isn't.
    worked: >
      Square: $62^{2}=(60+2)^{2}=3600+240+4=3844$. Difference of squares:
      $38\times42$ — average $40$, distance $2$ from it —
      $=40^{2}-2^{2}=1600-4=1596$.
    interview: >
      Squaring two-digit numbers cold, or multiplying two numbers a small gap
      apart, is a staple opener — the tell interviewers listen for is naming
      the anchor and the offset out loud before the number, since that's
      proof it wasn't memorized or guessed. Expect a rapid sequence testing
      both the $(x\pm h)^{2}$ and difference-of-squares cases back to back.
    pitfalls: >
      Forgetting $h^{2}$ is always positive and mistakenly subtracting it
      when $h$ is negative — it's added in both cases, only the middle term's
      sign flips. Using difference of squares on a pair that isn't actually
      equidistant from a round midpoint — if the average isn't clean, this
      route creates more work than the general near-base expansion, not less.
    recap: >
      Equal offsets give $(x\pm h)^{2}=x^{2}\pm2xh+h^{2}$ for squares;
      opposite offsets give $m^{2}-d^{2}$ for equidistant products.
    dialogue:
      - part: One number times itself
        ask: >
          An interviewer opens a drill with $58^{2}$. Using near-base
          multiplication on $58 \times 58$, what do you get?
        expects: "3364"
        hint: >
          Anchor at $60$. Both factors have the same offset.
        feedback: >
          Base $60$, offsets $-2$ and $-2$:
          $3600 + 60(-2 - 2) + (-2)(-2) = 3600 - 240 + 4 = 3364$.
      - reflect: >
          In a square the two offsets are always the same number $h$. What
          does $(B+a)(B+b) = B^{2} + B(a+b) + ab$ collapse to when $a = b = h$,
          and why is its last term never subtracted?
        hint: >
          Substitute $h$ for both offsets and simplify each correction.
        answer: >
          $B(a+b)$ becomes $2Bh$ and $ab$ becomes $h^{2}$, so
          $(B+h)^{2} = B^{2} + 2Bh + h^{2}$. The middle term takes the sign of
          $h$, but $h^{2}$ is a square: positive whether you anchored above or
          below. One correction flips sign, the other never does.
      - teach: >
          That is the anchored square, $(x \pm h)^{2} = x^{2} \pm 2xh + h^{2}$:
          pick the round anchor $x$ nearest your number, then add or subtract
          twice the anchor times the gap, then always add the gap squared.
      - ask: >
          Compute $71^{2}$.
        expects: "5041"
        feedback: >
          Anchor $70$, $h = +1$: $4900 + 140 + 1 = 5041$.
      - ask: >
          A candidate squares $39$ and says "$1600 - 80 - 1 = 1519$". What is
          the right answer, and the slip?
        choices:
          - text: >
              $1561$: the middle term is $40 \times 1 = 40$.
            feedback: >
              The middle term is $2xh$, not $xh$: $2 \times 40 \times 1 = 80$.
              Dropping the $2$ is the other classic slip.
          - text: >
              $1519$: anchoring below the number makes every correction negative.
            feedback: >
              Only the middle term follows the sign of $h$. The last term is
              $(-1)^{2} = +1$, and a quick sanity check agrees: $9 \times 9 = 81$,
              so $39^{2}$ must end in $1$, not $9$.
          - text: >
              $1521$: the $h^{2}$ term is added, so $1600 - 80 + 1$.
            correct: true
            feedback: >
              Right. $h = -1$ flips the middle term only; $h^{2} = 1$ is added
              back.
        feedback: >
          The sign of $h$ touches the middle term and nothing else. The gap
          squared is always added.

      - part: Two factors with one midpoint
        ask: >
          Next in the drill: $64 \times 56$. Run it as near-base
          multiplication on $60$. What is the product?
        expects: "3584"
        feedback: >
          Offsets $+4$ and $-4$: $3600 + 60(4 - 4) + (4)(-4) = 3600 + 0 - 16
          = 3584$.
      - ask: >
          What was the cross term $B(a+b)$ in that computation?
        expects: "0"
        feedback: >
          $60 \times (4 + (-4)) = 0$. The middle correction vanished and only
          the small product survived.
      - reflect: >
          The cross term died. When does that happen for a general pair of
          factors, and how could you spot such a pair in under a second?
        answer: >
          It vanishes exactly when the offsets are opposite, $+d$ and $-d$ —
          that is, when the anchor is the average of the two factors. Then
          $(m-d)(m+d) = m^{2} - d^{2}$: one square, one subtraction. To spot
          it, average the two numbers; if the average is round, you are done.
      - teach: >
          That is the difference of squares, $(m - d)(m + d) = m^{2} - d^{2}$,
          with $m$ the midpoint and $d$ the distance from it. It is the
          near-base identity with the middle term cancelled, and it always
          subtracts $d^{2}$, never $d$.
      - ask: >
          Compute $74 \times 86$.
        expects: "6364"
        hint: >
          Average the two factors to find $m$.
        feedback: >
          Midpoint $80$, distance $6$: $80^{2} - 6^{2} = 6400 - 36 = 6364$.
      - ask: >
          Which pair is a poor fit for difference of squares?
        choices:
          - text: >
              $95 \times 105$
            feedback: >
              Midpoint $100$, distance $5$: $10000 - 25 = 9975$. An ideal fit.
          - text: >
              $46 \times 53$
            correct: true
            feedback: >
              Right. The average is $49.5$, so $m^{2}$ and $d^{2}$ both carry
              fractions. Go back to near-base on $50$ with offsets $-4$ and
              $+3$: $2500 - 50 - 12 = 2438$.
          - text: >
              $27 \times 33$
            feedback: >
              Midpoint $30$, distance $3$: $900 - 9 = 891$. A clean fit.
        feedback: >
          Difference of squares needs a round midpoint, which requires the two
          factors to have the same parity and a round average. Otherwise fall
          back to the general near-base expansion.

      - part: Saying it under the clock
        ask: >
          The drill closes with $89^{2}$.
        expects: "7921"
        hint: >
          The nearest round anchor is $1$ away.
        feedback: >
          Anchor $90$, $h = -1$: $8100 - 180 + 1 = 7921$.
      - teach: >
          Said aloud, it is "ninety squared is eighty-one hundred, minus one
          eighty, plus one: $7921$." Naming the anchor and the gap before the
          number shows the interviewer the route, and the route is what they
          are grading.

  - node: quant-mental.arithmetic.eleven-trick
    hook: >
      Multiplying by 11 is common enough in speed rounds to deserve its own
      reflex, and it's really just the near-base $10+1$ decomposition
      collapsed into a digit-sliding pattern you can run without ever writing
      down the intermediate sum.
    explanation: >
      The shortcut comes straight from writing $11=10+1$:
      $n\times11=n\times10+n$, i.e. shift $n$ one place to the left and add
      the unshifted $n$ back underneath. Written as a column addition, that
      shifted copy lines up each digit of $n$ with the digit one place to its
      right, so the addition is exactly "sum each pair of neighboring
      digits" — the digit-sliding rule is nothing more than this column
      addition read off directly.

      That's why the two outer digits of the answer never change: the
      leftmost digit of the shift has nothing above it to add, and the
      rightmost digit of the original has nothing added to its right. Every
      interior digit is a genuine two-digit column sum, complete with a carry
      into the next column whenever that sum reaches 10 or more — the same
      carry rule as any addition, not a special case.

      Picture two copies of the number stacked with one nudged one place
      over, then added column by column; that picture is also why the sweep
      extends past two digits — each interior column only ever involves one
      adjacent pair, so a five-digit number takes the identical rule applied
      four times, moving one pair at a time from right to left.
    worked: >
      $234\times11$: outer digits stay $2$ and $4$; interior digits are
      $2+3=5$ and $3+4=7$, neither reaching 10, so the answer reads off
      directly as $2574$.
    interview: >
      Fired as a rapid-fire warm-up — a handful of two- and three-digit
      numbers times 11 in quick succession — testing whether the
      digit-sum-and-carry sweep is automatic rather than something you're
      still deriving mid-round. A strong answer handles a carry (a digit sum
      of 10 or more) at the same speed as one that doesn't.
    pitfalls: >
      Forgetting to carry when an adjacent pair sums to 10 or more, and
      forgetting that carry then bumps the digit to its left, not just the
      current position. Treating the rule as two-digit-only instead of
      sliding one adjacent pair at a time across longer numbers.
    recap: >
      $n\times11$ shifts and adds $n$ to itself, which reads off as: keep the
      outer digits, sum each adjacent pair for the interior ones, carrying as
      needed.
    dialogue:
      - part: Eleven of the same order
        ask: >
          A desk buys $11$ contracts at $62$ each. What is the total cost?
        expects: "682"
        hint: >
          $11$ is $10 + 1$.
        feedback: >
          $62 \times 10 + 62 = 620 + 62 = 682$.
      - ask: >
          The next order is $11$ contracts at $36$. Total?
        expects: "396"
        feedback: >
          $360 + 36 = 396$.
      - reflect: >
          Put the pairs side by side: $62 \to 682$ and $36 \to 396$. Where
          does each digit of the answer come from? In particular, why do the
          first and last digits survive untouched?
        hint: >
          Write $620 + 62$ as a column addition and look at what lines up in
          each column.
        answer: >
          In $620 + 62$ the shifted copy puts each digit beside its right-hand
          neighbour. The units column has only the original units digit, the
          leading column has only the shifted leading digit, and every column
          in between is the sum of two adjacent digits: $6$, then $6 + 2 = 8$,
          then $2$. So $\times 11$ is a column addition you can read straight
          off the digits.
      - teach: >
          That is the eleven trick: keep the outer digits, and fill each
          interior slot with the sum of the adjacent pair below it. It is
          nothing but $n \times 10 + n$ written without the stacking.

      - part: When the middle overflows
        ask: >
          $95 \times 11$. The pair sums to $9 + 5 = 14$, which does not fit in
          one slot. What is the product?
        expects: "1045"
        hint: >
          Check the size first: $95 \times 11$ is more than $950$.
        feedback: >
          Write the $4$ and carry the $1$ into the $9$, which becomes $10$:
          $1045$, and $950 + 95 = 1045$ agrees. The carry can make the answer
          one digit longer. Keeping the outer digits and dropping the carry
          gives $945$, less than $950$ and so impossible; carrying into the
          $5$ instead gives $946$, but carries in a column addition only ever
          move toward the more significant end.
      - ask: >
          Compute $67 \times 11$.
        expects: "737"
        feedback: >
          Outer digits $6$ and $7$, interior $6 + 7 = 13$: write $3$, carry
          $1$ into the $6$. That gives $737$, and $670 + 67 = 737$ agrees.

      - part: Longer numbers, one pair at a time
        ask: >
          A four-digit number has three adjacent pairs. Compute
          $2618 \times 11$.
        expects: "28798"
        hint: >
          Units digit, then each adjacent pair from the right, then the
          leading digit.
        feedback: >
          From the right: $8$, then $1 + 8 = 9$, $6 + 1 = 7$, $2 + 6 = 8$, and
          the leading $2$: $28798$. Check: $26180 + 2618 = 28798$.
      - ask: >
          Compute $3481 \times 11$.
        expects: "38291"
        hint: >
          One of the three pairs overflows.
        feedback: >
          From the right: $1$; $8 + 1 = 9$; $4 + 8 = 12$, write $2$ and carry;
          $3 + 4 + 1 = 8$; leading $3$. So $38291$, and
          $34810 + 3481 = 38291$.
      - ask: >
          Why do you sweep the pairs from right to left rather than reading
          the answer off left to right?
        choices:
          - text: >
              Either direction works; right to left is just habit.
            feedback: >
              Try $3481$ left to right: you would write $3$, then $7$, and
              only at the pair $4 + 8 = 12$ discover that the $7$ should have
              been an $8$. Going left to right means revising digits you have
              already said.
          - text: >
              Carries move left, so each slot is final only once everything
              to its right is done.
            correct: true
            feedback: >
              Right. Sweeping from the units end means every digit is final
              the moment you write it, which is what lets you say the answer
              while you compute it.
          - text: >
              The rule only holds right to left; left to right it gives a
              different number.
            feedback: >
              The pair sums are the same in either direction. What changes is
              when you find out about a carry.
        feedback: >
          It is column addition, so it runs the way column addition runs.
          Without carries, either direction gives the digits; with them, only
          right to left lets you commit as you go.
      - teach: >
          In a speed round, say the digits as you sweep: "Thirty-four
          eighty-one times eleven: one, nine, two carry one, eight, three —
          thirty-eight thousand two hundred ninety-one." A carry handled at the
          same pace as a plain pair is what the drill is listening for.

  - node: quant-mental.arithmetic.five-trick
    hook: >
      Multiplying or dividing by 5 by brute force wastes a full multiplication
      on a number that's really just 10 in disguise, and trading it for one
      halving or doubling step plus a decimal-point shift is close to free.
    explanation: >
      The whole trick is the substitution $5=10/2$: multiplying by 5 is the
      same as multiplying by 10 and halving, in either order, and dividing by
      5 is the same as dividing by 10 and doubling, again in either order —
      the two operations, times-10 and times-a-half, commute, so only the
      bookkeeping of which you do first changes.

      For multiplication, order matters for staying in whole numbers: halve
      first when the number is even, since the halving then never produces a
      fraction and the following times-10 is just a zero appended. For
      division, always double first — doubling an integer never creates a
      fraction, and the resulting division by 10 is then just dropping a
      trailing zero.

      Hold this as one mental register: "5 is half of 10." The moment a
      times-5 or divide-by-5 appears, the calculation is really "halve or
      double, then move a decimal point" — a single easy operation plus a
      mechanical shift, never a genuine multiplication by 5.

      The same halve-or-double-then-shift move chains for any power of 5:
      multiplying by 25 or 125 is just repeating the halving, which can be
      folded into a single division by 4 or 8 instead of run one step at a
      time.
    worked: >
      $84\times5$: halve $84$ to $42$, append a zero: $420$. $945/5$: double
      $945$ to $1890$, drop a zero: $189$.
    interview: >
      Almost never asked in isolation — it shows up embedded in bigger
      products and percentage-of-a-number calculations, and as a building
      block other techniques elsewhere in this program lean on, so the
      expectation is that it's reflexive rather than a visible step.
    pitfalls: >
      Halving an odd number first when multiplying, which forces a fraction
      through the rest of the calculation — double the other factor instead,
      or halve second. Doubling instead of halving (or vice versa) when the
      operation is division instead of multiplication — the two operations
      use opposite orders for a reason.
    recap: >
      $5=10/2$, so trade a times-5 for a halving-plus-zero, and a divide-by-5
      for a doubling-plus-zero.
    dialogue:
      - part: Five cents a trade
        ask: >
          A market maker earns $5$ cents of edge on each of $468$ trades. How
          many cents of edge is that in total?
        expects: "2340"
        hint: >
          Any method for now. Count the carries if you multiply digit by digit.
        feedback: >
          $2340$. Digit by digit it is $5 \times 8 = 40$, then
          $5 \times 6 + 4 = 34$, then $5 \times 4 + 3 = 23$: three products,
          three carries.
      - reflect: >
          $468 \times 10 = 4680$ costs nothing: you append a zero. How is
          $468 \times 5$ related to that number, and what single operation
          gets you from one to the other?
        answer: >
          $5$ is half of $10$, so $468 \times 5$ is half of $468 \times 10$:
          half of $4680$ is $2340$. Equally, halve first and then append the
          zero: $234$ becomes $2340$. A multiplication by $5$ is really one
          halving and one free shift.
      - teach: >
          That is the five trick: $5 = 10/2$, so $\times 5$ is halve and append
          a zero, in whichever order keeps the numbers whole. Halving a
          three-digit number is one pass with almost no carrying.
      - ask: >
          Compute $732 \times 5$.
        expects: "3660"
        feedback: >
          Half of $732$ is $366$; append a zero: $3660$.
      - ask: >
          Compute $517 \times 5$. Which route is clean?
        choices:
          - text: >
              Halve to $258$ and append a zero: $2580$.
            feedback: >
              Half of $517$ is $258.5$, not $258$. Dropping the half loses
              $0.5 \times 10 = 5$; the product of an odd number and $5$ must
              end in $5$.
          - text: >
              Append the zero first, $5170$, then halve: $2585$.
            correct: true
            feedback: >
              Right. $5170$ is even, so the halving stays whole. For an odd
              number, shift first.
          - text: >
              Neither; the trick only works on even numbers.
            feedback: >
              The identity $n \times 5 = (n \times 10)/2$ holds for every
              number. Odd numbers only change which step you take first.
        feedback: >
          The two moves commute, so choose the order that avoids a fraction:
          halve first if even, shift first if odd.

      - part: Running it backwards
        ask: >
          At the end of another day the edge totals $3190$ cents, still at $5$
          cents a trade. To count the trades you divide by $5$, which is
          dividing by $10/2$. What pair of moves is that?
        choices:
          - text: >
              Halve, then drop a zero.
            feedback: >
              Halving and dividing by $10$ divides by $20$: you would get
              $159.5$ trades. Dividing by a half is doubling.
          - text: >
              Double, then drop a zero.
            correct: true
            feedback: >
              Right. Dividing by $10/2$ is multiplying by $2/10$: double, then
              shift the other way.
          - text: >
              Drop a zero, then halve.
            feedback: >
              Same mistake in the other order: $319 / 2 = 159.5$, which is
              $3190 / 20$. The direction of the halving flips with the
              direction of the operation.
        feedback: >
          Dividing by $5$ is doubling, then dropping a zero. Doubling is the cheapest
          operation there is.
      - ask: >
          So how many trades made $3190$ cents?
        expects: "638"
        feedback: >
          Double: $6380$. Drop the zero: $638$. Check: half of $6380$ is
          $3190$.
      - ask: >
          Compute $4215 / 5$.
        expects: "843"
        hint: >
          Double first.
        feedback: >
          $4215 \times 2 = 8430$, and $8430 / 10 = 843$.
      - ask: >
          For $4215 / 5$, why double first rather than drop the place value
          first?
        choices:
          - text: >
              Dividing by $10$ first gives $421.5$, so the doubling has to
              carry a decimal.
            correct: true
            feedback: >
              Right. It still works, $421.5 \times 2 = 843$, but doubling an
              integer can never create a fraction, so doubling first keeps
              every step whole.
          - text: >
              Dividing by $10$ first gives the wrong answer.
            feedback: >
              It gives the right answer, $421.5 \times 2 = 843$. The two steps
              commute; the order only decides whether you carry a decimal.
          - text: >
              Doubling first is needed only when the number is odd.
            feedback: >
              The issue is the last digit, not parity: any number not ending
              in $0$ turns into a decimal when divided by $10$. Doubling first
              avoids that for every integer.
        feedback: >
          The order rule is the same in both directions: do whichever step
          cannot make a fraction first.

      - part: The trick inside bigger products
        ask: >
          $15$ is $10 + 5$. Use that to compute $64 \times 15$.
        expects: "960"
        hint: >
          $64 \times 5$ is half of $64 \times 10$.
        feedback: >
          $640 + 320 = 960$: the $\times 5$ piece is just half of the
          $\times 10$ piece you already have.
      - ask: >
          $50$ is $100/2$. Compute $86 \times 50$.
        expects: "4300"
        feedback: >
          Half of $86$ is $43$; append two zeros: $4300$.
      - teach: >
          In an interview the five trick is rarely announced; it hides inside
          a $15\%$, a $\times 50$, or a division by $5$ in the middle of an expected
          value. The habit to build is seeing $5$ and hearing "half of ten"
          before you start multiplying.

  - node: quant-mental.arithmetic.twentyfive-halving-doubling
    hook: >
      25 is 5 squared, and its shortcut plus the general habit of trading
      factors by halving one and doubling the other are what keep an ugly
      multiplication from ever reaching a genuine multi-digit product.
    explanation: >
      $25=100/4$, so the times-25 shortcut is the $5=10/2$ substitution
      applied twice over: halving twice is dividing by 4, and multiplying by
      10 twice is
      appending two zeros — order them however keeps every intermediate step
      a whole number.

      The general habit behind it is that a product is unchanged by halving
      one factor while doubling the other, since $(a/2)(2b)=ab$ exactly. That
      means any awkward factor can be traded away: repeatedly halve the ugly
      side and double the other until one side lands on something round — a
      multiple of ten, or itself a small power of two you can multiply on
      sight.

      Picture the product as a rectangle of fixed area; halving one side and
      doubling the other reshapes the rectangle without changing how much
      area it covers, so you're free to slide the two dimensions toward
      whichever pair is easiest to read off. The times-25 shortcut is just
      the special case where you push straight for a factor of 100.

      Stop the moment one factor is already round — continuing to trade past
      that point only spends extra steps, and halving an odd number along the
      way introduces a fraction that then has to be carried through the rest
      of the calculation.
    worked: >
      $84\times25$: $84/4=21$, so $2100$. $18\times45$: halve $18$ to $9$,
      double $45$ to $90$: $9\times90=810$.
    interview: >
      Shows up as "times 25" fired directly, or as an oddly-paired
      multiplication (like $18\times45$) where the fast route is spotting a
      halving/doubling trade rather than multiplying as given — a strong
      answer states the trade out loud before the product.
    pitfalls: >
      Continuing to halve and double after one side is already round,
      wasting steps for no benefit. Halving an odd factor first, which forces
      a fraction through the rest of the trade — halve the even factor, or
      double first if both factors are odd.
    recap: >
      $\times25$ is $/4$ then two zeros; more generally, halve one factor and
      double the other until a side turns round.
    dialogue:
      - part: Twenty-five cents a contract
        ask: >
          A broker charges $25$ cents a contract and a client trades $76$
          contracts. How many cents is the commission?
        expects: "1900"
        hint: >
          Any method for now.
        feedback: >
          $1900$. Long-hand it is $76 \times 20 + 76 \times 5 = 1520 + 380$,
          two products and an addition with carries.
      - reflect: >
          You know $5$ is $10/2$. Write $25$ the same way, as a round number
          over a small one. What does that make $76 \times 25$, in one
          division and one shift?
        answer: >
          $25 = 100/4$, so $76 \times 25$ is a quarter of $7600$, or
          $76/4 = 19$ with two zeros appended: $1900$. Multiplying by $25$ is
          really one division by $4$ and one free shift.
      - teach: >
          That is the $25$ trick: divide by $4$, append two zeros, in whichever
          order keeps the numbers whole. Dividing by $4$ is just halving
          twice.
      - ask: >
          Compute $132 \times 25$.
        expects: "3300"
        feedback: >
          $132 / 4 = 33$, so $3300$.
      - ask: >
          Compute $27 \times 25$. $27$ is not a multiple of $4$. What happens?
        choices:
          - text: >
              The trick fails; multiply $27 \times 25$ long-hand.
            feedback: >
              $25 = 100/4$ for every number. Only the order changes: shift
              first, and $2700$ divides by $4$ cleanly.
          - text: >
              $2700 / 4 = 675$.
            correct: true
            feedback: >
              Right. Halve $2700$ to $1350$, halve again to $675$. Shift first
              when the number itself does not divide by $4$.
          - text: >
              $27 / 4$ is about $6$, so about $600$.
            feedback: >
              Rounding $6.75$ down to $6$ throws away $0.75 \times 100 = 75$.
              The trick is exact; there is no need to approximate.
        feedback: >
          As with the five trick, the two steps commute, and you choose the
          order that avoids a fraction.

      - part: Trading one factor for another
        ask: >
          Next on the sheet: $16 \times 55$. Compute it any way you like.
        expects: "880"
        feedback: >
          $880$. One route is $16 \times 55 = 800 + 80$; there is a faster
          one coming.
      - reflect: >
          Compare $16 \times 55$ with $8 \times 110$. Why must they be equal,
          and why is the second one easier?
        hint: >
          What happened to each factor?
        answer: >
          $16$ was halved and $55$ was doubled, and $(a/2)(2b) = ab$: the
          halving and the doubling cancel. The second is easier because $110$
          is round, so $8 \times 110$ is $88$ with a zero. Think of a
          rectangle of fixed area: you can make it half as wide and twice as
          tall.
      - teach: >
          That is halving and doubling: halve one factor and double the other,
          repeatedly, until one side is round, then stop. The $25$ trick is the
          special case where you push all the way to a factor of $100$.
      - ask: >
          Compute $14 \times 35$ with one trade.
        expects: "490"
        feedback: >
          Halve $14$, double $35$: $7 \times 70 = 490$.
      - ask: >
          Compute $64 \times 35$. Trade until one side is round.
        expects: "2240"
        feedback: >
          Halve $64$ to $32$ and double $35$ to $70$: $32 \times 70 = 2240$.
          One trade was enough; $70$ is already round.

      - part: Knowing when to stop
        ask: >
          From $7 \times 70$ a candidate keeps going: $3.5 \times 140$. Verdict?
        choices:
          - text: >
              Wrong: halving an odd number changes the product.
            feedback: >
              $3.5 \times 140$ is still $490$. Halving and doubling never
              changes the product, even through a fraction.
          - text: >
              Equal, and better, since $140$ is bigger and still round.
            feedback: >
              Bigger is not easier: $3.5 \times 140$ makes you carry a half,
              while $7 \times 70$ is a times table with a zero.
          - text: >
              Equal, but a wasted step: one side was already round.
            correct: true
            feedback: >
              Right. The trade is a means to a round factor. Once you have
              one, multiply.
        feedback: >
          Stop the moment one side is round, and halve the even factor, never
          the odd one, so no fraction ever appears.
      - ask: >
          One factor odd, one even: compute $15 \times 48$.
        expects: "720"
        hint: >
          Halve the even factor, double the odd one, until something is round.
        feedback: >
          Double the odd $15$ and halve the even $48$: $30 \times 24 = 720$.
          One trade made a round factor, so stop there.
      - teach: >
          In an interview, say the trade before the product: "Fifteen times
          forty-eight is thirty times twenty-four, seven hundred twenty." The
          listener hears that you reshaped the problem rather than ground
          through it.

  - node: quant-mental.arithmetic.fraction-decimal
    hook: >
      A percentage, odds ratio, or probability in an interview almost always
      reduces to a small-denominator fraction, and recalling its decimal cold
      is the difference between an instant answer and a slow long division
      mid-round.
    explanation: >
      Only a handful of small denominators — 6, 7, 8, 9, 11, 12, 16 — don't
      fall out instantly from halves, quarters, and fifths, and re-deriving
      each one by long division under a clock is exactly the slow path a
      timed round punishes. Memorizing one unit fraction per denominator pays
      for itself immediately, because every other numerator over that same
      denominator is one cheap step away, not a fresh division.

      Two moves generate the rest of a family from the single memorized unit
      fraction: multiply its digits by the new numerator
      ($2/11 = 2\times0.\overline{09} = 0.\overline{18}$), or, when the
      numerator sits close to the denominator, take the complement to 1
      instead ($5/6 = 1-1/6$).

      The sevenths cycle is worth understanding, not just memorizing: long
      division of $1$ by $7$ runs through the remainders $1,3,2,6,4,5$ before
      repeating, and each different numerator from 1 to 6 just enters that
      same six-step remainder cycle at a different point — which is exactly
      why every $k/7$'s decimal is some rotation of the same six digits,
      $142857$, rather than an unrelated string.

      Treat the whole table as instant recall, not computation: for these
      specific denominators, pulling the digits from memory should always
      beat both long division and any estimation shortcut. A fraction with a
      denominator outside this set falls to a different tool entirely.
    worked: >
      $5/6$ via the complement move: $1-1/6=1-0.1\overline{6}=0.8\overline{3}$.
    interview: >
      Tested either directly ("what's 3/7 as a decimal") or buried inside a
      bigger computation once a percentage or odds ratio simplifies to one of
      these fractions — the expected response time is under a second, with no
      visible division.
    pitfalls: >
      Mixing up which denominators terminate and which repeat — $1/8=0.125$
      stops, $1/6=0.1\overline{6}$ never does — and guessing the wrong one
      under pressure. Misplacing the overline's scope, putting it over only
      the first repeating digit instead of the whole repeating block.
    recap: >
      Memorize one unit fraction per small denominator, then generate every
      other numerator over it by multiplying digits or taking the complement
      to 1.
    dialogue:
      - part: Two wins in seven
        ask: >
          A strategy has won $2$ of its last $7$ trades. What is its win rate
          as a decimal, to four places?
        expects: "0.2857"
        tolerance: 0.00005
        hint: >
          Long division: $20$ sevens, then bring down a zero each time.
        feedback: >
          $20 / 7 = 2$ remainder $6$; $60 / 7 = 8$ remainder $4$;
          $40 / 7 = 5$ remainder $5$; $50 / 7 = 7$ remainder $1$. So
          $0.2857\ldots$, four divisions for four digits.
      - reflect: >
          You may know $1/7 = 0.\overline{142857}$. Your $2/7$ began
          $0.2857$, and if you keep dividing it continues $14$ and then
          repeats. Why should $2/7$ reuse the same six digits, only starting
          somewhere else?
        hint: >
          Track the remainders in the long division of $1$ by $7$.
        answer: >
          Dividing $1$ by $7$ passes through the remainders
          $1, 3, 2, 6, 4, 5$ and then returns to $1$, writing one digit at each.
          Dividing $2$ by $7$ just enters that same loop at remainder $2$, so it
          writes the same digits from that point on: $285714$. Every $k/7$ is
          the cycle $142857$ entered at remainder $k$.
      - teach: >
          So you never divide by $7$ again. Hold $1/7 = 0.\overline{142857}$,
          and place any $k/7$ by size: it is about $k \times 0.14$, so start the
          cycle at the digit that gives that size. The same economy runs the
          whole table: memorize one unit fraction per small denominator, and
          read every other numerator off it.
      - ask: >
          What is $5/7$ to four places?
        expects: "0.7143"
        tolerance: 0.00005
        hint: >
          $5/7$ is a little over $0.7$. Which digit of $142857$ is a $7$?
        feedback: >
          Start the cycle at the $7$: $0.714285\ldots$, which rounds to
          $0.7143$.
      - ask: >
          And $6/7$ to four places?
        expects: "0.8571"
        tolerance: 0.00005
        feedback: >
          About $0.86$, so start at the $8$: $0.857142\ldots$, or
          $1 - 1/7 = 1 - 0.142857\ldots$, giving $0.8571$.

      - part: The denominators that stop
        ask: >
          A book is hedged $3/8$ of the way. As an exact decimal?
        expects: "0.375"
        feedback: >
          $1/8 = 0.125$, so $3/8 = 0.375$.
      - ask: >
          And $3/16$, exactly?
        expects: "0.1875"
        hint: >
          Half of an eighth.
        feedback: >
          $1/16 = 0.0625$, and $3 \times 0.0625 = 0.1875$. Or half of
          $3/8 = 0.375$.
      - ask: >
          Which of these is a terminating decimal?
        choices:
          - text: >
              $1/12$
            feedback: >
              $12 = 4 \times 3$, and the factor $3$ never divides a power of
              ten: $1/12 = 0.08\overline{3}$ repeats.
          - text: >
              $7/40$
            correct: true
            feedback: >
              Right. $40 = 2^{3} \times 5$, so $7/40 = 175/1000 = 0.175$.
          - text: >
              $2/9$
            feedback: >
              Ninths repeat: $1/9 = 0.\overline{1}$, so $2/9 = 0.\overline{2}$.
          - text: >
              $5/11$
            feedback: >
              Elevenths repeat with period two: $1/11 = 0.\overline{09}$, so
              $5/11 = 0.\overline{45}$.
        feedback: >
          A reduced fraction terminates exactly when its denominator has no
          prime factors but $2$ and $5$. Eighths and sixteenths stop; sixths,
          sevenths, ninths, elevenths and twelfths do not.

      - part: Repeating blocks, read both ways
        ask: >
          What is $11/12$ to four places?
        expects: "0.9167"
        tolerance: 0.00005
        hint: >
          $11/12$ is one twelfth short of $1$.
        feedback: >
          $1 - 1/12 = 1 - 0.08\overline{3} = 0.91\overline{6}$, which rounds
          to $0.9167$.
      - ask: >
          How is $3/11$ written exactly?
        choices:
          - text: >
              $0.2\overline{7}$
            feedback: >
              That is $0.2777\ldots = 5/18$. The bar has to cover the whole
              repeating block, and for elevenths the block is two digits.
          - text: >
              $0.\overline{27}$
            correct: true
            feedback: >
              Right. $3 \times 0.\overline{09} = 0.\overline{27}$, that is
              $0.272727\ldots$
          - text: >
              $0.27$
            feedback: >
              $0.27 = 27/100$ terminates; $3/11$ cannot, since $11$ is neither
              $2$ nor $5$.
        feedback: >
          Multiply the unit fraction's block by the numerator, and keep the bar
          over the whole block.
      - ask: >
          A backtest prints a hit rate of $0.41666\ldots$. Which fraction is it?
        choices:
          - text: >
              $4/9$
            feedback: >
              $4/9 = 0.\overline{4}$, all fours. Ninths repeat a single digit.
          - text: >
              $5/11$
            feedback: >
              $5/11 = 0.\overline{45}$. Elevenths repeat in pairs, never a
              single trailing digit.
          - text: >
              $5/12$
            correct: true
            feedback: >
              Right. A single repeating $6$ or $3$ after a short prefix is the
              signature of a twelfth or a sixth, and
              $5/12 = 5 \times 0.08\overline{3} = 0.41\overline{6}$.
          - text: >
              $2/5$
            feedback: >
              $2/5 = 0.4$ exactly; it does not repeat at all.
        feedback: >
          Reading the table backwards is the half people skip. In an interview
          you should hear $0.41666$ and say "five twelfths" before writing
          anything.

  - node: quant-mental.arithmetic.percent-composition
    hook: >
      The "up X% then down X%, are you flat?" question is a trap built
      entirely on the instinct to add percentages, and multiplicative
      composition is the one-line fix that makes the trap disappear.
    explanation: >
      A $p\%$ change multiplies the current value by $(1+p/100)$ — not by
      $p/100$ added to something. Chaining two moves multiplies the two
      factors, $(1+p_{1}/100)(1+p_{2}/100)$, because the second percentage is
      measured against whatever the first move already produced, not against
      the original number. Adding the two percentages silently pretends both
      moves share the same base, which is exactly the assumption that's
      false.

      Picture each percent change as a scaling factor riding along a
      multiplication chain rather than a step along a number line.
      Multiplication commutes, so the order of the moves never changes the
      final factor — $+20\%$ then $-10\%$ lands on the same product as
      $-10\%$ then $+20\%$ — even though the path taken to get there differs.

      The same chain generalizes to any number of repeats: the same percent
      applied $n$ times compounds to $(1+p/100)^{n}$, a genuine power, not
      $n$ times the percent. That gap between the multiplicative answer and
      the naive additive one grows fast — it's already a few percent off
      after two or three repeats of an ordinary-sized move, and compounds
      further from there.
    worked: >
      $-30\%$ then $+40\%$: $0.7\times1.4=0.98$, a net $-2\%$ — not the
      $+10\%$ an additive guess would give.
    interview: >
      The canonical phrasing is "the stock drops 20% then rises 20%, are you
      back to even" or "three straight 10% gains, total return?" — expect an
      instant multiplicative answer, with the percent-to-factor conversion
      done in the same breath as the question.
    pitfalls: >
      Adding percentages instead of multiplying their factors — the single
      most common slip. Assuming any equal-and-opposite pair of percent moves
      must be a special case worth memorizing rather than just multiplying —
      most pairs are not flat, and the ones that are (reciprocal factors) are
      a coincidence of the specific numbers, not a shortcut to lean on
      generally.
    recap: >
      Chain percent changes by multiplying $(1+p/100)$ factors, never by
      adding the percentages.
    dialogue:
      - part: A fund that says it is up
        teach: >
          A fund returns $+50\%$ in its first year and $-40\%$ in its second.
          The marketing deck adds the two and advertises "up $10\%$ over two
          years". You put in $100$ million at the start.
      - ask: >
          How many millions do you hold after the two years?
        expects: "90"
        feedback: >
          Year one: $100 \times 1.5 = 150$. Year two loses $40\%$ of $150$,
          which is $60$, leaving $90$. You are down $10\%$, not up.
      - ask: >
          What exactly did the deck get wrong?
        choices:
          - text: >
              The two percentages should be averaged, not added: $+5\%$ a
              year.
            feedback: >
              Averaging inherits the same flaw as adding: it treats both
              percentages as if they were measured on the same $100$. You
              ended at $90$, so no average of $+50$ and $-40$ describes it.
          - text: >
              The $40\%$ loss was taken on $150$, not on the original $100$.
            correct: true
            feedback: >
              Right. The second percentage is measured against what the first
              move produced. Adding them pretends both share one base.
          - text: >
              The order: losing first and gaining second would have given
              $+10\%$.
            feedback: >
              Try it: $100 \times 0.6 = 60$, then $60 \times 1.5 = 90$. Same
              place. The order is not the problem.
        feedback: >
          Each percentage is a fraction of a different amount. That is why the
          two cannot simply be added.
      - reflect: >
          Write each year as one number you multiply your money by. What is
          the two-year number, and what rule for chaining percent moves does
          that suggest?
        answer: >
          A $+50\%$ year multiplies by $1.5$ and a $-40\%$ year by $0.6$, so
          two years multiply by $1.5 \times 0.6 = 0.9$, a net $-10\%$. The rule:
          turn every $p\%$ move into the factor $1 + p/100$ and multiply the
          factors. Because multiplication commutes, the order of the moves
          cannot matter, which is what your reversed-order check found.
      - teach: >
          That is multiplicative composition: a $p\%$ change is the factor
          $1 + p/100$, a chain of changes is the product of the factors, and
          only at the end do you convert back, net change $=$ factor $- 1$.

      - part: Chaining more than two
        ask: >
          A strategy gains $20\%$ in each of three straight years. What is its
          total return, in percent?
        expects: "72.8"
        hint: >
          $1.2^{2}$ first, then one more $\times 1.2$.
        feedback: >
          $1.2^{2} = 1.44$, and $1.44 \times 1.2 = 1.728$, a total of
          $+72.8\%$. The additive guess, $+60\%$, misses the growth earned on
          earlier growth.
      - ask: >
          A position falls $10\%$ and then rises $15\%$. Net change, in
          percent?
        expects: "3.5"
        feedback: >
          $0.9 \times 1.15 = 1.035$, so $+3.5\%$. Adding says $+5\%$.
      - ask: >
          Had it risen $15\%$ first and then fallen $10\%$, where would it
          end?
        choices:
          - text: >
              Lower: the $10\%$ loss bites a bigger number.
            feedback: >
              It does bite a bigger number, but the $15\%$ gain was also
              earned on a smaller one. The two effects cancel exactly:
              $1.15 \times 0.9 = 1.035$.
          - text: >
              In the same place, $+3.5\%$.
            correct: true
            feedback: >
              Right. $1.15 \times 0.9 = 0.9 \times 1.15$. The path differs,
              the endpoint does not.
          - text: >
              Higher: gaining first compounds the gain.
            feedback: >
              The final factor is a product, and products do not care about
              order. Both orders end at $1.035$.
        feedback: >
          Order changes the path, never the destination.

      - part: When adding is nearly right
        ask: >
          A position loses $3\%$ on Monday and gains $4\%$ on Tuesday. Net
          change, in percent?
        expects: "0.88"
        hint: >
          $0.97 \times 1.04$: take $0.97 \times 1 = 0.97$ and add
          $0.97 \times 0.04$.
        feedback: >
          $0.97 \times 1.04 = 0.97 + 0.0388 = 1.0088$, so $+0.88\%$. Adding
          says $+1\%$, only $0.12$ points off.
      - ask: >
          Adding was $0.12$ points off here but $20$ points off for the fund.
          What sets the size of the error?
        choices:
          - text: >
              Whether the moves have opposite signs.
            feedback: >
              Both cases mix a loss and a gain. Opposite signs set the
              direction of the error, not its size.
          - text: >
              The number of moves in the chain.
            feedback: >
              Both chains have exactly two moves. Length matters for longer
              chains, but it does not explain this gap.
          - text: >
              The product of the two moves, $p_{1} p_{2}/100$ points.
            correct: true
            feedback: >
              Right. $(1 + a)(1 + b) = 1 + a + b + ab$, and adding drops the
              $ab$. Here $ab = (-0.03)(0.04) = -0.0012$, a tenth of a point;
              for the fund $(0.5)(-0.4) = -0.2$, twenty points.
        feedback: >
          Adding percentages ignores one cross term. For daily moves of a few
          percent that is noise; for yearly moves of tens of percent it is
          the whole answer.
      - teach: >
          In the room, say the factors before the verdict: "One-point-five
          times point-six is point-nine, so down ten percent." The interviewer
          asking about the fund is waiting to see whether you add.

  - node: quant-mental.arithmetic.percent-quick-fractions
    hook: >
      Percent-of-a-number is the single most repeated call in a mental-math
      round, and building it from 10/5/1% blocks or a table fraction keeps
      every answer to a couple of easy additions instead of a decimal
      multiplication.
    explanation: >
      Chaining percent changes already established that a percent is nothing
      but a multiplicative factor; this technique is about choosing a cheap
      way to compute that factor instead of multiplying by a raw decimal.
      Three building blocks cost almost nothing: 10% is dividing by 10, 5% is
      half of that result, and 1% is dividing by 100 — none of the three is a
      genuine multiplication.

      Any other percentage is either a sum of those blocks
      ($17\%=10\%+5\%+2\%$) or, when it happens to match one of the memorized
      fluency-table entries, a direct division by that denominator instead — $16.\overline{6}\%$ of a number is exactly that number
      divided by 6, no blocks needed. Pick whichever route costs fewer steps
      for the specific target percentage: a percentage close to a table
      fraction wins by table lookup, an odd percentage like 17% or 23% wins
      by blocks.

      Treat the target percent as something to hit by stacking cheap pieces,
      in the same spirit as building a number from an anchor plus small
      offsets — 10%/5%/1% play the role of the easy steps, and you stop
      stacking the instant they sum to the target.
    worked: >
      $23\%$ of $340$: $10\%=34$, so $20\%=68$; three $1\%$-blocks of $3.4$
      give $10.2$; total $68+10.2=78.2$.
    interview: >
      Phrased as a rapid sequence of "what's X% of Y" — the tested skill is
      picking the fastest decomposition on sight, not the multiplication
      itself, and a strong answer states out loud which blocks or table
      fraction it's using.
    pitfalls: >
      Defaulting to multiplying by the raw decimal ($\times0.23$) instead of
      decomposing, which is both slower and easier to fumble under pressure.
      Picking blocks that don't actually sum to the target percentage — a
      common slip is using $20\%+5\%=25\%$ when the target was 23%.
    recap: >
      Build a percentage from cheap 10/5/1% blocks, or read it off the
      fluency table when it matches a memorized denominator.
    dialogue:
      - part: A fee on a profit
        ask: >
          A manager charges a $15\%$ performance fee on a profit of $380$
          thousand. How many thousand is the fee?
        expects: "57"
        hint: >
          Any route for now.
        feedback: >
          $57$. As a decimal product, $0.15 \times 380$ is
          $0.1 \times 380 + 0.05 \times 380$; if you did it digit by digit,
          you multiplied when you did not need to.
      - reflect: >
          Some percentages of $380$ you can write down without multiplying at
          all. Which ones, and how would you assemble $15\%$ out of them?
        answer: >
          $10\%$ is a shift of the decimal point, $38$. $5\%$ is half of that,
          $19$. $1\%$ is a shift by two places, $3.8$. Then
          $15\% = 10\% + 5\% = 38 + 19 = 57$: one shift, one halving, one
          addition.
      - teach: >
          Those are the blocks: $10\%$ by shifting, $5\%$ by halving the
          $10\%$, $1\%$ by shifting twice. Any percentage is a short sum, or
          difference, of blocks, and none of them is a real multiplication.
      - ask: >
          What is $27\%$ of $440$?
        expects: "118.8"
        hint: >
          $27\% = 25\% + 2\%$, or $20\% + 5\% + 2\%$.
        feedback: >
          $10\% = 44$, so $20\% = 88$; $5\% = 22$; $1\% = 4.4$, so
          $2\% = 8.8$. Total $88 + 22 + 8.8 = 118.8$.
      - ask: >
          For $29\%$ of $300$, which decomposition is cheapest?
        choices:
          - text: >
              $25\% + 5\%$
            feedback: >
              That sums to $30\%$, not $29\%$. Blocks that miss the target by a
              point give an answer off by $1\%$ of the base, here $3$.
          - text: >
              $30\% - 1\%$
            correct: true
            feedback: >
              Right: $90 - 3 = 87$. A target just below a round block is
              cheaper from above.
          - text: >
              $10\% + 10\% + 5\% + 1\% + 1\% + 1\% + 1\%$
            feedback: >
              Correct, $87$, but seven pieces. Same complement idea as rounding
              $297$ to $300$: overshoot and subtract.
        feedback: >
          Choose the fewest blocks, and remember subtraction is allowed.

      - part: Percentages that are fractions
        ask: >
          The firm also takes $12.5\%$ of a desk's $720$ thousand profit. How
          many thousand?
        expects: "90"
        feedback: >
          $90$. With blocks: $10\% = 72$ and $2.5\% = 18$, half of $5\% = 36$.
          Three blocks for one answer.
      - reflect: >
          Your fraction table has $1/8 = 0.125$. What does that say about
          $12.5\%$ of $720$, and which other percentages could you treat the
          same way?
        answer: >
          $12.5\% = 1/8$, so it is one division: $720/8 = 90$. Any percentage
          that is a table entry works the same way: $25\% = 1/4$,
          $16.\overline{6}\% = 1/6$, $8.\overline{3}\% = 1/12$,
          $33.\overline{3}\% = 1/3$, and their multiples like
          $83.\overline{3}\% = 5/6$.
      - teach: >
          So there are two routes. If the percentage is a table fraction,
          divide by its denominator; if it is an odd number like $27\%$, build
          it from blocks. Picking the route on sight is most of the skill.
      - ask: >
          What is $8.\overline{3}\%$ of $156$?
        expects: "13"
        feedback: >
          $8.\overline{3}\% = 1/12$, and $156/12 = 13$.
      - ask: >
          What is $83.\overline{3}\%$ of $222$?
        expects: "185"
        hint: >
          It is a whole number of sixths.
        feedback: >
          $83.\overline{3}\% = 5/6$. Divide first, $222/6 = 37$, then
          $5 \times 37 = 185$.

      - part: Near a table entry is not on it
        ask: >
          What is $33\%$ of $900$?
        choices:
          - text: >
              $300$, since $33\%$ is a third.
            feedback: >
              A third is $33.\overline{3}\%$. The missing $0.\overline{3}\%$ of
              $900$ is $3$, so a third overshoots.
          - text: >
              $297$
            correct: true
            feedback: >
              Right. $30\% + 3\% = 270 + 27 = 297$, or a third minus
              $0.\overline{3}\%$: $300 - 3$.
          - text: >
              $330$
            feedback: >
              That is $33\%$ of $1000$. Of $900$ it must be less: $10\% = 90$,
              so $33\% = 3.3 \times 90 = 297$.
        feedback: >
          Use the table only when the percentage matches exactly, or correct
          for the difference with a block.
      - teach: >
          Said aloud: "Twenty-seven percent of four-forty: twenty percent is
          eighty-eight, five is twenty-two, two is eight-point-eight, so
          one-eighteen-point-eight." Name the blocks as you add them, so a
          slip is audible.

  - node: quant-mental.arithmetic.weighted-average
    hook: >
      Blending two groups by weight comes up constantly as a mental-math
      sub-step, and anchoring on one value and moving a weight-fraction of the
      gap answers it in one line without ever writing out the full
      weighted-sum formula.
    explanation: >
      Start from the definitional weighted mean,
      $\bar v=(w_{1}v_{1}+w_{2}v_{2})/(w_{1}+w_{2})$, and subtract $v_{1}$
      from both sides: the numerator becomes
      $w_{2}v_{2}-w_{2}v_{1}=w_{2}(v_{2}-v_{1})$, so
      $\bar v-v_{1}=\dfrac{w_{2}(v_{2}-v_{1})}{w_{1}+w_{2}}$. Rearranged,
      $\bar v = v_{1}+\dfrac{w_{2}}{w_{1}+w_{2}}(v_{2}-v_{1})$ — the average
      is $v_{1}$ plus some fraction of the gap to $v_{2}$, and that fraction
      is exactly $w_{2}$'s share of the total weight.

      That fraction-of-the-gap step is the same move as computing a
      percentage of a number, just applied to the distance $v_{2}-v_{1}$
      instead of to a headline total — the weight fraction plays the role of
      the percent, and the gap plays the role of the number it's a percent
      of.

      Picture the two values as endpoints of a segment and the weights as how
      strongly each end pulls: the heavier side pulls the average closer to
      itself, and the weight fraction $w_{2}/(w_{1}+w_{2})$ says exactly how
      far along the segment, from $v_{1}$ toward $v_{2}$, that pull lands.
      Anchoring on whichever value has the simpler round number to start from
      usually costs the least arithmetic.
    worked: >
      $40$ units at $50$ blended with $60$ units at $70$: anchor at $50$,
      weight fraction $60/100=60\%$ of the gap $20$, giving $50+12=62$ —
      matching $(40\cdot50+60\cdot70)/100=62$ with far less arithmetic.
    interview: >
      Comes up as a portfolio-blend, average-price, or two-group mixing
      question — the tested skill is anchoring and moving a fraction of the
      gap instead of laying out the full weighted-sum formula, markedly
      faster whenever there are only two groups.
    pitfalls: >
      Computing the weight fraction with the wrong denominator — it's always
      the weight of the far side over the total of both weights, not over the
      near side. Anchoring on one value but then adding the gap in the wrong
      direction when the far value is smaller than the anchor — the gap
      $v_{2}-v_{1}$ is signed, and it stays signed all the way through.
    recap: >
      Anchor on one value and add a weight-fraction of the gap to the other —
      $\bar v=v_{1}+\frac{w_{2}}{w_{1}+w_{2}}(v_{2}-v_{1})$.
    dialogue:
      - part: Two fills and one average price
        teach: >
          You buy $200$ shares at $64$ and then $600$ more at $68$. The risk
          system wants your average price per share, and it wants it now.
      - ask: >
          Before computing anything: where does the average sit?
        choices:
          - text: >
              At $66$, halfway between the two prices.
            feedback: >
              Halfway would be right if you bought equal amounts. You bought
              three times as many at $68$, so those shares pull harder.
          - text: >
              Closer to $64$, since that was the first fill.
            feedback: >
              The order of the fills is irrelevant to the average. Only how
              many shares went at each price matters.
          - text: >
              Closer to $68$, since most shares were bought there.
            correct: true
            feedback: >
              Right. Three quarters of the shares carry the $68$, so the
              average leans hard toward it.
        feedback: >
          The heavier side pulls the average toward itself. The question is
          how far.
      - ask: >
          Compute the average price exactly.
        expects: "67"
        hint: >
          Total cost over total shares.
        feedback: >
          $(200 \times 64 + 600 \times 68)/800 = (12800 + 40800)/800
          = 53600/800 = 67$. Two products, a sum and a division, to land on a
          number that is plainly near $68$.
      - reflect: >
          $67$ is $3$ of the way along the gap of $4$ from $64$ toward $68$.
          What fraction of the gap is that, and where in the problem does that
          fraction come from?
        hint: >
          Compare it with the share counts.
        answer: >
          $3/4$ of the gap, and $3/4$ is $600/800$: the far price's share of
          the total weight. So you could have skipped the products entirely:
          start at $64$ and walk $3/4$ of the way to $68$, which is $3$, giving
          $67$.
      - teach: >
          That is the anchor-and-gap form of a weighted average:
          $\bar{v} = v_{1} + \dfrac{w_{2}}{w_{1}+w_{2}}(v_{2} - v_{1})$. Anchor
          at one value, take the *other* side's weight over the total, and move
          that fraction of the signed gap. It falls straight out of
          subtracting $v_{1}$ from the usual weighted sum.

      - part: Anchoring and walking the gap
        ask: >
          A plant ships $800$ units from a line with a $2\%$ defect rate and
          $200$ from a line with a $7\%$ defect rate. What is the combined
          defect rate, in percent?
        expects: "3"
        hint: >
          Anchor at $2$. What share of the units came from the other line?
        feedback: >
          The far side carries $200/1000 = 1/5$ of the weight, and the gap is
          $5$ points, so $2 + 5/5 = 3\%$. Check: $16 + 14 = 30$ defects in
          $1000$ units.
      - ask: >
          Now anchor at the higher rate, $7\%$, instead. What do you do?
        choices:
          - text: >
              Add $4/5$ of the gap of $5$: $7 + 4 = 11\%$.
            feedback: >
              $11\%$ is above both lines, which no average can be. Walking from
              $7$ toward $2$ is walking down: the signed gap is
              $2 - 7 = -5$.
          - text: >
              Subtract $1/5$ of the gap: $7 - 1 = 6\%$.
            feedback: >
              $1/5$ is the anchor's own weight. The fraction you move is the
              *far* side's share, and from $7$ the far side is the $800$ units
              at $2\%$.
          - text: >
              Subtract $4/5$ of the gap: $7 - 4 = 3\%$.
            correct: true
            feedback: >
              Right. From either end you land on $3\%$, as you must. The far
              side's weight is $800/1000$, and the gap points down.
        feedback: >
          Either anchor works. Take the far side's weight share, keep the gap
          signed, and check that the answer lies between the two values.

      - part: More groups, and the wrong weights
        ask: >
          Back to the shares: you were long $800$ at an average of $67$. You
          buy $200$ more at $72$. New average price?
        expects: "68"
        hint: >
          Treat the first $800$ as one group at $67$.
        feedback: >
          The new fill is $200/1000 = 1/5$ of the weight, and the gap is $5$,
          so $67 + 1 = 68$. Any number of groups can be folded in one at a
          time this way.
      - ask: >
          A cyclist climbs $30$ kilometres at $10$ kilometres per hour and
          descends the same $30$ at $30$. Equal distances, so is the average
          speed the equal-weight average, $20$?
        choices:
          - text: >
              Yes: the two legs are the same length, so they carry equal
              weight.
            feedback: >
              Speed is distance per hour, so its weights must be hours. The
              climb takes $3$ hours and the descent $1$. Total: $60$
              kilometres in $4$ hours, $15$ kilometres per hour.
          - text: >
              No: weight each speed by the time spent at it, giving $15$.
            correct: true
            feedback: >
              Right. Anchor at $10$: the descent has $1/4$ of the time, and
              the gap is $20$, so $10 + 5 = 15$.
          - text: >
              No: weight each speed by itself, since faster legs count more.
            feedback: >
              Weighting by speed would push the average up, toward $30$. The
              true answer, $60$ kilometres over $4$ hours, is $15$, below the
              midpoint.
        feedback: >
          The weights must be the units the average is "per". Average price
          per share weights by shares; average speed weights by hours.
      - ask: >
          A courier rides $40$ miles at $20$ miles per hour and then $40$ miles
          at $80$. Average speed?
        expects: "32"
        hint: >
          Find the hours on each leg first.
        feedback: >
          The legs take $2$ hours and $0.5$ hours. Anchor at $20$: the fast leg
          has $0.5/2.5 = 1/5$ of the time and the gap is $60$, so
          $20 + 12 = 32$. Check: $80$ miles in $2.5$ hours.
      - teach: >
          In an interview, say the anchor, the fraction and the gap: "Start at
          sixty-four, three quarters of the way to sixty-eight, sixty-seven."
          The full weighted-sum formula is the slow way to the same number.

  - node: quant-mental.arithmetic.divisibility-3-9
    hook: >
      Knowing on sight whether a number is a multiple of 3 or 9 turns a
      division you'd otherwise have to attempt into a one-line digit sum,
      useful the instant a mental-math problem needs to know if a total
      simplifies cleanly.
    explanation: >
      The round-number reasoning behind complements extends directly into a
      congruence: since $10\equiv1\pmod9$ (and also $\pmod3$), every place
      value $10^{k}\equiv1$ too, so a number's remainder when divided by 9 —
      or by 3 — equals the sum of its digits' remainders. Each digit
      contributes only its own face value, completely independent of which
      place it sits in.

      Think of "carrying" ten units from one place into the next as
      genuinely free in this arithmetic: ten units in one place is worth
      exactly one unit in the next, because $10\equiv1$, so spreading a fixed
      total across more or fewer digits never changes its remainder mod 9 or
      mod 3 — only the actual digits do.

      The procedure is just: sum the digits, and if that sum is still
      multi-digit, sum its digits again, repeating until one digit remains.
      That final digit is $9$ exactly when the original number is a multiple
      of 9, and is $3$, $6$, or $9$ exactly when it's a multiple of 3.
    worked: >
      $5{,}823$: digit sum $5+8+2+3=18$; $18$'s own digit sum is $9$, so
      $5823$ is divisible by both 9 and 3 — confirmed by $5823=9\times647$.
    interview: >
      Used as a one-second pre-check before attempting a real division, or to
      sanity-check that a computed total is plausible — expect it deployed
      silently as a sub-step of a bigger problem more often than asked about
      directly.
    pitfalls: >
      Stopping after one digit sum when that sum is still two digits — the
      test needs a single final digit, not just "a smaller number." Extending
      the same digit-sum test to unrelated divisors like 6 or 12 — it only
      certifies the factor-of-3 part; a factor of 2 or 4 still needs its own
      separate check.
    recap: >
      A number's digit sum, reduced repeatedly to one digit, reveals
      divisibility by 3 (digit is 3, 6, or 9) and by 9 (digit is exactly 9).
    dialogue:
      - part: Nine accounts, one block of shares
        teach: >
          A block of $5{,}166$ shares has to be split equally across $9$
          client accounts, and compliance will not allow an odd lot left
          over. The portfolio manager wants to know whether the split is clean
          before the order goes out.
      - ask: >
          Divide it out: how many shares does each account get?
        expects: "574"
        hint: >
          Take out $9 \times 500$ first, then see what is left.
        feedback: >
          $9 \times 500 = 4500$ leaves $666$, and $666 = 9 \times 74$, so
          each account gets $574$ with nothing over. It works, but it took two
          partial divisions and a subtraction to find out a yes or a no.
      - ask: >
          For $10$ you never divide: the last digit decides. Is there a fixed
          block of trailing digits that decides divisibility by $9$ the same
          way?
        choices:
          - text: >
              Yes, the last digit: a multiple of $9$ ends in $9$, $8$, $7$
              and so on in a pattern.
            feedback: >
              $18$ and $28$ both end in $8$; one is a multiple of $9$ and the
              other is not. Multiples of $9$ end in every digit, so the last
              digit says nothing.
          - text: >
              Yes, the last two digits, since $100$ is only $1$ past a
              multiple of $9$.
            feedback: >
              $117 = 9 \times 13$, but $217$ ends in the same $17$ and leaves
              a remainder of $1$. The hundreds digit changes the answer, so two
              digits are not enough.
          - text: >
              No: no power of $10$ is a multiple of $9$, so every column can
              change the answer.
            correct: true
            feedback: >
              Right. A trailing-digits test needs the part you throw away to be
              a multiple of the divisor, and $10$, $100$, $1000$ never are. For
              $9$ the whole number has to be read.
        feedback: >
          The last-digit test for $10$ works because everything to its left is
          a multiple of $10$. For $9$ nothing on the left drops out, so a
          different trick is needed: one that uses every digit cheaply.
      - reflect: >
          Write $5166 = 5 \times 1000 + 1 \times 100 + 6 \times 10 + 6$. Each
          of $1000$, $100$, $10$ is one more than a multiple of $9$. After you
          take every multiple of $9$ out of each piece, what is left of the
          whole number, and what does that say about $5166$?
        hint: >
          $5 \times 1000 = 5 \times 999 + 5$.
        answer: >
          Each piece leaves exactly its digit: $5 \times 1000 = 5 \times 999
          + 5$, $1 \times 100 = 1 \times 99 + 1$, $6 \times 10 = 6 \times 9 +
          6$, and the units digit is itself. What is left is $5 + 1 + 6 + 6 =
          18$, the digit sum. Since $18$ is a multiple of $9$, so is $5166$.
          The column a digit sits in stops mattering.

      - part: Every column is worth one
        teach: >
          That is the digit-sum test. Because $10 = 9 + 1$, every power of
          ten is one more than a multiple of $9$: $10^{k} \equiv 1 \pmod 9$.
          So a number and the sum of its digits leave the same remainder on
          division by $9$, and a number is divisible by $9$ exactly when its
          digit sum is. If the sum is still large, sum its digits again; the
          remainder survives every round.
      - ask: >
          The same digit sum also decides divisibility by $3$. Why?
        choices:
          - text: >
              Because $3$ divides $10$, so the columns drop out.
            feedback: >
              $10 = 3 \times 3 + 1$, so $3$ does not divide $10$. If it did,
              the last digit alone would decide, as it does for $2$ and $5$.
          - text: >
              Because $9$, $99$, $999$ are multiples of $9$ and so of $3$; the
              leftover argument runs unchanged.
            correct: true
            feedback: >
              Right. The only fact used was that $10^{k} - 1$ is a multiple of
              the divisor, and anything $9$ divides, $3$ divides too.
          - text: >
              It does not in general; it only works for $3$ on numbers below
              $100$.
            feedback: >
              $1113$ has digit sum $6$ and is $3 \times 371$. The argument
              never used the length of the number, so it holds for every
              length.
        feedback: >
          One digit sum answers two questions. A sum that is a multiple of $9$
          means divisible by $9$ and $3$; a multiple of $3$ that is not of $9$
          means divisible by $3$ only.
      - ask: >
          A second block, $47{,}382$ shares, goes across the same $9$
          accounts. How many shares are left over?
        expects: "6"
        hint: >
          The leftover is the remainder of the digit sum on division by $9$.
        feedback: >
          $4 + 7 + 3 + 8 + 2 = 24$, and $24 = 18 + 6$, so $6$ shares are left
          over. Check: $9 \times 5264 = 47376$, and $47382 - 47376 = 6$.
      - ask: >
          The same $47{,}382$ shares across $3$ accounts instead. How many are
          left over now?
        expects: "0"
        hint: >
          You already know the remainder on division by $9$.
        feedback: >
          The remainder by $9$ is $6$, and $6$ is a multiple of $3$, so the
          remainder by $3$ is $0$: $47382 = 3 \times 15794$. The digit sum
          $24$ says the same thing directly.

      - part: What the digit sum cannot tell you
        ask: >
          You know $5166$ splits cleanly across $9$ accounts. Without dividing,
          which of these does too?
        choices:
          - text: >
              $5176$
            feedback: >
              One more ten adds $1$ to the digit sum: $19$, which leaves
              remainder $1$. Ten shares is one share more than a multiple of
              $9$.
          - text: >
              $5169$
            feedback: >
              Digit sum $21$: a multiple of $3$, not of $9$. It splits across
              $3$ accounts, not $9$.
          - text: >
              $6615$
            correct: true
            feedback: >
              Same four digits, reordered, so the same digit sum $18$:
              $6615 = 9 \times 735$. Any rearrangement of a multiple of $9$ is
              a multiple of $9$.
          - text: >
              $5106$
            feedback: >
              Digit sum $12$: the $6$ tens became $0$ tens, removing $60$,
              which is not a multiple of $9$.
        feedback: >
          The test sees only which digits appear, never their order. That is
          its strength here, and later it is the blind spot of every check
          built on it.
      - ask: >
          The digits of $1899$ sum to $27$. A colleague concludes it splits
          evenly across $27$ accounts. Verdict?
        choices:
          - text: >
              Correct: the digit sum carries divisibility to any multiple of
              $9$.
            feedback: >
              $27 \times 70 = 1890$, so $1899$ leaves a remainder of $9$. The
              rule rests on $10$ being one more than a multiple of the divisor,
              and $10$ is not one more than a multiple of $27$.
          - text: >
              Wrong: the test proves $1899$ is a multiple of $9$, and says
              nothing about $27$.
            correct: true
            feedback: >
              Right. $1899 = 9 \times 211$, and $211$ is not a multiple of $3$.
              The digit sum works for exactly the divisors of $9$, because only
              for those is $10 \equiv 1$.
          - text: >
              Wrong: $1899$ is not even a multiple of $9$, since it ends in
              $9$ and is odd.
            feedback: >
              Parity has nothing to do with $9$; $81$ and $99$ are odd
              multiples of $9$. The digit sum $27$ does prove $1899$ divisible
              by $9$.
        feedback: >
          The digit sum decides $3$ and $9$ and nothing larger. A digit sum of
          $27$ is still only a certificate for $9$.
      - ask: >
          The digits of $5271$ sum to $15$. Does $5271$ split evenly across $6$
          accounts?
        choices:
          - text: >
              Yes: $15$ is a multiple of $3$, and $6$ is just $2 \times 3$.
            feedback: >
              The digit sum certifies only the factor $3$. $6$ also needs a
              factor $2$, and $5271$ is odd: $5271 = 6 \times 878 + 3$.
          - text: >
              No: $5271$ is a multiple of $3$ but is odd, so it fails the
              factor $2$.
            correct: true
            feedback: >
              Right. For $6$, run two tests: digit sum for the $3$, last digit
              for the $2$. $5271 = 3 \times 1757$ and stops there.
          - text: >
              No: a digit sum of $15$ is not a multiple of $6$.
            feedback: >
              The right verdict for the wrong reason. The digit sum of a
              multiple of $6$ need not be a multiple of $6$: $12$ has digit
              sum $3$. Divisibility by $6$ is the $3$-test plus an even last
              digit.
        feedback: >
          Split a composite divisor into pieces that have their own tests and
          run each one. The digit sum handles the $3$s and $9$s and nothing
          else.
      - teach: >
          Out loud it takes one breath: "five plus one plus six plus six is
          eighteen, a multiple of nine, so it splits nine ways, five hundred
          seventy-four each." The digit sum says yes or no before you divide;
          the division is only for the size of each piece.

  - node: quant-mental.arithmetic.divisibility-4-8
    hook: >
      Whether a number carries an extra factor of 4 or 8 is decided entirely
      by its last two or three digits, letting you skip straight past however
      many digits sit to the left without a second look.
    explanation: >
      The same round-number decomposition behind complements answers this
      directly: $100$ is a multiple of 4, and $1000$ is a multiple of 8, so
      any number splits as (a multiple of 100, or of 1000) plus (its last two,
      or last three, digits). The leading chunk is automatically divisible by
      4 or 8 and contributes nothing to the remainder — only the tail
      matters.

      That means the test never looks past the last two digits for
      divisibility by 4, or past the last three for divisibility by 8, no
      matter how many digits sit to the left of them. A ten-digit number is
      exactly as fast to check as a three-digit one.

      Read both tests off the same digits in one glance: check the last two
      digits against 4 first, then look one digit further left and check the
      last three against 8 — the second check is strictly more informative,
      but running the cheaper one first is often enough if the question only
      needs to know about factors of 4.

      The mental model worth keeping is that everything left of the tail is
      genuinely invisible to these two tests — there's no partial
      contribution from the leading digits, unlike divisibility by 3 or 9,
      where every digit counts.
    worked: >
      $9{,}032$: last two digits $32=4\times8$, divisible by 4; last three
      digits $032=32$, also divisible by 8 — so $9032$ passes both. Contrast
      $9{,}036$: last two digits $36=4\times9$ pass the 4-test, but last three
      digits $036=36$ are not a multiple of 8 ($36/8=4.5$), so $9036$ is
      divisible by 4 only.
    interview: >
      Comes up when quickly factoring a suspiciously round total, or checking
      how many factors of 2 a number carries before simplifying a ratio — a
      fast answer reads both the 4-test and 8-test off the same digits
      without a second look at the number.
    pitfalls: >
      Checking only two digits when the question specifically asks about 8 —
      that test needs three. Wasting time re-scanning digits far to the left
      of the tail, when nothing there can change either answer.
    recap: >
      Only the last two digits decide divisibility by 4, and only the last
      three decide divisibility by 8 — everything further left is
      irrelevant.
    dialogue:
      - part: An order the router might bounce
        teach: >
          A client sends an order for $31{,}736$ contracts. The exchange takes
          this product only in lots of $4$, and the router rejects any size
          that is not a whole number of lots. You have a few seconds to say
          whether it goes through.
      - ask: >
          Settle it the slow way. How many lots of $4$ is $31{,}736$?
        expects: "7934"
        hint: >
          Dividing by $4$ is halving twice.
        feedback: >
          Half of $31736$ is $15868$, and half again is $7934$, a whole number,
          so the order goes through as $7934$ lots. Two passes over a
          five-digit number to get one yes or no.
      - ask: >
          For divisibility by $2$ the last digit decides. Does the last digit
          decide divisibility by $4$ as well?
        choices:
          - text: >
              Yes: an even last digit is enough.
            feedback: >
              $26$ ends in an even digit and is $4 \times 6 + 2$. Even only
              gives one factor of $2$; $4$ needs two.
          - text: >
              No: $16$ and $26$ end in the same digit, and only $16$ is a
              multiple of $4$.
            correct: true
            feedback: >
              Right. The tens digit changes the answer, because $10$ itself is
              not a multiple of $4$: each ten carries a leftover of $2$.
          - text: >
              Yes: a multiple of $4$ always ends in $0$, $4$ or $8$.
            feedback: >
              $16$, $32$ and $56$ are all multiples of $4$. Multiples of $4$
              end in any even digit, so the last digit cannot sort them.
        feedback: >
          One digit is too few for $4$. The question is how many it takes, and
          why any digits at all can be ignored.
      - reflect: >
          Split the order as $31{,}736 = 31{,}700 + 36$. What can you say about
          $31{,}700$ on division by $4$ without dividing, and so what is left to
          check?
        hint: >
          $31700 = 317 \times 100$. What is $100$ divided by $4$?
        answer: >
          $100 = 4 \times 25$, so $317$ hundreds is $317 \times 25$ lots of
          $4$ with nothing over. Every digit from the hundreds leftward sits on
          a multiple of $100$ and drops out. All that remains is $36 = 4 \times
          9$, so the order is a whole number of lots, and the check took one
          glance at two digits.

      - part: The tail decides
        teach: >
          That is the trailing-digits test. Any number is a multiple of $100$
          plus its last two digits, and $100$ is a multiple of $4$, so a number
          is divisible by $4$ exactly when its last two digits are, and it
          leaves the same remainder. The digits to the left are invisible, no
          matter how many there are.
      - ask: >
          The exchange changes the lot size to $8$. Are the last two digits
          still enough?
        choices:
          - text: >
              Yes: whatever works for $4$ works for $8$, which is $4 \times 2$.
            feedback: >
              $136 = 8 \times 17$, while $236 = 8 \times 29 + 4$. Same last two
              digits, different answers, because $100 = 8 \times 12 + 4$ is not
              a multiple of $8$.
          - text: >
              No: you need the last three, because $1000 = 8 \times 125$.
            correct: true
            feedback: >
              Right. The cut has to fall at a power of ten the divisor goes
              into. $100$ is the first for $4$, and $1000$ is the first for
              $8$.
          - text: >
              No: for $8$ you need the whole number, since $8$ does not divide
              any power of $10$.
            feedback: >
              $1000 = 8 \times 125$, so it does. Everything from the thousands
              leftward is a whole number of $8$s and drops out.
        feedback: >
          Two digits for $4$, three for $8$: the tail is as long as the first
          power of ten the divisor divides.
      - ask: >
          So for lots of $8$, only the $736$ at the end of $31{,}736$ matters.
          How many lots of $8$ is $736$?
        expects: "92"
        hint: >
          Halve three times.
        feedback: >
          $736 \to 368 \to 184 \to 92$, a whole number, so $31736$ is a whole
          number of $8$-lots too. The thousands contribute $31 \times 125$ more
          lots, which you never needed to know.
      - ask: >
          Next order: $49{,}324$ contracts, lots of $8$. How many contracts
          must be trimmed to leave a whole number of lots?
        expects: "4"
        hint: >
          Only the last three digits matter. Find the nearest multiple of $8$
          below them.
        feedback: >
          The tail is $324$, and $8 \times 40 = 320$, so $4$ contracts are
          over: trim to $49320 = 8 \times 6165$. Notice the last two digits,
          $24$, pass the $4$-test: this order is fine in lots of $4$ and fails
          in lots of $8$.

      - part: Cutting the tail at the wrong place
        ask: >
          A colleague clears an order for $3{,}148$ contracts in lots of $8$,
          reasoning that $48 = 8 \times 6$. Verdict?
        choices:
          - text: >
              Fine: $48$ is a multiple of $8$, so $3148$ is.
            feedback: >
              The hundreds digit was thrown away, and $100$ is not a multiple
              of $8$: the $1$ hundred carries a leftover of $4$. The tail is
              $148 = 8 \times 18 + 4$, so $4$ contracts are over.
          - text: >
              Fine: $3148$ is a multiple of $4$ ending in $8$, and those are
              multiples of $8$.
            feedback: >
              $28$ is a multiple of $4$ ending in $8$, and $28 = 8 \times 3 +
              4$. Passing the $4$-test says nothing about the third factor of
              $2$; only the three-digit tail $148$ can.
          - text: >
              Wrong: the test for $8$ needs $148$, which leaves $4$.
            correct: true
            feedback: >
              Right. Two digits answered the $4$-question, and $3148 = 4 \times
              787$ is fine in lots of $4$. For $8$ the cut falls one digit
              further left.
        feedback: >
          The commonest slip with this test is the right idea at the wrong
          length. Two digits for $4$, three for $8$, and say which one you are
          running.
      - ask: >
          The same reasoning extends to $16$. How many trailing digits decide
          divisibility by $16$?
        expects: "4"
        hint: >
          Find the first power of ten that $16$ divides.
        feedback: >
          $1000 = 16 \times 62.5$ is not a multiple, but $10000 = 16 \times
          625$ is, so the last four digits decide. In general $10^{k} = 2^{k}
          5^{k}$, so the last $k$ digits decide divisibility by $2^{k}$.
      - ask: >
          Does some fixed tail decide divisibility by $6$?
        choices:
          - text: >
              Yes, the last digit, as for $2$.
            feedback: >
              $16$ and $36$ both end in $6$; only $36$ is a multiple of $6$.
              The last digit sees only the factor $2$.
          - text: >
              Yes, the last two digits, since $6$ is smaller than $8$.
            feedback: >
              $136$ and $336$ share the tail $36$, yet $136 = 6 \times 22 + 4$
              and $336 = 6 \times 56$. Size is not what matters; $6$ divides no
              power of ten.
          - text: >
              No: $6$ has a factor $3$, and no power of $10$ is a multiple of
              $3$.
            correct: true
            feedback: >
              Right. A tail test exists only when the divisor goes into some
              $10^{k}$, which means it is built from $2$s and $5$s alone. For
              $6$, test the factor $2$ on the last digit and the factor $3$
              another way.
        feedback: >
          Trailing digits work for $2$, $4$, $8$, $16$ and for $5$, $25$,
          $125$: exactly the divisors of powers of ten. Any other prime factor
          reaches into every digit.
      - teach: >
          Said aloud: "Lots of eight, so the last three digits, seven thirty-six,
          that's eight times ninety-two, so it clears." Naming the tail length
          first is what stops you running the $4$-test on an $8$-question.

  - node: quant-mental.arithmetic.divisibility-7-11
    hook: >
      7 and 11 don't have a simple trailing-digits shortcut like 4 and 8, so
      these two digit-manipulation algorithms are worth having memorized cold
      rather than falling back on trial division mid-interview.
    explanation: >
      The 11-test is a residue shortcut: since $10\equiv-1\pmod{11}$,
      successive place values alternate sign — $1,-1,1,-1,\ldots$ — moving
      left, so a number's remainder mod 11 equals its digits' alternating
      sum. It's the identical "replace the number with a cheap residue" idea
      behind rounding to a base, just built on $10\equiv-1$ instead of
      treating 10 as itself.

      The 7-test is a different kind of shortcut — an algebraic identity, not
      a residue-of-10 pattern. Write the number as $10a+d$, stripping off the
      last digit $d$. Then $10(a-2d)=10a-20d=(10a+d)-21d$, and since $21$ is
      a multiple of 7, $10a+d$ and $a-2d$ differ by a multiple of 7, so the
      two numbers are either both divisible by 7 or neither is — and
      multiplying by 10 along the way never affects divisibility by 7, since
      10 and 7 share no common factor.

      Both reductions shrink the number, so the mental model is the same
      either way: repeat the reduction — alternating sum again, or
      strip-double-subtract again — until what's left is small enough to
      recognize as a multiple of 7 or 11 by eye, without needing a final
      division.
    worked: >
      11-test on $8{,}514$: alternating sum from the right, $4-1+5-8=0$, a
      multiple of 11 — confirmed by $8514=11\times774$. 7-test on $861$:
      strip the $1$, double it to $2$, subtract from $86$: $86-2=84=7\times12$
      — divisible by 7, confirmed by $861=7\times123$.
    interview: >
      Used when a specific number needs factoring on the spot — spotting
      that an odds ratio or probability reduces by 7 or 11 — since those are
      the two smallest primes without an easy trailing-digit shortcut,
      interviewers like probing whether they're actually memorized.
    pitfalls: >
      Starting the alternating sum from the wrong end or with the wrong sign
      — pick a consistent starting point (from the right, alternating
      $+,-,+,-$) and stick to it, since flipping it gives the negative of the
      right value, which still detects an 11 but can mislead partway through.
      Stopping the 7-test reduction after one pass when the result is still
      two or more digits — repeat strip-double-subtract until the remainder
      is small enough to recognize.
    recap: >
      Alternating digit sum tests divisibility by 11; strip-double-subtract
      the last digit, repeated, tests divisibility by 7.
    dialogue:
      - part: A fraction that ought to reduce
        teach: >
          A counting argument leaves you with a probability of $3157/5005$.
          You happen to know $5005 = 5 \times 7 \times 11 \times 13$, and the
          interviewer wants the answer in lowest terms. The numerator is not a
          multiple of $5$, so the question is whether it shares a $7$, an
          $11$ or a $13$.
      - ask: >
          Try $7$ by long division. What is $3157 / 7$?
        expects: "451"
        hint: >
          Take out $7 \times 400$ first.
        feedback: >
          $7 \times 400 = 2800$ leaves $357 = 7 \times 51$, so $3157 = 7 \times
          451$. It worked, but had it failed you would have started over with
          $11$ and then $13$, each a full division.
      - ask: >
          Now $451$ against $11$. Is there a tail of digits that settles
          divisibility by $11$, the way the last digit settles it for $5$?
        choices:
          - text: >
              Yes: multiples of $11$ have repeated digits, like $33$ and $77$.
            feedback: >
              Only up to $99$. $11 \times 12 = 132$ has no repeated digit, and
              neither does $11 \times 41 = 451$.
          - text: >
              Yes: the last two digits, since $100$ is just $99 + 1$.
            feedback: >
              $451$ and $551$ share the tail $51$, yet $451 = 11 \times 41$ and
              $551 = 11 \times 50 + 1$. Each hundred carries a leftover of
              $1$, so the hundreds digit still counts.
          - text: >
              No: no power of ten is a multiple of $11$, so every digit
              matters.
            correct: true
            feedback: >
              Right. A tail test needs the discarded part to be a multiple of
              the divisor, and $10$, $100$, $1000$ never are multiples of $7$
              or $11$. Every digit has to be used, so the job is to use each
              one cheaply.
        feedback: >
          For $7$ and $11$ the whole number matters. What helps is that each
          power of ten sits right next to a multiple of $11$.
      - reflect: >
          Write $451 = 4 \times 100 + 5 \times 10 + 1$. Use $100 = 99 + 1$ and
          $10 = 11 - 1$: what does each piece leave over on division by $11$,
          and what does that say about $451$?
        hint: >
          $5 \times 10 = 5 \times 11 - 5$. A leftover can be negative.
        answer: >
          $4 \times 100$ leaves $+4$, $5 \times 10$ leaves $-5$, and the units
          digit leaves $+1$. The total leftover is $4 - 5 + 1 = 0$, so $451$
          is a multiple of $11$. The digits enter with alternating signs,
          because the powers of ten alternate between one above and one below
          a multiple of $11$.

      - part: Columns that alternate in sign
        teach: >
          That is the $11$-test. Since $10 \equiv -1 \pmod{11}$, the powers
          $1, 10, 100, 1000, \ldots$ leave $+1, -1, +1, -1, \ldots$, so a
          number leaves the same remainder as its alternating digit sum taken
          from the right, units digit with a plus. A number is divisible by
          $11$ exactly when that sum is.
      - ask: >
          Run it on the original numerator: the alternating sum of $3157$ from
          the right.
        expects: "0"
        hint: >
          Start $7 - 5$.
        feedback: >
          $7 - 5 + 1 - 3 = 0$, so $3157$ is a multiple of $11$ straight away:
          $3157 = 11 \times 287$. No division needed to learn it shares the
          $11$.
      - ask: >
          A different numerator, $4726$. What remainder does it leave on
          division by $11$?
        choices:
          - text: >
              $7$
            correct: true
            feedback: >
              Right. From the right: $6 - 2 + 7 - 4 = 7$. Check: $11 \times 429
              = 4719$, and $4726 - 4719 = 7$.
          - text: >
              $4$
            feedback: >
              That comes from starting at the left: $4 - 7 + 2 - 6 = -7$,
              which is $4$ after adding $11$. Starting at the left gives every
              digit the wrong sign, so you get the remainder of $-4726$. The
              units digit is the one with weight $+1$.
          - text: >
              $19$
            feedback: >
              That is the plain digit sum, $4 + 7 + 2 + 6$, which counts every
              column as worth $+1$. For $11$ the tens and thousands columns are
              worth $-1$, and $19$ is not even below $11$.
        feedback: >
          For a yes or no either direction works, since flipping every sign
          keeps $0$ at $0$. For a remainder, start with a plus on the units
          digit.
      - ask: >
          Put it together: $3157 = 7 \times 11 \times 41$. Write $3157/5005$
          in lowest terms.
        expects: "41/65"
        hint: >
          Cancel the $7$ and the $11$ from $5 \times 7 \times 11 \times 13$.
        feedback: >
          $3157/5005 = (7 \times 11 \times 41)/(5 \times 7 \times 11 \times 13)
          = 41/65$. Two common factors, each found by a test you can run
          faster than you can say "long division".

      - part: Seven needs a different trick
        ask: >
          Powers of ten do not sit next to multiples of $7$ in any useful
          pattern, so for $7$ the move is algebraic. $3157$ ends in $7$.
          Subtract $21 \times 7$, a multiple of $7$ chosen because $21$ ends
          in $1$. What is left?
        expects: "3010"
        hint: >
          $21 \times 7 = 147$.
        feedback: >
          $3157 - 147 = 3010$. Subtracting $21$ times the last digit always
          zeroes the units digit, and since $147$ is a multiple of $7$, the
          two numbers are both multiples of $7$ or both not.
      - ask: >
          $3010 = 10 \times 301$. May you test $301$ instead of $3010$?
        choices:
          - text: >
              Yes: trailing zeros never affect divisibility.
            feedback: >
              They do for some divisors: $30$ is a multiple of $5$ and $3$ is
              not. Dropping a factor $10$ is safe only when the divisor shares
              no factor with $10$.
          - text: >
              No: dropping a zero changes the number, so test $3010$ directly.
            feedback: >
              You can drop it here. $7$ shares no factor with $10$, so $7$
              divides $10 \times 301$ only if it divides $301$.
          - text: >
              Yes: $7$ shares no factor with $10$, so $7$ divides $10 \times
              301$ only if it divides $301$.
            correct: true
            feedback: >
              Right. That is the step that makes the trick legal for $7$, and
              it would fail for a divisor like $5$ or $2$.
        feedback: >
          Subtract $21$ times the last digit, drop the zero: the number shrank
          by a digit and kept its divisibility by $7$.
      - teach: >
          That is the $7$-test, done in one stroke. Write the number as $10a +
          b$, with $b$ its last digit. Then $10(a - 2b) = (10a + b) - 21b$,
          so $10a + b$ and $a - 2b$ are both multiples of $7$ or neither. In
          words: strip the last digit, double it, subtract it from what is
          left. On $3157$: $315 - 14 = 301$, the number you just reached.
      - ask: >
          One more pass on $301$: strip, double, subtract. What is left?
        expects: "28"
        hint: >
          Strip the $1$ and double it.
        feedback: >
          $30 - 2 = 28 = 7 \times 4$, so $301$ and hence $3157$ are multiples
          of $7$. Indeed $301 = 7 \times 43$.
      - ask: >
          The test on $3160$ runs $316 - 0 = 316$, then $31 - 12 = 19$, and
          $19 = 7 \times 2 + 5$. What do you conclude?
        choices:
          - text: >
              $3160$ leaves remainder $5$ on division by $7$.
            feedback: >
              $3160 = 3157 + 3$, so the remainder is $3$. Each pass divides by
              $10$ along the way, which scrambles the remainder; only
              whether it is $0$ survives.
          - text: >
              $3160$ is not a multiple of $7$; the test does not say what it
              leaves.
            correct: true
            feedback: >
              Right. The test keeps divisibility and nothing else. For the
              actual remainder, find the nearby multiple: $3157$, so $3$.
          - text: >
              The test does not apply, since $3160$ ends in $0$.
            feedback: >
              It applies to any number; a last digit of $0$ just makes the
              first pass free. Doubling $0$ and subtracting it leaves $316$.
        feedback: >
          The $11$-test hands you the remainder; the $7$-test only says yes or
          no. Know which one you are holding before you report a number.
      - teach: >
          In the room: "Seven-five-one-three alternates to zero, so eleven
          goes in; three-fifteen minus fourteen is three-oh-one, thirty minus
          two is twenty-eight, so seven goes in; that leaves forty-one over
          sixty-five."

  - node: quant-mental.arithmetic.digit-checks
    hook: >
      Casting out nines is the fastest error catch available under time
      pressure — a one-second check that flags a wrong multiplication or sum
      without ever redoing the calculation.
    explanation: >
      Divisibility by 9 already established that a number's digit sum mod 9
      equals the number itself mod 9; casting out nines generalizes that from
      a yes/no test into a full error check by tracking the actual residue,
      not just whether it's zero. Reducing to a residue commutes with both
      addition and multiplication, so combining the operands' residues with
      the same operation the real calculation used must land on the claimed
      answer's own residue — any mismatch is conclusive proof of an error.

      Picture every number as carrying a single-digit "shadow," its digit sum
      reduced to one digit. Arithmetic on the real numbers and the identical
      arithmetic on their shadows are forced to agree, so a mismatched shadow
      proves something is wrong, while a matching shadow is strong evidence,
      not certainty — an error that happens to be an exact multiple of 9
      produces the same shadow as the correct answer and slips through
      entirely.

      The last-digit check is a second, independent shadow, this time mod 10
      instead of mod 9, and it costs nothing extra to run alongside the
      first. Neither check is complete on its own — in particular, a digit
      transposition (miscopying $2491$ as $2419$) leaves the digit-sum shadow
      completely unchanged, since reordering digits doesn't change their sum,
      so it can slip past the mod-9 check even though the last-digit check
      will sometimes catch it, depending on which digits moved.
    worked: >
      Verify a claimed $68\times74=5032$: shadows $6+8=14\to5$ and
      $7+4=11\to2$ give $5\times2=10\to1$; the claimed answer's shadow is
      $5+0+3+2=10\to1$ — consistent. Last digit: $8\times4=32$ ends in 2,
      matching $5032$'s last digit — both checks pass, and indeed
      $68\times74=5032$.
    interview: >
      Run immediately after any multi-digit multiplication or sum to defend
      the answer without recomputing it — the strongest candidates run this
      unprompted, stating "checks out mod 9" or similar before moving on.
    pitfalls: >
      Treating a passing check as proof rather than strong evidence — errors
      that are exact multiples of 9 pass silently. Relying on the mod-9
      check alone against digit transpositions, since reordered digits leave
      the digit sum, and therefore the shadow, unchanged.
    recap: >
      Reduce every operand and the claimed answer to its digit-sum shadow mod
      9 (and, separately, its last digit) — a mismatch proves an error, a
      match is a strong but imperfect check.
    dialogue:
      - part: A product nobody has time to redo
        teach: >
          A colleague on the desk calls out "$736 \times 48 = 35{,}228$" and
          moves straight on to the next step, which depends on it. You have
          about a second to decide whether to trust it.
      - ask: >
          Settle it the slow way first. What is $736 \times 48$?
        expects: "35328"
        hint: >
          $48 = 50 - 2$.
        feedback: >
          $736 \times 50 = 36800$ and $736 \times 2 = 1472$, so the product is
          $36800 - 1472 = 35328$. The claim is $100$ short: a dropped carry in
          the hundreds. Recomputing found it, but took several seconds and gave
          you your own chance to slip.
      - ask: >
          Suppose you had run two one-glance checks instead. The last digit:
          $6 \times 8 = 48$ ends in $8$, and so does $35{,}228$. The size:
          $700 \times 50 = 35{,}000$, close to the claim. Both pass. What have
          they established?
        choices:
          - text: >
              The claim is right: two independent checks agree.
            feedback: >
              The claim is wrong, by $100$. The last digit sees only the units
              column and the size estimate sees only the leading digits; an
              error in the hundreds slips between them.
          - text: >
              Nothing about the middle digits, which is where this error sits.
            correct: true
            feedback: >
              Right. Neither check reads the hundreds digit at all, so a wrong
              carry there is invisible to both.
          - text: >
              The claim is off by at most $1000$, which is close enough.
            feedback: >
              Closeness is not the question; the next step uses the exact
              number. And the checks bound nothing about the hundreds digit.
        feedback: >
          What you want is a check that every digit feeds into and that costs
          about as much as reading the number once.
      - reflect: >
          From the digit-sum test, a number leaves the same remainder on
          division by $9$ as its digit sum. $736$ leaves $7$ and $48$ leaves
          $3$. Without forming the product, what remainder must $736 \times 48$
          leave on division by $9$, and what does that say about $35{,}228$?
        hint: >
          Write $736 = 9m + 7$ and $48 = 9n + 3$ and multiply out.
        answer: >
          $(9m + 7)(9n + 3)$ is a multiple of $9$ plus $7 \times 3 = 21$, and
          $21$ leaves $3$. So the true product leaves $3$. The claim's digits
          sum to $3 + 5 + 2 + 2 + 8 = 20$, which leaves $2$. A product that
          leaves $3$ cannot equal a number that leaves $2$: the claim is wrong,
          proved without recomputing it.

      - part: Every number casts a shadow
        teach: >
          That is casting out nines. Reduce each operand to its digit sum mod
          $9$, its shadow; do the same operation on the shadows; reduce again;
          compare with the shadow of the claimed answer. It works for sums,
          differences and products, because the remainder on division by $9$
          passes through all three. A mismatch proves an error. A match only
          means the answer is consistent.
      - ask: >
          Why may you multiply the shadows instead of the numbers?
        choices:
          - text: >
              Because $736 = 9 \times 81 + 7$ and $48 = 9 \times 5 + 3$, and
              every term of the product except $7 \times 3$ has a factor $9$.
            correct: true
            feedback: >
              Right. The multiples of $9$ never affect the remainder, so only
              the product of the leftovers does. The same expansion works for
              sums and differences.
          - text: >
              Because the digit sum of a product equals the product of the
              digit sums.
            feedback: >
              Not as numbers: the digit sums of $736$ and $48$ are $16$ and
              $12$, whose product is $192$, while $35328$ has digit sum $21$.
              Only the remainders on division by $9$ agree: $192$ and $21$
              both leave $3$.
          - text: >
              Because $9$ divides every power of $10$.
            feedback: >
              $9$ divides no power of $10$; each one is one *more* than a
              multiple of $9$. That is what makes the digit sum the remainder,
              not what lets shadows multiply.
        feedback: >
          The check rests on one fact: remainders on division by $9$ add,
          subtract and multiply like the numbers they come from.
      - ask: >
          A P&L line adds $4{,}817 + 2{,}968 + 1{,}355$ and reports $9{,}140$.
          What shadow must the true total have?
        expects: "5"
        hint: >
          Shadow each addend, add the shadows, reduce.
        feedback: >
          $4817 \to 20 \to 2$, $2968 \to 25 \to 7$, $1355 \to 14 \to 5$, and
          $2 + 7 + 5 = 14 \to 5$. The reported $9140$ has digit sum $14 \to
          5$: consistent.
      - ask: >
          The shadows matched at $5$. What have you established about $9{,}140$?
        choices:
          - text: >
              It is the correct total.
            feedback: >
              A match puts the answer in the right one of nine remainder
              classes, nothing more. $9149$ and $9050$ would have matched too.
          - text: >
              Nothing at all, since the check only works for products.
            feedback: >
              It works for sums just as well: remainders add the way the
              numbers do.
          - text: >
              It is consistent with the addends, so an error is possible but
              must be one the shadow cannot see.
            correct: true
            feedback: >
              Right. Here $9140$ happens to be correct, but the check alone
              cannot tell you that. Only a mismatch is a proof.
        feedback: >
          The check is one-directional: a mismatch proves an error, a match is
          evidence. That asymmetry is what you report aloud.
      - ask: >
          A settlement figure is reported as $8{,}000 - 2{,}763 = 5{,}347$.
          What shadow must the true difference have?
        expects: "8"
        hint: >
          $2763$ has digit sum $18$, a multiple of $9$.
        feedback: >
          $8000 \to 8$ and $2763 \to 18 \to 0$, so the difference must leave
          $8 - 0 = 8$. The claim gives $5 + 3 + 4 + 7 = 19 \to 1$: a mismatch,
          so $5347$ is wrong. The true difference is $5237$, digit sum $17 \to
          8$.

      - part: What the shadow cannot see
        ask: >
          The correct product is $35{,}328$. Which wrong copy of it would
          pass casting out nines?
        choices:
          - text: >
              $35{,}338$
            feedback: >
              Off by $10$, which is one more than a multiple of $9$: the
              digit sum becomes $22 \to 4$, not $3$. Caught.
          - text: >
              $35{,}329$
            feedback: >
              Off by $1$: digit sum $22 \to 4$ against the required $3$.
              Caught.
          - text: >
              $35{,}238$
            correct: true
            feedback: >
              Right. The same five digits in a different order have the same
              digit sum, $21 \to 3$. The shadow sees which digits appear,
              never where.
          - text: >
              $35{,}228$
            feedback: >
              That is the original claim, with digit sum $20 \to 2$. Caught,
              as the shadows already showed.
        feedback: >
          Swapping two digits changes the number by a multiple of $9$, so the
          shadow cannot move. Any error that is a multiple of $9$ in size is
          invisible to this check.
      - ask: >
          The last digit is a second shadow: the remainder on division by $10$.
          A rushed copy reads $35{,}382$. Which check catches it?
        choices:
          - text: >
              Casting out nines: the digits moved.
            feedback: >
              The digits moved but their sum did not: $3 + 5 + 3 + 8 + 2 = 21
              \to 3$, matching. This swap is invisible mod $9$.
          - text: >
              The last digit: $6 \times 8$ ends in $8$, and the copy ends in
              $2$.
            correct: true
            feedback: >
              Right. The swap moved the units digit, and that is the one place
              the last-digit check looks.
          - text: >
              Neither: a reordering of the right digits always passes.
            feedback: >
              It always passes mod $9$. But this reordering moved the units
              digit, which the last-digit check reads directly.
        feedback: >
          The two shadows fail in different places, so running both catches
          more than either alone. Neither checks the leading digits; that is
          what the size estimate is for.
      - teach: >
          Said aloud before moving on: "Seven times three is twenty-one, shadow
          three; thirty-five two twenty-eight has shadow two, so that is wrong.
          Thirty-five three twenty-eight." Running the check unprompted, out
          loud, is a large part of what the interviewer is grading.
