unit: quant-tools.recurrences
opening: >
  This unit turns sequential randomness into algebra: once you can write next in terms of previous, an "expected number of tosses" or "how many arrangements avoid ..." question stops being a puzzle and becomes a linear system with a mechanical solution. It runs in two halves — first the algebra of linear recurrences with constant coefficients, from the first-order fixed point through characteristic roots, repeated roots, and matching a particular solution to the forcing term, anchored by Fibonacci as the running example; then first-step analysis, the probabilistic use of the same idea, which turns conditioning on one step into a system of equations for an expected value or a probability, worked through the classic pattern-waiting races. By the end, seeing a process that restarts in a recognisable state should trigger naming the states and writing the equations before anything else.
lessons:
  - node: quant-tools.recurrences.recurrence-relation
    hook: >
      Naming the order and counting the initial values correctly is the entire setup step of every "expected time until ..." interview question — get that wrong and the rest of the algebra solves the wrong problem.
    explanation: >
      A recurrence is a promise that $a_n$ can be computed from a bounded window of earlier terms, and the order $k$ is the width of that window — the number of facts you must remember as you step forward. Splitting a recurrence into a linear part with constant coefficients $c_1,\dots,c_k$ and a forcing term $g(n)$ matters because it licenses superposition: the machinery built for the homogeneous case (where $g\equiv 0$) becomes reusable for the general case by adding one particular fix-up, a pattern the rest of this unit leans on repeatedly.

      The uniqueness fact — that an order-$k$ recurrence plus $k$ initial values pins the sequence down completely — is the practically useful half of the definition. It licenses guess-and-check: if you can produce any closed form that satisfies the recurrence and reproduces the first $k$ terms, you are done, because no other sequence can agree with the recurrence and those $k$ terms without being identical forever. Every closed-form technique later in this unit is really a disciplined way to make that guess.

      The interview skill is rarely the algebra; it's translating a word problem into $a_n$ in terms of $a_{n-1},\dots$ in the first place. Naming what $n$ counts — tosses so far, cards dealt, steps taken — before writing any equation is what makes everything after it mechanical.
    worked: >
      Classify $a_n = 4a_{n-1} - 4a_{n-2}$: it is order $2$, linear, constant-coefficient, and homogeneous. Given $a_0 = 1$ and $a_1 = 4$, the recurrence forces $a_2 = 4(4) - 4(1) = 12$ — and by uniqueness, no other order-$2$ sequence sharing those two starting values can ever diverge from this one.
    interview: >
      Rarely asked as "define a recurrence relation" — instead it's buried in a word problem, and the interviewer listens for you to name an index, state what $a_n$ depends on, and count how many boundary values you'll need before touching algebra.
    pitfalls: >
      Supplying the wrong number of initial values — one for an order-$2$ recurrence, or three for an order-$1$ one — leaves the system under- or over-determined. Treating coefficients that actually depend on $n$ as if they were the fixed constants this definition requires breaks every characteristic-root technique that follows.
    recap: >
      An order-$k$ linear recurrence plus $k$ initial values determines a sequence completely, which is what makes guessing and verifying a closed form a legitimate strategy.
    dialogue:
      - part: Two terms in, the rest forced
        teach: >
          An interviewer writes a rule on the board: each term is twice the
          previous term plus the one before that, $a_n = 2a_{n-1} + a_{n-2}$.
          Underneath it she writes $a_0 = 1$ and $a_1 = 3$, and asks for
          $a_4$.
      - ask: >
          What is $a_4$?
        expects: "41"
        hint: >
          Build up one term at a time: $a_2$ from $a_1$ and $a_0$, then $a_3$,
          then $a_4$.
        feedback: >
          $a_2 = 2(3) + 1 = 7$, $a_3 = 2(7) + 3 = 17$, $a_4 = 2(17) + 7 = 41$.
          Every step reads the last two terms and nothing else.
      - ask: >
          Suppose she had erased $a_0$ and left only $a_1 = 3$ and the rule.
          How many sequences fit what is left on the board?
        choices:
          - text: >
              Exactly one: the rule and $a_1$ fix everything after $a_1$.
            feedback: >
              The rule needs two earlier terms to produce $a_2 = 6 + a_0$.
              With $a_0$ unknown, $a_2$ is unknown, and so is every term after
              it.
          - text: >
              Infinitely many: each choice of $a_0$ gives a different one.
            correct: true
            feedback: >
              Right. $a_0 = 1$ gives $3, 7, 17, \dots$ after the first term and
              $a_0 = 0$ gives $3, 6, 15, \dots$; one missing value leaves a
              whole family.
          - text: >
              None: a sequence must be given from its first term.
            feedback: >
              Nothing forbids starting from $a_1$; the trouble is the
              opposite one. Too little is pinned down, so many sequences fit,
              not zero.
        feedback: >
          This rule eats two earlier terms per step, so it has to be handed
          two before it can run.
      - ask: >
          A different rule: $b_n = b_{n-1} + b_{n-3}$. How many starting values
          must you be handed before every later term is determined?
        expects: "3"
        hint: >
          To compute $b_3$, which earlier terms does the rule read?
        feedback: >
          $b_3 = b_2 + b_0$ reads back three places, so you need $b_0$, $b_1$
          and $b_2$. The coefficient of $b_{n-2}$ happens to be $0$, but the
          window still reaches three terms back.
      - reflect: >
          In both rules, how many starting values were needed, what decided
          that number, and why does handing over exactly that many settle
          every later term for good?
        answer: >
          The number is how far back the rule reaches: two for $a_n$, three
          for $b_n$. Given that many consecutive terms, the rule produces the
          next one, then the next, by induction, so the whole sequence is
          forced. In particular two sequences that obey the same rule and
          agree on that many consecutive terms can never separate. How far
          back the rule reaches has a name, the order.

      - part: Sorting the rules
        teach: >
          Four rules on one sheet. (i) $a_n = 2a_{n-1} + a_{n-2}$, the board
          rule. (ii) $a_n = 2a_{n-1} + a_{n-2} + 3^{n}$. (iii)
          $a_n = a_{n-1}\,a_{n-2}$. (iv) $a_n = 5a_{n-2} - 7$.
      - ask: >
          Which of the four is not linear in the earlier terms?
        choices:
          - text: >
              (ii), because $3^{n}$ grows exponentially.
            feedback: >
              The $3^{n}$ depends on $n$ alone, not on any earlier term. The
              earlier terms still enter as $2a_{n-1} + a_{n-2}$, which is
              linear.
          - text: >
              (iii), because it multiplies two earlier terms together.
            correct: true
            feedback: >
              Right. Double both $a_{n-1}$ and $a_{n-2}$ and $a_n$ quadruples;
              a linear rule would only double it.
          - text: >
              (iv), because the $-7$ spoils linearity.
            feedback: >
              A constant added on does not touch how $a_{n-2}$ enters, which
              is with a fixed coefficient $5$. That $-7$ is a different kind
              of term, sorted by the next question.
        feedback: >
          Linear means the earlier terms appear only multiplied by
          coefficients and added up. Products, squares or square roots of
          earlier terms take a rule outside everything this unit solves.
      - ask: >
          Which of (i) and (ii) is satisfied by the all-zero sequence
          $0, 0, 0, \dots$?
        choices:
          - text: >
              Both: zero times anything is zero.
            feedback: >
              In (ii), putting zeros in gives $a_n = 0 + 0 + 3^{n}$, which is
              not zero. The extra term does not care what the earlier terms
              were.
          - text: >
              Only (i).
            correct: true
            feedback: >
              In (i) zeros in give zero out. In (ii) the $3^{n}$ pushes
              every term away from zero whatever came before.
          - text: >
              Only (ii).
            feedback: >
              Try it: (ii) gives $a_1 = 0 + 0 + 3 = 3$ from two zeros. It is
              (i) that keeps zero at zero.
        feedback: >
          The term that involves no earlier $a$ is the forcing term. When it
          is identically zero the rule is homogeneous, and the zero sequence
          is always one of its solutions.
      - teach: >
          What you have been checking has names. A recurrence relation gives
          $a_n$ in terms of earlier terms; its order $k$ is how far back it
          reaches. It is linear with constant coefficients when
          $a_n = c_1 a_{n-1} + \dots + c_k a_{n-k} + g(n)$ with the $c_i$
          fixed numbers, and homogeneous when the forcing term $g(n)$ is
          identically $0$. An order-$k$ recurrence and $k$ consecutive
          initial values determine the sequence completely.
      - ask: >
          What is the order of rule (iv), $a_n = 5a_{n-2} - 7$?
        expects: "2"
        feedback: >
          It reads $a_{n-2}$, two places back, so the order is $2$ and it
          needs two initial values, even though $a_{n-1}$ never appears. Given
          only $a_0$, the odd-indexed terms would be left undetermined.
      - ask: >
          Which description of rule (iv) is right?
        choices:
          - text: >
              Linear, constant coefficients, homogeneous: the $-7$ is a
              constant, not a function of $n$.
            feedback: >
              A constant is a function of $n$ that happens not to change.
              Zeros in give $-7$ out, so the zero sequence fails and the rule
              is not homogeneous.
          - text: >
              Linear, constant coefficients, inhomogeneous with forcing term
              $g(n) = -7$.
            correct: true
            feedback: >
              Right. Coefficients $c_1 = 0$ and $c_2 = 5$, both fixed, and a
              constant forcing term. Constant forcing is the commonest kind in
              "expected time" problems.
          - text: >
              Not linear, since a term with no $a$ in it is not of the form
              $c\,a_{n-k}$.
            feedback: >
              Linearity is about how the earlier terms enter. A forcing term
              sits outside that part and is allowed; it only decides
              homogeneous or not.
        feedback: >
          Order $2$, linear, constant coefficients, inhomogeneous: four
          separate checks, and each one changes which tool applies later.

      - part: The rule that fails one clause
        ask: >
          Now $d_n = d_{n-1}/n$ with $d_0 = 1$. Exactly one clause of
          "order-$1$ linear homogeneous recurrence with constant coefficients"
          fails. Which?
        choices:
          - text: >
              Homogeneous: dividing by $n$ brings in a term in $n$.
            feedback: >
              Put $d_{n-1} = 0$ in and $d_n = 0$ comes out, so there is no
              forcing term and the rule is homogeneous. The $n$ sits inside
              the coefficient, not beside it.
          - text: >
              Linear: you cannot divide a term by the index.
            feedback: >
              $d_n = \tfrac{1}{n}\,d_{n-1}$ is a number times the earlier term,
              which is linear. The trouble is which number.
          - text: >
              Constant coefficients: the multiplier $1/n$ changes with $n$.
            correct: true
            feedback: >
              Right. It is order $1$, linear and homogeneous, but its
              coefficient is $1, \tfrac12, \tfrac13, \dots$, not one fixed
              number.
        feedback: >
          A coefficient that moves with $n$ is the clause most often missed,
          and it matters: the characteristic-root method later in this unit
          needs fixed coefficients.
      - ask: >
          It is still a perfectly good recurrence: one initial value pins it
          down. What is $d_4$?
        expects: "1/24"
        hint: >
          Divide by $1$, then $2$, then $3$, then $4$.
        feedback: >
          $d_1 = 1$, $d_2 = \tfrac12$, $d_3 = \tfrac16$, $d_4 = \tfrac{1}{24}$.
          It is $1/n!$. Order $1$ with one initial value determines the
          sequence whether or not the coefficients are constant; the constants
          only matter for the solving methods to come.
      - teach: >
          In an interview the recurrence is never handed to you. Say what $n$
          counts first, write $a_n$ in terms of the earlier terms, read off
          the order, and count out that many initial values from the problem
          before any algebra. Most wrong answers to "expected time until"
          questions are set up wrong, not solved wrong.

  - node: quant-tools.recurrences.first-order-recurrence
    hook: >
      This is the one-line solve you should have cold: any $a_n = ra_{n-1}+c$ appearing in an interview — depreciation, a discounted expected value, a simple population model — collapses to a fixed point and a decay rate, no series summation required.
    explanation: >
      The trick is a change of variables that makes the constant term disappear. If $x^\ast$ is a value that maps to itself under the recursion, $x^\ast = rx^\ast + c$, then subtracting this identity from $a_n = ra_{n-1}+c$ cancels every $c$ and leaves $a_n - x^\ast = r(a_{n-1}-x^\ast)$ — the deviation from $x^\ast$ obeys a pure geometric recursion, which you already know how to solve. Solving $x^\ast = rx^\ast+c$ gives the fixed point $x^\ast = c/(1-r)$, valid whenever $r \ne 1$.

      Once you have $a_n - x^\ast = r^{n}(a_0-x^\ast)$, the qualitative picture is free: $|r|<1$ means the deviation shrinks geometrically to $0$, so $a_n \to x^\ast$ regardless of the start, and the sign of $r$ tells you whether the approach is smooth (positive $r$) or oscillates around $x^\ast$ (negative $r$). $|r|>1$ means the deviation blows up, and $r=1$ is the one case with no fixed point at all — there the recursion is just adding $c$ every step, giving the arithmetic answer $a_n = a_0 + nc$.

      Recognize the shape $a_n = ra_{n-1}+c$ whenever a quantity moves a fixed fraction toward some target each step and gains a fixed increment — "fixed fraction toward a target" is the fixed point in disguise.
    worked: >
      Solve $a_n = -\tfrac12 a_{n-1} + 9$ with $a_0 = 0$. The fixed point is $x^\ast = 9/(1-(-\tfrac12)) = 6$, so $a_n = 6\left(1-(-\tfrac12)^{n}\right)$. Direct iteration confirms it: $a_1 = 9$, $a_2 = 4.5$, $a_3 = 6.75$ — oscillating around $6$ from both sides exactly as the negative ratio predicts, converging geometrically at rate $1/2$.
    interview: >
      Shows up as "a machine's value depreciates by 20% then gets serviced back up by a fixed amount each year — what's the long-run value?" or as an expected value satisfying exactly this shape. The interviewer wants the fixed point produced immediately, not a term-by-term unrolling.
    pitfalls: >
      Applying $x^\ast = c/(1-r)$ at $r=1$ divides by zero — that case needs the separate arithmetic formula, not a limit of this one. Missing that a negative $r$ makes the sequence oscillate rather than approach monotonically leads to a wrong qualitative description even when the formula is right.
    recap: >
      Subtract the fixed point $c/(1-r)$ and the recursion becomes purely geometric, giving $a_n = r^{n}(a_0-x^\ast)+x^\ast$, convergent whenever $|r|<1$.
    dialogue:
      - part: A dose every morning
        teach: >
          A patient takes a $60$ mg dose every morning. By the next morning
          the body has cleared $75\%$ of whatever was in the bloodstream. Let
          $a_n$ be the amount just after the $n$-th dose, with $a_0 = 0$
          before any dose, so $a_n = 0.25\,a_{n-1} + 60$.
      - ask: >
          What is $a_3$, in mg?
        expects: "78.75"
        hint: >
          Keep a quarter of the previous amount, then add $60$.
        feedback: >
          $a_1 = 60$, $a_2 = 15 + 60 = 75$, $a_3 = 18.75 + 60 = 78.75$. The
          increments $60, 15, 3.75$ are shrinking fast.
      - ask: >
          The amounts are levelling off. At what level would a morning's
          dose exactly replace what the night cleared, so the amount stopped
          changing?
        expects: "80"
        hint: >
          Call the level $L$ and ask that one more step leaves it where it
          is.
        feedback: >
          $L = 0.25L + 60$ gives $0.75L = 60$, so $L = 80$ mg. At $80$ the
          night clears $60$ and the dose puts back $60$.
      - ask: >
          Now the gaps to that level, $80 - a_n$, for $n = 1, 2, 3$. Each gap
          is what fraction of the one before?
        expects: "1/4"
        feedback: >
          The gaps are $20$, $5$ and $1.25$: each is a quarter of the last.
          The amounts themselves follow no such clean pattern, but their
          distances to $80$ do.

      - part: Why the gap shrinks by a quarter
        reflect: >
          Why must the gap shrink by exactly a factor of $1/4$ every day,
          whatever amount the patient started with? Use the two equations
          $a_n = 0.25\,a_{n-1} + 60$ and $80 = 0.25 \cdot 80 + 60$.
        hint: >
          Subtract one equation from the other.
        answer: >
          Subtracting, the $60$ cancels and leaves
          $a_n - 80 = 0.25\,(a_{n-1} - 80)$. Measured from the level that
          stays put, the recurrence has no constant at all; it is a pure
          geometric sequence with ratio $0.25$, so the gap after $n$ doses is
          $0.25^{n}$ times the starting gap. The starting amount only sets
          that first gap.
      - teach: >
          That level is the fixed point. For $a_n = r a_{n-1} + c$ with
          $r \ne 1$ it is $x^{*} = c/(1-r)$, the solution of $x = rx + c$.
          Subtracting it makes the relation geometric, so
          $a_n = r^{n}(a_0 - x^{*}) + x^{*}$. Here
          $a_n = 80 - 80 \cdot 4^{-n}$: the gap of $80$ at the start, cut by
          four every day.
      - ask: >
          After how many doses is the amount first within $0.1$ mg of $80$?
        expects: "5"
        hint: >
          You need $80 \cdot 4^{-n} < 0.1$, that is $4^{n} > 800$.
        feedback: >
          $4^{4} = 256$ leaves a gap of $80/256 = 0.3125$; $4^{5} = 1024$
          leaves $80/1024 \approx 0.078$. So $5$ doses. With $|r| < 1$ the
          approach is geometric: every dose buys a fixed factor, not a fixed
          amount.

      - part: When the ratio is negative, or too large
        ask: >
          A different system: $b_n = -0.8\,b_{n-1} + 18$ with $b_0 = 0$. What
          is its fixed point?
        expects: "10"
        feedback: >
          $x^{*} = 18/(1 - (-0.8)) = 18/1.8 = 10$. Check: $-0.8 \cdot 10 + 18
          = 10$.
      - ask: >
          How does $b_n$ approach $10$?
        choices:
          - text: >
              Steadily from below, like the dose.
            feedback: >
              $b_1 = 18$ already overshoots. The gap is multiplied by $-0.8$
              each step, so its sign flips every time.
          - text: >
              It swings above and below $10$, the swings shrinking by a factor
              $0.8$.
            correct: true
            feedback: >
              Right: $0, 18, 3.6, 15.12, \dots$, gaps $-10, 8, -6.4, 5.12$.
              The size of $r$ decides convergence; its sign decides the
              side.
          - text: >
              It swings forever with the same size, since $|-0.8|$ is close to
              $1$.
            feedback: >
              Close to $1$ is still less than $1$. The swings shrink by $20\%$
              each step, slowly but geometrically.
        feedback: >
          $|r| < 1$ means convergence; $r < 0$ means alternation. Both
          follow from the gap being multiplied by $r$ each step.
      - ask: >
          Now $u_n = 2u_{n-1} - 6$, whose fixed point is $6$, started just off
          it at $u_0 = 6.5$. What is $u_4$?
        expects: "14"
        hint: >
          The gap starts at $0.5$. What does each step do to it?
        feedback: >
          The gap doubles each step: $0.5, 1, 2, 4, 8$, so
          $u_4 = 6 + 8 = 14$. Iterating agrees: $7, 8, 10, 14$. With
          $|r| > 1$ the fixed point repels; only $u_0 = 6$ exactly stays
          there.
      - ask: >
          Last: $v_n = v_{n-1} + 7$. What does the fixed-point method make of
          it?
        choices:
          - text: >
              $x^{*} = 7/0$, so the fixed point is infinite and $v_n$ tends to
              it geometrically.
            feedback: >
              There is no geometric approach to anything here: $v_n$ grows by
              exactly $7$ every step. Dividing by $1 - r = 0$ is the sign the
              method does not apply.
          - text: >
              $x = x + 7$ has no solution, so there is no fixed point and the
              method has nothing to subtract.
            correct: true
            feedback: >
              Right. With $r = 1$ the sequence is arithmetic,
              $v_n = v_0 + 7n$, a separate and simpler case.
          - text: >
              The fixed point is $0$, because the coefficient of $v_{n-1}$ is
              $1$.
            feedback: >
              $0$ would need $0 = 0 + 7$. No number stays put when every step
              adds $7$.
        feedback: >
          The formula $c/(1-r)$ comes with $r \ne 1$ attached. At $r = 1$ use
          the arithmetic answer instead of a limit of the geometric one.
      - ask: >
          With $v_0 = 2$, what is $v_{10}$?
        expects: "72"
        feedback: >
          $v_{10} = 2 + 7 \cdot 10 = 72$. In an interview, say the three
          cases in one breath: shift by $c/(1-r)$ and the rest is geometric;
          $|r| < 1$ converges, negative $r$ alternates; $r = 1$ is
          arithmetic.

  - node: quant-tools.recurrences.linear-recurrence
    hook: >
      This is the general engine behind every closed-form sequence in this unit, including Fibonacci; the interview tell is a homogeneous recursion with constant coefficients where the answer wants a formula in $n$, not a table of values.
    explanation: >
      The ansatz $a_n = x^{n}$ works because the recursion is linear and shift-invariant: plugging it into $a_n = c_1a_{n-1}+\dots+c_ka_{n-k}$ and dividing every term by the common factor $x^{n-k}$ turns a statement about sequences into a single polynomial equation in $x$, the characteristic equation $x^{k} = c_1x^{k-1}+\dots+c_k$. Each root $r_i$ hands you one genuine solution sequence $r_i^{n}$, and because the recursion is linear, any combination $A_1r_1^{n}+\dots+A_kr_k^{n}$ solves it too — superposition is exactly why this works.

      With $k$ distinct roots you have $k$ free constants $A_i$, matching exactly the $k$ initial values a recurrence of this order needs; plugging $n=0,1,\dots,k-1$ into the general solution turns those initial values into a linear system for the $A_i$. For large $n$, the root of largest modulus swamps the rest, so the long-run growth rate is set entirely by that dominant root.

      A complex-conjugate pair of roots doesn't break anything; it contributes a real oscillating piece, $\rho^{n}\cos(n\theta)$ and $\rho^{n}\sin(n\theta)$ for a pair of modulus $\rho$ and argument $\theta$, since the imaginary parts of the two conjugate terms cancel once combined with the right constants.
    worked: >
      Solve $a_n = 5a_{n-1}-6a_{n-2}$ with $a_0=1$, $a_1=1$. The characteristic equation $x^2-5x+6=0$ factors as $(x-2)(x-3)=0$, roots $2$ and $3$, so $a_n = A\cdot2^{n}+B\cdot3^{n}$. The initial values give $A+B=1$ and $2A+3B=1$, solving to $A=2$, $B=-1$, so $a_n = 2\cdot2^{n}-3^{n}$. Checking $n=3$: the formula gives $2\cdot8-27=-11$, matching direct iteration $a_2=-1$, $a_3=5(-1)-6(1)=-11$.
    interview: >
      "Find a closed form for $a_n = \dots$" with constant coefficients is answered by writing the characteristic equation immediately, not by computing terms and guessing a pattern. The interviewer listens for the ansatz $a_n=x^n$ stated as the reason the polynomial appears at all.
    pitfalls: >
      Forgetting to fit the constants $A_i$ to the initial values leaves an answer with free parameters, not the actual sequence — the characteristic roots alone never determine it. Dividing by $x^{n-k}$ silently assumes $x\ne0$; if $0$ is genuinely a root it needs separate handling.
    recap: >
      Substituting $a_n=x^n$ turns a constant-coefficient recursion into its characteristic polynomial, and distinct roots combine as $a_n=\sum A_ir_i^{n}$ with constants fixed by the initial values.
    dialogue:
      - part: Twenty terms by hand
        teach: >
          The interviewer's rule this time is $a_n = 7a_{n-1} - 10a_{n-2}$
          with $a_0 = 2$ and $a_1 = 7$, and she wants $a_{20}$, no computer.
      - ask: >
          Start the slow way. What is $a_3$?
        expects: "133"
        feedback: >
          $a_2 = 7(7) - 10(2) = 29$ and $a_3 = 7(29) - 10(7) = 203 - 70 =
          133$. Seventeen more steps like that, with the numbers growing by
          a factor of about $5$ each time, reach $a_{20}$, which has
          fourteen digits.
      - ask: >
          The first-order lesson's trick was to subtract a fixed point. What
          does it give here?
        choices:
          - text: >
              A fixed point $L$ with $L = 7L - 10L$, which forces $L = 0$, so
              there is nothing useful to subtract.
            correct: true
            feedback: >
              Right. The relation is homogeneous, so its only constant
              solution is $0$, and subtracting $0$ changes nothing. The trick
              removed a constant; there is no constant here to remove.
          - text: >
              $L = 7/(1-10)$, by reading $7$ as the constant term.
            feedback: >
              The $7$ multiplies $a_{n-1}$; it is a coefficient, not a
              constant term. Two earlier terms enter, so the first-order
              formula does not apply at all.
          - text: >
              It works after rewriting the rule as a first-order one in
              $a_{n-1}$ alone.
            feedback: >
              $a_n$ genuinely needs $a_{n-2}$ too; no rewrite removes it,
              since two initial values are needed and a first-order rule can
              only absorb one.
        feedback: >
          The fixed point is gone, but the other half of the first-order
          lesson survives: after the shift, the answer was a geometric
          sequence.

      - part: Guessing a geometric answer
        reflect: >
          Suppose a geometric sequence $a_n = x^{n}$ obeyed this rule for
          every $n$. What equation must $x$ satisfy, and which values of $x$
          work?
        hint: >
          Substitute $x^{n}$, $x^{n-1}$ and $x^{n-2}$ and divide by the
          smallest power.
        answer: >
          $x^{n} = 7x^{n-1} - 10x^{n-2}$; dividing by $x^{n-2}$ leaves
          $x^{2} = 7x - 10$, that is $x^{2} - 7x + 10 = 0 = (x-2)(x-5)$. So
          $2^{n}$ and $5^{n}$ both obey the rule, and no other geometric
          sequence with nonzero ratio does. A question about a whole sequence
          has become a quadratic in one number.
      - ask: >
          $2^{n}$ starts $1, 2, \dots$ and $5^{n}$ starts $1, 5, \dots$;
          neither starts $2, 7$. What about $A \cdot 2^{n} + B \cdot 5^{n}$?
        choices:
          - text: >
              It obeys the rule only if $A + B = 1$, like a weighted average.
            feedback: >
              Substitute it: the $A$ part satisfies the rule on its own and so
              does the $B$ part, whatever their sizes. No constraint on
              $A + B$ appears.
          - text: >
              It obeys the rule for every $A$ and $B$, because the rule is
              linear and homogeneous.
            correct: true
            feedback: >
              Right. Scale a solution, or add two solutions, and the rule
              still holds term by term. That leaves two free constants for two
              initial values.
          - text: >
              It does not: the rule only accepts pure geometric sequences.
            feedback: >
              Check it at $n = 2$ with $A = B = 1$: the sequence starts
              $2, 7, 29$, and $7(7) - 10(2) = 29$. Sums of solutions are
              solutions.
        feedback: >
          Linearity and homogeneity are exactly what make combinations of
          solutions solutions; the forcing term of the next lessons breaks
          this, and has to be handled separately.
      - teach: >
          This is the characteristic-root method. Substitute $a_n = x^{n}$ and
          divide by $x^{n-k}$ to get the characteristic equation
          $x^{k} = c_1 x^{k-1} + \dots + c_k$. With distinct roots
          $r_1, \dots, r_k$, every solution is
          $A_1 r_1^{n} + \dots + A_k r_k^{n}$, and the $k$ initial values fix
          the $A_i$ through a $k \times k$ linear system. Every solution is
          caught because a recurrence with its initial values allows only one
          sequence, and the combination can be made to match them.
      - ask: >
          Fit $A \cdot 2^{n} + B \cdot 5^{n}$ to $a_0 = 2$ and $a_1 = 7$. What
          is $A$?
        expects: "1"
        hint: >
          $n = 0$ gives $A + B = 2$; $n = 1$ gives $2A + 5B = 7$.
        feedback: >
          Subtract twice the first from the second: $3B = 3$, so $B = 1$ and
          $A = 1$. The sequence is $a_n = 2^{n} + 5^{n}$, and $a_3 = 8 + 125 =
          133$ as you found by hand.
      - ask: >
          Use the closed form: what is $a_6$?
        expects: "15689"
        feedback: >
          $2^{6} + 5^{6} = 64 + 15625 = 15689$. The interviewer's $a_{20}$ is
          $2^{20} + 5^{20}$, which you can say at once and compute only if
          asked.

      - part: Who wins in the long run
        ask: >
          For large $n$, $a_{n+1}/a_n$ settles near what number?
        expects: "5"
        tolerance: 0.001
        feedback: >
          $5^{n}$ dwarfs $2^{n}$, so $a_{n+1}/a_n \to 5$; at $n = 19$ it is
          already $4.9999999$. The root of largest modulus sets the growth
          rate.
      - ask: >
          Same rule, new start: $a_0 = 1$, $a_1 = 2$. Now what does
          $a_{n+1}/a_n$ settle at?
        expects: "2"
        hint: >
          Fit $A$ and $B$ again before assuming the answer.
        feedback: >
          $A + B = 1$ and $2A + 5B = 2$ give $B = 0$, $A = 1$: the sequence is
          $2^{n}$, ratio exactly $2$ forever. The dominant root dominates only
          when its constant is not zero, so fit the constants before quoting
          a growth rate.
      - ask: >
          Last, $a_n = -a_{n-2}$ with $a_0 = 1$, $a_1 = 0$. Its characteristic
          equation is $x^{2} = -1$. What does the sequence do?
        choices:
          - text: >
              It has no solution, since $x^{2} = -1$ has no real roots.
            feedback: >
              The sequence plainly exists: $1, 0, -1, 0, 1, \dots$. The roots
              are $\pm i$, complex, and the method still works with them.
          - text: >
              It cycles $1, 0, -1, 0$ with period $4$, like $\cos(n\pi/2)$.
            correct: true
            feedback: >
              Right. Roots $\pm i$ have modulus $1$ and argument $\pi/2$, so
              they contribute $\cos(n\pi/2)$ and $\sin(n\pi/2)$: no growth,
              pure rotation.
          - text: >
              It decays to $0$, because the coefficient $-1$ has size at most
              $1$.
            feedback: >
              The size of the roots, not of the coefficient, sets growth or
              decay. Here both roots have modulus exactly $1$, so the
              sequence neither grows nor shrinks.
        feedback: >
          A conjugate pair of modulus $\rho$ and argument $\theta$ gives
          $\rho^{n}\cos(n\theta)$ and $\rho^{n}\sin(n\theta)$: modulus sets the
          size, argument the rhythm.

  - node: quant-tools.recurrences.repeated-roots
    hook: >
      A double root is the trap in "solve this recursion" questions — writing $a_n=Ar^n+Br^n$ for a repeated root $r$ gives only one genuine degree of freedom where two are needed, and the fix is a factor of $n$, not a second exponential.
    explanation: >
      Two copies of $r^{n}$ are not two independent solutions — they're the same sequence twice, so a repeated root can't be handled by simply doubling up the distinct-roots ansatz. The fix is that a root of multiplicity $m$ contributes the family $r^{n}, nr^{n}, n^{2}r^{n},\dots,n^{m-1}r^{n}$, all genuinely independent, bundled as $(A_0+A_1n+\dots+A_{m-1}n^{m-1})r^{n}$.

      The bookkeeping is the way to remember this correctly rather than guess: a root of multiplicity $m$ must supply exactly $m$ independent solutions so that the total across every root always equals $k$, the order — exactly the number of initial conditions available to pin the constants down. Miscounting the multiplicity throws off this balance.

      The smallest instance is worth keeping as an anchor: $a_n=2a_{n-1}-a_{n-2}$ has characteristic equation $(x-1)^2=0$, a double root at $1$, giving $a_n=A_0+A_1n$ — the arithmetic sequences are exactly the double-root-at-$1$ case, a useful sanity check whenever a repeated-root computation looks unfamiliar.
    worked: >
      Solve $a_n=4a_{n-1}-4a_{n-2}$ with $a_0=1$, $a_1=8$. The characteristic equation $x^2-4x+4=0$ is $(x-2)^2=0$, a double root at $2$, so $a_n=(A_0+A_1n)2^{n}$. Matching initial values: $A_0=1$, and $(A_0+A_1)2=8$ gives $A_1=3$, so $a_n=(1+3n)2^{n}$. At $n=3$: $(1+9)\cdot8=80$, matching direct iteration $a_2=4(8)-4(1)=28$, $a_3=4(28)-4(8)=80$.
    interview: >
      "The characteristic equation has a repeated root — what now?" directly checks whether you know to multiply by $n$ rather than declare the solution under-determined; it often hides inside a recursion deliberately engineered to have $(x-r)^2$ as a factor.
    pitfalls: >
      Writing $a_n=(A_0+A_1)r^n$ instead of $(A_0+A_1n)r^n$ collapses two constants into one and loses a genuine degree of freedom. For multiplicity $m>2$, forgetting the higher powers of $n$ up to $n^{m-1}$ under-supplies solutions relative to the order.
    recap: >
      A root of multiplicity $m$ contributes $(A_0+A_1n+\dots+A_{m-1}n^{m-1})r^{n}$, keeping the solution count equal to the recursion's order.
    dialogue:
      - part: A recipe that runs one constant short
        teach: >
          Take $a_n = 6a_{n-1} - 9a_{n-2}$ with $a_0 = 1$ and $a_1 = 6$, and
          run the characteristic-root recipe on it.
      - ask: >
          What are the roots of its characteristic equation?
        choices:
          - text: >
              $3$ and $-3$.
            feedback: >
              The equation is $x^{2} - 6x + 9 = 0$. Try $x = -3$:
              $9 + 18 + 9 = 36 \ne 0$. The roots of $x^{2} - 9$ are $\pm 3$;
              this is a different quadratic.
          - text: >
              $2$ and $4$.
            feedback: >
              $2 + 4 = 6$ matches the sum, but the product of the roots must be
              $9$, and $2 \cdot 4 = 8$.
          - text: >
              $3$, twice.
            correct: true
            feedback: >
              Right: $x^{2} - 6x + 9 = (x-3)^{2}$. One distinct root for an
              order-$2$ recurrence.
        feedback: >
          The recipe now offers a single geometric solution, $3^{n}$, and
          there are two initial values to match.
      - ask: >
          Try $a_n = A \cdot 3^{n}$ anyway. $a_0 = 1$ forces $A = 1$. What does
          that formula then predict for $a_1$?
        expects: "3"
        feedback: >
          $3^{1} = 3$, but $a_1 = 6$. One constant cannot be fitted to two
          values: the formula is off by a factor of $2$ already at $n = 1$.
      - ask: >
          Iterate instead. The sequence runs $1, 6, 27, 108$. What is
          $a_3/3^{3}$?
        expects: "4"
        hint: >
          Divide each term by the matching power of $3$.
        feedback: >
          $108/27 = 4$. The ratios $a_n/3^{n}$ run $1, 2, 3, 4$.
      - reflect: >
          The ratios $a_n/3^{n}$ climb by exactly $1$ each step. What
          formula for $a_n$ does that suggest, and what second solution of
          the recurrence, besides $3^{n}$, does it point to?
        answer: >
          $a_n/3^{n} = 1 + n$, so $a_n = (1 + n)\,3^{n} = 3^{n} + n\,3^{n}$.
          Since $3^{n}$ solves the recurrence and the sum solves it too, the
          difference $n\,3^{n}$ must be a solution by itself. A double root
          supplies its power times $n$ as the missing second solution.

      - part: The missing solution
        teach: >
          That is the general rule. If a root $r$ has multiplicity $m$, its
          contribution is $(A_0 + A_1 n + \dots + A_{m-1}n^{m-1})\,r^{n}$: $m$
          independent solutions from one root. Across all roots the count is
          always the order $k$, exactly the number of initial values, so the
          constants can always be fitted.
      - ask: >
          Check the claim that $n \cdot 3^{n}$ solves the recurrence at
          $n = 4$: what is $6a_3 - 9a_2$ when $a_n = n \cdot 3^{n}$?
        expects: "324"
        hint: >
          $a_3 = 3 \cdot 27$ and $a_2 = 2 \cdot 9$.
        feedback: >
          $6(81) - 9(18) = 486 - 162 = 324 = 4 \cdot 81 = a_4$. In general
          $6(n-1)3^{n-1} - 9(n-2)3^{n-2} = 3^{n}[2(n-1) - (n-2)] = n\,3^{n}$:
          the bracket collapses to $n$ exactly because $6 = 2 \cdot 3$ and
          $9 = 3^{2}$, the double-root signature.
      - ask: >
          Which of these is *not* a solution of
          $a_n = 6a_{n-1} - 9a_{n-2}$?
        choices:
          - text: >
              $(5 - 2n)\,3^{n}$
            feedback: >
              This is $A_0 + A_1 n$ times $3^{n}$ with $A_0 = 5$ and
              $A_1 = -2$, so it solves the recurrence. Negative constants are
              allowed.
          - text: >
              $n \cdot 3^{n+1}$
            feedback: >
              That is $3n \cdot 3^{n}$, a multiple of the solution
              $n\,3^{n}$, so it solves the recurrence too.
          - text: >
              $n^{2} \cdot 3^{n}$
            correct: true
            feedback: >
              Right. A double root earns a polynomial of degree $1$, not
              $2$. Check: the terms run $0, 3, 36$, and $6(3) - 9(0) = 18 \ne
              36$.
        feedback: >
          Multiplicity $m$ allows a polynomial of degree up to $m - 1$ in
          front of $r^{n}$, no higher: two solutions from a double root,
          three from a triple one.

      - part: Fitting, and miscounting
        ask: >
          New recurrence: $a_n = 8a_{n-1} - 16a_{n-2}$ with $a_0 = 2$ and
          $a_1 = 4$. What is $a_5$?
        expects: "-3072"
        hint: >
          The root is $4$, twice. Fit $(A_0 + A_1 n)\,4^{n}$: $n = 0$ gives
          $A_0$, then $n = 1$ gives $A_1$.
        feedback: >
          $A_0 = 2$ and $(2 + A_1)\,4 = 4$ give $A_1 = -1$, so
          $a_n = (2 - n)\,4^{n}$ and $a_5 = -3 \cdot 1024 = -3072$. Iterating:
          $0, -64, -512, -3072$. The sequence crosses zero at $n = 2$ and
          then runs off negative, which no pure power of $4$ could do.
      - ask: >
          A candidate writes the general solution of that recurrence as
          $(A_0 + A_1)\,4^{n}$. What is wrong?
        choices:
          - text: >
              Nothing: two constants for two initial values.
            feedback: >
              $A_0 + A_1$ is one number with two names. It cannot fit
              $a_0 = 2$ and $a_1 = 4$, which need a ratio of $2$ between them,
              not $4$.
          - text: >
              It should be $(A_0 + A_1)\,4^{n} + A_2\,(-4)^{n}$, with the
              negative root.
            feedback: >
              $(x-4)^{2} = 0$ has no root at $-4$. Adding powers of a number
              that is not a root adds non-solutions.
          - text: >
              The $A_1$ needs a factor of $n$; otherwise the two constants
              merge into one.
            correct: true
            feedback: >
              Right. $(A_0 + A_1 n)\,4^{n}$ has two genuinely independent
              pieces, which is what two initial values require.
        feedback: >
          The count is the check: an order-$k$ recurrence needs $k$
          independent solutions, and a constant that can be absorbed into
          another does not count.
      - ask: >
          $a_n = 3a_{n-1} - 3a_{n-2} + a_{n-3}$ has characteristic equation
          $(x-1)^{3} = 0$. With $a_0 = 0$, $a_1 = 1$, $a_2 = 4$, what is
          $a_3$?
        expects: "9"
        feedback: >
          $3(4) - 3(1) + 0 = 9$. The root $1$ has multiplicity $3$, so the
          solution is $(A_0 + A_1 n + A_2 n^{2}) \cdot 1^{n}$, a quadratic in
          $n$; these initial values give $a_n = n^{2}$, and the next term is
          $16$.
      - teach: >
          In an interview, when the characteristic polynomial has a square
          factor, say "repeated root, so multiply by $n$" before fitting
          anything, and count the constants against the order out loud. That
          count is what catches the $(A_0 + A_1)\,r^{n}$ slip before it costs
          you the fit.

  - node: quant-tools.recurrences.particular-solution
    hook: >
      Every inhomogeneous recursion is solved by this general-plus-particular split, and the resonance case — where the forcing term accidentally matches a homogeneous solution — is what interviewers use to check you're not just pattern-matching blindly.
    explanation: >
      Linearity is what makes the split legal: if $a_n^{(p)}$ is any single sequence satisfying $a_n=c_1a_{n-1}+\dots+c_ka_{n-k}+g(n)$, and $a_n^{(h)}$ solves the homogeneous version with $g\equiv0$, then their sum solves the full equation, and every solution arises this way — subtracting any two solutions of the full equation leaves a solution of the homogeneous one. The whole problem reduces to finding one particular solution and adding the general homogeneous family already known from characteristic roots.

      Guessing the particular solution's shape from $g(n)$'s shape works because constants, polynomials, and exponentials are each closed under the recursion's linear combination of shifted copies: a constant guess stays constant after shifting, a degree-$d$ polynomial guess stays degree $d$, and $Ab^{n}$ stays proportional to $b^n$. Substituting and matching coefficients pins down the guess's own constants directly, before touching the homogeneous constants at all.

      Resonance is the case where the guess already solves the homogeneous equation — $b$ equals a characteristic root, or $g$ is constant while $1$ is itself a root — and then the guess produces $0=g(n)$ rather than useful information. Multiplying the guess by $n$ (and again if the resonance is doubled) breaks the degeneracy the same way it did for repeated characteristic roots.
    worked: >
      Solve $a_n=2a_{n-1}+2^{n}$ with $a_0=1$. The homogeneous root is $2$, and the forcing term $2^{n}$ shares that root — resonance — so guess $a_n^{(p)}=An\cdot2^{n}$. Substituting: $An2^{n}=2A(n-1)2^{n-1}+2^{n}=A(n-1)2^{n}+2^{n}$, so $A[n-(n-1)]2^{n}=2^{n}$ gives $A=1$. The general solution is $a_n=C\cdot2^{n}+n\cdot2^{n}$, and $a_0=1$ gives $C=1$, so $a_n=(1+n)2^{n}$. At $n=3$: $(4)(8)=32$, matching direct iteration $a_1=2(1)+2=4$, $a_2=2(4)+4=12$, $a_3=2(12)+8=32$.
    interview: >
      "Solve $a_n=\dots+g(n)$" with a specific forcing term wants the shape of the guess named before any algebra — constant, matching-degree polynomial, or $Ab^n$ — and the interviewer specifically listens for whether you catch resonance rather than substituting a guess that silently gives $0=g(n)$.
    pitfalls: >
      Guessing a plain $Ab^{n}$ when $b$ is already a characteristic root produces an identity with no solution for $A$ — the multiply-by-$n$ fix is not optional there. Fitting the homogeneous constants before finding the particular solution's own constants tangles the two unnecessarily.
    recap: >
      The general solution is homogeneous plus particular; guess the particular piece in the shape of the forcing term, multiplying by $n$ whenever that guess collides with a homogeneous solution.
    dialogue:
      - part: A forcing term that will not sit still
        teach: >
          A sequence obeys $a_n = 2a_{n-1} + 3^{n}$ with $a_0 = 1$. The
          interviewer wants a closed form.
      - ask: >
          Start by hand. What is $a_3$?
        expects: "65"
        feedback: >
          $a_1 = 2 + 3 = 5$, $a_2 = 10 + 9 = 19$, $a_3 = 38 + 27 = 65$.
      - ask: >
          The first-order lesson would subtract a fixed point $L$ with
          $L = 2L + 3^{n}$. What happens?
        choices:
          - text: >
              $L = -3^{n}$, which depends on $n$, so it is no fixed point at
              all.
            correct: true
            feedback: >
              Right. A constant cannot balance a forcing term that changes
              every step. And $-3^{n}$ does not even satisfy the recurrence:
              $2(-3^{n-1}) + 3^{n} = 3^{n-1} \ne -3^{n}$.
          - text: >
              $L = 3^{n}/(1-2) = -3^{n}$, and subtracting it leaves a
              geometric sequence as before.
            feedback: >
              Subtract it and check: $a_n + 3^{n}$ is $2, 8, 28, 92$, with
              ratios $4, 3.5, 3.29$, not geometric. The formula $c/(1-r)$ was
              derived for a constant $c$.
          - text: >
              $L$ is infinite, because the forcing term grows without bound.
            feedback: >
              No number $L$, finite or not, satisfies $L = 2L + 3^{n}$ for
              every $n$ at once. The method breaks for the shape of the
              forcing term, not its size.
        feedback: >
          The fixed point worked because it was itself a solution of the full
          recurrence, one that never moved. Here nothing constant can be a
          solution.

      - part: A solution shaped like the forcing
        reflect: >
          Subtracting the fixed point worked because the fixed point was one
          particular solution of the full recurrence, and subtracting it left
          a homogeneous one. What sequence might play that role for
          $a_n = 2a_{n-1} + 3^{n}$, and why that shape?
        hint: >
          What kind of sequence, when doubled and added to $3^{n}$, could give
          back the same kind of sequence?
        answer: >
          Something shaped like the forcing term, $A \cdot 3^{n}$: doubling it
          and adding $3^{n}$ gives another multiple of $3^{n}$, so a single
          number $A$ can make the two sides agree. Once one such solution is
          found, subtracting it from $a_n$ leaves a sequence obeying the
          homogeneous rule $b_n = 2b_{n-1}$, which you already solve.
      - ask: >
          Find $A$ so that $A \cdot 3^{n}$ satisfies $a_n = 2a_{n-1} + 3^{n}$.
        expects: "3"
        hint: >
          Substitute and divide through by $3^{n-1}$.
        feedback: >
          $A \cdot 3^{n} = 2A \cdot 3^{n-1} + 3^{n}$; dividing by $3^{n-1}$ gives
          $3A = 2A + 3$, so $A = 3$ and the particular solution is
          $3^{n+1}$.
      - teach: >
          That is the method. The general solution of an inhomogeneous
          recurrence is one particular solution plus the general solution of
          the homogeneous version. Guess the particular solution in the shape
          of the forcing term: a constant for a constant, a polynomial of
          degree $d$ for one of degree $d$, $A b^{n}$ for $b^{n}$. Pin the
          guess's own constants by substituting, and fit the homogeneous
          constants to the initial values last.
      - ask: >
          Here that gives $a_n = C \cdot 2^{n} + 3^{n+1}$. Fit $a_0 = 1$, then
          compute $a_6$.
        expects: "2059"
        hint: >
          $a_0 = C + 3$.
        feedback: >
          $C + 3 = 1$ gives $C = -2$, so $a_n = 3^{n+1} - 2^{n+1}$ and
          $a_6 = 2187 - 128 = 2059$. Check $n = 3$: $81 - 16 = 65$, as by
          hand.
      - ask: >
          Why is "particular plus homogeneous" every solution, not just some?
        choices:
          - text: >
              Because the difference of any two solutions of the full
              recurrence solves the homogeneous one.
            correct: true
            feedback: >
              Right. Subtract the two equations and the $3^{n}$ cancels, so
              $a_n - 3^{n+1}$ obeys $b_n = 2b_{n-1}$ and must be $C \cdot
              2^{n}$. Every solution is caught.
          - text: >
              Because the particular solution is unique, so there is nothing
              else to find.
            feedback: >
              It is far from unique: $3^{n+1} + 5 \cdot 2^{n}$ is another
              particular solution. Any one will do, because the homogeneous
              part absorbs the difference.
          - text: >
              Because adding two solutions of the full recurrence gives a
              third.
            feedback: >
              It does not: the sum picks up the forcing term twice, $2 \cdot
              3^{n}$ instead of $3^{n}$. Sums of solutions are solutions only
              when the rule is homogeneous.
        feedback: >
          One particular solution plus everything the homogeneous rule
          allows: that is the whole solution set, because differences of
          solutions kill the forcing term.

      - part: Copying the shape, and when it fails
        ask: >
          For $b_n = 3b_{n-1} - 2n + 1$, what shape should the particular
          guess take?
        choices:
          - text: >
              $Pn$, matching the $-2n$.
            feedback: >
              Substituting $Pn$ leaves a constant term that $Pn$ cannot match
              on its own. A degree-$1$ forcing term needs the whole degree-$1$
              polynomial, constant included.
          - text: >
              $Pn + Q$, a polynomial of the same degree as $-2n + 1$.
            correct: true
            feedback: >
              Right. Two unknowns, and matching the coefficients of $n$ and of
              $1$ gives two equations.
          - text: >
              $P \cdot 3^{n}$, matching the coefficient $3$.
            feedback: >
              $3^{n}$ is the homogeneous solution; it already satisfies the
              rule without the forcing term, so it can never produce the
              $-2n + 1$.
        feedback: >
          Copy the forcing term's shape, keeping every lower-order piece.
      - ask: >
          Substitute $Pn + Q$ and match coefficients. What is $Q$?
        expects: "1"
        hint: >
          $Pn + Q = 3(P(n-1) + Q) - 2n + 1$. Match the $n$ terms first.
        feedback: >
          $n$ terms: $P = 3P - 2$, so $P = 1$. Constants: $Q = -3P + 3Q + 1$,
          so $2Q = 3P - 1 = 2$ and $Q = 1$. The particular solution is
          $n + 1$; check: $3n - 2n + 1 = n + 1$.
      - ask: >
          Now $c_n = 3c_{n-1} + 2 \cdot 3^{n}$. What happens to the guess
          $A \cdot 3^{n}$?
        choices:
          - text: >
              It gives $A = 2$, copying the coefficient.
            feedback: >
              Substitute: $A \cdot 3^{n} = 3A \cdot 3^{n-1} + 2 \cdot 3^{n} =
              A \cdot 3^{n} + 2 \cdot 3^{n}$, so $0 = 2 \cdot 3^{n}$. No value
              of $A$ works, $2$ included.
          - text: >
              It reduces to $0 = 2 \cdot 3^{n}$: no $A$ works, because
              $3^{n}$ already solves the homogeneous rule.
            correct: true
            feedback: >
              Right. That is resonance: the forcing shares a characteristic
              root, so the guess is swallowed by the homogeneous part.
          - text: >
              Any $A$ works, since $3^{n}$ appears on both sides.
            feedback: >
              The $A$ terms cancel, which is the problem, but the $2 \cdot
              3^{n}$ is left over with nothing to balance it.
        feedback: >
          Under resonance, multiply the guess by $n$ and try again.
      - ask: >
          Try $A n \cdot 3^{n}$ instead. What is $A$?
        expects: "2"
        hint: >
          Divide through by $3^{n}$ after substituting.
        feedback: >
          $A n 3^{n} = 3A(n-1)3^{n-1} + 2 \cdot 3^{n}$, so $An = A(n-1) + 2$
          and $A = 2$. The particular solution is $2n \cdot 3^{n}$. Said aloud:
          "copy the forcing term's shape; if it is already a homogeneous
          solution, multiply by $n$".

  - node: quant-tools.recurrences.boundary-conditions
    hook: >
      A correctly solved recursion with the wrong boundary values is a wrong answer that looks completely finished — this is the step interviewers probe by asking "what's $a_0$, and why exactly that?"
    explanation: >
      The first habit is counting: an order-$k$ recursion needs exactly $k$ conditions, and once a problem has multiple interacting states, each one needs its own equation, so the count of unknowns and the count of conditions must match before you try to solve anything. The second habit is sourcing the numbers from the problem's own structure rather than the algebra — a state where the goal has already been reached has $\mathbb{E}=0$ remaining steps, a state from which the goal is provably unreachable has probability $0$, and for counting problems the empty configuration usually counts as exactly one arrangement, so $a_0=1$ is the default rather than $a_0=0$.

      The third habit catches the most errors: boundary states often obey a genuinely different equation from the interior ones, because a move available in the interior simply doesn't exist at the edge. Writing the interior recursion at $n=0$ or at an edge state and hoping it still holds is the classic failure — the edge needs its own equation, derived from what can actually happen there, not inherited from the general pattern.
    worked: >
      Tilings of a $1\times n$ strip using $1\times1$ and $1\times2$ tiles satisfy $a_n=a_{n-1}+a_{n-2}$ (condition on whether the last cell is a single tile or the tail of a domino), but the boundary values come from the problem, not the recursion: the empty strip has exactly one tiling, so $a_0=1$, and a length-$1$ strip has exactly one tiling, so $a_1=1$. Iterating: $a_2=2$, $a_3=3$, $a_4=5$, $a_5=8$ — eight tilings of a $1\times5$ strip.
    interview: >
      "What are your boundary conditions, and where do they come from?" is asked directly after you write a recursion, and a vague "the initial values" answer fails it — the interviewer wants the specific state-by-state reasoning behind each number.
    pitfalls: >
      Assuming $a_0=0$ by default for a counting problem is wrong whenever the empty configuration is itself a valid arrangement. Applying the interior recursion at an edge state missing one of the interior's available moves silently produces an equation that doesn't describe that state at all.
    recap: >
      Count the conditions the recursion's order demands, read their values off the problem's absorbing and edge states directly, and never assume the interior equation also holds at the boundary.
    dialogue:
      - part: Eight stairs, strides of one or three
        teach: >
          You climb a staircase of $8$ steps, each stride covering either $1$
          step or $3$. Order matters: $1, 3$ and $3, 1$ are different climbs.
          Let $a_n$ be the number of ways to climb $n$ steps.
      - ask: >
          Condition on the last stride. Which recurrence holds?
        choices:
          - text: >
              $a_n = a_{n-1} + a_{n-2} + a_{n-3}$
            feedback: >
              That would allow a stride of $2$. The last stride is $1$ or $3$
              only, so only $a_{n-1}$ and $a_{n-3}$ appear.
          - text: >
              $a_n = a_{n-1} + a_{n-3}$
            correct: true
            feedback: >
              Right. A climb ending in a $1$-stride is any climb of $n - 1$
              steps plus that stride; one ending in a $3$-stride is any climb
              of $n - 3$ plus it.
          - text: >
              $a_n = a_{n-1} + a_{n-3} + 1$
            feedback: >
              Every climb is already counted by its last stride, so there is
              nothing left over to add. A $+1$ would count some climb twice
              or invent one.
        feedback: >
          The recurrence comes from the last move. It reaches three places
          back, which settles how many values the problem must supply.
      - ask: >
          How many initial values does this recurrence need?
        expects: "3"
        feedback: >
          Order $3$, so three: $a_0$, $a_1$ and $a_2$. The coefficient of
          $a_{n-2}$ is $0$, but the window still reaches $a_{n-3}$.
      - ask: >
          A colleague sets $a_0 = 0$ ("no steps, no ways"), $a_1 = 1$,
          $a_2 = 1$, and the recurrence then gives $a_3 = 1$. Count the
          climbs of $3$ steps directly. How many are there?
        expects: "2"
        feedback: >
          $1, 1, 1$ and a single $3$: two climbs. The recurrence said $1$,
          so one of its inputs was wrong. $a_1 = 1$ and $a_2 = 1$ are right
          (only $1$-strides fit), which leaves $a_0$.
      - reflect: >
          Which value of $a_0$ makes $a_3 = a_2 + a_0$ come out right, and
          what does that value mean about climbing zero steps?
        answer: >
          $a_0 = 1$. The term $a_0$ inside $a_3$ counts the climbs that end
          in a $3$-stride, and there is exactly one: take the stride from the
          ground. So the empty climb, doing nothing, has to count as one way
          to climb zero steps. The value comes from what the problem counts,
          not from what looks natural in the algebra.
      - part: Where the constants come from
        teach: >
          The constants of any recurrence come from the boundary. Count
          first: order $k$ needs $k$ conditions, and a system of states needs
          one equation per state. Then take them from the problem, not the
          algebra: the empty arrangement is usually one arrangement, so
          $a_0 = 1$; a state where the goal is already reached has expected
          remaining time $0$; a state from which the goal is impossible has
          probability $0$.
      - ask: >
          With $a_0 = a_1 = a_2 = 1$, how many ways are there to climb all
          $8$ steps?
        expects: "13"
        feedback: >
          $a_3 = 2$, $a_4 = 3$, $a_5 = 4$, $a_6 = 6$, $a_7 = 9$,
          $a_8 = 9 + 4 = 13$. With $a_0 = 0$ the same run would have given
          $1, 2, 3, 4, 6, 9$, wrong from $a_3$ on, and
          by $a_8$ off by four.

      - part: A wall at one end
        teach: >
          Now a walk. A token sits on positions $0, 1, 2, 3$. From $1$ or $2$
          it steps left or right with probability $\tfrac12$ each. Position
          $0$ is a wall: from there it always steps to $1$. Position $3$ is the
          exit. Let $E_k$ be the expected number of steps to exit from
          position $k$.
      - ask: >
          Which equation holds at position $0$?
        choices:
          - text: >
              $E_0 = 1 + \tfrac12 E_{-1} + \tfrac12 E_1$, the same rule as
              everywhere else.
            feedback: >
              There is no position $-1$. At the wall one of the interior's two
              moves is unavailable, so the interior rule does not describe
              this state.
          - text: >
              $E_0 = 0$, since boundary values are zero.
            feedback: >
              Zero belongs to the exit, where no steps remain. From the wall
              the token still has the whole board to cross.
          - text: >
              $E_0 = 1 + E_1$: one step, always to position $1$.
            correct: true
            feedback: >
              Right. The wall has its own equation, read off its own move.
        feedback: >
          That is the third habit: check every edge state, because at an edge
          one of the interior's moves is unavailable and the interior
          recurrence simply does not hold there. The exit contributes the
          known value $E_3 = 0$; the wall contributes an equation, not a
          value.
      - ask: >
          Solve the system. What is $E_0$?
        expects: "9"
        hint: >
          $E_2 = 1 + \tfrac12 E_1$, using $E_3 = 0$. Substitute that and
          $E_0 = 1 + E_1$ into the equation for $E_1$.
        feedback: >
          $E_1 = 1 + \tfrac12(1 + E_1) + \tfrac12(1 + \tfrac12 E_1) = 2 +
          \tfrac34 E_1$, so $E_1 = 8$, then $E_2 = 5$ and $E_0 = 9$. Each is at
          least $1$ and they shrink toward the exit, as they should.
      - ask: >
          What is the probability that the token, started at $0$, eventually
          leaves through the exit?
        expects: "1"
        hint: >
          Write $p_k$ for that probability. What values does the problem
          give, and what does the wall say about $p_0$?
        feedback: >
          The problem gives $p_3 = 1$ and no losing state at all; the wall
          says $p_0 = p_1$; the interior says each $p_k$ averages its
          neighbours. All ones satisfy every equation. With nowhere else to
          end, the exit is certain, and your boundary conditions should
          say so before any algebra does.

  - node: quant-tools.recurrences.fibonacci
    hook: >
      Fibonacci is the running example the rest of this unit's algebra gets tested against, and Binet's formula — not just the recursion — is what interviewers actually want when they ask for "a formula for the $n$-th Fibonacci number."
    explanation: >
      Fibonacci is the smallest interesting instance of the characteristic-root machinery: substituting $a_n=x^n$ into $F_n=F_{n-1}+F_{n-2}$ gives $x^2=x+1$, whose two roots are the golden ratio $\varphi=(1+\sqrt5)/2\approx1.618$ and its conjugate $\psi=(1-\sqrt5)/2\approx-0.618$. Matching the initial values $F_1=F_2=1$ to the general solution $A\varphi^n+B\psi^n$ produces Binet's formula, $F_n=(\varphi^{n}-\psi^{n})/\sqrt5$ — an irrational-looking expression that always evaluates to an integer.

      It's usable for fast estimation because $|\psi|<1$, so $\psi^n\to0$ and the second term becomes negligible almost immediately; $F_n$ is exactly the nearest integer to $\varphi^{n}/\sqrt5$ for every $n\ge1$. That's also why the ratio of consecutive terms converges to $\varphi$: Fibonacci grows geometrically at rate $1.618$ per step, not linearly and not exponentially with any other base.

      Every other order-$2$ recursion of the form $a_n=a_{n-1}+a_{n-2}$ shares this exact pair of characteristic roots regardless of its initial values — only the constants $A,B$ change, so recognizing the shape $a_n=a_{n-1}+a_{n-2}$ should trigger $\varphi$ and $\psi$ immediately, without rederiving the characteristic equation each time.
    worked: >
      Estimate $F_{10}$ via Binet without the recursion: $\varphi^{10}\approx122.9919$, and dividing by $\sqrt5\approx2.23607$ gives $\approx55.0036$. Rounding to the nearest integer gives $55$, matching the true value exactly.
    interview: >
      "Give a closed-form formula for the $n$-th Fibonacci number" wants Binet's formula produced from the characteristic equation, not recited from memory; a fast-estimation version, "roughly how big is $F_{30}$," wants $\varphi^{30}/\sqrt5$ used directly rather than iterating thirty steps.
    pitfalls: >
      Using $F_1=F_2=1$ versus an $F_0=0,F_1=1$ indexing convention shifts every subscript by one — confirm which convention a problem uses before quoting a specific term. Dropping the $\psi^n$ term entirely rather than just rounding is only valid because it's small, not because it's exactly zero.
    recap: >
      Fibonacci's characteristic roots are $\varphi=(1+\sqrt5)/2$ and its conjugate, giving Binet's formula and geometric growth at rate $\varphi\approx1.618$ per step.
    dialogue:
      - part: The ratio that settles
        ask: >
          With $F_1 = F_2 = 1$ and $F_n = F_{n-1} + F_{n-2}$, the twelfth and
          thirteenth terms are $144$ and $233$. What is $F_{13}/F_{12}$, to
          three decimal places?
        expects: "1.618"
        tolerance: 0.0005
        feedback: >
          $233/144 \approx 1.6181$. Earlier ratios swing around it:
          $8/5 = 1.6$, $13/8 = 1.625$, $21/13 \approx 1.615$, closing in from
          both sides.
      - reflect: >
          Suppose the ratios $F_{n+1}/F_n$ settle at some number $x$. Divide
          the recurrence $F_{n+1} = F_n + F_{n-1}$ by $F_n$: what equation
          must $x$ satisfy, and where have you met that equation before?
        hint: >
          $F_{n-1}/F_n$ is the reciprocal of a ratio that also tends to $x$.
        answer: >
          $F_{n+1}/F_n = 1 + F_{n-1}/F_n$, and in the limit $x = 1 + 1/x$,
          that is $x^{2} = x + 1$. That is the characteristic equation of the
          recurrence: the limiting ratio is its dominant root, exactly as
          characteristic roots predict for any linear recurrence.
      - ask: >
          What are the roots of $x^{2} = x + 1$?
        choices:
          - text: >
              $1.618$ and $0.618$, approximately.
            feedback: >
              The product of the roots of $x^{2} - x - 1$ is $-1$, so one root
              is negative. $0.618 \cdot 1.618 \approx 1$, wrong sign.
          - text: >
              $\varphi = (1+\sqrt{5})/2 \approx 1.618$ and
              $\psi = (1-\sqrt{5})/2 \approx -0.618$.
            correct: true
            feedback: >
              Right. They sum to $1$ and multiply to $-1$, as the coefficients
              of $x^{2} - x - 1$ require.
          - text: >
              Only $\varphi \approx 1.618$; the ratio cannot be negative.
            feedback: >
              The ratio's limit is positive, but the quadratic has two roots
              and the general solution uses both. The negative one is what
              makes the ratios swing above and below $\varphi$.
        feedback: >
          So $F_n = A\varphi^{n} + B\psi^{n}$ for some constants. Two initial
          values will fix them.

      - part: Fitting the constants
        ask: >
          The algebra is cleanest from $F_0$. Run the recurrence backwards
          from $F_1 = F_2 = 1$: what is $F_0$?
        expects: "0"
        feedback: >
          $F_2 = F_1 + F_0$ gives $1 = 1 + F_0$, so $F_0 = 0$. That makes the
          first fitting equation $A + B = 0$.
      - ask: >
          With $B = -A$, the condition $F_1 = 1$ reads
          $A(\varphi - \psi) = 1$. What is $\varphi - \psi$?
        choices:
          - text: >
              $1$
            feedback: >
              $1$ is $\varphi + \psi$, the sum of the roots. The difference
              keeps the $\sqrt{5}$ terms and drops the $1$s.
          - text: >
              $\sqrt{5}$
            correct: true
            feedback: >
              Right: $(1+\sqrt{5})/2 - (1-\sqrt{5})/2 = \sqrt{5}$. So
              $A = 1/\sqrt{5}$ and $B = -1/\sqrt{5}$.
          - text: >
              $-1$
            feedback: >
              $-1$ is the product $\varphi\psi$. The difference is
              $\sqrt{5}$, which is where the $\sqrt{5}$ in the formula comes
              from.
        feedback: >
          Two initial values, two constants, both now fixed.
      - teach: >
          That is Binet's formula, $F_n = (\varphi^{n} - \psi^{n})/\sqrt{5}$:
          irrational pieces that cancel to an integer every time. It is the
          characteristic-root method, run on the recurrence whose dominant
          root is the golden ratio.
      - ask: >
          How large can the second piece, $\lvert \psi^{n}/\sqrt{5} \rvert$,
          be for $n \ge 1$?
        choices:
          - text: >
              Less than $1/2$, so rounding $\varphi^{n}/\sqrt{5}$ to the
              nearest integer gives $F_n$ exactly.
            correct: true
            feedback: >
              Right. At $n = 1$ it is $0.618/2.236 \approx 0.276$, and it
              shrinks by a factor $0.618$ each step after that.
          - text: >
              Exactly $0$ for large $n$, so it can be dropped.
            feedback: >
              $\psi^{n}$ is never zero; it only becomes small. The rounding
              works because the error is under $1/2$, not because it vanishes.
          - text: >
              It grows with $n$, since $\psi^{n}$ is a power.
            feedback: >
              Powers of a number of size $0.618$ shrink: $\lvert \psi
              \rvert^{10} \approx 0.008$. Only roots of size above $1$ grow.
        feedback: >
          The dominant root carries the whole answer up to rounding; the other
          root only decides the sign of the small error, and so the side from
          which the ratios approach $\varphi$.
      - ask: >
          $\varphi^{20} \approx 15126.99993$ and $\sqrt{5} \approx 2.2360680$.
          What is $F_{20}$?
        expects: "6765"
        feedback: >
          $15126.99993/2.2360680 \approx 6765.00003$, which rounds to $6765$.
          No twenty-step iteration needed.

      - part: Same rule, a different start
        ask: >
          Now $a_n = a_{n-1} + a_{n-2}$ with $a_1 = 1$ and $a_2 = 4$:
          $1, 4, 5, 9, 14, 23, 37, \dots$. What does $a_{n+1}/a_n$ tend to, to
          three decimal places?
        expects: "1.618"
        tolerance: 0.0005
        feedback: >
          The same $\varphi$. The recurrence alone fixes the roots, and the
          constant on $\varphi^{n}$ is not zero here, so it dominates:
          $411/254 \approx 1.618$ a few terms later.
      - ask: >
          Is $a_n$ also the nearest integer to $\varphi^{n}/\sqrt{5}$?
        choices:
          - text: >
              Yes: same recurrence, same roots, same formula.
            feedback: >
              Same roots, different constants. At $n = 7$,
              $\varphi^{7}/\sqrt{5} \approx 12.98$, while $a_7 = 37$.
          - text: >
              Yes, after shifting the index by one.
            feedback: >
              No shift matches: $1, 4, 5, 9$ is not a run of Fibonacci
              numbers, since $4$ is not one.
          - text: >
              No: the initial values set different constants
              $A\varphi^{n} + B\psi^{n}$, so only the growth rate is shared.
            correct: true
            feedback: >
              Right. Every sequence obeying this recurrence grows like a
              multiple of $\varphi^{n}$; Binet's particular constants belong to
              $F_1 = F_2 = 1$ alone.
        feedback: >
          The recurrence fixes the roots; the initial values fix the
          constants. Said in an interview: "characteristic roots
          $(1 \pm \sqrt{5})/2$, so growth at the golden ratio, about $1.618$
          per step, and the exact terms by rounding $\varphi^{n}/\sqrt{5}$".

  - node: quant-tools.recurrences.no-consecutive-heads
    hook: >
      "Count binary strings avoiding a bad pattern" is one of the most common counting-by-recursion questions asked, and the reflex is conditioning on the first symbol, exactly the way first-order recursions get built.
    explanation: >
      Conditioning on the first toss splits the counting problem cleanly: if it's a tail, whatever follows just needs to be a valid length-$(n-1)$ string on its own, contributing $a_{n-1}$; if it's a head, the next toss is forced to be a tail (or the string ends), and the two together leave a valid length-$(n-2)$ string behind them, contributing $a_{n-2}$. Adding these gives $a_n=a_{n-1}+a_{n-2}$ — the Fibonacci recursion, but with its own boundary values $a_1=2$, $a_2=3$ rather than Fibonacci's own, which shifts the indexing to $a_n=F_{n+2}$.

      The alternate derivation by direct counting is worth keeping because it generalizes further: laying down the $n-k$ tails first creates $n-k+1$ gaps to drop $k$ non-adjacent heads into, giving $\binom{n-k+1}{k}$ strings with exactly $k$ heads, and summing over every valid $k$ must recover the same total as the recursion — a genuine cross-check, since both are counting the identical set of strings.

      The pattern to recognize: any "no two adjacent [something]" counting question, not just heads in coin tosses, reduces to this same first-symbol conditioning and lands on a Fibonacci-shifted count.
    worked: >
      For $n=6$: the recursion gives $a_6=F_8=21$ out of $2^6=64$ total strings, probability $21/64\approx0.328$. The binomial cross-check: $\binom{7}{0}+\binom{6}{1}+\binom{5}{2}+\binom{4}{3}=1+6+10+4=21$, matching exactly.
    interview: >
      "How many length-$n$ binary strings have no two consecutive $1$s" is the canonical phrasing; the interviewer listens for the first-symbol conditioning producing $a_n=a_{n-1}+a_{n-2}$ live, and for correctly stating the answer is $F_{n+2}$, not $F_n$.
    pitfalls: >
      Misplacing the Fibonacci index shift — quoting $F_n$ instead of $F_{n+2}$ — gives numbers close to but wrong for small $n$. Getting the boundary values $a_1=2$, $a_2=3$ wrong (rather than Fibonacci's own $F_1=F_2=1$) propagates an off-by-a-constant error through every later term.
    recap: >
      Conditioning on the first toss gives $a_n=a_{n-1}+a_{n-2}=F_{n+2}$ for strings avoiding two consecutive heads — $21$ of $64$ strings at $n=6$.
    dialogue:
      - part: A risk rule over eight days
        teach: >
          A desk flags any strategy that loses two days in a row. Over $8$
          trading days, each day is independently a win or a loss with
          probability $\tfrac12$. The interviewer asks for the probability
          that the strategy is never flagged.
      - ask: >
          Start small. Over $3$ days, how many of the $8$ win/loss strings
          contain no two consecutive losses?
        expects: "5"
        hint: >
          List them by the number of losses: none, one, two.
        feedback: >
          $WWW$; $LWW$, $WLW$, $WWL$; $LWL$. Five. Listing all $256$ strings
          for $8$ days is the same idea with $32$ times as many strings.
      - ask: >
          Condition on day $1$ instead. If day $1$ is a loss, what does the
          rest of a valid string look like?
        choices:
          - text: >
              Any valid string of length $7$.
            feedback: >
              A valid string of length $7$ may start with a loss, and $L$
              followed by $L$ is exactly what is banned.
          - text: >
              A forced win on day $2$, then any valid string of length $6$.
            correct: true
            feedback: >
              Right. After $LW$ the past no longer constrains anything: the
              last $6$ days are a fresh, free problem.
          - text: >
              A forced win on day $2$, then any string at all of length $6$.
            feedback: >
              The win on day $2$ only protects day $2$. The last $6$ days can
              still contain $LL$ among themselves, so they must be valid too.
        feedback: >
          A loss costs two days and leaves a free problem of length $n - 2$.
      - reflect: >
          Now the other branch: day $1$ is a win. Put the two branches
          together. What recurrence does $a_n$, the number of valid strings
          of length $n$, satisfy, and why are the two branches never double
          counted?
        answer: >
          After a win, the remaining $n - 1$ days form any valid string, so
          that branch contributes $a_{n-1}$; the loss branch contributes
          $a_{n-2}$. Hence $a_n = a_{n-1} + a_{n-2}$. The branches are
          disjoint because they disagree on day $1$, and together they cover
          every valid string. It is the Fibonacci recurrence, so only the
          starting values remain to be read off.

      - part: Starting values and the count
        ask: >
          $a_1 = 2$ (a lone $W$ or $L$ is fine). What is $a_2$?
        expects: "3"
        feedback: >
          $WW$, $WL$, $LW$; only $LL$ is out. So $a_2 = 3$, and indeed
          $a_3 = 3 + 2 = 5$, matching your list.
      - ask: >
          How many valid strings are there over $8$ days?
        expects: "55"
        feedback: >
          $2, 3, 5, 8, 13, 21, 34, 55$: $a_8 = 55$.
      - ask: >
          Which Fibonacci number is $a_8$, with $F_1 = F_2 = 1$?
        choices:
          - text: >
              $F_8$
            feedback: >
              $F_8 = 21$. The valid counts start at $2, 3$, which are $F_3$
              and $F_4$, so the index runs two ahead.
          - text: >
              $F_{10}$
            correct: true
            feedback: >
              Right: $a_n = F_{n+2}$, since $a_1 = 2 = F_3$ and
              $a_2 = 3 = F_4$ and the recurrences agree.
          - text: >
              $F_9$
            feedback: >
              $F_9 = 34 = a_7$. One off: $a_1 = 2$ is $F_3$, so the shift is
              two, not one.
        feedback: >
          Same recurrence, starting values two places along, so the whole
          sequence is Fibonacci shifted by two.
      - ask: >
          What is the probability the strategy is never flagged over the $8$
          days?
        expects: "55/256"
        tolerance: 0.0005
        feedback: >
          $55/2^{8} = 55/256 \approx 0.215$. Not much better than one in five,
          for a rule that sounds lenient.

      - part: The same count, by number of losses
        ask: >
          How many valid $8$-day strings have exactly $3$ losses?
        expects: "20"
        hint: >
          Lay down the $5$ wins first. Where may the losses go so that no
          two touch?
        feedback: >
          The $5$ wins leave $6$ gaps (before, between, after), and each gap
          takes at most one loss, so choose $3$ of the $6$: $\binom{6}{3} =
          20$.
      - ask: >
          What is the largest number of losses a valid $8$-day string can
          contain?
        expects: "4"
        feedback: >
          $k$ losses need $k$ of the $8 - k + 1$ gaps, so $k \le 9 - k$ and
          $k \le 4$, as in $LWLWLWLW$. Summing $\binom{9-k}{k}$ for
          $k = 0, \dots, 4$: $1 + 8 + 21 + 20 + 5 = 55$, the recurrence's
          answer from a completely different count.
      - teach: >
          Two independent counts landing on $55$ is the check an interviewer
          likes to see. The answer said aloud: "condition on the first day,
          get Fibonacci shifted by two, so $F_{10} = 55$ of $256$, about
          $21\%$".

  - node: quant-tools.recurrences.first-step-analysis
    hook: >
      This is the single most reused technique in the whole quant-interview probability toolkit: almost every "expected number of steps" or "probability of reaching a goal" question is exactly this recipe wearing different clothes.
    explanation: >
      The move is to condition on the outcome of the very next step and let the same unknown reappear on the right-hand side, because after one step a process that restarts in a recognisable situation is, probabilistically, back at square one — this is the tower property applied to the first move, not an approximation. Naming one unknown per distinct state is the setup: $E_s$ for the expected remaining steps from state $s$, or $p_s$ for the probability of some fixed target outcome starting from $s$.

      The two equation shapes differ in one place worth memorizing precisely: $E_s=1+\sum_t\Pr(s\to t)E_t$ carries an explicit $+1$, because every step taken costs one unit of time regardless of where it lands, while $p_s=\sum_t\Pr(s\to t)p_t$ carries no additive constant at all, because a probability only cares about the eventual endpoint, not how many steps it took. Confusing these two forms — adding a $1$ to a probability equation, or forgetting it in an expectation equation — is a common and easy-to-miss error.

      Once every state has its equation, the known values at absorbing states go in, and what remains is pure linear algebra: back-substitute where the transitions allow it, or solve simultaneously otherwise.
    worked: >
      A mouse starts in room $A$, which leads to $B$ or $C$ with equal probability; $B$ leads to cheese (absorbing success) or back to $A$, each with probability $\tfrac12$; $C$ leads to a trap (absorbing failure) or back to $A$, each with probability $\tfrac12$. Let $p_X$ be the probability of reaching cheese from room $X$. Then $p_B=\tfrac12(1)+\tfrac12p_A$, $p_C=\tfrac12(0)+\tfrac12p_A$, and $p_A=\tfrac12p_B+\tfrac12p_C$. Substituting: $p_A=\tfrac12\left(\tfrac12+\tfrac12p_A\right)+\tfrac12\left(\tfrac12p_A\right)=\tfrac14+\tfrac12p_A$, so $p_A=\tfrac12$.
    interview: >
      "What's the expected number of steps until..." or "what's the probability this process ends in state X before state Y" are both first-step analysis; the interviewer wants the equation for a generic state written down, with the $+1$ or its absence justified explicitly, before any solving happens.
    pitfalls: >
      Writing an expectation equation without the $+1$, or a probability equation with a stray constant added, produces plausible-looking equations that solve to the wrong numbers. Forgetting to give every reachable state its own unknown — collapsing two states with different futures into one — under-specifies the system.
    recap: >
      Condition on the first step, write $E_s=1+\sum_t\Pr(s\to t)E_t$ or $p_s=\sum_t\Pr(s\to t)p_t$, impose the known boundary values, and solve the resulting linear system.
    dialogue:
      - part: A shootout, summed the slow way
        teach: >
          Two players take turns shooting at a target, Ana first. Ana hits
          with probability $0.4$ on each shot, Ben with probability $0.3$,
          independently. The first to hit wins. The interviewer wants the
          probability that Ana wins.
      - ask: >
          What is the probability that Ana wins on her first or her second
          shot?
        expects: "0.568"
        tolerance: 0.0005
        hint: >
          Her second shot happens only if she misses and then Ben misses.
        feedback: >
          $0.4 + (0.6)(0.7)(0.4) = 0.4 + 0.168 = 0.568$. Her third shot adds
          $(0.42)^{2}(0.4)$, and so on: a geometric series in $0.42$.
      - ask: >
          Ana misses, then Ben misses. How does the situation compare with the
          start?
        choices:
          - text: >
              Ana is now behind, since she has used up a shot.
            feedback: >
              Nothing is used up: there is no shot limit, and each shot is
              independent of the past. The misses leave no trace on the
              future.
          - text: >
              It is exactly the start again: Ana to shoot, nobody has hit.
            correct: true
            feedback: >
              Right. The future from here is a copy of the future from the
              start, so Ana's chance of winning from here is the same unknown
              number.
          - text: >
              Ben is now favoured, since the probabilities shift after a miss.
            feedback: >
              Independence means a miss changes nothing about later shots.
              Thinking the next hit is "due" is the gambler's fallacy.
        feedback: >
          A process that returns to a situation it has been in before lets the
          unknown appear on both sides of an equation.
      - reflect: >
          Call Ana's winning probability $p$. Using that observation, write
          one equation for $p$ without summing any series, and say why it is
          exact rather than an approximation.
        hint: >
          Split on what happens in the first round: Ana hits; Ana misses and
          Ben hits; both miss.
        answer: >
          $p = 0.4 \cdot 1 + 0.6 \cdot 0.3 \cdot 0 + 0.6 \cdot 0.7 \cdot p$,
          that is $p = 0.4 + 0.42p$. It is exact because it is the law of total
          probability over the first round's three outcomes: given that both
          missed, the conditional chance that Ana wins is $p$ itself, since
          the game restarts. The infinite series is folded into the $p$ on the
          right.
      - ask: >
          Solve it. What is $p$?
        expects: "20/29"
        tolerance: 0.0005
        feedback: >
          $0.58p = 0.4$, so $p = 40/58 = 20/29 \approx 0.690$. The series
          $0.4\,(1 + 0.42 + 0.42^{2} + \dots) = 0.4/0.58$ agrees, as it must.

      - part: One unknown per state
        teach: >
          That is first-step analysis. Name one unknown per distinct state:
          $p_s$ for the probability of the good outcome from $s$, or $E_s$ for
          the expected remaining steps. Condition on the first step:
          $p_s = \sum_t \Pr(s \to t)\,p_t$ and
          $E_s = 1 + \sum_t \Pr(s \to t)\,E_t$, the $1$ paying for the step
          just taken. Impose the known values at absorbing states, and solve.
          Here the states are "Ana to shoot" and "Ben to shoot".
      - ask: >
          Let $p_B$ be Ana's winning probability when it is Ben's turn to
          shoot. What is $p_B$?
        expects: "14/29"
        tolerance: 0.0005
        hint: >
          From Ben's turn: he hits and Ana has lost, or he misses and it is
          Ana's turn.
        feedback: >
          $p_B = 0.3 \cdot 0 + 0.7\,p_A = 0.7 \cdot 20/29 = 14/29 \approx
          0.483$. Paired with $p_A = 0.4 + 0.6\,p_B$ it gives the same
          $p_A = 20/29$: two states, two equations.
      - ask: >
          Now the expected number of shots fired in the whole game, $E_A$
          from Ana's turn. Which equation is right?
        choices:
          - text: >
              $E_A = 0.6\,E_B$
            feedback: >
              This forgets the shot Ana is about to take. Without the $1$, the
              system solves to $E_A = 0$, which no game that fires at least one
              shot can have.
          - text: >
              $E_A = 1 + 0.6\,E_B$
            correct: true
            feedback: >
              Right. Her shot costs $1$; with probability $0.4$ the game ends
              (contributing $0$ further shots), and with $0.6$ it passes to
              Ben's turn.
          - text: >
              $E_A = 1 + 0.4 + 0.6\,E_B$
            feedback: >
              The hit is already paid for by the $1$; adding $0.4$ counts that
              shot twice. A finished game contributes $0$ further shots.
        feedback: >
          Expectation equations carry the $+1$ for the step taken; probability
          equations carry none, because only where the process ends matters.
      - ask: >
          With $E_B = 1 + 0.7\,E_A$, what is $E_A$?
        expects: "80/29"
        tolerance: 0.001
        feedback: >
          $E_A = 1 + 0.6(1 + 0.7E_A) = 1.6 + 0.42E_A$, so
          $E_A = 1.6/0.58 = 80/29 \approx 2.759$ shots. At least $1$, as it
          must be.

      - part: Where the recipe goes wrong
        ask: >
          A candidate uses a single unknown $q$ for "the shooter's chance of
          eventually winning", writing $q = 0.4 + 0.6(1 - q)$. What is wrong?
        choices:
          - text: >
              Nothing: after a miss the roles swap, so the other player's
              chance is $1 - q$.
            feedback: >
              The roles swap but the players do not have the same accuracy:
              Ben's chance as the shooter is not Ana's. One unknown cannot
              stand for two states with different futures.
          - text: >
              It merges "Ana to shoot" and "Ben to shoot", which have
              different futures, into one state.
            correct: true
            feedback: >
              Right. Their equation solves to $q = 1/1.6 = 0.625$, not
              $20/29$. With equal accuracies the merge would be legitimate;
              here it is not.
          - text: >
              It needs a $+1$ for the shot taken.
            feedback: >
              The $+1$ belongs in expectation equations. A probability
              equation adds none; this one's flaw is the state, not the
              constant.
        feedback: >
          Too few states is the commonest failure: if two situations have
          different futures, they need different unknowns. In an interview,
          name the states out loud before writing a single equation.

  - node: quant-tools.recurrences.first-head
    hook: >
      This is the fastest possible derivation of a geometric random variable's mean, and interviewers use it specifically to see whether you reach for one first-step equation instead of summing an infinite series live.
    explanation: >
      Every toss costs one unit of time no matter what happens next, which is exactly the $+1$ in a first-step expectation equation; with probability $p$ that toss is a head and the process stops, and with the remaining probability $1-p$ the coin is memoryless — the very next toss faces exactly the same waiting problem as the first one did, so the same unknown $E$ reappears unchanged on the right. That gives $E=1+(1-p)E$ directly, with no case-by-case unrolling required.

      Solving is one line: $E-(1-p)E=1$, so $pE=1$, giving $E=1/p$. This is the entire content of "the mean of a geometric distribution is $1/p$," derived without ever writing $\sum_{k\ge1}kp(1-p)^{k-1}$ — the first-step equation is strictly faster and generalizes immediately to any restart-on-failure waiting-time problem, not just coins.

      The template to recognize: any process where a single trial either ends things or resets you exactly to the start reduces to $E=1+(1-\Pr[\text{success}])E$, regardless of what the trial physically is.
    worked: >
      Each day, independently, there is a $15\%$ chance of rain. The expected number of days until the first rainy day satisfies $E=1+0.85E$, so $0.15E=1$ and $E=1/0.15=20/3\approx6.67$ days.
    interview: >
      "Roll a die until you get a six — what's the expected number of rolls?" is answered immediately with $1/p=6$ via this one-line equation, not by summing the geometric series. A dressed-up version, applying to job applications or repeated trials, is the identical structure.
    pitfalls: >
      This only works because the failure outcome genuinely resets you to the exact starting state — if failure changes your situation, such as partial progress toward a longer pattern, the same unknown can't reappear unchanged and a richer state system is needed instead. Forgetting to divide by $p$ and reporting $E=1-p$ or similar is an easy mechanical slip under time pressure.
    recap: >
      $E=1+(1-p)E$ solves to $E=1/p$ — no series needed, and it is the template for any single-trial-resets-you waiting time.
    dialogue:
      - part: An order waiting to fill
        teach: >
          A resting limit order fills in any given minute with probability
          $0.2$, independently of every other minute. The interviewer asks
          for the expected number of minutes until it fills, counting the
          minute in which it fills.
      - ask: >
          First, the probability that it fills in exactly minute $3$.
        expects: "0.128"
        tolerance: 0.0005
        feedback: >
          Two unfilled minutes, then a fill: $(0.8)^{2}(0.2) = 0.128$. The
          expectation is $\sum_{k \ge 1} k\,(0.2)(0.8)^{k-1}$, a series you
          can sum by differentiating a geometric series, and would rather
          not under time pressure.
      - ask: >
          Ten minutes have passed with no fill. Compared with the moment the
          order was placed, the expected number of further minutes is:
        choices:
          - text: >
              Smaller: the fill is overdue, and ten minutes are already
              served.
            feedback: >
              Each minute fills with probability $0.2$ regardless of the past,
              so nothing is overdue. Expecting the past to pull the fill
              closer is the gambler's fallacy.
          - text: >
              Larger: ten failures suggest the order sits at a bad price.
            feedback: >
              That would be true if the fill probability were uncertain and
              being learned. Here it is fixed at $0.2$ by assumption, so the
              failures carry no information.
          - text: >
              The same: the order faces exactly the situation it faced at the
              start.
            correct: true
            feedback: >
              Right. Independent minutes with a fixed fill chance make every
              unfilled minute a restart.
        feedback: >
          The waiting problem renews itself after every failure. That is the
          whole trick.

      - part: One step, then start over
        reflect: >
          Call the expected wait $E$. Condition on the first minute alone,
          and write an equation for $E$ with $E$ on both sides. Why is the
          term after a failure exactly $E$ again?
        answer: >
          The first minute always costs $1$. With probability $0.2$ it fills
          and nothing more is needed; with probability $0.8$ it does not, and
          the order is back in its starting situation, so the expected
          further wait is $E$ again. Hence $E = 1 + 0.2 \cdot 0 + 0.8\,E$. The
          series has been replaced by the observation that failure resets.
      - ask: >
          Solve $E = 1 + 0.8E$. What is $E$, in minutes?
        expects: "5"
        feedback: >
          $0.2E = 1$, so $E = 5$. In general $E = 1 + (1-p)E$ gives $pE = 1$
          and $E = 1/p$: the mean of the geometric law, in one line.
      - teach: >
          This is the template for every waiting-time question: take one
          step; either you are done, or you are back exactly where you
          started. If the reset is exact, $E = 1/p$, with no series to sum.
      - ask: >
          You roll a fair die until it shows a $5$ or a $6$. What is the
          expected number of rolls?
        expects: "3"
        feedback: >
          Success has probability $2/6 = 1/3$, so $E = 1/(1/3) = 3$. The two
          winning faces simply merge into one success.

      - part: Counting the right thing
        ask: >
          Back to the order. What is the expected number of *unfilled*
          minutes before the fill?
        expects: "4"
        hint: >
          Every minute up to and including the fill is either unfilled or the
          fill itself.
        feedback: >
          $5 - 1 = 4$. Equivalently $F = 0.2 \cdot 0 + 0.8(1 + F)$ gives
          $F = 4$. Which count the interviewer means, failures or trials,
          is worth one clarifying question.
      - ask: >
          A second order is placed only once the first has filled, and fills
          on the same terms. What is the expected number of minutes until
          both have filled?
        expects: "10"
        hint: >
          Name a state for "one order filled" and write its equation too.
        feedback: >
          From "one filled", $E_1 = 1 + 0.8E_1 = 5$. From the start,
          $E_0 = 1 + 0.2E_1 + 0.8E_0$, so $0.2E_0 = 1 + 1 = 2$ and $E_0 = 10$.
          Two waits of $5$ in sequence.
      - ask: >
          Now suppose the fill chance rises each minute: $0.1$, then $0.2$,
          then $0.3$, and so on. Why does $E = 1 + (1-p)E$ no longer apply?
        choices:
          - text: >
              It does apply, with $p$ the average fill chance.
            feedback: >
              No single $p$ describes the process, and averaging the chances
              is not the same as averaging the waits. The equation's whole
              justification is that failure returns you to the start.
          - text: >
              A failure leaves the order at a later minute with a higher fill
              chance, not back at the start.
            correct: true
            feedback: >
              Right. The minute itself is now part of the state, so each
              minute needs its own unknown, and the one-line answer is gone.
          - text: >
              Because the minutes are no longer independent.
            feedback: >
              They can still be independent; the chances merely differ from
              minute to minute. What breaks is the reset, not independence.
        feedback: >
          $E = 1/p$ rests entirely on an exact reset. In an interview, say
          "after a failure I am back where I started" out loud: it is the
          sentence the interviewer is waiting to hear, and the one that tells
          you when the formula is unsafe.

  - node: quant-tools.recurrences.state-equations
    hook: >
      Choosing too coarse a state space is the most common silent failure in multi-state problems — the equations still solve, they just answer a different question than the one asked, because two situations with different futures got merged into one.
    explanation: >
      A state has to capture everything about the present that's relevant to the future — the length of a partial pattern match, a walk's current position, what's left in a deck — precisely so that, once you know the state, the past can be forgotten entirely, which is what lets first-step analysis apply state by state. Once the states are chosen correctly, what remains is bookkeeping: exactly one unknown and one equation per state, solved either by back-substitution from states adjacent to the absorbing end, or by simultaneous elimination when the transitions loop back on themselves.

      Two checks catch setup errors before they propagate into wrong numbers. First, the count of equations must equal the count of unknowns — if it doesn't, some state was missed or double-defined. Second, every expected time should come out at least $1$ and should move in the direction the problem's structure implies as the state improves — an expected time that's smaller from a worse state than a better one signals a setup error, not a genuine surprise.

      The classic failure is choosing states too coarsely: if two situations lead to genuinely different futures — "one head so far" versus "two heads so far" when chasing three in a row — they are different states and need separate unknowns, even if they look similar at a glance.
    worked: >
      On a triangle of three positions, a walker moves to each of the other two positions with probability $\tfrac12$ each step. Let $E_2$, $E_3$ be the expected further steps to reach position $1$ starting from $2$ or $3$. By symmetry $E_2=E_3=E'$, and $E'=1+\tfrac12(0)+\tfrac12E'$ (one step, either landing on $1$ or back at the symmetric partner state), giving $E'=2$. The expected return time to position $1$, including the first step away, is $1+E'=3$.
    interview: >
      "Set up the states for this problem" is often asked explicitly, before any solving — the interviewer wants to hear what makes the future depend on the state alone, and how many unknowns that implies, as a check on the setup before the algebra starts.
    pitfalls: >
      Merging two states with different futures — because they happen to have equal expected values in some special case, or just for convenience — produces a system with fewer equations than the problem actually has degrees of freedom. Skipping the check that every expected time is at least $1$ lets an arithmetic slip through undetected.
    recap: >
      Pick states so the future depends only on the present, write one equation per state, solve by back-substitution or elimination, and check every expected time is at least $1$ and moves the right direction.
    dialogue:
      - part: A bug on a cube
        teach: >
          A bug sits on one corner of a cube. Every second it walks along one
          of the three edges at its corner, chosen uniformly at random. The
          interviewer asks for the expected number of seconds until it first
          reaches the diagonally opposite corner.
      - ask: >
          With one unknown per corner, how many unknowns are there, not
          counting the target itself?
        expects: "7"
        feedback: >
          The cube has $8$ corners, and the target contributes the known
          value $0$. Seven unknowns and seven equations: correct, but more
          bookkeeping than the question deserves.
      - ask: >
          Which corners can safely share a single unknown?
        choices:
          - text: >
              All seven non-target corners: none of them is the target.
            feedback: >
              A corner next to the target can finish in one step; a corner
              three edges away cannot. Different futures, so different
              expected times.
          - text: >
              Corners the same number of edges away from the target.
            correct: true
            feedback: >
              Right. By the cube's symmetry, every corner at distance $d$ sees
              the same picture: the same chances of moving closer or farther.
          - text: >
              The three corners next to the starting corner, and nothing else.
            feedback: >
              Those three are exactly the corners at distance $2$ from the
              target, which is why they can be merged. Grouping by distance
              to the target covers them and the other classes too.
        feedback: >
          Distance to the target, $0$ to $3$, carries everything the future
          depends on.
      - reflect: >
          State the test precisely: when is it safe to give two different
          corners the same unknown, and why does distance pass it here?
        answer: >
          It is safe when the two corners have the same future: from each,
          the probability of moving into each group of states is the same.
          Then their first-step equations are identical, so their expected
          times are equal. At distance $d$, a corner has $d$ neighbours at
          distance $d - 1$ and $3 - d$ at distance $d + 1$, wherever it sits,
          so distance is a state rich enough that the future depends only on
          it.

      - part: Four states, three equations
        ask: >
          From a corner at distance $2$, what is the probability that the next
          step lands at distance $1$?
        expects: "2/3"
        feedback: >
          Two of its three neighbours are one edge from the target, and one is
          back at distance $3$. So $E_2 = 1 + \tfrac23 E_1 + \tfrac13 E_3$.
      - teach: >
          This is the general shape of the work. Choose a state variable rich
          enough that the future depends only on the present: the length of a
          partial match, a position, a distance, what is left in a deck. Then
          write one unknown and one equation per state, and solve by
          back-substitution from the absorbing end, or by elimination when the
          transitions loop back.
      - ask: >
          With $E_0 = 0$, $E_1 = 1 + \tfrac23 E_2$ and $E_3 = 1 + E_2$, what is
          $E_3$?
        expects: "10"
        hint: >
          Put $E_3 = 1 + E_2$ into the equation for $E_2$ to get $E_2$ in terms
          of $E_1$; then use the equation for $E_1$.
        feedback: >
          $E_2 = 1 + \tfrac23 E_1 + \tfrac13(1 + E_2)$ gives
          $E_2 = 2 + E_1$. Then $E_1 = 1 + \tfrac23(2 + E_1)$ gives
          $\tfrac13 E_1 = \tfrac73$, so $E_1 = 7$, $E_2 = 9$, $E_3 = 10$.
      - ask: >
          $E_1 = 7$ seconds from a corner right next to the target. A
          colleague says it should be $3$, since each step hits the target
          with probability $\tfrac13$. Who is right?
        choices:
          - text: >
              The colleague: $E = 1/p$ with $p = \tfrac13$.
            feedback: >
              $1/p$ needs a failure to put you back where you started. Here a
              miss sends the bug to distance $2$, farther away, so each failure
              costs more than a fresh attempt.
          - text: >
              $7$ is right: a miss moves the bug away, so the reset that
              $1/p$ relies on is missing.
            correct: true
            feedback: >
              Right. And $7$ passes the cheap checks: at least $1$, and
              $E_1 < E_2 < E_3$, improving as the state improves.
          - text: >
              Neither: one edge out of three, so it should be about a third of
              $E_3$, near $3.3$.
            feedback: >
              Expected time is not proportional to distance. The bug keeps
              wandering back, so being one edge away saves only $3$ of the
              $10$ seconds.
        feedback: >
          Two checks are worth their seconds: as many equations as unknowns,
          and expected times at least $1$ that shrink as the state improves.

      - part: Too few states
        ask: >
          A candidate merges distances $1$ and $2$ into a single state,
          "near". What goes wrong?
        choices:
          - text: >
              Nothing, as long as the probabilities are averaged over the
              two.
            feedback: >
              Averaging needs to know how often the bug is at each distance,
              which is exactly what the merged state forgets. The two have
              different futures, so no single equation describes "near".
          - text: >
              Only the arithmetic gets longer; the answer is unchanged.
            feedback: >
              The arithmetic gets shorter, and the answer wrong. From "near",
              the chance of finishing next step is $\tfrac13$ or $0$
              depending on which corner the bug is at.
          - text: >
              "Near" has no single equation: the chance of finishing next step
              is $\tfrac13$ from distance $1$ and $0$ from distance $2$.
            correct: true
            feedback: >
              Right. Two situations with different futures are different
              states, however close they feel.
        feedback: >
          Too few states is the classic failure, and it never announces
          itself: the merged system still solves, to the wrong number.
      - ask: >
          Now a tetrahedron, where every corner touches every other. From one
          corner, what is the expected number of steps to reach a particular
          other corner?
        expects: "3"
        feedback: >
          All three non-target corners have the same future, so one state is
          right this time: $E = 1 + \tfrac13 \cdot 0 + \tfrac23 E$, giving
          $E = 3$. Merging is not wrong in itself; merging states with
          different futures is. In an interview, say which states you merged
          and why their futures match.

  - node: quant-tools.recurrences.hh-vs-ht
    hook: >
      This is the interview's favorite "your intuition is wrong" question — two equally likely two-toss patterns have waiting times that differ by $50\%$, and the reason is entirely about what a failed attempt destroys.
    explanation: >
      Both patterns need exactly two states to track: no useful progress, or "the last toss was the pattern's first symbol." The asymmetry between $HH$ and $HT$ comes down to what a wrong toss does to that progress. Chasing $HH$, being in the progress state and then tossing a tail erases everything — the next useful head has to come from scratch, resetting all the way to "no progress." Chasing $HT$, being in the progress state and tossing another head is not a failure in the same sense — you're still exactly one head deep, still in the same progress state, so nothing is lost.

      This is why $HT$ finishes sooner even though both patterns have identical probability $1/4$ on any fixed pair of tosses: $HH$'s self-overlap (its own prefix matching its own suffix) means a near-miss can be partially reused as if the pattern were starting over, while $HT$ has no such overlap, so every wrong toss costs nothing beyond the toss itself.

      The two-state equations make this precise rather than just plausible, and the method extends immediately to biased coins and longer patterns by the same reasoning — track only how far into the pattern you currently are, and let a bad toss return you to whichever earlier state actually matches what's now been seen.
    worked: >
      Chase $HH$ with a coin biased at $p=1/3$ for heads. Let $E_H$ be the expected further tosses with one head banked, $E_S$ with none: $E_H=1+\tfrac13(0)+\tfrac23E_S$, and $E_S=1+\tfrac13E_H+\tfrac23E_S \Rightarrow \tfrac13E_S=1+\tfrac13E_H \Rightarrow E_S=3+E_H$. Substituting: $E_H=1+\tfrac23(3+E_H)=3+\tfrac23E_H$, so $\tfrac13E_H=3$ and $E_H=9$, giving $E_S=12$ tosses expected from scratch — twice the fair-coin answer of $6$, since a rarer head makes every reset costlier.
    interview: >
      "Which takes longer on average, waiting for $HH$ or waiting for $HT$?" tests whether you reach for the two-state equations rather than guessing they're equal because the patterns are equally probable — the interviewer wants the overlap explanation stated in words, not just the numbers $6$ and $4$.
    pitfalls: >
      Assuming two patterns with equal single-toss probability must have equal waiting times ignores that waiting time depends on overlap structure, not just probability. Setting up the $HH$ states but writing $HT$'s transition as if a repeated head also resets progress is the specific error that erases the asymmetry the question is testing for.
    recap: >
      $HH$ takes $6$ tosses on average against $HT$'s $4$, because a failed $HH$ attempt wipes out all progress while a failed $HT$ attempt keeps it.
    dialogue:
      - part: Two pairs with equal odds
        teach: >
          A fair die is rolled again and again. One player waits for a six
          immediately followed by another six, $66$; the other for a six
          immediately followed by a five, $65$. The interviewer asks which
          wait is longer on average, and by how much.
      - ask: >
          On any fixed pair of consecutive rolls, what is the probability
          that they read $66$?
        expects: "1/36"
        feedback: >
          $\tfrac16 \cdot \tfrac16 = \tfrac{1}{36}$, and the same for $65$.
          On every block of two rolls the two patterns are equally likely.
      - ask: >
          Predict before computing. Which pattern takes longer to appear, on
          average?
        choices:
          - text: >
              Neither: equal odds on every block means equal waits.
            feedback: >
              Equal odds per block would give equal waits if blocks were
              separate experiments. They overlap, and what a failed attempt
              leaves behind differs between the two patterns.
          - text: >
              $65$, because it needs two different faces.
            feedback: >
              Needing two different faces makes it no rarer on any block. The
              difference lies in what happens after a near-miss, and it runs
              the other way.
          - text: >
              $66$
            correct: true
            feedback: >
              Right, and the reason is worth finding before the equations
              confirm it.
        feedback: >
          The question is not how likely a block is but how much progress
          survives a failure.

      - part: What a failure costs
        ask: >
          You are chasing $65$ and have just rolled a $6$. The next roll is
          another $6$. Where does that leave you?
        choices:
          - text: >
              Back at the start, since the attempt failed.
            feedback: >
              The attempt that began with the first $6$ failed, but the new
              $6$ is itself the first half of $65$. Nothing is lost.
          - text: >
              Still one six deep: the new $6$ can begin $65$.
            correct: true
            feedback: >
              Right. Chasing $66$, the near-miss that hurts is a non-six after
              a six, and that one sends you all the way back to the start.
          - text: >
              Two sixes deep, closer than before.
            feedback: >
              The pattern $65$ has no use for two sixes; only the most recent
              one matters. You are exactly where you were a roll ago.
        feedback: >
          Two states suffice for both patterns: $S$, no useful progress, and
          "last roll was a $6$". They differ only in where a failure sends
          you.
      - reflect: >
          Both patterns have probability $\tfrac{1}{36}$ on every block, yet
          you predicted different waits. Say what exactly makes one slower,
          in terms of what a failed attempt costs each player.
        answer: >
          Chasing $65$, a failure from "six in hand" is either another six,
          which keeps you a six deep, or a face from $1$ to $4$, which resets
          you. Chasing $66$, every failure from "six in hand" resets you, and
          that happens five times in six. The $66$ player throws away progress
          that the $65$ player keeps, so the $66$ player restarts more often
          and waits longer.
      - ask: >
          Chasing $65$, the start state gives $E_S = 1 + \tfrac16 E_6 +
          \tfrac56 E_S$, so $E_S = 6 + E_6$. From "six in hand",
          $E_6 = 1 + \tfrac16 \cdot 0 + \tfrac16 E_6 + \tfrac46 E_S$. What is
          $E_6$?
        expects: "30"
        feedback: >
          $E_6 = 1 + \tfrac16 E_6 + \tfrac23(6 + E_6) = 5 + \tfrac56 E_6$, so
          $\tfrac16 E_6 = 5$ and $E_6 = 30$.
      - ask: >
          So the expected wait for $65$ from scratch is:
        expects: "36"
        feedback: >
          $E_S = 6 + 30 = 36$, exactly $1/(1/36)$: with no self-overlap, the
          wait is the reciprocal of the block probability.
      - ask: >
          Chasing $66$, the start equation is the same, $E_S = 6 + E_6$, but
          now $E_6 = 1 + \tfrac16 \cdot 0 + \tfrac56 E_S$. What is the expected
          wait for $66$ from scratch?
        expects: "42"
        feedback: >
          $E_6 = 1 + \tfrac56(6 + E_6) = 6 + \tfrac56 E_6$, so $E_6 = 36$ and
          $E_S = 42$. Six rolls longer than $65$, from overlap alone.
      - teach: >
          That is the whole asymmetry. Waiting for $66$, a failure from "six
          in hand" wipes out all progress. Waiting for $65$, the commonest
          failure, a six, keeps it. Same block probability, different waits:
          a waiting time depends on how a pattern overlaps itself, not just
          on how likely it is.

      - part: Other pairs
        ask: >
          What is the expected wait for $56$, a five followed by a six?
        expects: "36"
        hint: >
          After a $5$, what does a second $5$ do? What does a $6$ do when you
          have nothing in hand?
        feedback: >
          Same shape as $65$: a repeated $5$ keeps you a five deep, and no
          failure costs more than a reset. $E_5 = 30$, $E_S = 36$. Any two
          different faces in a row take $36$.
      - ask: >
          With a six in hand, the $66$ player still expects $36$ more rolls,
          as many as the $65$ player needs from scratch. Why so many?
        choices:
          - text: >
              Because five times in six the next roll is a non-six and the
              banked six is thrown away.
            correct: true
            feedback: >
              Right: from $E_6 = 1 + \tfrac56 E_S$, holding a six is worth
              only $6$ rolls of the $42$.
          - text: >
              Because the die remembers the six and is less likely to repeat
              it.
            feedback: >
              The die has no memory; every roll is a six with probability
              $\tfrac16$. The pattern search has memory, through the state,
              and that is what costs the time.
          - text: >
              It is a coincidence of these numbers.
            feedback: >
              It is forced: $E_6 = E_S - 6$ for both patterns, from the start
              equation, so $E_6 = 36$ exactly when $E_S = 42$.
        feedback: >
          Said aloud in an interview: "same probability per block, but a
          failed $66$ throws away its progress and a failed $65$ does not, so
          $66$ takes $42$ rolls and $65$ only $36$".

  - node: quant-tools.recurrences.pattern-overlap
    hook: >
      Once you've solved two or three of these state systems by hand, this is the shortcut that lets you write down the expected waiting time for any fair-coin pattern by inspection, no equations required.
    explanation: >
      Lining up the numbers from the state-equation method reveals a pattern: the expected wait is a sum of $2^{k}$, one term for every length $k$ at which the pattern's own first $k$ symbols coincide with its last $k$ symbols, including the trivial full match at $k=n$, which is always present and contributes the dominant term $2^{n}$. $HH$ matches at $k=1$ (both single-symbol slices are $H$) and trivially at $k=2$, giving $2+4=6$; $HT$ matches only trivially at $k=2$, giving $4$.

      The mechanism behind the rule is that a self-overlap is a way for the process to reset only part way rather than all the way to zero — every extra $k$ at which the pattern overlaps itself is another opportunity for a near-miss to be salvaged instead of wasted, and each one adds its own $2^{k}$ to the total wait. That's why $k$ heads in a row, which overlaps itself at every length from $1$ to $k$, accumulates to $2^{k+1}-2$.

      For a biased coin the same accounting generalizes: $HH$'s wait becomes $(1+p)/p^{2}$ and $HT$'s becomes $1/(pq)$, with $q=1-p$ — each pattern's own overlap structure gives it its own formula, so these two do not extend automatically to other patterns of the same length. The rigorous justification, via a team of gamblers betting on the pattern, belongs to the martingales toolkit, but the $2^{k}$ counting rule itself is usable immediately.
    worked: >
      Apply the rule to $HTHT$: check $k=1$ (first symbol $H$ versus last symbol $T$ — no match), $k=2$ (first two $HT$ versus last two $HT$ — match), $k=3$ (first three $HTH$ versus last three $THT$ — no match), and the trivial $k=4$. Only $k=2$ and $k=4$ contribute: $4+16=20$ tosses expected on average to see $HTHT$.
    interview: >
      "Without setting up equations, what's the expected wait for $HHTH$?" tests whether the self-overlap shortcut is available on demand — the interviewer listens for the overlap check done symbol by symbol, not a guessed number.
    pitfalls: >
      Forgetting the trivial full-pattern term at $k=n$ undercounts every pattern, since it's always present regardless of overlap. Checking overlap incorrectly — comparing the wrong slices, or suffix against suffix instead of prefix against suffix — silently produces the wrong sum.
    recap: >
      Expected wait for a fair-coin pattern equals the sum of $2^{k}$ over every length at which its own prefix matches its own suffix, including the trivial full length — $20$ tosses for $HTHT$.
    dialogue:
      - part: Three patterns, one probability
        teach: >
          A fair coin is tossed until a chosen pattern of four tosses
          appears. The candidates are $HHHH$, $HTTH$ and $HHTT$. Each has
          probability $\tfrac{1}{16}$ on any fixed block of four tosses.
      - ask: >
          Predict: which has the longest expected wait?
        choices:
          - text: >
              None: each is $\tfrac{1}{16}$ per block, so each waits $16$
              tosses.
            feedback: >
              $HH$ and $HT$ also have equal odds per block, $\tfrac14$, and
              wait $6$ and $4$ tosses. Blocks overlap, so equal odds do not
              mean equal waits.
          - text: >
              $HHTT$, because it contains a doubled head, like $HH$.
            feedback: >
              What slows $HH$ is not the repeated head but that the
              pattern's start matches its own end. $HHTT$ begins with $H$ and
              ends with $T$; no near-miss of it can be reused.
          - text: >
              $HHHH$
            correct: true
            feedback: >
              Right. A failed attempt at $HHHH$ that has banked some heads is
              the pattern's own beginning, and a tail throws all of it away.
        feedback: >
          The slow patterns are the ones that can partly match themselves.
      - reflect: >
          $HT$ takes $4$ tosses and $HH$ takes $6 = 4 + 2$. The $4$ is one
          over the probability of the whole pattern. Guess what the extra
          $2$ is one over, and say which pieces of a pattern earn such an
          extra term.
        hint: >
          The first symbol of $HH$ equals its last symbol; for $HT$ it does
          not.
        answer: >
          The extra $2$ is one over the probability of a single head, the
          part of $HH$ that is both its beginning and its end. A pattern earns an
          extra term for every $k$ at which its first $k$ symbols coincide
          with its last $k$, and the term is one over the probability of
          those $k$ symbols. The full pattern always qualifies, which gives
          the $4$.
      - teach: >
          For a fair coin that is the rule: the expected wait is the sum of
          $2^{k}$ over every $k$ at which the pattern's first $k$ symbols
          match its last $k$, the full length included. Each self-overlap is
          a near-miss that the pattern can reuse in itself, and so an extra
          route back to the start. The proof belongs with martingales; here
          it is a fast and reliable rule.

      - part: Testing the rule
        ask: >
          What is the expected wait for $HHTT$?
        expects: "16"
        feedback: >
          $k = 1$: $H$ against $T$, no. $k = 2$: $HH$ against $TT$, no.
          $k = 3$: $HHT$ against $HTT$, no. Only $k = 4$ counts: $2^{4} =
          16$.
      - ask: >
          What is the expected wait for $HTTH$?
        expects: "18"
        feedback: >
          $k = 1$: $H$ and $H$ match, $2$. $k = 2$: $HT$ against $TH$, no.
          $k = 3$: $HTT$ against $TTH$, no. $k = 4$: $16$. Total $18$.
      - ask: >
          What is the expected wait for $HHHH$?
        expects: "30"
        feedback: >
          Every $k$ matches: $2 + 4 + 8 + 16 = 30$. That is $2^{5} - 2$,
          continuing the run-of-heads ladder.
      - ask: >
          On a fair die the base is $6$ instead of $2$. What does the rule
          predict for the wait until the three rolls $6, 5, 6$ appear in a
          row?
        expects: "222"
        feedback: >
          $k = 1$: $6$ and $6$ match, $6$. $k = 2$: $65$ against $56$, no.
          $k = 3$: $6^{3} = 216$. Total $222$. For $66$ it gives
          $6 + 36 = 42$ rolls, which is what the state equations give for a
          die.

      - part: Where the intuition misleads
        ask: >
          A colleague's summary: "a doubled symbol, like $HH$ or $TT$, makes a
          pattern slow". Which pair of fair-coin patterns refutes it?
        choices:
          - text: >
              $HHTT$ at $16$ and $HTTH$ at $18$.
            correct: true
            feedback: >
              Right. $HHTT$ has two doubled symbols and no self-overlap, so it
              is as fast as a four-toss pattern can be; $HTTH$ is slower
              because its first and last symbols agree.
          - text: >
              $HHH$ at $14$ and $HTH$ at $10$.
            feedback: >
              Both fit the colleague's summary: the pattern with doubled
              symbols is the slower one. A refutation needs a pattern with
              doubled symbols that is still fast.
          - text: >
              $HH$ at $6$ and $HT$ at $4$.
            feedback: >
              $HH$ repeats and is slower, which the colleague's rule
              predicts. Repetition and self-overlap coincide here; they
              come apart only in longer patterns.
        feedback: >
          The test is prefix against suffix, not whether a symbol appears
          twice.
      - ask: >
          Now a coin that lands heads with probability $0.9$. Which pattern
          arrives sooner, $HH$ or $HT$?
        choices:
          - text: >
              $HT$, since $HH$ overlaps itself and overlap is slow.
            feedback: >
              The overlap still costs $HH$ something, but its terms are now
              $1/0.9$ and $1/0.81$: $1.11 + 1.23 \approx 2.35$ tosses. $HT$
              needs a tail, $1/(0.9 \cdot 0.1) \approx 11.1$ tosses.
          - text: >
              $HH$, by a wide margin: about $2.35$ tosses against $11.1$.
            correct: true
            feedback: >
              Right. With a biased coin the patterns no longer have equal
              block probabilities, and $0.81$ against $0.09$ swamps any
              overlap effect.
          - text: >
              They tie, since overlap and bias cancel out.
            feedback: >
              Nothing forces a cancellation: $1/0.9 + 1/0.81 \approx 2.35$
              against $1/0.09 \approx 11.1$.
        feedback: >
          Overlap explains differences between patterns of equal probability.
          When the probabilities differ, compare them first, and use
          one over the probability of each overlapping piece in place of
          $2^{k}$.

  - node: quant-tools.recurrences.three-in-a-row
    hook: >
      This is the natural three-state extension of the two-state pattern problems, and the doubling-plus-two growth in $2,6,14$ is worth recognizing on sight rather than rederiving from the equations every time.
    explanation: >
      With states $0,1,2$ tracking the current run of heads, each state's equation has the same shape: one toss is spent regardless of outcome, a head advances the run by one (or finishes it, at state $2$), and a tail sends the run all the way back to state $0$. That "back to zero" behavior is exactly what makes the growth from $E_0$ to $E_1$ to $E_2$ compound rather than add — every level of progress wiped out means paying for the entire climb again, not just the one toss that failed.

      Solving by back-substitution from $E_2$ downward — $E_2=1+\tfrac12(0)+\tfrac12E_0$, then $E_1=1+\tfrac12E_2+\tfrac12E_0$, then $E_0=1+\tfrac12E_1+\tfrac12E_0$ — gives $E_2=8$, $E_1=12$, $E_0=14$. The general formula this generates for $k$ heads in a row on a fair coin is $2^{k+1}-2$, matching $2,6,14$ for $k=1,2,3$, and for a biased coin with head probability $p$ it becomes $1/p+1/p^{2}+\dots+1/p^{k}$, reflecting that each additional required head is rarer than the last.
    worked: >
      For a coin biased at $p=1/3$, three heads in a row take $1/p+1/p^2+1/p^3=3+9+27=39$ tosses on average — far more than the fair-coin answer of $14$, since every one of the three required heads is individually three times rarer.
    interview: >
      "Expected number of flips to see three heads in a row" is meant to be answered via the three-state system with back-substitution, and a well-prepared answer names the $2^{k+1}-2$ pattern unprompted after producing the number $14$.
    pitfalls: >
      Solving the states in the wrong order — trying to isolate $E_0$ before expressing $E_1$ and $E_2$ in terms of it — tangles the algebra unnecessarily; back-substituting from the state closest to completion is far cleaner. Applying the fair-coin formula $2^{k+1}-2$ to a biased coin gives a wrong answer; the biased case needs the $1/p+\dots+1/p^k$ form.
    recap: >
      Three heads in a row take $14$ tosses on average for a fair coin, part of the $2^{k+1}-2$ ladder $2,6,14,\dots$ that comes from each failed run wiping out all prior progress.
    dialogue:
      - part: Three makes in a row
        teach: >
          A shooter makes each free throw with probability $\tfrac23$,
          independently. Practice ends the moment she has made three in a
          row. The interviewer asks for the expected number of shots.
      - ask: >
          On any fixed block of three shots, what is the probability that all
          three go in?
        expects: "8/27"
        feedback: >
          $(\tfrac23)^{3} = \tfrac{8}{27}$, a little under $0.3$.
      - ask: >
          A colleague answers $27/8 \approx 3.4$ shots, one over that
          probability. What is wrong?
        choices:
          - text: >
              Nothing: a waiting time is one over the success probability.
            feedback: >
              $1/p$ needs repeated independent trials that each reset you to
              the start. Successive blocks of three overlap and are not
              independent, and a miss does not cost a fixed block of three.
          - text: >
              It treats the shots as blocks of three independent trials, but
              a run can start anywhere and a miss partway wastes the makes
              already banked.
            correct: true
            feedback: >
              Right. Practice cannot even end before shot $3$, and $3.4$ is
              barely more than that minimum; the true answer is about twice
              as long.
          - text: >
              It should be $3 \cdot 27/8$, three shots per block.
            feedback: >
              That treats the shots as disjoint blocks, checked only at
              shots $3, 6, 9, \dots$, which ignores runs that straddle two
              blocks. It overshoots in the other direction.
        feedback: >
          The waiting time depends on what a miss destroys, so the process
          needs states.
      - reflect: >
          What do you need to know about the shots so far to predict the rest
          of the practice, and what does a miss do to it?
        answer: >
          Only the length of the current run of makes, $0$, $1$ or $2$; how she
          got there is irrelevant. A make moves the run up by one, and a miss
          sends it back to $0$ whatever it was. So three unknowns, $E_0$,
          $E_1$, $E_2$, for the expected further shots with $0$, $1$ or $2$
          makes in hand, and $E_3 = 0$.

      - part: Three states, solved from the top
        ask: >
          Which equation is right for $E_2$?
        choices:
          - text: >
              $E_2 = 1 + \tfrac23 \cdot 0 + \tfrac13 E_0$
            correct: true
            feedback: >
              Right. One shot; a make finishes, a miss sends the run back to
              $0$.
          - text: >
              $E_2 = 1 + \tfrac23 \cdot 0 + \tfrac13 E_1$
            feedback: >
              A miss does not cost one make; it wipes the run out. After
              make, make, miss she needs three fresh makes.
          - text: >
              $E_2 = \tfrac23 \cdot 0 + \tfrac13 E_0$
            feedback: >
              The shot being taken must be paid for. Without the $1$, every
              $E_i$ solves to $0$.
        feedback: >
          The same shape gives $E_1 = 1 + \tfrac23 E_2 + \tfrac13 E_0$ and
          $E_0 = 1 + \tfrac23 E_1 + \tfrac13 E_0$.
      - ask: >
          Solve. What is $E_0$, the expected number of shots from the start?
        expects: "57/8"
        tolerance: 0.001
        hint: >
          Write $E_2$ in terms of $E_0$, then $E_1$ in terms of $E_0$, and
          substitute both into the equation for $E_0$.
        feedback: >
          $E_2 = 1 + \tfrac13 E_0$. Then $E_1 = 1 + \tfrac23(1 + \tfrac13 E_0) +
          \tfrac13 E_0 = \tfrac53 + \tfrac59 E_0$. Then
          $\tfrac23 E_0 = 1 + \tfrac23 E_1 = \tfrac{19}{9} + \tfrac{10}{27}E_0$,
          so $\tfrac{8}{27}E_0 = \tfrac{19}{9}$ and $E_0 = \tfrac{57}{8} =
          7.125$. Then $E_1 = 5.625$ and $E_2 = 3.375$, falling toward the
          finish as they should.
      - teach: >
          Notice the shape of $7.125$: it is $\tfrac32 + \tfrac94 + \tfrac{27}{8}$,
          that is $1/p + 1/p^{2} + 1/p^{3}$ with $p = \tfrac23$. In general $k$
          in a row costs $1/p + \dots + 1/p^{k}$: each extra make has to be
          reached about $1/p$ times over, from the start, before it sticks.
          For a fair coin the ladder is $2, 6, 14$.
      - ask: >
          How many shots does she expect to need for four makes in a row?
        expects: "195/16"
        tolerance: 0.001
        feedback: >
          Add $1/p^{4} = (\tfrac32)^{4} = \tfrac{81}{16}$ to $\tfrac{57}{8}$:
          $\tfrac{114}{16} + \tfrac{81}{16} = \tfrac{195}{16} \approx 12.19$.
          The fourth make alone adds about $5.06$ shots, more than two thirds
          of the whole wait for three.

      - part: Where the ladder stops working
        ask: >
          Another candidate quotes $14$ for the shooter's three in a row, the
          fair-coin answer. What did they miss?
        choices:
          - text: >
              Nothing: three in a row takes $14$ trials whatever the odds.
            feedback: >
              At $p = \tfrac23$ each make is easier than a coin's head, so the
              wait must be shorter: $7.125$, not $14$.
          - text: >
              That $2^{k+1} - 2$ is the ladder only at $p = \tfrac12$; with
              $p = \tfrac23$ the terms are powers of $\tfrac32$.
            correct: true
            feedback: >
              Right. $2^{k+1} - 2$ is $1/p + \dots + 1/p^{k}$ with $1/p = 2$.
              Quote the general form and substitute.
          - text: >
              That the coin answer must be scaled by $\tfrac23$, giving
              $9.3$.
            feedback: >
              The wait is not linear in $p$. Scaling misses that every term
              is a power of $1/p$: $1.5 + 2.25 + 3.375$, not $\tfrac23$ of
              $2 + 4 + 8$.
        feedback: >
          The fair-coin numbers are a special case; the ladder in powers of
          $1/p$ is the result.
      - ask: >
          Practice now ends at make, make, miss in that order, instead of
          three makes. Does the ladder $1/p + 1/p^{2} + 1/p^{3}$ still give
          the answer?
        choices:
          - text: >
              Yes: it is still a three-shot pattern.
            feedback: >
              The ladder came from one fact: every miss sent the run back to
              $0$. For make, make, miss, a make after two makes keeps two in
              hand, so the equations change shape.
          - text: >
              Yes, with $p$ and $1 - p$ swapped for the last shot.
            feedback: >
              The ladder's terms are $1/p$, $1/p^{2}$, $1/p^{3}$ because each
              stage resets to zero on failure. Swapping a factor does not
              repair the equations, which now have a different failure rule.
          - text: >
              No: the failure rule is different, so the states must be set up
              afresh.
            correct: true
            feedback: >
              Right. With two makes in hand, another make keeps her at two,
              not at zero. Set up the states and solve; do not reuse the
              ladder.
        feedback: >
          The ladder is for runs. Said aloud: "states are the current run
          length, a miss resets to zero, back-substitute from the top, and
          the answer is $1/p + 1/p^{2} + 1/p^{3}$".

  - node: quant-tools.recurrences.pattern-race
    hook: >
      "Which of two equally likely patterns tends to appear first" is a standard non-transitivity trap, and the fix is the same first-step conditioning used everywhere else in this unit, applied to a race rather than a single wait.
    explanation: >
      Racing two patterns needs states that track just enough recent history to know how close each pattern is to completing, and the win probability from each state satisfies the no-additive-constant form of first-step analysis, since only which pattern finishes first matters, not how long it takes. The absorbing (pattern-just-completed) states are known outright: $1$ if this pattern just won, $0$ if the other did.

      The recurring surprise is that these races are rarely fair even when the two patterns are individually equally probable, and they're famously non-transitive — pattern $A$ can beat $B$, $B$ can beat $C$, and $C$ can beat $A$, so there's no meaningful notion of one pattern being "stronger" outside a specific pairing. The mechanism is overlap asymmetry: whichever pattern is harder to spoil partway through tends to win the race, independent of how long it takes on average to complete alone.
    worked: >
      Race $HT$ against $TT$. Track the last symbol seen: states $H$ and $T$, plus a start state. From state $H$: the next toss is $T$ with probability $\tfrac12$, completing $HT$ (a win), or $H$ with probability $\tfrac12$, staying in state $H$; so $q_H=\tfrac12(1)+\tfrac12q_H$ gives $q_H=1$ — once an $H$ appears, $HT$ is certain to win eventually. From state $T$: the next toss is $T$ with probability $\tfrac12$, completing $TT$ (a loss), or $H$ with probability $\tfrac12$, moving to state $H$; so $q_T=\tfrac12(0)+\tfrac12(1)=\tfrac12$. From the start, the first toss lands in $H$ or $T$ equally: $q_0=\tfrac12(\tfrac12)+\tfrac12(1)=\tfrac34$. So $HT$ wins three times in four, mirroring the $TH$-versus-$HH$ result under swapping heads and tails.
    interview: >
      "Two players bet on $HH$ and $TH$ respectively — who's more likely to win?" is the canonical version; the interviewer listens for first-step conditioning on the opening toss and the explicit observation that race probabilities need not match individual waiting times.
    pitfalls: >
      Assuming the pattern with the shorter expected waiting time also wins the head-to-head race more often is not automatic — the two quantities need separate derivations. Forgetting that once a state guarantees one pattern wins with probability $1$, like state $H$ here, no further computation for that branch is needed.
    recap: >
      Racing two equally-probable patterns rarely gives even odds — $HT$ beats $TT$ three times in four, found by first-step conditioning on the opening toss, and pattern races are non-transitive in general.
    dialogue:
      - part: Two traders, one coin
        teach: >
          Two traders bet on a fair coin, tossed until one of their patterns
          appears. Alice wins on $HHT$, Bob on $HTH$. Each pattern has
          probability $\tfrac18$ on any fixed block of three tosses.
      - ask: >
          Predict: who is more likely to win?
        choices:
          - text: >
              Neither: equal odds on every block make it a fair race.
            feedback: >
              Equal block odds say nothing about which pattern tends to turn
              up first. The patterns share a beginning, and what happens
              after that shared beginning decides the race.
          - text: >
              Bob, since $HTH$ overlaps itself and can be reused.
            feedback: >
              Self-overlap helps a pattern against the coin, not against a
              rival. Bob's near-miss $HT$ is wiped out by a tail, while
              Alice's $HH$, once reached, can never be undone.
          - text: >
              Alice
            correct: true
            feedback: >
              Right. The equations confirm it once you see one decisive
              position.
        feedback: >
          A race is decided by the positions from which one pattern is
          guaranteed, not by the block probabilities.
      - ask: >
          Suppose the tosses have just shown $HH$ and nobody has won yet.
          What is the probability that Alice wins?
        expects: "1"
        feedback: >
          Certain. More heads keep the last two tosses at $HH$, and the first
          tail completes $HHT$. Bob needs $HT$ followed by $H$, but the first
          $T$ already ends the game.
      - reflect: >
          Why can Bob never win once $HH$ has appeared, and what does that
          say about where in the sequence the race is actually decided?
        answer: >
          Every continuation of $HH$ is some heads and then a tail, and that
          tail completes $HHT$ before Bob's $HTH$ can be built, since Bob
          would need that same tail followed by a head. So once $HH$ shows,
          Alice has won; the race is decided in the short stretch before the
          tosses reach $HH$ or Bob completes $HTH$. Positions with a
          guaranteed winner cut the first-step equations short.

      - part: Conditioning on the next toss
        ask: >
          The tosses have shown $HT$, with no winner. The next toss is $T$.
          Where does that leave the race?
        choices:
          - text: >
              Effectively back at the start: neither pattern can use a
              trailing $T$.
            correct: true
            feedback: >
              Right. Both patterns begin with $H$, so a tail after $HT$ leaves
              nothing usable: the race restarts.
          - text: >
              Bob still holds $HT$ and needs only an $H$.
            feedback: >
              Bob needed the next toss to be $H$ straight after $HT$. The new
              $T$ makes the last two tosses $TT$, which is the start of
              neither pattern.
          - text: >
              Alice has lost her chance, since $HH$ was never seen.
            feedback: >
              Nothing is lost for good. Any later $HH$ still makes her
              certain to win.
        feedback: >
          So the states are: nothing useful, $H$, $HH$ (Alice certain), $HT$,
          with Alice's winning probabilities $q_0$, $q_H$, $q_{HH} = 1$ and
          $q_{HT}$.
      - ask: >
          With $q_{HT} = \tfrac12 \cdot 0 + \tfrac12 q_0$ and
          $q_H = \tfrac12 q_{HH} + \tfrac12 q_{HT}$, and $q_0 = q_H$ because
          leading tails are wasted, what is Alice's probability of winning?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          Substitute $q_0 = q_H$ into the equation for $q_{HT}$, then into the
          equation for $q_H$.
        feedback: >
          $q_H = \tfrac12 + \tfrac12 \cdot \tfrac12 q_H = \tfrac12 +
          \tfrac14 q_H$, so $\tfrac34 q_H = \tfrac12$ and $q_H = \tfrac23$.
          Alice wins two times in three. No constant term beyond the
          absorbing values: a probability equation carries no $+1$.
      - ask: >
          Now race $THH$ against Alice's $HHT$. What is the probability that
          $THH$ comes first?
        expects: "3/4"
        hint: >
          When can $HHT$ win at all? Ask what must happen on the first two
          tosses.
        feedback: >
          If the first two tosses are $HH$, then $HHT$ is certain, by the same
          argument as before. Otherwise a $T$ appears before any $HH$, and
          the first $HH$ after it completes $THH$ before $HHT$. So
          $HHT$ wins only with probability $\tfrac14$, and $THH$ wins
          $\tfrac34$.

      - part: Races are not waiting times
        ask: >
          $THH$ and $HHT$ each take $8$ tosses on average when waited for
          alone. What does the $\tfrac34$ show?
        choices:
          - text: >
              That the $\tfrac34$ must be wrong, since equal waits mean an
              even race.
            feedback: >
              Both numbers are right. The wait is measured from scratch for
              one pattern alone; the race asks which pattern appears first
              in the same sequence, and one pattern can block the other.
          - text: >
              That a race and a waiting time are different questions, and
              need separate equations.
            correct: true
            feedback: >
              Right. The wait tracks one pattern against the coin; the race
              tracks positions where one pattern pre-empts the other.
          - text: >
              That $THH$ has the shorter wait after all.
            feedback: >
              The waits are equal, $8$ and $8$. The race is lopsided for a
              different reason: almost every route to $HH$ passes through a
              $T$ first.
        feedback: >
          Equal waits, lopsided race. Never answer one question with the
          other's number.
      - ask: >
          $THH$ beats $HHT$ three to one, and $HHT$ beats $HTH$ two to one.
          What happens when $THH$ races $HTH$?
        choices:
          - text: >
              $THH$ wins even more decisively, by stringing the two
              advantages together.
            feedback: >
              Race odds do not compose. Each race has its own decisive
              positions, and you have to compute this one too: it comes out
              exactly even.
          - text: >
              It is an even race, $\tfrac12$ each, despite the other two
              results.
            correct: true
            feedback: >
              Right. And $TTH$ beats $THH$ two to one: for every three-toss
              pattern there is another that beats it, so there is no best
              pattern to pick.
          - text: >
              $HTH$ wins, since the advantages must cycle.
            feedback: >
              Nothing forces a cycle here either; this race is exactly
              even. Race results follow from each pair's own equations.
        feedback: >
          Pattern races are non-transitive. In an interview, the winning move
          is to find the position where one pattern is guaranteed, condition
          on how the sequence reaches it, and say the number: "two in three",
          "three in four".

  - node: quant-tools.recurrences.finiteness-caveat
    hook: >
      A first-step equation that looks perfectly solvable can still be describing an infinite expected value — this is the check interviewers add after a correct-looking derivation to see if you'll blindly trust algebra over the underlying process.
    explanation: >
      First-step equations are derived assuming the quantity they describe actually exists as a finite number; they are necessary conditions on that quantity, not a proof that it's finite. Waiting for a head from a coin with $p=0$ makes this vivid: the equation $E=1+E$ is technically still a correct statement about what any finite $E$ would have to satisfy, but no finite number satisfies it, and canceling $E$ from both sides manufactures the absurd $0=1$ rather than revealing that the true answer is $E=\infty$.

      On a finite state space there's a clean guarantee: if every state can eventually reach an absorbing state, all the expected absorption times are automatically finite, and the linear system has a unique solution — this is the safety net behind every worked example elsewhere in this unit. On an infinite state space that guarantee disappears; the linear system built from first-step equations can have a whole family of solutions, and the one that's probabilistically meaningful is the minimal nonnegative solution, not just any solution that satisfies the equations.

      A concrete instance beyond the degenerate $p=0$ case: for a symmetric random walk on all the integers, let $T$ be the expected number of steps to move up by exactly $1$. By translation invariance, moving from $-1$ up to $1$ costs $2T$ in expectation, so $T=1+\tfrac12(0)+\tfrac12(2T)=1+T$ — again no finite solution, and indeed this walk is recurrent (it reaches $1$ with probability $1$) but has genuinely infinite expected hitting time, because the state space is unbounded on both sides.
    worked: >
      For a symmetric random walk on the integers, the equation $T=1+T$ has no finite solution; the true expected time to move up by one step is $\infty$, even though the walk reaches that target with probability $1$ eventually — finite almost-sure arrival does not imply finite expected arrival time.
    interview: >
      "Solve for $E$ and it comes out to $0=1$ — what does that mean?" directly tests this node: the expected answer is "the true value is infinite," not a claim that the setup was wrong. It often follows a problem deliberately built with $p=0$ or an unbounded state space.
    pitfalls: >
      Treating every solvable-looking linear system as automatically giving a correct finite answer, without checking that the state space is finite and every state can reach absorption, risks reporting a meaningless number on an infinite state space with multiple solutions. Dismissing an equation like $E=1+E$ as "something's wrong with my setup" misses that it's telling you the true answer is $\infty$.
    recap: >
      A first-step equation with no finite solution usually means the true expected value is infinite; finiteness is guaranteed automatically on a finite state space where every state can reach absorption, and only minimal solutions count on an infinite one.
    dialogue:
      - part: Waiting for a seven on one die
        ask: >
          You roll an ordinary six-sided die until it shows a $7$. Conditioning
          on the first roll gives $E = 1 + E$ for the expected number of
          rolls. What does that equation tell you?
        choices:
          - text: >
              Subtract $E$ from both sides: $0 = 1$, so the setup is broken
              and $E$ should be recomputed.
            feedback: >
              The setup is fine. Subtracting $E$ is legal only when $E$ is a
              finite number, and here it is not; the absurdity is the
              equation reporting that.
          - text: >
              No finite number satisfies it, so the honest answer is
              $E = \infty$.
            correct: true
            feedback: >
              Right. The die never shows a $7$, so the wait never ends.
              $E = \infty$ does satisfy $E = 1 + E$; no finite number does.
          - text: >
              $E = 1/p = 1/0$, which is undefined, so the question has no
              answer.
            feedback: >
              It has an answer, and it is infinity: every roll fails, so the
              number of rolls exceeds any bound you name. Undefined is not
              the same as infinite.
        feedback: >
          First-step equations are conditions the true answer satisfies, if
          it is finite. They do not prove that it is.
      - ask: >
          Now the probability $p$ of ever rolling a $7$. First-step analysis
          gives $p = 0 \cdot 1 + 1 \cdot p$, that is $p = p$. Which values of
          $p$ satisfy it?
        choices:
          - text: >
              Only $p = 0$.
            feedback: >
              $0$ is the true answer, but $p = p$ holds for $\tfrac12$ and for
              $1$ just as well. The equation alone cannot pick $0$ out.
          - text: >
              Every number from $0$ to $1$.
            correct: true
            feedback: >
              Right. The equation is true and useless: it never meets an
              absorbing state, so nothing ties it to a value.
          - text: >
              None, like the equation for $E$.
            feedback: >
              $p = p$ is satisfied by everything. Failure here comes in the
              opposite form: too many solutions, not too few.
        feedback: >
          No solution for the expected time, a continuum of solutions for the
          probability, and both from correct reasoning.
      - reflect: >
          Both derivations were honest first-step analysis. One equation has
          no finite solution, the other has too many. What did the method
          silently assume, and what extra fact picks out the true probability?
        answer: >
          The method assumes the quantity exists as a finite number, then
          writes conditions it must satisfy; it never proves existence or
          uniqueness. Here no state can reach the absorbing "rolled a $7$",
          so the expected time is infinite and nothing anchors the
          probability. The true probability is the smallest nonnegative
          solution, $0$: the equations alone, without reachability, cannot
          tell you that.

      - part: When the answer is guaranteed
        teach: >
          The clean statement: on a finite state space where every state can
          reach an absorbing state, all expected absorption times are finite
          and the first-step system has exactly one solution. On an infinite
          state space, uniqueness can fail, and the probabilistically correct
          solution is the minimal nonnegative one. Whatever the space, bound
          the answer crudely before you quote it.
      - ask: >
          Why does "finite, and every state can reach absorption" force a
          finite expected time?
        choices:
          - text: >
              Because a chain with $m$ states must be absorbed within $m$
              steps.
            feedback: >
              It can loop: a coin tossed until the first head has two states
              and can run for any number of tosses. The bound is on the
              probability of a long run, not its length.
          - text: >
              From every state there is a path of at most $m$ steps with
              probability at least some $\varepsilon > 0$, so surviving $km$
              steps has probability at most $(1-\varepsilon)^{k}$.
            correct: true
            feedback: >
              Right. Finitely many states give one $m$ and one $\varepsilon$
              that work everywhere, and a geometric tail has a finite mean.
          - text: >
              Because the linear system has a solution, and that solution is
              the expected time.
            feedback: >
              That is circular: the system's solution is the expected time
              only once you know the expected time is finite. The die showed
              that equations can be written for an infinite mean.
        feedback: >
          The load-bearing step is uniformity: a single $\varepsilon$ for all
          states. An infinite state space can let $\varepsilon$ shrink toward
          $0$, and the guarantee goes with it.
      - ask: >
          A chain is absorbed within $2$ steps with probability at least
          $\tfrac14$, from whichever state it is in. What upper bound does
          that give on the expected time to absorption?
        expects: "8"
        hint: >
          Group the steps in blocks of $2$. How many blocks do you expect at
          most?
        feedback: >
          Each block of $2$ steps absorbs with probability at least
          $\tfrac14$, so at most $4$ blocks are expected, and at most
          $4 \cdot 2 = 8$ steps. A crude bound like this is what catches a
          solved system that has gone wrong.

      - part: Calls that keep getting harder
        teach: >
          A salesman makes calls until one succeeds. Call number $n$ succeeds
          with probability $1/(n+1)$: a half, then a third, then a quarter.
          With $E_n$ the expected number of calls still to make when the next
          one is call $n$, first-step analysis gives
          $E_n = 1 + \tfrac{n}{n+1}E_{n+1}$, one equation for each of
          infinitely many states. Rearranged, $E_{n+1} = \tfrac{n+1}{n}(E_n - 1)$.
      - ask: >
          Suppose you guess $E_1 = 2$ and run the rearranged equation forward.
          What is $E_3$?
        expects: "3/2"
        feedback: >
          $E_2 = 2(2 - 1) = 2$ and $E_3 = \tfrac32(2 - 1) = \tfrac32$. Every
          equation so far is satisfied; nothing has gone wrong yet.
      - ask: >
          Keep going. At what smallest $n$ does $E_n$ become negative?
        expects: "5"
        feedback: >
          $E_4 = \tfrac43(\tfrac32 - 1) = \tfrac23$, then
          $E_5 = \tfrac54(\tfrac23 - 1) = -\tfrac{5}{12}$. An expected number of
          calls cannot be negative, so the guess $E_1 = 2$ was wrong.
      - ask: >
          In general $E_n/n = E_1 - (1 + \tfrac12 + \dots + \tfrac{1}{n-1})$,
          and that harmonic sum grows without bound, so every finite guess
          for $E_1$ eventually runs negative. What is the true $E_1$?
        choices:
          - text: >
              $2$, the guess that held up for four steps.
            feedback: >
              It fails at $E_5$, and a solution that fails anywhere is not the
              answer anywhere: all the equations have to hold at once.
          - text: >
              $\infty$: no finite nonnegative solution exists, so the mean is
              infinite.
            correct: true
            feedback: >
              Right. The chance of still calling after $k$ calls is
              $\tfrac12 \cdot \tfrac23 \cdots \tfrac{k}{k+1} = \tfrac{1}{k+1}$,
              which tends to $0$, so a success is certain; yet the expected
              number of calls is $\sum_k \tfrac{1}{k+1} = \infty$. Certain
              arrival, infinite mean.
          - text: >
              Large but finite, since a success is certain to come eventually.
            feedback: >
              A success is certain, and the mean is still infinite. The
              chance of still calling after $k$ calls is $1/(k+1)$, which
              tends to $0$ too slowly: the tail sum is harmonic, and it
              diverges.
        feedback: >
          Equations that solve are not answers until you check that the
          quantity is finite. Here the success chance shrinks toward $0$ as
          the state grows, which is exactly the uniformity a finite chain
          would guarantee. In an interview, give the bound or the
          reachability argument out loud before quoting a number.
