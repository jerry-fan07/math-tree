unit: quant-tools.recurrences
opening: >
  This unit turns sequential randomness into algebra: once you can write next in terms of previous, an "expected number of tosses" or "how many arrangements avoid ..." question stops being a puzzle and becomes a linear system with a mechanical solution. It runs in two halves — first the algebra of linear recurrences with constant coefficients, from the first-order fixed point through characteristic roots, repeated roots, and matching a particular solution to the forcing term, anchored by Fibonacci as the running example; then first-step analysis, the probabilistic use of the same idea, which turns conditioning on one step into a system of equations for an expected value or a probability, worked through the classic pattern-waiting races. By the end, seeing a process that restarts in a recognisable state should trigger naming the states and writing the equations before anything else.
lessons:
  - node: quant-tools.recurrences.recurrence-relation
    hook: >
      Naming the order and counting the initial values correctly is the entire setup step of every "expected time until ..." interview question — get that wrong and the rest of the algebra solves the wrong problem.
    explanation: >
      A recurrence is a promise that $a_n$ can be computed from a bounded window of earlier terms, and the order $k$ is the width of that window — the number of facts you must remember as you step forward. Splitting a recurrence into a linear part with constant coefficients $c_1,\dots,c_k$ and a forcing term $g(n)$ matters because it licenses superposition: the machinery built for the homogeneous case (where $g\equiv 0$) becomes reusable for the general case by adding one particular fix-up, a pattern the rest of this unit leans on repeatedly.

      The uniqueness fact — that an order-$k$ recurrence plus $k$ initial values pins the sequence down completely — is the practically useful half of the definition. It licenses guess-and-check: if you can produce any closed form that satisfies the recurrence and reproduces the first $k$ terms, you are done, because no other sequence can agree with the recurrence and those $k$ terms without being identical forever. Every closed-form technique later in this unit is really a disciplined way to make that guess.

      The interview skill is rarely the algebra; it's translating a word problem into $a_n$ in terms of $a_{n-1},\dots$ in the first place. Naming what $n$ counts — tosses so far, cards dealt, steps taken — before writing any equation is what makes everything after it mechanical.
    worked: >
      Classify $a_n = 4a_{n-1} - 4a_{n-2}$: it is order $2$, linear, constant-coefficient, and homogeneous. Given $a_0 = 1$ and $a_1 = 4$, the recurrence forces $a_2 = 4(4) - 4(1) = 12$ — and by uniqueness, no other order-$2$ sequence sharing those two starting values can ever diverge from this one.
    interview: >
      Rarely asked as "define a recurrence relation" — instead it's buried in a word problem, and the interviewer listens for you to name an index, state what $a_n$ depends on, and count how many boundary values you'll need before touching algebra.
    pitfalls: >
      Supplying the wrong number of initial values — one for an order-$2$ recurrence, or three for an order-$1$ one — leaves the system under- or over-determined. Treating coefficients that actually depend on $n$ as if they were the fixed constants this definition requires breaks every characteristic-root technique that follows.
    recap: >
      An order-$k$ linear recurrence plus $k$ initial values determines a sequence completely, which is what makes guessing and verifying a closed form a legitimate strategy.
    steps:
      - teach: >
          Every recurrence question in an interview starts with the same two
          moves: name the order $k$, then count out exactly $k$ initial values.
          Skip either one and the rest of the algebra answers a different
          problem than the one asked.
      - teach: >
          The order $k$ is the width of the window of earlier terms $a_n$
          depends on. Splitting off a linear part with constant coefficients
          $c_1,\dots,c_k$ from a forcing term $g(n)$ matters because it's
          homogeneous exactly when $g\equiv0$, and the homogeneous machinery
          gets reused for the general case by adding one particular fix-up.
      - ask: >
          Classify $b_n = 3b_{n-1} - 2b_{n-2} + 5$.
        choices:
          - text: >
              Order $1$, homogeneous
            feedback: >
              $b_n$ depends on both $b_{n-1}$ and $b_{n-2}$, so the order is
              $2$, not $1$.
          - text: >
              Order $2$, homogeneous
            feedback: >
              The forcing term $g(n) = 5$ is not identically $0$, so this is
              inhomogeneous, not homogeneous.
          - text: >
              Order $2$, linear, inhomogeneous
            correct: true
            feedback: >
              Two earlier terms with fixed coefficients $3$ and $-2$, plus a
              nonzero constant forcing term — order $2$, linear,
              inhomogeneous.
          - text: >
              Order $2$, nonlinear
            feedback: >
              The coefficients $3$ and $-2$ are fixed numbers multiplying
              $b_{n-1}$ and $b_{n-2}$ directly, with no products of terms —
              that's exactly what linear means here.
        feedback: >
          Order $2$ (it needs both $b_{n-1}$ and $b_{n-2}$), linear (constant
          coefficients $3, -2$), and inhomogeneous (the forcing term $5$ is
          not $0$).
      - teach: >
          The uniqueness fact is the practically useful half of the
          definition: an order-$k$ recurrence plus $k$ initial values pins the
          sequence down completely, so any closed form that satisfies the
          recurrence and reproduces the first $k$ terms *is* the sequence —
          no other one can agree with it and then diverge.
      - ask: >
          Using $b_n = 3b_{n-1} - 2b_{n-2} + 5$ with $b_0 = 1$ and $b_1 = 2$,
          what is $b_2$?
        expects: "9"
        hint: >
          Substitute $n = 2$ into the recurrence, using $b_1$ and $b_0$.
        feedback: >
          $b_2 = 3(2) - 2(1) + 5 = 6 - 2 + 5 = 9$.
      - teach: >
          Supplying the wrong number of initial values — one for an order-$2$
          recurrence, or three for an order-$1$ one — leaves the system under-
          or over-determined. Treating an $n$-dependent coefficient as if it
          were one of the fixed constants this definition requires breaks
          every characteristic-root technique built on top of it.
      - ask: >
          Two order-$2$ sequences both satisfy $b_n = 3b_{n-1} - 2b_{n-2} + 5$
          and agree on $b_0$ and $b_1$. What follows for every $n \ge 2$?
        choices:
          - text: >
              They may still diverge for large $n$
            feedback: >
              Uniqueness rules this out precisely: an order-$2$ recurrence
              plus $2$ agreeing initial values forces the sequences to be
              identical forever.
          - text: >
              They are identical for every $n$
            correct: true
            feedback: >
              Order $2$, and they agree on $2$ consecutive terms — that's
              exactly the uniqueness condition, so they can never diverge.
          - text: >
              They agree only at even $n$
            feedback: >
              Uniqueness doesn't carve out exceptions by parity — either the
              order and initial-value count match, and they agree everywhere,
              or they don't.
          - text: >
              Nothing can be concluded without knowing more terms
            feedback: >
              Two matching terms is exactly what an order-$2$ recurrence
              needs — no further terms are required to conclude they're
              identical.
        feedback: >
          Matching the order's worth of initial values is enough: uniqueness
          then forces the two sequences to coincide for all $n$.
      - teach: >
          Name the index, count the initial values the order demands, and
          only then reach for algebra — the setup, not the solving, is what
          most recurrence questions are actually testing.

  - node: quant-tools.recurrences.first-order-recurrence
    hook: >
      This is the one-line solve you should have cold: any $a_n = ra_{n-1}+c$ appearing in an interview — depreciation, a discounted expected value, a simple population model — collapses to a fixed point and a decay rate, no series summation required.
    explanation: >
      The trick is a change of variables that makes the constant term disappear. If $x^\ast$ is a value that maps to itself under the recursion, $x^\ast = rx^\ast + c$, then subtracting this identity from $a_n = ra_{n-1}+c$ cancels every $c$ and leaves $a_n - x^\ast = r(a_{n-1}-x^\ast)$ — the deviation from $x^\ast$ obeys a pure geometric recursion, which you already know how to solve. Solving $x^\ast = rx^\ast+c$ gives the fixed point $x^\ast = c/(1-r)$, valid whenever $r \ne 1$.

      Once you have $a_n - x^\ast = r^{n}(a_0-x^\ast)$, the qualitative picture is free: $|r|<1$ means the deviation shrinks geometrically to $0$, so $a_n \to x^\ast$ regardless of the start, and the sign of $r$ tells you whether the approach is smooth (positive $r$) or oscillates around $x^\ast$ (negative $r$). $|r|>1$ means the deviation blows up, and $r=1$ is the one case with no fixed point at all — there the recursion is just adding $c$ every step, giving the arithmetic answer $a_n = a_0 + nc$.

      Recognize the shape $a_n = ra_{n-1}+c$ whenever a quantity moves a fixed fraction toward some target each step and gains a fixed increment — "fixed fraction toward a target" is the fixed point in disguise.
    worked: >
      Solve $a_n = -\tfrac12 a_{n-1} + 9$ with $a_0 = 0$. The fixed point is $x^\ast = 9/(1-(-\tfrac12)) = 6$, so $a_n = 6\left(1-(-\tfrac12)^{n}\right)$. Direct iteration confirms it: $a_1 = 9$, $a_2 = 4.5$, $a_3 = 6.75$ — oscillating around $6$ from both sides exactly as the negative ratio predicts, converging geometrically at rate $1/2$.
    interview: >
      Shows up as "a machine's value depreciates by 20% then gets serviced back up by a fixed amount each year — what's the long-run value?" or as an expected value satisfying exactly this shape. The interviewer wants the fixed point produced immediately, not a term-by-term unrolling.
    pitfalls: >
      Applying $x^\ast = c/(1-r)$ at $r=1$ divides by zero — that case needs the separate arithmetic formula, not a limit of this one. Missing that a negative $r$ makes the sequence oscillate rather than approach monotonically leads to a wrong qualitative description even when the formula is right.
    recap: >
      Subtract the fixed point $c/(1-r)$ and the recursion becomes purely geometric, giving $a_n = r^{n}(a_0-x^\ast)+x^\ast$, convergent whenever $|r|<1$.
    steps:
      - teach: >
          Any $a_n = ra_{n-1}+c$ you meet in an interview — a discounted
          expected value, a depreciating balance topped up by a fixed amount —
          collapses to one line: a fixed point and a decay rate, no series
          summation needed.
      - teach: >
          Find the value $x^\ast$ that maps to itself, $x^\ast = rx^\ast + c$,
          which gives $x^\ast = c/(1-r)$ for $r \ne 1$. Subtracting this
          identity from the recursion cancels every $c$, leaving
          $a_n - x^\ast = r(a_{n-1}-x^\ast)$ — a pure geometric sequence in the
          deviation from $x^\ast$.
      - ask: >
          For $a_n = \tfrac13a_{n-1} + 8$, what is the fixed point $x^\ast$?
        expects: "12"
        hint: >
          Solve $x^\ast = \tfrac13x^\ast + 8$ for $x^\ast$.
        feedback: >
          $\tfrac23x^\ast = 8$, so $x^\ast = 12$.
      - teach: >
          Once you have $a_n - x^\ast = r^{n}(a_0-x^\ast)$, the qualitative
          picture is free: $|r|<1$ means $a_n \to x^\ast$ from any start, and
          the sign of $r$ decides whether the approach is smooth (positive
          $r$) or oscillates around $x^\ast$ (negative $r$). $r=1$ has no
          fixed point at all — there the recursion just adds $c$ every step.
      - ask: >
          With $a_0 = 2$ for that same recursion, what is $a_2$, to two
          decimals?
        expects: "10.89"
        tolerance: 0.01
        hint: >
          Either iterate twice, or plug $r=1/3$, $x^\ast=12$ into
          $a_n = r^{n}(a_0-x^\ast)+x^\ast$.
        feedback: >
          $a_1 = \tfrac13(2)+8 = \tfrac{26}{3}$, $a_2 =
          \tfrac13\cdot\tfrac{26}{3}+8 = \tfrac{98}{9}\approx10.89$, matching
          $\left(\tfrac13\right)^{2}(2-12)+12 = -\tfrac{10}{9}+12 =
          \tfrac{98}{9}$.
      - teach: >
          Applying $x^\ast = c/(1-r)$ at $r=1$ divides by zero — that case
          needs the separate arithmetic formula $a_n = a_0+nc$, not a limit of
          this one. And missing that negative $r$ makes the sequence
          oscillate, rather than approach monotonically, gets the qualitative
          picture wrong even when the number is right.
      - ask: >
          $a_n = -0.4a_{n-1} + 7$. Which describes its long-run behavior?
        choices:
          - text: >
              It increases monotonically toward the fixed point
            feedback: >
              $r=-0.4$ is negative, so the deviation from the fixed point
              flips sign each step — that's oscillation, not a monotone
              approach.
          - text: >
              It oscillates around $5$, converging since $|-0.4|<1$
            correct: true
            feedback: >
              $x^\ast = 7/(1-(-0.4)) = 7/1.4 = 5$, and the negative $r$
              alternates the deviation's sign while $|r|<1$ shrinks it to $0$.
          - text: >
              It diverges, since $|r|<1$
            feedback: >
              $|r|<1$ is exactly the convergence condition, not the
              divergence one — divergence needs $|r|>1$.
          - text: >
              There's no fixed point, since $r$ is negative
            feedback: >
              The fixed-point formula only excludes $r=1$; the sign of $r$
              plays no role in whether $x^\ast$ exists, only in the shape of
              the approach to it.
        feedback: >
          $x^\ast = 5$, and with $r=-0.4$ the sequence oscillates around $5$
          while converging geometrically, since $|-0.4|<1$.
      - teach: >
          Recognize the shape whenever a quantity moves a fixed fraction
          toward a target each step and gains a fixed increment — "fixed
          fraction toward a target" is the fixed point in disguise, and the
          fixed point is the entire answer to "where does this end up."

  - node: quant-tools.recurrences.linear-recurrence
    hook: >
      This is the general engine behind every closed-form sequence in this unit, including Fibonacci; the interview tell is a homogeneous recursion with constant coefficients where the answer wants a formula in $n$, not a table of values.
    explanation: >
      The ansatz $a_n = x^{n}$ works because the recursion is linear and shift-invariant: plugging it into $a_n = c_1a_{n-1}+\dots+c_ka_{n-k}$ and dividing every term by the common factor $x^{n-k}$ turns a statement about sequences into a single polynomial equation in $x$, the characteristic equation $x^{k} = c_1x^{k-1}+\dots+c_k$. Each root $r_i$ hands you one genuine solution sequence $r_i^{n}$, and because the recursion is linear, any combination $A_1r_1^{n}+\dots+A_kr_k^{n}$ solves it too — superposition is exactly why this works.

      With $k$ distinct roots you have $k$ free constants $A_i$, matching exactly the $k$ initial values a recurrence of this order needs; plugging $n=0,1,\dots,k-1$ into the general solution turns those initial values into a linear system for the $A_i$. For large $n$, the root of largest modulus swamps the rest, so the long-run growth rate is set entirely by that dominant root.

      A complex-conjugate pair of roots doesn't break anything; it contributes a real oscillating piece, $\rho^{n}\cos(n\theta)$ and $\rho^{n}\sin(n\theta)$ for a pair of modulus $\rho$ and argument $\theta$, since the imaginary parts of the two conjugate terms cancel once combined with the right constants.
    worked: >
      Solve $a_n = 5a_{n-1}-6a_{n-2}$ with $a_0=1$, $a_1=1$. The characteristic equation $x^2-5x+6=0$ factors as $(x-2)(x-3)=0$, roots $2$ and $3$, so $a_n = A\cdot2^{n}+B\cdot3^{n}$. The initial values give $A+B=1$ and $2A+3B=1$, solving to $A=2$, $B=-1$, so $a_n = 2\cdot2^{n}-3^{n}$. Checking $n=3$: the formula gives $2\cdot8-27=-11$, matching direct iteration $a_2=-1$, $a_3=5(-1)-6(1)=-11$.
    interview: >
      "Find a closed form for $a_n = \dots$" with constant coefficients is answered by writing the characteristic equation immediately, not by computing terms and guessing a pattern. The interviewer listens for the ansatz $a_n=x^n$ stated as the reason the polynomial appears at all.
    pitfalls: >
      Forgetting to fit the constants $A_i$ to the initial values leaves an answer with free parameters, not the actual sequence — the characteristic roots alone never determine it. Dividing by $x^{n-k}$ silently assumes $x\ne0$; if $0$ is genuinely a root it needs separate handling.
    recap: >
      Substituting $a_n=x^n$ turns a constant-coefficient recursion into its characteristic polynomial, and distinct roots combine as $a_n=\sum A_ir_i^{n}$ with constants fixed by the initial values.
    steps:
      - teach: >
          This is the general engine behind every closed-form sequence ahead,
          Fibonacci included. The tell in an interview is a homogeneous,
          constant-coefficient recursion where the answer wants a formula in
          $n$, not a table of values.
      - teach: >
          Substituting $a_n=x^{n}$ into $a_n=c_1a_{n-1}+\dots+c_ka_{n-k}$ and
          dividing by $x^{n-k}$ gives the characteristic equation
          $x^{k}=c_1x^{k-1}+\dots+c_k$. Each root $r_i$ hands you a genuine
          solution $r_i^{n}$, and because the recursion is linear, any
          combination $A_1r_1^{n}+\dots+A_kr_k^{n}$ solves it too.
      - ask: >
          $a_n = 7a_{n-1} - 10a_{n-2}$. What are its two characteristic roots?
        choices:
          - text: >
              $2$ and $5$
            correct: true
            feedback: >
              $x^{2}-7x+10=(x-2)(x-5)=0$: the roots sum to $7$ and multiply to
              $10$, matching $2+5$ and $2\cdot5$.
          - text: >
              $2$ and $3$
            feedback: >
              That pair sums to $5$, not $7$ — it solves a different
              characteristic equation, not this one.
          - text: >
              $-2$ and $-5$
            feedback: >
              These multiply to $10$ but sum to $-7$, the wrong sign for the
              middle coefficient $-7x$.
          - text: >
              $1$ and $10$
            feedback: >
              These multiply to $10$ but sum to $11$, not $7$ — reading off
              the product alone and guessing a factor pair isn't the same as
              factoring the polynomial.
        feedback: >
          $x^{2}-7x+10=(x-2)(x-5)=0$ gives roots $2$ and $5$.
      - teach: >
          With $k$ distinct roots you get $k$ free constants $A_i$, matching
          the $k$ initial values a recursion of this order needs; plugging in
          $n=0,1,\dots,k-1$ turns those initial values into a linear system
          for the $A_i$. The root of largest modulus sets the long-run growth
          rate, and a complex-conjugate pair contributes an oscillating piece
          instead of a pure exponential.
      - ask: >
          For that recursion with $a_0=2$, $a_1=7$, the general solution is
          $a_n = A\cdot2^{n}+B\cdot5^{n}$. What is $B$?
        expects: "1"
        hint: >
          $A+B=2$ and $2A+5B=7$ — eliminate $A$ between the two equations.
        feedback: >
          $2A+5B-2(A+B) = 7-4 \Rightarrow 3B=3 \Rightarrow B=1$ (and $A=1$).
      - teach: >
          Forgetting to fit the constants $A_i$ to the initial values leaves
          an answer with free parameters, not the actual sequence — the roots
          alone never pin it down. Dividing by $x^{n-k}$ silently assumes
          $x\ne0$, so a genuine root at $0$ needs separate handling.
      - ask: >
          If $x=0$ is a genuine root of the characteristic equation, what
          breaks in the derivation of that equation?
        choices:
          - text: >
              Nothing — the ansatz $a_n=x^{n}$ still works fine
            feedback: >
              The ansatz itself is fine; it's the division step used to
              derive the characteristic equation that assumes $x \ne 0$.
          - text: >
              Dividing by $x^{n-k}$ is invalid at $x=0$, so that root needs
              separate handling
            correct: true
            feedback: >
              Exactly — the division step that produces the characteristic
              equation silently assumes $x\ne0$, so a genuine root there falls
              outside the derivation as written.
          - text: >
              The recursion becomes nonlinear
            feedback: >
              Linearity depends on the coefficients $c_i$ being fixed
              numbers, which is unaffected by whether $0$ happens to be a
              root.
          - text: >
              The recursion has no solutions
            feedback: >
              The recursion still has solutions; it's specifically this
              derivation of the characteristic equation that needs a
              separate case for $x=0$.
        feedback: >
          The division by $x^{n-k}$ used to reach the characteristic equation
          assumes $x\ne0$ — a genuine root at $0$ needs to be handled outside
          that step.
      - teach: >
          Write the characteristic equation the moment you see a homogeneous,
          constant-coefficient recursion — the ansatz $a_n=x^{n}$ is the
          reason the polynomial appears at all, not a guess to justify after
          the fact.

  - node: quant-tools.recurrences.repeated-roots
    hook: >
      A double root is the trap in "solve this recursion" questions — writing $a_n=Ar^n+Br^n$ for a repeated root $r$ gives only one genuine degree of freedom where two are needed, and the fix is a factor of $n$, not a second exponential.
    explanation: >
      Two copies of $r^{n}$ are not two independent solutions — they're the same sequence twice, so a repeated root can't be handled by simply doubling up the distinct-roots ansatz. The fix is that a root of multiplicity $m$ contributes the family $r^{n}, nr^{n}, n^{2}r^{n},\dots,n^{m-1}r^{n}$, all genuinely independent, bundled as $(A_0+A_1n+\dots+A_{m-1}n^{m-1})r^{n}$.

      The bookkeeping is the way to remember this correctly rather than guess: a root of multiplicity $m$ must supply exactly $m$ independent solutions so that the total across every root always equals $k$, the order — exactly the number of initial conditions available to pin the constants down. Miscounting the multiplicity throws off this balance.

      The smallest instance is worth keeping as an anchor: $a_n=2a_{n-1}-a_{n-2}$ has characteristic equation $(x-1)^2=0$, a double root at $1$, giving $a_n=A_0+A_1n$ — the arithmetic sequences are exactly the double-root-at-$1$ case, a useful sanity check whenever a repeated-root computation looks unfamiliar.
    worked: >
      Solve $a_n=4a_{n-1}-4a_{n-2}$ with $a_0=1$, $a_1=8$. The characteristic equation $x^2-4x+4=0$ is $(x-2)^2=0$, a double root at $2$, so $a_n=(A_0+A_1n)2^{n}$. Matching initial values: $A_0=1$, and $(A_0+A_1)2=8$ gives $A_1=3$, so $a_n=(1+3n)2^{n}$. At $n=3$: $(1+9)\cdot8=80$, matching direct iteration $a_2=4(8)-4(1)=28$, $a_3=4(28)-4(8)=80$.
    interview: >
      "The characteristic equation has a repeated root — what now?" directly checks whether you know to multiply by $n$ rather than declare the solution under-determined; it often hides inside a recursion deliberately engineered to have $(x-r)^2$ as a factor.
    pitfalls: >
      Writing $a_n=(A_0+A_1)r^n$ instead of $(A_0+A_1n)r^n$ collapses two constants into one and loses a genuine degree of freedom. For multiplicity $m>2$, forgetting the higher powers of $n$ up to $n^{m-1}$ under-supplies solutions relative to the order.
    recap: >
      A root of multiplicity $m$ contributes $(A_0+A_1n+\dots+A_{m-1}n^{m-1})r^{n}$, keeping the solution count equal to the recursion's order.
    steps:
      - teach: >
          A double root is the trap in "solve this recursion" questions:
          writing $a_n=Ar^{n}+Br^{n}$ for a repeated root $r$ gives only one
          genuine degree of freedom where two are needed. The fix is a factor
          of $n$, not a second exponential.
      - teach: >
          Two copies of $r^{n}$ are the same sequence twice, not two
          independent solutions. A root of multiplicity $m$ instead
          contributes the family $r^{n}, nr^{n}, \dots, n^{m-1}r^{n}$, bundled
          as $(A_0+A_1n+\dots+A_{m-1}n^{m-1})r^{n}$ — this keeps the total
          solution count across all roots equal to $k$, the order.
      - ask: >
          $a_n=6a_{n-1}-9a_{n-2}$ has characteristic equation
          $(x-3)^{2}=0$, a double root at $3$. What's the correct general
          form?
        choices:
          - text: >
              $A\cdot3^{n}$
            feedback: >
              That's only one free constant for an order-$2$ recursion, which
              needs two — a double root doesn't collapse the order.
          - text: >
              $(A_0+A_1)\cdot3^{n}$
            feedback: >
              $A_0$ and $A_1$ appear only as their sum here, so this is still
              really one constant — the classic way to lose a degree of
              freedom.
          - text: >
              $(A_0+A_1n)\cdot3^{n}$
            correct: true
            feedback: >
              A root of multiplicity $2$ contributes exactly two independent
              pieces, $3^{n}$ and $n\cdot3^{n}$, matching the order-$2$
              recursion's two initial values.
          - text: >
              $A_0\cdot3^{n}+A_1\cdot n\cdot3^{n}+A_2\cdot n^{2}\cdot3^{n}$
            feedback: >
              Three constants for an order-$2$ recursion overcounts — a root
              of multiplicity $2$ supplies exactly $2$ independent solutions,
              not $3$.
        feedback: >
          Multiplicity $2$ at $3$ gives $(A_0+A_1n)3^{n}$ — two genuinely
          independent pieces, matching the order.
      - teach: >
          The smallest instance is worth keeping as an anchor:
          $a_n=2a_{n-1}-a_{n-2}$ has $(x-1)^{2}=0$, a double root at $1$,
          giving $a_n=A_0+A_1n$ — the arithmetic sequences are exactly the
          double-root-at-$1$ case, a sanity check whenever a repeated-root
          computation looks unfamiliar.
      - ask: >
          With $a_0=2$, $a_1=15$ for $a_n=6a_{n-1}-9a_{n-2}$, the general
          solution is $(A_0+A_1n)3^{n}$. What is $A_1$?
        expects: "3"
        hint: >
          $n=0$ gives $A_0$ directly; then use the $n=1$ equation.
        feedback: >
          $n=0$: $A_0=2$. $n=1$: $(A_0+A_1)\cdot3=15\Rightarrow A_0+A_1=5
          \Rightarrow A_1=3$.
      - teach: >
          Writing $(A_0+A_1)r^{n}$ instead of $(A_0+A_1n)r^{n}$ collapses two
          constants into one and loses a genuine degree of freedom. For
          multiplicity $m>2$, forgetting the higher powers of $n$ up to
          $n^{m-1}$ under-supplies solutions relative to the order.
      - ask: >
          A characteristic equation is $(x-2)^{3}=0$ — root $2$ with
          multiplicity $3$. What's the correct general-solution shape?
        choices:
          - text: >
              $(A_0+A_1n)\cdot2^{n}$
            feedback: >
              That covers only two independent pieces; multiplicity $3$
              needs a third, the $n^{2}$ term.
          - text: >
              $(A_0+A_1n+A_2n^{2})\cdot2^{n}$
            correct: true
            feedback: >
              Multiplicity $3$ supplies exactly $3$ independent solutions,
              $2^{n}$, $n\cdot2^{n}$, $n^{2}\cdot2^{n}$, bundled with one
              polynomial in $n$ of degree $2$.
          - text: >
              $A_0\cdot2^{n}+A_1\cdot2^{n}+A_2\cdot2^{n}$
            feedback: >
              Three constants multiplying the same $2^{n}$ collapse to one
              constant in practice — the same collapsing mistake as writing
              $(A_0+A_1)r^{n}$ for a double root.
          - text: >
              $(A_0+A_1n^{3})\cdot2^{n}$
            feedback: >
              Multiplicity $3$ calls for powers of $n$ up to $n^{2}$, not a
              single jump to $n^{3}$ with the linear term missing.
        feedback: >
          Multiplicity $3$ needs all three powers $1, n, n^{2}$ alongside
          $2^{n}$: $(A_0+A_1n+A_2n^{2})2^{n}$.
      - teach: >
          Count first, always: a root's multiplicity $m$ must supply exactly
          $m$ independent solutions, so the total across every root equals
          $k$ — miscounting that balance is the whole failure mode here.

  - node: quant-tools.recurrences.particular-solution
    hook: >
      Every inhomogeneous recursion is solved by this general-plus-particular split, and the resonance case — where the forcing term accidentally matches a homogeneous solution — is what interviewers use to check you're not just pattern-matching blindly.
    explanation: >
      Linearity is what makes the split legal: if $a_n^{(p)}$ is any single sequence satisfying $a_n=c_1a_{n-1}+\dots+c_ka_{n-k}+g(n)$, and $a_n^{(h)}$ solves the homogeneous version with $g\equiv0$, then their sum solves the full equation, and every solution arises this way — subtracting any two solutions of the full equation leaves a solution of the homogeneous one. The whole problem reduces to finding one particular solution and adding the general homogeneous family already known from characteristic roots.

      Guessing the particular solution's shape from $g(n)$'s shape works because constants, polynomials, and exponentials are each closed under the recursion's linear combination of shifted copies: a constant guess stays constant after shifting, a degree-$d$ polynomial guess stays degree $d$, and $Ab^{n}$ stays proportional to $b^n$. Substituting and matching coefficients pins down the guess's own constants directly, before touching the homogeneous constants at all.

      Resonance is the case where the guess already solves the homogeneous equation — $b$ equals a characteristic root, or $g$ is constant while $1$ is itself a root — and then the guess produces $0=g(n)$ rather than useful information. Multiplying the guess by $n$ (and again if the resonance is doubled) breaks the degeneracy the same way it did for repeated characteristic roots.
    worked: >
      Solve $a_n=2a_{n-1}+2^{n}$ with $a_0=1$. The homogeneous root is $2$, and the forcing term $2^{n}$ shares that root — resonance — so guess $a_n^{(p)}=An\cdot2^{n}$. Substituting: $An2^{n}=2A(n-1)2^{n-1}+2^{n}=A(n-1)2^{n}+2^{n}$, so $A[n-(n-1)]2^{n}=2^{n}$ gives $A=1$. The general solution is $a_n=C\cdot2^{n}+n\cdot2^{n}$, and $a_0=1$ gives $C=1$, so $a_n=(1+n)2^{n}$. At $n=3$: $(4)(8)=32$, matching direct iteration $a_1=2(1)+2=4$, $a_2=2(4)+4=12$, $a_3=2(12)+8=32$.
    interview: >
      "Solve $a_n=\dots+g(n)$" with a specific forcing term wants the shape of the guess named before any algebra — constant, matching-degree polynomial, or $Ab^n$ — and the interviewer specifically listens for whether you catch resonance rather than substituting a guess that silently gives $0=g(n)$.
    pitfalls: >
      Guessing a plain $Ab^{n}$ when $b$ is already a characteristic root produces an identity with no solution for $A$ — the multiply-by-$n$ fix is not optional there. Fitting the homogeneous constants before finding the particular solution's own constants tangles the two unnecessarily.
    recap: >
      The general solution is homogeneous plus particular; guess the particular piece in the shape of the forcing term, multiplying by $n$ whenever that guess collides with a homogeneous solution.
    steps:
      - teach: >
          Every inhomogeneous recursion is solved by this general-plus-
          particular split. The resonance case, where the forcing term
          accidentally matches a homogeneous solution, is what interviewers
          use to see whether you're pattern-matching blindly.
      - teach: >
          Linearity licenses the split: if $a_n^{(p)}$ solves the full
          equation and $a_n^{(h)}$ solves the homogeneous one, their sum
          solves the full equation too. Guess the particular piece's shape
          from $g(n)$'s shape — constant for constant, degree-$d$ polynomial
          for degree $d$, $Ab^{n}$ for $g(n)=b^{n}$ — then substitute and
          match coefficients before touching the homogeneous constants.
      - ask: >
          Solve for the particular solution's constant in $a_n=3a_{n-1}+4$:
          guessing $a_n^{(p)}=A$, what value of $A$ satisfies the equation?
        expects: "-2"
        hint: >
          Substitute the constant guess: $A = 3A + 4$.
        feedback: >
          $-2A=4 \Rightarrow A=-2$ — the same computation as a first-order
          recursion's fixed point, wearing this unit's new name.
      - teach: >
          Resonance is when the guessed shape already solves the homogeneous
          equation — $b$ equals a characteristic root, or $g$ is constant
          while $1$ is a root. The plain guess then produces $0=g(n)$ rather
          than useful information, and multiplying the guess by $n$ (twice if
          doubly resonant) breaks the degeneracy, the same fix as for
          repeated characteristic roots.
      - ask: >
          $a_n=3a_{n-1}+3^{n}$ — the forcing term shares the homogeneous root
          $3$, so it's resonant. Guessing $a_n^{(p)}=An\cdot3^{n}$, what is
          $A$?
        expects: "1"
        hint: >
          Substitute, then cancel the common factor of $3^{n}$ from both
          sides.
        feedback: >
          $An3^{n}=3A(n-1)3^{n-1}+3^{n}=A(n-1)3^{n}+3^{n}$, so
          $A[n-(n-1)]3^{n}=3^{n}$ gives $A=1$.
      - teach: >
          Guessing a plain $Ab^{n}$ under resonance produces an identity with
          no solution for $A$ — the multiply-by-$n$ fix isn't optional there.
          Fitting the homogeneous constants before finding the particular
          solution's own constants tangles the two unnecessarily.
      - ask: >
          $a_n=5a_{n-1}+5^{n}$ ($5$ is the homogeneous root). A guess of
          $a_n^{(p)}=A\cdot5^{n}$ is substituted directly. What happens?
        choices:
          - text: >
              It solves fine, giving $A=1$
            feedback: >
              That's what would happen without resonance. Here $5$ is
              already a root, so the plain guess doesn't survive
              substitution.
          - text: >
              Substitution reduces to $0=5^{n}$, an impossible equation — the
              guess $A\cdot n\cdot5^{n}$ is needed instead
            correct: true
            feedback: >
              $A5^{n}=5\cdot A5^{n-1}+5^{n}=A5^{n}+5^{n}$ leaves $0=5^{n}$ —
              exactly the resonance symptom, fixed by multiplying the guess
              by $n$.
          - text: >
              It solves fine, giving $A=1/5$
            feedback: >
              Substitution doesn't produce a solvable equation for $A$ at
              all here — resonance eliminates the forcing term before $A$ can
              be pinned down.
          - text: >
              The recursion has no particular solution
            feedback: >
              A particular solution exists — the plain guess is just the
              wrong shape under resonance; multiplying by $n$ finds it.
        feedback: >
          The plain guess collapses to $0=5^{n}$ because $5$ is already a
          root — resonance, fixed by trying $A\cdot n\cdot5^{n}$ instead.
      - teach: >
          General equals homogeneous plus particular, and the particular
          piece is guessed in the shape of the forcing term — with a factor
          of $n$ the instant that shape collides with a homogeneous solution.

  - node: quant-tools.recurrences.boundary-conditions
    hook: >
      A correctly solved recursion with the wrong boundary values is a wrong answer that looks completely finished — this is the step interviewers probe by asking "what's $a_0$, and why exactly that?"
    explanation: >
      The first habit is counting: an order-$k$ recursion needs exactly $k$ conditions, and once a problem has multiple interacting states, each one needs its own equation, so the count of unknowns and the count of conditions must match before you try to solve anything. The second habit is sourcing the numbers from the problem's own structure rather than the algebra — a state where the goal has already been reached has $\mathbb{E}=0$ remaining steps, a state from which the goal is provably unreachable has probability $0$, and for counting problems the empty configuration usually counts as exactly one arrangement, so $a_0=1$ is the default rather than $a_0=0$.

      The third habit catches the most errors: boundary states often obey a genuinely different equation from the interior ones, because a move available in the interior simply doesn't exist at the edge. Writing the interior recursion at $n=0$ or at an edge state and hoping it still holds is the classic failure — the edge needs its own equation, derived from what can actually happen there, not inherited from the general pattern.
    worked: >
      Tilings of a $1\times n$ strip using $1\times1$ and $1\times2$ tiles satisfy $a_n=a_{n-1}+a_{n-2}$ (condition on whether the last cell is a single tile or the tail of a domino), but the boundary values come from the problem, not the recursion: the empty strip has exactly one tiling, so $a_0=1$, and a length-$1$ strip has exactly one tiling, so $a_1=1$. Iterating: $a_2=2$, $a_3=3$, $a_4=5$, $a_5=8$ — eight tilings of a $1\times5$ strip.
    interview: >
      "What are your boundary conditions, and where do they come from?" is asked directly after you write a recursion, and a vague "the initial values" answer fails it — the interviewer wants the specific state-by-state reasoning behind each number.
    pitfalls: >
      Assuming $a_0=0$ by default for a counting problem is wrong whenever the empty configuration is itself a valid arrangement. Applying the interior recursion at an edge state missing one of the interior's available moves silently produces an equation that doesn't describe that state at all.
    recap: >
      Count the conditions the recursion's order demands, read their values off the problem's absorbing and edge states directly, and never assume the interior equation also holds at the boundary.
    steps:
      - teach: >
          A correctly solved recursion with the wrong boundary values is a
          wrong answer that looks completely finished — this is the step
          interviewers probe with "what's $a_0$, and why exactly that?"
      - teach: >
          Count first: an order-$k$ recursion needs exactly $k$ conditions,
          and a multi-state problem needs one equation per state. Source the
          numbers from the problem, not the algebra — a state where the goal
          is already reached has $\mathbb{E}=0$, an unreachable one has
          probability $0$, and for counting problems the empty configuration
          usually counts as one arrangement, so $a_0=1$ is the default.
      - ask: >
          For a counting recursion — the number of valid length-$n$
          sequences — what's the standard default for $a_0$, the count for
          the empty sequence, and why?
        choices:
          - text: >
              $a_0=0$, since there's nothing there yet
            feedback: >
              The empty sequence is itself a valid arrangement in most
              counting problems, not a nonexistent one — that's exactly why
              $a_0=0$ is usually wrong.
          - text: >
              $a_0=1$, since the empty sequence is one (degenerate)
              arrangement
            correct: true
            feedback: >
              The empty configuration is a single valid way of arranging
              nothing, which is why counting recursions default to $a_0=1$
              rather than $a_0=0$.
          - text: >
              $a_0$ is undefined until the recursion is solved
            feedback: >
              Boundary values come from the problem's structure, not from
              solving the recursion — they're inputs to the solving, not
              outputs of it.
          - text: >
              $a_0$ equals the number of choices available at the first step
            feedback: >
              That describes $a_1$ or later terms, not $a_0$ — the empty
              configuration precedes any step being taken at all.
        feedback: >
          The empty configuration is one valid arrangement, so counting
          recursions default to $a_0=1$, not $a_0=0$.
      - teach: >
          The habit that catches the most errors: boundary states often obey
          a genuinely different equation from interior ones, because a move
          available in the interior simply doesn't exist at the edge. Writing
          the interior recursion at an edge state and hoping it still holds
          is the classic failure.
      - ask: >
          An expected-steps recursion has an absorbing target and a state one
          step below it where an overshooting move is impossible (so only a
          subset of the interior's moves are available there). What's
          correct?
        choices:
          - text: >
              The interior recursion still applies, since the state is close
              enough to typical
            feedback: >
              This is exactly the failure mode: a move missing at the edge
              means the interior equation doesn't describe what can actually
              happen there.
          - text: >
              That state needs its own equation, built only from the moves
              actually available there
            correct: true
            feedback: >
              Right — the edge gets its own equation derived from its real,
              restricted set of moves, not one inherited from the interior
              pattern.
          - text: >
              Its expected value must automatically equal $1$, since it's one
              step from the target
            feedback: >
              That happens to hold only if every available move from that
              state reaches the target directly — not a general fact, and
              assuming it without deriving the state's own equation is
              risky.
          - text: >
              It should be treated as absorbing, with $\mathbb{E}=0$
            feedback: >
              Absorbing means the goal has already been reached; a state one
              step away still has steps left to take, so $\mathbb{E}=0$ is
              wrong here.
        feedback: >
          The edge state needs its own equation built from whichever moves
          are genuinely available there — never the interior recursion
          inherited by assumption.
      - teach: >
          Miscounting conditions relative to unknowns leaves the system
          under- or over-determined, and assuming $a_0=0$ by default is wrong
          whenever the empty configuration is itself valid — both errors hide
          behind an answer that otherwise looks finished.
      - ask: >
          A chain has $5$ states: $2$ absorbing (win, lose) and $3$ transient,
          each getting its own first-step equation. How many additional known
          values do the absorbing states contribute, one per absorbing state?
        expects: "2"
        hint: >
          Each absorbing state supplies exactly one known value.
        feedback: >
          Two absorbing states, one known value each — $2$ boundary
          conditions, matching "one condition per state."
      - teach: >
          Read the boundary off the problem itself: reached states give
          $\mathbb{E}=0$, unreachable ones give probability $0$, empty
          configurations usually give $a_0=1$, and edge states get their own
          equation rather than borrowing the interior's.

  - node: quant-tools.recurrences.fibonacci
    hook: >
      Fibonacci is the running example the rest of this unit's algebra gets tested against, and Binet's formula — not just the recursion — is what interviewers actually want when they ask for "a formula for the $n$-th Fibonacci number."
    explanation: >
      Fibonacci is the smallest interesting instance of the characteristic-root machinery: substituting $a_n=x^n$ into $F_n=F_{n-1}+F_{n-2}$ gives $x^2=x+1$, whose two roots are the golden ratio $\varphi=(1+\sqrt5)/2\approx1.618$ and its conjugate $\psi=(1-\sqrt5)/2\approx-0.618$. Matching the initial values $F_1=F_2=1$ to the general solution $A\varphi^n+B\psi^n$ produces Binet's formula, $F_n=(\varphi^{n}-\psi^{n})/\sqrt5$ — an irrational-looking expression that always evaluates to an integer.

      It's usable for fast estimation because $|\psi|<1$, so $\psi^n\to0$ and the second term becomes negligible almost immediately; $F_n$ is exactly the nearest integer to $\varphi^{n}/\sqrt5$ for every $n\ge1$. That's also why the ratio of consecutive terms converges to $\varphi$: Fibonacci grows geometrically at rate $1.618$ per step, not linearly and not exponentially with any other base.

      Every other order-$2$ recursion of the form $a_n=a_{n-1}+a_{n-2}$ shares this exact pair of characteristic roots regardless of its initial values — only the constants $A,B$ change, so recognizing the shape $a_n=a_{n-1}+a_{n-2}$ should trigger $\varphi$ and $\psi$ immediately, without rederiving the characteristic equation each time.
    worked: >
      Estimate $F_{10}$ via Binet without the recursion: $\varphi^{10}\approx122.9919$, and dividing by $\sqrt5\approx2.23607$ gives $\approx55.0036$. Rounding to the nearest integer gives $55$, matching the true value exactly.
    interview: >
      "Give a closed-form formula for the $n$-th Fibonacci number" wants Binet's formula produced from the characteristic equation, not recited from memory; a fast-estimation version, "roughly how big is $F_{30}$," wants $\varphi^{30}/\sqrt5$ used directly rather than iterating thirty steps.
    pitfalls: >
      Using $F_1=F_2=1$ versus an $F_0=0,F_1=1$ indexing convention shifts every subscript by one — confirm which convention a problem uses before quoting a specific term. Dropping the $\psi^n$ term entirely rather than just rounding is only valid because it's small, not because it's exactly zero.
    recap: >
      Fibonacci's characteristic roots are $\varphi=(1+\sqrt5)/2$ and its conjugate, giving Binet's formula and geometric growth at rate $\varphi\approx1.618$ per step.
    steps:
      - teach: >
          Fibonacci is the running example the rest of this unit's algebra
          gets tested against, and Binet's formula — not just the recursion —
          is what interviewers actually want when they ask for "a formula for
          the $n$-th Fibonacci number."
      - teach: >
          Substituting $a_n=x^{n}$ into $F_n=F_{n-1}+F_{n-2}$ gives
          $x^{2}=x+1$, with roots $\varphi=(1+\sqrt5)/2\approx1.618$ and
          $\psi=(1-\sqrt5)/2\approx-0.618$. Matching $F_1=F_2=1$ to
          $A\varphi^{n}+B\psi^{n}$ produces Binet's formula,
          $F_n=(\varphi^{n}-\psi^{n})/\sqrt5$.
      - ask: >
          Estimate $F_{13}$ using $\varphi^{13}/\sqrt5$, given
          $\varphi^{13}\approx521.00$ and $\sqrt5\approx2.2361$.
        expects: "233"
        tolerance: 0.5
        hint: >
          Divide, then round to the nearest integer — $F_n$ is always the
          nearest integer to $\varphi^{n}/\sqrt5$.
        feedback: >
          $521.00/2.2361\approx232.99$, which rounds to $233$ — the true
          value, since $|\psi^{13}|$ is negligibly small.
      - teach: >
          Because $|\psi|<1$, $\psi^{n}\to0$ fast, so $F_n$ is exactly the
          nearest integer to $\varphi^{n}/\sqrt5$, and the ratio
          $F_{n+1}/F_n$ converges to $\varphi$. Every recursion
          $a_n=a_{n-1}+a_{n-2}$ shares these same roots regardless of its
          initial values — recognize the shape and reach for $\varphi,\psi$
          immediately.
      - ask: >
          A sequence uses the $F_0=0,\,F_1=1$ convention instead of
          $F_1=F_2=1$. If a problem says "the $10$th term is $34$" under this
          new convention and you quote Binet's formula for $n=10$ without
          adjusting, what goes wrong?
        choices:
          - text: >
              Nothing — Binet's formula doesn't depend on indexing convention
            feedback: >
              The formula's *value* at a given index doesn't change, but
              which index corresponds to which term shifts by one between
              the two conventions.
          - text: >
              It shifts every subscript by one relative to the $F_1=F_2=1$
              convention, misidentifying which Fibonacci number was meant
            correct: true
            feedback: >
              Exactly — the two conventions label the same sequence of
              values with subscripts one apart, so quoting a term without
              fixing the convention first grabs the wrong one.
          - text: >
              $\varphi$ and $\psi$ change value under a different convention
            feedback: >
              The characteristic roots come from the recursion itself, not
              from how its terms are labeled — they're unaffected by the
              indexing choice.
          - text: >
              Binet's formula stops working entirely
            feedback: >
              The formula still works fine — the only issue is which
              subscript names which term.
        feedback: >
          The two conventions are the same sequence with subscripts shifted
          by one — confirm which one a problem uses before quoting a
          specific term.
      - teach: >
          Dropping the $\psi^{n}$ term is valid because it's negligibly
          small, not because it's exactly zero — worth remembering wherever
          exactness, not just an estimate, is required.
      - ask: >
          Using $F_{n+1}/F_n\to\varphi\approx1.618$, roughly how many times
          bigger is $F_{20}$ than $F_{15}$ (i.e. $F_{20}/F_{15}$), to one
          decimal?
        expects: "11.1"
        tolerance: 0.05
        hint: >
          The ratio compounds over $5$ steps, so raise $\varphi$ to the $5$th
          power.
        feedback: >
          $\varphi^{5}\approx11.09$, matching the exact ratio
          $F_{20}/F_{15}=6765/610\approx11.09$.
      - teach: >
          Recognizing $a_n=a_{n-1}+a_{n-2}$ should trigger $\varphi$ and
          $\psi$ on sight, giving both an exact closed form via Binet and a
          fast growth-rate estimate, without rederiving the characteristic
          equation each time.

  - node: quant-tools.recurrences.no-consecutive-heads
    hook: >
      "Count binary strings avoiding a bad pattern" is one of the most common counting-by-recursion questions asked, and the reflex is conditioning on the first symbol, exactly the way first-order recursions get built.
    explanation: >
      Conditioning on the first toss splits the counting problem cleanly: if it's a tail, whatever follows just needs to be a valid length-$(n-1)$ string on its own, contributing $a_{n-1}$; if it's a head, the next toss is forced to be a tail (or the string ends), and the two together leave a valid length-$(n-2)$ string behind them, contributing $a_{n-2}$. Adding these gives $a_n=a_{n-1}+a_{n-2}$ — the Fibonacci recursion, but with its own boundary values $a_1=2$, $a_2=3$ rather than Fibonacci's own, which shifts the indexing to $a_n=F_{n+2}$.

      The alternate derivation by direct counting is worth keeping because it generalizes further: laying down the $n-k$ tails first creates $n-k+1$ gaps to drop $k$ non-adjacent heads into, giving $\binom{n-k+1}{k}$ strings with exactly $k$ heads, and summing over every valid $k$ must recover the same total as the recursion — a genuine cross-check, since both are counting the identical set of strings.

      The pattern to recognize: any "no two adjacent [something]" counting question, not just heads in coin tosses, reduces to this same first-symbol conditioning and lands on a Fibonacci-shifted count.
    worked: >
      For $n=6$: the recursion gives $a_6=F_8=21$ out of $2^6=64$ total strings, probability $21/64\approx0.328$. The binomial cross-check: $\binom{7}{0}+\binom{6}{1}+\binom{5}{2}+\binom{4}{3}=1+6+10+4=21$, matching exactly.
    interview: >
      "How many length-$n$ binary strings have no two consecutive $1$s" is the canonical phrasing; the interviewer listens for the first-symbol conditioning producing $a_n=a_{n-1}+a_{n-2}$ live, and for correctly stating the answer is $F_{n+2}$, not $F_n$.
    pitfalls: >
      Misplacing the Fibonacci index shift — quoting $F_n$ instead of $F_{n+2}$ — gives numbers close to but wrong for small $n$. Getting the boundary values $a_1=2$, $a_2=3$ wrong (rather than Fibonacci's own $F_1=F_2=1$) propagates an off-by-a-constant error through every later term.
    recap: >
      Conditioning on the first toss gives $a_n=a_{n-1}+a_{n-2}=F_{n+2}$ for strings avoiding two consecutive heads — $21$ of $64$ strings at $n=6$.
    steps:
      - teach: >
          "Count binary strings avoiding a bad pattern" is one of the most
          common counting-by-recursion questions asked, and the reflex is
          conditioning on the first symbol, exactly the way first-order
          recursions get built.
      - teach: >
          A tail leaves a free valid string of length $n-1$; a head forces a
          tail next (or the string ends), leaving a valid string of length
          $n-2$. Adding gives $a_n=a_{n-1}+a_{n-2}$ with its own boundary
          $a_1=2$, $a_2=3$ — Fibonacci-shaped but shifted, so $a_n=F_{n+2}$.
      - ask: >
          Iterate $a_n=a_{n-1}+a_{n-2}$ from $a_1=2,\,a_2=3$ up to $a_7$.
          What is $a_7$?
        expects: "34"
        hint: >
          Build the sequence one term at a time: $2, 3, 5, 8, 13, 21,
          \dots$
        feedback: >
          $2, 3, 5, 8, 13, 21, 34$ — $a_7=34=F_9$, confirming the shift
          $a_n=F_{n+2}$.
      - teach: >
          The direct-counting derivation generalizes further: lay down the
          $n-k$ tails first, creating $n-k+1$ gaps to drop $k$ non-adjacent
          heads into, giving $\binom{n-k+1}{k}$ strings with exactly $k$
          heads. Summing over every valid $k$ must recover the same total as
          the recursion — a genuine cross-check on the same set of strings.
      - ask: >
          Continuing from $a_6=21$ and $a_7=34$: use the recursion to get
          $a_8$, or check it against the binomial sum
          $\binom{9}{0}+\binom{8}{1}+\binom{7}{2}+\binom{6}{3}+\binom{5}{4}$.
          What is $a_8$?
        expects: "55"
        hint: >
          Either add $a_6+a_7$, or add the five binomial terms.
        feedback: >
          $21+34=55$, matching $1+8+21+20+5=55$ from the binomial
          cross-check — two different countings of the same strings.
      - teach: >
          Misplacing the index shift — quoting $F_n$ instead of $F_{n+2}$ —
          gives numbers close to but wrong for small $n$. Getting the
          boundary values $a_1=2$, $a_2=3$ wrong, rather than Fibonacci's own
          $F_1=F_2=1$, propagates an off-by-a-constant error through every
          later term.
      - ask: >
          A candidate computes the count for length-$5$ strings avoiding
          consecutive heads by writing $a_5=F_5=5$. What went wrong?
        choices:
          - text: >
              Nothing — $a_5=5$ is correct
            feedback: >
              Iterating $2,3,5,8,13$ from $a_1=2,\,a_2=3$ gives $a_5=13$, not
              $5$ — this answer used the wrong starting point.
          - text: >
              They used the plain Fibonacci index instead of the shifted
              index; the correct value is $a_5=F_7=13$
            correct: true
            feedback: >
              Right — this problem's own boundary values shift the indexing
              to $F_{n+2}$, so $a_5=F_7=13$, not $F_5=5$.
          - text: >
              They should have used $F_{n-2}$ instead
            feedback: >
              That shifts the index the wrong direction — the correct
              relation is $a_n=F_{n+2}$, derived from this problem's own
              boundary values $a_1=2,\,a_2=3$.
          - text: >
              The recursion doesn't apply for odd $n$
            feedback: >
              $a_n=a_{n-1}+a_{n-2}$ holds for every $n$; the mistake was in
              the index shift, not the recursion's applicability.
        feedback: >
          This problem's boundary values, $a_1=2,\,a_2=3$, are not
          Fibonacci's own $F_1=F_2=1$, which is exactly why the count is
          $F_{n+2}$, and $a_5=F_7=13$.
      - teach: >
          Any "no two adjacent [something]" counting question, not just heads
          in coin tosses, reduces to the same first-symbol conditioning and
          lands on a Fibonacci-shifted count.

  - node: quant-tools.recurrences.first-step-analysis
    hook: >
      This is the single most reused technique in the whole quant-interview probability toolkit: almost every "expected number of steps" or "probability of reaching a goal" question is exactly this recipe wearing different clothes.
    explanation: >
      The move is to condition on the outcome of the very next step and let the same unknown reappear on the right-hand side, because after one step a process that restarts in a recognisable situation is, probabilistically, back at square one — this is the tower property applied to the first move, not an approximation. Naming one unknown per distinct state is the setup: $E_s$ for the expected remaining steps from state $s$, or $p_s$ for the probability of some fixed target outcome starting from $s$.

      The two equation shapes differ in one place worth memorizing precisely: $E_s=1+\sum_t\Pr(s\to t)E_t$ carries an explicit $+1$, because every step taken costs one unit of time regardless of where it lands, while $p_s=\sum_t\Pr(s\to t)p_t$ carries no additive constant at all, because a probability only cares about the eventual endpoint, not how many steps it took. Confusing these two forms — adding a $1$ to a probability equation, or forgetting it in an expectation equation — is a common and easy-to-miss error.

      Once every state has its equation, the known values at absorbing states go in, and what remains is pure linear algebra: back-substitute where the transitions allow it, or solve simultaneously otherwise.
    worked: >
      A mouse starts in room $A$, which leads to $B$ or $C$ with equal probability; $B$ leads to cheese (absorbing success) or back to $A$, each with probability $\tfrac12$; $C$ leads to a trap (absorbing failure) or back to $A$, each with probability $\tfrac12$. Let $p_X$ be the probability of reaching cheese from room $X$. Then $p_B=\tfrac12(1)+\tfrac12p_A$, $p_C=\tfrac12(0)+\tfrac12p_A$, and $p_A=\tfrac12p_B+\tfrac12p_C$. Substituting: $p_A=\tfrac12\left(\tfrac12+\tfrac12p_A\right)+\tfrac12\left(\tfrac12p_A\right)=\tfrac14+\tfrac12p_A$, so $p_A=\tfrac12$.
    interview: >
      "What's the expected number of steps until..." or "what's the probability this process ends in state X before state Y" are both first-step analysis; the interviewer wants the equation for a generic state written down, with the $+1$ or its absence justified explicitly, before any solving happens.
    pitfalls: >
      Writing an expectation equation without the $+1$, or a probability equation with a stray constant added, produces plausible-looking equations that solve to the wrong numbers. Forgetting to give every reachable state its own unknown — collapsing two states with different futures into one — under-specifies the system.
    recap: >
      Condition on the first step, write $E_s=1+\sum_t\Pr(s\to t)E_t$ or $p_s=\sum_t\Pr(s\to t)p_t$, impose the known boundary values, and solve the resulting linear system.
    steps:
      - teach: >
          This is the single most reused technique in the whole quant-
          interview probability toolkit: almost every "expected number of
          steps" or "probability of reaching a goal" question is this recipe
          wearing different clothes.
      - teach: >
          Condition on the very next step and let the same unknown reappear
          on the right — the tower property applied to the first move, not an
          approximation. Name one unknown per state: $E_s$ for expected
          remaining steps, $p_s$ for the probability of a fixed target
          outcome.
      - ask: >
          Which equation shapes are correctly matched to $E_s$ (expected
          remaining steps) versus $p_s$ (probability of a target outcome)?
        choices:
          - text: >
              $E_s=\sum_t\Pr(s\to t)E_t$, $p_s=1+\sum_t\Pr(s\to t)p_t$
            feedback: >
              These are swapped — the $+1$ belongs to the expectation
              equation, since every step costs one unit of time regardless of
              outcome.
          - text: >
              $E_s=1+\sum_t\Pr(s\to t)E_t$, $p_s=\sum_t\Pr(s\to t)p_t$
            correct: true
            feedback: >
              Right: $E_s$ carries the $+1$ because every step taken costs a
              unit of time, while $p_s$ has no additive constant, since only
              the eventual endpoint matters.
          - text: >
              Both need the additive $+1$
            feedback: >
              Only the expectation equation counts a cost per step — a
              probability only tracks which absorbing state is eventually
              reached, so it carries no constant.
          - text: >
              Neither needs an additive constant
            feedback: >
              The expectation equation does: every step taken costs one unit
              of time regardless of where it leads, which is exactly the
              $+1$.
        feedback: >
          $E_s$ carries the $+1$ for the step just taken; $p_s$ carries none,
          since a probability only depends on the eventual endpoint.
      - teach: >
          Once every state has its equation, the known absorbing values go
          in, and what's left is pure linear algebra — back-substitute where
          the transitions allow it, or solve simultaneously otherwise.
      - ask: >
          A game has states $1$ and $2$: from $1$, move to $2$ with
          probability $0.6$ or lose (absorbing) with probability $0.4$; from
          $2$, win (absorbing) with probability $0.5$ or return to $1$ with
          probability $0.5$. Let $p_i$ be the win probability from state $i$.
          Given $p_1=0.6p_2$ and $p_2=0.5+0.5p_1$, what is $p_1$ (as a
          fraction)?
        expects: "3/7"
        hint: >
          Substitute the second equation into the first and solve for $p_1$.
        feedback: >
          $p_1=0.6(0.5+0.5p_1)=0.3+0.3p_1 \Rightarrow 0.7p_1=0.3 \Rightarrow
          p_1=3/7$.
      - teach: >
          Writing an expectation equation without the $+1$, or a probability
          equation with a stray constant, produces plausible-looking
          equations that solve to the wrong numbers. Forgetting to give every
          reachable state its own unknown — collapsing two states with
          different futures into one — under-specifies the system.
      - ask: >
          A problem tracks "no progress" and "one head banked" but a
          candidate merges them into a single unknown because they "feel
          similar." What goes wrong?
        choices:
          - text: >
              Nothing — as long as the merged equation is written correctly,
              it still solves
            feedback: >
              If the two states have genuinely different futures, no single
              equation can correctly capture both — the system is missing an
              unknown, not just miswritten.
          - text: >
              The system becomes under-specified, since the two states have
              different futures and need separate unknowns
            correct: true
            feedback: >
              Right — a state has to capture everything relevant to the
              future; if two situations lead to different futures, they're
              different states, merged or not.
          - text: >
              It only matters if the transition probabilities differ
            feedback: >
              What matters is whether the *futures* differ, not just the
              immediate transition probabilities — two states with the same
              next-step odds can still diverge afterward.
          - text: >
              This is always safe as a simplification once the number of
              states exceeds three
            feedback: >
              The state count itself doesn't license merging — only two
              states with identical futures can ever be safely merged.
        feedback: >
          Two states with different futures need separate unknowns; merging
          them loses a degree of freedom the system actually has.
      - teach: >
          State the equation for a generic state, justify the $+1$ or its
          absence out loud, and only then solve — that ordering is what the
          interviewer is actually listening for.

  - node: quant-tools.recurrences.first-head
    hook: >
      This is the fastest possible derivation of a geometric random variable's mean, and interviewers use it specifically to see whether you reach for one first-step equation instead of summing an infinite series live.
    explanation: >
      Every toss costs one unit of time no matter what happens next, which is exactly the $+1$ in a first-step expectation equation; with probability $p$ that toss is a head and the process stops, and with the remaining probability $1-p$ the coin is memoryless — the very next toss faces exactly the same waiting problem as the first one did, so the same unknown $E$ reappears unchanged on the right. That gives $E=1+(1-p)E$ directly, with no case-by-case unrolling required.

      Solving is one line: $E-(1-p)E=1$, so $pE=1$, giving $E=1/p$. This is the entire content of "the mean of a geometric distribution is $1/p$," derived without ever writing $\sum_{k\ge1}kp(1-p)^{k-1}$ — the first-step equation is strictly faster and generalizes immediately to any restart-on-failure waiting-time problem, not just coins.

      The template to recognize: any process where a single trial either ends things or resets you exactly to the start reduces to $E=1+(1-\Pr[\text{success}])E$, regardless of what the trial physically is.
    worked: >
      Each day, independently, there is a $15\%$ chance of rain. The expected number of days until the first rainy day satisfies $E=1+0.85E$, so $0.15E=1$ and $E=1/0.15=20/3\approx6.67$ days.
    interview: >
      "Roll a die until you get a six — what's the expected number of rolls?" is answered immediately with $1/p=6$ via this one-line equation, not by summing the geometric series. A dressed-up version, applying to job applications or repeated trials, is the identical structure.
    pitfalls: >
      This only works because the failure outcome genuinely resets you to the exact starting state — if failure changes your situation, such as partial progress toward a longer pattern, the same unknown can't reappear unchanged and a richer state system is needed instead. Forgetting to divide by $p$ and reporting $E=1-p$ or similar is an easy mechanical slip under time pressure.
    recap: >
      $E=1+(1-p)E$ solves to $E=1/p$ — no series needed, and it is the template for any single-trial-resets-you waiting time.
    steps:
      - teach: >
          This is the fastest possible derivation of a geometric random
          variable's mean, and interviewers use it specifically to see
          whether you reach for one first-step equation instead of summing an
          infinite series live.
      - teach: >
          Every toss costs one unit of time — the $+1$. With probability $p$
          it's a head and you're done; with probability $1-p$ the coin is
          memoryless, so the very next toss faces the identical waiting
          problem, and the same unknown $E$ reappears unchanged:
          $E=1+(1-p)E$.
      - ask: >
          A basketball player makes each free throw independently with
          probability $0.4$. What is the expected number of throws until the
          first make?
        expects: "2.5"
        hint: >
          Solve $E=1+0.6E$.
        feedback: >
          $0.4E=1 \Rightarrow E=2.5$.
      - teach: >
          The template applies to any process where a single trial either
          ends things or resets you exactly to the start: $E=1+(1-
          \Pr[\text{success}])E$, regardless of what the trial physically is
          — a coin, a free throw, a quality check.
      - ask: >
          A machine part fails a quality check independently with
          probability $0.05$ on each test. What's the expected number of
          tests until the first failure is caught?
        expects: "20"
        hint: >
          Same equation, with $p=0.05$.
        feedback: >
          $0.05E=1 \Rightarrow E=20$.
      - teach: >
          This only works because the failure outcome genuinely resets you to
          the exact starting state. If failure changes your situation — such
          as partial progress toward a longer pattern — the same unknown
          can't reappear unchanged, and a richer state system is needed
          instead.
      - ask: >
          Waiting for the pattern $HH$ with a fair coin: can $E=1+(1-p)E$
          with $p=\Pr(H)$ be used directly to get the answer?
        choices:
          - text: >
              Yes — it's just $E=1+0.5E=2$
            feedback: >
              That's the answer for waiting on a single head, not $HH$ — it
              ignores that one head banked is a different state from no
              progress at all.
          - text: >
              No — a head doesn't always fail back to the very start
              (another head keeps one banked), so a single-state template
              doesn't capture $HH$; a two-state system is needed
            correct: true
            feedback: >
              Right — after one head, tossing another head keeps you at "one
              head banked," not back at "no progress," so this template's
              single-reset assumption doesn't hold.
          - text: >
              Yes, but only for a biased coin
            feedback: >
              The issue isn't the coin's bias — it's that $HH$ has partial
              progress a failure doesn't always erase, which breaks this
              template regardless of $p$.
          - text: >
              No, because $HH$'s probability isn't $p$
            feedback: >
              $HH$'s per-attempt probability isn't the real obstacle here —
              the obstacle is that a single unknown can't represent two
              genuinely different progress states.
        feedback: >
          $HH$ needs two states, since a failure doesn't always erase all
          progress the way it does for a single head — this template is for
          exactly that simpler case.
      - teach: >
          Recognize the shape: a single trial that either finishes the job or
          resets you completely reduces to one line, $E=1/p$ — no series, and
          it's the template every richer waiting-time problem in this unit
          builds on.

  - node: quant-tools.recurrences.state-equations
    hook: >
      Choosing too coarse a state space is the most common silent failure in multi-state problems — the equations still solve, they just answer a different question than the one asked, because two situations with different futures got merged into one.
    explanation: >
      A state has to capture everything about the present that's relevant to the future — the length of a partial pattern match, a walk's current position, what's left in a deck — precisely so that, once you know the state, the past can be forgotten entirely, which is what lets first-step analysis apply state by state. Once the states are chosen correctly, what remains is bookkeeping: exactly one unknown and one equation per state, solved either by back-substitution from states adjacent to the absorbing end, or by simultaneous elimination when the transitions loop back on themselves.

      Two checks catch setup errors before they propagate into wrong numbers. First, the count of equations must equal the count of unknowns — if it doesn't, some state was missed or double-defined. Second, every expected time should come out at least $1$ and should move in the direction the problem's structure implies as the state improves — an expected time that's smaller from a worse state than a better one signals a setup error, not a genuine surprise.

      The classic failure is choosing states too coarsely: if two situations lead to genuinely different futures — "one head so far" versus "two heads so far" when chasing three in a row — they are different states and need separate unknowns, even if they look similar at a glance.
    worked: >
      On a triangle of three positions, a walker moves to each of the other two positions with probability $\tfrac12$ each step. Let $E_2$, $E_3$ be the expected further steps to reach position $1$ starting from $2$ or $3$. By symmetry $E_2=E_3=E'$, and $E'=1+\tfrac12(0)+\tfrac12E'$ (one step, either landing on $1$ or back at the symmetric partner state), giving $E'=2$. The expected return time to position $1$, including the first step away, is $1+E'=3$.
    interview: >
      "Set up the states for this problem" is often asked explicitly, before any solving — the interviewer wants to hear what makes the future depend on the state alone, and how many unknowns that implies, as a check on the setup before the algebra starts.
    pitfalls: >
      Merging two states with different futures — because they happen to have equal expected values in some special case, or just for convenience — produces a system with fewer equations than the problem actually has degrees of freedom. Skipping the check that every expected time is at least $1$ lets an arithmetic slip through undetected.
    recap: >
      Pick states so the future depends only on the present, write one equation per state, solve by back-substitution or elimination, and check every expected time is at least $1$ and moves the right direction.
    steps:
      - teach: >
          Choosing too coarse a state space is the most common silent
          failure in multi-state problems — the equations still solve, they
          just answer a different question than the one asked, because two
          situations with different futures got merged into one.
      - teach: >
          A state has to capture everything about the present relevant to the
          future, precisely so the past can be forgotten and first-step
          analysis applies state by state. Once states are chosen correctly,
          it's bookkeeping: one unknown and one equation per state, solved by
          back-substitution from the absorbing end or by elimination when
          transitions loop.
      - ask: >
          On a path $1\text{–}2\text{–}3\text{–}4$ (bouncing back is
          impossible at the ends: position $1$'s only neighbor is $2$, and
          $4$ is the absorbing target), a walker at an interior position
          moves to each neighbor with probability $\tfrac12$. Let $E_i$ be
          the expected steps from $i$ to reach $4$. Given $E_2=3+E_3$ and
          $E_3=1+\tfrac12E_2$, what is $E_3$?
        expects: "5"
        hint: >
          Substitute one equation into the other and solve for $E_3$.
        feedback: >
          $E_3=1+\tfrac12(3+E_3)=2.5+\tfrac12E_3 \Rightarrow E_3=5$.
      - teach: >
          Two sanity checks catch setup errors before they propagate: the
          count of equations must equal the count of unknowns, and every
          expected time should be at least $1$ and move in the direction the
          structure implies as the state improves — closer to the target
          should mean a smaller expected time.
      - ask: >
          Continuing that example: $E_1=1+E_2$ (position $1$'s only neighbor
          is $2$), and $E_2=3+E_3=3+5=8$. What is $E_1$?
        expects: "9"
        hint: >
          Plug $E_2=8$ into $E_1=1+E_2$.
        feedback: >
          $E_1=1+8=9$, and indeed $9>8>5>0$ — expected time decreases
          monotonically toward the target, passing the sanity check.
      - teach: >
          The classic failure is choosing states too coarsely: if two
          situations lead to genuinely different futures — "one head so far"
          versus "two heads so far" when chasing three in a row — they are
          different states and need separate unknowns, even if they look
          similar at a glance.
      - ask: >
          A problem tracks partial matches toward $HHH$, but a candidate uses
          one state, "some progress," instead of separate states for "one
          head banked" and "two heads banked." What goes wrong?
        choices:
          - text: >
              Nothing — as long as the transition probabilities are averaged
              correctly, it still works
            feedback: >
              These two states have different expected remaining times, so
              no single averaged equation reproduces both correctly.
          - text: >
              The system is under-specified, since "one head banked" and
              "two heads banked" have genuinely different futures and need
              separate unknowns
            correct: true
            feedback: >
              Right — a state where the next tail resets differently, and one
              that's closer to completion, are different states no matter
              how similar they look.
          - text: >
              It only matters for a biased coin
            feedback: >
              The distinction between "one head banked" and "two heads
              banked" matters regardless of the coin's bias — their futures
              differ either way.
          - text: >
              It's fine, since both states eventually reach $HHH$ with
              probability $1$
            feedback: >
              Eventually reaching the target with probability $1$ says
              nothing about whether their *expected* remaining times match —
              they don't.
        feedback: >
          "One head banked" and "two heads banked" have different expected
          remaining times, so merging them under-specifies the system by one
          equation.
      - teach: >
          Choose states rich enough that the future depends only on the
          present, then it's mechanical: one equation per state, solved and
          checked against the two sanity habits.

  - node: quant-tools.recurrences.hh-vs-ht
    hook: >
      This is the interview's favorite "your intuition is wrong" question — two equally likely two-toss patterns have waiting times that differ by $50\%$, and the reason is entirely about what a failed attempt destroys.
    explanation: >
      Both patterns need exactly two states to track: no useful progress, or "the last toss was the pattern's first symbol." The asymmetry between $HH$ and $HT$ comes down to what a wrong toss does to that progress. Chasing $HH$, being in the progress state and then tossing a tail erases everything — the next useful head has to come from scratch, resetting all the way to "no progress." Chasing $HT$, being in the progress state and tossing another head is not a failure in the same sense — you're still exactly one head deep, still in the same progress state, so nothing is lost.

      This is why $HT$ finishes sooner even though both patterns have identical probability $1/4$ on any fixed pair of tosses: $HH$'s self-overlap (its own prefix matching its own suffix) means a near-miss can be partially reused as if the pattern were starting over, while $HT$ has no such overlap, so every wrong toss costs nothing beyond the toss itself.

      The two-state equations make this precise rather than just plausible, and the method extends immediately to biased coins and longer patterns by the same reasoning — track only how far into the pattern you currently are, and let a bad toss return you to whichever earlier state actually matches what's now been seen.
    worked: >
      Chase $HH$ with a coin biased at $p=1/3$ for heads. Let $E_H$ be the expected further tosses with one head banked, $E_S$ with none: $E_H=1+\tfrac13(0)+\tfrac23E_S$, and $E_S=1+\tfrac13E_H+\tfrac23E_S \Rightarrow \tfrac13E_S=1+\tfrac13E_H \Rightarrow E_S=3+E_H$. Substituting: $E_H=1+\tfrac23(3+E_H)=3+\tfrac23E_H$, so $\tfrac13E_H=3$ and $E_H=9$, giving $E_S=12$ tosses expected from scratch — twice the fair-coin answer of $6$, since a rarer head makes every reset costlier.
    interview: >
      "Which takes longer on average, waiting for $HH$ or waiting for $HT$?" tests whether you reach for the two-state equations rather than guessing they're equal because the patterns are equally probable — the interviewer wants the overlap explanation stated in words, not just the numbers $6$ and $4$.
    pitfalls: >
      Assuming two patterns with equal single-toss probability must have equal waiting times ignores that waiting time depends on overlap structure, not just probability. Setting up the $HH$ states but writing $HT$'s transition as if a repeated head also resets progress is the specific error that erases the asymmetry the question is testing for.
    recap: >
      $HH$ takes $6$ tosses on average against $HT$'s $4$, because a failed $HH$ attempt wipes out all progress while a failed $HT$ attempt keeps it.
    steps:
      - teach: >
          This is the interview's favorite "your intuition is wrong"
          question — two equally likely two-toss patterns have waiting times
          that differ by $50\%$, entirely because of what a failed attempt
          destroys.
      - teach: >
          Both patterns need two states: no useful progress, or "the last
          toss was the pattern's first symbol." Chasing $HH$, a tail after
          progress erases everything back to "no progress." Chasing $HT$, a
          second head after progress isn't a failure in the same sense — it
          stays exactly one head deep, still in the same progress state.
      - ask: >
          Chasing $HH$: after being in the "one head banked" state, a $T$
          appears. What state does the process move to?
        choices:
          - text: >
              It stays in "one head banked"
            feedback: >
              A $T$ after a banked head fails to extend $HH$, and $HH$'s
              overlap structure gives it nothing to fall back on — all
              progress is lost.
          - text: >
              It moves to "no progress" — all gains erased
            correct: true
            feedback: >
              Right — a tail after a head contains no partial match to $HH$
              at all, so the process resets completely.
          - text: >
              The pattern completes
            feedback: >
              $HH$ needs two heads in a row; a tail after a head doesn't
              complete it.
          - text: >
              Nothing changes — the state is unaffected by this toss
            feedback: >
              The toss does change the state: it wipes out the progress just
              made, moving back to "no progress."
        feedback: >
          A tail after a banked head erases all of $HH$'s progress, sending
          the process back to "no progress" — the reset $HT$ never suffers.
      - teach: >
          This is why $HT$ finishes sooner despite both patterns having
          identical probability $1/4$ on any fixed pair of tosses: $HH$'s
          self-overlap lets a near-miss be reused as a partial restart, while
          $HT$ has none, so a wrong toss costs nothing beyond itself. The same
          two-state method extends to biased coins and longer patterns.
      - ask: >
          Chase $HT$ with a coin biased at $\Pr(H)=2/3$. Let $E_H$ be the
          expected further tosses with one head banked. What is $E_H$?
        expects: "3"
        hint: >
          From "one head banked," a tail (probability $1/3$) completes the
          pattern; a head (probability $2/3$) keeps you there. Write
          $E_H=1+\tfrac23E_H$.
        feedback: >
          $E_H\left(1-\tfrac23\right)=1 \Rightarrow E_H=3$.
      - teach: >
          Assuming two patterns with equal single-toss probability must have
          equal waiting times ignores overlap structure entirely. Writing
          $HT$'s transitions as if a repeated head also resets progress, the
          way it does for $HH$, is the specific error that erases the
          asymmetry the question is testing for.
      - ask: >
          Continuing that instance, with $E_H=3$: what is $E_S$, the expected
          tosses from scratch, given $E_S=1+\tfrac23E_H+\tfrac13E_S$?
        expects: "4.5"
        hint: >
          Substitute $E_H=3$ and solve for $E_S$.
        feedback: >
          $E_S=1+2+\tfrac13E_S \Rightarrow \tfrac23E_S=3 \Rightarrow E_S=4.5$
          — waiting for $HT$ from scratch when heads come twice as often as
          tails, versus a far longer wait chasing $HH$ under the same bias,
          since every reset there is more costly the more common heads are.
      - teach: >
          Two equally probable patterns can have very different waiting
          times, and the reason is always the same: how much of a failed
          attempt's progress survives the failure.

  - node: quant-tools.recurrences.pattern-overlap
    hook: >
      Once you've solved two or three of these state systems by hand, this is the shortcut that lets you write down the expected waiting time for any fair-coin pattern by inspection, no equations required.
    explanation: >
      Lining up the numbers from the state-equation method reveals a pattern: the expected wait is a sum of $2^{k}$, one term for every length $k$ at which the pattern's own first $k$ symbols coincide with its last $k$ symbols, including the trivial full match at $k=n$, which is always present and contributes the dominant term $2^{n}$. $HH$ matches at $k=1$ (both single-symbol slices are $H$) and trivially at $k=2$, giving $2+4=6$; $HT$ matches only trivially at $k=2$, giving $4$.

      The mechanism behind the rule is that a self-overlap is a way for the process to reset only part way rather than all the way to zero — every extra $k$ at which the pattern overlaps itself is another opportunity for a near-miss to be salvaged instead of wasted, and each one adds its own $2^{k}$ to the total wait. That's why $k$ heads in a row, which overlaps itself at every length from $1$ to $k$, accumulates to $2^{k+1}-2$.

      For a biased coin the same accounting generalizes: $HH$'s wait becomes $(1+p)/p^{2}$ and $HT$'s becomes $1/(pq)$, with $q=1-p$ — each pattern's own overlap structure gives it its own formula, so these two do not extend automatically to other patterns of the same length. The rigorous justification, via a team of gamblers betting on the pattern, belongs to the martingales toolkit, but the $2^{k}$ counting rule itself is usable immediately.
    worked: >
      Apply the rule to $HTHT$: check $k=1$ (first symbol $H$ versus last symbol $T$ — no match), $k=2$ (first two $HT$ versus last two $HT$ — match), $k=3$ (first three $HTH$ versus last three $THT$ — no match), and the trivial $k=4$. Only $k=2$ and $k=4$ contribute: $4+16=20$ tosses expected on average to see $HTHT$.
    interview: >
      "Without setting up equations, what's the expected wait for $HHTH$?" tests whether the self-overlap shortcut is available on demand — the interviewer listens for the overlap check done symbol by symbol, not a guessed number.
    pitfalls: >
      Forgetting the trivial full-pattern term at $k=n$ undercounts every pattern, since it's always present regardless of overlap. Checking overlap incorrectly — comparing the wrong slices, or suffix against suffix instead of prefix against suffix — silently produces the wrong sum.
    recap: >
      Expected wait for a fair-coin pattern equals the sum of $2^{k}$ over every length at which its own prefix matches its own suffix, including the trivial full length — $20$ tosses for $HTHT$.
    steps:
      - teach: >
          Once you've solved two or three of these state systems by hand,
          this is the shortcut that lets you write down the expected waiting
          time for any fair-coin pattern by inspection, no equations
          required.
      - teach: >
          The expected wait is a sum of $2^{k}$, one term for every length
          $k$ at which the pattern's own first $k$ symbols equal its last $k$
          symbols, including the trivial full match at $k=n$, which is always
          present and contributes the dominant term $2^{n}$.
      - ask: >
          Apply the self-overlap rule to the fair-coin pattern $THT$. What is
          its expected waiting time?
        expects: "10"
        hint: >
          Check whether the first $k$ symbols match the last $k$ symbols for
          $k=1,2$, then add the trivial $k=3$ term.
        feedback: >
          $k=1$: "$T$" matches "$T$" — a hit. $k=2$: "$TH$" versus "$HT$" —
          no match. Trivial $k=3$ always contributes. Sum $=2^{1}+2^{3}=2+8
          =10$.
      - teach: >
          The mechanism: a self-overlap lets the process reset only part way
          instead of all the way to zero, so every extra $k$ at which the
          pattern overlaps itself is another chance for a near-miss to be
          salvaged rather than wasted. That's why $k$ heads in a row, which
          overlaps itself at every length from $1$ to $k$, accumulates to
          $2^{k+1}-2$.
      - ask: >
          Apply the rule to $HTHH$. What is its expected waiting time?
        expects: "18"
        hint: >
          Check $k=1,2,3$ (first $k$ symbols versus last $k$ symbols), then
          add the trivial $k=4$ term.
        feedback: >
          $k=1$: "$H$" matches "$H$" — a hit. $k=2$: "$HT$" versus "$HH$" —
          no match. $k=3$: "$HTH$" versus "$THH$" — no match. Trivial $k=4$
          always contributes. Sum $=2^{1}+2^{4}=2+16=18$.
      - teach: >
          Forgetting the trivial full-pattern term at $k=n$ undercounts every
          pattern, since it's always present regardless of overlap. Checking
          overlap incorrectly — comparing the wrong slices — silently
          produces the wrong sum.
      - ask: >
          A candidate computing the wait for $HHTT$ forgets the trivial
          $k=4$ term and finds no genuine partial overlaps (there are none).
          What mistake results?
        choices:
          - text: >
              They'd get $0$ instead of $16$, since the trivial full match
              always contributes $2^{n}$
            correct: true
            feedback: >
              Right — $HHTT$ has no proper prefix-suffix match, so only the
              trivial $k=4$ term contributes, giving $2^{4}=16$; dropping it
              leaves $0$.
          - text: >
              No mistake — $HHTT$ genuinely has zero expected wait
            feedback: >
              An expected wait of $0$ would mean the pattern appears before
              any tosses are made, which is impossible — the trivial term
              was simply dropped.
          - text: >
              The rule doesn't apply to $HHTT$, since it has no overlaps
            feedback: >
              The rule always applies; a pattern with no proper overlaps
              still gets the trivial full-length term, giving $2^{n}$ as its
              entire sum.
          - text: >
              The resulting answer would be too high, not too low
            feedback: >
              Dropping a term from a sum of positive contributions can only
              make the total too low, never too high.
        feedback: >
          $HHTT$'s only contribution is the trivial full match: $2^{4}=16$.
          Skipping it drops the answer to $0$, which can never be correct
          since the pattern must appear eventually.
      - teach: >
          Sum $2^{k}$ over every self-overlap length, the trivial full length
          always included — this reads off any fair-coin pattern's expected
          wait without setting up a single equation.

  - node: quant-tools.recurrences.three-in-a-row
    hook: >
      This is the natural three-state extension of the two-state pattern problems, and the doubling-plus-two growth in $2,6,14$ is worth recognizing on sight rather than rederiving from the equations every time.
    explanation: >
      With states $0,1,2$ tracking the current run of heads, each state's equation has the same shape: one toss is spent regardless of outcome, a head advances the run by one (or finishes it, at state $2$), and a tail sends the run all the way back to state $0$. That "back to zero" behavior is exactly what makes the growth from $E_0$ to $E_1$ to $E_2$ compound rather than add — every level of progress wiped out means paying for the entire climb again, not just the one toss that failed.

      Solving by back-substitution from $E_2$ downward — $E_2=1+\tfrac12(0)+\tfrac12E_0$, then $E_1=1+\tfrac12E_2+\tfrac12E_0$, then $E_0=1+\tfrac12E_1+\tfrac12E_0$ — gives $E_2=8$, $E_1=12$, $E_0=14$. The general formula this generates for $k$ heads in a row on a fair coin is $2^{k+1}-2$, matching $2,6,14$ for $k=1,2,3$, and for a biased coin with head probability $p$ it becomes $1/p+1/p^{2}+\dots+1/p^{k}$, reflecting that each additional required head is rarer than the last.
    worked: >
      For a coin biased at $p=1/3$, three heads in a row take $1/p+1/p^2+1/p^3=3+9+27=39$ tosses on average — far more than the fair-coin answer of $14$, since every one of the three required heads is individually three times rarer.
    interview: >
      "Expected number of flips to see three heads in a row" is meant to be answered via the three-state system with back-substitution, and a well-prepared answer names the $2^{k+1}-2$ pattern unprompted after producing the number $14$.
    pitfalls: >
      Solving the states in the wrong order — trying to isolate $E_0$ before expressing $E_1$ and $E_2$ in terms of it — tangles the algebra unnecessarily; back-substituting from the state closest to completion is far cleaner. Applying the fair-coin formula $2^{k+1}-2$ to a biased coin gives a wrong answer; the biased case needs the $1/p+\dots+1/p^k$ form.
    recap: >
      Three heads in a row take $14$ tosses on average for a fair coin, part of the $2^{k+1}-2$ ladder $2,6,14,\dots$ that comes from each failed run wiping out all prior progress.
    steps:
      - teach: >
          This is the natural three-state extension of the two-state pattern
          problems, and the doubling-plus-two growth in $2,6,14$ is worth
          recognizing on sight rather than rederiving from the equations
          every time.
      - teach: >
          States $0,1,2$ track the current run of heads: each toss spends one
          unit of time regardless of outcome, a head advances the run (or
          finishes it at state $2$), and a tail sends the run all the way
          back to state $0$. That total reset is what makes the growth
          compound rather than add.
      - teach: >
          Back-substituting from $E_2$ downward gives $E_2=8$, $E_1=12$,
          $E_0=14$ for a fair coin — the run $2,6,14$ is $2^{k+1}-2$ for
          $k=1,2,3$ heads in a row, and for a biased coin with head
          probability $p$ it generalizes to $1/p+1/p^{2}+\dots+1/p^{k}$,
          since each additional required head is rarer than the last.
      - ask: >
          Extend the fair-coin ladder to $k=4$ heads in a row using
          $2^{k+1}-2$. What is the expected number of tosses?
        expects: "30"
        hint: >
          Plug $k=4$ into $2^{k+1}-2$.
        feedback: >
          $2^{5}-2=32-2=30$.
      - teach: >
          Under bias, each extra required head costs progressively more,
          since it's individually rarer than the last — the biased sum
          $1/p+1/p^{2}+\dots+1/p^{k}$ weights later terms much more heavily
          than the fair-coin doubling does.
      - ask: >
          For a coin biased at $p=0.6$, use $1/p+1/p^{2}+1/p^{3}$ to find the
          expected wait for three heads in a row, to two decimals.
        expects: "9.07"
        tolerance: 0.02
        hint: >
          Compute each of the three terms separately, then add.
        feedback: >
          $1/0.6+1/0.36+1/0.216 \approx 1.67+2.78+4.63=9.07$ — far less than
          the fair-coin answer of $14$, since heads are more common here.
      - teach: >
          Solving the states in the wrong order — trying to isolate $E_0$
          before expressing $E_1$ and $E_2$ in terms of it — tangles the
          algebra unnecessarily; back-substituting from the state closest to
          completion is far cleaner. Applying $2^{k+1}-2$ to a biased coin
          gives a wrong answer outright.
      - ask: >
          A candidate is asked for the expected wait for three heads in a row
          with a coin biased at $p=0.6$, and answers $14$ (the fair-coin
          value). What's wrong?
        choices:
          - text: >
              Nothing — the expected wait for $k$ heads in a row doesn't
              depend on $p$
            feedback: >
              It depends heavily on $p$: a more head-favorable coin makes the
              wait shorter, and a less favorable one makes it longer.
          - text: >
              $2^{k+1}-2$ is fair-coin-only; a biased coin needs $1/p+1/p^{2}
              +\dots+1/p^{k}$, which gives about $9.07$, not $14$
            correct: true
            feedback: >
              Right — the doubling formula is derived at $p=1/2$ specifically;
              the general biased-coin formula gives roughly $9.07$ here.
          - text: >
              The correct answer is $14$ multiplied by $p$
            feedback: >
              That's not how the formula generalizes — the biased-coin
              answer comes from summing $1/p^{i}$ terms, not scaling the
              fair-coin answer by $p$.
          - text: >
              The fair-coin formula still applies, just with $k=4$ instead of
              $k=3$
            feedback: >
              Changing $k$ doesn't address the real issue — bias, not the
              target run length, is what breaks $2^{k+1}-2$ here.
        feedback: >
          $2^{k+1}-2$ only holds at $p=0.5$; under bias the wait is
          $1/p+1/p^{2}+\dots+1/p^{k}\approx9.07$ for $p=0.6,\,k=3$.
      - teach: >
          Every failed run costs the entire climb again, not just the toss
          that failed — that compounding is the whole reason the ladder
          doubles rather than adds, on a fair coin or a biased one.

  - node: quant-tools.recurrences.pattern-race
    hook: >
      "Which of two equally likely patterns tends to appear first" is a standard non-transitivity trap, and the fix is the same first-step conditioning used everywhere else in this unit, applied to a race rather than a single wait.
    explanation: >
      Racing two patterns needs states that track just enough recent history to know how close each pattern is to completing, and the win probability from each state satisfies the no-additive-constant form of first-step analysis, since only which pattern finishes first matters, not how long it takes. The absorbing (pattern-just-completed) states are known outright: $1$ if this pattern just won, $0$ if the other did.

      The recurring surprise is that these races are rarely fair even when the two patterns are individually equally probable, and they're famously non-transitive — pattern $A$ can beat $B$, $B$ can beat $C$, and $C$ can beat $A$, so there's no meaningful notion of one pattern being "stronger" outside a specific pairing. The mechanism is overlap asymmetry: whichever pattern is harder to spoil partway through tends to win the race, independent of how long it takes on average to complete alone.
    worked: >
      Race $HT$ against $TT$. Track the last symbol seen: states $H$ and $T$, plus a start state. From state $H$: the next toss is $T$ with probability $\tfrac12$, completing $HT$ (a win), or $H$ with probability $\tfrac12$, staying in state $H$; so $q_H=\tfrac12(1)+\tfrac12q_H$ gives $q_H=1$ — once an $H$ appears, $HT$ is certain to win eventually. From state $T$: the next toss is $T$ with probability $\tfrac12$, completing $TT$ (a loss), or $H$ with probability $\tfrac12$, moving to state $H$; so $q_T=\tfrac12(0)+\tfrac12(1)=\tfrac12$. From the start, the first toss lands in $H$ or $T$ equally: $q_0=\tfrac12(\tfrac12)+\tfrac12(1)=\tfrac34$. So $HT$ wins three times in four, mirroring the $TH$-versus-$HH$ result under swapping heads and tails.
    interview: >
      "Two players bet on $HH$ and $TH$ respectively — who's more likely to win?" is the canonical version; the interviewer listens for first-step conditioning on the opening toss and the explicit observation that race probabilities need not match individual waiting times.
    pitfalls: >
      Assuming the pattern with the shorter expected waiting time also wins the head-to-head race more often is not automatic — the two quantities need separate derivations. Forgetting that once a state guarantees one pattern wins with probability $1$, like state $H$ here, no further computation for that branch is needed.
    recap: >
      Racing two equally-probable patterns rarely gives even odds — $HT$ beats $TT$ three times in four, found by first-step conditioning on the opening toss, and pattern races are non-transitive in general.
    steps:
      - teach: >
          "Which of two equally likely patterns tends to appear first" is a
          standard non-transitivity trap, and the fix is the same first-step
          conditioning used everywhere else in this unit, applied to a race
          rather than a single wait.
      - teach: >
          Track just enough recent history to know how close each pattern is
          to completing, and the win probability from each state satisfies
          the no-additive-constant form of first-step analysis, since only
          which pattern finishes first matters. Absorbing states are known
          outright: $1$ if this pattern just won, $0$ if the other did.
      - ask: >
          Racing $HT$ against $HH$, from the state "last toss was $H$," the
          very next toss decides everything: a $T$ completes $HT$, an $H$
          completes $HH$. What is $\Pr(HT\text{ wins}\mid\text{state }H)$?
        expects: "0.5"
        hint: >
          Each of the two next tosses is equally likely, and either one
          resolves the race immediately.
        feedback: >
          $q_H=\tfrac12(1)+\tfrac12(0)=\tfrac12$.
      - teach: >
          The recurring surprise is that these races are rarely fair even
          when the two patterns are individually equally probable, and
          they're non-transitive in general — the mechanism is overlap
          asymmetry, and race probabilities need their own derivation,
          separate from waiting times.
      - ask: >
          Continuing that race: from the start (no toss yet), a $T$ changes
          nothing, since both patterns begin with $H$, so you stay at start;
          an $H$ moves you to state $H$ with $q_H=\tfrac12$ just found. What
          is $q_0=\Pr(HT\text{ wins})$ overall?
        expects: "0.5"
        hint: >
          Write $q_0=\tfrac12q_0+\tfrac12q_H$ and solve for $q_0$.
        feedback: >
          $q_0=\tfrac12q_0+\tfrac12\left(\tfrac12\right) \Rightarrow
          \tfrac12q_0=\tfrac14 \Rightarrow q_0=\tfrac12$ — an even race.
      - teach: >
          The pattern with the shorter expected wait ($HT$ averages $4$
          tosses, $HH$ averages $6$) does not automatically win the head-to-
          head race more often — here it's exactly even, underlining that the
          two quantities need separate derivations.
      - ask: >
          Which conclusion correctly follows from $HT$ vs $HH$ being an even
          $1/2$-$1/2$ race despite $HT$'s shorter average wait?
        choices:
          - text: >
              The race must actually favor $HT$, since it's faster on
              average
            feedback: >
              A shorter average wait doesn't transfer to a race edge — the
              derivation above gives an even $1/2$-$1/2$ split.
          - text: >
              Average waiting time and race probability are genuinely
              different quantities, and one can't be inferred from the other
            correct: true
            feedback: >
              Right — this pair is the sharpest illustration: waiting times
              differ ($4$ versus $6$), yet the race is dead even.
          - text: >
              The two patterns must have unequal individual probabilities
            feedback: >
              Both patterns have identical probability $1/4$ on any fixed
              pair of tosses — the asymmetry, when it exists, comes from
              overlap structure, not raw probability.
          - text: >
              This contradicts non-transitivity, so one of the derivations
              must be wrong
            feedback: >
              An even race between one particular pair is fully consistent
              with non-transitivity holding elsewhere among other pattern
              triples — nothing here is contradictory.
        feedback: >
          Waiting time and race probability answer different questions;
          $HT$ vs $HH$ shows a shorter average wait need not translate into a
          race edge at all.
      - teach: >
          Condition on the opening toss, write the no-constant probability
          equations, and solve — but never assume the race outcome from the
          waiting times alone.

  - node: quant-tools.recurrences.finiteness-caveat
    hook: >
      A first-step equation that looks perfectly solvable can still be describing an infinite expected value — this is the check interviewers add after a correct-looking derivation to see if you'll blindly trust algebra over the underlying process.
    explanation: >
      First-step equations are derived assuming the quantity they describe actually exists as a finite number; they are necessary conditions on that quantity, not a proof that it's finite. Waiting for a head from a coin with $p=0$ makes this vivid: the equation $E=1+E$ is technically still a correct statement about what any finite $E$ would have to satisfy, but no finite number satisfies it, and canceling $E$ from both sides manufactures the absurd $0=1$ rather than revealing that the true answer is $E=\infty$.

      On a finite state space there's a clean guarantee: if every state can eventually reach an absorbing state, all the expected absorption times are automatically finite, and the linear system has a unique solution — this is the safety net behind every worked example elsewhere in this unit. On an infinite state space that guarantee disappears; the linear system built from first-step equations can have a whole family of solutions, and the one that's probabilistically meaningful is the minimal nonnegative solution, not just any solution that satisfies the equations.

      A concrete instance beyond the degenerate $p=0$ case: for a symmetric random walk on all the integers, let $T$ be the expected number of steps to move up by exactly $1$. By translation invariance, moving from $-1$ up to $1$ costs $2T$ in expectation, so $T=1+\tfrac12(0)+\tfrac12(2T)=1+T$ — again no finite solution, and indeed this walk is recurrent (it reaches $1$ with probability $1$) but has genuinely infinite expected hitting time, because the state space is unbounded on both sides.
    worked: >
      For a symmetric random walk on the integers, the equation $T=1+T$ has no finite solution; the true expected time to move up by one step is $\infty$, even though the walk reaches that target with probability $1$ eventually — finite almost-sure arrival does not imply finite expected arrival time.
    interview: >
      "Solve for $E$ and it comes out to $0=1$ — what does that mean?" directly tests this node: the expected answer is "the true value is infinite," not a claim that the setup was wrong. It often follows a problem deliberately built with $p=0$ or an unbounded state space.
    pitfalls: >
      Treating every solvable-looking linear system as automatically giving a correct finite answer, without checking that the state space is finite and every state can reach absorption, risks reporting a meaningless number on an infinite state space with multiple solutions. Dismissing an equation like $E=1+E$ as "something's wrong with my setup" misses that it's telling you the true answer is $\infty$.
    recap: >
      A first-step equation with no finite solution usually means the true expected value is infinite; finiteness is guaranteed automatically on a finite state space where every state can reach absorption, and only minimal solutions count on an infinite one.
    steps:
      - teach: >
          A first-step equation that looks perfectly solvable can still be
          describing an infinite expected value — this is the check
          interviewers add after a correct-looking derivation, to see if
          you'll blindly trust algebra over the process it's modeling.
      - teach: >
          First-step equations are necessary conditions on a quantity assumed
          to exist; they don't prove that it does. On a finite state space
          where every state can reach absorption, that guarantee is
          automatic and the solution is unique — the safety net behind every
          other worked example in this unit.
      - ask: >
          A bounded random walk on positions $0,1,2,3$ has $0$ and $3$
          absorbing; from $1$ or $2$, the walker steps $+1$ or $-1$ with
          probability $\tfrac12$ each. Given $E_1=1+\tfrac12E_2$ and
          $E_2=1+\tfrac12E_1$ (using $E_0=E_3=0$), what is $E_1$?
        expects: "2"
        hint: >
          Substitute one equation into the other and solve for $E_1$.
        feedback: >
          $E_1=1+\tfrac12\left(1+\tfrac12E_1\right)=1.5+\tfrac14E_1
          \Rightarrow E_1=2$ (and $E_2=2$) — finite and unique, exactly as
          guaranteed on this bounded, every-state-absorbs chain.
      - teach: >
          On an infinite state space that guarantee disappears — the system
          can have a whole family of solutions, and the probabilistically
          meaningful one is the minimal nonnegative solution, not just any
          solution satisfying the equations. A degenerate equation like
          $E=1+E$ signals the true value is infinite, not a broken setup.
      - ask: >
          Remove the boundary from the walk above — an unbounded simple
          random walk on all the integers with no absorbing states at all,
          and let $T$ be the expected number of steps to move up by exactly
          $1$ from the start. First-step analysis gives $T=1+T$. What does
          this mean?
        choices:
          - text: >
              The true expected time is infinite, even though the walk
              reaches $+1$ with probability $1$ eventually
            correct: true
            feedback: >
              Right — this walk is recurrent (it reaches $+1$ almost surely)
              but has genuinely infinite expected hitting time, since the
              state space is unbounded on both sides.
          - text: >
              The walk can never reach $+1$
            feedback: >
              It reaches $+1$ with probability $1$ eventually — finite
              almost-sure arrival and finite *expected* arrival time are
              different claims.
          - text: >
              The setup is wrong and must be redone
            feedback: >
              The setup is correct; $T=1+T$ is exactly what a genuinely
              infinite expected value produces from first-step analysis on
              an unbounded space.
          - text: >
              $T$ equals $0$, since the equation has no finite solution
            feedback: >
              No finite solution existing points to $T=\infty$, not $T=0$ —
              canceling $T$ from both sides to get $0=1$ is the trap, not a
              route to $T=0$.
        feedback: >
          $T=1+T$ has no finite solution: the true expected time is
          infinite, despite the walk reaching $+1$ with probability $1$.
      - teach: >
          Treating every solvable-looking linear system as automatically
          finite and correct, without checking the state space is finite and
          every state can reach absorption, risks reporting a meaningless
          number on an infinite state space with multiple solutions.
          Dismissing $E=1+E$ as "my setup is broken" misses that it's telling
          you the true answer is infinite.
      - ask: >
          A die is tossed until a face showing $7$ appears — impossible on a
          standard six-sided die. What does first-step analysis give for the
          expected number of tosses, and what's the correct interpretation?
        choices:
          - text: >
              $E=1+E$, an equation no finite number satisfies — the true
              expected number of tosses is infinite
            correct: true
            feedback: >
              Right — with success probability $0$, the reset never
              actually happens, so $E$ is genuinely unbounded, exactly the
              $p=0$ case that manufactures $E=1+E$.
          - text: >
              $E=1+E$ solves to $E=0$
            feedback: >
              Canceling $E$ from both sides gives the absurdity $0=1$, not
              $E=0$ — the equation simply has no finite solution.
          - text: >
              $E=6$, one toss per face
            feedback: >
              That would be the answer if any face counted as success; here
              no face ever does, so the wait is unbounded, not $6$.
          - text: >
              The equation is invalid, so no conclusion can be drawn
            feedback: >
              A conclusion can be drawn: a first-step equation with no finite
              solution is itself the signal that the true expected value is
              infinite.
        feedback: >
          Success probability $0$ makes $E=1+E$, which no finite number
          satisfies — the honest reading is $E=\infty$, not a broken setup.
      - teach: >
          A solvable-looking equation can still describe an infinite mean —
          check that the state space is finite and every state can reach
          absorption before trusting the algebra at face value.
