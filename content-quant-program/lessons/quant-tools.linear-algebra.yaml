unit: quant-tools.linear-algebra
opening: >
  Linear algebra is the language quant desks use for portfolios, factor
  models and risk: a covariance matrix, a regression, a Markov transition
  matrix are all just matrices, and most interview questions about them
  reduce to matrix algebra, eigenstructure, or projection. This unit builds
  the toolkit in the order it compounds: matrix multiplication, rank and the
  solvability of $Ax=b$, determinant and trace, the equivalent faces of
  invertibility, eigenvalues and eigenvectors with the trace/determinant
  shortcut for finding them, orthogonality and the spectral theorem for
  symmetric matrices, quadratic forms and positive (semi)definiteness — the
  property that makes covariance matrices well-behaved — orthogonal
  projection and least squares, PCA as an eigendecomposition, and matrix
  powers via diagonalization. By the end you should be able to read
  eigenvalues off trace and determinant in your head, recognize a PSD matrix
  on sight, and see a regression, a Markov chain, and PCA as the same
  computation wearing different clothes.
lessons:
  - node: quant-tools.linear-algebra.matrix-algebra
    hook: >
      Every later result in this unit — determinants, eigenvalues,
      projections — is built out of multiplying, transposing and inverting
      matrices, so having "order reverses" automatic for both $(AB)^{T}$ and
      $(AB)^{-1}$ is worth owning before anything else starts.
    explanation: >
      $Ax$ is a linear combination of the columns of $A$, weighted by the
      entries of $x$ — so $A$ is completely determined by where it sends the
      coordinate vectors, and $AB$ means "first apply $B$, then apply $A$":
      composition of functions, read right to left. That composition view is
      why $AB \ne BA$ in general is not a technicality to memorize but a fact
      about function composition — doing $B$ then $A$ is a different map from
      doing $A$ then $B$.

      Transpose and inverse both "undo" a composition, and both reverse
      order for the same reason: to undo "first $B$, then $A$" you must undo
      $A$ first, then $B$. That symmetry is why $(AB)^{T}=B^{T}A^{T}$ and
      $(AB)^{-1}=B^{-1}A^{-1}$ have identical shape, and it is the cheapest
      sanity check available on any algebraic manipulation involving a
      product — if you didn't reverse the order, check again.

      Invertibility is reversibility: $A^{-1}$ exists exactly when the map
      $x \mapsto Ax$ can be undone by some other linear map. The $2\times2$
      formula is the one closed form worth having memorized cold, since the
      rest of the unit either uses it directly or generalizes it.
    worked: >
      Let $A$ have rows $(2,3)$ and $(1,4)$, and $B$ have rows $(0,1)$ and
      $(1,0)$. Then $AB$ has rows $(2\cdot0+3\cdot1,\,2\cdot1+3\cdot0) =
      (3,2)$ and $(1\cdot0+4\cdot1,\,1\cdot1+4\cdot0) = (4,1)$. For the
      inverse of $A$: $\det A = 2\cdot4-3\cdot1 = 5$, so $A^{-1}$ is
      $\tfrac{1}{5}$ times the matrix with rows $(4,-3)$ and $(-1,2)$, i.e.
      $A^{-1}$ has rows $(4/5,-3/5)$ and $(-1/5,2/5)$.
    interview: >
      Expect to multiply small matrices mentally and to be asked why
      $(AB)^{T} \ne A^{T}B^{T}$ in general — the interviewer wants the
      composition-reversal reasoning, not just the rule recited. A classic
      trap question is "does $AB=BA$ here" for a specific pair chosen to
      fail.
    pitfalls: >
      Assuming two matrices commute because their product looks "symmetric"
      by eye. Forgetting to reverse order when transposing or inverting a
      product — writing $(AB)^{-1}=A^{-1}B^{-1}$. Applying the $2\times2$
      inverse formula without first checking $\det A \ne 0$.
    recap: >
      Multiplying composes linear maps; transposing and inverting each undo
      that composition and so each reverse its order.
    dialogue:
      - part: Two adjustments, applied in two orders
        teach: >
          A position is a pair $(p, q)$. Adjustment $S$ doubles $p$ and leaves
          $q$ alone: $(p, q) \mapsto (2p, q)$. Adjustment $T$ folds $q$ into $p$:
          $(p, q) \mapsto (p + q, q)$. A colleague applies $S$ and then $T$; you
          apply $T$ and then $S$.
      - ask: >
          Start from $(1, 1)$. After your colleague's $S$-then-$T$, what is the
          first coordinate?
        expects: "3"
        feedback: >
          $S$ sends $(1, 1)$ to $(2, 1)$, and $T$ then sends that to
          $(2 + 1, 1) = (3, 1)$.
      - ask: >
          Same start, $(1, 1)$, but $T$ first and then $S$. What is the first
          coordinate now?
        expects: "4"
        hint: >
          $T$ acts on $(1, 1)$ before $S$ ever sees it.
        feedback: >
          $T$ sends $(1, 1)$ to $(2, 1)$, and $S$ doubles the first coordinate:
          $(4, 1)$. Same two adjustments, different order, different position.
      - reflect: >
          Both adjustments send sums to sums and multiples to multiples, so each
          is pinned down by what it does to just two inputs. Which two, and how
          would you write $T$ down as a grid of four numbers without any
          multiplication rule?
        answer: >
          Watch where it sends $(1, 0)$ and $(0, 1)$. $T$ sends $(1, 0)$ to
          $(1, 0)$ and $(0, 1)$ to $(1, 1)$; stack those two images as columns
          and you have $T$'s matrix, with rows $(1, 1)$ and $(0, 1)$. Any input
          $(p, q)$ is $p$ copies of the first plus $q$ copies of the second, so
          its image is $p$ times the first column plus $q$ times the second.
      - part: A product is a composition
        teach: >
          That is what a matrix is: the columns of $A$ are the images of the
          coordinate vectors, and $Ax$ is the combination of the columns
          weighted by the entries of $x$. $S$ has rows $(2, 0)$ and $(0, 1)$;
          $T$ has rows $(1, 1)$ and $(0, 1)$. The product $AB$, with $(i, j)$
          entry $\sum_{k} a_{ik} b_{kj}$, is the single matrix that does $B$
          first and then $A$ — the one next to $x$ acts first.
      - ask: >
          Which product is your colleague's map, $S$ first and then $T$?
        choices:
          - text: >
              $ST$, since $S$ is applied first
            feedback: >
              In $STx$ the factor next to $x$ is $T$, so $T$ acts first — that
              is your map, not your colleague's. Reading left to right is the
              usual slip.
          - text: >
              $TS$
            correct: true
            feedback: >
              $TSx = T(Sx)$: $S$ touches $x$ first, then $T$ acts on the result.
          - text: >
              Either; matrix products commute
            feedback: >
              You have already seen they do not: the two orders sent $(1, 1)$ to
              first coordinates $3$ and $4$.
          - text: >
              The entrywise product of $S$ and $T$
            feedback: >
              That has rows $(2, 0)$ and $(0, 1)$ — it is just $S$, and it sends
              $(1, 1)$ to $(2, 1)$, not $(3, 1)$. Entrywise products do not
              compose maps.
        feedback: >
          In $TSx$ the factor touching $x$ is $S$, so $S$ acts first. Products
          read right to left, like $f(g(x))$.
      - ask: >
          Compute $ST$, your $T$-then-$S$ map. What is its $(1, 2)$ entry?
        expects: "2"
        hint: >
          Row $1$ of $S$ against column $2$ of $T$.
        feedback: >
          Row $1$ of $S$ is $(2, 0)$ and column $2$ of $T$ is $(1, 1)$, so the
          entry is $2 \cdot 1 + 0 \cdot 1 = 2$. In full $ST$ has rows $(2, 2)$
          and $(0, 1)$, while $TS$ has rows $(2, 1)$ and $(0, 1)$. On $(1, 1)$
          they give $(4, 1)$ and $(3, 1)$ — the two positions you found by hand.
      - part: Undoing the last step first
        ask: >
          Your colleague's $S$-then-$T$ produced the position $(5, 2)$. What was
          the original first coordinate $p$?
        expects: "3/2"
        hint: >
          The last adjustment applied is the first one to take off.
        feedback: >
          Undo $T$ by subtracting $q$ from $p$: $(5 - 2, 2) = (3, 2)$. Then undo
          $S$ by halving $p$: $(3/2, 2)$. Check: $S$ gives $(3, 2)$, then $T$
          gives $(5, 2)$.
      - ask: >
          Which matrix undoes $TS$?
        choices:
          - text: >
              $T^{-1}S^{-1}$
            feedback: >
              That undoes $S$ first. On $(5, 2)$: halving gives $(5/2, 2)$, then
              subtracting gives $(1/2, 2)$ — and $S$-then-$T$ sends $(1/2, 2)$
              to $(3, 2)$, not $(5, 2)$.
          - text: >
              $S^{-1}T^{-1}$
            correct: true
            feedback: >
              $T^{-1}$ sits next to the input, so it acts first — exactly the
              order you used by hand. The last thing done is the first undone.
          - text: >
              It has no inverse, because $T$ mixes the coordinates.
            feedback: >
              Mixing is not destroying. $T$ is undone by $(p, q) \mapsto
              (p - q, q)$, and you just used that inverse.
        feedback: >
          $(AB)^{-1} = B^{-1}A^{-1}$. Taking off a coat and then a jumper means
          the jumper went on first.
      - ask: >
          The transpose also reverses order. Take $A$ of shape $2 \times 3$ and $B$
          of shape $3 \times 4$, so $(AB)^{T}$ is $4 \times 2$. Which expression
          is even defined with that shape?
        choices:
          - text: >
              $A^{T}B^{T}$
            feedback: >
              $A^{T}$ is $3 \times 2$ and $B^{T}$ is $4 \times 3$: the inner sizes
              $2$ and $4$ do not match, so the product does not exist.
          - text: >
              $(BA)^{T}$
            feedback: >
              $BA$ would be $3 \times 4$ times $2 \times 3$, which is not
              defined, so neither is its transpose.
          - text: >
              $B^{T}A^{T}$
            correct: true
            feedback: >
              $4 \times 3$ times $3 \times 2$ gives $4 \times 2$. With
              rectangular matrices the shapes alone force the reversal.
        feedback: >
          $(AB)^{T} = B^{T}A^{T}$, the same reversal as the inverse. When a
          manipulation involves a product, checking that the order flipped is the
          cheapest test that it is legal.
      - part: The two-by-two inverse, and when it fails
        ask: >
          $M$ has rows $(3, 5)$ and $(1, 2)$. Swap its diagonal, negate the
          off-diagonal and divide by $ad - bc$. What is the $(1, 2)$ entry of
          $M^{-1}$?
        expects: "-5"
        hint: >
          Here $ad - bc = 3 \cdot 2 - 5 \cdot 1$.
        feedback: >
          $ad - bc = 6 - 5 = 1$, so $M^{-1}$ has rows $(2, -5)$ and $(-1, 3)$.
          Check one entry of $MM^{-1}$: row $1$ of $M$ against column $2$ is
          $3(-5) + 5 \cdot 3 = 0$, as the identity needs.
      - ask: >
          Now the matrix with rows $(4, 6)$ and $(2, 3)$. What happens?
        choices:
          - text: >
              Its inverse has rows $(3, -6)$ and $(-2, 4)$.
            feedback: >
              That is the swap-and-negate without the division. Multiply it
              against the original: row $1$ times column $1$ is
              $4 \cdot 3 + 6(-2) = 0$, not $1$. The product is the zero matrix.
          - text: >
              It has an inverse, just with very large entries.
            feedback: >
              Large entries come from a small nonzero $ad - bc$. Here it is
              $12 - 12 = 0$ exactly, and there is nothing to divide by.
          - text: >
              It has no inverse: it sends $(3, -2)$ to $(0, 0)$.
            correct: true
            feedback: >
              $4 \cdot 3 + 6(-2) = 0$ and $2 \cdot 3 + 3(-2) = 0$. Both $(3, -2)$
              and $(0, 0)$ land on $(0, 0)$, so no map can tell you which one
              you started from.
        feedback: >
          $ad - bc = 0$ means the second column is a multiple of the first, and
          the map squashes the plane onto a line. Check $ad - bc$ before using
          the formula, not after.
  - node: quant-tools.linear-algebra.rank-solvability
    hook: >
      "How many solutions does this system have" is answered before any
      elimination — it's always none, one, or infinitely many, and knowing
      why two solutions is impossible is a fast, free interview point.
    explanation: >
      Since $Ax$ is always a combination of $A$'s columns, the column space
      is nothing but the set of every possible output $Ax$, and rank counts
      how many of those columns point in genuinely new directions rather
      than repeating ones already covered. Solvability of $Ax=b$ is then
      just membership: $b$ must lie in that column space, or no combination
      of columns can produce it.

      The three-case classification follows from the shape of the solution
      set, not from casework. If a solution exists, the full solution set is
      one particular solution shifted by the null space — a subspace, which
      is either just $\{0\}$ (unique solution) or infinite (a line, plane,
      ...; never a finite set bigger than one point). That structural fact,
      not luck, is why "exactly two solutions" never happens for a real
      linear system.

      Rank-nullity is the bookkeeping behind the dimension count:
      $n - \operatorname{rank}(A)$ free parameters remain once
      $\operatorname{rank}(A)$ independent constraints have been used up.
    worked: >
      Take $A$ with rows $(1,2,1)$ and $(2,4,2)$ — row $2$ is twice row $1$,
      so $\operatorname{rank}(A)=1$. With $b=(3,6)$: since $6=2\cdot3$, the
      augmented matrix has the same rank $1$, so the system is consistent,
      and the solution set is $\{(x,y,z): x+2y+z=3\}$, a $2$-dimensional
      plane ($n-\operatorname{rank}(A)=3-1=2$). With $b=(3,7)$ instead,
      $7 \ne 2\cdot3$, the augmented rank jumps to $2 \ne \operatorname{rank}
      (A)$, and there is no solution at all.
    interview: >
      "How many solutions can a linear system have" is fished for the
      "$0$, $1$, or infinity, never two" answer. A system with visibly
      proportional rows or columns is often handed over specifically to see
      if you spot the rank deficiency instead of grinding through
      elimination.
    pitfalls: >
      Assuming a square system automatically has a unique solution — it
      fails whenever $\det A = 0$. Checking only $\operatorname{rank}(A)$
      for consistency and forgetting the augmented matrix $[A\mid b]$ must
      match it. Treating "infinitely many solutions" as always a line —
      the family has dimension $n-\operatorname{rank}(A)$, which can exceed
      $1$.
    recap: >
      Rank counts independent directions in $A$, and it alone decides
      whether $Ax=b$ has zero, one, or an
      $(n-\operatorname{rank}(A))$-dimensional family of solutions.
    dialogue:
      - part: Three conditions on three weights
        teach: >
          You need weights $x, y, z$ on three funds. Fully invested:
          $x + y + z = 1$. A target exposure: $x + 2y + 3z = 2$. The risk desk
          adds a third condition: $2x + 3y + 4z = 3$.
      - ask: >
          Look for a solution with $z = 0$. What is $y$?
        expects: "1"
        hint: >
          With $z = 0$ the first two conditions are $x + y = 1$ and $x + 2y = 2$.
        feedback: >
          Subtracting gives $y = 1$, so $x = 0$. The third condition checks:
          $0 + 3 + 0 = 3$. The weights $(0, 1, 0)$ work.
      - ask: >
          Now look for one with $z = 1$. What is $x$?
        expects: "1"
        feedback: >
          The first two become $x + y = 0$ and $x + 2y = -1$, so $y = -1$ and
          $x = 1$. The third: $2 - 3 + 4 = 3$. The weights $(1, -1, 1)$ work
          too.
      - ask: >
          Three equations, three unknowns, and two different answers. What went
          wrong with the count?
        choices:
          - text: >
              Nothing: one of the two solutions must contain a slip.
            feedback: >
              Both pass all three conditions — plug them in again. The count is
              what failed, not the arithmetic.
          - text: >
              Three equations in three unknowns always have infinitely many
              solutions.
            feedback: >
              $x = 1$, $y = 2$, $z = 3$ is three equations in three unknowns
              with exactly one solution. Squareness decides nothing on its own.
          - text: >
              The third condition is the first plus the second, so it adds no
              information.
            correct: true
            feedback: >
              $(x + y + z) + (x + 2y + 3z) = 2x + 3y + 4z$, and $1 + 2 = 3$.
              Any weights meeting the first two meet the third automatically.
        feedback: >
          The number of equations is not the number of *independent* equations.
          Here there are really only two.
      - reflect: >
          Subtract your two solutions: $d = (1, -1, 1) - (0, 1, 0) = (1, -2, 1)$.
          What do the three left-hand sides give when you plug in $d$, and what
          does that tell you about every solution at once?
        hint: >
          Each left-hand side is linear, and the two solutions share right-hand
          sides.
        answer: >
          All three give $0$: $1 - 2 + 1 = 0$, $1 - 4 + 3 = 0$, $2 - 6 + 4 = 0$.
          So $d$ is in the null space of the coefficient matrix $A$, and adding
          any multiple of it to a solution leaves every left-hand side
          unchanged. The solutions are $(0, 1, 0) + t(1, -2, 1)$ for every $t$:
          one particular solution plus the null space, a whole line.
      - part: Rank decides which of three cases
        teach: >
          The count that matters is the rank: the number of independent columns
          of $A$, which equals the number of independent rows and the number of
          pivots. Here it is $2$. Rank–nullity says
          $\operatorname{rank}(A) + \dim \ker(A) = n$, so the null space has
          dimension $3 - 2 = 1$. $Ax = b$ is solvable exactly when $b$ lies in
          the column space — when appending $b$ as an extra column does not
          raise the rank — and then the solutions are one particular solution
          plus $\ker(A)$.
      - ask: >
          The risk desk revises its condition to $2x + 3y + 4z = 4$, keeping the
          other two. How many weight vectors satisfy all three?
        choices:
          - text: >
              Still a line: only a right-hand side changed.
            feedback: >
              The first two still force $2x + 3y + 4z = 1 + 2 = 3$, and the
              third now demands $4$. No weights can do both.
          - text: >
              None
            correct: true
            feedback: >
              The left-hand sides are tied together — the third is the sum of
              the first two — but the right-hand sides are no longer tied the
              same way.
          - text: >
              Exactly one, since the conditions are now different from each
              other.
            feedback: >
              The left-hand sides are the same three as before, so the null
              space is still a line. Changing $b$ can only remove the solutions
              or shift them, never shrink a line to a point.
        feedback: >
          Consistency is a question about $b$; the shape of the solution set,
          when there is one, is a question about $A$ alone.
      - ask: >
          With $b = (1, 2, 4)$, what is the rank of the augmented matrix
          $[A \mid b]$?
        expects: "3"
        hint: >
          $A$ has rank $2$. Does the new fourth column lie in the span of the
          old three?
        feedback: >
          Row $3$ of $A$ is row $1$ plus row $2$, but $4 \ne 1 + 2$, so the
          augmented rows are independent: rank $3$. $\operatorname{rank}(A) = 2
          < 3 = \operatorname{rank}[A \mid b]$, which is the test for no
          solution.
      - ask: >
          A $5 \times 8$ matrix $A$ has rank $3$. For a $b$ where $Ax = b$ is
          solvable, what is the dimension of the family of solutions?
        expects: "5"
        feedback: >
          The family is a translate of $\ker(A)$, and rank–nullity gives
          $\dim \ker(A) = 8 - 3 = 5$. The $5$ rows play no part: the count is
          columns minus rank.
      - part: Never exactly two
        ask: >
          $u = (1, 0, 2)$ and $v = (3, 1, 0)$ both solve the same system
          $Ax = b$. Then $3v - 2u$ is a solution too. What is its third
          coordinate?
        expects: "-4"
        hint: >
          $A(3v - 2u) = 3Av - 2Au$.
        feedback: >
          $3 \cdot 0 - 2 \cdot 2 = -4$, so $3v - 2u = (7, 3, -4)$. It solves the
          system because $A(3v - 2u) = 3b - 2b = b$. The same works for
          $u + t(v - u)$ with every real $t$: two solutions bring a whole line.
      - ask: >
          Can four equations in three unknowns have exactly one solution?
        choices:
          - text: >
              No: more equations than unknowns is always inconsistent.
            feedback: >
              $x = 1$, $y = 2$, $z = 3$, $x + y + z = 6$ is four equations in
              three unknowns, consistent, with exactly one solution.
          - text: >
              No: $A$ is not square, so it has no inverse to solve with.
            feedback: >
              Uniqueness never needed an inverse. It needs $\ker(A) = \{0\}$,
              which here means rank $3$ — four rows can have that.
          - text: >
              Yes, when $\operatorname{rank}(A) = 3$ and $[A \mid b]$ also has
              rank $3$.
            correct: true
            feedback: >
              Equal ranks give a solution, and rank equal to the number of
              unknowns makes the null space $\{0\}$, so the solution is unique.
        feedback: >
          The three cases are decided by two numbers: whether the ranks of $A$
          and $[A \mid b]$ agree, and how far $\operatorname{rank}(A)$ falls
          short of the number of unknowns. In an interview, "never exactly two"
          is one sentence: the difference of two solutions is in the null
          space, so every point on the line through them solves too.
  - node: quant-tools.linear-algebra.determinant-trace
    hook: >
      "$\det A=0$" is the fastest mental invertibility check there is, and
      reading it as "the map crushed some direction to zero volume" — not as
      an opaque formula — is what lets you see it coming before you compute.
    explanation: >
      The determinant is pinned down by three simple requirements (linear in
      each column, sign-flipping under a column swap, $\det I=1$), and for
      $2\times2$ this collapses to $ad-bc$: literally the signed area of the
      parallelogram spanned by the two columns. If the columns are parallel
      — one a scalar multiple of the other — that parallelogram degenerates
      to a line segment, area zero, so $\det A=0$ exactly matches being
      rank-deficient: less than full rank means the columns no longer span
      a full-dimensional shape.

      Trace is unrelated to that volume story but has its own invariance:
      $\operatorname{tr}(AB)=\operatorname{tr}(BA)$ even though $AB\ne BA$
      in general, which is why $\operatorname{tr}A$ is unchanged under
      $A \mapsto P^{-1}AP$ — a fact that will matter once eigenvalues are on
      the table, since a change of basis shouldn't change what a matrix
      "truly" does.
    worked: >
      For $A$ with rows $(3,1)$ and $(2,4)$: $\det A = 3\cdot4-1\cdot2=10$
      and $\operatorname{tr}A=3+4=7$ — the unit square, area $1$, maps to a
      parallelogram of area $10$. Contrast with $A'$ having rows $(1,3)$ and
      $(2,6)$: the columns are $(1,2)$ and $(3,6)$, proportional, so
      $\det A' = 1\cdot6-3\cdot2=0$ and the image collapses to a line.
    interview: >
      Expect a quick $2\times2$ or $3\times3$ computation, but also "what
      does a zero determinant tell you about the columns geometrically" —
      the wanted answer is "they no longer span full-dimensional volume,"
      not just "the matrix is singular."
    pitfalls: >
      Sign slips in $ad-bc$ versus $bc-ad$. Assuming a large or small trace
      says anything about invertibility — it doesn't; trace can be $0$ for
      an invertible matrix. Reading $\operatorname{tr}(AB)=
      \operatorname{tr}(BA)$ as $\operatorname{tr}A\cdot\operatorname{tr}B=
      \operatorname{tr}(AB)$, which is false.
    recap: >
      The determinant is signed volume scaling, zero exactly when a
      direction collapses; the trace is the diagonal sum, already invariant
      under change of basis.
    dialogue:
      - part: The area of a squashed square
        teach: >
          The map $A$ with rows $(4, 1)$ and $(1, 2)$ sends the unit square to a
          parallelogram. Its sides are the columns of $A$, $(4, 1)$ and
          $(1, 2)$, so its corners are $(0, 0)$, $(4, 1)$, $(1, 2)$ and
          $(5, 3)$.
      - ask: >
          What is the area of that parallelogram?
        expects: "7"
        hint: >
          Enclose it in the $5 \times 3$ box and subtract the corner pieces that
          lie outside it.
        feedback: >
          The box has area $15$. Outside the parallelogram sit two triangles of
          area $\tfrac{1}{2} \cdot 4 \cdot 1 = 2$, two of area
          $\tfrac{1}{2} \cdot 1 \cdot 2 = 1$, and two $1 \times 1$ squares:
          $15 - 4 - 2 - 2 = 7$. It is also $4 \cdot 2 - 1 \cdot 1$, entries
          crossed.
      - ask: >
          Swap the columns: $B$ has rows $(1, 4)$ and $(2, 1)$. Its image is the
          same parallelogram. What is $ad - bc$ for $B$?
        expects: "-7"
        feedback: >
          $1 \cdot 1 - 4 \cdot 2 = -7$. The same size as before, with the
          opposite sign.
      - ask: >
          Same parallelogram, area $7$, but the formula now says $-7$. What is the
          sign recording?
        choices:
          - text: >
              Nothing: area is $|ad - bc|$ and the sign is an artefact.
            feedback: >
              The size is $|ad - bc|$, but the sign carries something the
              picture shows too: under $A$ the first side $(4, 1)$ turns
              anticlockwise to reach the second side $(1, 2)$, as $(1, 0)$ does
              to reach $(0, 1)$; under $B$ the turn is clockwise.
          - text: >
              Whether the map flips the square over, reversing its orientation
            correct: true
            feedback: >
              $A$ keeps the anticlockwise order of the square's sides and $B$
              reverses it, like a reflection. One swap of the columns, one
              flip of the sign.
          - text: >
              That $B$ shrinks area while $A$ grows it
            feedback: >
              Both images have area exactly $7$. Shrinking would show up as a
              size below $1$, not as a sign.
        feedback: >
          The useful number is a *signed* area: its size is the scaling of area,
          its sign is orientation.
      - ask: >
          Now $C$ with rows $(2, 6)$ and $(1, 3)$. What is $ad - bc$?
        expects: "0"
        feedback: >
          $2 \cdot 3 - 6 \cdot 1 = 0$. The columns $(2, 1)$ and $(6, 3)$ point
          along the same line, so the square is flattened onto that line and
          has no area left.
      - reflect: >
          You want one number per matrix that gives the signed area of the image
          of the unit square. List the rules it has to obey — what must happen
          when you double one column, when you swap the two columns, and what it
          must give for the identity?
        answer: >
          Doubling a side doubles the area, and in general it is linear in each
          column separately, with the other held fixed. Swapping the columns
          keeps the shape and reverses orientation, so the number changes
          sign. And the identity leaves the square alone, so it must give $1$.
          Those three rules are enough to force $ad - bc$, and in $n$
          dimensions they force a unique function.
      - part: Determinant, named by its rules
        teach: >
          That function is the determinant: the unique function of the columns
          of a square matrix that is linear in each column, changes sign when two
          columns are swapped, and has $\det I = 1$. For $2 \times 2$ it is
          $ad - bc$; larger matrices expand along a row by cofactors. $A$ scales
          $n$-dimensional volume by $|\det A|$, and $\det A = 0$ says $A$
          flattens space onto something lower-dimensional, as $C$ did.
      - ask: >
          A colleague proposes a simpler volume factor: the product of the
          diagonal, $f = ad$. Which of the three rules does it break?
        choices:
          - text: >
              $f(I) = 1$
            feedback: >
              $f(I) = 1 \cdot 1 = 1$. That rule holds.
          - text: >
              Linearity in each column
            feedback: >
              $a$ lives in column $1$ and $d$ in column $2$, so $ad$ is linear in
              each column with the other fixed. That rule holds too.
          - text: >
              The sign change on swapping columns
            correct: true
            feedback: >
              Swapping the columns of $A$ gives rows $(1, 4)$ and $(2, 1)$, and
              $f$ goes from $4 \cdot 2 = 8$ to $1 \cdot 1 = 1$, not $-8$. A
              function that ignores the off-diagonal cannot notice a flip.
        feedback: >
          Exactly one rule fails, and that rule is what forces the $-bc$ term.
          Drop it and the "area" of $C$ would be $6$ instead of $0$.
      - part: The other invariant, trace
        ask: >
          The trace is the sum of the diagonal. $P$ has rows $(1, 2)$ and
          $(3, 0)$; $Q$ has rows $(2, 0)$ and $(1, 1)$. What is
          $\operatorname{tr}(PQ)$?
        expects: "4"
        hint: >
          You only need the two diagonal entries of $PQ$.
        feedback: >
          $(PQ)_{11} = 1 \cdot 2 + 2 \cdot 1 = 4$ and
          $(PQ)_{22} = 3 \cdot 0 + 0 \cdot 1 = 0$, so the trace is $4$.
      - ask: >
          Before computing it: what is $\operatorname{tr}(QP)$?
        choices:
          - text: >
              $3$, which is $\operatorname{tr}P \cdot \operatorname{tr}Q$
            feedback: >
              $\operatorname{tr}P \cdot \operatorname{tr}Q = 1 \cdot 3 = 3$,
              but $\operatorname{tr}(PQ)$ was already $4$. Trace does not
              multiply.
          - text: >
              $4$, the same as $\operatorname{tr}(PQ)$
            correct: true
            feedback: >
              $QP$ has rows $(2, 4)$ and $(4, 2)$, trace $4$ — although
              $QP \ne PQ$. Both traces are $\sum_{i,k} p_{ik}q_{ki}$, the same
              sum read in a different order.
          - text: >
              No way to know: $PQ \ne QP$.
            feedback: >
              The matrices differ, yet the diagonal sums cannot:
              $\operatorname{tr}(PQ) = \sum_{i,k} p_{ik}q_{ki} =
              \operatorname{tr}(QP)$ for every pair.
        feedback: >
          $\operatorname{tr}(AB) = \operatorname{tr}(BA)$, and so
          $\operatorname{tr}(P^{-1}AP) = \operatorname{tr}(APP^{-1}) =
          \operatorname{tr}A$: trace survives any change of basis, as the
          determinant does.
      - ask: >
          The matrix with rows $(1, 3)$ and $(2, -1)$ has trace $0$. Does it
          flatten the plane?
        choices:
          - text: >
              Yes: trace $0$ means it squashes space.
            feedback: >
              That is the determinant's job, not the trace's. Here
              $\det = -1 - 6 = -7$, so area is scaled by $7$ and the plane is
              not flattened.
          - text: >
              No: its determinant is $-7$.
            correct: true
            feedback: >
              Area is scaled by $7$ with a flip. The trace, $0$, says nothing
              about whether the map collapses.
          - text: >
              Only if its columns have equal length.
            feedback: >
              Column lengths do not decide it either. Flattening means the
              columns are parallel, which $(1, 2)$ and $(3, -1)$ are not.
        feedback: >
          Determinant answers "does it collapse, and by how much does it scale";
          trace answers neither. They are two different invariants.
  - node: quant-tools.linear-algebra.determinant-properties
    hook: >
      "Elimination, then multiply the pivots" is the only determinant
      algorithm that scales past $3\times3$ by hand — knowing which row
      operations survive it is what turns a $4\times4$ determinant into a
      two-minute problem instead of a cofactor nightmare.
    explanation: >
      A triangular matrix's determinant being the product of its diagonal
      follows immediately from cofactor expansion: expanding along the first
      column (or row) of a triangular matrix, every term except the diagonal
      one multiplies a zero, so only the diagonal survives at each step. That
      single fact is what makes elimination an efficient determinant
      algorithm rather than just a way to solve systems.

      Track what each row operation does to the volume it represents: adding
      a multiple of one row to another shears the parallelepiped without
      changing its volume, so the determinant is unchanged; swapping two
      rows flips orientation, so the sign flips; scaling a row by $c$ stretch
      es that one edge by $c$, so the determinant scales by $c$ — exactly the
      alternating, multilinear properties the determinant was built from.

      Multiplicativity, $\det(AB)=\det A\cdot\det B$, is composing two
      volume-scaling factors, and $\det(A^{-1})=1/\det A$ follows since
      composing $A$ with $A^{-1}$ scales volume by $1$. $\det(A+B)$ has no
      such formula because the determinant is linear in one column at a
      time, not in the whole matrix — adding matrices mixes columns from
      both.
    worked: >
      Compute $\det$ of $A$ with rows $(1,2,3)$, $(2,5,3)$, $(1,0,8)$ by
      elimination: $R_2 \to R_2-2R_1$ gives $(0,1,-3)$; $R_3 \to R_3-R_1$
      gives $(0,-2,5)$; then $R_3 \to R_3+2R_2$ gives $(0,0,-1)$. No swaps or
      scalings were used, so $\det A$ is the product of the resulting
      diagonal: $1\cdot1\cdot(-1) = -1$.
    interview: >
      Handed a $3\times3$ or $4\times4$ matrix, the interviewer is watching
      whether you reach for elimination instead of full cofactor expansion.
      "What's $\det(A+B)$ given $\det A$ and $\det B$" is a standard trap —
      the correct answer is that there is no such formula.
    pitfalls: >
      Forgetting to flip the sign on a row swap during elimination.
      Writing $\det(cA)=c\det A$ instead of $c^{n}\det A$ — every one of the
      $n$ rows gets scaled. Trying to derive $\det(A+B)$ from $\det A$ and
      $\det B$ alone.
    recap: >
      Elimination turns a determinant into "product of the pivots," with a
      sign flip per row swap and a factor per row scaling to track along the
      way.
    dialogue:
      - part: Scaling factors, composed
        teach: >
          Two $2 \times 2$ maps. $A$ triples every area and keeps orientation,
          so $\det A = 3$. $B$ multiplies every area by $5$ and flips it, so
          $\det B = -5$.
      - ask: >
          Apply $B$, then $A$. What is $\det(AB)$?
        expects: "-15"
        hint: >
          Follow one unit square through both maps.
        feedback: >
          $B$ turns area $1$ into area $5$, flipped; $A$ triples that to $15$,
          and keeps the flip. So $\det(AB) = 3 \cdot (-5) = -15$.
      - ask: >
          What is $\det(A^{-1})$?
        expects: "1/3"
        feedback: >
          $A^{-1}$ undoes the tripling, so it scales area by $1/3$. Formally,
          $\det(A)\det(A^{-1}) = \det(AA^{-1}) = \det I = 1$.
      - ask: >
          What is $\det(2A)$?
        expects: "12"
        hint: >
          $2A$ doubles both columns of $A$.
        feedback: >
          Doubling both columns doubles the area twice: $2^{2} \cdot 3 = 12$.
          Determinant is linear in *each* column, so for an $n \times n$ matrix
          $\det(cA) = c^{n}\det A$, not $c \det A$.
      - ask: >
          Products were easy. What is $\det(A + B)$?
        choices:
          - text: >
              $3 + (-5) = -2$
            feedback: >
              Take $A = B = I$: then $\det A + \det B = 2$ but
              $\det(A + B) = \det(2I) = 4$. Determinants do not add.
          - text: >
              $3 \cdot (-5) = -15$, the same as the product
            feedback: >
              The product rule is about composition, $AB$. Adding two maps is a
              different operation, and $A = B = I$ gives $4$, not $1$.
          - text: >
              It cannot be determined from $\det A$ and $\det B$.
            correct: true
            feedback: >
              $A = I$ and $B = I$ give $\det(A + B) = 4$, while $A = I$ and
              $B = -I$ give $\det(0) = 0$. The two determinants do not pin it
              down.
        feedback: >
          Determinants multiply across products and have no useful formula
          across sums. That asymmetry is the most common trap here.
      - part: Making a matrix triangular
        ask: >
          The upper-triangular matrix with rows $(2, 7, -1)$, $(0, 3, 5)$ and
          $(0, 0, -1)$: what is its determinant?
        expects: "-6"
        hint: >
          Expand down the first column; only one entry there is nonzero.
        feedback: >
          Down the first column, $2$ times the determinant of rows $(3, 5)$ and
          $(0, -1)$, which is $2(-3 - 0) = -6$. That is $2 \cdot 3 \cdot (-1)$:
          the entries above the diagonal never mattered.
      - reflect: >
          Now $M$ with rows $(1, 2, 1)$, $(3, 7, 2)$ and $(2, 5, 4)$ is not
          triangular. Subtracting $3$ times row $1$ from row $2$ would clear an
          entry. Why can that not change the determinant? Use only linearity and
          the sign flip on a swap.
        hint: >
          Split the new row into its two pieces, and ask what a matrix with two
          equal rows has for a determinant.
        answer: >
          By linearity in that row, the new determinant is $\det M$ plus $-3$
          times the determinant of a matrix whose rows $1$ and $2$ are both row
          $1$. Swapping two equal rows changes nothing yet must flip the sign,
          so that determinant is $0$. Adding a multiple of one row to another
          therefore leaves the determinant alone — which is what makes
          elimination a way of computing it.
      - part: Elimination as the algorithm
        teach: >
          The rules: $\det(AB) = \det A \det B$, $\det(A^{T}) = \det A$ (so
          rows behave like columns), $\det(cA) = c^{n}\det A$, and
          $\det(A^{-1}) = 1/\det A$. A triangular matrix has determinant equal
          to the product of its diagonal. In elimination, adding a multiple of
          one row to another changes nothing, swapping two rows flips the sign,
          and scaling a row by $c$ scales the determinant by $c$. Reduce to
          triangular form and multiply the pivots.
      - ask: >
          Eliminate $M$, rows $(1, 2, 1)$, $(3, 7, 2)$, $(2, 5, 4)$, to
          triangular form. What is $\det M$?
        expects: "3"
        hint: >
          Clear column $1$ using row $1$, then clear the last entry of column
          $2$ using the new row $2$.
        feedback: >
          $R_2 - 3R_1 = (0, 1, -1)$ and $R_3 - 2R_1 = (0, 1, 2)$; then
          $R_3 - R_2 = (0, 0, 3)$. Only additions were used, so
          $\det M = 1 \cdot 1 \cdot 3 = 3$. Cofactors agree:
          $1(28 - 10) - 2(12 - 4) + 1(15 - 14) = 3$.
      - ask: >
          $N$ has rows $(0, 2, 1)$, $(1, 3, 0)$ and $(0, 0, 5)$. Its first pivot
          is $0$, so you swap rows $1$ and $2$ first. What is $\det N$?
        expects: "-10"
        feedback: >
          After the swap the rows are $(1, 3, 0)$, $(0, 2, 1)$, $(0, 0, 5)$,
          already triangular with determinant $1 \cdot 2 \cdot 5 = 10$. One
          swap flips the sign: $\det N = -10$. Reporting $10$ is the classic
          slip.
      - ask: >
          $A$ is $5 \times 5$ with $\det A = 2$. What is $\det(-A)$?
        expects: "-2"
        feedback: >
          $\det(-A) = (-1)^{5}\det A = -2$. Negating flips all five rows, one
          sign each. For a $4 \times 4$ the answer would have been $+2$ — the
          size of the matrix, not just the scalar, decides the sign.
  - node: quant-tools.linear-algebra.invertibility
    hook: >
      This is the node where an interviewer makes you name the same fact
      five different ways in one conversation — hesitating on any single
      equivalence reads as not actually seeing why they coincide.
    explanation: >
      All these conditions collapse to one because they're restatements of
      "$x \mapsto Ax$ is a bijection $\mathbb{R}^{n}\to\mathbb{R}^{n}$":
      injective is $\ker A=\{0\}$ (independent columns), surjective is the
      columns spanning $\mathbb{R}^{n}$ (full rank). For a square map,
      injective and surjective are the same property — a linear
      self-map that never merges two inputs automatically hits everything,
      and vice versa — which is special to the square case and is exactly
      why this long list of equivalences exists only here.

      The determinant enters through the volume story already built: less
      than full rank forces the column parallelepiped into a
      lower-dimensional set, zero volume, $\det A=0$ — the same collapse,
      just named differently.

      A practical footnote: a tiny nonzero determinant is not a
      reassurance. Determinant scales with the size of the entries, so it is
      not a normalized measure of "how close to singular" a matrix is —
      near-singular matrices amplify input error regardless of how small
      $|\det A|$ happens to be.
    worked: >
      Check $A$ with rows $(2,1)$ and $(1,3)$: $\det A = 6-1=5 \ne 0$, and
      the columns $(2,1)$, $(1,3)$ are not proportional, so $A$ is
      invertible. Confirm via the unique-solution test: solving $2x+y=5$,
      $x+3y=5$ gives $y=5-2x$, so $x+3(5-2x)=5 \Rightarrow -5x=-10
      \Rightarrow x=2,\,y=1$ — one solution, as $\det A\ne0$ predicted.
    interview: >
      "How do you check invertibility" wants the equivalences rattled off
      interchangeably, then usually a follow-up: "which would you actually
      compute for a $10\times10$ matrix" — testing that elimination-based
      rank, not cofactor determinants, is the practical answer at scale.
    pitfalls: >
      Treating "determinant nonzero" as a different, extra check on top of
      "full rank" rather than the same fact computed another way. Trusting a
      small nonzero determinant as evidence of good conditioning.
    recap: >
      For a square matrix, invertible, full rank, nonzero determinant,
      independent columns, and a unique solution to every $Ax=b$ are one
      fact in five costumes — check whichever is cheapest.
    dialogue:
      - part: Three hedges for three factors
        teach: >
          You hold three hedging instruments, and each unit of one carries
          exposures to three risk factors. Instrument $1$ carries
          $(1, 0, 1)$, instrument $2$ carries $(0, 1, 1)$, instrument $3$
          carries $(1, 1, 2)$. These are the columns of $A$, and amounts $x$
          offset an exposure $b$ when $Ax = b$.
      - ask: >
          To offset $b = (2, 3, 5)$ without touching instrument $3$, how many
          units of instrument $2$ do you need?
        expects: "3"
        feedback: >
          With $x_3 = 0$ the first two coordinates force $x_1 = 2$ and
          $x_2 = 3$, and the third checks: $2 + 3 = 5$.
      - ask: >
          A colleague offsets the same $b$ using no instrument $1$ at all. How
          many units of instrument $3$ does that take?
        expects: "2"
        hint: >
          With $x_1 = 0$, the first coordinate of $Ax$ is $x_3$ alone.
        feedback: >
          $x_3 = 2$ from the first coordinate, then $x_2 + x_3 = 3$ gives
          $x_2 = 1$; check $x_2 + 2x_3 = 5$. So $(2, 3, 0)$ and $(0, 1, 2)$
          both work: the hedge is not unique.
      - ask: >
          Can you offset $b = (0, 0, 1)$?
        choices:
          - text: >
              Yes: three instruments for three factors always suffice.
            feedback: >
              Every column has third entry equal to the sum of its first two,
              so every combination $Ax$ does too. $(0, 0, 1)$ breaks that
              pattern and is out of reach.
          - text: >
              No: every combination of the columns has third coordinate equal to
              the sum of the first two.
            correct: true
            feedback: >
              The columns all lie in the plane $b_3 = b_1 + b_2$, and so does
              everything you can build from them.
          - text: >
              Yes, with very large positions in all three.
            feedback: >
              Scaling up stays inside the same plane. Size cannot buy a
              direction the columns never had.
        feedback: >
          Some exposures cannot be hedged at all, and the ones that can be are
          hedged in many ways.
      - ask: >
          What is $\det A$?
        expects: "0"
        feedback: >
          Expanding along row $1$: $1(1 \cdot 2 - 1 \cdot 1) - 0 + 1(0 \cdot 1 - 1
          \cdot 1) = 1 - 1 = 0$.
      - reflect: >
          Three things went wrong together: some exposures are unreachable, the
          reachable ones have several hedges, and the determinant is $0$. Name
          the single fact about the instruments behind all three.
        answer: >
          Instrument $3$ is instrument $1$ plus instrument $2$: the columns are
          dependent. So $(1, 1, -1)$ is a nonzero amount with zero exposure —
          add it to any hedge and get another. The columns span only a plane,
          so exposures off that plane are unreachable. And a map that sends
          space into a plane flattens volume, so $\det A = 0$. One dependency,
          three symptoms.
      - part: One condition with many faces
        teach: >
          For a square $n \times n$ matrix these are all equivalent: $A$ is
          invertible; $\operatorname{rank}(A) = n$; $\det A \ne 0$; the columns
          are independent; the columns span $\mathbb{R}^{n}$;
          $\ker(A) = \{0\}$; $Ax = b$ has exactly one solution for every $b$;
          $A^{T}$ is invertible. Each fails exactly when the others do, so you
          test whichever is cheapest — and the rest come free.
      - ask: >
          $B$ is $3 \times 3$ with columns $u$, $v$ and $u - 2v$, where $u$ and
          $v$ are independent. A nonzero $x$ with $Bx = 0$ has $x_1 = 1$ and
          $x_2 = -2$. What is $x_3$?
        expects: "-1"
        hint: >
          Collect the coefficient of $u$ and of $v$ in $Bx$.
        feedback: >
          $Bx = u - 2v + x_3(u - 2v) = (1 + x_3)(u - 2v)$, which is zero when
          $x_3 = -1$. You never needed $\det B$: a visibly dependent column
          already settles every condition on the list.
      - ask: >
          $C$ is $3 \times 2$ with two independent columns. Is $C$ invertible?
        choices:
          - text: >
              Yes: its columns are independent, which is one of the equivalent
              conditions.
            feedback: >
              The list is for *square* matrices. Two columns span only a plane
              in $\mathbb{R}^{3}$, so $Cx = b$ has no solution for most $b$.
          - text: >
              No: the equivalences need a square matrix, and two columns cannot
              span $\mathbb{R}^{3}$.
            correct: true
            feedback: >
              Independence still makes solutions unique when they exist, but
              existence fails. Only for square matrices do "unique" and
              "always exists" come as a pair.
          - text: >
              It depends on its determinant.
            feedback: >
              A $3 \times 2$ matrix has no determinant. That is a sign the
              question needs squareness before it makes sense.
        feedback: >
          Rank–nullity is what welds "one-to-one" and "onto" together, and it
          only does so when the number of columns equals the number of rows.
      - part: Invertible but barely
        ask: >
          $D$ has rows $(1, 1)$ and $(1, 1.0001)$, so $\det D = 0.0001 \ne 0$.
          $Dx = (2, 2)$ has the solution $(2, 0)$. Now nudge the data to
          $b = (2, 2.0001)$. What is $x_2$?
        expects: "1"
        hint: >
          Subtract the first equation from the second.
        feedback: >
          The difference is $0.0001\,x_2 = 0.0001$, so $x_2 = 1$ and $x_1 = 1$.
          A change of $0.0001$ in the data moved the answer from $(2, 0)$ to
          $(1, 1)$.
      - ask: >
          What does that say about trusting a tiny nonzero determinant?
        choices:
          - text: >
              Nothing: invertible is invertible, and the solution is exact.
            feedback: >
              Exact in exact arithmetic. With data rounded to four places you
              just saw the answer move by a whole unit, so the "exact" solution
              is noise.
          - text: >
              It is a warning: a nearly flattening map amplifies input error.
            correct: true
            feedback: >
              $D$ almost sends $(1, -1)$ to zero, so tiny changes in $b$ are
              answered by large moves along that direction.
          - text: >
              Determinants that small round to zero, so $D$ is singular.
            feedback: >
              $D$ is invertible; its determinant is $0.0001$, not $0$. The
              trouble is sensitivity, not singularity.
        feedback: >
          The equivalences are yes-or-no. In practice, how close a matrix is to
          failing them matters as much as whether it does.
  - node: quant-tools.linear-algebra.eigen
    hook: >
      "Find the eigenvalues" is asked constantly not for the arithmetic but
      because setting up $\det(A-\lambda I)=0$ correctly, and reading what a
      repeated or complex root means, is the gate to PCA, Markov chains, and
      every stability question later.
    explanation: >
      Along a general vector, $Ax$ can point anywhere; along an eigenvector
      the map degenerates to pure scaling. Nearly everything you'll later
      want to know about a matrix's long-run or extremal behavior traces
      back to these special one-dimensional directions.

      The derivation is one line: $Av=\lambda v$ with $v\ne0$ rearranges to
      $(A-\lambda I)v=0$, a homogeneous system with a nonzero solution
      exactly when $A-\lambda I$ is singular. That's the same determinant
      test invertibility already uses, applied to $A-\lambda I$ instead of
      $A$, so $\det(A-\lambda I)=0$ is not a new idea, just the old one
      aimed at a shifted matrix.

      This characteristic polynomial has degree $n$, hence exactly $n$
      roots over $\mathbb{C}$ counted with multiplicity. Real matrices can
      have genuinely complex eigenvalues — a pure rotation has no real
      invariant direction at all — and a repeated root's eigenspace can be
      smaller than its multiplicity, a wrinkle that resurfaces when asking
      whether a matrix can be diagonalized.
    worked: >
      For $A$ with rows $(4,2)$ and $(3,-1)$: $\det(A-\lambda I) =
      (4-\lambda)(-1-\lambda)-6 = \lambda^{2}-3\lambda-10 =
      (\lambda-5)(\lambda+2)$, so $\lambda=5,-2$. For $\lambda=5$: $A-5I$
      has rows $(-1,2)$ and $(3,-6)$, giving eigenvector $(2,1)$. For
      $\lambda=-2$: $A+2I$ has rows $(6,2)$ and $(3,1)$, giving eigenvector
      $(1,-3)$.
    interview: >
      "Find the eigenvalues of this matrix" cold is standard. A common
      follow-up — "what if $A$ is a rotation" — fishes for the complex,
      no-real-eigendirection answer rather than a stalled computation.
    pitfalls: >
      Forgetting $v \ne 0$ is required — $v=0$ trivially satisfies the
      equation for any $\lambda$ but carries no information. Sign errors
      expanding $(a-\lambda)(d-\lambda)-bc$. Assuming a repeated eigenvalue
      automatically has a matching-dimension eigenspace — it need not.
    recap: >
      Eigenvectors are the directions where $A$ is pure scaling, found by
      solving $\det(A-\lambda I)=0$ and then $(A-\lambda I)v=0$ for each
      root.
    dialogue:
      - part: Inputs that keep their direction
        teach: >
          $A$ has rows $(6, -2)$ and $(2, 1)$. Most vectors come out of $A$
          pointing somewhere new. Feed it $(2, 1)$ and you get
          $(12 - 2, 4 + 1) = (10, 5)$.
      - ask: >
          $(10, 5)$ lies on the same line as $(2, 1)$. By what factor did $A$
          stretch it?
        expects: "5"
        feedback: >
          $(10, 5) = 5 \cdot (2, 1)$. On this input, $A$ does nothing but
          multiply by $5$.
      - ask: >
          What does $A$ do to $(1, 0)$?
        choices:
          - text: >
              Stretches it by $6$, the top-left entry.
            feedback: >
              $A(1, 0)$ is the first column, $(6, 2)$, and $6 \cdot (1, 0) =
              (6, 0)$. The second coordinate $2$ shows it was turned off its
              line.
          - text: >
              Sends it to $(6, 2)$, which is off the line through $(1, 0)$.
            correct: true
            feedback: >
              The first column is the image of $(1, 0)$, and it is not a
              multiple of $(1, 0)$. Most inputs are turned as well as
              stretched.
          - text: >
              Leaves it alone, since $(1, 0)$ is a coordinate vector.
            feedback: >
              Coordinate vectors go to the columns: $(1, 0) \mapsto (6, 2)$. Only
              the identity fixes them.
        feedback: >
          $(2, 1)$ is special and $(1, 0)$ is not. The special inputs are rare,
          and they are what this lesson is about.
      - ask: >
          Try $(1, 2)$. It also comes out on its own line. By what factor?
        expects: "2"
        feedback: >
          $A(1, 2) = (6 - 4, 2 + 2) = (2, 4) = 2 \cdot (1, 2)$. Two directions,
          two stretch factors, $5$ and $2$.
      - reflect: >
          You found $(2, 1)$ and $(1, 2)$ by being handed them. Write
          "$Av = \lambda v$ for some $v \ne 0$" as a statement about the single
          matrix $A - \lambda I$, and say what equation that puts on $\lambda$.
        hint: >
          Move $\lambda v$ to the left. What does a matrix that sends a nonzero
          vector to $0$ do to area?
        answer: >
          $Av = \lambda v$ is $(A - \lambda I)v = 0$. A matrix sending a nonzero
          $v$ to $0$ collapses that direction, so it flattens the plane and its
          determinant is $0$. So $\lambda$ must solve
          $\det(A - \lambda I) = 0$ — here
          $(6 - \lambda)(1 - \lambda) + 4 = \lambda^{2} - 7\lambda + 10$, whose
          roots are $5$ and $2$.
      - part: The definition, then a fresh matrix
        teach: >
          A scalar $\lambda$ and a nonzero $v$ with $Av = \lambda v$ are an
          eigenvalue and an eigenvector. The eigenvalues are the roots of the
          characteristic polynomial $\det(A - \lambda I)$, of degree $n$, with
          $n$ roots over $\mathbb{C}$ counted with multiplicity. The eigenspace
          for $\lambda$ is $\ker(A - \lambda I)$: every vector $A - \lambda I$
          kills, all of them eigenvectors except $0$.
      - ask: >
          $B$ has rows $(1, 2)$ and $(3, 2)$. What is its larger eigenvalue?
        expects: "4"
        hint: >
          Expand $(1 - \lambda)(2 - \lambda) - 6$ and factor.
        feedback: >
          $\lambda^{2} - 3\lambda + 2 - 6 = \lambda^{2} - 3\lambda - 4 =
          (\lambda - 4)(\lambda + 1)$, so the eigenvalues are $4$ and $-1$.
      - ask: >
          An eigenvector of $B$ for $\lambda = 4$ has first coordinate $2$. What
          is its second?
        expects: "3"
        hint: >
          Any row of $B - 4I$ must vanish against it.
        feedback: >
          $B - 4I$ has rows $(-3, 2)$ and $(3, -2)$, so $-3 \cdot 2 + 2y = 0$
          gives $y = 3$. Check: $B(2, 3) = (2 + 6, 6 + 6) = (8, 12) =
          4 \cdot (2, 3)$.
      - ask: >
          A candidate argues that every number is an eigenvalue of every
          matrix, because $A0 = \lambda 0$ for any $\lambda$. Which clause does
          that ignore?
        choices:
          - text: >
              That $\lambda$ must be real.
            feedback: >
              Eigenvalues may be complex. The argument fails for a different
              reason, and would fail for real $\lambda$ too.
          - text: >
              That $v$ must be nonzero.
            correct: true
            feedback: >
              The zero vector satisfies $A0 = \lambda 0$ for every $\lambda$, so
              it carries no information. That is exactly why the definition
              excludes it.
          - text: >
              That $A$ must be invertible.
            feedback: >
              Singular matrices have eigenvalues — $0$ is one of them. The
              argument goes wrong at the vector, not the matrix.
        feedback: >
          Without $v \ne 0$ the definition says nothing. With it, eigenvalues
          are the roots of one polynomial and nothing else.
      - part: When no direction survives
        ask: >
          $R$ has rows $(1, -1)$ and $(1, 1)$: it turns every vector by $45$
          degrees and stretches it by $\sqrt{2}$. Its characteristic polynomial
          is $(1 - \lambda)^{2} + 1$. What can you say?
        choices:
          - text: >
              Its eigenvalues are $1 \pm i$, and no real direction is kept.
            correct: true
            feedback: >
              $(1 - \lambda)^{2} = -1$ gives $\lambda = 1 \pm i$. A map that
              turns every vector by the same angle has nowhere to keep a line
              fixed.
          - text: >
              It has no eigenvalues at all.
            feedback: >
              Over $\mathbb{C}$ every degree-$2$ polynomial has two roots, here
              $1 \pm i$. What fails is a *real* eigenvector, not the
              eigenvalues.
          - text: >
              Its eigenvalue is $\sqrt{2}$, the stretch.
            feedback: >
              $R(1, 0) = (1, 1)$, which is not $\sqrt{2}(1, 0)$. Stretching
              every vector is not the same as keeping any of their directions.
        feedback: >
          A real matrix can have complex eigenvalues, and then it has no real
          eigendirection.
      - ask: >
          $S$ has rows $(3, 1)$ and $(0, 3)$, so $\lambda = 3$ is a double root.
          Is every vector an eigenvector, as it is for $3I$?
        choices:
          - text: >
              Yes: a double eigenvalue gives a two-dimensional eigenspace.
            feedback: >
              $S(0, 1) = (1, 3)$, not $3 \cdot (0, 1)$. The root counts twice;
              the eigenspace need not.
          - text: >
              No: $S - 3I$ has rows $(0, 1)$ and $(0, 0)$, which kills only
              multiples of $(1, 0)$.
            correct: true
            feedback: >
              The eigenspace is a line, dimension $1$, under an eigenvalue of
              multiplicity $2$. A repeated root does not promise repeated
              directions.
          - text: >
              No: $S$ has no eigenvectors, because it is not symmetric.
            feedback: >
              $S(1, 0) = (3, 0)$, so $(1, 0)$ is an eigenvector. Symmetry is not
              needed for eigenvectors to exist.
        feedback: >
          The dimension of the eigenspace, the geometric multiplicity, is at
          least $1$ and at most the multiplicity of the root — and it can fall
          short.
  - node: quant-tools.linear-algebra.trace-det-eigen
    hook: >
      Reading eigenvalues of a $2\times2$ straight off trace and determinant
      — no expanding $\det(A-\lambda I)$ by hand — is the difference between
      finding them in five seconds and thirty on a whiteboard.
    explanation: >
      This is packaging, not new content: comparing coefficients of
      $\det(\lambda I-A)=\prod_i(\lambda-\lambda_i)$ against the same
      polynomial expanded from $A$'s entries forces the $\lambda^{n-1}$
      coefficient to equal $-\operatorname{tr}A$ and the constant term to
      equal $(-1)^{n}\det A$ — for $n=2$ that's exactly $\sum_i\lambda_i=
      \operatorname{tr}A$ and $\prod_i\lambda_i=\det A$.

      For $2\times2$ this collapses the entire characteristic-polynomial
      computation to $\lambda^{2}-(\operatorname{tr}A)\lambda+\det A=0$,
      solved directly by
      the quadratic formula — no need to ever expand $(a-\lambda)(d-\lambda)
      -bc$ by hand again.

      Two corollaries worth having automatic: a zero eigenvalue is invisible
      in the trace but announces itself immediately as $\det A=0$; and
      $\operatorname{tr}A/n$ is literally the average eigenvalue, a free
      sanity check on any eigenvalue computation done some other way.
    worked: >
      For $A$ with rows $(7,-4)$ and $(2,1)$: $\operatorname{tr}A=8$,
      $\det A = 7-(-8)=15$. So $\lambda = 4 \pm \sqrt{16-15} = 4\pm1$, giving
      $\lambda=5,3$. Check: $5+3=8$ matches the trace, $5\cdot3=15$ matches
      the determinant.
    interview: >
      "Give me the eigenvalues of this $2\times2$ without expanding the
      determinant" is the direct ask. A subtler version, "what's the average
      eigenvalue of this large matrix," wants $\operatorname{tr}A/n$ with no
      eigendecomposition at all.
    pitfalls: >
      Applying the trace/determinant shortcut as if it pins down eigenvalues
      for $n>2$ — it gives only two equations, not enough for more than two
      unknowns. Flipping the sign in $\lambda^{2}-(\operatorname{tr}A)
      \lambda+\det A$.
    recap: >
      Eigenvalues always sum to the trace and multiply to the determinant,
      which for $2\times2$ is a plug-and-chug quadratic formula.
    dialogue:
      - part: A pattern in three spectra
        teach: >
          Three matrices, with eigenvalues found the long way. Rows $(4, 1)$
          and $(0, -2)$: eigenvalues $4$ and $-2$. Rows $(2, 3)$ and $(2, 1)$:
          eigenvalues $4$ and $-1$. Rows $(3, -1)$ and $(1, 1)$: eigenvalue $2$,
          twice.
      - ask: >
          Add the two eigenvalues of each matrix: $2$, $3$ and $4$. Which number
          read straight off each matrix gives the same three values?
        choices:
          - text: >
              The sum of the first row
            feedback: >
              The first rows sum to $5$, $5$ and $2$. Not a match.
          - text: >
              The sum of the diagonal entries
            correct: true
            feedback: >
              $4 + (-2) = 2$, $2 + 1 = 3$, $3 + 1 = 4$. The trace matches every
              time, even for the matrix that is not triangular.
          - text: >
              The determinant
            feedback: >
              The first matrix has determinant $-8$, not $2$. Determinants
              match something else, as the next question shows.
        feedback: >
          The sum of the eigenvalues is the trace in all three cases.
      - ask: >
          Now multiply the eigenvalues: $-8$, $-4$ and $4$. What is the
          determinant of the second matrix, rows $(2, 3)$ and $(2, 1)$?
        expects: "-4"
        feedback: >
          $2 \cdot 1 - 3 \cdot 2 = -4 = 4 \cdot (-1)$. Product of eigenvalues,
          determinant: the same again.
      - reflect: >
          Why should this hold for every $2 \times 2$ matrix? Write
          $\det(\lambda I - A)$ for rows $(a, b)$ and $(c, d)$ in two ways —
          once from the entries, once from its roots — and compare.
        hint: >
          A monic quadratic with roots $\lambda_1, \lambda_2$ is
          $(\lambda - \lambda_1)(\lambda - \lambda_2)$.
        answer: >
          From the entries, $(\lambda - a)(\lambda - d) - bc = \lambda^{2} -
          (a + d)\lambda + (ad - bc)$. From the roots,
          $(\lambda - \lambda_1)(\lambda - \lambda_2) = \lambda^{2} -
          (\lambda_1 + \lambda_2)\lambda + \lambda_1\lambda_2$. Same
          polynomial, so the coefficients agree: the trace is the sum and the
          determinant is the product. In $n$ dimensions the same comparison
          reads off the $\lambda^{n-1}$ and constant terms.
      - part: Eigenvalues in one line
        teach: >
          For any $n \times n$ matrix, with eigenvalues listed with multiplicity
          and allowed to be complex, $\operatorname{tr} A = \sum_{i}
          \lambda_i$ and $\det A = \prod_{i} \lambda_i$. For $n = 2$ the
          characteristic polynomial is
          $\lambda^{2} - (\operatorname{tr} A)\lambda + \det A$, so
          $\lambda = \operatorname{tr} A/2 \pm
          \sqrt{(\operatorname{tr} A/2)^{2} - \det A}$.
      - ask: >
          A $2 \times 2$ matrix has trace $10$ and determinant $21$. Which
          equation do its eigenvalues solve?
        choices:
          - text: >
              $\lambda^{2} + 10\lambda + 21 = 0$
            feedback: >
              Its roots are $-3$ and $-7$, which sum to $-10$, not the trace
              $10$. The trace enters with a minus sign.
          - text: >
              $\lambda^{2} - 21\lambda + 10 = 0$
            feedback: >
              Trace and determinant have traded places. The linear coefficient
              is the sum of the roots, the constant is their product.
          - text: >
              $\lambda^{2} - 10\lambda + 21 = 0$
            correct: true
            feedback: >
              The roots are $3$ and $7$: sum $10$, product $21$.
        feedback: >
          Minus the trace, plus the determinant. If unsure, check the roots
          against both.
      - ask: >
          $M$ has rows $(9, 4)$ and $(-2, 3)$. What is its larger eigenvalue?
        expects: "7"
        hint: >
          Half the trace, then the square root of its square minus the
          determinant.
        feedback: >
          $\operatorname{tr} M = 12$ and $\det M = 27 + 8 = 35$, so
          $\lambda = 6 \pm \sqrt{36 - 35} = 6 \pm 1$: $7$ and $5$. Check:
          $7 + 5 = 12$ and $7 \cdot 5 = 35$.
      - ask: >
          $N$ has rows $(1, 4)$ and $(2, -1)$. What is its positive eigenvalue?
        expects: "3"
        feedback: >
          Trace $0$ and determinant $-1 - 8 = -9$, so $\lambda = 0 \pm
          \sqrt{0 + 9} = \pm 3$. A zero trace means the eigenvalues are
          negatives of each other.
      - part: What two numbers cannot tell you
        ask: >
          A $4 \times 4$ matrix has eigenvalues $2$, $-1$, $3$ and $0.5$. What is
          its determinant?
        expects: "-3"
        feedback: >
          $2 \cdot (-1) \cdot 3 \cdot 0.5 = -3$. No eigenvalue is $0$, so the
          matrix is invertible; one zero eigenvalue would have made the
          determinant $0$.
      - ask: >
          A $3 \times 3$ matrix has trace $9$ and determinant $24$. A candidate
          announces the eigenvalues $2, 3, 4$. Is that forced?
        choices:
          - text: >
              Yes: it is the only triple with sum $9$ and product $24$.
            feedback: >
              $-1, -2, 12$ also sums to $9$ with product $24$, and so does
              $1, 4 + 2\sqrt{2}i, 4 - 2\sqrt{2}i$. Two equations cannot pin
              down three unknowns.
          - text: >
              No: trace and determinant give two equations for three
              eigenvalues.
            correct: true
            feedback: >
              $2, 3, 4$ is consistent but not forced: $-1, -2, 12$ fits too. For
              $n = 3$ you need a third piece of information, such as
              $\operatorname{tr}(A^{2}) = \sum_{i} \lambda_i^{2}$.
          - text: >
              Yes, provided the matrix is real.
            feedback: >
              $-1, -2, 12$ are real, and a diagonal real matrix with those
              entries has trace $9$ and determinant $24$.
        feedback: >
          The one-line formula is a $2 \times 2$ privilege. For larger matrices
          trace and determinant are checks on an answer, not a way to find it.
          Said aloud in an interview: "trace is the sum, determinant the
          product, so for a $2 \times 2$ the eigenvalues are half the trace
          plus or minus a square root."
  - node: quant-tools.linear-algebra.eigen-2x2
    hook: >
      This is the drill an interviewer runs to see if the trace/determinant
      shortcut is actually automatic for you, not just something you can
      state — expect back-to-back matrices with the clock running.
    explanation: >
      The routine is three lines: read $\operatorname{tr}A$ and $\det A$
      off the matrix, solve the quadratic for both eigenvalues at once, then
      find each eigenvector from $(A-\lambda I)v=0$. Because $A-\lambda_i I$
      is singular by construction, its two rows are always proportional, so
      only one of them needs solving.

      Symmetric matrices are the friendly case — the spectral theorem for
      symmetric matrices guarantees real eigenvalues and orthogonal
      eigenvectors automatically — but the same three-line routine runs
      unchanged on a non-symmetric matrix; it simply won't hand you
      orthogonality for free.

      The fastest self-check after finding both eigenvalues is comparing
      their sum and product back against the trace and determinant you
      started from, catching an arithmetic slip before it propagates into
      an eigenvector computation that would otherwise look plausible and be
      wrong.
    worked: >
      For the non-symmetric $A$ with rows $(1,4)$ and $(2,3)$:
      $\operatorname{tr}A=4$, $\det A=3-8=-5$, so
      $\lambda=2\pm\sqrt{4+5}=2\pm3$, giving $\lambda=5,-1$. For $\lambda=5$:
      $A-5I$ has rows $(-4,4)$ and $(2,-2)$, giving eigenvector $(1,1)$. For
      $\lambda=-1$: $A+I$ has rows $(2,4)$ and $(2,4)$, giving eigenvector
      $(2,-1)$. Note $(1,1)\cdot(2,-1)=1\ne0$ — not orthogonal, since $A$
      isn't symmetric.
    interview: >
      Expect two or three of these back to back, sometimes a deliberately
      non-symmetric matrix to see whether you notice the eigenvectors won't
      come out perpendicular and don't force them to.
    pitfalls: >
      Plugging $\lambda$ into the wrong row of $A-\lambda I$, or an
      arithmetic slip there. Assuming eigenvectors are always orthogonal —
      that's a consequence of symmetry, not a general fact about
      eigenvectors.
    recap: >
      Trace and determinant give both eigenvalues in one line; each
      eigenvector then falls out of one (necessarily dependent) row of
      $A-\lambda I$.
    dialogue:
      - part: One minute, one symmetric matrix
        teach: >
          The interviewer writes down $A$ with rows $(3, 2)$ and $(2, 0)$ and asks
          for its eigenvalues and eigenvectors, out loud, inside a minute.
      - ask: >
          Start with the two invariants. The trace is $3$. What is the
          determinant?
        expects: "-4"
        feedback: >
          $3 \cdot 0 - 2 \cdot 2 = -4$. A negative determinant already tells you
          the eigenvalues are real and of opposite signs, since their product is
          negative.
      - ask: >
          What is the larger eigenvalue?
        expects: "4"
        hint: >
          $\lambda = 1.5 \pm \sqrt{1.5^{2} - (-4)}$.
        feedback: >
          $\lambda = 1.5 \pm \sqrt{2.25 + 4} = 1.5 \pm 2.5$, so $4$ and $-1$.
          Check: $4 + (-1) = 3$ and $4 \cdot (-1) = -4$.
      - reflect: >
          For $\lambda = 4$, $A - 4I$ has rows $(-1, 2)$ and $(2, -4)$. Before
          doing any elimination, why must those two rows be proportional, and
          how does that let you write an eigenvector down from one row alone?
        answer: >
          $4$ is an eigenvalue, so $\det(A - 4I) = 0$ and the rows are
          proportional — here the second is $-2$ times the first. You only need
          $v$ perpendicular to one row: a row $(p, q)$ is killed by
          $(q, -p)$. From $(-1, 2)$ that gives $(2, 1)$. If the two rows had
          come out *not* proportional, the eigenvalue would be wrong, which is a
          free arithmetic check.
      - ask: >
          The eigenvector for $\lambda = 4$ is $(2, 1)$. The eigenvector for
          $\lambda = -1$ has first coordinate $1$. What is its second?
        expects: "-2"
        hint: >
          $A + I$ has first row $(4, 2)$.
        feedback: >
          $A + I$ has rows $(4, 2)$ and $(2, 1)$, so $4 + 2y = 0$ and $y = -2$.
          Check: $A(1, -2) = (3 - 4, 2 + 0) = (-1, 2) = -1 \cdot (1, -2)$.
      - ask: >
          $(2, 1)$ and $(1, -2)$ are perpendicular: $2 \cdot 1 + 1 \cdot (-2) =
          0$. Why?
        choices:
          - text: >
              Eigenvectors of different eigenvalues are always perpendicular.
            feedback: >
              They are always independent, not always perpendicular. The next
              matrix is a counterexample.
          - text: >
              Because $A$ is symmetric.
            correct: true
            feedback: >
              Symmetric matrices have perpendicular eigenvectors for distinct
              eigenvalues. Without symmetry there is no such promise.
          - text: >
              Because one eigenvalue is negative.
            feedback: >
              The signs play no part. A symmetric matrix with eigenvalues $4$
              and $1$ would have perpendicular eigenvectors too.
        feedback: >
          On a symmetric matrix, perpendicularity is also a check: once you have
          one eigenvector $(p, q)$, the other must be along $(q, -p)$.
      - part: The same minute, without symmetry
        ask: >
          $B$ has rows $(5, -1)$ and $(3, 1)$. What is its smaller eigenvalue?
        expects: "2"
        feedback: >
          Trace $6$, determinant $5 + 3 = 8$, so $\lambda = 3 \pm \sqrt{9 - 8} =
          3 \pm 1$: $4$ and $2$.
      - ask: >
          $B - 4I$ has rows $(1, -1)$ and $(3, -3)$, giving the eigenvector
          $(1, 1)$. The eigenvector for $\lambda = 2$ has first coordinate $1$.
          What is its second?
        expects: "3"
        feedback: >
          $B - 2I$ has rows $(3, -1)$ and $(3, -1)$, so $3 - y = 0$ and
          $y = 3$. Check: $B(1, 3) = (5 - 3, 3 + 3) = (2, 6) = 2 \cdot (1, 3)$.
      - ask: >
          On the symmetric matrix the two eigenvectors met at a right angle.
          What is the dot product of $(1, 1)$ and $(1, 3)$?
        expects: "4"
        feedback: >
          $1 \cdot 1 + 1 \cdot 3 = 4 \ne 0$: not perpendicular. Distinct
          eigenvalues guarantee independent eigenvectors and nothing more; the
          right angle came from symmetry, and $B$ is not symmetric. The "rotate
          one row a quarter turn" trick still finds each eigenvector, but the
          "other one is perpendicular" shortcut would have given $(1, -1)$,
          and $B(1, -1) = (6, 2)$ is no multiple of it.
      - ask: >
          A candidate reports eigenvalues $6$ and $2$ for $B$. Which check
          catches it in one second?
        choices:
          - text: >
              The sum: $6 + 2 = 8$, but the trace is $6$.
            correct: true
            feedback: >
              One addition. Their product, $12$, also misses the
              determinant $8$.
          - text: >
              None short of redoing the characteristic polynomial.
            feedback: >
              The trace and determinant are already on the page, and $6 + 2 = 8
              \ne 6$.
          - text: >
              Checking that both are positive.
            feedback: >
              Both are positive and both are still wrong. Sign is a weak check;
              sum and product are exact.
        feedback: >
          Always close with sum against trace and product against determinant —
          it costs nothing and catches most slips.
      - part: When the square root fails
        ask: >
          $C$ has rows $(1, -2)$ and $(1, 3)$: trace $4$, determinant $5$, so
          $\lambda = 2 \pm \sqrt{4 - 5}$. What do you report?
        choices:
          - text: >
              $C$ has no eigenvalues.
            feedback: >
              The quadratic always has two roots over $\mathbb{C}$: here
              $2 \pm i$.
          - text: >
              $\lambda = 2 \pm i$, a complex pair, and no real eigenvector.
            correct: true
            feedback: >
              Their sum is $4$ and their product is $4 + 1 = 5$, so the
              invariants still check. $C$ turns every real direction.
          - text: >
              $\lambda = 2 \pm 1$, taking $\sqrt{|4 - 5|}$.
            feedback: >
              Then $3 \cdot 1 = 3$, not the determinant $5$. Dropping the sign
              under the root breaks the product check.
        feedback: >
          The discriminant $(\operatorname{tr} A/2)^{2} - \det A$ sorts the
          cases: positive gives two real eigenvalues, zero a repeated one,
          negative a complex pair.
  - node: quant-tools.linear-algebra.inner-product
    hook: >
      "Correlation is just a cosine" is one of the highest-leverage
      one-liners in the toolkit, and it only clicks once $\cos\theta$ and
      Cauchy–Schwarz are seen as the same dot-product machinery.
    explanation: >
      The dot product packages length, angle, and perpendicularity into one
      bilinear number. Length is self-similarity, $x^{T}x$; orthogonality is
      the special case where the "overlap" $x^{T}y$ vanishes, which is why
      the Pythagorean identity is pure algebra: expand $\lVert x+y\rVert^{2}
      = (x+y)^{T}(x+y) = x^{T}x + 2x^{T}y + y^{T}y$ and the cross term drops
      exactly when $x^{T}y=0$.

      Cauchy–Schwarz is what makes $x^{T}y/(\lVert x\rVert\lVert y\rVert)$ a
      legitimate cosine — without that bound nothing guarantees the ratio
      stays in $[-1,1]$. Centring each vector before taking this cosine is
      exactly the definition of a correlation coefficient, so every fact you
      know about correlation being bounded by $\pm1$ is a corollary of
      Cauchy–Schwarz, not a separate result.

      The identity $x^{T}(Ay)=(A^{T}x)^{T}y$ is worth memorizing on its own:
      it's the move that lets a matrix hop across a dot product from one
      side to the other, and it is exactly the trick the normal equations
      use later.
    worked: >
      Let $x=(3,4,0)$ and $y=(1,0,2)$. Then $x^{T}y=3$, $\lVert x\rVert=5$,
      $\lVert y\rVert=\sqrt5$, so $\cos\theta = 3/(5\sqrt5) \approx 0.268$.
      For orthogonality, take $z=(4,-3,0)$: $x^{T}z=12-12=0$, so $x,z$ are
      orthogonal, and indeed $\lVert x+z\rVert^{2}=7^{2}+1^{2}=50$ equals
      $\lVert x\rVert^{2}+\lVert z\rVert^{2}=25+25=50$.
    interview: >
      "How would you compute the angle between two vectors" and "how is
      correlation related to cosine similarity" are the standard framings —
      the interviewer wants both the formula and the Cauchy–Schwarz bound
      stated together.
    pitfalls: >
      Calling an unnormalized dot product a "cosine" — it isn't bounded in
      $[-1,1]$ without dividing by both norms. Treating a zero dot product
      of raw (uncentred) data as "no correlation" — correlation needs
      centred data first.
    recap: >
      The dot product is the single operation behind length, angle, and
      orthogonality, with Cauchy–Schwarz guaranteeing the resulting cosine —
      and hence any correlation — lands in $[-1,1]$.
    dialogue:
      - part: How alike are two strategies?
        teach: >
          Two strategies, each day's P&L minus its own average, over four days:
          $x = (1, 2, -1, -2)$ and $y = (2, 1, -2, -1)$. Positive entries are
          better-than-usual days. You want one number for how much they move
          together.
      - ask: >
          Multiply day by day and add: what is $\sum_{i} x_i y_i$?
        expects: "8"
        feedback: >
          $2 + 2 + 2 + 2 = 8$. Every day the two deviations have the same sign,
          so every term is positive.
      - ask: >
          The second desk doubles its position sizes, so its series becomes
          $2y$ and the sum becomes $16$. Did the strategies become more alike?
        choices:
          - text: >
              Yes: the agreement score doubled.
            feedback: >
              The pattern of good and bad days is untouched — only the scale
              changed. A score that moves when nothing about the co-movement
              did is measuring size.
          - text: >
              No: the sum grew only because $y$ got longer.
            correct: true
            feedback: >
              The sum scales with the size of each series. To compare
              co-movement you need to take the sizes out.
          - text: >
              No: they became less alike, since their sizes now differ.
            feedback: >
              Differing sizes do not make two series disagree; $2y$ has the
              same good and bad days as $y$.
        feedback: >
          The raw sum mixes two things: how big each series is, and how aligned
          they are.
      - reflect: >
          What should you divide $\sum_{i} x_i y_i$ by so that rescaling either
          series leaves the answer unchanged — and what is the largest value the
          result could then take?
        hint: >
          Try it with $y = x$.
        answer: >
          Divide by the length of each, $\sqrt{\sum_{i} x_i^{2}}$ times
          $\sqrt{\sum_{i} y_i^{2}}$: doubling $y$ doubles both numerator and
          denominator. With $y = x$ the ratio is exactly $1$, and Cauchy–Schwarz
          says it can never exceed $1$ in size. So the ratio lives in $[-1, 1]$
          and behaves like the cosine of an angle between the two series.
      - part: Length, angle, perpendicular
        teach: >
          The dot product is $x^{T}y = \sum_{i} x_i y_i$, the norm is
          $\lVert x \rVert = \sqrt{x^{T}x}$, and Cauchy–Schwarz,
          $|x^{T}y| \le \lVert x \rVert \lVert y \rVert$, makes
          $\cos\theta = x^{T}y/(\lVert x \rVert \lVert y \rVert)$ a genuine
          cosine. For centred series like these it is the correlation
          coefficient. $x$ and $y$ are orthogonal when $x^{T}y = 0$.
      - ask: >
          What is $\cos\theta$ for $x$ and $y$?
        expects: "0.8"
        feedback: >
          $\lVert x \rVert^{2} = 1 + 4 + 1 + 4 = 10$ and
          $\lVert y \rVert^{2} = 10$, so
          $\cos\theta = 8/(\sqrt{10}\sqrt{10}) = 0.8$. The two strategies are
          correlated $0.8$, whatever their position sizes.
      - ask: >
          A third strategy has $z = (2, -1, -2, 1)$. What is $x^{T}z$?
        expects: "0"
        feedback: >
          $2 - 2 + 2 - 2 = 0$. $x$ and $z$ are orthogonal: as centred series,
          uncorrelated.
      - ask: >
          Run $x$ and $z$ together. What is $\lVert x + z \rVert^{2}$?
        expects: "20"
        hint: >
          $x + z = (3, 1, -3, -1)$.
        feedback: >
          $9 + 1 + 9 + 1 = 20 = 10 + 10$. In general
          $\lVert x + z \rVert^{2} = \lVert x \rVert^{2} + 2x^{T}z +
          \lVert z \rVert^{2}$, and orthogonality kills the middle term:
          Pythagoras. For uncorrelated books, squared sizes add.
      - part: Two ways to misuse it
        ask: >
          Raw daily returns, not centred: $u = (3, 1, 0, 0)$ and
          $w = (0, 0, 2, 4)$. Here $u^{T}w = 0$. Are they uncorrelated?
        choices:
          - text: >
              Yes: zero dot product means orthogonal, means uncorrelated.
            feedback: >
              Only after centring. Subtract the means $1$ and $1.5$:
              $(2, 0, -1, -1)$ and $(-1.5, -1.5, 0.5, 2.5)$ have dot product
              $-3 + 0 - 0.5 - 2.5 = -6$. They are negatively correlated.
          - text: >
              No: correlation is the cosine of the *centred* series, which here
              is negative.
            correct: true
            feedback: >
              Centred, $u$ is $(2, 0, -1, -1)$ and $w$ is
              $(-1.5, -1.5, 0.5, 2.5)$, with dot product $-6$. One does well
              exactly when the other does badly.
          - text: >
              Cannot say: the cosine needs the series to have equal length.
            feedback: >
              Dividing by both norms handles unequal lengths. The missing step
              is centring, not rescaling.
        feedback: >
          Orthogonal raw vectors and uncorrelated series are different claims.
          Centre first, then take the cosine.
      - ask: >
          $A$ has rows $(1, 2)$ and $(0, 3)$, $x = (1, 1)$, $y = (2, -1)$, and
          $x^{T}(Ay) = -3$. To move $A$ off $y$ and onto $x$, which vector do
          you dot with $y$?
        choices:
          - text: >
              $Ax$
            feedback: >
              $Ax = (3, 3)$, and $(3, 3) \cdot (2, -1) = 3$, not $-3$. Moving a
              matrix across a dot product needs its transpose.
          - text: >
              $A^{-1}x$
            feedback: >
              The inverse undoes $A$; it does not carry it across. The identity
              holds for every matrix, invertible or not, and uses $A^{T}$.
          - text: >
              $A^{T}x$
            correct: true
            feedback: >
              $A^{T}x = (1, 5)$, and $(1, 5) \cdot (2, -1) = -3$. In general
              $x^{T}(Ay) = (A^{T}x)^{T}y$, because $(A^{T}x)^{T} = x^{T}A$.
        feedback: >
          This identity is how every projection argument later in the unit
          moves a matrix from one side of a dot product to the other.
  - node: quant-tools.linear-algebra.orthogonal-matrix
    hook: >
      "$Q^{-1}=Q^{T}$" is the cheapest inverse you'll ever get to use —
      spotting that a matrix qualifies turns an inversion problem into a
      transpose.
    explanation: >
      An orthogonal matrix is the matrix form of "change coordinates
      without distorting lengths or angles": its columns are unit vectors,
      pairwise orthogonal, so applying $Q$ sends the standard basis to
      another orthonormal basis rigidly, which is why $\lVert Qx\rVert =
      \lVert x\rVert$ for every $x$.

      The inverse formula needs no elimination or cofactors at all — it
      follows directly from the defining equation $Q^{T}Q=I$, which already
      says $Q^{T}$ undoes $Q$.

      Determinant $\pm1$ separates rotations from reflections: both preserve
      length, but a reflection flips orientation. Since length preservation
      applied to an eigenvector forces $|\lambda|=1$ for every eigenvalue of
      $Q$, a rotation's eigenvalues can be complex (modulus $1$, not real),
      while a reflection always has a real eigenvalue of $-1$.
    worked: >
      Let $Q$ have columns $(0.6,0.8)$ and $(-0.8,0.6)$. Checking
      $Q^{T}Q$: each column has squared length $0.36+0.64=1$, and the two
      columns' dot product is $0.6(-0.8)+0.8(0.6)=0$, so $Q^{T}Q=I$. Also
      $\det Q = 0.36-(-0.64)=1$, so $Q$ is a rotation, and $Q^{-1}=Q^{T}$
      has rows $(0.6,0.8)$ and $(-0.8,0.6)$ with no further computation.
    interview: >
      "Is this matrix orthogonal, and what's its inverse" is answered by
      checking $Q^{T}Q=I$ and then writing down the transpose — no
      elimination. A follow-up often asks rotation-versus-reflection from
      the determinant's sign.
    pitfalls: >
      Assuming unit-length columns alone make a matrix orthogonal — they
      must also be pairwise orthogonal. Computing $Q^{-1}$ by elimination or
      cofactors instead of noticing $Q^{T}Q=I$ first. Forgetting that a
      product of orthogonal matrices is again orthogonal, so composing two
      rotations never needs a fresh invertibility check.
    recap: >
      Orthogonal matrices are rigid rotations or reflections with
      orthonormal columns, so their inverse is free: just transpose.
    dialogue:
      - part: Three maps that should not change risk
        teach: >
          A desk wants to re-express two-factor exposures in new coordinates
          without changing any portfolio's length. Three proposals: $R$ with
          columns $(5/13, 12/13)$ and $(-12/13, 5/13)$; $S$ with columns
          $(1, 0)$ and $(0.6, 0.8)$; and $T = 2I$.
      - ask: >
          Take $x = (13, 13)$, with $\lVert x \rVert^{2} = 338$. What is
          $\lVert Rx \rVert^{2}$?
        expects: "338"
        hint: >
          $Rx = 13 \cdot (5/13, 12/13) + 13 \cdot (-12/13, 5/13)$.
        feedback: >
          $Rx = (5 - 12, 12 + 5) = (-7, 17)$, and $49 + 289 = 338$. Length
          survives.
      - ask: >
          Take $x = (-1, 1)$, with $\lVert x \rVert^{2} = 2$. What is
          $\lVert Sx \rVert^{2}$?
        expects: "0.8"
        feedback: >
          $Sx = -(1, 0) + (0.6, 0.8) = (-0.4, 0.8)$, and
          $0.16 + 0.64 = 0.8$. Length shrank, though both columns of $S$ have
          length $1$.
      - ask: >
          Which proposal preserves the length of every vector?
        choices:
          - text: >
              $S$: its columns both have length $1$.
            feedback: >
              You just watched $S$ shrink $(-1, 1)$ from squared length $2$ to
              $0.8$. Unit columns are not enough.
          - text: >
              $T$: it treats every direction alike.
            feedback: >
              It treats them alike by doubling every one of them. Preserving
              angles is not preserving lengths.
          - text: >
              $R$
            correct: true
            feedback: >
              Its columns have length $1$, since $25 + 144 = 169$, and they are
              perpendicular, since $-60 + 60 = 0$.
        feedback: >
          $R$ passes and $S$ and $T$ each fail, for different reasons.
      - reflect: >
          $S$ and $T$ fail one test each. State the two tests on the columns,
          and say why they are exactly what the entries of $Q^{T}Q$ record.
        answer: >
          Every column has length $1$ — $T$'s have length $2$ — and every two
          different columns are perpendicular — $S$'s have dot product $0.6$.
          The $(i, j)$ entry of $Q^{T}Q$ is column $i$ dotted with column $j$,
          so the two tests together say $Q^{T}Q = I$: ones on the diagonal,
          zeros off it.
      - part: Orthonormal columns, and what they buy
        teach: >
          A square $Q$ is orthogonal when $Q^{T}Q = QQ^{T} = I$: its columns
          are an orthonormal basis. Then $Q^{-1} = Q^{T}$, and
          $(Qx)^{T}(Qy) = x^{T}Q^{T}Qy = x^{T}y$, so lengths and angles are
          preserved. Since $\det(Q)^{2} = \det(Q^{T}Q) = 1$, $\det Q = \pm 1$:
          rotations and reflections. Gram–Schmidt turns any independent set
          into an orthonormal one, giving $A = QR$.
      - ask: >
          What is the $(1, 2)$ entry of $R^{-1}$?
        expects: "12/13"
        hint: >
          No elimination needed.
        feedback: >
          $R^{-1} = R^{T}$, whose first row is $R$'s first column,
          $(5/13, 12/13)$. The cofactor formula agrees, since $\det R =
          25/169 + 144/169 = 1$.
      - ask: >
          $P$ swaps the two coordinates: rows $(0, 1)$ and $(1, 0)$. What is it?
        choices:
          - text: >
              Orthogonal, with $\det P = -1$: a reflection, across the line
              $x_1 = x_2$.
            correct: true
            feedback: >
              Its columns $(0, 1)$ and $(1, 0)$ are orthonormal, and
              $0 \cdot 0 - 1 \cdot 1 = -1$. It preserves lengths and flips
              orientation.
          - text: >
              Orthogonal, with $\det P = 1$: a rotation by $90$ degrees.
            feedback: >
              A quarter turn sends $(1, 0)$ to $(0, 1)$ and $(0, 1)$ to
              $(-1, 0)$. $P$ sends $(0, 1)$ to $(1, 0)$ with no minus sign, and
              its determinant is $-1$.
          - text: >
              Not orthogonal: it moves every vector off its line.
            feedback: >
              Orthogonal maps are allowed to move vectors; they must only keep
              lengths and angles. $P$ does, as $P^{T}P = I$ shows.
        feedback: >
          The sign of $\det Q$ is the whole difference between a rotation and a
          reflection.
      - part: The cheapest inverse in linear algebra
        ask: >
          $U$ has columns $(2/3, 1/3, 2/3)$, $(1/3, 2/3, -2/3)$ and
          $(2/3, -2/3, -1/3)$, which are orthonormal. What is the $(1, 2)$ entry
          of $U^{-1}$?
        expects: "1/3"
        hint: >
          Row $1$ of $U^{-1}$ is column $1$ of $U$.
        feedback: >
          $U^{-1} = U^{T}$, and row $1$ of $U^{T}$ is $(2/3, 1/3, 2/3)$, so the
          entry is $1/3$. A $3 \times 3$ inverse with no arithmetic beyond
          checking three lengths and three dot products.
      - ask: >
          $Q_1$ and $Q_2$ are orthogonal $n \times n$ matrices. Which is
          guaranteed to be orthogonal?
        choices:
          - text: >
              $Q_1 + Q_2$
            feedback: >
              Take $Q_1 = Q_2 = I$: the sum is $2I$, which doubles lengths.
          - text: >
              $Q_1 Q_2$
            correct: true
            feedback: >
              $(Q_1Q_2)^{T}Q_1Q_2 = Q_2^{T}Q_1^{T}Q_1Q_2 = Q_2^{T}Q_2 = I$. Two
              length-preserving maps in a row preserve length.
          - text: >
              $2Q_1$
            feedback: >
              Scaling doubles every length, so $(2Q_1)^{T}(2Q_1) = 4I$.
        feedback: >
          Orthogonal matrices are closed under products and inverses, not
          under sums or scaling — composing rigid motions gives a rigid motion.
  - node: quant-tools.linear-algebra.spectral
    hook: >
      "Why is a covariance matrix always diagonalizable with real
      eigenvalues" has exactly one answer, and it's this theorem — every
      symmetric matrix decomposes into perpendicular stretch directions, no
      exceptions.
    explanation: >
      Unlike a general matrix, a symmetric one is guaranteed real
      eigenvalues and a full orthonormal set of eigenvectors — no complex
      eigenvalues to worry about, no eigenvector deficiency like the
      non-diagonalizable matrix with rows $(1,1)$ and $(0,1)$ exhibits.

      The orthogonality argument is short and worth re-deriving on the spot:
      if $Av=\lambda v$ and $Aw=\mu w$, compute $v^{T}Aw$ two ways using the
      matrix-across-a-dot-product identity — $\lambda\,v^{T}w = (Av)^{T}w =
      v^{T}A^{T}w = v^{T}Aw = v^{T}(\mu w) = \mu\,v^{T}w$ — which forces
      $v^{T}w=0$ whenever $\lambda\ne\mu$. Symmetry, $A=A^{T}$, is exactly
      what makes the middle step $(Av)^{T}w=v^{T}Aw$ valid.

      Reading $A=\sum_i\lambda_iq_iq_i^{T}$: each term is a rank-one
      projector onto one eigendirection, so a symmetric matrix is a weighted
      sum of independent stretches along perpendicular axes — exactly why
      a covariance matrix, symmetric by construction, always decomposes
      into uncorrelated directions.
    worked: >
      For symmetric $A$ with rows $(5,3)$ and $(3,5)$: $\operatorname{tr}A=
      10$, $\det A=16$, so $\lambda=5\pm3=8,2$. For $\lambda=8$: $A-8I$ has
      rows $(-3,3)$ and $(3,-3)$, giving $q_1=(1,1)/\sqrt2$. For $\lambda=2$:
      $A-2I$ has rows $(3,3)$ and $(3,3)$, giving $q_2=(1,-1)/\sqrt2$. Indeed
      $q_1\cdot q_2=0$, and $A = 8\,q_1q_1^{T} + 2\,q_2q_2^{T}$.
    interview: >
      "Why must a symmetric matrix have real eigenvalues" and "why are a
      covariance matrix's eigenvectors orthogonal" are both this theorem —
      answer with the $v^{T}Aw$-two-ways argument, not a citation.
    pitfalls: >
      Assuming any diagonalizable matrix has orthogonal eigenvectors — that
      is special to symmetric matrices. Forgetting the eigenvectors must be
      normalized to unit length for $A=Q\Lambda Q^{T}$ to hold with $Q$
      truly orthogonal.
    recap: >
      Symmetry alone guarantees real eigenvalues and an orthonormal
      eigenbasis, so $A=Q\Lambda Q^{T}$ — independent stretches along
      perpendicular axes.
    dialogue:
      - part: A symmetric matrix, taken apart
        teach: >
          $A$ is symmetric, with rows $(2, 3)$ and $(3, 10)$ — the shape of a
          two-asset covariance matrix. Its characteristic polynomial is
          $(2 - \lambda)(10 - \lambda) - 9$.
      - ask: >
          What is the larger eigenvalue of $A$?
        expects: "11"
        hint: >
          Expand to $\lambda^{2} - 12\lambda + 11$ and factor.
        feedback: >
          $\lambda^{2} - 12\lambda + 11 = (\lambda - 11)(\lambda - 1)$, so the
          eigenvalues are $11$ and $1$.
      - ask: >
          An eigenvector for $\lambda = 11$ has first coordinate $1$. What is its
          second?
        expects: "3"
        feedback: >
          $A - 11I$ has first row $(-9, 3)$, so $-9 + 3y = 0$ and $y = 3$. Check:
          $A(1, 3) = (2 + 9, 3 + 30) = (11, 33)$.
      - ask: >
          An eigenvector for $\lambda = 1$ has first coordinate $3$. What is its
          second?
        expects: "-1"
        feedback: >
          $A - I$ has first row $(1, 3)$, so $3 + 3y = 0$ and $y = -1$. Check:
          $A(3, -1) = (6 - 3, 9 - 10) = (3, -1)$.
      - ask: >
          $(1, 3) \cdot (3, -1) = 0$: the two eigendirections are perpendicular.
          Is that luck?
        choices:
          - text: >
              Luck: eigenvectors of a matrix can meet at any angle.
            feedback: >
              For a general matrix, yes — but run any symmetric matrix with two
              distinct eigenvalues and the right angle comes back every time.
              Something about $A = A^{T}$ forces it.
          - text: >
              Not luck: eigenvectors for distinct eigenvalues are always
              perpendicular.
            feedback: >
              The matrix with rows $(2, 1)$ and $(0, 3)$ has eigenvectors
              $(1, 0)$ and $(1, 1)$, whose dot product is $1$. Distinct
              eigenvalues give independence, not perpendicularity.
          - text: >
              Not luck: it is forced by $A$ being symmetric.
            correct: true
            feedback: >
              Right — and the reason fits on one line, which is worth finding
              yourself.
        feedback: >
          The claim to explain: for symmetric $A$, eigenvectors of different
          eigenvalues are orthogonal.
      - reflect: >
          Let $Av = \lambda v$ and $Aw = \mu w$ with $\lambda \ne \mu$ and
          $A = A^{T}$. Compute the single number $v^{T}Aw$ in two ways, and
          conclude.
        hint: >
          Group it as $(v^{T}A)w$ or as $v^{T}(Aw)$. What is $v^{T}A$ when
          $A^{T} = A$?
        answer: >
          $v^{T}(Aw) = \mu\, v^{T}w$. And $v^{T}A = (A^{T}v)^{T} = (Av)^{T} =
          \lambda v^{T}$, so the same number is $\lambda\, v^{T}w$. Then
          $(\lambda - \mu)v^{T}w = 0$, and since $\lambda \ne \mu$,
          $v^{T}w = 0$. Symmetry is used exactly once: to move $A$ across the
          dot product without changing it.
      - part: The spectral theorem
        teach: >
          For real symmetric $A$, every eigenvalue is real and $\mathbb{R}^{n}$
          has an orthonormal basis of eigenvectors: $A = Q\Lambda Q^{T}$ with $Q$
          orthogonal and $\Lambda$ diagonal, equivalently
          $A = \sum_{i} \lambda_i q_i q_i^{T}$. Geometrically, $A$ is a pure
          stretch along perpendicular axes — here by $11$ along $(1, 3)$ and by
          $1$ along $(3, -1)$.
      - ask: >
          Use the axes. $x = (4, 2)$ is $(1, 3) + (3, -1)$. What is the second
          coordinate of $Ax$?
        expects: "32"
        hint: >
          Stretch each piece by its own eigenvalue, then add.
        feedback: >
          $Ax = 11(1, 3) + 1(3, -1) = (14, 32)$. Directly:
          $A(4, 2) = (8 + 6, 12 + 20) = (14, 32)$. And the pieces were found by
          dot products, $x \cdot (1, 3)/10 = 1$ and $x \cdot (3, -1)/10 = 1$,
          which works only because the axes are perpendicular.
      - ask: >
          Can a real symmetric $2 \times 2$ matrix, rows $(a, b)$ and $(b, d)$,
          have complex eigenvalues?
        choices:
          - text: >
              Yes, when $b$ is large compared with $a$ and $d$.
            feedback: >
              The discriminant is $(a + d)^{2} - 4(ad - b^{2}) = (a - d)^{2} +
              4b^{2}$, and a large $b$ only makes it more positive.
          - text: >
              No: the discriminant is $(a - d)^{2} + 4b^{2} \ge 0$.
            correct: true
            feedback: >
              A sum of squares cannot be negative, so both roots are real. The
              $2 \times 2$ case of "every eigenvalue is real".
          - text: >
              Only if $\det A < 0$.
            feedback: >
              A negative determinant gives two real eigenvalues of opposite
              sign. It never produces complex ones for a symmetric matrix.
        feedback: >
          Symmetric matrices cannot rotate, so they have no complex
          eigenvalues — the turning that produced $1 \pm i$ for a $45$-degree
          map is impossible here.
      - part: Breaking the hypotheses
        ask: >
          A candidate stacks the unnormalized eigenvectors $(1, 3)$ and
          $(3, -1)$ as the columns of $Q$ and forms $Q\Lambda Q^{T}$ with
          $\Lambda$ diagonal $(11, 1)$. What is the $(1, 1)$ entry?
        expects: "20"
        hint: >
          The $(1, 1)$ entry is $11 \cdot 1^{2} + 1 \cdot 3^{2}$.
        feedback: >
          $11 + 9 = 20$, ten times the true entry $2$. Each column has squared
          length $10$, so $Q^{T}Q = 10I$, not $I$. Divide each eigenvector by
          $\sqrt{10}$ and the decomposition is exact.
      - ask: >
          $B$ has rows $(2, 1)$ and $(0, 3)$, with distinct eigenvalues $2$ and
          $3$. What does it have?
        choices:
          - text: >
              An orthonormal basis of eigenvectors, since its eigenvalues are
              distinct.
            feedback: >
              Its eigenvectors are along $(1, 0)$ and $(1, 1)$, which meet at
              $45$ degrees. Normalizing cannot make them perpendicular.
          - text: >
              A basis of eigenvectors, but no orthonormal one.
            correct: true
            feedback: >
              Distinct eigenvalues give two independent eigenvectors, so
              $B = PDP^{-1}$ — with $P$ not orthogonal. Only symmetry delivers
              $P^{-1} = P^{T}$.
          - text: >
              No eigenvectors at all, since it is not symmetric.
            feedback: >
              $B(1, 0) = (2, 0)$. Eigenvectors exist; perpendicular ones are
              what symmetry adds.
        feedback: >
          Drop symmetry and you may keep a basis of eigenvectors or lose it — the
          shear with rows $(1, 1)$ and $(0, 1)$ has only one eigendirection —
          but you always lose the right angles. Covariance matrices and
          Hessians are symmetric, which is why this theorem carries so much of
          the subject.
  - node: quant-tools.linear-algebra.quadratic-form
    hook: >
      Any time a problem asks you to maximize or classify a "portfolio
      variance" formula or a Hessian, it's secretly asking about the sign
      behaviour of a quadratic form — the algebra underneath is always
      $x^{T}Ax$.
    explanation: >
      Only the symmetric part of $A$ survives in $q(x)=x^{T}Ax$ because the
      $(i,j)$ and $(j,i)$ terms of the double sum pair up into
      $(a_{ij}+a_{ji})x_ix_j$ — only the sum matters, so any antisymmetric
      part of $A$ is invisible to $q$ and can always be discarded by
      symmetrizing first.

      Reading the formula straight off a symmetric matrix: diagonal entries
      are the pure-square coefficients, and off-diagonal entries get
      doubled, since both $(i,j)$ and $(j,i)$ contribute the same cross
      term. This is the fact to have automatic when translating between "a
      matrix" and "a formula" in either direction.

      Because $q$ is degree-two homogeneous, $q(cx)=c^{2}q(x)$ never flips
      sign as $c$ varies, so the sign behaviour of $q$ on the whole space is
      already decided by its sign on the unit sphere — "always nonnegative,"
      "always nonpositive," and "changes sign" (a saddle) are the only three
      possibilities.
    worked: >
      For symmetric $A$ with rows $(3,1)$ and $(1,3)$: $q(x) = 3x_1^{2} +
      2x_1x_2 + 3x_2^{2}$ (the off-diagonal $1$ doubles to $2$). At
      $x=(2,1)$: $q(2,1) = 3\cdot4 + 2\cdot2\cdot1 + 3\cdot1 = 12+4+3=19$.
    interview: >
      "Write out $x^{T}Ax$ for this matrix" and its reverse, "write down the
      matrix behind this quadratic expression," both get asked — the doubled
      off-diagonal entry is exactly where people slip in either direction.
    pitfalls: >
      Forgetting to double the off-diagonal entry going from matrix to
      formula (or halve it going the other way). Using a non-symmetric $A$
      and being confused that two different matrices give the same $q(x)$ —
      always symmetrize first.
    recap: >
      $x^{T}Ax$ only sees the symmetric part of $A$, with off-diagonal
      entries doubled into the cross terms, and its sign is fixed by its
      behaviour on the unit sphere.
    dialogue:
      - part: A risk score with only positive coefficients
        teach: >
          A desk scores a position of $x_1$ units of one asset and $x_2$ of
          another by $q(x) = x_1^{2} + 6x_1x_2 + x_2^{2}$. All three
          coefficients are positive.
      - ask: >
          What is $q(1, 2)$?
        expects: "17"
        feedback: >
          $1 + 6 \cdot 2 + 4 = 17$.
      - ask: >
          Double the position. What is $q(2, 4)$?
        expects: "68"
        feedback: >
          $4 + 48 + 16 = 68 = 4 \cdot 17$. Every term has degree two, so
          $q(cx) = c^{2}q(x)$: double the position, quadruple the score.
      - ask: >
          Can the score ever be negative?
        choices:
          - text: >
              No: every coefficient is positive.
            feedback: >
              Try $(1, -1)$: $1 - 6 + 1 = -4$. The cross term takes the sign of
              $x_1x_2$, and a short-long position makes it negative.
          - text: >
              No: $x_1^{2}$ and $x_2^{2}$ are never negative.
            feedback: >
              The squares are not, but $6x_1x_2$ is when the signs differ, and
              it can outweigh them: $q(1, -1) = -4$.
          - text: >
              Yes: at $(1, -1)$ it is $-4$.
            correct: true
            feedback: >
              The squares contribute $2$ and the cross term $-6$. Positive
              coefficients do not make a positive score.
        feedback: >
          Long one asset and short the other, and this "risk" goes negative —
          a sign the score is not a sensible risk measure. Its sign behaviour
          is the thing to understand.
      - part: Which matrix is it?
        ask: >
          You want a symmetric $A$ with $q(x) = x^{T}Ax$. Which one?
        choices:
          - text: >
              Rows $(1, 6)$ and $(6, 1)$
            feedback: >
              $x^{T}Ax$ picks up $a_{12}x_1x_2 + a_{21}x_2x_1 = 12x_1x_2$, twice
              the cross term you want.
          - text: >
              Rows $(1, 3)$ and $(3, 1)$
            correct: true
            feedback: >
              The two off-diagonal $3$s contribute $3x_1x_2 + 3x_2x_1 =
              6x_1x_2$. Split the cross coefficient evenly across the two
              entries.
          - text: >
              Rows $(1, 6)$ and $(0, 1)$
            feedback: >
              That does give $q$ — but it is not symmetric. Rows $(1, 0)$ and
              $(6, 1)$ would give $q$ too, so asking for the matrix of $q$ has
              no single answer until you require symmetry.
        feedback: >
          Off-diagonal entries enter twice. Coefficient of $x_1x_2$ equals
          $a_{12} + a_{21}$.
      - reflect: >
          Rows $(1, 6), (0, 1)$, rows $(1, 0), (6, 1)$ and rows $(1, 3), (3, 1)$
          all produce the same $q$. What part of $A$ does $x^{T}Ax$ actually
          see, and why is it always safe to replace $A$ by a symmetric matrix?
        answer: >
          For each pair $i \ne j$ it sees only the sum $a_{ij} + a_{ji}$, along
          with the diagonal. Replacing $A$ by $\tfrac{1}{2}(A + A^{T})$ keeps
          every such sum and the diagonal, so it keeps $q$. Of all the matrices
          giving $q$, exactly one is symmetric, which makes it the canonical
          choice — and the one the later theorems are about.
      - part: The form, named and computed
        teach: >
          A quadratic form is $q(x) = x^{T}Ax = \sum_{i,j} a_{ij}x_ix_j$,
          homogeneous of degree two. Only the symmetric part of $A$ matters, so
          take $A$ symmetric; then the coefficient of $x_ix_j$ for $i \ne j$ is
          $2a_{ij}$, and the gradient of $q$ is $2Ax$. Forms are sorted by sign:
          positive at every $x \ne 0$, negative at every $x \ne 0$, or
          indefinite, like the risk score.
      - ask: >
          $B$ is symmetric with rows $(2, -1)$ and $(-1, 5)$. What is
          $x^{T}Bx$ at $x = (1, 3)$?
        expects: "41"
        hint: >
          The form is $2x_1^{2} - 2x_1x_2 + 5x_2^{2}$.
        feedback: >
          $2 \cdot 1 - 2 \cdot 3 + 5 \cdot 9 = 2 - 6 + 45 = 41$. The $-1$ off
          the diagonal becomes $-2x_1x_2$.
      - ask: >
          What is the first component of the gradient of $x^{T}Bx$ at
          $x = (1, 3)$?
        expects: "-2"
        hint: >
          Either differentiate $2x_1^{2} - 2x_1x_2 + 5x_2^{2}$ in $x_1$, or
          compute $2Bx$.
        feedback: >
          $\partial q/\partial x_1 = 4x_1 - 2x_2 = 4 - 6 = -2$. And
          $2Bx = 2(2 - 3, -1 + 15) = (-2, 28)$: the same first component. With a
          non-symmetric matrix the gradient would be $(A + A^{T})x$ instead.
      - ask: >
          Which class is $x^{T}Bx = 2x_1^{2} - 2x_1x_2 + 5x_2^{2}$ in?
        choices:
          - text: >
              Indefinite: the cross term is negative.
            feedback: >
              A negative coefficient is no more decisive than positive ones
              were. Completing the square,
              $2(x_1 - x_2/2)^{2} + 4.5x_2^{2}$, never goes below $0$.
          - text: >
              Positive at every $x \ne 0$.
            correct: true
            feedback: >
              $2(x_1 - x_2/2)^{2} + 4.5x_2^{2}$ is $0$ only if $x_2 = 0$ and then
              $x_1 = 0$. A weak cross term cannot overcome strong squares.
          - text: >
              Cannot tell without trying every $x$.
            feedback: >
              Completing the square settles it for all $x$ at once:
              $2(x_1 - x_2/2)^{2} + 4.5x_2^{2}$.
        feedback: >
          Whether the cross term can win against the squares is the whole
          question. The risk score's cross term won; this one's loses.
      - ask: >
          Last: $p(x) = x_1^{2} - 4x_1x_2 + 4x_2^{2}$. Is it positive at every
          $x \ne 0$?
        choices:
          - text: >
              Yes: it is a perfect square.
            feedback: >
              It is $(x_1 - 2x_2)^{2}$, which is $0$ at $(2, 1)$. Never negative
              is weaker than always positive.
          - text: >
              No: it is negative at $(1, 1)$.
            feedback: >
              $p(1, 1) = 1 - 4 + 4 = 1$. It is never negative, being
              $(x_1 - 2x_2)^{2}$.
          - text: >
              No: it is $0$ at $(2, 1)$, though never negative.
            correct: true
            feedback: >
              $(2 - 2)^{2} = 0$ at a nonzero point. It sits on the boundary
              between "positive" and "indefinite".
        feedback: >
          One clause fails: positive *off the origin*. Forms that are never
          negative but can vanish away from $0$ are the semidefinite case, and
          they are exactly the kind a portfolio's variance turns out to be.
  - node: quant-tools.linear-algebra.psd
    hook: >
      "Is this matrix positive semidefinite" is really always one of two
      questions in disguise — "is this a valid covariance matrix" or "is
      this a local minimum" — and the eigenvalue test settles both in one
      line.
    explanation: >
      PSD is the matrix generalization of "nonnegative number," and the
      spectral theorem is exactly what makes the eigenvalue test valid:
      writing $x=Qy$ turns $x^{T}Ax$ into $\sum_i\lambda_iy_i^{2}$, a plain
      sum of squares weighted by eigenvalues, so it stays $\ge0$ for every
      $x$ exactly when every $\lambda_i\ge0$.

      The factorization $A=B^{T}B$ is the other standard certificate, and it
      needs no eigenvalues: $x^{T}Ax=x^{T}B^{T}Bx=\lVert Bx\rVert^{2}\ge0$
      automatically. This is the form a covariance matrix naturally arrives
      in, since it comes from a variance.

      Sylvester's criterion is a shortcut but a fragile one: it certifies
      positive definite (not merely semidefinite) via all leading principal
      minors being strictly positive. The semidefinite boundary needs every
      principal minor
      checked, not only the nested leading ones, because a single bad
      off-diagonal block can hide from the leading corners alone.
    worked: >
      Test $A$ with rows $(2,-1)$ and $(-1,2)$: leading minors $2>0$ and
      $\det A=4-1=3>0$, so $A$ is PD by Sylvester. Confirming via
      eigenvalues: $\operatorname{tr}A=4$, $\det A=3$, so
      $\lambda=2\pm\sqrt{4-3}=2\pm1=3,1$, both positive — consistent.
    interview: >
      "Is this covariance matrix valid" or "is this the Hessian at a
      minimum" are both PSD/PD checks. For a small matrix the fast answer is
      Sylvester's leading minors, with the caveat that it only proves the
      strict, definite case.
    pitfalls: >
      Using leading-minor positivity (even $\ge0$) to certify PSD — it
      doesn't; a valid counterexample has rows $(0,0)$ and $(0,-1)$.
      Concluding PD just because the diagonal entries are all positive, which
      says nothing about the off-diagonal.
    recap: >
      PSD means every eigenvalue is nonnegative, equivalently $A=B^{T}B$ for
      some $B$, and Sylvester's leading-minor test certifies only the
      strict, positive-definite case.
    dialogue:
      - part: Three matrices with positive diagonals
        teach: >
          Three symmetric matrices, every diagonal entry positive. $A$ has rows
          $(2, 2)$ and $(2, 5)$. $B$ has rows $(1, 2)$ and $(2, 3)$. $C$ has rows
          $(4, 2)$ and $(2, 1)$. For each, ask whether $x^{T}Mx$ can ever go
          below zero.
      - ask: >
          What is $x^{T}Bx$ at $x = (2, -1)$?
        expects: "-1"
        hint: >
          The form is $x_1^{2} + 4x_1x_2 + 3x_2^{2}$.
        feedback: >
          $4 - 8 + 3 = -1$. Positive diagonal entries, negative form.
      - ask: >
          What is $x^{T}Cx$ at $x = (1, -2)$?
        expects: "0"
        feedback: >
          The form is $4x_1^{2} + 4x_1x_2 + x_2^{2} = (2x_1 + x_2)^{2}$, and
          $2 - 2 = 0$. Never negative, but zero at a nonzero point.
      - ask: >
          Which of the three forms are never negative?
        choices:
          - text: >
              All three: the diagonals are positive.
            feedback: >
              $x^{T}Bx = -1$ at $(2, -1)$. The diagonal alone ignores how strong
              the off-diagonal coupling is.
          - text: >
              $A$ and $C$
            correct: true
            feedback: >
              $C$ is a perfect square, and $A$'s form
              $2x_1^{2} + 4x_1x_2 + 5x_2^{2} = 2(x_1 + x_2)^{2} + 3x_2^{2}$ is a
              sum of squares that vanishes only at $0$.
          - text: >
              Only $A$: $C$ hits zero.
            feedback: >
              Hitting zero is not going negative. $C$ never drops below $0$;
              it just fails to stay strictly above it.
        feedback: >
          Three behaviours: $A$ stays strictly positive off the origin, $C$ is
          never negative but touches $0$, $B$ goes negative. You tested a few
          points by hand; that does not scale to $n = 50$.
      - reflect: >
          You cannot test every $x$. Each matrix is symmetric, so it equals
          $Q\Lambda Q^{T}$ with orthonormal eigenvectors $q_i$. Write $x$ in
          that basis, $x = \sum_{i} c_iq_i$. What does $x^{T}Mx$ become, and
          what does that say about which matrices are never negative?
        hint: >
          $Mq_i = \lambda_iq_i$, and $q_i^{T}q_j$ is $1$ or $0$.
        answer: >
          $x^{T}Mx = \sum_{i} \lambda_ic_i^{2}$: a weighted sum of the squared
          coordinates, with the eigenvalues as weights. It is never negative for
          every $x$ exactly when no eigenvalue is negative, and positive at
          every $x \ne 0$ exactly when every eigenvalue is positive. A negative
          eigenvalue gives a negative value at its own eigenvector.
      - part: The definition, and the tests that certify it
        teach: >
          A symmetric $A$ is positive semidefinite (PSD) when $x^{T}Ax \ge 0$
          for all $x$, and positive definite (PD) when $x^{T}Ax > 0$ for all
          $x \ne 0$. Equivalent tests: all eigenvalues $\ge 0$ (respectively
          $> 0$), or $A = M^{T}M$ for some $M$ (with independent columns for
          PD). Sylvester's criterion — all $n$ leading principal minors
          positive — certifies PD, and only PD.
      - ask: >
          $C$'s characteristic polynomial is $\lambda^{2} - 5\lambda$. What is
          its nonzero eigenvalue?
        expects: "5"
        feedback: >
          $\lambda(\lambda - 5) = 0$ gives $0$ and $5$. No negative eigenvalue,
          so PSD; a zero eigenvalue, so not PD — with $(1, -2)$ the eigenvector
          for $0$, the very point where the form vanished.
      - ask: >
          For any matrix $M$, why is $M^{T}M$ PSD?
        choices:
          - text: >
              Because its diagonal entries are sums of squares.
            feedback: >
              They are, but positive diagonals did not save $B$. The argument
              has to cover every $x$, not just the coordinate vectors.
          - text: >
              Because $x^{T}M^{T}Mx = \lVert Mx \rVert^{2} \ge 0$.
            correct: true
            feedback: >
              $x^{T}M^{T}Mx = (Mx)^{T}(Mx)$, a squared length. It is $0$ only
              when $Mx = 0$, so independent columns make it PD.
          - text: >
              Because $M^{T}M$ is symmetric.
            feedback: >
              $B$ is symmetric and not PSD. Symmetry is required for the
              definition, never sufficient.
        feedback: >
          Writing a matrix as $M^{T}M$ is a certificate that needs no
          eigenvalues — $C$ is $M^{T}M$ for $M$ the single row $(2, 1)$.
      - part: Sylvester's test, and its trap
        ask: >
          $E$ has rows $(2, 1, 0)$, $(1, 2, 1)$ and $(0, 1, 2)$. Its first two
          leading minors are $2$ and $3$. What is the third, $\det E$?
        expects: "4"
        feedback: >
          Along row $1$: $2(4 - 1) - 1(2 - 0) + 0 = 4$. All three leading minors
          are positive, so $E$ is PD.
      - ask: >
          A candidate certifies $G$, rows $(0, 0)$ and $(0, -5)$, as PSD because
          its leading minors are $0$ and $0$, neither negative. What is wrong?
        choices:
          - text: >
              Nothing: no leading minor is negative.
            feedback: >
              $x = (0, 1)$ gives $x^{T}Gx = -5$. The leading minors never look
              at the lower-right entry on its own.
          - text: >
              Sylvester needs strict positivity, and $0$ is not positive, so $G$
              is negative definite.
            feedback: >
              Failing the PD test does not make a matrix negative definite:
              $x = (1, 0)$ gives $0$, not a negative value.
          - text: >
              The leading-minor test is only valid for PD; for PSD every
              principal minor must be $\ge 0$, and the $1 \times 1$ minor $-5$
              is not.
            correct: true
            feedback: >
              $x^{T}Gx = -5$ at $(0, 1)$. The minor sitting at position
              $(2, 2)$ alone sees it; the leading ones do not.
        feedback: >
          Sylvester's criterion has no "$\ge$" version. For PSD, use the
          eigenvalues, a factorization $M^{T}M$, or all principal minors.
  - node: quant-tools.linear-algebra.rayleigh-quotient
    hook: >
      "What direction maximizes $x^{T}Ax$ subject to $\lVert x\rVert=1$"
      underlies every PCA and portfolio-optimization problem, and the
      Rayleigh quotient answers it with no calculus: the maximum is just the
      top eigenvalue.
    explanation: >
      The proof is worth re-deriving because it's what makes PCA sit on
      ground already built: write $x=\sum_ic_iq_i$ in the orthonormal
      eigenbasis from the spectral theorem. Since the $q_i$ are orthonormal,
      $x^{T}x=\sum_ic_i^{2}$, and $x^{T}Ax=\sum_i\lambda_ic_i^{2}$, so the
      quotient is a weighted average of the eigenvalues with weights
      $c_i^{2}/\sum_jc_j^{2}$.

      A weighted average can never exceed its largest term or fall below
      its smallest, which gives the bound immediately, and equality happens
      exactly when all the weight sits on one eigenvalue — that is, $x$ is a
      multiple of the corresponding eigenvector.

      The optimization reading is the one to keep: maximizing a quadratic
      form on the unit sphere has no free-standing calculus content once you
      know this — it is already solved, and the answer is always "the top
      eigenvalue, at the top eigenvector," the exact first step PCA takes.
    worked: >
      For symmetric $A$ with rows $(3,1)$ and $(1,3)$: $\lambda=3\pm1=4,2$,
      so the quotient ranges over $[2,4]$. At $x=(1,0)$: the quotient is
      $3/1=3$, inside the range. At the $\lambda=4$ eigenvector $(1,1)$
      (from $A-4I$ having rows $(-1,1)$ and $(1,-1)$): $x^{T}Ax=3+2+3=8$,
      $x^{T}x=2$, ratio $4$ — the maximum, attained exactly there.
    interview: >
      "How would you maximize $x^{T}Ax$ over unit vectors without calculus"
      is exactly this fact — say "diagonalize; it's a weighted average of
      eigenvalues, so the max is the top eigenvalue at the top eigenvector"
      cold.
    pitfalls: >
      Forgetting the constraint $\lVert x\rVert=1$ changes everything —
      unconstrained, $x^{T}Ax$ is unbounded above whenever any eigenvalue is
      positive. Assuming the maximizing direction is unique when the top
      eigenvalue is repeated.
    recap: >
      On the unit sphere, $x^{T}Ax$ is a weighted average of eigenvalues of
      $A$, so it never leaves $[\lambda_{\min},\lambda_{\max}]$, hitting
      both ends exactly at the corresponding eigenvectors.
    dialogue:
      - part: The riskiest unit position
        teach: >
          A two-asset book has risk $x^{T}Ax$, with $A$ symmetric with rows
          $(3, 2)$ and $(2, 6)$. Positions are scaled to unit length,
          $\lVert x \rVert = 1$. All in the first asset, $x = (1, 0)$, gives risk
          $3$; all in the second, $x = (0, 1)$, gives $6$.
      - ask: >
          Split evenly, $x = (1, 1)/\sqrt{2}$. What is $x^{T}Ax$?
        expects: "6.5"
        hint: >
          Compute the form at $(1, 1)$ and divide by $2$.
        feedback: >
          At $(1, 1)$ the form is $3 + 2 \cdot 2 + 6 = 13$, and scaling $x$ by
          $1/\sqrt{2}$ scales the form by $1/2$: $6.5$.
      - ask: >
          So what is the maximum risk over unit positions?
        choices:
          - text: >
              $6$, the largest diagonal entry.
            feedback: >
              The even split already reached $6.5$. The positive off-diagonal
              $2$ rewards holding both assets with the same sign.
          - text: >
              $6.5$, at the even split.
            feedback: >
              Nothing says the even split is best. Tilt toward the riskier
              asset: $(1, 2)/\sqrt{5}$ gives $(3 + 8 + 24)/5 = 7$.
          - text: >
              It is larger than $6.5$, and the diagonal entries cannot tell
              you by how much.
            correct: true
            feedback: >
              $(1, 2)/\sqrt{5}$ gives $7$. The diagonal entries are just the
              values at two particular unit vectors.
        feedback: >
          You need a way to find the maximum over the whole unit circle without
          trying every direction.
      - reflect: >
          $A$ is symmetric, so it has orthonormal eigenvectors $q_1, q_2$ with
          eigenvalues $\lambda_1, \lambda_2$. Write a unit $x$ as
          $c_1q_1 + c_2q_2$. What does $x^{T}Ax$ become, and why can it never
          exceed the larger eigenvalue?
        hint: >
          What do $c_1^{2}$ and $c_2^{2}$ add up to?
        answer: >
          $x^{T}Ax = \lambda_1c_1^{2} + \lambda_2c_2^{2}$, and $c_1^{2} +
          c_2^{2} = \lVert x \rVert^{2} = 1$. So the risk is a weighted average
          of the eigenvalues with weights $c_i^{2}$, and an average cannot
          exceed its largest term. It equals the largest exactly when all the
          weight sits on the top eigenvector.
      - part: A weighted average of eigenvalues
        teach: >
          The Rayleigh quotient: for symmetric $A$ and every $x \ne 0$,
          $\lambda_{\min} \le x^{T}Ax/x^{T}x \le \lambda_{\max}$, with equality
          at the corresponding eigenvectors. Dividing by $x^{T}x$ removes the
          length, so the quotient depends only on direction.
      - ask: >
          $A$'s characteristic polynomial is $\lambda^{2} - 9\lambda + 14$. What
          is the maximum of $x^{T}Ax$ over unit $x$?
        expects: "7"
        feedback: >
          $(\lambda - 7)(\lambda - 2)$, so $\lambda_{\max} = 7$. That is the
          value you found at $(1, 2)/\sqrt{5}$, and $A(1, 2) = (7, 14)$
          confirms $(1, 2)$ is the top eigenvector.
      - ask: >
          And the minimum over unit $x$?
        expects: "2"
        feedback: >
          $\lambda_{\min} = 2$, at the eigenvector $(2, -1)/\sqrt{5}$:
          $A(2, -1) = (4, -2)$. That is the hedged position, long one asset and
          short the other.
      - ask: >
          At $x = (3, 1)$, which is $(1, 2) + (2, -1)$, what is
          $x^{T}Ax/x^{T}x$?
        expects: "4.5"
        hint: >
          The two eigenvector pieces have the same length, so they get equal
          weight.
        feedback: >
          Equal weights on $7$ and $2$ give $4.5$. Directly:
          $x^{T}Ax = 27 + 12 + 6 = 45$ and $x^{T}x = 10$.
      - part: Where the bound needs its hypotheses
        ask: >
          Drop the constraint: maximize $x^{T}Ax$ over all $x$. What is the
          answer?
        choices:
          - text: >
              $7$, still the top eigenvalue.
            feedback: >
              At $x = 10(1, 2)$ the form is $100 \cdot 35 = 3500$. A quadratic
              form scales as $c^{2}$, so without a length constraint there is no
              ceiling.
          - text: >
              There is none: $x^{T}Ax$ is unbounded.
            correct: true
            feedback: >
              $(cx)^{T}A(cx) = c^{2}\,x^{T}Ax$ grows without limit along any
              direction where the form is positive. The constraint is what makes the problem
              about direction.
          - text: >
              $9$, the trace.
            feedback: >
              The trace is the sum of the eigenvalues, not a bound on the form.
              And without a length constraint no number bounds it.
        feedback: >
          The quotient, or the unit sphere, is what turns "how big" into
          "which way".
      - ask: >
          For $A = 4I$, which unit vector maximizes $x^{T}Ax$?
        choices:
          - text: >
              $(1, 0)$, the first eigenvector.
            feedback: >
              It does reach $4$, but so does every other unit vector. Calling
              it *the* maximizer is the mistake.
          - text: >
              None: the maximum is not attained.
            feedback: >
              It is attained everywhere: $x^{T}(4I)x = 4$ for every unit $x$.
          - text: >
              Every unit vector; the top eigenvalue is repeated.
            correct: true
            feedback: >
              The weighted average of $4$ and $4$ is $4$ whatever the weights.
              A tied top eigenvalue leaves the maximizing direction
              undetermined.
        feedback: >
          The bound always holds; the maximizer is unique only when the top
          eigenvalue is simple. That is the variational fact principal
          components rest on.
  - node: quant-tools.linear-algebra.covariance-psd
    hook: >
      "Prove a covariance matrix is PSD" is one of the most common quant
      proof questions, and the whole proof is one sentence — a variance
      can't be negative — worth having word for word.
    explanation: >
      Expanding $a^{T}\Sigma a$ gives exactly $\operatorname{Var}(a^{T}X)$,
      the variance of the scalar random variable $a^{T}X$ — a weighted
      portfolio of the coordinates of $X$. A variance is never negative, so
      $a^{T}\Sigma a \ge 0$ for every $a$ follows immediately, with no
      eigenvalue computation at all.

      Symmetry of $\Sigma$ is likewise definitional: $\operatorname{Cov}
      (X_i,X_j)=\operatorname{Cov}(X_j,X_i)$ always holds. Combined with the
      spectral theorem, PSD plus symmetric already tells you every
      eigenvalue of a covariance matrix is real and $\ge0$ before looking at
      a single number in $\Sigma$.

      Singularity has a clean reading here too: a zero eigenvalue means some
      portfolio $a^{T}X$ has exactly zero variance — a deterministic linear
      relationship among the coordinates of $X$. This is exactly what
      happens for a sample covariance matrix built from fewer observations
      than variables, since $n-1$ centred data points cannot support more
      than $n-1$ independent directions.
    worked: >
      Two assets with $\operatorname{Var}(X)=4$, $\operatorname{Var}(Y)=9$,
      correlation $0.5$, so $\operatorname{Cov}(X,Y)=0.5\sqrt{4\cdot9}=3$ and
      $\Sigma$ has rows $(4,3)$ and $(3,9)$. For $a=(1,-1)$: $a^{T}\Sigma
      a=4-2\cdot3+9=7$. Checking directly, $\operatorname{Var}(X-Y)=4+9-2
      \cdot3=7$ — matches, and $7\ge0$ as required.
    interview: >
      "Why is a covariance matrix always PSD" is asked nearly verbatim —
      give the one-line variance argument before reaching for eigenvalues,
      and expect the follow-up "when is it singular" (a riskless combination
      exists).
    pitfalls: >
      Reaching for eigenvalues or Sylvester's criterion first instead of the
      direct variance argument. Forgetting a sample covariance matrix from
      $n$ observations of $d$ assets is automatically singular whenever
      $n-1<d$, regardless of the data.
    recap: >
      $a^{T}\Sigma a$ is literally the variance of the portfolio $a^{T}X$,
      so it can never be negative — every covariance matrix is PSD by
      construction, singular exactly when some combination is riskless.
    dialogue:
      - part: A hedge with negative risk
        teach: >
          Two assets: $\operatorname{Var}(X) = 4$, $\operatorname{Var}(Y) = 1$,
          $\operatorname{Cov}(X, Y) = 1.5$. You hold one unit of $X$ and short
          two of $Y$. Recall
          $\operatorname{Var}(aX + bY) = a^{2}\operatorname{Var}(X) +
          2ab\operatorname{Cov}(X, Y) + b^{2}\operatorname{Var}(Y)$.
      - ask: >
          What is $\operatorname{Var}(X - 2Y)$?
        expects: "2"
        feedback: >
          $4 + 2(1)(-2)(1.5) + 4 \cdot 1 = 4 - 6 + 4 = 2$.
      - ask: >
          A junior mistypes the covariance as $2.5$ and reruns it. What does the
          system now report for $\operatorname{Var}(X - 2Y)$?
        expects: "-2"
        feedback: >
          $4 - 4 \cdot 2.5 + 4 = -2$. A negative variance.
      - ask: >
          What does that $-2$ tell you?
        choices:
          - text: >
              The hedge is better than riskless.
            feedback: >
              Variance is an average of squares, so nothing is below $0$. A
              negative output is a broken input, not a great trade.
          - text: >
              No pair of random variables has this covariance matrix.
            correct: true
            feedback: >
              Variances $4$ and $1$ cap the covariance at $\sqrt{4 \cdot 1} = 2$
              in size, and $2.5$ is over the cap. The matrix is not a covariance
              matrix of anything.
          - text: >
              The formula needs absolute values when the weights have mixed
              signs.
            feedback: >
              The formula holds for all weights. With the true $1.5$ it gave a
              perfectly good $2$. The input is what broke.
        feedback: >
          A matrix can be symmetric, with positive diagonal, and still be
          impossible as a covariance matrix.
      - reflect: >
          Write the weights as $a = (1, -2)$ and the covariance matrix as
          $\Sigma$, with rows $(4, 1.5)$ and $(1.5, 1)$. What is
          $\operatorname{Var}(X - 2Y)$ in terms of $a$ and $\Sigma$, and what
          does that force on $\Sigma$ for every possible $a$?
        answer: >
          It is $a^{T}\Sigma a = 4 - 2 \cdot 2 \cdot 1.5 + 4 = 2$: the variance
          formula is exactly the quadratic form of $\Sigma$. A genuine portfolio
          $a^{T}X$ has a genuine variance, which cannot be negative, so
          $a^{T}\Sigma a \ge 0$ for every $a$. That is the definition of PSD,
          and it took one line.
      - part: Every covariance matrix is PSD
        teach: >
          For a random vector $X$ with covariance matrix $\Sigma$,
          $a^{T}\Sigma a = \operatorname{Var}(a^{T}X) \ge 0$ for every fixed
          $a$, and $\Sigma$ is symmetric by construction — so $\Sigma$ is PSD.
          The same holds for every correlation matrix and every sample
          covariance matrix. No eigenvalues and no minors are needed; the
          variance does the work.
      - ask: >
          Keep the variances $4$ and $1$. What covariance makes $X - 2Y$
          riskless, with variance exactly $0$?
        expects: "2"
        hint: >
          Set $4 - 4c + 4 = 0$.
        feedback: >
          $8 - 4c = 0$ gives $c = 2$, which is also the cap
          $\sqrt{4 \cdot 1}$. Then $X - 2Y$ is a constant: $X$ is $2Y$ plus a
          fixed amount, an exact linear relation.
      - ask: >
          With covariance $2$, what happens to $\Sigma$, rows $(4, 2)$ and
          $(2, 1)$?
        choices:
          - text: >
              It stops being PSD.
            feedback: >
              $a^{T}\Sigma a$ is still a variance, so it is still never
              negative. It reaches $0$ at $a = (1, -2)$; that is the boundary,
              not a violation.
          - text: >
              It becomes singular: $(1, -2)$ is an eigenvector with eigenvalue
              $0$.
            correct: true
            feedback: >
              $\Sigma(1, -2) = (4 - 4, 2 - 2) = (0, 0)$, and
              $\det \Sigma = 4 - 4 = 0$. The riskless combination is the null
              direction.
          - text: >
              Nothing changes; only the covariance moved.
            feedback: >
              The determinant moved from $4 - 2.25 = 1.75$ to $0$. One
              covariance entry decided whether $\Sigma$ can be inverted.
        feedback: >
          $\Sigma$ is invertible exactly when no combination of the assets is
          riskless — when there is no redundancy among them. Mean–variance
          formulas that use $\Sigma^{-1}$ fail precisely when one exists.
      - part: Too many assets, too few days
        ask: >
          You estimate a sample covariance matrix for $500$ stocks from $250$
          days of returns. At most what rank can it have?
        expects: "249"
        hint: >
          It is $\frac{1}{n-1}Y^{T}Y$ for the centred $n \times d$ data $Y$, and
          centring makes the rows of $Y$ sum to zero.
        feedback: >
          $Y$ has $250$ rows that sum to zero, so its rank is at most $249$, and
          $Y^{T}Y$ has the rank of $Y$. A $500 \times 500$ matrix of rank at
          most $249$ has at least $251$ zero eigenvalues: hundreds of
          portfolios the sample says are riskless.
      - ask: >
          Is that rank-deficient sample matrix still PSD?
        choices:
          - text: >
              No: a matrix with so many zero eigenvalues is defective.
            feedback: >
              Zero eigenvalues are allowed in PSD; only negative ones are not.
              It is PSD and singular at once.
          - text: >
              Yes: $a^{T}(Y^{T}Y)a = \lVert Ya \rVert^{2} \ge 0$ for every $a$.
            correct: true
            feedback: >
              PSD by construction, whatever the data. What it is not is
              invertible — the riskless portfolios are an artefact of too few
              observations.
          - text: >
              Only if the returns are normally distributed.
            feedback: >
              The argument uses no distribution at all: a sample covariance
              matrix is $\frac{1}{n-1}Y^{T}Y$, and that is always PSD.
        feedback: >
          PSD is automatic, invertibility is not: with fewer observations than
          assets, the sample covariance is always singular.
  - node: quant-tools.linear-algebra.correlation-matrix-bound
    hook: >
      "Can three trades all be pairwise correlated $-0.9$" sounds like a
      data question but is actually a two-line eigenvalue check — most
      people answer it by intuition and get it wrong.
    explanation: >
      Not every symmetric matrix with $1$s on the diagonal is a valid
      correlation matrix, only the PSD ones — so "can these correlations
      coexist" is literally "is this matrix PSD," answered by finding its
      eigenvalues.

      The equicorrelated matrix $(1-\rho)I+\rho J$ ($J$ the all-ones matrix)
      is worth recognizing on sight, since it comes up constantly in
      exchangeable-asset setups: $J$ has eigenvalue $n$ on the all-ones
      direction and $0$ on everything orthogonal to it, so adding $(1-\rho)I$
      shifts every eigenvalue up by $1-\rho$, giving $1+(n-1)\rho$ once and
      $1-\rho$ with multiplicity $n-1$.

      The bound's asymmetry has a real intuitive reading: it's easy for many
      things to move together, but hard for many things to move against each
      other simultaneously, since if $X$ and $Y$ both disagree strongly with
      $Z$ they're forced to agree somewhat with each other — that forcing
      effect compounds as $n$ grows, tightening the floor.
    worked: >
      For $n=4$, the bound is $\rho\ge-1/3$. At $\rho=-1/3$ exactly:
      $1+3(-1/3)=0$ — boundary, still PSD but singular (some combination is
      riskless), with the other eigenvalue $1-\rho=4/3>0$. At $\rho=-0.4$:
      $1+3(-0.4)=-0.2<0$ — not PSD, so four assets cannot be pairwise
      correlated $-0.4$.
    interview: >
      Posed as "can $n$ assets all be pairwise correlated $\rho$" for some
      specific negative $\rho$ — answer by computing $1+(n-1)\rho\ge0$
      mentally, not by guessing. The interviewer is listening for you to
      name the equicorrelated matrix and its eigenvalues, not to reason
      from vague intuition about how correlated things "feel."
    pitfalls: >
      Forgetting the bound only applies to the equicorrelated case (all
      pairs equal $\rho$) — unequal pairwise correlations need the full
      principal-minor or eigenvalue check. Assuming the floor is $-1$ per
      pair rather than the joint $-1/(n-1)$.
    recap: >
      All-pairs correlation $\rho$ among $n$ variables is only possible for
      $\rho\ge-1/(n-1)$, a direct consequence of needing $\Sigma$ to be PSD.
    dialogue:
      - part: Five assets that all disagree
        teach: >
          A strategist pitches five assets in which every pair has correlation
          $-0.3$: each one hedges each other one. Standardize all five to
          variance $1$, so every covariance equals its correlation.
      - ask: >
          Hold one unit of each. What is the variance of the sum
          $X_1 + X_2 + X_3 + X_4 + X_5$?
        expects: "-1"
        hint: >
          Five variances, plus twice each of the $10$ pairwise covariances.
        feedback: >
          $5 \cdot 1 + 2 \cdot 10 \cdot (-0.3) = 5 - 6 = -1$.
      - ask: >
          What is the verdict on the pitch?
        choices:
          - text: >
              Fine: each correlation $-0.3$ lies inside $[-1, 1]$.
            feedback: >
              Each pair is fine on its own. Together they produce a portfolio
              with variance $-1$, which no random variables can have.
          - text: >
              Impossible: it implies a portfolio with negative variance.
            correct: true
            feedback: >
              The correlation matrix would have $a^{T}\Sigma a = -1$ at
              $a = (1, 1, 1, 1, 1)$, so it is not PSD and not the correlation
              matrix of anything.
          - text: >
              Possible, but only with non-normal returns.
            feedback: >
              PSD-ness of a covariance matrix uses no distributional
              assumption. The negative variance rules out every distribution.
        feedback: >
          Pairwise plausible, jointly impossible. If $X_1$ and $X_2$ both
          disagree with $X_3$, they have to agree somewhat with each other.
      - reflect: >
          The all-ones vector exposed the problem immediately. What is special
          about it for a matrix with $1$ on the diagonal and the same $\rho$
          everywhere off it?
        hint: >
          Multiply the matrix by $(1, 1, 1, 1, 1)$ and look at any one row.
        answer: >
          Every row is $1$ plus four copies of $\rho$, so the all-ones vector
          comes back multiplied by $1 + 4\rho$: it is an eigenvector, with
          eigenvalue $1 + 4\rho = -0.2$ here. A negative eigenvalue, so not PSD.
          And it is the natural vector to try, since every row looks the same.
      - part: The eigenvalues of an equicorrelated matrix
        teach: >
          Write the $n \times n$ matrix as $(1 - \rho)I + \rho J$, with $J$ the
          all-ones matrix. $J$ has eigenvalue $n$ on the all-ones vector and
          $0$ on every vector whose entries sum to zero. So the matrix has
          eigenvalue $1 + (n - 1)\rho$ once and $1 - \rho$ with multiplicity
          $n - 1$, and PSD forces $-1/(n - 1) \le \rho \le 1$.
      - ask: >
          At $\rho = -0.3$, multiply the five-asset matrix by
          $(1, -1, 0, 0, 0)$. It comes back as a multiple of itself. What is the
          multiple?
        expects: "1.3"
        feedback: >
          Row $1$ gives $1 - \rho = 1.3$, row $2$ gives $\rho - 1 = -1.3$, and
          rows $3$ to $5$ give $\rho - \rho = 0$. So the eigenvalue is
          $1 - \rho = 1.3$: positive. Only the all-ones direction fails.
      - ask: >
          For five assets, what is the most negative common correlation
          possible?
        expects: "-0.25"
        feedback: >
          $1 + 4\rho \ge 0$ gives $\rho \ge -1/4$. The pitch's $-0.3$ is past
          the floor.
      - ask: >
          At exactly $\rho = -0.25$, what is true?
        choices:
          - text: >
              The matrix is not PSD: the boundary itself is excluded.
            feedback: >
              The eigenvalue is $1 + 4(-0.25) = 0$, which PSD allows. The
              boundary is attainable.
          - text: >
              The matrix is PSD and singular: the equal-weighted sum has
              variance $0$.
            correct: true
            feedback: >
              $5 + 20(-0.25) = 0$. The five assets sum to a constant — an exact
              linear relation, which is what a zero eigenvalue always means for
              a covariance matrix.
          - text: >
              The matrix is positive definite.
            feedback: >
              One eigenvalue is exactly $0$, so some nonzero portfolio has zero
              variance. PSD, not PD.
        feedback: >
          The floor is reached by quantities that add up to a constant, like
          the market shares of five firms, which always total $100\%$.
      - part: Beyond the equal case
        ask: >
          Three assets with $\rho_{12} = 0.9$, $\rho_{13} = 0.9$ and
          $\rho_{23} = 0$. For a $3 \times 3$ correlation matrix,
          PSD reduces to $1 + 2\rho_{12}\rho_{13}\rho_{23} - \rho_{12}^{2} -
          \rho_{13}^{2} - \rho_{23}^{2} \ge 0$. What is the left side?
        expects: "-0.62"
        tolerance: 0.001
        feedback: >
          $1 + 0 - 0.81 - 0.81 - 0 = -0.62 < 0$: impossible. If $X_2$ and
          $X_3$ both track $X_1$ at $0.9$, they cannot be uncorrelated with
          each other. The equicorrelated floor says nothing about unequal
          triples; this check does.
      - ask: >
          As the number of equicorrelated assets grows, what happens to the most
          negative possible common correlation?
        choices:
          - text: >
              It stays at $-1$: each pair can always be perfectly opposed.
            feedback: >
              Three assets cannot even reach $-0.6$. With $n$ assets the floor
              is $-1/(n - 1)$, which is far above $-1$.
          - text: >
              It tends to $0$: many assets cannot all hedge one another.
            correct: true
            feedback: >
              $-1/(n - 1)$ is $-1/2$ for $3$ assets, $-1/4$ for $5$, $-1/99$ for
              $100$. A large universe can be mutually positively correlated,
              but barely negatively at all.
          - text: >
              It tends to $-1/2$.
            feedback: >
              $-1/2$ is the floor for three assets. Each extra asset adds
              another constraint, and the floor rises toward $0$.
        feedback: >
          Said aloud in an interview: "the all-ones vector is an eigenvector
          with eigenvalue $1 + (n - 1)\rho$, which must be nonnegative, so
          $\rho \ge -1/(n - 1)$".
  - node: quant-tools.linear-algebra.projection
    hook: >
      Least squares and orthogonal projection are the same picture — the
      closest point in a subspace is the one where the error is invisible to
      that subspace — and once that clicks, the normal equations stop
      looking like they came from nowhere.
    explanation: >
      Minimizing $\lVert b-v\rVert$ over $v\in V$ is calculus-free geometry
      once seen right: if the error $b-\hat b$ had any component still
      inside $V$, subtracting that component off $\hat b$ would get strictly
      closer to $b$. So at the true minimizer the error has zero component
      in every direction of $V$ — orthogonal to all of $V$, which is the
      entire content of $A^{T}(b-\hat b)=0$.

      Turning that into a solvable system uses the identity for moving a
      matrix across a dot product: substituting $\hat b = A\hat x$ turns
      $A^{T}(b-A\hat x)=0$ into $A^{T}A\hat x = A^{T}b$, and independent
      columns of $A$ — the same condition invertibility already needs — is
      exactly what guarantees $A^{T}A$ is invertible, pinning $\hat x$ down
      uniquely.

      Know the projector $P=A(A^{T}A)^{-1}A^{T}$ by its two defining
      properties rather than the formula: $P^{2}=P$ (projecting twice does
      nothing new) and $P^{T}=P$, which together force every eigenvalue of
      $P$ to be $0$ or $1$ and make $\operatorname{tr}P$ literally count the
      dimension of $V$.
    worked: >
      Project $b=(4,3,0)$ onto the line spanned by $a=(1,1,1)$ in
      $\mathbb{R}^{3}$. Here $\hat x=(a^{T}b)/(a^{T}a)=(4+3+0)/3=7/3$, so
      $\hat b=(7/3,7/3,7/3)$. The residual $b-\hat b=(5/3,2/3,-7/3)$ is
      orthogonal to $a$, since $5/3+2/3-7/3=0$.
    interview: >
      "Derive the least-squares formula from scratch" is standard — the
      interviewer wants the orthogonality argument, not memorized algebra.
      "Why must $A^{T}A$ be invertible" tests the link back to independent
      columns.
    pitfalls: >
      Forming normal equations with dependent columns of $A$, silently
      making $A^{T}A$ singular. Forgetting it is $b-\hat b$ (not $b$ itself)
      that is orthogonal to the column space.
    recap: >
      The closest point of a subspace to $b$ is the one whose error is
      orthogonal to it, and writing that as $A^{T}(b-A\hat x)=0$ is exactly
      the normal equations $A^{T}A\hat x=A^{T}b$.
    dialogue:
      - part: One instrument, the smallest leftover
        teach: >
          You must offset a factor exposure $b = (3, 0, 3)$ using one
          instrument whose exposure per unit is $a = (1, 2, 2)$. Holding $t$
          units leaves $b - ta$ unhedged, and you want that leftover as short as
          possible.
      - ask: >
          Try $t = 2$. What is $\lVert b - 2a \rVert^{2}$?
        expects: "18"
        feedback: >
          $b - 2a = (1, -4, -1)$, and $1 + 16 + 1 = 18$ — no better than
          holding nothing, since $\lVert b \rVert^{2} = 18$ too.
      - ask: >
          Expanded, $\lVert b - ta \rVert^{2} = 9t^{2} - 18t + 18$. Which $t$
          minimizes it?
        expects: "1"
        feedback: >
          The parabola's vertex is at $t = 18/18 = 1$, where the leftover is
          $b - a = (2, -2, 1)$ with squared length $9$.
      - ask: >
          What is the dot product of that best leftover $(2, -2, 1)$ with
          $a$?
        expects: "0"
        feedback: >
          $2 - 4 + 2 = 0$. The best leftover is perpendicular to the
          instrument.
      - reflect: >
          Why must the best leftover be perpendicular to $a$? Answer it without
          calculus, and use the answer to write the best $t$ for any $a$ and
          $b$.
        hint: >
          Suppose the leftover still had some component along $a$. Could a
          different $t$ do better?
        answer: >
          Any part of the leftover lying along $a$ could be removed by holding a
          bit more or less of $a$, which would shorten it. So at the best $t$
          nothing along $a$ remains: $a^{T}(b - ta) = 0$, giving
          $t = a^{T}b/a^{T}a$. Here that is $9/9 = 1$. The closest point is the
          foot of the perpendicular.
      - part: Many instruments, the normal equations
        teach: >
          With several instruments, the columns of an $m \times n$ matrix $A$
          with independent columns, the same argument says: the closest point
          $\hat{b} = A\hat{x}$ of the column space has its residual
          perpendicular to every column, $A^{T}(b - A\hat{x}) = 0$. These are
          the normal equations $A^{T}A\hat{x} = A^{T}b$. Independent columns
          make $A^{T}A$ invertible, so $\hat{x} = (A^{T}A)^{-1}A^{T}b$ and
          $\hat{b} = Pb$ with $P = A(A^{T}A)^{-1}A^{T}$.
      - ask: >
          Two instruments, $a_1 = (1, 2, 0)$ and $a_2 = (0, 1, 1)$, and
          $b = (3, 2, 2)$. Then $A^{T}A$ has rows $(5, 2)$ and $(2, 2)$, and
          $A^{T}b = (7, 4)$. Solve the normal equations; what is the second
          coordinate of $\hat{b} = A\hat{x}$?
        expects: "3"
        hint: >
          Subtract $2x + 2y = 4$ from $5x + 2y = 7$.
        feedback: >
          $3x = 3$, so $\hat{x} = (1, 1)$ and $\hat{b} = a_1 + a_2 =
          (1, 3, 1)$. The residual $b - \hat{b} = (2, -1, 1)$ has dot products
          $2 - 2 + 0 = 0$ with $a_1$ and $0 - 1 + 1 = 0$ with $a_2$, as
          promised.
      - ask: >
          What is the squared distance from $b$ to the plane of the two
          instruments?
        expects: "6"
        feedback: >
          $\lVert (2, -1, 1) \rVert^{2} = 4 + 1 + 1 = 6$. Pythagoras splits
          $b$: $\lVert b \rVert^{2} = 17 = 11 + 6$, with $11 =
          \lVert \hat{b} \rVert^{2}$.
      - part: What the projector does, and where it fails
        ask: >
          Apply the same projection to $\hat{b} = (1, 3, 1)$, which already lies
          in the plane. What comes out?
        choices:
          - text: >
              $(1, 3, 1)$ again
            correct: true
            feedback: >
              The closest point of the plane to a point of the plane is itself.
              So $P^{2} = P$, and every vector of the plane is an eigenvector
              with eigenvalue $1$.
          - text: >
              $(0, 0, 0)$
            feedback: >
              That is what the projection does to the residual direction
              $(2, -1, 1)$, which is perpendicular to the plane, not to a vector
              lying in it.
          - text: >
              A point closer still to $b$
            feedback: >
              $\hat{b}$ is already the closest point of the plane to $b$; a
              second projection has nothing left to improve.
        feedback: >
          $P$ keeps the plane and kills its perpendicular: eigenvalues $1$ and
          $0$ only, $P^{T} = P$, $P^{2} = P$, and $\operatorname{tr} P$ equals
          the dimension of the subspace.
      - ask: >
          A third instrument is added with exposure $(1, 3, 1)$, equal to
          $a_1 + a_2$. With all three as columns, what breaks?
        choices:
          - text: >
              The closest point $\hat{b}$ no longer exists.
            feedback: >
              The column space is the same plane as before, so the closest
              point is the same $(1, 3, 1)$. Geometry is untouched.
          - text: >
              $A^{T}A$ becomes singular, so $\hat{x}$ is not unique — though
              $\hat{b}$ still is.
            correct: true
            feedback: >
              $(1, 1, -1)$ is in $\ker A$, so $(1, 1, 0)$ and $(0, 0, 1)$ both
              produce $\hat{b}$. The formula $(A^{T}A)^{-1}A^{T}b$ has nothing to
              invert.
          - text: >
              The residual stops being perpendicular to the columns.
            feedback: >
              The residual $(2, -1, 1)$ is still perpendicular to all three
              columns. What fails is the uniqueness of the weights.
        feedback: >
          Independence is what makes the hedge ratios unique. With redundant
          instruments the best hedge is unique and the way to build it is not —
          a regression with collinear regressors in miniature.
  - node: quant-tools.linear-algebra.least-squares-fit
    hook: >
      This is orthogonal projection's geometry run as arithmetic — doing it
      once by hand, then checking the residual really is orthogonal to both
      columns, is what makes "orthogonal projection" stop being an
      abstraction.
    explanation: >
      Fitting $y=a+bx$ is projection with a two-column design matrix: the
      first column all $1$s (intercept), the second the $x$-values. The
      normal equations for orthogonal projection, $A^{T}A\hat x=A^{T}b$, are
      the entire computation — nothing new is introduced here beyond
      plugging in.

      $A^{T}A$'s entries are sums the data already gives: $n$, $\sum x_i$,
      $\sum x_i^{2}$; and $A^{T}y$ is $\sum y_i$, $\sum x_iy_i$. Setting
      these sums up correctly is the only place arithmetic actually
      happens — solving the resulting $2\times2$ system is ordinary
      elimination.

      The residual-orthogonality fact from orthogonal projection is exactly
      the diagnostic to run at the end: fitted residuals must sum to zero
      (orthogonal to the intercept column) and satisfy $\sum x_ie_i=0$
      (orthogonal to the slope column). Either failing means the normal
      equations were set up or solved wrong.
    worked: >
      Fit $y=a+bx$ to $(0,1)$, $(1,1)$, $(2,3)$: $n=3$, $\sum x_i=3$, $\sum
      x_i^{2}=5$, $\sum y_i=5$, $\sum x_iy_i=7$. Normal equations
      $3a+3b=5$, $3a+5b=7$ give $2b=2 \Rightarrow b=1$, $a=2/3$. Fitted
      values are $2/3$, $5/3$, $8/3$; residuals $1/3$, $-2/3$, $1/3$ sum to
      $0$ and satisfy $0\cdot\tfrac13+1\cdot(-\tfrac23)+2\cdot\tfrac13=0$.
      The minimized sum of squared residuals is $1/9+4/9+1/9=2/3$.
    interview: >
      "Fit a line to these three points" by hand is a real prompt — go
      straight to the normal-equations sums, not calculus. Checking the
      residuals sum to zero shows you understand what you just computed.
    pitfalls: >
      Confusing $\sum x_iy_i$ with $(\sum x_i)(\sum y_i)$ when building
      $A^{T}y$. Skipping the residual-orthogonality check, which catches
      most arithmetic slips for free.
    recap: >
      Fitting a line projects $y$ onto the span of $1$ and $x$, so the
      normal equations reduce to elementary sums, and the fitted residuals
      must be orthogonal to both columns.
    dialogue:
      - part: Four points, no line through them
        teach: >
          A desk fits a line $y = a + bx$ relating a signal $x$ to next-day
          return $y$, using four observations: $(0, 2)$, $(1, 1)$, $(2, 4)$ and
          $(3, 5)$. No line passes through all four.
      - ask: >
          Eyeball it with the line through the first and last points,
          $y = 2 + x$. What is its sum of squared errors over the four points?
        expects: "4"
        feedback: >
          It predicts $2, 3, 4, 5$, so the errors are $0, -2, 0, 0$ and the sum of
          squares is $4$. All of it comes from one point.
      - ask: >
          Why not solve the four equations $a + bx_i = y_i$ exactly?
        choices:
          - text: >
              Four equations in two unknowns are always inconsistent.
            feedback: >
              Four points on a common line would give a consistent system.
              These are inconsistent because the points are not collinear.
          - text: >
              They have no solution: the first two force $a = 2$, $b = -1$, and
              the third then fails.
            correct: true
            feedback: >
              $2 - 2 = 0 \ne 4$. The data vector $y = (2, 1, 4, 5)$ is not in
              the column space of the design matrix, whose columns are
              $(1, 1, 1, 1)$ and $(0, 1, 2, 3)$.
          - text: >
              They have infinitely many solutions, so you need a rule to pick
              one.
            feedback: >
              The two columns are independent, so a solution, if any, would be
              unique. The problem is that there is none.
        feedback: >
          The system $Ax = y$ cannot be solved, so the question becomes which
          $Ax$ comes closest to $y$.
      - reflect: >
          "Closest" means the smallest sum of squared residuals,
          $\lVert y - Ax \rVert^{2}$. What two conditions must the best
          residual vector $r = y - A\hat{x}$ satisfy, written as sums over the
          four points?
        hint: >
          The best leftover is perpendicular to every column of $A$.
        answer: >
          $r$ must be perpendicular to both columns. Against $(1, 1, 1, 1)$
          that says $\sum_{i} r_i = 0$: the residuals cancel. Against
          $(0, 1, 2, 3)$ it says $\sum_{i} x_ir_i = 0$: they are uncorrelated
          with the signal. Those two equations are the normal equations
          $A^{T}A\hat{x} = A^{T}y$.
      - part: Building and solving the normal equations
        teach: >
          In sums, $A^{T}A$ has rows $(n, \sum x_i)$ and
          $(\sum x_i, \sum x_i^{2})$, and $A^{T}y = (\sum y_i, \sum x_iy_i)$.
          Here $n = 4$, $\sum x_i = 6$, $\sum x_i^{2} = 14$ and
          $\sum y_i = 12$.
      - ask: >
          What is $\sum x_iy_i$?
        expects: "24"
        feedback: >
          $0 \cdot 2 + 1 \cdot 1 + 2 \cdot 4 + 3 \cdot 5 = 0 + 1 + 8 + 15 =
          24$.
      - ask: >
          The normal equations are $4a + 6b = 12$ and $6a + 14b = 24$. What is
          the slope $b$?
        expects: "6/5"
        hint: >
          Multiply the first by $1.5$ and subtract.
        feedback: >
          $6a + 9b = 18$, so subtracting gives $5b = 6$ and $b = 6/5$. Then
          $4a = 12 - 7.2$ gives $a = 1.2$.
      - ask: >
          The line $y = 1.2 + 1.2x$ predicts $1.2, 2.4, 3.6, 4.8$, so the
          residuals are $0.8, -1.4, 0.4, 0.2$. What is $\sum x_ir_i$?
        expects: "0"
        feedback: >
          $0 - 1.4 + 0.8 + 0.6 = 0$, and $\sum r_i = 0.8 - 1.4 + 0.4 + 0.2 = 0$
          too. Both orthogonality conditions hold, which is the check that the
          arithmetic is right.
      - ask: >
          What is the minimized sum of squared residuals?
        expects: "2.8"
        tolerance: 0.001
        feedback: >
          $0.64 + 1.96 + 0.16 + 0.04 = 2.8$, against $4$ for the eyeballed line.
          The fit gave up a little at the three points the eyeball line hit
          exactly to cut the big miss at $(1, 1)$.
      - part: Two ways to get it wrong
        ask: >
          A colleague fills in $A^{T}y$ with $(\sum x_i)(\sum y_i) = 72$ instead
          of $\sum x_iy_i$. What is the quickest way to catch it?
        choices:
          - text: >
              Check that the slope is positive.
            feedback: >
              Their slope comes out as $10.8$, which is positive and absurd. A
              sign check is too weak to catch it.
          - text: >
              Check the residuals against the columns: they will not sum to
              zero against $x$.
            correct: true
            feedback: >
              Their line, $y = -13.2 + 10.8x$, leaves residuals whose sum is $0$
              but whose $\sum x_ir_i$ is far from $0$. The orthogonality check
              catches most construction errors for free.
          - text: >
              Nothing catches it short of redoing the sums.
            feedback: >
              The residual check costs four multiplications and exposes it at
              once.
        feedback: >
          $\sum x_iy_i$ and $(\sum x_i)(\sum y_i)$ are different numbers, and
          only the first belongs in the normal equations.
      - ask: >
          Every observation happened to have the same signal, $x_i = 2$. What
          happens to the fit?
        choices:
          - text: >
              The slope is $0$: the signal never moved.
            feedback: >
              The data cannot say what $y$ does when $x$ moves, so they do not
              say the slope is $0$ either. Every slope fits equally well.
          - text: >
              The fit is fine, just less precise.
            feedback: >
              The columns $(1, 1, 1, 1)$ and $(2, 2, 2, 2)$ are dependent, so
              $A^{T}A$ is singular and the normal equations have no unique
              solution.
          - text: >
              $A^{T}A$ is singular: every line through $(2, \bar{y})$ fits
              equally well.
            correct: true
            feedback: >
              The fitted values are all $\bar{y}$ whatever the slope. The
              projection exists; the coefficients are not identified.
        feedback: >
          A slope needs variation in $x$. Independent columns are exactly that
          requirement.
  - node: quant-tools.linear-algebra.pca
    hook: >
      "PCA" sounds like a separate machine-learning topic, but on the
      interview it's pure linear algebra — diagonalize the covariance
      matrix — dressed up in the language of "explained variance."
    explanation: >
      The Rayleigh quotient already answered "which direction maximizes
      variance": the top eigenvector of $\Sigma$. PCA applies that fact
      repeatedly — after restricting to vectors orthogonal to $q_1$, the
      same maximization on the remaining space is again solved by an
      eigenvector, this time for the second-largest eigenvalue, and so on
      down the spectrum.

      Uncorrelatedness of the component scores $q_i^{T}X$ is not an extra
      assumption — it falls out of orthogonality of the $q_i$ for distinct
      eigenvalues, from the spectral theorem, combined with $\Sigma$ being
      diagonal in that basis, so two different components literally cannot
      share variance.

      "Variance explained" is the eigenvalues renormalized to sum to $1$,
      since $\sum_i\lambda_i=\operatorname{tr}\Sigma$ is the total variance
      across all original coordinates — trace is basis-independent, so this
      total doesn't depend on which orthonormal directions were chosen.
      Keeping the top $k$ components is choosing the $k$-dimensional
      subspace capturing the most variance possible, orthogonal projection's
      "closest subspace" idea applied to variance instead of distance.
    worked: >
      Covariance matrix $\Sigma$ with rows $(5,4)$ and $(4,5)$:
      $\operatorname{tr}\Sigma=10$, $\det\Sigma=9$, so $\lambda=5\pm4=9,1$.
      For $\lambda_1=9$: $\Sigma-9I$ has rows $(-4,4)$ and $(4,-4)$, giving
      $q_1=(1,1)/\sqrt2$. Total variance is $10$, so the first component
      alone explains $9/10=90\%$ of it.
    interview: >
      "What is PCA, in one sentence" is answered by "eigendecompose the
      covariance matrix; the top eigenvectors are the directions of maximal
      variance." A follow-up on why components are uncorrelated should
      trigger the orthogonality argument, not a hand-wave.
    pitfalls: >
      Running PCA on raw variables of very different scales without
      standardizing — components then chase whichever variable has the
      largest numerical variance. Treating "explained variance" as
      predictive usefulness rather than spread — a high-variance direction
      can be pure noise.
    recap: >
      PCA is the covariance matrix's spectral decomposition: eigenvectors
      are the uncorrelated directions of maximal variance, eigenvalues are
      how much variance each carries, and $\lambda_k/\operatorname{tr}
      \Sigma$ is the share explained.
    dialogue:
      - part: One number to track two yields
        teach: >
          Daily changes of two yields have covariance matrix $\Sigma$ with rows
          $(8, 2)$ and $(2, 5)$. Your dashboard has room for one number, a
          combination $a^{T}X$ with $\lVert a \rVert = 1$, and you want it to
          carry as much of the day-to-day variance as possible. The first yield
          alone, $a = (1, 0)$, carries $8$.
      - ask: >
          Try the equal blend $a = (1, 1)/\sqrt{2}$. What is
          $\operatorname{Var}(a^{T}X) = a^{T}\Sigma a$?
        expects: "8.5"
        hint: >
          Compute the form at $(1, 1)$ and halve it.
        feedback: >
          At $(1, 1)$: $8 + 2 \cdot 2 + 5 = 17$, halved to $8.5$. Better than
          either yield alone.
      - ask: >
          You could keep trying directions — $(2, 1)/\sqrt{5}$ next, then
          others. What is wrong with that plan?
        choices:
          - text: >
              Nothing: a fine enough grid of directions finds the best one.
            feedback: >
              In two dimensions, perhaps. With $50$ yields the unit sphere has
              $49$ dimensions, and no grid covers it. And a grid only
              approximates an answer that has an exact form.
          - text: >
              It treats a problem with a known exact answer as a search.
            correct: true
            feedback: >
              Maximizing $a^{T}\Sigma a$ over unit $a$ is a problem you have
              already solved in general.
          - text: >
              It cannot work, because the variance of a combination is not a
              quadratic form.
            feedback: >
              It is exactly one: $\operatorname{Var}(a^{T}X) = a^{T}\Sigma a$.
              That is why the search can be replaced.
        feedback: >
          The search is the waste. Name the problem and the answer comes with
          it.
      - reflect: >
          What is the maximum of $a^{T}\Sigma a$ over unit vectors $a$, where is
          it attained — and once you have it, what is the best *second* number
          to add to the dashboard?
        hint: >
          $\Sigma$ is symmetric, so the Rayleigh bound applies.
        answer: >
          The maximum is $\lambda_1$, the top eigenvalue of $\Sigma$, attained
          at its eigenvector $q_1$. The best second direction maximizes the same
          quantity among unit vectors perpendicular to $q_1$, which gives
          $\lambda_2$ at $q_2$, and so on down. One eigendecomposition delivers
          every direction at once, ranked.
      - part: Principal components
        teach: >
          Write $\Sigma = Q\Lambda Q^{T}$ with $\lambda_1 \ge \dots \ge
          \lambda_d \ge 0$. The principal directions are the $q_i$; the scores
          $q_i^{T}X$ are uncorrelated with variances $\lambda_i$; and
          $\sum_{i} \lambda_i = \operatorname{tr}\Sigma$ is the total variance,
          so $\lambda_k/\operatorname{tr}\Sigma$ is the share the $k$th
          component explains. Recipe: centre, form $\Sigma$, eigendecompose,
          keep the top $k$.
      - ask: >
          $\Sigma$'s characteristic polynomial is $\lambda^{2} - 13\lambda + 36$.
          What is the variance of the first principal component?
        expects: "9"
        feedback: >
          $(\lambda - 9)(\lambda - 4)$, so $\lambda_1 = 9$. No direction beats
          $9$; your blend's $8.5$ was close.
      - ask: >
          Which direction carries it?
        choices:
          - text: >
              $(1, 0)$, the more volatile yield
            feedback: >
              $(1, 0)$ carries $8$. The covariance $2$ pulls the best direction
              toward a blend of the two.
          - text: >
              $(1, 1)/\sqrt{2}$, the equal blend
            feedback: >
              That gives $8.5$. $\Sigma(1, 1) = (10, 7)$ is not a multiple of
              $(1, 1)$, so it is not an eigenvector.
          - text: >
              $(2, 1)/\sqrt{5}$
            correct: true
            feedback: >
              $\Sigma(2, 1) = (18, 9) = 9 \cdot (2, 1)$. Mostly the volatile
              yield, with some of the other.
        feedback: >
          The first component tilts toward the bigger variance and the positive
          covariance pulls in the other yield.
      - ask: >
          What share of the total variance does the first component explain?
        expects: "9/13"
        tolerance: 0.001
        feedback: >
          Total variance is $\operatorname{tr}\Sigma = 8 + 5 = 13 = 9 + 4$, so
          the share is $9/13 \approx 69\%$. The second component, along
          $(1, -2)/\sqrt{5}$, carries the other $4$.
      - ask: >
          What is the covariance between the first and second component scores?
        expects: "0"
        feedback: >
          $\operatorname{Cov}(q_1^{T}X, q_2^{T}X) = q_1^{T}\Sigma q_2 =
          \lambda_2\, q_1^{T}q_2 = 0$. In the new coordinates $\Sigma$ is
          diagonal: the components are uncorrelated by construction.
      - part: When the answer is an artefact
        ask: >
          Someone records the first yield in hundredths of its old unit, which
          multiplies it by $100$. What does the first component become?
        choices:
          - text: >
              The same direction: rescaling a variable does not change the
              data.
            feedback: >
              $\Sigma$ becomes rows $(80000, 200)$ and $(200, 5)$. The top
              eigenvector is now almost exactly $(1, 0)$: the answer moved
              because the units did.
          - text: >
              Almost exactly the first yield alone.
            correct: true
            feedback: >
              Its variance is now $80000$ against $5$, so it dominates the
              total. PCA chases whichever variable has the biggest numbers,
              which is why variables in different units are standardized
              first.
          - text: >
              Almost exactly the second yield alone.
            feedback: >
              The first yield's variance grew by $10^{4}$, so it is the one that
              dominates.
        feedback: >
          PCA is not invariant to rescaling. Standardize — or work with the
          correlation matrix — when the variables are in different units.
      - ask: >
          Two uncorrelated assets each have variance $3$, so $\Sigma = 3I$. What
          is the first principal direction?
        choices:
          - text: >
              $(1, 0)$, the first asset.
            feedback: >
              It carries $3$, but so does every unit direction. Picking it is
              arbitrary.
          - text: >
              $(1, 1)/\sqrt{2}$, the equal blend.
            feedback: >
              Its variance is also $3$. The blend has no special claim when
              every direction ties.
          - text: >
              Undetermined: every unit direction carries variance $3$.
            correct: true
            feedback: >
              A tied top eigenvalue leaves the direction undefined. A solver
              will return some answer; it means nothing.
        feedback: >
          Read the eigenvalue gap before reading the eigenvector. With near-ties
          the directions are unstable from sample to sample.
  - node: quant-tools.linear-algebra.diagonalization-powers
    hook: >
      "What happens after many steps" — a Markov chain settling down, a
      recursion's growth rate, a risk factor's persistence — is always
      answered the same way: diagonalize once, then powers are free.
    explanation: >
      The substitution is short but worth deriving: if $A=PDP^{-1}$ then
      $A^{2}=PDP^{-1}PDP^{-1}=PD^{2}P^{-1}$, since the middle $P^{-1}P$
      cancels — the same cancellation telescopes for any $k$, so computing
      $A^{k}$, normally expensive, costs exactly one entrywise diagonal
      power $D^{k}$ sandwiched between a change of basis and its inverse.

      Existence of $P$ needs $n$ independent eigenvectors, guaranteed when
      the $n$ eigenvalues are distinct (eigenvectors for distinct
      eigenvalues are always independent) or when $A$ is symmetric (the
      spectral theorem's orthonormal basis is in particular independent) —
      but not in general, since a repeated eigenvalue can leave the
      eigenspace too small to span the space.

      The practically useful reading: since $D^{k}$ raises each eigenvalue
      to the $k$, the entries of $A^{k}$ are eventually dominated by
      whichever $|\lambda|$ is largest. Every $|\lambda|<1$ drives
      $A^{k}\to0$; a $|\lambda|=1$ eigenvalue survives while the rest decay;
      any $|\lambda|>1$ blows up — the entire content of "does this
      recursion converge" before any numbers are plugged in.
    worked: >
      $A$ has rows $(3,1)$ and $(0,2)$ — upper triangular, so eigenvalues
      are the diagonal entries $3,2$. For $\lambda=3$: $A-3I$ has rows
      $(0,1)$ and $(0,-1)$, eigenvector $(1,0)$. For $\lambda=2$: $A-2I$ has
      rows $(1,1)$ and $(0,0)$, eigenvector $(1,-1)$. With $D^{2}=
      \operatorname{diag}(9,4)$, computing $PD^{2}P^{-1}$ gives $A^{2}$ with
      rows $(9,5)$ and $(0,4)$ — matching direct multiplication of $A$ by
      itself.
    interview: >
      "Does this Markov chain or recursion converge, and to what" is
      diagonalization in disguise — answer in terms of the largest
      $|\lambda|$ before doing any actual multiplication. Being asked to
      state the long-run behaviour without computing a single power is the
      real test of whether you understand the eigenvalue story, not just
      the algebra.
    pitfalls: >
      Assuming every matrix is diagonalizable — a repeated eigenvalue with a
      deficient eigenspace (rows $(1,1)$, $(0,1)$) needs Jordan form
      instead. Computing $PD^{k}$ alone and forgetting the outer $P^{-1}$,
      which is not $A^{k}$.
    recap: >
      Diagonalizing turns matrix powers into scalar powers of the
      eigenvalues sandwiched by a fixed change of basis, and the largest
      $|\lambda|$ alone decides whether $A^{k}$ decays, stabilizes, or blows
      up.
    dialogue:
      - part: Ten periods of the same update
        teach: >
          A two-sector model updates its state each period by $x \mapsto Ax$,
          where $A$ has rows $(1, 1)$ and $(4, 1)$. You need the state after
          many periods, starting from $(1, 0)$ — that is, the first column of
          $A^{k}$.
      - ask: >
          Start slowly. What is the $(1, 1)$ entry of $A^{2}$?
        expects: "5"
        feedback: >
          Row $(1, 1)$ against column $(1, 4)$: $1 + 4 = 5$. In full $A^{2}$ has
          rows $(5, 2)$ and $(8, 5)$. Ten periods this way is nine matrix
          products, and every one starts from scratch.
      - ask: >
          Some inputs are cheap. $A(1, 2) = (3, 6)$. What is the first coordinate
          of $A^{10}(1, 2)$?
        expects: "59049"
        hint: >
          $(3, 6) = 3 \cdot (1, 2)$, and $A$ does the same thing each period.
        feedback: >
          Each period multiplies $(1, 2)$ by $3$, so $A^{10}(1, 2) =
          3^{10}(1, 2)$, with first coordinate $3^{10} = 59049$. No matrix
          products at all.
      - ask: >
          $A(1, -2) = (-1, 2)$, so $(1, -2)$ is just negated each period. Write
          $(1, 0) = c(1, 2) + c'(1, -2)$. What is $c$?
        expects: "1/2"
        feedback: >
          Adding the two equations $c + c' = 1$ and $2c - 2c' = 0$ gives
          $c = c' = 1/2$: $(1, 0) = \tfrac{1}{2}(1, 2) + \tfrac{1}{2}(1, -2)$.
      - reflect: >
          You can raise $A$ to a power cheaply on $(1, 2)$ and on $(1, -2)$.
          Explain how to get $A^{k}(1, 0)$ from that, and then how to write the
          whole matrix $A^{k}$ the same way.
        hint: >
          Put the two special vectors in the columns of a matrix $P$.
        answer: >
          Split $(1, 0)$ into its two pieces, let each piece evolve on its own
          — one multiplied by $3^{k}$, the other by $(-1)^{k}$ — and add:
          $A^{k}(1, 0) = \tfrac{1}{2}3^{k}(1, 2) + \tfrac{1}{2}(-1)^{k}(1, -2)$.
          For the whole matrix: $P^{-1}$ finds the pieces, a diagonal $D^{k}$
          scales them, $P$ reassembles, so $A^{k} = PD^{k}P^{-1}$.
      - part: Change basis, power, change back
        teach: >
          If $A$ has $n$ independent eigenvectors — guaranteed when its $n$
          eigenvalues are distinct, and always for symmetric $A$ — put them in
          the columns of $P$ and the eigenvalues on the diagonal of $D$. Then
          $A = PDP^{-1}$, and the inner factors telescope:
          $A^{k} = PD^{k}P^{-1}$. The same substitution defines $e^{At}$ or a
          square root of $A$.
      - ask: >
          What is the $(1, 1)$ entry of $A^{5}$?
        expects: "121"
        hint: >
          The first coordinate of $\tfrac{1}{2}3^{5}(1, 2) +
          \tfrac{1}{2}(-1)^{5}(1, -2)$.
        feedback: >
          $\tfrac{1}{2}(243) + \tfrac{1}{2}(-1) = 121$. The second coordinate is
          $243 + 1 = 244$, and multiplying out confirms it: $A^{4}$ has first
          column $(41, 80)$, and $A(41, 80) = (121, 244)$.
      - ask: >
          For large $k$, what is the ratio of the second coordinate of
          $A^{k}(1, 0)$ to the first?
        expects: "2"
        feedback: >
          The $3^{k}$ piece swamps the $(-1)^{k}$ piece, so $A^{k}(1, 0)$ lines
          up with $(1, 2)$: ratio $2$. The long run is read off the eigenvalue
          of largest size and its eigenvector.
      - part: Reading the long run, and where it fails
        ask: >
          Scale the model down: $B = A/3$, with eigenvalues $1$ and $-1/3$. What
          does $B^{k}$ do as $k$ grows?
        choices:
          - text: >
              Goes to the zero matrix: dividing by $3$ makes it shrink.
            feedback: >
              The eigenvalue $1$ does not shrink: $B^{k}(1, 2) = (1, 2)$ for
              every $k$. Only $|\lambda| < 1$ for *every* eigenvalue sends
              $B^{k}$ to $0$.
          - text: >
              Converges to a matrix that sends every input onto the line through
              $(1, 2)$.
            correct: true
            feedback: >
              $B^{k} = P\,\operatorname{diag}(1, (-1/3)^{k})P^{-1} \to
              P\,\operatorname{diag}(1, 0)P^{-1}$: the $(1, 2)$ piece survives
              and the other dies. $(1, 0)$ settles at $\tfrac{1}{2}(1, 2)$.
          - text: >
              Oscillates forever, because of the negative eigenvalue.
            feedback: >
              $(-1/3)^{k}$ alternates in sign but shrinks to $0$. Oscillation
              persists only for an eigenvalue of size at least $1$.
        feedback: >
          $A^{k} \to 0$ exactly when every $|\lambda| < 1$. An eigenvalue of
          exactly $1$, with all the others below $1$ in size, gives convergence
          onto its eigendirection — the long-run behaviour of every such linear
          update.
      - ask: >
          $S$ has rows $(2, 1)$ and $(0, 2)$, with the eigenvalue $2$ twice.
          Does $S^{k} = PD^{k}P^{-1}$ work?
        choices:
          - text: >
              Yes, with $D = 2I$, giving $S^{k} = 2^{k}I$.
            feedback: >
              $S^{2}$ has rows $(4, 4)$ and $(0, 4)$, not $4I$. If
              $S = P(2I)P^{-1}$ then $S = 2I$, which it is not.
          - text: >
              No: $S$ has only one eigendirection, $(1, 0)$, so no invertible
              $P$ of eigenvectors exists.
            correct: true
            feedback: >
              $S - 2I$ has rows $(0, 1)$ and $(0, 0)$, killing only multiples
              of $(1, 0)$. In fact $S^{k}$ has rows $(2^{k}, k2^{k-1})$ and
              $(0, 2^{k})$ — a factor $k$ no diagonal matrix can produce.
          - text: >
              Yes, after normalizing the eigenvector to length $1$.
            feedback: >
              Normalizing does not create a second direction. Two independent
              eigenvectors are needed, and $S$ has one.
        feedback: >
          Diagonalization needs a full set of independent eigenvectors. A
          repeated eigenvalue with a deficient eigenspace needs Jordan form.
  - node: quant-tools.linear-algebra.fibonacci-matrix
    hook: >
      This is the pattern behind every "closed form for a linear recurrence"
      question — Fibonacci is just the cleanest instance, reducing to a
      $2\times2$ eigenvalue computation you already know cold.
    explanation: >
      Turning a scalar recurrence into a matrix power is the reusable move,
      more than Fibonacci itself: any recurrence expressible as (next state)
      $=A\cdot$(current state) becomes, after $n$ steps, (state after $n$
      steps) $=A^{n}\cdot$(initial state) — diagonalization then gives a
      closed form for any such recurrence, not just this one.

      The golden ratio falls out exactly the way any $2\times2$ eigenvalue
      does — trace $1$, determinant $-1$, quadratic formula — with no
      special theory involved. The two roots $\varphi\approx1.618$ and
      $\psi\approx-0.618$ have $|\psi|<1$, which is what makes $\psi^{n}$
      negligible for large $n$: $F_n$ tracks $\varphi^{n}/\sqrt5$ almost
      exactly, and $F_{n+1}/F_n\to\varphi$ is just dominant-eigenvalue
      behaviour, from diagonalization, applied here.

      Cassini's identity is a one-line bonus once thinking in determinants
      rather than recurrences: $\det(A^{n})=(\det A)^{n}$ always, and
      reading the left side off the entries of $A^n$ gives
      $F_{n+1}F_{n-1}-F_n^{2}$ directly.
    worked: >
      For $n=8$: $A^{2}$ has rows $(2,1)$ and $(1,1)$; squaring,
      $A^{4}=(A^{2})^{2}$ has rows $(5,3)$ and $(3,2)$; squaring again,
      $A^{8}=(A^{4})^{2}$ has rows $(34,21)$ and $(21,13)$. Reading the
      $(1,2)$ entry, $F_8=21$, matching Binet's formula since
      $\varphi^{8}\approx46.979$ and $\psi^{8}\approx0.021$ give
      $(46.979-0.021)/\sqrt5\approx21$.
    interview: >
      "Find a closed form for $F_n$" or "solve this linear recurrence" is
      answered by writing the state as a matrix power and diagonalizing —
      say the matrix and its eigenvalues immediately rather than guessing a
      pattern from small cases. A fast follow-up is $F_{n+1}/F_n\to\varphi$,
      which should come straight out of the dominant eigenvalue, not a
      separate memorized fact.
    pitfalls: >
      Reading off the wrong entry of $A^{n}$ for $F_n$ versus $F_{n+1}$.
      Assuming Cassini's identity needs induction — it is one line from
      $\det(A^{n})=(\det A)^{n}$.
    recap: >
      Writing the Fibonacci recursion as a matrix power turns Binet's
      formula, the golden-ratio growth rate, and Cassini's identity into
      three corollaries of diagonalizing one $2\times2$ matrix.
    dialogue:
      - part: A recurrence as a matrix
        teach: >
          The interviewer asks for $F_{100}$, with $F_0 = 0$, $F_1 = 1$ and
          $F_{n+1} = F_n + F_{n-1}$ — without $99$ additions — and for how fast
          $F_n$ grows. Track the pair $(F_n, F_{n-1})$: each step should be one
          matrix multiplication.
      - ask: >
          Which matrix sends $(F_n, F_{n-1})$ to $(F_{n+1}, F_n)$?
        choices:
          - text: >
              Rows $(0, 1)$ and $(1, 1)$
            feedback: >
              That sends $(F_n, F_{n-1})$ to $(F_{n-1}, F_n + F_{n-1})$: the right
              numbers in the wrong slots. The new first entry should be the sum.
          - text: >
              Rows $(1, 1)$ and $(1, 0)$
            correct: true
            feedback: >
              Row $1$ adds the pair, giving $F_{n+1}$; row $2$ copies $F_n$ down.
          - text: >
              Rows $(1, 0)$ and $(1, 1)$
            feedback: >
              That keeps $F_n$ in the first slot and puts the sum second, so the
              pair never moves forward.
        feedback: >
          With $A$ the matrix with rows $(1, 1)$ and $(1, 0)$, starting from
          $(F_1, F_0) = (1, 0)$ gives $A^{n}(1, 0) = (F_{n+1}, F_n)$, and in fact
          $A^{n}$ has rows $(F_{n+1}, F_n)$ and $(F_n, F_{n-1})$.
      - ask: >
          $A^{6}$ has rows $(13, 8)$ and $(8, 5)$. Square it. What is the
          $(1, 2)$ entry of $A^{12}$?
        expects: "144"
        feedback: >
          Row $(13, 8)$ against column $(8, 5)$: $104 + 40 = 144$. So
          $F_{12} = 144$, from one $2 \times 2$ product.
      - ask: >
          Starting from $A$, how many squarings reach $A^{64}$?
        expects: "6"
        feedback: >
          $A^{2}, A^{4}, A^{8}, A^{16}, A^{32}, A^{64}$: six. Any $A^{n}$ takes
          about $\log_{2} n$ squarings plus a few extra products, so $F_{100}$
          needs fewer than a dozen $2 \times 2$ multiplications.
      - reflect: >
          Squaring is fast, but it still gives no formula for $F_n$ and no
          growth rate. What would you need to know about $A$ to write $A^{n}$
          in closed form, and what equation gives it here?
        hint: >
          What makes powers of a matrix easy?
        answer: >
          Its eigenvalues and eigenvectors. If $A = PDP^{-1}$ then
          $A^{n} = PD^{n}P^{-1}$, and every entry of $A^{n}$ is a fixed
          combination of $\lambda_1^{n}$ and $\lambda_2^{n}$. Here
          $\det(A - \lambda I) = (1 - \lambda)(-\lambda) - 1 =
          \lambda^{2} - \lambda - 1$, so the eigenvalues solve
          $\lambda^{2} = \lambda + 1$ — the recurrence itself, with $\lambda$
          in place of $F$.
      - part: Golden ratio, from the characteristic polynomial
        ask: >
          What is the larger root of $\lambda^{2} - \lambda - 1 = 0$, to three
          decimal places?
        expects: "1.618"
        tolerance: 0.001
        feedback: >
          $\lambda = (1 \pm \sqrt{5})/2$, so $\varphi = (1 + \sqrt{5})/2
          \approx 1.618$ and $\psi = (1 - \sqrt{5})/2 \approx -0.618$. Two
          distinct eigenvalues, so $A$ is diagonalizable.
      - ask: >
          What is the product $\varphi\psi$?
        expects: "-1"
        hint: >
          Multiply out $(1 + \sqrt{5})(1 - \sqrt{5})$, or read the constant term.
        feedback: >
          $(1 - 5)/4 = -1$, the constant term of $\lambda^{2} - \lambda - 1$. So
          $\psi = -1/\varphi$, and $|\psi| < 1$.
      - teach: >
          Diagonalizing and reading the $(1, 2)$ entry of $PD^{n}P^{-1}$ gives
          Binet's formula, $F_n = (\varphi^{n} - \psi^{n})/\sqrt{5}$. Taking
          determinants of $A^{n}$ gives Cassini's identity,
          $F_{n+1}F_{n-1} - F_n^{2} = (\det A)^{n} = (-1)^{n}$.
      - ask: >
          Why is $F_n$ always the nearest integer to $\varphi^{n}/\sqrt{5}$?
        choices:
          - text: >
              Because $\psi^{n}/\sqrt{5}$ is less than $1/2$ in size for every
              $n \ge 0$.
            correct: true
            feedback: >
              $|\psi| < 1$, so $|\psi^{n}/\sqrt{5}| \le 1/\sqrt{5} \approx 0.447 <
              0.5$. Dropping it moves the exact value by less than half.
          - text: >
              Because $\psi^{n}$ is negative, so it always rounds up.
            feedback: >
              $\psi$ is negative, so $\psi^{n}$ alternates in sign: positive for
              even $n$. What matters is its size, not its sign.
          - text: >
              Because $\varphi$ is irrational.
            feedback: >
              Irrationality says nothing about how close $\varphi^{n}/\sqrt{5}$
              is to an integer. The small eigenvalue is what makes it close.
        feedback: >
          The dominant eigenvalue gives the growth and the other gives a
          shrinking, alternating correction: $F_{n+1}/F_n \to \varphi$, so each
          term is about $1.618$ times the last.
      - part: Any linear recurrence
        ask: >
          A different sequence satisfies $a_{n+1} = a_n + 2a_{n-1}$. Its matrix
          has rows $(1, 2)$ and $(1, 0)$. For generic starting values, by what
          factor does $a_n$ grow each step in the long run?
        expects: "2"
        hint: >
          The characteristic polynomial is $\lambda^{2} - \lambda - 2$.
        feedback: >
          $\lambda^{2} - \lambda - 2 = (\lambda - 2)(\lambda + 1)$, so
          $a_n = c_12^{n} + c_2(-1)^{n}$ and the $2^{n}$ term dominates unless
          $c_1 = 0$. Every linear recurrence is a matrix power, and its growth
          rate is the largest eigenvalue in size.
  - node: quant-tools.linear-algebra.matrix-square-root
    hook: >
      Generating correlated random draws from independent noise is a
      constant simulation task, and the entire method is one factorization —
      Cholesky — applied to whatever covariance matrix you're handed.
    explanation: >
      The eigenvalue square root $A^{1/2}=Q\Lambda^{1/2}Q^{T}$ is the
      conceptually clean answer — it exists because PSD guarantees every
      $\lambda_i\ge0$, so $\sqrt{\lambda_i}$ is real — but it costs a full
      eigendecomposition, expensive in practice.

      Cholesky is the practical substitute, trading "any square root" for
      one specific triangular one: because $A$ is symmetric, $L$'s
      lower-triangular entries can be found one at a time, top-left down,
      each solved from a single equation involving only previously found
      entries — cheap, and unique once the diagonal is required positive.

      The simulation use is the point of learning this: if $z$ has
      independent, unit-variance entries, then $Lz$ has covariance
      $\mathbb{E}[(Lz)(Lz)^{T}] = L\,\mathbb{E}[zz^{T}]\,L^{T} = LL^{T} = A$
      — Cholesky turns a target covariance matrix directly into the linear
      transform manufacturing it, and the factorization failing partway (a
      negative number under a square root) is itself the diagnostic that
      the input wasn't PSD.
    worked: >
      Take the correlation matrix with rows $(1,0.8)$ and $(0.8,1)$. Then
      $L_{11}=\sqrt1=1$, $L_{21}=0.8/L_{11}=0.8$, and
      $L_{22}=\sqrt{1-0.8^{2}}=\sqrt{0.36}=0.6$, so $L$ has rows $(1,0)$ and
      $(0.8,0.6)$. Checking $LL^{T}$: $(2,2)$ entry is $0.64+0.36=1$ and
      $(2,1)$ entry is $0.8$ — reproducing the original matrix.
    interview: >
      "How would you simulate two variables with correlation $0.8$ from a
      random-normal generator" is answered by writing down exactly this $L$
      and applying it to independent draws — be ready to explain why
      $LL^{T}=A$ makes it work. A common follow-up asks what goes wrong if
      the input "correlation matrix" isn't actually valid, listening for
      "the square root under $L_{22}$ goes negative."
    pitfalls: >
      Applying Cholesky to a matrix that isn't PSD and being surprised by a
      negative number under a square root — that failure is informative,
      not a bug. Forgetting the factorization is unique only when positive
      definite; a singular PSD matrix still factors, but $L$ isn't unique.
    recap: >
      Cholesky writes any PSD matrix as $LL^{T}$ with $L$ lower triangular,
      and applying $L$ to independent unit-variance noise is the standard
      way to manufacture draws with a prescribed covariance.
    dialogue:
      - part: Building correlated draws by hand
        teach: >
          You must simulate two returns with $\operatorname{Var}(X_1) = 4$,
          $\operatorname{Var}(X_2) = 5$ and $\operatorname{Cov}(X_1, X_2) = 2$.
          Your generator gives independent $z_1, z_2$ with mean $0$ and variance
          $1$. Try $X_1 = az_1$ and $X_2 = bz_1 + cz_2$, with $a, c > 0$.
      - ask: >
          $\operatorname{Var}(X_1) = a^{2}$ must be $4$. What is $a$?
        expects: "2"
        feedback: >
          $a = 2$, taking the positive root.
      - ask: >
          $\operatorname{Cov}(X_1, X_2) = ab$, since $z_1$ and $z_2$ are
          uncorrelated. It must be $2$. What is $b$?
        expects: "1"
        feedback: >
          $2b = 2$, so $b = 1$. Only the shared $z_1$ contributes to the
          covariance.
      - ask: >
          $\operatorname{Var}(X_2) = b^{2} + c^{2}$ must be $5$. What is $c$?
        expects: "2"
        feedback: >
          $1 + c^{2} = 5$, so $c = 2$. Your recipe is $X = Lz$ with $L$ lower
          triangular, rows $(2, 0)$ and $(1, 2)$.
      - reflect: >
          In matrix terms, what is the covariance matrix of $Lz$ when $z$ has
          covariance $I$ — and what were your three equations really solving?
          Why did they come out one unknown at a time?
        hint: >
          $\operatorname{Cov}(Lz)$ is $\mathbb{E}[(Lz)(Lz)^{T}]$.
        answer: >
          $\mathbb{E}[Lzz^{T}L^{T}] = L\,I\,L^{T} = LL^{T}$, so the three
          equations were the entries of $LL^{T} = \Sigma$. Because $L$ is
          triangular, the first entry involves only $a$, the next only $a$ and
          $b$, the last adds $c$: each equation introduces one new unknown,
          solved by a division or a square root.
      - part: The Cholesky factor
        teach: >
          A positive definite $\Sigma$ factors uniquely as $LL^{T}$ with $L$
          lower triangular and positive diagonal — the Cholesky factorization,
          computed exactly as you just did, column by column. Then $Lz$ has
          covariance $\Sigma$, the standard way to manufacture correlated
          draws. Separately, a symmetric PSD $A = Q\Lambda Q^{T}$ has a unique
          PSD square root $A^{1/2} = Q\Lambda^{1/2}Q^{T}$.
      - ask: >
          Add a third asset: $\Sigma$ has rows $(4, 2, 2)$, $(2, 5, 3)$ and
          $(2, 3, 6)$. The first two rows of $L$ are as before, and its third row
          starts $L_{31} = 1$, from $2 \cdot L_{31} = 2$. The $(3, 2)$ entry of
          $LL^{T}$ says $1 \cdot 1 + 2L_{32} = 3$. What is $L_{32}$?
        expects: "1"
        feedback: >
          $2L_{32} = 2$, so $L_{32} = 1$. Row $3$ of $L$ against row $2$ must
          reproduce the covariance $3$.
      - ask: >
          The $(3, 3)$ entry says $L_{31}^{2} + L_{32}^{2} + L_{33}^{2} = 6$.
          What is $L_{33}$?
        expects: "2"
        feedback: >
          $1 + 1 + L_{33}^{2} = 6$, so $L_{33} = 2$, and $L$ has rows
          $(2, 0, 0)$, $(1, 2, 0)$, $(1, 1, 2)$. Each diagonal entry is the
          square root of what the earlier columns leave of that variance.
      - ask: >
          Is your $L$, rows $(2, 0)$ and $(1, 2)$, the square root $\Sigma^{1/2}$
          of the two-asset $\Sigma$?
        choices:
          - text: >
              Yes: $LL^{T} = \Sigma$, which is what a square root means.
            feedback: >
              $\Sigma^{1/2}$ means a PSD matrix whose *square* is $\Sigma$, and
              it is symmetric. $L$ is not symmetric, and
              $L^{2}$ has rows $(4, 0)$ and $(4, 4)$, not $\Sigma$.
          - text: >
              No: $\Sigma^{1/2}$ is the symmetric PSD matrix with
              $\Sigma^{1/2}\Sigma^{1/2} = \Sigma$; $L$ is a different factor.
            correct: true
            feedback: >
              Both satisfy $MM^{T} = \Sigma$, so either one turns independent
              noise into covariance $\Sigma$. Cholesky is cheaper, needing no
              eigenvectors.
          - text: >
              No: $\Sigma$ has no square root, because it is not diagonal.
            feedback: >
              Every symmetric PSD matrix has one, $Q\Lambda^{1/2}Q^{T}$, built
              from its eigendecomposition. Diagonal matrices are just the case
              where $Q = I$.
        feedback: >
          Many matrices $M$ satisfy $MM^{T} = \Sigma$ — any $M$ times an
          orthogonal matrix does. Cholesky picks the triangular one, the
          square root picks the symmetric one.
      - part: When the factorization refuses
        ask: >
          A desk asks for draws with variances $4$ and $4$ and covariance $6$.
          Run the same recipe: $a = 2$, $b = 3$. What number would you need to
          take the square root of for $c$?
        expects: "-5"
        feedback: >
          $9 + c^{2} = 4$ gives $c^{2} = -5$. No real $c$ exists.
      - ask: >
          What does that failure tell the desk?
        choices:
          - text: >
              Cholesky is numerically unstable here; try the symmetric square
              root instead.
            feedback: >
              The symmetric square root needs nonnegative eigenvalues, and this
              matrix has eigenvalues $10$ and $-2$. Every factorization fails,
              because no factor exists.
          - text: >
              The input is not a valid covariance matrix: no random variables
              have it.
            correct: true
            feedback: >
              The covariance $6$ exceeds $\sqrt{4 \cdot 4} = 4$, so the matrix is
              not PSD: the hedge $X_1 - X_2$ would have variance
              $4 - 12 + 4 = -4$.
          - text: >
              Take $c = 0$ and accept a small error.
            feedback: >
              Then $\operatorname{Var}(X_2) = 9$, not $4$ — no small error. The
              request itself is impossible.
        feedback: >
          A failed Cholesky is a diagnosis, not a bug: it is the cheapest test
          that a hand-built covariance matrix is invalid.
