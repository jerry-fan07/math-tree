unit: quant-tools.linear-algebra
opening: >
  Linear algebra is the language quant desks use for portfolios, factor
  models and risk: a covariance matrix, a regression, a Markov transition
  matrix are all just matrices, and most interview questions about them
  reduce to matrix algebra, eigenstructure, or projection. This unit builds
  the toolkit in the order it compounds: matrix multiplication, rank and the
  solvability of $Ax=b$, determinant and trace, the equivalent faces of
  invertibility, eigenvalues and eigenvectors with the trace/determinant
  shortcut for finding them, orthogonality and the spectral theorem for
  symmetric matrices, quadratic forms and positive (semi)definiteness — the
  property that makes covariance matrices well-behaved — orthogonal
  projection and least squares, PCA as an eigendecomposition, and matrix
  powers via diagonalization. By the end you should be able to read
  eigenvalues off trace and determinant in your head, recognize a PSD matrix
  on sight, and see a regression, a Markov chain, and PCA as the same
  computation wearing different clothes.
lessons:
  - node: quant-tools.linear-algebra.matrix-algebra
    hook: >
      Every later result in this unit — determinants, eigenvalues,
      projections — is built out of multiplying, transposing and inverting
      matrices, so having "order reverses" automatic for both $(AB)^{T}$ and
      $(AB)^{-1}$ is worth owning before anything else starts.
    explanation: >
      $Ax$ is a linear combination of the columns of $A$, weighted by the
      entries of $x$ — so $A$ is completely determined by where it sends the
      coordinate vectors, and $AB$ means "first apply $B$, then apply $A$":
      composition of functions, read right to left. That composition view is
      why $AB \ne BA$ in general is not a technicality to memorize but a fact
      about function composition — doing $B$ then $A$ is a different map from
      doing $A$ then $B$.

      Transpose and inverse both "undo" a composition, and both reverse
      order for the same reason: to undo "first $B$, then $A$" you must undo
      $A$ first, then $B$. That symmetry is why $(AB)^{T}=B^{T}A^{T}$ and
      $(AB)^{-1}=B^{-1}A^{-1}$ have identical shape, and it is the cheapest
      sanity check available on any algebraic manipulation involving a
      product — if you didn't reverse the order, check again.

      Invertibility is reversibility: $A^{-1}$ exists exactly when the map
      $x \mapsto Ax$ can be undone by some other linear map. The $2\times2$
      formula is the one closed form worth having memorized cold, since the
      rest of the unit either uses it directly or generalizes it.
    worked: >
      Let $A$ have rows $(2,3)$ and $(1,4)$, and $B$ have rows $(0,1)$ and
      $(1,0)$. Then $AB$ has rows $(2\cdot0+3\cdot1,\,2\cdot1+3\cdot0) =
      (3,2)$ and $(1\cdot0+4\cdot1,\,1\cdot1+4\cdot0) = (4,1)$. For the
      inverse of $A$: $\det A = 2\cdot4-3\cdot1 = 5$, so $A^{-1}$ is
      $\tfrac{1}{5}$ times the matrix with rows $(4,-3)$ and $(-1,2)$, i.e.
      $A^{-1}$ has rows $(4/5,-3/5)$ and $(-1/5,2/5)$.
    interview: >
      Expect to multiply small matrices mentally and to be asked why
      $(AB)^{T} \ne A^{T}B^{T}$ in general — the interviewer wants the
      composition-reversal reasoning, not just the rule recited. A classic
      trap question is "does $AB=BA$ here" for a specific pair chosen to
      fail.
    pitfalls: >
      Assuming two matrices commute because their product looks "symmetric"
      by eye. Forgetting to reverse order when transposing or inverting a
      product — writing $(AB)^{-1}=A^{-1}B^{-1}$. Applying the $2\times2$
      inverse formula without first checking $\det A \ne 0$.
    recap: >
      Multiplying composes linear maps; transposing and inverting each undo
      that composition and so each reverse its order.
    steps:
      - teach: >
          Multiplying $Ax$ produces a linear combination of $A$'s columns,
          weighted by the entries of $x$. So $AB$ means *first* apply $B$,
          *then* apply $A$ — composition of functions, read right to left,
          not an entrywise operation.
      - teach: >
          $AB \ne BA$ in general because composing right-to-left is not the
          same as composing left-to-right — a fact about functions, not an
          arithmetic quirk. Transpose and inverse both reverse the order of a
          product for the same reason: undoing "first $B$, then $A$" means
          undoing $A$ first.
      - ask: >
          $A$ and $B$ are square and invertible. Which expression equals
          $(AB)^{-1}$?
        choices:
          - text: >
              $A^{-1}B^{-1}$
            feedback: >
              This undoes $A$ before $B$, which is backwards: to reverse
              "first $B$, then $A$," you must reverse $A$ first.
          - text: >
              $B^{-1}A^{-1}$
            correct: true
            feedback: >
              Reversing a composition reverses its order: undo $A$ first,
              then $B$, exactly mirroring $(AB)^{T}=B^{T}A^{T}$.
          - text: >
              $AB$
            feedback: >
              That's not an inverse at all — it's the original product back
              again.
          - text: >
              $BA$
            feedback: >
              Reordering the product doesn't invert it; $(AB)^{-1}$ must
              satisfy $(AB)(AB)^{-1}=I$, which $BA$ does not in general.
        feedback: >
          Order reverses: $(AB)^{-1}=B^{-1}A^{-1}$, exactly as
          $(AB)^{T}=B^{T}A^{T}$ does — both undo the composition by undoing
          $A$ first.
      - teach: >
          For a $2\times2$ matrix with rows $(a,b)$ and $(c,d)$, the inverse
          is $\frac{1}{ad-bc}$ times the matrix with rows $(d,-b)$ and
          $(-c,a)$ — swap the diagonal, negate the off-diagonal, divide by
          the determinant. It exists only when $ad-bc \ne 0$.
      - ask: >
          Let $C$ have rows $(1,2)$ and $(3,1)$, and $D$ have rows $(2,0)$
          and $(1,1)$. What is the $(1,1)$ entry of $CD$?
        expects: "4"
        hint: >
          Dot the first row of $C$ against the first column of $D$.
        feedback: >
          $(CD)_{11} = 1\cdot2 + 2\cdot1 = 4$ — row $1$ of $C$ dotted with
          column $1$ of $D$.
      - ask: >
          Let $E$ have rows $(3,2)$ and $(1,4)$. What is the $(1,1)$ entry of
          $E^{-1}$?
        expects: "2/5"
        hint: >
          Find $\det E$ first, then apply the swap-negate-divide recipe to
          the $(1,1)$ position.
        feedback: >
          $\det E = 3\cdot4-2\cdot1=10$, so $E^{-1}=\frac{1}{10}$ times the
          matrix with rows $(4,-2)$ and $(-1,3)$; the $(1,1)$ entry is
          $4/10=2/5$.
      - teach: >
          The common slip isn't in the formula — it's forgetting to check
          $\det A \ne 0$ before applying it, or writing
          $(AB)^{-1}=A^{-1}B^{-1}$ without reversing the order. A product
          that merely *looks* symmetric need not commute.
      - teach: >
          Every later computation in this unit — determinants, eigenvalues,
          projections — is built from these three operations, so having
          "order reverses" automatic for both transpose and inverse is worth
          carrying forward rather than re-deriving each time.

  - node: quant-tools.linear-algebra.rank-solvability
    hook: >
      "How many solutions does this system have" is answered before any
      elimination — it's always none, one, or infinitely many, and knowing
      why two solutions is impossible is a fast, free interview point.
    explanation: >
      Since $Ax$ is always a combination of $A$'s columns, the column space
      is nothing but the set of every possible output $Ax$, and rank counts
      how many of those columns point in genuinely new directions rather
      than repeating ones already covered. Solvability of $Ax=b$ is then
      just membership: $b$ must lie in that column space, or no combination
      of columns can produce it.

      The three-case classification follows from the shape of the solution
      set, not from casework. If a solution exists, the full solution set is
      one particular solution shifted by the null space — a subspace, which
      is either just $\{0\}$ (unique solution) or infinite (a line, plane,
      ...; never a finite set bigger than one point). That structural fact,
      not luck, is why "exactly two solutions" never happens for a real
      linear system.

      Rank-nullity is the bookkeeping behind the dimension count:
      $n - \operatorname{rank}(A)$ free parameters remain once
      $\operatorname{rank}(A)$ independent constraints have been used up.
    worked: >
      Take $A$ with rows $(1,2,1)$ and $(2,4,2)$ — row $2$ is twice row $1$,
      so $\operatorname{rank}(A)=1$. With $b=(3,6)$: since $6=2\cdot3$, the
      augmented matrix has the same rank $1$, so the system is consistent,
      and the solution set is $\{(x,y,z): x+2y+z=3\}$, a $2$-dimensional
      plane ($n-\operatorname{rank}(A)=3-1=2$). With $b=(3,7)$ instead,
      $7 \ne 2\cdot3$, the augmented rank jumps to $2 \ne \operatorname{rank}
      (A)$, and there is no solution at all.
    interview: >
      "How many solutions can a linear system have" is fished for the
      "$0$, $1$, or infinity, never two" answer. A system with visibly
      proportional rows or columns is often handed over specifically to see
      if you spot the rank deficiency instead of grinding through
      elimination.
    pitfalls: >
      Assuming a square system automatically has a unique solution — it
      fails whenever $\det A = 0$. Checking only $\operatorname{rank}(A)$
      for consistency and forgetting the augmented matrix $[A\mid b]$ must
      match it. Treating "infinitely many solutions" as always a line —
      the family has dimension $n-\operatorname{rank}(A)$, which can exceed
      $1$.
    recap: >
      Rank counts independent directions in $A$, and it alone decides
      whether $Ax=b$ has zero, one, or an
      $(n-\operatorname{rank}(A))$-dimensional family of solutions.
    steps:
      - teach: >
          Since $Ax$ is always a combination of $A$'s columns, the column
          space is nothing but the set of every possible output $Ax$, and
          rank counts how many columns point in genuinely new directions
          rather than repeating ones already covered.
      - teach: >
          Solvability of $Ax=b$ is membership: $b$ must lie in that column
          space. If it does, the full solution set is one particular
          solution shifted by the null space — a subspace, so either just
          $\{0\}$ (unique) or infinite; never a finite set bigger than one
          point.
      - ask: >
          Why can a real linear system never have exactly two solutions?
        choices:
          - text: >
              Because the null space is always $\{0\}$
            feedback: >
              The null space is $\{0\}$ only when $A$ has full column rank —
              that's the unique-solution case, not a general fact.
          - text: >
              Because the solution set is a translate of the null space, a
              subspace, and a subspace is either a single point or infinite
            correct: true
            feedback: >
              A subspace can never contain exactly two points — it's closed
              under scaling, so a second point forces every scalar multiple
              in too.
          - text: >
              Because $\operatorname{rank}(A)$ is always odd
            feedback: >
              Rank has no parity restriction at all.
          - text: >
              Because two equations can never produce two different answers
            feedback: >
              That restates the question rather than answering it, and it
              isn't even true of nonlinear systems.
        feedback: >
          The solution set, when nonempty, is a particular solution plus a
          subspace — and a subspace is either $\{0\}$ or infinite, so "two"
          is never on the menu.
      - teach: >
          Rank-nullity is the bookkeeping behind the dimension count:
          $n - \operatorname{rank}(A)$ free parameters remain once
          $\operatorname{rank}(A)$ independent constraints have been used up.
      - ask: >
          $A$ has rows $(1,0,1)$, $(0,1,1)$, $(1,1,2)$. What is
          $\operatorname{rank}(A)$?
        expects: "2"
        hint: >
          Look for a row that's a combination of the other two.
        feedback: >
          Row $3$ is row $1$ plus row $2$, so only two rows are independent:
          $\operatorname{rank}(A)=2$.
      - teach: >
          Assuming a square system automatically has a unique solution is a
          standard trap — it fails whenever $\det A = 0$. And "infinitely
          many solutions" is not always a line: the family has dimension
          $n-\operatorname{rank}(A)$, which can exceed $1$.
      - ask: >
          For the same $A$ and $b=(2,3,5)$, the system is consistent. What
          is the dimension of the solution set?
        expects: "1"
        hint: >
          Use $n-\operatorname{rank}(A)$ with $n=3$.
        feedback: >
          $b_3=b_1+b_2$, so $b$ lies in the column space and the system is
          consistent; with $\operatorname{rank}(A)=2$, the solution family
          has dimension $3-2=1$ — a line, not a point.
      - teach: >
          Rank alone decides which of the three cases $Ax=b$ falls into,
          before any elimination is run — checking it first is what turns a
          "how many solutions" question into a one-line answer.

  - node: quant-tools.linear-algebra.determinant-trace
    hook: >
      "$\det A=0$" is the fastest mental invertibility check there is, and
      reading it as "the map crushed some direction to zero volume" — not as
      an opaque formula — is what lets you see it coming before you compute.
    explanation: >
      The determinant is pinned down by three simple requirements (linear in
      each column, sign-flipping under a column swap, $\det I=1$), and for
      $2\times2$ this collapses to $ad-bc$: literally the signed area of the
      parallelogram spanned by the two columns. If the columns are parallel
      — one a scalar multiple of the other — that parallelogram degenerates
      to a line segment, area zero, so $\det A=0$ exactly matches being
      rank-deficient: less than full rank means the columns no longer span
      a full-dimensional shape.

      Trace is unrelated to that volume story but has its own invariance:
      $\operatorname{tr}(AB)=\operatorname{tr}(BA)$ even though $AB\ne BA$
      in general, which is why $\operatorname{tr}A$ is unchanged under
      $A \mapsto P^{-1}AP$ — a fact that will matter once eigenvalues are on
      the table, since a change of basis shouldn't change what a matrix
      "truly" does.
    worked: >
      For $A$ with rows $(3,1)$ and $(2,4)$: $\det A = 3\cdot4-1\cdot2=10$
      and $\operatorname{tr}A=3+4=7$ — the unit square, area $1$, maps to a
      parallelogram of area $10$. Contrast with $A'$ having rows $(1,3)$ and
      $(2,6)$: the columns are $(1,2)$ and $(3,6)$, proportional, so
      $\det A' = 1\cdot6-3\cdot2=0$ and the image collapses to a line.
    interview: >
      Expect a quick $2\times2$ or $3\times3$ computation, but also "what
      does a zero determinant tell you about the columns geometrically" —
      the wanted answer is "they no longer span full-dimensional volume,"
      not just "the matrix is singular."
    pitfalls: >
      Sign slips in $ad-bc$ versus $bc-ad$. Assuming a large or small trace
      says anything about invertibility — it doesn't; trace can be $0$ for
      an invertible matrix. Reading $\operatorname{tr}(AB)=
      \operatorname{tr}(BA)$ as $\operatorname{tr}A\cdot\operatorname{tr}B=
      \operatorname{tr}(AB)$, which is false.
    recap: >
      The determinant is signed volume scaling, zero exactly when a
      direction collapses; the trace is the diagonal sum, already invariant
      under change of basis.
    steps:
      - teach: >
          For $2\times2$, $\det A = ad-bc$ is literally the signed area of
          the parallelogram spanned by the two columns. If the columns are
          parallel, that parallelogram degenerates to a line segment — area
          zero.
      - teach: >
          That degeneration is exactly why $\det A=0$ matches being
          rank-deficient: less than full rank means the columns no longer
          span a full-dimensional shape, so the "volume" they enclose
          collapses to zero.
      - ask: >
          For $A$ with rows $(5,2)$ and $(3,4)$, what is $\det A$?
        expects: "14"
        hint: >
          Multiply the diagonal entries and subtract the product of the
          off-diagonal ones.
        feedback: >
          $\det A = 5\cdot4 - 2\cdot3 = 20-6=14$.
      - teach: >
          Trace is unrelated to the volume story but has its own invariance:
          $\operatorname{tr}(AB)=\operatorname{tr}(BA)$ even though
          $AB\ne BA$ in general, which is why $\operatorname{tr}A$ is
          unchanged under $A \mapsto P^{-1}AP$.
      - ask: >
          A $3\times3$ matrix has $\operatorname{tr}A=0$. What follows?
        choices:
          - text: >
              $A$ must be singular
            feedback: >
              Trace says nothing about invertibility — a trace-$0$ matrix
              can be invertible or singular.
          - text: >
              Nothing about invertibility can be concluded from the trace
              alone
            correct: true
            feedback: >
              Trace is the diagonal sum; determinant is the volume-scaling
              factor. They are separate invariants, and a small (even zero)
              trace has no bearing on whether $\det A=0$.
          - text: >
              $\det A = 0$ necessarily
            feedback: >
              This confuses the two invariants — trace vanishing doesn't
              force the determinant to vanish.
          - text: >
              Every diagonal entry of $A$ must be $0$
            feedback: >
              The diagonal entries only need to sum to $0$, not each equal
              $0$ — for example $1, -1, 0$.
        feedback: >
          Trace and determinant are independent invariants; only the
          determinant tells you about invertibility.
      - ask: >
          $A$ has rows $(2,4)$ and $(3,6)$. What is $\det A$?
        expects: "0"
        hint: >
          Check whether one column is a scalar multiple of the other before
          computing.
        feedback: >
          The columns are $(2,3)$ and $(4,6)=2\cdot(2,3)$ — proportional, so
          the parallelogram they span has zero area:
          $\det A = 2\cdot6-4\cdot3=0$.
      - teach: >
          The recurring slip is a sign error, $bc-ad$ instead of $ad-bc$, or
          reading $\operatorname{tr}(AB)=\operatorname{tr}(BA)$ as
          $\operatorname{tr}A\cdot\operatorname{tr}B=\operatorname{tr}(AB)$,
          which is false.
      - teach: >
          Read determinant and trace as two separate, cheap invariants —
          one tells you about volume collapse, the other is just the
          diagonal sum, invariant under change of basis — worth checking
          before reaching for elimination.

  - node: quant-tools.linear-algebra.determinant-properties
    hook: >
      "Elimination, then multiply the pivots" is the only determinant
      algorithm that scales past $3\times3$ by hand — knowing which row
      operations survive it is what turns a $4\times4$ determinant into a
      two-minute problem instead of a cofactor nightmare.
    explanation: >
      A triangular matrix's determinant being the product of its diagonal
      follows immediately from cofactor expansion: expanding along the first
      column (or row) of a triangular matrix, every term except the diagonal
      one multiplies a zero, so only the diagonal survives at each step. That
      single fact is what makes elimination an efficient determinant
      algorithm rather than just a way to solve systems.

      Track what each row operation does to the volume it represents: adding
      a multiple of one row to another shears the parallelepiped without
      changing its volume, so the determinant is unchanged; swapping two
      rows flips orientation, so the sign flips; scaling a row by $c$ stretch
      es that one edge by $c$, so the determinant scales by $c$ — exactly the
      alternating, multilinear properties the determinant was built from.

      Multiplicativity, $\det(AB)=\det A\cdot\det B$, is composing two
      volume-scaling factors, and $\det(A^{-1})=1/\det A$ follows since
      composing $A$ with $A^{-1}$ scales volume by $1$. $\det(A+B)$ has no
      such formula because the determinant is linear in one column at a
      time, not in the whole matrix — adding matrices mixes columns from
      both.
    worked: >
      Compute $\det$ of $A$ with rows $(1,2,3)$, $(2,5,3)$, $(1,0,8)$ by
      elimination: $R_2 \to R_2-2R_1$ gives $(0,1,-3)$; $R_3 \to R_3-R_1$
      gives $(0,-2,5)$; then $R_3 \to R_3+2R_2$ gives $(0,0,-1)$. No swaps or
      scalings were used, so $\det A$ is the product of the resulting
      diagonal: $1\cdot1\cdot(-1) = -1$.
    interview: >
      Handed a $3\times3$ or $4\times4$ matrix, the interviewer is watching
      whether you reach for elimination instead of full cofactor expansion.
      "What's $\det(A+B)$ given $\det A$ and $\det B$" is a standard trap —
      the correct answer is that there is no such formula.
    pitfalls: >
      Forgetting to flip the sign on a row swap during elimination.
      Writing $\det(cA)=c\det A$ instead of $c^{n}\det A$ — every one of the
      $n$ rows gets scaled. Trying to derive $\det(A+B)$ from $\det A$ and
      $\det B$ alone.
    recap: >
      Elimination turns a determinant into "product of the pivots," with a
      sign flip per row swap and a factor per row scaling to track along the
      way.
    steps:
      - teach: >
          A triangular matrix's determinant is the product of its diagonal:
          expanding along the first column of a triangular matrix, every
          term except the diagonal one multiplies a zero, so only the
          diagonal survives at each step.
      - teach: >
          Track what each row operation does to volume: adding a multiple
          of one row to another shears without changing volume (determinant
          unchanged), swapping two rows flips orientation (sign flips), and
          scaling a row by $c$ stretches that edge by $c$ (determinant
          scales by $c$).
      - ask: >
          Using elimination with no row swaps, what is $\det$ of the matrix
          with rows $(2,1,1)$, $(4,3,3)$, $(2,1,4)$?
        expects: "6"
        hint: >
          Clear the first column with row operations that don't change the
          determinant, then read off the product of the diagonal.
        feedback: >
          $R_2 \to R_2-2R_1$ gives $(0,1,1)$; $R_3 \to R_3-R_1$ gives
          $(0,0,3)$. No swaps or scalings were used, so $\det A$ is the
          product of the diagonal: $2\cdot1\cdot3=6$.
      - teach: >
          Multiplicativity, $\det(AB)=\det A\cdot\det B$, is composing two
          volume-scaling factors, and $\det(A^{-1})=1/\det A$ follows since
          composing $A$ with $A^{-1}$ scales volume by $1$.
      - ask: >
          Given $\det A = 4$ and $\det B = 3$ for $3\times3$ matrices, what
          is $\det(A+B)$?
        choices:
          - text: >
              $7$
            feedback: >
              There is no additive formula for the determinant — it is
              linear in one column at a time, not in the whole matrix.
          - text: >
              $12$
            feedback: >
              That's $\det(AB)=\det A\cdot\det B$, not $\det(A+B)$.
          - text: >
              Cannot be determined from $\det A$ and $\det B$ alone
            correct: true
            feedback: >
              Adding matrices mixes columns from both, so no formula for
              $\det(A+B)$ exists in terms of $\det A$ and $\det B$ alone.
          - text: >
              $4/3$
            feedback: >
              That would only be relevant to a ratio like $\det(A)/\det(B)$,
              not a sum.
        feedback: >
          $\det(A+B)$ has no formula — determinant is column-by-column
          linear, and a sum mixes both matrices' columns together.
      - ask: >
          For a $3\times3$ matrix $A$ with $\det A = 5$, what is
          $\det(2A)$?
        expects: "40"
        hint: >
          Remember every one of the $n$ rows gets scaled by $c$.
        feedback: >
          $\det(cA)=c^{n}\det A$ for $n\times n$; here $n=3$, so
          $\det(2A)=2^{3}\cdot5=8\cdot5=40$.
      - teach: >
          The recurring slips are forgetting to flip the sign on a row swap
          during elimination, and writing $\det(cA)=c\det A$ instead of
          $c^{n}\det A$ — every one of the $n$ rows gets scaled.
      - teach: >
          Elimination turns a determinant into "product of the pivots,"
          with a sign flip per swap and a factor per scaling — the only
          algorithm that scales past $3\times3$ by hand.

  - node: quant-tools.linear-algebra.invertibility
    hook: >
      This is the node where an interviewer makes you name the same fact
      five different ways in one conversation — hesitating on any single
      equivalence reads as not actually seeing why they coincide.
    explanation: >
      All these conditions collapse to one because they're restatements of
      "$x \mapsto Ax$ is a bijection $\mathbb{R}^{n}\to\mathbb{R}^{n}$":
      injective is $\ker A=\{0\}$ (independent columns), surjective is the
      columns spanning $\mathbb{R}^{n}$ (full rank). For a square map,
      injective and surjective are the same property — a linear
      self-map that never merges two inputs automatically hits everything,
      and vice versa — which is special to the square case and is exactly
      why this long list of equivalences exists only here.

      The determinant enters through the volume story already built: less
      than full rank forces the column parallelepiped into a
      lower-dimensional set, zero volume, $\det A=0$ — the same collapse,
      just named differently.

      A practical footnote: a tiny nonzero determinant is not a
      reassurance. Determinant scales with the size of the entries, so it is
      not a normalized measure of "how close to singular" a matrix is —
      near-singular matrices amplify input error regardless of how small
      $|\det A|$ happens to be.
    worked: >
      Check $A$ with rows $(2,1)$ and $(1,3)$: $\det A = 6-1=5 \ne 0$, and
      the columns $(2,1)$, $(1,3)$ are not proportional, so $A$ is
      invertible. Confirm via the unique-solution test: solving $2x+y=5$,
      $x+3y=5$ gives $y=5-2x$, so $x+3(5-2x)=5 \Rightarrow -5x=-10
      \Rightarrow x=2,\,y=1$ — one solution, as $\det A\ne0$ predicted.
    interview: >
      "How do you check invertibility" wants the equivalences rattled off
      interchangeably, then usually a follow-up: "which would you actually
      compute for a $10\times10$ matrix" — testing that elimination-based
      rank, not cofactor determinants, is the practical answer at scale.
    pitfalls: >
      Treating "determinant nonzero" as a different, extra check on top of
      "full rank" rather than the same fact computed another way. Trusting a
      small nonzero determinant as evidence of good conditioning.
    recap: >
      For a square matrix, invertible, full rank, nonzero determinant,
      independent columns, and a unique solution to every $Ax=b$ are one
      fact in five costumes — check whichever is cheapest.
    steps:
      - teach: >
          All these conditions collapse to one because they're restatements
          of "$x \mapsto Ax$ is a bijection": injective is $\ker A=\{0\}$
          (independent columns), surjective is the columns spanning
          $\mathbb{R}^{n}$ (full rank) — and for a square map, injective and
          surjective are the same property.
      - teach: >
          The determinant enters through the volume story already built:
          less than full rank forces the column parallelepiped into a
          lower-dimensional set, zero volume, $\det A=0$ — the same
          collapse, just named differently.
      - ask: >
          Which of these is NOT equivalent to $A$ being invertible for a
          square matrix?
        choices:
          - text: >
              $\det A \ne 0$
            feedback: >
              This *is* equivalent to invertibility — it's the volume
              collapse condition.
          - text: >
              $A$'s columns are linearly independent
            feedback: >
              This *is* equivalent — dependent columns mean $\ker A \ne
              \{0\}$.
          - text: >
              $A$ has trace $\ne 0$
            correct: true
            feedback: >
              Trace has nothing to do with invertibility — a trace-$0$
              matrix can be invertible, and a nonzero-trace matrix can be
              singular.
          - text: >
              $\ker A = \{0\}$
            feedback: >
              This *is* equivalent — it's exactly the injective condition.
        feedback: >
          Trace is not on the equivalence list at all; the list is built
          entirely from injective/surjective restatements of $x\mapsto Ax$.
      - teach: >
          A practical footnote: a tiny nonzero determinant is not a
          reassurance. Determinant scales with the size of the entries, so
          it's not a normalized measure of "how close to singular" a matrix
          is.
      - ask: >
          $A$ has rows $(3,2)$ and $(6,4)$. What is $\det A$?
        expects: "0"
        hint: >
          Check whether the two columns are proportional.
        feedback: >
          The columns are $(3,6)$ and $(2,4)=\frac{2}{3}(3,6)$ — proportional,
          so $\det A=3\cdot4-2\cdot6=0$: singular, along with every other
          equivalence in the list failing together.
      - ask: >
          $A$ has rows $(1,2)$ and $(3,4)$, so $\det A = -2 \ne 0$. For how
          many $b\in\mathbb{R}^{2}$ does $Ax=b$ have exactly one solution?
        choices:
          - text: >
              Every $b$
            correct: true
            feedback: >
              $\det A \ne 0$ means $A$ is invertible, so $x=A^{-1}b$ is the
              unique solution regardless of which $b$ is chosen.
          - text: >
              Only $b=0$
            feedback: >
              $b=0$ always has the trivial solution, but invertibility
              guarantees a unique solution for *every* $b$, not just this
              one.
          - text: >
              It depends on $b$
            feedback: >
              It would depend on $b$ if $A$ were singular; here $\det A \ne
              0$ removes that dependence entirely.
          - text: >
              No $b$ has a unique solution
            feedback: >
              That's backwards — nonzero determinant is exactly the
              condition guaranteeing a unique solution always exists.
        feedback: >
          Once $\det A\ne0$, "unique solution for every $b$" is one of the
          equivalent faces of invertibility — no case-by-case check on $b$
          needed.
      - teach: >
          Treating "determinant nonzero" as a separate, extra check on top
          of "full rank" — rather than the same fact computed another way —
          is the recurring confusion here.
      - teach: >
          For a square matrix, invertible, full rank, nonzero determinant,
          independent columns, and unique solvability are one fact in five
          costumes — check whichever is cheapest for the matrix in front of
          you.

  - node: quant-tools.linear-algebra.eigen
    hook: >
      "Find the eigenvalues" is asked constantly not for the arithmetic but
      because setting up $\det(A-\lambda I)=0$ correctly, and reading what a
      repeated or complex root means, is the gate to PCA, Markov chains, and
      every stability question later.
    explanation: >
      Along a general vector, $Ax$ can point anywhere; along an eigenvector
      the map degenerates to pure scaling. Nearly everything you'll later
      want to know about a matrix's long-run or extremal behavior traces
      back to these special one-dimensional directions.

      The derivation is one line: $Av=\lambda v$ with $v\ne0$ rearranges to
      $(A-\lambda I)v=0$, a homogeneous system with a nonzero solution
      exactly when $A-\lambda I$ is singular. That's the same determinant
      test invertibility already uses, applied to $A-\lambda I$ instead of
      $A$, so $\det(A-\lambda I)=0$ is not a new idea, just the old one
      aimed at a shifted matrix.

      This characteristic polynomial has degree $n$, hence exactly $n$
      roots over $\mathbb{C}$ counted with multiplicity. Real matrices can
      have genuinely complex eigenvalues — a pure rotation has no real
      invariant direction at all — and a repeated root's eigenspace can be
      smaller than its multiplicity, a wrinkle that resurfaces when asking
      whether a matrix can be diagonalized.
    worked: >
      For $A$ with rows $(4,2)$ and $(3,-1)$: $\det(A-\lambda I) =
      (4-\lambda)(-1-\lambda)-6 = \lambda^{2}-3\lambda-10 =
      (\lambda-5)(\lambda+2)$, so $\lambda=5,-2$. For $\lambda=5$: $A-5I$
      has rows $(-1,2)$ and $(3,-6)$, giving eigenvector $(2,1)$. For
      $\lambda=-2$: $A+2I$ has rows $(6,2)$ and $(3,1)$, giving eigenvector
      $(1,-3)$.
    interview: >
      "Find the eigenvalues of this matrix" cold is standard. A common
      follow-up — "what if $A$ is a rotation" — fishes for the complex,
      no-real-eigendirection answer rather than a stalled computation.
    pitfalls: >
      Forgetting $v \ne 0$ is required — $v=0$ trivially satisfies the
      equation for any $\lambda$ but carries no information. Sign errors
      expanding $(a-\lambda)(d-\lambda)-bc$. Assuming a repeated eigenvalue
      automatically has a matching-dimension eigenspace — it need not.
    recap: >
      Eigenvectors are the directions where $A$ is pure scaling, found by
      solving $\det(A-\lambda I)=0$ and then $(A-\lambda I)v=0$ for each
      root.
    steps:
      - teach: >
          Along a general vector, $Ax$ can point anywhere; along an
          eigenvector the map degenerates to pure scaling. Nearly everything
          you'll later want to know about a matrix's long-run or extremal
          behavior traces back to these special directions.
      - teach: >
          The derivation is one line: $Av=\lambda v$ with $v\ne0$ rearranges
          to $(A-\lambda I)v=0$, a nonzero solution existing exactly when
          $A-\lambda I$ is singular — the same determinant test invertibility
          already uses, aimed at a shifted matrix.
      - ask: >
          For $A$ with rows $(3,2)$ and $(4,1)$, what is the larger
          eigenvalue?
        expects: "5"
        hint: >
          Set up $\det(A-\lambda I)=0$ and factor the resulting quadratic.
        feedback: >
          $\det(A-\lambda I) = (3-\lambda)(1-\lambda)-8 = \lambda^{2}-4
          \lambda-5=(\lambda-5)(\lambda+1)$, so $\lambda=5,-1$.
      - teach: >
          The characteristic polynomial has degree $n$, hence exactly $n$
          roots over $\mathbb{C}$ counted with multiplicity. Real matrices
          can have genuinely complex eigenvalues — a pure rotation has no
          real invariant direction at all.
      - ask: >
          A real $2\times2$ quarter-turn rotation matrix has which
          eigenvalues?
        choices:
          - text: >
              $1$ and $-1$
            feedback: >
              Those would be real eigendirections, which a genuine rotation
              (other than by $180^{\circ}$) doesn't have.
          - text: >
              $0$ and $0$
            feedback: >
              A rotation doesn't collapse any direction to zero — it's
              invertible, so $0$ can't be an eigenvalue.
          - text: >
              $i$ and $-i$
            correct: true
            feedback: >
              A pure rotation has no real invariant direction at all — its
              eigenvalues are purely imaginary, with modulus $1$.
          - text: >
              $1$ and $1$
            feedback: >
              That would mean every vector is fixed, which only happens for
              the identity, not a genuine rotation.
        feedback: >
          Real matrices can have genuinely complex eigenvalues; a rotation
          with no real eigendirection is the standard example.
      - ask: >
          For the same $A$ (rows $(3,2)$, $(4,1)$), the eigenvector for
          $\lambda=-1$ is $(1,k)$. What is $k$?
        expects: "-2"
        hint: >
          Plug $\lambda=-1$ into $A-\lambda I$ and solve the (dependent) row
          equation.
        feedback: >
          $A+I$ has rows $(4,2)$ and $(4,2)$; solving $4(1)+2k=0$ gives
          $k=-2$.
      - teach: >
          Forgetting $v \ne 0$ is required is the standard slip — $v=0$
          trivially satisfies the equation for any $\lambda$ but carries no
          information. A repeated eigenvalue also need not have a
          matching-dimension eigenspace.
      - teach: >
          Eigenvectors are the directions where $A$ is pure scaling, found
          by solving $\det(A-\lambda I)=0$ and then the dependent system
          $(A-\lambda I)v=0$ — the gate to PCA, Markov chains, and every
          stability question ahead.

  - node: quant-tools.linear-algebra.trace-det-eigen
    hook: >
      Reading eigenvalues of a $2\times2$ straight off trace and determinant
      — no expanding $\det(A-\lambda I)$ by hand — is the difference between
      finding them in five seconds and thirty on a whiteboard.
    explanation: >
      This is packaging, not new content: comparing coefficients of
      $\det(\lambda I-A)=\prod_i(\lambda-\lambda_i)$ against the same
      polynomial expanded from $A$'s entries forces the $\lambda^{n-1}$
      coefficient to equal $-\operatorname{tr}A$ and the constant term to
      equal $(-1)^{n}\det A$ — for $n=2$ that's exactly $\sum_i\lambda_i=
      \operatorname{tr}A$ and $\prod_i\lambda_i=\det A$.

      For $2\times2$ this collapses the entire characteristic-polynomial
      computation to $\lambda^{2}-(\operatorname{tr}A)\lambda+\det A=0$,
      solved directly by
      the quadratic formula — no need to ever expand $(a-\lambda)(d-\lambda)
      -bc$ by hand again.

      Two corollaries worth having automatic: a zero eigenvalue is invisible
      in the trace but announces itself immediately as $\det A=0$; and
      $\operatorname{tr}A/n$ is literally the average eigenvalue, a free
      sanity check on any eigenvalue computation done some other way.
    worked: >
      For $A$ with rows $(7,-4)$ and $(2,1)$: $\operatorname{tr}A=8$,
      $\det A = 7-(-8)=15$. So $\lambda = 4 \pm \sqrt{16-15} = 4\pm1$, giving
      $\lambda=5,3$. Check: $5+3=8$ matches the trace, $5\cdot3=15$ matches
      the determinant.
    interview: >
      "Give me the eigenvalues of this $2\times2$ without expanding the
      determinant" is the direct ask. A subtler version, "what's the average
      eigenvalue of this large matrix," wants $\operatorname{tr}A/n$ with no
      eigendecomposition at all.
    pitfalls: >
      Applying the trace/determinant shortcut as if it pins down eigenvalues
      for $n>2$ — it gives only two equations, not enough for more than two
      unknowns. Flipping the sign in $\lambda^{2}-(\operatorname{tr}A)
      \lambda+\det A$.
    recap: >
      Eigenvalues always sum to the trace and multiply to the determinant,
      which for $2\times2$ is a plug-and-chug quadratic formula.
    steps:
      - teach: >
          This is packaging, not new content: comparing coefficients of
          $\det(\lambda I-A)=\prod_i(\lambda-\lambda_i)$ against the same
          polynomial expanded from $A$'s entries forces, for $n=2$,
          $\sum_i\lambda_i=\operatorname{tr}A$ and
          $\prod_i\lambda_i=\det A$.
      - teach: >
          For $2\times2$ this collapses the entire characteristic-polynomial
          computation to
          $\lambda^{2}-(\operatorname{tr}A)\lambda+\det A=0$, solved
          directly by the quadratic formula — no need to expand
          $(a-\lambda)(d-\lambda)-bc$ by hand again.
      - ask: >
          For $A$ with rows $(6,-2)$ and $(3,1)$, what is the larger
          eigenvalue?
        expects: "4"
        hint: >
          Read $\operatorname{tr}A$ and $\det A$ off the matrix, then solve
          the quadratic.
        feedback: >
          $\operatorname{tr}A=7$, $\det A=6-(-6)=12$, so
          $\lambda=3.5\pm\sqrt{12.25-12}=3.5\pm0.5$, giving $\lambda=4,3$.
      - teach: >
          Two corollaries worth having automatic: a zero eigenvalue is
          invisible in the trace but announces itself immediately as
          $\det A=0$; and $\operatorname{tr}A/n$ is literally the average
          eigenvalue, a free sanity check.
      - ask: >
          A $4\times4$ matrix has $\operatorname{tr}A=20$. What is its
          average eigenvalue?
        expects: "5"
        hint: >
          Divide the trace by $n$.
        feedback: >
          $\operatorname{tr}A/n = 20/4=5$.
      - ask: >
          A $2\times2$ matrix has $\det A = 0$ and $\operatorname{tr}A=7$.
          What can you say about its eigenvalues?
        choices:
          - text: >
              Both eigenvalues are $0$
            feedback: >
              If both were $0$, the trace would be $0$ too, not $7$.
          - text: >
              One eigenvalue is $0$ and the other is $7$
            correct: true
            feedback: >
              The product being $0$ forces one eigenvalue to be $0$; the sum
              being $7$ then forces the other to be $7$.
          - text: >
              The eigenvalues cannot be determined at all
            feedback: >
              For $n=2$ they can — sum and product alone pin down both
              roots.
          - text: >
              Both eigenvalues equal $3.5$
            feedback: >
              That would give a product of $12.25$, not $0$.
        feedback: >
          A zero eigenvalue hides in the trace but shows up immediately in
          the determinant — for $2\times2$, trace and determinant together
          always pin down both eigenvalues exactly.
      - teach: >
          The shortcut only gives two equations, so it doesn't pin down
          eigenvalues for $n>2$ — and a sign flip in
          $\lambda^{2}-(\operatorname{tr}A)\lambda+\det A$ is the standard
          arithmetic slip.
      - teach: >
          Eigenvalues always sum to the trace and multiply to the
          determinant — for $2\times2$ that's a plug-and-chug quadratic,
          worth having automatic before the interview clock starts.

  - node: quant-tools.linear-algebra.eigen-2x2
    hook: >
      This is the drill an interviewer runs to see if the trace/determinant
      shortcut is actually automatic for you, not just something you can
      state — expect back-to-back matrices with the clock running.
    explanation: >
      The routine is three lines: read $\operatorname{tr}A$ and $\det A$
      off the matrix, solve the quadratic for both eigenvalues at once, then
      find each eigenvector from $(A-\lambda I)v=0$. Because $A-\lambda_i I$
      is singular by construction, its two rows are always proportional, so
      only one of them needs solving.

      Symmetric matrices are the friendly case — the spectral theorem for
      symmetric matrices guarantees real eigenvalues and orthogonal
      eigenvectors automatically — but the same three-line routine runs
      unchanged on a non-symmetric matrix; it simply won't hand you
      orthogonality for free.

      The fastest self-check after finding both eigenvalues is comparing
      their sum and product back against the trace and determinant you
      started from, catching an arithmetic slip before it propagates into
      an eigenvector computation that would otherwise look plausible and be
      wrong.
    worked: >
      For the non-symmetric $A$ with rows $(1,4)$ and $(2,3)$:
      $\operatorname{tr}A=4$, $\det A=3-8=-5$, so
      $\lambda=2\pm\sqrt{4+5}=2\pm3$, giving $\lambda=5,-1$. For $\lambda=5$:
      $A-5I$ has rows $(-4,4)$ and $(2,-2)$, giving eigenvector $(1,1)$. For
      $\lambda=-1$: $A+I$ has rows $(2,4)$ and $(2,4)$, giving eigenvector
      $(2,-1)$. Note $(1,1)\cdot(2,-1)=1\ne0$ — not orthogonal, since $A$
      isn't symmetric.
    interview: >
      Expect two or three of these back to back, sometimes a deliberately
      non-symmetric matrix to see whether you notice the eigenvectors won't
      come out perpendicular and don't force them to.
    pitfalls: >
      Plugging $\lambda$ into the wrong row of $A-\lambda I$, or an
      arithmetic slip there. Assuming eigenvectors are always orthogonal —
      that's a consequence of symmetry, not a general fact about
      eigenvectors.
    recap: >
      Trace and determinant give both eigenvalues in one line; each
      eigenvector then falls out of one (necessarily dependent) row of
      $A-\lambda I$.
    steps:
      - teach: >
          The routine is three lines: read $\operatorname{tr}A$ and
          $\det A$ off the matrix, solve the quadratic for both eigenvalues
          at once, then find each eigenvector from the (necessarily
          dependent) row of $A-\lambda I$.
      - teach: >
          Symmetric matrices are the friendly case — the spectral theorem
          guarantees real eigenvalues and orthogonal eigenvectors
          automatically — but the same routine runs unchanged on a
          non-symmetric matrix; it simply won't hand you orthogonality for
          free.
      - ask: >
          For $A$ with rows $(5,3)$ and $(1,3)$, what is the larger
          eigenvalue?
        expects: "6"
        hint: >
          Read $\operatorname{tr}A$ and $\det A$, then solve the quadratic.
        feedback: >
          $\operatorname{tr}A=8$, $\det A=15-3=12$, so
          $\lambda=4\pm\sqrt{16-12}=4\pm2$, giving $\lambda=6,2$.
      - teach: >
          The fastest self-check after finding both eigenvalues is comparing
          their sum and product back against the trace and determinant you
          started from — catching an arithmetic slip before it propagates
          into an eigenvector computation that would otherwise look
          plausible and be wrong.
      - ask: >
          For the same $A$, the eigenvector for $\lambda=2$ is $(1,k)$.
          What is $k$?
        expects: "-1"
        hint: >
          Solve the dependent row of $A-2I$.
        feedback: >
          $A-2I$ has rows $(3,3)$ and $(1,1)$; $3(1)+3k=0$ gives $k=-1$.
      - ask: >
          This $A$ has eigenvectors $(3,1)$ (for $\lambda=6$) and $(1,-1)$
          (for $\lambda=2$). Are they orthogonal?
        choices:
          - text: >
              Yes, eigenvectors are always orthogonal
            feedback: >
              Orthogonality of eigenvectors is a consequence of symmetry,
              not a general fact — and this $A$ isn't symmetric.
          - text: >
              No — orthogonality follows from symmetry, and this matrix
              isn't symmetric
            correct: true
            feedback: >
              $(3,1)\cdot(1,-1)=3-1=2\ne0$: not orthogonal, exactly because
              $A$ has rows $(5,3)$, $(1,3)$ and $A \ne A^{T}$.
          - text: >
              Cannot tell without normalizing them
            feedback: >
              Normalizing rescales length, not direction — the dot product
              being nonzero already settles it.
          - text: >
              Yes, because their eigenvalues are different
            feedback: >
              Distinct eigenvalues guarantee independence, not
              orthogonality — orthogonality additionally needs symmetry.
        feedback: >
          Orthogonal eigenvectors are a consequence of symmetry, not a
          general fact about eigenvectors — this non-symmetric example
          confirms it by direct computation.
      - teach: >
          Plugging $\lambda$ into the wrong row of $A-\lambda I$, or an
          arithmetic slip there, is the recurring error — and assuming
          eigenvectors are always orthogonal is the recurring
          misconception.
      - teach: >
          Trace and determinant give both eigenvalues in one line; each
          eigenvector then falls out of one dependent row — the routine to
          have automatic before any interview clock starts.

  - node: quant-tools.linear-algebra.inner-product
    hook: >
      "Correlation is just a cosine" is one of the highest-leverage
      one-liners in the toolkit, and it only clicks once $\cos\theta$ and
      Cauchy–Schwarz are seen as the same dot-product machinery.
    explanation: >
      The dot product packages length, angle, and perpendicularity into one
      bilinear number. Length is self-similarity, $x^{T}x$; orthogonality is
      the special case where the "overlap" $x^{T}y$ vanishes, which is why
      the Pythagorean identity is pure algebra: expand $\lVert x+y\rVert^{2}
      = (x+y)^{T}(x+y) = x^{T}x + 2x^{T}y + y^{T}y$ and the cross term drops
      exactly when $x^{T}y=0$.

      Cauchy–Schwarz is what makes $x^{T}y/(\lVert x\rVert\lVert y\rVert)$ a
      legitimate cosine — without that bound nothing guarantees the ratio
      stays in $[-1,1]$. Centring each vector before taking this cosine is
      exactly the definition of a correlation coefficient, so every fact you
      know about correlation being bounded by $\pm1$ is a corollary of
      Cauchy–Schwarz, not a separate result.

      The identity $x^{T}(Ay)=(A^{T}x)^{T}y$ is worth memorizing on its own:
      it's the move that lets a matrix hop across a dot product from one
      side to the other, and it is exactly the trick the normal equations
      use later.
    worked: >
      Let $x=(3,4,0)$ and $y=(1,0,2)$. Then $x^{T}y=3$, $\lVert x\rVert=5$,
      $\lVert y\rVert=\sqrt5$, so $\cos\theta = 3/(5\sqrt5) \approx 0.268$.
      For orthogonality, take $z=(4,-3,0)$: $x^{T}z=12-12=0$, so $x,z$ are
      orthogonal, and indeed $\lVert x+z\rVert^{2}=7^{2}+1^{2}=50$ equals
      $\lVert x\rVert^{2}+\lVert z\rVert^{2}=25+25=50$.
    interview: >
      "How would you compute the angle between two vectors" and "how is
      correlation related to cosine similarity" are the standard framings —
      the interviewer wants both the formula and the Cauchy–Schwarz bound
      stated together.
    pitfalls: >
      Calling an unnormalized dot product a "cosine" — it isn't bounded in
      $[-1,1]$ without dividing by both norms. Treating a zero dot product
      of raw (uncentred) data as "no correlation" — correlation needs
      centred data first.
    recap: >
      The dot product is the single operation behind length, angle, and
      orthogonality, with Cauchy–Schwarz guaranteeing the resulting cosine —
      and hence any correlation — lands in $[-1,1]$.
    steps:
      - teach: >
          The dot product packages length ($x^{T}x$), angle, and
          perpendicularity ($x^{T}y=0$) into one bilinear number. The
          Pythagorean identity is pure algebra: the cross term
          $2x^{T}y$ in $\lVert x+y\rVert^{2}$ drops exactly when $x^{T}y=0$.
      - teach: >
          Cauchy–Schwarz is what makes
          $x^{T}y/(\lVert x\rVert\lVert y\rVert)$ a legitimate cosine;
          centring each vector before taking this cosine is the definition
          of correlation, so correlation being bounded by $\pm1$ is a
          corollary, not a separate result.
      - ask: >
          Let $x=(1,2,2)$ and $y=(2,-1,2)$. What is $x^{T}y$?
        expects: "4"
        hint: >
          Sum the products of corresponding coordinates.
        feedback: >
          $1\cdot2+2\cdot(-1)+2\cdot2=2-2+4=4$.
      - teach: >
          The identity $x^{T}(Ay)=(A^{T}x)^{T}y$ lets a matrix hop across a
          dot product from one side to the other — exactly the move the
          normal equations use later.
      - ask: >
          For the same $x=(1,2,2)$, $y=(2,-1,2)$, what is $\cos\theta$
          between them, rounded to three decimals?
        expects: "0.444"
        tolerance: 0.005
        hint: >
          Both vectors have the same norm here — find it, then divide the
          dot product by its square.
        feedback: >
          $\lVert x\rVert=\lVert y\rVert=3$ (since $1+4+4=9$ and
          $4+1+4=9$), so $\cos\theta=4/9\approx0.444$.
      - ask: >
          Two raw (uncentred) data vectors satisfy $x^{T}y=0$. What can you
          conclude about their correlation?
        choices:
          - text: >
              Their correlation is exactly $0$
            feedback: >
              Correlation needs *centred* data — a zero dot product of raw
              data doesn't say anything about correlation yet.
          - text: >
              Nothing yet — correlation requires centring each vector first
            correct: true
            feedback: >
              The centred version of the cosine is the definition of
              correlation; without centring, orthogonality of raw data is a
              different fact.
          - text: >
              They must be identical
            feedback: >
              Orthogonal vectors are about as far from identical as two
              vectors can be.
          - text: >
              Their correlation is undefined
            feedback: >
              It's simply not yet computed — centre the data first, then
              take the cosine.
        feedback: >
          Correlation is the cosine of *centred* vectors — a fact about raw,
          uncentred data doesn't transfer to it directly.
      - teach: >
          Calling an unnormalized dot product a "cosine" is the standard
          slip — it isn't bounded in $[-1,1]$ without dividing by both
          norms.
      - teach: >
          One bilinear operation carries length, angle, and orthogonality,
          with Cauchy–Schwarz guaranteeing any resulting cosine — and hence
          any correlation — lands in $[-1,1]$.

  - node: quant-tools.linear-algebra.orthogonal-matrix
    hook: >
      "$Q^{-1}=Q^{T}$" is the cheapest inverse you'll ever get to use —
      spotting that a matrix qualifies turns an inversion problem into a
      transpose.
    explanation: >
      An orthogonal matrix is the matrix form of "change coordinates
      without distorting lengths or angles": its columns are unit vectors,
      pairwise orthogonal, so applying $Q$ sends the standard basis to
      another orthonormal basis rigidly, which is why $\lVert Qx\rVert =
      \lVert x\rVert$ for every $x$.

      The inverse formula needs no elimination or cofactors at all — it
      follows directly from the defining equation $Q^{T}Q=I$, which already
      says $Q^{T}$ undoes $Q$.

      Determinant $\pm1$ separates rotations from reflections: both preserve
      length, but a reflection flips orientation. Since length preservation
      applied to an eigenvector forces $|\lambda|=1$ for every eigenvalue of
      $Q$, a rotation's eigenvalues can be complex (modulus $1$, not real),
      while a reflection always has a real eigenvalue of $-1$.
    worked: >
      Let $Q$ have columns $(0.6,0.8)$ and $(-0.8,0.6)$. Checking
      $Q^{T}Q$: each column has squared length $0.36+0.64=1$, and the two
      columns' dot product is $0.6(-0.8)+0.8(0.6)=0$, so $Q^{T}Q=I$. Also
      $\det Q = 0.36-(-0.64)=1$, so $Q$ is a rotation, and $Q^{-1}=Q^{T}$
      has rows $(0.6,0.8)$ and $(-0.8,0.6)$ with no further computation.
    interview: >
      "Is this matrix orthogonal, and what's its inverse" is answered by
      checking $Q^{T}Q=I$ and then writing down the transpose — no
      elimination. A follow-up often asks rotation-versus-reflection from
      the determinant's sign.
    pitfalls: >
      Assuming unit-length columns alone make a matrix orthogonal — they
      must also be pairwise orthogonal. Computing $Q^{-1}$ by elimination or
      cofactors instead of noticing $Q^{T}Q=I$ first. Forgetting that a
      product of orthogonal matrices is again orthogonal, so composing two
      rotations never needs a fresh invertibility check.
    recap: >
      Orthogonal matrices are rigid rotations or reflections with
      orthonormal columns, so their inverse is free: just transpose.
    steps:
      - teach: >
          An orthogonal matrix is the matrix form of "change coordinates
          without distorting lengths or angles": its columns are pairwise
          orthogonal unit vectors, which is why $\lVert Qx\rVert=\lVert
          x\rVert$ for every $x$.
      - teach: >
          The inverse formula needs no elimination or cofactors at all — it
          follows directly from the defining equation $Q^{T}Q=I$, which
          already says $Q^{T}$ undoes $Q$.
      - ask: >
          $Q$ has columns $(0.8,0.6)$ and $(-0.6,0.8)$. What is the dot
          product of its two columns?
        expects: "0"
        hint: >
          Multiply corresponding entries and add.
        feedback: >
          $0.8\cdot(-0.6)+0.6\cdot0.8=-0.48+0.48=0$ — the columns are
          perpendicular, one of the two conditions for $Q^{T}Q=I$.
      - teach: >
          Determinant $\pm1$ separates rotations from reflections — both
          preserve length, but a reflection flips orientation, and every
          eigenvalue of an orthogonal matrix has modulus $1$, real or
          complex.
      - ask: >
          For the same $Q$ (columns $(0.8,0.6)$, $(-0.6,0.8)$), what is
          $\det Q$?
        expects: "1"
        hint: >
          Use the $2\times2$ determinant formula on the two columns.
        feedback: >
          $0.8\cdot0.8-(-0.6)\cdot0.6=0.64+0.36=1$, so $Q$ is a rotation,
          not a reflection.
      - ask: >
          $Q$ has columns $(1,0)$ and $(0,-1)$. Which is true?
        choices:
          - text: >
              $Q$ is a rotation, since its columns are unit vectors
            feedback: >
              Unit-length, orthogonal columns alone don't determine
              rotation versus reflection — the sign of $\det Q$ does, and
              here it's $-1$.
          - text: >
              $Q$ is a reflection, since $\det Q=-1$
            correct: true
            feedback: >
              $\det Q = 1\cdot(-1)-0\cdot0=-1$: orientation flips, so this
              is a reflection (of the second coordinate).
          - text: >
              $Q$ is not orthogonal, since one column is negative
            feedback: >
              Sign doesn't affect orthogonality — only unit length and
              perpendicularity matter, and both hold here.
          - text: >
              Finding $Q^{-1}$ requires elimination
            feedback: >
              Since $Q$ is orthogonal, $Q^{-1}=Q^{T}$ regardless of whether
              it's a rotation or reflection — no elimination needed.
        feedback: >
          The sign of $\det Q$ is the rotation/reflection test: $+1$ is a
          rotation, $-1$ a reflection, and both are length-preserving
          isometries.
      - teach: >
          Assuming unit-length columns alone make a matrix orthogonal is
          the standard slip — they must also be pairwise orthogonal.
          Computing $Q^{-1}$ by elimination instead of noticing $Q^{T}Q=I$
          first wastes the whole advantage.
      - teach: >
          Orthogonal matrices are rigid rotations or reflections with
          orthonormal columns, so their inverse is free — just transpose.

  - node: quant-tools.linear-algebra.spectral
    hook: >
      "Why is a covariance matrix always diagonalizable with real
      eigenvalues" has exactly one answer, and it's this theorem — every
      symmetric matrix decomposes into perpendicular stretch directions, no
      exceptions.
    explanation: >
      Unlike a general matrix, a symmetric one is guaranteed real
      eigenvalues and a full orthonormal set of eigenvectors — no complex
      eigenvalues to worry about, no eigenvector deficiency like the
      non-diagonalizable matrix with rows $(1,1)$ and $(0,1)$ exhibits.

      The orthogonality argument is short and worth re-deriving on the spot:
      if $Av=\lambda v$ and $Aw=\mu w$, compute $v^{T}Aw$ two ways using the
      matrix-across-a-dot-product identity — $\lambda\,v^{T}w = (Av)^{T}w =
      v^{T}A^{T}w = v^{T}Aw = v^{T}(\mu w) = \mu\,v^{T}w$ — which forces
      $v^{T}w=0$ whenever $\lambda\ne\mu$. Symmetry, $A=A^{T}$, is exactly
      what makes the middle step $(Av)^{T}w=v^{T}Aw$ valid.

      Reading $A=\sum_i\lambda_iq_iq_i^{T}$: each term is a rank-one
      projector onto one eigendirection, so a symmetric matrix is a weighted
      sum of independent stretches along perpendicular axes — exactly why
      a covariance matrix, symmetric by construction, always decomposes
      into uncorrelated directions.
    worked: >
      For symmetric $A$ with rows $(5,3)$ and $(3,5)$: $\operatorname{tr}A=
      10$, $\det A=16$, so $\lambda=5\pm3=8,2$. For $\lambda=8$: $A-8I$ has
      rows $(-3,3)$ and $(3,-3)$, giving $q_1=(1,1)/\sqrt2$. For $\lambda=2$:
      $A-2I$ has rows $(3,3)$ and $(3,3)$, giving $q_2=(1,-1)/\sqrt2$. Indeed
      $q_1\cdot q_2=0$, and $A = 8\,q_1q_1^{T} + 2\,q_2q_2^{T}$.
    interview: >
      "Why must a symmetric matrix have real eigenvalues" and "why are a
      covariance matrix's eigenvectors orthogonal" are both this theorem —
      answer with the $v^{T}Aw$-two-ways argument, not a citation.
    pitfalls: >
      Assuming any diagonalizable matrix has orthogonal eigenvectors — that
      is special to symmetric matrices. Forgetting the eigenvectors must be
      normalized to unit length for $A=Q\Lambda Q^{T}$ to hold with $Q$
      truly orthogonal.
    recap: >
      Symmetry alone guarantees real eigenvalues and an orthonormal
      eigenbasis, so $A=Q\Lambda Q^{T}$ — independent stretches along
      perpendicular axes.
    steps:
      - teach: >
          Unlike a general matrix, a symmetric one is guaranteed real
          eigenvalues and a full orthonormal set of eigenvectors — no
          complex eigenvalues to worry about, no eigenvector deficiency.
      - teach: >
          The orthogonality argument is short: if $Av=\lambda v$ and
          $Aw=\mu w$, compute $v^{T}Aw$ two ways —
          $\lambda\,v^{T}w=(Av)^{T}w=v^{T}A^{T}w=v^{T}Aw=v^{T}(\mu w)=\mu\,
          v^{T}w$ — forcing $v^{T}w=0$ when $\lambda\ne\mu$. Symmetry is
          exactly what makes the middle step valid.
      - ask: >
          For symmetric $A$ with rows $(3,2)$ and $(2,6)$, what is the
          larger eigenvalue?
        expects: "7"
        hint: >
          Read $\operatorname{tr}A$ and $\det A$, then solve the quadratic.
        feedback: >
          $\operatorname{tr}A=9$, $\det A=18-4=14$, so
          $\lambda=4.5\pm\sqrt{20.25-14}=4.5\pm2.5$, giving $\lambda=7,2$.
      - teach: >
          Reading $A=\sum_i\lambda_iq_iq_i^{T}$: each term is a rank-one
          projector onto one eigendirection, so a symmetric matrix is a
          weighted sum of independent stretches along perpendicular axes.
      - ask: >
          For the same $A$, the eigenvector for $\lambda=7$ is $(1,k)$.
          What is $k$?
        expects: "2"
        hint: >
          Solve the dependent row of $A-7I$.
        feedback: >
          $A-7I$ has rows $(-4,2)$ and $(2,-1)$; $-4(1)+2k=0$ gives $k=2$.
      - ask: >
          $B$ has rows $(1,1)$ and $(0,1)$ — not symmetric. Which is true?
        choices:
          - text: >
              $B$ still has a full orthonormal eigenbasis, since every
              matrix does
            feedback: >
              False in general, and false here specifically — the spectral
              theorem needs symmetry, which $B$ lacks.
          - text: >
              $B$ has only a $1$-dimensional eigenspace despite a repeated
              eigenvalue — it isn't even diagonalizable
            correct: true
            feedback: >
              $B$'s only eigenvalue is $1$ (repeated), but its eigenspace
              spans just one direction — exactly the deficiency symmetry
              rules out.
          - text: >
              $B$'s eigenvalues must be complex, since it's not symmetric
            feedback: >
              Non-symmetric doesn't force complex eigenvalues — here both
              eigenvalues are real (both equal $1$).
          - text: >
              $B$ is orthogonal
            feedback: >
              Its columns aren't even pairwise orthogonal — check
              $B^{T}B\ne I$.
        feedback: >
          Symmetry is essential: without it, eigenvectors need not be
          orthogonal, and the eigenspace of a repeated eigenvalue can fall
          short of full dimension, as it does here.
      - teach: >
          Assuming any diagonalizable matrix has orthogonal eigenvectors is
          the recurring mistake — that's special to symmetric matrices, and
          eigenvectors must be normalized to unit length for $A=Q\Lambda
          Q^{T}$ to hold with $Q$ truly orthogonal.
      - teach: >
          Symmetry alone guarantees real eigenvalues and an orthonormal
          eigenbasis — independent stretches along perpendicular axes, the
          fact covariance matrices and Hessians lean on constantly.

  - node: quant-tools.linear-algebra.quadratic-form
    hook: >
      Any time a problem asks you to maximize or classify a "portfolio
      variance" formula or a Hessian, it's secretly asking about the sign
      behaviour of a quadratic form — the algebra underneath is always
      $x^{T}Ax$.
    explanation: >
      Only the symmetric part of $A$ survives in $q(x)=x^{T}Ax$ because the
      $(i,j)$ and $(j,i)$ terms of the double sum pair up into
      $(a_{ij}+a_{ji})x_ix_j$ — only the sum matters, so any antisymmetric
      part of $A$ is invisible to $q$ and can always be discarded by
      symmetrizing first.

      Reading the formula straight off a symmetric matrix: diagonal entries
      are the pure-square coefficients, and off-diagonal entries get
      doubled, since both $(i,j)$ and $(j,i)$ contribute the same cross
      term. This is the fact to have automatic when translating between "a
      matrix" and "a formula" in either direction.

      Because $q$ is degree-two homogeneous, $q(cx)=c^{2}q(x)$ never flips
      sign as $c$ varies, so the sign behaviour of $q$ on the whole space is
      already decided by its sign on the unit sphere — "always nonnegative,"
      "always nonpositive," and "changes sign" (a saddle) are the only three
      possibilities.
    worked: >
      For symmetric $A$ with rows $(3,1)$ and $(1,3)$: $q(x) = 3x_1^{2} +
      2x_1x_2 + 3x_2^{2}$ (the off-diagonal $1$ doubles to $2$). At
      $x=(2,1)$: $q(2,1) = 3\cdot4 + 2\cdot2\cdot1 + 3\cdot1 = 12+4+3=19$.
    interview: >
      "Write out $x^{T}Ax$ for this matrix" and its reverse, "write down the
      matrix behind this quadratic expression," both get asked — the doubled
      off-diagonal entry is exactly where people slip in either direction.
    pitfalls: >
      Forgetting to double the off-diagonal entry going from matrix to
      formula (or halve it going the other way). Using a non-symmetric $A$
      and being confused that two different matrices give the same $q(x)$ —
      always symmetrize first.
    recap: >
      $x^{T}Ax$ only sees the symmetric part of $A$, with off-diagonal
      entries doubled into the cross terms, and its sign is fixed by its
      behaviour on the unit sphere.
    steps:
      - teach: >
          Only the symmetric part of $A$ survives in $q(x)=x^{T}Ax$: the
          $(i,j)$ and $(j,i)$ terms of the double sum pair up into
          $(a_{ij}+a_{ji})x_ix_j$, so any antisymmetric part of $A$ is
          invisible to $q$.
      - teach: >
          Reading the formula off a symmetric matrix: diagonal entries are
          the pure-square coefficients, and off-diagonal entries get
          doubled, since both $(i,j)$ and $(j,i)$ contribute the same
          cross term.
      - ask: >
          For symmetric $A$ with rows $(2,1)$ and $(1,4)$, what is
          $q(1,3)$?
        expects: "44"
        hint: >
          Write out $2x_{1}^{2}+2x_{1}x_{2}+4x_{2}^{2}$ (doubling the
          off-diagonal $1$), then substitute.
        feedback: >
          $q(1,3) = 2(1)^{2}+2(1)(3)+4(3)^{2} = 2+6+36=44$.
      - teach: >
          Because $q$ is degree-two homogeneous, $q(cx)=c^{2}q(x)$ never
          flips sign as $c$ varies, so the sign behaviour on the whole
          space is already decided by its behaviour on the unit sphere —
          always nonnegative, always nonpositive, or indefinite (a saddle).
      - ask: >
          Symmetric $A$ has rows $(1,0)$ and $(0,-1)$. What is the sign
          behaviour of $q(x)=x^{T}Ax$?
        choices:
          - text: >
              Always positive
            feedback: >
              $q(0,1)=-1<0$, so it isn't always positive.
          - text: >
              Always negative
            feedback: >
              $q(1,0)=1>0$, so it isn't always negative.
          - text: >
              Indefinite — positive in some directions, negative in others
            correct: true
            feedback: >
              $q(1,0)=1>0$ and $q(0,1)=-1<0$: a saddle.
          - text: >
              Always zero
            feedback: >
              $q(1,0)=1\ne0$.
        feedback: >
          $q$ changes sign between $(1,0)$ and $(0,1)$, so it's indefinite —
          a saddle, not a definite form.
      - ask: >
          A symmetric matrix has off-diagonal entry $a_{12}=5$. What is the
          coefficient of $x_{1}x_{2}$ in $q(x)$?
        expects: "10"
        hint: >
          Both $(1,2)$ and $(2,1)$ contribute the same cross term.
        feedback: >
          $a_{12}+a_{21}=5+5=10$.
      - teach: >
          Forgetting to double the off-diagonal entry going from matrix to
          formula (or halve it going the other way) is the standard slip.
          Using a non-symmetric $A$ and being confused that two different
          matrices give the same $q(x)$ — always symmetrize first.
      - teach: >
          $x^{T}Ax$ only sees the symmetric part of $A$, with off-diagonal
          entries doubled into the cross terms, and its sign is fixed by
          its behaviour on the unit sphere.

  - node: quant-tools.linear-algebra.psd
    hook: >
      "Is this matrix positive semidefinite" is really always one of two
      questions in disguise — "is this a valid covariance matrix" or "is
      this a local minimum" — and the eigenvalue test settles both in one
      line.
    explanation: >
      PSD is the matrix generalization of "nonnegative number," and the
      spectral theorem is exactly what makes the eigenvalue test valid:
      writing $x=Qy$ turns $x^{T}Ax$ into $\sum_i\lambda_iy_i^{2}$, a plain
      sum of squares weighted by eigenvalues, so it stays $\ge0$ for every
      $x$ exactly when every $\lambda_i\ge0$.

      The factorization $A=B^{T}B$ is the other standard certificate, and it
      needs no eigenvalues: $x^{T}Ax=x^{T}B^{T}Bx=\lVert Bx\rVert^{2}\ge0$
      automatically. This is the form a covariance matrix naturally arrives
      in, since it comes from a variance.

      Sylvester's criterion is a shortcut but a fragile one: it certifies
      positive definite (not merely semidefinite) via all leading principal
      minors being strictly positive. The semidefinite boundary needs every
      principal minor
      checked, not only the nested leading ones, because a single bad
      off-diagonal block can hide from the leading corners alone.
    worked: >
      Test $A$ with rows $(2,-1)$ and $(-1,2)$: leading minors $2>0$ and
      $\det A=4-1=3>0$, so $A$ is PD by Sylvester. Confirming via
      eigenvalues: $\operatorname{tr}A=4$, $\det A=3$, so
      $\lambda=2\pm\sqrt{4-3}=2\pm1=3,1$, both positive — consistent.
    interview: >
      "Is this covariance matrix valid" or "is this the Hessian at a
      minimum" are both PSD/PD checks. For a small matrix the fast answer is
      Sylvester's leading minors, with the caveat that it only proves the
      strict, definite case.
    pitfalls: >
      Using leading-minor positivity (even $\ge0$) to certify PSD — it
      doesn't; a valid counterexample has rows $(0,0)$ and $(0,-1)$.
      Concluding PD just because the diagonal entries are all positive, which
      says nothing about the off-diagonal.
    recap: >
      PSD means every eigenvalue is nonnegative, equivalently $A=B^{T}B$ for
      some $B$, and Sylvester's leading-minor test certifies only the
      strict, positive-definite case.
    steps:
      - teach: >
          PSD is the matrix generalization of "nonnegative number." The
          spectral theorem makes the eigenvalue test valid: writing $x=Qy$
          turns $x^{T}Ax$ into $\sum_i\lambda_iy_i^{2}$, a sum of squares
          weighted by eigenvalues, so it stays $\ge0$ exactly when every
          $\lambda_i\ge0$.
      - teach: >
          The factorization $A=B^{T}B$ is the other standard certificate and
          needs no eigenvalues at all: $x^{T}Ax=\lVert Bx\rVert^{2}\ge0$
          automatically — the form a covariance matrix naturally arrives
          in.
      - ask: >
          For symmetric $A$ with rows $(3,1)$ and $(1,3)$, what is $\det A$?
        expects: "8"
        hint: >
          This is the full $2\times2$ determinant, the second leading
          principal minor.
        feedback: >
          $\det A = 9-1=8>0$, and combined with $a_{11}=3>0$, Sylvester's
          criterion certifies $A$ is positive definite.
      - teach: >
          Sylvester's criterion is a shortcut but fragile: it certifies
          positive definite (strict) via all leading principal minors being
          strictly positive. The semidefinite boundary needs every
          principal minor checked, not only the nested leading ones.
      - ask: >
          For the same $A$ (rows $(3,1)$, $(1,3)$), confirm via
          eigenvalues: what is the smaller eigenvalue?
        expects: "2"
        hint: >
          $\operatorname{tr}A=6$, $\det A=8$.
        feedback: >
          $\lambda=3\pm\sqrt{9-8}=3\pm1$, giving $\lambda=4,2$ — both
          positive, consistent with the Sylvester result.
      - ask: >
          A symmetric matrix has rows $(0,0)$ and $(0,-1)$; both leading
          principal minors are $\ge0$ ($0$ and $0$). Is it PSD?
        choices:
          - text: >
              Yes — nonnegative leading minors certify PSD
            feedback: >
              This is exactly the case where that fails.
          - text: >
              No — a principal minor (the $(2,2)$ entry alone) is negative,
              so it's not PSD
            correct: true
            feedback: >
              $x=(0,1)$ gives $x^{T}Ax=-1<0$. Leading minors $\ge0$ certify
              nothing about PSD; only all-strict leading minors certify PD.
          - text: >
              Cannot tell without eigen-decomposing
            feedback: >
              Checking the $(2,2)$ entry alone (a principal minor) already
              settles it.
          - text: >
              Yes, since it's symmetric
            feedback: >
              Symmetry alone says nothing about sign.
        feedback: >
          The full principal-minor test, not just the leading ones, is
          needed to certify PSD — this matrix is the standard counterexample
          for why.
      - teach: >
          Using leading-minor nonnegativity to certify PSD — it doesn't —
          and concluding PD just because the diagonal entries are positive,
          which says nothing about the off-diagonal, are the two recurring
          errors.
      - teach: >
          PSD means every eigenvalue is nonnegative, equivalently
          $A=B^{T}B$ for some $B$, and Sylvester's leading-minor test only
          certifies the strict, positive-definite case.

  - node: quant-tools.linear-algebra.rayleigh-quotient
    hook: >
      "What direction maximizes $x^{T}Ax$ subject to $\lVert x\rVert=1$"
      underlies every PCA and portfolio-optimization problem, and the
      Rayleigh quotient answers it with no calculus: the maximum is just the
      top eigenvalue.
    explanation: >
      The proof is worth re-deriving because it's what makes PCA sit on
      ground already built: write $x=\sum_ic_iq_i$ in the orthonormal
      eigenbasis from the spectral theorem. Since the $q_i$ are orthonormal,
      $x^{T}x=\sum_ic_i^{2}$, and $x^{T}Ax=\sum_i\lambda_ic_i^{2}$, so the
      quotient is a weighted average of the eigenvalues with weights
      $c_i^{2}/\sum_jc_j^{2}$.

      A weighted average can never exceed its largest term or fall below
      its smallest, which gives the bound immediately, and equality happens
      exactly when all the weight sits on one eigenvalue — that is, $x$ is a
      multiple of the corresponding eigenvector.

      The optimization reading is the one to keep: maximizing a quadratic
      form on the unit sphere has no free-standing calculus content once you
      know this — it is already solved, and the answer is always "the top
      eigenvalue, at the top eigenvector," the exact first step PCA takes.
    worked: >
      For symmetric $A$ with rows $(3,1)$ and $(1,3)$: $\lambda=3\pm1=4,2$,
      so the quotient ranges over $[2,4]$. At $x=(1,0)$: the quotient is
      $3/1=3$, inside the range. At the $\lambda=4$ eigenvector $(1,1)$
      (from $A-4I$ having rows $(-1,1)$ and $(1,-1)$): $x^{T}Ax=3+2+3=8$,
      $x^{T}x=2$, ratio $4$ — the maximum, attained exactly there.
    interview: >
      "How would you maximize $x^{T}Ax$ over unit vectors without calculus"
      is exactly this fact — say "diagonalize; it's a weighted average of
      eigenvalues, so the max is the top eigenvalue at the top eigenvector"
      cold.
    pitfalls: >
      Forgetting the constraint $\lVert x\rVert=1$ changes everything —
      unconstrained, $x^{T}Ax$ is unbounded above whenever any eigenvalue is
      positive. Assuming the maximizing direction is unique when the top
      eigenvalue is repeated.
    recap: >
      On the unit sphere, $x^{T}Ax$ is a weighted average of eigenvalues of
      $A$, so it never leaves $[\lambda_{\min},\lambda_{\max}]$, hitting
      both ends exactly at the corresponding eigenvectors.
    steps:
      - teach: >
          Write $x=\sum_ic_iq_i$ in the orthonormal eigenbasis. Since the
          $q_i$ are orthonormal, $x^{T}x=\sum_ic_i^{2}$ and
          $x^{T}Ax=\sum_i\lambda_ic_i^{2}$, so the quotient is a weighted
          average of the eigenvalues.
      - teach: >
          A weighted average can never exceed its largest term or fall
          below its smallest, giving the bound immediately — equality
          happens exactly when all the weight sits on one eigenvalue, that
          is, $x$ is a multiple of that eigenvector.
      - ask: >
          For symmetric $A$ with rows $(5,2)$ and $(2,2)$, what is
          $\lambda_{\max}$?
        expects: "6"
        hint: >
          Read $\operatorname{tr}A$ and $\det A$, then solve the quadratic.
        feedback: >
          $\operatorname{tr}A=7$, $\det A=10-4=6$, so
          $\lambda=3.5\pm\sqrt{12.25-6}=3.5\pm2.5$, giving $\lambda=6,1$.
      - teach: >
          The optimization reading is the one to keep: maximizing a
          quadratic form on the unit sphere has no free-standing calculus
          content once you know this — the answer is always "the top
          eigenvalue, at the top eigenvector," exactly PCA's first step.
      - ask: >
          For the same $A$ and $x=(1,1)$, what is the Rayleigh quotient
          $x^{T}Ax/x^{T}x$?
        expects: "5.5"
        hint: >
          Compute $x^{T}Ax$ and $x^{T}x$ separately, then divide.
        feedback: >
          $x^{T}Ax = 5(1)+2\cdot2(1)(1)+2(1)=5+4+2=11$, and $x^{T}x=2$, so
          the quotient is $11/2=5.5$ — inside $[1,6]$ as it must be.
      - ask: >
          For a symmetric matrix with $\lambda_{\min}=-2$ and
          $\lambda_{\max}=5$, which value can the Rayleigh quotient never
          take?
        choices:
          - text: >
              $3$
            feedback: >
              That's inside $[-2,5]$, so it's attainable.
          - text: >
              $-2$
            feedback: >
              That's attained exactly at the minimizing eigenvector.
          - text: >
              $7$
            correct: true
            feedback: >
              A weighted average of eigenvalues can never exceed the
              largest one, so $7 > 5$ is out of reach.
          - text: >
              $0$
            feedback: >
              That's inside $[-2,5]$, so it's attainable.
        feedback: >
          The quotient is a weighted average of eigenvalues, trapped in
          $[\lambda_{\min},\lambda_{\max}]$ always.
      - teach: >
          Forgetting the constraint $\lVert x\rVert=1$ changes everything —
          unconstrained, $x^{T}Ax$ is unbounded above whenever any
          eigenvalue is positive. The maximizing direction also need not be
          unique when the top eigenvalue is repeated.
      - teach: >
          On the unit sphere, $x^{T}Ax$ is a weighted average of the
          eigenvalues of $A$, so it never leaves
          $[\lambda_{\min},\lambda_{\max}]$ — hitting both ends exactly at
          the corresponding eigenvectors.

  - node: quant-tools.linear-algebra.covariance-psd
    hook: >
      "Prove a covariance matrix is PSD" is one of the most common quant
      proof questions, and the whole proof is one sentence — a variance
      can't be negative — worth having word for word.
    explanation: >
      Expanding $a^{T}\Sigma a$ gives exactly $\operatorname{Var}(a^{T}X)$,
      the variance of the scalar random variable $a^{T}X$ — a weighted
      portfolio of the coordinates of $X$. A variance is never negative, so
      $a^{T}\Sigma a \ge 0$ for every $a$ follows immediately, with no
      eigenvalue computation at all.

      Symmetry of $\Sigma$ is likewise definitional: $\operatorname{Cov}
      (X_i,X_j)=\operatorname{Cov}(X_j,X_i)$ always holds. Combined with the
      spectral theorem, PSD plus symmetric already tells you every
      eigenvalue of a covariance matrix is real and $\ge0$ before looking at
      a single number in $\Sigma$.

      Singularity has a clean reading here too: a zero eigenvalue means some
      portfolio $a^{T}X$ has exactly zero variance — a deterministic linear
      relationship among the coordinates of $X$. This is exactly what
      happens for a sample covariance matrix built from fewer observations
      than variables, since $n-1$ centred data points cannot support more
      than $n-1$ independent directions.
    worked: >
      Two assets with $\operatorname{Var}(X)=4$, $\operatorname{Var}(Y)=9$,
      correlation $0.5$, so $\operatorname{Cov}(X,Y)=0.5\sqrt{4\cdot9}=3$ and
      $\Sigma$ has rows $(4,3)$ and $(3,9)$. For $a=(1,-1)$: $a^{T}\Sigma
      a=4-2\cdot3+9=7$. Checking directly, $\operatorname{Var}(X-Y)=4+9-2
      \cdot3=7$ — matches, and $7\ge0$ as required.
    interview: >
      "Why is a covariance matrix always PSD" is asked nearly verbatim —
      give the one-line variance argument before reaching for eigenvalues,
      and expect the follow-up "when is it singular" (a riskless combination
      exists).
    pitfalls: >
      Reaching for eigenvalues or Sylvester's criterion first instead of the
      direct variance argument. Forgetting a sample covariance matrix from
      $n$ observations of $d$ assets is automatically singular whenever
      $n-1<d$, regardless of the data.
    recap: >
      $a^{T}\Sigma a$ is literally the variance of the portfolio $a^{T}X$,
      so it can never be negative — every covariance matrix is PSD by
      construction, singular exactly when some combination is riskless.
    steps:
      - teach: >
          Expanding $a^{T}\Sigma a$ gives exactly $\operatorname{Var}
          (a^{T}X)$, the variance of a weighted portfolio of the
          coordinates of $X$. A variance is never negative, so
          $a^{T}\Sigma a\ge0$ for every $a$ follows immediately, with no
          eigenvalue computation at all.
      - teach: >
          Symmetry of $\Sigma$ is likewise definitional, since
          $\operatorname{Cov}(X_i,X_j)=\operatorname{Cov}(X_j,X_i)$ always
          holds. Combined with the spectral theorem, PSD plus symmetric
          already tells you every eigenvalue of a covariance matrix is real
          and $\ge0$.
      - ask: >
          Two assets have $\operatorname{Var}(X)=9$, $\operatorname{Var}
          (Y)=16$, and correlation $0.25$. What is $\operatorname{Cov}
          (X,Y)$?
        expects: "3"
        hint: >
          Multiply the correlation by the product of the standard
          deviations.
        feedback: >
          $0.25\sqrt{9\cdot16}=0.25\cdot12=3$.
      - teach: >
          Singularity has a clean reading: a zero eigenvalue means some
          portfolio $a^{T}X$ has exactly zero variance — a deterministic
          linear relationship among the coordinates of $X$. A sample
          covariance matrix from fewer observations than variables is
          automatically singular this way.
      - ask: >
          For $\Sigma$ with rows $(9,3)$ and $(3,16)$, what is
          $a^{T}\Sigma a$ for $a=(1,1)$?
        expects: "31"
        hint: >
          This should equal $\operatorname{Var}(X+Y)$.
        feedback: >
          $9+2\cdot3+16=31$, matching
          $\operatorname{Var}(X+Y)=\operatorname{Var}(X)+\operatorname{Var}
          (Y)+2\operatorname{Cov}(X,Y)=9+16+6=31$.
      - ask: >
          A sample covariance matrix is built from $n=5$ observations of
          $d=8$ assets. What follows?
        choices:
          - text: >
              It's automatically PSD but also singular, since
              $n-1=4<d=8$
            correct: true
            feedback: >
              Too few observations to support $8$ independent directions —
              some combination of assets has zero sample variance.
          - text: >
              It cannot be PSD
            feedback: >
              Sample covariance matrices are always PSD by construction;
              this doesn't change.
          - text: >
              It's guaranteed positive definite, since it's a covariance
              matrix
            feedback: >
              PSD is guaranteed, not PD — here it's necessarily singular.
          - text: >
              Nothing follows without seeing the actual data
            feedback: >
              The observation count alone already forces singularity here.
        feedback: >
          $n-1<d$ forces singularity regardless of what the data actually
          look like — a direct consequence of the covariance-PSD argument.
      - teach: >
          Reaching for eigenvalues or Sylvester's criterion first instead
          of the direct variance argument is the recurring detour. Also
          easy to forget: a sample covariance matrix from $n$ observations
          of $d$ assets is automatically singular whenever $n-1<d$.
      - teach: >
          $a^{T}\Sigma a$ is literally the variance of the portfolio
          $a^{T}X$, so it can never be negative — every covariance matrix
          is PSD by construction, singular exactly when some combination
          is riskless.

  - node: quant-tools.linear-algebra.correlation-matrix-bound
    hook: >
      "Can three trades all be pairwise correlated $-0.9$" sounds like a
      data question but is actually a two-line eigenvalue check — most
      people answer it by intuition and get it wrong.
    explanation: >
      Not every symmetric matrix with $1$s on the diagonal is a valid
      correlation matrix, only the PSD ones — so "can these correlations
      coexist" is literally "is this matrix PSD," answered by finding its
      eigenvalues.

      The equicorrelated matrix $(1-\rho)I+\rho J$ ($J$ the all-ones matrix)
      is worth recognizing on sight, since it comes up constantly in
      exchangeable-asset setups: $J$ has eigenvalue $n$ on the all-ones
      direction and $0$ on everything orthogonal to it, so adding $(1-\rho)I$
      shifts every eigenvalue up by $1-\rho$, giving $1+(n-1)\rho$ once and
      $1-\rho$ with multiplicity $n-1$.

      The bound's asymmetry has a real intuitive reading: it's easy for many
      things to move together, but hard for many things to move against each
      other simultaneously, since if $X$ and $Y$ both disagree strongly with
      $Z$ they're forced to agree somewhat with each other — that forcing
      effect compounds as $n$ grows, tightening the floor.
    worked: >
      For $n=4$, the bound is $\rho\ge-1/3$. At $\rho=-1/3$ exactly:
      $1+3(-1/3)=0$ — boundary, still PSD but singular (some combination is
      riskless), with the other eigenvalue $1-\rho=4/3>0$. At $\rho=-0.4$:
      $1+3(-0.4)=-0.2<0$ — not PSD, so four assets cannot be pairwise
      correlated $-0.4$.
    interview: >
      Posed as "can $n$ assets all be pairwise correlated $\rho$" for some
      specific negative $\rho$ — answer by computing $1+(n-1)\rho\ge0$
      mentally, not by guessing. The interviewer is listening for you to
      name the equicorrelated matrix and its eigenvalues, not to reason
      from vague intuition about how correlated things "feel."
    pitfalls: >
      Forgetting the bound only applies to the equicorrelated case (all
      pairs equal $\rho$) — unequal pairwise correlations need the full
      principal-minor or eigenvalue check. Assuming the floor is $-1$ per
      pair rather than the joint $-1/(n-1)$.
    recap: >
      All-pairs correlation $\rho$ among $n$ variables is only possible for
      $\rho\ge-1/(n-1)$, a direct consequence of needing $\Sigma$ to be PSD.
    steps:
      - teach: >
          Not every symmetric matrix with $1$s on the diagonal is a valid
          correlation matrix, only the PSD ones — "can these correlations
          coexist" is literally "is this matrix PSD," answered by finding
          its eigenvalues.
      - teach: >
          The equicorrelated matrix $(1-\rho)I+\rho J$ is worth recognizing
          on sight: $J$ has eigenvalue $n$ on the all-ones direction and
          $0$ elsewhere, so adding $(1-\rho)I$ shifts every eigenvalue up
          by $1-\rho$, giving $1+(n-1)\rho$ once and $1-\rho$ with
          multiplicity $n-1$.
      - ask: >
          For $n=5$ equicorrelated assets, what is the smallest possible
          $\rho$?
        expects: "-0.25"
        hint: >
          Solve $1+(n-1)\rho\ge0$ for $n=5$.
        feedback: >
          $1+4\rho\ge0 \Rightarrow \rho\ge-1/4=-0.25$.
      - teach: >
          The bound's asymmetry has a real intuitive reading: it's easy for
          many things to move together, but hard for many to move against
          each other simultaneously — if $X$ and $Y$ both disagree
          strongly with $Z$, they're forced to agree somewhat with each
          other.
      - ask: >
          For $n=5$, $\rho=-0.3$: what is the resulting eigenvalue
          $1+(n-1)\rho$?
        expects: "-0.2"
        hint: >
          Plug $n=5$, $\rho=-0.3$ directly into $1+(n-1)\rho$.
        feedback: >
          $1+4(-0.3)=1-1.2=-0.2$, negative — so five assets cannot be
          pairwise correlated $-0.3$.
      - ask: >
          Which best explains why five assets cannot be pairwise correlated
          $-0.3$?
        choices:
          - text: >
              Correlations must always be at least $0$
            feedback: >
              Correlations can certainly be negative — just not arbitrarily
              so jointly, for every pair at once.
          - text: >
              The equicorrelated matrix at $\rho=-0.3$, $n=5$ has a
              negative eigenvalue, so it isn't PSD, so it isn't a valid
              correlation matrix
            correct: true
            feedback: >
              Matches the computation directly: $1+4(-0.3)=-0.2<0$.
          - text: >
              $-0.3$ is outside $[-1,1]$
            feedback: >
              $-0.3$ is a perfectly valid single pairwise correlation — the
              issue is requiring it jointly for all pairs.
          - text: >
              Correlation matrices must have determinant $1$
            feedback: >
              Not a real requirement — correlation matrices need only be
              symmetric, PSD, with $1$s on the diagonal.
        feedback: >
          The equicorrelated eigenvalue going negative is exactly the PSD
          failure — the same computation as the previous card, now read as
          an explanation.
      - teach: >
          The bound only applies to the equicorrelated case (all pairs
          equal $\rho$) — unequal pairwise correlations need the full
          principal-minor or eigenvalue check. The floor is the joint
          $-1/(n-1)$, not $-1$ per pair.
      - teach: >
          All-pairs correlation $\rho$ among $n$ variables is only possible
          for $\rho\ge-1/(n-1)$, a direct consequence of needing $\Sigma$
          to be PSD.

  - node: quant-tools.linear-algebra.projection
    hook: >
      Least squares and orthogonal projection are the same picture — the
      closest point in a subspace is the one where the error is invisible to
      that subspace — and once that clicks, the normal equations stop
      looking like they came from nowhere.
    explanation: >
      Minimizing $\lVert b-v\rVert$ over $v\in V$ is calculus-free geometry
      once seen right: if the error $b-\hat b$ had any component still
      inside $V$, subtracting that component off $\hat b$ would get strictly
      closer to $b$. So at the true minimizer the error has zero component
      in every direction of $V$ — orthogonal to all of $V$, which is the
      entire content of $A^{T}(b-\hat b)=0$.

      Turning that into a solvable system uses the identity for moving a
      matrix across a dot product: substituting $\hat b = A\hat x$ turns
      $A^{T}(b-A\hat x)=0$ into $A^{T}A\hat x = A^{T}b$, and independent
      columns of $A$ — the same condition invertibility already needs — is
      exactly what guarantees $A^{T}A$ is invertible, pinning $\hat x$ down
      uniquely.

      Know the projector $P=A(A^{T}A)^{-1}A^{T}$ by its two defining
      properties rather than the formula: $P^{2}=P$ (projecting twice does
      nothing new) and $P^{T}=P$, which together force every eigenvalue of
      $P$ to be $0$ or $1$ and make $\operatorname{tr}P$ literally count the
      dimension of $V$.
    worked: >
      Project $b=(4,3,0)$ onto the line spanned by $a=(1,1,1)$ in
      $\mathbb{R}^{3}$. Here $\hat x=(a^{T}b)/(a^{T}a)=(4+3+0)/3=7/3$, so
      $\hat b=(7/3,7/3,7/3)$. The residual $b-\hat b=(5/3,2/3,-7/3)$ is
      orthogonal to $a$, since $5/3+2/3-7/3=0$.
    interview: >
      "Derive the least-squares formula from scratch" is standard — the
      interviewer wants the orthogonality argument, not memorized algebra.
      "Why must $A^{T}A$ be invertible" tests the link back to independent
      columns.
    pitfalls: >
      Forming normal equations with dependent columns of $A$, silently
      making $A^{T}A$ singular. Forgetting it is $b-\hat b$ (not $b$ itself)
      that is orthogonal to the column space.
    recap: >
      The closest point of a subspace to $b$ is the one whose error is
      orthogonal to it, and writing that as $A^{T}(b-A\hat x)=0$ is exactly
      the normal equations $A^{T}A\hat x=A^{T}b$.
    steps:
      - teach: >
          Minimizing $\lVert b-v\rVert$ over $v\in V$ is calculus-free
          geometry: if the error $b-\hat b$ had any component still inside
          $V$, subtracting that component off $\hat b$ would get strictly
          closer to $b$. So at the minimizer, the error is orthogonal to
          all of $V$.
      - teach: >
          Substituting $\hat b = A\hat x$ turns $A^{T}(b-A\hat x)=0$ into
          the normal equations $A^{T}A\hat x = A^{T}b$; independent columns
          of $A$ — the same condition invertibility needs — is exactly
          what guarantees $A^{T}A$ is invertible.
      - ask: >
          Project $b=(1,5,3)$ onto the line spanned by $a=(1,1,1)$ in
          $\mathbb{R}^{3}$. What is $\hat x=(a^{T}b)/(a^{T}a)$?
        expects: "3"
        hint: >
          Sum the entries of $b$, then divide by $a^{T}a$.
        feedback: >
          $(1+5+3)/3=9/3=3$.
      - teach: >
          Know the projector $P=A(A^{T}A)^{-1}A^{T}$ by its two defining
          properties rather than the formula: $P^{2}=P$ (projecting twice
          does nothing new) and $P^{T}=P$, which together force every
          eigenvalue of $P$ to be $0$ or $1$ and make $\operatorname{tr}P$
          literally count the dimension of $V$.
      - ask: >
          For the same projection, what is the first entry of the residual
          $b-\hat b$?
        expects: "-2"
        hint: >
          $\hat b=(3,3,3)$; subtract entrywise from $b=(1,5,3)$.
        feedback: >
          $1-3=-2$; the full residual $(-2,2,0)$ sums to $0$, confirming
          orthogonality to $a=(1,1,1)$.
      - ask: >
          A projector $P$ onto a $2$-dimensional subspace of
          $\mathbb{R}^{5}$ satisfies $P^{2}=P$ and $P^{T}=P$. What is
          $\operatorname{tr}P$?
        choices:
          - text: >
              $5$
            feedback: >
              That would be projecting onto the whole space.
          - text: >
              $2$
            correct: true
            feedback: >
              $\operatorname{tr}P$ counts the dimension of the subspace
              projected onto, here $2$.
          - text: >
              $0$
            feedback: >
              That's the trace of projecting onto $\{0\}$, not a
              $2$-dimensional subspace.
          - text: >
              Cannot be determined
            feedback: >
              It follows directly from $\dim V$ — no further information
              is needed.
        feedback: >
          $\operatorname{tr}P$ is literally the dimension of the subspace
          $V$ being projected onto, a consequence of $P$'s eigenvalues
          being only $0$ or $1$.
      - teach: >
          Forming normal equations with dependent columns of $A$ silently
          makes $A^{T}A$ singular. It's also $b-\hat b$, not $b$ itself,
          that is orthogonal to the column space — a common mix-up.
      - teach: >
          The closest point of a subspace to $b$ is the one whose error is
          orthogonal to it, and writing that as $A^{T}(b-A\hat x)=0$ is
          exactly the normal equations $A^{T}A\hat x=A^{T}b$.

  - node: quant-tools.linear-algebra.least-squares-fit
    hook: >
      This is orthogonal projection's geometry run as arithmetic — doing it
      once by hand, then checking the residual really is orthogonal to both
      columns, is what makes "orthogonal projection" stop being an
      abstraction.
    explanation: >
      Fitting $y=a+bx$ is projection with a two-column design matrix: the
      first column all $1$s (intercept), the second the $x$-values. The
      normal equations for orthogonal projection, $A^{T}A\hat x=A^{T}b$, are
      the entire computation — nothing new is introduced here beyond
      plugging in.

      $A^{T}A$'s entries are sums the data already gives: $n$, $\sum x_i$,
      $\sum x_i^{2}$; and $A^{T}y$ is $\sum y_i$, $\sum x_iy_i$. Setting
      these sums up correctly is the only place arithmetic actually
      happens — solving the resulting $2\times2$ system is ordinary
      elimination.

      The residual-orthogonality fact from orthogonal projection is exactly
      the diagnostic to run at the end: fitted residuals must sum to zero
      (orthogonal to the intercept column) and satisfy $\sum x_ie_i=0$
      (orthogonal to the slope column). Either failing means the normal
      equations were set up or solved wrong.
    worked: >
      Fit $y=a+bx$ to $(0,1)$, $(1,1)$, $(2,3)$: $n=3$, $\sum x_i=3$, $\sum
      x_i^{2}=5$, $\sum y_i=5$, $\sum x_iy_i=7$. Normal equations
      $3a+3b=5$, $3a+5b=7$ give $2b=2 \Rightarrow b=1$, $a=2/3$. Fitted
      values are $2/3$, $5/3$, $8/3$; residuals $1/3$, $-2/3$, $1/3$ sum to
      $0$ and satisfy $0\cdot\tfrac13+1\cdot(-\tfrac23)+2\cdot\tfrac13=0$.
      The minimized sum of squared residuals is $1/9+4/9+1/9=2/3$.
    interview: >
      "Fit a line to these three points" by hand is a real prompt — go
      straight to the normal-equations sums, not calculus. Checking the
      residuals sum to zero shows you understand what you just computed.
    pitfalls: >
      Confusing $\sum x_iy_i$ with $(\sum x_i)(\sum y_i)$ when building
      $A^{T}y$. Skipping the residual-orthogonality check, which catches
      most arithmetic slips for free.
    recap: >
      Fitting a line projects $y$ onto the span of $1$ and $x$, so the
      normal equations reduce to elementary sums, and the fitted residuals
      must be orthogonal to both columns.
    steps:
      - teach: >
          Fitting $y=a+bx$ is projection with a two-column design matrix:
          the first column all $1$s (intercept), the second the
          $x$-values. The normal equations $A^{T}A\hat x=A^{T}b$ are the
          entire computation, nothing new beyond plugging in.
      - teach: >
          $A^{T}A$'s entries are sums the data already gives — $n$,
          $\sum x_i$, $\sum x_i^{2}$ — and $A^{T}y$ is $\sum y_i$, $\sum
          x_iy_i$. Setting up these sums correctly is the only place
          arithmetic actually happens.
      - ask: >
          Fit $y=a+bx$ to $(0,2)$, $(1,3)$, $(2,3)$. What is the slope $b$?
        expects: "0.5"
        hint: >
          Build the normal equations from $n$, $\sum x_i$, $\sum x_i^{2}$,
          $\sum y_i$, $\sum x_iy_i$, then eliminate $a$.
        feedback: >
          $n=3$, $\sum x_i=3$, $\sum x_i^{2}=5$, $\sum y_i=8$, $\sum
          x_iy_i=9$; the normal equations $3a+3b=8$, $3a+5b=9$ give
          $2b=1$, so $b=0.5$.
      - teach: >
          The residual-orthogonality fact from orthogonal projection is
          exactly the diagnostic to run at the end: fitted residuals must
          sum to zero (orthogonal to the intercept column) and satisfy
          $\sum x_ie_i=0$ (orthogonal to the slope column).
      - ask: >
          For the same fit ($a=13/6$, $b=1/2$), what is the residual at
          $x=0$?
        expects: "-1/6"
        tolerance: 0.005
        hint: >
          Compute the fitted value at $x=0$ — that's just the intercept
          $a$ — then subtract it from the observed $y=2$.
        feedback: >
          The fitted value at $x=0$ is $a=13/6$; the residual is
          $2-13/6=12/6-13/6=-1/6$.
      - ask: >
          After fitting a line to $x=0,1,2$, the reported residuals are
          $2/3$, $-1/3$, $2/3$. Are these plausible?
        choices:
          - text: >
              Yes, since they're all reasonably small
            feedback: >
              Size doesn't validate residuals — orthogonality to both
              columns does.
          - text: >
              No — they don't sum to zero, so they can't be orthogonal to
              the intercept column; the normal equations were solved wrong
            correct: true
            feedback: >
              $2/3-1/3+2/3=1\ne0$: this residual vector fails the very
              first diagnostic.
          - text: >
              Yes, since $x=0,1,2$ is a valid design
            feedback: >
              A valid design doesn't validate an arbitrary residual
              vector — the residuals themselves must pass the
              orthogonality check.
          - text: >
              Cannot tell without recomputing $A^{T}A$
            feedback: >
              The sum-to-zero check alone already catches this, no need to
              redo the whole computation.
        feedback: >
          Residuals that don't sum to zero can't be orthogonal to the
          all-ones column, which the normal equations guarantee — so
          something in the fit was computed wrong.
      - teach: >
          Confusing $\sum x_iy_i$ with $(\sum x_i)(\sum y_i)$ when building
          $A^{T}y$ is the standard slip. Skipping the residual-orthogonality
          check throws away a diagnostic that catches most arithmetic
          errors for free.
      - teach: >
          Fitting a line projects $y$ onto the span of $1$ and $x$, so the
          normal equations reduce to elementary sums, and the fitted
          residuals must be orthogonal to both columns.

  - node: quant-tools.linear-algebra.pca
    hook: >
      "PCA" sounds like a separate machine-learning topic, but on the
      interview it's pure linear algebra — diagonalize the covariance
      matrix — dressed up in the language of "explained variance."
    explanation: >
      The Rayleigh quotient already answered "which direction maximizes
      variance": the top eigenvector of $\Sigma$. PCA applies that fact
      repeatedly — after restricting to vectors orthogonal to $q_1$, the
      same maximization on the remaining space is again solved by an
      eigenvector, this time for the second-largest eigenvalue, and so on
      down the spectrum.

      Uncorrelatedness of the component scores $q_i^{T}X$ is not an extra
      assumption — it falls out of orthogonality of the $q_i$ for distinct
      eigenvalues, from the spectral theorem, combined with $\Sigma$ being
      diagonal in that basis, so two different components literally cannot
      share variance.

      "Variance explained" is the eigenvalues renormalized to sum to $1$,
      since $\sum_i\lambda_i=\operatorname{tr}\Sigma$ is the total variance
      across all original coordinates — trace is basis-independent, so this
      total doesn't depend on which orthonormal directions were chosen.
      Keeping the top $k$ components is choosing the $k$-dimensional
      subspace capturing the most variance possible, orthogonal projection's
      "closest subspace" idea applied to variance instead of distance.
    worked: >
      Covariance matrix $\Sigma$ with rows $(5,4)$ and $(4,5)$:
      $\operatorname{tr}\Sigma=10$, $\det\Sigma=9$, so $\lambda=5\pm4=9,1$.
      For $\lambda_1=9$: $\Sigma-9I$ has rows $(-4,4)$ and $(4,-4)$, giving
      $q_1=(1,1)/\sqrt2$. Total variance is $10$, so the first component
      alone explains $9/10=90\%$ of it.
    interview: >
      "What is PCA, in one sentence" is answered by "eigendecompose the
      covariance matrix; the top eigenvectors are the directions of maximal
      variance." A follow-up on why components are uncorrelated should
      trigger the orthogonality argument, not a hand-wave.
    pitfalls: >
      Running PCA on raw variables of very different scales without
      standardizing — components then chase whichever variable has the
      largest numerical variance. Treating "explained variance" as
      predictive usefulness rather than spread — a high-variance direction
      can be pure noise.
    recap: >
      PCA is the covariance matrix's spectral decomposition: eigenvectors
      are the uncorrelated directions of maximal variance, eigenvalues are
      how much variance each carries, and $\lambda_k/\operatorname{tr}
      \Sigma$ is the share explained.
    steps:
      - teach: >
          The Rayleigh quotient already answered "which direction maximizes
          variance": the top eigenvector of $\Sigma$. PCA applies that fact
          repeatedly — restrict to vectors orthogonal to $q_1$, maximize
          again, and the answer is the eigenvector for the second-largest
          eigenvalue, and so on.
      - teach: >
          Uncorrelatedness of the component scores $q_i^{T}X$ is not an
          extra assumption — it falls out of orthogonality of the $q_i$
          for distinct eigenvalues, from the spectral theorem, combined
          with $\Sigma$ being diagonal in that basis.
      - ask: >
          Covariance matrix $\Sigma$ has rows $(6,2)$ and $(2,3)$. What is
          $\lambda_{\max}$?
        expects: "7"
        hint: >
          Read $\operatorname{tr}\Sigma$ and $\det\Sigma$, then solve the
          quadratic.
        feedback: >
          $\operatorname{tr}\Sigma=9$, $\det\Sigma=18-4=14$, so
          $\lambda=4.5\pm\sqrt{20.25-14}=4.5\pm2.5$, giving $\lambda=7,2$.
      - teach: >
          "Variance explained" is the eigenvalues renormalized to sum to
          $1$, since $\sum_i\lambda_i=\operatorname{tr}\Sigma$ is the total
          variance — trace is basis-independent, so this total doesn't
          depend on which orthonormal directions were chosen.
      - ask: >
          For the same $\Sigma$, what fraction of the total variance does
          the first principal component explain?
        expects: "7/9"
        tolerance: 0.005
        hint: >
          Divide $\lambda_{\max}$ by $\operatorname{tr}\Sigma$.
        feedback: >
          $\lambda_{\max}=7$ and $\operatorname{tr}\Sigma=9$, so the share
          is $7/9\approx0.78$.
      - ask: >
          PCA is run on two variables measured in very different units
          (one in dollars, one in basis points) without standardizing
          first. What happens?
        choices:
          - text: >
              The components are unaffected, since PCA is scale-invariant
            feedback: >
              False — PCA is not scale-invariant, which is exactly the
              caveat here.
          - text: >
              The components chase whichever variable has the largest
              numerical variance, regardless of real importance
            correct: true
            feedback: >
              A variable's raw numerical scale directly inflates its
              contribution to $\Sigma$'s eigenvectors.
          - text: >
              PCA fails to run at all on mismatched units
            feedback: >
              It still runs — it just gives a scale-driven, likely
              misleading answer.
          - text: >
              The eigenvalues become negative
            feedback: >
              $\Sigma$ stays PSD regardless of units; the problem is which
              direction dominates, not the sign of the eigenvalues.
        feedback: >
          Standardize first when variables are on different scales, or PCA
          simply reports which variable happens to have the largest raw
          variance.
      - teach: >
          Treating "explained variance" as predictive usefulness rather
          than spread is the other trap — a high-variance direction can be
          pure noise.
      - teach: >
          PCA is the covariance matrix's spectral decomposition:
          eigenvectors are the uncorrelated directions of maximal
          variance, eigenvalues are how much variance each carries, and
          $\lambda_k/\operatorname{tr}\Sigma$ is the share explained.

  - node: quant-tools.linear-algebra.diagonalization-powers
    hook: >
      "What happens after many steps" — a Markov chain settling down, a
      recursion's growth rate, a risk factor's persistence — is always
      answered the same way: diagonalize once, then powers are free.
    explanation: >
      The substitution is short but worth deriving: if $A=PDP^{-1}$ then
      $A^{2}=PDP^{-1}PDP^{-1}=PD^{2}P^{-1}$, since the middle $P^{-1}P$
      cancels — the same cancellation telescopes for any $k$, so computing
      $A^{k}$, normally expensive, costs exactly one entrywise diagonal
      power $D^{k}$ sandwiched between a change of basis and its inverse.

      Existence of $P$ needs $n$ independent eigenvectors, guaranteed when
      the $n$ eigenvalues are distinct (eigenvectors for distinct
      eigenvalues are always independent) or when $A$ is symmetric (the
      spectral theorem's orthonormal basis is in particular independent) —
      but not in general, since a repeated eigenvalue can leave the
      eigenspace too small to span the space.

      The practically useful reading: since $D^{k}$ raises each eigenvalue
      to the $k$, the entries of $A^{k}$ are eventually dominated by
      whichever $|\lambda|$ is largest. Every $|\lambda|<1$ drives
      $A^{k}\to0$; a $|\lambda|=1$ eigenvalue survives while the rest decay;
      any $|\lambda|>1$ blows up — the entire content of "does this
      recursion converge" before any numbers are plugged in.
    worked: >
      $A$ has rows $(3,1)$ and $(0,2)$ — upper triangular, so eigenvalues
      are the diagonal entries $3,2$. For $\lambda=3$: $A-3I$ has rows
      $(0,1)$ and $(0,-1)$, eigenvector $(1,0)$. For $\lambda=2$: $A-2I$ has
      rows $(1,1)$ and $(0,0)$, eigenvector $(1,-1)$. With $D^{2}=
      \operatorname{diag}(9,4)$, computing $PD^{2}P^{-1}$ gives $A^{2}$ with
      rows $(9,5)$ and $(0,4)$ — matching direct multiplication of $A$ by
      itself.
    interview: >
      "Does this Markov chain or recursion converge, and to what" is
      diagonalization in disguise — answer in terms of the largest
      $|\lambda|$ before doing any actual multiplication. Being asked to
      state the long-run behaviour without computing a single power is the
      real test of whether you understand the eigenvalue story, not just
      the algebra.
    pitfalls: >
      Assuming every matrix is diagonalizable — a repeated eigenvalue with a
      deficient eigenspace (rows $(1,1)$, $(0,1)$) needs Jordan form
      instead. Computing $PD^{k}$ alone and forgetting the outer $P^{-1}$,
      which is not $A^{k}$.
    recap: >
      Diagonalizing turns matrix powers into scalar powers of the
      eigenvalues sandwiched by a fixed change of basis, and the largest
      $|\lambda|$ alone decides whether $A^{k}$ decays, stabilizes, or blows
      up.
    steps:
      - teach: >
          The substitution is short: if $A=PDP^{-1}$ then
          $A^{2}=PDP^{-1}PDP^{-1}=PD^{2}P^{-1}$, since the middle $P^{-1}P$
          cancels — the same cancellation telescopes for any $k$, so
          computing $A^{k}$ costs one entrywise diagonal power $D^{k}$
          sandwiched between a change of basis and its inverse.
      - teach: >
          Existence of $P$ needs $n$ independent eigenvectors, guaranteed
          when the eigenvalues are distinct or when $A$ is symmetric — but
          not in general, since a repeated eigenvalue can leave the
          eigenspace too small to span the space.
      - ask: >
          Upper-triangular $A$ has rows $(4,1)$ and $(0,3)$. What is the
          larger eigenvalue?
        expects: "4"
        hint: >
          For a triangular matrix, the eigenvalues are read straight off
          the diagonal.
        feedback: >
          $A$ is upper triangular, so its eigenvalues are its diagonal
          entries: $4$ and $3$.
      - teach: >
          Since $D^{k}$ raises each eigenvalue to the $k$, the entries of
          $A^{k}$ are eventually dominated by whichever $|\lambda|$ is
          largest: every $|\lambda|<1$ drives $A^{k}\to0$, a $|\lambda|=1$
          eigenvalue survives while the rest decay, and any $|\lambda|>1$
          blows up.
      - ask: >
          For the same $A$, what is the $(1,1)$ entry of $A^{2}$?
        expects: "16"
        hint: >
          For this triangular matrix, the diagonal of $A^{k}$ is just the
          diagonal entries raised to the $k$.
        feedback: >
          $(A^{2})_{11}=4^{2}=16$ — the $(1,1)$ entry stays on the
          diagonal path since $A$ is triangular.
      - ask: >
          A matrix has eigenvalues $0.5$ and $1.2$. What happens to $A^{k}$
          as $k\to\infty$?
        choices:
          - text: >
              $A^{k}\to0$
            feedback: >
              That's only true if every $|\lambda|<1$ — here $1.2>1$.
          - text: >
              $A^{k}$ stabilizes to a fixed nonzero matrix
            feedback: >
              That's the $|\lambda|=1$ case, which doesn't apply here.
          - text: >
              $A^{k}$ blows up, dominated by the eigenvalue $1.2$
            correct: true
            feedback: >
              Any $|\lambda|>1$ drives its term of $A^{k}$ to infinity, and
              it dominates the $0.5^{k}\to0$ term.
          - text: >
              $A^{k}$ oscillates forever without growing or shrinking
            feedback: >
              That pattern needs a complex eigenvalue of modulus exactly
              $1$, not what's given here.
        feedback: >
          The largest $|\lambda|$ decides the long-run behavior before any
          numbers are plugged in — here $1.2>1$ means unbounded growth.
      - teach: >
          Assuming every matrix is diagonalizable is the recurring error —
          a repeated eigenvalue with a deficient eigenspace needs Jordan
          form instead. Computing $PD^{k}$ alone and forgetting the outer
          $P^{-1}$ is not $A^{k}$.
      - teach: >
          Diagonalizing turns matrix powers into scalar powers of the
          eigenvalues sandwiched by a fixed change of basis, and the
          largest $|\lambda|$ alone decides whether $A^{k}$ decays,
          stabilizes, or blows up.

  - node: quant-tools.linear-algebra.fibonacci-matrix
    hook: >
      This is the pattern behind every "closed form for a linear recurrence"
      question — Fibonacci is just the cleanest instance, reducing to a
      $2\times2$ eigenvalue computation you already know cold.
    explanation: >
      Turning a scalar recurrence into a matrix power is the reusable move,
      more than Fibonacci itself: any recurrence expressible as (next state)
      $=A\cdot$(current state) becomes, after $n$ steps, (state after $n$
      steps) $=A^{n}\cdot$(initial state) — diagonalization then gives a
      closed form for any such recurrence, not just this one.

      The golden ratio falls out exactly the way any $2\times2$ eigenvalue
      does — trace $1$, determinant $-1$, quadratic formula — with no
      special theory involved. The two roots $\varphi\approx1.618$ and
      $\psi\approx-0.618$ have $|\psi|<1$, which is what makes $\psi^{n}$
      negligible for large $n$: $F_n$ tracks $\varphi^{n}/\sqrt5$ almost
      exactly, and $F_{n+1}/F_n\to\varphi$ is just dominant-eigenvalue
      behaviour, from diagonalization, applied here.

      Cassini's identity is a one-line bonus once thinking in determinants
      rather than recurrences: $\det(A^{n})=(\det A)^{n}$ always, and
      reading the left side off the entries of $A^n$ gives
      $F_{n+1}F_{n-1}-F_n^{2}$ directly.
    worked: >
      For $n=8$: $A^{2}$ has rows $(2,1)$ and $(1,1)$; squaring,
      $A^{4}=(A^{2})^{2}$ has rows $(5,3)$ and $(3,2)$; squaring again,
      $A^{8}=(A^{4})^{2}$ has rows $(34,21)$ and $(21,13)$. Reading the
      $(1,2)$ entry, $F_8=21$, matching Binet's formula since
      $\varphi^{8}\approx46.979$ and $\psi^{8}\approx0.021$ give
      $(46.979-0.021)/\sqrt5\approx21$.
    interview: >
      "Find a closed form for $F_n$" or "solve this linear recurrence" is
      answered by writing the state as a matrix power and diagonalizing —
      say the matrix and its eigenvalues immediately rather than guessing a
      pattern from small cases. A fast follow-up is $F_{n+1}/F_n\to\varphi$,
      which should come straight out of the dominant eigenvalue, not a
      separate memorized fact.
    pitfalls: >
      Reading off the wrong entry of $A^{n}$ for $F_n$ versus $F_{n+1}$.
      Assuming Cassini's identity needs induction — it is one line from
      $\det(A^{n})=(\det A)^{n}$.
    recap: >
      Writing the Fibonacci recursion as a matrix power turns Binet's
      formula, the golden-ratio growth rate, and Cassini's identity into
      three corollaries of diagonalizing one $2\times2$ matrix.
    steps:
      - teach: >
          Turning a scalar recurrence into a matrix power is the reusable
          move: any recurrence expressible as (next state)$=A\cdot$(current
          state) becomes, after $n$ steps, (state after $n$
          steps)$=A^{n}\cdot$(initial state) — diagonalization then gives a
          closed form for any such recurrence, not just this one.
      - teach: >
          The golden ratio falls out exactly the way any $2\times2$
          eigenvalue does — trace $1$, determinant $-1$, quadratic formula
          — with no special theory. Since $|\psi|<1$, $\psi^{n}$ becomes
          negligible for large $n$, so $F_n$ tracks $\varphi^{n}/\sqrt5$
          almost exactly.
      - ask: >
          What is $F_6$ (with $F_0=0$, $F_1=1$)?
        expects: "8"
        hint: >
          Build up the sequence $0,1,1,2,3,5,\dots$.
        feedback: >
          $F_2=1,F_3=2,F_4=3,F_5=5,F_6=8$ — or read the $(1,2)$ entry of
          $A^{6}$.
      - teach: >
          Cassini's identity is a one-line bonus once thinking in
          determinants rather than recurrences: $\det(A^{n})=(\det A)^{n}$
          always, and reading the left side off the entries of $A^{n}$
          gives $F_{n+1}F_{n-1}-F_n^{2}$ directly.
      - ask: >
          Using Cassini's identity, what is $F_7F_5-F_6^{2}$?
        expects: "1"
        hint: >
          This is just $(\det A)^{n}$ for $n=6$.
        feedback: >
          $(\det A)^{6}=(-1)^{6}=1$; directly, $13\cdot5-8^{2}=65-64=1$.
      - ask: >
          What does $F_{n+1}/F_n$ converge to as $n\to\infty$, and why?
        choices:
          - text: >
              $1$, since Fibonacci ratios eventually stop changing
            feedback: >
              They keep changing — they just converge to something other
              than $1$.
          - text: >
              $\varphi\approx1.618$, the dominant eigenvalue of $A$, since
              $|\psi|<1$ makes its term vanish
            correct: true
            feedback: >
              Exactly dominant-eigenvalue behavior from diagonalization,
              applied here.
          - text: >
              $\psi\approx-0.618$
            feedback: >
              $\psi$ is the eigenvalue whose term *vanishes*, not the
              dominant one.
          - text: >
              It diverges to infinity
            feedback: >
              The ratio converges; only $F_n$ itself grows without bound.
        feedback: >
          $F_{n+1}/F_n\to\varphi$ is exactly the largest-$|\lambda|$
          behavior of diagonalization: the $\psi^{n}$ term vanishes since
          $|\psi|<1$.
      - teach: >
          Reading off the wrong entry of $A^{n}$ for $F_n$ versus $F_{n+1}$
          is the standard slip. Cassini's identity doesn't need induction —
          it is one line from $\det(A^{n})=(\det A)^{n}$.
      - teach: >
          Writing the Fibonacci recursion as a matrix power turns Binet's
          formula, the golden-ratio growth rate, and Cassini's identity
          into three corollaries of diagonalizing one $2\times2$ matrix.

  - node: quant-tools.linear-algebra.matrix-square-root
    hook: >
      Generating correlated random draws from independent noise is a
      constant simulation task, and the entire method is one factorization —
      Cholesky — applied to whatever covariance matrix you're handed.
    explanation: >
      The eigenvalue square root $A^{1/2}=Q\Lambda^{1/2}Q^{T}$ is the
      conceptually clean answer — it exists because PSD guarantees every
      $\lambda_i\ge0$, so $\sqrt{\lambda_i}$ is real — but it costs a full
      eigendecomposition, expensive in practice.

      Cholesky is the practical substitute, trading "any square root" for
      one specific triangular one: because $A$ is symmetric, $L$'s
      lower-triangular entries can be found one at a time, top-left down,
      each solved from a single equation involving only previously found
      entries — cheap, and unique once the diagonal is required positive.

      The simulation use is the point of learning this: if $z$ has
      independent, unit-variance entries, then $Lz$ has covariance
      $\mathbb{E}[(Lz)(Lz)^{T}] = L\,\mathbb{E}[zz^{T}]\,L^{T} = LL^{T} = A$
      — Cholesky turns a target covariance matrix directly into the linear
      transform manufacturing it, and the factorization failing partway (a
      negative number under a square root) is itself the diagnostic that
      the input wasn't PSD.
    worked: >
      Take the correlation matrix with rows $(1,0.8)$ and $(0.8,1)$. Then
      $L_{11}=\sqrt1=1$, $L_{21}=0.8/L_{11}=0.8$, and
      $L_{22}=\sqrt{1-0.8^{2}}=\sqrt{0.36}=0.6$, so $L$ has rows $(1,0)$ and
      $(0.8,0.6)$. Checking $LL^{T}$: $(2,2)$ entry is $0.64+0.36=1$ and
      $(2,1)$ entry is $0.8$ — reproducing the original matrix.
    interview: >
      "How would you simulate two variables with correlation $0.8$ from a
      random-normal generator" is answered by writing down exactly this $L$
      and applying it to independent draws — be ready to explain why
      $LL^{T}=A$ makes it work. A common follow-up asks what goes wrong if
      the input "correlation matrix" isn't actually valid, listening for
      "the square root under $L_{22}$ goes negative."
    pitfalls: >
      Applying Cholesky to a matrix that isn't PSD and being surprised by a
      negative number under a square root — that failure is informative,
      not a bug. Forgetting the factorization is unique only when positive
      definite; a singular PSD matrix still factors, but $L$ isn't unique.
    recap: >
      Cholesky writes any PSD matrix as $LL^{T}$ with $L$ lower triangular,
      and applying $L$ to independent unit-variance noise is the standard
      way to manufacture draws with a prescribed covariance.
    steps:
      - teach: >
          The eigenvalue square root $A^{1/2}=Q\Lambda^{1/2}Q^{T}$ is the
          conceptually clean answer — it exists because PSD guarantees
          every $\lambda_i\ge0$, so $\sqrt{\lambda_i}$ is real — but it
          costs a full eigendecomposition, expensive in practice.
      - teach: >
          Cholesky is the practical substitute, trading "any square root"
          for one specific triangular one: because $A$ is symmetric, $L$'s
          lower-triangular entries can be found one at a time, top-left
          down, each solved from a single equation involving only
          previously found entries.
      - ask: >
          For the correlation matrix with rows $(1,0.28)$ and
          $(0.28,1)$, what is $L_{21}$ in its Cholesky factor?
        expects: "0.28"
        hint: >
          $L_{21}=a_{21}/L_{11}$, and $L_{11}=\sqrt{a_{11}}$.
        feedback: >
          $L_{11}=\sqrt1=1$, so $L_{21}=0.28/1=0.28$.
      - teach: >
          The simulation use is the point of learning this: if $z$ has
          independent, unit-variance entries, then $Lz$ has covariance
          $\mathbb{E}[(Lz)(Lz)^{T}]=LL^{T}=A$ — Cholesky turns a target
          covariance matrix directly into the linear transform
          manufacturing it.
      - ask: >
          For the same matrix, what is $L_{22}$?
        expects: "0.96"
        hint: >
          $L_{22}=\sqrt{1-L_{21}^{2}}$.
        feedback: >
          $L_{22}=\sqrt{1-0.28^{2}}=\sqrt{1-0.0784}=\sqrt{0.9216}=0.96$.
      - ask: >
          You attempt a Cholesky factorization of a claimed correlation
          matrix and hit a negative number under a square root partway
          through. What does that mean?
        choices:
          - text: >
              A rounding error — retry with more decimal places
            feedback: >
              This isn't a numerical-precision artifact — it's structural.
          - text: >
              The input wasn't actually a valid (PSD) covariance or
              correlation matrix
            correct: true
            feedback: >
              A failed factorization is exactly the diagnostic the node
              describes — informative, not a bug to route around.
          - text: >
              Cholesky simply doesn't exist for correlation matrices
            feedback: >
              It exists for every PD correlation matrix; the failure here
              is informative about this particular input.
          - text: >
              The matrix needs to be transposed first
            feedback: >
              Transposing a symmetric matrix changes nothing.
        feedback: >
          A negative number under the square root during Cholesky is the
          factorization itself telling you the input wasn't PSD.
      - teach: >
          Applying Cholesky to a matrix that isn't PSD and being surprised
          by a negative number under a square root is the recurring
          confusion. The factorization is also unique only when positive
          definite — a singular PSD matrix still factors, but $L$ isn't
          unique.
      - teach: >
          Cholesky writes any PSD matrix as $LL^{T}$ with $L$ lower
          triangular, and applying $L$ to independent unit-variance noise
          is the standard way to manufacture draws with a prescribed
          covariance.
