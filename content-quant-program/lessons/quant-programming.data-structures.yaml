unit: quant-programming.data-structures
opening: >
  Data structures are the vocabulary the rest of the programming units are
  written in: which container you reach for decides whether a solution is
  $O(n)$ or $O(n^{2})$, long before any algorithm gets clever. This unit works
  outward from the two basic access patterns — arrays and linked lists —
  through hash maps and heaps, then stacks, queues and balanced trees,
  building toward the structures interviewers name directly: top-k over a
  stream, the running median, and the LRU cache, each a composition of pieces
  taught earlier in the unit. It closes by turning "which structure" into a
  habit — asking what minimal state answers the running query — since that
  question, not a memorized list, is what a streaming problem is actually
  testing.
lessons:
  - node: quant-programming.data-structures.array-linked-list
    hook: >
      Whether an interviewer expects an array or a linked list for a given
      operation is rarely stated outright — it's read off which operation the
      problem repeats, and getting that read backwards costs an order of
      magnitude.
    explanation: >
      Contiguity is the whole story for arrays: index $i$ sits at a fixed
      offset from the start, so reading or writing $a[i]$ is $O(1)$, and
      every element sits next to its neighbors in memory, which is why
      scanning an array is fast in practice and not just in Big-O. Inserting
      or deleting in the middle breaks that contiguity — every element after
      the gap has to shift one slot to keep the array packed, an $O(n)$ pass.

      A singly linked list buys the opposite trade: each node is its own
      allocation holding a value and a pointer to the next node, so splicing
      a node in or out beside a node you already hold is $O(1)$ — two pointer
      writes, no shifting. The catch is getting there: without random
      access, reaching the $k$-th node means walking $k$ pointers from the
      head, $O(n)$, and scattered allocations make even a full scan slower
      in practice than an array scan of the same size.

      Dynamic arrays (Python's list, C++'s vector, Java's ArrayList) soften
      the array's weak spot at one end: doubling the backing array on
      overflow makes a single resize $O(n)$, but spreading that cost over
      every push since the last resize makes appending $O(1)$ amortized, not
      the $O(n)$ per push a fixed-size array would force. Default to an
      array whenever the job is scanning, indexing, or appending at the end;
      reach for a linked list only when the problem hands you a held
      position and asks you to splice there repeatedly.
    worked: >
      Insert a new item at index 2 of a 6-element array
      [10, 20, 30, 40, 50, 60]: the four elements at indices 2 through 5 each
      shift one slot right before the new value lands, four moves total. If
      those same six items were a singly linked list and you already held a
      pointer to the node before index 2, the same insertion is two pointer
      writes — no shifting — and that cost stays two pointer writes whether
      the list holds 6 elements or 6 million; the array's cost scales with
      how much sits after the gap.
    interview: >
      Comes up as "array or linked list here" attached to a specific access
      pattern — random access into the middle, or repeated insertion at a
      held position — and the interviewer listens for you naming which
      operation dominates, not stating a memorized preference. A common
      follow-up asks about a dynamic array's resize cost, testing whether you
      defend $O(1)$ amortized append rather than treating one $O(n)$ resize
      as disqualifying.
    pitfalls: >
      Claiming a linked list is faster to insert into without accounting for
      how you got to that position — if you don't already hold a pointer to
      the splice point, finding it is $O(n)$, erasing the entire advantage.
      Citing "resize is $O(n)$" as a reason to avoid dynamic arrays for
      appends, without the amortized argument that spreads that cost over
      every push since the last resize.
    recap: >
      Arrays win on access, indexing, and locality; a linked list only wins
      at a splice point you already hold a reference to.
    dialogue:
      - part: A bid that has to squeeze in
        teach: >
          You keep a desk's resting bids as a packed array sorted best first,
          eight prices at indices $0$ through $7$:
          $[101, 100, 99, 97, 96, 95, 93, 90]$. A new bid at $98$ arrives and
          has to go in its sorted place, with no gaps left in the array.
      - ask: >
          How many of the eight existing bids have to move one slot to make
          room for the $98$?
        expects: "5"
        hint: >
          Find the index the $98$ must occupy, then count everything at that
          index or later.
        feedback: >
          The $98$ belongs between $99$ (index $2$) and $97$ (index $3$), so it
          takes index $3$. The bids at indices $3$ through $7$ — that is $97$,
          $96$, $95$, $93$, $90$ — each shift one slot right: $5$ moves.
      - ask: >
          Same desk, a busier day: the packed array holds $1{,}000{,}000$ bids,
          and a new one lands at index $10$. How many existing bids move?
        expects: "999990"
        hint: >
          Indices $10$ through $999{,}999$ all shift.
        feedback: >
          $1{,}000{,}000 - 10 = 999{,}990$ moves to place one bid. The work has
          nothing to do with the new bid and everything to do with how much
          sits after the gap — a full $O(n)$ pass for a near-top insertion.
      - reflect: >
          The $98$ only needs to sit between the $99$ and the $97$. What would
          you have to give up about how the bids are stored so that inserting
          it never touches the $96$, the $95$ or anything after them?
        answer: >
          The requirement that neighbours be neighbours in memory. If each bid
          carries the location of the next bid, "sorted order" lives in those
          links rather than in physical position, and inserting the $98$ means
          rewriting one or two links beside the $99$. What you lose is the
          fixed offset: with no packing, nothing tells you where the sixth bid
          lives except following links from the first.
      - teach: >
          The packed version is an array: elements stored contiguously, so
          element $i$ sits at a fixed offset and reading or writing it is
          $O(1)$, while inserting or deleting in the middle shifts everything
          after the gap, $O(n)$. The linked version is a singly linked list:
          each node holds a value and a pointer to the next node. Splicing
          beside a node you already hold is $O(1)$; reaching the $k$-th node
          means walking $k$ pointers from the head, $O(n)$, and every node is
          its own allocation scattered through memory.

      - part: What the links buy and what they cost
        ask: >
          Store the eight bids as a singly linked list instead, and suppose you
          already hold a pointer to the $99$ node. How many pointer writes
          splice in a new node for $98$?
        expects: "2"
        hint: >
          The new node needs to point somewhere, and something needs to point
          at the new node.
        feedback: >
          Two: the new node's next is set to the $97$ node, then the $99$
          node's next is set to the new node. Do them in that order — the other
          order loses the only pointer to the $97$. Two writes whether the list
          holds eight bids or eight million.
      - ask: >
          Now the risk system asks the linked list for the sixth-best bid.
          Starting at the head, how many nodes do you visit, counting the head
          and the node you stop on?
        expects: "6"
        feedback: >
          Head is the best bid, one hop gives the second, and five hops reach
          the sixth: $6$ nodes visited. The array answers the same question
          by computing one offset and touching one slot.
      - ask: >
          A new bid arrives on the million-node list, and you know only its
          price — no pointer to its neighbour. What does placing it cost?
        choices:
          - text: >
              $O(1)$: linked-list insertion is two pointer writes.
            feedback: >
              The two writes are the end of the job, not the job. Without a
              held pointer you must first find the node it goes behind, and on
              a list the only way to find it is to walk from the head.
          - text: >
              $O(\log n)$: the list is sorted, so binary search finds the spot.
            feedback: >
              Binary search jumps to the middle element, and a list has no
              middle to jump to — reaching node $n/2$ is itself $n/2$ hops. A
              sorted list is searched linearly.
          - text: >
              $O(n)$: walk to find the spot, then an $O(1)$ splice.
            correct: true
            feedback: >
              Right. The splice is cheap, the search is not, and the search
              dominates. The packed array also pays $O(n)$ here, but its shift
              runs over contiguous memory, which is several times faster in
              practice than chasing a million scattered pointers.
        feedback: >
          A linked list's one advantage is splicing at a position you already
          hold. Hand it only a value or an index and it pays the walk, which is
          the same $O(n)$ as the array's shift, done more slowly.

      - part: Growing at the end
        teach: >
          The fill log is different: fills are only ever appended at the end
          and later scanned. You store it in a dynamic array, which doubles its
          backing buffer when an append finds it full and copies every stored
          element across. Right now its capacity is $16$ and it holds $16$
          fills.
      - ask: >
          The $17$th fill arrives. How many element copies does that one append
          perform?
        expects: "16"
        feedback: >
          The buffer is full, so a new buffer of capacity $32$ is allocated and
          all $16$ existing fills are copied into it before the new one is
          written: $16$ copies, an $O(n)$ append.
      - ask: >
          An interviewer pushes back: "so append is $O(n)$ in the worst case,
          and a linked list appends in $O(1)$ — use the list." What is the
          answer?
        choices:
          - text: >
              Agree: an $O(n)$ worst case disqualifies the array for a log.
            feedback: >
              Count the copies across the whole run: the $17$th append copies
              $16$, and appends $18$ through $32$ copy nothing. $16$ copies
              over $16$ appends is $1$ per append, and every later doubling
              gives the same average.
          - text: >
              The resize is $O(n)$ but happens only after $n$ cheap appends, so
              appending is $O(1)$ amortized and the log keeps array locality.
            correct: true
            feedback: >
              That is the amortized argument: the $16$ copies are paid for by
              the $16$ appends that filled the buffer. The array keeps
              contiguous memory for the scan, which the list gives up.
          - text: >
              Avoid the resize by preallocating a buffer of a million slots.
            feedback: >
              That works only if you know the final size in advance, and it
              misses the point: doubling already makes the average append
              $O(1)$ without guessing a bound.
        feedback: >
          Resizes are rare in exactly the proportion that makes them cheap on
          average. A single $O(n)$ append is not a reason to abandon an array
          whose average append is $O(1)$.

      - part: Which one the problem is asking for
        ask: >
          Three workloads. (a) Read prices by position in a fixed historical
          series, a million times. (b) A text editor that holds a cursor and
          inserts characters at it, over and over. (c) Insert into a sorted
          sequence given only the value to insert. Which of them does a linked
          list actually win?
        choices:
          - text: >
              (a) and (c)
            feedback: >
              (a) is pure indexing, the array's $O(1)$ against the list's
              $O(n)$ walk. (c) hands you a value, not a position, so the list
              must walk to the spot first.
          - text: >
              (b) only
            correct: true
            feedback: >
              Only (b) holds a position and splices there repeatedly. The
              cursor is the held pointer, so each keystroke is an $O(1)$ splice
              where an array would shift everything after the cursor.
          - text: >
              (b) and (c)
            feedback: >
              (c) looks like (b) but lacks the held pointer. Finding the
              insertion point is an $O(n)$ walk, so the list's $O(1)$ splice
              never gets a chance to matter.
          - text: >
              None: arrays always win in practice.
            feedback: >
              Not in (b). With a cursor held and edits concentrated there, an
              array shifts the whole tail of the document on every keystroke,
              and the list pays two pointer writes.
        feedback: >
          Read the workload, not the structure's reputation: which operation
          repeats, and does the problem hand you a position or only a value?
          A list wins only when it holds the splice point. Everything else —
          scanning, indexing, appending at the end — wants the array.

  - node: quant-programming.data-structures.doubly-linked-list
    hook: >
      A singly linked list makes splicing right after a held node cheap —
      removing that same node is the case that breaks it, and it's exactly
      the gap that shows up wherever a cache needs to evict something.
    explanation: >
      A singly linked list's next-pointer is enough to insert right after a
      held node, but removing that node needs its predecessor — the node's
      own pointer only reaches forward, so finding the one behind it means
      walking from the head, $O(n)$. A doubly linked list closes that gap by
      giving every node a second pointer, back to its predecessor, so a held
      reference alone is enough to unlink or relink it in either direction,
      no walk required.

      Removing node $C$ from the chain A, B, C, D (each pair linked both
      ways) is two pointer writes regardless of where $C$ sits or how long
      the chain is: $B$'s next becomes $D$, and $D$'s previous becomes $B$.
      That $O(1)$ cost is bought at a fixed price per node — two pointers of
      bookkeeping instead of one — paid on every node whether or not it's
      ever removed from the middle.

      This is the piece that makes $O(1)$ eviction possible in a structure
      like an LRU cache: a companion index, typically a hash map, supplies
      the node reference in $O(1)$, and the doubly linked list then does the
      unlink-and-relink in $O(1)$ without scanning for a predecessor. Neither
      piece alone gets there — the index finds the node, the list moves it.
    worked: >
      Removing a middle order from a processing queue held as the doubly
      linked chain A, B, C, D, E, given a held reference to $C$: read $C$'s
      previous ($B$) and next ($D$), set $B$'s next to $D$ and $D$'s
      previous to $B$, then discard $C$ — two pointer writes, whether the
      chain holds 5 nodes or 5 million. In a singly linked version of the
      same chain, finding $B$ from $C$ alone is impossible without a second
      pass from the head, an $O(n)$ walk.
    interview: >
      Comes up directly inside "design an LRU cache" and any "remove this
      node given a pointer to it" phrasing — the interviewer checks whether
      you reach for a doubly linked list unprompted once removal, not just
      insertion, is on the table, and whether you can say in one sentence
      why a singly linked list forces an $O(n)$ walk for the same removal.
    pitfalls: >
      Updating only one of the two neighbor pointers when unlinking a node —
      a stale prev or next corrupts the list even though the visible half
      looks fine. Assuming the doubly linked list gives $O(1)$ search — it
      doesn't; you still need something else, usually a hash map, to find
      the node before you can remove it in $O(1)$.
    recap: >
      Two pointers per node, one back and one forward, turn removal at a
      held node from an $O(n)$ walk into two $O(1)$ writes.
    dialogue:
      - part: A cancel in the middle of the queue
        teach: >
          At one price level an exchange keeps resting orders in time priority
          as a singly linked list: $501 \to 502 \to 503 \to 504 \to 505 \to 506$.
          A cancel arrives for order $504$, and a lookup table hands you a
          pointer straight to the $504$ node.
      - ask: >
          Which existing pointer has to change for $504$ to drop out of the
          queue?
        choices:
          - text: >
              $504$'s next-pointer, set to null.
            feedback: >
              $504$ is leaving; what its own pointer says no longer matters.
              Nulling it leaves $503$ still pointing at $504$, so a walk from
              the head still reaches the cancelled order.
          - text: >
              $503$'s next-pointer, set to $505$.
            correct: true
            feedback: >
              Right. Membership in the list is "some node points at you", and
              the only node pointing at $504$ is $503$.
          - text: >
              $505$'s pointer back to $504$.
            feedback: >
              A singly linked node has no pointer back. $505$ knows nothing
              about $504$; only $504$'s predecessor does.
        feedback: >
          Removing a node means rewriting its predecessor. You are holding the
          node, not its predecessor.
      - ask: >
          You hold only the $504$ node and the list's head. How many nodes do
          you visit to reach the node whose pointer must change, counting the
          head and the node you stop on?
        expects: "3"
        hint: >
          From $504$, every pointer leads forward. Where is the only place to
          start a walk that passes $503$?
        feedback: >
          $504$ cannot see behind itself, so you walk from the head: $501$,
          $502$, $503$ — $3$ nodes. Had the cancel been for the $600{,}000$th
          order, the walk would visit $599{,}999$. The held pointer saved
          nothing.
      - ask: >
          A colleague suggests a shortcut: copy $505$'s contents into the $504$
          node, then unlink $505$, which only needs the pointer you hold. What
          is wrong with it?
        choices:
          - text: >
              Nothing; it is the standard $O(1)$ removal.
            feedback: >
              It is a known trick and a fragile one. Try it on $506$: there is
              no next node to copy, so the tail cannot be removed this way at
              all.
          - text: >
              It breaks time priority, since $505$ moves forward a place.
            feedback: >
              The values read $501, 502, 503, 505, 506$ afterwards, which is
              exactly the right order. Priority survives; something else does
              not.
          - text: >
              It fails on the tail, and any outside pointer to the $505$ node
              is left pointing at a freed node.
            correct: true
            feedback: >
              Both. The lookup table that maps order $505$ to its node now
              points at a node that was unlinked, while $505$'s data lives in
              what used to be $504$'s node. Node identity matters as soon as
              anything else holds pointers into the list.
        feedback: >
          The honest fix is not a trick on the values. It is to make the
          predecessor reachable from the node itself.
      - reflect: >
          What would each node have to store so that, holding only the $504$
          node, you could remove it without walking from the head?
        answer: >
          A second pointer, back to its predecessor. Then $504$ can reach $503$
          directly, rewrite $503$'s next to $505$, and rewrite $505$'s back
          pointer to $503$ — a fixed amount of work wherever $504$ sits. The
          cost is one more pointer stored on every node, used or not.
      - teach: >
          That structure is a doubly linked list: each node holds a value, a
          pointer to its successor and a pointer to its predecessor. Given a
          reference to a node, removing it or inserting beside it is $O(1)$ in
          either direction, with no walk to find the node behind it. The price
          is two pointers of bookkeeping per node instead of one.

      - part: Counting the writes
        ask: >
          The queue is now doubly linked. Orders $503$ and $504$ cancel
          together, and you hold both nodes. What is the fewest pointer writes
          that removes the pair?
        expects: "2"
        hint: >
          Which surviving nodes have a pointer into the pair?
        feedback: >
          Only $502$ (its next) and $505$ (its previous) point into the pair.
          Write $502$'s next $= 505$ and $505$'s previous $= 502$: two writes,
          the same as removing one node, whether the level holds six orders or
          six hundred thousand. The pointers inside the pair never need
          touching.
      - ask: >
          A late-corrected order $510$ has to sit between $502$ and $503$, and
          you hold both of those nodes. How many pointer writes splice it in?
        expects: "4"
        hint: >
          The new node's two pointers, plus one pointer on each neighbour.
        feedback: >
          $510$'s previous $= 502$, $510$'s next $= 503$, $502$'s next $= 510$,
          $503$'s previous $= 510$: $4$ writes, every one of them fixed by the
          two neighbours, none depending on the list's length.
      - ask: >
          Each node stores an $8$-byte order id and $8$-byte pointers. For
          $1{,}000{,}000$ resting orders, how many more millions of bytes does
          the doubly linked version use than the singly linked one?
        expects: "8"
        feedback: >
          Singly linked: $8 + 8 = 16$ bytes per node. Doubly linked:
          $8 + 8 + 8 = 24$. The extra $8$ bytes on $10^{6}$ nodes is
          $8 \times 10^{6}$ bytes, $8$ million — the standing price of $O(1)$
          removal, paid on every node whether it is ever cancelled or not.

      - part: What the back pointer does not buy
        ask: >
          A cancel arrives for order $505$ carrying only the id, with no
          pointer, and there is no lookup table. What does removal cost on the
          doubly linked queue?
        choices:
          - text: >
              $O(1)$: a doubly linked list removes any node in two writes.
            feedback: >
              Any node you are *holding*. The two writes need the node, and
              with only an id you have to find it first by walking from the
              head.
          - text: >
              $O(n)$: walk to find the node, then two writes.
            correct: true
            feedback: >
              Right. The back pointer removes the walk for the predecessor, not
              the search for the node itself. Something else, usually a hash
              map from id to node, has to supply the reference.
          - text: >
              $O(\log n)$: the ids are in time order, so you can search
              efficiently.
            feedback: >
              Even sorted, a linked list cannot jump to its middle, so there is
              no binary search. Finding a node by value is a linear walk.
        feedback: >
          A doubly linked list makes removal $O(1)$ once you hold the node.
          Pair it with a map from key to node and you have the core of an LRU
          cache: the map finds, the list moves and removes.
      - ask: >
          A buggy cancel removes $504$ by writing $503$'s next $= 505$ and
          stopping there. Afterwards you walk the queue backward from the tail,
          following previous-pointers. What do you see?
        choices:
          - text: >
              $506, 505, 503, 502, 501$
            feedback: >
              That is what the forward walk shows, reversed. The backward walk
              uses previous-pointers, and $505$'s was never touched.
          - text: >
              $506, 505$, and then the walk stops.
            feedback: >
              Nothing was nulled. $505$'s previous-pointer still holds a
              perfectly followable address — the cancelled node's.
          - text: >
              $506, 505, 504, 503, 502, 501$
            correct: true
            feedback: >
              $505$ still points back at $504$, and $504$ still points back at
              $503$, so the cancelled order reappears. Forward the queue looks
              right; backward it is corrupt.
        feedback: >
          Removal in a doubly linked list is two writes, and both are
          mandatory. A list that looks correct when walked one way can be
          broken the other way.

  - node: quant-programming.data-structures.hash-map
    hook: >
      "Have I seen this before" or "look up by key" is the most common
      instinct-check in an interview, and reaching for anything other than a
      hash map first should need a specific reason.
    explanation: >
      A hash map applies a hash function to each key to get a bucket index
      into a backing array, so a good hash spread and a load factor kept
      bounded by resizing hold insert, lookup and delete at expected $O(1)$
      — a hash map is that guarantee, packaged as a container. When two keys
      land in the same bucket, the bucket typically holds them as a small
      linked list chained off that slot — the array vs. linked list trade
      playing out inside each bucket.

      The map earns its status as the default answer because "have I seen
      this key" and "look up by key" are two of the most common questions a
      problem can ask, and a hash map answers both in expected $O(1)$ with
      no setup cost beyond building the map itself. Reach for it first, then
      switch only when the problem needs something it structurally cannot
      give.

      It fails in three specific ways: no ordering, so iterating a hash map
      yields keys in neither sorted nor insertion order without a
      specialized variant; a bad or adversarial key distribution collapses
      every bucket onto one slot, degrading operations to $O(n)$; and it
      cannot answer a range or nearest-neighbor query without a full scan,
      since there is no notion of "the next key" to walk toward. Any of
      those three phrases in a problem statement — sorted order, closest to,
      adversarial input — is the signal to look past a hash map.
    worked: >
      Two-sum on nums = [2, 11, 7, 15] with target 9: scanning left to
      right, see 2, complement $9-2=7$ isn't in the map yet, record
      {2: index 0}; see 11, complement $-2$ isn't in the map, record
      {11: index 1}; see 7, complement $9-7=2$ is in the map at index 0 —
      done. One pass, one hash lookup per element, answer is the index pair
      (0, 2), against a brute-force $O(n^{2})$ scan that compares every pair.
    interview: >
      Classic openers: two sum, first non-repeating character, group
      anagrams by signature — the interviewer listens for you naming a hash
      map before writing code, then for whether you notice when the problem
      actually wants order or range instead, since that's the tell they're
      testing the map's limits, not just its use.
    pitfalls: >
      Assuming iteration order matches insertion order — true for some
      languages' default map but not a general guarantee, and relying on it
      silently breaks elsewhere. Reaching for a hash map when the question
      asks for order, rank, or range — closest, kth smallest, between $a$
      and $b$ — no hash map answers these without scanning everything.
    recap: >
      A hash map is the default $O(1)$-expected key lookup, but it buys no
      ordering and can degrade to $O(n)$ under adversarial or clustered
      keys.
    dialogue:
      - part: Has this ticker traded yet
        teach: >
          A surveillance job watches every print of the session and must flag
          the first trade in each ticker. Its first version keeps an unsorted
          array of tickers already seen and, on each print, scans that array
          for the ticker before appending it.
      - ask: >
          Over the morning $1000$ distinct tickers make their first trade. Each
          new ticker is compared against every ticker already in the array
          before being appended. How many comparisons do those $1000$ first
          trades cost in total?
        expects: "499500"
        hint: >
          The first new ticker compares against $0$, the second against $1$,
          and so on.
        feedback: >
          $0 + 1 + \dots + 999 = 999 \times 1000 / 2 = 499{,}500$ comparisons:
          $O(n^{2})$ for a question that should cost almost nothing per print.
      - ask: >
          A colleague keeps the seen tickers in a *sorted* array and binary
          searches it on each print. Does that fix the cost?
        choices:
          - text: >
              Yes: each check is $O(\log n)$, so $1000$ tickers cost about
              $1000 \log_{2} 1000$ in total.
            feedback: >
              The check is $O(\log n)$, but every new ticker must then be
              inserted in sorted position, shifting everything after it.
              Inserts alone are back to $O(n^{2})$ on unlucky arrival orders.
          - text: >
              Only half: lookups get fast, but inserting each new ticker into
              sorted position still shifts $O(n)$ elements.
            correct: true
            feedback: >
              Right. Sorting buys order the job never asked for and pays for it
              on every insert. The surveillance job only asks "seen or not".
          - text: >
              Yes, if the array is a sorted linked list so inserts are $O(1)$.
            feedback: >
              The splice is $O(1)$ once you are at the spot, and finding the
              spot on a list is a walk. A linked list cannot be binary
              searched.
        feedback: >
          Neither unsorted nor sorted arrays answer "seen before" in constant
          time. Something has to jump straight to the right slot.
      - ask: >
          Suppose every ticker were an integer from $0$ to $999$. You keep a
          $1000$-slot array of flags, slot $i$ set once ticker $i$ has traded.
          How many slots does "has $417$ traded?" touch?
        expects: "1"
        feedback: >
          One: read slot $417$. The key *is* the address, so there is nothing
          to search.
      - reflect: >
          Tickers are strings like "NVDA", not integers from $0$ to $999$. What
          would let you keep the one-slot trick anyway, and what new problem
          would it create?
        hint: >
          You need some way to turn a string into a slot number.
        answer: >
          A function that turns any key into a slot number in a fixed-size
          array, computed from the key alone. Then a lookup computes the slot
          and checks only what is there. The new problem is collisions: far
          more possible strings than slots means two tickers can land on the
          same slot, so each slot holds a short list of keys and a lookup
          compares against that list. Keep the lists short and every operation
          stays near one step.
      - teach: >
          That is a hash map. A hash function sends each key to a bucket index
          in a backing array; colliding keys share a bucket, typically chained
          as a short list. The load factor, keys divided by buckets, is kept
          bounded by resizing the array and rehashing when it grows. With a
          good hash, insert, lookup and delete are $O(1)$ expected, amortized
          over the resizes. A hash set stores keys alone; a hash map stores a
          value with each key.

      - part: Keeping the buckets short
        ask: >
          A chained table has $1024$ buckets holding $3000$ tickers, spread
          evenly by a good hash. On average, how many keys sit in a bucket?
        expects: "2.93"
        tolerance: 0.01
        feedback: >
          $3000 / 1024 \approx 2.93$. A lookup computes one hash and compares
          against about three keys — a constant, not a function of how long the
          session has run.
      - ask: >
          The table instead doubles its bucket count whenever the load factor
          would exceed $0.75$. Starting from $16$ buckets, how many buckets does
          it have once it holds $3000$ keys?
        expects: "4096"
        hint: >
          You need at least $3000 / 0.75$ buckets, and the count is always $16$
          times a power of two.
        feedback: >
          $3000 / 0.75 = 4000$ buckets at minimum. Doubling from $16$ runs
          $32, 64, \dots, 2048, 4096$, and $2048$ is too few, so $4096$. Each
          resize rehashes every key, $O(n)$, but doubling makes that
          $O(1)$ amortized per insert — the same argument as a dynamic
          array's append.

      - part: Three things it cannot do
        ask: >
          Someone learns your hash function and sends $3000$ crafted keys that
          all hash to bucket $0$. How many key comparisons does a lookup for a
          key that is *not* present now make?
        expects: "3000"
        feedback: >
          All $3000$ keys sit in one chain, and a miss compares against every
          one before giving up. $O(1)$ expected was a promise about well-spread
          keys; adversarial or badly clustered keys collapse it to $O(n)$ per
          operation. Randomised or keyed hash functions are the defence.
      - ask: >
          The job now stores each ticker's last price in the hash map. A trader
          asks for the ticker that comes alphabetically right after "MSFT".
          What does the hash map do with that question?
        choices:
          - text: >
              Hash "MSFT" and look in the next bucket.
            feedback: >
              A good hash scatters keys deliberately, so the neighbouring bucket
              holds some unrelated ticker. Bucket order carries no information
              about key order.
          - text: >
              Iterate the map; keys come out in insertion order, which is close
              enough.
            feedback: >
              Iteration order is neither sorted nor, in general, insertion
              order, and insertion order is not alphabetical anyway.
          - text: >
              Nothing useful: it must scan all keys, $O(n)$.
            correct: true
            feedback: >
              Right. A hash map has no notion of "the next key". Successor,
              range and $k$-th smallest queries need a structure that keeps
              keys sorted.
        feedback: >
          The hash map is the default whenever the question is "seen before"
          or "look up by key". Its three failures are worth naming aloud: no
          ordering, $O(n)$ under adversarial keys, and no range or neighbour
          queries. A problem that says "sorted", "closest" or "between" is
          telling you to look past it.

  - node: quant-programming.data-structures.heap
    hook: >
      Any "give me the max or min, repeatedly, as things arrive" question is
      a heap in disguise, and the tell is needing the extreme element fast
      without ever needing a full sort.
    explanation: >
      Store the heap as a plain array and let position encode structure:
      the children of index $i$ live at $2i+1$ and $2i+2$, and the parent of
      index $i$ lives at $\lfloor (i-1)/2 \rfloor$ — no pointers, just
      arithmetic on indices. The heap property, parent $\le$ both children
      for a min-heap ($\ge$ for a max-heap), constrains only parent-child
      pairs, not siblings or the whole array, so the extreme element sits at
      the root but nothing else is sorted.

      Peeking the root is $O(1)$. Insert appends the new value at the
      array's end, then sifts it up, swapping with its parent while the
      property is violated — at most the tree's height, $O(\log n)$, swaps.
      Extract-min or extract-max swaps the root with the last leaf, removes
      the old root, then sifts the new root down toward the smaller (or
      larger) child, again at most $O(\log n)$ swaps.

      Building a heap from $n$ elements is $O(n)$, not the $O(n \log n)$ you
      would get inserting one at a time: sift down starting from the last
      internal node and work back to the root, so most nodes, the bottom
      half of the tree, sift a distance of $0$ or $1$, and only a few near
      the root pay the full $O(\log n)$ — summed across all nodes that's a
      geometric series totaling $O(n)$. A heap does not give fast access to
      an arbitrary element: finding or deleting a non-root value is $O(n)$
      unless you keep a separate index into the array.
    worked: >
      Build a min-heap from [9, 4, 7, 1, 3] by heapifying in place. With
      $n=5$ the last internal node is index 1 (value 4, children 1 and 3 at
      indices 3 and 4): since $4>1$, swap to get [9, 1, 7, 4, 3]. Move to
      index 0 (value 9, children 1 and 7): swap with the smaller child, 1,
      giving [1, 9, 7, 4, 3]; the displaced 9 now sits at index 1 with
      children 4 and 3, so it sifts down again, swapping with 3: final array
      [1, 3, 7, 4, 9]. Two sift-downs, not five inserts, and the array's
      minimum, 1, sits at the root.
    interview: >
      Canonical phrasings: kth largest element, merge k sorted lists,
      schedule tasks by priority — the interviewer listens for immediate
      index arithmetic and $O(\log n)$ per operation, not a claim that the
      heap is sorted.
    pitfalls: >
      Treating a heap array as fully sorted — only root-to-child
      inequalities hold, so two arbitrary indices can compare either way.
      Expecting $O(\log n)$ deletion of an arbitrary value — it's $O(n)$
      without an auxiliary index. Forgetting a min-heap library needs
      negated values to act as a max-heap.
    recap: >
      An array-backed tree keeping the min or max at the root: $O(1)$ peek,
      $O(\log n)$ insert and extract, $O(n)$ to build from scratch.
    dialogue:
      - part: Always the earliest deadline
        teach: >
          A scheduler holds $1000$ pending jobs, each tagged with a deadline.
          Over and over it removes and runs the job with the earliest deadline,
          while new jobs keep arriving. Version one keeps the jobs in an
          unsorted array.
      - ask: >
          How many deadline comparisons does it take to find the earliest of
          the $1000$ jobs in the unsorted array?
        expects: "999"
        feedback: >
          Hold the first deadline as the best so far and compare each of the
          other $999$ against it: $999$ comparisons, an $O(n)$ scan on every
          single removal. Inserting was free; removing is not.
      - ask: >
          Version two keeps the array sorted, latest deadline first, so the
          earliest job is always the last element. What does that cost?
        choices:
          - text: >
              Removal is $O(1)$ and insertion is $O(\log n)$, since binary
              search finds the new job's position.
            feedback: >
              Binary search finds the position in $O(\log n)$, and then every
              element after it shifts one slot to open a gap, $O(n)$. Finding
              the spot was never the expensive part.
          - text: >
              Removal is $O(1)$, but each insertion shifts up to $n$ elements,
              $O(n)$.
            correct: true
            feedback: >
              Right. Version one pays $O(n)$ to remove, version two pays $O(n)$
              to insert, and the scheduler does both all day.
          - text: >
              Both are $O(1)$, since the end of an array is cheap to reach.
            feedback: >
              Popping the end is cheap. A new job with a middling deadline does
              not go at the end, though: it goes in sorted position, and
              everything after that position moves.
        feedback: >
          One version keeps no order and pays at removal; the other keeps a
          total order and pays at insertion.
      - reflect: >
          The sorted array maintains the order between every pair of jobs, yet
          the scheduler only ever asks for the minimum. What is the least
          order you could maintain that still puts the minimum somewhere you
          can read instantly?
        hint: >
          Think of the jobs arranged as a tree rather than a line.
        answer: >
          Arrange the jobs as a binary tree and demand only that each parent's
          deadline be no later than its children's. Then the root is the
          minimum, and siblings or cousins need no order at all. A tree with
          $n$ nodes kept balanced is only about $\log_{2} n$ levels deep, so a
          new or removed job only disturbs one root-to-leaf path: fix it with
          about $\log n$ swaps, not $n$ shifts.
      - teach: >
          That is a binary heap, stored in a plain array: the children of index
          $i$ sit at $2i+1$ and $2i+2$, its parent at
          $\lfloor (i-1)/2 \rfloor$. The heap property says each parent is
          $\le$ both children (a min-heap; $\ge$ for a max-heap), so the root,
          index $0$, holds the extreme element. Peek is $O(1)$. Insert appends
          at the end and sifts up, swapping with the parent while smaller.
          Extract swaps the root with the last element, pops it, and sifts the
          new root down. Both are $O(\log n)$, and building a heap from $n$
          elements by sifting down from the last internal node is $O(n)$.

      - part: Checking and moving by hand
        ask: >
          Which array is a valid min-heap?
        choices:
          - text: >
              $[2, 5, 3, 9, 4, 8]$
            feedback: >
              Index $1$ holds $5$, and its children are indices $3$ and $4$,
              holding $9$ and $4$. $5 > 4$, so the property fails one level
              below the root.
          - text: >
              $[3, 2, 4, 5, 6, 7]$
            feedback: >
              The root must be the minimum, and $3 > 2$, its own left child.
          - text: >
              $[2, 4, 3, 9, 5, 8]$
            correct: true
            feedback: >
              $2 \le 4, 3$; then $4 \le 9, 5$; then $3 \le 8$. Every
              parent-child pair holds, and that is the whole definition. Notice
              $4 > 3$ across siblings — allowed.
          - text: >
              $[1, 4, 2, 3, 5, 6]$
            feedback: >
              Index $1$ holds $4$ with children $3$ and $5$ at indices $3$ and
              $4$. $4 > 3$ breaks the property.
        feedback: >
          Checking a heap means checking each index against $2i+1$ and $2i+2$,
          nothing more. Only parent and child are compared.
      - ask: >
          Start from the min-heap $[1, 4, 2, 9, 5, 8, 6]$ and insert $3$:
          append it, then sift up. At which index does the $3$ come to rest?
        expects: "1"
        hint: >
          The $3$ lands at index $7$. Its parent is at $\lfloor 6/2 \rfloor$.
        feedback: >
          At index $7$ its parent is index $3$, holding $9$: swap. At index $3$
          its parent is index $1$, holding $4$: swap. At index $1$ its parent
          is the root, $1$, which is smaller: stop. The array is
          $[1, 3, 2, 4, 5, 8, 6, 9]$, after $2$ swaps up a tree of height $3$.
      - ask: >
          Now extract the minimum from $[1, 3, 2, 4, 5, 8, 6, 9]$: the $9$
          moves to the root and sifts down. At the root it has children $3$ and
          $2$. Why must it swap with the $2$ and not the $3$?
        choices:
          - text: >
              Either swap works; the next sift-down step will repair it.
            feedback: >
              Swap with $3$ and the root becomes $3$ while its other child is
              $2$: the property fails at the root itself, which the sift
              never revisits.
          - text: >
              The smaller child becomes the parent of the other child, so it
              must be no larger than it.
            correct: true
            feedback: >
              Right. After the swap, the promoted child sits above its old
              sibling, and only the smaller of the two can do that legally.
              The $2$ goes up, and the $9$ keeps sinking on the $2$'s side.
          - text: >
              The right child is always chosen, to keep the tree balanced.
            feedback: >
              Balance is guaranteed by the array shape, not by the swap
              direction. The rule is about values: the smaller child goes up.
        feedback: >
          The $9$ swaps with $2$, then with the smaller of its new children,
          $8$ and $6$, and lands as a leaf: $[2, 3, 6, 4, 5, 8, 9]$. One
          root-to-leaf path was touched.
      - ask: >
          The scheduler's heap holds $1{,}000{,}000$ jobs. At most how many
          swaps can a single insert make?
        expects: "19"
        hint: >
          A swap moves the new element up one level. How many levels sit above
          the bottom one?
        feedback: >
          The levels hold $1, 2, 4, \dots$ nodes, and $2^{19} = 524{,}288$ while
          $2^{20} = 1{,}048{,}576$, so a million nodes fill levels $0$ through
          $19$. The deepest element is $19$ levels below the root:
          $\lfloor \log_{2} 10^{6} \rfloor = 19$ swaps at most, against up to a
          million shifts in the sorted array.

      - part: What a heap does not know
        ask: >
          In a min-heap of distinct values, where can the second-smallest
          value be?
        choices:
          - text: >
              At index $1$, always.
            feedback: >
              $[1, 5, 2]$ is a valid min-heap with the second smallest, $2$, at
              index $2$. Siblings are not ordered.
          - text: >
              At index $1$ or index $2$.
            correct: true
            feedback: >
              Its only possible parent smaller than it is the minimum, so it
              must be a child of the root. Which child is not determined.
          - text: >
              Anywhere; the heap only promises the minimum.
            feedback: >
              Anywhere deeper would put it below some parent other than the
              root, and that parent would have to be smaller still — but only
              the minimum is smaller. So it must sit at index $1$ or $2$.
        feedback: >
          The heap is not sorted. Past the root, it pins down only a little:
          the second smallest is a root child, the third could already be at
          depth $2$.
      - ask: >
          A client cancels the job with deadline $8$. What does it cost to
          remove it from a plain heap of $n$ jobs?
        choices:
          - text: >
              $O(\log n)$: heaps support every operation in logarithmic time.
            feedback: >
              The $O(\log n)$ fix-up after removal is fine, but first the $8$
              has to be found, and the heap property says nothing about where
              a non-extreme value lives.
          - text: >
              $O(n)$ to find it by scanning, then $O(\log n)$ to repair.
            correct: true
            feedback: >
              Right. Only the root's position is known. Keeping a separate map
              from job to array index brings arbitrary removal down to
              $O(\log n)$, at the cost of updating that map on every swap.
          - text: >
              $O(1)$: overwrite it with the last element and pop.
            feedback: >
              That skips the search and the repair. You still have to find the
              $8$ ($O(n)$), and the element moved into its place may need to
              sift up or down.
        feedback: >
          A heap answers exactly one question fast — the extreme element — and
          that narrowness is why it beats a sorted array at its own job.

  - node: quant-programming.data-structures.top-k
    hook: >
      "Kth largest in a stream" tempts a full sort every time; the graded
      skill is stopping yourself and reaching for a heap capped at size $k$
      instead.
    explanation: >
      Cap a min-heap at size $k$ and push every new element; once the heap
      holds $k+1$ elements, pop the minimum. The choice of a min-heap for
      finding the $k$ largest is the part worth pausing on: the heap's root
      is the smallest of your current top-$k$, the weakest member you'd
      evict first, and that's exactly the number a new candidate needs to
      beat. A max-heap capped at $k$ would hand you the largest of your kept
      set, which tells you nothing about whether a new, smaller candidate
      still deserves a spot.

      Because the heap never grows past $k$, every push and pop costs
      $O(\log k)$, not $O(\log n)$, and the whole stream costs
      $O(n \log k)$ — far better than sorting everything in $O(n \log n)$
      once $k$ is much smaller than $n$. Memory stays $O(k)$ throughout,
      which is what lets this run on a stream that never fits in memory at
      once.

      One more fact worth keeping: once the heap has seen the whole stream
      and holds exactly $k$ elements, its root is not just "close to" the
      answer to "what's the kth largest" — it is that answer, read off in
      $O(1)$ with nothing left to sort.
    worked: >
      Stream [3, 1, 5, 9, 2, 6], find the 3 largest ($k=3$). Push 3, 1, 5:
      heap {1, 3, 5}. Push 9: heap {1, 3, 5, 9}, size 4 exceeds $k$, pop the
      minimum 1: heap {3, 5, 9}. Push 2: heap {2, 3, 5, 9}, pop minimum 2:
      back to {3, 5, 9}. Push 6: heap {3, 5, 6, 9}, pop minimum 3: heap
      {5, 6, 9}. The heap ends holding {5, 6, 9} — the three largest values
      in the stream, with root 5 the smallest of them.
    interview: >
      Canonical phrasings: kth largest element in a stream, k closest points
      to the origin — the interviewer listens for you justifying the
      min-heap choice unprompted, then stating the $O(n \log k)$ time and
      $O(k)$ space bounds.
    pitfalls: >
      Keeping a max-heap of the full stream and popping down to size $k$ at
      the end — that's sorting with extra steps, $O(n \log n)$ time and
      $O(n)$ memory, defeating the whole point. Forgetting that once the
      heap is full, a candidate no bigger than the root can be discarded
      without ever pushing it, which is what keeps the constant factor low.
    recap: >
      A min-heap capped at size $k$ finds the $k$ largest of a stream in
      $O(n \log k)$ time and $O(k)$ memory, root included.
    dialogue:
      - part: The five biggest trades of the day
        teach: >
          The risk desk wants the $5$ largest trades of the session, by size.
          The feed delivers about $2{,}000{,}000$ trades and you may not store
          them. Mid-morning, the five largest sizes so far are $40$, $75$,
          $52$, $90$ and $61$, and you are keeping exactly those.
      - ask: >
          A trade of size $58$ arrives. Which of the kept sizes has to leave?
        expects: "40"
        feedback: >
          $58$ beats $40$, the smallest of the five, so $40$ drops out and the
          kept set becomes $52, 58, 61, 75, 90$. It does not matter that $58$
          also beats $52$ — only one slot opens.
      - ask: >
          Next a trade of size $47$ arrives. To decide whether it gets in, you
          need to compare it with only one kept size. Which one?
        expects: "52"
        hint: >
          What is the bar a newcomer has to clear now that $40$ is gone?
        feedback: >
          The smallest kept size is now $52$, and $47 < 52$, so the trade is
          discarded. Every admission decision is a single comparison against
          the weakest member of the kept set.
      - ask: >
          Suppose you keep the five in an unsorted array and, after each
          admission, scan it to find the new smallest. Now the desk asks for
          the top $10{,}000$ instead of the top $5$. What does each admission
          cost?
        choices:
          - text: >
              $O(1)$: an admission is one comparison and one overwrite.
            feedback: >
              The comparison and overwrite are $O(1)$, but the overwrite
              changes which value is smallest, and finding the new one means
              rescanning all $10{,}000$ kept values.
          - text: >
              $O(k)$: about $10{,}000$ comparisons to find the new smallest.
            correct: true
            feedback: >
              Right. On a session where sizes drift upward, nearly every trade
              is admitted, and $2 \times 10^{6}$ admissions at $10^{4}$
              comparisons each is $2 \times 10^{10}$ — the rescan is the
              waste.
          - text: >
              $O(n)$: you have to look back over the whole stream.
            feedback: >
              Everything outside the kept set is gone for good and never
              needed again; only the kept values are rescanned. The cost is in
              $k$, not $n$.
        feedback: >
          The bar to clear is the smallest kept value, and every admission
          moves the bar. Rescanning to find it again is the work to remove.
      - reflect: >
          You want the *largest* values, yet the number you consult on every
          arrival is the *smallest* value you are keeping. What structure
          should hold the kept set, and why does that sound backwards?
        answer: >
          A min-heap of the kept values: its root is exactly the bar a
          newcomer must clear, readable in $O(1)$, and replacing it costs one
          $O(\log k)$ sift instead of an $O(k)$ rescan. It sounds backwards
          because you are hunting large values, but the heap is not there to
          find winners — it is there to find the weakest winner, the one to
          evict.
      - teach: >
          That is top-$k$ with a size-$k$ min-heap. Push each arrival; if the
          heap now holds $k+1$ elements, pop the minimum. Once the heap is
          full, an arrival no larger than the root can be skipped without
          touching the heap. Each push or pop is $O(\log k)$, the whole stream
          $O(n \log k)$ time and $O(k)$ memory, against $O(n \log n)$ time and
          $O(n)$ memory for sorting everything. At the end the heap holds the
          $k$ largest, and its root is the $k$-th largest.

      - part: A short stream by hand
        ask: >
          Run $k = 3$ on the stream $14, 6, 22, 9, 30, 11, 25$, pushing each
          value and popping the minimum whenever the heap holds $4$. What is
          the root right after the $30$ is processed?
        expects: "14"
        hint: >
          After the first three values the heap is $\{6, 14, 22\}$. Track which
          value each later push knocks out.
        feedback: >
          $9$ arrives: push, pop $6$, leaving $\{9, 14, 22\}$. $30$ arrives: push,
          pop $9$, leaving $\{14, 22, 30\}$. The root is $14$, the third
          largest of the five values seen so far.
      - ask: >
          Now add the skip rule: once the heap is full, an arrival no larger
          than the root is discarded without a push. Over the whole stream of
          seven, how many arrivals does the rule discard?
        expects: "1"
        feedback: >
          The heap is full from the third value on. $9 > 6$, $30 > 9$ and
          $25 > 14$ are all pushed; only $11 < 14$ is discarded. The heap ends
          as $\{22, 25, 30\}$ with root $22$, the third largest. On a long
          random stream most arrivals fail the root test, which is where the
          real-world speed comes from.
      - ask: >
          Back to the desk: $k = 5$ and the push-then-pop rule with no skip
          test. At most how many trade sizes are in memory at any instant?
        expects: "6"
        feedback: >
          Between a push and its pop the heap briefly holds $k + 1 = 6$. With
          the skip test it never exceeds $5$. Either way it is $O(k)$, set
          against the $2{,}000{,}000$ a sort would hold.

      - part: Where the recipe goes wrong
        ask: >
          A colleague reasons "largest means max-heap" and caps a *max*-heap at
          $3$, popping its maximum whenever it holds $4$. On the stream
          $14, 6, 22, 9, 30, 11, 25$, what does that heap end up holding?
        choices:
          - text: >
              $\{22, 25, 30\}$, the same answer more slowly.
            feedback: >
              Popping the maximum throws away the biggest value every time it
              overflows: $22$ is evicted the moment $9$ arrives, and $30$ the
              moment it is pushed. The large values are exactly what it loses.
          - text: >
              $\{6, 9, 11\}$, the three smallest.
            correct: true
            feedback: >
              Right. A max-heap capped at $k$ that evicts its maximum is the
              correct recipe for the $k$ *smallest*. The heap's root has to be
              the element you would evict, which for the $k$ largest is the
              minimum.
          - text: >
              It fails outright, since a max-heap cannot be capped.
            feedback: >
              Any heap can be capped — capping is just popping on overflow. It
              runs fine; it answers the mirror-image question.
        feedback: >
          The heap's root is the eviction candidate. For the top $k$ largest,
          that is the smallest kept value, so the heap is a min-heap.
      - ask: >
          The desk now wants the top $1{,}000{,}000$ of the $2{,}000{,}000$
          trades. How does the size-$k$ heap compare with sorting?
        choices:
          - text: >
              Still far better, since a heap always beats a sort.
            feedback: >
              The win was $\log k$ against $\log n$. Here
              $\log_{2} 10^{6} \approx 20$ and $\log_{2} (2 \times 10^{6})
              \approx 21$, and memory is $O(n)$ either way.
          - text: >
              About the same: $\log k$ is close to $\log n$, and the heap holds
              half the stream anyway.
            correct: true
            feedback: >
              Right. The technique pays when $k \ll n$. At $k = n/2$ it costs
              about what a sort does, and the bounded-memory advantage is
              gone.
          - text: >
              Worse, because the heap is limited to $k \le 1000$.
            feedback: >
              Nothing limits $k$. The heap works at any size; it simply stops
              being cheap when $k$ is comparable to $n$.
        feedback: >
          Say it aloud in an interview as "a min-heap of size $k$, root is the
          bar to beat, $O(n \log k)$ time and $O(k)$ space" — and add that it
          pays because $k$ is much smaller than $n$.

  - node: quant-programming.data-structures.running-median
    hook: >
      "Median of a data stream" is the harder cousin of top-k, and the
      two-heap trick it wants is really about keeping a cut point balanced
      between two ordered halves, not a single sorted list.
    explanation: >
      Split what you've seen into two heaps: a max-heap "lo" for the smaller
      half, a min-heap "hi" for the larger half, kept within one element of
      each other in size. The invariant that makes this work is that lo's
      root and hi's root always sit on either side of the cut between the
      lower and upper half of the data, so the median is always one root, or
      the average of both, with no scan needed.

      On each new value $x$: push onto lo if $x \le$ lo's max (or lo is
      empty), otherwise onto hi; then, if the size gap between the two heaps
      now exceeds one, move the root of the larger heap over to the other.
      Reading the median afterward is a three-way check on sizes: lo's max
      when lo is bigger, the average of both roots when they're equal, hi's
      min when hi is bigger.

      Every insert costs one heap push plus at most one rebalancing move,
      each $O(\log n)$, so insert is $O(\log n)$ total; reading the median
      touches only root pointers, $O(1)$. That split is what makes this
      cheaper than resorting the whole stream on every new value, which
      would cost $O(n \log n)$ per insert instead.
    worked: >
      Insert 5, 2, 8, 1 in order. Insert 5: lo empty, so push to lo; lo={5},
      hi={}; median = lo's max = 5. Insert 2: $2 \le 5$, push to lo; lo={5,
      2}, sizes 2 and 0 differ by more than one, so move lo's root 5 to hi;
      lo={2}, hi={5}; median = avg(2, 5) = 3.5. Insert 8: $8 > 2$, push to
      hi; hi={5, 8}; median = hi's min = 5. Insert 1: $1 \le 2$, push to lo;
      lo={2, 1}, hi={5, 8}, sizes equal; median = avg(2, 5) = 3.5 — matching
      the sorted list [1, 2, 5, 8] exactly.
    interview: >
      Canonical phrasing: median of a data stream, or its harder cousin,
      sliding-window median — the interviewer listens for the two-heap
      balance idea named up front, then for a clean statement of the
      rebalancing rule and the $O(\log n)$ insert, $O(1)$ read costs.
    pitfalls: >
      Sending a value that ties lo's max to hi instead of lo, or vice versa
      — the $\le$ convention has to be applied consistently or the balance
      invariant silently breaks. Skipping a rebalance because the size gap
      "looks small" after one insert — rebalancing after every insert, not
      occasionally, is what keeps the invariant true for the next one.
    recap: >
      A max-heap of the lower half and a min-heap of the upper half,
      rebalanced to within one element, give $O(\log n)$ insert and $O(1)$
      median reads.
    dialogue:
      - part: A median after every reading
        teach: >
          A latency dashboard shows the median of all readings so far, updated
          after every new reading. The session opens with six readings, in
          milliseconds: $12, 30, 7, 18, 25, 4$.
      - ask: >
          What is the median of those six readings?
        expects: "15"
        hint: >
          Sort them. With an even count the median is the average of the two
          middle values.
        feedback: >
          Sorted: $4, 7, 12, 18, 25, 30$. The middle pair is $12$ and $18$, so
          the median is $(12 + 18)/2 = 15$.
      - ask: >
          A seventh reading, $9$, arrives. What is the median now?
        expects: "12"
        feedback: >
          Sorted: $4, 7, 9, 12, 18, 25, 30$, and the fourth of seven is $12$.
          Notice what you used: the $9$ landed below the middle, which shifted
          the middle down to $12$. The $4$ and the $30$ mattered only as
          counts.
      - ask: >
          Over a full session of a million readings, you keep them in a sorted
          array so the middle can be read directly. What does that cost?
        choices:
          - text: >
              $O(\log n)$ per reading: binary search finds each reading's slot.
            feedback: >
              Binary search finds the slot, and then everything after it shifts
              to open a gap. The shift is $O(n)$ per reading, up to
              $10^{6} \times 10^{6} / 2 = 5 \times 10^{11}$ moves over the
              session.
          - text: >
              $O(n)$ per reading for the shift, $O(1)$ to read the middle.
            correct: true
            feedback: >
              Right. Reading is free, but keeping a total order costs a linear
              shift on every insert — order you never consult except near the
              middle.
          - text: >
              $O(1)$ per reading, since readings are appended at the end.
            feedback: >
              A reading lands wherever its value sorts, and a $9$ arriving
              after a $30$ does not go at the end. Only an array kept unsorted
              gets $O(1)$ appends, and then the middle is lost.
        feedback: >
          The sorted array maintains far more order than the median needs.
      - reflect: >
          The median sits on the boundary between the lower half of the
          readings and the upper half. What do you actually need fast access
          to on each side of that boundary, and which structure gives it?
        hint: >
          Which value of the lower half is closest to the boundary? Which value
          of the upper half?
        answer: >
          The largest value of the lower half and the smallest value of the
          upper half — nothing else. A max-heap holding the lower half keeps
          the first at its root, and a min-heap holding the upper half keeps
          the second. If the two halves stay equal in size, or within one, the
          median is one root or the average of both, and each new reading
          costs a heap push rather than a shift.
      - teach: >
          That is the two-heap running median. A max-heap lo holds the lower
          half; a min-heap hi holds the upper half. A new $x$ goes onto lo if
          lo is empty or $x \le$ lo's max, otherwise onto hi. Then, if the
          sizes differ by more than one, move the larger heap's root across.
          The median is lo's root when lo is bigger, hi's root when hi is
          bigger, and the average of the two roots when they are equal. Insert
          is $O(\log n)$; reading the median is $O(1)$.

      - part: The same readings through two heaps
        ask: >
          Feed the first five readings, $12, 30, 7, 18, 25$, through the rule
          from empty. What median do the roots give after the fifth?
        expects: "18"
        hint: >
          Each of $30$, $18$ and $25$ is larger than lo's max at the moment it
          arrives.
        feedback: >
          $12$ starts lo. $30 > 12$ goes to hi. $7 \le 12$ goes to lo. $18$ and
          $25$ are each $> 12$, so both go to hi. Now lo $= \{12, 7\}$ and
          hi $= \{18, 25, 30\}$: sizes $2$ and $3$, gap one, no move. hi is
          bigger, so the median is hi's root, $18$ — the middle of
          $7, 12, 18, 25, 30$.
      - ask: >
          Continue with $4$ and then $9$: both are $\le 12$ and go to lo, which
          now holds $4$ values against hi's $3$. Then a $5$ arrives and also
          goes to lo. Which value does the rebalance move to hi?
        expects: "12"
        feedback: >
          lo is $\{12, 9, 7, 5, 4\}$, size $5$, against hi's $3$: a gap of
          two. lo's root, its maximum $12$, moves to hi. Now lo
          $= \{9, 7, 5, 4\}$ and hi $= \{12, 18, 25, 30\}$.
      - ask: >
          What median do the roots give now?
        expects: "10.5"
        feedback: >
          Sizes are equal, so average the roots: $(9 + 12)/2 = 10.5$. Check
          against the sorted list $4, 5, 7, 9, 12, 18, 25, 30$: the middle pair
          is $9$ and $12$. One push and one move, $O(\log n)$, instead of
          shifting half an array.
      - ask: >
          Why does a new reading go to lo exactly when it is $\le$ lo's max,
          instead of simply going to whichever heap is smaller?
        choices:
          - text: >
              To keep the sizes balanced with fewer moves.
            feedback: >
              Balance is the rebalance step's job, and it would be easier with
              "push to the smaller heap". The routing rule protects something
              the sizes cannot.
          - text: >
              To keep every value in lo at most every value in hi, so the roots
              really are the two sides of the middle.
            correct: true
            feedback: >
              Right. From lo $= \{9, 7, 5, 4\}$ and hi $= \{12, 18, 25, 30\}$,
              send a $40$ to lo because the sizes tie: lo has $5$, hi $4$, no
              rebalance, and the roots report a median of $40$. The true median
              of the nine readings is $12$.
          - text: >
              It does not matter; any routing gives the right median after
              rebalancing.
            feedback: >
              Rebalancing fires only when the sizes drift two apart. Route a
              $40$ into lo when the sizes tie and lo becomes bigger by one, so
              nothing moves, and lo's root, $40$, is read as the median of
              readings whose middle is $12$.
        feedback: >
          Two invariants, two jobs: the routing rule keeps lo entirely below
          hi, and the rebalance keeps their sizes within one. The median read
          needs both.

      - part: Bending the two heaps
        ask: >
          The dashboard now wants the $90$th percentile instead of the median.
          How do the two heaps change?
        choices:
          - text: >
              They cannot; two heaps only find the middle.
            feedback: >
              Nothing in the method cares that the cut is in the middle. It
              cares that the cut is between lo's root and hi's root.
          - text: >
              Keep lo at about $90\%$ of the readings and hi at about $10\%$,
              rebalancing to that ratio; the answer is lo's root.
            correct: true
            feedback: >
              Right. Move the cut and the same machinery reports any fixed
              quantile in $O(\log n)$ per reading. The median is the case where
              the ratio is one to one.
          - text: >
              Swap them: make lo a min-heap and hi a max-heap.
            feedback: >
              Then lo's root is the smallest of the lower part and hi's root
              the largest of the upper part — the two extremes, as far from
              the cut as possible.
        feedback: >
          The structure is a cut kept between two ordered sides. The median is
          one place to put the cut.
      - ask: >
          The dashboard is changed to show the median of only the last
          $10{,}000$ readings, so each new reading also expires the oldest.
          What breaks?
        choices:
          - text: >
              Nothing: push the new reading and pop the old one.
            feedback: >
              A heap pops only its root. The expiring reading could sit
              anywhere inside either heap, and finding it is a linear scan.
          - text: >
              The median read, which is no longer $O(1)$.
            feedback: >
              Reading the roots is still $O(1)$. The trouble is keeping the
              right readings in the heaps in the first place.
          - text: >
              Deleting an arbitrary old reading from a heap is $O(n)$ without
              extra bookkeeping.
            correct: true
            feedback: >
              Right. Sliding windows need either lazy deletion — mark expired
              values and discard them when they surface at a root — or a sorted
              structure that deletes any value in $O(\log n)$.
        feedback: >
          In an interview, name the two heaps and the two invariants first,
          then the costs: $O(\log n)$ insert, $O(1)$ median. If the follow-up
          is a sliding window, the answer starts with "heaps cannot delete
          from the middle".

  - node: quant-programming.data-structures.stack-queue
    hook: >
      Bracket matching and shortest-path-by-layers both look like new
      problems the first time, but they're just a stack and a queue enforcing
      an order guarantee the naive approach pays extra for.
    explanation: >
      A stack restricts every push and pop to the same end, LIFO, both
      $O(1)$ whether it's backed by an array or a linked list — the model
      for a call stack, undo history, and matching nested delimiters. A
      queue restricts enqueue to the tail and dequeue to the head, FIFO,
      $O(1)$ with a linked list or a circular array buffer; a plain array
      without either trick forces an $O(n)$ shift on every dequeue, the same
      shifting cost that makes a plain array slow for middle insertion.

      The restriction to fixed ends in both structures is not a limitation
      to work around — it's the entire point. Forbidding access to interior
      elements is exactly what makes "process things in this order" cheap to
      guarantee: there's no way to violate the order by accident, because
      there's no operation that reaches past the front or back.

      A deque generalizes both, supporting $O(1)$ push and pop at either
      end, so it can play the role of a stack, a queue, or both at once —
      useful whenever a problem needs to add or remove from either side
      without committing up front to which discipline it will need.
    worked: >
      Evaluate the postfix expression "3 4 + 2 *" with a stack: push 3, push
      4; see "+", pop 4 and 3, compute $3+4=7$, push 7; see 2, push 2; see
      "*", pop 2 and 7, compute $7 \times 2 = 14$, push 14. The stack ends
      holding a single value, 14 — the expression's answer, produced with
      one pass and no parsing of operator precedence.
    interview: >
      Canonical phrasings: valid parentheses, evaluate reverse Polish
      notation, implement a queue using two stacks — the interviewer listens
      for you naming LIFO or FIFO before coding, and for the two-stack queue
      variant, for the amortized $O(1)$ argument behind it.
    pitfalls: >
      Backing a queue with a plain array and no circular buffer or two-index
      trick, so dequeue silently costs $O(n)$ from shifting every remaining
      element forward. Backing a queue with a linked list that has no tail
      pointer, forcing an $O(n)$ walk to find the end on every enqueue.
    recap: >
      LIFO stack and FIFO queue give $O(1)$ push and pop at their fixed
      ends, and the restriction to those ends is what makes the ordering
      guarantee cheap.
    dialogue:
      - part: An undo button and an order gateway
        teach: >
          A trading blotter records each action you take and has an undo
          button. Starting flat, you buy $100$ shares, then sell $40$, then buy
          $25$. Then you press undo twice.
      - ask: >
          What is your position after the two undos?
        expects: "100"
        feedback: >
          The position runs $100$, then $60$, then $85$. The first undo reverses
          the most recent action, the buy of $25$, giving $60$; the second
          reverses the sell of $40$, giving $100$. Undo always takes the
          newest action still on the record.
      - ask: >
          Elsewhere, an order gateway must forward orders in the order they
          arrived. It holds $2000$ waiting orders in a plain array and sends
          each by removing index $0$ and shifting the rest forward. How many
          element shifts does draining all $2000$ cost?
        expects: "1999000"
        hint: >
          Removing the first of $m$ elements shifts the other $m - 1$.
        feedback: >
          $1999 + 1998 + \dots + 1 + 0 = 1999 \times 2000 / 2 = 1{,}999{,}000$
          shifts, $O(n^{2})$ to send $n$ orders, when sending one order should
          be a constant amount of work.
      - ask: >
          How should the gateway stop paying for those shifts?
        choices:
          - text: >
              Send from the end of the array instead, which pops in $O(1)$.
            feedback: >
              Popping the end is $O(1)$, and it sends the newest order first —
              the undo button's behaviour. The order guarantee is the whole
              job, and this breaks it.
          - text: >
              Keep a head index that advances on each send, wrapping around a
              fixed buffer, so nothing ever shifts.
            correct: true
            feedback: >
              Right. The front of the line is wherever the head index points,
              and new orders go in at head plus count, wrapping past the end of
              the buffer. Both ends move; no element does.
          - text: >
              Use a singly linked list with only a head pointer, adding at the
              tail and sending from the head.
            feedback: >
              Sending from the head is $O(1)$, but with no tail pointer every
              new order walks the whole list to find the end, $O(n)$ per
              arrival. Keep a tail pointer and it works.
        feedback: >
          Removing from the front of an array is the expensive move; a moving
          head index, or a linked list with pointers to both ends, removes it.
      - reflect: >
          The undo log and the gateway each touch only the ends of their
          sequence, never the middle. What is the one difference between them,
          and what does each gain by refusing itself the middle?
        answer: >
          The undo log adds and removes at the same end, so the last thing in
          is the first out; the gateway adds at one end and removes at the
          other, so the first in is the first out. Refusing the middle is what
          makes each guarantee free: there is no operation that could take an
          order out of turn, and every allowed operation touches one end in
          $O(1)$.
      - teach: >
          The undo log is a stack: last in, first out, with push and pop both
          at the top, $O(1)$ on an array or a linked list. The gateway is a
          queue: first in, first out, enqueue at the tail and dequeue at the
          head, $O(1)$ on a circular array buffer or a suitably built linked
          list. Neither allows access to interior elements, by design. A
          deque generalizes both, with $O(1)$ push and pop at either end.

      - part: Building them so every operation is constant
        ask: >
          The gateway's circular buffer has capacity $8$, indices $0$ to $7$.
          Its head is at index $6$ and it holds $5$ orders. At which index does
          the next arriving order go?
        expects: "3"
        hint: >
          The orders occupy $5$ consecutive slots starting at $6$, wrapping
          after $7$.
        feedback: >
          The orders sit at $6, 7, 0, 1, 2$, so the next free slot is
          $(6 + 5) \bmod 8 = 3$. Head and tail chase each other around the
          buffer, and no order ever moves.
      - ask: >
          You back the queue with a singly linked list that has head and tail
          pointers. Which end should orders leave from?
        choices:
          - text: >
              The tail, so the head stays fixed.
            feedback: >
              Removing the tail means making its predecessor the new tail, and a
              singly linked node cannot see its predecessor: an $O(n)$ walk on
              every send.
          - text: >
              The head, with new orders appended after the tail.
            correct: true
            feedback: >
              Right. Unlinking the head is one pointer move, and appending after
              the tail is two pointer writes. Both ends are $O(1)$ only in this
              orientation.
          - text: >
              Either; with pointers to both ends it does not matter.
            feedback: >
              Pointers to both ends make *adding* cheap at both ends. Removing
              a node means repointing the node behind it: the head has nothing
              behind it, while the tail's predecessor is a walk away.
        feedback: >
          On a singly linked list, both ends accept new nodes cheaply but only
          the head gives one up cheaply. Put the exit there.

      - part: Which discipline the job is asking for
        ask: >
          A risk check walks an organisation chart level by level: the head of
          trading, then everyone who reports directly to her, then everyone
          who reports to them. What holds the people still waiting to be
          visited?
        choices:
          - text: >
              A stack, since the walk goes down the chart.
            feedback: >
              A stack visits whoever was added last, so it would dive down one
              branch to the bottom before finishing the first level. That is a
              depth-first walk, not level by level.
          - text: >
              A queue: each level's people are added before the next level's
              and so are visited first.
            correct: true
            feedback: >
              Right. First in, first out keeps every level ahead of the one
              below it — this is breadth-first order, and the queue is what
              enforces it.
          - text: >
              A plain array, scanned for the shallowest unvisited person.
            feedback: >
              It works, at $O(n)$ per step. The queue gets the same order for
              free, because it never holds anything out of level order.
        feedback: >
          Most-recent-first is a stack; arrival order is a queue. Read which
          one the problem needs before choosing a container.
      - ask: >
          The gateway adds a rule: a cancel jumps to the front of the line and
          is sent next. What is the structure now?
        choices:
          - text: >
              Still a queue, since normal orders still go in at the back.
            feedback: >
              A queue removes in arrival order without exceptions. Once
              something can enter at the front, "first in, first out" no longer
              describes it.
          - text: >
              A stack, since the cancel is the last in and the first out.
            feedback: >
              Only for the cancels. Ordinary orders still enter at the back and
              leave in arrival order, which no stack does.
          - text: >
              A deque: insertion at both ends, removal at the front.
            correct: true
            feedback: >
              Right. The structure fails exactly one clause of a queue — entry
              only at the tail — and gains a second entry point. A deque gives
              it $O(1)$ at both ends.
        feedback: >
          Each structure is defined by which ends it allows. Allow one more
          end and you have changed the guarantee, and the name.

  - node: quant-programming.data-structures.monotonic-stack
    hook: >
      "Next greater element" looks like it needs a comparison against every
      later element for every position — the monotonic stack trick answers
      all of them in one pass by never re-examining a settled element.
    explanation: >
      Keep the stack's elements monotonic — increasing or decreasing,
      depending on the question — by popping any element that the new value
      would violate the order for, before pushing the new value. Scanning
      left to right, each popped element's "next greater to the right" (or
      "next smaller") is exactly the element that popped it, since that's
      the first later element breaking its position in the order.

      The cost argument is the same amortized-analysis move used for a
      dynamic array's resize: any single step can pop many elements, so
      per-step cost is not a fixed bound, but every element is pushed
      exactly once and popped at most once across the entire scan, so total
      pops across all $n$ steps never exceed $n$. Summed over the whole
      run, that's $O(n)$ total work, $O(1)$ amortized per element, even
      though one step's pop count can spike.

      Typical use: scanning prices or heights left to right, popping
      everything on the stack smaller than the current value before pushing
      it, so each popped bar's answer is set the moment it's popped, not at
      the end of the scan.
    worked: >
      Heights [2, 1, 5, 3, 4], next greater to the right for each index,
      using a stack of indices kept value-decreasing. Push 0 (val 2). Val 1
      at index 1 doesn't beat 2, push 1. Val 5 at index 2: pop index 1
      (val 1 < 5, next[1]=5), pop index 0 (val 2 < 5, next[0]=5), push 2.
      Val 3 at index 3 doesn't beat 5, push 3. Val 4 at index 4: pop index 3
      (val 3 < 4, next[3]=4), val 5 at index 2 beats 4, stop, push 4. End of
      scan: indices 2 and 4 never got popped, so next[2]=next[4]=-1. Result:
      [5, 5, -1, 4, -1], computed with 5 pushes and 3 pops total.
    interview: >
      Canonical phrasings: next greater element, daily temperatures,
      largest rectangle in a histogram — the interviewer listens for you
      defending the $O(n)$ bound despite a loop that looks nested, via the
      total-pushes-equals-total-pops argument.
    pitfalls: >
      Writing a loop that re-scans from the current position instead of
      truly popping settled elements off a stack — that's $O(n^{2})$
      wearing a monotonic-stack costume. Mixing strict and non-strict
      comparisons inconsistently, which mishandles duplicate values.
      Pushing values instead of indices when the answer needs to be written
      back at a specific position in a results array.
    recap: >
      Pop violators before pushing to keep a stack monotonic — every
      element is pushed once and popped once, so a loop that looks nested
      is $O(n)$ amortized.
    dialogue:
      - part: Waiting for a higher close
        teach: >
          A stock closes over eight days at $31, 28, 26, 29, 33, 30, 27, 35$.
          For each day you want its *next higher close*: the first later close
          that beats it, if any.
      - ask: >
          What is the next higher close for the $28$ on day $2$?
        expects: "29"
        feedback: >
          Scan forward from day $2$: $26$ does not beat $28$, and $29$ on day
          $4$ does. The answer is $29$.
      - ask: >
          The obvious method scans forward from every day until it finds a
          higher close. On $100$ days of strictly falling closes, where no day
          ever finds one, how many comparisons does it make in total?
        expects: "4950"
        hint: >
          Day $1$ compares against $99$ later days, day $2$ against $98$.
        feedback: >
          $99 + 98 + \dots + 0 = 99 \times 100 / 2 = 4950$: $O(n^{2})$. On the
          eight days above, the scans from day $2$ and day $3$ both walk to the
          same $29$, and each walk repeats work the other already did.
      - ask: >
          Scan left to right and keep a list of the days still *waiting* for a
          higher close. Just before day $4$, the waiting days are the $31$, the
          $28$ and the $26$. What is always true of the waiting closes, read
          oldest to newest?
        choices:
          - text: >
              They increase.
            feedback: >
              If a newer waiting close were higher than an older one, it would
              have been the older one's answer, and the older day would no
              longer be waiting.
          - text: >
              They never increase: each is at most the one before it.
            correct: true
            feedback: >
              Right. A later day that beat an earlier waiting day would have
              settled it on arrival. So whatever is still waiting is ordered
              high to low, oldest to newest.
          - text: >
              No pattern; it depends on the data.
            feedback: >
              The data decides which days are waiting, but not their order.
              Any rise would have answered a waiting day and removed it.
        feedback: >
          The waiting list is always non-increasing from oldest to newest.
          That ordering is what the brute force never exploits.
      - reflect: >
          Day $4$ closes at $29$. Which waiting days does it answer, where in
          the waiting list do they sit, and what kind of container hands them
          to you in that order?
        answer: >
          It answers every waiting day with a close below $29$: the $26$ and
          the $28$. Because the waiting closes fall from oldest to newest, the
          ones below $29$ are exactly the newest few, a run at the end of the
          list. So you remove from the newest end until the newest waiting
          close is at least $29$ (here the $31$), then add day $4$ itself. Add
          and remove at the same end: a stack.
      - teach: >
          That is the monotonic stack. Scan left to right, keeping a stack of
          the waiting elements, decreasing from bottom to top. For each new
          element, pop every waiting element that is smaller; each popped
          element's next greater element is the one that popped it. Then push
          the new element. Whatever remains on the stack at the end has no next
          greater element. A single step may pop many times, but every element
          is pushed once and popped at most once, so the scan is $O(n)$ total.

      - part: The eight closes, in one pass
        ask: >
          Run the scan on $31, 28, 26, 29, 33, 30, 27, 35$. Just before day $8$
          the stack holds the $33$, $30$ and $27$. When the $35$ arrives, how
          many waiting days does it answer?
        expects: "3"
        hint: >
          Pop while the top of the stack is below $35$.
        feedback: >
          $27$, $30$ and $33$ are all below $35$, so all three pop, each with
          answer $35$. The stack is then empty and day $8$ is pushed; it is
          never answered. The full result, day by day, is
          $33, 29, 29, 33, 35, 35, 35$ and none for day $8$.
      - ask: >
          On any series of $100$ days, what is the largest possible total
          number of pops across the whole scan?
        expects: "99"
        hint: >
          How many times can one day be popped? Can the last day be popped at
          all?
        feedback: >
          Each day is pushed once and popped at most once, and the last day is
          never popped since nothing comes after it: at most $99$. A strictly
          rising series reaches it, each day popping the one before. So
          $100$ pushes plus at most $99$ pops is $O(n)$, however the pops
          bunch up — on falling closes there are none at all.
      - ask: >
          The desk wants *how many days* each day waits for a higher close, not
          the close itself. What must the stack hold?
        choices:
          - text: >
              Closes, since the comparisons are on closes.
            feedback: >
              The comparisons are on closes, but a popped close does not say
              which day it came from, so you cannot subtract to get the wait.
          - text: >
              Day indices, reading the close from the series when comparing.
            correct: true
            feedback: >
              Right. When day $j$ pops day $i$, the wait is $j - i$, and the
              close is one array lookup away. On the series above, day $2$
              waits $4 - 2 = 2$ days.
          - text: >
              Nothing extra; the wait is the number of pops.
            feedback: >
              The pop count on a step says how many days were answered, not
              how long any of them waited. Day $4$ pops two days that waited
              $1$ and $2$ days.
        feedback: >
          Store indices, not values: the index gives both the value and the
          position the answer is written back to.

      - part: Ties, and the mirror image
        ask: >
          Closes $30, 30, 32$, and you want the next *strictly* higher close.
          An implementation pops while the top's close is $\le$ the current
          one. What does it report for day $1$?
        choices:
          - text: >
              $32$, correctly.
            feedback: >
              Trace it: day $2$'s $30$ arrives, the top is day $1$ with $30$,
              and $30 \le 30$ pops it. Day $1$ is answered by day $2$ before
              the $32$ ever arrives.
          - text: >
              $30$, which is not higher at all.
            correct: true
            feedback: >
              Right. With $\le$, an equal close pops, so day $1$ is answered
              by its twin. For "strictly higher", pop only on strictly smaller
              closes, $<$, and let equal closes wait together.
          - text: >
              Nothing, since day $1$ is never popped.
            feedback: >
              It is popped, and too early: the $\le$ comparison lets day $2$'s
              equal close pop it.
        feedback: >
          The comparison in the pop condition decides how ties are treated.
          Choose it from the question, strict or not, and use it everywhere.
      - ask: >
          Now the desk wants each day's *next lower* close. What changes?
        choices:
          - text: >
              Scan right to left with the same stack.
            feedback: >
              Reversing the scan finds the *previous* greater element, a
              different question. The direction stays; the order flips.
          - text: >
              Keep the stack increasing from bottom to top, popping while the
              top is greater than the current close.
            correct: true
            feedback: >
              Right. The waiting days for a lower close rise from oldest to
              newest, and a new close answers every waiting day above it.
              Same one pass, same $O(n)$.
          - text: >
              Nothing; a lower close appears when the stack is popped.
            feedback: >
              The decreasing stack pops days answered by a *higher* close. It
              never records a lower one.
        feedback: >
          In an interview, say it in this order: what waits on the stack, why
          it is monotonic, what each pop answers, and "pushed once, popped
          once, so $O(n)$" for the loop that looks nested.

  - node: quant-programming.data-structures.bst
    hook: >
      The moment a question asks for the kth smallest, a range, or "closest
      value," a hash map is the wrong container — that phrasing is asking
      for a sorted structure by name, even when it doesn't say so.
    explanation: >
      A binary search tree keeps every left-subtree key smaller and every
      right-subtree key larger than its own root, recursively, so a search
      compares against one node per level and discards half the remaining
      tree each time — $O(\log n)$ when the tree's height stays
      logarithmic. Nothing in the plain definition enforces that height:
      inserting already-sorted input one key at a time builds a tree that's
      really a chain, degrading every operation to $O(n)$, the same failure
      mode a linked list has for indexed access. Self-balancing variants —
      red-black trees, treaps — add rebalancing on every insert or delete
      specifically to guarantee logarithmic height regardless of input
      order.

      What a balanced BST buys that a hash map cannot is order: predecessor
      and successor queries, counting keys in a range, and finding the kth
      smallest all resolve in $O(\log n)$ by walking the tree's shape, none
      of them answerable by a hash map without scanning every key. That
      trade runs the other way too — a hash map's $O(1)$ expected lookup
      beats a BST's $O(\log n)$ whenever all the problem needs is plain
      membership.

      The interview signal is the question's vocabulary: "order," "rank,"
      "range," or "closest" call for a sorted structure; "have I seen this"
      or "look up by key" call for a hash map instead.
    worked: >
      Insert 5, 3, 8, 1, 4 into an empty BST in that order: 5 becomes the
      root; 3 goes left of 5; 8 goes right of 5; 1 goes left of 3; 4 goes
      right of 3. To find the predecessor of 5 (the largest key smaller than
      5): step left to 3's subtree, then take the rightmost node in that
      subtree, which is 4. Predecessor of 5 is 4, found in two steps down
      the tree rather than scanning all five keys.
    interview: >
      Canonical phrasings: find the kth smallest element in a BST, validate
      a BST, design a sorted map with range queries — the interviewer
      listens for you naming order or range as the specific reason a hash
      map won't do, not just reciting BST operations.
    pitfalls: >
      Assuming any BST insert or search is $O(\log n)$ — inserting
      already-sorted data with no rebalancing produces a degenerate,
      linked-list-shaped tree, $O(n)$ per operation. Treating "balanced" as
      automatic — a plain BST with no red-black or treap discipline does not
      self-balance; you get $O(\log n)$ only by adding that machinery or by
      luck of the input order.
    recap: >
      Balanced BSTs trade the hash map's $O(1)$ lookup for $O(\log n)$
      lookup that also answers order, range, and rank queries.
    dialogue:
      - part: The nearest strike at or below
        teach: >
          An options desk lists strikes $85, 90, 100, 105, 115, 120, 130$, and
          more get listed during the day. Clients keep asking the same kind of
          question: what is the highest listed strike at or below a given
          price?
      - ask: >
          What is the highest listed strike at or below $118$?
        expects: "115"
        feedback: >
          $120$ is above $118$, and the next one down, $115$, is not. The
          answer is $115$ — a question about where $118$ falls *between* keys,
          not about any key itself.
      - ask: >
          The strikes are kept in a hash set. How does it answer "highest at or
          below $118$"?
        choices:
          - text: >
              Hash $118$ and look in the neighbouring buckets.
            feedback: >
              A good hash scatters nearby keys across the table on purpose, so
              the buckets next to $118$'s hold unrelated strikes.
          - text: >
              Probe $118$, $117$, $116$ and so on until one is listed.
            feedback: >
              It happens to stop after $4$ probes here, but the cost is the
              size of the gap, not the number of strikes, and it fails outright
              for strikes in fractions or prices in thousands.
          - text: >
              It cannot do better than scanning every listed strike, $O(n)$.
            correct: true
            feedback: >
              Right. A hash set knows membership and nothing about order, so
              "the nearest key below" needs every key examined.
        feedback: >
          The question is about order, and the hash set threw order away to
          get $O(1)$ membership.
      - ask: >
          Keep the seven strikes in a sorted array instead. At most how many
          comparisons does binary search need to place $118$ among them?
        expects: "3"
        hint: >
          Each comparison halves the candidates: $7$, then $3$, then $1$.
        feedback: >
          Compare with the middle, $105$; then the middle of the upper three,
          $120$; then $115$. Three comparisons, $O(\log n)$. The catch is
          listing a new strike: it goes in sorted position, and everything
          after it shifts, $O(n)$.
      - reflect: >
          Binary search always compares with a middle element, then with the
          middle of one half, and so on. Suppose you stored those comparisons
          themselves as linked nodes instead of relying on array positions.
          What would each node hold, and what must be true of the keys around
          it so that the search still works and a new strike can be added
          without shifting?
        answer: >
          Each node holds a key and two pointers: one to the node you would
          compare with next if the target is smaller, one if it is larger. For
          the search to work, every key reachable through the smaller pointer
          must be smaller than the node's key and every key through the larger
          pointer larger — the whole subtree, not just the next node. Adding a
          strike is then a walk down to an empty pointer and one new leaf, with
          nothing shifted.
      - teach: >
          That is a binary search tree: every key in a node's left subtree is
          smaller than the node's key, and every key in its right subtree is
          larger. Search and insert walk one root-to-leaf path, so they cost
          the tree's height: $O(\log n)$ when the tree is balanced, which
          self-balancing variants such as red-black trees and treaps
          guarantee. A balanced BST also answers order queries in
          $O(\log n)$: predecessor and successor, range queries, and, with
          subtree sizes stored, the $k$-th smallest.

      - part: Strikes in a tree
        ask: >
          Insert the strikes in the order $100, 85, 120, 90, 115, 105, 130$
          into an empty BST. Then a new strike $110$ is listed. Which strike
          becomes its parent?
        expects: "105"
        hint: >
          Walk from the root: right if $110$ is larger, left if smaller, until
          the pointer you need is empty.
        feedback: >
          The tree is $100$ at the root, $85$ and $120$ below it, $90$ right
          of $85$, $115$ and $130$ below $120$, and $105$ left of $115$. The
          walk for $110$: $110 > 100$ go right to $120$; $110 < 120$ go left to
          $115$; $110 < 115$ go left to $105$; $110 > 105$, and $105$'s right
          pointer is empty. $110$ becomes $105$'s right child, and nothing
          else moves.
      - ask: >
          The query "highest at or below $118$" walks from the root. At $100$
          it notes $100$ as a candidate and goes right. Why is it safe never to
          look at $85$ or $90$?
        choices:
          - text: >
              Because they are smaller than $100$, which is already a valid
              answer at or below $118$, so neither can be the highest.
            correct: true
            feedback: >
              Right. Every key in $100$'s left subtree is below $100$, and $100$
              already qualifies. The walk only ever needs to look for something
              better, which can only be on the right.
          - text: >
              Because $85$ and $90$ are leaves, and the walk skips leaves.
            feedback: >
              $85$ is not a leaf, and leaves are visited all the time — $105$
              is one. The reason is the ordering of the whole left subtree.
          - text: >
              Because the query only ever moves right.
            feedback: >
              It moves left at $120$, which is above $118$. Direction is
              decided at each node by comparing with the target.
        feedback: >
          At each node the walk discards a whole subtree, which is only valid
          because the ordering holds for entire subtrees. It continues
          $120 \to 115$, keeps $115$ as the better candidate, finds nothing to
          $115$'s right, and answers $115$.
      - ask: >
          Which of these is a binary search tree?
        choices:
          - text: >
              Root $50$; children $40$ (left) and $60$ (right); $40$ has a
              right child $55$.
            feedback: >
              $55 > 40$ is fine for $40$, but $55$ sits in $50$'s left subtree
              and $55 > 50$. The clause is about the whole subtree, and a
              search for $55$ would go right at $50$ and never find it.
          - text: >
              Root $50$; children $40$ (left) and $60$ (right); $60$ has a
              left child $55$.
            correct: true
            feedback: >
              $55$ is in $50$'s right subtree and $55 > 50$; it is in $60$'s
              left subtree and $55 < 60$. Every subtree condition holds.
          - text: >
              Root $50$; children $40$ (left) and $60$ (right); $40$ has a
              left child $45$.
            feedback: >
              $45$ is in $40$'s left subtree but $45 > 40$. A search for $45$
              would go right at $40$ and miss it.
        feedback: >
          The check is against every ancestor, not only the parent: each key
          must lie in the interval its ancestors' comparisons have carved out.

      - part: When the tree stops paying
        ask: >
          The listing desk adds each morning's new strikes in increasing order,
          into a plain BST with no rebalancing. What happens?
        choices:
          - text: >
              Nothing: a BST stays roughly balanced on its own.
            feedback: >
              Nothing in the definition balances anything. Each larger key goes
              right of the previous largest, so the new strikes form a
              rightward chain.
          - text: >
              The new keys form a chain, and walks through it cost $O(n)$, like
              a linked list.
            correct: true
            feedback: >
              Right. Height is what every operation pays, and sorted input
              makes the height grow by one per insert. Self-balancing trees
              exist to rule this out regardless of input order.
          - text: >
              The insert is rejected, since sorted input is a degenerate case.
            feedback: >
              Every insert succeeds and the result is still a valid BST — just
              a useless shape for it.
        feedback: >
          $O(\log n)$ is a promise about balanced trees. In an interview, say
          "balanced BST" and name the mechanism, or say why the input is
          random.
      - ask: >
          A different service only ever asks "is strike $x$ listed?". Which
          container fits it?
        choices:
          - text: >
              A balanced BST, since it does everything a hash set does.
            feedback: >
              It does, at $O(\log n)$ per lookup against $O(1)$ expected. Paying
              for order you never query is waste.
          - text: >
              A hash set: $O(1)$ expected membership, and no order is needed.
            correct: true
            feedback: >
              Right. The two are complements: plain membership wants the hash
              set; order, rank, range or "nearest" wants the balanced tree.
          - text: >
              A sorted array, since binary search is $O(\log n)$.
            feedback: >
              The lookups would be fine, but strikes are listed all day, and
              each listing shifts the array. And the hash set beats it on
              lookups anyway.
        feedback: >
          Read the query's vocabulary: "seen", "listed", "look up" point to a
          hash set; "nearest", "between", "$k$-th" point to a balanced BST.

  - node: quant-programming.data-structures.lru
    hook: >
      "Design an LRU cache" is asked precisely because neither a hash map
      nor a linked list alone can give $O(1)$ get, put, and eviction — the
      interview is testing whether you compose them, not whether you know
      either one.
    explanation: >
      A hash map alone gives $O(1)$ key lookup but no notion of which key
      was touched least recently, so finding the eviction victim would mean
      scanning every entry. A doubly linked list alone gives $O(1)$
      reordering and removal once you're at the right node, but finding that
      node by key is an $O(n)$ walk. Neither gap closes on its own; the fix
      is to hold both structures at once and let each supply exactly what
      the other lacks.

      The hash map stores key $\to$ node pointer into a doubly linked list
      ordered from most- to least-recently used. On get, the map finds the
      node in $O(1)$; the list then unlinks that node from wherever it sits
      and relinks it at the front, both $O(1)$ list operations, since the
      node already knows its own predecessor and successor. On put, a new
      key gets a new node inserted at the front and added to the map; an
      existing key gets its value updated and is moved to the front the same
      way.

      Eviction on overflow reads straight off the list's tail: it's the
      least-recently-used node by construction, removed from the list in
      $O(1)$ with no scan, and its key deleted from the map in $O(1)$. Every
      one of get, put, and evict costs exactly one map operation plus one
      $O(1)$ list splice.
    worked: >
      Capacity-2 cache. put(1, 'a'): map{1}, list [1]. put(2, 'b'): map{1,
      2}, list [2, 1] (front is most-recent). get(1): found, move to front:
      list [1, 2]. put(3, 'c'): cache full, evict the tail, key 2: map{1,
      3}, list [3, 1]. get(2): key 2 isn't in the map — a miss, because
      put(3, 'c') evicted it right after get(1) had refreshed key 1 instead.
    interview: >
      The canonical system-design-flavored coding question, "implement an
      LRU cache" — the interviewer listens for both structures named
      unprompted with the reason neither alone works, then for get also
      updating recency, not just put, and often for sentinel head/tail nodes
      that avoid null-pointer edge cases at size 0 or 1.
    pitfalls: >
      Moving a node to the front only on put and forgetting to do it on a
      cache hit too — LRU tracks recency of access, not just of insertion.
      Using a singly linked list to save a pointer's worth of memory, which
      then forces an $O(n)$ walk to find a node's predecessor at eviction
      time, destroying the $O(1)$ guarantee the whole design exists for.
    recap: >
      A hash map for $O(1)$ key lookup plus a doubly linked list for $O(1)$
      recency reordering together give $O(1)$ get, put, and evict — neither
      alone can.
    dialogue:
      - part: Four quotes and a fifth request
        teach: >
          A pricing service caches quotes for at most $4$ tickers. When it
          needs a fifth, it drops the ticker used longest ago. Requests arrive
          in this order: AAPL, MSFT, TSLA, AMZN, AAPL, NVDA. A request for a
          ticker not in the cache loads it.
      - ask: >
          Which ticker does the NVDA request evict?
        choices:
          - text: >
              AAPL, the first ticker loaded.
            feedback: >
              That is first-in, first-out. AAPL was loaded first, but the fifth
              request used it again, so it is now the most recently used.
          - text: >
              MSFT
            correct: true
            feedback: >
              Right. Ordered by last use, oldest first: MSFT (request $2$), TSLA
              ($3$), AMZN ($4$), AAPL ($5$). MSFT is least recently used.
          - text: >
              AMZN, the last ticker loaded before NVDA.
            feedback: >
              AMZN is the second most recently used ticker, near the safe end.
              Least recently used is the one whose last request is oldest.
        feedback: >
          The cache keeps the tickers ordered by last use, and a hit counts as
          a use. Least recently used is the bottom of that order: MSFT.
      - ask: >
          Version one stores a hash map from ticker to quote and last-use time,
          and on eviction scans every entry for the oldest time. With capacity
          $50{,}000$, how many entries does one eviction examine?
        expects: "50000"
        feedback: >
          All $50{,}000$: the map finds any ticker in $O(1)$ but has no idea
          which one is stalest, so eviction is an $O(n)$ scan. Lookups are
          cheap; evictions are not.
      - ask: >
          Version two drops the map and keeps the tickers in a linked list
          ordered by recency, most recent at the front. What is slow now?
        choices:
          - text: >
              Eviction, since the stalest ticker has to be found.
            feedback: >
              The stalest ticker is simply the tail, found in $O(1)$ with a
              tail pointer. Eviction is the one thing this version does well.
          - text: >
              Nothing; moving a node to the front is $O(1)$.
            feedback: >
              Moving is $O(1)$ once you hold the node. A request names a
              ticker, and finding its node is a walk from the front.
          - text: >
              Every request: finding the ticker's node walks the list, $O(n)$.
            correct: true
            feedback: >
              Right. The list keeps recency order perfectly but cannot find
              anything by key.
        feedback: >
          The map finds by key and knows nothing of recency; the list knows
          recency and cannot find by key.
      - reflect: >
          You have one structure that finds a ticker in $O(1)$ and another
          that reorders and evicts in $O(1)$ once it holds the right node. How
          do you combine them so that a request, a load and an eviction are
          all $O(1)$, and what kind of list must it be?
        hint: >
          What should the map's value be?
        answer: >
          Let the map's value be a pointer to the ticker's node in the list.
          A request looks the ticker up in the map, then unlinks its node and
          relinks it at the front; an eviction takes the tail node and deletes
          its ticker from the map. Unlinking a node from the middle needs its
          predecessor, so the list must be doubly linked — a singly linked one
          would walk to find it.
      - teach: >
          That is the LRU cache: a hash map from key to node, and a doubly
          linked list of nodes ordered from most to least recently used. Get
          finds the node through the map and moves it to the front. Put either
          updates and moves an existing node, or inserts a new node at the
          front and evicts the tail when over capacity, deleting the evicted
          key from the map. Every operation is a constant number of map
          operations and $O(1)$ list splices.

      - part: Running the cache by hand
        ask: >
          After NVDA the list, front to tail, is NVDA, AAPL, AMZN, TSLA. Next
          comes a request for TSLA, then one for GOOG. Which ticker does GOOG
          evict?
        choices:
          - text: >
              TSLA, the tail.
            feedback: >
              TSLA *was* the tail, but the request for it was a hit and moved it
              to the front. The tail at the moment GOOG arrives is AMZN.
          - text: >
              AMZN
            correct: true
            feedback: >
              Right. The TSLA hit makes the list TSLA, NVDA, AAPL, AMZN, so AMZN
              is the tail. After the load it reads GOOG, TSLA, NVDA, AAPL.
          - text: >
              AAPL, since it was loaded first of all.
            feedback: >
              Load order does not matter; last use does. AAPL's last use,
              request $5$, is newer than AMZN's, request $4$.
        feedback: >
          Every hit moves its node to the front, so the tail is always the
          least recently used ticker.
      - ask: >
          Count the hash-map operations in the GOOG request — lookups,
          inserts and deletes — including the one that discovers GOOG is
          missing.
        expects: "3"
        hint: >
          The miss has to be discovered, GOOG has to become findable, and AMZN
          has to stop being findable.
        feedback: >
          A lookup of GOOG (a miss), an insert of GOOG $\to$ its new node, and a
          delete of AMZN: $3$ map operations, each $O(1)$ expected, plus the
          $O(1)$ list splices for the new front node and the removed tail.
      - ask: >
          Each list node stores its ticker as well as the quote. Why does the
          node need the ticker?
        choices:
          - text: >
              To check on a hit that the map returned the right node.
            feedback: >
              The map's lookup already compared tickers. The node's copy is not
              there for checking.
          - text: >
              To delete the evicted entry from the map, which is keyed by
              ticker.
            correct: true
            feedback: >
              Right. Eviction starts from the tail node, not from a ticker.
              Without the ticker stored in the node, there is no way to find
              which map entry to delete except scanning the map.
          - text: >
              It does not; the quote alone is enough.
            feedback: >
              Then evicting the tail leaves its map entry behind, pointing at a
              node no longer in the list, and the map grows without bound.
        feedback: >
          Each structure points into the other: the map gives the node, the
          node gives back its key.

      - part: Two ways to break it
        ask: >
          An implementation moves a node to the front when a ticker is loaded,
          but not on a hit. Rerun the opening requests, AAPL, MSFT, TSLA,
          AMZN, AAPL, NVDA. Which ticker does NVDA evict now?
        choices:
          - text: >
              MSFT, as before.
            feedback: >
              The fifth request, AAPL, was a hit: under this bug it no longer
              refreshes AAPL, which stays at the tail.
          - text: >
              AAPL
            correct: true
            feedback: >
              Right. Without the refresh on get, AAPL's hit does nothing to the
              order, AAPL is still the tail, and the cache evicts the ticker
              that was just used. It has become a first-in, first-out cache.
          - text: >
              NVDA itself, since the cache is full.
            feedback: >
              A new entry always goes in; the cache evicts to make room for it,
              never in place of it.
        feedback: >
          Recency is about use, not insertion. A hit is a use, and it has to
          move the node.
      - ask: >
          To save memory, a colleague makes the list singly linked. What breaks?
        choices:
          - text: >
              Moving a hit node to the front, which needs its predecessor:
              $O(n)$ per request.
            correct: true
            feedback: >
              Right. Unlinking a node from the middle rewrites its
              predecessor's next pointer, and a singly linked node cannot see
              its predecessor. Evicting the tail has the same problem.
          - text: >
              Nothing; the map still finds every node in $O(1)$.
            feedback: >
              The map finds the node. Removing it from where it sits still
              needs the node before it, and that is a walk.
          - text: >
              Only memory use, which goes up.
            feedback: >
              Memory goes down by one pointer per node; the time goes up, from
              $O(1)$ per request to $O(n)$.
        feedback: >
          Say the design aloud as "hash map from key to node, doubly linked
          list in recency order: get moves to front, put inserts at front, evict
          from the tail" — and give the reason each piece is there.

  - node: quant-programming.data-structures.streaming-choice
    hook: >
      Every structure in this unit gets reused here as the answer to one
      recurring question — not "which structure do I know" but "what's the
      smallest state that answers this query after one more element."
    explanation: >
      Streaming problems forbid storing the whole input, so the container
      that fits is whichever one answers the running query in bounded memory
      and sublinear-per-item time. The pattern from this unit maps cleanly
      onto specific queries: running max, min, or the $k$ largest wants a
      size-bounded heap; a running median wants two balanced heaps; "have I
      seen this key, is this a duplicate" wants a hash set, capped with an
      eviction policy once memory is tight. A running sum or average needs
      no container at all — a handful of scalars, updated in place, answer
      the query completely.

      That last case is the one worth sitting with: the "right" data
      structure is sometimes no data structure, and reaching for a heap or a
      hash set out of habit when two running totals would do is its own kind
      of mistake, not a safe default.

      The question to ask before coding anything is not which structure
      you've memorized for this problem shape, but what minimal state lets
      you answer the query correctly after one more element arrives — that
      state, once named, usually points straight at the container that
      holds it cheaply.
    interview: >
      Framed as "you're given a live stream of events, how do you answer $X$
      after every new one, in bounded memory" — the interviewer is testing
      whether you separate "what structure do I know" from "what does the
      query need," and whether you can state the memory and time bound for
      your choice, not just implement it.
    pitfalls: >
      Reaching for a heap or hash set reflexively before asking what the
      query needs — a running average needs only a running sum and a count,
      not a sorted structure of any kind. Proposing a capped hash set
      without naming an eviction policy — which key gets dropped once memory
      is tight is part of the design, not a detail to leave unspecified.
    recap: >
      Before reaching for a structure, name the minimal state that answers
      the query after one more streamed element — sometimes a heap,
      sometimes a hash set, sometimes just a couple of scalars.
    dialogue:
      - part: What to keep from a feed you cannot store
        teach: >
          A live trade feed delivers (price, size) pairs all session, far too
          many to store. After every trade the desk wants its VWAP, the
          volume-weighted average price: total of price times size, divided by
          total size.
      - ask: >
          How many numbers do you need to keep so that the VWAP can be reported
          after every trade?
        expects: "2"
        hint: >
          When the next trade arrives, what in the formula changes, and by how
          much?
        feedback: >
          Two: the running total of price times size, and the running total of
          size. A new trade adds its price times size to the first and its
          size to the second, and the VWAP is their ratio. The trades
          themselves are never needed again.
      - ask: >
          The session opens with $200$ shares at $100$, $100$ shares at $102$
          and $300$ shares at $99$. Using only your two running totals, what is
          the VWAP after the third trade?
        expects: "99.83"
        tolerance: 0.005
        feedback: >
          Price times size totals $20{,}000 + 10{,}200 + 29{,}700 = 59{,}900$,
          and size totals $600$. VWAP $= 59{,}900 / 600 \approx 99.83$. Two
          numbers carried forward answered exactly what the full list would.
      - ask: >
          The desk also wants the largest trade size so far. What state answers
          it?
        choices:
          - text: >
              A max-heap of every size seen, so the largest sits at the root.
            feedback: >
              The root is right, but everything below it is dead weight: no
              future question needs the second-largest. That is $O(n)$ memory
              to answer an $O(1)$ question.
          - text: >
              One number: the largest so far, replaced whenever a bigger trade
              arrives.
            correct: true
            feedback: >
              Right. After one more trade, the new maximum is the larger of the
              old maximum and the new size. Nothing else about the past can
              change the answer.
          - text: >
              A sorted array of sizes, read from the end.
            feedback: >
              It answers the query and pays an $O(n)$ insertion per trade and
              $O(n)$ memory for order that is never consulted.
        feedback: >
          The running maximum is a heap of size one, which is to say a single
          number.
      - reflect: >
          For the VWAP you kept two numbers and for the maximum one. What
          question were you really asking yourself each time to decide what to
          keep?
        answer: >
          "When one more trade arrives, what do I need from the past to give
          the new answer?" For the VWAP, the past enters only through two
          totals; for the maximum, only through the old maximum. Whatever
          survives that question is the state, and the container is just
          whatever holds that state cheaply. Asking it first stops you reaching
          for a structure out of habit.
      - teach: >
          That is the habit for any streaming problem: name the minimal state
          that answers the query after one more element, then pick the
          container that holds that state cheaply — bounded memory, sublinear
          time per element. Sometimes the state is a few scalars and no
          container at all. The structures of this unit are what the state
          looks like when it is bigger than that.

      - part: The habit on harder queries
        ask: >
          Now the desk wants the $500$ largest trades of the session, after
          every trade. What is the minimal state?
        choices:
          - text: >
              A min-heap capped at $500$, whose root is the bar a new trade
              must clear.
            correct: true
            feedback: >
              Right. The only past trades that can matter are the current top
              $500$, and the only one a newcomer is compared against is the
              smallest of them. $O(\log 500)$ per trade, $500$ values held.
          - text: >
              A max-heap of every trade, popped $500$ times when asked.
            feedback: >
              That keeps every trade forever, $O(n)$ memory, and pays
              $500$ pops each time the desk asks. Trades that have fallen out
              of the top $500$ can never come back in, so storing them is
              waste.
          - text: >
              A sorted array of the current $500$, kept in order.
            feedback: >
              The state is right — the current top $500$ — but the container
              is not: each admission shifts up to $500$ entries, where a heap
              of $500$ sifts through at most $8$ levels.
        feedback: >
          The state is "the current top $500$". A min-heap is the container
          that holds it with the eviction candidate at the root.
      - ask: >
          The desk also wants the running variance of trade prices. A
          colleague keeps the count and the running mean. Is that enough?
        choices:
          - text: >
              Yes: the variance is built from the mean.
            feedback: >
              Two sessions can share a count and a mean and have different
              variances: $99, 101$ and $90, 110$ both have mean $100$. Count and
              mean cannot tell them apart.
          - text: >
              No: you need every price, since variance compares each one with
              the final mean.
            feedback: >
              The formula is written that way, but expanding it shows the past
              enters only through totals: the variance equals the mean of the
              squares minus the square of the mean.
          - text: >
              No: add a running total of squared prices, and three scalars
              suffice.
            correct: true
            feedback: >
              Right. With $n$, $\sum x$ and $\sum x^{2}$, the variance is
              $\sum x^{2}/n - (\sum x / n)^{2}$, updated in $O(1)$ per trade.
              In production you would use an update that avoids subtracting two
              large nearly equal numbers, but the state is still three scalars.
        feedback: >
          Variance looked as if it needed the whole history; it needs three
          numbers. The test is never how a formula is written, only what the
          next update reads.

      - part: When bounded memory has a price
        ask: >
          The desk asks for the median trade size after every trade, and you
          use two balanced heaps. After $1{,}000{,}000$ trades, how many sizes
          do the heaps hold between them?
        expects: "1000000"
        feedback: >
          All of them: lo holds the lower half and hi the upper half, and
          nothing is ever discarded, because any stored size could become the
          median later if enough trades land on its side. Here the minimal
          state is the whole stream. The habit still worked — it told you
          that no bounded state exists for the exact median, which is the
          cue to ask whether an approximate quantile will do.
      - ask: >
          To reject duplicate order ids, a gateway keeps a hash set capped at
          $1{,}000{,}000$ ids, evicting the oldest when full. A duplicate turns
          up $3{,}000{,}000$ orders after its original. What happens?
        choices:
          - text: >
              It is rejected, since the hash set remembers every id.
            feedback: >
              A capped set does not. The original id was evicted after another
              million orders arrived, so the set no longer contains it.
          - text: >
              The gateway slows to $O(n)$ per lookup.
            feedback: >
              The cap keeps the set at a fixed size, so lookups stay $O(1)$
              expected. The failure is in what it remembers, not how fast.
          - text: >
              It is accepted as new: the cap trades exact answers for bounded
              memory.
            correct: true
            feedback: >
              Right. The eviction policy defines what "seen before" means:
              here, seen within the last million orders. Saying that aloud is
              part of the design, not a footnote.
        feedback: >
          Bounding memory on a membership question always changes the
          question. Name the window or the error rate you are accepting. In an
          interview, say the state before the structure: "after one more trade
          I need these numbers, and nothing else" — the container follows from
          that sentence.
