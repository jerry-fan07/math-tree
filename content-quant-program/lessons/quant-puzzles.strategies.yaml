unit: quant-puzzles.strategies
opening: >
  Brainteaser rounds reward one thing above cleverness: a short list of moves you reach for automatically the moment you recognize the shape of a problem. This unit builds that list from the ground up — start by tabulating small cases, then use what the table reveals to find an invariant, and specialize that invariant to the cheap cases of parity, residues mod m, and board coloring. From there it turns to processes that must stop (monovariants), games that reward copying the opponent (symmetry) or seizing the extreme element, and existence proofs that need no construction at all (averaging). It closes with the search-and-inversion moves — working backwards, framing a puzzle as a graph — and the two adversarial tools, worst-case guarantees and information counting, that quantify exactly how hard a puzzle must be.

lessons:
  - node: quant-puzzles.strategies.small-cases
    hook: >
      A problem with a size parameter $n$ and no other handle is an invitation to spend thirty seconds building a table before you spend thirty minutes stuck — most interview puzzles surrender their pattern by $n=4$.

    explanation: >
      The move is mechanical: fix $n=1$, solve it by hand, then $n=2,3,4$, and write the answers in a row. Look at the row two ways — the raw values, for a closed form, and the successive differences or ratios, for a recurrence. Either one, once guessed, is a conjecture, not an answer; the guess still owes you a proof, usually by induction using the recurrence you just spotted, or by a direct combinatorial argument once the pattern makes the mechanism visible.

      Small cases are also where invariants and losing positions first show themselves — a quantity that happens to equal $3$ at every one of $n=1,\dots,4$ is a candidate for something a move can never change, which is exactly what Invariants formalizes. The table does not just guess the destination; it often exposes the machinery that gets you there.

      The discipline that keeps this technique from misleading you is knowing how many terms are enough. A handful of terms fit any number of different formulas — three points fit infinitely many curves — so trust the pattern only once you can explain, structurally, why each new case adds what it adds, not merely because the digits lined up.

    worked: >
      How many regions do $n$ lines in general position (no two parallel, no three through a point) cut the plane into? At $n=1,2,3,4$: a single line gives $2$ regions; a second line crosses the first once, adding $2$ new regions, giving $4$; a third line crosses both previous lines at two new points, adding $3$ regions, giving $7$; a fourth adds $4$, giving $11$. The differences $2,3,4$ climb by exactly $1$ each time because the $k$-th line crosses all $k-1$ earlier lines at $k-1$ distinct points, which splits it into $k$ pieces, each piece cutting one existing region into two — so line $k$ always adds exactly $k$ regions. Summing, $n$ lines give $1+\sum_{i=1}^{n} i = 1+n(n+1)/2$ regions, so the answer at $n=4$ is $1+10=11$, matching the table, and the mechanism — each new line crosses everything before it at distinct points — is exactly why this pattern never breaks the way the circle-chord count does.

    interview: >
      "What's the pattern for $n$ lines / $n$ cuts / $n$ moves" wants you to build the table out loud, state the guessed recurrence in words before the formula, and name the mechanism that would let you prove it — silence on the mechanism reads as a guess, not a derivation.

    pitfalls: >
      Stopping at three terms and declaring victory: many low-degree-looking sequences agree on their first three or four values and diverge afterward, which is exactly the trap the circle-chord count sets. Guessing a formula from the raw values while ignoring the differences, which is usually where the actual recurrence — and the mechanism that proves it — is sitting in plain sight.

    recap: >
      Tabulate $n=1,\dots,4$, read the differences for a recurrence, and treat the result as a conjecture to be proved, not an answer to be reported.
    steps:
      - teach: >
          A problem with a size parameter and no other handle rarely needs
          cleverness first — it needs thirty seconds of arithmetic. Compute
          the first few cases by hand before reaching for a general argument;
          the pattern usually appears before the theory does.
      - teach: >
          The move is mechanical: solve $n=1$, then $2$, $3$, $4$, and lay the
          answers in a row. Read the row two ways — the raw values for a
          closed form, the successive differences for a recurrence — and treat
          whichever you spot as a conjecture, not a proof.
      - teach: >
          Take handshakes in a round-robin of $n$ people, where every pair
          shakes hands exactly once. Tabulating by hand: $n=1$ gives $0$
          handshakes, $n=2$ gives $1$, $n=3$ gives $3$, and $n=4$ gives $6$.
      - ask: >
          Continuing that same table, how many handshakes occur among $5$
          people?
        expects: "10"
        hint: >
          Look at how the total grew from one row to the next: each newly
          arrived person shakes hands with everyone already present.
        feedback: >
          The differences $1,2,3$ climb by exactly $1$ each time, since person
          $n$ adds $n-1$ new handshakes with everyone already there. So $n=5$
          adds $4$ handshakes to $6$, giving $10$ — matching
          $\binom{5}{2}=10$.
      - teach: >
          The differences are the tell: person $n$ always adds exactly $n-1$
          new handshakes, so the total is $0+1+2+\cdots+(n-1)=\binom{n}{2}$.
          Spotting that the differences themselves count something concrete is
          what turns a guessed formula into a proof.
      - ask: >
          A convex polygon's diagonal count follows the same kind of table: a
          quadrilateral ($n=4$) has $2$ diagonals, a pentagon ($n=5$) has $5$,
          and a hexagon ($n=6$) has $9$. The differences climb by $1$ each
          time, exactly as with the handshake table. How many diagonals does a
          convex heptagon ($n=7$) have?
        expects: "14"
        hint: >
          Find the next difference in the pattern $3,4,\dots$ and add it to
          $9$.
        feedback: >
          The differences are $3,4$ so far, climbing by $1$: inserting a new
          vertex turns the edge between its two former neighbors into a
          diagonal and reaches the remaining vertices directly, adding $5$
          more this time. $9+5=14$, matching $n(n-3)/2=7\cdot4/2=14$.
      - ask: >
          A sequence begins $1,2,4,8,16$ for $n=1,\dots,5$ — matching
          $2^{n-1}$ exactly at every one of those five terms. Before reporting
          $2^{n-1}$ as the answer for all $n$, what should you do?
        choices:
          - text: >
              Report $2^{n-1}$ immediately — five matching terms is enough to
              be certain.
            feedback: >
              Five terms fitting a formula is not proof; the classic
              circle-chord region count matches $2^{n-1}$ for $n=1,\dots,5$
              too, and then gives $31$, not $32$, at $n=6$.
          - text: >
              Compute at least one more term and check it structurally
              explains why each new case adds what it adds, not just that the
              digits line up.
            correct: true
            feedback: >
              This is the only way small cases become a proof: a mechanism
              that explains the growth, checked against a term the pattern
              didn't need to produce.
          - text: >
              Switch to a completely different sequence, since $2^{n-1}$ is a
              common trap.
            feedback: >
              The pattern isn't automatically wrong — it's unproven. Plenty of
              genuine sequences do equal $2^{n-1}$; the fix is verification,
              not abandonment.
          - text: >
              Assume it's correct unless the problem explicitly warns you
              about a trap.
            feedback: >
              The whole point of the discipline is that no such warning is
              coming in a real interview — you supply the skepticism yourself.
        feedback: >
          Matching several terms is a conjecture, never a proof. The
          circle-chord count is the standard warning: $1,2,4,8,16$ for
          $n=1,\dots,5$, then $31$, not $32$, at $n=6$ — verify the mechanism,
          not just the digits.
      - teach: >
          Tabulate $n=1,\dots,4$, read the differences for a recurrence, and
          prove the pattern — by induction on the recurrence, or by explaining
          structurally what each new case adds — before trusting it past the
          terms you checked.

  - node: quant-puzzles.strategies.invariant
    hook: >
      Any question phrased "can you reach..." or "is it possible to end with..." under repeatable local moves is asking you to find the one quantity those moves can never touch.

    explanation: >
      An invariant is a quantity, or a property, that every legal move leaves unchanged. Finding one is algebra, not insight: write down a generic move — erase this, write that — and evaluate your candidate quantity before and after; if the two values always agree, the quantity is fixed on everything reachable from the start, and any target with a different value is provably unreachable, no matter how many moves you allow.

      Two directions of the argument are not symmetric. An invariant only ever proves impossibility — start and target with different invariant values can never be connected. Concluding that a target with the *same* value as the start is actually reachable is a separate claim that needs an explicit sequence of moves, since agreement of one quantity says nothing about every other obstruction that might exist.

      Invariants need not be sums; anything that transforms predictably under the move works, including quantities built multiplicatively. The habit worth building is to try the move on two symbolic numbers $a,b$ first and see what combination of them survives untouched — that combination, not the numbers themselves, is the invariant.

    worked: >
      Write $1,2,3,4$ on a board. A move erases two numbers $a,b$ and writes $ab+a+b$ in their place. Does the final single number depend on the order of moves? Notice $ab+a+b+1=(a+1)(b+1)$, so replacing $a,b$ by $ab+a+b$ replaces the two factors $(a+1)$ and $(b+1)$ in the product $\prod (x_i+1)$ by their product $(a+1)(b+1)$ — the product itself is invariant. Starting value: $(1+1)(2+1)(3+1)(4+1)=2\cdot3\cdot4\cdot5=120$. So whatever single number $x$ remains at the end satisfies $x+1=120$, giving $x=119$ regardless of merge order. Checking one path: merge $1,2\to 5$; merge $3,4\to 19$; merge $5,19\to 6\cdot20-1=119$ — confirmed.

    interview: >
      "Show the answer doesn't depend on the order of moves" is the standard phrasing; interviewers want the candidate quantity evaluated symbolically on one generic move before any claim about the final answer, since testing on the given numbers alone can pass by coincidence.

    pitfalls: >
      Testing a candidate invariant only on the specific numbers given, then generalizing — a quantity that happens to survive one particular merge can still change on a different pair; verify it algebraically on symbolic $a,b$. Treating "the invariant matches" as proof that a target is reachable, when it only ever rules impossible targets out.

    recap: >
      Test a candidate quantity symbolically against one generic move: if it never changes, it is fixed on everything reachable, and a mismatched target is provably out of reach.
    steps:
      - teach: >
          A question phrased 'can you reach...' or 'is it possible to end
          with...' under repeatable local moves is asking for the one quantity
          those moves can never touch. Finding it turns an unbounded search
          into one line of algebra.
      - teach: >
          Write down a single generic move and evaluate your candidate
          quantity before and after it. If the two values always agree, the
          quantity is fixed on everything reachable from the start, and a
          target with a different value is provably out of reach.
      - teach: >
          Take the canonical version: a board holds the numbers $1$ through
          $n$, and a move erases any two numbers and writes their sum in their
          place, until one number remains. The total sum never changes, since
          replacing $a,b$ by $a+b$ leaves it exactly where it was.
      - ask: >
          A board holds $1,2,3,4,5,6$. Repeatedly erase two numbers and write
          their sum in their place until one number remains. What is that
          final number, regardless of the order in which pairs are chosen?
        expects: "21"
        hint: >
          Identify what the move leaves unchanged, then evaluate it on the
          starting board.
        feedback: >
          The total sum is invariant, since replacing $a,b$ by $a+b$ doesn't
          change the sum of everything on the board. The starting sum is
          $1+2+3+4+5+6=21$, so the last number standing is always $21$.
      - teach: >
          Invariants need not be sums. Try the move on two symbolic numbers
          $a,b$ and see what combination of them survives untouched — that
          combination, not the specific numbers given, is the actual
          invariant, since testing only the given numbers can pass by
          coincidence.
      - ask: >
          A board holds $2,3,4$. A move erases two numbers $a,b$ and writes
          $ab+a+b$ in their place, until one number remains. Using the
          identity $ab+a+b+1=(a+1)(b+1)$, what is the final number?
        expects: "59"
        hint: >
          Compute $\prod(x_i+1)$ on the starting numbers; the final value $x$
          satisfies $x+1$ equal to that product.
        feedback: >
          $(2+1)(3+1)(4+1)=3\cdot4\cdot5=60$, so the final number satisfies
          $x+1=60$, giving $x=59$ regardless of merge order — checking one
          path, $2,3\to11$, then $11,4\to11\cdot4+11+4=59$.
      - ask: >
          A move on a board of numbers preserves the total sum. Two boards
          start with different collections of numbers but happen to have the
          same total sum. What follows about whether one board's final state
          is reachable from the other's?
        choices:
          - text: >
              They are definitely reachable from each other, since the
              invariant matches.
            feedback: >
              A matching invariant is necessary, never sufficient — it only
              rules out impossibility. Reachability still needs an explicit
              sequence of moves.
          - text: >
              Nothing is settled either way — a matching invariant rules out
              no target; only a mismatch does that.
            correct: true
            feedback: >
              This is the asymmetry to remember: an invariant only ever proves
              impossibility. A match leaves the question open until someone
              exhibits an actual sequence of moves.
          - text: >
              They are definitely unreachable, since equal invariants can't
              distinguish the two boards.
            feedback: >
              Backwards — equal invariants say nothing was ruled out. It's a
              mismatch that proves impossibility, not a match.
          - text: >
              The invariant must be wrong, since two different starting boards
              can't share a value.
            feedback: >
              Invariants routinely coincide across different starting states;
              that's not a contradiction, since many different histories can
              reach the same fixed value.
        feedback: >
          An invariant is a one-way tool: a mismatch proves impossibility
          outright, but a match proves nothing by itself — you still owe an
          explicit construction to claim reachability.
      - teach: >
          Test a candidate quantity symbolically against one generic move: if
          it never changes, it is fixed on everything reachable, and only a
          mismatched target is provably out of reach — a match still needs a
          construction.

  - node: quant-puzzles.strategies.parity
    hook: >
      Parity is the invariant to try first on any reachability question, because checking it costs one line of arithmetic: count something mod $2$ and see if the move can touch it.

    explanation: >
      The instinct that makes parity worth trying before any other invariant is that it's free — you don't need to find a clever quantity, only to count something and reduce mod $2$. The candidates worth trying, in order, are: the count of some feature of the state, a coordinate sum, and the sign of a permutation, which flips with every single swap. Whichever you pick, the check is the same one line used for any invariant: does one generic move change the count by an odd amount or an even one? Even means parity survives; odd means it flips every time, which is just as useful — you then track parity as a function of the move count instead of a constant.

      Once parity is pinned to a candidate, the argument writes itself: compute the starting parity, compute the target parity, and if they disagree, no sequence of moves — however long, however clever — can connect them. This is the same "algebra on a generic move" habit from the invariant idea, specialized to the cheapest modulus there is.

    worked: >
      Fifteen people are at a party; can each person shake hands with exactly $3$ others? Every handshake involves two people, so it adds exactly $1$ to each of two people's handshake counts, meaning it adds exactly $2$ to the sum of everyone's handshake counts — that sum is always even, for any graph of handshakes at all. If each of the $15$ people shook exactly $3$ hands, the sum would be $15\times3=45$, which is odd. An odd sum is impossible for a quantity that only ever increases by $2$, so no such handshake arrangement exists — the answer is no, and the reason is a one-line parity check on the total.

    interview: >
      "Is this achievable" questions about degrees, counts, or repeated swaps are fished for the parity check first; interviewers listen for you to name the quantity being counted mod $2$ before attempting any construction, since a five-second parity check can close the question outright.

    pitfalls: >
      Checking parity of the wrong quantity — the handshake sum, not the number of people, is what's forced even; miscounting which object the invariant lives on gives a false "possible." Assuming a move that swaps two elements always preserves parity of a count; it depends entirely on what's being counted, not on the word "swap" alone.

    recap: >
      Count something mod $2$ and compare start to target before trying anything else — a mismatched parity settles the question in one line.
    steps:
      - teach: >
          Parity is the invariant to try before any other, because checking it
          costs one line: count some feature of the state and reduce mod $2$.
          No cleverness is required to find the quantity — only to pick one
          and check it.
      - teach: >
          The candidates worth trying, in order, are the count of some feature
          of the state, a coordinate sum, and the sign of a permutation, which
          flips with every single swap. Whichever you pick, the check is the
          same: does one generic move change the count by an odd amount or an
          even one?
      - teach: >
          Every handshake between two people adds exactly $1$ to each of their
          handshake counts, so it adds exactly $2$ to the sum of everyone's
          handshake counts — that total is always even, for any graph of
          handshakes at all, on any number of people.
      - ask: >
          Nine people are at a party. If each of them shook hands with exactly
          $5$ others, what would the sum of all nine handshake counts equal?
        expects: "45"
        hint: >
          Multiply the number of people by how many hands each one shakes.
        feedback: >
          $9\times5=45$.
      - ask: >
          That sum, $45$, is odd. Is it possible for nine people to each shake
          hands with exactly $5$ others?
        choices:
          - text: >
              Yes — $45$ is well within what's achievable for $9$ people.
            feedback: >
              The sum of handshake counts must be even for any handshake
              arrangement whatsoever, since every handshake contributes $2$ to
              it; $45$ is odd, so no arrangement can reach it.
          - text: >
              No — the sum of handshake counts is always even, since every
              handshake adds $2$ to it, and $45$ is odd.
            correct: true
            feedback: >
              Exactly right: the total is forced even by the mechanism itself,
              so an odd target of $45$ rules out the arrangement in one line,
              with no attempted construction needed.
          - text: >
              Only if some pair shakes hands more than once.
            feedback: >
              The problem doesn't allow repeated handshakes between the same
              pair, and even if it did, each handshake would still add exactly
              $2$ to the sum — the parity obstruction wouldn't change.
          - text: >
              It depends on how the $9$ people are grouped.
            feedback: >
              It doesn't — the sum's parity is forced by the mechanism
              regardless of how the handshakes are arranged among the people.
        feedback: >
          The handshake sum is always even, since each handshake contributes
          $2$ to it; $9\times5=45$ is odd, so no such arrangement exists — a
          one-line parity check settles it.
      - teach: >
          The same one-line check applies to the sign of a permutation: it
          starts at $+1$ (the identity) and flips sign with every single
          transposition, so after an odd number of swaps it must be $-1$, and
          after an even number it's back to $+1$.
      - ask: >
          A permutation starts even (sign $+1$). After $5$ single-swap
          transpositions, what is its sign, $+1$ or $-1$?
        expects: "-1"
        hint: >
          Each swap flips the sign exactly once; count whether $5$ swaps is an
          odd or even number of flips.
        feedback: >
          Sign flips with every swap, so after $5$ swaps (odd) it has flipped
          an odd number of times: $(-1)^5=-1$.
      - teach: >
          The trap is checking parity of the wrong quantity — for the
          handshake count it's the sum, not the number of people, that's
          forced even — and assuming any move labeled a 'swap' automatically
          preserves parity, when it depends entirely on what's being counted.
      - teach: >
          Count something mod $2$ and compare start to target before trying
          anything else — a mismatched parity settles a reachability question
          in one line, no construction required.

  - node: quant-puzzles.strategies.mod-invariant
    hook: >
      When start and target agree mod $2$, don't give up on invariants — try the modulus the move's own numbers are hinting at, usually visible directly in how much each quantity shifts per move.

    explanation: >
      The generalization is direct: instead of reducing a count mod $2$, reduce mod whatever integer $m$ the move sizes suggest — often the gcd of the amounts a move can add or subtract. If a move always changes some tracked quantity by a multiple of $m$, that quantity's residue mod $m$ is invariant, exactly as in the parity case, just with a different divisor.

      The pattern to look for is a move that shifts a state variable by a fixed amount whose factors don't include $2$, or a linear combination of several state variables that happens to always change by a multiple of $m$ even though no single variable does. Once you spot that combination, the argument is identical to parity: compute its residue at the start, compute the residue a target would need, and a mismatch rules the target out completely.

    worked: >
      A counter starts at $0$. Each move adds $8$, with all arithmetic taken mod $12$ (so the counter is really a position on a $12$-hour clock, and a step is really $+8$ or, after wrapping past $12$, $+8-12=-4$). Can the counter ever show $6$? Since $8$, $-4$, and the wraparound $12$ are all multiples of $4$, every step changes the counter's value by a multiple of $4$, so its value mod $4$ stays $0$ forever. The target $6$ satisfies $6\equiv 2\pmod 4$, which never matches $0$, so $6$ is unreachable no matter how many moves are taken — only $0,4,8\pmod{12}$ are ever visited.

    interview: >
      "Can you reach this configuration" with move sizes that are not $\pm1$ is testing whether you generalize parity on your own; naming the modulus as the gcd of the move amounts, out loud, before computing residues, is what separates a memorized trick from an understood one.

    pitfalls: >
      Trying mod $2$ out of habit when the move sizes share a larger common factor — a coarser modulus like mod $4$ can forbid targets that mod $2$ alone would miss entirely. Forgetting to check that the *same* modulus actually applies to every move available, not just the one you happened to compute first.

    recap: >
      Reduce mod the gcd of the move sizes, not just mod $2$: a target whose residue disagrees with the start's is unreachable under that modulus.
    steps:
      - teach: >
          When start and target agree mod $2$, the fix isn't to give up on
          invariants — it's to reduce modulo whatever integer the move sizes
          themselves suggest, usually the greatest common divisor of the
          amounts a move can add or subtract.
      - teach: >
          If a move always changes some tracked quantity by a multiple of $m$,
          that quantity's residue mod $m$ is invariant, exactly as with parity
          — just with a different divisor. Look for a single variable, or a
          linear combination of several, that a move always shifts by a
          multiple of $m$.
      - teach: >
          Take $r$, $g$, $b$ chameleons of three colors on an island; whenever
          two of different colors meet, both turn the third color, so one
          count falls by $1$, another falls by $1$, and the third rises by
          $2$. Every pairwise difference among $r,g,b$ therefore changes by a
          multiple of $3$ with each meeting.
      - ask: >
          An island starts with $7$ red, $8$ green, and $9$ blue chameleons.
          What is $r-g \pmod 3$ for these starting counts, given as a number
          from $0$ to $2$?
        expects: "2"
        hint: >
          Compute $r-g$ directly, then add multiples of $3$ until the result
          is between $0$ and $2$.
        feedback: >
          $7-8=-1$, and $-1\equiv2\pmod3$.
      - teach: >
          For the island to end monochromatic, two of the three counts must
          reach $0$, which makes those two counts congruent mod $3$. So the
          argument is: compute each pairwise difference mod $3$ at the start,
          and if none is $0$, no two counts can ever become equal.
      - ask: >
          With $7$ red, $8$ green, $9$ blue chameleons, the residues are
          $r\equiv1$, $g\equiv2$, $b\equiv0\pmod3$ — all distinct, and every
          pairwise difference stays fixed mod $3$ forever. Can this island
          ever become monochromatic?
        choices:
          - text: >
              No — monochromatic requires two counts to be equal, hence
              congruent mod $3$, but the pairwise differences never change,
              and none of the starting differences is $0\pmod3$.
            correct: true
            feedback: >
              Exactly: distinct residues that a move can never change rule out
              any two counts ever coinciding, monochromatic or otherwise.
          - text: >
              Yes, since the totals are already close to balanced, near
              $24/3=8$ each.
            feedback: >
              Closeness in raw counts is irrelevant; what's invariant is the
              residues mod $3$, and those start all distinct.
          - text: >
              Yes, if meetings happen in exactly the right order.
            feedback: >
              The whole point of the invariant argument is that it holds
              regardless of the order meetings happen in.
          - text: >
              It can't be determined without simulating every possible
              sequence of meetings.
            feedback: >
              The invariant argument settles it without simulating anything: a
              quantity no move can change already rules the outcome out.
        feedback: >
          The pairwise differences mod $3$ are invariant, and the starting
          residues $1,2,0$ are all distinct, so no two colors can ever become
          equal — the island can never be monochromatic.
      - ask: >
          A token starts at position $0$ and each move shifts it by $+5$ or
          $-3$. What is $\gcd(5,3)$, the modulus that would govern which
          positions are reachable if this gcd were greater than $1$?
        expects: "1"
        hint: >
          Find the largest integer dividing both $5$ and $3$.
        feedback: >
          $\gcd(5,3)=1$: since the move sizes share no common factor greater
          than $1$, reducing mod $1$ gives no restriction at all — this
          modulus argument produces no obstruction here, unlike the
          chameleons' mod $3$.
      - teach: >
          The trap is reaching for mod $2$ purely out of habit when the move
          sizes share a larger common factor, and forgetting to check that the
          modulus you land on actually applies to every move available, not
          just the one you happened to compute first.
      - teach: >
          Reduce mod the gcd of the move sizes, not just mod $2$: a target
          whose residue disagrees with the start's is unreachable under that
          modulus, and a gcd of $1$ means no such obstruction exists at all.

  - node: quant-puzzles.strategies.coloring
    hook: >
      Any tiling, covering, or piece-count question about a grid is asking you to paint the cells so that every legal piece covers a fixed color mix, then simply count colors on both sides.

    explanation: >
      Coloring is parity's cousin for two-dimensional pieces: instead of tracking one number mod $2$, assign each cell a color so that every allowed piece, in every orientation, covers a fixed, predictable pattern of colors. If the target region's actual color counts don't match what the pieces are structurally forced to produce, no tiling exists — the argument needs no attempted construction at all.

      Two colors, checkerboard-style, handle the simplest pieces, where the covering pattern per piece is just "one of each" or a fixed split. When two colors give no information — every piece covers the same split of both colors regardless of placement — a finer coloring is needed: stripes, four colors, or coloring by a coordinate sum modulo something larger than $2$, chosen so that the pieces finally show an asymmetry the plain checkerboard couldn't see.

      The proof pattern is always: compute what the total color count of the target region actually is, compute what any tiling by the given pieces would necessarily produce, and compare. A mismatch is decisive; a match is only necessary, not sufficient, so a genuine construction is still owed before claiming a tiling exists.

    worked: >
      Can a $6\times6$ board be tiled entirely by T-tetrominoes (four squares in a T shape)? The board has $36$ squares, so exactly $9$ pieces are needed. Color the board in the usual checkerboard pattern: $18$ black squares, $18$ white. Every T-tetromino, in any of its four rotations, covers either $3$ black and $1$ white, or $1$ black and $3$ white — never $2$ and $2$ — so each piece contributes either $+2$ or $-2$ to the running total (black count minus white count). For $9$ pieces to sum to the required $18-18=0$, exactly half must contribute $+2$ and half $-2$ — impossible, since $9$ is odd and can't be split into two equal groups. No tiling by T-tetrominoes exists.

    interview: >
      "Can these pieces tile this board" wants a coloring named explicitly — which colors, what pattern — followed by the count on both sides; "why can't you just try harder" is the cue that the interviewer wants the impossibility argument, not a failed construction attempt.

    pitfalls: >
      Assuming a checkerboard coloring will always distinguish a bad tiling from a good one; some pieces cover an equal color split in every orientation, and the checkerboard gives zero information — a different coloring is needed. Confirming the color counts match and concluding a tiling therefore exists — a match rules nothing out, and only an explicit construction proves possibility.

    recap: >
      Color the board so every piece covers a fixed color pattern, then count: a target whose color totals don't match what the pieces can produce admits no tiling at all.
    steps:
      - teach: >
          Any tiling or covering question about a grid is asking you to paint
          the cells so every legal piece covers a fixed, predictable mix of
          colors, and then simply count colors on both sides — no attempted
          construction required.
      - teach: >
          Assign each cell a color so that every allowed piece, in every
          orientation, covers a fixed pattern of colors. If the target
          region's actual color counts don't match what the pieces are
          structurally forced to produce, no tiling exists at all.
      - teach: >
          Take a $4\times4$ board colored like a checkerboard, with corner
          $(1,1)$ black. Since a diagonal corner-to-corner sum is always even,
          the two diagonally opposite corners $(1,1)$ and $(4,4)$ are always
          the same color — here, both black, the same geometry behind the
          classic mutilated chessboard.
      - ask: >
          The full $4\times4$ board has $8$ black and $8$ white squares. Both
          diagonally opposite corners are black, and both are removed, leaving
          $14$ squares. How many black squares remain?
        expects: "6"
        hint: >
          Subtract the two removed black corners from the original black
          count.
        feedback: >
          $8-2=6$ black squares remain, against $8$ white.
      - teach: >
          Every domino covers exactly one black and one white square, so any
          tiling of $14$ squares by dominoes needs equally many of each color.
          Compute what the pieces would need, compute what the region actually
          has, and compare — a mismatch settles the question outright.
      - ask: >
          If a domino tiling of these $14$ squares existed, how many dominoes
          would it use?
        expects: "7"
        hint: >
          Each domino covers $2$ squares.
        feedback: >
          $14/2=7$ dominoes — and each would need to cover one black and one
          white square, requiring $7$ of each color.
      - ask: >
          The $4\times4$ board minus its two black corners has $6$ black
          squares and $8$ white squares remaining. Can this region be tiled by
          dominoes?
        choices:
          - text: >
              Yes — $14$ is even, so a tiling must exist.
            feedback: >
              Evenness of the total is necessary but nowhere near sufficient;
              the color counts must also match, and here they don't.
          - text: >
              No — $7$ dominoes would need $7$ black and $7$ white squares,
              but only $6$ black squares remain.
            correct: true
            feedback: >
              Exactly: the color mismatch, $6$ versus the $7$ required, rules
              out any tiling with no attempted construction needed.
          - text: >
              Yes, as long as the dominoes are placed starting from a corner.
            feedback: >
              Placement order can't fix a hard color-count mismatch; $6$ black
              squares can never supply $7$.
          - text: >
              It can't be decided without trying to place the dominoes.
            feedback: >
              It can be decided immediately from the color counts alone — a
              mismatch is decisive without any attempted placement.
        feedback: >
          A mismatch in color counts is decisive: $6$ black squares can never
          supply the $7$ that $7$ dominoes would require, so no tiling exists.
      - teach: >
          Two colors can also fail to distinguish anything — some pieces cover
          an equal split of both colors in every orientation, and a
          checkerboard then gives zero information, which is when you reach
          for stripes, four colors, or a coordinate sum mod something larger
          than $2$.
      - teach: >
          Color the board so every piece covers a fixed pattern, then count: a
          target whose color totals don't match what the pieces can produce
          admits no tiling, though a match still only earns you the right to
          go looking for a construction.

  - node: quant-puzzles.strategies.monovariant
    hook: >
      "Show this process terminates" or "show it stabilizes" is answered by naming one nonnegative integer that the process can only ever push in a single direction.

    explanation: >
      A monovariant moves strictly one way, unlike an invariant, which doesn't move at all. If you can name a nonnegative integer quantity that strictly decreases at every legal move, the process must stop — a strictly decreasing sequence of nonnegative integers cannot run forever, since it would eventually have to go below $0$. No cleverness about the specific process is required beyond finding that one quantity; well-ordering of the integers does the rest.

      The same argument runs in reverse for a quantity that strictly increases but is bounded above: it must also stop, once it hits the ceiling. Either direction gives you something stronger than "it terminates" for free — the starting value of the monovariant (or the gap to its bound) is an explicit upper bound on the number of moves, since each move consumes at least one unit of it.

      The habit to build is the same as with any invariant: write the move generically, evaluate the candidate quantity before and after, and check that the change always has the same sign, not merely on the specific instance in front of you.

    worked: >
      A rectangular chocolate bar with $6$ rows and $8$ columns, $48$ unit squares total, is broken along the grid lines one straight break at a time; each break takes one existing piece and splits it into exactly two smaller pieces, and pieces are never stacked before breaking. How many breaks does it take to reduce the whole bar to $48$ separate unit squares? The piece count is a monovariant: it starts at $1$ and strictly increases by exactly $1$ at every break, regardless of which piece is chosen or where it's split. Reaching $48$ pieces from $1$ therefore takes exactly $48-1=47$ breaks — not "at most," but exactly, no matter what order the breaks happen in.

    interview: >
      "How many moves does this process take, at most" or "show this loop ends" wants a monovariant named explicitly — the quantity, the direction it moves, and the bound — rather than an appeal to intuition that it "obviously" stops.

    pitfalls: >
      Confusing a quantity that usually decreases with one that always does — a single exception breaks the entire termination argument, since well-ordering needs strict, unconditional movement every move. Reporting only "it terminates" when the same monovariant, tracked exactly rather than as an inequality, often hands you the precise number of moves for free, as with the chocolate bar.

    recap: >
      A nonnegative integer that strictly moves one way at every step forces termination, and its starting value bounds — sometimes pins down exactly — how many moves the process takes.
    steps:
      - teach: >
          'Show this process terminates' or 'show it stabilizes' is answered
          by naming one nonnegative integer quantity that the process can only
          ever push in a single direction — no cleverness about the specific
          process required beyond finding it.
      - teach: >
          If a nonnegative integer strictly decreases at every legal move, the
          process must stop, since a strictly decreasing sequence of
          nonnegative integers can't run forever — it would have to go below
          $0$. The same holds in reverse for a quantity that strictly
          increases but is bounded above.
      - teach: >
          Either direction hands you more than 'it terminates' for free: the
          monovariant's starting value, or its gap to the bound, is an
          explicit upper bound on the number of moves, since each move
          consumes at least one unit of it.
      - ask: >
          A log is repeatedly cut; each cut takes one piece of wood and splits
          it into exactly two smaller pieces. How many cuts are needed to
          reduce one whole log into $15$ separate pieces?
        expects: "14"
        hint: >
          Track the piece count: it starts at $1$ and increases by exactly $1$
          with every cut.
        feedback: >
          The piece count is the monovariant, increasing by exactly $1$ per
          cut. Going from $1$ piece to $15$ requires exactly $15-1=14$ cuts,
          regardless of which piece is cut in what order.
      - teach: >
          The same habit as with any invariant applies here: write the move
          generically and check that the change in your candidate quantity
          always has the same sign — not merely on the one instance in front
          of you, but on every legal move the process allows.
      - ask: >
          A list of $5$ distinct numbers is sorted using only swaps of
          adjacent out-of-order pairs; each such swap removes exactly one
          inversion and creates none. In the worst case — the list fully
          reversed — what is the maximum possible number of inversions, and
          hence the maximum number of swaps needed?
        expects: "10"
        hint: >
          Every one of the $\binom{5}{2}$ pairs is inverted when the list is
          fully reversed.
        feedback: >
          $\binom{5}{2}=10$: a fully reversed list of $5$ distinct numbers has
          all $10$ pairs out of order, and since each swap removes exactly one
          inversion, at most $10$ swaps are needed, and that bound is tight.
      - ask: >
          A candidate monovariant for a sorting process decreases on every
          swap except for one specific configuration, where it stays exactly
          the same. Does the termination argument still go through?
        choices:
          - text: >
              Yes, one exception doesn't matter since it's rare.
            feedback: >
              Well-ordering needs strict decrease on every legal move, with no
              exceptions — a single non-decreasing case can let the process
              stall there forever.
          - text: >
              No — well-ordering requires strict, unconditional decrease at
              every move; a single exception breaks the guarantee entirely.
            correct: true
            feedback: >
              Right: the moment one configuration doesn't strictly decrease
              the quantity, nothing stops the process from revisiting that
              configuration indefinitely.
          - text: >
              Yes, as long as the quantity stays nonnegative.
            feedback: >
              Nonnegativity alone guarantees nothing; it's the strict decrease
              on every move that forces termination, and that's exactly what's
              missing here.
          - text: >
              It only matters if the exceptional configuration occurs
              infinitely often.
            feedback: >
              You can't know in advance that it won't recur — the termination
              guarantee has to hold before any moves are made, which is
              exactly what a single exception removes.
        feedback: >
          Termination needs strict, unconditional decrease on every legal
          move. One configuration where the quantity fails to decrease is
          enough to break the entire guarantee.
      - teach: >
          Don't stop at 'it terminates': the same monovariant, tracked exactly
          rather than as a mere inequality, often hands you the precise number
          of moves for free, not just a guarantee that the process eventually
          stops.
      - teach: >
          A nonnegative integer that strictly moves one way at every step
          forces termination, and its starting value bounds — sometimes pins
          down exactly — how many moves the process takes.

  - node: quant-puzzles.strategies.symmetry-strategy
    hook: >
      In a two-player game that starts symmetric, the tell is a move set that's also symmetric — the winning idea is almost never to build a clever position, only to keep restoring the symmetry your opponent just broke.

    explanation: >
      The logic is an invariant argument turned into a strategy: if you can always respond to your opponent's move with its mirror image, the position is symmetric again immediately after your turn, and a symmetric position with a symmetric move set guarantees that whatever move was legal for your opponent, its mirror image is legal for you too, and it was still unused since they hadn't taken it. That guarantee is what never breaks — you are never the player who runs out of moves, because a legal reply always exists by construction.

      Which player this favors depends entirely on whether the starting position is symmetric already. If it is not, the first player can often manufacture symmetry with one opening move — placing something exactly at the center of a symmetric board, for instance — and then mirror everything the opponent does from then on. If the position starts symmetric, mirroring instead becomes available to the second player from move one, since they get to respond to (and mirror) the first player's opening move directly.

    worked: >
      Two piles of matches start with $7$ matches each. On each turn a player removes any positive number of matches, but only from one pile. The player who takes the last match wins. Since the piles start equal — already symmetric — the second player mirrors: whenever the first player removes $k$ matches from one pile, the second player removes the same $k$ matches from the other pile, restoring equality after every one of their turns. The piles are equal after each of the second player's moves and strictly smaller each round, so they hit $0,0$ together right after a move by the second player — meaning the first player is the one who faces two empty piles and cannot move. The second player wins for any starting size, not only $7$.

    interview: >
      "Two players alternate on a symmetric setup — who wins?" wants the symmetry check stated first — is the start already symmetric, or does it need one move to create it — before any talk of specific optimal moves.

    pitfalls: >
      Trying to mirror on a starting position that is not symmetric without first spending a move to create the symmetry — an unmirrored opening move by the wrong player breaks the whole argument. Assuming mirroring always favors the second player; on an asymmetric board the first player can seize the mirroring role by moving to the center first.

    recap: >
      Restore the symmetry after every opponent move and a legal reply is always guaranteed to exist; whether that favors you or your opponent depends only on who can make the position symmetric first.
    steps:
      - teach: >
          In a two-player game that starts symmetric, with a move set that's
          also symmetric, the winning idea is almost never to build some
          clever position — it's to keep restoring the symmetry your opponent
          just broke.
      - teach: >
          If you can always respond to your opponent's move with its mirror
          image, the position is symmetric again immediately after your turn.
          A symmetric position with a symmetric move set then guarantees that
          whatever move was legal for your opponent, its mirror image is legal
          for you too, and unused.
      - teach: >
          Which player this favors depends on whether the starting position is
          already symmetric. If it is, the second player can mirror from move
          one. If it isn't, the first player can often manufacture symmetry
          with one opening move — placing something exactly at the center of a
          symmetric board — and mirror from then on.
      - ask: >
          On a round table centered at the origin, the first player places a
          coin at the exact center, then mirrors every later coin the opponent
          places, through the center. If the opponent places a coin at
          coordinates $(3,4)$, what is the $x$-coordinate of the first
          player's mirrored reply?
        expects: "-3"
        hint: >
          Reflecting a point through the center negates each of its
          coordinates.
        feedback: >
          The mirror image of $(3,4)$ through the center is $(-3,-4)$, so the
          reply's $x$-coordinate is $-3$.
      - teach: >
          The identical logic runs in a subtraction-style game: two equal
          piles of matches, a turn removes any positive number from one pile,
          and the player taking the last match wins. Since the piles start
          equal, the second player can mirror every move onto the other pile.
      - ask: >
          Two piles start at $5$ matches each — already symmetric. The first
          player removes $3$ matches from one pile, leaving $2$ and $5$. To
          restore symmetry, how many matches must the second player remove
          from the other pile?
        expects: "3"
        hint: >
          Mirroring means matching the exact count just removed, but from the
          pile that didn't change.
        feedback: >
          The second player removes the same $3$ matches from the untouched
          pile, restoring $2$ and $2$ — equality is restored after every one
          of the second player's turns.
      - ask: >
          Two piles start at $10$ matches each in this
          take-any-number-from-one-pile game, where the player taking the last
          match wins. With optimal play, who wins?
        choices:
          - text: >
              The first player, by moving first.
            feedback: >
              Moving first doesn't help here — the piles start equal, so it's
              the second player who can always restore that equality.
          - text: >
              The second player, since the piles start symmetric and mirroring
              guarantees a reply always exists for them.
            correct: true
            feedback: >
              Right: the second player mirrors every move onto the untouched
              pile, so the piles are equal again after each of their turns,
              and the first player always faces two exhausted piles.
          - text: >
              It depends on how many matches are removed each turn.
            feedback: >
              It doesn't — mirroring works regardless of how many matches the
              first player removes on any given turn, since the second player
              simply copies that count.
          - text: >
              The first player, by emptying one pile immediately.
            feedback: >
              Emptying one pile leaves the other pile intact and unequal to
              it, handing the second player an easy, un-mirrored win on the
              remaining pile.
        feedback: >
          With equal starting piles, the second player mirrors every move,
          restoring equality after each of their own turns, so the first
          player always runs out of moves first.
      - teach: >
          Mirroring a starting position that isn't symmetric, without first
          spending a move to create the symmetry, breaks the whole argument —
          an unmirrored opening move by the wrong player leaves nothing to
          restore.
      - teach: >
          Restore the symmetry after every opponent move and a legal reply is
          always guaranteed to exist; whether that favors you or your opponent
          depends only on who can make the position symmetric first.

  - node: quant-puzzles.strategies.extremal
    hook: >
      An existence or impossibility claim about a finite configuration with no obvious starting point is solved by naming the most extreme object in it — the biggest, closest, or first — and interrogating that one object specifically.

    explanation: >
      The move is to pick out whichever element of a finite configuration is largest, smallest, closest, or otherwise extreme by some natural measure, and argue about it directly, because an extreme object is constrained in a way a generic one is not: by definition, nothing beats it on that measure, and that single fact is often enough to force a contradiction or complete a construction.

      What makes this different from picking an arbitrary element is that the extremal choice comes with a built-in guarantee — for the largest element of a finite set, every other element is $\le$ it; for the closest pair, every other pair is farther apart. That guarantee is exactly the extra leverage a generic element wouldn't supply, and it's usually the entire content of the proof once you've correctly identified which "extreme" to look at.

    worked: >
      A round-robin tournament has $n$ players, every pair plays exactly one game, and every game has a winner (no ties). Show there is always a player who either beat every other player directly, or beat someone who beat them. Let $A$ be a player with the maximum number of wins in the tournament. Suppose some player $B$ beat $A$ directly and also beat every single player that $A$ beat. Then $B$'s win total is at least $A$'s win total plus one (everyone $A$ beat, plus $A$ itself), contradicting that $A$ has the maximum. So any player $B$ who beat $A$ must have lost to at least one player $C$ that $A$ also beat — and $A$ beats $C$, who beats $B$, giving $A$ a two-step path to $B$. Since $A$ reaches every player in at most two steps, such a player always exists — the extremal choice was "most wins."

    interview: >
      "Prove that a leader always exists" or "show there's a configuration achieving..." with no obvious place to start a construction is the tell; naming which extreme object to examine — and why that specific extreme, not just any element — is the answer the interviewer is listening for.

    pitfalls: >
      Picking an extreme quantity that doesn't actually interact with the constraint being proved — the leverage only appears when the "extreme" property is the one doing the work in the argument, not an arbitrary superlative. Stopping at "consider the largest element" without following through on what its extremality actually forces, which is where the real proof lives.

    recap: >
      Name the largest, smallest, or closest object in a finite configuration and argue about it specifically — its extremality supplies a guarantee no generic element has.
    steps:
      - teach: >
          An existence or impossibility claim about a finite configuration,
          with no obvious place to start, is solved by naming the single most
          extreme object in it — the biggest, closest, or first — and
          interrogating that one object specifically.
      - teach: >
          The extremal choice comes with a built-in guarantee an arbitrary
          element doesn't have: for the largest element of a finite set, every
          other element is $\le$ it; for the closest pair of points, every
          other pair is farther apart. That guarantee is usually the entire
          content of the proof.
      - teach: >
          Consider people standing at pairwise distinct distances, each
          shooting whoever is nearest to them. The extremal object to name is
          the closest pair in the whole configuration: by definition, nothing
          is closer to either of them than they are to each other.
      - ask: >
          Four people stand on a line at positions $0$, $5$, $6$, and $14$.
          What is the distance between the closest pair among them?
        expects: "1"
        hint: >
          Check every pair of positions and find the smallest gap.
        feedback: >
          The gaps are $5,6,14,1,9,8$ for the six pairs; the smallest is $1$,
          between the people at positions $5$ and $6$.
      - teach: >
          The closest pair's guarantee: neither person in it can have anyone
          else as their nearest neighbor, since anyone else is, by definition,
          farther from each of them than they are from each other — so the
          closest pair always shoot each other.
      - ask: >
          With $9$ people at pairwise distinct distances, the closest pair
          shoot each other; if neither is targeted by anyone else, the
          argument recurses on the remaining $7$ people, then $5$, then $3$,
          then $1$. How many such reductions does it take to go from $9$
          people down to $1$?
        expects: "4"
        hint: >
          Count the steps in $9\to7\to5\to3\to1$.
        feedback: >
          $9\to7\to5\to3\to1$ is $4$ reductions of $2$ people each, matching
          $(9-1)/2=4$.
      - ask: >
          In that same $9$-person configuration, the closest pair shoot each
          other. What is the key extremal property making this the right pair
          to single out?
        choices:
          - text: >
              They are, by definition, closer to each other than either one is
              to anyone else, so neither one's nearest neighbor can be a third
              person.
            correct: true
            feedback: >
              Exactly — that guarantee is what lets you conclude they must
              shoot each other, with no exception to check.
          - text: >
              They happen to stand at the two ends of the line.
            feedback: >
              Nothing in the argument assumes a geometric arrangement like
              being at the ends; the closest pair could be anywhere.
          - text: >
              They are the two people who arrived first.
            feedback: >
              Arrival order plays no role in the argument at all — only
              pairwise distance does.
          - text: >
              Any pair works equally well as the starting case, not just the
              closest one.
            feedback: >
              Only the closest pair carries the guarantee that neither has a
              nearer third person to target instead; an arbitrary pair has no
              such guarantee.
        feedback: >
          The closest pair's extremality is exactly the guarantee the argument
          needs: neither of them can have a nearer third person, so they must
          shoot each other, which is what lets the induction peel them off and
          recurse.
      - teach: >
          The trap is picking an extreme quantity that doesn't actually
          interact with the constraint being proved, or stopping at 'consider
          the largest element' without following through on what its
          extremality specifically forces.
      - teach: >
          Name the largest, smallest, or closest object in a finite
          configuration and argue about it specifically — its extremality
          supplies a guarantee no generic element has.

  - node: quant-puzzles.strategies.averaging
    hook: >
      "Show that one of these must be at least..." with no way to identify which one is answered by computing the average — a sum divided by a count proves existence without ever pointing at the winner.

    explanation: >
      If $n$ quantities sum to $S$, at least one of them is $\ge S/n$ and at least one is $\le S/n$ — otherwise every single one would be strictly on one side of $S/n$, and summing $n$ numbers all strictly above (or all strictly below) their own average could never actually equal $S$. This is pure arithmetic, but it proves existence with zero construction: you never learn *which* quantity clears the bound, only that one must.

      The probabilistic form is the identical statement wearing different notation: build a random object, compute its expectation $\mathbb{E}[X]$ by linearity over whatever pieces $X$ decomposes into, and conclude that some realization of the object achieves $X\ge \mathbb{E}[X]$ and some achieves $X\le \mathbb{E}[X]$ — because the expectation is itself an average over the possible outcomes, exactly as $S/n$ is an average over $n$ terms.

      The bound is tight only when every term is equal; any actual spread in the underlying data means the extreme term clears the average strictly, not merely matches it — worth checking, since interviewers often follow up by asking how much slack the bound leaves.

    worked: >
      Twelve market-making desks report a combined monthly PnL of $180$ (in some fixed unit). By the averaging argument, some desk cleared at least $180/12=15$, and some desk cleared at most $15$ — true regardless of how the $180$ is actually split among the twelve. The bound is achieved with equality only if every desk cleared exactly $15$; if the desks' results differ at all, the best desk strictly beat $15$ and the worst strictly missed it. No further information about the split is needed to state the guarantee — only the total and the count.

    interview: >
      "Show that at least one of these $n$ things is at least..." wants the sum-over-count computation stated immediately, with an explicit acknowledgment that the argument names no specific winner — just existence.

    pitfalls: >
      Treating the averaging bound as an equality claim, or assuming the bound is achieved, when any unequal spread in the underlying data means it's cleared strictly. Trying to identify which specific element achieves the bound — the argument structurally cannot tell you that; it only guarantees that one does.

    recap: >
      A sum divided by a count bounds some element from above and some from below, with zero construction needed — the same statement in expectation form once a random object is on the table.
    steps:
      - teach: >
          'Show that one of these must be at least...' with no way to identify
          which one is answered by computing the average — a sum divided by a
          count proves existence without ever pointing at the winner.
      - teach: >
          If $n$ quantities sum to $S$, at least one is $\ge S/n$ and at least
          one is $\le S/n$ — otherwise every single one would sit strictly on
          one side of $S/n$, and $n$ numbers all strictly above their own
          average could never actually sum to $S$.
      - teach: >
          In a round robin among $n$ players, every one of the $\binom{n}{2}$
          games produces exactly one win, so the total wins across all players
          is $n(n-1)/2$ — the sum $S$ the averaging argument needs.
      - ask: >
          In a round robin among $8$ players, what is the average number of
          wins per player?
        expects: "3.5"
        hint: >
          Divide the total number of games — one win each — by the number of
          players.
        feedback: >
          $\binom{8}{2}=28$ total wins, and $28/8=3.5$.
      - teach: >
          The bound is tight only when every value equals the average exactly;
          the moment there's any spread in the underlying numbers, the extreme
          value clears the average strictly rather than merely matching it.
      - ask: >
          Since wins are whole numbers and the average is $3.5$, at least one
          player must have won at least how many games — the smallest whole
          number that's $\ge3.5$?
        expects: "4"
        hint: >
          Round the average up to the nearest whole number.
        feedback: >
          A whole number can't equal $3.5$, so 'at least $3.5$' for an integer
          means 'at least $4$' — someone wins $4$ or more games.
      - ask: >
          $20$ numbers sum to $150$, so their average is $7.5$. If all $20$ of
          them are distinct, with no two equal, what follows about the maximum
          value among them?
        choices:
          - text: >
              It must equal exactly $7.5$.
            feedback: >
              The average bound is only met with equality when every value is
              identical — with $20$ distinct values, none can literally equal
              the average with all the others sitting there too.
          - text: >
              It must be strictly greater than $7.5$, since equality in the
              averaging bound requires every value to be identical, and no two
              of these are.
            correct: true
            feedback: >
              Right: with all $20$ values distinct, they can't all sit at
              exactly $7.5$, so the maximum must clear the average strictly,
              not just match it.
          - text: >
              It could be less than $7.5$.
            feedback: >
              The maximum is, by definition, at least as large as the average
              of any set — it can never fall below $S/n$.
          - text: >
              Nothing can be said, since the values are unequal.
            feedback: >
              Distinctness is exactly what lets you say more, not less — it's
              precisely what forces the maximum strictly above the average.
        feedback: >
          Equality in the averaging bound needs every value identical. With
          all $20$ values distinct, the maximum must clear $7.5$ strictly, and
          the minimum must fall strictly below it.
      - teach: >
          The averaging argument names no specific element — it only
          guarantees that some value clears the bound. Trying to identify
          which one from the argument alone is asking it for something it
          structurally cannot supply.
      - teach: >
          A sum divided by a count bounds some element from above and some
          from below, with zero construction needed — the same statement in
          expectation form once a random object is on the table.

  - node: quant-puzzles.strategies.working-backwards
    hook: >
      When the goal is tightly pinned down and the start is wide open, don't search forward from a huge starting space — assume the ending and ask what state had to precede it, one step at a time.

    explanation: >
      Invert the problem whenever the target is much more constrained than the start, or whenever a single step is easier to undo than to perform going forward. Concretely: assume you are already at the goal, ask what the immediately preceding state must have been for that final move to make sense, and repeat, walking backward one step at a time until you reach a state you already understand — often the actual start, which then certifies the whole chain forward.

      This works because the backward branching factor — how many states could have led to a given one — is often far smaller than the forward branching factor, sometimes exactly one. Searching forward from a huge or unconstrained start can explode; searching backward from a single, tightly specified goal usually collapses to a short, deterministic chain.

      In games, the identical move relabels terminal positions as wins or losses and propagates those labels one move at a time back toward the start — this is the same inversion, applied to labels instead of numeric states. And when both the start and the goal are constrained, meeting in the middle — searching forward from the start and backward from the goal simultaneously, then checking where the two searches meet — beats running either search the full distance alone.

    worked: >
      A trader crosses three toll checkpoints; at each one he pays half of whatever cash he's carrying, plus one additional unit, and after the third checkpoint he has exactly $0$ left. How much did he start with? Work backward from the end. Let $x$ be the amount entering a checkpoint; after paying $x/2+1$, he's left with $x/2-1$. At checkpoint $3$, the amount leaving is $0$, so $x_3/2-1=0$ gives $x_3=2$ — that's also the amount he had entering checkpoint $3$, which equals what he had leaving checkpoint $2$. So $x_2/2-1=2$ gives $x_2=6$, the amount leaving checkpoint $1$. Then $x_1/2-1=6$ gives $x_1=14$. Working forward to check: $14\to 14/2-1=6\to 6/2-1=2\to 2/2-1=0$ — confirmed. He started with $14$.

    interview: >
      "Work out how much he started with" or "what was the state one step before the end" phrasings, and any "show this process must end in a win/loss" game question, are asking for the backward chain explicitly, one undone step at a time, not a forward guess-and-check.

    pitfalls: >
      Guessing a starting value and simulating forward to check it, instead of deriving it — guess-and-check can miss the answer entirely when the forward branching factor is large, exactly the case working backwards is meant to avoid. Undoing a step incorrectly by inverting the wrong operation — check that the backward formula, applied forward, actually reproduces the given rule before trusting the chain.

    recap: >
      Assume the goal and ask what state had to come immediately before it, repeating backward — the goal usually has far fewer predecessors than the start has successors.
    steps:
      - teach: >
          When the goal is tightly pinned down and the start is wide open,
          don't search forward from a huge starting space — assume the ending
          and ask what state had to precede it, one step at a time.
      - teach: >
          Invert the problem whenever a single step is easier to undo than to
          perform forward: assume you're already at the goal, ask what the
          immediately preceding state must have been, and repeat, walking
          backward until you reach a state you already understand.
      - teach: >
          This works because the backward branching factor — how many states
          could have led to a given one — is often far smaller than the
          forward one, sometimes exactly one. A bacteria culture that doubles
          every minute is the clean case: the state one minute before 'full'
          is always exactly half full.
      - ask: >
          A culture doubles every minute and fills its jar completely at
          minute $40$. At what minute was the jar exactly one-quarter full?
        expects: "38"
        hint: >
          Work backward one halving at a time from 'full.'
        feedback: >
          Full at minute $40$ means half full one minute earlier, at minute
          $39$, and one-quarter full one minute before that, at minute $38$.
      - teach: >
          In games, the identical move relabels terminal win/loss positions
          and propagates those labels one move at a time back toward the
          start. When a step is numeric rather than a label, inverting it
          algebraically is the same move applied to numbers.
      - ask: >
          A trader crosses $2$ toll checkpoints; at each one, he pays half of
          whatever cash he's carrying, then an additional $3$ units, and after
          the second checkpoint he has exactly $0$ left. How much did he start
          with?
        expects: "18"
        hint: >
          Work backward: if leaving a checkpoint with $y$ means he entered
          with $x$ and $x/2-3=y$, solve for $x$ given $y$ at each step,
          starting from $y=0$.
        feedback: >
          Leaving checkpoint $2$ with $0$: $x/2-3=0$ gives $x=6$, the amount
          entering checkpoint $2$, which is what he had leaving checkpoint
          $1$. Then $x/2-3=6$ gives $x=18$. Checking forward:
          $18\to18/2-3=6\to6/2-3=0$ — confirmed.
      - ask: >
          A game ends in a terminal 'win' or 'loss' position. Propagating
          those labels one move at a time to determine every earlier
          position's status is an example of which technique?
        choices:
          - text: >
              Forward simulation from the start.
            feedback: >
              Forward simulation would start from the opening position and
              play out every possible line; this instead starts from the
              already-known terminal labels.
          - text: >
              Meet in the middle.
            feedback: >
              Meeting in the middle runs two searches simultaneously, one from
              each end, and checks where they intersect — this uses only one
              direction, from the goal.
          - text: >
              Working backwards, since it starts from the known terminal
              states and derives each earlier state's status from them.
            correct: true
            feedback: >
              Right: the terminal positions are the tightly-constrained
              'goal,' and every earlier position's label is derived by asking
              what could have led to a known later one.
          - text: >
              Guess and check.
            feedback: >
              Nothing here is guessed — every label is derived directly from
              the terminal positions and the game's rules.
        feedback: >
          This is working backwards applied to labels instead of numbers:
          start from the known terminal win/loss states and derive each
          preceding position's status directly, without ever simulating
          forward from the opening move.
      - teach: >
          The trap is guessing a starting value and simulating forward to
          check it, instead of deriving it directly — guess-and-check can miss
          the answer when the forward branching factor is large. Also verify:
          the backward formula, applied forward, should reproduce the original
          rule exactly.
      - teach: >
          Assume the goal and ask what state had to come immediately before
          it, repeating backward — the goal usually has far fewer predecessors
          than the start has successors.

  - node: quant-puzzles.strategies.state-space
    hook: >
      Any puzzle described by a small, discrete configuration — jug contents, token positions, a permutation of tiles — is secretly a graph, and "can you reach..." is really asking whether two vertices sit in the same connected component.

    explanation: >
      Recast the puzzle explicitly: let every distinct configuration be a vertex, and let every legal move be an edge connecting the configuration it starts from to the one it produces. Under this framing, reachability becomes graph connectivity, and "fewest moves to reach a target" becomes a shortest-path question on that same graph — the puzzle's actual content doesn't change, only the vocabulary for reasoning about it.

      This framing explains why invariants work at all: an invariant is exactly a function that takes the same value on every vertex of a connected component, and parity is the special case where that function is "value mod $2$." A target with a different value therefore sits in a different component by definition — restating, in graph language, the same conclusion the parity check already reaches directly.

      "Fewest moves" is a shortest-path question, and shortest paths are often cheaper to find by working backward from the goal state, exactly the working-backwards move: if the goal is tightly constrained — many source states could reach it, but it has few actual predecessors under the move rule — searching backward from it can reach a small, well-understood frontier far faster than searching forward from a start whose reachable set explodes.

    worked: >
      Two jugs hold $5$ and $3$ liters with no markings; you may fill either jug from a tap, empty either jug, or pour one jug into the other until the source empties or the target fills. Treat each pair $(a,b)$ of current contents as a vertex, with edges for each of those operations. Starting at $(0,0)$, one path through this graph reaches a state with $4$ liters in the $5$-liter jug: fill the $5$ to get $(5,0)$; pour into the $3$ to get $(2,3)$; empty the $3$ to get $(2,0)$; pour the $5$ into the $3$ to get $(0,2)$; fill the $5$ again to get $(5,2)$; pour into the $3$, which has room for $1$ more, to get $(4,3)$. That's $6$ moves to reach $4$ liters — a breadth-first search of this same graph confirms $6$ is in fact the fewest moves possible.

    interview: >
      "How would you solve this systematically, not just by trial and error" is the cue to name the graph explicitly — what a vertex is, what an edge is — since interviewers are listening for the reduction to a standard search problem, not another round of guessing.

    pitfalls: >
      Describing the graph informally without pinning down exactly what a vertex is — an ambiguous state description makes it impossible to say whether two configurations are actually the same vertex or two different ones. Searching forward from a large or unconstrained start when the goal is the tightly constrained side of the problem, when working backward from the goal would shrink the search dramatically.

    recap: >
      Configurations are vertices and moves are edges: reachability is connectivity, fewest-moves is shortest path, and an invariant is just a function constant on one connected component.
    steps:
      - teach: >
          Any puzzle described by a small, discrete configuration — jug
          contents, token positions, a permutation of tiles — is secretly a
          graph, and 'can you reach...' is really asking whether two vertices
          sit in the same connected component.
      - teach: >
          Let every distinct configuration be a vertex, and let every legal
          move be an edge from the configuration it starts at to the one it
          produces. Reachability becomes connectivity, and 'fewest moves to a
          target' becomes a shortest-path question on that same graph.
      - teach: >
          This framing explains why invariants work: an invariant is exactly a
          function that takes the same value on every vertex of one connected
          component, and parity is the special case where that function is
          'value mod $2$.'
      - ask: >
          Two unmarked jugs hold $2$ and $3$ liters. Starting with both empty,
          treating each pair of current contents as a vertex and each fill,
          empty, or pour as an edge, what is the fewest moves needed to get
          exactly $1$ liter into one of the jugs?
        expects: "2"
        hint: >
          Try filling the larger jug first, then pouring it into the smaller
          one.
        feedback: >
          Fill the $3$-liter jug: $(0,0)\to(0,3)$. Pour it into the $2$-liter
          jug until that one is full: $(0,3)\to(2,1)$ — $1$ liter remains in
          the $3$-liter jug, in exactly $2$ moves. No single move from $(0,0)$
          can already show $1$ liter, so $2$ is fewest.
      - teach: >
          'Fewest moves' is a shortest-path question, and shortest paths from
          a tightly constrained goal are often cheaper to find by searching
          backward from that goal than forward from a start whose reachable
          set can explode.
      - ask: >
          With unmarked jugs of $4$ and $6$ liters, every amount reachable in
          either jug must be a multiple of $\gcd(4,6)$. What is $\gcd(4,6)$?
        expects: "2"
        hint: >
          Find the largest integer dividing both $4$ and $6$.
        feedback: >
          $\gcd(4,6)=2$: this is exactly the Invariants modulo $m$ idea
          applied to the jug graph — every reachable quantity is a multiple
          of $2$, so odd amounts like $3$ or $5$ liters are never reachable
          in either jug.
      - ask: >
          You need the fewest moves from a large, loosely constrained start to
          a specific, tightly-defined goal state in a state-space graph. Which
          search direction reaches the goal fastest?
        choices:
          - text: >
              Forward from the start, since that's the natural direction to
              search.
            feedback: >
              Forward search from a loosely constrained start can explode,
              exploring far more of the graph than necessary before ever
              reaching the tightly-defined goal.
          - text: >
              Backward from the goal, since the goal's set of predecessors is
              often much smaller than the start's set of reachable states.
            correct: true
            feedback: >
              Right: when the goal is tightly constrained, its immediate
              predecessors form a small, manageable frontier, which is exactly
              the case working backwards is built for.
          - text: >
              It never matters which direction you search.
            feedback: >
              It very much matters when the two ends of the search have very
              different branching factors, as here.
          - text: >
              Neither — you must enumerate every vertex in the graph first.
            feedback: >
              Enumerating the entire graph first defeats the purpose; the
              point of choosing a search direction is to avoid exploring
              vertices that don't lie on a shortest path.
        feedback: >
          Search from whichever end is more tightly constrained — here, the
          goal — since its predecessor set is typically far smaller than the
          reachable set from a loose start.
      - teach: >
          Describing the graph informally, without pinning down exactly what a
          vertex is, makes it impossible to say whether two configurations are
          actually the same vertex or two different ones.
      - teach: >
          Configurations are vertices and moves are edges: reachability is
          connectivity, fewest-moves is shortest path, and an invariant is
          just a function constant on one connected component.

  - node: quant-puzzles.strategies.adversary
    hook: >
      The words "guarantee," "worst case," "must," or "at least how many" are asking for a specific number: the cost against an opponent who sees everything you've drawn so far and is actively trying to make you work as long as possible.

    explanation: >
      The move is to imagine the hidden data — which card is drawn, which box holds the prize — as chosen not randomly but by an adversary who answers adaptively, consistent with everything already revealed, and whose only goal is to delay you as long as possible. Your answer is whatever cost you can still guarantee against that adversary, which is a fundamentally different number from the cost against a typical or random instance.

      This produces a two-part proof structure worth remembering as a pair: the adversary argument gives you a *lower* bound — a number of draws or tests the adversary can force you to spend no matter what you do — while an actual matching procedure that always succeeds within that many draws supplies the *upper* bound. Only when the two numbers meet is the guarantee proven tight; a lower bound alone tells you the guarantee can't be smaller, not that your specific number is achievable.

    worked: >
      A standard deck has $13$ ranks, four cards of each. How many cards must you draw, in the worst case, to guarantee three cards of the same rank? An adversary handing you cards one at a time, trying to delay a triple as long as possible, gives you exactly two cards of every rank first — $2\times13=26$ cards with no rank appearing three times, which is achievable since each rank has four cards available. The next card, the $27$th, must belong to some rank, and since that rank already has two cards among the first $26$, it becomes a third — forced, regardless of which rank the adversary picks. So $27$ cards guarantee three of a kind, and $26$ do not, since the adversary's exact stalling arrangement is a legal deal.

    interview: >
      "How many do you need to guarantee..." is always this technique; interviewers are listening for the adversary's stalling construction stated explicitly (not just the final count), since the construction is what proves $26$ isn't enough and the pigeonhole step on the next card is what proves $27$ is.

    pitfalls: >
      Computing only the pigeonhole lower bound and forgetting to check that the adversary's stalling arrangement is actually achievable given the real constraints — here, that four cards of each rank genuinely exist to hand out. Answering with the *average*-case number instead of the worst case when the question explicitly said "guarantee" — the two numbers are rarely close.

    recap: >
      Let a worst-case adversary pick the hidden data adaptively against you: the largest stall it can force, plus one more draw, is the guaranteed answer — and it needs both a stalling construction and a forcing step to be proven tight.
    steps:
      - teach: >
          The words 'guarantee,' 'worst case,' 'must,' or 'at least how many'
          are asking for a specific number: the cost against an opponent who
          sees everything you've drawn so far and is actively trying to make
          you work as long as possible.
      - teach: >
          Imagine the hidden data as chosen not randomly but by an adversary
          who answers adaptively, consistent with everything already revealed,
          and whose only goal is to delay you. Your answer is whatever cost
          you can still guarantee against that adversary.
      - teach: >
          This gives a two-part proof: the adversary's stalling arrangement
          supplies a lower bound — a number of draws it can force no matter
          what you do — while a matching argument that always succeeds within
          that many draws supplies the upper bound.
      - ask: >
          A drawer holds $6$ red socks and $8$ blue socks. How many socks must
          you draw, in the worst case, to guarantee a matching pair?
        expects: "3"
        hint: >
          An adversary handing you one of each color first stalls for how many
          draws?
        feedback: >
          The adversary can hand you one red and one blue first — $2$ draws,
          no match. The $3$rd sock has only two colors available, so it must
          repeat one already drawn: $3$ draws guarantee a match, regardless of
          the $6$-versus-$8$ split.
      - teach: >
          The same structure scales past two categories: with $k$ colors, an
          adversary can stall by handing you $2$ of every color first — $2k$
          socks with no triple anywhere — before the next one is forced to
          complete a triple in some color.
      - ask: >
          A drawer holds $4$ colors of socks, $5$ of each. How many socks must
          you draw, in the worst case, to guarantee three of the same color?
        expects: "9"
        hint: >
          The adversary stalls by giving you $2$ of every color first; how
          many is that, and what forces the next one?
        feedback: >
          The adversary hands you $2$ of each of the $4$ colors first —
          $2\times4=8$ socks, no triple yet, achievable since each color has
          $5\ge2$ available. The $9$th sock must repeat some color a third
          time, so $9$ draws guarantee a triple.
      - ask: >
          For the sock-drawer problem, an adversary argument shows that $2$
          draws might not produce a match (one red, one blue). What else is
          needed to prove that $3$ draws truly guarantee a match?
        choices:
          - text: >
              Nothing else — the adversary's stall of $2$ draws already proves
              $3$ is the exact answer.
            feedback: >
              The stall only shows $2$ isn't enough — a lower bound. You still
              need to show $3$ always works, the matching upper-bound step.
          - text: >
              A pigeonhole argument that any $3$rd sock must repeat one of the
              two colors already drawn.
            correct: true
            feedback: >
              Right: the adversary's stall proves the lower bound and
              pigeonhole on the $3$rd sock proves the matching upper bound —
              only together do they pin the guarantee at exactly $3$.
          - text: >
              Running the experiment many times and averaging the results.
            feedback: >
              Averaging answers a different question, the expected number of
              draws, not the worst-case guarantee this argument is after.
          - text: >
              Nothing — a guarantee only ever needs the adversary's stalling
              construction.
            feedback: >
              A stalling construction alone only proves a lower bound; it says
              $2$ can fail, not that $3$ always succeeds. Both halves are
              needed.
        feedback: >
          An adversary argument alone proves only a lower bound. Proving the
          guarantee needs a matching upper-bound step too — here, pigeonhole
          on the $3$rd sock — and only together do the two halves pin the
          answer down.
      - teach: >
          The trap is computing only the stalling lower bound and forgetting
          to check it's actually achievable given the real constraints, and
          separately, answering with the average-case number when the question
          explicitly said 'guarantee.'
      - teach: >
          Let a worst-case adversary pick the hidden data adaptively against
          you: the largest stall it can force, plus one more draw, is the
          guaranteed answer — and it needs both a stalling construction and a
          forcing step to be proven tight.

  - node: quant-puzzles.strategies.guarantee-vs-expectation
    hook: >
      "How many draws does it take" is genuinely two different questions wearing one sentence, and answering the wrong one — average when they asked for worst case, or vice versa — is one of the fastest ways to lose credibility in a puzzle round.

    explanation: >
      A guarantee is the adversarial worst case: the number that holds no matter how the hidden data is arranged. An expectation is an average over a *stated* random model — uniform shuffle, independent draws, whatever the problem specifies — and the two numbers answer genuinely different questions, so there is no reason to expect them to be close, let alone equal.

      The guarantee typically depends only on the coarse structure of the problem — how many categories exist — while the expectation depends on the actual underlying counts, which is why changing the numbers in a problem can leave the guarantee untouched while shifting the expected value noticeably. The practical discipline: when a question says "guarantee," answer with the adversarial number; when it says "on average" or specifies a random model, switch to expectation and say out loud that you're switching models — never answer "on average" to a question that asked for a guarantee, and never answer with the worst case when a random model was explicitly given.

    worked: >
      A drawer holds $6$ red socks and $4$ blue socks, drawn in a uniformly random order. The guarantee for a matching pair is still $3$: with only two colors present, an adversary can hand you one red and one blue first, but the third sock must repeat one of the two colors — this holds regardless of the $6$-versus-$4$ split. The expectation is different: a match occurs on the second draw only if it shares the first draw's color, with probability $(6/10)(5/9)+(4/10)(3/9)=7/15$; otherwise, since only two colors exist, the third draw is forced to match. So the expected number of draws is $2\cdot(7/15)+3\cdot(8/15)=38/15\approx2.533$ — close to, but not equal to, the $10$-red-$10$-blue value of $48/19\approx2.526$, because the expectation, unlike the guarantee, is sensitive to the actual counts.

    interview: >
      "What's the expected number of draws" versus "how many do you need to guarantee" are two different follow-ups interviewers ask back to back specifically to see whether you flag the model switch — naming which one you're computing, before computing it, is the actual skill being tested.

    pitfalls: >
      Assuming the guarantee changes when the color counts change — it usually doesn't, since it depends on the number of categories, not their sizes. Quoting an expectation as though it were a guarantee, or vice versa, without stating the random model the expectation assumes — an interviewer who didn't specify one will ask what you assumed.

    recap: >
      A guarantee is the adversarial worst case and depends on category count; an expectation needs a stated random model and depends on the actual counts — state which one you're answering before you compute it.
    steps:
      - teach: >
          'How many draws does it take?' is genuinely two different questions
          wearing one sentence, and answering the wrong one — average when
          they asked for worst case, or the reverse — is one of the fastest
          ways to lose credibility in a puzzle round.
      - teach: >
          A guarantee is the adversarial worst case: the number that holds no
          matter how the hidden data is arranged. An expectation is an average
          over a stated random model, and the two numbers answer genuinely
          different questions.
      - teach: >
          The guarantee typically depends only on the coarse structure of the
          problem — how many categories exist — while the expectation depends
          on the actual underlying counts, which is why changing the numbers
          can leave the guarantee untouched while shifting the expected value.
      - ask: >
          A drawer holds $3$ red socks and $5$ blue socks. What is the
          guaranteed number of draws needed to be certain of a matching pair,
          in the worst case?
        expects: "3"
        hint: >
          With only two colors present, how many draws can an adversary stall
          for before a repeat is forced?
        feedback: >
          With two colors, an adversary hands you one red and one blue first —
          $2$ draws, no match — but the $3$rd sock must repeat one of the two
          colors. The guarantee is $3$, exactly as it would be for any
          two-color split.
      - teach: >
          The expectation, unlike the guarantee, needs the actual counts:
          compute the probability the second draw already matches the first,
          and otherwise the third draw is forced to match, since only two
          colors exist in total.
      - ask: >
          With $3$ red and $5$ blue socks drawn in uniformly random order, the
          second draw matches the first with probability
          $\frac{3}{8}\cdot\frac{2}{7}+\frac{5}{8}\cdot\frac{4}{7}=\frac{13}{28}$;
          otherwise the third draw is forced to match. What is the expected
          number of draws to get a matching pair?
        expects: "2.536"
        tolerance: 0.001
        hint: >
          Weight $2$ draws by the match-on-second probability, and $3$ draws
          by the complementary probability, and add.
        feedback: >
          $2\cdot\frac{13}{28}+3\cdot\frac{15}{28}=\frac{26+45}{28}=\frac{71}{28}\approx2.536$
          — different from the $3$-red-$5$-blue split's guarantee of $3$,
          since the expectation is sensitive to the actual counts and the
          guarantee isn't.
      - ask: >
          An interviewer asks 'on average, how many socks do you need to draw
          for a matching pair,' immediately after you've already computed the
          worst-case guarantee. What should you do?
        choices:
          - text: >
              Give the same number again — the guarantee already answers any
              version of the question.
            feedback: >
              It doesn't; 'on average' specifies a random model, and the
              expectation under that model is a different number from the
              worst-case guarantee.
          - text: >
              Switch to the expectation, computed under the random model the
              problem specifies, and say out loud that you're switching
              models.
            correct: true
            feedback: >
              Right: naming the switch explicitly is the actual skill being
              tested — checking that you notice these are two different
              questions, not just that you can compute either one.
          - text: >
              Refuse to answer, since the two questions contradict each other.
            feedback: >
              They don't contradict — they're simply different questions about
              the same setup, and both have well-defined answers.
          - text: >
              Answer with whichever number is smaller, since that's the more
              impressive-sounding claim.
            feedback: >
              The choice of which to report is determined by which question
              was asked, never by which number looks better.
        feedback: >
          'Guarantee' and 'on average' specify two different quantities under
          two different assumptions about the hidden data. Naming which one
          you're computing, before computing it, is the actual discipline
          being tested.
      - teach: >
          Assuming the guarantee changes when the color counts change is the
          trap in one direction — it usually doesn't, since it depends on the
          number of categories, not their sizes — and quoting an expectation
          as though it were a guarantee, without stating the random model
          assumed, is the trap in the other.
      - teach: >
          A guarantee is the adversarial worst case and depends on category
          count; an expectation needs a stated random model and depends on the
          actual counts — state which one you're answering before you compute
          it.

  - node: quant-puzzles.strategies.info-lower-bound
    hook: >
      "What's the fewest tests you could possibly need" is answered before any scheme is designed at all — just count how many distinguishable outcomes exist and how many outcomes each test can tell apart.

    explanation: >
      Each test with $b$ possible outcomes can at best multiply the number of histories you're able to distinguish by $b$, so a sequence of $k$ tests distinguishes at most $b^{k}$ total cases. If a procedure has to correctly identify one of $N$ genuinely different possibilities, it needs $k\ge\log_b N$ tests just to have enough distinguishable outcomes to name the answer — rounded up, since $k$ is an integer, $k\ge\lceil\log_b N\rceil$.

      This gives necessity, not sufficiency: the count proves that fewer tests cannot possibly work, since there aren't enough distinguishable outcomes to go around, but it says nothing about whether a scheme achieving that many tests actually exists. A matching construction is still owed separately, exactly as with the adversary argument's lower and upper bounds.

    worked: >
      One bulb is defective among $100$ identical bulbs, and each test is a yes/no question — "is the defective bulb in this specific subset?" With $N=100$ possibilities and $b=2$ outcomes per test, the bound gives $k\ge\log_2 100\approx6.64$, so $k\ge7$. Binary search achieves exactly $7$: split the $100$ into two groups, test one, keep the group containing the defect, and repeat — $100\to50\to25\to13\to7\to4\to2\to1$ is $7$ halvings to isolate a single bulb, matching the bound exactly, since $2^{6}=64<100\le128=2^{7}$.

    interview: >
      "What's the theoretical minimum number of tests" wants $\lceil\log_b N\rceil$ computed explicitly, with $N$ and $b$ both named — how many possibilities the answer must distinguish, and how many outcomes one test produces — before any scheme is proposed.

    pitfalls: >
      Forgetting to count every piece of information the answer must convey — for a defective coin that could be heavy or light, $N$ counts both the coin's identity and its direction, not just the coin. Treating the counting bound as proof that a scheme achieving it exists — it only proves fewer tests are impossible; a working construction is a separate, additional argument.

    recap: >
      Count outcomes: $k$ tests with $b$ results each distinguish at most $b^{k}$ cases, so identifying one of $N$ possibilities needs $k\ge\lceil\log_b N\rceil$ tests — necessity only, a scheme is still owed.
    steps:
      - teach: >
          'What's the fewest tests you could possibly need' is answered before
          any scheme is even designed — just count how many distinguishable
          outcomes exist in total, and how many outcomes each individual test
          can tell apart.
      - teach: >
          A test with $b$ possible outcomes can at best multiply the number of
          histories you can distinguish by $b$, so $k$ tests distinguish at
          most $b^{k}$ cases total. Identifying one of $N$ genuinely different
          possibilities needs $k\ge\lceil\log_b N\rceil$ tests.
      - teach: >
          This gives necessity, not sufficiency — the count proves fewer tests
          can't possibly work, but it says nothing about whether a scheme
          achieving that many tests actually exists. A matching construction
          is still owed separately.
      - ask: >
          One counterfeit coin sits among $27$ identical coins, known to be
          heavier than the rest, and you have a balance with three outcomes
          per weighing. What is the fewest weighings that could possibly
          identify it?
        expects: "3"
        hint: >
          Compute $\lceil\log_3 27\rceil$.
        feedback: >
          $N=27$, $b=3$, and $3^3=27$ exactly, so $\lceil\log_3 27\rceil=3$ —
          and splitting the coins into three equal groups of $9$ each weighing
          achieves it.
      - teach: >
          The same count works for any $b$ and $N$: $\lceil\log_2 N\rceil$
          yes/no questions identify one of $N$ possibilities, and $\log_2(n!)$
          comparisons are needed to sort $n$ items — always the same 'count
          the outcomes' argument.
      - ask: >
          A test is a single yes/no question. What is the fewest such
          questions needed, in the worst case, to identify one of $50$
          possibilities?
        expects: "6"
        hint: >
          Find the smallest integer $k$ with $2^{k}\ge50$.
        feedback: >
          $2^{5}=32<50\le64=2^{6}$, so $\lceil\log_2 50\rceil=6$.
      - ask: >
          One counterfeit coin sits among $9$ coins and is either heavier or
          lighter than the rest, direction unknown, and you have a balance.
          How many distinguishable possibilities must your answer be able to
          name?
        choices:
          - text: >
              $9$ — just which coin is counterfeit.
            feedback: >
              This counts only the coin's identity and forgets that the answer
              must also state whether it's heavy or light.
          - text: >
              $18$ — each of the $9$ coins could be the counterfeit, and
              independently either heavier or lighter.
            correct: true
            feedback: >
              Right: the answer must name both which coin and which direction,
              so $N=9\times2=18$, exactly as $N=24$ in the classic $12$-coin
              version counts $12$ coins times $2$ directions.
          - text: >
              $3$ — matching the number of outcomes a single weighing
              produces.
            feedback: >
              That's $b$, the outcomes per test, not $N$, the number of
              possibilities the final answer must distinguish among.
          - text: >
              $27$, since $3^{3}=27$.
            feedback: >
              That's $b^{k}$ for some already-chosen $k=3$, not the actual
              count of distinguishable possibilities this specific problem
              poses.
        feedback: >
          Every piece of information the final answer must convey counts
          toward $N$ — here, both the coin's identity and its direction,
          giving $N=9\times2=18$, not just $9$.
      - teach: >
          The trap is treating the counting bound as proof that a scheme
          achieving it exists — it only proves fewer tests are impossible. A
          working construction is a separate, additional argument.
      - teach: >
          Count outcomes: $k$ tests with $b$ results each distinguish at most
          $b^{k}$ cases, so identifying one of $N$ possibilities needs
          $k\ge\lceil\log_b N\rceil$ tests — necessity only, a scheme is still
          owed.
