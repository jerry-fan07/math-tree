unit: quant-puzzles.strategies
opening: >
  Brainteaser rounds reward one thing above cleverness: a short list of moves you reach for automatically the moment you recognize the shape of a problem. This unit builds that list from the ground up — start by tabulating small cases, then use what the table reveals to find an invariant, and specialize that invariant to the cheap cases of parity, residues mod m, and board coloring. From there it turns to processes that must stop (monovariants), games that reward copying the opponent (symmetry) or seizing the extreme element, and existence proofs that need no construction at all (averaging). It closes with the search-and-inversion moves — working backwards, framing a puzzle as a graph — and the two adversarial tools, worst-case guarantees and information counting, that quantify exactly how hard a puzzle must be.

lessons:
  - node: quant-puzzles.strategies.small-cases
    hook: >
      A problem with a size parameter $n$ and no other handle is an invitation to spend thirty seconds building a table before you spend thirty minutes stuck — most interview puzzles surrender their pattern by $n=4$.

    explanation: >
      The move is mechanical: fix $n=1$, solve it by hand, then $n=2,3,4$, and write the answers in a row. Look at the row two ways — the raw values, for a closed form, and the successive differences or ratios, for a recurrence. Either one, once guessed, is a conjecture, not an answer; the guess still owes you a proof, usually by induction using the recurrence you just spotted, or by a direct combinatorial argument once the pattern makes the mechanism visible.

      Small cases are also where invariants and losing positions first show themselves — a quantity that happens to equal $3$ at every one of $n=1,\dots,4$ is a candidate for something a move can never change, which is exactly what Invariants formalizes. The table does not just guess the destination; it often exposes the machinery that gets you there.

      The discipline that keeps this technique from misleading you is knowing how many terms are enough. A handful of terms fit any number of different formulas — three points fit infinitely many curves — so trust the pattern only once you can explain, structurally, why each new case adds what it adds, not merely because the digits lined up.

    worked: >
      How many regions do $n$ lines in general position (no two parallel, no three through a point) cut the plane into? At $n=1,2,3,4$: a single line gives $2$ regions; a second line crosses the first once, adding $2$ new regions, giving $4$; a third line crosses both previous lines at two new points, adding $3$ regions, giving $7$; a fourth adds $4$, giving $11$. The differences $2,3,4$ climb by exactly $1$ each time because the $k$-th line crosses all $k-1$ earlier lines at $k-1$ distinct points, which splits it into $k$ pieces, each piece cutting one existing region into two — so line $k$ always adds exactly $k$ regions. Summing, $n$ lines give $1+\sum_{i=1}^{n} i = 1+n(n+1)/2$ regions, so the answer at $n=4$ is $1+10=11$, matching the table, and the mechanism — each new line crosses everything before it at distinct points — is exactly why this pattern never breaks the way the circle-chord count does.

    interview: >
      "What's the pattern for $n$ lines / $n$ cuts / $n$ moves" wants you to build the table out loud, state the guessed recurrence in words before the formula, and name the mechanism that would let you prove it — silence on the mechanism reads as a guess, not a derivation.

    pitfalls: >
      Stopping at three terms and declaring victory: many low-degree-looking sequences agree on their first three or four values and diverge afterward, which is exactly the trap the circle-chord count sets. Guessing a formula from the raw values while ignoring the differences, which is usually where the actual recurrence — and the mechanism that proves it — is sitting in plain sight.

    recap: >
      Tabulate $n=1,\dots,4$, read the differences for a recurrence, and treat the result as a conjecture to be proved, not an answer to be reported.
    dialogue:
      - part: A circle too big to simulate
        teach: >
          A hundred traders stand in a circle, numbered $1$ to $100$ clockwise.
          Starting from trader $1$, every second trader is sent home: $2$
          leaves, then $4$, then $6$, and the count carries on round the circle
          past $100$ and back to the start until one trader is left. The
          interviewer wants the survivor's number, and there is no paper.
      - ask: >
          Before a hundred, try five. Traders $1$ to $5$ play the same game.
          Who is left?
        expects: "3"
        hint: >
          $2$ and $4$ go on the first lap. Keep counting from $5$: who is the
          next "second" trader?
        feedback: >
          $2$ and $4$ leave; then $5$ is skipped and $1$ leaves; then $3$ is
          skipped and $5$ leaves. Trader $3$ survives.
      - ask: >
          Now six traders. Who is left?
        expects: "5"
        hint: >
          The first lap removes every even number and ends on trader $6$, so
          the next count starts at $1$ again.
        feedback: >
          $2$, $4$, $6$ leave on the first lap. Then $1$ is skipped and $3$
          leaves, $5$ is skipped and $1$ leaves. Trader $5$ survives.
      - ask: >
          Simulating a hundred traders the same way means $99$ eliminations,
          tracked in your head. What is the honest risk of doing that in an
          interview?
        choices:
          - text: >
              None: it is slow but mechanical, and the interviewer will wait.
            feedback: >
              Mechanical is not the same as safe. One slipped count around lap
              three and every later elimination is wrong, with nothing to tell
              you so. Five minutes of silence, too, is itself an answer.
          - text: >
              It works, but it only answers $n = 100$; you learn nothing about
              $101$, and one slip silently ruins the result.
            correct: true
            feedback: >
              The brute force is a single, fragile data point. What you want
              is the rule that produced $3$ and $5$, so that $100$ becomes one
              line of arithmetic.
          - text: >
              It cannot work, because the circle wraps around and the count
              never settles.
            feedback: >
              It settles: every step removes a trader, so after $99$ steps one
              is left. The trouble is cost and fragility, not termination.
        feedback: >
          You have two cheap data points already. The question is how many
          more you need before a rule shows itself.

      - part: A table, and the rule hiding in it
        teach: >
          Running the game for $1$ through $8$ traders the same way gives the
          survivors $1, 1, 3, 1, 3, 5, 7, 1$ — your $3$ and $5$ sit in the
          fifth and sixth places.
      - ask: >
          Read the row: the survivor drops back to $1$ at $n = 1, 2, 4, 8$ and
          climbs by $2$ in between. If the pattern holds, who survives among
          $12$ traders?
        expects: "9"
        hint: >
          The last reset is at $8$. How many steps of $+2$ separate $8$ from
          $12$?
        feedback: >
          From the reset at $n = 8$ the survivor climbs $1, 3, 5, 7, 9$ for
          $n = 8, 9, 10, 11, 12$. So $12$ traders leave trader $9$.
      - reflect: >
          A row of eight numbers is a guess, not a reason. Why would the
          survivor reset to $1$ exactly at the powers of two? Look at what the
          circle of $2m$ traders looks like after the first lap.
        hint: >
          With an even number of traders, the first lap removes exactly the
          even numbers and the count arrives back at trader $1$.
        answer: >
          With $2m$ traders the first lap removes $2, 4, \dots, 2m$ and play
          resumes at trader $1$ with the $m$ odd traders $1, 3, \dots, 2m-1$.
          That is the same game on $m$ people, relabelled: whoever is $j$-th
          in the small game is trader $2j - 1$ in the big one. So the survivor
          of $2m$ is $2J(m) - 1$, where $J(m)$ is the survivor of $m$. Since
          $J(1) = 1$, doubling keeps giving $2 \cdot 1 - 1 = 1$: every power of
          two returns trader $1$.
      - teach: >
          That is the technique. When a problem carries a size $n$ and offers
          no handle, solve $n = 1, 2, 3, 4$ and a few more by hand, lay the
          answers in a row, and read off a closed form or a recurrence. The
          row is a conjecture. It becomes an answer only when you can say what
          each case inherits from a smaller one — here, that one lap halves
          the circle. Written out, $n = 2^{a} + L$ with $0 \le L < 2^{a}$
          gives the survivor $2L + 1$.
      - ask: >
          Use the rule: who survives among the original $100$ traders?
        expects: "73"
        hint: >
          Find the largest power of two not above $100$.
        feedback: >
          $100 = 64 + 36$, so $L = 36$ and the survivor is
          $2 \cdot 36 + 1 = 73$.

      - part: Checking the rule where the table did not
        ask: >
          The reflection covered an even circle. With an odd circle of $2m+1$
          traders, the first lap removes $2, 4, \dots, 2m$ and then trader
          $1$, and play resumes at trader $3$. Which recurrence follows?
        choices:
          - text: >
              $J(2m+1) = 2J(m) - 1$, the same as the even case.
            feedback: >
              Test it: $m = 2$ would give $J(5) = 2 \cdot 1 - 1 = 1$, but you
              computed $J(5) = 3$. The odd circle loses trader $1$ as well, so
              the relabelling shifts.
          - text: >
              $J(2m+1) = 2J(m) + 1$
            correct: true
            feedback: >
              The $m$ traders left are $3, 5, \dots, 2m+1$, and the $j$-th of
              them is trader $2j + 1$. Check: $J(5) = 2J(2) + 1 = 3$.
          - text: >
              $J(2m+1) = 2J(m)$
            feedback: >
              That is always even, and every even trader leaves on the first
              lap — the survivor of an odd circle has to be odd. The
              relabelling is $j \mapsto 2j + 1$, not $j \mapsto 2j$.
        feedback: >
          Both recurrences together prove the rule $2L + 1$ by induction: each
          case is built from one about half its size, and the table stops
          being a guess.
      - ask: >
          Check the even recurrence on a case outside the table: you know
          $J(5) = 3$. What does $J(2m) = 2J(m) - 1$ give for ten traders?
        expects: "5"
        feedback: >
          $J(10) = 2 \cdot 3 - 1 = 5$, and the rule agrees: $10 = 8 + 2$ gives
          $2 \cdot 2 + 1 = 5$.
      - ask: >
          A different problem's table reads $1, 2, 4$ for $n = 1, 2, 3$. One
          candidate says the next entry is $8$, another says $7$. Who is right?
        choices:
          - text: >
              The first: the entries double, so the rule is $2^{n-1}$.
            feedback: >
              Doubling fits, and so does $1 + n(n-1)/2$, which gives
              $1, 2, 4, 7$. Three points fit infinitely many rules; the circle
              chord count follows $2^{n-1}$ for five terms and then
              gives $31$.
          - text: >
              The second: differences of $1, 2$ continue as $3$.
            feedback: >
              Equally a guess. Without knowing what each new case adds, the
              differences could just as well double. Neither candidate has a
              mechanism.
          - text: >
              Neither can be settled from three terms; it takes the mechanism
              that produces each new case.
            correct: true
            feedback: >
              Right. The table proposes, the mechanism decides — which is why
              the survivor rule needed the lap argument before it was trusted
              at $100$.
        feedback: >
          Out loud in an interview: "Let me do $n = 1$ to $4$ — here is the
          pattern, here is my guess, and here is why each case comes from the
          one half its size." The last clause is the part that earns the
          answer.

  - node: quant-puzzles.strategies.invariant
    hook: >
      Any question phrased "can you reach..." or "is it possible to end with..." under repeatable local moves is asking you to find the one quantity those moves can never touch.

    explanation: >
      An invariant is a quantity, or a property, that every legal move leaves unchanged. Finding one is algebra, not insight: write down a generic move — erase this, write that — and evaluate your candidate quantity before and after; if the two values always agree, the quantity is fixed on everything reachable from the start, and any target with a different value is provably unreachable, no matter how many moves you allow.

      Two directions of the argument are not symmetric. An invariant only ever proves impossibility — start and target with different invariant values can never be connected. Concluding that a target with the *same* value as the start is actually reachable is a separate claim that needs an explicit sequence of moves, since agreement of one quantity says nothing about every other obstruction that might exist.

      Invariants need not be sums; anything that transforms predictably under the move works, including quantities built multiplicatively. The habit worth building is to try the move on two symbolic numbers $a,b$ first and see what combination of them survives untouched — that combination, not the numbers themselves, is the invariant.

    worked: >
      Write $1,2,3,4$ on a board. A move erases two numbers $a,b$ and writes $ab+a+b$ in their place. Does the final single number depend on the order of moves? Notice $ab+a+b+1=(a+1)(b+1)$, so replacing $a,b$ by $ab+a+b$ replaces the two factors $(a+1)$ and $(b+1)$ in the product $\prod (x_i+1)$ by their product $(a+1)(b+1)$ — the product itself is invariant. Starting value: $(1+1)(2+1)(3+1)(4+1)=2\cdot3\cdot4\cdot5=120$. So whatever single number $x$ remains at the end satisfies $x+1=120$, giving $x=119$ regardless of merge order. Checking one path: merge $1,2\to 5$; merge $3,4\to 19$; merge $5,19\to 6\cdot20-1=119$ — confirmed.

    interview: >
      "Show the answer doesn't depend on the order of moves" is the standard phrasing; interviewers want the candidate quantity evaluated symbolically on one generic move before any claim about the final answer, since testing on the given numbers alone can pass by coincidence.

    pitfalls: >
      Testing a candidate invariant only on the specific numbers given, then generalizing — a quantity that happens to survive one particular merge can still change on a different pair; verify it algebraically on symbolic $a,b$. Treating "the invariant matches" as proof that a target is reachable, when it only ever rules impossible targets out.

    recap: >
      Test a candidate quantity symbolically against one generic move: if it never changes, it is fixed on everything reachable, and a mismatched target is provably out of reach.
    dialogue:
      - part: A target that never turns up
        teach: >
          Three numbers sit on a board: $1, 2, 3$. A move picks two of them,
          $a$ and $b$, and replaces them by $(a+b)/\sqrt{2}$ and
          $(a-b)/\sqrt{2}$; the third number stays. The interviewer asks
          whether some sequence of moves can turn the board into $2, 2, 2$.
      - ask: >
          Make one move on the $1$ and the $3$, with $a = 1$ and $b = 3$. The
          board now reads $2\sqrt{2}, 2, -\sqrt{2}$. What is the sum of the
          three numbers now? Two decimal places are enough.
        expects: "3.41"
        tolerance: 0.01
        hint: >
          $\sqrt{2} \approx 1.414$, and the sum is $2\sqrt{2} + 2 - \sqrt{2}$.
        feedback: >
          $2\sqrt{2} + 2 - \sqrt{2} = 2 + \sqrt{2} \approx 3.41$. The sum
          started at $6$, so the sum is not what the moves respect, and it
          cannot be used to compare start and target.
      - ask: >
          You spend ten minutes trying sequences of moves and never land on
          $2, 2, 2$. What have you shown?
        choices:
          - text: >
              That $2, 2, 2$ is unreachable, since ten minutes covers the
              reasonable sequences.
            feedback: >
              The moves can be repeated forever and each one produces new
              irrational entries, so there are infinitely many boards to
              visit. Failing to find a path is not the same as there being
              none.
          - text: >
              Nothing yet: the search is infinite, so not finding a path
              proves nothing either way.
            correct: true
            feedback: >
              Right. To prove "never" you need a reason that covers every
              sequence at once, including the ones you did not try.
          - text: >
              That $2, 2, 2$ is reachable but needs a long sequence.
            feedback: >
              Nothing you saw points that way. Absence of a path in ten
              minutes is evidence of nothing, in either direction.
        feedback: >
          A search can find a path but never rule one out. Ruling out needs a
          different kind of argument.
      - reflect: >
          What property would a quantity computed from the board need, so
          that comparing its value at $1, 2, 3$ and at $2, 2, 2$ settles the
          question for every sequence of moves at once? Can you find such a
          quantity for this move?
        hint: >
          The move divides by $\sqrt{2}$. What happens when you square
          $(a+b)/\sqrt{2}$ and $(a-b)/\sqrt{2}$ and add them?
        answer: >
          It must take the same value before and after every legal move; then
          it takes the same value on every board reachable from the start. The
          sum of squares does it: $((a+b)^{2} + (a-b)^{2})/2 = a^{2} + b^{2}$,
          because the cross terms $\pm 2ab$ cancel. So $a^{2} + b^{2} + c^{2}$
          never changes, and a target with a different value is out of reach.

      - part: Naming it, and using it
        teach: >
          A quantity every legal move leaves unchanged is an invariant. The
          method is the one you just used: write one generic move on symbols
          $a$ and $b$, evaluate the candidate before and after, and if the
          two agree for all $a$ and $b$, the candidate is constant on
          everything reachable. A start and a target with different values can
          never be joined.
      - ask: >
          The sum of squares of $1, 2, 3$ is $14$. What is it for $2, 2, 2$?
        expects: "12"
        feedback: >
          $4 + 4 + 4 = 12 \ne 14$, so no sequence of moves, however long,
          reaches $2, 2, 2$.
      - ask: >
          A colleague checks the sum of squares on your single move — $14$
          before, $8 + 4 + 2 = 14$ after — and calls the invariant proved.
          What is missing?
        choices:
          - text: >
              Nothing: a quantity that survives a move is invariant.
            feedback: >
              It survived one move on one pair of numbers. The cube sum or
              some other quantity might happen to agree on a lucky pair too;
              only a check on symbolic $a$ and $b$ covers every move.
          - text: >
              More numerical checks, say on ten random moves.
            feedback: >
              Ten agreements make it plausible, not certain. The algebra
              $((a+b)^{2} + (a-b)^{2})/2 = a^{2} + b^{2}$ is one line and
              covers infinitely many moves.
          - text: >
              The identity on symbols: the two new squares add to
              $a^{2} + b^{2}$ for every $a$ and $b$.
            correct: true
            feedback: >
              That is the whole proof. The third number is untouched, so the
              total sum of squares is unchanged by every move.
        feedback: >
          Verify a candidate on a generic move, never only on the numbers in
          front of you.
      - ask: >
          Invariants also compute. A new board holds $1, 2, 4, 10$, and a move
          erases two numbers $a, b$ and writes the single number
          $\sqrt{a^{2} + b^{2}}$. After three moves one number is left. What
          is it?
        expects: "11"
        hint: >
          Which quantity does replacing $a, b$ by $\sqrt{a^{2} + b^{2}}$
          leave unchanged?
        feedback: >
          The sum of squares is invariant again: $(\sqrt{a^{2}+b^{2}})^{2}
          = a^{2} + b^{2}$. It starts at $1 + 4 + 16 + 100 = 121$, so the last
          number $x$ has $x^{2} = 121$ and $x = 11$, whatever order you merge
          in.
      - ask: >
          Without the invariant, how many different merge orders would you
          have to try to be sure the answer never depends on the order? The
          first move picks one of $\binom{4}{2}$ pairs, the second one of
          $\binom{3}{2}$, the last is forced.
        expects: "18"
        feedback: >
          $6 \cdot 3 \cdot 1 = 18$ orders, and the count explodes with more
          numbers. The invariant answers all of them in one line — that is
          what it buys you.

      - part: What an invariant cannot do
        ask: >
          Back to the first board, $1, 2, 3$. Someone proposes the target
          $0, 1, \sqrt{13}$, whose sum of squares is also $14$. What does the
          invariant say?
        choices:
          - text: >
              It is reachable, because the invariant matches.
            feedback: >
              A match only means this one obstruction is absent. Other
              invariants may still separate the two boards, and only an
              explicit sequence of moves proves a target reachable.
          - text: >
              Nothing either way: a matching value rules nothing out and
              proves nothing reachable.
            correct: true
            feedback: >
              Right. An invariant is a one-way tool: a mismatch proves
              impossibility, a match leaves the question open.
          - text: >
              It is unreachable, because $\sqrt{13}$ is not of the form
              $(a \pm b)/\sqrt{2}$.
            feedback: >
              That is a guess about which numbers can appear, not an argument;
              the invariant certainly does not say it.
        feedback: >
          In an interview: name the quantity, show the one-line check on a
          generic move, compare start and target. If they differ, you are
          done; if they match, say that you still owe a construction.

  - node: quant-puzzles.strategies.parity
    hook: >
      Parity is the invariant to try first on any reachability question, because checking it costs one line of arithmetic: count something mod $2$ and see if the move can touch it.

    explanation: >
      The instinct that makes parity worth trying before any other invariant is that it's free — you don't need to find a clever quantity, only to count something and reduce mod $2$. The candidates worth trying, in order, are: the count of some feature of the state, a coordinate sum, and the sign of a permutation, which flips with every single swap. Whichever you pick, the check is the same one line used for any invariant: does one generic move change the count by an odd amount or an even one? Even means parity survives; odd means it flips every time, which is just as useful — you then track parity as a function of the move count instead of a constant.

      Once parity is pinned to a candidate, the argument writes itself: compute the starting parity, compute the target parity, and if they disagree, no sequence of moves — however long, however clever — can connect them. This is the same "algebra on a generic move" habit from the invariant idea, specialized to the cheapest modulus there is.

    worked: >
      Fifteen people are at a party; can each person shake hands with exactly $3$ others? Every handshake involves two people, so it adds exactly $1$ to each of two people's handshake counts, meaning it adds exactly $2$ to the sum of everyone's handshake counts — that sum is always even, for any graph of handshakes at all. If each of the $15$ people shook exactly $3$ hands, the sum would be $15\times3=45$, which is odd. An odd sum is impossible for a quantity that only ever increases by $2$, so no such handshake arrangement exists — the answer is no, and the reason is a one-line parity check on the total.

    interview: >
      "Is this achievable" questions about degrees, counts, or repeated swaps are fished for the parity check first; interviewers listen for you to name the quantity being counted mod $2$ before attempting any construction, since a five-second parity check can close the question outright.

    pitfalls: >
      Checking parity of the wrong quantity — the handshake sum, not the number of people, is what's forced even; miscounting which object the invariant lives on gives a false "possible." Assuming a move that swaps two elements always preserves parity of a count; it depends entirely on what's being counted, not on the word "swap" alone.

    recap: >
      Count something mod $2$ and compare start to target before trying anything else — a mismatched parity settles the question in one line.
    dialogue:
      - part: A knight that has to come home
        teach: >
          A knight stands on a corner square of an empty chessboard. The
          interviewer asks: can it make exactly $15$ moves and finish on the
          corner where it started?
      - ask: >
          Start small. What is the fewest number of moves that leaves the
          knight back on its corner?
        expects: "2"
        feedback: >
          Out and straight back: $2$ moves. Shuttling like that makes every
          even count easy — $4$, $6$, $14$. The question is about an odd
          count, and no shuttle gives you one.
      - ask: >
          Name each square by (column, row), each from $1$ to $8$, so the
          corner is $(1, 1)$ with $x + y = 2$. The knight goes to $(2, 3)$,
          then $(4, 4)$, then $(3, 6)$. What is $x + y$ on $(3, 6)$?
        expects: "9"
        feedback: >
          The sums along the way are $2, 5, 8, 9$: even, odd, even, odd. The
          sum keeps changing, but its parity alternates without exception.
      - ask: >
          You try to close a loop of $3$ or $5$ moves back to the corner and
          keep failing. What do the failures establish?
        choices:
          - text: >
              That odd loops do not exist, since the short ones were checked.
            feedback: >
              You checked some short loops, not all loops of every odd length
              up to $15$. A failed search is a reason to suspect, never a proof.
          - text: >
              That $15$ is possible but needs a long detour you have not found.
            feedback: >
              Nothing you have seen points that way. The sums $2, 5, 8, 9$
              actually suggest the opposite.
          - text: >
              Nothing yet; you need a reason that covers every route at once.
            correct: true
            feedback: >
              Right — and the sums you just computed are a hint at what that
              reason looks like.
        feedback: >
          A search finds routes; it never rules them out. Ruling out takes an
          invariant.
      - reflect: >
          Look again at $2, 5, 8, 9$. What does every knight move, from any
          square, do to $x + y$, and what does that decide about $15$ moves?
        hint: >
          A knight move changes one coordinate by $1$ and the other by $2$,
          each with either sign.
        answer: >
          The change in $x + y$ is $\pm 1 \pm 2$, which is $\pm 1$ or $\pm 3$ —
          always odd. So the parity of $x + y$ flips at every move: even after
          an even number of moves from the corner, odd after an odd number.
          After $15$ moves $x + y$ is odd, and the corner has $x + y = 2$, so
          the knight cannot be home. On a coloured board this is the familiar
          fact that a knight always changes colour.

      - part: Parity, and where it applies
        teach: >
          That is a parity argument: an invariant counted mod $2$. It is the
          first invariant to test because it costs nothing — count something,
          ask whether each move changes it by an even or an odd amount. Here
          the invariant is the parity of $x + y$ plus the number of moves
          made. The tells are moves that change a count by a fixed parity,
          things that come in pairs, alternating squares, and swaps.
      - ask: >
          The knight starts at $(1, 1)$ again. Which trip does parity rule
          out?
        choices:
          - text: >
              To $(8, 8)$ in exactly $6$ moves.
            feedback: >
              $(8, 8)$ has $x + y = 16$, even, and $6$ moves keep the parity
              even, so parity allows it. In fact $6$ is the knight's shortest
              route corner to corner.
          - text: >
              To $(2, 3)$ in exactly $5$ moves.
            feedback: >
              $x + y = 5$ is odd and $5$ moves make it odd, so parity allows
              it — one move there and two shuttles.
          - text: >
              To $(8, 7)$ in exactly $10$ moves.
            correct: true
            feedback: >
              $x + y = 15$ is odd, but after $10$ moves the parity is back to
              even. Impossible, whatever the route.
        feedback: >
          Parity compares start, target and the number of moves. When the
          parities agree it is silent, and a route still has to be shown.
      - ask: >
          Six cards lie in order $1, 2, 3, 4, 5, 6$. A move swaps two
          neighbouring cards. Can exactly $7$ moves leave the cards in their
          original order?
        choices:
          - text: >
              Yes: swap the same pair back and forth.
            feedback: >
              Back and forth takes an even number of swaps. After six, the
              seventh leaves one pair out of order, and swapping another pair
              instead does not help.
          - text: >
              No: every neighbouring swap changes the number of out-of-order
              pairs by exactly $1$, so after $7$ swaps that number is odd, and
              the sorted order has none.
            correct: true
            feedback: >
              Swapping neighbours $u, v$ changes only whether $u$ and $v$ are
              in order; every other pair keeps its relative order. The count
              of out-of-order pairs, the inversions, flips parity every move.
          - text: >
              It depends on which pairs you swap.
            feedback: >
              Every neighbouring swap changes the inversion count by exactly
              $\pm 1$, whatever the pair. The parity after $7$ moves is fixed.
        feedback: >
          The sign of a permutation is this parity: the number of inversions
          mod $2$, flipped by every swap.
      - ask: >
          How many out-of-order pairs does the arrangement $2, 1, 4, 3, 6, 5$
          have?
        expects: "3"
        feedback: >
          $(2, 1)$, $(4, 3)$ and $(6, 5)$, and no others: $3$, which is odd.
          So it can be reached from $1, \dots, 6$ in $3$ neighbouring swaps,
          or $5$, or $7$, but never in an even number.

      - part: When parity is silent
        ask: >
          A king moves one square in any of the eight directions. It starts on
          the corner $(1, 1)$. What is the smallest odd number of moves that
          brings it back?
        expects: "3"
        hint: >
          A diagonal step changes $x + y$ by $0$ or $\pm 2$.
        feedback: >
          $(1, 1) \to (2, 1) \to (2, 2) \to (1, 1)$: a step right, a step up,
          and one diagonal step home. Add six shuttles and $15$ moves works
          too.
      - ask: >
          Why does the parity argument that stopped the knight fail for the
          king?
        choices:
          - text: >
              The king's moves change $x + y$ by $0$, $\pm 1$ or $\pm 2$ — some
              even, some odd — so no parity is fixed.
            correct: true
            feedback: >
              Right. A parity invariant needs every move to change the count
              by the same parity. Mixed moves leave nothing to count.
          - text: >
              The king moves only one square, so it can reach more squares.
            feedback: >
              The knight reaches every square too. Reach is not the issue;
              what the move does to $x + y$ mod $2$ is.
          - text: >
              Parity works for the king as well; $15$ moves is still
              impossible.
            feedback: >
              The route $(1, 1) \to (2, 1) \to (2, 2) \to (1, 1)$ plus six
              shuttles is $15$ legal moves home. An invariant cannot outlaw
              a route you can exhibit.
        feedback: >
          Out loud: "Each knight move changes $x + y$ by an odd amount, so the
          colour alternates; after $15$ moves it is on the other colour, so
          no." Parity first, because when it applies it is one sentence.

  - node: quant-puzzles.strategies.mod-invariant
    hook: >
      When start and target agree mod $2$, don't give up on invariants — try the modulus the move's own numbers are hinting at, usually visible directly in how much each quantity shifts per move.

    explanation: >
      The generalization is direct: instead of reducing a count mod $2$, reduce mod whatever integer $m$ the move sizes suggest — often the gcd of the amounts a move can add or subtract. If a move always changes some tracked quantity by a multiple of $m$, that quantity's residue mod $m$ is invariant, exactly as in the parity case, just with a different divisor.

      The pattern to look for is a move that shifts a state variable by a fixed amount whose factors don't include $2$, or a linear combination of several state variables that happens to always change by a multiple of $m$ even though no single variable does. Once you spot that combination, the argument is identical to parity: compute its residue at the start, compute the residue a target would need, and a mismatch rules the target out completely.

    worked: >
      A counter starts at $0$. Each move adds $8$, with all arithmetic taken mod $12$ (so the counter is really a position on a $12$-hour clock, and a step is really $+8$ or, after wrapping past $12$, $+8-12=-4$). Can the counter ever show $6$? Since $8$, $-4$, and the wraparound $12$ are all multiples of $4$, every step changes the counter's value by a multiple of $4$, so its value mod $4$ stays $0$ forever. The target $6$ satisfies $6\equiv 2\pmod 4$, which never matches $0$, so $6$ is unreachable no matter how many moves are taken — only $0,4,8\pmod{12}$ are ever visited.

    interview: >
      "Can you reach this configuration" with move sizes that are not $\pm1$ is testing whether you generalize parity on your own; naming the modulus as the gcd of the move amounts, out loud, before computing residues, is what separates a memorized trick from an understood one.

    pitfalls: >
      Trying mod $2$ out of habit when the move sizes share a larger common factor — a coarser modulus like mod $4$ can forbid targets that mod $2$ alone would miss entirely. Forgetting to check that the *same* modulus actually applies to every move available, not just the one you happened to compute first.

    recap: >
      Reduce mod the gcd of the move sizes, not just mod $2$: a target whose residue disagrees with the start's is unreachable under that modulus.
    dialogue:
      - part: A display that will not show fifty
        teach: >
          A display shows $1$. Each press of a button either adds $6$ or
          subtracts $9$, and the display may go negative. The interviewer
          asks whether it can ever show $50$.
      - ask: >
          Try the obvious first. Pressing $+6$ alone, what is the largest
          number you can show without passing $50$?
        expects: "49"
        feedback: >
          $1 + 6 \cdot 8 = 49$, one short. The next press overshoots to $55$,
          and $55 - 9 = 46$. Mixing presses keeps landing near $50$ and never
          on it — which proves nothing yet.
      - ask: >
          Parity is free, so test it. What does parity say about reaching
          $50$?
        choices:
          - text: >
              Unreachable: the display starts odd and $50$ is even.
            feedback: >
              $-9$ is odd, so one press of it flips the parity: $1 - 9 = -8$
              is even. Parity is not preserved here, so it rules nothing out.
          - text: >
              Reachable: $-9$ flips the parity, so even numbers are available.
            feedback: >
              Parity being satisfiable is not reachability. The display can be
              even, but that does not mean it can be $50$.
          - text: >
              Nothing: $+6$ keeps the parity and $-9$ flips it, so no parity
              is invariant.
            correct: true
            feedback: >
              Right. With one even move and one odd move, mod $2$ carries no
              information. That is not the end of invariants.
        feedback: >
          Parity is silent. The question is which other count the presses
          respect.
      - reflect: >
          What do $6$ and $9$ have in common that $50 - 1$ does not, and what
          quantity does that make invariant?
        hint: >
          Factor $6$, $9$ and $49$.
        answer: >
          Both $6$ and $9$ are multiples of $3$, so every press changes the
          display by a multiple of $3$ and the display mod $3$ never changes.
          It starts at $1 \bmod 3$. But $50 \equiv 2 \pmod 3$ — equivalently,
          $49$ is not a multiple of $3$ — so $50$ is unreachable however many
          presses you make.

      - part: Picking the modulus
        teach: >
          That is an invariant modulo $m$. When parity says nothing, reduce
          mod the number the move sizes suggest — usually their greatest
          common divisor, here $\gcd(6, 9) = 3$. If every move changes a
          quantity by a multiple of $m$, its residue mod $m$ is fixed, and a
          target with another residue is unreachable. Parity is the case
          $m = 2$.
      - ask: >
          How many of the numbers $1, 2, \dots, 30$ pass the mod $3$ test, so
          that the invariant does not rule them out?
        expects: "10"
        hint: >
          The survivors are the numbers that leave remainder $1$ on division
          by $3$.
        feedback: >
          $1, 4, 7, \dots, 28$: that is $(28 - 1)/3 + 1 = 10$ numbers. The
          other $20$ are ruled out at once.
      - ask: >
          Does the invariant show that all $10$ of those numbers can actually
          be shown?
        choices:
          - text: >
              Yes: they have the right residue, so they are reachable.
            feedback: >
              The right residue only means this obstruction is absent. Some
              other invariant could still block them; reachability needs a
              sequence of presses.
          - text: >
              No; that needs presses. For instance $1 + 6 + 6 - 9 = 4$, and
              from any reachable $x$ the same three presses reach $x + 3$.
            correct: true
            feedback: >
              Right, and that construction finishes the job: starting from
              $1$, steps of $+3$ reach every $1 \bmod 3$ number above it.
              Impossibility came from the invariant; possibility came from
              the presses.
          - text: >
              No, and in fact only the numbers $1 + 6k$ are reachable.
            feedback: >
              $1 + 6 + 6 - 9 = 4$ is reachable and is not of the form
              $1 + 6k$. The $-9$ button matters.
        feedback: >
          Necessary from the invariant, sufficient from a construction —
          the same two halves as with any invariant.

      - part: A combination no single count shows
        ask: >
          Two boxes hold $a = 10$ and $b = 0$ tokens. A move either takes $2$
          tokens from box $a$ and puts $1$ into box $b$, or takes $2$ from
          box $b$ and puts $1$ into box $a$. Which quantity does every move
          change by a multiple of $3$?
        choices:
          - text: >
              $a + b$
            feedback: >
              Each move removes $2$ tokens and adds $1$, so $a + b$ falls by
              exactly $1$ — never by a multiple of $3$.
          - text: >
              $a$
            feedback: >
              $a$ changes by $-2$ or $+1$. Neither move size is a multiple of
              $3$, and no single box carries the invariant.
          - text: >
              $a - b$
            correct: true
            feedback: >
              The first move changes $a - b$ by $-2 - 1 = -3$, the second by
              $+1 + 2 = +3$. So $a - b$ is fixed mod $3$.
        feedback: >
          No single count is invariant, but a combination of them is: look
          for the linear combination of state variables the move fixes mod
          $m$.
      - ask: >
          At the start $a - b = 10 \equiv 1 \pmod 3$. The target is $a = 0$,
          $b = 7$, where $a - b = -7$. What is $-7$ mod $3$, written as a
          number from $0$ to $2$?
        expects: "2"
        feedback: >
          $-7 = -9 + 2$, so $-7 \equiv 2 \pmod 3$. The residues differ, so
          $(0, 7)$ is unreachable.
      - ask: >
          Why would parity not have caught this one?
        choices:
          - text: >
              Every move changes $a - b$ by an odd amount, and three moves are
              needed to get from $10$ total tokens to $7$, so $a - b$ flips
              parity three times and lands odd, just as $-7$ is.
            correct: true
            feedback: >
              Right. Parity of $a - b$ is consistent with the target; only
              mod $3$ separates them.
          - text: >
              Parity would have caught it; mod $3$ was just faster.
            feedback: >
              Track it: $a - b$ starts at $10$, even, and each move changes it
              by $\pm 3$, odd. Three moves make it odd, and $-7$ is odd.
              Parity agrees with the target.
          - text: >
              Parity never applies to a difference of two counts.
            feedback: >
              It applies to any integer quantity. Here it simply gives a
              matching answer, which is no obstruction.
        feedback: >
          The modulus comes from the move sizes: $\pm 3$ points at $m = 3$.
      - ask: >
          Back to the display. A third button, $+4$, is added. What does the
          mod $3$ argument say about $50$ now?
        choices:
          - text: >
              Still unreachable: the old invariant is still there.
            feedback: >
              $+4$ changes the residue mod $3$ by $1$. An invariant has to
              survive every move, and this one no longer does. Indeed
              $1 + 4 + 6 \cdot 9 - 9 = 50$.
          - text: >
              Nothing: $\gcd(6, 9, 4) = 1$, so no modulus is fixed by every
              move.
            correct: true
            feedback: >
              Right — and $50$ is now reachable, for instance
              $1 + 4 + 6 \cdot 9 - 9 = 50$. Adding a move can only destroy
              invariants.
          - text: >
              Switch to mod $4$, since the new button is $4$.
            feedback: >
              $+6$ and $-9$ are not multiples of $4$, so the residue mod $4$
              moves too. The modulus must divide every move size at once.
        feedback: >
          In an interview, say the move sizes, their gcd, and the two residues:
          "every press is a multiple of $3$, the start is $1$ mod $3$, $50$ is
          $2$ mod $3$, so never."

  - node: quant-puzzles.strategies.coloring
    hook: >
      Any tiling, covering, or piece-count question about a grid is asking you to paint the cells so that every legal piece covers a fixed color mix, then simply count colors on both sides.

    explanation: >
      Coloring is parity's cousin for two-dimensional pieces: instead of tracking one number mod $2$, assign each cell a color so that every allowed piece, in every orientation, covers a fixed, predictable pattern of colors. If the target region's actual color counts don't match what the pieces are structurally forced to produce, no tiling exists — the argument needs no attempted construction at all.

      Two colors, checkerboard-style, handle the simplest pieces, where the covering pattern per piece is just "one of each" or a fixed split. When two colors give no information — every piece covers the same split of both colors regardless of placement — a finer coloring is needed: stripes, four colors, or coloring by a coordinate sum modulo something larger than $2$, chosen so that the pieces finally show an asymmetry the plain checkerboard couldn't see.

      The proof pattern is always: compute what the total color count of the target region actually is, compute what any tiling by the given pieces would necessarily produce, and compare. A mismatch is decisive; a match is only necessary, not sufficient, so a genuine construction is still owed before claiming a tiling exists.

    worked: >
      Can a $6\times6$ board be tiled entirely by T-tetrominoes (four squares in a T shape)? The board has $36$ squares, so exactly $9$ pieces are needed. Color the board in the usual checkerboard pattern: $18$ black squares, $18$ white. Every T-tetromino, in any of its four rotations, covers either $3$ black and $1$ white, or $1$ black and $3$ white — never $2$ and $2$ — so each piece contributes either $+2$ or $-2$ to the running total (black count minus white count). For $9$ pieces to sum to the required $18-18=0$, exactly half must contribute $+2$ and half $-2$ — impossible, since $9$ is odd and can't be split into two equal groups. No tiling by T-tetrominoes exists.

    interview: >
      "Can these pieces tile this board" wants a coloring named explicitly — which colors, what pattern — followed by the count on both sides; "why can't you just try harder" is the cue that the interviewer wants the impossibility argument, not a failed construction attempt.

    pitfalls: >
      Assuming a checkerboard coloring will always distinguish a bad tiling from a good one; some pieces cover an equal color split in every orientation, and the checkerboard gives zero information — a different coloring is needed. Confirming the color counts match and concluding a tiling therefore exists — a match rules nothing out, and only an explicit construction proves possibility.

    recap: >
      Color the board so every piece covers a fixed color pattern, then count: a target whose color totals don't match what the pieces can produce admits no tiling at all.
    dialogue:
      - part: A floor with a pillar in it
        teach: >
          A $5 \times 5$ floor is laid out in unit squares, and a pillar
          stands on the square in row $1$, column $2$. The interviewer asks
          whether the other $24$ squares can be covered exactly by $12$
          dominoes, each domino covering two squares that share an edge.
      - ask: >
          The area matches: $24 = 12 \times 2$. What does that settle?
        choices:
          - text: >
              That a tiling exists, since nothing is left over.
            feedback: >
              Area is necessary, not sufficient. A $1 \times 4$ strip and two
              separate squares also have area $6$, and three dominoes cannot
              cover the separate squares.
          - text: >
              Only that the area does not rule a tiling out.
            correct: true
            feedback: >
              Right. Area is the first filter, and it passes. Whether the
              shape cooperates is a separate question.
          - text: >
              That no tiling exists, since $5 \times 5$ is odd.
            feedback: >
              The full board is odd, but the pillar removes one square and
              leaves $24$, which is even. The parity of the area is fine.
        feedback: >
          The area check passes, so the answer has to come from somewhere else.
      - ask: >
          Try a tiling. The four rows below the pillar's row form a
          $4 \times 5$ block. How many dominoes tile that block?
        expects: "10"
        feedback: >
          $20 / 2 = 10$, for instance as vertical pairs in each column. That
          leaves the four squares of row $1$ in columns $1$, $3$, $4$, $5$ for
          the last two dominoes.
      - ask: >
          Can those four squares in row $1$ be covered by the last two
          dominoes?
        choices:
          - text: >
              Yes: two horizontal dominoes.
            feedback: >
              The square in column $1$ has the pillar on one side and the
              wall on the other. Its only free neighbour was in row $2$, and
              that square is already covered.
          - text: >
              No: the column-$1$ square is cut off by the pillar, and the
              other three form a strip of odd length.
            correct: true
            feedback: >
              This attempt dies. But it is one attempt; a domino crossing
              between rows $1$ and $2$ would change everything below it.
        feedback: >
          One failed attempt proves nothing about the others, and there are
          far too many to try one by one.
      - reflect: >
          Every domino, wherever it lies, covers two squares that share an
          edge. What could you mark on the floor so that every domino affects
          the marking in exactly the same way — and what does counting the
          marks then tell you about this floor?
        hint: >
          Paint the floor like a chessboard, the corner $(1, 1)$ dark.
        answer: >
          Paint it like a chessboard. Two squares sharing an edge always have
          different colours, so every domino covers one dark and one light
          square, and $12$ dominoes cover exactly $12$ of each. The full floor
          has $13$ dark squares (all four corners are dark) and $12$ light.
          The pillar at $(1, 2)$ is on a light square, which leaves $13$ dark
          and $11$ light — the counts cannot be met, so no tiling exists.

      - part: Colouring as an invariant
        teach: >
          That is a colouring argument. Colour the board so that every piece,
          wherever it is placed, covers a fixed mix of colours; then any region
          a set of pieces covers has colour counts that are a sum of those
          mixes. A region whose counts cannot be written that way cannot be
          tiled. It is parity made geometric: the chessboard colour is the
          parity of $x + y$.
      - ask: >
          Move the pillar. On how many of the $25$ squares could the pillar
          stand without the chessboard count ruling a tiling out?
        expects: "13"
        hint: >
          The remaining $24$ squares must split $12$ and $12$.
        feedback: >
          Removing a dark square leaves $12$ dark and $12$ light; removing a
          light one leaves $13$ and $11$. So the $13$ dark squares pass, the
          $12$ light ones fail.
      - ask: >
          The pillar stands on the centre square $(3, 3)$, which is dark, and
          the counts balance at $12$ and $12$. What follows?
        choices:
          - text: >
              A tiling exists, because the colour counts match.
            feedback: >
              Matching counts remove this obstruction, nothing more. A tiling
              still has to be shown — and here one can be: the outer ring of
              $16$ squares takes $8$ dominoes end to end, the inner ring of
              $8$ around the pillar takes $4$.
          - text: >
              The colouring is silent; a tiling must be exhibited, and the two
              rings around the pillar give one.
            correct: true
            feedback: >
              Right. The outer ring of $16$ squares and the inner ring of $8$
              are closed loops of even length, so each is covered by dominoes
              laid end to end.
          - text: >
              Nothing can be said, since the colouring has failed.
            feedback: >
              The colouring did not fail; it simply does not forbid this case.
              The question is still open until a tiling is drawn, and one is
              easy to draw.
        feedback: >
          A colouring proves impossibility only. Possibility needs a picture.

      - part: When two colours see nothing
        ask: >
          New pieces: straight trominoes, each covering three squares in a
          row or column. A $4 \times 4$ board has one square removed, and the
          other $15$ are to be covered by $5$ trominoes. On a chessboard, a
          tromino covers two of one colour and one of the other. Does the
          chessboard count rule out any removed square?
        choices:
          - text: >
              Yes: the removed square must be dark.
            feedback: >
              Each tromino changes (dark minus light) by $+1$ or $-1$, and $5$
              of them sum to an odd number. Removing any square leaves a
              difference of $\pm 1$, which is odd too. Both colours pass.
          - text: >
              No: five pieces of $\pm 1$ can make $+1$ or $-1$, so either
              colour of removed square passes.
            correct: true
            feedback: >
              Right. The chessboard is too coarse for this piece; a piece of
              length $3$ wants a colouring with period $3$.
          - text: >
              Yes: the area $15$ is odd, so no tiling exists.
            feedback: >
              $15 = 5 \times 3$. An odd area is fine for pieces of size $3$.
        feedback: >
          Two colours fail here, so change the colouring to match the piece.
      - ask: >
          Colour square (column $x$, row $y$) by $(x + y) \bmod 3$. A straight
          tromino now covers one square of each colour. The $4 \times 4$ board
          has $5$ squares of colour $0$, $5$ of colour $1$ and $6$ of colour
          $2$. Which colour must the removed square have?
        expects: "2"
        feedback: >
          $5$ trominoes cover $5$ squares of each colour, so the remaining
          $15$ must split $5, 5, 5$. Only removing a colour-$2$ square does
          that.
      - ask: >
          Colouring by $(x - y) \bmod 3$ does the same job, and there colour
          $0$ is the class of $6$. A removed square must pass both tests:
          $x + y \equiv 2$ and $x - y \equiv 0 \pmod 3$. How many of the $16$
          squares pass both?
        expects: "4"
        hint: >
          Adding the two conditions gives $2x \equiv 2 \pmod 3$.
        feedback: >
          $2x \equiv 2$ forces $x \equiv 1$, and then $y \equiv 1 \pmod 3$, so
          $x, y \in \{1, 4\}$: the four corners. Each one works — remove
          $(1, 1)$, lay one tromino along the rest of row $1$, one up the rest
          of column $1$, and three across the $3 \times 3$ block left over.
          Out loud: "colour so each piece covers a fixed mix, count, compare."

  - node: quant-puzzles.strategies.monovariant
    hook: >
      "Show this process terminates" or "show it stabilizes" is answered by naming one nonnegative integer that the process can only ever push in a single direction.

    explanation: >
      A monovariant moves strictly one way, unlike an invariant, which doesn't move at all. If you can name a nonnegative integer quantity that strictly decreases at every legal move, the process must stop — a strictly decreasing sequence of nonnegative integers cannot run forever, since it would eventually have to go below $0$. No cleverness about the specific process is required beyond finding that one quantity; well-ordering of the integers does the rest.

      The same argument runs in reverse for a quantity that strictly increases but is bounded above: it must also stop, once it hits the ceiling. Either direction gives you something stronger than "it terminates" for free — the starting value of the monovariant (or the gap to its bound) is an explicit upper bound on the number of moves, since each move consumes at least one unit of it.

      The habit to build is the same as with any invariant: write the move generically, evaluate the candidate quantity before and after, and check that the change always has the same sign, not merely on the specific instance in front of you.

    worked: >
      A rectangular chocolate bar with $6$ rows and $8$ columns, $48$ unit squares total, is broken along the grid lines one straight break at a time; each break takes one existing piece and splits it into exactly two smaller pieces, and pieces are never stacked before breaking. How many breaks does it take to reduce the whole bar to $48$ separate unit squares? The piece count is a monovariant: it starts at $1$ and strictly increases by exactly $1$ at every break, regardless of which piece is chosen or where it's split. Reaching $48$ pieces from $1$ therefore takes exactly $48-1=47$ breaks — not "at most," but exactly, no matter what order the breaks happen in.

    interview: >
      "How many moves does this process take, at most" or "show this loop ends" wants a monovariant named explicitly — the quantity, the direction it moves, and the bound — rather than an appeal to intuition that it "obviously" stops.

    pitfalls: >
      Confusing a quantity that usually decreases with one that always does — a single exception breaks the entire termination argument, since well-ordering needs strict, unconditional movement every move. Reporting only "it terminates" when the same monovariant, tracked exactly rather than as an inequality, often hands you the precise number of moves for free, as with the chocolate bar.

    recap: >
      A nonnegative integer that strictly moves one way at every step forces termination, and its starting value bounds — sometimes pins down exactly — how many moves the process takes.
    dialogue:
      - part: A desk that keeps reshuffling
        teach: >
          Twelve traders work in two rooms. Each trader is feuding with
          exactly three of the others, and feuds are mutual. The manager's
          rule: while some trader has two or more of his feuds in his own
          room, move that trader to the other room. The interviewer asks
          whether the reshuffling must ever stop.
      - ask: >
          How many feuding pairs are there among the twelve traders?
        expects: "18"
        hint: >
          Add up everyone's feuds, then notice each feud was counted twice.
        feedback: >
          $12 \cdot 3 = 36$ feud-ends, and each feud has two ends, so there
          are $36 / 2 = 18$ feuding pairs.
      - ask: >
          Trader A has two feuds in his room and moves. In the other room he
          joins B, one of his feuds, and now B has two feuds in her room, so
          she must move next. What does this show?
        choices:
          - text: >
              Each move fixes one trader, so at most $12$ moves are needed.
            feedback: >
              A's move fixed A and broke B. Fixing one trader can unsettle
              others, so "one trader per move" is not a bound on anything.
          - text: >
              The process must cycle, since every move creates a new problem.
            feedback: >
              One move creating one new problem is not a cycle. Whether the
              process stops is exactly what is still undecided.
          - text: >
              The number of traders breaking the rule can go up, so it cannot
              be the quantity that proves the process stops.
            correct: true
            feedback: >
              Right. The obvious measure of progress is not monotone. Some
              other count has to move only one way.
        feedback: >
          To prove that a process stops, find something that every single
          move pushes in the same direction.
      - reflect: >
          Look at A's move through the feuding pairs rather than the traders.
          Which count does every move the manager makes strictly reduce, and
          why does that force the reshuffling to stop?
        hint: >
          A has at most one feud in the other room, since he has three in all
          and two or more in his own.
        answer: >
          Count the feuding pairs sitting in the same room. A leaves at least
          two such pairs behind and creates at most one in his new room, so
          the count falls by at least $1$ on every move. It is a nonnegative
          integer, it starts at most at $18$, and a nonnegative integer cannot
          fall forever — so the process stops after at most $18$ moves.

      - part: A quantity that only goes down
        teach: >
          That count is a monovariant: a quantity that moves only one way. If
          a nonnegative integer strictly decreases at every legal move, the
          process must stop, and it stops within as many moves as the
          quantity's starting value. Well-ordering does the work — there is
          no infinite strictly decreasing chain of nonnegative integers.
      - ask: >
          Suppose A had all three of his feuds in his own room. When he moves,
          by how much does the number of same-room feuding pairs fall?
        expects: "3"
        feedback: >
          He leaves three same-room pairs behind and arrives in a room with
          none of his feuds: $3 - 0 = 3$.
      - ask: >
          The traders start six to a room, with exactly $5$ feuding pairs
          sharing a room. At most how many moves can the manager make from
          here?
        expects: "5"
        hint: >
          What is the monovariant's starting value, and how little can it
          fall per move?
        feedback: >
          The same-room count starts at $5$, falls by at least $1$ per move
          and cannot go below $0$, so at most $5$ moves. Usually fewer: a
          trader with three feuds in his room removes three pairs at once.
      - ask: >
          When the moves stop, what has the monovariant proved besides
          termination?
        choices:
          - text: >
              Nothing more; it only shows the process ends.
            feedback: >
              Read the stopping rule: it stops only when no trader has two or
              more feuds in his room. Termination therefore delivers a split
              with that property.
          - text: >
              That a split exists in which every trader has at most one feud
              in his own room.
            correct: true
            feedback: >
              Right. The process can only stop in a good state, and it must
              stop, so a good state exists — an existence proof by algorithm.
          - text: >
              That the final split has exactly $18$ moves behind it.
            feedback: >
              $18$ is an upper bound. Most starting splits stop much sooner,
              because a move can remove two or three same-room pairs at once.
        feedback: >
          A monovariant attached to a "fix one thing" loop is a standard way
          to prove a configuration exists.

      - part: When the count can stand still
        ask: >
          Change the desk: each trader may now feud with four others, and the
          rule is still "move anyone with two or more feuds in his room". What
          happens to the argument?
        choices:
          - text: >
              It still works: the same-room count falls by at least $1$.
            feedback: >
              A trader with two feuds in each room moves, leaves two same-room
              pairs and creates two. The count stays put, and two such traders
              can swap rooms back and forth forever.
          - text: >
              It fails, because a move can leave the count unchanged; it works
              again if the rule is "move anyone with three or more".
            correct: true
            feedback: >
              Right. With three or more feuds in his room and at most one in
              the other, a mover lowers the count by at least $2$. Strict
              decrease on every move is the whole argument.
          - text: >
              It fails because twelve traders with four feuds each is
              impossible.
            feedback: >
              $12 \cdot 4 / 2 = 24$ pairs is perfectly possible. The failure
              is in the move, not the count.
        feedback: >
          "Usually decreases" is worth nothing; one move that can leave the
          quantity flat breaks termination.
      - ask: >
          A different process. Two numbers start as $(30, 8)$; a move replaces
          the larger by the larger minus the smaller, until the two are equal.
          The sum strictly falls every move, so it stops. How many moves does
          it actually make?
        expects: "6"
        feedback: >
          $(30, 8) \to (22, 8) \to (14, 8) \to (6, 8) \to (6, 2) \to (4, 2)
          \to (2, 2)$: $6$ moves, ending at $\gcd(30, 8) = 2$. The sum
          bound alone allows $36$ — it starts at $38$, falls by at least $1$
          a move and never drops below $2$. A monovariant guarantees a stop
          and caps the count; tracking the process exactly gives the number.

  - node: quant-puzzles.strategies.symmetry-strategy
    hook: >
      In a two-player game that starts symmetric, the tell is a move set that's also symmetric — the winning idea is almost never to build a clever position, only to keep restoring the symmetry your opponent just broke.

    explanation: >
      The logic is an invariant argument turned into a strategy: if you can always respond to your opponent's move with its mirror image, the position is symmetric again immediately after your turn, and a symmetric position with a symmetric move set guarantees that whatever move was legal for your opponent, its mirror image is legal for you too, and it was still unused since they hadn't taken it. That guarantee is what never breaks — you are never the player who runs out of moves, because a legal reply always exists by construction.

      Which player this favors depends entirely on whether the starting position is symmetric already. If it is not, the first player can often manufacture symmetry with one opening move — placing something exactly at the center of a symmetric board, for instance — and then mirror everything the opponent does from then on. If the position starts symmetric, mirroring instead becomes available to the second player from move one, since they get to respond to (and mirror) the first player's opening move directly.

    worked: >
      Two piles of matches start with $7$ matches each. On each turn a player removes any positive number of matches, but only from one pile. The player who takes the last match wins. Since the piles start equal — already symmetric — the second player mirrors: whenever the first player removes $k$ matches from one pile, the second player removes the same $k$ matches from the other pile, restoring equality after every one of their turns. The piles are equal after each of the second player's moves and strictly smaller each round, so they hit $0,0$ together right after a move by the second player — meaning the first player is the one who faces two empty piles and cannot move. The second player wins for any starting size, not only $7$.

    interview: >
      "Two players alternate on a symmetric setup — who wins?" wants the symmetry check stated first — is the start already symmetric, or does it need one move to create it — before any talk of specific optimal moves.

    pitfalls: >
      Trying to mirror on a starting position that is not symmetric without first spending a move to create the symmetry — an unmirrored opening move by the wrong player breaks the whole argument. Assuming mirroring always favors the second player; on an asymmetric board the first player can seize the mirroring role by moving to the center first.

    recap: >
      Restore the symmetry after every opponent move and a legal reply is always guaranteed to exist; whether that favors you or your opponent depends only on who can make the position symmetric first.
    dialogue:
      - part: Fifteen coins in a ring
        teach: >
          Fifteen coins lie in a ring on a desk. Two players alternate; a move
          takes either one coin or two coins that touch each other in the
          ring. Taking a coin leaves a gap, so coins on either side of a gap
          no longer touch. Whoever takes the last coin wins, and the
          interviewer lets you choose to move first or second.
      - ask: >
          Shrink it first. With $4$ coins in the ring, who wins with best
          play?
        choices:
          - text: >
              The first player: take two, leaving two.
            feedback: >
              Taking two touching coins leaves the other two touching, and the
              second player takes both and wins.
          - text: >
              The second player.
            correct: true
            feedback: >
              If the first player takes one, a line of $3$ is left; the second
              takes the middle coin, leaving two lone coins, and takes the
              last one. If the first takes two, the second takes the other
              two. Either way the second player wins.
          - text: >
              Whoever takes a single coin first.
            feedback: >
              Try it: the first player takes one, the second takes the middle
              of the line of $3$, and the first player is left facing two lone
              coins — the second player gets the last.
        feedback: >
          In both lines of play, the second player's reply left two equal,
          separated pieces.
      - ask: >
          With $15$ coins, how many different first moves does the first
          player have?
        expects: "30"
        feedback: >
          $15$ single coins plus $15$ touching pairs in a ring: $30$ first
          moves, each with dozens of replies. The game tree is far too big to
          search in an interview.
      - reflect: >
          After any first move, the ring has become a single line of $13$ or
          $14$ coins. In the $4$-coin game, the second player's reply left two
          equal pieces. What reply to the line leaves you a position where you
          can answer every later move without thinking — and why would you
          then never be the one left without a move?
        hint: >
          Remove coins from the exact middle of the line.
        answer: >
          Take the middle coin of $13$, or the middle two of $14$; either
          leaves two separate lines of $6$. From then on, whatever your
          opponent takes from one line, take the same coins from the
          corresponding place in the other. The two lines are equal after
          each of your moves, so any move available to the opponent has an
          unused copy available to you — you can never be the one who runs
          out, so you take the last coin. Choose to go second.

      - part: Mirroring as a strategy
        teach: >
          That is a mirroring strategy. In a game with a symmetric move set,
          after every opponent move you play its mirror image, restoring the
          symmetry. The restored symmetry is your invariant: if the opponent
          had a legal move, its mirror was legal and unused, so you are never
          the player who runs out. Whoever can create the symmetry first —
          the second player here, after the first player breaks the ring —
          owns the mirror.
      - ask: >
          Same game with $16$ coins in the ring. The first player takes a
          single coin. After your reply, how many coins are in each of your
          two lines?
        expects: "7"
        feedback: >
          The ring becomes a line of $15$, an odd number, so you take its
          middle coin, the $8$th, leaving two lines of $7$. Had the first
          player taken two, the line of $14$ would lose its middle two and
          leave two lines of $6$. Any ring of $3$ or more coins goes to the
          second player.
      - ask: >
          One worry: could the opponent ever make a move whose mirror you
          cannot copy, such as taking coins from both lines at once?
        choices:
          - text: >
              Yes, by taking the last coin of one line and the first of the
              other.
            feedback: >
              Those two coins do not touch — the coins you took sit between
              them. A move takes one coin or two touching coins, so it never
              spans the gap.
          - text: >
              No: the gap separates the lines, so every move lies inside one
              line, and its mirror lies inside the other.
            correct: true
            feedback: >
              Right. That is the one thing to check in any mirror argument:
              that a move and its mirror cannot interfere with each other.
          - text: >
              It does not matter, since you can always take a different move.
            feedback: >
              It matters a great deal: the whole argument is that the mirror
              move is available. A strategy that needs improvising has no
              guarantee behind it.
        feedback: >
          A mirror strategy is safe exactly when a move can never interfere
          with its own mirror image.

      - part: When the mirror touches the move
        ask: >
          New game on an $8 \times 8$ board: players alternately place kings
          so that no two kings are on adjacent squares, diagonals included,
          and the last to place one wins. The second player plans to mirror
          each king through the centre of the board. How many of the $64$
          squares are adjacent to their own mirror image?
        expects: "4"
        hint: >
          Square $(x, y)$ mirrors to $(9 - x, 9 - y)$. When are those two
          within one step in both coordinates?
        feedback: >
          You need $|9 - 2x| \le 1$ and $|9 - 2y| \le 1$, so $x, y \in \{4, 5\}$:
          the four central squares. A king on $(4, 4)$ has its mirror at
          $(5, 5)$, diagonally next to it.
      - ask: >
          What does that do to the second player's plan?
        choices:
          - text: >
              Nothing; four squares out of $64$ hardly matter.
            feedback: >
              The first player chooses where to play. One king on a central
              square makes its mirror illegal on the very first reply, and the
              guarantee is gone.
          - text: >
              It breaks it: the first player opens on a central square and
              the mirror reply is illegal.
            correct: true
            feedback: >
              Right. The move and its mirror interfere, exactly the thing the
              ring game had to rule out. The second player needs a different
              strategy.
          - text: >
              It means the first player wins by mirroring instead.
            feedback: >
              To mirror, the first player would need an opening square that
              is its own mirror, and an even board has none. The failure kills
              the second player's plan without handing one to the first.
        feedback: >
          Check the interference case before trusting any mirror.
      - ask: >
          Same game on a $7 \times 7$ board, where $(x, y)$ mirrors to
          $(8 - x, 8 - y)$ and the centre $(4, 4)$ is its own mirror. Who has
          a winning strategy, and how?
        choices:
          - text: >
              The second player, mirroring through the centre.
            feedback: >
              The first player can take the centre, which has no mirror to
              copy. After that the second player is the one facing a symmetric
              position.
          - text: >
              The first player: place a king on the centre, then mirror every
              reply.
            correct: true
            feedback: >
              Right. After the centre is taken, a square adjacent to its own
              mirror would have to have $|8 - 2x| \le 1$ and $|8 - 2y| \le 1$,
              which only the centre does. So every mirror reply is legal, and
              the second player runs out first.
          - text: >
              Neither can be decided without searching the board.
            feedback: >
              The mirror decides it with no search: take the self-symmetric
              square first, then copy.
        feedback: >
          Out loud: "Make the position symmetric, then copy; check that a move
          can never block its own mirror." An odd board with a centre square
          hands that role to the first player.

  - node: quant-puzzles.strategies.extremal
    hook: >
      An existence or impossibility claim about a finite configuration with no obvious starting point is solved by naming the most extreme object in it — the biggest, closest, or first — and interrogating that one object specifically.

    explanation: >
      The move is to pick out whichever element of a finite configuration is largest, smallest, closest, or otherwise extreme by some natural measure, and argue about it directly, because an extreme object is constrained in a way a generic one is not: by definition, nothing beats it on that measure, and that single fact is often enough to force a contradiction or complete a construction.

      What makes this different from picking an arbitrary element is that the extremal choice comes with a built-in guarantee — for the largest element of a finite set, every other element is $\le$ it; for the closest pair, every other pair is farther apart. That guarantee is exactly the extra leverage a generic element wouldn't supply, and it's usually the entire content of the proof once you've correctly identified which "extreme" to look at.

    worked: >
      A round-robin tournament has $n$ players, every pair plays exactly one game, and every game has a winner (no ties). Show there is always a player who either beat every other player directly, or beat someone who beat them. Let $A$ be a player with the maximum number of wins in the tournament. Suppose some player $B$ beat $A$ directly and also beat every single player that $A$ beat. Then $B$'s win total is at least $A$'s win total plus one (everyone $A$ beat, plus $A$ itself), contradicting that $A$ has the maximum. So any player $B$ who beat $A$ must have lost to at least one player $C$ that $A$ also beat — and $A$ beats $C$, who beats $B$, giving $A$ a two-step path to $B$. Since $A$ reaches every player in at most two steps, such a player always exists — the extremal choice was "most wins."

    interview: >
      "Prove that a leader always exists" or "show there's a configuration achieving..." with no obvious place to start a construction is the tell; naming which extreme object to examine — and why that specific extreme, not just any element — is the answer the interviewer is listening for.

    pitfalls: >
      Picking an extreme quantity that doesn't actually interact with the constraint being proved — the leverage only appears when the "extreme" property is the one doing the work in the argument, not an arbitrary superlative. Stopping at "consider the largest element" without following through on what its extremality actually forces, which is where the real proof lives.

    recap: >
      Name the largest, smallest, or closest object in a finite configuration and argue about it specifically — its extremality supplies a guarantee no generic element has.
    dialogue:
      - part: Every point a midpoint
        teach: >
          An interviewer asks: is there a finite set of at least two points
          in the plane in which every point is the midpoint of some two other
          points of the set?
      - ask: >
          Start on a line. In the set $\{0, 1, 2, 3, 4\}$, how many points are
          the midpoint of two other points of the set?
        expects: "3"
        feedback: >
          $1$ is the midpoint of $0$ and $2$, $2$ of $0$ and $4$, $3$ of $2$
          and $4$. The two ends, $0$ and $4$, are midpoints of nothing.
      - ask: >
          Patch the ends: add $-4$ so that $0$ is the midpoint of $-4$ and
          $4$, and add $8$ so that $4$ is the midpoint of $0$ and $8$. What
          has that achieved?
        choices:
          - text: >
              It works now; every point is a midpoint.
            feedback: >
              $-4$ and $8$ are now the ends, and neither is the midpoint of
              two points of the set — every point of the set lies to the
              right of $-4$.
          - text: >
              It moved the problem: the new ends, $-4$ and $8$, fail instead.
            correct: true
            feedback: >
              Right. Every patch creates new ends. The failure is not about
              these points but about being at the end.
          - text: >
              It fails only because the set is on a line; in the plane there is
              room to fix the ends.
            feedback: >
              The plane gives more room, but whatever set you draw still has
              a leftmost point, and that point has the same problem.
        feedback: >
          Patching chases the failure outward. The question is why some point
          always fails.
      - reflect: >
          In any finite set of points in the plane, name one point that can
          never be a midpoint of two others, and say why.
        hint: >
          On the line it was always an end. What plays the role of an end in
          the plane?
        answer: >
          Take a leftmost point $P$ — smallest $x$-coordinate, and among those
          the lowest. If $P$ were the midpoint of $A$ and $B$, its
          $x$-coordinate would be the average of theirs, so one of them would
          be further left, or both would sit on $P$'s vertical line with one
          of them lower. Either way $P$ was not the leftmost-lowest point. So
          no finite set works.

      - part: Pick the extreme, let it argue
        teach: >
          That is the extremal principle. When a claim is about a finite
          configuration with no natural place to start, name the largest,
          smallest, leftmost, closest or first object, and argue about that
          one. An extreme object obeys constraints a generic one does not —
          nothing lies beyond it — and finiteness guarantees it exists.
      - ask: >
          Why break ties by taking the lowest among the leftmost points?
        choices:
          - text: >
              Because several points can share the smallest $x$, and a midpoint
              of two of them sits on that same vertical line.
            correct: true
            feedback: >
              Right. "Leftmost" alone is not unique and does not finish the
              argument; the lowest among them does. An extreme should be
              strict enough to do the arguing.
          - text: >
              It is not needed; "leftmost" already finishes the argument.
            feedback: >
              Take $(0, 0)$, $(0, 1)$, $(0, 2)$. The middle one is leftmost
              and is the midpoint of the other two. Leftmost needs a
              tie-break.
          - text: >
              To make the point easier to find in a drawing.
            feedback: >
              The tie-break is logical, not cosmetic: without it a leftmost
              point can be a midpoint, as $(0, 1)$ is of $(0, 0)$ and
              $(0, 2)$.
        feedback: >
          Choose the extreme so that the property you need follows from its
          extremality — here, nothing further left and nothing lower on its
          line.
      - ask: >
          Does the same answer hold in three dimensions?
        choices:
          - text: >
              No: in space a cube's points surround each other.
            feedback: >
              Pick the point with the smallest $x$, then smallest $y$, then
              smallest $z$. The same averaging argument shows it is nobody's
              midpoint.
          - text: >
              Yes: take the smallest $x$, then $y$, then $z$, and argue as
              before.
            correct: true
            feedback: >
              Right. The extreme is the lexicographically smallest point, and
              it exists in any finite set in any dimension.
          - text: >
              Only if the points are not all in one plane.
            feedback: >
              Coplanar or not, the lexicographically smallest point exists and
              fails to be a midpoint.
        feedback: >
          The argument never used the plane — only that a finite set has an
          extreme element.
      - ask: >
          Now take an infinite set: all the integers on a line. What happens?
        choices:
          - text: >
              The extremal argument still shows some integer is not a midpoint.
            feedback: >
              Every integer $n$ is the midpoint of $n - 1$ and $n + 1$. The
              argument needed a leftmost point, and the integers have none.
          - text: >
              Every integer is a midpoint, because there is no leftmost one.
            correct: true
            feedback: >
              Right. Finiteness is the hypothesis that guarantees the extreme
              exists; drop it and the conclusion goes with it.
          - text: >
              The question has no answer for infinite sets.
            feedback: >
              It has a clear one: $n$ is the midpoint of $n - 1$ and $n + 1$,
              so every integer qualifies.
        feedback: >
          Always say why the extreme exists. "Finite" is usually the reason.

      - part: Choosing the right extreme
        ask: >
          A $4 \times 4$ grid holds the numbers $1$ to $16$, each once. A cell
          is a local minimum if it is smaller than every cell sharing an edge
          with it. To prove every filling has a local minimum, which cell do
          you point to?
        choices:
          - text: >
              The top-left corner, since it has the fewest neighbours.
            feedback: >
              A corner holding $16$ is larger than both its neighbours. Being
              at the edge of the board is not the extreme that matters.
          - text: >
              The cell holding $1$.
            correct: true
            feedback: >
              It is smaller than every other cell, so smaller than its
              neighbours. The extreme has to be extreme in the quantity the
              claim is about.
          - text: >
              The cell holding $16$.
            feedback: >
              That is an extreme, but of the wrong kind: $16$ is a local
              maximum, larger than all its neighbours.
        feedback: >
          The extreme must be the one whose extremality forces the property.
      - ask: >
          So every filling has at least one local minimum. What is the fewest
          number of local minima a filling can have?
        expects: "1"
        hint: >
          Try writing $1$ to $16$ as a snake: left to right along the first
          row, right to left along the second, and so on.
        feedback: >
          In the snake, every number $k > 1$ sits next to $k - 1$, so only the
          cell holding $1$ is a local minimum. The extremal argument gives the
          lower bound and the snake shows it is reached. Out loud: "Take the
          smallest — it has nowhere smaller to point."

  - node: quant-puzzles.strategies.averaging
    hook: >
      "Show that one of these must be at least..." with no way to identify which one is answered by computing the average — a sum divided by a count proves existence without ever pointing at the winner.

    explanation: >
      If $n$ quantities sum to $S$, at least one of them is $\ge S/n$ and at least one is $\le S/n$ — otherwise every single one would be strictly on one side of $S/n$, and summing $n$ numbers all strictly above (or all strictly below) their own average could never actually equal $S$. This is pure arithmetic, but it proves existence with zero construction: you never learn *which* quantity clears the bound, only that one must.

      The probabilistic form is the identical statement wearing different notation: build a random object, compute its expectation $\mathbb{E}[X]$ by linearity over whatever pieces $X$ decomposes into, and conclude that some realization of the object achieves $X\ge \mathbb{E}[X]$ and some achieves $X\le \mathbb{E}[X]$ — because the expectation is itself an average over the possible outcomes, exactly as $S/n$ is an average over $n$ terms.

      The bound is tight only when every term is equal; any actual spread in the underlying data means the extreme term clears the average strictly, not merely matches it — worth checking, since interviewers often follow up by asking how much slack the bound leaves.

    worked: >
      Twelve market-making desks report a combined monthly PnL of $180$ (in some fixed unit). By the averaging argument, some desk cleared at least $180/12=15$, and some desk cleared at most $15$ — true regardless of how the $180$ is actually split among the twelve. The bound is achieved with equality only if every desk cleared exactly $15$; if the desks' results differ at all, the best desk strictly beat $15$ and the worst strictly missed it. No further information about the split is needed to state the guarantee — only the total and the count.

    interview: >
      "Show that at least one of these $n$ things is at least..." wants the sum-over-count computation stated immediately, with an explicit acknowledgment that the argument names no specific winner — just existence.

    pitfalls: >
      Treating the averaging bound as an equality claim, or assuming the bound is achieved, when any unequal spread in the underlying data means it's cleared strictly. Trying to identify which specific element achieves the bound — the argument structurally cannot tell you that; it only guarantees that one does.

    recap: >
      A sum divided by a count bounds some element from above and some from below, with zero construction needed — the same statement in expectation form once a random object is on the table.
    dialogue:
      - part: Ten numbers round a circle
        teach: >
          The numbers $1$ to $10$ are written around a circle, in an order the
          interviewer chooses to make your life hard. You must show that,
          whatever the order, some three neighbouring numbers in a row add up
          to at least $17$.
      - ask: >
          Suppose the interviewer is lazy and writes $1, 2, \dots, 10$ in
          order. What is the largest sum of three neighbours?
        expects: "27"
        feedback: >
          $8 + 9 + 10 = 27$. A lazy order bunches the big numbers together. A
          hostile order spreads them out, and that is the case you must cover.
      - ask: >
          The extremal reflex: look at the $10$ and its two neighbours. How
          small can that triple's sum be?
        expects: "13"
        feedback: >
          Put $1$ and $2$ beside the $10$: $10 + 1 + 2 = 13$. One extreme
          triple can be kept well under $17$, so looking at a single triple
          is not enough.
      - ask: >
          What is wrong with "find the worst order and check it"?
        choices:
          - text: >
              Nothing, as long as you put big and small numbers alternately;
              that order is clearly the worst.
            feedback: >
              "Clearly the worst" is a guess, not a proof. There are $181440$
              circular orders, and you would have to know which one is worst
              before checking it.
          - text: >
              You cannot identify the worst order without, in effect, checking
              all of them.
            correct: true
            feedback: >
              Right. You need a statement true of every order at once, without
              naming the triple that does the work.
          - text: >
              The worst order might have every triple below $17$.
            feedback: >
              That is the claim to be disproved, not a flaw in the method. The
              method's flaw is that it requires knowing the worst order.
        feedback: >
          A proof has to cover all orders at once and need not point to the
          triple.
      - reflect: >
          Instead of one triple, take all ten triples of neighbours together.
          What do their ten sums add up to, whatever the order, and what does
          that force?
        hint: >
          How many of the ten triples contain any particular number?
        answer: >
          Each number lies in exactly three triples, so the ten sums total
          $3 \cdot (1 + 2 + \dots + 10) = 3 \cdot 55 = 165$, in every order.
          Ten numbers averaging $16.5$ cannot all be below $16.5$, so some
          triple sums to at least $16.5$ — and since sums are whole numbers,
          to at least $17$. The argument never says which triple.

      - part: The average guarantees an extreme
        teach: >
          That is an averaging argument. If $n$ quantities sum to $S$, at
          least one is $\ge S/n$ and at least one is $\le S/n$ — an existence
          proof with no construction. It rests on the extremal principle: the
          largest of the quantities is at least their average. With whole
          numbers, round up.
      - ask: >
          Same circle, now blocks of four neighbours. Some block of four must
          add up to at least what?
        expects: "22"
        hint: >
          Each number lies in four of the ten blocks.
        feedback: >
          The ten blocks total $4 \cdot 55 = 220$, an average of $22$, so some
          block reaches at least $22$.
      - ask: >
          Back to triples: averaging guarantees $17$. Does that mean some order
          has every triple at most $17$?
        choices:
          - text: >
              Yes: an averaging bound is always achieved by some arrangement.
            feedback: >
              The bound is reached only when the values can all equal the
              average. Here they cannot — the average is $16.5$, and triples
              of whole numbers summing to $165$ must vary.
          - text: >
              No: the averaging bound is a guarantee, and says nothing about
              whether a better one is true.
            correct: true
            feedback: >
              Right. In fact checking every order shows a triple of at least
              $18$ is forced; $1, 4, 9, 5, 3, 7, 8, 2, 6, 10$ keeps every
              triple at $18$ or less. Averaging got within one, cheaply.
          - text: >
              No: some triple must be $27$ or more.
            feedback: >
              Only in the lazy order. The order $1, 4, 9, 5, 3, 7, 8, 2, 6, 10$
              has no triple above $18$.
        feedback: >
          An averaging bound is a floor that holds everywhere. Whether it is
          the best floor is a separate question.

      - part: Averaging over a random choice
        ask: >
          Ten traders, and $15$ of the pairs among them have a conflict. You
          want to split them into two desks so that at least $8$ conflicted
          pairs sit on different desks. Send each trader to a desk by a fair
          coin flip. What is the probability that a given conflicted pair
          ends up split?
        expects: "1/2"
        hint: >
          The second trader's coin either matches the first one's or it
          does not.
        feedback: >
          The pair is split when the two coins differ, which happens with
          probability $1/2$.
      - ask: >
          What is the expected number of conflicted pairs split by the random
          assignment?
        expects: "7.5"
        hint: >
          Write the count as a sum of $15$ indicators.
        feedback: >
          By linearity of expectation, $15 \cdot 1/2 = 7.5$. No independence
          between pairs is needed.
      - ask: >
          What does $\mathbb{E}[X] = 7.5$ let you conclude about splits?
        choices:
          - text: >
              Every split separates $7.5$ pairs on average, so $8$ is not
              guaranteed.
            feedback: >
              An average over random splits is a statement about all splits
              together. If every split separated $7$ or fewer, the average
              would be at most $7$.
          - text: >
              Some split separates at least $8$ pairs.
            correct: true
            feedback: >
              Right. Some outcome is at least the expectation, so some split
              separates $\ge 7.5$ pairs, hence $\ge 8$. The coins were only a
              device for averaging over all $2^{10}$ splits.
          - text: >
              A random split separates at least $8$ pairs with probability at
              least $1/2$.
            feedback: >
              The expectation does not give that. It guarantees one good
              split exists, not how common good splits are.
        feedback: >
          Out loud: "Average over all the choices; something is at least the
          average." The probabilistic version is the same sentence with
          linearity of expectation doing the counting.

  - node: quant-puzzles.strategies.working-backwards
    hook: >
      When the goal is tightly pinned down and the start is wide open, don't search forward from a huge starting space — assume the ending and ask what state had to precede it, one step at a time.

    explanation: >
      Invert the problem whenever the target is much more constrained than the start, or whenever a single step is easier to undo than to perform going forward. Concretely: assume you are already at the goal, ask what the immediately preceding state must have been for that final move to make sense, and repeat, walking backward one step at a time until you reach a state you already understand — often the actual start, which then certifies the whole chain forward.

      This works because the backward branching factor — how many states could have led to a given one — is often far smaller than the forward branching factor, sometimes exactly one. Searching forward from a huge or unconstrained start can explode; searching backward from a single, tightly specified goal usually collapses to a short, deterministic chain.

      In games, the identical move relabels terminal positions as wins or losses and propagates those labels one move at a time back toward the start — this is the same inversion, applied to labels instead of numeric states. And when both the start and the goal are constrained, meeting in the middle — searching forward from the start and backward from the goal simultaneously, then checking where the two searches meet — beats running either search the full distance alone.

    worked: >
      A trader crosses three toll checkpoints; at each one he pays half of whatever cash he's carrying, plus one additional unit, and after the third checkpoint he has exactly $0$ left. How much did he start with? Work backward from the end. Let $x$ be the amount entering a checkpoint; after paying $x/2+1$, he's left with $x/2-1$. At checkpoint $3$, the amount leaving is $0$, so $x_3/2-1=0$ gives $x_3=2$ — that's also the amount he had entering checkpoint $3$, which equals what he had leaving checkpoint $2$. So $x_2/2-1=2$ gives $x_2=6$, the amount leaving checkpoint $1$. Then $x_1/2-1=6$ gives $x_1=14$. Working forward to check: $14\to 14/2-1=6\to 6/2-1=2\to 2/2-1=0$ — confirmed. He started with $14$.

    interview: >
      "Work out how much he started with" or "what was the state one step before the end" phrasings, and any "show this process must end in a win/loss" game question, are asking for the backward chain explicitly, one undone step at a time, not a forward guess-and-check.

    pitfalls: >
      Guessing a starting value and simulating forward to check it, instead of deriving it — guess-and-check can miss the answer entirely when the forward branching factor is large, exactly the case working backwards is meant to avoid. Undoing a step incorrectly by inverting the wrong operation — check that the backward formula, applied forward, actually reproduces the given rule before trusting the chain.

    recap: >
      Assume the goal and ask what state had to come immediately before it, repeating backward — the goal usually has far fewer predecessors than the start has successors.
    dialogue:
      - part: Stacking a deck from the wrong end
        teach: >
          A dealer holds five cards numbered $1$ to $5$ in a face-down stack.
          The deal: lay the top card face up on the table, then move the next
          card from the top to the bottom without showing it, and repeat
          until every card is on the table. The interviewer asks how to stack
          the five so that they come up $1, 2, 3, 4, 5$.
      - ask: >
          Try the obvious stack, $1, 2, 3, 4, 5$ from the top. Which card is
          laid face up second?
        expects: "3"
        feedback: >
          $1$ is laid down and $2$ goes to the bottom, leaving $3, 4, 5, 2$,
          so $3$ comes up second. The full deal gives $1, 3, 5, 4, 2$.
      - ask: >
          You could guess a stack, deal it out, and adjust. What is the
          trouble with that?
        choices:
          - text: >
              None; five cards is small enough to get it in a few tries.
            feedback: >
              There are $5! = 120$ stacks, and a wrong deal does not tell you
              which swap would fix it — moving one card changes where every
              later card lands.
          - text: >
              It works only if the answer turns out to be a simple pattern.
            feedback: >
              Patterns help only once you have one. The real issue is that a
              failed guess gives no direction to the next guess.
          - text: >
              A failed deal gives no clear way to fix the guess, and the
              number of stacks grows as $n!$.
            correct: true
            feedback: >
              Right. Forward from the start, every choice is open. The other
              end of the problem is completely pinned down.
        feedback: >
          The start is free and the finish is fixed: that asymmetry is the
          clue.
      - reflect: >
          The end of the deal is known exactly: the last card laid down is the
          $5$, from a one-card stack. What must the stack have been just
          before the $4$ was laid down, and how do you keep going back to the
          full stack?
        hint: >
          Undo each step: what is the reverse of "lay the top card down", and
          of "move the top card to the bottom"?
        answer: >
          Run the deal in reverse. Undo "move top to bottom" by moving the
          bottom card to the top, and undo "lay the top card down" by putting
          that card back on top. From $5$: move bottom to top (no change), put
          $4$ on top to get $4, 5$; move bottom to top to get $5, 4$, put $3$
          on top: $3, 5, 4$; then $4, 3, 5$ and $2, 4, 3, 5$; then
          $5, 2, 4, 3$ and $1, 5, 2, 4, 3$. That stack deals $1, 2, 3, 4, 5$.

      - part: Undoing instead of guessing
        teach: >
          That is working backwards. When the goal is tightly constrained and
          the start is not, assume the goal and ask what the state just before
          it must have been, then iterate. Each step back here has exactly one
          predecessor, while forward there were $120$ stacks to choose from;
          the backward branching is what makes the search short.
      - ask: >
          A second dealer lays the top card down and then moves the next
          *two* cards, one after the other, from the top to the bottom. Working
          backwards, which move undoes the moving of those two cards?
        choices:
          - text: >
              Move the top two cards to the bottom again.
            feedback: >
              That repeats the step instead of undoing it. On $a, b, c, d$ the
              step gives $c, d, a, b$, and repeating it gives $a, b, c, d$ only
              by the accident of four cards; on five cards it fails.
          - text: >
              Move the bottom two cards to the top, keeping their order.
            correct: true
            feedback: >
              Right. The two cards that went down in order $a$ then $b$ sit at
              the bottom as $\dots, a, b$, and lifting that pair back on top
              restores $a, b, \dots$. Check a backward chain by dealing it
              forward: a wrong inverse shows up at once.
          - text: >
              Move the bottom two cards to the top in reversed order.
            feedback: >
              That puts $b$ above $a$, but $a$ was on top before the step.
              Reversing is the natural slip; one forward deal catches it.
        feedback: >
          Inverting the wrong operation is the standard way working backwards
          goes wrong; one forward check catches it.
      - ask: >
          Now six cards, to come up $1, 2, 3, 4, 5, 6$. Working back from the
          $6$, which card must be second from the top?
        expects: "4"
        hint: >
          Alternate: move the bottom card to the top, then put the next lower
          card on top. Start from $6$ alone.
        feedback: >
          The stacks, top card first, run $6$; then $5, 6$ and $6, 5$; then
          $4, 6, 5$ and $5, 4, 6$; then $3, 5, 4, 6$ and $6, 3, 5, 4$; then
          $2, 6, 3, 5, 4$ and $4, 2, 6, 3, 5$; and finally $1, 4, 2, 6, 3, 5$.
          The second card is $4$, and dealing $1, 4, 2, 6, 3, 5$ forward gives
          $1$ to $6$ in order.

      - part: Labelling a game from the end
        ask: >
          A game: a running total starts at $0$, and two players alternately
          add a whole number from $1$ to $6$. Whoever makes the total exactly
          $50$ wins. Which total do you want to have just said, so that your
          opponent cannot reach $50$ but you surely will next turn?
        expects: "43"
        hint: >
          From your total, every reply must land between $1$ and $6$ short of
          $50$.
        feedback: >
          From $43$ the opponent reaches $44$ to $49$, each within $6$ of
          $50$, so you finish. From $44$ to $49$ the player to move wins at
          once, so $43$ is the total to say.
      - ask: >
          Step back again and again: $43$, then $36$, and so on down by $7$.
          What should the first player say on the very first turn?
        expects: "1"
        feedback: >
          The winning totals are $50, 43, 36, 29, 22, 15, 8, 1$ — the numbers
          that are $1$ mod $7$. The first player says $1$ and then always
          brings the total to the next one, adding $7$ minus whatever the
          opponent added.
      - ask: >
          Change the target to $49$. Who wins now?
        choices:
          - text: >
              The first player, by saying $1$ as before.
            feedback: >
              With target $49$ the winning totals step back by $7$ from $49$:
              $42, 35, \dots, 7, 0$. The total already stands at $0$, a winning
              total for the player who just "said" it.
          - text: >
              The second player.
            correct: true
            feedback: >
              Right. $49$ is a multiple of $7$, so the start $0$ is itself one
              of the totals you want to have said. Whatever the first player
              adds, the second makes it up to $7$.
          - text: >
              It cannot be decided without searching every line of play.
            feedback: >
              The backward labelling is the search, done once: every total is
              labelled from the end, and $0$ comes out losing for the player
              to move.
        feedback: >
          In games, working backwards is labelling: mark the end as a win,
          mark each position by what it can reach, and read off the start.
          Out loud: "Work back from $50$ in steps of $7$."

  - node: quant-puzzles.strategies.state-space
    hook: >
      Any puzzle described by a small, discrete configuration — jug contents, token positions, a permutation of tiles — is secretly a graph, and "can you reach..." is really asking whether two vertices sit in the same connected component.

    explanation: >
      Recast the puzzle explicitly: let every distinct configuration be a vertex, and let every legal move be an edge connecting the configuration it starts from to the one it produces. Under this framing, reachability becomes graph connectivity, and "fewest moves to reach a target" becomes a shortest-path question on that same graph — the puzzle's actual content doesn't change, only the vocabulary for reasoning about it.

      This framing explains why invariants work at all: an invariant is exactly a function that takes the same value on every vertex of a connected component, and parity is the special case where that function is "value mod $2$." A target with a different value therefore sits in a different component by definition — restating, in graph language, the same conclusion the parity check already reaches directly.

      "Fewest moves" is a shortest-path question, and shortest paths are often cheaper to find by working backward from the goal state, exactly the working-backwards move: if the goal is tightly constrained — many source states could reach it, but it has few actual predecessors under the move rule — searching backward from it can reach a small, well-understood frontier far faster than searching forward from a start whose reachable set explodes.

    worked: >
      Two jugs hold $5$ and $3$ liters with no markings; you may fill either jug from a tap, empty either jug, or pour one jug into the other until the source empties or the target fills. Treat each pair $(a,b)$ of current contents as a vertex, with edges for each of those operations. Starting at $(0,0)$, one path through this graph reaches a state with $4$ liters in the $5$-liter jug: fill the $5$ to get $(5,0)$; pour into the $3$ to get $(2,3)$; empty the $3$ to get $(2,0)$; pour the $5$ into the $3$ to get $(0,2)$; fill the $5$ again to get $(5,2)$; pour into the $3$, which has room for $1$ more, to get $(4,3)$. That's $6$ moves to reach $4$ liters — a breadth-first search of this same graph confirms $6$ is in fact the fewest moves possible.

    interview: >
      "How would you solve this systematically, not just by trial and error" is the cue to name the graph explicitly — what a vertex is, what an edge is — since interviewers are listening for the reduction to a standard search problem, not another round of guessing.

    pitfalls: >
      Describing the graph informally without pinning down exactly what a vertex is — an ambiguous state description makes it impossible to say whether two configurations are actually the same vertex or two different ones. Searching forward from a large or unconstrained start when the goal is the tightly constrained side of the problem, when working backward from the goal would shrink the search dramatically.

    recap: >
      Configurations are vertices and moves are edges: reachability is connectivity, fewest-moves is shortest path, and an invariant is just a function constant on one connected component.
    dialogue:
      - part: A river, a boat and three passengers
        teach: >
          A farmer must get a wolf, a goat and a cabbage across a river. The
          boat carries the farmer and at most one of the three. Left on a bank
          without the farmer, the wolf eats the goat and the goat eats the
          cabbage. The interviewer wants the fewest crossings, and a reason it
          cannot be done in fewer.
      - ask: >
          The first crossing is forced. What must the farmer take?
        choices:
          - text: >
              The wolf.
            feedback: >
              That leaves the goat alone with the cabbage on the near bank,
              and the cabbage is gone.
          - text: >
              The goat.
            correct: true
            feedback: >
              It is the only safe choice: the wolf and the cabbage can be left
              together.
          - text: >
              Nothing; cross alone to test the boat.
            feedback: >
              Crossing alone leaves all three together, and the goat eats the
              cabbage or the wolf eats the goat.
        feedback: >
          The goat goes first. After that, choices open up, and a hand search
          tends to wander in circles.
      - ask: >
          Describe a position by which of the four — farmer, wolf, goat,
          cabbage — are still on the near bank. How many such descriptions are
          there, before ruling any out?
        expects: "16"
        feedback: >
          Each of the four is on one bank or the other: $2^{4} = 16$
          descriptions.
      - ask: >
          How many of those $16$ are forbidden, because the wolf and goat, or
          the goat and cabbage, are on a bank without the farmer?
        expects: "6"
        hint: >
          With the farmer on the near bank, which groups on the far bank are
          deadly? Then swap the banks.
        feedback: >
          With the farmer on the near bank, the far bank must not hold
          $\{W, G\}$, $\{G, C\}$ or $\{W, G, C\}$: $3$ forbidden. The same $3$
          with the banks swapped: $6$ in all, leaving $10$ legal positions.
      - reflect: >
          Ten legal positions, and each crossing turns one into another. How
          can you turn "fewest crossings" into a question you can answer
          mechanically, and be sure no shorter plan exists?
        hint: >
          Think of each legal position as a dot on a page.
        answer: >
          Draw each legal position as a dot and join two dots when a single
          crossing turns one into the other. A plan is a path from "all on the
          near bank" to "all on the far bank", and the fewest crossings is
          the shortest such path. Searching outward from the start one
          crossing at a time — breadth-first — finds it, and proves nothing
          shorter exists, because every position reachable in fewer crossings
          has already been listed.

      - part: Puzzles as graphs
        teach: >
          That is state-space framing: configurations are vertices, legal
          moves are edges. "Can you reach it?" becomes "is it in the same
          connected piece of the graph?", and "in how few moves?" becomes a
          shortest path. Searching from both ends, or backwards from the goal,
          works on the same graph.
      - ask: >
          Breadth-first search on the ten positions finds the shortest plan.
          How many crossings is it?
        expects: "7"
        hint: >
          Goat over; back alone; take the wolf or the cabbage over; bring
          something back.
        feedback: >
          Goat over, back alone, wolf over, goat back, cabbage over, back
          alone, goat over: $7$ crossings. Bringing the goat back is the move
          people miss, and the graph has no shorter route.
      - ask: >
          Could some plan take exactly $8$ crossings?
        choices:
          - text: >
              Yes: add one wasted round trip to the $7$-crossing plan.
            feedback: >
              A round trip adds two crossings, giving $9$, not $8$. Adding an
              odd number of extra crossings is the question.
          - text: >
              No: each crossing moves the farmer to the other bank, so he ends
              on the far bank only after an odd number of crossings.
            correct: true
            feedback: >
              Right. The farmer's side is a parity invariant on the graph:
              every edge flips it. Plans of $7$, $9$, $11$ crossings exist; an
              even number never works.
          - text: >
              No, because $7$ is the minimum.
            feedback: >
              Minimum $7$ rules out fewer, not more. $9$ works by adding a
              round trip; $8$ fails for a different reason.
        feedback: >
          Parity splits the graph's vertices into two classes that every edge
          alternates between.
      - ask: >
          Work backwards from the goal. Just before the final crossing, what
          is on the near bank?
        choices:
          - text: >
              The farmer and the goat.
            correct: true
            feedback: >
              Right. The final crossing carries the farmer and one passenger,
              and the goat is the only passenger who can be the last left
              behind with the farmer — wolf and cabbage are safe together on
              the far bank.
          - text: >
              The farmer and the wolf.
            feedback: >
              Then the goat and cabbage were waiting together on the far bank
              without the farmer, and the cabbage was eaten.
          - text: >
              The farmer alone.
            feedback: >
              Then the last crossing carries no passenger, and all three were
              already waiting on the far bank without him.
        feedback: >
          The goal has very few predecessors. Both ends of the problem pin the
          goat to the first and last crossings.

      - part: An invariant is a map of the components
        ask: >
          A $2 \times 2$ frame holds tiles $1$, $2$, $3$ and one gap, and a
          tile next to the gap may slide into it. How many arrangements of the
          three tiles and the gap are there?
        expects: "24"
        feedback: >
          Four positions for four objects: $4! = 24$ vertices in the state
          graph.
      - ask: >
          The frame reads $1, 2$ on top and gap, $3$ below. Read the tiles
          clockwise from the top-left, skipping the gap. What does sliding a
          tile do to that cyclic order?
        choices:
          - text: >
              Nothing: a tile slides along the frame's ring, so the cyclic
              order $1, 2, 3$ never changes.
            correct: true
            feedback: >
              Right. The four cells form a ring and the gap only moves around
              it, so the tiles keep their cyclic order. An arrangement with
              $1$ and $2$ swapped has the order reversed and lies in another
              component.
          - text: >
              It swaps two tiles, so the order can become anything.
            feedback: >
              A slide moves one tile into the gap; it never exchanges two
              tiles. Try a few slides and read the order each time.
          - text: >
              It reverses the order at every slide.
            feedback: >
              Slide the $3$ left into the gap: clockwise from the top-left the
              tiles still read $1, 2, 3$.
        feedback: >
          The cyclic order is a function constant on each component of the
          state graph — which is exactly what an invariant is.
      - ask: >
          How many of the $24$ arrangements can be reached from the start?
        expects: "12"
        hint: >
          Each cyclic order of the three tiles can be placed in the ring with
          the gap in any of four cells, and rotated into three starting
          points.
        feedback: >
          Every arrangement with cyclic order $1, 2, 3$ is reachable and none
          with $1, 3, 2$ is, so the $24$ split into two components of $12$. The same reason, refined by a parity, puts exactly half
          of the $16!$ labellings of the $15$-puzzle out of reach.

  - node: quant-puzzles.strategies.adversary
    hook: >
      The words "guarantee," "worst case," "must," or "at least how many" are asking for a specific number: the cost against an opponent who sees everything you've drawn so far and is actively trying to make you work as long as possible.

    explanation: >
      The move is to imagine the hidden data — which card is drawn, which box holds the prize — as chosen not randomly but by an adversary who answers adaptively, consistent with everything already revealed, and whose only goal is to delay you as long as possible. Your answer is whatever cost you can still guarantee against that adversary, which is a fundamentally different number from the cost against a typical or random instance.

      This produces a two-part proof structure worth remembering as a pair: the adversary argument gives you a *lower* bound — a number of draws or tests the adversary can force you to spend no matter what you do — while an actual matching procedure that always succeeds within that many draws supplies the *upper* bound. Only when the two numbers meet is the guarantee proven tight; a lower bound alone tells you the guarantee can't be smaller, not that your specific number is achievable.

    worked: >
      A standard deck has $13$ ranks, four cards of each. How many cards must you draw, in the worst case, to guarantee three cards of the same rank? An adversary handing you cards one at a time, trying to delay a triple as long as possible, gives you exactly two cards of every rank first — $2\times13=26$ cards with no rank appearing three times, which is achievable since each rank has four cards available. The next card, the $27$th, must belong to some rank, and since that rank already has two cards among the first $26$, it becomes a third — forced, regardless of which rank the adversary picks. So $27$ cards guarantee three of a kind, and $26$ do not, since the adversary's exact stalling arrangement is a legal deal.

    interview: >
      "How many do you need to guarantee..." is always this technique; interviewers are listening for the adversary's stalling construction stated explicitly (not just the final count), since the construction is what proves $26$ isn't enough and the pigeonhole step on the next card is what proves $27$ is.

    pitfalls: >
      Computing only the pigeonhole lower bound and forgetting to check that the adversary's stalling arrangement is actually achievable given the real constraints — here, that four cards of each rank genuinely exist to hand out. Answering with the *average*-case number instead of the worst case when the question explicitly said "guarantee" — the two numbers are rarely close.

    recap: >
      Let a worst-case adversary pick the hidden data adaptively against you: the largest stall it can force, plus one more draw, is the guaranteed answer — and it needs both a stalling construction and a forcing step to be proven tight.
    dialogue:
      - part: Gloves in the dark
        teach: >
          A dark drawer holds $16$ identical black gloves: $8$ for the left
          hand and $8$ for the right. How many must you pull out to be sure of
          a wearable pair — one left and one right?
      - ask: >
          Imagine the worst luck. What is the largest number of gloves you
          could pull out and still have no wearable pair?
        expects: "8"
        feedback: >
          All $8$ left gloves, one after another, and still nothing to wear.
          The same goes for all $8$ right gloves.
      - ask: >
          So how many gloves make a wearable pair certain?
        expects: "9"
        feedback: >
          With $9$ gloves you cannot have only lefts or only rights, since
          there are $8$ of each; so you hold at least one of each, which is a
          pair. And $8$ is not enough, as the all-left draw shows.
      - ask: >
          A colleague says "socks take $2$ draws, and gloves are just socks
          with a hand, so call it $3$ — you will almost always have a pair by
          then". What is wrong?
        choices:
          - text: >
              Nothing; $3$ gloves give a pair most of the time.
            feedback: >
              Most of the time is not "be sure". Three left gloves in a row is
              a perfectly possible draw.
          - text: >
              "Be sure" asks about the worst sequence of draws, and the worst
              sequence is $8$ lefts in a row.
            correct: true
            feedback: >
              Right. A guarantee has to survive the unluckiest draw, not the
              typical one — and here the two are far apart.
          - text: >
              Socks take $3$ draws, not $2$, so gloves take $4$.
            feedback: >
              For identical socks any two match, so $2$ is right for socks.
              The difference is that gloves have a left and a right, and a
              bad draw can avoid one of them for $8$ gloves.
        feedback: >
          "Sure" and "usually" are different questions, and the interview
          question almost always means "sure".
      - reflect: >
          Now the drawer holds $4$ pairs of black gloves and $4$ pairs of
          brown, each pair one left and one right of its colour. How many
          gloves make a wearable pair — same colour, one left, one right —
          certain? Say how you would make sure your number beats every
          possible sequence of draws.
        hint: >
          Picture someone handing you the gloves on purpose, choosing each
          one to keep you pair-less as long as possible.
        answer: >
          Picture an opponent picking each glove to avoid a pair. They can
          hand you $8$ with no pair — all $8$ lefts, or the $4$ black lefts
          and the $4$ brown rights — so $8$ is not enough. Against $9$ they
          have no escape: with no pair, each colour contributes only lefts or
          only rights, at most $4$ gloves, so at most $8$ in all. The answer
          is $9$, and the opponent is what certifies it.

      - part: Playing against the worst case
        teach: >
          That is an adversary argument. When a question says "guarantee",
          "must" or "worst case", assume the hidden data is chosen by an
          opponent who answers as you go, consistent with everything you have
          seen, and who is trying to make you work as long as possible. The
          opponent's best stalling proves the lower bound; a matching
          argument — often pigeonhole — proves the upper bound.
      - ask: >
          A third drawer holds $3$ pairs each of black, brown and grey gloves,
          every pair one left and one right. How many gloves guarantee a
          wearable pair?
        expects: "10"
        hint: >
          How many gloves of one colour can the adversary hand you without
          giving both hands of it?
        feedback: >
          The adversary gives only one hand of each colour — say the $3$ black
          lefts, $3$ brown rights and $3$ grey lefts — which is $9$ gloves and
          no pair. That is its best, since each colour gives at most $3$
          without a pair; so the $10$th glove forces one. The stall has to be
          legal: three of each hand exist in each colour.

      - part: An adversary who answers as you ask
        ask: >
          Eight weights look identical. A balance compares two at a time and
          says which is heavier. A knockout — pair them up, keep the winners,
          repeat — finds the heaviest. How many comparisons does it use?
        expects: "7"
        hint: >
          Each comparison knocks out exactly one weight.
        feedback: >
          $4 + 2 + 1 = 7$: every comparison eliminates one weight, and $7$
          must go.
      - ask: >
          Could a cleverer scheme be sure of the heaviest with $6$ comparisons?
        choices:
          - text: >
              Yes, on a lucky run where the heaviest is compared early.
            feedback: >
              Luck does not help you be sure. However the comparisons fall,
              the adversary can keep two weights unbeaten after $6$ of them
              and choose either as the heaviest.
          - text: >
              Yes, by comparing the heaviest-looking weights first.
            feedback: >
              They all look identical, and the adversary answers to match
              whatever you do. Any $6$ comparisons leave two weights that
              have never lost.
          - text: >
              No: each comparison has one loser, and every weight but the
              heaviest must lose at least once, or the adversary could make it
              the heaviest.
            correct: true
            feedback: >
              Right. Seven weights need to lose, one loss per comparison: at
              least $7$. Six comparisons leave at least two unbeaten weights,
              and the adversary declares whichever you did not name.
        feedback: >
          The adversary proved the lower bound $7$; the knockout proved the
          upper bound $7$. Together they settle the worst case.
      - ask: >
          With $50$ weights, how many comparisons are needed, in the worst
          case, to be sure of the heaviest?
        expects: "49"
        feedback: >
          The same two halves: $49$ weights must each lose once, one loss per
          comparison, and a knockout or a running champion uses exactly $49$.
      - ask: >
          Which half of each answer did the adversary supply?
        choices:
          - text: >
              The upper bound: it showed a method that works.
            feedback: >
              The method came from you — the knockout, or the pigeonhole count
              on gloves. The adversary only ever shows that fewer cannot work.
          - text: >
              Both halves at once.
            feedback: >
              An adversary can only stall. Showing that some number always
              suffices needs a procedure or a counting argument of its own.
          - text: >
              The lower bound: it showed that any fewer can be defeated.
            correct: true
            feedback: >
              Right. Adversary arguments prove lower bounds; a matching
              procedure proves the upper bound. Out loud: "The worst case can
              stall for $8$, and here is why $9$ always works."
        feedback: >
          State both halves in an interview: the adversary's stall, then the
          argument that beats it.

  - node: quant-puzzles.strategies.guarantee-vs-expectation
    hook: >
      "How many draws does it take" is genuinely two different questions wearing one sentence, and answering the wrong one — average when they asked for worst case, or vice versa — is one of the fastest ways to lose credibility in a puzzle round.

    explanation: >
      A guarantee is the adversarial worst case: the number that holds no matter how the hidden data is arranged. An expectation is an average over a *stated* random model — uniform shuffle, independent draws, whatever the problem specifies — and the two numbers answer genuinely different questions, so there is no reason to expect them to be close, let alone equal.

      The guarantee typically depends only on the coarse structure of the problem — how many categories exist — while the expectation depends on the actual underlying counts, which is why changing the numbers in a problem can leave the guarantee untouched while shifting the expected value noticeably. The practical discipline: when a question says "guarantee," answer with the adversarial number; when it says "on average" or specifies a random model, switch to expectation and say out loud that you're switching models — never answer "on average" to a question that asked for a guarantee, and never answer with the worst case when a random model was explicitly given.

    worked: >
      A drawer holds $6$ red socks and $4$ blue socks, drawn in a uniformly random order. The guarantee for a matching pair is still $3$: with only two colors present, an adversary can hand you one red and one blue first, but the third sock must repeat one of the two colors — this holds regardless of the $6$-versus-$4$ split. The expectation is different: a match occurs on the second draw only if it shares the first draw's color, with probability $(6/10)(5/9)+(4/10)(3/9)=7/15$; otherwise, since only two colors exist, the third draw is forced to match. So the expected number of draws is $2\cdot(7/15)+3\cdot(8/15)=38/15\approx2.533$ — close to, but not equal to, the $10$-red-$10$-blue value of $48/19\approx2.526$, because the expectation, unlike the guarantee, is sensitive to the actual counts.

    interview: >
      "What's the expected number of draws" versus "how many do you need to guarantee" are two different follow-ups interviewers ask back to back specifically to see whether you flag the model switch — naming which one you're computing, before computing it, is the actual skill being tested.

    pitfalls: >
      Assuming the guarantee changes when the color counts change — it usually doesn't, since it depends on the number of categories, not their sizes. Quoting an expectation as though it were a guarantee, or vice versa, without stating the random model the expectation assumes — an interviewer who didn't specify one will ask what you assumed.

    recap: >
      A guarantee is the adversarial worst case and depends on category count; an expectation needs a stated random model and depends on the actual counts — state which one you're answering before you compute it.
    dialogue:
      - part: Rolling for a repeat
        teach: >
          You roll a fair six-sided die again and again, and stop the moment
          some face comes up for the second time. The interviewer asks, "How
          many rolls does it take?"
      - ask: >
          How many rolls guarantee that you have stopped?
        expects: "7"
        feedback: >
          Six rolls can all show different faces; the seventh must repeat one
          of them, by pigeonhole. So $7$ rolls guarantee a repeat, and $6$ do
          not.
      - ask: >
          Before computing anything, predict: with a fair die, about how many
          rolls does it take on average?
        choices:
          - text: >
              About $7$, since that is when the repeat is forced.
            feedback: >
              $7$ is the worst case. Reaching it needs six different faces in
              a row first, which is rare — the average sits well below.
          - text: >
              Between $3$ and $4$.
            correct: true
            feedback: >
              Right, and the computation that follows confirms it. Repeats
              come early, and long runs of different faces are rare.
          - text: >
              About $4.5$, halfway between the best case $2$ and the worst
              case $7$.
            feedback: >
              An average is not the midpoint of best and worst unless every
              outcome is equally likely. Here the chance of lasting long falls
              off fast, and the average follows it down.
        feedback: >
          The prediction is checked next, from the probabilities.
      - ask: >
          What is the probability that the first three rolls all show
          different faces?
        expects: "5/9"
        tolerance: 0.001
        hint: >
          The first roll is free; the second must avoid one face, the third
          must avoid two.
        feedback: >
          $1 \cdot (5/6) \cdot (4/6) = 20/36 = 5/9$. So with probability $4/9$
          the repeat has already happened by roll $3$.
      - ask: >
          Let $T$ be the number of rolls. The probabilities that $T$ exceeds
          $0, 1, 2, \dots, 6$ are $1, 1, 5/6, 5/9, 5/18, 5/54, 5/324$, and
          $T$ never exceeds $7$. By the tail-sum formula, what is
          $\mathbb{E}[T]$, to two decimal places?
        expects: "3.77"
        tolerance: 0.01
        hint: >
          The tail-sum formula says $\mathbb{E}[T]$ is the sum of those seven
          probabilities.
        feedback: >
          $1 + 1 + 5/6 + 5/9 + 5/18 + 5/54 + 5/324 = 1223/324 \approx 3.77$.
          The guarantee is $7$; the average is under $4$.
      - reflect: >
          Both $7$ and $3.77$ are honest answers to "how many rolls does it
          take?". Why are they so far apart, and what exactly does each one
          answer?
        answer: >
          The $7$ answers "how many rolls make you certain": it is the cost
          against an adversary who picks the faces, and that adversary shows
          six different faces first. The $3.77$ answers "how many on
          average": it is an expectation under a stated model, a fair die
          rolled independently. The worst case needs six distinct faces in a
          row, which happens with probability $5/324$, about $1.5\%$ — so it
          barely moves the average.

      - part: Two numbers, two questions
        teach: >
          A guarantee and an expectation are different numbers that answer
          different questions. The guarantee is the worst case against an
          adversary and needs no model; the expectation is an average over a
          random model you must name. "How many does it take?" is ambiguous
          until you say which one you are computing.
      - ask: >
          Swap in a fair $20$-sided die. How many rolls guarantee a repeat?
        expects: "21"
        feedback: >
          Twenty different faces can come first, so $21$. The average, by the
          same tail-sum computation, is only about $6.3$. The gap widens as
          the die grows: the guarantee grows like the number of faces, the
          average much more slowly.
      - ask: >
          Back to six faces, but now the die is loaded so that a six comes up
          half the time. What happens to the two numbers?
        choices:
          - text: >
              Both stay the same, since the die still has six faces.
            feedback: >
              The guarantee stays, but the average depends on the
              probabilities. With sixes so common, a repeat tends to come
              sooner.
          - text: >
              The guarantee stays $7$; the average falls.
            correct: true
            feedback: >
              Right. The worst case only uses which faces are possible, and
              every face still is. The expectation uses the model, and a
              lopsided die repeats sooner.
          - text: >
              The guarantee falls, because sixes come up so often.
            feedback: >
              An adversary can still show six different faces first — each is
              possible — so $7$ is still needed for certainty. Probabilities
              never enter a guarantee.
          - text: >
              The average rises, since five of the faces are now rarer.
            feedback: >
              Rarer faces matter less than the common one: the six turns up
              twice quickly. Concentrated probability makes repeats come
              sooner.
        feedback: >
          The guarantee depends on what is possible; the expectation depends
          on how likely each thing is.

      - part: Answering the question that was asked
        ask: >
          The interviewer now says: "How many rolls must you make to be
          certain of a repeated face?" What do you say?
        choices:
          - text: >
              "About $3.8$ on average."
            feedback: >
              "Certain" asks for a guarantee. An average says nothing about
              the unlucky runs, and one in $65$ runs needs all $7$.
          - text: >
              "Seven: six rolls can all differ, and the seventh must repeat."
            correct: true
            feedback: >
              Right. The adversary's run and the pigeonhole step, both said
              aloud.
          - text: >
              "Between $2$ and $7$, depending on luck."
            feedback: >
              That is the range of outcomes, not an answer. "Certain" picks
              out the top of the range.
        feedback: >
          Out loud: if the question says "certain" or "guarantee", give the
          worst case; if it says "on average", name the random model —
          "fair die, independent rolls" — then give the expectation. If it
          says neither, ask.

  - node: quant-puzzles.strategies.info-lower-bound
    hook: >
      "What's the fewest tests you could possibly need" is answered before any scheme is designed at all — just count how many distinguishable outcomes exist and how many outcomes each test can tell apart.

    explanation: >
      Each test with $b$ possible outcomes can at best multiply the number of histories you're able to distinguish by $b$, so a sequence of $k$ tests distinguishes at most $b^{k}$ total cases. If a procedure has to correctly identify one of $N$ genuinely different possibilities, it needs $k\ge\log_b N$ tests just to have enough distinguishable outcomes to name the answer — rounded up, since $k$ is an integer, $k\ge\lceil\log_b N\rceil$.

      This gives necessity, not sufficiency: the count proves that fewer tests cannot possibly work, since there aren't enough distinguishable outcomes to go around, but it says nothing about whether a scheme achieving that many tests actually exists. A matching construction is still owed separately, exactly as with the adversary argument's lower and upper bounds.

    worked: >
      One bulb is defective among $100$ identical bulbs, and each test is a yes/no question — "is the defective bulb in this specific subset?" With $N=100$ possibilities and $b=2$ outcomes per test, the bound gives $k\ge\log_2 100\approx6.64$, so $k\ge7$. Binary search achieves exactly $7$: split the $100$ into two groups, test one, keep the group containing the defect, and repeat — $100\to50\to25\to13\to7\to4\to2\to1$ is $7$ halvings to isolate a single bulb, matching the bound exactly, since $2^{6}=64<100\le128=2^{7}$.

    interview: >
      "What's the theoretical minimum number of tests" wants $\lceil\log_b N\rceil$ computed explicitly, with $N$ and $b$ both named — how many possibilities the answer must distinguish, and how many outcomes one test produces — before any scheme is proposed.

    pitfalls: >
      Forgetting to count every piece of information the answer must convey — for a defective coin that could be heavy or light, $N$ counts both the coin's identity and its direction, not just the coin. Treating the counting bound as proof that a scheme achieving it exists — it only proves fewer tests are impossible; a working construction is a separate, additional argument.

    recap: >
      Count outcomes: $k$ tests with $b$ results each distinguish at most $b^{k}$ cases, so identifying one of $N$ possibilities needs $k\ge\lceil\log_b N\rceil$ tests — necessity only, a scheme is still owed.
    dialogue:
      - part: Nine coins and a balance
        teach: >
          Nine coins look identical, but one is slightly heavier than the
          rest. You have a balance scale, which compares two groups of coins
          and tips to the heavier side or stays level. The interviewer wants
          the fewest weighings that always find the heavy coin.
      - ask: >
          First attempt: weigh coin against coin — $1$ against $2$, then $3$
          against $4$, and so on. How many weighings does that take in the
          worst case?
        expects: "4"
        feedback: >
          Four level weighings clear coins $1$ to $8$, and coin $9$ is then
          the heavy one without weighing it. So $4$ in the worst case.
      - ask: >
          Better: halve it. Put $4$ against $4$ with one coin aside, and keep
          halving the heavy side. How many weighings in the worst case?
        expects: "3"
        feedback: >
          If level, the aside coin is heavy after $1$ weighing. If not, the
          heavy four go $2$ against $2$, then $1$ against $1$: $3$ in the worst
          case.
      - ask: >
          Halving is how you search a sorted list, and $\log_2 9 \approx 3.17$.
          Does that prove $3$ is the best possible?
        choices:
          - text: >
              Yes: each weighing halves the candidates at best, so $3$ is
              optimal.
            feedback: >
              Halving is what a yes/no question does. A balance has a third
              answer, "level", and a weighing that uses it can cut the
              candidates to a third.
          - text: >
              No: a balance has three outcomes, not two, so the halving count
              does not bound it.
            correct: true
            feedback: >
              Right. The count has to match the test. What is the most that
              one three-way test can tell apart?
          - text: >
              No, but only because $9$ is odd.
            feedback: >
              Parity of the pile is not the issue. The issue is that halving
              wastes the "level" outcome.
        feedback: >
          The lower bound has to come from counting what a weighing can
          report.
      - reflect: >
          Each weighing ends one of three ways. Count the different outcome
          records two weighings can produce, and say what that tells you about
          nine coins — both whether two weighings could be enough and whether
          one could.
        hint: >
          A scheme must end with a different record for each coin that might
          be heavy, or it cannot tell those two coins apart.
        answer: >
          Two weighings give $3 \cdot 3 = 9$ possible records, exactly one per
          coin, so two might suffice — and they do: weigh $3$ against $3$,
          which names the heavy triple (left, right, or the three aside),
          then $1$ against $1$ inside it. One weighing has only $3$ records
          for $9$ possibilities, so it must leave two coins with the same
          record, and nothing can tell them apart. The answer is $2$.

      - part: Counting outcomes
        teach: >
          That is an information-theoretic lower bound. A test with $b$
          possible outcomes multiplies the number of distinguishable histories
          by at most $b$, so $k$ tests separate at most $b^{k}$ cases. To pick
          out one of $N$ possibilities you need $b^{k} \ge N$, that is
          $k \ge \lceil \log_b N \rceil$. The adversary of the worst case is
          what forces it: it steers you into the largest group still unsplit.
          The count gives necessity only; you still owe a scheme.
      - ask: >
          Ten coins, one heavy. What does the counting bound say is the fewest
          weighings that could work?
        expects: "3"
        feedback: >
          $3^{2} = 9 < 10 \le 27 = 3^{3}$, so two weighings cannot separate ten
          coins, and $3$ is the first candidate. A scheme achieves it: $3$
          against $3$, then at most four coins left, which two more weighings
          settle.
      - ask: >
          A hundred coins, one heavy. Fewest weighings that always work?
        expects: "5"
        hint: >
          Compare $100$ with powers of $3$.
        feedback: >
          $3^{4} = 81 < 100 \le 243 = 3^{5}$, so at least $5$. And $5$ works:
          $33$ against $33$ leaves at most $34$, then at most $12$, $4$, $2$,
          $1$.
      - ask: >
          A thousand bottles of wine, one poisoned. Each taster gives a yes or
          no a day later, and there is time for one round only: each taster
          sips from many bottles at once. How many tasters are needed?
        expects: "10"
        hint: >
          Each taster is a two-outcome test, all run at once.
        feedback: >
          $2^{9} = 512 < 1000 \le 1024 = 2^{10}$, so at least $10$. And $10$
          suffice: number the bottles in binary, and taster $j$ sips every
          bottle whose $j$-th bit is $1$. The pattern of yes and no spells out
          the poisoned bottle's number.

      - part: When the count is not enough
        ask: >
          Thirteen coins, one counterfeit that may be heavy or light, and you
          must name it and its direction. $N = 26 \le 27 = 3^{3}$, so counting
          allows $3$ weighings. Yet no $3$-weighing scheme exists. Why?
        choices:
          - text: >
              The first weighing, $k$ against $k$, cannot split the $26$ cases
              into three groups of at most $9$.
            correct: true
            feedback: >
              Right. If it tips, $2k$ cases remain — each coin on the heavy
              side could be heavy, each on the light side light — so
              $2k \le 9$ forces $k \le 4$. If level, $2(13 - 2k)$ cases remain,
              and $\le 9$ forces $k \ge 5$. No $k$ does both.
          - text: >
              The bound is wrong for heavy-or-light problems; it should count
              only the $13$ coins.
            feedback: >
              The answer must say the direction too, so $N = 26$ is the right
              count. The bound is correct; it just is not reached.
          - text: >
              Thirteen is odd, so the coins cannot be split evenly.
            feedback: >
              Odd piles are fine — nine coins split as $3$, $3$ and $3$ aside.
              The obstruction is that each outcome of the first weighing must
              leave at most $9$ cases, and here no split manages it.
        feedback: >
          Counting says fewer is impossible; it never says the bound is met.
          Every weighing, not just the total, has to split the remaining cases
          into pieces the later weighings can handle. Out loud: "$N$ cases,
          $b$ outcomes per test, so at least $\lceil \log_b N \rceil$ — and
          here is a scheme that meets it."
