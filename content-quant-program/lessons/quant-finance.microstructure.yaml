unit: quant-finance.microstructure
opening: >
  Market microstructure is where the earlier probability and game-theory
  machinery meets the literal mechanics of a trade: the limit order book, the
  price a marketable order actually pays, and why a spread exists at all. The
  unit opens with the book itself — two priority queues and the rule that
  fills them — then builds the price statistics a desk actually tracks: mid,
  microprice, and the queue imbalance that tilts it. From there it derives the
  spread from first principles via Glosten–Milgrom, turns that into the
  inventory risk and skew a working maker manages, and closes with the
  taker's side of the same coin: market impact, execution schedules, tick
  size, queue value, and the latency race that decides who gets there first.
lessons:
  - node: quant-finance.microstructure.lob
    hook: >
      Every price you will ever quote, hit, or get filled at in this unit is
      defined by this queue structure — skip it and "spread", "depth", and
      "walking the book" are just words.
    explanation: >
      Think of the book as two lines at a counter, not a single price. Bids
      queue on one side sorted best price first — highest bid at the front —
      and asks queue on the other, lowest ask at the front. Within a price
      level, the queue is strict FIFO: the order that arrived first is filled
      first, and later orders at the same price simply wait behind it. That's
      the entire mechanism generating every trade — an incoming order matches
      whichever queue it crosses, from the front backward, until it is either
      filled or it runs out of resting shares to trade against.

      The best bid and best ask are just the fronts of the two queues, and
      the gap between them, the spread, cannot be negative in a functioning
      market: if some price is bid above where it's offered, someone buys at
      the low ask and instantly sells at the high bid for a riskless profit,
      and that arbitrage collapses the crossed levels until the book is no
      longer crossed. The spread being strictly positive is therefore not an
      assumption, it's a consequence of anyone being able to see both queues
      at once.

      Depth — the shares resting at a level — is separate information from
      price. A level can sit at the best price with almost nothing behind it,
      or several ticks back with enormous size; depth tells you how much an
      incoming order would have to consume before the price at that level
      actually moves, which is the whole content of the next several nodes in
      this unit.
    worked: >
      Take a book with bids 50.00 for 300 shares and 49.99 for 1200, and asks
      50.02 for 150 and 50.03 for 900. The best bid is 50.00, the best ask
      50.02, so the quoted spread is $50.02 - 50.00 = 0.02$, two cents. A
      sell order for 500 shares matches the bid queue from the front: 300
      shares trade against the 50.00 level, exhausting it, and the remaining
      200 shares trade against the 49.99 level, which still has 1000 left
      resting after the fill. The best bid has moved from 50.00 to 49.99 —
      the level didn't just get thinner, it disappeared.
    interview: >
      Expect "walk me through how a limit order book works" as a warm-up
      before any pricing question. The interviewer is listening for the
      two-queue, price-time-priority picture stated cleanly, and for the
      reflex that a crossed book is impossible in equilibrium, not just
      unusual.
    pitfalls: >
      Describing the book as a single price rather than two queues makes
      every later question — spread, depth, walking an order — impossible to
      reason about cleanly. Assuming a large order fills entirely at the best
      price ignores that depth at the touch is usually a small fraction of
      real order sizes.
    recap: >
      A limit order book is two price-sorted FIFO queues facing each other;
      their fronts are the market and everything behind them is depth
      waiting to be walked through.
    dialogue:
      - part: Five orders and a seller in a hurry
        teach: >
          Before the open, five limit orders arrive in a quiet stock, in this
          order. A: buy 200 shares at 31.40. B: sell 300 at 31.46. C: buy 500
          at 31.42. D: buy 100 at 31.40. E: sell 400 at 31.45. Nothing has
          traded yet; every order is sitting there waiting.
      - ask: >
          A seller arrives who wants 100 shares sold right now, to whoever
          will pay the most. Whose order does the seller trade against?
        choices:
          - text: >
              A's, because A arrived first.
            feedback: >
              Arrival time only breaks ties between equal prices. A bids 31.40
              and C bids 31.42; the seller is not going to accept two cents
              less a share out of respect for punctuality.
          - text: >
              C's, at 31.42.
            correct: true
            feedback: >
              C is the highest bid, so C is first in line on the buy side. C
              keeps 400 shares resting after the fill.
          - text: >
              E's, the lowest sell order.
            feedback: >
              E is another seller. A seller can only trade against buyers; the
              sell orders form a line of their own on the other side.
          - text: >
              A, C and D share it in proportion to their sizes.
            feedback: >
              Some venues do allocate within a price level by size, but A, C and
              D are not at one price. The best price always goes first.
        feedback: >
          The buy orders form one line, best price at the front; the sell
          orders form another. A seller trades with the front of the buy line.
      - ask: >
          After that trade, the best buy order is C at 31.42 and the best sell
          order is E at 31.45. What is the gap between them, in cents?
        expects: "3"
        feedback: >
          $31.45 - 31.42 = 0.03$, three cents. The highest price anyone will
          pay and the lowest anyone will accept are three cents apart, which is
          why nothing trades until someone gives ground.
      - ask: >
          Now a second seller sells 550 shares immediately. C's remaining 400
          go first at 31.42, leaving 150 to sell at 31.40, where A and D both
          wait. Who gets those 150 shares?
        choices:
          - text: >
              D, the smaller order, which the 150 shares can fill completely.
            feedback: >
              The matching rule does not try to finish orders neatly. D arrived
              after A, so D waits behind A however small it is.
          - text: >
              A gets 100 and D gets 50, in proportion to their sizes.
            feedback: >
              That is pro-rata allocation, a real design some futures venues
              use. In a price-time book, the earlier order at a price is filled
              first, in full if the shares allow.
          - text: >
              A, all 150 of them.
            correct: true
            feedback: >
              A was at 31.40 first, so A is at the front of that level. A keeps
              50 shares; D, behind A, gets nothing yet.
        feedback: >
          At one price the line is first come, first served. Price decides
          which level trades; time decides who in that level trades.
      - reflect: >
          You have now decided three fills. Say exactly what structure you were
          consulting each time, and the two rules that ordered it.
        answer: >
          Two lines facing each other: buy orders sorted with the highest price
          at the front, sell orders sorted with the lowest price at the front.
          An incoming order trades against the opposite line from the front
          backward. Price decides first — a better price is always ahead — and
          among orders at the same price, the earlier arrival is ahead. Nothing
          else about an order (its size, its owner) affects its place.

      - part: Naming what you were reading
        teach: >
          That structure is a limit order book: two priority queues for one
          instrument. Resting buy orders, the bids, sort by price descending;
          resting sell orders, the asks, sort by price ascending. Within a
          price level, price–time priority makes the level a FIFO queue of
          shares. The fronts are the best bid $P_b$ and best ask $P_a$, the
          quoted spread is $P_a - P_b$, and the depth of a level is the number
          of shares resting there.
      - ask: >
          After the 550-share sale, what is the depth at the best bid?
        expects: "150"
        hint: >
          The 31.42 level is empty. Which level is now at the front of the bid
          queue, and who is still in it?
        feedback: >
          C's level is gone, so the best bid is 31.40, where A has 50 left and
          D has 100: depth $50 + 100 = 150$. The spread is now
          $31.45 - 31.40 = 0.05$ — it widened because a level disappeared, not
          because anyone changed a price.
      - ask: >
          A buyer now sends a limit order to buy 200 shares at 31.47. What
          happens to it?
        choices:
          - text: >
              It rests at 31.47 and becomes the new best bid.
            feedback: >
              Then the best bid, 31.47, would sit above the best ask, 31.45.
              The order is willing to pay what E is asking, so it trades
              instead of waiting.
          - text: >
              It buys 200 shares from E at 31.45.
            correct: true
            feedback: >
              The order crosses the ask queue, so it matches the front of it:
              E at 31.45, the resting order's price. E keeps 200; the buyer's
              limit of 31.47 was only a ceiling, never paid.
          - text: >
              It buys 200 shares at 31.47, the price the buyer named.
            feedback: >
              The trade happens at the resting order's price. E asked 31.45,
              and an incoming order that is willing to pay more simply gets
              the better price.
          - text: >
              It buys 200 shares from B at 31.46.
            feedback: >
              B asks more than E. The ask queue is sorted lowest price first,
              so E at 31.45 trades before B is reached.
        feedback: >
          An incoming order that crosses the opposite best does not rest; it
          matches the opposite queue from the top down. Only what is left over
          joins its own queue.

      - part: A book that cannot stand
        ask: >
          A data feed briefly shows a best bid of 31.48 and a best ask of
          31.45 on one venue. How many cents per share could a trader lock in
          with no risk, ignoring fees?
        expects: "3"
        feedback: >
          Buy at the 31.45 ask and sell at the 31.48 bid, both immediately:
          $31.48 - 31.45 = 0.03$ a share, three cents, with no position left
          over. A crossed book is a riskless profit, so it is traded away the
          moment it appears.
      - ask: >
          Which reason, said in an interview, best explains why $P_a - P_b > 0$
          in a working book?
        choices:
          - text: >
              Exchanges forbid it in their rulebooks.
            feedback: >
              Matching engines do refuse to let an incoming order rest across
              the book — but that rule is itself the arbitrage argument written
              into software. The economic reason is the one to say.
          - text: >
              If the bid were at or above the ask, anyone could buy at the ask
              and sell at the bid for nothing, and those trades would consume
              the crossed levels.
            correct: true
            feedback: >
              The positive spread is a consequence of both queues being
              visible to everyone, not an assumption. (A locked book, bid equal
              to ask, can flicker across venues; a crossed one is free money.)
          - text: >
              Makers need the spread to cover their costs.
            feedback: >
              That explains why the spread is often *wide*, not why it is
              positive. Even a maker with no costs could not leave the book
              crossed — someone would trade against both sides.
        feedback: >
          Two queues, price then time, fronts that never cross: that is the
          whole object. Everything later in the unit — what a trade costs, what
          the price "is" — is read off it.
      - ask: >
          A venue keeps two sorted queues, matches incoming orders from the
          front, and never lets them cross, but within a price level it splits
          each fill among resting orders in proportion to their sizes. Which
          part of the definition does it fail?
        choices:
          - text: >
              None: it is a limit order book in every respect.
            feedback: >
              It is an order book, but not the price–time one. Under pro-rata,
              arriving first at a level buys you nothing, so the FIFO clause
              fails.
          - text: >
              The sorting of the levels by price.
            feedback: >
              The levels are still sorted best price first; price priority is
              intact. What changed is the order *within* a level.
          - text: >
              FIFO within a price level.
            correct: true
            feedback: >
              Exactly one clause breaks. Size, not arrival time, now decides
              who trades at a level — a design used on some futures venues,
              where it rewards posting large orders rather than posting early.
        feedback: >
          Time priority is the clause that later makes queue position worth
          money; a pro-rata book prices the same race in size instead.

  - node: quant-finance.microstructure.order-types
    hook: >
      Every interview eventually asks "would you rather be a taker or a
      maker," and the honest answer requires knowing exactly what each order
      type guarantees — and what it doesn't.
    explanation: >
      A limit order is a promise about price with no promise about time:
      post a price, wait in the queue, and either something on the other
      side arrives to fill you or it never does. Post a limit buy far below
      the current market and the price guarantee is worthless in practice —
      you'll never see a fill — while posting it right at the best bid gets
      you in line at the market but still leaves the fill uncertain, since it
      depends on someone crossing to hit you.

      A market order flips the guarantee: it takes whatever price the
      opposite queue is currently offering, walking through as many levels as
      needed, so the fill is certain but the price is not. In between sits
      the marketable limit order — a buy limit set at or above the current
      best ask, or a sell limit at or below the current best bid — which
      behaves exactly like a market order except that it refuses to fill
      beyond a stated worst-case price. That's what a desk actually sends
      instead of a bare market order: certainty of getting done, with a cap
      on how badly the fill can go.

      The economic tradeoff is symmetric and one line long. Whoever takes
      liquidity pays the spread, plus whatever exchange fee attaches to
      taking, in exchange for immediacy. Whoever makes liquidity earns the
      spread, often plus a rebate for adding depth, but only gets filled when
      a taker decides to trade — and a taker decides to trade exactly when
      the maker's price has become attractive to trade against, which is not
      always good news for the maker.
    worked: >
      A stock trades with best bid 49.98 and best ask 50.02. A trader who
      wants to buy but not chase the price posts a limit buy at 49.99 —
      inside the current bid, ahead of the queue at 49.98, but still below
      the ask, so it is not marketable and simply waits. A second trader who
      wants the position now posts a limit buy at 50.05: since 50.05 sits
      above the 50.02 ask, the order is marketable and fills immediately at
      50.02, the actual best ask, not at the 50.05 the order was willing to
      pay — the limit price was only ever a worst case.
    interview: >
      "Marketable limit or market order — what's the difference?" wants the
      worst-case-price distinction stated precisely: both get filled
      essentially immediately, but only the marketable limit protects you if
      the book moves against you between when you send it and when it
      arrives.
    pitfalls: >
      Treating a marketable limit order as slower or worse than a plain
      market order misses that it fills at the same price with strictly less
      downside. Assuming the maker's rebate makes market making free money
      ignores that a maker only gets filled when doing so is least
      attractive.
    recap: >
      A limit order guarantees price and risks the fill; a market order
      guarantees the fill and risks the price; a marketable limit order gets
      the market order's certainty with a worst-case price attached.
    dialogue:
      - part: Two instructions for the same 600 shares
        teach: >
          You need to buy 600 shares. The book shows bids of 2000 shares at
          74.20, and asks of 300 shares at 74.24 and 500 shares at 74.27. You
          can tell the exchange one of two things. X: "buy 600 at 74.21 and
          wait." Y: "buy 600 now, at whatever the asks are."
      - ask: >
          What does instruction X guarantee you?
        choices:
          - text: >
              That you will be filled soon, since 74.21 is only three cents
              below the best ask.
            feedback: >
              Nothing makes a seller come down to 74.21. If the price drifts
              up from here, X sits in the book unfilled all day — closeness to
              the ask is not a promise.
          - text: >
              That any share you do buy costs at most 74.21.
            correct: true
            feedback: >
              X is a promise about price and nothing else. It becomes the new
              best bid, ahead of the 2000 at 74.20, and it fills only if a
              seller decides to trade with it.
          - text: >
              That you buy at 74.24 once the ask queue empties.
            feedback: >
              X never pays 74.24; that is above its price. It trades only when
              an incoming seller crosses down to it.
        feedback: >
          X waits in the bid queue. Its price is certain and its fill is not.
      - ask: >
          Instruction Y walks the ask queue from the top. What is the highest
          price you pay for any share?
        expects: "74.27"
        feedback: >
          300 shares at 74.24 clear the first level, and the remaining
          $600 - 300 = 300$ come from the 74.27 level. Y is certain to be
          filled; the price is whatever the queue holds.
      - ask: >
          In the milliseconds before Y arrives, the 300 shares at 74.24 are
          cancelled and 1000 shares are offered at 74.40 behind the 74.27
          level. Now what is the highest price Y pays?
        expects: "74.40"
        hint: >
          The front level is now 74.27 for 500 shares.
        feedback: >
          500 shares at 74.27, then the last 100 at 74.40. You said "at
          whatever the asks are", and the asks moved. Y guaranteed the fill and
          promised nothing about the price.
      - reflect: >
          You want Y's immediacy but refuse to pay more than 74.30 for any
          share. Using only a price and the rules of the book, how would you
          write the instruction, and what happens to the shares it cannot buy
          at 74.30 or less?
        answer: >
          Send a buy limit order at 74.30. Because 74.30 is above the best ask,
          it does not wait: it trades immediately against every ask at or below
          74.30, from the front, exactly as Y would. When the asks at or below
          74.30 run out it stops, and what is left rests in the bid queue at
          74.30. You keep Y's speed with a worst case attached.

      - part: Three orders, two guarantees
        teach: >
          The names. A limit order posts a price and rests until filled or
          cancelled: it guarantees the price and nothing about the fill, and
          because it adds to the book it *makes* liquidity. A market order
          takes the opposite queue as it stands: the fill is certain, the price
          is not, and it *takes* liquidity. A marketable limit order — a buy
          limit at or above $P_a$, a sell limit at or below $P_b$ — is a market
          order with a worst-case price, and is what professionals send.
      - ask: >
          In the changed book, you send a buy limit for 600 at 74.30. 500
          shares fill at 74.27. What happens to the other 100?
        choices:
          - text: >
              They buy from the 74.40 level, since the order is marketable.
            feedback: >
              Marketable means it trades with what is available at or below
              74.30. 74.40 is beyond the limit, and the limit is the whole
              point.
          - text: >
              They are cancelled automatically.
            feedback: >
              That is a separate instruction, immediate-or-cancel, that you can
              attach. A plain limit order keeps its unfilled part in the book.
          - text: >
              They rest at 74.30 and become the new best bid.
            correct: true
            feedback: >
              The leftover is now an ordinary limit order, the highest bid in
              the book, waiting for a seller. A single order took liquidity and
              then made it.
        feedback: >
          A marketable limit behaves as a market order down to its price and
          as a resting limit order after that.
      - ask: >
          Back in the original book, bid 74.20 and ask 74.24. The exchange
          charges a taker 0.30 cents a share and pays a maker a 0.20-cent
          rebate. A taker buys 100 shares at the ask. Measured from the mid,
          how many cents per share does the taker give up, fee included?
        expects: "2.3"
        tolerance: 0.001
        hint: >
          The mid is halfway between 74.20 and 74.24.
        feedback: >
          The mid is 74.22, so buying at 74.24 costs 2 cents a share against
          it, plus the 0.30-cent fee: $2 + 0.3 = 2.3$ cents. The maker who sold
          at 74.24 earns the same 2 cents plus the 0.20 rebate, 2.2 cents.

      - part: Why not always wait
        ask: >
          The maker in that trade earned 2.2 cents a share for patience. Why
          doesn't everyone simply post limit orders and collect it?
        choices:
          - text: >
              Rebates are too small to cover a maker's technology costs.
            feedback: >
              Costs matter, but they are not the reason a patient trader with
              no costs still loses. The problem is *which* fills arrive.
          - text: >
              A maker is filled only when someone else chooses to trade with
              it, which is often exactly when the price is about to move
              through it.
            correct: true
            feedback: >
              A buyer lifted the 74.24 ask. If that buyer knew the price was
              heading to 74.33, the maker is now short at 74.24 and its 2.2
              cents becomes a loss of 8.8. The taker picks the moment; the
              maker only picks the price.
          - text: >
              Limit orders are slower to process than market orders.
            feedback: >
              Exchanges process both in the same matching pass. The cost of
              waiting is not latency in the engine; it is not knowing whether,
              or when, you will be filled.
        feedback: >
          The taker pays the spread for immediacy; the maker earns it and
          accepts that its fills are chosen by someone else.
      - ask: >
          A trader posts a buy limit at 73.00 in this book "to guarantee a
          good price". What has the guarantee bought?
        choices:
          - text: >
              Almost nothing: the price is guaranteed only on fills that will
              probably never come.
            correct: true
            feedback: >
              1.20 below the best bid, the order fills only after a large fall,
              and then it fills at precisely the moment buying is unwelcome.
              A limit price far from the market is a guarantee about an event
              that rarely happens.
          - text: >
              A cheap entry: buying at 73.00 instead of 74.24 saves 1.24 a
              share.
            feedback: >
              Only if it fills. The saving is counted on shares the order may
              never buy; the honest comparison weighs it by the chance of a
              fill.
          - text: >
              Priority over the 2000 shares bid at 74.20.
            feedback: >
              The opposite: a lower bid sits further back in the bid queue. The
              74.20 buyers are all ahead of it.
        feedback: >
          Every order picks one guarantee: the price or the fill. In an
          interview, say which one you are buying and what the other one costs
          you.

  - node: quant-finance.microstructure.walking-the-book
    hook: >
      This is the arithmetic that turns "I want 500 shares" into an actual
      average price, and it's the single most common numeric question this
      unit produces.
    explanation: >
      Walking the book is mechanical: an incoming marketable order consumes
      the opposite queue from the front, one level at a time, paying that
      level's price for however many shares it has, until the order is
      filled or the book runs out. The average price paid is a size-weighted
      average across every level touched, not the price of any single level
      — which is why a large order rarely pays the quoted touch price.

      The gap between that average and the pre-trade mid is slippage, and it
      should be compared against the quoted half-spread, not the full spread
      — the half-spread is the cost a tiny order pays, so any order that
      walks past one level is already paying a multiple of that baseline.
      The comparison is the whole point of the exercise: it quantifies
      exactly how much size costs beyond the price you saw before sending
      the order.

      The book itself is left worse off. Once the front level of the queue
      is exhausted, the best price on that side moves to the next level
      back, so the spread widens and the next incoming order — however small
      — pays a wider spread than the one before it, purely as a mechanical
      consequence of the first order having consumed the level in front.
    worked: >
      Bid 29.98, asks 30.02 for 150 shares and 30.05 for 300. A market buy
      for 400 shares matches 150 shares at 30.02, then the remaining 250 at
      30.05: $150(30.02) + 250(30.05) = 4503 + 7512.5 = 12015.5$, an average
      of $12015.5/400 = 30.03875$. Pre-trade mid is $(29.98+30.02)/2 =
      30.00$, so slippage is $30.03875 - 30.00 = 0.03875$, nearly four cents
      a share against a quoted half-spread of only $0.02$. The book is left
      with 50 shares at 30.05 as the new best ask, so the spread widened
      from 0.04 to 0.07.
    interview: >
      "If you buy 400 shares against a thin ask, what do you actually pay?"
      wants the level-by-level match computed to an average price, then that
      average compared explicitly to the pre-trade half-spread — not just
      "more than the quote."
    pitfalls: >
      Pricing the whole order at the touch price ignores every level past
      the first. Comparing slippage to the full spread instead of the
      half-spread understates how much worse a walked fill is than a
      passive one.
    recap: >
      A marketable order pays a size-weighted average across every level it
      consumes, and that average can be several multiples of the quoted
      half-spread once it walks past the first.
    dialogue:
      - part: Selling 800 shares into three bids
        teach: >
          You hold 800 shares and must sell them now with a market order. The
          bid queue shows 200 shares at 18.60, 300 at 18.58 and 1000 at 18.55;
          the best ask is 18.64.
      - ask: >
          How many dollars do you receive for the 800 shares, in total?
        expects: "14859"
        tolerance: 0.01
        hint: >
          Fill the 18.60 level completely, then the 18.58 level, then take
          whatever is still needed from 18.55.
        feedback: >
          200 at 18.60 gives 3720, 300 at 18.58 gives 5574, and the last
          $800 - 200 - 300 = 300$ at 18.55 give 5565: $3720 + 5574 + 5565 =
          14859$ dollars.
      - ask: >
          A colleague, glancing at the screen, had estimated
          $800 \times 18.60 = 14880$. What did that estimate assume?
        choices:
          - text: >
              That the best bid will rise while the order executes.
            feedback: >
              The estimate assumes no change at all, not a rise. Its error is
              about how much sits at the best bid, not about where the price
              goes.
          - text: >
              That all 800 shares rest at the best bid.
            correct: true
            feedback: >
              Only 200 do. The other 600 trade at worse levels, which costs
              $14880 - 14859 = 21$ dollars against the estimate.
          - text: >
              That the order is a limit order rather than a market order.
            feedback: >
              A limit sell at 18.60 would sell 200 shares and rest the other
              600 unfilled — it would not receive 14880 either. The estimate's
              flaw is depth, not order type.
        feedback: >
          The best bid is a price for the shares resting there, and no more.
      - ask: >
          What average price per share did you receive?
        expects: "18.57375"
        tolerance: 0.0005
        feedback: >
          $14859 / 800 = 18.57375$. It is a size-weighted average of the three
          levels — weights $200, 300, 300$ — and it sits nearer 18.55 than any
          glance at the top of the book suggests.
      - reflect: >
          You want one number that says how much the *size* of this order cost
          you. A 10-share sell would have paid only the ordinary cost of
          trading immediately. What would you measure the 18.57375 against, so
          that the tiny order's cost is the baseline — and why not against the
          best bid of 18.60?
        answer: >
          Measure against the pre-trade mid, 18.62: it is the fair value of a
          share before you touched the book, and a tiny order sold at 18.60
          pays exactly the half-spread, 2 cents, against it. Your slippage is
          the mid minus your average, and comparing it with the half-spread
          shows what size added. The best bid is not a neutral benchmark — it
          already includes a seller's half of the spread, so measuring from it
          hides the cost every order pays.

      - part: Slippage, measured honestly
        teach: >
          What you did is walking the book: a marketable order consumes the
          opposite queue level by level, paying each level's price for that
          level's shares, and its average price is the size-weighted average
          over every level touched. The cost of size is the slippage, the gap
          between that average and the pre-trade mid, set against the quoted
          half-spread that the smallest order pays.
      - ask: >
          What is your slippage, in cents per share?
        expects: "4.625"
        tolerance: 0.001
        feedback: >
          The mid is $(18.60 + 18.64)/2 = 18.62$, so the slippage is
          $18.62 - 18.57375 = 0.04625$, 4.625 cents a share — about 2.3 times
          the 2-cent half-spread a 10-share order would have paid.
      - ask: >
          What is the total slippage on the 800 shares, in dollars?
        expects: "37"
        tolerance: 0.01
        feedback: >
          $800 \times 0.04625 = 37$ dollars. Of that, $800 \times 0.02 = 16$ is
          the half-spread any immediate seller pays, and the other 21 dollars is
          what depth cost you — the same 21 dollars the colleague's estimate
          missed.

      - part: The book you leave behind
        ask: >
          After your order, what is the quoted spread, in cents?
        expects: "9"
        hint: >
          Two bid levels have vanished. Which level is now at the front, and
          was the ask side touched?
        feedback: >
          The 18.60 and 18.58 levels are empty, so the best bid is 18.55, with
          700 shares left. The ask is still 18.64: spread
          $18.64 - 18.55 = 0.09$, nine cents where it had been four.
      - ask: >
          To soften the cost, a trader proposes splitting the 800 into two
          market orders of 400, sent a microsecond apart. Compared with one
          order of 800, what happens?
        choices:
          - text: >
              It halves the slippage, since each order is half the size.
            feedback: >
              The first 400 walk 18.60 and 18.58 and stop at 18.58 with 100
              left there; the second 400 start from that thinned book and take
              those 100 at 18.58, then 300 at 18.55. Every share fills at
              exactly the price it did before.
          - text: >
              It costs exactly the same: the second order walks the levels the
              first one emptied.
            correct: true
            feedback: >
              A microsecond gives the book no time to refill, so the two halves
              consume the same 800 shares of depth at the same 14859 total.
              Splitting only helps when new resting orders arrive between the
              pieces.
          - text: >
              It costs more, because each order pays the half-spread
              separately.
            feedback: >
              The half-spread is not a fee charged per order; it is built into
              the prices of the levels you fill against. The same shares at the
              same prices cost the same.
        feedback: >
          Depth consumed is depth gone until someone replaces it. Waiting long
          enough for the book to refill is where execution schedules begin.
      - teach: >
          Said aloud in an interview: fill level by level, add the cash, divide
          by the size, then compare the average with the pre-trade mid and
          quote it as a multiple of the half-spread — "4.6 cents of slippage
          against a 2-cent half-spread, and the spread is left at nine cents
          for the next seller."

  - node: quant-finance.microstructure.mid-price
    hook: >
      The mid is the number every other metric in this unit gets measured
      against, and "effective" versus "realized" spread is exactly the
      distinction between what you paid and what you actually kept.
    explanation: >
      The mid $P_m = (P_b + P_a)/2$ is a convention, not a tradeable price —
      nobody can transact at it — but it's the cleanest available mark for
      the value of an open position, since it sits equidistant from both
      live quotes. The quoted spread $s = P_a - P_b$ is the round-trip cost
      implied by that convention: buy at the ask, immediately sell at the
      bid, and you've paid exactly $s$.

      Two refinements matter because real fills rarely happen at the quoted
      spread. The effective spread of a fill at price $P$ is $2|P - P_m|$,
      using the mid at the moment the order arrived — it equals the quoted
      spread for a fill at the touch, but grows past it the moment the order
      walks the book, since walking pays a price further from the mid than
      the touch. The realized spread instead compares the fill to the mid
      some minutes later, once the trade's information has had time to move
      the market: for shares a maker bought at price $P$ it is $2(P_m' -
      P)$, where $P_m'$ is that later mid.

      Effective minus realized is what a maker actually gave away rather
      than kept — the part of the spread that got handed to whoever was on
      the other side of the trade because the market moved against the
      maker's fill. That gap is price impact, and it's the bridge between a
      static spread number and the dynamic cost of trading.
    worked: >
      Quoted spread is 0.06: bid 49.97, ask 50.03, mid 50.00. A seller hits
      the bid, and the maker buys 100 shares at 49.97 — a fill right at the
      touch, so the effective spread is $2|49.97 - 50.00| = 0.06$, matching
      the quote exactly. Five minutes later the mid has drifted down to 49.99.
      The realized spread is $2(49.99 - 49.97) = 0.04$. Effective minus
      realized is $0.06 - 0.04 = 0.02$ — two cents per share that went to
      the seller as the price kept moving in the direction their trade
      predicted.
    interview: >
      "Your effective spread was six cents but you only realized four —
      where did the other two go?" wants price impact named directly as the
      gap, not treated as an unexplained loss.
    pitfalls: >
      Using the mid at the time you measure, instead of the mid at order
      arrival, breaks the effective-spread calculation. Forgetting that
      realized spread needs a deliberately chosen horizon — too short and
      it's mostly noise, too long and other news has moved the mid for
      unrelated reasons.
    recap: >
      Effective spread is what a fill actually cost against the mid at the
      time; realized spread is what's left once the market has settled; the
      difference between them is price impact.
    dialogue:
      - part: Two buyers and one fair value
        teach: >
          The book shows bid 36.40 and ask 36.46. Two traders each buy 1000
          shares. Ann sends a small marketable order and fills entirely at the
          36.46 ask. Bo sends his order a moment later into a thinner book; it
          walks several levels and averages 36.49.
      - ask: >
          Take the halfway point between the two quotes as the fair value of a
          share. How many cents per share above it did Bo pay?
        expects: "6"
        feedback: >
          Halfway is $(36.40 + 36.46)/2 = 36.43$, so Bo paid
          $36.49 - 36.43 = 0.06$, six cents a share over fair value. Ann paid
          three.
      - ask: >
          The quoted spread is also 6 cents. A colleague concludes that Bo
          "paid exactly the quoted spread". What is wrong with that?
        choices:
          - text: >
              Nothing: both numbers are 6 cents.
            feedback: >
              They are 6 cents of different things. The quoted spread is what
              buying at the ask and then selling at the bid costs — two trips.
              Bo's 6 cents is one trip, from fair value to his fill.
          - text: >
              The quoted spread is a round-trip cost; Bo's 6 cents is one way.
              On the same footing Bo paid twice the quoted spread.
            correct: true
            feedback: >
              Ann's one-way 3 cents is half the quoted spread, so a fill at the
              touch costs half the spread each way. Bo's 6 cents one way is the
              cost of a 12-cent spread.
          - text: >
              Bo's cost should be measured from the bid he could resell at, so
              it is 9 cents.
            feedback: >
              Measuring from the bid charges Bo for a sale he has not made. The
              question is what his purchase cost, and the neutral reference
              for that is the halfway point.
        feedback: >
          A cost and a spread are only comparable once both describe the same
          trip.
      - reflect: >
          Build a measure of one fill's cost that equals the quoted spread
          exactly when the fill is at the touch, and grows when the order walks
          the book. Which reference price must it use — the one before the
          order, or the one after — and what does it give for Bo?
        answer: >
          Twice the distance from the fill to the halfway point,
          $2|P - P_m|$, with the halfway point read *when the order arrived*.
          Ann's fill gives $2(0.03) = 0.06$, the quoted spread; Bo's gives
          $2(0.06) = 0.12$. The arrival reference matters because the order
          itself moves the quotes — measure from the quotes after Bo's sweep
          and his cost shrinks by exactly the damage he did.

      - part: Mid, quoted spread, effective spread
        teach: >
          The names. The mid $P_m = (P_b + P_a)/2$ is the conventional mark for
          an open position — no one trades at it, but it is the same distance
          from both quotes. The quoted spread $s = P_a - P_b$ is what a round
          trip of market orders costs. The effective spread of a fill at $P$ is
          $2|P - P_m|$ with the mid at order arrival, and exceeds $s$ whenever
          the order walked the book.
      - ask: >
          In the same 36.40 / 36.46 book, a seller walks the bid queue and
          averages 36.36. What is the effective spread of that fill, in cents?
        expects: "14"
        feedback: >
          $2|36.36 - 36.43| = 2(0.07) = 0.14$, fourteen cents — more than twice
          the quoted 6. The absolute value is why the same formula serves a
          sell and a buy.

      - part: What the maker kept
        ask: >
          Back to Ann. The maker who sold her 1000 shares at 36.46 checks the
          mid ten minutes later: it is 36.45. Doubling it as before, how many
          cents per share of spread did the maker keep, measured against that
          later mid?
        expects: "2"
        hint: >
          The maker sold at 36.46 and could now buy back near 36.45.
        feedback: >
          $2(36.46 - 36.45) = 0.02$, two cents. At the moment of the fill the
          maker was 3 cents a share above the mid; ten minutes later only 1
          cent of that is left.
      - ask: >
          Ann's fill had an effective spread of 6 cents; the maker kept 2. Where
          did the other 4 go?
        choices:
          - text: >
              To exchange fees.
            feedback: >
              No fee appears anywhere in these numbers. The 4 cents is visible
              in the quotes alone: the mid moved.
          - text: >
              To Ann: the mid rose from 36.43 to 36.45, in the direction of her
              buy, so part of what she paid came back to her as a gain.
            correct: true
            feedback: >
              The mid moved 2 cents toward Ann's trade, worth $2 \times 2 = 4$
              cents in spread terms. That gap is price impact — the part of the
              spread the maker handed to the other side.
          - text: >
              Nowhere: it is noise and averages out over many fills.
            feedback: >
              Some of it is noise, but if mids systematically drift toward the
              taker after a maker's fills, it does not average out. That
              systematic drift is the reason makers measure it.
        feedback: >
          The realized spread compares the fill with a later mid — for shares a
          maker bought at $P$ it is $2(P_m^{\text{later}} - P)$, for shares it
          sold $2(P - P_m^{\text{later}})$. Effective minus realized is price
          impact: here $6 - 2 = 4$ cents.
      - ask: >
          On another fill the maker bought at the 36.40 bid, and ten minutes
          later the mid is 36.34. Its realized spread is
          $2(36.34 - 36.40) = -0.12$. What does a negative realized spread say?
        choices:
          - text: >
              The formula has been applied with the wrong sign.
            feedback: >
              For a maker's purchase the later mid minus the fill price is the
              right order: it is the gain from buying at $P$ and marking at the
              later mid. That gain is $-6$ cents a share, doubled to $-12$.
          - text: >
              The maker lost money on the fill: the price moved through its
              bid by more than the half-spread it earned.
            correct: true
            feedback: >
              The mid fell 9 cents, three times the 3-cent half-spread. Effective
              6, realized $-12$, so price impact was 18 cents — this seller knew
              something.
          - text: >
              The maker paid the spread instead of earning it.
            feedback: >
              The maker still filled at the bid, so at the moment of the trade
              it earned the half-spread. What it lost came afterwards, from the
              move.
        feedback: >
          The realized spread is the maker's report card; negative means its
          counterparty was right.
      - ask: >
          A desk wants its realized spread to measure adverse moves caused by
          its counterparties. Which horizon buries that signal under news that
          has nothing to do with the fill?
        choices:
          - text: >
              Five minutes after each fill.
            feedback: >
              A common choice: long enough for the trade's information to show
              up in the mid, short enough that most unrelated news has not.
          - text: >
              One millisecond after each fill.
            feedback: >
              This one fails the other way: the mid has barely had time to
              react, so realized nearly equals effective and impact looks like
              zero. A bias, not a burial under unrelated news.
          - text: >
              The next day's close.
            correct: true
            feedback: >
              By then the mid reflects a day of unrelated news, so the realized
              spread is mostly noise about the market, not information about
              the fill.
        feedback: >
          The horizon is a modelling choice: say what it is whenever you quote a
          realized spread.

  - node: quant-finance.microstructure.microprice
    hook: >
      This is the single number every serious quoting system centres on
      instead of the plain mid, because the plain mid ignores the most
      obviously informative thing on the screen: which side has more size
      resting.
    explanation: >
      The microprice reweights the mid by the size sitting on each side:
      $P_{\text{micro}} = \dfrac{Q_b P_a + Q_a P_b}{Q_b + Q_a}$, where $Q_b$
      and $Q_a$ are the shares resting at the best bid and best ask. Notice
      the weights are crossed — the bid size multiplies the ask price and
      vice versa — so a heavy bid pulls the estimate toward the ask, and a
      heavy ask pulls it toward the bid.

      The mental model is a wall. A thousand shares resting on the bid is a
      thousand shares that must be bought before the price can fall through
      that level, which makes the level a wall against downward movement and
      makes the ask, comparatively, the cheaper direction for price to move.
      A thin ask sitting on top of a thick bid is easy to lift, so the true
      value of the instrument sits closer to that thin ask than the
      arithmetic mid would suggest.

      This isn't just a story — the microprice is empirically a better
      one-tick-ahead forecast of where the mid moves than the mid itself,
      because it's using information, the resting sizes, that the mid throws
      away entirely. That's the reason a market maker centres its own quotes
      on the microprice rather than the mid: quoting off a worse forecast is
      a way to get picked off by anyone using the better one.
    worked: >
      Bid 400 shares at 19.98, ask 1600 shares at 20.02 — the heavy side is
      the ask this time. The mid is $(19.98+20.02)/2 = 20.00$. The
      microprice is $(400(20.02) + 1600(19.98))/2000 = (8008 +
      31968)/2000 = 39976/2000 = 19.988$. The heavy ask pulls the fair value
      down toward the bid, to 19.988, twelve tenths of a cent below the
      plain mid.
    interview: >
      "Why would you ever quote off something other than the mid?" wants
      the crossed-weighting formula and the wall intuition — heavy size
      resists price moving through it — not just "it's more accurate."
    pitfalls: >
      Weighting the bid price by the bid size instead of the opposite
      side's size inverts the formula and gives the wrong tilt entirely.
      Treating the microprice as a tradeable price rather than a fair-value
      estimate confuses it with the mid it's meant to improve on.
    recap: >
      The microprice weights each quote by the opposite side's size, so a
      heavy bid pulls fair value toward the ask and a heavy ask pulls it
      toward the bid — and it forecasts the next mid better than the mid
      does.
    dialogue:
      - part: A lopsided book
        teach: >
          The best bid is 25.10 with 4500 shares resting; the best ask is 25.12
          with 500. The mid is 25.11. In a second or two one of the two levels
          will empty and the mid will tick.
      - ask: >
          Which way is the next tick of the mid more likely to go?
        choices:
          - text: >
              Neither: the mid is exactly halfway, so up and down are equally
              likely.
            feedback: >
              The mid uses the two prices and throws away the two sizes. To
              tick up, buyers must take 500 shares; to tick down, sellers must
              take 4500. Those are not the same hurdle.
          - text: >
              Down: 4500 shares of buyers waiting means buyers are passive, and
              passive sides lose.
            feedback: >
              Resting bids are a wall the price has to eat through before it
              can fall. Nine times as much must trade at 25.10 as at 25.12
              before that level empties.
          - text: >
              Up: the ask is far thinner, so it is far more likely to empty
              first.
            correct: true
            feedback: >
              500 shares lifted clears the ask; 4500 sold is needed to clear
              the bid. The thin side is the cheap side to move through.
        feedback: >
          The sizes at the touch say something the mid cannot.
      - ask: >
          Take a crude model: the chance that the ask empties first equals the
          bid's share of the resting size, $Q_b/(Q_b + Q_a)$. What is that
          chance here?
        expects: "0.9"
        feedback: >
          $4500/(4500 + 500) = 0.9$. In this model the mid ticks up nine times
          in ten.
      - ask: >
          Say the price is worth 25.12 if the ask empties first and 25.10 if
          the bid does. What is its expected value?
        expects: "25.118"
        tolerance: 0.0005
        feedback: >
          $0.9(25.12) + 0.1(25.10) = 22.608 + 2.510 = 25.118$ — nine tenths of
          the way from the bid to the ask, against a mid of 25.11.
      - reflect: >
          Write that expected value as one formula in $P_b$, $P_a$, $Q_b$ and
          $Q_a$. Which size ends up multiplying which price, and why is that
          the right way round?
        answer: >
          $(Q_b P_a + Q_a P_b)/(Q_b + Q_a)$: the *bid* size multiplies the
          *ask* price and the other way round. A big bid is a wall against a
          fall, so it makes the ask the likely destination and should pull
          the estimate toward the ask. The weights are crossed because each
          side's size votes for the opposite quote.

      - part: The microprice
        teach: >
          That number is the microprice:
          $P_{\text{micro}} = \dfrac{Q_b P_a + Q_a P_b}{Q_b + Q_a}$, with $Q_b$
          and $Q_a$ the displayed sizes at the best bid and ask. The heavy side
          pulls it toward the far quote. Empirically it forecasts the next mid
          better than the mid does, without needing the crude model above to be
          literally true — which is why a maker centres its quotes on it.
      - ask: >
          A new book: bid 63.05 for 300 shares, ask 63.08 for 900. What is the
          microprice?
        expects: "63.0575"
        tolerance: 0.0005
        hint: >
          The 300 shares on the bid multiply the ask price.
        feedback: >
          $(300(63.08) + 900(63.05))/1200 = (18924 + 56745)/1200 = 63.0575$.
          The heavy ask pulls it down from the 63.065 mid toward the bid.
      - ask: >
          A colleague computes $(300(63.05) + 900(63.08))/1200$ instead. What
          do they get, and what has gone wrong?
        choices:
          - text: >
              63.0725 — a correct alternative convention for the same idea.
            feedback: >
              It is not a convention; it points the wrong way. It lands near
              the heavy ask, saying the price is likely to rise through 900
              shares rather than fall through 300.
          - text: >
              63.0725, above the mid: weighting each price by its own size
              tilts toward the heavy side, the opposite of the wall argument.
            correct: true
            feedback: >
              $(18915 + 56772)/1200 = 63.0725$. Own-side weights flip the tilt,
              so this is the single most common error with the formula.
          - text: >
              63.065, the mid: the sizes cancel out.
            feedback: >
              Sizes cancel only when they are equal. With 300 against 900 the
              weighted average moves well off the mid — the question is which
              way.
        feedback: >
          Check the direction before the arithmetic: heavy bid, estimate near
          the ask; heavy ask, estimate near the bid.

      - part: What it cannot see
        ask: >
          Same book, bid 63.05 for 300 and ask 63.08 for 900, but one tick
          below the bid sit 60000 shares bid at 63.04. How should you read the
          microprice of 63.0575 now?
        choices:
          - text: >
              With suspicion: it reads only the two best levels, so the huge
              bid one tick back is invisible to it.
            correct: true
            feedback: >
              The touch says "down is cheap", but a fall stops one cent later
              against a 60000-share wall. The microprice is a touch statistic;
              depth behind the touch needs a richer model.
          - text: >
              As exact: deeper levels never trade, so they carry no
              information.
            feedback: >
              Deeper levels trade whenever an order walks the book, and they
              say how far a move can run. Ignoring them is a simplification,
              not a fact about markets.
          - text: >
              As wrong: the microprice must use the total size on each side.
            feedback: >
              That is one possible extension, but the defined microprice uses
              the touch sizes on purpose — they are what changes the next tick.
              The point is to know what it leaves out.
        feedback: >
          The microprice is a one-tick forecast from two numbers on the screen
          — cheap, informative, and blind past the touch.
      - ask: >
          You are a maker in the 25.10 / 25.12 book from the start. Around which
          price should you centre your bid and ask?
        choices:
          - text: >
              25.11, the mid, so you are fair to both sides.
            feedback: >
              Fair to the mid is unfair to you: centred at 25.11 your ask is the
              cheap thing on the screen, and anyone reading the sizes will lift
              it just before the tick up.
          - text: >
              25.118, the microprice.
            correct: true
            feedback: >
              Quoting off the better forecast is how you avoid being picked off
              by those who use it. In an interview: "heavy bid, thin ask — fair
              value sits nine tenths of the way up, so I lean my quotes up."
          - text: >
              25.12, the ask, since the price is about to tick up.
            feedback: >
              A tick up is likely, not certain: one time in ten the bid empties
              first. The expected value, 25.118, is what you centre on.
        feedback: >
          Centre on the microprice, then set the spread around it.

  - node: quant-finance.microstructure.queue-imbalance
    hook: >
      This is the single feature every desk computes first, because it's
      free — it needs nothing but the top of book — and it decays in
      seconds, which tells you exactly what kind of edge it is.
    explanation: >
      Define the imbalance $I = (Q_b - Q_a)/(Q_b + Q_a)$, a number in
      $[-1, 1]$ that summarizes which side of the book is heavier without
      reference to either price. Substituting the definitions of $Q_b$ and
      $Q_a$ back into the microprice formula and simplifying algebraically
      turns it into a tilt of the mid: $P_{\text{micro}} = P_m +
      \dfrac{s}{2} I$, with $s$ the quoted spread. The microprice, in other
      words, is nothing but the mid pushed toward the heavy side by at most
      half the spread.

      That "at most" matters. Because $I$ is bounded in $[-1, 1]$, the tilt
      $\frac{s}{2}I$ is bounded in $[-s/2, s/2]$, which means the microprice
      can never leave the interval between the bid and the ask — however
      lopsided the book gets, the fair-value estimate stays inside the
      quotes that produced it, a useful sanity check on any implementation.

      Reading it directly: $I$ near $+1$ says the bid is far heavier than
      the ask, which the mental model from the previous node reads as the
      next tick being more likely to move up; $I$ near $-1$ reads the
      opposite. The catch is that this signal is the cheapest one in all of
      microstructure to compute, which means everyone computes it, which
      means it decays within seconds of a level changing — trading on it
      well is a speed contest against other systems reading the identical
      number, not a source of durable insight.
    worked: >
      Same book as the microprice example — bid 400 at 19.98, ask 1600 at
      20.02. Imbalance is $I = (400-1600)/2000 = -0.6$, and the spread is
      $s = 20.02 - 19.98 = 0.04$. The tilt formula gives $P_m + (s/2)I =
      20.00 + 0.02(-0.6) = 20.00 - 0.012 = 19.988$ — exactly the microprice
      computed directly, confirming the two formulas agree.
    interview: >
      "What's the cheapest predictive signal you know?" is answered with
      queue imbalance, and the interviewer is listening for the
      bounded-tilt algebra and the honest caveat that it's a speed contest,
      not a research edge.
    pitfalls: >
      Forgetting the bound $I \in [-1,1]$ leads to computing a tilt that
      could push the microprice outside the quotes, which is impossible and
      signals an arithmetic error. Treating imbalance as a stable
      forecasting edge, rather than one that decays in seconds against
      competitors reading the same top-of-book data, overstates what it's
      worth.
    recap: >
      Queue imbalance rewrites the microprice as the mid tilted by at most
      half the spread — a free, instant, and extremely short-lived signal.
    dialogue:
      - part: Three books with the same lean
        teach: >
          Book A: bid 47.20 for 700 shares, ask 47.24 for 300. The mid is
          47.22.
      - ask: >
          What is Book A's microprice?
        expects: "47.228"
        tolerance: 0.0005
        feedback: >
          $(700(47.24) + 300(47.20))/1000 = (33068 + 14160)/1000 = 47.228$,
          0.8 cents above the mid, toward the thin ask.
      - ask: >
          Book B has the same prices, 47.20 and 47.24, but ten times the size:
          7000 bid and 3000 offered. Where is its microprice?
        choices:
          - text: >
              Further toward the ask, since 4000 more shares are bid than
              offered instead of 400.
            feedback: >
              Every size is multiplied by $10$, numerator and denominator alike,
              so the tenfold factor cancels. The microprice responds to the
              sizes' proportions, not their difference.
          - text: >
              At 47.228, the same as Book A.
            correct: true
            feedback: >
              The weights are $0.7$ and $0.3$ in both books. Only the split of
              the resting size between the sides matters.
          - text: >
              Closer to the mid, since deep books are more stable.
            feedback: >
              Depth may make the book stabler in some loose sense, but the
              formula has no term for it: scaling both sizes by ten leaves every
              weight unchanged.
        feedback: >
          Whatever drives the tilt, it is a function of the sizes' ratio.
      - ask: >
          Book C keeps 700 bid and 300 offered but widens the quotes to 47.20
          and 47.30. How many cents above its mid is its microprice?
        expects: "2"
        tolerance: 0.001
        hint: >
          The microprice is $(700(47.30) + 300(47.20))/1000$; the mid is
          47.25.
        feedback: >
          $(33110 + 14160)/1000 = 47.27$, two cents above the 47.25 mid. Same
          lean as Book A, two and a half times the spread, two and a half
          times the tilt.
      - reflect: >
          The tilt was 0.8 cents in Book A and 2 cents in Book C, with the same
          sizes. It looks like a product of two things. What is the piece that
          depends only on the prices, and what is the piece built only from
          $Q_b$ and $Q_a$ that equals $0.4$ in both books?
        answer: >
          The price piece is the half-spread, $s/2$: 2 cents in A, 5 in C. The
          size piece is the imbalance $(Q_b - Q_a)/(Q_b + Q_a) =
          (700 - 300)/1000 = 0.4$. Then $0.02(0.4) = 0.008$ and
          $0.05(0.4) = 0.02$, matching both books, and a ratio of sizes is
          exactly what survived the tenfold scaling in Book B.

      - part: The tilt, and its ceiling
        teach: >
          Define the queue imbalance $I = (Q_b - Q_a)/(Q_b + Q_a)$. The claim
          is that the microprice is always the mid tilted by it:
          $P_{\text{micro}} = P_m + \dfrac{s}{2} I$, with $s$ the quoted spread.
          $I$ near $+1$ leans toward an up-tick, near $-1$ toward a down-tick.
      - ask: >
          Substitute $P_a = P_m + s/2$ and $P_b = P_m - s/2$ into
          $(Q_b P_a + Q_a P_b)/(Q_b + Q_a)$. What makes the result collapse to
          $P_m$ plus a tilt?
        choices:
          - text: >
              The weights $Q_b/(Q_b + Q_a)$ and $Q_a/(Q_b + Q_a)$ add to $1$, so
              the $P_m$ terms combine to $P_m$ and only $\frac{s}{2}(Q_b - Q_a)$
              over the total remains.
            correct: true
            feedback: >
              That is the whole proof:
              $(Q_b + Q_a)P_m/(Q_b + Q_a) + \frac{s}{2}(Q_b - Q_a)/(Q_b + Q_a)$.
              A weighted average of $P_m \pm s/2$ is $P_m$ plus the weighted
              average of $\pm s/2$.
          - text: >
              The spread cancels, because $P_a - P_b = s$.
            feedback: >
              The spread survives — it is the scale of the tilt. What cancels
              is the total size, once the two $P_m$ terms are gathered.
          - text: >
              It only works when $Q_b = Q_a$.
            feedback: >
              When $Q_b = Q_a$ the identity holds with $I = 0$, but nothing in
              the substitution needs it; Books A and C both had $I = 0.4$.
        feedback: >
          The microprice is a weighted average of two points $s/2$ either side
          of the mid, so it is the mid plus a tilt.
      - ask: >
          However lopsided the book, can the microprice lie above the best ask?
        choices:
          - text: >
              Yes, when the bid is enormous relative to the ask.
            feedback: >
              An enormous bid drives $I$ toward $1$, never past it, since
              $|Q_b - Q_a| \le Q_b + Q_a$. The tilt tops out at $s/2$, landing
              exactly on the ask.
          - text: >
              No: $I \in [-1, 1]$, so the tilt is at most $s/2$ and the
              microprice stays in $[P_b, P_a]$.
            correct: true
            feedback: >
              The bound on $I$ is a bound on the forecast. That makes it a free
              sanity check on any implementation.
          - text: >
              Only if the book is crossed.
            feedback: >
              A crossed book is not a working state of the market, and the
              question needs no such case: the bound on $I$ settles it.
        feedback: >
          The microprice is a weighted average of the two quotes, so it lives
          between them.

      - part: Reading a new book, and a broken one
        ask: >
          A cheap stock shows bid 9.87 for 250 shares and ask 9.88 for 2250.
          What is the queue imbalance $I$?
        expects: "-0.8"
        feedback: >
          $(250 - 2250)/(250 + 2250) = -2000/2500 = -0.8$. The ask is the
          heavy side, so the lean is down.
      - ask: >
          Using the tilt, what is its microprice?
        expects: "9.871"
        tolerance: 0.0005
        feedback: >
          $P_m = 9.875$, $s/2 = 0.005$, so $9.875 + 0.005(-0.8) = 9.871$ — four
          tenths of a cent below the mid, still inside 9.87 to 9.88.
      - ask: >
          A colleague's code reports a microprice of 9.835 for that book, below
          the bid. What is the most likely bug?
        choices:
          - text: >
              Nothing: a heavy ask can push fair value below the bid.
            feedback: >
              The tilt is bounded by $s/2$, half a cent here, so nothing can
              push the estimate below 9.87. A value outside the quotes is always
              a bug.
          - text: >
              The imbalance was divided by $Q_b$ instead of $Q_b + Q_a$.
            correct: true
            feedback: >
              $(250 - 2250)/250 = -8$, and $9.875 + 0.005(-8) = 9.835$. The
              wrong denominator broke the bound on $I$, and the bound was the
              only thing keeping the estimate between the quotes.
          - text: >
              The tilt used the full spread instead of half of it.
            feedback: >
              That doubles the tilt to $0.01(-0.8) = -0.008$, giving 9.867 —
              wrong, but nowhere near 9.835. Recompute the candidates rather
              than guessing.
        feedback: >
          When the microprice leaves $[P_b, P_a]$, check that $I$ left
          $[-1, 1]$ first.
      - ask: >
          Backtests show that a positive $I$ is followed by an up-tick
          60 percent of the time. Why is this not a durable trading edge?
        choices:
          - text: >
              The 60 percent is too close to a coin flip to matter.
            feedback: >
              Ten points of edge on the next tick is a lot in a business that
              runs on millions of ticks. The problem is not the size of the
              signal; it is who else has it.
          - text: >
              Every desk computes $I$ from the same top of book, and the signal
              decays in seconds, so its profit goes to whoever acts first.
            correct: true
            feedback: >
              The cheapest feature in microstructure is also the most crowded.
              Trading on it is a speed contest, not a research edge.
          - text: >
              Queue imbalance only works in stocks with wide spreads.
            feedback: >
              It works best in narrow, one-tick names, where the sizes carry
              most of the information. Its weakness is crowding, not the
              spread.
        feedback: >
          In an interview: "the microprice is the mid plus half the spread
          times the imbalance — bounded by the quotes, free to compute, and
          gone in seconds."

  - node: quant-finance.microstructure.spread-components
    hook: >
      Ask "why is there a spread at all" and most candidates say "profit,"
      which is the wrong altitude — the real answer sorts into three
      separate costs, and only one of them survives competition.
    explanation: >
      A maker's spread has to cover three distinct costs, each with a
      different economic character. Adverse selection: some counterparties
      simply know more about where the price is heading, and trading
      against them is bad news about value baked directly into the fact of
      the fill. Inventory risk: the cost of the position a fill leaves
      behind — variance the maker carries until it can be unwound, at a
      scale set by size and volatility. Order processing: fees, technology,
      and the opportunity cost of capital tied up quoting.

      The three behave completely differently under competition. A hundred
      well-capitalized makers all quoting the same instrument will underbid
      each other on processing costs and on inventory-risk premium — anyone
      charging more than the true cost of either just loses the trade to a
      competitor charging less — until both are driven toward the bare
      minimum. Adverse selection can't be competed away the same way,
      because it isn't a cost any individual maker controls; it's a property
      of the flow itself, and every maker facing the same informed
      counterparty pays the same tax regardless of how thin their margins
      are on everything else.

      This is exactly why Glosten–Milgrom can derive a strictly positive
      spread with zero inventory, zero fees, and a risk-neutral maker: strip
      away the two competable costs entirely and adverse selection alone is
      enough. Empirically, for liquid US equities, roughly half of the
      effective spread traces to adverse selection, and that fraction climbs
      with volatility and around scheduled news, exactly when informed
      trading is most concentrated.
    worked: >
      A name quotes a 4-cent spread, but typical fills get a cent of price
      improvement inside the quote, so the effective spread is 3 cents. If
      adverse selection accounts for roughly half of that,
      about 1.5 cents of every fill's cost is the informed-flow tax, leaving
      the remaining 1.5 cents split between inventory-risk premium and
      processing. A rival maker with cheaper technology and lower fees can
      compete the processing sliver toward zero, but can't touch the 1.5
      cents of adverse selection without changing who it's trading against.
    interview: >
      "Walk me through what a bid–ask spread is actually compensating for"
      wants all three components named, plus the specific claim that
      competition erodes two of them but not the third — not a vague "the
      market maker needs to make money."
    pitfalls: >
      Attributing the whole spread to inventory risk misses that a maker
      who never holds inventory overnight, or hedges instantly, still faces
      a positive spread. Assuming more competitors always narrows the
      spread ignores that adverse selection is a floor competition can't
      push through.
    recap: >
      A spread pays for informed flow, for the risk of the inventory a fill
      creates, and for the plumbing — competition erodes the last two but
      never the first.
    dialogue:
      - part: A maker's ledger that will not balance
        teach: >
          You make a market in a stock, quoting 20.00 bid and 20.04 offered, so
          every share you trade earns 2 cents against the 20.02 mid. Exchange
          fees, technology and the capital you tie up cost you 0.4 cents a
          share.
      - ask: >
          Counting only those two numbers, how many cents do you net per share
          filled?
        expects: "1.6"
        tolerance: 0.001
        feedback: >
          $2 - 0.4 = 1.6$ cents. On paper a comfortable business.
      - ask: >
          After a month the desk is losing money. The data: five minutes after
          each of your fills, the mid has moved against you by 1.8 cents on
          average — down after you buy, up after you sell. Marking each fill
          five minutes later, what do you net per share now?
        expects: "-0.2"
        tolerance: 0.001
        feedback: >
          $2 - 0.4 - 1.8 = -0.2$ cents. The 1.6 cents on paper was earned at
          the moment of each fill and mostly given back in the minutes after.
      - ask: >
          Why does the mid keep moving against you after your fills?
        choices:
          - text: >
              Noise: over enough fills it averages to zero.
            feedback: >
              Noise has mean zero. A move of 1.8 cents *against you on average*
              is systematic — it is there in the mean, which is exactly what a
              month of fills measures.
          - text: >
              Some of the traders hitting your quotes know where the price is
              going, so being filled is itself bad news.
            correct: true
            feedback: >
              The seller who hits your bid just before a fall chose the moment;
              you only chose the price. That is adverse selection: the fill
              carries information, and it is information against you.
          - text: >
              Your quotes are too wide, so traders avoid you until the price
              moves.
            feedback: >
              Width changes how often you are hit, not which way the price goes
              afterwards. The drift is about who trades with you.
        feedback: >
          The 1.8 cents is a cost of quoting, as real as the fees — it just
          arrives after the trade instead of on the invoice.
      - ask: >
          A rival with the same flow and cheaper plumbing, 0.1 cents a share,
          wants to undercut you. Ignoring inventory, what is the smallest
          half-spread, in cents, at which it breaks even?
        expects: "1.9"
        tolerance: 0.001
        hint: >
          The rival's half-spread must cover its costs and the post-fill drift.
        feedback: >
          It needs $h - 0.1 - 1.8 \ge 0$, so $h = 1.9$ cents. Its cheaper
          plumbing bought it 0.3 cents of room; the 1.8 cents of drift it
          inherits whole.
      - reflect: >
          Now imagine fees and technology fall to nothing and twenty
          well-capitalised rivals all quote this stock. Which parts of the
          half-spread get competed away, which part cannot be, and what is the
          difference in kind between them?
        answer: >
          The plumbing cost is a cost of the maker: whoever runs leaner can
          charge less, so competition drives it toward the true minimum. A
          premium for holding inventory is competed down the same way by
          whoever carries risk most cheaply. The drift is different: it is a
          property of the flow, not of the maker, and every maker facing the
          same informed traders pays the same 1.8 cents. No amount of
          efficiency removes it, so it sets a floor under the spread.

      - part: Three costs, one floor
        teach: >
          The spread recovers three costs. Adverse selection: some
          counterparties know more, so a fill is bad news about value.
          Inventory risk: a fill leaves a position with variance until it is
          unwound. Order processing: fees, technology, tied-up capital. Only
          the first survives competition among many well-capitalised makers.
          In liquid US equities it is roughly half the effective spread.
      - ask: >
          A desk measures its fills in another stock: the effective spread
          averages 6 cents and the realized spread, five minutes out, averages
          3 cents. What fraction of the effective spread is going to informed
          counterparties?
        expects: "0.5"
        tolerance: 0.001
        hint: >
          Effective minus realized is price impact — the part handed to the
          other side.
        feedback: >
          $6 - 3 = 3$ cents of price impact out of 6, a fraction of $0.5$ —
          right at the rough empirical half. The realized 3 cents is what is
          left to pay for inventory and processing, and any profit.
      - ask: >
          A stock reports earnings in two minutes. Which component of its
          spread jumps the most?
        choices:
          - text: >
              Order processing, because the exchange is busier.
            feedback: >
              Fees are per share and technology costs barely move minute to
              minute. A busy exchange does not change what one share costs to
              process.
          - text: >
              Adverse selection: the chance that the trader hitting you has a
              better read on the number is at its highest.
            correct: true
            feedback: >
              Makers widen sharply or step away before scheduled news, because
              the share of informed flow — and the size of what it knows —
              spikes.
          - text: >
              Inventory risk only, since volatility is about to rise.
            feedback: >
              It rises too: the variance of a position held for a few seconds
              grows with volatility. But the jump before news is about who is
              trading, not just how much the price moves — a maker that holds
              nothing for even a second still faces it.
        feedback: >
          Adverse selection rises with volatility and peaks around scheduled
          news, exactly when informed trading concentrates.

      - part: Where the floor disappears
        ask: >
          In which of these could competition drive the spread almost all the
          way to the processing cost?
        choices:
          - text: >
              A small-cap stock that few analysts follow.
            feedback: >
              Thin coverage means the few who do research know far more than
              the maker. That is a high adverse-selection floor, not a low one.
          - text: >
              A large-cap stock on the morning of a central-bank decision.
            feedback: >
              Liquid, yes, but on a news morning the information asymmetry is
              at its peak. The floor rises.
          - text: >
              A token redeemable at any time for exactly 1.00, with the
              redemption guaranteed and public.
            correct: true
            feedback: >
              Nobody can know more about its value than anyone else, so a fill
              carries no bad news. With adverse selection gone, only the
              competable costs remain, and competition grinds them down.
        feedback: >
          The floor under a spread is the information in the flow. Take the
          information away and the spread is just plumbing.
      - teach: >
          This is also why Glosten–Milgrom can price a spread with no
          inventory, no fees and a risk-neutral maker: strip out the two
          competable costs and adverse selection alone keeps the bid below the
          ask. Said aloud: "three costs — informed flow, inventory, plumbing —
          and only the first survives competition."

  - node: quant-finance.microstructure.glosten-milgrom
    hook: >
      This is the theorem behind "quote a market maker's ask as what the
      asset is worth given someone wants to buy it" — the load-bearing idea
      the whole unit's pricing logic sits on.
    explanation: >
      The setup formalizes exactly the informed-flow story from the
      previous node. An asset has unknown value $V$ with some public prior.
      Each arriving trader is informed with probability $\mu$ — in which
      case they know $V$ exactly and trade whichever side is profitable,
      buying if $V$ exceeds the ask, selling if $V$ is below the bid — or
      uninformed with probability $1-\mu$, trading a coin flip regardless of
      $V$. Trades are one unit at a time, the maker is risk-neutral, and
      competition among makers drives expected profit per trade to exactly
      zero.

      The proof idea is pure Bayes: zero expected profit at a risk-neutral
      maker means each quote must equal the conditional expectation of $V$
      given the very fact that this quote is about to be traded against.
      $P_a = \mathbb{E}[V \mid \text{next trade is a buy}]$ and $P_b =
      \mathbb{E}[V \mid \text{next trade is a sell}]$ — the quotes aren't
      estimates of $V$ in general, they're estimates of $V$ conditioned on
      being hit. A buy is more likely when $V$ is high, since that's exactly
      when informed traders buy, so conditioning on a buy shifts the
      posterior up; symmetric logic shifts the sell-conditioned posterior
      down.

      The conclusion is $P_b < \mathbb{E}[V] < P_a$: a strictly positive
      spread falls out with no inventory cost, no fee, and no risk aversion
      anywhere in the model. That's the whole point — it isolates adverse
      selection as sufficient on its own, exactly the claim the previous
      node made about which of the three components survives competition.
    worked: >
      $V$ is 120 or 80, each with probability 1/2, so $\mathbb{E}[V] =
      100$, with $\mu = 0.4$ informed. $\Pr(\text{buy} \mid V=120) = 0.4 +
      0.6(0.5) = 0.7$ and $\Pr(\text{buy} \mid V=80) = 0.6(0.5) = 0.3$, so
      $\Pr(\text{buy}) = 0.5$ and $\Pr(V=120 \mid \text{buy}) =
      0.5(0.7)/0.5 = 0.7$. The ask is $0.7(120) + 0.3(80) = 108$, and by
      symmetry the bid is $92$ — a spread of $16$, exactly $\mu$ times the
      range $120-80=40$.
    interview: >
      "Derive a bid–ask spread from pure information asymmetry, no
      inventory, no costs" is answered by stating the zero-profit
      condition, converting it into the two conditional expectations, and
      naming that a buy is evidence $V$ is high — not by citing the result
      without the Bayes step.
    pitfalls: >
      Quoting $P_a$ as the unconditional $\mathbb{E}[V]$ instead of the
      buy-conditioned expectation drops the entire mechanism. Forgetting
      that the zero-expected-profit condition is what pins the quotes to
      exact conditional expectations, rather than some arbitrary markup,
      breaks the derivation.
    recap: >
      Quote the ask at the expected value given someone is about to buy,
      and the bid at the expected value given someone is about to sell —
      asymmetric information alone forces those two numbers apart.
    dialogue:
      - part: Quoting at fair value, and losing
        teach: >
          You are the only market maker in a contract worth either 60 or 40,
          equally likely; everyone knows that much. Each trader who arrives is,
          with probability $0.3$, informed — knows the value and trades only
          when it pays — and otherwise is a noise trader who buys or sells one
          unit on a coin flip. You start by quoting 50 bid, 50 offered: fair
          value on both sides.
      - ask: >
          An informed trader arrives. What is your profit on the trade, in
          either state of the world?
        expects: "-10"
        feedback: >
          If the value is 60 they buy from you at 50: you lose 10. If it is 40
          they sell to you at 50: you lose 10. An informed trader only trades
          when you are wrong, so you lose 10 every time.
      - ask: >
          A noise trader nets you zero on average at these quotes. What is your
          expected profit per arriving trader?
        expects: "-3"
        feedback: >
          $0.3(-10) + 0.7(0) = -3$. Quoting at the unconditional fair value is a
          steady loss: the informed take money from you and the noise traders
          give none back.
      - ask: >
          You decide to quote 48 bid, 52 offered instead. What does that fix,
          and what does it leave open?
        choices:
          - text: >
              It fixes nothing, since the informed still know more than you.
            feedback: >
              It fixes something: each noise trader now pays you 2, and each
              informed one takes 8 instead of 10. Whether you break even
              depends on the width — which is the open question.
          - text: >
              It charges the noise traders something to cover the informed, but
              the number 2 is a guess — nothing yet says which width breaks
              even.
            correct: true
            feedback: >
              Per trader: $0.7(2) + 0.3(-8) = 1.4 - 2.4 = -1$. Still losing.
              Widening is the right instinct; the right width needs a rule.
          - text: >
              It fixes the loss: a 4-wide market is more than the informed
              traders' edge.
            feedback: >
              The informed edge is $60 - 52 = 8$ per trade, not something a
              4-wide market covers. Per trader you lose
              $0.3(8) - 0.7(2) = 1$.
        feedback: >
          Widening transfers money from noise traders to cover informed ones.
          The question is how much.
      - reflect: >
          Think about the moment a buyer lifts your ask. Does the fact that
          someone chose to buy tell you anything about the value? Use that to
          say what the ask must be for buys, on average, to break even.
        answer: >
          A buy is more likely when the value is 60, since that is when the
          informed buy, so being lifted is evidence the value is high. If the
          ask equals the expected value *given that the trade is a buy*, then
          averaged over the buys you actually get, the price you receive
          equals what you give away: zero expected profit. The ask is a
          posterior mean, conditioned on being hit.

      - part: Quotes as conditional expectations
        teach: >
          Glosten–Milgrom. Suppose each trader is informed with probability
          $\mu$ and otherwise buys or sells with probability $1/2$, trades are
          one unit, and competition holds a risk-neutral maker to zero expected
          profit per trade. Then
          $P_a = \mathbb{E}[V \mid \text{next trade is a buy}]$ and
          $P_b = \mathbb{E}[V \mid \text{next trade is a sell}]$, and because a
          buy raises the posterior and a sell lowers it,
          $P_b < \mathbb{E}[V] < P_a$.
      - ask: >
          Back to the contract with $\mu = 0.3$. What is
          $\Pr(\text{buy} \mid V = 60)$?
        expects: "0.65"
        tolerance: 0.001
        hint: >
          Two kinds of trader buy when the value is 60.
        feedback: >
          The informed always buy, and the noise traders buy half the time:
          $0.3 + 0.7(0.5) = 0.65$. When $V = 40$ only the noise traders buy:
          $0.35$.
      - ask: >
          What is $\Pr(V = 60 \mid \text{buy})$?
        expects: "0.65"
        tolerance: 0.001
        hint: >
          Bayes' rule, with $\Pr(\text{buy}) = 0.5(0.65) + 0.5(0.35)$.
        feedback: >
          $\Pr(\text{buy}) = 0.5$, so the posterior is $0.5(0.65)/0.5 = 0.65$.
          One buy moves the probability of the high value from $0.5$ to
          $0.65$.
      - ask: >
          What is the Glosten–Milgrom ask?
        expects: "53"
        tolerance: 0.001
        feedback: >
          $0.65(60) + 0.35(40) = 39 + 14 = 53$. By the mirror argument the bid
          is $0.35(60) + 0.65(40) = 47$: a spread of 6, which is $\mu$ times the
          range, $0.3 \times 20$.
      - ask: >
          Why must zero expected profit put the ask *exactly* at
          $\mathbb{E}[V \mid \text{buy}]$, rather than anywhere above
          $\mathbb{E}[V]$?
        choices:
          - text: >
              Above $\mathbb{E}[V \mid \text{buy}]$ the maker profits on average
              and a rival undercuts; below it, the maker loses on the buys it
              gets. Only equality survives both.
            correct: true
            feedback: >
              At 53, a buy loses 7 when the value is 60 and gains 13 when it is
              40: $0.65(-7) + 0.35(13) = 0$. Competition supplies one side of
              the squeeze and survival the other.
          - text: >
              Any ask above $\mathbb{E}[V]$ already earns a profit, so any such
              ask works.
            feedback: >
              52 is above $\mathbb{E}[V] = 50$ and still loses, as you
              computed. Being above the unconditional mean is not enough; the
              relevant mean is the one conditioned on being lifted.
          - text: >
              Because the maker is risk-neutral, so it sets every price at an
              expected value.
            feedback: >
              Risk neutrality says the maker cares only about the mean, but it
              does not say *which* mean. The zero-profit condition on buys is
              what selects the buy-conditioned one.
        feedback: >
          The quote is not an estimate of the value; it is an estimate of the
          value given that someone takes it.

      - part: Breaking the hypotheses
        ask: >
          Keep everything but set $\mu = 0$: no one is informed. What is the
          Glosten–Milgrom spread?
        expects: "0"
        feedback: >
          With no informed traders, $\Pr(\text{buy} \mid V)$ is $0.5$ in both
          states, a buy carries no information, and both quotes equal
          $\mathbb{E}[V] = 50$. In this model the spread is entirely a price
          for information.
      - ask: >
          Now set $\mu = 1$: everyone is informed. What happens?
        choices:
          - text: >
              The spread is 20: bid 40, ask 60.
            correct: true
            feedback: >
              A buy is now proof the value is 60, so the ask is 60, and the bid
              is 40. At those quotes no informed trader ever profits, so no one
              trades. The market quotes and is empty.
          - text: >
              The spread is 6, as before, because the range has not changed.
            feedback: >
              The spread is $\mu$ times the range here; at $\mu = 1$ that is
              the whole 20. A wider share of informed flow widens it all the
              way.
          - text: >
              The maker stops quoting because it has no expected-value
              estimate.
            feedback: >
              It has a perfectly good estimate: a buy means 60, a sell means 40.
              The problem is that quotes at the truth leave no one a reason to
              trade.
        feedback: >
          At $\mu = 1$ the market breaks down. Noise traders are what pay for
          a market to exist: their losses on the spread fund the informed
          traders' gains.
      - ask: >
          Who, in this model, pays the 6-point spread on average?
        choices:
          - text: >
              The maker, as the cost of providing liquidity.
            feedback: >
              The maker earns zero expected profit by construction. It is a
              conduit, not a payer.
          - text: >
              The informed traders, since they trade most aggressively.
            feedback: >
              They are the ones being paid: on average each informed trade
              takes value from the maker.
          - text: >
              The noise traders: they cross a spread priced to cover the
              informed.
            correct: true
            feedback: >
              Each noise trade loses 3 to the spread on average, and that
              exactly funds what the informed take. In an interview: "the
              uninformed pay the spread; the maker breaks even; the spread is
              the price of the information in the flow."
        feedback: >
          No inventory, no fees, no risk aversion — and still $P_b < P_a$.
          Adverse selection alone is enough for a spread.

  - node: quant-finance.microstructure.gm-worked
    hook: >
      This is the computation you should be able to run in your head, fast,
      the moment an interviewer gives you two possible values and an
      informed fraction.
    explanation: >
      The procedure has four steps, and it's the same four steps regardless
      of the numbers. First, find the probability of a buy conditional on
      each value of $V$: informed traders buy only at the high value,
      uninformed traders buy half the time regardless, so
      $\Pr(\text{buy}\mid V_{\text{high}}) = \mu + (1-\mu)/2$ and
      $\Pr(\text{buy}\mid V_{\text{low}}) = (1-\mu)/2$. Second, average
      those over the prior on $V$ to get the unconditional $\Pr(\text{buy})$
      — with a symmetric fifty-fifty prior this always comes out to exactly
      one half, since the informed traders' extra buying at the high value
      is mirrored by extra selling at the low value.

      Third, apply Bayes' rule to get $\Pr(V_{\text{high}} \mid
      \text{buy})$, which with a fifty-fifty prior and $\Pr(\text{buy})=1/2$
      simplifies to just $\Pr(\text{buy} \mid V_{\text{high}})$ itself — the
      posterior probability of the high value given a buy equals the
      conditional probability of a buy given the high value, a coincidence
      of the symmetric setup worth recognizing so you don't recompute Bayes
      from scratch under time pressure. Fourth, the ask is that posterior
      probability times $V_{\text{high}}$ plus its complement times
      $V_{\text{low}}$, and the bid is the mirror image.

      The pattern that falls out every time, worth memorizing directly:
      with a symmetric two-point prior, the spread always equals $\mu$
      times the full range $V_{\text{high}} - V_{\text{low}}$. Checking that
      identity is the fastest way to catch an arithmetic slip
      mid-derivation.
    worked: >
      $V$ is 105 or 95 with probability 1/2 each, $\mu = 0.5$.
      $\Pr(\text{buy}\mid 105) = 0.5+0.5(0.5)=0.75$, $\Pr(\text{buy}\mid
      95)=0.5(0.5)=0.25$, so $\Pr(\text{buy})=0.5$ and
      $\Pr(V=105\mid\text{buy})=0.75$. Ask $=0.75(105)+0.25(95)=78.75+23.75=
      102.5$; by symmetry bid $=97.5$. Spread is $5$, matching $\mu \times
      \text{range} = 0.5 \times 10 = 5$ exactly.
    interview: >
      Expect the numbers to change every time — the interviewer is testing
      whether you re-derive the four steps cold, not whether you remember
      one answer. Naming the spread-equals-informed-fraction-times-range
      shortcut and then verifying it against your own arithmetic is what
      separates fluency from a memorized result.
    pitfalls: >
      Applying the posterior-equals-conditional shortcut when the prior on
      $V$ isn't fifty-fifty gives the wrong answer — that simplification
      depends on the symmetric setup. Rounding the intermediate conditional
      buy probabilities before the final multiplication compounds error
      into the quoted spread.
    recap: >
      Four steps — conditional buy probabilities, average to the
      unconditional, Bayes to the posterior, weight the two values by it —
      always land on a spread equal to the informed fraction times the
      value range.
    dialogue:
      - part: Quote me a market
        teach: >
          The interviewer says: a stock is worth 75 or 45, equally likely. A
          quarter of the people who trade it know which, and buy if it is 75
          or sell if it is 45; everyone else buys or sells on a coin flip.
          You are a competitive, risk-neutral maker. Quote me a market.
      - ask: >
          First sub-step. What is $\Pr(\text{buy} \mid V = 75)$?
        expects: "0.625"
        tolerance: 0.0005
        hint: >
          The informed always buy at 75; the other three quarters buy half the
          time.
        feedback: >
          $0.25 + 0.75(0.5) = 0.625$. At $V = 45$ only the coin-flippers buy:
          $0.75(0.5) = 0.375$.
      - ask: >
          What is the unconditional $\Pr(\text{buy})$?
        expects: "0.5"
        tolerance: 0.0005
        feedback: >
          $0.5(0.625) + 0.5(0.375) = 0.5$. With an even prior the informed
          traders' extra buying at 75 is exactly mirrored by their extra
          selling at 45.
      - ask: >
          What is $\Pr(V = 75 \mid \text{buy})$?
        expects: "0.625"
        tolerance: 0.0005
        feedback: >
          Bayes: $0.5(0.625)/0.5 = 0.625$. With an even prior and
          $\Pr(\text{buy}) = 1/2$, the posterior equals the likelihood — a
          coincidence of symmetry worth spotting, and only of symmetry.
      - ask: >
          What is your ask?
        expects: "63.75"
        tolerance: 0.0005
        feedback: >
          $0.625(75) + 0.375(45) = 46.875 + 16.875 = 63.75$, the expected value
          given that the next trade is a buy.
      - ask: >
          And your bid?
        expects: "56.25"
        tolerance: 0.0005
        hint: >
          A sell is the mirror image: $\Pr(V = 75 \mid \text{sell}) = 0.375$.
        feedback: >
          $0.375(75) + 0.625(45) = 28.125 + 28.125 = 56.25$. The market is
          56.25 at 63.75, centred on the prior mean of 60.
      - reflect: >
          The spread came out 7.5, the range of values is 30, and a quarter of
          traders are informed. Guess the pattern, and say why an even prior
          makes it exact.
        answer: >
          The spread is $\mu$ times the range: $0.25 \times 30 = 7.5$. With an
          even prior the posterior after a buy is $1/2 + \mu/2$, so the ask
          sits $(\mu/2)$ of the range above the mean, and the bid sits the same
          distance below. The shortcut is a check on your arithmetic, not a
          replacement for it.

      - part: The four steps, as a routine
        teach: >
          The routine never changes. Conditional buy probabilities:
          $\mu + (1 - \mu)/2$ at the high value, $(1 - \mu)/2$ at the low.
          Average over the prior for $\Pr(\text{buy})$. Bayes for the
          posterior. Weight the two values by it for the ask, and mirror for
          the bid. Then check the spread against $\mu$ times the range —
          whenever the prior is even.
      - ask: >
          Change the prior: the stock is worth 75 with probability $0.2$ and 45
          with probability $0.8$, still with a quarter informed. A colleague
          says the posterior after a buy is still $0.625$, so the ask is still
          63.75. What has gone wrong?
        choices:
          - text: >
              Nothing: the buy probabilities given each value have not changed,
              so neither has the posterior.
            feedback: >
              The likelihoods have not changed, but the posterior is likelihood
              times prior over $\Pr(\text{buy})$. With a $0.2$ prior the ratio
              no longer comes out to the likelihood.
          - text: >
              The shortcut "posterior equals likelihood" needed the even prior;
              here $\Pr(\text{buy})$ is not $1/2$ and the prior is not $1/2$.
            correct: true
            feedback: >
              Run Bayes in full: $\Pr(\text{buy}) = 0.2(0.625) + 0.8(0.375) =
              0.425$, so the posterior is $0.125/0.425 = 5/17$, about
              $0.294$ — far below $0.625$.
          - text: >
              The ask should be the prior mean, 51, since the prior is lopsided.
            feedback: >
              The prior mean is 51, but a buy still carries information and
              lifts the estimate above it. The ask is a posterior mean, never
              the prior one.
        feedback: >
          Every shortcut in this computation rests on symmetry. Break the
          symmetry and only the four steps remain.
      - ask: >
          With the 0.2 prior, what is the ask?
        expects: "53.82"
        tolerance: 0.005
        hint: >
          The posterior is $5/17$; weight 75 by it and 45 by the rest.
        feedback: >
          $45 + (5/17)(30) = 45 + 150/17 = 915/17 \approx 53.82$. The ask still
          sits above the prior mean of 51, by about 2.82.
      - ask: >
          The bid in that market works out to $1125/23 \approx 48.91$. Does
          $\mu$ times the range still give the spread?
        choices:
          - text: >
              Yes: 7.5, as before.
            feedback: >
              $53.82 - 48.91 = 4.91$. The pattern held only because the prior
              was even.
          - text: >
              No: the spread is about 4.91, narrower than 7.5.
            correct: true
            feedback: >
              A lopsided prior makes the low value nearly certain, so there is
              less for informed traders to know and less for a trade to reveal.
              The shortcut's failure is the signal that the setup changed.
          - text: >
              No: the spread is wider, since the uncertainty is lopsided.
            feedback: >
              Compute it: $53.82 - 48.91 = 4.91$, which is narrower. Variance
              of a two-point prior with $p = 0.2$ is smaller than with
              $p = 0.5$.
        feedback: >
          Use $\mu$ times the range only with an even prior, and use it as a
          check.

      - part: After the first trade
        ask: >
          Back in the even market quoting 56.25 at 63.75, a buy arrives. Your
          belief that the value is 75 moves to $0.625$. What is your new
          estimate of the value?
        expects: "63.75"
        tolerance: 0.0005
        feedback: >
          $0.625(75) + 0.375(45) = 63.75$: the new mean is the old ask. That
          was the ask's definition — the value given a buy — so after a buy
          you re-centre on it and requote both sides around the new belief.
          A run of buys walks the price toward 75; the spread is the toll the
          uninformed pay for that discovery.

  - node: quant-finance.microstructure.inventory-risk
    hook: >
      A maker who is long doesn't value the position at the mid, and the
      number that says exactly how far off the mid it is worth is the one
      thing every skewing decision in this unit is built on.
    explanation: >
      A maker accumulates inventory $q$ purely as a byproduct of getting
      filled — positive when filled buying more than selling, negative the
      other way — and every share of it carries market risk until it's
      unwound. Over a remaining horizon $\tau$ with per-share variance
      $\sigma^2$ per unit time, the variance of the position's value is
      $q^2 \sigma^2 \tau$: quadratic in size, because both the number of
      shares exposed and the correlation between them scale together.

      A mean–variance maker with risk aversion $\gamma$ doesn't price its
      book at the mid, it prices at the reservation price $r = P_m -
      q\gamma\sigma^2\tau$ — the price at which it is genuinely indifferent
      to trading one more share given the risk it's already carrying. Being
      long shifts $r$ below the mid: an already-long maker values an
      additional share less than an outside observer would, because that
      share adds risk without adding anything to offset it. Being short
      shifts $r$ above the mid by the mirror-image logic.

      The formula is worth reading term by term rather than memorizing
      whole: bigger position, bigger shift; more volatile asset, bigger
      shift; more risk-averse maker, bigger shift; longer remaining horizon
      before the position can be unwound, bigger shift. Set any one of
      those to zero and the reservation price collapses back to the plain
      mid — inventory risk only exists because all four are simultaneously
      nonzero.
    worked: >
      Short 3000 shares, per-share daily $\sigma = 0.25$ so $\sigma^2 =
      0.0625$, horizon $\tau = 0.2$ of a day, risk aversion $\gamma =
      0.001$. The shift is $q\gamma\sigma^2\tau = (-3000)(0.001)(0.0625)
      (0.2) = -0.0375$, so $r = P_m - (-0.0375) = P_m + 0.0375$ — being
      short pushes the reservation price about 3.75 cents above the mid.
    interview: >
      "You're short 3000 shares — what's your fair value now, and why isn't
      it the mid?" wants the reservation-price formula stated and the sign
      reasoned through explicitly, not just "I'd adjust it a little."
    pitfalls: >
      Using the sign convention backwards — shifting a long position's
      reservation price up instead of down — inverts every skewing decision
      built on top of it. Forgetting the quadratic dependence on $q$ and
      treating risk as merely proportional to position size understates how
      fast a second fill compounds the danger.
    recap: >
      A maker's true indifference price is the mid shifted by position
      times risk aversion times variance times remaining time — long shifts
      it down, short shifts it up.
    dialogue:
      - part: Long 4000 shares, half a day to go
        teach: >
          You make markets in a stock whose mid is 52.30. The afternoon's fills
          have left you long 4000 shares, and you cannot unwind them for half a
          day. Over that half day, one share's price change has standard
          deviation 0.20.
      - ask: >
          What is the standard deviation of your position's value over the half
          day, in dollars?
        expects: "800"
        feedback: >
          Every share moves together, so the position moves 4000 times as much
          as one share: $4000 \times 0.20 = 800$ dollars.
      - ask: >
          If the fills had left you long 8000 instead, by what factor would the
          *variance* of the position grow?
        expects: "4"
        feedback: >
          The variance is $q^{2}\sigma^{2}\tau$, with $\sigma^{2}\tau = 0.04$
          here: doubling $q$ multiplies it by $4$. Risk grows faster than the
          position — the second 4000 shares are more dangerous than the first.
      - ask: >
          A seller offers you one more share at 52.29, a cent under the mid.
          Should you take it?
        choices:
          - text: >
              Yes: buying a cent below fair value is a cent of profit.
            feedback: >
              That is a risk-neutral desk's answer. You are not flat; the share
              lands on top of 4000 others and adds to a risk that is already
              growing with the square of the position.
          - text: >
              Never: a maker that is long should not buy.
            feedback: >
              A low enough price makes any share worth buying. The question is
              where that price is, not whether it exists.
          - text: >
              It depends on what the extra share adds to your risk, which
              depends on the 4000 you already hold.
            correct: true
            feedback: >
              The mid is a fair price for someone with no position. For you,
              the share's price has to cover the risk it adds — and the
              answer is not obvious until that risk has a price.
        feedback: >
          A maker with inventory needs a fair value of its own.

      - part: The price of one more share
        teach: >
          Your desk scores a position by its expected profit minus
          $(\gamma/2)$ times its variance, with risk aversion
          $\gamma = 10^{-4}$ per dollar. With $q$ shares the penalty is
          $(\gamma/2)q^{2}\sigma^{2}\tau$.
      - reflect: >
          Going from $q$ to $q + 1$ shares raises that penalty by about how
          much? Use it to say the most you should pay for one more share.
        hint: >
          How does $q^{2}$ change when $q$ goes up by one?
        answer: >
          $(q + 1)^{2} - q^{2} = 2q + 1 \approx 2q$, so the penalty rises by
          about $(\gamma/2)(2q)\sigma^{2}\tau = q\gamma\sigma^{2}\tau$. A share
          worth $P_m$ in expectation is worth only
          $P_m - q\gamma\sigma^{2}\tau$ to you, so that is the most you should
          pay — and, by the same argument, the least you should sell for.
      - teach: >
          That number is the reservation price, $r = P_m - q\gamma\sigma^{2}\tau$:
          the price at which a mean–variance maker holding $q$ is indifferent
          to trading one more share. Long ($q > 0$) pushes it below the mid,
          short pushes it above, and the shift grows with each of $q$,
          $\gamma$, $\sigma^{2}$ and $\tau$.
      - ask: >
          What is your reservation price, long 4000?
        expects: "52.284"
        tolerance: 0.0005
        feedback: >
          $q\gamma\sigma^{2}\tau = 4000(10^{-4})(0.04) = 0.016$, so
          $r = 52.30 - 0.016 = 52.284$.
      - ask: >
          So, the share offered at 52.29?
        choices:
          - text: >
              Take it: 52.29 is below the mid.
            feedback: >
              Below the mid, but above your reservation price of 52.284. To
              you, that share is worth 0.6 cents less than it costs.
          - text: >
              Decline: 52.29 is 0.6 cents above your reservation price.
            correct: true
            feedback: >
              At your position the share is worth 52.284 to you. A flat desk
              would take the trade; you should not.
          - text: >
              Take it only if the next tick is likely up.
            feedback: >
              A directional view would change the expected value, but none is
              in this model. On risk alone, the price is above what the share
              is worth to you.
        feedback: >
          The same trade is good for one desk and bad for another, depending on
          what each already holds.
      - ask: >
          How large a long position, in shares, puts your reservation price
          exactly one cent below the mid?
        expects: "2500"
        hint: >
          Solve $q\gamma\sigma^{2}\tau = 0.01$.
        feedback: >
          $q = 0.01/(10^{-4} \times 0.04) = 2500$. Past 2500 shares long, your
          fair value is more than a tick below the screen's.

      - part: When the shift vanishes, and when it flips
        ask: >
          Four desks are each long 4000 shares of this stock. Whose reservation
          price equals the mid?
        choices:
          - text: >
              The desk whose risk aversion is half of yours.
            feedback: >
              Half of $\gamma$ halves the shift to 0.8 cents; it does not
              remove it. Every factor in the product must matter.
          - text: >
              The desk that can hedge the whole position the instant it is
              filled.
            correct: true
            feedback: >
              With nothing held over any horizon, $\tau = 0$ and the shift
              $q\gamma\sigma^{2}\tau$ is zero. Inventory risk needs all four
              factors at once.
          - text: >
              The desk trading a stock half as volatile.
            feedback: >
              Half the standard deviation is a quarter of the variance, so the
              shift falls to 0.4 cents — smaller, not gone.
          - text: >
              The desk whose position is spread across many small fills.
            feedback: >
              How it was accumulated is irrelevant; 4000 shares long is
              4000 shares long. Only $q$ enters the formula.
        feedback: >
          Set any one of $q$, $\gamma$, $\sigma^{2}$, $\tau$ to zero and the
          reservation price is the mid.
      - ask: >
          A junior writes $r = P_m + q\gamma\sigma^{2}\tau$ and, long 4000,
          values the book at 52.316. What will their quoting do?
        choices:
          - text: >
              Buy more eagerly the longer they get, piling on the very risk the
              formula exists to shed.
            correct: true
            feedback: >
              With $r$ above the mid, buying at the mid looks cheap to them, so
              their bids get hit more and the position grows. A sign error here
              turns risk management into risk accumulation.
          - text: >
              Nothing different: the sign only matters for short positions.
            feedback: >
              The sign matters for every nonzero $q$. Long, the correct shift
              is down; the junior has pushed it up by the same amount.
          - text: >
              Sell more aggressively, which reduces the position faster.
            feedback: >
              A higher fair value makes selling look *worse*, not better: every
              sale at the mid is now 1.6 cents below what they think a share is
              worth.
        feedback: >
          Check the sign in words before using it: long means you want less,
          so each extra share is worth less to you.

  - node: quant-finance.microstructure.quote-skewing
    hook: >
      The moment your fills stop balancing, quoting symmetrically about the
      mid is actively wrong, and knowing exactly how far to lean is the
      difference between bleeding out a position for free and paying the
      spread to flatten it.
    explanation: >
      Once inventory is nonzero, centre the quotes on the reservation price
      from the previous node instead of the mid: post $r - \delta$ and $r +
      \delta$ for whatever half-spread $\delta$ the maker would otherwise
      use. Because $r$ already moved by $q\gamma\sigma^2\tau$ relative to
      the mid, both the bid and the ask move by that same amount, in the
      same direction — skewing is a parallel shift of the whole quote pair,
      not a change to its width.

      The mechanism is entirely about which side becomes more attractive to
      the market, not about the maker's belief. A short position shifts
      both quotes up: the bid becomes relatively more attractive to hit, so
      a seller is more likely to trade with the maker and thereby flatten
      the short, while the ask becomes relatively less attractive to lift,
      so the maker is less likely to be sold into further and extend the
      short. A long position does the mirror image, lowering both quotes so
      the ask entices a buyer to flatten it and the bid discourages
      extending it further.

      The economics of choosing to skew rather than cross the spread
      outright is the whole justification: skewing costs, at most, the size
      of the shift itself, since the maker is still quoting two-sided and
      still earning a spread on whichever side gets hit. Crossing the
      spread with an active market order to flatten immediately costs the
      full spread plus whatever impact that order generates — skewing is
      the same risk reduction achieved by leaning on the market to come to
      you instead of paying to go to it.
    worked: >
      Continuing the short-3000 example: mid is 50.00, reservation price
      $r = 50.0375$, and the maker's usual half-spread is $\delta = 0.02$.
      Symmetric quotes about the mid would be 49.98 / 50.02. Skewed about
      $r$ instead, they become $50.0375 - 0.02 = 50.0175$ and $50.0375 +
      0.02 = 50.0575$, rounded to 50.02 / 50.06 — both quotes 3.75 cents
      higher, making the bid at 50.02 the more attractive side for a seller
      to hit and flattening the short.
    interview: >
      "Why would you quote a market that isn't centred on your own fair
      value?" wants the two-step answer — reservation price shifts by the
      inventory term, then the whole pair moves with it — tied explicitly
      to which side the shift favours.
    pitfalls: >
      Widening the spread instead of shifting the whole pair changes how
      easy either side is to trade, not which side is favoured — it doesn't
      manage inventory the way a parallel shift does. Skewing in the wrong
      direction relative to the position's sign accelerates the very risk
      it's meant to reduce.
    recap: >
      Quote symmetrically about the reservation price, not the mid, so both
      quotes lean toward the trade that flattens the position — a parallel
      shift, not a change in width.
    dialogue:
      - part: Long 3000 and wanting out
        teach: >
          You quote a stock 31.48 bid, 31.52 offered around a 31.50 mid, a
          half-spread of 2 cents. A burst of selling has left you long 3000
          shares, and at that position your reservation price is 31.47. The
          other makers' bids rest at 31.48 for 1000 shares, 31.47 for 1000 and
          31.46 for 2000.
      - ask: >
          You could flatten at once with a market sell of 3000. Measured against
          the 31.50 mid, what does that cost, in dollars?
        expects: "90"
        hint: >
          Walk the bids: how many cents below the mid is each level, and how
          many shares fill there?
        feedback: >
          1000 shares at 2 cents under the mid, 1000 at 3 and 1000 at 4:
          $1000(0.02) + 1000(0.03) + 1000(0.04) = 20 + 30 + 40 = 90$ dollars —
          the spread, plus the depth you walk through.
      - ask: >
          Or you could keep quoting 31.48 / 31.52 and wait for buyers. What
          happens to your position, on average?
        choices:
          - text: >
              It shrinks, because your ask will eventually be lifted.
            feedback: >
              Your bid is just as likely to be hit. Symmetric quotes trade
              about as often on each side, so your position wanders; it does
              not drift back to zero.
          - text: >
              It random-walks around 3000: you are as likely to buy more as to
              sell.
            correct: true
            feedback: >
              Quotes centred on the mid treat a long maker exactly like a flat
              one. You keep earning the spread, and you keep carrying — and
              sometimes adding to — the risk you wanted to shed.
          - text: >
              It grows, since sellers have been active.
            feedback: >
              Recent selling is not, by itself, a forecast in this model. The
              problem is not a tilt in the flow but the absence of any tilt in
              your quotes.
        feedback: >
          Symmetric quotes do nothing about inventory; the market order does
          everything, at 90 dollars.
      - reflect: >
          You want buyers to take shares off you and sellers to stop giving you
          more, without paying to cross the spread. How would you move your two
          quotes, and around what centre?
        answer: >
          Move both quotes down by the same amount, centring them on the
          reservation price, 31.47, instead of the mid. A lower ask is more
          attractive to buyers, so you are lifted more often; a lower bid is
          less attractive to sellers, so you are hit less often. The width is
          unchanged — you still earn a spread on whatever trades — but the flow
          now leans toward flattening you.

      - part: Quoting around the reservation price
        teach: >
          That is inventory skew: quote $r - \delta$ and $r + \delta$, the usual
          half-spread around the reservation price
          $r = P_m - q\gamma\sigma^{2}\tau$. Long moves both quotes down by
          $q\gamma\sigma^{2}\tau$, short moves both up. It is a parallel shift
          of the pair, not a change in its width.
      - ask: >
          With $r = 31.47$ and $\delta = 0.02$, what is your new ask?
        expects: "31.49"
        tolerance: 0.0005
        feedback: >
          $31.47 + 0.02 = 31.49$, and the bid is $31.47 - 0.02 = 31.45$. Both
          quotes moved down 3 cents.
      - ask: >
          The other makers still quote 31.48 bid and 31.52 offered. With your
          quotes at 31.45 / 31.49, what changes?
        choices:
          - text: >
              Nothing: an order still goes to whichever maker has time
              priority.
            feedback: >
              Time priority only orders a single price level. At 31.49 you are
              alone at the best ask, ahead of everyone at 31.52 on price.
          - text: >
              You become the best offer and drop off the best bid, so the next
              buyer trades with you and the next seller does not.
            correct: true
            feedback: >
              The book itself now routes buyers to you and sellers elsewhere.
              Your inventory bleeds off through incoming flow.
          - text: >
              You will be hit on your bid, since it is the cheaper quote.
            feedback: >
              A seller wants the *highest* bid, and 31.45 is three cents below
              the others' 31.48. Your bid is the last place a seller goes.
        feedback: >
          The skew turns the order book into the mechanism that unwinds you.
      - ask: >
          Each share that leaves through your 31.49 ask is sold how many cents
          below the mid?
        expects: "1"
        feedback: >
          $31.50 - 31.49 = 0.01$, one cent — against 3 cents a share on average
          for the market order. Skewing costs at most the shift, here 3 cents
          less the 2-cent half-spread you still collect.
      - ask: >
          At a cent a share against three, why not skew every time and never
          cross?
        choices:
          - text: >
              Skewing is slower: you hold the risk until buyers arrive, and the
              price can move against you meanwhile.
            correct: true
            feedback: >
              The saving is paid for in time. When the position is large, the
              stock volatile or news imminent, the reservation price says how
              urgently — and sometimes the answer is to cross.
          - text: >
              Skewing costs more once the half-spread is counted.
            feedback: >
              You compute the opposite: skewed sales cost one cent against the
              mid, the market order three on average.
          - text: >
              Exchanges penalise quotes that move away from the mid.
            feedback: >
              No such rule exists; quotes move with every maker's inventory all
              day. The cost of skewing is waiting, not a penalty.
        feedback: >
          Skew first, and cross the spread when the risk of waiting outgrows
          the spread it saves.

      - part: Two ways to get it wrong
        ask: >
          A colleague, long the same 3000, widens instead: 31.44 bid, 31.56
          offered, centred on the mid. What does that do to the inventory?
        choices:
          - text: >
              It reduces the position, because wider quotes trade less.
            feedback: >
              Less trading means the position changes more slowly in both
              directions. Nothing favours the sale over the purchase.
          - text: >
              Nothing useful: both sides become less attractive equally, so the
              flow does not lean either way.
            correct: true
            feedback: >
              Width sets how often you trade; the centre sets which side
              trades. Inventory is managed by the centre.
          - text: >
              It flattens faster, since the ask is now farther from the bid.
            feedback: >
              31.56 is less attractive to buyers than 31.52 was. The colleague
              made the unwinding side worse, not better.
        feedback: >
          Skew is a shift, not a widening.
      - ask: >
          The burst had gone the other way, leaving you short 3000 with $r$
          three cents above the mid at 31.53. Quoting $\delta = 0.02$ around it,
          what is your bid?
        expects: "31.51"
        tolerance: 0.0005
        feedback: >
          $31.53 - 0.02 = 31.51$, three cents above the 31.48 the other makers
          bid: you are the best bid, a seller's first stop, which is the trade
          that covers your short. In an interview: "I re-centre on the
          reservation price and shift the whole pair toward the trade I want."

  - node: quant-finance.microstructure.market-impact
    hook: >
      This is the single number that caps how much capital any strategy can
      actually run, and the empirical fact behind it — that cost grows as a
      square root, not linearly — surprises most candidates the first time
      they see it.
    explanation: >
      Executing a large order moves the price against you, and the shape of
      that cost, replicated across markets, brokers and decades, is
      concave: it grows like $\sigma\sqrt{Q/V}$ for an order of $Q$ shares
      against a name with daily volume $V$ and daily volatility $\sigma$,
      with a fitted prefactor typically between 0.5 and 1. Two mechanisms
      sit underneath this single number, tying it back to earlier nodes in
      this unit — walking the book generates the immediate, mechanical
      piece of impact, while Glosten–Milgrom generates the part where the
      market simply re-marks the asset because a large trade looks like
      information.

      The square root is the operative fact, not a detail. Because cost per
      share scales with the square root of size, total cost scales with
      $Q^{3/2}$: quadruple the order and the cost per share only doubles,
      so the total dollar cost octuples rather than quadrupling the way a
      linear-cost model would predict. That concavity is exactly why size
      can be traded at all — a linear cost model would make any
      sufficiently large order prohibitively expensive per share, while the
      square-root law says each extra share adds less to the cost per share
      than the one before, even as the total bill grows faster than the
      order size.

      Worth stating plainly: there is no accepted first-principles
      derivation of the square root, only its empirical persistence across
      wildly different markets and eras. Treat it as a robust stylized fact
      to reason from, not as a theorem to prove from microstructure
      primitives — an interviewer asking why square root and not linear is
      testing whether you know this is an unsolved question, not expecting
      a derivation.
    worked: >
      An order is 4% of a day's volume ($Q/V = 0.04$) in a name with
      $\sigma = 3\%$ daily volatility and a fitted prefactor $Y = 0.7$.
      Cost is $\Delta p/p \approx Y\sigma\sqrt{Q/V} = 0.7(0.03)\sqrt{0.04} =
      0.7(0.03)(0.2) = 0.0042$, 42 basis points. Compare a quarter the
      size, $Q/V = 0.01$: $0.7(0.03)\sqrt{0.01} = 0.7(0.03)(0.1) = 0.0021$,
      21 basis points — quadrupling the order only doubled the per-share
      cost.
    interview: >
      "How does cost scale with order size?" wants the square-root law
      named directly, with the $Q^{3/2}$ consequence for total cost stated
      as the reason it caps strategy capacity — not a guess that cost is
      roughly proportional to size.
    pitfalls: >
      Assuming cost is linear in size badly overstates the cost of large
      orders and badly understates the cost of small ones relative to each
      other. Quoting the square-root law as a proven result rather than an
      empirical regularity with no accepted derivation misrepresents how
      solid the theory actually is.
    recap: >
      Impact per share grows like the square root of the fraction of daily
      volume traded, so total cost grows like size to the three-halves
      power — the reason size, not price, ultimately caps a strategy.
    dialogue:
      - part: A broker's records
        teach: >
          A broker's records for one stock, daily volatility 1.5 percent, give
          the average impact cost of orders by size, as a fraction of a day's
          volume. Orders of 0.25 percent of the day's volume cost 6 basis
          points; 1 percent cost 12; 4 percent cost 24.
      - ask: >
          If cost per share were proportional to order size, what would the 4
          percent order cost, in basis points, given the 0.25 percent figure?
        expects: "96"
        feedback: >
          4 percent is 16 times 0.25 percent, so a linear law predicts
          $16 \times 6 = 96$ basis points. The records say 24 — a quarter of
          that.
      - ask: >
          In the records, each time the order size quadruples, the cost per
          share multiplies by what factor?
        expects: "2"
        feedback: >
          6 to 12 to 24: each fourfold step in size doubles the cost per share.
      - reflect: >
          What function doubles when its argument quadruples? Write a candidate
          law for cost per share in terms of the fraction of daily volume,
          $Q/V$, and say what it implies for the very largest orders.
        answer: >
          The square root: $\sqrt{4x} = 2\sqrt{x}$. So cost per share is
          proportional to $\sqrt{Q/V}$, and here
          $6 = c\sqrt{0.0025} = 0.05c$ gives $c = 120$ basis points. Cost per
          share keeps rising with size, but ever more slowly — concave, not
          linear — so large orders cost far less than a linear extrapolation
          says, though still more per share than small ones.

      - part: The square-root law
        teach: >
          Across markets, brokers and decades, the cost of executing $Q$ shares
          in a name with daily volume $V$ and daily volatility $\sigma$ is
          about $\Delta p/p \approx Y\sigma\sqrt{Q/V}$, with a fitted prefactor
          $Y$ typically between $0.5$ and $1$. Walking the book supplies the
          mechanical part of it and the Glosten–Milgrom revision the
          informational part. The square root itself is an empirical
          regularity; no first-principles derivation is accepted.
      - ask: >
          What prefactor $Y$ fits the broker's records?
        expects: "0.8"
        tolerance: 0.001
        hint: >
          You found $Y\sigma = 120$ basis points, with $\sigma = 1.5$ percent.
        feedback: >
          $Y = 0.012/0.015 = 0.8$. Check at 1 percent:
          $0.8(0.015)(0.1) = 0.0012$, 12 basis points.
      - ask: >
          A different stock has daily volatility 2 percent, and the fitted
          prefactor is $0.75$. What does an order of 9 percent of a day's volume
          cost, in basis points?
        expects: "45"
        tolerance: 0.01
        feedback: >
          $0.75(0.02)\sqrt{0.09} = 0.75(0.02)(0.3) = 0.0045$, 45 basis points.
          Volatility sets the scale; the participation sets the square root.
      - ask: >
          An order grows ninefold. By what factor does its *total* impact cost
          — cost per share times shares — rise?
        expects: "27"
        feedback: >
          Per share it rises by $\sqrt{9} = 3$; there are 9 times as many
          shares; so the total rises $27$-fold. Total cost grows like
          $Q^{3/2}$.

      - part: What the square root caps, and what it does not explain
        ask: >
          A strategy expects to earn 30 basis points per trade in the first
          stock ($\sigma = 1.5$ percent, $Y = 0.8$). At what order size, as a
          percentage of daily volume, does impact eat the whole edge?
        expects: "6.25"
        tolerance: 0.01
        hint: >
          Solve $0.8(0.015)\sqrt{x} = 0.003$ for $x$.
        feedback: >
          $\sqrt{x} = 0.003/0.012 = 0.25$, so $x = 0.0625$, 6.25 percent of the
          day's volume. Past that the strategy pays more to trade than it
          expects to earn: the square root is what caps capacity.
      - ask: >
          An interviewer asks why impact is concave in size. Which answer is
          honest?
        choices:
          - text: >
              Walking a book with equal depth at every tick gives it directly.
            feedback: >
              Equal depth per tick gives the opposite: an order of $Q$ walks
              $Q/d$ ticks, so the price moves linearly in $Q$. The mechanical
              story alone predicts a linear law.
          - text: >
              It follows from Glosten–Milgrom, since a trade's information
              grows with its square root.
            feedback: >
              Glosten–Milgrom prices one unit at a time and says nothing about
              a square root. Several models produce one under extra
              assumptions, but none is accepted as *the* derivation.
          - text: >
              It is a robust empirical regularity with no accepted
              first-principles derivation; several models reproduce it under
              their own assumptions.
            correct: true
            feedback: >
              Saying so is the answer the interviewer is listening for: you
              reason from it as a stylized fact and do not pretend it is a
              theorem.
        feedback: >
          In one breath: "cost per share goes like $\sigma\sqrt{Q/V}$, total
          cost like $Q^{3/2}$, it is empirical, and it is what limits how much
          capital a strategy can run."

  - node: quant-finance.microstructure.impact-decay
    hook: >
      Two trades that cost the identical number of basis points on the day
      can leave completely different footprints a week later, and telling
      them apart is what separates "this cost me" from "this cost me
      forever."
    explanation: >
      Split total impact by whether it survives once the trading stops.
      The permanent component is other participants genuinely revising
      their valuation of the asset because of what your trading revealed —
      the same posterior-shift mechanism as Glosten–Milgrom — and it stays
      in the price indefinitely; empirically it's roughly linear in the
      signed quantity traded, not concave the way total impact is. The
      temporary component is the cost of consuming resting liquidity faster
      than the book can replenish it, and it decays back toward zero as new
      orders arrive to refill the levels that were eaten, typically over
      seconds to hours rather than staying forever.

      The distinction has a direct measurement consequence. The permanent
      piece is a real cost that no execution schedule can engineer away,
      because it's driven by what the market inferred, not by how the order
      was sliced. The temporary piece, by contrast, shrinks if the same
      total size is traded more slowly, since a slower rate gives the book
      more time to refill between fills — exactly the logic behind the
      execution schedules covered next.

      One reading is worth stating explicitly because it surprises people:
      an uninformed trader — someone with no actual edge on where the price
      is going — who nonetheless trades in large enough size still moves
      the price permanently, simply because the market can't distinguish a
      large uninformed order from a large informed one. That trader is, in
      effect, paying a toll for being mistaken for someone who knew
      something.
    worked: >
      A trade generates 42 basis points of total impact. If roughly half of
      empirical impact is permanent and half temporary, about 21 basis
      points stays in the price as the market's revised valuation, while
      the other 21 basis points fades over the following minutes to hours
      as the book refills behind the order.
    interview: >
      "If you trade slower, does that reduce your impact?" wants the split
      named explicitly — slower trading shrinks the temporary piece by
      giving the book time to refill, but does nothing to the permanent
      piece, which is set by what the market inferred, not by pace.
    pitfalls: >
      Assuming a slower execution schedule reduces all of your impact
      overstates what pacing actually buys you — the permanent component is
      indifferent to speed. Treating an uninformed trader's permanent
      impact as a pricing error rather than the market's rational response
      to an unexplained large trade misreads the mechanism.
    recap: >
      Permanent impact is the market re-marking the asset and never comes
      back regardless of pace; temporary impact is drained liquidity that
      refills, and only that part responds to trading more slowly.
    dialogue:
      - part: A price that rose and half came back
        teach: >
          A fund buys 400000 shares of a stock over one hour. The mid starts the
          hour at 80.00 and ends it at 80.60. By the next morning it has
          settled at 80.24, and over the following days it wanders around that
          level with no further trend.
      - ask: >
          Measured at the end of the buying, how many basis points of impact
          did the fund cause?
        expects: "75"
        tolerance: 0.01
        feedback: >
          $0.60/80.00 = 0.0075$, 75 basis points.
      - ask: >
          How many of those basis points had faded by the next morning?
        expects: "45"
        tolerance: 0.01
        feedback: >
          The mid gave back $80.60 - 80.24 = 0.36$, and $0.36/80 = 0.0045$, 45
          basis points. The other 30 — four tenths of the total — stayed.
      - ask: >
          Why would part of the move reverse and part of it stay?
        choices:
          - text: >
              The fund's buying overshot fair value, and arbitrageurs corrected
              exactly the overshoot.
            feedback: >
              Some reversal is correction of an overshoot, but this treats the
              whole move as a mispricing. It does not explain why a stable 30
              basis points was left behind rather than all of it removed.
          - text: >
              Two different things moved the price: one fades once the buying
              stops, and one is a lasting change in what the stock is thought
              to be worth.
            correct: true
            feedback: >
              The fade and the step that stays have different causes — and, it
              will turn out, respond to different choices the fund makes.
          - text: >
              Random noise: some days the move reverses, some days it does not.
            feedback: >
              Single days are noisy, but averaged over thousands of orders the
              same pattern holds: a partial reversal and a lasting remainder.
              That regularity is what needs explaining.
        feedback: >
          Impact is not one number; it is two, with different lifetimes.
      - reflect: >
          Think about what the buying did to the ask queue, and what it told
          everyone watching. Which part of the 75 basis points is each, and
          which would you expect to depend on the total size bought, and which
          on how *fast* it was bought?
        answer: >
          Buying 400000 shares in an hour ate the resting asks faster than new
          sellers replaced them; once the buying stopped, the book refilled
          and that part of the move faded — it depends on the rate. Separately,
          everyone saw a large buyer and revised what the stock is worth, just
          as a Glosten–Milgrom maker revises after a buy; that revision does
          not refill, and it depends on how much was bought in total, not how
          quickly.

      - part: Temporary and permanent
        teach: >
          The permanent component is other participants' revision of value —
          the posterior shift — and it stays in the price; empirically it is
          roughly linear in the signed quantity. The temporary component is the
          cost of consuming liquidity faster than it replenishes; it decays
          over seconds to hours and depends on the trading rate, not the total.
          Here: 30 basis points permanent, 45 temporary.
      - ask: >
          Next month the fund buys the same 400000 shares spread across a full
          day instead of an hour. Which part of the impact should shrink?
        choices:
          - text: >
              The permanent part, because a slow buyer looks less informed.
            feedback: >
              The market still sees 400000 shares bought; the total is what it
              learns from. Pace does not hide the quantity.
          - text: >
              Both, in proportion.
            feedback: >
              Only one of them depends on pace. The revision of value is set by
              what was bought, not by how quickly.
          - text: >
              The temporary part: the book has more time to refill between
              purchases.
            correct: true
            feedback: >
              A slower rate eats less of the book at any moment, so less
              of the move is the cost of drained liquidity. The 30 basis points
              of revision is still there at the end.
        feedback: >
          No schedule removes the permanent part. That is why it is a genuine
          cost, while the temporary part is a cost of impatience.
      - ask: >
          If the permanent part is linear in signed quantity, how many basis
          points of permanent impact would a purchase of 800000 shares leave?
        expects: "60"
        feedback: >
          Twice the quantity, twice the revision: $2 \times 30 = 60$ basis
          points. Contrast total impact, which grows like the square root of
          size: the permanent share of the total rises as orders get larger.

      - part: Paying for information you did not have
        ask: >
          A week later the fund discovers its signal was a data error: it had
          no edge at all. Yet the 30 basis points never came back. Why?
        choices:
          - text: >
              The market cannot see the fund's signal, only its trades, and a
              large buyer looks like an informed one.
            correct: true
            feedback: >
              Others rationally revised up on seeing size; nothing told them it
              was a mistake. An uninformed trader who moves the price
              permanently is paying to be mistaken for an informed one.
          - text: >
              The data error must have been right by accident.
            feedback: >
              Possible on one trade, but the effect does not need it: across
              many uninformed orders, permanent impact still appears.
          - text: >
              Permanent impact is a myth; the price would have risen anyway.
            feedback: >
              On one stock you cannot rule that out, but averaged across many
              orders the post-trade level is measurably shifted in the direction
              traded. That average is what "permanent" means.
        feedback: >
          The permanent component is about what others infer, not about what
          you know.
      - ask: >
          A month later the stock trades at 79.90, below where the fund started.
          A colleague says this proves the permanent impact was zero. What is
          wrong?
        choices:
          - text: >
              Nothing: the price returned below 80.00, so nothing stayed.
            feedback: >
              A month of other news moved the price too. A single path cannot
              separate the fund's lasting footprint from everything else that
              happened since.
          - text: >
              Permanent impact is measured as an average over many orders at a
              fixed horizon; a month of unrelated news swamps one path.
            correct: true
            feedback: >
              The split is a statistical statement about what the price does
              after orders like this, on average, at a horizon short enough that
              the order is still the main event.
          - text: >
              Permanent impact always shows up as a rising price, so a fall is
              impossible to interpret.
            feedback: >
              For a sell order it would be a fall. Direction follows the sign of
              the trade, and either way one path is too noisy to judge.
        feedback: >
          In an interview: "slowing down shrinks the temporary part; the
          permanent part is what the market learned, and pace does not change
          it."

  - node: quant-finance.microstructure.execution-schedules
    hook: >
      This is the practical answer to "how would you actually get a
      million shares done without moving the price yourself" — and TWAP,
      VWAP, and POV are the three canonical schedules an interviewer
      expects you to name and distinguish.
    explanation: >
      Because impact is concave in order size, one large order costs more
      per share than the same total size broken into many small ones — so
      every execution schedule is fundamentally about slicing a parent
      order into children small enough that no single child walks the book
      meaningfully. The three canonical schedules differ only in how they
      decide the size of each slice.

      TWAP sends equal quantity in equal intervals of clock time,
      regardless of what the market is actually doing — mechanically
      simple, and useful precisely when there's no reason to expect the
      day's volume to follow any particular pattern. VWAP instead weights
      slices by the historical intraday volume profile, which for most
      names is U-shaped — heavier at the open and the close, lighter
      through the middle of the day — so a VWAP schedule trades more when
      the market is naturally trading more, benchmarked against the day's
      actual volume-weighted average price rather than against the clock.
      Percentage-of-volume targets a fixed participation rate instead of a
      pre-set schedule, trading, say, 5 or 10 percent of every print as it
      happens, which makes it adaptive to whatever volume actually shows up
      that day rather than to a forecast made the night before.

      All three convert one large, concentrated impact cost into many small
      ones spread over time, and all three share the same failure mode: a
      schedule predictable enough for another participant to detect leaks
      information just as surely as a single giant order would, since
      anyone who can infer this name is being TWAPed can trade ahead of the
      remaining slices.
    worked: >
      A TWAP order for 78000 shares over a 390-minute session sends
      $78000/390 = 200$ shares per minute, steadily, regardless of how much
      volume actually trades in any given minute — contrast with a VWAP
      schedule for the same 78000 shares, which would send closer to 400 or
      500 shares a minute near the open and close and far fewer through the
      midday lull, while still summing to 78000 by the close.
    interview: >
      "How would you execute a large order without moving the price
      against yourself?" wants TWAP, VWAP, and POV distinguished by exactly
      what each one conditions its slice size on — clock time, historical
      volume shape, or realized volume — not just listed as synonyms for
      "slicing."
    pitfalls: >
      Treating VWAP as simply "trade more," without the U-shaped historical
      profile driving when, misses what actually generates the benchmark.
      Running a predictable schedule on a name liquid enough for others to
      detect it defeats the entire purpose of slicing in the first place.
    recap: >
      TWAP paces by the clock, VWAP paces by the historical volume shape,
      and percentage-of-volume paces by whatever volume actually shows up —
      all three trade one large impact cost for many small ones.
    dialogue:
      - part: 117000 shares and one day
        teach: >
          You must buy 117000 shares today in a stock that trades about 3
          million shares a day. The ask side usually shows about 3000 shares
          on each level, a cent apart, and a level that is hit refills within a
          minute or so. The session is 390 minutes long.
      - ask: >
          Sent as one market order at the open, roughly how many one-cent
          levels would the order walk through?
        expects: "39"
        feedback: >
          $117000/3000 = 39$ levels: the last shares are bought about 39 cents
          above where the first ones were, and the average share pays about
          half that.
      - ask: >
          Spread evenly across the session instead, how many shares do you send
          each minute?
        expects: "300"
        feedback: >
          $117000/390 = 300$ shares a minute — a tenth of the top level.
      - ask: >
          Each 300-share slice meets a book that has refilled since the last
          one. What does a typical slice cost?
        choices:
          - text: >
              About the same per share as the single order, since the total
              bought is the same.
            feedback: >
              The single order walked 39 levels because it hit them all at once.
              Each slice touches only the front level, which has had a minute
              to refill.
          - text: >
              Roughly the half-spread, since it never reaches past the best
              ask.
            correct: true
            feedback: >
              300 shares fit inside a 3000-share level. Slicing turns one walk
              through the book into 390 fills at the touch.
          - text: >
              Nothing, because small orders have no impact.
            feedback: >
              Every buy still pays the half-spread and adds a little pressure;
              small is cheap, not free.
        feedback: >
          The point of slicing is that no child walks the book.
      - ask: >
          Volume is not even through the day. The first 30 minutes trade 20
          percent of the day's 3 million shares; a midday 30 minutes trade 4
          percent. Your even schedule sends 9000 shares in each. What
          percentage of the midday volume are you?
        expects: "7.5"
        tolerance: 0.01
        hint: >
          Midday volume is 4 percent of 3 million.
        feedback: >
          $9000/120000 = 0.075$, 7.5 percent. At the open the same 9000 shares
          are $9000/600000 = 1.5$ percent. The clock-driven schedule is five
          times as conspicuous at midday as at the open.
      - reflect: >
          You want your footprint to be the same share of the market all day.
          How would you size the slices if you trust a forecast of when volume
          comes — and how if you would rather not rely on any forecast?
        answer: >
          With a forecast, size each slice in proportion to the volume
          expected in that interval: heavy at the open and close, light at
          midday, following the usual U-shape. Without one, trade a fixed
          fraction of whatever actually prints, say 5 percent of every trade
          you see. The first tracks the typical day; the second tracks the day
          that is actually happening.

      - part: TWAP, VWAP, percentage of volume
        teach: >
          The even schedule is TWAP: equal quantity per unit of clock time.
          Sizing by the historical intraday volume profile is VWAP, benchmarked
          against the day's volume-weighted average price. Trading a fixed
          participation rate of actual prints is percentage-of-volume (POV).
          All three slice a parent order into children so no child walks the
          book.
      - ask: >
          Under VWAP, how many of your 117000 shares should go in the first 30
          minutes?
        expects: "23400"
        feedback: >
          The first 30 minutes carry 20 percent of the day's volume, so
          $0.20 \times 117000 = 23400$ shares, against TWAP's 9000. Midday
          gets $0.04 \times 117000 = 4680$.
      - ask: >
          At 1pm surprise news hits and the afternoon's volume doubles. Which
          schedule automatically trades more into it?
        choices:
          - text: >
              VWAP, since it follows volume.
            feedback: >
              It follows the *historical* profile, fixed before the day began.
              The forecast did not know about the news.
          - text: >
              Percentage of volume.
            correct: true
            feedback: >
              It reads the prints as they happen, so twice the prints means
              twice the slices. That adaptivity is its reason to exist.
          - text: >
              TWAP, since it keeps trading every minute.
            feedback: >
              It keeps trading the same 300 a minute, so its share of the
              doubled volume halves. The clock does not read the news.
        feedback: >
          Clock, forecast, or the actual tape: each schedule is defined by what
          it conditions the slice size on.

      - part: What each schedule risks
        ask: >
          You run POV at 5 percent, and the day turns out quiet: 2 million
          shares trade. How many of your 117000 shares get done?
        expects: "100000"
        feedback: >
          $0.05 \times 2000000 = 100000$, leaving 17000 shares unbought at the
          close. POV fixes your footprint and gives up the guarantee of
          finishing.
      - ask: >
          Your TWAP sends exactly 300 shares at the start of every minute. What
          is the danger?
        choices:
          - text: >
              None: 300 shares is too small for anyone to notice.
            feedback: >
              One slice is small; 390 identical slices on a clock are a
              pattern, and patterns are what fast traders look for.
          - text: >
              It may finish too early.
            feedback: >
              A TWAP finishes on schedule by construction. Its risk is not
              timing but visibility.
          - text: >
              Others can detect the pattern and buy ahead of your remaining
              slices, raising your price.
            correct: true
            feedback: >
              A predictable schedule leaks the parent order as surely as one
              big order would. Real schedulers randomise slice sizes and times.
        feedback: >
          In an interview: name the three by what they condition on — clock,
          historical volume, realised volume — and add that all three leak
          information if they are predictable.

  - node: quant-finance.microstructure.execution-tradeoff
    hook: >
      Stretching an order out is not a free lunch — the same slowdown that
      shrinks impact also leaves more of the order exposed to the market
      simply drifting against you before it's done, and the right horizon
      trades one against the other explicitly.
    explanation: >
      Fix a total quantity $Q$ traded at a constant rate over a horizon
      $T$, so the participation rate is $Q/(VT)$ for daily volume $V$.
      Plugging that shrinking participation rate into the square-root law
      means impact cost per share falls like $1/\sqrt{T}$ — trading twice
      as slowly roughly cuts cost per share by a factor of $\sqrt{2}$.
      That's the entire case for stretching an order out.

      The case against is timing risk: whatever quantity hasn't executed
      yet is still exposed to the price simply moving on its own, unrelated
      to your trading, and the standard deviation of that unhedged exposure
      grows like $\sigma\sqrt{T}$ — longer horizon, more time for the price
      to wander away from where you started. Minimizing expected impact
      cost plus $\lambda$ times timing risk, for some risk-aversion
      parameter $\lambda$, pits a term falling in $T$ against a term rising
      in $T$, which produces a genuine interior optimum rather than a
      corner solution of trading as slowly or as fast as possible.

      That optimum depends on who's trading, not just on the stock. A
      risk-neutral trader with no other constraint stretches the order out
      further, since only the impact term matters to them. A risk-averse
      trader weights the timing-risk term more heavily and hurries. A
      trader whose informational edge decays quickly — the reason for
      trading disappears if not acted on soon — effectively behaves as
      maximally risk-averse about time and hurries hardest of all. Two
      desks staring at the identical size and the identical forecast can
      rationally choose different schedules purely because their risk
      aversion or their alpha decay differs.
    worked: >
      Fix a schedule at horizon $T=1$ hour with impact cost 40 basis points
      and timing-risk standard deviation $\sigma_1$. Stretching to $T=4$
      hours quarters the participation rate's exposure to the square-root
      law's argument by a factor of 4, so impact falls by $\sqrt{4}=2$, to
      20 basis points — while timing risk grows by the same factor
      $\sqrt{4}=2$, to $2\sigma_1$. Whether the stretch is worth it depends
      entirely on whether $\lambda$ weights that doubled timing risk more
      or less than the 20 basis points saved.
    interview: >
      "Why not just execute as slowly as possible to minimize impact?"
      wants timing risk named as the countervailing cost, with both scaling
      laws — $1/\sqrt{T}$ falling, $\sqrt{T}$ rising — stated explicitly as
      the reason the optimal horizon is interior.
    pitfalls: >
      Optimizing for impact alone and ignoring timing risk always
      recommends trading as slowly as possible, which is never actually
      optimal once any risk aversion is present. Assuming every trader
      should choose the same horizon for the same stock ignores that the
      optimum depends on the trader's own risk aversion and alpha decay,
      not on the stock alone.
    recap: >
      Impact cost falls like $1/\sqrt{T}$ while timing risk grows like
      $\sqrt{T}$, so the optimal execution horizon is interior and depends
      on how risk-averse the trader is and how fast their edge decays.
    dialogue:
      - part: Slower is cheaper, and then what
        teach: >
          You must sell a fixed block of shares at a constant rate. Spread over
          one hour, your broker's model puts the expected impact cost at 30
          basis points, and the standard deviation of the price drifting on its
          own while you are still selling — the timing risk — at 6 basis
          points.
      - ask: >
          Stretch the same block over four hours. Under the square-root law,
          what is the expected impact cost now, in basis points?
        expects: "15"
        hint: >
          The participation rate is $Q/(VT)$, and impact goes like its square
          root.
        feedback: >
          Four times the horizon is a quarter of the participation rate, and
          $\sqrt{1/4} = 1/2$: $30/2 = 15$ basis points. Impact per share falls
          like $1/\sqrt{T}$.
      - ask: >
          And the timing risk over four hours, in basis points?
        expects: "12"
        hint: >
          The price's own wandering has a standard deviation that grows like
          $\sigma\sqrt{T}$.
        feedback: >
          $6\sqrt{4} = 12$ basis points. You saved 15 basis points of expected
          cost and doubled the spread of outcomes.
      - ask: >
          A trader who cares only about expected cost is choosing the horizon.
          What does that trader pick?
        choices:
          - text: >
              One hour, to get it over with.
            feedback: >
              Getting it over with only matters if waiting costs something,
              and this trader counts no cost to waiting. One hour is twice the
              impact of four.
          - text: >
              As long as the day allows: impact only falls as $T$ grows.
            correct: true
            feedback: >
              With impact the only term, every extra hour is cheaper, so the
              answer is always "slower". That is a corner, not a decision.
          - text: >
              Four hours, the point where the two numbers cross.
            feedback: >
              The crossing would matter to someone who weighs both numbers.
              This trader ignores the second one entirely.
        feedback: >
          Impact alone never tells you when to stop stretching.
      - reflect: >
          What does the stretch-forever trader leave out, and why does adding
          it to the objective produce a best horizon rather than a corner?
        answer: >
          The risk of the unsold shares: the longer you take, the further the
          price can wander before you are done, with standard deviation growing
          like $\sqrt{T}$. Add it, weighted by how much you mind risk, and you
          minimise a term falling in $T$ plus a term rising in $T$. Their sum
          is high at both ends and lowest somewhere in between.

      - part: Impact against timing risk
        teach: >
          The trader's dilemma. Trading $Q$ at a constant rate over $T$, impact
          per share falls like $1/\sqrt{T}$ while timing risk grows like
          $\sigma\sqrt{T}$. Minimise expected impact plus $\lambda$ times
          timing risk and the optimum is interior: a risk-neutral trader
          stretches out, a risk-averse one hurries, and one whose alpha decays
          quickly hurries most.
      - ask: >
          Take $\lambda = 1$, so the objective in basis points is
          $30/\sqrt{T} + 6\sqrt{T}$, with $T$ in hours. What is it at
          $T = 4$?
        expects: "27"
        feedback: >
          $15 + 12 = 27$, down from $30 + 6 = 36$ at one hour.
      - ask: >
          And at $T = 16$?
        expects: "31.5"
        tolerance: 0.001
        feedback: >
          $30/4 + 6(4) = 7.5 + 24 = 31.5$. Past some point the risk you add
          grows faster than the impact you save; the curve turns back up.
      - ask: >
          At what horizon, in hours, is the objective smallest?
        expects: "5"
        tolerance: 0.001
        hint: >
          Set the derivative of $30T^{-1/2} + 6T^{1/2}$ to zero.
        feedback: >
          $-15T^{-3/2} + 3T^{-1/2} = 0$ gives $T = 5$, and the objective is
          $30/\sqrt{5} + 6\sqrt{5} \approx 13.4 + 13.4 = 26.8$ basis points.
      - ask: >
          At $T = 5$ both terms came out near 13.4. Is that a coincidence?
        choices:
          - text: >
              Yes: with other numbers the terms would differ at the optimum.
            feedback: >
              Try it: for $a/\sqrt{T} + b\sqrt{T}$ the optimum is $T = a/b$,
              where both terms equal $\sqrt{ab}$. The equality is structural.
          - text: >
              No: at the optimum of $a/\sqrt{T} + b\sqrt{T}$ the falling and
              rising terms are always equal.
            correct: true
            feedback: >
              Setting the derivative to zero says exactly that
              $a/\sqrt{T} = b\sqrt{T}$. It gives a quick check: at the best
              horizon you pay as much in impact as you carry in weighted risk.
          - text: >
              No: the impact term is always the larger at the optimum.
            feedback: >
              At $T = 5$ they are equal, not ordered. Shorter than that, impact
              dominates; longer, risk does.
        feedback: >
          The best schedule balances the two costs; it does not minimise
          either.

      - part: Same order, different traders
        ask: >
          A more risk-averse desk uses $\lambda = 4$ on the same order. What is
          its best horizon, in hours?
        expects: "1.25"
        tolerance: 0.001
        hint: >
          Now the rising term is $4 \times 6\sqrt{T} = 24\sqrt{T}$.
        feedback: >
          The optimum of $30/\sqrt{T} + 24\sqrt{T}$ is $T = 30/24 = 1.25$ hours.
          Four times the risk aversion, a quarter of the horizon: same stock,
          same size, a different schedule.
      - ask: >
          A third desk is selling because of a signal it expects the market to
          price in within the hour. How should its horizon compare?
        choices:
          - text: >
              Longer than the risk-neutral desk's, to save impact.
            feedback: >
              The saving is paid for with the signal: every hour it waits, more
              of the move it is trading on has already happened without it.
          - text: >
              The same, since impact and volatility are properties of the
              stock.
            feedback: >
              The stock fixes the two scaling laws; the trader fixes what
              waiting costs. Fast-decaying alpha is an extra cost of waiting.
          - text: >
              Shorter than either: decaying alpha acts like extreme aversion
              to waiting.
            correct: true
            feedback: >
              Its edge is a clock running out, so it accepts more impact to
              trade before the market moves. In an interview: "impact falls
              like $1/\sqrt{T}$, risk rises like $\sqrt{T}$, and where you stop
              depends on your risk aversion and how fast your alpha decays."
        feedback: >
          Two desks with the same order can rationally trade it at different
          speeds.

  - node: quant-finance.microstructure.tick-size
    hook: >
      "Why do so many liquid stocks quote exactly a one-cent spread, all
      day, every day" has a mechanical answer that has nothing to do with
      those stocks being efficiently priced to the penny.
    explanation: >
      The tick is the smallest price increment an exchange will accept —
      one cent for US equities trading above a dollar — and it's a hard
      constraint on the book, not a suggestion: no order can rest at a
      price between two adjacent ticks, however much a maker might want to.

      The tick binds whenever the spread the earlier components of this
      unit would justify economically is narrower than one tick. If
      adverse selection, inventory risk, and processing costs together
      justify a fair half-spread of, say, three tenths of a cent, no maker
      can act on that by quoting 10.003 — the nearest available prices are
      10.00 and 10.01, so the spread is pinned at a full cent regardless of
      how tight the underlying economics actually want it. Every maker who
      would otherwise compete on price is instead forced to stack at the
      identical pinned price.

      Two consequences follow directly from that pinning, and they change
      what "competing" even means. Competition that can no longer happen on
      price shifts entirely onto time: since nobody can undercut the pinned
      spread, the only way to improve your execution is to be earlier in
      the queue at that price, which is exactly what the next node prices
      out. And depth at the touch swells, because quoting at a spread wider
      than the fair one is unusually profitable, which draws in size until
      the level is thick — tick-constrained names behave nothing like a
      wide-spread name, where a maker can still jump the whole queue by
      undercutting a rival by a single penny.
    worked: >
      A model estimates the economically fair half-spread for a liquid,
      heavily traded name at 0.3 cents, implying a fair full spread of 0.6
      cents. The exchange's minimum increment is one full cent. Since 0.6
      cents is narrower than the one-cent tick, no maker can quote the fair
      spread directly — the observed spread sits pinned at exactly one
      cent, wider than the underlying economics, with every maker competing
      for queue position at that single price instead.
    interview: >
      "Why is the quoted spread exactly one cent on this name and not
      something like half a cent?" wants the pinning mechanism stated
      directly — the fair spread is narrower than the tick, so the tick
      becomes the binding constraint — not an appeal to the stock being
      especially efficient.
    pitfalls: >
      Reading a one-cent spread as evidence the fair spread actually is one
      cent, rather than as a floor imposed by the tick, gets the causality
      backwards. Assuming tick-constrained names behave like any other
      liquid name ignores that competition there has moved entirely into
      queue position.
    recap: >
      When the economically fair spread is narrower than the minimum tick,
      the spread sticks at one tick and competition shifts from price into
      queue position.
    dialogue:
      - part: A maker who wants to quote half a cent wide
        teach: >
          You make markets in a stock priced around 7.40 that trades tens of
          millions of shares a day. Your model says a fair spread is half a
          cent. The book: best bid 7.40 with 180000 shares, best ask 7.41 with
          150000. The exchange accepts prices in whole cents only.
      - ask: >
          You send a bid at 7.4025 and an ask at 7.4075. What happens?
        choices:
          - text: >
              They rest inside the spread and become the new best bid and ask.
            feedback: >
              They would if the exchange accepted them. It does not: an order
              must be priced on the one-cent grid.
          - text: >
              They are rejected: neither price is a whole cent.
            correct: true
            feedback: >
              The minimum increment is a hard constraint. Whatever the economics
              say, no order rests between 7.40 and 7.41.
          - text: >
              They are rounded to 7.40 and 7.41 and join those queues.
            feedback: >
              Exchanges reject sub-penny limit prices rather than rounding them
              for you; and even rounded, they would join the back of the queues,
              not improve on them.
        feedback: >
          Your fair spread is not a price you can post.
      - ask: >
          Where can you post a bid that actually competes for sellers?
        choices:
          - text: >
              7.41, one tick better than the others.
            feedback: >
              A buy at 7.41 is not a resting bid: it meets the 7.41 ask and
              trades at once. There is no price between 7.40 and 7.41 to
              improve to.
          - text: >
              7.39, just below the crowd.
            feedback: >
              A lower bid is behind every 7.40 bidder on price. Sellers reach
              you only after 180000 shares ahead have traded.
          - text: >
              7.40, at the back of the 180000-share queue.
            correct: true
            feedback: >
              Best price available, worst place in line. Every maker who
              thinks like you is stacked at the same price, ordered by arrival.
        feedback: >
          At the pinned price, the only thing left to compete on is time.
      - ask: >
          By how many cents does the quoted spread exceed your fair spread?
        expects: "0.5"
        tolerance: 0.001
        feedback: >
          $1 - 0.5 = 0.5$ cents. The quoted spread is a floor set by the grid,
          not a measurement of the stock's economics.
      - ask: >
          A second stock trades near 240 with a spread of 9 cents: best bid
          239.95 for 300 shares, best ask 240.04. You want to be the first
          buyer a seller meets. What do you do?
        choices:
          - text: >
              Join 239.95 and wait your turn.
            feedback: >
              That puts you behind 300 shares. You can do better — there are
              eight whole cents of room between the quotes.
          - text: >
              Bid 239.96 and be alone at the front.
            correct: true
            feedback: >
              One penny of price buys you the whole queue. In a wide-spread
              stock, competing on price is cheap and immediate.
          - text: >
              Bid 240.04 to guarantee a fill.
            feedback: >
              That crosses and buys at once — taking liquidity, not making it.
              The question was how to be first in line as a resting bid.
        feedback: >
          Same exchange, same tick, opposite worlds.
      - reflect: >
          In the first stock you had to wait behind 180000 shares; in the second
          you jumped the line for a penny. Say what makes the difference, in
          terms of the fair spread and the tick.
        answer: >
          In the second stock the fair spread is many ticks wide, so a maker can
          undercut by one tick and still quote above its costs; price
          competition is alive. In the first, the fair spread is narrower than
          one tick, so the spread is pinned at one tick, every maker stacks at
          the same two prices, and the only remaining way to be ahead is to have
          arrived earlier.

      - part: When the tick binds
        teach: >
          The tick is the minimum price increment — one cent for US stocks
          above a dollar. It binds when the economically fair spread is
          narrower than a tick: the spread is pinned at one tick and
          competitors stack at the same price. Then competition shifts from
          price to time, making queue position the scarce resource, and depth
          at the touch swells.
      - ask: >
          Why is there so much size — 180000 shares — at 7.40?
        choices:
          - text: >
              The pinned one-cent spread is wider than the fair half cent, so
              quoting there is profitable and draws in makers.
            correct: true
            feedback: >
              The extra half cent is rent. Since nobody can compete it away on
              price, makers compete for it by adding size and arriving early.
          - text: >
              Many investors want to buy at exactly 7.40.
            feedback: >
              There is nothing special about 7.40 to a buyer. The size sits
              there because it is the only competitive price for a bid.
          - text: >
              The exchange requires a minimum depth at each tick.
            feedback: >
              No such requirement exists. The depth is a response to
              profitability, not a rule.
        feedback: >
          Thick touch, one-tick spread, long queues: the signature of a
          tick-constrained name.

      - part: A snapshot, and a smaller tick
        ask: >
          A third stock's spread is exactly one cent right now, but most of the
          day it runs 4 to 6 cents. Is it tick-constrained?
        choices:
          - text: >
              Yes: its spread is one tick.
            feedback: >
              A snapshot is not a binding constraint. Most of the day its makers
              choose spreads several ticks wide, so the fair spread is above the
              tick; the one cent is a passing state.
          - text: >
              No: the tick binds only when the fair spread is narrower than a
              tick, and here the usual spread says it is wider.
            correct: true
            feedback: >
              Tick-constrained names sit at one tick almost all the time. This
              one can be undercut by a penny, so price competition is still
              alive.
          - text: >
              Only while the spread is one cent.
            feedback: >
              Binding is about the economics of the name, not about a moment. A
              momentarily tight book can be undercut the instant it widens
              again.
        feedback: >
          Binding means the grid, not the economics, is setting the spread —
          persistently.
      - ask: >
          The exchange cuts the first stock's tick to a tenth of a cent. What
          should you expect?
        choices:
          - text: >
              Nothing changes: the spread is set by the stock's economics.
            feedback: >
              It is set by the grid when the grid binds, as here. Loosen the
              grid and the economics take over.
          - text: >
              The spread narrows toward half a cent, queues thin out, and
              competition moves back toward price.
            correct: true
            feedback: >
              A maker can now undercut by a tenth of a cent, so being early
              matters less and the rent that fattened the touch shrinks. In an
              interview: "a one-tick spread all day means the tick binds, so
              the game is queue position, not price."
          - text: >
              The spread widens, since makers lose their rent.
            feedback: >
              Losing the rent is why makers dislike it, but competition pushes
              the spread down toward the fair half cent, not up.
        feedback: >
          Tick size is a design choice that decides whether makers compete on
          price or on time.

  - node: quant-finance.microstructure.queue-value
    hook: >
      "Would you rather be first or last in a 20000-share queue" sounds
      like a trick question until you see how fast a level actually turns
      over — the answer is almost never close.
    explanation: >
      In a tick-constrained name, a resting passive order is worth roughly
      $\Pr(\text{fill}) \cdot \delta - \mathbb{E}[\text{AS}]$: the
      half-spread it captures if filled, times the probability of actually
      getting filled, net of the adverse-selection cost expected on that
      fill. Queue position is what determines the first factor — an order
      with $N$ shares resting ahead of it in the FIFO line only trades once
      all $N$ of those shares are gone, whether because they filled or
      because they were cancelled.

      Both directions matter and they don't cancel symmetrically.
      Cancellations ahead of you help — someone pulling their order moves
      you closer to the front for free. The level being wiped out hurts in
      a different way: if a large aggressive order sweeps through it, you
      are filled at the very moment the price is moving through you, and if
      the market instead ticks away from your price, your priority within
      the level stops mattering because it is no longer the touch. Whether a given position is worth
      much at all comes down to a simple race between how many shares sit
      ahead of it and how fast that price level actually turns over.

      The uncomfortable asymmetry is the entire point of the node. You fill
      fastest exactly when a level is being aggressively traded through —
      which is precisely when informed flow is most likely to be running. A
      queue position that clears quickly is, disproportionately, clearing
      because someone knows something, which means the easiest fills to get
      are systematically the ones with the worst expected adverse selection
      attached to them.
    worked: >
      Join a bid queue with 6000 shares resting ahead, at a price level
      where executions are running about 1500 shares a minute. That level
      clears in roughly $6000/1500 = 4$ minutes, so a fill is likely well
      within the horizon over which the fair-value estimate is still
      current. With a half-spread of 0.5 cents and expected adverse
      selection of 0.2 cents on a fill, and a rough fill probability of 0.6
      over that horizon, the position's value is about $0.6(0.5) - 0.2 =
      0.3 - 0.2 = 0.1$ cents per share — thin, but positive.
    interview: >
      "You've got 6000 shares ahead of you at a busy level — is that a good
      position?" wants the clearing-time calculation done on the spot, plus
      the observation that fast clearing cuts both ways: more likely to
      fill, but the fills that come easiest are the ones most likely to be
      adversely selected.
    pitfalls: >
      Valuing a queue position only by how many shares are ahead, without
      checking the level's actual turnover rate, misses that the same 6000
      shares means something completely different at a fast level versus a
      slow one. Assuming a higher fill probability is unambiguously good
      ignores that it's specifically correlated with the adverse-selection
      term getting worse.
    recap: >
      A queue position is worth its fill probability times the half-spread
      it captures, minus expected adverse selection — and the
      fastest-clearing positions are systematically the ones facing the
      worst-informed flow.
    dialogue:
      - part: Two places in the same line
        teach: >
          A tick-constrained stock bids 15.20 with 30000 shares resting. Your
          desk has two orders in that queue: order A joined early and has 2000
          shares ahead of it; order B joined just now and has 28000 ahead.
          Sells execute against the level at about 4000 shares a minute, and a
          level like this one usually lasts about two minutes before the price
          ticks away from it.
      - ask: >
          Ignoring cancellations, how many minutes until the shares ahead of
          order B have traded?
        expects: "7"
        feedback: >
          $28000/4000 = 7$ minutes. Order A needs $2000/4000 = 0.5$.
      - ask: >
          What does that say about order B's chances?
        choices:
          - text: >
              It will fill in about seven minutes; it just has to be patient.
            feedback: >
              The level typically lasts two. In seven minutes the price has most
              likely ticked away, and B is resting at a price that is no longer
              the best bid.
          - text: >
              It usually will not fill at all before the level moves away.
            correct: true
            feedback: >
              The race is between the shares ahead and the life of the level,
              and B loses it most of the time. A, half a minute from the front,
              usually wins.
          - text: >
              It fills as surely as A, since both are at the best price.
            feedback: >
              Same price, different places. In a FIFO level the price gets you
              into the line; your place in it decides whether you trade.
        feedback: >
          At a pinned price, place in the queue is what buys a fill.
      - reflect: >
          Put a value, in cents per share, on a resting order at a pinned price.
          What do you earn if it fills, how does its queue position enter, and
          what must you subtract for the kind of fill it gets?
        answer: >
          If it fills it earns the half-spread $\delta$ against fair value, so
          weight that by the probability of a fill, which is where queue
          position enters. Then subtract the expected adverse selection: fills
          come when someone chooses to trade with you, and some of them know
          the price is about to move through you. Value is
          $\Pr(\text{fill}) \cdot \delta - \mathbb{E}[\text{AS}]$.

      - part: What a place in line is worth
        teach: >
          In a tick-constrained name a passive order is worth
          $\Pr(\text{fill}) \cdot \delta - \mathbb{E}[\text{AS}]$, and queue
          position is what buys the first factor. With $N$ shares ahead you
          trade only after those $N$ leave: cancellations ahead of you help,
          and the level being swept or the price moving away hurts.
      - ask: >
          The half-spread is 0.5 cents. Order A fills with probability $0.9$
          and its expected adverse selection, averaged over all outcomes, is
          0.15 cents. What is A worth, in cents per share?
        expects: "0.3"
        tolerance: 0.001
        feedback: >
          $0.9(0.5) - 0.15 = 0.45 - 0.15 = 0.30$ cents a share.
      - ask: >
          Order B fills with probability $0.2$, and its expected adverse
          selection is also 0.15 cents. What is B worth?
        expects: "-0.05"
        tolerance: 0.001
        feedback: >
          $0.2(0.5) - 0.15 = 0.10 - 0.15 = -0.05$ cents. The back of a deep
          queue is worth less than nothing: it rarely earns the spread, and
          when it does fill, the fill is a bad one.
      - ask: >
          How much per share is it worth to hold A's place rather than B's, in
          cents?
        expects: "0.35"
        tolerance: 0.001
        feedback: >
          $0.30 - (-0.05) = 0.35$ cents a share, most of a half-spread. That is
          what queue position is worth in a tick-constrained name, and why
          firms spend so much to arrive early.

      - part: Who helps you, and when filling is bad news
        ask: >
          Suppose shares ahead of B are also cancelled at 3000 a minute,
          alongside the 4000 a minute of executions. How many minutes until B
          reaches the front?
        expects: "4"
        feedback: >
          Shares leave from ahead of you at $4000 + 3000 = 7000$ a minute, so
          $28000/7000 = 4$ minutes. A cancellation ahead promotes you exactly
          as a fill ahead does — but four minutes is still longer than the
          level usually lives.
      - ask: >
          Today order B, from the back of the line, filled within 30 seconds.
          What most likely happened?
        choices:
          - text: >
              A wave of cancellations ahead of it.
            feedback: >
              Possible, but 28000 shares cancelling in half a minute is rare.
              The ordinary way a deep level clears that fast is someone selling
              through it.
          - text: >
              A large aggressive seller swept the level, and the price is
              probably still falling.
            correct: true
            feedback: >
              The fills you get fastest from the back are the ones that arrive
              with heavy selling — exactly when informed flow is running. A
              quick fill there is bad news about the price.
          - text: >
              Good luck: B captured the half-spread early.
            feedback: >
              It captured the half-spread against a fair value that is moving
              down. Measured a few minutes later, that fill likely lost money.
        feedback: >
          Fill probability and adverse selection are not independent: you fill
          fastest exactly when you would rather not. In an interview: "clearing
          time is shares ahead over turnover; then ask what kind of flow clears
          it."

  - node: quant-finance.microstructure.latency-race
    hook: >
      The value of a queue slot from the previous node is only real if you
      can actually get there first, and this is the node that explains why
      firms will spend arbitrary amounts of money chasing microseconds to
      do exactly that.
    explanation: >
      Two races run continuously underneath everything else in this unit.
      The passive race is to join a newly created price level — one that
      just opened up because the old best level traded through or got
      cancelled — ahead of every other maker trying to do the same thing;
      whoever's order arrives at the exchange first gets the front of the
      new queue, and everyone slightly slower gets a worse position for the
      entire life of that level. The aggressive race runs the other
      direction: hit a quote that news has just made stale before the
      maker posting it can cancel it, since a maker too slow to pull a
      now-mispriced quote is effectively handing away free money to
      whoever gets there first.

      Both races are winner-take-all rather than gradual. There's no
      partial credit for being the second-fastest to a queue slot or a
      stale quote — the payoff is a step function, all or nothing, not a
      smooth gradient the way most trading edges are. That structure is
      exactly what makes the arms race rational for any individual
      participant even though it produces almost no value for the market as
      a whole: the private value of shaving one more microsecond off your
      latency is a whole trade's worth of edge, while the social value of
      that same microsecond — the improvement to how well prices reflect
      information — is close to zero, since the trade would have happened
      at essentially the same price a moment later anyway.

      Speed bumps and frequent batch auctions exist specifically to break
      this dynamic: by converting continuous racing into a discrete auction
      that clears at fixed intervals, they turn the competition back from a
      pure speed contest into ordinary price competition, where being a
      millisecond faster no longer wins the whole trade outright.
    interview: >
      "Why would a firm spend millions on a microwave link for a few
      microseconds?" wants the private-value-versus-social-value framing
      stated explicitly — a whole trade's edge privately, close to nothing
      socially — not just "to be faster."
    pitfalls: >
      Assuming faster is simply better for the market as a whole conflates
      the private payoff to one firm with the social value of the
      underlying activity, which the winner-take-all structure explicitly
      decouples. Treating speed bumps as anti-competitive rather than as a
      mechanism for converting a pure latency race back into price
      competition misreads their purpose.
    recap: >
      Queue slots and stale quotes are won by whoever arrives first in a
      winner-take-all step function, which makes speed worth almost
      anything privately and almost nothing socially — exactly what speed
      bumps and batch auctions are designed to blunt.
    dialogue:
      - part: A stale quote and three fast firms
        teach: >
          A futures contract jumps, and the stock it tracks is now worth 50.14.
          A maker's ask of 500 shares at 50.10 is suddenly stale; the maker's
          systems will cancel it 4.2 milliseconds after the news. Three firms
          see the jump and send buy orders, arriving 4.0, 4.1 and 4.3
          milliseconds after it.
      - ask: >
          Who profits from the stale quote?
        choices:
          - text: >
              The 4.0 and 4.1 firms, since both arrive before the cancellation.
            feedback: >
              Both arrive in time, but the first order takes all 500 shares. By
              4.1 there is nothing left at 50.10 to buy.
          - text: >
              All three share it in proportion to their speed.
            feedback: >
              The matching engine does not grade speed; it processes orders in
              the sequence they arrive. Only the first gets the quote.
          - text: >
              Only the 4.0 firm.
            correct: true
            feedback: >
              It lifts all 500 shares. The 4.1 firm finds the level empty and
              the 4.3 firm arrives after the cancellation.
        feedback: >
          The prize goes whole to whoever arrives first.
      - ask: >
          How many dollars does the 4.0 firm make, marking the shares at the new
          fair value?
        expects: "20"
        feedback: >
          $500 \times (50.14 - 50.10) = 500 \times 0.04 = 20$ dollars, paid by
          the maker whose quote went stale.
      - ask: >
          The 4.1 firm spends to cut its latency to 3.9 milliseconds, a 5
          percent improvement. By how many dollars does its payoff on events
          like this one rise?
        expects: "20"
        feedback: >
          From 0 to 20: it now arrives first and takes the whole quote. A 5
          percent speed-up bought a 100 percent change in the outcome, because
          the payoff is a step, not a slope.
      - reflect: >
          Suppose all three firms had been a full millisecond slower. What would
          the market as a whole have lost, and how does that compare with what
          one microsecond is worth to the firm that wins?
        answer: >
          Almost nothing: the stale quote would still have been hit or
          cancelled within a few milliseconds, and the price would have
          reached 50.14 at essentially the same moment. The microsecond's
          value to the winner is the whole trade; its value to price discovery
          is close to zero. Private value and social value come apart.

      - part: Two races, both winner-take-all
        teach: >
          The latency arms race. The aggressive race is to hit a quote that news
          has made stale before its maker can pull it. The passive race is to
          join a newly created price level ahead of everyone else, since queue
          position is worth money. Both are winner-take-all, so the payoff to
          speed is a step function, and the spend on microwave links and custom
          hardware dissipates the rent rather than creating value.
      - ask: >
          The 50.10 ask has now gone and a new best ask forms at 50.14. Being
          first in that queue is worth 0.3 cents a share on a 2000-share order;
          second place, behind someone else's 2000, is worth nothing. How many
          dollars is the first microsecond of lead worth?
        expects: "6"
        feedback: >
          $2000 \times 0.003 = 6$ dollars, for arriving a microsecond earlier.
          The passive race pays out the value of queue position in one
          lump.
      - ask: >
          Every firm in the race buys the same new hardware, and all now arrive
          at 3.9 milliseconds, give or take a few microseconds. What happens to
          their profits?
        choices:
          - text: >
              They rise, since everyone is faster.
            feedback: >
              Everyone faster means nobody relatively faster. The prize per
              event is still 20 dollars, won by one firm.
          - text: >
              The prizes are split as before, by tiny random margins, and the
              hardware spend is a pure cost.
            correct: true
            feedback: >
              The race is relative. Collectively the firms paid to stay where
              they were — the definition of rent dissipation.
          - text: >
              The stale quotes disappear, since the makers are too slow now.
            feedback: >
              Makers race too, to cancel; if they also upgrade, the quotes go
              stale and are picked off exactly as before.
        feedback: >
          A race scored on rank, not on time, is never won for long.

      - part: Who pays, and how to stop the race
        ask: >
          The maker loses 20 dollars every time its quote goes stale. What does
          it do about it over time?
        choices:
          - text: >
              Nothing: it is the cost of business and does not affect anyone
              else.
            feedback: >
              A cost that recurs every day is priced. Makers recover it from the
              only place they can — the spread.
          - text: >
              Widens its quotes, so every investor crossing the spread pays for
              the sniping.
            correct: true
            feedback: >
              Being picked off is adverse selection by speed. It goes into the
              spread like any other informed flow, and ordinary investors pay
              it.
          - text: >
              Quotes tighter to win more trades and make up the loss.
            feedback: >
              Tighter quotes go stale by more when the price jumps, so each
              pick-off costs more. The pressure runs the other way.
        feedback: >
          The arms race is not free for everyone else: it is a tax on makers,
          passed into the spread.
      - ask: >
          An exchange delays every incoming order by 350 microseconds — except
          a maker's cancellations, which are processed at once. What changes?
        choices:
          - text: >
              Nothing: everyone is delayed equally, so the race is unchanged.
            feedback: >
              Not everyone: cancellations skip the delay. That asymmetry is the
              point of the design.
          - text: >
              The maker can pull a stale quote before the sniper's order reaches
              the book, so the aggressive race stops paying and makers can quote
              tighter.
            correct: true
            feedback: >
              The 4.0-millisecond buy now lands at 4.35, after the 4.2
              cancellation. With the prize gone, the microseconds lose their
              value. In an interview: "speed is a step function, worth a whole
              trade privately and almost nothing socially — speed bumps and
              batch auctions turn it back into price competition."
          - text: >
              It bans fast trading.
            feedback: >
              Fast firms can still trade; they just cannot beat a maker's
              cancellation. The bump removes one prize, not the participants.
        feedback: >
          Remove the winner-take-all prize and the reason to race disappears.