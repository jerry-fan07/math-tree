unit: quant-finance.options
opening: >
  Option Pricing takes you from a payoff sketched on a whiteboard to the exact
  number an interviewer wants: the price. The spine is one idea run three
  times — build a portfolio of stock and cash that reproduces an option's
  payoff state by state, and that portfolio's cost is the price — first on
  one period, then through a multi-step tree, then in the continuous-time
  limit that is the Black–Scholes formula, with the risk-neutral probability
  $q$ falling out of the same replication algebra every time. The back half
  turns replication and its sibling, put–call parity, into trading
  vocabulary: how implied volatility is quoted and why it smiles, and how
  straddles, spreads, butterflies and synthetics package a view on
  direction, on magnitude, or on volatility alone.
lessons:
  - node: quant-finance.options.payoff-diagrams
    hook: >
      Every strategy question in this unit — the width of a spread, the
      wings of a butterfly, the breakeven of a straddle — reduces to
      drawing kinked lines and reading off where they cross zero, and that
      is the one skill this node builds.
    explanation: >
      Fix the plot's x-axis as the terminal stock price $S_T$ and its
      y-axis as payoff or profit. A call's payoff $(S_T-K)^{+}$ is flat at
      $0$ up to the strike, then rises with slope $1$: a hockey stick with
      its kink at $K$. A put's payoff $(K-S_T)^{+}$ is the mirror — slope
      $-1$ below $K$, flat at $0$ above. The payoff line is what the
      contract pays if it expired right now; it never turns negative,
      because the whole point of an option is that you never exercise
      against yourself.

      P&L is the payoff shifted by what you paid or received: a long
      position's P&L is payoff minus premium, so it starts at the negative
      of the premium and only reaches zero once the payoff climbs back up
      to match it — the breakeven, $K+c$ for a call bought at $c$. A short
      position is the same line flipped top to bottom: the short collects
      the premium up front, so its P&L starts positive and falls without
      bound as the stock runs past the strike for a short call, or falls to
      at most the strike minus the premium for a short put, since the
      stock cannot go below $0$.

      Every strategy in this unit — spreads, straddles, butterflies — is
      built by adding several of these kinked lines vertically, one call or
      put payoff per leg, net of the total premium paid across all legs.
      Once you can add hockey sticks, max profit, max loss and breakeven
      are just features of the resulting sum, read off without further
      algebra.
    worked: >
      A trader shorts a call struck at $K=60$ for a premium of $4$. If
      $S_T=68$: the payoff to the holder is $8$, so the short's P&L is
      $4-8=-4$. Breakeven is where the payoff equals the premium collected,
      $K+4=64$; below $64$ the short keeps the full $4$, and above it
      losses grow one-for-one with $S_T$, unbounded.
    interview: >
      "Sketch the payoff and P&L for [strategy]" or "where's your breakeven
      and worst case" is asked cold, often at a whiteboard — the
      interviewer wants the kink points and slopes named instantly, and
      wants payoff (never negative) clearly distinguished from P&L (shifted
      by premium) without being asked.
    pitfalls: >
      Quoting the payoff's breakeven instead of the P&L's is common — a
      call's payoff is zero everywhere below $K$, so breakeven is strictly
      a P&L concept. For a short call, forgetting the loss is unbounded
      above the strike is the fastest way to misprice risk live.
    recap: >
      A payoff diagram is a kinked line with slopes $0$ and $\pm 1$ meeting
      at the strike; shift it by the premium to get P&L, and every
      multi-leg strategy is several such lines added vertically.
    dialogue:
      - part: One call, priced at four finishing prices
        teach: >
          A stock trades near $30$. You pay a premium of $2.50$ today for a
          three-month call struck at $30$: at expiry you may buy one share at
          $30$, and you will only do so if that beats the market.
      - ask: >
          The stock finishes at $S_T = 36$. What does the call pay you at
          expiry, before counting the premium?
        expects: "6"
        hint: >
          You buy at $30$ a share you can sell at once for $36$.
        feedback: >
          $(36 - 30)^{+} = 6$. Exercise, buy at $30$, sell at $36$.
      - ask: >
          What is your profit on the whole trade at $S_T = 36$, counting the
          $2.50$ you paid?
        expects: "3.5"
        feedback: >
          $6 - 2.50 = 3.50$. What the contract pays and what you made are two
          different numbers, and the gap between them is the premium.
      - ask: >
          The stock finishes at $S_T = 31$ instead. What is your profit now?
        expects: "-1.5"
        hint: >
          The call is in the money, so it pays something. Is it enough?
        feedback: >
          The call pays $(31 - 30)^{+} = 1$, and $1 - 2.50 = -1.50$. You
          exercise, because $1$ beats $0$, and you still lose money: being in
          the money is not the same as being in profit.
      - ask: >
          At what finishing price does your profit cross zero?
        choices:
          - text: >
              $30$, the strike.
            feedback: >
              At $30$ the call pays $0$ and you are down the full $2.50$. The
              strike is where the *payoff* starts to rise, not where the trade
              starts to make money.
          - text: >
              $27.50$, the strike minus the premium.
            feedback: >
              Below $30$ the call pays nothing at all, so no finishing price
              under the strike can recover a premium. Subtracting the premium
              is the right move for a put, whose payoff grows as the stock
              falls.
          - text: >
              $32.50$, the strike plus the premium.
            correct: true
            feedback: >
              Above $30$ the payoff is $S_T - 30$, and it equals $2.50$ at
              $S_T = 32.50$. Every dollar above that is profit.
          - text: >
              $35$, where the payoff is twice the premium.
            feedback: >
              At $35$ the payoff is $5$ and your profit is $2.50$, already
              positive. Nothing doubles at breakeven; the payoff only has to
              repay the premium once.
        feedback: >
          Breakeven is where the payoff climbs back to the premium you paid,
          and for a long call that is the strike plus the premium.

      - part: The shape behind the four numbers
        reflect: >
          You priced the trade at $36$ and at $31$ and found where it crosses
          zero, one point at a time. Describe the whole graph of the call's payoff against $S_T$,
          and of your profit against $S_T$, so that you could read any point
          off it without arithmetic.
        answer: >
          The payoff is flat at $0$ for every $S_T$ up to $30$, then rises with
          slope $1$: two straight pieces meeting at a kink at the strike, a
          hockey stick. The profit is the same hockey stick moved down by the
          $2.50$ premium, so its flat part sits at $-2.50$ and it crosses zero
          $2.50$ to the right of the kink. Once you see the two pieces and the
          shift, every number you computed is a reading off a picture.
      - teach: >
          That picture is the payoff diagram. A call pays $(S_T - K)^{+}$,
          flat at $0$ then slope $1$, kinked at $K$; a put pays
          $(K - S_T)^{+}$, slope $-1$ below $K$ and flat at $0$ above. The
          P&L diagram is the payoff moved down by the premium paid, so a call
          bought at $c$ breaks even at $K + c$ and a put bought at $p$ at
          $K - p$. A short position is the long one flipped upside down: you
          collect the premium, and the holder's payoff is your loss.
      - ask: >
          You buy a put struck at $50$ for $3.20$. At what finishing price do
          you break even?
        expects: "46.8"
        hint: >
          Which way does the put's payoff rise as $S_T$ moves away from $50$?
        feedback: >
          The put pays $50 - S_T$ below the strike, and that equals $3.20$ at
          $S_T = 50 - 3.20 = 46.80$. The premium shifts the breakeven away
          from the strike in the direction the payoff grows.
      - ask: >
          Now you are the one who *sold* that put, for the same $3.20$. What
          is your P&L in the worst case at expiry?
        expects: "-46.8"
        hint: >
          How far can a stock price fall?
        feedback: >
          The stock cannot go below $0$, where the put pays its holder $50$.
          Your P&L is then $3.20 - 50 = -46.80$. A short put's loss is large
          but bounded: at most the strike minus the premium.
      - ask: >
          You sell the $30$ call from the start for $2.50$ instead of buying
          it. What is your worst case?
        choices:
          - text: >
              $-2.50$: the most you can lose is the premium.
            feedback: >
              That is the *buyer's* worst case. Flip the diagram: the buyer's
              unlimited upside is now your unlimited downside, and $2.50$ is
              your best case.
          - text: >
              $-27.50$: the stock can rise at most to about twice the strike.
            feedback: >
              Nothing caps the stock's rise. A stock that triples to $90$
              costs you $60 - 2.50 = 57.50$, and it could go higher still.
          - text: >
              Unlimited: you lose $1$ for every $1$ the stock rises above
              $32.50$.
            correct: true
            feedback: >
              Above the strike the slope of your P&L is $-1$ forever. This is
              the sentence to say before anyone sells a naked call.
        feedback: >
          The four single-leg pictures are a long call, a long put, and their
          two upside-down mirrors. A short put's loss stops at the strike
          minus the premium; a short call's loss has no floor.

      - part: Two legs, added vertically
        teach: >
          You own one share of the same stock, bought at $30$, and you sell a
          call struck at $33$ for $1.10$. Both legs are settled at the same
          expiry.
      - ask: >
          The stock finishes at $S_T = 40$. What is the total P&L of the two
          legs together?
        expects: "4.1"
        hint: >
          Price each leg separately at $40$, then add.
        feedback: >
          The share made $40 - 30 = 10$. The short call is exercised against
          you: you pay $40 - 33 = 7$ and keep the $1.10$, so that leg made
          $-5.90$. Total $10 - 5.90 = 4.10$.
      - ask: >
          What is the slope of the combined P&L for finishing prices above
          $33$?
        choices:
          - text: >
              $1$, because you still own the share.
            feedback: >
              The share contributes slope $+1$, but above $33$ the short call
              contributes $-1$. You have to add every leg that is live in that
              region.
          - text: >
              $0$: the share's $+1$ and the short call's $-1$ cancel.
            correct: true
            feedback: >
              So the P&L is flat above $33$: you get $4.10$ at $40$, at $50$,
              at $100$. Selling the call sold your upside.
          - text: >
              $-1$, because the short call loses without bound.
            feedback: >
              On its own the short call does. Here the share you own rises one
              for one with it, so the losses are covered. That is why this
              combination is called a covered call.
        feedback: >
          Adding legs means adding slopes region by region: between kinks
          every leg is a straight line, so the total is too.
      - ask: >
          At what finishing price does the two-leg position break even?
        expects: "28.9"
        hint: >
          Below $33$ the call expires worthless and only the share moves. How
          far must it fall to use up the $1.10$?
        feedback: >
          On the slope-$1$ piece the P&L is $S_T - 30 + 1.10$, which is zero at
          $S_T = 28.90$. The premium you collected lowered the breakeven of
          the share by $1.10$; it did not come free, because it cost you every
          dollar above $33$.
      - teach: >
          The whiteboard version, for any strategy: draw each leg as a kinked
          line, add the lines region by region between the strikes, shift by
          the net premium, and read off the three numbers the interviewer
          wants — max profit, max loss, and every point where the total
          crosses zero. Say which legs are live in each region as you go.

  - node: quant-finance.options.intrinsic-time-value
    hook: >
      "Is this option cheap" is really asking you to split its price into
      what you'd get by exercising today and what you're paying for the
      time left on the clock.
    explanation: >
      Intrinsic value is what the option would pay if $T$ were now:
      $(S-K)^{+}$ for a call, $(K-S)^{+}$ for a put — read directly off the
      payoff diagram at the current spot. Time value is whatever price sits
      above that: price minus intrinsic. Moneyness names where $S$ sits
      relative to $K$ — in the money when exercising now would pay off
      ($S>K$ for a call, reversed for a put), at the money when
      $S\approx K$, out of the money otherwise — and is often quoted in
      standard deviations of the remaining move, $\ln(S/K)/(\sigma\sqrt{T})$,
      so a reading of $1$ means one sigma in the money regardless of the
      stock's actual level.

      Time value is largest at the money and shrinks to $0$ at expiry in
      every case, because deep in or out of the money there is little left
      to be uncertain about. For a call it never goes negative: owning the
      call always beats owning a forward-equivalent claim on the stock
      financed by borrowing $Ke^{-rT}$, since the call lets you walk away if
      the stock falls, so $C\ge(S-Ke^{-rT})^{+}$ and intrinsic value
      $(S-K)^{+}$ sits at or below that bound.

      A European put can break this pattern — deep in the money, its
      holder is waiting on a strike that only arrives at $T$, discounted,
      so the put can trade below its own intrinsic value even though the
      call cannot.
    worked: >
      A stock trades at $S=54$; a call struck at $K=50$ costs $6.5$.
      Intrinsic value is $54-50=4$, so time value is $6.5-4=2.5$. A put
      struck at $K=50$ on the same stock costs $1.2$; its intrinsic value
      is $0$ (out of the money), so its entire price, $1.2$, is time value.
    interview: >
      Interviewers ask you to name the split cold — "how much of this
      premium is time value" — to check you know intrinsic value is a
      payoff-diagram readout, not a pricing model, and that time value's
      peak at the money is why at-the-money strikes carry the most premium.
    pitfalls: >
      Applying the nonnegative-time-value bound to puts is the standard
      trap — it holds for calls on a non-dividend stock but not for
      European puts, which can trade below intrinsic when deep in the
      money. Confusing "in the money" with "profitable" is another.
    recap: >
      Price splits into intrinsic value (the payoff if exercised now) plus
      time value (the rest), fattest at the money and gone at expiry.
    dialogue:
      - part: Three calls on one stock
        teach: >
          A stock trades at $47$. Three-month calls on it are quoted at three
          strikes: the $40$ call at $8.10$, the $47$ call at $2.60$ and the
          $55$ call at $0.40$. Rates are zero.
      - ask: >
          Suppose the $40$ call could be exercised right now. By how much does
          its price of $8.10$ exceed what exercising would pay?
        expects: "1.1"
        hint: >
          Exercising means buying at $40$ a share worth $47$.
        feedback: >
          Exercising pays $(47 - 40)^{+} = 7$, and $8.10 - 7 = 1.10$. Nobody
          would sell the call for less than $7$, since it can be turned into
          $7$; the extra $1.10$ buys something else.
      - ask: >
          The $55$ call would pay nothing if exercised now, yet it costs
          $0.40$. What is the buyer paying for?
        choices:
          - text: >
              Nothing: it is mispriced, and should trade at $0$.
            feedback: >
              Three months is long enough for a stock at $47$ to pass $55$.
              A claim that pays something in some outcomes and never costs
              its holder anything must have a positive price.
          - text: >
              The chance that the stock rises above $55$ before expiry.
            correct: true
            feedback: >
              All of its $0.40$ pays for what might still happen. None of it
              pays for what has already happened.
          - text: >
              A deposit toward the $55$ strike, refunded on exercise.
            feedback: >
              The premium is never refunded: on exercise you pay the full
              $55$ on top of it. It is the price of the right, not a part of
              the strike.
        feedback: >
          Each price splits into what the option is worth if it expired now,
          and a remainder paid for the uncertainty still ahead.
      - ask: >
          Which of the three calls carries the largest remainder, price minus
          what exercising now would pay?
        choices:
          - text: >
              The $40$ call, because it is the most expensive.
            feedback: >
              Most of its $8.10$ is the $7$ it is already worth. Its remainder
              is only $1.10$.
          - text: >
              The $47$ call, with $2.60$.
            correct: true
            feedback: >
              Exercise now pays $0$, so all $2.60$ is remainder. Against $1.10$
              for the $40$ call and $0.40$ for the $55$ call, the strike at
              the current price carries the most.
          - text: >
              The $55$ call, because all of its price is remainder.
            feedback: >
              All of it, but there is only $0.40$ of it. The stock has to
              travel $8$ just to make that call worth anything.
        feedback: >
          The remainder is largest where the stock sits at the strike and
          shrinks in both directions.
      - reflect: >
          Say what the two pieces of every option price are, and why the
          second piece is biggest when the stock sits at the strike and small
          far from it on either side.
        answer: >
          The first piece is what exercising now would pay, $(S - K)^{+}$ for
          a call; the second is everything above that, the price of the
          remaining uncertainty. Far in the money the option behaves almost
          like the stock and far out of the money it is almost surely
          worthless, so in both cases little is left to be uncertain about.
          At the strike, whether it finishes in or out is a coin flip, and
          that is where the uncertainty is worth most.

      - part: Names for the pieces
        teach: >
          The first piece is the *intrinsic value*: $(S - K)^{+}$ for a call,
          $(K - S)^{+}$ for a put. The second is the *time value*, price minus
          intrinsic. A call is in the money when $S > K$, at the money when
          $S \approx K$, out of the money when $S < K$, and the reverse for a
          put. Desks also quote moneyness in standard deviations of the
          remaining move, $\ln(S/K)/(\sigma\sqrt{T})$.
      - ask: >
          The three-month put struck at $50$ on the same stock costs $3.90$.
          What is its time value?
        expects: "0.9"
        hint: >
          A put's intrinsic value is $(K - S)^{+}$.
        feedback: >
          Intrinsic value is $(50 - 47)^{+} = 3$, so time value is
          $3.90 - 3 = 0.90$. A strike above the stock price puts a put in the
          money and a call, like the $55$ call, out of it.
      - ask: >
          With $\sigma\sqrt{T} = 0.2$ for these three months, how many
          standard deviations in the money is the $40$ call? Use
          $\ln(47/40) \approx 0.161$.
        expects: "0.805"
        tolerance: 0.01
        feedback: >
          $0.161 / 0.2 \approx 0.81$. Under one standard deviation in the
          money, which is why it still carries $1.10$ of time value; a call
          three standard deviations in would carry almost none.
      - ask: >
          Three months pass and the stock is still at $47$ on the expiry date.
          What is the time value of the $47$ call now?
        expects: "0"
        feedback: >
          At expiry the price is the payoff, so price and intrinsic value
          coincide and the time value is $0$, for every option and every
          strike. Time value always decays to nothing by the end.

      - part: A put worth less than its exercise value
        teach: >
          A different stock trades at $20$. A one-year *European* put on it
          struck at $60$ can be exercised only at expiry, and $e^{-0.05}
          \approx 0.9512$ discounts one year at $r = 5\%$. Take the stock as
          certain to stay below $60$.
      - ask: >
          Then the put pays $60 - S_T$ for sure. Holding one share pays $S_T$,
          so the put is worth today what $60$ received in a year is worth,
          minus the share. What is that?
        expects: "37.07"
        tolerance: 0.01
        feedback: >
          $60(0.9512) - 20 = 57.07 - 20 = 37.07$. The strike is only paid in a
          year, so today it counts at its discounted value.
      - ask: >
          Its intrinsic value is $60 - 20 = 40$. What does a put worth about
          $37.07$ tell you?
        choices:
          - text: >
              An arbitrage: buy the put for $37.07$ and exercise it for $40$.
            feedback: >
              A European put cannot be exercised today. Its $40$ is not on
              offer until expiry, by which time it is worth only $37.07$ in
              today's money.
          - text: >
              Its time value is negative, about $-2.93$, and that is a fair
              price.
            correct: true
            feedback: >
              $37.07 - 40 = -2.93$: the cost of waiting a year for the strike.
              Deep in the money, a European put's time value can go below
              zero.
          - text: >
              The discounting is wrong; time value can never be negative.
            feedback: >
              That rule is true of a call on a stock paying no dividends, not
              of a put. Here the put's value really does sit below what
              exercising today would pay.
        feedback: >
          The put's holder is waiting on cash, and waiting on cash costs
          interest. The call's holder is waiting to *pay* cash, which runs the
          other way.
      - ask: >
          A European call on a stock paying no dividends trades below its
          intrinsic value $(S - K)^{+}$. What follows?
        choices:
          - text: >
              Nothing unusual: deep in the money, calls behave like puts.
            feedback: >
              A call's holder pays the strike later, which helps them. Holding
              the call beats holding the share financed by borrowing
              $Ke^{-rT}$, so $C \ge S - Ke^{-rT} \ge S - K$.
          - text: >
              The call is mispriced, and an arbitrage exists.
            correct: true
            feedback: >
              $C \ge (S - Ke^{-rT})^{+} \ge (S - K)^{+}$ whenever $r \ge 0$.
              Buy the call, short the share and lend $Ke^{-rT}$, and you lock
              in a profit. A call's time value never goes negative.
          - text: >
              It means the stock is about to fall.
            feedback: >
              Prices are not forecasts. Whatever the stock is about to do, a
              call below $S - Ke^{-rT}$ hands you a riskless profit.
        feedback: >
          Price is intrinsic value plus time value. Time value is largest at
          the money, zero at expiry, never negative for a call on a stock
          without dividends, and can be negative for a deep in-the-money
          European put.

  - node: quant-finance.options.binomial-pricing
    hook: >
      Being handed $u$, $d$, a strike and asked to price an option live,
      with no distribution given, is the single most common opening move
      in an options interview — and the two-equation solve below is the
      entire answer.
    explanation: >
      To price any payoff on a one-period model, look for the portfolio of
      $\Delta$ shares and $B$ in cash that reproduces the option's payoff
      in both the up and down states, then invoke the law of one price:
      two portfolios with identical payoffs in every state must carry
      identical costs today, so the option's price is whatever the
      replicating portfolio costs to build. Two equations, two unknowns —
      match the up state, $\Delta\cdot uS+B=V_u$, and the down state,
      $\Delta\cdot dS+B=V_d$, and subtract to isolate the share count:
      $\Delta=(V_u-V_d)/(S(u-d))$, the ratio of the payoff's spread to the
      stock's own spread. Plug $\Delta$ back into either equation to solve
      for $B$; the price is $\Delta S+B$ today.

      Two features of this recipe carry forward through the rest of the
      unit: it never asks how likely the up move is, only what the
      payoffs are in the two states, so it prices any payoff you can name
      state by state, not just plain calls, by the identical two-equation
      solve. And if the market quotes anything other than $\Delta S+B$,
      you buy the cheap side, sell the replicating portfolio, and collect
      the gap risklessly — which is exactly why the market price cannot
      differ from it.
    worked: >
      Take a put with $S=100$, up to $uS=125$ or down to $dS=75$, strike
      $K=100$, one period, $r=0$. The put pays $P_u=0$ up and $P_d=25$
      down, so $\Delta=(0-25)/(100(1.25-0.75))=-0.5$: short half a share.
      Matching the down state, $-0.5(75)+B=25$ gives $B=62.5$; check the
      up state, $-0.5(125)+62.5=0$. The portfolio costs
      $-0.5(100)+62.5=12.5$, so the put is worth $12.5$.
    interview: >
      You'll be handed $u$, $d$, $r$ and a payoff and asked to price it
      live, usually with round numbers so the arithmetic is the point —
      the interviewer is checking that you reach for $\Delta$ and $B$
      immediately, and that you can say in one sentence why the real
      probability of an up move never appears.
    pitfalls: >
      Writing $\Delta=(V_u-V_d)/(uS-dS)$ with $S$ dropped from one factor
      is the most common slip — the denominator is the stock's own spread,
      $S(u-d)$. Reusing a call's $\Delta$ for a put instead of
      recomputing it (it comes out negative — short stock) is another.
    recap: >
      The option's price is the cost of the $\Delta$ shares and $B$ cash
      that reproduce its payoff in both states, solved from two linear
      equations, with no probability anywhere in the calculation.
    dialogue:
      - part: A call nobody agrees on
        teach: >
          A stock trades at $50$. In one month it will be at $60$ or at $40$,
          nothing else. Cash can be borrowed or lent at zero interest. A
          dealer makes a market in the one-month call struck at $45$.
      - ask: >
          What does the call pay if the stock goes up to $60$?
        expects: "15"
        feedback: >
          $(60 - 45)^{+} = 15$. In the down state it pays $(40 - 45)^{+} = 0$.
      - ask: >
          You think the up move has probability $0.7$; your colleague thinks
          $0.4$. Your expected payoffs are $10.50$ and $6$. What is the call
          worth?
        choices:
          - text: >
              $10.50$, if your forecast is the better one.
            feedback: >
              Your colleague says $6$ with the same confidence. A price that
              depends on whose forecast wins is an opinion, and there is no
              way to settle it before the month is out.
          - text: >
              $8.25$, the average of the two views.
            feedback: >
              Averaging two opinions gives a third opinion. Add a trader who
              believes $0.9$ and the "price" moves again.
          - text: >
              None of these is a number either of you would have to accept.
            correct: true
            feedback: >
              Every number here rests on a probability nobody can verify. If
              the call has a price that binds everyone, it has to come from
              something both of you can trade today.
        feedback: >
          Expected payoff is a belief, and beliefs differ. Something else has
          to pin the price.
      - reflect: >
          Besides the call you can trade the stock and borrow or lend cash.
          Is there a way to build the call's payoff — $15$ if up, $0$ if down
          — out of those two things? What exactly would you have to match?
        answer: >
          Hold some number $\Delta$ of shares and some cash $B$. That pays
          $60\Delta + B$ if up and $40\Delta + B$ if down. Set those equal to
          $15$ and $0$: two equations, two unknowns. If they solve, the
          portfolio pays exactly what the call pays in every state, so it
          must cost what the call costs, and nobody's probability enters.

      - part: Building the call from stock and cash
        ask: >
          The call's payoff swings by $15$ between the two states. How many
          shares give your portfolio the same swing?
        expects: "0.75"
        hint: >
          One share swings from $40$ to $60$. Cash does not swing at all.
        feedback: >
          One share swings by $20$, so you need $15/20 = 0.75$ shares. Cash
          shifts both states equally and cannot change the swing.
      - ask: >
          How much cash $B$ makes the portfolio pay exactly $0$ in the down
          state? A negative number means borrowing.
        expects: "-30"
        feedback: >
          $0.75(40) + B = 0$ gives $B = -30$: borrow $30$. Check the up state:
          $0.75(60) - 30 = 15$, the call's payoff.
      - ask: >
          What does that portfolio cost today?
        expects: "7.5"
        feedback: >
          $0.75(50) - 30 = 37.50 - 30 = 7.50$. You and your colleague must
          both accept $7.50$, whatever you each believe about the up move.
      - teach: >
          That is pricing by replication. With payoffs $V_u$ and $V_d$ on a
          stock moving from $S$ to $uS$ or $dS$, hold
          $\Delta = (V_u - V_d)/(S(u - d))$ shares, choose the cash $B$ so one
          state matches (the other then matches automatically), and the price
          is the portfolio's cost, $\Delta S + B$. If the option trades at any
          other price, you trade it against the portfolio and keep the
          difference.
      - ask: >
          The dealer offers the call at $6.50$. Which trade locks in a profit
          with no risk?
        choices:
          - text: >
              Buy the call and hold it: it is cheap.
            feedback: >
              Cheap, but held alone it pays $0$ in the down state and you lose
              $6.50$. A profit that depends on the up move is a bet.
          - text: >
              Sell the call, buy $0.75$ shares and borrow $30$.
            feedback: >
              That sells for $6.50$ something that costs $7.50$ to rebuild:
              you lock in a loss of $1$. Buy the cheap side, sell the
              expensive one.
          - text: >
              Buy the call, short $0.75$ shares and lend $30$.
            correct: true
            feedback: >
              Today you receive $37.50$, lend $30$ and pay $6.50$, keeping
              $1$. At expiry the call, the loan and the short shares net to
              zero in both states: up, $15 + 30 - 45 = 0$; down,
              $0 + 30 - 30 = 0$.
        feedback: >
          At any price other than $7.50$, one side of the trade is cheap and
          the replicating portfolio lets you own it riskless. That is why
          $7.50$ is the price and not a guess.

      - part: The same recipe on a put
        ask: >
          Same stock, $50$ going to $60$ or $40$. A put struck at $52$ pays
          $0$ if up and $12$ if down. What is its replicating $\Delta$?
        expects: "-0.6"
        hint: >
          Payoff in the up state minus payoff in the down state, over the
          stock's own swing.
        feedback: >
          $\Delta = (0 - 12)/20 = -0.6$: short $0.6$ shares. A put falls as
          the stock rises, so its hedge is a short position.
      - ask: >
          What is the put worth today?
        expects: "6"
        hint: >
          Choose the cash so the up state pays $0$, then price the portfolio.
        feedback: >
          $-0.6(60) + B = 0$ gives $B = 36$, and the down state checks:
          $-0.6(40) + 36 = 12$. The cost is $-0.6(50) + 36 = 6$.
      - ask: >
          A colleague prices the $45$ call as a move of $u = 1.2$ to
          $d = 0.8$ and writes $\Delta = 15/(1.2 - 0.8) = 37.5$. What went
          wrong?
        choices:
          - text: >
              Nothing: $37.5$ shares is correct, the call is leveraged.
            feedback: >
              A call can never need more shares than one: its payoff never
              rises faster than the stock. $37.5$ shares would swing by $750$
              to match a payoff that swings by $15$.
          - text: >
              The denominator should be the stock's swing, $S(u - d) = 20$.
            correct: true
            feedback: >
              $u - d = 0.4$ is a fraction; the stock moves by $50(0.4) = 20$
              in price. Dividing a price swing by a fraction gives a number in
              the wrong units.
          - text: >
              The numerator should be the expected payoff, not the swing.
            feedback: >
              $\Delta$ matches the difference between the two states, not
              their weighted average. No probability enters the hedge.
        feedback: >
          Keep both swings in price units: $\Delta = (V_u - V_d)/(uS - dS)$.

      - part: Where two instruments run out
        ask: >
          Suppose instead the stock can finish at $60$, $50$ or $40$. The
          $45$ call then pays $15$, $5$ or $0$. Can shares and cash still
          replicate it?
        choices:
          - text: >
              Yes: $0.75$ shares and $-30$ in cash, as before.
            feedback: >
              In the middle state that portfolio pays $0.75(50) - 30 = 7.50$,
              not $5$. It matches the two old states and misses the new one.
          - text: >
              No: three states give three equations in two unknowns, and
              these have no solution.
            correct: true
            feedback: >
              From $40$ to $50$ the call gains $5$, from $50$ to $60$ it gains
              $10$. Shares gain the same amount on each leg, so no share count
              fits both. The price is no longer pinned by replication alone.
          - text: >
              Yes, but only if you know the probability of each state.
            feedback: >
              Probabilities never help a replication: the portfolio has to pay
              the right amount in every state, however likely. No portfolio
              does here.
        feedback: >
          Replication needs as many independent instruments as states. With
          two states, shares and cash are enough, and that is the whole
          reason the one-step model prices exactly.
      - teach: >
          In an interview, say it in this order: match the two payoffs with
          $\Delta$ shares and cash, solve for $\Delta$ from the swings, solve
          for the cash from one state, and the cost of the portfolio is the
          price — then add that the probability of the up move never entered.

  - node: quant-finance.options.risk-neutral
    hook: >
      Once you can price by replication, risk-neutral pricing is the same
      number reached by a shortcut — discount an expectation instead of
      solving for $\Delta$ and $B$ each time — and interviewers expect you
      to derive that shortcut, not just quote it.
    explanation: >
      No-arbitrage in the one-step model requires the stock's two possible
      growth factors to straddle the riskless one: $d<e^{r\Delta t}<u$. If
      $e^{r\Delta t}\ge u$ the stock never beats the bond, so short the
      stock and lend at $r$ for a riskless profit in both states; if
      $e^{r\Delta t}\le d$ the reverse trade works. Inside that band,
      define $q=(e^{r\Delta t}-d)/(u-d)$, which lands in $(0,1)$ precisely
      because of the band condition.

      Substitute the replicating hedge $\Delta=(V_u-V_d)/(S(u-d))$ and its
      matching $B$ into the price $\Delta S+B$ and collect terms in $V_u$
      and $V_d$: the algebra collapses to
      $V_0=e^{-r\Delta t}(qV_u+(1-q)V_d)$ for every payoff, with the same
      $q$ regardless of what $V$ is. So "replicate and price the hedge"
      and "discount the expectation under $q$" are the identical
      calculation, not two theories.

      The other way to find $q$ confirms this: it is the unique weight
      making the discounted stock price itself a martingale,
      $q\,uS+(1-q)\,dS=Se^{r\Delta t}$, i.e. the stock's expected growth
      under $q$ is exactly the riskless rate. That property is what makes
      $q$ portable to every derivative on the same stock, so you compute
      it once per model and reuse it for calls, puts, or anything else.
    worked: >
      Take $u=1.1$, $d=0.9$, and a riskless growth factor over the period
      of $e^{r\Delta t}=1.02$. Then $q=(1.02-0.9)/(1.1-0.9)=0.12/0.2=0.6$.
      Price a claim paying $V_u=8$ up and $V_d=2$ down:
      $V_0=(0.6(8)+0.4(2))/1.02=5.6/1.02\approx 5.49$.
    interview: >
      "Derive risk-neutral pricing" means show the substitution — that
      discounting under $q$ falls out of the replication algebra — not
      just recite $q=(e^{r\Delta t}-d)/(u-d)$; naming the martingale
      property of the discounted stock as the second characterization
      separates a memorized formula from an understood one.
    pitfalls: >
      Using the real-world probability of an up move anywhere in this
      formula is the single most common error — $q$ is a pricing weight
      fixed by $u$, $d$, $r$, never a forecast. A computed $q$ outside
      $(0,1)$ is a red flag that the inputs admit arbitrage.
    recap: >
      $q=(e^{r\Delta t}-d)/(u-d)$ is the unique weight making the
      discounted stock a martingale, and discounting a payoff's expectation
      under $q$ is algebraically the same number replication produces.
    dialogue:
      - part: Three claims, one stock
        teach: >
          A stock trades at $50$ and in one period will be at $60$ or at $45$.
          Cash grows by the factor $e^{r\Delta t} = 1.02$ over the period, so
          $B$ in cash today is $1.02B$ at the end.
      - ask: >
          Price the call struck at $50$, which pays $10$ if up and $0$ if down,
          by replicating it with shares and cash.
        expects: "3.92"
        tolerance: 0.01
        hint: >
          The shares come from the swings as before. For the cash, the down
          state needs $45\Delta + 1.02B = 0$.
        feedback: >
          $\Delta = 10/15 = 2/3$. Then $(2/3)(45) + 1.02B = 0$ gives
          $B = -30/1.02 \approx -29.41$. The cost is
          $(2/3)(50) - 29.41 \approx 33.33 - 29.41 = 3.92$.
      - ask: >
          Now a claim that pays $1$ if the stock goes up and $0$ if it goes
          down. What is it worth today?
        expects: "0.392"
        tolerance: 0.001
        hint: >
          Same recipe: the swing is $1$ against the stock's $15$.
        feedback: >
          $\Delta = 1/15$ and $(1/15)(45) + 1.02B = 0$ gives
          $B = -3/1.02 \approx -2.941$. The cost is
          $50/15 - 2.941 \approx 3.333 - 2.941 = 0.392$. The call pays $10$
          of these in the up state and nothing else, and indeed
          $10(0.392) = 3.92$.
      - ask: >
          A third claim pays $1$ if the stock goes *down* and $0$ if up. Price
          it without building a portfolio.
        expects: "0.588"
        tolerance: 0.001
        hint: >
          Hold one of each claim. What do you receive, whatever happens?
        feedback: >
          One up-claim plus one down-claim pays $1$ in every state, which is
          just cash: worth $1/1.02 \approx 0.980$ today. So the down-claim is
          $0.980 - 0.392 = 0.588$.
      - reflect: >
          Any payoff $V_u$, $V_d$ is $V_u$ up-claims plus $V_d$ down-claims.
          Write its price in terms of the two claim prices — then multiply
          those two prices by $1.02$ and say what the results look like.
        hint: >
          $0.392 \times 1.02$ and $0.588 \times 1.02$.
        answer: >
          The price is $0.392\,V_u + 0.588\,V_d$. Multiplied by $1.02$ the two
          claim prices become $0.4$ and $0.6$: nonnegative and summing to
          $1$, exactly like probabilities. So every price on this stock is
          $(0.4\,V_u + 0.6\,V_d)/1.02$ — a discounted expectation, under
          weights that came out of replication, not out of anyone's forecast.

      - part: The weight that prices everything
        teach: >
          In general, replicating any payoff and collecting terms gives
          $V_0 = e^{-r\Delta t}\,(q V_u + (1 - q) V_d)$ with
          $q = (e^{r\Delta t} - d)/(u - d)$, the same $q$ whatever the
          payoff. $q$ is called the risk-neutral probability. Pricing by
          replication and pricing as a discounted expectation under $q$ are
          one calculation written two ways.
      - ask: >
          Here $u = 1.2$ and $d = 0.9$. What does the formula give for $q$?
        expects: "0.4"
        feedback: >
          $q = (1.02 - 0.9)/(1.2 - 0.9) = 0.12/0.3 = 0.4$, the number you
          found by pricing the up-claim and scaling by $1.02$.
      - ask: >
          Apply the pricing rule to the stock itself, which pays $60$ if up
          and $45$ if down. What price does it give?
        expects: "50"
        hint: >
          $(0.4 \cdot 60 + 0.6 \cdot 45)/1.02$.
        feedback: >
          $(24 + 27)/1.02 = 51/1.02 = 50$, today's price. Under $q$ the stock
          is expected to grow by exactly $1.02$, the riskless factor. That one
          equation, $q\,uS + (1 - q)\,dS = Se^{r\Delta t}$, is another way to
          find $q$: the discounted stock is a martingale under it.
      - ask: >
          Why does one $q$ price every derivative on this stock, rather than
          each needing its own?
        choices:
          - text: >
              Because $q$ is the true chance of the up move, and that is the
              same for every derivative.
            feedback: >
              The true chance never entered: $q$ came from $u$, $d$ and
              $1.02$ alone. A forecaster who thinks up is $90\%$ likely gets
              the same $q$.
          - text: >
              Because every one-step payoff is a bundle of up-claims and
              down-claims, and those two prices do not depend on the payoff.
            correct: true
            feedback: >
              Two states, two claim prices, fixed by the stock and the bond.
              Any payoff is a combination of the two claims, so its price is
              the same combination of their prices.
          - text: >
              Because every derivative is priced off the at-the-money call.
            feedback: >
              The call played no special role: the up-claim and the bond did.
              A put or a digital is priced directly from $q$, not through the
              call.
        feedback: >
          Compute $q$ once per model, then price anything on that stock in one
          line.

      - part: One line per payoff
        ask: >
          Price the put struck at $55$, which pays $0$ if up and $10$ if down.
        expects: "5.88"
        tolerance: 0.005
        feedback: >
          $(0.4 \cdot 0 + 0.6 \cdot 10)/1.02 = 6/1.02 \approx 5.88$. No
          portfolio needed.
      - ask: >
          A forward contract obliges you to buy the stock at $51$ at the end
          of the period. It pays $9$ if up and $-6$ if down. What is it worth
          today?
        expects: "0"
        feedback: >
          $(0.4 \cdot 9 + 0.6 \cdot (-6))/1.02 = (3.6 - 3.6)/1.02 = 0$. The
          price $51 = 50 \times 1.02$ is the forward price, the one strike at
          which agreeing to buy costs nothing today.

      - part: When the weight leaves the unit interval
        ask: >
          Suppose instead cash grew by $1.25$ over the period, with $u = 1.2$
          and $d = 0.9$ unchanged. The formula gives
          $q = (1.25 - 0.9)/0.3 \approx 1.17$. What has gone wrong?
        choices:
          - text: >
              Nothing: $q$ is only a weight, and weights above $1$ are allowed.
            feedback: >
              Then $1 - q$ is negative, and a claim paying $1$ in the down
              state would have a negative price: someone pays you to take a
              claim that can only pay you.
          - text: >
              The market has an arbitrage: cash beats the stock in both states.
            correct: true
            feedback: >
              $50$ in cash becomes $62.50$, more than the stock's best case of
              $60$. Short the stock, lend the proceeds, and you win in every
              state.
          - text: >
              The formula needs the real probability as well when rates are
              high.
            feedback: >
              No probability can rescue it. The problem is in the stock and
              cash prices themselves, which no probability changes.
        feedback: >
          $q$ lies strictly between $0$ and $1$ exactly when
          $d < e^{r\Delta t} < u$, which is the no-arbitrage condition for this
          model.
      - ask: >
          In that market you short one share at $50$ and lend the $50$. What
          is your smallest possible profit at the end of the period?
        expects: "2.5"
        feedback: >
          The loan returns $50 \times 1.25 = 62.50$. Buying the share back
          costs $60$ at most, so you keep at least $62.50 - 60 = 2.50$, and
          $17.50$ in the down state. Free money in both states is what $q > 1$
          was flagging.
      - teach: >
          The ten-second version: no arbitrage means $d < e^{r\Delta t} < u$;
          define $q = (e^{r\Delta t} - d)/(u - d)$; every payoff is worth its
          $q$-expectation, discounted. And $q$ is the weight under which the
          stock grows at the riskless rate — a price in disguise, not a
          forecast.

  - node: quant-finance.options.risk-neutral-vs-real
    hook: >
      "The stock is going up 90% of the time — surely the call is worth
      more than the hedge price?" is the single most repeated trap
      question in this unit, and the fix is a one-line answer.
    explanation: >
      The hedge argument never used the real probability $p$ of an up
      move — it only matched payoffs state by state. Whatever $p$
      actually is, the portfolio of $\Delta$ shares plus $B$ cash
      reproduces the option in both states, so its cost is the option's
      price regardless of how likely each state is. If the market priced
      the option away from that hedge cost because traders believed $p$
      was high or low, you would buy the cheap side and sell the expensive
      side risklessly and profit for certain — so $p$ cannot survive in
      the price without creating an arbitrage.

      The resolution is that $q$ is not a forecast at all: it is today's
      price of a bet paying $1$ in the up state, rescaled — a price,
      extracted from $S$, $u$, $d$, $r$, that happens to look like a
      probability because it is nonnegative and sums to $1$ across states.
      The real drift $p$ is already baked into today's spot price $S$: a
      stock everyone believes will rise is already bid up, and pricing the
      option off the hedge captures that belief once, through $S$, rather
      than double-counting it through $p$ as well.

      This is exactly why $\mu$, the real expected return, never appears
      in Black–Scholes while $\sigma$ does: hedging with $\Delta$ shares
      removes exposure to which direction the stock moves, so drift washes
      out of the price, but hedging cannot remove exposure to how much the
      stock moves around on the way there.
    worked: >
      Take $S=80$, up to $100$ or down to $60$, $K=80$, $r=0$. The call
      pays $20$ up, $0$ down, so $\Delta=(20-0)/(80(1.25-0.75))=0.5$ and
      $B=-30$, price $=0.5(80)-30=10$. Suppose you're told $p=0.8$: naively
      discounting that belief gives $0.8(20)+0.2(0)=16$, six above the
      hedge price. Quote $16$ and someone sells you the call at its true
      price of $10$, then trades against your hedge for a riskless $6$.
    interview: >
      Expect a version of "if the stock is 90% likely to go up, doesn't
      that make the call worth more" asked directly, to see whether you
      say no immediately and point to the hedge as the reason, rather than
      hedging your own answer with "it depends."
    pitfalls: >
      Justifying the irrelevance of $p$ with "the market is efficient" or
      "expectations are already priced in" is vague and not what's being
      tested — the precise reason is the existence of the replicating
      hedge, and you should be able to point to it directly.
    recap: >
      The replicating hedge prices the option without reference to $p$,
      because $p$'s effect is already inside today's spot price — only
      $\sigma$, which hedging cannot remove, survives into the price.
    dialogue:
      - part: An analyst who is ninety-five percent sure
        teach: >
          A stock trades at $30$ and in one month will be at $39$ or at $24$.
          Rates are zero. An analyst whose model gives the up move a
          probability of $0.95$ asks what the call struck at $30$ is worth.
      - ask: >
          The call pays $9$ if up and $0$ if down. What is its expected payoff
          under the analyst's probability?
        expects: "8.55"
        feedback: >
          $0.95 \times 9 + 0.05 \times 0 = 8.55$. That is the analyst's
          answer.
      - ask: >
          Now price the same call by replication.
        expects: "3.6"
        hint: >
          The call swings $9$ while the stock swings $15$.
        feedback: >
          $\Delta = 9/15 = 0.6$; matching the down state,
          $0.6(24) + B = 0$ gives $B = -14.40$. The cost is
          $0.6(30) - 14.40 = 18 - 14.40 = 3.60$.
      - ask: >
          The analyst buys the call from a dealer at $8.55$. The dealer hedges
          with $0.6$ shares financed by borrowing. How much does the dealer
          lock in, whatever the stock does?
        expects: "4.95"
        feedback: >
          The dealer receives $8.55$ and spends $3.60$ net on the hedge,
          keeping $4.95$. At expiry the hedge pays exactly what the dealer owes
          on the call: up, $0.6(39) - 14.40 = 9$; down,
          $0.6(24) - 14.40 = 0$. The analyst's conviction became the dealer's
          riskless profit.

      - part: Where the ninety-five percent went
        ask: >
          Suppose every trader in the market shared the analyst's $0.95$. What
          would actually change?
        choices:
          - text: >
              The call would trade at $8.55$, with the stock still at $30$.
            feedback: >
              Then every dealer would sell calls at $8.55$ and hedge them for
              $3.60$. The price cannot sit there while the hedge is available.
          - text: >
              Nothing at all: beliefs never affect prices.
            feedback: >
              Beliefs do move prices — the *stock's*. A stock that everyone
              thinks will almost surely reach $39$ does not stay at $30$.
          - text: >
              Today's stock price would be bid up toward $39$, and the call
              would be priced off that new spot.
            correct: true
            feedback: >
              The belief reaches the call through $S$. With $S$ higher and the
              same two outcomes, the replication price is higher too — counted
              once, through the stock.
          - text: >
              The risk-neutral $q$ would rise to $0.95$, with the stock still
              at $30$.
            feedback: >
              $q = (30 - 24)/(39 - 24) = 0.4$ depends only on $30$, $39$ and
              $24$. Nothing in that formula can see anyone's forecast.
        feedback: >
          The real drift is already inside today's spot price. Counting it
          again in the option would count it twice.
      - reflect: >
          Here $q = 0.4$ while the analyst says $0.95$. If $q$ is not a
          forecast, what is it? Say what it is the price of.
        answer: >
          $q$ is today's price of a claim paying $1$ in the up state, scaled
          by the riskless growth factor (here $1$, since rates are zero). It
          is read off where $30$ sits between $24$ and $39$: the stock's
          price, and nobody's view of the future, fixes it. It looks like a
          probability only because state prices are nonnegative and, scaled
          up, sum to $1$.
      - teach: >
          So the real-world probability drops out of the price. The hedge
          reproduces the option in every state, so its cost is the price
          whatever the up-probability is; a price that depended on it would
          be arbitraged against the hedge. Expected return is already inside
          today's spot. What the hedge *cannot* remove is how far apart the
          two outcomes are — the size of the move. That is why the real drift
          is absent from Black–Scholes and volatility is the input that
          matters.

      - part: What does move the price
        ask: >
          Keeping the stock at $30$, which change raises the call's price?
        choices:
          - text: >
              New research raises the up-probability from $0.95$ to $0.99$.
            feedback: >
              The hedge still costs $3.60$: neither $\Delta$ nor $B$ used the
              probability. The price does not move.
          - text: >
              The up outcome becomes $45$ instead of $39$, the down outcome
              staying at $24$.
            correct: true
            feedback: >
              A wider spread between the outcomes is more volatility, and the
              call's payoff in the up state grows while its down-state payoff
              stays at $0$.
          - text: >
              The stock's expected return rises from $8\%$ to $20\%$ a month,
              with $30$, $39$ and $24$ unchanged.
            feedback: >
              With the price and both outcomes fixed, a higher expected return
              can only mean a higher up-probability, which the hedge ignores.
        feedback: >
          Change the outcomes and the price moves; change only the odds and it
          does not.
      - ask: >
          With the up outcome at $45$, what is the call worth now?
        expects: "4.29"
        tolerance: 0.01
        hint: >
          Recompute $q$ from $30$, $45$ and $24$, then take the expected payoff
          under it.
        feedback: >
          $q = (30 - 24)/(45 - 24) = 6/21 = 2/7$ and the call pays
          $45 - 30 = 15$ if up, so the price is $15 \times 2/7 \approx 4.29$,
          up from $3.60$. A bigger move, a dearer option.
      - ask: >
          So is the real probability useless to someone trading options?
        choices:
          - text: >
              Yes: it plays no role anywhere in options trading.
            feedback: >
              It plays no role in the *price*. It plays a large role in how
              much an unhedged position expects to make: at $0.95$, the call
              bought at $3.60$ expects to pay $8.55$.
          - text: >
              No: it decides the expected profit of holding the call unhedged,
              just not the arbitrage-free price.
            correct: true
            feedback: >
              Price comes from the hedge; profit from an open position comes
              from the real world. The analyst who thinks $0.95$ should *buy*
              at $3.60$ — as a bet, with the risk that implies.
          - text: >
              It matters for pricing puts, because a put pays in the down
              state.
            feedback: >
              The put is replicated exactly as the call was, from the same two
              states. Neither price uses the probability.
        feedback: >
          The probability prices bets; the hedge prices options. The two meet
          only when you choose not to hedge.
      - teach: >
          Said aloud under pressure: "The call is priced by its hedge, which
          works in both states whatever the probability. If the price used
          $0.95$, I would sell the call and buy the hedge. The analyst's view
          is already in the stock price, and what the option pays for is the
          size of the move, not its direction."

  - node: quant-finance.options.multi-step-binomial
    hook: >
      A live pricing question rarely stops at one period — the interviewer
      adds a second step to see whether you roll the one-step rule
      backward through the tree or try to reinvent it from scratch.
    explanation: >
      Backward induction is the whole idea: build the tree of stock prices
      forward from today, then value the option backward one layer at a
      time, applying the one-step replication rule at every node using
      only that node's two children. Each node's value depends only on
      its own children, so the same $q$ computed once from $u$, $d$, $r$
      prices every node in the tree.

      The hedge is no longer static. At each node you recompute
      $\Delta=(V_u-V_d)/(S(u-d))$ using that node's own stock price and
      children's values, so the share count changes as the stock moves —
      this rebalancing is what "dynamic hedging" means, and each rebalance
      is self-financing: the cash raised or spent adjusting the hedge
      exactly matches what's required, with no extra money injected.
      Summing over all paths gives the closed form
      $e^{-rT}\sum_{k}\binom{n}{k}q^{k}(1-q)^{n-k}\,\text{payoff}(u^{k}d^{n-k}S)$,
      a discounted expectation over a binomial distribution of terminal
      states, the same $q$ throughout.

      American options need one extra check at every node: since early
      exercise is allowed, the node's value is
      $\max(\text{continuation value},\text{intrinsic value})$,
      continuation being the discounted value from holding on, intrinsic
      being what you'd collect by exercising immediately.
    worked: >
      Two steps, $u=1.2$, $d=0.8$, $S=100$, $r=0$ (so $q=0.5$), pricing a
      put struck at $K=90$. Terminal prices are $144$, $96$, $64$ with put
      payoffs $0$, $0$, $26$. The up node (children $144,96$) is worth
      $0.5(0)+0.5(0)=0$; the down node (children $96,64$) is worth
      $0.5(0)+0.5(26)=13$. Today's price is $0.5(0)+0.5(13)=6.5$.
    interview: >
      "Now do it in two steps" is the standard follow-up to a one-step
      pricing question — the interviewer wants backward induction stated
      as a general procedure, and usually a comment on why the hedge ratio
      changes at each node.
    pitfalls: >
      Reusing the root's $\Delta$ at every node instead of recomputing it
      from each node's own children is the most common error. For American
      options, forgetting to compare against intrinsic value at every
      interior node, not just at the end, misprices early-exercise value.
    recap: >
      Value a multi-step tree by applying the one-step rule backward from
      the leaves, recomputing $\Delta$ — and comparing to intrinsic value
      for American options — at every node.
    dialogue:
      - part: Two months instead of one
        teach: >
          A stock trades at $80$. Each month it is multiplied by $1.25$ or by
          $0.75$, and you look two months ahead. Rates are zero. You want the
          price of the call struck at $70$ that expires at the end of month
          two.
      - ask: >
          What is the stock price after one up move and one down move, in
          either order?
        expects: "75"
        feedback: >
          $80 \times 1.25 \times 0.75 = 75$, and the order does not matter.
          The tree recombines: after two months the stock is at $125$, $75$ or
          $45$, and the call pays $55$, $5$ or $0$.
      - ask: >
          Can you apply the one-step replication rule from today's node
          straight away?
        choices:
          - text: >
              Yes: use the payoffs $55$ and $0$, with the stock going from
              $80$ to $125$ or $45$.
            feedback: >
              That throws away the middle outcome, where the call pays $5$,
              and with it a third of the paths. Three outcomes cannot be
              matched by one fixed holding of shares and cash.
          - text: >
              Yes: average the three payoffs with weights one third each.
            feedback: >
              That is a guess at probabilities, and replication never uses
              them. It also ignores that you can trade again after one month.
          - text: >
              No: one month from now the call is not paying anything yet, so
              its values there are unknown.
            correct: true
            feedback: >
              The one-step rule needs the option's value in both states one
              step ahead. At the end of month one those values are themselves
              option prices you have not computed.
        feedback: >
          Today's node has children whose values are still unknown. The fix
          is in the order you work.
      - reflect: >
          How could you find the call's value at the two nodes one month from
          now, and then today's value?
        answer: >
          Each month-one node is a one-step problem of its own: its two
          children are expiry nodes, where the call's value is just its
          payoff. Price those two one-step problems first. Then today's node
          is a one-step problem whose children now have known values. Start at
          expiry and sweep backwards, one layer at a time.

      - part: Sweeping backwards
        ask: >
          Here $q = (1 - 0.75)/(1.25 - 0.75) = 0.5$ at every node. What is the
          call worth at the month-one node where the stock is $100$?
        expects: "30"
        feedback: >
          Its children are $125$ and $75$, where the call pays $55$ and $5$.
          So the node is worth $0.5(55) + 0.5(5) = 30$.
      - ask: >
          What is it worth at the month-one node where the stock is $60$?
        expects: "2.5"
        feedback: >
          Children $75$ and $45$, payoffs $5$ and $0$:
          $0.5(5) + 0.5(0) = 2.50$.
      - ask: >
          What is the call worth today?
        expects: "16.25"
        feedback: >
          $0.5(30) + 0.5(2.50) = 16.25$. Each step used only the one-step rule
          and a node's own two children.
      - teach: >
          This is backward induction on a recombining tree: value the payoff
          at expiry, then roll back one layer at a time with
          $V = e^{-r\Delta t}(qV_u + (1 - q)V_d)$, the same $q$ at every node.
          Unrolled over $n$ steps it is one discounted expectation,
          $e^{-rT}\sum_{k}\binom{n}{k}q^{k}(1-q)^{n-k}\,\text{payoff}(u^{k}d^{n-k}S)$.
          An American option uses the same sweep with each node's value
          replaced by the larger of holding on and exercising there.
      - ask: >
          In that sum, what total weight does the middle expiry price, $75$,
          receive?
        expects: "0.5"
        hint: >
          Two different paths lead to it.
        feedback: >
          $\binom{2}{1}(0.5)(0.5) = 0.5$, against $0.25$ for each end. So
          $0.25(55) + 0.5(5) + 0.25(0) = 16.25$, the same price in one line.

      - part: A hedge that has to move
        ask: >
          Today's replicating share count uses today's two children, worth
          $30$ at a stock price of $100$ and $2.50$ at $60$. What is it?
        expects: "0.6875"
        feedback: >
          $\Delta_0 = (30 - 2.50)/(100 - 60) = 27.5/40 = 0.6875$. Matching the
          down node, $0.6875(60) + B = 2.50$ gives $B = -38.75$, and the cost
          $0.6875(80) - 38.75 = 16.25$ agrees with the sweep.
      - ask: >
          After an up move the stock is at $100$. What share count replicates
          the call from that node to expiry?
        expects: "1"
        feedback: >
          $\Delta_u = (55 - 5)/(125 - 75) = 1$. Both children are in the money,
          so the call now moves one for one with the stock.
      - ask: >
          Suppose you skip the rebalance and keep $0.6875$ shares from the up
          node, with the portfolio still worth $30$ there. By how much does
          your portfolio fall short of the call's payoff if the stock then
          goes to $125$?
        expects: "7.81"
        tolerance: 0.01
        hint: >
          At the up node your cash is $30 - 0.6875(100)$.
        feedback: >
          Your cash is $30 - 68.75 = -38.75$. At $125$ the portfolio is
          $0.6875(125) - 38.75 = 47.19$ against a payoff of $55$: short by
          $7.81$. At $75$ it would be over by the same amount. A frozen hedge
          is a bet.
      - ask: >
          Rebalancing at the up node means buying $0.3125$ more shares at
          $100$. Where does the $31.25$ come from?
        choices:
          - text: >
              You put in $31.25$ of new money, so the call really costs more
              than $16.25$.
            feedback: >
              If rebalancing needed fresh money, the price would have to
              include it. It does not: the extra shares are paid for inside
              the portfolio.
          - text: >
              You borrow $31.25$ more; the portfolio is still worth $30$, and
              no money enters or leaves.
            correct: true
            feedback: >
              Cash goes from $-38.75$ to $-70$ and you hold $1$ share:
              $100 - 70 = 30$. The rebalance is self-financing, so $16.25$
              today really does cover everything.
          - text: >
              You sell part of the call to fund the shares.
            feedback: >
              The hedger is replicating the call, not trading it. The
              portfolio funds its own adjustments with cash.
        feedback: >
          Recompute $\Delta$ at every node from that node's own children, and
          finance each change with cash inside the portfolio. That is dynamic
          hedging.
      - teach: >
          The interview version: build the tree forward, value the payoff at
          expiry, roll back with $q$ node by node, and the root is the price.
          Then say the hedge changes at every node, each rebalance paying for
          itself — and, for an American option, that each node is the larger
          of its rolled-back value and its exercise value.

  - node: quant-finance.options.binomial-convergence
    hook: >
      "Why does a 50-step tree already match Black–Scholes to the penny"
      is worth a one-paragraph answer, since it's the cheapest honest
      derivation of the formula you'll ever need.
    explanation: >
      The Cox–Ross–Rubinstein calibration ties the tree's step size to the
      stock's volatility: with $n$ steps of length $\Delta t=T/n$, set
      $u=e^{\sigma\sqrt{\Delta t}}$ and $d=1/u$, so each step multiplies
      $\ln S$ by $\pm\sigma\sqrt{\Delta t}$. Under this choice
      $\ln(S_T/S_0)$ is a sum of $n$ independent steps of that size, with
      risk-neutral probability $q$ close to $1/2$ — and a sum of many
      small, independent, identically-scaled steps is exactly the setting
      where a bell-shaped limit emerges, the same mechanism behind any
      large sum of small independent effects.

      That limit is normal with mean $(r-\sigma^{2}/2)T$ and variance
      $\sigma^{2}T$: the variance check is immediate, since each step
      contributes $(\sigma\sqrt{\Delta t})^{2}=\sigma^{2}\Delta t$ and there
      are $n$ of them, giving $n\sigma^{2}\Delta t=\sigma^{2}T$ exactly,
      independent of $n$. A normal log-price is precisely the lognormal
      stock price, so the tree's terminal distribution converges to the
      same lognormal law Black–Scholes integrates against, and the tree
      price converges to the Black–Scholes price, at a rate of about
      $1/n$ with a characteristic oscillation between odd and even $n$.
    worked: >
      Take $\sigma=0.2$, $T=1$, $n=4$ steps, so $\Delta t=0.25$ and each
      step size is $\sigma\sqrt{\Delta t}=0.2(0.5)=0.1$. The variance of
      $\ln(S_T/S_0)$ accumulated over the $4$ steps is $4(0.1)^{2}=0.04$,
      exactly matching the continuous-time target
      $\sigma^{2}T=(0.2)^{2}(1)=0.04$ — the discretization already has the
      right total variance no matter how coarse $n$ is.
    interview: >
      This is asked as "why does the tree converge to Black–Scholes" —
      naming the CRR calibration and the variance-matching argument in two
      sentences is a strong answer; "it just does" is not.
    pitfalls: >
      Assuming any choice of $u,d$ with $ud=1$ converges to the right
      limit is wrong — the specific scaling $u=e^{\sigma\sqrt{\Delta t}}$
      is what matches the variance term by term; other calibrations
      converge to a different, or no, limit.
    recap: >
      Scaling each step by $u=e^{\sigma\sqrt{\Delta t}}$ keeps the total
      variance pinned at $\sigma^{2}T$ for every $n$, so the tree's
      terminal price turns lognormal and its value converges to
      Black–Scholes.
    dialogue:
      - part: Choosing the step size
        teach: >
          You will price a one-year option on a binomial tree. The stock's
          annual volatility is $30\%$, so over the year $\ln(S_T/S_0)$ should
          have standard deviation $0.3$. Each step moves $\ln S$ up or down by
          the same amount $h$, with the two moves roughly equally likely, and
          you must choose $h$.
      - ask: >
          With $9$ steps, the variance of $\ln(S_T/S_0)$ is about $9h^{2}$.
          What $h$ makes the year's standard deviation $0.3$?
        expects: "0.1"
        feedback: >
          $9h^{2} = 0.09$ gives $h = 0.1$, so $u = e^{0.1}$ and $d = e^{-0.1}$.
      - ask: >
          Now you refine the tree to $900$ steps over the same year. What $h$
          keeps the year's standard deviation at $0.3$?
        expects: "0.01"
        feedback: >
          $900h^{2} = 0.09$ gives $h = 0.01$. A hundred times more steps needs
          steps ten times smaller: $h$ shrinks like the square root of the
          step length.
      - ask: >
          A colleague keeps $u = 1.1$ and $d = 1/1.1$ whatever the number of
          steps, and runs $900$ of them. What happens to the year's standard
          deviation of $\ln(S_T/S_0)$? Use $\ln 1.1 \approx 0.095$.
        choices:
          - text: >
              It stays near $0.3$: a step of $10\%$ is a reasonable size.
            feedback: >
              Reasonable for one step out of nine. Over $900$ independent
              steps the variance adds up: $900(0.095)^{2} \approx 8.1$.
          - text: >
              It grows to about $\sqrt{900}(0.095) \approx 2.9$, a stock with
              $290\%$ volatility.
            correct: true
            feedback: >
              Variance grows with the number of steps unless each step shrinks
              to compensate. The finer tree is modelling a different, wildly
              more volatile stock.
          - text: >
              It shrinks toward $0$, because the up and down moves cancel.
            feedback: >
              They cancel on average, which is why the *mean* stays small. The
              spread is a sum of squares, and squares never cancel.
        feedback: >
          The step size has to be tied to the step length, or refining the
          tree changes the stock.
      - reflect: >
          Say how $h$ must depend on the step length $\Delta t = T/n$ so the
          year's variance comes out the same for every $n$. Then say what
          shape you expect the distribution of $\ln(S_T/S_0)$ to take as $n$
          grows.
        answer: >
          The variance is $n h^{2}$, so it equals $\sigma^{2}T$ for every $n$
          exactly when $h = \sigma\sqrt{\Delta t}$. And $\ln(S_T/S_0)$ is then a
          sum of $n$ independent, identically sized small steps — the setting
          of the central limit theorem — so it tends to a normal. A normal log
          price means a lognormal stock price, the one Black–Scholes assumes.

      - part: The lognormal limit
        teach: >
          This is the Cox–Ross–Rubinstein calibration: $u = e^{\sigma\sqrt{\Delta t}}$,
          $d = 1/u$, and then
          $q \approx 1/2 + \tfrac{r - \sigma^{2}/2}{2\sigma}\sqrt{\Delta t}$.
          As $n \to \infty$, $\ln(S_T/S_0)$ tends to a normal with mean
          $(r - \sigma^{2}/2)T$ and variance $\sigma^{2}T$, so $S_T$ is
          lognormal and the tree price converges to the Black–Scholes price,
          with error shrinking roughly like $1/n$.
      - ask: >
          Which result turns the sum of $n$ independent $\pm\sigma\sqrt{\Delta t}$
          steps into a normal?
        choices:
          - text: >
              The law of large numbers.
            feedback: >
              That governs the *average* of the steps, which goes to a
              constant. Here the sum is kept at a fixed variance $\sigma^{2}T$,
              and its *shape* is the question.
          - text: >
              The central limit theorem.
            correct: true
            feedback: >
              Many small independent steps, scaled so the total variance stays
              fixed: exactly its hypothesis. Normal in the limit, whatever the
              shape of one step.
          - text: >
              The lognormal is assumed, so no limit theorem is needed.
            feedback: >
              The tree assumes only two-point steps. The lognormal is what
              comes *out* of the limit, which is why this is the honest
              derivation of the continuous model.
        feedback: >
          The tree is a random walk in $\ln S$, and its limit is normal for the
          same reason any well-scaled sum of small effects is.
      - ask: >
          On the $9$-step tree with $r = 6.5\%$, the formula gives
          $q \approx 0.5111$. Each step adds $+0.1$ or $-0.1$ to $\ln S$. What
          is the mean of $\ln(S_T/S_0)$ over the year?
        expects: "0.02"
        tolerance: 0.0005
        hint: >
          One step has mean $q(0.1) + (1 - q)(-0.1) = (2q - 1)(0.1)$.
        feedback: >
          One step has mean $(2(0.5111) - 1)(0.1) \approx 0.00222$, and nine
          of them give $0.02$. That is $(r - \sigma^{2}/2)T = 0.065 - 0.045$:
          the tree's drift in $\ln S$ is already the limit's.

      - part: When the limit misleads
        ask: >
          Someone calibrates with $u = e^{\sigma\Delta t}$, dropping the square
          root, and refines to $900$ steps. What does their tree converge to?
        choices:
          - text: >
              The same lognormal, more slowly.
            feedback: >
              Each step is now $0.3/900$ and the variance is
              $900(0.3/900)^{2} = 0.0001$, a standard deviation of $0.01$.
              Refine further and it falls to zero: no lognormal at all.
          - text: >
              A stock with no randomness left, and an option priced as if
              volatility were zero.
            correct: true
            feedback: >
              Steps of size $\sigma\Delta t$ give variance $\sigma^{2}T\Delta t$,
              which vanishes as $\Delta t \to 0$. The square root is exactly
              what keeps the randomness alive in the limit.
          - text: >
              A stock with infinite volatility.
            feedback: >
              That is what fixed step sizes do. Steps that shrink like
              $\Delta t$ shrink too fast, and the variance goes the other way.
        feedback: >
          Only $\sigma\sqrt{\Delta t}$ steps match the variance step by step.
          Too big and the limit explodes; too small and it is deterministic.
      - ask: >
          The error of a CRR price shrinks roughly like $1/n$. If a $25$-step
          tree is off by about $0.08$, roughly how far off is a $100$-step
          tree?
        expects: "0.02"
        tolerance: 0.002
        feedback: >
          Four times the steps, a quarter of the error: $0.08/4 = 0.02$. That
          is why a $50$-step tree is already accurate to pennies on an option
          worth a few dollars.
      - ask: >
          Pricing at $n = 50, 51, 52, 53$, you see the price bounce above and
          below a level rather than settle onto it. What is the sensible fix?
        choices:
          - text: >
              Average the prices from consecutive $n$, one odd and one even.
            correct: true
            feedback: >
              The strike falls in a slightly different place relative to the
              nodes for odd and even $n$, so the errors alternate in sign.
              Averaging a neighbouring pair cancels most of it.
          - text: >
              It means the tree diverges, so switch to a different model.
            feedback: >
              The bounce shrinks like $1/n$: the tree converges, just not
              monotonically. Nothing is wrong with the limit.
          - text: >
              Use only even $n$; the odd prices are wrong.
            feedback: >
              The even prices are just as wrong, on the other side. Neither
              parity is the right one; the truth sits between them.
        feedback: >
          The odd–even oscillation is a feature of where the strike lands
          among the nodes, not of the limit itself.
      - teach: >
          In an interview: scale the steps as $\sigma\sqrt{\Delta t}$, so the
          log price is a random walk with fixed total variance; the central
          limit theorem makes it normal; so the stock is lognormal and the
          tree converges to Black–Scholes. That is the shortest honest route
          from the one-step hedge to the continuous formula.

  - node: quant-finance.options.risk-neutral-dynamics
    hook: >
      Before you can even write down Black–Scholes you need the
      continuous-time fact that makes it possible: under the pricing
      measure the stock's real growth rate $\mu$ is simply replaced by
      $r$.
    explanation: >
      The discrete hedging argument has a continuous-time twin: it forces
      the stock's drift under the risk-neutral measure to be the riskless
      rate, so instead of $dS=\mu S\,dt+\sigma S\,dB$ you price against
      $dS=rS\,dt+\sigma S\,dB$ — same volatility, drift swapped for $r$.
      Everything already known about geometric Brownian motion carries
      over with $\mu$ replaced by $r$:
      $S_T=S_0\exp((r-\sigma^{2}/2)T+\sigma\sqrt{T}\,Z)$ for standard
      normal $Z$, so $S_T$ is lognormal under this measure exactly as it
      was under the real one.

      Three facts are worth having cold. The mean is
      $\mathbb{E}^{Q}[S_T]=S_0e^{rT}$, the forward price, since a
      risk-neutral stock must grow at the riskless rate by construction.
      The median, $S_0e^{(r-\sigma^{2}/2)T}$, sits strictly below that
      mean, the same lognormal gap seen before, now expressed with $r$ in
      place of $\mu$. And the spread of outcomes on the log scale is
      $\sigma\sqrt{T}$, growing with the square root of time, not
      linearly.

      The payoff of this measure change is mechanical: every European
      claim is priced as $e^{-rT}\,\mathbb{E}^{Q}[\text{payoff}(S_T)]$, a
      single integral of the payoff against the lognormal density with
      these parameters — no replication, no tree, just calculus against
      one fixed distribution.
    worked: >
      Let $S_0=50$, $r=0.04$, $\sigma=0.3$, $T=2$. The forward price is
      $\mathbb{E}^{Q}[S_T]=50e^{0.08}\approx 54.16$. The median is
      $50e^{(0.04-0.045)(2)}=50e^{-0.01}\approx 49.50$, below the mean as
      always. The standard deviation of $\ln S_T$ is
      $\sigma\sqrt{T}=0.3\sqrt{2}\approx 0.424$.
    interview: >
      "Why does $\mu$ disappear and $r$ show up instead" should get the
      one-sentence answer — risk-neutral pricing replaces the real drift
      with the riskless rate — followed by being able to write $S_T$'s
      formula and name the forward price cold.
    pitfalls: >
      Writing the mean as $S_0e^{(r-\sigma^{2}/2)T}$ instead of
      $S_0e^{rT}$ is the single most common mix-up — that expression is
      the median, and the $-\sigma^{2}/2$ belongs inside the exponent, not
      to the growth rate of the mean.
    recap: >
      Under the pricing measure the stock drifts at $r$, not $\mu$, and
      ends up lognormal with mean $S_0e^{rT}$, median below it, and
      log-standard-deviation $\sigma\sqrt{T}$.
    dialogue:
      - part: What the pricing world expects
        teach: >
          A stock trades at $200$. The continuously compounded rate is
          $r = 5\%$, the stock's volatility is $\sigma = 20\%$, and you are
          pricing claims that settle in $T = 4$ years. On the tree, the pricing
          weight $q$ made the stock grow at exactly the riskless rate.
      - ask: >
          If the stock must grow at the riskless rate on average, what is its
          expected price in four years under the pricing measure? Use
          $e^{0.2} \approx 1.2214$.
        expects: "244.28"
        tolerance: 0.01
        feedback: >
          $200e^{0.05 \times 4} = 200e^{0.2} \approx 244.28$: the four-year
          forward price.
      - ask: >
          A colleague writes $\ln S_T = \ln 200 + rT + \sigma\sqrt{T}\,Z$ with
          $Z$ standard normal, letting the *log* grow at $r$. What does that
          do to $\mathbb{E}[S_T]$?
        choices:
          - text: >
              Nothing: it gives $200e^{0.2}$, as it should.
            feedback: >
              The median of $S_T$ would be $200e^{0.2}$. The mean of $e^{X}$
              for normal $X$ is $e^{\mathbb{E}[X] + \Var(X)/2}$, so it comes
              out larger.
          - text: >
              It makes the mean too high, by a factor $e^{\sigma^{2}T/2} = e^{0.08}$.
            correct: true
            feedback: >
              $\Var(\ln S_T) = \sigma^{2}T = 0.16$, so the mean is
              $200e^{0.2 + 0.08}$. Under that model the stock beats the
              riskless rate on average, and the claim to it would be mispriced.
          - text: >
              It makes the mean too low, because volatility drags the price
              down.
            feedback: >
              Volatility drags the *typical* outcome, the median, below the
              mean. Here the median is already at the forward, so the mean
              sits above it.
        feedback: >
          Exponentiating a normal adds half its variance to the mean. A log
          that grows at $r$ is a price that grows faster than $r$.
      - reflect: >
          What drift must $\ln S_T$ have so that the mean of $S_T$ grows at
          exactly $r$? Say why the answer is not $r$.
        answer: >
          Its drift must be $r - \sigma^{2}/2$ per year. Then
          $\mathbb{E}[S_T] = S_0 e^{(r - \sigma^{2}/2)T + \sigma^{2}T/2} = S_0e^{rT}$.
          The half-variance is the convexity of the exponential: symmetric
          noise in the log produces more upside in the price than downside,
          so the log must drift slower than the price to keep the mean on the
          forward.

      - part: The risk-neutral stock
        teach: >
          The continuous hedging argument replaces the real drift by $r$, just
          as $q$ did on the tree: under the risk-neutral measure
          $dS = rS\,dt + \sigma S\,dB$, so
          $S_T = S_0\exp\left((r - \sigma^{2}/2)T + \sigma\sqrt{T}\,Z\right)$.
          Its mean is the forward $S_0e^{rT}$, its median is
          $S_0e^{(r - \sigma^{2}/2)T}$, and $\ln S_T$ has standard deviation
          $\sigma\sqrt{T}$. Every European claim is worth
          $e^{-rT}\,\mathbb{E}^{Q}[\text{payoff}(S_T)]$.
      - ask: >
          What is the median of $S_T$ here? Use $e^{0.12} \approx 1.1275$.
        expects: "225.5"
        tolerance: 0.05
        feedback: >
          $(r - \sigma^{2}/2)T = (0.05 - 0.02)(4) = 0.12$, so the median is
          $200e^{0.12} \approx 225.50$, about $19$ below the mean of $244.28$.
      - ask: >
          What is the standard deviation of $\ln S_T$?
        expects: "0.4"
        feedback: >
          $\sigma\sqrt{T} = 0.2\sqrt{4} = 0.4$. Four years carry twice the
          log spread of one year, not four times.
      - ask: >
          Under the risk-neutral measure, what is the probability that $S_T$
          finishes above the forward, $244.28$? Use $\Phi(0.2) \approx 0.5793$.
        expects: "0.4207"
        tolerance: 0.0005
        hint: >
          $S_T > 200e^{0.2}$ means $0.12 + 0.4Z > 0.2$.
        feedback: >
          $Z > (0.2 - 0.12)/0.4 = 0.2$, with probability
          $1 - 0.5793 = 0.4207$. Less than a half.
      - ask: >
          The stock finishes above its own mean less than half the time. Why?
        choices:
          - text: >
              Because the risk-neutral measure is pessimistic about stocks.
            feedback: >
              The mean is exactly the forward, neither pessimistic nor
              optimistic. The asymmetry is in the shape, not the level.
          - text: >
              Because the lognormal is skewed right: rare large outcomes pull
              the mean above the median.
            correct: true
            feedback: >
              The price can rise without limit but cannot fall below $0$, so a
              few big upside paths lift the mean. Half the paths end below
              $225.50$; $58\%$ end below $244.28$.
          - text: >
              Because of the discounting by $e^{-rT}$.
            feedback: >
              No discounting entered this probability. It is a statement about
              the distribution of $S_T$ alone.
        feedback: >
          Mean above median is the lognormal signature, and the gap grows with
          $\sigma^{2}T$.

      - part: Prices as expectations
        ask: >
          A claim pays one share's worth, $S_T$, in four years. What is it
          worth today?
        expects: "200"
        feedback: >
          $e^{-0.2}\,\mathbb{E}^{Q}[S_T] = e^{-0.2}(200e^{0.2}) = 200$. A claim
          to the stock later is worth the stock now, which is exactly what
          growing at $r$ under $Q$ was built to guarantee.
      - ask: >
          A claim pays $1$ in four years if $S_T$ finishes above $244.28$, and
          nothing otherwise. What is it worth today? Use $e^{-0.2} \approx 0.8187$.
        expects: "0.3445"
        tolerance: 0.0005
        feedback: >
          $e^{-0.2}\,\Pr^{Q}(S_T > 244.28) = 0.8187 \times 0.4207 \approx 0.344$.
          Every European price is a discounted integral against this one
          distribution; a digital just integrates the indicator.
      - ask: >
          An analyst says the stock's real expected return is $12\%$ a year.
          How does that change $\mathbb{E}^{Q}[S_T]$?
        choices:
          - text: >
              It becomes $200e^{0.48}$, since the stock is expected to grow at
              $12\%$.
            feedback: >
              That is the real-world mean. Prices are computed under $Q$, where
              the drift is $r$ by construction, so $200e^{0.48}$ never enters
              a price.
          - text: >
              It does not change: under $Q$ the drift is $r$ whatever the real
              drift is.
            correct: true
            feedback: >
              The hedge removes the real drift exactly as it removed the real
              up-probability on the tree. Only $\sigma$ carries over.
          - text: >
              It changes the volatility, since faster-growing stocks are
              riskier.
            feedback: >
              $\sigma$ is the same under both measures: the change of measure
              swaps the drift and leaves the volatility alone.
        feedback: >
          Same volatility, drift swapped for $r$: that is the whole content of
          the risk-neutral dynamics.
      - teach: >
          The facts to say cold: under $Q$ the stock is lognormal with log
          drift $r - \sigma^{2}/2$ and log standard deviation $\sigma\sqrt{T}$;
          its mean is the forward $S_0e^{rT}$ and its median sits below that.
          Price any European claim as the discounted $Q$-expectation of its
          payoff. For the call, that integral is the Black–Scholes formula.

  - node: quant-finance.options.black-scholes
    hook: >
      This is the formula every quant interview eventually checks you can
      write from memory, cold, with its assumptions attached — not just
      the two $\Phi$ terms.
    explanation: >
      The formula is the risk-neutral pricing rule evaluated in closed
      form: $C=S_0\,\Phi(d_1)-Ke^{-rT}\,\Phi(d_2)$ for a European call,
      with $d_1=\dfrac{\ln(S_0/K)+(r+\sigma^{2}/2)T}{\sigma\sqrt{T}}$ and
      $d_2=d_1-\sigma\sqrt{T}$. It comes from either of two routes:
      integrate $e^{-rT}\,\mathbb{E}^{Q}[(S_T-K)^{+}]$ against the
      lognormal density of $S_T$ under the risk-neutral dynamics,
      splitting the integral at $S_T=K$ into the two pieces that become
      the two $\Phi$ terms; or set up a delta-hedged portfolio and solve
      the PDE it satisfies directly. Both land on the same closed form
      because they're the same no-arbitrage argument in two notations.

      Every assumption matters and gets tested individually: geometric
      Brownian motion with genuinely constant $\sigma$ and $r$, no
      dividends before $T$, continuous frictionless trading with
      unlimited shorting and divisibility, no arbitrage, European exercise
      only. Drop any one — a jump, a dividend, an American feature, a
      transaction cost — and the formula is no longer exactly right,
      though it often survives as a reasonable approximation.

      Notice what's absent: five inputs go in — $S_0$, $K$, $r$, $T$,
      $\sigma$ — and only $\sigma$ is unobservable in the market; that gap
      is exactly what implied volatility exists to fill.
    worked: >
      $S_0=50$, $K=45$, $r=0.05$, $\sigma=0.25$, $T=0.5$. Then
      $d_1=\dfrac{\ln(50/45)+(0.05+0.03125)(0.5)}{0.25\sqrt{0.5}}
      \approx\dfrac{0.1054+0.0406}{0.1768}\approx 0.826$, and
      $d_2\approx 0.826-0.177=0.649$. Reading a normal table,
      $\Phi(0.826)\approx 0.796$ and $\Phi(0.649)\approx 0.742$, so
      $C\approx 50(0.796)-45e^{-0.025}(0.742)\approx 39.8-32.6=7.2$.
    interview: >
      Expect "write down Black–Scholes" or "price this call" cold, with
      the interviewer listening for correct $d_1/d_2$ and the assumption
      list recited unprompted, plus "how would you derive it" answerable
      with the integration or PDE route named specifically.
    pitfalls: >
      Swapping the sign inside $d_1$ (using $-\sigma^{2}/2$ instead of
      $+\sigma^{2}/2$) is the most common algebra slip. Applying the
      formula to an American option or a dividend-paying stock without
      adjustment silently gives the wrong price.
    recap: >
      Black–Scholes closes the risk-neutral expectation into
      $C=S_0\Phi(d_1)-Ke^{-rT}\Phi(d_2)$ under GBM, frictionless European
      trading, and constant $r,\sigma$ — five inputs, one unobservable.
    dialogue:
      - part: Two prices you can already name
        teach: >
          A stock trades at $40$. You want the one-year European call struck
          at $42$, with $r = 5\%$ and volatility $\sigma = 30\%$; the stock
          pays no dividends. Take $e^{-0.05} \approx 0.9512$. Before tackling
          $30\%$, look at the two extremes.
      - ask: >
          If $\sigma$ were $0$, the stock would grow to $40e^{0.05}$ for sure.
          What would the call be worth today?
        expects: "0.05"
        tolerance: 0.005
        hint: >
          A sure payoff of $S_T - 42$ at expiry is worth $40 - 42e^{-0.05}$
          today.
        feedback: >
          $40 - 42(0.9512) = 40 - 39.95 = 0.05$. With no randomness the call is
          worth its lower bound, $(S_0 - Ke^{-rT})^{+}$.
      - ask: >
          As $\sigma$ grows without limit, what does the call's price approach?
        choices:
          - text: >
              Infinity: more volatility, more value, without end.
            feedback: >
              The call never pays more than the stock it delivers. A claim
              that pays at most $S_T$ is worth at most $S_0 = 40$.
          - text: >
              $40$, the stock price.
            correct: true
            feedback: >
              With huge volatility the stock almost surely ends near $0$ but
              occasionally ends enormous, and the strike becomes negligible
              against those rare outcomes. The call becomes the stock.
          - text: >
              $0$, because the stock almost surely ends near zero.
            feedback: >
              It does almost surely end near zero, but the rare huge outcomes
              keep the risk-neutral mean at $40e^{0.05}$, and the call
              collects nearly all of it.
        feedback: >
          The price runs from $0.05$ at zero volatility to $40$ at infinite
          volatility. The formula has to say where $30\%$ lands.
      - reflect: >
          The price is $e^{-rT}\,\mathbb{E}^{Q}[(S_T - K)^{+}]$, and
          $(S_T - K)^{+} = S_T\,\mathbf{1}\{S_T > K\} - K\,\mathbf{1}\{S_T > K\}$.
          What does each piece become after the discounted expectation, and
          which one is just a probability?
        answer: >
          The second piece becomes $Ke^{-rT}\,\Pr^{Q}(S_T > K)$: the strike,
          paid only if you exercise, discounted. The first is the present
          value of the stock you receive when you exercise. Under the
          lognormal law both are normal tail areas, so the price is
          "stock if exercised minus strike if exercised", each written with
          $\Phi$.

      - part: The formula
        teach: >
          Doing those two integrals gives the Black–Scholes formula,
          $C = S_0\,\Phi(d_1) - Ke^{-rT}\,\Phi(d_2)$, with
          $d_1 = \dfrac{\ln(S_0/K) + (r + \sigma^{2}/2)T}{\sigma\sqrt{T}}$ and
          $d_2 = d_1 - \sigma\sqrt{T}$. The put is
          $P = Ke^{-rT}\,\Phi(-d_2) - S_0\,\Phi(-d_1)$. It assumes geometric
          Brownian motion with constant $\sigma$ and $r$, no dividends,
          frictionless continuous trading, and European exercise.
      - ask: >
          Under $Q$, $\ln S_T = \ln S_0 + (r - \sigma^{2}/2)T + \sigma\sqrt{T}\,Z$.
          The event $S_T > K$ is the same as which event for $Z$?
        choices:
          - text: >
              $Z > d_1$
            feedback: >
              $d_1$ carries $+\sigma^{2}/2$, but the log drift under $Q$ is
              $r - \sigma^{2}/2$. Solving the inequality never produces the
              plus sign.
          - text: >
              $Z > d_2$
            feedback: >
              Close, but the sign is flipped. With $S_0$ far above $K$, $d_2$
              is large and positive, and $Z > d_2$ would make exercise
              unlikely for a call that is deep in the money.
          - text: >
              $Z > -d_2$
            correct: true
            feedback: >
              $\sigma\sqrt{T}\,Z > \ln(K/S_0) - (r - \sigma^{2}/2)T$, and
              dividing by $\sigma\sqrt{T}$ gives exactly $-d_2$. So
              $\Pr^{Q}(S_T > K) = \Phi(d_2)$, and the strike term is
              $Ke^{-rT}\Phi(d_2)$.
        feedback: >
          That is the load-bearing step: the strike term is the discounted
          strike times the risk-neutral chance of exercise. The stock term
          comes out the same way, with the shift by $\sigma\sqrt{T}$ that
          turns $d_2$ into $d_1$.

      - part: One price by hand
        ask: >
          Back to the $42$ call on the $40$ stock. What is $d_1$? Use
          $\ln(40/42) \approx -0.0488$.
        expects: "0.154"
        tolerance: 0.002
        hint: >
          $(r + \sigma^{2}/2)T = 0.05 + 0.045$.
        feedback: >
          $d_1 = (-0.0488 + 0.095)/0.3 = 0.0462/0.3 \approx 0.154$.
      - ask: >
          What is $d_2$?
        expects: "-0.146"
        tolerance: 0.002
        feedback: >
          $d_2 = d_1 - \sigma\sqrt{T} = 0.154 - 0.3 = -0.146$.
      - ask: >
          With $\Phi(0.154) \approx 0.5612$ and $\Phi(-0.146) \approx 0.4420$,
          what is the call worth?
        expects: "4.79"
        tolerance: 0.01
        feedback: >
          $Ke^{-rT} = 42(0.9512) \approx 39.95$, so
          $C = 40(0.5612) - 39.95(0.4420) \approx 22.45 - 17.66 = 4.79$.
          It lies between the extremes $0.05$ and $40$, as it must.
      - ask: >
          What is the matching European put worth?
        expects: "4.74"
        tolerance: 0.01
        hint: >
          Put–call parity is quicker than the put formula.
        feedback: >
          $P = C - S_0 + Ke^{-rT} = 4.79 - 40 + 39.95 = 4.74$. The put formula
          gives the same: the pair satisfies parity by construction.

      - part: Where the assumptions bite
        ask: >
          Suppose the stock pays a dividend of $1.50$ in six months, and you
          plug $S_0 = 40$ into the formula anyway. Is the answer too high or
          too low?
        choices:
          - text: >
              Too high: the stock drops by the dividend, and the call's holder
              never receives it.
            correct: true
            feedback: >
              The formula treats all $40$ as growing toward expiry, but $1.50$
              of it leaves the stock before then. The call is on the
              ex-dividend stock, which is worth less.
          - text: >
              Too low: dividends make the stock more valuable to own.
            feedback: >
              More valuable to the *shareholder*, who collects the cash. The
              call holder does not, and is left with a stock that has dropped
              by $1.50$.
          - text: >
              About right: dividends are already reflected in today's price.
            feedback: >
              Today's price includes the dividend; the price at expiry will
              not. That gap is exactly what the formula misses.
        feedback: >
          Every assumption is a place the formula can be wrong. Dividends
          lower call values and raise put values.
      - ask: >
          Can the formula price an *American* put on this stock?
        choices:
          - text: >
              Yes: with no dividends, American and European options are worth
              the same.
            feedback: >
              That is true for calls. For a put, exercising early collects the
              strike now and earns interest on it, which can be worth more
              than waiting.
          - text: >
              No: it gives the European price, which can understate the
              American put.
            correct: true
            feedback: >
              The formula assumes exercise only at expiry. The American put
              needs a tree with an early-exercise check at every node; the
              European price is a lower bound.
          - text: >
              Yes, by replacing $T$ with the expected exercise time.
            feedback: >
              The exercise time is not fixed in advance: it depends on the
              path. No single $T$ captures that choice.
        feedback: >
          The formula is exact only inside its assumptions; outside them it is
          a starting point.
      - teach: >
          In an interview: state the call formula with $d_1$ and $d_2$, read it
          as stock if exercised minus strike if exercised, name the five
          inputs — $S_0$, $K$, $r$, $T$, $\sigma$ — and note that only
          $\sigma$ cannot be read off a screen. Then list the assumptions
          unprompted.

  - node: quant-finance.options.exercise-probability
    hook: >
      Once the formula is memorized, the natural follow-up is what the
      two $\Phi$ terms actually mean — answering without hesitation
      separates memorization from understanding.
    explanation: >
      $\Phi(d_2)$ is the risk-neutral probability the call finishes in the
      money, $\Pr^{Q}(S_T>K)$. That falls straight out of the lognormal
      representation $S_T=S_0\exp((r-\sigma^{2}/2)T+\sigma\sqrt{T}Z)$: the
      event $S_T>K$ rearranges to $Z>-d_2$ exactly, and since $Z$ is
      standard normal and symmetric, $\Pr(Z>-d_2)=\Phi(d_2)$.

      The first term reads differently:
      $S_0\Phi(d_1)=e^{-rT}\,\mathbb{E}^{Q}[S_T\,\mathbf{1}\{S_T>K\}]$ is
      the present value of the stock actually received, counted only on
      the paths where exercise happens. So Black–Scholes is "present value
      of the asset received on exercise, minus present value of the
      strike paid on exercise," each conditioned on the same exercise
      event but weighted differently.

      $\Phi(d_1)$ has a second life as the hedge ratio — the share count
      in the replicating portfolio, the continuous-time descendant of the
      $\Delta$ from the binomial tree. Since $d_1=d_2+\sigma\sqrt{T}$ and
      $\Phi$ is increasing, $\Phi(d_1)>\Phi(d_2)$ always: the hedge ratio
      exceeds the exercise probability, by a gap that widens with
      $\sigma\sqrt{T}$.
    worked: >
      $S_0=80$, $K=90$, $r=0.03$, $\sigma=0.35$, $T=1$.
      $d_1=\dfrac{\ln(80/90)+(0.03+0.06125)(1)}{0.35}
      \approx\dfrac{-0.1178+0.0913}{0.35}\approx -0.076$, and
      $d_2\approx -0.076-0.35=-0.426$. So $\Phi(d_2)\approx 0.335$: about
      a one-in-three risk-neutral chance this call finishes in the money.
      $\Phi(d_1)\approx 0.470$: the hedge holds about $0.47$ shares per
      call, larger than the exercise probability, as it must be.
    interview: >
      "What does $N(d_2)$ mean" is asked almost every time Black–Scholes
      comes up; the fast, correct answer is "the risk-neutral probability
      of exercise, not the real-world one," then, if pushed, that
      $N(d_1)$ is the hedge ratio.
    pitfalls: >
      Calling $\Phi(d_2)$ the real-world probability of finishing in the
      money drops the risk-neutral qualifier. Mixing up which term is the
      hedge ratio — $\Phi(d_1)$, not $\Phi(d_2)$ — is the other common
      slip.
    recap: >
      $\Phi(d_2)$ is the risk-neutral exercise probability and $\Phi(d_1)$
      is both the hedge ratio and the exercise-weighted present value of
      the stock, with $\Phi(d_1)>\Phi(d_2)$ always.
    dialogue:
      - part: The chance the call pays
        teach: >
          A stock trades at $50$. The one-year European call struck at $55$
          has $r = 4\%$ and $\sigma = 25\%$. A client asks what the chance is
          that the call finishes in the money, and you answer under the
          pricing measure $Q$.
      - ask: >
          Under $Q$, $\ln(S_T/50) = 0.00875 + 0.25Z$ with $Z$ standard normal.
          $S_T > 55$ means $Z$ exceeds what threshold? Use
          $\ln(55/50) \approx 0.0953$.
        expects: "0.346"
        tolerance: 0.002
        hint: >
          The drift $0.00875$ is $r - \sigma^{2}/2 = 0.04 - 0.03125$.
        feedback: >
          $0.00875 + 0.25Z > 0.0953$ gives $Z > (0.0953 - 0.00875)/0.25 \approx 0.346$.
      - ask: >
          What is the risk-neutral probability that the call finishes in the
          money? Use $\Phi(0.346) \approx 0.6354$.
        expects: "0.3646"
        tolerance: 0.0005
        feedback: >
          $\Pr^{Q}(Z > 0.346) = 1 - 0.6354 = 0.3646$. And $0.346$ is exactly
          $-d_2$, so this number is $\Phi(d_2)$: the strike term
          $Ke^{-rT}\Phi(d_2)$ is the discounted strike times the chance you
          pay it.
      - ask: >
          A colleague prices the call as $0.3646 \times (50 - 55e^{-0.04})$,
          weighting the stock by the same probability as the strike. Why does
          that come out too low — negative, in fact?
        choices:
          - text: >
              Because the strike should not be discounted.
            feedback: >
              Discounting the strike is right: it is paid at expiry. The
              problem is in the stock term, not the strike term.
          - text: >
              Because when the call is exercised, the stock you receive is
              worth more than $55$, not its average value.
            correct: true
            feedback: >
              Exercise happens only on the high paths, so the stock delivered
              on exercise is worth more than the stock's average times the
              chance of exercise. The stock term needs a bigger weight.
          - text: >
              Because the probability should be the real-world one, which is
              higher.
            feedback: >
              The real-world probability never enters a price. The fault is in
              treating the stock received as if it were worth $S_0$ on every
              exercised path.
        feedback: >
          The strike you pay is a fixed $55$; the stock you get varies, and it
          is largest exactly when you exercise.
      - reflect: >
          The stock term is $S_0\Phi(d_1) = e^{-rT}\,\mathbb{E}^{Q}[S_T\,\mathbf{1}\{S_T > K\}]$.
          Say why $\Phi(d_1)$ must exceed $\Phi(d_2)$, in words a trader would
          use.
        answer: >
          $\Phi(d_1)$ is the chance of exercise with each path weighted by how
          much stock it delivers. High paths both trigger exercise and deliver
          more value, so they count for more, and the weighted chance is
          bigger than the plain one. In the formula the weighting shows up as
          a shift of $\sigma\sqrt{T}$: $d_1 = d_2 + \sigma\sqrt{T}$.

      - part: Two numbers in one formula
        teach: >
          So the formula reads "asset if exercised minus strike if
          exercised". $\Phi(d_2) = \Pr^{Q}(S_T > K)$ is the risk-neutral
          probability of exercise. $S_0\Phi(d_1)$ is the present value of the
          stock received on exercise, and $\Phi(d_1)$ is also the hedge ratio:
          the number of shares in the portfolio that replicates one call.
      - ask: >
          What is $d_1$ for this call?
        expects: "-0.096"
        tolerance: 0.002
        feedback: >
          $d_1 = d_2 + \sigma\sqrt{T} = -0.346 + 0.25 = -0.096$.
      - ask: >
          With $\Phi(-0.096) \approx 0.4617$ and $e^{-0.04} \approx 0.9608$,
          what is the call worth?
        expects: "3.82"
        tolerance: 0.01
        feedback: >
          $50(0.4617) - 55(0.9608)(0.3646) \approx 23.08 - 19.27 = 3.82$.
          Stock if exercised, $23.08$, minus strike if exercised, $19.27$.
      - ask: >
          A dealer has sold $200$ of these calls. How many shares does the
          replicating hedge hold?
        expects: "92.3"
        tolerance: 0.2
        feedback: >
          $200 \times \Phi(d_1) = 200 \times 0.4617 \approx 92.3$ shares. Not
          $200 \times 0.3646 = 72.9$: the hedge uses $\Phi(d_1)$, not the
          exercise probability.

      - part: Reading it wrong
        ask: >
          The client adds that the stock's real expected return is $12\%$ a
          year. Is the real-world chance of exercise $0.3646$?
        choices:
          - text: >
              Yes: $\Phi(d_2)$ is the probability the call finishes in the
              money, full stop.
            feedback: >
              $\Phi(d_2)$ is computed with drift $r = 4\%$. A stock drifting at
              $12\%$ ends above $55$ more often than that.
          - text: >
              No: it is higher, because the real drift exceeds $r$.
            correct: true
            feedback: >
              Replace $r$ by $12\%$ in the drift and the threshold for $Z$
              falls, so the real chance rises. $\Phi(d_2)$ is the *pricing*
              probability, and the qualifier matters.
          - text: >
              No: it is lower, because risk-neutral probabilities overstate
              upside.
            feedback: >
              Risk-neutral drift is $r$, below the stock's real $12\%$. If
              anything $Q$ understates the upside of a stock with a positive
              risk premium.
        feedback: >
          Say "risk-neutral probability of exercise" every time. Calling it the
          chance the call pays is a different, and usually larger, number.
      - ask: >
          Can $\Phi(d_2)$ ever exceed $\Phi(d_1)$?
        choices:
          - text: >
              Yes, for calls deep in the money.
            feedback: >
              Deep in the money both approach $1$, but $d_1 = d_2 + \sigma\sqrt{T}$
              still sits to the right of $d_2$, so $\Phi(d_1)$ stays ahead.
          - text: >
              No: $d_1 = d_2 + \sigma\sqrt{T} > d_2$, and $\Phi$ is increasing.
            correct: true
            feedback: >
              The hedge ratio always exceeds the exercise probability. The
              two meet only in the limits: far from the strike, or as
              $\sigma\sqrt{T} \to 0$ near expiry.
          - text: >
              Yes, whenever $r$ is negative.
            feedback: >
              $r$ enters $d_1$ and $d_2$ identically, so it moves both by the
              same amount. The gap is $\sigma\sqrt{T}$ whatever the rate.
        feedback: >
          Hedge ratio above exercise probability, always, by a gap set by
          $\sigma\sqrt{T}$.
      - teach: >
          In an interview, read the formula aloud: "$\Phi(d_2)$ is the
          risk-neutral probability of exercise; $S_0\Phi(d_1)$ is the value of
          the stock I receive if I exercise; $\Phi(d_1)$ is how many shares I
          hold to hedge." Then say why $\Phi(d_1) > \Phi(d_2)$.

  - node: quant-finance.options.implied-vol
    hook: >
      Quoting an option's price directly is meaningless across strikes and
      maturities, so every desk quotes the one number that isn't directly
      observable instead: the volatility Black–Scholes needs to reproduce
      that price.
    explanation: >
      Black–Scholes' call price is strictly increasing in $\sigma$: at
      $\sigma=0$ it equals the zero-vol bound $(S_0-Ke^{-rT})^{+}$, and as
      $\sigma\to\infty$ it rises toward $S_0$. Monotone and continuous
      means the map $\sigma\mapsto C$ is invertible, so a market price
      pins exactly one $\sigma$ — found numerically, since $d_1,d_2$ mix
      $\sigma$ nonlinearly and there's no closed-form inverse, typically
      by bisection (halve the bracket until $C(\sigma)$ matches) or
      Newton's method using vega as the derivative.

      Implied volatility is a quoting convention, not a forecast of
      future realized volatility — the wrong number in the wrong formula
      that gives the right price. Its value is comparability: two options
      with different strikes, maturities or underlyings can be compared
      instantly in vol terms in a way raw prices never allow, because
      price differences conflate moneyness and time-value differences
      that vol strips away.

      For a quick estimate at the money, use $C\approx 0.4\,\sigma
      S\sqrt{T}$, which comes from linearizing $\Phi$ near
      $d_1\approx d_2\approx 0$ when $S_0\approx K$ — solving it for
      $\sigma$ gets within a percent or two of the exact bisected answer
      instantly.
    worked: >
      $S=K=64$, $r=0$, $T=1$, an at-the-money call trades at $8$. The rule
      of thumb gives $\sigma\approx 8/(0.4\cdot 64\cdot 1)=8/25.6=0.3125$,
      so implied volatility is about $31.25\%$ — the exact bisected
      answer would sit within a point or two of this.
    interview: >
      "This call trades at [price] — back out the implied vol" tests the
      ATM rule of thumb as a fast estimate and, if pushed, whether you
      know the exact answer needs bisection or Newton, plus that implied
      vol isn't a forecast.
    pitfalls: >
      Applying $C\approx 0.4\sigma S\sqrt{T}$ far from the money gives a
      badly wrong answer — it only holds near $S\approx K$. Treating
      implied vol as a prediction of future realized volatility, rather
      than a price transform, is the deeper trap.
    recap: >
      Implied volatility is the unique $\sigma$ making Black–Scholes
      match the market price, found numerically since the price is
      monotone but not invertible in closed form — a convention, not a
      forecast.
    dialogue:
      - part: Running the formula backwards
        teach: >
          A stock trades at $80$, rates are zero, and the one-year call struck
          at $80$ trades at $7.96$. Black–Scholes with $\sigma = 20\%$ gives
          $6.37$ for this call; with $\sigma = 30\%$ it gives $9.54$.
      - ask: >
          Where is the volatility at which the formula gives $7.96$?
        choices:
          - text: >
              Below $20\%$, since $7.96$ is closer to $6.37$.
            feedback: >
              At $20\%$ the formula already gives less than $7.96$. Lowering
              $\sigma$ only lowers the price further.
          - text: >
              Between $20\%$ and $30\%$.
            correct: true
            feedback: >
              More volatility, a dearer call: $6.37 < 7.96 < 9.54$, so the
              matching $\sigma$ sits between the two trials.
          - text: >
              There is no way to tell without trying every volatility.
            feedback: >
              You can tell, because the price only ever rises with $\sigma$.
              Two trials that straddle the market price trap the answer
              between them.
        feedback: >
          The price is increasing in $\sigma$, so bracketing and halving the
          bracket closes in on the answer.
      - ask: >
          You halve the bracket and try $25\%$: the formula gives $7.96$
          exactly. What volatility reproduces the market price?
        expects: "0.25"
        feedback: >
          $\sigma = 0.25$, or $25\%$. Bisection found it in one step here; in
          general a few more halvings, or Newton's method, pin it to any
          precision.
      - reflect: >
          Why can only one volatility reproduce $7.96$? And which prices for
          this call would no volatility reproduce at all?
        answer: >
          The price is strictly increasing in $\sigma$: from the zero-vol
          value $(S_0 - Ke^{-rT})^{+}$, here $0$, up toward $S_0 = 80$ as
          $\sigma$ grows without bound. Every price strictly between those two
          is hit exactly once. A price at or below the floor, or at or above
          $80$, matches no $\sigma$ — and such a price is an arbitrage anyway.

      - part: A price in other units
        teach: >
          That unique $\sigma$ is the implied volatility: the volatility at
          which Black–Scholes reproduces the market price, found numerically.
          It is a quoting convention, not a forecast — the wrong number in the
          wrong formula that gives the right price — and traders quote in it
          because it compares across strikes, maturities and underlyings,
          where prices do not.
      - ask: >
          Someone quotes this call at $81$. What is its implied volatility?
        choices:
          - text: >
              Very high, perhaps $300\%$.
            feedback: >
              Even at $300\%$ the formula gives about $69$. No volatility
              lifts a call above $80$, the price of the stock it delivers.
          - text: >
              None exists, and the quote is an arbitrage.
            correct: true
            feedback: >
              A call can never pay more than the stock, so at $81$ you sell
              the call, buy the stock for $80$, and keep $1$ with your
              obligation covered.
          - text: >
              Exactly $100\%$, the maximum volatility.
            feedback: >
              Volatility has no maximum, and the price approaches $80$
              without reaching it however high $\sigma$ goes.
        feedback: >
          Implied volatility exists only for prices inside the no-arbitrage
          band.
      - ask: >
          A one-year at-the-money call on a *different* stock, trading at
          $160$, also costs $7.96$. Roughly what is its implied volatility?
        choices:
          - text: >
              $25\%$: the same price means the same volatility.
            feedback: >
              The same premium on a stock twice the size buys half the
              protection per dollar of stock. At $25\%$ this call would cost
              about $15.92$.
          - text: >
              About $12.5\%$.
            correct: true
            feedback: >
              An at-the-money call's price scales with the stock price, so the
              same $7.96$ on twice the stock is about half the volatility.
              The dollar prices look equal; the options are not.
          - text: >
              About $50\%$, since the stock is twice as large.
            feedback: >
              Backwards: a bigger stock makes the same dollar premium cheaper,
              not dearer, relative to what it insures.
        feedback: >
          Two equal prices, two very different options. Quoted in volatility,
          the difference is visible at once.
      - ask: >
          At $25\%$ the three-month $80$ call on the first stock costs about
          $3.99$, against $7.96$ for the one-year. Which is more expensive?
        choices:
          - text: >
              The one-year: it costs twice as much.
            feedback: >
              It costs more dollars because it covers four times as long. Per
              unit of volatility the two are priced identically.
          - text: >
              The three-month: four times shorter, but half the price.
            feedback: >
              A quarter of the time is half the price because the spread of
              outcomes grows like $\sqrt{T}$. Nothing about that is
              expensive.
          - text: >
              Neither: both are quoted at $25\%$ implied volatility.
            correct: true
            feedback: >
              Strip out the maturity and the two quotes are the same price.
              Implied volatility is the unit in which they can be compared.
        feedback: >
          Dollars depend on strike, maturity and stock level; implied
          volatility removes all three.

      - part: What implied volatility is not
        ask: >
          The stock's realized volatility over the past year was $18\%$, and
          the call implies $25\%$. What does the gap tell you?
        choices:
          - text: >
              The market is certain the stock will be more volatile next year.
            feedback: >
              Implied volatility carries a forecast, a risk premium, and the
              model's errors all at once. It is not anyone's certainty about
              anything.
          - text: >
              The options are priced high relative to recent movement, which
              you could trade if you think $18\%$ is the better guess.
            correct: true
            feedback: >
              Implied volatility is a price. Comparing it with your own
              estimate of future volatility is how you decide whether options
              are cheap or dear.
          - text: >
              The call should be priced at $18\%$, so the market price is
              wrong.
            feedback: >
              The market price is the price. Plugging $18\%$ into the formula
              gives your model's opinion, not the price you can trade at.
        feedback: >
          Implied volatility translates a price into volatility units; it is
          not a measurement of the stock.
      - ask: >
          A colleague inverts the same $7.96$ using a model with jumps instead
          of Black–Scholes. Do they get $25\%$?
        choices:
          - text: >
              Yes: the implied volatility is a property of the option.
            feedback: >
              It is a property of the option *and* the formula used to invert
              its price. Change the formula and the number that reproduces
              $7.96$ changes.
          - text: >
              No: implied volatility is defined relative to Black–Scholes, and
              another model generally needs a different number.
            correct: true
            feedback: >
              The jump model attributes part of the price to jumps, so it needs
              less diffusion volatility. The quoting convention works because
              everyone inverts the same formula.
          - text: >
              Only if the stock has jumped in the past year.
            feedback: >
              Past jumps do not enter either inversion. Both take today's
              price and solve for their own parameter.
        feedback: >
          The convention is: one agreed formula, run backwards. That is what
          makes the number comparable across the market.
      - teach: >
          The interview version: implied volatility is the $\sigma$ that makes
          Black–Scholes match the market price; it is unique because the price
          rises strictly with $\sigma$ between its two bounds; you find it by
          bisection or Newton; and it is a quoting unit for price, not a
          forecast of realized volatility.

  - node: quant-finance.options.vol-smile
    hook: >
      If Black–Scholes were literally true, every strike and maturity on a
      stock would trade at the same implied vol — they never do, and
      reading why is a standard probe of whether you understand the
      model's limits.
    explanation: >
      Plot implied volatility against strike for a fixed maturity and,
      instead of a flat line, you get a smile in FX markets and a
      downward skew in equity indices — puts trading at higher implied
      vol than calls, roughly monotone down as strike rises. Do this
      across maturities too and the whole thing is a surface. Since one
      lognormal model would price every strike with the same $\sigma$,
      the shape is a direct readout of where the market's true
      risk-neutral density diverges from lognormal.

      The mechanisms are concrete: the market prices in price jumps (the
      lognormal model has none), volatility that is itself random and
      tends to rise when spot falls, and demand for downside protection
      that isn't purely about expected loss. Each fattens the tails and
      skews the density relative to the lognormal benchmark, and
      out-of-the-money puts — the cheapest insurance against a crash —
      absorb that extra pricing.

      Two practical rules follow. Never price two different strikes off
      one flat vol; each strike gets its own point on the surface. And
      market-quoted combinations read the density directly: a risk
      reversal (the vol gap between an out-of-the-money call and put)
      reads the skew, and a butterfly quote (the vol premium of wings
      over the at-the-money strike) reads the tail fatness.
    worked: >
      On one index maturity: the $90$-strike put trades at implied vol
      $28\%$, the $100$-strike (at the money) at $22\%$, the $110$-strike
      call at $20\%$. That's a downward skew of $8$ vol points end to end;
      the $90/110$ risk reversal reads $28-20=8$ points, quantifying the
      market's crash-insurance premium in one number.
    interview: >
      "Why does the smile exist" wants a specific mechanism named — jumps,
      stochastic vol correlated with spot, or the crash-insurance premium
      — not a vague "markets aren't perfect"; naming risk reversal and
      butterfly as direct reads on the surface is a strong finish.
    pitfalls: >
      Pricing an exotic or a spread using one flat implied vol taken from
      an unrelated strike silently misprices it. Calling the skew
      "irrational" rather than a rational price for a fatter-tailed,
      skewed true density is a conceptual miss.
    recap: >
      Implied vol varies by strike and maturity because the market's true
      risk-neutral density has fatter tails and more skew than lognormal —
      readable directly off risk-reversal and butterfly quotes.
    dialogue:
      - part: Three strikes, three volatilities
        teach: >
          An equity index stands at $50$. You invert the market prices of three
          one-year options on it: the put struck at $40$ implies $34\%$, the
          at-the-money option at $50$ implies $24\%$, and the call struck at
          $60$ implies $19\%$.
      - ask: >
          If Black–Scholes described this index exactly, what would the three
          implied volatilities be?
        choices:
          - text: >
              Highest at the money, where options carry the most time value.
            feedback: >
              Time value peaks at the money in *dollars*. Implied volatility
              already divides that effect out; under the model, every strike
              inverts to the same $\sigma$.
          - text: >
              All the same: one $\sigma$ prices every strike.
            correct: true
            feedback: >
              The model has a single volatility for the index. If it were
              right, inverting any strike would return that one number.
          - text: >
              Falling with strike, as observed, since puts are always dearer
              than calls.
            feedback: >
              Under the model, puts and calls at one strike share a single
              implied volatility by put–call parity, and every strike shares
              the same one too.
        feedback: >
          So a plot of implied volatility against strike should be a flat
          line. It is not, and the slope is the information.
      - ask: >
          By how many volatility points does the $40$ put's implied
          volatility exceed the $60$ call's?
        expects: "15"
        feedback: >
          $34 - 19 = 15$ points. That difference between a downside and an
          upside strike is the risk reversal, the standard one-number summary
          of the slope.
      - ask: >
          A colleague prices the $40$ put at the at-the-money $24\%$ to save
          time. Is their price too high or too low?
        choices:
          - text: >
              Too low: the market charges $34\%$ for that strike.
            correct: true
            feedback: >
              Price rises with volatility, so the put priced at $24\%$ comes
              out well below what it trades at. Selling it at that price gives
              away the premium the market charges for crash insurance.
          - text: >
              Too high: a lower strike is further from the money and should
              use a lower volatility.
            feedback: >
              Its dollar price is lower than the at-the-money option's, but
              its *implied volatility* is higher. Do not confuse the two
              scales.
          - text: >
              About right: volatility is a property of the index, not of the
              strike.
            feedback: >
              Under the model it would be. The market is telling you that it
              is not, and the market's price is the one you can trade at.
        feedback: >
          Price each strike with its own implied volatility, never one flat
          number.
      - ask: >
          At $24\%$ a year, one trading day's standard deviation is about
          $0.24/\sqrt{252} \approx 0.0151$. A one-day fall of $20\%$ is
          $\ln 0.8 \approx -0.223$ in log terms. How many daily standard
          deviations is that?
        expects: "14.8"
        tolerance: 0.3
        feedback: >
          $0.223/0.0151 \approx 14.8$. Under a normal model a $15$-sigma day
          should essentially never happen in the life of the universe. Equity
          indices have had one.
      - reflect: >
          What would the true distribution of index returns have to look like
          for the market to pay $34\%$ for the $40$ put and only $19\%$ for
          the $60$ call? Say why such a distribution is plausible.
        answer: >
          Its left tail must be fatter than a lognormal's and its right tail
          thinner: large falls more likely, large rises less likely, a negative
          skew. That is plausible because indices jump down in crashes,
          volatility rises when prices fall so falls feed on themselves, and
          investors pay a premium for downside insurance. The lognormal misses
          all three, so the market corrects it strike by strike.

      - part: The smile as a confession
        teach: >
          Implied volatility plotted against strike is a *smile* in currency
          markets and a downward *skew* in equity indices, and it changes with
          maturity, so the full object is a surface. Its shape is the model's
          confession of error: the risk-neutral density implied by market
          prices has fatter tails and more negative skew than the lognormal.
          In practice: one volatility per strike and maturity, never a flat
          one.
      - ask: >
          Currency options typically show a smile, with both wings above the
          at-the-money volatility, rather than an equity-style skew. Why?
        choices:
          - text: >
              Currency traders are more risk-averse than equity traders.
            feedback: >
              That would raise the whole curve, not its shape. The question is
              why *both* tails are priced up.
          - text: >
              An exchange rate can lurch sharply either way, since either
              currency can be the one in crisis.
            correct: true
            feedback: >
              A falling euro is a rising dollar. Both tails are fat, so both
              wings carry extra volatility. An equity index mostly crashes
              down, which tilts its curve into a skew.
          - text: >
              Currencies follow a lognormal exactly, and the smile is noise.
            feedback: >
              If they did, the curve would be flat. A persistent smile is a
              persistent departure from the lognormal.
        feedback: >
          The shape of the curve reads off where the distribution's tails are
          fat.
      - ask: >
          At-the-money implied volatility on the index is $30\%$ for one month
          and $24\%$ for one year. Can a single Black–Scholes $\sigma$ price
          both?
        choices:
          - text: >
              Yes: average them and use $27\%$ for both.
            feedback: >
              Then both options are mispriced, one too cheap and one too dear.
              A flat volatility cannot match two different market prices.
          - text: >
              No: constant $\sigma$ means a flat term structure, and the
              market's is not.
            correct: true
            feedback: >
              The model's $\sigma$ is the same at every horizon. Here short
              options are priced off higher volatility — typical after a
              selloff, when near-term volatility is expected to calm down.
          - text: >
              Yes: the one-year volatility already includes the first month.
            feedback: >
              It includes it, averaged with eleven calmer months. The
              one-month option sees only the first month, at $30\%$.
        feedback: >
          Across strikes and across maturities, one number does not fit. The
          whole surface is the market's quote.

      - part: Misreadings
        ask: >
          A client sees the steep skew and concludes the market expects the
          index to fall, so its risk-neutral mean must be below the forward.
          Is that right?
        choices:
          - text: >
              Yes: expensive puts mean the market expects a decline.
            feedback: >
              Under the pricing measure the index's mean is pinned to the
              forward by the hedging argument. The skew reshapes the tails
              around that mean; it does not move it.
          - text: >
              No: the skew is about the shape of the distribution, not its
              center.
            correct: true
            feedback: >
              The left tail is fatter and the right thinner, with the mean
              still at the forward. Expensive puts say crashes are priced as
              likely and costly, not that a fall is the forecast.
          - text: >
              Yes, by exactly the risk reversal: $15$ points below the forward.
            feedback: >
              The risk reversal is in volatility points, a difference between
              two option prices in model units. It is not a forecast of the
              index level.
        feedback: >
          The smile is a statement about tails; the forward fixes the center.
      - ask: >
          A desk prices the $40$ put and the $60$ call as a package using one
          flat $24\%$. How is each leg off?
        choices:
          - text: >
              Both too cheap, since $24\%$ is below the average of $34\%$ and
              $19\%$.
            feedback: >
              $24\%$ is below $34\%$ but above $19\%$. The two legs are wrong
              in opposite directions.
          - text: >
              The put too cheap and the call too dear.
            correct: true
            feedback: >
              The put needs $34\%$ and gets $24\%$; the call needs $19\%$ and
              gets $24\%$. A flat volatility hides two errors that partly
              offset in the total and do not offset in the risk.
          - text: >
              Both correct, because the errors cancel in the package.
            feedback: >
              They partly cancel in the package's price, but buy only the put
              and the whole error is yours. Each leg must be right on its own.
        feedback: >
          Price each strike off its own point on the surface.
      - teach: >
          The interview version: if Black–Scholes were true, implied
          volatility would be flat; it is a smile in currencies and a skew in
          equity indices, varying with maturity; the shape prices the fat
          tails, jumps and volatility moves the lognormal leaves out, and the
          equity skew is the price of crash insurance.

  - node: quant-finance.options.straddle
    hook: >
      "Do you think the stock moves more than the market expects" is a
      straddle question in disguise, and pricing its breakeven on the
      spot is a two-second desk check.
    explanation: >
      A long straddle buys a call and a put at the same strike and expiry,
      so its payoff is $(S_T-K)^{+}+(K-S_T)^{+}=|S_T-K|$ — a V shape
      pointed at $K$, found by adding the call's and put's hockey sticks
      vertically. Its cost is the sum of the two premiums, so the P&L is
      $|S_T-K|$ minus that total premium: it loses everything if the
      stock pins the strike and profits once the move in either direction
      exceeds the premium, giving two breakevens, $K$ minus and $K$ plus
      the premium.

      A long strangle uses a lower put strike and a higher call strike
      instead of a common one, so both legs start further out of the
      money: it costs less than the straddle but needs a bigger move
      before either leg pays off. Both are direction-free — the trade
      doesn't care whether the stock rises or falls, only how far it
      moves — which is what makes them the natural expression of a pure
      view on volatility.

      Selling either collects the premium up front but inverts the risk:
      a short position profits only if the stock stays inside the
      breakevens and loses as the move grows past them, a bet that the
      market's implied move overstates what will actually happen.
    worked: >
      $S=200$, and the $200$ call and put each cost $8$, so the straddle
      costs $16$ and breaks even at $184$ and $216$ — the stock must move
      more than $8\%$ off $200$ to profit. A $180/220$ strangle costs
      $3+2=5$ instead, with breakevens at $175$ and $225$: cheaper to
      enter, but needing a bigger move to pay off.
    interview: >
      "How would you bet the stock moves a lot without picking a
      direction" is the canonical phrasing; the interviewer wants
      "straddle" named immediately, the two breakevens computed, and the
      strangle offered as the cheaper, wider-breakeven alternative.
    pitfalls: >
      Forgetting the straddle has two breakevens, not one, is a common
      slip — quoting only the upside as if it were a call. Selling a
      straddle without naming the unbounded loss above the strike
      misstates the risk.
    recap: >
      A straddle is a symmetric direction-free bet on the size of the
      move, breaking even one full premium either side of the strike; a
      strangle costs less and needs more.
    dialogue:
      - part: A view with no direction
        teach: >
          A stock trades at $120$ and reports earnings next week. You expect a
          large move and have no idea which way. One-month options struck at
          $120$ trade at $6.30$ for the call and $5.70$ for the put.
      - ask: >
          You buy only the call. What is your P&L if the stock drops to $100$?
        expects: "-6.3"
        feedback: >
          The call expires worthless and you lose the full $6.30$. You were
          right that the stock would move a lot and lost anyway, because the
          call only pays for one direction.
      - ask: >
          You buy the call and the put together instead. What does the
          position cost?
        expects: "12"
        feedback: >
          $6.30 + 5.70 = 12$.
      - ask: >
          What is the P&L of the pair if the stock drops to $100$?
        expects: "8"
        feedback: >
          The put pays $120 - 100 = 20$, the call nothing: $20 - 12 = 8$. A
          rise to $140$ would pay the same $8$ through the call.
      - ask: >
          What is the P&L if the stock finishes exactly at $120$?
        expects: "-12"
        feedback: >
          Both legs expire worthless and you lose the full $12$. The one
          outcome you cannot afford is no move at all.
      - ask: >
          Where does the pair break even?
        choices:
          - text: >
              At $113.70$ and $126.30$: each leg needs to cover its own
              premium.
            feedback: >
              At $126.30$ the call has paid back its $6.30$, but the put
              expired worthless and its $5.70$ is gone. Only one leg pays at a
              time, so it must cover both premiums.
          - text: >
              At $108$ and $132$.
            correct: true
            feedback: >
              The payoff is $|S_T - 120|$, and it equals the $12$ paid when
              the stock is $12$ away from the strike on either side.
          - text: >
              At $132$ only, as for a call.
            feedback: >
              The put leg pays below $120$, so there is a second breakeven on
              the downside, at $108$.
        feedback: >
          Two breakevens, one total premium either side of the strike.
      - reflect: >
          What does holding both legs bet on that neither leg bets on alone,
          and how large must the event be for it to pay?
        answer: >
          The pair pays $|S_T - 120|$: it bets on the *size* of the move and
          is indifferent to its direction. To profit the stock has to move
          more than $12$, which is $10\%$ of $120$, either way. The $12$ is the
          move the market has priced in; you are betting the real move will
          be bigger.

      - part: Straddles and their cheaper cousins
        teach: >
          A call and a put at the same strike and expiry is a long
          *straddle*, with P&L $|S_T - K|$ minus the total premium. A put at a
          lower strike plus a call at a higher strike is a long *strangle*:
          cheaper, because both legs start out of the money, and it needs a
          bigger move to pay.
      - ask: >
          The one-month $110$ put trades at $2.60$ and the $130$ call at
          $3.10$. What does the $110/130$ strangle cost?
        expects: "5.7"
        feedback: >
          $2.60 + 3.10 = 5.70$, under half the straddle's $12$.
      - ask: >
          What is the strangle's upper breakeven?
        expects: "135.7"
        hint: >
          Above $130$ only the call pays, and it has to cover both premiums.
        feedback: >
          $130 + 5.70 = 135.70$, against $132$ for the straddle. The lower
          breakeven is $110 - 5.70 = 104.30$. Cheaper to buy, and a wider band
          of outcomes in which you lose.

      - part: What counts as a straddle
        ask: >
          Which of these positions is a long straddle?
        choices:
          - text: >
              Buy the $120$ call and sell the $120$ put, same expiry.
            feedback: >
              Selling the put flips its leg: the payoff is $S_T - 120$, a
              straight line. That is synthetic stock, a bet on direction.
          - text: >
              Buy the $120$ call expiring in one month and the $120$ put
              expiring in three.
            feedback: >
              Different expiries break the definition: after one month you hold
              a lone put. Both legs must expire together.
          - text: >
              Buy the $110$ put and the $130$ call, same expiry.
            feedback: >
              Two different strikes make this the strangle. Close relative,
              different name, different breakevens.
          - text: >
              Buy the $120$ call and the $120$ put, same expiry.
            correct: true
            feedback: >
              Long both, one strike, one expiry: every clause holds.
        feedback: >
          Long both legs, same strike, same expiry. Change the strikes and it
          is a strangle; sell a leg and it is not a volatility bet at all.
      - ask: >
          Instead you *sell* the $120$ straddle for $12$. What is your worst
          case?
        choices:
          - text: >
              $-12$: you lose what the buyer would have gained.
            feedback: >
              $12$ is your best case, if the stock pins $120$. The buyer's
              gains are unbounded on the upside, and so are your losses.
          - text: >
              $-108$, if the stock goes to $0$.
            feedback: >
              That is the downside loss: $120 - 12 = 108$. The upside is
              worse, with no bound at all.
          - text: >
              Unbounded: above $132$ you lose $1$ for every $1$ the stock
              rises.
            correct: true
            feedback: >
              The short call leg has no cap. Sellers collect $12$ in exchange
              for unlimited risk on the upside and up to $108$ on the
              downside.
        feedback: >
          A short straddle earns premium when nothing happens and carries
          unbounded risk when something does.
      - teach: >
          In an interview, quote the straddle as an implied move: here $12$ on
          a $120$ stock, the market pricing about $\pm 10\%$ by expiry. Buy it
          if you expect more than that, sell it if you expect less, and always
          name both breakevens.

  - node: quant-finance.options.vertical-spreads
    hook: >
      "I like this stock but don't want unlimited downside on the trade
      itself" is answered with a vertical spread, and computing its
      capped max profit and max loss live is a standard exercise.
    explanation: >
      A vertical spread is long one strike and short another of the same
      type and expiry — a bull call spread, for instance, is long a
      lower-strike call and short a higher-strike call. Adding the two
      payoff diagrams vertically caps the shape at both ends: below the
      lower strike both legs are worthless; between the strikes the
      payoff rises at slope $1$; above the higher strike the short leg's
      growth cancels the long leg's, so the payoff flattens at the strike
      gap. The net debit is paid up front, so max loss is that debit,
      hit below the lower strike, and max profit is the strike gap minus
      the debit, hit above the higher strike — breakeven sits at the
      lower strike plus the debit.

      The same construction works with puts for a bearish view: long the
      higher-strike put, short the lower-strike put, paying a debit for a
      payoff worth the most below the lower strike and worthless above
      the higher one.

      Trade a vertical spread instead of an outright option whenever you
      have a directional view but want defined, smaller risk than a naked
      option carries — you give up some upside in exchange for a lower
      cost, a capped worst case, and less exposure to a volatility move
      working against you.
    worked: >
      Bear put spread on $S=50$, $\sigma=30\%$, $T=0.5$, $r=0$: buy the
      $50$ put at $4.0$, sell the $45$ put at $2.0$, net debit $2.0$.
      Below $45$ both legs are fully in the money and the payoff maxes at
      $50-45=5$, so max profit is $5-2=3$. Above $50$ both legs expire
      worthless, so max loss is the $2.0$ debit; breakeven is $50-2=48$.
    interview: >
      "Structure a trade expressing [bullish/bearish] view with limited
      risk" wants a vertical spread named directly, with max profit, max
      loss and breakeven computed from the premiums and strike gap
      without hesitation.
    pitfalls: >
      Computing max profit as the full strike gap instead of the strike
      gap minus the debit double-counts the premium. Mixing up which leg
      is long and which is short flips the payoff's slope entirely.
    recap: >
      A vertical spread caps both cost and payoff by going long one
      strike and short another; the debit paid is the max loss and the
      strike gap minus the debit is the max profit.
    dialogue:
      - part: Paying for upside you do not expect
        teach: >
          A stock trades at $80$. You expect it to reach about $90$ in three
          months and not much beyond. The three-month call struck at $80$
          costs $4.40$ and the one struck at $90$ costs $1.30$; rates are zero.
      - ask: >
          You buy the $80$ call alone and the stock finishes at $90$, exactly
          as you predicted. What is your P&L?
        expects: "5.6"
        feedback: >
          The call pays $10$ and cost $4.40$, so you make $5.60$. Your view
          was right and you still paid for something it rules out.
      - reflect: >
          Your view says the stock will not go much past $90$. Which part of
          the $80$ call's payoff are you paying for that you think is
          unlikely — and how could you get paid for giving it up?
        answer: >
          Everything the call pays above $90$: the slope-$1$ line beyond $90$
          is exactly the payoff of a $90$ call. Sell the $90$ call, collect
          $1.30$, and you have handed someone the part of the payoff you did
          not believe in. What remains pays $S_T - 80$ between $80$ and $90$
          and a flat $10$ above.
      - ask: >
          You buy the $80$ call and sell the $90$ call. What is the net cost?
        expects: "3.1"
        feedback: >
          $4.40 - 1.30 = 3.10$, about $30\%$ cheaper than the call alone.
      - ask: >
          What is the P&L of the pair if the stock finishes at $100$?
        expects: "6.9"
        feedback: >
          The $80$ call pays $20$, the short $90$ call costs you $10$: payoff
          $10$, minus $3.10$, gives $6.90$. Above $90$ it is $6.90$ whatever the
          price — the most the trade can make.
      - ask: >
          At what finishing price does the pair break even?
        expects: "83.1"
        feedback: >
          Between $80$ and $90$ the payoff is $S_T - 80$, which equals the
          $3.10$ paid at $S_T = 83.10$. Below $80$ you lose the $3.10$ and no
          more.

      - part: The vertical spread, named
        teach: >
          Long one strike and short another, same type and same expiry: a
          *vertical spread*. Bought with calls as here it is a bull call
          spread. The net debit is the maximum loss, and the strike gap minus
          the debit is the maximum profit: $10 - 3.10 = 6.90$. Reverse the
          legs and you have a bear spread, which profits from a fall.
      - ask: >
          With rates at zero, the $90$ put trades at $11.30$ and the $80$ put
          at $4.40$. You sell the $90$ put and buy the $80$ put. What credit do
          you collect?
        expects: "6.9"
        feedback: >
          $11.30 - 4.40 = 6.90$. At expiry you owe at most $10$, below $80$, so
          the worst case is $6.90 - 10 = -3.10$ and the best is $+6.90$ above
          $90$: the same P&L as the call spread. The put version takes the
          premium up front; parity guarantees the two match.

      - part: What counts as a vertical
        ask: >
          Which of these is a bear spread?
        choices:
          - text: >
              Buy the $80$ call, sell the $90$ call.
            feedback: >
              That is the bull call spread you built: it makes money as the
              stock rises toward $90$.
          - text: >
              Sell the $80$ call, buy the $90$ call.
            correct: true
            feedback: >
              You collect $3.10$ and keep it if the stock stays below $80$; above
              $90$ you lose $10 - 3.10 = 6.90$. The same two legs, reversed,
              profit from a fall.
          - text: >
              Buy the $80$ call, buy the $90$ put.
            feedback: >
              Two long options and no short leg: that pays in both directions,
              a strangle-like bet on a move, not a spread.
        feedback: >
          Bull or bear depends on which strike you own: own the lower one and
          you want the stock up.
      - ask: >
          Which of these is *not* a vertical spread?
        choices:
          - text: >
              Buy the three-month $80$ call, sell the one-month $90$ call.
            correct: true
            feedback: >
              Different expiries. After one month the short leg is gone and you
              hold a lone call; the payoff never has the capped shape.
          - text: >
              Buy the three-month $90$ put, sell the three-month $80$ put.
            feedback: >
              Same type, same expiry, two strikes, one long and one short: a
              bear put spread. Every clause holds.
          - text: >
              Sell the three-month $80$ put, buy the three-month $70$ put.
            feedback: >
              One long and one short put at different strikes, same expiry: a
              bull put spread, a vertical like the others.
        feedback: >
          The clauses: same type, same expiry, different strikes, one long and
          one short. The expiry clause is the one people drop.
      - ask: >
          The day after you put on the call spread, implied volatility rises
          across all strikes. Which position's value changes less: the spread,
          or the $80$ call alone?
        choices:
          - text: >
              The $80$ call alone, since it has only one leg.
            feedback: >
              One leg means nothing offsets its gain from volatility. The
              spread has a short leg whose value rises too, against you.
          - text: >
              The spread, because the short $90$ call gains value as well and
              offsets much of the long leg.
            correct: true
            feedback: >
              Both legs rise in price, and you are short one of them. The
              spread is a bet on direction with defined risk and far less
              exposure to volatility.
          - text: >
              Neither changes: verticals and outright calls both ignore
              volatility.
            feedback: >
              Every option's price rises with volatility. The spread is less
              exposed because its two legs offset, not because they ignore it.
        feedback: >
          A vertical isolates a directional view with a capped cost, and
          mostly sets volatility aside.
      - teach: >
          In an interview, name the three numbers before anyone asks: max loss
          is the net debit, max profit is the strike gap minus the debit, and
          the breakeven sits one debit beyond the long strike, in the
          direction you want the stock to go.

  - node: quant-finance.options.butterfly
    hook: >
      "What's the cheapest way to bet the stock pins near a level" is a
      butterfly question, and it's also the cleanest instrument for
      reading the implied density directly off a quote.
    explanation: >
      A long call butterfly is long one $K_1$ call, short two $K_2$
      calls, and long one $K_3$ call, with $K_2$ exactly midway. It's
      algebraically the difference of two vertical spreads sharing the
      middle strike, so adding those two capped shapes vertically
      produces a tent: $0$ below $K_1$, rising to a peak at $K_2$, falling
      back to $0$ at $K_3$ and beyond. The net debit is small because
      you're buying one spread and financing most of it by selling an
      offsetting one.

      Since the payoff is a tent that never goes negative in any state,
      its price, $e^{-rT}\mathbb{E}^{Q}[\text{tent}]$, must be nonnegative
      too — so a market quoting a negative butterfly price is directly
      quoting an arbitrage. More than that, the butterfly's price relative
      to its tent height is a direct probe of how much risk-neutral
      probability mass sits near $K_2$: a market-maker reads butterfly
      quotes as reads on the local density, the role the risk reversal
      plays for skew.

      Use it to express a pinning view cheaply: you give up the payoff a
      single option offers away from $K_2$ in exchange for a much lower
      cost, appropriate when you expect the stock to sit near a level
      rather than run far from it.
    worked: >
      Strikes $35/40/45$ on $S=40$: buy the $35$ call at $6.5$, sell two
      $40$ calls at $3.0$ each, buy the $45$ call at $1.0$ — net debit
      $6.5-6.0+1.0=1.5$. At $S_T=40$ the payoff peaks at $40-35=5$, so
      max profit is $5-1.5=3.5$. The payoff rises from $0$ at $35$ to $5$
      at $40$ then falls to $0$ at $45$, so breakevens are $36.5$ and
      $43.5$, and max loss is the $1.5$ debit outside $[35,45]$.
    interview: >
      "How would you cheaply bet the stock pins near [level]" should get
      "butterfly" immediately, with the three strikes, small debit, and
      tent-shaped payoff described unprompted; naming it as a probe of the
      implied density near $K_2$ shows depth.
    pitfalls: >
      Forgetting the middle strike sells two contracts, not one, breaks
      the tent shape — the $1{:}2{:}1$ ratio is load-bearing. Treating a
      quoted negative butterfly price as a curiosity rather than a flagged
      arbitrage misses the point.
    recap: >
      A butterfly is the difference of two vertical spreads sharing a
      strike, producing a small-debit tent that peaks at the middle
      strike — its price directly reads the risk-neutral density there.
    dialogue:
      - part: A bet that the stock sits still
        teach: >
          A stock trades at $70$ and you think it will finish close to $70$ in
          two months. Selling options would collect premium but carries
          unbounded risk. Two-month calls trade at $12.10$ for the $60$
          strike, $5.60$ for the $70$ and $1.90$ for the $80$.
      - ask: >
          First, buy the $60/70$ bull call spread: long the $60$ call, short
          the $70$ call. What does it cost?
        expects: "6.5"
        feedback: >
          $12.10 - 5.60 = 6.50$. It pays from $0$ at $60$ up to a flat $10$
          from $70$ on.
      - ask: >
          Now also sell the $70/80$ call spread: short the $70$ call, long the
          $80$ call. What credit does that bring in?
        expects: "3.7"
        feedback: >
          $5.60 - 1.90 = 3.70$. This leg costs you from $0$ at $70$ down to a
          flat $-10$ from $80$ on.
      - ask: >
          What is the net cost of the two spreads together?
        expects: "2.8"
        feedback: >
          $6.50 - 3.70 = 2.80$.
      - ask: >
          What does the combined position pay at expiry if the stock finishes
          at exactly $70$?
        expects: "10"
        feedback: >
          The first spread pays its full $10$ and the second costs nothing yet:
          $10 + 0 = 10$, on a cost of $2.80$.
      - ask: >
          What does it pay if the stock finishes at $85$?
        expects: "0"
        feedback: >
          The first spread pays $10$ and the second costs $10$: nothing. The
          same happens anywhere below $60$, where every leg is worthless.
      - reflect: >
          Describe the combined payoff from $50$ to $90$, and say what you
          hold once the two $70$ calls are counted together.
        answer: >
          Zero up to $60$, rising with slope $1$ to a peak of $10$ at $70$,
          falling with slope $-1$ back to zero at $80$, and zero beyond: a
          tent centred on $70$. Counted together you are long one $60$ call,
          short *two* $70$ calls and long one $80$ call. Its worst case is the
          $2.80$ paid, and it never owes anything at expiry.

      - part: The butterfly
        teach: >
          That is a long call *butterfly*: long one $K_1$ call, short two
          $K_2$ calls, long one $K_3$ call, with $K_2$ midway. Max profit is the
          wing width minus the debit, here $10 - 2.80 = 7.20$, at $K_2$; max
          loss is the debit, outside $[K_1, K_3]$. Because its payoff is a
          nonnegative tent, its price is the discounted risk-neutral
          expectation of something never negative.
      - ask: >
          What is the butterfly's lower breakeven?
        expects: "62.8"
        feedback: >
          On the rising edge the payoff is $S_T - 60$, which repays $2.80$ at
          $S_T = 62.80$. By symmetry the upper breakeven is
          $80 - 2.80 = 77.20$.
      - ask: >
          A colleague puts it on as long the $60$ call, short *one* $70$ call,
          long the $80$ call. What goes wrong?
        choices:
          - text: >
              Nothing: it is the same tent, just smaller.
            feedback: >
              Above $80$ the slopes add to $1 - 1 + 1 = 1$, so the payoff
              rises without bound instead of returning to zero. That is not a
              tent at all.
          - text: >
              Above $80$ the payoff climbs again with slope $1$, so it is no
              longer a pin bet.
            correct: true
            feedback: >
              The second short $70$ call is what bends the right side back
              down. With only one, the position is a bull spread plus an extra
              long call.
          - text: >
              It costs more but has the same payoff.
            feedback: >
              It does cost more — $8.40$ — but the payoff differs too: past $80$
              it keeps rising.
        feedback: >
          The $1{:}2{:}1$ ratio is load-bearing: slopes $+1$, then $-1$, then
          $0$.

      - part: What its price says
        ask: >
          A broker shows the $60/70/80$ butterfly at $-0.40$: you would be paid
          $0.40$ to own it. What follows?
        choices:
          - text: >
              It is a cheap bet that the stock finishes near $70$.
            feedback: >
              It is better than cheap. You are paid to hold something whose
              payoff is never negative, so you cannot lose.
          - text: >
              It is an arbitrage: take the $0.40$, and the tent can only add to
              it.
            correct: true
            feedback: >
              The payoff is at least $0$ in every state, so a negative price is
              free money. A quoted volatility smile that implies one is
              internally inconsistent.
          - text: >
              It means the market sees almost no chance of a finish near $70$.
            feedback: >
              Almost no chance would make the price close to $0$, not below
              it. No probability makes the expectation of a nonnegative payoff
              negative.
        feedback: >
          Butterflies must be priced positive; a negative one flags an
          arbitrage in the quotes.
      - ask: >
          Overnight the butterfly's price rises from $2.80$ to $3.40$ with the
          stock still at $70$. What has the market changed its mind about?
        choices:
          - text: >
              It now gives a finish near $70$ more risk-neutral weight.
            correct: true
            feedback: >
              The butterfly pays only near $70$, so its price is a read on
              how much risk-neutral probability sits there. More weight near
              the middle strike, a dearer butterfly.
          - text: >
              It now expects the stock to rise.
            feedback: >
              The tent is symmetric around $70$ and the stock has not moved. A
              directional view would show up elsewhere.
          - text: >
              It now expects more volatility.
            feedback: >
              More volatility spreads probability *away* from the middle,
              which cheapens a butterfly centred at the money.
        feedback: >
          A butterfly is the cleanest quoted probe of the risk-neutral density
          near its middle strike.
      - teach: >
          In an interview: two vertical spreads, or long-two-short-long in the
          ratio $1{:}2{:}1$; a tent peaking at the middle strike; max profit is
          the wing width minus the debit, max loss is the debit, breakevens one
          debit inside each wing; and its price must be positive.

  - node: quant-finance.options.synthetics
    hook: >
      "You want to be long the stock but the options desk has better
      liquidity" is exactly when synthetics pay off, and put–call parity
      is the whole toolkit for building any leg from the other three.
    explanation: >
      Put–call parity, $C-P=S-Ke^{-rT}$, is usually read as a pricing
      constraint; read instead as an identity between positions, it says
      any one of the four instruments — long call, short put, long stock,
      short bond — is recoverable from the other three. Rearranged four
      ways: long call plus short put equals long stock financed by
      borrowing $Ke^{-rT}$ (synthetic long stock); short call plus long
      put is the mirror; long stock plus short call equals short put plus
      a bond, so a covered call is a disguised short put; long stock plus
      long put equals long call plus a bond.

      Each of these is the same identity solved for a different unknown,
      so there's nothing new to derive per combination — isolate the leg
      you want and read off what it equals. That makes the identity
      useful two ways: express a view through whichever leg is cheapest
      or most liquid to trade, and check a quoted set of prices for
      consistency in one line — if $C-P\ne S-Ke^{-rT}$, one side is a buy
      and the other a sell, riskless.

      The identity needs European exercise, matched strike and expiry,
      and no dividends before $T$ to hold exactly; American exercise or
      dividends require the dividend-adjusted or inequality forms instead.
    worked: >
      $S=70$, $K=65$, $r=0.04$, $T=1$, and the market quotes the call at
      $9$. Parity pins the put: $P=C-S+Ke^{-rT}=9-70+65e^{-0.04}
      \approx 9-70+62.45=1.45$. Check the synthetic: long call plus short
      put costs $9-1.45=7.55$, and $S-Ke^{-rT}=70-62.45=7.55$ — matches,
      confirming the synthetic long stock is correctly priced.
    interview: >
      "Build me synthetic [stock/short stock] out of options" or "price
      the put given the call" both test this identity directly — the
      interviewer wants the rearrangement done instantly, not re-derived
      from scratch each time.
    pitfalls: >
      Forgetting the dividend or American-exercise caveats and applying
      the plain identity anyway gives a wrong number. Getting the sign of
      the bond leg backwards flips a synthetic long into a synthetic
      short.
    recap: >
      Put–call parity is an identity between positions, not just prices —
      any leg is recoverable from the other three, which is how a covered
      call becomes a short put in disguise.
    dialogue:
      - part: Long the stock without the stock
        teach: >
          Your desk may not hold shares of a stock trading at $36$, but it may
          trade the stock's European options struck at $40$, all expiring
          together. Rates are zero. The $40$ call costs $1.90$ and the $40$ put
          $5.90$. You want a position that gains $1$ for every $1$ the stock
          rises.
      - ask: >
          You buy the $40$ call and sell the $40$ put. What do the two legs pay
          together at expiry if the stock finishes at $50$?
        expects: "10"
        feedback: >
          The call pays $10$ and the put expires worthless: $10$.
      - ask: >
          And if the stock finishes at $30$?
        expects: "-10"
        feedback: >
          The call is worthless and you owe the put's holder $40 - 30 = 10$:
          $-10$. Above or below the strike, the pair pays $S_T - 40$, a
          straight line of slope $1$.
      - ask: >
          Counting the premiums — $1.90$ paid, $5.90$ received — what is your
          P&L if the stock finishes at $50$?
        expects: "14"
        feedback: >
          $10 - 1.90 + 5.90 = 14$, exactly what a share bought at $36$ would
          have made: $50 - 36 = 14$. The same holds at every finishing price.
      - reflect: >
          The pair pays $S_T - 40$ in every state. Say what you would add to
          it to pay exactly $S_T$, like a share — and write the identity
          between prices that this forces.
        answer: >
          Add a riskless bond paying $40$ at expiry, worth $Ke^{-rT}$ today
          (here just $40$). Call minus put plus bond pays $S_T$ in every
          state, so it must cost what the share costs:
          $C - P + Ke^{-rT} = S$. Here $1.90 - 5.90 + 40 = 36$. That is
          put–call parity, read as a statement about positions rather than
          prices.

      - part: The identity as a recipe
        teach: >
          Put–call parity, $C - P = S - Ke^{-rT}$, says any one of call, put,
          stock and bond can be built from the other three. Long call plus
          short put is synthetic long stock, financed by borrowing the strike;
          short call plus long put is synthetic short stock. Move terms across
          and every common position has a twin.
      - ask: >
          A trader owns the stock and sells the $40$ call against it: a
          covered call. Which position has the same payoff?
        choices:
          - text: >
              A long put plus a bond.
            feedback: >
              A long put pays more when the stock falls. A covered call does
              the opposite: it loses as the stock falls, cushioned only by the
              premium.
          - text: >
              A short put plus a bond paying $40$.
            correct: true
            feedback: >
              From $S - C = Ke^{-rT} - P$: stock minus call is bond minus put.
              Both pay $40$ less a put's payoff — capped at $40$ above the
              strike, losing one for one below it.
          - text: >
              A long call plus a bond.
            feedback: >
              That pays at least $40$ and rises without limit. A covered call
              is capped above the strike, because the call was sold.
        feedback: >
          A covered call is a naked short put in disguise: the same payoff,
          the same risk.
      - ask: >
          A trader owns the stock and buys the $40$ put as insurance. Which
          position has the same payoff?
        choices:
          - text: >
              A long call plus a bond paying $40$.
            correct: true
            feedback: >
              From $S + P = C + Ke^{-rT}$. Both pay at least $40$, and one for
              one above it.
          - text: >
              A short call plus a bond.
            feedback: >
              That is capped above, at $40$. The insured stock keeps all its
              upside.
          - text: >
              A long call and a long put.
            feedback: >
              That is a straddle: it pays in both directions with no floor of
              $40$. The insured position has a floor and only one upside.
        feedback: >
          Insured stock is a call with the strike set aside in cash.
      - ask: >
          Which position is synthetic *short* stock?
        choices:
          - text: >
              Short the $40$ call, long the $40$ put.
            correct: true
            feedback: >
              It pays $40 - S_T$: you gain $1$ for every $1$ the stock falls,
              as a short seller does, against $40$ lent rather than borrowed.
          - text: >
              Short the $40$ put, long the $40$ call.
            feedback: >
              That is the synthetic *long* you built first, paying $S_T - 40$.
          - text: >
              Short the $40$ call and the $40$ put.
            feedback: >
              That is a short straddle: it loses in both directions and makes
              money only if the stock stays near $40$.
        feedback: >
          Flip every sign of the synthetic long and you have the synthetic
          short.

      - part: Spotting a bad quote
        ask: >
          The put is now quoted at $6.40$, with the call still at $1.90$ and
          the stock at $36$. Which trade locks in a profit?
        choices:
          - text: >
              Buy the put, sell the call and buy the stock.
            feedback: >
              That buys the expensive side. Parity says the put should cost
              $5.90$; at $6.40$ you want to sell it.
          - text: >
              Sell the put, buy the call and short the stock.
            correct: true
            feedback: >
              Long call plus short put is synthetic long stock at a cost of
              $1.90 - 6.40 = -4.50$, against $36 - 40 = -4$ for the real thing.
              Own the cheap version, short the real one.
          - text: >
              Sell the put and hold the proceeds.
            feedback: >
              A naked short put is a bet on the stock staying above $40$.
              Without the other two legs nothing is locked in.
        feedback: >
          One line of parity shows which side is rich: here the put.
      - ask: >
          How much does that trade lock in per share?
        expects: "0.5"
        feedback: >
          Today: $+6.40 - 1.90 + 36 = 40.50$. At expiry the call and put
          together oblige you to buy one share at $40$, which closes the short:
          you pay $40$. Profit $40.50 - 40 = 0.50$, the put's overpricing.
      - ask: >
          The stock will pay a dividend of $1$ before expiry. Which version of
          parity holds?
        choices:
          - text: >
              $C - P = 36 - 40 = -4$, unchanged.
            feedback: >
              The shareholder collects the dollar; the call holder does not.
              The synthetic stock and the real stock now pay different things.
          - text: >
              $C - P = 36 - 1 - 40 = -5$.
            correct: true
            feedback: >
              The options are on the stock *after* the dividend, so the stock
              leg must be stripped of it: $S - D - Ke^{-rT}$.
          - text: >
              $C - P = 36 + 1 - 40 = -3$.
            feedback: >
              The dividend lowers what the option holder effectively owns,
              so it is subtracted, not added.
        feedback: >
          Parity is exact only for what the four legs actually pay. Dividends
          and American early exercise are the two places it needs adjusting.
      - teach: >
          In an interview, say parity as positions: call minus put is stock
          minus bond. Then rearrange live — a covered call is a short put, a
          protective put is a long call — and use the same line to say which
          quote is rich and what to trade against it.

  - node: quant-finance.options.options-as-vol-bets
    hook: >
      "The stock will move more than the market thinks" is the interview
      phrasing for a volatility view, and naming the straddle instantly —
      not a call, not a put — is the tell that you've internalized this
      unit.
    explanation: >
      Strip the directional bet out of an option and what's left is a bet
      on realized volatility against the implied volatility you paid for.
      Hedge a long option's direction away by continuously trading the
      underlying against its changing delta, and the surviving profit
      over the position's life is, to good approximation, realized
      variance minus implied variance — the precise accounting is gamma
      and theta's job, but the qualitative fact holds without them: pay
      for implied vol, collect on realized vol, and the difference is the
      trade.

      That reframing explains the trader's vocabulary. Nobody says "I
      bought a call," they say "I bought vol," because an unhedged long
      call actually bundles two bets — a bet the stock rises and a bet it
      moves a lot either way — and only the second is what most option
      traders are trying to express. The straddle is the clean version:
      its two deltas roughly cancel near the money, so it carries almost
      no directional exposure and isolates the volatility bet by itself.

      The rule of thumb $C\approx 0.4\sigma S\sqrt{T}$ makes this
      concrete: since an at-the-money put costs about the same as the
      call when $r$ is small, the straddle costs about
      $0.8\sigma S\sqrt{T}$, so dividing by $S$ gives the straddle's
      breakeven move as a fraction of spot — the market's implied move.
      Buy the straddle when you believe the true move will exceed that
      number.
    worked: >
      $S=50$, implied $\sigma=30\%$, $T=0.25$. ATM call
      $\approx 0.4(0.30)(50)\sqrt{0.25}=0.4(0.30)(50)(0.5)=3.0$; straddle
      $\approx 2(3.0)=6.0$. As a fraction of spot, $6/50=12\%$: the
      market is implying about a $12\%$ move this quarter. If realized
      volatility pushes the actual move past $12\%$, the straddle is
      priced too cheap for that belief and is the trade.
    interview: >
      "How do you trade a view that a stock will be more volatile than
      the market expects" should produce "buy the straddle" immediately,
      followed by "because it isolates realized-vs-implied variance with
      direction hedged out."
    pitfalls: >
      Calling an unhedged long call a "pure vol bet" misses that it
      bundles direction and volatility together; only a delta-hedged
      position or a near-the-money straddle isolates volatility alone.
    recap: >
      Stripped of direction, an option pays realized volatility minus the
      implied volatility you paid for it — the straddle, its two deltas
      canceling near the money, is the cleanest instrument for that bet.
    dialogue:
      - part: Right about direction, still losing
        teach: >
          A stock trades at $90$ and you are confident it will rise over the
          next three months. The three-month $90$ call and $90$ put each cost
          $7.20$, which inverts to an implied volatility of $40\%$.
      - ask: >
          You buy the call and the stock rises to $96$, as you said it would.
          What is your P&L?
        expects: "-1.2"
        feedback: >
          The call pays $6$ and cost $7.20$: you lose $1.20$ on a correct
          call of direction.
      - ask: >
          Why did being right about direction lose money?
        choices:
          - text: >
              The market expected the stock to fall, so the call was priced
              against you.
            feedback: >
              The call's price does not encode a direction: under the pricing
              measure the stock drifts at the riskless rate whatever anyone
              expects. The problem is the size of the move.
          - text: >
              The premium paid for a larger move than the $6$ that happened.
            correct: true
            feedback: >
              At $40\%$ implied volatility the market priced a move of several
              times $6$ over three months. You were right on direction and
              wrong on magnitude, and an option charges for magnitude.
          - text: >
              The dealer overcharged; a fair call would have made money.
            feedback: >
              A fair price is one that breaks even on average under the
              pricing measure. Small moves lose, large ones win, and a $6$ move
              on a $40\%$ stock is small.
        feedback: >
          A call bundles a view on direction with a view on the size of the
          move. You can be right on one and lose on the other.
      - ask: >
          The straddle — the call plus the put — costs $14.40$. How large a
          move, as a fraction of the $90$ spot, does it need to break even?
        expects: "0.16"
        feedback: >
          $14.40/90 = 0.16$: a $16\%$ move either way, to $75.60$ or $104.40$.
          That is the move the market has priced.
      - ask: >
          The stock instead falls to $70$. What is the straddle's P&L?
        expects: "5.6"
        feedback: >
          The put pays $20$, the call nothing: $20 - 14.40 = 5.60$. The
          straddle did not care which way the stock went, only how far.
      - reflect: >
          The straddle would have won on a fall to $70$ or a rise to $110$, and
          lost on the rise to $96$. What single quantity about the next three
          months is it really a bet on, and against what number?
        answer: >
          It bets on how much the stock actually moves — its realized
          volatility — against the $40\%$ implied volatility you paid. Move
          more than the price assumed and it wins; less, and it loses, in
          either direction. Buying an option is buying volatility at the
          implied level.

      - part: Buying and selling volatility
        teach: >
          Hedge an option's direction away and what survives, over its life,
          is roughly realized variance minus implied variance. Hence the
          trader's vocabulary: you buy and sell vol, not calls and puts. An
          unhedged call is two bets bundled, on direction and on volatility;
          the straddle, whose two legs' directional exposures cancel near the
          money, is the clean expression of the volatility view alone.
      - ask: >
          You think this stock will realize about $30\%$ over the three months
          against the $40\%$ implied, with no view on direction. What do you
          trade?
        choices:
          - text: >
              Buy the straddle: options are the way to trade volatility.
            feedback: >
              Buying the straddle is buying volatility at $40\%$. Your view is
              that $40\%$ is too high, so you want to be on the other side.
          - text: >
              Sell the straddle.
            correct: true
            feedback: >
              You collect $14.40$, which assumes $40\%$; if the stock realizes
              $30\%$ it tends to move less than that pays for, and you keep
              the difference — accepting unbounded risk if you are wrong.
          - text: >
              Sell the call only.
            feedback: >
              That also sells volatility, but adds a bet that the stock will
              not rise. You said you have no view on direction.
        feedback: >
          The trade follows the comparison: realized above implied, buy vol;
          below, sell it.
      - ask: >
          Measure the view in variance per year: your realized variance minus
          the implied variance. What is it?
        expects: "-0.07"
        tolerance: 0.0005
        feedback: >
          $0.30^{2} - 0.40^{2} = 0.09 - 0.16 = -0.07$. Negative, so a hedged
          long option position would expect to lose and the short side is
          the trade.
      - ask: >
          You buy the call and hedge its direction away by trading the stock
          every day. What now decides whether you make money?
        choices:
          - text: >
              Whether the stock finishes above $90$.
            feedback: >
              The hedge has removed that bet: as the stock rises you hold
              more short stock against the call, and the gains offset.
          - text: >
              Whether the stock's realized volatility beats the $40\%$ you
              paid.
            correct: true
            feedback: >
              With direction hedged, the call's leftover profit comes from the
              stock moving around more than the price assumed. That is the
              realized-minus-implied accounting.
          - text: >
              Nothing: a hedged option has no P&L.
            feedback: >
              The hedge removes direction, not volatility. A stock that
              whipsaws more than $40\%$ makes the hedged call money; a quiet
              one loses it.
        feedback: >
          Hedged, an option is a pure volatility position.

      - part: Where the intuition misleads
        ask: >
          A colleague says: "This stock is extremely volatile, so options on
          it are a good buy." What is missing?
        choices:
          - text: >
              Nothing: higher volatility always makes options more valuable to
              own.
            feedback: >
              More valuable, and already priced. If implied volatility is
              $80\%$ and the stock realizes $70\%$, a very volatile stock was
              still a losing purchase.
          - text: >
              The comparison with implied volatility: what matters is
              realized against what you paid, not the level.
            correct: true
            feedback: >
              The volatility a stock is known for is in the price. The trade
              is only good if the stock moves *more than the market thinks*.
          - text: >
              A view on direction: volatile stocks need one.
            feedback: >
              The straddle shows a volatility view needs no direction. What it
              needs is a comparison with the implied level.
        feedback: >
          "Buy vol" means "buy it cheaper than it will turn out to be".
      - ask: >
          The stock jumps from $90$ to $110$ soon after you buy the straddle.
          Is it still a pure volatility bet?
        choices:
          - text: >
              Yes: a straddle is always direction-neutral.
            feedback: >
              Only near the strike. At $110$ the call is deep in the money and
              the put nearly worthless, so the position now gains almost one
              for one as the stock rises.
          - text: >
              No: far from the strike it behaves mostly like the call, a bet on
              direction.
            correct: true
            feedback: >
              The two legs cancel each other's direction only near the money.
              To keep the bet pure, traders re-hedge or roll the straddle to
              the new spot.
          - text: >
              No: it is now a pure bet that the stock falls.
            feedback: >
              The put is far out of the money and the call dominates, so the
              position gains as the stock *rises*.
        feedback: >
          The straddle isolates volatility near its strike; once the stock
          moves away, direction creeps back.
      - teach: >
          Said aloud: "If I think the stock will move more than the market
          thinks but not which way, I buy the at-the-money straddle. Its price
          is the implied move; I profit if realized volatility beats implied.
          A call would bundle a direction bet I do not have."
