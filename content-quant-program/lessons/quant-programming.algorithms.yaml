unit: quant-programming.algorithms
opening: >
  Algorithmic Patterns is the toolbox for the "now make it faster" half of a
  quant coding interview: a short list of shapes — binary search and its
  search-on-the-answer generalization, the sorted-data sweep of two pointers
  and its sliding-window and prefix-sum cousins, dynamic programming's
  cache-the-subproblem discipline, greedy algorithms proved correct by an
  exchange argument, and graph traversal by breadth or depth — that between
  them answer nearly every optimization prompt you'll see. The unit builds in
  that order: binary search and two worked examples of it, the
  information-theoretic ceiling on comparison sorting that explains why some
  "faster" asks are impossible, the two-pointer family from converging sums
  through sliding windows to prefix sums, dynamic programming from its
  four-step drill through three canonical tables, breadth- and depth-first
  search with the shortest-path guarantee BFS buys, greedy correctness via the
  exchange argument, and a closing reservoir mapping each "optimize this" cue
  straight to the technique it wants. By the end you should be able to hear a
  target complexity named out loud and answer with the one pattern that
  reaches it, not a list of guesses.
lessons:
  - node: quant-programming.algorithms.binary-search
    hook: >
      Binary search is two lines of logic that turn into a five-minute
      debugging session the moment the loop invariant isn't pinned down first
      — nail the invariant and the code that follows is almost mechanical.
    explanation: >
      The technique needs nothing more than a monotone predicate: a way to
      look at the midpoint and know, with certainty, which whole side of it
      can be discarded. Sortedness is just the common way that monotonicity
      arises, not the requirement itself — the real requirement is that
      "probe here" partitions the space into a false side and a true side with
      no false ever following a true.

      State the invariant in one sentence before writing a line: everything
      strictly below $\ell$ has already failed the predicate, everything at or
      above $r$ is confirmed true or beyond the window, and the answer lives
      somewhere in $[\ell, r)$. Every comparison then moves exactly one
      boundary past the midpoint, so the window's width halves each step —
      after $k$ probes at most $n/2^{k}$ candidates remain, which is why $20$
      probes cover a million rows and $30$ cover a billion.

      Two habits remove the fence-post bugs that sink this technique in
      practice. Decide once whether $\ell$ moves to $m$ or $m+1$ (and
      symmetrically for $r$) and apply it consistently — mixing the two
      stalls the loop on a two-element window. Write the midpoint as
      $\ell + (r-\ell)/2$, never $(\ell+r)/2$, so two large indices can't
      overflow before the halving even happens.
    worked: >
      Find the leftmost index with value at least $47$ in the sorted array
      $3,12,24,35,47,47,61,89$ (eight elements, indices $0$–$7$). Window
      $[0,8)$: $m=4$, $a_4=47\ge 47$, so the answer is at or before $m$ and
      $r\to 4$. Window $[0,4)$: $m=2$, $a_2=24<47$, so $\ell\to 3$. Window
      $[3,4)$: $m=3$, $a_3=35<47$, so $\ell\to 4$. Window $[4,4)$ is empty, so
      the search stops with $\ell=4$ — the answer is index $4$, found in three
      probes for eight elements, matching $\log_{2}8=3$.
    interview: >
      Expect variants phrased as "find the first/last occurrence", "find the
      insertion point", or "search a rotated sorted array" — the interviewer
      is listening for the invariant stated in words before any code, and for
      clean handling of duplicates (do you want the leftmost or rightmost
      match).
    pitfalls: >
      Moving $\ell$ to $m$ instead of $m+1$ (or the symmetric mistake on $r$)
      loops forever on a two-element window. Mixing strict and non-strict
      comparisons mid-derivation quietly changes whether you're finding the
      first true or the last true value. Computing the midpoint as
      $(\ell+r)/2$ overflows in fixed-width integer arithmetic once both
      indices are large.
    recap: >
      Halve a window bounded by one loop invariant stated in words — that
      invariant, held exactly, is what makes binary search's $O(\log n)$ both
      correct and bug-free.
    dialogue:
      - part: Sixteen prices and one threshold
        teach: >
          A desk keeps the day's sixteen fill prices sorted: $12, 15, 21, 26,
          30, 34, 41, 47, 52, 58, 63, 70, 77, 81, 88, 95$, at indices $0$
          through $15$. A risk check needs the first index whose price is at
          least $60$.
      - ask: >
          Reading from the left, how many entries do you look at before you
          can name that index?
        expects: "11"
        hint: >
          Find the first price that reaches $60$, then count the entries up to
          and including it.
        feedback: >
          Indices $0$ through $9$ are all below $60$ and index $10$ holds
          $63$, so the scan reads $11$ entries. On a million sorted prices the
          same scan can read a million.
      - ask: >
          Instead you open the list at index $7$ and see $47$. What has that
          one look told you?
        choices:
          - text: >
              Only that index $7$ is not the answer; everything else still
              has to be read.
            feedback: >
              The list is sorted, so every entry left of index $7$ is at most
              $47$, hence below $60$ as well. One look ruled out eight
              indices, not one.
          - text: >
              The answer must be index $8$, the next entry.
            feedback: >
              Index $8$ holds $52$, still short of $60$. The look tells you
              which side the answer lies on, not where on that side.
          - text: >
              Indices $0$ through $7$ all fall below $60$, so the answer is
              at index $8$ or later.
            correct: true
            feedback: >
              Sortedness carries the verdict leftward: nothing at or before
              index $7$ exceeds $47$. Eight candidates are gone for the price
              of one comparison.
        feedback: >
          On a sorted list one comparison is a verdict on a whole side, which
          is a far better trade than the scan's one verdict per entry.
      - reflect: >
          One look removed eight candidates. Where would you look next, and
          what exactly about the list made a single look that strong? Would it
          still work on the same sixteen prices shuffled?
        hint: >
          Think about the question "is the price at least $60$?" asked at
          every index in turn.
        answer: >
          Look at the middle of what remains, and every look halves the
          candidates again: $16$, $8$, $4$, $2$, $1$. The power comes from
          the yes/no question "is $a_i \ge 60$?" being *no* on a block of
          indices and then *yes* on the rest, never switching back. Shuffle
          the list and that shape is gone: a $47$ at index $7$ says nothing
          about index $3$, and you are back to scanning.

      - part: The window and its promise
        teach: >
          That is binary search. Keep a window $[\ell, r)$ known to contain
          the answer, starting at $[0, 16)$. Probe its middle,
          $m = \ell + \lfloor (r-\ell)/2 \rfloor$. If $a_m \ge 60$, set
          $r = m$; otherwise set $\ell = m + 1$. Stop when $\ell = r$ and
          report $\ell$. Sortedness itself is never used, only the fact that
          the test $a_m \ge 60$ is false on a prefix of the indices and true
          on the rest: a monotone predicate.
      - ask: >
          Run it on the sixteen prices. How many probes happen before the
          window is empty?
        expects: "4"
        hint: >
          Write the window down after each probe; the first midpoint is
          $m = 8$.
        feedback: >
          $[0,16)$: $m = 8$, $a_8 = 52 < 60$, so $\ell \to 9$. $[9,16)$:
          $m = 12$, $a_{12} = 77 \ge 60$, so $r \to 12$. $[9,12)$: $m = 10$,
          $a_{10} = 63 \ge 60$, so $r \to 10$. $[9,10)$: $m = 9$,
          $a_9 = 58 < 60$, so $\ell \to 10$. The window $[10,10)$ is empty
          after $4$ probes, against the scan's $11$ reads.
      - ask: >
          The loop stopped at $\ell = r = 10$. What guarantees that $10$ is
          the answer?
        choices:
          - text: >
              The last probe looked at index $10$.
            feedback: >
              The last probe looked at index $9$, which holds $58$. No single
              probe certifies the answer; something every update preserved
              does.
          - text: >
              Binary search always lands near the middle of the original
              window.
            feedback: >
              The original middle was index $8$, holding $52$. The answer can
              sit anywhere, including index $0$ or past the end.
          - text: >
              Every update kept two facts true: each index below $\ell$ fails
              the test, and each index at or above $r$ passes it.
            correct: true
            feedback: >
              With $\ell = r = 10$, everything below $10$ fails and everything
              from $10$ on passes, so $10$ is the first index that passes. No
              other argument is needed.
        feedback: >
          That sentence is the loop invariant, and it checks each update for
          you. $a_m \ge 60$ says $m$ passes, so $r = m$ keeps the promise
          about $r$; $a_m < 60$ says $m$ and everything left of it fail, so
          $\ell = m + 1$ keeps the promise about $\ell$. Say it in words before
          writing the loop.

      - part: What it costs, and how it breaks
        ask: >
          A tick file holds $5{,}000{,}000$ sorted timestamps. At most how
          many probes does binary search need to find the first one at or
          after a given time?
        expects: "23"
        hint: >
          Each probe halves the window. Find the smallest $k$ with $2^{k}$ at
          least five million.
        feedback: >
          After $k$ probes at most $5{,}000{,}000/2^{k}$ candidates remain.
          $2^{22} = 4{,}194{,}304$ falls short and $2^{23} = 8{,}388{,}608$
          clears it, so $23$ probes, against up to five million reads for the
          scan. That is the $O(\log n)$.
      - ask: >
          A colleague writes $\ell = m$ instead of $\ell = m + 1$ when
          $a_m < 60$. On the sixteen prices, what happens?
        choices:
          - text: >
              It returns $9$, one index too early.
            feedback: >
              It never returns at all. The window shrinks to $[9, 10)$, where
              $m = 9$ and $a_9 = 58 < 60$, so $\ell$ is set to $9$, which it
              already was.
          - text: >
              It never stops: at the window $[9, 10)$ it probes index $9$ and
              sets $\ell = 9$ again.
            correct: true
            feedback: >
              On a one-wide window $m = \ell$, so $\ell = m$ changes nothing
              and the loop spins forever.
          - text: >
              It returns $10$ after one extra probe.
            feedback: >
              That would be harmless, but the window never empties. Once it
              is $[9, 10)$, every probe is index $9$ and every update leaves
              $\ell = 9$.
        feedback: >
          The $+1$ is not a style choice. $a_m < 60$ proves $m$ itself fails,
          and the invariant puts failing indices below $\ell$; leaving $m$
          inside the window both breaks the promise and stalls the loop.
      - ask: >
          Indices are 32-bit signed integers, whose largest value is
          $2^{31} - 1 = 2{,}147{,}483{,}647$. The window is
          $\ell = 1{,}200{,}000{,}000$ and $r = 1{,}800{,}000{,}000$. Which
          midpoint is safe to compute?
        choices:
          - text: >
              $(\ell + r)/2$, since the result, $1{,}500{,}000{,}000$, fits.
            feedback: >
              The result fits but the sum $\ell + r = 3{,}000{,}000{,}000$ does
              not, and it overflows before the halving happens, typically
              wrapping to a negative index.
          - text: >
              Either; the language widens to 64 bits when needed.
            feedback: >
              In C++ or Java, the sum of two 32-bit integers is computed in
              32 bits. Python's integers do not overflow, but the interviewer
              is asking about fixed-width arithmetic.
          - text: >
              $\ell + (r - \ell)/2$
            correct: true
            feedback: >
              $r - \ell = 600{,}000{,}000$ fits, and so does
              $\ell + 300{,}000{,}000 = 1{,}500{,}000{,}000$. No intermediate
              value exceeds $r$.
        feedback: >
          Same midpoint, different intermediate values. The safe form never
          builds anything larger than $r$.
      - teach: >
          In an interview, say the invariant before the loop: "everything
          below $\ell$ is too small, everything from $r$ on is big enough, and
          the answer is in $[\ell, r)$." The two update lines and the stopping
          rule then follow from that sentence, and the off-by-one bugs have
          nowhere to hide.

  - node: quant-programming.algorithms.binary-search-answer
    hook: >
      "Find the smallest $x$ that works" is the tell — the moment feasibility
      only ever turns on and stays on as $x$ grows, the array you'd normally
      sort doesn't need to exist at all.
    explanation: >
      Binary search only needs a monotone predicate, and a predicate over
      candidate answers is just as searchable as one over array indices —
      the "sorted data" of ordinary binary search is replaced here by the
      sorted, if implicit, range of possible answers. The recipe has three
      parts: write a checker $\mathrm{ok}(x)$ that decides feasibility, ideally
      by an $O(n)$ greedy simulation; bracket the range with a value known to
      fail and a value known to succeed; then binary search for the first $x$
      where $\mathrm{ok}$ turns true, exactly as in ordinary binary search.

      The cost is $O(n\log R)$ over an answer range of width $R$ — the search
      itself contributes only the $\log R$ factor, so the checker is the
      entire algorithm and usually the entire difficulty of the problem.

      Verifying monotonicity is the part that actually requires thought:
      binary search never checks it for you, so if feasibility can flicker
      back off as $x$ grows, the method still runs and still returns an
      answer — just the wrong one, with no error to catch it.
    worked: >
      Koko must eat banana piles $3,6,7,11$ within $h=8$ hours, eating from
      one pile per hour at an integer speed $k$; find the minimum feasible
      $k$. Checker: $\mathrm{ok}(k) = \sum_i \lceil p_i/k\rceil \le h$ — larger
      $k$ only shortens each term, so $\mathrm{ok}$ is monotone. Bracket with
      $\mathrm{low}=1$ and $\mathrm{high}=11$, the largest pile, which finishes
      in one hour at that speed. $\mathrm{ok}(3) = 1+2+3+4=10>8$, infeasible;
      $\mathrm{ok}(4)=1+2+2+3=8\le 8$, feasible. Binary search over $[1,11]$
      converges on $k=4$ in about $\log_{2}11\approx 4$ probes — the answer is
      $4$.
    interview: >
      Ship-in-D-days, split-array-to-minimize-largest-sum, and minimum
      eating speed are the same prompt wearing different nouns — the
      interviewer listens for you separating the checker from the search out
      loud and stating why feasibility is monotone before coding either half.
    pitfalls: >
      Coding the search without ever arguing monotonicity produces code that
      runs and returns a number silently wrong on inputs where feasibility
      isn't actually monotone. The bracket bounds need to be genuinely
      trivial cases (obviously infeasible, obviously feasible), not
      approximations — a bracket that excludes the true answer breaks the
      search before it starts. A checker that costs more than $O(n)$ erases
      the whole point, since the search itself is already nearly free.
    recap: >
      When feasibility is monotone in $x$, binary search the answer space
      itself with an $O(n)$ checker — total cost $O(n\log R)$, all of it spent
      in the checker.
    dialogue:
      - part: Twenty valuations on three servers
        teach: >
          Three pricing servers work in parallel. The first finishes one
          valuation every $3$ seconds, the second every $5$, the third every
          $7$, and none of them ever idles. A batch of $20$ valuations has
          just been queued, and the desk wants to know how soon it can be
          done.
      - ask: >
          How many valuations are finished after $21$ seconds?
        expects: "14"
        hint: >
          A server that takes $t$ seconds per valuation has finished
          $\lfloor 21/t \rfloor$ of them.
        feedback: >
          $\lfloor 21/3 \rfloor + \lfloor 21/5 \rfloor + \lfloor 21/7 \rfloor
          = 7 + 4 + 3 = 14$. Not enough: $21$ seconds is too soon.
      - ask: >
          How many are finished after $30$ seconds?
        expects: "20"
        feedback: >
          $10 + 6 + 4 = 20$. The batch is done by $30$ seconds, so the answer
          is somewhere from $22$ to $30$.
      - ask: >
          Without computing anything, what do you know about $40$ seconds?
        choices:
          - text: >
              Nothing yet; $40$ has to be checked like any other time.
            feedback: >
              Every server's count at $40$ seconds is at least its count at
              $30$, because finished work stays finished. $30$ was enough, so
              $40$ is too.
          - text: >
              It is enough, because no server's count ever falls as time
              passes.
            correct: true
            feedback: >
              The test "at least $20$ done by time $T$" can only switch from
              false to true as $T$ grows, never back.
          - text: >
              It depends on whether $40$ is a multiple of $3$, $5$ or $7$.
            feedback: >
              Divisibility changes the count by a little, not its direction.
              Each $\lfloor 40/t \rfloor$ is at least $\lfloor 30/t \rfloor$.
        feedback: >
          One feasible time settles every later time, and one infeasible time
          settles every earlier one.
      - reflect: >
          There is no sorted array here. Still, you have a range of candidate
          times, a test you can run on any one of them, and the fact you just
          used. How would you find the earliest time that is enough without
          trying every second from $1$ up?
        hint: >
          Recall what one probe in the middle of a sorted array lets you
          discard.
        answer: >
          Treat the candidate times as the sorted list and the test as the
          probe. "Done by $T$" is false on an initial stretch of times and
          true from some point on, exactly like "$a_i \ge 60$" on a sorted
          array, so probing the middle time and keeping the half that still
          contains the switch point halves the candidates each round. The
          array never needs to exist: each probe just runs the test.

      - part: Searching the answer, not the data
        teach: >
          That is binary search on the answer. Three pieces. A checker
          $\mathrm{ok}(T)$, here $\lfloor T/3 \rfloor + \lfloor T/5 \rfloor +
          \lfloor T/7 \rfloor \ge 20$, which costs $O(m)$ for $m$ servers. A
          bracket: a lower end known to fail and an upper end known to pass.
          Then binary search for the first $T$ where $\mathrm{ok}$ turns true.
          None of it is legal until monotonicity is argued, which you just
          did.
      - ask: >
          Which upper end is guaranteed to pass without running the checker?
        choices:
          - text: >
              $20$ seconds: the batch has twenty valuations.
            feedback: >
              No server manages one a second: $\mathrm{ok}(20)$ counts
              $6 + 4 + 2 = 12$. An upper end that fails puts the answer
              outside the bracket, and the search returns nonsense.
          - text: >
              $30$ seconds: the combined rate is $1/3 + 1/5 + 1/7 = 71/105$
              per second, and $20 \cdot 105/71 \approx 29.6$.
            feedback: >
              It happens to pass, but the rate estimate ignores that servers
              finish only whole valuations: at $29$ seconds the count is
              $9 + 5 + 4 = 18$. An end you cannot justify in one line is not
              a bracket.
          - text: >
              $60$ seconds: the $3$-second server alone finishes twenty by
              then.
            correct: true
            feedback: >
              $3 \cdot 20 = 60$, and the other two servers only add to the
              count. One line, no computation.
        feedback: >
          A bracket end should be trivially infeasible or trivially feasible:
          $T = 0$ finishes nothing, and $T = 60$ finishes twenty on one
          server. The search does the rest.
      - ask: >
          Search $[1, 60]$: probe $m = \ell + \lfloor (r-\ell)/2 \rfloor$, set
          $r = m$ if $\mathrm{ok}(m)$ and $\ell = m + 1$ otherwise, stop at
          $\ell = r$. What is the earliest time the batch can be done?
        expects: "30"
        hint: >
          The first probe is $m = 30$, which you already know passes.
        feedback: >
          $m = 30$: $20$ done, $r \to 30$. $m = 15$: $5 + 3 + 2 = 10$,
          $\ell \to 16$. $m = 23$: $7 + 4 + 3 = 14$, $\ell \to 24$. $m = 27$:
          $9 + 5 + 3 = 17$, $\ell \to 28$. $m = 29$: $9 + 5 + 4 = 18$,
          $\ell \to 30$. The loop stops at $30$ after five checker calls.
      - ask: >
          Now $1{,}000$ servers and a bracket about $2^{30}$ wide, roughly a
          billion seconds. Each checker call evaluates one term per server.
          About how many terms does the whole search evaluate?
        expects: "30000"
        tolerance: 1000
        hint: >
          Count the probes, then the cost of each probe.
        feedback: >
          About $30$ probes, since $2^{30}$ halves to $1$ in $30$ steps, at
          $1{,}000$ terms each: $30{,}000$. Trying every second instead costs
          up to a billion checker calls. This is the $O(m \log R)$: the
          search contributes only the $\log R$, and the checker is the whole
          algorithm.

      - part: When feasibility flickers
        teach: >
          A different desk splits $100$ identical contracts into equal clips
          of size $b$. A clip size is allowed when it divides $100$ exactly
          and gives at most $10$ clips. They want the smallest allowed $b$.
      - ask: >
          What is the smallest allowed clip size?
        expects: "10"
        hint: >
          Turn "at most $10$ clips" into a bound on $b$, then look for
          divisors of $100$.
        feedback: >
          $b$ must be at least $100/10 = 10$ and divide $100$; $10$ does,
          giving ten clips of ten.
      - ask: >
          Binary search on $[1, 100]$ with this checker returns $25$. What
          went wrong?
        choices:
          - text: >
              The bracket: $b = 1$ is not infeasible.
            feedback: >
              $b = 1$ makes $100$ clips, far more than $10$, so the lower end
              does fail. The bracket is fine.
          - text: >
              Nothing went wrong; $25$ is also a valid answer.
            feedback: >
              $25$ is allowed, but so is $10$, which is smaller. The search
              promised the smallest.
          - text: >
              Feasibility is not monotone: $b = 10$ works, $b = 13$ fails,
              $b = 20$ works again, and a failing probe at $13$ threw $10$
              away.
            correct: true
            feedback: >
              The probes run $50$ (passes), $25$ (passes), $13$ (fails, so
              $\ell \to 14$), and from then on everything below $14$ is gone,
              including $10$. The search still ends cleanly, on $25$.
        feedback: >
          Binary search never checks monotonicity; it assumes it. When the
          test can switch back off, the method still runs and still returns a
          number, just the wrong one, with no error to catch it. Arguing
          monotonicity is the real work.
      - teach: >
          In an interview, say the two halves separately: "The checker is a
          linear scan that answers *is $T$ enough?*; it is monotone because
          finished work stays finished; so I binary search $T$ between $0$
          and the fastest server's solo time." The interviewer is listening
          for that middle clause.

  - node: quant-programming.algorithms.ship-capacity
    hook: >
      This is search-on-the-answer's home turf — a bin-packing question where
      "in order, contiguous prefix" is the giveaway that a greedy day-counter
      is both the checker and the whole algorithm.
    explanation: >
      Capacity feasibility is monotone for a structural reason worth stating
      out loud: giving the ship more room can only let a greedy loader merge
      more packages into the same day, never fewer, so the number of days
      needed is non-increasing in capacity $C$. That's the license to binary
      search $C$ instead of simulating every capacity in turn.

      The two bracket ends generalize past this one problem: the lower end is
      whatever value makes the checker trivially fail (here, one package
      exceeding capacity), and the upper end is whatever value makes it
      trivially pass (here, everything loaded in a single day). Finding both
      bounds is usually a one-line observation once you've named the
      checker.

      The checker itself stays a simple $O(n)$ greedy scan: walk the packages
      in order, keep adding to the current day while they fit, and open a new
      day the moment one doesn't — no lookahead, no backtracking, just a
      running total compared against $C$.
    worked: >
      Weights $7,2,5,10,8$ must ship within $D=2$ days; find the minimum
      capacity. Bracket: $\mathrm{low}=10$ (the largest single weight),
      $\mathrm{high}=32$ (the total). Checker at $C=17$: day $1$ loads $7,2,5$
      (sum $14$, adding $10$ would exceed $17$), day $2$ loads $10$ (sum
      $10$, adding $8$ would exceed $17$), day $3$ loads $8$ — three days,
      infeasible. Checker at $C=18$: day $1$ loads $7,2,5$ (sum $14$, adding
      $10$ exceeds $18$), day $2$ loads $10,8$ (sum $18\le 18$) — two days,
      feasible. So the answer is $18$.
    interview: >
      The dressing changes — truck capacity over delivery routes, machine
      throughput over job batches — but the setup is identical; the
      interviewer listens for "feasibility is monotone in capacity because a
      bigger ship never needs more days" stated before any code, plus the
      correct floor of $\max_i w_i$.
    pitfalls: >
      Forgetting the floor $\max_i w_i$ lets the checker be run on a capacity
      too small for even one package to fit, which never terminates cleanly.
      Off-by-one on day counting — failing to count the final partial day, or
      opening an extra empty one at the end — silently shifts every feasibility
      answer. Confusing "at most $D$ days" with "exactly $D$ days" changes
      what the checker should even be testing.
    recap: >
      A bigger ship never needs more days, so capacity is searchable; on
      weights $7,2,5,10,8$ over $2$ days the greedy day-counter finds the
      answer $18$.
    dialogue:
      - part: Seven crates, three days
        teach: >
          A freight desk must ship crates of $6, 3, 8, 2, 5, 7, 4$ tonnes, in
          that order, within $3$ days. Each day the ship takes a run of crates
          from the front of what is left. The desk wants the smallest daily
          capacity $C$ that gets everything out on time.
      - ask: >
          A first guess splits the total weight evenly across the days. What
          capacity does that suggest, rounded up to a whole tonne?
        expects: "12"
        feedback: >
          The crates total $35$ tonnes, and $35/3 \approx 11.7$, so $12$. No
          capacity below $12$ can possibly work, since three days of less
          than $12$ cannot carry $35$. Whether $12$ itself works is another
          question.
      - ask: >
          Load at $C = 12$, filling each day until the next crate would push
          it over $12$, then starting a new day. How many days does that
          take?
        expects: "4"
        hint: >
          Day one starts with $6$ and $3$. Does the $8$ fit?
        feedback: >
          Day one: $6 + 3 = 9$, and the $8$ would make $17$. Day two:
          $8 + 2 = 10$, and the $5$ would make $15$. Day three: $5 + 7 = 12$.
          Day four: $4$. The average ignored that crates cannot be split and
          cannot be reordered.
      - ask: >
          Is filling each day as full as it will go the right way to count
          days at a given $C$?
        choices:
          - text: >
              Not always: stopping a day early can leave a better split for
              the days after.
            feedback: >
              Stopping early only pushes crates onto later days. Any plan's
              remaining crates after a day are a run from the back, and the
              greedy remainder is never longer than another plan's.
          - text: >
              Yes: after every day, greedy has shipped at least as many crates
              as any other valid plan, so it never falls behind.
            correct: true
            feedback: >
              By induction on days: if greedy is at least as far along after
              day $k$, the most any plan can add on day $k+1$ greedy can add
              too. So greedy's day count is the true minimum at that $C$.
          - text: >
              Yes, because the heaviest crates go first.
            feedback: >
              The order is fixed, and the $6$ goes before the $8$. Greedy is
              right for a different reason: it is never behind.
        feedback: >
          So one $O(n)$ scan decides whether a given $C$ is enough. That scan
          is the checker.
      - reflect: >
          $12$ is too small. Without testing every capacity from $13$ upward,
          how would you find the least one that works, and what single fact
          about capacities makes your method legitimate?
        hint: >
          If $C$ ships in $3$ days, what about $C + 1$?
        answer: >
          A bigger ship never needs more days: every greedy day at $C + 1$
          reaches at least as far as it did at $C$. So "ships in $3$ days" is
          false up to some capacity and true from then on, and you can binary
          search $C$ with the greedy scan as the checker, instead of trying
          capacities one at a time.

      - part: Bracket, then probe
        teach: >
          The search needs a range. Below $8$ tonnes the $8$-tonne crate fits
          on no day, so start at $\ell = 8$; at $35$ everything ships on day
          one, so $r = 35$ surely works. Probe
          $m = \ell + \lfloor (r-\ell)/2 \rfloor$; if the greedy scan at $m$
          takes at most $3$ days set $r = m$, otherwise set $\ell = m + 1$.
      - ask: >
          The first probe is $m = 21$. How many days does $C = 21$ take?
        expects: "2"
        feedback: >
          Day one: $6 + 3 + 8 + 2 = 19$, and the $5$ would make $24$. Day two:
          $5 + 7 + 4 = 16$. Two days, so $21$ works and $r \to 21$.
      - ask: >
          The window is now $[8, 21]$. How many days does the next probe,
          $C = 14$, take?
        expects: "4"
        feedback: >
          $m = 8 + \lfloor 13/2 \rfloor = 14$. Day one: $6 + 3 = 9$ (the $8$
          would make $17$). Day two: $8 + 2 = 10$ (the $5$ would make $15$).
          Day three: $5 + 7 = 12$ (the $4$ would make $16$). Day four: $4$.
          Too many, so $\ell \to 15$.
      - ask: >
          Finish the search on $[15, 21]$. What is the least capacity?
        expects: "15"
        hint: >
          The probes left are $18$, then $16$, then $15$.
        feedback: >
          $C = 18$: $6 + 3 + 8 = 17$, then $2 + 5 + 7 + 4 = 18$, two days, so
          $r \to 18$. $C = 16$: $6 + 3$, then $8 + 2 + 5$, then $7 + 4$, three
          days, so $r \to 16$. $C = 15$: the same three days, so $r \to 15$,
          and the window closes at $15$ after five probes. Since $14$ needed
          four days, $15$ is the answer.

      - part: What pins the answer
        ask: >
          At $C = 15$ the days carry $6 + 3 = 9$, $8 + 2 + 5 = 15$ and
          $7 + 4 = 11$. Which day is the reason the answer is not $14$?
        choices:
          - text: >
              Day one: it carries only $9$, so the plan is wasteful.
            feedback: >
              Day one cannot take the $8$ at any capacity under $17$; its $9$
              is forced. Slack on a day is not waste when the next crate does
              not fit.
          - text: >
              Day three: $11$ is close to the limit.
            feedback: >
              $11$ leaves room. Day three only matters through what the
              earlier days push onto it.
          - text: >
              Day two: it is full at exactly $15$.
            correct: true
            feedback: >
              At $14$ day two stops at $8 + 2$, and the leftover $5, 7, 4$
              weighs $16$, more than one $14$-tonne day can carry. One tonne
              less capacity costs a whole extra day.
        feedback: >
          The answer is always set by some day loaded exactly to capacity;
          take a tonne off and that day spills.
      - ask: >
          The desk may now load crates in any order it likes. Does the same
          search still find the least capacity?
        choices:
          - text: >
              Yes; reordering only gives more freedom, so the same code
              works.
            feedback: >
              More freedom changes the checker. The greedy scan assumes the
              order is fixed; with free order, deciding whether $C$ fits in
              $3$ days is bin packing.
          - text: >
              Monotonicity survives, but the greedy scan no longer decides
              feasibility: packing in any order is bin packing.
            correct: true
            feedback: >
              A bigger ship still never needs more days, so the search over
              $C$ is fine. What breaks is the $O(n)$ checker; "in order,
              contiguous" is what made greedy correct.
          - text: >
              No; free ordering makes feasibility non-monotone in $C$.
            feedback: >
              Any packing that works at $C$ still works at $C + 1$, so
              monotonicity holds. The trouble is elsewhere.
        feedback: >
          Search on the answer needs two things: a monotone test and a cheap
          checker. "In order" is the phrase that supplies the second.
      - ask: >
          A real manifest has $100{,}000$ crates and a total weight near
          $10^{9}$. About how many greedy scans does the search run?
        expects: "30"
        tolerance: 1
        hint: >
          The bracket is at most about $10^{9}$ wide.
        feedback: >
          $2^{30} \approx 1.07 \times 10^{9}$, so about $30$ probes, each one
          scan of $100{,}000$ crates: three million steps in all, where
          trying every capacity could take $10^{9}$ scans.
      - teach: >
          Said aloud: "Feasibility is monotone in capacity, because a bigger
          ship never needs more days. The checker is a greedy day-counter,
          $O(n)$. I search $C$ between the heaviest crate and the total, so
          $O(n \log \sum_i w_i)$."

  - node: quant-programming.algorithms.sorting-lower-bound
    hook: >
      "Can you sort faster than $n\log n$" is asked to see whether you can
      justify a limit, not just recite it — and the honest answer changes the
      instant the keys stop being arbitrary and start being bounded integers.
    explanation: >
      Frame any comparison-based sort as a walk down a binary decision tree:
      each internal node is one comparison with two outcomes, and the
      algorithm's execution on a given input is the root-to-leaf path that
      comparisons trace out. Two different orderings of the input must end at
      two different leaves, or the algorithm couldn't have told them apart —
      so the tree needs at least $n!$ leaves to correctly sort every
      permutation of $n$ distinct items.

      A binary tree with $L$ leaves has depth at least $\log_{2}L$, so the
      worst-case path — and therefore the worst-case comparison count — is at
      least $\log_{2}(n!)$. Stirling's approximation turns that into
      $n\log_{2}n - n\log_{2}e + O(\log n)$, which grows like $n\log_{2}n$,
      giving the $\Omega(n\log n)$ bound. This is exactly the counting
      argument behind information-theoretic lower bounds in general, just
      specialized to comparisons with two outcomes instead of a balance with
      three.

      Merge sort and heapsort both achieve $O(n\log n)$, so the bound is
      tight — but it is a bound on comparisons specifically. The moment the
      keys carry extra structure, such as living in a small known integer
      range, an algorithm can tally occurrences instead of comparing pairs,
      and the bound simply doesn't apply to it.
    worked: >
      For $n=8$, $8!=40320$, so any comparison sort needs at least
      $\lceil\log_{2}40320\rceil = 16$ comparisons in the worst case — a real
      algorithm like merge sort uses on the order of $n\log_{2}n\approx 24$,
      the right ballpark once constants are restored. Now suppose those $8$
      keys are drawn from $\{0,\dots,9\}$: counting sort tallies each of the
      $10$ buckets in one $O(n)$ pass and reads the sorted output back out,
      making zero comparisons between keys and finishing in $O(n+k)=O(18)$
      steps — the lower bound doesn't apply because the algorithm never
      compares two keys against each other.
    interview: >
      "Can this be sorted faster than $n\log n$" is answered with the
      decision-tree counting argument stated cold, not just the conclusion; a
      near-automatic follow-up is "when would you use counting or radix sort
      instead", testing whether you recognize bounded-range keys as the
      escape hatch.
    pitfalls: >
      Claiming a clever comparison-based sort can beat $O(n\log n)$ contradicts
      the counting argument outright — no such algorithm exists. Applying the
      $\Omega(n\log n)$ bound to counting or radix sort as if it still governed
      them misreads what the bound is actually about; it only constrains
      algorithms that decide order purely by comparisons.
    recap: >
      Comparison sorting needs $\Omega(n\log n)$ because $n!$ possible
      orderings force that many yes/no comparisons to tell them apart —
      counting and radix sorts escape only by never comparing.
    dialogue:
      - part: Three cards, yes-or-no questions
        teach: >
          An interviewer lays three face-down cards on the table, $A$, $B$
          and $C$, each hiding a different number. The only question you may
          ask is "is card $X$ smaller than card $Y$?", and you must end up
          knowing their order.
      - ask: >
          How many different orders could the three cards be in?
        expects: "6"
        feedback: >
          $3! = 6$: any of the three can be smallest, either remaining one
          can be next, and the last is forced.
      - ask: >
          Can some strategy always find the order with just $2$ questions?
        choices:
          - text: >
              Yes: ask $A$ against $B$, then $B$ against $C$.
            feedback: >
              If $A < B$ and $B > C$, you know $B$ is largest but not whether
              $A$ or $C$ comes first. That pair of answers covers two of the
              six orders.
          - text: >
              Yes, if the second question is chosen after hearing the first
              answer.
            feedback: >
              Adapting changes which question you ask, not how many answer
              patterns exist. Two yes/no answers still produce at most $4$
              patterns.
          - text: >
              No: two yes/no answers have only $4$ possible patterns, and six
              orders need six different ones.
            correct: true
            feedback: >
              If two orders produced the same answers, you could not tell them
              apart, and you would report the same order for both.
        feedback: >
          The count of possible answers, not the cleverness of the strategy,
          sets the floor.
      - ask: >
          What is the fewest questions that always suffices for three cards?
        expects: "3"
        hint: >
          Find the smallest $k$ with $2^{k} \ge 6$, then check a strategy
          reaches it.
        feedback: >
          $2^{2} = 4 < 6 \le 8 = 2^{3}$, so at least $3$. And $3$ is enough:
          order $A$ and $B$ with one question, then place $C$ with at most two
          more.
      - reflect: >
          Now $n$ cards. Without designing any sorting algorithm, how would
          you put a floor under the number of comparisons *every* algorithm
          must make on its worst input?
        hint: >
          You met the same counting with a balance scale, where each weighing
          has three outcomes.
        answer: >
          There are $n!$ possible orders, and each must produce a different
          sequence of answers, or the algorithm would treat two different
          inputs identically. $k$ yes/no answers make at most $2^{k}$
          sequences, so $2^{k} \ge n!$ and $k \ge \log_{2}(n!)$ on some input.
          It is the information lower bound with two outcomes per question
          instead of the balance's three.

      - part: The decision tree and its depth
        teach: >
          Draw any comparison sort as a binary decision tree: each internal
          node is a comparison, each branch an answer, each leaf a finished
          run. Every one of the $n!$ input orders must reach its own leaf, so
          the tree has at least $n!$ leaves, and a binary tree with that many
          leaves has a path of length at least $\log_{2}(n!)$. Stirling gives
          $\log_{2}(n!) = n \log_{2} n - n \log_{2} e + O(\log n)$, so every
          comparison sort makes $\Omega(n \log n)$ comparisons in its worst
          case. Merge sort and heapsort meet it.
      - ask: >
          Four cards. What is the floor on the worst-case number of
          comparisons?
        expects: "5"
        feedback: >
          $4! = 24$, and $2^{4} = 16 < 24 \le 32 = 2^{5}$, so
          $\lceil \log_{2} 24 \rceil = 5$. Five is achievable, so for four
          items the bound is exact.
      - ask: >
          The load-bearing step: why must two different input orders end at
          two different leaves?
        choices:
          - text: >
              Because each leaf is labelled with a different comparison.
            feedback: >
              Leaves are not comparisons; they are where the comparisons
              stop. What labels a leaf is the rearrangement the algorithm
              applies there.
          - text: >
              At a given leaf the algorithm has seen the same answers, so it
              applies the same rearrangement; two different orders cannot both
              come out sorted by it.
            correct: true
            feedback: >
              If $(3, 1, 2)$ and $(2, 3, 1)$ reached one leaf, a single
              rearrangement would have to sort both, and no single
              rearrangement does.
          - text: >
              Because comparisons are the expensive operation.
            feedback: >
              Cost is why we count comparisons, not why the leaves differ.
              The argument is about what the algorithm can tell apart.
        feedback: >
          A leaf is a verdict, and one verdict cannot be right for two
          different orders. Everything else in the proof is counting.
      - ask: >
          For $n = 1024$, $n \log_{2} n = 10240$. Using the two leading
          Stirling terms, about how many comparisons is the floor?
        expects: "8770"
        tolerance: 60
        hint: >
          $\log_{2} e \approx 1.443$.
        feedback: >
          $1024 \cdot 1.443 \approx 1477$, so $10240 - 1477 = 8763$; the exact
          $\log_{2}(1024!)$ is about $8769$. The floor is about $86\%$ of
          $n \log_{2} n$, and merge sort's worst case, about $9200$, sits
          close above it.

      - part: Where the floor gives way
        ask: >
          Insertion sort finishes an already sorted list of $1{,}000$ items
          in $999$ comparisons. Does that contradict the theorem?
        choices:
          - text: >
              Yes: $999$ is far below $\log_{2}(1000!)$.
            feedback: >
              The theorem bounds the *worst* input, not every input. A sorted
              list is insertion sort's best case.
          - text: >
              No: insertion sort does not compare items.
            feedback: >
              It compares each new item with its neighbours, so it is a
              comparison sort and the theorem applies to it.
          - text: >
              No: the bound is on the worst case, and some other input forces
              at least $\log_{2}(1000!)$ comparisons.
            correct: true
            feedback: >
              On a reversed list insertion sort makes about $500{,}000$. The
              tree is deep somewhere, not everywhere.
        feedback: >
          First hypothesis: worst case. A lucky input can be fast.
      - ask: >
          A risk system sorts $1{,}000{,}000$ order sizes, each a whole number
          of lots from $1$ to $100$, in about two million steps. Does that
          contradict the theorem?
        choices:
          - text: >
              No: it tallies how many orders have each size and reads the
              tallies back, never comparing two orders.
            correct: true
            feedback: >
              That is counting sort, $O(n + k)$ with $k = 100$. No comparison
              is made, so there is no decision tree to count.
          - text: >
              Yes: nothing sorts a million items faster than $n \log_{2} n$.
            feedback: >
              That forgets the hypothesis. The bound is on algorithms that
              learn about the keys *only* by comparing them.
          - text: >
              No, but only because the sizes repeat.
            feedback: >
              Repeats help less than you think; counting sort would be just as
              fast on a million keys drawn from $1$ to $100$ in any pattern.
              The escape is reading the key's value, not the repeats.
        feedback: >
          Second hypothesis: comparisons only. Bounded integer keys let you
          use the value as an address, and radix sort escapes the same way,
          digit by digit.
      - ask: >
          Which of these is bound by the $\Omega(n \log n)$ floor?
        choices:
          - text: >
              Radix sort on $64$-bit integers, one byte at a time
            feedback: >
              Radix sort buckets by byte value; it never asks whether one key
              is smaller than another, so the decision tree does not
              describe it.
          - text: >
              Heapsort on floating-point prices
            correct: true
            feedback: >
              Heapsort learns about prices only by comparing them, so its
              worst case must be at least $\log_{2}(n!)$, and its
              $O(n \log n)$ meets the floor.
          - text: >
              Counting sort on ages from $0$ to $120$
            feedback: >
              Counting sort indexes an array by the age itself; it compares
              nothing, so the bound does not apply.
        feedback: >
          The test is what the algorithm does with a key: compare it, or use
          it as a number.
      - teach: >
          Said aloud: "A comparison sort is a binary decision tree with at
          least $n!$ leaves, so its depth is at least $\log_{2}(n!)$, which is
          about $n \log_{2} n$. To beat it you must stop comparing, as counting
          and radix sort do when the keys are small integers."

  - node: quant-programming.algorithms.two-pointers
    hook: >
      Whenever you're about to nest two loops over sorted data, ask whether
      one of them can walk forward only and never back up — that single
      question is what turns $O(n^{2})$ into $O(n)$.
    explanation: >
      The converging variant puts one index at the front and one at the back
      and moves them toward each other, tracking a quantity — a sum, a
      product, a distance — that's monotone in each index separately. Each
      move then discards an entire block of candidate pairs at once, using
      exactly the same discard argument that makes binary search correct;
      the difference is that two pointers give up only one candidate block
      per step instead of halving the space, trading logarithmic for linear.

      The same-direction variant instead sends both pointers forward at
      independent speeds — merging two sorted lists, deduplicating in place,
      or partitioning around a pivot are all this shape, one pointer reading
      and the other writing.

      Before reaching for either variant, ask two questions: is the data
      actually ordered along the quantity being compared (if not, sorting
      first costs $O(n\log n)$ and may not be worth paying), and does moving
      a pointer provably rule out every pair or position it steps over. If
      the second answer is "maybe", the discard argument is broken and the
      sweep is no longer correct.
    worked: >
      Heights $1,8,6,2,5,4,8,3,7$ at indices $0$–$8$; maximize
      $(j-i)\cdot\min(h_i,h_j)$ over two indices. Start $i=0,j=8$:
      $\min(1,7)\cdot 8=8$. Since $h_i<h_j$, pairing index $0$ with anything
      further can never beat its own cap of $1$, so advance $i$. Now $i=1,
      j=8$: $\min(8,7)\cdot 7=49$, the best found so far. Since $h_j<h_i$ this
      time, advance $j$ instead: $i=1,j=7$ gives $\min(8,3)\cdot 6=18$,
      smaller. Continuing to convergence never beats it, so the answer is
      $49$.
    interview: >
      Beyond two-sum, expect "container with most water", "trapping rain
      water", or "valid palindrome ignoring punctuation" — the interviewer
      listens for you naming the monotone quantity and giving a one-line
      justification for why the pointer move discards candidates, not just
      producing working code.
    pitfalls: >
      Running the converging sweep on unsorted data breaks the discard
      argument silently — the code still terminates, it just may skip the
      real answer. Moving the wrong pointer (always advancing the same one
      regardless of the comparison) doesn't guarantee eliminating only
      non-optimal pairs. Treating the converging and same-direction variants
      as interchangeable ignores that they solve differently shaped problems.
    recap: >
      Two indices that only ever move forward, each move provably discarding
      a block of candidates, turn a sorted-data scan into $O(n)$ — the
      container-with-water example lands at $49$.
    dialogue:
      - part: Two positions under a limit
        teach: >
          A desk holds eight positions, sorted by size: $12, 19, 27, 33, 41,
          48, 57, 70$. A hedge must pair two of them, and their combined size
          may not exceed $80$. You want the largest combined size that stays
          within the limit.
      - ask: >
          Checking every pair of positions, how many sums do you compute?
        expects: "28"
        feedback: >
          $\binom{8}{2} = 28$. For $n$ positions it is $n(n-1)/2$, which is
          $O(n^{2})$.
      - ask: >
          Start with the smallest and the largest: $12 + 70 = 82$, over the
          limit. Which conclusion is safe?
        choices:
          - text: >
              Drop $12$: it was part of a pair that failed.
            feedback: >
              $12$ is the easiest position to pair; $12 + 57 = 69$ fits. The
              failure says nothing bad about $12$.
          - text: >
              Nothing yet: $70$ still has to be tried with the other six.
            feedback: >
              Every other partner of $70$ is at least $12$, so every such sum
              is at least $82$. Those six checks are already answered.
          - text: >
              Drop $70$: its smallest possible partner already overshoots, so
              every pair using it does.
            correct: true
            feedback: >
              One sum rules out all seven pairs that contain $70$.
        feedback: >
          On sorted data, one comparison settles a whole row of the pair
          table at once.
      - reflect: >
          Write a rule for what to do after each sum: one move when it is over
          $80$, one when it is not. For each move, say why every pair you skip
          could not have been the best.
        hint: >
          You just handled "over". When a sum fits, ask what the smaller
          position could still achieve with any partner further left.
        answer: >
          Keep $i$ at the small end and $j$ at the large end. Over the limit:
          drop $a_j$, since its smallest remaining partner already overshoots.
          Within the limit: record the sum, then drop $a_i$, since every
          remaining partner of $a_i$ is smaller than $a_j$ and gives a smaller
          sum. Either way one position leaves, and every pair it took with it
          was provably no better.

      - part: Two indices that never back up
        teach: >
          That is the two-pointer technique, converging form. The sum
          $a_i + a_j$ rises when $i$ moves right and falls when $j$ moves
          left, and that monotonicity in each index is what lets one
          comparison discard a whole block of pairs. It is the discard
          argument of binary search, spending one step per block instead of
          halving. Each step moves one pointer inward, so the pointers meet
          after $n - 1$ steps: $O(n)$ once the data is sorted.
      - ask: >
          Run it on the eight positions. What is the largest combined size
          within $80$?
        expects: "76"
        hint: >
          After dropping $70$, the next sum is $12 + 57$.
        feedback: >
          $12 + 70 = 82$, drop $70$. $12 + 57 = 69$, record, drop $12$.
          $19 + 57 = 76$, record, drop $19$. $27 + 57 = 84$, drop $57$.
          $27 + 48 = 75$, drop $27$. $33 + 48 = 81$, drop $48$. $33 + 41 = 74$,
          drop $33$. The pointers meet, and the best recorded is $76$.
      - ask: >
          How many sums did the sweep compute?
        expects: "7"
        feedback: >
          Seven, one per step, against $28$ for the brute force. For $n$
          positions it is $n - 1$ against $n(n-1)/2$.
      - ask: >
          At $19 + 57 = 76$ the sweep recorded $76$ and dropped $19$. Why can
          no better pair use $19$?
        choices:
          - text: >
              Partners right of $57$ were already ruled out, and partners left
              of $57$ give $19$ a smaller sum than $76$.
            correct: true
            feedback: >
              Both sides of the remaining partners are covered: $70$ left
              earlier because it overshoots with anything, and $19 + 48$,
              $19 + 41$ and the rest are all below $76$.
          - text: >
              Because $19$ is one of the smaller positions.
            feedback: >
              Small positions make good partners for large ones; $19$ is in
              the best pair. What retires it is that it has already met its
              best partner.
          - text: >
              Because $76$ is within $4$ of the limit, which is close enough.
            feedback: >
              Closeness is never the argument. The sweep would drop $19$ just
              the same if the sum were $50$, because nothing $19$ can still
              meet would do better.
        feedback: >
          Before trusting a pointer move, ask: does it provably rule out every
          pair it steps over? Here it does, in both directions.

      - part: When the sweep lies
        ask: >
          The same eight positions arrive unsorted: $41, 12, 70, 27, 57, 19,
          48, 33$. Someone runs the sweep on them as they are. What does it
          report?
        expects: "74"
        hint: >
          The first sum is $41 + 33$.
        feedback: >
          $41 + 33 = 74$, record, move $i$. $12 + 33 = 45$, record nothing
          better, move $i$. Then $70$ sits at $i$, and every sum with it is
          over, so $j$ walks down to meet it. The sweep reports $74$ and
          misses $19 + 57 = 76$.
      - ask: >
          Why did the sweep miss $76$?
        choices:
          - text: >
              The limit of $80$ is too tight for two pointers.
            feedback: >
              The limit was the same on the sorted list, where the sweep
              found $76$. The data changed, not the limit.
          - text: >
              Without sorting, dropping a position after one sum is no longer
              justified: its other partners are not all larger or all smaller.
            correct: true
            feedback: >
              The discard argument needs every partner of $a_i$ that is left
              to be at most $a_j$. On unsorted data that is false, and the
              sweep throws away pairs it never examined.
          - text: >
              It should have moved $j$ first instead of $i$.
            feedback: >
              The move rule is the same one that worked on sorted data. No
              rule is safe when the order does not track the sum.
        feedback: >
          The code still runs and still returns a number. Sort first, at
          $O(n \log n)$, and the sweep is correct again.
      - ask: >
          Which of these is a two-pointer job as stated?
        choices:
          - text: >
              Merging two sorted lists of fills into one sorted list
            correct: true
            feedback: >
              Same-direction pointers: one per list, each moving forward
              only, emitting the smaller head. Each pointer passes each entry
              once, so $O(n)$.
          - text: >
              Finding the most frequent price in an unsorted tape
            feedback: >
              No order to exploit; that is a hash map counting occurrences.
          - text: >
              Finding the two prices furthest apart in an unsorted tape
            feedback: >
              That is just the minimum and the maximum, one pass with no
              pointers at all.
        feedback: >
          The cue is ordered data and a pair or a position that can be ruled
          out for good. If either is missing, the pointers have nothing to
          stand on.

  - node: quant-programming.algorithms.pair-sum
    hook: >
      Two-sum is the hello-world of the two-pointer family, and whether the
      input is sorted decides whether you pay for a sort or reach for a hash
      set instead.
    explanation: >
      On sorted data, the converging scan is correct for the same reason any
      converging pair is: when $a_i+a_j<T$, index $i$ paired with anything at
      or below the current $a_j$ still falls short, so no surviving pair uses
      $i$ and advancing past it costs nothing; the symmetric argument handles
      $a_i+a_j>T$. That gives $O(n)$ time and $O(1)$ extra space once the data
      is already sorted.

      If the input isn't sorted, sorting first costs $\Theta(n\log n)$ and no
      comparison sort beats that — so the right move isn't to sort at all: a
      hash set of values seen so far, queried for $T-a_i$ on each new
      element, answers the same question in $O(n)$ expected time, trading
      $O(n)$ space for dropping the sort entirely.

      The choice between the two isn't about which is "better" in the
      abstract — it's about which cost you're already paying. Data that
      arrives sorted, or gets sorted for other reasons in the same problem,
      should use the pointer scan; data that's genuinely unordered, or needs
      to stay unordered, should use the hash set.
    worked: >
      Sorted array $-4,-1,0,3,7,9$, target $T=6$. Start $i=0,j=5$:
      $-4+9=5<6$, so advance $i$. Now $i=1,j=5$: $-1+9=8>6$, so retreat $j$.
      Now $i=1,j=4$: $-1+7=6=T$ — found. Three probes locate the pair
      $(-1,7)$.
    interview: >
      "Find two numbers summing to a target" is almost always followed by
      "what if the array isn't sorted" — the interviewer wants the immediate
      trade-off named: sort-then-scan pays $\Theta(n\log n)$ up front by the
      comparison-sort floor, or skip sorting entirely with a hash set at
      $O(n)$ expected time and $O(n)$ space.
    pitfalls: >
      Sorting data that's already sorted wastes an unnecessary
      $\Theta(n\log n)$ pass; running the pointer scan on data that isn't
      actually sorted is worse, since it can silently miss a valid pair
      instead of erroring. When counting all pairs rather than checking
      existence, duplicate values need explicit skip logic or the scan
      double-counts or stalls.
    recap: >
      Converging pointers settle sorted two-sum in one $O(n)$ pass with no
      extra memory; on unsorted input, a hash set beats paying for the sort.
    dialogue:
      - part: Exactly thirty-seven lots
        teach: >
          A client wants exactly $37$ lots, to be filled by combining two
          resting orders. The orders on the book, sorted by size, are
          $2, 5, 9, 14, 18, 23, 31, 40$. Do two of them sum to $37$?
      - ask: >
          Put $i$ on the $2$ and $j$ on the $40$. The sum is $42$. Which entry
          leaves?
        choices:
          - text: >
              The $2$, since the pair overshot.
            feedback: >
              Moving $i$ right only makes the sum larger. Overshooting calls
              for a smaller sum, which only moving $j$ gives.
          - text: >
              The $40$: even with the smallest partner it overshoots.
            correct: true
            feedback: >
              Every partner of $40$ is at least $2$, so every pair using $40$
              is at least $42$. It can be dropped for good.
          - text: >
              Both, to save a step.
            feedback: >
              The $2$ is still alive: $2 + 31 = 33$ has not been ruled out by
              anything. Drop only what the sum proves useless.
        feedback: >
          Over the target, drop the large end; under it, drop the small end.
      - ask: >
          Keep going until a sum equals $37$. How many sums do you compute in
          all, counting the $42$?
        expects: "6"
        hint: >
          The second sum is $2 + 31$.
        feedback: >
          $2 + 40 = 42$, drop $40$. $2 + 31 = 33$, drop $2$. $5 + 31 = 36$,
          drop $5$. $9 + 31 = 40$, drop $31$. $9 + 23 = 32$, drop $9$.
          $14 + 23 = 37$: found, after $6$ sums. All $28$ pairs would have
          been the brute force.
      - ask: >
          At $5 + 31 = 36$ the sweep dropped the $5$. What justifies that?
        choices:
          - text: >
              $36$ is one short, so the $5$'s partner must be just above $31$,
              which is $40$, already gone.
            feedback: >
              The conclusion is right but the reason is accidental. The
              argument has to cover every remaining partner of $5$, not just
              the one next door.
          - text: >
              Every partner the $5$ can still meet is at most $31$, so its
              sums are at most $36$, all short of $37$.
            correct: true
            feedback: >
              That covers all of them at once: no surviving pair uses the $5$,
              so dropping it costs nothing.
          - text: >
              The $5$ is too small to be in any pair summing to $37$.
            feedback: >
              $5 + 32$ would do, if $32$ were on the book. Size alone never
              rules an entry out; the remaining partners do.
        feedback: >
          That one sentence, and its mirror image for sums above the target,
          is the whole correctness proof: $O(n)$ time, $O(1)$ extra space.

      - part: The same book, unsorted
        ask: >
          The same eight orders arrive unsorted: $23, 9, 40, 2, 31, 14, 5,
          18$. If you sort them and then sweep, what does the whole job cost
          for $n$ orders?
        choices:
          - text: >
              $O(n)$: the sweep is linear.
            feedback: >
              The sweep is, but the sort comes first, and no comparison sort
              runs in less than $\Theta(n \log n)$ in the worst case.
          - text: >
              $O(n \log n)$: the sort dominates the linear sweep.
            correct: true
            feedback: >
              The sweep is cheap; the sort is the bill, and the comparison
              lower bound says it cannot be made cheaper.
          - text: >
              $O(n^{2})$: unsorted data forces the brute force.
            feedback: >
              Sorting is always available, at $O(n \log n)$, and the sweep
              then works.
        feedback: >
          The question becomes whether the sort can be skipped altogether.
      - reflect: >
          Can you skip the sort? Read the orders one at a time. When you meet
          a $23$, what exactly do you need to know about the orders already
          read, and how would you keep that cheap to ask?
        hint: >
          For a given order, only one partner size works.
        answer: >
          For an order of size $x$, the only partner that works is $37 - x$.
          So keep every size seen so far in a hash set and, for each new $x$,
          ask whether $37 - x$ is in it: $O(1)$ expected per lookup, $O(n)$
          for the scan. You pay $O(n)$ memory instead of the sort, and the
          data never needs ordering.
      - ask: >
          Run that scan on $23, 9, 40, 2, 31, 14, 5, 18$. At which position,
          counting the first order as $1$, does a lookup first succeed?
        expects: "6"
        hint: >
          At each order, look up $37$ minus its size among those already read.
        feedback: >
          $23$ wants $14$, absent. $9$ wants $28$, $40$ wants $-3$, $2$ wants
          $35$, $31$ wants $6$: all absent. At position $6$, $14$ wants $23$,
          which was the first order read. Found.

      - part: Which one, and the trap
        ask: >
          The orders arrive already sorted and the process has almost no
          spare memory. Which version?
        choices:
          - text: >
              The hash set: $O(n)$ expected time either way, and lookups are
              simpler.
            feedback: >
              It costs $O(n)$ memory you do not have, and it ignores the order
              you were handed for free.
          - text: >
              Converging pointers: $O(n)$ time and $O(1)$ extra space.
            correct: true
            feedback: >
              Sorted input is exactly when the sweep is free; it needs two
              indices and nothing else.
          - text: >
              Sort again to be safe, then sweep.
            feedback: >
              Re-sorting sorted data spends $\Theta(n \log n)$ to learn
              nothing.
        feedback: >
          Choose by which cost you are already paying: sorted data, sweep;
          unordered data, hash set.
      - ask: >
          A colleague's hash version inserts each $x$ into the set *before*
          looking up $T - x$. On the book $2, 5, 10, 13$ with $T = 20$, what
          does it report?
        choices:
          - text: >
              A pair, $10 + 10$, built from a single order used twice.
            correct: true
            feedback: >
              At $x = 10$ the set already holds the $10$ just inserted, so
              looking up $20 - 10 = 10$ succeeds. Look up first, then insert.
          - text: >
              No pair, correctly.
            feedback: >
              The correct answer is no pair: $2 + 13 = 15$, $5 + 13 = 18$,
              $10 + 13 = 23$. But this code finds the $10$ it just inserted
              when it looks up $10$.
          - text: >
              It misses a real pair that sums to $20$.
            feedback: >
              There is no real pair here. Inserting early never loses a pair;
              it invents one.
        feedback: >
          The order of two lines decides whether $x$ can partner itself. When
          the target is twice an entry, that line order is the bug.
      - teach: >
          Said aloud: "Sorted, converging pointers, $O(n)$ time and $O(1)$
          space, because a short sum rules out the small end and a long sum
          the large end. Unsorted, a hash set of seen values queried for
          $T - x$, $O(n)$ expected time and $O(n)$ space, rather than paying
          $\Theta(n \log n)$ to sort."

  - node: quant-programming.algorithms.sliding-window
    hook: >
      The nested loop looks like $O(n^{2})$ at a glance, and that's exactly
      the trap — the inner loop's total work across the whole run is bounded
      by $n$, not by $n$ per outer step.
    explanation: >
      Keep a window $[\ell,r]$ and an aggregate that updates in $O(1)$ as an
      element enters at $r$ or leaves at $\ell$. The variable-width recipe is
      one line: advance $r$ by one, then while the window violates the
      constraint, advance $\ell$. Nothing about that description bounds the
      inner while loop on its own — the bound comes from a different
      argument entirely.

      The argument is amortized, not local: $\ell$ only ever increases over
      the life of the algorithm, and it can increase at most $n$ times total
      across every iteration of the outer loop combined, exactly as $r$ can.
      Summing both pointers' total movement, not the worst case of any single
      step, is what makes the whole sweep $O(n)$ despite the apparent nesting.

      The method is only legal when the constraint stays monotone under
      shrinking — dropping an element from the left can only help satisfy it,
      never hurt. "Sum $\le S$" with nonnegative entries qualifies for exactly
      this reason. The instant entries can be negative, removing one from the
      left can make the sum worse instead of better, and the shrink loop's
      correctness collapses — that case needs prefix sums instead.
    worked: >
      Smallest contiguous window of $2,3,1,2,4,3$ summing to at least $7$:
      extend $r$ while accumulating the running sum, and each time it reaches
      or clears $7$, shrink from $\ell$ while it still does, recording the
      window length at every valid state. The sum first clears $7$ at $r=3$
      with the length-$4$ window $2,3,1,2$; continuing to extend and shrink
      finds a length-$3$ window at $1,2,4$ (sum $7$) and finally a length-$2$
      window $4,3$ (sum $7$) once $r=5$ — no shorter window exists, so the
      answer is $2$.
    interview: >
      "Smallest subarray with sum at least $S$", "longest substring without
      repeating characters", and "longest substring with at most $k$ distinct
      characters" are the standard three — the interviewer listens for the
      amortized argument stated explicitly (each index enters and leaves
      once) rather than the loop being waved off as obviously linear.
    pitfalls: >
      Applying sliding window when the constraint isn't monotone under
      shrinking — most commonly, negative entries in a sum — silently
      produces a wrong answer, since shrinking no longer guarantees restoring
      legality. Updating the aggregate incorrectly at the boundary (forgetting
      to remove a key from a frequency map once its count hits zero) corrupts
      every window that follows. Treating the inner while loop as its own
      $O(n)$ cost and multiplying it by the outer loop overstates the true
      complexity.
    recap: >
      Extend the right edge, then pull the left edge in while the window is
      illegal — each pointer moves at most $n$ times total, giving amortized
      $O(n)$, valid only when shrinking always restores legality.
    dialogue:
      - part: Ten hours under a rate limit
        teach: >
          A gateway logged its order messages, in hundreds, for ten
          consecutive hours: $4, 6, 2, 1, 3, 2, 1, 5, 8, 2$. Compliance asks
          for the longest stretch of consecutive hours whose total stays at
          or below $10$.
      - ask: >
          How many stretches of consecutive hours are there to check, from
          single hours up to all ten?
        expects: "55"
        hint: >
          A stretch is a choice of first hour and last hour, possibly the
          same.
        feedback: >
          $10 + 9 + \cdots + 1 = 55$, or $n(n+1)/2$ in general. Summing each
          from scratch makes the brute force $O(n^{3})$, and $O(n^{2})$ even
          with a running sum per starting hour.
      - ask: >
          Hours $2$ to $4$ total $6 + 2 + 1 = 9$; adding hour $5$ makes $12$.
          Do you still need to try stretches that start at hour $2$ and end
          later than hour $5$?
        choices:
          - text: >
              Yes: a later hour could be quiet enough to bring the total back
              down.
            feedback: >
              Message counts are never negative. Adding hours to a stretch
              can only raise its total, so every longer stretch from hour $2$
              is at least $12$.
          - text: >
              No: every one of them contains hours $2$ to $5$, which already
              total $12$, and adding hours never lowers a total.
            correct: true
            feedback: >
              The whole row of longer stretches from hour $2$ is settled by
              one sum.
          - text: >
              Only the ones ending at hour $6$; after that they are too long
              to matter.
            feedback: >
              Length is what you are maximising, so long stretches matter
              most. They are ruled out by their total, and all of them at
              once.
        feedback: >
          Once a stretch is over budget, extending it is hopeless. The only
          way back under is to drop hours from the front.
      - reflect: >
          Move a right edge forward one hour at a time, keeping a running
          total. When adding an hour pushes the total over $10$, what should
          the left edge do, and why will it never need to move back?
        hint: >
          Think about any stretch that starts left of the new left edge and
          ends at or after the current hour.
        answer: >
          Move the left edge forward, subtracting each dropped hour, until the
          total is back to $10$ or less. It never needs to move back: any
          stretch starting before the new left edge and ending at or after
          the current hour contains a stretch already shown to be over budget,
          and with nonnegative counts it is over budget too. So both edges
          only ever move forward.

      - part: Both edges move forward only
        teach: >
          That is a sliding window. Keep $[\ell, r]$ and its total, which
          updates in $O(1)$ as an hour enters at $r$ or leaves at $\ell$.
          Advance $r$ by one; while the total exceeds the budget, advance
          $\ell$; then record $r - \ell + 1$. Legal because the constraint
          survives shrinking: dropping an hour can only help "total
          $\le 10$". A fixed-width window is the special case where both
          edges step together.
      - ask: >
          Run it on the ten hours. What is the longest stretch within the
          budget?
        expects: "5"
        hint: >
          The window first holds five hours once $r$ reaches hour $7$.
        feedback: >
          Hours $1$ and $2$ total $10$. Hour $3$ forces out hour $1$ ($8$),
          hour $5$ forces out hour $2$ ($6$), and hours $6$ and $7$ fit,
          giving hours $3$ to $7$: $2 + 1 + 3 + 2 + 1 = 9$, length $5$. Hour
          $8$ pushes out three hours, and hour $9$'s $8$ empties the window
          down to itself. Nothing beats $5$.
      - ask: >
          Over the whole run, how many times does the left edge move?
        expects: "8"
        feedback: >
          Once each for hour $3$ and hour $5$, three times for hour $8$, and
          three for hour $9$: $1 + 1 + 3 + 3 = 8$. The right edge moved $10$
          times. Eighteen edge moves for ten hours.
      - ask: >
          The inner loop can run up to $n$ times for a single step of $r$.
          So is the sliding window $O(n^{2})$?
        choices:
          - text: >
              Yes, in the worst case: $n$ outer steps times up to $n$ inner
              steps.
            feedback: >
              That bound is true and far too loose. A step of $r$ that moves
              $\ell$ many times leaves fewer moves for every later step,
              because $\ell$ never comes back.
          - text: >
              It depends on the data: $O(n)$ on quiet logs, $O(n^{2})$ on
              busy ones.
            feedback: >
              No data can make $\ell$ move more than $n$ times in total. Busy
              logs just bunch the moves together.
          - text: >
              No: $\ell$ only increases and never passes $n$, so across the
              whole run it moves at most $n$ times, as $r$ does.
            correct: true
            feedback: >
              Each hour enters once and leaves at most once: at most $2n$
              edge moves, each $O(1)$. An amortized bound, not a bound on any
              single step.
        feedback: >
          Say the amortized argument out loud in an interview: each index
          enters once and leaves once. Waving the nested loop off as
          "obviously linear" is what the interviewer is listening for you not
          to do.

      - part: When shrinking stops helping
        teach: >
          Now a strategy's hourly P&L, which can be negative: $5, 6, -8, 4$.
          The question is the same: the longest stretch whose total is at most
          $7$.
      - ask: >
          Run the sliding window exactly as before. What length does it
          report?
        expects: "3"
        feedback: >
          $5$ fits. Adding $6$ makes $11$, so the $5$ is pushed out, leaving
          $6$. Adding $-8$ gives $-2$, length $2$; adding $4$ gives $2$, length
          $3$. It reports $3$.
      - ask: >
          The whole array totals $5 + 6 - 8 + 4 = 7$, so the true answer is
          $4$. Why did the window miss it?
        choices:
          - text: >
              The loop has an off-by-one in how it records lengths.
            feedback: >
              The bookkeeping is the same as on the message log, where it was
              right. The rule itself failed here.
          - text: >
              Dropping the $5$ was a mistake: with a $-8$ still to come, a
              stretch that is over budget now can come back under later.
            correct: true
            feedback: >
              The step "over budget, so extending is hopeless" needed
              nonnegative entries. Here hours $1$ and $2$ total $11$, and
              adding hours brings the total down to $7$.
          - text: >
              Negative totals confuse the comparison with $7$.
            feedback: >
              $-2 \le 7$ is compared correctly. The comparison is fine; the
              decision to discard the $5$ for good is not.
        feedback: >
          The window is legal only when the constraint is monotone under
          shrinking and extending. Mixed signs break it, and the problem
          needs a different tool, prefix sums, rather than a patch to the
          window.

  - node: quant-programming.algorithms.prefix-sums
    hook: >
      "Answer $q$ range-sum queries fast" is the tell — one $O(n)$ pass buys
      every range sum afterward in $O(1)$, and the same trick extended with a
      hash map counts target-sum subarrays in a single sweep.
    explanation: >
      Precompute $P_0=0$ and $P_k=a_1+\dots+a_k$ once, in $O(n)$; any range
      sum is then $P_r-P_{\ell-1}$, a subtraction instead of a scan. The trade
      is $O(n)$ extra space to turn $q$ queries from $O(qn)$ total into
      $O(n+q)$.

      The counting variant is the sharpest use of the idea: since
      $P_r-P_{\ell-1}=T$ rearranges to $P_{\ell-1}=P_r-T$, counting subarrays
      summing to $T$ becomes, at each $r$, a lookup of how many earlier
      prefixes equal $P_r-T$ — a hash map of prefix values seen so far turns
      an $O(n^{2})$ double loop over all subarrays into one $O(n)$ pass.

      Two more variants are worth carrying: a difference array absorbs $q$
      range updates at $O(1)$ each, rebuilding the true array in one final
      $O(n)$ pass, and a two-dimensional prefix table answers rectangle sums
      by inclusion–exclusion over four corners. Watch magnitude regardless of
      variant — prefixes grow like $n\cdot\max_i|a_i|$ even when every
      individual entry is small, which is an easy silent overflow.
    worked: >
      Count subarrays of $1,2,3,-2,5$ summing to $T=5$. Prefixes: $P_0=0$,
      $P_1=1$, $P_2=3$, $P_3=6$, $P_4=4$, $P_5=9$. Seed a map with $\{0:1\}$.
      At $P_1=1$: look up $1-5=-4$, absent; store $1$. At $P_2=3$: look up
      $-2$, absent; store $3$. At $P_3=6$: look up $1$, present once — count
      becomes $1$ (this is the subarray $2,3$); store $6$. At $P_4=4$: look up
      $-1$, absent; store $4$. At $P_5=9$: look up $4$, present once — count
      becomes $2$ (this is the subarray $5$ alone); store $9$. The answer is
      $2$.
    interview: >
      "Range sum queries" and "subarray sum equals $k$" are the two canonical
      phrasings — the interviewer listens for $P_r-P_{\ell-1}$ recognized as
      a direct lookup rather than a re-scan, and for the hash-map variant
      offered unprompted once "count" or "how many" appears in the ask.
    pitfalls: >
      Forgetting to seed the hash map with $P_0=0$ before scanning silently
      undercounts every subarray that starts at index $0$. Confusing which
      prefix bounds a range — it's $P_r-P_{\ell-1}$, not $P_r-P_{\ell}$ — shifts
      every range by one element. Ignoring magnitude growth invites overflow
      well before any individual array entry looks dangerous.
    recap: >
      One cumulative pass buys $O(1)$ range sums forever, and paired with a
      hash map of seen prefixes it counts target-sum subarrays like
      $1,2,3,-2,5$ (target $5$) in one linear sweep — here, $2$ of them.
    dialogue:
      - part: Range totals on demand
        teach: >
          A book's daily P&L, in thousands, over eight days: $3, -1, 4, 2, -5,
          6, 1, -2$, for days $1$ through $8$. A risk dashboard will ask for
          the total over a range of days, many times a second.
      - ask: >
          What is the total from day $3$ to day $6$?
        expects: "7"
        feedback: >
          $4 + 2 - 5 + 6 = 7$, four additions.
      - ask: >
          The next request is day $2$ to day $7$. Adding it up from scratch, how
          much of the work repeats additions you made for the last
          request?
        choices:
          - text: >
              None: it is a different range.
            feedback: >
              Days $3$ to $6$ sit inside days $2$ to $7$, so the $4 + 2 - 5 +
              6$ is summed again.
          - text: >
              Most of it: days $3$ to $6$ are summed again, and over thousands
              of overlapping requests the same days are summed thousands of
              times.
            correct: true
            feedback: >
              With $q$ requests over a history of $n$ days, adding from
              scratch costs up to $O(qn)$, almost all of it repeated.
          - text: >
              All of it, so you could just cache the last answer.
            feedback: >
              Caching one answer only helps if the identical request comes
              again. Ranges overlap far more often than they repeat.
        feedback: >
          The waste is summing the same days again and again. The fix has to
          reuse sums across different ranges, not just identical ones.
      - reflect: >
          Compute one list of numbers, once, so that every range total becomes
          a single subtraction. What list, and why does subtracting work?
        hint: >
          The total of days $3$ to $6$ is everything up to day $6$, minus
          something.
        answer: >
          The running totals: $P_k$ is the sum of days $1$ through $k$, with
          $P_0 = 0$. Everything up to a range's last day, minus everything
          before its first day, leaves exactly the range, because the shared
          part cancels. One pass of $n$ additions builds the list, and then
          each request costs one subtraction.

      - part: One pass, then subtraction
        teach: >
          These are prefix sums: $P_0 = 0$ and $P_k = a_1 + \cdots + a_k$,
          built in $O(n)$. Every range total is
          $\sum_{i=\ell}^{r} a_i = P_r - P_{\ell-1}$, in $O(1)$. The trade is
          $O(n)$ memory to turn $q$ requests from $O(qn)$ into $O(n + q)$.
      - ask: >
          Build the prefix sums for the eight days. What is $P_6$?
        expects: "9"
        hint: >
          Keep a running total: $3$, then $3 - 1 = 2$, then $6$, and so on.
        feedback: >
          $P_0$ to $P_8$ are $0, 3, 2, 6, 8, 3, 9, 10, 8$, so $P_6 = 9$.
      - ask: >
          Which subtraction gives the total from day $3$ to day $6$?
        choices:
          - text: >
              $P_6 - P_3$
            feedback: >
              $P_3$ includes day $3$, so subtracting it removes day $3$ from
              the range: $9 - 6 = 3$, which is days $4$ to $6$ only.
          - text: >
              $P_5 - P_2$
            feedback: >
              $P_5$ stops before day $6$: $3 - 2 = 1$ is days $3$ to $5$.
          - text: >
              $P_6 - P_2$
            correct: true
            feedback: >
              $9 - 2 = 7$, matching the four additions you did by hand.
        feedback: >
          The lower index is $\ell - 1$: subtract everything *before* the
          range starts. This off-by-one is the most common bug with prefix
          sums.
      - ask: >
          Using the prefix sums, what is the total from day $2$ to day $7$?
        expects: "7"
        feedback: >
          $P_7 - P_1 = 10 - 3 = 7$. One subtraction, where adding from
          scratch took six terms.

      - part: Counting stretches that hit a target
        ask: >
          New question: how many stretches of consecutive days total exactly
          $3$? A stretch from day $\ell$ to day $r$ totals $3$ exactly when
          which holds?
        choices:
          - text: >
              $P_r - P_{\ell - 1} = 3$, so some earlier prefix equals
              $P_r - 3$.
            correct: true
            feedback: >
              For each end day $r$, the question becomes a lookup: how many
              earlier prefixes equal $P_r - 3$?
          - text: >
              $P_r = 3$
            feedback: >
              That only catches stretches that start on day $1$. A stretch
              starting later needs the prefix before it subtracted.
          - text: >
              $a_r = 3$
            feedback: >
              That catches single days only. Day $2$ to day $3$, $-1 + 4$,
              also totals $3$.
        feedback: >
          Rearranged, the condition is a membership question. Keep a hash map
          from prefix value to how many times it has appeared, seeded with
          $P_0 = 0$ once, and scan $r$ from $1$ to $n$: add the count stored
          for $P_r - 3$, then record $P_r$. One pass, $O(n)$, instead of
          checking all $n(n+1)/2$ stretches.
      - ask: >
          Run that scan. How many stretches total exactly $3$?
        expects: "4"
        hint: >
          The prefixes, in order, are $3, 2, 6, 8, 3, 9, 10, 8$. For each,
          look up $P_r - 3$ among the prefixes before it, including $P_0$.
        feedback: >
          $P_1 = 3$ finds $0$ once: day $1$. $P_3 = 6$ finds $3$ once: days
          $2$ to $3$. $P_5 = 3$ finds $0$ once: days $1$ to $5$. $P_6 = 9$
          finds $6$ once: days $4$ to $6$. Every other lookup misses. Total
          $4$.
      - ask: >
          A colleague's version forgets to seed the map with $P_0 = 0$. What
          count does it report?
        expects: "2"
        feedback: >
          Both lookups that found $0$ are lost: day $1$ alone and days $1$ to
          $5$, the two stretches that start on day $1$. The seed stands for
          the empty prefix before day $1$, and without it every stretch from
          the very start goes uncounted.
      - teach: >
          Said aloud: "Range sums are differences of prefixes,
          $P_r - P_{\ell - 1}$. To count stretches with total $T$, I scan once
          with a hash map of prefix counts seeded with zero, looking up
          $P_r - T$." Mind the magnitude, too: prefixes grow like
          $n \max_i \lvert a_i \rvert$, and on a long history they overflow a
          32-bit integer long before any single entry looks large.

  - node: quant-programming.algorithms.dp
    hook: >
      "Can you do better than exponential" is almost always fished for one
      answer — and the four-step drill that gets you there is the same drill
      every single time, regardless of what the problem is about.
    explanation: >
      Dynamic programming applies exactly when two properties hold together:
      optimal substructure, so the answer assembles from answers to smaller
      instances, and overlapping subproblems, so naive recursion revisits the
      same instance many times. Optimal substructure alone, without
      overlap, is divide and conquer instead — no cache is needed because
      nothing repeats.

      The drill never changes: name the state precisely, write the transition
      as a recurrence in terms of smaller states, fix the base cases, then
      fill the table — top-down with memoization, mirroring the brute-force
      recursion directly with a cache added, or bottom-up with tabulation,
      filling in an order where every dependency is already resolved. The
      cost is (number of states) $\times$ (work per transition), and that
      product is the complexity an interviewer is actually listening for.

      A DP whose state is a single integer index with a fixed-width window of
      dependencies, and whose transition coefficients are constants, is
      literally a linear recurrence — the characteristic-root machinery
      applies directly. Most interview DPs go beyond that (a min or max
      instead of a fixed linear combination, or more than one dimension of
      state), which is exactly why table-filling, not a closed form, is the
      general tool.
    worked: >
      Ways to climb $6$ stairs taking $1$ or $2$ steps at a time. State:
      $f(n)$, the number of ways to reach step $n$. Transition: the last step
      taken was either a single step from $n-1$ or a double from $n-2$, so
      $f(n)=f(n-1)+f(n-2)$ — a linear recurrence, now filled as a table.
      Base cases $f(0)=1$, $f(1)=1$. Tabulating: $f(2)=2$, $f(3)=3$, $f(4)=5$,
      $f(5)=8$, $f(6)=13$ — six states, $O(1)$ work each, so $13$ ways in
      $O(n)$ time and, with a rolling pair of variables, $O(1)$ space.
    interview: >
      Any "how many ways" or "what's the minimum/maximum" question with an
      obvious recursive structure is DP — the interviewer listens for the
      four steps named out loud, in order, before any code, and for the
      complexity stated as states times transition rather than guessed.
    pitfalls: >
      Writing code before naming the state precisely usually produces a
      recurrence that double-counts or silently drops cases. Memoizing on an
      incomplete key — missing a dimension of the true state — collides
      distinct subproblems in the cache and returns a stale wrong value.
      Filling a bottom-up table in an order where a dependency isn't computed
      yet reads garbage instead of the intended subresult.
    recap: >
      Name a state, write its recurrence, cache the results — cost is states
      times transition, and memoization and tabulation are the same table
      read in opposite directions.
    dialogue:
      - part: Seven days, never two in a row
        teach: >
          A strategy may run on any of the next seven days, but compliance
          forbids running it on two consecutive days. Its expected profit by
          day, in thousands, is $6, 7, 6, 2, 9, 10, 4$. You want the schedule
          with the largest total.
      - ask: >
          Try greedy: take the most profitable remaining day, strike out its
          neighbours, repeat. What total does that give?
        expects: "19"
        hint: >
          The first pick is day $6$, worth $10$.
        feedback: >
          Day $6$ ($10$) strikes days $5$ and $7$. Day $2$ ($7$) strikes days
          $1$ and $3$. Day $4$ ($2$) is all that is left. $10 + 7 + 2 = 19$.
      - ask: >
          Days $1, 3, 5, 7$ give $6 + 6 + 9 + 4 = 25$. To be sure of the best,
          you could list every allowed schedule, the empty one included. How
          many are there for seven days?
        expects: "34"
        hint: >
          Count the schedules for $1, 2, 3, \dots$ days and look for the
          pattern: a schedule either uses the last day or does not.
        feedback: >
          With $s_n$ schedules on $n$ days, $s_n = s_{n-1} + s_{n-2}$, since
          one either skips day $n$ or uses it and skips day $n-1$. From
          $s_1 = 2$ and $s_2 = 3$: $5, 8, 13, 21, 34$. A linear recurrence
          with root $(1 + \sqrt{5})/2 \approx 1.618$, so listing grows
          exponentially; at $60$ days it is past $10^{12}$.
      - ask: >
          Suppose the best seven-day schedule rests on day $7$. What must its
          first six days be?
        choices:
          - text: >
              Any allowed schedule of days $1$ to $6$.
            feedback: >
              If its first six days were not the best six-day schedule, you
              could swap in the best one and do better, still resting on day
              $7$.
          - text: >
              The best schedule for days $1$ to $6$.
            correct: true
            feedback: >
              Resting on day $7$ leaves days $1$ to $6$ unconstrained by day
              $7$, so the best seven-day answer contains the best six-day one.
          - text: >
              The best schedule for days $1$ to $5$, to stay safe.
            feedback: >
              Resting on day $7$ means day $6$ is free to use. Leaving it out
              is only needed when day $7$ is worked.
        feedback: >
          The best answer is assembled from best answers to smaller versions
          of the same question: optimal substructure.
      - reflect: >
          Let $B(k)$ be the best total using only days $1$ to $k$. Write
          $B(k)$ in terms of smaller values. Then say why a plain recursive
          implementation of your formula would be slow, and what one change
          fixes it.
        hint: >
          Day $k$ is either rested or worked. Then expand $B(7)$ two levels
          and look for repeats.
        answer: >
          $B(k) = \max(B(k-1),\; B(k-2) + p_k)$: rest on day $k$, or work it
          and leave day $k-1$ empty. Plain recursion computes $B(7)$ from
          $B(6)$ and $B(5)$, but $B(6)$ computes $B(5)$ again, and the repeats
          multiply like the schedule count: exponentially many calls for only
          $k$ distinct questions. Store each $B(k)$ the first time it is
          computed, and every later request is a lookup.

      - part: Name it, store it, fill it
        teach: >
          That is dynamic programming: optimal substructure plus overlapping
          subproblems. The drill is always four steps. Name the state, here
          $B(k)$. Write the transition, $B(k) = \max(B(k-1), B(k-2) + p_k)$.
          Fix the base cases, $B(0) = 0$ and $B(1) = p_1$. Fill in an order
          where every dependency is ready, either memoizing the recursion
          top-down or tabulating $k = 2, 3, \dots$ bottom-up. Cost: states
          times work per transition.
      - ask: >
          Fill the table for the seven days. What is $B(7)$?
        expects: "25"
        hint: >
          $B(1) = 6$, $B(2) = \max(6, 7) = 7$.
        feedback: >
          $B(3) = \max(7, 6 + 6) = 12$, $B(4) = \max(12, 7 + 2) = 12$,
          $B(5) = \max(12, 12 + 9) = 21$, $B(6) = \max(21, 12 + 10) = 22$,
          $B(7) = \max(22, 21 + 4) = 25$. Seven states, $O(1)$ each, against
          $34$ schedules for the brute force.
      - ask: >
          Filling bottom-up, how many earlier table entries must you keep in
          memory at any moment?
        expects: "2"
        feedback: >
          $B(k)$ reads only $B(k-1)$ and $B(k-2)$, so two rolling variables
          replace the table: $O(n)$ time, $O(1)$ space. That rolling array is
          the usual reason to prefer tabulation once the recurrence is known.
      - ask: >
          Which of these gains anything from caching subproblem answers?
        choices:
          - text: >
              Merge sort on a list of trades
            feedback: >
              Merge sort splits into halves that never repeat: each sublist
              is sorted exactly once. Optimal substructure without overlap is
              divide and conquer, and a cache would never be hit.
          - text: >
              Binary search on sorted prices
            feedback: >
              Each probe discards half the window for good, so no question is
              ever asked twice.
          - text: >
              Counting ordered ways to reach $40$ points with plays worth $2$
              and $3$
            correct: true
            feedback: >
              $w(n) = w(n-2) + w(n-3)$, and plain recursion asks for the same
              $w(m)$ over and over. Overlap is what a cache exploits.
        feedback: >
          Two properties together license DP: answers assemble from smaller
          answers, and the smaller questions repeat. Without the repeats,
          recursion is already efficient.

      - part: When the state is too small
        ask: >
          The rule changes: the strategy may run two days in a row, but never
          three. A colleague keeps the state $B(k)$ and tries to write a
          transition. What goes wrong?
        choices:
          - text: >
              Nothing; the same transition works with $B(k-3)$ added.
            feedback: >
              Working day $k$ is now allowed after a worked day $k-1$, but
              only if day $k-2$ was rested. $B(k-1)$ does not record whether
              its last two days were both worked, so the transition cannot
              tell.
          - text: >
              $B(k)$ forgets how many days in a row the best schedule has
              just worked, and that decides whether day $k+1$ is allowed.
            correct: true
            feedback: >
              The state must carry it: $B(k, j)$ with $j \in \{0, 1, 2\}$ the
              length of the run ending at day $k$. Three times the states, still
              $O(n)$.
          - text: >
              The problem stops having optimal substructure, so DP fails.
            feedback: >
              It still has it, once the state says enough. The fix is a
              bigger state, not a different method.
        feedback: >
          A state must hold everything the future depends on. Memoizing on a
          key that is missing a dimension merges different subproblems in the
          cache and returns a stale answer with no error.
      - ask: >
          With the state $B(k, j)$, $j \in \{0, 1, 2\}$, over $1{,}000$ days
          and $O(1)$ work per transition, how many states does the table
          hold?
        expects: "3000"
        feedback: >
          $1{,}000 \times 3 = 3{,}000$ states at $O(1)$ each. States times
          transition is the estimate to say aloud: here $O(n)$ for $n$ days.
      - teach: >
          Said aloud: "State $B(k)$, the best total over the first $k$ days.
          Transition: rest on day $k$ or work it and skip day $k-1$. Base
          cases $B(0) = 0$, $B(1) = p_1$. Fill left to right, $O(n)$ time, two
          rolling variables for $O(1)$ space." Naming the four steps in order
          is the answer the interviewer is fishing for.

  - node: quant-programming.algorithms.kadane
    hook: >
      Restated as "best contiguous run of daily P&L", this is the single-pass
      trick behind every "best window" question that doesn't need a second
      pointer at all.
    explanation: >
      The state is deliberately "best sum of a subarray ending exactly at
      $k$", not "best sum found so far" — that precision is what keeps the
      recursion honest about contiguity. $b_k=\max(a_k, b_{k-1}+a_k)$ says:
      either this element starts a fresh run, or it extends the run that was
      already winning, and starting fresh is correct exactly when the running
      best has gone negative, since anything negative dragged forward can
      only hurt.

      The prefix-sum reading is the same fact from a different angle: the
      best subarray ending at $r$ is $P_r-\min_{\ell<r}P_\ell$, so one running
      minimum of prefixes recovers the identical answer — extending the
      running best is the same move as tracking the lowest prefix seen.

      Because the recursion never resets to zero, only to $a_k$ itself, it
      handles an all-negative array correctly on its own: the answer becomes
      the single least-negative entry, not an empty subarray reported as
      sum $0$ — a case worth checking explicitly, since it's the first thing
      a rushed implementation gets wrong.
    worked: >
      Array $3,-1,-1,6,-2,4,-9,2$. Tracking $b_k$: $3,2,1,7,5,9,0,2$ — every
      value through index $6$ chains onto the previous best, since none of
      the dips are deep enough to justify restarting. The maximum is
      $b_6=9$, from the subarray $3,-1,-1,6,-2,4$; the $-9$ at index $7$
      finally forces a reset ($b_7=\max(-9,9-9)=0$), but by then the answer
      is already locked in. So the answer is $9$.
    interview: >
      "Maximum subarray sum" and its cousin "best single buy-sell window" get
      asked almost verbatim — the interviewer listens for the one-line
      recurrence stated cold and for the reset condition given correctly:
      reset when the running best goes negative, not when the current
      element does.
    pitfalls: >
      Resetting whenever $a_k$ itself is negative, instead of when $b_{k-1}$
      is negative, is a different and wrong rule. Returning $0$ for an
      all-negative array ignores the "nonempty subarray" requirement — the
      correct answer is the largest single element. Confusing this with
      maximum non-contiguous subsequence, which is a different and, for
      arbitrary sign patterns, much easier problem.
    recap: >
      Best-ending-here in one line, $b_k=\max(a_k,b_{k-1}+a_k)$, gives the
      maximum subarray sum in a single $O(n)$ pass — $9$ on
      $3,-1,-1,6,-2,4,-9,2$.
    dialogue:
      - part: Ten days of P&L
        teach: >
          A strategy's daily P&L over ten days, in thousands: $2, -4, 3, 5,
          -6, 4, 1, -2, 4, -7$, for days $1$ through $10$. The question is the
          best run of consecutive days: the largest total over any nonempty
          block of days.
      - ask: >
          Days $3$ and $4$ give $3 + 5 = 8$. Can a run that includes the $-6$
          on day $5$ beat that?
        choices:
          - text: >
              No: adding a loss can only lower a total.
            feedback: >
              Adding the $-6$ lowers the total *at that moment*, but the run
              can keep going. Days $3$ to $9$ give
              $3 + 5 - 6 + 4 + 1 - 2 + 4 = 9$.
          - text: >
              Yes, if the days after the $-6$ add back more than $6$.
            correct: true
            feedback: >
              Days $6$ to $9$ add $4 + 1 - 2 + 4 = 7$, more than the $6$ lost,
              so days $3$ to $9$ total $9$.
          - text: >
              Only if the run starts on day $1$.
            feedback: >
              Starting on day $1$ drags in $2 - 4 = -2$, which only hurts.
              What matters is what comes after the dip, not where the run
              starts.
        feedback: >
          A dip is worth crossing when what lies beyond it pays for it. Eyeing
          the array cannot settle that; a rule can.
      - reflect: >
          Stop judging whole runs. For each day $k$, ask only: what is the
          best run that *ends exactly on day $k$*? If you know that number for
          day $k - 1$, how do you get it for day $k$, and where is the overall
          answer?
        hint: >
          A run ending on day $k$ is either day $k$ alone or a run ending on
          day $k-1$ with day $k$ added.
        answer: >
          Call it $b_k$. The best run ending on day $k$ either starts fresh,
          giving $a_k$, or extends the best run ending on day $k-1$, giving
          $b_{k-1} + a_k$; so $b_k = \max(a_k, b_{k-1} + a_k)$. Every block
          ends on some day, so the best block overall is the largest $b_k$.
          Nothing about whole runs ever has to be compared directly.

      - part: Best run ending here
        teach: >
          That is Kadane's algorithm, dynamic programming with state $b_k$,
          the best sum of a block ending exactly at day $k$. Transition
          $b_k = \max(a_k, b_{k-1} + a_k)$, base case $b_1 = a_1$, answer
          $\max_k b_k$. One pass, $O(n)$ time, $O(1)$ memory: only $b_{k-1}$
          and the best so far are kept. The state says "ending here", not
          "best so far", and that is what keeps every run contiguous.
      - ask: >
          $b_4 = 8$. What is $b_5$, the best run ending on day $5$?
        expects: "2"
        feedback: >
          $b_5 = \max(-6, 8 - 6) = 2$. The run through the $-6$ still beats
          starting fresh on a loss, so it survives, with $2$ in hand.
      - ask: >
          Finish the pass. What is the best run's total?
        expects: "9"
        hint: >
          Keep going: $b_6 = \max(4, 2 + 4)$, and so on to day $10$.
        feedback: >
          The $b$ values for days $1$ to $10$ are $2, -2, 3, 8, 2, 6, 7, 5, 9,
          2$. The fresh start happens at day $3$, after $b_2 = -2$. The
          largest is $b_9 = 9$, the block from day $3$ to day $9$.
      - ask: >
          When is starting fresh on day $k$ the right move?
        choices:
          - text: >
              When day $k$ itself is a loss, $a_k < 0$.
            feedback: >
              Day $5$ is a $-6$, and starting fresh there gives $b_5 = -6$
              instead of $2$ and loses the best run. A loss on day $k$ is a
              reason not to *start* on day $k$, if anything.
          - text: >
              When the best run ending yesterday is negative, $b_{k-1} < 0$.
            correct: true
            feedback: >
              $b_{k-1} + a_k < a_k$ exactly when $b_{k-1} < 0$. That happened
              once here: $b_2 = -2$, so day $3$ starts fresh.
          - text: >
              When the best total found so far stops improving.
            feedback: >
              The best so far stalled at $8$ from day $4$ to day $8$, yet the
              winning run kept extending through those days and reached $9$
              on day $9$.
        feedback: >
          Reset on a negative history, never on a negative day. Interviewers
          listen for exactly that distinction.

      - part: Two checks on the same idea
        ask: >
          The prefix-sum reading: the best run ending on day $9$ is $P_9$
          minus the smallest earlier prefix. The prefixes $P_0$ to $P_9$ are
          $0, 2, -2, 1, 6, 0, 4, 5, 3, 7$. What is the smallest of
          $P_0, \dots, P_8$?
        expects: "-2"
        feedback: >
          $P_2 = -2$, so the best run ending on day $9$ is
          $P_9 - P_2 = 7 - (-2) = 9$, days $3$ to $9$ again. Tracking the
          running minimum prefix and tracking $b_k$ are the same move.
      - ask: >
          Every day of a bad week loses money: $-5, -2, -8, -3$. What does
          Kadane's recurrence return?
        expects: "-2"
        feedback: >
          The $b$ values are $-5, -2, -8, -3$; every history is negative, so
          each day starts fresh. The best is $-2$, the single least bad day.
          The recurrence resets to $a_k$, never to $0$, so it never invents
          an empty run.
      - ask: >
          A colleague's version starts the best at $0$ and resets the running
          sum to $0$ whenever it goes negative. What does it return on that
          week?
        choices:
          - text: >
              $-2$, the same answer.
            feedback: >
              Its running sum is reset to $0$ after every day, and its best
              starts at $0$, so no negative total can ever replace it.
          - text: >
              $-18$, the whole week.
            feedback: >
              That would be summing everything. This version never keeps a
              negative running sum long enough to add it up.
          - text: >
              $0$: it reports an empty run that the problem does not allow.
            correct: true
            feedback: >
              On a week with any positive day the two versions agree. On an
              all-loss week the zero version answers a different question,
              "best run, or nothing", and the problem asked for a nonempty
              block.
        feedback: >
          Check the all-negative case explicitly; it is the first thing a
          rushed implementation gets wrong. Said aloud: "Best ending here is
          the larger of today alone and yesterday's best plus today; the
          answer is the max over days; $O(n)$ time, $O(1)$ space."

  - node: quant-programming.algorithms.coin-change
    hook: >
      This is the problem interviewers use to catch a candidate who reaches
      for greedy on reflex — "largest coin first" only works for specific
      denomination sets, and this one is chosen so it doesn't.
    explanation: >
      The recurrence $f(t)=1+\min\{f(t-c_j)\mid c_j\le t\}$ with $f(0)=0$ and
      unreachable amounts pinned at infinity fills in $O(mT)$ time and
      $O(T)$ space — every amount up to $T$ gets computed once, from smaller
      amounts already known.

      Greedy fails here for a structural reason, not bad luck: it commits to
      the largest coin without ever checking whether that commitment forces a
      worse total later. It's correct only for "canonical" denomination
      systems (most real currencies included) where every denomination is
      built to make greedy safe — general denominations, exactly what this
      problem hands you, offer no such guarantee.

      Counting the number of ways to make $T$, instead of the fewest coins,
      reuses the same table but flips the loop nesting: coins on the outside,
      amounts on the inside. Nesting them the other way around treats $1+3$
      and $3+1$ as different combinations and double-counts every ordering
      of the same multiset.
    worked: >
      Coins $1,4,5$, target $T=8$. Table $f(0..8) = 0,1,2,3,1,1,2,3,2$ —
      $f(8)=2$ dominates because $f(4)=1$ already found the single coin $4$,
      and reusing it once more reaches $8$ in two coins total ($4+4$). Greedy
      instead grabs the largest coin first: $5$, leaving $3$, which forces
      three more $1$-coins for a total of $4$ — worse than the DP's $2$. So
      the answer is $2$ coins.
    interview: >
      "Fewest coins to make change" is usually followed immediately by "does
      greedy work here" — the expected answer is no in general, with this
      exact kind of counterexample ready, plus a note that greedy is fine only
      for the canonical denomination sets real currencies use.
    pitfalls: >
      Assuming greedy is always optimal skips the one check that actually
      matters — whether the denominations are canonical. When counting ways
      rather than minimum coins, looping amounts on the outside and coins on
      the inside double-counts every ordering as a separate combination.
      Leaving unreachable amounts uninitialized, rather than set to infinity,
      lets a stale table entry silently masquerade as a valid answer.
    recap: >
      $f(t)=1+\min_j f(t-c_j)$ fills an $O(mT)$ table; with coins $1,4,5$ it
      makes $8$ from two coins ($4+4$) where greedy needs four.
    dialogue:
      - part: Paying eleven in tokens
        teach: >
          An exchange settles fees in tokens worth $1$, $5$, $6$ and $9$
          units, with as many of each as you like. You owe $11$ units and want
          to hand over as few tokens as possible.
      - ask: >
          Pay greedily: always take the largest token that still fits. How
          many tokens does that use?
        expects: "3"
        feedback: >
          $9$ fits, leaving $2$; then $1$ and $1$. Three tokens.
      - ask: >
          What is the fewest tokens that pay exactly $11$?
        expects: "2"
        hint: >
          No single token is worth $11$. Is there a pair?
        feedback: >
          $5 + 6 = 11$: two tokens. Greedy's $9$ looked like progress and cost
          a token.
      - ask: >
          Why did greedy lose here?
        choices:
          - text: >
              Greedy never works for making change.
            feedback: >
              It is optimal for canonical systems such as $1, 5, 10, 25$,
              which is why it feels safe. Nothing guarantees it on a set like
              $1, 5, 6, 9$.
          - text: >
              It committed to the $9$ without checking what that did to the
              remainder: $2$ can only be paid in ones.
            correct: true
            feedback: >
              A locally best step forced a worse finish, and greedy never
              looks back to notice.
          - text: >
              $11$ is an awkward amount; for larger amounts greedy recovers.
            feedback: >
              Greedy keeps losing at larger amounts too: for $20$ it pays
              $9 + 9 + 1 + 1$, four tokens, against $9 + 5 + 6$, three.
        feedback: >
          To be safe, every possible first token must be considered, and what
          each leaves behind must be paid optimally.
      - reflect: >
          Whatever the best way to pay $11$ is, it has some last token. What
          does that tell you about the fewest tokens for $11$ in terms of
          smaller amounts, and in what order would you compute them?
        hint: >
          If the last token is a $6$, what is left to pay, and how should it
          be paid?
        answer: >
          Remove the last token $c$, and what remains, $11 - c$, must itself
          be paid with the fewest tokens, or the whole payment could be
          improved. So the fewest for $11$ is one more than the smallest of
          the fewest for $10$, $6$, $5$ and $2$. Compute the fewest for every
          amount from $0$ up to $11$, each from smaller ones already known.

      - part: The table from zero up
        teach: >
          This is coin change by dynamic programming. State: $f(t)$, the
          fewest tokens summing to $t$, with $f(0) = 0$ and $f(t) = \infty$
          when $t$ cannot be paid. Transition:
          $f(t) = 1 + \min\{f(t - c_j) \mid c_j \le t\}$. Fill
          $t = 1, 2, \dots, T$ in order: $O(mT)$ time for $m$ token values,
          $O(T)$ space.
      - ask: >
          The table starts $f(0), \dots, f(7) = 0, 1, 2, 3, 4, 1, 1, 2$. What
          is $f(8)$?
        expects: "3"
        hint: >
          Take the smallest of $f(7)$, $f(3)$ and $f(2)$, then add one.
        feedback: >
          $f(8) = 1 + \min(f(7), f(3), f(2)) = 1 + \min(2, 3, 2) = 3$: for
          example $6 + 1 + 1$. The $9$ does not fit.
      - ask: >
          With $f(9) = 1$, what is $f(10)$?
        expects: "2"
        feedback: >
          $f(10) = 1 + \min(f(9), f(5), f(4), f(1)) = 1 + \min(1, 1, 4, 1)
          = 2$: $9 + 1$ or $5 + 5$.
      - ask: >
          Now read off $f(11)$ from the table. Which of the four lookups
          attains the minimum?
        choices:
          - text: >
              $f(10)$, the last token being $1$
            feedback: >
              $f(10) = 2$ gives $3$ tokens, greedy's count. The smaller
              lookups win.
          - text: >
              $f(2)$, the last token being $9$
            feedback: >
              $f(2) = 2$ gives $1 + 2 = 3$: greedy's route, $9 + 1 + 1$.
          - text: >
              $f(5)$ or $f(6)$, the last token being $6$ or $5$
            correct: true
            feedback: >
              $f(5) = f(6) = 1$, so $f(11) = 2$: the pair $5 + 6$, found
              without guessing.
        feedback: >
          The table tries every last token for every amount, which is
          exactly the check greedy skipped, at a cost of $O(mT)$.
      - ask: >
          Only $5$ and $6$ tokens remain. A colleague leaves unpayable
          amounts at $0$ instead of $\infty$. What does that table claim
          for $f(7)$?
        choices:
          - text: >
              $1$: it reads $f(1) = 0$ and $f(2) = 0$ as free, and adds one
              token.
            correct: true
            feedback: >
              $f(7) = 1 + \min(f(2), f(1)) = 1 + 0 = 1$, a single token worth
              $7$ that does not exist. With $\infty$, $f(7)$ stays $\infty$.
          - text: >
              $\infty$, correctly.
            feedback: >
              Only if unpayable amounts are marked $\infty$. A $0$ there reads
              as "already paid", and the error spreads to every amount built
              on it.
          - text: >
              $2$, from $5 + 2$.
            feedback: >
              There is no $2$ token, and with zeros in place the table finds
              something even smaller.
        feedback: >
          Unreachable must mean "worse than anything". A stale $0$
          masquerades as a valid answer, with no error to catch it.

      - part: Counting instead of minimising
        ask: >
          Tokens $1$, $2$ and $3$. How many different collections of tokens
          total $4$, where $1 + 3$ and $3 + 1$ count as the same collection?
        expects: "4"
        feedback: >
          $1 + 1 + 1 + 1$, $1 + 1 + 2$, $2 + 2$ and $1 + 3$. Four.
      - ask: >
          A counting table loops over amounts on the outside and tokens on the
          inside, adding $w(t - c)$ to $w(t)$. It reports $7$ for amount $4$.
          Why?
        choices:
          - text: >
              It counts orders: $1 + 3$ and $3 + 1$, and the three orders of
              $1 + 1 + 2$, are all counted separately.
            correct: true
            feedback: >
              For each amount it tries every last token, so it counts
              sequences: one for $1 + 1 + 1 + 1$, three for $1 + 1 + 2$, one
              for $2 + 2$, two for $1 + 3$, seven in all. Put tokens on the
              outside and each collection is built in one fixed token order,
              giving $4$.
          - text: >
              It forgot $w(0) = 1$.
            feedback: >
              Without $w(0) = 1$ every count would be $0$. The seed is there;
              the loop order is the problem.
          - text: >
              It is right, and $4$ was miscounted.
            feedback: >
              The four collections are all there is. The $7$ includes
              $1 + 3$ and $3 + 1$ as two.
        feedback: >
          Same table, different nesting: tokens outside counts collections,
          amounts outside counts orders. Said aloud for the minimum: "State
          $f(t)$, last token $c$, $f(t) = 1 + \min_j f(t - c_j)$, $O(mT)$, and
          greedy fails on $1, 5, 6, 9$ at $11$."

  - node: quant-programming.algorithms.grid-paths
    hook: >
      The closed form is fast but brittle — the instant one cell of the grid
      is blocked, the binomial count is simply wrong, and only the table
      still gives the right answer.
    explanation: >
      The recurrence $f(i,j)=f(i-1,j)+f(i,j-1)$ with $f(i,0)=f(0,j)=1$ counts
      monotone paths by summing the ways to arrive from below and from the
      left — it's an $O(mn)$ table, more expensive than the closed form
      $\binom{m+n}{m}$ when the grid is clear, but it has a capability the
      closed form lacks entirely.

      A blocked cell is handled by directly setting $f=0$ there, overriding
      the recurrence — no path can pass through it, and every downstream
      cell that depends on it inherits that zero automatically as the table
      fills. There's no equivalent surgery available on a binomial
      coefficient; obstacles are exactly the reason this DP earns its keep
      over the faster clear-grid formula.

      Restricting the same right-and-up paths to never cross above the
      diagonal is a different kind of constraint — not a blocked cell but a
      global shape condition — and it turns the plain binomial count into the
      Catalan number instead, a separate closed form. The table, though, does
      not care: the condition simply blocks every point above the diagonal,
      so setting $f = 0$ there and filling as usual returns the Catalan
      number too.
    worked: >
      Same $3\times 3$ grid as the clear case, but cell $(1,2)$ is blocked.
      Set $f(1,2)=0$ regardless of its neighbours and fill the rest by the
      same recurrence: $f(1,1)=2$, $f(1,2)=0$, $f(1,3)=0+1=1$; propagating
      forward, $f(2,2)=0+3=3$, $f(2,3)=1+3=4$, $f(3,2)=3+4=7$, and finally
      $f(3,3)=4+7=11$ — down from the clear grid's $\binom{6}{3}=20$, and no
      closed form reaches that number directly, only the table does.
    interview: >
      "Unique paths" with an added "now some cells are blocked" is the
      standard escalation — the interviewer listens for you dropping the
      binomial immediately once obstacles appear, rather than trying to patch
      the closed form.
    pitfalls: >
      Reaching for $\binom{m+n}{m}$ the moment obstacles are mentioned gives a
      confidently wrong number. An obstacle that severs every path to the
      target forces every downstream cell to $0$ — that has to propagate
      through the table, not be special-cased only at the blocked cell
      itself. Mixing up an $m\times n$ grid of cells with an
      $(m{+}1)\times(n{+}1)$ grid of lattice points shifts every index by
      one.
    recap: >
      $f(i,j)=f(i-1,j)+f(i,j-1)$ gives $\binom{m+n}{m}$ on a clear grid and,
      by forcing $f=0$ at blocked cells, the right count — $11$ here — the
      moment obstacles appear.
    dialogue:
      - part: Four blocks east, three north
        teach: >
          A courier crosses a street grid from the corner $(0,0)$ to the
          corner $(4,3)$: four blocks east and three blocks north, each block
          either east or north, never back. The dispatcher wants to know how
          many different routes there are.
      - ask: >
          Start small. How many routes lead from $(0,0)$ to $(2,2)$?
        expects: "6"
        hint: >
          Write each route as a string of E's and N's.
        feedback: >
          EENN, ENEN, ENNE, NEEN, NENE, NNEE: six. Listing works here and
          stops working quickly; $(4,3)$ already has dozens.
      - reflect: >
          Every route into $(4,3)$ arrives along its last block, either from
          $(3,3)$ or from $(4,2)$. How does that let you count routes to every
          corner without listing a single route?
        hint: >
          Can a route arrive from both? Then add.
        answer: >
          The routes into a corner split by their last block into those from
          the west and those from the south, with no overlap, so the count at
          $(i,j)$ is the count at $(i-1,j)$ plus the count at $(i,j-1)$. Along
          the bottom edge and the left edge there is exactly one route. Fill
          the grid outward from the start and every corner is two additions.

      - part: The table, and the formula it matches
        teach: >
          That is the grid-path DP: $f(i,j) = f(i-1,j) + f(i,j-1)$ with
          $f(i,0) = f(0,j) = 1$, filled row by row in $O(mn)$. On a clear
          grid it agrees with a closed form, and the table's real value shows
          the moment the grid is not clear.
      - ask: >
          Fill the table. What is $f(4,3)$?
        expects: "35"
        hint: >
          The row $j = 1$ is $1, 2, 3, 4, 5$. Each row above is a running
          sum of the one below.
        feedback: >
          Rows from $j = 0$ up: $1, 1, 1, 1, 1$; then $1, 2, 3, 4, 5$; then
          $1, 3, 6, 10, 15$; then $1, 4, 10, 20, 35$. So $f(4,3) = 35$.
      - ask: >
          Which closed form gives the same $35$, and why?
        choices:
          - text: >
              $2^{7} = 128$, since each of the seven blocks is E or N.
            feedback: >
              That counts every string of seven letters, including EEEEEEE,
              which ends seven blocks east. Only strings with exactly four
              E's arrive at $(4,3)$.
          - text: >
              $4 \times 3 = 12$, one route per block of the grid.
            feedback: >
              Blocks of the grid and routes through it are different objects;
              the $(2,2)$ case already has $6$ routes on $4$ blocks.
          - text: >
              $\binom{7}{3} = 35$: a route is a word of seven letters, and
              choosing where the three N's go fixes it.
            correct: true
            feedback: >
              In general $\binom{m+n}{m}$. Faster than the table on a clear
              grid, and of no use once a corner is closed.
        feedback: >
          The closed form needs every word of E's and N's to be a legal
          route. Close one intersection and that stops being true.

      - part: Closed intersections
        ask: >
          Roadworks close the intersection $(2,2)$. Set $f(2,2) = 0$ and fill
          the rest by the same rule. How many routes to $(4,3)$ remain?
        expects: "17"
        hint: >
          Rows $j = 0$ and $j = 1$ are unchanged. Row $j = 2$ becomes
          $1, 3, 0, \dots$
        feedback: >
          Row $j = 2$: $1, 3, 0, 4, 9$. Row $j = 3$: $1, 4, 4, 8, 17$. The zero
          at $(2,2)$ flows into every corner that depends on it. Check:
          $35 - 6 \cdot 3 = 17$, since $6$ routes reach $(2,2)$ and $3$ go on
          from it.
      - ask: >
          Now $(3,1)$ closes as well. How many routes remain?
        expects: "5"
        feedback: >
          With $f(2,2) = f(3,1) = 0$, row $j = 1$ is $1, 2, 3, 0, 1$, row
          $j = 2$ is $1, 3, 0, 0, 1$, and row $j = 3$ is $1, 4, 4, 4, 5$. The
          table needed one more zero; a formula needs another round of
          inclusion–exclusion.
      - ask: >
          The dispatcher's grid has $4$ blocks east and $3$ north. How many
          entries does the table hold?
        expects: "20"
        feedback: >
          Corners, not blocks: $i$ runs $0$ to $4$ and $j$ runs $0$ to $3$, so
          $5 \times 4 = 20$. Mixing up the $4 \times 3$ blocks with the
          $5 \times 4$ corners shifts every index by one.

      - part: A route that never strays north
        ask: >
          On a clear grid to $(4,4)$, the courier must never be further north
          than east: after every block, blocks north $\le$ blocks east. Zero
          every corner above the diagonal and fill as before. How many routes
          are there?
        expects: "14"
        hint: >
          Corners with $j > i$ are $0$. On the diagonal, $f(i,i) = f(i,i-1)$.
        feedback: >
          The diagonal entries come out $1, 1, 2, 5, 14$. Against
          $\binom{8}{4} = 70$ unrestricted routes, the constraint keeps $14$,
          the Catalan number $\frac{1}{5}\binom{8}{4}$. The closed form
          changes completely; the table only gained zeros.
      - ask: >
          Which statement about the two methods is right?
        choices:
          - text: >
              The binomial is always preferable, because it is $O(1)$.
            feedback: >
              Only on a clear grid. With closures or a shape constraint it
              answers a different question, confidently.
          - text: >
              The table handles closures and shape constraints alike by
              zeroing corners; the closed form must be rederived for each.
            correct: true
            feedback: >
              $O(mn)$ buys you robustness: any set of forbidden corners is a
              set of zeros.
          - text: >
              The table fails on the diagonal constraint, which needs the
              reflection argument.
            feedback: >
              You just ran the table on it and got $14$. Reflection gives the
              closed form; the table needs no new idea.
        feedback: >
          In an interview, when "now some cells are blocked" arrives, drop the
          binomial at once and say: "$f(i,j) = f(i-1,j) + f(i,j-1)$, with
          $f = 0$ at blocked cells, $O(mn)$."

  - node: quant-programming.algorithms.bfs-dfs
    hook: >
      "Is this BFS or DFS" comes up constantly, and the answer never depends
      on the graph — it depends only on which property of the traversal the
      problem actually needs.
    explanation: >
      Both explore every reachable vertex in $O(V+E)$ on an adjacency list;
      the entire difference is the container holding the frontier. A
      first-in-first-out queue visits vertices in order of edge distance,
      which is exactly what buys the shortest-path guarantee in an
      unweighted graph and layer-by-layer component discovery — at the cost
      of up to $O(V)$ queue memory at any one time. A stack, usually just the
      call stack, dives instead — the right shape for cycle detection,
      topological order, and connectivity, using memory proportional only to
      the current depth.

      Both need a visited set — the natural home for the hash-map
      prerequisite here — and the mark has to be written the moment a vertex
      is pushed, not when it's later popped; marking on pop lets the same
      vertex get pushed multiple times before it's ever processed, flooding
      the frontier with duplicates.

      Weights break the BFS guarantee outright: a longer path with fewer
      edges can beat a shorter path with more, so edge count alone stops
      meaning distance. Swap the plain queue for a heap — the other
      prerequisite here — that always pops the frontier vertex of least
      tentative distance, and the same traversal skeleton becomes Dijkstra's
      algorithm at $O((V+E)\log V)$.
    worked: >
      Vertices $A$ through $F$, edges A-B, A-C, B-D, C-D, C-F, D-E, exploring
      from $A$ with each vertex's neighbours visited left to right. BFS's
      queue processes $A$, then $B,C$ (both distance $1$), then $D,F$ (both
      distance $2$, discovered off $B$ and $C$), then $E$ (distance $3$, off
      $D$) — visit order $A,B,C,D,F,E$. A depth-first traversal from the same
      source and neighbour order instead dives: $A,B,D,C,F,E$ — it only
      reaches $F$ after fully descending through $D$ and $C$, one path at a
      time, rather than layer by layer.
    interview: >
      "Find the shortest path in an unweighted graph" wants BFS; "detect a
      cycle" or "produce a topological order" wants DFS — the interviewer
      listens for the container named first (queue versus stack) and the
      $O(V+E)$ cost stated unprompted.
    pitfalls: >
      Marking visited on pop instead of on push lets duplicates flood the
      frontier and inflates both time and memory. Recursive DFS on a very
      deep or densely cyclic graph without a visited check risks stack
      overflow or an infinite loop. Trusting BFS's shortest-path guarantee on
      a weighted graph gives a wrong answer the instant a longer, cheaper
      path exists — that case needs the heap upgrade.
    recap: >
      One $O(V+E)$ sweep, two frontiers: a queue orders vertices by distance,
      a stack dives deep, and a heap upgrades the same loop into Dijkstra.
    dialogue:
      - part: Seven machines and a message
        teach: >
          Seven machines are linked in a network, each link usable both ways.
          Each machine's links, in the order its list stores them: $S$: $A,
          B$. $A$: $S, C, D$. $B$: $S, D$. $C$: $A, E$. $D$: $A, B, E$. $E$:
          $C, D, F$. $F$: $E$. A message starts at $S$, and each link it
          crosses is one hop.
      - ask: >
          What is the fewest hops from $S$ to $B$?
        expects: "1"
        feedback: >
          $S$ and $B$ share a link. One hop.
      - ask: >
          A colleague explores from $S$ by always taking the first unvisited
          link in the current machine's list, going as deep as possible and
          backing up only at a dead end. How many hops long is the path along
          which this walk first reaches $B$?
        expects: "5"
        hint: >
          From $S$ the first link is $A$, from $A$ it is $C$ (since $S$ is
          visited), and so on.
        feedback: >
          The walk goes $S \to A \to C \to E \to D \to B$: five hops, and it
          reaches $B$ only after nearly every other machine. Visit order:
          $S, A, C, E, D, B, F$. It finds a path to everything, but not the
          short one.
      - reflect: >
          The deep walk found $B$ by a five-hop detour. In what order would
          machines have to be explored so that the first time any machine is
          reached, it is along a fewest-hop path? What kind of container
          gives you that order for free?
        hint: >
          The deep walk always explored the machine it discovered most
          recently. Try the opposite.
        answer: >
          In order of distance: everything one hop away, then everything two
          hops away, and so on. Explore the machine discovered *earliest*, a
          first-in-first-out queue, and since machines join the queue in
          distance order they leave in distance order. The deep walk is the
          opposite rule, last in first out, which is a stack.

      - part: One loop, two containers
        teach: >
          These are breadth-first search, with a queue as the frontier, and
          depth-first search, with a stack, usually the call stack. Otherwise
          the loop is identical: take a machine off the frontier, and put each
          unvisited neighbour on it, marking it in a visited hash set as it
          goes on. BFS visits in order of hop distance; DFS dives. Both run in
          $O(V + E)$ on adjacency lists.
      - ask: >
          Run BFS from $S$. How many adjacency-list entries does it read in
          total?
        expects: "16"
        hint: >
          Each machine is taken off the queue once, and its whole list is
          read then.
        feedback: >
          The lists hold $2 + 3 + 2 + 2 + 3 + 3 + 1 = 16$ entries, twice the
          $8$ links, and each list is read once. Visit order $S, A, B, C, D,
          E, F$; with the $V$ queue operations, that is the $O(V + E)$.
      - ask: >
          A version marks a machine visited only when it is taken off the
          queue, not when it is put on. How many times does $D$ enter the
          queue?
        expects: "2"
        feedback: >
          $A$ puts $D$ on the queue; then $B$ is processed while $D$ is still
          waiting unmarked, so $B$ puts $D$ on again. $E$ is added twice the
          same way. On a dense graph a vertex can be queued once per incoming
          link, so the frontier fills with duplicates. Mark on push.
      - ask: >
          Which job wants depth-first search rather than breadth-first?
        choices:
          - text: >
              The fewest hops from a gateway to every server
            feedback: >
              Fewest hops is exactly what the queue's distance order buys;
              DFS can report a five-hop path where one hop exists, as it did
              for $B$.
          - text: >
              Listing a network's machines layer by layer outward from a hub
            feedback: >
              Layers are BFS's native output: the queue holds one distance
              class, then the next.
          - text: >
              Detecting a circular dependency among build jobs
            correct: true
            feedback: >
              A cycle shows up as an edge back to a job still on the current
              DFS path. DFS's path-at-a-time shape is what makes that visible,
              and topological order falls out of the same walk.
        feedback: >
          The choice never depends on the graph; it depends on which property
          of the traversal the question needs. Name the container before
          coding.

      - part: When hops are not the cost
        teach: >
          The links now have latencies in milliseconds: $S$–$A$ is $1$,
          $S$–$B$ is $2$, $A$–$D$ is $10$, $B$–$D$ is $3$, and every other
          link is $20$.
      - ask: >
          BFS reaches $D$ first from $A$. What is the latency of the fastest
          route from $S$ to $D$?
        expects: "5"
        feedback: >
          BFS's route $S \to A \to D$ costs $1 + 10 = 11$. The route
          $S \to B \to D$ costs $2 + 3 = 5$. Both are two hops, so the queue
          has no reason to prefer the cheap one.
      - ask: >
          What is the smallest change to the loop that finds fastest routes
          when every latency is positive?
        choices:
          - text: >
              Run BFS once per possible latency.
            feedback: >
              Latencies can take countless values; the work multiplies, and
              the order is still wrong within each run.
          - text: >
              Use DFS instead, since it explores whole paths.
            feedback: >
              DFS ignores latencies as well; it took a five-hop detour to $B$
              on the unweighted network.
          - text: >
              Replace the queue with a heap keyed by the latency found so far,
              always expanding the closest unfinished machine.
            correct: true
            feedback: >
              That is Dijkstra's algorithm, $O((V + E) \log V)$: the same loop
              with a heap for a frontier.
        feedback: >
          Said aloud: "Same $O(V + E)$ loop, different frontier: a queue
          orders by hops, a stack dives, and a heap ordered by distance gives
          Dijkstra once the edges are weighted."

  - node: quant-programming.algorithms.bfs-shortest-path
    hook: >
      Knight moves, word ladders, and water jugs are graphs wearing a
      costume — the whole insight is recognizing what a vertex and an edge
      even are, since the BFS itself is unchanged once you do.
    explanation: >
      BFS's layer structure is the entire proof: the queue only ever holds
      vertices at distance $k$ followed by vertices at distance $k+1$, so
      the first time any vertex is reached, it's reached along a shortest
      path — later discoveries of the same vertex, at greater or equal
      distance, are simply skipped by the visited check.

      Recording $\mathrm{parent}(w)=u$ the moment $w$ is first discovered
      turns the traversal into more than a distance calculator: walking
      parent pointers backward from any target reconstructs an actual
      shortest path, not just its length, at no extra asymptotic cost.

      The real skill this node tests is translation. A word ladder's
      vertices are words and its edges are single-letter edits; a knight's
      vertices are board squares and its edges are the eight $L$-shaped
      moves; a water-jug puzzle's vertices are (amount in jug one, amount in
      jug two) pairs and its edges are the legal pours. None of these look
      like a graph until you name the state space explicitly — once you do,
      it's the same BFS every time.
    worked: >
      Fewest knight moves from $(0,0)$ to $(3,3)$: treat each square as a
      vertex and each of the eight knight offsets as an edge, then BFS from
      $(0,0)$. Layer $1$ reaches $(1,2)$ and $(2,1)$, the only squares one
      offset away. From $(1,2)$, the offset $(+2,+1)$ lands on $(3,3)$, so it
      enters layer $2$ before any square past distance $2$ is even
      discovered. So $d(3,3)=2$, realized by $(0,0)\to(1,2)\to(3,3)$, with
      parent pointers recovering that exact path.
    interview: >
      "Fewest knight moves", "minimum word transformations", and "fewest
      pours to measure a target volume" are the same question — the
      interviewer listens for you defining the vertex and edge of the hidden
      graph before running BFS, since that translation is the actual thing
      being graded.
    pitfalls: >
      Running DFS on a state-space puzzle and reporting the first path found
      as shortest is wrong — DFS finds a path, not the shortest one.
      Leaving the state space unbounded (an "infinite" board, or water-jug
      states that aren't deduplicated) lets BFS explore without limit.
      Re-deriving the path by search after the fact, instead of storing
      parent pointers during the traversal, wastes work and risks getting it
      wrong.
    recap: >
      BFS's layers are exactly the distance classes, so one $O(V+E)$ sweep
      plus parent pointers finds every shortest path — $2$ knight moves from
      $(0,0)$ to $(3,3)$.
    dialogue:
      - part: Three lots to ten
        teach: >
          A test harness holds a position of $3$ lots. Each action either
          doubles the position or sells exactly $1$ lot. The task: reach
          exactly $10$ lots in as few actions as possible.
      - ask: >
          Before computing anything: what are the vertices and edges of the
          graph hiding in this problem?
        choices:
          - text: >
              Vertices are the two actions; edges join actions that can
              follow each other.
            feedback: >
              Then the graph has two vertices and says nothing about where
              you are. The thing you move between is the position, so the
              positions are the vertices.
          - text: >
              Vertices are position sizes; an edge joins two sizes one action
              apart.
            correct: true
            feedback: >
              $3$ has edges to $6$ and $2$, $6$ to $12$ and $5$, and so on.
              Fewest actions is fewest edges.
          - text: >
              There is no graph; it is an arithmetic puzzle.
            feedback: >
              Every puzzle of states and legal moves is a graph. Seeing it is
              the whole insight; the search afterwards is routine.
        feedback: >
          Name the state and the move first. Once you have, the question is
          a shortest path in an unweighted graph.
      - ask: >
          What is the fewest actions from $3$ to $10$?
        expects: "3"
        hint: >
          List every position one action from $3$, then every new position
          one action from those.
        feedback: >
          One action reaches $\{6, 2\}$. Two reach $\{12, 5, 4, 1\}$. Three
          reach $10$, by $3 \to 6 \to 5 \to 10$.
      - reflect: >
          How can you be sure no route of two actions exists? And if the
          harness needs the route itself, not just its length, what would
          you record while searching?
        hint: >
          You listed the positions by number of actions. What did that list
          guarantee?
        answer: >
          The positions reachable in at most two actions are exactly $3$,
          $6$, $2$, $12$, $5$, $4$ and $1$, built layer by layer, and $10$ is
          not among them, so three is the minimum. For the route, record
          each position's parent, the position it was first reached from,
          at the moment it is discovered; then walk back from $10$ to $3$.

      - part: Layers and parent pointers
        teach: >
          That is BFS for shortest paths. Set $d(s) = 0$ and push $s$; pop
          $u$, and for each unvisited neighbour $w$ set $d(w) = d(u) + 1$,
          $\mathrm{parent}(w) = u$, mark it and push it. Stop when the target
          is discovered, and read the route off the parents. It is the plain
          breadth-first loop, run on a graph that was never written down.
      - ask: >
          Expanding doubling before selling, BFS records parents as it goes.
          Which position is recorded as the parent of $10$?
        expects: "5"
        feedback: >
          Layer two is discovered in the order $12, 5, 4, 1$. Expanding $12$
          gives $24$ and $11$; expanding $5$ gives $10$. So
          $\mathrm{parent}(10) = 5$, $\mathrm{parent}(5) = 6$,
          $\mathrm{parent}(6) = 3$, and the route is $3, 6, 5, 10$.
      - ask: >
          Why can BFS stop the moment $10$ is first discovered?
        choices:
          - text: >
              Every position at distance $2$ or less was discovered before
              anything at distance $3$, so $10$ was not reachable sooner.
            correct: true
            feedback: >
              That is the layer invariant. Any later discovery of $10$ would
              be at distance $3$ or more.
          - text: >
              Because $10$ is close to the starting position $3$.
            feedback: >
              Numerical closeness means nothing here: $4$ is closer to $3$
              than $6$ is, yet $4$ takes two actions and $6$ takes one.
              Distance is counted in edges.
          - text: >
              It cannot stop; it must finish every layer to compare routes.
            feedback: >
              Finishing the layer would only find other routes of the same
              length. The first discovery is already shortest.
        feedback: >
          The queue only ever holds vertices at distance $k$ followed by
          vertices at distance $k + 1$, so layers are distance classes and a
          vertex's first discovery is along a shortest path. That invariant is
          the entire correctness proof.
      - ask: >
          Someone uses depth-first search instead, always trying doubling
          first and never going deeper than $4$ actions. How many actions
          does the first route it finds to $10$ use?
        expects: "4"
        hint: >
          Follow doubling from $3$ until the cap, then back up one action at
          a time.
        feedback: >
          $3 \to 6 \to 12 \to 24 \to 48$ hits the cap; $24 \to 23$ fails;
          backing up to $12$, it sells to $11$, doubles to $22$, fails, then
          sells to $10$. The route $3, 6, 12, 11, 10$ uses $4$ actions. DFS
          finds *a* route; only BFS guarantees the shortest.

      - part: Other costumes, and a dead end
        ask: >
          A word ladder allows only these words: COLD, CORD, CORE, CARD, CARE,
          WARD, WORD, WORM, WARM. One edit changes one letter and must land on
          an allowed word. What is the fewest edits from COLD to WARM?
        expects: "4"
        hint: >
          Vertices are words, edges are single-letter changes. Build the
          layers from COLD.
        feedback: >
          Layer $1$: CORD. Layer $2$: CORE, CARD, WORD. Layer $3$: CARE,
          WARD, WORM. Layer $4$: WARM, for instance by COLD, CORD, CARD, WARD,
          WARM. Same BFS, different nouns.
      - ask: >
          Back to the position harness with new actions: double, or buy
          exactly $4$ lots. From $3$ lots the target is $9$. What happens when
          BFS runs with no bound on position size?
        choices:
          - text: >
              It finds $9$ after a few layers, like before.
            feedback: >
              $3$ and $3 + 4 = 7$ are odd, and so is every odd number plus
              $4$: the reachable odd positions are $3, 7, 11, 15, \dots$, and
              doubling gives only even numbers. $9$ never appears.
          - text: >
              It never stops: $9$ is unreachable, and the layers grow
              forever.
            correct: true
            feedback: >
              Reachable positions are $3$, $7$, $11$, and so on, plus even
              numbers, so $9$ is never found and the queue never empties.
          - text: >
              It reports $9$ along a wrong route.
            feedback: >
              BFS never reports a vertex it has not reached. The danger is
              not a wrong answer but no answer.
        feedback: >
          An infinite state space needs a bound, or an argument that the
          target is reachable, before the search starts. Said aloud: "States
          are positions, moves are edges, BFS from the start with parent
          pointers, $O(V + E)$ over the states I allow."

  - node: quant-programming.algorithms.greedy-exchange
    hook: >
      "Sort by X and take greedily" is only half an answer — the exchange
      argument is the other half, and different objectives need genuinely
      different sort keys, not just a plausible-sounding one.
    explanation: >
      The proof template is fixed regardless of the problem: take any
      optimal solution $O$ and the greedy solution $G$, find the first
      position where they disagree, and show $O$ can be edited at that one
      position to match $G$ without becoming worse. Iterating the argument
      across every disagreement shows $G$ is optimal — the greedy choice was
      never actually risky, it just looked that way before the edit was
      exhibited.

      What the argument does not do is tell you which sort key to use — that
      still has to be discovered per problem, and different objectives
      demand different keys even on similar-looking inputs. Interval
      scheduling to maximize the count of non-overlapping intervals wants
      earliest finish time; a different objective on the same kind of input
      can want an entirely different order.

      A clean instance of that difference: scheduling jobs on one machine to
      minimize the sum of completion times wants shortest processing time
      first, not earliest anything — and the exchange argument for it swaps
      two adjacent jobs whenever a longer one precedes a shorter one, showing
      the swap strictly helps.
    worked: >
      Four jobs, processing times $4,2,5,1$, one machine, minimize the sum of
      completion times. Greedy: shortest processing time first, order
      $1,2,4,5$, giving completion times $1,3,7,12$, total $23$. Exchange
      check: if adjacent jobs with $p_i>p_j$ appear with the longer one
      first, swapping leaves every other job's completion time unchanged and
      reduces the swapped pair's contribution from $p_i+(p_i+p_j)$ to
      $p_j+(p_i+p_j)$ — strictly better whenever $p_i>p_j$, so any unsorted
      schedule can be improved. Running the original order $4,2,5,1$ instead
      gives completions $4,6,11,12$, totalling $33$ — confirming shortest-
      processing-time's $23$ is strictly better.
    interview: >
      "Schedule jobs to minimize average wait time" wants shortest processing
      time; "schedule to maximize the count of intervals kept" wants earliest
      finish time — the interviewer listens for the sort key stated with a
      one-line exchange justification, not "sort it and it'll work out".
    pitfalls: >
      Offering a plausible-sounding sort order with no exchange argument at
      all invites the interviewer to ask for a counterexample, and a
      real one usually exists. Reusing earliest-finish-time (right for
      maximizing count) when the actual objective is minimizing total
      completion time (which wants shortest-processing-time) produces a
      confidently wrong schedule. Skipping the check for whether one local
      swap can strictly improve any given non-greedy solution leaves the
      "proof" as an unverified guess.
    recap: >
      Greedy needs a proof: exchange the optimum's first disagreement for the
      greedy choice — shortest-processing-time beats the naive order $33$ to
      $23$ on jobs $4,2,5,1$.
    dialogue:
      - part: Eight calls, one analyst
        teach: >
          Clients request call slots with one analyst: $[0,7)$, $[1,3)$,
          $[2,5)$, $[4,6)$, $[5,9)$, $[6,8)$, $[8,11)$, $[9,12)$, in hours.
          She takes one call at a time, and a call may start the moment
          another ends. The desk wants as many calls accepted as possible.
      - ask: >
          Accept calls in order of start time, taking each one that does not
          clash with those already accepted. How many calls is that?
        expects: "2"
        feedback: >
          $[0,7)$ goes first and blocks everything starting before $7$. The
          next to fit is $[8,11)$, which blocks $[9,12)$. Two calls.
      - ask: >
          What is the most calls she can take?
        expects: "4"
        hint: >
          Short calls that end early leave the most room.
        feedback: >
          $[1,3)$, $[4,6)$, $[6,8)$, $[8,11)$: four. The $[0,7)$ that
          start-time order grabbed first swallowed most of the morning.
      - ask: >
          Shortest call first is the next idea. On three requests, $[0,5)$,
          $[4,7)$ and $[6,11)$, what does it do?
        choices:
          - text: >
              It takes $[0,5)$ and $[6,11)$, the best possible.
            feedback: >
              Those two are compatible, but shortest-first never gets to
              them: it takes $[4,7)$ first, three hours long, and that clashes
              with both.
          - text: >
              It takes $[4,7)$ only, which clashes with both others, so one
              call where two were possible.
            correct: true
            feedback: >
              A short call can sit across the boundary between two longer
              ones. Length says nothing about what a call blocks.
          - text: >
              It takes all three, since short calls never clash.
            feedback: >
              $[4,7)$ overlaps $[0,5)$ on $[4,5)$ and $[6,11)$ on $[6,7)$.
              Being short does not stop a call overlapping.
        feedback: >
          Two plausible sort keys, two counterexamples. A greedy rule needs a
          reason, not a feeling.
      - reflect: >
          Which call should be accepted first, and why can accepting it never
          cost you, whatever the best schedule looks like?
        hint: >
          What a first call costs you is the time after it ends. Compare your
          choice with the first call of some optimal schedule.
        answer: >
          The call that finishes earliest. Take any optimal schedule; its
          first call ends no earlier than the earliest-finishing call, so
          swapping that call in clashes with nothing that came after, and the
          count stays the same. So some optimal schedule starts with the
          earliest finish, and the same argument repeats on what is left.

      - part: The rule and the proof it owes
        teach: >
          That is a greedy algorithm with an exchange argument. Greedy commits
          to the locally best choice and never revisits it; the exchange
          argument is the proof that makes it legal. Take an optimal solution
          $O$ and the greedy one $G$, find the first place they differ, and
          show $O$ can be edited to match $G$ there without getting worse.
          Here: sort by finish time, take every call that starts after the
          last one taken, $O(n \log n)$.
      - ask: >
          Run earliest-finish-first on the eight requests. How many calls does
          it accept?
        expects: "4"
        feedback: >
          By finish time: $[1,3)$ taken; $[2,5)$ clashes; $[4,6)$ taken;
          $[0,7)$ clashes; $[6,8)$ taken; $[5,9)$ clashes; $[8,11)$ taken;
          $[9,12)$ clashes. Four, the maximum.
      - ask: >
          Another optimal schedule is $[1,3)$, $[4,6)$, $[6,8)$, $[9,12)$. It
          first differs from greedy's at the fourth call. Why can greedy's
          $[8,11)$ replace its $[9,12)$?
        choices:
          - text: >
              $[8,11)$ is shorter than $[9,12)$.
            feedback: >
              Both last three hours. Length is not the point; finishing time
              is.
          - text: >
              $[8,11)$ starts after $[6,8)$ ends and finishes no later than
              $[9,12)$, so it clashes with nothing the schedule keeps.
            correct: true
            feedback: >
              Starts after the previous call: greedy only takes compatible
              calls. Ends no later: whatever came after $[9,12)$ also fits
              after $[8,11)$. The count is unchanged.
          - text: >
              $[8,11)$ starts earlier, and earlier is always better.
            feedback: >
              Starting earlier is what got $[0,7)$ into trouble. A call that
              starts earlier could clash with the one before it; the
              exchange works because greedy's call fits after the previous
              one and *ends* no later.
        feedback: >
          That one swap, repeated at every disagreement, turns any optimal
          schedule into greedy's without losing a call. That is the proof.

      - part: Change the objective, change the key
        ask: >
          Now each call has a fee: $[1,3)$, $[4,6)$ and $[6,8)$ pay $2$ each,
          and $[2,9)$ pays $10$. The goal is the largest total fee. What does
          earliest-finish-first get, against the best?
        choices:
          - text: >
              $6$ from the three short calls, against $10$ from $[2,9)$ alone.
            correct: true
            feedback: >
              The exchange fails: swapping a short call in for $[2,9)$ keeps
              the count but loses fee. Weighted scheduling needs dynamic
              programming over calls sorted by finish time.
          - text: >
              $10$, the best, since $[2,9)$ finishes before the others start.
            feedback: >
              $[2,9)$ finishes at $9$, after all three short calls. The rule
              takes $[1,3)$ first and is then shut out of $[2,9)$.
          - text: >
              $16$: every call.
            feedback: >
              $[2,9)$ overlaps all three short calls, so it cannot be taken
              with any of them.
        feedback: >
          An exchange argument is tied to its objective. Change what is being
          maximised and the proof, and often the rule, breaks.
      - ask: >
          A different objective: three reports take $6$, $2$ and $3$ minutes
          and run back to back. In the order $6, 2, 3$, what is the sum of
          their completion times?
        expects: "25"
        feedback: >
          They finish at $6$, $8$ and $11$, and $6 + 8 + 11 = 25$.
      - ask: >
          Swap the first two, running $2, 6, 3$. By how much does the sum of
          completion times fall?
        expects: "4"
        hint: >
          Only the two swapped reports change their finishing times.
        feedback: >
          Now they finish at $2$, $8$, $11$, summing to $21$, which is $4$
          less. The third report is untouched, and the swapped pair improves by
          exactly $6 - 2$. Any longer report placed before a shorter one can
          be swapped for a gain, so shortest-first, $2, 3, 6$, with sum
          $2 + 5 + 11 = 18$, is optimal.
      - teach: >
          Same template, different key: maximum count of calls wants earliest
          finish, minimum total completion time wants shortest first. Said
          aloud: "Sort by finish time and take what fits. Exchange argument:
          the optimum's first call ends no earlier than mine, so I can swap
          mine in without losing anything."

  - node: quant-programming.algorithms.pattern-catalog
    hook: >
      "Now make it faster" is its own short multiple-choice test, and naming
      the target complexity before touching the keyboard is what's actually
      being graded.
    explanation: >
      Treat every "optimize this" prompt as two lookups chained together:
      first, what complexity is the interviewer pushing you toward, and
      second, what structural fact about this specific input licenses the
      technique that reaches it. Neither lookup works without the other — the
      complexity target narrows the menu, and the structural cue picks the
      one item on it that actually applies here.

      From $O(n^{2})$ to $O(n\log n)$: sort the data, or run a binary search
      inside an outer loop. From $O(n^{2})$ to $O(n)$: two pointers when the
      data is already ordered on the compared quantity, a sliding window when
      the constraint survives shrinking, prefix sums when the queries are
      over ranges, a hash map the instant the question is "have I seen this
      value before". From exponential to polynomial: dynamic programming
      when subproblems repeat, greedy with an exchange argument when one
      local rule provably suffices and no repeated subproblem structure is
      even present. From polynomial down to $O(\log R)$ over a range of
      width $R$: binary search the answer itself.

      Say the pattern and the one-sentence reason it applies before writing
      any code — that sentence is the part an interviewer is actually
      scoring, and stating it first is what catches a wrong pattern before
      it costs you a rewrite.
    interview: >
      "Can you make this faster" is asked as a near-automatic follow-up on
      almost every problem — the interviewer is grading whether you name a
      target complexity and the matching structural cue before typing, not
      whether the resulting code happens to be fast.
    pitfalls: >
      Reaching for a technique because it sounds advanced — dynamic
      programming on a problem a sorted-array two-pointer already solves in
      $O(n)$ — wastes time solving the wrong-shaped problem well. Naming the
      right target complexity but the wrong technique for it (defaulting to
      sorting for every $O(n\log n)$ ask, even when a heap is the structure
      actually available at that cost) still misses. Saying "use dynamic
      programming" without naming the state answers with the word instead of
      the mapping the interviewer is listening for.
    recap: >
      Every "now optimize" has a short menu keyed by the complexity you're
      being pushed toward — naming the technique and the reason out loud is
      the graded step, not the code that follows it.
    dialogue:
      - part: Ten thousand seconds
        teach: >
          Your duplicate check compares every pair of trade IDs with two
          nested loops, and it clears $10{,}000$ trades in $1$ second. The
          interviewer nods, then says: production sends $1{,}000{,}000$ trades
          a day. Now make it faster.
      - ask: >
          At the same speed, about how many seconds would the nested loops
          take on a million trades?
        expects: "10000"
        tolerance: 100
        hint: >
          The input grows by a factor of $100$. What does that do to $n^{2}$?
        feedback: >
          $100$ times the input is $100^{2} = 10{,}000$ times the pairs, so
          about $10{,}000$ seconds, close to three hours. The loops did about
          $10^{8}$ pair checks in that first second; an $O(n)$ method needs
          about $10^{6}$ steps for a million trades, a small fraction of a
          second.
      - ask: >
          What do you reach for to make the duplicate check $O(n)$?
        choices:
          - text: >
              Sort the IDs, then compare neighbours.
            feedback: >
              Correct, but $O(n \log n)$: the sort is the bill. It is the
              right answer when memory is tight, not when the ask is $O(n)$.
          - text: >
              Two pointers.
            feedback: >
              Two pointers need the data ordered on the compared quantity,
              and trade IDs arrive in no useful order.
          - text: >
              A hash set of IDs seen so far, checked before each insert.
            correct: true
            feedback: >
              "Have I seen this before?" is the hash map's question, answered
              in $O(1)$ expected time per trade.
        feedback: >
          The question shape picked the tool almost before you thought about
          it.
      - reflect: >
          You chose in seconds. What two things did you actually look at to
          choose, and why would either one alone not have been enough?
        hint: >
          One is a number the interviewer implied; the other is a phrase in
          the problem.
        answer: >
          The target complexity, $O(n^{2})$ down to $O(n)$, and the structural
          cue, "have I seen this value before". The target narrows the menu to
          a few tools: two pointers, sliding window, prefix sums, hash map.
          The cue picks the one whose precondition this input satisfies. A
          target alone leaves a list of guesses; a cue alone can point at a
          tool that is too slow.

      - part: The short menu
        teach: >
          The menu is short. $O(n^{2})$ to $O(n \log n)$: sort, or binary
          search inside a loop. $O(n^{2})$ to $O(n)$: two pointers on ordered
          data, a sliding window when the constraint survives shrinking,
          prefix sums when queries are ranges, a hash map for "seen before".
          Exponential to polynomial: dynamic programming when subproblems
          repeat, greedy when an exchange argument holds. A search over a
          range of width $R$: binary search the answer.
      - ask: >
          Daily volumes are all nonnegative. Find the longest run of days with
          total volume at most a cap $S$. Your $O(n^{2})$ tries every run.
          Which tool reaches $O(n)$?
        choices:
          - text: >
              A sliding window: dropping a day from the front can only help
              the total, so both edges move forward only.
            correct: true
            feedback: >
              The cue is "longest contiguous run under a constraint" plus
              nonnegative entries, which make the constraint survive
              shrinking.
          - text: >
              Binary search on the run length.
            feedback: >
              Feasibility in the length is monotone here, so it works, but
              each check is $O(n)$ and the total is $O(n \log n)$. The window
              does it in one pass.
          - text: >
              Dynamic programming over end days.
            feedback: >
              Nothing here repeats that needs caching. The window's amortized
              $O(n)$ is simpler and faster.
        feedback: >
          Name the cue out loud: "contiguous, nonnegative, monotone under
          shrinking, so a sliding window."
      - ask: >
          $k$ sensors go on a pipeline at some of $n$ sorted candidate
          positions, and the smallest gap between neighbouring sensors should
          be as large as possible. Trying every placement is exponential.
          What do you reach for?
        choices:
          - text: >
              Greedy: put the sensors at evenly spaced candidates.
            feedback: >
              Candidates are not evenly spaced, and no exchange argument backs
              "evenly". A rule with no proof is a guess.
          - text: >
              Binary search on the gap $g$, with an $O(n)$ greedy check: place
              a sensor at the first candidate, then at each next candidate at
              least $g$ further on, and see if $k$ fit.
            correct: true
            feedback: >
              "Largest value that works" with a monotone check: if gap $g$ is
              achievable, so is every smaller gap. $O(n \log R)$ over a range
              of width $R$.
          - text: >
              BFS over placements of sensors.
            feedback: >
              The state space is exponential; BFS would visit all of it.
        feedback: >
          "Maximise the minimum" plus a cheap feasibility check is the cue for
          searching the answer.
      - ask: >
          A risk engine must count the routes a price can take through a grid
          of up and down moves, some nodes forbidden. The plain recursion is
          exponential. What do you reach for?
        choices:
          - text: >
              Dynamic programming: the count at each node is the sum of the
              counts at its predecessors, and the same nodes recur.
            correct: true
            feedback: >
              Overlapping subproblems with optimal substructure. States times
              transition is the cost to quote: nodes times $O(1)$.
          - text: >
              A closed-form binomial count.
            feedback: >
              Only on a grid with nothing forbidden. Blocked nodes break the
              formula, and the table absorbs them as zeros.
          - text: >
              BFS from the start node.
            feedback: >
              BFS finds the *shortest* route, not the *number* of routes.
        feedback: >
          "How many ways" with a recursive structure is the DP cue.

      - part: Where the cue misleads
        ask: >
          Pay $13$ units with the fewest tokens from denominations $1$, $5$,
          $6$, $9$. Your instinct says greedy is the fast answer. Is it?
        choices:
          - text: >
              Yes: largest token first is fast and optimal.
            feedback: >
              Greedy pays $9 + 1 + 1 + 1 + 1$, five tokens, while $6 + 6 + 1$
              uses three. Fast, and wrong: no exchange argument holds on these
              denominations.
          - text: >
              No: greedy pays five tokens, $9 + 1 + 1 + 1 + 1$, while
              $6 + 6 + 1$ uses three. This needs DP.
            correct: true
            feedback: >
              A greedy rule is only on the menu when an exchange argument
              holds. Without one, "fewest" over repeated subproblems is DP.
          - text: >
              It does not matter; both are $O(T)$.
            feedback: >
              Speed is irrelevant if the answer is wrong. Greedy returns $5$
              where $3$ is possible.
        feedback: >
          The cue "minimum" points at greedy or DP. Which one depends on
          whether you can prove the local rule; if you cannot, it is DP.
      - ask: >
          Find two trades summing to a target $T$ in an unsorted tape of $n$
          trades. "Pair" and "sum" suggest two pointers. Which answer should
          you give for $O(n)$?
        choices:
          - text: >
              Two pointers, straight on the tape.
            feedback: >
              The discard argument needs the data sorted. On an unsorted tape
              the sweep can skip the real pair and still return an answer.
          - text: >
              Sort, then two pointers.
            feedback: >
              Correct, but $O(n \log n)$, since the sort costs that and no
              comparison sort does better. It misses the $O(n)$ ask.
          - text: >
              A hash set of values seen, queried for $T - x$.
            correct: true
            feedback: >
              The real cue is "have I seen the partner before", which is the
              hash map's question: $O(n)$ expected time, $O(n)$ space.
        feedback: >
          A surface word can point at the wrong tool. Check the precondition
          before you name the pattern; the precondition is the part being
          graded.
