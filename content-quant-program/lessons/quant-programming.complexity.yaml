unit: quant-programming.complexity
opening: >
  Complexity is the currency of every interview algorithm question: before
  writing a line of code you size the solution against the input bound, and
  every design choice afterward is priced in this vocabulary. This unit
  builds that vocabulary in order: Big-O/Ω/Θ as the formal grammar, the
  growth ladder that turns an input size into a go/no-go verdict, why
  logarithms are practically free and where they come from, the
  recursion-tree argument behind n log n, amortized analysis and the
  doubling array that is its canonical proof, the space-time tradeoff that
  motivates caching and hashing, hashing's expected O(1) and the
  birthday-shaped caveat behind it, and finally the two silent failure modes
  — floating-point representation error and integer overflow — that
  correct-looking code can still fall into. By the end you should be able to
  look at an input bound and immediately name the complexity class it
  demands, and to spot the line of code where a float comparison or a
  32-bit sum is about to lie to you.
lessons:
  - node: quant-programming.complexity.big-o
    hook: >
      "What's the complexity of this loop" is graded on whether you state
      the tight bound or just any valid upper bound — conflating $O$ with
      $\Theta$ is the fastest way to look like you're pattern-matching
      syntax rather than reasoning about growth.
    explanation: >
      Asymptotic notation exists because counting exact instructions is both
      intractable and beside the point — what matters for sizing a solution
      is how cost scales as the input grows, not the constant overhead of
      one particular machine or language. $O$, $\Omega$, and $\Theta$
      formalize "scales like" at three different strengths: $f=O(g)$ only
      claims $f$ never grows faster than $g$ past some point, $f=\Omega(g)$
      only claims $f$ never grows slower, and $f=\Theta(g)$ pins the growth
      rate exactly by requiring both bounds to hold with possibly different
      constants.

      This is why $O$ alone can be a loose claim: linear search is
      truthfully $O(n^{2})$, since $n \le c\cdot n^{2}$ for $c=1$ and all
      $n\ge1$, even though that bound wastes information. Interviewers
      asking for "the complexity" almost always want the tight $\Theta$
      bound, and a good habit is to state both — an algorithm doing
      $\Theta(n)$ work is trivially also $O(n)$, $O(n^{2})$, and so on.

      Reducing a formula to its complexity class means dropping every
      additive lower-order term and every multiplicative constant, keeping
      only the fastest-growing piece — constants and lower-order terms shift
      the crossover point $n_{0}$ and the witnesses $c_{1}, c_{2}$, but never
      the growth class itself. And unless stated otherwise, "the complexity"
      defaults to worst case: quicksort is loosely called $O(n\log n)$, but
      its honest worst-case bound is $\Theta(n^{2})$.
    worked: >
      Take $f(n) = n^{2} + 10n$. For a lower bound, $f(n) \ge n^{2}$ for
      every $n\ge1$, so $c_{1}=1$ works. For an upper bound, once $n\ge1$,
      $10n \le 10n^{2}$, so $f(n) \le 11n^{2}$, giving $c_{2}=11$. Both hold
      from $n_{0}=1$ onward, so $f(n)=\Theta(n^{2})$ with witnesses
      $c_{1}=1$, $c_{2}=11$, $n_{0}=1$. Checking at $n=10$: $f(10)=200$,
      which sits between $n^{2}=100$ and $11n^{2}=1100$ exactly as the
      bounds predict.
    interview: >
      Expect "what's the time complexity of this function" over actual
      code, with a follow-up "is that tight, or just an upper bound" to
      check whether you know $O$ and $\Theta$ are different claims. State
      the answer as a $\Theta$ bound with the dominant term named, and be
      ready to justify dropping the lower-order terms and constants.
    pitfalls: >
      Reporting an $O$ bound as if it were automatically tight — $O(n^{2})$
      means "quadratic or better," not "quadratic." Quoting an average-case
      bound (quicksort's $O(n\log n)$) as *the* complexity without noting
      the worst case is $\Theta(n^{2})$ is the other common slip.
    recap: >
      $O$, $\Omega$, and $\Theta$ are upper, lower, and tight growth bounds
      up to a constant factor, found by dropping constants and lower-order
      terms and keeping only the fastest-growing piece.
    steps:
      - teach: >
          Counting exact instructions is both intractable and beside the
          point. What a design decision actually needs is how cost scales as
          the input grows, not the constant overhead of one particular machine
          or language.
      - teach: >
          $O$, $\Omega$, and $\Theta$ formalize "scales like" at three
          different strengths. $f=O(g)$ claims $f$ never grows faster than $g$
          past some point, $f=\Omega(g)$ claims it never grows slower, and
          $f=\Theta(g)$ pins the rate exactly by demanding both bounds at
          once.
      - teach: >
          Linear search does $n$ comparisons in the worst case, which is
          truthfully $O(n^{2})$ too, since $n \le n^{2}$ for every $n \ge 1$ —
          a correct but wasteful claim. The tight bound is $\Theta(n)$, and
          that is the one interviewers almost always want.
      - ask: >
          An algorithm does exactly $\Theta(n)$ work. Which of these
          statements about it is also automatically true?
        choices:
          - text: >
              It is $\Omega(n^{2})$
            feedback: >
              $\Omega(n^{2})$ claims the work never grows slower than $n^{2}$,
              which is false for a linear-time algorithm — this direction only
              weakens correctly toward smaller functions.
          - text: >
              It is $O(n)$, $O(n^{2})$, and $O(n^{3})$, among others
            correct: true
            feedback: >
              A tight $\Theta(n)$ bound automatically satisfies every looser
              upper bound above it — $\Theta$ is the strongest claim, and
              everything weaker than it still holds.
          - text: >
              It is $\Theta(n^{2})$ as well
            feedback: >
              $\Theta$ pins the growth rate exactly, so a function cannot be
              $\Theta$ of two different growth rates at once.
        feedback: >
          $\Theta(n)$ is the strongest of the three claims, so every looser
          $O$ bound above $n$ follows for free — but $\Omega$ can only move to
          slower-growing functions, never faster ones.
      - teach: >
          Reducing a formula to its complexity class means dropping every
          additive lower-order term and every multiplicative constant, keeping
          only the fastest-growing piece.
      - ask: >
          What is the $\Theta$-exponent of $n$ for $h(n) = 8n^{3} + 50n^{2} +
          2$ — that is, $h(n) = \Theta(n^{k})$ for which $k$?
        expects: "3"
        hint: >
          Drop the lower-order terms $50n^{2}$ and $2$ and the constant factor
          $8$; only the fastest-growing piece decides the class.
        feedback: >
          $8n^{3}$ dominates both $50n^{2}$ and $2$ once $n$ is large, so
          $h(n) = \Theta(n^{3})$ and $k=3$ — the coefficient $8$ and the
          lower-order terms never change the exponent.
      - teach: >
          Unless stated otherwise, "the complexity" defaults to worst case.
          Quicksort is loosely called $O(n\log n)$, but its honest worst-case
          bound is $\Theta(n^{2})$ — the average-case figure people quote out
          of habit.
      - ask: >
          An interviewer asks "what's the complexity of quicksort" with no
          qualifier. Which answer is correct?
        choices:
          - text: >
              $\Theta(n\log n)$, since that is quicksort's typical running
              time
            feedback: >
              That is the average case. An unqualified "the complexity"
              defaults to worst case, not the typical run.
          - text: >
              $\Theta(n^{2})$, the worst case, with $\Theta(n\log n)$
              mentioned as the average case
            correct: true
            feedback: >
              Correct — worst case is the default reading, and naming the
              better average case alongside it shows you know both.
          - text: >
              $O(n\log n)$, and that is also the tightest bound
            feedback: >
              $O(n\log n)$ is true but not tight — quicksort's worst case is
              $\Theta(n^{2})$, a weaker (larger) bound than $n\log n$.
        feedback: >
          Worst case is the default whenever "the complexity" is asked with no
          qualifier — quicksort's is $\Theta(n^{2})$, even though
          $\Theta(n\log n)$ describes its typical behavior.
      - teach: >
          Carry the mechanical habit forward: name the tight $\Theta$ bound by
          default, and get there by stripping every constant and every
          lower-order term until only the fastest-growing piece remains.

  - node: quant-programming.complexity.growth-ranking
    hook: >
      Reading the constraint "$n \le 10^{5}$" should instantly rule out
      $O(n^{2})$ and point you at $O(n\log n)$ — sizing a solution is a
      five-second mental calculation, not a guess made after coding
      something slow.
    explanation: >
      The ladder only becomes useful once anchored to real hardware: a
      processor executes on the order of $10^{8}$ to $10^{9}$ simple
      operations per second, and a typical interview or contest time budget
      is around a second, so the total operation count you can afford is
      bounded by roughly that same $10^{8}$–$10^{9}$. Reading the input
      bound $n$ off the problem and asking "how many operations does each
      candidate complexity actually produce at this $n$" turns the abstract
      ladder into a concrete yes/no filter before any code gets written.

      The rule of thumb worth memorizing: $n$ up to about $10^{8}$ tolerates
      $O(n)$ or $O(n\log n)$, $n$ up to about $10^{4}$ tolerates $O(n^{2})$,
      and $n$ up to about $20$–$25$ tolerates $O(2^{n})$. These thresholds
      come directly from plugging $n$ into each growth function and
      comparing against the operation budget — $O(n^{2})$ at $n=10^{4}$ is
      $10^{8}$ operations, right at the edge, while at $n=10^{6}$ it is
      $10^{12}$, hours too slow.

      Treat this as a first filter, not a certificate: constants matter at
      the boundary (an $O(n\log n)$ algorithm with a heavy constant can
      still miss a tight limit), and the count has to reflect total work
      across the whole algorithm, not just the innermost loop in isolation.
    worked: >
      A problem allows $n$ up to $10^{5}$ and a roughly one-second limit. An
      $O(n^{2})$ approach does about $(10^{5})^{2}=10^{10}$ operations — at
      $10^{8}$ operations per second that's on the order of $100$ seconds,
      far too slow. An $O(n\log n)$ approach does about
      $10^{5}\times\log_{2}(10^{5}) \approx 10^{5}\times17 = 1.7\times10^{6}$
      operations, comfortably under $0.1$ seconds — the sizing alone points
      you at a sort-based or divide-and-conquer method before writing a line
      of nested loops.
    interview: >
      "The input can be up to $n=10^{5}$ — what complexity do you need" is
      asked directly to see whether you reason from the constraint to the
      algorithm class before coding, rather than coding first and
      discovering a timeout. Naming the operation-count arithmetic out loud
      is the expected answer, not a memorized table.
    pitfalls: >
      Estimating from the innermost loop alone instead of the total
      operation count across the whole run understates the true cost.
      Trusting the rule of thumb exactly at the boundary without accounting
      for constant factors — an $O(n\log n)$ algorithm with a large hidden
      constant can still fail a tight limit even when the class looks safe.
    recap: >
      Convert the input bound $n$ into an actual operation count for each
      candidate complexity and compare it against the roughly $10^{8}$–
      $10^{9}$ operations a second budget affords — that comparison, not the
      input size alone, tells you which algorithm is worth coding.
    steps:
      - teach: >
          Reading the constraint "$n \le 10^{5}$" should instantly rule out
          $O(n^{2})$ and point toward $O(n\log n)$ — sizing a solution is a
          five-second calculation, not a guess made after coding something
          slow.
      - teach: >
          A processor executes on the order of $10^{8}$ to $10^{9}$ simple
          operations per second, and a typical time budget is around a second
          — so the total operation count a solution can afford is bounded by
          roughly that same $10^{8}$–$10^{9}$.
      - teach: >
          At $n = 10^{6}$, an $O(n)$ algorithm does about a million operations
          — milliseconds. An $O(n^{2})$ algorithm at the same $n$ does about
          $10^{12}$ operations, which takes hours: the same input size, two
          very different verdicts.
      - ask: >
          An algorithm does $O(n^{2})$ work. At $n = 10^{4}$, how many
          operations does that come out to?
        expects: "100000000"
        hint: >
          Square $10^{4}$.
        feedback: >
          $10^{4} \times 10^{4} = 10^{8} = 100{,}000{,}000$ operations — right
          at the edge of the roughly $10^{8}$-operations-per-second budget,
          which is exactly why $n \le 10^{4}$ is the rule-of-thumb cutoff for
          $O(n^{2})$.
      - teach: >
          The rule of thumb worth memorizing: $n$ up to about $10^{8}$
          tolerates $O(n)$ or $O(n\log n)$, $n$ up to about $10^{4}$ tolerates
          $O(n^{2})$, and $n$ up to about $20$–$25$ tolerates $O(2^{n})$.
      - ask: >
          At $n = 10^{6}$, which of these complexity classes is the one that
          will not finish within about a second?
        choices:
          - text: >
              $O(\log n)$
            feedback: >
              Trivially fast — about $20$ operations at this $n$, nowhere near
              the budget.
          - text: >
              $O(n)$
            feedback: >
              About a million operations, comfortably inside the roughly
              $10^{8}$–$10^{9}$ budget.
          - text: >
              $O(n\log n)$
            feedback: >
              About $2\times10^{7}$ operations — well under the budget.
          - text: >
              $O(n^{2})$
            correct: true
            feedback: >
              About $10^{12}$ operations, hours too slow — this is the one
              that fails at this $n$.
        feedback: >
          Reading $n$ off the problem and multiplying through each candidate
          complexity turns the abstract ladder into a concrete yes/no filter —
          $O(n^{2})$ is the only one here that misses the budget by orders of
          magnitude.
      - teach: >
          Estimate from the total operation count across the whole algorithm,
          not just the innermost loop in isolation — and treat the rule of
          thumb as a first filter, not a certificate: an $O(n\log n)$
          algorithm with a heavy hidden constant can still miss a tight limit
          right at the boundary.
      - ask: >
          An algorithm is $O(n\log n)$. At $n = 1024$, using $\log_{2}(1024) =
          10$, how many total operations is that?
        expects: "10240"
        hint: >
          Multiply $n$ by the number of levels, $\log_{2}(1024)$.
        feedback: >
          $1024 \times 10 = 10{,}240$ operations total — comfortably inside
          the budget, and a small fraction of the $10^{6}$ operations an
          $O(n^{2})$ pass over the same input would cost.
      - teach: >
          Converting an input bound into an actual operation count, then
          comparing it against the roughly $10^{8}$–$10^{9}$-per-second
          budget, is what tells you which algorithm is worth coding — not the
          input size by itself.

  - node: quant-programming.complexity.log-halving
    hook: >
      "How many comparisons does binary search need on a billion records"
      should be answered from memory of $2^{10}\approx10^{3}$, not a
      calculator — this is the one growth rate an interview expects you to
      estimate instantly.
    explanation: >
      $\log_{2} n$ counts how many times $n$ can be halved before reaching
      $1$ — concretely, the number of rounds a binary search needs to
      narrow a list of $n$ items down to one, and equivalently the depth of
      a balanced binary tree holding $n$ items. Both are the same halving
      process viewed two ways: each round, or each level down the tree,
      discards half of what's left.

      The mental shortcut worth memorizing is $2^{10}=1024\approx10^{3}$, so
      $\log_{2}(10^{3})\approx10$. Scaling by powers of $10^{3}$ then just
      adds $10$ each time: $\log_{2}(10^{6})\approx20$,
      $\log_{2}(10^{9})\approx30$, $\log_{2}(10^{12})\approx40$. The true
      values are slightly smaller ($19.9$, $29.9$, $39.9$) since $10^{3}$ is
      a touch more than $2^{10}$, but the estimate is accurate enough to
      size an algorithm live.

      This slow growth is why $\log n$ is treated as "practically constant"
      next to any polynomial term: multiplying the input by a thousand only
      adds about ten more halvings, so a $\log n$ factor sitting next to an
      $n$ or $n^{2}$ term almost never changes which algorithm is fast
      enough — it is the one growth rate an interview will rarely ask you to
      tighten further.
    worked: >
      How many comparisons does binary search need on a trillion sorted
      records ($n=10^{12}$)? Using $\log_{2}(10^{3})\approx10$ four times,
      $\log_{2}(10^{12})\approx4\times10=40$ comparisons — a data set a
      million times larger than a million-item list
      ($\log_{2}(10^{6})\approx20$) only costs twice as many comparisons,
      $40$ versus $20$, not a million times more.
    interview: >
      "If I have a billion sorted records, how many comparisons does binary
      search take" is meant to be answered in seconds using the
      $2^{10}\approx10^{3}$ shortcut, landing near $30$ — the interviewer is
      checking mental-math fluency with logarithms, not asking for the
      exact value $29.9$.
    pitfalls: >
      Confusing $\log_{2}$ with $\log_{10}$ changes the answer by a factor
      of about $3.32$ — always confirm which base a stated bound uses.
      Treating every logarithm as automatically negligible is also wrong
      when its argument is itself exponential, such as $\log(2^{n})=n$,
      which is linear, not small.
    recap: >
      $\log_{2} n$ is the halving count, estimated fast via
      $2^{10}\approx10^{3}$, and it grows so slowly that a thousand-fold
      larger input costs only about ten more comparisons.
    steps:
      - teach: >
          "How many comparisons does binary search need on a billion records"
          should be answered from memory of $2^{10}\approx10^{3}$, not a
          calculator — this is the one growth rate an interview expects
          estimated instantly.
      - teach: >
          $\log_{2} n$ counts how many times $n$ can be halved before reaching
          $1$ — the number of rounds a binary search needs, and equivalently
          the depth of a balanced binary tree holding $n$ items. Both are the
          same halving process viewed two ways.
      - teach: >
          The shortcut is $2^{10}=1024\approx10^{3}$, so
          $\log_{2}(10^{3})\approx10$. Scaling by powers of $10^{3}$ then just
          adds $10$ each time: $\log_{2}(10^{6})\approx20$,
          $\log_{2}(10^{9})\approx30$.
      - ask: >
          Using the shortcut $2^{10}\approx10^{3}$, roughly what is
          $\log_{2}(10^{15})$?
        expects: "50"
        tolerance: 0.5
        hint: >
          $10^{15}$ is $(10^{3})^{5}$ — five factors of the shortcut, each
          worth about $10$.
        feedback: >
          $5\times10=50$ by the shortcut (the true value is about $49.8$) —
          five factors of $10^{3}$, each costing about $10$ halvings.
      - teach: >
          This slow growth is why $\log n$ is treated as "practically
          constant" next to a polynomial term: multiplying the input by a
          thousand only adds about ten more halvings, which almost never
          changes which algorithm is fast enough.
      - ask: >
          If $n$ grows from $10^{6}$ to $10^{9}$ — a thousand-fold increase —
          what happens to $\log_{2} n$?
        choices:
          - text: >
              It multiplies by $1000$ too
            feedback: >
              That confuses $n$ itself with $\log_{2} n$ — the logarithm grows
              far slower than its argument.
          - text: >
              It increases by about $10$
            correct: true
            feedback: >
              Right — from about $20$ to about $30$, exactly the shortcut's
              $\log_{2}(10^{3})\approx10$ per factor of a thousand.
          - text: >
              It stays exactly the same
            feedback: >
              $\log_{2} n$ does grow, just very slowly — a thousand-fold input
              increase still adds roughly ten more halvings.
          - text: >
              It increases by about $3$
            feedback: >
              That is the change in $\log_{10} n$, not $\log_{2} n$ — mixing
              up the base changes the answer by a factor of about $3.32$.
        feedback: >
          $\log_{2} n$ grows by about $10$ for every factor-of-a-thousand
          increase in $n$ — the shortcut behind why a much larger input barely
          costs more.
      - teach: >
          Confusing $\log_{2}$ with $\log_{10}$ changes the answer by a factor
          of about $3.32$ — always confirm the base. And a logarithm is not
          automatically negligible when its argument is itself exponential:
          $\log(2^{n})=n$ is linear, not small.
      - ask: >
          $n = 2^{20}$ items, already an exact power of two. How many
          comparisons does binary search need — exactly, not estimated?
        expects: "20"
        hint: >
          The exponent itself is the halving count when $n$ is an exact power
          of two.
        feedback: >
          $\log_{2}(2^{20}) = 20$ exactly — no estimation needed once $n$ is a
          clean power of two.
      - teach: >
          $\log_{2} n$ is the halving count, estimated fast via
          $2^{10}\approx10^{3}$ and read off exactly whenever $n$ is a clean
          power of two — either way, it grows so slowly that scale barely
          matters.

  - node: quant-programming.complexity.divide-conquer-recurrence
    hook: >
      Recognizing $T(n)=aT(n/b)+f(n)$ inside recursive code you're handed
      live, and summing the recursion tree instead of guessing the answer,
      is what separates knowing merge sort is $n\log n$ from actually being
      able to analyze new recursive code.
    explanation: >
      The general move is the recursion tree: draw the levels of recursive
      calls, work out how many subproblems and what size sit at each level,
      add up the work done at that level, then sum across all
      $\log_{2} n$ levels — halving $n$ down to $1$ takes exactly that many
      rounds. Whether the total ends up dominated by the top level, the
      bottom level, or split evenly across all of them depends entirely on
      how the per-level work changes as the subproblems shrink.

      For merge sort's recurrence, $T(n)=2T(n/2)+O(n)$, every level does the
      same $O(n)$ total work — twice as many subproblems, each half the
      size, so the linear combine cost per level stays constant — and there
      are $\log_{2} n$ such levels, giving $O(n\log n)$ overall: work per
      level times number of levels, with no single level dominating.

      The same tree with a different combine cost tells a different story:
      cut the combine step to $O(1)$ per subproblem instead of $O(n)$ total,
      and the bottom level — the $n$ base cases, each doing $O(1)$ work —
      now dominates every level above it, collapsing the sum to $O(n)$
      rather than $O(n\log n)$. The branching and the halving fix the shape
      of the tree; the combine cost decides which part of it the total gets
      charged to.
    worked: >
      Binary search recurses as $T(n)=T(n/2)+O(1)$: one subproblem of half
      the size, constant work to decide which half to keep. At $n=1024$,
      the tree has $\log_{2}(1024)=10$ levels, and every level does $O(1)$
      work — a single comparison — rather than work proportional to the
      subproblem size, so the total is $10$ constant-time steps, giving
      $T(1024)=O(10)=O(\log_{2} n)$, the classic $O(\log n)$ bound rather
      than merge sort's $O(n\log n)$.
    interview: >
      "Solve this recurrence using the recursion tree, not the master
      theorem formula" is a common framing, since interviewers want the
      level-by-level counting argument, not a memorized name. Expect a
      follow-up that changes the combine cost or branching factor and asks
      how the total changes.
    pitfalls: >
      Applying $O(n\log n)$ to every divide-and-conquer recurrence
      regardless of the combine cost is the most common error — the combine
      cost decides whether the top, bottom, or every level dominates.
      Miscounting the number of levels, using $\log_{2} n$ when the split
      isn't exactly in half or being off by one at the base case, throws off
      the final constant.
    recap: >
      Sum the work level by level across the $\log_{2} n$ levels of the
      recursion tree; the combine cost per level, not the branching alone,
      decides whether the total lands on $O(n)$, $O(n\log n)$, or elsewhere.
    steps:
      - teach: >
          Recognizing $T(n)=aT(n/b)+f(n)$ inside recursive code handed to you
          live, and summing the recursion tree instead of guessing, is what
          separates knowing merge sort is $n\log n$ from being able to analyze
          new recursive code.
      - teach: >
          The recursion tree method: draw the levels of recursive calls, work
          out how many subproblems and what size sit at each level, add up the
          work done at that level, then sum across all levels.
      - teach: >
          Merge sort's recurrence is $T(n)=2T(n/2)+O(n)$. Every level does the
          same $O(n)$ total work — twice as many subproblems, each half the
          size, keeps the combine cost per level constant — and there are
          $\log_{2} n$ such levels.
      - ask: >
          For $T(n)=2T(n/2)+O(n)$ at $n=256$, how many levels does the
          recursion tree have?
        expects: "8"
        hint: >
          How many times can $256$ be halved before reaching $1$?
        feedback: >
          $\log_{2}(256)=8$ levels — halving $256$ down to $1$ takes exactly
          $8$ rounds, giving $8$ levels each doing $O(n)$ total work.
      - teach: >
          The combine cost, not the branching alone, decides which part of the
          tree the total gets charged to. Drop the combine step from $O(n)$ to
          $O(1)$ per subproblem, and the bottom level — the $n$ base cases,
          each doing $O(1)$ work — now dominates every level above it.
      - ask: >
          A divide-and-conquer algorithm splits into $2$ subproblems of size
          $n/2$ and does $O(1)$ work combining them, not $O(n)$. What is the
          total?
        choices:
          - text: >
              $O(n\log n)$, same as merge sort
            feedback: >
              That forgets the combine cost changed — merge sort's $O(n\log
              n)$ comes specifically from an $O(n)$ combine at every level.
          - text: >
              $O(\log n)$
            feedback: >
              That only counts the levels, ignoring that the bottom level
              alone has $n$ base cases to do.
          - text: >
              $O(n)$
            correct: true
            feedback: >
              Right — the bottom level's $n$ base cases, each $O(1)$, now
              dominate every level above them, collapsing the sum to $O(n)$.
          - text: >
              $O(n^{2})$
            feedback: >
              Nothing in this recurrence grows that fast — dropping the
              combine cost only ever shrinks the total, never grows it.
        feedback: >
          Whether the combine cost is linear or constant changes the whole
          answer: linear combine gives $O(n\log n)$, constant combine gives
          $O(n)$, from the exact same branching structure.
      - teach: >
          Applying $O(n\log n)$ to every divide-and-conquer recurrence
          regardless of the combine cost is the most common error. Miscounting
          the levels — using $\log_{2} n$ when the split is not exactly in
          half, or being off by one at the base case — throws off the final
          constant.
      - ask: >
          $T(n)=2T(n/2)+O(n)$ at $n=16$: each of the $\log_{2}(16)=4$ levels
          does about $n=16$ total work. What is the total operation count,
          level work times number of levels?
        expects: "64"
        hint: >
          Multiply the per-level work, $16$, by the number of levels, $4$.
        feedback: >
          $16\times4=64$, matching $T(n)=O(n\log n)$ — $n\log_{2} n =
          16\times4=64$ at $n=16$.
      - teach: >
          Sum the work level by level across the $\log_{2} n$ levels of the
          tree — the combine cost per level, not the branching alone, decides
          whether the total lands on $O(n)$, $O(n\log n)$, or somewhere else.

  - node: quant-programming.complexity.amortized
    hook: >
      "Is push_back $O(1)$?" is a trick question until you say the word
      "amortized" — a single call can cost $O(n)$, and the honest answer
      prices the whole sequence of calls, not any one of them.
    explanation: >
      The amortized cost of an operation is the total cost of some sequence
      of $n$ operations divided by $n$ — a statement about the whole
      sequence, not a promise about any individual call within it. This
      differs from "worst-case per operation," which bounds every single
      call separately, and from "average case," which is a claim about a
      probability distribution over random inputs. Amortized analysis needs
      no randomness at all: the guarantee is proved for every possible
      sequence, including one an adversary designs specifically to be
      expensive.

      The intuition is that occasional expensive operations are rare enough,
      relative to how many cheap operations preceded them, that spreading
      the expensive cost across the whole sequence still yields a small
      number per operation. A structure can have individual calls that cost
      $O(n)$ and still be $O(1)$ amortized, provided an expensive call is
      always preceded by enough cheap calls to absorb it — the total, not
      any single term, is what's bounded.

      The practical payoff is that "amortized $O(1)$" is a stronger and more
      useful claim than it sounds: it survives being called in a loop $n$
      times in a row, or in any order at all, because the bound was proved
      for the total across every sequence, not for a friendly one.
    worked: >
      A stack supports push ($O(1)$) and a multipop$(k)$ that removes up to
      $k$ elements in $O(\min(k,\text{size}))$ time. Do $1000$ pushes, then
      one multipop$(1000)$ that empties the whole stack: the multipop alone
      costs $1000$, an $O(n)$ single call. But across all $1001$ operations,
      total work is $1000$ pushes plus $1000$ pops inside the multipop,
      $=2000$, since no element is ever popped more than once no matter how
      the pops are distributed across calls. Dividing by $1001$ operations
      gives an amortized cost of about $2$ per operation — $O(1)$ — even
      though that one multipop call was far from cheap.
    interview: >
      "What's the amortized complexity of $n$ pushes and pops mixed
      together" is answered by bounding the *total* work across the
      sequence — here, each element is pushed once and popped at most once —
      and dividing by $n$, not by analyzing the worst single call. Naming
      this the "aggregate method" signals fluency.
    pitfalls: >
      Reporting the amortized bound as if it were also the worst-case-per-
      call bound erases real information — a single multipop or resize can
      still spike to $O(n)$. Treating "amortized" as a synonym for "average
      case" is the other common confusion; amortized holds for every
      sequence, deterministically, with no assumption about how the
      sequence is generated.
    recap: >
      Amortized cost totals the work across an entire sequence of
      operations and divides by the count, a guarantee that holds for every
      sequence — including adversarial ones — not just typical ones.
    steps:
      - teach: >
          "Is push_back $O(1)$?" is a trick question until you say the word
          "amortized" — a single call can cost $O(n)$, and the honest answer
          prices the whole sequence of calls, not any one of them.
      - teach: >
          The amortized cost of an operation is the total cost of some
          sequence of $n$ operations divided by $n$ — a statement about the
          whole sequence, not a promise about any individual call. It differs
          from "worst case per operation" (which bounds every single call
          separately) and from "average case" (a claim about randomness):
          amortized bounds hold for every sequence, including an adversarial
          one, with no randomness required.
      - teach: >
          A stack supports push, $O(1)$ each, and multipop$(k)$, which removes
          up to $k$ elements in $O(\min(k,\text{size}))$ time. A single
          multipop call can cost $O(n)$ by itself — but no element is ever
          popped more than once, no matter how the pops are spread across
          calls.
      - ask: >
          Push $50$ elements onto an empty stack, then call multipop$(50)$,
          which removes all $50$ in one call. What is the total work across
          all $51$ calls, counting each individual push and each individual
          pop the multipop performs?
        expects: "100"
        hint: >
          No element is popped more than once — count the pushes and the pops
          separately, then add.
        feedback: >
          $50$ pushes plus $50$ pops inside the one multipop call is $100$
          total units of work. Dividing by $51$ calls gives an amortized cost
          close to $2$ per operation — $O(1)$ — even though that one multipop
          call was far from cheap by itself.
      - teach: >
          This is the aggregate method: bound the total work across the entire
          sequence first — here, each element is pushed once and popped at
          most once — then divide by the number of operations, rather than
          trying to bound the worst single call.
      - ask: >
          Which claim correctly uses the word "amortized"?
        choices:
          - text: >
              Every individual push_back call costs $O(1)$
            feedback: >
              That is a worst-case-per-operation claim, not an amortized one —
              a single call that triggers a resize can still cost $O(n)$.
          - text: >
              Across any sequence of $n$ push_back calls, the total cost is
              $O(n)$, so each costs $O(1)$ amortized
            correct: true
            feedback: >
              Right — the guarantee is about the total across the sequence,
              divided by the count, and it holds for every sequence.
          - text: >
              On average, over random inputs, push_back costs $O(1)$
            feedback: >
              That describes average case, which needs a probability
              distribution over inputs. Amortized needs no randomness at all —
              it holds deterministically for every sequence.
          - text: >
              The single costliest push_back call is $O(1)$
            feedback: >
              False in general — a call that triggers a resize can cost $O(n)$
              by itself. Amortized says nothing about any one call.
        feedback: >
          Amortized cost is a statement about the total across an entire
          sequence, proved for every possible sequence — deterministically,
          with no assumption about how the sequence arose.
      - teach: >
          Reporting an amortized bound as if it were also a
          worst-case-per-call bound erases real information: individual calls
          can still spike. And "amortized" is not a synonym for "average case"
          — amortized holds for adversarial sequences too, not just typical
          ones.
      - ask: >
          A queue built from two stacks moves each element between the stacks
          at most twice over its lifetime — once in, once out — so a sequence
          of $n$ enqueue and dequeue calls does at most $2n$ total moves. What
          is the amortized cost per operation, in moves?
        expects: "2"
        hint: >
          Divide the total move bound, $2n$, by the number of operations, $n$.
        feedback: >
          $2n$ total moves across $n$ operations gives an amortized cost of
          $2n/n=2$ moves per operation — $O(1)$, by the same aggregate-method
          argument as the multipop stack, just applied to a different
          structure.
      - teach: >
          Amortized cost totals the work across an entire sequence of
          operations and divides by the count — a guarantee that holds for
          every sequence, including adversarial ones, not just typical ones.

  - node: quant-programming.complexity.doubling-worked
    hook: >
      This is the proof, not just the claim, that a dynamic array's push is
      $O(1)$ amortized — reproducing the geometric-series argument live is
      what the interviewer is actually checking for.
    explanation: >
      The proof is nothing more than summing a geometric series. Resizes
      happen at capacities $1,2,4,\dots,2^{k-1}$, and the resize at capacity
      $2^{i}$ copies exactly $2^{i}$ elements, so after $n$ pushes the total
      copying work is $1+2+4+\cdots+2^{k-1}$, a geometric series bounded
      above by $2\cdot2^{k-1}\le2n$. Total work across all $n$ pushes is
      then at most the $n$ pushes themselves plus $2n$ copies, both $O(n)$,
      so the amortized cost per push — total work divided by $n$ — is
      $O(1)$.

      The multiplicative growth is not incidental — it's what makes the
      series geometric rather than arithmetic. Growing the capacity by a
      fixed additive amount $c$ each time instead of doubling forces about
      $n/c$ resizes, and the copy cost at each resize grows linearly with
      the current size, so total copying becomes $\Theta(n^{2}/c)$ —
      quadratic in $n$ for fixed $c$ — giving $\Theta(n/c)$ amortized per
      push, not $O(1)$. Doubling keeps the resize count logarithmic while
      the copy sizes form a geometric series summing to $O(n)$; additive
      growth keeps the resize count linear and loses the bound entirely.

      The growth factor doesn't have to be exactly $2$ — any fixed factor
      greater than $1$ (a common choice is $1.5$) yields the same
      geometric-series argument and the same $O(1)$ amortized bound, just
      with a different constant baked into the $O$.
    worked: >
      Push $100$ elements onto an array that starts at capacity $1$ and
      doubles on overflow. Resizes trigger when capacity $1,2,4,8,16,32,64$
      each fill up, copying $1,2,4,8,16,32,64$ elements respectively — a
      total of $127$ copies across $7$ resizes, safely under the $2n=200$
      bound the geometric series guarantees, even though $n=100$ isn't a
      clean power of $2$. Total work including the $100$ pushes themselves
      is $227$, giving an amortized cost per push of $227/100\approx2.27$.
    interview: >
      "Prove push_back is amortized $O(1)$, don't just state it" wants the
      geometric-series sum reproduced, ending in an explicit bound like
      $\le2n$ total copies — citing "it's a well-known fact" without the sum
      reads as not knowing it.
    pitfalls: >
      Growing capacity by a fixed additive amount instead of a
      multiplicative factor breaks the bound entirely, turning $O(1)$
      amortized into $\Theta(n)$ amortized — this is the most common wrong
      "optimization." Adding a shrink-on-underflow rule that halves capacity
      as soon as the array is half empty can also break the bound:
      alternating one push and one pop right at that threshold forces a
      resize on every operation, so any shrink policy needs a wider
      hysteresis band, such as shrinking only at one-quarter full, to stay
      $O(1)$ amortized.
    recap: >
      Summing the geometric series of resize costs bounds total copying by
      roughly $2n$ over $n$ pushes — proof, not assertion, that doubling
      gives $O(1)$ amortized inserts, and only multiplicative growth earns
      that bound.
    steps:
      - teach: >
          This is the proof, not just the claim, that a dynamic array's push
          is $O(1)$ amortized — reproducing the geometric-series argument live
          is what the interviewer is actually checking for.
      - teach: >
          Resizes happen at capacities $1,2,4,\dots,2^{k-1}$, and the resize
          at capacity $2^{i}$ copies exactly $2^{i}$ elements. Total copying
          work after $n$ pushes is a geometric series, $1+2+4+\cdots+2^{k-1}$,
          bounded above by $2\cdot2^{k-1}\le2n$.
      - teach: >
          Push $1024$ elements onto an array starting at capacity $1$ and
          doubling on overflow. Resizes trigger at capacities
          $1,2,4,\dots,512$ — ten resizes, each copying the entire current
          capacity.
      - ask: >
          For $n=1024$ pushes with resizes at capacities $1,2,4,\dots,512$,
          what is the total number of elements copied across all the resizes?
        expects: "1023"
        hint: >
          Sum the geometric series $1+2+4+\cdots+512$.
        feedback: >
          $1+2+4+\cdots+512=1023$ — one less than $1024$, the next power of
          two — comfortably under the $2n=2048$ bound the series guarantees.
      - teach: >
          The multiplicative growth is what makes the series geometric.
          Growing capacity by a fixed additive amount $c$ instead forces about
          $n/c$ resizes, each copying up to size $n$, so total copying becomes
          $\Theta(n^{2}/c)$ — quadratic — giving $\Theta(n/c)$ amortized per
          push, not $O(1)$.
      - ask: >
          An array grows capacity by a fixed $+100$ elements each time it
          fills, instead of doubling. What is the amortized cost per push?
        choices:
          - text: >
              $O(1)$, same as doubling
            feedback: >
              Additive growth breaks the geometric-series bound entirely —
              this is the most common wrong optimization.
          - text: >
              $\Theta(n)$
            correct: true
            feedback: >
              Right — about $n/100$ resizes, each copying up to size roughly
              $n$, gives $\Theta(n^{2})$ total copying, so $\Theta(n)$
              amortized per push.
          - text: >
              $\Theta(\log n)$
            feedback: >
              That would be the level count of a halving process, not the
              resize count of additive growth.
          - text: >
              $\Theta(n^{2})$
            feedback: >
              That is the total copying work across the whole sequence, not
              the amortized cost per push — divide by $n$ to get the per-push
              figure.
        feedback: >
          Only multiplicative growth keeps the resize count logarithmic while
          the copy sizes form a geometric series summing to $O(n)$ — additive
          growth keeps the resize count linear and loses the bound entirely.
      - teach: >
          A shrink-on-underflow rule that halves capacity as soon as the array
          is exactly half empty can also break the bound: alternating one push
          and one pop right at that threshold forces a resize on every single
          operation. A wider hysteresis band, shrinking only at one-quarter
          full, is needed to stay $O(1)$ amortized.
      - ask: >
          For $n=16$ pushes, resizes trigger at capacities $1,2,4,8$, copying
          $1+2+4+8=15$ elements in total. Including the $16$ pushes
          themselves, what is the total work, in element-operations, across
          the whole sequence?
        expects: "31"
        hint: >
          Add the $16$ pushes to the $15$ copies.
        feedback: >
          $16$ pushes $+15$ copies $=31$ total operations, giving an amortized
          cost of $31/16\approx1.94$ per push — still $O(1)$.
      - teach: >
          Summing the geometric series of resize costs bounds total copying by
          roughly $2n$ over $n$ pushes — proof, not assertion, that doubling
          gives $O(1)$ amortized inserts, and only multiplicative growth earns
          that bound.

  - node: quant-programming.complexity.space-time-tradeoff
    hook: >
      "Can you do better?" after you've stated an $O(n)$-per-query solution
      is almost always answered by spending memory to precompute — naming
      the trade explicitly is faster than reinventing it live.
    explanation: >
      Many "can we go faster" answers are not new algorithmic insight so
      much as a decision to remember something instead of recomputing it —
      memory spent now to buy time back later. The question that decides
      whether the trade pays off is how many times the precomputed
      information will actually be used: build a structure once at $O(n)$
      or $O(n\log n)$ cost and query it once, and the setup cost never
      amortizes; build it once and query it many times, and the one-time
      cost is paid back many times over.

      The recurring instances share this shape. A hash table spends $O(n)$
      memory to turn repeated $O(n)$ scans into $O(1)$ expected lookups.
      Memoization spends memory to turn repeated recomputation of the same
      subproblem into a single computation plus free lookups thereafter. A
      prefix-sum array spends $O(n)$ memory and $O(n)$ one-time
      preprocessing to turn every future range-sum query into $O(1)$
      instead of $O(n)$ per query. None of these change what's computable —
      they change who pays for the computation and when.

      When an interviewer follows a working solution with "what if memory
      isn't a constraint," that's usually the cue to reach for exactly this
      trade rather than a cleverer algorithm — the honest answer is often
      that no free lunch exists, only a choice about which resource to
      spend.
    worked: >
      An array of $n=10^{6}$ elements needs to answer $q=1000$ range-sum
      queries. Naive per-query summing costs $O(n)$ each, about
      $1000\times10^{6}=10^{9}$ total operations — on the order of several
      seconds, likely too slow. Building a prefix-sum array first costs
      $O(n)$ once, about $10^{6}$ operations, and each query then costs
      $O(1)$, about $1000$ operations total — roughly $1.001\times10^{6}$
      operations overall, close to a thousand times fewer than the naive
      total, at the cost of one extra array of size $n$.
    interview: >
      "I need to answer many range-sum queries against a fixed array — can
      you speed this up?" is the canonical prompt; the interviewer listens
      for "precompute prefix sums" named immediately, along with the $O(n)$
      preprocessing plus $O(1)$-per-query cost stated explicitly, not just
      "yes, use extra memory."
    pitfalls: >
      Reaching for precomputation when there's only one or two queries
      wastes the setup cost for no payoff — the trade only wins when the
      number of reuses is large enough to amortize it. Assuming the
      underlying data stays static is the other trap: if updates interleave
      with range queries, a plain prefix-sum array needs a full $O(n)$
      rebuild per update, and a Fenwick tree or segment tree is the
      structure that actually handles both operations in $O(\log n)$.
    recap: >
      Precomputing or caching turns repeated $O(n)$ work into $O(1)$
      lookups at the cost of memory, and the trade only pays off once the
      precomputed answer is reused enough times to amortize the setup.
    steps:
      - teach: >
          "Can you do better?" after you've stated an $O(n)$-per-query
          solution is almost always answered by spending memory to precompute
          — naming the trade explicitly is faster than reinventing it live.
      - teach: >
          The general shape: pay a one-time setup cost — often $O(n)$ memory
          and $O(n)$ or $O(n\log n)$ preprocessing — to turn repeated
          expensive operations into cheap ones. Whether the trade pays off
          depends entirely on how many times the precomputed result gets
          reused.
      - teach: >
          A prefix-sum array is the clean instance: $O(n)$ preprocessing once
          turns every future range-sum query into $O(1)$, instead of $O(n)$
          per query answered from scratch.
      - ask: >
          An array has $n=2000$ elements and needs to answer $q=500$ range-sum
          queries. Building a prefix-sum array first costs $O(n)$ once and
          $O(1)$ per query after. Roughly how many total operations does that
          cost — preprocessing plus all the queries?
        expects: "2500"
        hint: >
          Add the one-time preprocessing cost to the per-query cost times the
          number of queries.
        feedback: >
          $2000$ (preprocessing) $+500\times1=500$ (queries) $=2500$ total
          operations — versus $500\times2000=1{,}000{,}000$ operations for
          summing each query directly with no preprocessing.
      - teach: >
          Hash tables ($O(n)$ memory for $O(1)$ expected lookups instead of an
          $O(n)$ scan) and memoization (caching instead of recomputing) share
          the same shape as prefix sums: none of these change what is
          computable — they change who pays for the computation, and when.
      - ask: >
          You need to answer exactly $1$ range-sum query against an array of
          $n$ elements, never again. Is it worth precomputing a prefix-sum
          array first?
        choices:
          - text: >
              Yes — $O(1)$ queries are always faster than $O(n)$ ones
            feedback: >
              This ignores that building the prefix-sum array itself costs
              $O(n)$ — the same order as just computing the one answer
              directly.
          - text: >
              No — with only one use, the $O(n)$ setup costs the same order as
              computing the answer directly, so precomputing buys nothing
            correct: true
            feedback: >
              Right — the trade only pays off once the setup cost is amortized
              across enough reuses, and one query never crosses that bar.
          - text: >
              Yes — prefix sums only take $O(\log n)$ to build
            feedback: >
              Building a prefix-sum array is $O(n)$, not $O(\log n)$ — this
              misstates the setup cost.
          - text: >
              No — prefix sums only work on arrays that never change
            feedback: >
              That is a real limitation of prefix sums, but it is not why a
              single query fails to justify precomputing here.
        feedback: >
          The trade only pays off once the number of reuses is large enough to
          amortize the one-time setup — a single query never crosses that bar,
          regardless of how cheap each individual query becomes afterward.
      - teach: >
          Reaching for precomputation with only a handful of queries wastes
          the setup for no payoff. And assuming the data stays static is the
          other trap — if updates interleave with queries, a plain prefix-sum
          array needs a full $O(n)$ rebuild per update.
      - ask: >
          A hash table replaces $O(n)$ linear scans with expected $O(1)$
          lookups, at the cost of $O(n)$ memory to build it once. For
          $n=10^{5}$ elements and $q=10^{5}$ lookups, roughly how many total
          operations does the hash-table approach cost — build once, then one
          step per lookup?
        expects: "200000"
        hint: >
          Add the one-time build cost to the per-lookup cost times the number
          of lookups.
        feedback: >
          $10^{5}$ (build) $+10^{5}\times1$ (lookups) $=2\times10^{5}$ total —
          versus $10^{5}\times10^{5}=10^{10}$ for repeated linear scans, the
          entire point of paying the memory up front.
      - teach: >
          Precomputing or caching turns repeated $O(n)$ work into $O(1)$
          lookups at the cost of memory, and the trade only pays off once the
          precomputed answer is reused enough times to amortize the setup.

  - node: quant-programming.complexity.hashing-cost
    hook: >
      Answering "hash map lookup is $O(1)$" without the word "expected"
      invites the obvious follow-up — "what if every key hashes to the same
      bucket" — and losing that exchange is a common way to lose the round.
    explanation: >
      Expected $O(1)$ is a direct application of linearity of expectation.
      With $m$ buckets and $n$ keys hashed uniformly at random, the expected
      number of other keys landing in any one fixed bucket is $n/m$, the
      load factor $\alpha$ — sum an indicator for "key $j$ collides with key
      $i$'s bucket" over all other keys, and
      $\mathbb{E}[\text{work per operation}]$ is $O(1+\alpha)$: one step to
      compute the hash, plus an expected $\alpha$ steps scanning whatever
      else landed in that bucket.

      Keeping $\alpha$ itself bounded is what keeps this $O(1)$ rather than
      growing with $n$: rehashing into a larger table once the load factor
      crosses a threshold, the same doubling idea behind dynamic arrays,
      caps $\alpha$ at a constant, so expected work per insert, lookup, or
      delete stays $O(1)$ regardless of how large the table eventually
      grows.

      This is also exactly the birthday problem in different clothes: a
      collision — two keys landing in the same bucket — is the same event
      as two people sharing a birthday, with buckets playing the role of
      days, so a collision becomes likely far earlier than "the table is
      nearly full" suggests, roughly once $\sqrt{m}$ keys are inserted.
      And the expectation itself is over a random or well-distributed hash
      function; an adversary who chooses keys that collide under a known,
      weak hash forces every operation into a real $\Theta(n)$, since the
      guarantee never claimed anything about a specific worst-case input.
    worked: >
      A table has $m=1000$ buckets and $n=700$ keys inserted, load factor
      $\alpha=0.7$. The expected number of other keys sharing any given
      bucket is $\alpha=0.7$, so an unsuccessful lookup, scanning the whole
      bucket, costs an expected $1+\alpha=1.7$ comparisons, and a
      successful lookup costs an expected $1+\alpha/2=1.35$ comparisons —
      both $O(1)$ constants, nowhere near the $700$ comparisons a
      worst-case single bucket could in principle force.
    interview: >
      "What's the time complexity of a hash map lookup, and when does it
      break" wants "expected $O(1)$, assuming a reasonable hash function and
      a bounded load factor via rehashing" stated cold, followed immediately
      by "worst case is $O(n)$, under an adversarial hash or a
      hash-flooding attack" without being prompted for it.
    pitfalls: >
      Saying plain "$O(1)$" without the word "expected" or "average"
      answers a different, false claim. Assuming a language's default hash
      function is collision-resistant against a deliberately crafted input
      is also wrong — many built-in hashes are fast but not adversarially
      safe, which is exactly how hash-flooding denial-of-service attacks
      work.
    recap: >
      Hash table operations are expected $O(1)$ because the expected bucket
      occupancy is the load factor, a constant kept bounded by rehashing —
      not a worst-case guarantee, and collisions stay common well before
      the table fills.
    steps:
      - teach: >
          Answering "hash map lookup is $O(1)$" without the word "expected"
          invites the obvious follow-up — "what if every key hashes to the
          same bucket" — and losing that exchange is a common way to lose the
          round.
      - teach: >
          Expected $O(1)$ is linearity of expectation applied to buckets. With
          $m$ buckets and $n$ keys hashed uniformly, the expected number of
          other keys sharing any fixed bucket is $n/m$, the load factor
          $\alpha$, so $\mathbb{E}[\text{work per operation}]$ is
          $O(1+\alpha)$.
      - teach: >
          Keeping $\alpha$ bounded is what keeps this $O(1)$ rather than
          growing with $n$: rehashing into a larger table once the load factor
          crosses a threshold — the same doubling idea behind dynamic arrays —
          caps $\alpha$ at a constant no matter how large the table eventually
          grows.
      - ask: >
          A table has $m=500$ buckets and $n=250$ keys inserted uniformly at
          random. What is the load factor $\alpha$?
        expects: "0.5"
        hint: >
          $\alpha$ is the number of keys divided by the number of buckets.
        feedback: >
          $\alpha=n/m=250/500=0.5$, so the expected work per lookup is
          $O(1+\alpha)=O(1.5)$ — still $O(1)$.
      - ask: >
          Which statement about hash table lookups is correct?
        choices:
          - text: >
              Lookup is always $O(1)$, full stop
            feedback: >
              This drops the word expected — it is a different, false claim
              about the worst case.
          - text: >
              Lookup is expected $O(1)$ assuming a reasonable hash and a
              bounded load factor, but $O(n)$ in the worst case
            correct: true
            feedback: >
              Right — the expectation is over a random or well-distributed
              hash function, and it says nothing about a specific adversarial
              input.
          - text: >
              Lookup is $\Theta(\log n)$, like a balanced tree
            feedback: >
              That describes a different structure — a hash table's lookup
              cost tracks the load factor, not $\log n$.
          - text: >
              Lookup is $O(1)$ only once the table is completely full
            feedback: >
              Backwards — a nearly full table is exactly when collisions, and
              lookup cost, are highest.
        feedback: >
          "Expected $O(1)$, worst case $O(n)$" is the complete, honest answer
          — dropping either half answers a different question.
      - teach: >
          This is the birthday problem in different clothes: a collision — two
          keys sharing a bucket — becomes likely far earlier than "the table
          is nearly full" suggests, roughly once $\sqrt{m}$ keys are inserted.
          And an adversary who chooses keys that collide under a known, weak
          hash forces every operation to a real $\Theta(n)$.
      - ask: >
          With $m=10{,}000$ buckets, roughly how many insertions, using
          $k\approx1.2\sqrt{m}$, give a $50\%$ chance of some collision?
        expects: "120"
        hint: >
          Take the square root of the bucket count, then scale by $1.2$.
        feedback: >
          $\sqrt{10{,}000}=100$, so $k\approx1.2\times100=120$ — a tiny
          fraction of the $10{,}000$ buckets, showing the birthday effect
          kicks in early.
      - teach: >
          Hash table operations are expected $O(1)$ because the expected
          bucket occupancy is the load factor, a constant kept bounded by
          rehashing — not a worst-case guarantee, and collisions stay common
          well before the table fills.

  - node: quant-programming.complexity.hash-collision-scale
    hook: >
      "There are four billion buckets, so collisions won't happen" is
      exactly the wrong intuition this node corrects — the safe insertion
      count scales with the square root of the bucket count, not the
      bucket count itself.
    explanation: >
      The birthday approximation says the probability of at least one
      collision among $k$ items hashed uniformly into $m$ buckets crosses
      $50\%$ once $k\approx1.2\sqrt{m}$ — the safe insertion count scales
      with the square root of the bucket count, not linearly with it. This
      is the same identity behind "$23$ people for even odds of a shared
      birthday" ($m=365$, $\sqrt{365}\approx19$, times $1.2$ gives about
      $23$), just applied to hash buckets instead of calendar days.

      The square-root scaling has a sharp practical consequence: doubling
      the number of bits in a hash squares the bucket count $m$, which
      squares the safe insertion count along with it. Going from a $32$-bit
      hash to a $64$-bit hash multiplies the safe count by
      $2^{16}=65{,}536$, since
      $\sqrt{2^{64}}/\sqrt{2^{32}}=2^{32}/2^{16}=2^{16}$ — not merely
      doubling how many items you can hash safely.

      This is why content hashes, UUID schemes, and deduplication systems at
      real scale reach for $64$- or $128$-bit outputs rather than $32$: at
      $128$ bits, the safe insertion count is on the order of
      $\sqrt{2^{128}}=2^{64}\approx1.8\times10^{19}$, a number no realistic
      system will ever insert that many items to reach, while at $32$ bits
      it's only in the tens of thousands — five orders of magnitude below
      the bucket count itself.
    worked: >
      A $64$-bit hash has $m=2^{64}\approx1.8\times10^{19}$ buckets. Using
      $k\approx1.2\sqrt{m}$, $\sqrt{2^{64}}=2^{32}\approx4.3\times10^{9}$, so
      $k\approx1.2\times4.3\times10^{9}\approx5.2\times10^{9}$ — about
      $5.2$ billion insertions before a $50\%$ chance of collision, versus
      the $32$-bit case's roughly $77{,}000$. Doubling the hash width from
      $32$ to $64$ bits multiplied the safe insertion count by
      $2^{16}=65{,}536$, close to the ratio
      $5.2\times10^{9}/77{,}000\approx67{,}500$ predicted, up to the
      rounding baked into the $1.2$ constant.
    interview: >
      "If I switch from a $32$-bit to a $64$-bit hash for deduplication,
      how many more items can I safely hash?" wants the $\sqrt{m}$
      reasoning reproduced live, landing on "roughly $2^{16}$ times more,"
      not a memorized number pulled from nowhere.
    pitfalls: >
      Reasoning linearly — "$m$ is huge, so collisions are essentially
      impossible" — ignores that the safe count only grows as $\sqrt{m}$.
      Treating the $50\%$ threshold as a hard floor is also wrong: a
      collision can occur far earlier than $1.2\sqrt{m}$ insertions, just
      with lower probability, and the approximation itself assumes a
      genuinely uniform hash, which a weak or clustering hash function does
      not provide.
    recap: >
      Safe insertion count before a coin-flip chance of collision scales as
      $\sqrt{m}$, so doubling a hash's bit width squares the bucket count
      and multiplies the safe count by $2^{16}$ — the reason real
      deduplication systems use $64$- or $128$-bit hashes, not $32$.
    steps:
      - teach: >
          "There are four billion buckets, so collisions won't happen" is
          exactly the wrong intuition here — the safe insertion count scales
          with the square root of the bucket count, not the bucket count
          itself.
      - teach: >
          The birthday approximation: the probability of at least one
          collision among $k$ items hashed into $m$ buckets crosses $50\%$
          once $k\approx1.2\sqrt{m}$ — growing with the square root of the
          bucket count, not linearly with it.
      - teach: >
          This is the same identity behind the classic "$23$ people for even
          odds of a shared birthday": with $m=365$ days,
          $\sqrt{365}\approx19$, and $1.2\times19\approx23$ — the calendar
          version of the same square-root scaling.
      - ask: >
          Using $k\approx1.2\sqrt{m}$ with $m=365$ days, how many people give
          roughly even odds of a shared birthday (nearest whole number)?
        expects: "23"
        tolerance: 0.5
        hint: >
          Take the square root of $365$, then scale by $1.2$.
        feedback: >
          $\sqrt{365}\approx19.1$, so $k\approx1.2\times19.1\approx23$ —
          despite $365$ possible birthdays, even odds of a match need barely
          two dozen people.
      - teach: >
          Doubling the number of bits in a hash squares the bucket count $m$,
          which squares the safe insertion count along with it. Going from a
          $32$-bit hash to a $64$-bit hash multiplies the safe count by
          $2^{16}=65{,}536$, not merely doubling it.
      - ask: >
          Going from a $40$-bit hash to an $80$-bit hash — doubling the bit
          width — multiplies the safe collision-free insertion count by
          roughly:
        choices:
          - text: >
              $2$
            feedback: >
              This confuses doubling the bit width with doubling the safe
              count — the scaling is far steeper than that.
          - text: >
              $2^{20}$
            correct: true
            feedback: >
              Right: $\sqrt{2^{80}}/\sqrt{2^{40}}=2^{40}/2^{20}=2^{20}$ — the
              bucket count $m$ squares, and so does its square root's growth
              factor.
          - text: >
              $2^{40}$
            feedback: >
              That is the growth factor of the bucket count $m$ itself, not of
              the safe insertion count, which scales as $\sqrt{m}$.
          - text: >
              No real change
            feedback: >
              Bit width drives both $m$ and the safe count — doubling it
              changes the safe count by a huge factor, not none.
        feedback: >
          The safe count scales as $\sqrt{m}$, so doubling the bit width
          (which squares $m$) squares the safe count too — here,
          $2^{40/2}=2^{20}$, over a million times more insertions before the
          same $50\%$ collision risk.
      - teach: >
          Reasoning linearly — "$m$ is huge, so collisions are essentially
          impossible" — ignores that the safe count only grows as $\sqrt{m}$.
          And the $50\%$ threshold is not a hard floor: a collision can occur
          far earlier, just with lower probability.
      - ask: >
          With $m=2^{16}=65{,}536$ buckets — a toy $16$-bit hash — roughly how
          many insertions, using $k\approx1.2\sqrt{m}$, give even odds of a
          collision (nearest whole number)?
        expects: "307"
        tolerance: 1
        hint: >
          $\sqrt{65{,}536}$ is a clean whole number — take it, then scale by
          $1.2$.
        feedback: >
          $\sqrt{65{,}536}=256$ exactly, so $k\approx1.2\times256=307.2$ — a
          $16$-bit hash collides after only a few hundred insertions, which is
          exactly why real deduplication systems reach for far more bits.
      - teach: >
          Safe insertion count before a coin-flip chance of collision scales
          as $\sqrt{m}$, so doubling a hash's bit width squares the bucket
          count and multiplies the safe count by a huge factor — the reason
          real systems use $64$- or $128$-bit hashes, not $32$.

  - node: quant-programming.complexity.floating-point
    hook: >
      "Why doesn't $0.1+0.2$ equal $0.3$ in code" is asked to separate
      candidates who know this is a structural fact about binary
      representation from those who've only memorized it as a language
      quirk to work around.
    explanation: >
      A double stores a number as sign times mantissa times a power of two
      — a binary fraction, not a decimal one. Numbers that are exact finite
      sums of powers of two, like $0.5=2^{-1}$, store exactly. Almost every
      decimal fraction is not such a sum: $1/10$ in binary is an infinitely
      repeating fraction, exactly the way $1/3$ repeats forever in decimal,
      so it gets truncated once the mantissa's $52$ bits run out — a small
      representation error baked in before any arithmetic even runs.

      $52$ mantissa bits give roughly $15$–$17$ significant decimal digits
      of precision, not infinite precision, and that small per-number error
      can compound across repeated operations into something visibly wrong,
      which is the entire content of $0.1+0.2$ evaluating to
      $0.30000000000000004$: each operand was already slightly off before
      the addition, and the addition simply reveals it in the digits that
      print.

      None of this is a bug specific to one language or a fixable rounding
      mistake — it is a structural fact about representing base-$10$
      fractions in base $2$, true of every system built on IEEE 754 doubles.
      No floating-point computation should be trusted to land on an exact
      decimal value, ever, regardless of which language or library produced
      it.
    worked: >
      How large can an integer get before a double can no longer represent
      it exactly? The $52$-bit mantissa plus an implicit leading bit gives
      $53$ bits of integer precision, so every integer up to
      $2^{53}=9{,}007{,}199{,}254{,}740{,}992$ is exact, but
      $2^{53}+1=9{,}007{,}199{,}254{,}740{,}993$ has no exact double
      representation and silently rounds down to $2^{53}$ itself — the
      mantissa has run out of bits to encode the odd final digit.
    interview: >
      "Why doesn't $0.1+0.2$ equal $0.3$" is the canonical opener; a
      sharper follow-up, "can a double represent every integer exactly, and
      up to what value," tests whether you know the $2^{53}$ boundary
      rather than only the decimal-fraction symptom.
    pitfalls: >
      Treating this as a bug in one particular language misses that it's
      IEEE 754, universal across virtually every mainstream language.
      Assuming more printed decimal digits "fixes" the problem is also
      wrong — the stored binary value itself is what's imprecise,
      formatting only changes how many of the wrong digits get displayed.
    recap: >
      Doubles store binary fractions with about $15$–$17$ significant
      decimal digits, so most decimal fractions, and every integer above
      $2^{53}$, have no exact representation — a structural fact, not a
      rounding bug.
    steps:
      - teach: >
          "Why doesn't $0.1+0.2$ equal $0.3$ in code" separates candidates who
          know this is a structural fact about binary representation from
          those who've only memorized it as a quirk to work around.
      - teach: >
          A double stores a number as sign times mantissa times a power of two
          — a binary fraction, not a decimal one. Numbers that are exact
          finite sums of powers of two, like $0.5=2^{-1}$, store exactly;
          almost every decimal fraction does not.
      - teach: >
          $1/10$ in binary is an infinitely repeating fraction, the same way
          $1/3$ repeats forever in decimal, so it gets truncated once the
          mantissa's $52$ bits run out — a small representation error baked in
          before any arithmetic even runs. That is the entire content of
          $0.1+0.2$ printing as $0.30000000000000004$.
      - ask: >
          Which best explains why $0.1+0.2$ does not print as exactly $0.3$ in
          most languages?
        choices:
          - text: >
              It is a rounding bug in the addition operator, fixable by using
              a different operator
            feedback: >
              The addition itself is exact given its inputs — the imprecision
              was already present in how $0.1$ and $0.2$ are stored.
          - text: >
              $0.1$ and $0.2$ are each already stored as slightly-off binary
              approximations before the addition ever runs
            correct: true
            feedback: >
              Right — neither operand is exact to begin with, so their sum
              simply reveals the error that was already there.
          - text: >
              The processor's arithmetic circuit is imprecise for decimal
              numbers
            feedback: >
              The arithmetic on the stored binary values is exact — the
              imprecision is entirely in how those decimal values were
              represented in the first place.
          - text: >
              It only happens for negative numbers
            feedback: >
              The effect is unrelated to sign — it happens for any decimal
              fraction without an exact finite binary representation.
        feedback: >
          The addition is exact given its inputs; the imprecision is baked in
          earlier, the moment $0.1$ and $0.2$ get stored as the nearest
          representable binary fractions.
      - teach: >
          None of this is a bug specific to one language — it is a structural
          fact about representing base-$10$ fractions in base $2$, true of
          every system built on IEEE 754 doubles. No floating-point
          computation should be trusted to land on an exact decimal value.
      - ask: >
          A double's $52$-bit mantissa carries an implicit leading bit on top.
          How many total bits of integer precision does that give?
        expects: "53"
        hint: >
          Add the implicit leading bit to the $52$ stored mantissa bits.
        feedback: >
          $52+1=53$ bits of integer precision — every integer up to $2^{53}$
          is exact, and the mantissa runs out of room the moment an integer
          needs a $54$th bit.
      - teach: >
          Treating this as a bug in one particular language misses that it is
          IEEE 754, universal across virtually every mainstream language.
          Printing more decimal digits does not fix it either — the stored
          binary value itself is imprecise; formatting only changes how many
          of the wrong digits get displayed.
      - ask: >
          $52$ mantissa bits correspond to roughly how many significant
          decimal digits, using $\log_{10}2\approx0.301$ (round to the nearest
          whole number)?
        expects: "16"
        tolerance: 0.6
        hint: >
          Multiply the bit count by $\log_{10}2\approx0.301$.
        feedback: >
          $52\times0.301\approx15.65$, close to $16$ — consistent with the
          "$15$–$17$ significant decimal digits" figure, since each mantissa
          bit is worth about $0.3$ of a decimal digit.
      - teach: >
          Doubles store binary fractions with about $15$–$17$ significant
          decimal digits, so most decimal fractions, and every integer above
          $2^{53}$, have no exact representation — a structural fact, not a
          rounding bug.

  - node: quant-programming.complexity.cancellation-tolerance
    hook: >
      "What's wrong with this comparison, or this running total" is a
      recurring live-review prompt, and the answer is almost always one of
      three linked floating-point traps — spotting which one fast is the
      actual skill.
    explanation: >
      Catastrophic cancellation happens when two nearly equal floats are
      subtracted: their matching leading digits cancel exactly, leaving
      only the trailing, least-reliable digits to make up the entire
      result. The absolute error in each operand stays roughly the same
      size, but now that fixed error sits on top of a much smaller answer,
      so the *relative* error explodes. The fix is algebraic, not
      numerical: rewrite the expression into an equivalent form that never
      subtracts two near-equal quantities, the way $\sqrt{x+1}-\sqrt{x}$
      becomes $1/(\sqrt{x+1}+\sqrt{x})$ by multiplying by the conjugate.

      Testing floats for exact equality is a related failure: roundoff
      means even a mathematically true identity typically differs by around
      $10^{-16}$ relative error once computed, so testing $a = b$ exactly is
      almost never the right check. Test $|a-b|<\varepsilon$ instead, with $\varepsilon$
      scaled to the magnitude of $a$ and $b$ — a fixed absolute tolerance is
      too loose for tiny numbers and too tight for huge ones.

      Summation order is the third trap: floating-point addition rounds to
      the precision of the larger operand, so adding a tiny value into an
      already-large running sum can discard it completely rather than just
      losing a few digits of it. Summing in ascending order, smallest
      first, lets small values accumulate with each other before meeting
      the large ones; Kahan summation achieves the same protection for a
      true one-pass stream by tracking the low-order bits an addition drops
      in a separate compensating accumulator.
    worked: >
      Sum one hundred copies of $10^{-8}$ into a running total starting at
      $10^{8}$. Adding each $10^{-8}$ individually, largest-first: near
      $10^{8}$, a double's smallest representable increment is around
      $3\times10^{-8}$, so each addition of $10^{-8}$ rounds away
      completely and the running total stays exactly
      $100{,}000{,}000.0$, losing all $100\times10^{-8}=10^{-6}$ of the true
      sum. Summing the hundred small values first gives exactly $10^{-6}$,
      above that representable increment, and adding it once to $10^{8}$
      gives $100{,}000{,}000.000001$ — the correct answer, recovered purely
      by reordering.
    interview: >
      "What's wrong with this loop that sums an array" is standard; the
      interviewer listens for whichever of the three traps applies —
      cancellation, exact-equality, or summation order — named specifically,
      not a general "floating point is imprecise" answer.
    pitfalls: >
      Rewriting a cancellation-prone expression without checking that the
      new form doesn't introduce cancellation somewhere else. Choosing a
      fixed absolute epsilon for equality tests regardless of the numbers'
      scale, rather than a relative tolerance. Assuming a full sort before
      summing is free — it costs $O(n\log n)$ and isn't possible on a true
      single-pass stream, which is exactly when Kahan summation earns its
      extra bookkeeping.
    recap: >
      Nearly-equal subtraction, exact equality tests, and large-before-
      small summation are the three ways floating point quietly discards
      precision, each fixed by a different, specific technique rather than
      "being careful."
    steps:
      - teach: >
          "What's wrong with this comparison, or this running total" is a
          recurring live-review prompt, and the answer is almost always one of
          three linked floating-point traps — spotting which one fast is the
          actual skill.
      - teach: >
          Catastrophic cancellation: subtracting two nearly equal floats
          cancels their matching leading digits, leaving only the least
          reliable trailing digits to make up the whole answer. The fix is
          algebraic — rewrite the expression so it never subtracts two
          near-equal quantities, the way $\sqrt{x+1}-\sqrt{x}$ becomes
          $1/(\sqrt{x+1}+\sqrt{x})$ by multiplying by the conjugate.
      - ask: >
          Using the rewritten, cancellation-free form
          $1/(\sqrt{x+1}+\sqrt{x})$ with $x=10^{8}$, what is the value of
          $\sqrt{x+1}-\sqrt{x}$ (to two significant figures)?
        expects: "0.00005"
        tolerance: 0.000001
        hint: >
          $\sqrt{x}=10000$ exactly; $\sqrt{x+1}$ is barely larger. Add the two
          and take the reciprocal.
        feedback: >
          $\sqrt{x}=10000$ and $\sqrt{x+1}\approx10000.00005$, so
          $1/(10000+10000.00005)\approx0.00005$ — computing this by directly
          subtracting the two nearly equal square roots in double precision
          loses most of the significant digits once $x$ is this large.
      - teach: >
          Testing floats for exact equality is a related failure: roundoff
          means even a mathematically true identity typically differs by
          around $10^{-16}$ relative error once computed. Test
          $|a-b|<\varepsilon$ instead, with $\varepsilon$ scaled to the
          magnitude of $a$ and $b$.
      - ask: >
          Which is the safest way to check whether two floats $a$ and $b$ are
          "equal"?
        choices:
          - text: >
              Compare them with exact equality
            feedback: >
              Roundoff means even a mathematically true identity typically
              differs by around $10^{-16}$ relative error once computed —
              exact equality almost never holds.
          - text: >
              Check $|a-b|<\varepsilon$, with $\varepsilon$ scaled to the
              magnitude of $a$ and $b$
            correct: true
            feedback: >
              Right — a relative tolerance stays meaningful whether $a$ and
              $b$ are tiny or huge.
          - text: >
              Check $|a-b|<10^{-9}$, always, regardless of how large $a$ and
              $b$ are
            feedback: >
              A fixed absolute tolerance is too loose for tiny numbers and too
              tight for huge ones — it needs to scale with magnitude.
          - text: >
              Round both to the nearest integer, then compare
            feedback: >
              That discards all fractional information, which is usually
              exactly what the comparison needs to preserve.
        feedback: >
          A relative tolerance, scaled to the size of the numbers being
          compared, is the only one of these that stays correct across both
          tiny and huge magnitudes.
      - teach: >
          Summation order is the third trap: floating-point addition rounds to
          the precision of the larger operand, so adding a tiny value into an
          already-large running sum can discard it completely. Summing
          ascending, smallest first, or using Kahan summation for a true
          one-pass stream, avoids the loss.
      - ask: >
          Sum one hundred copies of $10^{-11}$ into a running total that
          starts at $10^{6}$, adding each one individually, largest-first.
          Near $10^{6}$, a double's smallest representable step is far larger
          than $10^{-11}$. What does the running total equal after all one
          hundred additions?
        expects: "1000000"
        hint: >
          Compare the size of each increment to the smallest step a double can
          represent near $10^{6}$.
        feedback: >
          Each addition of $10^{-11}$ is far below the roughly $10^{-10}$ step
          a double can represent near $10^{6}$, so every individual addition
          rounds away completely and the running total stays exactly
          $1{,}000{,}000$ — summing the small values together first is what
          recovers them.
      - teach: >
          Nearly-equal subtraction, exact equality tests, and
          large-before-small summation are the three ways floating point
          quietly discards precision, each fixed by a different, specific
          technique rather than "being careful."

  - node: quant-programming.complexity.integer-overflow
    hook: >
      "Find the bug in this binary search" is a recurring live-coding
      prompt, and the bug is almost always the midpoint line — spotting it
      before running the code is what the exercise is actually testing.
    explanation: >
      A signed $32$-bit integer holds $-2^{31}$ to $2^{31}-1$, roughly
      $\pm2.1\times10^{9}$. Exceeding that range overflows, and unlike an
      arbitrary-precision type, most fixed-width $32$-bit types don't raise
      an error at the moment it happens — the value silently wraps, or in
      some languages invokes undefined behavior, so the bug surfaces later
      as a quietly wrong answer rather than a crash at the source.

      The classic instance is binary search's midpoint: computing
      $(\text{low}+\text{high})/2$ can overflow even when neither
      $\text{low}$ nor $\text{high}$ individually exceeds the $32$-bit
      range, because their *sum* can still cross it. The fix,
      $\text{low}+(\text{high}-\text{low})/2$, never adds two large values
      together — it only ever adds a small difference to $\text{low}$, so
      the intermediate quantity stays small regardless of how large
      $\text{low}$ and $\text{high}$ are individually.

      The general habit this teaches is checking every intermediate
      computation, not just the final return value, for whether it could
      plausibly cross about two billion — a running sum of counts, a sum of
      squares, or a product of two moderately large inputs are the
      recurring culprits, and a wrapped value is not obviously wrong on
      inspection; it's still a valid-looking number, just the wrong one.
    worked: >
      Counting all ordered pairs among $n=100{,}000$ items as $n\times n$ in
      a $32$-bit int: the true value is $n^{2}=10^{10}$, exceeding
      $2^{31}-1\approx2.147\times10^{9}$ by roughly $4.7\times$. Reducing
      modulo $2^{32}=4{,}294{,}967{,}296$, the wraparound point,
      $10^{10}-2\times4{,}294{,}967{,}296=1{,}410{,}065{,}408$ — the
      computation would silently return $1{,}410{,}065{,}408$ instead of
      $10{,}000{,}000{,}000$, a perfectly plausible-looking positive number
      that's off by nearly an order of magnitude, with no error raised
      anywhere.
    interview: >
      "Count all pairs among $n=100{,}000$ items — what's the complexity,
      and is there an implementation trap" wants both the $O(n^{2})$ sizing
      and the overflow trap named unprompted, with "accumulate in a 64-bit
      type" offered as the fix.
    pitfalls: >
      Assuming the language raises an error on overflow — most compiled,
      statically typed languages wrap or invoke undefined behavior silently
      instead. Checking only the final return value for plausibility while
      an earlier intermediate expression, like $\text{low}+\text{high}$ or
      $n\times n$, is what actually overflowed. Declaring only the final
      result variable as a wider $64$-bit type while the expression that
      computes it is still evaluated in $32$-bit arithmetic before being
      widened.
    recap: >
      Signed $32$-bit integers overflow past about $2.1$ billion silently,
      not with an error, which is exactly why binary search's midpoint is
      written as $\text{low}+(\text{high}-\text{low})/2$ instead of
      $(\text{low}+\text{high})/2$.
    steps:
      - teach: >
          "Find the bug in this binary search" is a recurring live-coding
          prompt, and the bug is almost always the midpoint line — spotting it
          before running the code is what the exercise is actually testing.
      - teach: >
          A signed $32$-bit integer holds $-2^{31}$ to $2^{31}-1$, roughly
          $\pm2.1\times10^{9}$. Exceeding it overflows, and most fixed-width
          types don't raise an error at the moment it happens — the value
          silently wraps, or invokes undefined behavior, so the bug surfaces
          later as a quietly wrong answer.
      - teach: >
          Binary search's classic bug: $(\text{low}+\text{high})/2$ can
          overflow even when neither $\text{low}$ nor $\text{high}$
          individually exceeds the $32$-bit range, because their sum can still
          cross it. The fix, $\text{low}+(\text{high}-\text{low})/2$, never
          adds two large values together.
      - ask: >
          Binary search has $\text{low}=1{,}500{,}000{,}000$ and
          $\text{high}=1{,}800{,}000{,}000$ — both individually well under the
          $32$-bit signed limit of about $2.1$ billion, but their sum exceeds
          it. Using the safe formula $\text{low}+(\text{high}-\text{low})/2$,
          what midpoint does that give?
        expects: "1650000000"
        hint: >
          Subtract $\text{low}$ from $\text{high}$ first, halve that, then add
          $\text{low}$ back — no large sum ever appears.
        feedback: >
          $(\text{high}-\text{low})/2=(1{,}800{,}000{,}000-1{,}500{,}000{,}000)/2=150{,}000{,}000$,
          plus $\text{low}=1{,}500{,}000{,}000$ gives $1{,}650{,}000{,}000$ —
          the correct midpoint, computed without ever forming the sum
          $\text{low}+\text{high}=3{,}300{,}000{,}000$, which itself exceeds
          the $32$-bit signed range.
      - teach: >
          Check every intermediate computation, not just the final return
          value, for whether it could plausibly cross about two billion — a
          running sum of counts, a sum of squares, or a product of two
          moderately large inputs are the recurring culprits. A wrapped value
          is not obviously wrong on inspection; it is still a valid-looking
          number, just the wrong one.
      - ask: >
          Which of these is most likely to silently overflow a $32$-bit signed
          integer during computation?
        choices:
          - text: >
              Adding two loop counters, each under $1000$
            feedback: >
              Far too small — nowhere near the roughly $2.1$ billion limit.
          - text: >
              Multiplying two inputs, each up to $100{,}000$
            correct: true
            feedback: >
              Right — the product can reach $10^{10}$, far exceeding the
              $32$-bit signed range of about $2.1\times10^{9}$.
          - text: >
              Storing an array index for a $500$-element array
            feedback: >
              Trivially small — nowhere close to overflowing.
          - text: >
              Counting the number of true values in a $1000$-element boolean
              array
            feedback: >
              The count can be at most $1000$ — far too small to overflow.
        feedback: >
          Multiplying two moderately large inputs is the classic silent
          overflow: neither input looks dangerous on its own, but their
          product can cross the $32$-bit signed range by orders of magnitude.
      - teach: >
          Assuming the language raises an error on overflow is a common trap —
          most compiled, statically typed languages wrap or invoke undefined
          behavior silently instead. Declaring only the final result variable
          as a wider $64$-bit type while the expression that computes it still
          evaluates in $32$-bit arithmetic first is another.
      - ask: >
          Counting all ordered pairs among $n=50{,}000$ items as $n\times n$
          stored in a $32$-bit int: the true value is
          $n^{2}=2{,}500{,}000{,}000$, which fits in $32$ unsigned bits but
          exceeds the signed range of $2{,}147{,}483{,}647$, so the sign bit
          ends up set. Interpreting that bit pattern as signed two's
          complement — subtracting $2^{32}=4{,}294{,}967{,}296$ from the true
          value — what does the wrapped computation report?
        expects: "-1794967296"
        hint: >
          Subtract $4{,}294{,}967{,}296$ from $2{,}500{,}000{,}000$.
        feedback: >
          $2{,}500{,}000{,}000-4{,}294{,}967{,}296=-1{,}794{,}967{,}296$ — a
          perfectly plausible-looking negative number, silently wrong by
          nearly an order of magnitude from the true count, with no error
          raised anywhere.
      - teach: >
          Signed $32$-bit integers overflow past about $2.1$ billion silently,
          not with an error, which is exactly why binary search's midpoint is
          written as $\text{low}+(\text{high}-\text{low})/2$ instead of
          $(\text{low}+\text{high})/2$.
