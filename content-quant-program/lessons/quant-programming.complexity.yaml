unit: quant-programming.complexity
opening: >
  Complexity is the currency of every interview algorithm question: before
  writing a line of code you size the solution against the input bound, and
  every design choice afterward is priced in this vocabulary. This unit
  builds that vocabulary in order: Big-O/Ω/Θ as the formal grammar, the
  growth ladder that turns an input size into a go/no-go verdict, why
  logarithms are practically free and where they come from, the
  recursion-tree argument behind n log n, amortized analysis and the
  doubling array that is its canonical proof, the space-time tradeoff that
  motivates caching and hashing, hashing's expected O(1) and the
  birthday-shaped caveat behind it, and finally the two silent failure modes
  — floating-point representation error and integer overflow — that
  correct-looking code can still fall into. By the end you should be able to
  look at an input bound and immediately name the complexity class it
  demands, and to spot the line of code where a float comparison or a
  32-bit sum is about to lie to you.
lessons:
  - node: quant-programming.complexity.big-o
    hook: >
      "What's the complexity of this loop" is graded on whether you state
      the tight bound or just any valid upper bound — conflating $O$ with
      $\Theta$ is the fastest way to look like you're pattern-matching
      syntax rather than reasoning about growth.
    explanation: >
      Asymptotic notation exists because counting exact instructions is both
      intractable and beside the point — what matters for sizing a solution
      is how cost scales as the input grows, not the constant overhead of
      one particular machine or language. $O$, $\Omega$, and $\Theta$
      formalize "scales like" at three different strengths: $f=O(g)$ only
      claims $f$ never grows faster than $g$ past some point, $f=\Omega(g)$
      only claims $f$ never grows slower, and $f=\Theta(g)$ pins the growth
      rate exactly by requiring both bounds to hold with possibly different
      constants.

      This is why $O$ alone can be a loose claim: linear search is
      truthfully $O(n^{2})$, since $n \le c\cdot n^{2}$ for $c=1$ and all
      $n\ge1$, even though that bound wastes information. Interviewers
      asking for "the complexity" almost always want the tight $\Theta$
      bound, and a good habit is to state both — an algorithm doing
      $\Theta(n)$ work is trivially also $O(n)$, $O(n^{2})$, and so on.

      Reducing a formula to its complexity class means dropping every
      additive lower-order term and every multiplicative constant, keeping
      only the fastest-growing piece — constants and lower-order terms shift
      the crossover point $n_{0}$ and the witnesses $c_{1}, c_{2}$, but never
      the growth class itself. And unless stated otherwise, "the complexity"
      defaults to worst case: quicksort is loosely called $O(n\log n)$, but
      its honest worst-case bound is $\Theta(n^{2})$.
    worked: >
      Take $f(n) = n^{2} + 10n$. For a lower bound, $f(n) \ge n^{2}$ for
      every $n\ge1$, so $c_{1}=1$ works. For an upper bound, once $n\ge1$,
      $10n \le 10n^{2}$, so $f(n) \le 11n^{2}$, giving $c_{2}=11$. Both hold
      from $n_{0}=1$ onward, so $f(n)=\Theta(n^{2})$ with witnesses
      $c_{1}=1$, $c_{2}=11$, $n_{0}=1$. Checking at $n=10$: $f(10)=200$,
      which sits between $n^{2}=100$ and $11n^{2}=1100$ exactly as the
      bounds predict.
    interview: >
      Expect "what's the time complexity of this function" over actual
      code, with a follow-up "is that tight, or just an upper bound" to
      check whether you know $O$ and $\Theta$ are different claims. State
      the answer as a $\Theta$ bound with the dominant term named, and be
      ready to justify dropping the lower-order terms and constants.
    pitfalls: >
      Reporting an $O$ bound as if it were automatically tight — $O(n^{2})$
      means "quadratic or better," not "quadratic." Quoting an average-case
      bound (quicksort's $O(n\log n)$) as *the* complexity without noting
      the worst case is $\Theta(n^{2})$ is the other common slip.
    recap: >
      $O$, $\Omega$, and $\Theta$ are upper, lower, and tight growth bounds
      up to a constant factor, found by dropping constants and lower-order
      terms and keeping only the fastest-growing piece.
    dialogue:
      - part: Two routines and a benchmark
        teach: >
          Two routines answer the same question about a book of $n$ trades.
          Routine A costs $4n^{2}$ steps. Routine B does a fixed setup of
          $5000$ steps and then $200$ steps per trade, $200n + 5000$ in all.
          A colleague benchmarks both on $10$ trades.
      - ask: >
          At $n = 10$, how many more steps does B take than A?
        expects: "6600"
        feedback: >
          A costs $4 \cdot 10^{2} = 400$ and B costs $200 \cdot 10 + 5000 =
          7000$, so B takes $7000 - 400 = 6600$ more steps — about $17$ times
          as many. On this benchmark A looks like the clear winner.
      - ask: >
          What is the smallest $n$ at which A costs more than B?
        expects: "69"
        hint: >
          Solve $4n^{2} = 200n + 5000$, which is $n^{2} - 50n - 1250 = 0$,
          then test the whole numbers on either side of the root.
        feedback: >
          The root is $(50 + \sqrt{2500 + 5000})/2 \approx 68.3$. Check both
          sides: at $n = 68$, A costs $18496$ and B costs $18600$, so A is
          still cheaper; at $n = 69$, A costs $19044$ and B costs $18800$.
          From $69$ trades on, B is cheaper, and the gap only widens.
      - ask: >
          The real book has $10^{6}$ trades. Which routine do you want?
        choices:
          - text: >
              A — it won the benchmark by a factor of $17$.
            feedback: >
              At $10^{6}$ trades A costs $4 \times 10^{12}$ steps and B about
              $2 \times 10^{8}$: B is $20000$ times cheaper. A benchmark at
              $n = 10$ measured the $5000$-step setup, not how either routine
              scales.
          - text: >
              It depends on the hardware; run A on a faster machine.
            feedback: >
              Make A's machine $100$ times faster, so it costs $0.04n^{2}$.
              The crossover moves from $69$ to about $5025$ trades, but at
              $10^{6}$ A still costs $4 \times 10^{10}$ against B's
              $2 \times 10^{8}$. Faster hardware moves the crossover; it does
              not change who wins.
          - text: >
              B — past $69$ trades it is cheaper, and the ratio keeps growing.
            correct: true
            feedback: >
              Right. The ratio of A's cost to B's tends to $4n^{2}/(200n) =
              n/50$, which grows without bound, so no constant can rescue A.
        feedback: >
          At large $n$ the verdict is decided by the shape of each cost —
          $n^{2}$ against $n$ — and not by the $4$, the $200$ or the $5000$.

      - part: What the verdict ignores
        reflect: >
          A machine's speed rescales every cost by a constant, and B's setup
          only matters while $n$ is small. Write a precise meaning for "B's
          cost grows no faster than $n$" that stays true on any machine and
          says nothing at all about small $n$.
        hint: >
          You may scale $n$ by any constant you like, and you may start
          checking from any point you like.
        answer: >
          There is some constant $c$ and some starting size $n_{0}$ such that
          B's cost is at most $c \cdot n$ for every $n \ge n_{0}$. The
          constant $c$ swallows machine speed and per-step overhead; the
          starting point $n_{0}$ lets you ignore the small sizes where the
          setup dominates. Neither has to be the best possible — it is enough
          that some pair exists.
      - teach: >
          That is Big-O: $f(n) = O(g(n))$ when some $c > 0$ and $n_{0}$ give
          $f(n) \le c\,g(n)$ for all $n \ge n_{0}$. The pair $(c, n_{0})$ is
          called a witness. Flip the inequality to $f(n) \ge c\,g(n)$ and you
          have $\Omega$, a lower bound; ask for both at once and you have
          $\Theta$, a tight bound.
      - ask: >
          Prove B's cost is $O(n)$ with $n_{0} = 1$. What is the smallest
          constant $c$ for which $200n + 5000 \le c\,n$ holds at every
          $n \ge 1$?
        expects: "5200"
        hint: >
          Divide both sides by $n$ and ask where the left side is largest.
        feedback: >
          Dividing by $n$ gives $200 + 5000/n \le c$. The left side shrinks as
          $n$ grows, so it is largest at $n = 1$, where it is $5200$. Hence
          $c = 5200$.
      - ask: >
          Now start checking from $n_{0} = 100$ instead. What is the smallest
          $c$ that works for every $n \ge 100$?
        expects: "250"
        feedback: >
          The worst point is now $n = 100$: $200 + 5000/100 = 250$. A later
          start buys a smaller constant. Both $(5200, 1)$ and $(250, 100)$ are
          valid witnesses — the definition only asks that one exists, which is
          exactly why the $5000$ setup cannot change the class.

      - part: Upper, lower, tight
        ask: >
          Is it true that $200n + 5000 = O(n^{2})$?
        choices:
          - text: >
              No: the cost is linear, so its bound is $n$, not $n^{2}$.
            feedback: >
              $O$ is only a ceiling. Since $n \le n^{2}$ for $n \ge 1$, the
              witness $(5200, 1)$ already gives $200n + 5000 \le 5200n \le
              5200n^{2}$. The statement is true; it just throws information
              away.
          - text: >
              Yes — true, but a loose ceiling.
            correct: true
            feedback: >
              Right. Anything that is $O(n)$ is also $O(n^{2})$, $O(n^{3})$ and
              $O(2^{n})$; the useful answer is the lowest true ceiling.
          - text: >
              Only once $n$ passes $5000$, where the setup stops dominating.
            feedback: >
              The witness $(5200, 1)$ works from $n = 1$. Where the setup stops
              dominating affects which constant you need, not whether the
              bound holds.
        feedback: >
          $O$ says "no faster than". To say "exactly this fast" you need the
          lower bound as well.
      - ask: >
          A routine costs $n^{2}/2 - 30n$ steps. To show it is
          $\Omega(n^{2})$ you try $c = 1/4$. What is the smallest $n_{0} \ge 1$
          from which $n^{2}/2 - 30n \ge n^{2}/4$ holds for every larger $n$?
        expects: "120"
        hint: >
          Move $n^{2}/4$ across and compare what is left with $30n$.
        feedback: >
          The inequality is $n^{2}/4 \ge 30n$, that is $n \ge 120$. At
          $n = 120$ both sides are $3600$. A subtracted lower-order term does
          not spoil a lower bound; it only pushes $n_{0}$ out.
      - ask: >
          A teammate writes "B is $\Theta(n^{2})$, since it is $O(n^{2})$."
          What exactly is wrong?
        choices:
          - text: >
              The $O(n^{2})$ half is false.
            feedback: >
              That half is true, with witness $(5200, 1)$. The claim fails on
              the other half.
          - text: >
              Nothing: $\Theta$ is just a stricter way of writing $O$.
            feedback: >
              $\Theta$ is $O$ and $\Omega$ together, and the $\Omega$ half has
              to be checked separately. Here it fails.
          - text: >
              The $\Omega(n^{2})$ half fails: no $c > 0$ keeps
              $200n + 5000 \ge c\,n^{2}$ for all large $n$.
            correct: true
            feedback: >
              Right. Divide by $n^{2}$: $200/n + 5000/n^{2}$ tends to $0$, so
              it drops below any $c > 0$. Even $c = 0.01$ fails from about
              $n = 20025$ on.
        feedback: >
          B is $O(n^{2})$ and not $\Omega(n^{2})$, so not $\Theta(n^{2})$ —
          one clause holds and one fails. Its tight bound is $\Theta(n)$.

      - part: Which case the answer is about
        ask: >
          A scan walks the book looking for the first trade above a price
          limit and stops there. On some books it checks one trade; on others
          it checks all $n$. Asked "what is its complexity?", what do you say?
        choices:
          - text: >
              $\Theta(1)$, since it can stop on the first trade.
            feedback: >
              That is the best case. Unless the question says otherwise, "the
              complexity" means the worst case, and a book with no trade above
              the limit forces all $n$ checks.
          - text: >
              $O(n^{2})$, to be safe.
            feedback: >
              True and loose. An interviewer will follow up with "is that
              tight?", and the honest answer is no.
          - text: >
              $\Theta(n)$ in the worst case, and $\Theta(1)$ in the best.
            correct: true
            feedback: >
              Right. Name the case and give the tight bound for it: the worst
              case is exactly $n$ checks, which is both $O(n)$ and $\Omega(n)$.
        feedback: >
          Said aloud: "worst case $\Theta(n)$ — one pass, constants dropped."
          Naming the case and the tight bound together is what the question is
          checking.

  - node: quant-programming.complexity.growth-ranking
    hook: >
      Reading the constraint "$n \le 10^{5}$" should instantly rule out
      $O(n^{2})$ and point you at $O(n\log n)$ — sizing a solution is a
      five-second mental calculation, not a guess made after coding
      something slow.
    explanation: >
      The ladder only becomes useful once anchored to real hardware: a
      processor executes on the order of $10^{8}$ to $10^{9}$ simple
      operations per second, and a typical interview or contest time budget
      is around a second, so the total operation count you can afford is
      bounded by roughly that same $10^{8}$–$10^{9}$. Reading the input
      bound $n$ off the problem and asking "how many operations does each
      candidate complexity actually produce at this $n$" turns the abstract
      ladder into a concrete yes/no filter before any code gets written.

      The rule of thumb worth memorizing: $n$ up to about $10^{8}$ tolerates
      $O(n)$ or $O(n\log n)$, $n$ up to about $10^{4}$ tolerates $O(n^{2})$,
      and $n$ up to about $20$–$25$ tolerates $O(2^{n})$. These thresholds
      come directly from plugging $n$ into each growth function and
      comparing against the operation budget — $O(n^{2})$ at $n=10^{4}$ is
      $10^{8}$ operations, right at the edge, while at $n=10^{6}$ it is
      $10^{12}$, hours too slow.

      Treat this as a first filter, not a certificate: constants matter at
      the boundary (an $O(n\log n)$ algorithm with a heavy constant can
      still miss a tight limit), and the count has to reflect total work
      across the whole algorithm, not just the innermost loop in isolation.
    worked: >
      A problem allows $n$ up to $10^{5}$ and a roughly one-second limit. An
      $O(n^{2})$ approach does about $(10^{5})^{2}=10^{10}$ operations — at
      $10^{8}$ operations per second that's on the order of $100$ seconds,
      far too slow. An $O(n\log n)$ approach does about
      $10^{5}\times\log_{2}(10^{5}) \approx 10^{5}\times17 = 1.7\times10^{6}$
      operations, comfortably under $0.1$ seconds — the sizing alone points
      you at a sort-based or divide-and-conquer method before writing a line
      of nested loops.
    interview: >
      "The input can be up to $n=10^{5}$ — what complexity do you need" is
      asked directly to see whether you reason from the constraint to the
      algorithm class before coding, rather than coding first and
      discovering a timeout. Naming the operation-count arithmetic out loud
      is the expected answer, not a memorized table.
    pitfalls: >
      Estimating from the innermost loop alone instead of the total
      operation count across the whole run understates the true cost.
      Trusting the rule of thumb exactly at the boundary without accounting
      for constant factors — an $O(n\log n)$ algorithm with a large hidden
      constant can still fail a tight limit even when the class looks safe.
    recap: >
      Convert the input bound $n$ into an actual operation count for each
      candidate complexity and compare it against the roughly $10^{8}$–
      $10^{9}$ operations a second budget affords — that comparison, not the
      input size alone, tells you which algorithm is worth coding.
    dialogue:
      - part: Four million IDs, two approaches
        teach: >
          An interviewer hands you $n = 4 \times 10^{6}$ order IDs and asks
          whether any two are equal. Your machine does about $10^{8}$ simple
          operations per second. Approach 1 compares every pair. Approach 2
          sorts the IDs, about $n\log_{2} n$ operations, then checks
          neighbours.
      - ask: >
          Approach 1 makes about $n^{2}/2$ comparisons. How many seconds is
          that at $10^{8}$ operations per second?
        expects: "80000"
        hint: >
          Square $4 \times 10^{6}$ first, then halve it.
        feedback: >
          $n^{2}/2 = (16 \times 10^{12})/2 = 8 \times 10^{12}$ comparisons,
          and $8 \times 10^{12}/10^{8} = 80000$ seconds — about $22$ hours.
      - ask: >
          Approach 2 costs about $n\log_{2} n$. How many seconds is that, to
          two decimal places?
        expects: "0.88"
        tolerance: 0.02
        hint: >
          $\log_{2} 10^{6} \approx 19.93$, and $4 = 2^{2}$.
        feedback: >
          $\log_{2}(4 \times 10^{6}) = 2 + 19.93 = 21.93$, so the sort costs
          about $4 \times 10^{6} \cdot 21.93 \approx 8.8 \times 10^{7}$
          operations, or $0.88$ seconds. The neighbour check adds another
          $4 \times 10^{6}$, which changes nothing.
      - ask: >
          A colleague proposes running Approach 1 on a machine $100$ times
          faster. Does that rescue it?
        choices:
          - text: >
              Yes: a hundredfold speedup covers almost any gap.
            feedback: >
              $80000/100 = 800$ seconds, over $13$ minutes, against Approach
              2's $0.88$ seconds on the slow machine. The gap was a factor of
              about $90000$, and $100$ covers very little of it.
          - text: >
              No: hardware cannot make an $O(n^{2})$ algorithm any faster.
            feedback: >
              It can, by exactly the factor of $100$ — $800$ seconds instead
              of $80000$. What hardware cannot do is change the class, so the
              factor it buys is fixed while the gap grows with $n$.
          - text: >
              No: it still takes over $13$ minutes, about $900$ times slower
              than Approach 2 on the old machine.
            correct: true
            feedback: >
              Right. The ratio of the two costs is about $n/(2\log_{2} n)
              \approx 90000$ here, and it keeps growing with $n$; a constant
              speedup only divides it once.
        feedback: >
          At this $n$ the gap between two rungs of the ladder dwarfs anything
          a constant factor can buy.

      - part: Turning a bound into a verdict
        reflect: >
          Most problems state only a bound on $n$, before you have any
          algorithm. Using the $10^{8}$-per-second budget, how could you turn
          that bound into a verdict on which complexity classes are worth
          trying at all?
        hint: >
          Run the calculation you just did backwards.
        answer: >
          Invert it. With roughly $10^{8}$ to $10^{9}$ operations in a
          one-second budget, ask of each class how large $n$ can be before
          $g(n)$ passes the budget. That gives one cutoff per rung of the
          ladder, and the stated bound on $n$ then tells you which rungs are
          still on the table before you write any code.
      - teach: >
          That inversion is the growth ladder, timed. At $10^{8}$–$10^{9}$
          operations a second, $n$ up to about $10^{8}$ tolerates $O(n)$ or
          $O(n\log n)$, $n$ up to about $10^{4}$ tolerates $O(n^{2})$, and $n$
          up to about $20$–$25$ tolerates $O(2^{n})$. The cutoffs are not
          folklore; each is one line of arithmetic.
      - ask: >
          What is the largest $n$ for which $n^{2}$ stays within $10^{8}$
          operations?
        expects: "10000"
        feedback: >
          $n^{2} \le 10^{8}$ gives $n \le 10^{4} = 10000$. That is where the
          quadratic rung's cutoff comes from.
      - ask: >
          A brute force over all subsets of $n$ items spends $n$ steps on each
          subset, so it costs $n \cdot 2^{n}$. What is the largest $n$ that
          stays within $10^{8}$ operations?
        expects: "22"
        hint: >
          $2^{20} \approx 1.05 \times 10^{6}$. Try $n = 22$ and $n = 23$.
        feedback: >
          At $n = 22$: $22 \cdot 2^{22} = 22 \cdot 4194304 \approx 9.2 \times
          10^{7}$, inside the budget. At $n = 23$: $23 \cdot 8388608 \approx
          1.9 \times 10^{8}$, over it. Each extra item doubles the cost, which
          is why the exponential rung ends in the low twenties whatever the
          hardware.

      - part: Reading a constraint
        ask: >
          A problem caps $n$ at $3000$. Your first idea is a triple loop,
          $n^{3}$ operations. How many seconds does that take at $10^{8}$ per
          second?
        expects: "270"
        feedback: >
          $3000^{3} = 2.7 \times 10^{10}$ operations, and $2.7 \times
          10^{10}/10^{8} = 270$ seconds. An $n^{2}$ method does $9 \times
          10^{6}$, under a tenth of a second: the cap of $3000$ is telling you
          to aim for quadratic.
      - ask: >
          Another problem caps $n$ at $18$. What is the constraint most
          likely telling you?
        choices:
          - text: >
              Nothing much; a small $n$ just keeps the tests fast.
            feedback: >
              A setter who wanted a polynomial solution would allow $n$ in the
              thousands. A bound this low is chosen on purpose.
          - text: >
              That an exponential search over subsets is acceptable.
            correct: true
            feedback: >
              Right. $2^{18} = 262144$ subsets, and even $18 \cdot 2^{18}
              \approx 4.7 \times 10^{6}$ operations is instant. The bound is
              the hint.
          - text: >
              That even $O(n^{2})$ is too slow, so you need $O(n)$.
            feedback: >
              $18^{2} = 324$ operations. Small bounds never rule out a class;
              they rule them in.
        feedback: >
          Read the bound before the problem: around $10^{5}$ to $10^{6}$ means
          $O(n\log n)$, a few thousand means $O(n^{2})$, and about $20$ means
          exponential is fine.

      - part: Where the filter misleads
        ask: >
          A candidate with $n = 10^{6}$ says: "My inner loop is a binary
          search, $O(\log n)$, so my solution is fast." The binary search runs
          once for every pair of elements. What is the honest verdict?
        choices:
          - text: >
              Fast: $\log_{2} 10^{6} \approx 20$ comparisons per search.
            feedback: >
              Twenty comparisons per search, times $5 \times 10^{11}$ pairs, is
              $10^{13}$ operations — over a day. The cost of the innermost loop
              is not the cost of the program.
          - text: >
              Too slow: the total is about $n^{2}\log n$, roughly $10^{13}$
              operations.
            correct: true
            feedback: >
              Right. Multiply through every enclosing loop: $n^{2}/2$ pairs
              times about $20$ comparisons each. The filter applies to total
              work.
          - text: >
              Fine, because $O(\log n)$ is effectively constant.
            feedback: >
              Treating $\log n$ as about $20$ is fair; the trouble is the
              $n^{2}/2$ pairs around it, which no rounding makes small.
        feedback: >
          Count every loop that encloses the step before comparing against
          the budget. Near a cutoff, also remember that the ladder ignores
          constants — an $O(n\log n)$ method doing $50$ operations per step
          can still miss a tight limit.
      - teach: >
          In an interview, say the arithmetic aloud: "$n$ is up to a million,
          so $n^{2}$ is $10^{12}$ — hours. $n\log n$ is about $2 \times
          10^{7}$ — fine. So I want a sort, not a double loop." That
          one sentence, before any code, is most of what the question is
          checking.

  - node: quant-programming.complexity.log-halving
    hook: >
      "How many comparisons does binary search need on a billion records"
      should be answered from memory of $2^{10}\approx10^{3}$, not a
      calculator — this is the one growth rate an interview expects you to
      estimate instantly.
    explanation: >
      $\log_{2} n$ counts how many times $n$ can be halved before reaching
      $1$ — concretely, the number of rounds a binary search needs to
      narrow a list of $n$ items down to one, and equivalently the depth of
      a balanced binary tree holding $n$ items. Both are the same halving
      process viewed two ways: each round, or each level down the tree,
      discards half of what's left.

      The mental shortcut worth memorizing is $2^{10}=1024\approx10^{3}$, so
      $\log_{2}(10^{3})\approx10$. Scaling by powers of $10^{3}$ then just
      adds $10$ each time: $\log_{2}(10^{6})\approx20$,
      $\log_{2}(10^{9})\approx30$, $\log_{2}(10^{12})\approx40$. The true
      values are slightly smaller ($19.9$, $29.9$, $39.9$) since $10^{3}$ is
      a touch more than $2^{10}$, but the estimate is accurate enough to
      size an algorithm live.

      This slow growth is why $\log n$ is treated as "practically constant"
      next to any polynomial term: multiplying the input by a thousand only
      adds about ten more halvings, so a $\log n$ factor sitting next to an
      $n$ or $n^{2}$ term almost never changes which algorithm is fast
      enough — it is the one growth rate an interview will rarely ask you to
      tighten further.
    worked: >
      How many comparisons does binary search need on a trillion sorted
      records ($n=10^{12}$)? Using $\log_{2}(10^{3})\approx10$ four times,
      $\log_{2}(10^{12})\approx4\times10=40$ comparisons — a data set a
      million times larger than a million-item list
      ($\log_{2}(10^{6})\approx20$) only costs twice as many comparisons,
      $40$ versus $20$, not a million times more.
    interview: >
      "If I have a billion sorted records, how many comparisons does binary
      search take" is meant to be answered in seconds using the
      $2^{10}\approx10^{3}$ shortcut, landing near $30$ — the interviewer is
      checking mental-math fluency with logarithms, not asking for the
      exact value $29.9$.
    pitfalls: >
      Confusing $\log_{2}$ with $\log_{10}$ changes the answer by a factor
      of about $3.32$ — always confirm which base a stated bound uses.
      Treating every logarithm as automatically negligible is also wrong
      when its argument is itself exponential, such as $\log(2^{n})=n$,
      which is linear, not small.
    recap: >
      $\log_{2} n$ is the halving count, estimated fast via
      $2^{10}\approx10^{3}$, and it grows so slowly that a thousand-fold
      larger input costs only about ten more comparisons.
    dialogue:
      - part: A guessing game, scaled up
        teach: >
          A friend picks a whole number from $1$ to $1000$. You guess, and
          after each wrong guess you are told "higher" or "lower". You play
          the best strategy and count guesses in the worst case.
      - ask: >
          What is the most guesses you could need?
        expects: "10"
        hint: >
          Guess the middle each time. How many numbers can $k$ guesses tell
          apart?
        feedback: >
          Guessing the middle leaves at most half of the range each time.
          With $k$ guesses you can pin down at most $2^{k} - 1$ numbers, and
          $2^{9} - 1 = 511 < 1000 \le 1023 = 2^{10} - 1$. So $10$ guesses.
      - ask: >
          The range grows a thousandfold, to $1$ through $10^{6}$. What
          happens to the worst-case number of guesses?
        choices:
          - text: >
              It grows a thousandfold, to about $10000$.
            feedback: >
              That would be true if each guess ruled out one number. A middle
              guess rules out half of what is left, so $10000$ guesses could
              search a range of $2^{10000}$.
          - text: >
              It grows to about $20$.
            correct: true
            feedback: >
              Right: $2^{19} - 1 = 524287 < 10^{6} \le 1048575 = 2^{20} - 1$.
              A thousand times the range costs ten more guesses.
          - text: >
              It grows to about $100$, by a factor of ten.
            feedback: >
              The guesses grow by adding, not multiplying. $100$ guesses could
              search a range of about $2^{100} \approx 10^{30}$.
        feedback: >
          The range went up by $10^{3}$ and the guesses went up by $10$.
      - ask: >
          Back to the small game, but now the range is $1$ to $2000$. What is
          the worst-case number of guesses?
        expects: "11"
        feedback: >
          $2^{10} - 1 = 1023 < 2000 \le 2047 = 2^{11} - 1$, so $11$. Doubling
          the range costs exactly one more guess: the first guess cuts $2000$
          back down to the $1000$ you already know how to finish.
      - reflect: >
          A thousandfold larger range cost ten more guesses, and a twofold
          larger one cost a single guess. What is each guess doing to the
          range, and what quantity is the guess count really measuring?
        answer: >
          Each guess halves what is left, so the guess count is the number of
          times $n$ can be halved before one candidate remains: $\log_{2} n$,
          rounded up. Doubling $n$ adds one halving, and since $2^{10} = 1024
          \approx 10^{3}$, multiplying $n$ by a thousand adds about ten.

      - part: The halving count
        teach: >
          That count is $\log_{2} n$. It is the number of rounds in a binary
          search and the depth of a balanced binary tree on $n$ items — the
          same halving read two ways. With $2^{10} \approx 10^{3}$ you can
          estimate it in your head: each factor of a thousand adds about $10$.
      - ask: >
          A balanced binary tree holds $8 \times 10^{9}$ items. About how many
          levels deep is it?
        expects: "33"
        tolerance: 1
        hint: >
          Split $8 \times 10^{9}$ into a power of two times a power of a
          thousand.
        feedback: >
          $8 = 2^{3}$ and $10^{9} = (10^{3})^{3} \approx 2^{30}$, so
          $\log_{2}(8 \times 10^{9}) \approx 3 + 30 = 33$. The exact value is
          $32.9$ — eight billion items, thirty-three levels.
      - ask: >
          A colleague says: "The log of a million is $6$, so binary search on
          a million records takes $6$ comparisons." What went wrong?
        choices:
          - text: >
              Nothing; the base of a logarithm is only a constant factor.
            feedback: >
              The base is a constant factor inside $O(\log n)$, where it
              disappears. In a count of comparisons it does not: $6$ is off by
              a factor of $3.32$.
          - text: >
              They used $\log_{10}$; halving needs $\log_{2}$, about $20$.
            correct: true
            feedback: >
              Right. $\log_{10} 10^{6} = 6$ counts divisions by ten.
              Each comparison only halves, and $\log_{2} 10^{6} \approx 19.9$.
          - text: >
              They should have used $\ln$, giving about $14$.
            feedback: >
              $\ln 10^{6} \approx 13.8$ counts divisions by $e$, which is no
              more what a comparison does than dividing by ten is.
        feedback: >
          Inside a Big-O the base vanishes; in an actual count it is the
          factor each step shrinks the problem by.

      - part: Where "practically constant" misleads
        ask: >
          Which of these grows like $n$, not like a slowly growing log?
        choices:
          - text: >
              $\log_{2}(n^{3})$
            feedback: >
              That is $3\log_{2} n$: a power inside a log only multiplies it
              by a constant. At $n = 10^{6}$ it is about $60$.
          - text: >
              $\log_{2}(1000n)$
            feedback: >
              That is $\log_{2} n + \log_{2} 1000 \approx \log_{2} n + 10$: a
              constant factor inside becomes a constant added outside.
          - text: >
              $\log_{2}(2^{n})$
            correct: true
            feedback: >
              Right: $\log_{2}(2^{n}) = n$ exactly. A log of an exponentially
              large quantity is linear, and nothing about it is small.
        feedback: >
          The log is slow only when its argument is polynomial in $n$. Halving
          a search space of $2^{n}$ candidates still takes $n$ rounds.
      - ask: >
          At $n = 10^{6}$, an $O(n\log n)$ routine and an $O(n)$ routine have
          the same constant. Which is fair to say?
        choices:
          - text: >
              The $\log n$ factor is constant, so the two cost the same.
            feedback: >
              "Practically constant" is not "equal to $1$". The factor here is
              about $20$, so one costs $2 \times 10^{7}$ steps and the other
              $10^{6}$.
          - text: >
              The log routine is about $20$ times slower, yet both finish
              well inside a second.
            correct: true
            feedback: >
              Right. A factor of $20$ is real, but it never moves an algorithm
              across a rung like $n$ to $n^{2}$ would, and even at $n = 10^{9}$
              it has only grown to $30$.
          - text: >
              The log routine is $10^{6}$ times slower.
            feedback: >
              That is the gap between $n$ and $n^{2}$. Between $n$ and
              $n\log n$ the gap is $\log_{2} n \approx 20$.
        feedback: >
          A log factor is worth counting when the budget is tight and almost
          never worth redesigning around. In an interview, "a billion sorted
          records, about thirty comparisons" is the whole answer.

  - node: quant-programming.complexity.divide-conquer-recurrence
    hook: >
      Recognizing $T(n)=aT(n/b)+f(n)$ inside recursive code you're handed
      live, and summing the recursion tree instead of guessing the answer,
      is what separates knowing merge sort is $n\log n$ from actually being
      able to analyze new recursive code.
    explanation: >
      The general move is the recursion tree: draw the levels of recursive
      calls, work out how many subproblems and what size sit at each level,
      add up the work done at that level, then sum across all
      $\log_{2} n$ levels — halving $n$ down to $1$ takes exactly that many
      rounds. Whether the total ends up dominated by the top level, the
      bottom level, or split evenly across all of them depends entirely on
      how the per-level work changes as the subproblems shrink.

      For merge sort's recurrence, $T(n)=2T(n/2)+O(n)$, every level does the
      same $O(n)$ total work — twice as many subproblems, each half the
      size, so the linear combine cost per level stays constant — and there
      are $\log_{2} n$ such levels, giving $O(n\log n)$ overall: work per
      level times number of levels, with no single level dominating.

      The same tree with a different combine cost tells a different story:
      cut the combine step to $O(1)$ per subproblem instead of $O(n)$ total,
      and the bottom level — the $n$ base cases, each doing $O(1)$ work —
      now dominates every level above it, collapsing the sum to $O(n)$
      rather than $O(n\log n)$. The branching and the halving fix the shape
      of the tree; the combine cost decides which part of it the total gets
      charged to.
    worked: >
      Binary search recurses as $T(n)=T(n/2)+O(1)$: one subproblem of half
      the size, constant work to decide which half to keep. At $n=1024$,
      the tree has $\log_{2}(1024)=10$ levels, and every level does $O(1)$
      work — a single comparison — rather than work proportional to the
      subproblem size, so the total is $10$ constant-time steps, giving
      $T(1024)=O(10)=O(\log_{2} n)$, the classic $O(\log n)$ bound rather
      than merge sort's $O(n\log n)$.
    interview: >
      "Solve this recurrence using the recursion tree, not the master
      theorem formula" is a common framing, since interviewers want the
      level-by-level counting argument, not a memorized name. Expect a
      follow-up that changes the combine cost or branching factor and asks
      how the total changes.
    pitfalls: >
      Applying $O(n\log n)$ to every divide-and-conquer recurrence
      regardless of the combine cost is the most common error — the combine
      cost decides whether the top, bottom, or every level dominates.
      Miscounting the number of levels, using $\log_{2} n$ when the split
      isn't exactly in half or being off by one at the base case, throws off
      the final constant.
    recap: >
      Sum the work level by level across the $\log_{2} n$ levels of the
      recursion tree; the combine cost per level, not the branching alone,
      decides whether the total lands on $O(n)$, $O(n\log n)$, or elsewhere.
    dialogue:
      - part: Splitting once, then again
        teach: >
          You must sort $n = 1024$ trade timestamps. The only sorting method
          you have compares every pair, about $n^{2}/2$ steps. You also know
          that merging two already-sorted lists into one sorted list of total
          length $n$ takes $n$ steps.
      - ask: >
          How many steps does the pairwise method take on all $1024$
          timestamps at once?
        expects: "524288"
        feedback: >
          $1024^{2}/2 = 1048576/2 = 524288$ steps.
      - ask: >
          Instead, split the timestamps into two halves of $512$, sort each
          half with the pairwise method, and merge. How many steps in total?
        expects: "263168"
        hint: >
          Two pairwise sorts on $512$ items each, plus one merge of length
          $1024$.
        feedback: >
          Each half costs $512^{2}/2 = 131072$, so the two halves cost
          $262144$, and the merge adds $1024$: $263168$ steps, about half of
          before. Halving the size quarters the pairwise cost, and there are
          two halves.
      - ask: >
          Split each half again: four quarters of $256$, each sorted
          pairwise, then two merges of length $512$ and one of length $1024$.
          How many steps in total?
        expects: "133120"
        feedback: >
          Four quarters at $256^{2}/2 = 32768$ each cost $131072$. The two
          merges of $512$ cost $1024$ together, and the final merge another
          $1024$: $131072 + 2048 = 133120$. The pairwise part halved again,
          and the merging grew by exactly $1024$.
      - reflect: >
          Every split halves the pairwise part and adds one more layer of
          merging. Keep splitting until there is nothing left to sort
          pairwise. What does each layer of merging cost, how many layers are
          there, and what is the total?
        hint: >
          A list of one item is already sorted.
        answer: >
          Split all the way down to pieces of size $1$, which cost nothing to
          sort. Every layer of merging touches all $n$ items exactly once — two
          merges of $n/2$, four of $n/4$, and so on — so each layer costs $n$.
          Halving $1024$ down to $1$ takes $\log_{2} 1024 = 10$ halvings, so
          there are $10$ layers and the total is $n\log_{2} n$.

      - part: Work per level, times levels
        teach: >
          That is divide and conquer, and its cost satisfies $T(n) = 2T(n/2) +
          n$: two subproblems of half the size, plus $n$ to combine. Draw it
          as a recursion tree. Level $k$ holds $2^{k}$ subproblems of size
          $n/2^{k}$; there are $\log_{2} n$ levels above the leaves; sum the
          work across each level, then across the levels.
      - ask: >
          At $n = 1024$, one level holds $16$ subproblems of size $64$. How
          much combining work does that whole level do?
        expects: "1024"
        feedback: >
          $16 \cdot 64 = 1024$. Twice as many subproblems, each half the size:
          the product never changes. That is the load-bearing fact — every
          level costs exactly $n$.
      - ask: >
          So how many steps does the fully split sort take on $1024$
          timestamps?
        expects: "10240"
        feedback: >
          $\log_{2} 1024 = 10$ levels of merging at $1024$ each gives $10240$
          steps — about $51$ times fewer than the $524288$ of the pairwise
          method, and the ratio $n/(2\log_{2} n)$ widens as $n$ grows.

      - part: Change the combine, change the answer
        ask: >
          A different routine splits the same way but combines in constant
          time: $T(n) = 2T(n/2) + 1$, with $T(1) = 1$. What is its tight
          bound?
        choices:
          - text: >
              $\Theta(n\log n)$, as for every halving recursion.
            feedback: >
              $n\log n$ came from each level costing $n$. Here the level with
              $2^{k}$ subproblems costs $2^{k}$, so the levels cost $1, 2, 4,
              \dots, n$ — not equal at all.
          - text: >
              $\Theta(\log n)$, since there are $\log_{2} n$ levels.
            feedback: >
              That would need one unit of work per level. The bottom level
              alone has $n$ leaves, each costing $1$.
          - text: >
              $\Theta(n)$, because the leaves dominate.
            correct: true
            feedback: >
              Right. The level costs $1, 2, 4, \dots, n$ form a geometric
              series whose sum is less than twice its last term.
        feedback: >
          The tree has the same shape; only the per-level work changed, and
          with it which level the total is charged to.
      - ask: >
          For that routine at $n = 1024$, what is $T(1024)$?
        expects: "2047"
        hint: >
          Each call in the tree costs exactly $1$. Count calls level by level.
        feedback: >
          $1 + 2 + 4 + \dots + 1024 = 2^{11} - 1 = 2047$, which is $2n - 1$.
          Linear, as predicted.
      - ask: >
          Another routine keeps only one half and does linear work on the way
          down: $T(n) = T(n/2) + n$. What is its tight bound?
        choices:
          - text: >
              $\Theta(n\log n)$: $\log_{2} n$ levels, each costing up to $n$.
            feedback: >
              There is one subproblem per level, so the levels cost $n, n/2,
              n/4, \dots$ — not $n$ each. Multiplying by the level count
              overcharges every level below the top.
          - text: >
              $\Theta(n)$, because the top level dominates.
            correct: true
            feedback: >
              Right: $n + n/2 + n/4 + \dots < 2n$. The first level already
              pays for half of everything.
          - text: >
              $\Theta(\log n)$, because it only follows one half.
            feedback: >
              That is the count of levels, and it would be the answer if each
              level cost $1$. Here the top level alone costs $n$.
        feedback: >
          Three recursions, three answers: equal levels give $n\log n$,
          growing levels hand the total to the leaves, and shrinking levels
          hand it to the root.

      - part: When the split is not a halving
        ask: >
          A routine peels off one item and recurses on the rest, doing linear
          work each time: $T(n) = T(n - 1) + n$. What is its tight bound?
        choices:
          - text: >
              $\Theta(n\log n)$, since it is still divide and conquer.
            feedback: >
              The $\log_{2} n$ levels came from halving. Shrinking by one item
              per call gives $n$ levels, not $\log_{2} n$.
          - text: >
              $\Theta(n)$, since only one subproblem is ever open.
            feedback: >
              One subproblem per level, but the levels cost $n, n-1, n-2,
              \dots, 1$, and those do not shrink geometrically.
          - text: >
              $\Theta(n^{2})$, since it sums $n + (n-1) + \dots + 1$.
            correct: true
            feedback: >
              Right: $n(n+1)/2$. This is what a split looks like when it is
              maximally lopsided, and it is the pairwise method in disguise.
        feedback: >
          The $\log_{2} n$ depth is earned by halving. When asked for a
          recurrence aloud, say three things: how many subproblems, how big,
          and what each level costs — then sum.

  - node: quant-programming.complexity.amortized
    hook: >
      "Is push_back $O(1)$?" is a trick question until you say the word
      "amortized" — a single call can cost $O(n)$, and the honest answer
      prices the whole sequence of calls, not any one of them.
    explanation: >
      The amortized cost of an operation is the total cost of some sequence
      of $n$ operations divided by $n$ — a statement about the whole
      sequence, not a promise about any individual call within it. This
      differs from "worst-case per operation," which bounds every single
      call separately, and from "average case," which is a claim about a
      probability distribution over random inputs. Amortized analysis needs
      no randomness at all: the guarantee is proved for every possible
      sequence, including one an adversary designs specifically to be
      expensive.

      The intuition is that occasional expensive operations are rare enough,
      relative to how many cheap operations preceded them, that spreading
      the expensive cost across the whole sequence still yields a small
      number per operation. A structure can have individual calls that cost
      $O(n)$ and still be $O(1)$ amortized, provided an expensive call is
      always preceded by enough cheap calls to absorb it — the total, not
      any single term, is what's bounded.

      The practical payoff is that "amortized $O(1)$" is a stronger and more
      useful claim than it sounds: it survives being called in a loop $n$
      times in a row, or in any order at all, because the bound was proved
      for the total across every sequence, not for a friendly one.
    worked: >
      A stack supports push ($O(1)$) and a multipop$(k)$ that removes up to
      $k$ elements in $O(\min(k,\text{size}))$ time. Do $1000$ pushes, then
      one multipop$(1000)$ that empties the whole stack: the multipop alone
      costs $1000$, an $O(n)$ single call. But across all $1001$ operations,
      total work is $1000$ pushes plus $1000$ pops inside the multipop,
      $=2000$, since no element is ever popped more than once no matter how
      the pops are distributed across calls. Dividing by $1001$ operations
      gives an amortized cost of about $2$ per operation — $O(1)$ — even
      though that one multipop call was far from cheap.
    interview: >
      "What's the amortized complexity of $n$ pushes and pops mixed
      together" is answered by bounding the *total* work across the
      sequence — here, each element is pushed once and popped at most once —
      and dividing by $n$, not by analyzing the worst single call. Naming
      this the "aggregate method" signals fluency.
    pitfalls: >
      Reporting the amortized bound as if it were also the worst-case-per-
      call bound erases real information — a single multipop or resize can
      still spike to $O(n)$. Treating "amortized" as a synonym for "average
      case" is the other common confusion; amortized holds for every
      sequence, deterministically, with no assumption about how the
      sequence is generated.
    recap: >
      Amortized cost totals the work across an entire sequence of
      operations and divides by the count, a guarantee that holds for every
      sequence — including adversarial ones — not just typical ones.
    dialogue:
      - part: Two trade recorders
        teach: >
          Two trade recorders each charge $1$ unit to record a trade. After
          every $10$th trade, recorder P sends a summary of the last $10$
          trades, costing $10$ units. Recorder Q, after every $10$th trade,
          re-sends a summary of every trade recorded so far, costing one unit
          per trade on record.
      - ask: >
          What is recorder P's total cost over a run of $1000$ trades?
        expects: "2000"
        feedback: >
          $1000$ units to record, plus $100$ summaries at $10$ units each:
          $1000 + 1000 = 2000$, or $2$ units per trade.
      - ask: >
          What is recorder Q's total cost over the same $1000$ trades?
        expects: "51500"
        hint: >
          The $j$th summary covers $10j$ trades, for $j$ from $1$ to $100$.
        feedback: >
          Recording costs $1000$. The summaries cost $10 + 20 + \dots + 1000 =
          10(1 + 2 + \dots + 100) = 10 \cdot 5050 = 50500$. Total $51500$, or
          $51.5$ per trade.
      - ask: >
          Stretch the run to $10000$ trades. What happens to each recorder's
          cost per trade?
        choices:
          - text: >
              Both stay put: each still summarizes once every $10$ trades.
            feedback: >
              Q summarizes equally often, but each summary is bigger than the
              last. Over $10000$ trades its total is $10000 + 10 \cdot 500500
              = 5015000$, or $501.5$ per trade.
          - text: >
              Both grow, since a longer run costs more.
            feedback: >
              The totals both grow; the question is the total divided by the
              number of trades. P's is $20000/10000 = 2$, exactly as before.
          - text: >
              P stays at $2$; Q grows from $51.5$ to $501.5$.
            correct: true
            feedback: >
              Right. P's cost per trade is pinned at $2$ however long the run.
              Q's grows like $n/20$ — run it ten times longer and every trade
              costs about ten times more.
        feedback: >
          Both recorders have an occasional expensive step. Only one of them
          has a cost per trade that stays put as the run grows.

      - part: What you were checking
        reflect: >
          P's $10$th trade costs $11$ units and Q's $1000$th costs $1001$, so
          neither is cheap on every call. Say precisely what makes P
          acceptable and Q not — what quantity you were tracking, and what it
          had to do as the run grew.
        answer: >
          You were tracking the total cost of the whole run divided by the
          number of operations, and asking whether it stays below a constant
          however long the run is. For P it is $2$ for every length; for Q it
          grows with $n$. How expensive one particular call is does not
          enter — only whether the expensive calls are paid for by the cheap
          ones around them.
      - teach: >
          That quantity is the amortized cost: the total cost of a sequence of
          $n$ operations, divided by $n$. P records in $O(1)$ amortized time;
          Q's amortized cost is $\Theta(n)$. The bound must hold for *every*
          sequence of operations, not a typical one. It promises nothing about
          a single call.
      - ask: >
          A new object. An order book adds orders at cost $1$ and cancels by
          marking an order dead, also cost $1$. A best-price query discards
          dead orders from the top until it reaches a live one, paying $1$
          per order looked at. You add $500$ orders, cancel the $499$
          best-priced, then query once. What is the cost per operation over
          these $1000$ operations?
        expects: "1.499"
        hint: >
          The query looks at $499$ dead orders and then the live one.
        feedback: >
          Adds cost $500$, cancels $499$, and the query looks at $500$
          orders: $1499$ in total, over $1000$ operations, is $1.499$. The
          query alone cost $500$.
      - ask: >
          Is the book's best-price query $O(1)$ amortized over every possible
          sequence of operations?
        choices:
          - text: >
              No: one query just cost $500$, which is $\Theta(n)$.
            feedback: >
              That is the worst case of one call. Amortized cost is about the
              total, and a single expensive call is allowed if the sequence
              before it paid for it.
          - text: >
              Yes: each order is discarded at most once, so all queries
              together look at no more orders than were added, plus one per
              query.
            correct: true
            feedback: >
              Right. Any sequence of $m$ operations adds at most $m$ orders,
              so the queries' total is at most $m + m$, and the whole run
              costs at most about $3m$: $O(1)$ amortized, whatever the order
              of operations.
          - text: >
              Yes, because on average only a few orders are dead at a time.
            feedback: >
              That is an average-case argument and it assumes something about
              how orders arrive. The amortized bound needs no such assumption:
              it holds even when every order on top is dead.
        feedback: >
          Amortized and worst-case-per-call are different claims, and both
          are worth stating: "queries are $\Theta(n)$ worst case, $O(1)$
          amortized".

      - part: Every sequence, or just the usual ones
        ask: >
          A sorted price list inserts at the end for $1$ unit, but inserting
          anywhere else shifts every entry after it, $1$ unit each, plus $1$
          to write. Starting empty, $1000$ inserts each land at the very
          front. What is the cost per insert?
        expects: "500.5"
        hint: >
          The $k$th insert finds $k - 1$ entries already in the list.
        feedback: >
          The $k$th insert shifts $k - 1$ entries and writes one, costing $k$.
          The total is $1 + 2 + \dots + 1000 = 500500$, or $500.5$ per insert.
      - ask: >
          On a real trading day almost every new price arrives at the end of
          the list, and a million inserts cost about a million units. Is
          insertion $O(1)$ amortized?
        choices:
          - text: >
              Yes: on the sequences that actually occur it costs about $1$
              per insert.
            feedback: >
              That is a claim about typical sequences — an average case. The
              front-loaded sequence above costs $500.5$ per insert at $1000$
              and grows with $n$, and an amortized bound must survive it.
          - text: >
              Yes, because the expensive inserts are rare.
            feedback: >
              Rare on friendly data. An adversary can make every insert
              expensive, and nothing in the structure pays for it the way the
              cheap adds paid for the order book's query.
          - text: >
              No: some sequence makes the cost per insert grow like $n/2$.
            correct: true
            feedback: >
              Right. It passes the test on the usual sequences and fails the
              clause that says *every* sequence. Its amortized cost is
              $\Theta(n)$.
        feedback: >
          The order book's query earns its bound from an accounting fact that
          holds whatever happens. The price list's cheap days are luck. In an
          interview, say which guarantee you mean: worst case per call,
          amortized over any sequence, or average over a distribution.

  - node: quant-programming.complexity.doubling-worked
    hook: >
      This is the proof, not just the claim, that a dynamic array's push is
      $O(1)$ amortized — reproducing the geometric-series argument live is
      what the interviewer is actually checking for.
    explanation: >
      The proof is nothing more than summing a geometric series. Resizes
      happen at capacities $1,2,4,\dots,2^{k-1}$, and the resize at capacity
      $2^{i}$ copies exactly $2^{i}$ elements, so after $n$ pushes the total
      copying work is $1+2+4+\cdots+2^{k-1}$, a geometric series bounded
      above by $2\cdot2^{k-1}\le2n$. Total work across all $n$ pushes is
      then at most the $n$ pushes themselves plus $2n$ copies, both $O(n)$,
      so the amortized cost per push — total work divided by $n$ — is
      $O(1)$.

      The multiplicative growth is not incidental — it's what makes the
      series geometric rather than arithmetic. Growing the capacity by a
      fixed additive amount $c$ each time instead of doubling forces about
      $n/c$ resizes, and the copy cost at each resize grows linearly with
      the current size, so total copying becomes $\Theta(n^{2}/c)$ —
      quadratic in $n$ for fixed $c$ — giving $\Theta(n/c)$ amortized per
      push, not $O(1)$. Doubling keeps the resize count logarithmic while
      the copy sizes form a geometric series summing to $O(n)$; additive
      growth keeps the resize count linear and loses the bound entirely.

      The growth factor doesn't have to be exactly $2$ — any fixed factor
      greater than $1$ (a common choice is $1.5$) yields the same
      geometric-series argument and the same $O(1)$ amortized bound, just
      with a different constant baked into the $O$.
    worked: >
      Push $100$ elements onto an array that starts at capacity $1$ and
      doubles on overflow. Resizes trigger when capacity $1,2,4,8,16,32,64$
      each fill up, copying $1,2,4,8,16,32,64$ elements respectively — a
      total of $127$ copies across $7$ resizes, safely under the $2n=200$
      bound the geometric series guarantees, even though $n=100$ isn't a
      clean power of $2$. Total work including the $100$ pushes themselves
      is $227$, giving an amortized cost per push of $227/100\approx2.27$.
    interview: >
      "Prove push_back is amortized $O(1)$, don't just state it" wants the
      geometric-series sum reproduced, ending in an explicit bound like
      $\le2n$ total copies — citing "it's a well-known fact" without the sum
      reads as not knowing it.
    pitfalls: >
      Growing capacity by a fixed additive amount instead of a
      multiplicative factor breaks the bound entirely, turning $O(1)$
      amortized into $\Theta(n)$ amortized — this is the most common wrong
      "optimization." Adding a shrink-on-underflow rule that halves capacity
      as soon as the array is half empty can also break the bound:
      alternating one push and one pop right at that threshold forces a
      resize on every operation, so any shrink policy needs a wider
      hysteresis band, such as shrinking only at one-quarter full, to stay
      $O(1)$ amortized.
    recap: >
      Summing the geometric series of resize costs bounds total copying by
      roughly $2n$ over $n$ pushes — proof, not assertion, that doubling
      gives $O(1)$ amortized inserts, and only multiplicative growth earns
      that bound.
    dialogue:
      - part: An array that grows by a hundred
        teach: >
          An engineer's array starts with $100$ slots. Whenever a push finds
          it full, it moves to a new block $100$ slots larger, copying every
          stored element across, and then stores the new one.
      - ask: >
          How many element copies have happened after $1000$ pushes?
        expects: "4500"
        hint: >
          The array is full, and copies everything, at sizes $100, 200,
          \dots$ — up to which one?
        feedback: >
          Resizes fire when pushes $101, 201, \dots, 901$ find the array full
          at $100, 200, \dots, 900$. The copies total $100 + 200 + \dots + 900
          = 100 \cdot 45 = 4500$.
      - ask: >
          After $10000$ pushes, how many copies is that per push?
        expects: "49.5"
        feedback: >
          The full sizes are now $100, 200, \dots, 9900$, so the copies total
          $100(1 + 2 + \dots + 99) = 100 \cdot 4950 = 495000$, which is
          $49.5$ per push. Ten times the pushes, eleven times the copies per
          push.
      - ask: >
          The engineer proposes growing by $1000$ slots instead, starting at
          $1000$. Does that fix it?
        choices:
          - text: >
              Yes: at $10000$ pushes the copies drop to $4.5$ per push.
            feedback: >
              True at $10000$. At $10^{6}$ pushes the copies are $1000(1 + 2 +
              \dots + 999) = 499500000$, or $499.5$ per push. The bigger step
              only postponed the growth.
          - text: >
              No: it divides the cost by $10$, but the cost per push still
              grows linearly with $n$.
            correct: true
            feedback: >
              Right. With step $c$ there are about $n/c$ resizes, of average
              size about $n/2$, so about $n^{2}/(2c)$ copies — $\Theta(n/c)$
              per push for any fixed $c$.
          - text: >
              It makes no difference at all.
            feedback: >
              It makes exactly a factor-of-$10$ difference — $4.5$ against
              $49.5$ at $10000$ pushes. What it cannot change is that the cost
              per push keeps climbing.
        feedback: >
          Any fixed step leaves the resize count growing like $n$ and the copy
          sizes growing like an arithmetic series, whose sum is quadratic.
      - reflect: >
          The arithmetic series is the problem. What would the resize sizes
          have to look like for the total copying to stay within a constant
          multiple of $n$ — and what growth rule produces that?
        hint: >
          Compare each copy with the next one.
        answer: >
          Each copy should be at most a fixed fraction of the next, so that
          the whole series is dominated by its last term. Growing the
          capacity by a constant factor does that: with doubling the copy
          sizes are $1, 2, 4, \dots$, each one equal to the sum of all the
          earlier ones plus $1$, so the total is less than twice the last
          copy, and the last copy is less than $n$.

      - part: Doubling, summed to the end
        teach: >
          So double. Starting at capacity $1$, the array is full at sizes $1,
          2, 4, \dots, 2^{k-1}$, and each resize copies that many elements.
          The copies form a geometric series, $1 + 2 + \dots + 2^{k-1} =
          2^{k} - 1$, which is less than twice its last term, and the last
          term is below $n$. So the copying never exceeds $2n$.
      - ask: >
          Push $3000$ elements onto a doubling array that starts at capacity
          $1$. How many resizes fire?
        expects: "12"
        feedback: >
          The array is full at $1, 2, 4, \dots, 2048$, and $2048 < 3000 \le
          4096$, so resizes fire at those twelve sizes, $2^{0}$ through
          $2^{11}$. The engineer's array, growing by $100$, would have
          resized $29$ times.
      - ask: >
          How many element copies in total?
        expects: "4095"
        feedback: >
          $1 + 2 + 4 + \dots + 2048 = 2^{12} - 1 = 4095$, inside the bound
          $2n = 6000$.
      - ask: >
          Counting $1$ unit for the push itself and $1$ per element copied,
          what did the single most expensive of those $3000$ pushes cost?
        expects: "2049"
        hint: >
          Which push found the array full at its largest size?
        feedback: >
          Push $2049$ found the array full at $2048$, copied all $2048$
          elements and then stored its own: $2049$ units. Yet the $3000$
          pushes cost $3000 + 4095 = 7095$ in all, under $3$ per push. One
          call is $\Theta(n)$; the sequence is $O(1)$ amortized.
      - ask: >
          The ratio of copies to pushes is worst just after a resize. At
          $n = 2049$ pushes, what is it, to three decimal places?
        expects: "1.999"
        tolerance: 0.001
        hint: >
          Push $2049$ found the array full at $2048$.
        feedback: >
          The resizes at $1, 2, \dots, 2048$ have all fired, so the copies are
          $4095$, and $4095/2049 \approx 1.9985$. One push earlier the copies
          were $2047$ against $2048$ pushes, about $1$. The bound of $2$ copies
          per push is essentially tight.

      - part: Other growth rules
        ask: >
          A library grows its arrays by a factor of $1.5$ instead of $2$. Is
          push still $O(1)$ amortized?
        choices:
          - text: >
              No: only doubling makes each copy as large as all earlier ones
              combined.
            feedback: >
              That exact identity is special to $2$, but it is more than the
              proof needs. Any series with ratio above $1$ is dominated by its
              last term.
          - text: >
              Yes: the copies form a geometric series with ratio $1.5$, which
              sums to at most about $3$ times the last copy.
            correct: true
            feedback: >
              Right. Reading backwards from the last copy $L$, the sum is at
              most $L(1 + 2/3 + 4/9 + \dots) = 3L$, and $L < n$. Any constant
              factor above $1$ gives $O(1)$ amortized; it only moves the
              constant.
          - text: >
              Only if $n$ is a power of $1.5$.
            feedback: >
              The bound holds for every $n$: wherever $n$ falls, the copies are
              a geometric series whose last term is below $n$.
        feedback: >
          The growth must be multiplicative; the factor itself is a
          memory-versus-copies tuning choice.
      - ask: >
          To save memory, the array also halves its capacity whenever a pop
          leaves it exactly half full. It holds $1024$ elements at capacity
          $1024$, and the program alternates push, pop, push, pop. Roughly
          what does each operation now cost?
        choices:
          - text: >
              About $1$: the pushes and pops are cheap.
            feedback: >
              The push finds the array full and grows to $2048$, copying
              $1024$. The pop leaves $1024$ of $2048$, exactly half, so it
              shrinks and copies $1024$ back. Every operation pays a resize.
          - text: >
              About $2$, the doubling bound.
            feedback: >
              The bound of $2$ copies per push assumed every resize was
              preceded by many cheap pushes. Here no cheap operations sit
              between resizes to pay for them.
          - text: >
              About $1024$: every operation triggers a resize.
            correct: true
            feedback: >
              Right. Growth and shrinking fire at the same boundary, so the
              array thrashes. Shrinking only at one-quarter full puts a gap of
              cheap operations between any two resizes and restores the
              $O(1)$ amortized bound.
        feedback: >
          In the interview, give the sum, not the slogan: "resizes copy $1,
          2, 4$ up to below $n$; that geometric series is under $2n$; so $n$
          pushes cost under $3n$, $O(1)$ amortized."

  - node: quant-programming.complexity.space-time-tradeoff
    hook: >
      "Can you do better?" after you've stated an $O(n)$-per-query solution
      is almost always answered by spending memory to precompute — naming
      the trade explicitly is faster than reinventing it live.
    explanation: >
      Many "can we go faster" answers are not new algorithmic insight so
      much as a decision to remember something instead of recomputing it —
      memory spent now to buy time back later. The question that decides
      whether the trade pays off is how many times the precomputed
      information will actually be used: build a structure once at $O(n)$
      or $O(n\log n)$ cost and query it once, and the setup cost never
      amortizes; build it once and query it many times, and the one-time
      cost is paid back many times over.

      The recurring instances share this shape. A hash table spends $O(n)$
      memory to turn repeated $O(n)$ scans into $O(1)$ expected lookups.
      Memoization spends memory to turn repeated recomputation of the same
      subproblem into a single computation plus free lookups thereafter. A
      prefix-sum array spends $O(n)$ memory and $O(n)$ one-time
      preprocessing to turn every future range-sum query into $O(1)$
      instead of $O(n)$ per query. None of these change what's computable —
      they change who pays for the computation and when.

      When an interviewer follows a working solution with "what if memory
      isn't a constraint," that's usually the cue to reach for exactly this
      trade rather than a cleverer algorithm — the honest answer is often
      that no free lunch exists, only a choice about which resource to
      spend.
    worked: >
      An array of $n=10^{6}$ elements needs to answer $q=1000$ range-sum
      queries. Naive per-query summing costs $O(n)$ each, about
      $1000\times10^{6}=10^{9}$ total operations — on the order of several
      seconds, likely too slow. Building a prefix-sum array first costs
      $O(n)$ once, about $10^{6}$ operations, and each query then costs
      $O(1)$, about $1000$ operations total — roughly $1.001\times10^{6}$
      operations overall, close to a thousand times fewer than the naive
      total, at the cost of one extra array of size $n$.
    interview: >
      "I need to answer many range-sum queries against a fixed array — can
      you speed this up?" is the canonical prompt; the interviewer listens
      for "precompute prefix sums" named immediately, along with the $O(n)$
      preprocessing plus $O(1)$-per-query cost stated explicitly, not just
      "yes, use extra memory."
    pitfalls: >
      Reaching for precomputation when there's only one or two queries
      wastes the setup cost for no payoff — the trade only wins when the
      number of reuses is large enough to amortize it. Assuming the
      underlying data stays static is the other trap: if updates interleave
      with range queries, a plain prefix-sum array needs a full $O(n)$
      rebuild per update, and a Fenwick tree or segment tree is the
      structure that actually handles both operations in $O(\log n)$.
    recap: >
      Precomputing or caching turns repeated $O(n)$ work into $O(1)$
      lookups at the cost of memory, and the trade only pays off once the
      precomputed answer is reused enough times to amortize the setup.
    dialogue:
      - part: Twenty thousand range questions
        teach: >
          A desk stores $n = 400000$ one-minute returns. A risk tool will ask
          $20000$ questions of the form "total return from minute $a$ to
          minute $b$". The obvious answer adds up the returns in the range,
          fresh for each question. Your machine does $10^{8}$ additions a
          second.
      - ask: >
          In the worst case every range spans all $400000$ minutes. How many
          seconds do the $20000$ questions take?
        expects: "80"
        feedback: >
          $20000 \cdot 400000 = 8 \times 10^{9}$ additions, and $8 \times
          10^{9}/10^{8} = 80$ seconds.
      - ask: >
          Where are those $80$ seconds actually going?
        choices:
          - text: >
              Into re-adding the same stretches of minutes for question after
              question.
            correct: true
            feedback: >
              Right. Minute $200000$ sits inside most long ranges, and its
              return is added again for every one of them. The work is
              repeated, not required.
          - text: >
              Into the additions themselves, which no method can avoid.
            feedback: >
              Some additions are unavoidable — each return has to be added in
              at least once. But the same returns are being added thousands of
              times over, once per question that covers them.
          - text: >
              Into the size of $n$; nothing helps short of fewer minutes.
            feedback: >
              One pass over $400000$ minutes takes $4$ milliseconds. The size
              of $n$ is fine; doing the pass $20000$ times is the problem.
        feedback: >
          The tool recomputes, for each question, sums it has already
          computed for an earlier one.

      - part: Remember instead of recompute
        reflect: >
          You may store one extra number per minute, computed in a single pass
          before any question arrives. What would you store so that any range
          sum becomes one quick calculation?
        hint: >
          A range is the difference of two things that both start at minute
          $1$.
        answer: >
          Store running totals: $P[k]$, the sum of the first $k$ returns, with
          $P[0] = 0$. One pass builds them all, since $P[k] = P[k-1] + r_{k}$.
          Every range from minute $a$ to minute $b$ is then the total up to $b$
          minus the total up to just before $a$ — one subtraction, however
          long the range.
      - teach: >
          That is a space–time trade. A prefix-sum array spends $O(n)$ memory
          and one $O(n)$ pass to turn every later range query from $O(n)$ into
          $O(1)$. The same shape recurs: a lookup table, a cache of computed
          results. When an interviewer asks "can you do better?", ask first
          what you could compute once and keep.
      - ask: >
          With $P[k]$ the sum of the first $k$ returns, which expression is the
          total from minute $1001$ through minute $3000$?
        choices:
          - text: >
              $P[3000] - P[1001]$
            feedback: >
              $P[1001]$ includes minute $1001$, so subtracting it removes a
              minute that belongs to the range. The result covers $1002$
              through $3000$.
          - text: >
              $P[3000] - P[1000]$
            correct: true
            feedback: >
              Right. $P[3000]$ covers minutes $1$ to $3000$; removing the first
              $1000$ leaves exactly $1001$ to $3000$.
          - text: >
              $P[3000] - P[999]$
            feedback: >
              That removes only minutes $1$ to $999$, so minute $1000$ is left
              in. The range would run from $1000$.
        feedback: >
          The sum from $a$ to $b$ is $P[b] - P[a-1]$. The off-by-one is where
          this trade usually goes wrong in live code.
      - ask: >
          Counting one addition per entry to build $P$ and one subtraction per
          question, how many operations do the build and all $20000$ questions
          take together?
        expects: "420000"
        feedback: >
          $400000$ to build, $20000$ to answer: $420000$ operations, about
          $4$ milliseconds, against $8 \times 10^{9}$. The price is one extra
          array of $400001$ numbers.

      - part: The same trade, another shape
        ask: >
          A pricing routine defines $f(k) = f(k-1) + f(k-2)$ for $k \ge 2$,
          with $f(0)$ and $f(1)$ given, and computes $f(50)$ by recursion.
          Called naively it makes over $4 \times 10^{10}$ calls. If instead it
          stores each $f(k)$ the first time it is computed and looks it up
          afterwards, how many values does it ever compute?
        expects: "51"
        hint: >
          Which arguments can ever appear?
        feedback: >
          Only $f(0), f(1), \dots, f(50)$ can appear, and each is computed
          once: $51$ values, held in $51$ slots of memory. The naive recursion
          recomputed $f(48)$ twice, $f(47)$ three times, and so on, with the
          repeats growing like the function itself.
      - ask: >
          The same caching idea is proposed for three other jobs. Which one
          does it actually speed up?
        choices:
          - text: >
              Pricing each of $10^{6}$ distinct trades exactly once.
            feedback: >
              Every argument is new, so the cache never answers anything: it
              costs $10^{6}$ stored prices and saves no work. Caching pays only
              when the same question comes back.
          - text: >
              Summing a live price feed that is read once and discarded.
            feedback: >
              Each value is used once and never asked about again. Storing it
              buys nothing, because nothing is recomputed.
          - text: >
              Valuing a portfolio where $5000$ positions share $40$
              underlyings, each needing the same costly volatility fit.
            correct: true
            feedback: >
              Right. Without a cache a fit runs for each of the $5000$
              positions; with one, each is done once and then looked up, on average, $124$
              more times. Memory for $40$ results buys back $4960$ fits.
        feedback: >
          Prefix sums and memoization are the same trade: spend memory to
          avoid computing the same thing twice. It pays exactly when there is
          a "twice".

      - part: When the trade goes wrong
        ask: >
          A data fix changes the return at minute $100000$. How many entries
          of $P$, from $P[1]$ to $P[400000]$, must be updated?
        expects: "300001"
        feedback: >
          Every running total from minute $100000$ onward includes the changed
          return: $400000 - 100000 + 1 = 300001$ entries. A trade bought for
          static data turns every update into an $O(n)$ rebuild; data that
          changes between queries needs a different structure.
      - ask: >
          A colleague wants to go further and store the answer to every
          possible range, so each question is a single lookup with no
          subtraction. What is wrong with that?
        choices:
          - text: >
              Nothing; more precomputation always makes queries faster.
            feedback: >
              There are $n(n+1)/2 \approx 8 \times 10^{10}$ ranges — hundreds
              of gigabytes, and far more work to build than the $8 \times
              10^{9}$ additions it was meant to save.
          - text: >
              It saves one subtraction per query at a cost of about $8 \times
              10^{10}$ stored answers.
            correct: true
            feedback: >
              Right. The prefix sums already make each query $O(1)$; the extra
              table buys a constant factor with quadratic memory and quadratic
              build time.
          - text: >
              It would be slower to look up an answer than to subtract.
            feedback: >
              A lookup is about as fast as a subtraction. The problem is
              building and holding $8 \times 10^{10}$ of them.
        feedback: >
          The right thing to store is the smallest summary from which every
          answer is cheap. In an interview: "prefix sums, $O(n)$ extra memory,
          $O(n)$ to build, $O(1)$ per query — worth it once the queries are
          many and the data is fixed."

  - node: quant-programming.complexity.hashing-cost
    hook: >
      Answering "hash map lookup is $O(1)$" without the word "expected"
      invites the obvious follow-up — "what if every key hashes to the same
      bucket" — and losing that exchange is a common way to lose the round.
    explanation: >
      Expected $O(1)$ is a direct application of linearity of expectation.
      With $m$ buckets and $n$ keys hashed uniformly at random, the expected
      number of other keys landing in any one fixed bucket is $n/m$, the
      load factor $\alpha$ — sum an indicator for "key $j$ collides with key
      $i$'s bucket" over all other keys, and
      $\mathbb{E}[\text{work per operation}]$ is $O(1+\alpha)$: one step to
      compute the hash, plus an expected $\alpha$ steps scanning whatever
      else landed in that bucket.

      Keeping $\alpha$ itself bounded is what keeps this $O(1)$ rather than
      growing with $n$: rehashing into a larger table once the load factor
      crosses a threshold, the same doubling idea behind dynamic arrays,
      caps $\alpha$ at a constant, so expected work per insert, lookup, or
      delete stays $O(1)$ regardless of how large the table eventually
      grows.

      This is also exactly the birthday problem in different clothes: a
      collision — two keys landing in the same bucket — is the same event
      as two people sharing a birthday, with buckets playing the role of
      days, so a collision becomes likely far earlier than "the table is
      nearly full" suggests, roughly once $\sqrt{m}$ keys are inserted.
      And the expectation itself is over a random or well-distributed hash
      function; an adversary who chooses keys that collide under a known,
      weak hash forces every operation into a real $\Theta(n)$, since the
      guarantee never claimed anything about a specific worst-case input.
    worked: >
      A table has $m=1000$ buckets and $n=700$ keys inserted, load factor
      $\alpha=0.7$. The expected number of other keys sharing any given
      bucket is $\alpha=0.7$, so an unsuccessful lookup, scanning the whole
      bucket, costs an expected $1+\alpha=1.7$ comparisons, and a
      successful lookup costs an expected $1+\alpha/2=1.35$ comparisons —
      both $O(1)$ constants, nowhere near the $700$ comparisons a
      worst-case single bucket could in principle force.
    interview: >
      "What's the time complexity of a hash map lookup, and when does it
      break" wants "expected $O(1)$, assuming a reasonable hash function and
      a bounded load factor via rehashing" stated cold, followed immediately
      by "worst case is $O(n)$, under an adversarial hash or a
      hash-flooding attack" without being prompted for it.
    pitfalls: >
      Saying plain "$O(1)$" without the word "expected" or "average"
      answers a different, false claim. Assuming a language's default hash
      function is collision-resistant against a deliberately crafted input
      is also wrong — many built-in hashes are fast but not adversarially
      safe, which is exactly how hash-flooding denial-of-service attacks
      work.
    recap: >
      Hash table operations are expected $O(1)$ because the expected bucket
      occupancy is the load factor, a constant kept bounded by rehashing —
      not a worst-case guarantee, and collisions stay common well before
      the table fills.
    dialogue:
      - part: Six thousand IDs in two thousand buckets
        teach: >
          A desk tracks $6000$ open order IDs. Rather than scan one long list,
          you spread them over $m = 2000$ buckets: a hash sends each ID to a
          bucket uniformly at random, independently of the others, and a
          lookup computes the bucket and scans only that bucket.
      - ask: >
          Fix one bucket. What is the expected number of IDs in it?
        expects: "3"
        hint: >
          Write the count as a sum of one indicator per ID.
        feedback: >
          Each ID lands in the fixed bucket with probability $1/2000$. The
          count is a sum of $6000$ indicators, so by linearity of expectation
          its mean is $6000/2000 = 3$ — no independence needed for that step.
      - ask: >
          A lookup for an ID that is not stored scans its entire bucket. Does
          that mean every such lookup costs about $3$ comparisons?
        choices:
          - text: >
              Yes: every bucket holds $3$ IDs.
            feedback: >
              Every bucket holds $3$ IDs *on average*. Bucket sizes vary from
              roll to roll — some are empty, some hold $8$ or $9$ — and in
              principle all $6000$ could land in one bucket.
          - text: >
              No: a single lookup could scan up to $6000$, but the expected
              scan is $3$.
            correct: true
            feedback: >
              Right. The guarantee is about the expectation, taken over the
              randomness of the hash, not about the worst bucket.
          - text: >
              No: the expected scan is $6000$, since all IDs might be in one
              bucket.
            feedback: >
              That is the worst case, which has vanishing probability under a
              random hash. The expectation weighs it by that probability and
              comes out at $3$.
        feedback: >
          Expected cost is $1$ to compute the bucket plus an expected $3$ to
          scan it. The question is what keeps that $3$ from growing.

      - part: Keeping the buckets short
        ask: >
          The book grows to $600000$ IDs, still in $2000$ buckets. What is the
          expected scan now?
        expects: "300"
        feedback: >
          $600000/2000 = 300$. With a fixed number of buckets the expected
          scan is $n/m$, which grows linearly with $n$ — a hundredth of a full
          scan, but still $\Theta(n)$.
      - reflect: >
          The expected scan is $n/m$. What must the table do as $n$ grows to
          keep that number from growing, and why does doing it not ruin the
          cost of the inserts that trigger it?
        hint: >
          You have met an array that faced the same question.
        answer: >
          Keep $n/m$ below a fixed constant by growing $m$ along with $n$:
          when the ratio crosses a threshold, double the number of buckets and
          rehash every key into the new table. That insert costs $\Theta(n)$,
          but, exactly as with the Doubling array, the rehash sizes form a
          geometric series, so they add only a constant per insert on average.
      - teach: >
          The ratio $\alpha = n/m$ is the load factor, and the expected
          bucket size is $\alpha$. A lookup costs expected $O(1 + \alpha)$.
          Rehashing into a doubled table whenever $\alpha$ passes a threshold
          caps $\alpha$ at a constant, so insert, lookup and delete all take
          expected $O(1)$ time however large the table grows.
      - ask: >
          A table starts with $4096$ buckets and doubles them whenever an
          insert would push $\alpha$ above $0.75$. After $600000$ inserts, how
          many buckets does it have?
        expects: "1048576"
        hint: >
          You need $600000 \le 0.75m$.
        feedback: >
          $m$ must reach at least $600000/0.75 = 800000$. Doubling from
          $4096$ gives $524288$ after seven doublings, still too few, and
          $1048576$ after eight. The load factor ends at $600000/1048576
          \approx 0.57$: an expected scan under one key.

      - part: Collisions come early
        ask: >
          A table has $10000$ buckets and a random hash. Roughly how many keys
          until it is more likely than not that two share a bucket?
        choices:
          - text: >
              About $5000$, once the table is half full.
            feedback: >
              Collisions are about pairs of keys, and pairs grow like the
              square of the key count. At $5000$ keys a collision-free table
              is essentially impossible.
          - text: >
              $10001$, since that is when a shared bucket is forced.
            feedback: >
              That is when a collision becomes certain, by pigeonhole. It
              becomes likely far earlier.
          - text: >
              About $120$, on the order of $\sqrt{10000} = 100$.
            correct: true
            feedback: >
              Right. This is the birthday problem with $10000$ days: even
              odds arrive at around $118$ keys.
        feedback: >
          The number that matters is the number of pairs, about $k^{2}/2$
          for $k$ keys.
      - ask: >
          With $200$ keys in the same $10000$ buckets, what is the expected
          number of pairs of keys that share a bucket?
        expects: "1.99"
        tolerance: 0.01
        hint: >
          One indicator per pair; each pair collides with probability
          $1/10000$.
        feedback: >
          There are $\binom{200}{2} = 19900$ pairs, each sharing a bucket with
          probability $1/10000$, so by linearity the expected count is
          $19900/10000 = 1.99$. The table is $2\%$ full and already expects
          two collisions.
      - ask: >
          Does that early collision break the expected $O(1)$ claim?
        choices:
          - text: >
              Yes: once keys share buckets, lookups degrade to $O(n)$.
            feedback: >
              A shared bucket holds $2$ keys, not $n$. The expected scan is
              still $\alpha = 0.02$ here.
          - text: >
              No: collisions are already priced into the expected bucket size
              $\alpha$.
            correct: true
            feedback: >
              Right. The analysis never assumed no collisions — it averaged
              over them. Collisions are why the cost is $1 + \alpha$ and not
              $1$.
          - text: >
              Yes, until the table is rehashed to remove them.
            feedback: >
              Rehashing lowers $\alpha$; it does not promise zero collisions,
              and with $\sqrt{m}$-scale key counts it could not.
        feedback: >
          Hash tables are designed to live with collisions. What they cannot
          survive is a hash that is not spreading keys at all.

      - part: When the expectation is void
        ask: >
          A table of $2000$ buckets uses the hash "ID mod $2000$", and the
          exchange issues order IDs that are all multiples of $1000$. How many
          distinct buckets ever receive a key?
        expects: "2"
        feedback: >
          A multiple of $1000$ leaves remainder $0$ or $1000$ on division by
          $2000$, so only those $2$ buckets are used. $6000$ IDs means about
          $3000$ per bucket: every lookup is a long scan, and no adversary was
          needed.
      - ask: >
          How should the answer "what does a hash map lookup cost?" be given?
        choices:
          - text: >
              "$O(1)$."
            feedback: >
              This invites "what if every key hashes to one bucket?" — and the
              true answer to that is $O(n)$. Unqualified, it is a false claim.
          - text: >
              "$O(n)$, because of collisions."
            feedback: >
              That is the worst case only. It ignores the expectation, which
              is the reason anyone uses a hash table.
          - text: >
              "Expected $O(1)$ with a good hash and a bounded load factor;
              $O(n)$ worst case if the keys all collide."
            correct: true
            feedback: >
              Right: the expectation, its two hypotheses, and what happens when
              they fail, in one breath.
        feedback: >
          The expectation is over the hash's randomness. Structured keys
          against a weak hash, or keys chosen by someone who knows the hash,
          remove that randomness, and the guarantee goes with it.

  - node: quant-programming.complexity.hash-collision-scale
    hook: >
      "There are four billion buckets, so collisions won't happen" is
      exactly the wrong intuition this node corrects — the safe insertion
      count scales with the square root of the bucket count, not the
      bucket count itself.
    explanation: >
      The birthday approximation says the probability of at least one
      collision among $k$ items hashed uniformly into $m$ buckets crosses
      $50\%$ once $k\approx1.2\sqrt{m}$ — the safe insertion count scales
      with the square root of the bucket count, not linearly with it. This
      is the same identity behind "$23$ people for even odds of a shared
      birthday" ($m=365$, $\sqrt{365}\approx19$, times $1.2$ gives about
      $23$), just applied to hash buckets instead of calendar days.

      The square-root scaling has a sharp practical consequence: doubling
      the number of bits in a hash squares the bucket count $m$, which
      squares the safe insertion count along with it. Going from a $32$-bit
      hash to a $64$-bit hash multiplies the safe count by
      $2^{16}=65{,}536$, since
      $\sqrt{2^{64}}/\sqrt{2^{32}}=2^{32}/2^{16}=2^{16}$ — not merely
      doubling how many items you can hash safely.

      This is why content hashes, UUID schemes, and deduplication systems at
      real scale reach for $64$- or $128$-bit outputs rather than $32$: at
      $128$ bits, the safe insertion count is on the order of
      $\sqrt{2^{128}}=2^{64}\approx1.8\times10^{19}$, a number no realistic
      system will ever insert that many items to reach, while at $32$ bits
      it's only in the tens of thousands — five orders of magnitude below
      the bucket count itself.
    worked: >
      A $64$-bit hash has $m=2^{64}\approx1.8\times10^{19}$ buckets. Using
      $k\approx1.2\sqrt{m}$, $\sqrt{2^{64}}=2^{32}\approx4.3\times10^{9}$, so
      $k\approx1.2\times4.3\times10^{9}\approx5.2\times10^{9}$ — about
      $5.2$ billion insertions before a $50\%$ chance of collision, versus
      the $32$-bit case's roughly $77{,}000$. Doubling the hash width from
      $32$ to $64$ bits multiplied the safe insertion count by
      $2^{16}=65{,}536$, close to the ratio
      $5.2\times10^{9}/77{,}000\approx67{,}500$ predicted, up to the
      rounding baked into the $1.2$ constant.
    interview: >
      "If I switch from a $32$-bit to a $64$-bit hash for deduplication,
      how many more items can I safely hash?" wants the $\sqrt{m}$
      reasoning reproduced live, landing on "roughly $2^{16}$ times more,"
      not a memorized number pulled from nowhere.
    pitfalls: >
      Reasoning linearly — "$m$ is huge, so collisions are essentially
      impossible" — ignores that the safe count only grows as $\sqrt{m}$.
      Treating the $50\%$ threshold as a hard floor is also wrong: a
      collision can occur far earlier than $1.2\sqrt{m}$ insertions, just
      with lower probability, and the approximation itself assumes a
      genuinely uniform hash, which a weak or clustering hash function does
      not provide.
    recap: >
      Safe insertion count before a coin-flip chance of collision scales as
      $\sqrt{m}$, so doubling a hash's bit width squares the bucket count
      and multiplies the safe count by $2^{16}$ — the reason real
      deduplication systems use $64$- or $128$-bit hashes, not $32$.
    dialogue:
      - part: Sixteen million tags, fifty thousand trades
        teach: >
          A firm tags each trade with a random $24$-bit hash, so there are
          $m = 2^{24} = 16777216$ possible tags. It books $50000$ trades a day.
          A developer argues: "That is $0.3\%$ of the tag space. Two trades
          sharing a tag is a non-issue."
      - ask: >
          What is the expected number of pairs of that day's trades that share
          a tag?
        expects: "74.5"
        tolerance: 0.5
        hint: >
          One indicator per pair of trades; each pair matches with
          probability $1/m$.
        feedback: >
          There are $\binom{50000}{2} = 1249975000$ pairs, each matching with
          probability $1/16777216$, so the expected count is
          $1249975000/16777216 \approx 74.5$. About seventy-five shared tags
          every day.
      - ask: >
          Where did the developer's argument go wrong?
        choices:
          - text: >
              It assumed the hash was uniform, and real hashes cluster.
            feedback: >
              The $74.5$ you just computed already assumes a perfectly uniform
              hash. The argument fails even in the best case.
          - text: >
              It compared trades with tags, but a collision is about pairs of
              trades, and pairs grow like $k^{2}/2$.
            correct: true
            feedback: >
              Right. $50000$ trades is $0.3\%$ of the tags, but $1.25 \times
              10^{9}$ pairs is $74$ times the tags.
          - text: >
              $0.3\%$ is too high; under $0.01\%$ would be safe.
            feedback: >
              At $0.01\%$ of the space, about $1678$ trades, the expected pairs
              are $\binom{1678}{2}/2^{24} \approx 0.08$ — small, but the point
              is the square, not a particular percentage.
        feedback: >
          Expected collisions are about $k^{2}/(2m)$. The fill fraction $k/m$
          does not appear.

      - part: Square roots, not fractions
        reflect: >
          Using expected pairs $\approx k^{2}/(2m)$: about how large can $k$
          get before collisions start to be likely, how does that scale with
          $m$, and what does it mean for adding bits to the tag?
        hint: >
          Ask when the expected count reaches about $1$.
        answer: >
          The expected count reaches $1$ near $k = \sqrt{2m}$, so the safe
          count grows like $\sqrt{m}$, not $m$. Each added bit doubles $m$ and
          multiplies the safe count only by $\sqrt{2}$; doubling the number of
          bits squares $m$ and therefore squares the safe count.
      - teach: >
          The birthday approximation sharpens this: the chance of no
          collision among $k$ keys is about $e^{-k^{2}/(2m)}$, which falls to
          one half when $k^{2}/(2m) = \ln 2$, that is at $k \approx 1.18\sqrt{m}$.
          The working rule is even odds of a collision at $k \approx 1.2\sqrt{m}$.
      - ask: >
          At how many trades does a $24$-bit tag reach even odds of some
          collision?
        expects: "4915"
        tolerance: 20
        feedback: >
          $\sqrt{2^{24}} = 2^{12} = 4096$, and $1.2 \cdot 4096 \approx 4915$.
          The firm crosses even odds within its first tenth of a day's trades.
      - ask: >
          The firm widens the tag to $48$ bits. By what factor does the
          even-odds trade count grow?
        expects: "4096"
        feedback: >
          The count scales with $\sqrt{m}$, and $\sqrt{2^{48}}/\sqrt{2^{24}} =
          2^{24}/2^{12} = 2^{12} = 4096$. Doubling the bits squared the safe
          count, from about $4915$ to about $2 \times 10^{7}$.

      - part: The count that matters
        ask: >
          Tags must also be unique across ten years: $2500$ trading days of
          $50000$ trades, $1.25 \times 10^{8}$ tags in all. With $48$-bit
          tags, what is the expected number of colliding pairs?
        expects: "27.8"
        tolerance: 0.3
        hint: >
          $2^{48} \approx 2.81 \times 10^{14}$.
        feedback: >
          $k^{2}/(2m) = (1.25 \times 10^{8})^{2}/(2 \cdot 2.81 \times 10^{14})
          = 7.81 \times 10^{15}/2.81 \times 10^{14} \approx 27.8$. Safe for a
          day, not for a decade: the count that matters is everything ever
          inserted into the same space.
      - ask: >
          With $64$-bit tags instead, about how many colliding pairs should
          the decade expect?
        choices:
          - text: >
              Exactly $0$, since $2^{64}$ is far more than $1.25 \times
              10^{8}$.
            feedback: >
              That is the pigeonhole bound, which only says a collision is not
              forced. The expected count is small but not zero.
          - text: >
              About $21$: $16$ more bits is only a third more bits.
            feedback: >
              The expected count is $k^{2}/(2m)$, and $m$ is in the denominator
              — every added bit halves it. Proportions of bit counts do not
              enter.
          - text: >
              About $0.0004$: $16$ more bits divide it by $2^{16}$.
            correct: true
            feedback: >
              Right: $27.8/65536 \approx 4.2 \times 10^{-4}$. One extra bit
              halves the expected collisions; $16$ bits cut them by a factor
              of $65536$.
        feedback: >
          Size the hash for the lifetime count of items, not the daily one.
      - ask: >
          Back at $24$ bits, a test run of only $1000$ trades produces a
          collision. What was its probability, roughly?
        expects: "0.029"
        tolerance: 0.002
        feedback: >
          $k^{2}/(2m) \approx \binom{1000}{2}/2^{24} = 499500/16777216 \approx
          0.0298$, and $1 - e^{-0.0298} \approx 0.029$. Unlucky, not
          impossible: $1.2\sqrt{m}$ marks even odds, not the first possible
          collision.
      - ask: >
          A vendor offers $64$-bit tags built as a $32$-bit date code
          followed by $32$ random bits. How safe is that for $50000$ trades a
          day?
        choices:
          - text: >
              As safe as any $64$-bit hash: about $0.0004$ collisions a decade.
            feedback: >
              Two trades on different days never collide, but two on the same
              day share the date code, so within a day only the $32$ random
              bits separate them.
          - text: >
              Unsafe: within a day only $2^{32}$ tags are possible, about
              $0.29$ expected collisions per day.
            correct: true
            feedback: >
              Right: $1.25 \times 10^{9}/(4.29 \times 10^{9}) \approx 0.29$
              a day, roughly $730$ over the decade. What counts is the random
              bits, not the printed width.
          - text: >
              Safer than random $64$ bits, since different days can never
              collide.
            feedback: >
              The date code removes cross-day collisions, which were already
              negligible, and leaves same-day ones with only $32$ bits of
              protection.
        feedback: >
          The square-root rule applies to the bits that are actually random
          for the items being compared. Said aloud: "collisions go like
          $k^{2}/(2m)$, so even odds near $1.2\sqrt{m}$; double the bits and the
          safe count squares."

  - node: quant-programming.complexity.floating-point
    hook: >
      "Why doesn't $0.1+0.2$ equal $0.3$ in code" is asked to separate
      candidates who know this is a structural fact about binary
      representation from those who've only memorized it as a language
      quirk to work around.
    explanation: >
      A double stores a number as sign times mantissa times a power of two
      — a binary fraction, not a decimal one. Numbers that are exact finite
      sums of powers of two, like $0.5=2^{-1}$, store exactly. Almost every
      decimal fraction is not such a sum: $1/10$ in binary is an infinitely
      repeating fraction, exactly the way $1/3$ repeats forever in decimal,
      so it gets truncated once the mantissa's $52$ bits run out — a small
      representation error baked in before any arithmetic even runs.

      $52$ mantissa bits give roughly $15$–$17$ significant decimal digits
      of precision, not infinite precision, and that small per-number error
      can compound across repeated operations into something visibly wrong,
      which is the entire content of $0.1+0.2$ evaluating to
      $0.30000000000000004$: each operand was already slightly off before
      the addition, and the addition simply reveals it in the digits that
      print.

      None of this is a bug specific to one language or a fixable rounding
      mistake — it is a structural fact about representing base-$10$
      fractions in base $2$, true of every system built on IEEE 754 doubles.
      No floating-point computation should be trusted to land on an exact
      decimal value, ever, regardless of which language or library produced
      it.
    worked: >
      How large can an integer get before a double can no longer represent
      it exactly? The $52$-bit mantissa plus an implicit leading bit gives
      $53$ bits of integer precision, so every integer up to
      $2^{53}=9{,}007{,}199{,}254{,}740{,}992$ is exact, but
      $2^{53}+1=9{,}007{,}199{,}254{,}740{,}993$ has no exact double
      representation and silently rounds down to $2^{53}$ itself — the
      mantissa has run out of bits to encode the odd final digit.
    interview: >
      "Why doesn't $0.1+0.2$ equal $0.3$" is the canonical opener; a
      sharper follow-up, "can a double represent every integer exactly, and
      up to what value," tests whether you know the $2^{53}$ boundary
      rather than only the decimal-fraction symptom.
    pitfalls: >
      Treating this as a bug in one particular language misses that it's
      IEEE 754, universal across virtually every mainstream language.
      Assuming more printed decimal digits "fixes" the problem is also
      wrong — the stored binary value itself is what's imprecise,
      formatting only changes how many of the wrong digits get displayed.
    recap: >
      Doubles store binary fractions with about $15$–$17$ significant
      decimal digits, so most decimal fractions have no exact
      representation and integers stop being exact past $2^{53}$ — a
      structural fact, not a rounding bug.
    dialogue:
      - part: Ten ticks of a tenth
        teach: >
          A fill simulator starts a price at $0$, adds a tick of $0.1$ ten
          times in double precision, and then tests whether the total equals
          $1.0$ before releasing an order.
      - ask: >
          What does the test return?
        choices:
          - text: >
              True: ten tenths make one.
            feedback: >
              On paper, yes. In doubles the running total ends at
              $0.9999999999999999$, so the test fails and the order is never
              released.
          - text: >
              It depends on the language.
            feedback: >
              Every mainstream language stores doubles in the same IEEE 754
              format and gets the same $0.9999999999999999$. This is not a
              quirk of one compiler.
          - text: >
              False: the total is a hair below $1$.
            correct: true
            feedback: >
              Right — $0.9999999999999999$. Each $0.1$ was already slightly off
              before any adding started, and the errors did not cancel.
        feedback: >
          Nothing in the loop is wrong. The question is what $0.1$ is once it
          is stored.
      - ask: >
          In base $10$, $1/3$ never terminates. In base $2$, how many of
          $1/2$, $3/4$, $1/10$, $1/5$ and $3/8$ have a finite expansion?
        expects: "3"
        hint: >
          A finite binary expansion is a sum of finitely many powers of
          $1/2$.
        feedback: >
          $1/2 = 0.1$, $3/4 = 0.11$ and $3/8 = 0.011$ in binary, all finite.
          $1/10$ and $1/5$ repeat forever, just as $1/3$ does in decimal.
      - reflect: >
          What decides whether a fraction has a finite binary expansion, and
          why does $1/10$ fail where $3/8$ succeeds?
        hint: >
          Compare the denominators in lowest terms.
        answer: >
          A fraction in lowest terms terminates in base $2$ exactly when its
          denominator is a power of $2$, since a finite binary expansion is an
          integer over $2^{k}$. $3/8$ has denominator $2^{3}$; $1/10$ has a
          factor of $5$ that no power of $2$ can absorb, so its expansion
          repeats forever and must be cut off somewhere.

      - part: Where the cut-off falls
        teach: >
          A double stores a sign, an $11$-bit exponent and a $52$-bit
          mantissa, plus an implicit leading bit: $53$ significant bits. A
          number whose binary expansion fits is stored exactly; anything else
          — $0.1$ included — is rounded to the nearest number that fits,
          before any arithmetic runs.
      - ask: >
          Find the binary expansion of $1/10$ by doubling: each step's
          integer part is the next digit. The digits repeat with what
          period?
        expects: "4"
        hint: >
          $0.1 \to 0.2 \to 0.4 \to 0.8 \to 1.6$; keep the $0.6$ and go on.
        feedback: >
          The doublings give $0.2, 0.4, 0.8, 1.6, 1.2, 0.4, 0.8, 1.6, 1.2,
          \dots$, so $1/10 = 0.0\,0011\,0011\,0011\dots$ in binary: a
          block of $4$ digits forever. Fifty-three bits keep about thirteen
          copies and drop the rest.
      - ask: >
          About how many significant decimal digits do $53$ bits carry?
          Answer to two decimal places.
        expects: "15.95"
        tolerance: 0.01
        hint: >
          One decimal digit is worth $\log_{2} 10$ bits.
        feedback: >
          $53 \log_{10} 2 = 53 \cdot 0.30103 \approx 15.95$. That is where the
          rule "$15$ to $17$ significant digits" comes from: a double holds
          about $16$ digits of a number, not all of them.
      - ask: >
          Of the $100$ prices $0.01, 0.02, \dots, 1.00$, how many are stored
          exactly as doubles?
        expects: "4"
        hint: >
          Write each as $k/100$ in lowest terms and use the rule you found.
        feedback: >
          $100 = 4 \cdot 25$, so $k/100$ reduces to a power-of-$2$ denominator
          only when $25$ divides $k$: $0.25$, $0.50$, $0.75$ and $1.00$. The
          other $96$ are approximations.

      - part: What exact means
        ask: >
          Which of these equality tests is guaranteed to hold in doubles?
        choices:
          - text: >
              $0.1 + 0.7 = 0.8$
            feedback: >
              It evaluates to $0.7999999999999999$. All three numbers carry a
              factor of $5$ in their denominators, so none is stored exactly.
          - text: >
              $0.5 + 0.25 = 0.75$
            correct: true
            feedback: >
              Right. $1/2$, $1/4$ and $3/4$ are exact in binary, and their sum
              is exact too, so nothing is rounded anywhere.
          - text: >
              $3 \times 0.3 = 0.9$
            feedback: >
              It evaluates to $0.8999999999999999$. $0.3$ is stored a little
              low, and multiplying by $3$ triples the shortfall.
        feedback: >
          Floating-point arithmetic is exact on numbers that fit. The trouble
          is that the decimal fractions people type almost never do.
      - ask: >
          A colleague prints $0.1$ to $20$ decimal places and sees
          $0.10000000000000000555$. What does that show?
        choices:
          - text: >
              A bug in the printing routine; the stored value is exactly
              $0.1$.
            feedback: >
              No double equals $0.1$. The printer is faithfully showing the
              decimal value of the nearest double, which is
              $0.1000000000000000055511\dots$
          - text: >
              The stored number really is slightly above $0.1$.
            correct: true
            feedback: >
              Right. Printing more digits does not fix the error; it only
              shows more of it. Printing fewer hides it, which is why most
              languages display $0.1$.
          - text: >
              Digits past the $17$th are random noise.
            feedback: >
              They are not noise: the stored binary number has an exact
              decimal expansion, and those are its digits. They are simply not
              the digits of $0.1$.
        feedback: >
          The representation error lives in the stored value, not in the
          display.

      - part: Working with it
        ask: >
          The simulator must decide fills on prices quoted in ticks of
          $0.1$. What is the robust fix?
        choices:
          - text: >
              Store prices as integer numbers of ticks and convert only for
              display.
            correct: true
            feedback: >
              Right. Integers are exact in a double far beyond any price, and
              ten ticks of $1$ make exactly $10$. Exchanges and risk systems
              quote in integer ticks for this reason.
          - text: >
              Use a wider float with more mantissa bits.
            feedback: >
              More bits push the error further out but cannot remove it: $1/10$
              repeats forever in any binary format, so the equality test is
              still a gamble.
          - text: >
              Round to one decimal place after every addition.
            feedback: >
              That happens to rescue this loop, because each rounding snaps
              back to the same double the literal would give. But the values
              are still approximations, the patch has to be on every line, and
              it silently discards any finer price. Integer ticks make the
              arithmetic exact instead of patched.
        feedback: >
          Said aloud in an interview: "$0.1$ has no finite binary expansion,
          so it is stored rounded; a double carries about $16$ significant
          digits; never test a decimal result for exact equality."

  - node: quant-programming.complexity.cancellation-tolerance
    hook: >
      "What's wrong with this comparison, or this running total" is a
      recurring live-review prompt, and the answer is almost always one of
      three linked floating-point traps — spotting which one fast is the
      actual skill.
    explanation: >
      Catastrophic cancellation happens when two nearly equal floats are
      subtracted: their matching leading digits cancel exactly, leaving
      only the trailing, least-reliable digits to make up the entire
      result. The absolute error in each operand stays roughly the same
      size, but now that fixed error sits on top of a much smaller answer,
      so the *relative* error explodes. The fix is algebraic, not
      numerical: rewrite the expression into an equivalent form that never
      subtracts two near-equal quantities, the way $\sqrt{x+1}-\sqrt{x}$
      becomes $1/(\sqrt{x+1}+\sqrt{x})$ by multiplying by the conjugate.

      Testing floats for exact equality is a related failure: roundoff
      means even a mathematically true identity typically differs by around
      $10^{-16}$ relative error once computed, so testing $a = b$ exactly is
      almost never the right check. Test $|a-b|<\varepsilon$ instead, with $\varepsilon$
      scaled to the magnitude of $a$ and $b$ — a fixed absolute tolerance is
      too loose for tiny numbers and too tight for huge ones.

      Summation order is the third trap: floating-point addition rounds to
      the precision of the larger operand, so adding a tiny value into an
      already-large running sum can discard it completely rather than just
      losing a few digits of it. Summing in ascending order, smallest
      first, lets small values accumulate with each other before meeting
      the large ones; Kahan summation achieves the same protection for a
      true one-pass stream by tracking the low-order bits an addition drops
      in a separate compensating accumulator.
    worked: >
      Sum one hundred copies of $10^{-8}$ into a running total starting at
      $10^{9}$. Adding each $10^{-8}$ individually, largest-first: near
      $10^{9}$, a double's smallest representable increment is around
      $1.2\times10^{-7}$, so each addition of $10^{-8}$ rounds away
      completely and the running total stays exactly
      $1{,}000{,}000{,}000.0$, losing all $100\times10^{-8}=10^{-6}$ of the
      true sum. Summing the hundred small values first gives $10^{-6}$ (to
      within roundoff), above that representable increment, and adding it
      once to $10^{9}$ gives $1{,}000{,}000{,}000.000001$ — the correct
      answer, recovered purely by reordering.
    interview: >
      "What's wrong with this loop that sums an array" is standard; the
      interviewer listens for whichever of the three traps applies —
      cancellation, exact-equality, or summation order — named specifically,
      not a general "floating point is imprecise" answer.
    pitfalls: >
      Rewriting a cancellation-prone expression without checking that the
      new form doesn't introduce cancellation somewhere else. Choosing a
      fixed absolute epsilon for equality tests regardless of the numbers'
      scale, rather than a relative tolerance. Assuming a full sort before
      summing is free — it costs $O(n\log n)$ and isn't possible on a true
      single-pass stream, which is exactly when Kahan summation earns its
      extra bookkeeping.
    recap: >
      Nearly-equal subtraction, exact equality tests, and large-before-
      small summation are the three ways floating point quietly discards
      precision, each fixed by a different, specific technique rather than
      "being careful."
    dialogue:
      - part: A variance of exactly zero
        teach: >
          A risk script measures the spread of three fills at
          $1000000.01$, $1000000.02$ and $1000000.03$. It uses the textbook
          shortcut: the variance is the mean of the squares minus the square
          of the mean, computed in doubles.
      - ask: >
          First, by hand: what is the true population variance of the three
          fills, in units of $10^{-4}$?
        expects: "2/3"
        tolerance: 0.001
        hint: >
          Only the deviations from the middle fill matter.
        feedback: >
          The deviations are $-0.01$, $0$ and $0.01$, so the variance is
          $(10^{-4} + 0 + 10^{-4})/3 = (2/3) \times 10^{-4} \approx 6.67
          \times 10^{-5}$.
      - ask: >
          What does the shortcut return in doubles?
        choices:
          - text: >
              About $6.67 \times 10^{-5}$, perhaps wrong in the last digit or
              two.
            feedback: >
              A double carries about $16$ significant digits, and the answer
              needs more than that, as the next question shows. It returns
              exactly $0.0$.
          - text: >
              Exactly $0$.
            correct: true
            feedback: >
              Right. The mean of the squares and the square of the mean round
              to the same double, and their difference is $0.0$. On other data
              the same formula returns a negative variance.
          - text: >
              Something enormous, since the squares are near $10^{12}$.
            feedback: >
              The squares are large, but they are nearly equal, so their
              difference is small. The problem is that it is too small to see,
              not too big.
        feedback: >
          Every input was fine and every operation was rounded correctly. The
          formula still threw the answer away.
      - ask: >
          The mean of the squares is $1000000040000.000466\dots$ and the
          square of the mean is $1000000040000.0004$. In which significant
          digit do they first differ?
        expects: "18"
        hint: >
          Count the $13$ digits before the decimal point first.
        feedback: >
          They agree on the $13$ digits before the point and the next four,
          $0004$, then differ in the $18$th. A double holds about $16$, so
          both round to the same number and the difference vanishes.
      - reflect: >
          The variance is the difference of two numbers near $10^{12}$ that
          agree in seventeen digits. How could you compute it so that no two
          large, nearly equal numbers are ever subtracted?
        hint: >
          The variance does not change if every fill is shifted by the same
          amount.
        answer: >
          Subtract first, then square: compute each fill's deviation from the
          mean (or from any nearby reference, such as $1000000$) and average
          the squared deviations. The deviations are around $0.01$, carry
          their full precision, and the squares are summed rather than
          subtracted. Done this way, doubles give $6.67 \times 10^{-5}$,
          correct to about eight digits.

      - part: Rewrite, do not refine
        teach: >
          This is catastrophic cancellation. Subtracting two nearly equal
          floats cancels their leading digits exactly, so the result is made
          of the trailing digits, which are the ones roundoff has already
          damaged. The relative error explodes. The cure is algebraic: rewrite
          the expression into an equivalent one that never subtracts two
          nearly equal quantities.
      - ask: >
          You need $1/x - 1/(x+1)$ at $x = 10^{9}$. Which form keeps full
          precision?
        choices:
          - text: >
              $1/x - 1/(x+1)$ as written, since both terms are tiny.
            feedback: >
              Tiny but nearly equal: they agree in about nine digits. Doubles
              return $1.0000001492 \times 10^{-18}$ against a true
              $9.99999999 \times 10^{-19}$, half the digits gone.
          - text: >
              $1/(x(x+1))$
            correct: true
            feedback: >
              Right. Over a common denominator the numerator is
              $(x+1) - x = 1$, worked out exactly by algebra, and the remaining
              operations are a multiplication and a division, which never
              cancel. Doubles return $9.99999999 \times 10^{-19}$.
          - text: >
              The original form, evaluated in a format with more digits.
            feedback: >
              More digits move the damage further down but keep it: the
              cancellation still eats about nine of them. At $x = 10^{15}$ it
              would eat fifteen.
        feedback: >
          A rewrite removes the cancellation; more precision only gives it
          more digits to eat.

      - part: Equality, with a tolerance
        ask: >
          Two systems compute a book's P&L of about $3 \times 10^{9}$ along
          different paths, and a check demands $|a - b| < 10^{-9}$. It fails
          every day, though both systems are correct to $15$ digits. What is
          the right check?
        choices:
          - text: >
              Keep $10^{-9}$: if the check fails, one system is wrong.
            feedback: >
              Near $3 \times 10^{9}$, $15$ correct digits leave errors around
              $10^{-6}$, and neighbouring doubles there are about $5 \times
              10^{-7}$ apart. No two different doubles of that size are within
              $10^{-9}$.
          - text: >
              Use a looser absolute tolerance such as $10^{-3}$ for every
              comparison.
            feedback: >
              That fixes this check and breaks others: two Greeks of size
              $10^{-5}$ that disagree completely would pass it.
          - text: >
              Use a relative tolerance: $|a - b| \le 10^{-12} \max(|a|, |b|)$.
            correct: true
            feedback: >
              Right. The allowed gap scales with the numbers, so the same test
              is sensible for a P&L in billions and a Greek near $10^{-5}$.
        feedback: >
          Never test computed floats for exact equality, and size the
          tolerance to the magnitude being compared.
      - ask: >
          With that relative tolerance of $10^{-12}$, how large a gap is
          allowed between two P&L figures of $3 \times 10^{9}$?
        expects: "0.003"
        feedback: >
          $10^{-12} \cdot 3 \times 10^{9} = 3 \times 10^{-3} = 0.003$ — a
          third of a cent, against the $10^{-9}$ that no two distinct doubles
          of that size could meet.

      - part: The order of addition
        ask: >
          A running total starts at $10^{16}$, where neighbouring doubles are
          $2$ apart, and $1.0$ is added to it a thousand times. How much of
          the $1000$ survives in the total?
        expects: "0"
        hint: >
          Where does $10^{16} + 1$ round to?
        feedback: >
          $10^{16} + 1$ lies exactly halfway between $10^{16}$ and
          $10^{16} + 2$, and the tie rounds back to $10^{16}$. Every one of
          the thousand additions is rounded away: $0$ survives.
      - ask: >
          Instead, add the thousand $1.0$s together first, then add that sum
          to $10^{16}$. How much survives?
        expects: "1000"
        feedback: >
          The small values sum exactly to $1000$, and $10^{16} + 1000$ is an
          even integer that a double holds exactly. All $1000$ survive. Small
          values must meet each other before they meet the large one.
      - reflect: >
          Now the values arrive one at a time and cannot be stored or sorted.
          What could the loop keep alongside the running total so that the
          parts it rounds away are not lost for good?
        hint: >
          After each addition you can compute exactly how much of the new
          value failed to get in.
        answer: >
          Keep a second variable holding what was lost. After adding $v$ to
          the total, $(\text{new total} - \text{old total}) - v$ is the
          rounding error of that addition, computed exactly; subtract it from
          the next value before adding. The losses accumulate in the
          compensation until they are large enough to register. This is Kahan
          summation, which bounds the error of a long running sum without any
          sorting.
      - teach: >
          Three traps, three named fixes: cancellation is cured by an
          algebraic rewrite, equality by a relative tolerance, and summation
          order by adding small values first or compensating with Kahan
          summation. In a code review, name which of the three you are
          looking at.

  - node: quant-programming.complexity.integer-overflow
    hook: >
      "Find the bug in this binary search" is a recurring live-coding
      prompt, and the bug is almost always the midpoint line — spotting it
      before running the code is what the exercise is actually testing.
    explanation: >
      A signed $32$-bit integer holds $-2^{31}$ to $2^{31}-1$, roughly
      $\pm2.1\times10^{9}$. Exceeding that range overflows, and unlike an
      arbitrary-precision type, most fixed-width $32$-bit types don't raise
      an error at the moment it happens — the value silently wraps, or in
      some languages invokes undefined behavior, so the bug surfaces later
      as a quietly wrong answer rather than a crash at the source.

      The classic instance is binary search's midpoint: computing
      $(\text{low}+\text{high})/2$ can overflow even when neither
      $\text{low}$ nor $\text{high}$ individually exceeds the $32$-bit
      range, because their *sum* can still cross it. The fix,
      $\text{low}+(\text{high}-\text{low})/2$, never adds two large values
      together — it only ever adds a small difference to $\text{low}$, so
      the intermediate quantity stays small regardless of how large
      $\text{low}$ and $\text{high}$ are individually.

      The general habit this teaches is checking every intermediate
      computation, not just the final return value, for whether it could
      plausibly cross about two billion — a running sum of counts, a sum of
      squares, or a product of two moderately large inputs are the
      recurring culprits, and a wrapped value is not obviously wrong on
      inspection; it's still a valid-looking number, just the wrong one.
    worked: >
      Counting all ordered pairs among $n=100{,}000$ items as $n\times n$ in
      a $32$-bit int: the true value is $n^{2}=10^{10}$, exceeding
      $2^{31}-1\approx2.147\times10^{9}$ by roughly $4.7\times$. Reducing
      modulo $2^{32}=4{,}294{,}967{,}296$, the wraparound point,
      $10^{10}-2\times4{,}294{,}967{,}296=1{,}410{,}065{,}408$ — the
      computation would silently return $1{,}410{,}065{,}408$ instead of
      $10{,}000{,}000{,}000$, a perfectly plausible-looking positive number
      that's off by nearly an order of magnitude, with no error raised
      anywhere.
    interview: >
      "Count all pairs among $n=100{,}000$ items — what's the complexity,
      and is there an implementation trap" wants both the $O(n^{2})$ sizing
      and the overflow trap named unprompted, with "accumulate in a 64-bit
      type" offered as the fix.
    pitfalls: >
      Assuming the language raises an error on overflow — most compiled,
      statically typed languages wrap or invoke undefined behavior silently
      instead. Checking only the final return value for plausibility while
      an earlier intermediate expression, like $\text{low}+\text{high}$ or
      $n\times n$, is what actually overflowed. Declaring only the final
      result variable as a wider $64$-bit type while the expression that
      computes it is still evaluated in $32$-bit arithmetic before being
      widened.
    recap: >
      Signed $32$-bit integers overflow past about $2.1$ billion silently,
      not with an error, which is exactly why binary search's midpoint is
      written as $\text{low}+(\text{high}-\text{low})/2$ instead of
      $(\text{low}+\text{high})/2$.
    dialogue:
      - part: A volume counter that went negative
        teach: >
          A desk's daily volume counter is a signed $32$-bit integer, which
          holds the whole numbers from $-2^{31}$ to $2^{31} - 1 = 2147483647$.
          Today the desk does $3000000$ fills averaging $800$ shares each, and
          the counter adds every fill's shares as it arrives.
      - ask: >
          By how much does the day's true volume exceed the largest value the
          counter can hold?
        expects: "252516353"
        feedback: >
          The true volume is $3000000 \cdot 800 = 2400000000$ shares, and
          $2400000000 - 2147483647 = 252516353$. Somewhere around fill
          $2.7$ million the counter ran out of room.
      - ask: >
          What happens at the moment the counter is pushed past
          $2147483647$, in a typical compiled language?
        choices:
          - text: >
              The program raises an overflow error.
            feedback: >
              Some languages can be asked to check, but by default most
              compiled languages do not. Java and C# wrap; in C and C++ signed
              overflow is undefined behaviour. Nothing stops the run.
          - text: >
              The counter sticks at $2147483647$.
            feedback: >
              Saturating arithmetic exists, but it is not what ordinary
              integer addition does. The bits keep going.
          - text: >
              It silently wraps around to a large negative number and keeps
              counting.
            correct: true
            feedback: >
              Right. The addition is done modulo $2^{32}$, and a result in the
              top half of that range reads as negative. No error, no warning.
        feedback: >
          The failure is silent: a wrapped value is a perfectly valid integer,
          just the wrong one.
      - ask: >
          Assuming wraparound, what does the counter read at the end of the
          day?
        expects: "-1894967296"
        hint: >
          A true value between $2^{31}$ and $2^{32}$ reads as that value minus
          $2^{32} = 4294967296$.
        feedback: >
          $2400000000 - 4294967296 = -1894967296$. The desk's report shows
          negative volume — and had the true total passed $2^{32}$, it would
          wrap all the way round to a plausible positive number instead.
      - reflect: >
          Every fill was small and every addition was ordinary. What habit
          would have caught this before the code ever ran, and what is the
          one-line fix?
        answer: >
          Before trusting a $32$-bit variable, estimate the largest value
          every intermediate quantity can reach — counts, running sums,
          squares, products — and compare it with about $2.1 \times 10^{9}$.
          Here $3$ million fills times hundreds of shares is plainly in the
          billions. The fix is to accumulate in a $64$-bit integer, which
          holds up to about $9.2 \times 10^{18}$.

      - part: The midpoint line
        teach: >
          That is integer overflow: a fixed-width integer has a hard ceiling,
          and crossing it wraps silently or is undefined rather than raising
          an error. The habit is to check intermediate values, not just
          inputs and outputs. The most famous intermediate value in
          interviews hides in binary search.
      - ask: >
          A binary search over a huge index range uses $32$-bit ints, with
          $\text{low} = 1500000000$ and $\text{high} = 2000000000$, both
          valid. In a language that wraps, what does
          $(\text{low} + \text{high})/2$ compute?
        expects: "-397483648"
        hint: >
          First find what the sum wraps to.
        feedback: >
          The sum is $3500000000$, which wraps to $3500000000 - 4294967296 =
          -794967296$, and halving gives $-397483648$. The search then reads
          a negative index and crashes, or worse, does not.
      - ask: >
          Which midpoint line is correct for every valid $\text{low} \le
          \text{high}$?
        choices:
          - text: >
              $\text{low}/2 + \text{high}/2$
            feedback: >
              It cannot overflow, but integer division drops a half from each
              term: with $\text{low} = 3$ and $\text{high} = 5$ it gives $1 +
              2 = 3$ instead of $4$. A different bug.
          - text: >
              $\text{low} + (\text{high} - \text{low})/2$
            correct: true
            feedback: >
              Right. $\text{high} - \text{low}$ is at most the range size, and
              adding half of it to $\text{low}$ never passes $\text{high}$.
              Here it gives $1500000000 + 250000000 = 1750000000$.
          - text: >
              $(\text{high} - \text{low})/2$
            feedback: >
              The difference cannot overflow, but this is half the width of
              the range, not a position in it: here $250000000$, which lies
              below $\text{low}$. The offset has to be added back to
              $\text{low}$.
        feedback: >
          Never add two large values when you only need their midpoint: add
          half of their difference to the smaller one.

      - part: What crosses two billion
        ask: >
          A latency monitor stores a duration in milliseconds in a signed
          $32$-bit int. What is the largest whole number of days it can hold?
        expects: "24"
        hint: >
          A day is $86400000$ milliseconds.
        feedback: >
          $2147483647/86400000 \approx 24.86$, so $24$ whole days. A process
          up for $25$ days, $2160000000$ milliseconds, overflows the
          counter. Unit choices quietly move the ceiling.
      - ask: >
          A signed $32$-bit count of seconds since the start of $1970$
          overflows in which year?
        expects: "2038"
        hint: >
          A year is about $3.16 \times 10^{7}$ seconds.
        feedback: >
          $2^{31} = 2147483648$ seconds is $2147483648/31557600 \approx 68.05$
          years, so the counter runs out early in $1970 + 68 = 2038$ — in
          January, as it happens. Any system still storing time that way
          will read a date in $1901$.
      - ask: >
          A code review finds $\text{total} = \text{fills} \times
          \text{shares}$, with $\text{total}$ declared $64$-bit and the two
          factors $32$-bit. With $60000$ fills of $50000$ shares, what does
          $\text{total}$ hold?
        choices:
          - text: >
              $3000000000$, since $\text{total}$ is $64$-bit.
            feedback: >
              The product is computed in $32$-bit arithmetic before it is
              stored, and $3 \times 10^{9}$ has already wrapped by then.
          - text: >
              A wrapped value, $3000000000 - 4294967296 = -1294967296$.
            correct: true
            feedback: >
              Right. The multiplication overflows in $32$ bits and the wrapped
              result is widened faithfully. Cast one factor to $64$ bits
              before multiplying.
          - text: >
              The program stops with an overflow error.
            feedback: >
              As with the volume counter, nothing checks by default. The wrong
              number flows on into the report.
        feedback: >
          In an interview, name the trap unprompted: "this product can reach
          $3 \times 10^{9}$, past $2^{31}$, so I compute it in $64$ bits" —
          and make sure the widening happens before the arithmetic.
