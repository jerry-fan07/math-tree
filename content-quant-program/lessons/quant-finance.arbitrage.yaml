unit: quant-finance.arbitrage
opening: >
  This unit is where "no free lunch" stops being a slogan and becomes a
  pricing method: given no distribution at all, the single axiom that a
  liquid market admits no arbitrage forces exact prices for forwards, options
  and cross-currency trades. It opens with the axiom itself and the law of
  one price it implies, builds the replication technique that does all the
  actual work, and applies it first to forwards and then to the workhorse
  identity of the options world, put–call parity. From there it runs parity
  in both directions — synthesizing any instrument from the other three, and
  trading the conversion or reversal when the market disagrees — before
  closing on the option bounds and the one early-exercise result every
  interview checks: American calls should never be exercised early on a
  non-dividend stock, while American puts sometimes must be.
lessons:
  - node: quant-finance.arbitrage.no-arbitrage
    hook: >
      An interviewer who asks "is this an arbitrage?" is testing a
      definition, not your cleverness — get the definition exactly right and
      the trade that exploits any violation falls out automatically.
    explanation: >
      An arbitrage is a position built for zero cost today whose payoff at
      time $T$ is never negative and strictly positive in at least one state
      — or, equivalently, one with strictly negative cost today and a payoff
      that is never negative. Both phrasings describe the same free lunch:
      money now, or later, or both, with no scenario in which you pay.

      The no-arbitrage axiom asserts that a liquid market contains none of
      these, and it is an axiom rather than a derived fact: nothing forces
      prices to obey it except that any violation would be traded in
      unlimited size by whoever spots it first, erasing the mispricing
      faster than it can be measured. That argument needs the standing
      frictionless assumptions — borrowing and lending freely at the
      riskless rate, short-selling at no cost, trading any size, facing no
      counterparty risk — which is why the axiom describes an idealized
      liquid market rather than every quote you will ever see.

      Notice what the definition never mentions: no probability of each
      state, no expected return, no risk aversion. Every price derived
      downstream in this unit is forced by this one structural axiom alone,
      which is exactly why the results are called model-free — they hold
      whatever you believe about the future.
    worked: >
      Suppose a non-dividend stock trades at $50.00$ on one venue and
      $50.20$ on another, with no borrow cost and no timing gap between the
      two prints. Buy $100$ shares on the cheap venue for $5{,}000.00$ and
      simultaneously sell $100$ shares on the rich venue for $5{,}020.00$,
      delivering the shares you just bought to settle the sale instead of
      borrowing any. The two trades net to zero shares held and a locked
      profit of $20.00$ collected today, with no future obligation at all —
      negative cost today, a payoff that is never negative because there is
      no future state left to reach.
    interview: >
      Two questions test this directly: "define arbitrage precisely" and
      "is this actually an arbitrage or just a good trade?" The interviewer
      is listening for the exact zero-cost, never-negative,
      sometimes-positive structure, and for you to name which frictionless
      assumption a real-world near-arbitrage is violating.
    pitfalls: >
      Calling any positive-expected-value trade an arbitrage is the single
      most common slip — a directional bet with real downside is not
      arbitrage no matter how favorable the odds. Also forgetting that the
      frictionless assumptions are load-bearing: a mispricing that costs
      more to trade than it pays is not exploitable, so real screens show
      near-arbitrages surviving inside a band of round-trip cost.
    recap: >
      An arbitrage is a zero-or-negative-cost position whose payoff is never
      negative and sometimes positive — a structural definition with no
      probabilities in it, enforced by unlimited trading size rather than by
      any belief about the future.
    dialogue:
      - part: A ticket offered for nothing
        teach: >
          A dealer, quoting in a hurry, offers you a contract for nothing
          today. It pays $10$ in one year if a certain stock closes above $60$
          then, and nothing otherwise. The stock is at $45$ today, and you
          have no view on where it goes.
      - ask: >
          In the worst state of the world, how much does one contract leave
          you down, in dollars?
        expects: "0"
        hint: >
          Add what you pay today to what you receive in the worst state.
        feedback: >
          You pay $0$ and receive either $10$ or $0$, so the worst state nets
          $0 - 0 = 0$. There is no state in which you are behind.
      - ask: >
          The dealer will write as many contracts as you ask for at that
          price. How many do you want?
        choices:
          - text: >
              None: at $45$ the stock will probably finish below $60$, so the
              contract will probably pay nothing.
            feedback: >
              "Probably" answers the wrong question. Even if the chance of the
              $10$ were one in a thousand, a contract that costs nothing and
              can only add to your wealth is worth holding. The chance decides
              how much it is worth, not whether to take it.
          - text: >
              A few, sized to the chance the stock clears $60$.
            feedback: >
              Sizing to the odds is how you size a bet with a downside. This
              has none: doubling the contracts doubles the best case and leaves
              the worst case at $0$.
          - text: >
              As many as the dealer will write.
            correct: true
            feedback: >
              Every extra contract leaves the worst case at $0$ and lifts the
              best case by $10$. No size is too large for a position that
              cannot lose.
        feedback: >
          The decision needed no probability, no view on the stock and no taste
          for risk: it costs nothing, it never loses, and it sometimes wins.
      - ask: >
          Every desk that sees the quote does what you did. What has to give?
        choices:
          - text: >
              Nothing: the dealer simply carries the loss for a year.
            feedback: >
              Unlimited size means an unlimited liability for the dealer, who
              must reprice the moment the orders arrive. A quote like this
              survives only until someone notices it.
          - text: >
              The stock jumps above $60$ so that the contracts pay.
            feedback: >
              Nothing about the contract forces the stock anywhere. The flow
              hits the mispriced quote, and that is what moves.
          - text: >
              The contract's price rises above $0$ until it is no longer free.
            correct: true
            feedback: >
              Demand is unlimited at a price of zero, so the price must move.
              Once the contract costs something it can lose — pay the price,
              collect nothing — and it is an ordinary bet again.
        feedback: >
          That is the mechanism the whole unit leans on: a free lunch is taken
          in unlimited size, so prices that permit one cannot last.

      - part: The same lunch in other shapes
        ask: >
          A second dealer pays you $3$ today to take a contract that, in one
          year, pays you either $0$ or $5$, depending on a coin she flips. Is
          there any state in which you end up behind?
        choices:
          - text: >
              Yes: if the coin lands on $0$, the contract gave you nothing.
            feedback: >
              The contract gave you nothing in that state, but you kept the $3$
              paid up front. You finish $3$ ahead, not behind.
          - text: >
              You cannot say without the coin's probabilities.
            feedback: >
              The two totals are $3$ and $8$, both positive. No probability can
              make either of them negative.
          - text: >
              No: you keep the $3$, and the contract never costs you anything.
            correct: true
            feedback: >
              The same free lunch with the money moved to today: paid now, and
              nothing can be taken back later.
        feedback: >
          Two shapes of one thing: free today and sometimes paying later, or
          paying you today and never costing later.
      - ask: >
          A third offer is free today and pays $8$ in a year if a stock has
          risen, but you must pay $1$ if it has fallen. A rise is $90\%$
          likely. Is this the same kind of offer as the first two?
        choices:
          - text: >
              Yes: its expected value is $0.9 \cdot 8 - 0.1 \cdot 1 = 7.1$,
              and it costs nothing.
            feedback: >
              The arithmetic is right and the conclusion is not. A million
              copies of this offer lose a million dollars one time in ten, so
              it cannot be taken in unlimited size. A large expected gain is
              still a bet.
          - text: >
              No: there is a state in which you pay.
            correct: true
            feedback: >
              One losing state disqualifies it, however unlikely that state is.
              The first two offers had no losing state at all.
          - text: >
              Yes, because nothing changes hands today.
            feedback: >
              Zero cost today is only half the test. The first offer also had
              to be never negative later, and this one pays $-1$ when the
              stock falls.
        feedback: >
          Odds do not enter. The test is about which states exist, not how
          likely they are.
      - ask: >
          A fourth counterparty hands you $97$ today in exchange for your
          promise to pay $100$ in exactly one year. The riskless rate is $5\%$
          continuously compounded, and you lend the $97$ at it. How much is
          left after you pay the $100$, in dollars?
        expects: "1.97"
        tolerance: 0.01
        hint: >
          Cash lent at $r$ for one year grows by the factor $e^{0.05}$.
        feedback: >
          $97e^{0.05} = 97 \times 1.051271 = 101.97$, and
          $101.97 - 100 = 1.97$. Net cash today is $97 - 97 = 0$ and the year
          ends $1.97$ ahead whatever happens. Equivalently, the promise is
          worth $100e^{-0.05} = 95.12$ today and you were paid $97$ for it.
      - reflect: >
          Four offers: three free lunches and one bet. Write down the test you
          were applying, in terms of what a position costs today and what it
          can pay later — and say what you never needed to know.
        answer: >
          A position is a free lunch when it costs nothing today, never pays a
          negative amount later, and pays something strictly positive in at
          least one state — or, with the money moved to today, when it pays
          you now and never costs you later. The third offer failed on a single
          negative state, and its $90\%$ odds could not rescue it. You never
          used a probability beyond "some state", an expected value, or a view
          on any stock.
      - teach: >
          That test is the definition of an *arbitrage*: a position that costs
          nothing today whose payoff at $T$ is never negative and strictly
          positive in at least one state, or equivalently one that costs
          strictly less than zero today and never pays a negative amount. The
          no-arbitrage axiom says a liquid market contains none, for the reason
          the dealer's ticket showed: any such position is taken in unlimited
          size until the prices allowing it move. The argument stands on
          frictionless assumptions — borrow and lend freely at the riskless
          rate $r$, sell short at no cost, trade any size, face no credit risk.

      - part: What the axiom leans on
        ask: >
          Back to the fourth counterparty's $97$. Suppose the best you can do
          with spare cash is an account paying $2\%$ continuously compounded,
          not the riskless $5\%$. What is left after you pay the $100$, in
          dollars?
        expects: "-1.04"
        tolerance: 0.01
        hint: >
          Same computation, with $e^{0.02}$ in place of $e^{0.05}$.
        feedback: >
          $97e^{0.02} = 97 \times 1.020201 = 98.96$, and
          $98.96 - 100 = -1.04$. The same two quotes are now a loss. The
          arbitrage lived in the assumption that you can lend at $r$; take
          that away and it is gone.
      - ask: >
          A real screen shows two prices that would give an arbitrage worth
          $0.02$ per share, and crossing the bid–ask spread on the two legs
          costs $0.03$ per share. Is the market violating the axiom?
        choices:
          - text: >
              Yes: the gap is real and it is not zero.
            feedback: >
              The trade nets $0.02 - 0.03 = -0.01$ per share. A gap that loses
              money once you pay to capture it is not a free lunch.
          - text: >
              Only if the gap is still there tomorrow.
            feedback: >
              Time does not appear in the definition. The question is whether
              the trade, executed now at real prices, can lose — and it loses
              $0.01$.
          - text: >
              No: after costs the trade loses $0.01$, so there is no free
              lunch to take.
            correct: true
            feedback: >
              With frictions the axiom pins prices to a band whose width is the
              round-trip cost, not to a single frictionless value. Real screens
              show these near-arbitrages all the time.
        feedback: >
          The frictionless assumptions are load-bearing. When one fails — no
          lending at $r$, a spread, a borrow fee — name which one, and the
          apparent violation usually explains itself.
      - ask: >
          A colleague builds a position that costs nothing today and pays
          exactly $0$ in every state at $T$. Is it an arbitrage?
        choices:
          - text: >
              Yes: it costs nothing and it never loses.
            feedback: >
              Two of the three clauses. It also never wins: no state pays
              anything strictly positive, so there is nothing to collect, and
              no reason to take it in any size.
          - text: >
              No: it pays something strictly positive in no state.
            correct: true
            feedback: >
              The strictly-positive-somewhere clause is what makes it a lunch.
              A position that pays zero everywhere is worth zero, and the axiom
              is perfectly happy with it.
          - text: >
              No: an arbitrage must cost strictly less than zero today.
            feedback: >
              That is the other phrasing, not a requirement of both. A
              zero-cost position qualifies if it pays strictly positive in
              some state — this one fails on that clause, not on its cost.
        feedback: >
          Said aloud in an interview: zero cost today, never negative later,
          strictly positive in some state — and the answer to any claimed
          violation is the explicit trade that collects it.
  - node: quant-finance.arbitrage.law-of-one-price
    hook: >
      Once you accept no arbitrage, this is the first hard consequence, and
      it is the one line that turns "no free lunch" into an actual pricing
      tool: match the payoff, and you have matched the price.
    explanation: >
      If two portfolios deliver identical payoffs in every state at time
      $T$, they must trade at identical prices at every earlier time. The
      proof is the standard no-arbitrage proof: if portfolio $X$ costs more
      than portfolio $Y$ today, sell $X$ and buy $Y$. The terminal payoffs
      are identical, so they cancel state by state at $T$, leaving a
      riskless position with zero future exposure and a cash difference
      banked today — exactly the arbitrage the axiom forbids, so the price
      gap cannot exist.

      Two corollaries do essentially all the pricing work later in this
      unit. Price is additive: a package of instruments is worth the sum of
      what its pieces are worth separately, since you can always replicate
      the package by holding the pieces. And a payoff that is zero in every
      state is worth exactly zero today — a portfolio with no future value
      can carry no present value either, or shorting it against nothing
      would be free money.

      Frictions weaken the equality to a band rather than destroying it.
      Bid–ask spreads, borrow fees and financing costs mean two instruments
      with identical payoffs can show slightly different quoted prices in
      practice; what disappears is only the incentive to trade the gap,
      once its round-trip cost exceeds the mispricing.
    worked: >
      Take two zero-coupon bonds from the same issuer, both maturing in
      exactly two years and both paying a face value of $1{,}000$ then —
      identical payoffs in every state, since neither carries any risk of
      default before the other. Suppose bond A trades at $900$ and bond B,
      otherwise identical, trades at $910$. Sell bond B short for $910$ and
      buy bond A for $900$, banking $10$ today. At maturity both bonds pay
      $1{,}000$: use the $1{,}000$ received from A to deliver the $1{,}000$
      owed on the short B position, leaving nothing outstanding. The $10$
      collected today was riskless, so only equal prices are consistent
      with no arbitrage.
    interview: >
      This shows up as "why should X and Y have the same price?" for any
      two instruments with matched payoffs — a swap replicated by bonds, an
      ETF against its basket, a bond against a strip of its own cash flows.
      The expected answer is the sell-the-dear/buy-the-cheap argument stated
      in one breath, not just the conclusion.
    pitfalls: >
      The payoffs must match in every state, not just on average — two
      bonds with the same expected payoff but different default risk are
      not interchangeable, and the law says nothing about them. Also, real
      quotes differing by less than round-trip transaction cost are not a
      violation; the law binds prices up to that cost, not to the last cent.
    recap: >
      Identical payoffs in every future state force identical prices today,
      because any gap is sold on one side, bought on the other, and banked
      risklessly — the tool behind every replication argument that follows.
    dialogue:
      - part: A bond and its pieces
        teach: >
          A government bond pays $5$ in one year and $105$ in two years, and
          trades at $99.00$. The same government's zero-coupon bonds trade too:
          a one-year zero paying $5$ costs $4.80$, and a two-year zero paying
          $105$ costs $93.50$. Nobody doubts the government pays.
      - ask: >
          What does it cost to buy both zeros together?
        expects: "98.30"
        tolerance: 0.001
        feedback: >
          $4.80 + 93.50 = 98.30$. The pair pays $5$ in one year and $105$ in
          two — exactly what the bond pays.
      - ask: >
          The bond costs $99.00$ and the pair of zeros $98.30$. Which trade
          collects the gap?
        choices:
          - text: >
              Buy the bond and sell the two zeros short.
            feedback: >
              That pays $99.00$ and receives $98.30$: you are $0.70$ down
              today, and the later cash flows cancel, so you have locked in a
              loss. Sell the dear side, not the cheap one.
          - text: >
              Buy the zeros and hold them; they are the better investment.
            feedback: >
              Holding the zeros alone leaves you exposed to their price moving
              before you collect. The gap is only yours if you also sell the
              thing it is measured against.
          - text: >
              Sell the bond short and buy the two zeros.
            correct: true
            feedback: >
              You receive $99.00$ and pay $98.30$. The zeros you own throw off
              exactly the cash you owe on the short bond.
        feedback: >
          Sell the dear one, buy the cheap one. Which is "dear" is decided by
          the price of the same cash flows, not by which looks like a better
          investment.
      - ask: >
          With the bond short and the zeros long, what is your net cash flow in
          year two, in dollars?
        expects: "0"
        hint: >
          What does the short bond make you pay, and what does the long zero
          pay you?
        feedback: >
          You owe $105$ on the short bond and receive $105$ from the two-year
          zero: $105 - 105 = 0$. Year one is the same, $5 - 5 = 0$. Nothing is
          left to happen.
      - ask: >
          So how much do you bank today, per bond, in dollars?
        expects: "0.70"
        tolerance: 0.001
        feedback: >
          $99.00 - 98.30 = 0.70$, collected now, with every later cash flow
          cancelled. Zero future exposure and positive cash today: an
          arbitrage.
      - reflect: >
          Why were you sure the $0.70$ was yours to keep? Say what had to be
          true of the two sides, and say what you never needed — no interest
          rate, no forecast — to be sure of it.
        answer: >
          The two sides paid identical amounts on identical dates, so short one
          and long the other cancel state by state, and nothing that happens
          later can touch the cash collected today. You never needed a
          discount rate, a probability or a view: only that the payoffs
          matched. So any two portfolios whose payoffs match in every state
          must cost the same, or the gap is free money.
      - teach: >
          That is the *law of one price*: if two portfolios have identical
          payoffs in every state at $T$, they have identical prices at every
          earlier time. The proof is your trade — if $X$ costs more than $Y$,
          sell $X$, buy $Y$, and the payoffs cancel state by state, leaving the
          price difference as an arbitrage. Two corollaries do most of the
          later work: price is additive, so a package is worth the sum of its
          pieces, and a payoff that is zero in every state is worth zero today.

      - part: Two consequences you will use constantly
        ask: >
          The one-year zero paying $5$ costs $4.80$. What must a one-year zero
          from the same government paying $100$ cost?
        expects: "96"
        hint: >
          How many of the small zeros pay exactly what the big one pays?
        feedback: >
          Twenty small zeros pay $20 \times 5 = 100$ in one year, exactly the
          big zero's payoff. Additivity gives $20 \times 4.80 = 96$. Anything
          else is a trade: sell the dear form, buy the cheap form.
      - ask: >
          The package "long one bond, short both zeros" pays $0$ in year one
          and $0$ in year two. What should it cost today, in dollars?
        expects: "0"
        hint: >
          What does the package pay in each state?
        feedback: >
          A payoff of zero in every state is worth zero. The market was
          charging $99.00 - 98.30 = 0.70$ for it, and your trade was simply
          selling that zero-payoff package at $0.70$.

      - part: Where the law stops binding
        ask: >
          A one-year government zero promising $100$ trades at $95.10$, and a
          one-year corporate zero promising $100$ trades at $92.00$. Is there
          an arbitrage?
        choices:
          - text: >
              Yes: sell the government zero, buy the corporate one, and bank
              $3.10$.
            feedback: >
              In every state where the company pays, the legs cancel. In the
              state where it defaults, you receive nothing and still owe $100$.
              The payoffs differ in a state, so the law does not apply.
          - text: >
              No: the payoffs differ in the state where the company defaults.
            correct: true
            feedback: >
              The law needs the payoffs to match in every state, not in the
              likely ones. The $3.10$ is what the market charges for default
              risk.
          - text: >
              Yes, if the company's default probability is small enough.
            feedback: >
              No probability appears in the law. A tiny default chance still
              leaves a state where the trade loses $100$, so the trade is a
              bet on the company, not an arbitrage.
        feedback: >
          The law of one price is about payoffs state by state. Same promises
          from different promisers are different payoffs.
      - ask: >
          Back to the bond at $99.00$ against zeros at $98.30$. Now borrowing
          the bond to sell it short costs a fee of $0.30$, and crossing the
          bid–ask spread costs $0.15$ on each of the three legs. What does the
          trade net, in dollars per bond?
        expects: "-0.05"
        tolerance: 0.001
        hint: >
          Start from the $0.70$ gap and subtract every cost you pay to capture
          it.
        feedback: >
          $0.70 - 0.30 - 3 \times 0.15 = 0.70 - 0.75 = -0.05$. The gap is real
          and the trade still loses, so the quotes are consistent with no
          arbitrage. With frictions the law pins prices to a band of
          round-trip cost, not to the cent — and in an interview, that band is
          the sentence to add after the sell-dear, buy-cheap argument.
  - node: quant-finance.arbitrage.replication
    hook: >
      This is the single most reusable move in the whole unit: whenever a
      question asks what something is worth and gives you no distribution,
      this is the technique, not a pricing formula to memorize.
    explanation: >
      Replication turns "what is this worth" into four mechanical steps.
      Write the target's payoff at $T$ as a function of the terminal state —
      usually the underlying price $S_T$. Assemble a portfolio out of
      instruments you can already price — shares, zero-coupon bonds,
      forwards, other options — whose payoff matches the target's in every
      state. Invoke the law of one price: since the payoffs are identical,
      the target's fair price today is exactly the cost of assembling that
      portfolio. And if the market disagrees, buy whichever side is cheap,
      sell whichever side is dear, and the difference is riskless profit.

      The technique needs no view on probabilities anywhere in it —
      replication works whether the underlying is about to double or halve,
      which is the whole point of a model-free price. What it does need is a
      big enough menu of instruments you can already price to span the
      target's payoff; if nothing in reach spans it exactly, replication
      stalls until a richer instrument set is available.
    worked: >
      Price a claim that pays $2S_T - 100$ at time $T$ — twice the terminal
      stock price, less a fixed $100$. Step one, the payoff is linear in
      $S_T$: two units of stock minus a fixed cash amount. Step two,
      replicate: hold $2$ shares and go short a zero-coupon bond with face
      value $100$ maturing at $T$; at $T$ this pays $2S_T - 100$ exactly,
      matching in every state. Step three, price it: $2S - 100e^{-rT}$. With
      $S = 60$, $r = 5\%$, $T = 1$: $2(60) - 100e^{-0.05} = 120 - 95.12 =
      24.88$ — so the answer is $24.88$.
    interview: >
      Almost every pricing question in this subject is secretly asking for
      this four-step routine — "how would you price this payoff" should
      trigger writing the payoff as a function of $S_T$ before reaching for
      any formula. Naming the replicating portfolio explicitly is what
      separates a real answer from a guessed one.
    pitfalls: >
      Reaching for a probability-weighted average before checking whether
      the payoff can be spanned by instruments you already price — that is a
      different, model-dependent technique, not this one. Also, an inexact
      replication that only approximately matches the target's payoff proves
      nothing; the match must hold in every state, not on average.
    recap: >
      Write the payoff as a function of $S_T$, build a portfolio of
      already-priced instruments matching it state by state, and the
      portfolio's cost is the price — no probabilities required.
    dialogue:
      - part: A payoff and two forecasts
        teach: >
          A client wants a contract that pays $3S_T - 150$ in one year, where
          $S_T$ is a stock's price then; when that number is negative, the
          client pays you. The stock trades at $52$ and pays no dividends. A
          one-year zero-coupon bond paying $100$ costs $95$.
      - ask: >
          If the stock ends the year at $40$, what does the contract pay the
          client, in dollars?
        expects: "-30"
        feedback: >
          $3 \times 40 - 150 = 120 - 150 = -30$: the client pays you $30$.
          The payoff is a straight line in $S_T$, negative below $50$ and
          positive above.
      - ask: >
          Analyst A expects the stock at $60$ in a year and prices the contract
          at $0.95 \times (180 - 150) = 28.50$. Analyst B expects $48$ and gets
          $0.95 \times (144 - 150) = -5.70$. Whose price do you quote?
        choices:
          - text: >
              A's, because the stock has room to rise from $52$.
            feedback: >
              That is a view, and B holds the opposite one. A price that moves
              by $34$ with an analyst's opinion is not a price anyone can
              defend to a client who shops around.
          - text: >
              The average of the two, $11.40$.
            feedback: >
              Averaging two guesses gives a third guess. Nothing in the
              contract or the market quotes ties the answer to either
              forecast.
          - text: >
              Neither, until you know the full distribution of $S_T$.
            feedback: >
              That route needs a model of the stock, and two honest analysts
              will never agree on one. The market already quotes the two
              things this contract is built from.
          - text: >
              Neither: a price that depends on a forecast is the wrong kind of
              price here.
            correct: true
            feedback: >
              The contract is made of things that already trade at known
              prices. The question is whether you can find them inside it.
        feedback: >
          Forecasts disagree by $34$ on a contract whose ingredients are
          quoted on the screen. There has to be a way to price it from the
          screen.
      - reflect: >
          Using only the stock at $52$ and the zero at $95$, what could you
          hold today so that in one year you own exactly $3S_T - 150$, whatever
          $S_T$ turns out to be?
        hint: >
          Match the part that moves with $S_T$, then the fixed part.
        answer: >
          Three shares supply the $3S_T$, and selling short zeros with a total
          face value of $150$ — one and a half of the $100$ bonds — supplies
          the $-150$. At expiry the package is worth $3S_T - 150$ in every
          state. By the law of one price the contract is worth whatever that
          package costs, and no forecast entered.
      - ask: >
          What does that package cost today, in dollars?
        expects: "13.50"
        tolerance: 0.001
        hint: >
          Three shares at $52$, less what selling $1.5$ zeros at $95$ raises.
        feedback: >
          $3 \times 52 - 1.5 \times 95 = 156 - 142.50 = 13.50$. That is the
          price, whichever analyst is right.
      - teach: >
          That is *pricing by replication*. Write the target's payoff at $T$
          as a function of $S_T$; build a portfolio of instruments you can
          already price — shares, zero-coupon bonds, forwards, other options —
          that pays the same in every state; by the law of one price, the
          target costs what the portfolio costs; and if the market quotes
          something else, buy the cheap side, sell the dear side, and quote
          the difference as profit.

      - part: When someone quotes it differently
        ask: >
          A rival dealer bids $15.00$ for the contract. You sell it to them and
          buy the replicating package. How much do you lock in today, per
          contract, in dollars?
        expects: "1.50"
        tolerance: 0.001
        feedback: >
          You receive $15.00$ and pay $13.50$, so $15.00 - 13.50 = 1.50$ is
          banked now. At expiry the package pays $3S_T - 150$ and you owe the
          rival exactly that.
      - ask: >
          By expiry the stock has crashed to $20$. What has happened to the
          $1.50$?
        choices:
          - text: >
              It is gone: you sold a contract on a stock that collapsed.
            feedback: >
              The contract pays $3 \times 20 - 150 = -90$, so the rival pays
              you $90$; your package is $60$ of stock against $150$ owed, also
              $-90$. The legs cancel, as they do at any $S_T$.
          - text: >
              It is still yours: the package and the contract cancel at every
              $S_T$.
            correct: true
            feedback: >
              The contract pays $-90$ and the package is worth $-90$. Hedged
              state by state, the crash moves nothing you own on net.
          - text: >
              It grew, since the rival now owes you $90$.
            feedback: >
              The rival does owe you $90$, and your package owes exactly $90$
              on net. The two cancel; the only profit is the $1.50$ taken on
              day one.
        feedback: >
          A replicated position has no view left in it. That is why the price
          it produces has no view in it either.

      - part: A payoff that bends
        teach: >
          A different stock trades at $40$. In one year it will be at $50$ or
          at $30$, and nothing else can happen. A one-year zero paying $1$
          costs $0.95$. A claim pays $10$ if the stock ends at $50$ and $0$ if
          it ends at $30$.
      - ask: >
          Hold $\Delta$ shares. Choose $\Delta$ so that the shares' value
          swings between the two states by exactly as much as the claim does.
          What is $\Delta$?
        expects: "0.5"
        hint: >
          The claim swings by $10$; one share swings by $50 - 30$.
        feedback: >
          $\Delta = (10 - 0)/(50 - 30) = 10/20 = 0.5$. Half a share is worth
          $25$ or $15$: the same $10$ swing as the claim.
      - ask: >
          Half a share pays $25$ or $15$. What face value of one-year zeros
          should you add to make the package pay $10$ or $0$? (Negative means
          sell them short.)
        expects: "-15"
        feedback: >
          $25 + B = 10$ and $15 + B = 0$ both give $B = -15$: borrow by selling
          $15$ face of zeros. The package pays $0.5 S_T - 15$, which is $10$
          and $0$ in the two states.
      - ask: >
          What is the claim worth today, in dollars?
        expects: "5.75"
        tolerance: 0.001
        feedback: >
          $0.5 \times 40 - 15 \times 0.95 = 20 - 14.25 = 5.75$. The
          probability of the up move never appeared: two states, two
          instruments, two equations.
      - ask: >
          Now suppose the stock can end at $50$, $40$ or $30$, and the claim
          pays $10$, $0$ and $0$. Can shares and zeros alone replicate it?
        choices:
          - text: >
              Yes: the same half a share and $-15$ of zeros still work.
            feedback: >
              At $S_T = 40$ that package pays $0.5 \times 40 - 15 = 5$, but the
              claim pays $0$. It matches two states and misses the third.
          - text: >
              No: shares and zeros only make straight lines in $S_T$, and this
              payoff has a kink.
            correct: true
            feedback: >
              Shares and bonds span only $a S_T + b$, and no line passes through
              $(30, 0)$, $(40, 0)$ and $(50, 10)$. Three states need a third
              instrument — an option that bends where the claim bends.
          - text: >
              Yes, if you know the probability of each of the three states.
            feedback: >
              Probabilities do not create new payoffs. With them you could
              compute an expected value, but that is a model-dependent price,
              not a replicated one.
        feedback: >
          Replication is only as strong as the menu of instruments you can
          already price. When the menu cannot span the payoff, the technique
          stalls — and the interview answer is to say which instrument is
          missing.
  - node: quant-finance.arbitrage.relative-pricing
    hook: >
      Confusing what no-arbitrage actually proves with what it merely
      sounds like it proves is a fast way to say something wrong under
      interview pressure.
    explanation: >
      Every result built by replication is a relative pricing statement: it
      tells you what an option is worth given the stock and the bond, or
      what a forward is worth given the spot and the rate, but it never
      tells you whether the stock itself is priced correctly, because there
      is nothing left to replicate the stock with. That absence is the
      technique's real strength — the conclusions hold under any
      distribution of $S_T$, so they survive being wrong about the market's
      direction — and simultaneously its hard limit.

      Keep two vocabularies separate under questioning. An arbitrage is
      riskless and self-financing: zero or negative cost, a payoff that is
      never negative. A positive-expected-value trade is neither of those —
      it can lose money, and it costs something to put on. Calling the
      second one "arbitrage" is one of the fastest ways to sound like you do
      not actually know the definition.

      Real limits to arbitrage matter because the frictionless assumptions
      never hold exactly: financing cost eats into the locked profit, margin
      calls can force a position closed before prices converge, a stock
      borrow can be recalled mid-trade forcing the short leg to unwind
      early, and legging into a multi-instrument trade carries execution
      risk if the market moves between fills.
    interview: >
      "Does no-arbitrage tell you the stock is fairly priced?" is a direct
      test of this distinction — the correct answer is no, and naming why
      (nothing to replicate the underlying with) is worth more than the
      one-word answer. Interviewers also probe by describing a real-world
      "arbitrage" that actually carries risk, listening for you to catch it.
    pitfalls: >
      Treating a replication-based price as proof the underlying itself is
      correctly valued — it only prices derivatives relative to the
      underlying. Also, describing a trade with any financing risk, borrow
      risk or execution risk as riskless arbitrage rather than a
      near-arbitrage with real limits.
    recap: >
      Replication prices instruments relative to each other with no model
      at all, but it says nothing about whether the underlying is cheap,
      and real limits to arbitrage keep near-arbitrages from closing
      instantly.
    dialogue:
      - part: What the replication price knows
        teach: >
          A stock trades at $80$ and pays no dividends. A one-year
          zero-coupon bond paying $100$ costs $96$. A contract pays $S_T - 70$
          in one year, where $S_T$ is the stock price then.
      - ask: >
          What is the contract worth today, by replication, in dollars?
        expects: "12.80"
        tolerance: 0.001
        hint: >
          One share supplies $S_T$; a short position in zeros supplies the
          $-70$.
        feedback: >
          One share, short zeros with face value $70$:
          $80 - 0.70 \times 96 = 80 - 67.20 = 12.80$.
      - ask: >
          Overnight the stock drops to $60$ on news you cannot evaluate. A
          colleague says it is now cheap. What does the replication argument
          say about the stock at $60$?
        choices:
          - text: >
              It is fairly priced, because the argument uses the market price.
            feedback: >
              The argument uses the market price as an input; it never checks
              it. It would have used $80$ just as happily, and both cannot be
              fair.
          - text: >
              It is cheap, because yesterday's replication price of the
              contract was based on $80$.
            feedback: >
              Yesterday's $12.80$ was a statement about the contract given a
              stock at $80$. It says nothing about whether $80$ was right, so
              it cannot say $60$ is wrong.
          - text: >
              Nothing at all: the argument only prices the contract given the
              stock.
            correct: true
            feedback: >
              Replication takes the stock and the bond as given and prices what
              is built from them. Whether the stock itself is cheap is a
              question it never asks.
        feedback: >
          The colleague may be right or wrong about the stock. No-arbitrage
          cannot settle it either way.
      - ask: >
          With the stock at $60$, what is the contract worth now, in dollars?
        expects: "-7.20"
        tolerance: 0.001
        feedback: >
          $60 - 67.20 = -7.20$. The contract moved by exactly the $20$ the
          stock moved. The argument transmits the stock's price, right or
          wrong, into everything built from it.
      - reflect: >
          The replication price followed the stock down by $20$ without once
          asking whether $80$ or $60$ was right. Why can the same argument not
          price the stock itself?
        answer: >
          To replicate the stock you would need already-priced instruments
          that pay $S_T$ in every state, and the only such thing is the stock
          itself, or something priced off it. There is nothing more primitive
          to build it from. So no-arbitrage is relative pricing: it prices one
          instrument given others, its conclusions survive any distribution of
          $S_T$, and for exactly that reason it can never say whether the
          underlying is cheap.
      - teach: >
          Keep that as the frame for the whole unit. A replication price is
          model-free because it is relative: it holds whatever the stock does,
          and it says nothing about whether the stock is right. The same
          discipline applies to the words. An *arbitrage* is riskless and
          self-financing; a trade with positive expected value but a losing
          state is a bet, however good, and calling it arbitrage is a red
          flag to anyone listening.

      - part: Arbitrage or a good trade
        ask: >
          Two airline stocks have moved together for years. This month one
          has fallen $10\%$ against the other. A desk buys the laggard and
          shorts the leader, sized so the position costs nothing. Is that an
          arbitrage?
        choices:
          - text: >
              Yes: it costs nothing, and the gap has always closed before.
            feedback: >
              Zero cost is one clause. The other is a payoff that is never
              negative, and nothing stops the gap widening to $20\%$ — the
              two stocks pay different amounts in different states.
          - text: >
              No: the two legs do not pay the same in every state, so the
              position can lose.
            correct: true
            feedback: >
              No replication ties the two stocks together; only a history
              does. It is a relative-value bet, and it may well be a good one.
          - text: >
              Yes, provided the desk holds it long enough.
            feedback: >
              No holding period turns a bet into an arbitrage. If one airline
              goes bankrupt, the gap never closes.
        feedback: >
          "Relative value" and "arbitrage" sound alike and are not. Ask
          whether the legs pay the same in every state; if not, it is a bet.
      - ask: >
          Back to the stock at $80$ and the zero at $96$. The contract paying
          $S_T - 70$ is quoted at $13.50$. You sell it and buy its replicating
          package. How much do you lock in today, in dollars?
        expects: "0.70"
        tolerance: 0.001
        feedback: >
          $13.50 - 12.80 = 0.70$. Here the legs do pay the same in every
          state, so this one is an arbitrage — in a frictionless world.

      - part: When a real arbitrage is still risky
        ask: >
          Suppose instead the contract were quoted at $12.00$: you buy it,
          short the share at $80$ and lend $67.20$, banking $0.80$. Six months
          in, with the stock at $95$, the lender recalls the borrowed share.
          What is your position now?
        choices:
          - text: >
              Unchanged: the $0.80$ was locked in on day one.
            feedback: >
              It was locked in only if you could hold all the legs to expiry.
              Buying the share back at $95$ removes the short leg, and the
              contract and the bonds no longer cancel.
          - text: >
              The hedge is gone: you must buy the share at $95$, and what is
              left is a bet on where the stock ends.
            correct: true
            feedback: >
              Without the short share you hold the contract and the bonds, a
              position whose value moves with $S_T$. A borrow recall turns a
              riskless trade into a directional one at the worst moment.
          - text: >
              Better: the stock rose, and you are long the contract.
            feedback: >
              The rise was hedged by the short share; it is not a gain on net.
              The trouble is that from here on, nothing is hedged.
        feedback: >
          Borrow recall is one of the real limits to arbitrage. Financing
          costs, margin calls before the trade converges, and legging risk are
          the others.
      - ask: >
          At the $13.50$ quote you sell the contract first, and before your
          order for the share fills, the stock ticks to $81.50$. The zeros
          still cost $96$. What does the whole trade lock in, in dollars?
        expects: "-0.80"
        tolerance: 0.001
        hint: >
          Reprice the replicating package with the share at $81.50$.
        feedback: >
          The package now costs $81.50 - 67.20 = 14.30$, against $13.50$
          received: $13.50 - 14.30 = -0.80$. The arbitrage was real on the
          screen and lost money in execution. Said aloud: an arbitrage is
          riskless and self-financing on paper; in practice financing, borrow
          and execution decide whether you collect it.
  - node: quant-finance.arbitrage.forward-pricing
    hook: >
      "Price me a forward" is asked almost verbatim in interviews, and the
      entire answer is one line of replication — get the
      borrow-buy-hold argument cold.
    explanation: >
      For an asset with no income and no storage cost, at a constant
      continuously compounded rate $r$, the forward price for delivery at
      $T$ is $F = Se^{rT}$. The proof is pure replication: borrow $S$ today,
      buy the asset, and hold it. At $T$ you own the asset and owe $Se^{rT}$
      on the loan — exactly the payoff of a long forward struck at
      $Se^{rT}$. Both the loan-and-buy strategy and entering a forward cost
      nothing to set up today, so the strike that makes their payoffs match
      is the one the forward must actually trade at; any other quoted
      strike lets you run one side of the trade against the other for a
      riskless profit.

      Discretely compounded the same argument gives $F = S(1 + r)^{T}$
      instead. An already-existing forward struck at some fixed $K$, rather
      than at the current fair strike, is worth $(F - K)e^{-rT}$ today — its
      payoff discounted back, since a forward always costs nothing to enter
      but a live position with an off-market $K$ generally does not have
      zero value.

      The mental model to keep is that $F$ is not a forecast of $S_T$ — it
      says nothing about where the asset is going. It is today's spot,
      carried forward at the cost of financing the purchase, which is why
      $F$ moves one-for-one with $S$ and with $r$ and never with anyone's
      view of the future.
    worked: >
      $S = 200$, $r = 3\%$, $T = 2$ years, continuously compounded, no
      income: $F = 200e^{0.03 \times 2} = 200e^{0.06} \approx
      200(1.0618) \approx 212.37$ — so the answer is $212.37$.
    interview: >
      The canonical prompt is close to "what's the fair forward price on
      this stock" — the strong answer states $F = Se^{rT}$ and derives it
      from borrow-buy-hold in the same breath, rather than quoting the
      formula alone. Interviewers often follow with "is that a prediction
      of the future price," testing whether you distinguish a carry
      relationship from a forecast.
    pitfalls: >
      Mixing up continuous and discrete compounding — $Se^{rT}$ and
      $S(1+r)^T$ agree only approximately for small $r$, and an interviewer
      who specifies one expects that exact form used. Also, treating $F$ as
      a market view on direction, which invites an easy follow-up you do
      not want to fumble.
    recap: >
      $F = Se^{rT}$ because borrowing to buy the asset now exactly
      replicates a forward at that strike — the forward price is carried
      spot, never a forecast.
    dialogue:
      - part: Agreeing on next year's price
        teach: >
          You want to agree today on the price at which you will buy one share
          of a non-dividend stock in exactly one year. The stock trades at
          $60$, and the riskless rate is $4\%$ continuously compounded. Neither
          side pays anything today. Your first offer is $60$, today's price.
      - ask: >
          Your counterparty, who must deliver the share, plans to borrow $60$
          today at the riskless rate, buy the share now and hold it. How much
          will she owe on the loan in one year, in dollars?
        expects: "62.45"
        tolerance: 0.01
        hint: >
          A loan at $r$ for one year grows by $e^{0.04}$.
        feedback: >
          $60e^{0.04} = 60 \times 1.040811 = 62.45$.
      - ask: >
          At delivery she hands you the share and receives your $60$. What is
          her net result from the whole plan, in dollars?
        expects: "-2.45"
        tolerance: 0.01
        feedback: >
          She receives $60$ and repays $62.45$: $60 - 62.45 = -2.45$, whatever
          the stock has done. The share she bought simply passes to you.
      - ask: >
          You defend $60$: it is today's price, and the stock is as likely to
          rise as to fall. What is wrong with $60$ from your side?
        choices:
          - text: >
              Nothing: with no view on direction, today's price is the fair
              one.
            feedback: >
              A view never enters. At $60$ you can short the share today, lend
              the $60$ at $4\%$, and at delivery buy the share for $60$ to
              close the short — keeping $62.45 - 60 = 2.45$ for certain.
          - text: >
              At $60$ you have a free lunch: short the share now, lend the
              proceeds, and close the short with the share delivered to you.
            correct: true
            feedback: >
              Short at $60$, lend to receive $62.45$, pay $60$ at delivery,
              return the share: $2.45$ riskless. The forward at $60$ hands the
              buyer the interest on $60$ for nothing.
          - text: >
              It is too high, since the stock might fall below $60$.
            feedback: >
              If anything it is too low. The delivery price has to pay for a
              year of financing the share, and $60$ pays for none of it.
        feedback: >
          At $60$ the seller loses $2.45$ for certain if she hedges, and the
          buyer makes $2.45$ for certain if she hedges. No forecast was used on
          either side.
      - reflect: >
          Which delivery price makes both plans — her borrow, buy and hold,
          and your short and lend — come out at exactly zero? Give it in terms
          of $S$, $r$ and $T$, and say why any other price hands one side a
          free lunch.
        answer: >
          $Se^{rT}$, here $62.45$. Borrowing $S$ to buy and hold the share
          leaves you at $T$ owning the share and owing $Se^{rT}$ — exactly a
          long forward struck at $Se^{rT}$, and it costs nothing today, just
          as a forward does. If the quoted price is higher, the seller's plan
          locks in the difference; if lower, the buyer's does. Only one price
          leaves neither with a free lunch.
      - teach: >
          That is the forward price by cash and carry: for an asset with no
          income and no storage cost, a constant continuously compounded rate
          $r$ and delivery at $T$, $F = Se^{rT}$. With discrete annual
          compounding it is $F = S(1+r)^{T}$. An existing forward struck at
          $K$ is worth $(F - K)e^{-rT}$ today: its payoff difference, carried
          back. And $F$ is not a forecast of $S_T$ — it is today's spot,
          carried forward at the cost of financing it.

      - part: Using it, and what it ignores
        ask: >
          Same stock at $60$ and same $4\%$ rate. What is the fair forward
          price for delivery in six months, in dollars?
        expects: "61.21"
        tolerance: 0.01
        feedback: >
          $F = 60e^{0.04 \times 0.5} = 60e^{0.02} = 60 \times 1.020201 = 61.21$.
          Half the time, half the carry.
      - ask: >
          An analyst publishes a forecast of $70$ for the stock in one year.
          What does that do to the one-year forward price?
        choices:
          - text: >
              It pulls $F$ towards $70$, since the forward is a bet on the
              price in a year.
            feedback: >
              If a forward traded at $70$ against a carry price of $62.45$,
              the seller would borrow, buy the share and lock in
              $70 - 62.45 = 7.55$ whether or not the analyst is right.
          - text: >
              Nothing: $F$ is fixed by spot, rate and time.
            correct: true
            feedback: >
              The forecast might move the spot, if it moves the market; then
              $F$ follows the spot. On its own it changes nothing in
              $Se^{rT}$.
          - text: >
              It makes $F$ the average of $62.45$ and $70$.
            feedback: >
              There is no weighting step anywhere in the replication. Any $F$
              above $62.45$ is a free lunch for the seller, whatever the
              forecast.
        feedback: >
          The forward price moves one-for-one with spot and with the rate, and
          never with anyone's view of the future.
      - ask: >
          Suppose you did sign at $60$ for delivery in one year, with the stock
          still at $60$. What is your long forward worth today, in dollars?
        expects: "2.35"
        tolerance: 0.01
        hint: >
          $(F - K)e^{-rT}$, with $F = 62.45$ and $K = 60$.
        feedback: >
          $(62.45 - 60)e^{-0.04} = 2.45 \times 0.960789 = 2.35$. Equivalently
          $S - Ke^{-rT} = 60 - 57.65 = 2.35$. It is the $2.45$ free lunch from
          before, valued today.

      - part: When the carry argument needs repair
        ask: >
          Now the stock will pay a dividend of $2$ in six months. Which way
          does the fair one-year forward price move from $62.45$?
        choices:
          - text: >
              Up: the share is worth more with a dividend attached.
            feedback: >
              The dividend goes to whoever holds the share before delivery —
              the seller running borrow, buy and hold — not to the forward
              buyer. It makes her plan cheaper, so she can accept less.
          - text: >
              Down: the seller holding the share collects the dividend, which
              offsets her financing cost.
            correct: true
            feedback: >
              $Se^{rT}$ assumed holding the share paid nothing. Income on the
              hedge lowers the price at which the hedge breaks even.
          - text: >
              It stays at $62.45$: the formula has no dividend in it.
            feedback: >
              The formula has no dividend in it because it assumed none. Drop
              that hypothesis and the borrow, buy and hold plan collects $2$
              that the forward holder never sees.
        feedback: >
          No income and no storage cost are real hypotheses. Each one changes
          what carrying the asset costs, and so changes $F$.
      - ask: >
          Back to no dividend. The desk quotes the rate as $4\%$ compounded
          once a year rather than continuously. What is the one-year forward
          price, in dollars?
        expects: "62.40"
        tolerance: 0.001
        feedback: >
          $F = S(1 + r)^{T} = 60 \times 1.04 = 62.40$, against $62.45$
          continuously compounded. Use the compounding the question gives you.
          Said aloud: "Borrow $S$, buy the stock, hold it; at $T$ I own the
          stock and owe $Se^{rT}$, which is a long forward — so
          $F = Se^{rT}$, and it is not a forecast."
  - node: quant-finance.arbitrage.cash-and-carry
    hook: >
      This is the trade behind the theorem — if a forward price ever
      strays from $Se^{rT}$, this is the exact mechanical arbitrage that
      pulls it back, in both directions.
    explanation: >
      Forward pricing gives the fair strike; if the market quotes something
      else, cash-and-carry, or its mirror, is the explicit trade that
      exploits the gap. When the forward is quoted rich — above $Se^{rT}$ —
      borrow cash, buy the asset, and sell the forward: at $T$, deliver the
      asset into the forward for the rich strike and repay the loan,
      keeping the difference. When the forward is quoted cheap — below
      $Se^{rT}$ — run it in reverse: short the asset, lend the proceeds, and
      buy the forward; at $T$, collect the loan with interest, take
      delivery at the cheap strike, and use the asset to return what was
      borrowed.

      Both trades cost nothing to set up and pay a certain, positive amount
      at $T$ regardless of where the asset ends up — the defining shape of
      an arbitrage — so only the single strike $F = Se^{rT}$ is consistent
      with no arbitrage existing on either side. In practice the two
      directions are not equally easy: the reverse trade needs a stock
      borrow, which can be costly or simply unavailable, which is one
      reason cheap forwards tend to persist longer than rich ones.
    worked: >
      $S = 50$, $r = 4\%$, $T = 0.5$: fair forward $F = 50e^{0.04 \times
      0.5} = 50e^{0.02} \approx 51.01$. Suppose the market quotes $52.00$ —
      rich. Borrow $50$, buy the asset, sell the forward at $52$. At $T$,
      deliver the asset for $52$ and repay $50e^{0.02} \approx 51.01$,
      keeping $0.99$. Now suppose instead the market quotes $50.50$ —
      cheap. Short the asset for $50$, lend the proceeds, buy the forward at
      $50.50$. At $T$, collect $50e^{0.02} \approx 51.01$, take delivery for
      $50.50$, return the borrowed asset, and keep $0.51$.
    interview: >
      "The forward is trading above fair value — what do you do?" expects
      the specific four-leg trade named in order (borrow, buy, hold, sell
      forward), not just "sell the forward." Stating both directions, and
      which one is usually harder to execute, shows you understand the
      mechanics rather than just the formula.
    pitfalls: >
      Naming only one direction of the trade — the reverse cash-and-carry
      needs a short sale, which real borrow costs and availability can
      block, so interviewers listen for you to flag that asymmetry
      unprompted. Also, forgetting that the profit is the mispricing
      carried forward at $r$, not the raw quoted gap.
    recap: >
      A forward priced away from $Se^{rT}$ in either direction is locked in
      by borrow-buy-sell-forward or its mirror short-lend-buy-forward —
      both riskless, which is exactly why only $F = Se^{rT}$ survives.
    dialogue:
      - part: A forward quoted too high
        teach: >
          A non-dividend stock trades at $40$ and the riskless rate is $3\%$
          continuously compounded. A dealer quotes a one-year forward on the
          stock at $42.00$ and will take either side.
      - ask: >
          What is the fair one-year forward price, in dollars?
        expects: "41.22"
        tolerance: 0.01
        feedback: >
          $F = 40e^{0.03} = 40 \times 1.030455 = 41.22$. The dealer's $42.00$
          is $0.78$ above it.
      - ask: >
          Which side of the dealer's forward do you take?
        choices:
          - text: >
              Buy it: the dealer must be expecting the stock to rise.
            feedback: >
              Buying at $42.00$ commits you to paying more than the carry
              price. The dealer's expectations are irrelevant; the forward is
              simply too expensive.
          - text: >
              Sell it: agree to deliver a share for $42.00$.
            correct: true
            feedback: >
              The forward is rich, so you sell it. The question now is how to
              be sure you can deliver without risk.
          - text: >
              Neither: $0.78$ is within the noise of a forecast.
            feedback: >
              No forecast is involved. The $0.78$ is measured against a
              replication price, and if it survives the trade it is riskless.
        feedback: >
          Sell the dear side. The rich instrument here is the forward, and the
          cheap one is the share bought today on borrowed money.
      - ask: >
          Having sold the forward, what do you do today so that delivery
          carries no risk?
        choices:
          - text: >
              Nothing until delivery; buy the share then for delivery.
            feedback: >
              Then you deliver at $42.00$ a share bought at whatever $S_T$ is.
              If the stock ends at $50$ you lose $8$. That is a short bet on
              the stock, not an arbitrage.
          - text: >
              Borrow $40$, buy the share now, and hold it.
            correct: true
            feedback: >
              You own the share you have promised, and the only thing left is
              a loan of known size. The forward's strike pays it off.
          - text: >
              Sell the share short as well.
            feedback: >
              Short the forward and short the share is twice the same bet: you
              lose on both legs if the stock rises.
        feedback: >
          Borrow, buy, hold, deliver. The position needs no cash today: the
          loan pays for the share, and the forward costs nothing to sell.
      - ask: >
          At delivery you hand over the share for $42.00$ and repay the loan.
          What do you keep, in dollars?
        expects: "0.78"
        tolerance: 0.01
        feedback: >
          The loan has grown to $40e^{0.03} = 41.22$, so you keep
          $42.00 - 41.22 = 0.78$.
      - ask: >
          Does that $0.78$ depend on where the stock ends the year?
        choices:
          - text: >
              Yes: if the stock ends at $30$, the share you hold has lost $10$.
            feedback: >
              The share has lost $10$ of market value, but you never sell it
              at market: you deliver it at $42.00$, fixed today. What it is
              worth to anyone else is irrelevant.
          - text: >
              No: you deliver the share at $42.00$ and owe $41.22$, whatever
              $S_T$ is.
            correct: true
            feedback: >
              Every leg is fixed today: the delivery price, the loan, the
              share in hand. $S_T$ appears nowhere in your cash flows.
          - text: >
              Only if the stock ends above $42.00$.
            feedback: >
              Where the stock ends above or below the strike decides who would
              have won an unhedged forward. Hedged with the share, you are
              indifferent.
        feedback: >
          Zero cost today, a certain $0.78$ at $T$: an arbitrage, built from
          the replication of the forward.

      - part: Too low, run it backwards
        reflect: >
          Now the dealer quotes the one-year forward at $40.50$, below the
          fair $41.22$. Borrowing to buy the share would now lose money.
          Describe the mirror trade: what you do with the share and with cash
          today, which side of the forward you take, and how it closes.
        hint: >
          Reverse every leg of the trade you just ran.
        answer: >
          Sell the share short at $40$ and lend the $40$ at $3\%$; buy the
          forward at $40.50$. At delivery the loan returns $41.22$, you pay
          $40.50$ for the share through the forward, and you hand that share
          back to close the short. It costs nothing today and keeps the gap
          between the carry price and the quote, whatever the stock does.
      - teach: >
          The first trade is *cash and carry*: borrow, buy the asset, sell the
          rich forward. The second is *reverse cash and carry*: short the
          asset, lend the proceeds, buy the cheap forward. Each costs nothing
          today and pays a certain amount at $T$, one whenever $F$ sits above
          $Se^{rT}$ and the other whenever it sits below — which is why only
          $Se^{rT}$ survives on a screen.
      - ask: >
          At the $40.50$ quote, what does the reverse cash and carry pay at
          delivery, in dollars?
        expects: "0.72"
        tolerance: 0.01
        feedback: >
          The loan returns $40e^{0.03} = 41.22$ and the forward costs $40.50$:
          $41.22 - 40.50 = 0.72$. The share you take delivery of closes the
          short, so nothing else is owed.

      - part: The two directions are not equal
        ask: >
          On a real desk, which of the two trades is more likely to be blocked
          or eaten up by costs?
        choices:
          - text: >
              Cash and carry, because borrowing $40$ costs interest.
            feedback: >
              The interest is already in the price: $Se^{rT}$ is exactly the
              cost of that borrowing. It is not an extra cost on top.
          - text: >
              Reverse cash and carry, because it needs a stock borrow, which
              carries a fee and can be refused or recalled.
            correct: true
            feedback: >
              The short leg needs someone to lend you the share. A borrow fee
              comes straight out of the $0.72$, and a hard-to-borrow stock
              makes the trade impossible. Cheap forwards persist longer than
              rich ones for this reason.
          - text: >
              Neither: the two trades are exact mirror images.
            feedback: >
              On paper, yes. In practice the short sale is the leg that can
              fail, and only the reverse trade has one.
        feedback: >
          Flag the asymmetry without being asked: it is what an interviewer
          listens for after you have named the trade.
      - ask: >
          A colleague says the cash and carry at the $42.00$ quote earns
          $42.00 - 40 = 2.00$, since you buy the share at $40$ and deliver it
          at $42.00$. What has the colleague missed?
        choices:
          - text: >
              Nothing: the share costs $40$ and is sold for $42.00$.
            feedback: >
              The $40$ was borrowed for a year, and the year of interest,
              $41.22 - 40 = 1.22$, is a real cost. Without it you would be
              comparing cash on different dates.
          - text: >
              The interest on the loan: the profit is $42.00$ against the
              carried price $41.22$, not against $40$.
            correct: true
            feedback: >
              The profit is the mispricing measured against $Se^{rT}$, paid at
              $T$: $0.78$, not $2.00$.
          - text: >
              The chance that the stock falls below $40$ before delivery.
            feedback: >
              The share is delivered at a fixed price, so its path does not
              matter. The missing piece is the financing cost, not the stock's
              risk.
        feedback: >
          Said aloud: "The forward is rich against $Se^{rT} = 41.22$; I borrow
          $40$, buy the stock, sell the forward at $42$, and collect $0.78$ at
          delivery. Cheap, I run it in reverse — if I can borrow the stock."
  - node: quant-finance.arbitrage.cost-of-carry
    hook: >
      The moment an underlying pays income or costs money to hold, the
      plain $Se^{rT}$ formula is wrong, and this is the fix every commodity
      or dividend-stock forward question is actually testing.
    explanation: >
      Income and holding costs shift the exponent in the forward-pricing
      formula directly. With a continuous income yield $q$ (dividends on an
      index, or a commodity's convenience yield working the other way) and
      a continuous storage cost $u$ (physical storage, insurance),
      $F = Se^{(r + u - q)T}$ — carry costs raise the forward, income lowers
      it, exactly as replication predicts: the holder of the physical asset
      in the borrow-buy-hold trade collects the income and pays the
      storage, while a forward holder does neither until delivery.

      With dividends known as fixed cash amounts on fixed dates rather than
      a continuous yield, the adjustment is cleaner:
      $F = (S - \operatorname{PV}(D))e^{rT}$, replacing $S$ with the
      ex-dividend value of the position, since the physical holder collects
      those dividends along the way and the forward holder does not.

      When $q > r + u$ — income outweighs financing and storage cost — the
      forward trades below spot, called backwardation; when carry cost
      dominates, it trades above spot, called contango. Both are ordinary
      outcomes of the same one formula, not separate phenomena needing
      separate explanations.
    worked: >
      $S = 80$, $r = 6\%$, $T = 0.5$, one dividend of $3$ paid at the
      three-month mark, so its own maturity is $0.25$ years out:
      $\operatorname{PV}(D) = 3e^{-0.06 \times 0.25} = 3e^{-0.015} \approx
      2.96$. Then $F = (80 - 2.96)e^{0.06 \times 0.5} = 77.04\,
      e^{0.03} \approx 77.04(1.0305) \approx 79.39$ — so the answer is
      $79.39$, below the no-dividend forward of $80e^{0.03} \approx 82.44$.
    interview: >
      Any forward question that mentions a dividend, a yield or a storage
      cost is asking for this adjustment, not the plain formula — state
      which of the two forms applies, discrete dividend or continuous
      yield, before plugging in numbers, since using the wrong one is the
      most common wrong answer.
    pitfalls: >
      Discounting the dividend to today at the wrong date — it is the
      present value of the dividend as of the dividend's own payment date,
      not $T$. Also, mixing the continuous-yield form and the
      discrete-dividend form in one problem; pick the one that matches how
      the income is actually described.
    recap: >
      Forward equals spot compounded at the riskless rate, adjusted up for
      storage cost and down for income — $F = Se^{(r+u-q)T}$ continuously,
      or $F = (S - \operatorname{PV}(D))e^{rT}$ for known dividend cash
      flows.
    dialogue:
      - part: A dividend in the middle of the year
        teach: >
          A stock trades at $50$ and will pay a dividend of $1.00$ in exactly
          six months. The riskless rate is $4\%$ continuously compounded. A
          dealer, ignoring the dividend, quotes the one-year forward at
          $50e^{0.04} = 52.04$.
      - ask: >
          You run cash and carry against that quote: borrow $50$, buy the
          share, sell the forward at $52.04$. What happens in six months that
          the plain formula did not plan for?
        choices:
          - text: >
              The share pays you $1.00$, and the forward buyer gets none of it.
            correct: true
            feedback: >
              You hold the physical share, so the dividend is yours. The
              forward buyer only receives the share at delivery, after the
              dividend has gone.
          - text: >
              The dividend is paid to the forward buyer, who owns the share
              economically.
            feedback: >
              A forward buyer owns nothing until delivery. Dividends go to
              whoever holds the share on the record date — here, you.
          - text: >
              Nothing: the share price drops by the dividend, so it cancels.
            feedback: >
              The price does drop by roughly the dividend, but you are not
              exposed to the price: you deliver at a fixed $52.04$. The cash
              dividend is a pure addition to your position.
        feedback: >
          The holder of the asset and the holder of the forward are no longer
          in the same position, and the forward price has to say so.
      - ask: >
          You deposit the $1.00$ dividend at $4\%$ until delivery. What is it
          worth at delivery, in dollars?
        expects: "1.02"
        tolerance: 0.005
        feedback: >
          $1.00e^{0.04 \times 0.5} = e^{0.02} = 1.0202$, about $1.02$.
      - ask: >
          So against the $52.04$ quote, what does your cash and carry net at
          delivery, in dollars?
        expects: "1.02"
        tolerance: 0.005
        hint: >
          Delivery price, minus the loan, plus the deposited dividend.
        feedback: >
          $52.04 - 50e^{0.04} + 1.02 = 52.04 - 52.04 + 1.02 = 1.02$. The
          dealer's quote is too high by exactly the carried value of the
          dividend.
      - reflect: >
          Write a forward price for this stock that leaves the cash and carry
          with nothing. What should replace $S$ in $Se^{rT}$, and why does
          that replacement make sense?
        answer: >
          Replace $S$ by $S - \operatorname{PV}(D)$: the part of the share
          price that is not the dividend. The holder collects the dividend, so
          only $S - \operatorname{PV}(D)$ really has to be financed to
          delivery, and $F = (S - \operatorname{PV}(D))e^{rT}$. It is the same
          as $Se^{rT}$ minus the dividend carried from its own payment date to
          $T$ — the $1.02$ you just found.
      - ask: >
          What is the fair one-year forward price, in dollars?
        expects: "51.02"
        tolerance: 0.01
        hint: >
          $\operatorname{PV}(D) = 1.00e^{-0.02}$.
        feedback: >
          $\operatorname{PV}(D) = e^{-0.02} = 0.9802$, so
          $F = (50 - 0.9802)e^{0.04} = 49.0198 \times 1.040811 = 51.02$.
          Check: $52.04 - 1.02 = 51.02$.
      - teach: >
          That is the cost of carry. Known dividends:
          $F = (S - \operatorname{PV}(D))e^{rT}$, each dividend discounted
          from its own payment date. A continuous income yield $q$ and a
          continuous storage cost $u$ move the exponent instead:
          $F = Se^{(r + u - q)T}$. Whatever carrying the asset costs you
          raises the forward; whatever it pays you lowers it. When income wins,
          $q > r + u$, the forward sits below spot — backwardation.

      - part: Costs push up, income pushes down
        ask: >
          A metal trades at $20$ per unit, storing it costs $u = 2\%$ a year
          continuously, and $r = 4\%$. What is the one-year forward price, in
          dollars?
        expects: "21.24"
        tolerance: 0.01
        feedback: >
          $F = 20e^{(0.04 + 0.02)} = 20 \times 1.061837 = 21.24$. The seller
          who carries the metal pays for the warehouse, and the forward buyer
          who avoids it pays for it in the price.
      - ask: >
          An equity index trades at $400$ with a continuous dividend yield of
          $q = 5\%$, and $r = 3\%$. What is the one-year forward price, in
          dollars?
        expects: "392.08"
        tolerance: 0.01
        feedback: >
          $F = 400e^{(0.03 - 0.05)} = 400e^{-0.02} = 400 \times 0.980199 = 392.08$,
          below spot because the index pays more than financing it costs.
      - ask: >
          A trader sees the index forward at $392.08$ against spot $400$ and
          says the market expects the index to fall. Is that right?
        choices:
          - text: >
              Yes: a forward below spot is the market's forecast of a decline.
            feedback: >
              The forward has no forecast in it. Anyone who borrows $400$,
              buys the index and collects $5\%$ while paying $3\%$ breaks even
              at exactly $392.08$, whatever the index does next.
          - text: >
              No: the forward is below spot because holding the index pays
              more than financing it costs.
            correct: true
            feedback: >
              Backwardation here is carry, not sentiment. The same formula
              that gave contango for the metal gives backwardation for a
              high-yield index.
          - text: >
              Yes, because otherwise everyone would buy the forward and
              short the index.
            feedback: >
              At $392.08$ that trade earns nothing: the short pays the $5\%$
              yield and earns $3\%$ on the proceeds. The forward is exactly
              where carry puts it.
        feedback: >
          Contango and backwardation are two outcomes of one formula, not two
          phenomena.

      - part: Dates and forms
        ask: >
          A candidate prices the stock forward by discounting the $1.00$
          dividend from delivery, $\operatorname{PV}(D) = e^{-0.04}$, and gets
          $51.04$ instead of $51.02$. What is the error?
        choices:
          - text: >
              None worth worrying about: two cents.
            feedback: >
              Two cents on one share is a mispriced trade in size, and with a
              larger dividend or a longer gap the error grows. More to the
              point, the method is wrong.
          - text: >
              The dividend should be discounted from its own payment date,
              six months out, not from delivery.
            correct: true
            feedback: >
              The dividend is cash at six months, so its present value is
              $e^{-0.02}$. Discounting from $T$ pretends it arrives a year
              from now.
          - text: >
              The dividend should not be discounted at all.
            feedback: >
              $S - 1.00$ treats a payment in six months as cash today. Its
              present value is $0.98$, not $1.00$.
        feedback: >
          In an interview, say which form you are using first — known
          dividends, $(S - \operatorname{PV}(D))e^{rT}$, or a continuous
          yield, $Se^{(r - q)T}$ — then plug in, discounting each dividend
          from its own date.
  - node: quant-finance.arbitrage.put-call-parity
    hook: >
      Say this cold: it is the most-quoted identity in the options half of
      every quant interview, and the interviewer expects the replicating
      portfolio, not just the formula.
    explanation: >
      Hypotheses first, because they are graded: a European call and a
      European put on the same underlying, same strike $K$, same expiry
      $T$, no dividends before $T$, a constant riskless rate $r$, no
      frictions. Under exactly those conditions, $C - P = S - Ke^{-rT}$.

      The proof is replication, applied to two portfolios rather than one.
      Portfolio A holds the call plus $K$ face value of zero-coupon bonds
      maturing at $T$. Portfolio B holds the put plus one share. At expiry,
      A is worth $K + (S_T - K)^{+}$ and B is worth $S_T + (K - S_T)^{+}$ —
      and these are the same number in every state, both equal to
      $\max(S_T, K)$, whether $S_T$ ends above or below $K$. Identical
      payoffs in every state force identical prices today by the law of one
      price: $C + Ke^{-rT} = P + S$, which rearranges to the stated
      identity.

      It is worth stressing that this is an identity, not a model: no
      distribution of $S_T$ appears anywhere in the derivation, only that
      both portfolios pay $\max(S_T, K)$. Whatever the market's actual
      prices for $C$ and $P$ are, this equation constrains the two of them
      relative to each other, independent of anyone's view on volatility or
      direction.
    worked: >
      $S = 50$, $K = 45$, $r = 4\%$, $T = 0.5$: $Ke^{-rT} = 45e^{-0.02}
      \approx 44.11$, so $C - P = 50 - 44.11 = 5.89$ — so the answer is
      $5.89$, the call trading nearly six above the put since it is
      comfortably in the money.
    interview: >
      "State put–call parity and prove it" is asked close to verbatim —
      give the hypotheses first, then the two-portfolio argument, then the
      identity; skipping straight to the formula loses points even if the
      formula is correct. A common follow-up asks what breaks if the option
      is American, testing whether you notice early exercise voids the
      clean replication.
    pitfalls: >
      Dropping a hypothesis silently — American-style options, a dividend
      before expiry, or mismatched strikes and expiries all break the
      identity as stated, and each needs its own adjusted form. Also,
      mixing up which portfolio is which — it is call-plus-bond against
      put-plus-stock, not put-plus-bond against call-plus-stock.
    recap: >
      $C - P = S - Ke^{-rT}$ for European options, same strike and expiry,
      no dividends — proved by two portfolios that both pay
      $\max(S_T, K)$ at expiry, hence must cost the same today.
    dialogue:
      - part: Owning the call, owing the put
        teach: >
          A stock trades at $70$ and pays no dividends. A European call and a
          European put on it share a strike of $75$ and expire in one year.
          You buy the call and sell the put.
      - ask: >
          If the stock ends at $90$, what does your combined position pay at
          expiry, in dollars?
        expects: "15"
        feedback: >
          The call pays $90 - 75 = 15$ and the put you sold expires worthless:
          $15 + 0 = 15$.
      - ask: >
          If the stock ends at $60$, what does the combined position pay, in
          dollars?
        expects: "-15"
        feedback: >
          The call expires worthless, and the put you sold is exercised
          against you for $75 - 60 = 15$: $0 - 15 = -15$.
      - ask: >
          What does the combined position pay for a general $S_T$?
        choices:
          - text: >
              $\max(S_T - 75, 0)$
            feedback: >
              That is the call alone. At $S_T = 60$ the position paid $-15$,
              not $0$: below the strike, the sold put takes over.
          - text: >
              $S_T - 75$, in every state
            correct: true
            feedback: >
              Above $75$ the call supplies $S_T - 75$; below it the short put
              supplies $-(75 - S_T)$, the same expression. At $S_T = 75$ both
              are $0$.
          - text: >
              $\lvert S_T - 75 \rvert$
            feedback: >
              That would pay $+15$ at $S_T = 60$. Selling the put makes the
              down side negative, not positive.
        feedback: >
          The kinks of the two options cancel: long call, short put is a
          straight line in $S_T$ with slope one.
      - reflect: >
          You have priced a payoff of $S_T - 75$ before, from things on the
          screen. What is that portfolio, and what must the call minus the put
          cost today, if the riskless rate is $2\%$ continuously compounded?
        hint: >
          The payoff of a forward with delivery price $75$.
        answer: >
          One share, minus $75$ face value of zero-coupon bonds maturing at
          expiry, pays $S_T - 75$ in every state and costs $S - 75e^{-rT}$
          today. Long call, short put pays the same in every state, so by the
          law of one price $C - P = S - Ke^{-rT}$ — no distribution, no
          volatility, no view.
      - ask: >
          What is $C - P$ today, in dollars?
        expects: "-3.51"
        tolerance: 0.01
        feedback: >
          $75e^{-0.02} = 75 \times 0.980199 = 73.51$, so
          $C - P = 70 - 73.51 = -3.51$. The put is worth $3.51$ more than the
          call: the stock sits below the strike's present value.
      - teach: >
          That is *put–call parity*. For a European call and put on the same
          underlying, with the same strike $K$ and expiry $T$, no dividends
          before $T$, a constant riskless rate $r$ and no frictions,
          $C - P = S - Ke^{-rT}$. The usual proof writes it as
          $C + Ke^{-rT} = P + S$: portfolio A is the call plus $K$ face of
          zeros, portfolio B is the put plus one share, and the two pay the
          same at expiry in every state.

      - part: Checking the two portfolios
        ask: >
          With $K = 75$ and the stock ending at $60$, what does portfolio B —
          the put plus one share — pay, in dollars?
        expects: "75"
        feedback: >
          The put pays $75 - 60 = 15$ and the share is worth $60$:
          $15 + 60 = 75$. Portfolio A pays $0 + 75 = 75$ too.
      - ask: >
          Above the strike, say at $S_T = 90$, both portfolios pay $90$; below
          it, both pay $75$. What do they pay in general?
        choices:
          - text: >
              $\max(S_T, K)$
            correct: true
            feedback: >
              The bond guarantees $K$ and the call adds the excess above it;
              the share gives $S_T$ and the put tops it up to $K$. Both are
              "the larger of $S_T$ and $K$".
          - text: >
              $S_T + K$
            feedback: >
              At $S_T = 60$ that would be $135$, but you just found $75$. Only
              one of the two pieces in each portfolio pays in any given state.
          - text: >
              $\min(S_T, K)$
            feedback: >
              At $S_T = 90$ that is $75$, and both portfolios pay $90$ there.
              The options add value, so the floor is $K$, not a cap.
        feedback: >
          Identical payoffs in every state, so identical prices today: no
          probability of $S_T$ ending on either side was needed.
      - ask: >
          The call is quoted at $4.20$. What must the put cost, in dollars?
        expects: "7.71"
        tolerance: 0.01
        feedback: >
          $P = C - (S - Ke^{-rT}) = 4.20 - (-3.51) = 4.20 + 3.51 = 7.71$.
          Parity pins the gap; given either price, it hands you the other.

      - part: The hypotheses carry weight
        ask: >
          Now the call is struck at $75$ and the put at $80$. Does long call,
          short put still price as $S - Ke^{-rT}$ for some $K$?
        choices:
          - text: >
              Yes, using the average strike $77.50$.
            feedback: >
              Between $75$ and $80$ — say $S_T = 78$ — the call pays $3$ and
              the short put costs $2$, for $+1$; the average-strike line gives
              $78 - 77.50 = 0.50$. No single strike works.
          - text: >
              No: between the two strikes both options pay, and the position
              is not a straight line in $S_T$.
            correct: true
            feedback: >
              Below $75$ the position is $S_T - 80$, above $80$ it is
              $S_T - 75$, and in between it bends. A straight line through a
              share and bonds cannot match it, so parity as stated does not
              apply.
          - text: >
              Yes, using the put's strike $80$.
            feedback: >
              Above $80$ the position pays $S_T - 75$, not $S_T - 80$. The
              two kinks no longer cancel.
        feedback: >
          Same strike is what makes the kinks cancel. The same goes for same
          expiry: options expiring on different dates do not settle against
          one $S_T$.
      - ask: >
          Back to a common strike of $75$, but now the stock pays a dividend
          before expiry. Which step of the proof fails?
        choices:
          - text: >
              The call and put no longer pay $(S_T - K)^{+}$ and
              $(K - S_T)^{+}$.
            feedback: >
              European options pay on $S_T$ at expiry, dividend or not. Their
              payoff formulas do not change.
          - text: >
              The bond in portfolio A no longer pays $K$.
            feedback: >
              A zero-coupon bond pays its face value regardless of what the
              stock does.
          - text: >
              The share in portfolio B collects the dividend, so B pays more
              than A.
            correct: true
            feedback: >
              B holds the share and receives the dividend; A does not. The
              payoffs no longer match, so the identity has to be corrected by
              the dividend's present value.
        feedback: >
          Said aloud: "Hypotheses — European, same strike and expiry, no
          dividends, constant rate. Call plus bond and put plus share both pay
          $\max(S_T, K)$, so $C + Ke^{-rT} = P + S$."
  - node: quant-finance.arbitrage.parity-worked
    hook: >
      Getting the sign of $C - P$ instantly, without recomputing the
      formula, is the fast version of this identity that interviewers
      actually want to see.
    explanation: >
      Plugging numbers into put–call parity is mechanical, but the useful
      skill is reading the sign without doing the arithmetic: the call
      holder in $C - P = S - Ke^{-rT}$ effectively defers paying the strike
      until $T$, and the interest that deferral is worth is exactly what
      makes the call the more valuable side when $S$ and $K$ are close. As
      $K$ moves further above $S$, that advantage shrinks and can flip — a
      call struck comfortably above the current spot can be worth less than
      the corresponding put, since the put is now the side more likely to
      pay off.

      The identity pins only the difference $C - P$, never either price on
      its own — parity says nothing about the level of volatility, so it
      constrains one option once you already know the other, but it never
      tells you either price starting from nothing.
    worked: >
      $S = 60$, $K = 65$, $r = 5\%$, $T = 0.5$: $Ke^{-rT} = 65e^{-0.025}
      \approx 63.40$, so $C - P = 60 - 63.40 = -3.40$ — so the answer is
      $-3.40$: with the strike above the spot, the put is worth $3.40$ more
      than the call. If the call is quoted at $2.10$, the put must be
      $5.50$.
    interview: >
      Expect a quoted price for one option and a request for the other —
      the fast path is compute $S - Ke^{-rT}$ once, then add or subtract
      the known price, never solve for $C$ and $P$ separately from scratch.
      Being asked to explain a negative $C - P$ out loud, as here, is a
      common check that you understand the identity rather than having
      memorized one sign pattern.
    pitfalls: >
      Assuming $C > P$ always — that only holds when $S$ is at or above
      $Ke^{-rT}$; struck comfortably out of the money, the put is the more
      valuable side and $C - P$ is negative. Also, forgetting the discount
      on $K$ and using $S - K$ instead of $S - Ke^{-rT}$, which is the raw
      intrinsic-value gap, not the parity gap.
    recap: >
      With $K$ above $S$ the sign can flip: $S - Ke^{-rT}$ pins the exact
      gap, positive or negative, and the discounting of $K$ is what makes
      it differ from plain intrinsic value.
    dialogue:
      - part: An at-the-money pair
        teach: >
          A non-dividend stock trades at $80$. A European call and a European
          put on it are both struck at $80$ and expire in one year, and the
          riskless rate is $3\%$ continuously compounded. The stock sits
          exactly at the strike.
      - ask: >
          Before any arithmetic: which option is worth more?
        choices:
          - text: >
              Neither: at the money, the two are mirror images.
            feedback: >
              The payoffs are mirror images around $80$, but the call's
              holder pays $80$ at expiry while the put's holder receives it.
              Parity measures $S$ against $Ke^{-rT}$, not against $K$, and
              those differ here.
          - text: >
              The put, since stocks can fall to zero.
            feedback: >
              The stock can fall at most $80$ and rise without limit, but
              parity needs no view of either. The sign comes from
              $S - Ke^{-rT}$, and $S = K$ makes that positive.
          - text: >
              The call.
            correct: true
            feedback: >
              Right. With $S = K$, the gap $S - Ke^{-rT}$ is $K$ minus less
              than $K$, so it is positive. The next two questions measure it.
        feedback: >
          The sign of $C - P$ at the money comes from the rate alone.
      - ask: >
          What is $Ke^{-rT}$, in dollars?
        expects: "77.64"
        tolerance: 0.01
        feedback: >
          $80e^{-0.03} = 80 \times 0.970446 = 77.64$.
      - ask: >
          So what is $C - P$, in dollars?
        expects: "2.36"
        tolerance: 0.01
        feedback: >
          $C - P = S - Ke^{-rT} = 80 - 77.64 = 2.36$. The call is worth
          $2.36$ more than the put.
      - reflect: >
          The stock is exactly at the strike, and nothing about direction or
          volatility went in. In words, what is the call holder getting that
          the put holder is not, worth $2.36$?
        answer: >
          The call holder pays the $80$ strike only at expiry, a year from now,
          while the long-put-plus-share side has already paid for the share
          today. Deferring a payment of $80$ for a year is worth the interest
          on it, $80 - 80e^{-0.03} = 2.36$. In general
          $C - P = (S - K) + K(1 - e^{-rT})$: the intrinsic gap plus the
          interest on the strike.
      - teach: >
          That is the fast reading of parity. $C - P = S - Ke^{-rT}$ is the
          stock against the discounted strike, so at the money the call wins
          by the interest on $K$, and as $K$ climbs above $S$ the sign can
          flip. Parity pins the difference and nothing else: it says nothing
          about volatility, so it never gives either price on its own.

      - part: One quote gives the other
        ask: >
          The put is quoted at $6.10$. What must the call cost, in dollars?
        expects: "8.46"
        tolerance: 0.01
        feedback: >
          $C = P + (S - Ke^{-rT}) = 6.10 + 2.36 = 8.46$. Compute the gap
          once, then add or subtract.
      - ask: >
          With no option quoted at all, can parity tell you the call price?
        choices:
          - text: >
              Yes, once you add the stock's expected return.
            feedback: >
              The expected return enters neither parity nor any replication
              price. With the put at $6.10$ the call was $8.46$; with the put
              at $3.00$ it would be $5.36$. Both satisfy parity, and no
              forecast picks between them.
          - text: >
              No: parity fixes $C - P$, and the level of both depends on
              volatility, which parity never sees.
            correct: true
            feedback: >
              A calm stock and a wild one give very different option prices
              with exactly the same gap of $2.36$. One quote is needed to
              anchor the pair.
          - text: >
              Yes: the call is $S - Ke^{-rT} = 2.36$, since the put is worth
              zero at the money.
            feedback: >
              The put is worth zero only if the stock cannot fall, and at the
              money it plainly can. $2.36$ is the gap, not the call.
        feedback: >
          Parity is one equation in two unknowns. Give it one price and it
          returns the other.

      - part: Turning the dials
        ask: >
          Keep $S = K = 80$ and $r = 3\%$, but let the options run two years.
          What is $C - P$ now, in dollars?
        expects: "4.66"
        tolerance: 0.01
        feedback: >
          $80e^{-0.06} = 80 \times 0.941765 = 75.34$, so
          $C - P = 80 - 75.34 = 4.66$. Twice the deferral, roughly twice the
          gap.
      - ask: >
          Back to one year, but now the riskless rate is $0$. What is
          $C - P$, in dollars?
        expects: "0"
        feedback: >
          $Ke^{0} = 80$, so $C - P = 80 - 80 = 0$. With no interest, deferring
          the strike is worth nothing, and the at-the-money call and put cost
          the same.
      - ask: >
          Rate back at $3\%$, one year, stock at $80$, but both options now
          struck at $85$. What is $C - P$, in dollars?
        expects: "-2.49"
        tolerance: 0.01
        hint: >
          Discount the new strike first.
        feedback: >
          $85e^{-0.03} = 85 \times 0.970446 = 82.49$, so
          $C - P = 80 - 82.49 = -2.49$: the put is now worth more. Using
          $S - K = -5$ would forget the interest on the strike and miss by
          $2.51$. Said aloud: "Stock minus discounted strike: $80$ against
          $82.49$, so the put is $2.49$ richer."
  - node: quant-finance.arbitrage.parity-violation
    hook: >
      "The screen shows a call and a put that violate parity — what trade
      do you put on?" is asked with real numbers, and the conversion is the
      exact, nameable answer.
    explanation: >
      When the market's quoted gap $C - P$ exceeds the fair gap
      $S - Ke^{-rT}$, the call is priced rich relative to the put, and the
      trade that exploits it is called a conversion: sell the rich call,
      buy the put, buy the share, funding the net outlay by borrowing at
      $r$. By the parity proof, the share plus the put minus the call is
      worth exactly $K$ at expiry in every state — a synthetic riskless bond
      — so repaying the loan against that guaranteed $K$ locks in the
      mispricing, carried forward to expiry at the borrowing rate.

      When the gap is too small instead — the put priced rich relative to
      the call — the mirror trade, a reversal, does the same job with every
      leg flipped: buy the call, sell the put, short the share, and lend the
      resulting credit instead of borrowing. Either way the size of the
      profit at expiry is today's mispricing compounded forward by
      $e^{rT}$, not the raw mispricing itself.
    worked: >
      $S = 50$, $K = 50$, $r = 4\%$, $T = 1$: fair gap $50 - 50e^{-0.04}
      \approx 50 - 48.04 = 1.96$. Suppose the screen shows $C = 5.00$,
      $P = 2.00$, a gap of $3.00$ — the call is rich. Conversion: short the
      call ($+5$), long the put ($-2$), long the share ($-50$), a net
      outlay of $47$, funded by borrowing at $4\%$. At expiry the share
      plus put minus call is worth exactly $K = 50$ regardless of $S_T$;
      repay $47e^{0.04} \approx 48.92$ and keep $50 - 48.92 = 1.08$ — so the
      answer is $1.08$, close to the $1.04$ mispricing carried one year
      forward.
    interview: >
      State the four legs in order — short the rich option, long the cheap
      one, take the matching stock position, finance the difference — and
      name the trade a "conversion" or "reversal" by ear; interviewers use
      these terms and expect them back.
    pitfalls: >
      Sizing the profit as the raw mispricing rather than the mispricing
      compounded forward at $r$ to expiry — the two only coincide when $r$
      or $T$ is near zero. Also, getting the stock leg backwards: a
      conversion is long the share, a reversal is short it, and mixing them
      up inverts the whole trade's sign.
    recap: >
      A gap wider than fair means sell the call, buy the put, buy the share
      and borrow the rest — a conversion — locking in today's mispricing
      carried forward to expiry; a reversal is the exact mirror when the
      gap is too narrow.
    dialogue:
      - part: A gap too wide
        teach: >
          A non-dividend stock trades at $60$. European options struck at $60$
          expire in one year, and the riskless rate is $2\%$ continuously
          compounded. The screen shows the call at $4.50$ and the put at
          $2.40$.
      - ask: >
          What gap $C - P$ does parity require, in dollars?
        expects: "1.19"
        tolerance: 0.01
        feedback: >
          $60e^{-0.02} = 60 \times 0.980199 = 58.81$, so the fair gap is
          $60 - 58.81 = 1.19$.
      - ask: >
          The quoted gap is $4.50 - 2.40 = 2.10$. By how much is it too wide,
          in dollars?
        expects: "0.91"
        tolerance: 0.01
        feedback: >
          $2.10 - 1.19 = 0.91$. The call costs $0.91$ too much relative to
          the put.
      - ask: >
          What does that tell you about the two quotes?
        choices:
          - text: >
              The call is overpriced and the put is fairly priced.
            feedback: >
              Parity cannot say that. The put might be $0.91$ too cheap and
              the call fair, or both a little off. It sees only the gap, so
              the trade has to use both options.
          - text: >
              The call is rich relative to the put: sell the call, buy the
              put.
            correct: true
            feedback: >
              Whichever leg is wrong in absolute terms, the pair is mispriced
              against each other, and selling one against the other captures
              it.
          - text: >
              The put is rich, since the gap should be smaller.
            feedback: >
              A gap that is too large means the call is too expensive relative
              to the put, not the other way round. Selling the put would add
              to the mispricing you are trying to capture.
        feedback: >
          Parity prices the options against each other, so it tells you which
          one to sell against the other — not which one is wrong.
      - ask: >
          Short the call and long the put, you lose if the stock rises: the
          pair pays $60 - S_T$ at expiry. What removes that exposure?
        choices:
          - text: >
              Nothing: the two options already offset.
            feedback: >
              They offset each other's kinks, not the stock. Short call, long
              put pays $60 - S_T$ — at $S_T = 80$ that is $-20$.
          - text: >
              Buy one share.
            correct: true
            feedback: >
              The share adds $S_T$, and $60 - S_T + S_T = 60$. The stock
              position cancels the slope of the options.
          - text: >
              Sell one share short.
            feedback: >
              That doubles the exposure: $60 - S_T - S_T$ loses twice as fast
              when the stock rises.
        feedback: >
          The stock leg is what turns an options position into a riskless one.
      - reflect: >
          Short call, long put, long share: what is that package worth at
          expiry, whatever $S_T$ turns out to be? And given that, how should
          you pay for it today?
        answer: >
          Exactly $60$, the strike, in every state: above $60$ the call is
          exercised and you deliver your share for $60$; below $60$ you
          exercise the put and sell your share for $60$. The package is a
          synthetic zero-coupon bond paying $K$. So you fund its cost by
          borrowing at $r$, and whatever $60$ exceeds the loan repayment by is
          riskless profit.
      - teach: >
          That trade is a *conversion*: short the rich call, long the put,
          long the share, financed by borrowing. It is worth exactly $K$ at
          expiry, so it locks in the mispricing carried forward at $r$. When
          the gap is too narrow — the put rich relative to the call — the
          mirror is a *reversal*: long the call, short the put, short the
          share, and lend the credit.

      - part: Counting the money
        ask: >
          What is the conversion's net outlay today, in dollars?
        expects: "57.90"
        tolerance: 0.001
        hint: >
          You pay for the share and the put, and receive for the call.
        feedback: >
          $60 + 2.40 - 4.50 = 57.90$, borrowed at $2\%$.
      - ask: >
          What does the conversion pay you at expiry, after repaying the loan,
          in dollars?
        expects: "0.93"
        tolerance: 0.01
        feedback: >
          The loan grows to $57.90e^{0.02} = 57.90 \times 1.020201 = 59.07$,
          and the package pays $60$: $60 - 59.07 = 0.93$.
      - ask: >
          The mispricing was $0.91$, but the trade pays $0.93$. Why?
        choices:
          - text: >
              Rounding: the two should be equal.
            feedback: >
              The gap is real: $0.91e^{0.02} = 0.93$. The two coincide only
              when $r$ or $T$ is close to zero.
          - text: >
              The $0.91$ is a price today and the $0.93$ is paid at expiry:
              the mispricing carried forward a year at $2\%$.
            correct: true
            feedback: >
              $0.9119 \times 1.020201 = 0.93$. Locking in $0.91$ today and
              collecting $0.93$ in a year are the same trade.
          - text: >
              The share earned $0.02$ while you held it.
            feedback: >
              The share pays no dividend, and its price moves are fully hedged.
              The extra comes from timing: today's dollars against expiry's.
        feedback: >
          Quote the profit at expiry as the mispricing times $e^{rT}$, not the
          raw gap.

      - part: The mirror trade
        ask: >
          The next day the screen shows the call at $3.20$ and the put at
          $2.60$, with the stock still at $60$. Which trade do you put on?
        choices:
          - text: >
              The conversion again: sell the call, buy the put, buy the share.
            feedback: >
              The quoted gap is now $0.60$, below the fair $1.19$: the put is
              rich relative to the call. A conversion would sell the cheap side
              and lose about $0.60$.
          - text: >
              The reversal: buy the call, sell the put, sell the share short,
              and lend the credit.
            correct: true
            feedback: >
              The gap is $0.59$ too narrow, so buy the cheap call, sell the
              rich put, and short the share to cancel the slope. The package
              owes exactly $60$ at expiry.
          - text: >
              Buy both options; the call looks cheap.
            feedback: >
              Long call and long put is a bet on a big move, and it costs
              $5.80$ with no guaranteed payoff. Parity only prices the pair
              against each other and the stock.
        feedback: >
          Gap too wide: conversion. Gap too narrow: reversal. The stock leg
          always sits on the same side as the put.
      - ask: >
          What does the reversal pay at expiry, after paying the $60$ the
          package owes, in dollars?
        expects: "0.60"
        tolerance: 0.01
        hint: >
          First the credit today: the put and the share sold, less the call
          bought.
        feedback: >
          Credit today: $2.60 + 60 - 3.20 = 59.40$, lent to grow to
          $59.40 \times 1.020201 = 60.60$. At expiry the package costs exactly
          $60$, so you keep $0.60$ — the $0.59$ mispricing carried forward.
          Said aloud: "Gap too narrow, put rich: reversal — long call, short
          put, short stock, lend the credit."
  - node: quant-finance.arbitrage.synthetics
    hook: >
      Every trading desk quotes conversions and boxes because parity turns
      any one of call, put, stock and bond into a combination of the other
      three — this is how desks manufacture whichever leg is missing or
      mispriced.
    explanation: >
      Rearranging $C - P = S - Ke^{-rT}$ solves for any single instrument
      in terms of the other three. Synthetic long stock is long call, short
      put, plus $K$ face value of bonds: $S = C - P + Ke^{-rT}$. Synthetic
      call is long put, long share, short $Ke^{-rT}$ of bonds. The working
      use is always the same: price the synthetic from the other three
      legs, compare it to the direct quote, and trade whichever side is out
      of line, since the whole package is delta-flat by construction — its
      value does not move with small moves in $S_T$.

      Two named combinations recur constantly. A conversion is long share,
      long put, short call at one strike and expiry — a package worth
      exactly $K$ at expiry no matter what $S_T$ does, functioning as a
      synthetic riskless bond; a reversal is its exact opposite. Combine a
      conversion at one strike with a reversal at a higher strike and the
      two option legs cancel down to a box spread: riskless, and paying
      exactly the gap between the two strikes at expiry — which is why
      desks use boxes to lend or borrow through the options market rather
      than through a bank.
    worked: >
      Price a box spread from strikes $K_1 = 90$ and $K_2 = 100$, $r = 5\%$,
      $T = 1$: its fair value is the discounted spread, $(K_2 - K_1)e^{-rT}
      = 10e^{-0.05} \approx 9.51$, and its certain payoff at expiry is
      $10$. If the box is quoted at $9.00$, buy it, funding the purchase by
      borrowing at $5\%$: repay $9.00e^{0.05} \approx 9.46$ at $T$, collect
      the guaranteed $10$, and keep $10 - 9.46 = 0.54$ — so the answer is
      $0.54$.
    interview: >
      "Build synthetic stock from options" or "price a box spread" are both
      standard prompts — the fast answer rearranges $C - P = S - Ke^{-rT}$
      live rather than reciting a memorized synthetic formula, since every
      synthetic is the same one identity solved for a different variable.
    pitfalls: >
      Forgetting that a box's fair value is the discounted strike spread,
      not the raw spread — comparing a quoted box price to $K_2 - K_1$
      directly instead of to $(K_2-K_1)e^{-rT}$ misjudges every box as
      mispriced. Also, mismatching strikes or expiries between the
      conversion and reversal legs, which breaks the option cancellation
      that makes the box riskless.
    recap: >
      Any one of call, put, stock and bond is replicable from the other
      three by rearranging parity — conversions and reversals synthesize a
      bond from options and stock, and two of them at different strikes
      combine into a riskless box worth the discounted strike spread.
    dialogue:
      - part: A stock nobody will lend you
        teach: >
          You need to be short one share of a non-dividend stock for a year.
          It trades at $45$, but no one will lend it to you. European calls
          and puts on it, struck at $50$, expire in one year, and the riskless
          rate is $4\%$ continuously compounded.
      - ask: >
          You buy the put and sell the call. If the stock ends at $30$, what
          does the pair pay, in dollars?
        expects: "20"
        feedback: >
          The put pays $50 - 30 = 20$ and the call you sold expires worthless.
          At $S_T = 65$ the put is worthless and the call costs you $15$. In
          every state the pair pays $50 - S_T$.
      - ask: >
          A short share pays $-S_T$. What do you add to the pair, paying
          $50 - S_T$, to get exactly that?
        choices:
          - text: >
              Buy zero-coupon bonds with face value $50$.
            feedback: >
              That adds $+50$ at expiry, giving $100 - S_T$. You need to take
              $50$ away, not add it.
          - text: >
              Nothing: the pair already behaves like a short share.
            feedback: >
              It moves like a short share — down one for one as the stock
              rises — but it is $50$ too high in every state. A short share
              does not hand you $50$ at expiry.
          - text: >
              Sell zero-coupon bonds with face value $50$: borrow
              $50e^{-0.04}$ today and owe $50$ at expiry.
            correct: true
            feedback: >
              $50 - S_T - 50 = -S_T$ in every state. Long put, short call,
              short $K$ of bonds is a short share built without borrowing the
              stock.
        feedback: >
          Options supply the slope, bonds supply the level. Together they
          rebuild the instrument you could not get.
      - reflect: >
          You just solved for a short share using options and bonds. Look at
          parity, $C - P = S - Ke^{-rT}$. Which other instruments could you
          build the same way, and how do you read off the recipe for each?
        answer: >
          Any one of the four — call, put, share, bond — can be built from the
          other three, because parity is one equation linking them: solve it
          for the one you want, and each sign tells you long or short. A
          share is $C - P + Ke^{-rT}$; a call is $P + S - Ke^{-rT}$; a put is
          $C - S + Ke^{-rT}$; and a bond is $S + P - C$. There is one identity
          and four ways to read it, not four formulas to memorise.
      - teach: >
          Those are *synthetics*. Synthetic long stock is long call, short put,
          plus $K$ of bonds; synthetic call is long put, long share, short
          $Ke^{-rT}$ of bonds; synthetic put and synthetic bond read off the
          same identity. The working use: price the synthetic from the screen,
          compare it with the direct quote, and trade whichever is out of line.
          The package you end up holding is flat to the stock by construction.

      - part: Price the synthetic, compare with the screen
        ask: >
          The put struck at $50$ is quoted at $7.30$. What does a synthetic
          call cost — long put, long share, short $50e^{-0.04}$ of bonds — in
          dollars?
        expects: "4.26"
        tolerance: 0.01
        feedback: >
          $50e^{-0.04} = 50 \times 0.960789 = 48.04$, so the synthetic call
          costs $7.30 + 45 - 48.04 = 4.26$.
      - ask: >
          The call itself is quoted at $4.90$. You sell it and buy the
          synthetic. What do you lock in today, in dollars?
        expects: "0.64"
        tolerance: 0.01
        feedback: >
          $4.90 - 4.26 = 0.64$. At expiry the synthetic pays exactly what the
          call you sold costs you, in every state.
      - ask: >
          After that trade you are short the call, long the put, long the
          share, and owe $50$ on the bonds. If the stock ends at $70$, what
          does the whole package pay at expiry, in dollars?
        expects: "0"
        hint: >
          Go leg by leg: the call you sold, the put, the share, the bonds.
        feedback: >
          The short call costs $70 - 50 = 20$, the put pays $0$, the share is
          worth $70$, and the bonds owe $50$: $-20 + 0 + 70 - 50 = 0$. At
          $S_T = 30$ it is $0 + 20 + 30 - 50 = 0$ too. Long share, long put,
          short call at one strike is worth exactly $K$ at expiry in every
          state — a synthetic bond called a *conversion*; its opposite, long
          call, short put, short share, is a *reversal*. Here the conversion's
          $50$ repays the bonds, and the $0.64$ banked today is what remains.

      - part: Two strikes make a box
        teach: >
          Add a second strike, $40$, with the same one-year expiry. You put on
          a reversal at $40$ — long call, short put, short share — and a
          conversion at $50$ — short call, long put, long share.
      - ask: >
          At expiry, what does the combined package pay, in dollars?
        expects: "10"
        hint: >
          What is each piece worth at expiry, and what happens to the two
          shares?
        feedback: >
          The conversion at $50$ is worth $50$ and the reversal at $40$ owes
          $40$, for $50 - 40 = 10$. The long share and the short share cancel,
          leaving four options that pay the strike gap in every state. That is
          a *box spread*.
      - ask: >
          What is the box worth today, in dollars?
        expects: "9.61"
        tolerance: 0.01
        feedback: >
          A certain $10$ in one year is worth $10e^{-0.04} = 9.61$ today. A box
          is a zero-coupon bond made of options, which is how desks lend and
          borrow through the options market.
      - ask: >
          A dealer offers this box at $9.80$. A colleague says buy it, since it
          pays $10$. What do you do?
        choices:
          - text: >
              Buy it: $9.80$ is less than the $10$ it pays.
            feedback: >
              The $10$ arrives in a year; $9.80$ is paid today. Funding $9.80$
              at $4\%$ costs $9.80e^{0.04} = 10.20$ at expiry, a loss of
              $0.20$.
          - text: >
              Sell it at $9.80$ and lend the proceeds at $4\%$.
            correct: true
            feedback: >
              Fair value is $9.61$, so $9.80$ is rich. Selling it and lending
              the proceeds grows to $10.20$, against the $10$ you owe at
              expiry: about $0.20$ at expiry, the $0.19$ mispricing carried
              forward.
          - text: >
              Neither: a box has no risk, so any price is fair.
            feedback: >
              No risk means exactly one fair price — the discounted strike
              gap. Any other price is an arbitrage.
        feedback: >
          Compare a box with $(K_2 - K_1)e^{-rT}$, never with $K_2 - K_1$. In
          an interview, derive every synthetic live by solving parity for the
          leg you need.
  - node: quant-finance.arbitrage.parity-dividends
    hook: >
      An interviewer who adds "and the stock pays a dividend" to a parity
      question is testing whether you know which side of the identity
      moves, and by how much.
    explanation: >
      Dividends paid before expiry move value from the call side of parity
      to the put side. With dividends of known present value
      $\operatorname{PV}(D)$, $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$;
      with a continuous yield $q$ instead, $C - P = Se^{-qT} - Ke^{-rT}$.
      The reasoning traces straight back to the replicating portfolio: the
      share leg of that portfolio collects the dividends along the way, so
      only the ex-dividend part of the spot needs to be funded by the bond
      leg — the call holder, who owns no share yet, never sees that income.

      The tidiest way to hold every case in one formula is to write parity
      in terms of the forward price itself: $C - P = (F - K)e^{-rT}$, since
      $F$ already embeds whatever dividend, yield or storage adjustment
      applies. This is the version worth defaulting to once the forward is
      known, because it never needs re-deriving for a new carry structure.
    worked: >
      $S = 200$, $K = 190$, $r = 5\%$, $T = 1$, continuous dividend yield
      $q = 3\%$: $C - P = 200e^{-0.03} - 190e^{-0.05} \approx 194.09 -
      180.73 = 13.36$ — so the answer is $13.36$, below the no-dividend gap
      of $200 - 190e^{-0.05} \approx 19.27$ by roughly the value of the
      yield.
    interview: >
      Whenever a parity question mentions a dividend or an index yield, the
      expected move is to substitute into
      $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$ or the yield form
      immediately, and being able to fall back on $C - P = (F-K)e^{-rT}$
      when the forward is already given saves a step.
    pitfalls: >
      Applying the discrete-dividend form and the continuous-yield form to
      the same problem, or forgetting the dividend altogether and reusing
      the no-dividend identity — the gap always shrinks once real income is
      subtracted from the share side. Also, discounting the dividend at $T$
      instead of at its own payment date.
    recap: >
      Dividends or yield shrink the call–put gap by moving value to the put
      side — $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$ for known
      dividends, $Se^{-qT} - Ke^{-rT}$ for a continuous yield, or
      $(F-K)e^{-rT}$ in forward terms covering both at once.
    dialogue:
      - part: A dividend before expiry
        teach: >
          A stock trades at $90$. European calls and puts on it are struck at
          $90$ and expire in one year, and the riskless rate is $4\%$
          continuously compounded. The company will pay a dividend of $3$ in
          three months.
      - ask: >
          Ignoring the dividend, what would parity say $C - P$ is, in dollars?
        expects: "3.53"
        tolerance: 0.01
        feedback: >
          $90e^{-0.04} = 90 \times 0.960789 = 86.47$, so
          $C - P = 90 - 86.47 = 3.53$.
      - ask: >
          Recall the two portfolios: A is the call plus $90$ face of zeros, B
          is the put plus one share. Over the year, with the dividend, which
          one ends up with more?
        choices:
          - text: >
              A, since the call gains when the dividend is announced.
            feedback: >
              The share price drops by about the dividend when it is paid, so
              the call, which pays on $S_T$, is hurt, not helped. And A holds
              no share, so it collects nothing.
          - text: >
              They still match: both pay $\max(S_T, 90)$ at expiry.
            feedback: >
              At expiry they do. But B also received $3$ in cash three months
              in, from the share it holds, and A received nothing.
          - text: >
              B, by the dividend: its share collects the $3$ and A has no
              share.
            correct: true
            feedback: >
              Same payoff at expiry plus an extra cash flow for B. B is worth
              more than A by the dividend's present value.
        feedback: >
          The parity proof assumed holding the share paid nothing until $T$.
          With a dividend, that assumption fails on B's side only.
      - reflect: >
          B is worth more than A by the dividend's present value. Rewrite
          parity so it holds again: what replaces $S$, and why does the call
          holder lose out?
        answer: >
          Replace $S$ by $S - \operatorname{PV}(D)$: the share is worth its
          price, but $\operatorname{PV}(D)$ of that is cash that B collects and
          the options never see. So
          $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$. The call holder owns no
          share before expiry and pays on the post-dividend price, so the
          dividend moves value from the call side to the put side.
      - ask: >
          With the dividend, what is $C - P$, in dollars?
        expects: "0.56"
        tolerance: 0.01
        hint: >
          Discount the $3$ from its own date, three months out.
        feedback: >
          $\operatorname{PV}(D) = 3e^{-0.04 \times 0.25} = 3e^{-0.01} = 2.97$,
          so $C - P = 90 - 2.97 - 86.47 = 0.56$. The dividend took almost all
          of the call's $3.53$ advantage.
      - teach: >
          That is parity with dividends and carry. For known dividends,
          $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$; for a continuous yield
          $q$, $C - P = Se^{-qT} - Ke^{-rT}$. One form covers every carry at
          once: $C - P = (F - K)e^{-rT}$, with $F$ the forward price, since
          the forward already has the dividend, yield or storage cost built
          in.

      - part: The forward form
        ask: >
          What is the one-year forward price on this stock, in dollars?
        expects: "90.58"
        tolerance: 0.01
        hint: >
          The cost of carry with a known dividend.
        feedback: >
          $F = (90 - 2.97)e^{0.04} = 87.03 \times 1.040811 = 90.58$. Then
          $(F - K)e^{-rT} = 0.58 \times 0.960789 = 0.56$ — the same gap, with
          no separate dividend term to remember.
      - ask: >
          An index trades at $300$ with a continuous dividend yield of
          $q = 4\%$, and $r = 4\%$. One-year European options are struck at
          $300$. What is $C - P$, in dollars?
        expects: "0"
        feedback: >
          $C - P = 300e^{-0.04} - 300e^{-0.04} = 0$. With $q = r$ the forward
          is $300e^{0} = 300 = K$, so $(F - K)e^{-rT} = 0$: at the forward,
          the call and put cost the same.

      - part: Which way, and when
        ask: >
          Back to the stock at $90$. The company raises the coming dividend
          from $3$ to $5$, still paid in three months. What is $C - P$ now, in
          dollars?
        expects: "-1.42"
        tolerance: 0.01
        feedback: >
          $\operatorname{PV}(D) = 5e^{-0.01} = 4.95$, so
          $C - P = 90 - 4.95 - 86.47 = -1.42$. The put is now worth more than
          the call even though the stock sits exactly at the strike.
      - ask: >
          Suppose instead the dividend of $3$ is paid in fourteen months, after
          the options expire. Which form of parity applies?
        choices:
          - text: >
              $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$, with the dividend
              discounted fourteen months.
            feedback: >
              Portfolio B sells or delivers its share at expiry, before the
              dividend is paid, so it never collects it. Subtracting it would
              take away value B never had.
          - text: >
              The no-dividend form, $C - P = S - Ke^{-rT}$.
            correct: true
            feedback: >
              Only dividends paid before expiry separate the two portfolios. A
              later one is irrelevant to options that have already settled.
          - text: >
              Neither: parity fails whenever the stock pays dividends.
            feedback: >
              Parity survives dividends; it just needs the right adjustment,
              and here the adjustment is zero.
        feedback: >
          Said aloud: "Dividends before expiry come off the stock side —
          $S - \operatorname{PV}(D)$ — or in one line, $C - P = (F - K)e^{-rT}$."
  - node: quant-finance.arbitrage.option-bounds
    hook: >
      "Without a pricing model, what can you say about this option's
      price?" is answered entirely by these bounds — no volatility, no
      distribution, just arbitrage.
    explanation: >
      For European options on a non-dividend stock, four inequalities hold
      with nothing more than no-arbitrage: $0 \le C \le S$ and
      $C \ge (S - Ke^{-rT})^{+}$; symmetrically $0 \le P \le Ke^{-rT}$ and
      $P \ge (Ke^{-rT} - S)^{+}$. The upper bounds are the easy direction: a
      call can never be worth more than the stock itself, since owning the
      stock outright dominates the right to buy it, and a put can never be
      worth more than $Ke^{-rT}$, the most it could ever pay discounted to
      today.

      The lower bounds fall straight out of put–call parity plus the fact
      that option prices cannot be negative: from $C = P + S - Ke^{-rT}$ and
      $P \ge 0$, immediately $C \ge S - Ke^{-rT}$, and the same substitution
      with $C \ge 0$ gives the put's floor. Since $C \ge 0$ always as well,
      the two lower bounds combine into the stated $(\cdot)^{+}$ form —
      whichever of the two terms is larger.

      American options only add value on top of these: $C_A \ge \max(C,
      S-K)$ and $P_A \ge \max(P, K-S)$, since the American holder has every
      right the European holder has plus the option to exercise early.
    worked: >
      $S = 70$, $K = 80$, $r = 3\%$, $T = 0.5$: $Ke^{-rT} = 80e^{-0.015}
      \approx 78.81$. The call's floor is $(70 - 78.81)^{+} = 0$ — since
      the stock is well below the discounted strike, the ordinary
      $C \ge 0$ bound is the one that actually binds, not the parity-based
      floor — while its ceiling stays $C \le 70$. The put's floor is
      $(78.81 - 70)^{+} = 8.81$, so the put must trade between $8.81$ and
      $78.81$ — so the answer is a put no cheaper than $8.81$.
    interview: >
      Given a spot, strike, rate and expiry with no volatility mentioned,
      the interviewer wants both bounds stated and, ideally, which one is
      binding — an out-of-the-money option like the call above has its
      lower bound collapse to the trivial $0 \ge \dots$, and noticing that
      is the actual test.
    pitfalls: >
      Quoting the parity-derived lower bound as if it always binds — when
      the stock is well below the discounted strike, plain nonnegativity is
      the tighter floor for the call, and the reverse for the put. Also,
      applying these bounds to American options directly; American values
      need the separate, looser inequalities.
    recap: >
      Every European option price sits in a box fixed purely by arbitrage
      — $0 \le C \le S$ with floor $(S-Ke^{-rT})^{+}$, and symmetrically for
      the put — with no model or volatility involved.
    dialogue:
      - part: A call that looks fairly priced
        teach: >
          A non-dividend stock trades at $110$. A European call struck at $100$
          expires in six months, the riskless rate is $6\%$ continuously
          compounded, and nobody will tell you the volatility. A dealer quotes
          the call at $11.50$, comfortably above its intrinsic value of $10$.
      - ask: >
          Try this against the quote: buy the call at $11.50$, sell the share
          short at $110$, and lend the $98.50$ difference for six months. At
          expiry, what is the least you can end up with, in dollars?
        expects: "1.50"
        tolerance: 0.01
        hint: >
          The loan returns $98.50e^{0.03}$. Then ask what it costs you to hand
          back the share, in the worst case.
        feedback: >
          The loan returns $98.50e^{0.03} = 98.50 \times 1.030455 = 101.50$.
          If $S_T \ge 100$ you exercise the call, pay $100$ and return the
          share: $1.50$ left. If $S_T < 100$ you buy the share for less than
          $100$, and keep more. The worst case is $1.50$.
      - ask: >
          So what does that say about the quote of $11.50$?
        choices:
          - text: >
              It is fine: it is above the intrinsic value of $10$, and the rest
              is time value.
            feedback: >
              Above intrinsic is not enough. The trade you just ran costs
              nothing and ends at least $1.50$ ahead, so $11.50$ is an
              arbitrage, time value or not.
          - text: >
              It cannot be judged without knowing the volatility.
            feedback: >
              The trade never used volatility: in every state it ended at least
              $1.50$ ahead. Some prices are ruled out by arbitrage alone.
          - text: >
              It is too low: buying it against the stock is a free lunch.
            correct: true
            feedback: >
              Zero cost, never negative, positive in every state. Something
              stronger than intrinsic value is holding the call up.
        feedback: >
          The intrinsic value $S - K$ is not the floor. The floor is whatever
          price makes your trade stop paying.
      - reflect: >
          At what call price does that trade stop being free? Write the floor
          in terms of $S$, $K$, $r$ and $T$, and say why it uses $Ke^{-rT}$
          rather than $K$.
        answer: >
          The trade pays off when the call costs less than $S - Ke^{-rT}$:
          then the loan of $S - C$ grows to more than $K$, enough to exercise
          and return the share in every state. So $C \ge S - Ke^{-rT}$. The
          strike is paid at expiry, not today, so what matters is its present
          value; the call holder keeps the interest on $K$ until then, which is
          exactly why the floor sits above $S - K$.
      - ask: >
          What is that floor here, in dollars?
        expects: "12.96"
        tolerance: 0.01
        feedback: >
          $100e^{-0.03} = 97.04$, so $C \ge 110 - 97.04 = 12.96$. The quote
          of $11.50$ was $1.46$ below it — the $1.50$ at expiry, discounted.
      - teach: >
          These are the *model-free option bounds*. For European options on a
          non-dividend stock, $0 \le C \le S$ and $C \ge (S - Ke^{-rT})^{+}$;
          $0 \le P \le Ke^{-rT}$ and $P \ge (Ke^{-rT} - S)^{+}$. The floors
          come from parity and nonnegativity: $C = P + S - Ke^{-rT}$ and
          $P \ge 0$ give $C \ge S - Ke^{-rT}$. The ceilings come from what the
          option can pay at most.

      - part: Ceilings
        ask: >
          The same call is quoted at $112$, above the stock's $110$. What do
          you do?
        choices:
          - text: >
              Buy it: a call that costs more than the stock must be expected
              to rise.
            feedback: >
              A call at $112$ is strictly worse than the share at $110$: the
              share pays $S_T$, the call pays at most $S_T - 100$. Paying more
              for less is the wrong side.
          - text: >
              Sell the call and buy the share, banking $2$ today.
            correct: true
            feedback: >
              If the call is exercised you deliver the share and receive $100$;
              if not, you keep a share worth $S_T \ge 0$. Nothing is ever owed
              beyond what you hold, and the $2$ is free.
          - text: >
              Nothing: an upper bound on a call does not exist.
            feedback: >
              It does: the call never pays more than the share, so it can
              never be worth more than the share.
        feedback: >
          The call's ceiling is $S$: the right to buy the share is worth less
          than owning it.
      - ask: >
          What is the most a European put struck at $100$, six months out, can
          be worth today, in dollars?
        expects: "97.04"
        tolerance: 0.01
        feedback: >
          The best a put can ever pay is $100$, if the stock goes to zero, and
          that payment comes at expiry. Its present value is
          $100e^{-0.03} = 97.04$.
      - ask: >
          Someone quotes that put at $98.00$. You sell it and lend the $98.00$
          for six months. What is the least you end up with at expiry, in
          dollars?
        expects: "0.98"
        tolerance: 0.01
        feedback: >
          The loan returns $98.00 \times 1.030455 = 100.98$, and the most the
          put can cost you is $100$: at least $0.98$ left in every state.

      - part: Which bound binds
        ask: >
          The stock falls to $85$. What is the floor on the put struck at
          $100$, in dollars?
        expects: "12.04"
        tolerance: 0.01
        feedback: >
          $P \ge 97.04 - 85 = 12.04$. Note that the floor is below the put's
          intrinsic value of $15$: a European holder waits for the strike, so
          only its present value counts.
      - ask: >
          With the stock at $85$, a candidate says the call struck at $100$
          must be worth at least $85 - 97.04 = -12.04$. What is the right
          statement?
        choices:
          - text: >
              The call is worth at least $-12.04$, as stated.
            feedback: >
              True and useless: no option has a negative price. The parity
              floor is real, but here a stronger floor exists.
          - text: >
              The call is worth at least $0$, since nonnegativity is the
              tighter floor here.
            correct: true
            feedback: >
              The floor is $(S - Ke^{-rT})^{+}$: whichever of $S - Ke^{-rT}$
              and $0$ is larger. Out of the money, plain nonnegativity binds.
          - text: >
              The call is worth at least $15$, its distance from the strike.
            feedback: >
              The call is out of the money; it pays nothing unless the stock
              climbs above $100$. $15$ is the put's intrinsic value, not the
              call's.
        feedback: >
          Said aloud: state both bounds and say which one binds. In the money,
          the parity floor; out of the money, zero.
  - node: quant-finance.arbitrage.no-early-exercise
    hook: >
      "Would you ever exercise an American call early on a stock with no
      dividends?" has one correct answer, and the arbitrage bound proves it
      in two lines.
    explanation: >
      For an American call on a non-dividend stock with $r > 0$, early
      exercise is never optimal, so the American call is worth exactly what
      the European call is worth. The proof is immediate from the option
      bounds: $C_A \ge C \ge S - Ke^{-rT} > S - K$ whenever $r>0$ and
      $T>0$, and $S - K$ is all that exercising the option collects. Since
      the option alive is worth strictly more than the option exercised,
      selling it always beats exercising it.

      Two equivalent economic readings are worth having ready. Exercising
      early pays the strike a full period ahead of when it is actually
      owed, forfeiting the interest that deferral is worth — exactly the
      gap between $Ke^{-rT}$ and $K$. And by parity, giving up the option
      early also throws away the protective put embedded in it, worth
      $P \ge 0$, for nothing in return.

      The argument depends entirely on there being no dividend before
      expiry — a dividend transfers value out of the stock the option
      holder doesn't own yet, and exercising just before a large enough
      dividend can genuinely be the better choice.
    worked: >
      $S = 90$, $K = 80$, $r = 6\%$, $T = 0.5$: exercising now collects the
      intrinsic value $S - K = 10$. The arbitrage floor is
      $S - Ke^{-rT} = 90 - 80e^{-0.03} \approx 90 - 77.64 = 12.36$, strictly
      above $10$ — so the answer is that holding is worth at least $12.36$
      against only $10$ from exercising, a $2.36$ loss avoided by not
      exercising.
    interview: >
      The expected answer names the inequality $C \ge S - Ke^{-rT} > S - K$
      directly rather than an intuition-only argument, and immediately
      flags that a dividend breaks it — interviewers often follow up by
      asking exactly that.
    pitfalls: >
      Reasoning from intuition alone, "why give up time value," without
      being able to produce the actual inequality — interviewers want the
      arbitrage bound, not just the conclusion. Also, forgetting the
      no-dividend hypothesis is doing all the work; stating the result as
      universally true for American calls is wrong.
    recap: >
      An American call on a non-dividend stock is never worth exercising
      early, because its arbitrage floor $S - Ke^{-rT}$ already exceeds the
      intrinsic value $S-K$ that exercising collects — so it is worth
      exactly the European call.
    dialogue:
      - part: Cash it in now?
        teach: >
          You hold an American call struck at $120$ with six months to run, on
          a stock that pays no dividends. The stock has rallied to $150$, the
          riskless rate is $5\%$ continuously compounded, and you are tempted
          to exercise and lock in the gain.
      - ask: >
          What does exercising now collect, in dollars?
        expects: "30"
        feedback: >
          You pay $120$ and receive a share worth $150$: $150 - 120 = 30$, the
          intrinsic value.
      - ask: >
          A colleague says that deep in the money the call is basically the
          stock, so exercising costs nothing. What is wrong with that?
        choices:
          - text: >
              Nothing: at $150$ against $120$, the call will almost surely
              finish in the money anyway.
            feedback: >
              Likely or not, exercising changes when you pay the strike and
              what happens in a crash. Both cost something, and neither
              depends on the odds.
          - text: >
              Exercising gives up the stock's upside.
            feedback: >
              After exercising you own the share, so you keep every dollar of
              upside. What you give up is elsewhere.
          - text: >
              Exercising pays the $120$ now instead of in six months.
            correct: true
            feedback: >
              The call lets you pay the strike at expiry. Exercising hands over
              $120$ six months early, and the interest on it is gone.
        feedback: >
          The call and the share differ in when the strike is paid, and in what
          happens below the strike. Price the first one.
      - ask: >
          How much is it worth to pay $120$ in six months rather than today,
          in dollars?
        expects: "2.96"
        tolerance: 0.01
        feedback: >
          $120e^{-0.025} = 120 \times 0.975310 = 117.04$, so deferring saves
          $120 - 117.04 = 2.96$ in today's money.
      - reflect: >
          Interest is one thing exercise gives up. Think about the stock
          falling to $100$ before expiry: what else does holding the call give
          you that owning the share does not, and what instrument is it?
        answer: >
          Holding the call, a crash to $100$ costs you only what the call was
          worth; owning the share, you bear the whole fall below $120$. That
          protection is a put struck at $120$. By parity the call is
          $C = (S - K) + (K - Ke^{-rT}) + P$: intrinsic value, plus the
          interest on the strike, plus a put. Exercising keeps the first and
          throws away the other two.
      - ask: >
          So without any model, what is the least the call is worth alive, in
          dollars?
        expects: "32.96"
        tolerance: 0.01
        feedback: >
          $C \ge S - Ke^{-rT} = 150 - 117.04 = 32.96$, already above the $30$
          that exercising collects — and that ignores the put entirely.
      - teach: >
          That is why you never exercise an American call early on a stock
          with no dividends before expiry, when $r > 0$:
          $C_A \ge C \ge S - Ke^{-rT} > S - K$, and $S - K$ is all that
          exercising collects. Selling the call always beats exercising it, so
          the early-exercise right is worthless and $C_A = C$.

      - part: Putting a price on what you would lose
        ask: >
          The European put struck at $120$ with six months to run trades at
          $0.40$. What does parity say the call is worth, in dollars?
        expects: "33.36"
        tolerance: 0.01
        feedback: >
          $C = P + S - Ke^{-rT} = 0.40 + 150 - 117.04 = 33.36$. Exercising for
          $30$ would throw away $3.36$: the $2.96$ of interest and the $0.40$
          put.

      - part: Where the argument stops
        ask: >
          Suppose the riskless rate were $0$. Does exercising now become a good
          idea?
        choices:
          - text: >
              Yes: with no interest to lose, exercising is free.
            feedback: >
              The interest term vanishes, but the put does not. Exercising
              still gives up protection worth $P \ge 0$ for nothing.
          - text: >
              It is never better, and is strictly worse whenever the put is
              worth anything.
            correct: true
            feedback: >
              With $r = 0$, $C = (S - K) + P \ge S - K$. Exercise can at best tie
              with holding, and only if the put is worthless.
          - text: >
              Yes, because the call's floor drops to zero.
            feedback: >
              With $r = 0$ the floor is $S - K = 30$, not zero. It equals the
              exercise value; it does not fall below it.
        feedback: >
          The strict inequality uses $r > 0$; the weak one survives without it.
      - ask: >
          Now the stock will pay a dividend of $8$ tomorrow, and the call still
          has six months to run. Could exercising today be right?
        choices:
          - text: >
              No: the inequality $C \ge S - Ke^{-rT}$ still holds.
            feedback: >
              That floor was derived for a stock with no dividends before
              expiry. A dividend leaves the share before the call holder can
              own it, so the floor drops by about the dividend's value and
              can sit below $S - K$.
          - text: >
              Yes, it can be: exercising today captures the $8$ dividend, which
              outweighs the $2.96$ of interest given up.
            correct: true
            feedback: >
              The dividend goes to shareholders, and the call holder is not
              one. The share drops by about $8$ tomorrow; exercising first
              collects it, at the cost of the interest and the put.
          - text: >
              Only if the dividend is larger than the stock's whole move since
              you bought the call.
            feedback: >
              The comparison is the dividend against what exercise gives up —
              interest on the strike and the put — not against your past
              gains.
        feedback: >
          Said aloud: "No dividends: $C_A \ge S - Ke^{-rT} > S - K$, so never
          exercise early and the American call equals the European. A large
          enough dividend breaks it — exercise just before it."
  - node: quant-finance.arbitrage.american-put-early
    hook: >
      This is the one clean exception in the whole unit — the single case
      where "never exercise early" flips to "sometimes you must," and
      interviewers ask for it specifically because it is the exception.
    explanation: >
      The argument for calls reverses for puts because of a
      cash-versus-time-value asymmetry: exercising an American put
      immediately pays $K - S$ in cash right now, while a European put can
      never be worth more than $Ke^{-rT}$, the present value of its single
      best possible outcome, since even the maximum payoff $K$ itself only
      arrives at $T$, discounted back.

      Deep in the money, with $S$ near zero, exercising collects close to
      the full strike $K$ today, but the European put is capped at
      $Ke^{-rT}$, strictly less than $K$. Since the American put must be
      worth at least what immediate exercise pays, $P_A \ge K - S$, while
      $P \le Ke^{-rT} < K$, there is a stock price low enough that $P_A$
      strictly exceeds $P$ — early exercise becomes optimal below some
      critical boundary, and that boundary has no closed form.

      The interview-ready summary pairs directly with the call result: an
      American call on a non-dividend stock equals the European call, but
      an American put can be strictly more valuable than the European put.
      On a non-dividend stock, parity itself degrades from an equality to
      the two-sided band $S - K \le C_A - P_A \le S - Ke^{-rT}$ once early
      exercise is a live possibility.
    worked: >
      $K = 50$, $r = 4\%$, $T = 2$, and $S = 2$ — deep in the money.
      Exercising now collects $K - S = 48$ in cash. The European put's
      ceiling is $Ke^{-rT} = 50e^{-0.08} \approx 46.16$, strictly below the
      $48$ available from exercising — so the answer is that the American
      put must be worth at least $48$, strictly more than any European put
      on the same terms could be.
    interview: >
      "Does the no-early-exercise result apply to puts?" is a near-automatic
      follow-up after stating it for calls — the correct answer names the
      asymmetry directly: exercising a put realizes cash now, exercising a
      call gives up cash it would otherwise still owe, and that difference
      is why the results are not symmetric.
    pitfalls: >
      Assuming the no-early-exercise argument for calls transfers to puts
      by symmetry — it does not, precisely because a put's exercise value
      is cash received rather than cash deferred. Also, expecting a
      closed-form exercise boundary for the American put; none exists in
      general, only the qualitative fact that one exists below some
      critical stock price.
    recap: >
      Deep in the money, exercising an American put now for $K-S$ in cash
      can beat any European put, which is capped at $Ke^{-rT} < K$ — the
      one case where early exercise survives, unlike the American call.
    dialogue:
      - part: A stock near zero
        teach: >
          You hold an American put struck at $80$ with one year to run, on a
          stock that pays no dividends. The company has nearly failed and the
          stock trades at $1$. The riskless rate is $6\%$ continuously
          compounded.
      - ask: >
          What does exercising the put now collect, in dollars?
        expects: "79"
        feedback: >
          You sell a share worth $1$ for $80$: $80 - 1 = 79$, in cash, today.
      - ask: >
          The most the put could ever pay at expiry is $80$, if the stock goes
          all the way to $0$. What is that best case worth today, in dollars?
        expects: "75.34"
        tolerance: 0.01
        feedback: >
          $80e^{-0.06} = 80 \times 0.941765 = 75.34$. Waiting can at best
          deliver $80$ a year from now, which is worth $75.34$ today.
      - ask: >
          You have just learned never to exercise an American call early on a
          non-dividend stock. What about this put?
        choices:
          - text: >
              The same holds by symmetry: never exercise early.
            feedback: >
              Exercise now gives $79$ in cash; waiting gives at most $75.34$ in
              today's money, even in the best possible case. The symmetry
              fails, and the next question is why.
          - text: >
              Hold on: the stock might still fall to $0$, so waiting keeps the
              upside.
            feedback: >
              The stock can fall at most $1$ more, and the full $80$ would
              arrive a year late. The most holding to expiry can deliver is
              worth $75.34$ today, against $79$ now.
          - text: >
              Exercise now: $79$ today beats the best that holding to expiry
              could ever be worth.
            correct: true
            feedback: >
              $79 > 75.34$. No model, no volatility: exercising now dominates
              every possible outcome of holding the put to expiry.
        feedback: >
          Here the right to exercise early is worth something, so the American
          put is worth strictly more than the European one.
      - reflect: >
          For the call, exercising early meant paying the strike early and
          losing interest on it. What is different about exercising a put, and
          why does that flip the conclusion when the put is deep in the money?
        answer: >
          Exercising a put means receiving the strike, not paying it. Waiting
          delays cash you could be earning interest on, and deep in the money
          that interest — about $80 - 75.34$ here — dwarfs what waiting could
          still add, since the stock can only fall to zero. For the call,
          waiting deferred a payment; for the put, waiting defers a receipt.
          That asymmetry is the whole result.
      - teach: >
          So *American puts can be worth exercising early*. Exercise gives
          $P_A \ge K - S$, while a European put is capped at $Ke^{-rT} < K$;
          when $S$ is low enough, $P_A > P$ strictly, and below some critical
          stock price exercise is optimal. That boundary has no closed form.
          With early exercise live, parity on a non-dividend stock loosens
          to a band: $S - K \le C_A - P_A \le S - Ke^{-rT}$.

      - part: How deep is deep enough
        ask: >
          Below what stock price is exercising the put sure to beat even the
          European put's ceiling, in dollars?
        expects: "4.66"
        tolerance: 0.01
        hint: >
          Compare $K - S$ with $Ke^{-rT}$.
        feedback: >
          $K - S > Ke^{-rT}$ exactly when $S < K - Ke^{-rT} = 80 - 75.34 = 4.66$.
          Below $4.66$ no European put can match what exercise pays today, so
          the American put is certainly worth more than the European.
      - ask: >
          Is $4.66$ the price at which you should start exercising?
        choices:
          - text: >
              Yes: above it, waiting is better.
            feedback: >
              Above $4.66$ the comparison is simply inconclusive. $Ke^{-rT}$ is
              a ceiling on the European put, not its value; the real put is
              worth less, so exercise can still beat it above $4.66$.
          - text: >
              No: $4.66$ only marks where the bound proves the early-exercise
              right is worth something; where to exercise needs a model.
            correct: true
            feedback: >
              The actual boundary depends on the stock's volatility, which
              decides how much waiting is worth, and it has no closed form.
              Arbitrage shows the exercise right has value; it does not locate
              the edge.
          - text: >
              No: the boundary is the strike, $80$, since any in-the-money
              put should be exercised.
            feedback: >
              A put just in the money still has a great deal of value from the
              stock possibly falling further. Exercising at $79$ for $1$ of
              intrinsic value would throw that away.
        feedback: >
          Arbitrage proves that an exercise region exists. Locating its edge is
          a modelling question.

      - part: Calls and puts side by side
        ask: >
          For American options on a non-dividend stock with $r > 0$, which
          statement is right?
        choices:
          - text: >
              Both equal their European counterparts.
            feedback: >
              True for the call. The put at a stock price of $1$ was worth at
              least $79$ as an American and at most $75.34$ as a European.
          - text: >
              Both can be strictly worth more than their European counterparts.
            feedback: >
              Not the call: $C_A \ge S - Ke^{-rT} > S - K$ means exercising
              never pays, so the early-exercise right adds nothing.
          - text: >
              The call equals the European call; the put can be worth strictly
              more than the European put.
            correct: true
            feedback: >
              Cash deferred makes the call's early exercise worthless; cash
              received makes the put's valuable deep in the money.
        feedback: >
          This pair is the standard interview answer, and the reason —
          paying the strike versus receiving it — is what the interviewer is
          listening for.
      - ask: >
          Now suppose $r = 0$. Would you ever strictly prefer to exercise the
          put early?
        choices:
          - text: >
              Yes: at a stock price of $1$, collecting $79$ now is still best.
            feedback: >
              With $r = 0$ the European put's floor is $K - S = 79$ itself, so
              holding is worth at least as much as exercising. There is no
              interest to earn on the $79$.
          - text: >
              No: with no interest on the strike, waiting costs nothing and
              exercise is never strictly better.
            correct: true
            feedback: >
              The whole case for early exercise was interest on cash received.
              Remove the interest and waiting weakly dominates, just as for the
              call.
          - text: >
              Yes, whenever the put is in the money.
            feedback: >
              In the money is not enough even with $r > 0$, and with $r = 0$
              nothing favours exercise at all.
        feedback: >
          Said aloud: "American call equals European; American put can be worth
          more, because exercising a deep in-the-money put collects the strike
          now and earns interest on it."
  - node: quant-finance.arbitrage.fx-triangular
    hook: >
      Triangular FX arbitrage is the law of one price wearing a currency
      costume, and the mechanical trade — three legs, one loop — is asked
      almost verbatim across trading desks.
    explanation: >
      Three currencies give three exchange rates, and the law of one price
      demands they multiply to exactly one around the loop — otherwise
      converting through all three and back is not a neutral round trip, it
      is a source of free money. Given rates for currency A into B, B into
      C, and a direct quote for A into C, the implied cross from the first
      two legs is the product of those two rates; whenever the direct quote
      disagrees with that implied cross, one path through the loop is
      strictly cheaper than the other.

      The trade itself has no distribution of anything in it and no
      position held afterward — it is three simultaneous conversions,
      ending back in the starting currency with strictly more of it than
      you began with. Which direction to run the loop is read straight off
      which side of the implied cross the direct quote sits on; the
      round-trip spread on all three legs is the real-world hurdle, and
      shaving it thin enough to trade profitably is a latency business
      rather than an analytical one.
    worked: >
      Quotes: GBP/USD $= 1.30$, EUR/USD $= 1.05$, and a direct GBP/EUR
      quote of $1.26$. The implied cross from the first two legs is
      $1.30/1.05 \approx 1.2381$, so the direct quote of $1.26$ makes the
      pound rich against the euro. Starting with $1{,}000{,}000$ USD:
      convert to GBP at $1.30$ to get $769{,}230.77$ GBP; sell those for
      EUR at the rich quoted $1.26$ to get $969{,}230.77$ EUR; convert back
      to USD at $1.05$ to get $1{,}017{,}692.31$ USD — a riskless profit of
      $17{,}692.31$ USD, about $1.77\%$, with no position held at the end.
    interview: >
      "Given these three FX quotes, is there an arbitrage, and how would
      you trade it?" expects the implied-cross comparison stated first,
      then the specific three-leg loop in the correct direction — naming
      which leg is mispriced, not just noticing the rates disagree.
    pitfalls: >
      Getting a quote convention backwards — dividing instead of
      multiplying, or inverting which currency is the base — flips the
      direction of the whole loop and turns a profitable trade into a
      loss. Also, ignoring the three round-trip spreads: a cross a few
      basis points off the implied rate is often entirely inside
      transaction cost and not tradeable at all.
    recap: >
      Three FX rates must multiply to one around any loop; when they do
      not, converting through all three legs and back turns a fixed
      starting amount into strictly more of the same currency, riskless.
    dialogue:
      - part: Three quotes that should agree
        teach: >
          Three quotes print at the same instant, with no spreads. AUD/USD is
          $0.6500$: one Australian dollar buys $0.65$ US dollars. USD/CAD is
          $1.4000$: one US dollar buys $1.40$ Canadian dollars. And a direct
          AUD/CAD quote is $0.9000$: one Australian dollar buys $0.90$
          Canadian dollars.
      - ask: >
          Route one Australian dollar through US dollars into Canadian
          dollars. How many Canadian dollars does it get you?
        expects: "0.91"
        tolerance: 0.0001
        feedback: >
          $1$ AUD buys $0.65$ USD, and $0.65$ USD buys $0.65 \times 1.40 = 0.91$
          CAD. That is the implied cross.
      - ask: >
          The direct quote gives $0.90$ CAD per AUD, the route through US
          dollars $0.91$. What does that say?
        choices:
          - text: >
              The Australian dollar is cheap at the direct quote: buy it there,
              with Canadian dollars.
            correct: true
            feedback: >
              The direct quote gives you an Australian dollar for $0.90$ CAD,
              when the market's own other two legs value it at $0.91$. Buy where
              it is cheap, sell where it is dear.
          - text: >
              The Australian dollar is rich at the direct quote: sell it there.
            feedback: >
              Selling AUD at the direct quote gets you $0.90$ CAD, less than the
              $0.91$ the route through US dollars pays. That is the losing
              direction.
          - text: >
              Nothing: one cent is noise.
            feedback: >
              Without spreads, one cent on $0.91$ is a riskless $1.1\%$ per
              loop, and the loop can be run in any size.
        feedback: >
          The implied cross is to FX what a replicating portfolio is to an
          option: the same exchange built from other instruments.
      - ask: >
          Start with $1{,}000{,}000$ USD. Convert to CAD at $1.40$, then buy
          AUD with the CAD at the direct $0.90$. How many AUD do you hold?
        expects: "1555555.56"
        tolerance: 0.01
        feedback: >
          $1{,}000{,}000 \times 1.40 = 1{,}400{,}000$ CAD, and
          $1{,}400{,}000 / 0.90 = 1{,}555{,}555.56$ AUD.
      - ask: >
          Sell those AUD for USD at $0.65$. What is your profit, in USD?
        expects: "11111.11"
        tolerance: 0.01
        feedback: >
          $1{,}555{,}555.56 \times 0.65 = 1{,}011{,}111.11$ USD, so the loop
          made $11{,}111.11$ USD — and you hold no currency position at the
          end.
      - reflect: >
          Without running the loop, how could you have read off from the three
          numbers alone that it pays, by how much, and in which direction?
        answer: >
          Multiply the rates around the loop in the direction you travel:
          USD to CAD is $1.40$, CAD to AUD is $1/0.90$, AUD to USD is $0.65$,
          and $1.40 \times 0.65 / 0.90 = 1.0111$. Under the law of one price
          that product must be exactly $1$; above $1$ this direction makes
          $1.11\%$, and below $1$ you would run the loop the other way.
      - teach: >
          That is *triangular arbitrage*: the law of one price across three
          currencies. The no-arbitrage condition is that the rates multiply to
          $1$ around the loop, which is the same as the direct cross equalling
          the implied one. When they disagree, buy the currency where the
          direct quote makes it cheap and run the loop that way. In practice
          three spreads are the hurdle, so the trade is a race for speed rather
          than a puzzle.

      - part: Direction and size
        ask: >
          Suppose instead the direct AUD/CAD quote were $0.9200$. Which loop
          makes money, starting from USD?
        choices:
          - text: >
              USD to CAD, CAD to AUD at $0.92$, AUD to USD — the same loop as
              before.
            feedback: >
              The product is now $1.40 \times 0.65 / 0.92 = 0.9891$: that loop
              loses about $1.1\%$. The direct quote makes AUD rich now, so you
              should be selling it there, not buying.
          - text: >
              USD to AUD at $0.65$, AUD to CAD at $0.92$, CAD to USD at
              $1.40$.
            correct: true
            feedback: >
              The product is $(1/0.65) \times 0.92 / 1.40 = 0.92/0.91 = 1.0110$.
              You now sell AUD at the direct quote, where it is dear.
          - text: >
              Neither: $0.92$ and $0.91$ are too close to trade.
            feedback: >
              With no spreads, $1\%$ on a riskless loop is enormous. Closeness
              matters only once costs are counted.
        feedback: >
          Which side of the implied cross the direct quote sits on decides the
          direction. Above it, sell the base currency directly; below it, buy.
      - ask: >
          Run that loop with $1{,}000{,}000$ USD. What is your profit, in USD?
        expects: "10989.01"
        tolerance: 0.01
        feedback: >
          $1{,}000{,}000 / 0.65 = 1{,}538{,}461.54$ AUD, times $0.92$ is
          $1{,}415{,}384.62$ CAD, divided by $1.40$ is $1{,}010{,}989.01$ USD:
          a profit of $10{,}989.01$, or $0.92/0.91 - 1 = 1.10\%$.

      - part: What stands in the way
        ask: >
          Back to the $0.9000$ direct quote and its $1.11\%$ loop. Now each of
          the three conversions costs $0.4\%$ in spread. Is the loop still an
          arbitrage?
        choices:
          - text: >
              Yes: the quotes still disagree by $1.11\%$.
            feedback: >
              The quotes disagree, but you pay three spreads to exploit it:
              $1.0111 \times 0.996^{3} = 1.0111 \times 0.9880 = 0.9990$, a loss
              of about $0.1\%$.
          - text: >
              Yes, at a smaller profit of about $0.7\%$.
            feedback: >
              That subtracts one spread, but the loop has three legs and pays
              all three: about $1.2\%$ in costs against a $1.11\%$ gap.
          - text: >
              No: three spreads of $0.4\%$ cost about $1.2\%$, more than the
              $1.11\%$ gap.
            correct: true
            feedback: >
              $1.0111 \times 0.996^{3} = 0.9990$. The disagreement sits inside
              the round-trip cost, so the quotes are consistent with no
              arbitrage.
        feedback: >
          The hurdle is three spreads, not one. Real cross quotes drift only
          as far from the implied rate as that hurdle allows.
      - ask: >
          A colleague reads AUD/CAD $0.9000$ the wrong way round, as one
          Canadian dollar buying $0.90$ Australian dollars. What goes wrong?
        choices:
          - text: >
              Nothing important: the loop is the same three currencies either
              way.
            feedback: >
              The currencies are the same, but the rate is inverted: she thinks
              an AUD costs $1/0.90 = 1.11$ CAD when it costs $0.90$. Every
              comparison with the implied $0.91$ flips.
          - text: >
              She sees the AUD as dear at the direct quote and runs the loop
              backwards, losing money.
            correct: true
            feedback: >
              Read as $1.11$ CAD per AUD, the direct quote looks far above
              $0.91$, so she sells AUD there. At the real $0.90$ that is the
              losing direction.
          - text: >
              She computes the right direction but the wrong size.
            feedback: >
              An inverted quote does not just rescale the answer; it puts the
              direct quote on the other side of the implied cross, so the
              direction flips too.
        feedback: >
          Said aloud: "Implied cross is $0.65 \times 1.40 = 0.91$; the direct
          quote is $0.90$, so AUD is cheap there. Buy AUD with CAD, sell it for
          USD, buy CAD back — $1.11\%$ before spreads."
