unit: quant-finance.arbitrage
opening: >
  This unit is where "no free lunch" stops being a slogan and becomes a
  pricing method: given no distribution at all, the single axiom that a
  liquid market admits no arbitrage forces exact prices for forwards, options
  and cross-currency trades. It opens with the axiom itself and the law of
  one price it implies, builds the replication technique that does all the
  actual work, and applies it first to forwards and then to the workhorse
  identity of the options world, put–call parity. From there it runs parity
  in both directions — synthesizing any instrument from the other three, and
  trading the conversion or reversal when the market disagrees — before
  closing on the option bounds and the one early-exercise result every
  interview checks: American calls should never be exercised early on a
  non-dividend stock, while American puts sometimes must be.
lessons:
  - node: quant-finance.arbitrage.no-arbitrage
    hook: >
      An interviewer who asks "is this an arbitrage?" is testing a
      definition, not your cleverness — get the definition exactly right and
      the trade that exploits any violation falls out automatically.
    explanation: >
      An arbitrage is a position built for zero cost today whose payoff at
      time $T$ is never negative and strictly positive in at least one state
      — or, equivalently, one with strictly negative cost today and a payoff
      that is never negative. Both phrasings describe the same free lunch:
      money now, or later, or both, with no scenario in which you pay.

      The no-arbitrage axiom asserts that a liquid market contains none of
      these, and it is an axiom rather than a derived fact: nothing forces
      prices to obey it except that any violation would be traded in
      unlimited size by whoever spots it first, erasing the mispricing
      faster than it can be measured. That argument needs the standing
      frictionless assumptions — borrowing and lending freely at the
      riskless rate, short-selling at no cost, trading any size, facing no
      counterparty risk — which is why the axiom describes an idealized
      liquid market rather than every quote you will ever see.

      Notice what the definition never mentions: no probability of each
      state, no expected return, no risk aversion. Every price derived
      downstream in this unit is forced by this one structural axiom alone,
      which is exactly why the results are called model-free — they hold
      whatever you believe about the future.
    worked: >
      Suppose a non-dividend stock trades at $50.00$ on one venue and
      $50.20$ on another, with no borrow cost and no timing gap between the
      two prints. Buy $100$ shares on the cheap venue for $5{,}000.00$ and
      simultaneously sell $100$ shares on the rich venue for $5{,}020.00$,
      delivering the shares you just bought to settle the sale instead of
      borrowing any. The two trades net to zero shares held and a locked
      profit of $20.00$ collected today, with no future obligation at all —
      negative cost today, a payoff that is never negative because there is
      no future state left to reach.
    interview: >
      Two questions test this directly: "define arbitrage precisely" and
      "is this actually an arbitrage or just a good trade?" The interviewer
      is listening for the exact zero-cost, never-negative,
      sometimes-positive structure, and for you to name which frictionless
      assumption a real-world near-arbitrage is violating.
    pitfalls: >
      Calling any positive-expected-value trade an arbitrage is the single
      most common slip — a directional bet with real downside is not
      arbitrage no matter how favorable the odds. Also forgetting that the
      frictionless assumptions are load-bearing: a mispricing that costs
      more to trade than it pays is not exploitable, so real screens show
      near-arbitrages surviving inside a band of round-trip cost.
    recap: >
      An arbitrage is a zero-or-negative-cost position whose payoff is never
      negative and sometimes positive — a structural definition with no
      probabilities in it, enforced by unlimited trading size rather than by
      any belief about the future.
    steps:
      - teach: >
          An arbitrage is a position that costs nothing to put on today, whose
          payoff at $T$ is never negative and strictly positive in at least one
          state. Equivalently, it costs strictly less than zero today and never
          pays a negative amount later — both phrasings describe the identical
          free lunch.
      - teach: >
          The axiom says a liquid market contains none of these: any violation
          would be traded in unlimited size until the mispricing disappeared.
          That argument leans on the standing frictionless assumptions — free
          borrowing and lending at the riskless rate, costless short sales,
          unlimited size, and no counterparty risk.
      - ask: >
          A non-dividend stock trades at $40.00$ on one venue and $40.25$ on
          another, with no borrow cost and no timing gap between the two prints.
          You buy $200$ shares on the cheap venue and immediately sell $200$
          shares on the rich venue, delivering the shares you just bought. What
          is the riskless profit collected today, in dollars?
        expects: "50"
        hint: >
          The profit is the price gap times the number of shares — no future
          obligation is left once the two trades net to zero shares held.
        feedback: >
          The gap is $40.25 - 40.00 = 0.25$ per share, times $200$ shares, is
          $50.00$ collected today with no shares held and no future obligation —
          negative cost today, never-negative payoff, exactly the arbitrage
          shape.
      - teach: >
          Notice what the definition never mentions: no probability of each
          state, no expected return, no risk preference. Every price derived
          downstream in this unit is forced by this one structural axiom alone,
          which is why the results are model-free.
      - ask: >
          A trader buys a stock she believes is undervalued. The trade costs
          money to enter and can lose money if she is wrong, though its expected
          return is positive. Is this an arbitrage?
        choices:
          - text: >
              Yes, because the expected profit is positive.
            feedback: >
              Expected value has nothing to do with the definition — an
              arbitrage is riskless by construction, not merely favorable on
              average.
          - text: >
              No, because it costs money today and its payoff can be negative.
            correct: true
            feedback: >
              Exactly: an arbitrage has zero or negative cost today and a payoff
              that is never negative. A directional bet with real downside is
              not arbitrage no matter how good the odds.
          - text: >
              Yes, because any mispriced stock is an arbitrage opportunity.
            feedback: >
              Being mispriced relative to some belief about value is not the
              same as having no risk of loss — "mispriced" still leaves you
              exposed to being wrong.
        feedback: >
          A positive-expected-value trade is not an arbitrage: it can lose money
          and generally costs something to put on. Keep those two ideas in
          separate boxes.
      - ask: >
          Which of these is NOT one of the standing frictionless assumptions
          behind the no-arbitrage axiom?
        choices:
          - text: >
              You can borrow and lend freely at the riskless rate.
            feedback: >
              That is one of the four standing assumptions.
          - text: >
              You can sell short at no cost.
            feedback: >
              Also one of the four.
          - text: >
              The probability of each future state is known.
            correct: true
            feedback: >
              The axiom needs no probabilities at all — that is exactly what
              makes its conclusions model-free. Probabilities are never part of
              the frictionless assumptions.
          - text: >
              You face no counterparty or credit risk.
            feedback: >
              Also one of the four standing assumptions.
        feedback: >
          The four assumptions are unlimited free borrowing and lending,
          costless short sales, unlimited trade size, and no credit risk —
          probabilities never enter, which is why these results hold under any
          distribution.
      - teach: >
          Real screens rarely show exact violations: bid-ask spreads and
          financing costs mean a genuine mispricing has to clear its own
          round-trip cost before it is worth trading, so what survives in
          practice is a near-arbitrage inside that band.
      - teach: >
          Keep the definition exact and cold: zero-or-negative cost today,
          never-negative payoff, sometimes strictly positive — three conditions,
          no probabilities anywhere in them.
  - node: quant-finance.arbitrage.law-of-one-price
    hook: >
      Once you accept no arbitrage, this is the first hard consequence, and
      it is the one line that turns "no free lunch" into an actual pricing
      tool: match the payoff, and you have matched the price.
    explanation: >
      If two portfolios deliver identical payoffs in every state at time
      $T$, they must trade at identical prices at every earlier time. The
      proof is the standard no-arbitrage proof: if portfolio $X$ costs more
      than portfolio $Y$ today, sell $X$ and buy $Y$. The terminal payoffs
      are identical, so they cancel state by state at $T$, leaving a
      riskless position with zero future exposure and a cash difference
      banked today — exactly the arbitrage the axiom forbids, so the price
      gap cannot exist.

      Two corollaries do essentially all the pricing work later in this
      unit. Price is additive: a package of instruments is worth the sum of
      what its pieces are worth separately, since you can always replicate
      the package by holding the pieces. And a payoff that is zero in every
      state is worth exactly zero today — a portfolio with no future value
      can carry no present value either, or shorting it against nothing
      would be free money.

      Frictions weaken the equality to a band rather than destroying it.
      Bid–ask spreads, borrow fees and financing costs mean two instruments
      with identical payoffs can show slightly different quoted prices in
      practice; what disappears is only the incentive to trade the gap,
      once its round-trip cost exceeds the mispricing.
    worked: >
      Take two zero-coupon bonds from the same issuer, both maturing in
      exactly two years and both paying a face value of $1{,}000$ then —
      identical payoffs in every state, since neither carries any risk of
      default before the other. Suppose bond A trades at $900$ and bond B,
      otherwise identical, trades at $910$. Sell bond B short for $910$ and
      buy bond A for $900$, banking $10$ today. At maturity both bonds pay
      $1{,}000$: use the $1{,}000$ received from A to deliver the $1{,}000$
      owed on the short B position, leaving nothing outstanding. The $10$
      collected today was riskless, so only equal prices are consistent
      with no arbitrage.
    interview: >
      This shows up as "why should X and Y have the same price?" for any
      two instruments with matched payoffs — a swap replicated by bonds, an
      ETF against its basket, a bond against a strip of its own cash flows.
      The expected answer is the sell-the-dear/buy-the-cheap argument stated
      in one breath, not just the conclusion.
    pitfalls: >
      The payoffs must match in every state, not just on average — two
      bonds with the same expected payoff but different default risk are
      not interchangeable, and the law says nothing about them. Also, real
      quotes differing by less than round-trip transaction cost are not a
      violation; the law binds prices up to that cost, not to the last cent.
    recap: >
      Identical payoffs in every future state force identical prices today,
      because any gap is sold on one side, bought on the other, and banked
      risklessly — the tool behind every replication argument that follows.
    steps:
      - teach: >
          If two portfolios deliver identical payoffs in every state at time
          $T$, they must trade at identical prices at every earlier time —
          matching the payoff is what pins the price.
      - teach: >
          The proof is the standard one: if portfolio $X$ costs more than
          portfolio $Y$ today, sell $X$ and buy $Y$. The terminal payoffs cancel
          state by state, leaving a riskless position and a cash difference
          banked today — exactly the arbitrage the axiom forbids, so the price
          gap cannot exist.
      - ask: >
          Two zero-coupon bonds from the same issuer both mature in three years
          and both pay a face value of $1{,}000$ then — identical payoffs in
          every state. Bond C trades at $850$ and bond D, otherwise identical,
          trades at $865$. You sell bond D short and buy bond C. What is the
          riskless profit collected today, in dollars?
        expects: "15"
        hint: >
          The payoffs cancel exactly at maturity, so the profit is locked in
          today as the price gap.
        feedback: >
          Sell D for $865$, buy C for $850$, banking $15$ today. At maturity
          both pay $1{,}000$, so the $1{,}000$ received from C exactly settles
          the $1{,}000$ owed on the short D position — the $15$ was riskless.
      - teach: >
          Two corollaries do most of the pricing work later in this unit: price
          is additive, so a package is worth the sum of its pieces, and a payoff
          that is zero in every state is worth exactly zero today.
      - ask: >
          Bond E and bond F both promise to pay $1{,}000$ in two years, but bond
          F carries meaningfully higher default risk than bond E. Does the law
          of one price force them to trade at the same price today?
        choices:
          - text: >
              Yes — both are promised the same $1{,}000$ payoff.
            feedback: >
              The promised payoff matches, but the payoffs are not identical in
              every state: a state where F defaults and E does not breaks the
              match the law requires.
          - text: >
              No — the payoffs only match if both bonds actually pay in every
              state, and different default risk means they do not.
            correct: true
            feedback: >
              Exactly. The law needs payoffs identical state by state, not just
              the same face amount on paper — different credit risk is a
              difference in some state's payoff.
          - text: >
              It depends only on which bond has the higher coupon.
            feedback: >
              Neither bond described has a coupon at stake here — the issue is
              default risk, not coupon size.
        feedback: >
          "Identical payoff" means state by state, not just the same promised
          number. Bonds with different default risk are not interchangeable
          under this law.
      - teach: >
          Frictions weaken the equality to a band rather than destroying it:
          bid-ask spreads, borrow fees and financing costs mean identical-payoff
          instruments can show slightly different quoted prices in practice.
      - ask: >
          Two instruments with genuinely identical payoffs trade at prices that
          differ by an amount smaller than the round-trip cost of trading
          between them. Does the law of one price call this a violation?
        choices:
          - text: >
              Yes, any price gap at all is a violation, however small.
            feedback: >
              The law binds prices up to round-trip transaction cost, not to the
              last cent — frictions widen strict equality into a band.
          - text: >
              No — inside the round-trip cost band there is no incentive to
              trade the gap, so it is not exploitable.
            correct: true
            feedback: >
              Right. What frictions remove is the incentive to close a gap
              smaller than what it costs to trade it, not the underlying logic
              of the law.
          - text: >
              It depends on whether the two instruments are bonds or stocks.
            feedback: >
              The instrument class is not what matters — it is whether the gap
              exceeds the actual round-trip cost of trading it.
        feedback: >
          Real markets show near-arbitrages surviving inside a band of
          round-trip transaction cost — the friction-adjusted version of the
          same law, not a contradiction of it.
  - node: quant-finance.arbitrage.replication
    hook: >
      This is the single most reusable move in the whole unit: whenever a
      question asks what something is worth and gives you no distribution,
      this is the technique, not a pricing formula to memorize.
    explanation: >
      Replication turns "what is this worth" into four mechanical steps.
      Write the target's payoff at $T$ as a function of the terminal state —
      usually the underlying price $S_T$. Assemble a portfolio out of
      instruments you can already price — shares, zero-coupon bonds,
      forwards, other options — whose payoff matches the target's in every
      state. Invoke the law of one price: since the payoffs are identical,
      the target's fair price today is exactly the cost of assembling that
      portfolio. And if the market disagrees, buy whichever side is cheap,
      sell whichever side is dear, and the difference is riskless profit.

      The technique needs no view on probabilities anywhere in it —
      replication works whether the underlying is about to double or halve,
      which is the whole point of a model-free price. What it does need is a
      big enough menu of instruments you can already price to span the
      target's payoff; if nothing in reach spans it exactly, replication
      stalls until a richer instrument set is available.
    worked: >
      Price a claim that pays $2S_T - 100$ at time $T$ — twice the terminal
      stock price, less a fixed $100$. Step one, the payoff is linear in
      $S_T$: two units of stock minus a fixed cash amount. Step two,
      replicate: hold $2$ shares and go short a zero-coupon bond with face
      value $100$ maturing at $T$; at $T$ this pays $2S_T - 100$ exactly,
      matching in every state. Step three, price it: $2S - 100e^{-rT}$. With
      $S = 60$, $r = 5\%$, $T = 1$: $2(60) - 100e^{-0.05} = 120 - 95.12 =
      24.88$ — so the answer is $24.88$.
    interview: >
      Almost every pricing question in this subject is secretly asking for
      this four-step routine — "how would you price this payoff" should
      trigger writing the payoff as a function of $S_T$ before reaching for
      any formula. Naming the replicating portfolio explicitly is what
      separates a real answer from a guessed one.
    pitfalls: >
      Reaching for a probability-weighted average before checking whether
      the payoff can be spanned by instruments you already price — that is a
      different, model-dependent technique, not this one. Also, an inexact
      replication that only approximately matches the target's payoff proves
      nothing; the match must hold in every state, not on average.
    recap: >
      Write the payoff as a function of $S_T$, build a portfolio of
      already-priced instruments matching it state by state, and the
      portfolio's cost is the price — no probabilities required.
    steps:
      - teach: >
          Replication turns "what is this worth" into a mechanical first step:
          write the target's payoff at $T$ as a function of the terminal state,
          usually the underlying price $S_T$.
      - teach: >
          Then assemble a portfolio of instruments you can already price —
          shares, zero-coupon bonds, forwards, other options — whose payoff
          matches the target's in every state. By the law of one price, the
          target's fair price today is exactly the cost of assembling that
          portfolio.
      - teach: >
          If the market disagrees with that price, buy whichever side is cheap,
          sell whichever side is dear, and the difference is riskless profit —
          this last step is what makes replication a trading instruction, not
          just a valuation.
      - ask: >
          A claim pays $3S_T - 100$ at time $T$. With $S = 40$, $r = 4\%$
          continuously compounded, and $T = 2$, replicate it with $3$ shares and
          a short zero-coupon bond of face value $100$ maturing at $T$. What is
          the claim's fair price today?
        expects: "27.69"
        tolerance: 0.01
        hint: >
          Price the two pieces of the replicating portfolio separately and add:
          $3$ shares at $S$, minus the present value of the $100$ bond.
        feedback: >
          $3(40) - 100e^{-0.04(2)} = 120 - 92.31 = 27.69$ — the portfolio's cost
          is the price, no probability of $S_T$ needed anywhere.
      - teach: >
          The technique needs no view on probabilities anywhere in it, which is
          the whole point of a model-free price. What it does need is a big
          enough menu of already-priced instruments to span the target's payoff
          exactly.
      - ask: >
          You are asked to price a claim paying $\max(S_T - 50, 0)$ with no
          distribution given for $S_T$. What is the correct first move?
        choices:
          - text: >
              Assume a probability distribution for $S_T$ and take the expected
              discounted payoff.
            feedback: >
              That is a different, model-dependent technique — replication needs
              no view on probabilities at all.
          - text: >
              Write the payoff as a function of $S_T$, then look for a portfolio
              of already-priced instruments matching it state by state.
            correct: true
            feedback: >
              Right — the routine is express the payoff, assemble a matching
              portfolio, price it by the law of one price, and trade the gap if
              the market disagrees.
          - text: >
              Look up a pricing formula and plug in an assumed volatility.
            feedback: >
              That is a model-dependent shortcut for one particular payoff
              shape, not what replication requires — it still hides an assumed
              distribution inside the volatility input.
        feedback: >
          Replication starts from the payoff and an already-priced instrument
          menu, never from an assumed distribution — that is what makes its
          conclusions model-free.
      - ask: >
          You build a portfolio that matches a target claim's payoff in most
          states but is off by a small amount in one unlikely state. Can you
          still price the claim as the cost of that portfolio?
        choices:
          - text: >
              Yes, as long as the mismatch is small on average.
            feedback: >
              Replication needs an exact match state by state — an average match
              proves nothing about the price in the one state where it fails.
          - text: >
              No — the match must hold in every state, or the argument breaks
              down entirely.
            correct: true
            feedback: >
              Right. One mismatched state means the two payoffs are not
              identical, so the law of one price no longer applies to the
              portfolio's cost.
          - text: >
              Yes, since options are rarely exercised in unlikely states anyway.
            feedback: >
              The whole point of a model-free price is that it holds regardless
              of which state occurs — betting a state will not happen
              reintroduces exactly the probability judgement replication avoids.
        feedback: >
          An inexact replication, however close on average, proves nothing — the
          payoff match has to hold state by state, with no exceptions.
  - node: quant-finance.arbitrage.relative-pricing
    hook: >
      Confusing what no-arbitrage actually proves with what it merely
      sounds like it proves is a fast way to say something wrong under
      interview pressure.
    explanation: >
      Every result built by replication is a relative pricing statement: it
      tells you what an option is worth given the stock and the bond, or
      what a forward is worth given the spot and the rate, but it never
      tells you whether the stock itself is priced correctly, because there
      is nothing left to replicate the stock with. That absence is the
      technique's real strength — the conclusions hold under any
      distribution of $S_T$, so they survive being wrong about the market's
      direction — and simultaneously its hard limit.

      Keep two vocabularies separate under questioning. An arbitrage is
      riskless and self-financing: zero or negative cost, a payoff that is
      never negative. A positive-expected-value trade is neither of those —
      it can lose money, and it costs something to put on. Calling the
      second one "arbitrage" is one of the fastest ways to sound like you do
      not actually know the definition.

      Real limits to arbitrage matter because the frictionless assumptions
      never hold exactly: financing cost eats into the locked profit, margin
      calls can force a position closed before prices converge, a stock
      borrow can be recalled mid-trade forcing the short leg to unwind
      early, and legging into a multi-instrument trade carries execution
      risk if the market moves between fills.
    interview: >
      "Does no-arbitrage tell you the stock is fairly priced?" is a direct
      test of this distinction — the correct answer is no, and naming why
      (nothing to replicate the underlying with) is worth more than the
      one-word answer. Interviewers also probe by describing a real-world
      "arbitrage" that actually carries risk, listening for you to catch it.
    pitfalls: >
      Treating a replication-based price as proof the underlying itself is
      correctly valued — it only prices derivatives relative to the
      underlying. Also, describing a trade with any financing risk, borrow
      risk or execution risk as riskless arbitrage rather than a
      near-arbitrage with real limits.
    recap: >
      Replication prices instruments relative to each other with no model
      at all, but it says nothing about whether the underlying is cheap,
      and real limits to arbitrage keep near-arbitrages from closing
      instantly.
    steps:
      - teach: >
          Every result built by replication is a relative pricing statement: it
          tells you what an option is worth given the stock and the bond, but it
          never tells you whether the stock itself is priced correctly, because
          there is nothing left to replicate the stock with.
      - teach: >
          That absence is the technique's strength — the conclusions hold under
          any distribution of $S_T$, so they survive being wrong about market
          direction — and simultaneously its hard limit.
      - ask: >
          Does no-arbitrage pricing tell you whether the underlying stock itself
          is fairly valued?
        choices:
          - text: >
              Yes, since every option price is derived from arbitrage arguments.
            feedback: >
              The option price is derived relative to the stock — nothing in the
              argument checks whether the stock's own price is correct, because
              there is nothing left to replicate the stock with.
          - text: >
              No — there is nothing to replicate the stock with, so no-arbitrage
              says nothing about the stock's own level.
            correct: true
            feedback: >
              Right. Replication prices derivatives relative to the underlying;
              it is silent on whether the underlying itself is cheap or rich.
          - text: >
              Only when the riskless rate is low.
            feedback: >
              The rate does not change what the argument can and cannot conclude
              — it never touches whether the stock is fairly priced, at any rate
              level.
        feedback: >
          No-arbitrage pricing is entirely relative: it prices one instrument
          against others, never the level of the underlying itself.
      - teach: >
          Keep two vocabularies separate under questioning. An arbitrage is
          riskless and self-financing: zero or negative cost, a payoff never
          negative. A positive-expected-value trade is neither — it can lose
          money, and it costs something to put on.
      - ask: >
          A trader describes a trade as "arbitrage": short an overvalued stock
          and buy a cheaper correlated stock, expecting the gap to close, though
          the position can lose money if it widens instead. Is "arbitrage" the
          right word?
        choices:
          - text: >
              Yes, because both legs are hedged against each other.
            feedback: >
              Hedged is not the same as riskless — the position can still lose
              money if the spread widens, which rules out the word arbitrage.
          - text: >
              No — it can lose money, so it is a positive-expected-value trade
              at best, not arbitrage.
            correct: true
            feedback: >
              Right. Arbitrage requires a payoff that is never negative; a trade
              that can lose money if the spread widens is a bet, however
              well-reasoned, not an arbitrage.
          - text: >
              Yes, because both legs will eventually converge given enough time.
            feedback: >
              Eventual convergence is a belief about the market, not a guarantee
              — calling a trade with real downside "arbitrage" is exactly the
              mislabeling this distinction warns against.
        feedback: >
          Calling a directional, correlation-based trade "arbitrage" is one of
          the fastest ways to signal you do not have the definition cold.
      - teach: >
          Real limits to arbitrage matter because the frictionless assumptions
          never hold exactly: financing cost, margin calls before convergence, a
          stock borrow recalled mid-trade, and execution risk on the legs.
      - ask: >
          A trader has legged into a conversion but the stock borrow on the
          short leg gets recalled before expiry, forcing an early unwind at an
          unfavorable price. What does this illustrate?
        choices:
          - text: >
              That the trade was never really an arbitrage, since a real limit
              to arbitrage broke the riskless assumption.
            correct: true
            feedback: >
              Right — borrow recall is exactly one of the real limits to
              arbitrage: the frictionless assumption of costless, guaranteed
              short-selling does not hold exactly in practice.
          - text: >
              That put-call parity itself was violated.
            feedback: >
              Parity as an identity is not violated by an execution problem —
              the issue is a friction breaking one of the standing assumptions,
              not the pricing relationship itself.
          - text: >
              That the trader should have used a larger position size.
            feedback: >
              Size does not fix a borrow recall — a larger position only
              amplifies the cost of the forced early unwind.
        feedback: >
          Financing cost, margin calls, borrow recall, and execution risk are
          the real-world frictions that keep "arbitrage" from being quite as
          riskless in practice as the frictionless assumptions promise.
  - node: quant-finance.arbitrage.forward-pricing
    hook: >
      "Price me a forward" is asked almost verbatim in interviews, and the
      entire answer is one line of replication — get the
      borrow-buy-hold argument cold.
    explanation: >
      For an asset with no income and no storage cost, at a constant
      continuously compounded rate $r$, the forward price for delivery at
      $T$ is $F = Se^{rT}$. The proof is pure replication: borrow $S$ today,
      buy the asset, and hold it. At $T$ you own the asset and owe $Se^{rT}$
      on the loan — exactly the payoff of a long forward struck at
      $Se^{rT}$. Both the loan-and-buy strategy and entering a forward cost
      nothing to set up today, so the strike that makes their payoffs match
      is the one the forward must actually trade at; any other quoted
      strike lets you run one side of the trade against the other for a
      riskless profit.

      Discretely compounded the same argument gives $F = S(1 + r)^{T}$
      instead. An already-existing forward struck at some fixed $K$, rather
      than at the current fair strike, is worth $(F - K)e^{-rT}$ today — its
      payoff discounted back, since a forward always costs nothing to enter
      but a live position with an off-market $K$ generally does not have
      zero value.

      The mental model to keep is that $F$ is not a forecast of $S_T$ — it
      says nothing about where the asset is going. It is today's spot,
      carried forward at the cost of financing the purchase, which is why
      $F$ moves one-for-one with $S$ and with $r$ and never with anyone's
      view of the future.
    worked: >
      $S = 200$, $r = 3\%$, $T = 2$ years, continuously compounded, no
      income: $F = 200e^{0.03 \times 2} = 200e^{0.06} \approx
      200(1.0618) \approx 212.37$ — so the answer is $212.37$.
    interview: >
      The canonical prompt is close to "what's the fair forward price on
      this stock" — the strong answer states $F = Se^{rT}$ and derives it
      from borrow-buy-hold in the same breath, rather than quoting the
      formula alone. Interviewers often follow with "is that a prediction
      of the future price," testing whether you distinguish a carry
      relationship from a forecast.
    pitfalls: >
      Mixing up continuous and discrete compounding — $Se^{rT}$ and
      $S(1+r)^T$ agree only approximately for small $r$, and an interviewer
      who specifies one expects that exact form used. Also, treating $F$ as
      a market view on direction, which invites an easy follow-up you do
      not want to fumble.
    recap: >
      $F = Se^{rT}$ because borrowing to buy the asset now exactly
      replicates a forward at that strike — the forward price is carried
      spot, never a forecast.
    steps:
      - teach: >
          For an asset with no income and no storage cost, at a constant
          continuously compounded rate $r$, the forward price for delivery at
          $T$ is $F = Se^{rT}$, proved by borrowing $S$, buying the asset, and
          holding it.
      - teach: >
          Discretely compounded the same argument gives $F = S(1+r)^{T}$
          instead. An existing forward struck at some fixed $K$, rather than the
          current fair strike, is worth $(F-K)e^{-rT}$ today — its payoff
          discounted back.
      - ask: >
          A non-dividend stock trades at $150$, the continuously compounded
          riskless rate is $4\%$, and delivery is in $3$ years. What is the fair
          forward price?
        expects: "169.12"
        tolerance: 0.05
        hint: >
          Borrow the spot, buy the asset, and compound the loan forward at $r$
          for $T$ years — that loan balance is the fair strike.
        feedback: >
          $F = 150e^{0.04(3)} = 150e^{0.12} \approx 150(1.1275) \approx 169.12$.
      - teach: >
          $F$ is not a forecast of $S_T$ — it says nothing about where the asset
          is going. It is today's spot, carried forward at the cost of financing
          the purchase, so it moves one-for-one with $S$ and with $r$ and never
          with anyone's view of the future.
      - ask: >
          Does the forward price $F = Se^{rT}$ predict where the stock will
          actually trade at $T$?
        choices:
          - text: >
              Yes, it is the market's best forecast of $S_T$.
            feedback: >
              $F$ carries no information about direction — it moves one-for-one
              with today's spot and the rate, never with anyone's view of the
              future.
          - text: >
              No — it is today's spot carried forward at the financing cost,
              with no forecast content at all.
            correct: true
            feedback: >
              Right. $F$ is purely a carry relationship: borrow-buy-hold
              replicates the forward exactly, and that argument never touches
              what anyone expects $S_T$ to be.
          - text: >
              It is a forecast only when $r$ is small.
            feedback: >
              The size of $r$ changes how far $F$ sits from $S$, not whether the
              number carries forecast content — it never does, at any rate.
        feedback: >
          $F$ is the cost of carrying the asset forward, nothing more — treating
          it as a prediction is a common and costly misreading.
      - ask: >
          That same stock's forward, with $3$ years still to delivery, was
          struck earlier at $K = 175$, above the current fair strike of
          $169.12$. What is that existing forward's value today?
        expects: "-5.21"
        tolerance: 0.05
        hint: >
          An existing forward's value is the gap between the fair strike and its
          own strike, discounted back to today.
        feedback: >
          $(F-K)e^{-rT} = (169.12 - 175)e^{-0.12} \approx (-5.88)(0.8869)
          \approx -5.21$ — negative, since a fresh forward would only require
          paying $169.12$, not the $175$ this one is stuck at.
      - teach: >
          Mixing up continuous and discrete compounding is the most common slip:
          $Se^{rT}$ and $S(1+r)^{T}$ agree only approximately for small $r$, and
          an interviewer who specifies one expects that exact form used.
  - node: quant-finance.arbitrage.cash-and-carry
    hook: >
      This is the trade behind the theorem — if a forward price ever
      strays from $Se^{rT}$, this is the exact mechanical arbitrage that
      pulls it back, in both directions.
    explanation: >
      Forward pricing gives the fair strike; if the market quotes something
      else, cash-and-carry, or its mirror, is the explicit trade that
      exploits the gap. When the forward is quoted rich — above $Se^{rT}$ —
      borrow cash, buy the asset, and sell the forward: at $T$, deliver the
      asset into the forward for the rich strike and repay the loan,
      keeping the difference. When the forward is quoted cheap — below
      $Se^{rT}$ — run it in reverse: short the asset, lend the proceeds, and
      buy the forward; at $T$, collect the loan with interest, take
      delivery at the cheap strike, and use the asset to return what was
      borrowed.

      Both trades cost nothing to set up and pay a certain, positive amount
      at $T$ regardless of where the asset ends up — the defining shape of
      an arbitrage — so only the single strike $F = Se^{rT}$ is consistent
      with no arbitrage existing on either side. In practice the two
      directions are not equally easy: the reverse trade needs a stock
      borrow, which can be costly or simply unavailable, which is one
      reason cheap forwards tend to persist longer than rich ones.
    worked: >
      $S = 50$, $r = 4\%$, $T = 0.5$: fair forward $F = 50e^{0.04 \times
      0.5} = 50e^{0.02} \approx 51.01$. Suppose the market quotes $52.00$ —
      rich. Borrow $50$, buy the asset, sell the forward at $52$. At $T$,
      deliver the asset for $52$ and repay $50e^{0.02} \approx 51.01$,
      keeping $0.99$. Now suppose instead the market quotes $50.50$ —
      cheap. Short the asset for $50$, lend the proceeds, buy the forward at
      $50.50$. At $T$, collect $50e^{0.02} \approx 51.01$, take delivery for
      $50.50$, return the borrowed asset, and keep $0.51$.
    interview: >
      "The forward is trading above fair value — what do you do?" expects
      the specific four-leg trade named in order (borrow, buy, hold, sell
      forward), not just "sell the forward." Stating both directions, and
      which one is usually harder to execute, shows you understand the
      mechanics rather than just the formula.
    pitfalls: >
      Naming only one direction of the trade — the reverse cash-and-carry
      needs a short sale, which real borrow costs and availability can
      block, so interviewers listen for you to flag that asymmetry
      unprompted. Also, forgetting that the profit is the mispricing
      carried forward at $r$, not the raw quoted gap.
    recap: >
      A forward priced away from $Se^{rT}$ in either direction is locked in
      by borrow-buy-sell-forward or its mirror short-lend-buy-forward —
      both riskless, which is exactly why only $F = Se^{rT}$ survives.
    steps:
      - teach: >
          When the forward is quoted rich — above $Se^{rT}$ — cash-and-carry
          captures the gap: borrow cash, buy the asset, and sell the forward; at
          $T$, deliver the asset into the forward and repay the loan, keeping
          the difference.
      - teach: >
          When the forward is quoted cheap — below $Se^{rT}$ — run it in
          reverse: short the asset, lend the proceeds, and buy the forward; at
          $T$, collect the loan with interest and take delivery at the cheap
          strike. The reverse leg needs a stock borrow, so cheap forwards tend
          to persist longer than rich ones.
      - ask: >
          $S = 80$, $r = 6\%$ continuously compounded, $T = 0.75$ years, so the
          fair forward is $F = 80e^{0.06(0.75)} \approx 83.68$. The market
          quotes the forward at $86.00$ — rich. Borrow $80$, buy the asset, and
          sell the forward at $86$. At $T$, deliver the asset for $86$ and repay
          the loan. What is the riskless profit?
        expects: "2.32"
        tolerance: 0.02
        hint: >
          The profit is the quoted forward minus the loan balance at $T$, which
          is the fair forward compounded from the same borrowed amount.
        feedback: >
          Repaying $80e^{0.045} \approx 83.68$ against the $86$ collected at
          delivery leaves $86 - 83.68 = 2.32$.
      - ask: >
          Same stock, same $r = 6\%$, same $T = 0.75$, fair forward still
          $83.68$, but now the market quotes the forward at $83.00$ — cheap.
          Short the asset for $80$, lend the proceeds, and buy the forward at
          $83.00$. At $T$ you collect the loan with interest and take delivery
          at $83.00$. What is the riskless profit?
        expects: "0.68"
        tolerance: 0.02
        hint: >
          The profit is the loan's maturity value — the fair forward, compounded
          from the same $80$ — minus the price paid to take delivery.
        feedback: >
          Collecting $80e^{0.045} \approx 83.68$ and paying only $83.00$ for
          delivery leaves $83.68 - 83.00 = 0.68$.
      - teach: >
          Both trades cost nothing to set up and pay a certain, positive amount
          at $T$ regardless of where the asset ends up — the defining shape of
          an arbitrage — so only $F = Se^{rT}$ is consistent with no arbitrage
          on either side.
      - ask: >
          The forward on a stock is trading above its fair value $Se^{rT}$.
          Which sequence of trades captures the arbitrage?
        choices:
          - text: >
              Sell the forward, and separately short the stock to hedge.
            feedback: >
              Selling the forward alone is not tied to a financed physical
              position — the actual trade borrows cash to buy and hold the asset
              against the short forward, not the reverse.
          - text: >
              Borrow cash, buy the asset, hold it, and sell the forward —
              deliver into the forward and repay the loan at $T$.
            correct: true
            feedback: >
              Right — this is cash-and-carry: the physical purchase funded by
              borrowing exactly replicates the short forward's obligation,
              locking in the rich quote as profit.
          - text: >
              Short the asset, lend the proceeds, and buy the forward.
            feedback: >
              That is the reverse cash-and-carry, the trade for a forward quoted
              below fair value, not above it.
        feedback: >
          A rich forward is sold against a borrowed, physically-held position:
          borrow, buy, hold, sell forward — deliver and repay at $T$ to lock in
          the gap.
      - teach: >
          The profit is always the mispricing carried forward at $r$, not the
          raw quoted gap — the two only look similar when $r$ or $T$ is small.
  - node: quant-finance.arbitrage.cost-of-carry
    hook: >
      The moment an underlying pays income or costs money to hold, the
      plain $Se^{rT}$ formula is wrong, and this is the fix every commodity
      or dividend-stock forward question is actually testing.
    explanation: >
      Income and holding costs shift the exponent in the forward-pricing
      formula directly. With a continuous income yield $q$ (dividends on an
      index, or a commodity's convenience yield working the other way) and
      a continuous storage cost $u$ (physical storage, insurance),
      $F = Se^{(r + u - q)T}$ — carry costs raise the forward, income lowers
      it, exactly as replication predicts: the holder of the physical asset
      in the borrow-buy-hold trade collects the income and pays the
      storage, while a forward holder does neither until delivery.

      With dividends known as fixed cash amounts on fixed dates rather than
      a continuous yield, the adjustment is cleaner:
      $F = (S - \operatorname{PV}(D))e^{rT}$, replacing $S$ with the
      ex-dividend value of the position, since the physical holder collects
      those dividends along the way and the forward holder does not.

      When $q > r + u$ — income outweighs financing and storage cost — the
      forward trades below spot, called backwardation; when carry cost
      dominates, it trades above spot, called contango. Both are ordinary
      outcomes of the same one formula, not separate phenomena needing
      separate explanations.
    worked: >
      $S = 80$, $r = 6\%$, $T = 0.5$, one dividend of $3$ paid at the
      three-month mark, so its own maturity is $0.25$ years out:
      $\operatorname{PV}(D) = 3e^{-0.06 \times 0.25} = 3e^{-0.015} \approx
      2.96$. Then $F = (80 - 2.96)e^{0.06 \times 0.5} = 77.04\,
      e^{0.03} \approx 77.04(1.0305) \approx 79.39$ — so the answer is
      $79.39$, below the no-dividend forward of $80e^{0.03} \approx 82.44$.
    interview: >
      Any forward question that mentions a dividend, a yield or a storage
      cost is asking for this adjustment, not the plain formula — state
      which of the two forms applies, discrete dividend or continuous
      yield, before plugging in numbers, since using the wrong one is the
      most common wrong answer.
    pitfalls: >
      Discounting the dividend to today at the wrong date — it is the
      present value of the dividend as of the dividend's own payment date,
      not $T$. Also, mixing the continuous-yield form and the
      discrete-dividend form in one problem; pick the one that matches how
      the income is actually described.
    recap: >
      Forward equals spot compounded at the riskless rate, adjusted up for
      storage cost and down for income — $F = Se^{(r+u-q)T}$ continuously,
      or $F = (S - \operatorname{PV}(D))e^{rT}$ for known dividend cash
      flows.
    steps:
      - teach: >
          With a continuous income yield $q$ and continuous storage cost $u$,
          the forward price becomes $F = Se^{(r+u-q)T}$ — carry costs raise the
          forward, income lowers it, exactly as replication predicts.
      - teach: >
          With dividends known as fixed cash amounts on fixed dates, the
          adjustment is $F = (S - \operatorname{PV}(D))e^{rT}$, replacing $S$
          with the ex-dividend value of the position, since the physical holder
          collects those dividends and the forward holder does not.
      - ask: >
          $S = 120$, $r = 5\%$ continuously compounded, $T = 1$ year, with a
          single dividend of $4$ paid at the $0.4$-year mark. What is the fair
          forward price?
        expects: "122.03"
        tolerance: 0.05
        hint: >
          Discount the dividend to today at its own payment date, subtract that
          from $S$, then compound the result forward at $r$ for the full year.
        feedback: >
          $\operatorname{PV}(D) = 4e^{-0.05(0.4)} \approx 3.92$, so $F =
          (120-3.92)e^{0.05} \approx 116.08(1.0513) \approx 122.03$.
      - teach: >
          When $q > r+u$ — income outweighs financing and storage — the forward
          trades below spot, called backwardation; when carry cost dominates
          instead, it trades above spot, called contango.
      - ask: >
          A commodity has continuous storage cost $u = 2\%$, continuous
          convenience yield $q = 7\%$, and riskless rate $r = 3\%$. Is the
          forward curve in backwardation or contango?
        choices:
          - text: >
              Contango, because storage costs are positive.
            feedback: >
              Storage cost alone does not decide it — it is the balance of $r+u$
              against $q$ that matters, and here the yield dominates.
          - text: >
              Backwardation, since the yield $7\%$ exceeds financing plus
              storage of $5\%$.
            correct: true
            feedback: >
              Right — $q > r+u$ means the forward trades below spot: the benefit
              of holding the physical asset outweighs the cost of carrying it.
          - text: >
              Contango, since the riskless rate is positive.
            feedback: >
              A positive rate alone does not force contango — you have to
              compare $r+u$ against $q$, and here $q$ wins.
        feedback: >
          Backwardation is $q > r+u$: the income and convenience of holding the
          physical asset outweigh financing and storage, pulling the forward
          below spot.
      - ask: >
          An index trades at $250$ with continuous dividend yield $q = 2.5\%$,
          riskless rate $r = 5\%$, no storage cost, and $T = 2$ years. What is
          the fair forward price?
        expects: "262.82"
        tolerance: 0.05
        hint: >
          Use $F = Se^{(r-q)T}$ with no storage term.
        feedback: >
          $F = 250e^{(0.05-0.025)(2)} = 250e^{0.05} \approx 250(1.0513) \approx
          262.82$ — below the no-yield forward of $250e^{0.10} \approx 276.30$,
          the yield pulling it down.
      - teach: >
          The dividend is always discounted to today from its own payment date,
          never from $T$ — and the discrete-dividend and continuous-yield forms
          should never both be applied to the same problem.
  - node: quant-finance.arbitrage.put-call-parity
    hook: >
      Say this cold: it is the most-quoted identity in the options half of
      every quant interview, and the interviewer expects the replicating
      portfolio, not just the formula.
    explanation: >
      Hypotheses first, because they are graded: a European call and a
      European put on the same underlying, same strike $K$, same expiry
      $T$, no dividends before $T$, a constant riskless rate $r$, no
      frictions. Under exactly those conditions, $C - P = S - Ke^{-rT}$.

      The proof is replication, applied to two portfolios rather than one.
      Portfolio A holds the call plus $K$ face value of zero-coupon bonds
      maturing at $T$. Portfolio B holds the put plus one share. At expiry,
      A is worth $K + (S_T - K)^{+}$ and B is worth $S_T + (K - S_T)^{+}$ —
      and these are the same number in every state, both equal to
      $\max(S_T, K)$, whether $S_T$ ends above or below $K$. Identical
      payoffs in every state force identical prices today by the law of one
      price: $C + Ke^{-rT} = P + S$, which rearranges to the stated
      identity.

      It is worth stressing that this is an identity, not a model: no
      distribution of $S_T$ appears anywhere in the derivation, only that
      both portfolios pay $\max(S_T, K)$. Whatever the market's actual
      prices for $C$ and $P$ are, this equation constrains the two of them
      relative to each other, independent of anyone's view on volatility or
      direction.
    worked: >
      $S = 50$, $K = 45$, $r = 4\%$, $T = 0.5$: $Ke^{-rT} = 45e^{-0.02}
      \approx 44.11$, so $C - P = 50 - 44.11 = 5.89$ — so the answer is
      $5.89$, the call trading nearly six above the put since it is
      comfortably in the money.
    interview: >
      "State put–call parity and prove it" is asked close to verbatim —
      give the hypotheses first, then the two-portfolio argument, then the
      identity; skipping straight to the formula loses points even if the
      formula is correct. A common follow-up asks what breaks if the option
      is American, testing whether you notice early exercise voids the
      clean replication.
    pitfalls: >
      Dropping a hypothesis silently — American-style options, a dividend
      before expiry, or mismatched strikes and expiries all break the
      identity as stated, and each needs its own adjusted form. Also,
      mixing up which portfolio is which — it is call-plus-bond against
      put-plus-stock, not put-plus-bond against call-plus-stock.
    recap: >
      $C - P = S - Ke^{-rT}$ for European options, same strike and expiry,
      no dividends — proved by two portfolios that both pay
      $\max(S_T, K)$ at expiry, hence must cost the same today.
    steps:
      - teach: >
          Hypotheses first, since they are graded: a European call and a
          European put on the same underlying, same strike $K$, same expiry $T$,
          no dividends before $T$, a constant riskless rate $r$, no frictions.
          Under exactly those conditions, $C - P = S - Ke^{-rT}$.
      - teach: >
          The proof compares two portfolios: A holds the call plus $K$ face
          value of bonds, B holds the put plus one share. Both pay $\max(S_T,
          K)$ at expiry in every state, so by the law of one price $C + Ke^{-rT}
          = P + S$.
      - ask: >
          $S = 75$, $K = 70$, $r = 3\%$ continuously compounded, $T = 0.5$. What
          is $C - P$?
        expects: "6.04"
        tolerance: 0.02
        hint: >
          $C - P = S - Ke^{-rT}$ — discount the strike back to today, then
          subtract from spot.
        feedback: >
          $Ke^{-rT} = 70e^{-0.015} \approx 68.96$, so $C - P = 75 - 68.96 =
          6.04$.
      - teach: >
          It is worth stressing that this is an identity, not a model: no
          distribution of $S_T$ appears anywhere in the derivation, only that
          both portfolios pay $\max(S_T,K)$.
      - ask: >
          In the standard proof, what do portfolio A (call plus $K$ face value
          of bonds) and portfolio B (put plus one share) have in common at
          expiry?
        choices:
          - text: >
              They both pay $S_T$ regardless of the strike.
            feedback: >
              Neither portfolio pays a flat $S_T$ — the option legs make the
              payoff depend on which side of $K$ the stock ends up on.
          - text: >
              They both pay $\max(S_T, K)$ in every state.
            correct: true
            feedback: >
              Right — $K + (S_T-K)^{+}$ and $S_T + (K-S_T)^{+}$ are the same
              number in every state, both equal to $\max(S_T,K)$, which is why
              the law of one price forces their costs to match.
          - text: >
              They both pay zero when $S_T = K$.
            feedback: >
              At $S_T=K$ both portfolios pay exactly $K$, not zero — the payoff
              match holds everywhere, not just at one special point.
        feedback: >
          Both portfolios reduce to $\max(S_T,K)$ at expiry — the payoff match,
          not any assumption about probabilities, forces $C+Ke^{-rT}=P+S$.
      - ask: >
          The stock in a put-call parity question pays a dividend before expiry,
          but a candidate uses $C - P = S - Ke^{-rT}$ anyway. What is wrong?
        choices:
          - text: >
              Nothing — parity holds regardless of dividends.
            feedback: >
              One of the stated hypotheses is no dividends before $T$ — dropping
              it silently and using the plain formula anyway gives the wrong
              identity.
          - text: >
              The plain identity assumed no dividends before expiry; a dividend
              needs the adjusted form instead.
            correct: true
            feedback: >
              Right — dividends move value from the call side to the put side,
              so the identity needs $\operatorname{PV}(D)$ subtracted from $S$.
          - text: >
              The formula should use $K$ instead of $Ke^{-rT}$ once dividends
              are involved.
            feedback: >
              Discounting the strike is unrelated to dividends — that part
              stays; it is the $S$ side that needs the dividend adjustment.
        feedback: >
          Every hypothesis behind the plain identity is load-bearing — dropping
          "no dividends before $T$" silently gives the wrong number, not an
          approximately right one.
      - teach: >
          The proof depends on every option being exercised only at $T$, never
          before — American-style calls or puts void the clean two-portfolio
          replication, since early exercise can end the position before both
          sides' payoffs are ever compared.
  - node: quant-finance.arbitrage.parity-worked
    hook: >
      Getting the sign of $C - P$ instantly, without recomputing the
      formula, is the fast version of this identity that interviewers
      actually want to see.
    explanation: >
      Plugging numbers into put–call parity is mechanical, but the useful
      skill is reading the sign without doing the arithmetic: the call
      holder in $C - P = S - Ke^{-rT}$ effectively defers paying the strike
      until $T$, and the interest that deferral is worth is exactly what
      makes the call the more valuable side when $S$ and $K$ are close. As
      $K$ moves further above $S$, that advantage shrinks and can flip — a
      call struck comfortably above the current spot can be worth less than
      the corresponding put, since the put is now the side more likely to
      pay off.

      The identity pins only the difference $C - P$, never either price on
      its own — parity says nothing about the level of volatility, so it
      constrains one option once you already know the other, but it never
      tells you either price starting from nothing.
    worked: >
      $S = 60$, $K = 65$, $r = 5\%$, $T = 0.5$: $Ke^{-rT} = 65e^{-0.025}
      \approx 63.40$, so $C - P = 60 - 63.40 = -3.40$ — so the answer is
      $-3.40$: with the strike above the spot, the put is worth $3.40$ more
      than the call. If the call is quoted at $2.10$, the put must be
      $5.50$.
    interview: >
      Expect a quoted price for one option and a request for the other —
      the fast path is compute $S - Ke^{-rT}$ once, then add or subtract
      the known price, never solve for $C$ and $P$ separately from scratch.
      Being asked to explain a negative $C - P$ out loud, as here, is a
      common check that you understand the identity rather than having
      memorized one sign pattern.
    pitfalls: >
      Assuming $C > P$ always — that only holds when $S$ is at or above
      $Ke^{-rT}$; struck comfortably out of the money, the put is the more
      valuable side and $C - P$ is negative. Also, forgetting the discount
      on $K$ and using $S - K$ instead of $S - Ke^{-rT}$, which is the raw
      intrinsic-value gap, not the parity gap.
    recap: >
      With $K$ above $S$ the sign can flip: $S - Ke^{-rT}$ pins the exact
      gap, positive or negative, and the discounting of $K$ is what makes
      it differ from plain intrinsic value.
    steps:
      - teach: >
          Read the sign of $C - P = S - Ke^{-rT}$ without recomputing: the call
          holder effectively defers paying the strike until $T$, and the
          interest that deferral is worth is what makes the call the more
          valuable side when $S$ and $K$ are close.
      - teach: >
          The identity pins only the difference $C - P$, never either price on
          its own — it constrains one option once you already know the other,
          but never tells you either price starting from nothing.
      - ask: >
          $S = 120$, $K = 130$, $r = 6\%$ continuously compounded, $T = 0.5$.
          What is $C - P$?
        expects: "-6.16"
        tolerance: 0.02
        hint: >
          Compute $Ke^{-rT}$ first, then subtract from $S$ — the sign follows
          automatically.
        feedback: >
          $Ke^{-rT} = 130e^{-0.03} \approx 126.16$, so $C - P = 120 - 126.16 =
          -6.16$: with the strike above spot, the put is worth $6.16$ more than
          the call.
      - ask: >
          With the same $S = 120$, $K = 130$, $r = 6\%$, $T = 0.5$, the put is
          quoted at $18.00$. What must the call be worth?
        expects: "11.84"
        tolerance: 0.02
        hint: >
          Add the known put price to the difference $C-P$ you already computed —
          parity pins the gap, not either price alone.
        feedback: >
          $C = (C-P) + P = -6.16 + 18.00 = 11.84$.
      - teach: >
          Assuming $C > P$ always is wrong: that only holds when $S$ is at or
          above $Ke^{-rT}$. Struck comfortably above spot, the put becomes the
          more valuable side.
      - ask: >
          A candidate assumes $C > P$ always holds and is surprised to see a
          quoted call cheaper than the corresponding put. What is the actual
          condition for $C > P$?
        choices:
          - text: >
              $C > P$ always, regardless of strike or spot.
            feedback: >
              That is the assumption being tested — it is false whenever the
              strike sits far enough above spot relative to the discount.
          - text: >
              $C > P$ exactly when $S > Ke^{-rT}$.
            correct: true
            feedback: >
              Right — $C-P=S-Ke^{-rT}$, so the sign flips exactly at
              $S=Ke^{-rT}$, not at $S=K$.
          - text: >
              $C > P$ exactly when $S > K$.
            feedback: >
              Close, but not quite — the comparison is against the discounted
              strike $Ke^{-rT}$, not the raw strike $K$, since the identity
              already builds in the interest on $K$.
        feedback: >
          The sign of $C-P$ flips at $S=Ke^{-rT}$, not at $S=K$ — forgetting the
          discount is the most common version of this mistake.
      - teach: >
          The parity gap and plain intrinsic value differ by exactly the
          interest on $K$ — conflating $S-K$ with $S-Ke^{-rT}$ is the single
          most common numeric slip in this identity.
  - node: quant-finance.arbitrage.parity-violation
    hook: >
      "The screen shows a call and a put that violate parity — what trade
      do you put on?" is asked with real numbers, and the conversion is the
      exact, nameable answer.
    explanation: >
      When the market's quoted gap $C - P$ exceeds the fair gap
      $S - Ke^{-rT}$, the call is priced rich relative to the put, and the
      trade that exploits it is called a conversion: sell the rich call,
      buy the put, buy the share, funding the net outlay by borrowing at
      $r$. By the parity proof, the share plus the put minus the call is
      worth exactly $K$ at expiry in every state — a synthetic riskless bond
      — so repaying the loan against that guaranteed $K$ locks in the
      mispricing, carried forward to expiry at the borrowing rate.

      When the gap is too small instead — the put priced rich relative to
      the call — the mirror trade, a reversal, does the same job with every
      leg flipped: buy the call, sell the put, short the share, and lend the
      resulting credit instead of borrowing. Either way the size of the
      profit at expiry is today's mispricing compounded forward by
      $e^{rT}$, not the raw mispricing itself.
    worked: >
      $S = 50$, $K = 50$, $r = 4\%$, $T = 1$: fair gap $50 - 50e^{-0.04}
      \approx 50 - 48.04 = 1.96$. Suppose the screen shows $C = 5.00$,
      $P = 2.00$, a gap of $3.00$ — the call is rich. Conversion: short the
      call ($+5$), long the put ($-2$), long the share ($-50$), a net
      outlay of $47$, funded by borrowing at $4\%$. At expiry the share
      plus put minus call is worth exactly $K = 50$ regardless of $S_T$;
      repay $47e^{0.04} \approx 48.92$ and keep $50 - 48.92 = 1.08$ — so the
      answer is $1.08$, close to the $1.04$ mispricing carried one year
      forward.
    interview: >
      State the four legs in order — short the rich option, long the cheap
      one, take the matching stock position, finance the difference — and
      name the trade a "conversion" or "reversal" by ear; interviewers use
      these terms and expect them back.
    pitfalls: >
      Sizing the profit as the raw mispricing rather than the mispricing
      compounded forward at $r$ to expiry — the two only coincide when $r$
      or $T$ is near zero. Also, getting the stock leg backwards: a
      conversion is long the share, a reversal is short it, and mixing them
      up inverts the whole trade's sign.
    recap: >
      A gap wider than fair means sell the call, buy the put, buy the share
      and borrow the rest — a conversion — locking in today's mispricing
      carried forward to expiry; a reversal is the exact mirror when the
      gap is too narrow.
    steps:
      - teach: >
          When the quoted gap $C-P$ exceeds the fair gap $S-Ke^{-rT}$, the call
          is rich relative to the put, and the trade is a conversion: sell the
          rich call, buy the put, buy the share, funding the outlay by borrowing
          at $r$.
      - teach: >
          When the gap is too small instead — the put rich relative to the call
          — a reversal does the mirror job: buy the call, sell the put, short
          the share, and lend the resulting credit. Either way the profit at
          expiry is today's mispricing compounded forward by $e^{rT}$, not the
          raw mispricing itself.
      - ask: >
          $S = 80$, $K = 80$, $r = 5\%$ continuously compounded, $T = 1$, so the
          fair gap is $S-Ke^{-rT} \approx 3.90$. The screen shows $C = 9.00$, $P
          = 3.00$ — a gap of $6.00$, so the call is rich. Sell the call, buy the
          put, buy the share, funding the $74.00$ net outlay by borrowing at
          $5\%$. What is the riskless profit at expiry?
        expects: "2.21"
        tolerance: 0.02
        hint: >
          At expiry the share plus put minus call is worth exactly $K$
          regardless of $S_T$ — the profit is $K$ minus the loan repaid.
        feedback: >
          Repaying $74e^{0.05} \approx 77.79$ against the guaranteed $K=80$ at
          expiry leaves $80 - 77.79 = 2.21$.
      - ask: >
          Same $S=80$, $K=80$, $r=5\%$, $T=1$, fair gap $3.90$, but now the
          screen shows $C = 4.00$, $P = 5.00$ — a gap of $-1.00$, well below
          fair. Which trade captures the mispricing?
        choices:
          - text: >
              A conversion: sell the call, buy the put, buy the share.
            feedback: >
              A conversion is the trade for a call priced rich relative to the
              put — here the put is the rich side, so the trade runs the other
              way.
          - text: >
              A reversal: buy the call, sell the put, short the share, and lend
              the credit.
            correct: true
            feedback: >
              Right — the put is rich here, so the mirror trade applies: long
              the cheap call, short the rich put, short the share, lending the
              resulting credit.
          - text: >
              Do nothing, since the gap is negative rather than positive.
            feedback: >
              A negative gap is just as much a mispricing as a positive one — it
              is captured by the reversal, not ignored.
        feedback: >
          A gap smaller than fair means the put is rich: run the reversal, the
          exact mirror of the conversion used when the call is rich instead.
      - teach: >
          Sizing the profit as the raw mispricing rather than the mispricing
          compounded forward at $r$ to expiry is the most common numeric slip —
          the two only coincide when $r$ or $T$ is near zero.
      - ask: >
          In a conversion, which stock position do you take?
        choices:
          - text: >
              Long the share.
            correct: true
            feedback: >
              Right — a conversion is long share, long put, short call; getting
              this backwards inverts the whole trade's sign.
          - text: >
              Short the share.
            feedback: >
              That is the stock leg of a reversal, the mirror trade — a
              conversion holds the share long.
          - text: >
              No stock position is needed.
            feedback: >
              The share is one of the three legs that together replicate a
              synthetic bond worth $K$ at expiry — without it the payoff would
              not be state-independent.
        feedback: >
          Conversion is long share, long put, short call; reversal flips every
          leg. Mixing up the stock leg is the most common way to invert the
          trade's sign.
      - teach: >
          State the four legs in order whenever asked — short the rich side,
          long the cheap side, match the stock position, and finance the
          difference — naming the trade by ear is exactly what interviewers
          grade.
  - node: quant-finance.arbitrage.synthetics
    hook: >
      Every trading desk quotes conversions and boxes because parity turns
      any one of call, put, stock and bond into a combination of the other
      three — this is how desks manufacture whichever leg is missing or
      mispriced.
    explanation: >
      Rearranging $C - P = S - Ke^{-rT}$ solves for any single instrument
      in terms of the other three. Synthetic long stock is long call, short
      put, plus $K$ face value of bonds: $S = C - P + Ke^{-rT}$. Synthetic
      call is long put, long share, short $Ke^{-rT}$ of bonds. The working
      use is always the same: price the synthetic from the other three
      legs, compare it to the direct quote, and trade whichever side is out
      of line, since the whole package is delta-flat by construction — its
      value does not move with small moves in $S_T$.

      Two named combinations recur constantly. A conversion is long share,
      long put, short call at one strike and expiry — a package worth
      exactly $K$ at expiry no matter what $S_T$ does, functioning as a
      synthetic riskless bond; a reversal is its exact opposite. Combine a
      conversion at one strike with a reversal at a higher strike and the
      two option legs cancel down to a box spread: riskless, and paying
      exactly the gap between the two strikes at expiry — which is why
      desks use boxes to lend or borrow through the options market rather
      than through a bank.
    worked: >
      Price a box spread from strikes $K_1 = 90$ and $K_2 = 100$, $r = 5\%$,
      $T = 1$: its fair value is the discounted spread, $(K_2 - K_1)e^{-rT}
      = 10e^{-0.05} \approx 9.51$, and its certain payoff at expiry is
      $10$. If the box is quoted at $9.00$, buy it, funding the purchase by
      borrowing at $5\%$: repay $9.00e^{0.05} \approx 9.46$ at $T$, collect
      the guaranteed $10$, and keep $10 - 9.46 = 0.54$ — so the answer is
      $0.54$.
    interview: >
      "Build synthetic stock from options" or "price a box spread" are both
      standard prompts — the fast answer rearranges $C - P = S - Ke^{-rT}$
      live rather than reciting a memorized synthetic formula, since every
      synthetic is the same one identity solved for a different variable.
    pitfalls: >
      Forgetting that a box's fair value is the discounted strike spread,
      not the raw spread — comparing a quoted box price to $K_2 - K_1$
      directly instead of to $(K_2-K_1)e^{-rT}$ misjudges every box as
      mispriced. Also, mismatching strikes or expiries between the
      conversion and reversal legs, which breaks the option cancellation
      that makes the box riskless.
    recap: >
      Any one of call, put, stock and bond is replicable from the other
      three by rearranging parity — conversions and reversals synthesize a
      bond from options and stock, and two of them at different strikes
      combine into a riskless box worth the discounted strike spread.
    steps:
      - teach: >
          Rearranging $C - P = S - Ke^{-rT}$ solves for any single instrument in
          terms of the other three: synthetic long stock is long call, short
          put, plus $K$ face value of bonds, $S = C - P + Ke^{-rT}$.
      - teach: >
          A conversion is long share, long put, short call at one strike and
          expiry — a synthetic riskless bond worth exactly $K$ at expiry — and a
          reversal is its opposite. Combine a conversion at one strike with a
          reversal at a higher strike and the option legs cancel down to a box
          spread, riskless and paying the strike gap.
      - ask: >
          Price a box spread from strikes $K_1 = 95$ and $K_2 = 110$, $r = 4\%$
          continuously compounded, $T = 1$. Its certain payoff at expiry is $K_2
          - K_1 = 15$. If the box is quoted at $13.50$, buy it, funding the
          purchase by borrowing at $4\%$. What is the riskless profit at expiry?
        expects: "0.95"
        tolerance: 0.02
        hint: >
          Compare the guaranteed $15$ payoff at expiry against the quoted price
          compounded forward at $r$.
        feedback: >
          Repaying $13.50e^{0.04} \approx 14.05$ against the guaranteed $15$ at
          expiry leaves $15 - 14.05 = 0.95$.
      - teach: >
          A box's fair value is the discounted strike spread $(K_2-K_1)e^{-rT}$,
          not the raw spread — comparing a quote to the raw spread directly
          misjudges every box as more mispriced than it is.
      - ask: >
          A box spread with strikes $90$ and $105$ is quoted at $14.00$, $r =
          5\%$, $T = 1$. A candidate compares $14.00$ to the raw spread of $15$
          and concludes it is cheap by $1.00$. What is wrong?
        choices:
          - text: >
              Nothing — the box is indeed cheap by $1.00$.
            feedback: >
              That comparison uses the raw spread instead of the discounted one,
              which misstates how cheap or rich the box actually is.
          - text: >
              The fair value is the discounted spread $(105-90)e^{-0.05} \approx
              14.27$, not the raw $15$, so the box is cheap by roughly $0.27$.
            correct: true
            feedback: >
              Right — a box's fair value discounts the guaranteed future payoff
              back to today; comparing the quote to the undiscounted spread
              misjudges the mispricing.
          - text: >
              The fair value should use $K_2+K_1$ instead of $K_2-K_1$.
            feedback: >
              The payoff at expiry is the difference between the two strikes,
              not their sum — a box combines a conversion and a reversal so the
              option legs cancel down to exactly that spread.
        feedback: >
          A box's fair value is always the strike spread discounted back to
          today, $(K_2-K_1)e^{-rT}$ — comparing a quote to the raw spread
          overstates every box's apparent mispricing.
      - teach: >
          Mismatching strikes or expiries between the conversion and reversal
          legs breaks the option cancellation that makes a box riskless — every
          leg has to share the same expiry, and only the strikes differ.
      - ask: >
          Which combination of instruments replicates synthetic long stock?
        choices:
          - text: >
              Long call, short put, plus $K$ face value of bonds.
            correct: true
            feedback: >
              Right — $S=C-P+Ke^{-rT}$ falls straight out of rearranging parity.
          - text: >
              Long put, long call, short $K$ bonds.
            feedback: >
              That combination is not parity rearranged for the stock — holding
              both options long with a short bond position does not reduce to
              $S$.
          - text: >
              Short call, short put, long $Ke^{-rT}$ bonds.
            feedback: >
              Shorting both options does not replicate a long stock position —
              the signs need to be long call, short put to get synthetic long
              stock.
        feedback: >
          Every synthetic in this unit is the same identity, $C-P=S-Ke^{-rT}$,
          solved for a different variable — synthetic stock is long call, short
          put, plus $K$ of bonds.
  - node: quant-finance.arbitrage.parity-dividends
    hook: >
      An interviewer who adds "and the stock pays a dividend" to a parity
      question is testing whether you know which side of the identity
      moves, and by how much.
    explanation: >
      Dividends paid before expiry move value from the call side of parity
      to the put side. With dividends of known present value
      $\operatorname{PV}(D)$, $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$;
      with a continuous yield $q$ instead, $C - P = Se^{-qT} - Ke^{-rT}$.
      The reasoning traces straight back to the replicating portfolio: the
      share leg of that portfolio collects the dividends along the way, so
      only the ex-dividend part of the spot needs to be funded by the bond
      leg — the call holder, who owns no share yet, never sees that income.

      The tidiest way to hold every case in one formula is to write parity
      in terms of the forward price itself: $C - P = (F - K)e^{-rT}$, since
      $F$ already embeds whatever dividend, yield or storage adjustment
      applies. This is the version worth defaulting to once the forward is
      known, because it never needs re-deriving for a new carry structure.
    worked: >
      $S = 200$, $K = 190$, $r = 5\%$, $T = 1$, continuous dividend yield
      $q = 3\%$: $C - P = 200e^{-0.03} - 190e^{-0.05} \approx 194.09 -
      180.73 = 13.36$ — so the answer is $13.36$, below the no-dividend gap
      of $200 - 190e^{-0.05} \approx 19.27$ by roughly the value of the
      yield.
    interview: >
      Whenever a parity question mentions a dividend or an index yield, the
      expected move is to substitute into
      $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$ or the yield form
      immediately, and being able to fall back on $C - P = (F-K)e^{-rT}$
      when the forward is already given saves a step.
    pitfalls: >
      Applying the discrete-dividend form and the continuous-yield form to
      the same problem, or forgetting the dividend altogether and reusing
      the no-dividend identity — the gap always shrinks once real income is
      subtracted from the share side. Also, discounting the dividend at $T$
      instead of at its own payment date.
    recap: >
      Dividends or yield shrink the call–put gap by moving value to the put
      side — $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$ for known
      dividends, $Se^{-qT} - Ke^{-rT}$ for a continuous yield, or
      $(F-K)e^{-rT}$ in forward terms covering both at once.
    steps:
      - teach: >
          Dividends paid before expiry move value from the call side of parity
          to the put side. With known present value $\operatorname{PV}(D)$, $C -
          P = S - \operatorname{PV}(D) - Ke^{-rT}$; with a continuous yield $q$
          instead, $C - P = Se^{-qT} - Ke^{-rT}$.
      - teach: >
          The tidiest form covers every carry case at once by writing parity in
          terms of the forward price itself: $C - P = (F-K)e^{-rT}$, since $F$
          already embeds whatever dividend or yield adjustment applies.
      - ask: >
          $S = 150$, $K = 140$, $r = 4\%$ continuously compounded, $T = 1$, with
          a dividend of known present value $\operatorname{PV}(D) = 3.50$ paid
          before expiry. What is $C - P$?
        expects: "11.99"
        tolerance: 0.02
        hint: >
          Subtract the dividend's present value from $S$ before discounting the
          strike and subtracting.
        feedback: >
          $C-P = S - \operatorname{PV}(D) - Ke^{-rT} = 150 - 3.50 - 140e^{-0.04}
          \approx 146.50 - 134.51 = 11.99$.
      - ask: >
          A parity question states the underlying index pays a continuous
          dividend yield of $2\%$, not a fixed cash amount. Which form of the
          identity applies?
        choices:
          - text: >
              $C-P=S-\operatorname{PV}(D)-Ke^{-rT}$, treating the yield as a
              single cash dividend.
            feedback: >
              That form is for a known cash dividend, not a continuous yield —
              mixing the two forms is a common error.
          - text: >
              $C-P=Se^{-qT}-Ke^{-rT}$.
            correct: true
            feedback: >
              Right — a continuous yield discounts the spot itself by $e^{-qT}$;
              the discrete-dividend form does not apply here.
          - text: >
              $C-P=S-Ke^{-rT}$, ignoring the yield entirely.
            feedback: >
              Ignoring the yield reuses the no-dividend identity, which
              overstates the gap — any real income lowers $C-P$.
        feedback: >
          A continuous yield uses $Se^{-qT}$ in place of
          $S-\operatorname{PV}(D)$ — matching the adjustment's form to how the
          income is actually described is the whole trick.
      - teach: >
          A common slip is applying the discrete-dividend and continuous-yield
          forms to the same problem, or forgetting the dividend altogether — the
          gap always shrinks once real income is subtracted from the share side.
      - ask: >
          A stock's forward price for delivery at $T = 1$ is $F = 147.50$ once
          every carry adjustment is already priced in, $K = 140$, $r = 4\%$
          continuously compounded. Using $C-P=(F-K)e^{-rT}$, what is $C - P$?
        expects: "7.21"
        tolerance: 0.02
        hint: >
          The forward already embeds whatever dividend or yield applies — just
          discount the gap between $F$ and $K$.
        feedback: >
          $C-P=(147.50-140)e^{-0.04}=7.50(0.9608) \approx 7.21$.
      - teach: >
          Dividends or yield always shrink the call-put gap by moving value to
          the put side — the forward-price form $(F-K)e^{-rT}$ is the version
          worth defaulting to once the forward is already known.
  - node: quant-finance.arbitrage.option-bounds
    hook: >
      "Without a pricing model, what can you say about this option's
      price?" is answered entirely by these bounds — no volatility, no
      distribution, just arbitrage.
    explanation: >
      For European options on a non-dividend stock, four inequalities hold
      with nothing more than no-arbitrage: $0 \le C \le S$ and
      $C \ge (S - Ke^{-rT})^{+}$; symmetrically $0 \le P \le Ke^{-rT}$ and
      $P \ge (Ke^{-rT} - S)^{+}$. The upper bounds are the easy direction: a
      call can never be worth more than the stock itself, since owning the
      stock outright dominates the right to buy it, and a put can never be
      worth more than $Ke^{-rT}$, the most it could ever pay discounted to
      today.

      The lower bounds fall straight out of put–call parity plus the fact
      that option prices cannot be negative: from $C = P + S - Ke^{-rT}$ and
      $P \ge 0$, immediately $C \ge S - Ke^{-rT}$, and the same substitution
      with $C \ge 0$ gives the put's floor. Since $C \ge 0$ always as well,
      the two lower bounds combine into the stated $(\cdot)^{+}$ form —
      whichever of the two terms is larger.

      American options only add value on top of these: $C_A \ge \max(C,
      S-K)$ and $P_A \ge \max(P, K-S)$, since the American holder has every
      right the European holder has plus the option to exercise early.
    worked: >
      $S = 70$, $K = 80$, $r = 3\%$, $T = 0.5$: $Ke^{-rT} = 80e^{-0.015}
      \approx 78.81$. The call's floor is $(70 - 78.81)^{+} = 0$ — since
      the stock is well below the discounted strike, the ordinary
      $C \ge 0$ bound is the one that actually binds, not the parity-based
      floor — while its ceiling stays $C \le 70$. The put's floor is
      $(78.81 - 70)^{+} = 8.81$, so the put must trade between $8.81$ and
      $78.81$ — so the answer is a put no cheaper than $8.81$.
    interview: >
      Given a spot, strike, rate and expiry with no volatility mentioned,
      the interviewer wants both bounds stated and, ideally, which one is
      binding — an out-of-the-money option like the call above has its
      lower bound collapse to the trivial $0 \ge \dots$, and noticing that
      is the actual test.
    pitfalls: >
      Quoting the parity-derived lower bound as if it always binds — when
      the stock is well below the discounted strike, plain nonnegativity is
      the tighter floor for the call, and the reverse for the put. Also,
      applying these bounds to American options directly; American values
      need the separate, looser inequalities.
    recap: >
      Every European option price sits in a box fixed purely by arbitrage
      — $0 \le C \le S$ with floor $(S-Ke^{-rT})^{+}$, and symmetrically for
      the put — with no model or volatility involved.
    steps:
      - teach: >
          For European options on a non-dividend stock: $0 \le C \le S$ and $C
          \ge (S-Ke^{-rT})^{+}$; symmetrically $0 \le P \le Ke^{-rT}$ and $P \ge
          (Ke^{-rT}-S)^{+}$. The upper bounds are direct: a call never beats
          owning the stock outright, and a put never pays more than $K$.
      - teach: >
          The lower bounds fall out of put-call parity plus nonnegativity: from
          $C = P + S - Ke^{-rT}$ and $P \ge 0$, immediately $C \ge S -
          Ke^{-rT}$, and symmetrically for the put. American options add on top:
          $C_A \ge \max(C, S-K)$ and $P_A \ge \max(P, K-S)$.
      - ask: >
          $S = 55$, $K = 60$, $r = 4\%$ continuously compounded, $T = 0.5$. What
          is the put's lower bound, $(Ke^{-rT}-S)^{+}$?
        expects: "3.81"
        tolerance: 0.02
        hint: >
          First discount the strike, then subtract the spot — floor at zero if
          that is negative.
        feedback: >
          $Ke^{-rT}=60e^{-0.02} \approx 58.81$, so the put's floor is $58.81 -
          55 = 3.81$.
      - ask: >
          With the same numbers, $S = 55 < Ke^{-rT} = 58.81$. Which lower bound
          actually binds for the call?
        choices:
          - text: >
              The parity-derived bound $S-Ke^{-rT}$, which is negative here.
            feedback: >
              A negative number is a valid inequality but not a useful floor —
              nonnegativity is strictly tighter whenever the parity bound goes
              negative.
          - text: >
              Plain nonnegativity, $C \ge 0$, since the parity-derived bound is
              negative here.
            correct: true
            feedback: >
              Right — whenever the stock sits below the discounted strike,
              $S-Ke^{-rT}$ is negative and $C\ge0$ is the bound that actually
              constrains the price.
          - text: >
              Neither bound applies once the option is out of the money.
            feedback: >
              Both bounds still hold — nonnegativity is simply the tighter, more
              informative one in this case.
        feedback: >
          Out-of-the-money, the parity-derived floor collapses below zero and
          plain nonnegativity becomes the binding constraint — noticing which
          bound binds is the actual skill being tested.
      - teach: >
          American options only add value on top of the European bounds — the
          American holder has every right the European holder has, plus the
          option to exercise early.
      - ask: >
          Can the European bound $C \ge (S-Ke^{-rT})^{+}$ be used directly as
          the floor for an American call?
        choices:
          - text: >
              Yes, the same bound applies unchanged.
            feedback: >
              American values need the separate, looser inequality
              $C_A\ge\max(C,S-K)$ — using the European floor alone can
              understate the American option's value.
          - text: >
              No — American options need the separate bound $C_A\ge\max(C,S-K)$,
              since early exercise adds value on top.
            correct: true
            feedback: >
              Right — the American holder has every right the European holder
              has, plus the option to exercise early, so its floor is at least
              as high, stated separately.
          - text: >
              No, because American options have no lower bound at all.
            feedback: >
              American options do have a lower bound — it is simply a different,
              looser one than the plain European bound, not an absence of one.
        feedback: >
          European bounds are a floor for the American price too, but American
          options carry an additional bound from early exercise that has to be
          stated separately.
      - teach: >
          Every European option price sits in a box fixed purely by arbitrage —
          no model, no volatility, just the spot, the strike and the rate.
  - node: quant-finance.arbitrage.no-early-exercise
    hook: >
      "Would you ever exercise an American call early on a stock with no
      dividends?" has one correct answer, and the arbitrage bound proves it
      in two lines.
    explanation: >
      For an American call on a non-dividend stock with $r > 0$, early
      exercise is never optimal, so the American call is worth exactly what
      the European call is worth. The proof is immediate from the option
      bounds: $C_A \ge C \ge S - Ke^{-rT} > S - K$ whenever $r>0$ and
      $T>0$, and $S - K$ is all that exercising the option collects. Since
      the option alive is worth strictly more than the option exercised,
      selling it always beats exercising it.

      Two equivalent economic readings are worth having ready. Exercising
      early pays the strike a full period ahead of when it is actually
      owed, forfeiting the interest that deferral is worth — exactly the
      gap between $Ke^{-rT}$ and $K$. And by parity, giving up the option
      early also throws away the protective put embedded in it, worth
      $P \ge 0$, for nothing in return.

      The argument depends entirely on there being no dividend before
      expiry — a dividend transfers value out of the stock the option
      holder doesn't own yet, and exercising just before a large enough
      dividend can genuinely be the better choice.
    worked: >
      $S = 90$, $K = 80$, $r = 6\%$, $T = 0.5$: exercising now collects the
      intrinsic value $S - K = 10$. The arbitrage floor is
      $S - Ke^{-rT} = 90 - 80e^{-0.03} \approx 90 - 77.64 = 12.36$, strictly
      above $10$ — so the answer is that holding is worth at least $12.36$
      against only $10$ from exercising, a $2.36$ loss avoided by not
      exercising.
    interview: >
      The expected answer names the inequality $C \ge S - Ke^{-rT} > S - K$
      directly rather than an intuition-only argument, and immediately
      flags that a dividend breaks it — interviewers often follow up by
      asking exactly that.
    pitfalls: >
      Reasoning from intuition alone, "why give up time value," without
      being able to produce the actual inequality — interviewers want the
      arbitrage bound, not just the conclusion. Also, forgetting the
      no-dividend hypothesis is doing all the work; stating the result as
      universally true for American calls is wrong.
    recap: >
      An American call on a non-dividend stock is never worth exercising
      early, because its arbitrage floor $S - Ke^{-rT}$ already exceeds the
      intrinsic value $S-K$ that exercising collects — so it is worth
      exactly the European call.
    steps:
      - teach: >
          For an American call on a non-dividend stock with $r > 0$, early
          exercise is never optimal: the proof is immediate from the option
          bounds, $C_A \ge C \ge S - Ke^{-rT} > S - K$, and $S-K$ is all that
          exercising collects.
      - teach: >
          Two equivalent economic readings help: exercising early pays the
          strike a full period ahead of when it is owed, forfeiting the interest
          that deferral is worth, and by parity it also throws away the
          protective put embedded in the option, worth $P \ge 0$, for nothing.
      - ask: >
          $S = 110$, $K = 95$, $r = 5\%$ continuously compounded, $T = 0.75$.
          Exercising now collects the intrinsic value $S - K = 15$. What is the
          arbitrage floor $S - Ke^{-rT}$, the value of holding instead?
        expects: "18.50"
        tolerance: 0.05
        hint: >
          Discount the strike back to today first, then subtract from the spot.
        feedback: >
          $Ke^{-rT}=95e^{-0.0375} \approx 91.50$, so the floor is $110 - 91.50 =
          18.50$ — strictly above the $15$ from exercising, so holding
          dominates.
      - ask: >
          Given the floor $18.50$ exceeds the intrinsic value $15$ by $3.50$,
          what does that $3.50$ represent economically?
        choices:
          - text: >
              The dividend the holder would forfeit by not exercising.
            feedback: >
              There is no dividend in this scenario — the assumption throughout
              is a non-dividend stock, which is exactly why the
              no-early-exercise argument holds.
          - text: >
              The interest on the strike forfeited by exercising early, plus the
              protective put given up for nothing.
            correct: true
            feedback: >
              Right — exercising pays $K$ a full period early, forfeiting the
              interest that deferral is worth, and by parity also throws away
              the embedded protective put, worth $P\ge0$.
          - text: >
              Transaction costs saved by not exercising.
            feedback: >
              Nothing here involves transaction costs — the frictionless setting
              throughout this unit assumes those away; the gap is purely the
              interest and protection value given up.
        feedback: >
          The gap between the arbitrage floor and intrinsic value is exactly the
          interest on the deferred strike plus the protective put's value, both
          forfeited by exercising early.
      - teach: >
          The argument depends entirely on there being no dividend before expiry
          — a dividend transfers value out of the stock the option holder does
          not own yet.
      - ask: >
          Does the no-early-exercise result for American calls still hold if the
          stock pays a large dividend just before expiry?
        choices:
          - text: >
              Yes, the result holds for any non-dividend or dividend-paying
              stock.
            feedback: >
              The no-dividend hypothesis is doing all the work in the proof — a
              large dividend can make early exercise genuinely optimal.
          - text: >
              No — a dividend transfers value out of the stock the option holder
              does not own yet, and exercising just before it can be optimal.
            correct: true
            feedback: >
              Right — the proof's inequality $S-Ke^{-rT}>S-K$ says nothing about
              a stock about to drop in value from a dividend payment, which is
              exactly why the hypothesis matters.
          - text: >
              No, because American calls are never worth exercising early under
              any circumstances.
            feedback: >
              That is too strong — the result specifically requires no dividend
              before expiry; once that hypothesis fails, the conclusion can fail
              with it.
        feedback: >
          The entire argument leans on there being no dividend before $T$ —
          state that hypothesis every time, since a dividend is exactly the case
          where it breaks.
      - teach: >
          An American call on a non-dividend stock is worth exactly the European
          call, because its arbitrage floor already exceeds what exercising
          collects.
  - node: quant-finance.arbitrage.american-put-early
    hook: >
      This is the one clean exception in the whole unit — the single case
      where "never exercise early" flips to "sometimes you must," and
      interviewers ask for it specifically because it is the exception.
    explanation: >
      The argument for calls reverses for puts because of a
      cash-versus-time-value asymmetry: exercising an American put
      immediately pays $K - S$ in cash right now, while a European put can
      never be worth more than $Ke^{-rT}$, the present value of its single
      best possible outcome, since even the maximum payoff $K$ itself only
      arrives at $T$, discounted back.

      Deep in the money, with $S$ near zero, exercising collects close to
      the full strike $K$ today, but the European put is capped at
      $Ke^{-rT}$, strictly less than $K$. Since the American put must be
      worth at least what immediate exercise pays, $P_A \ge K - S$, while
      $P \le Ke^{-rT} < K$, there is a stock price low enough that $P_A$
      strictly exceeds $P$ — early exercise becomes optimal below some
      critical boundary, and that boundary has no closed form.

      The interview-ready summary pairs directly with the call result: an
      American call on a non-dividend stock equals the European call, but
      an American put can be strictly more valuable than the European put.
      On a non-dividend stock, parity itself degrades from an equality to
      the two-sided band $S - K \le C_A - P_A \le S - Ke^{-rT}$ once early
      exercise is a live possibility.
    worked: >
      $K = 50$, $r = 4\%$, $T = 2$, and $S = 2$ — deep in the money.
      Exercising now collects $K - S = 48$ in cash. The European put's
      ceiling is $Ke^{-rT} = 50e^{-0.08} \approx 46.16$, strictly below the
      $48$ available from exercising — so the answer is that the American
      put must be worth at least $48$, strictly more than any European put
      on the same terms could be.
    interview: >
      "Does the no-early-exercise result apply to puts?" is a near-automatic
      follow-up after stating it for calls — the correct answer names the
      asymmetry directly: exercising a put realizes cash now, exercising a
      call gives up cash it would otherwise still owe, and that difference
      is why the results are not symmetric.
    pitfalls: >
      Assuming the no-early-exercise argument for calls transfers to puts
      by symmetry — it does not, precisely because a put's exercise value
      is cash received rather than cash deferred. Also, expecting a
      closed-form exercise boundary for the American put; none exists in
      general, only the qualitative fact that one exists below some
      critical stock price.
    recap: >
      Deep in the money, exercising an American put now for $K-S$ in cash
      can beat any European put, which is capped at $Ke^{-rT} < K$ — the
      one case where early exercise survives, unlike the American call.
    steps:
      - teach: >
          The argument for calls reverses for puts: exercising an American put
          immediately pays $K-S$ in cash right now, while a European put can
          never be worth more than $Ke^{-rT}$, the present value of its single
          best possible outcome.
      - teach: >
          Deep in the money, with $S$ near zero, exercising collects close to
          the full strike $K$ today, but the European put is capped at
          $Ke^{-rT}$, strictly less than $K$ — so early exercise becomes optimal
          below some critical stock price, and that boundary has no closed form.
      - ask: >
          $K = 80$, $r = 6\%$ continuously compounded, $T = 3$, and $S = 1$ —
          deep in the money. Exercising now collects $K - S = 79$ in cash. What
          is the European put's ceiling, $Ke^{-rT}$?
        expects: "66.82"
        tolerance: 0.05
        hint: >
          Discount the full strike back three years at the continuously
          compounded rate.
        feedback: >
          $Ke^{-rT}=80e^{-0.18} \approx 66.82$, strictly below the $79$
          available from exercising — so the American put must be worth at least
          $79$, more than any European put on the same terms could be.
      - ask: >
          Why doesn't the no-early-exercise result for calls carry over to
          American puts by the same logic?
        choices:
          - text: >
              Because puts and calls always behave identically under parity.
            feedback: >
              Parity relates them, but this particular conclusion does not
              transfer — the asymmetry is exactly what breaks the analogy.
          - text: >
              Because exercising a put realizes cash immediately, while
              exercising a call gives up cash it would otherwise still owe — the
              two are not symmetric.
            correct: true
            feedback: >
              Right — a call's early exercise pays the strike early, forfeiting
              interest; a put's early exercise collects the strike early,
              gaining interest. That asymmetry is what makes puts different.
          - text: >
              Because American puts do not actually exist on non-dividend
              stocks.
            feedback: >
              American puts on non-dividend stocks are exactly the setting where
              this early-exercise question is interesting — they exist and
              behave differently from calls precisely here.
        feedback: >
          The asymmetry is cash received versus cash deferred: a put's early
          exercise is a cash windfall today, which can outweigh the option value
          a European put is capped at.
      - teach: >
          The interview-ready summary pairs directly with the call result: an
          American call on a non-dividend stock equals the European call, but an
          American put can be strictly more valuable than the European put.
      - ask: >
          Is there a closed-form expression for the critical stock price below
          which an American put should be exercised early?
        choices:
          - text: >
              Yes, it is $Ke^{-rT}$.
            feedback: >
              $Ke^{-rT}$ is the European put's ceiling, not the exercise
              boundary — the actual boundary is a different, more complex
              quantity.
          - text: >
              No — only the qualitative fact that such a boundary exists below
              some critical stock price, with no closed form in general.
            correct: true
            feedback: >
              Right — the argument shows a boundary must exist (since exercising
              deep enough in the money beats any European put's cap) but pins
              down no formula for exactly where it sits.
          - text: >
              Yes, it is always exactly $K$.
            feedback: >
              The boundary sits below $K$, at some price where the
              early-exercise premium first exceeds the European put's remaining
              value — not at the strike itself.
        feedback: >
          Only the existence of a critical boundary is guaranteed by this
          argument — its exact location has no closed form in general, unlike
          the plain no-early-exercise result for calls.
      - teach: >
          On a non-dividend stock, parity itself degrades from an equality to
          the two-sided band $S-K \le C_A - P_A \le S-Ke^{-rT}$ once early
          exercise is a live possibility.
  - node: quant-finance.arbitrage.fx-triangular
    hook: >
      Triangular FX arbitrage is the law of one price wearing a currency
      costume, and the mechanical trade — three legs, one loop — is asked
      almost verbatim across trading desks.
    explanation: >
      Three currencies give three exchange rates, and the law of one price
      demands they multiply to exactly one around the loop — otherwise
      converting through all three and back is not a neutral round trip, it
      is a source of free money. Given rates for currency A into B, B into
      C, and a direct quote for A into C, the implied cross from the first
      two legs is the product of those two rates; whenever the direct quote
      disagrees with that implied cross, one path through the loop is
      strictly cheaper than the other.

      The trade itself has no distribution of anything in it and no
      position held afterward — it is three simultaneous conversions,
      ending back in the starting currency with strictly more of it than
      you began with. Which direction to run the loop is read straight off
      which side of the implied cross the direct quote sits on; the
      round-trip spread on all three legs is the real-world hurdle, and
      shaving it thin enough to trade profitably is a latency business
      rather than an analytical one.
    worked: >
      Quotes: GBP/USD $= 1.30$, EUR/USD $= 1.05$, and a direct GBP/EUR
      quote of $1.26$. The implied cross from the first two legs is
      $1.30/1.05 \approx 1.2381$, so the direct quote of $1.26$ makes the
      pound rich against the euro. Starting with $1{,}000{,}000$ USD:
      convert to GBP at $1.30$ to get $769{,}230.77$ GBP; sell those for
      EUR at the rich quoted $1.26$ to get $969{,}230.77$ EUR; convert back
      to USD at $1.05$ to get $1{,}017{,}692.31$ USD — a riskless profit of
      $17{,}692.31$ USD, about $1.77\%$, with no position held at the end.
    interview: >
      "Given these three FX quotes, is there an arbitrage, and how would
      you trade it?" expects the implied-cross comparison stated first,
      then the specific three-leg loop in the correct direction — naming
      which leg is mispriced, not just noticing the rates disagree.
    pitfalls: >
      Getting a quote convention backwards — dividing instead of
      multiplying, or inverting which currency is the base — flips the
      direction of the whole loop and turns a profitable trade into a
      loss. Also, ignoring the three round-trip spreads: a cross a few
      basis points off the implied rate is often entirely inside
      transaction cost and not tradeable at all.
    recap: >
      Three FX rates must multiply to one around any loop; when they do
      not, converting through all three legs and back turns a fixed
      starting amount into strictly more of the same currency, riskless.
    steps:
      - teach: >
          Three currencies give three exchange rates, and the law of one price
          demands they multiply to exactly one around the loop. Given rates for
          A into B and B into C, the implied cross into C is the product of
          those two rates.
      - teach: >
          The trade itself is three simultaneous conversions ending back in the
          starting currency with strictly more of it than you began with. The
          round-trip spread on all three legs is the real-world hurdle, which is
          why shaving it thin enough to trade is a latency business.
      - ask: >
          Three quotes: $\text{AUD/USD} = 0.65$, $\text{USD/CAD} = 1.35$, and a
          direct $\text{AUD/CAD}$ quote of $0.90$. What is the implied AUD/CAD
          cross from the first two legs?
        expects: "0.8775"
        tolerance: 0.001
        hint: >
          Multiply the two given rates together, in the order that cancels USD
          out of the units.
        feedback: >
          $0.65 \times 1.35 = 0.8775$ — the direct quote of $0.90$ sits above
          this implied cross, so the Australian dollar is quoted rich against
          the Canadian dollar directly.
      - ask: >
          Starting with $1{,}000{,}000$ USD, convert to AUD at $0.65$, sell
          those AUD for CAD at the rich direct quote of $0.90$, then convert the
          CAD back to USD at $1.35$. What is the riskless profit, in USD?
        expects: "25641.03"
        tolerance: 5
        hint: >
          Carry the running balance through each of the three conversions in
          turn; the profit is what is left above the starting $1{,}000{,}000$.
        feedback: >
          $1{,}000{,}000/0.65 \approx 1{,}538{,}461.54$ AUD, times $0.90$ gives
          $1{,}384{,}615.38$ CAD, divided by $1.35$ gives $1{,}025{,}641.03$ USD
          — a profit of $25{,}641.03$, about $2.56\%$.
      - teach: >
          Which direction to run the loop is read straight off which side of the
          implied cross the direct quote sits on — above it, sell the rich
          currency directly; below it, buy it directly instead.
      - ask: >
          Same three currencies, but suppose the direct AUD/CAD quote were
          $0.85$ instead of $0.90$ — below the implied cross of $0.8775$. Which
          direction captures the arbitrage now?
        choices:
          - text: >
              The same direction as before: USD to AUD to CAD to USD.
            feedback: >
              Running the same direction when AUD is now cheap against CAD sells
              the Australian dollar too cheap and loses the trade — the loop has
              to run the other way.
          - text: >
              The reverse loop: USD to CAD to AUD to USD.
            correct: true
            feedback: >
              Right — with AUD now cheap directly against CAD, the loop captures
              the gap by buying AUD through the reverse path instead.
          - text: >
              No arbitrage exists once the quote moves below the implied cross.
            feedback: >
              A quote below the implied cross is exactly as much a mispricing as
              one above it — it just means the loop has to run in the opposite
              direction.
        feedback: >
          Which side of the implied cross the direct quote sits on determines
          which direction to run the loop — above it, sell the currency
          directly; below it, buy it directly instead.
      - teach: >
          Getting a quote convention backwards — dividing instead of
          multiplying, or inverting which currency is the base — flips the
          direction of the whole loop and turns a profitable trade into a loss.
      - ask: >
          A direct quote sits only a few basis points from the implied cross,
          well inside the sum of the three legs' round-trip spreads. Is this a
          tradeable arbitrage?
        choices:
          - text: >
              Yes, any deviation from the implied cross is tradeable.
            feedback: >
              A deviation smaller than the round-trip cost of trading all three
              legs is not capturable — the profit would be eaten by the spreads
              before it is collected.
          - text: >
              No — the round-trip spread on all three legs is the real hurdle,
              and a gap inside it is not profitably tradeable.
            correct: true
            feedback: >
              Right — triangular arbitrage in practice is a latency business
              precisely because the theoretical mispricing has to clear three
              spreads before it is real profit.
          - text: >
              It depends only on which currency you start with.
            feedback: >
              The starting currency does not change whether the gap clears the
              round-trip cost — what matters is the size of the mispricing
              against the combined spread of all three legs.
        feedback: >
          Three round-trip spreads are the actual hurdle in this trade — a cross
          a few basis points off implied is often entirely inside transaction
          cost and simply not tradeable.
