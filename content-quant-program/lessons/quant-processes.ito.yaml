unit: quant-processes.ito
opening: >
  Stochastic calculus supplies the one tool ordinary calculus can't: a chain
  rule for a function of a process whose path is nowhere differentiable. This
  unit builds that tool from the ground up — why the ordinary integral fails on
  Brownian motion, the Itô integral defined by fixing the left endpoint, the
  $(dB)^{2}=dt$ multiplication table, and Itô's lemma as the stochastic chain
  rule with its extra curvature term. From there the lemma is applied twice:
  solving geometric Brownian motion by taking logs, with the $-\sigma^{2}/2$
  volatility-drag term explained rather than just quoted, and solving the
  Ornstein–Uhlenbeck process as the continuous-time model of mean reversion. By
  the end you should be able to read any quoted SDE cold, apply Itô's lemma
  without hesitation, and tell at a glance whether a process is a martingale.
lessons:
  - node: quant-processes.ito.calculus-breaks
    hook: >
      An interviewer who says "just apply the chain rule" to a Brownian-driven
      price is testing whether you know the chain rule doesn't apply — missing
      why is the fastest way to lose credibility before the real question even
      starts.
    explanation: >
      An ordinary differentiable path has increments of size roughly
      proportional to the time step: shrink the step and the increment shrinks
      at the same rate, so a slope $\Delta x/\Delta t$ settles down to a limit.
      A Brownian increment over a step of length $\Delta t$ has standard
      deviation $\sqrt{\Delta t}$, not $\Delta t$ — it shrinks far slower than
      the time step, so $\Delta B/\Delta t$ blows up rather than converging.
      That single scaling mismatch is the entire reason no derivative exists.

      The same mismatch shows up as infinite total variation: cut $[0,t]$ into
      $n$ equal pieces and each increment is of size $\sqrt{t/n}$, so the
      absolute increments sum to about $n\sqrt{t/n}=\sqrt{tn}$, which grows
      without bound as $n\to\infty$. A smooth path's total variation converges
      to a finite arc length as the partition refines; a Brownian path's
      diverges at every scale, so zooming in never smooths it out.

      Infinite variation is what breaks the ordinary Riemann–Stieltjes
      integral, not mere non-differentiability. For a smooth integrand, moving
      the evaluation point from the left endpoint of each subinterval to the
      right changes the approximating sum by an amount controlled by the total
      variation, which vanishes as the mesh shrinks — so any evaluation point
      gives the same limit. With infinite variation that error term no longer
      vanishes, so left-endpoint, right-endpoint, and midpoint sums can
      converge to three genuinely different numbers. Fixing one convention is
      therefore not cosmetic; it is the entire design decision.
    worked: >
      Partition $[0,1]$ into $n=10^{4}$ equal pieces. Each increment has
      typical size $\sqrt{1/n}=0.01$, so the sum of absolute increments is
      about $n\times 0.01=100$ — already ten times $t=1$, and it keeps growing
      as $n$ increases. The sum of squared increments, by contrast, is about
      $n\times 0.01^{2}=1$, matching $t=1$ regardless of how fine the
      partition gets: the quadratic scale is the one Brownian motion actually
      respects.
    interview: >
      A common warm-up is "why can't you write $dB_t/dt$" — the expected
      answer names both nowhere-differentiability and infinite variation, not
      a vague "it's random." A sharper follow-up asks why the ordinary
      integral breaks specifically, which is checking whether you know it's
      the evaluation-point dependence, not continuity itself.
    pitfalls: >
      Saying only "Brownian motion is continuous but not differentiable"
      misses the actual mechanism — continuity alone never breaks
      Riemann–Stieltjes integration, unbounded variation does. Treating
      $(dB)^{2}$ as negligible because $dB$ "looks infinitesimal" ignores that
      it is the same order as $dt$, which is exactly the fact the next
      construction is built on.
    recap: >
      Brownian paths are too rough for ordinary calculus — infinite variation
      forces a new integral, built by fixing the evaluation point at the left
      endpoint of each subinterval.
    dialogue:
      - part: How far a path travels
        teach: >
          Two paths on $[0,1]$, each cut into $n$ equal steps. Path one is the
          straight line $f(t) = 3t$. Path two is a standard Brownian motion $B$.
          For each, add up the absolute sizes of the $n$ increments: the total
          distance the path travels up and down.
      - ask: >
          For the line $f(t) = 3t$ with $n = 100$ steps, what is the sum of the
          absolute increments?
        expects: "3"
        feedback: >
          Each step rises $3/100 = 0.03$, and $100 \times 0.03 = 3$. Take
          $n = 10^{6}$ and the answer is still $3$: refining the grid never
          changes the total for a smooth path.
      - ask: >
          Now the Brownian path with $n = 100$ steps. Taking the standard
          deviation of each increment as its typical size, what is the typical
          total of the absolute increments?
        expects: "10"
        hint: >
          An increment over a step of length $\Delta t$ has variance $\Delta t$.
        feedback: >
          Each increment has standard deviation $\sqrt{1/100} = 0.1$, so the
          total is about $100 \times 0.1 = 10$. (The exact mean of $|\Delta B|$
          is $\sqrt{2/\pi} \approx 0.8$ times the standard deviation, which
          rescales the total without changing how it grows.)
      - ask: >
          At $n = 100$ the Brownian total was about $10$; at $n = 10^{4}$ it is
          about $100$. What happens as $n \to \infty$?
        choices:
          - text: >
              It settles to a finite value, the path's true length.
            feedback: >
              That is what the line does. Here each refinement multiplies the
              number of steps by $k$ but shrinks each step only by $\sqrt{k}$,
              so the total grows by $\sqrt{k}$ every time.
          - text: >
              It shrinks, because each increment gets smaller.
            feedback: >
              Each increment does shrink, like $\sqrt{1/n}$, but there are $n$
              of them: $n\sqrt{1/n} = \sqrt{n}$, which grows.
          - text: >
              It grows without bound, like $\sqrt{n}$.
            correct: true
            feedback: >
              $n\sqrt{1/n} = \sqrt{n} \to \infty$. On any interval, however
              short, the path travels an infinite distance.
        feedback: >
          The total of the absolute increments is the path's total variation,
          and for Brownian motion it is infinite on every interval. The line's
          is $3$.

      - part: Slopes and squares
        ask: >
          On a step of length $\Delta t = 0.0001$, what is the typical size of
          the slope $|\Delta B|/\Delta t$?
        expects: "100"
        hint: >
          The numerator is about $\sqrt{\Delta t}$.
        feedback: >
          $\sqrt{0.0001}/0.0001 = 0.01/0.0001 = 100$. In general the slope is
          about $1/\sqrt{\Delta t}$: at $\Delta t = 10^{-6}$ it is $1000$. It
          never settles, so $dB_t/dt$ does not exist anywhere.
      - ask: >
          Back to $n = 10^{4}$ steps on $[0,1]$. What is the typical sum of the
          *squared* Brownian increments?
        expects: "1"
        hint: >
          Each squared increment has mean $\Delta t$.
        feedback: >
          $10^{4} \times 0.0001 = 1$, and the same at every $n$: the squared
          increments always total about $t = 1$. For the line the same sum is
          $n(3/n)^{2} = 9/n$, which goes to $0$.

      - part: Where in the step you look
        teach: >
          Now try to build $\int_0^1 B\,dB$ the ordinary way, as a sum of
          (value of $B$) times (increment of $B$), on a coarse grid of three
          steps. One sampled path has $B = 0, 0.5, -0.1, 0.3$ at times $0$,
          $1/3$, $2/3$, $1$. The question is which value of $B$ to use in each
          step: the one at its start, or the one at its end.
      - ask: >
          Using the value at the *start* of each step, what is
          $\sum_i B_{t_i}\left(B_{t_{i+1}} - B_{t_i}\right)$?
        expects: "-0.34"
        feedback: >
          The increments are $0.5$, $-0.6$, $0.4$. So
          $0(0.5) + 0.5(-0.6) + (-0.1)(0.4) = 0 - 0.3 - 0.04 = -0.34$.
      - ask: >
          Using the value at the *end* of each step instead, what is
          $\sum_i B_{t_{i+1}}\left(B_{t_{i+1}} - B_{t_i}\right)$?
        expects: "0.43"
        feedback: >
          $0.5(0.5) + (-0.1)(-0.6) + 0.3(0.4) = 0.25 + 0.06 + 0.12 = 0.43$.
      - reflect: >
          The two sums differ by $0.43 - (-0.34) = 0.77$. Write the difference
          step by step. What is it, and what happens to it as the grid
          refines — for this Brownian path, and for the line $3t$?
        hint: >
          In each step the two sums use the same increment; only the
          multiplier differs.
        answer: >
          Step by step the difference is
          $(B_{t_{i+1}} - B_{t_i})(B_{t_{i+1}} - B_{t_i})$, so the total is the
          sum of squared increments: $0.25 + 0.36 + 0.16 = 0.77$. For Brownian
          motion that sum tends to $t = 1$, not to $0$, so the start-of-step
          and end-of-step sums never agree, however fine the grid. For the line
          the same gap is $9/n \to 0$, which is why ordinary calculus never had
          to ask where in the step to look.
      - teach: >
          This is why ordinary calculus fails on Brownian paths. A
          Riemann–Stieltjes integral is defined path by path only when the
          integrator has finite total variation; then the evaluation point
          inside each step washes out in the limit. A Brownian path has
          infinite variation on every interval, so start-of-step, end-of-step
          and in-between sums converge to genuinely different limits. Choosing
          the evaluation point is the whole design decision, and the
          start-of-step choice, the left endpoint, is the one that defines the
          Itô integral.
      - ask: >
          Average the two sums from the sampled path. What do you get?
        expects: "0.045"
        feedback: >
          $(-0.34 + 0.43)/2 = 0.045$, which is exactly $B_1^{2}/2 = 0.09/2$. The
          averaged sum telescopes to the answer ordinary calculus would give,
          while the left-endpoint sum sits below it by half the squared
          increments, $0.385$. Three conventions, three different numbers.
      - ask: >
          A colleague says the $0.77$ gap is an artefact of using three steps:
          with a million steps the left and right sums will agree. Who is
          right?
        choices:
          - text: >
              The colleague: refining the mesh always kills the
              evaluation-point error.
            feedback: >
              Only when the integrator has finite variation. Here the gap is
              exactly the sum of squared increments, which you just saw stays
              near $1$ at every $n$.
          - text: >
              Neither: the gap grows without bound, like the total variation.
            feedback: >
              It is the absolute increments that blow up. Their squares total
              about $t$, so the gap converges, just not to $0$.
          - text: >
              Not the colleague: the gap tends to $1$, the sum of squared
              increments on $[0,1]$.
            correct: true
            feedback: >
              The squared increments sum to $t$ with ever smaller randomness,
              so the two sums stay a full unit apart in the limit.
        feedback: >
          In an interview, say it in one breath: a Brownian path is nowhere
          differentiable and has infinite variation, so where you sample the
          integrand in each step changes the limit, and Itô fixes it at the
          left endpoint.

  - node: quant-processes.ito.ito-integral
    hook: >
      Every stochastic integral is pinned down by one convention — evaluate
      the position before the move, never after — and losing sight of that
      convention is why the martingale property and the Itô correction term
      stop making sense later.
    explanation: >
      The Itô integral is the $L^{2}$ limit of sums $\sum_i
      H_{t_i}(B_{t_{i+1}}-B_{t_i})$, where each $H_{t_i}$ is fixed using only
      information available up to time $t_i$. Financially, $H_{t_i}$ is the
      position you hold going into the next move — chosen before you see it,
      never adjusted with hindsight. That is what "adapted" means in practice.

      Adaptedness is the load-bearing property. Because $H_{t_i}$ depends only
      on the past, it is independent of the future increment
      $B_{t_{i+1}}-B_{t_i}$ it multiplies (Brownian motion's increments are
      independent of the past). Each term in the sum is therefore a product of
      independent factors, the second of which has mean zero, so its
      expectation is $0$, and summing
      mean-zero terms keeps the whole integral mean zero — and, more strongly,
      a martingale in $t$.

      Since Brownian paths have infinite variation (recall the reason ordinary
      calculus fails), the choice of evaluation point genuinely changes the
      limit — it is not a technicality that washes out as the mesh shrinks.
      Sampling at the midpoint instead gives the Stratonovich integral, which
      obeys the ordinary chain rule precisely because it peeks slightly into
      the future, which is exactly what breaks the martingale property.
    worked: >
      Take a $3$-step simple random walk with steps $+1,+1,-1$, so
      $S_0=0,S_1=1,S_2=2,S_3=1$. The left-endpoint sum is $S_0(S_1-S_0) +
      S_1(S_2-S_1) + S_2(S_3-S_2) = 0(1)+1(1)+2(-1) = -1$. This matches
      $(S_3^{2}-3)/2 = (1-3)/2 = -1$ exactly — the discrete shadow of the Itô
      integral, where the multiplier is always the position you held going
      into the step, not the one you land on.
    interview: >
      Asking what makes the Itô integral special is really asking you to
      state adaptedness and its consequence, $\mathbb{E}\left[\int_0^t
      H_s\,dB_s\right]=0$, in one breath. A common follow-up, "is $\int_0^t
      B_s\,dB_s$ a martingale," is answered yes purely from this definition,
      before ever computing the integral's value.
    pitfalls: >
      Treating the evaluation-point choice as a technicality is wrong here —
      midpoint and right-endpoint sums converge to different limits, unlike
      ordinary calculus where they agree. Forgetting the adaptedness
      requirement is what actually delivers the mean-zero property; an
      integrand that can see the future breaks it.
    recap: >
      The Itô integral is the left-endpoint limit of position-times-next-move
      sums; adaptedness makes each term mean zero, so the whole integral is a
      martingale.
    dialogue:
      - part: Three traders and a fair coin
        teach: >
          A price starts at $0$ and moves $+1$ or $-1$ on each of three fair
          coin flips. Before each flip you choose a stake $H$, and the flip pays
          $H$ times the move. Ana stakes $2$ every time. Ben stakes the current
          price. Cal stakes whatever the price will be *after* the flip — he
          has a friend at the exchange.
      - ask: >
          The flips go up, down, down, so the price runs $0, 1, 0, -1$. What is
          Ben's total payoff?
        expects: "-1"
        hint: >
          Ben's stake on each flip is the price before it.
        feedback: >
          The moves are $+1, -1, -1$ and Ben's stakes are $0, 1, 0$:
          $0(1) + 1(-1) + 0(-1) = -1$.
      - ask: >
          Same path. What is Cal's total payoff?
        expects: "2"
        hint: >
          Cal's stake on each flip is the price after it: $1, 0, -1$.
        feedback: >
          $1(1) + 0(-1) + (-1)(-1) = 1 + 0 + 1 = 2$.
      - ask: >
          Averaged over all eight equally likely paths, what is Ben's expected
          payoff?
        expects: "0"
        hint: >
          Look at one flip at a time: what does Ben know when he sets his stake,
          and what is the average of the move it multiplies?
        feedback: >
          On each flip Ben's stake is fixed by the flips already seen, and the
          coming move is $\pm 1$ independently of them, so each term has
          expectation $\mathbb{E}[\text{stake}] \times 0 = 0$. The sum of three
          zeros is $0$. Ana's is $0$ for the same reason.
      - ask: >
          What is Cal's expected payoff?
        expects: "3"
        hint: >
          Compare Cal's payoff with Ben's on the path above: $2 - (-1)$. Is that
          gap special to this path?
        feedback: >
          On each flip Cal's stake exceeds Ben's by exactly the move, so Cal
          collects Ben's term plus $(\text{move})^{2} = 1$. Over three flips Cal
          always beats Ben by $3$, and Ben averages $0$, so Cal averages $3$
          from a fair coin.

      - part: What Cal is doing wrong
        reflect: >
          Ana's and Ben's stakes earn nothing on average; Cal's earns $3$ from a
          fair game. State the rule a stake must obey, precisely enough to rule
          Cal out and let Ana and Ben in, and say why the rule forces an average
          of $0$.
        answer: >
          The stake on a move must be decided by what has happened *before*
          that move — the path up to the start of the step — and nothing after.
          Ana's constant and Ben's current price qualify; Cal's stake reads the
          very move it multiplies. Under the rule, each term is (something
          already known) times (a fair move independent of it), so each term has
          mean $0$. This rule is called being *adapted*.
      - teach: >
          Now the continuous version. Let $H$ be adapted, with
          $\mathbb{E}\int_0^T H_s^{2}\,ds < \infty$. The Itô integral
          $\int_0^t H_s\,dB_s$ is the $L^{2}$ limit of the left-endpoint sums
          $\sum_i H_{t_i}\left(B_{t_{i+1}} - B_{t_i}\right)$ as the mesh goes to
          $0$: Ben's rule, with Brownian increments for coin flips. Every term
          has mean $0$, so $\mathbb{E}\left[\int_0^t H_s\,dB_s\right] = 0$, and
          the integral is a martingale in $t$. Sampling at midpoints instead
          gives the Stratonovich integral, which is not a martingale.
      - ask: >
          Which of these is a legitimate integrand for $\int_0^1 H_s\,dB_s$?
        choices:
          - text: >
              $H_s = B_1$, the path's final value
            feedback: >
              At time $s < 1$ you do not yet know $B_1$. This is Cal's trick
              stretched over the whole interval: not adapted.
          - text: >
              $H_s = B_{s + 0.01}$, the value a moment ahead
            feedback: >
              A small peek is still a peek. The stake would carry information
              about the increment it multiplies, and the mean-zero argument
              collapses.
          - text: >
              $H_s = \max_{u \le s} B_u$, the running maximum so far
            correct: true
            feedback: >
              The running maximum at time $s$ uses only the path up to $s$, so
              it is adapted, and it is bounded in mean square on $[0,1]$. Random
              and path-dependent is fine; future-dependent is not.
          - text: >
              $H_s = 1$ if $B_1 > 0$, and $0$ otherwise
            feedback: >
              This stakes on whether the path ends up positive, which is not
              known until time $1$. Not adapted.
        feedback: >
          Adapted means the stake at time $s$ is a function of the path up to
          $s$. It may be random, path-dependent, discontinuous; it may not look
          ahead.

      - part: The same game in continuous time
        ask: >
          On $[0,2]$, take a fine grid and form Cal's sum for $B$ against
          itself, $\sum_i B_{t_{i+1}}\left(B_{t_{i+1}} - B_{t_i}\right)$. What
          is its expected value?
        expects: "2"
        hint: >
          Split it as Ben's sum plus the sum of squared increments.
        feedback: >
          Ben's left-endpoint sum has mean $0$, and the squared increments have
          means $\Delta t$ that add to $2$. So the right-endpoint sum has mean
          $2$ at every grid size — a positive edge from nothing, exactly as on
          the coin.
      - ask: >
          Let $I_t = \int_0^t B_s\,dB_s$. On some path $I_1 = 0.7$. Given
          everything seen up to time $1$, what is the expected value of $I_2$?
        expects: "0.7"
        hint: >
          $I_2 = I_1 + \int_1^2 B_s\,dB_s$. What is the conditional mean of the
          second piece?
        feedback: >
          The piece from $1$ to $2$ is a sum of known-stake-times-fresh-increment
          terms, each with conditional mean $0$, so
          $\mathbb{E}[I_2 \mid \text{path to } 1] = 0.7$. That is the martingale
          property, and it follows from the definition before you know any
          formula for $I_t$.
      - ask: >
          Take $H_s = 1/(1 - s)$ on $[0,1)$. Is $\int_0^1 H_s\,dB_s$ an Itô
          integral in the sense above?
        choices:
          - text: >
              No: it is not adapted.
            feedback: >
              It is deterministic, so it is adapted trivially — it is known at
              every time without looking at the path at all.
          - text: >
              Yes: a deterministic stake is always allowed.
            feedback: >
              Deterministic settles adaptedness, not size. The other clause asks
              for $\int_0^1 H_s^{2}\,ds < \infty$, and here that integral is
              $\int_0^1 (1-s)^{-2}\,ds$.
          - text: >
              No: $\int_0^1 (1-s)^{-2}\,ds$ is infinite, so the integrability
              clause fails.
            correct: true
            feedback: >
              The integral diverges at $s = 1$. The stake is legitimate as an
              information rule but grows too fast for the sums to have an
              $L^{2}$ limit.
        feedback: >
          Two clauses, two ways to fail: look ahead and you break adaptedness;
          stake too wildly and you break $\mathbb{E}\int H^{2}\,ds < \infty$.
          Asked what makes the Itô integral special, say: left endpoints, so the
          position is fixed before the move, which makes it a mean-zero
          martingale.

  - node: quant-processes.ito.ito-isometry
    hook: >
      Whenever a question asks for the variance of a stochastic integral, the
      isometry is the entire solution — it turns a hard stochastic object into
      an ordinary integral in one line.
    explanation: >
      Squaring the defining sum $\sum_i H_{t_i}(B_{t_{i+1}}-B_{t_i})$ produces
      cross terms and diagonal terms. A cross term with $i\ne j$ carries a
      factor $H_{t_i}H_{t_j}$ times two increments; adaptedness makes the
      later of the two increments independent of everything else in the
      product, and that increment has mean zero, so every cross term vanishes
      in expectation.

      The diagonal terms are what survives: each contributes
      $H_{t_i}^{2}(\Delta B)^{2}$, and since $\mathbb{E}[(\Delta B)^{2}]=\Delta
      t$ (Brownian motion's variance-$t$ property), taking expectations gives
      $H_{t_i}^{2}\,\Delta t$. Summing over $i$ and passing to the limit turns
      the whole sum into $\int_0^t H_s^{2}\,ds$ — an ordinary, deterministic
      integral.

      The mental model is Pythagorean: the squared "length" of a stochastic
      integral is the sum of the squared lengths of its pieces, because each
      increment carries independent randomness that never interferes with
      another piece's. One extra payoff worth keeping: when $H$ is
      deterministic, the integral isn't just this variance — it's exactly
      normal with that variance, since a sum of independent normals is normal.
    worked: >
      Take $H_s=2$, a constant position, over $[0,5]$. The isometry gives
      $\mathbb{E}\left[\left(\int_0^5 2\,dB_s\right)^{2}\right]=\int_0^5
      4\,ds=20$. Direct check: $\int_0^5 2\,dB_s=2B_5$, and
      $\operatorname{Var}(2B_5)=4\operatorname{Var}(B_5)=4\times 5=20$ —
      matching exactly.
    interview: >
      "What's the variance of $\int_0^T \sigma\,dB_s$" is answered instantly
      by writing $\int_0^T \sigma^{2}\,ds$ — the interviewer wants that
      reflex, not a re-derivation from sums. A sharper version asks for the
      full distribution when $H$ is deterministic, checking whether you know
      it's exactly normal, not just its variance.
    pitfalls: >
      The isometry needs $H$ adapted — an $H$ that depends on future
      information breaks the cross-term cancellation and the identity fails.
      Confusing $\mathbb{E}\left[\left(\int H\,dB\right)^{2}\right]$ with
      $\left(\mathbb{E}\int H\,dB\right)^{2}$, which is just $0$, answers a
      different question entirely.
    recap: >
      $\mathbb{E}\left[\left(\int_0^t H_s\,dB_s\right)^{2}\right] =
      \mathbb{E}\left[\int_0^t H_s^{2}\,ds\right]$ — cross terms vanish by
      adaptedness, diagonal terms turn $(dB)^{2}$ into $dt$.
    dialogue:
      - part: Two periods of P&L
        teach: >
          A Brownian-driven asset, two periods of length $1$, with
          $\Delta B_1 = B_1 - B_0$ and $\Delta B_2 = B_2 - B_1$. You hold $2$
          units through the first period and $3$ through the second, so your
          P&L is $X = 2\,\Delta B_1 + 3\,\Delta B_2$.
      - ask: >
          What is $\mathbb{E}[X^{2}]$?
        expects: "13"
        hint: >
          $X$ has mean $0$, so this is its variance, and the two increments are
          independent.
        feedback: >
          $\operatorname{Var}(X) = 4\operatorname{Var}(\Delta B_1)
          + 9\operatorname{Var}(\Delta B_2) = 4 + 9 = 13$: each period
          contributes its stake squared times its length.
      - ask: >
          Now the second-period stake is decided at time $1$: you hold $B_1$
          units, so $X = 2\,\Delta B_1 + B_1\,\Delta B_2$. What is
          $\mathbb{E}[X^{2}]$?
        expects: "5"
        hint: >
          Expand the square into three terms. $\Delta B_2$ is independent of
          everything known at time $1$, including $B_1$.
        feedback: >
          $\mathbb{E}[4B_1^{2}] = 4$; the cross term
          $\mathbb{E}[4B_1^{2}\,\Delta B_2] = 4\,\mathbb{E}[B_1^{2}]\,\mathbb{E}[\Delta B_2] = 0$;
          and $\mathbb{E}[B_1^{2}(\Delta B_2)^{2}] = 1 \times 1 = 1$. Total
          $4 + 0 + 1 = 5$.
      - ask: >
          Why is the cross term $\mathbb{E}[4B_1^{2}\,\Delta B_2]$ zero?
        choices:
          - text: >
              Because $B_1$ has mean $0$.
            feedback: >
              $B_1$ does, but the factor here is $B_1^{2}$, whose mean is $1$.
              Something else is doing the killing.
          - text: >
              Because $B_1^{2}$ is fixed by time $1$, and $\Delta B_2$ is a
              later increment, independent of it, with mean $0$.
            correct: true
            feedback: >
              The later increment is independent of everything in front of it,
              so the expectation factors and the increment's mean of $0$ wins.
          - text: >
              It is not zero; it equals $4$, since $\mathbb{E}[B_1^{2}] = 1$.
            feedback: >
              That forgets the $\Delta B_2$. The expectation factors as
              $4 \times 1 \times \mathbb{E}[\Delta B_2] = 4 \times 1 \times 0$.
        feedback: >
          The stake was set before the second move, so the move is a fresh fair
          coin against it. That is adaptedness doing its work.

      - part: Why the squares add
        reflect: >
          In both P&Ls, $\mathbb{E}[X^{2}]$ came out as the sum over periods of
          (mean squared stake) times (period length): $4 + 9$, then $4 + 1$.
          Before any formula: why should that hold for an adapted stake over
          any number of periods, and what does the sum become as the periods
          shrink?
        answer: >
          Square $\sum_i H_i\,\Delta B_i$. A cross term $H_iH_j\,\Delta B_i\,\Delta B_j$
          with $i < j$ has everything except $\Delta B_j$ fixed by time $t_j$,
          and $\Delta B_j$ is independent of all of it with mean $0$, so it
          vanishes. A diagonal term $H_i^{2}(\Delta B_i)^{2}$ has expectation
          $\mathbb{E}[H_i^{2}]\,\Delta t_i$. What survives is
          $\sum_i \mathbb{E}[H_i^{2}]\,\Delta t_i$, a Riemann sum for
          $\mathbb{E}\int H_s^{2}\,ds$.
      - teach: >
          That is the Itô isometry: for adapted $H$ with
          $\mathbb{E}\int_0^t H_s^{2}\,ds < \infty$,
          $\mathbb{E}\left[\left(\int_0^t H_s\,dB_s\right)^{2}\right]
          = \mathbb{E}\left[\int_0^t H_s^{2}\,ds\right]$. The pieces of a
          stochastic integral are orthogonal, so their squared sizes add like
          sides of a right triangle. When $H$ is deterministic you get more than
          a variance: the integral is a limit of sums of independent normals,
          so it is exactly $N\left(0, \int_0^t H_s^{2}\,ds\right)$.

      - part: Variances without a path in sight
        ask: >
          A position grows linearly: $H_s = 2 + s$ on $[0,3]$. What is the
          variance of $\int_0^3 (2 + s)\,dB_s$?
        expects: "39"
        hint: >
          Expand $(2+s)^{2}$ and integrate term by term.
        feedback: >
          $\int_0^3 (4 + 4s + s^{2})\,ds = 12 + 18 + 9 = 39$. Since $H$ is
          deterministic, the integral is exactly $N(0, 39)$, with standard
          deviation $\sqrt{39} \approx 6.24$.
      - ask: >
          Now a random stake, $H_s = B_s^{2}$, on $[0,2]$. What is
          $\mathbb{E}\left[\left(\int_0^2 B_s^{2}\,dB_s\right)^{2}\right]$?
        expects: "8"
        hint: >
          You need $\mathbb{E}[B_s^{4}]$, the fourth moment of an
          $N(0, s)$ variable, which is $3s^{2}$.
        feedback: >
          $\int_0^2 \mathbb{E}[B_s^{4}]\,ds = \int_0^2 3s^{2}\,ds = 2^{3} = 8$.
          The integral itself is not normal — $H$ is random — but its second
          moment is still one ordinary integral away.
      - ask: >
          For $H_s = B_s$ on $[0,4]$, a candidate writes
          $\mathbb{E}\left[\left(\int_0^4 B_s\,dB_s\right)^{2}\right]
          = \int_0^4 \left(\mathbb{E}[B_s]\right)^{2}ds = 0$. What went wrong?
        choices:
          - text: >
              Nothing: $B_s$ has mean $0$, so the integral has variance $0$.
            feedback: >
              A variance of $0$ would make the integral the constant $0$, which
              it is not. Mean $0$ and variance $0$ are different claims.
          - text: >
              The expectation must go on $H_s^{2}$, not on $H_s$ before
              squaring: the answer is $\int_0^4 s\,ds = 8$.
            correct: true
            feedback: >
              $\mathbb{E}[B_s^{2}] = s$, and $\int_0^4 s\,ds = 8$. Squaring
              after averaging throws away all the randomness in the stake.
          - text: >
              The isometry needs a deterministic $H$, so it does not apply.
            feedback: >
              It needs an adapted $H$, and $B_s$ is adapted. Deterministic $H$
              buys exact normality, not the isometry itself.
        feedback: >
          Square first, then average:
          $\mathbb{E}\left[\int H^{2}\right]$, never
          $\int \left(\mathbb{E}H\right)^{2}$.

      - part: A stake that peeks
        ask: >
          One period of length $1$. A trader with a leak sets his stake equal
          to the move itself, $H = \Delta B$, so his P&L is $(\Delta B)^{2}$.
          What is
          $\mathbb{E}\left[\left((\Delta B)^{2}\right)^{2}\right]$?
        expects: "3"
        hint: >
          $\Delta B \sim N(0,1)$; you need its fourth moment.
        feedback: >
          $\mathbb{E}[(\Delta B)^{4}] = 3$. The isometry would have predicted
          $\mathbb{E}[H^{2}] \times 1 = \mathbb{E}[(\Delta B)^{2}] = 1$.
      - ask: >
          Which step of the argument broke for the trader with the leak?
        choices:
          - text: >
              The diagonal term: his stake is not independent of the move it
              multiplies, so $\mathbb{E}[H^{2}(\Delta B)^{2}]$ no longer factors
              as $\mathbb{E}[H^{2}]\,\Delta t$.
            correct: true
            feedback: >
              With $H = \Delta B$ the two factors are the same variable:
              $\mathbb{E}[(\Delta B)^{4}] = 3$, not $1 \times 1$. Every step of
              the proof leans on the stake being fixed before the move.
          - text: >
              The cross terms: with one period there are none, so the isometry
              does not apply.
            feedback: >
              With one period there are no cross terms to go wrong. The failure
              is in the one term there is.
          - text: >
              Nothing broke; $3$ versus $1$ is sampling noise.
            feedback: >
              These are exact expectations, not samples. $3 \ne 1$ is a genuine
              failure of the identity.
        feedback: >
          The isometry is a statement about adapted integrands. Asked for the
          variance of $\int_0^T \sigma\,dB_s$ in an interview, write
          $\int_0^T \sigma^{2}\,ds = \sigma^{2}T$ at once, and say "normal" if
          the integrand is deterministic.

  - node: quant-processes.ito.db-squared
    hook: >
      This four-line table is the single piece of machinery that makes every
      SDE manipulation in this unit mechanical rather than mysterious — Itô's
      lemma is nothing more than Taylor expansion plus one substitution from
      this table.
    explanation: >
      Quadratic variation already established that the sum of squared
      Brownian increments converges to $t$, with the randomness in that sum
      shrinking to nothing as the partition refines. At the level of a single
      infinitesimal step, that is exactly the claim $(dB)^{2}=dt$: not a
      pathwise identity, but a statement that $(dB)^{2}$ is deterministic to
      leading order, so it can be substituted like an ordinary differential.

      The other candidate second-order terms are genuinely negligible by a
      size argument. A single $dt$ has size $\Delta t$ and a single $dB$ has
      size $\sqrt{\Delta t}$, so a cross term $dt\,dB$ has size
      $(\Delta t)^{3/2}$; summing $n=T/\Delta t$ of them gives a total of
      order $\sqrt{\Delta t}\to 0$. The term $(dt)^{2}$ is smaller still,
      summing to order $\Delta t\to 0$. Only $(dB)^{2}$ survives at order
      $\Delta t$ after summation.

      The practical recipe follows directly: in any second-order expansion,
      keep every term through second order in $dB$ and first order in $dt$,
      and discard everything else — the discarded terms are exactly the ones
      just shown to vanish.
    worked: >
      Take a single step of size $\Delta t=0.01$. A typical increment is
      $\Delta B\approx\sqrt{0.01}=0.1$, so $(\Delta B)^{2}\approx 0.01$,
      matching $\Delta t$ exactly. The cross term $\Delta t\,\Delta B\approx
      0.01\times 0.1=0.001$ and $(\Delta t)^{2}=0.0001$ are both an order of
      magnitude or more smaller — and summed over many steps the
      $(\Delta B)^{2}$ terms hold steady at $T$ while the cross terms still
      shrink to $0$.
    interview: >
      When asked to "expand $d(f(B_t))$ to second order," the interviewer is
      checking that you reach for this table automatically. Naming the three
      rules — $dt\,dt=0$, $dt\,dB=0$, $dB\,dB=dt$ — cold, in that order, is
      the expected ten-second answer.
    pitfalls: >
      Treating $(dB)^{2}$ as negligible because $dB$ "looks infinitesimal" is
      the single most common error here — it is the same order as $dt$, not
      smaller. Forgetting the correlated version $dB^{(1)}dB^{(2)}=\rho\,dt$
      when two Brownian motions appear in the same expansion silently drops a
      term that survives whenever $\rho\ne 0$.
    recap: >
      $(dB)^{2}=dt$ while $dt\,dB$ and $(dt)^{2}$ vanish — keep terms to
      second order in $dB$, first order in $dt$, and drop the rest.
    dialogue:
      - part: Three pieces of a square
        teach: >
          A process moves by $\Delta X = 0.3\,\Delta t + 2\,\Delta B$ on each
          step of length $\Delta t$. Any second-order expansion — of $X^{2}$,
          of $e^{X}$, of an option price — needs $(\Delta X)^{2}$, which splits
          into three pieces: $(0.3\,\Delta t)^{2}$, the cross term
          $1.2\,\Delta t\,\Delta B$, and $4(\Delta B)^{2}$. Take
          $\Delta t = 0.0001$, so a typical $|\Delta B|$ is $0.01$.
      - ask: >
          What is the typical size of the piece $4(\Delta B)^{2}$ on one step?
        expects: "0.0004"
        tolerance: 0.00001
        feedback: >
          $4 \times 0.01^{2} = 0.0004$. The cross term is about
          $1.2 \times 0.0001 \times 0.01 = 0.0000012$, and
          $(0.3 \times 0.0001)^{2} = 0.0000000009$. On one step, all three are
          tiny; the question is what they add up to.
      - ask: >
          Add up $4(\Delta B)^{2}$ over all $10^{4}$ steps of $[0,1]$. What is
          the typical total?
        expects: "4"
        hint: >
          Each squared increment has mean $\Delta t$.
        feedback: >
          $10^{4} \times 0.0004 = 4$. A pile of tiny pieces adds up to
          something of order $1$.
      - ask: >
          Now the cross terms. Even in the worst case, where all $10^{4}$ of
          them have the same sign, what do they total?
        expects: "0.012"
        tolerance: 0.0005
        feedback: >
          $10^{4} \times 0.0000012 = 0.012$. In general the total is at most
          about $1.2\,t\sqrt{\Delta t}$, and in practice the signs cancel and
          it is far smaller.
      - ask: >
          Refine to $\Delta t = 10^{-6}$ on the same interval. What happens to
          the two totals?
        choices:
          - text: >
              Both shrink, since every piece is smaller on a finer grid.
            feedback: >
              Each $4(\Delta B)^{2}$ is $100$ times smaller, but there are
              $100$ times as many of them. That total stays at $4$.
          - text: >
              The squared-increment total stays near $4$; the cross-term total
              drops to about $0.0012$.
            correct: true
            feedback: >
              $10^{6} \times 4 \times 10^{-6} = 4$, while
              $1.2\sqrt{10^{-6}} = 0.0012$. One survives, one dies at the rate
              $\sqrt{\Delta t}$.
          - text: >
              Both stay put: refining the grid does not change sums of
              increments.
            feedback: >
              That is true of plain increments, which telescope. Products of
              increments do not telescope, and the cross terms scale like
              $(\Delta t)^{3/2}$ each.
        feedback: >
          Only the $(\Delta B)^{2}$ piece survives the limit. The other two are
          negligible after summing, not merely small on each step.

      - part: Replacing a random square by a number
        reflect: >
          The surviving total sits near $4$ at every grid size, with its
          randomness shrinking as the grid refines. What does that suggest you
          may write in place of $(dX)^{2}$, and in place of $(dB)^{2}$, inside
          an expansion — and why is it legitimate to replace something random
          by something that is not?
        answer: >
          Replace $(dB)^{2}$ by $dt$, and so $(dX)^{2}$ by $4\,dt$. The sum of
          squared increments is the quadratic variation, which converges to $t$
          with variance of order $1/n$, so after summing, $(dB)^{2}$ behaves
          exactly like $dt$: not random at leading order. The cross term and
          $(dt)^{2}$ sum to zero, so they can be dropped outright.
      - teach: >
          That is the multiplication table: $dt\,dt = 0$, $dt\,dB = 0$,
          $dB\,dB = dt$, and for two Brownian motions of correlation $\rho$,
          $dB^{(1)}\,dB^{(2)} = \rho\,dt$. The working rule is to keep every
          term through second order in $dB$ and first order in $dt$, and drop
          the rest. It is an identity about sums, which is the only way these
          differentials are ever used.

      - part: The table at work
        ask: >
          A process moves by $dX = -0.5\,dt + 0.7\,dB$. Over $[0,2]$, what does
          the sum of its squared increments $\sum (\Delta X)^{2}$ converge to as
          the grid refines?
        expects: "0.98"
        hint: >
          Expand $(dX)^{2}$, send each product through the table, then add up
          over the interval.
        feedback: >
          $(dX)^{2} = 0.25\,dt^{2} - 0.7\,dt\,dB + 0.49\,dB^{2} = 0.49\,dt$, and
          $\int_0^2 0.49\,dt = 0.98$. The drift does not appear at all: only the
          noise coefficient squared survives.
      - ask: >
          A portfolio is long $2$ units of asset one and short $5$ of asset
          two, with $dP = 2\,dB^{(1)} - 5\,dB^{(2)}$ and correlation
          $\rho = 0.6$ between the drivers. What is the coefficient of $dt$ in
          $(dP)^{2}$, the portfolio's variance rate?
        expects: "17"
        hint: >
          Three products: $(dB^{(1)})^{2}$, $(dB^{(2)})^{2}$ and the cross
          product, which appears twice.
        feedback: >
          $4\,dt + 25\,dt - 2 \times 2 \times 5 \times 0.6\,dt
          = 29 - 12 = 17$. Drop the correlated cross term and you would quote
          $29$, overstating the hedged book's variance by $70\%$.
      - ask: >
          What is $(dB)^{3}$?
        choices:
          - text: >
              $dt\,dB$, which is a genuine first-order term.
            feedback: >
              $(dB)^{3} = dB \cdot dB^{2} = dB\,dt$ is right as algebra, but
              $dt\,dB$ is on the zero row of the table.
          - text: >
              $0$
            correct: true
            feedback: >
              $(dB)^{3} = dt\,dB = 0$. Each cube is of size
              $(\Delta t)^{3/2}$, and $n$ of them total $\sqrt{\Delta t} \to 0$.
              Everything beyond second order in $dB$ drops.
          - text: >
              $(dt)^{3/2}$, which must be kept.
            feedback: >
              Its size is $(\Delta t)^{3/2}$, but summed over $t/\Delta t$
              steps it gives $t\sqrt{\Delta t} \to 0$. It goes.
        feedback: >
          Second order in $dB$ is the cut-off; third and higher vanish.
      - ask: >
          Since $(dB)^{2} = dt$, a candidate writes $dB = \sqrt{dt}$. What is
          wrong with that?
        choices:
          - text: >
              Nothing; it is the same identity, just square-rooted.
            feedback: >
              Then $\sum \Delta B$ over $[0,t]$ would be $n\sqrt{t/n}
              = \sqrt{tn}$, a deterministic number blowing up, when it is
              actually $B_t$, a mean-zero normal.
          - text: >
              $dB$ is random with mean $0$ and size $\sqrt{dt}$; only its
              square is deterministic at leading order.
            correct: true
            feedback: >
              The sign of each increment is a fair coin. Squaring erases the
              sign, which is exactly why $(dB)^{2}$ can be replaced by a number
              and $dB$ cannot.
          - text: >
              It should be $dB = -\sqrt{dt}$, so that the mean is negative.
            feedback: >
              Brownian increments are symmetric. Neither sign is preferred.
        feedback: >
          In an interview, recite the table cold — $dt\,dt = 0$,
          $dt\,dB = 0$, $dB\,dB = dt$ — and add "$\rho\,dt$ for correlated
          drivers" before you are asked.

  - node: quant-processes.ito.sde
    hook: >
      The first thing an interviewer checks when an SDE hits the board is
      whether you can instantly point at which piece is the drift and which is
      the diffusion — get that backwards and every later step inherits the
      error.
    explanation: >
      The shorthand $dX_t=a\,dt+b\,dB_t$ is not a derivative — no derivative
      of $X_t$ exists, which is exactly why ordinary calculus fails on
      Brownian paths. It is notation for the integral equation
      $X_t=X_0+\int_0^t a\,ds+\int_0^t b\,dB_s$, where the second piece is
      precisely the Itô integral. Whenever the shorthand feels ambiguous,
      unwind it into that integral form.

      Call $a$ the drift, the predictable per-unit-time push that integrates
      like an ordinary Riemann integral, and $b$ the diffusion coefficient,
      the scale of the noise multiplying the Itô integral. A process built
      this way is an Itô process, and both coefficients can depend on $t$ and
      on the current value $X_t$ itself, which is what makes SDEs richer than
      "Brownian motion plus a constant drift."

      Existence and uniqueness aren't automatic for arbitrary coefficients —
      if $a$ and $b$ are Lipschitz in $x$ and grow at most linearly, a unique
      strong solution exists for all $t$; that fine print is worth naming if
      asked, without needing the proof. The practical skill is pattern
      matching: given a quoted SDE, isolate the $dt$-multiplier and the
      $dB$-multiplier before doing anything else.
    worked: >
      Take $dX_t=(2X_t-1)\,dt+\sqrt{X_t}\,dB_t$ and evaluate at $X_t=9$: the
      drift is $a(9)=2(9)-1=17$ and the diffusion coefficient is
      $b(9)=\sqrt{9}=3$. At that instant the process pushes forward at rate
      $17$ per unit time and carries noise of scale $3$ per unit $\sqrt{dt}$.
    interview: >
      "Write down the SDE for $X$, then tell me the drift and the diffusion
      coefficient" is asked nearly verbatim — answer by isolating the
      $dt$-multiplier and $dB$-multiplier, not by describing the process in
      words. A common follow-up asks whether the drift is constant or
      state-dependent, testing whether you distinguish $a(t,X_t)$ from a plain
      constant.
    pitfalls: >
      Reading $dX_t=a\,dt+b\,dB_t$ as a literal derivative ignores that none
      exists — be ready to unwind it into the integral form if pressed.
      Swapping which term is drift and which is diffusion breaks every later
      formula that references "$a$" and "$b$" by name.
    recap: >
      An SDE is shorthand for $X_t=X_0+\int_0^t a\,ds+\int_0^t b\,dB_s$ —
      reading off $a$ (drift) and $b$ (diffusion) from the quoted equation is
      the first move on every problem.
    dialogue:
      - part: Simulating a spread by hand
        teach: >
          A spread starts at $X_0 = 2$. A desk simulates it in steps of length
          $\Delta = 0.25$ with the rule
          $X_{\text{next}} = X + (1 - X)\Delta + 0.4\,\Delta B$, where $X$ is
          the value at the start of the step and $\Delta B$ is that step's
          Brownian increment.
      - ask: >
          The first increment is $\Delta B = 0.5$. What is $X$ after one step?
        expects: "1.95"
        feedback: >
          $2 + (1 - 2)(0.25) + 0.4(0.5) = 2 - 0.25 + 0.2 = 1.95$.
      - ask: >
          The second increment is $\Delta B = -0.5$. What is $X$ after two
          steps?
        expects: "1.5125"
        hint: >
          Use $X = 1.95$ at the start of this step, in both terms.
        feedback: >
          $1.95 + (1 - 1.95)(0.25) + 0.4(-0.5) = 1.95 - 0.2375 - 0.2 = 1.5125$.
          The pull toward $1$ is weaker now, because $X$ is closer to $1$.
      - reflect: >
          After $n$ steps, $X$ is $X_0$ plus two running sums: one of
          $(1 - X)\Delta$ terms and one of $0.4\,\Delta B$ terms, each using
          $X$ at the start of its step. As $\Delta \to 0$, what does each sum
          become — and so what statement is the shorthand
          $dX_t = (1 - X_t)\,dt + 0.4\,dB_t$ actually making?
        answer: >
          The first sum is a Riemann sum and becomes the ordinary integral
          $\int_0^t (1 - X_s)\,ds$. The second is a left-endpoint sum against
          Brownian increments and becomes the Itô integral
          $\int_0^t 0.4\,dB_s$. So the shorthand means the integral equation
          $X_t = X_0 + \int_0^t (1 - X_s)\,ds + \int_0^t 0.4\,dB_s$. There is
          no derivative anywhere — Brownian paths have none to offer.
      - teach: >
          That is a stochastic differential equation. The notation
          $dX_t = a(t,X_t)\,dt + b(t,X_t)\,dB_t$ means exactly
          $X_t = X_0 + \int_0^t a(s,X_s)\,ds + \int_0^t b(s,X_s)\,dB_s$. The
          coefficient of $dt$, $a$, is the drift: the predictable push per
          unit time. The coefficient of $dB$, $b$, is the diffusion
          coefficient: the size of the noise. A process of this form is an Itô
          process, and its two coefficients are unique. If $a$ and $b$ are
          Lipschitz in $x$ and grow at most linearly, a unique solution exists
          for all $t$.

      - part: Reading coefficients off a process
        ask: >
          $Y_t = 1 + t^{2} + \int_0^t e^{s}\,dB_s$. What is the drift of $Y$ at
          $t = 3$?
        expects: "6"
        hint: >
          Write $t^{2}$ as $\int_0^t (\text{something})\,ds$.
        feedback: >
          $t^{2} = \int_0^t 2s\,ds$, so $dY_t = 2t\,dt + e^{t}\,dB_t$ and the
          drift at $t = 3$ is $6$.
      - ask: >
          Same $Y$. What is its diffusion coefficient at $t = \ln 4$?
        expects: "4"
        feedback: >
          The coefficient of $dB_t$ is $e^{t}$, and $e^{\ln 4} = 4$. Deterministic
          coefficients are allowed; so are coefficients that depend on $X_t$.
      - ask: >
          A colleague proposes $dX_t = B_1\,dB_t$ on $[0,1]$, the noise
          scaled by the path's final value. Is this an Itô process?
        choices:
          - text: >
              Yes: $B_1$ is just a random number, and random coefficients are
              allowed.
            feedback: >
              Random is allowed; clairvoyant is not. At time $t < 1$ the value
              $B_1$ has not happened yet.
          - text: >
              No: the coefficient at time $t$ must be known by time $t$, and
              $B_1$ is not.
            correct: true
            feedback: >
              The $dB$ term is an Itô integral, which needs an adapted
              integrand, and $B_1\,dB_t$ reads the future — the one thing the
              Itô integral forbids.
          - text: >
              No: the diffusion coefficient must be a constant.
            feedback: >
              $b$ may depend on $t$ and on $X_t$, as in the spread above. What
              it may not do is depend on the future.
        feedback: >
          Both coefficients are evaluated with information up to time $t$ —
          that is what makes the $dB$ term an Itô integral at all.
      - ask: >
          Could a drift be hidden in the noise — could the term $3\,dt$ be
          rewritten as $b_t\,dB_t$ for some adapted $b$?
        choices:
          - text: >
              Yes, with $b_t = 3\,dt/dB_t$.
            feedback: >
              $dt/dB_t$ is not an object; neither differential exists on its
              own. And whatever $b$ is, $\int b\,dB$ has mean $0$, while
              $\int_0^t 3\,ds = 3t$ does not.
          - text: >
              No: $\int_0^t b_s\,dB_s$ has mean $0$, while $3t$ does not, so the
              two pieces cannot trade places.
            correct: true
            feedback: >
              That is why the coefficients are unique, and why reading them
              off is meaningful: the $dt$ part and the $dB$ part are different
              in kind.
          - text: >
              Only over short horizons, where $3t$ is smaller than the noise.
            feedback: >
              Size is not the issue. $3t$ has mean $3t$ at every horizon; the
              Itô integral has mean $0$ at every horizon.
        feedback: >
          The drift is the predictable part, the diffusion the unpredictable
          part; no rewriting turns one into the other.

      - part: When a solution runs out of time
        ask: >
          Take the SDE $dX_t = X_t^{2}\,dt$ with $X_0 = 2$ — no noise at all.
          It solves to $X_t = 1/(1/2 - t)$. At what time does the solution
          cease to exist?
        expects: "0.5"
        feedback: >
          $X_t = 1/(0.5 - t)$ blows up as $t \to 0.5$. The drift $x^{2}$ grows
          faster than linearly, so the push feeds on itself and the solution
          reaches infinity in finite time.
      - teach: >
          That is what the growth condition rules out. Drifts and diffusions
          that are Lipschitz with at most linear growth — every model in this
          unit, from $\mu S$ to $\theta(m - X)$ — give one solution, defined
          for all time. In an interview, the first move on any quoted SDE is to
          name the $dt$ coefficient and the $dB$ coefficient aloud.

  - node: quant-processes.ito.ito-lemma
    hook: >
      Itô's lemma is the one piece of machinery every other result in this
      unit is built from — GBM, the OU process, and the martingale test all
      reduce to applying this one substitution correctly.
    explanation: >
      Let $Y_t=f(t,X_t)$ for an Itô process $X_t$. The ordinary chain rule
      would give $df=f_t\,dt+f_x\,dX$, treating $dX$ as small enough that its
      square is negligible. But $X_t$ inherits Brownian motion's infinite
      variation, so a first-order expansion isn't enough — Taylor's theorem
      says to keep the second-order term too:
      $df=f_t\,dt+f_x\,dX+\frac{1}{2}f_{xx}(dX)^{2}$.

      Substitute $dX=a_t\,dt+b_t\,dB_t$ into $(dX)^{2}$: expanding gives
      $a_t^{2}(dt)^{2}+2a_tb_t\,dt\,dB_t+b_t^{2}(dB_t)^{2}$. The multiplication
      table kills the first two terms and turns the third into $b_t^{2}\,dt$
      — that single substitution is the entire derivation. Collecting terms
      gives $dY_t=\left(f_t+a_tf_x+\frac{1}{2}b_t^{2}f_{xx}\right)dt+b_tf_x\,dB_t$.

      The mental model for the new term: $f_x\,dX$ is the ordinary
      chain-rule response to the move, while $\frac{1}{2}f_{xx}b_t^{2}\,dt$ is
      genuinely new — curvature ($f_{xx}$) acting on noise variance
      ($b_t^{2}$) manufactures a systematic drift out of pure randomness,
      because a convex function gains more from an up-move than it loses from
      an equal-sized down-move.
    worked: >
      Apply the lemma to $f(x)=x^{3}$ with $X_t=B_t$ (so $a=0$, $b=1$,
      $f'=3x^{2}$, $f''=6x$). Then $dY_t=\left(\frac{1}{2}(6B_t)(1)\right)dt +
      (3B_t^{2})(1)\,dB_t = 3B_t\,dt+3B_t^{2}\,dB_t$. At the instant
      $B_t=2$, that's a drift of $3(2)=6$ and a diffusion coefficient of
      $3(2)^{2}=12$.
    interview: >
      Interviewers write a function and a process on the board and ask for
      $dY_t$ cold — say "compute $f_t, f_x, f_{xx}$, then plug in" out loud
      as you go. Expect a follow-up asking you to justify the
      $\frac{1}{2}f_{xx}b^{2}$ term from Taylor plus the multiplication table
      on demand.
    pitfalls: >
      Dropping the second-order term as "just a Taylor remainder" is the
      costliest mistake in this unit — it's an $O(dt)$ contribution that
      survives the limit, not vanishing error. Forgetting that $f$ must be
      $C^{2}$ in $x$, not just $C^{1}$, voids the formula outright, since
      $f_{xx}$ has to exist.
    recap: >
      Itô's lemma is Taylor to second order plus the multiplication table:
      $dY_t=\left(f_t+af_x+\frac{1}{2}b^{2}f_{xx}\right)dt+bf_x\,dB_t$.
    dialogue:
      - part: One step of a squared price
        teach: >
          A quantity $X$ sits at $4$ with no drift. Over the next
          $\Delta t = 0.01$ it moves up or down by $0.2$, each with probability
          $1/2$. You hold a contract worth $Y = X^{2}$.
      - ask: >
          What is the expected change in $Y$ over the step?
        expects: "0.04"
        tolerance: 0.0001
        hint: >
          Price $Y$ at both possible endpoints, average, and subtract $16$.
        feedback: >
          $4.2^{2} = 17.64$ and $3.8^{2} = 14.44$, which average to $16.04$. The
          expected change is $16.04 - 16 = 0.04$, out of a quantity with no
          drift at all.
      - ask: >
          The ordinary chain rule says $\Delta Y \approx f'(X)\,\Delta X
          = 8\,\Delta X$. What expected change does that predict?
        expects: "0"
        feedback: >
          $\mathbb{E}[8\,\Delta X] = 8 \times 0 = 0$. The chain rule sees only
          the average move, which is zero, and misses all $0.04$. The gap is
          exact: $(4 + h)^{2} - 16 = 8h + h^{2}$, and the $h^{2} = 0.04$ is
          what the first-order rule throws away.
      - ask: >
          Shrink the step: $\Delta t = 0.0001$, with moves of $\pm 0.02$, so the
          noise keeps the same scale per $\sqrt{\Delta t}$. What is the
          expected change in $Y$ *per unit time* now?
        expects: "4"
        tolerance: 0.001
        hint: >
          Compute the expected change on the step, then divide by
          $\Delta t$.
        feedback: >
          $(4.02^{2} + 3.98^{2})/2 - 16 = 16.0004 - 16 = 0.0004$, and
          $0.0004/0.0001 = 4$. The coarse step gave $0.04/0.01 = 4$ as well.
          The rate does not shrink with the step.
      - ask: >
          Why does the extra drift refuse to vanish as $\Delta t \to 0$?
        choices:
          - text: >
              It should vanish: it is a second-order Taylor remainder, and those
              always die in the limit.
            feedback: >
              They die when the move is of order $\Delta t$, so its square is
              of order $(\Delta t)^{2}$. Here the move is $2\sqrt{\Delta t}$ and
              its square is $4\,\Delta t$ — the same order as the time step
              itself. You just watched the rate sit at $4$.
          - text: >
              The squared move is $(\Delta X)^{2} = 4\,\Delta t$: of order
              $\Delta t$, so it contributes a rate, not an error.
            correct: true
            feedback: >
              Moves of size $\sqrt{\Delta t}$ have squares of size $\Delta t$,
              and that is a drift term. It is the multiplication table again:
              $(dB)^{2} = dt$.
          - text: >
              Because $X = 4$ is far from zero, so the squares are large.
            feedback: >
              For $Y = X^{2}$ the extra is exactly $h^{2}$, whatever $X$ is.
              Start at $X = 0$ or $X = 100$ and the rate is still $4$.
        feedback: >
          Noise of size $\sqrt{dt}$ makes second-order terms first-class. Any
          chain rule for a diffusion has to keep them.

      - part: The term the chain rule drops
        reflect: >
          Now any smooth $f$ and any $X$ with noise $b\,dB$. Taylor gives
          $\Delta f \approx f'(X)\,\Delta X + \frac{1}{2}f''(X)(\Delta X)^{2}$.
          What does the second term become per unit time, and check it
          against the rate of $4$ you found for $X^{2}$ with $b = 2$.
        hint: >
          Replace $(dX)^{2}$ using the multiplication table.
        answer: >
          $(dX)^{2} = b^{2}\,dt$, since only the $(dB)^{2}$ piece survives, so
          the second term is $\frac{1}{2}f''(X)\,b^{2}\,dt$: a drift. For
          $f = x^{2}$, $f'' = 2$, and with $b = 2$ the rate is
          $\frac{1}{2} \times 2 \times 4 = 4$. Curvature times noise variance
          manufactures drift out of a driftless move, because a convex payoff
          gains more on the up-move than it loses on the down-move.
      - teach: >
          That is Itô's lemma. Let $dX_t = a_t\,dt + b_t\,dB_t$ and let
          $f(t,x)$ be $C^{1}$ in $t$ and $C^{2}$ in $x$. Then $Y_t = f(t,X_t)$
          satisfies $dY_t = \left(f_t + a_tf_x + \frac{1}{2}b_t^{2}f_{xx}\right)dt
          + b_tf_x\,dB_t$, all partials at $(t, X_t)$. The proof is the Taylor
          expansion to second order, $df = f_t\,dt + f_x\,dX
          + \frac{1}{2}f_{xx}(dX)^{2}$, with the table turning $(dX)^{2}$ into
          $b_t^{2}\,dt$. The $\frac{1}{2}b_t^{2}f_{xx}$ term is the whole
          difference from ordinary calculus.
      - ask: >
          Where does $a_t$, the drift of $X$, enter the $dt$ coefficient of
          $dY$?
        choices:
          - text: >
              Through $a_tf_x$ and also $\frac{1}{2}a_t^{2}f_{xx}$, from the
              square of the drift.
            feedback: >
              The square of the drift piece is $a_t^{2}(dt)^{2}$, and
              $(dt)^{2} = 0$. Over $n$ steps such terms total of order
              $1/n$.
          - text: >
              Through $a_tb_tf_{xx}$, from the cross term of $(dX)^{2}$.
            feedback: >
              The cross term is $2a_tb_t\,dt\,dB_t$, and $dt\,dB = 0$. It sums
              to something of order $\sqrt{\Delta t}$.
          - text: >
              Only through $a_tf_x$, the ordinary chain-rule term.
            correct: true
            feedback: >
              Of the three pieces of $(dX)^{2}$ only $b_t^{2}(dB)^{2}$
              survives, so the drift of $X$ reaches $Y$ through the first-order
              term alone.
          - text: >
              Nowhere: the drift of $Y$ depends only on $b_t$ and $f_{xx}$.
            feedback: >
              That forgets the first-order term. If $X$ drifts up at rate $a$
              and $f$ is increasing, $Y$ is pushed up at rate $a f_x$, exactly
              as in ordinary calculus.
        feedback: >
          The first-order term carries the drift of $X$; the second-order term
          carries only its noise.

      - part: Running the lemma by hand
        ask: >
          $dX_t = -dt + 2\,dB_t$ and $Y_t = X_t^{2} - 3t$. At the instant
          $X_t = 6$, what is the drift of $Y$?
        expects: "-11"
        hint: >
          Write down $f_t$, $f_x$, $f_{xx}$ first, then $a$ and $b$.
        feedback: >
          $f_t = -3$, $f_x = 2x = 12$, $f_{xx} = 2$; $a = -1$, $b = 2$. Drift
          $= -3 + (-1)(12) + \frac{1}{2}(4)(2) = -3 - 12 + 4 = -11$.
      - ask: >
          Same $X$ and $Y$, same instant. What is the diffusion coefficient of
          $Y$?
        expects: "24"
        feedback: >
          $b\,f_x = 2 \times 12 = 24$. Only the first derivative reaches the
          noise; curvature lives entirely in the drift.
      - ask: >
          For which $f$ does Itô's lemma give exactly the ordinary chain rule,
          whatever Itô process $X$ is?
        choices:
          - text: >
              $f(t,x) = x^{2} + t$
            feedback: >
              $f_{xx} = 2$, so a correction $b_t^{2}\,dt$ appears for any
              noisy $X$. Adding $t$ only adds $f_t = 1$, which the ordinary
              chain rule already has.
          - text: >
              $f(t,x) = e^{x}$
            feedback: >
              $f_{xx} = e^{x} > 0$ everywhere, so the correction
              $\frac{1}{2}b_t^{2}e^{X_t}\,dt$ is always there.
          - text: >
              $f(t,x) = e^{t}(3x + 1)$
            correct: true
            feedback: >
              It depends on $t$, but it is affine in $x$, so $f_{xx} = 0$ and
              the correction vanishes identically. Time-dependence is handled
              by $f_t$ in both calculi.
        feedback: >
          The correction is $\frac{1}{2}b_t^{2}f_{xx}$: it vanishes for every
          $X$ exactly when $f$ is affine in $x$.

      - part: Where the formula stops
        ask: >
          Take $f(x) = |x|$ and $X = B$, started at $0$. Away from $0$,
          $f'' = 0$, so a careless use of the lemma gives
          $d|B_t| = \sgn(B_t)\,dB_t$ with no drift. Yet
          $\mathbb{E}|B_t| = \sqrt{2t/\pi}$ grows. What went wrong?
        choices:
          - text: >
              Nothing: $\mathbb{E}|B_t|$ is actually $0$, by symmetry.
            feedback: >
              $|B_t| \ge 0$ and is positive with probability $1$, so its mean
              is strictly positive. Symmetry makes $\mathbb{E}[B_t] = 0$, not
              $\mathbb{E}|B_t|$.
          - text: >
              $\sgn(B_t)$ is not adapted, so the $dB$ term is not an Itô
              integral.
            feedback: >
              $\sgn(B_t)$ is read off the path at time $t$; it is adapted. The
              trouble is elsewhere.
          - text: >
              $|x|$ is not $C^{2}$: all its curvature sits in the kink at $0$,
              which $B$ keeps revisiting, and the lemma cannot see it.
            correct: true
            feedback: >
              The hypothesis $f \in C^{2}$ is not decoration. The kink carries
              infinite curvature at one point, and the path's repeated visits
              there generate exactly the drift the careless formula lost.
        feedback: >
          Check the hypotheses before using the lemma: $C^{1}$ in $t$, $C^{2}$
          in $x$, on the region the process actually visits.
      - teach: >
          In an interview, say the recipe aloud as you go: "partials first —
          $f_t$, $f_x$, $f_{xx}$ — then the drift is
          $f_t + af_x + \frac{1}{2}b^{2}f_{xx}$ and the noise is $bf_x$." Then
          name the third term as the convexity correction before you are asked
          where it came from.

  - node: quant-processes.ito.ito-lemma-worked
    hook: >
      Nearly every candidate who tries $\int_0^t B_s\,dB_s=\frac{1}{2}B_t^{2}$
      from memory of ordinary calculus gets it wrong — the missing $-t/2$ is
      the most reliable tell an interviewer has for whether Itô's lemma is
      actually understood.
    explanation: >
      Applying the recipe to $f(x)=x^{2}$ with $X_t=B_t$ gives $f'=2x$,
      $f''=2$, so $d(B_t^{2})=2B_t\,dB_t+dt$. Integrating and using $B_0=0$
      gives $\int_0^t B_s\,dB_s=(B_t^{2}-t)/2$ — not $B_t^{2}/2$, the ordinary
      calculus answer.

      The correction is forced, not optional: the Itô integral must have mean
      zero, and $\mathbb{E}[B_t^{2}]=t$ from Brownian motion's variance. So
      $\frac{1}{2}B_t^{2}$ alone has mean $t/2\ne 0$ and cannot be a correct
      value for a stochastic integral, while $(B_t^{2}-t)/2$ has mean exactly
      $0$, as it must.

      The second classic, $f(x)=e^{\sigma x}$, gives $d(e^{\sigma B_t}) =
      \sigma e^{\sigma B_t}\,dB_t+\frac{\sigma^{2}}{2}e^{\sigma B_t}\,dt$, so
      $e^{\sigma B_t}$ drifts upward at rate $\sigma^{2}/2$ even though $B_t$
      itself has no drift at all. The mechanism is the same curvature
      argument: $e^{\sigma x}$ is convex, so curvature times noise variance
      manufactures a positive drift purely from randomness.
    worked: >
      Take $f(x)=\cos x$ applied to $X_t=B_t$: $f'=-\sin x$, $f''=-\cos x$,
      so $d(\cos B_t) = -\sin(B_t)\,dB_t - \frac{1}{2}\cos(B_t)\,dt$. At the
      instant $B_t=0$ this reduces to $d(\cos B_t) = -\frac{1}{2}\,dt$ exactly
      — there is no $dB_t$ term at all at that instant, since $\sin(0)=0$, so
      the process is momentarily deterministic and drifting downward at rate
      $1/2$.
    interview: >
      "What's $\int_0^t B_s\,dB_s$" is a direct check — answer
      $(B_t^{2}-t)/2$, not $B_t^{2}/2$, and be ready to justify the $-t/2$
      from the mean-zero property. A related favorite: "does $e^{B_t}$ have
      positive drift even though $B_t$ doesn't" — yes, rate $1/2$, purely from
      convexity.
    pitfalls: >
      Writing $\frac{1}{2}B_t^{2}$ and stopping reproduces the ordinary
      calculus answer, which has the wrong mean and is provably not a
      martingale. Getting the sign of the exponential drift backwards — it's
      $+\sigma^{2}/2$, not $-\sigma^{2}/2$, because $e^{\sigma x}$ is convex —
      is the mirror-image error.
    recap: >
      $\int_0^t B_s\,dB_s=(B_t^{2}-t)/2$ and $d(e^{\sigma B_t})$ carries a
      $+\sigma^{2}/2$ drift purely from convexity — both are Itô's lemma
      applied to a specific $f$.
    dialogue:
      - part: A desk that stakes the price
        teach: >
          A desk holds $B_s$ units of an asset whose price is a standard
          Brownian motion $B$ started at $0$: going into each move it holds
          the current price, so over $[0,3]$ its P&L is
          $\int_0^3 B_s\,dB_s$. On today's path, $B_3 = 2$.
      - ask: >
          If the ordinary rule $\int_0^t x\,dx = t^{2}/2$ carried over, so that
          $\int_0^3 B_s\,dB_s = B_3^{2}/2$, what would today's P&L be?
        expects: "2"
        feedback: >
          $2^{2}/2 = 2$. Hold on to that number and test the formula behind it
          before trusting it.
      - ask: >
          Averaged over all paths, what is the expected P&L of this desk?
        expects: "0"
        hint: >
          The stake is set before each move, from the path so far.
        feedback: >
          $B_s$ is adapted, so $\int_0^3 B_s\,dB_s$ is an Itô integral and has
          mean $0$: every term is a known stake times a fresh, mean-zero
          increment.
      - ask: >
          Now average the ordinary-calculus answer. What is
          $\mathbb{E}\left[B_3^{2}/2\right]$?
        expects: "1.5"
        feedback: >
          $\mathbb{E}[B_3^{2}] = \operatorname{Var}(B_3) = 3$, so the mean is
          $3/2 = 1.5$.
      - ask: >
          The integral has mean $0$ and $B_3^{2}/2$ has mean $1.5$. What
          follows?
        choices:
          - text: >
              The integral's mean is not really $0$ here, because the stake
              $B_s$ is random.
            feedback: >
              Random stakes are allowed; only stakes that read the future are
              not. $B_s$ is known at time $s$, so the mean-zero argument holds
              term by term.
          - text: >
              $B_3^{2}/2$ is the wrong value: the true integral differs from it
              by something with mean $1.5$.
            correct: true
            feedback: >
              Two random variables with different means cannot be equal. The
              ordinary rule is off, and the error has mean exactly $t/2$.
          - text: >
              Both are right; they agree on average once you include the
              fluctuations.
            feedback: >
              Means are numbers: $0 \ne 1.5$. If the two were equal path by
              path, their means would match.
        feedback: >
          The ordinary formula fails a test any correct answer must pass. The
          correction has to be found, not guessed.

      - part: Letting the lemma find the correction
        reflect: >
          The fix must remove a mean of $t/2$. Which function would you feed
          to Itô's lemma so that $B_t\,dB_t$ appears in its output, and what
          does the lemma then give for $\int_0^t B_s\,dB_s$?
        hint: >
          Ordinary calculus finds $\int x\,dx$ by differentiating $x^{2}$.
        answer: >
          Take $f(x) = x^{2}$ with $X = B$, so $a = 0$, $b = 1$, $f' = 2x$,
          $f'' = 2$. Itô gives $d(B_t^{2}) = 2B_t\,dB_t + \frac{1}{2}(2)\,dt
          = 2B_t\,dB_t + dt$. Integrate from $0$ with $B_0 = 0$:
          $B_t^{2} = 2\int_0^t B_s\,dB_s + t$, so
          $\int_0^t B_s\,dB_s = \frac{1}{2}\left(B_t^{2} - t\right)$. The $-t/2$
          is the convexity term, and it removes exactly the mean of $t/2$.
      - teach: >
          So $\int_0^t B_s\,dB_s = \frac{1}{2}\left(B_t^{2} - t\right)$, not
          $\frac{1}{2}B_t^{2}$. The left-endpoint stake never collects the
          squared increments, whose sum is $t$; ordinary calculus counts them
          and Itô does not. Its mean is $(t - t)/2 = 0$, as it must be.
      - ask: >
          Back to today's path, $B_3 = 2$. What is the desk's actual P&L?
        expects: "0.5"
        feedback: >
          $\frac{1}{2}(2^{2} - 3) = \frac{1}{2}(1) = 0.5$. The naive answer of
          $2$ overstated it by $t/2 = 1.5$, and it always will, path by path.
      - ask: >
          On another path the price ends where it started, $B_3 = 0$. What is
          the P&L?
        expects: "-1.5"
        feedback: >
          $\frac{1}{2}(0 - 3) = -1.5$. The price went nowhere and the desk still
          lost: it held long when the price was high and short when it was low,
          so it bought rallies and sold dips. Each round trip costs about the
          squared increment, and those total $t = 3$.

      - part: A driftless price, an exponential payoff
        ask: >
          Now a contract pays $Y_t = e^{0.6B_t}$. $B$ has mean $0$ at every
          time. What happens to $\mathbb{E}[Y_t]$ as $t$ grows?
        choices:
          - text: >
              It stays at $e^{0} = 1$, because $B_t$ has mean $0$.
            feedback: >
              That moves the expectation inside a convex function. An up-move of
              $0.5$ multiplies $Y$ by $e^{0.3} \approx 1.35$; an equal down-move
              multiplies it by $e^{-0.3} \approx 0.74$. The average factor is
              about $1.045$, not $1$.
          - text: >
              It rises, because $e^{0.6x}$ is convex.
            correct: true
            feedback: >
              Convexity rewards the up-move more than it penalises the
              down-move, so a driftless input produces an upward-drifting
              output.
          - text: >
              It falls, because a long run of down-moves drags $e^{0.6B_t}$
              toward $0$.
            feedback: >
              It can approach $0$ but never cross it, while up-moves have no
              ceiling. Up and down moves are equally likely, and through a
              convex function the up-moves weigh more. The mean goes up.
        feedback: >
          Itô's lemma turns that picture into a rate.
      - ask: >
          Apply Itô's lemma to $f(x) = e^{0.6x}$ with $X = B$. The drift of $Y$
          is some constant times $Y_t$ itself. What is the constant?
        expects: "0.18"
        hint: >
          $f' = 0.6e^{0.6x}$ and $f'' = 0.36e^{0.6x}$; the drift is
          $\frac{1}{2}f''$ here.
        feedback: >
          $\frac{1}{2}(0.36)e^{0.6B_t} = 0.18\,Y_t$. So
          $dY_t = 0.18\,Y_t\,dt + 0.6\,Y_t\,dB_t$: a driftless $B$ produces a
          $Y$ growing at rate $\sigma^{2}/2$.
      - ask: >
          Taking expectations kills the $dB$ term, so
          $\frac{d}{dt}\mathbb{E}[Y_t] = 0.18\,\mathbb{E}[Y_t]$ with
          $\mathbb{E}[Y_0] = 1$. What is $\mathbb{E}[Y_2]$, to four decimal
          places?
        expects: "1.4333"
        tolerance: 0.0005
        feedback: >
          $\mathbb{E}[Y_t] = e^{0.18t}$, so $\mathbb{E}[Y_2] = e^{0.36}
          \approx 1.4333$. It matches the normal moment formula
          $\mathbb{E}\left[e^{\sigma B_t}\right] = e^{\sigma^{2}t/2}$, reached
          here without ever writing down a density.
      - ask: >
          Flip the sign: $Z_t = e^{-0.6B_t}$. What is the drift of $Z$, as a
          multiple of $Z_t$?
        choices:
          - text: >
              $-0.18$: the sign of $\sigma$ flips the correction.
            feedback: >
              The correction is $\frac{1}{2}f''$ with
              $f'' = (-0.6)^{2}e^{-0.6x} = 0.36e^{-0.6x}$. The square erases
              the sign.
          - text: >
              $0$: the up and down effects cancel when $\sigma$ is negative.
            feedback: >
              $e^{-0.6x}$ is still convex, so the up-moves of $Z$ still
              outweigh its down-moves. Nothing cancels.
          - text: >
              $+0.18$: $f''$ is $0.36e^{-0.6x} > 0$, so the drift is positive.
            correct: true
            feedback: >
              Only $\sigma^{2}$ enters the drift. $Z$ is $Y$ with the path
              reflected, and $B$ and $-B$ have the same law, so they had to
              drift alike.
        feedback: >
          Convex in, upward drift out, whatever the sign of $\sigma$. A concave
          transform does the opposite.
      - teach: >
          Both classics come from one move: pick $f$, read off $f'$ and
          $f''$, and let $\frac{1}{2}f''$ supply the drift. Asked for
          $\int_0^t B_s\,dB_s$ in an interview, answer
          $\frac{1}{2}\left(B_t^{2} - t\right)$ and justify the $-t/2$ in one
          line: an Itô integral has mean $0$, and $\mathbb{E}[B_t^{2}] = t$.

  - node: quant-processes.ito.product-rule
    hook: >
      "Are these two driftless processes' product still driftless" is a
      favorite trap — the answer hinges entirely on correlation, and the extra
      term is easy to forget.
    explanation: >
      Expanding $d(X_tY_t)$ to second order picks up a cross term beyond the
      ordinary product rule: $d(X_tY_t)=X_t\,dY_t+Y_t\,dX_t+dX_t\,dY_t$.
      Substituting $dX_t=a_t\,dt+b_t\,dB_t$ and $dY_t=c_t\,dt+e_t\,dB_t$ and
      applying the multiplication table, every term in $dX_t\,dY_t$ vanishes
      except $b_te_t\,dB_t\,dB_t$, which becomes $b_te_t\,dt$ for driftless
      shared noise, or $\rho\,b_te_t\,dt$ when the two Brownian motions have
      correlation $\rho$.

      A useful self-check: setting $X=Y$ must reproduce Itô's lemma for
      $f(x)=x^{2}$, since then $b=e$ and $\rho=1$ trivially, giving
      $d(X^{2})=2X\,dX+b_t^{2}\,dt$ — exactly the earlier result.

      The covariation term $d\langle X,Y\rangle_t=b_te_t\,dt$ is literally how
      much the two processes' noise moves together — zero for independent
      drivers, nonzero whenever they're correlated. Because $X_t\,dY_t$ and
      $Y_t\,dX_t$ are themselves Itô integrals with mean zero, taking
      expectations of the product rule kills those two terms, leaving
      $d\,\mathbb{E}[X_tY_t]=b_te_t\rho\,dt$ — a clean tool for tracking
      $\mathbb{E}[X_tY_t]$ without ever integrating a path directly.
    worked: >
      Let $X_t=B_t^{(1)}$ and $Y_t=B_t^{(2)}$ be Brownian motions with
      correlation $\rho=0.6$, both starting at $0$. The product rule gives
      $d(X_tY_t)=X_t\,dY_t+Y_t\,dX_t+0.6\,dt$; the first two terms have
      expectation $0$, leaving $d\,\mathbb{E}[X_tY_t]=0.6\,dt$. Integrating
      from $0$ with $X_0Y_0=0$ gives $\mathbb{E}[X_5Y_5]=0.6\times 5=3$.
    interview: >
      "If $X$ and $Y$ are both driftless, is $XY$ driftless too" is answered
      with "only if uncorrelated," naming the extra $be\,dt$ term as the
      covariation. A common follow-up asks for $\operatorname{Cov}(X_t,Y_t)$
      of two correlated Brownian motions, which is exactly this computation.
    pitfalls: >
      Applying the ordinary product rule $d(XY)=X\,dY+Y\,dX$ with no extra
      term is wrong whenever the two processes share randomness. Forgetting
      that setting $X=Y$ should reproduce Itô's lemma for $f(x)=x^{2}$ is a
      fast self-check that catches a dropped factor of $2$ or a missing
      $\rho$.
    recap: >
      $d(XY)=X\,dY+Y\,dX+be\rho\,dt$ — the ordinary product rule plus a
      covariation term that vanishes only when the two drivers are
      uncorrelated.
    dialogue:
      - part: Two books on one driver
        teach: >
          Two quantities are driven by the same Brownian motion and neither has
          any drift. Right now $X = 3$ and $Y = 5$. Over the next
          $\Delta t = 0.01$ the driver moves $\Delta B = \pm 0.1$ with equal
          probability; $X$ moves by $2\,\Delta B$ and $Y$ by $4\,\Delta B$. You
          care about the product $XY$.
      - ask: >
          What is the expected change in $XY$ over the step?
        expects: "0.08"
        tolerance: 0.0001
        hint: >
          Compute the product at both endpoints: $(3.2)(5.4)$ and $(2.8)(4.6)$.
        feedback: >
          $3.2 \times 5.4 = 17.28$ and $2.8 \times 4.6 = 12.88$, which average to
          $15.08$. The expected change is $15.08 - 15 = 0.08$, from two
          driftless factors.
      - ask: >
          The ordinary product rule says $\Delta(XY) \approx X\,\Delta Y
          + Y\,\Delta X$. What expected change does it predict?
        expects: "0"
        feedback: >
          $3(4\,\Delta B) + 5(2\,\Delta B) = 22\,\Delta B$, with mean $0$. The
          ordinary rule misses all of the $0.08$.
      - ask: >
          The exact change is $(3 + 2h)(5 + 4h) - 15$ with $h = \Delta B$.
          Which piece of it carries the $0.08$?
        choices:
          - text: >
              The $22h$ piece, because it is the larger of the two.
            feedback: >
              It is larger on each step, but $h$ is $\pm 0.1$ with equal
              probability, so $22h$ averages to $0$. Size and mean are
              different things.
          - text: >
              The $8h^{2}$ piece, the product of the two moves
              $\Delta X\,\Delta Y$.
            correct: true
            feedback: >
              $8h^{2} = 8 \times 0.01 = 0.08$ on either outcome. It never
              changes sign, so it never averages away.
          - text: >
              Neither: $0.08$ is a rounding artefact of the coarse step.
            feedback: >
              $8h^{2}$ is $8\,\Delta t$ exactly, at every step size. Refine the
              grid and it shrinks in proportion to $\Delta t$ — a rate, not an
              artefact.
        feedback: >
          $(3 + 2h)(5 + 4h) - 15 = 22h + 8h^{2}$. The cross product of the two
          moves is what the ordinary rule drops.
      - ask: >
          As a rate per unit time, what does that piece contribute?
        expects: "8"
        feedback: >
          $8h^{2}/\Delta t = 8 \times 0.01/0.01 = 8$, which is $2 \times 4$: the
          product of the two noise coefficients.
      - ask: >
          Now give $X$ and $Y$ independent drivers: $X$ moves $2h_{1}$ and $Y$
          moves $4h_{2}$, with $h_{1}, h_{2} = \pm 0.1$ independent fair coins.
          What is the expected change in $XY$?
        expects: "0"
        hint: >
          The cross piece is now $8h_{1}h_{2}$.
        feedback: >
          $\mathbb{E}[8h_{1}h_{2}] = 8\,\mathbb{E}[h_{1}]\,\mathbb{E}[h_{2}] = 0$.
          With independent noise the moves cancel on average, and the ordinary
          product rule is right.

      - part: The cross term, in general
        reflect: >
          Let $dX = a\,dt + b\,dB^{(1)}$ and $dY = c\,dt + e\,dB^{(2)}$ with
          the two drivers of correlation $\rho$. Expanding $(X + dX)(Y + dY)$
          gives $X\,dY + Y\,dX + dX\,dY$. What does $dX\,dY$ become, and how
          does it reproduce both the $8$ and the $0$ you just found?
        hint: >
          Four products; send each through the multiplication table.
        answer: >
          $dX\,dY = ac\,(dt)^{2} + ae\,dt\,dB^{(2)} + cb\,dt\,dB^{(1)}
          + be\,dB^{(1)}dB^{(2)}$. Only the last survives, and
          $dB^{(1)}dB^{(2)} = \rho\,dt$, so $dX\,dY = \rho\,be\,dt$. One shared
          driver is $\rho = 1$, giving $2 \times 4 = 8$; independent drivers are
          $\rho = 0$, giving $0$.
      - teach: >
          That is the Itô product rule. With both processes on one Brownian
          motion, $d(X_tY_t) = X_t\,dY_t + Y_t\,dX_t + b_te_t\,dt$; with
          drivers of correlation $\rho$, the last term is $\rho\,b_te_t\,dt$.
          The extra term is the covariation $d\langle X, Y\rangle_t$: how much
          the two noises move together. It is the two-variable version of
          Itô's $\frac{1}{2}f_{xx}b^{2}$ term, from the cross term of a
          second-order Taylor expansion.
      - ask: >
          Set $Y = X$, with $dX = a_t\,dt + b_t\,dB_t$. What does the product
          rule give for $d(X_t^{2})$?
        choices:
          - text: >
              $2X_t\,dX_t$
            feedback: >
              That is the ordinary chain rule. With $Y = X$ the two noises are
              perfectly correlated, so the covariation $b_t \cdot b_t\,dt$ does
              not vanish.
          - text: >
              $2X_t\,dX_t + \frac{1}{2}b_t^{2}\,dt$
            feedback: >
              The product rule's extra term is $b_te_t\,dt$ with $e = b$, a full
              $b_t^{2}\,dt$. The factor $\frac{1}{2}$ in Itô's lemma meets
              $f'' = 2$ and cancels.
          - text: >
              $2X_t\,dX_t + b_t^{2}\,dt$
            correct: true
            feedback: >
              The same answer Itô's lemma gives for $f(x) = x^{2}$:
              $\frac{1}{2}(2)b_t^{2} = b_t^{2}$. Two routes, one result.
        feedback: >
          Setting $X = Y$ is the self-check that catches a dropped factor or a
          missing $\rho$.

      - part: Running it by hand
        ask: >
          On one Brownian motion, $dX_t = dt + 2\,dB_t$ and
          $dY_t = -0.5\,dt + 3\,dB_t$. At the instant $X_t = 4$, $Y_t = 10$, what
          is the drift of $X_tY_t$?
        expects: "14"
        hint: >
          Drift of $XY$ is $X \cdot (\text{drift of } Y) + Y \cdot
          (\text{drift of } X) + be$.
        feedback: >
          $4(-0.5) + 10(1) + 2 \times 3 = -2 + 10 + 6 = 14$. Without the
          covariation you would say $8$.
      - ask: >
          Same instant. What is the diffusion coefficient of $X_tY_t$?
        expects: "32"
        feedback: >
          $X\,e + Y\,b = 4(3) + 10(2) = 12 + 20 = 32$. The covariation adds
          drift only; the noise of the product is the ordinary product rule's.
      - ask: >
          $X$ and $Y$ are both driftless Itô processes. When is $X_tY_t$
          driftless too?
        choices:
          - text: >
              Always: a product of driftless processes has no source of drift.
            feedback: >
              The opening pair had no drift and their product drifted at rate
              $8$. The source is $\rho\,b_te_t$, shared noise.
          - text: >
              Only when their noises are uncorrelated, or one of them has no
              noise.
            correct: true
            feedback: >
              The drift of $XY$ is then exactly $\rho\,b_te_t$, and it vanishes
              only if $\rho = 0$ or one of $b_t$, $e_t$ is $0$.
          - text: >
              Never: the product of two random processes always drifts.
            feedback: >
              Independent drivers gave an expected change of $0$ above. With
              $\rho = 0$ the product is driftless.
        feedback: >
          The product's drift is the covariation. Taking expectations kills
          the two $dB$ terms, so $\frac{d}{dt}\mathbb{E}[X_tY_t]
          = \mathbb{E}[\rho\,b_te_t]$ for driftless $X$, $Y$: accumulated
          covariation is all that moves the mean of a product.
      - teach: >
          In an interview, "if $X$ and $Y$ are driftless, is $XY$?" is answered
          "only if uncorrelated", followed at once by the term that breaks it:
          $\rho\,b_te_t\,dt$, the covariation.

  - node: quant-processes.ito.log-transform
    hook: >
      Whenever an SDE's coefficients scale with the state itself, taking logs
      is the one transform that makes the equation solvable by inspection —
      recognizing that pattern in ten seconds beats any amount of algebra
      skill.
    explanation: >
      The trigger pattern is $dX_t=\mu X_t\,dt+\sigma X_t\,dB_t$: both
      coefficients carry a factor of $X_t$. Applying Itô's lemma with
      $f(x)=\ln x$ exploits that exactly, since $f'=1/x$ and $f''=-1/x^{2}$
      also carry a reciprocal factor of $X_t$ that cancels it.

      Working the substitution: $dY_t = \left(a f' +
      \frac{1}{2}b^{2}f''\right)dt + bf'\,dB_t = \left(\mu X_t\cdot
      \frac{1}{X_t} + \frac{1}{2}\sigma^{2}X_t^{2}\cdot\left(-\frac{1}{X_t^{2}}
      \right)\right)dt + \sigma X_t\cdot\frac{1}{X_t}\,dB_t = \left(\mu -
      \frac{\sigma^{2}}{2}\right)dt+\sigma\,dB_t$. Every factor of $X_t$
      cancels — that cancellation is the entire payoff of the transform.

      The result is Brownian motion with constant drift, which integrates
      directly with no further Itô work needed. The $-\sigma^{2}/2$ is exactly
      the $\frac{1}{2}f''b^{2}$ curvature term, negative because $\ln$ is
      concave — concavity always costs drift, the mirror image of the convex
      exponential gaining drift. The general principle: find the transform
      that flattens the coefficients to constants, then integrate the flat
      equation directly.
    worked: >
      Take $dX_t=0.08X_t\,dt+0.25X_t\,dB_t$. Applying the transform:
      $d\ln X_t = (0.08-0.25^{2}/2)\,dt+0.25\,dB_t = 0.04875\,dt+0.25\,dB_t$,
      so $\ln X_t=\ln X_0+0.04875\,t+0.25B_t$ — a plain Brownian motion with
      drift $0.04875$, integrable by inspection.
    interview: >
      "The coefficients are both proportional to $X_t$ — how do you solve
      this" is the setup line; answer "take logs" immediately, then name the
      $-\sigma^{2}/2$ correction without prompting. A common trap asks for the
      drift of $\ln X_t$ specifically, checking the sign of that correction.
    pitfalls: >
      Forgetting the $-\sigma^{2}/2$ term reproduces the ordinary-calculus
      formula for $d(\ln X)=dX/X$, which is wrong here. Applying this
      transform to an SDE whose coefficients aren't actually proportional to
      $X_t$ cancels nothing and leaves a mess instead of a solution.
    recap: >
      Logging a proportional-coefficient SDE cancels every factor of $X$,
      leaving constant-drift Brownian motion at the cost of a $-\sigma^{2}/2$
      term from Itô's concavity correction.
    dialogue:
      - part: An equation that contains its answer
        teach: >
          A fund's equity obeys $dX_t = 0.2X_t\,dt + 0.5X_t\,dB_t$ with
          $X_0 = 100$: it earns $20\%$ a year on average with $50\%$
          volatility, both proportional to its current size. You want $X_t$
          as a formula in $B_t$.
      - ask: >
          As an integral equation,
          $X_t = 100 + \int_0^t 0.2X_s\,ds + \int_0^t 0.5X_s\,dB_s$. Why can't
          you simply evaluate the right side?
        choices:
          - text: >
              The $dB$ integral is undefined, because its integrand is random.
            feedback: >
              Random integrands are fine as long as they are adapted, and
              $X_s$ is. The integral exists; you just cannot compute it yet.
          - text: >
              The unknown $X$ sits inside both integrals, so the right side
              needs the answer before it can produce it.
            correct: true
            feedback: >
              The equation is implicit. Something has to strip $X$ out of the
              coefficients before anything integrates.
          - text: >
              No solution exists: coefficients that grow with $X$ blow up.
            feedback: >
              $0.2x$ and $0.5x$ are Lipschitz and grow linearly, so a unique
              solution exists for all time. The difficulty is finding it.
        feedback: >
          An SDE with state-dependent coefficients does not integrate by
          inspection. You need a change of variable.
      - ask: >
          Ordinary calculus would divide through, $dX/X = 0.2\,dt + 0.5\,dB$,
          and call the left side $d(\ln X)$. What drift would that assign to
          $\ln X$?
        expects: "0.2"
        feedback: >
          Read off the $dt$ coefficient: $0.2$. That is the ordinary-calculus
          answer. Keep it, and test it once Itô has had a say.

      - part: Choosing the change of variable
        reflect: >
          By Itô's lemma, $f(X_t)$ has noise coefficient
          $b\,f'(X_t) = 0.5X_t\,f'(X_t)$. Which $f$ makes that a constant, and
          why would a constant coefficient be what you want?
        hint: >
          You need $x\,f'(x)$ to be the same for every $x$.
        answer: >
          $x\,f'(x) = 1$ gives $f'(x) = 1/x$, so $f = \ln x$, and the noise of
          $\ln X$ is $0.5$ flat. An SDE whose coefficients are constants needs
          no solving: $dY = c\,dt + s\,dB$ integrates to
          $Y_t = Y_0 + ct + sB_t$ at once. The drift still has to come out
          constant too, which is worth checking rather than assuming.
      - ask: >
          Apply Itô's lemma to $\ln X_t$, with $f' = 1/x$ and $f'' = -1/x^{2}$.
          What is the drift of $\ln X$?
        expects: "0.075"
        tolerance: 0.0001
        hint: >
          Drift is $a f' + \frac{1}{2}b^{2}f''$ with $a = 0.2X$ and $b = 0.5X$.
        feedback: >
          $0.2X \cdot \frac{1}{X} + \frac{1}{2}(0.5X)^{2}\left(-\frac{1}{X^{2}}\right)
          = 0.2 - 0.125 = 0.075$. Every $X$ cancelled: the drift is constant
          too.
      - teach: >
          That is the log transform. When both coefficients are proportional to
          the state, $dX_t = \mu X_t\,dt + \sigma X_t\,dB_t$, apply Itô to
          $\ln x$ (valid on $x > 0$): $d\ln X_t = \left(\mu
          - \frac{\sigma^{2}}{2}\right)dt + \sigma\,dB_t$. A Brownian motion
          with constant drift, which integrates to $\ln X_t = \ln X_0
          + \left(\mu - \frac{\sigma^{2}}{2}\right)t + \sigma B_t$. The general
          rule: find the transform that makes the coefficients constant, then
          integrate.
      - ask: >
          Ordinary calculus said $0.2$; Itô says $0.075$. Which is right, and
          where does the gap of $0.125$ come from?
        choices:
          - text: >
              $0.2$: the gap is a second-order term, which vanishes in the
              limit.
            feedback: >
              Second-order in $dX$ means $(dX)^{2} = b^{2}\,dt$, a first-order
              drift. That is exactly the term that does not vanish.
          - text: >
              $0.075$: the gap is $\frac{1}{2}f''b^{2} = -\sigma^{2}/2$,
              negative because $\ln$ is concave.
            correct: true
            feedback: >
              $\frac{1}{2}\left(-\frac{1}{X^{2}}\right)(0.25X^{2}) = -0.125$.
              Concavity costs drift, the mirror image of a convex
              exponential gaining it.
          - text: >
              Neither: it should be $0.2 + 0.125 = 0.325$, since $\sigma^{2}$
              is positive.
            feedback: >
              $\sigma^{2}$ is positive, but $f'' = -1/x^{2}$ is negative. The
              sign of the correction is the sign of the curvature.
        feedback: >
          $d(\ln X) \ne dX/X$ for a diffusion. The difference is the
          $-\sigma^{2}/2$, and it is the whole content of the transform.

      - part: Integrating the flat equation
        ask: >
          On a path with $B_4 = -0.2$, what is $\ln(X_4/X_0)$?
        expects: "0.2"
        tolerance: 0.0001
        hint: >
          $\ln X_t - \ln X_0 = 0.075t + 0.5B_t$.
        feedback: >
          $0.075 \times 4 + 0.5 \times (-0.2) = 0.3 - 0.1 = 0.2$. Exponentiate
          and you have $X_4 = 100e^{0.2}$ on that path.
      - ask: >
          A relative: $dX_t = 0.4X_t\,dB_t$, no drift at all. What is the
          drift of $\ln X_t$?
        expects: "-0.08"
        tolerance: 0.0001
        feedback: >
          $\mu - \sigma^{2}/2 = 0 - 0.16/2 = -0.08$. A process with no drift
          whose logarithm drifts steadily down: the concavity tax with
          nothing to offset it.
      - ask: >
          Another equation has noise $0.5\sqrt{X_t}\,dB_t$. Which transform
          makes its *noise* coefficient constant?
        choices:
          - text: >
              $\ln x$, as always.
            feedback: >
              $0.5\sqrt{x} \cdot \frac{1}{x} = 0.5/\sqrt{x}$, still a function
              of $x$. The log only flattens noise proportional to $x$.
          - text: >
              $\sqrt{x}$
            correct: true
            feedback: >
              $f' = \frac{1}{2\sqrt{x}}$, so $b f' = 0.5\sqrt{x}
              \cdot \frac{1}{2\sqrt{x}} = 0.25$. Whether the drift also comes
              out constant depends on the drift; here the Itô term
              $\frac{1}{2}b^{2}f'' = -\frac{1}{32\sqrt{x}}$ alone already does
              not.
          - text: >
              $x^{2}$
            feedback: >
              $0.5\sqrt{x} \cdot 2x = x^{3/2}$, which makes the noise grow
              faster, not flatter.
        feedback: >
          The recipe is general: solve $b(x)f'(x) = \text{const}$ for the
          transform, then check whether the drift flattens with it. For
          proportional coefficients both flatten at once, which is why the log
          is the one to know cold.
      - ask: >
          A candidate takes logs of $dX_t = 0.2\,dt + 0.5\,dB_t$. What
          happens?
        choices:
          - text: >
              It works: $d\ln X_t = (0.2 - 0.125)\,dt + 0.5\,dB_t$.
            feedback: >
              That plugs in the proportional-case answer. Here
              $a f' = 0.2/X$ and $b f' = 0.5/X$: nothing cancels.
          - text: >
              It makes things worse: the coefficients become $0.2/X
              - 0.125/X^{2}$ and $0.5/X$, and $\ln$ is undefined once $X$
              goes negative, which it can.
            correct: true
            feedback: >
              The equation was already flat, $X_t = X_0 + 0.2t + 0.5B_t$. The
              log introduces the very state-dependence it is meant to remove.
          - text: >
              It works, but only for small $t$.
            feedback: >
              Nothing cancels at any horizon: the transformed coefficients
              depend on $X$ from the first instant.
        feedback: >
          Match the transform to the coefficients. Proportional coefficients
          want the log; constant ones want nothing.
      - teach: >
          In an interview, the setup line is "both coefficients are
          proportional to $X$". Answer "take logs", then say the
          $-\sigma^{2}/2$ before you are asked for it, and say why it is
          negative: $\ln$ is concave.

  - node: quant-processes.ito.gbm
    hook: >
      GBM is the most-quoted model in a quant interview — reciting
      $S_t=S_0e^{(\mu-\sigma^{2}/2)t+\sigma B_t}$ from memory is table stakes,
      but re-deriving that exponent from the SDE in thirty seconds is the real
      test.
    explanation: >
      This is the log-transform technique applied to the price SDE itself.
      Since $dS_t=\mu S_t\,dt+\sigma S_t\,dB_t$ has coefficients proportional
      to $S_t$, taking logs gives $d\ln S_t=\left(\mu -
      \frac{\sigma^{2}}{2}\right)dt+\sigma\,dB_t$ directly, with no new
      derivation required beyond the established substitution.

      Because the right side is now constant drift plus a Brownian increment,
      it integrates by inspection: $\ln S_t-\ln S_0 = \left(\mu -
      \frac{\sigma^{2}}{2}\right)t+\sigma B_t$, and exponentiating gives the
      closed form directly.

      Since $\ln(S_t/S_0)$ is normal with mean $(\mu-\sigma^{2}/2)t$ and
      variance $\sigma^{2}t$ (Brownian motion's variance-$t$ property carried
      through the linear transform), $S_t/S_0$ is exactly lognormal by
      definition — every lognormal moment formula applies to it immediately.

      Three properties fall out and explain why this is the default equity
      model: the exponential form guarantees $S_t>0$ always; returns over
      disjoint periods are independent, inherited directly from Brownian
      motion's independent increments; and $\sigma$ is a genuinely
      proportional volatility, since a fixed dollar move means something
      different at $S=50$ than at $S=500$, which multiplicative noise
      captures and additive noise cannot.
    worked: >
      Take $S_0=100$, $\mu=0.08$, $\sigma=0.2$, and suppose a year passes with
      a realized value $B_1=0.3$. Then $S_1=100\exp\left((0.08-0.02)(1) +
      0.2(0.3)\right) = 100\exp(0.12) \approx 100\times 1.1275=112.75$ — the
      exponent splits cleanly into a $0.06$ drift piece and a $0.06$ noise
      piece before exponentiating.
    interview: >
      "Solve $dS=\mu S\,dt+\sigma S\,dB$" is asked directly, and the
      interviewer wants "take logs" named immediately with the
      $-\sigma^{2}/2$ correction appearing unprompted. A frequent follow-up:
      why the arithmetic model $dS=\mu\,dt+\sigma\,dB$ can't be used for stock
      prices — because it allows negative prices.
    pitfalls: >
      Writing $S_t=S_0e^{\mu t+\sigma B_t}$ without the $-\sigma^{2}/2$
      correction is the single most common GBM error, and it overstates the
      log-growth rate. Treating $\mu$ as the growth rate of $S_t$ itself
      rather than of $\ln S_t$ confuses arithmetic and geometric rates.
    recap: >
      GBM solves by taking logs to $S_t=S_0\exp\left((\mu-\sigma^{2}/2)t
      +\sigma B_t\right)$, log-normal, always positive, with independent
      returns over disjoint periods.
    dialogue:
      - part: A guess from ordinary calculus
        teach: >
          A stock starts at $S_0 = 40$ and follows
          $dS_t = 0.1S_t\,dt + 0.3S_t\,dB_t$. Without the noise,
          $ds = 0.1s\,dt$ solves to $40e^{0.1t}$, so a colleague puts the noise
          into the exponent too and proposes
          $S_t = 40\exp\left(0.1t + 0.3B_t\right)$.
      - ask: >
          Test the guess. By Itô's lemma, $Y_t = 40\exp\left(0.1t + 0.3B_t\right)$
          has drift equal to some constant times $Y_t$. What is the constant?
        expects: "0.145"
        tolerance: 0.0001
        hint: >
          With $f(t,x) = 40e^{0.1t + 0.3x}$: $f_t = 0.1f$, $f_x = 0.3f$,
          $f_{xx} = 0.09f$.
        feedback: >
          Drift $= f_t + \frac{1}{2}f_{xx} = (0.1 + 0.045)\,Y_t = 0.145\,Y_t$,
          and the noise is $0.3\,Y_t$. So
          $dY_t = 0.145\,Y_t\,dt + 0.3\,Y_t\,dB_t$.
      - ask: >
          What is the verdict on the colleague's guess?
        choices:
          - text: >
              It is right: the extra $0.045$ is a second-order effect that
              vanishes in the limit.
            feedback: >
              $0.045$ is a drift rate, the same order as the $0.1$ it sits
              beside. Itô's convexity term never vanishes.
          - text: >
              It solves a different equation, one with drift $0.145S$: the
              exponent overshoots by $\sigma^{2}/2 = 0.045$.
            correct: true
            feedback: >
              Exponentiating noise adds drift, because $e^{x}$ is convex. The
              guess grows too fast by exactly that convexity bonus.
          - text: >
              It is right on average, though not path by path.
            feedback: >
              Two Itô processes are equal only if their coefficients match, and
              the drifts here are $0.145S$ and $0.1S$. The means differ too:
              one grows like $e^{0.145t}$, the other like $e^{0.1t}$.
        feedback: >
          Noise in the exponent drags drift in with it. The exponent's
          $t$-coefficient has to pay that back.

      - part: Fixing the exponent
        reflect: >
          What should the coefficient of $t$ in the exponent be, and how does
          the log transform deliver it without any guessing?
        answer: >
          It must be $0.1 - 0.045 = 0.055$, so that the convexity bonus brings
          the drift back up to $0.1$. The log transform gets there directly:
          $d\ln S_t = \left(\mu - \frac{\sigma^{2}}{2}\right)dt + \sigma\,dB_t
          = 0.055\,dt + 0.3\,dB_t$, which integrates to
          $\ln S_t = \ln 40 + 0.055t + 0.3B_t$.
      - teach: >
          That is geometric Brownian motion, solved. For
          $dS_t = \mu S_t\,dt + \sigma S_t\,dB_t$ with $S_0 > 0$,
          $S_t = S_0\exp\left(\left(\mu - \frac{\sigma^{2}}{2}\right)t
          + \sigma B_t\right)$. So $\ln(S_t/S_0) \sim
          N\left(\left(\mu - \frac{\sigma^{2}}{2}\right)t, \sigma^{2}t\right)$
          and $S_t$ is log-normal. Three properties follow: $S_t > 0$ always;
          returns over disjoint periods are independent; and $\sigma$ is a
          proportional volatility.
      - ask: >
          Close the loop. Apply Itô's lemma to
          $40\exp\left(0.055t + 0.3B_t\right)$. Its drift is what multiple of
          itself?
        expects: "0.1"
        tolerance: 0.0001
        feedback: >
          $0.055 + \frac{1}{2}(0.09) = 0.055 + 0.045 = 0.1$, and the noise is
          $0.3$ times itself. It satisfies the original SDE, so it is the
          solution.

      - part: A price path by hand
        ask: >
          On one path, $B_2 = 0.5$. What is $S_2$, to two decimal places?
        expects: "51.88"
        tolerance: 0.01
        hint: >
          Exponent first: drift piece $0.055 \times 2$, noise piece
          $0.3 \times 0.5$.
        feedback: >
          $0.11 + 0.15 = 0.26$, so $S_2 = 40e^{0.26} \approx 40 \times 1.2969
          \approx 51.88$. The colleague's formula would have given
          $40e^{0.35} \approx 56.76$.
      - ask: >
          On a path with $B_1 = 0.5$ and $B_2 = 0.5$ — the noise went nowhere
          in the second year — what is $S_2/S_1$, to four decimal places?
        expects: "1.0565"
        tolerance: 0.0005
        feedback: >
          $S_2/S_1 = \exp\left(0.055 \times 1 + 0.3(B_2 - B_1)\right) = e^{0.055}
          \approx 1.0565$. With the noise flat, the price grows at the
          log-growth rate $\mu - \sigma^{2}/2$, not at $\mu$.
      - ask: >
          What does the second-year return $S_2/S_1$ depend on?
        choices:
          - text: >
              Only the increment $B_2 - B_1$.
            correct: true
            feedback: >
              $S_2/S_1 = \exp\left(0.055 + 0.3(B_2 - B_1)\right)$. Brownian
              increments over disjoint periods are independent, so the two
              years' returns are too.
          - text: >
              The level $S_1$: a stock that rallied has more room to fall.
            feedback: >
              $S_1$ cancels in the ratio. The model has no memory of the level;
              that is what proportional noise buys.
          - text: >
              The first-year move $B_1$, through the compounding.
            feedback: >
              Compounding multiplies the returns, it does not correlate them.
              $B_1$ appears in $S_1$, not in $S_2/S_1$.
        feedback: >
          Returns over disjoint periods are independent, and over equal
          periods they are identically distributed: GBM is a random walk in
          log-price.

      - part: What the formula guarantees
        ask: >
          Can this stock ever trade at or below $0$?
        choices:
          - text: >
              Yes, if $B_t$ falls far enough, say below $-200$.
            feedback: >
              Then $S_t = 40e^{\text{(something very negative)}}$, tiny but
              positive. An exponential never reaches $0$.
          - text: >
              No: $S_t$ is $40$ times an exponential, which is always
              positive.
            correct: true
            feedback: >
              Positivity is built into the solution. It rests on $S_0 > 0$:
              started at $0$, the equation has the solution $S_t = 0$ forever.
          - text: >
              Only after a long enough time, as the drift term runs out.
            feedback: >
              Nothing runs out. At every $t$ the price is an exponential times
              $40$.
        feedback: >
          A price that can approach $0$ but never cross it: one reason GBM is
          the default model for a stock.
      - ask: >
          With $\sigma = 0.3$, the noise term is $0.3S_t\,dB_t$. At
          $S_t = 400$, how many price units of noise is that per unit of
          $dB$?
        expects: "120"
        feedback: >
          $0.3 \times 400 = 120$, against $12$ at $S_t = 40$. The same $\sigma$
          means ten times the absolute noise at ten times the price: $\sigma$ is
          quoted in percent, which is how traders quote vol.
      - teach: >
          Asked to solve $dS = \mu S\,dt + \sigma S\,dB$, say "take logs" in
          the first breath, write $\mu - \sigma^{2}/2$ before anyone asks for
          it, and finish with the closed form and the word log-normal.

  - node: quant-processes.ito.gbm-moments
    hook: >
      "Is the expected price above or below the median" sounds like a trick
      question until you know GBM is lognormal — then it's one line, and
      getting it backwards on the spot is an easy tell.
    explanation: >
      For a lognormal $Y=e^{X}$ with $X\sim N(\mu_X,\sigma_X^{2})$, the mean is
      $e^{\mu_X+\sigma_X^{2}/2}$. Here $\ln(S_t/S_0)$ is normal with mean
      $(\mu-\sigma^{2}/2)t$ and variance $\sigma^{2}t$, so
      $\mathbb{E}[S_t]/S_0 = \exp\left((\mu-\sigma^{2}/2)t + \sigma^{2}t/2
      \right)=e^{\mu t}$ — the $-\sigma^{2}/2$ in the exponent and the
      $+\sigma^{2}/2$ lognormal correction cancel exactly.

      The median of a lognormal is $e^{\mu_X}$, the underlying normal's mean
      exponentiated with no correction, since exponentiation is monotone. So
      $\operatorname{median}(S_t) = S_0e^{(\mu-\sigma^{2}/2)t}$, strictly
      below the mean by the factor $e^{\sigma^{2}t/2}>1$ whenever $\sigma>0$:
      a handful of extreme high outcomes drag the mean up without moving where
      most paths actually land.

      Standardizing $\ln(S_t/S_0)$ gives $\Pr(S_t>S_0) =
      \Phi\left(\frac{(\mu-\sigma^{2}/2)\sqrt{t}}{\sigma}\right)$ directly. The
      threshold that matters is $\mu$ versus $\sigma^{2}/2$, not $\mu$ versus
      $0$ — whenever $\mu<\sigma^{2}/2$, more than half the probability mass
      sits below the starting price even though the expected price is above
      it.
    worked: >
      Take $\mu=0.1$, $\sigma=0.3$, $t=2$. The mean growth factor is
      $e^{\mu t}=e^{0.2}\approx 1.221$, while the median growth factor is
      $e^{(\mu-\sigma^{2}/2)t}=e^{0.11}\approx 1.116$ — a real gap even over
      two years. The probability the price ends above its start is
      $\Phi\left(\frac{0.055\sqrt{2}}{0.3}\right)=\Phi(0.259)\approx 0.602$,
      comfortably above half since $\mu=0.1$ still exceeds $\sigma^{2}/2=0.045$.
    interview: >
      "Is the median of GBM above or below the mean" checks the lognormal-skew
      intuition — say below, and name the exact factor $e^{\sigma^{2}t/2}$
      separating them. A sharper version gives $\mu<\sigma^{2}/2$ and asks
      whether the price is more likely up or down — more likely down, despite
      positive expected drift.
    pitfalls: >
      Quoting $\mathbb{E}[S_t]=S_0e^{(\mu-\sigma^{2}/2)t}$ confuses the mean
      with the median — the mean has no $-\sigma^{2}/2$ at all, it cancels
      exactly. Assuming $\Pr(S_t>S_0)>1/2$ whenever $\mu>0$ ignores that the
      correct threshold is $\mu>\sigma^{2}/2$.
    recap: >
      GBM's mean is $S_0e^{\mu t}$ and its median is
      $S_0e^{(\mu-\sigma^{2}/2)t}$, strictly lower — a thin right tail pulls
      the average above where most paths actually land.
    dialogue:
      - part: Up or down after a year
        teach: >
          A stock at $S_0 = 100$ follows geometric Brownian motion with
          $\mu = 0.05$ and $\sigma = 0.4$. A trader says: "Expected return is
          $5\%$, so it is more likely to be up than down in a year." Here
          $\ln(S_1/100) \sim N(0.05 - 0.08, 0.16) = N(-0.03, 0.16)$.
      - ask: >
          Using the log-normal mean, $\mathbb{E}\left[e^{X}\right] = e^{m + v/2}$
          for $X \sim N(m, v)$, what is $\mathbb{E}[S_1]$, to two decimal
          places?
        expects: "105.13"
        tolerance: 0.01
        feedback: >
          $100e^{-0.03 + 0.16/2} = 100e^{0.05} \approx 105.13$. The trader's
          $5\%$ is right about the mean.
      - ask: >
          What is the median of $S_1$, to two decimal places?
        expects: "97.04"
        tolerance: 0.01
        hint: >
          The exponential is increasing, so the median of $e^{X}$ is $e$ to the
          median of $X$.
        feedback: >
          The median of $N(-0.03, 0.16)$ is $-0.03$, so the median of $S_1$ is
          $100e^{-0.03} \approx 97.04$: below where the stock started.
      - ask: >
          So is the stock more likely to be up or down in a year?
        choices:
          - text: >
              Up: the expected price is $105.13$, above $100$.
            feedback: >
              The mean says nothing about which side most of the probability
              sits on. Half the mass lies below the median, $97.04$, and that
              is already below $100$.
          - text: >
              Down: the median, $97.04$, is below $100$, so more than half the
              paths finish below the start.
            correct: true
            feedback: >
              Positive expected return, and still more likely to lose. The mean
              is held up by a minority of large gains.
          - text: >
              Even odds: a fair Brownian driver goes up or down equally often.
            feedback: >
              $B_1$ is symmetric, but $\ln S_1$ also carries the drift
              $\mu - \sigma^{2}/2 = -0.03$, which tilts the odds downward.
        feedback: >
          The trader confused the mean with the typical outcome.

      - part: Mean, median, and the gap between them
        reflect: >
          The mean is $100e^{0.05}$ and the median $100e^{-0.03}$. What exactly
          separates them, as a factor, and why must a log-normal's mean sit
          above its median?
        answer: >
          The factor is $e^{0.08} = e^{\sigma^{2}t/2}$: the log-normal mean
          adds half the variance of the log to the exponent, and the median
          does not. The distribution has a long right tail — a price can at
          most lose $100$ but can gain without limit — so a few large outcomes
          pull the average up without moving the middle. Note the mean has no
          $-\sigma^{2}/2$ in it at all: the one in the GBM exponent is exactly
          cancelled.
      - teach: >
          For $S_t = S_0\exp\left((\mu - \sigma^{2}/2)t + \sigma B_t\right)$:
          $\mathbb{E}[S_t] = S_0e^{\mu t}$, so $\mu$ is the expected rate of
          return. The median is $S_0e^{(\mu - \sigma^{2}/2)t}$, below the mean
          by $e^{\sigma^{2}t/2}$. The variance is
          $S_0^{2}e^{2\mu t}\left(e^{\sigma^{2}t} - 1\right)$. Standardizing
          the log gives $\Pr(S_t > S_0)
          = \Phi\left(\frac{(\mu - \sigma^{2}/2)\sqrt{t}}{\sigma}\right)$, which
          is below $1/2$ whenever $\mu < \sigma^{2}/2$.
      - ask: >
          For the stock above, what is $\Pr(S_1 > 100)$, to four decimal
          places? Use $\Phi(-0.075) \approx 0.4701$.
        expects: "0.4701"
        tolerance: 0.0005
        feedback: >
          $(0.05 - 0.08)\sqrt{1}/0.4 = -0.075$, so the probability is
          $\Phi(-0.075) \approx 0.4701$. Just under a coin flip.
      - ask: >
          What is the standard deviation of $S_1$, to the nearest whole number?
        expects: "44"
        tolerance: 0.5
        hint: >
          $\operatorname{Var}(S_1) = 100^{2}e^{0.1}\left(e^{0.16} - 1\right)$.
        feedback: >
          $10000 \times 1.1052 \times 0.1735 \approx 1917.6$, and
          $\sqrt{1917.6} \approx 43.8$. A one-year standard deviation of about
          $44$ on a $100$ stock: the spread is large next to the gap between
          mean and median, which is why the skew is easy to miss.

      - part: Stretching the horizon
        ask: >
          Same stock, ten years out. By what factor does the mean of $S_{10}$
          exceed its median, to four decimal places?
        expects: "2.2255"
        tolerance: 0.0005
        feedback: >
          $e^{\sigma^{2}t/2} = e^{0.08 \times 10} = e^{0.8} \approx 2.2255$. The
          mean is $100e^{0.5} \approx 164.87$; the median is
          $100e^{-0.3} \approx 74.08$.
      - ask: >
          What is $\Pr(S_{10} > 100)$, to four decimal places? Use
          $\Phi(-0.2372) \approx 0.4063$.
        expects: "0.4063"
        tolerance: 0.0005
        feedback: >
          $-0.03\sqrt{10}/0.4 \approx -0.2372$, so the probability is about
          $0.4063$. Over the longer horizon the mean rises and the chance of
          being up falls.
      - ask: >
          As $t \to \infty$, what happens to $\Pr(S_t > S_0)$ for this stock?
        choices:
          - text: >
              It tends to $1/2$, since the noise grows and swamps the drift.
            feedback: >
              The drift of the log grows like $t$ and its standard deviation
              only like $\sqrt{t}$. The ratio $(\mu - \sigma^{2}/2)\sqrt{t}/\sigma$
              runs off to $-\infty$.
          - text: >
              It tends to $1$, because the expected price grows without bound.
            feedback: >
              The mean does grow like $e^{0.05t}$, carried by ever rarer
              enormous outcomes. The typical path follows the median, which
              shrinks like $e^{-0.03t}$.
          - text: >
              It tends to $0$: since $\mu < \sigma^{2}/2$, the argument of
              $\Phi$ goes to $-\infty$.
            correct: true
            feedback: >
              Almost every path eventually ends below $100$, while the mean
              heads to infinity. With $\mu > \sigma^{2}/2$ the same argument
              sends the probability to $1$.
        feedback: >
          The threshold is $\mu$ against $\sigma^{2}/2$, not $\mu$ against $0$.
          Asked whether the median of GBM is above or below the mean, say
          below, by the factor $e^{\sigma^{2}t/2}$.

  - node: quant-processes.ito.vol-drag
    hook: >
      Position sizing and leverage decisions live or die on this gap between
      arithmetic and geometric returns — a strategy can have positive expected
      return and still go broke almost surely.
    explanation: >
      A percentage loss requires a larger percentage gain to fully recover,
      because the base has shrunk — symmetric percentage swings are not
      symmetric in dollar terms, and repeated compounding of such swings
      erodes wealth even when the arithmetic average of the swings is exactly
      zero.

      The continuous-time version of that asymmetry is exactly the
      $-\sigma^{2}/2$ term already derived when taking logs of GBM: the
      arithmetic drift $\mu$ describes the average one-step return, but the
      log-growth rate that actually compounds over many periods is
      $\mu-\sigma^{2}/2$, strictly lower whenever $\sigma>0$.

      Two consequences follow. If $\sigma^{2}/2$ exceeds $\mu$, the log-growth
      rate is negative even though the arithmetic drift $\mu$ is positive — the
      process trends to zero path by path while its expectation still grows,
      dragged up by a thin tail of rare huge outcomes, the same mean-above-
      median asymmetry pushed to an extreme. And sizing a bet to maximize
      expected return rather than expected log return is a mistake, since the
      two criteria are optimized by different amounts of risk.
    worked: >
      Compound $+20\%$ then $-20\%$: wealth goes $1\to1.2\to0.96$, a net
      $4\%$ loss despite an arithmetic average return of exactly $0$. The
      average log return is $\frac{1}{2}(\ln 1.2+\ln 0.8) = \frac{1}{2}\ln
      0.96\approx -0.0204$ per period — a smaller penalty than the $\pm 50\%$
      case, since the drag grows with the square of the swing size.
    interview: >
      "A strategy returns $+50\%$ half the time and $-50\%$ half the time —
      is it a good bet" wants the geometric mean computed ($\sqrt{0.75}
      \approx 0.866$, a loss), not just the arithmetic average of $0$. A
      follow-up asks for the exact condition under which such a bet goes
      broke — $\sigma^{2}/2$ exceeding the arithmetic drift $\mu$.
    pitfalls: >
      Judging a volatile strategy by its arithmetic mean alone misses that
      what compounds is the geometric mean, always lower once volatility is
      nonzero. Assuming "positive expected return" guarantees eventual growth
      ignores that expectation and almost-sure behavior diverge once
      $\sigma^{2}/2>\mu$.
    recap: >
      A volatile position compounds at $\mu-\sigma^{2}/2$, not $\mu$ —
      volatility is a direct, quadratic tax on long-run wealth that can flip a
      positive-expectation bet into one that loses almost surely.
    dialogue:
      - part: A bet with a positive edge
        teach: >
          Each round, a fair coin decides whether your whole stake gains $60\%$
          or loses $40\%$. You reinvest everything, every round.
      - ask: >
          What is your expected wealth multiplier for one round?
        expects: "1.1"
        feedback: >
          $\frac{1}{2}(1.6) + \frac{1}{2}(0.6) = 1.1$: a $10\%$ expected return
          per round. On the face of it, a bet to take.
      - ask: >
          Over two rounds you win once and lose once, in either order. What is
          your wealth multiplier?
        expects: "0.96"
        feedback: >
          $1.6 \times 0.6 = 0.96$, and $0.6 \times 1.6$ is the same. One win
          and one loss leave you $4\%$ down, though the two returns average
          $+10\%$.
      - ask: >
          After $100$ rounds the typical player has about $50$ wins and $50$
          losses. What is that player's wealth multiplier, to three decimal
          places?
        expects: "0.130"
        tolerance: 0.001
        hint: >
          Fifty win-loss pairs, each worth $0.96$.
        feedback: >
          $0.96^{50} \approx 0.130$: the typical player has lost $87\%$ of the
          stake.
      - ask: >
          Yet the expected multiplier after $100$ rounds is
          $1.1^{100} \approx 13781$. How can both numbers be right?
        choices:
          - text: >
              They cannot; one of the computations has an error.
            feedback: >
              Both are exact. Expectations multiply across independent rounds,
              so the mean really is $1.1^{100}$, and $50$ wins with $50$ losses
              really is $0.96^{50}$.
          - text: >
              The mean is carried by rare runs with far more wins than losses;
              the typical path does much worse.
            correct: true
            feedback: >
              A player with $70$ wins and $30$ losses holds
              $1.6^{70} \times 0.6^{30}$, an astronomically large number, and
              players like that hold up the average almost alone.
          - text: >
              The mean only applies over very long horizons, so it overtakes
              the typical path eventually.
            feedback: >
              It is the other way round: the longer you play, the further the
              typical path falls below the mean, and the more surely you go
              broke.
        feedback: >
          The mean of a compounding bet and the fate of the typical player are
          different questions.

      - part: What actually compounds
        reflect: >
          Wealth after many rounds is a product of multipliers. What
          per-round quantity actually sets its long-run growth rate, and why is
          it lower than the average return whenever the outcomes vary?
        hint: >
          Products become sums under a logarithm.
        answer: >
          The average *log* return. $\ln(\text{wealth})$ is a sum of
          per-round log returns, so by the law of large numbers it grows at
          $\frac{1}{2}(\ln 1.6 + \ln 0.6) = \frac{1}{2}\ln 0.96 \approx -0.0204$
          per round. Because $\ln$ is concave, the average of the logs sits
          below the log of the average, $\ln 1.1$, and the gap widens with
          the spread of the outcomes. A loss shrinks the base that the next gain
          compounds on.
      - teach: >
          That gap is volatility drag. For returns with mean $\mu$ and
          volatility $\sigma$, the compound growth rate is about
          $\mu - \sigma^{2}/2$; for geometric Brownian motion it is exactly
          that: $\ln S_t$ grows at $\mu - \sigma^{2}/2$ while $\mathbb{E}[S_t]$
          grows at $\mu$. It is the Itô term from taking logs, and it is
          Jensen's inequality for the concave $\ln$. Volatility is a tax on
          compounded wealth, quadratic in $\sigma$.
      - ask: >
          Test the approximation on the coin bet: per round the return has
          mean $0.1$ and standard deviation $0.5$. What does
          $\mu - \sigma^{2}/2$ give?
        expects: "-0.025"
        tolerance: 0.0001
        feedback: >
          $0.1 - 0.25/2 = -0.025$, against the exact $-0.0204$. Close, and
          right in sign: the approximation is second order in the swing size,
          and it becomes exact in continuous time.

      - part: Volatility as a tax
        ask: >
          A leveraged fund follows geometric Brownian motion with $\mu = 0.1$
          and $\sigma = 0.6$. What is its long-run growth rate?
        expects: "-0.08"
        tolerance: 0.0001
        feedback: >
          $0.1 - 0.36/2 = -0.08$. The fund's expected value grows at $10\%$ a
          year, and almost every path goes to zero at $8\%$ a year.
      - ask: >
          Halve the leverage: $\mu = 0.05$ and $\sigma = 0.3$. What is the
          long-run growth rate now?
        expects: "0.005"
        tolerance: 0.0001
        feedback: >
          $0.05 - 0.09/2 = 0.005$. Halving leverage halves $\mu$ but quarters
          $\sigma^{2}/2$, so less leverage grows *faster*. Past some size,
          adding risk lowers compound growth.
      - ask: >
          A colleague concludes: "So a more volatile stock has a lower expected
          future price." Where does the intuition go too far?
        choices:
          - text: >
              It does not: higher $\sigma$ lowers everything about the future
              price.
            feedback: >
              $\mathbb{E}[S_t] = S_0e^{\mu t}$ contains no $\sigma$ at all. Raise
              $\sigma$ with $\mu$ fixed and the mean is unchanged.
          - text: >
              The drag hits the median and the typical path, $S_0e^{(\mu
              - \sigma^{2}/2)t}$; the mean, $S_0e^{\mu t}$, is untouched.
            correct: true
            feedback: >
              Volatility moves probability mass down and stretches the right
              tail out, leaving the average where $\mu$ put it. The drag is
              about what you will probably hold, not what you hold on
              average.
          - text: >
              The drag is a discrete-time effect that disappears in continuous
              time.
            feedback: >
              Continuous time is where it is exact: $d\ln S_t
              = (\mu - \sigma^{2}/2)\,dt + \sigma\,dB_t$.
        feedback: >
          Mean return and compound growth are different numbers, and volatility
          drives them apart.
      - teach: >
          Asked whether a $+60\%$ / $-40\%$ coin is a good bet to repeat with
          everything, answer with the geometric mean, $\sqrt{0.96} \approx
          0.98$ per round, not the arithmetic $1.1$. The fix is sizing: stake a
          fraction chosen to maximize expected log growth, not expected
          return.

  - node: quant-processes.ito.arithmetic-vs-geometric
    hook: >
      Defaulting to GBM for anything that can legitimately go negative — a
      rate spread, a P&L, an inventory position — is a modeling error
      interviewers plant deliberately.
    explanation: >
      Reading off coefficients the same way as any SDE, $dS_t=\mu\,dt+\sigma
      \,dB_t$ has constant $a=\mu$ and $b=\sigma$: no state-dependence at all.
      There is no nonlinear transform being applied to get $S_t$ itself, so no
      Itô correction ever appears — the equation integrates directly to
      $S_t=S_0+\mu t+\sigma B_t$, exactly normal by Brownian motion's own
      distributional property.

      Exact normality has a real consequence: $S_t\sim N(S_0+\mu t,
      \sigma^{2}t)$ can take negative values with probability
      $\Phi\left(\frac{-(S_0+\mu t)}{\sigma\sqrt{t}}\right)$, however small
      that probability might be for reasonable parameters.

      The modeling choice is between additive and proportional noise. A
      spread or rate difference has volatility that means the same thing in
      absolute terms regardless of level — a $1$bp move is a $1$bp move
      whether the spread sits at $5$bp or $50$bp — which is what arithmetic
      dynamics captures and GBM's proportional noise does not. Oil futures
      printing negative in April 2020 is the sharpest reminder that "prices
      can't go negative" is an assumption about the underlying quantity, not
      a law of nature.
    worked: >
      Take a spread following $dS_t=0\,dt+1.5\,dB_t$ starting at $S_0=2$.
      After $t=1$, $S_1\sim N(2, 1.5^{2})$, so $\Pr(S_1<0) =
      \Phi\left(\frac{-2}{1.5}\right)=\Phi(-1.333)\approx 0.091$ — a real
      $9.1\%$ chance the spread crosses zero within a year, exactly the
      behavior a spread trader needs the model to allow.
    interview: >
      "Would you model this rate spread with GBM or arithmetic Brownian
      motion" is answered by checking whether the quantity can legitimately
      cross zero — spreads get arithmetic, prices get geometric. A sharp
      follow-up cites the 2020 negative oil futures print as the real-world
      case for taking the arithmetic model seriously.
    pitfalls: >
      Defaulting to GBM for any "price-like" quantity without checking
      whether negative values are physically meaningful is exactly the error
      being probed for. Comparing an arithmetic $\sigma$ directly to a GBM
      $\sigma$ mixes units — dollars per $\sqrt{\text{time}}$ against percent
      per $\sqrt{\text{time}}$.
    recap: >
      Arithmetic Brownian motion $S_t=S_0+\mu t+\sigma B_t$ needs no Itô
      correction and stays exactly normal — right whenever the quantity can
      genuinely cross zero, wrong for anything that must stay positive.
    dialogue:
      - part: Two desks, one spread
        teach: >
          A spread between two futures contracts sits at $S_0 = 5$. Desk A
          models it as $dS_t = 0.4S_t\,dB_t$, geometric with $40\%$
          volatility. Desk B models it as $dS_t = 2\,dB_t$, with $2$ units of
          absolute volatility. Neither has drift.
      - ask: >
          At $S = 5$, how many units of noise per unit of $dB$ does desk A's
          model carry?
        expects: "2"
        feedback: >
          $0.4 \times 5 = 2$, exactly desk B's number. Today the two desks
          agree.
      - ask: >
          The spread falls to $0.5$. How much noise per unit of $dB$ does desk
          A's model carry now?
        expects: "0.2"
        feedback: >
          $0.4 \times 0.5 = 0.2$: desk A says the spread became ten times
          calmer as it approached zero. Desk B still says $2$. For a spread, a
          move of one unit is the same event at $0.5$ as at $5$, which is what
          desk B assumes.
      - ask: >
          Which desk's model lets the spread go below zero?
        choices:
          - text: >
              Neither: both models are driven by Brownian motion, which is
              symmetric.
            feedback: >
              Symmetric noise does not mean symmetric outcomes. Desk A's noise
              shrinks in proportion to the level, and its solution is an
              exponential, which never reaches $0$.
          - text: >
              Only desk B's.
            correct: true
            feedback: >
              Desk B's $S_1 = 5 + 2B_1 \sim N(5, 4)$, negative with
              probability $\Phi(-2.5) \approx 0.006$ after a year, and more
              over longer horizons. Desk A's spread is positive forever.
          - text: >
              Only desk A's, since its percentage moves compound.
            feedback: >
              Compounding percentage moves gives $S_0e^{(\ldots)}$, which stays
              positive. A $40\%$ drop from $0.5$ leaves $0.3$, not a negative
              number.
        feedback: >
          The two models differ only in how noise scales with the level, and
          that decides whether zero is a wall or just another number.

      - part: No transform, no correction
        reflect: >
          Desk B's equation is $dS_t = 2\,dB_t$; add a drift, $dS_t = \mu\,dt
          + \sigma\,dB_t$. Write $S_t$ exactly, and say why no Itô correction
          appears, when solving desk A's equation produced a $-\sigma^{2}/2$.
        answer: >
          $S_t = S_0 + \mu t + \sigma B_t$, read straight off the integral
          form: both integrands are constants. The $-\sigma^{2}/2$ in the
          geometric case came from applying Itô's lemma to $\ln x$, whose
          curvature turns noise into drift. Here no transform is needed, so
          no curvature, so no correction; and $S_t$ is exactly normal,
          $N(S_0 + \mu t, \sigma^{2}t)$.
      - teach: >
          This is the arithmetic, or Bachelier, model: $dS_t = \mu\,dt
          + \sigma\,dB_t$ integrates with no Itô correction to $S_t = S_0
          + \mu t + \sigma B_t$, exactly normal with variance $\sigma^{2}t$.
          Against geometric Brownian motion: $\sigma$ is absolute, in price
          units, not percent; there is no positivity, since the process
          visits negative values with positive probability; and shocks add
          rather than multiply.
      - ask: >
          A spread follows $dS_t = 0.5\,dt + 2\,dB_t$ from $S_0 = 5$. What is
          $\mathbb{E}[S_3]$?
        expects: "6.5"
        feedback: >
          $5 + 0.5 \times 3 = 6.5$. No $\sigma$ in the mean: with additive
          noise, the drift is the drift of the level itself.
      - ask: >
          Same spread. What is $\operatorname{Var}(S_3)$?
        expects: "12"
        feedback: >
          $\sigma^{2}t = 4 \times 3 = 12$, so $S_3 \sim N(6.5, 12)$ exactly. The
          variance grows linearly in time and does not care where the spread
          sits.
      - ask: >
          In this model the mean is $S_0 + \mu t$ and the median is the same.
          In geometric Brownian motion the median sits below the mean. What
          makes the difference?
        choices:
          - text: >
              A normal law is symmetric, so mean and median agree; the
              log-normal is skewed right.
            correct: true
            feedback: >
              Additive noise keeps the law symmetric. Multiplicative noise
              compounds, the exponential stretches the upside, and the mean
              runs ahead of the typical path.
          - text: >
              The arithmetic model has lower volatility.
            feedback: >
              Volatility here is in different units and can be made as large
              as you like; the mean still equals the median. The shape of the
              law is the difference, not its width.
          - text: >
              The arithmetic model has no drift.
            feedback: >
              It can have any drift $\mu$, as in the spread you just worked.
              Mean and median both move to $S_0 + \mu t$.
        feedback: >
          No volatility drag either: with additive shocks, nothing compounds,
          so nothing gets taxed.

      - part: Choosing between them
        ask: >
          For which quantity is arithmetic dynamics the natural default?
        choices:
          - text: >
              A large-cap stock price.
            feedback: >
              A stock cannot go below zero, and its moves scale with its
              price. That is the geometric model's home ground.
          - text: >
              The difference between two interest rates.
            correct: true
            feedback: >
              It can sit at zero or cross it, and a $10$ basis point move
              means the same thing wherever it starts. Additive noise fits.
          - text: >
              An exchange rate.
            feedback: >
              An exchange rate stays positive and moves in percent; the usual
              model is geometric.
        feedback: >
          Ask whether the quantity can legitimately cross zero. Oil futures
          printing negative in April 2020 is the standing reminder that "a
          price cannot be negative" is an assumption about the quantity.
      - ask: >
          Desk A quotes a volatility of $0.4$ and desk B of $2$. A manager
          concludes desk B sees five times as much risk. What is wrong?
        choices:
          - text: >
              Nothing: $2$ is five times $0.4$.
            feedback: >
              The two numbers are in different units, percent against price
              units. At $S = 5$ they describe exactly the same noise,
              $0.4 \times 5 = 2$.
          - text: >
              The units differ: an absolute vol is roughly a percentage vol
              times the level, and at $S = 5$ the two agree.
            correct: true
            feedback: >
              Convert before comparing: $\sigma_{\text{abs}} \approx
              \sigma_{\text{pct}} \times S$. The comparison only holds near the
              level where you converted.
          - text: >
              Desk B's number must be divided by $\sqrt{5}$ first.
            feedback: >
              The conversion is by the level $S$, not its square root: the
              geometric noise term is $\sigma S\,dB$.
        feedback: >
          Arithmetic vol is quoted in price units, geometric vol in percent.
      - teach: >
          In an interview, "GBM or arithmetic?" is answered by asking whether
          the quantity can cross zero and whether its moves scale with its
          level. Prices of stocks: geometric. Spreads, rate differences, P&L:
          arithmetic.

  - node: quant-processes.ito.driftless-martingale
    hook: >
      "Is this discounted price process a martingale" comes up constantly in
      derivatives interviews, and the entire answer is a glance at the $dt$
      coefficient — no expectation needs to be computed by hand.
    explanation: >
      The Itô integral term $\int_0^t b_s\,dB_s$ is itself always a mean-zero
      martingale, a direct consequence of adaptedness. An Itô process
      $X_t=X_0+\int_0^t a_s\,ds+\int_0^t b_s\,dB_s$ is the sum of an
      accumulating deterministic-looking piece and that martingale piece — if
      $a_t\equiv 0$, the entire process reduces to the martingale piece plus a
      constant, so it is a martingale outright with $\mathbb{E}[X_t]=X_0$ for
      every $t$.

      The converse holds too: a nonzero drift $a_t$ contributes a genuinely
      accumulating deterministic trend to $\int a_s\,ds$, which no martingale
      — whose expectation must stay flat at every fixed time — can carry. So
      an Itô process is a martingale exactly when its drift vanishes almost
      everywhere.

      The test is therefore entirely visual: write the process in $dt$/$dB$
      form using the same coefficient-reading skill from identifying any SDE,
      and check whether the $dt$ coefficient is identically zero. One caveat
      worth naming: without the integrability condition
      $\mathbb{E}\int_0^T b_s^{2}\,ds<\infty$, a driftless process is only a
      local martingale, and its expectation can genuinely drift over long
      horizons.
    worked: >
      Let $X_t=B_t^{(1)}$ and $Y_t=B_t^{(2)}$ be independent Brownian
      motions, and ask whether $X_tY_t$ is a martingale. The Itô product rule
      gives $d(X_tY_t)=X_t\,dY_t+Y_t\,dX_t+0\,dt$ since independence makes the
      correlation $0$ — the $dt$ coefficient is identically zero, so $X_tY_t$
      is a martingale, and $\mathbb{E}[X_tY_t]=X_0Y_0=0$ for every $t$.
    interview: >
      "Is $e^{B_t}$ a martingale" is a favorite trap — write $d(e^{B_t})$ via
      Itô, see the $\frac{1}{2}e^{B_t}\,dt$ term, and answer no; only
      $e^{\sigma B_t-\sigma^{2}t/2}$ has that term cancelled. The interviewer
      is checking that you read the coefficient rather than guessing from "no
      drift in $B_t$ itself."
    pitfalls: >
      Confusing "the underlying Brownian motion has no drift" with "the
      transformed process has no drift" — Itô's curvature term routinely
      reintroduces a nonzero $dt$ coefficient after a nonlinear transform.
      Skipping the integrability check on $b_t$ silently upgrades a merely
      local martingale to a full one.
    recap: >
      An Itô process is a martingale exactly when its $dt$ coefficient is
      identically zero — read it straight off the SDE, no expectation
      computation required.
    dialogue:
      - part: Is this game fair
        teach: >
          A market maker offers a contract whose value at time $t$ is
          $V_t = e^{B_t}$, with $B$ a standard Brownian motion started at $0$,
          so $V_0 = 1$. "The factor has no drift," she says, "so the contract
          is a fair game: its expected future value is its value now."
      - ask: >
          What is $\mathbb{E}[V_2]$, to four decimal places?
        expects: "2.7183"
        tolerance: 0.0005
        hint: >
          For $Z \sim N(0, v)$, $\mathbb{E}\left[e^{Z}\right] = e^{v/2}$.
        feedback: >
          $B_2 \sim N(0, 2)$, so $\mathbb{E}\left[e^{B_2}\right] = e^{1}
          \approx 2.7183$. A contract worth $1$ today is expected to be worth
          $2.72$ in two years. Not a fair game.
      - ask: >
          Apply Itô's lemma to $V_t = e^{B_t}$. At an instant when
          $B_t = 0$, what is the coefficient of $dt$?
        expects: "0.5"
        feedback: >
          $f' = f'' = e^{x}$, so $dV_t = \frac{1}{2}e^{B_t}\,dt + e^{B_t}\,dB_t$.
          At $B_t = 0$ the $dt$ coefficient is $\frac{1}{2}$.
      - ask: >
          Where did the market maker's argument go wrong?
        choices:
          - text: >
              It did not: the expected value grows only because of rare large
              paths, and those do not count.
            feedback: >
              Expectation counts every path. $\mathbb{E}[V_2] = e \ne 1$ is the
              answer to her own question.
          - text: >
              $B$ has no drift, but $e^{B}$ does: Itô's convexity term puts
              $\frac{1}{2}e^{B_t}\,dt$ into the dynamics of the contract.
            correct: true
            feedback: >
              Fairness is a property of the process you hold, not of the factor
              underneath. A nonlinear payoff picks up a $dt$ term from
              curvature.
          - text: >
              $B$ itself is not a fair game, because its variance grows.
            feedback: >
              Growing variance does not stop $B$ being a martingale:
              $\mathbb{E}[B_t \mid \text{past}]$ is the current value. It is
              $e^{B}$ that fails.
        feedback: >
          The $dt$ coefficient of the contract decides it, and here it is
          $\frac{1}{2}V_t > 0$.

      - part: What fairness looks like in an SDE
        reflect: >
          Write a process as $dX_t = a_t\,dt + b_t\,dB_t$. What must be true of
          $a_t$ for $X$ to be a fair game, and why can the $dB$ part never
          spoil fairness on its own?
        hint: >
          What do you know about the mean of an Itô integral, conditionally on
          the past?
        answer: >
          The $dB$ part is an Itô integral, $\int b_s\,dB_s$: each piece is a
          stake known in advance times a fresh mean-zero increment, so it is a
          martingale. Whatever is left, $\int a_s\,ds$, is the only thing that
          can move the conditional mean. So $X$ is a martingale when
          $a_t \equiv 0$, and a nonzero drift accumulates into a trend no
          martingale can carry.
      - teach: >
          So: let $dX_t = a_t\,dt + b_t\,dB_t$ with
          $\mathbb{E}\int_0^T b_s^{2}\,ds < \infty$. If $a_t \equiv 0$, then $X$
          is a square-integrable martingale on $[0,T]$ and
          $\mathbb{E}[X_t] = X_0$. Conversely, an Itô process that is a
          martingale has $a_t = 0$ for almost every $t$. The test is visual:
          read off the $dt$ coefficient. $B_t^{2} - t$ passes, because Itô
          cancels its $dt$; $e^{B_t}$ fails.
      - ask: >
          Repair a contract on $e^{0.8B_t}$: for which constant $c$ is
          $e^{0.8B_t - ct}$ a martingale?
        expects: "0.32"
        tolerance: 0.0001
        hint: >
          Find the $dt$ coefficient as a multiple of the process, and set it
          to $0$.
        feedback: >
          With $f(t,x) = e^{0.8x - ct}$: $f_t = -cf$ and
          $\frac{1}{2}f_{xx} = \frac{1}{2}(0.64)f = 0.32f$. The drift is
          $(0.32 - c)f$, zero at $c = 0.32 = \sigma^{2}/2$. This is the
          exponential martingale, geometric Brownian motion with $\mu = 0$.

      - part: The discounted price
        ask: >
          Under a pricing model a stock follows $dS_t = 0.03S_t\,dt
          + 0.2S_t\,dB_t$ from $S_0 = 50$, and the discounted price is
          $D_t = e^{-0.03t}S_t$. What is the $dt$ coefficient of $dD_t$?
        expects: "0"
        hint: >
          $e^{-0.03t}$ has no noise, so $dD_t = e^{-0.03t}\,dS_t
          - 0.03e^{-0.03t}S_t\,dt$.
        feedback: >
          $e^{-0.03t}(0.03S_t\,dt + 0.2S_t\,dB_t) - 0.03e^{-0.03t}S_t\,dt
          = 0.2D_t\,dB_t$. The discount factor eats the drift exactly.
      - ask: >
          So what is $\mathbb{E}[D_5]$?
        expects: "50"
        feedback: >
          No $dt$ term, and $0.2D_t$ is square-integrable, so $D$ is a
          martingale: $\mathbb{E}[D_5] = D_0 = 50$. No expectation computed by
          hand.
      - ask: >
          And $\mathbb{E}[S_5]$, to two decimal places?
        expects: "58.09"
        tolerance: 0.01
        feedback: >
          $S_5 = e^{0.15}D_5$, so $\mathbb{E}[S_5] = 50e^{0.15} \approx 58.09$.
          The stock itself is not a martingale; its discounted price is, and
          that is the statement pricing rests on.

      - part: When "no drift" is not enough
        ask: >
          A process satisfies $dX_t = -X_t^{2}\,dB_t$ with $X_0 = 1$. It has no
          $dt$ term. Can you conclude $\mathbb{E}[X_t] = 1$ for every $t$?
        choices:
          - text: >
              Yes: no $dt$ coefficient means martingale, always.
            feedback: >
              The theorem needs $\mathbb{E}\int_0^T b_s^{2}\,ds < \infty$ as
              well. Here $b = -X^{2}$, and $X$ has heavy enough excursions for
              that integral to be infinite.
          - text: >
              No: the noise coefficient $X_t^{2}$ grows too fast for the
              integrability condition, so $X$ is only a local martingale, and
              in fact its mean falls below $1$.
            correct: true
            feedback: >
              This is a strict local martingale: driftless, yet
              $\mathbb{E}[X_t] < 1$ for every $t > 0$. The integrability clause
              is exactly what rules it out of the theorem.
          - text: >
              No: a process with a random noise coefficient is never a
              martingale.
            feedback: >
              $D_t$ above had the random coefficient $0.2D_t$ and was a
              martingale. Random is fine; too large is the problem.
        feedback: >
          Read off the $dt$ coefficient, then check the integrability of the
          $dB$ coefficient. For bounded or linearly growing coefficients over a
          finite horizon, the check passes.
      - teach: >
          Asked "is $e^{B_t}$ a martingale?", write $d(e^{B_t})$, point at
          $\frac{1}{2}e^{B_t}\,dt$, and say no — then give the fix,
          $e^{\sigma B_t - \sigma^{2}t/2}$, whose $dt$ term cancels.

  - node: quant-processes.ito.ou
    hook: >
      "Model a mean-reverting spread" is one of the most common SDE-design
      prompts in a quant interview, and the OU process, plus the one algebra
      trick that solves it, is the expected answer.
    explanation: >
      The drift $\theta(m-X_t)$ always points toward the level $m$ with force
      proportional to the current displacement — a linear restoring force,
      like a spring — while the diffusion $\sigma$ stays constant, so noise
      keeps knocking the process off target while the drift keeps pulling it
      back.

      The load-bearing step is the integrating factor $Y_t=e^{\theta t}
      (X_t-m)$, a time-dependent transform of $X_t$. Applying Itô's lemma with
      $f(t,x)=e^{\theta t}(x-m)$ gives $f_t=\theta e^{\theta t}(x-m)$,
      $f_x=e^{\theta t}$, $f_{xx}=0$, so $dY_t = \left[\theta e^{\theta
      t}(X_t-m) + \theta(m-X_t)e^{\theta t}\right]dt + \sigma e^{\theta
      t}\,dB_t$. The two bracketed terms are exact negatives and cancel
      completely — the exponential weight was chosen precisely to kill the
      drift, leaving $dY_t=\sigma e^{\theta t}\,dB_t$.

      With no drift left, $Y_t$ integrates directly:
      $Y_t=Y_0+\sigma\int_0^te^{\theta s}\,dB_s$. Unwinding
      $Y_t=e^{\theta t}(X_t-m)$ gives $X_t=m+(X_0-m)e^{-\theta t}+\sigma
      \int_0^te^{-\theta(t-s)}\,dB_s$. The mean decays exponentially to $m$ at
      rate $\theta$, and a noise integral accumulates on top with weights that
      fade the further back in time they occurred; $X_t$ is Gaussian because
      it's a linear transform of Brownian increments.
    worked: >
      Take $\theta=2$, $m=5$, $X_0=8$. The mean at $t=1$ is
      $\mathbb{E}[X_1]=5+(8-5)e^{-2}=5+3(0.1353)\approx 5.406$ — more than
      three-quarters of the initial $3$-unit gap to the mean has already
      decayed away within one time unit, since $\theta=2$ makes reversion
      fast.
    interview: >
      "Write an SDE for a mean-reverting spread and solve it" is answered by
      naming the OU form, then the integrating-factor substitution $Y_t
      =e^{\theta t}(X_t-m)$ specifically — reciting the closed form without
      producing that trick reads as memorized. A common follow-up asks what
      happens as $\theta\to\infty$ (reversion becomes instantaneous) or
      $\theta\to 0$ (OU degenerates to plain Brownian motion).
    pitfalls: >
      Guessing the integrating factor as $e^{-\theta t}$ instead of
      $e^{\theta t}$ flips the sign needed to cancel the drift term — check
      that the two $dt$ terms actually cancel before trusting the result.
      Forgetting that $X_t$ stays Gaussian for all $t$, not just
      asymptotically, misses that the solution is exact.
    recap: >
      The OU process solves by the integrating factor $Y_t=e^{\theta
      t}(X_t-m)$, which cancels the drift exactly, giving $X_t=m+(X_0-m)
      e^{-\theta t}+\sigma\int_0^te^{-\theta(t-s)}\,dB_s$.
    dialogue:
      - part: A spread that comes back
        teach: >
          A pairs-trading spread sits at $X_0 = 4$; its long-run level is $1$.
          The desk proposes $dX_t = 0.5(1 - X_t)\,dt + 0.3\,dB_t$.
      - ask: >
          What is the drift of $X$ at $X = 4$?
        expects: "-1.5"
        feedback: >
          $0.5(1 - 4) = -1.5$: a push down, toward $1$.
      - ask: >
          And at $X = 0$?
        expects: "0.5"
        feedback: >
          $0.5(1 - 0) = 0.5$: a push up, again toward $1$. The drift always
          points at the level, with strength proportional to the distance from
          it, like a spring.
      - ask: >
          Which of these also pulls back toward a fixed level?
        choices:
          - text: >
              $dX_t = 0.5X_t\,dt + 0.3\,dB_t$
            feedback: >
              The drift has the same sign as $X$, so it pushes the process
              *away* from $0$: above $0$ it is pushed up, below it is pushed
              down.
          - text: >
              $dX_t = 0.5\,dt + 0.3\,dB_t$
            feedback: >
              A constant push upward, wherever $X$ is. There is no level it
              returns to.
          - text: >
              $dX_t = 2(3 - X_t)\,dt + dB_t$
            correct: true
            feedback: >
              The drift is $2 \times$ (distance below $3$): positive below $3$,
              negative above it. Level $3$, pulled back at speed $2$.
        feedback: >
          What you are checking: a drift of the form $\theta(m - X)$ with
          $\theta > 0$, so it points toward $m$ and grows with the gap.
      - ask: >
          Take expectations of the desk's equation: the $dB$ term has mean $0$,
          so $\frac{d}{dt}\mathbb{E}[X_t] = 0.5\left(1 - \mathbb{E}[X_t]\right)$.
          What is $\mathbb{E}[X_2]$, to four decimal places?
        expects: "2.1036"
        tolerance: 0.0005
        hint: >
          The gap $\mathbb{E}[X_t] - 1$ obeys $g' = -0.5g$ with $g(0) = 3$.
        feedback: >
          The gap decays like $3e^{-0.5t}$, so
          $\mathbb{E}[X_2] = 1 + 3e^{-1} \approx 1 + 1.1036 = 2.1036$.

      - part: Solving it
        reflect: >
          The mean was easy; the process itself is harder, because the drift
          depends on $X$ and the equation cannot be integrated directly. For
          the ODE $g' = -0.5g$ you would multiply by $e^{0.5t}$. Try the same:
          what does Itô's lemma give for $Y_t = e^{0.5t}(X_t - 1)$, and what
          does that buy you?
        hint: >
          With $f(t,x) = e^{0.5t}(x - 1)$, $f_{xx} = 0$, so there is no Itô
          correction to worry about.
        answer: >
          $f_t = 0.5e^{0.5t}(x - 1)$, $f_x = e^{0.5t}$, so the drift of $Y$ is
          $0.5e^{0.5t}(X_t - 1) + e^{0.5t} \cdot 0.5(1 - X_t) = 0$, and
          $dY_t = 0.3e^{0.5t}\,dB_t$. With no drift, $Y$ integrates directly:
          $Y_t = 3 + 0.3\int_0^t e^{0.5s}\,dB_s$. Undo the factor:
          $X_t = 1 + 3e^{-0.5t} + 0.3\int_0^t e^{-0.5(t-s)}\,dB_s$.
      - teach: >
          That process is the Ornstein–Uhlenbeck process: the solution of
          $dX_t = \theta(m - X_t)\,dt + \sigma\,dB_t$ with $\theta > 0$. The
          integrating factor $e^{\theta t}(X_t - m)$ kills the drift, giving
          $X_t = m + (X_0 - m)e^{-\theta t}
          + \sigma\int_0^t e^{-\theta(t-s)}\,dB_s$. Its mean decays to $m$ at
          rate $\theta$, and its variance settles at $\sigma^{2}/(2\theta)$:
          noise pumps variance in, reversion drains it out.
      - ask: >
          A candidate uses the factor $e^{-0.5t}(X_t - 1)$ instead. What is its
          $dt$ coefficient?
        choices:
          - text: >
              $0$, the same as with $e^{0.5t}$.
            feedback: >
              $f_t = -0.5e^{-0.5t}(x - 1)$ and $f_x a = e^{-0.5t} \cdot 0.5(1 - x)
              = -0.5e^{-0.5t}(x - 1)$. They add instead of cancelling.
          - text: >
              $-e^{-0.5t}(X_t - 1)$: the two terms add, so the drift survives.
            correct: true
            feedback: >
              The factor has to *grow* at rate $\theta$ to undo a gap that
              *decays* at rate $\theta$. Check the cancellation before trusting
              the result.
          - text: >
              $0.5e^{-0.5t}(0.3)^{2}$, from the Itô correction.
            feedback: >
              The transform is linear in $x$, so $f_{xx} = 0$ and there is no
              Itô correction at all.
        feedback: >
          The integrating factor is $e^{+\theta t}$. The minus sign belongs in
          the solution, as $e^{-\theta t}$.
      - ask: >
          What is the law of $X_t$ at a fixed time $t$?
        choices:
          - text: >
              Log-normal, since the solution contains an exponential.
            feedback: >
              The exponentials are deterministic weights. $X_t$ is a constant
              plus a weighted sum of Brownian increments, nothing exponentiated
              at random.
          - text: >
              Normal at every $t$, because it is a constant plus an Itô integral
              with a deterministic integrand.
            correct: true
            feedback: >
              A deterministic integrand makes the Itô integral exactly normal,
              with variance given by the Itô isometry. OU is a Gaussian process
              for all time, not just in the limit.
          - text: >
              Normal only as $t \to \infty$.
            feedback: >
              Normality is exact at every $t$. What arrives only in the limit
              is the stationary variance.
        feedback: >
          Gaussian, with mean $m + (X_0 - m)e^{-\theta t}$ and a variance the
          Itô isometry computes.

      - part: When the spring points the wrong way
        ask: >
          A colleague flips the sign, writing $dX_t = 0.5(X_t - 1)\,dt
          + 0.3\,dB_t$ from $X_0 = 4$. What is $\mathbb{E}[X_2]$, to four
          decimal places?
        expects: "9.1548"
        tolerance: 0.0005
        feedback: >
          Now the gap obeys $g' = +0.5g$, so $\mathbb{E}[X_2] = 1 + 3e^{1}
          \approx 9.1548$. The level repels instead of attracting: $\theta < 0$
          is not an OU process, and nothing is stationary.
      - teach: >
          Asked to model a mean-reverting spread, write the OU equation, name
          the integrating factor $e^{\theta t}(X_t - m)$ aloud, and give the
          limits: as $\theta \to \infty$ the reversion is instant, and as
          $\theta \to 0$ the process is plain Brownian motion.

  - node: quant-processes.ito.ou-stationary
    hook: >
      "What's the half-life of this mean-reverting spread" is a direct
      pricing-desk question, and it's a one-line computation once you have
      $\theta$.
    explanation: >
      The noise integral in the OU solution, $\sigma\int_0^te^{-\theta(t-s)}
      \,dB_s$, has a deterministic integrand, so the Itô isometry applies
      exactly rather than as a bound: its variance is $\sigma^{2}\int_0^t
      e^{-2\theta(t-s)}\,ds = \frac{\sigma^{2}}{2\theta}\left(1-e^{-2\theta
      t}\right)$.

      As $t\to\infty$ the exponential term vanishes and the variance
      saturates at $\sigma^{2}/(2\theta)$ — noise pumps randomness in
      continuously at rate $\sigma^{2}$ while mean reversion drains it out
      continuously at rate proportional to $\theta$, and the two balance at
      exactly that ratio. Started at that stationary law, $N(m,
      \sigma^{2}/(2\theta))$, the process is stationary for all time, with
      covariance $\operatorname{Cov}(X_s,X_t)=\frac{\sigma^{2}}{2\theta}
      e^{-\theta|t-s|}$ decaying between any two times.

      The half-life solves $e^{-\theta\cdot t_{1/2}}=1/2$ for the time it
      takes reversion to close half the initial gap, giving
      $t_{1/2}=\ln 2/\theta$ — a directly interpretable number practitioners
      quote instead of $\theta$ itself. Sampling on a grid of spacing
      $\Delta$ turns OU into exactly an AR(1) with coefficient
      $\varphi=e^{-\theta\Delta}$, which is the practical estimation route:
      fit an AR(1) to observed spread data, then invert $\varphi$ to recover
      $\theta$.
    worked: >
      Take $\theta=0.5$, $\sigma=1$. The stationary variance is
      $\sigma^{2}/(2\theta)=1/1=1$, so the long-run standard deviation is
      exactly $1$. The half-life is $\ln 2/0.5\approx 1.386$ time units.
      Sampled daily with $\Delta=1/252$, the implied AR(1) coefficient is
      $\varphi=e^{-0.5/252}\approx e^{-0.00198}\approx 0.9980$ — a spread that
      looks almost like a random walk day to day despite reverting
      meaningfully over a couple of years.
    interview: >
      "Given daily spread data, how would you estimate the mean-reversion
      speed" is answered by naming the AR(1) fit and the inversion
      $\theta=-\ln(\hat\varphi)/\Delta$ — state the discretization link
      explicitly, not just "run a regression." A quick follow-up asks for the
      half-life formula directly from $\theta$.
    pitfalls: >
      Quoting the stationary variance as $\sigma^{2}/\theta$ instead of
      $\sigma^{2}/(2\theta)$ drops the factor of $2$ from integrating
      $e^{-2\theta(t-s)}$, not $e^{-\theta(t-s)}$. Treating the AR(1)
      coefficient $\varphi$ as $\theta$ itself, rather than $e^{-\theta
      \Delta}$, mixes up a continuous-time rate with a discrete-time
      correlation.
    recap: >
      OU's variance rises to a stationary $\sigma^{2}/(2\theta)$ with
      half-life $\ln 2/\theta$, and sampling it on any grid gives exactly an
      AR(1) — the route from real spread data back to $\theta$.
    dialogue:
      - part: Does the noise pile up
        teach: >
          A rate spread follows an Ornstein–Uhlenbeck process with
          $\theta = 2$ per year, $\sigma = 0.6$ and level $m = 1.5$, and today
          it sits exactly at $X_0 = 1.5$. Plain Brownian motion with the same
          $\sigma$ would have variance $0.36t$, growing without limit.
      - ask: >
          What happens to $\operatorname{Var}(X_t)$ as $t$ grows?
        choices:
          - text: >
              It grows like $0.36t$, the same as Brownian motion: the drift
              moves the mean, not the spread.
            feedback: >
              The drift is $2(1.5 - X)$, which depends on where $X$ is: it
              pushes the high paths down and the low paths up, squeezing them
              together. That changes the spread.
          - text: >
              It stays at $0$, because the process starts at its level.
            feedback: >
              The noise starts moving it immediately. Starting at the level
              removes the mean's decay, not the randomness.
          - text: >
              It rises at first, then levels off at a finite value.
            correct: true
            feedback: >
              Near $t = 0$ the paths have barely moved and the pull is weak, so
              variance grows like $0.36t$; as paths spread out, the pull
              strengthens until it holds the spread steady.
        feedback: >
          Noise spreads the paths; reversion gathers them. The question is
          where the two balance.
      - reflect: >
          Use $\frac{d}{dt}\operatorname{Var}(X_t) = \sigma^{2}
          - 2\theta\operatorname{Var}(X_t)$: the noise adds variance at rate
          $\sigma^{2}$ and the pull removes it in proportion to how much there
          is. Where does the variance stop changing, and why is there a $2$ in
          front of $\theta$?
        answer: >
          It stops where $\sigma^{2} = 2\theta\operatorname{Var}$, at
          $\sigma^{2}/(2\theta)$. The $2$ comes from squaring: the pull shrinks
          each deviation like $e^{-\theta t}$, so squared deviations — and the
          variance — shrink like $e^{-2\theta t}$. The same answer falls out of
          the Itô isometry applied to
          $\sigma\int_0^t e^{-\theta(t-s)}\,dB_s$.
      - ask: >
          For this spread, what is the long-run variance?
        expects: "0.09"
        tolerance: 0.0001
        feedback: >
          $0.36/(2 \times 2) = 0.09$, a long-run standard deviation of $0.3$.
          Brownian motion with the same $\sigma$ passes $0.09$ after a quarter
          of a year and keeps going.
      - ask: >
          The Itô isometry gives $\operatorname{Var}(X_t)
          = 0.36\int_0^t e^{-4(t-s)}\,ds = 0.09\left(1 - e^{-4t}\right)$. When
          does the variance reach half its long-run value, to four decimal
          places?
        expects: "0.1733"
        tolerance: 0.0005
        feedback: >
          $1 - e^{-4t} = 1/2$ gives $t = \ln 2/4 \approx 0.1733$ years.

      - part: The stationary law
        teach: >
          So the variance rises as $\frac{\sigma^{2}}{2\theta}\left(1
          - e^{-2\theta t}\right)$ to $\sigma^{2}/(2\theta)$, and the
          stationary law is $N\left(m, \sigma^{2}/(2\theta)\right)$: start
          there and the process stays in that law for all time, with
          $\operatorname{Cov}(X_s, X_t) = \frac{\sigma^{2}}{2\theta}
          e^{-\theta|t-s|}$. The expected gap to $m$ halves every $\ln 2/\theta$,
          the half-life, which is how desks quote reversion speed.
      - ask: >
          What is this spread's half-life, in years, to four decimal places?
        expects: "0.3466"
        tolerance: 0.0005
        feedback: >
          $\ln 2/2 \approx 0.3466$ years, about $87$ trading days. The
          variance reached half its limit in $0.1733$, exactly half that: the
          variance relaxes at rate $2\theta$, the mean at rate $\theta$.
      - ask: >
          In the stationary regime, what is the correlation between the
          spread now and the spread half a year from now, to four decimal
          places?
        expects: "0.3679"
        tolerance: 0.0005
        feedback: >
          Divide the covariance by the variance: $e^{-\theta|t-s|}
          = e^{-2 \times 0.5} = e^{-1} \approx 0.3679$. Memory fades
          exponentially, at the reversion speed.

      - part: From the model to weekly data
        ask: >
          You observe the spread once a week, $\Delta = 1/52$. Each week the
          expected gap to $m$ shrinks by a fixed factor $\varphi$. What is
          $\varphi$, to four decimal places?
        expects: "0.9623"
        tolerance: 0.0005
        hint: >
          Over a time $\Delta$ the expected gap is multiplied by
          $e^{-\theta\Delta}$.
        feedback: >
          $e^{-2/52} \approx 0.9623$. Sampled on a grid, OU is exactly an
          AR(1): $X_{k+1} - m = \varphi(X_k - m) + \varepsilon_k$, with
          independent normal $\varepsilon_k$ of variance
          $\frac{\sigma^{2}}{2\theta}\left(1 - \varphi^{2}\right)$.
      - ask: >
          A junior fits an AR(1) to weekly data, gets $\hat{\varphi} = 0.96$,
          and reports "reversion speed $0.96$". What is the right reading?
        choices:
          - text: >
              It is right: $\varphi$ and $\theta$ are two names for the same
              speed.
            feedback: >
              $\varphi$ is a correlation per sampling step, between $0$ and
              $1$; $\theta$ is a rate per unit time. A $\varphi$ near $1$
              means *slow* reversion, the opposite of what "speed $0.96$"
              suggests.
          - text: >
              $\theta = 1 - \hat{\varphi} = 0.04$ per year.
            feedback: >
              $1 - \varphi$ is the fraction of the gap closed per *week*, and
              only approximately. Per year that is about $52$ times larger.
          - text: >
              $\theta = -\ln(\hat{\varphi})/\Delta = 52\ln(1/0.96) \approx 2.12$
              per year.
            correct: true
            feedback: >
              Invert $\varphi = e^{-\theta\Delta}$. Here that gives about
              $2.12$, close to the model's $2$, with a half-life near $0.33$
              years.
        feedback: >
          The AR(1) coefficient depends on the sampling interval; $\theta$
          does not. Convert through $\varphi = e^{-\theta\Delta}$.
      - ask: >
          Keep $\sigma = 0.6$ and let $\theta \to 0$. What happens to the
          stationary law?
        choices:
          - text: >
              It tends to $N(m, 0)$: with no reversion there is no noise left.
            feedback: >
              The noise is untouched by $\theta$. It is the force *holding the
              variance down* that disappears.
          - text: >
              It disappears: $\sigma^{2}/(2\theta) \to \infty$, the process
              becomes Brownian motion, and no stationary law exists.
            correct: true
            feedback: >
              The half-life $\ln 2/\theta$ also runs off to infinity. With
              nothing pulling back, the variance grows like $\sigma^{2}t$
              forever.
          - text: >
              It stays $N(m, 0.09)$, since the stationary law does not depend
              on $\theta$.
            feedback: >
              $0.09$ was $0.36/(2 \times 2)$; halve $\theta$ and the variance
              doubles.
        feedback: >
          Stationarity needs $\theta > 0$: a pull back to $m$ to drain what
          the noise pumps in.
      - teach: >
          Asked for the half-life of a spread, say $\ln 2/\theta$; asked how to
          get $\theta$ from data, say "fit an AR(1) and invert
          $\varphi = e^{-\theta\Delta}$". The stationary normal is the
          continuous-state version of a Markov chain's $\pi P = \pi$: the law
          that running the dynamics forward leaves unchanged.
