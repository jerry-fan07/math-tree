unit: quant-games.kelly
opening: >
  Every bet you can repeat carries a temptation to just maximize expected
  profit, and this unit exists to show precisely why that temptation is wrong
  once wealth compounds. It opens by taking a logarithm — turning a product of
  round multipliers into a sum a law of large numbers can govern — and lands
  on the Kelly fraction, the stake that maximizes the resulting almost-sure
  growth rate. From there it turns practical: the growth curve's shape
  explains why over-betting is punished far harder than under-betting, why
  real desks bet a fraction of full Kelly, and what a full-Kelly bettor's
  drawdowns actually look like. It closes on the fine print — what the
  criterion assumes, and when a different objective changes the right answer.
lessons:
  - node: quant-games.kelly.fixed-fraction
    hook: >
      Every Kelly question opens with this exact setup, and the detail that
      determines everything downstream is easy to miss: you stake a fraction
      of whatever the bankroll is right now, not a fixed dollar amount and not
      a fraction of what you started with.
    explanation: >
      Fixed-fraction betting is the entire game board for this unit: a
      bankroll $W_0$, a bet you can take repeatedly at the same odds, and a
      rule that commits the same fraction $f$ of the current bankroll every
      round. That single choice is what makes wealth a product of round
      multipliers, $W_n=W_0\prod_{i=1}^{n}(1+fX_i)$, rather than a sum of
      independent profits. A sum is analyzed by adding expected values and
      stops there; a product cannot be, because one small factor drags down
      every factor that follows it, and that asymmetry is the reason this
      entire unit exists.

      For a bet paying $b$ to $1$, won with probability $p$, a win multiplies
      the bankroll by $1+bf$ and a loss by $1-f$, so the per-unit profit is
      $X=b$ on a win and $X=-1$ on a loss. Restricting $f$ to the range from
      $0$ up to but not including $1$ keeps every multiplier strictly positive
      — the bankroll can shrink toward zero but no round can hand back a
      negative or zero factor.

      Nothing here says what $f$ should be, and that is deliberate:
      fixed-fraction betting is a whole family of strategies indexed by one
      number, and the rest of this unit is the search for the best member of
      that family.
    worked: >
      Take a bet at $2$-to-$1$ odds and stake $f=0.1$ of a $100$ bankroll each
      round. A win multiplies by $1+0.1(2)=1.2$, a loss by $1-0.1=0.9$. Win,
      then lose, then win: $100 \to 120 \to 108 \to 129.6$. The order does not
      change the final number here, since multiplication commutes, but it
      would matter enormously under fixed-stake betting, where a big enough
      loss can make the next stake exceed what remains.
    interview: >
      Interviewers set this up almost identically every time: "you have a
      bankroll, a repeatable favorable bet — how do you size it?" They are
      listening for whether you immediately reach for a multiplicative wealth
      process rather than adding up expected profits round by round, since
      that framing is what makes the rest of the Kelly derivation possible.
    pitfalls: >
      Confusing "fraction of current bankroll" with "fraction of starting
      bankroll" — the latter is fixed-stake betting in disguise and does not
      compound. Also forgetting the restriction $f<1$: at $f=1$ a single loss
      multiplies wealth by zero, permanently.
    recap: >
      Fixed-fraction betting stakes the same share of whatever is left,
      turning wealth into a product of round multipliers rather than a sum of
      profits.
    dialogue:
      - part: Two readings of a quarter
        teach: >
          You and two friends pool a bankroll of $160$ for an even-money bet
          you can take round after round. The plan is "stake a quarter".
          Rosa reads that as $40$ every round. Sam reads it as a quarter of
          whatever the bankroll is at that moment. The first four rounds go
          loss, loss, win, win.
      - ask: >
          Where is Rosa's bankroll after the four rounds?
        expects: "160"
        hint: >
          Her stake never changes, so just add up the four results.
        feedback: >
          $160 - 40 - 40 + 40 + 40 = 160$. Two wins and two losses of the same
          size cancel exactly: under a fixed stake, results add.
      - ask: >
          Where is Sam's bankroll after the two losses?
        expects: "90"
        hint: >
          The first loss costs a quarter of $160$. The second costs a quarter
          of what is left.
        feedback: >
          The first loss takes $160$ to $120$, and the second stake is a
          quarter of $120$, so it takes $120$ to $90$. Each loss multiplies the
          bankroll by $0.75$: $160 \times 0.75^{2} = 90$.
      - ask: >
          And where is Sam's bankroll after the two wins that follow?
        expects: "140.625"
        hint: >
          Each win adds a quarter of the current bankroll, so it multiplies by
          $1.25$.
        feedback: >
          $90 \times 1.25 = 112.5$, then $112.5 \times 1.25 = 140.625$. Same
          two wins and two losses as Rosa, and Sam is down $19.375$.
      - ask: >
          Why is Sam down when Rosa is level?
        choices:
          - text: >
              Bad order: the losses came first, so his wins were placed on a
              smaller bankroll.
            feedback: >
              Try the other order. Win, win, loss, loss goes
              $160 \to 200 \to 250 \to 187.5 \to 140.625$ — the same number.
              Multiplication does not care about order.
          - text: >
              A loss and a win multiply the bankroll by
              $0.75 \times 1.25 = 0.9375$, which is less than $1$.
            correct: true
            feedback: >
              Right. A win-loss pair costs Sam $6.25\%$ whatever order it comes
              in, and he had two of them: $0.9375^{2} \times 160 = 140.625$.
          - text: >
              His bets had negative expected value and Rosa's did not.
            feedback: >
              They took the identical even-money bet. What differs is how the
              results combine: Rosa's add, Sam's multiply.
        feedback: >
          Sam's wealth is $160$ times a product of four factors, one per round,
          each $1.25$ or $0.75$. That is the whole difference between the two
          readings of "a quarter".

      - part: The rule, written down
        reflect: >
          Write Sam's bankroll after $n$ rounds as a formula in his starting
          bankroll, his fraction and each round's result. What kind of object
          is it, and what does that say about how one bad round affects every
          round after it?
        hint: >
          A round at fraction $f$ turns a bankroll $W$ into
          $W(1 + f \cdot \text{result})$.
        answer: >
          If each unit staked returns a profit $X_i$ in round $i$ ($+1$ on an
          even-money win, $-1$ on a loss), then
          $W_n = W_0 \prod_{i=1}^{n} (1 + f X_i)$: a product of round multipliers, not a sum of profits. A
          bad round shrinks the base that every later stake is computed from,
          so its damage is carried forward in every factor that follows.
      - teach: >
          That is fixed-fraction betting: a bankroll $W_0$, a bet repeated
          with independent identically distributed profits $X_1, X_2, \dots$
          per unit staked, and one number $f$, the share of the *current*
          bankroll staked every round, so
          $W_n = W_0 \prod_{i=1}^{n}(1 + f X_i)$. At odds of $b$ to $1$, $X = b$ on a win and $X = -1$ on a
          loss. The only choice you make is $f$.
      - ask: >
          A bet pays $3$ to $1$ and you stake $f = 0.15$ of a $200$ bankroll.
          You win once and lose once. What is the bankroll?
        expects: "246.5"
        hint: >
          A win multiplies by $1 + bf$, a loss by $1 - f$.
        feedback: >
          A win multiplies by $1 + 3(0.15) = 1.45$ and a loss by
          $1 - 0.15 = 0.85$, so $200 \times 1.45 \times 0.85 = 246.5$, in either order.
          Here a win-loss pair is worth $1.2325$, because the win pays three
          times what the loss costs.

      - part: Where the fraction has to stop
        ask: >
          Back at even money, Sam suggests $f = 1$ to "make the wins count".
          What does a single loss do to the bankroll?
        choices:
          - text: >
              It halves it, and the next win restores it.
            feedback: >
              That would be $f = 0.5$. At $f = 1$ a loss multiplies the
              bankroll by $1 - 1 = 0$.
          - text: >
              It sets it to $0$, and every later factor multiplies $0$.
            correct: true
            feedback: >
              Right. One factor of $0$ makes the whole product $0$ forever. No
              run of wins afterwards can rescue it, because there is nothing
              left to stake a fraction of.
          - text: >
              It sets it to $0$, but only for that round: the next stake is
              still a full bankroll.
            feedback: >
              The next stake is a fraction of the *current* bankroll, which is
              now $0$. Fixed-fraction betting has no memory of what you
              started with.
        feedback: >
          Keeping $0 \le f < 1$ keeps every multiplier strictly positive on a
          bet that can lose at most the stake: the bankroll can shrink, never
          vanish. Past $f = 1$ a loss multiplies by a negative number, and you
          owe money.
      - ask: >
          Which of these is *not* fixed-fraction betting?
        choices:
          - text: >
              Staking $10\%$ of the current bankroll on every toss of the same
              biased coin, always at the same odds.
            feedback: >
              Same fraction, current bankroll, the same bet repeated: this is
              fixed-fraction betting.
          - text: >
              Staking $10\%$ of the bankroll as it stood on Monday morning, on
              each of fifty identical bets through the week.
            correct: true
            feedback: >
              Right. Within the week the stake is a fixed dollar amount, so
              losses on Tuesday do not shrink Wednesday's stake. It fails
              exactly one clause: the fraction is of a stale bankroll, not the
              current one.
          - text: >
              Staking $0\%$ every round.
            feedback: >
              A dull member of the family, but a member: $f = 0$ gives every
              multiplier $1$ and $W_n = W_0$.
        feedback: >
          Same fraction, of the current bankroll, on a repeated bet, with
          $0 \le f < 1$. Everything in this unit is the search for the best
          value of that one number $f$.
  - node: quant-games.kelly.log-growth
    hook: >
      The strong law of large numbers is the hinge the whole Kelly framework
      turns on: it is what upgrades "maximize expected log wealth" from an
      arbitrary preference into the one objective that predicts what your
      bankroll actually does after many rounds.
    explanation: >
      Taking logarithms turns the wealth product from fixed-fraction betting
      into a sum: $\ln(W_n/W_0)=\sum_{i=1}^{n}\ln(1+fX_i)$, and dividing by
      $n$ gives the average of independent identically distributed terms
      $\ln(1+fX_i)$. That average is exactly what the strong law of large
      numbers governs, so as $n\to\infty$ it converges almost surely to the
      constant $g(f)=\mathbb{E}[\ln(1+fX)]$, provided that expectation is
      finite.

      Undoing the logarithm, $W_n\approx W_0e^{ng(f)}$: for large $n$ the
      bankroll is, with probability $1$, exponentially close to a
      deterministic curve set by the single number $g(f)$. That is the
      load-bearing fact — a strategy with a larger $g$ eventually overtakes
      any strategy with a smaller $g$ on almost every sample path, not merely
      on average, because almost-sure convergence pins down what the typical
      path does rather than what a probability-weighted average of all paths
      does.

      The practical translation: maximizing long-run growth means maximizing
      $\mathbb{E}[\ln(1+fX)]$, the expected logarithm of a single round's
      multiplier. Equivalently, since the logarithm turns products into sums,
      you are maximizing the geometric mean of the round multipliers $1+fX$ —
      the number that, raised to the $n$th power, reproduces your actual
      compounded wealth — not their arithmetic mean, which answers a different
      and less useful question.
    worked: >
      Take a bet with a modest edge, $p=0.55$ at even money, and stake a
      cautious $f=0.1$ every round. The growth rate is
      $g(0.1)=0.55\ln(1.1)+0.45\ln(0.9)\approx0.005$ per round. Over $200$
      rounds the almost-sure approximation gives $W_{200}/W_0\approx
      e^{200(0.005)}\approx2.72$ — the bankroll roughly triples, driven
      entirely by that small per-round rate compounding.
    interview: >
      Expect to be asked to justify the switch to logarithms on the spot —
      "why not just maximize expected wealth" — and the strong answer is this
      one: expected wealth is dominated by rare extreme paths, while $g(f)$
      governs what happens almost surely. Stating $W_n\approx W_0e^{ng(f)}$
      cold is the ten-second version.
    pitfalls: >
      Treating $W_n\approx W_0e^{ng(f)}$ as exact for small $n$ — it is an
      almost-sure limit, and short-run wealth still has real variance around
      that curve. Also, $g(f)$ is not the expected per-round profit; because
      the logarithm is concave, $\mathbb{E}[\ln(1+fX)]<\ln(1+f\mathbb{E}[X])$
      whenever $X$ is genuinely random, so growth always undershoots the naive
      expected-profit rate.
    recap: >
      Compounded wealth grows almost surely at the rate
      $g(f)=\mathbb{E}[\ln(1+fX)]$, so the right objective for a repeated bet
      is expected log wealth, not expected wealth.
    dialogue:
      - part: Half up, half down
        teach: >
          You stake a fixed fraction of your bankroll on a repeated bet. At
          the fraction you have chosen, a win multiplies the bankroll by $1.5$
          and a loss multiplies it by $0.6$, and a fair coin decides each
          round independently.
      - ask: >
          What is the expected multiplier for one round?
        expects: "1.05"
        hint: >
          Average the two multipliers with their probabilities.
        feedback: >
          $0.5(1.5) + 0.5(0.6) = 1.05$. On average one round adds $5\%$, so
          the bet looks worth taking.
      - ask: >
          Over $100$ rounds you win exactly $50$ and lose exactly $50$. What
          multiple of the starting bankroll do you hold?
        expects: "0.00515"
        tolerance: 0.0001
        hint: >
          Pair each win with a loss. What does one pair do?
        feedback: >
          A win and a loss together multiply by $1.5 \times 0.6 = 0.9$, and
          there are $50$ pairs: $0.9^{50} \approx 0.00515$. The most likely
          split of wins and losses leaves you with half a percent of your
          money.
      - ask: >
          The expected multiple after $100$ rounds is $1.05^{100} \approx 131.5$.
          Which describes the bankroll you will actually be holding?
        choices:
          - text: >
              Something near $131$ times the start: that is what $100$ rounds
              give on average.
            feedback: >
              To finish above where you started you need
              $1.5^{k} 0.6^{100-k} > 1$, which takes at least $56$ wins out of
              $100$. That happens about $14\%$ of the time. The $131$ is held up
              by rare long runs of wins.
          - text: >
              Exactly the starting bankroll: the gains and losses balance.
            feedback: >
              They do not balance. $+50\%$ and $-40\%$ in either order
              multiply to $0.9$, a $10\%$ loss per pair.
          - text: >
              Most likely a small fraction of the start: the typical path is
              close to $50$ wins, and paths like that lose.
            correct: true
            feedback: >
              Right. The mean averages over many imaginary bankrolls, a few of
              which hit enormous runs. You hold one bankroll, and it does what
              the typical path does.
        feedback: >
          The arithmetic mean of the multipliers says $1.05$; the bankroll on
          the typical path shrinks. Something other than the expectation of
          wealth is steering what happens to you.

      - part: From a product to a sum
        reflect: >
          Your wealth after $n$ rounds is a product of $n$ independent random
          multipliers. The strong law of large numbers speaks about averages
          of independent terms. What could you do to the wealth so that the
          strong law has something to say, and what would it predict for this
          bet?
        hint: >
          Which function turns a product into a sum?
        answer: >
          Take logarithms. $\ln(W_n/W_0)$ is the sum of the $n$ independent
          terms $\ln M_i$, so dividing by $n$ gives an average, and the strong
          law sends it to the constant $\mathbb{E}[\ln M]$ on almost every
          path. Here that constant is $0.5\ln 1.5 + 0.5\ln 0.6$, which is
          negative, so the bankroll decays exponentially even though each
          round's expected multiplier exceeds $1$.
      - teach: >
          That is the whole proposition. For fixed-fraction betting,
          $\frac{1}{n}\ln(W_n/W_0) = \frac{1}{n}\sum_{i=1}^{n}\ln(1 + fX_i)$
          converges almost surely to $g(f) = \mathbb{E}[\ln(1 + fX)]$, provided
          $\mathbb{E}|\ln(1 + fX)| < \infty$. So $W_n \approx W_0 e^{n g(f)}$:
          the bankroll grows or decays at the deterministic rate $g(f)$.
          Equivalently, $e^{g(f)}$ is the geometric mean of the round
          multipliers, and that, not their arithmetic mean, is what compounds.
      - ask: >
          Compute $g$ for the bet above, to four decimal places. Use
          $\ln 1.5 = 0.405465$ and $\ln 0.6 = -0.510826$.
        expects: "-0.0527"
        tolerance: 0.0005
        hint: >
          Each outcome has probability $0.5$.
        feedback: >
          $g = 0.5(0.405465) + 0.5(-0.510826) = -0.052680$, so about $-0.0527$
          per round. The bankroll loses roughly $5\%$ per round on almost
          every path, while its expectation gains $5\%$.
      - ask: >
          What is the geometric mean of the two multipliers, $e^{g}$, to four
          decimal places?
        expects: "0.9487"
        tolerance: 0.0005
        hint: >
          With equal probabilities, $e^{g} = (1.5 \times 0.6)^{1/2}$.
        feedback: >
          $\sqrt{0.9} \approx 0.9487$. Raise it to the $100$th power and you
          get $0.9^{50} \approx 0.00515$, the $50$-win path exactly: the
          geometric mean is the per-round rate of the typical path.
      - ask: >
          What does the strong law actually need here for $g(f)$ to be the
          limit?
        choices:
          - text: >
              The bet must be favourable, $\mathbb{E}[X] > 0$.
            feedback: >
              This bet has $\mathbb{E}[X] > 0$ and a negative $g$; the law
              does not care about the sign of anything. It delivers the limit
              for good bets and bad ones alike.
          - text: >
              The terms $\ln(1 + fX_i)$ must be independent and identically
              distributed, with $\mathbb{E}|\ln(1 + fX)|$ finite.
            correct: true
            feedback: >
              Right. Fixed-fraction betting supplies the independence and the
              identical distribution; the finiteness is the one condition you
              must check, and it fails exactly when a multiplier can be $0$.
          - text: >
              The wealth $W_n$ must have finite variance.
            feedback: >
              The law is applied to the logs, not to $W_n$. The variance of
              wealth can explode, as the $131.5$ against $0.005$ suggests,
              without affecting the limit of the average log.
        feedback: >
          Independent, identically distributed log-multipliers with a finite
          mean: that is all, and it is why the conclusion holds on almost
          every path rather than merely on average.

      - part: Who wins the long race, and where the law goes silent
        ask: >
          Two fractions on the same favourable bet give growth rates
          $g_A = 0.004$ and $g_B = 0.006$ per round. After $2000$ rounds,
          roughly what is $W_B / W_A$?
        expects: "54.6"
        tolerance: 0.5
        hint: >
          Each bankroll is about $W_0 e^{n g}$. Divide.
        feedback: >
          $e^{2000(0.006 - 0.004)} = e^{4} \approx 54.6$. A difference of
          $0.2\%$ per round is a factor of fifty after two thousand rounds.
      - ask: >
          How sure can you be that $B$ is ahead of $A$ after many rounds?
        choices:
          - text: >
              Only on average: $B$'s expected wealth is larger, nothing more.
            feedback: >
              The strong law is a statement about each path. On almost every
              path $\frac{1}{n}\ln(W_B/W_A) \to 0.002 > 0$, so $B$ ends ahead
              on that path, not just on average.
          - text: >
              With probability tending to $1$: eventually $B$ leads and stays
              ahead on almost every path.
            correct: true
            feedback: >
              Right. That is what makes $g$ the objective: a larger $g$
              overtakes a smaller one with probability $1$.
          - text: >
              With certainty from the first round on.
            feedback: >
              Early on luck dominates: $A$ can lead for a long stretch. The
              guarantee is about the limit, not about round $10$.
        feedback: >
          Almost-sure convergence is about the one bankroll you actually run,
          which is why comparing strategies by $g$ is not a preference but a
          prediction.
      - ask: >
          On an even-money bet that loses $30\%$ of the time, you stake
          $f = 1$. What is $g(1)$?
        choices:
          - text: >
              $0.7\ln 2 \approx 0.485$, from the wins alone.
            feedback: >
              The losses contribute too: with probability $0.3$ the multiplier
              is $1 - 1 = 0$, and $\ln 0$ is $-\infty$.
          - text: >
              $-\infty$: a loss multiplies by $0$, and the bankroll is gone
              after the first one.
            correct: true
            feedback: >
              Right. $\mathbb{E}|\ln(1 + fX)|$ is infinite, so the hypothesis
              fails, and the conclusion fails with it in the most literal way:
              the bankroll is $0$ from the first loss on.
          - text: >
              Undefined, so the strong law says nothing and the bet might be
              fine.
            feedback: >
              The law's hypothesis fails, but you do not need the law here: a
              loss arrives with probability $1$ eventually, and it ends the
              game.
        feedback: >
          The finiteness condition is not a technicality. It is the line
          between a bankroll that decays and one that can be wiped out, and it
          is why every multiplier must stay strictly positive.
      - teach: >
          Said aloud in an interview: "the bankroll compounds at
          $e^{g(f)}$ per round on almost every path, by the strong law applied
          to the log-multipliers, so I maximize $\mathbb{E}[\ln(1 + fX)]$, not
          expected wealth."
  - node: quant-games.kelly.ev-vs-growth
    hook: >
      The instinctive answer to "you have positive expected value every round,
      how much do you bet" is "as much as possible," and it is the fastest way
      to fail this question — expected wealth and typical wealth are not the
      same thing once wealth compounds.
    explanation: >
      Expected wealth is easy to compute directly:
      $\mathbb{E}[W_n]=W_0(1+f\mu)^n$ with $\mu=\mathbb{E}[X]$, and it is
      strictly increasing in $f$, so maximizing it head-on prescribes $f=1$ —
      stake the entire bankroll, every round, forever. That answer is a trap,
      and log-growth already explains why: the almost-sure path of wealth is
      governed by $g(f)=\mathbb{E}[\ln(1+fX)]$, and at $f=1$ any bet with a
      chance of losing everything sends $\ln(0)=-\infty$ into that average, so
      $g(1)=-\infty$ whenever a total loss is possible. Betting everything is
      growth-optimal by the wrong measure and ruin-certain by the right one.

      The resolution is that $\mathbb{E}[W_n]$ is an average over all paths,
      and at large $f$ that average is carried almost entirely by one
      astronomically unlikely path where every single bet wins. A product is
      hostage to its worst factor in a way a sum never is: one factor of zero
      erases every factor before and after it, permanently, and no number of
      favorable rounds elsewhere in the average compensates for a path that
      actually hits it.

      This is the general lesson, not just a warning about $f=1$: any
      objective that ignores the almost-sure behavior of a compounding product
      keeps recommending strategies whose typical outcome is ruin, because it
      scores rare extreme paths as if they were representative.
    worked: >
      A coin comes up heads $70\%$ of the time, pays even money, and you bet
      the entire bankroll every round. Expected wealth after $20$ rounds is
      $W_0(1.4)^{20}\approx837W_0$ — an enormous number. But surviving $20$
      rounds without a single loss has probability $0.7^{20}\approx0.0008$,
      about $1$ in $1250$. The typical outcome, in the overwhelming majority
      of the probability mass, is bankruptcy on some early round; the huge
      expectation is manufactured entirely by that one path where every toss
      comes up heads.
    interview: >
      A common follow-up after you state a bet has positive expected value is
      "so why not bet everything?" — the interviewer wants the ruin argument
      stated concretely, ideally with an actual survival probability, not just
      the word "risky."
    pitfalls: >
      Citing a large $\mathbb{E}[W_n]$ as evidence a strategy is good —
      expectation is dominated by rare extreme paths under compounding and
      says nothing about what you should expect to happen. Also, this specific
      argument needs a real chance of losing everything at $f=1$; it does not
      by itself say what the right smaller $f$ is — that is the next question.
    recap: >
      Maximizing expected wealth prescribes betting everything, which is
      almost-sure ruin — the mean of a compounding product is carried by paths
      nobody actually lives on.
    dialogue:
      - part: Following the expectation
        teach: >
          A coin lands heads $75\%$ of the time and pays even money. You may
          stake any fraction of your bankroll on each of the next ten tosses.
          Your manager's instruction is short: maximize expected wealth after
          ten tosses.
      - ask: >
          Each unit staked returns $+1$ or $-1$, so the expected profit per
          unit is $0.5$. Which fraction follows the instruction?
        choices:
          - text: >
              $f = 0.5$: keep half back in case of a loss.
            feedback: >
              Keeping money back costs expectation. Each toss multiplies
              expected wealth by $1 + 0.5f$, which is $1.25$ at $f = 0.5$ and
              $1.5$ at $f = 1$. The instruction has no term for caution.
          - text: >
              $f = 1$: every unit staked adds $0.5$ in expectation, so stake
              every unit.
            correct: true
            feedback: >
              Right, as far as the instruction goes. Expected wealth after ten
              tosses is $W_0(1 + 0.5f)^{10}$, strictly increasing in $f$, so
              the instruction says bet everything, every toss.
          - text: >
              It depends on how the first tosses go.
            feedback: >
              Expected wealth multiplies by $1 + 0.5f$ every toss whatever has
              happened, so the best $f$ is the same every toss: as large as
              allowed.
        feedback: >
          $\mathbb{E}[W_n] = W_0(1 + f\mu)^{n}$ only ever rewards a larger
          $f$. Now look at what that prescription does.
      - ask: >
          At $f = 1$, what is $\mathbb{E}[W_{10}] / W_0$, to two decimal
          places?
        expects: "57.67"
        tolerance: 0.01
        hint: >
          Each toss multiplies expected wealth by $1.5$.
        feedback: >
          $1.5^{10} \approx 57.67$. An expected fifty-sevenfold return in ten
          tosses.
      - ask: >
          At $f = 1$, what is the probability that you still have any money
          after ten tosses, to four decimal places?
        expects: "0.0563"
        tolerance: 0.0005
        hint: >
          One tail anywhere multiplies the bankroll by $0$.
        feedback: >
          You need ten heads in a row: $0.75^{10} \approx 0.0563$. About $94\%$
          of players following the instruction end with nothing.
      - ask: >
          The lucky survivor doubled every toss. What multiple of $W_0$ does
          the survivor hold?
        expects: "1024"
        feedback: >
          $2^{10} = 1024$. And $0.0563 \times 1024 \approx 57.67$: the entire
          expected value is the survivor's fortune weighted by the survivor's
          probability. Every other path contributes $0$.
      - ask: >
          What bankroll does the median player hold after ten tosses, as a
          multiple of $W_0$?
        expects: "0"
        feedback: >
          More than half of all players are ruined, so the median is $0$. The
          mean is $57.67$ and the typical outcome is nothing.

      - part: Why the mean lies about a product
        reflect: >
          The instruction recommended a strategy that ruins $94\%$ of the
          people who follow it. What property of a product of multipliers lets
          one path carry the whole mean, and what kind of objective would
          refuse to bet everything?
        hint: >
          Think about what a single factor of $0$ does to a product, and how
          the mean weighs it.
        answer: >
          A product is hostage to its worst factor: one $0$ wipes out every
          factor before and after it, permanently. The mean ignores that,
          because it simply weighs the all-heads fortune of $1024$ by its tiny
          probability and adds. An objective that is additive across rounds
          and charges ruin infinitely, the expected logarithm of wealth,
          scores any total-loss strategy at $-\infty$ and so never bets
          everything.
      - teach: >
          That is the trap in general. $\mathbb{E}[W_n] = W_0(1 + f\mu)^{n}$ is
          strictly increasing in $f$, so maximizing it prescribes $f = 1$,
          whose survival probability $p^{n}$ goes to $0$. The large mean is
          carried by the single all-wins path; the typical bankroll is zero.
          The growth rate $g(f) = \mathbb{E}[\ln(1 + fX)]$ fixes both defects:
          it adds across rounds, and $g(1) = -\infty$ whenever a total loss is
          possible.
      - ask: >
          For the same coin, a colleague stakes $f = 0.5$ instead. What is
          $g(0.5)$, to four decimal places? Use $\ln 1.5 = 0.405465$ and
          $\ln 0.5 = -0.693147$.
        expects: "0.1308"
        tolerance: 0.0005
        hint: >
          $g(0.5) = 0.75\ln(1 + 0.5) + 0.25\ln(1 - 0.5)$.
        feedback: >
          $0.75(0.405465) + 0.25(-0.693147) = 0.304099 - 0.173287$, about
          $0.1308$. The typical bankroll after ten tosses is about
          $e^{1.308} \approx 3.7$ times the start, and no path is ever at
          zero: the worst, ten tails, still holds $0.5^{10}$ of the bankroll.

      - part: Where the intuition holds, and where it misleads
        ask: >
          Surely a near-certain bet is safe to go all in on. A coin lands
          heads $99\%$ of the time at even money, and you bet everything on
          each of $500$ tosses. What is the probability of surviving, to four
          decimal places?
        expects: "0.0066"
        tolerance: 0.0002
        hint: >
          Survival means $500$ heads in a row.
        feedback: >
          $0.99^{500} \approx 0.0066$. A $1\%$ chance of ruin per toss,
          repeated, is certain ruin in the long run. No edge is large enough
          to make $f = 1$ survive compounding when a total loss is possible.
      - ask: >
          In which situation is maximizing expected wealth a reasonable rule?
        choices:
          - text: >
              Betting everything, every day for a year, on the $99\%$ coin.
            feedback: >
              That is the case just computed, cut to $365$ tosses: survival is
              $0.99^{365} \approx 0.026$. Compounding is exactly where
              expectation misleads.
          - text: >
              A single, never-repeated bet of $100$ dollars by someone with a
              bankroll of a million.
            correct: true
            feedback: >
              Right. Nothing compounds and the stake is tiny relative to
              wealth, so a loss cannot wreck the base for later rounds. For a
              small one-off bet, $\ln(1 + fX) \approx fX$, and the two
              objectives agree.
          - text: >
              Any repeated bet whose edge is large enough, say $50\%$ or more
              per unit staked.
            feedback: >
              The $75\%$ coin has an edge of exactly $50\%$ per unit, and
              following the expectation still ruined $94\%$ of players in ten
              tosses. The size of the edge does not repair the product.
        feedback: >
          The expectation is a fine guide for one small bet and a misleading
          one for a compounding bankroll. Once a product is involved, the
          question is what the typical path does, and that is a question
          about $\mathbb{E}[\ln W]$.
  - node: quant-games.kelly.growth-function
    hook: >
      Turning the abstract "maximize expected log wealth" into a concrete
      function of one variable is what makes Kelly a calculus problem instead
      of a philosophy — and two boundary values of that function are a
      five-second gut check for whether a bet is worth touching at all.
    explanation: >
      Specialize log-growth's $g(f)=\mathbb{E}[\ln(1+fX)]$ to the binary bet:
      a win, probability $p$, multiplies the bankroll by $1+bf$, and a loss,
      probability $q=1-p$, multiplies it by $1-f$, giving
      $g(f)=p\ln(1+bf)+q\ln(1-f)$. This is now an ordinary single-variable
      function, and its shape is what makes the rest of Kelly work: the second
      derivative $g''(f)=-\frac{pb^2}{(1+bf)^2}-\frac{q}{(1-f)^2}$ is a sum of
      two strictly negative terms everywhere on the domain, so $g$ is strictly
      concave. A strictly concave function has at most one interior stationary
      point, and where one exists it is automatically the unique global
      maximum — no need to check other local optima separately.

      Two values of this function are worth memorizing as sanity checks.
      First, $g(0)=0$: declining the bet leaves the bankroll exactly where it
      started, which anchors the whole curve. Second, the slope at the origin
      is $g'(0)=pb-q$, the expected profit per unit staked on an
      infinitesimally small bet — a fast test for whether any stake at all is
      worth taking, since a strictly concave function that is already falling
      at $f=0$ never recovers.
    worked: >
      A bet pays $3$ to $1$ and wins with probability $0.3$. The origin slope
      is $pb-q=0.3(3)-0.7=0.2>0$, so some positive stake helps. At $f=0.05$,
      $g(0.05)=0.3\ln(1.15)+0.7\ln(0.95)\approx0.00602$, about $0.60\%$ growth
      per round. At $f=0.10$, $g(0.10)=0.3\ln(1.3)+0.7\ln(0.9)\approx0.00496$,
      only $0.50\%$ — lower, even though the stake doubled, exactly the
      concave hump curving back down past its peak somewhere between the two.
    interview: >
      Interviewers sometimes ask you to justify why a single maximum exists
      before you go find it — the strong answer names strict concavity from
      $g''<0$ directly, not just "it's a nice function." The origin slope
      $pb-q$ is also a fast way to answer "does this bet have any edge at
      all?" without touching the full formula.
    pitfalls: >
      Forgetting $g\to-\infty$ as $f\to1$ — a search that only checks where
      the derivative vanishes can miss that the function is unbounded below at
      the domain's edge, though concavity guarantees the interior stationary
      point, when one exists, still beats that edge. Also, computing the
      origin slope as $p-q$ instead of $pb-q$ — the odds multiply the win
      probability, they do not just sit alongside it.
    recap: >
      $g(f)=p\ln(1+bf)+q\ln(1-f)$ is strictly concave with $g(0)=0$ and origin
      slope $pb-q$, the expected profit per unit staked.
    dialogue:
      - part: Two stakes on a long shot
        teach: >
          A bet pays $4$ to $1$ and wins $25\%$ of the time. You will stake a
          fixed fraction $f$ of the bankroll on it, round after round, and the
          bankroll grows at the rate $\mathbb{E}[\ln(1 + fX)]$ per round.
      - ask: >
          At $f = 0.1$, what is the growth rate per round, to four decimal
          places? Use $\ln 1.4 = 0.336472$ and $\ln 0.9 = -0.105361$.
        expects: "0.0051"
        tolerance: 0.0002
        hint: >
          A win multiplies the bankroll by $1 + 4f$, a loss by $1 - f$. Weight
          the two logarithms by their probabilities.
        feedback: >
          $0.25\ln 1.4 + 0.75\ln 0.9 = 0.084118 - 0.079020 = 0.005098$, about
          $0.51\%$ per round.
      - ask: >
          At $f = 0.3$, to four decimal places? Use $\ln 2.2 = 0.788457$ and
          $\ln 0.7 = -0.356675$.
        expects: "-0.0704"
        tolerance: 0.0005
        hint: >
          Now a win multiplies by $2.2$ and a loss by $0.7$.
        feedback: >
          $0.25(0.788457) + 0.75(-0.356675) = 0.197114 - 0.267506$, about
          $-0.0704$. Triple the stake, and the bankroll now shrinks by about
          $7\%$ a round.
      - ask: >
          What do these two numbers say about the curve of growth against
          stake?
        choices:
          - text: >
              The bet is unfavourable at $4$ to $1$.
            feedback: >
              At $f = 0.1$ the bankroll grows. A favourable bet can still be
              staked so heavily that it shrinks you; the sign of the growth
              rate depends on $f$, not only on the bet.
          - text: >
              It rises from no growth at $f = 0$, peaks, and falls; $0.3$ is
              well past the peak.
            correct: true
            feedback: >
              Right, and the rest of this lesson is about why that shape, one
              hump and only one, is guaranteed.
          - text: >
              It might rise and fall several times, so you would need to
              evaluate it at many points to find the best stake.
            feedback: >
              That would make bet sizing a search. It is not, because this
              curve cannot have a second hump — a fact you will be able to
              read off a single derivative shortly.
        feedback: >
          Too little stake wastes the edge and too much destroys it. The
          growth rate is a function of $f$ with a shape worth knowing.
      - ask: >
          What is the growth rate at $f = 0$, for this bet or any other?
        expects: "0"
        feedback: >
          At $f = 0$ every multiplier is $1$ and $\ln 1 = 0$. Declining the bet
          neither grows nor shrinks anything: every growth curve starts at
          $0$.

      - part: The slope at zero
        reflect: >
          Every growth curve starts at $0$. What single number, computed at
          $f = 0$, would tell you whether some small positive stake grows the
          bankroll at all — and what does that number mean in betting terms?
        hint: >
          If the curve starts at $0$, whether it goes up or down first is a
          question about its slope.
        answer: >
          The slope at $0$. Differentiating $p\ln(1 + bf) + q\ln(1 - f)$ gives
          $\frac{pb}{1 + bf} - \frac{q}{1 - f}$, which at $f = 0$ is $pb - q$:
          the expected profit per unit staked. If it is positive, small stakes
          grow the bankroll; if not, no stake does.
      - teach: >
          That function has a name: the growth function of a binary bet,
          $g(f) = p\ln(1 + bf) + q\ln(1 - f)$ on $0 \le f < 1$, with
          $g \to -\infty$ as $f \to 1$. Its slope is
          $g'(f) = \frac{pb}{1 + bf} - \frac{q}{1 - f}$, its anchor is
          $g(0) = 0$, and its slope at the origin is $g'(0) = pb - q$.
      - ask: >
          For the $4$ to $1$ bet at $25\%$, what is $g'(0)$?
        expects: "0.25"
        hint: >
          The odds multiply the win probability.
        feedback: >
          $pb - q = 0.25(4) - 0.75 = 0.25$. Each unit staked earns a quarter of
          a unit in expectation, so small stakes grow the bankroll — matching
          the positive $g(0.1)$.
      - ask: >
          A different bet pays $3$ to $1$ and wins $20\%$ of the time. What
          happens at a tiny stake, $f = 0.02$?
        choices:
          - text: >
              It grows the bankroll slightly: a win pays three times what a
              loss costs.
            feedback: >
              Payoff alone is not the test. $g'(0) = 0.2(3) - 0.8 = -0.2$, so
              the curve is already falling at $0$, and $g(0.02)$ is negative.
          - text: >
              It shrinks the bankroll, and so does every larger stake.
            correct: true
            feedback: >
              Right. $g'(0) = -0.2 < 0$, and a curve whose slope only ever
              decreases can never turn back up after falling at the start.
          - text: >
              You cannot say without evaluating $g$ at several stakes.
            feedback: >
              One number settles it: the slope at $0$ is $-0.2$. Because the
              slope can only decrease from there, no stake is worth taking.
        feedback: >
          $pb - q$ is the five-second test. Positive: some stake helps.
          Zero or negative: decline the bet.

      - part: One hump, and no more
        ask: >
          Which fact guarantees that $g$ has at most one peak on $0 \le f < 1$?
        choices:
          - text: >
              $g(0) = 0$.
            feedback: >
              Many functions through the origin wiggle. A starting value says
              nothing about how often the curve turns.
          - text: >
              $g'(0) > 0$ for a favourable bet.
            feedback: >
              That says the curve starts upward. It does not stop it turning
              down and up again later.
          - text: >
              $g''(f) = -\frac{pb^{2}}{(1 + bf)^{2}} - \frac{q}{(1 - f)^{2}}$
              is negative everywhere on the domain.
            correct: true
            feedback: >
              Right. Both terms are strictly negative, so $g$ is strictly
              concave: its slope only ever decreases, it crosses zero at most
              once, and that crossing is the global maximum.
        feedback: >
          Strict concavity is what turns bet sizing from a search into
          solving one equation, $g'(f) = 0$.
      - ask: >
          Now a bet that pays $4$ to $1$ but, on a loss, costs *twice* the
          stake, so a loss multiplies the bankroll by $1 - 2f$. What happens
          to the growth function?
        choices:
          - text: >
              It loses its concavity.
            feedback: >
              $q\ln(1 - 2f)$ is still concave in $f$, so $g$ still has one
              hump. Concavity survives; something else does not.
          - text: >
              Nothing changes: the formula only uses $p$ and $b$.
            feedback: >
              The formula assumed a loss costs exactly the stake. Here a loss
              multiplies by $1 - 2f$, which hits $0$ at $f = 0.5$.
          - text: >
              The loss term becomes $q\ln(1 - 2f)$ and the domain shrinks to
              $0 \le f < 1/2$.
            correct: true
            feedback: >
              Right. The growth curve now falls to $-\infty$ at $f = 0.5$, not
              at $f = 1$. The clause that failed is "a loss costs the stake",
              and with it the domain.
        feedback: >
          The growth function is built from the two multipliers. Change what
          a loss does and you change the curve and where it ends.
  - node: quant-games.kelly.kelly-fraction
    hook: >
      This is the formula: say it cold, in one line, with the derivation ready
      if asked — "how much do you bet on a favorable repeated bet" is close to
      the single most-asked question in this entire subject.
    explanation: >
      Strict concavity from growth-function means the maximum of $g$ sits
      exactly where its derivative vanishes, so set
      $g'(f)=\frac{pb}{1+bf}-\frac{q}{1-f}=0$. Cross-multiplying clears both
      denominators: $pb(1-f)=q(1+bf)$, which expands to $pb-pbf=q+qbf$.
      Collecting the $f$ terms on one side gives $pb-q=bf(p+q)$, and since
      $p+q=1$ this collapses to $pb-q=bf$, so $f^{*}=(bp-q)/b$. Every step is
      mechanical once you commit to the derivative being zero; the only
      judgment call is checking $bp>q$ first, since a stationary point outside
      the domain would mean $g$ is falling everywhere on it, and the true
      maximum sits at the boundary $f^{*}=0$ instead.

      At even money, $b=1$, the formula collapses to $f^{*}=p-q=2p-1$ — twice
      your edge over a coin flip. It is worth deriving this once by hand so
      the general formula and the even-money shortcut visibly agree, rather
      than memorizing them as two separate facts.
    worked: >
      A bet pays $4$ to $1$ and wins with probability $0.3$. Check the edge
      first: $bp=1.2$ exceeds $q=0.7$, so betting helps. Then
      $f^{*}=(4(0.3)-0.7)/4=0.5/4=0.125$ — stake $12.5\%$ of the bankroll each
      round.
    interview: >
      The canonical phrasing is close to verbatim: "you have an edge on a
      repeatable bet, how much of your bankroll do you bet?" The interviewer
      wants $f^{*}=(bp-q)/b$ produced without hesitation, plus the discipline
      to check $bp>q$ before applying it — quoting a formula that comes out
      negative and not catching it is worse than not remembering the formula
      at all.
    pitfalls: >
      Applying the formula when $bp\le q$ and reporting a negative stake
      instead of recognizing $f^{*}=0$ — you never bet against your own edge.
      Also, mixing up "$b$ to $1$" net odds with decimal odds: decimal odds of
      $3.0$ correspond to $b=2$ (stake back plus $2$ units profit), not $b=3$.
    recap: >
      $f^{*}=(bp-q)/b$, or $2p-1$ at even money — set the derivative of the
      growth function to zero and solve, checking $bp>q$ first.
    dialogue:
      - part: Bracketing the best stake
        teach: >
          A bet pays $3$ to $1$ and wins $40\%$ of the time. You can repeat it
          as often as you like, stake any fraction of the bankroll, and
          reinvest everything. How much do you stake?
      - ask: >
          Start by trying a stake. What is the growth rate $g(0.1)$, to four
          decimal places? Use $\ln 1.3 = 0.262364$ and $\ln 0.9 = -0.105361$.
        expects: "0.0417"
        tolerance: 0.0005
        hint: >
          $g(f) = p\ln(1 + bf) + q\ln(1 - f)$ with $p = 0.4$, $b = 3$.
        feedback: >
          $0.4(0.262364) + 0.6(-0.105361) = 0.104946 - 0.063217$, about
          $0.0417$ per round.
      - ask: >
          And $g(0.3)$, to four decimal places? Use $\ln 1.9 = 0.641854$ and
          $\ln 0.7 = -0.356675$.
        expects: "0.0427"
        tolerance: 0.0005
        feedback: >
          $0.4(0.641854) + 0.6(-0.356675) = 0.256742 - 0.214005$, about
          $0.0427$. Almost the same growth at three times the stake.
      - ask: >
          Values alone do not show which way the curve is heading. What is the
          slope $g'(0.1) = \frac{pb}{1 + bf} - \frac{q}{1 - f}$, to four
          decimal places?
        expects: "0.2564"
        tolerance: 0.0005
        hint: >
          $pb = 1.2$ and $q = 0.6$; put $f = 0.1$ into both denominators.
        feedback: >
          $\frac{1.2}{1.3} - \frac{0.6}{0.9} = 0.923077 - 0.666667$, about
          $0.2564$. Still climbing at $f = 0.1$.
      - ask: >
          The same slope at $f = 0.3$ is
          $\frac{1.2}{1.9} - \frac{0.6}{0.7} \approx -0.2256$. Where is the
          best stake?
        choices:
          - text: >
              Above $0.3$, since $g(0.3)$ is larger than $g(0.1)$.
            feedback: >
              The slope at $0.3$ is negative, so the curve is already coming
              down there. A slightly higher value at $0.3$ only says the curve
              has not yet fallen far past its peak.
          - text: >
              Below $0.1$, since tripling the stake added almost nothing.
            feedback: >
              The slope at $0.1$ is $+0.2564$: the curve is still rising
              there, so the peak lies to the right of $0.1$. On a concave
              curve, two nearly equal values put the peak between them.
          - text: >
              Somewhere between $0.1$ and $0.3$, where the slope crosses zero.
            correct: true
            feedback: >
              Right. The slope is positive at $0.1$ and negative at $0.3$, and
              because $g$ is strictly concave it only decreases, so it crosses
              zero exactly once in between.
        feedback: >
          Bracketing works, but each step costs two logarithms and only
          narrows the interval.
      - reflect: >
          Bracketing could go on forever. What equation pins down the best
          stake exactly, and why can you trust its solution without checking
          any other stake?
        hint: >
          What is the slope at the very top of a smooth hump?
        answer: >
          Set the slope to zero: $g'(f) = 0$, the first-order condition. On its
          own a zero slope could be a minimum or a flat stretch, but the growth
          function is strictly concave, so it has at most one stationary
          point, and that point is the global maximum on $0 \le f < 1$.

      - part: Solving the first-order condition
        ask: >
          Solve $\frac{1.2}{1 + 3f} = \frac{0.6}{1 - f}$ for $f$.
        expects: "0.2"
        hint: >
          Cross-multiply, then collect the $f$ terms.
        feedback: >
          $1.2(1 - f) = 0.6(1 + 3f)$ gives $1.2 - 1.2f = 0.6 + 1.8f$, so
          $0.6 = 3f$ and $f = 0.2$. Stake $20\%$ of the bankroll.
      - ask: >
          Now in general. Cross-multiplying $\frac{pb}{1 + bf} = \frac{q}{1 - f}$
          gives $pb - pbf = q + qbf$. What is the solution?
        choices:
          - text: >
              $f = \frac{bp - q}{b + 1}$
            feedback: >
              Collecting gives $pb - q = bf(p + q)$, and $p + q = 1$, not
              $b + 1$. Check on the bet above: $(1.2 - 0.6)/4 = 0.15$, not the
              $0.2$ you just found.
          - text: >
              $f = \frac{bp - q}{b}$
            correct: true
            feedback: >
              Right. $pb - q = bf(p + q) = bf$, because $p + q = 1$. Check:
              $(1.2 - 0.6)/3 = 0.2$.
          - text: >
              $f = bp - q$
            feedback: >
              That is the edge, the expected profit per unit staked. For the
              bet above it is $0.6$, three times the $0.2$ you solved for: the
              odds still have to come out of the numerator.
          - text: >
              $f = \frac{p - q}{b}$
            feedback: >
              The odds multiply the win probability inside the numerator. Here
              $(0.4 - 0.6)/3$ is negative, for a bet you just found worth
              $20\%$ of the bankroll.
        feedback: >
          The only fact used beyond algebra is $p + q = 1$, which is what
          makes the $f$ terms collapse to $bf$.
      - teach: >
          That is the Kelly criterion. For repeated independent bets at $b$ to
          $1$, won with probability $p$, with divisible stakes and full
          reinvestment, the growth-maximizing fraction is
          $f^{*} = (bp - q)/b$ when $bp > q$, and $f^{*} = 0$ otherwise. Strict
          concavity makes the stationary point the unique global maximum. At
          even money, $b = 1$, it is $f^{*} = 2p - 1$.

      - part: Two by hand
        ask: >
          A bet pays $1.5$ to $1$ and wins half the time. What is $f^{*}$?
          Give an exact fraction.
        expects: "1/6"
        hint: >
          Check $bp > q$ first, then divide the edge by $b$.
        feedback: >
          $bp = 0.75 > q = 0.5$, so
          $f^{*} = (0.75 - 0.5)/1.5 = 0.25/1.5 = 1/6$, about $16.7\%$.
      - ask: >
          An even-money bet wins $53\%$ of the time. What is $f^{*}$?
        expects: "0.06"
        feedback: >
          $f^{*} = 2(0.53) - 1 = 0.06$. A three-point edge over a fair coin
          stakes $6\%$.

      - part: When the formula misleads
        ask: >
          A bet pays $2$ to $1$ and wins $30\%$ of the time. The formula
          returns $(0.6 - 0.7)/2 = -0.05$. What do you stake?
        expects: "0"
        hint: >
          What is the slope of the growth curve at $f = 0$?
        feedback: >
          $g'(0) = bp - q = -0.1 < 0$. A concave curve already falling at $0$
          keeps falling, so the maximum over $0 \le f < 1$ is the endpoint
          $f = 0$. No edge, no bet.
      - ask: >
          Why not read $-0.05$ as "stake $5\%$ on the other side"?
        choices:
          - text: >
              Because the other side is not offered at these odds; to take it
              you would need someone to sell it to you, at their price.
            correct: true
            feedback: >
              Right. The derivation is over stakes $f \ge 0$ on this bet at
              these odds. A negative $f$ describes a bet nobody is offering
              you.
          - text: >
              You should: the formula is telling you to fade the bet.
            feedback: >
              Fading means standing where the bookmaker stands, collecting $1$
              when the bettor loses and paying $2$ when the bettor wins. That is a different bet with
              its own odds and its own Kelly fraction, if anyone lets you
              take it.
          - text: >
              Because negative stakes are allowed but the size is wrong.
            feedback: >
              Stakes on this bet cannot be negative at all. The domain is
              $0 \le f < 1$, and on it the best point is $f = 0$.
        feedback: >
          Check $bp > q$ before quoting a number. Reporting a negative stake
          and not catching it is worse than not knowing the formula.
      - ask: >
          The $1.5$ to $1$ bet is quoted by a bookmaker in decimal odds, as
          $2.5$. A candidate plugs $b = 2.5$ in and gets
          $(1.25 - 0.5)/2.5 = 0.3$. What went wrong?
        choices:
          - text: >
              Nothing: decimal and fractional odds mean the same thing.
            feedback: >
              They do not. Decimal $2.5$ means a winning unit returns $2.5$ in
              total, stake included, so the profit is $1.5$.
          - text: >
              The formula wants the net profit per unit, $b = 2.5 - 1 = 1.5$,
              which gives $1/6$.
            correct: true
            feedback: >
              Right. $b$ is the profit on a winning unit. Using the total
              return overstates the edge and nearly doubles the stake.
          - text: >
              Decimal odds need $p$ converted too.
            feedback: >
              $p$ is your probability of winning, whatever the quote format.
              Only $b$ needs translating.
        feedback: >
          Decimal odds $d$ mean $b = d - 1$. Say $f^{*} = (bp - q)/b$ with $b$
          the net odds, check $bp > q$, and the answer is safe.
  - node: quant-games.kelly.edge-over-odds
    hook: >
      This is the version you actually use at a desk or in an interview when
      someone quotes odds and a probability out loud — reading $f^{*}$ as
      "edge divided by odds" lets you size a bet in your head before you would
      finish writing the algebra.
    explanation: >
      Split $f^{*}=(bp-q)/b$ into numerator and denominator and each piece has
      a name: $bp-q$ is the expected profit per unit staked — the edge — and
      $b$ is the payoff multiple being offered — the odds. The rule that falls
      out is qualitative and easy to hold in your head: stake more as the edge
      widens, stake less as the odds lengthen, for a fixed edge. A crucial
      structural fact is what does not appear anywhere in the formula — the
      size of your bankroll. Kelly is scale-free; the same $p$ and $b$ give
      the same fraction whether the bankroll is $100$ or $100$ million.

      Long shots are the case that most surprises people: a large edge does
      not by itself justify a large stake if the odds are long, because the
      edge is divided by a large $b$. This is the formula's way of penalizing
      bets whose single loss, at full stake, is proportionally enormous
      compared to a single win.
    worked: >
      A bet pays $5$ to $1$ and wins $25\%$ of the time. Edge:
      $bp-q=5(0.25)-0.75=1.25-0.75=0.5$ — a very large $50\%$ expected profit
      per unit staked. But the odds are long, so $f^{*}=0.5/5=0.1$: only
      $10\%$ of the bankroll, despite the outsized edge.
    interview: >
      Expect odds and a probability given verbally with the expectation you
      compute $f^{*}$ mentally: get the edge $bp-q$ first, then divide by $b$.
      This is also the moment to state that Kelly never uses the bankroll size
      — a common check interviewers throw in.
    pitfalls: >
      At even money $b=1$, so the formula reduces to just $2p-1$; misapplying
      that shortcut to non-even-money bets by ignoring $b$ is the most common
      slip. Also, a large edge on long odds is genuinely a small position —
      resist the instinct to bet big just because the edge number looks big.
    recap: >
      Kelly is edge over odds — expected profit per unit staked, divided by
      the payoff multiple offered — and it never depends on how much money you
      have.
    dialogue:
      - part: Two tips, one bankroll
        teach: >
          Two tips arrive for races you can bet on again and again. Horse A is
          quoted at even money, and your model gives it $58\%$. Horse B is
          quoted at $7$ to $1$, and your model gives it $20\%$.
      - ask: >
          What is horse B's edge, the expected profit per unit staked?
        expects: "0.6"
        hint: >
          A unit wins $7$ with probability $0.2$ and loses $1$ otherwise.
        feedback: >
          $7(0.2) - 0.8 = 1.4 - 0.8 = 0.6$. Sixty cents of expected profit on
          every unit staked.
      - ask: >
          And horse A's edge?
        expects: "0.16"
        feedback: >
          $1(0.58) - 0.42 = 0.16$. Less than a third of horse B's.
      - ask: >
          Which horse gets the larger Kelly fraction of your bankroll?
        choices:
          - text: >
              Horse B: its edge is nearly four times larger.
            feedback: >
              Compute it: $f^{*} = (bp - q)/b = 0.6/7 \approx 0.086$ for B,
              against $2(0.58) - 1 = 0.16$ for A. The edge is not the stake.
          - text: >
              Horse A, despite the smaller edge.
            correct: true
            feedback: >
              Right. A gets $0.16$ of the bankroll; B gets $0.6/7$, about
              $0.086$, roughly half as much.
          - text: >
              The same: both are favourable, so both get the maximum.
            feedback: >
              Kelly has no maximum stake for favourable bets; each fraction
              comes from its own $p$ and $b$. Here $0.16$ against about
              $0.086$.
        feedback: >
          The bigger edge gets the smaller stake. Something in the formula is
          working against horse B.
      - ask: >
          What is horse B's Kelly fraction, to four decimal places?
        expects: "0.0857"
        tolerance: 0.0005
        feedback: >
          $(7(0.2) - 0.8)/7 = 0.6/7 \approx 0.0857$.

      - part: What the odds are doing
        reflect: >
          Horse B's edge is nearly four times horse A's, and it gets about
          half the stake. What is the $7$ doing to the stake, and why does it
          make sense that it divides?
        hint: >
          Horse B loses $80\%$ of the time. Imagine staking its edge, $60\%$
          of the bankroll, and losing three times running.
        answer: >
          $f^{*} = (bp - q)/b$ is the edge divided by the odds. A long shot
          pays its edge out in rare large wins, while the losses come often:
          three straight losses on horse B have probability $0.512$, and at a
          $60\%$ stake they would leave $0.4^{3} = 6.4\%$ of the bankroll. A
          win at $7$ to $1$ is so large that a small stake already captures
          it, so the odds that make the edge big are the same odds that make
          the right stake small.
      - teach: >
          That is the corollary: read $f^{*} = (bp - q)/b$ as edge over odds.
          The numerator is the expected profit per unit staked, the
          denominator the payoff offered. Bet more as the edge grows, less as
          the odds lengthen. At even money the two coincide, so $f^{*}$ is the
          edge itself. Only $p$ and $b$ enter — never the size of the
          bankroll.
      - ask: >
          You have $2000$ dollars; a fund has $20$ million. Both believe horse
          A wins $58\%$ at even money. What is true of the two Kelly stakes?
        choices:
          - text: >
              Both stake $16\%$: the fraction depends only on $p$ and $b$.
            correct: true
            feedback: >
              Right: $320$ dollars for you, $3.2$ million for the fund. Kelly
              is scale-free.
          - text: >
              The fund stakes a smaller fraction, because it has more to lose.
            feedback: >
              The fund has more to lose and more to lose it from, in the same
              proportion. Nothing in $(bp - q)/b$ mentions the bankroll.
          - text: >
              The fund stakes a larger fraction, because it can absorb losses.
            feedback: >
              Absorbing losses is a statement about absolute dollars, and Kelly
              sizes relative ones. A $16\%$ loss is a $16\%$ loss at any size.
        feedback: >
          The stake scales with the bankroll; the fraction does not. That is
          why the formula travels from a poker table to a fund unchanged.
      - ask: >
          Someone says out loud: "$3$ to $1$, I think it wins $30\%$." What is
          the Kelly fraction? Give an exact fraction.
        expects: "1/15"
        hint: >
          Edge first, then divide by the odds.
        feedback: >
          Edge $3(0.3) - 0.7 = 0.2$; divide by $3$: $f^{*} = 1/15$, about
          $6.7\%$. Edge, then odds — two steps you can do aloud.

      - part: Same edge, longer odds
        ask: >
          A bet at $4$ to $1$ has the same edge, $0.2$. What win probability
          does that take?
        expects: "0.24"
        hint: >
          Solve $4p - (1 - p) = 0.2$.
        feedback: >
          $5p - 1 = 0.2$, so $p = 0.24$.
      - ask: >
          What is its Kelly fraction?
        expects: "0.05"
        feedback: >
          $0.2/4 = 0.05$. Same edge as the $3$ to $1$ bet, odds a third
          longer, stake a quarter smaller: $1/15$ fell to $1/20$.
      - ask: >
          A colleague sizes horse B with the even-money shortcut,
          $2p - 1 = 2(0.2) - 1 = -0.6$, and passes. What is the right call?
        choices:
          - text: >
              Pass: a negative Kelly fraction means no bet.
            feedback: >
              The shortcut $2p - 1$ assumes $b = 1$. At $7$ to $1$ the edge is
              $+0.6$, a very good bet that was thrown away by using the wrong
              formula.
          - text: >
              Stake $0.6$, the edge.
            feedback: >
              The edge equals the stake only at even money. At $7$ to $1$ it
              must be divided by $7$; staking $60\%$ on a horse that loses
              $80\%$ of the time is how bankrolls disappear.
          - text: >
              Stake edge over odds, $0.6/7 \approx 0.086$.
            correct: true
            feedback: >
              Right. The shortcut is a special case; the general rule always
              divides by $b$.
        feedback: >
          At even money the edge is the stake. Anywhere else, compute the edge,
          then divide by the odds.
  - node: quant-games.kelly.coin-example
    hook: >
      This exact bet — a coin, a win probability, even money, bet as much as
      you like each round — is the single most repeated interview question in
      this subject, and "what fraction do you stake" is only half of it; the
      interviewer usually wants the actual growth rate too.
    explanation: >
      Recognizing even money is what makes this fast: the general formula
      $f^{*}=(bp-q)/b$ is overkill when $b=1$, since it collapses immediately
      to $f^{*}=2p-1$. The number most candidates stop at is $f^{*}$ itself,
      but the more informative number is the growth rate that stake actually
      produces, $g(f^{*})$ — plugging the optimal fraction back into the
      growth function from growth-function, not just reporting the fraction.

      A recurring surprise is how much smaller $g(f^{*})$ is than the raw
      expected profit per round, $f^{*}(2p-1)$. That gap is not an error; it
      is the concavity of the logarithm doing exactly what it is supposed to
      do, discounting the arithmetic edge by the variance the bet actually
      carries. Being able to state both numbers — the fraction and the
      realized growth rate — and explain why they differ is what separates a
      memorized formula from an understood one.
    worked: >
      A coin lands heads $70\%$ of the time, even money, repeated
      indefinitely. Kelly gives $f^{*}=2(0.7)-1=0.4$ — stake $40\%$ each
      round. The growth rate is $g(0.4)=0.7\ln(1.4)+0.3\ln(0.6)\approx0.0823$,
      so the bankroll multiplies by $e^{0.0823}\approx1.0858$ per round —
      about $8.58\%$ compound growth, doubling in roughly
      $\ln(2)/0.0823\approx8.4$ rounds. The expected profit per toss is
      $f^{*}(2p-1)=0.4\times0.4=0.16$, or $16\%$ — roughly double the $8.23\%$
      actually realized, the rest lost to variance.
    interview: >
      Getting $f^{*}$ is table stakes; the interviewer's actual test is often
      whether you then compute $g(f^{*})$ and can say how many rounds it takes
      to double the bankroll — stopping after the fraction leaves the more
      interesting half of the question unanswered.
    pitfalls: >
      Reporting only $f^{*}$ when asked for the growth rate — they are
      different numbers and both get asked for. Also, conflating the expected
      per-round profit $f^{*}(2p-1)$ with the compounded growth rate
      $g(f^{*})$; the growth rate is always the smaller of the two whenever
      the bet is genuinely random.
    recap: >
      At $p=0.7$ even money, bet $40\%$ for a growth rate of about $0.0823$
      per round — noticeably less than the $16\%$ expected profit per round, the
      difference being variance drag.
    dialogue:
      - part: The stake
        teach: >
          The interviewer puts it plainly: a coin lands heads $65\%$ of the
          time and pays even money, and you may bet on it as often as you
          like. How much of your bankroll do you stake on each toss, and how
          fast does your money grow?
      - ask: >
          What fraction do you stake?
        expects: "0.3"
        hint: >
          Even money: the edge is the stake.
        feedback: >
          $f^{*} = 2(0.65) - 1 = 0.3$. Thirty percent of whatever you hold,
          every toss. Most candidates stop here; the interviewer has asked a
          second question.

      - part: The growth it buys
        ask: >
          What is the growth rate $g(0.3)$ per toss, to four decimal places?
          Use $\ln 1.3 = 0.262364$ and $\ln 0.7 = -0.356675$.
        expects: "0.0457"
        tolerance: 0.0005
        hint: >
          A head multiplies the bankroll by $1.3$, a tail by $0.7$.
        feedback: >
          $0.65(0.262364) + 0.35(-0.356675) = 0.170537 - 0.124836$, about
          $0.0457$ per toss.
      - ask: >
          By what factor does the bankroll grow per toss on the typical path,
          $e^{g}$, to four decimal places?
        expects: "1.0468"
        tolerance: 0.0005
        feedback: >
          $e^{0.0457} \approx 1.0468$: about $4.68\%$ compound growth per
          toss.
      - ask: >
          Roughly how many tosses does it take to double the bankroll? One
          decimal place.
        expects: "15.2"
        tolerance: 0.2
        hint: >
          Solve $e^{n g} = 2$.
        feedback: >
          $n = \ln 2 / g = 0.6931 / 0.0457 \approx 15.2$ tosses. That is the
          number an interviewer likes to hear after the stake.
      - ask: >
          Now the expected profit on one toss, as a fraction of the bankroll.
        expects: "0.09"
        hint: >
          You stake $0.3$ of the bankroll, and each unit staked earns the edge
          in expectation.
        feedback: >
          $f^{*}(2p - 1) = 0.3 \times 0.3 = 0.09$: $9\%$ per toss in
          expectation, about twice the $4.57\%$ the bankroll actually
          compounds at.
      - reflect: >
          The bet earns $9\%$ of the bankroll per toss in expectation, yet the
          bankroll compounds at about $4.6\%$. Where does the other half go?
        hint: >
          Take one head and one tail at a $30\%$ stake, in either order.
        answer: >
          To swings. A head and a tail multiply the bankroll by
          $1.3 \times 0.7 = 0.91$, not $1$: a gain and an equal-sized loss
          leave you behind, and that cost is charged every time the bankroll
          swings. The logarithm is concave, so
          $\mathbb{E}[\ln(1 + fX)] < \ln(1 + f\mathbb{E}[X])$ whenever the
          outcome is random; at the Kelly stake roughly half the arithmetic
          edge is lost this way.
      - teach: >
          So the full answer has two numbers and a reason: stake $30\%$, grow
          at about $0.046$ per toss, doubling every fifteen tosses — about
          half the $9\%$ expected profit, the rest lost to variance.

      - part: Off the peak, either way
        ask: >
          A cautious colleague stakes half as much, $f = 0.15$. What is
          $g(0.15)$, to four decimal places? Use $\ln 1.15 = 0.139762$ and
          $\ln 0.85 = -0.162519$.
        expects: "0.0340"
        tolerance: 0.0005
        feedback: >
          $0.65(0.139762) + 0.35(-0.162519) = 0.090845 - 0.056882$, about
          $0.0340$. Half the stake keeps about three quarters of the growth.
      - ask: >
          An impatient colleague stakes twice as much, $f = 0.6$. What is
          $g(0.6)$, to four decimal places? Use $\ln 1.6 = 0.470004$ and
          $\ln 0.4 = -0.916291$.
        expects: "-0.0152"
        tolerance: 0.0005
        feedback: >
          $0.65(0.470004) + 0.35(-0.916291) = 0.305502 - 0.320702$, about
          $-0.0152$. On a coin that wins $65\%$ of the time, the bankroll
          shrinks by about $1.5\%$ a toss.
      - ask: >
          Which answer to the interviewer is complete?
        choices:
          - text: >
              "Thirty percent of the bankroll each toss."
            feedback: >
              Correct as far as it goes, but it answers half the question.
              The interviewer also asked how fast the money grows, and the
              stake does not say.
          - text: >
              "Thirty percent, so I make nine percent a toss."
            feedback: >
              Nine percent is the expected profit, not the growth. The
              bankroll compounds at about $4.6\%$; the rest is lost to swings.
          - text: >
              "Thirty percent; that grows at about $4.6\%$ a toss and doubles
              in about fifteen tosses, half the nine percent expected profit."
            correct: true
            feedback: >
              Right: the stake, the compound growth, the doubling time, and why
              growth is smaller than the expected profit.
        feedback: >
          Stake, growth rate, doubling time. Then the reason the growth is
          about half the expected profit, and the warning that over-betting
          costs far more than under-betting.
  - node: quant-games.kelly.quadratic-approximation
    hook: >
      This is the version that shows up the instant a bet stops being a clean
      coin flip — a portfolio, an option, any position with a continuous or
      small edge — and it recasts Kelly sizing as the same "edge over
      variance" logic behind a Sharpe ratio.
    explanation: >
      Expand the logarithm in the growth function to second order,
      $\ln(1+fX)=fX-f^2X^2/2+O(f^3)$, and take expectations termwise:
      $g(f)\approx f\mu-\frac{f^2}{2}\mathbb{E}[X^2]$, with
      $\mu=\mathbb{E}[X]$. Since $\mathbb{E}[X^2]=\sigma^2+\mu^2$ and the
      second term is negligible whenever the edge itself is small, this
      reduces to $g(f)\approx f\mu-\frac{f^2\sigma^2}{2}$ — a plain downward
      parabola in $f$, replacing the exact but unwieldy logarithmic curve with
      something you can optimize by inspection.

      Maximizing a parabola needs no calculus beyond finding its vertex:
      $f^{*}\approx\mu/\sigma^2$, edge over variance, structurally the same
      shape as edge over odds but with variance standing in for the payoff
      multiple. The peak value is $g^{*}\approx\mu^2/(2\sigma^2)$, which is
      exactly half the squared Sharpe ratio of the bet — the same
      risk-adjusted-return number used everywhere else in finance is, under
      this approximation, literally what Kelly growth reduces to.
    worked: >
      A strategy has a mean profit per unit staked of $\mu=0.03$ and variance
      $\sigma^2=0.09$ per round. Then $f^{*}\approx0.03/0.09\approx0.333$ —
      about a third of the bankroll per round — with peak growth
      $g^{*}\approx(0.03)^2/(2\times0.09)=0.0009/0.18=0.005$, about $0.5\%$
      per round.
    interview: >
      When a bet is described in terms of a mean and a variance rather than a
      probability and odds, the interviewer is signaling they want
      $f^{*}\approx\mu/\sigma^2$ and the Sharpe-ratio framing $g^{*}\approx
      S^2/2$, not the discrete log-formula.
    pitfalls: >
      This is a small-edge approximation — it degrades once $f$ or the edge is
      large enough that the dropped higher-order terms matter, so do not reach
      for it on a bet with an obviously large edge. Also, the step
      $\mathbb{E}[X^2]\approx\sigma^2$ silently drops the $\mu^2$ term, which
      is only safe when $\mu$ is small relative to $\sigma$.
    recap: >
      To second order, growth is the parabola $f\mu-f^2\sigma^2/2$, so
      $f^{*}\approx\mu/\sigma^2$ and the best attainable growth is half the
      squared Sharpe ratio.
    dialogue:
      - part: A bet with no odds
        teach: >
          A market-making strategy: each round, every unit of capital you
          commit returns a profit $X$ with mean $0.006$ and standard deviation
          $0.1$. Nobody can tell you the distribution — there is no win
          probability, no quoted odds. How much of the bankroll do you commit?
      - ask: >
          What stands in the way of sizing this with what you already have?
        choices:
          - text: >
              Nothing: plug it into $f^{*} = (bp - q)/b$.
            feedback: >
              That formula is for a bet with two outcomes, a win of $b$ and a
              loss of $1$. Here there is no $p$ and no $b$, only a mean and a
              spread.
          - text: >
              The growth rate $\mathbb{E}[\ln(1 + fX)]$ depends on the whole
              distribution of $X$, and you know two numbers about it.
            correct: true
            feedback: >
              Right. To maximize the growth rate exactly you would need every
              outcome and its probability. You have a mean and a standard
              deviation.
          - text: >
              Nothing: the mean is positive, so commit everything.
            feedback: >
              That is maximizing expected wealth, which prescribes betting
              everything and ignores what compounding does to the typical
              path.
        feedback: >
          You need a version of the growth rate that only asks for a mean and
          a variance.
      - reflect: >
          You know only $\mathbb{E}[X]$ and the spread of $X$. What could you do
          to $\ln(1 + fX)$ so that, after taking expectations, only those
          quantities appear?
        hint: >
          When $fX$ is small, what does $\ln(1 + y)$ look like near $y = 0$?
        answer: >
          Expand it. By Taylor's theorem,
          $\ln(1 + y) = y - y^{2}/2 + O(y^{3})$, so
          $\ln(1 + fX) \approx fX - f^{2}X^{2}/2$. Taking expectations gives
          $f\mathbb{E}[X] - \frac{f^{2}}{2}\mathbb{E}[X^{2}]$, which needs only
          the first two moments. The approximation is good as long as $fX$
          stays small.

      - part: Two terms of a Taylor series
        ask: >
          The expansion needs $\mathbb{E}[X^{2}]$. In terms of the mean $\mu$
          and standard deviation $\sigma$, what is it?
        choices:
          - text: >
              $\sigma^{2}$
            feedback: >
              The variance is $\mathbb{E}[X^{2}] - \mu^{2}$, so
              $\mathbb{E}[X^{2}]$ is larger by $\mu^{2}$. Close when the mean is
              small, not equal.
          - text: >
              $\sigma^{2} + \mu^{2}$
            correct: true
            feedback: >
              Right, by rearranging $\sigma^{2} = \mathbb{E}[X^{2}] - \mu^{2}$.
          - text: >
              $\sigma^{2} - \mu^{2}$
            feedback: >
              The sign is backwards. Check on a constant $X = 1$: $\sigma = 0$
              and $\mathbb{E}[X^{2}] = 1 = 0 + 1^{2}$.
        feedback: >
          $\mathbb{E}[X^{2}] = \sigma^{2} + \mu^{2}$, and when the edge is
          small compared with the noise the $\mu^{2}$ is negligible.
      - ask: >
          For this strategy, what is $\mathbb{E}[X^{2}]$?
        expects: "0.010036"
        tolerance: 0.000001
        feedback: >
          $0.1^{2} + 0.006^{2} = 0.01 + 0.000036 = 0.010036$. The $\mu^{2}$
          term moves the answer in the fourth significant figure.
      - ask: >
          Drop the $\mu^{2}$, so the growth rate is about
          $0.006f - \frac{f^{2}}{2}(0.01)$. Which $f$ maximizes it?
        expects: "0.6"
        hint: >
          A downward parabola $af - cf^{2}$ peaks at $f = a/(2c)$.
        feedback: >
          Setting the derivative $0.006 - 0.01f$ to zero gives $f = 0.6$.
          Commit $60\%$ of the bankroll.
      - ask: >
          What growth rate per round does that stake give?
        expects: "0.0018"
        tolerance: 0.00001
        feedback: >
          $0.6(0.006) - \frac{0.36}{2}(0.01) = 0.0036 - 0.0018 = 0.0018$: half
          the expected profit, the other half paid as variance.
      - teach: >
          That is the small-stake expansion:
          $g(f) \approx f\mu - \frac{f^{2}}{2}\mathbb{E}[X^{2}] \approx f\mu - \frac{f^{2}\sigma^{2}}{2}$,
          a downward parabola. Its peak is $f^{*} \approx \mu/\sigma^{2}$, edge
          over variance, and the peak growth is
          $g^{*} \approx \mu^{2}/(2\sigma^{2}) = S^{2}/2$, where $S = \mu/\sigma$
          is the bet's Sharpe ratio. Here $S = 0.06$ and $S^{2}/2 = 0.0018$.

      - part: Checking it against an exact answer
        ask: >
          An even-money coin wins $53\%$ of the time: $\mu = 0.06$ and
          $\mathbb{E}[X^{2}] = 1$, so the expansion predicts $f^{*} = 0.06$
          and peak growth about $0.06^{2}/2 = 0.0018$. Compute the exact
          $g(0.06)$, to four decimal places. Use $\ln 1.06 = 0.058269$ and
          $\ln 0.94 = -0.061875$.
        expects: "0.0018"
        tolerance: 0.00005
        feedback: >
          $0.53(0.058269) + 0.47(-0.061875) = 0.030883 - 0.029081 = 0.001802$.
          The parabola is off in the sixth decimal place, and $0.06$ is the
          exact Kelly stake $2p - 1$. Essentially the same Sharpe ratio as the
          market-making strategy, essentially the same growth.
      - ask: >
          Now a big edge: a bet at $3$ to $1$ that wins half the time, so
          $\mu = 1$ and $\sigma^{2} = 4$. What does the expansion give for
          $f^{*}$?
        expects: "0.25"
        feedback: >
          $\mu/\sigma^{2} = 1/4 = 0.25$.
      - ask: >
          The exact Kelly fraction is $(3(0.5) - 0.5)/3 = 1/3$. Why does the
          expansion miss by a quarter?
        choices:
          - text: >
              It used $\sigma^{2}$ where it should have used $\mathbb{E}[X^{2}]$.
            feedback: >
              Using $\mathbb{E}[X^{2}] = 5$ makes it worse: $1/5 = 0.2$. The
              trouble is not which second moment, it is stopping at the second
              moment at all.
          - text: >
              At these stakes $fX$ is not small — a win at $f = 1/3$ is
              $fX = 1$ — so the dropped cubic and higher terms matter.
            correct: true
            feedback: >
              Right. The expansion of $\ln(1 + y)$ is only good for small $y$,
              and a $3$ to $1$ win at a third of the bankroll doubles you.
          - text: >
              The expansion only works for even-money bets.
            feedback: >
              It is built from a mean and a second moment, which any payoff
              has; the market-making strategy is not a binary bet at all. What
              it needs is a small $fX$, not a particular payoff shape.
        feedback: >
          Trust edge over variance for small edges and small per-round
          swings. When a single round can move the bankroll by a large
          fraction, go back to the exact growth function.

      - part: The Sharpe ratio, priced
        ask: >
          Strategy A has a per-round Sharpe ratio of $0.1$, strategy B of
          $0.05$. Each is run at its own Kelly stake. How many times faster
          does A's bankroll grow?
        expects: "4"
        hint: >
          Peak growth is $S^{2}/2$.
        feedback: >
          $0.1^{2}/2 = 0.005$ against $0.05^{2}/2 = 0.00125$: four times.
          Growth goes with the square of the Sharpe ratio, so doubling it
          quadruples what compounding delivers.
  - node: quant-games.kelly.continuous-kelly
    hook: >
      This is the formula an options or portfolio desk actually uses: how much
      of a portfolio to hold in an asset with a known drift and volatility,
      rebalanced continuously — and the answer routinely comes out several
      times leveraged, which is the part that unsettles people the first time
      they see it.
    explanation: >
      Hold a fraction $f$ of wealth in an asset with drift $\mu$ and
      volatility $\sigma$, the remainder at the riskless rate $r$, rebalanced
      continuously rather than once per discrete round. Under continuous
      rebalancing the second-order approximation from quadratic-approximation
      stops being an approximation and becomes exact: the log-wealth drift is
      precisely $g(f)=r+f(\mu-r)-f^2\sigma^2/2$, the same parabola shape as
      before but with no dropped higher-order terms, because the position's
      own volatility is $f\sigma$ and the subtracted quadratic term is the
      continuous-time cost of holding a volatile position, not an
      approximation artifact.

      Maximizing this exact parabola gives $f^{*}=(\mu-r)/\sigma^2$, and the
      resulting excess growth over the riskless rate is
      $(\mu-r)^2/(2\sigma^2)$, again half the squared Sharpe ratio, exactly as
      the discrete approximation predicted. The leverage reading is the useful
      mental model: $f^{*}$ can be written as $S/\sigma$ where
      $S=(\mu-r)/\sigma$ is the Sharpe ratio, so a low-volatility edge with a
      decent Sharpe ratio demands a large fraction — leverage compensates for
      the position's own volatility being small, which is why Kelly-optimal
      leverage numbers well above $1$ are not a red flag by themselves.
    worked: >
      An asset has excess return $\mu-r=6\%$ and volatility $\sigma=20\%$, so
      $\sigma^2=0.04$. Then $f^{*}=0.06/0.04=1.5$ — hold one and a half times
      the portfolio's value in the asset, funding the extra half with
      borrowing at the riskless rate. Excess growth is
      $(0.06)^2/(2\times0.04)=0.0036/0.08=0.045$, about $4.5\%$ a year above
      the riskless rate.
    interview: >
      Given a Sharpe ratio and a volatility, or a drift and a volatility
      directly, produce $f^{*}=(\mu-r)/\sigma^2$ immediately and be ready to
      reframe it as $S/\sigma$ — that reframing is usually the actual point of
      the question, since it explains why a low-vol edge needs leverage rather
      than looking suspiciously large.
    pitfalls: >
      The riskless rate $r$ drops out of $f^{*}$ entirely — only the excess
      return matters for sizing — but $r$ does not drop out of the total
      growth rate, only the excess-growth term does; conflating the two loses
      a term. Also, squaring volatility carelessly: $\sigma=20\%$ means
      $\sigma^2=0.04$, not $0.20$.
    recap: >
      Continuously rebalanced Kelly holds $(\mu-r)/\sigma^2$ of wealth in the
      asset, equivalently $S/\sigma$ times leveraged, compounding at
      $r+S^2/2$.
    dialogue:
      - part: An index, cash, and a daily rebalance
        teach: >
          An index is expected to beat cash by $5\%$ a year, with volatility
          $20\%$ a year; cash pays $1\%$. You hold a constant fraction $f$ of
          your wealth in the index and the rest in cash, borrowing at $1\%$ if
          $f > 1$, and rebalance every trading day, $250$ a year.
      - ask: >
          Per unit held, one day's excess return over cash has mean
          $0.05/250 = 0.0002$. What is its variance for one day?
        expects: "0.00016"
        tolerance: 0.000001
        hint: >
          Variance, not volatility, scales in proportion to time.
        feedback: >
          The annual variance is $0.2^{2} = 0.04$, and a day is $1/250$ of a
          year: $0.04/250 = 0.00016$. A common slip is dividing the
          volatility $0.2$ by $250$ instead of the variance.
      - ask: >
          Treat one day as one round of a small bet and use edge over
          variance. What fraction of wealth goes in the index?
        expects: "1.25"
        feedback: >
          $0.0002/0.00016 = 1.25$. Hold one and a quarter times your wealth in
          the index, borrowing the extra quarter.
      - ask: >
          You switch to rebalancing weekly, $50$ times a year. What does edge
          over variance give now?
        choices:
          - text: >
              $6.25$, because each week's edge is five times a day's.
            feedback: >
              The week's variance is also five times a day's, $0.0008$
              against a mean of $0.001$. Both grow in proportion to the
              interval.
          - text: >
              $1.25$, the same: the mean and the variance both scale with the
              interval, so their ratio does not.
            correct: true
            feedback: >
              Right. $0.001/0.0008 = 1.25$, and the same for a month or a
              minute. The stake does not depend on how finely you slice the
              year.
          - text: >
              $0.25$, because a weekly bet carries more risk per round.
            feedback: >
              It carries more risk and proportionally more edge. The ratio is
              unchanged at $1.25$.
        feedback: >
          Edge over variance is the same at every rebalancing frequency. What
          does change with the interval is how good the approximation is.
      - reflect: >
          The small-stake expansion dropped the $\mu^{2}$ term and everything
          beyond the square. For one day, how big is the dropped $\mu^{2}$
          compared with the variance, and what happens to all the dropped
          terms as the rebalancing interval shrinks to zero?
        hint: >
          Over an interval $\Delta t$, the mean is proportional to $\Delta t$
          and the variance to $\Delta t$. What is the square of the mean
          proportional to?
        answer: >
          Per day, $0.0002^{2} = 4 \times 10^{-8}$ against a variance of
          $1.6 \times 10^{-4}$: a four-thousandth of it. In general the
          squared mean scales like $\Delta t^{2}$ and the higher terms like
          $\Delta t^{3/2}$ or smaller, while the kept terms scale like
          $\Delta t$. Over a year there are $1/\Delta t$ intervals, so the kept
          terms add up to a fixed amount and the dropped ones add up to
          something that vanishes as $\Delta t \to 0$. In the limit the
          parabola is exact.

      - part: The exact parabola
        teach: >
          That is continuous Kelly. With continuous rebalancing the log-wealth
          drift is exactly $g(f) = r + f(\mu - r) - \frac{f^{2}\sigma^{2}}{2}$,
          the subtracted term being the volatility drag on a position whose
          volatility is $f\sigma$. Its peak is $f^{*} = (\mu - r)/\sigma^{2}$,
          with growth $r + S^{2}/2$ where $S = (\mu - r)/\sigma$. Equivalently
          $f^{*} = S/\sigma$.
      - ask: >
          What is the growth rate at $f^{*} = 1.25$, per year?
        expects: "0.04125"
        tolerance: 0.00001
        hint: >
          The Sharpe ratio is $0.05/0.2$.
        feedback: >
          $S = 0.25$, so $r + S^{2}/2 = 0.01 + 0.03125 = 0.04125$: about
          $4.1\%$ a year of log growth.
      - ask: >
          Unlevered, at $f = 1$, what is the growth rate per year?
        expects: "0.04"
        hint: >
          $r + f(\mu - r) - f^{2}\sigma^{2}/2$ at $f = 1$.
        feedback: >
          $0.01 + 0.05 - 0.04/2 = 0.04$. Levering up to $1.25$ adds only
          $0.00125$ a year: the extra edge, $0.25 \times 0.05 = 0.0125$, less
          the extra drag, $(1.5625 - 1)(0.04)/2 = 0.01125$. Near the peak the
          curve is flat.
      - ask: >
          Cash rates rise from $1\%$ to $4\%$, and the index's expected return
          rises by the same three points, so it still beats cash by $5\%$.
          What changes?
        choices:
          - text: >
              Nothing at all: $r$ does not appear in $f^{*}$.
            feedback: >
              It does not appear in $f^{*}$, but it is the first term of the
              growth rate. Growth rises from about $4.1\%$ to about $7.1\%$.
          - text: >
              The stake stays at $1.25$, and the growth rate rises by three
              points to $0.07125$.
            correct: true
            feedback: >
              Right. Sizing depends only on the excess return and the
              variance. The riskless rate is earned on top, by every $f$.
          - text: >
              The stake rises, because the index now returns more.
            feedback: >
              Its return over cash, which is what the stake is paid for, has
              not moved. $f^{*} = 0.05/0.04 = 1.25$ still.
        feedback: >
          $r$ drops out of how much to hold and stays in how fast you grow.
          Conflating the two loses a term.

      - part: Leverage, and where the model breaks
        ask: >
          A low-volatility strategy has a Sharpe ratio of $0.5$ and a
          volatility of $5\%$ a year. What fraction of wealth does continuous
          Kelly hold in it?
        expects: "10"
        hint: >
          $f^{*} = S/\sigma$.
        feedback: >
          $0.5/0.05 = 10$: ten times levered. A small volatility means each
          unit carries little risk, so the stake grows until the position's
          own volatility, $f\sigma = 50\%$, matches its Sharpe ratio.
      - ask: >
          At $f = 10$, the strategy gaps down $10\%$ overnight, before you can
          rebalance. What happens?
        choices:
          - text: >
              You lose $10\%$, like everyone else holding it.
            feedback: >
              You hold ten times your wealth in it. Your wealth is multiplied
              by $1 + 10(-0.1) = 0$.
          - text: >
              Nothing the model did not price: the drag term covers large
              moves.
            feedback: >
              The drag term is the price of continuous wiggles you rebalance
              through. A jump you cannot trade through is not in the model at
              all.
          - text: >
              Wealth is multiplied by $1 + 10(-0.1) = 0$; the model assumed the
              price moves continuously, so you could always rebalance in time.
            correct: true
            feedback: >
              Right. Continuous Kelly is exact for continuous paths. A gap of
              $1/f$ or more wipes out a levered position, and nothing in
              $f^{*} = (\mu - r)/\sigma^{2}$ sees it coming.
        feedback: >
          Kelly leverage of $10$ is honest under the model's assumptions, and
          a $10\%$ gap is ordinary for many assets. Whether the asset can jump
          is the first thing to ask before taking it.
  - node: quant-games.kelly.overbetting
    hook: >
      "What happens if you bet double your Kelly size?" is the standard
      follow-up once you have stated $f^{*}$, and the honest answer — exactly
      zero growth, despite every individual bet still having positive expected
      value — is the single fact from this subject people remember longest.
    explanation: >
      The exact continuous growth curve $g(f)=f\mu-f^2\sigma^2/2$ from
      quadratic-approximation is a downward parabola, and every downward
      parabola through the origin has a second root: here it is $f=2f^{*}$,
      since substituting $\mu=f^{*}\sigma^2$ from the first-order condition
      gives $g(2f^{*})=2f^{*}\mu-2f^{*2}\sigma^2=2f^{*}\mu-2f^{*}\mu=0$. So
      the curve is zero at $f=0$ and again at $f=2f^{*}$, positive strictly
      between them, and negative beyond.

      Writing any stake as a multiple $f=cf^{*}$ of the optimum makes the
      whole curve one formula: $g(cf^{*})=(2c-c^2)g^{*}$, where
      $g^{*}=g(f^{*})$ is the peak growth. This expression is worth carrying
      around — it says $c=0.5$ keeps $2(0.5)-0.25=0.75$, three quarters of
      maximal growth, at half the stake; $c=2$ gives $2(2)-4=0$ exactly, not
      approximately; and $c>2$ gives a negative coefficient, so the bankroll
      decays toward zero even though each individual bet still wins more often
      than it needs to be fair. The discrete binary bet follows this shape
      closely near the peak and departs slightly worse beyond it, but the
      double-Kelly zero-crossing is close to exact in both cases.
    worked: >
      A bet has $\mu=0.04$, $\sigma^2=0.08$, so $f^{*}=0.5$ and peak growth
      $g^{*}=(0.04)^2/(2\times0.08)=0.01$, or $1\%$ per period. Stake $1.5$
      times Kelly instead, $f=0.75$: the formula predicts
      $(2(1.5)-1.5^2)g^{*}=(3-2.25)(0.01)=0.0075$, and direct substitution
      confirms it — $g(0.75)=0.75(0.04)-0.75^2(0.08)/2=0.03-0.0225=0.0075$.
      Overbetting by $50\%$ still leaves $75\%$ of the growth, $0.75\%$ per
      period, but push to $c=2$ and that same arithmetic gives exactly zero.
    interview: >
      Once you have produced $f^{*}$, expect "what if you bet twice that?" as
      a near-automatic follow-up — the strong answer states the growth is
      exactly zero at $c=2$, not just "lower," and turns negative beyond it,
      which is the fact interviewers are actually probing for.
    pitfalls: >
      Assuming growth scales roughly with stake size — it is a parabola, not a
      line, so doubling the stake past the optimum can erase all of the growth
      rather than doubling it. Also, $c=2$ giving zero growth does not mean
      the individual bets stopped being favorable; each round still wins more
      than a fair coin would, it is the compounding that turns neutral.
    recap: >
      Growth is a parabola vanishing at $f=0$ and $f=2f^{*}$: half Kelly keeps
      three quarters of the growth, double Kelly keeps none, and beyond double
      Kelly a favorable bet loses money.
    dialogue:
      - part: An enthusiastic colleague
        teach: >
          A trading signal earns, per unit staked per period, a mean of
          $0.02$ with variance $0.04$, small enough that the growth curve is
          $g(f) = f\mu - f^{2}\sigma^{2}/2 = 0.02f - 0.02f^{2}$. A colleague,
          convinced by the edge, stakes $f = 1$.
      - ask: >
          What is the colleague's growth rate per period?
        expects: "0"
        feedback: >
          $g(1) = 0.02 - 0.02 = 0$. A thousand periods of favourable bets,
          and the typical bankroll goes nowhere.
      - ask: >
          Every period, each unit staked still earns $0.02$ in expectation.
          How can growth be zero?
        choices:
          - text: >
              It cannot; the parabola must be wrong at $f = 1$.
            feedback: >
              The parabola is the right growth curve for small per-period
              swings, and $f = 1$ is well inside its range here. The zero is
              real.
          - text: >
              The bet stops being favourable at $f = 1$.
            feedback: >
              Favourability is per unit staked, $\mu = 0.02$, and does not
              depend on how many units you stake. Every bet the colleague
              places is still a good bet.
          - text: >
              The expected profit, $f\mu = 0.02$, is exactly cancelled by the
              variance drag, $f^{2}\sigma^{2}/2 = 0.02$.
            correct: true
            feedback: >
              Right. The profit term grows like $f$, the drag like $f^{2}$, and
              at $f = 1$ they meet.
        feedback: >
          A stake can be large enough that a stream of favourable bets goes
          nowhere. Where exactly is that point, and where is the best stake?
      - ask: >
          What is $g(0.25)$?
        expects: "0.00375"
        tolerance: 0.000001
        feedback: >
          $0.02(0.25) - 0.02(0.0625) = 0.005 - 0.00125 = 0.00375$.
      - ask: >
          And $g(0.75)$?
        expects: "0.00375"
        tolerance: 0.000001
        feedback: >
          $0.02(0.75) - 0.02(0.5625) = 0.015 - 0.01125 = 0.00375$. The same as
          at $0.25$.
      - reflect: >
          Stakes $0.25$ and $0.75$ grow equally; stakes $0$ and $1$ both give
          zero. What shape forces that, where is its peak, and where are its
          zeros in terms of the peak?
        hint: >
          Which curves take equal values at equal distances either side of a
          point?
        answer: >
          A downward parabola through the origin, symmetric about its peak.
          The peak is halfway between the equal values, at
          $f^{*} = \mu/\sigma^{2} = 0.5$, and the second zero is as far beyond
          the peak as the origin is before it: $f = 2f^{*} = 1$. The colleague
          staked exactly double Kelly.

      - part: One formula for the whole curve
        teach: >
          That is the double-Kelly cliff. Write any stake as a multiple of the
          optimum, $f = cf^{*}$. Since $\mu = f^{*}\sigma^{2}$, the growth is
          $g(cf^{*}) = (2c - c^{2})g^{*}$, where $g^{*}$ is the peak growth.
          It is zero at $c = 0$ and $c = 2$, positive between, and negative
          beyond $c = 2$, where the bankroll tends to $0$ almost surely while
          every bet is favourable.
      - ask: >
          Here $g^{*} = g(0.5) = 0.005$. What is the growth at $f = 1.25$, two
          and a half times Kelly?
        expects: "-0.00625"
        tolerance: 0.00001
        feedback: >
          $c = 2.5$, so $2c - c^{2} = 5 - 6.25 = -1.25$ and the growth is
          $-1.25 \times 0.005 = -0.00625$ per period. Check directly:
          $0.02(1.25) - 0.02(1.5625) = 0.025 - 0.03125$.
      - ask: >
          What fraction of the peak growth does half Kelly keep?
        expects: "0.75"
        feedback: >
          $2(0.5) - 0.25 = 0.75$: three quarters of the growth for half the
          stake.
      - ask: >
          Which over-bet $c > 1$ keeps the same three quarters?
        expects: "1.5"
        hint: >
          The parabola is symmetric about $c = 1$.
        feedback: >
          $2(1.5) - 2.25 = 0.75$. Equal distances either side of the peak cost
          the same, but in proportion they are very different: a factor of
          $2$ below the optimum costs a quarter of the growth, a factor of
          $2$ above it costs all of it.

      - part: The discrete bet, past the cliff
        ask: >
          The parabola is exact only in the continuous limit. Take an
          even-money bet that wins $55\%$ of the time, so $f^{*} = 0.1$, and
          stake double Kelly, $f = 0.2$. What is the exact $g(0.2)$, to five
          decimal places? Use $\ln 1.2 = 0.182322$ and $\ln 0.8 = -0.223144$.
        expects: "-0.00014"
        tolerance: 0.00003
        feedback: >
          $0.55(0.182322) + 0.45(-0.223144) = 0.100277 - 0.100415$, about
          $-0.00014$. Slightly negative, where the parabola
          $f\mu - f^{2}\mathbb{E}[X^{2}]/2 = 0.1f - f^{2}/2$ says exactly $0$.
      - ask: >
          What does that small negative number tell you?
        choices:
          - text: >
              Nothing: it is rounding error around zero.
            feedback: >
              The logarithms are given to six places, and the difference is
              in the fourth significant figure of each term. It is real.
          - text: >
              The exact curve sits a little below the parabola for large
              stakes, so it crosses zero slightly before $2f^{*}$.
            correct: true
            feedback: >
              Right. The parabola keeps two terms of $\ln(1 + y)$; the terms it
              drops make large losses cost more still. For a discrete bet
              double Kelly is slightly worse than zero growth.
          - text: >
              The Kelly fraction for this bet is not really $0.1$.
            feedback: >
              At even money $f^{*} = 2p - 1 = 0.1$ exactly. What differs is the
              curve away from the peak, not the location of the peak.
        feedback: >
          Half Kelly keeps three quarters, double Kelly keeps nothing — and on
          a real discrete bet a shade less than nothing.
  - node: quant-games.kelly.fractional
    hook: >
      "Would you actually bet full Kelly with real money?" is the natural next
      question, and the correct answer is no — for three separate quantitative
      reasons, not a vague appeal to caution.
    explanation: >
      The first reason is the asymmetry already visible in the
      growth-versus-multiplier curve from overbetting: because
      $g(cf^{*})=(2c-c^2)g^{*}$ is symmetric around $c=1$ but the damage
      compounds past $c=2$, betting half of $f^{*}$ costs $25\%$ of the growth
      while betting double costs everything — the penalty for erring small is
      mild and the penalty for erring large is catastrophic, so any
      uncertainty about the right stake should be resolved downward.

      The second reason is variance: log-wealth volatility per round scales
      with $f$, so halving the stake halves the swing in log wealth and
      quarters its variance, buying three quarters of the growth for a quarter
      of the variance — a trade almost anyone would take.

      The third reason is the sharpest one and the one people miss: the curve
      is flat near its own peak in $f$, meaning small errors in the stake cost
      little growth, but the location of that peak, $f^{*}$, depends on $p$ or
      $\mu$, which are never known exactly — they are estimated from limited
      data. An error in the input translates roughly linearly into an error in
      $f^{*}$ itself, and betting full Kelly on an overestimated edge is
      precisely betting some multiple $c>1$ of the true optimum, landing on
      the wrong side of the curve you thought was flat.
    worked: >
      Suppose the true win probability is $p=0.52$ at even money, so the true
      optimum is $f^{*}=0.04$. You estimate $p=0.60$ instead — an eight-point
      overestimate that feels minor — and bet the corresponding "full Kelly"
      of $f=0.20$, five times the true optimum. Plugging the true $p=0.52$
      into the growth function at that stake gives
      $g(0.20)=0.52\ln(1.2)+0.48\ln(0.8)\approx-0.0123$ — the bankroll shrinks
      by about $1.23\%$ per round, a real loss produced by a bet that,
      correctly measured, still has a positive edge.
    interview: >
      The expected answer names a specific fraction — a quarter to a half of
      $f^{*}$ — and states at least one of the three reasons in quantitative
      terms, not just "it's risky to bet the full amount."
    pitfalls: >
      Conflating the two kinds of flatness: the growth curve is forgiving of
      small errors in how much you stake near the true optimum, but that says
      nothing about how much error there is in locating the optimum from a
      noisy probability estimate. Also, shading the estimated edge up to
      compensate for uncertainty is backwards — always shade the stake down,
      never the input.
    recap: >
      Bet a quarter to a half of $f^{*}$: it costs little growth, cuts
      variance sharply, and protects against betting full Kelly on an edge you
      have overestimated.
    dialogue:
      - part: An edge you are not sure of
        teach: >
          Your model says an even-money bet wins $57\%$ of the time, so full
          Kelly on your estimate is $f = 0.14$. Honestly, the true probability
          could be $53.5\%$ or $60.5\%$, and you cannot tell which. Throughout,
          use the growth curve $g(cf^{*}) = (2c - c^{2})g^{*}$, where $f^{*}$
          is the *true* Kelly fraction.
      - ask: >
          Suppose the truth is $53.5\%$. You stake $0.14$. What fraction of the
          true peak growth $g^{*}$ do you get?
        expects: "0"
        hint: >
          Find the true $f^{*}$ first, then $c$, the ratio of your stake to it.
        feedback: >
          The true $f^{*} = 2(0.535) - 1 = 0.07$, so $c = 0.14/0.07 = 2$ and
          $2c - c^{2} = 0$. A $3.5$-point overestimate of $p$ put you on the
          double-Kelly cliff.
      - ask: >
          Suppose instead the truth is $60.5\%$. What fraction of the true
          $g^{*}$ does the same $0.14$ stake get? Give an exact fraction.
        expects: "8/9"
        tolerance: 0.001
        feedback: >
          The true $f^{*} = 0.21$, so $c = 0.14/0.21 = 2/3$ and
          $2(2/3) - 4/9 = 8/9$. Under-betting by a third costs only a ninth.
      - ask: >
          Now stake half your estimate, $0.07$. In the $53.5\%$ world that is
          exactly the true Kelly stake. What fraction of $g^{*}$ does it get in
          the $60.5\%$ world? Give an exact fraction.
        expects: "5/9"
        tolerance: 0.001
        feedback: >
          $c = 0.07/0.21 = 1/3$, so $2/3 - 1/9 = 5/9$.
      - ask: >
          Full estimate keeps $0$ or $8/9$ of the growth; half keeps $1$ or
          $5/9$. Which stake do you want?
        choices:
          - text: >
              The full $0.14$: in the better world it keeps $8/9$.
            feedback: >
              And in the other world it keeps nothing. You are buying an extra
              third of growth in one world with all of it in the other.
          - text: >
              The half stake: its worst case keeps $5/9$, while the full
              stake's worst case keeps nothing.
            correct: true
            feedback: >
              Right. The half stake gives up a little in the good world and
              saves everything in the bad one.
          - text: >
              Neither: collect more data until $p$ is known.
            feedback: >
              More data narrows the range; it never closes it. A stake has to
              be chosen under some uncertainty, and the question is which side
              to err on.
        feedback: >
          Missing the optimum on the low side is cheap; missing it on the high
          side is ruinous. Uncertainty about the edge pushes the stake down.
      - reflect: >
          You can never know which world you are in. Turn what just happened
          into a rule for sizing a bet whose edge is estimated, and say why an
          error in one direction costs so much more than the same error in the
          other.
        hint: >
          Compare under-betting by a factor of $2$ with over-betting by a
          factor of $2$ on the curve $(2c - c^{2})g^{*}$.
        answer: >
          Stake a fraction of the estimated Kelly fraction, never more. The
          growth curve falls off as $(1 - c)^{2}$ either side of $c = 1$, so
          halving the stake costs a quarter of the growth while doubling it
          costs all of it. An overestimated edge is exactly an unintended
          over-bet, so the stake should be shaded down by enough to survive
          the plausible overestimates.

      - part: Fractional Kelly, and what it buys
        teach: >
          That is fractional Kelly: stake $cf^{*}$, with $c$ between $0.25$ and
          $0.5$ in practice. Three reasons, all quantitative. The growth curve
          is asymmetric in proportion: halving costs $25\%$, doubling costs
          everything. Log-wealth volatility is proportional to $f$, so half
          Kelly halves the swings and quarters their variance. And the optimum
          is flat in $f$ but its *location* moves with the estimated edge.
      - ask: >
          At quarter Kelly, $c = 0.25$, what fraction of the peak growth do you
          keep?
        expects: "0.4375"
        feedback: >
          $2(0.25) - 0.0625 = 0.4375$, a little under half the growth.
      - ask: >
          And what fraction of full Kelly's variance of log wealth do you
          carry?
        expects: "0.0625"
        hint: >
          The volatility is proportional to the stake.
        feedback: >
          The volatility scales by $0.25$ and the variance by
          $0.25^{2} = 0.0625$. Quarter Kelly keeps $44\%$ of the growth for
          $6.25\%$ of the variance.

      - part: Three ways to get the shading wrong
        ask: >
          A colleague objects: "Optima are flat. Missing the stake a little
          hardly costs anything, so full Kelly on my estimate is fine." What is
          wrong with the argument?
        choices:
          - text: >
              Nothing: near the peak, growth is insensitive to the stake.
            feedback: >
              Near the *true* peak, yes. The colleague is not near it: an
              error of $0.035$ in $p$ moved the true $f^{*}$ from $0.14$ to
              $0.07$, so the stake was off by a factor of $2$.
          - text: >
              Flatness is about small stake errors around the true peak; an
              error in the edge moves the peak itself, by as much as the edge
              is off.
            correct: true
            feedback: >
              Right. At even money $f^{*} = 2p - 1$, so every point of error in
              $p$ is two points of error in $f^{*}$ — large compared with
              $f^{*}$ when the edge is small.
          - text: >
              Optima are flat only for continuous bets, not binary ones.
            feedback: >
              The binary growth curve is flat at its peak too. The problem is
              not the shape of the curve but where the estimate puts you on
              it.
        feedback: >
          Flat optimum, moving optimum: the stake error a noisy edge produces
          is not small, so the flatness does not protect you.
      - ask: >
          Why not go further and stake a tenth of Kelly, $c = 0.1$? What
          fraction of the peak growth would that keep?
        expects: "0.19"
        feedback: >
          $2(0.1) - 0.01 = 0.19$. You would give up over four fifths of the
          growth to survive overestimating $f^{*}$ as much as twentyfold —
          far more caution than a reasonable estimate needs. The fraction
          should match the uncertainty, not the fear.
      - ask: >
          To be safe, a trader rounds the estimated win probability up from
          $57\%$ to $62\%$ "so the bet clearly clears the bar", then stakes
          half Kelly on $62\%$. What has happened?
        choices:
          - text: >
              Nothing harmful: half Kelly is conservative whatever the input.
            feedback: >
              Half Kelly is conservative relative to its input. On an input
              inflated to $62\%$ it stakes $0.12$, against an honest half
              stake of $0.07$.
          - text: >
              Half of $2(0.62) - 1 = 0.24$ is $0.12$, nearly the full $0.14$
              of honest Kelly: the halving has been mostly undone.
            correct: true
            feedback: >
              Right. In the $53.5\%$ world, $c = 0.12/0.07 \approx 1.7$, which
              keeps about half the growth where the honest half stake kept all
              of it. Shade the stake, never the estimate.
          - text: >
              The trader has been doubly cautious.
            feedback: >
              Rounding $p$ up is the opposite of caution: it inflates the
              computed $f^{*}$ from $0.14$ to $0.24$ before the halving even
              starts.
        feedback: >
          The estimate should be honest; the caution goes on the stake. A
          quarter to a half of the honest $f^{*}$ is where desks end up.
  - node: quant-games.kelly.drawdown
    hook: >
      "If you bet full Kelly forever, what's the chance you ever lose half
      your bankroll?" has a specific, surprisingly large numerical answer, and
      knowing it cold is what separates someone who has internalized Kelly
      from someone who has only memorized the formula.
    explanation: >
      Under the continuous approximation, log wealth staking $cf^{*}$ behaves
      as a Brownian motion with drift $m=(2c-c^2)g^{*}$ and variance rate
      $s^2=2c^2g^{*}$, both expressed in terms of the full-Kelly peak growth
      $g^{*}$ from quadratic-approximation. A standard first-passage result
      for Brownian motion with positive drift $m$ and variance rate $s^2$
      gives the probability it ever falls a level $L$ below its start as
      $e^{-2mL/s^2}$; setting $L=\ln(1/\alpha)$, the log-distance to a
      bankroll fraction $\alpha$ of the start, and substituting $m$ and $s^2$
      collapses the exponent to a clean power law, because $g^{*}$ cancels
      entirely: $\Pr(\text{bankroll ever falls to }\alpha
      W_0)=\alpha^{2/c-1}$.

      At full Kelly, $c=1$, the exponent is exactly $1$, so the probability of
      ever hitting level $\alpha$ is simply $\alpha$ — a self-similar,
      scale-free result independent of the specific edge. That is a strikingly
      large number for common thresholds: a $50\%$ drawdown has probability
      exactly $1/2$ at full Kelly. Shading to a fraction $c<1$ raises the
      exponent above $1$, a large effect precisely because it is a power, not
      a linear discount — and because the bound is scale-free, it reapplies
      from every new high-water mark, so surviving one drawdown buys no
      immunity from the next.
    worked: >
      At full Kelly ($c=1$), the probability of ever falling to $\alpha=0.2$
      of the starting bankroll — an $80\%$ loss — is
      $0.2^{2/1-1}=0.2^{1}=0.2$, a $1$-in-$5$ chance. At quarter Kelly
      ($c=0.25$), the exponent becomes $2/0.25-1=7$, so the same $80\%$-loss
      probability drops to $0.2^{7}\approx0.0000128$ — about $1$ in $78000$.
    interview: >
      A strong answer to "what's the drawdown risk of full Kelly" states the
      exact number: probability $\alpha$ of ever falling to fraction $\alpha$
      of the bankroll, hence exactly $1/2$ for a halving — a fact many people
      who can recite $f^{*}=(bp-q)/b$ cannot produce.
    pitfalls: >
      Treating "growth-optimal" as synonymous with "safe" — full Kelly is
      optimal for long-run growth and simultaneously has a $50\%$ chance of a
      drawdown of half or worse at some point. Also, forgetting the bound
      resets from every new high-water mark, so a bettor who has already
      survived one deep drawdown is not thereby protected from the next one.
    recap: >
      At full Kelly the probability of ever falling to a fraction $\alpha$ of
      the starting bankroll is exactly $\alpha$; at fractional Kelly $cf^{*}$
      it is $\alpha^{2/c-1}$, far smaller for $c<1$.
    dialogue:
      - part: The investors' question
        teach: >
          You run a strategy at full Kelly, reinvesting everything, with no
          end date. Your investors ask one question: what is the chance that,
          at some point, the bankroll is down to $40\%$ of where it started?
      - ask: >
          Before any calculation, which answer do you expect?
        choices:
          - text: >
              About $1\%$: Kelly is the growth-optimal strategy, and a $60\%$
              loss is extreme.
            feedback: >
              Growth-optimal is not the same as gentle. The answer turns out
              to be forty times larger.
          - text: >
              Zero: fixed-fraction betting never goes broke.
            feedback: >
              It never reaches zero, but nothing stops it falling to $40\%$ of
              the start. The question is about a drawdown, not ruin.
          - text: >
              About $40\%$.
            correct: true
            feedback: >
              Right, and exactly $40\%$ in the diffusion model. The rest of
              the lesson shows why it comes out equal to the level itself.
        feedback: >
          At full Kelly the chance of ever falling to a fraction $\alpha$ of
          the start is $\alpha$. Here is where that comes from.
      - ask: >
          In the continuous model, staking $f$ gives log wealth a volatility of
          $f\sigma$. At full Kelly, $f^{*} = \mu/\sigma^{2}$, so the variance
          rate of log wealth is $s^{2} = (f^{*})^{2}\sigma^{2} = \mu^{2}/\sigma^{2}$.
          In terms of the peak growth $g^{*} = \mu^{2}/(2\sigma^{2})$, what is
          $s^{2}$?
        choices:
          - text: >
              $g^{*}$
            feedback: >
              $g^{*}$ has a $2$ in its denominator that $\mu^{2}/\sigma^{2}$
              does not. The variance rate is twice $g^{*}$.
          - text: >
              $2g^{*}$
            correct: true
            feedback: >
              Right. At full Kelly the drift is $g^{*}$ and the variance rate
              is $2g^{*}$: both set by the same number.
          - text: >
              $(g^{*})^{2}$
            feedback: >
              Variance and growth are both rates per unit time, and here they
              are proportional. Squaring $g^{*}$ would make a tiny number of a
              moderate one.
        feedback: >
          At a fraction $c$ of Kelly, the drift is $m = (2c - c^{2})g^{*}$ and
          the volatility scales by $c$, so $s^{2} = 2c^{2}g^{*}$.
      - teach: >
          One fact about Brownian motion with drift $m > 0$ and variance rate
          $s^{2}$: the probability that it ever falls a distance $L$ below its
          starting point is $e^{-2mL/s^{2}}$. Falling to $\alpha W_0$ means log
          wealth falls by $L = \ln(1/\alpha)$.
      - ask: >
          At full Kelly, what is $2m/s^{2}$?
        expects: "1"
        feedback: >
          $2g^{*}/(2g^{*}) = 1$, whatever the edge.
      - reflect: >
          With $2m/s^{2} = 1$, what is the probability of ever falling to
          $\alpha W_0$? And why should the answer not depend on how large your
          edge is?
        hint: >
          Put $L = \ln(1/\alpha)$ into $e^{-L}$.
        answer: >
          $e^{-\ln(1/\alpha)} = \alpha$: the chance of ever falling to $40\%$
          is $0.4$, of ever halving is $0.5$. The edge cancels because a bigger
          edge means proportionally bigger bets: drift and variance both scale
          with $g^{*}$, so log wealth traces the same shape of path, only
          faster. The drawdown risk of full Kelly is a property of Kelly, not
          of the bet.

      - part: Shading the stake
        teach: >
          For a general fraction $c$ of Kelly, $2m/s^{2}$ is
          $2(2c - c^{2})g^{*}/(2c^{2}g^{*}) = 2/c - 1$, so the proposition is
          $\Pr(\text{bankroll ever falls to } \alpha W_0) = \alpha^{2/c - 1}$.
          At full Kelly it is $\alpha$; below full Kelly the exponent grows.
      - ask: >
          What is the exponent $2/c - 1$ at half Kelly?
        expects: "3"
        feedback: >
          $2/0.5 - 1 = 3$. The probability is now the cube of the level.
      - ask: >
          At half Kelly, what is the chance of ever falling to $40\%$ of the
          start?
        expects: "0.064"
        feedback: >
          $0.4^{3} = 0.064$, against $0.4$ at full Kelly: about a sixth of the
          risk, for three quarters of the growth.
      - ask: >
          At quarter Kelly, what is the chance of ever halving the bankroll?
          Give an exact fraction.
        expects: "1/128"
        hint: >
          Find the exponent first.
        feedback: >
          $2/0.25 - 1 = 7$, so $0.5^{7} = 1/128$, under $1\%$. Because the
          exponent is a power, each cut in $c$ buys a multiplicative drop in
          drawdown risk.

      - part: New highs, and the edge of the formula
        ask: >
          Years later, still at full Kelly, the bankroll stands at three times
          its start. What is the chance it ever falls back to $1.5$ times the
          start?
        expects: "0.5"
        hint: >
          Measure the fall from where the bankroll is now.
        feedback: >
          From $3W_0$, falling to $1.5W_0$ is halving, so the probability is
          $0.5$. The bound is scale-free: it reapplies in full from every new
          high, and surviving one drawdown buys no protection from the next.
      - ask: >
          A trader at $2.5$ times Kelly plugs $c = 2.5$ and $\alpha = 0.5$ into
          $\alpha^{2/c - 1}$ and gets $0.5^{-0.2} \approx 1.15$. What is going
          on?
        choices:
          - text: >
              A probability above $1$ means the drawdown happens more than
              once.
            feedback: >
              A probability is never above $1$. The formula has been used
              outside the case it was derived for.
          - text: >
              The formula assumed positive drift. At $c > 2$ the drift
              $(2c - c^{2})g^{*}$ is negative, so log wealth falls to every
              level with probability $1$.
            correct: true
            feedback: >
              Right. The hitting formula is for $m > 0$. Past double Kelly the
              bankroll drifts to zero, and every drawdown happens for sure.
          - text: >
              It means the risk is roughly the same as at full Kelly.
            feedback: >
              At full Kelly a halving has probability $0.5$. Past $c = 2$ it
              is certain, which is a different kind of statement altogether.
        feedback: >
          The formula covers $0 < c < 2$. At $c = 2$ the exponent is $0$ and
          the probability $1$; beyond it, certain decline.
  - node: quant-games.kelly.no-bankruptcy
    hook: >
      "Can Kelly betting go broke?" is a favorite trick question, and the
      honest answer distinguishes a mathematical guarantee from a practical
      one — proportional betting has no absorbing zero in the model, but two
      ordinary features of real markets put one back.
    explanation: >
      For $0\le f<1$ and a bet that cannot lose more than the stake, every
      round multiplier $1+fX$ is strictly positive — a loss shrinks the
      bankroll, but the fraction $1-f$ it gets multiplied by is always a
      positive number. So $W_n>0$ holds for every finite $n$: proportional
      betting has no absorbing state at exactly zero, unlike fixed-stake
      betting, where a large enough run of losses hits zero and the strategy
      simply cannot continue, since you cannot stake more than you have left.

      What replaces bankruptcy in this model is exponential decay rather than
      an abrupt stop: if $g(f)<0$, the overbetting result already shows the
      bankroll heads toward zero almost surely, just without ever touching it
      exactly — the same reason the Kelly objective can be maximized freely
      with no separate survival constraint bolted on, since a bad choice of
      $f$ is punished automatically by a negative growth rate rather than by
      an early stop.

      Two ordinary features of real trading restore genuine ruin. A minimum
      tradable size — a share, a lot, a dollar — turns proportional betting
      into fixed-stake betting once the bankroll gets small enough that the
      fraction no longer divides finely, and fixed stakes do have an absorbing
      barrier. And any position that can lose more than its own notional value
      — leverage, a short option — has some $f$ past which $1+fX$ genuinely
      goes negative, breaking the positivity argument at its foundation.
    worked: >
      Stake $f=0.5$ of a $1000$ bankroll every round, and suppose you lose
      $10$ rounds in a row: $W_{10}=1000\times(0.5)^{10}=1000/1024\approx0.98$
      — under a dollar, but strictly positive. Compare fixed-stake betting of
      $500$ per round instead: after one loss you have $500$ left, and after a
      second loss you have exactly $0$ and cannot place the next bet at all.
    interview: >
      The expected answer is the precise distinction — mathematically,
      proportional Kelly betting decays toward zero but never reaches it,
      while fixed-stake betting has a genuine absorbing barrier — followed
      immediately by naming what breaks the guarantee in practice: minimum bet
      sizes and instruments that can lose more than their stake.
    pitfalls: >
      Treating "Kelly never goes broke" as an unqualified real-world guarantee
      — it holds only in a model with infinitely divisible stakes and bounded
      losses. Also, "shrinks to a fraction of a cent" is not the same thing as
      "safe" just because it is technically nonzero.
    recap: >
      Fixed-fraction betting decays toward zero but can never hit it exactly —
      unlike fixed-stake betting, which has a genuine absorbing barrier at
      zero.
    dialogue:
      - part: Two gamblers, three losses
        teach: >
          Ana and Ben each start with $300$ on an even-money bet that favours
          them. Ana stakes a fixed $100$ every round. Ben stakes a third of
          whatever he holds at the moment. Both lose the first three rounds.
      - ask: >
          How much does Ana have left?
        expects: "0"
        feedback: >
          $300 - 3(100) = 0$. Ana cannot place a fourth bet; her edge is
          worth nothing now. A fixed stake has an absorbing barrier at zero.
      - ask: >
          How much does Ben have left, to the nearest cent?
        expects: "88.89"
        tolerance: 0.01
        hint: >
          Each loss multiplies his bankroll by $1 - 1/3$.
        feedback: >
          $300 \times (2/3)^{3} = 300 \times 8/27 \approx 88.89$. Hurt, and
          still betting.
      - ask: >
          Ben's luck stays bad: twenty straight losses. What does he hold, to
          the nearest tenth of a cent?
        expects: "0.090"
        tolerance: 0.0005
        feedback: >
          $300 \times (2/3)^{20} \approx 300 \times 0.000301 \approx 0.090$.
          Nine cents — and still a positive number.
      - ask: >
          Can Ben's bankroll ever be exactly $0$ after some finite number of
          rounds?
        choices:
          - text: >
              Yes, after enough losses the fraction rounds down to nothing.
            feedback: >
              Rounding belongs to real money, not to the model. In the model,
              every loss multiplies by $2/3$, and a product of positive
              numbers is positive.
          - text: >
              No: every round multiplies by $4/3$ or $2/3$, both positive, so
              the product stays positive forever.
            correct: true
            feedback: >
              Right. With $0 \le f < 1$ and a bet that cannot lose more than the
              stake, every factor $1 + fX$ is strictly positive.
          - text: >
              Yes, if his edge is negative.
            feedback: >
              A bad edge changes how often he loses, not what a loss does. Each
              loss still multiplies by $2/3$.
        feedback: >
          Proportional betting has no absorbing state at zero. Ana's ruin was
          a moment; Ben's danger, if any, has to be something else.
      - reflect: >
          Ben can never reach zero. In what sense can a fixed-fraction bettor
          still be ruined, and what takes the place of the moment of ruin?
        hint: >
          Think about the growth rate $g(f)$ and what $W_n \approx W_0 e^{ng}$
          does when $g < 0$.
        answer: >
          Ruin becomes a rate instead of an event. If $g(f) < 0$ the bankroll
          decays exponentially, $W_n \approx W_0 e^{n g(f)} \to 0$ almost
          surely, without ever reaching zero. That is why the Kelly objective
          needs no separate survival constraint: a reckless $f$ is punished by
          a negative growth rate, not by a hard stop.

      - part: Decay instead of ruin
        teach: >
          That is the proposition. For $0 \le f < 1$ and a bet that cannot
          lose more than the stake, $W_n > 0$ for every $n$: fixed-fraction
          betting cannot go bankrupt. What replaces bankruptcy is exponential
          decay at the rate $g(f)$ whenever $g(f) < 0$.
      - ask: >
          An even-money bet wins $55\%$ of the time; its Kelly fraction is
          $0.1$. A bettor stakes $f = 0.25$. What is $g(0.25)$, to four decimal
          places? Use $\ln 1.25 = 0.223144$ and $\ln 0.75 = -0.287682$.
        expects: "-0.0067"
        tolerance: 0.0005
        feedback: >
          $0.55(0.223144) + 0.45(-0.287682) = 0.122729 - 0.129457$, about
          $-0.0067$. At two and a half times Kelly, a winning bet shrinks the
          bankroll.
      - ask: >
          Roughly what fraction of the starting bankroll is left after $1000$
          rounds, $e^{1000g}$?
        expects: "0.0012"
        tolerance: 0.0002
        feedback: >
          $e^{-6.73} \approx 0.0012$. A bankroll of $100000$ is down to about
          $120$: never bankrupt, and in every practical sense ruined.

      - part: Two ways to put zero back
        ask: >
          The casino has a minimum stake of $1$. A bettor whose Kelly fraction
          is $0.1$ is down to a bankroll of $3$. What fraction of the bankroll
          is the smallest allowed bet? Give an exact fraction.
        expects: "1/3"
        feedback: >
          $1/3$ — more than three times Kelly, and forced. Once the bankroll is
          small, the minimum stake turns proportional betting into fixed-stake
          betting, and three straight losses reach zero.
      - ask: >
          A fund writes put options, committing $f = 0.4$ of its capital to
          the position. In a crash the position loses three times the amount
          committed. By what number is the fund's capital multiplied?
        expects: "-0.2"
        hint: >
          The multiplier is $1 + fX$ with $f = 0.4$ and $X = -3$.
        feedback: >
          $1 + 0.4(-3) = 1 - 1.2 = -0.2$. The fund has lost all its capital
          and owes another fifth of it.
      - ask: >
          Which clause of the proposition did the fund break?
        choices:
          - text: >
              $f < 1$: the fund staked too much.
            feedback: >
              It staked $0.4$ of its capital, well inside $0 \le f < 1$. The
              fraction was modest; what it was staked on was not.
          - text: >
              The bet could lose more than the stake: $X = -3$, so the factor
              $1 + fX$ went negative.
            correct: true
            feedback: >
              Right. Positivity of every factor is the whole proof, and it
              rests on $X \ge -1$. Short options, and leverage on assets that
              can gap, can lose more than their notional, and then the barrier
              at zero is back.
          - text: >
              Independence of the rounds.
            feedback: >
              One day's loss did all the damage; no dependence between days
              was needed. What failed is the positivity of a single factor.
        feedback: >
          Two ordinary features restore real ruin: a minimum bet size, and any
          position that can lose more than it puts up. In an interview, state
          the guarantee first and these two caveats right after.
  - node: quant-games.kelly.simultaneous-bets
    hook: >
      A real book holds many positions at once, and sizing each one with its
      own standalone Kelly fraction — as if it were the only bet in the world
      — badly overstates how much total risk to take once those positions are
      correlated.
    explanation: >
      Bets that settle together share one bankroll and land in the same
      multiplier for that round, unlike sequential bets, each of which gets to
      compound onto a bankroll already updated by the previous outcome. That
      distinction is the whole reason simultaneous sizing is a different
      problem from the single-bet case in continuous-kelly: stakes cannot be
      chosen one at a time in isolation, because their risks combine before
      the next round even starts.

      In the continuous Gaussian case the generalization is a direct extension
      of the scalar formula: instead of maximizing $f\mu-f^2\sigma^2/2$ over a
      single number, maximize $f'\mu-\frac{1}{2}f'\Sigma f$ over a weight
      vector $f$, where $\Sigma$ is the covariance matrix of the bets'
      returns. The optimum is $f^{*}=\Sigma^{-1}\mu$ — the same
      edge-over-variance shape as before, with the covariance matrix now
      standing in for a single variance. The qualitative reading matters more
      than the linear algebra: positively correlated bets behave like one
      larger bet wearing two labels, and the joint optimum shrinks each of
      them below what its own standalone Kelly fraction would say, precisely
      to avoid double-counting the shared risk.
    worked: >
      Two independent bets each have mean profit $0.05$ per unit staked and
      variance $0.10$; sized independently, each gets $f^{*}=0.05/0.10=0.5$,
      for a total exposure of $1.0$ across both. Now suppose instead the two
      bets are perfectly correlated — the same underlying risk wearing two
      names — so one unit on each is a single combined position with mean
      $0.05+0.05=0.10$ and variance $(\sqrt{0.10}+\sqrt{0.10})^2=0.40$. Its
      optimum is $0.10/0.40=0.25$ units of the pair, which is $0.25$ on each
      bet and a total exposure of $0.5$ — half the $1.0$ that treating them as
      independent would have prescribed.
    interview: >
      If an interviewer describes two correlated edges, the expected instinct
      is "no, you cannot size them separately" — followed by the reasoning
      that a shared bankroll under one multiplier means correlated risk must
      be shrunk jointly, with $\Sigma^{-1}\mu$ as the clean answer if pressed
      for the Gaussian formula.
    pitfalls: >
      Summing standalone Kelly fractions across correlated positions — this
      badly overstates the safe total exposure: by a factor of two for the
      perfectly correlated pair in the worked example, and by a factor of $n$
      for $n$ copies of one risk. Also, assuming independence by
      default: most real trading positions share some risk factor, and
      treating them as independent when they are not is the error this
      technique exists to prevent.
    recap: >
      Bets that settle together share a bankroll and must be sized jointly,
      not separately — in the Gaussian case the optimum is the vector
      $\Sigma^{-1}\mu$, and correlated bets are one bet in disguise.
    dialogue:
      - part: Two desks, one bankroll
        teach: >
          Two desks share one firm's bankroll. Each runs a strategy with an
          excess return of $0.03$ per period and variance $0.06$, and each desk
          head, sizing alone with continuous Kelly, asks for her share of the
          capital.
      - ask: >
          What fraction does each desk ask for?
        expects: "0.5"
        feedback: >
          $\mu/\sigma^{2} = 0.03/0.06 = 0.5$ each, so between them the desks
          want the whole bankroll.
      - ask: >
          Then you discover that both desks trade the same signal: their
          returns are perfectly correlated. With $0.5$ on each, the firm has
          $1$ on what is really one strategy. What is the firm's growth rate?
        expects: "0"
        hint: >
          One strategy whose Kelly fraction is $0.5$ is being run at $1$.
        feedback: >
          That is $c = 2$, double Kelly: $(2c - c^{2})g^{*} = 0$. Two desks each
          sizing correctly on its own have put the firm on the cliff.
      - ask: >
          Still perfectly correlated, how much should go on each desk?
        expects: "0.25"
        feedback: >
          The firm should hold $0.5$ of one strategy in total, split as $0.25$
          per desk: half of what each asked for.
      - ask: >
          Suppose instead the two strategies were independent. What is the
          joint optimum?
        choices:
          - text: >
              $0.25$ each: the bankroll is shared, so the stakes must be
              split.
            feedback: >
              Sharing a bankroll costs nothing when the risks do not interact.
              The joint growth is
              $(0.03f_1 - 0.03f_1^{2}) + (0.03f_2 - 0.03f_2^{2})$, two separate
              parabolas, each peaking at $0.5$.
          - text: >
              $0.5$ each, as each desk asked.
            correct: true
            feedback: >
              Right. With independent risks the variance of the total is the
              sum of the variances, the growth rate splits into two separate
              problems, and each is solved alone.
          - text: >
              $1$ each: diversification lets each desk double up.
            feedback: >
              Independence keeps one desk's risk from adding to the other's;
              it does not reduce either desk's own. Each parabola still peaks
              at $0.5$.
        feedback: >
          Independent: no adjustment. Perfectly correlated: halve both. The
          difference has to live in one term of the joint growth rate.
      - reflect: >
          Which term of the joint growth rate $g(f_1, f_2)$ makes the
          difference between the independent case and the correlated one,
          and what would take the place of $\mu/\sigma^{2}$ for many bets at
          once?
        hint: >
          Write the variance of $f_1X_1 + f_2X_2$.
        answer: >
          The variance of the combined position is
          $f_1^{2}\sigma_1^{2} + f_2^{2}\sigma_2^{2} + 2f_1f_2\rho\sigma_1\sigma_2$,
          and the cross term is what couples the stakes; it vanishes when the
          bets are independent. With many bets the growth rate is
          $f'\mu - \frac{1}{2}f'\Sigma f$, its gradient is $\mu - \Sigma f$, and
          setting it to zero gives $f^{*} = \Sigma^{-1}\mu$.

      - part: The covariance in place of the variance
        teach: >
          That is the technique. Bets that settle together share one
          multiplier, so their stakes are chosen jointly: in the Gaussian case,
          maximize $f'\mu - \frac{1}{2}f'\Sigma f$ to get
          $f^{*} = \Sigma^{-1}\mu$, the covariance matrix taking the place of
          the variance. Positively correlated bets are one larger bet in
          disguise and shrink together.
      - ask: >
          Back to the two desks, now with correlation $0.25$. By symmetry each
          gets the same $f$, and the first-order condition reads
          $0.03 = 0.06(1 + 0.25)f$. What is $f$?
        expects: "0.4"
        feedback: >
          $f = 0.03/0.075 = 0.4$ each. A modest correlation trims each desk
          from $0.5$ to $0.4$.
      - ask: >
          And with correlation $-0.5$, a natural hedge?
        expects: "1"
        hint: >
          The same equation with $1 + \rho = 0.5$.
        feedback: >
          $f = 0.03/(0.06 \times 0.5) = 1$ each, twice the standalone stake.
          Negatively correlated bets cancel part of each other's risk, so the
          joint optimum sizes both up.

      - part: When the bets are not Gaussian
        ask: >
          Six independent even-money bets settle at once, each winning $60\%$
          of the time. Each has a standalone Kelly fraction of $0.2$. If you
          stake $0.2$ on each and all six lose, by what number is the bankroll
          multiplied?
        expects: "-0.2"
        feedback: >
          $1 - 6(0.2) = -0.2$. All six lose with probability
          $0.4^{6} \approx 0.004$ — rare, and fatal.
      - ask: >
          What went wrong with sizing each bet at its standalone fraction?
        choices:
          - text: >
              Nothing: the bets are independent, so standalone sizing is
              exact.
            feedback: >
              In the Gaussian model it would be. Six binary bets settling at
              once land in one multiplier, and one of their joint outcomes
              costs more than the whole bankroll.
          - text: >
              The stakes share one multiplier, so the joint outcomes must all
              stay survivable: the total is capped below $1$ and each stake
              shrinks below its standalone $0.2$.
            correct: true
            feedback: >
              Right. For simultaneous independent bets the joint optimum sits
              slightly below each standalone fraction, with the total capped so
              that no joint outcome is fatal.
          - text: >
              Use $\Sigma^{-1}\mu$ instead: with independent bets it gives the
              right answer.
            feedback: >
              With $\Sigma$ diagonal, $\Sigma^{-1}\mu$ gives each bet
              $0.2/0.96 \approx 0.21$, a total near $1.25$. The Gaussian
              formula has no fatal outcomes in it, so it cannot see this one.
        feedback: >
          $\Sigma^{-1}\mu$ is the clean answer for small, smooth, Gaussian
          risks. For lumpy bets that settle together, check the worst joint
          outcome before trusting any sum of fractions.
  - node: quant-games.kelly.assumptions
    hook: >
      "Would you actually bet the fraction the formula gives you?" is a
      standard closing question, and answering "yes, unconditionally" is wrong
      — the log-growth objective is optimal for exactly one goal, and naming
      which of its conditions you distrust is the actual test.
    explanation: >
      The objective behind everything in this unit — maximize the almost-sure
      asymptotic growth rate $\mathbb{E}[\ln W]$ of a bankroll reinvested in
      full, forever — is optimal for exactly that goal and nothing broader.
      Reaching it required several conditions that are easy to state and easy
      to forget once a formula is in hand: the win probabilities are known
      exactly rather than estimated, stakes can be divided arbitrarily finely,
      successive bets are independent and repeatable without limit, nothing is
      ever deposited or withdrawn along the way, and there is no fixed horizon
      or external benchmark the strategy is judged against.

      Change any one of those and the criterion is no longer answering the
      question you actually face. Samuelson's objection is the sharpest
      version of this: maximizing expected log wealth is one utility function
      among many, chosen for a mathematically clean property — its
      growth-optimality — not because it is the correct preference for every
      decision-maker. A trader marked against a quarterly benchmark, or a fund
      that faces redemptions after a drawdown, is not asking "what maximizes
      my wealth over infinitely many future rounds" — they are asking a
      shorter, more constrained question, and rationally bets less than the
      pure growth criterion would recommend.

      The practical move in an interview is to treat this as a two-part answer
      rather than a single number: state what the criterion prescribes, and
      then say out loud which assumption you distrust most for the situation
      described and how that changes what you would actually do.
    interview: >
      When asked whether you would bet the computed fraction with real money,
      the strong answer names a specific assumption — usually that
      probabilities are estimated rather than known, or that there is a real
      horizon or redemption risk — and connects it to betting less, rather
      than giving a flat yes or a vague "it depends."
    pitfalls: >
      Treating the log-growth criterion as a universally correct answer for
      any decision-maker — it optimizes one specific objective, and a
      different objective changes the right stake. Also, forgetting that a
      fund facing real redemption risk after a drawdown must weight near-term
      losses far more heavily than an asymptotic, infinite-horizon growth rate
      ever does.
    recap: >
      The log-growth criterion answers exactly one question — how to compound
      a fully reinvested bankroll fastest, forever — and any other objective,
      horizon, or funding constraint changes the right stake.
    dialogue:
      - part: Three people, one formula
        teach: >
          An even-money bet that you believe wins $58\%$ of the time has a
          Kelly fraction of $0.16$. Kelly is optimal — for something. Here are
          three people deciding whether to stake $16\%$.
      - ask: >
          The first may take the bet only three times, then must report the
          result. At $f = 0.16$, what is the probability of finishing below
          where they started, to three decimal places?
        expects: "0.381"
        tolerance: 0.0005
        hint: >
          Two wins and a loss multiply by $1.16^{2} \times 0.84 \approx 1.13$;
          one win and two losses by $1.16 \times 0.84^{2} \approx 0.82$.
        feedback: >
          Finishing below needs at least two losses:
          $3(0.42^{2})(0.58) + 0.42^{3} = 0.3069 + 0.0741 \approx 0.381$. The
          almost-sure growth of Kelly is a statement about the long run; over
          three bets it promises nothing.
      - ask: >
          The second must double their money by tonight, and there is time for
          four bets. At $f = 0.16$, what is the best possible multiple after
          four bets, to four decimal places?
        expects: "1.8106"
        tolerance: 0.0005
        feedback: >
          Four straight wins give $1.16^{4} \approx 1.8106$. Staking Kelly, the
          second person fails tonight with certainty.
      - ask: >
          What should the second person do?
        choices:
          - text: >
              Stake $16\%$ anyway: Kelly is the optimal stake.
            feedback: >
              Optimal for long-run growth. Tonight's goal is the probability of
              reaching $2$ times, and at $16\%$ that probability is $0$.
          - text: >
              Stake less, to be safe.
            feedback: >
              A smaller stake still leaves doubling impossible. Safety, as
              Kelly measures it, is not this person's problem.
          - text: >
              Stake far more — for instance everything on one bet, which
              doubles the money with probability $0.58$.
            correct: true
            feedback: >
              Right. With a target and a deadline the objective is a
              probability, not a growth rate, and the right stake is much
              larger than Kelly.
        feedback: >
          Change the objective and the right stake moves, here far above
          Kelly.
      - reflect: >
          Kelly promised the first person nothing and failed the second. Kelly
          maximizes the asymptotic growth rate of a bankroll reinvested in
          full, forever.
          Which part of that sentence did each situation violate?
        hint: >
          One of them had too few rounds; the other wanted something other
          than growth.
        answer: >
          The first violated "forever": the growth rate governs the long run,
          and three bets are not a long run. The second violated "growth
          rate": their objective was hitting a target by a deadline. Expected
          log wealth is one objective among many; it is the right one only
          for someone who really is compounding a bankroll without end.

      - part: The fine print
        teach: >
          That is what Kelly assumes: correctly known probabilities, infinitely
          divisible stakes, independent repeatable bets, no deposits or
          withdrawals, and no horizon or benchmark — a bankroll reinvested in
          full, forever. Samuelson's objection is that maximizing
          $\mathbb{E}[\ln W]$ is merely one utility function among many.
          Change any assumption and the right stake moves.
      - ask: >
          The third person is the most ordinary: their $58\%$ is an estimate.
          If the true probability is $54\%$, what is the growth rate at
          $f = 0.16$, to four decimal places? Use $\ln 1.16 = 0.148420$ and
          $\ln 0.84 = -0.174353$.
        expects: "-0.0001"
        tolerance: 0.0001
        feedback: >
          $0.54(0.148420) + 0.46(-0.174353) = 0.080147 - 0.080202$, about
          $-0.0001$. A four-point error in the estimate turns the growth-optimal
          stake into one that goes nowhere.
      - ask: >
          A trader's risk desk halves her capital whenever she is down $15\%$
          on the year. Which assumption does that break, and what follows?
        choices:
          - text: >
              Divisibility of stakes; she should round her stake to whole lots.
            feedback: >
              Nothing here is about lot sizes. Capital is being taken away
              after losses, which is a withdrawal.
          - text: >
              No deposits or withdrawals: capital is removed exactly after a
              drawdown, so she should stake below Kelly to avoid triggering it.
            correct: true
            feedback: >
              Right. A forced withdrawal after losses makes drawdowns far more
              costly than the growth rate counts them, and that cost pushes the
              stake down.
          - text: >
              None: Kelly maximizes growth, and growth is what she wants.
            feedback: >
              Growth of a bankroll that is never withdrawn from. Hers is
              halved at the worst moment, which the growth rate never prices.
        feedback: >
          Withdrawals after losses and benchmarks usually push the stake below
          the formula; a hard target with a deadline can push it above.

      - part: Where the formula is right, and how to say so
        ask: >
          For whom is Kelly closest to exactly right?
        choices:
          - text: >
              A retiree who withdraws a fixed income every month.
            feedback: >
              Regular withdrawals break full reinvestment, and the income need
              makes small-bankroll outcomes much worse than the logarithm
              says.
          - text: >
              A fund manager compared with an index every quarter.
            feedback: >
              A quarterly benchmark is a horizon and an objective that is not
              growth. The manager is optimizing something else.
          - text: >
              A market maker running thousands of small independent trades a
              day, with an edge measured over years, reinvesting everything.
            correct: true
            feedback: >
              Right. Many repeated bets, a well-measured edge, full
              reinvestment and no deadline: the long run arrives quickly, and
              that is the world the growth rate describes.
        feedback: >
          Kelly is exact for the decision-maker its derivation describes, and
          a starting point for everyone else.
      - ask: >
          The interviewer asks the third person: "Would you actually stake
          $16\%$?" Which answer is strongest?
        choices:
          - text: >
              "Yes: $16\%$ is provably growth-optimal."
            feedback: >
              Provably optimal for a known $58\%$. The probability is an
              estimate, and a four-point error makes this stake go nowhere.
          - text: >
              "No — Kelly is too risky, so I'd bet very little."
            feedback: >
              The direction is right and the reason is missing. Name the
              assumption you distrust and size the cut to it.
          - text: >
              "The formula says $16\%$. My $58\%$ is an estimate, and at
              $54\%$ that stake earns nothing, so I would stake about half."
            correct: true
            feedback: >
              Right: the formula, the assumption you distrust, what it costs,
              and the number you would actually bet.
        feedback: >
          Give $f^{*}$ from the formula, say which assumption you distrust,
          and say what fraction of $f^{*}$ you would actually stake.
