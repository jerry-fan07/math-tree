unit: quant-probability.foundations
opening: >
  Probability begins with naming a sample space and treating events as sets —
  every identity the quant tree leans on afterward, from the union bound to
  Bayes' rule, is generated by three axioms and the arithmetic they force. This
  unit builds that machinery in order: the axioms themselves, their immediate
  corollaries (the empty event, the complement rule, monotonicity, two- and
  three-event inclusion–exclusion), the classical equally-likely model that
  turns counting into probability, the discipline of checking rather than
  assuming uniformity, independence and the sharp edges around it (complements,
  pairwise versus mutual), the complementary-counting technique for "at least
  one", and the odds notation trading desks actually quote. By the end you
  should be able to set up any sample space cold, know exactly when "equally
  likely" has been earned rather than assumed, and convert fluently between
  probabilities and market odds.
lessons:
  - node: quant-probability.foundations.sample-space
    hook: >
      Every probability question you're asked lives or dies on this first
      move: name $\Omega$ precisely before touching an arithmetic operator —
      get the sample space wrong and every later number answers a different
      question than the one asked.
    explanation: >
      A random experiment does not come with its sample space attached — you
      build $\Omega$ by deciding what counts as an outcome, and that choice is
      a modelling decision, not a fact about the world. The requirement that
      outcomes be mutually exclusive and collectively exhaustive is what makes
      $\Omega$ usable: exactly one outcome occurs, so every event, being a
      subset of $\Omega$, either happens or doesn't with no ambiguity.

      The habit worth building now is writing $\Omega$ down explicitly before
      any counting starts. Two dice rolled together naturally give the $36$
      ordered pairs $\{1,\dots,6\}^{2}$, not the $11$ possible sums — the sums
      are a coarser description built on top of $\Omega$, and treating them as
      the sample space itself is the single most common setup error in the
      subject. An event like "the sum is $7$" only becomes a concrete,
      countable subset of $\Omega$ once $\Omega$ itself is fixed.

      Once $\Omega$ is named, an event is nothing more than a subset —
      "occurs" means "the realised outcome lies in this subset". $\Omega$
      itself is the event guaranteed to occur, $\emptyset$ the event that
      never does, and every other event sits somewhere between them.
    worked: >
      Draw one card from a standard $52$-card deck. The sample space is
      $\Omega$, the $52$ cards, each a distinct outcome. The event "the card is
      a heart" is the $13$-element subset of cards carrying a heart suit mark,
      and the event "the card is a face card" is a different $12$-element
      subset. Neither event is a number — each is the exact set of outcomes
      matching the description, with $|\Omega| = 52$ fixed before either count
      is taken.
    interview: >
      Expect this to be tested implicitly: the interviewer states a random
      process and watches whether you write down $\Omega$ before reaching for
      a formula. Naming $\Omega$ out loud, including whether outcomes are
      ordered or labelled, signals you're modelling rather than guessing.
    pitfalls: >
      Describing outcomes too coarsely — using sums, totals, or categories
      instead of the finest description the mechanism actually produces —
      silently changes the problem. Conflating an outcome with an event
      (treating a single die face the same way as "the roll is even") breaks
      the subset language the rest of probability depends on.
    recap: >
      A sample space is the exhaustive, mutually exclusive list of outcomes an
      experiment can produce, and naming it precisely is the first and most
      consequential step of any problem.
    steps:
      - teach: >
          A random experiment does not arrive with its sample space attached.
          You build $\Omega$ by deciding what counts as an outcome — which
          means the very first line of your answer is a modelling choice, not a
          fact you were handed.
      - teach: >
          The requirement is that outcomes be mutually exclusive and
          collectively exhaustive: exactly one of them occurs. That is what
          makes an event — any subset $A \subseteq \Omega$ — either happen or
          not, with no third case to argue about.
      - ask: >
          Two fair dice are rolled together. Which set is the right
          $\Omega$?
        choices:
          - text: >
              The $11$ possible sums, $\{2, 3, \dots, 12\}$
            feedback: >
              The sums are a coarser description built on top of the outcomes,
              and they are not equally likely — a $7$ is six times as likely as
              a $2$. This is the single most common setup error in the subject.
          - text: >
              The $36$ ordered pairs $\{1,\dots,6\}^{2}$
            correct: true
            feedback: >
              The dice are physically distinguishable, so the mechanism
              produces ordered pairs, and those $36$ outcomes are the finest
              description — which is exactly where the symmetry lives.
          - text: >
              The $21$ unordered pairs, since the dice are identical
            feedback: >
              Identical-looking is not the same as indistinguishable. Rolling
              $\{1,2\}$ happens two ways and $\{3,3\}$ only one, so these $21$
              outcomes do not carry equal weight.
        feedback: >
          Take $\Omega$ as fine as the mechanism distinguishes: the $36$
          ordered pairs. Anything coarser is a derived description, useful for
          stating an event but wrong as a sample space.
      - teach: >
          Once $\Omega$ is named, an event is nothing more than a subset, and
          "occurs" means "the realised outcome lies in it". $\Omega$ is the
          certain event, $\emptyset$ the impossible one, and everything else
          sits between.
      - ask: >
          With that $\Omega$, how many outcomes make up the event "the sum is
          $7$"?
        expects: "6"
        hint: >
          Fix the first die, then ask what the second must be for the pair to
          total $7$.
        feedback: >
          Six: $(1,6), (2,5), (3,4), (4,3), (5,2), (6,1)$. Every first-die
          value has exactly one partner, which is why $7$ is the modal sum —
          and why it has $6/36 = 1/6$ once you divide.
      - teach: >
          Write $\Omega$ down before you compute anything. In an interview this
          is also a signal: naming the outcome set out loud, including whether
          outcomes are ordered, says you are modelling rather than
          pattern-matching a formula.

  - node: quant-probability.foundations.event-algebra
    hook: >
      Interview prompts are phrased in words — "at least one", "neither",
      "exactly one of the two" — and the whole trick is translating them into
      set operations fast enough that the arithmetic becomes obvious.
    explanation: >
      Each logical connective on events is literally a set operation on
      subsets of $\Omega$: "and" is intersection, inclusive "or" is union,
      "not" is complement relative to $\Omega$, and "but not" is a set
      difference. Nothing new is being defined here — this is exactly the
      algebra of sets from the sample space, applied to the subsets called
      events.

      The payoff is De Morgan's laws, which convert between the two phrasings
      interviews alternate between: "none of $A$, $B$ happen" is the
      complement of "at least one happens". Concretely,
      $(A \cup B)^{c} = A^{c} \cap B^{c}$ — the complement of a union is the
      intersection of the complements, not the union of the complements, which
      is the mistake to guard against. This single swap is what makes "at
      least one" problems tractable, since intersections of independent events
      multiply cleanly while unions do not.

      A partition of $\Omega$ — pairwise disjoint events whose union is
      everything — is the other structure worth internalising: any event can
      be split along a partition into disjoint pieces, handled separately and
      then added, the move behind the law of total probability later in the
      tree.
    worked: >
      Draw one card from a deck. Let $A$ be "the card is a heart" ($13$ cards)
      and $B$ be "the card is a face card" (jack, queen, king of each suit,
      $12$ cards). $A \cap B$ is the three heart face cards, so
      $|A \cap B| = 3$. "$A$ but not $B$" is $A \setminus B = A \cap B^{c}$,
      the non-face hearts, with $|A \setminus B| = 13 - 3 = 10$. And
      $A \cup B$, counting without double-counting the three shared cards, has
      $13 + 12 - 3 = 22$ elements.
    interview: >
      A common framing is "define the event that at least one of these three
      systems fails, in terms of the individual failure events" — the
      interviewer wants the complement-of-intersection form written cold, not
      a description in words. Another is "what does neither $A$ nor $B$ mean
      as a set", testing whether De Morgan is automatic.
    pitfalls: >
      Applying De Morgan by negating only one side (writing
      $(A\cup B)^{c} = A^{c} \cup B^{c}$ instead of $A^{c} \cap B^{c}$) is the
      most common slip. Reading inclusive "or" as exclusive "or" silently
      drops the overlap region from $A \cup B$.
    recap: >
      And, or, not, and but-not are intersection, union, complement, and set
      difference, and De Morgan turns "at least one" into the tractable "not
      none".
    steps:
      - teach: >
          Every logical connective on events is literally a set operation.
          "$A$ and $B$" is $A \cap B$, inclusive "or" is $A \cup B$, "not $A$"
          is the complement $A^{c}$, and "$A$ but not $B$" is $A \cap B^{c}$.
      - teach: >
          Nothing new is being defined — this is the algebra of subsets of
          $\Omega$. The value is speed: interview prompts are phrased in words,
          and the arithmetic only becomes obvious once the words are sets.
      - ask: >
          "Neither $A$ nor $B$ occurs" is which event?
        choices:
          - text: >
              $A^{c} \cup B^{c}$
            feedback: >
              That is "at least one of them fails", which is much weaker — it
              holds whenever the two do not both occur. De Morgan sends a union
              of complements to the complement of an intersection.
          - text: >
              $A^{c} \cap B^{c}$
            correct: true
            feedback: >
              Neither occurs means $A$ fails and $B$ fails, and by De Morgan
              that is exactly $(A \cup B)^{c}$ — the complement of "at least
              one".
          - text: >
              $(A \cap B)^{c}$
            feedback: >
              That is "not both", which still allows one of them to happen.
        feedback: >
          "Neither" is $A^{c} \cap B^{c} = (A \cup B)^{c}$. Recognising it as
          the complement of "at least one" is what makes the complementary
          counting technique available.
      - teach: >
          De Morgan's laws are the translation you will use most:
          $(A \cup B)^{c} = A^{c} \cap B^{c}$ and
          $(A \cap B)^{c} = A^{c} \cup B^{c}$. Read the first one right to
          left and it says "none of them happen" is the complement of "at least
          one happens".
      - teach: >
          A partition of $\Omega$ is a family of pairwise disjoint events whose
          union is everything. Every event splits along one, which is the shape
          every conditioning argument later in the program takes.
      - ask: >
          $A$ and $B$ are disjoint. Which statement follows?
        choices:
          - text: >
              They are independent
            feedback: >
              Disjoint is closer to the *opposite* of independent: if both have
              positive probability, each occurring rules the other out entirely.
          - text: >
              "$A$ or $B$" and "$A$ and $B$" are the same event
            feedback: >
              The intersection is empty and the union generally is not.
          - text: >
              $A \subseteq B^{c}$
            correct: true
            feedback: >
              $A \cap B = \emptyset$ says no outcome of $A$ lies in $B$, which
              is precisely $A \subseteq B^{c}$.
        feedback: >
          Disjointness is containment in a complement. Keep it well away from
          independence — the two get confused constantly, and they point in
          opposite directions.

  - node: quant-probability.foundations.axioms
    hook: >
      Every identity you'll ever quote — the union bound, Bayes' rule, the
      CLT — is downstream of three lines; knowing them means you can rebuild a
      forgotten formula live instead of guessing at its shape.
    explanation: >
      A probability space packages three objects: the sample space $\Omega$, a
      collection $\mathcal{F}$ of events closed under complement and countable
      union, and a function $\Pr$ assigning each event a number. For a finite
      or countable $\Omega$, $\mathcal{F}$ is simply every subset, so this
      technicality can be set aside; what matters is what $\Pr$ must satisfy.
      Nonnegativity says no event has negative probability. Normalisation
      fixes the total mass at $\Pr(\Omega) = 1$. Countable additivity says
      that for any pairwise disjoint sequence $A_{1}, A_{2}, \dots$, the
      probability of their union is the sum of their probabilities.

      Notice what is deliberately absent: no assumption of equally likely
      outcomes, no requirement that $\Omega$ be finite, and no commitment to
      interpreting $\Pr$ as a long-run frequency or a degree of belief. Any
      function on events satisfying the three demands is a legitimate
      probability measure — the classical equally-likely model taught next is
      one particular instance, not the definition itself.

      This is also the reset button mid-interview: if a formula slips your
      mind, fall back to checking nonnegativity, total mass $1$, and
      additivity over disjoint pieces directly from the experiment's
      description.
    worked: >
      A weighted four-sided die assigns mass $0.1$, $0.2$, $0.3$, $0.4$ to
      faces $1,2,3,4$. Nonnegativity holds since every mass is positive, and
      normalisation holds since $0.1+0.2+0.3+0.4=1$. The event "the face is
      $1$ or $3$" is the disjoint union of two single-outcome events, so
      additivity gives $\Pr(\{1,3\}) = 0.1 + 0.3 = 0.4$ directly — no counting
      argument needed, only the axiom.
    interview: >
      "State the axioms of probability" is asked cold to check the foundation
      is solid before anything harder is built on it. A sharper follow-up is
      "is independence one of the axioms?" — the answer is no, independence is
      a separate definition imposed on top, which trips up candidates who
      conflate the two.
    pitfalls: >
      Treating equal likelihood as baked into the axioms is wrong — they say
      nothing about how mass is distributed across outcomes, only that it's
      nonnegative, totals $1$, and adds over disjoint pieces. Assuming the
      axioms require $\Omega$ to be finite is also wrong; countable additivity
      is stated for infinite sequences precisely because it must hold there
      too.
    recap: >
      Probability is any nonnegative, countably additive assignment of total
      mass $1$ to events — three lines that generate every other identity in
      the subject.
    steps:
      - teach: >
          A probability space is a triple $(\Omega, \mathcal{F}, \Pr)$: the
          outcomes, the events you are allowed to ask about, and the function
          that scores them. For a countable $\Omega$ you may take
          $\mathcal{F}$ to be all subsets and forget it exists.
      - teach: >
          $\Pr$ satisfies exactly three demands. Nonnegativity:
          $\Pr(A) \ge 0$. Normalisation: $\Pr(\Omega) = 1$. Countable
          additivity: disjoint events' probabilities add, even along an
          infinite sequence.
      - ask: >
          Which of these is *not* one of the axioms?
        choices:
          - text: >
              $\Pr(A) \ge 0$ for every event
            feedback: >
              That is nonnegativity, the first axiom.
          - text: >
              Outcomes in $\Omega$ are equally likely
            correct: true
            feedback: >
              Nothing in the axioms says this. Equal likelihood is an extra
              modelling assumption you make about a specific mechanism — and
              the one that has to be earned rather than assumed.
          - text: >
              Disjoint events' probabilities add
            feedback: >
              That is countable additivity, the third axiom.
        feedback: >
          Uniformity is not an axiom. Noticing what the axioms *omit* — no
          equal likelihood, no finiteness, no interpretation of $\Pr$ as a
          frequency or a belief — is most of the value of reading them.
      - teach: >
          Everything else in the subject is a consequence of those three lines
          plus the definition of conditioning. That is worth taking literally:
          when a formula stops making sense, the way back is to re-derive it
          from here.
      - ask: >
          Events $A$, $B$, $C$ partition $\Omega$, with $\Pr(A) = 0.2$ and
          $\Pr(B) = 0.5$. What is $\Pr(C)$?
        expects: "0.3"
        hint: >
          A partition's blocks are disjoint and their union is $\Omega$, so
          two axioms apply at once.
        feedback: >
          Additivity gives $\Pr(A) + \Pr(B) + \Pr(C) = \Pr(\Omega) = 1$, so
          $\Pr(C) = 0.3$. Summing a partition to $1$ is the standard
          consistency check on any model you build by hand.
      - teach: >
          Countable additivity is stated for infinite sequences on purpose.
          Finitely additive set functions that fail it exist, and excluding
          them is what makes limits of events behave.

  - node: quant-probability.foundations.finite-additivity
    hook: >
      Two facts silently underwrite every probability calculation you'll do —
      that the impossible event has probability $0$ and that disjoint pieces
      just add — and deriving them rather than citing them is what lets you
      sanity-check a hand-built model on the spot.
    explanation: >
      Both facts fall out of countable additivity applied to a carefully
      chosen sequence rather than being separate assumptions. For
      $\Pr(\emptyset) = 0$: the sequence $\emptyset, \emptyset, \dots$ is
      pairwise disjoint, so countable additivity forces
      $\Pr(\emptyset) = \sum_{i \ge 1} \Pr(\emptyset)$. The only nonnegative
      number equal to an infinite sum of copies of itself is $0$.

      Finite additivity for pairwise disjoint $A_{1},\dots,A_{n}$ then follows
      by padding the finite list with infinitely many copies of $\emptyset$
      and applying the same axiom — the padding terms contribute nothing,
      leaving $\Pr(A_{1} \cup \cdots \cup A_{n}) = \Pr(A_{1}) + \cdots +
      \Pr(A_{n})$.

      The practical use is a consistency check: if you partition $\Omega$ into
      disjoint blocks and assign each a probability, those probabilities must
      sum to exactly $1$. A hand-built model that fails this check has an
      error somewhere, caught before further computation compounds it. The
      converse doesn't hold — finitely additive set functions that fail to be
      countably additive exist — which is exactly why the axiom is stated for
      infinite sequences in the first place.
    worked: >
      A spinner has three regions with probabilities $p$, $2p$, $3p$. Since
      the regions partition $\Omega$, finite additivity forces
      $p + 2p + 3p = 1$, so $p = 1/6$. The probability of landing in the first
      or third region is then $1/6 + 3/6 = 4/6 = 2/3$, disjoint pieces added
      directly.
    interview: >
      "Why is the probability of the empty event zero — derive it, don't just
      state it" tests whether you understand additivity or only memorised the
      conclusion; the padding-with-$\emptyset$ argument is the expected
      answer.
    pitfalls: >
      Applying additivity to events that overlap gives a number too large —
      it strictly requires pairwise disjointness, and overlap needs a separate
      identity. Assuming any finitely additive assignment is automatically
      countably additive is false; the converse genuinely fails for some
      constructions.
    recap: >
      The impossible event has probability $0$ and disjoint probabilities add
      — both provable from the axioms alone, together the standard
      consistency check on any model.
    steps:
      - teach: >
          Start with $\Pr(\emptyset) = 0$, which is a consequence rather than
          an assumption. The sequence $\emptyset, \emptyset, \dots$ is
          pairwise disjoint, so countable additivity forces
          $\Pr(\emptyset) = \sum_{i \ge 1} \Pr(\emptyset)$.
      - ask: >
          An infinite sum of copies of the same number $p \ge 0$ is finite.
          What must $p$ be?
        expects: "0"
        feedback: >
          Only $0$. Any positive constant summed infinitely often diverges, and
          the total here has to be at most $1$ — so $\Pr(\emptyset) = 0$.
      - teach: >
          Finite additivity now follows by padding: given disjoint
          $A_1, \dots, A_n$, extend the list with copies of $\emptyset$,
          apply the axiom, and the tail contributes nothing.
      - teach: >
          The working consequence is the check you should run on every
          hand-built model: the probabilities assigned to the blocks of a
          finite partition of $\Omega$ must sum to $1$.
      - ask: >
          Does finite additivity imply countable additivity?
        choices:
          - text: >
              Yes — infinite sums are just limits of finite ones
            feedback: >
              The limit exists, but nothing forces it to equal the probability
              of the infinite union. That extra step is a genuine assumption.
          - text: >
              No — finitely additive set functions that fail it exist
            correct: true
            feedback: >
              Which is exactly why the axiom is stated for infinite sequences
              rather than derived from the finite case.
        feedback: >
          The implication runs one way only. Countable additivity is strictly
          stronger, and it is what buys the continuity along monotone sequences
          that infinite-case arguments rest on.

  - node: quant-probability.foundations.complement
    hook: >
      "At least one" is almost always fastest computed as one minus "none at
      all" — this pair of identities is why that swap is valid and exactly
      how far it extends.
    explanation: >
      $A$ and $A^{c}$ partition $\Omega$ into two disjoint pieces, so
      additivity gives $\Pr(A) + \Pr(A^{c}) = \Pr(\Omega) = 1$, hence
      $\Pr(A^{c}) = 1 - \Pr(A)$. The same splitting trick handles nested
      events: if $A \subseteq B$, write $B = A \cup (B \setminus A)$ as a
      disjoint union, so $\Pr(B) = \Pr(A) + \Pr(B \setminus A)$, giving the
      difference rule $\Pr(B \setminus A) = \Pr(B) - \Pr(A)$. Since a
      probability can't be negative, this forces $\Pr(A) \le \Pr(B)$ —
      monotonicity: a bigger event is never less likely.

      Without the nesting assumption the same split gives the more general
      $\Pr(B \setminus A) = \Pr(B) - \Pr(A \cap B)$, which reduces to the
      nested case when $A \cap B = A$.

      Combine monotonicity with $\Pr(\Omega) = 1$ and every probability is
      pinned into $[0,1]$ — a genuinely useful mid-calculation check: an
      intermediate probability outside that range is an arithmetic mistake,
      not a surprising result, and a bound proved for a larger event transfers
      to any smaller one for free.
    worked: >
      A machine has probability $0.55$ of still running after a year, and
      probability $0.15$ of running with no maintenance needed at all — a
      subset of "still running". The chance it's running but needed at least
      one repair is $0.55 - 0.15 = 0.40$, the nested difference rule directly.
      The chance it's not running at all after a year is $1 - 0.55 = 0.45$,
      the complement rule.
    interview: >
      The complement rule shows up as a quiet building block inside harder
      questions rather than being asked alone — the tell is any phrase
      containing "at least" or "at most", signalling you should compute the
      complementary, simpler event and subtract from $1$.
    pitfalls: >
      Using $\Pr(B) - \Pr(A)$ when $A$ is not actually a subset of $B$
      overstates or understates the true difference, which is
      $\Pr(B) - \Pr(A \cap B)$ in general. A computed probability landing
      outside $[0,1]$ should be read as a sign of an earlier error, not
      written down as the answer.
    recap: >
      The chance of not-$A$ is $1-\Pr(A)$, and for nested events the gap
      between them is $\Pr(B)-\Pr(A)$ — both provable from a single disjoint
      split.
    steps:
      - teach: >
          $A$ and $A^{c}$ are disjoint and their union is $\Omega$, so
          additivity and normalisation together give
          $\Pr(A^{c}) = 1 - \Pr(A)$. One line, and it is the most-used
          identity in the subject.
      - ask: >
          A trade wins with probability $0.35$. What is the probability it does
          not win?
        expects: "0.65"
        feedback: >
          $1 - 0.35 = 0.65$. Trivial here, and the same move is what turns an
          intractable "at least one" into a product later in this unit.
      - teach: >
          For nested events $A \subseteq B$, split $B$ into the disjoint pieces
          $A$ and $B \setminus A$. That gives the difference rule
          $\Pr(B \setminus A) = \Pr(B) - \Pr(A)$, and since probabilities are
          nonnegative, monotonicity: $\Pr(A) \le \Pr(B)$.
      - teach: >
          Without nesting the same split still works, but the piece you remove
          is the overlap:
          $\Pr(B \setminus A) = \Pr(B) - \Pr(A \cap B)$. Forgetting that
          $A \cap B$ rather than $A$ is what comes out is the standard slip.
      - ask: >
          $\Pr(B) = 0.6$ and $\Pr(A \cap B) = 0.25$. What is
          $\Pr(B \setminus A)$?
        expects: "0.35"
        hint: >
          $B$ splits into the part of $B$ inside $A$ and the part outside it.
        feedback: >
          $0.6 - 0.25 = 0.35$. Note that $\Pr(A)$ never entered — only the part
          of $A$ that actually sits inside $B$ can be removed from $B$.
      - teach: >
          Monotonicity plus $\Pr(\Omega) = 1$ pins every probability into
          $[0,1]$. Treat that as a live check: an intermediate result outside
          the range is an arithmetic error, not a surprising finding.

  - node: quant-probability.foundations.union-two
    hook: >
      This is the most frequently tested identity in the interview canon —
      nearly every "at least one of two (or three) things happens" question
      is inclusion–exclusion wearing a word problem's clothes.
    explanation: >
      Write $A \cup B$ as the disjoint union $A \cup (B \setminus A)$, apply
      additivity, then the difference rule turns $\Pr(B \setminus A)$ into
      $\Pr(B) - \Pr(A \cap B)$. That gives
      $\Pr(A \cup B) = \Pr(A) + \Pr(B) - \Pr(A \cap B)$: adding the two
      probabilities counts the overlap twice, so subtracting it once repairs
      the count exactly.

      Drop the overlap term and you get the union bound
      $\Pr(A \cup B) \le \Pr(A) + \Pr(B)$, useful whenever the exact
      intersection probability is unknown or too messy to compute — equality
      holds precisely when $A$ and $B$ are disjoint.

      Three events alternate rather than simply extending the pattern: add
      the three singles, subtract the three pairwise intersections, then add
      back the triple intersection, because an outcome in all three events
      gets subtracted three times by the pairwise terms after being added
      three times by the singles, so it needs restoring once. This is the
      two- and three-event case of the general inclusion–exclusion formula
      used for counting arbitrarily many events.
    worked: >
      Of $40$ students, $18$ play soccer, $15$ play basketball, and $7$ play
      both. The number playing at least one sport is $18 + 15 - 7 = 26$, so
      the probability a randomly chosen student plays at least one is
      $26/40 = 0.65$.
    interview: >
      "What's the probability at least one of these two things happens" is
      asked directly, and the interviewer listens for the minus term
      appearing unprompted — stating $\Pr(A)+\Pr(B)$ alone is the most common
      partial answer. For three events, they're checking whether the
      triple-intersection term gets added back or forgotten.
    pitfalls: >
      Forgetting to subtract the intersection double-counts the overlap and
      overstates the union. In the three-event version, dropping the final
      triple-intersection term is the classic sign error — outcomes in all
      three end up under-corrected.
    recap: >
      $\Pr(A\cup B) = \Pr(A)+\Pr(B)-\Pr(A\cap B)$, and for three events you add
      the singles, subtract the pairs, add back the triple.
    steps:
      - teach: >
          Adding $\Pr(A)$ and $\Pr(B)$ counts the overlap twice, so subtract
          it once: $\Pr(A \cup B) = \Pr(A) + \Pr(B) - \Pr(A \cap B)$. The
          proof is the disjoint split $A \cup B = A \cup (B \setminus A)$ plus
          the difference rule.
      - ask: >
          $\Pr(A) = 0.5$, $\Pr(B) = 0.4$, $\Pr(A \cap B) = 0.2$. What is
          $\Pr(A \cup B)$?
        expects: "0.7"
        feedback: >
          $0.5 + 0.4 - 0.2 = 0.7$. The naive $0.9$ counts the overlap in both
          terms.
      - teach: >
          Dropping the overlap gives the union bound
          $\Pr(A \cup B) \le \Pr(A) + \Pr(B)$, with equality exactly when
          $\Pr(A \cap B) = 0$. That inequality is the workhorse when the
          intersection is unknown or unpleasant.
      - ask: >
          For three events, which sign does $\Pr(A \cap B \cap C)$ carry?
        choices:
          - text: >
              Negative, like the pairwise intersections
            feedback: >
              The pairwise terms are subtracted, but the triple overlap has by
              then been removed one time too many.
          - text: >
              Positive
            correct: true
            feedback: >
              It is added three times by the singles and removed three times by
              the pairs, so it has to come back once.
          - text: >
              It does not appear
            feedback: >
              It does, and omitting it under-counts every outcome lying in all
              three events.
        feedback: >
          The signs alternate by the size of the intersection:
          $\Pr(A \cup B \cup C) = \Pr(A) + \Pr(B) + \Pr(C)
          - \Pr(A \cap B) - \Pr(A \cap C) - \Pr(B \cap C)
          + \Pr(A \cap B \cap C)$.
      - teach: >
          The pattern continues for $n$ events as the general
          inclusion–exclusion formula. Beyond three terms it is usually cheaper
          to complement the whole thing than to expand it.

  - node: quant-probability.foundations.classical
    hook: >
      This is the model behind nearly every card, dice, and urn question in
      the interview canon, and the fastest way to lose points on it is
      silently mixing an ordered numerator with an unordered denominator.
    explanation: >
      When $\Omega$ has $N$ outcomes and the physical mechanism really does
      make them equally likely, the axioms pin each outcome's probability at
      $1/N$ — normalisation forces the $N$ equal masses to sum to $1$. Finite
      additivity then gives, for any event $A$, $\Pr(A) = |A| \cdot (1/N) =
      |A|/|\Omega|$: favourable outcomes over total outcomes.

      This is the one setting where probability collapses entirely into
      counting — no weighting, just enumeration — which is why it dominates
      interview questions built around cards, dice, and urns. But the
      collapse only works if $|A|$ and $|\Omega|$ are counted the same way. If
      $\Omega$ is built from ordered outcomes, $A$ must be counted with the
      same ordering; switching to an unordered count for the numerator while
      the denominator stays ordered silently changes what fraction you're
      computing, and the two errors don't cancel.
    worked: >
      Draw two cards from a $52$-card deck without replacement, all pairs
      equally likely. Counting unordered pairs throughout,
      $|\Omega| = \binom{52}{2} = 1326$ and the event "both are aces" has
      $|A| = \binom{4}{2} = 6$. So $\Pr(\text{both aces}) = 6/1326 = 1/221$.
    interview: >
      "If I deal you two cards, what's the chance both are aces" directly
      tests this formula — the interviewer watches whether the counting
      convention (ordered or unordered) stays consistent between numerator and
      denominator, not which convention you pick.
    pitfalls: >
      Counting the denominator as unordered combinations while counting the
      numerator with an ordered restriction (or the reverse) gives a number
      that isn't a valid probability for either convention. Applying
      $|A|/|\Omega|$ without first confirming the outcomes really are equally
      likely just imports the uniformity error one level down.
    recap: >
      Under genuinely equally likely outcomes, probability is exactly
      favourable over total — but only when numerator and denominator are
      counted by the same convention.
    steps:
      - teach: >
          When $\Omega$ is finite with $N$ equally likely outcomes, each
          carries $1/N$ and additivity gives
          $\Pr(A) = |A| / |\Omega|$ — favourable over total. This is the one
          model where probability collapses entirely into counting.
      - ask: >
          Three fair coins are tossed. What is the probability of exactly two
          heads?
        expects: "3/8"
        hint: >
          There are $2^{3}$ equally likely sequences; count the ones with two
          heads.
        feedback: >
          $\Omega$ has $8$ sequences and $\binom{3}{2} = 3$ of them show two
          heads, so the answer is $3/8 = 0.375$. Note the count is over
          *sequences*, not over "number of heads".
      - teach: >
          The clause that does the work is "equally likely". Strip it and the
          formula is simply false — which is why the next lesson is about
          refusing to assume it.
      - ask: >
          A hand of $2$ cards is drawn from a $52$-card deck. A candidate
          computes the numerator by counting ordered draws and the denominator
          as $\binom{52}{2}$. What has gone wrong?
        choices:
          - text: >
              Nothing — the factors of $2$ cancel
            feedback: >
              They do not cancel unless you apply the same convention on both
              sides; here only the numerator was doubled.
          - text: >
              The two counts are taken over different sample spaces
            correct: true
            feedback: >
              An ordered numerator over an unordered denominator is comparing
              counts from two different $\Omega$s, and the answer comes out
              twice too large.
          - text: >
              $\binom{52}{2}$ is the wrong denominator for card problems
            feedback: >
              It is a perfectly good denominator — for an *unordered* count of
              favourable hands.
        feedback: >
          Both counts must be taken over the same $\Omega$. Pick ordered or
          unordered, say which, and stay there — mixing them is the standard
          way this model goes wrong.
      - teach: >
          Practically: decide the convention before you count anything, and
          prefer whichever makes the favourable set easier to describe. The
          answer is the same either way when you are consistent.

  - node: quant-probability.foundations.uniformity-assumption
    hook: >
      "There are two outcomes, so it's fifty-fifty" is the single most common
      wrong answer in a quant interview, and this is the discipline that keeps
      you from producing it.
    explanation: >
      Equal likelihood is a claim about a physical mechanism — a symmetric
      die, a fair shuffle, a uniform random draw — and it holds only at the
      level of description where that symmetry actually lives. The classical
      model tells you what to do once uniformity is granted; it says nothing
      about when uniformity is true, and that judgment call is the harder,
      more error-prone part.

      The fix is to label outcomes as finely as the mechanism distinguishes
      them, then check symmetry at that finest level. Two dice rolled
      together are physically distinguishable, so the $36$ ordered pairs are
      the uniform level of description; the $11$ possible sums are a
      coarsening on top, and coarsening a uniform space essentially never
      leaves it uniform — a sum of $7$ arises from six ordered pairs while a
      sum of $2$ arises from only one, so $7$ is six times as likely.

      When a problem says "at random" without specifying how, the answer
      genuinely isn't determined yet. State the assumed mechanism out loud —
      "I'll assume each of the $N$ finest-grained outcomes is equally likely"
      — before computing anything, both because it's necessary and because it
      signals you know uniformity is a choice, not a default.
    worked: >
      Flip a fair coin three times and look at the number of heads, which
      takes values $0,1,2,3$. These four categories are not equally likely:
      the uniform level of description is the $8$ ordered sequences, and
      counting how many map to each head-count gives $\Pr(0)=1/8$,
      $\Pr(1)=3/8$, $\Pr(2)=3/8$, $\Pr(3)=1/8$ — nowhere near a naive $1/4$
      each.
    interview: >
      "Are all eleven sums of two dice equally likely" directly probes this
      distinction, and a subtler version is "you have two sealed envelopes, is
      it fifty-fifty which has more money" — where the honest answer is that
      nothing in the setup fixes a uniform mechanism at all.
    pitfalls: >
      Treating the "natural" or most-often-mentioned categories as
      automatically equally likely, when they're really a coarsening of a
      finer uniform space. Computing an answer without ever stating which
      mechanism you assumed, which leaves the answer undefined if the
      grader's assumption differs from yours.
    recap: >
      Equal likelihood must be earned from the mechanism at its finest level
      of description — coarser categories are almost never uniform even when
      the underlying process is.
    steps:
      - teach: >
          "There are two possibilities, so it is $50$–$50$" is the most
          expensive sentence in probability. Equal likelihood is a claim about
          a physical mechanism — a symmetric die, a fair shuffle — not a
          default that applies for lack of information.
      - ask: >
          Two fair dice are rolled. Are the $11$ possible sums equally likely?
        choices:
          - text: >
              Yes — each sum is one outcome of the experiment
            feedback: >
              Each sum is an *event*, and events built from different numbers of
              outcomes carry different weight.
          - text: >
              No — they are built from different numbers of ordered pairs
            correct: true
            feedback: >
              The $36$ ordered pairs are uniform; the sums, which group them
              unevenly, are not.
        feedback: >
          Coarsening a uniform space almost never leaves it uniform. Symmetry
          lives at the level of description where the mechanism actually
          distinguishes outcomes.
      - ask: >
          How many times more likely is a sum of $7$ than a sum of $2$?
        expects: "6"
        hint: >
          Count the ordered pairs producing each.
        feedback: >
          Six pairs give $7$ and one gives $2$, so $7$ is six times as likely.
          Treating the sums as uniform would have called them equal.
      - teach: >
          The rule to carry: label outcomes as finely as the mechanism
          distinguishes them, check uniformity there, and only then coarsen.
      - teach: >
          And when a problem says "at random" without saying how, the answer is
          not determined. Fix the mechanism, say out loud which one you fixed,
          and solve that — an interviewer is usually testing whether you notice.

  - node: quant-probability.foundations.dice-sum-seven
    hook: >
      This is the calibration question for whether you actually understand
      equal likelihood or are just pattern-matching "dice are uniform" onto
      whatever's in front of you.
    explanation: >
      The two-dice and three-dice cases hinge on the same discipline: build
      $\Omega$ from the finest distinguishable outcomes — ordered results, die
      by die — and only then count. With two dice, all $36$ ordered pairs are
      equally likely by the symmetry of a fair die rolled twice, so any event
      is just a count of pairs over $36$.

      Galileo's puzzle is the same idea one layer deeper. Three dice have
      $6^{3} = 216$ ordered outcomes, all equally likely, but the unordered
      partitions of the sum into three die values are not — a partition like
      $(3,3,3)$ corresponds to exactly one ordered outcome, while a partition
      like $(1,3,6)$ corresponds to six (every permutation of three distinct
      values). Any argument that starts from "there are the same number of
      partitions summing to $9$ as to $10$, so they're equally likely" has
      silently swapped in the wrong sample space; the partitions need to be
      weighted by how many ordered triples realise each one before they can
      be compared.
    worked: >
      Three fair dice, probability the sum is $5$. The ordered triples summing
      to $5$ come from two partitions: $(1,1,3)$, with $3$ arrangements
      (choosing which die shows the $3$), and $(1,2,2)$, also with $3$
      arrangements. That's $6$ ordered triples out of $216$, so
      $\Pr(\text{sum}=5) = 6/216 = 1/36$ — not any count that treats the two
      partitions as equally weighted.
    interview: >
      "Why is a sum of $10$ more likely than a sum of $9$ with three dice,
      when both have the same number of partitions into three values" is
      asked almost verbatim as a historical puzzle; the expected move is
      dropping partitions entirely and counting ordered triples.
    pitfalls: >
      Counting unordered partitions of the sum as if each were one equally
      likely outcome is the exact Galileo mistake. When a partition has a
      repeated value, its arrangement count is smaller than $3! = 6$ (it's
      $3$ for one repeated pair, $1$ for all three equal) — using $6$
      uniformly overcounts those cases.
    recap: >
      Sum $7$ has probability $1/6$ with two dice and sum $5$ has probability
      $1/36$ with three, both from counting ordered outcomes — unordered
      partitions of the sum are never the right sample space.
    steps:
      - teach: >
          Two fair dice: $\Omega$ is the $36$ equally likely ordered pairs, and
          six of them sum to $7$, so $\Pr(\text{sum} = 7) = 6/36 = 1/6$. It is
          the modal sum because $7$ is the only total every first-die value can
          reach.
      - teach: >
          Galileo's gamblers brought him a puzzle: with three dice, $10$ comes
          up more often than $9$, yet each has six unordered partitions into
          values $1$ to $6$. Something in the counting is wrong.
      - ask: >
          Three dice give $216$ ordered triples. $25$ of them sum to $9$ and
          $27$ to $10$. What is $\Pr(\text{sum} = 10)$?
        expects: "1/8"
        tolerance: 0.0005
        hint: >
          $27/216$ simplifies.
        feedback: >
          $27/216 = 1/8 = 0.125$, against $25/216 \approx 0.1157$ for $9$. The
          gap is small but real, and it shows up over enough rolls to be worth
          money.
      - ask: >
          Why does the partition count mislead?
        choices:
          - text: >
              Some partitions are achievable in more ways than others
            correct: true
            feedback: >
              $(3,3,3)$ arises exactly one way while $(1,3,6)$ arises six, so
              the six partitions carry wildly different weight.
          - text: >
              There are actually seven partitions of $10$, not six
            feedback: >
              The partition count is right; it is the assumption that they are
              equally likely that fails.
          - text: >
              The dice are not independent
            feedback: >
              They are perfectly independent. The error is in the choice of
              sample space, not in the mechanism.
        feedback: >
          The unordered list is the wrong $\Omega$. This is §"Equally likely is
          an assumption" in its most famous historical instance.
      - teach: >
          The general lesson is one you can apply cold: when a "surprising"
          empirical frequency contradicts your count, suspect the sample space
          before you suspect the data.

  - node: quant-probability.foundations.divisibility-union
    hook: >
      This is three-event inclusion–exclusion wearing a counting problem's
      clothes, and it's exactly where the alternating sum gets fumbled under
      time pressure.
    explanation: >
      The mechanics generalise directly from the two- and three-event union
      formulas: count integers divisible by each single divisor, then by each
      pairwise least common multiple, then by the least common multiple of all
      three, and alternate signs. "Divisible by $2$ and $3$" means divisible
      by $\operatorname{lcm}(2,3)=6$, not by their product in general — the
      distinction only vanishes when the divisors are pairwise coprime, which
      is why $2$, $3$, $5$ make a clean textbook case.

      There's a built-in check whenever the three divisors are pairwise
      coprime: the complement — sharing no factor with any of them — has count
      approximately $N \cdot \prod (1 - 1/p_{i})$, exact whenever $N$ is a
      multiple of the product of the divisors, because the divisibility
      pattern repeats with that period. Any mismatch between the direct
      inclusion–exclusion count and this product estimate, beyond boundary
      rounding, flags an arithmetic slip in the alternating sum rather than a
      real discrepancy.
    worked: >
      Draw an integer uniformly from $1$ to $100$; find the probability it's
      divisible by $2$, $3$, or $7$. Singles: $50$, $33$, $14$. Pairs:
      multiples of $6$ give $16$, of $14$ give $7$, of $21$ give $4$. Triple:
      multiples of $42$ give $2$. Inclusion–exclusion gives
      $50+33+14-16-7-4+2 = 72$ favourable integers, so the probability is
      $72/100 = 0.72$.
    interview: >
      "What fraction of the numbers from $1$ to $N$ are divisible by $2$,
      $3$, or $5$" checks fluency with inclusion–exclusion under a counting
      disguise — state and compute the full alternating sum without
      hesitation, and expect a follow-up asking for the product estimate as a
      cross-check.
    pitfalls: >
      Using the product of two divisors instead of their least common
      multiple for the pairwise counts is wrong whenever the divisors share a
      factor. Forgetting the final $+$ triple-intersection term
      under-corrects the integers divisible by all three, the same sign error
      as the general three-event case.
    recap: >
      Three overlapping divisibility events resolve by alternating sum to
      $72/100$ here, with the coprime product estimate as the fast sanity
      check.
    steps:
      - teach: >
          Draw an integer uniformly from $1$ to $100$ and ask for the chance it
          is divisible by $2$, $3$ or $5$. Three overlapping events, so
          inclusion–exclusion is the tool — and the counts are all floor
          divisions.
      - ask: >
          How many integers from $1$ to $100$ are divisible by $6$?
        expects: "16"
        hint: >
          Divisible by both $2$ and $3$ means divisible by their least common
          multiple.
        feedback: >
          $\lfloor 100/6 \rfloor = 16$. The pairwise overlaps use the lcm, not
          the product, which matters the moment the two numbers share a factor.
      - teach: >
          Singly there are $50$, $33$ and $20$; the pairwise overlaps are $16$
          for $6$, $10$ for $10$ and $6$ for $15$; and $3$ integers are
          divisible by $30$.
      - ask: >
          Apply the three-event identity. What is the probability?
        expects: "0.74"
        hint: >
          $50 + 33 + 20$, then subtract the three pairs, then add the triple.
        feedback: >
          $50 + 33 + 20 - 16 - 10 - 6 + 3 = 74$ favourable integers, so
          $74/100 = 0.74$. Naively adding $50 + 33 + 20 = 103$ exceeds $100$,
          which flags the double counting before you finish.
      - teach: >
          The complement is the cleaner statement: $26$ of the first $100$
          integers share no factor with $30$. That matches the product form
          $100 \cdot (1 - 1/2)(1 - 1/3)(1 - 1/5) = 26.67$, up to rounding at
          the boundary — the same computation Euler's totient does exactly.
      - teach: >
          Take the habit rather than the number: when the events are "divisible
          by" or "contains at least one", count the complement and check it
          against a product. Two routes agreeing is worth more than one route
          finished quickly.

  - node: quant-probability.foundations.independence-events
    hook: >
      Mixing up "independent" with "disjoint" is the most reliably tested
      confusion in probability interviews, and the two are close to
      opposites, not synonyms.
    explanation: >
      $A$ and $B$ are independent exactly when
      $\Pr(A \cap B) = \Pr(A)\Pr(B)$ — a statement about the probability
      measure, not about the sets themselves or any story you tell about
      them. The same pair of events can be independent under one weighting and
      dependent under another; independence is earned by checking the
      arithmetic, never assumed from a narrative about causation or
      unrelatedness.

      The definition is symmetric in $A$ and $B$ and needs no positivity
      hypothesis to state, though when $\Pr(B) > 0$ it says exactly that
      learning $B$ occurred leaves the probability of $A$ unchanged — the
      conditional reading developed later in the tree, but the multiplicative
      form here is already the complete definition on its own.

      Disjointness pulls the opposite direction: if $A \cap B = \emptyset$ and
      both have positive probability, then
      $\Pr(A\cap B) = 0 \ne \Pr(A)\Pr(B)$, so disjoint events with positive
      probability are never independent — knowing $A$ happened tells you
      decisively that $B$ didn't. Additive structure (disjointness) and
      multiplicative structure (independence) answer different questions, and
      conflating them is the trap.
    worked: >
      Draw one card from a deck. Let $A$ be "the card is a heart"
      ($\Pr(A) = 13/52 = 1/4$) and $B$ be "the card is a face card"
      ($\Pr(B) = 12/52 = 3/13$). The heart face cards are the jack, queen,
      king of hearts, so $\Pr(A \cap B) = 3/52$. Checking the product:
      $(1/4)(3/13) = 3/52$, matching exactly — suit and face-rank are
      independent under a uniform deck, despite no obvious causal link between
      them.
    interview: >
      "Are these two events independent" is answered by computing
      $\Pr(A\cap B)$ and comparing it against $\Pr(A)\Pr(B)$ directly — the
      interviewer listens for that arithmetic check, not an intuitive appeal
      to whether the events "feel" related.
    pitfalls: >
      Assuming two events are independent because they seem physically
      unrelated skips the required check — the multiplication has to actually
      hold. Treating disjoint and independent as interchangeable is the
      reverse error: disjoint events with positive probability are the
      sharpest possible case of dependence.
    recap: >
      Independence means $\Pr(A\cap B)=\Pr(A)\Pr(B)$ exactly, a property of
      the probability measure that must be checked, and it sits opposite
      disjointness rather than alongside it.
    steps:
      - teach: >
          $A$ and $B$ are independent when
          $\Pr(A \cap B) = \Pr(A)\Pr(B)$. That is the whole definition: it is
          symmetric, and it needs no positive-probability hypothesis to be
          stated.
      - teach: >
          When $\Pr(B) > 0$ it says exactly that learning $B$ leaves the chance
          of $A$ unchanged — the conditional form you will meet next unit. But
          the product form is the primitive one, and it is the one to check.
      - ask: >
          $A$ and $B$ are disjoint, both with positive probability. Are they
          independent?
        choices:
          - text: >
              Yes — disjoint events do not influence each other
            feedback: >
              They influence each other maximally: if $A$ happens, $B$ is
              impossible. That is the strongest possible dependence.
          - text: >
              No — $\Pr(A \cap B) = 0$ while $\Pr(A)\Pr(B) > 0$
            correct: true
            feedback: >
              The two sides of the definition disagree, so independence fails.
          - text: >
              Only if $\Pr(A) = \Pr(B)$
            feedback: >
              The product is positive whatever the two values are, and the
              intersection is empty regardless.
        feedback: >
          Disjoint is close to the opposite of independent. Getting these two
          words the right way round is worth more than any formula in this
          lesson.
      - ask: >
          Roll two fair dice. $A$ is "first die is even", $B$ is "the sum is
          $7$". What is $\Pr(A \cap B)$?
        expects: "1/12"
        tolerance: 0.0005
        hint: >
          List the six pairs summing to $7$ and count those with an even first
          entry.
        feedback: >
          Three of the six pairs summing to $7$ start even, so
          $3/36 = 1/12$ — and $\Pr(A)\Pr(B) = (1/2)(1/6) = 1/12$ too. They are
          independent, despite the obvious physical link between the dice.
      - teach: >
          That example is the point: independence is a property of the
          *measure*, not of the story. Change the weights and it can vanish
          without any set changing; two events can be causally entangled and
          still factorise.

  - node: quant-probability.foundations.independence-complements
    hook: >
      This lemma is what licenses multiplying failure probabilities straight
      across — "none of the $n$ independent components fail" factoring into a
      clean product depends on exactly this.
    explanation: >
      If $A$ and $B$ are independent, then $A$ and $B^{c}$ are too. The proof
      needs only one idea: $A \cap B$ and $A \cap B^{c}$ partition $A$, so
      $\Pr(A) = \Pr(A\cap B) + \Pr(A \cap B^{c})$. Substituting independence,
      $\Pr(A\cap B^{c}) = \Pr(A) - \Pr(A)\Pr(B) = \Pr(A)(1-\Pr(B)) =
      \Pr(A)\Pr(B^{c})$ — exactly the independence condition for $A$ and
      $B^{c}$. Swapping the roles of $A$ and $B$, then applying the result
      twice, extends it to all four pairings: $(A,B)$, $(A,B^{c})$,
      $(A^{c},B)$, $(A^{c},B^{c})$.

      Two edge cases are worth carrying forward. Any event with probability
      $0$ or $1$ is independent of every other event, since the product
      identity holds trivially. And an event is independent of itself exactly
      when $\Pr(A) \in \{0,1\}$, because self-independence demands
      $\Pr(A) = \Pr(A)^{2}$, whose only solutions are $0$ and $1$.

      The reason this matters in practice: it justifies computing "none of
      these independent things happen" as a straight product of individual
      complement probabilities, the engine behind reliability and
      de Méré-style questions.
    worked: >
      Roll two fair dice. Let $A$ be "the first die shows $6$" ($\Pr(A)=1/6$)
      and $B$ be "the sum is even" ($\Pr(B)=1/2$). Given the first die is
      $6$, the sum is even exactly when the second die is even too, giving $3$
      of the $36$ outcomes, so $\Pr(A\cap B) = 3/36 = 1/12 = (1/6)(1/2)$:
      independent. The lemma predicts $A$ and $B^{c}$ ("sum is odd") are also
      independent, and indeed
      $\Pr(A \cap B^{c}) = \Pr(A) - \Pr(A\cap B) = 1/6 - 1/12 = 1/12$, which
      equals $(1/6)(1/2)$ exactly as predicted.
    interview: >
      "If $A$ and $B$ are independent, does that tell you anything about $A$
      and not-$B$" is answered by reproducing the one-line proof, not just
      citing the conclusion — a sharp follow-up asks for the probability-$0$-
      or-$1$ edge case.
    pitfalls: >
      The lemma covers all four sign combinations, not just the one you
      happened to check — forgetting that $A^{c}$ and $B^{c}$ also need the
      argument applied leaves half the claim unproven. Assuming any event is
      independent of itself in general is false outside the $\{0,1\}$ edge
      case.
    recap: >
      Independence survives negating either event, which is exactly what
      licenses multiplying complement probabilities together.
    steps:
      - teach: >
          If $A$ and $B$ are independent, so are $A$ and $B^{c}$, and $A^{c}$
          and $B$, and $A^{c}$ and $B^{c}$. Independence survives complementing
          either side.
      - teach: >
          The proof is two lines of the difference rule:
          $\Pr(A \cap B^{c}) = \Pr(A) - \Pr(A \cap B)
          = \Pr(A) - \Pr(A)\Pr(B) = \Pr(A)\Pr(B^{c})$. Relabelling gives the
          other three.
      - ask: >
          $A$ and $B$ are independent with $\Pr(A) = 0.3$ and
          $\Pr(B) = 0.5$. What is $\Pr(A \cap B^{c})$?
        expects: "0.15"
        feedback: >
          $0.3 \times 0.5 = 0.15$. You may multiply directly because the lemma
          says $A$ and $B^{c}$ are independent too — no separate argument
          needed.
      - teach: >
          This lemma is quietly why the "at least one" technique works: "none
          of them occur" is an intersection of complements, and it factorises
          exactly when "all of them occur" does.
      - ask: >
          For which $A$ is $A$ independent of *itself*?
        choices:
          - text: >
              Every event — the definition is symmetric
            feedback: >
              Symmetry is about swapping $A$ and $B$, not about setting them
              equal.
          - text: >
              Exactly those with $\Pr(A) \in \{0, 1\}$
            correct: true
            feedback: >
              The condition reads $p = p^{2}$, whose only solutions are $0$ and
              $1$.
          - text: >
              Only $A = \Omega$
            feedback: >
              $\emptyset$ works too, as does any event of probability $0$ or
              $1$.
        feedback: >
          $p = p^{2}$ forces $p \in \{0, 1\}$ — and the same computation shows
          an event of probability $0$ or $1$ is independent of *everything*,
          which is the degenerate case worth remembering.

  - node: quant-probability.foundations.pairwise-vs-mutual
    hook: >
      "Every pair multiplies correctly" feels like it should be enough to
      call three events independent, and the gap between that check and the
      real definition is exactly where interviewers like to catch unprepared
      candidates.
    explanation: >
      Mutual independence of $A_{1},\dots,A_{n}$ demands
      $\Pr(\bigcap_{i\in S} A_{i}) = \prod_{i \in S} \Pr(A_{i})$ for every
      subset $S$ with $|S|\ge 2$ — that's $2^{n} - n - 1$ separate equations,
      not just the $\binom{n}{2}$ pairwise ones. Checking only pairs verifies
      a small fraction of what's actually required once $n \ge 3$.

      Pairwise checks can pass while mutual independence fails because a
      third event can be a deterministic function of the first two in a way
      invisible to any single pairwise comparison — each pair still
      multiplies correctly on its own, but the triple intersection is
      constrained by that hidden functional relationship rather than genuine
      three-way independence. Knowing any two of three such events pins down
      the third exactly, a much stronger statement than any pairwise check can
      detect.

      This is why "independent" claims about more than two events need to
      specify mutual independence explicitly, or state which subset of the
      equations has actually been verified — a model that's only pairwise
      independent can still have highly predictable joint behaviour.
    worked: >
      Roll two fair dice. Let $A$ be "first die is odd", $B$ be "second die is
      odd", and $C$ be "the sum is even" — $C$ occurs exactly when both dice
      are odd or both are even. Each has probability $1/2$. Checking pairs:
      $A \cap B$ is "both odd", probability $1/4 = (1/2)(1/2)$. $A \cap C$ is
      also exactly "both odd" (an odd first die gives an even sum only if the
      second is odd too), so $\Pr(A\cap C) = 1/4$ as well, and $B\cap C$
      matches by the same logic — all three pairs check out. But
      $A\cap B\cap C$ is again just "both odd", with probability
      $1/4 \ne (1/2)^{3} = 1/8$: mutual independence fails even though every
      pair passed.
    interview: >
      "If every pair of these events is independent, are all three mutually
      independent" is answered with an immediate no, backed by a ready
      construction like this one — citing the fact without a concrete
      counterexample reads as memorised rather than understood.
    pitfalls: >
      Treating a pairwise-independence check as sufficient evidence for
      "these are all independent" claims in a larger model silently drops
      most of the required equations. When one event is a deterministic
      function of two others (a sum's parity, an agreement indicator), that's
      the structural signature to watch for — it can pass every pairwise test
      while remaining completely predictable given any two of the events.
    recap: >
      Pairwise independence checks only $\binom{n}{2}$ of the $2^{n}-n-1$
      equations mutual independence actually requires, and a third event
      built from two independent ones typically fails the higher-order test.
    steps:
      - teach: >
          Mutual independence of $A_1, \dots, A_n$ demands
          $\Pr(\bigcap_{i \in S} A_i) = \prod_{i \in S} \Pr(A_i)$ for
          *every* subset $S$ of size at least $2$ — not merely for the pairs.
      - ask: >
          For $n = 3$, how many separate equations is that?
        expects: "4"
        hint: >
          Subsets of size $2$ or more: count them as $2^{n} - n - 1$.
        feedback: >
          $2^{3} - 3 - 1 = 4$: the three pairs and the triple. Checking only the
          three pairwise ones leaves a genuine condition untested, and the next
          card is where that bites.
      - teach: >
          The standard counterexample: toss two fair coins. Let $A$ be "first
          is heads", $B$ be "second is heads", and $C$ be "the two agree". Each
          has probability $1/2$.
      - ask: >
          Every pair here has intersection probability $1/4$. What is
          $\Pr(A \cap B \cap C)$?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          If the first two hold, what does $C$ add?
        feedback: >
          $A \cap B$ is "both heads", which already forces agreement — so the
          triple intersection is still $1/4$, not $(1/2)^{3} = 1/8$. Pairwise
          independent, mutually dependent.
      - teach: >
          The structural reason: any two of the three determine the third. That
          is invisible to every pairwise check and obvious the moment you look
          at the triple.
      - teach: >
          In practice, if a problem hands you "pairwise independent" and you
          reach for a product over all $n$ events, stop. That step needs mutual
          independence, and it is exactly the step an interviewer is watching
          for.

  - node: quant-probability.foundations.at-least-one
    hook: >
      "At least one" is the trigger phrase for this technique, and de Méré's
      paradox is the classic story to have ready when an interviewer asks why
      it matters.
    explanation: >
      A union doesn't factor under independence, but its complement — "none
      of them happen" — is an intersection, and intersections of independent
      events do factor. That's the whole technique: compute the probability
      that nothing happens, using independence to turn the intersection into
      a product, then subtract from $1$. For independent events with
      probabilities $p_{1},\dots,p_{n}$,
      $\Pr(\text{at least one}) = 1 - \prod_{i=1}^{n}(1-p_{i})$, which becomes
      $1-(1-p)^{n}$ when every event shares the same probability $p$.

      De Méré's two bets are the historical proof that this arithmetic
      matters: at least one six in four rolls of one die is
      $1-(5/6)^{4} = 671/1296 \approx 0.5177$, favourable to the bettor, while
      at least one double-six in $24$ rolls of two dice is
      $1-(35/36)^{24}\approx 0.4914$, unfavourable — a difference small enough
      that gamblers noticed the pattern empirically before anyone could
      explain it, which is what motivated Pascal and Fermat's correspondence.
    worked: >
      Roll a fair die $10$ times; what's the probability of at least one $6$?
      None-at-all has probability $(5/6)^{10} \approx 0.1615$, so at least one
      $6$ has probability $1 - (5/6)^{10} \approx 0.8385$.
    interview: >
      The phrase "at least one" is the cue itself — the interviewer wants the
      complement-and-product move reached for immediately, not an attempt to
      sum $\Pr(\text{exactly one}) + \Pr(\text{exactly two}) + \cdots$ term by
      term. A common follow-up is "how many trials until it's better than even
      odds", solved by finding the smallest $n$ with $(1-p)^{n} < 1/2$.
    pitfalls: >
      The product step requires independence — applying $1-(1-p)^{n}$ to
      draws without replacement, where trials are no longer independent,
      gives the wrong answer. Approximating with $np$ instead of the exact
      $1-(1-p)^{n}$ is only valid for small $p$ and moderate $n$, and
      silently breaks down once $np$ isn't small.
    recap: >
      "At least one" becomes $1-\prod(1-p_{i})$ by complementing into an
      intersection that independence lets you factor — the identity behind
      de Méré's $0.518$ against $0.491$.
    steps:
      - teach: >
          Whenever a question says "at least one", compute the probability of
          *none* and subtract. The reason is structural: "none" is an
          intersection, and intersections factorise under independence while
          unions do not.
      - teach: >
          For independent events with probabilities $p_1, \dots, p_n$,
          $\Pr(\text{at least one}) = 1 - \prod_{i=1}^{n}(1 - p_i)$, which
          collapses to $1 - (1-p)^{n}$ when they are identical.
      - ask: >
          What is the probability of at least one six in four rolls of a fair
          die?
        expects: "671/1296"
        tolerance: 0.0005
        hint: >
          Each roll avoids a six with probability $5/6$, and the rolls are
          independent.
        feedback: >
          $1 - (5/6)^{4} = 671/1296 \approx 0.5177$. Just over a half, so the
          bet is favourable — this is the first of de Méré's two wagers.
      - teach: >
          His second: at least one double six in $24$ rolls of two dice. The
          per-roll chance is $1/36$, and the naive scaling argument says
          $24/36$ should match $4/6$, so the two bets ought to be equally good.
      - ask: >
          Compute it. What is $1 - (35/36)^{24}$, to four decimal places?
        expects: "0.4914"
        tolerance: 0.0005
        feedback: >
          $\approx 0.4914$ — just *under* a half, so the second bet loses money
          where the first makes it. The near miss is what sent de Méré to
          Pascal, and it is why the subject exists.
      - teach: >
          The moral is about the scaling, not the arithmetic:
          $1 - (1-p)^{n}$ is concave in $n$, so doubling the trials never quite
          doubles the chance. Reasoning with $np$ is a first-order
          approximation that is already wrong at these numbers.

  - node: quant-probability.foundations.continuity-limits
    hook: >
      This is the fine print that justifies solving a "first success on toss
      $k$" problem by summing an infinite series of case probabilities —
      without it, splitting an event into infinitely many pieces is a leap of
      faith rather than a proof.
    explanation: >
      For a monotone increasing sequence $A_{1} \subseteq A_{2} \subseteq
      \cdots$, continuity says $\Pr(\bigcup_{n} A_{n}) = \lim_{n} \Pr(A_{n})$
      — the probability of the eventual union is exactly the limit of the
      individual probabilities, not merely bounded by it. The proof
      disjointifies the sequence: set $B_{1} = A_{1}$ and
      $B_{n} = A_{n} \setminus A_{n-1}$ for $n \ge 2$; the $B_{n}$ are
      pairwise disjoint with $\bigcup_{n} B_{n} = \bigcup_{n} A_{n}$, so
      countable additivity gives $\Pr(\bigcup_{n} A_{n}) = \sum_{n}
      \Pr(B_{n})$, and the partial sums of that series are exactly
      $\Pr(A_{n})$ by construction.

      The working consequence is what makes this more than a technicality:
      whenever an event naturally splits into countably many disjoint cases
      indexed by $k=1,2,3,\dots$ (which toss, which draw, which round), the
      probability of the event is legitimately the sum of the series
      $\sum_{k} \Pr(\text{case } k)$, not just bounded above or below by it.
      That licence is what turns "sum a geometric series over the cases" from
      a heuristic into a proof.
    worked: >
      Flip a fair coin repeatedly and let $A_{n}$ be "a head appears within
      the first $n$ tosses", an increasing sequence with
      $\Pr(A_{n}) = 1-(1/2)^{n}$. At $n=5$,
      $\Pr(A_{5}) = 1 - 1/32 = 31/32 = 0.96875$. As $n\to\infty$,
      $\Pr(A_{n})\to 1$, matching continuity's prediction that
      $\Pr(\bigcup_{n} A_{n})$, "a head eventually appears", equals that
      limit exactly — $1$, not merely close to it.
    interview: >
      "Does the probability of eventually seeing a head equal exactly $1$, or
      just approach it" tests whether you can justify the answer via
      continuity rather than hand-waving "because it's almost certain
      eventually".
    pitfalls: >
      Continuity requires the sequence to actually be monotone — applying it
      to an arbitrary, non-nested sequence of events isn't valid. Summing
      probabilities of the $A_{n}$ directly, rather than the disjointified
      differences $B_{n}$, double-counts the overlapping parts of an
      increasing sequence.
    recap: >
      Probabilities of a growing sequence of events converge to the
      probability of their union, exactly what licenses summing an infinite
      disjoint decomposition as a series.
    steps:
      - teach: >
          Given finite additivity, countable additivity is *equivalent* to
          continuity along monotone sequences. Increasing: if
          $A_1 \subseteq A_2 \subseteq \cdots$ then
          $\Pr(\bigcup_n A_n) = \lim_n \Pr(A_n)$. Decreasing: the same with
          intersections.
      - teach: >
          The proof of the increasing case is a disjointification. Put
          $B_1 = A_1$ and $B_n = A_n \setminus A_{n-1}$; the $B_n$ are
          pairwise disjoint with the same union, and the partial sums of their
          probabilities are exactly $\Pr(A_n)$.
      - ask: >
          $A_n$ is "the first head arrives by toss $n$", for a fair coin. What
          is $\Pr(\bigcup_n A_n)$?
        expects: "1"
        hint: >
          The $A_n$ increase, so take the limit of
          $\Pr(A_n) = 1 - 2^{-n}$.
        feedback: >
          $\lim_n (1 - 2^{-n}) = 1$. So "a head eventually arrives" has
          probability $1$, and the never-a-head outcome has probability $0$
          without being impossible — a distinction that matters.
      - ask: >
          An event is a countable disjoint union of cases. Its probability is:
        choices:
          - text: >
              At most the sum of the cases' probabilities
            feedback: >
              True but weaker than what the axiom gives. That bound holds
              without disjointness; here you get equality.
          - text: >
              Exactly the sum of the series
            correct: true
            feedback: >
              Countable additivity gives equality, not a bound — which is the
              licence to split into infinitely many cases and just add them up.
        feedback: >
          This is the working payoff of the axiom: split an event into
          countably many disjoint cases, sum the series, and the value *is* the
          probability. The next lesson does exactly that.

  - node: quant-probability.foundations.first-head-odd
    hook: >
      Waiting-time interview questions almost all reduce to this pairing: sum
      a geometric series over the cases that satisfy the condition, then
      cross-check with a one-line first-step recursion.
    explanation: >
      The event "the first head lands on toss $k$" has probability
      $(1/2)^{k}$ by independence of tosses, and these events for
      $k=1,2,3,\dots$ are pairwise disjoint with total probability $1$
      (continuity guarantees the never-a-head outcome contributes probability
      $0$). Any question of the form "what's the probability the first
      success falls in some set of positions" is answered by summing
      $(1/2)^{k}$ over exactly that set of $k$'s, and when the set is an
      arithmetic progression the sum is a geometric series with the common
      ratio set by the spacing.

      The first-step recursion is the fast cross-check: condition on the
      first toss, express the target probability in terms of itself one step
      later, and solve the resulting linear equation. Both routes must agree,
      and checking a quick special case — do the probabilities over all $k$
      actually sum to $1$? — catches indexing mistakes in the series before
      they propagate into a wrong final answer.
    worked: >
      Roll a fair die repeatedly until the first $6$ appears; what's the
      probability the first $6$ lands on an even-numbered roll? Toss $k$ is
      the first six with probability $(5/6)^{k-1}(1/6)$, so summing over even
      $k=2,4,6,\dots$ gives a geometric series with first term
      $(5/6)(1/6)=5/36$ and ratio $(5/6)^{2}=25/36$, totalling
      $\dfrac{5/36}{1-25/36} = \dfrac{5}{11}$. Recursion cross-check: let $q$
      be the answer; conditioning on the first roll, $q = (5/6)(1-q)$, since a
      non-six first roll shifts "even overall" to "odd in the remaining
      sequence", giving $q = 5/11$ again.
    interview: >
      "You roll a die until you see a $6$ — what's the probability it happens
      on an even roll" is the canonical phrasing; the interviewer wants the
      series-over-a-subsequence approach named immediately, with the
      recursion offered unprompted as the check.
    pitfalls: >
      Summing only even- or odd-indexed terms means the series ratio is
      $(1-p)^{2}$, not $1-p$ — using the single-step ratio miscounts by
      skipping every other term incorrectly. Skipping the total-probability
      sanity check leaves an indexing error undetected until it's too late to
      catch cheaply.
    recap: >
      Split the event by which toss achieves it, sum the resulting geometric
      series over the right subsequence, and confirm with a one-line
      first-step recursion.
    steps:
      - teach: >
          A fair coin is tossed until the first head. What is the chance it
          arrives on an odd-numbered toss? The event splits into countably many
          disjoint cases, one per landing toss.
      - ask: >
          What is the probability the first head lands on toss $3$?
        expects: "1/8"
        tolerance: 0.0005
        hint: >
          Two tails, then a head — and the tosses are independent.
        feedback: >
          $(1/2)^{3} = 1/8$. In general the first head lands on toss $k$ with
          probability $2^{-k}$: the first $k-1$ tosses are tails and the $k$-th
          is a head.
      - teach: >
          Now sum over the odd $k$. That is
          $\sum_{j \ge 0} 2^{-(2j+1)} = \tfrac{1}{2}\sum_{j \ge 0} 4^{-j}$,
          a geometric series with ratio $1/4$.
      - ask: >
          What does it come to?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          $\sum_{j \ge 0} r^{j} = 1/(1-r)$ for $|r| < 1$.
        feedback: >
          $\dfrac{1/2}{1 - 1/4} = \dfrac{2}{3}$. The totals check out: all $k$
          together sum to $1$, so the even tosses take the remaining $1/3$ and
          the never-a-head outcome has probability $0$.
      - teach: >
          There is a one-line route that avoids the series entirely. Condition
          on the first toss: with probability $1/2$ you win immediately, and
          otherwise you are the *opponent* in the same game, so
          $q = 1/2 + (1/2)(1 - q)$, giving $q = 2/3$.
      - teach: >
          Carry the second method. First-step recursion is the tool that scales
          to the harder versions of this question, where the series is
          unpleasant or does not have a closed form at all.

  - node: quant-probability.foundations.odds
    hook: >
      Trading desks and betting markets quote odds, not probabilities, and
      converting between the two instantly, in either direction, is a
      baseline fluency check.
    explanation: >
      The odds in favour of $A$ are the ratio of $A$'s probability to its
      complement's, $o = \Pr(A)/\Pr(A^{c}) = p/(1-p)$, which inverts back to
      $p = o/(1+o)$ — both follow directly from the complement rule. Quoted
      as "$a$ to $b$ on", the implied probability is $a/(a+b)$; quoted as
      "$a$ to $b$ against" — the standard bookmaker phrasing, meaning a stake
      of $b$ returns $a$ in profit — the implied probability is $b/(a+b)$, the
      two conventions swapping which number sits on top.

      Decimal odds collapse this further: $d$ is the total return per unit
      staked, stake included, so the implied probability is simply $1/d$, no
      separate on/against bookkeeping required. Odds rather than
      probabilities are the natural quoting scale because they're the scale
      on which new evidence updates multiplicatively rather than additively
      — a fact this unit sets up and the conditional-probability material
      later makes precise.
    worked: >
      A market quotes "$5$ to $2$ against" a particular outcome. The implied
      probability is $b/(a+b) = 2/(5+2) = 2/7 \approx 0.286$, and the
      corresponding decimal odds are $d = 1/p = 7/2 = 3.5$.
    interview: >
      "The market's quoting $5$ to $2$ against — what's the implied
      probability" is meant to be answered in one line, cold; a companion
      question converts a decimal quote like $3.50$ straight to
      $1/3.50 \approx 0.286$.
    pitfalls: >
      Swapping "on" and "against" flips which of $a$ and $b$ belongs in the
      numerator, inverting the answer. Decimal odds already include the
      returned stake, so the implied probability is $1/d$, not $1/(d-1)$ or
      any adjustment for "net" profit.
    recap: >
      Odds are the ratio of an event's probability to its complement's, and
      any quoted price — fractional, decimal, or spoken — converts directly
      into an implied probability.
    steps:
      - teach: >
          The odds in favour of an event are the ratio
          $o = \Pr(A)/\Pr(A^{c}) = p/(1-p)$, and the inverse is
          $p = o/(1+o)$. Probabilities live on $[0,1]$; odds live on
          $[0, \infty)$, which is why evidence updates multiplicatively on
          them.
      - teach: >
          Quoting conventions matter more than the algebra. "$a$ to $b$ on"
          implies $a/(a+b)$; "$a$ to $b$ against" — the usual bookmaker
          convention, meaning you win $a$ per $b$ staked — implies $b/(a+b)$.
      - ask: >
          A price is quoted at $3$ to $1$ against. What is the implied
          probability?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          Against means you win $3$ per $1$ staked, so there are four parts in
          total and the event is one of them.
        feedback: >
          $1/(3+1) = 1/4$. Reading it as $3/4$ — the "on" convention — is the
          error that turns a cheap price into an expensive one.
      - teach: >
          Decimal odds $d$ are the total return per unit staked, including the
          stake. So the implied probability is simply $1/d$, which is why
          European books quote them.
      - ask: >
          Decimal odds of $1.25$ imply what probability?
        expects: "0.8"
        feedback: >
          $1/1.25 = 0.8$, which is $4$ to $1$ *on*. Short prices have decimal
          odds close to $1$; the stake is most of the return.
      - teach: >
          Worth knowing cold: $p = 1/2$ is evens and $d = 2.0$; $p = 1/4$ is
          $3$ to $1$ against and $d = 4.0$; $p = 0.8$ is $4$ to $1$ on and
          $d = 1.25$. Converting between the three without pausing is a real
          interview signal.

  - node: quant-probability.foundations.implied-probability-vig
    hook: >
      Every two-sided quote on a real desk has a hold baked into it, and
      reading a quoted price as if it were a fair probability, without
      stripping that hold first, overstates every single outcome at once.
    explanation: >
      Converting each side of a two-way market to an implied probability via
      $1/d$ and adding them up reveals the overround whenever the sum exceeds
      $1$ — that excess is the house's structural edge, the direct analogue
      of a bid-ask spread in a market-making context. Normalising each
      implied probability by dividing by the total recovers the fair, no-vig
      prices that should sum to exactly $1$.

      The hold as a fraction of turnover follows from the same numbers: with
      equal stakes on both sides of a symmetric two-sided market at decimal
      odds $d$ on each side, staking $1$ on each side risks $2$ total, and the
      book pays out $d$ whichever way it lands, keeping $2-d$ — a hold of
      $(2-d)/2$, which also equals $1 - 1/(\text{sum of implied
      probabilities})$. A market whose implied probabilities sum below $1$
      inverts the whole story: that isn't a generous price, it's a real
      arbitrage, a genuine mispricing rather than a modelling artefact.
    worked: >
      A book quotes decimal $1.95$ on both sides of a two-way market. Each
      side implies $1/1.95 \approx 0.5128$, summing to $1.0256$ — an
      overround of $2.56\%$. Normalising, the fair probability on each side is
      $0.5128/1.0256 = 0.5$, as expected by symmetry. Staking $1$ on each side
      risks $2$ and returns $1.95$ regardless of outcome, so the hold is
      $(2-1.95)/2 = 0.025$, or $2.5\%$ of turnover — matching
      $1 - 1/1.0256$ up to rounding.
    interview: >
      "The book's quoting $X$ on both sides — what's the vig" is answered by
      converting to implied probabilities, summing, and subtracting $1$; a
      natural follow-up asks for the fair no-vig price, the normalised
      version of the same two numbers.
    pitfalls: >
      Reading a quoted decimal price directly as a fair probability, without
      summing both sides and normalising, systematically overstates the true
      chance of whichever side you're looking at. Seeing implied
      probabilities sum below $1$ and treating it as an unusually good deal
      misses that it's an arbitrage — a riskless profit by betting both
      sides, not a bargain.
    recap: >
      Two-sided prices of $1.95$ imply $102.56\%$ of probability; the $2.5\%$
      excess is the hold, and a sum below $100\%$ is free money, not a good
      price.
    steps:
      - teach: >
          A book quotes decimal $1.90$ on each side of a two-way market. Both
          sides cannot be fair — and the size of the unfairness is the whole
          point of the example.
      - ask: >
          What probability does $1.90$ imply, to four decimal places?
        expects: "0.5263"
        tolerance: 0.0005
        hint: >
          Decimal odds $d$ imply $1/d$.
        feedback: >
          $1/1.90 = 0.5263$. Each side alone looks like a plausible near-even
          price; the problem only appears when you add them.
      - ask: >
          What do the two implied probabilities sum to?
        expects: "1.0526"
        tolerance: 0.0005
        feedback: >
          $2 \times 0.5263 = 1.0526$. The excess over $1$ — here $5.26\%$ — is
          the overround, and it is the book's margin, the direct analogue of a
          bid-ask spread.
      - teach: >
          Normalising by that total recovers the fair prices: $0.5$ each, as
          symmetry demanded all along. Reading a quoted price as a probability
          without stripping the overround overstates every outcome in the
          market.
      - teach: >
          The book's side of it: with balanced flow it takes $2$ in stakes and
          pays $1.90$ whichever way the event lands, keeping $0.10$. That is a
          hold of $0.10/2 = 5\%$ of turnover, which also equals
          $1 - 1/1.0526$.
      - ask: >
          A two-way market's implied probabilities sum to $0.98$. What does
          that mean?
        choices:
          - text: >
              The book has priced in a $2\%$ margin
            feedback: >
              A margin makes the sum exceed $1$. A sum below $1$ is the book
              paying *out* an edge.
          - text: >
              There is an arbitrage
            correct: true
            feedback: >
              Staking in proportion to the implied probabilities returns more
              than it costs, whichever side wins.
          - text: >
              The quotes are simply fair
            feedback: >
              Fair means the sum is exactly $1$; $0.98$ is strictly better than
              fair for the bettor.
        feedback: >
          Below $1$ is free money — which is why it is only ever visible across
