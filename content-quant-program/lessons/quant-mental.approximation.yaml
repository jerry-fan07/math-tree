unit: quant-mental.approximation
opening: >
  Every fast estimate on a trading desk is a Taylor series cut short, and this
  unit builds the toolkit for cutting it short safely: truncation error as the
  honest price of speed, the small-x expansions for logs and exponentials
  that power compounding and rates, square roots by linearization, and the
  rule of 72 for doubling times. A short table of memorized constants — logs,
  roots, powers of two — turns those techniques into single-line arithmetic,
  and a run of worked examples (digit counts, annualizing a rate, sizing a
  market move in sigmas, the up-then-down percent trap) shows them combining
  under real interview pressure. It closes on the one habit that makes all of
  it trustworthy: always name the size of what you dropped.
lessons:
  - node: quant-mental.approximation.truncation-error
    hook: >
      Every fast approximation in this unit is a Taylor series cut short —
      the gap between a defensible estimate and a wild guess is being able to
      size, on the spot, the piece you just threw away.
    explanation: >
      Taylor's theorem already hands you an exact remainder:
      $R_k(x) = f^{(k+1)}(\xi)/(k+1)!\,x^{k+1}$ for some unknown $\xi$
      between $0$ and $x$. Since $\xi$ is unknown, the practical move is to
      swap it for the nearest point you can evaluate — usually $0$ — and
      treat $f^{(k+1)}(0)/(k+1)!\,x^{k+1}$ as a stand-in for the remainder.
      That stand-in is not a proof of the error, only a fast reading of its
      scale, and that reading is almost always enough at a desk.

      The mental model: a Taylor series is a stack of ever-smaller
      corrections, and any estimate you compute by hand only ever keeps
      finitely many of them. The size of the first correction you didn't
      keep is the honest error bar on everything above it, because for a
      smooth function at small $x$ each successive term is smaller by
      roughly another factor of $x$. You already computed most of what's
      needed to state that term — it costs one more derivative and one more
      power of $x$, not a new calculation.

      The pattern to keep: decide how many terms you can afford, compute the
      estimate, then glance at the next term before reporting a number.
      Every technique later in this unit — logs, roots, powers, compounding
      — is exactly this move applied to a specific function.
    worked: >
      Keep two terms of $\cos x \approx 1 - x^{2}/2$ at $x = 0.2$:
      $1 - 0.02 = 0.98$. The next Taylor term is $x^{4}/24 = 0.0016/24
      \approx 0.0000667$, so the estimate should be high by about that much.
      Exact value: $\cos(0.2) = 0.980067$, an actual error of $0.0000667$ —
      the dropped term predicted it almost to the digit.
    interview: >
      Interviewers who ask you to approximate anything will immediately
      follow with "how far off is that, and which way" — answering before
      being asked is the tell of someone who has internalized this. Expect
      the follow-up to test whether you can name the error's order of
      magnitude in one line, not derive a rigorous bound.
    pitfalls: >
      Treating "the next term" as a guarantee rather than a heuristic — it
      can fail near a zero of the next derivative, though that's rare for
      the smooth functions this unit uses. Forgetting the remainder scales
      like $x^{k+1}$: doubling $x$ multiplies a first-order error by roughly
      $4\times$, a cubic term's error by $8\times$ — not by $2\times$.
    recap: >
      An approximation's error bar is the size of the first Taylor term you
      dropped, and it shrinks like a power of $x$, not linearly.
    dialogue:
      - part: An estimate with no error attached
        teach: >
          No calculator. A colleague needs $e^{0.3}$ and writes down
          $1 + 0.3 = 1.3$, keeping the first two terms of the series for
          $e^{x}$. You want to know how much to trust that number before
          anyone checks it.
      - ask: >
          Keep one more term of the series: $1 + x + x^{2}/2$ at $x = 0.3$.
          What do you get?
        expects: "1.345"
        hint: >
          The new piece is $0.3^{2}/2$.
        feedback: >
          $0.3^{2}/2 = 0.09/2 = 0.045$, so $1 + 0.3 + 0.045 = 1.345$. The
          exact value is $1.349859$.
      - ask: >
          Before you computed that, how far off could you have said the
          colleague's $1.3$ was?
        choices:
          - text: >
              Impossible to say without the exact value.
            feedback: >
              You just did it: the term the colleague left out is $0.045$,
              and the true miss is $1.349859 - 1.3 = 0.0499$. The size of
              the first piece you skip is available before any check.
          - text: >
              About $0.3$, the size of the last term kept.
            feedback: >
              The last term kept is already *in* the estimate, so it cannot
              be what is missing from it. Its size says nothing about the
              gap, which is $0.0499$ — six times smaller.
          - text: >
              About $0.045$, the size of the first term dropped.
            correct: true
            feedback: >
              Right to one significant figure: the true miss is $0.0499$.
              The rest of the gap is the next term, $0.3^{3}/6 = 0.0045$,
              ten times smaller again.
          - text: >
              About $0.0045$, the term after that.
            feedback: >
              That is the second term the colleague dropped, and it is
              small precisely because it sits behind $0.045$. The gap is
              dominated by the first omission, not the second.
        feedback: >
          The colleague's estimate is short by roughly $0.045$, and short —
          not long — because every term of $e^{x}$ at positive $x$ is
          positive.
      - reflect: >
          Why should the first term you drop, rather than the whole infinite
          tail behind it, be a fair stand-in for the error? Look at how each
          term of $e^{0.3}$ compares with the one before it.
        hint: >
          Divide the term $x^{n+1}/(n+1)!$ by the term $x^{n}/n!$.
        answer: >
          Each term is the previous one times $x/(n+1)$, which at $x = 0.3$
          is $0.15$, then $0.1$, then $0.075$. So the tail behind the first
          dropped term is that term times roughly
          $1 + 0.1 + 0.01 + \dots$: a few percent more, not a different
          order of magnitude. When $x$ is small the series is a stack of
          ever-smaller corrections, and the first one you skip carries
          almost all of the missing weight.
      - teach: >
          That is the proposition. Truncate the Taylor series of a smooth
          $f$ after the $x^{k}$ term, and the remainder is of order
          $x^{k+1}$: Taylor's theorem gives it exactly as
          $f^{(k+1)}(\xi)/(k+1)!\,x^{k+1}$ for some unknown $\xi$ between
          $0$ and $x$. Swapping $\xi$ for $0$ gives the working rule — the
          error bar is about $|f^{(k+1)}(0)/(k+1)!|\,x^{k+1}$, the size of
          the first term you threw away. Not zero, and not the last term
          you kept.
      - part: How the error scales with x
        ask: >
          The same colleague now estimates $e^{0.15} \approx 1.15$. What
          error bar goes with it?
        expects: "0.01125"
        tolerance: 0.00005
        hint: >
          The first dropped term is still $x^{2}/2$.
        feedback: >
          $0.15^{2}/2 = 0.0225/2 = 0.01125$. The exact value is $1.161834$,
          a true miss of $0.0118$.
      - ask: >
          Halving $x$ from $0.3$ to $0.15$ shrank that error bar from
          $0.045$ to $0.01125$. By what factor?
        expects: "4"
        feedback: >
          $0.045/0.01125 = 4$. The dropped term is $x^{2}/2$, and halving
          $x$ divides $x^{2}$ by $2^{2} = 4$. A linear estimate's error
          falls with the square of the step, not in proportion to it.
      - ask: >
          Now keep three terms, $1 + x + x^{2}/2$, so the first dropped term
          is $x^{3}/6$. Halving $x$ divides that error bar by what factor?
        expects: "8"
        feedback: >
          $x^{3}$ falls by $2^{3} = 8$. Each extra term you keep adds a power
          to the scaling: the remainder after order $k$ shrinks like
          $x^{k+1}$, which is why a small enough $x$ makes even a short
          truncation very good.
      - part: Size and direction from one term
        ask: >
          Estimate $\cos(0.4) \approx 1 - x^{2}/2 = 0.92$. The first term
          dropped is $x^{4}/24$. How large is it?
        expects: "0.001067"
        tolerance: 0.00001
        hint: >
          $0.4^{4} = 0.0256$.
        feedback: >
          $0.0256/24 = 0.001067$. The exact value is $\cos(0.4) = 0.921061$,
          a miss of $0.001061$ — the dropped term called it to three
          figures.
      - ask: >
          Without the exact value, is $0.92$ above or below $\cos(0.4)$?
        choices:
          - text: >
              Above: truncating always overestimates.
            feedback: >
              Truncation has no built-in direction. For $e^{0.3}$ the estimate
              came out low; whether it is high or low depends on the sign of
              what was dropped.
          - text: >
              Below: the dropped term $+x^{4}/24$ is positive.
            correct: true
            feedback: >
              The estimate left out a positive amount, so it sits under the
              truth: $0.92 < 0.921061$. The next term, $-x^{6}/720$, is
              about $0.000006$ and cannot overturn that.
          - text: >
              Cannot tell: the series alternates, so the sign is unknown.
            feedback: >
              Alternation is what makes it easy. The first omitted term
              dominates the tail, so its sign is the sign of the error, and
              here it is $+x^{4}/24$.
        feedback: >
          One glance at the first dropped term gives both numbers you owe
          the listener: how far, and which way. "About $0.92$, low by
          roughly $0.001$."
      - part: Where the rule stops working
        ask: >
          Someone uses the same idea on $e^{2} \approx 1 + 2 + 2 = 5$ and
          quotes an error bar of $2^{3}/6 \approx 1.33$. The exact value is
          $7.389$, a miss of $2.39$. What went wrong?
        choices:
          - text: >
              Nothing: $1.33$ and $2.39$ are the same order of magnitude.
            feedback: >
              The true miss is $80\%$ larger than the bar, and a bar that
              small is not a bar. At small $x$ the first dropped term matched
              to a few percent; here it covers barely half the gap.
          - text: >
              The terms are not shrinking fast: each is only about half the
              one before, so the tail nearly doubles the first dropped term.
            correct: true
            feedback: >
              The ratio $x/(n+1)$ is $2/4 = 0.5$, then $2/5$, then $2/6$.
              The tail is $1.33 + 0.67 + 0.27 + 0.09 + \dots = 2.39$. The
              rule leans on each term being much smaller than the last, and
              at $x = 2$ that fails.
          - text: >
              The formula for the dropped term is wrong; it should be the
              last term kept, $2$.
            feedback: >
              $2$ happens to be closer, but by accident. The fault is not in
              which term was read; it is that no single term carries the
              tail when the terms shrink slowly.
        feedback: >
          "Where that term is small" is part of the proposition. Before
          trusting the next term as an error bar, check that the terms after
          it fall off quickly — at $x = 0.3$ they do, at $x = 2$ they do not.
      - ask: >
          Estimate $\cos(0.1) \approx 1$, keeping only the constant. Read
          literally, the next term is the $x$ term, and $\cos$ has none: its
          coefficient is $f'(0) = 0$. What is the honest error bar?
        choices:
          - text: >
              $0$, since the next term vanishes.
            feedback: >
              The exact value is $0.995004$, so $1$ is off by $0.005$, not
              $0$. A zero coefficient means you skip to the next term, not
              that the error vanished.
          - text: >
              $0.005$, the first nonzero dropped term $x^{2}/2$.
            correct: true
            feedback: >
              $0.1^{2}/2 = 0.005$, against a true miss of $0.004996$, and
              negative, so $1$ is high. The bar is the first term that is
              actually there.
          - text: >
              $0.1$, the size of $x$ itself.
            feedback: >
              That would be the error bar if $\cos$ had a linear term, but
              its coefficient is zero. Sized this way the bar is twenty
              times too pessimistic.
        feedback: >
          The working rule, stated carefully: the error is about the first
          *nonzero* omitted term, provided the terms behind it shrink fast.
          Both parts matter, and both are a glance, not a calculation.

  - node: quant-mental.approximation.log-linearization
    hook: >
      Rates, growth factors and log-returns in an interview are always
      quoted as small percentages, and the two swaps here — $\ln(1+x)$ and
      $e^{x}$ near $x=0$ — are what let you move between "percent change"
      and "log change" without a calculator.
    explanation: >
      Both expansions are the same move as truncating a Taylor series,
      applied to two functions that are inverses of each other near $0$:
      $\ln(1+x) = x - x^{2}/2 + x^{3}/3 - \cdots$ alternates sign, while
      $e^{x} = 1 + x + x^{2}/2 + \cdots$ is all positive. That sign pattern
      is worth holding onto — it tells you which direction the linear guess
      is biased: the linear pass on $\ln(1+x)$ overshoots (its first dropped
      term is negative), while the linear pass on $e^{x}$ undershoots (its
      first dropped term is positive).

      Reach for $\ln(1+x)\approx x$ whenever a rate is quoted as a small
      percentage and you need it in log terms — log-returns, continuously
      compounded yields, small growth rates. Reach for $e^{x}\approx 1+x$
      going the other way, turning a log or continuously-compounded rate
      back into a plain percentage. Add the $x^{2}/2$ term whenever the
      linear guess needs another digit of accuracy, which is most of the
      time once $x$ exceeds a couple of percent.

      The two together also check each other: since $e^{\ln(1+x)} = 1+x$
      exactly, a computed pair should roughly undo one another, a free
      consistency check on scratch work.
    worked: >
      A continuously compounded rate of $4\%$: $e^{0.04}$. Linear guess
      $1+0.04=1.04$. Quadratic guess $1+0.04+0.0008=1.0408$. Exact value is
      $e^{0.04}=1.040811$, so the linear guess misses by $0.000811$ (a
      $0.078\%$ relative miss) while the quadratic guess misses by only
      $0.000011$.
    interview: >
      Expect this dressed up as "what's the log-return" or "approximate this
      continuously compounded rate" with a number under $10\%$, and a
      near-instant expected answer to three or four significant figures. A
      common follow-up is "which way are you off," testing the
      sign-of-remainder reasoning above.
    pitfalls: >
      Mixing up the sign of the quadratic term — it's $-x^{2}/2$ for
      $\ln(1+x)$ but $+x^{2}/2$ for $e^{x}$, and swapping them flips whether
      you over- or under-shoot. Using the linear-only pass once $x$ is much
      past $10\%$, where the quadratic term is no longer a rounding
      correction — reach for the rule of 72 or full compounding instead.
    recap: >
      $\ln(1+x)\approx x-x^{2}/2$ and $e^{x}\approx1+x+x^{2}/2$ move you
      between percentage and log-change, with known and opposite-signed
      error.
    dialogue:
      - part: A log-return with no calculator
        teach: >
          A stock closes at $50$ and opens the next day at $54$, a plain
          return of $8\%$. The risk system stores log-returns, so it wants
          $\ln(54/50) = \ln(1.08)$, and the interviewer wants it to three
          decimals, now.
      - ask: >
          Come at it from the side you can compute. Keep three terms of the
          exponential series, $e^{y} \approx 1 + y + y^{2}/2$. What is
          $e^{0.08}$?
        expects: "1.0832"
        tolerance: 0.00005
        hint: >
          The new piece is $0.08^{2}/2$.
        feedback: >
          $0.08^{2}/2 = 0.0064/2 = 0.0032$, so $e^{0.08} \approx 1 + 0.08 +
          0.0032 = 1.0832$. The exact value is $1.083287$.
      - ask: >
          So $e^{0.08}$ is about $1.0832$, a little more than $1.08$. What
          does that say about $\ln(1.08)$?
        choices:
          - text: >
              It is $0.08$; a gap of $0.0032$ is negligible.
            feedback: >
              $0.0032$ is $4\%$ of the $0.08$ move, and the answer is wanted
              to three decimals. At that precision the gap is the whole
              question.
          - text: >
              It is a little more than $0.08$.
            feedback: >
              $e^{y}$ is increasing, and $y = 0.08$ already overshoots the
              target $1.08$. To land lower you need a smaller exponent, not
              a larger one.
          - text: >
              It is a little less than $0.08$.
            correct: true
            feedback: >
              $e^{0.08}$ overshoots $1.08$, so the exponent that lands exactly
              on $1.08$ is smaller. The linear guess $\ln(1.08) \approx 0.08$
              is too high.
        feedback: >
          The plain guess "log-return equals return" overshoots, and it does
          so because $e^{y}$ grows faster than $1 + y$.
      - reflect: >
          How much less than $0.08$? At $y = 0.08$ you overshot $1.08$ by
          $0.0032$, and near $y = 0$ the exponential changes at a rate of
          about $1$ per unit of $y$. Turn that into a correction, and then
          into a general rule for $\ln(1+x)$.
        hint: >
          Where did the $0.0032$ come from, in terms of $x = 0.08$?
        answer: >
          Lower $y$ by about the overshoot: $\ln(1.08) \approx 0.08 - 0.0032
          = 0.0768$. The overshoot was exactly the quadratic term $x^{2}/2$
          of the exponential, so in general $\ln(1+x) \approx x - x^{2}/2$.
          The two functions undo each other, which is why their quadratic
          terms carry opposite signs: whatever $e^{x}$ adds above $1 + x$,
          $\ln(1+x)$ must take back below $x$.
      - teach: >
          Those are the two small-$x$ expansions, both Taylor truncations:
          $\ln(1+x) \approx x - x^{2}/2$ and $e^{x} \approx 1 + x + x^{2}/2$,
          or just $x$ and $1 + x$ for a cruder linear pass. Their full series
          are $x - x^{2}/2 + x^{3}/3 - \dots$, which alternates, and
          $1 + x + x^{2}/2 + x^{3}/6 + \dots$, which does not. So for
          $x > 0$ the linear pass on the log runs high and the linear pass on
          the exponential runs low, and each error bar is the first term you
          left out.
      - part: Each pass, with its price
        ask: >
          The quadratic pass gave $\ln(1.08) \approx 0.0768$. What is its
          error bar, the first term it dropped?
        expects: "0.000171"
        tolerance: 0.000005
        hint: >
          The next term of $\ln(1+x)$ is $+x^{3}/3$.
        feedback: >
          $0.08^{3}/3 = 0.000512/3 = 0.000171$, positive, so $0.0768$ is low.
          The exact value is $0.076961$, a true miss of $0.000161$; the rest
          is the next term, $-x^{4}/4 \approx -0.00001$.
      - ask: >
          The linear pass $\ln(1+x) \approx x$ misses by about $x^{2}/2$,
          which is a relative miss of about $x/2$. At what rate $x$, as a
          decimal, does the linear pass miss by $1\%$ of the answer?
        expects: "0.02"
        hint: >
          Set $x/2$ equal to $0.01$.
        feedback: >
          $x/2 = 0.01$ gives $x = 0.02$. Check: $\ln(1.02) = 0.019803$, and
          $0.02$ overshoots it by $0.000197$, which is $1.0\%$. Below about
          $2\%$ the linear pass is fine for a quick answer; at $8\%$ it was
          already off by $4\%$, which is why the quadratic term earns its
          place.
      - part: Back from logs to percent
        ask: >
          A deposit earns $9\%$ continuously compounded for a year, so it
          grows by the factor $e^{0.09}$. Using the quadratic pass, what is
          the effective annual return as a decimal?
        expects: "0.09405"
        tolerance: 0.00001
        hint: >
          Compute $1 + 0.09 + 0.09^{2}/2$, then subtract the $1$.
        feedback: >
          $0.09^{2}/2 = 0.0081/2 = 0.00405$, so $e^{0.09} \approx 1.09405$
          and the effective return is $0.09405$, or $9.405\%$. The exact
          value is $9.4174\%$.
      - ask: >
          Is that $9.405\%$ high or low, and by roughly how much?
        choices:
          - text: >
              High, by about $0.012$ percentage points: the next term
              alternates in sign.
            feedback: >
              That is the logarithm's pattern carried over to the wrong
              function. Every term of $e^{x}$ at positive $x$ is positive, so
              nothing dropped can pull the estimate down.
          - text: >
              Low, by about $0.012$ percentage points: the dropped
              $x^{3}/6$ is positive.
            correct: true
            feedback: >
              $0.09^{3}/6 = 0.000729/6 = 0.000122$, which is $0.012$
              percentage points, and the true miss is $9.4174\% - 9.405\% =
              0.0124$ points.
          - text: >
              Low, by about $0.4$ percentage points: the gap between $9\%$
              and $9.405\%$.
            feedback: >
              The $0.405$ points are the quadratic term you already added; it
              is in the estimate. What is missing is the term after it,
              thirty times smaller.
        feedback: >
          Know which series you are truncating: the exponential's terms all
          share a sign at positive $x$, the logarithm's alternate. Mixing them
          up flips the direction of the error you announce.
      - part: Losses, and where the expansions run out
        ask: >
          The stock instead falls $10\%$. Using $x - x^{2}/2$ with
          $x = -0.1$, what is the log-return?
        expects: "-0.105"
        tolerance: 0.0001
        hint: >
          $x^{2}$ is positive whatever the sign of $x$, so $-x^{2}/2$ is
          negative.
        feedback: >
          $-0.1 - 0.01/2 = -0.105$. The exact value is $\ln(0.9) = -0.10536$.
          A loss's log-return is bigger in size than the plain return, a gain's
          is smaller — the same $-x^{2}/2$ in both cases.
      - ask: >
          A stock falls $40\%$. The quadratic pass gives $\ln(0.6) \approx
          -0.4 - 0.08 = -0.48$, but the exact value is $-0.511$. What is the
          honest diagnosis?
        choices:
          - text: >
              The sign of the quadratic term should flip for a loss.
            feedback: >
              Flipping it gives $-0.32$, much further from $-0.511$. The
              $-x^{2}/2$ is right; it is the terms after it that matter now.
          - text: >
              At $x = -0.4$ the dropped terms are not small: $x^{3}/3$ alone
              is $-0.021$, and the rest add another $0.01$.
            correct: true
            feedback: >
              With $x$ negative every term of $\ln(1+x)$ is negative, and each
              is only about $0.4$ times the last, so the tail
              $0.0213 + 0.0064 + 0.0020 + \dots$ sums to $0.031$. A $40\%$
              move is not small.
          - text: >
              The expansion only works for gains, not losses.
            feedback: >
              It worked well at $x = -0.1$, missing by $0.0004$. What breaks
              is the size of $x$, not its sign.
        feedback: >
          These expansions are for moves of a few percent. Past about $10$ to
          $15\%$, either keep more terms or stop claiming three decimals. In
          an interview, say it with its bar: "$\ln(1.08)$ is about $0.0768$,
          low by roughly $0.0002$."

  - node: quant-mental.approximation.binomial-approx
    hook: >
      The moment a question compounds the same rate $n$ times, the naive
      "just add up $n$ copies of the percentage" answer is exactly the
      mistake that compounding percent changes multiplicatively already
      warned against — this node turns that warning into an arithmetic tool
      with a known correction.
    explanation: >
      $(1+x)^{n}$ is $n$ identical percent changes chained together, so
      recall that chaining multiplies factors rather than adding
      percentages. Expanding by the binomial theorem,
      $(1+x)^{n} = \sum_{k} \binom{n}{k}x^{k}$, and the leading term $1+nx$
      is precisely the additive guess — a genuine first approximation, not
      the mistake itself, but only the first term of a longer sum.

      The next term, $\binom{n}{2}x^{2} = n(n-1)x^{2}/2$, is always positive
      when $x\ne0$ (it's a square), so it always pushes the true value
      above the linear guess regardless of whether $x$ is a gain or a loss.
      Add it once $nx$ itself is no longer tiny — as a rule of thumb, once
      $nx$ exceeds a few tenths, the linear-only pass is visibly short.

      Mental model: think of $nx$ as "how much drift accumulated" and
      $\binom{n}{2}x^{2}$ as "how much of that drift compounded on itself."
      The second effect is second-order in $x$ but first-order in $n^{2}$,
      which is why it becomes dominant once either $n$ or $x$ grows.
    worked: >
      $(1.03)^{6}$: linear guess $1+6(0.03)=1.18$. Correction
      $\binom{6}{2}(0.03)^{2}=15\times0.0009=0.0135$, giving $1.1935$. Exact
      value is $1.03^{6}=1.194052$ — the linear guess misses by $1.4\%$, the
      corrected guess by under $0.1\%$.
    interview: >
      Shows up as "compound $2\%$ eight times" or "what's your fund's
      5-year return at $6\%$ annually" — expect the linear guess in one
      breath and, if pushed for more precision, the correction term in the
      next.
    pitfalls: >
      Adding $nx$ when $nx$ is not small — for $n=50$, $x=0.02$, $nx=1$, and
      the linear guess ($2.00$) is nowhere near the true
      $(1.02)^{50}\approx2.69$; reach for the rule of 72 or full
      exponentiation instead. Forgetting the correction is always positive
      regardless of the sign of $x$, since it depends on $x^{2}$.
    recap: >
      $(1+x)^{n}\approx1+nx$, and add $\binom{n}{2}x^{2}$ — always a
      positive nudge upward — once $nx$ stops being tiny.
    dialogue:
      - part: Five years at six percent
        teach: >
          An account earns $6\%$ a year, compounded annually, for $5$ years.
          The person next to you says "five sixes, so up $30\%$" and moves on.
          You are asked whether to sign off on that number.
      - ask: >
          Is $30\%$ right, too high, or too low?
        choices:
          - text: >
              Right: five gains of $6\%$ add to $30\%$.
            feedback: >
              Percent changes compose by multiplying factors, not by adding.
              The second year's $6\%$ is earned on $1.06$, not on $1$, so it
              is worth more than $0.06$ of the original.
          - text: >
              Too high: each year's gain is taken off a smaller base.
            feedback: >
              The base grows, not shrinks: after one good year there is more
              money for the next $6\%$ to act on.
          - text: >
              Too low: later years earn $6\%$ on earlier gains too.
            correct: true
            feedback: >
              Interest on interest. The $30\%$ counts each year's $6\%$ of
              the starting amount and nothing else.
        feedback: >
          The additive answer misses every place where one year's gain
          compounds on another's. The question is how much that is worth.
      - ask: >
          Do just two years exactly. What is $(1.06)^{2}$?
        expects: "1.1236"
        hint: >
          $(1 + x)^{2} = 1 + 2x + x^{2}$.
        feedback: >
          $1 + 0.12 + 0.0036 = 1.1236$. The additive guess says $1.12$; the
          extra $0.0036 = 0.06^{2}$ is the second year's $6\%$ earned on the
          first year's $6\%$.
      - reflect: >
          Now five years. Write $(1.06)^{5}$ as five brackets
          $(1 + x)(1 + x)\cdots(1 + x)$ and expand by choosing $1$ or $x$ from
          each. Which choices produce the $30\%$, and which produce the
          biggest piece it misses? How many of those are there?
        hint: >
          Choosing $x$ from exactly one bracket gives the $30\%$. What does
          choosing it from exactly two give?
        answer: >
          Taking $x$ from exactly one bracket can be done $5$ ways, giving
          $5x = 0.30$ — the additive answer. Taking $x$ from exactly two
          brackets gives $x^{2}$ once for every *pair* of years, and there
          are $\binom{5}{2} = 10$ pairs, so $10x^{2} = 0.036$. Each pair is
          one year's gain compounding on another's; three-bracket choices
          give $x^{3}$ terms, much smaller again.
      - teach: >
          That is the technique. For $|x|$ small, $(1+x)^{n} \approx 1 + nx$,
          the first two terms of the binomial expansion, and the next
          correction is $\binom{n}{2}x^{2} = n(n-1)x^{2}/2$. It is the same
          truncation as any Taylor series, so the error bar on
          $1 + nx + \binom{n}{2}x^{2}$ is the next term, $\binom{n}{3}x^{3}$.
          Add the correction whenever $nx$ is not tiny.
      - part: The correction, priced
        ask: >
          Estimate $(1.06)^{5}$ as $1 + nx + \binom{n}{2}x^{2}$.
        expects: "1.336"
        tolerance: 0.0005
        hint: >
          You already have both pieces: $0.30$ and $0.036$.
        feedback: >
          $1 + 0.30 + 0.036 = 1.336$. The exact value is $1.338226$, so the
          correction took the miss from $0.038$ to $0.002$.
      - ask: >
          What is the error bar on that $1.336$, the first term dropped?
        expects: "0.00216"
        tolerance: 0.00002
        hint: >
          $\binom{5}{3} = 10$ and $0.06^{3} = 0.000216$.
        feedback: >
          $10 \times 0.000216 = 0.00216$, against a true miss of $0.00223$. It
          is positive, like every term here at positive $x$, so $1.336$ is
          low: "up about $33.6\%$, a touch more."
      - ask: >
          A different book loses $3\%$ a month for $8$ months, and the linear
          pass says it has lost $24\%$. Is the true loss more or less than
          $24\%$?
        choices:
          - text: >
              More: losses compound, so they pile up faster than the sum.
            feedback: >
              Each month's $3\%$ is taken from a smaller balance, so later
              losses are *smaller* in money terms. Compute it: $(0.97)^{8} =
              0.7837$, a loss of $21.6\%$.
          - text: >
              Less: the correction $\binom{8}{2}x^{2}$ is positive even
              though $x$ is negative.
            correct: true
            feedback: >
              $28 \times 0.0009 = 0.0252$, so $0.76 + 0.0252 = 0.7852$,
              against an exact $0.7837$. A loss of about $21.5\%$, not $24\%$.
          - text: >
              Exactly $24\%$: the correction cancels for losses.
            feedback: >
              The correction carries $x^{2}$, which is positive whatever the
              sign of $x$. Nothing cancels; it pushes the estimate up.
        feedback: >
          The quadratic correction always pushes up. For gains it adds to the
          additive answer; for losses it shrinks the additive loss.
      - part: When nx stops being small
        ask: >
          Back to $6\%$, but now for $20$ years. The linear pass gives
          $1 + 20(0.06) = 2.2$. How large is the correction
          $\binom{20}{2}x^{2}$?
        expects: "0.684"
        tolerance: 0.0005
        hint: >
          $\binom{20}{2} = 190$.
        feedback: >
          $190 \times 0.0036 = 0.684$, giving $2.884$. The exact value is
          $(1.06)^{20} = 3.207$, still $0.32$ away.
      - ask: >
          Why did the corrected estimate still miss by $10\%$?
        choices:
          - text: >
              The terms shrink slowly: the next one, $\binom{20}{3}x^{3}$, is
              $0.246$, and the ones after it are not small either.
            correct: true
            feedback: >
              $1140 \times 0.000216 = 0.246$. The ratio of one term to the
              last is about $(n - k)x/(k + 1)$, which here is $0.57$, then
              $0.36$: the series is converging, but slowly. With $nx = 1.2$
              there is no short truncation.
          - text: >
              A $6\%$ rate is too big for the expansion; it needs $x$ under
              about $1\%$.
            feedback: >
              $x = 0.06$ is small; it worked at $5$ years. Try $1\%$ for $120$
              months: $nx = 1.2$ again, and two terms give $1 + 1.2 + 0.714 =
              2.914$ against an exact $3.300$. The trouble is $nx$, not $x$.
          - text: >
              The binomial expansion only holds for $n$ under $10$.
            feedback: >
              The expansion is exact for every $n$. What fails is truncating
              it after two terms when the dropped terms are large.
        feedback: >
          The correction is about $nx/2$ times the linear term, so the size of
          $nx$ is the whole test. At $nx = 0.3$ two terms were plenty; at
          $nx = 1.2$ reach for a different tool.
      - ask: >
          Using that ratio, how small must $nx$ be for the quadratic
          correction to be at most $10\%$ of the linear term $nx$?
        expects: "0.2"
        hint: >
          Set $nx/2$ equal to $0.1$.
        feedback: >
          $nx/2 \le 0.1$ means $nx \le 0.2$. Below that the linear pass alone
          is within about a tenth of the growth; between $0.2$ and roughly
          $0.6$ add the correction; well beyond that, the binomial route is
          the wrong road.

  - node: quant-mental.approximation.sqrt-estimate
    hook: >
      Square roots of ugly numbers come up constantly as sub-steps in bigger
      mental-math problems, and linearizing at the nearest perfect square
      answers them in one line, with a known, predictable direction of
      error.
    explanation: >
      Write $\sqrt{a^{2}+b} = a\sqrt{1+b/a^{2}}$ and apply the small-$x$
      expansion $\sqrt{1+x}\approx1+x/2$ with $x=b/a^{2}$: that gives
      $a(1+b/(2a^{2})) = a+b/(2a)$, dropping the next term of that same
      series. It's the same truncation move as everywhere else in this
      unit, just applied to the square-root function instead of $\ln$ or
      $\exp$.

      Because $\sqrt{\cdot}$ is concave, its tangent line at any point lies
      above the curve, so the linear estimate is always a slight
      overestimate whenever $b\ne0$ — you don't need to check the sign of
      the next term each time, it's baked into concavity. The estimate is
      only as good as $b/a^{2}$ is small: choosing the nearest perfect
      square keeps $b$ small relative to $a^{2}$, which is the entire point
      of anchoring there rather than at some arbitrary value.

      This is also exactly one step of Newton's method for $\sqrt{N}$
      starting from guess $a$: $x_{1}=a-(a^{2}-N)/(2a)=a+b/(2a)$ when
      $N=a^{2}+b$. Knowing that connection means you can always take a
      second Newton step from $x_1$ if one linearization isn't precise
      enough.
    worked: >
      $\sqrt{50}=\sqrt{49+1}$, so $a=7$, $b=1$: estimate $7+1/14\approx
      7.0714$. Exact value is $\sqrt{50}=7.07107$, so the estimate is high
      by about $0.00036$ — matching the predicted $-b^{2}/(8a^{3})=
      -1/2744\approx-0.00036$.
    interview: >
      Asked as a bare "estimate $\sqrt{N}$" with no calculator, or buried
      inside a bigger problem such as a standard deviation. The fast tell of
      a strong answer is naming the nearest perfect square out loud before
      computing anything.
    pitfalls: >
      Picking an anchor $a$ that isn't actually close, so $b/a^{2}$ isn't
      small — $\sqrt{90}=\sqrt{81+9}$ gives $9+9/18=9.5$ against an exact
      $9.4868$, already off by over $1\%$ because $b/a^{2}=1/9$ isn't tiny.
      Forgetting the estimate is always high for $b>0$: if a problem needs a
      lower bound, round the estimate down, not up.
    recap: >
      Linearize at the nearest perfect square, $\sqrt{a^{2}+b}\approx
      a+b/(2a)$ — always a slight overestimate, and one Newton step if you
      need more.
    dialogue:
      - part: A standard deviation from a variance
        teach: >
          A risk report gives the variance of a desk's daily P&L as $83$, in
          millions squared. You need the standard deviation, $\sqrt{83}$, to
          three decimals for a note, and there is no calculator in the room.
      - ask: >
          $\sqrt{83}$ lies between $9$ and $10$, and $83$ is $2$ of the $19$
          steps from $81$ to $100$. Interpolate in a straight line between
          the two roots. What do you get?
        expects: "9.105"
        tolerance: 0.0005
        hint: >
          $9 + 2/19$.
        feedback: >
          $9 + 2/19 = 9.1053$. The exact value is $9.1104$, so the
          interpolation is low by about $0.005$ — wrong in the third decimal,
          the one you needed.
      - ask: >
          Why is straight-line interpolation low here?
        choices:
          - text: >
              It is not low; it is just rounded.
            feedback: >
              $2/19 = 0.10526$ was carried to four places. The shortfall of
              $0.005$ is in the method, not the rounding.
          - text: >
              The root curve is concave, so the chord from $81$ to $100$ lies
              under it; near $81$ the curve climbs faster than the chord.
            correct: true
            feedback: >
              The chord uses the average slope $1/19$ over the whole stretch.
              At $81$ the true slope of $\sqrt{N}$ is $1/(2 \cdot 9) = 1/18$,
              steeper, and you only need to go a short way.
          - text: >
              $83$ is closer to $81$ than to $100$, so you should have
              rounded down to $9$.
            feedback: >
              Rounding down to $9$ is worse, off by $0.11$. Being close to
              $81$ is the advantage to exploit, not a reason to give up the
              decimals.
        feedback: >
          The chord is the wrong straight line. You want the straight line
          that matches the curve where you know it best: at $81$.
      - reflect: >
          Step from the root you know. Write the answer as $9 + d$ with $d$
          small, square it, and set it equal to $83$. What is $d$, roughly,
          and what did you throw away to get it?
        hint: >
          $(9 + d)^{2} = 81 + 18d + d^{2}$.
        answer: >
          $81 + 18d + d^{2} = 83$. Drop the $d^{2}$, which is tiny when $d$ is
          about $0.1$, and $18d = 2$, so $d = 1/9$ and $\sqrt{83} \approx
          9.111$. In general $\sqrt{a^{2}+b} \approx a + b/(2a)$: the step
          is the excess $b$ divided by twice the anchor, and the price is the
          $d^{2}$ you ignored.
      - teach: >
          That is linearization at the nearest perfect square:
          $\sqrt{a^{2}+b} \approx a + b/(2a)$, the tangent line of $\sqrt{N}$
          at $N = a^{2}$, and also exactly one Newton step from the guess $a$.
          It is the Taylor truncation $\sqrt{1+u} \approx 1 + u/2$ with
          $u = b/a^{2}$, so the error is the next term, $-b^{2}/(8a^{3})$:
          small when $b/a^{2}$ is small, and negative, so the estimate runs
          high.
      - part: The estimate and its bar
        ask: >
          What does the linearization give for $\sqrt{83}$, to four decimals?
        expects: "9.1111"
        tolerance: 0.00006
        hint: >
          $a = 9$, $b = 2$.
        feedback: >
          $9 + 2/18 = 9.1111$. Against the exact $9.1104$ it is high by
          $0.0007$; the chord was low by $0.005$, seven times worse.
      - ask: >
          Before checking, what error bar should travel with $9.1111$? Give
          $b^{2}/(8a^{3})$.
        expects: "0.000686"
        tolerance: 0.00001
        hint: >
          $8a^{3} = 8 \times 729 = 5832$.
        feedback: >
          $4/5832 = 0.000686$. The true overshoot is $9.111111 - 9.110434 =
          0.000677$. "About $9.111$, high by under a thousandth" is the
          sentence to say.
      - ask: >
          Now $\sqrt{78} = \sqrt{81 - 3} \approx 9 - 3/18 = 8.8333$. With $b$
          negative, which way is this estimate off?
        choices:
          - text: >
              Low: subtracting overshoots downward.
            feedback: >
              The exact value is $8.8318$, below the estimate. The error term
              $-b^{2}/(8a^{3})$ contains $b^{2}$, so its sign does not care
              whether you stepped up or down.
          - text: >
              High, as for positive $b$: a tangent line sits above a concave
              curve on both sides of the point of contact.
            correct: true
            feedback: >
              $8.8333 - 8.8318 = 0.0015$, matching $9/5832 = 0.0015$. Concavity
              of $\sqrt{N}$ fixes the direction once and for all.
          - text: >
              It could be either; you would need the exact value.
            feedback: >
              The sign is known before you compute anything: the tangent line
              of a concave function never dips below it.
        feedback: >
          Linearizing a square root always overestimates, whichever side of
          the anchor you are on. If you need a lower bound, shade down.
      - part: Choosing the anchor
        ask: >
          A colleague linearizes $\sqrt{83}$ at $100$ instead, with $a = 10$,
          $b = -17$. What do they get?
        expects: "9.15"
        tolerance: 0.0005
        hint: >
          $10 + (-17)/20$.
        feedback: >
          $10 - 0.85 = 9.15$, high by $0.04$ — sixty times the miss from
          anchoring at $81$.
      - ask: >
          What made the anchor at $100$ so much worse?
        choices:
          - text: >
              Anchoring above the number is always worse than anchoring below.
            feedback: >
              Direction is irrelevant; $\sqrt{78}$ anchored at $81$, above,
              and missed by only $0.0015$. Distance is what matters.
          - text: >
              $b/a^{2}$ is $0.17$ instead of $0.025$, and the error grows like
              $b^{2}$.
            correct: true
            feedback: >
              The bar $b^{2}/(8a^{3})$ is $289/8000 = 0.036$ at $100$ against
              $0.0007$ at $81$. Seven times the relative distance, about fifty times
              the error.
          - text: >
              Negative $b$ makes the linearization unstable.
            feedback: >
              $\sqrt{78}$ had negative $b$ and was fine. The trouble is that
              $17$ is not small next to $100$.
        feedback: >
          Name the nearest perfect square first; the formula only earns its
          accuracy when $b$ is a small fraction of $a^{2}$.
      - part: One more step when you need it
        ask: >
          Take one more Newton step from $x_{1} = 9 + 1/9$:
          $x_{2} = x_{1} - (x_{1}^{2} - 83)/(2x_{1})$. What is $x_{2}$ to
          five decimals?
        expects: "9.11043"
        tolerance: 0.000006
        hint: >
          $x_{1}^{2} = 81 + 2 + 1/81$, so $x_{1}^{2} - 83 = 1/81 \approx
          0.012346$. Divide by $2x_{1} \approx 18.222$.
        feedback: >
          $0.012346/18.222 = 0.000678$, so $x_{2} = 9.111111 - 0.000678 =
          9.110433$, against the exact $9.110434$. The overshoot of the first
          step's square was exactly the $d^{2}$ you dropped, and the second
          step removes it.
      - teach: >
          Said aloud: "Nearest square is $81$, so $9$ plus $2$ over $18$, about
          $9.111$, a touch high — the error is under a thousandth." The anchor,
          the step, and the direction, in one breath.

  - node: quant-mental.approximation.rule-72
    hook: >
      Doubling-time questions are the fastest mental-math check on a growth
      or interest-rate number, and knowing why 72 beats the theoretically
      "correct" 69.3 is worth as much as knowing the rule itself.
    explanation: >
      Doubling means $(1+r)^{t}=2$, i.e. $t\ln(1+r)=\ln2$. Swap $\ln(1+r)$
      for its linear approximation $r$ and solve: $t\approx\ln2/r
      \approx0.693/r$. That's the "rule of 69.3," the theoretically cleaner
      constant — but $69.3$ has no convenient small divisors, while $72$
      splits evenly by $2,3,4,6,8,9,12,18,24$, which is what makes the
      division actually fast in your head.

      The extra $2.7$ isn't just a rounding convenience: the linear swap for
      $\ln(1+r)$ overshoots the true value of $r$ from below in the wrong
      direction for this purpose — its first dropped term is $-r^{2}/2$, so
      $\ln(1+r)$ is a bit smaller than $r$, meaning the true doubling time is
      a bit shorter than $0.693/r$ predicts. Nudging the constant up to $72$
      partly cancels that shortfall, which is why $72/r$ tracks the exact
      value more closely than $69.3/r$ across the ordinary range of interest
      rates, roughly $6\%$ to $10\%$, and is nearly exact right around $8\%$.

      Outside that band the cancellation stops helping — at very low or very
      high $r$, go back to $69.3/r$ or full compounding instead.
    worked: >
      At $r=6\%$: rule of 72 gives $72/6=12$ years. Exact is
      $\ln2/\ln(1.06)=0.6931/0.05827=11.90$ years, so $72/6$ is high by
      about $0.87\%$. The theoretically cleaner $69.3/6=11.55$ years is low
      by about $2.9\%$ — worse, despite being the "exact" linear formula.
    interview: >
      Classic phrasing: "an investment grows $6\%$ a year, how long to
      double" or "at what rate does GDP double in a decade" — expect an
      instant division, no scratch work, and readiness to say which
      direction the estimate is biased if asked.
    pitfalls: >
      Using $r$ as a decimal instead of a percent — the rule is $72/r$ with
      $r$ in percent (e.g. $72/6$), not $72/0.06$. Applying it well outside
      $6$–$10\%$ without a caveat: at $r=20\%$, $72/20=3.6$ years against an
      exact $3.80$ years, a $5.6\%$ miss, well past "good enough."
    recap: >
      Doubling time is about $72/r$ years — a rule tuned for fast division
      and error cancellation, not just $\ln2/r$ rounded.
    dialogue:
      - part: Doubling at nine percent
        teach: >
          A client's bond fund compounds at $9\%$ a year, and she asks how many
          years until her money doubles. Doubling means $(1.09)^{t} = 2$, so
          $t = \ln 2/\ln(1.09)$. You have $\ln 2 \approx 0.6931$ cold and no
          calculator for the rest.
      - ask: >
          Use the linear pass $\ln(1.09) \approx 0.09$. What doubling time do
          you get, in years?
        expects: "7.70"
        tolerance: 0.01
        hint: >
          Divide $0.6931$ by $0.09$.
        feedback: >
          $0.6931/0.09 = 7.70$ years. The exact answer is
          $0.6931/0.08618 = 8.04$ years, so the quick answer is short by a
          third of a year.
      - ask: >
          Why does $7.70$ come out short of the true $8.04$?
        choices:
          - text: >
              $\ln(1.09)$ is less than $0.09$, so dividing by $0.09$ divides
              by too much.
            correct: true
            feedback: >
              The linear pass on the log runs high: $\ln(1.09) \approx 0.09 -
              0.09^{2}/2 = 0.08595$. A denominator that is $4.5\%$ too big
              makes the time about $4.5\%$ too small.
          - text: >
              Rounding $\ln 2$ to $0.6931$ lost the difference.
            feedback: >
              $\ln 2 = 0.693147$, so the rounding moved the answer by under
              $0.001$ years. The $0.34$-year gap comes from the denominator.
          - text: >
              Compounding makes money double faster than the formula
              assumes.
            feedback: >
              $t = \ln 2/\ln(1.09)$ already is the compound answer, exactly.
              And the true time is *longer* than $7.70$, not shorter, so this
              explanation points the wrong way.
        feedback: >
          The shortcut $0.693/r$ is biased, and you know its direction
          before computing anything: low, because $\ln(1+r) < r$.
      - reflect: >
          You want a rule of the form "a constant divided by $r$", with $r$ in
          percent, that is good across the usual $6$ to $10\%$. Starting from
          $69.3/r$, how should the constant change, and by roughly how much at
          $r = 8\%$?
        hint: >
          Write $\ln(1+r) \approx r(1 - r/2)$ and move the bracket to the
          top.
        answer: >
          Since $\ln(1+r) \approx r(1 - r/2)$, the doubling time is about
          $(0.693/r)(1 + r/2)$: the constant should be raised by the factor
          $1 + r/2$. At $8\%$ that is $69.3 \times 1.04 = 72.1$. So keep the
          one-division shape and bump the numerator from $69.3$ to about
          $72$, which happens to be a number that divides easily.
      - teach: >
          That is the rule of 72: a quantity compounding at $r\%$ per period
          doubles in about $72/r$ periods. The pure linear version is
          $\ln 2/r \approx 69.3/r$, and its error is the first dropped term of
          $\ln(1+r)$. The extra $2.7$ in the numerator cancels most of that
          term across $6$ to $10\%$, and $72 = 8 \times 9 = 6 \times 12 = 4
          \times 18$ makes the division instant.
      - part: Why the numerator is 72
        ask: >
          The corrected numerator is $69.3(1 + r/200)$ with $r$ in percent. At
          what rate, in percent, does it equal exactly $72$?
        expects: "7.8"
        tolerance: 0.1
        hint: >
          Solve $1 + r/200 = 72/69.3 \approx 1.039$.
        feedback: >
          $r/200 = 0.039$, so $r \approx 7.8$. Near $8\%$ the rule of 72 is
          essentially exact; away from $8\%$ the ideal numerator drifts, about
          $0.35$ for every point of rate.
      - ask: >
          Why carry $72$ rather than the more accurate $72.1$, or $70$?
        choices:
          - text: >
              $72$ is exactly $100 \ln 2$.
            feedback: >
              $100 \ln 2 = 69.3$; that is the constant being replaced. $72$
              is a deliberate nudge, not the value of anything.
          - text: >
              $72$ gives the exact doubling time at every rate.
            feedback: >
              It is exact only near $7.8\%$, as you just found. The ideal
              numerator moves with $r$.
          - text: >
              $72$ divides by $2, 3, 4, 6, 8, 9, 12$ and $18$, and sits within
              $0.1$ of the ideal numerator at $8\%$.
            correct: true
            feedback: >
              Accuracy and speed agree here, which is why this number won.
              $72.1/r$ is no better in practice and much slower in your head.
        feedback: >
          The rule is a calibrated constant: the second-order correction folded
          into a number chosen for mental division.
      - part: Two quick doublings
        ask: >
          Back to the client at $9\%$. What does the rule of 72 give?
        expects: "8"
        hint: >
          $72 = 8 \times 9$.
        feedback: >
          $72/9 = 8$ years against the exact $8.04$, a miss of $0.5\%$. The
          shortcut $69.3/9 = 7.70$ missed by $4.2\%$.
      - ask: >
          Prices rise $4\%$ a year. By the rule of 72, in how many years does
          a basket of goods cost twice as much?
        expects: "18"
        hint: >
          $72 = 4 \times 18$.
        feedback: >
          $72/4 = 18$ years, against the exact $\ln 2/\ln(1.04) = 17.67$. At
          $4\%$, below the band where the rule is tuned, it runs about $2\%$
          long: the ideal numerator there is $69.3 \times 1.02 = 70.7$.
      - part: Past the comfortable band
        ask: >
          A credit card balance compounds at $24\%$ a year. The rule of 72
          says it doubles in $3$ years; the exact figure is $3.22$. Why does
          the rule run short?
        choices:
          - text: >
              At $24\%$ the logarithm cannot be expanded at all.
            feedback: >
              $\ln(1.24)$ still has a perfectly good series; it just needs the
              $r/2$ correction taken seriously. The corrected numerator fixes
              almost all of the miss.
          - text: >
              The rule assumes simple interest, and the card compounds.
            feedback: >
              The rule came straight from $(1+r)^{t} = 2$, which is
              compounding. Simple interest at $24\%$ would take $1/0.24 =
              4.2$ years, which is no help here.
          - text: >
              The ideal numerator is $69.3(1 + 0.12) = 77.6$, and $72$ is
              well short of it.
            correct: true
            feedback: >
              The bump $1 + r/2$ grows with the rate. At $24\%$ it calls for
              $77.6$, so a fixed $72$ undershoots by about $7\%$.
          - text: >
              $r$ should be entered as $0.24$, not $24$.
            feedback: >
              $72/0.24 = 300$ years. The rule takes $r$ in percent; the
              units were right.
        feedback: >
          The rule of 72 is tuned for $6$ to $10\%$. Outside that band, the
          numerator that works is $69.3(1 + r/200)$.
      - ask: >
          Use that corrected numerator: what is $77.6/24$, in years?
        expects: "3.23"
        tolerance: 0.01
        hint: >
          $77.6/24 = 3 + 5.6/24$.
        feedback: >
          $3 + 0.233 = 3.23$ years, against the exact $3.22$: within $0.4\%$,
          where $72/24$ was off by $7\%$.
      - teach: >
          Said aloud: "Seventy-two over nine, about eight years; the rule is
          tuned for rates near eight percent, so that is within half a
          percent." At a rate far from $8\%$, say which way you are off before
          anyone asks.

  - node: quant-mental.approximation.anchors
    hook: >
      A short table of logs, roots and $e$ is what turns most of the rest of
      this unit from "reach for a calculator" into "one multiplication,"
      because nearly every other constant you'll need is a cheap combination
      of these.
    explanation: >
      Hold $\ln2\approx0.6931$, $\ln10\approx2.3026$, $\log_{10}2\approx
      0.3010$, $e\approx2.71828$, $\sqrt2\approx1.41421$, $\sqrt3\approx
      1.73205$, $\sqrt5\approx2.23607$, and $\pi^{2}\approx9.8696$ to four or
      five significant figures — not three, because a three-figure constant
      loses a digit the moment you multiply or divide two of them together,
      and an interviewer checks the digit.

      The payoff is combination, not just recall: because $10=2\times5$,
      $\log_{10}5=1-\log_{10}2$; because $6=2\times3$,
      $\sqrt6=\sqrt2\sqrt3$; because $\ln10=1/\log_{10}e$, you get
      $\log_{10}e$ for free from $\ln10$. None of these need re-deriving
      from a series — they're one arithmetic step away from the table.

      Treat the table as a small, closed set you extend by multiplying,
      dividing, and taking ratios, never by memorizing more entries. If a
      constant isn't a short combination of these eight, it's not worth
      holding in memory — derive it on the spot with the small-$x$ or
      square-root techniques instead.
    worked: >
      $\log_{10}5$ isn't on the table, but $10=2\times5$ gives
      $\log_{10}2+\log_{10}5=\log_{10}10=1$, so
      $\log_{10}5=1-0.30103=0.69897$ — no new memorization, one subtraction.
    interview: >
      Expect these fired at you cold — "what's $\ln2$," "what's $\sqrt3$" —
      with an answer expected in under a second, plus the occasional "now
      get me $\log_{10}8$" that rewards knowing $8=2^{3}$ rather than
      pausing to think.
    pitfalls: >
      Memorizing to only two or three significant figures, which silently
      degrades every downstream product or quotient. Confusing $\ln$ and
      $\log_{10}$ — $\ln2\approx0.693$ is not $\log_{10}2\approx0.301$, and
      mixing them mid-calculation is a common, hard-to-catch slip.
    recap: >
      Hold eight constants to four-plus figures and build everything else by
      multiplying, dividing, or subtracting them.
    dialogue:
      - part: Four decimals of ln 5
        teach: >
          An interviewer asks for $\ln 5$ to four decimals, cold. You know the
          series $\ln(1+x) = x - x^{2}/2 + x^{3}/3 - \dots$, and $5 = 1 + 4$.
      - ask: >
          What happens if you put $x = 4$ into that series?
        choices:
          - text: >
              It converges, but slowly: you need about ten terms.
            feedback: >
              The terms are $4^{n}/n$: $4$, $8$, $21.3$, $64$, growing without
              bound. The series only converges for $-1 < x \le 1$, so no
              number of terms will do.
          - text: >
              It diverges: the terms $4^{n}/n$ grow, so the sum never settles.
            correct: true
            feedback: >
              The series lives on $-1 < x \le 1$. You could write $\ln 5 =
              -\ln(1 - 0.8)$ and stay inside, but the terms $0.8^{n}/n$ shrink
              so slowly that four decimals takes about $30$ of them.
          - text: >
              Two terms are enough: $4 - 8 = -4$.
            feedback: >
              A negative logarithm for a number bigger than $1$ should stop you
              at once. Truncating only makes sense when each term is much
              smaller than the last, and here each is bigger.
        feedback: >
          Deriving $\ln 5$ from a series is either impossible or a page of
          arithmetic. Neither fits in an interview answer.
      - reflect: >
          You cannot sum your way to $\ln 5$ quickly. What could you already
          know that would put it one step away — and how few such facts would
          you need for most of the logs you will be asked?
        hint: >
          $5$ is a ratio of two numbers whose logs are worth knowing anyway.
        answer: >
          $5 = 10/2$, so $\ln 5 = \ln 10 - \ln 2$. Logs turn products and
          ratios into sums and differences, so a handful of logs of small
          building blocks — $2$, $10$ — reach every number built from them.
          The same holds for roots: $\sqrt{ab} = \sqrt{a}\sqrt{b}$. A short
          memorized table plus one arithmetic step replaces a derivation.
      - teach: >
          That is the anchor table: $\ln 2 \approx 0.6931$, $\ln 10 \approx
          2.3026$, $\log_{10}2 \approx 0.3010$, $e \approx 2.71828$, $\sqrt{2}
          \approx 1.41421$, $\sqrt{3} \approx 1.73205$, $\sqrt{5} \approx
          2.23607$, $\pi^{2} \approx 9.8696$, each to four or five
          significant figures. Extend it by multiplying, dividing and
          subtracting — never by memorizing a ninth entry.
      - part: Building from the table
        ask: >
          Now answer the interviewer: what is $\ln 5$, from the table?
        expects: "1.6095"
        tolerance: 0.0002
        hint: >
          $\ln 5 = \ln 10 - \ln 2$.
        feedback: >
          $2.3026 - 0.6931 = 1.6095$, against the exact $1.60944$. One
          subtraction, four decimals.
      - ask: >
          A position's risk is quoted per $\sqrt{10}$ days. What is
          $\sqrt{10}$ to four decimals?
        expects: "3.1623"
        tolerance: 0.0001
        hint: >
          $10 = 2 \times 5$, and both roots are on the table.
        feedback: >
          $\sqrt{2}\sqrt{5} = 1.41421 \times 2.23607 = 3.16227$, against the
          exact $3.162278$. Five-figure anchors give a product good to five
          figures.
      - part: How many figures to hold
        ask: >
          Is $e^{23}$ above or below $10^{10}$? The question is whether
          $\log_{10}(e^{23}) = 23/\ln 10$ is above or below $10$. What is
          $23/2.3026$?
        expects: "9.989"
        tolerance: 0.002
        hint: >
          $2.3026 \times 10 = 23.026$, a little more than $23$.
        feedback: >
          $23/2.3026 = 9.9887$, so $e^{23} = 10^{9.9887}$, just under
          $10^{10}$. Exactly, $e^{23} = 9.745 \times 10^{9}$.
      - ask: >
          A colleague who holds $\ln 10$ as $2.3$ gets $23/2.3 = 10.0$. What
          should he conclude?
        choices:
          - text: >
              That $e^{23}$ is exactly $10^{10}$.
            feedback: >
              $e^{23}$ is irrational and $10^{10}$ is an integer, so they
              cannot be equal. The $10.0$ is an artifact of the rounded
              constant.
          - text: >
              Nothing: his constant is off by $0.0026$, which moves the answer
              by $0.011$, more than the gap he is trying to read.
            correct: true
            feedback: >
              The question turned on the third decimal of $23/\ln 10$, and a
              two-figure constant cannot deliver it. That is why the table is
              held to four or five figures.
          - text: >
              That $e^{23}$ is above $10^{10}$, since he rounded $\ln 10$
              down.
            feedback: >
              Rounding the divisor down pushes the quotient *up*, so his
              $10.0$ overstates the true $9.989$. If anything, the rounding
              argues for below.
        feedback: >
          A constant's rounding error is multiplied by everything it touches.
          Two figures are fine for a gut check and fail the moment a question
          sits near a boundary.
      - ask: >
          Mid-calculation you need $\log_{10}2$ and write $0.693$. What have
          you done?
        choices:
          - text: >
              Used $\ln 2$ in place of $\log_{10}2$: the answer is off by the
              factor $\ln 10 = 2.3$.
            correct: true
            feedback: >
              $\log_{10}2 = \ln 2/\ln 10 = 0.6931/2.3026 = 0.3010$. The two
              differ by the factor $2.3026$, which is no rounding error.
          - text: >
              Nothing serious: $0.693$ and $0.301$ are both logs of $2$.
            feedback: >
              They are logs of $2$ in different bases, and one is $2.3$ times
              the other. Any digit count or power of ten built on the wrong
              one is off by more than a factor of two in the exponent.
          - text: >
              Used $\log_{10}e$ by mistake.
            feedback: >
              $\log_{10}e = 1/\ln 10 = 0.4343$. The number $0.693$ is $\ln 2$,
              the natural log; the slip is between bases, not between
              constants.
        feedback: >
          Three anchors near each other in memory — $0.6931$, $0.3010$,
          $2.3026$ — are three different numbers. Say the base aloud as you
          use one.
      - part: A number the table does not hold
        ask: >
          $7$ is not on the table, but $49 = 50 \times 0.98$. Using
          $\ln 50 = \ln 100 - \ln 2$ and $\ln(0.98) \approx -0.0202$, what is
          $\ln 7 = \tfrac{1}{2}\ln 49$?
        expects: "1.9459"
        tolerance: 0.0003
        hint: >
          $\ln 100 = 2 \ln 10 = 4.6052$.
        feedback: >
          $\ln 50 = 4.6052 - 0.6931 = 3.9121$, so $\ln 49 = 3.9121 - 0.0202 =
          3.8919$ and $\ln 7 = 1.94595$, against the exact $1.94591$. The
          table carried the weight; a tiny correction did the rest.
      - teach: >
          Said aloud: "$\ln 5$ is $\ln 10$ minus $\ln 2$, so $2.3026$ minus
          $0.6931$, about $1.609$." Naming the combination before the number
          tells the listener the digits are earned, not remembered.

  - node: quant-mental.approximation.powers-of-two
    hook: >
      Sizing a hash space, a memory footprint, or "how many possible n-bit
      strings" questions all reduce to converting a bit count into a power
      of ten, and $2^{10}\approx10^{3}$ does that conversion almost for
      free.
    explanation: >
      Since $\log_{10}2\approx0.301$, $2^{n}=10^{n\log_{10}2}\approx
      10^{0.301n}$ for any $n$. The anchor worth holding directly is
      $2^{10}=1024\approx10^{3}$, which is high by a factor of $1.024$ — a
      known, fixed $2.4\%$.

      That $2.4\%$ compounds by block of ten bits, not by simple addition:
      $2^{20}=(2^{10})^{2}\approx10^{6}\times1.024^{2}$,
      $2^{30}\approx10^{9}\times1.024^{3}$, and so on — each extra block
      multiplies in another factor of $1.024$, the same
      compounding-not-adding discipline as everywhere else in mental math.
      For a quick gut check, treat "number of ten-bit blocks" as roughly how
      many $2.4\%$'s to stack.

      This is the fast route to any "how many possible states" question
      phrased in bits: count the bits, divide by ten to get blocks, apply
      the compounding correction if precision matters, and read off the
      power of ten.
    worked: >
      $2^{40}=(2^{10})^{4}=1024^{4}=(1.024\times10^{3})^{4}\approx
      10^{12}\times1.024^{4}$. Since $1.024^{2}=1.048576$,
      $1.024^{4}=1.048576^{2}\approx1.09951$, so
      $2^{40}\approx1.09951\times10^{12}$. The exact value is
      $1{,}099{,}511{,}627{,}776\approx1.099512\times10^{12}$ — matching to
      six significant figures.
    interview: >
      Comes up as "roughly how many distinct 32-bit values are there" or
      "how big is $2^{64}$ in bytes" (the classic int64-range check) —
      expect scientific notation to three or four figures within a couple of
      seconds, not an exact integer.
    pitfalls: >
      Forgetting the direction of the bias: $1024>1000$, so raw powers of
      ten without the $1.024$ correction undercount the true value, and
      skipping the correction across many blocks compounds the miss
      multiplicatively, not by a flat $2.4\%$ total. Rounding $\log_{10}2$
      to $0.3$ instead of $0.301$ — over $n=100$ bits that shortcut alone
      shifts the exponent by a full $0.1$, a real error in the leading
      digit.
    recap: >
      $2^{10}\approx10^{3}$, high by a known $2.4\%$ per ten-bit block —
      count bits, divide by ten, read off the power of ten.
    dialogue:
      - part: How big is 2 to the 36
        teach: >
          A scenario engine tags every simulated path with a $36$-bit ID. The
          head of risk asks how many distinct IDs that allows, as a number
          times a power of ten, while you are still at the whiteboard. You
          know $2^{10} = 1024$.
      - ask: >
          Write $2^{36} = (2^{10})^{3} \times 2^{6}$ and treat each $2^{10}$ as
          $1000$. What is $2^{36}$ in units of $10^{10}$?
        expects: "6.4"
        tolerance: 0.01
        hint: >
          $(10^{3})^{3} = 10^{9}$, and $2^{6} = 64$.
        feedback: >
          $10^{9} \times 64 = 6.4 \times 10^{10}$. The exact value is
          $68{,}719{,}476{,}736$, or $6.87 \times 10^{10}$.
      - ask: >
          The quick answer is about $7\%$ low. Where did the $7\%$ go?
        choices:
          - text: >
              $1024$ is $2.4\%$ more than $1000$, so the answer needs one
              factor of $1.024$: $6.4 \times 1.024 = 6.55$.
            feedback: >
              That still leaves you $5\%$ short. The excess is not paid once;
              it is paid by each $2^{10}$ you replaced, and you replaced
              three.
          - text: >
              Each of the three $2^{10}$s dropped a factor of $1.024$, and
              $1.024^{3}$ is about $1.074$.
            correct: true
            feedback: >
              Three blocks, three factors of $1.024$, multiplied rather than
              added: $1.024^{3} = 1.0737$, which is exactly the $7\%$
              missing.
          - text: >
              $2^{6}$ was rounded; it should be closer to $69$.
            feedback: >
              $2^{6} = 64$ exactly. Nothing was rounded except the three
              $2^{10}$s.
        feedback: >
          The anchor $2^{10} \approx 10^{3}$ is high by a known, fixed
          $2.4\%$, and that bias stacks once per block of ten bits.
      - reflect: >
          You know exactly what the quick answer threw away. How would you
          put it back without redoing the whole power, and how would the size
          of the miss change for $2^{56}$ or $2^{96}$?
        hint: >
          Count the blocks of ten bits in each.
        answer: >
          Multiply the quick answer by $1.024^{k}$, where $k$ is the number of
          ten-bit blocks: $k = 3$ for $2^{36}$, so $\times 1.074$. The miss
          compounds with $k$: about $13\%$ at $k = 5$ and about $24\%$ at
          $k = 9$. So for small $k$ the bare power of ten is a fine order of
          magnitude, and for large $k$ the correction is the difference
          between the right leading digit and the wrong one.
      - teach: >
          That is the technique. $2^{10} = 1024 \approx 10^{3}$, high by
          $2.4\%$, so $2^{10k + j} \approx 10^{3k} \times 2^{j} \times
          1.024^{k}$: count the bits, split them into blocks of ten, and pay
          one factor of $1.024$ per block. Squaring once gives $1.024^{2} =
          1.048576$, which carries most of the work.
      - part: The 2.4 percent, put back
        ask: >
          Using $1.024^{3} \approx 1.0737$, what is $2^{36}$ in units of
          $10^{10}$?
        expects: "6.872"
        tolerance: 0.002
        hint: >
          $6.4 \times 1.0737$.
        feedback: >
          $6.4 \times 1.0737 = 6.8717$, against the exact $6.8719$. Here the
          correction is exact in principle, since $64 \times 1024^{3}$ is
          $2^{36}$ itself; the only error is rounding $1.0737$.
      - part: The same fact as a logarithm
        ask: >
          Another route: $2^{n} = 10^{n \log_{10}2}$, with $\log_{10}2 \approx
          0.30103$. What is $36 \times 0.30103$?
        expects: "10.837"
        tolerance: 0.001
        hint: >
          $36 \times 0.3 = 10.8$, and $36 \times 0.00103 = 0.037$.
        feedback: >
          $10.837$, so $2^{36} = 10^{10} \times 10^{0.837}$, and $10^{0.837}
          = 6.87$. The $0.00103$ beyond $0.3$ is the same $2.4\%$ in disguise:
          $10 \times 0.00103 = 0.0103$, and $10^{0.0103} = 1.024$.
      - ask: >
          A candidate uses $\log_{10}2 \approx 0.3$, gets $10^{10.8}$, and
          reports $6.3 \times 10^{10}$. What is the problem?
        choices:
          - text: >
              None: $0.3$ and $0.30103$ agree to two figures.
            feedback: >
              The exponent is multiplied by $36$, so the dropped $0.00103$
              becomes $0.037$, and $10^{0.037} = 1.09$. A $9\%$ miss in the
              mantissa is not two-figure agreement.
          - text: >
              The extra $0.00103$ per bit adds up to $0.037$ in the exponent, a
              factor of $1.09$ in the answer.
            correct: true
            feedback: >
              $6.87/6.31 = 1.09$. Rounding $\log_{10}2$ to $0.3$ is the same
              mistake as treating $2^{10}$ as exactly $1000$: both throw away
              $1.024$ per ten bits.
          - text: >
              The power of ten is wrong: it should be $10^{11}$.
            feedback: >
              The exponent $10.8$ or $10.837$ both sit between $10$ and $11$,
              so the power of ten is $10^{10}$ either way. The damage is in the
              leading digits.
        feedback: >
          $0.3$ gives the right power of ten and the wrong mantissa. Use
          $0.301$ at least, and $0.30103$ once $n$ is in the hundreds.
      - part: Both directions
        ask: >
          Take $2^{57} = 2^{50} \times 2^{7}$, with $1.024^{5} \approx
          1.1259$. What is $2^{57}$ in units of $10^{17}$?
        expects: "1.441"
        tolerance: 0.002
        hint: >
          $2^{50} \approx 10^{15} \times 1.1259$ and $2^{7} = 128$.
        feedback: >
          $128 \times 1.1259 = 144.12$, so $2^{57} \approx 1.441 \times
          10^{17}$, against the exact $1.4412 \times 10^{17}$. Without the
          correction you would have said $1.28$, off by $11\%$.
      - ask: >
          Going the other way: how many bits does an ID need so that each of
          $8$ billion people can have a different one?
        expects: "33"
        hint: >
          $2^{30} \approx 1.07 \times 10^{9}$. Keep doubling until you pass
          $8 \times 10^{9}$.
        feedback: >
          $2^{30} \approx 1.07 \times 10^{9}$, so $2^{32} \approx 4.3 \times
          10^{9}$ is too few and $2^{33} \approx 8.6 \times 10^{9}$ is
          enough: $33$ bits. The $2.4\%$ per block matters here; $2^{33}$
          clears $8$ billion by only $7\%$.
      - teach: >
          Said aloud: "Thirty-six bits is three blocks of ten and six left
          over, so $64$ times $10^{9}$, plus $2.4\%$ three times — about $6.9
          \times 10^{10}$." The block count tells the listener both the power
          of ten and how much to correct it.

  - node: quant-mental.approximation.digits-of-2-100
    hook: >
      How-many-digits questions are a favorite opener because they resolve
      in one line once you trust $\lfloor\log_{10}N\rfloor+1$ — and the
      interviewer is watching for the $+1$ and the floor, not just the log.
    explanation: >
      A positive integer $N$ has $\lfloor\log_{10}N\rfloor+1$ digits,
      because $N$ has $d$ digits exactly when $10^{d-1}\le N<10^{d}$, i.e.
      $d-1\le\log_{10}N<d$ — the floor recovers $d-1$, and the $+1$ is not
      optional. For $N$ built from powers you already know how to log —
      powers of two via the anchor table, or a product of primes — the
      whole computation is "multiply the exponent by the right log
      constant, floor, add one."

      The technique generalizes past pure powers of two: any $N=a^{n}$
      needs only $\log_{10}a$, which is either an anchor directly or one
      combination away from one, as with $\log_{10}5=1-\log_{10}2$. The
      arithmetic is identical either way — only the constant you multiply
      by changes.

      Watch the boundary case: if $n\log_{10}a$ lands extremely close to an
      integer, the small error in your memorized constant can flip which
      side of that integer the true value sits on, which flips the digit
      count by one. That's the one place this technique needs a second look
      before you commit to an answer.
    worked: >
      Digits of $5^{60}$: $\log_{10}5\approx0.69897$ (from
      $1-\log_{10}2$), so $60\times0.69897=41.938$. Floor is $41$, plus one
      is $42$ digits.
    interview: >
      Phrased as "how many digits does $2^{50}$ have" or "is $3^{40}$
      bigger or smaller than $10^{19}$" — both resolve the same way, and a
      strong answer states the log computation out loud before giving the
      digit count.
    pitfalls: >
      Dropping the $+1$ — $\lfloor\log_{10}N\rfloor$ alone is one less than
      the digit count, the most common slip on this technique. Near-integer
      exponent values (an estimate of $30.999$ versus $31.000$) deserve an
      extra digit of precision on the log constant before you commit, since
      they sit right on a digit-count boundary.
    recap: >
      Digits of $N$ are $\lfloor\log_{10}N\rfloor+1$ — multiply the exponent
      by the right log anchor, floor, and never forget the plus one.
    dialogue:
      - part: Twenty-one or twenty-two
        teach: >
          An interviewer asks how many digits $2^{70}$ has. You go straight to
          blocks of ten bits: $2^{70} = (2^{10})^{7} \approx 10^{21}$, a little
          more because of the $1.024$ per block.
      - ask: >
          Start with the anchor itself. How many digits does $10^{21}$ have?
        expects: "22"
        hint: >
          $10^{1} = 10$ has two digits; $10^{2} = 100$ has three.
        feedback: >
          A $1$ followed by $21$ zeros: $22$ digits. The common slip is to
          count the zeros and answer $21$.
      - ask: >
          $2^{70}$ is $10^{21} \times 1.024^{7} \approx 1.18 \times 10^{21}$.
          How many digits does it have?
        choices:
          - text: >
              $21$: it is about $10^{21}$, and the exponent is the digit
              count.
            feedback: >
              The exponent counts the zeros after the leading digit, not the
              digits. $10^{21}$ already has $22$, and $2^{70}$ is bigger.
          - text: >
              $23$: it is above $10^{21}$, so it needs one more digit than
              $10^{21}$.
            feedback: >
              Every number from $10^{21}$ up to just under $10^{22}$ has the
              same $22$ digits. To gain a digit $2^{70}$ would have to reach
              $10^{22}$, ten times larger, and $1.18$ is nowhere near $10$.
          - text: >
              $22$: it sits between $10^{21}$ and $10^{22}$.
            correct: true
            feedback: >
              Exactly $1{,}180{,}591{,}620{,}717{,}411{,}303{,}424$: $22$
              digits. Its mantissa $1.18$ decides nothing; only which two
              powers of ten it sits between does.
        feedback: >
          The digit count is set by the bracket of powers of ten around the
          number, never by its leading digits.
      - reflect: >
          Turn that into a rule. Suppose you know $\log_{10}N$ but not $N$.
          How do you read off the number of digits, and why does it work?
        hint: >
          A $d$-digit number lies in $[10^{d-1}, 10^{d})$. Take $\log_{10}$ of
          that bracket.
        answer: >
          $N$ has $d$ digits exactly when $10^{d-1} \le N < 10^{d}$, that is,
          when $d - 1 \le \log_{10}N < d$. So the floor of $\log_{10}N$ is
          $d - 1$, and $d = \lfloor \log_{10}N \rfloor + 1$. For $2^{70}$,
          $\log_{10}N = 70 \times 0.30103 = 21.07$, floor $21$, plus one is
          $22$.
      - teach: >
          So counting digits is a log computation: $\lfloor \log_{10}N
          \rfloor + 1$, and for a power $N = a^{n}$ the log is just
          $n\log_{10}a$, one multiplication by an anchor. The only real risk is
          an exponent landing close to an integer, where the precision of the
          anchor decides the answer.
      - part: A power that lands on the edge
        ask: >
          How many digits does $2^{103}$ have? Use $\log_{10}2 \approx
          0.30103$.
        expects: "32"
        hint: >
          $103 \times 0.30103$, then floor, then add one.
        feedback: >
          $103 \times 0.30103 = 31.006$. Floor $31$, plus one: $32$ digits.
          Note how close that is to $31$.
      - ask: >
          A candidate uses $\log_{10}2 \approx 0.3$, gets $30.9$, and answers
          $31$ digits. Who is right, and how do you know?
        choices:
          - text: >
              Both are within rounding; the honest answer is "$31$ or $32$".
            feedback: >
              You can do better than that. $0.30103$ is good to about
              $0.0000001$, so over $103$ bits its error is under $0.00001$,
              far smaller than the $0.006$ margin above $31$. The answer is
              settled.
          - text: >
              $32$: the $0.00103$ dropped from each bit adds up to $0.106$,
              enough to move the log across $31$.
            correct: true
            feedback: >
              $103 \times 0.00103 = 0.106$, so $0.3$ puts the log at $30.9$
              when it is really $31.006$. Near a boundary, the fourth digit of
              the anchor decides the answer.
          - text: >
              $31$: the true value of $\log_{10}2$ is closer to $0.3$ than to
              $0.30103$.
            feedback: >
              $\log_{10}2 = 0.3010300$, so $0.30103$ is correct to seven
              places and $0.3$ is off by $0.001$.
        feedback: >
          When $n\log_{10}a$ lands within a few hundredths of an integer, carry
          the anchor to five figures before you floor.
      - ask: >
          Check it the other way. $2^{103} = (2^{10})^{10} \times 2^{3}
          \approx 10^{30} \times 1.024^{10} \times 8$, with $1.024^{10}
          \approx 1.2677$. What is $2^{103}$ in units of $10^{31}$?
        expects: "1.014"
        tolerance: 0.002
        hint: >
          $1.2677 \times 8$, then shift one place.
        feedback: >
          $1.2677 \times 8 = 10.14$, so $2^{103} \approx 1.014 \times
          10^{31}$: just over $10^{31}$, so $32$ digits. Two independent routes
          agree, and the second shows how thin the margin is, about $1.4\%$.
      - part: Other bases, and the question in reverse
        ask: >
          How many digits does $50^{20}$ have? Build $\log_{10}50$ from the
          anchor table.
        expects: "34"
        hint: >
          $50 = 100/2$, so $\log_{10}50 = 2 - 0.30103$.
        feedback: >
          $\log_{10}50 = 1.69897$, and $20 \times 1.69897 = 33.979$. Floor
          $33$, plus one: $34$. Rounding $33.979$ up to $34$ and then adding
          one gives $35$, the other way to slip.
      - ask: >
          What is the smallest $n$ for which $2^{n}$ has $100$ digits?
        expects: "329"
        hint: >
          You need $n \times 0.30103 \ge 99$.
        feedback: >
          $99/0.30103 = 328.87$, so $n = 329$: $329 \times 0.30103 = 99.039$
          gives $100$ digits, while $328 \times 0.30103 = 98.738$ gives only
          $99$. A $100$-digit number needs $\log_{10}N \ge 99$, not $100$.
      - teach: >
          Said aloud: "$103$ times $0.30103$ is $31.006$, so $32$ digits — and
          since that is close to $31$, I used five figures of $\log_{10}2$."
          The second clause is the one that earns trust.

  - node: quant-mental.approximation.normal-quantiles
    hook: >
      Confidence intervals, VaR cutoffs, and "how many sigma was that move"
      all bottom out in the same four numbers, and they need to come out
      cold — there's no derivation to fall back on mid-interview.
    explanation: >
      Hold the two-sided cutoffs $1\sigma\approx68.27\%$, $1.645\sigma=90\%$,
      $1.96\sigma\approx95\%$, $2.576\sigma\approx99\%$, plus the one-sided
      versions $1.645\sigma=95\%$ and $2.33\sigma\approx99\%$. The one-sided
      and two-sided tables are linked by symmetry: a two-sided level $p$
      puts $(1-p)/2$ in each tail, so its cutoff is the one-sided
      $(1+p)/2$ cutoff — that's why $1.96$ (two-sided $95\%$) and $1.645$
      (one-sided $95\%$) are different numbers for what sounds like "the
      same" $95\%$.

      Rounding $1.96$ to $2$ is common and mostly harmless for a fast gut
      check — it shifts the implied coverage from $95\%$ to about
      $95.45\%$, a $0.45$-point move — but say so if the number you quote is
      meant to be exact, since a quoted confidence interval that silently
      used $2$ instead of $1.96$ is a different interval.

      Use the table in both directions: given a probability, read off the
      sigma cutoff (a confidence interval, a VaR level); given a move size
      in sigmas, read off how rare it is (an outlier check).
    worked: >
      A desk's daily P&L has standard deviation $1.5\%$; the one-sided
      $99\%$ VaR cutoff is $2.33\times1.5\%\approx3.5\%$ — losses beyond
      about $3.5\%$ of notional should occur roughly one day in a hundred.
    interview: >
      Fired as "what's the z-score for a $95\%$ interval" or "how many
      sigma is a one-in-a-thousand event" — expect instant recall to three
      significant figures, and be ready to say whether the question means
      one-sided or two-sided before answering, since the two tables
      disagree.
    pitfalls: >
      Answering a one-sided question with the two-sided cutoff or vice
      versa — $1.645$ and $1.96$ get swapped constantly under time pressure.
      Quoting $1.96\to2$ as if it changed nothing: for a headline confidence
      level you should state the rounding, not silently apply it.
    recap: >
      Two-sided $90/95/99\%$ sit at $1.645/1.96/2.576$ sigma, one-sided
      $95/99\%$ at $1.645/2.33$ — and the two tables are not
      interchangeable.
    dialogue:
      - part: Two questions about one desk
        teach: >
          A market-making desk's daily P&L is close to normal, mean $0$,
          standard deviation $40$ thousand. Risk asks two things: a band that
          holds $95\%$ of days, and the loss that is exceeded on only $5\%$ of
          days. Both say "$95\%$", and you have no table.
      - ask: >
          Start with the band. The rule of thumb says about $95\%$ of a normal
          lies within $2$ standard deviations. What half-width does that give,
          in thousands?
        expects: "80"
        hint: >
          $2 \times 40$.
        feedback: >
          $\pm 80$ thousand. Close: the exact $95\%$ cutoff is $1.96$ standard
          deviations, $\pm 78.4$, and a $\pm 2$ band actually holds $95.45\%$.
          Fine for a gut check; say so if the number is going in a report.
      - ask: >
          Now the loss exceeded on $5\%$ of days. A colleague reuses the band:
          "losses beyond $80$ happen $5\%$ of the time." Is that right?
        choices:
          - text: >
              Yes: both questions are about $95\%$, so the cutoff is the same.
            feedback: >
              The band leaves its $5\%$ outside on *both* sides: big gains and
              big losses. Only half of it, about $2.3\%$, is losses beyond
              $80$.
          - text: >
              No: the $5\%$ outside the band is split between the two tails,
              so losses beyond $80$ happen only about $2.3\%$ of days.
            correct: true
            feedback: >
              By symmetry each tail holds half: $\Pr(Z < -2) = 2.3\%$. A loss
              threshold hit on $5\%$ of days has to sit closer in than $2$
              standard deviations.
          - text: >
              No: a one-sided threshold should sit further out than the band,
              so it is more than $80$.
            feedback: >
              Further out means rarer. Beyond $80$ is already rarer than $5\%$
              in one tail, so the threshold you want is *closer* than $80$.
        feedback: >
          "$95\%$" two-sided and "$95\%$" one-sided are different questions
          with different cutoffs. Which one is being asked decides the
          answer.
      - reflect: >
          You need the point with exactly $5\%$ of the distribution in the
          lower tail. Which *two-sided* band has $5\%$ in each tail — and so
          how do one-sided cutoffs relate to two-sided ones in general?
        hint: >
          If each tail holds $5\%$, how much is outside the band altogether?
        answer: >
          A band with $5\%$ in each tail leaves $10\%$ outside, so it is the
          two-sided $90\%$ band, whose cutoff is $1.645$. That same $1.645$ is
          the one-sided $95\%$ cutoff. In general, a two-sided level $p$ puts
          $(1-p)/2$ in each tail, so its cutoff is the one-sided cutoff at
          level $(1+p)/2$; the two tables are one table read two ways.
      - teach: >
          The table worth having cold. Two-sided: $\Pr(|Z| \le 1) = 68.27\%$,
          $\Pr(|Z| \le 1.645) = 90\%$, $\Pr(|Z| \le 1.96) = 95\%$,
          $\Pr(|Z| \le 2.576) = 99\%$. One-sided: $\Pr(Z \le 1.645) = 95\%$ and
          $\Pr(Z \le 2.33) = 99\%$. Before quoting a cutoff, say which table
          the question is on.
      - part: Reading the table both ways
        ask: >
          Back to the desk: what loss, in thousands, is exceeded on $5\%$ of
          days?
        expects: "65.8"
        tolerance: 0.05
        hint: >
          One-sided $95\%$ is $1.645$ standard deviations.
        feedback: >
          $1.645 \times 40 = 65.8$ thousand, well inside the $80$ the colleague
          proposed.
      - ask: >
          And the loss exceeded only one day in a hundred?
        expects: "93.2"
        tolerance: 0.05
        hint: >
          One-sided $99\%$.
        feedback: >
          $2.33 \times 40 = 93.2$ thousand. The two-sided $99\%$ cutoff,
          $2.576$, would give $103$, a threshold breached only one day in
          two hundred.
      - ask: >
          On a given day, how likely is a loss of at least $2.576$ standard
          deviations?
        choices:
          - text: >
              $1\%$: $2.576$ is the $99\%$ cutoff.
            feedback: >
              It is the *two-sided* $99\%$ cutoff, so the $1\%$ outside it is
              split: half big gains, half big losses.
          - text: >
              $0.5\%$: half of the $1\%$ outside the two-sided band.
            correct: true
            feedback: >
              Read a two-sided entry, halve what is outside, and you have a
              one-sided tail. About one trading day in two hundred.
          - text: >
              $99\%$: that is the probability attached to $2.576$.
            feedback: >
              $99\%$ is the probability of landing *inside* the band. The
              question asks about the tail beyond it.
        feedback: >
          Every two-sided entry is also a one-sided entry for a tail of half
          the size: $1.96$ for $2.5\%$, $2.576$ for $0.5\%$.
      - part: From a move back to a frequency
        ask: >
          Over a year of $250$ trading days, how many days would you expect
          the desk to lose more than $65.8$ thousand?
        expects: "12.5"
        tolerance: 0.1
        hint: >
          $65.8$ thousand is the one-sided $95\%$ cutoff.
        feedback: >
          $5\%$ of $250$ is $12.5$ days, about one a month. A loss of that size
          is routine, not an alarm.
      - ask: >
          In fact the desk lost more than $93.2$ thousand on $7$ days that
          year, against $2.5$ expected. What is the most sensible reading?
        choices:
          - text: >
              Bad luck: $7$ and $2.5$ are both small numbers.
            feedback: >
              If the true rate were $1\%$, seeing $7$ or more such days in
              $250$ has probability about $1.4\%$. Possible, but not the
              reading to lead with.
          - text: >
              The cutoff was wrong: it should have used $2.576$.
            feedback: >
              $2.576$ answers a two-sided question. The loss exceeded one day
              in a hundred is the one-sided $2.33$, and the arithmetic was
              right.
          - text: >
              The P&L has fatter tails than a normal, so the table understates
              how often big losses come.
            correct: true
            feedback: >
              The cutoffs are exactly as good as the normal assumption behind
              them. Daily P&L usually has heavier tails, and the far entries
              of the table are where that shows first.
        feedback: >
          The table converts sigmas to probabilities only for a normal. Use it
          freely for a sum of many small effects; for tail risk, say that you
          are assuming normality.
      - teach: >
          Said aloud: "One-sided $99\%$ is $2.33$ sigma, so about $93$
          thousand — assuming the P&L is close to normal." Naming one-sided or
          two-sided first is what an interviewer listens for.

  - node: quant-mental.approximation.annualizing
    hook: >
      Converting a rate across horizons — monthly to annual, annual to
      daily — is the most common "quick, in your head" desk question, and
      going the wrong direction (multiplying when you should take a root)
      is the easiest way to blow the answer.
    explanation: >
      Annualizing $n$ periods of rate $r$ is literally $(1+r)^{n}-1$, so the
      linear pass $nr$ and the correction $\binom{n}{2}r^{2}$ apply exactly
      as before — no new machinery, just $n$ in the role of the exponent.
      Going the other way — de-annualizing an annual rate $R$ into a
      per-period rate — solves $(1+r)^{n}=1+R$ for $r$, giving
      $r=(1+R)^{1/n}-1\approx R/n$ as the linear pass, with $1/n$ now
      playing the role of the exponent in the same binomial correction,
      $\binom{1/n}{2}R^{2}$.

      That correction term is worth noticing when the exponent is a
      fraction: $\binom{1/n}{2}$ is negative whenever $n>1$, so
      de-annualizing pulls the linear guess $R/n$ down, the mirror image of
      annualizing pulling $nr$ up. Same formula, opposite sign, because
      taking a root curves the other way from taking a power.

      One thing this rate machinery does not cover: volatility does not
      annualize by $n$ or de-annualize by $1/n$ — it scales with the square
      root of the horizon instead, a genuinely different rule developed
      properly elsewhere in this program. Reaching for $nr$ on a volatility
      number is a fast way to be badly wrong.
    worked: >
      An annual rate of $8\%$, de-annualized to monthly: linear guess
      $8\%/12\approx0.6667\%$. Exact: $(1.08)^{1/12}-1$. Since
      $\ln(1.08)\approx0.07696$, dividing by $12$ gives $0.006414$, and
      $e^{0.006414}-1\approx0.006434$, so the monthly rate is about
      $0.6434\%$ — the linear guess overshoots by roughly $3.6\%$ relative,
      in the direction the negative correction predicts.
    interview: >
      Phrased as "your fund returned $2\%$ last month, what's that
      annualized" or "given an $8\%$ annual yield, what's the daily rate" —
      expect the linear pass first, and instant recall that volatility
      needs $\sqrt{t}$, not $n$, if the question pivots to risk.
    pitfalls: >
      Applying $nr$ when $nr$ isn't small — annualizing a weekly $2\%$ over
      $52$ weeks gives $nr=1.04$, nowhere near the true multiple; reach for
      full compounding or the rule of 72. Reusing the rate-annualizing
      formula on a volatility number out of habit, when the correct scaling
      is $\sqrt{n}$.
    recap: >
      Annualizing and de-annualizing are both $(1+x)^{n}$ with $n$ or $1/n$
      as the exponent — but volatility scales by $\sqrt{n}$, not by this
      rule at all.
    dialogue:
      - part: Ten percent a year, from monthly
        teach: >
          A strategy earned $0.8\%$ in every month of a year. The pitch deck
          rounds that to "about $10\%$ a year". Before it goes to a client,
          you check the claim in your head.
      - ask: >
          Add the months up. What annual return, in percent, does the linear
          pass give?
        expects: "9.6"
        tolerance: 0.01
        hint: >
          $12 \times 0.8$.
        feedback: >
          $12 \times 0.8\% = 9.6\%$. That is $nr$, the first two terms of
          $(1 + r)^{12}$.
      - ask: >
          Add the correction $\binom{12}{2}r^{2}$. How large is it, in
          percentage points?
        expects: "0.42"
        tolerance: 0.005
        hint: >
          $\binom{12}{2} = 66$ and $0.008^{2} = 0.000064$.
        feedback: >
          $66 \times 0.000064 = 0.0042$, or $0.42$ points, so the annual return
          is about $10.02\%$. The exact $(1.008)^{12} - 1$ is $10.03\%$: the
          deck is right, and only because of the compounding.
      - part: Going the other way
        ask: >
          A deposit pays $12\%$ a year, credited quarterly at a fixed
          quarterly rate. The quick answer is $12/4 = 3\%$ a quarter. Is $3\%$
          too high or too low?
        choices:
          - text: >
              Too low: the quarters have to compound up to $12\%$, so each
              needs a bit more than a quarter of it.
            feedback: >
              Compounding helps, not hurts: four quarters at $3\%$ give
              $(1.03)^{4} = 1.1255$, already past $1.12$. Each quarter needs
              *less* than $3\%$.
          - text: >
              Exactly right: $4 \times 3\% = 12\%$.
            feedback: >
              That adds percentages. Compounded, $3\%$ a quarter is $12.55\%$
              a year, more than the deposit pays.
          - text: >
              Too high: $3\%$ a quarter compounds to $12.55\%$ a year.
            correct: true
            feedback: >
              $(1.03)^{4} = 1 + 0.12 + 6(0.03)^{2} + \dots = 1.1255$. The
              compounding you add going up has to be taken back going down.
        feedback: >
          Dividing an annual rate by $n$ overstates the per-period rate, for
          the same reason multiplying by $n$ understates the annual one.
      - reflect: >
          By how much should you cut the $3\%$? Write the quarterly rate as
          $r$, expand $(1+r)^{4} \approx 1 + 4r + 6r^{2}$, set it equal to
          $1.12$, and see what the $6r^{2}$ does to $r$. Then say what the
          general rule might be.
        hint: >
          With $r$ near $0.03$, $6r^{2}$ is about $0.0054$.
        answer: >
          $4r + 6r^{2} = 0.12$, and $6r^{2} \approx 0.0054$, so $4r \approx
          0.1146$ and $r \approx 2.865\%$. In general you can expand
          $(1+R)^{1/n}$ directly: the binomial series works for a fractional
          exponent too, giving $R/n + \binom{1/n}{2}R^{2}$. The coefficient
          $\binom{1/n}{2} = \tfrac{1}{n}(\tfrac{1}{n} - 1)/2$ is negative,
          which is the cut.
      - teach: >
          That is annualizing in both directions. Up: $(1+r)^{n} - 1 \approx
          nr + \binom{n}{2}r^{2}$, the correction pushing up. Down:
          $(1+R)^{1/n} - 1 \approx R/n + \binom{1/n}{2}R^{2}$, the same
          expansion with exponent $1/n$, and since $\binom{1/n}{2} < 0$ for
          $n > 1$, the correction pulls down. A power curves one way, a root
          the other.
      - part: The fractional correction, by hand
        ask: >
          What is $\binom{1/4}{2} = \tfrac{1}{4}(\tfrac{1}{4} - 1)/2$?
        expects: "-3/32"
        hint: >
          $\tfrac{1}{4} - 1 = -\tfrac{3}{4}$.
        feedback: >
          $\tfrac{1}{4} \times (-\tfrac{3}{4})/2 = -3/32 = -0.09375$. Negative,
          as it must be for any $n > 1$.
      - ask: >
          So what is the quarterly rate, in percent: $3\% + \binom{1/4}{2}
          \times 0.12^{2}$?
        expects: "2.865"
        tolerance: 0.002
        hint: >
          $0.09375 \times 0.0144 = 0.00135$.
        feedback: >
          $0.03 - 0.00135 = 0.02865$, or $2.865\%$. The exact $(1.12)^{1/4} - 1$
          is $2.874\%$; the next term, $\binom{1/4}{3}R^{3} \approx
          +0.0001$, accounts for nearly all of the gap. The reflection's route
          and the fractional binomial give the same number.
      - part: What does not annualize this way
        ask: >
          The strategy's monthly returns have a standard deviation of $3\%$,
          roughly independent month to month. The deck lists annual volatility
          as $12 \times 3\% = 36\%$. What is wrong?
        choices:
          - text: >
              Nothing: a monthly figure times $12$ is the annual figure.
            feedback: >
              That works for the mean, because means add. Standard deviations
              do not add; variances do.
          - text: >
              It should compound: $(1.03)^{12} - 1 = 42.6\%$.
            feedback: >
              Compounding applies to returns earned one after another, not to
              a measure of spread. This makes the error worse.
          - text: >
              Variances add across independent months, so volatility grows
              like $\sqrt{12}$, not $12$.
            correct: true
            feedback: >
              Twelve independent months give variance $12 \times (3\%)^{2}$,
              and the standard deviation is its square root,
              $3\% \times \sqrt{12}$.
        feedback: >
          Mean return scales with the horizon; volatility scales with its
          square root. The annualizing machinery above is for rates only.
      - ask: >
          What is the annual volatility, in percent? Use $\sqrt{12} \approx
          3.464$.
        expects: "10.39"
        tolerance: 0.01
        hint: >
          $3 \times 3.464$.
        feedback: >
          $3 \times 3.464 = 10.39\%$, about a third of the deck's $36\%$. A
          volatility scaled by $n$ instead of $\sqrt{n}$ is wrong by the factor
          $\sqrt{n}$.
      - teach: >
          Said aloud: "Twelve times $0.8$ is $9.6$, plus $66$ times $0.008$
          squared, about $0.4$, so just over $10\%$. Volatility goes with root
          twelve, so about $10\%$ there too." Two horizons, two different
          rules, each named as you use it.

  - node: quant-mental.approximation.compound-growth-example
    hook: >
      "Grow at rate $r$ for $t$ years, name the multiple" is the single most
      common mental-math opener, and half the graded skill is picking the
      right tool the moment you see $r$ and $t$.
    explanation: >
      The decision rule is the size of $rt$: while $rt$ stays small (well
      under a few tenths), the linear-plus-correction pass from compounding
      is fine and fast. Once $rt$ grows past roughly $0.5$, you're several
      doublings deep and the compounding is essentially exponential rather
      than a small perturbation, so lean on doubling time instead: divide
      the horizon by $72/r$ to get a usually-fractional number of doublings,
      then estimate $2^{\text{doublings}}$.

      For the fractional part, either use a known root of two directly
      (like $2^{1/2}=\sqrt2\approx1.414$, from the anchor table) or fall
      back to $e^{x}\approx1+x+x^{2}/2$ with $x=(\text{fraction})\times
      \ln2$. Either route gets you within a couple of percent, which is the
      point — this is a sanity-check estimate, not a final quoted figure.

      Always check $rt$ before picking a tool: reaching for the linear pass
      when $rt$ is not small, or for the doubling estimate when a single
      linear term would have done, both cost time without buying accuracy.
    worked: >
      Grow at $5\%$ for $30$ years: $rt=1.5$, far too large for a linear
      pass ($1+30(0.05)=2.5$ is nowhere close). Doubling time is
      $72/5=14.4$ years, so $30/14.4\approx2.083$ doublings.
      $2^{2.083}=4\times2^{1/12}\approx4\times1.05946=4.2378$. Exact value
      is $(1.05)^{30}\approx4.3219$, so the doubling estimate is low by
      about $2\%$ — a fine sanity check, not a precise final answer.
    interview: >
      The canonical form is "grow at $r\%$ for $t$ years, roughly what
      multiple" — expect you to state $rt$ out loud, declare which tool
      you're using, and land within a couple of percent with no calculator.
    pitfalls: >
      Using the linear pass when $rt$ is large — here it misses by over
      $40\%$ ($2.5$ vs. $4.32$). Rounding a fractional number of doublings
      to the nearest integer instead of estimating the fractional power —
      that rounding alone can be off by a factor of $\sqrt2$, about $41\%$.
    recap: >
      Check $rt$ first: small means linear-plus-correction, large means
      doubling time and a fractional power of two.
    dialogue:
      - part: Nine percent for twelve years
        teach: >
          A university endowment expects to grow at $9\%$ a year. A trustee
          asks what multiple of today's fund that is after $12$ years, and
          wants a number before the meeting moves on.
      - ask: >
          First, the linear pass $1 + nx$. What multiple does it give?
        expects: "2.08"
        tolerance: 0.001
        hint: >
          $12 \times 0.09 = 1.08$.
        feedback: >
          $1 + 1.08 = 2.08$. The exact value is $(1.09)^{12} = 2.813$, so this
          is $26\%$ low.
      - ask: >
          Add the correction $\binom{12}{2}x^{2}$. What multiple now?
        expects: "2.615"
        tolerance: 0.002
        hint: >
          $66 \times 0.0081$.
        feedback: >
          $66 \times 0.0081 = 0.535$, so $2.08 + 0.535 = 2.615$. Better, and
          still $7\%$ short of $2.813$.
      - part: When the correction is not enough
        ask: >
          Why is the corrected estimate still $7\%$ low?
        choices:
          - text: >
              The correction should be $(nx)^{2}/2 = 0.58$, not
              $\binom{n}{2}x^{2}$.
            feedback: >
              $\binom{12}{2}x^{2}$ is the right coefficient: it counts pairs
              of years. And $0.58$ would give $2.66$, still $5\%$ short. The
              problem is not this term.
          - text: >
              $nx = 1.08$ is not small, so the terms after it are not small
              either: the next is $\binom{12}{3}x^{3} = 0.16$.
            correct: true
            feedback: >
              $220 \times 0.000729 = 0.160$, then $495 \times 0.0000656 =
              0.032$, and so on. With $nx$ near $1$ the series converges
              slowly, and no two-term truncation is trustworthy.
          - text: >
              $9\%$ is too large a rate for any approximation.
            feedback: >
              The rate is not the issue: $9\%$ for $2$ years is $1 + 0.18 +
              0.0081 = 1.1881$, exact. What matters is $nx$, the rate times
              the horizon.
        feedback: >
          The size of $rt$ decides the tool. Here $rt = 1.08$, and the
          binomial route has run out of road.
      - reflect: >
          You need a way of counting growth that does not care how large $rt$
          is. Which tool from earlier measures growth in whole units no matter
          how many there are — and how would it handle $12$ years at $9\%$?
        hint: >
          How long does money take to double at $9\%$?
        answer: >
          Count doublings. The rule of 72 gives a doubling time of $72/9 = 8$
          years, so $12$ years is $1.5$ doublings and the multiple is
          $2^{1.5}$. Doublings stack exactly however many there are; the only
          approximation left is the doubling time itself, which the rule of 72
          gets right to about $1\%$ near $9\%$.
      - teach: >
          So the example comes down to one decision. Compute $rt$ first. Small
          (a few tenths or less): use $1 + rt$ plus the $\binom{n}{2}r^{2}$
          correction. Large: divide the horizon by the doubling time $72/r$ and
          evaluate $2^{\text{doublings}}$, using an anchor root such as
          $\sqrt{2}$ or $e^{x} \approx 1 + x + x^{2}/2$ with $x$ the fractional
          doublings times $\ln 2$.
      - part: Counting doublings
        ask: >
          At $9\%$ a year, how many doublings fit in $12$ years?
        expects: "1.5"
        hint: >
          Doubling time $72/9$.
        feedback: >
          $72/9 = 8$ years per doubling, and $12/8 = 1.5$ doublings.
      - ask: >
          What multiple is $2^{1.5}$? Use $\sqrt{2} \approx 1.41421$.
        expects: "2.828"
        tolerance: 0.002
        hint: >
          $2^{1.5} = 2\sqrt{2}$.
        feedback: >
          $2 \times 1.41421 = 2.828$, against the exact $2.813$: $0.6\%$ high,
          because the true doubling time at $9\%$ is $8.04$ years, slightly
          longer than $8$.
      - ask: >
          Now $10$ years at $9\%$, which is $1.25$ doublings. The quarter
          doubling is $2^{0.25} = e^{0.25 \ln 2} = e^{0.1733}$. Using $e^{x}
          \approx 1 + x + x^{2}/2$, what is it?
        expects: "1.188"
        tolerance: 0.0015
        hint: >
          $0.1733^{2}/2 \approx 0.015$.
        feedback: >
          $1 + 0.1733 + 0.0150 = 1.1883$, so the $10$-year multiple is about
          $2 \times 1.1883 = 2.377$, against the exact $(1.09)^{10} = 2.367$.
          Rounding $1.25$ doublings down to $1$ would have said $2$, a $15\%$
          miss.
      - part: Choosing the tool
        ask: >
          A bond fund grows at $4\%$ for $5$ years, so $rt = 0.2$. Which route
          should you take?
        choices:
          - text: >
              Doublings: $72/4 = 18$ years, so $5/18$ of a doubling.
            feedback: >
              It works, but slowly: $2^{0.278}$ needs its own expansion, and
              the rule of 72 is off by $2\%$ at $4\%$. You get $1.212$, a
              $0.4\%$ miss, for more work.
          - text: >
              Linear pass plus correction: $1 + 0.2 + 10 \times 0.0016$.
            correct: true
            feedback: >
              $1.216$, against the exact $1.2167$: within $0.06\%$ in one line.
              With $rt$ small, the binomial route is both faster and sharper.
          - text: >
              Linear pass alone: $1.2$.
            feedback: >
              $1.2$ is $1.4\%$ low. At $rt = 0.2$ the correction is one
              multiplication, and it buys a whole extra digit.
        feedback: >
          The same check, $rt$, sends you one way at $0.2$ and the other at
          $1.08$. Neither tool wins everywhere.
      - teach: >
          Said aloud: "$rt$ is about one, so I count doublings: $8$ years each,
          $1.5$ of them, $2\sqrt{2}$, about $2.8$." Stating $rt$ first tells
          the listener why you chose the tool.

  - node: quant-mental.approximation.vol-quantile-example
    hook: >
      "How big a move in sigma over some horizon" chains two separate
      mental-math skills into one question, and the two classic ways to
      blow it — annualizing volatility like a rate, or grabbing the wrong
      sigma cutoff — both show up right here.
    explanation: >
      Volatility does not annualize the way a mean return does: independent
      period returns have variances that add, so $n$ periods of equal
      per-period variance $\sigma^{2}$ sum to $n\sigma^{2}$, and a standard
      deviation is a square root of variance — hence horizon scaling goes by
      $\sqrt{n}$, not $n$. Converting an annual volatility down to a shorter
      period runs that scaling backwards: divide by $\sqrt{n}$, where $n$ is
      the number of those periods in a year.

      Once you have the period's volatility, a "how big is a $k$-sigma
      move" question is just multiplication: $k\times\sigma_{\text{period}}$.
      Reading off how rare that move is then falls straight out of the
      sigma-to-probability table — no new computation, just a lookup.

      The two-step pattern is worth having as a single unit: horizon-scale
      the volatility, then multiply by $k$ and look up the probability.
      Every "is this move an outlier" question in an interview is this same
      chain.
    worked: >
      A stock has $25\%$ annualized volatility; how big is a $1.645\sigma$
      weekly move? Weekly volatility is $25\%/\sqrt{52}\approx
      25\%/7.211\approx3.467\%$. A $1.645\sigma$ move is then about
      $1.645\times3.467\%\approx5.70\%$, and by the one-sided reading of the
      sigma table that threshold is crossed with probability near $5\%$ —
      about one week in twenty, a notable move but not a genuine anomaly.
    interview: >
      Phrased as "given annual vol of $X\%$, how big a move in a
      day/week/month is $N$ sigma" — a compound question testing both
      skills at once. State the period volatility, the move size, and the
      rough probability, all in one breath.
    pitfalls: >
      Reusing the mean-return annualizing rule ($\times n$ or $/ n$) on
      volatility out of habit — the correct factor is $\sqrt{n}$, and mixing
      this up right after an annualizing-a-rate question is the most common
      way it happens. Dividing by $\sqrt{252}$ (trading days) when the
      question is in weeks or months — matching the wrong period count to
      the wrong horizon.
    recap: >
      Scale volatility by $\sqrt{n}$ across a horizon, multiply by $k$ for a
      $k$-sigma move, then read the probability off the sigma table.
    dialogue:
      - part: Was last week unusual
        teach: >
          A stock with $30\%$ annualized volatility fell $8\%$ last week. The
          head trader asks whether that is a big week for this name or an
          ordinary one, and wants the answer in sigmas and in how often.
      - ask: >
          To measure an $8\%$ weekly fall in sigmas you need the weekly
          volatility. Which is it?
        choices:
          - text: >
              $30\%/52 = 0.58\%$: a year has $52$ weeks.
            feedback: >
              That is how a mean return de-annualizes. Used on volatility it
              makes the $8\%$ fall a $14\sigma$ event, which a stock with
              $30\%$ volatility essentially never has. Variances add across
              weeks, not standard deviations.
          - text: >
              $30\%/\sqrt{52} \approx 4.2\%$: variance scales with time, so
              volatility scales with its square root.
            correct: true
            feedback: >
              Fifty-two independent weeks give annual variance $52\sigma_{w}^{2}$,
              so $\sigma_{w} = 30\%/\sqrt{52}$.
          - text: >
              $30\%/\sqrt{252} \approx 1.9\%$: volatility is quoted in trading
              days.
            feedback: >
              $\sqrt{252}$ gives a *daily* volatility. The move happened over a
              week, so the period count has to be weeks per year.
          - text: >
              $30\%$: compare the move with the quoted figure directly.
            feedback: >
              $30\%$ is the spread of a whole year's return. Against it, any
              single week looks tiny, and the comparison says nothing.
        feedback: >
          Match the volatility to the horizon of the move, and scale it by the
          square root of the number of periods.
      - ask: >
          With $\sqrt{52} \approx 7.211$, what is the weekly volatility, in
          percent?
        expects: "4.16"
        tolerance: 0.01
        hint: >
          $30/7.211$.
        feedback: >
          $30/7.211 = 4.16\%$. An ordinary week moves the stock about $4\%$
          either way.
      - ask: >
          How many weekly standard deviations is the $8\%$ fall?
        expects: "1.92"
        tolerance: 0.01
        hint: >
          $8/4.16$.
        feedback: >
          $8/4.16 = 1.92$. Just under two sigma.
      - reflect: >
          You have $1.92\sigma$. Turn it into "how often", and decide which
          reading of the sigma table fits the trader's question, which was
          about a *fall* this big.
        hint: >
          Which table entry is close to $1.92$, and how much of what lies
          outside it is on the downside?
        answer: >
          $1.92$ is close to $1.96$, the two-sided $95\%$ cutoff. That leaves
          $5\%$ outside, half of it on each side, so a fall at least this big
          has probability about $2.5\%$ in a given week (a little more, since
          $1.92 < 1.96$). That is the one-sided reading, because the question
          names a direction.
      - teach: >
          That is the whole chain. Scale the volatility to the horizon of the
          move by $\sqrt{n}$, divide the move by it to get sigmas (or multiply
          a sigma level by it to get a move), read the probability off the
          table — one-sided if the question has a direction — and translate it
          into the horizon's own units.
      - part: How often, in weeks
        ask: >
          Using the table's $2.5\%$, how many weeks a year would you expect a
          fall at least this large?
        expects: "1.3"
        tolerance: 0.1
        hint: >
          $52$ weeks times $2.5\%$.
        feedback: >
          $52 \times 0.025 = 1.3$ weeks, about once a year. The exact tail at
          $1.92\sigma$ is $2.7\%$, which makes it $1.4$. So: "about two sigma,
          a once-a-year week" — notable, not an anomaly.
      - part: The chain run forward
        ask: >
          Now the risk team wants the quarterly loss exceeded one quarter in a
          hundred. First, the quarterly volatility, in percent?
        expects: "15"
        hint: >
          Four quarters in a year.
        feedback: >
          $30\%/\sqrt{4} = 15\%$. A clean square root, which is why quarterly
          questions are the friendly ones.
      - ask: >
          And the quarterly loss exceeded one quarter in a hundred, in percent?
        expects: "34.95"
        tolerance: 0.05
        hint: >
          One-sided $99\%$.
        feedback: >
          $2.33 \times 15\% = 34.95\%$. The two-sided $2.576$ would have given
          $38.6\%$, a loss exceeded only one quarter in two hundred.
      - part: What the square root assumes
        ask: >
          A trader estimates weekly volatility at $4\%$ and annualizes it to
          $4\% \times \sqrt{52} = 28.8\%$. But this stock trends: a good week
          tends to be followed by another. Is the true annual volatility above
          or below $28.8\%$?
        choices:
          - text: >
              The same: each week's volatility is still $4\%$.
            feedback: >
              The variance of a sum is the sum of the variances *plus* twice
              every covariance. Each week's spread is unchanged, but the weeks
              no longer move independently.
          - text: >
              Above: positive covariances between weeks add to the variance
              of the year.
            correct: true
            feedback: >
              Trending weeks reinforce each other, so the year spreads out
              more than $52$ independent weeks would. The $\sqrt{n}$ rule is
              exact only for uncorrelated periods.
          - text: >
              Below: trends make prices smoother, so they are less volatile.
            feedback: >
              Smoothness within a week does not shrink the year. If good weeks
              follow good weeks, the year's total moves further, not less.
        feedback: >
          The square-root rule rests on independence. With returns that trend
          or mean-revert, scale with care and say that you assumed
          independence.
      - teach: >
          Said aloud: "Thirty over root fifty-two is about four percent a week,
          so eight percent is about two sigma — a fall like that once a year."
          The period volatility, the sigma count, and the frequency, in one
          breath.

  - node: quant-mental.approximation.percent-compounding-trap
    hook: >
      "Up $20\%$ then down $20\%$, back to even?" is a favorite opener
      precisely because the wrong answer sounds obviously right, and
      answering confidently and wrong is the most common outcome in the
      room.
    explanation: >
      $(1+x)(1-x)=1-x^{2}$ is exact algebra — a difference of squares, not a
      truncated series — so there is no approximation to worry about here,
      only the discipline of not adding percentages. Treating a $+x$ move
      and a $-x$ move as canceling is precisely the additive-percentage
      mistake that compounding warns against: the correct multiplicative
      view shows the net factor is always $1-x^{2}$, strictly below $1$
      whenever $x\ne0$.

      The loss scales with the square of the swing, not linearly: a $10\%$
      round trip costs $1\%$, a $20\%$ round trip costs $4\%$, a $50\%$
      round trip costs a full $25\%$. Doubling the swing quadruples the
      damage — the same nonlinearity that shows up as the correction term
      when compounding one rate $n$ times, except here it's the entire
      exact answer rather than a small fix-up, because $x$ in these
      examples is rarely small enough to call it a correction.

      Not every round trip nets a loss: unequal moves can cancel exactly
      when the factors are reciprocal ($+25\%$ then $-20\%$ is flat, since
      $0.8=1/1.25$) — a different, genuinely even case, worth distinguishing
      from the equal-and-opposite case here.
    worked: >
      $+30\%$ then $-30\%$: $(1.3)(0.7)=0.91$, a net loss of $9\%$ — exactly
      $-(0.3)^{2}=-0.09$, matching the formula precisely, not approximately.
    interview: >
      "A stock drops $20\%$ then rises $20\%$ — even?" is close to a
      certainty in a mental-math round; the strong answer is instant: "no,
      down $4\%$, because it's $1.2\times0.8$," ideally naming $-x^{2}$
      without being asked.
    pitfalls: >
      Assuming equal-and-opposite percent moves cancel — they never do,
      except in the trivial $x=0$ case. Confusing this case with the
      genuinely flat one: $+25\%$ then $-20\%$ nets exactly zero because
      those factors are reciprocals, a different scenario from
      equal-magnitude swings.
    recap: >
      A $+x$ then $-x$ swing always nets $-x^{2}$, never zero, and the loss
      grows with the square of the swing.
    dialogue:
      - part: Up a quarter, down a quarter
        teach: >
          A stock jumps $25\%$ on earnings, then gives back $25\%$ the
          following week. A client holding $100$ thousand of it says she is
          back where she started.
      - ask: >
          What is her net change over the two weeks, in percent? Use a minus
          sign for a loss.
        expects: "-6.25"
        tolerance: 0.001
        hint: >
          Multiply the factors $1.25$ and $0.75$.
        feedback: >
          $1.25 \times 0.75 = 0.9375$, so she is down $6.25\%$: $93.75$
          thousand, not $100$.
      - ask: >
          Where did the $6.25$ thousand go?
        choices:
          - text: >
              The fall came second; had it come first, she would be even.
            feedback: >
              Reverse it: $0.75 \times 1.25 = 0.9375$ again. Multiplication
              does not care about order, and neither does the loss.
          - text: >
              The $25\%$ fall was taken from $125$ thousand, so it removed
              $31.25$ thousand, more than the $25$ the rise added.
            correct: true
            feedback: >
              Same percentage, bigger base. The rise added $25\%$ of $100$;
              the fall removed $25\%$ of $125$. The difference, $6.25$, is
              $25\%$ of the $25$ thousand gain itself.
          - text: >
              Rounding: percentages of this size are not meant to be exact.
            feedback: >
              Nothing here was rounded. $1.25 \times 0.75 = 0.9375$ exactly,
              and the loss is real money.
        feedback: >
          Percent changes are measured against different bases, so they
          multiply. Adding $+25$ and $-25$ to get $0$ is the mistake.
      - reflect: >
          Make it general: up $x$, then down $x$. Multiply the two factors.
          What is the net loss, exactly, and what does the linear pass from
          compounding say it is?
        hint: >
          $(1 + x)(1 - x)$ is a difference of squares.
        answer: >
          $(1+x)(1-x) = 1 - x^{2}$, so the loss is exactly $x^{2}$: $0.25^{2} =
          0.0625$ here. The linear pass adds the changes, $x - x = 0$, and
          misses everything; the whole answer is the cross term $x \times (-x)$,
          the fall acting on the rise. No approximation is involved.
      - teach: >
          That is the trap. A rise of $x$ followed by a fall of $x$ (in either
          order) nets $-x^{2}$ exactly. It is never zero for $x \ne 0$, and it
          grows with the *square* of the swing.
      - part: How the damage scales
        ask: >
          A quieter stock goes up $6\%$ then down $6\%$. Net change, in
          percent?
        expects: "-0.36"
        tolerance: 0.001
        hint: >
          $-x^{2}$ with $x = 0.06$.
        feedback: >
          $-(0.06)^{2} = -0.0036$, or $-0.36\%$. Check: $1.06 \times 0.94 =
          0.9964$.
      - ask: >
          An $18\%$ round trip is three times the swing of a $6\%$ one. How
          many times the loss?
        expects: "9"
        hint: >
          The loss is $x^{2}$.
        feedback: >
          $0.18^{2} = 0.0324$ against $0.0036$: nine times. Triple the swing,
          nine times the damage.
      - ask: >
          A round trip cost $0.49\%$. How big was the swing, in percent?
        expects: "7"
        hint: >
          Solve $x^{2} = 0.0049$.
        feedback: >
          $x = \sqrt{0.0049} = 0.07$, a $7\%$ swing. Because the loss is
          quadratic, a small round trip barely registers and a large one
          hurts.
      - part: When the trap does not apply
        ask: >
          A stock rises $60\%$. Which second move puts it back exactly where it
          began?
        choices:
          - text: >
              A fall of $60\%$.
            feedback: >
              $1.6 \times 0.4 = 0.64$, a loss of $36\%$, which is $0.6^{2}$.
              Equal and opposite percentages never cancel.
          - text: >
              A fall of $40\%$.
            feedback: >
              $1.6 \times 0.6 = 0.96$, still $4\%$ down. The fall needed is
              measured on the larger base of $160$.
          - text: >
              A fall of $37.5\%$.
            correct: true
            feedback: >
              The second factor must be $1/1.6 = 0.625$, a fall of $37.5\%$.
              Reciprocal factors cancel; equal percentages do not.
        feedback: >
          Exactly even takes $(1 + u)(1 - d) = 1$, so $1 - d = 1/(1+u)$. That
          is a different pair of numbers from the symmetric swing, and
          confusing the two cases is its own trap.
      - ask: >
          A trader says a $1\%$ rise then a $1\%$ fall is "flat". Is that fair?
        choices:
          - text: >
              Yes, to within a basis point: the loss is $0.01^{2} = 0.0001$.
            correct: true
            feedback: >
              For small swings the linear pass is fine, exactly as it was for
              $(1+x)^{n}$ with small $nx$. The trap is about size.
          - text: >
              No: the rule says every round trip loses, so "flat" is wrong.
            feedback: >
              It does lose, $0.01\%$. Calling that "flat" is a sensible
              rounding; calling a $25\%$ round trip flat is not.
          - text: >
              No: the loss is $1\%$, the size of the swing.
            feedback: >
              The loss is $x^{2}$, not $x$: $0.0001$, a hundred times smaller
              than $1\%$.
        feedback: >
          $-x^{2}$ is negligible for moves of a percent or two and dominant
          for moves of tens of percent. Say which regime you are in.
      - teach: >
          Said aloud: "Not even — it is $1.25$ times $0.75$, so down $6.25\%$.
          Up $x$ then down $x$ always costs $x$ squared." The formula, said
          without being asked, is what turns a correct answer into a strong
          one.

  - node: quant-mental.approximation.error-discipline
    hook: >
      An interviewer testing approximation skills is really testing whether
      you know how far to trust your own number — the estimate alone,
      without a stated error, is an unfinished answer.
    explanation: >
      Every technique in this toolkit works the same way: keep some terms of
      an expansion, drop the rest, and the size of the first dropped term is
      available the moment you decide how many terms to keep — it costs
      nothing extra to state it, because computing it is part of deciding
      where to stop. "$\sqrt{26}\approx5.1$" and "$\sqrt{26}\approx5.1$,
      high by about $0.001$" take the same work to produce; only the second
      is something an interviewer can act on, because it says whether the
      estimate was controlled or accidental.

      The habit generalizes past any single technique: when several
      approximations chain together — annualize a rate, scale a volatility,
      look up a sigma cutoff — each step carries its own dropped term, and
      the honest thing to report is the largest single one in the chain,
      not a painstaking sum of all of them. In practice one step usually
      dominates, and naming it is enough.

      This is also a signal about precision: an estimate quoted to more
      decimal digits than its own dropped term justifies is false
      precision, and a listener who catches it will trust every other
      number you give less.
    interview: >
      After any mental estimate, expect the unprompted follow-up "how
      confident are you, and which way is it biased" — volunteering that
      before being asked is what separates a strong answer from a merely
      correct one.
    pitfalls: >
      Quoting several decimal digits when the calculation itself dropped a
      term two orders of magnitude larger than the last digit shown.
      Rounding a constant mid-calculation (like $1.96\to2$) without flagging
      it, so the final number silently carries an unstated bias.
    recap: >
      An estimate without a stated, signed error is unfinished — always
      report the size and direction of what you dropped.
    dialogue:
      - part: Two answers to the same question
        teach: >
          Two candidates are asked for $\cos(0.35)$ with no calculator. Both
          keep $1 - x^{2}/2$. The first says "$0.93875$". The second says
          "$0.93875$, low by about $0.0006$".
      - ask: >
          A trade is worth doing only if $\cos(0.35)$ exceeds $0.9392$. Whose
          answer settles it?
        choices:
          - text: >
              Neither: both said $0.93875$, which is below $0.9392$.
            feedback: >
              $0.93875$ is below the line, but the second candidate also told
              you the truth sits about $0.0006$ higher, near $0.9394$ — above
              it. The extra clause changes the decision.
          - text: >
              The second: low by $0.0006$ puts the truth near $0.9394$, above
              the line.
            correct: true
            feedback: >
              The exact value is $0.939373$. The bare $0.93875$ could be off by
              any amount in either direction as far as the listener knows; the
              stated bar says which side of $0.9392$ the truth is on.
          - text: >
              The first: a number without a caveat is the more confident
              answer.
            feedback: >
              Confidence without a stated error is not information. The
              listener cannot tell whether $0.93875$ is good to $0.1$ or to
              $0.0001$, and the decision turns on the fourth decimal.
        feedback: >
          The same estimate, with and without its error, supports different
          decisions. Only one of them is usable.
      - ask: >
          Where did the second candidate's $0.0006$ come from? Compute the
          first term both of them dropped, $x^{4}/24$ at $x = 0.35$.
        expects: "0.000625"
        tolerance: 0.000005
        hint: >
          $0.35^{2} = 0.1225$, and $0.1225^{2} = 0.0150$.
        feedback: >
          $0.0150/24 = 0.000625$, positive, so the estimate is low. The true
          miss is $0.000623$. One more line of arithmetic, and it was already
          half done: $x^{2}$ was on the page.
      - reflect: >
          The first candidate could have spent that line adding $0.0006$ to
          get $0.9394$ instead of stating a bar. Why is saying the size and
          direction of what you dropped worth more than one more decimal of
          estimate?
        hint: >
          After $0.9394$, what does the listener still not know?
        answer: >
          A more precise estimate still arrives without a bar, so the listener
          still cannot tell which digits to trust. The size of the first
          dropped term says how far off you could be, and its sign says which
          way; together they tell the listener which decisions the number can
          settle. It costs no extra work, because computing that term is how
          you decided where to stop.
      - teach: >
          That is the discipline. Every estimate in this toolkit drops a term;
          report the estimate together with the size and sign of the first
          term dropped. "$0.939$" is a guess. "$0.939$, low by about $0.0006$"
          is an answer, because it shows the approximation was controlled.
      - part: Saying it on new estimates
        ask: >
          Someone estimates $\ln(1.2) \approx 0.2 - 0.2^{2}/2 = 0.18$. What
          error bar goes with it, the first dropped term $x^{3}/3$?
        expects: "0.00267"
        tolerance: 0.00002
        hint: >
          $0.2^{3} = 0.008$.
        feedback: >
          $0.008/3 = 0.00267$, positive, so $0.18$ is low. The exact value is
          $0.18232$, a miss of $0.00232$; the rest is the next term,
          $-x^{4}/4 = -0.0004$.
      - ask: >
          How should that estimate be reported?
        choices:
          - text: >
              $0.18000$.
            feedback: >
              Five decimals claim accuracy to $0.00001$ when the dropped term
              is $0.003$. That is false precision, and a listener who spots it
              discounts every other number you give.
          - text: >
              About $0.18$, give or take; it could be off either way.
            feedback: >
              The sign of the dropped term is known: $+x^{3}/3$. Saying "either
              way" throws away half of what you computed.
          - text: >
              About $0.18$, low by roughly $0.003$.
            correct: true
            feedback: >
              Size and sign, at the precision the bar supports. Whoever hears
              it can shade the number up to about $0.183$ if they need to.
        feedback: >
          Quote no more digits than the dropped term allows, and always say
          which way the estimate leans.
      - ask: >
          A product of two estimates: $e^{0.1} \approx 1.1$, dropping $0.005$,
          and $\cos(0.2) \approx 0.98$, dropping about $0.00007$. So
          $e^{0.1}\cos(0.2) \approx 1.078$. Roughly what error bar should go
          with $1.078$?
        expects: "0.005"
        tolerance: 0.0006
        hint: >
          Which of the two dropped terms is larger, and what is it multiplied
          by in the product?
        feedback: >
          The $e^{0.1}$ term dominates: $0.98 \times 0.005 = 0.0049$, and the
          cosine's $0.00007$ is lost in it. The exact product is $1.08314$, a
          miss of $0.0051$. In a chain, name the largest dropped term; a sum
          of every small one adds work and no honesty.
      - part: When the next term is not the error
        ask: >
          Someone estimates $\ln 2$ from $\ln(1+x)$ at $x = 1$ with two terms,
          $1 - 1/2 = 0.5$, and quotes an error of about $1/3$, the next term.
          The exact value is $0.693$. What is the honest report?
        choices:
          - text: >
              "$0.5$, low by about $0.33$": the next term is the error, as
              always.
            feedback: >
              The true miss is $0.193$, barely half of $0.33$. The terms
              $1/3$, $1/4$, $1/5$, $\dots$ shrink slowly and alternate, so the
              first one does not carry the tail.
          - text: >
              "Somewhere between $0.5$ and $0.83$": with alternating terms that
              shrink, the next term bounds the error but does not estimate it.
            correct: true
            feedback: >
              For an alternating series with shrinking terms, the truth lies
              between consecutive partial sums, $0.5$ and $0.833$. That is a
              true statement; "about $0.33$" is not. Better still, pick a
              smaller $x$.
          - text: >
              "$0.5$, exact to one decimal": two terms is enough for that.
            feedback: >
              $0.693$ rounds to $0.7$, not $0.5$. Two terms at $x = 1$ do not
              even get the first decimal.
        feedback: >
          The habit still holds — say what you dropped — but "the error is the
          first dropped term" only reads as an estimate when the terms shrink
          fast. When they do not, state a bound and say so.
      - teach: >
          Said aloud: "About $0.939$, low by roughly six ten-thousandths —
          that is the $x^{4}$ term I dropped." The estimate, the size, the
          direction, and where they came from.
