unit: quant-tools.optimization
opening: >
  Optimization is where the tree's calculus and linear-algebra spines get put
  to work: "find the best portfolio," "minimize the variance," "maximize the
  stake" are all convex optimization problems underneath the finance dressing.
  This unit builds the machinery in the order you apply it — what convexity is
  and why it turns "check every point" into "check one," first- and
  second-order conditions for finding candidates, the closed-form quadratic
  minimization behind least squares and portfolio variance, Lagrange
  multipliers and their KKT extension for constrained problems, and the
  flat-optimum intuition that explains both why rounding a hedge ratio is safe
  and why optimizers fed noisy inputs are not. Kelly's criterion, Markowitz
  portfolio choice and OLS regression, treated elsewhere in the tree, are
  direct applications of what gets built here.
lessons:
  - node: quant-tools.optimization.convex-set
    hook: >
      Before "convex function" means anything, the set you're optimizing over
      has to have the right shape — and recognizing that shape instantly, from
      a list of budget and no-short constraints, is what lets you skip
      worrying about local traps later.
    explanation: >
      The segment test is the right definition because it's exactly the
      property that rules out dents, holes, and separate pieces: if two points
      are feasible, every blend of them must be too. That single local rule
      has a global consequence worth internalizing — any intersection of
      convex sets is convex, because a segment joining two points of the
      intersection lies in each set separately (each is convex) and hence in
      their overlap. This is why a real feasible region — a budget equality, a
      handful of no-short inequalities, a leverage cap — is convex automatically:
      it's built as an intersection of halfspaces and hyperplanes, each
      individually convex, without you ever having to check the segment
      condition by hand.

      Unions break this instantly, which is the trap worth naming: "invest
      long-only in tech OR short-only in energy" describes two convex pieces
      whose union is not convex, since a blend of a point from each need not
      satisfy either sub-strategy's constraints. Equality constraints that
      aren't linear fail the same way — the unit sphere is not convex, since
      the midpoint of two points on it sits strictly inside.
    worked: >
      Take the capped long-only set $\{(w_1,w_2) : w_1+w_2=1,\;0\le w_1\le
      0.6,\;w_2\ge 0\}$, an intersection of one hyperplane and three
      halfspaces. Two feasible extreme points are $(0.6, 0.4)$ and $(0, 1)$;
      their midpoint is $(0.3, 0.7)$, which satisfies $0.3+0.7=1$,
      $0\le 0.3\le 0.6$, and $0.7\ge 0$ — every constraint holds, and the same
      check goes through for any blend $t(0.6,0.4)+(1-t)(0,1)$, $t\in[0,1]$,
      confirming the set is convex.
    interview: >
      "Is this feasible region convex?" is usually answered fastest by
      recognizing it as an intersection of halfspaces, hyperplanes and norm
      balls rather than grinding through the segment definition — the
      interviewer wants to see that recognition, not the algebra.
    pitfalls: >
      Reading "OR" in a strategy description as a hint that the union of two
      convex pieces stays convex — it doesn't. Missing that a nonlinear
      equality constraint (a fixed-volatility target $w'\Sigma w = \sigma^2$,
      say) carves out a non-convex surface even though each side individually
      looks harmless.
    recap: >
      A set is convex exactly when it contains every segment between its own
      points, and any intersection of convex constraints inherits this for
      free.
    dialogue:
      - part: Two approved books and a merger
        teach: >
          A risk desk approves a two-asset book $(w_1, w_2)$ under rule Q: the
          book must be all-long ($w_1 \ge 0$ and $w_2 \ge 0$) or all-short
          ($w_1 \le 0$ and $w_2 \le 0$). Two traders hold approved books,
          $(2, 0)$ and $(0, -2)$, and propose merging them in proportions $t$
          and $1 - t$, giving the book $t(2, 0) + (1-t)(0, -2)$.
      - ask: >
          For how many values of $t$ in $[0, 1]$ does the merged book pass
          rule Q?
        expects: "2"
        hint: >
          Write the merged book as one pair of numbers in terms of $t$, then
          ask when both entries share a sign.
        feedback: >
          The merged book is $(2t, 2t - 2)$. For $0 < t < 1$ the first entry
          is positive and the second negative, so the book is neither all-long
          nor all-short. Only $t = 0$ and $t = 1$ pass — the two original
          books. Every genuine blend is rejected.
      - ask: >
          A second desk uses rule P instead: gross exposure
          $|w_1| + |w_2| \le 2$. Both books pass it. What is the gross
          exposure of the merged book at $t = 1/4$?
        expects: "2"
        feedback: >
          At $t = 1/4$ the book is $(0.5, -1.5)$, with gross exposure
          $0.5 + 1.5 = 2$, so it passes. For any $t$ in $[0, 1]$ the gross is
          $2t + (2 - 2t) = 2$: under rule P, every blend of the two approved
          books is approved.
      - reflect: >
          Rule P let every blend of two approved books through; rule Q let
          through only the two books themselves. What property of a rule were
          you really testing, and why would someone searching for the best
          book care about it?
        hint: >
          An optimizer improves a book by moving it a little toward a better
          one.
        answer: >
          Whether the whole segment between two approved points stays
          approved. Rule Q has a gap: the approved region is two separate
          quadrants, and the straight path between a long book and a short
          book leaves it. A search that improves by blending, or by stepping
          from one candidate toward another, can be stranded at the edge of
          such a region; on a region with no gaps it never is.

      - part: The segment test, named
        teach: >
          A set $C \subseteq \mathbb{R}^{n}$ is convex if
          $tx + (1-t)y \in C$ for every $x, y \in C$ and every $t \in [0, 1]$:
          the segment joining two points of the set never leaves it. Rule P
          carves out a convex set. Rule Q is the union of two convex
          quadrants, and you have just watched the pair $(2, 0)$, $(0, -2)$
          witness that it is not convex — one failing pair is all a
          non-convexity proof needs.
      - ask: >
          Rule R fixes the risk exactly: with two uncorrelated unit-variance
          assets, the book must have variance $w_1^{2} + w_2^{2} = 4$. Both
          books pass. What is $w_1^{2} + w_2^{2}$ at their midpoint?
        expects: "2"
        feedback: >
          The midpoint is $(1, -1)$, and $1 + 1 = 2 \ne 4$. The midpoint has
          fallen inside the circle, so rule R is not convex. A risk target
          written as an equation is a curved surface, and curved surfaces fail
          the segment test.
      - ask: >
          Rule R' relaxes it to a cap: $w_1^{2} + w_2^{2} \le 4$. Is the set
          it allows convex?
        choices:
          - text: >
              No: the constraint is nonlinear, and nonlinear constraints break
              convexity.
            feedback: >
              Some do and some do not. Rule R' is the disk of radius $2$, and
              a disk passes the segment test: by the triangle inequality
              $\lVert tx + (1-t)y\rVert \le t\lVert x\rVert + (1-t)\lVert y\rVert
              \le 2$.
          - text: >
              Yes: it is a disk, and a blend of two points of the disk stays
              within distance $2$ of the origin.
            correct: true
            feedback: >
              Right. The midpoint $(1, -1)$ that broke rule R sits comfortably
              inside rule R'. Filling in the circle is what repaired it.
          - text: >
              No: the midpoint computed for rule R already shows it fails.
            feedback: >
              That midpoint had $w_1^{2} + w_2^{2} = 2$, which is at most $4$.
              It failed "exactly $4$" and passes "at most $4$".
          - text: >
              Only on blends of books in the same quadrant.
            feedback: >
              The pair $(2, 0)$ and $(0, -2)$ lies in different quadrants and
              its midpoint still passes. The disk has no quadrant structure to
              respect.
        feedback: >
          Balls $\{x : \lVert x - a\rVert \le r\}$ are convex; their boundary
          spheres are not. The inequality keeps the inside, and the inside is
          what blends land in.

      - part: Constraints stacked on top of each other
        teach: >
          A real mandate for three assets: budget $w_1 + w_2 + w_3 = 1$,
          long-only $w_1, w_2, w_3 \ge 0$, and a concentration cap
          $w_1 \le 0.5$. That is five constraints. Each one alone is a
          hyperplane or a halfspace, and each of those is convex.
      - reflect: >
          Without checking a single segment, why must the set of books that
          satisfy all five constraints at once be convex?
        hint: >
          Take two books that satisfy all five, and look at one constraint at
          a time.
        answer: >
          Take $x$ and $y$ satisfying all five. For each constraint
          separately, the segment from $x$ to $y$ stays inside that
          constraint's set, because the set is convex. So every point of the
          segment satisfies the first constraint, and the second, and all the
          rest: it lies in the intersection. Any intersection of convex sets
          is convex, which is why a feasible region written as linear
          equalities and inequalities is convex automatically.
      - ask: >
          Rule Q was also built from convex pieces — two quadrants. Why did
          the argument you just gave not save it?
        choices:
          - text: >
              Quadrants are not convex.
            feedback: >
              Each quadrant is an intersection of two halfspaces, so each is
              convex. The pieces were fine.
          - text: >
              Q joins its pieces with "or", so a blend need only satisfy one
              piece at each end, not the same piece throughout.
            correct: true
            feedback: >
              Right. The argument needs $x$ and $y$ in the same convex set;
              with "or", $(2, 0)$ is in one quadrant and $(0, -2)$ in the
              other, and neither quadrant contains the segment.
          - text: >
              The argument only works in three or more dimensions.
            feedback: >
              Dimension plays no part. The argument fails in two dimensions
              for rule Q and works in two dimensions for rule P.
        feedback: >
          "And" between convex constraints is intersection and keeps
          convexity; "or" is union and usually destroys it. When a strategy
          description says "either ... or", check it.

      - part: The mandate that fails one clause
        ask: >
          Which three-asset mandate, each with budget $w_1 + w_2 + w_3 = 1$, is
          *not* convex?
        choices:
          - text: >
              Long-only, with $w_1 - w_2 \le 0.2$.
            feedback: >
              $w_1 - w_2 \le 0.2$ is a halfspace, so this is an intersection
              of a hyperplane and four halfspaces. Convex.
          - text: >
              Gross exposure $|w_1| + |w_2| + |w_3| \le 1.5$.
            feedback: >
              The gross cap is a ball in the $|\cdot|$-sum norm, and the
              budget is a hyperplane. Their intersection is convex.
          - text: >
              Long-only, holding at most one asset with a nonzero weight.
            correct: true
            feedback: >
              $(1, 0, 0)$ and $(0, 1, 0)$ are both allowed, and their midpoint
              $(0.5, 0.5, 0)$ holds two names. A cardinality limit is a union
              of three separate pieces, which is rule Q in a new costume.
          - text: >
              Long-only, with $w_1^{2} + w_2^{2} + w_3^{2} \le 0.5$.
            feedback: >
              The variance cap is a ball, the rest are a hyperplane and
              halfspaces; the intersection is convex. Compare rule R', not
              rule R.
        feedback: >
          In an interview, say it in one breath for each case: "hyperplane
          intersected with halfspaces and a ball, so convex", or "here are two
          feasible points whose midpoint is infeasible, so not convex". The
          first is a recognition, the second a single counterexample.

  - node: quant-tools.optimization.convexity
    hook: >
      This is the one structural assumption that turns "search for the best
      point" into "solve an equation" — everything downstream in the unit
      exists to exploit it.
    explanation: >
      Picture the graph of $f$ as a bowl: the chord condition
      $f(tx+(1-t)y) \le tf(x)+(1-t)f(y)$ says the straight line between any two
      points on the graph never dips below it, which is exactly "no dents." The
      epigraph reformulation — $\{(x,s): s\ge f(x)\}$ is a convex set — connects
      this directly back to convex sets: a convex function is nothing but a
      function whose "above the graph" region has the segment property.

      The derivative tests are the practical payoff. In one variable, $f''\ge0$
      throughout an interval is equivalent to convexity there; in several
      variables, the Hessian being positive semidefinite everywhere plays the
      same role. The first-order form $f(y) \ge f(x) + \nabla f(x)'(y-x)$ says
      every tangent line sits below the curve — this single inequality is what
      later makes a zero gradient enough to certify a global minimum.

      Domain matters as much as the function: $1/x$ is convex on $(0,\infty)$
      but the test simply doesn't apply once you leave that convex domain, since
      the chord condition needs both endpoints in a convex set to begin with.
    worked: >
      Check $g(x) = \ln(1+e^{x})$ (the softplus function) for convexity on
      $\mathbb{R}$. Its derivative is the logistic function
      $g'(x) = e^{x}/(1+e^{x})$, and differentiating again gives
      $g''(x) = e^{x}/(1+e^{x})^{2} \ge 0$ for every real $x$, so $g$ is convex
      everywhere — for instance $g''(0) = 1/4 > 0$.
    interview: >
      "Prove this function is convex" almost always wants the second-derivative
      or Hessian-PSD test applied directly, not the two-point chord definition —
      save the chord version for when differentiability itself is in question.
    pitfalls: >
      Forgetting the domain has to be convex before the derivative test is
      even valid — $f''\ge 0$ on a non-convex domain proves nothing about
      chords that leave the domain. Flipping the inequality direction and
      calling a concave function convex, especially with $-\ln x$ and $\ln x$
      side by side.
    recap: >
      Convex means every chord lies on or above the graph, tested in practice
      by $f''\ge0$ or a positive semidefinite Hessian.
    dialogue:
      - part: Two trading days, smoothed
        teach: >
          Your execution cost for trading $x$ lots in a day is $c(x) = x^{2}$.
          On Monday you traded $2$ lots and on Tuesday $6$, so the two days
          cost $4$ and $36$, an average of $20$ a day.
      - ask: >
          Had you traded the average, $4$ lots, on each day instead, what
          would each day have cost?
        expects: "16"
        feedback: >
          $c(4) = 16$, against an actual average of $(4 + 36)/2 = 20$.
          Smoothing the same $8$ lots across the two days saved $4$ a day.
      - ask: >
          A second desk pays $c(x) = 10\sqrt{x}$ — a large fixed charge per
          day that grows slowly with size. Same days, $2$ lots then $6$. What
          does smoothing to $4$ and $4$ do for this desk?
        choices:
          - text: >
              It saves money, as it did for the first desk: averaging
              always helps.
            feedback: >
              Smoothing costs $10\sqrt{4} = 20$ a day, while the actual days
              cost $(10\sqrt{2} + 10\sqrt{6})/2 \approx (14.14 + 24.49)/2
              \approx 19.32$. Averaging made it worse.
          - text: >
              It costs more: about $20$ a day against about $19.32$.
            correct: true
            feedback: >
              Right. For this curve the cost at the average lies *above* the
              average of the costs. Lumpy trading is cheaper when the curve
              bends the other way.
          - text: >
              Nothing changes: the desk trades $8$ lots either way.
            feedback: >
              The total size is the same, but the cost is not linear in size,
              so how the $8$ lots are split matters: $20$ against about
              $19.32$ a day.
        feedback: >
          The same move — replace two days by their average — helped one desk
          and hurt the other. What decides it is the shape of the cost curve.
      - reflect: >
          Picture the graph of $c$. For the first desk, smoothing helped for
          this pair of days. What would have to be true of the graph for
          smoothing never to hurt — for every pair of days and every split,
          $t$ of one day's size and $1 - t$ of the other's?
        hint: >
          Mark the two days as points on the graph and join them with a
          straight line. Where does the average of the costs sit?
        answer: >
          The average of the two costs is a point on the straight segment
          (the chord) joining $(x, c(x))$ to $(y, c(y))$; the cost of the
          average is the graph directly below or above it. Smoothing never
          hurts exactly when every chord lies on or above the graph:
          $c(tx + (1-t)y) \le t\,c(x) + (1-t)\,c(y)$ for all $x$, $y$ and all
          $t$ in $[0, 1]$. For $10\sqrt{x}$ the chords lie below.

      - part: Chords above the graph
        teach: >
          That inequality is the definition. A function $f$ on a convex set
          $C$ is convex if $f(tx + (1-t)y) \le t f(x) + (1-t) f(y)$ for all
          $x, y \in C$ and $t \in [0, 1]$, and concave if $-f$ is convex. The
          domain must be convex so that $tx + (1-t)y$ is somewhere $f$ is
          defined. Equivalently, the region on or above the graph — the
          epigraph $\{(x, s) : s \ge f(x)\}$ — is a convex set.
      - ask: >
          Take $f(x) = x^{2}$, $x = 0$, $y = 10$ and $t = 0.3$. How far does
          the chord sit above the graph at the blended point?
        expects: "21"
        hint: >
          The blended point is $0.3 \cdot 0 + 0.7 \cdot 10$.
        feedback: >
          The blended point is $7$, where the graph is $49$ and the chord is
          $0.3 \cdot 0 + 0.7 \cdot 100 = 70$, so the gap is $21$. In general
          the gap for $x^{2}$ is exactly $t(1-t)(x - y)^{2}$, here
          $0.21 \cdot 100 = 21$, and it is never negative — which is the
          whole proof that $x^{2}$ is convex.
      - ask: >
          You cannot check every pair and every $t$ by hand. For a
          twice-differentiable $f$ on an interval, which single check
          settles convexity?
        choices:
          - text: >
              $f'(x) \ge 0$ throughout: the function never decreases.
            feedback: >
              That is monotonicity, a different property. $e^{-x}$ decreases
              everywhere and is convex; $\sqrt{x}$ increases and is concave.
          - text: >
              $f(x) \ge 0$ throughout.
            feedback: >
              Height says nothing about bending. $10\sqrt{x}$ is positive and
              concave; $x^{2} - 100$ dips negative and is convex.
          - text: >
              $f''(x) \ge 0$ throughout: the slope never decreases.
            correct: true
            feedback: >
              Right. A slope that only rises is a graph that only bends
              upward, so no chord can pass beneath it. $x^{2}$ has $f'' = 2$;
              $10\sqrt{x}$ has $f''(x) = -2.5\,x^{-3/2} < 0$.
        feedback: >
          In one variable, convex on an interval $\iff f'' \ge 0$ there. In
          $\mathbb{R}^{n}$ the second derivative is the Hessian, and the test
          becomes: the Hessian is positive semidefinite at every point.
      - ask: >
          Which of these is convex on all of $\mathbb{R}^{2}$?
        choices:
          - text: >
              $x^{2} - 3xy + y^{2}$
            feedback: >
              The Hessian has rows $(2, -3)$ and $(-3, 2)$, with determinant
              $4 - 9 = -5 < 0$, so it has a negative eigenvalue. Along the
              line $y = x$ the function is $-x^{2}$, which bends down.
          - text: >
              $xy$
            feedback: >
              The Hessian has rows $(0, 1)$ and $(1, 0)$, eigenvalues $1$ and
              $-1$. Along $y = -x$ the function is $-x^{2}$.
          - text: >
              $x^{2} + xy + y^{2}$
            correct: true
            feedback: >
              The Hessian has rows $(2, 1)$ and $(1, 2)$, eigenvalues $1$ and
              $3$, positive semidefinite everywhere. Two positive diagonal
              entries were not enough for the first option; the cross term has
              to be small enough too.
        feedback: >
          A positive diagonal is necessary and nowhere near sufficient: the
          cross term can tilt the bowl into a saddle. Check the whole
          Hessian.

      - part: Tangents below, and a domain with a hole
        ask: >
          The tangent line to $e^{x}$ at $x = 0$ is $1 + x$. What does the
          tangent predict at $x = 2$?
        expects: "3"
        feedback: >
          $1 + 2 = 3$, while $e^{2} \approx 7.39$. The tangent sits below.
          For any convex differentiable $f$ this holds at every point and in
          every direction: $f(y) \ge f(x) + \nabla f(x)'(y - x)$. That
          first-order form is what will later make a zero gradient enough to
          certify a global minimum.
      - ask: >
          $f(x) = 1/x^{2}$ is defined for $x \ne 0$, and $f''(x) = 6/x^{4} > 0$
          at every point where it is defined. Is $f$ convex on its domain?
        choices:
          - text: >
              Yes: $f'' > 0$ everywhere it is defined.
            feedback: >
              The derivative test needs an interval. Take $x = -1$ and
              $y = 2$: the midpoint $0.5$ has $f = 4$, while the chord gives
              $(1 + 0.25)/2 = 0.625$. The graph rises far above the chord.
          - text: >
              Yes on each half-line, so yes on the whole domain.
            feedback: >
              Convex on $(-\infty, 0)$ and on $(0, \infty)$ separately, but a
              chord from one half to the other crosses the pole at $0$; at
              the midpoint of $-1$ and $2$ the graph is at $4$ and the chord
              at $0.625$.
          - text: >
              No: the domain is not a convex set, so the definition does not
              even apply, and chords across $0$ fail.
            correct: true
            feedback: >
              Right. $\{x : x \ne 0\}$ is not convex, and the chord from $-1$
              to $2$ shows what goes wrong: at $0.5$ the graph is at $4$, far
              above the chord at $0.625$.
        feedback: >
          Exactly one clause failed: the domain. $f'' \ge 0$ certifies
          convexity only on an interval, or in $\mathbb{R}^{n}$ only on a
          convex set — which is why convex sets came first.

  - node: quant-tools.optimization.convex-operations
    hook: >
      This is how you certify an objective is convex in ten seconds flat during
      an interview, instead of computing a Hessian under time pressure.
    explanation: >
      Each rule follows straight from the epigraph picture. A nonnegative
      combination $af+bg$ stays convex because its epigraph is built from
      convex pieces glued additively. The pointwise maximum of convex functions
      is convex because the epigraph of $\max_i f_i$ is exactly the
      intersection $\bigcap_i \{(x,s): s\ge f_i(x)\}$ of convex epigraphs, and
      intersections of convex sets are convex — the pointwise minimum has no
      such argument, since a union of epigraphs replaces the intersection and
      unions aren't convex.

      Affine substitution $x \mapsto f(Ax+b)$ preserves convexity because a
      segment in the new variable maps to a segment in $Ax+b$, so the chord test
      transfers unchanged. Composing with a monotone convex outer function
      works because you're stacking two "bowl" curvatures that reinforce each
      other; drop monotonicity and they can cancel, which is why $-x^{2}$
      (convex $h(u)=-u$ applied to convex $f(x)=x^2$, but $h$ is decreasing) is
      concave, not convex.
    worked: >
      Certify $f(x) = \max(x^{2}, (x-3)^{2}) + |x-1|$ is convex on
      $\mathbb{R}$: $x^2$ and $(x-3)^2$ are convex, so their pointwise max is
      convex; $|x-1|$ is $|\cdot|$ composed with the affine map $x \mapsto x-1$,
      also convex; the sum of two convex pieces is convex. No Hessian needed,
      and e.g. $f(2) = \max(4,1) + 1 = 5$.
    interview: >
      Expect objectives built as sums of squares, norm penalties, and
      worst-case terms like $\max_i f_i(x)$ — naming which rule certifies each
      piece is faster and more convincing than offering to compute a Hessian.
    pitfalls: >
      Applying the max rule to a minimum — $\min_i f_i(x)$ of convex pieces is
      generally not convex. Composing with a convex but decreasing outer
      function and assuming convexity survives anyway.
    recap: >
      Nonnegative sums, pointwise maxima, affine substitutions, and monotone
      convex compositions all preserve convexity — enough to certify most
      objectives by inspection.
    dialogue:
      - part: A worst case with no second derivative
        teach: >
          A position of size $w$ loses $2w - 1$ in a rates-up scenario,
          $3 - w$ in a rates-down scenario and $w/2$ in a flat one. Risk
          wants the worst case, $L(w) = \max(2w - 1,\ 3 - w,\ w/2)$. At
          $w = 1$ the worst case is $2$; at $w = 3$ it is $5$.
      - ask: >
          What is $L(2)$?
        expects: "3"
        feedback: >
          $\max(3, 1, 1) = 3$. The chord between $(1, 2)$ and $(3, 5)$ is at
          $(2 + 5)/2 = 3.5$ above $w = 2$, so the chord passes above the graph
          here — consistent with $L$ being convex, though one point proves
          nothing.
      - ask: >
          You want to certify that $L$ is convex. Why does the second
          derivative test not settle it?
        choices:
          - text: >
              It does: each piece is a line with second derivative $0 \ge 0$,
              so $L'' \ge 0$ wherever it exists.
            feedback: >
              The same reasoning would certify $\min(2w - 1,\ 3 - w)$, which
              is a tent: at $w = 4/3$ it is $5/3$, but at $w = 0$ and $w = 3$
              it is $-1$ and $0$, so the graph rises above its chord. What
              matters is what happens at the kinks.
          - text: >
              $L$ has kinks where the pieces cross, and at a kink $L''$ does
              not exist.
            correct: true
            feedback: >
              Right. The pieces cross at $w = 4/3$ and elsewhere, and the
              whole question of convexity lives at those corners. You need an
              argument that does not differentiate.
          - text: >
              $L$ is linear, so the question does not arise.
            feedback: >
              Each piece is linear; their maximum is not. Its slope jumps from
              $-1$ to $2$ at $w = 4/3$.
        feedback: >
          Worst-case objectives, absolute values and norm penalties all have
          kinks, which is exactly where a Hessian is unavailable. Certifying
          them takes a structural argument.
      - reflect: >
          Each scenario loss is convex, so the region above each graph — its
          epigraph — is a convex set. Describe the epigraph of the worst case
          $L$ in terms of the three, and say what that buys you.
        hint: >
          When is a height $s$ at least $\max(a, b, c)$?
        answer: >
          $s \ge \max_i f_i(w)$ exactly when $s \ge f_i(w)$ for every $i$, so
          the epigraph of $L$ is the intersection of the three epigraphs. An
          intersection of convex sets is convex, so $L$ is convex. Nothing in
          that used linearity or the number three: the pointwise maximum, or
          supremum, of any family of convex functions is convex.

      - part: Four rules, and what each one needs
        teach: >
          That is one of four rules that certify convexity without a single
          derivative. If $f$ and $g$ are convex: $af + bg$ is convex for
          $a, b \ge 0$; the pointwise max (or sup) of convex functions is
          convex; $x \mapsto f(Ax + b)$ is convex for any matrix $A$ and
          vector $b$; and $h(f(x))$ is convex when $h$ is convex *and
          nondecreasing*.
      - ask: >
          A tracking objective in two weights contains the term
          $(w_1 + 2w_2 - 1)^{2}$. Which rule certifies that term convex in
          $(w_1, w_2)$?
        choices:
          - text: >
              The composition rule, with $h(u) = u^{2}$.
            feedback: >
              $h(u) = u^{2}$ is not nondecreasing, so the composition rule
              does not apply as stated. You do not need it: the inside is
              affine.
          - text: >
              Affine substitution: $u^{2}$ is convex, and
              $u = w_1 + 2w_2 - 1$ is affine in the weights.
            correct: true
            feedback: >
              Right. Affine substitution needs no monotonicity at all — a
              segment in $(w_1, w_2)$ maps to a segment in $u$, so the chord
              test transfers unchanged.
          - text: >
              The sum rule, since it expands into a sum of terms.
            feedback: >
              It expands to
              $w_1^{2} + 4w_1w_2 + 4w_2^{2} - 2w_1 - 4w_2 + 1$, and
              $4w_1w_2$ is not convex on its own. The sum rule needs every
              piece convex.
        feedback: >
          Read the structure, not the expansion: a convex function of an
          affine expression is convex, and expanding first only hides it.
      - ask: >
          The sum rule needs $a, b \ge 0$. Take $h(x) = x^{2} - k(x - 2)^{2}$.
          What is the largest $k$ for which $h$ is still convex?
        expects: "1"
        hint: >
          Compute $h''$.
        feedback: >
          $h''(x) = 2 - 2k$, which is nonnegative exactly when $k \le 1$. At
          $k = 1$ the curvatures cancel and $h(x) = 4x - 4$ is a line. So a
          negative coefficient *can* leave a convex function — but no rule
          can promise it without measuring how much curvature is left.

      - part: Where the rules stop
        ask: >
          Let $f(x) = x^{2} - 1$, which is convex, and $h(u) = u^{2}$, also
          convex. The composite $g(x) = (x^{2} - 1)^{2}$ has $g(-1) = g(1) = 0$.
          What is $g(0)$?
        expects: "1"
        feedback: >
          $g(0) = (0 - 1)^{2} = 1$. The midpoint of $-1$ and $1$ sits at
          height $1$, above a chord at height $0$: a convex function of a
          convex function, and not convex.
      - ask: >
          Which hypothesis of the composition rule failed?
        choices:
          - text: >
              $f$ is not convex.
            feedback: >
              $f(x) = x^{2} - 1$ has $f'' = 2 > 0$. The inside is fine.
          - text: >
              Compositions never preserve convexity.
            feedback: >
              $e^{x^{2}}$ is $e^{u}$, convex and increasing, applied to
              $x^{2}$, and it is convex. The rule works when its hypothesis
              holds.
          - text: >
              $h(u) = u^{2}$ is not nondecreasing on the values $f$ takes.
            correct: true
            feedback: >
              Right. $f$ takes values in $[-1, \infty)$, and on $[-1, 0]$
              $h$ decreases. As $x$ moves from $0$ to $1$, $f$ climbs toward
              $0$ and $h$ turns that climb into a fall — the outer bend undoes
              the inner one.
        feedback: >
          A nondecreasing outer function turns the inner function's bowl into
          a bowl; a decreasing stretch turns it upside down. The statement's
          $h(u) = -u$ with $f = x^{2}$ is the extreme case.
      - ask: >
          A desk can hedge with either of two instruments and takes the
          cheaper: its cost is $C(x) = \min((x - 1)^{2},\ (x + 3)^{2})$. A
          colleague certifies $C$ convex "by the max rule, applied to a min".
          What do you say?
        choices:
          - text: >
              Fine: min and max are symmetric, so the rule carries over.
            feedback: >
              $C(1) = 0$ and $C(-3) = 0$, but at their midpoint $C(-1) = 4$.
              The graph is a double well, above its chord.
          - text: >
              Not convex: the epigraph of a min is a *union* of epigraphs, and
              $C(-1) = 4$ sits above the chord from $C(-3) = 0$ to $C(1) = 0$.
            correct: true
            feedback: >
              Right. $s \ge \min$ means $s$ clears at least one piece, which
              is a union, and unions of convex sets are not convex.
          - text: >
              Convex, because each of the two pieces is convex.
            feedback: >
              Convex pieces are not enough; the combining operation must
              preserve convexity. Min does not: $C(-1) = 4$ while
              $C(-3) = C(1) = 0$.
        feedback: >
          Max intersects epigraphs, min unites them. The cheaper-of-two
          objective is the typical source of a non-convex problem in
          disguise.
      - teach: >
          In an interview, certify out loud, term by term: "a sum of squares
          of affine expressions, convex by affine substitution; plus a
          nonnegative multiple of a norm; plus a worst case over scenarios,
          convex by the max rule — so the objective is convex." It is faster
          than a Hessian and works at kinks, where a Hessian does not.

  - node: quant-tools.optimization.strict-convexity
    hook: >
      "The minimizer is unique" and "a minimizer exists" are two separate
      claims, and strict convexity only ever buys you the first one.
    explanation: >
      The uniqueness argument is a short contradiction: if $x\ne y$ were both
      minimizers with value $m$, the midpoint would satisfy
      $f(\tfrac{x+y}{2}) < \tfrac{1}{2} f(x) + \tfrac{1}{2} f(y) = m$ by strict
      convexity, undercutting the supposed minimum. So at most one point can
      achieve it. $f''>0$ (or a positive definite Hessian) is a convenient
      sufficient test for strict convexity, but it's not necessary — $x^{4}$ is
      strictly convex on $\mathbb{R}$ even though $f''(0)=0$, so failing this
      test doesn't rule strict convexity out.

      Existence is a wholly separate question that strict convexity says
      nothing about: $e^{x}$ is strictly convex on all of $\mathbb{R}$ and has
      no minimizer at all, since it keeps decreasing toward $0$ without ever
      reaching it. You need either a closed, bounded domain or coercivity
      ($f(x)\to\infty$ as $\lVert x\rVert\to\infty$) to know a minimizer is
      there before asking whether it's unique.
    worked: >
      Minimize $f(x) = x^{2} - \ln x$ on $(0,\infty)$. $f''(x) = 2 + 1/x^{2} >
      0$ everywhere, so $f$ is strictly convex; as $x\to0^{+}$ or $x\to\infty$,
      $f(x)\to\infty$, so a minimizer exists. Setting
      $f'(x) = 2x - 1/x = 0$ gives $x^{*} = 1/\sqrt{2}$, with value
      $f(x^{*}) = \tfrac{1}{2} + \tfrac{1}{2}\ln 2 \approx 0.847$.
    interview: >
      "Does this problem have a unique solution?" and "does a solution exist
      at all?" are two questions an interviewer expects you to separate —
      answering only the uniqueness half is a common half-answer.
    pitfalls: >
      Citing strict convexity as a reason a minimizer must exist — it isn't
      one. Concluding non-strict (only semidefinite) convexity rules out
      uniqueness — it doesn't force multiple minimizers, it just fails to
      forbid them.
    recap: >
      Strict convexity guarantees at most one minimizer; existence is a
      separate argument via a bounded domain or coercivity.
    dialogue:
      - part: A cost curve with a flat bottom
        teach: >
          A hedge ratio $h$ must serve two books, one of which wants $h = 1$
          and the other $h = 3$, and each charges you the distance from what
          it wants. Your cost is $c(h) = |h - 1| + |h - 3|$, a sum of two
          convex functions, so convex.
      - ask: >
          What is $c(1.5)$?
        expects: "2"
        feedback: >
          $|1.5 - 1| + |1.5 - 3| = 0.5 + 1.5 = 2$. Try $h = 2.7$ and you get
          $1.7 + 0.3 = 2$ again.
      - ask: >
          How many hedge ratios minimize $c$?
        choices:
          - text: >
              One, $h = 2$, by symmetry.
            feedback: >
              $c(2) = 2$, but so do $c(1.5)$ and $c(2.7)$. Symmetry tells you
              $2$ is *a* minimizer, not that it is the only one.
          - text: >
              Two, the kinks at $h = 1$ and $h = 3$.
            feedback: >
              Both give $c = 2$, and so does every point between them. Between
              the kinks, moving right adds to one distance exactly what it
              takes from the other.
          - text: >
              Every $h$ in $[1, 3]$, all with cost $2$.
            correct: true
            feedback: >
              Right. On $[1, 3]$ the cost is $(h - 1) + (3 - h) = 2$, flat;
              outside it the cost rises. A whole interval of minimizers.
          - text: >
              None: convex functions with kinks have no minimum.
            feedback: >
              $c$ is never below $2$ and reaches $2$, so it has a minimum. It
              just reaches it in many places.
        feedback: >
          Convexity allowed a flat bottom. For a desk that wants one answer to
          quote, that is a problem: which $h$ is "the" hedge?
      - reflect: >
          Suppose $x \ne y$ both attain the minimum value $m$ of a convex $f$.
          What does the chord inequality say about the midpoint, and what
          small strengthening of it would turn that into a contradiction?
        hint: >
          The chord between two points at height $m$ is flat at height $m$.
        answer: >
          The chord inequality gives $f((x + y)/2) \le \tfrac{1}{2}m +
          \tfrac{1}{2}m = m$, and since $m$ is the minimum the midpoint is
          also a minimizer — that is how the flat bottom happens. If the
          inequality were strict whenever $x \ne y$, the midpoint would give
          $f((x + y)/2) < m$, below the minimum, which is impossible. So a
          strict chord inequality leaves room for at most one minimizer.

      - part: Strict chords allow one bottom
        teach: >
          $f$ is strictly convex if $f(tx + (1-t)y) < t f(x) + (1-t) f(y)$
          whenever $x \ne y$ and $0 < t < 1$: every chord lies strictly above
          the graph between its ends. Then $f$ has at most one minimizer on a
          convex set. Sufficient tests: $f'' > 0$ everywhere in one variable,
          or a positive definite Hessian everywhere in $\mathbb{R}^{n}$. The
          flat stretch of $c$ on $[1, 3]$ is exactly a chord lying on the
          graph.
      - ask: >
          $f(x) = (x - 2)^{2} + 4$ is strictly convex. A colleague reports two
          minimizers, $x = 1$ and $x = 3$, both with value $5$. What is the
          value at their midpoint?
        expects: "4"
        feedback: >
          $f(2) = 0 + 4 = 4 < 5$. The midpoint undercuts the claimed minimum,
          exactly as the argument predicts — so neither report was a
          minimizer. Strict convexity turns any pair of tied candidates into a
          better point between them.
      - ask: >
          $g(x) = |x|^{3}$ has $g''(x) = 6|x|$, which is $0$ at $x = 0$. Is
          $g$ strictly convex?
        choices:
          - text: >
              No: the test $g'' > 0$ fails at $0$.
            feedback: >
              The test is sufficient, not necessary. Failing it at one point
              decides nothing; you have to look again.
          - text: >
              Yes: its slope $g'(x) = 3x|x|$ is strictly increasing, so the
              graph has no straight stretch anywhere.
            correct: true
            feedback: >
              Right. A strictly increasing derivative is enough: a chord could
              only lie on the graph along an interval where the slope is
              constant, and there is no such interval.
          - text: >
              Only on $x \ne 0$, which is not a convex set.
            feedback: >
              The chord inequality is strict for every pair, including pairs
              that straddle $0$: from $-1$ to $1$ the midpoint has $g = 0$
              against a chord at $1$.
        feedback: >
          $f'' > 0$ everywhere is the convenient certificate. A second
          derivative that vanishes at isolated points can still leave $f$
          strictly convex; what kills strictness is a flat stretch, where
          $f''$ is $0$ along an interval.

      - part: At most one, and possibly none
        ask: >
          $f(x) = 1/x$ on $(0, \infty)$ has $f''(x) = 2/x^{3} > 0$, so it is
          strictly convex. What is its infimum over $(0, \infty)$?
        expects: "0"
        feedback: >
          $1/x$ decreases toward $0$ as $x$ grows and never reaches it. The
          infimum is $0$, and there is no minimizer at all. At most one
          minimizer includes zero minimizers.
      - ask: >
          $f$ is strictly convex on all of $\mathbb{R}$. Which extra fact
          guarantees that a minimizer exists?
        choices:
          - text: >
              $f$ is bounded below.
            feedback: >
              $e^{x}$ is strictly convex and bounded below by $0$, and it has
              no minimizer: it keeps decreasing toward $0$ as $x \to -\infty$.
          - text: >
              $f'' > 0$ everywhere.
            feedback: >
              $e^{x}$ again: $f'' = e^{x} > 0$, no minimizer. Curvature is
              about uniqueness, not existence.
          - text: >
              $f(x) \to \infty$ as $|x| \to \infty$.
            correct: true
            feedback: >
              Right — coercivity. Then $f$ exceeds $f(0)$ outside some closed
              interval, the continuous $f$ attains a minimum on that interval,
              and that is the global minimum. Strict convexity then makes it
              the only one.
        feedback: >
          Two separate questions with two separate certificates: existence
          from a closed bounded domain or coercivity, uniqueness from strict
          convexity. An interviewer who asks for "the unique solution" wants
          both.
      - ask: >
          $f(x) = e^{x} + e^{-2x}$ is strictly convex ($f'' = e^{x} + 4e^{-2x}
          > 0$) and coercive, since each term blows up in one direction. So it
          has exactly one minimizer. Where is it, to four decimal places?
        expects: "0.2310"
        tolerance: 0.0005
        hint: >
          Set $f'(x) = e^{x} - 2e^{-2x}$ to zero and multiply through by
          $e^{2x}$.
        feedback: >
          $e^{x} = 2e^{-2x}$ gives $e^{3x} = 2$, so $x^{*} = \tfrac{1}{3}\ln 2
          \approx 0.2310$. Since $f'' > 0$, $f'$ is increasing: negative to
          the left of this root and positive to the right, so the root is the
          minimizer. Coercivity promised it exists and strict convexity that
          it is the only one.

  - node: quant-tools.optimization.stationary-points
    hook: >
      Interviewers say "critical point," "extremum," and "stationary point"
      almost interchangeably, but only one of the three is a definition you can
      check by computation — the other two describe what you find once you
      classify it.
    explanation: >
      A minimizer is a claim about every point of the feasible set (global) or
      just a neighborhood of it (local); a stationary point is a purely local,
      computable condition, $\nabla f(x)=0$, that doesn't by itself say which
      kind of extremum — or whether any extremum at all — you've found. Because
      maximizing $f$ is the same as minimizing $-f$, one vocabulary and one
      theory cover both without duplication.

      In the interior of the domain, a stationary point of a differentiable
      function is one of three things: a local min, a local max, or a saddle,
      where the function increases in some directions from the point and
      decreases in others. Keep the value and the location distinct too —
      $\min_x f(x)$ is a number, $\arg\min_x f(x)$ is the set of points
      achieving it, and that set can be empty, a single point, or infinite.
    worked: >
      $f(x,y) = x^{2} - y^{4}$ has gradient $(2x, -4y^{3})$, zero only at the
      origin. Along the $x$-axis, $f(x,0) = x^{2} \ge 0 = f(0,0)$, so the
      origin looks like a minimum in that direction; along the $y$-axis,
      $f(0,y) = -y^{4} \le 0 = f(0,0)$, so it looks like a maximum in that
      direction. The mixed behavior makes the origin a saddle point, not an
      extremum of either kind.
    interview: >
      "Characterize the critical points" wants you to name all stationary
      points, then say for each whether it's a min, max, or saddle — stopping
      at "the gradient is zero here" answers only half the question.
    pitfalls: >
      Treating every stationary point as an extremum by default — plenty are
      saddles. Reporting the minimum value when asked for the minimizer, or
      vice versa; the two answers are different objects and interviewers listen
      for the mix-up.
    recap: >
      A stationary point is where the gradient vanishes; whether it's a local
      min, local max, or saddle is a separate question the gradient alone
      doesn't answer.
    dialogue:
      - part: A loss curve on a bounded range
        teach: >
          A calibration loss depends on one parameter as
          $f(x) = x^{3} - 12x$, and the parameter is only allowed in
          $[-5, 5]$. Its slope is $f'(x) = 3x^{2} - 12$.
      - ask: >
          At how many points of $[-5, 5]$ is the slope zero?
        expects: "2"
        feedback: >
          $3x^{2} = 12$ gives $x = 2$ and $x = -2$, both inside the range.
      - ask: >
          What is $f(2)$?
        expects: "-16"
        feedback: >
          $8 - 24 = -16$. Nearby points do worse: $f(1.9) \approx -15.94$ and
          $f(2.1) \approx -15.94$. Nothing close to $2$ beats it.
      - ask: >
          Is $x = 2$ where $f$ is smallest on $[-5, 5]$?
        choices:
          - text: >
              Yes: the slope is zero there and every nearby point is higher.
            feedback: >
              Nearby, yes. But $f(-5) = -125 + 60 = -65$, far below $-16$.
              Beating your neighbours is not beating everyone.
          - text: >
              No: $x = -2$ is lower, since it is the other flat point.
            feedback: >
              $f(-2) = -8 + 24 = 16$. The other flat point is a peak, the
              highest point anywhere near it.
          - text: >
              No: $f(-5) = -65$ is lower still.
            correct: true
            feedback: >
              Right. The smallest value on the range sits at the endpoint
              $x = -5$, where the slope is $63$, nowhere near zero.
        feedback: >
          Three different kinds of point have turned up: a flat point that
          beats its neighbours, a flat point that loses to its neighbours,
          and an endpoint that beats everything without being flat at all.
      - reflect: >
          $x = 2$ beats every point near it but loses to $x = -5$. State the
          two claims precisely — what "beats everything" and "beats its
          neighbours" each quantify over.
        answer: >
          "Beats everything" compares $f(x^{*})$ with $f(x)$ for every $x$ in
          the allowed set: $x^{*}$ is a global minimizer. "Beats its
          neighbours" compares only with the $x$ in some small ball around
          $x^{*}$: a local minimizer. $x = 2$ is local and not global;
          $x = -5$ is global, and hence local too.

      - part: Local, global, and where the slope dies
        teach: >
          The names: $x^{*}$ is a global minimizer of $f$ over $S$ if
          $f(x^{*}) \le f(x)$ for every $x \in S$, and a local minimizer if
          that holds for every $x \in S$ within some ball around $x^{*}$. A
          point where $\nabla f(x) = 0$ is stationary, or critical. Maxima are
          the same with the inequality reversed — maximizing $f$ is
          minimizing $-f$. And keep two objects apart: the optimal value
          $\min_x f(x)$, a number, and the argument $\arg\min_x f(x)$, the
          set of points that attain it.
      - ask: >
          An interviewer asks for "the minimizer of $f$ over $[-5, 5]$". Which
          answer is right?
        choices:
          - text: >
              $-65$
            feedback: >
              That is the minimum value, $\min f$. The minimizer is where it
              happens, and an interviewer listening for the distinction will
              note the swap.
          - text: >
              $x = 2$
            feedback: >
              A local minimizer only: $f(2) = -16$ is beaten by $f(-5) = -65$.
          - text: >
              $x = -5$
            correct: true
            feedback: >
              Right: $\arg\min f = \{-5\}$, and the minimum value is $-65$.
              Two answers to two different questions.
        feedback: >
          Say both when in doubt: "the minimum is $-65$, attained at
          $x = -5$."
      - ask: >
          The global *maximizer* of $f$ on $[-5, 5]$ is $x = 5$, with
          $f(5) = 65$. Is it a stationary point?
        choices:
          - text: >
              Yes: every maximizer is a stationary point.
            feedback: >
              $f'(5) = 75 - 12 = 63 \ne 0$. The slope says $f$ would keep
              rising if you could go further, and the range stops you.
          - text: >
              No: $f'(5) = 63$, and the range ends there.
            correct: true
            feedback: >
              Right. Stationarity is a condition on the gradient; being an
              extremum is a comparison of values. At an edge of the allowed
              set the two come apart.
        feedback: >
          The local maximum at $-2$ is stationary; the global maximum at $5$
          is not. Vanishing gradient is something you compute, extremum is
          something you prove, and neither implies the other in general.

      - part: Flat points that are not extrema
        ask: >
          $g(x, y) = xy$ has gradient $(y, x)$, which vanishes only at the
          origin. Along the line $y = x$ the function is $x^{2}$; along
          $y = -x$ it is $-x^{2}$. What is the origin?
        choices:
          - text: >
              A local minimum: along $y = x$ every nearby point is higher.
            feedback: >
              Along $y = -x$ every nearby point is lower. A local minimum must
              beat its neighbours in every direction.
          - text: >
              A saddle: higher in some directions, lower in others.
            correct: true
            feedback: >
              Right. Stationary, and neither a local minimum nor a local
              maximum: points arbitrarily close to the origin lie on both
              sides of $g(0, 0) = 0$.
          - text: >
              Not a stationary point, because $g$ is not a minimum there.
            feedback: >
              Stationary means only that the gradient is zero, and $(y, x)$ is
              $(0, 0)$ at the origin. What kind of stationary point it is
              comes second.
        feedback: >
          In the interior, a stationary point is one of three things: a local
          minimum, a local maximum, or a saddle. The gradient alone cannot
          tell you which.
      - ask: >
          $h(x) = (x - 1)^{2}(x + 3)^{2}$. How many points are in
          $\arg\min_x h(x)$ over $\mathbb{R}$?
        expects: "2"
        feedback: >
          $h \ge 0$ and $h = 0$ exactly at $x = 1$ and $x = -3$, so the
          minimum value is $0$ and $\arg\min h = \{-3, 1\}$. The argmin is a
          set: here two points, for $e^{x}$ on $\mathbb{R}$ the empty set
          (its infimum $0$ is never attained), for a constant function every
          point.

  - node: quant-tools.optimization.local-global
    hook: >
      This is the entire reason a convex optimization problem "counts as
      solved" the moment you find one point with no better neighbor — no
      restarts, no checking other regions.
    explanation: >
      Suppose $x$ is a local minimizer of convex $f$ over convex $C$, but some
      other point $y \in C$ has $f(y) < f(x)$. For small $t>0$, the point
      $x+t(y-x)$ lies in $C$ (convexity of the set) and in any small ball
      around $x$, and convexity of $f$ gives
      $f(x+t(y-x)) \le (1-t)f(x)+tf(y) < f(x)$ — a nearby point strictly
      better than $x$, contradicting local minimality. So no local minimizer
      of a convex function can fail to be global.

      The mental model is the bowl: a bowl-shaped surface cannot have a dip
      that isn't the deepest point, because any lower point elsewhere would
      pull the whole chord down through the supposed local floor. This is what
      licenses gradient descent, coordinate descent, or plain guessing on a
      convex problem — whatever locally-optimal point you land on is the
      answer. It also draws the line sharply: portfolio problems with
      cardinality or integer constraints, and most machine-learning losses,
      are not convex, and a local optimum found there carries no such
      guarantee.
    worked: >
      $f(x,y) = 2x^{2}+y^{2}-4x-6y$ has Hessian $\operatorname{diag}(4,2)$,
      positive definite everywhere, so $f$ is (strictly) convex. Setting
      $\nabla f = (4x-4,\;2y-6) = 0$ gives $x=1$, $y=3$, and
      $f(1,3) = 2-4+9-18 = -11$. Convexity alone certifies $-11$ at $(1,3)$ as
      the global minimum — no other point needs checking.
    interview: >
      "You found a stationary point — how do you know it's the global
      optimum?" is answered by convexity, not by searching further: certify
      the objective is convex first, then stationarity alone finishes the
      problem.
    pitfalls: >
      Carrying "found a local optimum, so I'm done" reasoning into a
      non-convex setting — integer or cardinality-constrained portfolio
      problems and most neural-network losses can have many local optima at
      different values.
    recap: >
      For a convex problem, any local minimizer is automatically the global
      minimizer.
    dialogue:
      - part: A search that stops too soon
        teach: >
          A hedge ratio can be any whole number from $0$ to $6$, and the
          costs, in order, are $5, 3, 4, 6, 2, 1, 3$. A local search starts
          at ratio $0$, moves one step to a neighbour whenever the neighbour
          is cheaper, and stops when neither neighbour is.
      - ask: >
          At which ratio does the search stop?
        expects: "1"
        feedback: >
          From ratio $0$ (cost $5$) it moves to ratio $1$ (cost $3$). There
          the neighbours cost $5$ and $4$, neither cheaper, so it stops — at a
          point no neighbour beats.
      - ask: >
          How much cheaper is the best ratio in the table than the one the
          search reported?
        expects: "2"
        feedback: >
          Ratio $5$ costs $1$, against $3$ at the stopping point: $3 - 1 = 2$.
          The search found a local minimum and the table hides a better one
          behind the hump at ratio $3$, which costs $6$.
      - ask: >
          A second desk's costs over ratios $0$ to $6$ are
          $9, 5, 2, 1, 1, 2, 4$. Run the same search once from ratio $0$ and
          once from ratio $6$. What cost does each run report?
        expects: "1"
        feedback: >
          From $0$: $9 \to 5 \to 2 \to 1$, stopping at ratio $3$. From $6$:
          $4 \to 2 \to 1$, stopping at ratio $4$. Different stopping points,
          the same cost, and it is the cheapest in the table. The successive
          differences $-4, -3, -1, 0, 1, 2$ never decrease — a slope that
          only rises, the discrete picture of a convex function. The first
          table's differences, $-2, 1, 2, -4, -1, 2$, rise and then fall:
          that is the dent the search got stuck in.

      - part: Why a bowl has no traps
        reflect: >
          Let $f$ be convex on a convex set, let $x$ be a point that no nearby
          point beats, and suppose some far-away $y$ has $f(y) < f(x)$. Walk
          from $x$ a tiny step toward $y$. What does convexity say about $f$
          there, and why is that a contradiction?
        hint: >
          The points $x + t(y - x)$ for small $t > 0$ lie on the chord from
          $x$ to $y$.
        answer: >
          For $0 < t \le 1$ the point $x + t(y - x)$ lies in the set, and the
          chord inequality gives $f(x + t(y - x)) \le (1 - t)f(x) + t f(y)$,
          which is strictly below $f(x)$ because $f(y) < f(x)$. Taking $t$
          small puts that point inside any ball around $x$, so a nearby point
          beats $x$ — contradicting local minimality. No such $y$ exists: the
          local minimum is global.
      - teach: >
          That is the theorem. If $f$ is convex on a convex set $C$, every
          local minimizer of $f$ over $C$ is a global minimizer, and the set
          of minimizers is itself convex. It is why convex problems count as
          solved: any procedure that stops at a point no neighbour beats has
          found the answer, wherever it started.
      - ask: >
          A convex $c$ has a claimed local minimum at $h = 1$ with
          $c(1) = 10$, and a colleague finds $c(4) = 7$. What is the most
          $c(1.03)$ can be?
        expects: "9.97"
        hint: >
          $1.03 = 1 + t(4 - 1)$ for $t = 0.01$.
        feedback: >
          With $t = 0.01$, the chord bound gives
          $c(1.03) \le 0.99 \cdot 10 + 0.01 \cdot 7 = 9.97 < 10$. A point
          $0.03$ away already beats $h = 1$, and shrinking $t$ brings such a
          point as close as you like. So either $h = 1$ was never a local
          minimum or $c$ is not convex.

      - part: Which problems carry the guarantee
        ask: >
          Which of these problems has the property that every local
          minimizer is global?
        choices:
          - text: >
              Maximizing a convex function over an interval.
            feedback: >
              Maximizing $f$ is minimizing $-f$, which is concave, not convex.
              $x^{2}$ on $[-1, 2]$ has a local maximum at $x = -1$ (value $1$)
              that is not the global maximum at $x = 2$ (value $4$).
          - text: >
              Minimizing a convex variance over long-only weights that sum to
              $1$.
            correct: true
            feedback: >
              A convex objective over an intersection of a hyperplane and
              halfspaces, which is a convex set. Both hypotheses hold.
          - text: >
              Minimizing a convex variance over weights restricted to whole
              multiples of $10\%$.
            feedback: >
              The objective is convex but the feasible set is a finite grid,
              which is not convex: the segment between two grid points leaves
              it. The proof needs to walk along that segment.
        feedback: >
          Two hypotheses, and both are load-bearing: a convex function, and a
          convex set to minimize it over.
      - ask: >
          On a problem you know is convex, two runs of your optimizer report
          values $4.10$ and $4.37$, each claiming no nearby point is better.
          What do you conclude?
        choices:
          - text: >
              The problem has two local minima; report the smaller.
            feedback: >
              On a convex problem every local minimum is global, so all local
              minima share one value. Two different values cannot both be
              local minima.
          - text: >
              At least the run reporting $4.37$ did not actually stop at a
              local minimum — a stopping rule or tolerance is broken.
            correct: true
            feedback: >
              Right. The theorem turns a disagreement into a diagnosis: the
              runs must agree on the value, so something in the second run is
              wrong.
          - text: >
              The problem was not convex after all.
            feedback: >
              You were told it is convex. Before doubting the mathematics,
              doubt the solver: early stopping and loose tolerances are far
              more common than a mislabelled problem.
        feedback: >
          Minimizers can differ — the second table had two — but on a convex
          problem their values cannot.
      - ask: >
          $f(x) = x^{2}$ is convex. Minimize it over
          $S = [-3, -2] \cup [1, 4]$. The point $x = -2$ beats every point of
          $S$ near it. Is it the global minimizer?
        choices:
          - text: >
              Yes: $f$ is convex, so local means global.
            feedback: >
              $f(-2) = 4$ but $f(1) = 1$. The theorem's second hypothesis
              failed: $S$ is not convex, and the segment from $-2$ toward $1$
              leaves $S$ immediately.
          - text: >
              No: $f(1) = 1 < 4$, and the proof breaks because the segment
              from $-2$ toward $1$ leaves $S$.
            correct: true
            feedback: >
              Right. The proof walks from the local minimizer toward the
              better point; a gap in the set blocks the walk, and the local
              minimum survives as a trap.
          - text: >
              No, because $x = -2$ is not a local minimizer at all.
            feedback: >
              Within $S$, the points near $-2$ are in $[-3, -2]$, where $x^{2}$
              is at least $4$. It is a genuine local minimizer — just not a
              global one.
        feedback: >
          Integer constraints, cardinality limits and either-or rules all
          break the set, and with it the guarantee. In an interview, name
          both hypotheses before you say "local, hence global".

  - node: quant-tools.optimization.foc
    hook: >
      "Differentiate and set to zero" is the reflex; the interview question is
      whether you can also justify why the point you found is actually the
      answer.
    explanation: >
      At an interior local minimizer, $\nabla f(x^{*})=0$ is necessary: if the
      gradient were nonzero, moving a small step in the direction $-\nabla
      f(x^{*})$ would strictly decrease $f$, contradicting local optimality.
      Necessity is all this buys on its own — stationary points that are
      neither minima nor maxima exist in one variable and show up constantly
      in several, so "the derivative is zero" is a candidate list, not a
      verdict.

      Convexity is what promotes the condition to sufficient. Recall the
      tangent-underestimate inequality $f(y) \ge f(x^{*}) + \nabla
      f(x^{*})'(y-x^{*})$ for convex $f$; substituting $\nabla f(x^{*})=0$
      collapses the right side to $f(x^{*})$, so $f(y) \ge f(x^{*})$ for
      every $y$ in the domain — $x^{*}$ is a global minimizer, no further
      search required. The interview recipe is exactly this two-step move:
      differentiate and solve, then justify with convexity (or a second-order
      check) rather than simply asserting the stationary point is the answer.
    worked: >
      Minimize $f(x) = e^{x} - x$ over $\mathbb{R}$. $f'(x) = e^{x}-1=0$ gives
      $x^{*}=0$; $f''(x)=e^{x}>0$ everywhere, so $f$ is convex and $x^{*}=0$
      is the global minimum, with value $f(0) = 1 - 0 = 1$.
    interview: >
      "Minimize this function" wants three moves in sequence: differentiate,
      solve $f'=0$, then state why that point is the minimum — convexity or a
      second-order check — since a bare stationary point convinces no one.
    pitfalls: >
      Stopping after "the derivative is zero" without the justification step.
      Applying $\nabla f=0$ outside its scope: it says nothing at a boundary
      point or at a point where $f$ isn't differentiable, both of which need
      separate handling.
    recap: >
      A zero gradient is necessary at any interior optimum, and sufficient for
      a global minimum exactly when the objective is convex.
    dialogue:
      - part: An order size with two costs
        teach: >
          A desk restocks a hedge in lots of size $q > 0$. Fewer, larger lots
          save on fees and cost more to carry, and per period the total is
          $c(q) = 50/q + 2q$. Its slope is $c'(q) = -50/q^{2} + 2$.
      - ask: >
          At which $q$ is the slope zero?
        expects: "5"
        feedback: >
          $50/q^{2} = 2$ gives $q^{2} = 25$, so $q = 5$ (the negative root is
          outside $q > 0$).
      - ask: >
          What is $c(5)$?
        expects: "20"
        feedback: >
          $50/5 + 2 \cdot 5 = 10 + 10 = 20$. At the flat point the two costs
          balance exactly, which is typical of this kind of trade-off.
      - ask: >
          At $q = 4$ the slope is $c'(4) = -50/16 + 2 = -1.125$. Could $q = 4$
          be a minimizer?
        choices:
          - text: >
              Possibly: you would have to compare $c(4)$ with the other
              values first.
            feedback: >
              No comparison is needed. A negative slope means a small step
              right lowers the cost by about $1.125$ per unit of step:
              $c(4) = 20.5$ and $c(4.1) \approx 20.40$.
          - text: >
              No: a small step to the right lowers the cost, at about $1.125$
              per unit of step.
            correct: true
            feedback: >
              Right: $c(4) = 20.5$ and $c(4.1) \approx 20.40$. A nonzero slope
              at an interior point always points to a better neighbour.
          - text: >
              Only the second derivative can tell.
            feedback: >
              The second derivative decides between kinds of *flat* point. At
              a point with slope $-1.125$ the first derivative has already
              settled it: moving right helps.
        feedback: >
          Wherever the slope is not zero, one direction or the other improves
          — so an interior minimizer can only sit where the slope is zero.
      - reflect: >
          Say why the same holds for $f$ of several variables at an interior
          local minimizer $x^{*}$. If $\nabla f(x^{*}) \ne 0$, which small
          step would you take, and roughly how much would it save?
        hint: >
          To first order, $f(x^{*} + h) \approx f(x^{*}) + \nabla f(x^{*})'h$.
        answer: >
          Step against the gradient: $h = -\varepsilon \nabla f(x^{*})$ for a
          small $\varepsilon > 0$. To first order the change is
          $-\varepsilon \lVert \nabla f(x^{*})\rVert^{2} < 0$, and the point
          is still in the open set because $x^{*}$ is interior. So a nearby
          point is better, contradicting local minimality. At an interior
          local minimizer, or maximizer, the gradient must vanish.

      - part: Necessary, and not more
        teach: >
          The first-order condition: if $f$ is differentiable on an open set
          and $x^{*}$ is a local minimizer or maximizer there, then
          $\nabla f(x^{*}) = 0$. It produces candidates. It does not, by
          itself, certify any of them.
      - ask: >
          $g(x) = (x - 1)^{3} + 1$ has $g'(x) = 3(x - 1)^{2}$, which is zero
          at $x = 1$. What is $x = 1$?
        choices:
          - text: >
              A local minimum, since the slope is zero.
            feedback: >
              $g(0.9) = 0.999$ is below $g(1) = 1$. Points to the left are
              lower, so it is not a minimum.
          - text: >
              A local maximum, since the slope is zero.
            feedback: >
              $g(1.1) = 1.001$ is above $g(1) = 1$. Points to the right are
              higher, so it is not a maximum.
          - text: >
              Neither: $g$ rises through it, lower on the left and higher on
              the right.
            correct: true
            feedback: >
              Right. The slope touches zero and stays nonnegative, so $g$ never
              turns around. A stationary point that is not an extremum.
        feedback: >
          The condition is necessary, never sufficient on its own. Something
          more is needed before "the derivative is zero" becomes "this is the
          minimum".
      - ask: >
          $c(q) = 50/q + 2q$ is convex on $q > 0$, since
          $c''(q) = 100/q^{3} > 0$. A convex function lies above every
          tangent, and the tangent at $q = 5$ is the flat line at height
          $20$. What does that give you?
        choices:
          - text: >
              $c(q) \ge 20$ for $q$ near $5$, so $q = 5$ is a local minimum.
            feedback: >
              True but too weak. The tangent inequality holds at every point
              of the domain, not only nearby.
          - text: >
              $c(q) \ge 20$ for every $q > 0$, so $20$ is the global minimum.
            correct: true
            feedback: >
              Right. For convex $f$, $f(y) \ge f(x^{*}) + \nabla f(x^{*})'(y -
              x^{*})$, and with a zero gradient that is
              $f(y) \ge f(x^{*})$ for every $y$ — a global certificate in one
              line.
          - text: >
              Nothing: a tangent line only describes $c$ near $q = 5$.
            feedback: >
              For a general function, yes. For a convex one the tangent is a
              global lower bound, and that is the whole point of the
              first-order form of convexity.
        feedback: >
          Under convexity the condition becomes sufficient: an interior point
          of a convex set with $\nabla f(x^{*}) = 0$ is a global minimizer. The
          recipe is differentiate, set to zero, solve, then *justify* —
          convexity or a second-order check, never assertion.

      - part: The recipe, run twice
        ask: >
          $f(x, y) = x^{2} + xy + y^{2} - 3x$ is convex — its Hessian has rows
          $(2, 1)$ and $(1, 2)$. Run the recipe. What is the minimum value?
        expects: "-3"
        hint: >
          The gradient is $(2x + y - 3,\ x + 2y)$.
        feedback: >
          The second equation gives $x = -2y$; the first then gives
          $-4y + y = 3$, so $y = -1$ and $x = 2$. The value is
          $4 - 2 + 1 - 6 = -3$, and convexity makes it the global minimum.
      - ask: >
          Back to the lots: a counterparty insists on $q \ge 8$. What is the
          smallest per-period cost now?
        expects: "22.25"
        hint: >
          Is the stationary point still allowed? Which way does $c$ slope on
          $q \ge 8$?
        feedback: >
          $q = 5$ is no longer feasible, and $c'(q) > 0$ for every $q > 5$, so
          the cost rises across the whole allowed range. The minimum is at
          the edge: $c(8) = 6.25 + 16 = 22.25$, where the slope is
          $c'(8) \approx 1.22$, not zero. The first-order condition was
          stated for interior points, and the answer here is not one.
      - teach: >
          In an interview, say all three moves: "the derivative is
          $-50/q^{2} + 2$, zero at $q = 5$; $c$ is convex on $q > 0$, so that
          is the global minimum, $20$." The third clause is the one
          candidates drop, and the one the interviewer is waiting for.

  - node: quant-tools.optimization.boundary-check
    hook: >
      A large share of wrong interview answers minimize only over the points
      where the gradient vanishes and never check anywhere else.
    explanation: >
      $\nabla f = 0$ only ever finds interior optima of a differentiable
      function, so before reporting an answer you need three more categories
      of candidate: boundary points of the feasible set, points where $f$ isn't
      differentiable (kinks), and behavior at infinity (is $f$ even bounded
      below?). None of these show up as a solution to $\nabla f=0$, because
      the condition was never designed to see them.

      The safe habit is to build one candidate list — every stationary point,
      every kink, every boundary point — evaluate $f$ at all of them, and
      compare numbers directly rather than trusting whichever candidate you
      found first. Existence of a minimum is guaranteed when the domain is
      closed and bounded with $f$ continuous, or when $f$ is continuous and
      coercive; outside those guarantees, a "local minimum" you found may not
      even be the best point on an unbounded piece of the domain.
    worked: >
      Minimize $g(x) = |x-2| + x^{2}/4$ on $[-1,5]$. For $x<2$,
      $g'(x) = -1+x/2$, which would vanish at $x=2$ — outside that region, so
      no interior stationary point there; for $x>2$, $g'(x)=1+x/2>0$
      throughout, so none there either. The only candidates are the kink
      $x=2$ and the endpoints: $g(2)=1$, $g(-1)=3.25$, $g(5)=9.25$. The minimum
      is $1$, at the kink $x=2$.
    interview: >
      "Minimize this over the interval..." is testing whether you reach for
      endpoints and kinks even when $\nabla f=0$ turns up nothing, or turns up
      a point that isn't actually the best one.
    pitfalls: >
      Skipping endpoints because the domain "should" have an interior
      optimum. Reporting a genuine local minimum on an unbounded domain
      without checking whether $f$ diverges to $-\infty$ somewhere else
      entirely.
    recap: >
      Compare stationary points, kinks, and boundary points side by side — the
      first-order condition alone only ever covers one of the three.
    dialogue:
      - part: A stress test the derivative misses
        teach: >
          A book's P&L for a move of $s$ standard deviations is
          $P(s) = 2s^{2} - s^{4}/4$: it gains on moderate moves and loses on
          large ones. Risk wants the worst P&L over the stress range
          $s \in [-3, 3]$. The slope is $P'(s) = 4s - s^{3}$.
      - ask: >
          $P'$ vanishes at $s = 0$ and $s = \pm 2$. What is the lowest value
          of $P$ among those three points?
        expects: "0"
        feedback: >
          $P(0) = 0$ and $P(\pm 2) = 8 - 4 = 4$. On the stationary points
          alone, the book never loses money.
      - ask: >
          What is $P(3)$?
        expects: "-2.25"
        feedback: >
          $2 \cdot 9 - 81/4 = 18 - 20.25 = -2.25$. The worst case is a loss of
          $2.25$, at the edges of the range, and the stationary analysis
          reported no loss at all.
      - reflect: >
          Setting $P' = 0$ could never have found $s = 3$. Why not — what
          does the first-order condition assume about the point, and what is
          different at $s = 3$?
        answer: >
          The first-order condition is about interior points: at an interior
          minimizer you can step both ways, so any nonzero slope would offer
          an improvement. At $s = 3$ you cannot step right. $P'(3) = 12 - 27 =
          -15$, so $P$ is still falling as the range ends; the minimum is
          there because the range stops you, not because the slope died.
          Points that $\nabla f = 0$ cannot see have to be added to the list
          by hand.

      - part: Kinks and the far ends
        ask: >
          A hedge ratio $x$ is charged its distance from three desks' targets:
          $T(x) = |x - 1| + |x - 4| + |x - 6|$. Its slope, wherever it exists,
          is $-3$, $-1$, $1$ or $3$, never $0$. Where is the minimum?
        choices:
          - text: >
              Nowhere: with no stationary point there is no minimum.
            feedback: >
              $T \ge 0$ and $T$ is continuous and grows without bound in both
              directions, so it has a minimum. The derivative just cannot
              locate it.
          - text: >
              At the mean of the targets, $11/3$.
            feedback: >
              $T(11/3) \approx 2.67 + 0.33 + 2.33 = 5.33$. The mean minimizes
              a sum of *squared* distances; this is a sum of absolute ones.
          - text: >
              At a kink, where the slope jumps from negative to positive.
            correct: true
            feedback: >
              Right. The slope is $-1$ on $(1, 4)$ and $+1$ on $(4, 6)$, so
              the minimum is at the kink $x = 4$, the median target.
        feedback: >
          At a kink $T'$ does not exist, so $T' = 0$ cannot find it. Kinks
          are a second source of candidates.
      - ask: >
          What is the minimum value of $T$?
        expects: "5"
        feedback: >
          $T(4) = 3 + 0 + 2 = 5$. Checking the other kinks confirms it:
          $T(1) = 0 + 3 + 5 = 8$ and $T(6) = 5 + 2 + 0 = 7$.
      - ask: >
          $g(x) = 2x^{3} - 3x^{2}$ on all of $\mathbb{R}$ has $g'(x) = 6x(x - 1)$,
          and $x = 1$ is a genuine local minimum with $g(1) = -1$. What is the
          minimum of $g$ over $\mathbb{R}$?
        choices:
          - text: >
              $-1$, at $x = 1$.
            feedback: >
              $g(-2) = -16 - 12 = -28$, far below $-1$. A local minimum on an
              unbounded domain says nothing about the far ends.
          - text: >
              There is none: $g(x) \to -\infty$ as $x \to -\infty$.
            correct: true
            feedback: >
              Right. The cubic term wins for large $|x|$, and for negative $x$
              it drags $g$ below any number you name.
          - text: >
              $0$, at $x = 0$.
            feedback: >
              $x = 0$ is a local *maximum*: $g$ is $0$ there and negative on
              both sides nearby. And $g(1) = -1$ already beats it.
        feedback: >
          The third place to look is infinity. Before reporting a stationary
          point as the minimum on an unbounded domain, ask whether $f$ is even
          bounded below.

      - part: One list of candidates
        teach: >
          The habit, then. $\nabla f = 0$ finds interior optima of
          differentiable functions and nothing else, so list every candidate:
          stationary points inside the domain, kinks, and boundary points.
          Evaluate $f$ on all of them and compare the numbers. Separately,
          make sure a minimum exists — guaranteed when $f$ is continuous on a
          closed bounded domain, or continuous and coercive — and if the
          domain is unbounded, check that $f$ does not run off to $-\infty$.
      - ask: >
          Now the hedge ratio is restricted to $[5, 9]$. Run the list on $T$.
          What is the minimum value?
        expects: "6"
        hint: >
          Which kinks survive in $[5, 9]$? Then add the two endpoints.
        feedback: >
          The only kink inside is $x = 6$, with $T(6) = 7$. The endpoints give
          $T(5) = 4 + 1 + 1 = 6$ and $T(9) = 8 + 5 + 3 = 16$. The minimum is
          $6$, at the endpoint $x = 5$ — the unconstrained answer $x = 4$ is
          infeasible, and the best you can do is get as close to it as the
          range allows.
      - ask: >
          Minimize $f(x) = x$ over $(0, 1]$. The list has no stationary point
          and no kink, and one endpoint, $x = 1$. What is the answer?
        choices:
          - text: >
              $1$, at the endpoint $x = 1$.
            feedback: >
              That is the *largest* value on the domain. Every $x$ in
              $(0, 1)$ does better.
          - text: >
              $0$, at $x = 0$.
            feedback: >
              $0$ is not in the domain, so it cannot be the minimizer. It is
              the infimum, approached and never reached.
          - text: >
              There is no minimizer: $f$ approaches $0$ at the open end and
              never attains it.
            correct: true
            feedback: >
              Right. The domain is bounded but not closed, so existence is not
              guaranteed, and here it fails. An open end is a place to take a
              limit, not a candidate to evaluate.
        feedback: >
          The list compares candidates; it cannot conjure a minimizer that is
          not there. Existence is the step people skip.
      - teach: >
          Said aloud in an interview: "stationary points give me these
          values; the endpoints give these; the kink gives this; the function
          is continuous on a closed interval, so the smallest of these is the
          minimum." It takes ten seconds and is where most wrong answers to
          "minimize over an interval" come from.

  - node: quant-tools.optimization.gradient-hessian
    hook: >
      Every later step in this unit — FOC, SOC, Lagrange — is written in
      gradient and Hessian notation, so fluency here is what lets you move fast
      once the real problem starts.
    explanation: >
      The gradient $\nabla f(x)$ collects the $n$ first partials into a vector,
      and the Hessian $H(x)$ collects the $n^2$ second partials into a matrix,
      symmetric whenever those partials are continuous. Taylor's theorem's
      multivariable analogue plugs both in at once:
      $f(x+h) = f(x) + \nabla f(x)'h + \tfrac{1}{2} h'H(x)h + o(\lVert h\rVert^{2})$
      — a constant, a linear correction from the gradient, and a quadratic-form
      correction (recall quadratic forms) from the Hessian, exactly mirroring
      the single-variable expansion term by term.

      Two gradients are worth having memorized rather than re-derived each
      time. $\nabla(b'x) = b$ falls out because $\partial(\sum_j b_j x_j)/
      \partial x_i = b_i$. $\nabla(x'Ax) = (A+A')x$ — which is $2Ax$ once $A$ is
      symmetric — comes from each $x_k$ appearing in both the row and column
      of the bilinear sum $\sum_{i,j}a_{ij}x_ix_j$. The quadratic form
      $h'H(x)h$ that appears in the expansion is precisely the object whose
      sign, at a stationary point, decides whether you're at a min, a max, or a
      saddle.
    worked: >
      For $f(x,y) = 3x^{2}+2xy+y^{2}-5x$: $\nabla f = (6x+2y-5,\;2x+2y)$, so
      $\nabla f(1,1) = (3, 4)$. The Hessian is constant, with rows $(6,2)$ and
      $(2,2)$, read off directly from the second partials
      $\partial^2 f/\partial x^2=6$, $\partial^2 f/\partial x\partial y=2$,
      $\partial^2 f/\partial y^2=2$.
    interview: >
      "Write down the gradient and Hessian of this function" is often step one
      of a bigger problem — doing it quickly and correctly, including the
      factor-of-2 bookkeeping, is what buys you time for the harder part.
    pitfalls: >
      Forgetting the $2A$ shortcut only applies once $A$ is symmetrized —
      $\nabla(x'Ax)=(A+A')x$ in general. Dropping cross-partial terms or
      double-counting them when assembling the Hessian by hand from a
      polynomial.
    recap: >
      The gradient and Hessian are the vector of first partials and matrix of
      second partials, and together they give the quadratic Taylor expansion
      around any point.
    dialogue:
      - part: A book moved by two factors
        teach: >
          A book's value depends on two factor levels as
          $f(x, y) = x^{2}y + 3y^{2} - 2x$, currently at $(1, 2)$, where
          $f = 12$. Risk wants the change in value for the move
          $h = (0.1, -0.1)$ without repricing the book.
      - ask: >
          What is $\partial f/\partial x$ at $(1, 2)$?
        expects: "2"
        feedback: >
          $\partial f/\partial x = 2xy - 2$, which is $4 - 2 = 2$ at $(1, 2)$.
      - ask: >
          The other partial is $\partial f/\partial y = x^{2} + 6y = 13$ at
          $(1, 2)$. Using both partials, estimate the change in $f$ for the
          move $(0.1, -0.1)$.
        expects: "-1.1"
        feedback: >
          $2 \cdot 0.1 + 13 \cdot (-0.1) = 0.2 - 1.3 = -1.1$. Repricing gives
          $f(1.1, 1.9) = 2.299 + 10.83 - 2.2 = 10.929$, a change of $-1.071$.
          The linear estimate is off by about $0.03$.
      - reflect: >
          In one variable the next Taylor term is $\tfrac{1}{2}f''(x)h^{2}$.
          With two variables, what object plays the role of $f''$, and how
          should it combine with the move $h = (h_1, h_2)$ to give a single
          number?
        hint: >
          There are now three different second derivatives, and one of them
          involves both variables.
        answer: >
          The second partials $f_{xx}$, $f_{xy}$, $f_{yy}$, arranged as a
          symmetric $2 \times 2$ matrix $H$. The move enters on both sides:
          $h'Hh = f_{xx}h_1^{2} + 2f_{xy}h_1h_2 + f_{yy}h_2^{2}$, a quadratic
          form in $h$. The mixed term appears twice because $f_{xy} = f_{yx}$
          sits in both off-diagonal slots. The correction is then
          $\tfrac{1}{2}h'Hh$.

      - part: The second derivative as a matrix
        teach: >
          The names. The gradient $\nabla f(x)$ is the vector of first
          partials $\partial f/\partial x_i$; the Hessian $H(x)$ is the matrix
          of second partials $\partial^{2} f/\partial x_i \partial x_j$,
          symmetric when they are continuous. The second-order expansion is
          $f(x + h) = f(x) + \nabla f(x)'h + \tfrac{1}{2}h'H(x)h +
          o(\lVert h\rVert^{2})$. Here $\nabla f(1, 2) = (2, 13)$, and $H$
          has rows $(2y, 2x)$ and $(2x, 6)$.
      - ask: >
          At $(1, 2)$ the Hessian has rows $(4, 2)$ and $(2, 6)$. What is the
          second-order term $\tfrac{1}{2}h'Hh$ for $h = (0.1, -0.1)$?
        expects: "0.03"
        hint: >
          $h'Hh = 4h_1^{2} + 2 \cdot 2\,h_1h_2 + 6h_2^{2}$.
        feedback: >
          $h'Hh = 0.04 - 0.04 + 0.06 = 0.06$, so the term is $0.03$. The
          estimate becomes $-1.1 + 0.03 = -1.07$, against the true $-1.071$:
          the error fell from $0.029$ to $0.001$.
      - ask: >
          A colleague gets $0.04$ for that term, computing
          $\tfrac{1}{2}(4 \cdot 0.01 + 2 \cdot 0.1 \cdot (-0.1) + 6 \cdot 0.01)$.
          Where is the slip?
        choices:
          - text: >
              The $\tfrac{1}{2}$ should not be there.
            feedback: >
              The $\tfrac{1}{2}$ is Taylor's, as in $\tfrac{1}{2}f''h^{2}$.
              Dropping it would make the error worse, not fix this one.
          - text: >
              The mixed partial sits in two slots of $H$, so its term is
              $2 \cdot 2\,h_1h_2$, counted twice.
            correct: true
            feedback: >
              Right. $h'Hh = \sum_{i,j} H_{ij}h_ih_j$ visits $H_{12}$ and
              $H_{21}$; counting the cross term once gives $0.08$ inside the
              bracket instead of $0.06$.
          - text: >
              Cross terms do not belong in the second-order term at all.
            feedback: >
              Then the expansion would miss every interaction between the two
              factors. Here $f = x^{2}y + \dots$ has a real one: $f_{xy} = 2x$.
        feedback: >
          Assembling $H$ by hand: diagonal entries once, the off-diagonal
          entry in two places. Dropping or double-counting cross terms is the
          standard slip.

      - part: Quadratic forms, and how far the expansion reaches
        ask: >
          Take $f(x) = x'Ax$ with $A$ symmetric, rows $(3, 1)$ and $(1, 2)$ —
          written out, $3x_1^{2} + 2x_1x_2 + 2x_2^{2}$. What is
          $\partial f/\partial x_1$ at $x = (1, 1)$?
        expects: "8"
        feedback: >
          $6x_1 + 2x_2 = 8$. The other partial is $2x_1 + 4x_2 = 6$, so the
          gradient is $(8, 6)$. Compare $Ax = (4, 3)$: the gradient is
          exactly $2Ax$.
      - ask: >
          What is the Hessian of that $f$?
        choices:
          - text: >
              $A$ itself, rows $(3, 1)$ and $(1, 2)$.
            feedback: >
              $\partial^{2} f/\partial x_1^{2} = 6$, not $3$. The Hessian of a
              quadratic form is twice its matrix, like the $2$ in
              $(x^{2})'' = 2$.
          - text: >
              Rows $(6, 1)$ and $(1, 4)$.
            feedback: >
              The diagonal is right, but $\partial^{2} f/\partial x_1
              \partial x_2 = 2$, from the term $2x_1x_2$. Every entry doubles,
              not only the diagonal.
          - text: >
              $2A$, rows $(6, 2)$ and $(2, 4)$.
            correct: true
            feedback: >
              Right. With the gradient $2Ax$, differentiating once more gives
              $2A$.
        feedback: >
          Two derivatives worth having cold: $\nabla(b'x) = b$, and
          $\nabla(x'Ax) = (A + A')x$, which is $2Ax$ with Hessian $2A$ when $A$
          is symmetric. Symmetrize first if it is not.
      - ask: >
          Back to the book at $(1, 2)$, now with a large move $h = (1, -1)$.
          The second-order estimate is $2 - 13 + \tfrac{1}{2}(4 - 4 + 6) = -8$,
          but repricing gives $f(2, 1) - 12 = 3 - 12 = -9$. Why the gap?
        choices:
          - text: >
              The Hessian was evaluated at the wrong point.
            feedback: >
              The expansion is about $(1, 2)$, and $H$ was taken there — that
              is correct. The gap has another source.
          - text: >
              The expansion only promises an error small compared with
              $\lVert h\rVert^{2}$ as $h$ shrinks; at $h = (1, -1)$ the
              third-order term is no longer negligible.
            correct: true
            feedback: >
              Right. Here the leftover is exactly $h_1^{2}h_2 = -1$, from the
              $x^{2}y$ term. At $h = (0.1, -0.1)$ the same term was $-0.001$.
          - text: >
              Second-order expansions are exact for polynomials.
            feedback: >
              Only for polynomials of degree at most two. $x^{2}y$ has degree
              three, and its third-order term is what is missing.
        feedback: >
          Gradient and Hessian describe $f$ near a point, and the quadratic
          form $h'H(x)h$ is the part that decides the local shape — which is
          exactly what the next step uses it for, at stationary points.

  - node: quant-tools.optimization.soc
    hook: >
      Once you have a stationary point, the Hessian's definiteness is the
      tiebreaker between "minimum," "maximum," "saddle," and "can't tell yet."
    explanation: >
      Near a stationary point $x^{*}$, the gradient term of the Taylor
      expansion vanishes, leaving
      $f(x^{*}+h) - f(x^{*}) \approx \tfrac{1}{2} h'Hh$: the sign of this quadratic
      form for every direction $h$ is exactly the sign of $f(x^{*}+h)-f(x^{*})$
      near $x^{*}$. A positive definite $H$ makes that quadratic form positive
      in every direction, hence a strict local minimum; negative definite gives
      a strict local max; and an $H$ with eigenvalues of both signs gives a
      direction that increases and a direction that decreases — a saddle. When
      $H$ is only semidefinite and singular, the quadratic term vanishes along
      some direction and the sign is decided by terms the expansion doesn't
      show, so the test is genuinely silent.

      For a $2\times2$ symmetric $H$ with rows $(a,b)$ and $(b,c)$, positive
      definiteness reduces to two numbers: $a>0$ and $ac-b^{2}>0$. Checking
      only the diagonal entry $a>0$ and skipping the determinant is the most
      common shortcut error, because a large enough off-diagonal term can flip
      an apparently positive-curvature direction into a saddle.
    worked: >
      Classify the stationary point of $f(x,y) = x^{2}-y^{2}+4xy$. Gradient
      $(2x+4y,\;4x-2y) = 0$ forces $x=y=0$. The Hessian is $H$ with rows
      $(2,4)$ and $(4,-2)$: $a=2>0$, but $ac-b^{2} = -4-16=-20<0$, so $H$ is
      indefinite and the origin is a saddle — despite the positive diagonal
      entry that, checked alone, would have suggested a minimum.
    interview: >
      "Classify this critical point" wants the definiteness of the Hessian —
      eigenvalue signs in general, the $a>0,\;ac-b^{2}>0$ shortcut whenever
      it's $2\times2$ — not a guess based on one partial derivative.
    pitfalls: >
      Using a single positive diagonal second partial as if it were sufficient
      for a minimum — it isn't, only the full definiteness test is. Treating a
      singular semidefinite Hessian as decisive in either direction when it's
      actually inconclusive without more information.
    recap: >
      The Hessian's definiteness at a stationary point reads off the local
      shape: positive definite is a min, negative definite is a max, indefinite
      is a saddle, and singular semidefinite decides nothing.
    dialogue:
      - part: A fitter stops at a flat point
        teach: >
          A fitting routine stops at the origin, where the gradient of its loss
          is zero. Near there the loss is $f(x, y) = 2x^{2} + 5xy + 2y^{2}$,
          with $f(0, 0) = 0$. Both pure second derivatives,
          $f_{xx} = 4$ and $f_{yy} = 4$, are positive, and the routine reports
          a minimum.
      - ask: >
          What is $f(1, 1)$?
        expects: "9"
        feedback: >
          $2 + 5 + 2 = 9$. Along the diagonal the loss rises, as a minimum
          would.
      - ask: >
          What is $f(1, -1)$?
        expects: "-1"
        feedback: >
          $2 - 5 + 2 = -1$, below $f(0, 0) = 0$. Scale the move down to
          $(t, -t)$ and you get $-t^{2}$, which is negative however small $t$
          is.
      - ask: >
          So what is the origin?
        choices:
          - text: >
              A minimum: both pure second derivatives are positive.
            feedback: >
              They measure curvature along the two axes only. Along
              $(1, -1)$ the loss falls, and a minimum must beat its
              neighbours in every direction.
          - text: >
              A saddle: the loss rises along $(1, 1)$ and falls along
              $(1, -1)$.
            correct: true
            feedback: >
              Right. The cross term $5xy$ is large enough to overpower the two
              positive diagonal terms in the direction where $xy < 0$.
          - text: >
              Impossible to say from second derivatives alone.
            feedback: >
              The second derivatives do settle this one — you just have to use
              all of them, cross term included. $f(1, -1) = -1$ already
              proves it is not a minimum.
        feedback: >
          The routine checked the diagonal and missed the off-diagonal. The
          verdict depends on the curvature in *every* direction.
      - reflect: >
          At a stationary point, $f(x^{*} + h) - f(x^{*}) \approx
          \tfrac{1}{2}h'Hh$. What property of $H$ would guarantee a strict
          local minimum, and what property guarantees a saddle?
        answer: >
          A strict local minimum needs $f$ to rise in every direction, so
          $h'Hh > 0$ for every $h \ne 0$: $H$ positive definite. Then the
          quadratic term dominates the small error for small $h$. A saddle
          needs one direction with $h'Hh > 0$ and another with $h'Hh < 0$:
          $H$ has eigenvalues of both signs, as here, where $(1, 1)$ gives
          $18$ and $(1, -1)$ gives $-2$.

      - part: Reading curvature from the Hessian
        teach: >
          The second-order conditions, at a stationary point $x^{*}$ of a
          twice continuously differentiable $f$, with $H = H(x^{*})$: $H$
          positive definite gives a strict local minimum, negative definite a
          strict local maximum, indefinite a saddle. In the other direction,
          a local minimum forces $H$ positive semidefinite. For a symmetric
          $H$ with rows $(a, b)$ and $(b, c)$, positive definite means exactly
          $a > 0$ and $ac - b^{2} > 0$.
      - ask: >
          For the fitter's loss, $H$ has rows $(4, 5)$ and $(5, 4)$. What is
          $ac - b^{2}$?
        expects: "-9"
        feedback: >
          $16 - 25 = -9 < 0$. A negative determinant in the $2 \times 2$ case
          means one positive and one negative eigenvalue — a saddle, whatever
          the diagonal says.
      - ask: >
          At another stationary point the Hessian has rows $(2, 3)$ and
          $(3, 2)$. What is its smallest eigenvalue?
        expects: "-1"
        hint: >
          Try the vectors $(1, 1)$ and $(1, -1)$.
        feedback: >
          $H$ sends $(1, 1)$ to $(5, 5)$ and $(1, -1)$ to $(-1, 1)$, so the
          eigenvalues are $5$ and $-1$. Mixed signs: another saddle with a positive
          diagonal. The determinant $4 - 9 = -5$ said the same thing faster.

      - part: When the test goes quiet, and when it goes global
        ask: >
          $g(x, y) = x^{2} + y^{3}$ is stationary at the origin, and its
          Hessian there has rows $(2, 0)$ and $(0, 0)$ — positive
          semidefinite, so the necessary condition holds. Is the origin a
          local minimum?
        choices:
          - text: >
              Yes: the Hessian is positive semidefinite, which is what a
              minimum requires.
            feedback: >
              Semidefiniteness is necessary, not sufficient. $g(0, -0.1) =
              -0.001 < 0 = g(0, 0)$.
          - text: >
              No: along the $y$-axis $g = y^{3}$, which is negative for
              $y < 0$.
            correct: true
            feedback: >
              Right. In the direction where $H$ has a zero eigenvalue the
              quadratic term vanishes, and the cubic term decides. Replace
              $y^{3}$ by $y^{4}$ and the same Hessian sits at a minimum.
          - text: >
              It is a local maximum along the $y$-axis.
            feedback: >
              $y^{3}$ rises through $0$; it is neither a maximum nor a
              minimum along that axis. And along the $x$-axis $g = x^{2}$
              rises on both sides.
        feedback: >
          A singular semidefinite Hessian is where the test falls silent:
          the quadratic term is zero in some direction, and higher-order
          terms you have not computed make the call.
      - ask: >
          $f(x, y) = x^{2} - 2xy + 2y^{2} - 2y$ has a constant Hessian with
          rows $(2, -2)$ and $(-2, 4)$. Find its stationary point, classify
          it, and give the value of $f$ there.
        expects: "-1"
        hint: >
          The gradient is $(2x - 2y,\ -2x + 4y - 2)$.
        feedback: >
          The first equation gives $x = y$; the second then gives $2y = 2$, so
          $(x, y) = (1, 1)$ and $f = 1 - 2 + 2 - 2 = -1$. Here $a = 2 > 0$ and
          $ac - b^{2} = 8 - 4 = 4 > 0$, so $H$ is positive definite — and
          because that holds at *every* point, $f$ is convex and $-1$ is the
          global minimum, not just a local one.
      - teach: >
          The global version is the one to quote: a Hessian positive
          semidefinite everywhere on a convex domain makes $f$ convex, and
          then any stationary point is a global minimum. In an interview,
          classify with the whole Hessian — "$a > 0$ and $ac - b^{2} > 0$" in
          two dimensions — and never from one diagonal entry.

  - node: quant-tools.optimization.quadratic-min
    hook: >
      Kelly staking, minimum-variance portfolios, ridge regression and OLS all
      end at the same three-line derivation — this is that derivation, done
      once.
    explanation: >
      In one variable, $\nabla q(x) = 2ax+b=0$ gives $x^{*}=-b/(2a)$ directly;
      substituting back gives the value $c-b^{2}/(4a)$. The sign of $a$ decides
      everything: $a>0$ is a minimum, $a<0$ a maximum, $a=0$ with $b\ne0$ leaves
      $q$ unbounded both ways.

      The vector case is the same equation with the gradient formulas from
      Gradient, Hessian and the second-order expansion plugged in: for
      $q(x) = \tfrac{1}{2} x'Ax - b'x + c$, $\nabla q(x) = Ax-b$, so
      $\nabla q=0$ is the linear system $Ax=b$. If $A$ is positive definite —
      which is automatic once you've confirmed $q$ is strictly convex — this
      system has the unique solution $x^{*}=A^{-1}b$, and it's the global
      minimum by Second-order conditions, with value
      $c-\tfrac{1}{2} b'A^{-1}b$. Every quadratic minimization, however it's
      dressed up, is "solve $Ax=b$" in disguise.
    worked: >
      Minimize $q(x,y) = x^{2}+2y^{2}-2x-8y$, which is
      $\tfrac{1}{2} x'Ax - b'x$ with $A=\operatorname{diag}(2,4)$ and $b=(2,8)$.
      $\nabla q = (2x-2,\;4y-8)=0$ gives $x^{*}=1$, $y^{*}=2$. Using
      $c-\tfrac{1}{2} b'A^{-1}b$ with $A^{-1}=\operatorname{diag}(1/2,1/4)$:
      $b'A^{-1}b = 2 + 16 = 18$, so the minimum value is $-9$ — matching the
      direct check $q(1,2)=1+8-2-16=-9$.
    interview: >
      "Minimize this quadratic" wants recognition of the $Ax=b$ structure
      first — if only the minimizer is asked for, solve the linear system;
      only compute the value formula when the minimum value itself is asked
      for.
    pitfalls: >
      Declaring a stationary point of a quadratic a minimum without checking
      $A$ is positive definite — an indefinite $A$ makes it a saddle, and a
      negative-eigenvalue direction makes $q$ unbounded below. Misreading the
      factor-of-2 convention when assembling $A$ from a quadratic written out
      term by term rather than in the $\tfrac{1}{2} x'Ax$ form.
    recap: >
      Minimizing a quadratic always reduces to solving the linear system
      $Ax=b$, with minimum value $c-\tfrac{1}{2} b'A^{-1}b$ once $A$ is positive
      definite.
    dialogue:
      - part: One hedge, one knob
        teach: >
          A position $P$ has variance $25$. You hedge it by shorting $h$ units
          of a future $Y$ with variance $4$ and $\Cov(P, Y) = 8$. The hedged
          variance is $v(h) = \Var(P - hY) = 4h^{2} - 16h + 25$.
      - ask: >
          Which $h$ minimizes the hedged variance?
        expects: "2"
        feedback: >
          $v'(h) = 8h - 16 = 0$ gives $h = 2$, and the leading coefficient
          $4 > 0$ makes it a minimum. It is $\Cov(P, Y)/\Var(Y) = 8/4$, the
          minimum-variance hedge ratio.
      - ask: >
          What variance is left after the best hedge?
        expects: "9"
        feedback: >
          $v(2) = 16 - 32 + 25 = 9$. Directly from the coefficients:
          $c - b^{2}/(4a) = 25 - 256/16 = 9$. The hedge removed $16$ of the
          original $25$.
      - ask: >
          If $\Var(Y)$ were $8$ instead, with the covariance still $8$, what
          would the best hedge ratio be?
        expects: "1"
        feedback: >
          $v(h) = 8h^{2} - 16h + 25$, so $h^{*} = -b/(2a) = 16/16 = 1$. A
          noisier hedge instrument earns a smaller position.

      - part: Two hedges, one linear system
        teach: >
          Now hedge with two futures, $Y_1$ and $Y_2$: variances $2$ and $1$,
          covariance $1$, with $\Cov(P, Y_1) = 3$, $\Cov(P, Y_2) = 2$ and
          $\Var(P) = 6$. Shorting $h_1$ and $h_2$ units leaves
          $v(h_1, h_2) = 2h_1^{2} + 2h_1h_2 + h_2^{2} - 6h_1 - 4h_2 + 6$.
      - reflect: >
          Write $v$ in the form $\tfrac{1}{2}h'Ah - b'h + c$. What are $A$ and
          $b$, what does $\nabla v = 0$ become, and what must be true of $A$
          for its solution to be the unique global minimum?
        hint: >
          The Hessian of $\tfrac{1}{2}h'Ah$ is $A$, and the gradient of
          $b'h$ is $b$.
        answer: >
          $A$ is the Hessian, with rows $(4, 2)$ and $(2, 2)$; $b = (6, 4)$ and
          $c = 6$. The gradient is $Ah - b$, so stationarity is the linear
          system $Ah = b$. If $A$ is positive definite — here $4 > 0$ and
          $4 \cdot 2 - 2^{2} = 4 > 0$ — the Hessian is positive definite
          everywhere, $v$ is strictly convex, and the one solution
          $h^{*} = A^{-1}b$ is the global minimum.
      - teach: >
          In general, for $q(x) = \tfrac{1}{2}x'Ax - b'x + c$ with $A$
          symmetric positive definite, the unique global minimizer is
          $x^{*} = A^{-1}b$ and the minimum value is
          $c - \tfrac{1}{2}b'A^{-1}b$, which is $c - \tfrac{1}{2}b'x^{*}$. In
          one variable, $ax^{2} + \beta x + c$ is the case $A = 2a$ and
          $b = -\beta$, and $A^{-1}b = -\beta/(2a)$ is the vertex you just
          used.
      - ask: >
          Solve $Ah = b$. What is $h_1^{*}$?
        expects: "1"
        hint: >
          The equations are $4h_1 + 2h_2 = 6$ and $2h_1 + 2h_2 = 4$; subtract
          them.
        feedback: >
          Subtracting gives $2h_1 = 2$, so $h_1^{*} = 1$, and then
          $h_2^{*} = 1$. Check in the first equation: $4 + 2 = 6$.
      - ask: >
          What variance is left after the best two-future hedge?
        expects: "1"
        feedback: >
          $c - \tfrac{1}{2}b'h^{*} = 6 - \tfrac{1}{2}(6 + 4) = 1$. Direct
          check: $v(1, 1) = 2 + 2 + 1 - 6 - 4 + 6 = 1$. Hedging with $Y_1$
          alone would leave $6 - 3^{2}/2 = 1.5$; the second future earns its
          place.

      - part: When the matrix is not positive definite
        ask: >
          $q(x, y) = x^{2} + 4xy + y^{2} - 2x$ has a stationary point. What is
          the minimum of $q$ over $\mathbb{R}^{2}$?
        choices:
          - text: >
              The value at the stationary point, since a quadratic's
              stationary point is its vertex.
            feedback: >
              Only when $A$ is positive definite. Here $A$ has rows $(2, 4)$
              and $(4, 2)$, with $ac - b^{2} = 4 - 16 < 0$: the stationary point
              is a saddle.
          - text: >
              There is none: along $(t, -t)$, $q = -2t^{2} - 2t$, which goes to
              $-\infty$.
            correct: true
            feedback: >
              Right. $A$ has eigenvalues $6$ and $-2$, and along the
              eigenvector $(1, -1)$ of the negative one the quadratic falls
              without bound.
          - text: >
              $0$, because the quadratic part is a sum of squares.
            feedback: >
              $x^{2} + 4xy + y^{2}$ is not a sum of squares: at $(1, -1)$ it
              is $1 - 4 + 1 = -2$.
        feedback: >
          Any negative eigenvalue of $A$ makes $q$ unbounded below, and $Ax = b$
          then finds a saddle, not an answer. Check definiteness before
          trusting $A^{-1}b$.
      - ask: >
          Suppose the two futures were the same contract listed on two
          exchanges, so $Y_1 = Y_2$. What happens to the best hedge?
        choices:
          - text: >
              It is unique: put everything in whichever listing comes first.
            feedback: >
              Only the total $h_1 + h_2$ affects the variance, so moving units
              from one listing to the other changes nothing. There is no
              reason to prefer either.
          - text: >
              A whole line of hedges is optimal: any split with the right
              total $h_1 + h_2$.
            correct: true
            feedback: >
              Right. $A$ becomes singular and positive semidefinite, and
              minimizers form an affine set — here the line
              $h_1 + h_2 = \text{const}$. The minimum value is still attained.
          - text: >
              No hedge is optimal: a singular $A$ means $q$ is unbounded
              below.
            feedback: >
              A variance is never below $0$, so it cannot be unbounded below.
              Singular $A$ breaks uniqueness here, not existence.
        feedback: >
          Positive definite: one minimizer, $A^{-1}b$. Positive semidefinite
          and singular: no minimizer or a whole affine set of them, depending
          on $b$. Any negative eigenvalue: unbounded below. This is the
          formula behind minimum-variance hedges, least squares and Gaussian
          exponents.

  - node: quant-tools.optimization.complete-square
    hook: >
      This is the mental-math route to a vertex or a Gaussian integral — no
      derivative required, which matters when a speed round leaves no time to
      differentiate.
    explanation: >
      Completing the square is the algebraic mirror of setting the derivative
      to zero: $ax^{2}+bx+c = a(x+b/(2a))^{2} + c - b^{2}/(4a)$ makes the
      vertex $x^{*}=-b/(2a)$ visible by inspection, exactly the formula from
      Minimizing a quadratic, reached without calculus. The vector version does
      the identical rearrangement with the matrix $A$ standing in for $a$.

      The same rearrangement evaluates Gaussian integrals, because
      $-\alpha x^{2}+\beta x$ completes to
      $-\alpha(x-\beta/(2\alpha))^{2}+\beta^{2}/(4\alpha)$, pulling a constant
      out of the exponent and leaving the standard Gaussian integral behind —
      the route by which normal moment generating functions get evaluated in
      closed form.

      Reach for this move before reaching for a derivative whenever the
      quadratic is simple enough to factor by eye — it's faster, it makes sign
      errors easier to catch by inspection, and it generalizes directly to the
      $\tfrac{1}{2}x'Ax-b'x$ form that shows up throughout Markowitz-style variance
      minimization.
    worked: >
      Complete the square in $-2x^{2}+8x-3$: factor out the leading
      coefficient, $-2(x^{2}-4x)-3 = -2\left[(x-2)^{2}-4\right]-3 =
      -2(x-2)^{2}+5$. Since the leading coefficient is negative, this is a
      maximum, not a minimum: the maximum value is $5$, attained at $x=2$.
    interview: >
      "Find the vertex" or "maximize/minimize this quadratic" without a
      calculator is exactly what completing the square is for — producing the
      answer in one algebraic step signals fluency the derivative route
      doesn't.
    pitfalls: >
      Losing the sign when factoring out a negative leading coefficient — the
      term inside the parentheses must flip sign correctly, as in the $-2$
      example, or the vertex location comes out wrong. Forgetting the
      $-b^{2}/(4a)$ correction term and reporting the vertex value as just $c$.
    recap: >
      Rewriting a quadratic as a perfect square plus a constant hands you the
      vertex and extreme value with no calculus at all.
    dialogue:
      - part: A vertex, the slow way
        ask: >
          An interviewer hands you $q(x) = 2x^{2} - 12x + 23$ and asks for its
          minimum. Differentiating first: where is the minimizer?
        expects: "3"
        feedback: >
          $q'(x) = 4x - 12 = 0$ gives $x = 3$, and the leading coefficient
          $2 > 0$ makes it a minimum.
      - ask: >
          And the minimum value?
        expects: "5"
        feedback: >
          $q(3) = 18 - 36 + 23 = 5$. Two steps: differentiate and solve, then
          substitute back and simplify — the second is where slips happen.
      - reflect: >
          Find a way to rewrite $2x^{2} - 12x + 23$ so that both answers, $3$
          and $5$, can be read off at sight, with no derivative and no
          substitution. What form would make the minimum obvious?
        hint: >
          What is the smallest value $2(\text{something})^{2}$ can take?
        answer: >
          $2(x - 3)^{2} + 5$. Expanding gives $2x^{2} - 12x + 18 + 5$, the
          original. A square is never negative and is zero only at $x = 3$, so
          the minimum is $5$, at $x = 3$ — both read off the form, and the
          proof that it is a minimum comes free.

      - part: A square plus a constant
        teach: >
          That is completing the square:
          $ax^{2} + bx + c = a\left(x + \dfrac{b}{2a}\right)^{2} + c -
          \dfrac{b^{2}}{4a}$. To do it by hand, factor $a$ out of the $x$
          terms, halve the coefficient of $x$ inside, and pay back the square
          of that half, multiplied by $a$. It is the vertex formula reached
          without calculus, and it works wherever a quadratic hides —
          including where a derivative is no help.
      - ask: >
          Complete the square in $x^{2} + 10x + 18$. What is its minimum
          value?
        expects: "-7"
        hint: >
          Half of $10$ is $5$, and $(x + 5)^{2} = x^{2} + 10x + 25$.
        feedback: >
          $x^{2} + 10x + 18 = (x + 5)^{2} - 25 + 18 = (x + 5)^{2} - 7$, so the
          minimum is $-7$, at $x = -5$.
      - ask: >
          Now $-3x^{2} + 12x + 1$. What is its maximum value?
        choices:
          - text: >
              $-3$, from $-3(x - 2)^{2} - 4 + 1$.
            feedback: >
              The $-4$ came from inside the bracket and must be multiplied by
              the $-3$ outside: $-3[(x - 2)^{2} - 4] + 1 = -3(x - 2)^{2} + 12 + 1$.
          - text: >
              $13$, from $-3(x - 2)^{2} + 13$.
            correct: true
            feedback: >
              Right: $-3(x^{2} - 4x) + 1 = -3[(x - 2)^{2} - 4] + 1$. The
              negative leading coefficient turns the vertex into a maximum, at
              $x = 2$.
          - text: >
              $13$, at $x = -2$.
            feedback: >
              The value is right and the location is not. Factoring out $-3$
              leaves $x^{2} - 4x$, whose square is $(x - 2)^{2}$, zero at
              $x = 2$.
          - text: >
              $1$, the constant term.
            feedback: >
              The constant is the value at $x = 0$. The vertex value carries
              the correction $-b^{2}/(4a) = -144/(-12) = 12$, giving $13$.
        feedback: >
          With a negative leading coefficient, factor it out *with its sign*,
          and multiply the payback by it. That one sign is where most errors
          in this move live.

      - part: Several variables, and an exponent
        ask: >
          Complete the square in each variable of
          $x^{2} + 4y^{2} - 4x - 8y$. What is its minimum value?
        expects: "-8"
        hint: >
          The variables do not interact, so complete $x^{2} - 4x$ and
          $4(y^{2} - 2y)$ separately.
        feedback: >
          $(x - 2)^{2} - 4 + 4(y - 1)^{2} - 4$, so the minimum is $-8$ at
          $(2, 1)$. In matrix form this is the identity
          $\tfrac{1}{2}x'Ax - b'x = \tfrac{1}{2}(x - A^{-1}b)'A(x - A^{-1}b) -
          \tfrac{1}{2}b'A^{-1}b$ with $A = \operatorname{diag}(2, 8)$ and
          $b = (4, 8)$: $A^{-1}b = (2, 1)$ and
          $-\tfrac{1}{2}b'A^{-1}b = -\tfrac{1}{2}(8 + 8) = -8$.
      - ask: >
          For a standard normal $Z$,
          $\mathbb{E}[e^{tZ}] = \tfrac{1}{\sqrt{2\pi}}\int_{-\infty}^{\infty}
          e^{tz - z^{2}/2}\,dz$. Complete the square in the exponent and
          evaluate it at $t = 2$, to three decimal places.
        expects: "7.389"
        tolerance: 0.001
        hint: >
          $tz - z^{2}/2 = -\tfrac{1}{2}(z - t)^{2} + \text{something}$. What is
          left after the shifted normal density integrates to $1$?
        feedback: >
          $tz - z^{2}/2 = -\tfrac{1}{2}(z - t)^{2} + t^{2}/2$. The factor
          $e^{t^{2}/2}$ comes outside, and what remains is a normal density
          centred at $t$, which integrates to $1$. So
          $\mathbb{E}[e^{tZ}] = e^{t^{2}/2}$, and at $t = 2$ that is
          $e^{2} \approx 7.389$. Differentiating the exponent would have
          located the peak of the integrand and nothing more.
      - ask: >
          A colleague applies the same move to
          $\int_{-\infty}^{\infty} e^{x^{2} - 2x}\,dx$ and writes
          $\sqrt{\pi/\alpha}\,e^{\beta^{2}/(4\alpha)}$ with $\alpha = -1$. What
          is wrong?
        choices:
          - text: >
              Nothing: the formula holds for any nonzero $\alpha$.
            feedback: >
              $\sqrt{\pi/(-1)}$ is not even real, which is the first warning.
              The formula needs the exponent to fall away in both directions.
          - text: >
              The integral diverges: with $\alpha < 0$ the exponent
              $(x - 1)^{2} - 1$ grows without bound, and so does the integrand.
            correct: true
            feedback: >
              Right. Completing the square is still valid algebra, but the
              Gaussian integral needs $\alpha > 0$ — a downward-opening
              exponent. Here the integrand is at least $e^{-1}$ everywhere.
          - text: >
              The square was completed with the wrong sign; it should be
              $(x + 1)^{2}$.
            feedback: >
              $x^{2} - 2x = (x - 1)^{2} - 1$, so the square is right. The
              problem is not the algebra but the sign of $\alpha$.
        feedback: >
          The rewrite is always legitimate; what you conclude from it needs
          the sign of the leading coefficient. A positive one gives a minimum
          and, in an exponent with a minus sign in front, a finite Gaussian
          integral.
      - teach: >
          Asked to "find the vertex" or "maximize this quadratic" at a
          whiteboard, write the completed square and read off both answers:
          "$2(x - 3)^{2} + 5$, so the minimum is $5$, at $x = 3$." One line,
          and the reason it is a minimum is visible in it. Inside an
          exponent, the same line is the whole of the normal moment
          generating function.

  - node: quant-tools.optimization.quadratic-example
    hook: >
      This is the timed drill: hand a two-variable quadratic, produce the
      exact minimizer and minimum value in under two minutes, every time,
      mechanically.
    explanation: >
      The recipe is always the same four steps. Read the Hessian off the
      second partials directly — the coefficient of $x_i^2$ doubled on the
      diagonal, the coefficient of the cross term on the off-diagonal. Check
      positive definiteness with the $2\times2$ shortcut $a>0$, $ac-b^{2}>0$
      from Second-order conditions — this single check replaces having to
      compare against every other point in the plane. Solve the two linear
      equations $\nabla f=0$ for the minimizer. Then plug the minimizer back
      into $f$ for the value, or cross-check with the matrix formula
      $c-\tfrac{1}{2} b'A^{-1}b$.

      What makes this mechanical rather than clever is that steps one and two
      only ever need to be done once per problem — after that it's solving a
      $2\times2$ linear system, which is arithmetic, not insight.
    worked: >
      Minimize $f(x,y) = 3x^{2}-2xy+3y^{2}+4x-8y$. $\nabla f =
      (6x-2y+4,\;-2x+6y-8)=0$ gives $y=3x+2$ from the first equation; substituting,
      $-2x+6(3x+2)-8=0 \Rightarrow 16x=-4 \Rightarrow x^{*}=-1/4$, so
      $y^{*}=5/4$. The Hessian has rows $(6,-2)$ and $(-2,6)$: $a=6>0$,
      $ac-b^2=32>0$, positive definite, so this is the global minimum. The
      value is $f(-1/4,\,5/4) = -5.5$.
    interview: >
      Expect exactly this setup cold — a two-variable quadratic with no
      further structure — and the interviewer is timing whether you skip
      straight to the linear system instead of narrating the theory.
    pitfalls: >
      Skipping the positive-definiteness check and assuming any stationary
      point of a quadratic is automatically the minimum. Arithmetic slips
      solving the $2\times2$ system — substitute the answer back into both
      original gradient equations, not just the one used to eliminate a
      variable.
    recap: >
      Read off the Hessian, confirm positive definiteness, solve the
      $2\times2$ system, and the minimizer and minimum value fall out as plain
      arithmetic.
    dialogue:
      - part: Is there a minimum to find?
        ask: >
          Minimize $f(x, y) = x^{2} - 2xy + 3y^{2} - 2x - 10y$ over
          $\mathbb{R}^{2}$. Before solving anything, read off the Hessian. What
          is its off-diagonal entry?
        expects: "-2"
        hint: >
          The off-diagonal entry is $\partial^{2} f/\partial x \partial y$.
          Differentiate $-2xy$ once in each variable.
        feedback: >
          $\partial^{2}(-2xy)/\partial x \partial y = -2$. The diagonal entries
          double the squared coefficients: $2$ and $6$. So $H$ has rows
          $(2, -2)$ and $(-2, 6)$, the same at every point.
      - ask: >
          What is $ac - b^{2}$ for that Hessian?
        expects: "8"
        feedback: >
          $2 \cdot 6 - (-2)^{2} = 12 - 4 = 8 > 0$, and $a = 2 > 0$, so $H$ is
          positive definite everywhere. $f$ is strictly convex, and whatever
          stationary point you find next is the unique global minimum. One
          determinant replaced comparing against every other point of the
          plane.

      - part: Two equations, two unknowns
        teach: >
          With the Hessian settled, the rest is arithmetic. In the form
          $\tfrac{1}{2}x'Ax - b'x$, $A$ is the Hessian and $b = (2, 10)$, and
          $\nabla f = 0$ is the linear system $Ax = b$: one elimination, one
          back-substitution, one check.
      - ask: >
          The gradient is $(2x - 2y - 2,\ -2x + 6y - 10)$. Set it to zero and
          solve. What is $y^{*}$?
        expects: "3"
        hint: >
          The first equation gives $x = y + 1$. Substitute it into the second.
        feedback: >
          $-2(y + 1) + 6y - 10 = 0$ gives $4y = 12$, so $y^{*} = 3$.
      - ask: >
          And $x^{*}$?
        expects: "4"
        feedback: >
          $x^{*} = y^{*} + 1 = 4$. Check in the equation you did *not* use to
          eliminate: $-8 + 18 - 10 = 0$.
      - ask: >
          A colleague, rushing, reports the minimizer $(3, 2)$. What is
          $\partial f/\partial y$ at $(3, 2)$?
        expects: "-4"
        feedback: >
          $-6 + 12 - 10 = -4 \ne 0$, so $(3, 2)$ is not stationary. Notice
          that the *first* gradient component is $6 - 4 - 2 = 0$ there: a
          point that satisfies the equation used for elimination and not the
          other is the signature of an arithmetic slip. Always substitute into
          both.

      - part: The value, two ways
        ask: >
          What is the minimum value, $f(4, 3)$?
        expects: "-19"
        feedback: >
          $16 - 24 + 27 - 8 - 30 = -19$.
      - reflect: >
          In the form $\tfrac{1}{2}x'Ax - b'x$ this $f$ has $b = (2, 10)$, and
          $-\tfrac{1}{2}b'x^{*} = -\tfrac{1}{2}(8 + 30) = -19$ as well. Why
          must $f(x^{*}) = -\tfrac{1}{2}b'x^{*}$ hold at the minimizer of any
          such quadratic?
        hint: >
          Use the equation $x^{*}$ satisfies.
        answer: >
          $f(x^{*}) = \tfrac{1}{2}x^{*\prime}Ax^{*} - b'x^{*}$, and the
          stationarity condition says $Ax^{*} = b$. So the first term is
          $\tfrac{1}{2}x^{*\prime}b = \tfrac{1}{2}b'x^{*}$, and the value is
          $\tfrac{1}{2}b'x^{*} - b'x^{*} = -\tfrac{1}{2}b'x^{*}$. It costs one
          dot product, and agreeing with the direct substitution is a free
          check on both.
      - ask: >
          Change one coefficient: $3y^{2}$ becomes $y^{2}$, so
          $f = x^{2} - 2xy + y^{2} - 2x - 10y$. What is the minimum now?
        choices:
          - text: >
              It moves to a new point, found by solving the new gradient
              equations.
            feedback: >
              The new gradient equations are $2x - 2y = 2$ and
              $-2x + 2y = 10$, which say $x - y = 1$ and $x - y = -5$ at once.
              There is no stationary point to find.
          - text: >
              There is none: $f$ is unbounded below.
            correct: true
            feedback: >
              Right. The Hessian, rows $(2, -2)$ and $(-2, 2)$, has
              $ac - b^{2} = 0$, and $f = (x - y)^{2} - 2x - 10y$. Along
              $x = y = t$ that is $-12t$, which falls without bound.
          - text: >
              Still unique, since both diagonal entries are positive.
            feedback: >
              The determinant is $4 - 4 = 0$, so $H$ is singular. Along the
              direction $(1, 1)$ the quadratic part vanishes, and the linear
              part takes over.
        feedback: >
          The definiteness check is not ceremony. The same four-step routine
          on a singular Hessian finds nothing, and the honest answer is "no
          minimum".
      - teach: >
          Said in an interview, the whole problem is four clauses: "Hessian
          positive definite, so strictly convex; the linear system gives
          $(4, 3)$; the minimum is $-19$; and $-\tfrac{1}{2}b'x^{*}$ agrees."
          The interviewer is timing how quickly you get from the first clause
          to the linear system.

  - node: quant-tools.optimization.least-squares
    hook: >
      This is where "minimize a quadratic" and "fit a line" turn out to be the
      identical three lines of algebra — the reasoning behind every OLS
      regression a finance interview asks about.
    explanation: >
      $S(\beta) = \lVert y-X\beta\rVert^{2}$ expands to
      $y'y - 2\beta'X'y + \beta'X'X\beta$, which is quadratic in $\beta$ because
      $y-X\beta$ is affine in $\beta$ and squaring an affine function always
      produces a quadratic. Matching to the template
      $\tfrac{1}{2}\beta'A\beta-b'\beta+c$ gives $A=2X'X$ and $b=2X'y$ — and $X'X$
      is a Gram matrix, always positive semidefinite no matter what $X$ is, so
      $S$ is convex automatically, with no case-by-case check required the way
      a generic quadratic needs.

      Positive definiteness — needed for a unique minimizer — holds exactly
      when $X$ has full column rank; short of that, $X'X$ is only
      semidefinite and the minimizers form an affine set, matching the
      degenerate case of Minimizing a quadratic. Setting $\nabla S=0$ gives the
      normal equations $X'X\beta = X'y$, the linear system you actually solve.
      Geometrically the fitted values $X\hat\beta$ are the projection of $y$
      onto the column space of $X$, but you never need that picture to compute
      $\hat\beta$ — the normal equations alone finish the problem.
    worked: >
      Fit $y=\beta_0+\beta_1x$ to $(0,2), (1,3), (2,3), (3,6)$. $X'X$ has rows
      $(4,6)$ and $(6,14)$ (from $\sum 1$, $\sum x_i$, $\sum x_i^2$), and
      $X'y = (14, 27)$ (from $\sum y_i$, $\sum x_iy_i$). Solving
      $4\beta_0+6\beta_1=14$ and $6\beta_0+14\beta_1=27$ gives $\beta_1=1.2$
      and $\beta_0=1.7$: the fitted line is $y=1.7+1.2x$.
    interview: >
      "Why is least squares convex?" wants the Gram-matrix argument —
      $X'X$ is positive semidefinite for any $X$ — not a case-by-case
      Hessian check; "derive the normal equations" wants the gradient of the
      expanded quadratic set to zero.
    pitfalls: >
      Assuming a unique $\hat\beta$ exists without checking $X$ has full
      column rank — collinear regressors leave $X'X$ singular and the
      minimizer non-unique. Extending the automatic-convexity argument to a
      different loss function where no Gram-matrix structure backs it up.
    recap: >
      Fitting a line is minimizing one convex quadratic in $\beta$, and its
      first-order condition is the normal equations $X'X\beta=X'y$.
    dialogue:
      - part: Four points and a guessed line
        teach: >
          Four days of a signal $x$ and the next day's return $y$, in basis
          points: $(0, 1)$, $(1, 1)$, $(2, 2)$, $(3, 4)$. You want the line
          $y = \beta_0 + \beta_1 x$ that minimizes the sum of squared
          misses, $S(\beta_0, \beta_1) = \sum_i (y_i - \beta_0 - \beta_1 x_i)^{2}$.
      - ask: >
          Eyeballing it, a colleague proposes $y = x$. What is $S$ for that
          line?
        expects: "2"
        feedback: >
          The misses are $1 - 0 = 1$, $1 - 1 = 0$, $2 - 2 = 0$ and
          $4 - 3 = 1$, so $S = 1 + 0 + 0 + 1 = 2$. Whether some other line
          does better is the question.
      - reflect: >
          $S$ is a function of just two numbers, $\beta_0$ and $\beta_1$. What
          kind of function of them is it, and what does that tell you about
          how to find its minimum — and about whether what you find is the
          global minimum?
        hint: >
          Each miss $y_i - \beta_0 - \beta_1 x_i$ is affine in
          $(\beta_0, \beta_1)$.
        answer: >
          Each miss is affine in $\beta$, and squaring an affine function gives
          a quadratic, so $S$ is a quadratic in $\beta$. It is also a sum of
          squares of affine functions, hence convex. So the minimizing
          problem is a convex quadratic minimization: set the gradient to
          zero, which gives a linear system, and its solution is a global
          minimum.

      - part: The normal equations
        teach: >
          In matrix form, $X$ has a column of ones and a column of the $x_i$,
          and $S(\beta) = \lVert y - X\beta\rVert^{2} =
          y'y - 2\beta'X'y + \beta'X'X\beta$. That is the quadratic template
          with $A = 2X'X$ and $b = 2X'y$. The Hessian $2X'X$ is positive
          semidefinite for every $X$, since $\beta'X'X\beta =
          \lVert X\beta\rVert^{2} \ge 0$, and positive definite when $X$ has
          full column rank. Setting $\nabla S = 2X'X\beta - 2X'y = 0$ gives
          the normal equations $X'X\beta = X'y$.
      - ask: >
          $X'X$ has rows $(n, \sum x_i)$ and $(\sum x_i, \sum x_i^{2})$. Here
          $n = 4$ and $\sum x_i = 6$. What is $\sum x_i^{2}$?
        expects: "14"
        feedback: >
          $0 + 1 + 4 + 9 = 14$. So $X'X$ has rows $(4, 6)$ and $(6, 14)$, with
          determinant $56 - 36 = 20 > 0$: positive definite, one answer.
      - ask: >
          $X'y = (\sum y_i, \sum x_iy_i)$, and $\sum y_i = 8$. What is
          $\sum x_iy_i$?
        expects: "17"
        feedback: >
          $0 \cdot 1 + 1 \cdot 1 + 2 \cdot 2 + 3 \cdot 4 = 0 + 1 + 4 + 12 = 17$.
          The normal equations are $4\beta_0 + 6\beta_1 = 8$ and
          $6\beta_0 + 14\beta_1 = 17$.
      - ask: >
          Solve them. What is the slope $\hat\beta_1$?
        expects: "1"
        hint: >
          Multiply the first equation by $1.5$ and subtract it from the
          second.
        feedback: >
          $1.5$ times the first is $6\beta_0 + 9\beta_1 = 12$; subtracting
          from the second leaves $5\beta_1 = 5$, so $\hat\beta_1 = 1$.
      - ask: >
          And the intercept $\hat\beta_0$?
        expects: "0.5"
        feedback: >
          $4\beta_0 + 6 = 8$ gives $\hat\beta_0 = 0.5$. The fitted line is
          $y = 0.5 + x$ — the colleague's slope was right and the intercept
          was not.

      - part: What the fit satisfies, and when it is not unique
        ask: >
          What is $S$ for the fitted line $y = 0.5 + x$?
        expects: "1"
        feedback: >
          The misses are $0.5$, $-0.5$, $-0.5$ and $0.5$, so
          $S = 4 \cdot 0.25 = 1$, half the colleague's $2$. Convexity
          guarantees no line does better.
      - ask: >
          Those residuals, $0.5, -0.5, -0.5, 0.5$, add to exactly $0$. Why?
        choices:
          - text: >
              Coincidence of these four points.
            feedback: >
              It happens for every least-squares fit with an intercept. Change
              the data and the residuals still sum to $0$.
          - text: >
              The first normal equation says it: $\partial S/\partial\beta_0 =
              -2\sum_i (y_i - \beta_0 - \beta_1 x_i) = 0$.
            correct: true
            feedback: >
              Right. Setting the intercept's derivative to zero is literally
              "the residuals sum to zero". The second equation says
              $\sum_i x_i r_i = 0$: here $0 - 0.5 - 1 + 1.5 = 0$.
          - text: >
              Because the fitted line passes through every point on average,
              so each residual is small.
            feedback: >
              The residuals are not small relative to the data — they are
              $\pm 0.5$ on returns of $1$ to $4$. Their sum is zero by the
              first-order condition, whatever their size.
        feedback: >
          The normal equations say the residual vector is orthogonal to every
          column of $X$: to the ones column (the sum is zero) and to the $x$
          column. Geometrically, $X\hat\beta$ is the projection of $y$ onto
          the column space of $X$.
      - ask: >
          Suppose instead all four days had the same signal, $x_i = 2$. What
          happens to the fit?
        choices:
          - text: >
              It is unique: the normal equations always have one solution.
            feedback: >
              $X'X$ becomes rows $(4, 8)$ and $(8, 16)$, with determinant
              $64 - 64 = 0$. The system has many solutions or none, and here
              it has many.
          - text: >
              $S$ has no minimum, because $X'X$ is singular.
            feedback: >
              $S \ge 0$ always, and it is still convex. Singular $X'X$ breaks
              uniqueness, not existence: least squares always has a minimizer.
          - text: >
              Infinitely many lines fit equally well: every line through
              $(2, \bar y)$ has the same $S$.
            correct: true
            feedback: >
              Right. With the two columns of $X$ proportional, $X$ lacks full
              column rank, $X'X$ is only semidefinite, and the minimizers form
              a line in $(\beta_0, \beta_1)$ space. The data say nothing about
              the slope.
        feedback: >
          Full column rank is the condition for a unique $\hat\beta$.
          Collinear regressors in a real regression produce the same
          degeneracy, or a near-singular $X'X$ and wildly unstable
          coefficients.

  - node: quant-tools.optimization.lagrange
    hook: >
      Whenever "subject to" attaches a clean equality — weights sum to one, a
      budget is fully spent — Lagrange multipliers turn the constrained problem
      back into an ordinary first-order condition.
    explanation: >
      At a constrained optimum, moving along the constraint surface can't
      improve $f$ to first order — if it could, you'd move that way and do
      better while staying feasible, contradicting optimality. So $\nabla f$
      must have no component tangent to the surface, which means it lies
      entirely in the space spanned by the constraint gradients
      $\nabla g_1,\dots,\nabla g_m$ (the surface's normal directions): this is
      exactly the condition $\nabla f(x^{*}) = \sum_j \lambda_j \nabla
      g_j(x^{*})$.

      The Lagrangian $L(x,\lambda) = f(x)-\sum_j\lambda_j g_j(x)$ packages this
      as an ordinary unconstrained stationarity condition: setting every
      partial of $L$ to zero reproduces the gradient equation plus, from the
      $\lambda_j$ partials, the constraints themselves. That gives $n+m$
      equations in the $n$ coordinates and $m$ multipliers — solvable exactly
      like any other first-order system, once you remember the constraints are
      part of the system, not an afterthought.
    worked: >
      Maximize $f(x,y)=xy$ subject to $x+y=10$. $L=xy-\lambda(x+y-10)$ gives
      $y-\lambda=0$ and $x-\lambda=0$, so $x=y=\lambda$; the constraint
      $x+y=10$ then forces $x=y=5$, with maximum value $f(5,5)=25$.
    interview: >
      "Maximize this subject to a budget/weight constraint" is a direct cue to
      write the $n+m$-equation Lagrange system and solve it — don't try to
      substitute the constraint in by hand unless it's genuinely a one-liner.
    pitfalls: >
      Solving $\nabla f=\lambda\nabla g$ for $x$ in terms of $\lambda$ and
      forgetting to actually impose the constraint equation to pin $\lambda$
      down. Skipping the regularity check when constraint gradients could be
      linearly dependent or zero at a candidate point — the method can
      misidentify the optimum there.
    recap: >
      At a constrained optimum, the objective's gradient is a linear
      combination of the constraint gradients — solve that system together
      with the constraints.
    dialogue:
      - part: A risk budget on a circle
        teach: >
          Two uncorrelated signals get weights $x$ and $y$. The book's
          expected return is $f(x, y) = x + 2y$, and the risk budget fixes
          $x^{2} + y^{2} = 5$. You want the weights that maximize expected
          return on the budget.
      - ask: >
          Do it by substitution first. On the upper half of the circle,
          $y = \sqrt{5 - x^{2}}$, so you maximize $x + 2\sqrt{5 - x^{2}}$.
          Setting its derivative to zero, what $x$ do you get?
        expects: "1"
        hint: >
          The derivative is $1 - 2x/\sqrt{5 - x^{2}}$.
        feedback: >
          $\sqrt{5 - x^{2}} = 2x$ gives $5 - x^{2} = 4x^{2}$, so $x = 1$ and
          $y = 2$, with return $5$. It worked, at the price of a square root,
          a separate look at the lower half-circle, and a method that would
          drown with three signals and two budgets.
      - ask: >
          Look at the answer $(1, 2)$ from another angle. There
          $\nabla f = (1, 2)$, and the constraint function
          $g = x^{2} + y^{2} - 5$ has $\nabla g = (2x, 2y) = (2, 4)$. What
          multiple of $\nabla g$ is $\nabla f$?
        expects: "0.5"
        feedback: >
          $(1, 2) = 0.5 \cdot (2, 4)$. At the optimum the two gradients point
          along the same line. At a non-optimal point of the circle, say
          $(2, 1)$, they do not: $\nabla f = (1, 2)$ against
          $\nabla g = (4, 2)$.
      - reflect: >
          Why must $\nabla f$ be parallel to $\nabla g$ at a constrained
          optimum? Think about which directions you are allowed to move in,
          and what a component of $\nabla f$ along one of them would let you
          do.
        hint: >
          $\nabla g$ is perpendicular to the circle.
        answer: >
          Feasible moves run along the circle, perpendicular to $\nabla g$.
          If $\nabla f$ had any component along the circle, a small step that
          way would raise $f$ to first order while staying feasible, so the
          point was not optimal. At an optimum $\nabla f$ has no component
          along the constraint surface, so it lies along the normal:
          $\nabla f = \lambda \nabla g$ for some number $\lambda$.

      - part: Gradients in line
        teach: >
          That is the method of Lagrange multipliers. To optimize $f(x)$
          subject to $g_1(x) = 0, \dots, g_m(x) = 0$, solve
          $\nabla f(x) = \sum_j \lambda_j \nabla g_j(x)$ together with the $m$
          constraints: $n + m$ equations in $n + m$ unknowns. Equivalently,
          set every partial derivative of the Lagrangian
          $L(x, \lambda) = f(x) - \sum_j \lambda_j g_j(x)$ to zero. Two
          provisos: the $\nabla g_j$ must be linearly independent at the
          point, and the conditions are only necessary.
      - ask: >
          Minimize $x^{2} + y^{2} + 2z^{2}$ subject to $x + y + z = 5$. What
          is the minimum value?
        expects: "10"
        hint: >
          Stationarity gives $2x = \lambda$, $2y = \lambda$ and $4z = \lambda$.
          Express all three in terms of $\lambda$ and use the constraint.
        feedback: >
          $x = y = \lambda/2$ and $z = \lambda/4$, so the constraint reads
          $\lambda(1/2 + 1/2 + 1/4) = 5$, giving $\lambda = 4$ and
          $(x, y, z) = (2, 2, 1)$. The value is $4 + 4 + 2 = 10$. No square
          roots, and the third variable cost one more line.
      - ask: >
          Back to the circle. Lagrange's equations
          $(1, 2) = \lambda(2x, 2y)$ with $x^{2} + y^{2} = 5$ have two
          solutions, $(1, 2)$ and $(-1, -2)$. Which is the maximum?
        choices:
          - text: >
              Both: each satisfies the Lagrange conditions.
            feedback: >
              The conditions are necessary, not sufficient. They flag every
              point where $f$ is stationary along the circle — the top and the
              bottom alike.
          - text: >
              $(1, 2)$, with return $5$; $(-1, -2)$ gives $-5$, the minimum.
            correct: true
            feedback: >
              Right. Lagrange produces candidates; comparing the values of $f$
              on them picks the answer. The circle is closed and bounded, so
              both a maximum and a minimum exist among them.
          - text: >
              The one with $\lambda > 0$, since a positive multiplier means a
              maximum.
            feedback: >
              Here $(1, 2)$ does have $\lambda = 0.5$ and $(-1, -2)$ has
              $\lambda = -0.5$, but write the constraint as
              $5 - x^{2} - y^{2} = 0$ and both signs flip. For an equality
              constraint the sign of $\lambda$ is a convention.
        feedback: >
          The recipe: solve the system, evaluate $f$ at every solution, and
          compare.
      - ask: >
          Maximize $x + y$ subject to $xy = 1$ with $x, y > 0$. Lagrange's
          equations $(1, 1) = \lambda(y, x)$ give the single candidate
          $(1, 1)$, with $x + y = 2$. What is the maximum?
        choices:
          - text: >
              $2$: it is the only candidate, so it must be the answer.
            feedback: >
              $(10, 0.1)$ is feasible and gives $10.1$. A single candidate is
              the answer only if an optimum exists in the first place.
          - text: >
              There is none: $x + y$ is unbounded on the curve, and $(1, 1)$
              is the *minimum*.
            correct: true
            feedback: >
              Right. Along $(t, 1/t)$ the sum is $t + 1/t$, which grows without
              bound as $t \to \infty$ and is smallest, $2$, at $t = 1$. The
              Lagrange point is real; it just answers the other question.
          - text: >
              $2$, because $\lambda = 1 > 0$ marks a maximum.
            feedback: >
              The sign of an equality multiplier marks nothing. And
              $(4, 0.25)$ already gives $4.25 > 2$.
        feedback: >
          When the feasible set is unbounded, Lagrange cannot tell you an
          optimum exists. Rule out escape to infinity separately.

      - part: When the constraint has no normal
        ask: >
          Minimize $x^{2} + y^{2}$ subject to $(x + y - 2)^{2} = 0$, which is
          just the line $x + y = 2$ written strangely. The answer is $(1, 1)$.
          With $g = (x + y - 2)^{2}$, what is the first component of
          $\nabla g(1, 1)$?
        expects: "0"
        feedback: >
          $\nabla g = 2(x + y - 2)(1, 1)$, which is $(0, 0)$ everywhere on the
          line. Then $\nabla f(1, 1) = (2, 2) = \lambda \cdot (0, 0)$ has no
          solution: the true minimum fails Lagrange's equations. The
          regularity proviso — linearly independent, in particular nonzero,
          constraint gradients — is exactly what broke.
      - ask: >
          Rewrite the constraint as $x + y - 2 = 0$. What multiplier
          $\lambda$ makes $\nabla f(1, 1) = \lambda \nabla g(1, 1)$?
        expects: "2"
        feedback: >
          Now $\nabla g = (1, 1)$, and $(2, 2) = 2 \cdot (1, 1)$, so
          $\lambda = 2$. Same feasible set, a regular description of it, and
          the method works again.
      - teach: >
          In an interview, write the Lagrangian, set its partials to zero, and
          solve — then say the two sentences that show you know the method's
          limits: "these conditions are necessary, so I compared the
          candidates", and "the constraint gradient is nonzero at the answer".

  - node: quant-tools.optimization.shadow-price
    hook: >
      This is where the number $\lambda$ that falls out of a Lagrange system
      stops being algebra and becomes what a desk means by "the marginal value
      of one more unit of risk budget."
    explanation: >
      Write $V(c)$ for the optimal value as a function of the constraint level,
      $g(x)=c$. The total derivative $dV/dc$ splits into a direct effect
      (how $f$ changes with $c$ holding $x$ fixed — zero here, since $c$ only
      enters through the constraint) and an indirect effect through the moving
      optimizer $x^{*}(c)$: $dV/dc = \nabla f(x^{*})'\,dx^{*}/dc$. Substituting
      the stationarity condition $\nabla f(x^{*})=\lambda\nabla g(x^{*})$ gives
      $dV/dc = \lambda\,\nabla g(x^{*})'dx^{*}/dc$, and differentiating the
      constraint $g(x^{*}(c))=c$ itself gives $\nabla g(x^{*})'dx^{*}/dc = 1$ —
      so the indirect effect collapses to exactly $\lambda$. The movement of
      $x^{*}$ contributes nothing beyond that, because the first-order
      condition was built to make it vanish.

      That's the envelope theorem in miniature, and it's why $\lambda$ carries
      units of objective per unit of constraint: it prices exactly how much
      slack in the constraint is worth, to first order.
    worked: >
      Maximize $f(x,y)=xy$ subject to $x+y=c$. The Lagrangian
      $L=xy-\lambda(x+y-c)$ gives $y=\lambda$ and $x=\lambda$, and the
      constraint then forces $x=y=c/2$, so $V(c)=c^{2}/4$ and $\lambda=c/2$. At
      $c=10$, $\lambda=5$ and $V(10)=25$; raising the budget to $c=10.1$ gives
      $V(10.1)=102.01/4=25.5025$, a gain of about $0.5$ — matching
      $\lambda\times0.1=0.5$ to first order.
    interview: >
      "What does the multiplier mean economically?" is asked constantly around
      Kelly staking, portfolio risk budgets, and VaR limits — the expected
      answer is "marginal value of one more unit of the constrained resource,"
      stated cold.
    pitfalls: >
      Quoting a shadow price without stating the sign convention used to write
      $L$ — $f-\lambda(g-c)$ versus $f-\lambda g$ flips the sign of $\lambda$.
      Treating $\lambda$ as a fixed constant rather than a function of $c$ —
      the interpretation is only a first-order, local statement, not a promise
      that doubling the budget doubles the benefit.
    recap: >
      The multiplier equals $dV/dc$: exactly how much the optimal value
      improves per unit of relaxation in the constraint.
    dialogue:
      - part: Capital split two ways
        teach: >
          A desk splits $c = 20$ units of capital between two strategies,
          $x$ and $y$, with expected profit $f(x, y) = 2\sqrt{x} + 4\sqrt{y}$.
          With $L = f - \lambda(x + y - c)$, stationarity gives
          $1/\sqrt{x} = \lambda$ and $2/\sqrt{y} = \lambda$.
      - ask: >
          Solve for the optimal allocation. What is $x^{*}$?
        expects: "4"
        hint: >
          The two equations together say $\sqrt{y} = 2\sqrt{x}$.
        feedback: >
          $\sqrt{y} = 2\sqrt{x}$ means $y = 4x$, and $x + 4x = 20$ gives
          $x^{*} = 4$, $y^{*} = 16$.
      - ask: >
          What is the optimal profit $V(20)$?
        expects: "20"
        feedback: >
          $2\sqrt{4} + 4\sqrt{16} = 4 + 16 = 20$.
      - ask: >
          And the multiplier $\lambda$?
        expects: "0.5"
        feedback: >
          $\lambda = 1/\sqrt{x^{*}} = 1/2$, and $2/\sqrt{16}$ agrees. So far
          it is just a number that made the equations solvable.

      - part: One more unit of capital
        ask: >
          Risk grants one more unit, $c = 21$. Re-solve: $y = 4x$ still, so
          $x^{*} = 21/5$. What is the new optimal profit, to three decimal
          places?
        expects: "20.494"
        tolerance: 0.001
        feedback: >
          $x^{*} = 4.2$, $y^{*} = 16.8$, and
          $V(21) = 2\sqrt{4.2} + 4\sqrt{16.8} \approx 4.099 + 16.395 = 20.494$.
          The extra unit was worth about $0.494$ — almost exactly
          $\lambda = 0.5$.
      - reflect: >
          That is no coincidence. When $c$ rises, the optimal $x^{*}$ and
          $y^{*}$ both move, and $f$ changes through each of them. Why does
          all that movement add up to just $\lambda$ per unit of $c$?
        hint: >
          Write $dV/dc = \nabla f'\,dx^{*}/dc$, then use the stationarity
          condition, and differentiate the constraint $g(x^{*}(c)) = c$.
        answer: >
          $dV/dc = \nabla f(x^{*})'\,dx^{*}/dc$. Stationarity says
          $\nabla f = \lambda \nabla g$, so this is
          $\lambda\,\nabla g'\,dx^{*}/dc$. Differentiating the constraint
          $g(x^{*}(c)) = c$ gives $\nabla g'\,dx^{*}/dc = 1$. So
          $dV/dc = \lambda$: the optimizer's movement contributes nothing
          beyond it, because at the optimum $f$ is flat along every feasible
          direction.
      - teach: >
          The multiplier is a shadow price. With the convention
          $L = f - \lambda(g - c)$, $V'(c) = \lambda^{*}(c)$: the marginal
          value of one more unit of the constrained resource, in units of
          objective per unit of constraint. The general form is the envelope
          theorem: if $f$ and $g$ depend on a parameter $\theta$, then
          $dV/d\theta = \partial L/\partial\theta$ at the optimum.

      - part: Reading and using the price
        ask: >
          For the desk, $V(c) = 2\sqrt{5c}$. What is $V'(20)$?
        expects: "0.5"
        hint: >
          $V'(c) = \sqrt{5}/\sqrt{c}$.
        feedback: >
          $V'(20) = \sqrt{5/20} = 0.5$, equal to $\lambda$, exactly as the
          envelope argument promises. The re-solve at $c = 21$ gained
          $0.494$, not $0.5$, because $V$ bends: the price is a derivative,
          a first-order statement.
      - ask: >
          A colleague writes $L = f + \mu(x + y - 20)$ and reports
          $\mu = -0.5$. Who is right about the value of capital?
        choices:
          - text: >
              Both. The two Lagrangians differ only in sign convention, so
              $\mu = -\lambda$; the marginal value is $0.5$ either way.
            correct: true
            feedback: >
              Right. The equality multiplier's sign is pure convention. The
              economics — one more unit adds about $0.5$ — is the same; quote
              it with the convention attached.
          - text: >
              The colleague: a negative multiplier means extra capital lowers
              profit.
            feedback: >
              Re-solving at $c = 21$ raised profit by $0.494$. The minus sign
              came from writing $+\mu$ where you wrote $-\lambda$.
          - text: >
              You: multipliers are always positive.
            feedback: >
              For an equality constraint a multiplier can have either sign;
              which sign you see depends on how the Lagrangian was written.
        feedback: >
          State the convention whenever you quote a shadow price. Without it
          the number means nothing.
      - ask: >
          Capital can be borrowed at a cost of $0.6$ per unit. Should the desk
          borrow one more unit?
        choices:
          - text: >
              Yes: more capital always means more profit.
            feedback: >
              More profit, but only about $0.5$ more, and the unit costs
              $0.6$. Net, the desk loses about $0.1$.
          - text: >
              No: the unit adds about $\lambda = 0.5$ of profit and costs
              $0.6$.
            correct: true
            feedback: >
              Right. Compare the shadow price with the market price of the
              resource: buy when $\lambda$ exceeds it, sell when it falls
              short.
          - text: >
              Cannot tell without re-solving the whole problem.
            feedback: >
              That is what $\lambda$ saves you. To first order the answer is
              already on the page: $0.5 < 0.6$.
        feedback: >
          This is how desks use multipliers: a risk limit, a capital budget or
          a leverage cap each carries a price, and the price says whether
          relaxing it is worth paying for.
      - ask: >
          Someone extrapolates: at $0.5$ per unit, doubling capital to
          $c = 40$ should lift profit to $20 + 20 \cdot 0.5 = 30$. What is
          $V(40)$ actually, to two decimal places?
        expects: "28.28"
        tolerance: 0.01
        feedback: >
          $V(40) = 2\sqrt{200} \approx 28.28$. The price itself falls as
          capital grows — $\lambda(40) = \sqrt{5/40} \approx 0.354$ — so a
          price quoted at $c = 20$ is good for small changes around $20$ and
          overstates large ones.

  - node: quant-tools.optimization.lagrange-example
    hook: >
      "Nearest point to a plane" and "minimum-variance point on a budget line"
      are the same computation, and recognizing that pattern instantly beats
      re-deriving Lagrange from scratch every time it appears.
    explanation: >
      Minimizing $\lVert x\rVert^{2}$ subject to a single linear constraint
      $a'x=c$ always resolves the same way: stationarity gives
      $2x_i=\lambda a_i$ for every coordinate, so $x=(\lambda/2)a$ — the
      minimizer is forced to be proportional to $a$ before you even use the
      constraint. Dotting both sides with $a$ and imposing $a'x=c$ then pins
      down $\lambda$, giving the closed form $x^{*}=c\,a/\lVert a\rVert^{2}$
      directly, with no need to re-run the Lagrangian each time this shape of
      problem appears.

      Spotting "minimize a sum of squares subject to one linear constraint" as
      this pattern, rather than as a generic Lagrange problem, is what turns a
      multi-step derivation into a formula lookup.
    worked: >
      Minimize $f(x,y)=x^{2}+y^{2}$ subject to $2x+y=10$. With $a=(2,1)$,
      $c=10$: $\lVert a\rVert^{2}=5$, so $x^{*}=10(2,1)/5=(4,2)$, value
      $16+4=20$. Direct Lagrange confirms it: $L=x^2+y^2-\lambda(2x+y-10)$
      gives $x=\lambda$, $y=\lambda/2$, and the constraint
      $2\lambda+\lambda/2=10$ gives $\lambda=4$, matching $(4,2)$; the shadow
      price check $V(c)=c^2/5$ gives $V'(10)=4=\lambda$.
    interview: >
      "Find the point on this line closest to the origin" is a recurring
      geometry-flavored Lagrange question — quote the proportional-to-$a$
      shortcut first, with the full Lagrangian as backup if you're pressed to
      justify it.
    pitfalls: >
      Reporting the squared distance ($20$ here) when the question asked for
      distance itself ($\sqrt{20}=2\sqrt5$). Sign errors moving the constraint
      constant to the wrong side of $a'x=c$, which propagates straight into
      $x^{*}$.
    recap: >
      Minimizing a sum of squares subject to one linear constraint always
      lands on $x^{*}=c\,a/\lVert a\rVert^{2}$, here $(4,2)$ at value $20$.
    dialogue:
      - part: An exposure target at least cost
        teach: >
          A rebalance trades $x$, $y$ and $z$ units of three contracts, which
          move the book's exposure by $2$, $1$ and $2$ per unit. The trade must
          shift exposure by exactly $18$: $2x + y + 2z = 18$. Market impact
          makes the trade cost $x^{2} + y^{2} + z^{2}$.
      - ask: >
          The obvious first try: do the whole shift in the first contract.
          What does that cost?
        expects: "81"
        feedback: >
          $2x = 18$ needs $x = 9$, costing $81$. Squared costs punish
          concentration: splitting a trade into pieces cuts the cost of each
          piece faster than it multiplies the pieces.
      - ask: >
          Spread it evenly instead, $x = y = z$. What does that cost?
        expects: "38.88"
        feedback: >
          $2t + t + 2t = 18$ gives $t = 3.6$, and the cost is
          $3 \cdot 3.6^{2} = 38.88$ — less than half of $81$. Whether an
          uneven split does better still is what the multiplier will decide.
      - ask: >
          With $L = x^{2} + y^{2} + z^{2} - \lambda(2x + y + 2z - 18)$,
          stationarity gives $2x = 2\lambda$, $2y = \lambda$ and
          $2z = 2\lambda$. Before using the constraint, what shape does that
          force on the optimal trade?
        choices:
          - text: >
              Equal amounts of each contract.
            feedback: >
              The equations give $x = \lambda$, $y = \lambda/2$, $z = \lambda$:
              the middle contract gets half as much. Equal sizes ignore that
              it moves exposure only half as far.
          - text: >
              Only the two contracts with the larger exposure, $2$ per unit.
            feedback: >
              Leaving $y$ at zero wastes it: with squared costs, the first
              unit of any contract is nearly free. Stationarity gives
              $y = \lambda/2$, not $0$.
          - text: >
              Proportional to the exposures: $(x, y, z) = (\lambda/2)(2, 1, 2)$.
            correct: true
            feedback: >
              Right. Each contract is traded in proportion to how much
              exposure it delivers, and the constraint only has to fix the
              scale.
        feedback: >
          The direction of the answer came from stationarity alone; the
          constraint is left to pin down one number, $\lambda$.

      - part: Solving it to a number
        ask: >
          Substitute $(\lambda, \lambda/2, \lambda)$ into the constraint. What
          is $\lambda$?
        expects: "4"
        feedback: >
          $2\lambda + \lambda/2 + 2\lambda = 4.5\lambda = 18$, so
          $\lambda = 4$ and the trade is $(4, 2, 4)$.
      - ask: >
          What does the optimal trade cost?
        expects: "36"
        feedback: >
          $16 + 4 + 16 = 36$, against $81$ for the one-contract trade. The
          objective is strictly convex and the constraint affine, so this
          single Lagrange point is the global minimum.
      - reflect: >
          Do it once in general. Minimize $\lVert x\rVert^{2}$ subject to
          $a'x = c$. What are $x^{*}$ and the minimum value, in terms of $a$
          and $c$, and what is the geometry behind the answer?
        hint: >
          Stationarity gives $2x = \lambda a$. Dot both sides with $a$.
        answer: >
          $x = (\lambda/2)a$, and $a'x = c$ gives
          $(\lambda/2)\lVert a\rVert^{2} = c$, so
          $x^{*} = c\,a/\lVert a\rVert^{2}$ with value
          $c^{2}/\lVert a\rVert^{2}$. Here $\lVert a\rVert^{2} = 9$, giving
          $18 \cdot (2, 1, 2)/9 = (4, 2, 4)$ and $324/9 = 36$. Geometrically,
          $a$ is the normal to the plane $a'x = c$, and the nearest point of
          a plane to the origin lies along its normal.

      - part: Pricing the target, and reading the answer
        ask: >
          The target rises from $18$ to $19$. What is the new minimum cost, to
          two decimal places?
        expects: "40.11"
        tolerance: 0.01
        feedback: >
          $V(c) = c^{2}/9$, so $V(19) = 361/9 \approx 40.11$. The shadow price
          predicted $36 + \lambda \cdot 1 = 40$, and indeed
          $V'(18) = 2 \cdot 18/9 = 4 = \lambda$. The small excess, $0.11$, is
          the curvature of $V$.
      - ask: >
          Read the problem as geometry: what is the distance from the origin
          to the plane $2x + y + 2z = 18$?
        expects: "6"
        feedback: >
          The minimum of $\lVert x\rVert^{2}$ is the *squared* distance, $36$,
          so the distance is $6$ — also $|c|/\lVert a\rVert = 18/3$. Reporting
          $36$ for "distance" is the standard slip.
      - ask: >
          Suppose the third contract is less liquid, so the cost becomes
          $x^{2} + y^{2} + 2z^{2}$. Is the optimal trade still proportional to
          $(2, 1, 2)$?
        choices:
          - text: >
              Yes: the constraint has not changed, so neither does the shape.
            feedback: >
              The shape came from stationarity, which involves the cost. Now
              $4z = 2\lambda$, so $z = \lambda/2$ rather than $\lambda$.
          - text: >
              No: each contract is traded in proportion to its exposure
              divided by its cost weight, here $(2, 1, 2/2) = (2, 1, 1)$.
            correct: true
            feedback: >
              Right. Stationarity gives $x = \lambda$, $y = \lambda/2$,
              $z = \lambda/2$. The illiquid contract carries less of the trade,
              and the constraint $3.5\lambda = 18$ then fixes the scale.
          - text: >
              No: the illiquid contract should not be traded at all.
            feedback: >
              With a squared cost its first units are still cheap. It gets a
              smaller share, $z = \lambda/2$, not none.
        feedback: >
          "Proportional to $a$" is the special case of equal cost weights. In
          an interview, quote $x^{*} = c\,a/\lVert a\rVert^{2}$ for that case,
          and say where the weights would enter if they differed.

  - node: quant-tools.optimization.kkt
    hook: >
      The moment "subject to" turns into an inequality — a budget that need
      only be met, a no-short constraint — Lagrange's equality machinery isn't
      enough, and the sign of the multiplier is exactly what an interviewer
      probes.
    explanation: >
      KKT extends the Lagrangian $L=f+\sum_i\mu_ig_i+\sum_j\lambda_jh_j$ with
      two new conditions beyond ordinary stationarity and feasibility. Dual
      feasibility $\mu_i\ge0$ holds because relaxing a binding inequality
      $g_i(x)\le0$ — loosening the bound — only ever enlarges the feasible set,
      so the optimal value can only improve, never worsen; the shadow price of
      an inequality constraint can't be negative the way an equality's sign is
      a free convention. Complementary slackness $\mu_i\,g_i(x^{*})=0$ says
      each inequality is either binding, with a nonnegative price attached, or
      strictly slack, in which case its multiplier is forced to zero because a
      constraint that doesn't touch the boundary can't be pulling on the
      gradient balance.

      The practical recipe is to guess which inequalities are active, solve
      the resulting equality-constrained problem, then verify the guess: check
      $\mu_i\ge0$ for every guessed-active constraint and feasibility for every
      guessed-slack one. A failed check means the guess was wrong, not that the
      method failed.
    worked: >
      Minimize $f(x,y)=(x-3)^{2}+(y-3)^{2}$ subject to $x+y\le4$, $x\ge0$,
      $y\ge0$. The unconstrained minimum $(3,3)$ violates $x+y\le4$, so guess
      only that constraint binds. With $L=f+\mu(x+y-4)$: stationarity gives
      $x=y=3-\mu/2$, and the active constraint $x+y=4$ gives $\mu=2$, so
      $(x,y)=(2,2)$. Check: $\mu=2\ge0$ (valid) and $x,y\ge0$ hold strictly, so
      those multipliers are correctly $0$ by complementary slackness. Minimum
      value is $f(2,2)=1+1=2$.
    interview: >
      Portfolio problems with a budget and no-short constraints are the
      standard setting — expect to guess the active set, solve, and defend the
      guess with $\mu\ge0$ and complementary slackness rather than solving a
      generic nonlinear program blind.
    pitfalls: >
      Getting the required sign of $\mu$ backwards for a maximization or for
      the opposite inequality direction — always re-derive which sign helps
      the objective rather than memorizing one sign. Trusting a guessed active
      set without verifying $\mu\ge0$ and primal feasibility — a failed check
      means try a different active set, not that the answer stands anyway.
    recap: >
      KKT adds nonnegative multipliers and complementary slackness to
      Lagrange: each inequality either binds with a nonnegative price or sits
      slack with multiplier zero.
    dialogue:
      - part: A cap that binds, and one that does not
        ask: >
          A position would ideally be $5$, and holding $x$ instead costs
          $(x - 5)^{2}$. A risk cap requires $x \le 3$. What is the smallest
          cost you can achieve?
        expects: "4"
        feedback: >
          The cost falls all the way up to the cap, so the best feasible
          point is $x = 3$, costing $(3 - 5)^{2} = 4$. The cap binds: it
          holds with equality at the answer.
      - ask: >
          Treat the binding cap like a Lagrange constraint, with
          $L = (x - 5)^{2} + \mu(x - 3)$. Stationarity at $x = 3$ fixes $\mu$.
          What is it?
        expects: "4"
        feedback: >
          $2(3 - 5) + \mu = 0$ gives $\mu = 4$. Read it as a price: raising
          the cap to $3 + \delta$ lowers the cost by about $4\delta$, since
          the slope of $(x - 5)^{2}$ at $3$ is $-4$.
      - ask: >
          Now the cap is $x \le 7$ instead. What multiplier does it carry at
          the optimum?
        expects: "0"
        feedback: >
          The best point is $x = 5$, which satisfies $x \le 7$ with room to
          spare. Moving the cap a little changes nothing, so its price is
          $0$, and stationarity is just $2(x - 5) = 0$.

      - part: The sign of the price
        ask: >
          A colleague, not noticing that the $x \le 7$ cap is slack, forces it
          to bind: $x = 7$, and stationarity $2(7 - 5) + \mu = 0$ gives
          $\mu = -4$. What does the negative sign tell you?
        choices:
          - text: >
              Nothing: a multiplier's sign is a convention, as with equality
              constraints.
            feedback: >
              For an inequality written as $g(x) \le 0$ with $+\mu g$ in the
              Lagrangian, the sign means something. $\mu = -4$ claims that
              loosening the cap would *raise* the cost, and loosening a
              constraint can never hurt a minimization.
          - text: >
              That forcing $x = 7$ is wrong: the cap is pushing $x$ the wrong
              way, so it should not bind.
            correct: true
            feedback: >
              Right. At $x = 7$ the cost would fall by moving *left*, back
              inside the cap. A binding constraint can only push you away from
              where you want to go, which shows up as $\mu \ge 0$.
          - text: >
              That $x = 7$ is a maximum rather than a minimum.
            feedback: >
              $(x - 5)^{2}$ has no maximum on $x \le 7$ at all — it grows as
              $x \to -\infty$. The sign is diagnosing a wrong guess about
              which constraints bind.
        feedback: >
          A negative multiplier on an inequality is a failed check: drop that
          constraint from the binding set and solve again.
      - reflect: >
          From the three caps: when was the multiplier $0$, when was it
          positive, and why can it never be negative? Say it as a rule
          connecting $\mu$ to whether the constraint holds with equality.
        answer: >
          A slack constraint ($x < 7$ at the answer) has $\mu = 0$; a binding
          one ($x = 3$) can have $\mu > 0$. So always $\mu \cdot g(x^{*}) = 0$:
          either the constraint binds or its price is zero. And
          $\mu \ge 0$, because $\mu$ is the value of loosening the constraint,
          and loosening an inequality only enlarges the feasible set, which
          cannot make the minimum worse.
      - teach: >
          These are the KKT conditions. For minimizing $f(x)$ subject to
          $g_i(x) \le 0$ and $h_j(x) = 0$, write
          $L = f + \sum_i \mu_i g_i + \sum_j \lambda_j h_j$. Under a
          constraint qualification, a local minimizer satisfies stationarity
          $\nabla_x L = 0$, primal feasibility, dual feasibility
          $\mu_i \ge 0$, and complementary slackness $\mu_i g_i(x^{*}) = 0$.
          When $f$ and the $g_i$ are convex, the $h_j$ affine, and some point
          is strictly feasible, the conditions are also sufficient.

      - part: Guess the binding set, then check it
        ask: >
          Minimize $(x - 5)^{2} + (y - 2)^{2}$ subject to $x + y \le 4$,
          $x \ge 0$, $y \ge 0$. The unconstrained best, $(5, 2)$, has
          $x + y = 7$, so guess that only $x + y \le 4$ binds. With
          $L = f + \mu(x + y - 4)$, what is $\mu$?
        expects: "3"
        hint: >
          Stationarity gives $2(x - 5) + \mu = 0$ and $2(y - 2) + \mu = 0$, so
          $x - 5 = y - 2$. Combine with $x + y = 4$.
        feedback: >
          $x = y + 3$ and $x + y = 4$ give $y = 0.5$, $x = 3.5$, and then
          $\mu = 2(5 - 3.5) = 3 \ge 0$. Dual feasibility holds, and $x$, $y$
          are strictly positive, so the guessed-slack constraints are
          satisfied with zero multipliers. The guess checks out.
      - ask: >
          What is the minimum value?
        expects: "4.5"
        feedback: >
          $(3.5 - 5)^{2} + (0.5 - 2)^{2} = 2.25 + 2.25 = 4.5$.
      - ask: >
          Someone guesses instead that $y \ge 0$ binds too, so $y = 0$ and
          $x = 4$. Writing $y \ge 0$ as $-y \le 0$ with multiplier $\nu$,
          stationarity gives $\mu = 2$ and $\nu = -2$. What follows?
        choices:
          - text: >
              The guess is wrong: $\nu < 0$ violates dual feasibility, so
              $y \ge 0$ should be slack.
            correct: true
            feedback: >
              Right. And the evidence agrees: $f(4, 0) = 1 + 4 = 5$, worse
              than $4.5$. The constraint $y \ge 0$ was being forced to pull
              $y$ down when the objective wants $y$ larger.
          - text: >
              Both points satisfy KKT, so report the lower value.
            feedback: >
              $(4, 0)$ does not satisfy KKT: dual feasibility requires
              $\nu \ge 0$. Only $(3.5, 0.5)$ passes every condition.
          - text: >
              The negative multiplier means $y \ge 0$ should be dropped from
              the problem entirely.
            feedback: >
              It means $y \ge 0$ should be *slack* at the answer, not deleted:
              the constraint still applies, it just is not active. At
              $(3.5, 0.5)$ it holds strictly.
        feedback: >
          The recipe: guess the binding set, solve the equality problem,
          then verify — $\mu \ge 0$ on every guessed-binding constraint,
          feasibility on every guessed-slack one. A failed check names the
          next guess.
      - ask: >
          Why can you call $(3.5, 0.5)$ the global minimum, and not just a
          point satisfying necessary conditions?
        choices:
          - text: >
              Because it is the only point found so far.
            feedback: >
              One candidate in hand proves nothing about points you have not
              examined. The certificate has to come from the structure of the
              problem.
          - text: >
              Because $\mu = 3$ is positive.
            feedback: >
              A positive multiplier says the constraint binds and is worth
              relaxing. It does not, by itself, certify optimality.
          - text: >
              Because $f$ is convex, the constraints are affine, and a strictly
              feasible point such as $(1, 1)$ exists, so KKT is sufficient.
            correct: true
            feedback: >
              Right. For a convex problem with a strictly feasible point, any
              KKT point is a global minimum — the same promotion from
              necessary to sufficient that convexity gave the first-order
              condition.
        feedback: >
          In an interview, say all of it: "guessed the budget binds, got
          $\mu = 3 \ge 0$, the other constraints are slack with zero
          multipliers, and the problem is convex, so this is the optimum."

  - node: quant-tools.optimization.flat-optimum
    hook: >
      This is why a desk doesn't sweat rounding a stake or a hedge ratio, but
      does sweat covariance-estimation noise driving huge swings in an
      "optimal" portfolio.
    explanation: >
      At an interior optimum the gradient term of the Taylor expansion
      vanishes, leaving $f(x^{*}+h) - f(x^{*}) \approx \tfrac{1}{2} h'Hh$: a
      relative error of size $\varepsilon$ in your choice of $x$ costs order
      $\varepsilon^{2}$ in the objective, not order $\varepsilon$. That
      quadratic — not linear — falloff is why inputs to an optimizer can
      tolerate more slop than the optimizer's own precision suggests: a
      slightly wrong stake or a rounded hedge ratio gives up very little.

      The same fact runs backward and turns unfriendly: because the objective
      resists movement of $x$ near the optimum, it's correspondingly
      uninformative about exactly where $x^{*}$ sits, so noise in the data used
      to build $f$ — an estimated covariance matrix, say — can move the
      inferred optimum a long way even though the objective value barely
      changes. This is precisely why portfolio weights coming out of an
      optimizer run on noisy covariance estimates are so much less stable than
      the smoothness of the objective would suggest.
    worked: >
      Maximize $f(x) = x(20-x)$: $f'(x)=20-2x=0$ gives $x^{*}=10$,
      $f(10)=100$. A $30\%$-high input, $x=13$, gives $f(13)=13\cdot7=91$, a
      loss of $9\%$ — exactly $0.3^{2}$, matching the $\varepsilon^{2}$ scaling
      precisely because $f$ is exactly quadratic here.
    interview: >
      "How sensitive is the optimal value to a small error in your inputs,
      versus how sensitive is the optimal decision itself?" is the standard
      framing — the objective is quadratically forgiving, the argmax is not,
      and the two answers are opposite in character.
    pitfalls: >
      Extending the "small errors cost little" comfort to the data that builds
      $f$ itself — noisy inputs move where the optimum sits, sometimes
      substantially, precisely because the objective doesn't resist that
      motion. Assuming the $\varepsilon^{2}$ scaling near a boundary or kink
      optimum, where the gradient needn't vanish and first-order costs can
      appear instead.
    recap: >
      Near an optimum the objective is quadratically flat — cheap to
      misjudge — while the location of the optimum itself is correspondingly
      hard to pin down from noisy data.
    dialogue:
      - part: A price set twenty percent too high
        teach: >
          A market maker quoting price $p$ earns expected revenue
          $R(p) = p\,e^{-p/2}$ per client: higher prices earn more per trade
          and win fewer trades. $R$ peaks at $p = 2$. A stale model makes you
          quote $p = 2.4$, twenty percent too high.
      - ask: >
          Before computing anything, roughly what fraction of the peak revenue
          does the twenty percent error cost you?
        choices:
          - text: >
              About $20\%$: the error passes straight through.
            feedback: >
              That would be true if $R$ were sloped at $p = 2$. At the peak
              the slope is zero, so a small error in $p$ costs much less than
              proportionally.
          - text: >
              About $10\%$.
            feedback: >
              Still treating the cost as proportional to the error, just with
              a smaller constant. The scaling itself is different.
          - text: >
              About $2\%$.
            correct: true
            feedback: >
              Right, as the next computation shows. Near a peak the loss scales
              like the *square* of the error, and $0.2^{2} = 0.04$ is already
              small before any constant.
          - text: >
              Nothing at all: the peak is flat.
            feedback: >
              Flat to first order, not flat. The curvature still charges you
              something, and here it is about $2\%$.
        feedback: >
          The prediction to test: errors in the input cost far less than their
          size in the output.
      - ask: >
          Compute $R(2.4)/R(2)$, to four decimal places.
        expects: "0.9825"
        tolerance: 0.0005
        hint: >
          The ratio simplifies to $1.2\,e^{-0.2}$.
        feedback: >
          $R(2.4)/R(2) = (2.4/2)\,e^{-(2.4 - 2)/2} = 1.2\,e^{-0.2} \approx
          1.2 \cdot 0.8187 = 0.9825$. A twenty percent error in the price costs
          $1.75\%$ of revenue.
      - ask: >
          Now a ten percent error, $p = 2.2$. What fraction of peak revenue is
          lost? Give a decimal to four places.
        expects: "0.0047"
        tolerance: 0.0002
        feedback: >
          $1.1\,e^{-0.1} \approx 1.1 \cdot 0.90484 = 0.99532$, a loss of about
          $0.0047$. Halving the error cut the loss from $0.0175$ to $0.0047$,
          by a factor of about $3.7$ — close to the $4$ that a squared error
          predicts.

      - part: Why the top of a hill is flat
        reflect: >
          Halve the error and the loss falls about fourfold. Explain the
          square, using the expansion of $R$ around its peak.
        hint: >
          Write $R(p^{*} + h) = R(p^{*}) + R'(p^{*})h + \tfrac{1}{2}R''(p^{*})h^{2}
          + \dots$ and ask which term is missing.
        answer: >
          At the peak $R'(p^{*}) = 0$, so the linear term vanishes and
          $R(p^{*} + h) \approx R(p^{*}) + \tfrac{1}{2}R''(p^{*})h^{2}$. The
          first term that charges you for $h$ is quadratic. A relative error
          $\varepsilon$ in $p$ costs order $\varepsilon^{2}$ in $R$; here
          $R''(2) = -0.5e^{-1}$ predicts a $2\%$ loss at $h = 0.4$, against
          the true $1.75\%$.
      - teach: >
          Optima are flat. At an interior optimum the gradient vanishes, so
          $f(x^{*} + h) = f(x^{*}) + \tfrac{1}{2}h'Hh + o(\lVert h\rVert^{2})$:
          an error of size $\varepsilon$ in the decision costs order
          $\varepsilon^{2}$ in the objective. That is why rounded hedge
          ratios, coarse portfolio weights and deliberately conservative
          stakes give up so little.
      - ask: >
          A hedge's residual variance is $v(h) = 4h^{2} - 16h + 25$, minimized
          at $h = 2$ with $v = 9$. A trader rounds the ratio to $2.2$, ten
          percent off. What is the residual variance now?
        expects: "9.16"
        feedback: >
          $4(2.2)^{2} - 16(2.2) + 25 = 19.36 - 35.2 + 25 = 9.16$. Exactly
          $\tfrac{1}{2}v''h^{2} = 4 \cdot 0.2^{2} = 0.16$ more, about $1.8\%$
          — a ten percent error in the ratio, a two percent cost in variance.

      - part: The other side of flatness
        ask: >
          Flatness runs both ways. A strategy's true score is
          $f(x) = 25 - 0.1(x - 5)^{2}$, best at $x = 5$. Estimation noise adds
          a small tilt, and the estimated score is $f(x) + 0.2x$. Where does
          the *estimated* score peak?
        expects: "6"
        hint: >
          Set the derivative $-0.2(x - 5) + 0.2$ to zero.
        feedback: >
          $-0.2(x - 5) + 0.2 = 0$ gives $x = 6$. A tilt of $0.2$ per unit,
          small next to a score of $25$, moved the chosen decision by $20\%$.
          And the true scores barely differ: $f(6) = 24.9$ against $25$.
      - ask: >
          An optimizer picks portfolio weights from an estimated covariance
          matrix, re-estimated each month. What should you expect?
        choices:
          - text: >
              Stable weights: the objective is flat at the optimum, so nothing
              moves much.
            feedback: >
              The flat objective keeps the *value* stable. It is exactly why
              the *location* is not: a flat objective barely distinguishes the
              true optimum from points far away, so small noise relocates it.
          - text: >
              Weights that jump around from month to month while the optimized
              variance barely changes.
            correct: true
            feedback: >
              Right. The two facts are one fact. Many quite different
              portfolios score almost the same, so noise in the estimates
              decides which of them the optimizer picks.
          - text: >
              Weights that drift slowly, in proportion to the estimation error.
            feedback: >
              Near a flat optimum the argmax moves *more* than proportionally
              to small changes in the objective — the tilt of $0.2$ moved $x$
              by a full unit.
        feedback: >
          The objective forgives errors in the decision; for the same reason,
          it says little about where the decision should be. Shrinkage and
          constraints in portfolio construction exist to fight this.

      - part: Where the comfort ends
        ask: >
          Maximize $f(x) = x$ over $[0, 1]$: the best point is the endpoint
          $x = 1$. A ten percent error gives $x = 0.9$. What fraction of the
          optimal value is lost?
        expects: "0.1"
        feedback: >
          $1 - 0.9 = 0.1$: ten percent, the full error. At an endpoint the
          gradient need not vanish, so the linear term survives and the cost
          is first order. The square law belongs to interior optima of smooth
          functions; at a boundary or a kink, an error costs its full size.
      - teach: >
          In an interview, say both halves: "the optimum is flat, so a ten
          percent error in the input costs on the order of one percent in the
          objective — and for the same reason the argmax is badly determined
          by noisy data." The first reassures, the second warns, and the
          interviewer usually wants the second.
