unit: quant-tools.optimization
opening: >
  Optimization is where the tree's calculus and linear-algebra spines get put
  to work: "find the best portfolio," "minimize the variance," "maximize the
  stake" are all convex optimization problems underneath the finance dressing.
  This unit builds the machinery in the order you apply it — what convexity is
  and why it turns "check every point" into "check one," first- and
  second-order conditions for finding candidates, the closed-form quadratic
  minimization behind least squares and portfolio variance, Lagrange
  multipliers and their KKT extension for constrained problems, and the
  flat-optimum intuition that explains both why rounding a hedge ratio is safe
  and why optimizers fed noisy inputs are not. Kelly's criterion, Markowitz
  portfolio choice and OLS regression, treated elsewhere in the tree, are
  direct applications of what gets built here.
lessons:
  - node: quant-tools.optimization.convex-set
    hook: >
      Before "convex function" means anything, the set you're optimizing over
      has to have the right shape — and recognizing that shape instantly, from
      a list of budget and no-short constraints, is what lets you skip
      worrying about local traps later.
    explanation: >
      The segment test is the right definition because it's exactly the
      property that rules out dents, holes, and separate pieces: if two points
      are feasible, every blend of them must be too. That single local rule
      has a global consequence worth internalizing — any intersection of
      convex sets is convex, because a segment joining two points of the
      intersection lies in each set separately (each is convex) and hence in
      their overlap. This is why a real feasible region — a budget equality, a
      handful of no-short inequalities, a leverage cap — is convex automatically:
      it's built as an intersection of halfspaces and hyperplanes, each
      individually convex, without you ever having to check the segment
      condition by hand.

      Unions break this instantly, which is the trap worth naming: "invest
      long-only in tech OR short-only in energy" describes two convex pieces
      whose union is not convex, since a blend of a point from each need not
      satisfy either sub-strategy's constraints. Equality constraints that
      aren't linear fail the same way — the unit sphere is not convex, since
      the midpoint of two points on it sits strictly inside.
    worked: >
      Take the capped long-only set $\{(w_1,w_2) : w_1+w_2=1,\;0\le w_1\le
      0.6,\;w_2\ge 0\}$, an intersection of one hyperplane and three
      halfspaces. Two feasible extreme points are $(0.6, 0.4)$ and $(0, 1)$;
      their midpoint is $(0.3, 0.7)$, which satisfies $0.3+0.7=1$,
      $0\le 0.3\le 0.6$, and $0.7\ge 0$ — every constraint holds, and the same
      check goes through for any blend $t(0.6,0.4)+(1-t)(0,1)$, $t\in[0,1]$,
      confirming the set is convex.
    interview: >
      "Is this feasible region convex?" is usually answered fastest by
      recognizing it as an intersection of halfspaces, hyperplanes and norm
      balls rather than grinding through the segment definition — the
      interviewer wants to see that recognition, not the algebra.
    pitfalls: >
      Reading "OR" in a strategy description as a hint that the union of two
      convex pieces stays convex — it doesn't. Missing that a nonlinear
      equality constraint (a fixed-volatility target $w'\Sigma w = \sigma^2$,
      say) carves out a non-convex surface even though each side individually
      looks harmless.
    recap: >
      A set is convex exactly when it contains every segment between its own
      points, and any intersection of convex constraints inherits this for
      free.
    steps:
      - teach: >
          Before any first-order condition or Lagrange argument can be
          trusted, the set you are optimizing over has to be convex.
          Recognizing that shape on sight — an intersection of budget and
          no-short constraints, say — is what lets you skip worrying about
          local traps later in the problem.
      - teach: >
          A set $C \subseteq \mathbb{R}^{n}$ is convex when
          $tx + (1-t)y \in C$ for every $x, y \in C$ and every $t \in [0,1]$:
          the entire segment joining two feasible points has to stay
          feasible, not just its endpoints.
      - teach: >
          Take the capped long-only set
          $\{(w_1, w_2) : w_1 + w_2 = 1,\; 0 \le w_1 \le 0.8,\; w_2 \ge 0\}$ —
          one hyperplane and three halfspaces intersected. $(0.8, 0.2)$ and
          $(0, 1)$ are both feasible extreme points of it.
      - ask: >
          Blend those two points halfway, $t = 0.5$. What is $w_1$ at the
          midpoint?
        expects: "0.4"
        hint: >
          The midpoint of two points is $\tfrac{1}{2}$ the first plus
          $\tfrac{1}{2}$ the second, coordinate by coordinate.
        feedback: >
          $\tfrac{1}{2}(0.8) + \tfrac{1}{2}(0) = 0.4$, and the point
          $(0.4, 0.6)$ satisfies every constraint of the set, exactly as
          convexity promises.
      - teach: >
          Any intersection of convex sets is convex: if $x$ and $y$ both lie
          in every set of the collection, then so does the segment between
          them, since each set individually is convex. That is why a
          feasible region built from linear equalities and inequalities is
          convex automatically, with no segment check needed by hand.
      - ask: >
          Which of these sets is *not* convex?
        choices:
          - text: >
              A halfspace $\{x : a'x \le b\}$
            feedback: >
              A halfspace is convex — it's one of the building blocks the
              intersection argument relies on.
          - text: >
              The weight simplex $\{x : x_i \ge 0,\; \sum_i x_i = 1\}$
            feedback: >
              The simplex is an intersection of a hyperplane and halfspaces,
              so it inherits convexity from each piece.
          - text: >
              The unit sphere $\{x : \lVert x\rVert = 1\}$
            correct: true
            feedback: >
              The sphere is only the boundary shell, not the ball it
              encloses — the segment between two points on it cuts through
              the interior and leaves the set.
          - text: >
              A hyperplane $\{x : a'x = b\}$
            feedback: >
              A hyperplane is convex; it's the equality-constraint building
              block, same as a halfspace is for inequalities.
        feedback: >
          The sphere fails the segment test even though every individual
          point on it looks harmless — convexity is a property of the whole
          set, not of any one point.
      - teach: >
          Equality constraints have to be affine to preserve convexity, not
          merely "look like an equation." A fixed-volatility target
          $w'\Sigma w = \sigma^2$ is a nonlinear equality, and it carves out
          a curved surface that fails the segment test the same way the
          sphere does.
      - ask: >
          $(1, 0)$ and $(0, 1)$ both lie on the unit circle
          $\{x : \lVert x\rVert = 1\}$. What is $\lVert x \rVert$ at their
          midpoint, to three decimals?
        expects: "0.707"
        tolerance: 0.001
        hint: >
          Average the two points coordinate-wise, then take the norm of the
          result.
        feedback: >
          The midpoint is $(0.5, 0.5)$, with norm
          $\sqrt{0.5^{2}+0.5^{2}} = \sqrt{0.5} \approx 0.707 \ne 1$ — it has
          left the circle, confirming the circle isn't convex.

  - node: quant-tools.optimization.convexity
    hook: >
      This is the one structural assumption that turns "search for the best
      point" into "solve an equation" — everything downstream in the unit
      exists to exploit it.
    explanation: >
      Picture the graph of $f$ as a bowl: the chord condition
      $f(tx+(1-t)y) \le tf(x)+(1-t)f(y)$ says the straight line between any two
      points on the graph never dips below it, which is exactly "no dents." The
      epigraph reformulation — $\{(x,s): s\ge f(x)\}$ is a convex set — connects
      this directly back to convex sets: a convex function is nothing but a
      function whose "above the graph" region has the segment property.

      The derivative tests are the practical payoff. In one variable, $f''\ge0$
      throughout an interval is equivalent to convexity there; in several
      variables, the Hessian being positive semidefinite everywhere plays the
      same role. The first-order form $f(y) \ge f(x) + \nabla f(x)'(y-x)$ says
      every tangent line sits below the curve — this single inequality is what
      later makes a zero gradient enough to certify a global minimum.

      Domain matters as much as the function: $1/x$ is convex on $(0,\infty)$
      but the test simply doesn't apply once you leave that convex domain, since
      the chord condition needs both endpoints in a convex set to begin with.
    worked: >
      Check $g(x) = \ln(1+e^{x})$ (the softplus function) for convexity on
      $\mathbb{R}$. Its derivative is the logistic function
      $g'(x) = e^{x}/(1+e^{x})$, and differentiating again gives
      $g''(x) = e^{x}/(1+e^{x})^{2} \ge 0$ for every real $x$, so $g$ is convex
      everywhere — for instance $g''(0) = 1/4 > 0$.
    interview: >
      "Prove this function is convex" almost always wants the second-derivative
      or Hessian-PSD test applied directly, not the two-point chord definition —
      save the chord version for when differentiability itself is in question.
    pitfalls: >
      Forgetting the domain has to be convex before the derivative test is
      even valid — $f''\ge 0$ on a non-convex domain proves nothing about
      chords that leave the domain. Flipping the inequality direction and
      calling a concave function convex, especially with $-\ln x$ and $\ln x$
      side by side.
    recap: >
      Convex means every chord lies on or above the graph, tested in practice
      by $f''\ge0$ or a positive semidefinite Hessian.
    steps:
      - teach: >
          This is the one structural assumption that turns "search for the
          best point" into "solve an equation." Picture the graph of $f$ as
          a bowl: once you know it has no dents, a single zero-gradient
          point is guaranteed to be the bottom.
      - teach: >
          $f$ is convex on a convex set $C$ if
          $f(tx+(1-t)y) \le tf(x)+(1-t)f(y)$ for all $x,y \in C$ and
          $t \in [0,1]$ — every chord sits on or above the graph.
          Equivalently, the epigraph $\{(x,s): s \ge f(x)\}$, everything on
          or above the graph, is itself a convex set.
      - teach: >
          In practice you rarely check chords directly. In one variable,
          $f'' \ge 0$ throughout an interval is equivalent to convexity
          there; in several variables, a positive semidefinite Hessian
          everywhere plays the same role. The first-order form
          $f(y) \ge f(x)+\nabla f(x)'(y-x)$ says every tangent line
          underestimates the curve.
      - ask: >
          Let $q(x) = e^{x} + x^{2}$. What is $q''(0)$?
        expects: "3"
        hint: >
          Differentiate twice, then substitute $x = 0$.
        feedback: >
          $q'(x) = e^{x}+2x$ and $q''(x) = e^{x}+2$, so $q''(0) = 1+2=3 > 0$
          — and since this holds for every $x$, $q$ is convex on all of
          $\mathbb{R}$.
      - teach: >
          The derivative test needs the domain to be convex before it means
          anything, since the chord condition needs both endpoints inside a
          convex set to begin with. Leave the domain out of the picture and
          $f'' \ge 0$ proves nothing about chords that exit it.
      - ask: >
          Which statement about $f(x) = 1/x$ is correct?
        choices:
          - text: >
              $f$ is convex on $(0,\infty)$
            correct: true
            feedback: >
              $f''(x) = 2/x^{3} > 0$ throughout $(0,\infty)$, and that
              domain is itself convex, so the test applies cleanly.
          - text: >
              $f$ is convex on $\mathbb{R}\setminus\{0\}$
            feedback: >
              $f''(x)=2/x^3$ changes sign across $x=0$, but the deeper
              problem is that $\mathbb{R}\setminus\{0\}$ isn't even a convex
              domain — a chord from a negative $x$ to a positive $x$ would
              have to cross the missing point.
          - text: >
              $f$ is concave on $(0,\infty)$
            feedback: >
              $f''(x) = 2/x^{3}$ is positive, not negative, on
              $(0,\infty)$, so this has the sign backwards.
          - text: >
              The convexity test doesn't apply because $f$ isn't
              differentiable
            feedback: >
              $f(x)=1/x$ is differentiable everywhere on $(0,\infty)$ — the
              test applies fine there.
        feedback: >
          Convexity of $1/x$ only holds, and only needs checking, on a
          convex piece of its domain — $(0,\infty)$ works, the punctured
          line does not.
      - teach: >
          Concavity is just convexity of $-f$, and the sign is where the
          staple functions get mixed up: $-\ln x$ is convex, but $\ln x$
          itself is concave. Flipping that sign and calling a concave
          function convex is the most common slip.
      - ask: >
          What is the second derivative of $\ln x$ at $x = 2$?
        expects: "-0.25"
        hint: >
          $\dfrac{d}{dx}\ln x = 1/x$, and differentiate once more.
        feedback: >
          $(\ln x)'' = -1/x^{2}$, so at $x=2$ this is $-1/4 = -0.25 < 0$ —
          confirming $\ln x$ is concave, the opposite sign from its convex
          cousin $-\ln x$.

  - node: quant-tools.optimization.convex-operations
    hook: >
      This is how you certify an objective is convex in ten seconds flat during
      an interview, instead of computing a Hessian under time pressure.
    explanation: >
      Each rule follows straight from the epigraph picture. A nonnegative
      combination $af+bg$ stays convex because its epigraph is built from
      convex pieces glued additively. The pointwise maximum of convex functions
      is convex because the epigraph of $\max_i f_i$ is exactly the
      intersection $\bigcap_i \{(x,s): s\ge f_i(x)\}$ of convex epigraphs, and
      intersections of convex sets are convex — the pointwise minimum has no
      such argument, since a union of epigraphs replaces the intersection and
      unions aren't convex.

      Affine substitution $x \mapsto f(Ax+b)$ preserves convexity because a
      segment in the new variable maps to a segment in $Ax+b$, so the chord test
      transfers unchanged. Composing with a monotone convex outer function
      works because you're stacking two "bowl" curvatures that reinforce each
      other; drop monotonicity and they can cancel, which is why $-x^{2}$
      (convex $h(u)=-u$ applied to convex $f(x)=x^2$, but $h$ is decreasing) is
      concave, not convex.
    worked: >
      Certify $f(x) = \max(x^{2}, (x-3)^{2}) + |x-1|$ is convex on
      $\mathbb{R}$: $x^2$ and $(x-3)^2$ are convex, so their pointwise max is
      convex; $|x-1|$ is $|\cdot|$ composed with the affine map $x \mapsto x-1$,
      also convex; the sum of two convex pieces is convex. No Hessian needed,
      and e.g. $f(2) = \max(4,1) + 1 = 5$.
    interview: >
      Expect objectives built as sums of squares, norm penalties, and
      worst-case terms like $\max_i f_i(x)$ — naming which rule certifies each
      piece is faster and more convincing than offering to compute a Hessian.
    pitfalls: >
      Applying the max rule to a minimum — $\min_i f_i(x)$ of convex pieces is
      generally not convex. Composing with a convex but decreasing outer
      function and assuming convexity survives anyway.
    recap: >
      Nonnegative sums, pointwise maxima, affine substitutions, and monotone
      convex compositions all preserve convexity — enough to certify most
      objectives by inspection.
    steps:
      - teach: >
          These four rules are how you certify an objective is convex in
          ten seconds during an interview, instead of computing a Hessian
          under time pressure.
      - teach: >
          Let $f,g$ be convex on a convex set. Then $af+bg$ is convex for
          $a,b \ge 0$; the pointwise maximum of any family of convex
          functions is convex; $x \mapsto f(Ax+b)$ is convex for any matrix
          $A$ and vector $b$; and $h(f(x))$ is convex when $h$ is convex
          *and* nondecreasing.
      - teach: >
          Certify $h(x) = x^{2} + 3|x-2|$ is convex on $\mathbb{R}$: $x^{2}$
          is convex, $|x-2|$ is $|\cdot|$ composed with the affine map
          $x \mapsto x-2$ so it's convex too, and $3 \ge 0$ keeps the scaled
          sum convex. No Hessian was needed.
      - ask: >
          What is $h(1)$ for $h(x) = x^{2} + 3|x-2|$?
        expects: "4"
        hint: >
          Substitute $x=1$ into each piece separately, then add.
        feedback: >
          $h(1) = 1^{2} + 3|1-2| = 1 + 3 = 4$.
      - teach: >
          The max rule works because the epigraph of $\max_i f_i$ is exactly
          $\bigcap_i \{(x,s): s \ge f_i(x)\}$, an intersection of convex
          epigraphs. The pointwise *minimum* has no such argument — a union
          of epigraphs replaces the intersection, and unions of convex sets
          generally aren't convex.
      - ask: >
          Which of these operations does *not* preserve convexity in
          general?
        choices:
          - text: >
              $af + bg$ for convex $f,g$ and $a,b \ge 0$
            feedback: >
              This does preserve convexity — a nonnegative combination of
              convex epigraphs stays convex.
          - text: >
              $\max(f_1(x), f_2(x))$ for convex $f_1, f_2$
            feedback: >
              This preserves convexity too, since the epigraph is an
              intersection of convex epigraphs.
          - text: >
              $\min(f_1(x), f_2(x))$ for convex $f_1, f_2$
            correct: true
            feedback: >
              The minimum replaces the epigraph intersection with a union,
              and a union of convex sets need not be convex — this rule
              genuinely fails.
          - text: >
              $f(Ax+b)$ for convex $f$
            feedback: >
              This preserves convexity — a segment in the new variable maps
              to a segment in $Ax+b$, so the chord test transfers unchanged.
        feedback: >
          Sums with nonnegative weights, pointwise maxima, and affine
          substitution all certify convexity; pointwise minimum does not.
      - teach: >
          The monotonicity requirement on the outer function is easy to
          drop by accident. $h(u) = -u$ is convex, but it's decreasing, so
          composing it with convex $f(x) = x^{2}$ does not produce a convex
          result.
      - ask: >
          $f(x) = x^{2}$ is convex and $h(u) = -u$ is convex. Is
          $h(f(x)) = -x^{2}$ convex on $\mathbb{R}$?
        choices:
          - text: >
              Yes — composing two convex functions is always convex
            feedback: >
              The composition rule needs the *outer* function to be
              nondecreasing as well as convex; $h(u)=-u$ is decreasing, so
              this general claim is false.
          - text: >
              No — $h$ is decreasing, so the composite $-x^{2}$ is concave,
              not convex
            correct: true
            feedback: >
              Exactly the counterexample the rule warns about: $-x^{2}$ has
              second derivative $-2 < 0$ everywhere, so it's concave.
          - text: >
              Yes — $x^{2}$ dominates the sign of the composite
            feedback: >
              The outer function's monotonicity is what decides the outcome
              here, not which piece "dominates."
          - text: >
              There isn't enough information to tell
            feedback: >
              There is: $-x^{2}$ can be checked directly, and its second
              derivative is negative everywhere.
        feedback: >
          Composing a convex $f$ with a convex but decreasing $h$ can flip
          curvature entirely — the monotonicity clause in the rule isn't
          optional.

  - node: quant-tools.optimization.strict-convexity
    hook: >
      "The minimizer is unique" and "a minimizer exists" are two separate
      claims, and strict convexity only ever buys you the first one.
    explanation: >
      The uniqueness argument is a short contradiction: if $x\ne y$ were both
      minimizers with value $m$, the midpoint would satisfy
      $f(\tfrac{x+y}{2}) < \tfrac{1}{2} f(x) + \tfrac{1}{2} f(y) = m$ by strict
      convexity, undercutting the supposed minimum. So at most one point can
      achieve it. $f''>0$ (or a positive definite Hessian) is a convenient
      sufficient test for strict convexity, but it's not necessary — $x^{4}$ is
      strictly convex on $\mathbb{R}$ even though $f''(0)=0$, so failing this
      test doesn't rule strict convexity out.

      Existence is a wholly separate question that strict convexity says
      nothing about: $e^{x}$ is strictly convex on all of $\mathbb{R}$ and has
      no minimizer at all, since it keeps decreasing toward $0$ without ever
      reaching it. You need either a closed, bounded domain or coercivity
      ($f(x)\to\infty$ as $\lVert x\rVert\to\infty$) to know a minimizer is
      there before asking whether it's unique.
    worked: >
      Minimize $f(x) = x^{2} - \ln x$ on $(0,\infty)$. $f''(x) = 2 + 1/x^{2} >
      0$ everywhere, so $f$ is strictly convex; as $x\to0^{+}$ or $x\to\infty$,
      $f(x)\to\infty$, so a minimizer exists. Setting
      $f'(x) = 2x - 1/x = 0$ gives $x^{*} = 1/\sqrt{2}$, with value
      $f(x^{*}) = \tfrac{1}{2} + \tfrac{1}{2}\ln 2 \approx 0.847$.
    interview: >
      "Does this problem have a unique solution?" and "does a solution exist
      at all?" are two questions an interviewer expects you to separate —
      answering only the uniqueness half is a common half-answer.
    pitfalls: >
      Citing strict convexity as a reason a minimizer must exist — it isn't
      one. Concluding non-strict (only semidefinite) convexity rules out
      uniqueness — it doesn't force multiple minimizers, it just fails to
      forbid them.
    recap: >
      Strict convexity guarantees at most one minimizer; existence is a
      separate argument via a bounded domain or coercivity.
    steps:
      - teach: >
          "The minimizer is unique" and "a minimizer exists" are two
          separate claims, and strict convexity only ever buys you the
          first one — keep them apart when you answer.
      - teach: >
          $f$ is strictly convex if the chord inequality is strict for
          $x \ne y$. If $x \ne y$ were both minimizers with value $m$,
          strict convexity would give
          $f(\tfrac{x+y}{2}) < \tfrac{1}{2}f(x)+\tfrac{1}{2}f(y) = m$ — a
          point beating the supposed minimum, which is impossible. So at
          most one point can achieve it.
      - teach: >
          $f'' > 0$ everywhere is a convenient sufficient test for strict
          convexity, but not a necessary one — $x^{4}$ is strictly convex on
          $\mathbb{R}$ even though its second derivative vanishes at $0$.
          Existence of a minimizer is a wholly separate question, settled by
          a closed bounded domain or by coercivity,
          $f(x) \to \infty$ as $\lVert x \rVert \to \infty$.
      - teach: >
          Take $f(x) = x - \ln x$ on $(0,\infty)$. $f''(x) = 1/x^{2} > 0$
          everywhere, so $f$ is strictly convex; as $x \to 0^{+}$ or
          $x \to \infty$, $f(x) \to \infty$, so coercivity guarantees a
          minimizer exists too.
      - ask: >
          What is the minimizer $x^{*}$ of $f(x) = x - \ln x$?
        expects: "1"
        hint: >
          Set $f'(x) = 1 - 1/x$ equal to zero and solve.
        feedback: >
          $f'(x) = 1 - 1/x = 0 \iff x = 1$, and $f''(1) = 1 > 0$ confirms
          it's the minimum.
      - ask: >
          For $h(x) = x^{4}$, what is $h''(0)$?
        expects: "0"
        hint: >
          $h'(x) = 4x^{3}$, then differentiate once more.
        feedback: >
          $h''(x) = 12x^{2}$, so $h''(0) = 0$ — the sufficient test is
          silent here, even though $x^{4}$ is in fact strictly convex.
      - teach: >
          Strict convexity alone never certifies that a minimizer exists at
          all — it only rules out having two. Without coercivity or a
          closed bounded domain, a strictly convex function can decrease
          forever and never reach its infimum.
      - ask: >
          $g(x) = e^{-x}$ is strictly convex on $\mathbb{R}$. Does a
          minimizer exist?
        choices:
          - text: >
              Yes, at $x=0$
            feedback: >
              $g(0)=1$, but $g(10) = e^{-10} \approx 0.0000454$ is far
              smaller — $x=0$ is nowhere near optimal.
          - text: >
              Yes — strict convexity guarantees a minimizer
            feedback: >
              Strict convexity only bounds the *count* of minimizers, never
              their existence.
          - text: >
              No — the infimum $0$ is approached as $x \to \infty$ but
              never attained
            correct: true
            feedback: >
              $g$ decreases toward $0$ forever without reaching it, and $g$
              isn't coercive on $\mathbb{R}$ either, since it grows without
              bound only as $x \to -\infty$, not both directions.
          - text: >
              Yes, because $g$ is coercive
            feedback: >
              $g(x) \to \infty$ only as $x \to -\infty$, not as
              $x \to +\infty$, so $g$ fails coercivity on all of
              $\mathbb{R}$.
        feedback: >
          Strict convexity fixed uniqueness, but it took coercivity or a
          bounded domain to settle existence — here neither holds, so there
          is no minimizer.

  - node: quant-tools.optimization.stationary-points
    hook: >
      Interviewers say "critical point," "extremum," and "stationary point"
      almost interchangeably, but only one of the three is a definition you can
      check by computation — the other two describe what you find once you
      classify it.
    explanation: >
      A minimizer is a claim about every point of the feasible set (global) or
      just a neighborhood of it (local); a stationary point is a purely local,
      computable condition, $\nabla f(x)=0$, that doesn't by itself say which
      kind of extremum — or whether any extremum at all — you've found. Because
      maximizing $f$ is the same as minimizing $-f$, one vocabulary and one
      theory cover both without duplication.

      In the interior of the domain, a stationary point of a differentiable
      function is one of three things: a local min, a local max, or a saddle,
      where the function increases in some directions from the point and
      decreases in others. Keep the value and the location distinct too —
      $\min_x f(x)$ is a number, $\arg\min_x f(x)$ is the set of points
      achieving it, and that set can be empty, a single point, or infinite.
    worked: >
      $f(x,y) = x^{2} - y^{4}$ has gradient $(2x, -4y^{3})$, zero only at the
      origin. Along the $x$-axis, $f(x,0) = x^{2} \ge 0 = f(0,0)$, so the
      origin looks like a minimum in that direction; along the $y$-axis,
      $f(0,y) = -y^{4} \le 0 = f(0,0)$, so it looks like a maximum in that
      direction. The mixed behavior makes the origin a saddle point, not an
      extremum of either kind.
    interview: >
      "Characterize the critical points" wants you to name all stationary
      points, then say for each whether it's a min, max, or saddle — stopping
      at "the gradient is zero here" answers only half the question.
    pitfalls: >
      Treating every stationary point as an extremum by default — plenty are
      saddles. Reporting the minimum value when asked for the minimizer, or
      vice versa; the two answers are different objects and interviewers listen
      for the mix-up.
    recap: >
      A stationary point is where the gradient vanishes; whether it's a local
      min, local max, or saddle is a separate question the gradient alone
      doesn't answer.
    steps:
      - teach: >
          Interviewers say "critical point," "extremum," and "stationary
          point" almost interchangeably, but only one of them is a
          definition you can check by computation. The other two describe
          what you find once you classify it.
      - teach: >
          $x^{*}$ is a global minimizer of $f$ over $S$ if
          $f(x^{*}) \le f(x)$ for every $x \in S$, and a local minimizer if
          that holds only in some ball around $x^{*}$. A stationary point
          is the separate, computable condition $\nabla f(x) = 0$ — it does
          not by itself say whether you have found a minimum, a maximum, or
          neither.
      - teach: >
          In the interior of the domain, a stationary point of a
          differentiable function is one of three things: a local minimum,
          a local maximum, or a saddle, where $f$ increases in some
          directions from the point and decreases in others. Because
          maximizing $f$ is the same as minimizing $-f$, one vocabulary and
          one theory cover both.
      - teach: >
          Take $g(x,y) = x^{4} - y^{2}$. Its gradient is
          $(4x^{3}, -2y)$, zero only at the origin. Along the $x$-axis,
          $g(x,0) = x^{4} \ge 0 = g(0,0)$, so the origin looks like a
          minimum in that direction; along the $y$-axis,
          $g(0,y) = -y^{2} \le 0 = g(0,0)$, so it looks like a maximum in
          that direction.
      - ask: >
          For $g(x,y) = x^{4} - y^{2}$, what is $\partial g/\partial y$ at
          $(0,3)$?
        expects: "-6"
        hint: >
          Differentiate only with respect to $y$, treating $x$ as a
          constant.
        feedback: >
          $\partial g/\partial y = -2y$, so at $y=3$ this is $-2(3) = -6$.
      - ask: >
          How should the origin be classified for $g(x,y) = x^{4} -
          y^{2}$?
        choices:
          - text: >
              A local minimum
            feedback: >
              It only looks like a minimum along the $x$-axis; along the
              $y$-axis $g$ dips below $g(0,0)$, which a true local minimum
              can't allow.
          - text: >
              A local maximum
            feedback: >
              It only looks like a maximum along the $y$-axis; along the
              $x$-axis $g$ rises above $g(0,0)$, which a true local maximum
              can't allow.
          - text: >
              A saddle point
            correct: true
            feedback: >
              $g$ increases away from the origin along one axis and
              decreases along the other — mixed behavior is exactly what
              "saddle" means.
          - text: >
              Not a stationary point
            feedback: >
              The gradient $(4x^3,-2y)$ is $(0,0)$ at the origin, so it is
              a stationary point — the question is only which kind.
        feedback: >
          Mixed behavior across directions — rising one way, falling
          another — is the signature of a saddle, and $\nabla g = 0$ alone
          never rules a saddle out.
      - teach: >
          Keep the value and the location distinct: $\min_x f(x)$ is a
          number, the optimal value, while $\arg\min_x f(x)$ is the *set*
          of points achieving it — possibly empty, a single point, or
          infinite.
      - ask: >
          For $f(x) = x^{2}$ on $[-2,2]$, which statement is correct?
        choices:
          - text: >
              $\min_x f(x) = \{0\}$ and $\arg\min_x f(x) = 0$
            feedback: >
              This has the two backwards — the minimum value is a plain
              number, and the minimizing set is what gets written with
              braces.
          - text: >
              $\min_x f(x) = 0$ and $\arg\min_x f(x) = \{0\}$
            correct: true
            feedback: >
              $f$ attains its smallest value, $0$, only at $x=0$, so the
              value is the number $0$ and the minimizing set is $\{0\}$.
          - text: >
              $\min_x f(x) = 4$ and $\arg\min_x f(x) = \{-2, 2\}$
            feedback: >
              $4$ is the *maximum* value on this interval, attained at the
              endpoints — not the minimum.
          - text: >
              $\min_x f(x)$ and $\arg\min_x f(x)$ always name the same
              object
            feedback: >
              They never do — one is a number, the other is a set of
              points, even when the set happens to contain a single
              element.
        feedback: >
          The minimum value is $0$; the minimizer set is $\{0\}$ —
          different objects, and interviewers listen for the two being
          kept apart.

  - node: quant-tools.optimization.local-global
    hook: >
      This is the entire reason a convex optimization problem "counts as
      solved" the moment you find one point with no better neighbor — no
      restarts, no checking other regions.
    explanation: >
      Suppose $x$ is a local minimizer of convex $f$ over convex $C$, but some
      other point $y \in C$ has $f(y) < f(x)$. For small $t>0$, the point
      $x+t(y-x)$ lies in $C$ (convexity of the set) and in any small ball
      around $x$, and convexity of $f$ gives
      $f(x+t(y-x)) \le (1-t)f(x)+tf(y) < f(x)$ — a nearby point strictly
      better than $x$, contradicting local minimality. So no local minimizer
      of a convex function can fail to be global.

      The mental model is the bowl: a bowl-shaped surface cannot have a dip
      that isn't the deepest point, because any lower point elsewhere would
      pull the whole chord down through the supposed local floor. This is what
      licenses gradient descent, coordinate descent, or plain guessing on a
      convex problem — whatever locally-optimal point you land on is the
      answer. It also draws the line sharply: portfolio problems with
      cardinality or integer constraints, and most machine-learning losses,
      are not convex, and a local optimum found there carries no such
      guarantee.
    worked: >
      $f(x,y) = 2x^{2}+y^{2}-4x-6y$ has Hessian $\operatorname{diag}(4,2)$,
      positive definite everywhere, so $f$ is (strictly) convex. Setting
      $\nabla f = (4x-4,\;2y-6) = 0$ gives $x=1$, $y=3$, and
      $f(1,3) = 2-4+9-18 = -11$. Convexity alone certifies $-11$ at $(1,3)$ as
      the global minimum — no other point needs checking.
    interview: >
      "You found a stationary point — how do you know it's the global
      optimum?" is answered by convexity, not by searching further: certify
      the objective is convex first, then stationarity alone finishes the
      problem.
    pitfalls: >
      Carrying "found a local optimum, so I'm done" reasoning into a
      non-convex setting — integer or cardinality-constrained portfolio
      problems and most neural-network losses can have many local optima at
      different values.
    recap: >
      For a convex problem, any local minimizer is automatically the global
      minimizer.
    steps:
      - teach: >
          This is the entire reason a convex optimization problem "counts
          as solved" the moment you find one point with no better
          neighbor — no restarts, no checking other regions.
      - teach: >
          Suppose $x$ is a local minimizer of convex $f$ over convex $C$,
          but some $y \in C$ has $f(y) < f(x)$. For small $t>0$, the point
          $x+t(y-x)$ lies in $C$ and in any small ball around $x$, and
          convexity gives $f(x+t(y-x)) \le (1-t)f(x)+tf(y) < f(x)$ — a
          nearby point strictly better than $x$, contradicting local
          minimality.
      - teach: >
          The mental model is the bowl: a bowl-shaped surface cannot have a
          dip that isn't the deepest point, since any lower point elsewhere
          would pull the whole chord down through the supposed local
          floor. This is what licenses gradient descent, coordinate
          descent, or plain guessing on a convex problem — whichever
          locally optimal point you land on is the answer.
      - teach: >
          Take $f(x,y) = 3x^{2}+y^{2}-6x-2y$. Its Hessian is
          $\operatorname{diag}(6,2)$, positive definite everywhere, so $f$
          is (strictly) convex — any stationary point found here is
          automatically the global minimum, before any arithmetic is even
          done.
      - ask: >
          Setting $\nabla f = (6x-6,\;2y-2) = 0$, what is $x^{*}$?
        expects: "1"
        hint: >
          Solve $6x - 6 = 0$ on its own; the two coordinates decouple.
        feedback: >
          $6x-6=0 \Rightarrow x^{*}=1$, and separately
          $2y-2=0 \Rightarrow y^{*}=1$.
      - ask: >
          What is the global minimum value $f(1,1)$?
        expects: "-4"
        hint: >
          Substitute $x=1,\,y=1$ directly into $3x^{2}+y^{2}-6x-2y$.
        feedback: >
          $f(1,1) = 3(1)+1-6(1)-2(1) = 3+1-6-2=-4$, and convexity
          certifies this is the global minimum with no other point needing
          to be checked.
      - teach: >
          The guarantee vanishes the instant convexity does. Portfolio
          problems with cardinality or integer constraints, and most
          machine-learning losses, are not convex — a locally optimal
          point found there carries no promise of being the best one
          anywhere else.
      - ask: >
          Gradient descent on a *non-convex* portfolio objective with a
          cardinality constraint lands on a point with no better neighbor.
          What follows?
        choices:
          - text: >
              It is automatically the global optimum, same as in the
              convex case
            feedback: >
              The local-implies-global argument leans entirely on
              convexity — without it, this conclusion doesn't transfer.
          - text: >
              Nothing certifies it's global without further work
            correct: true
            feedback: >
              Non-convex objectives can have many local optima at
              different values; finding one with no better neighbor says
              nothing about the others.
          - text: >
              It must be a saddle point instead
            feedback: >
              "No better neighbor" is the definition of a local minimizer,
              not a saddle — the issue is whether it's *global*, not
              whether it's even local.
          - text: >
              The Hessian there must be indefinite
            feedback: >
              A local minimizer of a smooth function has a positive
              semidefinite Hessian regardless of whether the overall
              problem is convex — this doesn't follow from non-convexity.
        feedback: >
          Local-implies-global is a convexity result specifically —
          outside it, a local optimum is just that, local, until proven
          otherwise.

  - node: quant-tools.optimization.foc
    hook: >
      "Differentiate and set to zero" is the reflex; the interview question is
      whether you can also justify why the point you found is actually the
      answer.
    explanation: >
      At an interior local minimizer, $\nabla f(x^{*})=0$ is necessary: if the
      gradient were nonzero, moving a small step in the direction $-\nabla
      f(x^{*})$ would strictly decrease $f$, contradicting local optimality.
      Necessity is all this buys on its own — stationary points that are
      neither minima nor maxima exist in one variable and show up constantly
      in several, so "the derivative is zero" is a candidate list, not a
      verdict.

      Convexity is what promotes the condition to sufficient. Recall the
      tangent-underestimate inequality $f(y) \ge f(x^{*}) + \nabla
      f(x^{*})'(y-x^{*})$ for convex $f$; substituting $\nabla f(x^{*})=0$
      collapses the right side to $f(x^{*})$, so $f(y) \ge f(x^{*})$ for
      every $y$ in the domain — $x^{*}$ is a global minimizer, no further
      search required. The interview recipe is exactly this two-step move:
      differentiate and solve, then justify with convexity (or a second-order
      check) rather than simply asserting the stationary point is the answer.
    worked: >
      Minimize $f(x) = e^{x} - x$ over $\mathbb{R}$. $f'(x) = e^{x}-1=0$ gives
      $x^{*}=0$; $f''(x)=e^{x}>0$ everywhere, so $f$ is convex and $x^{*}=0$
      is the global minimum, with value $f(0) = 1 - 0 = 1$.
    interview: >
      "Minimize this function" wants three moves in sequence: differentiate,
      solve $f'=0$, then state why that point is the minimum — convexity or a
      second-order check — since a bare stationary point convinces no one.
    pitfalls: >
      Stopping after "the derivative is zero" without the justification step.
      Applying $\nabla f=0$ outside its scope: it says nothing at a boundary
      point or at a point where $f$ isn't differentiable, both of which need
      separate handling.
    recap: >
      A zero gradient is necessary at any interior optimum, and sufficient for
      a global minimum exactly when the objective is convex.
    steps:
      - teach: >
          "Differentiate and set to zero" is the reflex; the interview
          question is whether you can also justify why the point you found
          is actually the answer.
      - teach: >
          At an interior local minimizer, $\nabla f(x^{*})=0$ is necessary:
          if the gradient were nonzero, moving a small step along
          $-\nabla f(x^{*})$ would strictly decrease $f$, contradicting
          local optimality. Necessity alone only gives a candidate list —
          stationary points that are neither minima nor maxima exist too.
      - teach: >
          Convexity promotes the condition to sufficient. The
          tangent-underestimate inequality
          $f(y) \ge f(x^{*}) + \nabla f(x^{*})'(y-x^{*})$ collapses, once
          $\nabla f(x^{*})=0$, to $f(y) \ge f(x^{*})$ for every $y$ — so
          $x^{*}$ is a global minimizer, no further search required.
      - teach: >
          Minimize $f(x) = e^{x} + e^{-x}$ over $\mathbb{R}$.
          $f'(x) = e^{x} - e^{-x}$, and $f''(x) = e^{x}+e^{-x} > 0$
          everywhere, so $f$ is convex — any stationary point found here
          will already be certified as the global minimum.
      - ask: >
          Setting $f'(x) = e^{x}-e^{-x} = 0$, what is $x^{*}$?
        expects: "0"
        hint: >
          $e^{x}=e^{-x}$ forces the two exponents to be equal.
        feedback: >
          $e^{x}=e^{-x} \iff x = -x \iff x=0$.
      - ask: >
          What is the global minimum value $f(0)$?
        expects: "2"
        hint: >
          Substitute $x=0$ into $e^{x}+e^{-x}$ directly.
        feedback: >
          $f(0) = e^{0}+e^{0} = 1+1=2$, and convexity means this is the
          global minimum, not merely a local one.
      - teach: >
          $\nabla f = 0$ only ever applies at interior points where $f$ is
          differentiable. It says nothing at a boundary point of the
          feasible set, and nothing at a point where $f$ isn't
          differentiable — both need separate handling.
      - ask: >
          Which of these optima will $\nabla f = 0$ fail to find?
        choices:
          - text: >
              An interior minimizer of a smooth convex function
            feedback: >
              This is exactly the case the first-order condition is built
              to find and certify.
          - text: >
              The minimizer of $f(x)=x$ on the closed interval $[0,1]$
            correct: true
            feedback: >
              $f'(x)=1$ never vanishes, yet the minimum is the endpoint
              $x=0$ — a boundary point $\nabla f=0$ was never designed to
              see.
          - text: >
              A stationary point of a convex function
            feedback: >
              Convexity is exactly what makes a stationary point
              sufficient, so the condition finds and certifies this case.
          - text: >
              A point where a convex function's gradient is genuinely zero
            feedback: >
              That is precisely a first-order condition success, not a
              failure.
        feedback: >
          Boundaries are invisible to $\nabla f = 0$ by construction — the
          condition only ever speaks about interior, differentiable points.

  - node: quant-tools.optimization.boundary-check
    hook: >
      A large share of wrong interview answers minimize only over the points
      where the gradient vanishes and never check anywhere else.
    explanation: >
      $\nabla f = 0$ only ever finds interior optima of a differentiable
      function, so before reporting an answer you need three more categories
      of candidate: boundary points of the feasible set, points where $f$ isn't
      differentiable (kinks), and behavior at infinity (is $f$ even bounded
      below?). None of these show up as a solution to $\nabla f=0$, because
      the condition was never designed to see them.

      The safe habit is to build one candidate list — every stationary point,
      every kink, every boundary point — evaluate $f$ at all of them, and
      compare numbers directly rather than trusting whichever candidate you
      found first. Existence of a minimum is guaranteed when the domain is
      closed and bounded with $f$ continuous, or when $f$ is continuous and
      coercive; outside those guarantees, a "local minimum" you found may not
      even be the best point on an unbounded piece of the domain.
    worked: >
      Minimize $g(x) = |x-2| + x^{2}/4$ on $[-1,5]$. For $x<2$,
      $g'(x) = -1+x/2$, which would vanish at $x=2$ — outside that region, so
      no interior stationary point there; for $x>2$, $g'(x)=1+x/2>0$
      throughout, so none there either. The only candidates are the kink
      $x=2$ and the endpoints: $g(2)=1$, $g(-1)=3.25$, $g(5)=9.25$. The minimum
      is $1$, at the kink $x=2$.
    interview: >
      "Minimize this over the interval..." is testing whether you reach for
      endpoints and kinks even when $\nabla f=0$ turns up nothing, or turns up
      a point that isn't actually the best one.
    pitfalls: >
      Skipping endpoints because the domain "should" have an interior
      optimum. Reporting a genuine local minimum on an unbounded domain
      without checking whether $f$ diverges to $-\infty$ somewhere else
      entirely.
    recap: >
      Compare stationary points, kinks, and boundary points side by side — the
      first-order condition alone only ever covers one of the three.
    steps:
      - teach: >
          A large share of wrong interview answers minimize only over the
          points where the gradient vanishes and never check anywhere
          else.
      - teach: >
          $\nabla f = 0$ only ever finds interior optima of a
          differentiable function, so before reporting an answer check
          three more categories: boundary points of the feasible set,
          points where $f$ isn't differentiable (kinks), and behavior at
          infinity. None of these show up as a solution to $\nabla f = 0$,
          because the condition was never designed to see them.
      - teach: >
          Build one candidate list — every stationary point, every kink,
          every boundary point — evaluate $f$ at all of it, and compare the
          numbers directly. Existence of a minimum is guaranteed when the
          domain is closed and bounded with $f$ continuous, or when $f$ is
          continuous and coercive; outside those guarantees a "local
          minimum" found this way may not even be the best point on an
          unbounded piece of the domain.
      - teach: >
          Minimize $p(x) = |x-1| + x^{2}/2$ on $[-3,4]$. For $x<1$,
          $p'(x) = -1+x$, which would vanish at $x=1$ — outside that
          branch, so no interior stationary point there; for $x>1$,
          $p'(x)=1+x>0$ throughout that branch, so none there either. The
          only candidates left are the kink $x=1$ and the two endpoints.
      - ask: >
          What is $p(1)$?
        expects: "0.5"
        hint: >
          At the kink, $|x-1|=0$, so only the quadratic piece survives.
        feedback: >
          $p(1) = |1-1| + 1^{2}/2 = 0 + 0.5 = 0.5$.
      - ask: >
          What is $p(-3)$?
        expects: "8.5"
        hint: >
          $|-3-1| = 4$, and add the quadratic piece at $x=-3$.
        feedback: >
          $p(-3) = |-3-1| + (-3)^{2}/2 = 4 + 4.5 = 8.5$.
      - teach: >
          The same blind spot bites at infinity. $f(x) = x^{3}-3x$ has a
          genuine local minimum at $x=1$ with value $-2$, yet is unbounded
          below on $\mathbb{R}$ — the local minimum found by $\nabla f=0$
          is not the answer to "minimize $f$," because no minimum exists
          at all.
      - ask: >
          Comparing the candidates for $p(x) = |x-1| + x^{2}/2$ on
          $[-3,4]$ — $p(-3)=8.5$, the kink value, and $p(4)=11$ — where is
          the global minimum?
        choices:
          - text: >
              At the left endpoint $x=-3$
            feedback: >
              $8.5$ is the largest of the three candidates, not the
              smallest.
          - text: >
              At the kink $x=1$
            correct: true
            feedback: >
              $p(1)=0.5$ is smaller than both endpoint values, $8.5$ and
              $11$ — the kink wins.
          - text: >
              At the right endpoint $x=4$
            feedback: >
              $p(4)=11$ is the largest of the three candidates, not the
              smallest.
          - text: >
              There is no minimum, since $\nabla p = 0$ has no solution in
              either branch
            feedback: >
              This is exactly the mistake the candidate-list method exists
              to prevent — a kink can hold the minimum even with no
              interior stationary point on either side of it.
        feedback: >
          Comparing all three candidates directly — $8.5$, $0.5$, $11$ —
          the kink at $x=1$ wins with value $0.5$.

  - node: quant-tools.optimization.gradient-hessian
    hook: >
      Every later step in this unit — FOC, SOC, Lagrange — is written in
      gradient and Hessian notation, so fluency here is what lets you move fast
      once the real problem starts.
    explanation: >
      The gradient $\nabla f(x)$ collects the $n$ first partials into a vector,
      and the Hessian $H(x)$ collects the $n^2$ second partials into a matrix,
      symmetric whenever those partials are continuous. Taylor's theorem's
      multivariable analogue plugs both in at once:
      $f(x+h) = f(x) + \nabla f(x)'h + \tfrac{1}{2} h'H(x)h + o(\lVert h\rVert^{2})$
      — a constant, a linear correction from the gradient, and a quadratic-form
      correction (recall quadratic forms) from the Hessian, exactly mirroring
      the single-variable expansion term by term.

      Two gradients are worth having memorized rather than re-derived each
      time. $\nabla(b'x) = b$ falls out because $\partial(\sum_j b_j x_j)/
      \partial x_i = b_i$. $\nabla(x'Ax) = (A+A')x$ — which is $2Ax$ once $A$ is
      symmetric — comes from each $x_k$ appearing in both the row and column
      of the bilinear sum $\sum_{i,j}a_{ij}x_ix_j$. The quadratic form
      $h'H(x)h$ that appears in the expansion is precisely the object whose
      sign, at a stationary point, decides whether you're at a min, a max, or a
      saddle.
    worked: >
      For $f(x,y) = 3x^{2}+2xy+y^{2}-5x$: $\nabla f = (6x+2y-5,\;2x+2y)$, so
      $\nabla f(1,1) = (3, 4)$. The Hessian is constant, with rows $(6,2)$ and
      $(2,2)$, read off directly from the second partials
      $\partial^2 f/\partial x^2=6$, $\partial^2 f/\partial x\partial y=2$,
      $\partial^2 f/\partial y^2=2$.
    interview: >
      "Write down the gradient and Hessian of this function" is often step one
      of a bigger problem — doing it quickly and correctly, including the
      factor-of-2 bookkeeping, is what buys you time for the harder part.
    pitfalls: >
      Forgetting the $2A$ shortcut only applies once $A$ is symmetrized —
      $\nabla(x'Ax)=(A+A')x$ in general. Dropping cross-partial terms or
      double-counting them when assembling the Hessian by hand from a
      polynomial.
    recap: >
      The gradient and Hessian are the vector of first partials and matrix of
      second partials, and together they give the quadratic Taylor expansion
      around any point.
    steps:
      - teach: >
          Every later step in this unit — FOC, SOC, Lagrange — is written
          in gradient and Hessian notation, so fluency here is what lets
          you move fast once the real problem starts.
      - teach: >
          The gradient $\nabla f(x)$ collects the first partials into a
          vector, and the Hessian $H(x)$ collects the second partials into
          a matrix, symmetric whenever those partials are continuous.
          Taylor's theorem plugs both in at once:
          $f(x+h) = f(x) + \nabla f(x)'h + \tfrac{1}{2} h'H(x)h +
          o(\lVert h\rVert^{2})$ — a linear correction from the gradient, a
          quadratic-form correction from the Hessian.
      - teach: >
          Two gradients are worth having memorized. $\nabla(b'x) = b$,
          since each $\partial(\sum_j b_j x_j)/\partial x_i = b_i$.
          $\nabla(x'Ax) = (A+A')x$ — which is $2Ax$ once $A$ is symmetric —
          since each $x_k$ appears in both the row and column of the
          bilinear sum.
      - teach: >
          Take $g(x,y) = 4x^{2}-2xy+y^{2}+3x$. The first partials are
          $\partial g/\partial x = 8x-2y+3$ and
          $\partial g/\partial y = -2x+2y$.
      - ask: >
          What is $\partial g/\partial x$ at $(1,1)$?
        expects: "9"
        hint: >
          Substitute $x=1,\,y=1$ into $8x-2y+3$.
        feedback: >
          $8(1)-2(1)+3 = 8-2+3=9$.
      - ask: >
          What is $\partial g/\partial y$ at $(1,1)$?
        expects: "0"
        hint: >
          Substitute $x=1,\,y=1$ into $-2x+2y$.
        feedback: >
          $-2(1)+2(1) = 0$.
      - teach: >
          Assembling the Hessian from a polynomial is easy to get wrong:
          the diagonal entries are the coefficient of $x_i^{2}$ *doubled*,
          and each off-diagonal entry is the coefficient of the cross
          term, not doubled again — that doubling already happened once,
          from the two symmetric off-diagonal slots.
      - ask: >
          What is $\partial^{2} g/\partial x^{2}$, the $(1,1)$ entry of the
          Hessian, for $g(x,y) = 4x^{2}-2xy+y^{2}+3x$?
        expects: "8"
        hint: >
          Differentiate $\partial g/\partial x = 8x-2y+3$ once more, with
          respect to $x$.
        feedback: >
          Differentiating $8x-2y+3$ with respect to $x$ leaves $8$ —
          matching the coefficient of $x^{2}$, which is $4$, doubled.

  - node: quant-tools.optimization.soc
    hook: >
      Once you have a stationary point, the Hessian's definiteness is the
      tiebreaker between "minimum," "maximum," "saddle," and "can't tell yet."
    explanation: >
      Near a stationary point $x^{*}$, the gradient term of the Taylor
      expansion vanishes, leaving
      $f(x^{*}+h) - f(x^{*}) \approx \tfrac{1}{2} h'Hh$: the sign of this quadratic
      form for every direction $h$ is exactly the sign of $f(x^{*}+h)-f(x^{*})$
      near $x^{*}$. A positive definite $H$ makes that quadratic form positive
      in every direction, hence a strict local minimum; negative definite gives
      a strict local max; and an $H$ with eigenvalues of both signs gives a
      direction that increases and a direction that decreases — a saddle. When
      $H$ is only semidefinite and singular, the quadratic term vanishes along
      some direction and the sign is decided by terms the expansion doesn't
      show, so the test is genuinely silent.

      For a $2\times2$ symmetric $H$ with rows $(a,b)$ and $(b,c)$, positive
      definiteness reduces to two numbers: $a>0$ and $ac-b^{2}>0$. Checking
      only the diagonal entry $a>0$ and skipping the determinant is the most
      common shortcut error, because a large enough off-diagonal term can flip
      an apparently positive-curvature direction into a saddle.
    worked: >
      Classify the stationary point of $f(x,y) = x^{2}-y^{2}+4xy$. Gradient
      $(2x+4y,\;4x-2y) = 0$ forces $x=y=0$. The Hessian is $H$ with rows
      $(2,4)$ and $(4,-2)$: $a=2>0$, but $ac-b^{2} = -4-16=-20<0$, so $H$ is
      indefinite and the origin is a saddle — despite the positive diagonal
      entry that, checked alone, would have suggested a minimum.
    interview: >
      "Classify this critical point" wants the definiteness of the Hessian —
      eigenvalue signs in general, the $a>0,\;ac-b^{2}>0$ shortcut whenever
      it's $2\times2$ — not a guess based on one partial derivative.
    pitfalls: >
      Using a single positive diagonal second partial as if it were sufficient
      for a minimum — it isn't, only the full definiteness test is. Treating a
      singular semidefinite Hessian as decisive in either direction when it's
      actually inconclusive without more information.
    recap: >
      The Hessian's definiteness at a stationary point reads off the local
      shape: positive definite is a min, negative definite is a max, indefinite
      is a saddle, and singular semidefinite decides nothing.
    steps:
      - teach: >
          Once you have a stationary point, the Hessian's definiteness is
          the tiebreaker between "minimum," "maximum," "saddle," and
          "can't tell yet."
      - teach: >
          Near a stationary point $x^{*}$, the gradient term of the Taylor
          expansion vanishes, leaving
          $f(x^{*}+h)-f(x^{*}) \approx \tfrac{1}{2}h'Hh$. A positive
          definite $H$ makes this quadratic form positive in every
          direction, hence a strict local minimum; negative definite gives
          a strict local max; and an $H$ with eigenvalues of both signs —
          indefinite — gives a saddle.
      - teach: >
          For a $2\times2$ symmetric $H$ with rows $(a,b)$ and $(b,c)$,
          positive definiteness reduces to two numbers: $a>0$ *and*
          $ac-b^{2}>0$. Checking only the diagonal entry $a>0$ and
          skipping the determinant is the most common shortcut error,
          since a large enough off-diagonal term can flip an apparently
          positive-curvature direction into a saddle.
      - teach: >
          Take $h(x,y) = 2x^{2}+2xy+3y^{2}$. The gradient
          $(4x+2y,\;2x+6y)$ vanishes only at the origin, and the Hessian
          has rows $(4,2)$ and $(2,6)$.
      - ask: >
          For that Hessian, what is $ac-b^{2}$?
        expects: "20"
        hint: >
          $a=4$, $c=6$, $b=2$ — substitute into $ac-b^{2}$.
        feedback: >
          $ac-b^{2} = 4(6)-2^{2} = 24-4=20$.
      - ask: >
          Given $a=4>0$ and $ac-b^{2}=20>0$, how should the origin be
          classified?
        choices:
          - text: >
              A strict local minimum
            correct: true
            feedback: >
              Both conditions of the $2\times2$ shortcut hold, so $H$ is
              positive definite and this is a strict local minimum.
          - text: >
              A strict local maximum
            feedback: >
              A maximum needs $a<0$ together with $ac-b^2>0$ — here
              $a>0$.
          - text: >
              A saddle point
            feedback: >
              A saddle needs $ac-b^{2}<0$ — here the determinant condition
              is satisfied, not violated.
          - text: >
              Inconclusive
            feedback: >
              The test is only inconclusive when $H$ is singular
              ($ac-b^{2}=0$); here it's strictly positive.
        feedback: >
          $a>0$ and $ac-b^{2}>0$ together certify a positive definite
          Hessian — a strict local minimum.
      - teach: >
          Checking only the diagonal entry is the trap: a positive $a$
          alone proves nothing once the off-diagonal term is large enough
          to swing the determinant negative.
      - ask: >
          $k(x,y) = x^{2}+6xy+y^{2}$ has Hessian rows $(2,6)$ and $(6,2)$,
          so $a=2>0$. Is the origin a minimum?
        choices:
          - text: >
              Yes — the diagonal entry $a=2$ is positive
            feedback: >
              This is exactly the shortcut error the determinant check
              exists to catch — a positive diagonal entry alone never
              certifies a minimum.
          - text: >
              No — $ac-b^{2} = 4-36=-32<0$, so $H$ is indefinite and the
              origin is a saddle
            correct: true
            feedback: >
              The determinant is negative despite the positive diagonal
              entry, exactly the scenario the $2\times2$ shortcut is
              built to catch.
          - text: >
              Yes — the trace $a+c=4$ is positive
            feedback: >
              The trace being positive is not the definiteness test; the
              determinant condition $ac-b^2>0$ is what's required and it
              fails here.
          - text: >
              It cannot be determined from this information
            feedback: >
              It can: the $2\times2$ shortcut $a>0,\,ac-b^2>0$ applies
              directly and gives a definite answer — a saddle.
        feedback: >
          $ac-b^{2}=-32<0$ makes $H$ indefinite regardless of the positive
          diagonal entry — the origin is a saddle.

  - node: quant-tools.optimization.quadratic-min
    hook: >
      Kelly staking, minimum-variance portfolios, ridge regression and OLS all
      end at the same three-line derivation — this is that derivation, done
      once.
    explanation: >
      In one variable, $\nabla q(x) = 2ax+b=0$ gives $x^{*}=-b/(2a)$ directly;
      substituting back gives the value $c-b^{2}/(4a)$. The sign of $a$ decides
      everything: $a>0$ is a minimum, $a<0$ a maximum, $a=0$ with $b\ne0$ leaves
      $q$ unbounded both ways.

      The vector case is the same equation with the gradient formulas from
      Gradient, Hessian and the second-order expansion plugged in: for
      $q(x) = \tfrac{1}{2} x'Ax - b'x + c$, $\nabla q(x) = Ax-b$, so
      $\nabla q=0$ is the linear system $Ax=b$. If $A$ is positive definite —
      which is automatic once you've confirmed $q$ is strictly convex — this
      system has the unique solution $x^{*}=A^{-1}b$, and it's the global
      minimum by Second-order conditions, with value
      $c-\tfrac{1}{2} b'A^{-1}b$. Every quadratic minimization, however it's
      dressed up, is "solve $Ax=b$" in disguise.
    worked: >
      Minimize $q(x,y) = x^{2}+2y^{2}-2x-8y$, which is
      $\tfrac{1}{2} x'Ax - b'x$ with $A=\operatorname{diag}(2,4)$ and $b=(2,8)$.
      $\nabla q = (2x-2,\;4y-8)=0$ gives $x^{*}=1$, $y^{*}=2$. Using
      $c-\tfrac{1}{2} b'A^{-1}b$ with $A^{-1}=\operatorname{diag}(1/2,1/4)$:
      $b'A^{-1}b = 2 + 16 = 18$, so the minimum value is $-9$ — matching the
      direct check $q(1,2)=1+8-2-16=-9$.
    interview: >
      "Minimize this quadratic" wants recognition of the $Ax=b$ structure
      first — if only the minimizer is asked for, solve the linear system;
      only compute the value formula when the minimum value itself is asked
      for.
    pitfalls: >
      Declaring a stationary point of a quadratic a minimum without checking
      $A$ is positive definite — an indefinite $A$ makes it a saddle, and a
      negative-eigenvalue direction makes $q$ unbounded below. Misreading the
      factor-of-2 convention when assembling $A$ from a quadratic written out
      term by term rather than in the $\tfrac{1}{2} x'Ax$ form.
    recap: >
      Minimizing a quadratic always reduces to solving the linear system
      $Ax=b$, with minimum value $c-\tfrac{1}{2} b'A^{-1}b$ once $A$ is positive
      definite.
    steps:
      - teach: >
          Kelly staking, minimum-variance portfolios, ridge regression and
          OLS all end at the same three-line derivation — this is that
          derivation, applied to a fresh instance.
      - teach: >
          In one variable, $\nabla q(x) = 2ax+b=0$ gives $x^{*}=-b/(2a)$
          directly. In $\mathbb{R}^{n}$, writing
          $q(x) = \tfrac{1}{2}x'Ax-b'x+c$ gives $\nabla q(x) = Ax-b$, so
          $\nabla q=0$ is the linear system $Ax=b$. Once $A$ is confirmed
          positive definite, the unique solution $x^{*}=A^{-1}b$ is the
          global minimum, with value $c-\tfrac{1}{2}b'A^{-1}b$.
      - teach: >
          Take $r(x,y) = 3x^{2}+y^{2}-12x-4y$. Matching to
          $\tfrac{1}{2}x'Ax-b'x$ gives $A=\operatorname{diag}(6,2)$ (since
          $3x^2=\tfrac12(6)x^2$ and $y^2=\tfrac12(2)y^2$) and $b=(12,4)$.
      - ask: >
          Solving $\nabla r = (6x-12,\;2y-4)=0$, what is $x^{*}$?
        expects: "2"
        hint: >
          Solve $6x-12=0$ on its own.
        feedback: >
          $6x-12=0 \Rightarrow x^{*}=2$.
      - ask: >
          What is $y^{*}$?
        expects: "2"
        hint: >
          Solve $2y-4=0$ on its own.
        feedback: >
          $2y-4=0 \Rightarrow y^{*}=2$.
      - ask: >
          What is the minimum value $r(2,2)$?
        expects: "-16"
        hint: >
          Substitute $x=2,\,y=2$ directly into $3x^{2}+y^{2}-12x-4y$.
        feedback: >
          Direct check: $r(2,2) = 3(4)+4-12(2)-4(2) = 12+4-24-8=-16$. The
          formula agrees: $A^{-1}=\operatorname{diag}(1/6,1/2)$, so
          $b'A^{-1}b = 144/6+16/2 = 24+8=32$, giving
          $0-\tfrac12(32)=-16$.
      - teach: >
          None of this is valid until $A$ is confirmed positive definite —
          solving $Ax=b$ only ever finds *a* stationary point. An
          indefinite $A$ makes it a saddle, and a negative-eigenvalue
          direction makes $q$ unbounded below instead of minimized.
      - ask: >
          Solving $\nabla q = 0$ for some quadratic $q$ turns up a
          stationary point where $A$ has rows $(1,3)$ and $(3,1)$. What
          follows?
        choices:
          - text: >
              The point is the global minimum, since $Ax=b$ was solved
              correctly
            feedback: >
              Solving the linear system only ever locates *a* stationary
              point — it says nothing about $A$'s definiteness.
          - text: >
              It could be a saddle: $\det A = 1-9=-8<0$ means $A$ is
              indefinite
            correct: true
            feedback: >
              $\det A = 1(1)-3(3) = -8<0$ makes $A$ indefinite, so this
              stationary point is a saddle, not a minimum.
          - text: >
              It's unbounded below only if $b=0$
            feedback: >
              Unboundedness follows from $A$ having a negative eigenvalue
              regardless of $b$ — it isn't conditional on $b$ vanishing.
          - text: >
              It's a maximum, since the diagonal entries are equal
            feedback: >
              Equal diagonal entries say nothing about definiteness; the
              sign of $\det A = ac-b^2$ is what decides it, and here
              that's negative.
        feedback: >
          $\det A<0$ signals an indefinite $A$ and a saddle — always check
          definiteness before calling a stationary point of a quadratic a
          minimum.

  - node: quant-tools.optimization.complete-square
    hook: >
      This is the mental-math route to a vertex or a Gaussian integral — no
      derivative required, which matters when a speed round leaves no time to
      differentiate.
    explanation: >
      Completing the square is the algebraic mirror of setting the derivative
      to zero: $ax^{2}+bx+c = a(x+b/(2a))^{2} + c - b^{2}/(4a)$ makes the
      vertex $x^{*}=-b/(2a)$ visible by inspection, exactly the formula from
      Minimizing a quadratic, reached without calculus. The vector version does
      the identical rearrangement with the matrix $A$ standing in for $a$.

      The same rearrangement evaluates Gaussian integrals, because
      $-\alpha x^{2}+\beta x$ completes to
      $-\alpha(x-\beta/(2\alpha))^{2}+\beta^{2}/(4\alpha)$, pulling a constant
      out of the exponent and leaving the standard Gaussian integral behind —
      the route by which normal moment generating functions get evaluated in
      closed form.

      Reach for this move before reaching for a derivative whenever the
      quadratic is simple enough to factor by eye — it's faster, it makes sign
      errors easier to catch by inspection, and it generalizes directly to the
      $\tfrac{1}{2}x'Ax-b'x$ form that shows up throughout Markowitz-style variance
      minimization.
    worked: >
      Complete the square in $-2x^{2}+8x-3$: factor out the leading
      coefficient, $-2(x^{2}-4x)-3 = -2\left[(x-2)^{2}-4\right]-3 =
      -2(x-2)^{2}+5$. Since the leading coefficient is negative, this is a
      maximum, not a minimum: the maximum value is $5$, attained at $x=2$.
    interview: >
      "Find the vertex" or "maximize/minimize this quadratic" without a
      calculator is exactly what completing the square is for — producing the
      answer in one algebraic step signals fluency the derivative route
      doesn't.
    pitfalls: >
      Losing the sign when factoring out a negative leading coefficient — the
      term inside the parentheses must flip sign correctly, as in the $-2$
      example, or the vertex location comes out wrong. Forgetting the
      $-b^{2}/(4a)$ correction term and reporting the vertex value as just $c$.
    recap: >
      Rewriting a quadratic as a perfect square plus a constant hands you the
      vertex and extreme value with no calculus at all.
    steps:
      - teach: >
          This is the mental-math route to a vertex — no derivative
          required, which matters when a speed round leaves no time to
          differentiate.
      - teach: >
          $ax^{2}+bx+c = a\left(x+\dfrac{b}{2a}\right)^{2} +
          c - \dfrac{b^{2}}{4a}$ makes the vertex $x^{*}=-b/(2a)$ visible
          by inspection, exactly the formula from Minimizing a quadratic,
          reached without calculus. The vector version does the identical
          rearrangement with a matrix $A$ standing in for $a$.
      - teach: >
          Complete the square in $3x^{2}-18x+5$: factor out the leading
          coefficient, $3(x^{2}-6x)+5 = 3\left[(x-3)^{2}-9\right]+5 =
          3(x-3)^{2}-22$.
      - ask: >
          What is the vertex $x^{*}$?
        expects: "3"
        hint: >
          Read it directly off the completed square, $3(x-3)^2-22$.
        feedback: >
          The square is $(x-3)^{2}$, so $x^{*}=3$.
      - ask: >
          Since the leading coefficient is positive, this vertex is a
          minimum. What is the minimum value?
        expects: "-22"
        hint: >
          It's the constant left outside the squared term.
        feedback: >
          $3(x-3)^{2}-22$ has minimum value $-22$, attained when the
          squared term is $0$.
      - teach: >
          The same rearrangement evaluates Gaussian integrals: $-\alpha
          x^{2}+\beta x$ completes to
          $-\alpha(x-\beta/(2\alpha))^{2}+\beta^{2}/(4\alpha)$, pulling a
          constant out of the exponent — the route by which normal moment
          generating functions get evaluated in closed form.
      - teach: >
          The correction term $-b^{2}/(4a)$ is the piece that gets dropped
          by accident most often — writing $a(x+b/2a)^{2}+c$ and stopping
          there reports the wrong constant, not just an imprecise one.
      - ask: >
          Completing the square in $5x^{2}+20x+3$ gives $5(x+2)^{2}$ plus
          what constant?
        expects: "-17"
        hint: >
          $5(x+2)^{2} = 5x^{2}+20x+20$ — compare that to the original
          constant term $3$.
        feedback: >
          $5(x^{2}+4x)+3 = 5\left[(x+2)^{2}-4\right]+3 = 5(x+2)^{2}-20+3 =
          5(x+2)^{2}-17$ — the correction term shifts $3$ down to $-17$,
          not up to it.

  - node: quant-tools.optimization.quadratic-example
    hook: >
      This is the timed drill: hand a two-variable quadratic, produce the
      exact minimizer and minimum value in under two minutes, every time,
      mechanically.
    explanation: >
      The recipe is always the same four steps. Read the Hessian off the
      second partials directly — the coefficient of $x_i^2$ doubled on the
      diagonal, the coefficient of the cross term on the off-diagonal. Check
      positive definiteness with the $2\times2$ shortcut $a>0$, $ac-b^{2}>0$
      from Second-order conditions — this single check replaces having to
      compare against every other point in the plane. Solve the two linear
      equations $\nabla f=0$ for the minimizer. Then plug the minimizer back
      into $f$ for the value, or cross-check with the matrix formula
      $c-\tfrac{1}{2} b'A^{-1}b$.

      What makes this mechanical rather than clever is that steps one and two
      only ever need to be done once per problem — after that it's solving a
      $2\times2$ linear system, which is arithmetic, not insight.
    worked: >
      Minimize $f(x,y) = 3x^{2}-2xy+3y^{2}+4x-8y$. $\nabla f =
      (6x-2y+4,\;-2x+6y-8)=0$ gives $y=3x+2$ from the first equation; substituting,
      $-2x+6(3x+2)-8=0 \Rightarrow 16x=-4 \Rightarrow x^{*}=-1/4$, so
      $y^{*}=5/4$. The Hessian has rows $(6,-2)$ and $(-2,6)$: $a=6>0$,
      $ac-b^2=32>0$, positive definite, so this is the global minimum. The
      value is $f(-1/4,\,5/4) = -5.5$.
    interview: >
      Expect exactly this setup cold — a two-variable quadratic with no
      further structure — and the interviewer is timing whether you skip
      straight to the linear system instead of narrating the theory.
    pitfalls: >
      Skipping the positive-definiteness check and assuming any stationary
      point of a quadratic is automatically the minimum. Arithmetic slips
      solving the $2\times2$ system — substitute the answer back into both
      original gradient equations, not just the one used to eliminate a
      variable.
    recap: >
      Read off the Hessian, confirm positive definiteness, solve the
      $2\times2$ system, and the minimizer and minimum value fall out as plain
      arithmetic.
    steps:
      - teach: >
          This is the timed drill: given a two-variable quadratic with no
          extra structure, produce the exact minimizer and minimum value
          quickly and mechanically.
      - teach: >
          The recipe is four steps, done once per problem: read the
          Hessian off the second partials, confirm positive definiteness
          with the $2\times2$ shortcut $a>0,\,ac-b^{2}>0$, solve
          $\nabla f=0$ for the minimizer, then plug back in for the value
          or cross-check with $c-\tfrac{1}{2}b'A^{-1}b$.
      - teach: >
          Take $q(x,y) = 2x^{2}-2xy+2y^{2}-6y$. The Hessian has rows
          $(4,-2)$ and $(-2,4)$, read off as the doubled $x^2$/$y^2$
          coefficients on the diagonal and the $xy$ coefficient off it.
      - ask: >
          For that Hessian, what is $ac-b^{2}$?
        expects: "12"
        hint: >
          $a=4$, $c=4$, $b=-2$ — substitute into $ac-b^2$.
        feedback: >
          $ac-b^{2} = 4(4)-(-2)^{2} = 16-4=12>0$, and $a=4>0$, so $q$ is
          strictly convex and any stationary point is the global minimum.
      - teach: >
          $\nabla q = (4x-2y,\; -2x+4y-6) = 0$ gives the system
          $4x-2y=0$ and $-2x+4y=6$ — two linear equations in $x$ and $y$,
          solved directly by elimination.
      - ask: >
          What is $x^{*}$?
        expects: "1"
        hint: >
          From $4x-2y=0$, $y=2x$; substitute into the second equation
          and solve.
        feedback: >
          $y=2x$, so $-2x+4(2x)=6 \Rightarrow 6x=6 \Rightarrow x^{*}=1$.
      - ask: >
          What is $y^{*}$?
        expects: "2"
        hint: >
          Use $y=2x$ with the value of $x^{*}$ you just found.
        feedback: >
          $y^{*}=2x^{*}=2(1)=2$.
      - teach: >
          Substitute the answer back into *both* original gradient
          equations, not just the one used to eliminate a variable —
          trusting only the equation you solved with is how arithmetic
          slips survive unnoticed.
      - ask: >
          What is the minimum value $q(1,2)$?
        expects: "-6"
        hint: >
          Substitute $x=1,\,y=2$ directly into $2x^{2}-2xy+2y^{2}-6y$.
        feedback: >
          $q(1,2) = 2(1)-2(1)(2)+2(4)-6(2) = 2-4+8-12=-6$.

  - node: quant-tools.optimization.least-squares
    hook: >
      This is where "minimize a quadratic" and "fit a line" turn out to be the
      identical three lines of algebra — the reasoning behind every OLS
      regression a finance interview asks about.
    explanation: >
      $S(\beta) = \lVert y-X\beta\rVert^{2}$ expands to
      $y'y - 2\beta'X'y + \beta'X'X\beta$, which is quadratic in $\beta$ because
      $y-X\beta$ is affine in $\beta$ and squaring an affine function always
      produces a quadratic. Matching to the template
      $\tfrac{1}{2}\beta'A\beta-b'\beta+c$ gives $A=2X'X$ and $b=2X'y$ — and $X'X$
      is a Gram matrix, always positive semidefinite no matter what $X$ is, so
      $S$ is convex automatically, with no case-by-case check required the way
      a generic quadratic needs.

      Positive definiteness — needed for a unique minimizer — holds exactly
      when $X$ has full column rank; short of that, $X'X$ is only
      semidefinite and the minimizers form an affine set, matching the
      degenerate case of Minimizing a quadratic. Setting $\nabla S=0$ gives the
      normal equations $X'X\beta = X'y$, the linear system you actually solve.
      Geometrically the fitted values $X\hat\beta$ are the projection of $y$
      onto the column space of $X$, but you never need that picture to compute
      $\hat\beta$ — the normal equations alone finish the problem.
    worked: >
      Fit $y=\beta_0+\beta_1x$ to $(0,2), (1,3), (2,3), (3,6)$. $X'X$ has rows
      $(4,6)$ and $(6,14)$ (from $\sum 1$, $\sum x_i$, $\sum x_i^2$), and
      $X'y = (14, 27)$ (from $\sum y_i$, $\sum x_iy_i$). Solving
      $4\beta_0+6\beta_1=14$ and $6\beta_0+14\beta_1=27$ gives $\beta_1=1.2$
      and $\beta_0=1.7$: the fitted line is $y=1.7+1.2x$.
    interview: >
      "Why is least squares convex?" wants the Gram-matrix argument —
      $X'X$ is positive semidefinite for any $X$ — not a case-by-case
      Hessian check; "derive the normal equations" wants the gradient of the
      expanded quadratic set to zero.
    pitfalls: >
      Assuming a unique $\hat\beta$ exists without checking $X$ has full
      column rank — collinear regressors leave $X'X$ singular and the
      minimizer non-unique. Extending the automatic-convexity argument to a
      different loss function where no Gram-matrix structure backs it up.
    recap: >
      Fitting a line is minimizing one convex quadratic in $\beta$, and its
      first-order condition is the normal equations $X'X\beta=X'y$.
    steps:
      - teach: >
          This is where "minimize a quadratic" and "fit a line" turn out
          to be the identical three lines of algebra — the reasoning
          behind every OLS regression a finance interview asks about.
      - teach: >
          $S(\beta) = \lVert y-X\beta\rVert^{2}$ expands to
          $y'y - 2\beta'X'y + \beta'X'X\beta$, quadratic in $\beta$
          because $y-X\beta$ is affine in $\beta$. Matching to the
          template $\tfrac{1}{2}\beta'A\beta-b'\beta+c$ gives $A=2X'X$
          and $b=2X'y$ — and $X'X$, a Gram matrix, is always positive
          semidefinite no matter what $X$ is, so $S$ is convex
          automatically.
      - teach: >
          Positive definiteness — needed for a unique minimizer — holds
          exactly when $X$ has full column rank. Setting $\nabla S=0$
          gives the normal equations $X'X\beta = X'y$, the linear system
          you actually solve.
      - teach: >
          Fit $y=\beta_0+\beta_1x$ to $(1,2), (2,3), (3,5), (4,6)$. $X'X$
          has rows $(4,10)$ and $(10,30)$ (from $\sum 1$, $\sum x_i$,
          $\sum x_i^2$), and $X'y = (16, 47)$ (from $\sum y_i$,
          $\sum x_iy_i$).
      - ask: >
          Solving $4\beta_0+10\beta_1=16$ and $10\beta_0+30\beta_1=47$,
          what is $\beta_1$?
        expects: "1.4"
        hint: >
          Eliminate $\beta_0$ between the two equations first.
        feedback: >
          $\beta_0 = 4-2.5\beta_1$ from the first equation; substituting
          into the second, $10(4-2.5\beta_1)+30\beta_1=47 \Rightarrow
          5\beta_1=7 \Rightarrow \beta_1=1.4$.
      - ask: >
          What is $\beta_0$?
        expects: "0.5"
        hint: >
          Use $\beta_0 = 4-2.5\beta_1$ with the value of $\beta_1$ you
          just found.
        feedback: >
          $\beta_0 = 4-2.5(1.4) = 4-3.5=0.5$.
      - teach: >
          The convexity was automatic, but uniqueness was not — it
          needed $X$ to have full column rank. Collinear regressors leave
          $X'X$ singular, and the minimizer stops being a single point.
      - ask: >
          Which of these leaves $X'X$ singular?
        choices:
          - text: >
              Four distinct $x$-values with an intercept column
            feedback: >
              This is the setup just used, and it gives a full column
              rank $X$ — not singular.
          - text: >
              A second regressor column defined as exactly $3$ times the
              first
            correct: true
            feedback: >
              An exact linear dependence between columns is precisely
              what collinearity means, and it makes $X'X$ singular.
          - text: >
              Only two distinct $x$-values, each repeated twice
            feedback: >
              Two distinct $x$-values are still enough to pin down a
              line — $X$ keeps full column rank here.
          - text: >
              Residuals that are all positive
            feedback: >
              The sign of the residuals has nothing to do with the rank
              of $X'X$, which depends only on the regressor columns.
        feedback: >
          Singularity of $X'X$ comes from linear dependence among the
          columns of $X$ itself — an exact multiple of one regressor by
          another is the clearest case.

  - node: quant-tools.optimization.lagrange
    hook: >
      Whenever "subject to" attaches a clean equality — weights sum to one, a
      budget is fully spent — Lagrange multipliers turn the constrained problem
      back into an ordinary first-order condition.
    explanation: >
      At a constrained optimum, moving along the constraint surface can't
      improve $f$ to first order — if it could, you'd move that way and do
      better while staying feasible, contradicting optimality. So $\nabla f$
      must have no component tangent to the surface, which means it lies
      entirely in the space spanned by the constraint gradients
      $\nabla g_1,\dots,\nabla g_m$ (the surface's normal directions): this is
      exactly the condition $\nabla f(x^{*}) = \sum_j \lambda_j \nabla
      g_j(x^{*})$.

      The Lagrangian $L(x,\lambda) = f(x)-\sum_j\lambda_j g_j(x)$ packages this
      as an ordinary unconstrained stationarity condition: setting every
      partial of $L$ to zero reproduces the gradient equation plus, from the
      $\lambda_j$ partials, the constraints themselves. That gives $n+m$
      equations in the $n$ coordinates and $m$ multipliers — solvable exactly
      like any other first-order system, once you remember the constraints are
      part of the system, not an afterthought.
    worked: >
      Maximize $f(x,y)=xy$ subject to $x+y=10$. $L=xy-\lambda(x+y-10)$ gives
      $y-\lambda=0$ and $x-\lambda=0$, so $x=y=\lambda$; the constraint
      $x+y=10$ then forces $x=y=5$, with maximum value $f(5,5)=25$.
    interview: >
      "Maximize this subject to a budget/weight constraint" is a direct cue to
      write the $n+m$-equation Lagrange system and solve it — don't try to
      substitute the constraint in by hand unless it's genuinely a one-liner.
    pitfalls: >
      Solving $\nabla f=\lambda\nabla g$ for $x$ in terms of $\lambda$ and
      forgetting to actually impose the constraint equation to pin $\lambda$
      down. Skipping the regularity check when constraint gradients could be
      linearly dependent or zero at a candidate point — the method can
      misidentify the optimum there.
    recap: >
      At a constrained optimum, the objective's gradient is a linear
      combination of the constraint gradients — solve that system together
      with the constraints.
    steps:
      - teach: >
          Whenever "subject to" attaches a clean equality — weights sum
          to one, a budget is fully spent — Lagrange multipliers turn the
          constrained problem back into an ordinary first-order
          condition.
      - teach: >
          At a constrained optimum, moving along the constraint surface
          can't improve $f$ to first order, so $\nabla f$ must lie
          entirely in the span of the constraint gradients:
          $\nabla f(x^{*}) = \sum_j \lambda_j \nabla g_j(x^{*})$.
      - teach: >
          The Lagrangian $L(x,\lambda) = f(x)-\sum_j\lambda_j g_j(x)$
          packages this as an ordinary unconstrained stationarity
          condition: setting every partial of $L$ to zero reproduces the
          gradient equation plus, from the $\lambda_j$ partials, the
          constraints themselves — $n+m$ equations in the $n$
          coordinates and $m$ multipliers.
      - teach: >
          Maximize $f(x,y)=xy$ subject to $2x+y=12$. With
          $L=xy-\lambda(2x+y-12)$, stationarity gives $y-2\lambda=0$ and
          $x-\lambda=0$, so $y=2\lambda$ and $x=\lambda$.
      - ask: >
          Substituting $x=\lambda$, $y=2\lambda$ into the constraint
          $2x+y=12$, what is $\lambda$?
        expects: "3"
        hint: >
          $2(\lambda)+2\lambda = 12$.
        feedback: >
          $2\lambda+2\lambda=4\lambda=12 \Rightarrow \lambda=3$, giving
          $x^{*}=3$, $y^{*}=6$.
      - ask: >
          What is the maximum value $f(x^{*},y^{*})$?
        expects: "18"
        hint: >
          Substitute $x=3,\,y=6$ into $xy$.
        feedback: >
          $f(3,6) = 3 \times 6 = 18$.
      - teach: >
          Solving the multiplier equations for $x$ and $y$ in terms of
          $\lambda$ is only half the problem — forgetting to actually
          impose the constraint afterward leaves $\lambda$, and
          therefore the point itself, undetermined.
      - ask: >
          After solving $\nabla f=\lambda\nabla g$ for $x,y$ in terms of
          $\lambda$, what step is still needed?
        choices:
          - text: >
              Nothing — the multiplier equations already give the point
            feedback: >
              This is exactly the slip to avoid: $x,y$ are only known in
              terms of $\lambda$ so far, not as numbers.
          - text: >
              Substitute back into the constraint to pin down $\lambda$
              numerically
            correct: true
            feedback: >
              The constraint is the remaining equation in the $n+m$
              system — it's what turns $x=\lambda$, $y=2\lambda$ into
              actual numbers.
          - text: >
              Check second-order conditions of $L$ with respect to
              $\lambda$
            feedback: >
              $\lambda$ isn't a decision variable being optimized over
              in that sense — the constraint equation, not a
              second-order check on $\lambda$, is what's missing.
          - text: >
              Differentiate the constraint with respect to $\lambda$
            feedback: >
              The constraint $g(x)=0$ doesn't involve $\lambda$ at all —
              there is nothing to differentiate with respect to it here.
        feedback: >
          The constraint equation is the $m$-th piece of the $n+m$
          system — without imposing it, $\lambda$ and the candidate
          point are still undetermined.

  - node: quant-tools.optimization.shadow-price
    hook: >
      This is where the number $\lambda$ that falls out of a Lagrange system
      stops being algebra and becomes what a desk means by "the marginal value
      of one more unit of risk budget."
    explanation: >
      Write $V(c)$ for the optimal value as a function of the constraint level,
      $g(x)=c$. The total derivative $dV/dc$ splits into a direct effect
      (how $f$ changes with $c$ holding $x$ fixed — zero here, since $c$ only
      enters through the constraint) and an indirect effect through the moving
      optimizer $x^{*}(c)$: $dV/dc = \nabla f(x^{*})'\,dx^{*}/dc$. Substituting
      the stationarity condition $\nabla f(x^{*})=\lambda\nabla g(x^{*})$ gives
      $dV/dc = \lambda\,\nabla g(x^{*})'dx^{*}/dc$, and differentiating the
      constraint $g(x^{*}(c))=c$ itself gives $\nabla g(x^{*})'dx^{*}/dc = 1$ —
      so the indirect effect collapses to exactly $\lambda$. The movement of
      $x^{*}$ contributes nothing beyond that, because the first-order
      condition was built to make it vanish.

      That's the envelope theorem in miniature, and it's why $\lambda$ carries
      units of objective per unit of constraint: it prices exactly how much
      slack in the constraint is worth, to first order.
    worked: >
      Maximize $f(x,y)=xy$ subject to $x+y=c$. The Lagrangian
      $L=xy-\lambda(x+y-c)$ gives $y=\lambda$ and $x=\lambda$, and the
      constraint then forces $x=y=c/2$, so $V(c)=c^{2}/4$ and $\lambda=c/2$. At
      $c=10$, $\lambda=5$ and $V(10)=25$; raising the budget to $c=10.1$ gives
      $V(10.1)=102.01/4=25.5025$, a gain of about $0.5$ — matching
      $\lambda\times0.1=0.5$ to first order.
    interview: >
      "What does the multiplier mean economically?" is asked constantly around
      Kelly staking, portfolio risk budgets, and VaR limits — the expected
      answer is "marginal value of one more unit of the constrained resource,"
      stated cold.
    pitfalls: >
      Quoting a shadow price without stating the sign convention used to write
      $L$ — $f-\lambda(g-c)$ versus $f-\lambda g$ flips the sign of $\lambda$.
      Treating $\lambda$ as a fixed constant rather than a function of $c$ —
      the interpretation is only a first-order, local statement, not a promise
      that doubling the budget doubles the benefit.
    recap: >
      The multiplier equals $dV/dc$: exactly how much the optimal value
      improves per unit of relaxation in the constraint.
    steps:
      - teach: >
          This is where the number $\lambda$ that falls out of a
          Lagrange system stops being algebra and becomes what a desk
          means by "the marginal value of one more unit of budget."
      - teach: >
          Write $V(c)$ for the optimal value as a function of the
          constraint level $g(x)=c$. The indirect effect through the
          moving optimizer $x^{*}(c)$ collapses to exactly $\lambda$ once
          the stationarity condition $\nabla f(x^{*})=\lambda\nabla
          g(x^{*})$ and the differentiated constraint are substituted
          in: $dV/dc = \lambda$. The movement of $x^{*}$ itself
          contributes nothing, because the first-order condition was
          built to make it vanish.
      - teach: >
          Maximize $f(x,y)=xy$ subject to $x+2y=c$. With
          $L=xy-\lambda(x+2y-c)$, stationarity gives $y=\lambda$ and
          $x=2\lambda$; the constraint $x+2y=c$ then gives
          $2\lambda+2\lambda=4\lambda=c$.
      - ask: >
          At $c=12$, what is $\lambda$?
        expects: "3"
        hint: >
          Solve $4\lambda=12$.
        feedback: >
          $4\lambda=12 \Rightarrow \lambda=3$, giving $x^{*}=6$,
          $y^{*}=3$.
      - ask: >
          What is the optimal value $V(12)$?
        expects: "18"
        hint: >
          $V(c) = f(x^{*},y^{*}) = x^{*}y^{*}$.
        feedback: >
          $V(12) = 6 \times 3 = 18$, matching $c^{2}/8 = 144/8=18$.
      - teach: >
          That's the envelope theorem in miniature: $\lambda$ carries
          units of objective per unit of constraint, pricing exactly how
          much slack in the budget is worth, to first order, without
          needing to re-solve the whole problem at the new budget level.
      - ask: >
          Raising the budget to $c=12.2$, what is the new exact value
          $V(12.2)$?
        expects: "18.605"
        tolerance: 0.001
        hint: >
          $V(c) = c^{2}/8$; substitute $c=12.2$ directly.
        feedback: >
          $V(12.2) = 12.2^{2}/8 = 148.84/8 = 18.605$ — a gain of about
          $0.605$ from $V(12)=18$, close to the first-order prediction
          $\lambda \times 0.2 = 3 \times 0.2 = 0.6$, with the small
          remainder coming from $V$'s own curvature.
      - teach: >
          Two things about $\lambda$ are easy to overstate. It depends
          on the sign convention used to write $L$ —
          $f-\lambda(g-c)$ versus $f-\lambda g$ flips its sign — and it
          is only a first-order, local statement about $V$, not a
          promise about what happens far from the current $c$.
      - ask: >
          $V(c)=c^{2}/8$ here, so doubling $c$ from $12$ to $24$
          actually quadruples $V$ from $18$ to $72$. What does that say
          about $\lambda=c/4$?
        choices:
          - text: >
              $\lambda$ correctly prices one more unit of budget, but
              only to first order near the current $c$ — it isn't a
              promise that doubling the budget doubles the benefit
            correct: true
            feedback: >
              Exactly right: $\lambda$ is a marginal, local rate, and
              $V$'s own curvature ($c^2/8$ grows faster than linearly)
              is why a doubled budget doesn't just double the value.
          - text: >
              $\lambda$ must have been computed incorrectly, since the
              value more than doubled
            feedback: >
              $\lambda=c/4$ is correct — the mismatch is expected, not a
              sign of an error, since $\lambda$ only prices marginal,
              not proportional, changes.
          - text: >
              $\lambda$ has no meaningful units in this problem
            feedback: >
              $\lambda$ does carry units — objective per unit of
              constraint — which is exactly why it can be used to
              predict the small change computed above.
          - text: >
              $\lambda$ should equal $V(c)/c$, not $dV/dc$
            feedback: >
              $\lambda$ is defined as the marginal rate $dV/dc$, not the
              average ratio $V(c)/c$; here $V(c)/c=c/8$, which is not
              equal to $\lambda=c/4$ — the two coincide only when $V$ is
              linear in $c$, and it isn't.
        feedback: >
          $\lambda$ prices a marginal unit of budget, not a proportional
          rescaling — the quadratic growth of $V(c)$ is exactly why
          doubling the budget doesn't just double the value.

  - node: quant-tools.optimization.lagrange-example
    hook: >
      "Nearest point to a plane" and "minimum-variance point on a budget line"
      are the same computation, and recognizing that pattern instantly beats
      re-deriving Lagrange from scratch every time it appears.
    explanation: >
      Minimizing $\lVert x\rVert^{2}$ subject to a single linear constraint
      $a'x=c$ always resolves the same way: stationarity gives
      $2x_i=\lambda a_i$ for every coordinate, so $x=(\lambda/2)a$ — the
      minimizer is forced to be proportional to $a$ before you even use the
      constraint. Dotting both sides with $a$ and imposing $a'x=c$ then pins
      down $\lambda$, giving the closed form $x^{*}=c\,a/\lVert a\rVert^{2}$
      directly, with no need to re-run the Lagrangian each time this shape of
      problem appears.

      Spotting "minimize a sum of squares subject to one linear constraint" as
      this pattern, rather than as a generic Lagrange problem, is what turns a
      multi-step derivation into a formula lookup.
    worked: >
      Minimize $f(x,y)=x^{2}+y^{2}$ subject to $2x+y=10$. With $a=(2,1)$,
      $c=10$: $\lVert a\rVert^{2}=5$, so $x^{*}=10(2,1)/5=(4,2)$, value
      $16+4=20$. Direct Lagrange confirms it: $L=x^2+y^2-\lambda(2x+y-10)$
      gives $x=\lambda$, $y=\lambda/2$, and the constraint
      $2\lambda+\lambda/2=10$ gives $\lambda=4$, matching $(4,2)$; the shadow
      price check $V(c)=c^2/5$ gives $V'(10)=4=\lambda$.
    interview: >
      "Find the point on this line closest to the origin" is a recurring
      geometry-flavored Lagrange question — quote the proportional-to-$a$
      shortcut first, with the full Lagrangian as backup if you're pressed to
      justify it.
    pitfalls: >
      Reporting the squared distance ($20$ here) when the question asked for
      distance itself ($\sqrt{20}=2\sqrt5$). Sign errors moving the constraint
      constant to the wrong side of $a'x=c$, which propagates straight into
      $x^{*}$.
    recap: >
      Minimizing a sum of squares subject to one linear constraint always
      lands on $x^{*}=c\,a/\lVert a\rVert^{2}$, here $(4,2)$ at value $20$.
    steps:
      - teach: >
          "Nearest point to a plane" and "minimum-variance point on a
          budget line" are the same computation, and recognizing that
          pattern instantly beats re-deriving Lagrange from scratch every
          time it appears.
      - teach: >
          Minimizing $\lVert x\rVert^{2}$ subject to a single linear
          constraint $a'x=c$ always resolves the same way: stationarity
          gives $2x_i=\lambda a_i$ for every coordinate, so
          $x=(\lambda/2)a$ — the minimizer is forced to be proportional
          to $a$ before the constraint is even used. Dotting both sides
          with $a$ and imposing $a'x=c$ pins down $\lambda$, giving the
          closed form $x^{*}=c\,a/\lVert a\rVert^{2}$ directly.
      - teach: >
          Minimize $f(x,y)=x^{2}+y^{2}$ subject to $3x+4y=25$. Here
          $a=(3,4)$ and $c=25$, with $\lVert a\rVert^{2} = 9+16=25$.
      - ask: >
          What is $x^{*}$?
        expects: "3"
        hint: >
          Use $x^{*}=c\,a/\lVert a\rVert^{2}$ on the first coordinate.
        feedback: >
          $x^{*} = 25(3)/25 = 3$.
      - ask: >
          What is $y^{*}$?
        expects: "4"
        hint: >
          Use $x^{*}=c\,a/\lVert a\rVert^{2}$ on the second coordinate.
        feedback: >
          $y^{*} = 25(4)/25 = 4$.
      - ask: >
          What is the minimum value $f(3,4)$?
        expects: "25"
        hint: >
          Substitute the minimizer directly, or use
          $c^{2}/\lVert a\rVert^{2}$.
        feedback: >
          $f(3,4) = 9+16=25$, matching $c^{2}/\lVert a\rVert^{2} =
          625/25=25$.
      - teach: >
          The value found this way is the squared distance from the
          origin to the constraint line, not the distance itself —
          reporting $25$ when the interviewer asked for a distance is
          the standard slip.
      - ask: >
          What is the actual distance from the origin to the line
          $3x+4y=25$?
        choices:
          - text: >
              $25$
            feedback: >
              That's the squared distance, $f(3,4)$ — the question
              asked for the distance itself.
          - text: >
              $5$
            correct: true
            feedback: >
              The distance is $\sqrt{25}=5$ — take the square root of
              the minimum value found above.
          - text: >
              $50$
            feedback: >
              This doubles the squared distance instead of taking its
              square root.
          - text: >
              $12.5$
            feedback: >
              This halves the squared distance instead of taking its
              square root.
        feedback: >
          The minimization gives squared distance $25$; the distance
          itself is $\sqrt{25}=5$ — the two are easy to conflate under
          time pressure.

  - node: quant-tools.optimization.kkt
    hook: >
      The moment "subject to" turns into an inequality — a budget that need
      only be met, a no-short constraint — Lagrange's equality machinery isn't
      enough, and the sign of the multiplier is exactly what an interviewer
      probes.
    explanation: >
      KKT extends the Lagrangian $L=f+\sum_i\mu_ig_i+\sum_j\lambda_jh_j$ with
      two new conditions beyond ordinary stationarity and feasibility. Dual
      feasibility $\mu_i\ge0$ holds because relaxing a binding inequality
      $g_i(x)\le0$ — loosening the bound — only ever enlarges the feasible set,
      so the optimal value can only improve, never worsen; the shadow price of
      an inequality constraint can't be negative the way an equality's sign is
      a free convention. Complementary slackness $\mu_i\,g_i(x^{*})=0$ says
      each inequality is either binding, with a nonnegative price attached, or
      strictly slack, in which case its multiplier is forced to zero because a
      constraint that doesn't touch the boundary can't be pulling on the
      gradient balance.

      The practical recipe is to guess which inequalities are active, solve
      the resulting equality-constrained problem, then verify the guess: check
      $\mu_i\ge0$ for every guessed-active constraint and feasibility for every
      guessed-slack one. A failed check means the guess was wrong, not that the
      method failed.
    worked: >
      Minimize $f(x,y)=(x-3)^{2}+(y-3)^{2}$ subject to $x+y\le4$, $x\ge0$,
      $y\ge0$. The unconstrained minimum $(3,3)$ violates $x+y\le4$, so guess
      only that constraint binds. With $L=f+\mu(x+y-4)$: stationarity gives
      $x=y=3-\mu/2$, and the active constraint $x+y=4$ gives $\mu=2$, so
      $(x,y)=(2,2)$. Check: $\mu=2\ge0$ (valid) and $x,y\ge0$ hold strictly, so
      those multipliers are correctly $0$ by complementary slackness. Minimum
      value is $f(2,2)=1+1=2$.
    interview: >
      Portfolio problems with a budget and no-short constraints are the
      standard setting — expect to guess the active set, solve, and defend the
      guess with $\mu\ge0$ and complementary slackness rather than solving a
      generic nonlinear program blind.
    pitfalls: >
      Getting the required sign of $\mu$ backwards for a maximization or for
      the opposite inequality direction — always re-derive which sign helps
      the objective rather than memorizing one sign. Trusting a guessed active
      set without verifying $\mu\ge0$ and primal feasibility — a failed check
      means try a different active set, not that the answer stands anyway.
    recap: >
      KKT adds nonnegative multipliers and complementary slackness to
      Lagrange: each inequality either binds with a nonnegative price or sits
      slack with multiplier zero.
    steps:
      - teach: >
          The moment "subject to" turns into an inequality — a budget
          that need only be met, a no-short constraint — Lagrange's
          equality machinery isn't enough, and the sign of the
          multiplier is exactly what an interviewer probes.
      - teach: >
          For minimize $f(x)$ subject to $g_i(x)\le0$, write
          $L=f+\sum_i\mu_ig_i$. A local minimizer satisfies stationarity
          $\nabla_x L=0$, primal feasibility, dual feasibility
          $\mu_i\ge0$, and complementary slackness
          $\mu_i\,g_i(x^{*})=0$ — each inequality either binds with a
          nonnegative price or sits strictly slack with multiplier
          forced to $0$.
      - teach: >
          Dual feasibility isn't optional: relaxing a binding inequality
          only ever enlarges the feasible set, so the optimal value can
          only improve, never worsen — that's why $\mu_i\ge0$, unlike an
          equality multiplier's sign, isn't a free convention. The
          recipe: guess the active set, solve the resulting equality
          problem, then verify $\mu\ge0$ and feasibility.
      - teach: >
          Minimize $f(x,y)=(x-5)^{2}+(y-5)^{2}$ subject to $x+y\le6$,
          $x\ge0$, $y\ge0$. The unconstrained minimum $(5,5)$ violates
          $x+y\le6$, so guess only that constraint binds:
          $L=f+\mu(x+y-6)$ gives $2(x-5)+\mu=0$, so $x=5-\mu/2$, and
          symmetrically $y=5-\mu/2$.
      - ask: >
          Imposing the active constraint $x+y=6$, what is $\mu$?
        expects: "4"
        hint: >
          $2(5-\mu/2)=6$.
        feedback: >
          $2(5-\mu/2)=10-\mu=6 \Rightarrow \mu=4$, giving $x=y=5-2=3$.
      - ask: >
          What is the minimum value $f(3,3)$?
        expects: "8"
        hint: >
          $f(3,3) = (3-5)^{2}+(3-5)^{2}$.
        feedback: >
          $f(3,3) = 4+4=8$. Checking the guess: $\mu=4\ge0$ is valid,
          and $x,y=3\ge0$ hold strictly, so those two multipliers are
          correctly $0$ by complementary slackness.
      - teach: >
          Unlike the equality case, the sign of $\mu$ is not a
          convention you get to pick — it's a diagnostic. A negative
          $\mu$ on your guessed active set is a sign the guess itself
          was wrong, not a valid answer to report.
      - ask: >
          Solving the guessed active set above had instead produced
          $\mu=-1$. What should you conclude?
        choices:
          - text: >
              The guess was correct — $\mu$ is simply negative sometimes
            feedback: >
              Dual feasibility requires $\mu\ge0$ for a $\le$ constraint
              at a minimum — a negative value fails that check
              outright.
          - text: >
              The guessed active set is wrong; try a different one
            correct: true
            feedback: >
              A failed sign check means the guessed active set doesn't
              describe the true optimum — the recipe is to guess again,
              not to accept the negative multiplier.
          - text: >
              The objective must not be convex
            feedback: >
              The sign of $\mu$ says nothing about the objective's
              convexity — it's a diagnostic on the guessed active set
              specifically.
          - text: >
              Ignore the sign — it's a free convention, the same as in
              the equality case
            feedback: >
              This is exactly backwards: the equality multiplier's sign
              is a free convention, but the inequality multiplier's sign
              is not.
        feedback: >
          A negative $\mu$ on a guessed $\le$-constraint always means
          the guess was wrong — dual feasibility is a check on the
          guess, not a convention to wave away.

  - node: quant-tools.optimization.flat-optimum
    hook: >
      This is why a desk doesn't sweat rounding a stake or a hedge ratio, but
      does sweat covariance-estimation noise driving huge swings in an
      "optimal" portfolio.
    explanation: >
      At an interior optimum the gradient term of the Taylor expansion
      vanishes, leaving $f(x^{*}+h) - f(x^{*}) \approx \tfrac{1}{2} h'Hh$: a
      relative error of size $\varepsilon$ in your choice of $x$ costs order
      $\varepsilon^{2}$ in the objective, not order $\varepsilon$. That
      quadratic — not linear — falloff is why inputs to an optimizer can
      tolerate more slop than the optimizer's own precision suggests: a
      slightly wrong stake or a rounded hedge ratio gives up very little.

      The same fact runs backward and turns unfriendly: because the objective
      resists movement of $x$ near the optimum, it's correspondingly
      uninformative about exactly where $x^{*}$ sits, so noise in the data used
      to build $f$ — an estimated covariance matrix, say — can move the
      inferred optimum a long way even though the objective value barely
      changes. This is precisely why portfolio weights coming out of an
      optimizer run on noisy covariance estimates are so much less stable than
      the smoothness of the objective would suggest.
    worked: >
      Maximize $f(x) = x(20-x)$: $f'(x)=20-2x=0$ gives $x^{*}=10$,
      $f(10)=100$. A $30\%$-high input, $x=13$, gives $f(13)=13\cdot7=91$, a
      loss of $9\%$ — exactly $0.3^{2}$, matching the $\varepsilon^{2}$ scaling
      precisely because $f$ is exactly quadratic here.
    interview: >
      "How sensitive is the optimal value to a small error in your inputs,
      versus how sensitive is the optimal decision itself?" is the standard
      framing — the objective is quadratically forgiving, the argmax is not,
      and the two answers are opposite in character.
    pitfalls: >
      Extending the "small errors cost little" comfort to the data that builds
      $f$ itself — noisy inputs move where the optimum sits, sometimes
      substantially, precisely because the objective doesn't resist that
      motion. Assuming the $\varepsilon^{2}$ scaling near a boundary or kink
      optimum, where the gradient needn't vanish and first-order costs can
      appear instead.
    recap: >
      Near an optimum the objective is quadratically flat — cheap to
      misjudge — while the location of the optimum itself is correspondingly
      hard to pin down from noisy data.
    steps:
      - teach: >
          This is why a desk doesn't sweat rounding a stake or a hedge
          ratio, but does sweat covariance-estimation noise driving huge
          swings in an "optimal" portfolio.
      - teach: >
          At an interior optimum the gradient term of the Taylor
          expansion vanishes, leaving
          $f(x^{*}+h)-f(x^{*}) \approx \tfrac{1}{2}h'Hh$: a relative
          error of size $\varepsilon$ in your choice of $x$ costs order
          $\varepsilon^{2}$ in the objective, not order $\varepsilon$.
      - teach: >
          The same fact runs backward and turns unfriendly: because the
          objective resists movement of $x$ near the optimum, it's
          correspondingly uninformative about exactly where $x^{*}$
          sits, so noise in the data used to build $f$ can move the
          inferred optimum a long way even though the objective value
          barely changes.
      - teach: >
          Maximize $g(x) = x(30-x)$. $g'(x)=30-2x=0$ gives $x^{*}=15$,
          with $g(15) = 15\times15=225$.
      - ask: >
          A $20\%$-high input, $x=18$, gives what value $g(18)$?
        expects: "216"
        hint: >
          $g(18) = 18 \times (30-18)$.
        feedback: >
          $g(18) = 18\times12=216$.
      - ask: >
          What is the absolute loss $g(15)-g(18)$?
        expects: "9"
        hint: >
          Subtract the two values found so far.
        feedback: >
          $225-216=9$, a relative loss of $9/225=0.04$ — exactly
          $0.2^{2}$, matching the $\varepsilon^{2}$ scaling precisely
          because $g$ is exactly quadratic here.
      - teach: >
          This comfort doesn't extend to the *location* of the optimum.
          Portfolio weights coming out of an optimizer run on estimated
          covariances are far less stable than the smoothness of the
          objective would suggest, precisely because a flat objective
          barely resists moving away from $x^{*}$.
      - ask: >
          A quant rounds a hedge ratio slightly near a smooth optimum.
          What happens to the objective value, compared to the location
          itself?
        choices:
          - text: >
              Both degrade at the same, linear rate
            feedback: >
              The objective's degradation is quadratic in the error, not
              linear — that asymmetry is the whole point.
          - text: >
              The objective barely moves, while the argmax itself can
              only be pinned down loosely from a flat objective
            correct: true
            feedback: >
              Exactly the two-sided fact: quadratically forgiving in
              value, correspondingly hard to localize in $x$.
          - text: >
              The objective is completely unaffected, exactly $0$ loss
            feedback: >
              The loss is small, of order $\varepsilon^{2}$, but not
              literally zero for any nonzero error.
          - text: >
              The argmax becomes exactly correct despite the objective
              loss
            feedback: >
              This has it backwards — it's the objective that's
              forgiving, not the location, which is the harder of the
              two to pin down.
        feedback: >
          Near an optimum the objective is quadratically flat — cheap to
          misjudge — while the location of the optimum itself is
          correspondingly hard to pin down from noisy data.
