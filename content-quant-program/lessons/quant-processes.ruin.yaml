unit: quant-processes.ruin
opening: >
  Gambler's ruin is the master template behind a large share of interview
  probability questions: two competing stacks, a repeated coin flip, and the
  game stops the instant either side is wiped out. This unit builds the whole
  family from a single recursion — condition on the first round, solve the
  resulting linear equation, and read off the boundary values — first for a
  fair coin, where the ruin probability collapses to a share of the combined
  pot, then for a biased one, where it becomes a ratio of exponentials in the
  odds. From there it covers how long the game is expected to last, what
  happens when the opponent's bankroll is unlimited, and what it means to bet
  big or small when the odds are against you.
lessons:
  - node: quant-processes.ruin.setup
    hook: >
      Every ruin-family question you meet — fair coin, biased coin, unlimited
      house, doubling your stack — is this same two-barrier picture wearing
      different numbers, so getting the state variable $k$ and the two
      boundary conventions cold up front pays off in every node that follows.
    explanation: >
      Take the simple symmetric random walk's picture — independent $\pm 1$
      steps — and add two walls: the moment the running total touches $0$ or
      $N$, the process stops for good. Everything else about the walk is
      unchanged; the only new ingredient is that contact with either barrier
      ends play, so no path ever revisits a barrier or continues past it.

      The reason $R$ and $W$ are written as functions of $k$, not as single
      numbers, is that solving this problem needs an unknown attached to
      every interior state at once — condition on one round from state $k$
      and the walk lands at $k+1$ or $k-1$, both themselves states of the same
      problem. That restart property is what a later node turns into a
      solvable equation; naming $R(k)$ now is what makes that equation
      possible to write down at all.

      The two boundary values are definitions, not derived facts: $R(0)=1$
      because starting already ruined means ruin has already happened, and
      $R(N)=0$ because starting already at the target means the target has
      already been hit. Every later formula must reduce to these at the
      edges — a fast, free check on any derivation.

      The picture recurs constantly in disguise: a market maker's inventory
      wandering between a stop-loss and a target size, a series that ends the
      moment either side reaches a fixed number of wins, a random walk stopped
      the instant it exits a band. Spotting "two absorbing levels, one tracked
      quantity" is spotting this node.
    worked: >
      Consider a spread that starts $3$ ticks in your favor out of a combined
      $8$-tick range: $k=3$, $N=8$, moving up one tick with probability $p$
      each round. Before any equation is solved, the setup alone pins down
      $R(0)=1$ and $R(8)=0$ — if the spread starts already at the loss
      barrier, ruin has already occurred, and if it starts at $8$, the target
      has already been reached. $R(3)$ itself, the actual question, is what
      the rest of this unit computes.
    interview: >
      Interviewers often narrate a story — two traders, a series score, a
      random walk with a stop-loss — without ever saying "gambler's ruin";
      the tell is a quantity moving by fixed increments that stops the instant
      it hits one of two fixed levels. State $k$, $N$, and $p$ explicitly
      before writing any formula.
    pitfalls: >
      Mixing up which side is $k$ and which is $N-k$ flips every later
      answer, since $R$ and $W$ are not symmetric in the two stacks. Treating
      a barrier as reflecting rather than absorbing — assuming play can
      bounce off $0$ and continue — silently changes the entire problem.
    recap: >
      Gambler's ruin is a $\pm 1$ walk started at $k$ and stopped the instant
      it touches $0$ or $N$, with $R(k)$ and $W(k)$ tracking which wall it
      hits first.
    dialogue:
      - part: Four chips against six
        teach: >
          You hold $4$ chips and a friend holds $6$. Each round a coin is
          flipped and the loser hands one chip to the winner. The game stops
          the moment one of you holds all $10$.
      - ask: >
          Counting the two values at which the game stops, how many different
          sizes can your stack take during the game?
        expects: "11"
        hint: >
          Your stack moves one chip at a time and can never leave the range
          the two of you hold between you.
        feedback: >
          Every whole number from $0$ to $10$: that is $11$ values. Nine of
          them, $1$ through $9$, are states where play continues; $0$ and $10$
          are the two where it stops.
      - ask: >
          To describe the game completely you track your own stack and
          nothing else. Why is that enough?
        choices:
          - text: >
              The friend's stack does not affect who wins.
            feedback: >
              It decides everything: the game ends when the friend reaches $0$
              just as much as when you do. It is enough to track only yours
              for a different reason.
          - text: >
              The friend's stack is always $10$ minus yours.
            correct: true
            feedback: >
              Chips only change hands, so the total is fixed at $10$. Your
              stack reaching $10$ is the same event as the friend's reaching
              $0$.
          - text: >
              The coin is fair, so the two stacks behave the same way.
            feedback: >
              Fairness has nothing to do with it; the bookkeeping would be the
              same with a biased coin. What makes one number enough is that
              the total never changes.
        feedback: >
          One number, two walls. Your stack is a $\pm 1$ walk that starts at
          $4$ and stops on touching $0$ or $10$; the friend's stack is the
          distance from you to the upper wall.

      - part: Which games are this game
        ask: >
          Four more games. Which one is, after relabelling, exactly the
          chip game: one quantity moving $\pm 1$ per independent round,
          stopped for good at two fixed levels?
        choices:
          - text: >
              Each round you win one chip or lose two; stop at $0$ or $10$.
            feedback: >
              The steps are not $\pm 1$. From $1$ chip a loss of two takes you
              to $-1$, jumping past the wall at $0$ instead of landing on it.
          - text: >
              Same coin and walls, but on reaching $0$ the house lends you one
              chip and play goes on.
            feedback: >
              The wall at $0$ no longer stops anything: the walk bounces off
              it. That is a reflecting barrier, a different problem with
              different answers.
          - text: >
              A best-of-seven series: the first team to four wins takes it.
            feedback: >
              Each team's win count only goes up, and the series stops when
              either count reaches $4$, not when one quantity hits one of two
              fixed levels. The difference of the counts does move by
              $\pm 1$, but it stops at levels that depend on how many games
              were played.
          - text: >
              Two players trade points, each won by you with probability
              $0.55$; the match ends when someone is three points ahead.
            correct: true
            feedback: >
              Track your lead. It moves by $\pm 1$ each point, rounds are
              independent with the same $p$, and the match ends the moment
              the lead touches $+3$ or $-3$.
        feedback: >
          The game in disguise is the one whose lead lives on a fixed strip
          and dies at either end. The other three each break one part of the
          picture.
      - reflect: >
          Say exactly what you were checking about each game when you threw it
          out.
        answer: >
          Four things. One number describes the state. It moves by exactly one
          unit up or down each round. Rounds are independent with the same
          up-probability $p$. And there are two fixed levels at which play
          stops for good: touching either ends the game, so the walk can
          neither bounce off a wall nor jump over one.
      - teach: >
          That is the two-barrier absorbing walk. Shift it so the lower wall
          sits at $0$; then $N$ is the width of the strip, the combined
          bankroll, and $k$ is where you start. $R(k)$ is the probability of
          touching $0$ first and $W(k)$ of touching $N$ first. Both are
          functions of $k$, because answering the question from one state
          will turn out to need the answer from its neighbours.

      - part: Translating the three-ahead match
        ask: >
          In the three-points-ahead match, shift the lead so the losing wall
          sits at $0$. What is $N$?
        expects: "6"
        hint: >
          The lead lives between $-3$ and $+3$.
        feedback: >
          Adding $3$ to the lead moves $-3$ to $0$ and $+3$ to $6$, so
          $N = 6$. It is the width of the strip, not the $3$ points you
          need to win.
      - ask: >
          You currently lead by one point. What is your starting state $k$?
        expects: "4"
        hint: >
          Apply the same shift to the current lead.
        feedback: >
          $1 + 3 = 4$. Check: you are $6 - 4 = 2$ points from winning and $4$
          from losing, exactly as in the original match, where you lead by
          one and need two more.
      - ask: >
          Suppose instead the lead is already $+3$ when you sit down. What is
          the probability that you lose the match?
        expects: "0"
        hint: >
          What happens on contact with a wall?
        feedback: >
          The match is already over and you won it, so $R(6) = 0$ and
          $W(6) = 1$. In general $R(N) = 0$ and $R(0) = 1$: the walls hand
          you the boundary values for free, before any equation is solved.

      - part: A game that fails one clause
        ask: >
          Back to the chips. Your friend tilts: whenever she holds $3$ chips
          or fewer, she wins each round with probability only $0.4$ instead
          of $0.5$. Is this still the two-barrier walk with a fixed $p$?
        choices:
          - text: >
              Yes: steps are still $\pm 1$ and both walls still end the game.
            feedback: >
              Three clauses survive, and one does not. The up-probability now
              depends on where the walk is, so there is no single $p$, and
              every formula that will be built from a fixed $p$ fails.
          - text: >
              No: the rounds are no longer independent with one fixed $p$.
            correct: true
            feedback: >
              Exactly one clause breaks. The walk is still $\pm 1$ and still
              absorbed at $0$ and $10$, but the coin changes with the state.
          - text: >
              No: the walls have moved.
            feedback: >
              The game still stops at $0$ and $10$ chips. What changed is the
              coin, not the walls.
        feedback: >
          When an interviewer describes a game, check those four clauses out
          loud, then say "$k$ is ..., $N$ is ..., $p$ is ...". Getting $k$
          and $N$ right, with the lower wall at $0$, is half of every answer
          in this family.

  - node: quant-processes.ruin.absorption-certain
    hook: >
      Every later derivation solves the first-step equation as though a
      bounded solution is automatically the right one — this node is the
      reason that shortcut is legitimate rather than wishful thinking.
    explanation: >
      Solving $R(k)=p\,R(k+1)+q\,R(k-1)$ with the boundary values $R(0)=1$,
      $R(N)=0$ only pins down $R$ correctly if the walk is guaranteed to
      eventually hit a barrier at all — otherwise some probability mass
      belongs to paths that wander forever, and $R(k)+W(k)$ would be strictly
      less than $1$. This node closes that gap.

      The argument doesn't track individual steps; it tracks blocks of $N$
      rounds. From any interior state, $N$ consecutive wins walk straight to
      the top barrier, so each disjoint block of $N$ rounds has probability
      at least $\min(p,q)^{N}$ of ending the game, regardless of where inside
      $(0,N)$ the block started. Surviving $m$ such blocks unabsorbed then has
      probability at most $(1-\min(p,q)^{N})^{m}$, a number that shrinks
      geometrically and tends to $0$ as $m\to\infty$ — so absorption happens
      with probability exactly $1$.

      The same bound does more than settle $R+W=1$: because the number of
      blocks needed is itself geometrically tailed, every moment of the
      duration is finite, including its expectation. That's the license the
      rest of this unit uses freely — solving a first-step recursion for a
      bounded solution and trusting the answer, rather than worrying about
      paths that never stop.
    worked: >
      Take $p=0.3$, so $\min(p,q)=0.3$ and $N=5$: each block of $5$ rounds
      absorbs with probability at least $0.3^{5}=0.00243$. After $1000$
      blocks (that is, $5000$ rounds), the probability of still being
      unabsorbed is at most $(1-0.00243)^{1000}\approx0.088$; after $2000$
      blocks ($10000$ rounds) it's down to about $0.0077$ — visibly
      collapsing toward $0$, exactly as the bound predicts.
    interview: >
      "Why are you allowed to assume $R(k)+W(k)=1$" is a real follow-up to
      any ruin derivation; the expected answer is the block argument, not
      "because probabilities have to add to something". A sharper version
      asks what breaks if $p=0$ or $p=1$ — the walk becomes deterministic and
      the argument needs a one-line adjustment.
    pitfalls: >
      The block bound uses $\min(p,q)^{N}$, not $p^{N}$ or $q^{N}$ alone —
      using the wrong one of the two can understate how fast absorption
      becomes certain. The argument needs $0<p<1$ strictly; at $p=0$ or $p=1$
      every round moves the same direction, and absorption is certain for the
      trivial reason that the walk marches straight to one wall.
    recap: >
      $N$-round blocks each absorb with probability at least
      $\min(p,q)^{N}>0$, forcing the chance of never stopping to $0$ and
      making the expected duration finite.
    dialogue:
      - part: One chip out of three
        teach: >
          An interviewer asks: "Two players, one chip changes hands per round,
          play to the finish. Could the game go on forever?" Take the smallest
          real case. You hold $1$ chip, the opponent holds $2$, and you win
          each round with probability $0.6$.
      - ask: >
          What is the probability that the game is still going after $2$
          rounds?
        expects: "0.24"
        hint: >
          From $1$, a loss ends it at once. From $2$, a win ends it. Which
          sequence of two rounds avoids both walls?
        feedback: >
          The only surviving path is win then lose, $1 \to 2 \to 1$, with
          probability $0.6 \times 0.4 = 0.24$. Every other two-round
          sequence hits a wall.
      - ask: >
          And after $6$ rounds?
        expects: "0.013824"
        tolerance: 0.000001
        hint: >
          After two rounds the surviving path is back where it started.
        feedback: >
          Surviving means repeating win-lose three times:
          $0.24^{3} = 0.013824$. After $2m$ rounds the survival probability
          is exactly $0.24^{m}$.
      - ask: >
          The path win, lose, win, lose, ... never ends. Does that mean the
          game lasts forever with some positive probability?
        choices:
          - text: >
              Yes: an infinite path exists, so it has some small probability.
            feedback: >
              Existing and having positive probability are different things.
              That one path has probability at most $0.24^{m}$ for every $m$,
              and the only number below all of those is $0$.
          - text: >
              No: its probability is below $0.24^{m}$ for every $m$, so it is
              $0$.
            correct: true
            feedback: >
              Right. Possible is not the same as probable: the never-ending
              path is a single outcome of probability zero.
          - text: >
              No: a fair or biased coin must eventually produce a long run of
              wins.
            feedback: >
              The conclusion is right, the reason is not quite. Here no long
              run is needed; what kills the infinite path is that each pair of
              rounds survives with probability only $0.24$.
        feedback: >
          On three chips the survival probability is a clean geometric
          sequence. On a table of $10$ or $100$ chips you cannot list the
          surviving paths, so you need a bound that does not care which path
          the walk is on.

      - part: Why it cannot go on forever
        reflect: >
          Take any $N$ and any $0 < p < 1$. Find one event, available from
          every interior state, that is certain to end the game within $N$
          rounds, and say what it does to the chance of surviving many rounds.
        hint: >
          You do not know where the walk is. What run of results finishes the
          game from anywhere?
        answer: >
          $N$ wins in a row. From any interior state at most $N - 1$ wins
          reach the top wall, so a block of $N$ straight wins ends the game
          wherever the block starts. That has probability $p^{N}$, at least
          $c = \min(p,q)^{N} > 0$, so every block of $N$ rounds survives with
          probability at most $1 - c$, and $m$ blocks with probability at
          most $(1 - c)^{m} \to 0$.
      - teach: >
          That is the whole proof that absorption is certain: chop time into
          disjoint blocks of $N$ rounds, note each block finishes the game
          with probability at least $c = \min(p,q)^{N}$ whatever state it
          starts in, and multiply. The probability of never being absorbed is
          below $(1 - c)^{m}$ for every $m$, hence $0$, and so
          $R(k) + W(k) = 1$.
      - ask: >
          Why may the per-block survival bounds be multiplied together?
        choices:
          - text: >
              Because every block has the same length.
            feedback: >
              Equal lengths make the bound the same number each time, but
              multiplying needs more than that: it needs the blocks not to
              influence each other's chance of finishing the game.
          - text: >
              Because the blocks use disjoint, independent rounds, and the
              bound $c$ holds from whatever state a block starts in.
            correct: true
            feedback: >
              Both halves matter. Independence lets you condition on surviving
              the earlier blocks, and the uniform bound means you never need
              to know where that left you.
          - text: >
              Because the walk returns to its starting state after each block.
            feedback: >
              It does not, in general. The three-chip game happened to come
              back to $1$ every two rounds; on a bigger table the walk drifts
              around, which is exactly why the bound must hold from every
              state.
        feedback: >
          Conditioning block by block: given survival so far, the next block
          finishes the game with probability at least $c$, so each block
          multiplies the survival probability by at most $1 - c$.

      - part: The bound on a bigger table
        ask: >
          Take a fair coin and $N = 6$. Using only the block bound, what upper
          bound do you get on the probability that the game survives $100$
          blocks, that is $600$ rounds? Give four decimal places.
        expects: "0.2070"
        tolerance: 0.0005
        hint: >
          Here $c = (1/2)^{6}$.
        feedback: >
          $c = 1/64$, so the bound is $(63/64)^{100} \approx 0.2070$. Crude:
          the true chance of a fair game on $6$ chips lasting $600$ rounds is
          astronomically smaller. The bound is built to be certain, not tight.
      - ask: >
          How many blocks does the same bound need before it drops below
          $0.01$?
        expects: "293"
        hint: >
          Solve $(63/64)^{m} < 0.01$ with logarithms.
        feedback: >
          $m > \ln(0.01)/\ln(63/64) \approx 4.6052/0.015748 \approx 292.4$,
          so $293$ blocks. Slow, but every $293$ blocks multiply the bound by
          another $0.01$: the tail is geometric.
      - ask: >
          A geometric tail also bounds the expected length. Since
          $\mathbb{E}[T]$ is at most $N$ times the expected number of blocks
          started, $N \sum_{m \ge 0} (1 - c)^{m} = N/c$, what does it give for
          the fair game with $N = 6$?
        expects: "384"
        hint: >
          The geometric series sums to $1/c$.
        feedback: >
          $N/c = 6 \times 64 = 384$ rounds. The true expected length is far
          smaller, but finiteness is what matters: the expected duration and
          every moment of it are finite, which later lessons rely on.

      - part: Where the argument stops working
        ask: >
          Which change makes the block argument say nothing at all?
        choices:
          - text: >
              Making the coin very lopsided, $p = 0.99$.
            feedback: >
              $c = 0.01^{N}$ is tiny but positive, so the bound still goes to
              $0$, just slowly. Absorption is still certain.
          - text: >
              Making the table huge, $N = 1000$.
            feedback: >
              Same story: $c = \min(p,q)^{1000}$ is minuscule but positive,
              and $(1 - c)^{m} \to 0$ all the same.
          - text: >
              Removing the upper wall, so only ruin ends the game.
            correct: true
            feedback: >
              Now no fixed number of wins finishes the game from every state,
              so there is no block length and no $c > 0$. The argument gives
              nothing, and whether the game must end becomes a genuinely
              different question.
        feedback: >
          The proof needs both walls at a finite distance. With them, you have
          the licence the rest of the unit uses: $R + W = 1$, the expected
          duration is finite, and the first-step equations can be solved for a
          bounded answer without worrying about paths that never stop. Said
          aloud: "$N$ wins in a row end it from anywhere, so each block of $N$
          rounds ends it with probability at least $\min(p,q)^{N}$, and the
          survival probability decays geometrically."

  - node: quant-processes.ruin.ruin-equation
    hook: >
      This one substitution — condition on the very first round — is the
      engine behind every closed form in this unit, and it's worth being able
      to set up and solve on a small case without reaching for any packaged
      formula.
    explanation: >
      First-step analysis gives the recipe directly: name one unknown per
      state — $R(k)$ here — and write what happens after conditioning on a
      single round. From an interior $k$, the next round lands at $k+1$ with
      probability $p$ or $k-1$ with probability $q$, and by the same restart
      property from the setup, the probability of eventual ruin from there is
      again $R(k+1)$ or $R(k-1)$. Averaging over the first round's two
      outcomes gives $R(k)=p\,R(k+1)+q\,R(k-1)$ — one equation per interior
      state, $N-1$ equations in $N-1$ unknowns once the boundary values are
      substituted in.

      The same template answers a different question with almost no change:
      the expected number of rounds $D(k)$ pays for the round just taken
      before restarting, so $D(k)=1+p\,D(k+1)+q\,D(k-1)$ — identical
      structure, one extra constant term. Any quantity depending only on the
      current state and obeying the walk's dynamics gets the same treatment.

      At the two ends of the range the system self-closes: the equation at
      $k=1$ reads $R(1)=p\,R(2)+q\,R(0)$, and $R(0)=1$ is a known number, not
      another unknown — the boundary substitutes directly rather than adding
      an equation. That's what turns an infinite-looking recursive definition
      into a finite, solvable linear system.
    worked: >
      Take $N=4$ and $p=1/3$ (so $q=2/3$). The three interior equations are
      $R(1)=\tfrac13R(2)+\tfrac23\cdot1$, $R(2)=\tfrac13R(3)+\tfrac23R(1)$,
      and $R(3)=\tfrac13\cdot0+\tfrac23R(2)$. Substituting the third into the
      second gives $R(2)=\tfrac67R(1)$, and substituting that into the first
      gives $R(1)=\tfrac{14}{15}$, hence $R(2)=\tfrac{4}{5}$ and
      $R(3)=\tfrac{8}{15}$ — three numbers pulled straight out of
      back-substitution, no closed form needed.
    interview: >
      "Set up the recursion for the ruin probability" wants the conditioning
      move stated in one line and the two boundary values attached
      immediately; a common follow-up is to solve a tiny case like $N=3$ or
      $N=4$ by hand to check you can close the system without quoting a
      formula from memory.
    pitfalls: >
      Swapping which term gets $p$ and which gets $q$ — moving up should
      attach to $R(k+1)$, since $p$ is the probability of an up-step —
      silently inverts the whole recursion. Forgetting that the equations at
      $k=1$ and $k=N-1$ use a known boundary value on the right, not a third
      unknown, leaves the system looking one equation short.
    recap: >
      Conditioning on one round gives $R(k)=p\,R(k+1)+q\,R(k-1)$ and
      $D(k)=1+p\,D(k+1)+q\,D(k-1)$, one equation per interior state, closed
      by the two boundary values.
    dialogue:
      - part: Adding up paths by hand
        teach: >
          You hold $1$ chip, the opponent holds $2$, and you win each round
          with probability $0.4$. One chip changes hands per round until
          someone holds all $3$. You want the probability that you go broke.
      - ask: >
          What is the probability that you are broke within the first $3$
          rounds?
        expects: "0.744"
        tolerance: 0.0005
        hint: >
          List the ways to reach $0$ by round $3$. From $2$, a win ends the
          game at $3$.
        feedback: >
          Lose at once: $0.6$. Or win to $2$, lose back to $1$, lose to $0$:
          $0.4 \times 0.6 \times 0.6 = 0.144$. Total $0.744$. Every further
          path goes around the same loop, win then lose, before it busts.
      - ask: >
          Summing every loop gives
          $0.6\,(1 + 0.24 + 0.24^{2} + \dots)$. Why does that path-by-path
          method not scale to a table of $50$ chips?
        choices:
          - text: >
              It does scale; the series is just longer.
            feedback: >
              On three chips every surviving path returns to the same state
              after a fixed loop. On $50$ chips the walk wanders through $49$
              interior states along paths of every shape, and no single ratio
              organises them.
          - text: >
              The paths can revisit states in endlessly many patterns, so
              there is no single geometric series to sum.
            correct: true
            feedback: >
              Right. The counting is hopeless because the same states are
              reached again and again along different routes. That repetition
              is the waste to remove.
          - text: >
              With $50$ chips the game might never end.
            feedback: >
              Two finite walls make absorption certain, however wide the
              table. The game ends; what overwhelms you is the bookkeeping of
              how it ends.
        feedback: >
          The paths revisit the same few states again and again. If the answer
          from a state is the same every time you arrive there, it should only
          need computing once.

      - part: Restarting after one round
        reflect: >
          After the first round you are at $0$ or at $2$. What do you know
          about your chance of ruin from each of those, and how does that turn
          the original question into equations?
        hint: >
          From $2$, the game has no memory of how you got there.
        answer: >
          From $0$ the ruin probability is $1$. From $2$ it is $R(2)$, the
          same question asked from a different state, because the rounds
          ahead do not care about the past. So $R(1) = 0.4\,R(2) + 0.6 \cdot 1$,
          and the same reasoning at $2$ gives
          $R(2) = 0.4 \cdot 0 + 0.6\,R(1)$: one unknown per interior state,
          one equation each.
      - teach: >
          That is the first-step difference equation. Condition on one round,
          let the problem restart from wherever it lands, and get
          $R(k) = p\,R(k+1) + q\,R(k-1)$ for every interior $k$, with the
          walls supplying $R(0) = 1$ and $R(N) = 0$. Every path of every
          shape is accounted for, because each one starts with some first
          round.
      - ask: >
          Solve the two equations. What is $R(1)$?
        expects: "15/19"
        tolerance: 0.001
        hint: >
          Substitute $R(2) = 0.6\,R(1)$ into the first equation.
        feedback: >
          $R(1) = 0.4 \times 0.6\,R(1) + 0.6$, so $0.76\,R(1) = 0.6$ and
          $R(1) = 15/19 \approx 0.789$. The geometric series gave the same
          $0.6/(1 - 0.24)$; the equations got there without listing a path.
      - ask: >
          And $R(2)$?
        expects: "9/19"
        tolerance: 0.001
        hint: >
          You already have $R(2)$ in terms of $R(1)$.
        feedback: >
          $R(2) = 0.6 \times 15/19 = 9/19 \approx 0.474$. Even holding two of
          the three chips you go broke almost half the time, because the coin
          is against you.
      - ask: >
          A colleague writes the equation as $R(k) = q\,R(k+1) + p\,R(k-1)$.
          What has gone wrong?
        choices:
          - text: >
              Nothing: $p$ and $q$ appear symmetrically.
            feedback: >
              They do not. With $p = 0.4$ the colleague's version solves a
              game in which you win each round with probability $0.6$, and
              reports $R(1) = 0.4/0.76 = 10/19$ instead of $15/19$.
          - text: >
              $p$ is the chance of moving up, so it must multiply the value
              one state up, $R(k+1)$.
            correct: true
            feedback: >
              Each coefficient is the probability of landing where its term
              is evaluated. Read every term as "probability of this move times
              the answer from where it lands".
          - text: >
              The equation should not include the boundary states at all.
            feedback: >
              The boundaries are exactly what pin the solution down. At
              $k = 1$ the term $R(0) = 1$ is a known number, not an unknown.
        feedback: >
          A swapped coefficient is the most common error in the template, and
          it gives a perfectly plausible wrong number. Check by asking whether
          a better coin lowers $R$.

      - part: One equation per state, for anything
        ask: >
          On a table of $50$ chips, how many unknown values of $R$ does the
          first-step method solve for?
        expects: "49"
        hint: >
          Which states are not already known from the walls?
        feedback: >
          The interior states $1, \dots, 49$: $49$ unknowns and $49$
          equations, with $R(0)$ and $R(50)$ known. A linear system of that
          size has closed-form solutions, which the next lessons find.
      - ask: >
          The same template counts rounds. In the three-chip game with
          $p = 0.4$, the expected number of rounds $D$ satisfies
          $D(1) = 1 + 0.4\,D(2)$ and $D(2) = 1 + 0.6\,D(1)$. What is $D(1)$?
        expects: "35/19"
        tolerance: 0.005
        hint: >
          Substitute as before; the leading $1$ is the round you just played.
        feedback: >
          $D(1) = 1 + 0.4\,(1 + 0.6\,D(1)) = 1.4 + 0.24\,D(1)$, so
          $D(1) = 1.4/0.76 = 35/19 \approx 1.84$ rounds. The $+1$ pays for
          the round that was played before the restart; the walls cost
          nothing more, so $D = 0$ there.
      - ask: >
          Now change the game: after each loss you double your next stake,
          and after a win you return to one chip. Can you still write one
          first-step equation per value of your fortune?
        choices:
          - text: >
              Yes: the fortune still moves up or down each round.
            feedback: >
              The fortune moves, but by an amount that depends on the past. Two
              visits to $5$ chips, one after a win and one after two losses,
              face different next rounds, so "the answer from $5$" is not one
              number.
          - text: >
              No: the next round now depends on history, so the state must
              also record the current stake.
            correct: true
            feedback: >
              The method survives once the state does: track the pair
              (fortune, stake) and write one equation per pair. The template
              needs a state that makes the future independent of the past.
          - text: >
              No: doubling stakes makes the game never end.
            feedback: >
              The game still ends at the walls. The obstacle is in writing the
              equation, not in whether play stops.
        feedback: >
          The first-step equation works whenever the future depends only on
          the current state. Choose the state so that it does, write one
          equation per interior state, and let the walls fix the constants.
          In an interview, say the conditioning sentence out loud before
          writing anything: "from $k$, one round moves me to $k+1$ with
          probability $p$ or $k-1$ with probability $q$, and the problem
          restarts."

  - node: quant-processes.ruin.fair
    hook: >
      This is the single most quoted number in the whole subbranch — "your
      odds are your share of the pot" — and it earns that status because the
      derivation is three lines long and the interpretation is immediate.
    explanation: >
      Setting $p=q=1/2$ in the first-step equation and rearranging gives
      $R(k+1)-2R(k)+R(k-1)=0$ — the second difference of $R$ vanishes at
      every interior state. A sequence with zero second difference is exactly
      a sequence that increases by the same amount at every step, the
      discrete analogue of a function with zero second derivative: it's a
      straight line, $R(k)=A+Bk$.

      Only two numbers are needed to pin down a line, and the boundary values
      supply exactly two conditions: $R(0)=1$ gives $A=1$, and $R(N)=0$ gives
      $B=-1/N$. That fixes $R(k)=1-k/N$ for every interior $k$ at once, with
      no case-by-case solving — the whole family of $N-1$ equations collapses
      to one formula because the second-difference-zero structure forces
      linearity, not because of anything specific to gambler's ruin.

      Reading $W(k)=k/N$ as a share of the combined pot $N$ is the fast way
      to hold the formula: in a fair game your odds of winning everything
      equal the fraction of the total money you personally brought to the
      table, no more and no less. That interpretation is exact, not an
      approximation, and it's the one number in this unit worth having
      completely automatic.
    worked: >
      With $k=15$ against a combined pot of $N=50$, $W(15)=15/50=0.3$ and
      $R(15)=1-0.3=0.7$: a $30\%$ chance of taking the whole $50$, a $70\%$
      chance of going broke, purely from bringing $15$ of the $50$ to a fair
      game.
    interview: >
      "If I have $k$ dollars and you have $N-k$ and we flip a fair coin for
      $1$ a round until one of us is broke, what's my probability of winning
      it all" is asked directly enough that the instant answer $k/N$ should
      come out before any equation is written, with the derivation offered
      only if asked.
    pitfalls: >
      This formula is exact only at $p=1/2$ — using it when the coin is even
      slightly biased gives a wrong answer, not an approximately right one.
      Reporting $k/N$ for the ruin probability instead of the success
      probability swaps the two outcomes; $R(k)=1-k/N$ is the chance of going
      broke, $W(k)=k/N$ is the chance of winning.
    recap: >
      With a fair coin, $R(k)=1-k/N$ and $W(k)=k/N$ — the second difference
      of $R$ vanishes, forcing a straight line pinned by the two boundary
      values.
    dialogue:
      - part: Four chips on a fair coin
        teach: >
          A fair coin, one chip changing hands per round, $4$ chips on the
          table in all. Play stops when one side holds all $4$. You will work
          out your ruin probability from every starting stack.
      - ask: >
          You start with $2$ of the $4$. What is the probability that you go
          broke?
        expects: "1/2"
        hint: >
          Compare your position with your opponent's.
        feedback: >
          The stacks are equal and the coin is fair, so the game is symmetric
          between the two of you: $R(2) = 1/2$. Absorption is certain, so the
          two outcomes split the whole probability between them.
      - ask: >
          Now you start with $1$. Use one round of first-step analysis and the
          answer you just found. What is $R(1)$?
        expects: "3/4"
        hint: >
          From $1$ you either lose at once or move to $2$.
        feedback: >
          $R(1) = \tfrac{1}{2} \cdot 1 + \tfrac{1}{2} R(2) =
          \tfrac{1}{2} + \tfrac{1}{4} = 3/4$.
      - ask: >
          And from $3$, what is $R(3)$?
        expects: "1/4"
        hint: >
          From $3$ you either win at once or drop to $2$.
        feedback: >
          $R(3) = \tfrac{1}{2} \cdot 0 + \tfrac{1}{2} R(2) = 1/4$. The full
          list from $0$ to $4$ is $1, 3/4, 1/2, 1/4, 0$.

      - part: Why the values fall on a line
        reflect: >
          The values $1, 3/4, 1/2, 1/4, 0$ drop by exactly $1/4$ each step.
          Read $R(k) = \tfrac{1}{2}R(k+1) + \tfrac{1}{2}R(k-1)$ as a statement
          about three neighbouring points, and say why the drops must all be
          equal for any $N$.
        hint: >
          What does it mean for a value to be the average of its two
          neighbours?
        answer: >
          Each interior value is the average of its neighbours, so it sits
          exactly halfway between them: $R(k+1) - R(k) = R(k) - R(k-1)$. The
          step from each state to the next is the same all the way across, so
          $R$ is a straight line, and the line through $R(0) = 1$ and
          $R(N) = 0$ drops by $1/N$ per chip.
      - teach: >
          That is the fair gambler's ruin theorem. A zero second difference
          makes $R$ affine, $R(k) = A + Bk$; the wall at $0$ forces $A = 1$
          and the wall at $N$ forces $B = -1/N$, so $R(k) = 1 - k/N$ and
          $W(k) = k/N$. You take the whole pot with probability equal to the
          share of it you brought.
      - ask: >
          The step from "$R(k) = 1 - k/N$" to "$W(k) = k/N$" uses one fact
          beyond the equation. Which?
        choices:
          - text: >
              That the coin is fair.
            feedback: >
              Fairness was already used to get the straight line for $R$. The
              step to $W$ needs something about how the game ends.
          - text: >
              That absorption is certain, so $R(k) + W(k) = 1$.
            correct: true
            feedback: >
              Without it, $W$ could be smaller than $1 - R$, with the rest
              lost to games that never end. The proof that the game ends with
              probability one is what rules that out.
          - text: >
              That the two stacks are equal.
            feedback: >
              Symmetry gave the single value $R(2) = 1/2$ on four chips. The
              theorem holds for every split; equal stacks are just the case
              where $k/N = 1/2$.
        feedback: >
          Certain absorption is also what makes the bounded solution of the
          first-step equations the right one. Equivalently, $W$ solves the same
          equation with the walls' values swapped, $W(0) = 0$ and $W(N) = 1$,
          and its line is $k/N$.

      - part: Any table, at a glance
        ask: >
          You sit down with $14$ chips against an opponent holding $21$, fair
          coin. What is the probability that you go broke?
        expects: "3/5"
        hint: >
          Your ruin probability is the opponent's share of the pot.
        feedback: >
          $N = 35$, so $R(14) = 1 - 14/35 = 21/35 = 3/5$. Your ruin
          probability is the opponent's share, just as your success
          probability is yours.
      - ask: >
          Before the first round the opponent tops up by $7$ chips. What is
          your probability of taking the whole pot now?
        expects: "1/3"
        hint: >
          Your stack is unchanged; the pot is not.
        feedback: >
          $N = 42$, so $W(14) = 14/42 = 1/3$, down from $14/35 = 2/5$. Only the
          ratio of the stacks moves the answer.
      - ask: >
          Now the coin is slightly unfair, $p = 0.49$. Is $R$ still a
          straight line in $k$?
        choices:
          - text: >
              Approximately: the coin is within one percent of fair, so the
              line is off by about one percent.
            feedback: >
              Rearrange the first-step equation as
              $p\,(R(k+1) - R(k)) = q\,(R(k) - R(k-1))$. Each drop is $q/p =
              51/49$ times the last, and over $100$ steps that factor compounds
              to about $(51/49)^{100} \approx 55$. The error is not one
              percent; the shape is different.
          - text: >
              No: the drops now grow by a factor $q/p$ each step, so $R$
              curves.
            correct: true
            feedback: >
              The straight line is special to $p = 1/2$, where the factor is
              exactly $1$. Any edge bends it, and the bend compounds.
          - text: >
              Yes: the walls still force $R(0) = 1$ and $R(N) = 0$.
            feedback: >
              The walls pin the endpoints of any solution, but they do not
              decide its shape between them. The shape comes from the
              equation, and the equation now has unequal weights.
        feedback: >
          $1 - k/N$ is exact at $p = 1/2$ and wrong, not approximate, anywhere
          else; a biased coin needs its own formula. In an interview, the fair
          answer is one sentence: "it is a fair game, so the probability I
          take the pot is my share of it, $k/N$."

  - node: quant-processes.ruin.expectation-check
    hook: >
      This is the fastest possible way to arrive at the fair-game answer, and
      its extension to a biased game hands you a second equation linking two
      quantities you'd otherwise have to solve for separately.
    explanation: >
      Because absorption is certain and the expected duration is finite, the
      expected fortune at the moment play stops is a well-defined number, and
      in a fair game it must equal the starting fortune $k$ — no round of a
      fair coin changes the average, so no sequence of them can either. That
      single fact does the whole job of the earlier derivation without
      touching the recursion at all.

      The stopping fortune only ever takes two values, $0$ (ruin) or $N$
      (target), so its expectation is $0\cdot R(k)+N\cdot W(k)$. Setting that
      equal to $k$ gives $N\,W(k)=k$, hence $W(k)=k/N$ — the fair-game formula
      in one line, as a consistency check rather than a derivation from the
      recursion.

      With an edge the same bookkeeping still works, but the expected fortune
      is no longer conserved: each round shifts it by $p-q$ on average, so
      over an expected $D(k)$ rounds the total expected movement is
      $(p-q)D(k)$. Equating that to the actual expected change,
      $N\,W(k)-k$, gives $N\,W(k)-k=(p-q)D(k)$ — one equation relating $W(k)$
      and $D(k)$ that holds regardless of which one you've already solved
      for, so either quantity hands you the other for free.
    worked: >
      For a fair game with $k=6$ and $N=20$: conservation of expectation
      gives $0\cdot R(6)+20\cdot W(6)=6$ directly, so $W(6)=6/20=0.3$ — the
      answer falls out without ever writing the second-difference equation.
    interview: >
      "Can you get $W(k)=k/N$ without solving the recursion" is checking for
      exactly this move — stating that expected fortune is conserved in a
      fair game and reading off the answer in one line is the expected
      response.
    pitfalls: >
      Applying "expected fortune is conserved" to a biased game without the
      drift correction term gives the fair-game answer for a game that isn't
      fair. This bookkeeping is only valid because absorption is certain and
      the expected duration is finite — invoking it for a process where the
      stopping time might not have finite expectation would be circular.
    recap: >
      Expected fortune in equals expected fortune out: instantly $W(k)=k/N$
      when fair, and $N\,W(k)-k=(p-q)D(k)$ links ruin probability to expected
      duration whenever there's an edge.
    dialogue:
      - part: Twelve against eighteen
        teach: >
          A fair coin, one chip a round. You hold $12$, the opponent holds
          $18$, and play stops when one side has all $30$. A colleague says
          she can give your chance of taking the pot without writing a single
          equation.
      - ask: >
          What is your expected stack after the first round?
        expects: "12"
        hint: >
          The round adds $+1$ or $-1$ with equal probability.
        feedback: >
          $\tfrac{1}{2}(13) + \tfrac{1}{2}(11) = 12$. A fair round changes
          nothing on average.
      - ask: >
          Some games may be over within $10$ rounds; once over, your stack is
          frozen at $0$ or $30$. What is your expected stack after $10$
          rounds?
        choices:
          - text: >
              Less than $12$, because some of those games have already busted
              you.
            feedback: >
              Some have also already handed you $30$. Each round that is
              played adds $0$ on average and each frozen round adds exactly
              $0$, so the busts and the wins balance.
          - text: >
              It cannot be found without first knowing $W(12)$.
            feedback: >
              No formula is needed: round by round, the expected change is $0$
              whether the game is running or over. That holds at round $10$
              and at round $10\,000$.
          - text: >
              Exactly $12$.
            correct: true
            feedback: >
              Each round, running or frozen, has expected change $0$, so after
              any fixed number of rounds the expected stack is still $12$.
        feedback: >
          The expected stack never moves, at any fixed round. That is the
          colleague's whole trick, once you push it to the end of the game.
      - reflect: >
          When the game is over your stack is either $0$ or $30$. Use what you
          just found to get $W(12)$, and say what you had to assume about the
          end of the game.
        hint: >
          Write the expected final stack two ways.
        answer: >
          The expected final stack is $0 \cdot R + 30 \cdot W$, and it must
          equal the starting $12$, so $W = 12/30 = 2/5$. That needs the game
          to end with probability one, so that "the final stack" exists and is
          either $0$ or $30$, and the stack to stay between $0$ and $30$ along
          the way, so that the average at a late round really converges to the
          average at the end.
      - teach: >
          That is pinning the answer by conservation of expectation: expected
          wealth in equals expected wealth out, $0 \cdot R(k) + N \cdot W(k) = k$,
          so $W(k) = k/N$ at sight. It is a check rather than a derivation, and
          it is licensed by two facts you already have: absorption is certain
          and the stack is trapped between the walls.

      - part: Draws change nothing, an edge does
        ask: >
          Same stacks, but now each round you win a chip with probability
          $0.3$, lose one with probability $0.3$, and draw with probability
          $0.4$. What is your probability of taking the pot?
        expects: "2/5"
        hint: >
          What is the expected change per round?
        feedback: >
          Still $0.3 - 0.3 = 0$ per round, so still $30\,W = 12$ and
          $W = 2/5$. The draws stretch the game out but cannot move the
          answer; the bookkeeping saw that without a new equation.
      - ask: >
          Now a different game: you win each round with probability $0.6$,
          start with $1$ chip, and play to $0$ or $3$. A colleague writes
          $3\,W(1) = 1$ and reports $W(1) = 1/3$. What is wrong?
        choices:
          - text: >
              Nothing; conservation of expectation holds in every game that
              ends.
            feedback: >
              It holds when each round's expected change is $0$. Here each
              round adds $0.6 - 0.4 = 0.2$ on average, so the expected stack
              climbs while the game runs. First-step analysis gives
              $W(1) = 9/19$, not $1/3$.
          - text: >
              The expected stack drifts up by $p - q$ every round played, so it
              is not conserved.
            correct: true
            feedback: >
              Right. The accounting still works, but with a drift term: the
              expected final stack is the start plus $0.2$ for every round
              played.
          - text: >
              With a biased coin the game might not end.
            feedback: >
              Two walls a finite distance apart end the game with probability
              one for any $0 < p < 1$. The problem is the expected fortune, not
              the ending.
        feedback: >
          Fixing the bookkeeping: over an expected $D(k)$ rounds the fortune
          moves by $(p - q)\,D(k)$ on average, so $N\,W(k) - k = (p - q)\,D(k)$.
      - ask: >
          In that game, what is the expected change in your stack per round
          while play continues?
        expects: "0.2"
        hint: >
          $p \cdot (+1) + q \cdot (-1)$.
        feedback: >
          $0.6 - 0.4 = 0.2$ chips per round, and $0$ once the game is over.
      - ask: >
          First-step analysis gives $W(1) = 9/19$. Use the drift identity to
          find the expected number of rounds $D(1)$.
        expects: "40/19"
        tolerance: 0.005
        hint: >
          $3\,W(1) - 1 = 0.2\,D(1)$.
        feedback: >
          $3 \times 9/19 - 1 = 8/19$, and $(8/19)/0.2 = 40/19 \approx 2.11$
          rounds. Check by first steps: $D(1) = 1 + 0.6\,D(2)$ and
          $D(2) = 1 + 0.4\,D(1)$ give $D(1) = 1.6/0.76 = 40/19$. One of $W$ and
          $D$ hands you the other.

      - part: One wall is not enough
        ask: >
          A fair walk starts at $5$ and is stopped only at $0$; there is no
          upper wall. If it ever stops, it stops at $0$, so the "expected
          final stack" would be $0$, not $5$. What broke?
        choices:
          - text: >
              The expected stack after a fixed number of rounds is no longer
              $5$.
            feedback: >
              It still is: every round, running or frozen at $0$, adds $0$ on
              average. The failure is in passing from fixed rounds to the end
              of the game.
          - text: >
              The licence: with no upper wall the stack is not trapped, and
              nothing so far shows the game ends or ends quickly enough.
            correct: true
            feedback: >
              The identity needs a game that ends with probability one and a
              stack that stays bounded, which two finite walls supply. Remove
              one and the average can leak away to rare paths that climb very
              high before ever returning.
          - text: >
              The coin is no longer fair once a wall is removed.
            feedback: >
              The coin is the same coin. What the wall did was bound the stack
              and guarantee an ending; the bookkeeping depends on both.
        feedback: >
          Conservation of expectation is accounting that holds once the game
          is trapped between two walls. In an interview, use it to produce
          $k/N$ in one breath, then name the two facts that license it, and
          when the coin has an edge, add the drift term.

  - node: quant-processes.ruin.fair-example
    hook: >
      This is the number that convinces people a fair game can still feel
      brutally unfair, and untangling why is a favorite interview follow-up
      in itself.
    explanation: >
      A $90\%$ chance of busting looks, at first glance, exactly like what a
      house edge would produce — but nothing about $p$ moved here; $p$ is
      still exactly $1/2$. The entire asymmetry comes from bringing a stack
      that's a small share of the combined pot, which is precisely what the
      pot-share reading of $W(k)=k/N$ predicts and nothing more.

      The zero-expectation check confirms there's no hidden edge: your
      expected profit is $R(k)\cdot(-k)+W(k)\cdot(N-k)$, and with $k=10$,
      $N=100$ that's $0.9\times(-10)+0.1\times90=-9+9=0$ exactly. A biased
      game would not zero out like this — any nonzero house edge shows up as
      a nonzero expected loss even after accounting correctly for how rarely
      you win.

      The practical reading is that the only two levers on $W(k)$ in a fair
      game are the two stack sizes, not the odds of any single round — you
      can shift your win probability by bringing more capital to the table or
      by finding a smaller opponent to sit against, and no amount of skillful
      play at $p=1/2$ changes it otherwise.
    worked: >
      With $k=25$ against $N=100$, $W(25)=25/100=0.25$ and $R(25)=0.75$: a
      one-in-four shot at the whole pot, three-in-four odds of going broke.
      The zero-expectation check still holds:
      $0.75\times(-25)+0.25\times75=-18.75+18.75=0$, confirming the game is
      exactly fair despite the lopsided win probability.
    interview: >
      "You have $X$ against a bank of $Y$, fair coin — is this a fair game?"
      is a values-versus-vocabulary trap: the honest answer is yes, it's fair
      by definition of $p=1/2$, and the low win probability is a statement
      about bankroll size, not about fairness.
    pitfalls: >
      Reading a lopsided $W(k)$ as evidence of a house edge confuses two
      separate quantities — win probability and fairness are not the same
      thing. Assuming the short stack's disadvantage can be offset by any
      in-round strategy misses that $p=1/2$ per round is the entire
      mechanism; nothing about how you play changes it.
    recap: >
      Bringing $10$ of a $100$ pot to a fair coin gives a $90\%$ bust rate
      with exactly zero expected profit — the asymmetry is bankroll, never
      the coin.
    dialogue:
      - part: Thirty against a hundred and twenty
        teach: >
          You walk into a game with $30$ chips. The house puts up $120$. Each
          round is a fair coin for one chip, and you leave only when you are
          broke or have taken all $150$.
      - ask: >
          What is the probability that you take the whole pot?
        expects: "1/5"
        hint: >
          The coin is fair, so only shares matter.
        feedback: >
          $W(30) = 30/150 = 1/5$. You go broke the other $4/5$ of the time.
      - ask: >
          What is your expected profit from the visit, in chips?
        expects: "0"
        hint: >
          You win $120$ or lose $30$.
        feedback: >
          $\tfrac{1}{5}(120) - \tfrac{4}{5}(30) = 24 - 24 = 0$. Rare large
          wins exactly pay for frequent small losses.
      - ask: >
          You go broke four visits in five. A friend concludes the house must
          have an edge somewhere. Who is right?
        choices:
          - text: >
              The friend: losing $80\%$ of the time cannot be a fair game.
            feedback: >
              Fair means zero expected profit, not even chances of winning.
              The expected profit is exactly $0$, as you just computed, with
              an $80\%$ chance of losing.
          - text: >
              Neither: the game is fair, but the coin must be slightly biased
              towards the house.
            feedback: >
              The coin is exactly fair by construction, and $W = 1/5$ came from
              that alone. Nothing else is hiding in the game.
          - text: >
              You: there is no edge; the lopsided result comes from the
              lopsided stacks.
            correct: true
            feedback: >
              The win probability tracks the share of the pot, and the
              payoff tracks the opponent's share, so the two cancel in
              expectation.
        feedback: >
          Win probability and fairness are different numbers. The first is
          about how often, the second about how much.

      - part: The only two levers
        reflect: >
          If no edge is costing you, what is? And which two things, and only
          two, could you change to raise your $1/5$?
        hint: >
          Look at what $W = k/N$ depends on.
        answer: >
          Bankroll asymmetry: you brought a fifth of the pot, so you take it a
          fifth of the time. Since $W = k/N$ depends only on your stack and
          the total, the levers are to bring more chips, or to aim lower by
          walking away at a smaller target, which shrinks $N$. Nothing about
          how you play a fair coin round by round changes $p = 1/2$.
      - ask: >
          Aim lower: you keep your $30$ but walk away as soon as you are up
          $30$, at $60$ chips. What is your probability of leaving a winner?
        expects: "1/2"
        hint: >
          Your target now plays the role of $N$.
        feedback: >
          The game is now $0$ against $60$ from $30$, so $W = 30/60 = 1/2$.
          The house's $120$ no longer matters, because you never try to take
          it.
      - ask: >
          Bring more instead: $60$ chips against the house's $120$, playing to
          the finish. What is $W$ now?
        expects: "1/3"
        hint: >
          Recompute the share.
        feedback: >
          $60/180 = 1/3$. Doubling your stack raised your chance from $1/5$ to
          $1/3$, still well short of even, because the house still holds two
          thirds of the pot.
      - ask: >
          Does walking away at $+30$ turn the visit into a profitable one on
          average?
        choices:
          - text: >
              Yes: you now leave a winner half the time instead of a fifth.
            feedback: >
              Half the time you win $30$ and half the time you lose $30$:
              $0.5(30) - 0.5(30) = 0$. You raised the win probability by
              cutting the size of the win.
          - text: >
              No: the expected profit is still exactly $0$.
            correct: true
            feedback: >
              A stopping rule rearranges the outcomes but cannot create
              expected value in a fair game. "Quit while ahead" trades a rare
              big win for a common small one.
          - text: >
              No: quitting early forfeits the $120$, so the visit now loses on
              average.
            feedback: >
              You also stop risking a long losing run. The expected profit is
              $\tfrac{1}{2}(30) - \tfrac{1}{2}(30) = 0$, the same as before.
        feedback: >
          Every target and every stack gives expected profit $0$ in a fair
          game; only the shape of the outcome changes.

      - part: Pooling against taking turns
        ask: >
          You and a friend each bring $30$. First you play the house's $120$
          to the finish; if you go broke, the house now holds $150$ and your
          friend plays it with her $30$. What is the probability that one of
          you breaks the house?
        expects: "1/3"
        hint: >
          You win with probability $30/150$. If you lose, the friend faces a
          pot of $180$.
        feedback: >
          $\tfrac{1}{5} + \tfrac{4}{5} \cdot \tfrac{30}{180} =
          \tfrac{1}{5} + \tfrac{2}{15} = \tfrac{1}{3}$, exactly what pooling
          $60$ against $120$ gave. In a fair game only the money each side
          brings matters, not the order in which it is played.
      - teach: >
          Said aloud in an interview: "it is a fair coin, so I take the pot
          with probability equal to my share, $30/150$, and my expected profit
          is zero; the $80\%$ ruin is bankroll, not edge. To improve it I can
          only bring more or aim lower."

  - node: quant-processes.ruin.biased
    hook: >
      This is the formula that actually shows up cold in interviews —
      everyone remembers "$k/N$" for the fair case, and the differentiator is
      whether you can rebuild $(q/p)^{k}$ from the recursion under time
      pressure.
    explanation: >
      Rearranging the first-step equation as $p\,R(k+1)-R(k)+q\,R(k-1)=0$
      puts it in exactly the constant-coefficient form the characteristic-root
      method expects, with characteristic polynomial $px^{2}-x+q$. Its two
      roots are $x=1$ (check: $p-1+q=0$ always) and $x=r=q/p$, and they're
      distinct precisely when $p\ne q$ — the same condition that made the
      fair case degenerate, since at $p=q$ these two roots collide at $1$ and
      the general solution needs the different, linear-in-$k$ form derived
      separately.

      With two distinct roots, every solution of the recursion is a
      combination $R(k)=A+Br^{k}$ — the constant root $1$ contributes the
      flat term $A$, and $r$ contributes a genuine geometric term, in
      contrast to the fair case where both pieces of the solution were
      polynomial in $k$.

      Fitting $R(0)=1$ and $R(N)=0$ solves for $A$ and $B$ and gives
      $R(k)=(r^{k}-r^{N})/(1-r^{N})$, hence $W(k)=(1-r^{k})/(1-r^{N})$. The
      fair formula isn't a separate fact to memorize alongside this one —
      taking $r\to1$ in this expression recovers $1-k/N$, exactly as it must,
      since near $r=1$ the ratio $(1-r^{m})/(1-r^{N})$ tends to $m/N$.
    worked: >
      Take $k=3$, $N=8$, $p=0.6$ (so $q=0.4$, $r=q/p=2/3$). Then
      $r^{3}=8/27\approx0.296$ and $r^{8}\approx0.039$, giving
      $R(3)=(0.296-0.039)/(1-0.039)\approx0.268$ and $W(3)\approx0.732$ — a
      clear edge over the fair-coin baseline of $R(3)=5/8=0.625$.
    interview: >
      "Derive the ruin probability when the coin isn't fair" wants the
      characteristic-equation route named explicitly — root $1$ always
      present, root $q/p$ from the quadratic — not a formula recited from
      memory with no path back to it if forgotten.
    pitfalls: >
      Writing $R(k)=Br^{k}$ alone, without the constant term $A$, drops half
      the general solution and can't satisfy both boundary conditions at
      once. Applying this formula at $p=q$ divides by $1-r^{N}=0$; that case
      needs the separate fair-game solution, not a limit taken carelessly
      inside this formula.
    recap: >
      For $p\ne q$, the characteristic roots $1$ and $r=q/p$ give
      $R(k)=(r^{k}-r^{N})/(1-r^{N})$, collapsing to the fair formula as
      $r\to1$.
    dialogue:
      - part: Three chips and a good coin
        teach: >
          You win each round with probability $3/4$. You hold $1$ chip, the
          opponent holds $2$, and one chip changes hands per round until
          someone has all $3$.
      - ask: >
          Write the first-step equations for $R(1)$ and $R(2)$ and solve. What
          is $R(1)$?
        expects: "4/13"
        hint: >
          $R(1) = \tfrac{3}{4}R(2) + \tfrac{1}{4}$ and
          $R(2) = \tfrac{1}{4}R(1)$.
        feedback: >
          Substituting, $R(1) = \tfrac{3}{16}R(1) + \tfrac{1}{4}$, so
          $\tfrac{13}{16}R(1) = \tfrac{1}{4}$ and $R(1) = 4/13$.
      - ask: >
          And $R(2)$?
        expects: "1/13"
        hint: >
          One of the two equations gives it directly.
        feedback: >
          $R(2) = \tfrac{1}{4} \cdot \tfrac{4}{13} = 1/13$. The fair coin
          would have given $1/3$ here; the edge cuts it by more than four
          times.
      - ask: >
          List $R(0), R(1), R(2), R(3) = 1, 4/13, 1/13, 0$. The drops between
          neighbours are $9/13$, $3/13$, $1/13$. What is the ratio of each
          drop to the one before?
        expects: "1/3"
        hint: >
          Divide $3/13$ by $9/13$.
        feedback: >
          Each drop is $1/3$ of the one before. Not a straight line, as in the
          fair game, but a geometric progression of drops. Note that
          $1/3 = q/p = (1/4)/(3/4)$.

      - part: Where the ratio comes from
        reflect: >
          Explain why each drop must be $q/p$ times the previous one, for any
          $p$ and any $N$. Start from $R(k) = p\,R(k+1) + q\,R(k-1)$.
        hint: >
          Write the left side as $p\,R(k) + q\,R(k)$.
        answer: >
          Since $p + q = 1$, the equation reads
          $p\,R(k) + q\,R(k) = p\,R(k+1) + q\,R(k-1)$, which rearranges to
          $p\,(R(k) - R(k+1)) = q\,(R(k-1) - R(k))$. So each drop is $q/p$
          times the one before: the weights on the two sides of every state
          set the ratio of the drops around it.
      - teach: >
          Write $r = q/p$. The drops form a geometric progression with ratio
          $r$, and summing a geometric progression gives
          $R(k) = A + B\,r^{k}$ for constants $A$ and $B$. The same family
          comes straight from the theory of linear recurrences: the
          characteristic polynomial $p\,x^{2} - x + q$ has roots $1$ and $r$.
          Two constants, two walls.
      - ask: >
          Impose $R(0) = 1$ and $R(N) = 0$ on $A + B\,r^{k}$. Which formula
          results?
        choices:
          - text: >
              $R(k) = r^{k}$
            feedback: >
              This takes $A = 0$, which satisfies $R(0) = 1$ but gives
              $R(N) = r^{N} \ne 0$. Dropping the constant term throws away half
              the solution, and the far wall is no longer respected.
          - text: >
              $R(k) = \dfrac{r^{k} - r^{N}}{1 - r^{N}}$
            correct: true
            feedback: >
              At $k = 0$ it gives $1$ and at $k = N$ it gives $0$. Solving
              $A + B = 1$ and $A + B\,r^{N} = 0$ gives
              $B = 1/(1 - r^{N})$ and $A = -r^{N}/(1 - r^{N})$.
          - text: >
              $R(k) = \dfrac{1 - r^{k}}{1 - r^{N}}$
            feedback: >
              This is $0$ at $k = 0$ and $1$ at $k = N$: it has the walls'
              values swapped, so it is $W(k)$, the chance of reaching the
              target.
        feedback: >
          That is the biased gambler's ruin formula:
          $R(k) = (r^{k} - r^{N})/(1 - r^{N})$ and
          $W(k) = (1 - r^{k})/(1 - r^{N})$, with $r = q/p$. Check it on the
          three-chip game: $r = 1/3$ gives
          $R(1) = (1/3 - 1/27)/(1 - 1/27) = 4/13$.
      - ask: >
          Where does the derivation use $p \ne q$?
        choices:
          - text: >
              In the first-step equation itself.
            feedback: >
              The first-step equation holds for every $p$, fair or not. The
              assumption enters later, when you choose the form of the
              solution.
          - text: >
              In needing the roots $1$ and $r$ to be distinct, so that $1$ and
              $r^{k}$ are two different solutions and $1 - r^{N} \ne 0$.
            correct: true
            feedback: >
              At $p = q$ the two roots merge at $1$, the family $A + B\,r^{k}$
              collapses to constants, and the formula reads $0/0$.
          - text: >
              In the boundary values $R(0) = 1$ and $R(N) = 0$.
            feedback: >
              The walls give those values for any coin. They are read off the
              definition, not derived from the bias.
        feedback: >
          A repeated root needs a second solution of a different shape, which
          is why the fair game is a straight line instead.

      - part: A bad coin, by the formula
        ask: >
          Now you win each round with probability only $1/3$. You hold $2$,
          the opponent holds $3$. What is your ruin probability, as an exact
          fraction?
        expects: "28/31"
        hint: >
          $r = q/p = 2$, $k = 2$, $N = 5$.
        feedback: >
          $R(2) = (2^{2} - 2^{5})/(1 - 2^{5}) = (4 - 32)/(1 - 32) =
          28/31 \approx 0.903$. The fair coin would give $3/5$.
      - ask: >
          A colleague sets $p = 1/2$ in the biased formula and gets $0/0$. What
          is the right conclusion?
        choices:
          - text: >
              The formula is wrong.
            feedback: >
              It is right for every $p \ne 1/2$; the point $p = 1/2$ is
              excluded because its two roots coincide.
          - text: >
              The fair game has no ruin probability.
            feedback: >
              It has one, $1 - k/N$, from its own straight-line solution.
          - text: >
              The fair case needs its own solution, and the biased formula
              tends to it as $r \to 1$.
            correct: true
            feedback: >
              Divide top and bottom by $1 - r$: the ratio tends to $(N - k)/N$,
              which is $1 - k/N$. The two formulas join continuously.
        feedback: >
          In an interview, say "$r = q/p$, ruin is
          $(r^{k} - r^{N})/(1 - r^{N})$", then check one wall out loud before
          plugging in numbers; a swapped $p$ and $q$ is caught at once.

  - node: quant-processes.ruin.edge-sensitivity
    hook: >
      The interviewer's real question behind "why does even a $1\%$ edge
      matter so much" is whether you understand that ruin probability is
      exponentially, not linearly, sensitive to $p$ — this node is the
      mechanism, not just the arithmetic.
    explanation: >
      Write $p=1/2+\varepsilon$ for a small edge $\varepsilon$. Then
      $r=q/p=(1/2-\varepsilon)/(1/2+\varepsilon)\approx1-4\varepsilon$ for
      small $\varepsilon$, so $r^{m}\approx e^{-4\varepsilon m}$ — a linear
      nudge to $p$ becomes an exponential factor in $r$ raised to a power.
      Both $r^{k}$ and $r^{N}$ inherit that exponential sensitivity, and
      since $N$ is typically much larger than $k$, the term $r^{N}$ swings by
      far the most for a fixed change in $\varepsilon$.

      That's the entire mechanism behind a one-percentage-point comparison: a
      swing in $p$ that looks tiny in absolute terms gets multiplied by $N$
      inside an exponent, and exponentials amplify small inputs into large
      output changes once the exponent itself is sizable. The same reasoning
      explains why the effect is so much weaker for a small $N$ — with fewer
      rounds needed to reach either barrier, there's less room for the
      exponential to compound.

      The general pattern worth carrying into any bet-sizing question: ruin
      probabilities in this family are never smooth, gently-varying functions
      of the edge — they're exponential in edge times distance, so a fixed
      edge matters enormously more against a deep bankroll than a shallow
      one, and a fixed bankroll depth matters enormously more against a real
      edge than a coin-flip's worth of noise.
    worked: >
      Hold $k=5$, $N=25$ — the same $1$-to-$4$ stake ratio — and drop $p$ to
      $0.47$, a modest three-point disadvantage. Fair play gives
      $W=5/25=0.2$. With $r=53/47\approx1.128$, $r^{5}\approx1.824$ and
      $r^{25}\approx20.2$, so $W=(1-1.824)/(1-20.2)\approx0.043$: the $20\%$
      shot collapses to about $4.3\%$, a better-than-fourfold drop from three
      points of edge alone.
    interview: >
      "Why does a professional care about an edge of a fraction of a
      percent" is answered by naming the exponential mechanism directly — the
      edge sits inside an exponent multiplied by the distance to the
      barrier — not by quoting a specific numeric example without explaining
      why it's so dramatic.
    pitfalls: >
      Treating the sensitivity as roughly linear in $\varepsilon$ — "half the
      edge, half the effect" — is wrong once $\varepsilon N$ isn't small; the
      true dependence is exponential and can move by an order of magnitude
      for a small absolute change in $p$. Forgetting that the same swing
      shrinks dramatically at small $N$ leads to over-generalizing a
      deep-stack result to a shallow one.
    recap: >
      Ruin probability is exponential in edge times distance to the barrier —
      a three-point disadvantage on a $25$-unit pot at $1$-to-$4$ already
      collapses a $20\%$ shot to about $4.3\%$.
    dialogue:
      - part: Twenty against sixty, two points off fair
        teach: >
          You hold $20$ chips against an opponent's $60$, one chip a round,
          play to the finish. On a fair coin you take the pot with probability
          $20/80 = 0.25$. Now the coin is shaded against you: you win each
          round with probability $0.48$.
      - ask: >
          Before computing anything, which is closest to your new probability
          of taking the pot?
        choices:
          - text: >
              About $0.23$: two points off fair costs a couple of points.
            feedback: >
              That is the linear guess, and it is badly wrong. The edge acts on
              every one of the hundreds of rounds the game lasts, and the
              formula carries it in an exponent.
          - text: >
              About $0.15$.
            feedback: >
              Closer in spirit, still far too generous. Compute $r^{80}$ before
              trusting any guess here.
          - text: >
              Under $0.01$.
            correct: true
            feedback: >
              Right, and the next two questions show why: the formula contains
              $r^{80}$, and $r$ only slightly above $1$ raised to the $80$th
              power is in the hundreds.
        feedback: >
          The intuition that a small edge does small damage is the thing this
          example is built to break.
      - ask: >
          Here $r = q/p = 0.52/0.48 = 13/12$. What is $r^{20}$, to two decimal
          places?
        expects: "4.96"
        tolerance: 0.01
        hint: >
          $\ln(13/12) \approx 0.0800$, and $e^{1.6} \approx 4.95$.
        feedback: >
          $(13/12)^{20} \approx 4.957$. Twenty bets at a ratio of $1.083$
          compound to nearly five. And $r^{80} = (r^{20})^{4} \approx 604$.
      - ask: >
          Now compute $W(20) = (1 - r^{20})/(1 - r^{80})$. Give four decimal
          places.
        expects: "0.0066"
        tolerance: 0.0005
        hint: >
          Both numerator and denominator are negative.
        feedback: >
          $W = (1 - 4.957)/(1 - 603.9) = 3.957/602.9 \approx 0.0066$. Your
          $25\%$ shot is now about $0.66\%$, a collapse by a factor of nearly
          $40$ from two points of edge.

      - part: The other side of the coin
        ask: >
          Flip the edge: you win each round with probability $0.52$, so
          $r = 12/13$, $r^{20} \approx 0.2017$ and $r^{80} \approx 0.0017$.
          What is $W(20)$, to two decimal places?
        expects: "0.80"
        tolerance: 0.005
        hint: >
          Same formula; now both $r$-powers are below $1$.
        feedback: >
          $W = (1 - 0.2017)/(1 - 0.0017) \approx 0.7996$. Two points in your
          favour turn a one-in-four shot into four in five. A four-point swing
          in $p$ moves $W$ from under $1\%$ to $80\%$.
      - ask: >
          Halve the disadvantage: $p = 0.49$, same stacks. The formula gives
          $W(20)$ to three decimal places as what?
        expects: "0.052"
        tolerance: 0.001
        hint: >
          $r = 51/49$; $r^{20} \approx 2.226$ and $r^{80} \approx 24.54$.
        feedback: >
          $W = (2.226 - 1)/(24.54 - 1) \approx 0.052$. One point of edge
          already cuts $0.25$ to about a fifth of itself; the second point
          cuts what is left by a factor of eight more. Half the edge is not
          half the damage.

      - part: Why depth is the multiplier
        reflect: >
          Write $p = 1/2 - \varepsilon$. Roughly how big is $r$, and so what
          single combination of $\varepsilon$ and the stacks decides how far
          $W$ falls from $k/N$?
        hint: >
          $(1/2 + \varepsilon)/(1/2 - \varepsilon) \approx 1 + 4\varepsilon$
          for small $\varepsilon$.
        answer: >
          $r \approx 1 + 4\varepsilon$, so $r^{N} \approx e^{4\varepsilon N}$.
          What matters is the edge times the depth of the game in bets,
          $\varepsilon N$. Here $\varepsilon N = 0.02 \times 80 = 1.6$, and
          $e^{6.4} \approx 600$, matching $r^{80} \approx 604$. Small edges
          are harmless only when $\varepsilon N$ is small.
      - ask: >
          Use $r^{N} \approx e^{4\varepsilon N}$ to estimate $r^{80}$ at
          $p = 0.49$, without computing $(51/49)^{80}$. Give one decimal
          place.
        expects: "24.5"
        tolerance: 0.3
        hint: >
          Here $\varepsilon = 0.01$.
        feedback: >
          $4\varepsilon N = 4 \times 0.01 \times 80 = 3.2$ and
          $e^{3.2} \approx 24.5$, against the exact $24.54$. Halving the edge
          halves the exponent, which takes a square root of $r^{N}$:
          $\sqrt{604} \approx 24.6$.
      - ask: >
          Keep the one-to-three ratio but play shallow: $2$ chips against $6$
          at $p = 0.48$. What is $W(2)$, to four decimal places?
        expects: "0.1935"
        tolerance: 0.0005
        hint: >
          $r = 13/12$ again; you need $r^{2}$ and $r^{8}$.
        feedback: >
          $r^{2} \approx 1.1736$ and $r^{8} \approx 1.8971$, so
          $W = 0.1736/0.8971 \approx 0.1935$. The same coin that destroyed
          the deep game barely dents the shallow one, down from $0.25$ to
          $0.19$, because $\varepsilon N = 0.16$.
      - ask: >
          A trader says: "A two-point edge is a two-point edge; the stake ratio
          is the same, so both games are equally hurt." What is the right
          correction?
        choices:
          - text: >
              The edge times the depth of the game in bets is what matters,
              and the deep game is ten times as deep.
            correct: true
            feedback: >
              The deep game puts $80$ chips' worth of distance between the
              walls; every extra round is another application of the edge.
          - text: >
              The stake ratio is all that matters, so the trader is right.
            feedback: >
              The ratio fixes the fair answer, $k/N = 0.25$. Off fair, the
              shallow game gives $0.19$ and the deep one $0.0066$ at the same
              ratio.
          - text: >
              The edge matters only in the shallow game, where each round is a
              bigger fraction of the stacks.
            feedback: >
              Backwards. Each round is a bigger fraction in the shallow game,
              but there are far fewer rounds for the edge to compound over.
        feedback: >
          Ruin probabilities are exponential in edge times depth. In an
          interview the line is: "two points of edge across eighty bets of
          depth is an exponent of about six; the fair one-in-four becomes
          well under one percent."

  - node: quant-processes.ruin.doubling-your-money
    hook: >
      "Double or bust" is asked often enough as its own question that the
      collapsed formula $1/(1+r^{k})$ is worth having memorized on its own,
      separate from the general two-barrier result it specializes.
    explanation: >
      Setting $N=2k$ in the biased formula and factoring the difference of
      squares $1-r^{2k}=(1-r^{k})(1+r^{k})$ cancels a common factor from
      numerator and denominator, collapsing $W(k)=(1-r^{k})/(1-r^{2k})$ down
      to the much simpler $W=1/(1+r^{k})$. At $r=1$ (the fair case) this
      reduces to $1/2$ immediately, consistent with the general formula's
      $k/N=k/(2k)=1/2$.

      The only quantity that matters now is $r^{k}$, the odds ratio raised to
      the power of your stack measured in bets — everything about $N$ has
      disappeared because it was always exactly twice $k$. That makes this
      the version of the formula worth reaching for the instant a question is
      phrased as "double your money" rather than "reach some target $N$".

      The dependence on $k$ is geometric, not linear, which is the sting:
      with $r>1$ (playing against an edge), doubling a deeper stack is
      dramatically harder, not easier, because $r^{k}$ grows exponentially
      with $k$ even while the fair-game intuition ("bigger bankroll, same
      $50\%$") would suggest no change at all. Playing a slightly unfavorable
      game longer, with a bigger stack riding on it, does not average out
      toward the fair result — it moves further from it.
    worked: >
      At $p=0.52$ — a modest edge in your favor — $r=0.48/0.52=12/13\approx
      0.923$. Doubling a $k=20$-unit stack succeeds with probability
      $W=1/(1+0.923^{20})\approx1/(1+0.202)\approx0.832$: an $83.2\%$ chance,
      well above the $50\%$ fair baseline, because a favorable edge compounds
      the same way an unfavorable one collapses it.
    interview: >
      "What's the probability of doubling your money at this game" is the
      cue to reach for $1/(1+r^{k})$ directly rather than rebuilding the
      general $N=2k$ case from scratch — interviewers listen for recognizing
      the specialization immediately.
    pitfalls: >
      This collapsed formula only holds for a target of exactly double the
      starting stack; using it when the actual target isn't $2k$ silently
      answers the wrong question. Forgetting that the exponent is $k$, not
      $N$, is an easy slip once the general two-barrier formula is only
      half-remembered.
    recap: >
      Doubling a stack of $k$ succeeds with probability $1/(1+r^{k})$,
      $r=q/p$ — a coin flip when fair, and exponentially better or worse than
      that in $k$ once there's any edge.
    dialogue:
      - part: Four chips, quit at eight
        teach: >
          You have $4$ chips and a plan: bet one chip a round until you have
          doubled to $8$ or gone broke. Each round you win with probability
          $0.4$.
      - ask: >
          Using the biased formula with $r = 1.5$, what is your probability of
          reaching $8$? Give an exact fraction.
        expects: "16/97"
        tolerance: 0.0005
        hint: >
          $r^{4} = 81/16$ and $r^{8} = 6561/256$.
        feedback: >
          $W = (1 - 81/16)/(1 - 6561/256) = (65/16)/(6305/256) = 16/97
          \approx 0.165$. Notice the final shape:
          $16/97 = 1/(1 + 81/16) = 1/(1 + r^{4})$.

      - part: Why doubling simplifies
        reflect: >
          The answer collapsed to $1/(1 + r^{4})$. Explain why
          $(1 - r^{k})/(1 - r^{2k})$ always collapses like that when the
          target is exactly twice the stack.
        hint: >
          $r^{2k}$ is a square.
        answer: >
          $1 - r^{2k} = (1 - r^{k})(1 + r^{k})$, a difference of squares, so
          the factor $1 - r^{k}$ cancels and leaves $1/(1 + r^{k})$. The same
          cancellation is unavailable for any other target; it is the choice
          $N = 2k$ that makes the denominator factor through the numerator.
      - teach: >
          So the probability of doubling your stack is $W = 1/(1 + r^{k})$
          with $r = q/p$. On a fair coin $r = 1$ and it is exactly $1/2$; with
          the coin against you, $r^{k}$ grows geometrically with the number of
          bets you hold, and $W$ falls with it.
      - ask: >
          Same coin, but you start with $10$ and play until $20$ or broke.
          What is the probability of doubling? Give four decimal places.
        expects: "0.0170"
        tolerance: 0.0005
        hint: >
          $1.5^{10} \approx 57.67$.
        feedback: >
          $1/(1 + 57.67) \approx 0.0170$. Two and a half times the stack, ten
          times less likely to double.
      - ask: >
          On this coin, what is the smallest stack $k$ for which doubling
          succeeds less than $5\%$ of the time?
        expects: "8"
        hint: >
          You need $1 + 1.5^{k} > 20$.
        feedback: >
          $1.5^{k} > 19$ means $k > \ln 19/\ln 1.5 \approx 7.26$, so $k = 8$:
          $1/(1 + 1.5^{8}) \approx 0.038$, while $k = 7$ still gives about
          $0.055$.
      - ask: >
          A gambler argues: "With a bigger stack the luck evens out over more
          rounds, so my chance of doubling should creep towards $1/2$." What
          is wrong?
        choices:
          - text: >
              Nothing: the law of averages pulls long games towards the fair
              result.
            feedback: >
              Long games average out towards the coin's true mean, which is a
              loss of $0.2$ chips a round here. More rounds make the losing
              drift more reliable, not less.
          - text: >
              The chance of doubling falls geometrically in $k$, since $r^{k}$
              grows, so a bigger stack makes doubling less likely.
            correct: true
            feedback: >
              From $4$ chips: $0.165$. From $10$: $0.017$. Every extra bet you
              must win is another application of the edge.
          - text: >
              The chance stays at $16/97$, because only the ratio of target to
              stack matters.
            feedback: >
              That is true of a fair coin, where $W = k/N = 1/2$ for every
              $k$. With an edge the exponent is $k$ itself, the number of bets
              between you and either wall.
        feedback: >
          The fair answer depends only on the ratio; the biased answer depends
          on the depth.

      - part: The coin on the other side
        ask: >
          Now the coin favours you, $p = 0.6$, and you start with $4$ and play
          to $8$. What is the probability of doubling? Give an exact fraction.
        expects: "81/97"
        tolerance: 0.0005
        hint: >
          Now $r = 2/3$, so $r^{4} = 16/81$.
        feedback: >
          $1/(1 + 16/81) = 81/97 \approx 0.835$. Note that
          $16/97 + 81/97 = 1$.
      - ask: >
          Why do the answers at $p = 0.4$ and $p = 0.6$ add to exactly $1$?
        choices:
          - text: >
              Coincidence of these particular numbers.
            feedback: >
              It holds for every $k$ and $p$:
              $1/(1 + r^{k}) + 1/(1 + r^{-k}) = 1$. There is a reason behind
              it.
          - text: >
              Because the two games are the same game seen from the
              opponent's chair: when doubling, the opponent also holds $k$.
            correct: true
            feedback: >
              With $N = 2k$ both stacks are $k$. The opponent of the
              $p = 0.4$ player is a $p = 0.6$ player holding $4$, and their
              chance of doubling is your chance of busting.
          - text: >
              Because $0.4 + 0.6 = 1$.
            feedback: >
              The probabilities enter through the fourth power of their
              ratio, not linearly. The sum is $1$ for a structural reason.
        feedback: >
          Doubling is the symmetric split, so swapping $p$ and $q$ swaps the
          players.
      - ask: >
          A colleague wants your chance of reaching $12$ from $4$ at
          $p = 0.4$, and quotes $1/(1 + 1.5^{4}) = 16/97$. What is wrong?
        choices:
          - text: >
              Nothing; the doubling formula works for any target.
            feedback: >
              The cancellation needs $N = 2k$ exactly. For $N = 12$ the
              general formula gives
              $(1 - 1.5^{4})/(1 - 1.5^{12}) \approx 0.032$, a fifth of
              $16/97$.
          - text: >
              It should be $1/(1 + 1.5^{12})$.
            feedback: >
              The exponent is not the target either. Off the doubling target
              there is no collapsed form; use the general two-barrier formula.
          - text: >
              The target is not twice the stack, so the collapsed form does not
              apply; use the general formula.
            correct: true
            feedback: >
              $(1 - 1.5^{4})/(1 - 1.5^{12}) = 4.0625/128.75 \approx 0.032$.
              Tripling is much harder than doubling on a bad coin.
        feedback: >
          In an interview: "double or bust is $1/(1 + (q/p)^{k})$; a coin flip
          when fair, and geometrically small in $k$ when the coin is against
          you."

  - node: quant-processes.ruin.duration
    hook: >
      "How long does this take, on average" is asked as often as "who wins",
      and the answer — the product of the two stack sizes — is short enough
      to say cold and surprising enough that interviewers watch whether you
      sanity-check it.
    explanation: >
      The duration equation $D(k)=1+\tfrac12D(k+1)+\tfrac12D(k-1)$ rearranges
      to a second difference of exactly $-2$ rather than $0$ — the extra $1$
      from paying for the round just played means $D$ can't be affine the
      way the fair $R$ was; it needs a term that curves. The ansatz
      $D(k)=-k^{2}$ checks out against that second-difference target, so the
      general solution is $D(k)=A+Bk-k^{2}$.

      Fitting $D(0)=0$ forces $A=0$, and $D(N)=0$ forces $B=N$, giving the
      clean closed form $D(k)=k(N-k)$: the product of the two stack sizes, in
      bet units.

      This matches the diffusive scaling you'd expect from a $\pm1$ random
      walk on general grounds — covering a distance of order $d$ takes on the
      order of $d^{2}$ steps — applied once toward each barrier and
      multiplied together. The function is symmetric and maximized at
      $k=N/2$, where $D=N^{2}/4$: a fair coin takes longest to settle a
      matchup between two evenly matched stacks, and settles a lopsided one
      comparatively fast because the short stack gets wiped out quickly even
      though the long stack barely notices.
    worked: >
      With $k=15$ and $N=60$, $D(15)=15\times45=675$ rounds on average. The
      same pot split evenly instead, $k=30$, gives the maximum for this $N$:
      $D(30)=30\times30=900=60^{2}/4$ — noticeably longer than the lopsided
      split despite starting from the identical combined pot.
    interview: >
      "How many rounds do you expect this fair game to last" wants
      $k(N-k)$ stated immediately, and a strong follow-up answer volunteers
      that it's maximized when the two stacks are equal and shrinks toward
      $0$ as either stack does.
    pitfalls: >
      This exact formula is fair-game only — using $k(N-k)$ when $p\ne1/2$
      gives a number that can be badly wrong in either direction, since an
      edge changes both how the game ends and how quickly. Misremembering the
      exponent (writing $k^{2}(N-k)$ or similar) is caught immediately by
      checking the symmetric case still gives $N^{2}/4$.
    recap: >
      In a fair game, expected duration is $k(N-k)$, the product of the two
      stacks, maximized at $N^{2}/4$ when they're equal.
    dialogue:
      - part: How long does one against three last
        teach: >
          A fair coin, one chip a round. You hold $1$, the opponent holds $3$.
          The interviewer does not ask who wins; she asks how many rounds the
          game lasts on average.
      - ask: >
          Write $D(k) = 1 + \tfrac{1}{2}D(k+1) + \tfrac{1}{2}D(k-1)$ for
          $k = 1, 2, 3$, with $D(0) = D(4) = 0$. By symmetry $D(1) = D(3)$.
          What is $D(1)$?
        expects: "3"
        hint: >
          The middle equation gives $D(2) = 1 + D(1)$. Put that into the
          first.
        feedback: >
          $D(1) = 1 + \tfrac{1}{2}(1 + D(1))$, so $\tfrac{1}{2}D(1) =
          \tfrac{3}{2}$ and $D(1) = 3$ rounds.
      - ask: >
          And $D(2)$, starting from an even split?
        expects: "4"
        hint: >
          You already have $D(2)$ in terms of $D(1)$.
        feedback: >
          $D(2) = 1 + D(1) = 4$. From $0$ to $4$ the list reads
          $0, 3, 4, 3, 0$.
      - ask: >
          Now $5$ chips in all. Using the same symmetry, $D(1) = D(4)$ and
          $D(2) = D(3)$, what is $D(1)$?
        expects: "4"
        hint: >
          The equation at $2$ gives $D(2) = 2 + D(1)$.
        feedback: >
          $D(2) = 1 + \tfrac{1}{2}D(1) + \tfrac{1}{2}D(2)$ gives
          $D(2) = 2 + D(1)$; then $D(1) = 1 + \tfrac{1}{2}(2 + D(1))$ gives
          $D(1) = 4$ and $D(2) = 6$. The list is $0, 4, 6, 6, 4, 0$.

      - part: Reading the pattern
        reflect: >
          On $4$ chips: $3, 4, 3$. On $5$ chips: $4, 6, 6, 4$. Guess $D(k)$ in
          terms of the two stacks, and say why the equation forces a
          quadratic rather than a straight line.
        hint: >
          Multiply your stack by the opponent's. Then look at what the leading
          $1$ does to the second difference.
        answer: >
          $D(k) = k(N - k)$, the product of the two stacks: $1 \cdot 3$,
          $2 \cdot 2$, $1 \cdot 4$, $2 \cdot 3$. Rearranged, the equation
          says $D(k+1) - 2D(k) + D(k-1) = -2$: the second difference is a
          nonzero constant instead of $0$. A straight line has second
          difference $0$, so the solution must bend, and a constant second
          difference is the signature of a quadratic.
      - teach: >
          That is the fair expected duration, $D(k) = k(N - k)$. The general
          solution is a particular solution plus the straight lines that solve
          the zero-second-difference equation: $D(k) = A + Bk - k^{2}$. Then
          $D(0) = 0$ forces $A = 0$ and $D(N) = 0$ forces $B = N$. It relies on
          $D$ being finite in the first place, which the proof that the game
          ends with probability one supplies.
      - ask: >
          Why is $-k^{2}$ the right particular solution?
        choices:
          - text: >
              Its second difference is
              $-(k+1)^{2} + 2k^{2} - (k-1)^{2} = -2$, exactly what the equation
              demands.
            correct: true
            feedback: >
              Any function with second difference $-2$ would do; $-k^{2}$ is
              the simplest. The straight lines then absorb the boundary
              conditions.
          - text: >
              Because the game gets shorter as $k$ grows.
            feedback: >
              It does not: from $1$ of $4$ it lasts $3$ rounds, from $2$ of $4$
              it lasts $4$. The sign of $-k^{2}$ is about curvature, not about
              $D$ falling.
          - text: >
              Because a fair walk's distance from its start grows like
              $\sqrt{n}$, so time grows like distance squared.
            feedback: >
              That heuristic is why the answer scales like a square, but it is
              not why $-k^{2}$ solves the equation. The check is the second
              difference, $-2$.
        feedback: >
          The heuristic and the algebra agree: covering a distance $d$ with a
          fair walk takes on the order of $d^{2}$ rounds.

      - part: Long games and short ones
        ask: >
          You hold $8$ against an opponent's $32$. How many rounds does the
          game last on average?
        expects: "256"
        hint: >
          Multiply the stacks.
        feedback: >
          $8 \times 32 = 256$ rounds.
      - ask: >
          Both stacks double, to $16$ against $64$. By what factor does the
          expected length grow?
        expects: "4"
        hint: >
          Each factor in the product doubles.
        feedback: >
          $16 \times 64 = 1024 = 4 \times 256$. Doubling both stacks
          quadruples the length, which is the distance-squared scaling again.
      - ask: >
          You hold $1$ chip against $99$. How many rounds do you expect to
          last?
        expects: "99"
        hint: >
          Still the product.
        feedback: >
          $1 \times 99 = 99$ rounds, even though you go broke $99\%$ of the
          time, half the time on the very first round. The rare games where
          you climb away from $0$ run for thousands of rounds and carry the
          average.
      - ask: >
          The coin is now $p = 0.45$, from $8$ against $32$. Is the expected
          length still $256$?
        choices:
          - text: >
              Yes: the product of the stacks does not involve $p$.
            feedback: >
              The product came from the equation with weights $\tfrac{1}{2}$.
              With $p \ne q$ the equation is
              $D(k) = 1 + p\,D(k+1) + q\,D(k-1)$, and its particular solution
              is a different function.
          - text: >
              Roughly; a small bias changes it by a few percent.
            feedback: >
              A five-point bias over a game hundreds of rounds long is not a
              small perturbation: the drift carries you to the floor much
              sooner than the fair walk would.
          - text: >
              No: $k(N - k)$ is the fair-game answer only; a biased coin needs
              its own solution.
            correct: true
            feedback: >
              With the coin against you, the steady drift of $-0.1$ chips a
              round carries you to $0$ in about $80$ rounds on average, not
              $256$.
        feedback: >
          In an interview: "fair coin, expected length is the product of the
          stacks, $k(N - k)$, largest at an even split where it is $N^{2}/4$."
          And say that it is fair-only before anyone asks.

  - node: quant-processes.ruin.duration-biased
    hook: >
      This is the number that turns "an edge makes you safer" into a
      two-sided fact: it also tells you exactly how much longer you should
      expect to be exposed to that edge before the game resolves.
    explanation: >
      The equation $D(k)=1+p\,D(k+1)+q\,D(k-1)$ has an extra constant term,
      exactly as in the fair case, but now with $p\ne q$ the natural
      particular-solution guess is linear rather than quadratic: try
      $D(k)=ck$. Substituting and simplifying, the recursion forces
      $1+c(p-q)=0$, so $c=1/(q-p)$ — the particular solution is $k/(q-p)$.

      The general solution adds this to the homogeneous piece, which obeys
      the same characteristic equation as the ruin probability itself, with
      roots $1$ and $r=q/p$: $D(k)=k/(q-p)+A+Br^{k}$. Matching $D(0)=0$ and
      $D(N)=0$ and simplifying the resulting constants lands on
      $D(k)=(k-N\,W(k))/(q-p)$, reusing $W(k)$ from the biased ruin formula
      rather than solving for $A$ and $B$ separately.

      The identity in the middle — $N\,W(k)-k=(p-q)D(k)$ — is really just the
      statement that the expected net displacement of the walk equals the
      average drift per round, $p-q$, times the expected number of rounds.
      Reading the closed form this way explains why an edge makes the game
      both safer and, in expectation, considerably longer: fewer of the
      surviving paths bust quickly, so the average path takes longer to
      resolve even though far more of them resolve favorably.
    worked: >
      At $k=5$, $N=50$, $p=0.48$ (so $q-p=0.04$): the biased formula gives
      $W(5)\approx0.00916$, so
      $D(5)=(5-50\times0.00916)/0.04=(5-0.458)/0.04\approx113.5$ rounds for a
      $2$-point disadvantage on a pot of $50$.
    interview: >
      "Does having an edge make the game shorter or longer" is a favorite
      trick question — the honest answer is longer in expectation even
      though it's also safer, and being able to justify that from the drift
      identity, rather than just asserting it, is what's being tested.
    pitfalls: >
      The denominator $q-p$ changes sign depending on who holds the edge —
      plugging in the raw difference without tracking that sign gives a
      negative or nonsensical duration. This formula degenerates as
      $p\to q$ (the denominator vanishes exactly where the fair-game formula
      $k(N-k)$ takes over), so it can't be naively limited into the fair case
      the way the ruin-probability formula can.
    recap: >
      With an edge, expected duration is $D(k)=(k-N\,W(k))/(q-p)$ — reusing
      the biased win probability rather than solving a fresh system, and
      generally longer than intuition about "safer means faster" suggests.
    dialogue:
      - part: Three chips and a two-thirds coin
        teach: >
          You win each round with probability $2/3$. You hold $1$ chip, the
          opponent holds $2$, and play stops when one side has all $3$. On a
          fair coin this game lasts $1 \times 2 = 2$ rounds on average.
      - ask: >
          Solve $D(1) = 1 + \tfrac{2}{3}D(2)$ and
          $D(2) = 1 + \tfrac{1}{3}D(1)$. What is $D(1)$?
        expects: "15/7"
        tolerance: 0.005
        hint: >
          Substitute the second equation into the first.
        feedback: >
          $D(1) = 1 + \tfrac{2}{3} + \tfrac{2}{9}D(1)$, so
          $\tfrac{7}{9}D(1) = \tfrac{5}{3}$ and $D(1) = 15/7 \approx 2.14$
          rounds, longer than the fair $2$.
      - ask: >
          Now the coin is against you, $p = 1/3$, same stacks. What is $D(1)$?
        expects: "12/7"
        tolerance: 0.005
        hint: >
          Now $D(1) = 1 + \tfrac{1}{3}D(2)$ and $D(2) = 1 + \tfrac{2}{3}D(1)$.
        feedback: >
          $D(1) = 1 + \tfrac{1}{3} + \tfrac{2}{9}D(1)$, so
          $\tfrac{7}{9}D(1) = \tfrac{4}{3}$ and $D(1) = 12/7 \approx 1.71$,
          shorter than the fair $2$.
      - ask: >
          One edge lengthened the game and the other shortened it. What
          decides which?
        choices:
          - text: >
              An edge in your favour always lengthens the game.
            feedback: >
              From $1$ chip, the good coin pushes you away from the near wall
              at $0$, so the game lasts longer. Start next to the top wall
              instead and the same coin ends it sooner.
          - text: >
              Whether the drift pushes you towards the nearer wall or across to
              the farther one.
            correct: true
            feedback: >
              A drift into the near wall ends the game quickly; a drift away
              from it sends the walk on the long trip to the far wall.
          - text: >
              Any edge shortens the game, because a biased walk moves with
              purpose.
            feedback: >
              The good coin from $1$ chip gave $15/7$, longer than the fair
              $2$. Purposeful drift is fast only if it is aimed at a nearby
              wall.
        feedback: >
          The size and the direction of the drift both matter, which is why
          the answer has to come from the equation, not a rule of thumb.

      - part: A solution that drifts
        ask: >
          The fair game used $-k^{2}$ as a particular solution. With $p \ne q$
          try $D(k) = c\,k$ in $D(k) = 1 + p\,D(k+1) + q\,D(k-1)$. What is $c$
          when $p = 2/3$?
        expects: "-3"
        hint: >
          The right side becomes $1 + c\,k + c\,(p - q)$.
        feedback: >
          $c\,k = 1 + c\,k + c\,(p - q)$ forces $c = 1/(q - p) = 1/(-1/3) = -3$.
          In general the particular solution is $k/(q - p)$: the number of
          rounds a drift of $p - q$ per round needs to cover a distance $k$,
          with a sign.
      - reflect: >
          The general solution is $k/(q - p) + A + B\,r^{k}$. The particular
          part is already $0$ at $k = 0$ but equals $N/(q - p)$ at $k = N$.
          What must you subtract to fix the top wall without breaking the
          bottom one? Which function that you already know does the job?
        hint: >
          You need a solution of the homogeneous equation that is $0$ at $0$
          and $1$ at $N$.
        answer: >
          Subtract $N/(q - p)$ times a homogeneous solution that is $0$ at $0$
          and $1$ at $N$. That function is exactly $W(k)$, the probability of
          reaching the target first. So $D(k) = (k - N\,W(k))/(q - p)$. Read
          it as bookkeeping: the expected net movement $N\,W(k) - k$ equals
          the drift $p - q$ per round times the expected number of rounds.
      - teach: >
          That is the expected duration with an edge:
          $D(k) = \dfrac{k - N\,W(k)}{q - p}$, with
          $W(k) = (1 - r^{k})/(1 - r^{N})$ from the biased formula. Check it on
          the three-chip game: $W(1) = 4/7$ at $p = 2/3$, and
          $(1 - 12/7)/(-1/3) = 15/7$.

      - part: Six chips, either way
        ask: >
          Take $p = 0.4$, $k = 3$, $N = 6$. The biased formula gives
          $W(3) = 8/35$. What is $D(3)$, as an exact fraction?
        expects: "57/7"
        tolerance: 0.005
        hint: >
          $q - p = 0.2$.
        feedback: >
          $(3 - 6 \times 8/35)/0.2 = (57/35)/0.2 = 57/7 \approx 8.14$ rounds,
          against $3 \times 3 = 9$ for the fair game.
      - ask: >
          Flip the coin to $p = 0.6$ from the same even split. How does the
          expected length compare with $57/7$?
        choices:
          - text: >
              Longer: the edge is now in your favour.
            feedback: >
              From an even split the walls are equally far away. The game seen
              from the opponent's chair is the $p = 0.4$ game from $3$, so the
              length is the same.
          - text: >
              Exactly the same, $57/7$.
            correct: true
            feedback: >
              Swapping $p$ and $q$ swaps the players, and from an even split
              that leaves the game unchanged. Both are shorter than the fair
              $9$: from the middle, any drift aims at a wall only three steps
              away.
          - text: >
              Shorter: the drift ends the game faster.
            feedback: >
              It does end the game faster than the fair $9$, but not faster
              than $57/7$. By symmetry the two biased games have equal length.
        feedback: >
          The direction of the edge matters only when the walls are at
          different distances.
      - ask: >
          A colleague computes $(3 - 48/35)/(p - q)$ and reports about $-8.1$
          rounds. What went wrong?
        choices:
          - text: >
              The denominator must be $q - p$; with $p - q$ the sign flips.
            correct: true
            feedback: >
              A negative duration is the alarm. The particular solution is
              $k/(q - p)$, so $q - p$ belongs in the denominator.
          - text: >
              $W(3)$ was wrong; the true $W$ makes the numerator negative.
            feedback: >
              $W(3) = 8/35$ is right, and the numerator $3 - 48/35 = 57/35$ is
              positive. The fault is in the denominator.
          - text: >
              Nothing; durations can be negative when the coin is against you.
            feedback: >
              A count of rounds cannot be negative. When a formula gives one,
              a sign has been dropped.
        feedback: >
          Check any duration by its sign, and by comparing with the fair
          $k(N - k)$ for the same stacks.
      - ask: >
          At $p = 0.5001$ the formula divides a tiny numerator by
          $q - p = -0.0002$. What is the right way to read that?
        choices:
          - text: >
              The formula is undefined there, so the duration is unknown.
            feedback: >
              The formula is defined for every $p \ne q$; it is just badly
              conditioned near $p = q$, where a tiny numerator meets a tiny
              denominator.
          - text: >
              Near fair, the two small quantities cancel and the value tends to
              the fair $k(N - k)$; use that, not a rounded computation.
            correct: true
            feedback: >
              Both the numerator $k - N\,W(k)$ and the denominator go to $0$,
              and their ratio goes to $k(N - k)$. Rounding $W$ to a few digits
              there produces garbage.
          - text: >
              The game becomes infinitely long as the edge vanishes.
            feedback: >
              The fair game lasts $k(N - k)$ rounds, which is finite. Only
              the formula's form degenerates, not the game.
        feedback: >
          In an interview: "with an edge, $D = (k - N\,W)/(q - p)$: the net
          expected move divided by the drift per round", and then sanity-check
          the sign and the fair limit.

  - node: quant-processes.ruin.infinite-opponent
    hook: >
      "What if the house has infinite money" is a favorite interview
      escalation, and the answer splits sharply on whether you actually have
      an edge — a fair game is not a safe game against an unlimited
      opponent.
    explanation: >
      Send $N\to\infty$ while holding $k$ fixed — the house's bankroll grows
      without limit, but you never walk away, so play only ever stops if you
      go broke. In the fair formula $R(k)=1-k/N$, any fixed $k$ becomes
      negligible next to a diverging $N$, so $R(k)\to1$: ruin is certain. The
      same conclusion holds for any $p\le1/2$, since then $r=q/p\ge1$ and
      $r^{N}$ either diverges or stays fixed at $r^{N}=1$, and in both
      formulas that sends $R(k)\to1$ as well.

      The picture only changes once $p>1/2$ strictly: then $r<1$, so
      $r^{N}\to0$ as $N\to\infty$, and the biased formula's boundary term
      drops out entirely, leaving $R(k)\to r^{k}=(q/p)^{k}$ — a genuine,
      positive lifetime bust probability that no longer depends on any
      bankroll ceiling, because there isn't one.

      The practical reading: against an opponent who can absorb unlimited
      losses, breaking even is not a safe strategy — it's a losing one with
      probability $1$, however small your bets or however patient you are.
      An edge is what buys a real floor under your bust probability, and that
      floor still decays geometrically as your own stack $k$ grows, so the
      edge and the capital to back it are both doing real work, not just one
      of them.
    worked: >
      At $p=0.53$ against an unlimited opponent, $r=0.47/0.53\approx0.887$.
      A stack of $k=15$ busts eventually with probability
      $r^{15}\approx0.165$ — about $16.5\%$ — leaving an $83.5\%$ chance of
      surviving forever, purely from a $3$-point edge combined with a modest
      bankroll.
    interview: >
      "If you play forever against a casino with unlimited capital, do you
      eventually go broke" is answered by splitting on the sign of the edge —
      certainly, with probability $1$, if $p\le1/2$, and with probability
      $(q/p)^{k}$ otherwise, never assuming a break-even game is
      automatically safe just because it isn't obviously unfavorable.
    pitfalls: >
      Treating a fair, zero-edge game as "safe" against an unlimited bank is
      the most common error — $p=1/2$ still gives certain ruin here, since
      $R(k)\to1$ exactly at the boundary case $p=1/2$ too. Forgetting that
      even with $p>1/2$ the bust probability is strictly positive for any
      finite $k$, not zero, overstates how safe a real edge with a real
      finite bankroll actually is.
    recap: >
      Against an unlimited opponent, ruin is certain whenever $p\le1/2$; with
      an edge, lifetime bust probability is the strictly positive $(q/p)^{k}$.
    dialogue:
      - part: A good coin and a deepening house
        teach: >
          You win each round with probability $3/4$ and hold $3$ chips. You
          will play until one side is empty. First the house holds just $3$;
          then you will let the house get richer and watch what happens.
      - ask: >
          With the house holding $3$, so $N = 6$ and $r = 1/3$, what is your
          ruin probability? Give an exact fraction.
        expects: "1/28"
        hint: >
          $r^{3} = 1/27$ and $r^{6} = 1/729$.
        feedback: >
          $(1/27 - 1/729)/(1 - 1/729) = (26/729)/(728/729) = 26/728 = 1/28$.
      - ask: >
          Now the house holds $9$, so $N = 12$. What is your ruin probability,
          to four decimal places?
        expects: "0.0370"
        tolerance: 0.00005
        hint: >
          $r^{12} = 1/531441$, which is tiny.
        feedback: >
          $(1/27 - 1/531441)/(1 - 1/531441) \approx 0.03704$. It moved from
          $1/28 \approx 0.0357$ and has nearly stopped moving: it sits just
          below $1/27 \approx 0.037037$.
      - reflect: >
          What happens to the formula as the house's stack grows without
          limit, and what does the number it settles on mean for a player who
          never walks away?
        hint: >
          Here $r < 1$. What does $r^{N}$ do as $N$ grows?
        answer: >
          $r^{N} \to 0$, so $(r^{k} - r^{N})/(1 - r^{N}) \to r^{k}$, here
          $(1/3)^{3} = 1/27$. Against an unlimited house the game ends only if
          you go broke, so $r^{k}$ is the probability that you are ever ruined;
          with probability $26/27$ you survive forever, your stack drifting
          upward without end.
      - teach: >
          That is ruin against an infinitely rich opponent. With the edge on
          your side, $p > 1/2$, the lifetime bust probability is
          $(q/p)^{k}$, geometric in your bankroll measured in bets. The
          opposite case needs its own look, because there $r \ge 1$ and
          $r^{N}$ does not vanish.

      - part: When the house has the edge, or nobody does
        ask: >
          Fair coin, unlimited house, you hold $50$ and never stop. What is the
          probability that you eventually go broke?
        choices:
          - text: >
              $1/2$, since the coin is fair.
            feedback: >
              Fairness gives $1 - k/N$ against a house of $N - k$. Here the
              house is unlimited: $1 - 50/N \to 1$.
          - text: >
              It depends on $50$: a big enough stack keeps you safe.
            feedback: >
              Any finite stack is a vanishing share of an unlimited pot:
              $k/N \to 0$ for every fixed $k$, however large.
          - text: >
              $1$: ruin is certain.
            correct: true
            feedback: >
              $R = 1 - 50/N \to 1$. A fair game against an unlimited bank ends
              with you broke, with probability one, though it may take a very
              long time.
        feedback: >
          Zero expected profit per round does not protect you from an opponent
          who can always wait for the run that wipes you out.
      - ask: >
          To see the limit at work: fair coin, you hold $3$, house holds $997$.
          What is your ruin probability?
        expects: "0.997"
        hint: >
          Fair game: $1 - k/N$.
        feedback: >
          $1 - 3/1000 = 0.997$. Make the house richer and it creeps further
          towards $1$.
      - ask: >
          Now $p = 0.45$ against an unlimited house. What happens to the
          formula?
        choices:
          - text: >
              $R \to r^{k}$, as with a good coin.
            feedback: >
              Here $r = 11/9 > 1$, so $r^{k} > 1$: not a probability. The
              limit $r^{N} \to 0$ that produced $r^{k}$ only happens when
              $r < 1$.
          - text: >
              $R \to 1$, because $r^{N}$ blows up and dominates numerator and
              denominator.
            correct: true
            feedback: >
              $(r^{k} - r^{N})/(1 - r^{N}) \to 1$ as $r^{N} \to \infty$. With
              the coin against you, ruin is certain, as in the fair case.
          - text: >
              The formula has no limit.
            feedback: >
              Divide top and bottom by $r^{N}$: the ratio is
              $(r^{k - N} - 1)/(r^{-N} - 1) \to 1$.
        feedback: >
          For $p \le 1/2$ ruin is certain whatever your stack and however small
          your bets. Only an edge buys a chance of surviving forever.

      - part: What capital buys
        ask: >
          You have an edge, $p = 0.55$, and hold $8$ units against an
          unlimited house. What is your lifetime bust probability, to four
          decimal places?
        expects: "0.2008"
        tolerance: 0.0005
        hint: >
          $r = 0.45/0.55 = 9/11$.
        feedback: >
          $(9/11)^{8} \approx 0.2008$. A real edge, and you still bust one
          time in five.
      - ask: >
          Double the bankroll to $16$ units. What is the bust probability now?
        expects: "0.0403"
        tolerance: 0.0005
        hint: >
          You can square the previous answer.
        feedback: >
          $(9/11)^{16} = 0.2008^{2} \approx 0.0403$. Doubling the bankroll
          squares the bust probability: to go broke from $16$ you must first
          fall to $8$, and then fall another $8$, two independent descents of
          the same kind.
      - ask: >
          Trader A has $p = 0.55$ and $2$ units of capital. Trader B has a
          thinner edge, $p = 0.53$, and $40$ units. Both play an unlimited
          market forever. Who is safer?
        choices:
          - text: >
              Trader A: a bigger edge is worth more than capital.
            feedback: >
              A busts with probability $(9/11)^{2} \approx 0.67$. Two units
              cannot ride out the variance even with a strong edge.
          - text: >
              Trader B, by a wide margin.
            correct: true
            feedback: >
              B busts with probability $(47/53)^{40} \approx 0.008$, against
              A's $0.67$. The exponent is the capital in bets.
          - text: >
              Equally safe: both have a positive edge, so both survive.
            feedback: >
              A positive edge makes survival possible, not certain. The bust
              probability is $(q/p)^{k}$, which is never $0$ for finite $k$.
        feedback: >
          In an interview: "with no edge, an infinite bank ruins you with
          probability one; with an edge, you bust with probability
          $(q/p)^{k}$, so capital enters as an exponent."

  - node: quant-processes.ruin.unequal-steps
    hook: >
      Interviewers love perturbing the classic $\pm1$ walk into "win $2$,
      lose $1$" or similar — recognizing that the same geometric bust
      probability survives, with a different characteristic root, is the
      difference between re-deriving everything from scratch and reusing the
      machinery.
    explanation: >
      Against an unlimited opponent, the bust probability from any interior
      state has to satisfy the same restart property as before: whatever the
      jump distribution, $R(k)=\mathbb{E}[R(k+X)]$. Trying the ansatz
      $R(k)=\theta^{k}$ turns this into
      $\theta^{k}=\mathbb{E}[\theta^{k+X}]=\theta^{k}\mathbb{E}[\theta^{X}]$,
      and since $\theta^{k}\ne0$ this forces $\mathbb{E}[\theta^{X}]=1$ — the
      same trick that produced $(q/p)^{k}$ in the $\pm1$ case, now written for
      a general step $X$.

      Plugging in $X=\pm1$ recovers $p\theta+q/\theta=1$, whose roots are
      $\theta=1$ and $\theta=q/p$ exactly as before — $\theta=1$ is not a
      coincidence specific to that case, it's a root of $\mathbb{E}
      [\theta^{X}]=1$ for any jump distribution, since probabilities sum to
      $1$ and so the equation is trivially satisfied at $\theta=1$. The real
      content of solving this equation is dividing out that trivial root and
      finding the other one in $(0,1)$, which exists and is unique whenever
      $\mathbb{E}[X]>0$.

      The requirement that no downward jump exceed one unit is what keeps the
      answer this clean: it means the walk can never jump straight over $0$
      from above, so hitting $(-\infty,0]$ for the first time means landing
      exactly on $0$, preserving the same ladder structure that made the
      $\pm1$ case solvable. Once a jump of $-2$ or worse is possible, the walk
      can skip past $0$ entirely and the geometric form breaks down.
    worked: >
      Take $X=+2$ with probability $p=0.4$ and $X=-1$ with probability
      $q=0.6$ (positive drift, $\mathbb{E}[X]=0.2$). The equation
      $0.4\theta^{2}+0.6/\theta=1$ becomes, after clearing the $\theta=1$
      root, $2\theta^{2}+2\theta-3=0$, giving $\theta=(\sqrt{7}-1)/2\approx
      0.823$. A stack of $k=6$ then busts against an unlimited opponent with
      probability $\theta^{6}\approx0.311$, about $31\%$.
    interview: >
      "The walk wins $2$ or loses $1$ each round — what's the bust
      probability against an unlimited bank" is answered by writing
      $\mathbb{E}[\theta^{X}]=1$, dividing out $\theta=1$, and solving the
      remaining polynomial for the root in $(0,1)$ — naming the equation from
      memory without deriving it invites a request to justify why $\theta=1$
      is always there.
    pitfalls: >
      Reporting $\theta=1$ itself as the answer, rather than dividing it out
      and finding the other root, gives the meaningless statement that bust
      probability is $1^{k}=1$ regardless of $k$. Applying this formula when
      a downward jump larger than one unit is possible ignores that the walk
      can then leap over $0$, which breaks the argument that requires landing
      exactly on the barrier.
    recap: >
      For a general upward jump with no downward jump past $1$, bust
      probability against an unlimited bank is still geometric, $\theta^{k}$,
      with $\theta$ the nontrivial root of $\mathbb{E}[\theta^{X}]=1$.
    dialogue:
      - part: Win two, lose one
        teach: >
          A strategy gains $2$ units with probability $4/7$ and loses $1$ unit
          with probability $3/7$ each round. You start with $3$ units, the
          house is unlimited, and you never stop. You want the probability of
          ever going broke.
      - ask: >
          Can you answer with the formula for an infinitely rich opponent,
          $(q/p)^{k} = (3/4)^{3}$?
        choices:
          - text: >
              Yes: $p = 4/7$ and $q = 3/7$ are still a win and a loss
              probability.
            feedback: >
              That formula came from a walk whose up-steps are $+1$. Here a win
              is worth $2$, so the first-step equation, and with it the answer,
              changes. $(3/4)^{3} \approx 0.42$ treats your $+2$ as a $+1$.
          - text: >
              No: a loss of $1$ could jump past $0$.
            feedback: >
              A loss of exactly one unit always lands on $0$ before it could go
              below. Jumping past $0$ needs a downward move of two or more,
              which this game does not have.
          - text: >
              No: the up-steps are $+2$, so the equations behind $(q/p)^{k}$ do
              not describe this walk.
            correct: true
            feedback: >
              Right. The size of the up-step changes every first-step
              equation; you need a method that allows it.
        feedback: >
          The $\pm 1$ formulas do not apply, but one feature survives: the walk
          can only go down one unit at a time, so it cannot skip a level on the
          way down.
      - ask: >
          What is the expected change in your stack per round?
        expects: "5/7"
        hint: >
          $2 \cdot \tfrac{4}{7} - 1 \cdot \tfrac{3}{7}$.
        feedback: >
          $8/7 - 3/7 = 5/7 > 0$. A positive drift, so there is hope of
          surviving forever, as with an edge in the $\pm 1$ game.

      - part: Falling one level at a time
        reflect: >
          Because losses are one unit at a time, going broke from $3$ means
          first falling to $2$, then to $1$, then to $0$. Let $\theta$ be the
          probability of ever falling one unit below where you stand. What is
          the bust probability from $3$, and why?
        hint: >
          Does falling from $2$ to $1$ look any different from falling from
          $3$ to $2$?
        answer: >
          $\theta^{3}$. Each fall of one level is the same problem started
          afresh: the walk has no memory, and the house is unlimited, so the
          level you start from does not matter. The three falls happen one
          after another and each succeeds with probability $\theta$
          independently of how the previous one went, so the bust probability
          from $k$ is $\theta^{k}$.
      - ask: >
          Condition on the first round to get an equation for $\theta$. Which
          is it?
        choices:
          - text: >
              $\theta = \tfrac{3}{7} + \tfrac{4}{7}\theta^{2}$
            feedback: >
              After a win of $2$ you are $2$ above where you stood, so you are
              $3$ above the level you are trying to reach. That is three falls,
              $\theta^{3}$, not two.
          - text: >
              $\theta = \tfrac{3}{7}$
            feedback: >
              That counts only falling on the first round. After a win you can
              still fall later, and those paths have to be counted.
          - text: >
              $\theta = \tfrac{3}{7} + \tfrac{4}{7}\theta^{3}$
            correct: true
            feedback: >
              A loss completes the fall at once. A win leaves you three levels
              above the target, and falling from there takes three independent
              falls.
        feedback: >
          Divide through by $\theta$ and the equation reads
          $1 = \tfrac{3}{7}\theta^{-1} + \tfrac{4}{7}\theta^{2}$: the average
          of $\theta^{X}$ over one round's move $X$ equals $1$.
      - ask: >
          Clear the equation to $4\theta^{3} - 7\theta + 3 = 0$. One root is
          always $\theta = 1$. What is the root strictly between $0$ and $1$?
        expects: "1/2"
        hint: >
          Divide by $\theta - 1$ to get $4\theta^{2} + 4\theta - 3 = 0$.
        feedback: >
          $4\theta^{2} + 4\theta - 3 = (2\theta - 1)(2\theta + 3)$, so the
          roots are $1/2$ and $-3/2$. The one in $(0,1)$ is $\theta = 1/2$.
      - teach: >
          That is the adjustment coefficient. For moves $X$ with
          $\mathbb{E}[X] > 0$ and no downward step larger than one unit, the
          probability of ever going broke from $k$ against an unlimited
          opponent is $\theta^{k}$, where $\theta$ is the unique root in
          $(0,1)$ of $\mathbb{E}[\theta^{X}] = 1$.
      - ask: >
          The equation also has the root $\theta = 1$. Why is the answer $1/2$
          and not $1$?
        choices:
          - text: >
              Either root is valid; you pick the smaller one by convention.
            feedback: >
              The fall probability is one specific number, not a convention.
              The root $1$ solves every such equation and so cannot be what
              distinguishes this game; positive drift is what rules it out.
          - text: >
              With positive drift, surviving forever has positive probability,
              so the fall probability is below $1$; the root in $(0,1)$ is the
              true one.
            correct: true
            feedback: >
              $\theta = 1$ always solves the equation, since probabilities sum
              to $1$, so it carries no information about this game. When
              $\mathbb{E}[X] > 0$, the actual fall probability is the other
              root.
          - text: >
              Because $\theta = 1$ would make the bust probability $1^{3} = 1$,
              which is impossible.
            feedback: >
              Certain ruin is not impossible in general: in a game with no
              edge it is exactly the answer. What rules it out here is the
              positive drift.
        feedback: >
          The root $1$ is always present and always uninformative; the content
          of the equation is its other root.

      - part: Checks and failures
        ask: >
          From $3$ units, what is the probability of ever going broke?
        expects: "1/8"
        hint: >
          Three independent falls.
        feedback: >
          $\theta^{3} = (1/2)^{3} = 1/8$. The $\pm 1$ formula with these
          probabilities would have said about $0.42$: a win worth $2$ instead
          of $1$ cuts the bust probability by more than a factor of three.
      - ask: >
          Apply the method to a plain $\pm 1$ walk with $p > 1/2$. What does
          $\mathbb{E}[\theta^{X}] = 1$ give?
        choices:
          - text: >
              $p\,\theta + q/\theta = 1$, with roots $1$ and $q/p$, so the bust
              probability is $(q/p)^{k}$.
            correct: true
            feedback: >
              Multiply by $\theta$: $p\,\theta^{2} - \theta + q = 0$, roots $1$
              and $q/p$. The method recovers the infinitely rich opponent
              answer exactly.
          - text: >
              $p\,\theta + q\,\theta = 1$, so $\theta = 1$.
            feedback: >
              A loss is $X = -1$, so it contributes $q\,\theta^{-1}$, not
              $q\,\theta$.
          - text: >
              $p/\theta + q\,\theta = 1$, with roots $1$ and $p/q$.
            feedback: >
              The exponents are swapped: a win is $X = +1$ and contributes
              $p\,\theta$. With $p > 1/2$ the root $p/q$ exceeds $1$, which
              no probability can.
        feedback: >
          The $\pm 1$ case is the special case where the polynomial is a
          quadratic.
      - ask: >
          Now the moves are $+2$ with probability $1/3$ and $-1$ with
          probability $2/3$. What does the method say?
        choices:
          - text: >
              $\theta = 1/2$ again, since the moves are the same sizes.
            feedback: >
              The probabilities changed. The equation is now
              $\theta^{3} - 3\theta + 2 = 0$, which factors as
              $(\theta - 1)^{2}(\theta + 2)$: no root in $(0,1)$ at all.
          - text: >
              There is no root in $(0,1)$; the drift is $0$ and ruin is
              certain.
            correct: true
            feedback: >
              $\mathbb{E}[X] = 2/3 - 2/3 = 0$, the root $1$ is a double root,
              and the bust probability is $1$, as for a fair coin against an
              unlimited bank.
          - text: >
              $\theta = -2$, the other root.
            feedback: >
              A probability cannot be negative. When the only root in $[0,1]$
              is $1$, ruin is certain.
        feedback: >
          The method needs $\mathbb{E}[X] > 0$ and downward steps of one unit.
          If a loss could be $2$ units, the walk could jump from $1$ to $-1$,
          the falls would no longer be one level each, and $\theta^{k}$ would
          fail. In an interview: "losses are one unit, so ruin from $k$ is
          $\theta^{k}$, and $\theta$ solves $\mathbb{E}[\theta^{X}] = 1$; drop
          the root $1$."

  - node: quant-processes.ruin.stake-scaling
    hook: >
      "Does bet size matter" sounds like a throwaway question, and the
      honest answer — completely irrelevant in a fair game, enormous once
      there's an edge either way — is exactly the kind of two-part answer
      interviewers reward.
    explanation: >
      Every formula in this unit only ever sees the stacks $k$ and $N$ in
      units of a single bet, because the underlying walk moves by exactly one
      bet-sized unit per round. Betting $b$ units per round instead of $1$ is
      the same walk relabeled in coarser units: the effective barriers become
      $k/b$ and $N/b$, and $p$ itself is untouched, since it's a property of
      a single round, not of how large that round's stake is.

      In a fair game $W=k/N$ is completely unaffected by this relabeling,
      since $(k/b)/(N/b)=k/N$ exactly — bet size can never change whether you
      double up in a fair game, only how many rounds it takes, since the
      expected duration $D=(k/b)(N/b)=kN/b^{2}$ shrinks like $1/b^{2}$ as bets
      get larger.

      Against a biased game the exponent $r^{k/b}$ is where all the action
      is: raising $b$ shrinks $k/b$ toward $0$, and $r^{k/b}\to1$ as $b$
      grows, pushing $W$ toward the fair value $k/N$ regardless of which side
      of $1$ $r$ sits on. That's a genuine improvement for the underdog,
      whose $W$ was depressed below $k/N$ by the edge, but a genuine cost for
      the favored side, whose $W$ was elevated above $k/N$ — the same
      rescaling helps one player and hurts the other, which is why bet size
      becomes a live strategic choice exactly when it stopped mattering in
      the fair case.
    worked: >
      At a $1\%$ house disadvantage ($p=0.49$), take $k=20$, $N=200$.
      Betting one unit at a time gives $W(20,200)\approx0.00041$, about
      $0.041\%$. Betting in chunks of $b=20$ units instead — so the effective
      barriers become $k/b=1$, $N/b=10$ — gives $W(1,10)\approx0.083$, about
      $8.3\%$: roughly two-hundredfold better, from bet sizing alone, with
      $p$ completely unchanged.
    interview: >
      "Does it matter how big your bets are, if the odds per bet are fixed"
      is answered by splitting on fairness: irrelevant to your win
      probability in a fair game (only to how long it takes), but decisive
      against an edge — bigger for the underdog, smaller for the favorite.
    pitfalls: >
      Confusing the two separate effects — win probability and expected
      duration respond completely differently to bet size, with duration
      moving even in the fair game where $W$ doesn't move at all. Assuming
      bigger bets always help ignores that the direction of the effect flips
      with the sign of the edge; a favored player wants smaller bets, not
      larger ones.
    recap: >
      Only $k/b$ and $N/b$ matter: bet size is irrelevant to $W$ when fair,
      helps the underdog against an edge, and hurts the favorite.
    dialogue:
      - part: Six chips against twelve, on a bad coin
        teach: >
          You hold $6$ chips against an opponent's $12$, and each even-money
          bet wins with probability $0.4$. You may bet $1$ chip a round or $6$
          chips a round, but you must pick one size and keep it until someone
          is broke.
      - ask: >
          Before computing, which bet size gives you the better chance of
          taking all $18$?
        choices:
          - text: >
              $1$ chip: small bets keep you in the game longer, giving luck
              more chances to turn.
            feedback: >
              Staying in longer means facing the $0.4$ coin more often. On a
              losing coin, every extra round is another tax; more chances for
              luck are more chances for the edge.
          - text: >
              It makes no difference: the coin and the stacks are the same.
            feedback: >
              That is exactly right for a fair coin, and exactly wrong for
              this one. The bet size changes how many rounds the edge gets to
              act on.
          - text: >
              $6$ chips: fewer rounds give the bad coin fewer chances to grind
              you down.
            correct: true
            feedback: >
              Right instinct. The next two questions put numbers on it.
        feedback: >
          The question is how many times you let a losing coin be flipped.
      - ask: >
          In bets of $6$ you hold $1$ bet and the pot is $3$ bets. With
          $r = 1.5$, what is your probability of taking the pot?
        expects: "4/19"
        tolerance: 0.0005
        hint: >
          The biased formula with $k = 1$ and $N = 3$.
        feedback: >
          $(1 - 1.5)/(1 - 1.5^{3}) = 0.5/2.375 = 4/19 \approx 0.211$, against
          a fair-coin value of $1/3$.
      - ask: >
          In bets of $1$, with $k = 6$ and $N = 18$, what is the probability?
          Give four decimal places.
        expects: "0.0070"
        tolerance: 0.0005
        hint: >
          $1.5^{6} \approx 11.39$ and $1.5^{18} \approx 1477.9$.
        feedback: >
          $(11.39 - 1)/(1477.9 - 1) \approx 0.0070$. Thirty times worse than
          betting $6$ at a time, with the same coin and the same stacks.

      - part: What the formula actually sees
        reflect: >
          Nothing about the coin changed between the two answers. What did the
          formula see differently, and why should it only ever see that?
        hint: >
          Write a $6$-chip bet as one unit of a new currency.
        answer: >
          Only the stacks measured in bets. Betting $b$ chips a round is the
          same walk as betting one unit with stacks $k/b$ and $N/b$, so $b$
          enters only by shrinking the exponents in $r^{k/b}$ and $r^{N/b}$.
          Smaller exponents mean fewer rounds of compounding edge, which on a
          bad coin pulls $W$ up towards the fair $k/N$.
      - teach: >
          That is why bet size rescales the barriers: only $k/b$ and $N/b$
          enter the formulas. On a coin against you, bigger bets help; on a
          fair coin, $W = k/N$ does not change at all; on a coin in your
          favour, the effect reverses.
      - ask: >
          On a fair coin, the same $6$ against $12$ lasts $72$ rounds on
          average in $1$-chip bets. How many rounds in $6$-chip bets?
        expects: "2"
        hint: >
          In bets the stacks are $1$ and $2$. First steps:
          $D(1) = 1 + \tfrac{1}{2}D(2)$ and $D(2) = 1 + \tfrac{1}{2}D(1)$.
        feedback: >
          Symmetry gives $D(1) = D(2)$, so $D(1) = 1 + \tfrac{1}{2}D(1)$ and
          $D = 2$ rounds, a factor of $36 = 6^{2}$ fewer. In a fair
          game bet size moves the length, which scales like $1/b^{2}$, and
          leaves $W = 1/3$ untouched.

      - part: When the edge is yours
        ask: >
          Now the coin favours you, $p = 0.6$. In $6$-chip bets your chance of
          taking the pot is $9/19 \approx 0.47$; in $1$-chip bets it is about
          $0.91$. What is the lesson?
        choices:
          - text: >
              Bigger bets are always better, since they finish the game
              quickly.
            feedback: >
              Finishing quickly is good only when the edge is against you. With
              the edge on your side, a quick finish throws away the rounds
              where your edge works for you.
          - text: >
              With an edge in your favour, small bets are better: they let the
              edge act over many rounds.
            correct: true
            feedback: >
              Each $1$-chip round is another application of your edge, and
              eighteen chips of depth lets it compound from $0.47$ to $0.91$.
          - text: >
              Bet size matters only when the coin is against you.
            feedback: >
              It matters on either side of fair, in opposite directions. Only
              the fair coin is indifferent.
        feedback: >
          Whoever has the edge wants many small bets; whoever is against it
          wants few large ones.
      - ask: >
          A colleague tries bets of $4$ chips in the $6$ against $12$ game,
          and plugs $k = 1.5$, $N = 4.5$ into the formula. What is the
          problem?
        choices:
          - text: >
              Nothing; the formula works for fractional numbers of bets.
            feedback: >
              The walk moves in whole bets, and $6$ chips is not a whole
              number of $4$-chip bets. The real game hits a stack of $2$ after
              one loss and must then bet less, or stop.
          - text: >
              The stacks must be whole numbers of bets, or the walk cannot land
              exactly on the walls.
            correct: true
            feedback: >
              The rescaling only works when $b$ divides both stacks, so that
              every position is a whole number of bets and the walls are hit
              exactly.
          - text: >
              Bets of $4$ chips change $p$.
            feedback: >
              The coin is the same whatever you stake. The problem is that $6$
              and $18$ are not multiples of $4$.
        feedback: >
          In an interview: "only the stacks in units of the bet matter. Fair
          game, bet size is irrelevant to the odds; against me, bet big;
          with me, bet small."

  - node: quant-processes.ruin.bold-play
    hook: >
      This is the punchline of the whole subbranch and a real interview
      question in its own right: "if the odds are against you, should you bet
      big or small to hit a target" — and the answer is the opposite of
      textbook risk-management instinct.
    explanation: >
      Stake-scaling already showed that larger bets push a subfair game's
      success probability up toward, and in the limit past, the fair value —
      bold play takes that to its logical extreme by staking the smaller of
      your current fortune and the amount still needed on every single round.
      Pushed all the way to one round, doubling a stack of $k$ via a single
      bet succeeds with probability exactly $p$, the raw single-round win
      probability, since the whole game is now literally one coin flip for
      the target.

      Against an edge that favors you, the incentive reverses completely:
      shrinking the stake toward $1$ unit per round, rather than growing it,
      pushes the success probability toward $1$ with no ceiling and no
      optimal finite bet size at all — spreading a favorable edge over as
      many independent rounds as possible is what lets the law of large
      numbers grind out the edge, exactly the opposite of concentrating
      exposure into as few rounds as possible.

      The single idea underneath both directions: every round played is
      another independent application of whatever edge is on the table.
      Against you, minimizing the number of rounds minimizes how many times
      that edge gets to bite; for you, maximizing the number of rounds
      maximizes how many times it gets to pay.
    worked: >
      At a fair coin with a $2$-point house disadvantage, $p=0.45$, doubling
      a stack of $k=6$ one unit at a time succeeds with probability
      $W=1/(1+(11/9)^{6})\approx0.231$, about $23.1\%$. A single all-in bet
      for the same target succeeds with probability exactly $p=0.45$, about
      $45\%$ — nearly double the one-unit strategy's odds, and much closer to
      the fair-game benchmark of $50\%$.
    interview: >
      "You need to double your money at a game with a house edge — bet big
      or small" is answered with "as big as possible, as few times as
      possible", and the interviewer is listening for the reasoning — fewer
      rounds means fewer independent applications of the edge — not just the
      correct label "bold play".
    pitfalls: >
      Applying bold-play instinct when the edge actually favors you reverses
      the correct answer — with an edge in hand, small and frequent bets
      outperform large and rare ones, since the law of large numbers is now
      an ally instead of a threat. This result is specific to the objective
      "reach a target before ruin"; it isn't a general claim that big bets
      reduce risk in every framing of the problem.
    recap: >
      Behind on a fair-money target, bet as big and as rarely as possible;
      ahead of one, bet as small and as often as possible — both because
      every round is one more shot for the edge to act.
    dialogue:
      - part: Five chips, ten needed by tonight
        teach: >
          You have $5$ chips and need $10$ by the end of the night; anything
          short of $10$ is as bad as nothing. Every bet on offer pays even
          money and wins with probability $0.4$. Plan A: one chip at a time.
          Plan B: all $5$ on a single bet.
      - ask: >
          What is the probability that Plan B gets you to $10$?
        expects: "0.4"
        hint: >
          One bet, and it either doubles you or ends the night.
        feedback: >
          A single win: $0.4$. You touch the bad coin exactly once.
      - ask: >
          What is the probability that Plan A gets you to $10$? Give an exact
          fraction.
        expects: "32/275"
        tolerance: 0.0005
        hint: >
          Doubling from $5$ with $r = 1.5$: $1/(1 + 1.5^{5})$, and
          $1.5^{5} = 243/32$.
        feedback: >
          $1/(1 + 243/32) = 32/275 \approx 0.116$. Plan B is more than three
          times as likely to get you there.
      - ask: >
          Each bet in Plan A has the same $0.4$ chance as Plan B's single bet.
          Why is Plan A so much worse?
        choices:
          - text: >
              Plan A risks more money in total.
            feedback: >
              Plan A never has more than one chip on the table, and it can
              never lose more than the $5$ you brought, the same as Plan B.
              The difference is not the money at risk but the number of
              flips.
          - text: >
              Plan A needs many more bets, and every bet is another
              application of the house's edge.
            correct: true
            feedback: >
              Plan A lasts about $19$ rounds on average, and each one tilts
              against you. Plan B needs one.
          - text: >
              Plan B is lucky; on average both plans do the same.
            feedback: >
              On average both plans lose money at the same rate per chip
              staked. But the question is the chance of reaching $10$, and
              there Plan B's $0.4$ beats Plan A's $0.116$ every night.
        feedback: >
          Against a bad coin, the law of large numbers works for the house.
          The fewer rounds, the less of it you get.

      - part: Touching the edge as few times as possible
        reflect: >
          You are behind and the coin is against you. In general, what should
          you try to minimise, and what rule for each stake does that suggest
          when the target is not exactly double your stack?
        hint: >
          Staking more than you need to reach the target buys nothing.
        answer: >
          Minimise the number of times you face the coin. So stake as much as
          you can on each bet, but never more than the amount still needed,
          because a win beyond the target buys nothing while a loss of the
          excess still costs you. That is: stake the smaller of your fortune
          and the amount still needed.
      - teach: >
          That rule is bold play. Against a subfair even-money game it
          maximises the chance of reaching a target: every extra round is
          another application of the house edge, so you beat it by touching it
          as few times as possible.
      - ask: >
          You hold $3$ chips and need $4$, at $p = 0.4$, playing boldly. What
          is your probability of reaching $4$?
        expects: "0.64"
        hint: >
          From $3$ you stake $1$. If that loses you are at $2$, and you stake
          $2$.
        feedback: >
          Win the first bet: $0.4$. Lose it, then win with $2$ on the table:
          $0.6 \times 0.4 = 0.24$. Total $0.64$. One chip at a time from $3$
          to $4$ gives only $38/65 \approx 0.585$.
      - ask: >
          Why not stake all $3$ chips on the first bet instead?
        choices:
          - text: >
              Staking all $3$ is better: one bet is the boldest play there is.
            feedback: >
              One bet succeeds with probability $0.4$; the bold line gives
              $0.64$. Bold means staking the smaller of your fortune and what
              you still need, here $1$, not everything.
          - text: >
              It is just as good, since a win also reaches the target.
            feedback: >
              A win reaches $6$, overshooting by $2$ chips that buy nothing.
              And a loss ends the night, where the $1$-chip stake would have
              left you a second chance with $2$ chips.
          - text: >
              A win would overshoot the target for nothing, and a loss would
              throw away the second chance that a $1$-chip stake keeps.
            correct: true
            feedback: >
              Staking more than you need adds risk without adding value. The
              all-in bet gives $0.4$; bold play gives $0.64$.
        feedback: >
          Bold is not reckless: stake exactly what the target requires, and
          only your whole stack when it is no more than the amount still
          needed.

      - part: When the edge is yours
        ask: >
          Flip the coin: bets win with probability $0.6$. From $5$ to $10$ one
          chip at a time, what is the probability of success? Give an exact
          fraction.
        expects: "243/275"
        tolerance: 0.0005
        hint: >
          Now $r = 2/3$, and $(2/3)^{5} = 32/243$.
        feedback: >
          $1/(1 + 32/243) = 243/275 \approx 0.884$, against $0.6$ for a single
          all-in bet. With the edge on your side, small bets win, because each
          round now tilts towards you.
      - ask: >
          A colleague concludes: "So big bets are safer whenever I am losing
          on average." Where does that overreach?
        choices:
          - text: >
              It does not; bold play is safer in every sense.
            feedback: >
              Bold play maximises the chance of hitting one target before
              ruin, and it ends the night broke $60\%$ of the time from $5$
              chips. If your aim were to keep some chips for tomorrow, a few
              small bets and then stopping would almost always do it.
          - text: >
              It holds only for the objective "reach a target before going
              broke"; under another aim, such as keeping part of the stack,
              staking everything can be the worst choice.
            correct: true
            feedback: >
              Bold play deliberately chooses the widest spread of outcomes:
              all or nothing. That is right when only the target counts, and
              wrong when ending at zero is worse than ending a little down.
          - text: >
              Big bets are never better; Plan A's $0.116$ was a miscalculation.
            feedback: >
              The $0.116$ is right, and against Plan B's $0.4$ it shows bold
              play does win this contest. The overreach is in generalising the
              objective, not the arithmetic.
        feedback: >
          In an interview: "when the game is against me and I need a target,
          I play boldly, staking the smaller of my stack and what I still need,
          to face the edge as few times as possible; with the edge on my side
          I bet small."
