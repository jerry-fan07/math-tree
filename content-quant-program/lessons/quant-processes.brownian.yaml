unit: quant-processes.brownian
opening: >
  Brownian motion is what a random walk becomes once the step size shrinks to
  nothing and the step count grows without bound — the continuum limit that
  turns the walk arsenal from earlier units into calculus-ready objects. This
  unit builds the process from four defining properties, extracts its
  symmetries, martingales, and covariance structure, then spends its second
  half on the questions an interview actually asks: how far does the path
  wander, when does it first hit a level, and what happens once a
  deterministic drift is layered on top. It closes with quadratic variation —
  the single fact that squared increments accumulate to elapsed time rather
  than vanishing — which both explains why the path is nowhere differentiable
  and sets up the stochastic calculus built in the next unit.
lessons:
  - node: quant-processes.brownian.bm
    hook: >
      "Define Brownian motion" opens almost every continuous-time interview
      question, and the tell that separates a memorized label from real
      understanding is knowing which of the four properties is doing the
      actual work and which is a stipulated technical assumption.
    explanation: >
      Think of Brownian motion as what a random walk becomes once you let the
      step size shrink and the step count grow without bound: infinitely many
      infinitesimal, independent nudges accumulating into a continuous path.
      The four defining properties pin that idea down precisely enough to
      compute with. $B_0=0$ fixes the starting point; independent increments
      say tomorrow's move carries no information from yesterday's; stationary
      Gaussian increments say the law of a move depends only on how much time
      elapsed, never on the calendar time or the current level; and
      continuity rules out any process that would otherwise satisfy the first
      three by jumping.

      The Gaussian shape is not an extra assumption bolted onto independence
      and stationarity — it is close to forced. Split $[0,t]$ into $n$ equal
      pieces; $B_t$ is the sum of $n$ independent, identically distributed
      increments, and summing independent normals produces a normal, so
      consistency alone pins the increment law down to Gaussian. What
      independence buys computationally is that variance is additive:
      $\operatorname{Var}(B_t)=\sum_{i=1}^{n}\operatorname{Var}(B_{it/n}-B_{(i-1)t/n})=n\cdot(t/n)=t$,
      exactly, regardless of $n$.

      Continuity is the one property genuinely doing new work — it is not
      implied by the other three, and Wiener had to prove such a process
      exists at all. Take it as given in an interview; everything downstream
      is squeezed out of these four facts and nothing else.
    worked: >
      Let $B_3$ denote the position at time $3$. Then $B_3\sim N(0,3)$, so
      $\Pr(B_3>3)=\Pr(Z>3/\sqrt3)=\Pr(Z>\sqrt3)\approx\Pr(Z>1.732)\approx0.0416$:
      a move of a full three units by time $3$ is already a rare, roughly
      $4\%$ event, since the standard deviation at $t=3$ is only
      $\sqrt3\approx1.73$.
    interview: >
      "Define Brownian motion" and "why is $B_t$ normal, not just symmetric"
      are the standard openers — answer with all four properties in one
      breath, and be ready to say that continuity is the one true assumption
      while the Gaussian shape follows from consistency under
      increment-splitting.
    pitfalls: >
      Treating "independent increments" as merely "uncorrelated increments"
      understates the hypothesis — full independence is what licenses
      splitting into normal sums freely. Writing $B_t\sim N(0,t^2)$ instead of
      $N(0,t)$ — the variance is the elapsed time itself, not its square, so
      the standard deviation is $\sqrt t$, not $t$.
    recap: >
      Brownian motion is the process built from independent, stationary
      $N(0,\Delta t)$ increments started at $0$ with continuous paths — four
      facts, and everything else in this unit is derived from them.
    steps:
      - teach: >
          An interviewer who asks you to define Brownian motion is not asking
          for the label — they want all four defining properties produced in
          order, and they want to know which one is a genuine extra assumption
          rather than a restatement of the others.
      - teach: >
          The four properties: $B_0 = 0$; independent increments; stationary
          Gaussian increments, $B_t - B_s \sim N(0, t-s)$; and continuous
          sample paths with probability $1$. Together they force $B_t \sim
          N(0,t)$.
      - ask: >
          Using $B_t \sim N(0,t)$ directly, what is $\operatorname{Var}(B_5)$?
        expects: "5"
        hint: >
          No formula is needed beyond the definition — read the variance
          straight off $t$.
        feedback: >
          The defining property $B_t \sim N(0,t)$ makes the variance the
          elapsed time itself, no computation beyond reading off $t=5$.
      - teach: >
          Independence buys additivity of variance: splitting $[0,t]$ into $n$
          equal pieces, $\operatorname{Var}(B_t) =
          \sum_{i=1}^{n}\operatorname{Var}(B_{it/n}-B_{(i-1)t/n}) = n\cdot(t/n)
          = t$ exactly, for every $n$ — the Gaussian shape is close to forced
          by this consistency, not a separate assumption.
      - ask: >
          $B_4 \sim N(0,4)$. What is $\Pr(B_4 > 4)$?
        expects: "0.0228"
        tolerance: 0.0005
        hint: >
          Standardize by the standard deviation $\sqrt4=2$, then use
          $\Phi(2)=0.9772$.
        feedback: >
          $\Pr(B_4>4) = \Pr(Z > 4/\sqrt4) = \Pr(Z>2) = 1-\Phi(2) = 1-0.9772 =
          0.0228$: a full four-unit move by time $4$ is already a rare event.
      - teach: >
          The one property genuinely doing new work is continuity — Wiener had
          to prove such a process exists at all. In an interview, take it as
          given and spend your effort on the other three.
      - ask: >
          Which of the four defining properties is not implied by the other
          three and needed its own existence proof?
        choices:
          - text: >
              Independent increments
            feedback: >
              This is one of the three properties that, together with
              consistency under splitting, essentially force the Gaussian shape
              — it does not need a separate existence argument the way
              continuity does.
          - text: >
              Continuous sample paths
            correct: true
            feedback: >
              Continuity is not implied by $B_0=0$ plus independent stationary
              Gaussian increments — a process could satisfy those three and
              still jump. Wiener's theorem is exactly the proof that a
              continuous version exists.
          - text: >
              $B_0 = 0$
            feedback: >
              This is a normalization, not a substantive claim requiring proof
              — it just fixes the starting point.
          - text: >
              Stationary Gaussian increments
            feedback: >
              Given independence and stationarity, consistency under splitting
              an interval into pieces pins the increment law down to Gaussian —
              this is close to forced, not a free extra assumption on the same
              footing as continuity.
        feedback: >
          Continuity is the one true assumption; the Gaussian shape follows
          from consistency under increment-splitting, and $B_0=0$ is mere
          normalization.
      - teach: >
          Everything downstream in this unit — scaling, martingales,
          reflection, hitting times — is squeezed out of exactly these four
          facts and nothing else.

  - node: quant-processes.brownian.walk-limit
    hook: >
      Donsker's invariance principle is the reason every random-walk formula
      you already know reappears with $\sqrt n$ swapped for $\sqrt t$ — the
      interview isn't testing two separate topics, just one applied twice.
    explanation: >
      Fix a time $t$ and look only at the walk's rescaled position there:
      $W_t^{(n)}=S_{\lfloor nt\rfloor}/\sqrt n$ is a sum of about $nt$
      independent $\pm1$ steps divided by $\sqrt n$, which is exactly the
      standardized-sum setup the central limit theorem is built for. Reading
      off the CLT with $nt$ steps in place of $n$ gives $W_t^{(n)}\to N(0,t)$
      — the single-time marginal is nothing beyond a relabeled CLT.

      What Donsker's theorem adds is that this convergence holds
      simultaneously across every time and every joint block of times, not
      just one snapshot. Steps in disjoint time windows are independent by
      construction of the simple symmetric random walk, and independence of
      disjoint blocks survives the rescaling, so the limiting object inherits
      independent increments too — that is what assembles a full Brownian
      path rather than a family of separately-normal snapshots that might
      secretly be correlated with each other.

      Two consequences worth carrying forward: the limit doesn't care about
      the shape of one step, only its mean $0$ and variance $\sigma^2$ — a
      walk with different steps, biased-but-recentered, converges to the
      identical Brownian motion (scaled by $\sigma$) as the $\pm1$ walk. And
      any exact walk formula — reflection, hitting probabilities, maxima —
      survives into the continuum with $\sqrt n$ replaced by $\sqrt t$,
      because it was proved using only the ingredients this convergence
      preserves.
    worked: >
      Take a fair $\pm1$ walk with $n=10000$ steps. The rescaled endpoint
      $W_1^{(n)}=S_{10000}/100$ is approximately standard normal, so
      $\Pr(S_{10000}>150)=\Pr(W_1^{(n)}>1.5)\approx1-\Phi(1.5)\approx0.0668$ —
      a direct CLT computation dressed as a Brownian-motion tail probability,
      since $150/\sqrt{10000}=1.5$.
    interview: >
      "Why does a random walk look like Brownian motion when you zoom out"
      wants Donsker named specifically, not just "CLT" — the interviewer is
      listening for the extra claim that whole paths converge jointly, plus
      the universality over step distributions.
    pitfalls: >
      Quoting only the single-time CLT limit and missing that the theorem's
      real content is convergence of the whole path, including joint behavior
      across times. Forgetting the finite-variance requirement on the step
      law — a step distribution with infinite variance does not converge to
      Brownian motion at all, however it's rescaled.
    recap: >
      Rescale a random walk by $\sqrt n$ in space and $n$ in time and it
      converges to Brownian motion — the CLT applied not to one endpoint but
      to the whole path at once, for any mean-$0$, finite-variance step.
    steps:
      - teach: >
          Every walk formula you already know — reflection, hitting
          probabilities, maxima — reappears later in this unit with $\sqrt n$
          replaced by $\sqrt t$. Donsker's theorem is the single reason why, so
          it pays to know precisely what it claims.
      - teach: >
          Fix a time $t$: $W_t^{(n)} = S_{\lfloor nt\rfloor}/\sqrt n$ sums
          about $nt$ independent $\pm1$ steps and divides by $\sqrt n$ —
          exactly the CLT's standardized-sum setup with $nt$ in place of $n$,
          so $W_t^{(n)} \to N(0,t)$ at that one time.
      - ask: >
          A fair $\pm1$ walk has $n=2500$ steps, so $S_{2500}$ has variance
          $2500$ and standard deviation $50$. Using the CLT, what is
          $\Pr(S_{2500} > 50)$?
        expects: "0.1587"
        tolerance: 0.0005
        hint: >
          Divide the threshold by the standard deviation $50$, then use
          $\Phi(1)=0.8413$.
        feedback: >
          $\Pr(S_{2500}>50) = \Pr(Z > 50/50) = \Pr(Z>1) = 1-\Phi(1) = 1-0.8413
          = 0.1587$ — a direct CLT tail probability, dressed as a walk
          question.
      - teach: >
          What Donsker's theorem adds beyond that single-time CLT is joint
          convergence of the whole path: steps in disjoint time windows are
          independent by construction, and that independence survives
          rescaling, so the limit inherits independent increments across every
          time simultaneously.
      - ask: >
          What does Donsker's invariance principle add beyond the single-time
          central limit theorem?
        choices:
          - text: >
              Nothing — it is just the CLT restated for one endpoint
            feedback: >
              That describes only the single-time marginal, which is indeed a
              relabeled CLT. The theorem's real content is stronger than this.
          - text: >
              Convergence of the whole path jointly, so disjoint time blocks
              stay independent in the limit
            correct: true
            feedback: >
              This is the extra claim: not just one snapshot converging, but
              every joint block of times converging together, which is what
              assembles a genuine Brownian path rather than a family of
              separately-normal but possibly correlated snapshots.
          - text: >
              The walk must take exactly $\pm1$ steps for the limit to hold
            feedback: >
              The limit is universal over any mean-$0$, finite-variance step
              law — the $\pm1$ walk is only the simplest instance.
          - text: >
              The steps must be positively correlated for convergence
            feedback: >
              The construction requires independent steps; correlated steps are
              outside the theorem's hypotheses entirely.
        feedback: >
          The theorem's content is joint convergence of the whole path, built
          from independence of disjoint step-blocks surviving the rescaling.
      - teach: >
          The limit does not depend on the shape of one step, only on mean $0$
          and finite variance $\sigma^2$ — a different, recentered step law
          converges to the same Brownian motion, scaled by $\sigma$.
      - ask: >
          A walk's steps have mean $0$ and variance $\sigma^2 = 4$ (not the
          $\pm1$ case). The limit is $\sigma B$ for a standard Brownian motion
          $B$. What is $\operatorname{Var}(\sigma B_1)$?
        expects: "4"
        hint: >
          Use $\operatorname{Var}(B_1)=1$ for standard Brownian motion and
          scale by $\sigma^2$.
        feedback: >
          $\operatorname{Var}(\sigma B_1) = \sigma^2\operatorname{Var}(B_1) =
          \sigma^2 \cdot 1 = 4$ — the limiting variance at time $1$ is exactly
          the step variance, regardless of the walk's step shape.
      - teach: >
          A step distribution with infinite variance breaks the whole
          construction — no rescaling recovers Brownian motion in that case,
          which is why the finite-variance hypothesis is load-bearing, not
          boilerplate.

  - node: quant-processes.brownian.scaling
    hook: >
      "If I stretch the time axis, how does Brownian motion's spread change"
      is the standing question behind every horizon-conversion problem, and
      the honest answer is a square root, not a linear factor.
    explanation: >
      Rescale time by a factor $c$ and rescale space by $\sqrt c$ at the same
      time, and nothing about the process changes: $\tilde B_t=c^{-1/2}B_{ct}$
      is again a standard Brownian motion. The only fact that needs checking
      is the variance, and it collapses to one line:
      $\operatorname{Var}(c^{-1/2}B_{ct})=c^{-1}\cdot\operatorname{Var}(B_{ct})=c^{-1}\cdot ct=t$
      — independence and stationarity of the increments carry over
      automatically under any linear rescaling, so variance matching is the
      entire content of the claim.

      Three companion symmetries fall out of the same four defining
      properties: flipping the sign ($-B_t$), sliding the origin to any fixed
      time ($B_{t_0+t}-B_{t_0}$), and even inverting time ($tB_{1/t}$, patched
      to $0$ at $t=0$) each again satisfy independent stationary Gaussian
      increments started at $0$ with continuous paths, so each is again a
      standard Brownian motion.

      The practical payoff is the $\sqrt t$ law for typical displacement:
      since $\mathbb{E}|B_t|=\sqrt{2t/\pi}$, going from $t$ to $4t$ only
      doubles the expected spread, not quadruples it. A plot of the path over
      $[0,1]$ and a plot over $[0,100]$ are statistically the same picture
      with the axis labels rescaled — there's no characteristic timescale at
      which the path suddenly looks different.
    worked: >
      Compare a $9$-year horizon to a $1$-year horizon: $\mathbb{E}|B_1|=
      \sqrt{2/\pi}\approx0.798$ and $\mathbb{E}|B_9|=\sqrt{18/\pi}\approx2.395$
      — exactly a factor of $3=\sqrt9$ apart, not $9$. Distance traveled
      triples, not nine-folds, over nine times the time.
    interview: >
      "If volatility over one day is $x$, what's volatility over four days"
      is this proposition disguised as a finance question — the expected
      answer is a factor of $\sqrt4=2$, and a sharp interviewer will ask you
      to justify it from independence of increments rather than just cite the
      rule.
    pitfalls: >
      Assuming displacement scales linearly with elapsed time — a natural but
      wrong instinct carried over from deterministic motion. Rescaling time
      without simultaneously rescaling space by $\sqrt c$ breaks the
      identity; the two rescalings only cancel together.
    recap: >
      Shrink time by $c$ and space by $\sqrt c$ together and Brownian motion
      is unchanged in law, which is exactly why displacement grows like
      $\sqrt t$ rather than $t$.
    steps:
      - teach: >
          If you stretch the time axis by a factor $c$, the honest answer for
          how much the spread changes is a square root, not the factor $c$
          itself — this proposition is the standing justification for every
          horizon-conversion argument later in this unit.
      - teach: >
          Rescale time by $c$ and space by $\sqrt c$ together: $\tilde B_t =
          c^{-1/2}B_{ct}$ is again a standard Brownian motion. The only fact
          needing a check is the variance, since independence and stationarity
          of the increments carry over automatically under any linear
          rescaling.
      - ask: >
          For $c=9$ and $t=5$, what is $\operatorname{Var}(c^{-1/2}B_{ct})$?
        expects: "5"
        hint: >
          Apply $\operatorname{Var}(c^{-1/2}B_{ct})=c^{-1}\cdot ct$ and watch
          the $c$ cancel.
        feedback: >
          $\operatorname{Var}(c^{-1/2}B_{ct}) = c^{-1}\cdot ct = t$:
          $(1/9)\cdot(9\times5) = 5$, and the $c$ cancels for every choice of
          $c$, which is exactly the self-similarity claim.
      - teach: >
          Three companion symmetries fall out of the same four defining
          properties: sign flip ($-B_t$), sliding the origin to a fixed time
          ($B_{t_0+t}-B_{t_0}$), and time inversion ($tB_{1/t}$, set to $0$ at
          $t=0$) — each again satisfies independent stationary Gaussian
          increments started at $0$.
      - ask: >
          Which of these is *not* one of Brownian motion's symmetries — that
          is, applying it does not produce another standard Brownian motion?
        choices:
          - text: >
              $-B_t$
            feedback: >
              Reflection in the axis is a genuine symmetry: it again has
              independent stationary $N(0,t-s)$ increments started at $0$.
          - text: >
              $2B_t$
            correct: true
            feedback: >
              Doubling breaks it: $\operatorname{Var}(2B_t) = 4t \ne t$, so
              $2B_t$ is not a standard Brownian motion. Self-similarity needs
              space and time rescaled *together*, by $\sqrt c$ and $c$
              respectively, not space alone.
          - text: >
              $B_{t_0+t} - B_{t_0}$ for a fixed $t_0$
            feedback: >
              Sliding the origin to any fixed time is a genuine symmetry,
              immediate from stationary independent increments.
          - text: >
              $tB_{1/t}$, set to $0$ at $t=0$
            feedback: >
              Time inversion is a genuine symmetry — a less obvious one, but it
              again satisfies all four defining properties.
        feedback: >
          The symmetries always rescale space and time together by matched
          factors $\sqrt c$ and $c$; rescaling space alone breaks the variance
          identity.
      - teach: >
          The practical payoff is the $\sqrt t$ law: since $\mathbb{E}|B_t| =
          \sqrt{2t/\pi}$, quadrupling the horizon only doubles the expected
          spread — there is no characteristic timescale at which the path
          suddenly looks different.
      - ask: >
          Going from a $1$-year horizon to a $16$-year horizon, by what
          multiple does $\mathbb{E}|B_t|$ grow?
        expects: "4"
        hint: >
          The ratio of $\mathbb{E}|B_t|$ across two horizons is the square root
          of the ratio of the horizons themselves.
        feedback: >
          $\mathbb{E}|B_t| = \sqrt{2t/\pi}$ scales with $\sqrt t$, so the ratio
          is $\sqrt{16/1} = 4$ — distance traveled quadruples in ratio only
          because the horizon grew by a factor of $16$, not $4$.
      - teach: >
          Rescaling time without rescaling space by the matching $\sqrt c$
          breaks the identity — the two rescalings only cancel when applied
          together, which is the trap the choice question above was built to
          catch.

  - node: quant-processes.brownian.covariance
    hook: >
      "What's the correlation between the process at two different times" is
      a standard opener, and the clean answer, $\sqrt{s/t}$, only falls out
      once you stop assuming $B_s$ and $B_t$ are independent just because
      increments are.
    explanation: >
      $B_s$ and $B_t$ are not independent even though increments are — $B_t$
      literally contains $B_s$ as a summand. Write $B_t=B_s+(B_t-B_s)$: the
      two pieces are independent by definition, so
      $\operatorname{Cov}(B_s,B_t)=\operatorname{Cov}(B_s,B_s)+\operatorname{Cov}(B_s,B_t-B_s)=\operatorname{Var}(B_s)+0=s$,
      for $s\le t$. Swapping the roles for the general case gives
      $\operatorname{Cov}(B_s,B_t)=\min(s,t)$ — covariance is exactly the
      shared elapsed time, the part of the path both values have lived
      through together.

      Dividing by the standard deviations gives
      $\operatorname{Corr}(B_s,B_t)=\sqrt{s/t}$ for $s\le t$: two
      nearby-in-time values are highly correlated, but correlation decays
      only like a square root, not proportionally, as the gap widens.

      Because every finite collection $(B_{t_1},\dots,B_{t_n})$ is a linear
      combination of the same underlying independent normal increments, it is
      automatically jointly Gaussian — so "mean-zero Gaussian process with
      covariance $\min(s,t)$ and continuous paths" is a complete, equivalent
      definition of Brownian motion. Joint Gaussianity makes conditioning
      linear: given $B_T=x$, the earlier value $B_t$ ($t<T$) is normal with
      mean $(t/T)x$ and variance $t(T-t)/T$ — largest uncertainty at the
      midpoint, shrinking to $0$ at both ends where the value is pinned. That
      conditioned path is the Brownian bridge.
    worked: >
      Suppose $B_{16}=8$ is observed. The value at $t=4$ is normal with mean
      $(4/16)\times8=2$ and variance $4\times12/16=3$, so a $95\%$ band for
      $B_4$ is roughly $2\pm1.96\sqrt3\approx2\pm3.39$, i.e. about
      $(-1.39,5.39)$ — noticeably tighter than the unconditional $N(0,4)$ law
      of $B_4$ alone, because knowing the endpoint constrains the path in
      between.
    interview: >
      "What's $\operatorname{Cov}(B_s,B_t)$" and "given the value at time
      $10$, what's the distribution at time $3$" are both standard — answer
      $\min(s,t)$ instantly and the bridge mean/variance formula on request,
      without re-deriving from scratch.
    pitfalls: >
      Assuming $B_s$ and $B_t$ are independent because increments are
      independent — they overlap in the interval $[0,\min(s,t)]$ and share
      exactly that much covariance. Reversing $s$ and $t$ inside $\min$ or
      plugging the larger time into the shared role gives a covariance
      exceeding either variance, which is impossible.
    recap: >
      $\operatorname{Cov}(B_s,B_t)=\min(s,t)$ because the two values share
      exactly the path up to the earlier time, and conditioning on a later
      value is linear with variance shrinking to $0$ at the pinned endpoints.
    steps:
      - teach: >
          $B_s$ and $B_t$ are *not* independent even though increments are —
          $B_t$ literally contains $B_s$ as a summand, and untangling exactly
          how much they share is what this node answers.
      - teach: >
          Write $B_t = B_s + (B_t - B_s)$ for $s \le t$: the two pieces are
          independent by definition, so $\operatorname{Cov}(B_s,B_t) =
          \operatorname{Var}(B_s) = s$. In general,
          $\operatorname{Cov}(B_s,B_t) = \min(s,t)$ — the shared elapsed time
          is the entire covariance.
      - ask: >
          What is $\operatorname{Cov}(B_3, B_7)$?
        expects: "3"
        hint: >
          Covariance is exactly the shared elapsed time — the smaller of the
          two.
        feedback: >
          $\operatorname{Cov}(B_3,B_7) = \min(3,7) = 3$ — the smaller time is
          the entire answer, no other computation needed.
      - teach: >
          Dividing by standard deviations gives $\operatorname{Corr}(B_s,B_t) =
          \sqrt{s/t}$ for $s \le t$: nearby times are highly correlated, but
          correlation decays only like a square root as the gap widens, not
          proportionally.
      - ask: >
          What is $\operatorname{Corr}(B_4, B_{16})$?
        expects: "0.5"
        hint: >
          Use $\sqrt{s/t}$ with the smaller time on top.
        feedback: >
          $\operatorname{Corr}(B_4,B_{16}) = \sqrt{4/16} = \sqrt{0.25} = 0.5$ —
          the smaller time over the larger, then a square root.
      - teach: >
          Because every finite collection of $B_{t_i}$'s is a linear image of
          the same independent normal increments, it is jointly Gaussian —
          which makes conditioning linear: given $B_T = x$, the earlier value
          $B_t$ ($t<T$) is normal with mean $(t/T)x$ and variance $t(T-t)/T$,
          largest at the midpoint.
      - ask: >
          Suppose $B_{10} = 5$ is observed. What is the mean of $B_4$ given
          this?
        expects: "2"
        hint: >
          Apply the bridge mean formula $(t/T)x$ with $t=4$, $T=10$, $x=5$.
        feedback: >
          The bridge mean is $(t/T)x = (4/10)\times5 = 2$ — a linear
          interpolation toward $0$ at time $0$, weighted by how far along the
          path is.
      - teach: >
          The common slip is reversing $s$ and $t$ inside $\min$, or plugging
          the larger time into the shared role — either mistake produces a
          covariance exceeding one of the variances, which is impossible.

  - node: quant-processes.brownian.markov-property
    hook: >
      "Why can you treat the path as starting over the moment it first hits a
      barrier" is the question every reflection-style argument depends on
      answering correctly, and the honest answer needs the strong Markov
      property, not just the ordinary one.
    explanation: >
      The ordinary Markov property is nothing new: fix a deterministic time
      $s$ and look at $W_t=B_{s+t}-B_s$. This is precisely one increment of
      the base process, so by the defining independent stationary increments
      it is itself a standard Brownian motion, independent of everything that
      happened up to time $s$. No extra argument is needed — the property is
      baked into the four defining facts.

      The strong Markov property is the real upgrade: it replaces the fixed
      time $s$ with a random one, a stopping time $\tau$ — a random time
      whose occurrence by any given moment is decidable from the path up to
      that moment alone, with no lookahead. Provided $\tau$ is almost surely
      finite, $W_t=B_{\tau+t}-B_\tau$ is again a standard Brownian motion,
      independent of the path up to $\tau$. This does not follow for free
      from the ordinary property, because $\tau$ itself is random and could
      in principle depend on the future — the theorem's content is precisely
      that stopping times don't let that happen.

      The mental model: whatever the path is doing — hitting a level for the
      first time, setting a fresh record — the instant that event happens,
      the process has no memory of how it got there and restarts as a fresh
      Brownian motion. Every argument that resets the clock at a hitting
      time, most importantly the reflection principle, is an application of
      exactly this fact.
    worked: >
      Suppose $B_5=2$. By the ordinary Markov property, $W_t=B_{5+t}-2$ is a
      fresh Brownian motion, so
      $\Pr(B_8>6\mid B_5=2)=\Pr(W_3>4)=1-\Phi(4/\sqrt3)=1-\Phi(2.31)\approx0.0104$
      — a routine conditional tail probability computed by shifting the
      origin to the known value and treating the remaining $3$ time units as
      an ordinary Brownian increment.
    interview: >
      "State the strong Markov property and say why the reflection principle
      needs it" checks that you can name a stopping time correctly (first
      hitting time, yes; time of the eventual maximum, no) and that you know
      the restarted process is independent of the entire past path, not
      merely of the value $B_\tau$.
    pitfalls: >
      Applying the strong Markov property at a time that is not a stopping
      time — "the time the maximum occurs" requires knowledge of the whole
      future path and voids the argument. Concluding independence only from
      $B_\tau$ rather than from the full history $\mathcal F_\tau$ misses
      what the theorem actually grants.
    recap: >
      At any stopping time, not just a fixed time, the future increment of
      Brownian motion is again a standard Brownian motion independent of
      everything before — the license behind every "restart the clock"
      argument.
    steps:
      - teach: >
          Every argument in this unit that restarts the clock the instant the
          path does something — hits a level, sets a record — depends on the
          *strong* Markov property, not the ordinary one, so it is worth
          separating the two precisely.
      - teach: >
          The ordinary Markov property is nothing new: fix a deterministic time
          $s$, and $W_t = B_{s+t} - B_s$ is exactly one increment of the base
          process, hence itself a standard Brownian motion independent of
          everything up to $s$ — baked into the four defining facts.
      - ask: >
          Suppose $B_1 = 2$. Using $W_t = B_{1+t}-2$ as a fresh Brownian
          motion, what is $\Pr(B_5 > 4 \mid B_1 = 2)$?
        expects: "0.1587"
        tolerance: 0.0005
        hint: >
          Shift by the known value, standardize by $\sqrt4=2$, and use
          $\Phi(1)=0.8413$.
        feedback: >
          $\Pr(B_5>4\mid B_1=2) = \Pr(W_4 > 2) = \Pr(Z > 2/\sqrt4) = 1-\Phi(1)
          = 1-0.8413 = 0.1587$: shift the origin to the known value, then treat
          the remaining $4$ time units as an ordinary increment.
      - teach: >
          The strong Markov property replaces the fixed time $s$ with a
          stopping time $\tau$ — decidable from the path up to that moment
          alone, no lookahead. Provided $\tau$ is almost surely finite, $W_t =
          B_{\tau+t}-B_\tau$ is again a standard Brownian motion independent of
          the path up to $\tau$.
      - ask: >
          Which of these is a valid stopping time to apply the strong Markov
          property to?
        choices:
          - text: >
              The first time $B_t$ reaches level $5$
            correct: true
            feedback: >
              This is decidable using only the path up to that moment — the
              defining feature of a stopping time.
          - text: >
              The time at which the maximum of $B$ over $[0,10]$ is attained
            feedback: >
              Deciding this requires knowing the whole future path up to time
              $10$ — it is not decidable from the past alone, so it is not a
              stopping time.
          - text: >
              The last time before $10$ that $B_t = 0$
            feedback: >
              Confirming a crossing is the *last* one before time $10$ requires
              looking forward to check none occur after — not decidable from
              the past alone.
          - text: >
              $10$ minus the first hitting time of level $5$
            feedback: >
              This runs the clock backward from a fixed future time, which
              again needs information not available at the moment in question.
        feedback: >
          A stopping time must be decidable from the path up to that instant
          alone; the first hitting time qualifies, while anything defined using
          the future or working backward from a fixed endpoint does not.
      - teach: >
          The theorem grants independence of the entire past history $\mathcal
          F_\tau$, not merely of the value $B_\tau$ — a subtle but load-bearing
          distinction, since it is what licenses treating the whole pre-$\tau$
          path as irrelevant going forward.
      - ask: >
          Let $\tau$ be the first hitting time of level $-2$ (almost surely
          finite). By the strong Markov property, $W_t = B_{\tau+t}-(-2)$ is a
          fresh Brownian motion. What is $\Pr(W_1 > 0.5)$?
        expects: "0.3085"
        tolerance: 0.0005
        hint: >
          Standardize directly since $W_1$ has variance $1$, then use
          $\Phi(0.5)=0.6915$.
        feedback: >
          $\Pr(W_1>0.5) = \Pr(Z>0.5) = 1-\Phi(0.5) = 1-0.6915 = 0.3085$ — an
          ordinary tail probability on the restarted process, exactly as if the
          path were beginning again from $0$.

  - node: quant-processes.brownian.martingale-property
    hook: >
      These three formulas are the entire toolkit for "find this hitting
      probability" or "find this expected exit time" questions without ever
      writing down a differential equation — memorize which one answers which
      question.
    explanation: >
      $B_t$ itself is a martingale for the trivial reason that future
      increments have mean zero: $\mathbb{E}[B_t\mid\mathcal F_s]=B_s+
      \mathbb{E}[B_t-B_s\mid\mathcal F_s]=B_s+0$, using independence of the
      increment from the past. This is the tool for probability questions —
      a bounded stopped version of $B_t$ conserves its expected value
      exactly, which is what pins down hitting probabilities at two barriers.

      $B_t^2-t$ compensates the natural growth of a squared
      martingale-increment process. Expanding $B_t=B_s+(B_t-B_s)$ and using
      that the increment is independent of the past with mean $0$ and
      variance $t-s$ gives $\mathbb{E}[B_t^2\mid\mathcal F_s]=B_s^2+(t-s)$, so
      subtracting $t$ exactly cancels the growth:
      $\mathbb{E}[B_t^2-t\mid\mathcal F_s]=B_s^2-s$. This is the tool for time
      questions — it converts expected exit time into an algebraic identity.

      The exponential martingale $\exp(\lambda B_t-\lambda^2t/2)$ compensates
      growth of a different kind: it is just the normal moment generating
      function $\mathbb{E}[e^{\lambda(B_t-B_s)}]=e^{\lambda^2(t-s)/2}$
      rearranged so the compensation is folded directly into the process. It
      holds for every real $\lambda$, which is what makes it flexible enough
      to handle drift later — choosing $\lambda$ to cancel a drift term is
      the standard trick for hitting problems on a process that isn't
      driftless.
    worked: >
      Check the second martingale numerically: with $s=4,t=9$ and $B_4=2$,
      the claim is $\mathbb{E}[B_9^2-9\mid B_4=2]=2^2-4=0$. Indeed
      $\mathbb{E}[B_9^2\mid B_4=2]=B_4^2+(9-4)=4+5=9$, so
      $\mathbb{E}[B_9^2-9\mid B_4=2]=9-9=0$ exactly, confirming the
      compensation.
    interview: >
      "Name the martingales you get from Brownian motion" is asked directly,
      or folded into "how would you find the expected time to hit a barrier"
      — a strong answer names all three unprompted and states which one
      answers a probability question versus a time question.
    pitfalls: >
      Treating $B_t^2$ alone as a martingale — it isn't; it is a
      submartingale, growing in expectation, and the $-t$ compensation is not
      optional. Dropping the $-\lambda^2t/2$ term from the exponential
      martingale, or getting its sign wrong, breaks the entire construction.
    recap: >
      $B_t$, $B_t^2-t$, and $\exp(\lambda B_t-\lambda^2t/2)$ are martingales
      for every real $\lambda$ — the first answers probability questions, the
      second answers expected-time questions, and the third generalizes both
      once drift is involved.
    steps:
      - teach: >
          These three formulas are the whole toolkit for answering exit
          probability and exit time questions without ever writing a
          differential equation — the trick is knowing which one answers which
          question.
      - teach: >
          $B_t$ itself is a martingale for the trivial reason that future
          increments have mean $0$: $\mathbb{E}[B_t\mid\mathcal
          F_s]=B_s+\mathbb{E}[B_t-B_s]=B_s$. This is the probability-question
          tool — a bounded stopped version conserves its expected value
          exactly.
      - ask: >
          Using the martingale property of $B_t$, what is $\mathbb{E}[B_9 \mid
          B_4 = 3]$?
        expects: "3"
        hint: >
          A martingale's future expectation equals its present value.
        feedback: >
          By the martingale property, $\mathbb{E}[B_t\mid\mathcal F_s]=B_s$, so
          $\mathbb{E}[B_9\mid B_4=3]=3$ directly — no further computation
          needed.
      - teach: >
          $B_t^2-t$ compensates the natural growth of a squared process:
          expanding $B_t=B_s+(B_t-B_s)$ with the increment independent, mean
          $0$, variance $t-s$, gives $\mathbb{E}[B_t^2\mid\mathcal
          F_s]=B_s^2+(t-s)$, so subtracting $t$ exactly cancels the growth —
          the time-question tool.
      - ask: >
          With $s=3$, $t=8$, and $B_3=1$, what is $\mathbb{E}[B_8^2 - 8 \mid
          B_3 = 1]$?
        expects: "-2"
        hint: >
          Either compute $\mathbb{E}[B_8^2\mid B_3=1]$ then subtract $8$, or
          apply the martingale property to $B_3^2-3$ directly.
        feedback: >
          $\mathbb{E}[B_8^2\mid B_3=1]=B_3^2+(8-3)=1+5=6$, so
          $\mathbb{E}[B_8^2-8\mid B_3=1]=6-8=-2$ — matching $B_3^2-3=1-3=-2$
          directly from the martingale property, confirming the compensation.
      - teach: >
          The exponential martingale $\exp(\lambda B_t - \lambda^2t/2)$ is the
          normal moment generating function rearranged, and it holds for
          *every* real $\lambda$ — that flexibility is exactly what makes it
          the tool for handling drift later, by choosing $\lambda$ to cancel
          it.
      - ask: >
          Which of these is a genuine Brownian martingale?
        choices:
          - text: >
              $B_t^2$
            feedback: >
              This is a submartingale, not a martingale — it grows in
              expectation, and the $-t$ compensation is not optional.
          - text: >
              $B_t^2 - t$
            correct: true
            feedback: >
              The $-t$ compensation exactly cancels the growth from expanding
              the square, leaving a genuine martingale.
          - text: >
              $B_t^3$
            feedback: >
              Expanding $(B_s+X)^3$ with $X=B_t-B_s$ leaves a leftover term
              $3B_s(t-s)$ that does not cancel — this is not a martingale.
          - text: >
              $\exp(B_t)$ with no $-\lambda^2t/2$ correction
            feedback: >
              Dropping the compensating term leaves a process that grows in
              expectation — the correction is exactly what makes the
              exponential version fair.
        feedback: >
          Only the compensated square is a martingale here — the raw square and
          the raw cube both fail without the exact compensating term.
      - teach: >
          Between the three, the first two are usually enough: $B_t$ pins down
          exit probabilities, and $B_t^2-t$ pins down expected exit times, both
          by optional stopping on a bounded stopped process.

  - node: quant-processes.brownian.quadratic-variation
    hook: >
      "$(dB)^2=dt$" is the one line that explains why stochastic calculus
      needs its own chain rule — the single place where ordinary calculus's
      intuition, that $dx^2$ is negligible, fails outright for Brownian
      paths.
    explanation: >
      Partition $[0,t]$ finely and sum the squared increments,
      $\sum_i(B_{t_i}-B_{t_{i-1}})^2$. Each squared increment has mean
      $\Delta_i=t_i-t_{i-1}$ exactly — by the $\sqrt t$ scaling of Brownian
      motion, $\operatorname{Var}(B_{t_i}-B_{t_{i-1}})=\Delta_i$ — so the
      sum's mean is $\sum_i\Delta_i=t$ for every partition, with no limit
      needed yet.

      What needs the limit is the variance shrinking to zero. A standard
      normal has $\operatorname{Var}(Z^2)=2$, so the $i$-th squared increment
      has variance $2\Delta_i^2$; summing across independent pieces gives
      total variance $2\sum_i\Delta_i^2\le2t\max_i\Delta_i$, which vanishes as
      the mesh $\max_i\Delta_i\to0$. Mean exactly $t$, variance shrinking to
      $0$: the sum converges to $t$ itself, deterministically, written
      $\langle B\rangle_t=t$.

      Contrast this with any continuously differentiable path, whose
      quadratic variation is always $0$ — squared increments there really are
      negligible in the limit, exactly the intuition ordinary calculus relies
      on. Brownian increments are order $\sqrt{\Delta_i}$, not
      $O(\Delta_i)$, so their squares are order $\Delta_i$ — the same order
      as $dt$ itself, not smaller. That order-of-magnitude mismatch is why a
      naive Riemann-sum treatment of integrals against $B$ fails, and it is
      the second-order term that survives in Itô's lemma.
    worked: >
      Partition $[0,1]$ into $n=100$ equal pieces, $\Delta_i=0.01$. The sum of
      squared increments has mean exactly $\sum_i0.01=1$ for every $n$, but
      its variance is $2\times100\times0.01^2=0.02$ at $n=100$; at $n=10000$
      the same computation gives variance $2\times10000\times0.0001^2=0.0002$
      — shrinking by a factor of $100$ as the mesh shrinks by $100$,
      confirming the sum concentrates tightly around $1=t$.
    interview: >
      "Why is $(dB)^2=dt$ and not $0$" wants the two-line argument: the mean
      of the squared-increment sum is exactly $t$ for any partition, and its
      variance vanishes as the mesh shrinks — say both, not just the informal
      notation.
    pitfalls: >
      Carrying over the ordinary-calculus habit of treating squared
      increments as negligible — here they accumulate to a nonzero,
      deterministic limit. Thinking of quadratic variation as a random
      quantity that merely tends to be near $t$; it converges in $L^2$ to the
      fixed number $t$, not to a random variable.
    recap: >
      Summed squared increments of Brownian motion converge to the elapsed
      time $t$ itself, not to $0$ — the fact that makes stochastic calculus
      genuinely different from ordinary calculus.
    steps:
      - teach: >
          $(dB)^2 = dt$ is the single line explaining why stochastic calculus
          needs its own chain rule — the one place where ordinary calculus's
          intuition that squared increments are negligible fails outright.
      - teach: >
          Partition $[0,t]$ and sum the squared increments,
          $\sum_i(B_{t_i}-B_{t_{i-1}})^2$. Each term has mean exactly
          $\Delta_i=t_i-t_{i-1}$, since
          $\operatorname{Var}(B_{t_i}-B_{t_{i-1}})=\Delta_i$ — so the sum's
          mean is $\sum_i\Delta_i=t$ for *every* partition, no limit needed
          yet.
      - ask: >
          Partition $[0,6]$ any way you like into finitely many pieces. What is
          the exact mean of the sum of squared increments?
        expects: "6"
        hint: >
          The mean of each squared increment is that increment's own width —
          sum the widths.
        feedback: >
          The mean is $\sum_i\Delta_i=t=6$ for every partition, since each
          squared increment has mean equal to its own $\Delta_i$ — the total
          telescopes to the elapsed time regardless of how finely it is cut.
      - teach: >
          What needs the limit is the variance vanishing: a standard normal has
          $\operatorname{Var}(Z^2)=2$, so the $i$-th term has variance
          $2\Delta_i^2$, and summing across independent pieces gives total
          variance $2\sum_i\Delta_i^2 \le 2t\max_i\Delta_i \to 0$ as the mesh
          shrinks.
      - ask: >
          Partition $[0,1]$ into $n=50$ equal pieces, so $\Delta_i=0.02$ for
          each. What is the variance of the sum of squared increments?
        expects: "0.04"
        hint: >
          Use $2n\Delta_i^2$ with $n=50$ and $\Delta_i=0.02$.
        feedback: >
          The variance is $2\sum_i\Delta_i^2 = 2\times50\times0.02^2 =
          2\times50\times0.0004 = 0.04$ — small already at $n=50$, and it
          shrinks further as $n$ grows.
      - teach: >
          Mean exactly $t$, variance shrinking to $0$: the sum converges to $t$
          itself, deterministically. A continuously differentiable path has
          quadratic variation $0$ instead — the non-classical feature that
          makes Brownian paths behave differently.
      - ask: >
          As the partition mesh shrinks toward $0$, what happens to the sum of
          squared increments of a continuously differentiable path over
          $[0,t]$?
        choices:
          - text: >
              It converges to $t$, the same as for Brownian motion
            feedback: >
              That is exactly the Brownian result — a smooth path behaves quite
              differently.
          - text: >
              It converges to $0$
            correct: true
            feedback: >
              Increments of a differentiable path are $O(\Delta_i)$, not
              $O(\sqrt{\Delta_i})$, so their squares are $O(\Delta_i^2)$ and
              the sum vanishes — the classical picture that Brownian motion
              violates.
          - text: >
              It diverges to infinity
            feedback: >
              A smooth path's squared increments shrink too fast for the sum to
              blow up.
          - text: >
              It oscillates without converging at all
            feedback: >
              The sum converges cleanly to $0$ for a smooth path — there is no
              oscillation.
        feedback: >
          Ordinary calculus's intuition — squared increments vanish — is
          exactly true for smooth paths, which is precisely why Brownian
          motion, where it fails, needs its own calculus.

  - node: quant-processes.brownian.nondifferentiability
    hook: >
      "Is Brownian motion differentiable" is a fast disqualifying question,
      and the reason it fails is exactly the reason a P&L path can't be
      treated with an ordinary instantaneous rate of change.
    explanation: >
      Over a window of length $h$, a Brownian increment is of typical size
      $\sqrt h$, so the difference quotient $(B_{t+h}-B_t)/h$ is of order
      $\sqrt h/h=h^{-1/2}$ — this blows up, rather than settling down, as
      $h\to0$. That heuristic is not just suggestive; it is a theorem: with
      probability $1$, the path is differentiable at no time at all, and it
      has infinite total variation on every interval, however short.

      The variation claim follows from quadratic variation directly. For any
      partition, $\sum_i(\Delta B_i)^2\le\left(\max_i|\Delta
      B_i|\right)\sum_i|\Delta B_i|$, and continuity sends $\max_i|\Delta
      B_i|\to0$ as the mesh shrinks. If the total variation $\sum_i|\Delta
      B_i|$ stayed bounded, the right side would vanish — forcing quadratic
      variation to $0$, which contradicts it converging to $t$. So total
      variation cannot be bounded; it is infinite on every interval.

      Quantifying the wiggle: paths are Hölder continuous of every order
      $\alpha<1/2$ but of no order $\alpha\ge1/2$ — the exact borderline set
      by the $\sqrt h$ increment size. Since ordinary integration theory
      needs the integrator to have finite variation, $\int f\,dB$ simply
      cannot be built path by path that way; this is precisely why stochastic
      integration needs its own construction.
    interview: >
      "Is Brownian motion differentiable, and can you sketch why" wants the
      $\sqrt h/h\to\infty$ heuristic produced immediately, followed by naming
      infinite total variation as the rigorous consequence — not just "no,
      it's too jagged."
    pitfalls: >
      Assuming continuity implies differentiability somewhere — false here;
      the failure is simultaneous at every single time, not merely at
      isolated points. Assuming a continuous, bounded path automatically has
      finite variation on a compact interval — that implication needs more
      than continuity, and Brownian motion is the standing counterexample.
    recap: >
      Increments of size $\sqrt h$ over windows of length $h$ send every
      difference quotient to infinity, so the path is nowhere differentiable
      and has infinite variation on every interval — the reason stochastic
      integration can't be built path by path.
    steps:
      - teach: >
          "Is Brownian motion differentiable" is a fast disqualifying question,
          and the reason it fails is exactly the reason a P&L path can't be
          treated with an ordinary instantaneous rate of change.
      - teach: >
          Over a window of length $h$, a Brownian increment is of typical size
          $\sqrt h$, so the difference quotient $(B_{t+h}-B_t)/h$ is of order
          $\sqrt h/h = h^{-1/2}$ — this blows up, rather than settling down, as
          $h \to 0$.
      - ask: >
          For $h = 0.0001$, what is $h^{-1/2}$?
        expects: "100"
        hint: >
          Take the square root of $h$ first, then invert.
        feedback: >
          $h^{-1/2} = 1/\sqrt{0.0001} = 1/0.01 = 100$ — already large at a
          fairly ordinary window width, and it grows without bound as $h$
          shrinks further.
      - teach: >
          The variation claim follows from quadratic variation directly:
          $\sum_i(\Delta B_i)^2 \le (\max_i|\Delta B_i|)\sum_i|\Delta B_i|$,
          and continuity sends the first factor to $0$. If total variation
          stayed bounded, the right side would vanish, forcing quadratic
          variation to $0$ — contradicting it converging to $t$.
      - ask: >
          Why must Brownian motion have infinite total variation on every
          interval?
        choices:
          - text: >
              Because bounded total variation would force quadratic variation
              to $0$, contradicting quadratic variation converging to $t$
            correct: true
            feedback: >
              This is the exact contradiction the proof runs: bounded variation
              plus continuity would force the quadratic variation limit to
              vanish, but it is known to equal $t$.
          - text: >
              Because the path is continuous
            feedback: >
              Continuity alone does not force infinite variation — plenty of
              continuous paths have finite variation. The actual argument needs
              the quadratic variation fact too.
          - text: >
              Because the path is unbounded as $t \to \infty$
            feedback: >
              The claim holds on every bounded interval already, where the path
              is almost surely bounded — unboundedness over long horizons is
              unrelated to this argument.
          - text: >
              Because Brownian increments are Gaussian
            feedback: >
              Being Gaussian by itself does not imply infinite variation — it
              is the specific $\sqrt{\Delta_i}$ increment scale driving the
              quadratic-variation argument that does.
        feedback: >
          Bounded variation is incompatible with quadratic variation converging
          to $t$ rather than $0$ — that contradiction is the whole proof.
      - teach: >
          Continuity does not imply differentiability somewhere here — the
          failure is simultaneous at *every* time, not confined to isolated
          points, which is a stronger and stranger fact than ordinary calculus
          prepares you for.
      - ask: >
          Brownian paths are Hölder continuous of every order $\alpha < 1/2$
          but of no order $\alpha \ge 1/2$. What is that exact boundary value
          of $\alpha$?
        expects: "0.5"
        hint: >
          It is the same exponent appearing in the increment size $\sqrt h =
          h^{1/2}$.
        feedback: >
          The boundary is $\alpha = 1/2$, set precisely by the $\sqrt h$
          increment size — paths are just barely too rough to reach that
          exponent.

  - node: quant-processes.brownian.reflection-bm
    hook: >
      "What's the probability the path ever touches level $a$ by time $t$" is
      answered by mirroring the path after its first touch, and the clean
      factor of $2$ this produces is worth having automatic.
    explanation: >
      Let $\tau_a$ be the first time the path reaches $a$. On the event
      $\tau_a\le t$, the strong Markov property restarts the process at $a$
      as a fresh, symmetric Brownian motion — equally likely to finish above
      or below $a$ by the remaining time. So among paths that have touched
      $a$ by time $t$, exactly half finish above $a$ and half finish below:
      $\Pr(M_t\ge a,\,B_t<a)=\Pr(M_t\ge a,\,B_t>a)$.

      The second half of that equality collapses further: finishing above
      $a$ already forces the running maximum above $a$, so $\Pr(M_t\ge
      a,\,B_t>a)=\Pr(B_t>a)$ outright — reaching the level is automatic once
      you've finished past it. Adding the two symmetric halves back together
      gives $\Pr(M_t\ge a)=2\Pr(B_t\ge a)$, and rewriting with the normal
      CDF, $\Pr(M_t\ge a)=2\left(1-\Phi(a/\sqrt t)\right)$.

      The same identity says something sharper: $\Pr(M_t\ge a)=\Pr(|B_t|\ge
      a)$ — the event "the path ever reaches $a$" has exactly the same
      probability as "the path ends up at least $a$ away from $0$ in either
      direction," a genuinely useful shortcut whenever a maximum needs
      converting into an ordinary tail probability.
    worked: >
      Take $a=0.5$, $t=4$: $\Pr(M_4\ge0.5)=2\left(1-\Phi(0.5/2)\right)=
      2\left(1-\Phi(0.25)\right)\approx2(1-0.5987)=0.8026$ — over $80\%$
      chance the path has drifted at least half a unit above $0$ at some
      point in the first four time units, versus only
      $\Pr(B_4\ge0.5)\approx0.4013$ chance of finishing there.
    interview: >
      "What's $\Pr(M_t\ge a)$" wants the mirror-argument sketch, not just the
      formula — say the strong Markov restart, the symmetric split, and the
      factor of $2$, then quote $2(1-\Phi(a/\sqrt t))$.
    pitfalls: >
      Reporting $\Pr(B_t\ge a)$ alone and forgetting to double it — this is
      only the "finished above $a$" half, missing every path that touched $a$
      and came back down. Plugging $a/t$ instead of $a/\sqrt t$ into $\Phi$
      mixes up the space and time scaling.
    recap: >
      $\Pr(M_t\ge a)=2\Pr(B_t\ge a)=\Pr(|B_t|\ge a)$: mirror the path after
      its first touch of $a$, and the ever-touching probability is exactly
      twice the finishing-beyond probability.
    steps:
      - teach: >
          "What's the probability the path ever touches level $a$ by time $t$"
          is answered by mirroring the path after its first touch, and the
          clean factor of $2$ this produces is worth having automatic.
      - teach: >
          Let $\tau_a$ be the first time the path reaches $a$. On $\{\tau_a\le
          t\}$, the strong Markov property restarts the path at $a$ as a fresh,
          symmetric Brownian motion — equally likely to finish above or below
          $a$, so $\Pr(M_t\ge a,\,B_t<a)=\Pr(M_t\ge a,\,B_t>a)$.
      - ask: >
          For $a=2$, $t=4$, what is $\Pr(M_4 \ge 2)$?
        expects: "0.3174"
        tolerance: 0.0005
        hint: >
          Compute $a/\sqrt t = 2/2 = 1$, use $\Phi(1)=0.8413$, then double
          $1-\Phi(1)$.
        feedback: >
          $\Pr(M_4\ge2) = 2\left(1-\Phi(2/\sqrt4)\right) =
          2\left(1-\Phi(1)\right) = 2\times0.1587 = 0.3174$.
      - teach: >
          Finishing above $a$ already forces the running maximum above $a$, so
          $\Pr(M_t\ge a,\,B_t>a)=\Pr(B_t>a)$ outright. Adding the two symmetric
          halves back together gives $\Pr(M_t\ge a)=2\Pr(B_t\ge a)=\Pr(|B_t|\ge
          a)$.
      - ask: >
          For $a=1$, $t=0.25$, what is $\Pr(M_{0.25} \ge 1)$?
        expects: "0.0456"
        tolerance: 0.0005
        hint: >
          Compute $a/\sqrt t = 1/0.5 = 2$, use $\Phi(2)=0.9772$, then double
          $1-\Phi(2)$.
        feedback: >
          $\Pr(M_{0.25}\ge1) = 2\left(1-\Phi(1/\sqrt{0.25})\right) =
          2\left(1-\Phi(2)\right) = 2\times0.0228 = 0.0456$.
      - teach: >
          The most common slip is reporting $\Pr(B_t\ge a)$ alone and
          forgetting to double it — this is only the "finished above $a$" half,
          missing every path that touched $a$ and came back down before time
          $t$.
      - ask: >
          Which of these equals $\Pr(M_t \ge a)$ exactly?
        choices:
          - text: >
              $\Pr(B_t \ge a)$
            feedback: >
              This misses the factor of $2$ — it only counts paths that
              *finish* above $a$, not the ones that touched $a$ and returned
              below it.
          - text: >
              $\Pr(|B_t| \ge a)$
            correct: true
            feedback: >
              This is exactly the reflection identity: ever touching $a$ has
              the same probability as finishing at least $a$ away from $0$ in
              either direction.
          - text: >
              $2\Pr(B_t \le a)$
            feedback: >
              This flips the direction of the tail — it should be $\Pr(B_t \ge
              a)$, not $\Pr(B_t \le a)$.
          - text: >
              $\Phi(a/\sqrt t)$
            feedback: >
              This is missing both the complement and the factor of $2$ — it is
              close to the probability of the *opposite* event.
        feedback: >
          $\Pr(M_t\ge a)=2\Pr(B_t\ge a)=\Pr(|B_t|\ge a)$: the ever-touching
          probability is exactly twice the finishing-beyond probability, and
          also equals the two-sided tail probability at $0$.

  - node: quant-processes.brownian.running-max-law
    hook: >
      "What's the expected high-water mark of a driftless log-price over a
      year" is a stock desk question, and the answer is a folded normal mean
      you should have memorized, not re-derived under time pressure.
    explanation: >
      Reflection says $M_t$ and $|B_t|$ share a distribution, so the running
      maximum's density is just the normal density folded onto the positive
      axis: $f_{M_t}(a)=\sqrt{2/(\pi t)}\,e^{-a^2/(2t)}$ for $a\ge0$. Every
      moment of $M_t$ is therefore a moment of $|B_t|$, computed off the
      ordinary normal — no new machinery, just the fold.

      The mean comes out to $\mathbb{E}[M_t]=\sqrt{2t/\pi}\approx0.798\sqrt
      t$, and since $M_t^2=B_t^2$ in law, $\mathbb{E}[M_t^2]=
      \mathbb{E}[B_t^2]=t$ exactly — giving
      $\operatorname{Var}(M_t)=t(1-2/\pi)\approx0.363t$. A trap hides in that
      second moment: it looks identical to $\mathbb{E}[B_t^2]$ because it is
      identical, but $M_t$ (the running peak over the whole interval) and
      $B_t$ (the value at the single endpoint) are different random variables
      that merely share this one moment.

      The joint law extends the reflection argument one step further:
      $\Pr(M_t\ge a,\,B_t\le b)=\Pr(B_t\ge2a-b)$ for $a\ge\max(b,0)$ — the
      endpoint $2a-b$ is $b$ mirrored across the level $a$, the same
      mirroring idea that proved the marginal formula. One more consequence
      worth keeping: the drawdown from the peak, $M_t-B_t$, again has the law
      of $|B_t|$ — the process forgets its own peak in the same way it
      forgets its own barrier crossings.
    worked: >
      A driftless log-price with $25\%$ annualized volatility has $B_t$
      scaled by $\sigma=0.25$, so the expected one-year high is
      $\sigma\sqrt{2/\pi}=0.25\times0.7979\approx0.1995$ — about a $20\%$
      expected peak above the starting level over the year, using nothing but
      the folded-normal mean scaled by the volatility.
    interview: >
      "What's the expected maximum of a driftless random walk (or
      log-price) over a horizon $T$" is answered cold with
      $\sigma\sqrt{2T/\pi}\approx0.8\sigma\sqrt T$; a sharp follow-up asks for
      the law of the drawdown from the peak, answered by naming it as another
      copy of $|B_t|$.
    pitfalls: >
      Confusing the numerically-identical-looking $\mathbb{E}[M_t^2]=t$ with
      a claim that $M_t$ and $B_t$ have the same distribution everywhere —
      they share only this one moment, not the full law (the mean already
      differs). Forgetting to rescale by $\sigma$ when the underlying process
      isn't standard Brownian motion.
    recap: >
      The running maximum is distributed as $|B_t|$, giving mean
      $\sqrt{2t/\pi}$ and variance $t(1-2/\pi)$, and the drawdown from that
      peak has the identical law.
    steps:
      - teach: >
          "What's the expected high-water mark of a driftless log-price over a
          year" is a stock-desk question, and the answer is a folded-normal
          mean you should have memorized, not re-derived under time pressure.
      - teach: >
          Reflection says $M_t$ and $|B_t|$ share a distribution, so $M_t$'s
          density is the normal density folded onto the positive axis:
          $f_{M_t}(a)=\sqrt{2/(\pi t)}\,e^{-a^2/(2t)}$ for $a\ge0$. Every
          moment of $M_t$ is therefore a moment of $|B_t|$.
      - ask: >
          What is $\mathbb{E}[M_9]$?
        expects: "2.3937"
        tolerance: 0.0005
        hint: >
          Use $\mathbb{E}[M_t]=\sqrt{2t/\pi}\approx0.7979\sqrt t$.
        feedback: >
          $\mathbb{E}[M_9] = \sqrt{2\times9/\pi} = \sqrt{18/\pi} \approx
          2.3937$ — equivalently, $\sqrt{2/\pi}\times3 \approx 0.7979\times3$.
      - teach: >
          Since $M_t^2=B_t^2$ in law, $\mathbb{E}[M_t^2]=\mathbb{E}[B_t^2]=t$
          exactly, giving $\operatorname{Var}(M_t)=t(1-2/\pi)$. This second
          moment coinciding with $B_t$'s is a coincidence of one moment, not a
          claim that $M_t$ and $B_t$ share the full law — their means already
          differ.
      - ask: >
          What is $\operatorname{Var}(M_{16})$?
        expects: "5.8141"
        tolerance: 0.0005
        hint: >
          Use $\operatorname{Var}(M_t)=t(1-2/\pi)\approx0.3634t$.
        feedback: >
          $\operatorname{Var}(M_{16}) = 16(1-2/\pi) = 16 - 32/\pi \approx
          5.8141$.
      - teach: >
          The joint law extends the mirroring argument one step further:
          $\Pr(M_t\ge a,\,B_t\le b)=\Pr(B_t\ge2a-b)$ for $a\ge\max(b,0)$, where
          $2a-b$ is $b$ mirrored across the level $a$.
      - ask: >
          The drawdown from the peak, $M_t - B_t$, has the same law as which of
          these?
        choices:
          - text: >
              $B_t$ itself
            feedback: >
              $B_t$ is mean-zero and can be negative, while the drawdown
              $M_t-B_t\ge0$ always — these have different laws entirely.
          - text: >
              $|B_t|$
            correct: true
            feedback: >
              The drawdown from the peak has exactly the folded-normal law of
              $|B_t|$ — the process forgets its own peak the same way it
              forgets its own barrier crossings.
          - text: >
              A constant equal to $\mathbb{E}[M_t]$
            feedback: >
              The drawdown is random, not a fixed constant — it has an entire
              folded-normal distribution.
          - text: >
              $2B_t$
            feedback: >
              This has variance $4t$, far larger than the drawdown's actual
              spread.
        feedback: >
          The drawdown from the running peak is distributed exactly as $|B_t|$
          — another instance of the reflection idea, applied to the gap below
          the maximum rather than to the maximum itself.

  - node: quant-processes.brownian.hitting-time
    hook: >
      "The path hits every level with probability $1$, but the expected time
      to do so is infinite" sounds like a contradiction, and resolving it
      cleanly is a standard interview checkpoint.
    explanation: >
      The event "hit level $a$ by time $t$" is literally the event "the
      running maximum has reached $a$ by time $t$," so $\Pr(\tau_a\le
      t)=\Pr(M_t\ge a)=2\left(1-\Phi(a/\sqrt t)\right)$ falls straight out of
      the reflection principle with no new argument. Differentiating in $t$
      gives the density $f(t)=\dfrac{a}{\sqrt{2\pi t^3}}\,e^{-a^2/(2t)}$ for
      $t>0$.

      Sending $t\to\infty$ makes $\Phi(a/\sqrt t)\to\Phi(0)=1/2$, so
      $\Pr(\tau_a\le t)\to1$: every level is reached, eventually, with
      certainty. But "eventually, with certainty" and "in bounded expected
      time" are different claims — the density's tail behaves like
      $a\,t^{-3/2}/\sqrt{2\pi}$ for large $t$, and $\int^\infty
      t\cdot t^{-3/2}\,dt$ diverges, so $\mathbb{E}[\tau_a]=\infty$. The mass
      that makes the probability converge to $1$ is spread thin enough over
      an unbounded tail that the average waiting time is dominated by
      arbitrarily rare, arbitrarily long excursions the wrong way.

      Self-similarity fixes the shape across levels: $\tau_a$ has the same
      law as $a^2\tau_1$, so the typical wait — say, the median — costs
      quadratically in distance, at $\approx2.20a^2$, even while the mean
      stays infinite regardless of $a$.
    worked: >
      For $a=4$, the median hitting time is about $2.20\times16=35.2$ time
      units — half the time, level $4$ is reached within about $35$ units —
      while $\mathbb{E}[\tau_4]$ remains infinite regardless, since the
      divergence comes from the tail shape, not from the specific level.
    interview: >
      "Does Brownian motion hit every level, and what's the expected time to
      do so" wants both halves stated without hesitation: probability $1$ by
      sending $t\to\infty$ in the reflection formula, yet infinite
      expectation from the $t^{-3/2}$ tail — and the two are not in tension.
    pitfalls: >
      Assuming "happens with probability $1$" implies "happens in finite
      expected time" — this is the standard trap the whole node is built to
      catch. Forgetting the quadratic-in-distance scaling and guessing the
      median wait grows linearly in $a$ instead of as $a^2$.
    recap: >
      Brownian motion reaches any level with probability $1$ eventually, but
      the hitting time has a $t^{-3/2}$ tail heavy enough to make its
      expectation infinite, even as the median grows only like $a^2$.
    steps:
      - teach: >
          "The path hits every level with probability $1$, but the expected
          time to do so is infinite" sounds like a contradiction — resolving it
          cleanly is a standard interview checkpoint.
      - teach: >
          "Hit level $a$ by time $t$" is literally "the running maximum has
          reached $a$ by time $t$," so $\Pr(\tau_a\le t)=\Pr(M_t\ge
          a)=2\left(1-\Phi(a/\sqrt t)\right)$ falls straight out of reflection,
          no new argument needed.
      - ask: >
          For $a=1$, $t=4$, what is $\Pr(\tau_1 \le 4)$?
        expects: "0.6170"
        tolerance: 0.0005
        hint: >
          Compute $a/\sqrt t = 1/2 = 0.5$, use $\Phi(0.5)=0.6915$, then double
          $1-\Phi(0.5)$.
        feedback: >
          $\Pr(\tau_1\le4) = 2\left(1-\Phi(1/\sqrt4)\right) =
          2\left(1-\Phi(0.5)\right) = 2\times0.3085 = 0.6170$.
      - teach: >
          Sending $t\to\infty$ makes $\Phi(a/\sqrt t)\to\Phi(0)=1/2$, so the
          hitting probability tends to $1$ — every level is reached eventually.
          But the density's tail behaves like $t^{-3/2}$, and $\int^\infty
          t\cdot t^{-3/2}\,dt$ diverges, so $\mathbb{E}[\tau_a]=\infty$
          regardless.
      - ask: >
          Why is $\mathbb{E}[\tau_a]$ infinite even though
          $\Pr(\tau_a<\infty)=1$?
        choices:
          - text: >
              Because the density's tail decays like $t^{-3/2}$, and
              $\int^\infty t\cdot t^{-3/2}\,dt$ diverges
            correct: true
            feedback: >
              This is exactly the mechanism: enough of the probability mass
              sits in a heavy, slowly-decaying tail that the average waiting
              time is dominated by arbitrarily rare, arbitrarily long
              excursions the wrong way.
          - text: >
              Because $\Pr(\tau_a \le t)$ never actually reaches $1$ for any
              finite $t$
            feedback: >
              True but beside the point — the probability approaching $1$ in
              the limit does not, by itself, prevent a finite mean; the
              specific tail decay rate is what matters.
          - text: >
              Because $f(t)$ is not a valid probability density
            feedback: >
              $f(t)$ is a perfectly valid density — it integrates to $1$ over
              $t>0$. The issue is only that its *mean* diverges.
          - text: >
              Because Brownian motion is not a stationary process
            feedback: >
              Stationarity of the process is unrelated to whether a specific
              hitting-time distribution has finite mean.
        feedback: >
          "Happens with probability $1$" and "finite expected waiting time" are
          genuinely different claims — the $t^{-3/2}$ tail is exactly heavy
          enough to make the second one fail.
      - teach: >
          Self-similarity fixes the shape across levels: $\tau_a$ has the same
          law as $a^2\tau_1$, so the typical wait — the median — costs
          quadratically in distance, at $\approx2.20a^2$, even while the mean
          stays infinite for every $a$.
      - ask: >
          Using the median formula $\approx 2.20a^2$, what is the median
          hitting time for $a=3$?
        expects: "19.8"
        tolerance: 0.0005
        hint: >
          Square $a$ first, then multiply by $2.20$.
        feedback: >
          $2.20\times3^2 = 2.20\times9 = 19.8$ time units — a finite,
          well-behaved typical value, in sharp contrast to the infinite mean.

  - node: quant-processes.brownian.two-sided-exit
    hook: >
      "Derive the two-barrier gambler's-ruin probability and expected
      duration for Brownian motion from scratch" is a standard whiteboard
      ask, and it comes out of the two simplest Brownian martingales in three
      lines each.
    explanation: >
      Fix barriers at $a>0$ above and $-b<0$ below, and let $\tau$ be the
      first exit time from $(-b,a)$; this $\tau$ is finite with probability
      $1$ and has finite mean, so both stopped martingales stay bounded
      enough for optional stopping to apply legally.

      Using the martingale $B_t$: optional stopping gives
      $0=\mathbb{E}[B_\tau]=ap-b(1-p)$, where $p$ is the probability of
      exiting at $a$ rather than $-b$. Solving, $p=b/(a+b)$ — the value of a
      fair game is conserved on average, so the exit probabilities must
      weight the two barriers inversely to their distance from $0$.

      Using the martingale $B_t^2-t$: optional stopping gives
      $\mathbb{E}[\tau]=\mathbb{E}[B_\tau^2]=a^2\cdot\dfrac{b}{a+b}+b^2\cdot
      \dfrac{a}{a+b}=ab$ — the compensated square converts the exit time
      directly into an algebraic expression once the exit distribution from
      the first martingale is already known. Symmetric barriers, $a=b$,
      degenerate to a fair coin flip with $\mathbb{E}[\tau]=a^2$; sending
      $b\to\infty$ recovers certain eventual hitting of $a$ ($p\to1$)
      alongside $\mathbb{E}[\tau]=ab\to\infty$ — exactly the
      sure-but-infinite-mean hitting-time fact from a different angle.
    worked: >
      With $a=3$, $b=6$: $p=6/9=2/3$, so the path is twice as likely to reach
      $3$ before $-6$ as the reverse, and $\mathbb{E}[\tau]=3\times6=18$ time
      units — both read off the two martingales with no further computation.
    interview: >
      "Derive the ruin probability and expected duration for Brownian motion
      between two barriers" is answered by naming both martingales
      explicitly and running optional stopping on each — the interviewer is
      checking that you know which martingale answers which question, not
      just that you can recite $b/(a+b)$.
    pitfalls: >
      Applying optional stopping without checking that $\tau$ has finite mean
      and the stopped process is bounded — both barriers being finite is
      exactly what makes this legal. Mixing up which martingale produces the
      probability versus the time: $B_t$ gives $p$, $B_t^2-t$ gives
      $\mathbb{E}[\tau]$, never the reverse.
    recap: >
      Two Brownian martingales solve the two-barrier exit problem completely:
      $B_t$ gives $\Pr(\text{hit }a\text{ first})=b/(a+b)$, and $B_t^2-t$
      gives $\mathbb{E}[\tau]=ab$.
    steps:
      - teach: >
          "Derive the two-barrier gambler's-ruin probability and expected
          duration for Brownian motion from scratch" is a standard whiteboard
          ask, and it comes out of the two simplest Brownian martingales in
          three lines each.
      - teach: >
          Fix barriers $a>0$ above and $-b<0$ below, and let $\tau$ be the
          first exit time from $(-b,a)$ — finite with probability $1$ and
          finite mean, so optional stopping applies legally to both stopped
          martingales.
      - ask: >
          Using the martingale $B_t$ with $a=4$, $b=12$:
          $0=\mathbb{E}[B_\tau]=ap-b(1-p)$. What is $p$, the probability of
          exiting at $a$ rather than $-b$?
        expects: "0.75"
        hint: >
          Use $p=b/(a+b)$ directly.
        feedback: >
          Solving $ap=b(1-p)$ gives $p=b/(a+b)=12/16=0.75$ — the exit
          probabilities weight the two barriers inversely to their distance
          from $0$.
      - teach: >
          Using the martingale $B_t^2-t$: optional stopping gives
          $\mathbb{E}[\tau]=\mathbb{E}[B_\tau^2]=a^2\cdot\dfrac{b}{a+b}+b^2\cdot\dfrac{a}{a+b}=ab$
          — the compensated square converts the exit time directly into an
          algebraic expression, once the exit distribution is already known
          from the first martingale.
      - ask: >
          With $a=4$, $b=12$, what is $\mathbb{E}[\tau]$?
        expects: "48"
        hint: >
          Use $\mathbb{E}[\tau]=ab$ directly.
        feedback: >
          $\mathbb{E}[\tau] = ab = 4\times12 = 48$ time units.
      - teach: >
          The two martingales never swap roles: $B_t$ gives the exit
          *probability* $p=b/(a+b)$, and $B_t^2-t$ gives the expected exit
          *time* $ab$ — mixing them up is the standard slip to guard against.
      - ask: >
          Barriers are symmetric, $a=b$. What does the exit probability at $a$
          become, and why?
        choices:
          - text: >
              Exactly $1/2$, since $p=b/(a+b)$ collapses to $a/(2a)$ when $a=b$
            correct: true
            feedback: >
              $p=b/(a+b)=a/(a+a)=1/2$ — a fair game with symmetric barriers
              degenerates to a coin flip, exactly as the martingale identity
              demands.
          - text: >
              Still $b/(a+b)$, but it can't be simplified without knowing $a$
              and $b$ individually
            feedback: >
              It simplifies immediately to $1/2$ once $a=b$ — no individual
              values are needed.
          - text: >
              Undefined, since the formula requires distinct barriers
            feedback: >
              The formula $p=b/(a+b)$ is perfectly well-defined at $a=b$;
              nothing about the derivation needs the barriers to differ.
          - text: >
              It depends on which barrier the process starts closer to
            feedback: >
              The process starts at $0$, equidistant from both symmetric
              barriers by construction — there is no asymmetry left to depend
              on.
        feedback: >
          Symmetric barriers reduce the martingale identity to a coin flip,
          $p=1/2$, and correspondingly $\mathbb{E}[\tau]=a^2$.

  - node: quant-processes.brownian.bm-with-drift
    hook: >
      "Why does it take years, not months, to statistically confirm a
      trading edge" has an exact answer once you write the strategy's
      cumulative P&L as drift plus Brownian noise and compare how each term
      grows.
    explanation: >
      Arithmetic Brownian motion tilts the driftless process by a
      deterministic linear term: $X_t=x_0+\mu t+\sigma B_t$. Since $B_t$ has
      independent increments, so does $X_t$, and $X_t\sim N(x_0+\mu
      t,\,\sigma^2t)$ follows immediately from the base process's normality
      plus the fixed shift and scale.

      The two terms grow at genuinely different rates: the signal, $\mu t$,
      grows linearly in time, while the noise, $\sigma\sqrt t$, grows only as
      a square root. Their ratio is $\mu t/(\sigma\sqrt t)=(\mu/\sigma)\sqrt
      t$ — a quantity that grows without bound, but only at the crawling
      $\sqrt t$ rate. Read annually, $\mu/\sigma$ is exactly the Sharpe
      ratio, and its slow growth is the entire reason a real trading edge is
      statistically invisible over a short track record even when it's
      genuinely there.

      The same construction applied to the log price rather than the raw
      price, $\log S_t=\log S_0+\mu t+\sigma B_t$, is geometric Brownian
      motion — the standard continuous-time model for a positive asset price,
      built by exponentiating this exact object.
    worked: >
      A strategy with $\mu=12\%$ and $\sigma=20\%$ per year has Sharpe ratio
      $0.6$. Separating its drift from zero at three standard errors needs
      $0.6\sqrt t=3$, i.e. $\sqrt t=5$, so $t=25$ years — a strategy with a
      genuine, moderate edge needs a quarter-century of track record before
      the signal clears three noise units.
    interview: >
      "Write down Brownian motion with drift and explain why detecting an
      edge is slow" wants $X_t=\mu t+\sigma B_t$ stated cold, followed by the
      $(\mu/\sigma)\sqrt t$ Sharpe-growth argument — the interviewer is
      testing whether you can connect a formula to the practical "why," not
      just recite it.
    pitfalls: >
      Assuming a longer backtest linearly improves confidence in an edge —
      confidence only accumulates at rate $\sqrt t$, not $t$. Comparing
      Sharpe ratios computed over mismatched horizons (daily versus annual)
      without converting first silently compares different quantities.
    recap: >
      $X_t=\mu t+\sigma B_t$ has signal growing like $t$ and noise growing
      only like $\sqrt t$, so their ratio — the Sharpe ratio — grows like
      $\sqrt t$, which is why real edges take a long track record to confirm
      statistically.
    steps:
      - teach: >
          "Why does it take years, not months, to statistically confirm a
          trading edge" has an exact answer once you write cumulative P&L as
          drift plus Brownian noise and compare how each term grows.
      - teach: >
          Arithmetic Brownian motion tilts the driftless process by a
          deterministic linear term: $X_t=x_0+\mu t+\sigma B_t$. Since $B_t$
          has independent increments, so does $X_t$, and $X_t\sim N(x_0+\mu
          t,\,\sigma^2t)$ follows immediately.
      - ask: >
          With $\mu=0.05$, $\sigma=0.2$, $x_0=0$, what is the standard
          deviation of $X_9$?
        expects: "0.6"
        hint: >
          Only $\sigma^2t$ enters the variance — the drift term drops out
          entirely.
        feedback: >
          $\operatorname{Var}(X_9)=\sigma^2t=0.04\times9=0.36$, so the standard
          deviation is $\sqrt{0.36}=0.6$ — the drift $\mu$ shifts the mean but
          never touches the spread.
      - teach: >
          The two terms grow at genuinely different rates: signal $\mu t$ grows
          linearly, noise $\sigma\sqrt t$ grows only as a square root, so their
          ratio $(\mu/\sigma)\sqrt t$ — the Sharpe ratio read annually, times
          $\sqrt t$ — climbs at the crawling $\sqrt t$ rate.
      - ask: >
          A strategy has Sharpe ratio $0.25$. How many years $t$ are needed for
          $0.25\sqrt t = 2$ (separating the drift from zero at two standard
          errors)?
        expects: "64"
        hint: >
          Isolate $\sqrt t$ first, then square it.
        feedback: >
          $0.25\sqrt t=2 \Rightarrow \sqrt t=8 \Rightarrow t=64$ — a
          quarter-century-plus track record for even a two-standard-error
          confirmation of a modest, genuine edge.
      - teach: >
          Confidence accumulates only at rate $\sqrt t$, never linearly in $t$
          — a natural but wrong instinct is to assume doubling the backtest
          length doubles the confidence, when it only multiplies it by
          $\sqrt2$.
      - ask: >
          A daily strategy has Sharpe ratio $0.1$ measured daily. Using
          $\sqrt{252}\approx16$, what is the correctly annualized Sharpe ratio?
        choices:
          - text: >
              $0.1\times252 = 25.2$
            feedback: >
              This treats the Sharpe ratio like the drift term, which scales
              linearly in $t$ — but Sharpe scales like $\sqrt t$, since it is a
              ratio of a linear term to a square-root term.
          - text: >
              $0.1\times\sqrt{252}\approx1.6$
            correct: true
            feedback: >
              The Sharpe ratio grows like $\sqrt t$, matching the ratio
              $(\mu/\sigma)\sqrt t$ directly — multiply by
              $\sqrt{252}\approx16$.
          - text: >
              $0.1/\sqrt{252}$
            feedback: >
              This divides instead of multiplies, which would be the wrong
              direction — moving from daily to annual should *increase* the
              reported Sharpe ratio.
          - text: >
              $0.1$, unchanged, since Sharpe ratio does not depend on horizon
            feedback: >
              Sharpe ratio is horizon-dependent precisely because signal and
              noise scale at different rates — quoting it without a horizon is
              meaningless.
        feedback: >
          Sharpe ratio annualizes by the same $\sqrt{252}\approx16$ factor as
          volatility, for the structural reason that it is itself a ratio of a
          linear-in-$t$ term to a $\sqrt t$ term.

  - node: quant-processes.brownian.drift-hitting
    hook: >
      "What's the chance my strategy ever draws down $X\%$ even though it has
      a positive edge" is a desk-standard question, and the clean exponential
      answer comes from finding the one nonzero $\theta$ that turns the
      exponential martingale driftless.
    explanation: >
      For $X_t=\mu t+\sigma B_t$, the moment generating function
      $\mathbb{E}[e^{\theta X_t}]=e^{(\theta\mu+\theta^2\sigma^2/2)t}$ makes
      $e^{\theta X_t}$ a martingale exactly when the exponent's coefficient of
      $t$ vanishes — at $\theta=0$ trivially, and at the nontrivial root
      $\theta=-2\mu/\sigma^2$. That second root does the real work: it is the
      exact amount of exponential discounting needed to cancel the drift's
      steady push, leaving a genuinely fair game to apply optional stopping
      to.

      Running optional stopping with that root at the exit time from
      $(-b,a)$ gives $p\,e^{\theta a}+(1-p)e^{-\theta b}=1$, so
      $p=\dfrac{1-e^{-\theta b}}{e^{\theta a}-e^{-\theta b}}$ — and letting
      $\mu\to0$ (so $\theta\to0$) recovers the driftless answer $b/(a+b)$
      exactly, confirming the construction is a genuine generalization rather
      than a different formula.

      The one-sided limits are the version worth memorizing outright: for
      $\mu>0$, the chance of ever falling to $-b$ is $e^{-2\mu b/\sigma^2}$ —
      a positive edge doesn't prevent a drawdown, it only suppresses its
      probability exponentially in the drawdown size. Symmetrically, for
      $\mu<0$, $\Pr(\sup_tX_t\ge a)=e^{-2|\mu|a/\sigma^2}$.
    worked: >
      With $\mu=6\%$ and $\sigma=30\%$ per year, $2\mu/\sigma^2=2(0.06)/
      0.09\approx1.333$. The chance of ever suffering a $15\%$ drawdown is
      $e^{-1.333\times0.15}=e^{-0.2}\approx0.819$ — over $80\%$, despite the
      positive drift, because a modest edge against sizable volatility barely
      dents how often a moderate drawdown occurs.
    interview: >
      "Given a positive Sharpe ratio, what's the probability of ever seeing a
      $b\%$ drawdown" is answered directly with $e^{-2\mu b/\sigma^2}$; a
      sharp follow-up asks you to check that letting $\mu\to0$ recovers the
      plain two-barrier ruin formula, confirming you understand it as the
      general case, not a separate fact.
    pitfalls: >
      Using the one-sided drawdown formula when $\mu$ has the wrong sign for
      the event asked about — with $\mu<0$ that downside event is certain,
      and the exponential formula instead governs the upside. Forgetting
      that the two-sided formula needs both barriers finite for optional
      stopping to be legal at all.
    recap: >
      The nonzero root $\theta=-2\mu/\sigma^2$ of the exponential martingale
      turns a drifted process driftless for optional-stopping purposes,
      giving $e^{-2\mu b/\sigma^2}$ for the chance of an eventual drawdown of
      size $b$ under positive drift.
    steps:
      - teach: >
          "What's the chance my strategy ever draws down $b$ even though it has
          a positive edge" is a desk-standard question, and the clean
          exponential answer comes from finding the one nonzero $\theta$ that
          makes the exponential martingale driftless.
      - teach: >
          For $X_t=\mu t+\sigma B_t$, $\mathbb{E}[e^{\theta
          X_t}]=e^{(\theta\mu+\theta^2\sigma^2/2)t}$ makes $e^{\theta X_t}$ a
          martingale exactly when the exponent's coefficient of $t$ vanishes —
          at $\theta=0$ trivially, and at the nontrivial root
          $\theta=-2\mu/\sigma^2$.
      - ask: >
          What is the nonzero root $\theta$ for $\mu=0.08$, $\sigma=0.4$?
        expects: "-1"
        hint: >
          Compute $2\mu/\sigma^2$ first, then negate it.
        feedback: >
          $\theta=-2\mu/\sigma^2 = -2(0.08)/0.16 = -1$ — the exact discounting
          rate needed to cancel this drift.
      - teach: >
          Optional stopping with that root, at the exit time from $(-b,a)$,
          gives the two-barrier probability; the one-sided limits are worth
          memorizing directly: for $\mu>0$, the chance of ever falling to $-b$
          is $e^{-2\mu b/\sigma^2}$.
      - ask: >
          With $\mu=0.10$, $\sigma=0.25$, what is the probability of ever
          falling to $-0.2$ (a $20\%$ drawdown)?
        expects: "0.5273"
        tolerance: 0.0005
        hint: >
          Compute $2\mu b/\sigma^2$ first, then $e^{-x}$;
          $e^{-0.64}\approx0.5273$.
        feedback: >
          $2\mu/\sigma^2 = 0.2/0.0625 = 3.2$, so the probability is
          $e^{-3.2\times0.2}=e^{-0.64}\approx0.5273$ — over half, despite the
          positive drift, since a modest edge against sizable volatility barely
          dents how often a moderate drawdown occurs.
      - teach: >
          Symmetrically, for $\mu<0$, $\Pr(\sup_tX_t\ge
          a)=e^{-2|\mu|a/\sigma^2}$ — the formula for a fall under positive
          drift and the formula for a rise under negative drift are mirror
          images, and using the wrong one for the sign of $\mu$ in play is the
          standard slip.
      - ask: >
          $\mu=-0.05$ (negative drift), $\sigma=0.2$. What is $\Pr(\text{the
          process ever falls to } -b)$ for any $b>0$?
        choices:
          - text: >
              $e^{-2|\mu|b/\sigma^2}$
            feedback: >
              That formula governs the *rise* to a positive level under
              negative drift, not the fall — using it here has the wrong event
              attached to the wrong sign of $\mu$.
          - text: >
              $1$
            correct: true
            feedback: >
              With negative drift the process drifts downward without limit, so
              it is certain to eventually reach any negative level $-b$ — the
              exponential formula is only needed for the event working
              *against* the drift's direction.
          - text: >
              $0$
            feedback: >
              A negatively-drifting process reaching a negative level is the
              easy direction, not an impossible one.
          - text: >
              $b/(a+b)$
            feedback: >
              That two-sided ruin formula needs an upper barrier $a$ explicitly
              specified — none is given here, and no barrier is needed for a
              one-sided certain event anyway.
        feedback: >
          The exponential formula quantifies the event working against the
          drift's own direction; the event drift already favors is certain,
          probability $1$, with no formula needed.

  - node: quant-processes.brownian.vol-scaling
    hook: >
      "Vol of $16$ means about a percent a day" is desk shorthand every
      interview volatility-conversion question is secretly testing, and it's
      just the $\sqrt T$ scaling rule run in one direction or the other.
    explanation: >
      Because $\operatorname{Var}(B_t)=t$, variances over disjoint time
      periods simply add — no covariance term to worry about, since the
      periods' increments are independent. Standard deviations, being square
      roots of variance, therefore add in quadrature rather than linearly:
      $\sigma(T)=\sigma(1)\sqrt T$. Reach for this identity every time a
      quoted volatility needs to move from one horizon to another.

      The exponent $T$ is a count of independent periods, not calendar time,
      which is why the standard desk factor is $\sqrt{252}\approx16$ — $252$
      trading days, not $365$ — and the identity keeps working below a day:
      with $6.5$ trading hours in a session, hourly and annual volatility are
      $\sqrt{252\times6.5}=\sqrt{1638}\approx40.5$ apart, so a $20\%$ annual
      volatility implies roughly $20/40.5\approx0.49\%$ per trading hour.

      Drift, by contrast, is linear in $T$, not $\sqrt T$ — the mean of the
      drift term scales as $t$, so the ratio $\mu/\sigma$ (the Sharpe ratio)
      itself scales as $\sqrt T$: a daily Sharpe multiplies by
      $\sqrt{252}\approx16$ to annualize, the identical factor as the
      volatility conversion, for a structurally different reason. All of this
      leans on one silent assumption: the periods being added must be
      genuinely uncorrelated. A trending series accumulates risk faster than
      $\sqrt T$; a mean-reverting one accumulates slower.
    worked: >
      A fund reports weekly return volatility of $3\%$. Annualizing over
      $52$ weeks: $\sqrt{52}\approx7.21$, so annual volatility is
      $3\%\times7.21\approx21.6\%$ — the identical rule as the daily case,
      just with $52$ swapped in for $252$.
    interview: >
      "Convert this daily (or weekly, or monthly) volatility to annual, or
      the reverse" is answered on the spot with $\sigma(T)=\sigma(1)\sqrt T$,
      and $\sqrt{252}\approx16$ produced from memory as the standard
      daily-to-annual factor.
    pitfalls: >
      Scaling drift by $\sqrt T$ instead of $T$, or vice versa for
      volatility — the two quantities scale at genuinely different rates and
      mixing them up flips the Sharpe ratio computation. Applying the rule to
      a serially correlated return series, where the independence the whole
      identity leans on has already failed.
    recap: >
      Volatility scales as $\sigma(1)\sqrt T$ and drift scales as
      $\mu(1)T$, so Sharpe ratios scale as $\sqrt T$ too; $\sqrt{252}\approx
      16$ is the standard daily-to-annual conversion factor for all three.
    steps:
      - teach: >
          "Vol of $16$ means about a percent a day" is desk shorthand every
          interview volatility-conversion question is secretly testing, and
          it's just the $\sqrt T$ scaling rule run in one direction or the
          other.
      - teach: >
          Because $\operatorname{Var}(B_t)=t$, variances over disjoint periods
          simply add — no covariance term, since the periods' increments are
          independent. Standard deviations therefore add in quadrature:
          $\sigma(T)=\sigma(1)\sqrt T$.
      - ask: >
          A strategy's daily return volatility is $0.015$. Using
          $\sigma(T)=\sigma(1)\sqrt T$, what is its volatility over a $100$-day
          period?
        expects: "0.15"
        hint: >
          Take $\sqrt{100}=10$ and multiply by the daily figure.
        feedback: >
          $\sigma(100)=0.015\times\sqrt{100}=0.015\times10=0.15$ — a tenfold
          horizon produces only a tenfold volatility, since $\sqrt{100}=10$.
      - teach: >
          Drift, by contrast, is linear in $T$, so the ratio $\mu/\sigma$ — the
          Sharpe ratio — itself scales as $\sqrt T$ for a structurally
          different reason than volatility does, even though the identical
          factor $\sqrt{252}\approx16$ ends up converting both.
      - ask: >
          An annual volatility is $0.4$. Using $\sigma(T)=\sigma(1)\sqrt T$
          with $T=0.25$ years, what is the equivalent quarterly volatility?
        expects: "0.2"
        hint: >
          $\sqrt{0.25}=0.5$; multiply by the annual figure.
        feedback: >
          $\sigma(0.25)=0.4\times\sqrt{0.25}=0.4\times0.5=0.2$ — the identity
          runs equally well from a longer horizon down to a shorter one.
      - teach: >
          The rule leans on one silent assumption: the periods being added must
          be genuinely uncorrelated. A trending series accumulates risk faster
          than $\sqrt T$; a mean-reverting one accumulates slower — applying
          the rule blindly to either is the standard trap.
      - ask: >
          Daily Sharpe ratio is $0.05$. Using $\sqrt{252}\approx16$, what is
          the annualized Sharpe ratio?
        choices:
          - text: >
              $0.05\times16 = 0.8$
            correct: true
            feedback: >
              Sharpe ratio scales like $\sqrt T$, the same factor as
              volatility, for a structurally different but numerically
              identical reason — multiply by $\sqrt{252}\approx16$.
          - text: >
              $0.05/16 \approx 0.003$
            feedback: >
              Dividing runs the conversion backward — annualizing should
              increase the reported Sharpe ratio, not shrink it.
          - text: >
              $0.05\times252 = 12.6$
            feedback: >
              This treats Sharpe ratio like a purely linear quantity, but it is
              a ratio of a linear-in-$T$ term to a $\sqrt T$ term, so it scales
              as $\sqrt T$, not $T$.
          - text: >
              $0.05$, unchanged
            feedback: >
              Sharpe ratio is horizon-dependent — quoting it without converting
              the horizon compares different quantities.
        feedback: >
          Sharpe ratio annualizes by the same $\sqrt{252}\approx16$ factor as
          volatility, since it is the ratio of drift (linear in $T$) to
          volatility ($\sqrt T$).

  - node: quant-processes.brownian.arcsine
    hook: >
      "In a long, fair coin-flipping game, roughly what fraction of the time
      is one player ahead" has a genuinely surprising answer — not "about
      half," but "usually almost all of it, for one side or the other."
    explanation: >
      With probability $1$, the set of times the path is exactly at $0$
      during $[0,1]$ has Lebesgue measure $0$ yet is infinite and
      uncountable — self-similarity means that immediately after any zero,
      there are infinitely many more zeros nearby, arbitrarily close in time.
      This is the same mechanism behind hitting any level having infinite
      expected waiting time despite happening for certain: crossings recur,
      but the gaps between them have a heavy enough tail that long stretches
      with no crossing at all are typical, not rare.

      Let $A$ be the fraction of $[0,1]$ during which the path is positive.
      The arcsine law gives $\Pr(A\le x)=\frac2\pi\arcsin\sqrt x$, with
      density $1/(\pi\sqrt{x(1-x)})$ — a density that is U-shaped, piling up
      near both $x=0$ and $x=1$, and thin in the middle. The mean of $A$ is
      exactly $1/2$ by symmetry, but for a U-shaped density the mean is
      precisely the least typical outcome, not the most likely one.

      The same heavy-tailed-gaps intuition that makes hitting time have
      infinite mean is what makes leads sticky here: once one side pulls
      ahead, the long gaps between zero crossings mean it tends to stay ahead
      for a large share of the remaining time, not a symmetric half.
    worked: >
      What's the chance one side leads for at least $75\%$ of the game
      (equivalently, is behind for at most $25\%$)?
      $\Pr(A\le0.25)=\frac2\pi\arcsin\sqrt{0.25}=\frac2\pi\arcsin(0.5)=
      \frac2\pi\cdot\frac\pi6=\frac13$ exactly. By symmetry
      $\Pr(A\ge0.75)=\frac13$ too, so there is a full $2/3$ chance the game
      ends up lopsided at least $75/25$ in one direction or the other — a
      near-even split is the minority outcome.
    interview: >
      "Over a long fair game, what fraction of the time is the winner
      actually ahead" tests whether you reach for "about half" (wrong) or
      name the arcsine law and its U-shaped density explicitly — "leads are
      sticky" is the one-line answer to have ready.
    pitfalls: >
      Assuming a fair, symmetric game implies a roughly even split of lead
      time — the density is lowest exactly at $1/2$, the intuitive guess.
      Treating the mean $1/2$ as describing a typical outcome; for this
      U-shaped law the mean is an outlier, not a mode.
    recap: >
      The fraction of time one side leads in a fair game follows the
      U-shaped arcsine law, so a near-even split is the rare outcome and one
      side usually dominates almost the whole game.
    steps:
      - teach: >
          "In a long, fair coin-flipping game, roughly what fraction of the
          time is one player ahead" has a genuinely surprising answer — not
          "about half," but "usually almost all of it, for one side or the
          other."
      - teach: >
          Let $A$ be the fraction of $[0,1]$ during which the path is positive.
          The arcsine law gives $\Pr(A\le x)=\frac2\pi\arcsin\sqrt x$, with
          density $1/(\pi\sqrt{x(1-x)})$ — U-shaped, piling up near both $x=0$
          and $x=1$.
      - ask: >
          By symmetry of the arcsine law about $x=1/2$, what is $\Pr(A \le
          0.5)$?
        expects: "0.5"
        hint: >
          $\arcsin\sqrt{0.5}=\pi/4$; plug into $\frac2\pi\arcsin\sqrt x$.
        feedback: >
          $\Pr(A\le0.5)=\frac2\pi\arcsin\sqrt{0.5}=\frac2\pi\cdot\frac\pi4=0.5$
          — the arcsine density is symmetric about $1/2$, so this is the
          midpoint of the distribution, not a typical value of it.
      - teach: >
          The zero set of $B$ on $[0,1]$ has Lebesgue measure $0$ yet is
          infinite and uncountable — self-similarity means the path recrosses
          immediately after every zero, the same heavy-tailed-gaps mechanism
          behind hitting times having infinite expected wait despite happening
          for certain.
      - ask: >
          What is $\Pr(A \le 0.1464)$?
        expects: "0.25"
        tolerance: 0.0005
        hint: >
          $\sqrt{0.1464}\approx\sin(\pi/8)$, so
          $\arcsin\sqrt{0.1464}\approx\pi/8$.
        feedback: >
          $0.1464\approx\sin^2(\pi/8)$, so $\arcsin\sqrt{0.1464}\approx\pi/8$,
          giving $\Pr(A\le0.1464)=\frac2\pi\cdot\frac\pi8=0.25$.
      - teach: >
          The mean of $A$ is exactly $1/2$ by symmetry, but for a U-shaped
          density the mean is precisely the *least* typical outcome — the
          density is lowest right at $1/2$, so a near-even split of the lead is
          the rare case, not the expected one.
      - ask: >
          In a long fair coin-flipping game, which is closest to the truth
          about the fraction of time one player leads?
        choices:
          - text: >
              It's usually close to $1/2$, since the game is fair
            feedback: >
              This is the classic trap — "fair" describes each flip, not the
              shape of the lead-time distribution, which is U-shaped and lowest
              exactly at $1/2$.
          - text: >
              It's usually close to $0$ or close to $1$ — one side tends to
              lead almost the entire game
            correct: true
            feedback: >
              The U-shaped arcsine density piles up at the endpoints — "leads
              are sticky," and a near-even split is the minority outcome.
          - text: >
              It is uniformly distributed across $[0,1]$
            feedback: >
              The density $1/(\pi\sqrt{x(1-x)})$ is far from flat — it is
              U-shaped, not uniform.
          - text: >
              It always equals exactly $1/2$ in a fair game
            feedback: >
              This confuses the mean of $A$, which is $1/2$, with a claim that
              $A$ itself is deterministic — $A$ is genuinely random, and $1/2$
              is its least likely value.
        feedback: >
          The arcsine density is U-shaped, lowest at $1/2$ and highest near $0$
          and $1$ — the mean $1/2$ describes an outlier, not a typical outcome.
