unit: quant-processes.brownian
opening: >
  Brownian motion is what a random walk becomes once the step size shrinks to
  nothing and the step count grows without bound — the continuum limit that
  turns the walk arsenal from earlier units into calculus-ready objects. This
  unit builds the process from four defining properties, extracts its
  symmetries, martingales, and covariance structure, then spends its second
  half on the questions an interview actually asks: how far does the path
  wander, when does it first hit a level, and what happens once a
  deterministic drift is layered on top. It closes with quadratic variation —
  the single fact that squared increments accumulate to elapsed time rather
  than vanishing — which both explains why the path is nowhere differentiable
  and sets up the stochastic calculus built in the next unit.
lessons:
  - node: quant-processes.brownian.bm
    hook: >
      "Define Brownian motion" opens almost every continuous-time interview
      question, and the tell that separates a memorized label from real
      understanding is knowing which of the four properties is doing the
      actual work and which is a stipulated technical assumption.
    explanation: >
      Think of Brownian motion as what a random walk becomes once you let the
      step size shrink and the step count grow without bound: infinitely many
      infinitesimal, independent nudges accumulating into a continuous path.
      The four defining properties pin that idea down precisely enough to
      compute with. $B_0=0$ fixes the starting point; independent increments
      say tomorrow's move carries no information from yesterday's; stationary
      Gaussian increments say the law of a move depends only on how much time
      elapsed, never on the calendar time or the current level; and
      continuity rules out any process that would otherwise satisfy the first
      three by jumping.

      The Gaussian shape is not an extra assumption bolted onto independence
      and stationarity — it is close to forced. Split $[0,t]$ into $n$ equal
      pieces; $B_t$ is the sum of $n$ independent, identically distributed
      increments, and summing independent normals produces a normal, so
      consistency alone pins the increment law down to Gaussian. What
      independence buys computationally is that variance is additive:
      $\operatorname{Var}(B_t)=\sum_{i=1}^{n}\operatorname{Var}(B_{it/n}-B_{(i-1)t/n})=n\cdot(t/n)=t$,
      exactly, regardless of $n$.

      Continuity is the one property genuinely doing new work — it is not
      implied by the other three, and Wiener had to prove such a process
      exists at all. Take it as given in an interview; everything downstream
      is squeezed out of these four facts and nothing else.
    worked: >
      Let $B_3$ denote the position at time $3$. Then $B_3\sim N(0,3)$, so
      $\Pr(B_3>3)=\Pr(Z>3/\sqrt3)=\Pr(Z>\sqrt3)\approx\Pr(Z>1.732)\approx0.0416$:
      a move of a full three units by time $3$ is already a rare, roughly
      $4\%$ event, since the standard deviation at $t=3$ is only
      $\sqrt3\approx1.73$.
    interview: >
      "Define Brownian motion" and "why is $B_t$ normal, not just symmetric"
      are the standard openers — answer with all four properties in one
      breath, and be ready to say that continuity is the one true assumption
      while the Gaussian shape follows from consistency under
      increment-splitting.
    pitfalls: >
      Treating "independent increments" as merely "uncorrelated increments"
      understates the hypothesis — full independence is what licenses
      splitting into normal sums freely. Writing $B_t\sim N(0,t^2)$ instead of
      $N(0,t)$ — the variance is the elapsed time itself, not its square, so
      the standard deviation is $\sqrt t$, not $t$.
    recap: >
      Brownian motion is the process built from independent, stationary
      $N(0,\Delta t)$ increments started at $0$ with continuous paths — four
      facts, and everything else in this unit is derived from them.

  - node: quant-processes.brownian.walk-limit
    hook: >
      Donsker's invariance principle is the reason every random-walk formula
      you already know reappears with $\sqrt n$ swapped for $\sqrt t$ — the
      interview isn't testing two separate topics, just one applied twice.
    explanation: >
      Fix a time $t$ and look only at the walk's rescaled position there:
      $W_t^{(n)}=S_{\lfloor nt\rfloor}/\sqrt n$ is a sum of about $nt$
      independent $\pm1$ steps divided by $\sqrt n$, which is exactly the
      standardized-sum setup the central limit theorem is built for. Reading
      off the CLT with $nt$ steps in place of $n$ gives $W_t^{(n)}\to N(0,t)$
      — the single-time marginal is nothing beyond a relabeled CLT.

      What Donsker's theorem adds is that this convergence holds
      simultaneously across every time and every joint block of times, not
      just one snapshot. Steps in disjoint time windows are independent by
      construction of the simple symmetric random walk, and independence of
      disjoint blocks survives the rescaling, so the limiting object inherits
      independent increments too — that is what assembles a full Brownian
      path rather than a family of separately-normal snapshots that might
      secretly be correlated with each other.

      Two consequences worth carrying forward: the limit doesn't care about
      the shape of one step, only its mean $0$ and variance $\sigma^2$ — a
      walk with different steps, biased-but-recentered, converges to the
      identical Brownian motion (scaled by $\sigma$) as the $\pm1$ walk. And
      any exact walk formula — reflection, hitting probabilities, maxima —
      survives into the continuum with $\sqrt n$ replaced by $\sqrt t$,
      because it was proved using only the ingredients this convergence
      preserves.
    worked: >
      Take a fair $\pm1$ walk with $n=10000$ steps. The rescaled endpoint
      $W_1^{(n)}=S_{10000}/100$ is approximately standard normal, so
      $\Pr(S_{10000}>150)=\Pr(W_1^{(n)}>1.5)\approx1-\Phi(1.5)\approx0.0668$ —
      a direct CLT computation dressed as a Brownian-motion tail probability,
      since $150/\sqrt{10000}=1.5$.
    interview: >
      "Why does a random walk look like Brownian motion when you zoom out"
      wants Donsker named specifically, not just "CLT" — the interviewer is
      listening for the extra claim that whole paths converge jointly, plus
      the universality over step distributions.
    pitfalls: >
      Quoting only the single-time CLT limit and missing that the theorem's
      real content is convergence of the whole path, including joint behavior
      across times. Forgetting the finite-variance requirement on the step
      law — a step distribution with infinite variance does not converge to
      Brownian motion at all, however it's rescaled.
    recap: >
      Rescale a random walk by $\sqrt n$ in space and $n$ in time and it
      converges to Brownian motion — the CLT applied not to one endpoint but
      to the whole path at once, for any mean-$0$, finite-variance step.

  - node: quant-processes.brownian.scaling
    hook: >
      "If I stretch the time axis, how does Brownian motion's spread change"
      is the standing question behind every horizon-conversion problem, and
      the honest answer is a square root, not a linear factor.
    explanation: >
      Rescale time by a factor $c$ and rescale space by $\sqrt c$ at the same
      time, and nothing about the process changes: $\tilde B_t=c^{-1/2}B_{ct}$
      is again a standard Brownian motion. The only fact that needs checking
      is the variance, and it collapses to one line:
      $\operatorname{Var}(c^{-1/2}B_{ct})=c^{-1}\cdot\operatorname{Var}(B_{ct})=c^{-1}\cdot ct=t$
      — independence and stationarity of the increments carry over
      automatically under any linear rescaling, so variance matching is the
      entire content of the claim.

      Three companion symmetries fall out of the same four defining
      properties: flipping the sign ($-B_t$), sliding the origin to any fixed
      time ($B_{t_0+t}-B_{t_0}$), and even inverting time ($tB_{1/t}$, patched
      to $0$ at $t=0$) each again satisfy independent stationary Gaussian
      increments started at $0$ with continuous paths, so each is again a
      standard Brownian motion.

      The practical payoff is the $\sqrt t$ law for typical displacement:
      since $\mathbb{E}|B_t|=\sqrt{2t/\pi}$, going from $t$ to $4t$ only
      doubles the expected spread, not quadruples it. A plot of the path over
      $[0,1]$ and a plot over $[0,100]$ are statistically the same picture
      with the axis labels rescaled — there's no characteristic timescale at
      which the path suddenly looks different.
    worked: >
      Compare a $9$-year horizon to a $1$-year horizon: $\mathbb{E}|B_1|=
      \sqrt{2/\pi}\approx0.798$ and $\mathbb{E}|B_9|=\sqrt{18/\pi}\approx2.395$
      — exactly a factor of $3=\sqrt9$ apart, not $9$. Distance traveled
      triples, not nine-folds, over nine times the time.
    interview: >
      "If volatility over one day is $x$, what's volatility over four days"
      is this proposition disguised as a finance question — the expected
      answer is a factor of $\sqrt4=2$, and a sharp interviewer will ask you
      to justify it from independence of increments rather than just cite the
      rule.
    pitfalls: >
      Assuming displacement scales linearly with elapsed time — a natural but
      wrong instinct carried over from deterministic motion. Rescaling time
      without simultaneously rescaling space by $\sqrt c$ breaks the
      identity; the two rescalings only cancel together.
    recap: >
      Shrink time by $c$ and space by $\sqrt c$ together and Brownian motion
      is unchanged in law, which is exactly why displacement grows like
      $\sqrt t$ rather than $t$.

  - node: quant-processes.brownian.covariance
    hook: >
      "What's the correlation between the process at two different times" is
      a standard opener, and the clean answer, $\sqrt{s/t}$, only falls out
      once you stop assuming $B_s$ and $B_t$ are independent just because
      increments are.
    explanation: >
      $B_s$ and $B_t$ are not independent even though increments are — $B_t$
      literally contains $B_s$ as a summand. Write $B_t=B_s+(B_t-B_s)$: the
      two pieces are independent by definition, so
      $\operatorname{Cov}(B_s,B_t)=\operatorname{Cov}(B_s,B_s)+\operatorname{Cov}(B_s,B_t-B_s)=\operatorname{Var}(B_s)+0=s$,
      for $s\le t$. Swapping the roles for the general case gives
      $\operatorname{Cov}(B_s,B_t)=\min(s,t)$ — covariance is exactly the
      shared elapsed time, the part of the path both values have lived
      through together.

      Dividing by the standard deviations gives
      $\operatorname{Corr}(B_s,B_t)=\sqrt{s/t}$ for $s\le t$: two
      nearby-in-time values are highly correlated, but correlation decays
      only like a square root, not proportionally, as the gap widens.

      Because every finite collection $(B_{t_1},\dots,B_{t_n})$ is a linear
      combination of the same underlying independent normal increments, it is
      automatically jointly Gaussian — so "mean-zero Gaussian process with
      covariance $\min(s,t)$ and continuous paths" is a complete, equivalent
      definition of Brownian motion. Joint Gaussianity makes conditioning
      linear: given $B_T=x$, the earlier value $B_t$ ($t<T$) is normal with
      mean $(t/T)x$ and variance $t(T-t)/T$ — largest uncertainty at the
      midpoint, shrinking to $0$ at both ends where the value is pinned. That
      conditioned path is the Brownian bridge.
    worked: >
      Suppose $B_{16}=8$ is observed. The value at $t=4$ is normal with mean
      $(4/16)\times8=2$ and variance $4\times12/16=3$, so a $95\%$ band for
      $B_4$ is roughly $2\pm1.96\sqrt3\approx2\pm3.39$, i.e. about
      $(-1.39,5.39)$ — noticeably tighter than the unconditional $N(0,4)$ law
      of $B_4$ alone, because knowing the endpoint constrains the path in
      between.
    interview: >
      "What's $\operatorname{Cov}(B_s,B_t)$" and "given the value at time
      $10$, what's the distribution at time $3$" are both standard — answer
      $\min(s,t)$ instantly and the bridge mean/variance formula on request,
      without re-deriving from scratch.
    pitfalls: >
      Assuming $B_s$ and $B_t$ are independent because increments are
      independent — they overlap in the interval $[0,\min(s,t)]$ and share
      exactly that much covariance. Reversing $s$ and $t$ inside $\min$ or
      plugging the larger time into the shared role gives a covariance
      exceeding either variance, which is impossible.
    recap: >
      $\operatorname{Cov}(B_s,B_t)=\min(s,t)$ because the two values share
      exactly the path up to the earlier time, and conditioning on a later
      value is linear with variance shrinking to $0$ at the pinned endpoints.

  - node: quant-processes.brownian.markov-property
    hook: >
      "Why can you treat the path as starting over the moment it first hits a
      barrier" is the question every reflection-style argument depends on
      answering correctly, and the honest answer needs the strong Markov
      property, not just the ordinary one.
    explanation: >
      The ordinary Markov property is nothing new: fix a deterministic time
      $s$ and look at $W_t=B_{s+t}-B_s$. This is precisely one increment of
      the base process, so by the defining independent stationary increments
      it is itself a standard Brownian motion, independent of everything that
      happened up to time $s$. No extra argument is needed — the property is
      baked into the four defining facts.

      The strong Markov property is the real upgrade: it replaces the fixed
      time $s$ with a random one, a stopping time $\tau$ — a random time
      whose occurrence by any given moment is decidable from the path up to
      that moment alone, with no lookahead. Provided $\tau$ is almost surely
      finite, $W_t=B_{\tau+t}-B_\tau$ is again a standard Brownian motion,
      independent of the path up to $\tau$. This does not follow for free
      from the ordinary property, because $\tau$ itself is random and could
      in principle depend on the future — the theorem's content is precisely
      that stopping times don't let that happen.

      The mental model: whatever the path is doing — hitting a level for the
      first time, setting a fresh record — the instant that event happens,
      the process has no memory of how it got there and restarts as a fresh
      Brownian motion. Every argument that resets the clock at a hitting
      time, most importantly the reflection principle, is an application of
      exactly this fact.
    worked: >
      Suppose $B_5=2$. By the ordinary Markov property, $W_t=B_{5+t}-2$ is a
      fresh Brownian motion, so
      $\Pr(B_8>6\mid B_5=2)=\Pr(W_3>4)=1-\Phi(4/\sqrt3)=1-\Phi(2.31)\approx0.0104$
      — a routine conditional tail probability computed by shifting the
      origin to the known value and treating the remaining $3$ time units as
      an ordinary Brownian increment.
    interview: >
      "State the strong Markov property and say why the reflection principle
      needs it" checks that you can name a stopping time correctly (first
      hitting time, yes; time of the eventual maximum, no) and that you know
      the restarted process is independent of the entire past path, not
      merely of the value $B_\tau$.
    pitfalls: >
      Applying the strong Markov property at a time that is not a stopping
      time — "the time the maximum occurs" requires knowledge of the whole
      future path and voids the argument. Concluding independence only from
      $B_\tau$ rather than from the full history $\mathcal F_\tau$ misses
      what the theorem actually grants.
    recap: >
      At any stopping time, not just a fixed time, the future increment of
      Brownian motion is again a standard Brownian motion independent of
      everything before — the license behind every "restart the clock"
      argument.

  - node: quant-processes.brownian.martingale-property
    hook: >
      These three formulas are the entire toolkit for "find this hitting
      probability" or "find this expected exit time" questions without ever
      writing down a differential equation — memorize which one answers which
      question.
    explanation: >
      $B_t$ itself is a martingale for the trivial reason that future
      increments have mean zero: $\mathbb{E}[B_t\mid\mathcal F_s]=B_s+
      \mathbb{E}[B_t-B_s\mid\mathcal F_s]=B_s+0$, using independence of the
      increment from the past. This is the tool for probability questions —
      a bounded stopped version of $B_t$ conserves its expected value
      exactly, which is what pins down hitting probabilities at two barriers.

      $B_t^2-t$ compensates the natural growth of a squared
      martingale-increment process. Expanding $B_t=B_s+(B_t-B_s)$ and using
      that the increment is independent of the past with mean $0$ and
      variance $t-s$ gives $\mathbb{E}[B_t^2\mid\mathcal F_s]=B_s^2+(t-s)$, so
      subtracting $t$ exactly cancels the growth:
      $\mathbb{E}[B_t^2-t\mid\mathcal F_s]=B_s^2-s$. This is the tool for time
      questions — it converts expected exit time into an algebraic identity.

      The exponential martingale $\exp(\lambda B_t-\lambda^2t/2)$ compensates
      growth of a different kind: it is just the normal moment generating
      function $\mathbb{E}[e^{\lambda(B_t-B_s)}]=e^{\lambda^2(t-s)/2}$
      rearranged so the compensation is folded directly into the process. It
      holds for every real $\lambda$, which is what makes it flexible enough
      to handle drift later — choosing $\lambda$ to cancel a drift term is
      the standard trick for hitting problems on a process that isn't
      driftless.
    worked: >
      Check the second martingale numerically: with $s=4,t=9$ and $B_4=2$,
      the claim is $\mathbb{E}[B_9^2-9\mid B_4=2]=2^2-4=0$. Indeed
      $\mathbb{E}[B_9^2\mid B_4=2]=B_4^2+(9-4)=4+5=9$, so
      $\mathbb{E}[B_9^2-9\mid B_4=2]=9-9=0$ exactly, confirming the
      compensation.
    interview: >
      "Name the martingales you get from Brownian motion" is asked directly,
      or folded into "how would you find the expected time to hit a barrier"
      — a strong answer names all three unprompted and states which one
      answers a probability question versus a time question.
    pitfalls: >
      Treating $B_t^2$ alone as a martingale — it isn't; it is a
      submartingale, growing in expectation, and the $-t$ compensation is not
      optional. Dropping the $-\lambda^2t/2$ term from the exponential
      martingale, or getting its sign wrong, breaks the entire construction.
    recap: >
      $B_t$, $B_t^2-t$, and $\exp(\lambda B_t-\lambda^2t/2)$ are martingales
      for every real $\lambda$ — the first answers probability questions, the
      second answers expected-time questions, and the third generalizes both
      once drift is involved.

  - node: quant-processes.brownian.quadratic-variation
    hook: >
      "$(dB)^2=dt$" is the one line that explains why stochastic calculus
      needs its own chain rule — the single place where ordinary calculus's
      intuition, that $dx^2$ is negligible, fails outright for Brownian
      paths.
    explanation: >
      Partition $[0,t]$ finely and sum the squared increments,
      $\sum_i(B_{t_i}-B_{t_{i-1}})^2$. Each squared increment has mean
      $\Delta_i=t_i-t_{i-1}$ exactly — by the $\sqrt t$ scaling of Brownian
      motion, $\operatorname{Var}(B_{t_i}-B_{t_{i-1}})=\Delta_i$ — so the
      sum's mean is $\sum_i\Delta_i=t$ for every partition, with no limit
      needed yet.

      What needs the limit is the variance shrinking to zero. A standard
      normal has $\operatorname{Var}(Z^2)=2$, so the $i$-th squared increment
      has variance $2\Delta_i^2$; summing across independent pieces gives
      total variance $2\sum_i\Delta_i^2\le2t\max_i\Delta_i$, which vanishes as
      the mesh $\max_i\Delta_i\to0$. Mean exactly $t$, variance shrinking to
      $0$: the sum converges to $t$ itself, deterministically, written
      $\langle B\rangle_t=t$.

      Contrast this with any continuously differentiable path, whose
      quadratic variation is always $0$ — squared increments there really are
      negligible in the limit, exactly the intuition ordinary calculus relies
      on. Brownian increments are order $\sqrt{\Delta_i}$, not
      $O(\Delta_i)$, so their squares are order $\Delta_i$ — the same order
      as $dt$ itself, not smaller. That order-of-magnitude mismatch is why a
      naive Riemann-sum treatment of integrals against $B$ fails, and it is
      the second-order term that survives in Itô's lemma.
    worked: >
      Partition $[0,1]$ into $n=100$ equal pieces, $\Delta_i=0.01$. The sum of
      squared increments has mean exactly $\sum_i0.01=1$ for every $n$, but
      its variance is $2\times100\times0.01^2=0.02$ at $n=100$; at $n=10000$
      the same computation gives variance $2\times10000\times0.0001^2=0.0002$
      — shrinking by a factor of $100$ as the mesh shrinks by $100$,
      confirming the sum concentrates tightly around $1=t$.
    interview: >
      "Why is $(dB)^2=dt$ and not $0$" wants the two-line argument: the mean
      of the squared-increment sum is exactly $t$ for any partition, and its
      variance vanishes as the mesh shrinks — say both, not just the informal
      notation.
    pitfalls: >
      Carrying over the ordinary-calculus habit of treating squared
      increments as negligible — here they accumulate to a nonzero,
      deterministic limit. Thinking of quadratic variation as a random
      quantity that merely tends to be near $t$; it converges in $L^2$ to the
      fixed number $t$, not to a random variable.
    recap: >
      Summed squared increments of Brownian motion converge to the elapsed
      time $t$ itself, not to $0$ — the fact that makes stochastic calculus
      genuinely different from ordinary calculus.

  - node: quant-processes.brownian.nondifferentiability
    hook: >
      "Is Brownian motion differentiable" is a fast disqualifying question,
      and the reason it fails is exactly the reason a P&L path can't be
      treated with an ordinary instantaneous rate of change.
    explanation: >
      Over a window of length $h$, a Brownian increment is of typical size
      $\sqrt h$, so the difference quotient $(B_{t+h}-B_t)/h$ is of order
      $\sqrt h/h=h^{-1/2}$ — this blows up, rather than settling down, as
      $h\to0$. That heuristic is not just suggestive; it is a theorem: with
      probability $1$, the path is differentiable at no time at all, and it
      has infinite total variation on every interval, however short.

      The variation claim follows from quadratic variation directly. For any
      partition, $\sum_i(\Delta B_i)^2\le\left(\max_i|\Delta
      B_i|\right)\sum_i|\Delta B_i|$, and continuity sends $\max_i|\Delta
      B_i|\to0$ as the mesh shrinks. If the total variation $\sum_i|\Delta
      B_i|$ stayed bounded, the right side would vanish — forcing quadratic
      variation to $0$, which contradicts it converging to $t$. So total
      variation cannot be bounded; it is infinite on every interval.

      Quantifying the wiggle: paths are Hölder continuous of every order
      $\alpha<1/2$ but of no order $\alpha\ge1/2$ — the exact borderline set
      by the $\sqrt h$ increment size. Since ordinary integration theory
      needs the integrator to have finite variation, $\int f\,dB$ simply
      cannot be built path by path that way; this is precisely why stochastic
      integration needs its own construction.
    interview: >
      "Is Brownian motion differentiable, and can you sketch why" wants the
      $\sqrt h/h\to\infty$ heuristic produced immediately, followed by naming
      infinite total variation as the rigorous consequence — not just "no,
      it's too jagged."
    pitfalls: >
      Assuming continuity implies differentiability somewhere — false here;
      the failure is simultaneous at every single time, not merely at
      isolated points. Assuming a continuous, bounded path automatically has
      finite variation on a compact interval — that implication needs more
      than continuity, and Brownian motion is the standing counterexample.
    recap: >
      Increments of size $\sqrt h$ over windows of length $h$ send every
      difference quotient to infinity, so the path is nowhere differentiable
      and has infinite variation on every interval — the reason stochastic
      integration can't be built path by path.

  - node: quant-processes.brownian.reflection-bm
    hook: >
      "What's the probability the path ever touches level $a$ by time $t$" is
      answered by mirroring the path after its first touch, and the clean
      factor of $2$ this produces is worth having automatic.
    explanation: >
      Let $\tau_a$ be the first time the path reaches $a$. On the event
      $\tau_a\le t$, the strong Markov property restarts the process at $a$
      as a fresh, symmetric Brownian motion — equally likely to finish above
      or below $a$ by the remaining time. So among paths that have touched
      $a$ by time $t$, exactly half finish above $a$ and half finish below:
      $\Pr(M_t\ge a,\,B_t<a)=\Pr(M_t\ge a,\,B_t>a)$.

      The second half of that equality collapses further: finishing above
      $a$ already forces the running maximum above $a$, so $\Pr(M_t\ge
      a,\,B_t>a)=\Pr(B_t>a)$ outright — reaching the level is automatic once
      you've finished past it. Adding the two symmetric halves back together
      gives $\Pr(M_t\ge a)=2\Pr(B_t\ge a)$, and rewriting with the normal
      CDF, $\Pr(M_t\ge a)=2\left(1-\Phi(a/\sqrt t)\right)$.

      The same identity says something sharper: $\Pr(M_t\ge a)=\Pr(|B_t|\ge
      a)$ — the event "the path ever reaches $a$" has exactly the same
      probability as "the path ends up at least $a$ away from $0$ in either
      direction," a genuinely useful shortcut whenever a maximum needs
      converting into an ordinary tail probability.
    worked: >
      Take $a=0.5$, $t=4$: $\Pr(M_4\ge0.5)=2\left(1-\Phi(0.5/2)\right)=
      2\left(1-\Phi(0.25)\right)\approx2(1-0.5987)=0.8026$ — over $80\%$
      chance the path has drifted at least half a unit above $0$ at some
      point in the first four time units, versus only
      $\Pr(B_4\ge0.5)\approx0.4013$ chance of finishing there.
    interview: >
      "What's $\Pr(M_t\ge a)$" wants the mirror-argument sketch, not just the
      formula — say the strong Markov restart, the symmetric split, and the
      factor of $2$, then quote $2(1-\Phi(a/\sqrt t))$.
    pitfalls: >
      Reporting $\Pr(B_t\ge a)$ alone and forgetting to double it — this is
      only the "finished above $a$" half, missing every path that touched $a$
      and came back down. Plugging $a/t$ instead of $a/\sqrt t$ into $\Phi$
      mixes up the space and time scaling.
    recap: >
      $\Pr(M_t\ge a)=2\Pr(B_t\ge a)=\Pr(|B_t|\ge a)$: mirror the path after
      its first touch of $a$, and the ever-touching probability is exactly
      twice the finishing-beyond probability.

  - node: quant-processes.brownian.running-max-law
    hook: >
      "What's the expected high-water mark of a driftless log-price over a
      year" is a stock desk question, and the answer is a folded normal mean
      you should have memorized, not re-derived under time pressure.
    explanation: >
      Reflection says $M_t$ and $|B_t|$ share a distribution, so the running
      maximum's density is just the normal density folded onto the positive
      axis: $f_{M_t}(a)=\sqrt{2/(\pi t)}\,e^{-a^2/(2t)}$ for $a\ge0$. Every
      moment of $M_t$ is therefore a moment of $|B_t|$, computed off the
      ordinary normal — no new machinery, just the fold.

      The mean comes out to $\mathbb{E}[M_t]=\sqrt{2t/\pi}\approx0.798\sqrt
      t$, and since $M_t^2=B_t^2$ in law, $\mathbb{E}[M_t^2]=
      \mathbb{E}[B_t^2]=t$ exactly — giving
      $\operatorname{Var}(M_t)=t(1-2/\pi)\approx0.363t$. A trap hides in that
      second moment: it looks identical to $\mathbb{E}[B_t^2]$ because it is
      identical, but $M_t$ (the running peak over the whole interval) and
      $B_t$ (the value at the single endpoint) are different random variables
      that merely share this one moment.

      The joint law extends the reflection argument one step further:
      $\Pr(M_t\ge a,\,B_t\le b)=\Pr(B_t\ge2a-b)$ for $a\ge\max(b,0)$ — the
      endpoint $2a-b$ is $b$ mirrored across the level $a$, the same
      mirroring idea that proved the marginal formula. One more consequence
      worth keeping: the drawdown from the peak, $M_t-B_t$, again has the law
      of $|B_t|$ — the process forgets its own peak in the same way it
      forgets its own barrier crossings.
    worked: >
      A driftless log-price with $25\%$ annualized volatility has $B_t$
      scaled by $\sigma=0.25$, so the expected one-year high is
      $\sigma\sqrt{2/\pi}=0.25\times0.7979\approx0.1995$ — about a $20\%$
      expected peak above the starting level over the year, using nothing but
      the folded-normal mean scaled by the volatility.
    interview: >
      "What's the expected maximum of a driftless random walk (or
      log-price) over a horizon $T$" is answered cold with
      $\sigma\sqrt{2T/\pi}\approx0.8\sigma\sqrt T$; a sharp follow-up asks for
      the law of the drawdown from the peak, answered by naming it as another
      copy of $|B_t|$.
    pitfalls: >
      Confusing the numerically-identical-looking $\mathbb{E}[M_t^2]=t$ with
      a claim that $M_t$ and $B_t$ have the same distribution everywhere —
      they share only this one moment, not the full law (the mean already
      differs). Forgetting to rescale by $\sigma$ when the underlying process
      isn't standard Brownian motion.
    recap: >
      The running maximum is distributed as $|B_t|$, giving mean
      $\sqrt{2t/\pi}$ and variance $t(1-2/\pi)$, and the drawdown from that
      peak has the identical law.

  - node: quant-processes.brownian.hitting-time
    hook: >
      "The path hits every level with probability $1$, but the expected time
      to do so is infinite" sounds like a contradiction, and resolving it
      cleanly is a standard interview checkpoint.
    explanation: >
      The event "hit level $a$ by time $t$" is literally the event "the
      running maximum has reached $a$ by time $t$," so $\Pr(\tau_a\le
      t)=\Pr(M_t\ge a)=2\left(1-\Phi(a/\sqrt t)\right)$ falls straight out of
      the reflection principle with no new argument. Differentiating in $t$
      gives the density $f(t)=\dfrac{a}{\sqrt{2\pi t^3}}\,e^{-a^2/(2t)}$ for
      $t>0$.

      Sending $t\to\infty$ makes $\Phi(a/\sqrt t)\to\Phi(0)=1/2$, so
      $\Pr(\tau_a\le t)\to1$: every level is reached, eventually, with
      certainty. But "eventually, with certainty" and "in bounded expected
      time" are different claims — the density's tail behaves like
      $a\,t^{-3/2}/\sqrt{2\pi}$ for large $t$, and $\int^\infty
      t\cdot t^{-3/2}\,dt$ diverges, so $\mathbb{E}[\tau_a]=\infty$. The mass
      that makes the probability converge to $1$ is spread thin enough over
      an unbounded tail that the average waiting time is dominated by
      arbitrarily rare, arbitrarily long excursions the wrong way.

      Self-similarity fixes the shape across levels: $\tau_a$ has the same
      law as $a^2\tau_1$, so the typical wait — say, the median — costs
      quadratically in distance, at $\approx2.20a^2$, even while the mean
      stays infinite regardless of $a$.
    worked: >
      For $a=4$, the median hitting time is about $2.20\times16=35.2$ time
      units — half the time, level $4$ is reached within about $35$ units —
      while $\mathbb{E}[\tau_4]$ remains infinite regardless, since the
      divergence comes from the tail shape, not from the specific level.
    interview: >
      "Does Brownian motion hit every level, and what's the expected time to
      do so" wants both halves stated without hesitation: probability $1$ by
      sending $t\to\infty$ in the reflection formula, yet infinite
      expectation from the $t^{-3/2}$ tail — and the two are not in tension.
    pitfalls: >
      Assuming "happens with probability $1$" implies "happens in finite
      expected time" — this is the standard trap the whole node is built to
      catch. Forgetting the quadratic-in-distance scaling and guessing the
      median wait grows linearly in $a$ instead of as $a^2$.
    recap: >
      Brownian motion reaches any level with probability $1$ eventually, but
      the hitting time has a $t^{-3/2}$ tail heavy enough to make its
      expectation infinite, even as the median grows only like $a^2$.

  - node: quant-processes.brownian.two-sided-exit
    hook: >
      "Derive the two-barrier gambler's-ruin probability and expected
      duration for Brownian motion from scratch" is a standard whiteboard
      ask, and it comes out of the two simplest Brownian martingales in three
      lines each.
    explanation: >
      Fix barriers at $a>0$ above and $-b<0$ below, and let $\tau$ be the
      first exit time from $(-b,a)$; this $\tau$ is finite with probability
      $1$ and has finite mean, so both stopped martingales stay bounded
      enough for optional stopping to apply legally.

      Using the martingale $B_t$: optional stopping gives
      $0=\mathbb{E}[B_\tau]=ap-b(1-p)$, where $p$ is the probability of
      exiting at $a$ rather than $-b$. Solving, $p=b/(a+b)$ — the value of a
      fair game is conserved on average, so the exit probabilities must
      weight the two barriers inversely to their distance from $0$.

      Using the martingale $B_t^2-t$: optional stopping gives
      $\mathbb{E}[\tau]=\mathbb{E}[B_\tau^2]=a^2\cdot\dfrac{b}{a+b}+b^2\cdot
      \dfrac{a}{a+b}=ab$ — the compensated square converts the exit time
      directly into an algebraic expression once the exit distribution from
      the first martingale is already known. Symmetric barriers, $a=b$,
      degenerate to a fair coin flip with $\mathbb{E}[\tau]=a^2$; sending
      $b\to\infty$ recovers certain eventual hitting of $a$ ($p\to1$)
      alongside $\mathbb{E}[\tau]=ab\to\infty$ — exactly the
      sure-but-infinite-mean hitting-time fact from a different angle.
    worked: >
      With $a=3$, $b=6$: $p=6/9=2/3$, so the path is twice as likely to reach
      $3$ before $-6$ as the reverse, and $\mathbb{E}[\tau]=3\times6=18$ time
      units — both read off the two martingales with no further computation.
    interview: >
      "Derive the ruin probability and expected duration for Brownian motion
      between two barriers" is answered by naming both martingales
      explicitly and running optional stopping on each — the interviewer is
      checking that you know which martingale answers which question, not
      just that you can recite $b/(a+b)$.
    pitfalls: >
      Applying optional stopping without checking that $\tau$ has finite mean
      and the stopped process is bounded — both barriers being finite is
      exactly what makes this legal. Mixing up which martingale produces the
      probability versus the time: $B_t$ gives $p$, $B_t^2-t$ gives
      $\mathbb{E}[\tau]$, never the reverse.
    recap: >
      Two Brownian martingales solve the two-barrier exit problem completely:
      $B_t$ gives $\Pr(\text{hit }a\text{ first})=b/(a+b)$, and $B_t^2-t$
      gives $\mathbb{E}[\tau]=ab$.

  - node: quant-processes.brownian.bm-with-drift
    hook: >
      "Why does it take years, not months, to statistically confirm a
      trading edge" has an exact answer once you write the strategy's
      cumulative P&L as drift plus Brownian noise and compare how each term
      grows.
    explanation: >
      Arithmetic Brownian motion tilts the driftless process by a
      deterministic linear term: $X_t=x_0+\mu t+\sigma B_t$. Since $B_t$ has
      independent increments, so does $X_t$, and $X_t\sim N(x_0+\mu
      t,\,\sigma^2t)$ follows immediately from the base process's normality
      plus the fixed shift and scale.

      The two terms grow at genuinely different rates: the signal, $\mu t$,
      grows linearly in time, while the noise, $\sigma\sqrt t$, grows only as
      a square root. Their ratio is $\mu t/(\sigma\sqrt t)=(\mu/\sigma)\sqrt
      t$ — a quantity that grows without bound, but only at the crawling
      $\sqrt t$ rate. Read annually, $\mu/\sigma$ is exactly the Sharpe
      ratio, and its slow growth is the entire reason a real trading edge is
      statistically invisible over a short track record even when it's
      genuinely there.

      The same construction applied to the log price rather than the raw
      price, $\log S_t=\log S_0+\mu t+\sigma B_t$, is geometric Brownian
      motion — the standard continuous-time model for a positive asset price,
      built by exponentiating this exact object.
    worked: >
      A strategy with $\mu=12\%$ and $\sigma=20\%$ per year has Sharpe ratio
      $0.6$. Separating its drift from zero at three standard errors needs
      $0.6\sqrt t=3$, i.e. $\sqrt t=5$, so $t=25$ years — a strategy with a
      genuine, moderate edge needs a quarter-century of track record before
      the signal clears three noise units.
    interview: >
      "Write down Brownian motion with drift and explain why detecting an
      edge is slow" wants $X_t=\mu t+\sigma B_t$ stated cold, followed by the
      $(\mu/\sigma)\sqrt t$ Sharpe-growth argument — the interviewer is
      testing whether you can connect a formula to the practical "why," not
      just recite it.
    pitfalls: >
      Assuming a longer backtest linearly improves confidence in an edge —
      confidence only accumulates at rate $\sqrt t$, not $t$. Comparing
      Sharpe ratios computed over mismatched horizons (daily versus annual)
      without converting first silently compares different quantities.
    recap: >
      $X_t=\mu t+\sigma B_t$ has signal growing like $t$ and noise growing
      only like $\sqrt t$, so their ratio — the Sharpe ratio — grows like
      $\sqrt t$, which is why real edges take a long track record to confirm
      statistically.

  - node: quant-processes.brownian.drift-hitting
    hook: >
      "What's the chance my strategy ever draws down $X\%$ even though it has
      a positive edge" is a desk-standard question, and the clean exponential
      answer comes from finding the one nonzero $\theta$ that turns the
      exponential martingale driftless.
    explanation: >
      For $X_t=\mu t+\sigma B_t$, the moment generating function
      $\mathbb{E}[e^{\theta X_t}]=e^{(\theta\mu+\theta^2\sigma^2/2)t}$ makes
      $e^{\theta X_t}$ a martingale exactly when the exponent's coefficient of
      $t$ vanishes — at $\theta=0$ trivially, and at the nontrivial root
      $\theta=-2\mu/\sigma^2$. That second root does the real work: it is the
      exact amount of exponential discounting needed to cancel the drift's
      steady push, leaving a genuinely fair game to apply optional stopping
      to.

      Running optional stopping with that root at the exit time from
      $(-b,a)$ gives $p\,e^{\theta a}+(1-p)e^{-\theta b}=1$, so
      $p=\dfrac{1-e^{-\theta b}}{e^{\theta a}-e^{-\theta b}}$ — and letting
      $\mu\to0$ (so $\theta\to0$) recovers the driftless answer $b/(a+b)$
      exactly, confirming the construction is a genuine generalization rather
      than a different formula.

      The one-sided limits are the version worth memorizing outright: for
      $\mu>0$, the chance of ever falling to $-b$ is $e^{-2\mu b/\sigma^2}$ —
      a positive edge doesn't prevent a drawdown, it only suppresses its
      probability exponentially in the drawdown size. Symmetrically, for
      $\mu<0$, $\Pr(\sup_tX_t\ge a)=e^{-2|\mu|a/\sigma^2}$.
    worked: >
      With $\mu=6\%$ and $\sigma=30\%$ per year, $2\mu/\sigma^2=2(0.06)/
      0.09\approx1.333$. The chance of ever suffering a $15\%$ drawdown is
      $e^{-1.333\times0.15}=e^{-0.2}\approx0.819$ — over $80\%$, despite the
      positive drift, because a modest edge against sizable volatility barely
      dents how often a moderate drawdown occurs.
    interview: >
      "Given a positive Sharpe ratio, what's the probability of ever seeing a
      $b\%$ drawdown" is answered directly with $e^{-2\mu b/\sigma^2}$; a
      sharp follow-up asks you to check that letting $\mu\to0$ recovers the
      plain two-barrier ruin formula, confirming you understand it as the
      general case, not a separate fact.
    pitfalls: >
      Using the one-sided drawdown formula when $\mu$ has the wrong sign for
      the event asked about — with $\mu<0$ that downside event is certain,
      and the exponential formula instead governs the upside. Forgetting
      that the two-sided formula needs both barriers finite for optional
      stopping to be legal at all.
    recap: >
      The nonzero root $\theta=-2\mu/\sigma^2$ of the exponential martingale
      turns a drifted process driftless for optional-stopping purposes,
      giving $e^{-2\mu b/\sigma^2}$ for the chance of an eventual drawdown of
      size $b$ under positive drift.

  - node: quant-processes.brownian.vol-scaling
    hook: >
      "Vol of $16$ means about a percent a day" is desk shorthand every
      interview volatility-conversion question is secretly testing, and it's
      just the $\sqrt T$ scaling rule run in one direction or the other.
    explanation: >
      Because $\operatorname{Var}(B_t)=t$, variances over disjoint time
      periods simply add — no covariance term to worry about, since the
      periods' increments are independent. Standard deviations, being square
      roots of variance, therefore add in quadrature rather than linearly:
      $\sigma(T)=\sigma(1)\sqrt T$. Reach for this identity every time a
      quoted volatility needs to move from one horizon to another.

      The exponent $T$ is a count of independent periods, not calendar time,
      which is why the standard desk factor is $\sqrt{252}\approx16$ — $252$
      trading days, not $365$ — and the identity keeps working below a day:
      with $6.5$ trading hours in a session, hourly and annual volatility are
      $\sqrt{252\times6.5}=\sqrt{1638}\approx40.5$ apart, so a $20\%$ annual
      volatility implies roughly $20/40.5\approx0.49\%$ per trading hour.

      Drift, by contrast, is linear in $T$, not $\sqrt T$ — the mean of the
      drift term scales as $t$, so the ratio $\mu/\sigma$ (the Sharpe ratio)
      itself scales as $\sqrt T$: a daily Sharpe multiplies by
      $\sqrt{252}\approx16$ to annualize, the identical factor as the
      volatility conversion, for a structurally different reason. All of this
      leans on one silent assumption: the periods being added must be
      genuinely uncorrelated. A trending series accumulates risk faster than
      $\sqrt T$; a mean-reverting one accumulates slower.
    worked: >
      A fund reports weekly return volatility of $3\%$. Annualizing over
      $52$ weeks: $\sqrt{52}\approx7.21$, so annual volatility is
      $3\%\times7.21\approx21.6\%$ — the identical rule as the daily case,
      just with $52$ swapped in for $252$.
    interview: >
      "Convert this daily (or weekly, or monthly) volatility to annual, or
      the reverse" is answered on the spot with $\sigma(T)=\sigma(1)\sqrt T$,
      and $\sqrt{252}\approx16$ produced from memory as the standard
      daily-to-annual factor.
    pitfalls: >
      Scaling drift by $\sqrt T$ instead of $T$, or vice versa for
      volatility — the two quantities scale at genuinely different rates and
      mixing them up flips the Sharpe ratio computation. Applying the rule to
      a serially correlated return series, where the independence the whole
      identity leans on has already failed.
    recap: >
      Volatility scales as $\sigma(1)\sqrt T$ and drift scales as
      $\mu(1)T$, so Sharpe ratios scale as $\sqrt T$ too; $\sqrt{252}\approx
      16$ is the standard daily-to-annual conversion factor for all three.

  - node: quant-processes.brownian.arcsine
    hook: >
      "In a long, fair coin-flipping game, roughly what fraction of the time
      is one player ahead" has a genuinely surprising answer — not "about
      half," but "usually almost all of it, for one side or the other."
    explanation: >
      With probability $1$, the set of times the path is exactly at $0$
      during $[0,1]$ has Lebesgue measure $0$ yet is infinite and
      uncountable — self-similarity means that immediately after any zero,
      there are infinitely many more zeros nearby, arbitrarily close in time.
      This is the same mechanism behind hitting any level having infinite
      expected waiting time despite happening for certain: crossings recur,
      but the gaps between them have a heavy enough tail that long stretches
      with no crossing at all are typical, not rare.

      Let $A$ be the fraction of $[0,1]$ during which the path is positive.
      The arcsine law gives $\Pr(A\le x)=\frac2\pi\arcsin\sqrt x$, with
      density $1/(\pi\sqrt{x(1-x)})$ — a density that is U-shaped, piling up
      near both $x=0$ and $x=1$, and thin in the middle. The mean of $A$ is
      exactly $1/2$ by symmetry, but for a U-shaped density the mean is
      precisely the least typical outcome, not the most likely one.

      The same heavy-tailed-gaps intuition that makes hitting time have
      infinite mean is what makes leads sticky here: once one side pulls
      ahead, the long gaps between zero crossings mean it tends to stay ahead
      for a large share of the remaining time, not a symmetric half.
    worked: >
      What's the chance one side leads for at least $75\%$ of the game
      (equivalently, is behind for at most $25\%$)?
      $\Pr(A\le0.25)=\frac2\pi\arcsin\sqrt{0.25}=\frac2\pi\arcsin(0.5)=
      \frac2\pi\cdot\frac\pi6=\frac13$ exactly. By symmetry
      $\Pr(A\ge0.75)=\frac13$ too, so there is a full $2/3$ chance the game
      ends up lopsided at least $75/25$ in one direction or the other — a
      near-even split is the minority outcome.
    interview: >
      "Over a long fair game, what fraction of the time is the winner
      actually ahead" tests whether you reach for "about half" (wrong) or
      name the arcsine law and its U-shaped density explicitly — "leads are
      sticky" is the one-line answer to have ready.
    pitfalls: >
      Assuming a fair, symmetric game implies a roughly even split of lead
      time — the density is lowest exactly at $1/2$, the intuitive guess.
      Treating the mean $1/2$ as describing a typical outcome; for this
      U-shaped law the mean is an outlier, not a mode.
    recap: >
      The fraction of time one side leads in a fair game follows the
      U-shaped arcsine law, so a near-even split is the rare outcome and one
      side usually dominates almost the whole game.
