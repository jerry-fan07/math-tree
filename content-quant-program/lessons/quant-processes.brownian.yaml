unit: quant-processes.brownian
opening: >
  Brownian motion is what a random walk becomes once the step size shrinks to
  nothing and the step count grows without bound — the continuum limit that
  turns the walk arsenal from earlier units into calculus-ready objects. This
  unit builds the process from four defining properties, extracts its
  symmetries, martingales, and covariance structure, then spends its second
  half on the questions an interview actually asks: how far does the path
  wander, when does it first hit a level, and what happens once a
  deterministic drift is layered on top. It closes with quadratic variation —
  the single fact that squared increments accumulate to elapsed time rather
  than vanishing — which both explains why the path is nowhere differentiable
  and sets up the stochastic calculus built in the next unit.
lessons:
  - node: quant-processes.brownian.bm
    hook: >
      "Define Brownian motion" opens almost every continuous-time interview
      question, and the tell that separates a memorized label from real
      understanding is knowing which of the four properties is doing the
      actual work and which is a stipulated technical assumption.
    explanation: >
      Think of Brownian motion as what a random walk becomes once you let the
      step size shrink and the step count grow without bound: infinitely many
      infinitesimal, independent nudges accumulating into a continuous path.
      The four defining properties pin that idea down precisely enough to
      compute with. $B_0=0$ fixes the starting point; independent increments
      say tomorrow's move carries no information from yesterday's; stationary
      Gaussian increments say the law of a move depends only on how much time
      elapsed, never on the calendar time or the current level; and
      continuity rules out any process that would otherwise satisfy the first
      three by jumping.

      The Gaussian shape is not an extra assumption bolted onto independence
      and stationarity — it is close to forced. Split $[0,t]$ into $n$ equal
      pieces; $B_t$ is the sum of $n$ independent, identically distributed
      increments for every $n$, and once continuous paths make every piece
      uniformly small the central limit theorem forces that sum to be normal.
      Splitting alone does not do it — a jump process can split just as
      consistently — so the Gaussian law is what continuity buys. What
      independence buys computationally is that variance is additive:
      $\operatorname{Var}(B_t)=\sum_{i=1}^{n}\operatorname{Var}(B_{it/n}-B_{(i-1)t/n})=n\cdot(t/n)=t$,
      exactly, regardless of $n$.

      Continuity is the one property genuinely doing new work — it is not
      implied by the other three, and Wiener had to prove such a process
      exists at all. Take it as given in an interview; everything downstream
      is squeezed out of these four facts and nothing else.
    worked: >
      Let $B_3$ denote the position at time $3$. Then $B_3\sim N(0,3)$, so
      $\Pr(B_3>3)=\Pr(Z>3/\sqrt3)=\Pr(Z>\sqrt3)\approx\Pr(Z>1.732)\approx0.0416$:
      a move of a full three units by time $3$ is already a rare, roughly
      $4\%$ event, since the standard deviation at $t=3$ is only
      $\sqrt3\approx1.73$.
    interview: >
      "Define Brownian motion" and "why is $B_t$ normal, not just symmetric"
      are the standard openers — answer with all four properties in one
      breath, and be ready to say that continuity is the one true assumption
      while the Gaussian shape follows from increment-splitting once the
      paths are continuous.
    pitfalls: >
      Treating "independent increments" as merely "uncorrelated increments"
      understates the hypothesis — full independence is what licenses
      splitting into normal sums freely. Writing $B_t\sim N(0,t^2)$ instead of
      $N(0,t)$ — the variance is the elapsed time itself, not its square, so
      the standard deviation is $\sqrt t$, not $t$.
    recap: >
      Brownian motion is the process built from independent, stationary
      $N(0,\Delta t)$ increments started at $0$ with continuous paths — four
      facts, and everything else in this unit is derived from them.
    dialogue:
      - part: A simulator's spec sheet
        teach: >
          A risk desk needs a noise process $X_t$ for a spread, with time in
          hours. A colleague's simulator adds up a huge number of tiny
          independent nudges, and over $10^{5}$ runs it reports three facts:
          $X_0 = 0$ every time; the law of a change $X_t - X_s$ depends only on
          the window length $t - s$, and a one-hour change has mean $0$ and
          variance $1$; and changes over non-overlapping windows are
          independent.
      - ask: >
          What is the variance of $X_9$, the value after nine hours?
        expects: "9"
        hint: >
          Cut $[0, 9]$ into nine non-overlapping one-hour windows.
        feedback: >
          $X_9$ is the sum of nine hourly changes. They are independent, each
          has variance $1$, and variances of independent pieces add:
          $1 + 1 + \dots + 1 = 9$. The standard deviation is $3$, not $9$.
      - ask: >
          What is the variance of a single half-hour change?
        choices:
          - text: >
              $1/4$, because half the time means half the standard deviation.
            feedback: >
              Then two back-to-back half-hours, independent and each of
              variance $1/4$, would add to a one-hour change of variance $1/2$.
              The spec says $1$.
          - text: >
              It cannot be known: the spec only quotes one-hour windows.
            feedback: >
              It can. An hour is two non-overlapping half-hours, independent
              and identically distributed by the spec, so their common
              variance $v$ must satisfy $2v = 1$.
          - text: >
              $1/2$
            correct: true
            feedback: >
              Two independent, identical half-hours make the hour, so
              $2v = 1$. The same argument with sixty minutes gives $1/60$ per
              minute.
        feedback: >
          Variance is proportional to elapsed time at every scale: a change
          over a window of length $t - s$ has variance $t - s$. Standard
          deviation therefore grows like the square root of the window.
      - ask: >
          What is the standard deviation of the change from hour $2.5$ to hour
          $6.5$?
        expects: "2"
        hint: >
          Only the window's length matters, not where it starts.
        feedback: >
          The window has length $4$, so the change has variance $4$ and
          standard deviation $\sqrt{4} = 2$. Starting at hour $2.5$ rather
          than at $0$ changes nothing.

      - part: A rival that fits every number
        teach: >
          A second colleague offers a cheaper engine: a counter $Y_t$ that
          starts at $0$ and, at each arrival of a rate-$1$ Poisson process,
          jumps by $+1$ or $-1$ on a fair coin flip. Arrivals in disjoint
          windows are independent, and so are the coins.
      - ask: >
          What is the variance of $Y_9$?
        expects: "9"
        hint: >
          Condition on the number of jumps $N$, which is Poisson with mean
          $9$. Each jump contributes variance $1$.
        feedback: >
          Given $N$ jumps, $Y_9$ is a sum of $N$ fair $\pm 1$ signs with
          variance $N$; averaging over $N$ gives
          $\operatorname{Var}(Y_9) = \mathbb{E}[N] = 9$. The mean is $0$ by
          symmetry. The rival matches the spec sheet number for number.
      - ask: >
          What is the probability that $Y$ does not move at all during a given
          hour? Give four decimal places.
        expects: "0.3679"
        tolerance: 0.0005
        hint: >
          No movement at all means no arrival in that hour.
        feedback: >
          $\Pr(\text{no arrival in one hour}) = e^{-1} \approx 0.3679$. So the
          hourly change of $Y$ sits exactly at $0$ more than a third of the
          time — an atom no normal law has.
      - ask: >
          Both engines satisfy all three facts on the spec sheet. What
          separates them?
        choices:
          - text: >
              $Y$ has dependent increments: a jump now makes the next jump
              likelier.
            feedback: >
              Poisson arrivals in disjoint windows are independent, and the
              coins are fresh each time. $Y$ has independent increments just
              as $X$ does.
          - text: >
              $Y$'s paths jump, and its hourly change is not normal.
            correct: true
            feedback: >
              $Y$ moves only in unit jumps, and its hourly change has an atom
              at $0$ of mass at least $0.3679$. The tiny-nudges engine never
              jumps.
          - text: >
              $Y$ is not stationary: the jumps cluster early.
            feedback: >
              A Poisson process has the same arrival rate in every window, so
              the law of a change of $Y$ depends only on the window length.
              Stationarity holds.
        feedback: >
          Mean $0$, variance equal to elapsed time, independent and stationary
          changes: none of that rules out jumps. The spec sheet is missing a
          clause.
      - reflect: >
          What would you add to the spec sheet to rule out the jump engine,
          and why would that same addition force the hourly change of $X$ to
          be normal, even though nobody wrote "normal" into the spec?
        hint: >
          Split the hour into $n$ pieces and ask how big the largest piece can
          be.
        answer: >
          Require the paths to be continuous. Then an hour is the sum of $n$
          independent, identical pieces for every $n$, and continuity makes
          every piece uniformly small as $n$ grows, so the central limit
          theorem forces the sum to be normal. The jump engine escapes the
          argument precisely because one piece can carry a whole unit jump
          however finely you cut.
      - teach: >
          That completed spec is the definition. A standard Brownian motion
          $(B_t)_{t \ge 0}$ has four properties: $B_0 = 0$; independent
          increments over non-overlapping windows; stationary Gaussian
          increments, $B_t - B_s \sim N(0, t-s)$; and continuous paths with
          probability $1$. Hence $B_t \sim N(0, t)$. That a process with all
          four exists is Wiener's theorem — continuity is the clause that
          needed proving.

      - part: Testing new candidates clause by clause
        ask: >
          For a standard Brownian motion, what is $\Pr(B_6 - B_2 > 3)$? Use
          $\Phi(1.5) = 0.9332$.
        expects: "0.0668"
        tolerance: 0.0005
        hint: >
          The increment is normal with variance equal to the window length.
        feedback: >
          $B_6 - B_2 \sim N(0, 4)$, standard deviation $2$, so
          $\Pr(B_6 - B_2 > 3) = \Pr(Z > 1.5) = 1 - 0.9332 = 0.0668$.
      - ask: >
          A third engine sets each hour's change to a fresh standard normal
          draw minus half of the previous hour's change, starting from $0$.
          Which clause does it break?
        choices:
          - text: >
              Gaussian increments: a normal minus half a normal is not normal.
            feedback: >
              A linear combination of independent normals is normal. Every
              hourly change here is a linear combination of fresh draws, so
              each one is Gaussian.
          - text: >
              $B_0 = 0$
            feedback: >
              It starts at $0$ by construction. The trouble is in how one
              hour's change feeds the next.
          - text: >
              Independent increments: consecutive hourly changes are
              correlated.
            correct: true
            feedback: >
              With $D_1 = Z_1$ and $D_2 = Z_2 - D_1/2$,
              $\operatorname{Cov}(D_1, D_2) = -1/2$. The variance also drifts,
              $\operatorname{Var}(D_2) = 1 + 1/4 = 1.25$, so stationarity fails
              as a consequence.
        feedback: >
          Mean reversion is the classic way real prices fail the
          independent-increments clause. A model that ignores it overstates
          long-horizon spread.
      - ask: >
          A last engine outputs $2B_t$. Which clause, and only which, does it
          break?
        choices:
          - text: >
              Continuity, because doubling makes the path rougher.
            feedback: >
              Doubling a continuous path gives a continuous path. Rougher in
              size is not the same as broken.
          - text: >
              The variance of the increments: $2B_t - 2B_s \sim N(0, 4(t-s))$.
            correct: true
            feedback: >
              It starts at $0$, has independent Gaussian stationary increments
              and continuous paths; only the normalization $N(0, t-s)$ fails.
              It is a Brownian motion with volatility $2$, just not a standard
              one.
          - text: >
              Independent increments, because every value is multiplied by the
              same $2$.
            feedback: >
              A constant multiplier is not a shared random quantity. The
              increments of $2B$ are $2$ times independent increments, still
              independent.
        feedback: >
          In an interview, the four clauses in one breath — starts at zero,
          independent increments, $N(0, t-s)$ increments, continuous paths —
          and then which one carries the weight: continuity.

  - node: quant-processes.brownian.walk-limit
    hook: >
      Donsker's invariance principle is the reason every random-walk formula
      you already know reappears with $\sqrt n$ swapped for $\sqrt t$ — the
      interview isn't testing two separate topics, just one applied twice.
    explanation: >
      Fix a time $t$ and look only at the walk's rescaled position there:
      $W_t^{(n)}=S_{\lfloor nt\rfloor}/\sqrt n$ is a sum of about $nt$
      independent $\pm1$ steps divided by $\sqrt n$, which is exactly the
      standardized-sum setup the central limit theorem is built for. Reading
      off the CLT with $nt$ steps in place of $n$ gives $W_t^{(n)}\to N(0,t)$
      — the single-time marginal is nothing beyond a relabeled CLT.

      What Donsker's theorem adds is that this convergence holds
      simultaneously across every time and every joint block of times, not
      just one snapshot. Steps in disjoint time windows are independent by
      construction of the simple symmetric random walk, and independence of
      disjoint blocks survives the rescaling, so the limiting object inherits
      independent increments too — that is what assembles a full Brownian
      path rather than a family of separately-normal snapshots that might
      secretly be correlated with each other.

      Two consequences worth carrying forward: the limit doesn't care about
      the shape of one step, only its mean $0$ and variance $\sigma^2$ — a
      walk with different steps, biased-but-recentered, converges to the
      identical Brownian motion (scaled by $\sigma$) as the $\pm1$ walk. And
      any exact walk formula — reflection, hitting probabilities, maxima —
      survives into the continuum with $\sqrt n$ replaced by $\sqrt t$,
      because it was proved using only the ingredients this convergence
      preserves.
    worked: >
      Take a fair $\pm1$ walk with $n=10000$ steps. The rescaled endpoint
      $W_1^{(n)}=S_{10000}/100$ is approximately standard normal, so
      $\Pr(S_{10000}>150)=\Pr(W_1^{(n)}>1.5)\approx1-\Phi(1.5)\approx0.0668$ —
      a direct CLT computation dressed as a Brownian-motion tail probability,
      since $150/\sqrt{10000}=1.5$.
    interview: >
      "Why does a random walk look like Brownian motion when you zoom out"
      wants Donsker named specifically, not just "CLT" — the interviewer is
      listening for the extra claim that whole paths converge jointly, plus
      the universality over step distributions.
    pitfalls: >
      Quoting only the single-time CLT limit and missing that the theorem's
      real content is convergence of the whole path, including joint behavior
      across times. Forgetting the finite-variance requirement on the step
      law — a step distribution with infinite variance does not converge to
      Brownian motion at all, however it's rescaled.
    recap: >
      Rescale a random walk by $\sqrt n$ in space and $n$ in time and it
      converges to Brownian motion — the CLT applied not to one endpoint but
      to the whole path at once, for any mean-$0$, finite-variance step.
    dialogue:
      - part: A day of inventory
        teach: >
          A market maker's inventory starts the day flat. Each trade moves it
          by $+1$ or $-1$ share on a fair coin, independently of every other
          trade, and there are $2500$ trades a day. Write $S_k$ for the
          inventory after $k$ trades.
      - ask: >
          What is the standard deviation of the inventory at the close,
          $S_{2500}$?
        expects: "50"
        hint: >
          Each step has variance $1$, and the steps are independent.
        feedback: >
          $\operatorname{Var}(S_{2500}) = 2500 \times 1 = 2500$, so the
          standard deviation is $\sqrt{2500} = 50$ shares.
      - ask: >
          Using the normal approximation, what is the probability that the
          closing inventory exceeds $60$ shares? Use $\Phi(1.2) = 0.8849$.
        expects: "0.1151"
        tolerance: 0.0005
        hint: >
          The central limit theorem makes $S_{2500}/50$ roughly standard
          normal.
        feedback: >
          $\Pr(S_{2500} > 60) \approx \Pr(Z > 60/50) = \Pr(Z > 1.2) = 1 - 0.8849
          = 0.1151$.
      - ask: >
          What is the standard deviation of the inventory at midday, after
          $1250$ trades? Give two decimal places.
        expects: "35.36"
        tolerance: 0.01
        hint: >
          Half the trades means half the variance, not half the standard
          deviation.
        feedback: >
          $\sqrt{1250} \approx 35.36$. Half the day already carries about
          $71\%$ of the full day's spread, because spread grows like the
          square root of the number of trades.

      - part: Zooming out on the whole path
        ask: >
          You want to plot the day's path in a unit box: the time axis
          compressed by $2500$, so the close sits at $t = 1$. By what factor
          should you shrink the inventory axis so that the picture neither
          flattens nor explodes as the number of trades per day grows?
        choices:
          - text: >
              By $2500$, the same factor as time.
            feedback: >
              Then the close has standard deviation $50/2500 = 0.02$, and with
              $10^{6}$ trades it would be $0.001$: the law of large numbers
              flattens the picture to a straight line at $0$.
          - text: >
              By $\sqrt{2500} = 50$.
            correct: true
            feedback: >
              Then the close has standard deviation exactly $1$ however many
              trades there are, because $\sqrt{n}/\sqrt{n} = 1$. The noise
              survives the limit at a fixed size.
          - text: >
              Not at all; inventory is already in shares.
            feedback: >
              The close's standard deviation is $\sqrt{n}$, which grows without
              bound as trades per day increase. The picture explodes.
        feedback: >
          Time by $n$, space by $\sqrt{n}$: the rescaled path is
          $W^{(n)}_t = S_{\lfloor nt \rfloor}/\sqrt{n}$. Any other exponent on
          $n$ either kills the randomness or blows it up.
      - ask: >
          In those units, with $n = 2500$, what is the variance of
          $W^{(n)}_{0.36}$?
        expects: "0.36"
        hint: >
          Count the trades that have happened by $t = 0.36$, then divide the
          variance by $n$.
        feedback: >
          By $t = 0.36$ there have been $900$ trades, so the variance of
          $S_{900}/50$ is $900/2500 = 0.36$. The variance of the rescaled
          walk at time $t$ is $t$ — the marginal of a standard Brownian
          motion.
      - ask: >
          The central limit theorem makes $W^{(n)}_{1/2}$ and $W^{(n)}_1$ each
          approximately normal, with variances $1/2$ and $1$. What does that,
          on its own, fail to tell you?
        choices:
          - text: >
              Whether $W^{(n)}_1$ has mean $0$.
            feedback: >
              The central limit theorem hands you the mean along with the
              shape. The mean is $0$ at every time.
          - text: >
              Nothing: normal snapshots with variance $t$ are already a
              Brownian motion.
            feedback: >
              Snapshots one at a time say nothing about how they move
              together. Brownian motion is a statement about the whole path:
              its increments must be independent too.
          - text: >
              How the morning change $W^{(n)}_{1/2}$ relates to the afternoon
              change $W^{(n)}_1 - W^{(n)}_{1/2}$.
            correct: true
            feedback: >
              Right. Two separately normal numbers can be correlated in any
              way at all. The marginals are only half the story.
        feedback: >
          A Brownian motion is pinned down by its joint behaviour across
          times, not by one time at a time. Something beyond the single-time
          central limit theorem has to carry the joint structure.
      - reflect: >
          What property of the trades themselves makes the afternoon change
          independent of the morning change, and why does that property
          survive the rescaling into the limit?
        hint: >
          Which trades make up each change?
        answer: >
          The morning change is built from trades $1$ to $1250$ and the
          afternoon change from trades $1251$ to $2500$ — disjoint blocks of
          independent coin flips, so independent for every $n$. Dividing both
          by the same $\sqrt{n}$ cannot couple them, and each block is
          normal in the limit by the central limit theorem. So the limit has
          independent Gaussian increments with variance equal to elapsed
          time: Brownian motion.
      - teach: >
          That is Donsker's invariance principle: $W^{(n)}_t =
          S_{\lfloor nt \rfloor}/\sqrt{n}$ converges in distribution, as a
          whole path, to a standard Brownian motion. At one time it is the
          central limit theorem; disjoint blocks of steps becoming independent
          increments is what makes it a theorem about paths. It holds for any
          step law with mean $0$ and finite variance $\sigma^{2}$, the limit
          then being $\sigma B$.

      - part: Other steps, same limit
        ask: >
          A different book: each trade moves inventory by $+2$ with
          probability $1/3$ and by $-1$ with probability $2/3$. The mean step
          is $0$. What is the variance of one step?
        expects: "2"
        hint: >
          With mean $0$, the variance is $\mathbb{E}[X^{2}]$.
        feedback: >
          $\mathbb{E}[X^{2}] = 4 \cdot (1/3) + 1 \cdot (2/3) = 2$. The limit of
          this walk is $\sqrt{2}\,B$: lopsided steps, same Brownian shape.
      - ask: >
          What is the standard deviation of this walk after $800$ trades?
        expects: "40"
        hint: >
          Variances of independent steps add.
        feedback: >
          $\operatorname{Var}(S_{800}) = 800 \times 2 = 1600$, standard
          deviation $40$. Only the mean and variance of a step enter; the
          lopsidedness washes out.

      - part: Where the limit breaks
        ask: >
          Now each step has mean $0.01$ and variance $1$. With $n = 10^{6}$
          steps, what is the mean of $S_n/\sqrt{n}$?
        expects: "10"
        hint: >
          The mean of $S_n$ grows like $n$; you divide by $\sqrt{n}$.
        feedback: >
          $\mathbb{E}[S_n]/\sqrt{n} = 0.01 \times 10^{6}/10^{3} = 10$. At
          $n = 10^{4}$ it was $1$; it grows like $0.01\sqrt{n}$ and the
          rescaled path drifts off to infinity.
      - ask: >
          What repairs the limit for that walk?
        choices:
          - text: >
              Divide by $n$ instead of $\sqrt{n}$.
            feedback: >
              That tames the drift, giving the straight line $0.01t$, but it
              also crushes the noise to $0$. You keep the trend and lose the
              Brownian motion.
          - text: >
              Nothing is needed: a small drift still converges to Brownian
              motion.
            feedback: >
              However small, a drift of $\mu$ per step contributes
              $\mu\sqrt{n}$ to the rescaled endpoint, which has no limit.
          - text: >
              Subtract the drift: $(S_n - 0.01n)/\sqrt{n}$ converges to a
              standard Brownian motion.
            correct: true
            feedback: >
              The recentred steps have mean $0$ and variance $1$, so Donsker
              applies. Mean zero is a hypothesis, not a detail.
        feedback: >
          Both hypotheses bite. Mean $0$ (or recentring), and finite variance:
          steps with infinite variance have no $\sqrt{n}$ scaling at all.
          With both in hand, every exact walk formula — reflection, ruin,
          maxima — carries into continuous time with $\sqrt{n}$ read as
          $\sqrt{t}$.

  - node: quant-processes.brownian.scaling
    hook: >
      "If I stretch the time axis, how does Brownian motion's spread change"
      is the standing question behind every horizon-conversion problem, and
      the honest answer is a square root, not a linear factor.
    explanation: >
      Rescale time by a factor $c$ and rescale space by $\sqrt c$ at the same
      time, and nothing about the process changes: $\tilde B_t=c^{-1/2}B_{ct}$
      is again a standard Brownian motion. The only fact that needs checking
      is the variance, and it collapses to one line:
      $\operatorname{Var}(c^{-1/2}B_{ct})=c^{-1}\cdot\operatorname{Var}(B_{ct})=c^{-1}\cdot ct=t$
      — independence and stationarity of the increments carry over
      automatically under any linear rescaling, so variance matching is the
      entire content of the claim.

      Three companion symmetries fall out of the same four defining
      properties: flipping the sign ($-B_t$), sliding the origin to any fixed
      time ($B_{t_0+t}-B_{t_0}$), and even inverting time ($tB_{1/t}$, patched
      to $0$ at $t=0$) each again satisfy independent stationary Gaussian
      increments started at $0$ with continuous paths, so each is again a
      standard Brownian motion.

      The practical payoff is the $\sqrt t$ law for typical displacement:
      since $\mathbb{E}|B_t|=\sqrt{2t/\pi}$, going from $t$ to $4t$ only
      doubles the expected spread, not quadruples it. A plot of the path over
      $[0,1]$ and a plot over $[0,100]$ are statistically the same picture
      with the axis labels rescaled — there's no characteristic timescale at
      which the path suddenly looks different.
    worked: >
      Compare a $9$-year horizon to a $1$-year horizon: $\mathbb{E}|B_1|=
      \sqrt{2/\pi}\approx0.798$ and $\mathbb{E}|B_9|=\sqrt{18/\pi}\approx2.395$
      — exactly a factor of $3=\sqrt9$ apart, not $9$. Distance traveled
      triples, not nine-folds, over nine times the time.
    interview: >
      "If volatility over one day is $x$, what's volatility over four days"
      is this proposition disguised as a finance question — the expected
      answer is a factor of $\sqrt4=2$, and a sharp interviewer will ask you
      to justify it from independence of increments rather than just cite the
      rule.
    pitfalls: >
      Assuming displacement scales linearly with elapsed time — a natural but
      wrong instinct carried over from deterministic motion. Rescaling time
      without simultaneously rescaling space by $\sqrt c$ breaks the
      identity; the two rescalings only cancel together.
    recap: >
      Shrink time by $c$ and space by $\sqrt c$ together and Brownian motion
      is unchanged in law, which is exactly why displacement grows like
      $\sqrt t$ rather than $t$.
    dialogue:
      - part: One minute against twenty-five
        teach: >
          A spread follows a standard Brownian motion with time measured in
          minutes. Over one minute its average absolute move is
          $\mathbb{E}|B_1| = \sqrt{2/\pi} \approx 0.798$. A junior trader
          reasons that over $25$ minutes the average absolute move must be
          $25 \times 0.798 \approx 19.9$.
      - ask: >
          What is $\mathbb{E}|B_{25}|$? Give two decimal places.
        expects: "3.99"
        tolerance: 0.01
        hint: >
          $B_{25} \sim N(0, 25)$. How does it compare with $5$ times a
          standard normal?
        feedback: >
          $B_{25}$ has standard deviation $5$, so it has the law of $5Z$ and
          $\mathbb{E}|B_{25}| = 5 \times 0.798 \approx 3.99$. The junior
          scaled by the time, $25$; the right factor is its square root.
      - ask: >
          After how many minutes is the average absolute move ten times its
          one-minute value?
        expects: "100"
        hint: >
          The average absolute move scales like $\sqrt{t}$.
        feedback: >
          $\mathbb{E}|B_t| = \sqrt{t}\,\mathbb{E}|B_1|$, so a factor of $10$
          needs $\sqrt{t} = 10$, that is $t = 100$ minutes. Ten times the
          distance costs a hundred times the time.

      - part: Replotting the long path in a small box
        ask: >
          You take the path over $[0, 25]$ and replot it over $[0, 1]$,
          dividing time by $25$. What should you divide the values by so that
          the replot looks statistically like the path over its first minute?
        choices:
          - text: >
              By $25$, matching the time axis.
            feedback: >
              Then the endpoint becomes $B_{25}/25$, with variance
              $25/625 = 0.04$ rather than $1$. The replot is a flattened,
              too-quiet copy.
          - text: >
              By $5$
            correct: true
            feedback: >
              The endpoint $B_{25}/5$ has variance $25/25 = 1$, the variance of
              $B_1$. Time by $c$, space by $\sqrt{c}$.
          - text: >
              Not at all: only the time axis needs relabelling.
            feedback: >
              The endpoint would still be $B_{25}$, with variance $25$ where a
              one-minute path has variance $1$. The replot is far too wild.
        feedback: >
          The candidate is $\tilde{B}_t = B_{25t}/5$, the long path shrunk to
          the short one's scale.
      - ask: >
          What is the variance of $\tilde{B}_{0.4} = B_{10}/5$?
        expects: "0.4"
        hint: >
          Dividing by $5$ divides the variance by $25$.
        feedback: >
          $\operatorname{Var}(B_{10})/25 = 10/25 = 0.4$, the same as
          $\operatorname{Var}(B_{0.4})$. The match holds at every $t$:
          $\operatorname{Var}(B_{25t}/5) = 25t/25 = t$.
      - reflect: >
          You have checked one thing about $\tilde{B}_t = B_{25t}/5$: its
          variance at each time is $t$. To call it a standard Brownian motion
          you need all four defining properties. Which of the other three
          could the rescaling possibly break, and why?
        hint: >
          Go through starting value, independence, Gaussian shape and
          continuity, and ask what a constant stretch of either axis does to
          each.
        answer: >
          None of them. $\tilde{B}_0 = B_0/5 = 0$; disjoint windows of
          $\tilde{B}$ are disjoint windows of $B$, so increments stay
          independent; a constant times a normal is normal; and stretching a
          continuous path keeps it continuous. The variance is the only
          property a rescaling can spoil, so the single computation
          $c^{-1} \cdot ct = t$ carries the whole proof.
      - teach: >
          That is the scaling property: for every $c > 0$,
          $\tilde{B}_t = c^{-1/2}B_{ct}$ is again a standard Brownian motion.
          Three companions follow the same way, by checking the four
          properties: the reflection $-B_t$; the restart $B_{t_0+t} - B_{t_0}$
          at a fixed $t_0$; and the time inversion $tB_{1/t}$, set to $0$ at
          $t = 0$. The headline is the $\sqrt{t}$ law:
          $\mathbb{E}|B_t| = \sqrt{2t/\pi}$.

      - part: Which transforms survive
        ask: >
          Check the time inversion on one number: with $Y_t = tB_{1/t}$, what
          is $\operatorname{Var}(Y_4)$?
        expects: "4"
        hint: >
          $Y_4 = 4B_{1/4}$.
        feedback: >
          $\operatorname{Var}(4B_{1/4}) = 16 \times 1/4 = 4$, exactly the
          variance a Brownian motion has at time $4$. The large factor $t$ and
          the tiny time $1/t$ cancel in the variance.
      - ask: >
          Now $V_t = B_{t^{2}}$, a clock that runs faster as time goes on.
          What is the variance of $V_2 - V_1$?
        expects: "3"
        hint: >
          $V_2 - V_1 = B_4 - B_1$.
        feedback: >
          $B_4 - B_1 \sim N(0, 3)$, so the variance is $3$. A standard
          Brownian motion would give $2 - 1 = 1$.
      - ask: >
          Which defining property does $V_t = B_{t^{2}}$ break?
        choices:
          - text: >
              Independent increments
            feedback: >
              Disjoint windows $[s, t]$ map to disjoint windows
              $[s^{2}, t^{2}]$ of $B$, so increments of $V$ are still
              independent.
          - text: >
              Continuity
            feedback: >
              $t \mapsto t^{2}$ is continuous, and so is $B$; the composite
              path is continuous.
          - text: >
              Stationary increments with variance equal to elapsed time
            correct: true
            feedback: >
              $V_t - V_s \sim N(0, t^{2} - s^{2})$, which depends on where the
              window sits, not just its length. Over $[1, 2]$ it is $3$, over
              $[0, 1]$ it is $1$.
        feedback: >
          A nonlinear clock breaks stationarity. The time change in the
          scaling property is linear, $t \mapsto ct$, and the $c^{-1/2}$ in
          front exactly repairs its effect on the variance.
      - ask: >
          You zoom into the path over $[0, 0.01]$ and blow it up to a unit
          box: time multiplied by $100$, values by $10$. What do you see?
        choices:
          - text: >
              A nearly straight segment: every continuous path looks smooth up
              close.
            feedback: >
              That is true of a differentiable curve, and Brownian motion is
              not one. Scaling says the blown-up piece is again a standard
              Brownian motion on $[0, 1]$: as rough as before.
          - text: >
              A path with the same law as the original over $[0, 1]$.
            correct: true
            feedback: >
              $10B_{t/100}$ is the scaling property with $c = 1/100$. There is
              no scale at which the path calms down — the same jaggedness at
              every magnification.
          - text: >
              A flatter path, since $0.01$ minutes is too short for much to
              happen.
            feedback: >
              Over $0.01$ the moves are of size $\sqrt{0.01} = 0.1$, and
              blowing values up by $10$ brings them back to size $1$. The
              picture is not flatter.
        feedback: >
          Self-similarity is why horizon questions have square-root answers,
          and it is also the first hint that the path has no slope anywhere.

  - node: quant-processes.brownian.covariance
    hook: >
      "What's the correlation between the process at two different times" is
      a standard opener, and the clean answer, $\sqrt{s/t}$, only falls out
      once you stop assuming $B_s$ and $B_t$ are independent just because
      increments are.
    explanation: >
      $B_s$ and $B_t$ are not independent even though increments are — $B_t$
      literally contains $B_s$ as a summand. Write $B_t=B_s+(B_t-B_s)$: the
      two pieces are independent by definition, so
      $\operatorname{Cov}(B_s,B_t)=\operatorname{Cov}(B_s,B_s)+\operatorname{Cov}(B_s,B_t-B_s)=\operatorname{Var}(B_s)+0=s$,
      for $s\le t$. Swapping the roles for the general case gives
      $\operatorname{Cov}(B_s,B_t)=\min(s,t)$ — covariance is exactly the
      shared elapsed time, the part of the path both values have lived
      through together.

      Dividing by the standard deviations gives
      $\operatorname{Corr}(B_s,B_t)=\sqrt{s/t}$ for $s\le t$: two
      nearby-in-time values are highly correlated, but correlation decays
      only like a square root, not proportionally, as the gap widens.

      Because every finite collection $(B_{t_1},\dots,B_{t_n})$ is a linear
      combination of the same underlying independent normal increments, it is
      automatically jointly Gaussian — so "mean-zero Gaussian process with
      covariance $\min(s,t)$ and continuous paths" is a complete, equivalent
      definition of Brownian motion. Joint Gaussianity makes conditioning
      linear: given $B_T=x$, the earlier value $B_t$ ($t<T$) is normal with
      mean $(t/T)x$ and variance $t(T-t)/T$ — largest uncertainty at the
      midpoint, shrinking to $0$ at both ends where the value is pinned. That
      conditioned path is the Brownian bridge.
    worked: >
      Suppose $B_{16}=8$ is observed. The value at $t=4$ is normal with mean
      $(4/16)\times8=2$ and variance $4\times12/16=3$, so a $95\%$ band for
      $B_4$ is roughly $2\pm1.96\sqrt3\approx2\pm3.39$, i.e. about
      $(-1.39,5.39)$ — noticeably tighter than the unconditional $N(0,4)$ law
      of $B_4$ alone, because knowing the endpoint constrains the path in
      between.
    interview: >
      "What's $\operatorname{Cov}(B_s,B_t)$" and "given the value at time
      $10$, what's the distribution at time $3$" are both standard — answer
      $\min(s,t)$ instantly and the bridge mean/variance formula on request,
      without re-deriving from scratch.
    pitfalls: >
      Assuming $B_s$ and $B_t$ are independent because increments are
      independent — they overlap in the interval $[0,\min(s,t)]$ and share
      exactly that much covariance. Reversing $s$ and $t$ inside $\min$ or
      plugging the larger time into the shared role gives a covariance
      exceeding either variance, which is impossible.
    recap: >
      $\operatorname{Cov}(B_s,B_t)=\min(s,t)$ because the two values share
      exactly the path up to the earlier time, and conditioning on a later
      value is linear with variance shrinking to $0$ at the pinned endpoints.
    dialogue:
      - part: Two snapshots of one P&L
        teach: >
          A strategy's cumulative P&L follows a standard Brownian motion, time
          in months. The risk report shows it at month $4$ and again at month
          $9$. A colleague computes the variance of the change between the two
          reports as $\operatorname{Var}(B_9) + \operatorname{Var}(B_4) = 13$,
          treating the two snapshots as independent.
      - ask: >
          What is $\operatorname{Var}(B_9 - B_4)$ actually?
        expects: "5"
        hint: >
          $B_9 - B_4$ is a single increment of the process.
        feedback: >
          It is an increment over a window of length $9 - 4 = 5$, so
          $B_9 - B_4 \sim N(0, 5)$ and the variance is $5$, not $13$. The
          colleague's $13$ is off by $8$, and that $8$ is hiding a covariance.
      - ask: >
          Expand $\operatorname{Var}(B_9 - B_4) = \operatorname{Var}(B_9) +
          \operatorname{Var}(B_4) - 2\operatorname{Cov}(B_4, B_9)$ and solve.
          What is $\operatorname{Cov}(B_4, B_9)$?
        expects: "4"
        hint: >
          The left side is $5$ and the two variances are $9$ and $4$.
        feedback: >
          $5 = 9 + 4 - 2c$, so $c = 4$. The two snapshots are strongly
          positively related, and the covariance is exactly the earlier time.
      - reflect: >
          Why is the covariance exactly $4$, the earlier time, and what would
          it be for any $s \le t$? Find the argument that does not go through
          the increment's variance.
        hint: >
          Write $B_9$ as $B_4$ plus something.
        answer: >
          $B_9 = B_4 + (B_9 - B_4)$, and the second piece is independent of
          $B_4$ because $[0, 4]$ and $[4, 9]$ do not overlap. So
          $\operatorname{Cov}(B_4, B_9) = \operatorname{Var}(B_4) + 0 = 4$.
          For $s \le t$ the same split gives $s$: the covariance is the time
          the two values have lived through together, and nothing after the
          earlier time contributes.
      - teach: >
          So $\operatorname{Cov}(B_s, B_t) = \min(s, t)$, and dividing by the
          standard deviations, $\operatorname{Corr}(B_s, B_t) = \sqrt{s/t}$
          for $s \le t$. Each $B_{t_i}$ is a sum of the same independent
          normal increments, so any finite collection is jointly Gaussian: a
          mean-zero Gaussian process with covariance $\min(s, t)$ and
          continuous paths is an equivalent definition of Brownian motion.

      - part: Shared time, read off directly
        ask: >
          What is $\operatorname{Corr}(B_4, B_9)$?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          Divide the covariance by both standard deviations.
        feedback: >
          $4/(\sqrt{4}\sqrt{9}) = 4/6 = 2/3$, the same as $\sqrt{4/9}$. Five
          months apart, the two reports are still correlated at about $0.67$.
      - ask: >
          Two windows that overlap: what is $\operatorname{Cov}(B_5, B_7 -
          B_2)$?
        expects: "3"
        hint: >
          Split each quantity into increments over $[0, 2]$, $[2, 5]$ and
          $[5, 7]$, and keep only the pieces they share.
        feedback: >
          $B_5 = (B_2) + (B_5 - B_2)$ and $B_7 - B_2 = (B_5 - B_2) +
          (B_7 - B_5)$. The only shared piece is $B_5 - B_2$, with variance
          $3$. Covariance is the length of the overlap, whatever the windows.
      - ask: >
          A candidate claims $\operatorname{Cov}(B_3, B_{12}) = 12$. Which
          check refutes it on the spot?
        choices:
          - text: >
              The sign: after nine more months the P&L has reverted, so the
              covariance should be negative.
            feedback: >
              Nothing reverts. The increment after month $3$ is independent of
              $B_3$, so it adds $0$ to the covariance and the sign is
              positive. The size is what is wrong.
          - text: >
              Cauchy–Schwarz: $|\operatorname{Cov}| \le \sqrt{3 \cdot 12} = 6$.
            correct: true
            feedback: >
              A covariance of $12$ would mean a correlation of $12/6 = 2$,
              which no pair of random variables has. The true value $3$ gives
              correlation $1/2$.
          - text: >
              Nothing refutes it; the later time carries more variance.
            feedback: >
              More variance in $B_{12}$ is independent noise added after time
              $3$; it does not co-move with $B_3$ at all.
        feedback: >
          $\min$, not $\max$: what the two values share is the path up to the
          earlier time.

      - part: Pinning the end of the path
        teach: >
          At month $20$ the P&L is observed to be exactly $10$. You are asked
          what that says about where it stood at month $5$.
      - ask: >
          What is $\mathbb{E}[B_5 \mid B_{20} = 10]$?
        choices:
          - text: >
              $0$: month $5$ came first, so a later observation says nothing
              about it.
            feedback: >
              Information flows both ways through a covariance. $B_{20}$
              contains $B_5$ as a summand, so a high $B_{20}$ is evidence of a
              high $B_5$.
          - text: >
              $2.5$
            correct: true
            feedback: >
              $\operatorname{Cov}(B_5, B_{20})/\operatorname{Var}(B_{20}) =
              5/20$, and $(5/20) \times 10 = 2.5$: a straight line from $0$ at
              time $0$ to $10$ at time $20$.
          - text: >
              $10$: with no drift, the best guess for any time is the latest
              value.
            feedback: >
              That is the forward-looking rule — the best guess for a later
              time is the current value. Looking backward, the path must also
              start at $0$, so the guess interpolates.
        hint: >
          For a mean-zero jointly Gaussian pair, conditioning is linear:
          $\mathbb{E}[X \mid Y = y] = \dfrac{\operatorname{Cov}(X, Y)}{\operatorname{Var}(Y)}\,y$.
        feedback: >
          Given $B_T = x$, the mean of $B_t$ is $(t/T)x$: linear interpolation
          between the two pinned values.
      - ask: >
          What is $\operatorname{Var}(B_5 \mid B_{20} = 10)$?
        expects: "3.75"
        hint: >
          For a jointly Gaussian pair, the conditional variance is
          $\operatorname{Var}(X) - \operatorname{Cov}(X, Y)^{2}/\operatorname{Var}(Y)$.
        feedback: >
          $5 - 5^{2}/20 = 5 - 1.25 = 3.75$, which matches the bridge formula
          $t(T-t)/T = 5 \times 15/20 = 3.75$. The observed value $10$ does not
          enter: knowing $B_{20}$ shifts the centre, and the spread shrinks by
          the same amount whatever was seen.
      - ask: >
          Given $B_{20} = 10$, at which month is the uncertainty about the
          P&L largest?
        choices:
          - text: >
              Near month $0$, the furthest from the observation.
            feedback: >
              At month $0$ the value is pinned at $0$, so the variance there is
              $t(T-t)/T = 0$.
          - text: >
              At month $10$
            correct: true
            feedback: >
              $t(20 - t)/20$ is a downward parabola with its peak at $t = 10$,
              where it equals $5$. Both pins are as far away as they can be.
          - text: >
              Near month $20$, the latest time.
            feedback: >
              At month $20$ the value is observed, so the variance is $0$
              there too.
        feedback: >
          This conditioned path is the Brownian bridge. Its midpoint rule —
          given both ends, the middle is normal around their average with
          variance a quarter of the time between them — is how simulators refine a path by
          repeated midpoint interpolation.

  - node: quant-processes.brownian.markov-property
    hook: >
      "Why can you treat the path as starting over the moment it first hits a
      barrier" is the question every reflection-style argument depends on
      answering correctly, and the honest answer needs the strong Markov
      property, not just the ordinary one.
    explanation: >
      The ordinary Markov property is nothing new: fix a deterministic time
      $s$ and look at $W_t=B_{s+t}-B_s$. This is precisely one increment of
      the base process, so by the defining independent stationary increments
      it is itself a standard Brownian motion, independent of everything that
      happened up to time $s$. No extra argument is needed — the property is
      baked into the four defining facts.

      The strong Markov property is the real upgrade: it replaces the fixed
      time $s$ with a random one, a stopping time $\tau$ — a random time
      whose occurrence by any given moment is decidable from the path up to
      that moment alone, with no lookahead. Provided $\tau$ is almost surely
      finite, $W_t=B_{\tau+t}-B_\tau$ is again a standard Brownian motion,
      independent of the path up to $\tau$. This does not follow for free
      from the ordinary property, because $\tau$ itself is random and could
      in principle depend on the future — the theorem's content is precisely
      that stopping times don't let that happen.

      The mental model: whatever the path is doing — hitting a level for the
      first time, setting a fresh record — the instant that event happens,
      the process has no memory of how it got there and restarts as a fresh
      Brownian motion. Every argument that resets the clock at a hitting
      time, most importantly the reflection principle, is an application of
      exactly this fact.
    worked: >
      Suppose $B_5=2$. By the ordinary Markov property, $W_t=B_{5+t}-2$ is a
      fresh Brownian motion, so
      $\Pr(B_8>6\mid B_5=2)=\Pr(W_3>4)=1-\Phi(4/\sqrt3)=1-\Phi(2.31)\approx0.0104$
      — a routine conditional tail probability computed by shifting the
      origin to the known value and treating the remaining $3$ time units as
      an ordinary Brownian increment.
    interview: >
      "State the strong Markov property and say why the reflection principle
      needs it" checks that you can name a stopping time correctly (first
      hitting time, yes; time of the eventual maximum, no) and that you know
      the restarted process is independent of the entire past path, not
      merely of the value $B_\tau$.
    pitfalls: >
      Applying the strong Markov property at a time that is not a stopping
      time — "the time the maximum occurs" requires knowledge of the whole
      future path and voids the argument. Concluding independence only from
      $B_\tau$ rather than from the full history $\mathcal F_\tau$ misses
      what the theorem actually grants.
    recap: >
      At any stopping time, not just a fixed time, the future increment of
      Brownian motion is again a standard Brownian motion independent of
      everything before — the license behind every "restart the clock"
      argument.
    dialogue:
      - part: Forecasting from a known present
        teach: >
          A stock's log-price, measured from its open, follows a standard
          Brownian motion with time in days. On day $3$ you read $B_3 = 1$.
          The desk wants the probability that it is above its open on day
          $7$.
      - ask: >
          What is $\Pr(B_7 > 0 \mid B_3 = 1)$? Use $\Phi(0.5) = 0.6915$.
        expects: "0.6915"
        tolerance: 0.0005
        hint: >
          Write $B_7 = 1 + (B_7 - B_3)$. What is the law of the increment?
        feedback: >
          The increment $B_7 - B_3 \sim N(0, 4)$ is independent of $B_3$, so
          you need $\Pr(N(0, 4) > -1) = \Pr(Z > -0.5) = \Phi(0.5) = 0.6915$.
      - ask: >
          A colleague adds that the price climbed to $3$ on day $2$ before
          sliding back to $1$ on day $3$. How does that change your answer?
        choices:
          - text: >
              Lower it: the slide is momentum, and it tends to continue.
            feedback: >
              Momentum is a dependence of future increments on past ones,
              and Brownian increments are independent by definition. The
              slide is already spent.
          - text: >
              Raise it: the price has shown it can reach $3$, so it tends to
              revert up.
            feedback: >
              Reversion would also make the future increment depend on the
              past. Nothing in $B_7 - B_3$ knows the price was ever at $3$.
          - text: >
              It does not change: only $B_3 = 1$ matters.
            correct: true
            feedback: >
              $B_{3+t} - B_3$ is built from increments after day $3$, which
              are independent of the whole path before. The present value is
              all the past contributes.
        feedback: >
          Fix a time $s$ and the future $W_t = B_{s+t} - B_s$ is a fresh
          standard Brownian motion, independent of everything up to $s$. That
          is the Markov property, and for a fixed $s$ it is just the
          definition read aloud.

      - part: Restarting at a random moment
        ask: >
          An alert fires at the random time $\tau$ when the price first
          reaches $2$. What is the law of the path after the alert,
          $B_{\tau+t} - 2$?
        choices:
          - text: >
              Tilted upward: the price was rising into the alert.
            feedback: >
              It was rising into $2$, but a rise is past increments, and the
              future increments do not remember them. The question is whether
              the random timing lets the past leak in.
          - text: >
              A fresh standard Brownian motion.
            correct: true
            feedback: >
              Right, and it is a real claim: $\tau$ is random, so you cannot
              just quote the fixed-time property. Something about this
              particular random time makes it work.
          - text: >
              Impossible to say, because $\tau$ is random.
            feedback: >
              Some random times do spoil the restart, but not all. The first
              arrival at $2$ is one of the good ones, and the next question
              asks why.
        feedback: >
          The restart works at the first arrival at $2$. It will not work at
          every random time.
      - reflect: >
          Compare two random times in one week: $\tau$, the first moment the
          price reaches $2$, and $\sigma$, the moment of the week's highest
          price. At which of them can you restart the path as a fresh Brownian
          motion, and what is the difference between them?
        hint: >
          At $\tau$, can you tell that $\tau$ has arrived? At $\sigma$, can
          you?
        answer: >
          Only at $\tau$. Whether $\tau$ has happened by time $t$ can be read
          off the path up to $t$ — you watch, and you know the instant it
          touches $2$. Whether $\sigma$ has happened requires the rest of the
          week: you only know the high was the high once nothing beat it.
          $\sigma$ peeks at the future, and the path after it is forced to
          lie below, which no fresh Brownian motion does.
      - teach: >
          A random time whose occurrence by $t$ is decided by the path up to
          $t$ is a stopping time. The strong Markov property: if $\tau$ is a
          stopping time with $\Pr(\tau < \infty) = 1$, then
          $W_t = B_{\tau+t} - B_\tau$ is a standard Brownian motion,
          independent of the entire path up to $\tau$. At the first moment the
          path does something, it forgets how it got there.

      - part: Using the restart
        ask: >
          The alert at $2$ has fired. What is the probability that four days
          later the price is above $3$, that is, $\Pr(B_{\tau+4} > 3)$? Use
          $\Phi(0.5) = 0.6915$.
        expects: "0.3085"
        tolerance: 0.0005
        hint: >
          Restart at $\tau$: you need the fresh path to rise by $1$ in four
          days.
        feedback: >
          $B_{\tau+4} - 2 = W_4 \sim N(0, 4)$, so
          $\Pr(W_4 > 1) = \Pr(Z > 0.5) = 1 - 0.6915 = 0.3085$. When the alert
          fired does not enter.
      - ask: >
          The alert fired unusually late, on day $6$. Does that change the
          law of the path after the alert?
        choices:
          - text: >
              Yes: a late alert means a sluggish stock, so the restart should
              be scaled down.
            feedback: >
              Volatility is a property of the increments, and every increment
              has variance equal to elapsed time. A late $\tau$ is bad luck in
              the past, not a slower future.
          - text: >
              No: the restarted path is independent of everything up to
              $\tau$, including $\tau$ itself.
            correct: true
            feedback: >
              The theorem grants independence from the whole history up to
              $\tau$, not merely from the value $B_\tau = 2$. How long it took
              is part of that history.
          - text: >
              Only if the alert fired after day $5$, beyond the original
              window.
            feedback: >
              No window appears in the theorem. Whenever $\tau$ lands, the
              path after it is a fresh Brownian motion.
        feedback: >
          Independence from $\tau$ is what lets later arguments split on
          "when did it first hit" and treat what follows as identical in
          every case.
      - ask: >
          Which of these is not a stopping time?
        choices:
          - text: >
              The first time the price falls $1$ below its open.
            feedback: >
              You know the instant it happens by watching the path. That is a
              stopping time.
          - text: >
              The last time the price is at its open before day $5$.
            correct: true
            feedback: >
              Knowing it was the last visit requires seeing that no later
              visit happens before day $5$ — the future again.
          - text: >
              Day $4$, whatever the price does.
            feedback: >
              A fixed time is a stopping time trivially: you always know
              whether day $4$ has arrived.
          - text: >
              The first time the price has risen $1$ above its lowest level so
              far.
            feedback: >
              The running low and the current price are both visible up to
              now, so this is decided by the past. A stopping time.
        feedback: >
          "First time something happens" is the template for a stopping time;
          "last time" and "time of the maximum" are the templates for traps.
      - ask: >
          Restart at $\sigma$, the time of the week's high, and suppose
          $\sigma$ falls before the last day. What is the probability that the
          price is ever above $B_\sigma$ during the rest of the week?
        expects: "0"
        hint: >
          What does it mean for $\sigma$ to be the time of the high?
        feedback: >
          By definition nothing after $\sigma$ beats $B_\sigma$, so the
          probability is $0$. A fresh Brownian motion started at $0$ goes
          above $0$ immediately with probability $1$, so the path after
          $\sigma$ is not one. The reflection principle restarts at the first
          hitting time precisely because that is a stopping time.

  - node: quant-processes.brownian.martingale-property
    hook: >
      These three formulas are the entire toolkit for "find this hitting
      probability" or "find this expected exit time" questions without ever
      writing down a differential equation — memorize which one answers which
      question.
    explanation: >
      $B_t$ itself is a martingale for the trivial reason that future
      increments have mean zero: $\mathbb{E}[B_t\mid\mathcal F_s]=B_s+
      \mathbb{E}[B_t-B_s\mid\mathcal F_s]=B_s+0$, using independence of the
      increment from the past. This is the tool for probability questions —
      a bounded stopped version of $B_t$ conserves its expected value
      exactly, which is what pins down hitting probabilities at two barriers.

      $B_t^2-t$ compensates the natural growth of a squared
      martingale-increment process. Expanding $B_t=B_s+(B_t-B_s)$ and using
      that the increment is independent of the past with mean $0$ and
      variance $t-s$ gives $\mathbb{E}[B_t^2\mid\mathcal F_s]=B_s^2+(t-s)$, so
      subtracting $t$ exactly cancels the growth:
      $\mathbb{E}[B_t^2-t\mid\mathcal F_s]=B_s^2-s$. This is the tool for time
      questions — it converts expected exit time into an algebraic identity.

      The exponential martingale $\exp(\lambda B_t-\lambda^2t/2)$ compensates
      growth of a different kind: it is just the normal moment generating
      function $\mathbb{E}[e^{\lambda(B_t-B_s)}]=e^{\lambda^2(t-s)/2}$
      rearranged so the compensation is folded directly into the process. It
      holds for every real $\lambda$, which is what makes it flexible enough
      to handle drift later — choosing $\lambda$ to cancel a drift term is
      the standard trick for hitting problems on a process that isn't
      driftless.
    worked: >
      Check the second martingale numerically: with $s=4,t=9$ and $B_4=2$,
      the claim is $\mathbb{E}[B_9^2-9\mid B_4=2]=2^2-4=0$. Indeed
      $\mathbb{E}[B_9^2\mid B_4=2]=B_4^2+(9-4)=4+5=9$, so
      $\mathbb{E}[B_9^2-9\mid B_4=2]=9-9=0$ exactly, confirming the
      compensation.
    interview: >
      "Name the martingales you get from Brownian motion" is asked directly,
      or folded into "how would you find the expected time to hit a barrier"
      — a strong answer names all three unprompted and states which one
      answers a probability question versus a time question.
    pitfalls: >
      Treating $B_t^2$ alone as a martingale — it isn't; it is a
      submartingale, growing in expectation, and the $-t$ compensation is not
      optional. Dropping the $-\lambda^2t/2$ term from the exponential
      martingale, or getting its sign wrong, breaks the entire construction.
    recap: >
      $B_t$, $B_t^2-t$, and $\exp(\lambda B_t-\lambda^2t/2)$ are martingales
      for every real $\lambda$ — the first answers probability questions, the
      second answers expected-time questions, and the third generalizes both
      once drift is involved.
    dialogue:
      - part: Pricing two contracts on a fair game
        teach: >
          A fair game's running score is a standard Brownian motion $B_t$,
          time in minutes. At minute $5$ the score stands at $B_5 = 3$. A
          broker quotes two contracts that settle at minute $12$: one pays the
          score $B_{12}$, the other pays its square $B_{12}^{2}$.
      - ask: >
          What is the fair value now of the first contract,
          $\mathbb{E}[B_{12} \mid B_5 = 3]$?
        expects: "3"
        hint: >
          $B_{12} = B_5 + (B_{12} - B_5)$.
        feedback: >
          The increment has mean $0$ and is independent of everything up to
          minute $5$, so $\mathbb{E}[B_{12} \mid B_5 = 3] = 3 + 0 = 3$. The
          best forecast of a fair game is where it stands now.
      - ask: >
          What is the fair value now of the second contract,
          $\mathbb{E}[B_{12}^{2} \mid B_5 = 3]$?
        expects: "16"
        hint: >
          Square $3 + X$ with $X \sim N(0, 7)$ independent of the past, then
          take expectations term by term.
        feedback: >
          $\mathbb{E}[(3 + X)^{2}] = 9 + 2 \cdot 3 \cdot \mathbb{E}[X] +
          \mathbb{E}[X^{2}] = 9 + 0 + 7 = 16$. Not $9$: the square picks up
          the variance of the remaining seven minutes.
      - ask: >
          So is $B_t^{2}$ a martingale?
        choices:
          - text: >
              Yes: it is a function of a martingale, so it is one too.
            feedback: >
              Convex functions of martingales drift upward. Here the forecast
              of $B_{12}^{2}$ is $16$ while its current value is $9$.
          - text: >
              No: its forecast exceeds its current value by the elapsed time.
            correct: true
            feedback: >
              $\mathbb{E}[B_t^{2} \mid \mathcal{F}_s] = B_s^{2} + (t - s)$.
              The excess $7$ is exactly the time between minute $5$ and minute
              $12$, whatever the current score.
          - text: >
              Only when the current score is $0$.
            feedback: >
              From a score of $0$ the forecast of $B_{12}^{2}$ is $0 + 7 = 7$,
              still above the current $0$. The drift is there at every score.
        feedback: >
          $B_t^{2}$ grows in expectation at rate $1$ per unit time, regardless
          of where the game stands.
      - reflect: >
          What could you subtract from $B_t^{2}$ so that the forecast of the
          result always equals its current value? Say why your fix works for
          every $s < t$, not just minutes $5$ and $12$.
        hint: >
          The excess is $t - s$, and it does not depend on $B_s$.
        answer: >
          Subtract $t$. Since $\mathbb{E}[B_t^{2} \mid \mathcal{F}_s] = B_s^{2}
          + (t - s)$, you get $\mathbb{E}[B_t^{2} - t \mid \mathcal{F}_s] =
          B_s^{2} - s$, the current value of $B^{2} - t$. The compensator is
          deterministic because the variance of a future increment depends
          only on elapsed time, never on the current level.

      - part: A third contract, on the exponential
        ask: >
          Now a contract paying $e^{2B_3}$ at minute $3$, priced at minute
          $0$. What is $\mathbb{E}[e^{2B_3}]$? Give two decimal places.
        expects: "403.43"
        tolerance: 0.01
        hint: >
          The normal moment generating function:
          $\mathbb{E}[e^{\lambda X}] = e^{\lambda^{2}\sigma^{2}/2}$ for
          $X \sim N(0, \sigma^{2})$.
        feedback: >
          $B_3 \sim N(0, 3)$, so $\mathbb{E}[e^{2B_3}] = e^{4 \cdot 3/2} =
          e^{6} \approx 403.43$, while $e^{2B_0} = 1$. The exponential drifts
          upward even faster than the square.
      - ask: >
          Which deterministic factor turns $e^{2B_t}$ into a martingale?
        choices:
          - text: >
              $e^{-t}$
            feedback: >
              Then $\mathbb{E}[e^{2B_3 - 3}] = e^{6 - 3} = e^{3}$, still above
              the starting value $1$. You need to cancel $\lambda^{2}t/2$ with
              $\lambda = 2$, not $\lambda t/2$.
          - text: >
              $e^{-4t}$
            feedback: >
              That overshoots: $\mathbb{E}[e^{2B_3 - 12}] = e^{-6}$, so the
              process sinks in expectation. The variance term is
              $\lambda^{2}t/2$, with the half.
          - text: >
              $e^{-2t}$
            correct: true
            feedback: >
              $\mathbb{E}[e^{2(B_t - B_s)}] = e^{2(t - s)}$, so
              $e^{2B_t - 2t}$ has forecast $e^{2B_s - 2s}$, its current value.
        feedback: >
          For general $\lambda$ the increment contributes
          $e^{\lambda^{2}(t - s)/2}$, so the compensator is
          $e^{-\lambda^{2}t/2}$.
      - teach: >
          Those are the three Brownian martingales: $B_t$, because increments
          have mean $0$; $B_t^{2} - t$, because increments have variance equal
          to elapsed time; and $\exp(\lambda B_t - \lambda^{2}t/2)$ for every
          real $\lambda$, which is the normal moment generating function
          rearranged. Each is the continuous image of a discrete walk
          martingale: $S_n$, $S_n^{2} - n$, and the exponential one.

      - part: Reading them, and misreading them
        ask: >
          At minute $6$ the score is $B_6 = 0.5$. Using the exponential
          martingale with $\lambda = 1$, what is
          $\mathbb{E}[e^{B_{10} - 5} \mid B_6 = 0.5]$? Give four decimal
          places.
        expects: "0.0821"
        tolerance: 0.0005
        hint: >
          Write $e^{B_{10} - 5} = e^{B_{10} - 10/2}$ and use that its forecast
          is its current value $e^{B_6 - 6/2}$.
        feedback: >
          $e^{B_t - t/2}$ is a martingale, so the forecast is
          $e^{0.5 - 3} = e^{-2.5} \approx 0.0821$. Directly: $e^{0.5}e^{-5}
          \mathbb{E}[e^{X}]$ with $X \sim N(0, 4)$ gives
          $e^{0.5 - 5 + 2} = e^{-2.5}$.
      - ask: >
          Which of these is not a martingale?
        choices:
          - text: >
              $\exp(3B_t - 4.5t)$
            feedback: >
              $\lambda = 3$ needs $\lambda^{2}/2 = 4.5$, which is exactly what
              is subtracted. This one is a martingale.
          - text: >
              $\exp(B_t - t)$
            correct: true
            feedback: >
              With $\lambda = 1$ the compensator is $t/2$, not $t$. Here
              $\mathbb{E}[e^{B_t - t}] = e^{t/2 - t} = e^{-t/2}$, which sinks
              from $1$: a supermartingale.
          - text: >
              $-B_t$
            feedback: >
              The increments of $-B$ still have mean $0$. A sign flip of a
              martingale is a martingale.
          - text: >
              $B_t^{2} - t$
            feedback: >
              The compensated square, the second of the three.
        feedback: >
          The half in $\lambda^{2}t/2$ is where people slip; check it with
          $\mathbb{E}[\cdot] = 1$ at any fixed $t$.
      - ask: >
          A game runs until the score first hits $+2$ or $-5$. To find the
          probability that it ends at $+2$, which martingale do you stop?
        choices:
          - text: >
              $B_t^{2} - t$, because the exit time is involved.
            feedback: >
              Stopping $B^{2} - t$ ties together $\mathbb{E}[B_\tau^{2}]$ and
              $\mathbb{E}[\tau]$. It answers how long the game lasts once the
              exit probability is known; it does not find that probability.
          - text: >
              $B_t$
            correct: true
            feedback: >
              Its expected stopped value stays $0$, and the stopped value is
              $2$ or $-5$, so $0 = 2p - 5(1 - p)$ gives the probability in one
              line.
          - text: >
              $\exp(\lambda B_t - \lambda^{2}t/2)$, because it covers all the
              others.
            feedback: >
              It can be made to work, but $\tau$ enters its stopped value, so
              you would be solving for more than you need. With no drift, the
              plain $B_t$ is enough.
        feedback: >
          The division of labour: $B_t$ for where the game ends, $B_t^{2} - t$
          for how long it takes, and the exponential once a drift has to be
          cancelled.

  - node: quant-processes.brownian.quadratic-variation
    hook: >
      "$(dB)^2=dt$" is the one line that explains why stochastic calculus
      needs its own chain rule — the single place where ordinary calculus's
      intuition, that $dx^2$ is negligible, fails outright for Brownian
      paths.
    explanation: >
      Partition $[0,t]$ finely and sum the squared increments,
      $\sum_i(B_{t_i}-B_{t_{i-1}})^2$. Each squared increment has mean
      $\Delta_i=t_i-t_{i-1}$ exactly — by the $\sqrt t$ scaling of Brownian
      motion, $\operatorname{Var}(B_{t_i}-B_{t_{i-1}})=\Delta_i$ — so the
      sum's mean is $\sum_i\Delta_i=t$ for every partition, with no limit
      needed yet.

      What needs the limit is the variance shrinking to zero. A standard
      normal has $\operatorname{Var}(Z^2)=2$, so the $i$-th squared increment
      has variance $2\Delta_i^2$; summing across independent pieces gives
      total variance $2\sum_i\Delta_i^2\le2t\max_i\Delta_i$, which vanishes as
      the mesh $\max_i\Delta_i\to0$. Mean exactly $t$, variance shrinking to
      $0$: the sum converges to $t$ itself, deterministically, written
      $\langle B\rangle_t=t$.

      Contrast this with any continuously differentiable path, whose
      quadratic variation is always $0$ — squared increments there really are
      negligible in the limit, exactly the intuition ordinary calculus relies
      on. Brownian increments are order $\sqrt{\Delta_i}$, not
      $O(\Delta_i)$, so their squares are order $\Delta_i$ — the same order
      as $dt$ itself, not smaller. That order-of-magnitude mismatch is why a
      naive Riemann-sum treatment of integrals against $B$ fails, and it is
      the second-order term that survives in Itô's lemma.
    worked: >
      Partition $[0,1]$ into $n=100$ equal pieces, $\Delta_i=0.01$. The sum of
      squared increments has mean exactly $\sum_i0.01=1$ for every $n$, but
      its variance is $2\times100\times0.01^2=0.02$ at $n=100$; at $n=10000$
      the same computation gives variance $2\times10000\times0.0001^2=0.0002$
      — shrinking by a factor of $100$ as the mesh shrinks by $100$,
      confirming the sum concentrates tightly around $1=t$.
    interview: >
      "Why is $(dB)^2=dt$ and not $0$" wants the two-line argument: the mean
      of the squared-increment sum is exactly $t$ for any partition, and its
      variance vanishes as the mesh shrinks — say both, not just the informal
      notation.
    pitfalls: >
      Carrying over the ordinary-calculus habit of treating squared
      increments as negligible — here they accumulate to a nonzero,
      deterministic limit. Thinking of quadratic variation as a random
      quantity that merely tends to be near $t$; it converges in $L^2$ to the
      fixed number $t$, not to a random variable.
    recap: >
      Summed squared increments of Brownian motion converge to the elapsed
      time $t$ itself, not to $0$ — the fact that makes stochastic calculus
      genuinely different from ordinary calculus.
    dialogue:
      - part: Realized variance on a sampling grid
        teach: >
          A log-price follows a standard Brownian motion over a four-hour
          session, time in hours. A quant computes its realized variance: cut
          $[0, 4]$ into equal intervals, take the change over each, square,
          and add. She starts with five-minute sampling, $48$ intervals of
          length $1/12$.
      - ask: >
          What is the expected value of the sum of the $48$ squared changes?
        expects: "4"
        hint: >
          A change over an interval of length $\Delta$ has variance $\Delta$,
          and its mean is $0$.
        feedback: >
          Each squared change has mean $\mathbb{E}[(\Delta B)^{2}] = 1/12$, so
          the sum has mean $48 \times 1/12 = 4$, the session length. With
          one-minute sampling it is $240 \times 1/60 = 4$ again: the expected
          sum is $t$ on every grid.
      - ask: >
          Compare a smooth path: the deterministic line $f(t) = t$ on the same
          $48$ intervals. What is the sum of its squared changes? Give four
          decimal places.
        expects: "0.3333"
        tolerance: 0.0005
        hint: >
          Each change of $f$ over an interval of length $1/12$ is $1/12$.
        feedback: >
          $48 \times (1/12)^{2} = 1/3$. With $480$ intervals it is
          $480 \times (1/120)^{2} = 1/30$: for a smooth path the sum shrinks
          like $1/n$ and vanishes in the limit.
      - ask: >
          Why does the Brownian sum not shrink the way the line's does?
        choices:
          - text: >
              Brownian changes are bigger: over an interval of length $\Delta$
              they are of size $\sqrt{\Delta}$, so their squares are of size
              $\Delta$.
            correct: true
            feedback: >
              The line's changes are of size $\Delta$ and their squares
              $\Delta^{2}$, so $n$ of them give $n\Delta^{2} = t\Delta \to 0$.
              Brownian squares are of size $\Delta$, and $n$ of them give
              $n\Delta = t$.
          - text: >
              Brownian changes do not cancel, since they are independent.
            feedback: >
              Squaring removes all cancellation, for the line too. The issue is
              the size of each square, not signs.
          - text: >
              It does shrink, just more slowly; the limit is still $0$.
            feedback: >
              The expected sum is exactly $4$ on every grid, with no trend
              toward $0$ at all.
        feedback: >
          The scaling property is the whole story: a change over time
          $\Delta$ is of order $\sqrt{\Delta}$, so its square is of order
          $\Delta$, the same order as the time step itself.
      - reflect: >
          The expected sum is $4$ on every grid, but the sum itself is random.
          What would you need to show to conclude that, as the grid gets
          finer, the sum converges to the number $4$ itself — and why should
          that happen?
        hint: >
          A random quantity with fixed mean is pinned to that mean if one
          other number goes to $0$.
        answer: >
          Show that its variance goes to $0$. The squared changes are
          independent, because the intervals do not overlap, so their
          variances add. Each is $\Delta$ times the square of a standard
          normal, with variance $2\Delta^{2}$, so the total is $2n\Delta^{2} =
          2t\Delta$, which vanishes as $\Delta \to 0$. A sum with mean $t$ and
          vanishing variance converges to $t$.

      - part: The variance that vanishes
        ask: >
          Using $\operatorname{Var}(Z^{2}) = 2$ for a standard normal $Z$, what
          is the variance of the five-minute realized variance, the sum over
          $48$ intervals? Give four decimal places.
        expects: "0.6667"
        tolerance: 0.0005
        hint: >
          A squared change over length $1/12$ is $(1/12)Z^{2}$.
        feedback: >
          Each term has variance $2 \times (1/12)^{2} = 1/72$, and
          $48 \times 1/72 = 2/3 \approx 0.6667$. Equivalently
          $2t\Delta = 2 \times 4 \times 1/12$.
      - ask: >
          And with one-minute sampling, $240$ intervals? Give four decimal
          places.
        expects: "0.1333"
        tolerance: 0.0005
        hint: >
          $2t\Delta$ with $\Delta = 1/60$.
        feedback: >
          $2 \times 4 \times 1/60 = 2/15 \approx 0.1333$. Five times finer
          sampling, five times less variance, and the mean has not moved
          from $4$.
      - teach: >
          That is the theorem: for partitions of $[0, t]$ with mesh
          $\max_i \Delta_i \to 0$,
          $\sum_i (B_{t_i} - B_{t_{i-1}})^{2} \to t$ in $L^{2}$, written
          $\langle B \rangle_t = t$ or $(dB)^{2} = dt$. The mean is exactly
          $\sum_i \Delta_i = t$, and the variance is
          $2\sum_i \Delta_i^{2} \le 2t\max_i \Delta_i \to 0$. Any continuously
          differentiable path has quadratic variation $0$.

      - part: Scaling it, and breaking it
        ask: >
          A desk models the log-price as $X_t = 0.3B_t$, time in years. What
          is $\langle X \rangle_4$?
        expects: "0.36"
        hint: >
          Every squared change of $X$ is $0.09$ times the squared change of
          $B$.
        feedback: >
          $\langle X \rangle_4 = 0.3^{2} \times 4 = 0.36$. Realized variance
          measures $\sigma^{2}t$, which is why it is the estimator of
          volatility.
      - ask: >
          A sloppy grid on $[0, 4]$: keep $[0, 2]$ as one interval and cut
          $[2, 4]$ into a million pieces. What does the variance of the sum of
          squared changes tend to?
        expects: "8"
        hint: >
          The fine part contributes almost nothing. What does the single
          interval of length $2$ contribute?
        feedback: >
          The coarse interval gives $2 \times 2^{2} = 8$, and the fine part
          gives $2 \times 2 \times 2 \times 10^{-6} \approx 0$. The sum
          stays random, with variance $8$, however many pieces you add.
      - ask: >
          Which hypothesis did the sloppy grid drop?
        choices:
          - text: >
              Equal spacing of the intervals.
            feedback: >
              Unequal intervals are fine. The bound
              $2\sum_i \Delta_i^{2} \le 2t\max_i \Delta_i$ needs only that the
              largest one shrinks.
          - text: >
              The mesh going to $0$: the number of pieces grew, but the
              largest piece did not shrink.
            correct: true
            feedback: >
              The variance is controlled by the largest interval. A million
              pieces with one interval of length $2$ still leaves the sum
              random.
          - text: >
              Independence of the changes.
            feedback: >
              The intervals still do not overlap, so the changes are
              independent. Nothing went wrong there.
        feedback: >
          "Mesh to $0$", not "number of pieces to infinity": that is the
          precise hypothesis, and it is the one people quote loosely.
      - ask: >
          Expand a smooth function of the path over one short step,
          $f(B_{t+\Delta}) - f(B_t) \approx f'(B_t)\,\Delta B +
          \tfrac{1}{2}f''(B_t)(\Delta B)^{2}$. Summed over a fine grid, what
          does the second-order term become?
        choices:
          - text: >
              Nothing: second-order terms vanish in the limit, as in ordinary
              calculus.
            feedback: >
              They vanish when $(\Delta B)^{2}$ is of order $\Delta^{2}$. Here
              it is of order $\Delta$, and summing $\Delta$'s gives elapsed
              time, not $0$.
          - text: >
              A random term with no limit.
            feedback: >
              The argument you just made shows the squared changes add up to a
              deterministic quantity, not a random one.
          - text: >
              $\tfrac{1}{2}\int f''(B_s)\,ds$: each $(\Delta B)^{2}$ acts like
              $\Delta$.
            correct: true
            feedback: >
              Replace $(dB)^{2}$ by $dt$ and the term survives as an ordinary
              time integral. That extra term is the difference between Itô's
              lemma and the chain rule.
        feedback: >
          $(dB)^{2} = dt$ is the one rule ordinary calculus lacks, and the
          stochastic calculus of the next unit is built on it.

  - node: quant-processes.brownian.nondifferentiability
    hook: >
      "Is Brownian motion differentiable" is a fast disqualifying question,
      and the reason it fails is exactly the reason a P&L path can't be
      treated with an ordinary instantaneous rate of change.
    explanation: >
      Over a window of length $h$, a Brownian increment is of typical size
      $\sqrt h$, so the difference quotient $(B_{t+h}-B_t)/h$ is of order
      $\sqrt h/h=h^{-1/2}$ — this blows up, rather than settling down, as
      $h\to0$. That heuristic is not just suggestive; it is a theorem: with
      probability $1$, the path is differentiable at no time at all, and it
      has infinite total variation on every interval, however short.

      The variation claim follows from quadratic variation directly. For any
      partition, $\sum_i(\Delta B_i)^2\le\left(\max_i|\Delta
      B_i|\right)\sum_i|\Delta B_i|$, and continuity sends $\max_i|\Delta
      B_i|\to0$ as the mesh shrinks. If the total variation $\sum_i|\Delta
      B_i|$ stayed bounded, the right side would vanish — forcing quadratic
      variation to $0$, which contradicts it converging to $t$. So total
      variation cannot be bounded; it is infinite on every interval.

      Quantifying the wiggle: paths are Hölder continuous of every order
      $\alpha<1/2$ but of no order $\alpha\ge1/2$ — the exact borderline set
      by the $\sqrt h$ increment size. Since ordinary integration theory
      needs the integrator to have finite variation, $\int f\,dB$ simply
      cannot be built path by path that way; this is precisely why stochastic
      integration needs its own construction.
    interview: >
      "Is Brownian motion differentiable, and can you sketch why" wants the
      $\sqrt h/h\to\infty$ heuristic produced immediately, followed by naming
      infinite total variation as the rigorous consequence — not just "no,
      it's too jagged."
    pitfalls: >
      Assuming continuity implies differentiability somewhere — false here;
      the failure is simultaneous at every single time, not merely at
      isolated points. Assuming a continuous, bounded path automatically has
      finite variation on a compact interval — that implication needs more
      than continuity, and Brownian motion is the standing counterexample.
    recap: >
      Increments of size $\sqrt h$ over windows of length $h$ send every
      difference quotient to infinity, so the path is nowhere differentiable
      and has infinite variation on every interval — the reason stochastic
      integration can't be built path by path.
    dialogue:
      - part: Measuring the speed of a price
        teach: >
          A log-price follows a standard Brownian motion, time in days. A
          junior analyst wants its instantaneous speed, so she computes the
          difference quotient $(B_{t+h} - B_t)/h$ over shorter and shorter
          windows: a day, an hour, a minute.
      - ask: >
          Before computing anything: what happens to the typical size of the
          quotient as $h$ shrinks?
        choices:
          - text: >
              It settles down to a definite slope, as for any continuous path.
            feedback: >
              That is what happens for a differentiable path, where
              $B_{t+h} - B_t \approx (\text{slope}) \times h$. Brownian
              changes are not of order $h$, so the division by $h$ does not
              balance them.
          - text: >
              It shrinks to $0$, because over a tiny window the price barely
              moves.
            feedback: >
              The numerator does shrink, but the denominator shrinks faster.
              Over a window $h$ the move is of size $\sqrt{h}$, much larger
              than $h$ when $h$ is small.
          - text: >
              It grows without bound.
            correct: true
            feedback: >
              The move over a window $h$ has standard deviation $\sqrt{h}$, so
              the quotient has standard deviation $\sqrt{h}/h = h^{-1/2}$,
              which explodes as $h \to 0$.
        feedback: >
          The heuristic in one line: increments of size $\sqrt{h}$ over
          windows of length $h$ make every slope infinite in the limit.
      - ask: >
          What is the standard deviation of the quotient for $h = 0.04$ days?
        expects: "5"
        hint: >
          $B_{t+h} - B_t \sim N(0, h)$; divide its standard deviation by $h$.
        feedback: >
          $\sqrt{0.04}/0.04 = 0.2/0.04 = 5$. At $h = 0.0001$ it is
          $0.01/0.0001 = 100$: shrink the window by $400$ and the quotient
          grows by $20$.

      - part: The odometer that never stops
        ask: >
          Now total distance travelled instead of speed. Cut one day into
          $10\,000$ equal windows and add up the absolute moves
          $|B_{t_i} - B_{t_{i-1}}|$. What is the expected total? Use
          $\mathbb{E}|Z| = \sqrt{2/\pi} \approx 0.7979$ and give two decimal
          places.
        expects: "79.79"
        tolerance: 0.01
        hint: >
          Each window has length $10^{-4}$, so each absolute move is
          $10^{-2}|Z|$ in law.
        feedback: >
          $10\,000 \times 0.01 \times 0.7979 \approx 79.79$. In general $n$
          windows give $\sqrt{n} \times 0.7979$: the odometer grows like
          $\sqrt{n}$ as the grid refines, with no limit.
      - reflect: >
          You know the squared moves add up to $1$ on a fine grid. Use that,
          and the continuity of the path, to explain why the total distance
          cannot stay bounded as the grid refines.
        hint: >
          Bound the sum of squares by the largest absolute move times the sum
          of absolute moves.
        answer: >
          $\sum_i (\Delta B_i)^{2} \le (\max_i |\Delta B_i|)\sum_i |\Delta
          B_i|$. Continuity sends the largest move to $0$ as the mesh shrinks.
          If the total distance $\sum_i |\Delta B_i|$ stayed bounded, the right
          side would go to $0$ and drag the quadratic variation to $0$, but it
          converges to $1$. So the total variation is infinite.
      - teach: >
          Both heuristics are theorems. With probability $1$ the Brownian path
          is differentiable at no time at all, and it has infinite total
          variation on every interval, however short. The roughness has an
          exact borderline: paths are Hölder continuous of every order
          $\alpha < 1/2$ and of no order $\alpha \ge 1/2$.

      - part: Where intuition from calculus misleads
        ask: >
          A candidate argues: "The path is continuous, so it must at least be
          differentiable at most times; the blow-up only happens at special
          points." What is wrong?
        choices:
          - text: >
              Nothing: continuous functions are differentiable except at
              isolated points.
            feedback: >
              That is the intuition from functions drawn by hand, and it is
              false in general. The Brownian path is continuous and fails to
              be differentiable at every single time.
          - text: >
              The failure happens at every time at once, with probability $1$.
            correct: true
            feedback: >
              Right. Restarted at any fixed time the path is a fresh Brownian
              motion, so no time is special, and the theorem says the
              failure holds at all times simultaneously.
          - text: >
              The path is not actually continuous, which is why it fails to be
              differentiable.
            feedback: >
              Continuity is one of the four defining properties. The path is
              continuous everywhere and differentiable nowhere — the two are
              compatible.
        feedback: >
          Continuity controls the size of moves; differentiability needs them
          to be proportional to the window. Brownian motion has the first
          without the second.
      - ask: >
          For which exponent $\alpha$ can a bound
          $|B_{t+h} - B_t| \le Ch^{\alpha}$ hold for all small $h$ on
          $[0, 1]$?
        choices:
          - text: >
              $\alpha = 1$
            feedback: >
              That is a Lipschitz bound, which would cap the difference
              quotient at $C$. The quotient is of order $h^{-1/2}$.
          - text: >
              $\alpha = 1/2$
            feedback: >
              The border itself fails. $\sqrt{h}$ is the typical size at one
              time, and over all times in $[0, 1]$ the worst move is larger by
              a factor that grows slowly as $h \to 0$.
          - text: >
              $\alpha = 0.4$
            correct: true
            feedback: >
              Any order below $1/2$ works: $h^{0.4}$ eventually dominates
              $\sqrt{h}$ times any slowly growing factor.
        feedback: >
          Increments of size $\sqrt{h}$ set the borderline at exactly $1/2$,
          and the border belongs to the failing side.
      - ask: >
          Why can $\int_0^{1} f(t)\,dB_t$ not be defined as an ordinary
          Riemann–Stieltjes integral, path by path?
        choices:
          - text: >
              Because $B$ is random, and Riemann–Stieltjes integrals need a
              deterministic integrator.
            feedback: >
              Fix the path and it is a deterministic function. The obstacle is
              what kind of function it is.
          - text: >
              Because the path has infinite variation, and Riemann–Stieltjes
              integration needs an integrator of finite variation.
            correct: true
            feedback: >
              The sums $\sum_i f(t_i)\Delta B_i$ are not controlled by
              $\max|f| \times \sum_i |\Delta B_i|$ when that sum is infinite.
              Stochastic integration builds the integral in $L^{2}$ instead.
          - text: >
              Because $B$ is not continuous enough to be integrated against.
            feedback: >
              Continuity is not the issue. The path is continuous, but rough
              in a way finite-variation theory cannot handle.
        feedback: >
          That is why stochastic integration is its own subject rather than
          a corner of ordinary calculus.

  - node: quant-processes.brownian.reflection-bm
    hook: >
      "What's the probability the path ever touches level $a$ by time $t$" is
      answered by mirroring the path after its first touch, and the clean
      factor of $2$ this produces is worth having automatic.
    explanation: >
      Let $\tau_a$ be the first time the path reaches $a$. On the event
      $\tau_a\le t$, the strong Markov property restarts the process at $a$
      as a fresh, symmetric Brownian motion — equally likely to finish above
      or below $a$ by the remaining time. So among paths that have touched
      $a$ by time $t$, exactly half finish above $a$ and half finish below:
      $\Pr(M_t\ge a,\,B_t<a)=\Pr(M_t\ge a,\,B_t>a)$.

      The second half of that equality collapses further: finishing above
      $a$ already forces the running maximum above $a$, so $\Pr(M_t\ge
      a,\,B_t>a)=\Pr(B_t>a)$ outright — reaching the level is automatic once
      you've finished past it. Adding the two symmetric halves back together
      gives $\Pr(M_t\ge a)=2\Pr(B_t\ge a)$, and rewriting with the normal
      CDF, $\Pr(M_t\ge a)=2\left(1-\Phi(a/\sqrt t)\right)$.

      The same identity says something sharper: $\Pr(M_t\ge a)=\Pr(|B_t|\ge
      a)$ — the event "the path ever reaches $a$" has exactly the same
      probability as "the path ends up at least $a$ away from $0$ in either
      direction," a genuinely useful shortcut whenever a maximum needs
      converting into an ordinary tail probability.
    worked: >
      Take $a=0.5$, $t=4$: $\Pr(M_4\ge0.5)=2\left(1-\Phi(0.5/2)\right)=
      2\left(1-\Phi(0.25)\right)\approx2(1-0.5987)=0.8026$ — over $80\%$
      chance the path has drifted at least half a unit above $0$ at some
      point in the first four time units, versus only
      $\Pr(B_4\ge0.5)\approx0.4013$ chance of finishing there.
    interview: >
      "What's $\Pr(M_t\ge a)$" wants the mirror-argument sketch, not just the
      formula — say the strong Markov restart, the symmetric split, and the
      factor of $2$, then quote $2(1-\Phi(a/\sqrt t))$.
    pitfalls: >
      Reporting $\Pr(B_t\ge a)$ alone and forgetting to double it — this is
      only the "finished above $a$" half, missing every path that touched $a$
      and came back down. Plugging $a/t$ instead of $a/\sqrt t$ into $\Phi$
      mixes up the space and time scaling.
    recap: >
      $\Pr(M_t\ge a)=2\Pr(B_t\ge a)=\Pr(|B_t|\ge a)$: mirror the path after
      its first touch of $a$, and the ever-touching probability is exactly
      twice the finishing-beyond probability.
    dialogue:
      - part: Two digitals on one barrier
        teach: >
          An underlying follows a standard Brownian motion, time in months.
          Two contracts reference the level $1.6$ over the next $4$ months. A
          European digital pays $100$ if the underlying ends above $1.6$ at
          month $4$. A one-touch pays $100$ if the underlying touches $1.6$ at
          any moment before month $4$.
      - ask: >
          What is the probability that the European digital pays? Use
          $\Phi(0.8) = 0.7881$.
        expects: "0.2119"
        tolerance: 0.0005
        hint: >
          $B_4 \sim N(0, 4)$, standard deviation $2$.
        feedback: >
          $\Pr(B_4 > 1.6) = \Pr(Z > 0.8) = 1 - 0.7881 = 0.2119$.
      - ask: >
          Which paths pay on the one-touch but not on the European?
        choices:
          - text: >
              None: a path that touches $1.6$ stays near it and ends above.
            feedback: >
              After touching, the path keeps moving, and nothing pushes it
              up. Plenty of paths touch $1.6$ in month $2$ and end below it.
          - text: >
              Paths that touch $1.6$ and then end below it.
            correct: true
            feedback: >
              Every path that ends above $1.6$ touched it on the way, by
              continuity, so the one-touch pays on all of those and on the
              touch-and-retreat paths as well.
          - text: >
              Paths that end above $1.6$ without ever touching it.
            feedback: >
              A continuous path from $0$ to above $1.6$ must pass through
              $1.6$. There are no such paths.
        feedback: >
          So the one-touch probability is $0.2119$ plus the probability of
          touching and then retreating. Everything turns on that second piece.
      - reflect: >
          Take the paths that touch $1.6$ at some moment before month $4$.
          What fraction of them end above $1.6$, and why?
        hint: >
          Restart the clock at the first touch. What does the path do from
          there?
        answer: >
          Half. The first touch is a stopping time, so by the strong Markov
          property the path after it is a fresh Brownian motion started at
          $1.6$, independent of how it got there. A fresh Brownian motion is
          symmetric, so whatever time remains, it is as likely to end above
          $1.6$ as below. The touch-and-retreat paths are therefore exactly as
          likely as the touch-and-finish-above paths.
      - ask: >
          Here is the symmetry made concrete. A path first touches $1.6$ in
          month $1.5$ and ends at $1.0$. Mirror everything after the touch in
          the line at $1.6$. Where does the mirrored path end?
        expects: "2.2"
        hint: >
          The mirror image of $b$ in the level $a$ is $2a - b$.
        feedback: >
          The original ends $0.6$ below the level, so the mirror ends $0.6$
          above: $2 \times 1.6 - 1.0 = 2.2$. Mirroring is a one-to-one pairing
          of touch-and-retreat paths with paths that end above $1.6$, and it
          preserves probability.
      - teach: >
          That is the reflection principle. With $M_t = \max_{0 \le s \le t}
          B_s$ and $a > 0$,
          $\Pr(M_t \ge a) = 2\Pr(B_t \ge a) = \Pr(|B_t| \ge a) =
          2(1 - \Phi(a/\sqrt{t}))$. The proof is exactly your argument: the
          strong Markov property at the first hitting time $\tau_a$ splits
          the touching paths evenly, and finishing above $a$ already forces
          a touch.

      - part: Pricing the one-touch
        ask: >
          What is the probability that the one-touch pays?
        expects: "0.4238"
        tolerance: 0.0005
        hint: >
          Double the European probability.
        feedback: >
          $2 \times 0.2119 = 0.4238$. The one-touch is worth exactly twice the
          European digital on the same level and horizon — a desk rule of
          thumb with an exact proof behind it, for driftless paths.
      - ask: >
          Why mirror at the first touch rather than at, say, the time of the
          path's highest point?
        choices:
          - text: >
              It makes no difference; any time the path is at or above $1.6$
              works.
            feedback: >
              After the time of the maximum the path never goes higher, so the
              part after it is not symmetric: mirroring would send it upward,
              to paths that are not equally likely.
          - text: >
              The first touch is a stopping time, so the path after it is a
              fresh symmetric Brownian motion.
            correct: true
            feedback: >
              The time of the maximum depends on the future, and the strong
              Markov property gives nothing there. The first touch is decided
              by the path so far.
          - text: >
              The first touch is the only time the path equals $1.6$.
            feedback: >
              A Brownian path that touches $1.6$ returns to it immediately and
              infinitely often. Being at the level is not the point; being a
              stopping time is.
        feedback: >
          The strong Markov property is used exactly once, at $\tau_a$, and it
          is why the restart is legal.

      - part: Where the factor of two fails
        ask: >
          The underlying now has an upward drift. Is the one-touch still worth
          exactly twice the European?
        choices:
          - text: >
              Yes: the reflection argument never used the drift.
            feedback: >
              It used symmetry after the touch. With an upward drift the
              restarted path is more likely to end above $1.6$ than below.
          - text: >
              No: it is worth less than twice the European.
            correct: true
            feedback: >
              More of the touching paths now finish above the level, so the
              touch-and-retreat piece is smaller than the finish-above piece,
              and the ratio drops below $2$.
          - text: >
              No: it is worth more than twice the European.
            feedback: >
              Drift up makes retreating after the touch less likely, not more.
              The retreat piece shrinks relative to the finish-above piece.
        feedback: >
          The factor $2$ is symmetry, and drift breaks symmetry. A
          downward drift tips it the other way, above $2$.
      - ask: >
          In practice the one-touch is monitored only at daily closes. How
          does the true payout probability compare with $0.4238$?
        choices:
          - text: >
              It is smaller: a path can touch $1.6$ between closes and be back
              below by the next close.
            correct: true
            feedback: >
              Discrete monitoring misses intraday touches, so the continuous
              formula overprices it. Desks shift the barrier slightly away to
              compensate.
          - text: >
              It is the same, since the closes sample the same path.
            feedback: >
              The closes see the path at a finite set of times. Any touch
              between them goes unrecorded.
          - text: >
              It is larger, since each close is a fresh chance to be above.
            feedback: >
              The continuous contract already counts every moment, closes
              included. Watching fewer moments can only miss touches.
        feedback: >
          The reflection principle prices continuous monitoring. Any coarser
          monitoring sits strictly between the European and the one-touch.

  - node: quant-processes.brownian.running-max-law
    hook: >
      "What's the expected high-water mark of a driftless log-price over a
      year" is a stock desk question, and the answer is a folded normal mean
      you should have memorized, not re-derived under time pressure.
    explanation: >
      Reflection says $M_t$ and $|B_t|$ share a distribution, so the running
      maximum's density is just the normal density folded onto the positive
      axis: $f_{M_t}(a)=\sqrt{2/(\pi t)}\,e^{-a^2/(2t)}$ for $a\ge0$. Every
      moment of $M_t$ is therefore a moment of $|B_t|$, computed off the
      ordinary normal — no new machinery, just the fold.

      The mean comes out to $\mathbb{E}[M_t]=\sqrt{2t/\pi}\approx0.798\sqrt
      t$, and since $M_t^2=B_t^2$ in law, $\mathbb{E}[M_t^2]=
      \mathbb{E}[B_t^2]=t$ exactly — giving
      $\operatorname{Var}(M_t)=t(1-2/\pi)\approx0.363t$. A trap hides in that
      second moment: it looks identical to $\mathbb{E}[B_t^2]$ because it is
      identical, but $M_t$ (the running peak over the whole interval) and
      $B_t$ (the value at the single endpoint) are different random variables
      that merely share this one moment.

      The joint law extends the reflection argument one step further:
      $\Pr(M_t\ge a,\,B_t\le b)=\Pr(B_t\ge2a-b)$ for $a\ge\max(b,0)$ — the
      endpoint $2a-b$ is $b$ mirrored across the level $a$, the same
      mirroring idea that proved the marginal formula. One more consequence
      worth keeping: the drawdown from the peak, $M_t-B_t$, again has the law
      of $|B_t|$ — the process forgets its own peak in the same way it
      forgets its own barrier crossings.
    worked: >
      A driftless log-price with $25\%$ annualized volatility has $B_t$
      scaled by $\sigma=0.25$, so the expected one-year high is
      $\sigma\sqrt{2/\pi}=0.25\times0.7979\approx0.1995$ — about a $20\%$
      expected peak above the starting level over the year, using nothing but
      the folded-normal mean scaled by the volatility.
    interview: >
      "What's the expected maximum of a driftless random walk (or
      log-price) over a horizon $T$" is answered cold with
      $\sigma\sqrt{2T/\pi}\approx0.8\sigma\sqrt T$; a sharp follow-up asks for
      the law of the drawdown from the peak, answered by naming it as another
      copy of $|B_t|$.
    pitfalls: >
      Confusing the numerically-identical-looking $\mathbb{E}[M_t^2]=t$ with
      a claim that $M_t$ and $B_t$ have the same distribution everywhere —
      they share only this one moment, not the full law (the mean already
      differs). Forgetting to rescale by $\sigma$ when the underlying process
      isn't standard Brownian motion.
    recap: >
      The running maximum is distributed as $|B_t|$, giving mean
      $\sqrt{2t/\pi}$ and variance $t(1-2/\pi)$, and the drawdown from that
      peak has the identical law.
    dialogue:
      - part: The peak of a trading book
        teach: >
          A driftless trading book's P&L follows a standard Brownian motion,
          time in weeks, units in thousands. Your risk manager cares about
          its peak over the next $16$ weeks, $M_{16} = \max_{0 \le s \le 16}
          B_s$, because the bonus is paid on the high-water mark.
      - ask: >
          What is $\Pr(M_{16} \ge 2)$? Use $\Phi(0.5) = 0.6915$.
        expects: "0.6170"
        tolerance: 0.0005
        hint: >
          The reflection principle, with $a = 2$ and $\sqrt{t} = 4$.
        feedback: >
          $\Pr(M_{16} \ge 2) = 2(1 - \Phi(2/4)) = 2(1 - 0.6915) = 0.6170$.
          That is also $\Pr(|B_{16}| \ge 2)$: ending at least $2$ away from
          $0$ in either direction.
      - reflect: >
          The reflection principle gives $\Pr(M_{16} \ge a) = \Pr(|B_{16}| \ge
          a)$ for every level $a \ge 0$, not just $a = 2$. What does that say
          about the random variable $M_{16}$, and what does it buy you for
          computing its mean?
        hint: >
          Two random variables whose tail probabilities agree at every level.
        answer: >
          $M_{16}$ and $|B_{16}|$ have the same distribution: their
          distribution functions agree everywhere. So every question about
          the law of the peak — mean, variance, quantiles — is a question
          about a folded normal, which you can answer with ordinary normal
          integrals. They are different random variables on any given path,
          but identical in law.
      - teach: >
          So $M_t$ is distributed as $|B_t|$, with density
          $\sqrt{2/(\pi t)}\,e^{-a^{2}/(2t)}$ for $a \ge 0$. Hence
          $\mathbb{E}[M_t] = \sqrt{2t/\pi} \approx 0.798\sqrt{t}$,
          $\mathbb{E}[M_t^{2}] = t$, and
          $\operatorname{Var}(M_t) = t(1 - 2/\pi) \approx 0.363t$.

      - part: Moments of the peak
        ask: >
          What is the expected peak $\mathbb{E}[M_{16}]$? Give two decimal
          places.
        expects: "3.19"
        tolerance: 0.005
        hint: >
          $\mathbb{E}|Z| = \sqrt{2/\pi} \approx 0.7979$, and $|B_{16}|$ is
          $4|Z|$ in law.
        feedback: >
          $\mathbb{E}[M_{16}] = 4 \times 0.7979 \approx 3.19$ thousand. The book
          ends at $0$ on average and still peaks above $3$.
      - ask: >
          What is $\operatorname{Var}(M_{16})$? Give two decimal places.
        expects: "5.81"
        tolerance: 0.01
        hint: >
          $\mathbb{E}[M_{16}^{2}] = \mathbb{E}[B_{16}^{2}]$, then subtract the
          squared mean.
        feedback: >
          $16 - 16 \times 2/\pi = 16(1 - 0.6366) \approx 5.81$, a standard
          deviation of about $2.41$. The peak is less dispersed than the
          endpoint, whose variance is $16$, because it is never negative.
      - ask: >
          A strategy's log-value is driftless with $12\%$ annual volatility.
          What is its expected high over $4$ years, in percent above the
          start? Give two decimal places.
        expects: "19.15"
        tolerance: 0.01
        hint: >
          Scale the standard formula by $\sigma$: $\sigma\sqrt{2T/\pi}$.
        feedback: >
          $0.12 \times \sqrt{8/\pi} = 0.12 \times 1.5958 \approx 0.1915$, so
          about $19.15\%$. Forgetting the $\sigma$ gives $160\%$, which should
          sound wrong at once.

      - part: The peak and the endpoint together
        ask: >
          What is the probability that the book touches $2$ but ends at or
          below $0$, $\Pr(M_{16} \ge 2,\, B_{16} \le 0)$? Use $\Phi(1) =
          0.8413$.
        expects: "0.1587"
        tolerance: 0.0005
        hint: >
          Mirror each such path after its first touch of $2$. Where must the
          mirrored path end?
        feedback: >
          An endpoint $b \le 0$ mirrors in the level $2$ to $2 \cdot 2 - b \ge
          4$, so the probability equals $\Pr(B_{16} \ge 4) = 1 - \Phi(1) =
          0.1587$. In general $\Pr(M_t \ge a,\, B_t \le b) = \Pr(B_t \ge 2a -
          b)$.
      - ask: >
          The drawdown at week $16$ is the gap from the peak, $M_{16} -
          B_{16}$. What is its expected value?
        choices:
          - text: >
              About $3.19$, the same as the expected peak.
            correct: true
            feedback: >
              The drawdown $M_t - B_t$ has the law of $|B_t|$ as well. Run the
              path backward from week $16$ and the drawdown becomes the peak
              of the reversed path.
          - text: >
              $0$, since the book ends at $0$ on average.
            feedback: >
              The drawdown is never negative, and it is $0$ only on paths that
              finish exactly at their peak. Its mean is
              $\mathbb{E}[M_{16}] - \mathbb{E}[B_{16}] = 3.19 - 0$.
          - text: >
              About $1.6$, half the peak, since the book gives back half its
              gain on average.
            feedback: >
              Linearity gives $\mathbb{E}[M_{16} - B_{16}] =
              \mathbb{E}[M_{16}] - 0$ directly. There is no halving.
        feedback: >
          Expected drawdown equals expected peak for a driftless book —
          $0.8\sigma\sqrt{T}$ for both — and the two have the same law, not
          just the same mean.
      - ask: >
          Someone applies $\Pr(M_t \ge a,\, B_t \le b) = \Pr(B_t \ge 2a - b)$
          with $a = 1$ and $b = 3$. What goes wrong?
        choices:
          - text: >
              Nothing; the formula holds for all $a$ and $b$.
            feedback: >
              With $b > a$ the formula gives $\Pr(B_t \ge -1)$, which counts
              paths that never touch $1$ at all — a path that wanders below
              $-1$ throughout is counted but has $M_t < 1$.
          - text: >
              It needs $a \ge \max(b, 0)$; with $b = 3 > a$ the event splits.
            correct: true
            feedback: >
              Paths ending in $(1, 3]$ touched $1$ automatically, so mirroring
              is only needed for those ending at or below $1$. The correct
              answer is $\Pr(B_t \ge 1) + \Pr(1 < B_t \le 3)$.
          - text: >
              It needs $b \ge 0$, which holds here, so it is fine.
            feedback: >
              The binding condition is $a \ge b$: the endpoint must lie below
              the level for the mirror to land above it.
        feedback: >
          Mirroring maps endpoints below the level to endpoints above it. If
          $b$ is already above $a$, split off the part where finishing forces
          the touch.

  - node: quant-processes.brownian.hitting-time
    hook: >
      "The path hits every level with probability $1$, but the expected time
      to do so is infinite" sounds like a contradiction, and resolving it
      cleanly is a standard interview checkpoint.
    explanation: >
      The event "hit level $a$ by time $t$" is literally the event "the
      running maximum has reached $a$ by time $t$," so $\Pr(\tau_a\le
      t)=\Pr(M_t\ge a)=2\left(1-\Phi(a/\sqrt t)\right)$ falls straight out of
      the reflection principle with no new argument. Differentiating in $t$
      gives the density $f(t)=\dfrac{a}{\sqrt{2\pi t^3}}\,e^{-a^2/(2t)}$ for
      $t>0$.

      Sending $t\to\infty$ makes $\Phi(a/\sqrt t)\to\Phi(0)=1/2$, so
      $\Pr(\tau_a\le t)\to1$: every level is reached, eventually, with
      certainty. But "eventually, with certainty" and "in bounded expected
      time" are different claims — the density's tail behaves like
      $a\,t^{-3/2}/\sqrt{2\pi}$ for large $t$, and $\int^\infty
      t\cdot t^{-3/2}\,dt$ diverges, so $\mathbb{E}[\tau_a]=\infty$. The mass
      that makes the probability converge to $1$ is spread thin enough over
      an unbounded tail that the average waiting time is dominated by
      arbitrarily rare, arbitrarily long excursions the wrong way.

      Self-similarity fixes the shape across levels: $\tau_a$ has the same
      law as $a^2\tau_1$, so the typical wait — say, the median — costs
      quadratically in distance, at $\approx2.20a^2$, even while the mean
      stays infinite regardless of $a$.
    worked: >
      For $a=4$, the median hitting time is about $2.20\times16=35.2$ time
      units — half the time, level $4$ is reached within about $35$ units —
      while $\mathbb{E}[\tau_4]$ remains infinite regardless, since the
      divergence comes from the tail shape, not from the specific level.
    interview: >
      "Does Brownian motion hit every level, and what's the expected time to
      do so" wants both halves stated without hesitation: probability $1$ by
      sending $t\to\infty$ in the reflection formula, yet infinite
      expectation from the $t^{-3/2}$ tail — and the two are not in tension.
    pitfalls: >
      Assuming "happens with probability $1$" implies "happens in finite
      expected time" — this is the standard trap the whole node is built to
      catch. Forgetting the quadratic-in-distance scaling and guessing the
      median wait grows linearly in $a$ instead of as $a^2$.
    recap: >
      Brownian motion reaches any level with probability $1$ eventually, but
      the hitting time has a $t^{-3/2}$ tail heavy enough to make its
      expectation infinite, even as the median grows only like $a^2$.
    dialogue:
      - part: A sell order three ticks up
        teach: >
          A stock's price, measured in ticks from where it stands now, follows
          a standard Brownian motion with time in minutes. You rest a sell
          order $3$ ticks above. It fills at $\tau_3$, the first time the price
          touches $3$.
      - ask: >
          What is the probability the order fills within $25$ minutes? Use
          $\Phi(0.6) = 0.7257$.
        expects: "0.5486"
        tolerance: 0.0005
        hint: >
          The order has filled by minute $25$ exactly when the highest price so
          far has reached $3$.
        feedback: >
          $\{\tau_3 \le 25\} = \{M_{25} \ge 3\}$, and the reflection principle
          gives $2(1 - \Phi(3/5)) = 2(1 - 0.7257) = 0.5486$. Slightly better
          than a coin flip, even though $3$ ticks is $0.6$ standard deviations
          of the $25$-minute move: touching is far easier than finishing.
      - ask: >
          What is the probability it fills within $900$ minutes? Use
          $\Phi(0.1) = 0.5398$.
        expects: "0.9204"
        tolerance: 0.0005
        hint: >
          Same formula; $\sqrt{900} = 30$.
        feedback: >
          $2(1 - \Phi(3/30)) = 2(1 - 0.5398) = 0.9204$. Thirty-six times the
          horizon took the fill chance from $0.55$ to $0.92$.
      - ask: >
          Let the horizon grow without bound. What does the fill probability
          tend to?
        choices:
          - text: >
              $1/2$: half the paths head down and never come back.
            feedback: >
              A driftless path has no "down for good". In the formula,
              $3/\sqrt{t} \to 0$, so $\Phi(3/\sqrt{t}) \to \Phi(0) = 1/2$ and
              the fill probability $2(1 - 1/2)$ tends to $1$, not $1/2$.
          - text: >
              Some number strictly between $0.92$ and $1$: a few paths escape
              downward forever.
            feedback: >
              Every path that escapes downward still has all of future time to
              come back, and the formula says the escapees vanish:
              $2(1 - \Phi(3/\sqrt{t}))$ increases to $2(1 - 1/2) = 1$.
          - text: >
              $1$: the order fills eventually, with certainty.
            correct: true
            feedback: >
              $\Phi(3/\sqrt{t}) \to 1/2$, so the probability tends to $1$. Any
              level, however far, is reached eventually.
        feedback: >
          Nothing about $3$ was special: $\Pr(\tau_a < \infty) = 1$ for every
          level $a$. The fill is certain. The next question is how long it
          takes.

      - part: Certain, but how long
        ask: >
          What is the median wait, the $t$ with $\Pr(\tau_3 \le t) = 1/2$? Use
          $\Phi(0.6745) = 0.75$. Give two decimal places.
        expects: "19.78"
        tolerance: 0.05
        hint: >
          Set $2(1 - \Phi(3/\sqrt{t})) = 1/2$, so $\Phi(3/\sqrt{t}) = 0.75$.
        feedback: >
          $3/\sqrt{t} = 0.6745$ gives $\sqrt{t} = 4.448$ and
          $t = 9/0.4550 \approx 19.78$ minutes. Half of all orders at $3$
          ticks fill inside twenty minutes.
      - ask: >
          What is the probability the order is still unfilled after $90000$
          minutes? Use $\Phi(0.01) = 0.5040$.
        expects: "0.0080"
        tolerance: 0.0005
        hint: >
          Unfilled is the complement: $1 - 2(1 - \Phi(a/\sqrt{t})) =
          2\Phi(a/\sqrt{t}) - 1$.
        feedback: >
          $2(0.5040) - 1 = 0.0080$. After $900$ minutes the unfilled chance was
          $1 - 0.9204 = 0.0796$. A hundred times the horizon bought only a
          tenfold drop: $\Pr(\tau_3 > t)$ shrinks like $1/\sqrt{t}$.
      - reflect: >
          The median wait is about $20$ minutes, and the chance of waiting past
          time $t$ falls only like $1/\sqrt{t}$. Is the expected wait
          $\mathbb{E}[\tau_3]$ finite? Say what decides it.
        hint: >
          For a nonnegative waiting time,
          $\mathbb{E}[\tau] = \int_0^{\infty} \Pr(\tau > t)\,dt$.
        answer: >
          It is infinite. The expected wait is the area under the survival
          curve $\Pr(\tau_3 > t)$, and a curve that decays like $1/\sqrt{t}$
          has infinite area, because $\int^{\infty} t^{-1/2}\,dt$ diverges.
          The median sees only the bulk of the paths; the mean is dominated by
          the rare paths that wander far below and take an enormously long
          time to come back.
      - teach: >
          That is the whole node. $\Pr(\tau_a \le t) = 2(1 - \Phi(a/\sqrt{t}))$,
          which tends to $1$, so every level is hit. Differentiating in $t$
          gives the density $\dfrac{a}{\sqrt{2\pi t^{3}}}\,e^{-a^{2}/(2t)}$,
          whose tail behaves like $a\,t^{-3/2}/\sqrt{2\pi}$; then
          $\int^{\infty} t \cdot t^{-3/2}\,dt$ diverges and
          $\mathbb{E}[\tau_a] = \infty$. Certain and finite-mean are different
          claims, and the hitting time is the standard example of the first
          without the second.

      - part: What the argument rests on
        ask: >
          The first step, $\{\tau_a \le t\} = \{M_t \ge a\}$, needs one of the
          defining properties of Brownian motion more than the others. Which?
        choices:
          - text: >
              Independent increments.
            feedback: >
              Independence powers the reflection principle that computes
              $\Pr(M_t \ge a)$. The equality of the two events is a statement
              about single paths and uses no probability at all.
          - text: >
              Continuous paths.
            correct: true
            feedback: >
              A path whose maximum reached $a$ had to pass through $a$ on the
              way. A process that could jump from $2.9$ to $3.4$ would have
              $M_t \ge 3$ without ever equalling $3$.
          - text: >
              Increments have mean $0$.
            feedback: >
              Symmetry matters in the reflection step, not here. Add a drift
              and the two events are still equal; only their probability
              changes.
        feedback: >
          Continuity turns "the maximum got there" into "the path touched it".
          The reflection principle then supplies the number, and scaling
          supplies the shape across levels.
      - ask: >
          A second order rests $9$ ticks up instead of $3$. Compare it with the
          first.
        choices:
          - text: >
              Median wait three times as long, and so is the mean.
            feedback: >
              Distance costs quadratically in time: $\tau_a$ has the law of
              $a^{2}\tau_1$, so tripling the distance multiplies every quantile
              by $9$. And the mean is not a finite number to triple.
          - text: >
              Median wait nine times as long; the nearer order at least has a
              finite mean.
            feedback: >
              The infinite mean does not depend on the level: the tail of
              $\tau_3$ is $t^{-3/2}$ just like that of $\tau_9$. Being closer
              makes the typical fill faster, not the average finite.
          - text: >
              Median wait nine times as long, about $178$ minutes; both means
              are infinite.
            correct: true
            feedback: >
              $\tau_9$ has the law of $9\tau_3$, so the median is
              $9 \times 19.78 \approx 178$ minutes, and the divergent tail is
              there at every level.
        feedback: >
          Scaling makes $\tau_a$ distributed as $a^{2}\tau_1$, so the median is
          about $2.20a^{2}$ while the mean stays infinite for every $a > 0$.

      - part: Where the infinity lives
        ask: >
          Your desk cancels any order still resting after $900$ minutes. Is the
          expected time the order spends resting, $\mathbb{E}[\min(\tau_3,
          900)]$, finite?
        choices:
          - text: >
              No: $\tau_3$ has infinite mean, and capping it cannot fix that.
            feedback: >
              Capping is exactly what fixes it. $\min(\tau_3, 900)$ never
              exceeds $900$, and a random variable bounded by $900$ has mean
              at most $900$.
          - text: >
              Yes, and it is below $900$; the infinity came entirely from the
              tail beyond any fixed horizon.
            correct: true
            feedback: >
              The survival curve integrated up to $900$ is finite. Only the
              unbounded tail, carrying probability $0.0796$ beyond $900$ here,
              made the mean diverge.
          - text: >
              Yes, and it equals the median, about $20$ minutes.
            feedback: >
              It is finite, but it is not the median: $8\%$ of orders sit the
              full $900$ minutes, contributing $0.0796 \times 900 \approx 72$
              minutes to the mean on their own.
        feedback: >
          The infinite mean is a fact about the far tail, invisible over any
          fixed horizon. In an interview, say both halves in one breath:
          probability $1$ because $\Phi(a/\sqrt{t}) \to 1/2$, infinite mean
          because the density decays only like $t^{-3/2}$, and the two are not
          in tension.

  - node: quant-processes.brownian.two-sided-exit
    hook: >
      "Derive the two-barrier gambler's-ruin probability and expected
      duration for Brownian motion from scratch" is a standard whiteboard
      ask, and it comes out of the two simplest Brownian martingales in three
      lines each.
    explanation: >
      Fix barriers at $a>0$ above and $-b<0$ below, and let $\tau$ be the
      first exit time from $(-b,a)$; this $\tau$ is finite with probability
      $1$ and has finite mean, so both stopped martingales stay bounded
      enough for optional stopping to apply legally.

      Using the martingale $B_t$: optional stopping gives
      $0=\mathbb{E}[B_\tau]=ap-b(1-p)$, where $p$ is the probability of
      exiting at $a$ rather than $-b$. Solving, $p=b/(a+b)$ — the value of a
      fair game is conserved on average, so the exit probabilities must
      weight the two barriers inversely to their distance from $0$.

      Using the martingale $B_t^2-t$: optional stopping gives
      $\mathbb{E}[\tau]=\mathbb{E}[B_\tau^2]=a^2\cdot\dfrac{b}{a+b}+b^2\cdot
      \dfrac{a}{a+b}=ab$ — the compensated square converts the exit time
      directly into an algebraic expression once the exit distribution from
      the first martingale is already known. Symmetric barriers, $a=b$,
      degenerate to a fair coin flip with $\mathbb{E}[\tau]=a^2$; sending
      $b\to\infty$ recovers certain eventual hitting of $a$ ($p\to1$)
      alongside $\mathbb{E}[\tau]=ab\to\infty$ — exactly the
      sure-but-infinite-mean hitting-time fact from a different angle.
    worked: >
      With $a=3$, $b=6$: $p=6/9=2/3$, so the path is twice as likely to reach
      $3$ before $-6$ as the reverse, and $\mathbb{E}[\tau]=3\times6=18$ time
      units — both read off the two martingales with no further computation.
    interview: >
      "Derive the ruin probability and expected duration for Brownian motion
      between two barriers" is answered by naming both martingales
      explicitly and running optional stopping on each — the interviewer is
      checking that you know which martingale answers which question, not
      just that you can recite $b/(a+b)$.
    pitfalls: >
      Applying optional stopping without checking that $\tau$ has finite mean
      and the stopped process is bounded — both barriers being finite is
      exactly what makes this legal. Mixing up which martingale produces the
      probability versus the time: $B_t$ gives $p$, $B_t^2-t$ gives
      $\mathbb{E}[\tau]$, never the reverse.
    recap: >
      Two Brownian martingales solve the two-barrier exit problem completely:
      $B_t$ gives $\Pr(\text{hit }a\text{ first})=b/(a+b)$, and $B_t^2-t$
      gives $\mathbb{E}[\tau]=ab$.
    dialogue:
      - part: A target and a stop
        teach: >
          A trade's P&L, in thousands, follows a standard Brownian motion with
          time in hours. You attach a take-profit at $+5$ and a stop-loss at
          $-3$, and the trade closes at whichever it touches first.
      - ask: >
          Before any computation: which exit is more likely?
        choices:
          - text: >
              Neither: the game is fair, so each exit has probability $1/2$.
            feedback: >
              Fair means the expected P&L stays $0$, not that the exits are
              equally likely. A coin-flip split would give an expected exit
              value of $(5 - 3)/2 = 1 > 0$, more than a fair game can produce.
          - text: >
              The stop-loss, because it is closer.
            correct: true
            feedback: >
              Closer is likelier. The question is by exactly how much, and
              fairness is what pins it down.
          - text: >
              The take-profit, because a fair path drifts toward the larger
              payoff.
            feedback: >
              A driftless path has no preference for either side, and it cannot
              see the payoffs. Its only asymmetry here is distance, and the
              stop is the nearer barrier.
        feedback: >
          The nearer barrier wins more often. Now the number.
      - ask: >
          A first instinct is the reflection principle. Why does it not settle
          the chance of reaching $+5$ first?
        choices:
          - text: >
              It does: $+5$ is reached eventually with probability $1$, so the
              take-profit is hit first with probability $1$.
            feedback: >
              Reaching $+5$ eventually is certain, but most of those paths
              touch $-3$ on the way and are closed at a loss long before. The
              stop removes them.
          - text: >
              Reflection counts paths that touch $+5$, but cannot exclude the
              ones that touched $-3$ first.
            correct: true
            feedback: >
              One mirror handles one barrier. With two, every reflected path
              can bounce off the other barrier, and the bookkeeping becomes an
              infinite alternating series.
          - text: >
              Reflection only works for levels below the start.
            feedback: >
              It works for any level, above or below, by symmetry. The trouble
              is having two levels at once.
        feedback: >
          Path counting gets tangled with two barriers. A cleaner tool is
          something conserved along the way.
      - reflect: >
          The P&L is a martingale started at $0$. When the trade closes it sits
          at exactly $+5$ or exactly $-3$. What equation does that give for
          $p$, the chance of closing at $+5$?
        hint: >
          What is the expected value of the P&L at the moment the trade closes?
        answer: >
          If a fair game stays fair when you stop it at the exit time, the
          expected closing P&L is the starting value $0$. The closing value is
          $+5$ with probability $p$ and $-3$ otherwise, so
          $5p - 3(1 - p) = 0$. Solving takes one line, and no path is ever
          counted.
      - ask: >
          Solve it. What is $p$?
        expects: "0.375"
        hint: >
          $5p - 3 + 3p = 0$.
        feedback: >
          $8p = 3$, so $p = 3/8 = 0.375$. The stop wins $5/8$ of the time.
      - teach: >
          This is optional stopping applied to the martingale $B_t$. With
          barriers $a > 0$ and $-b < 0$ and $\tau$ the exit time from
          $(-b, a)$, $\tau$ is finite with finite mean and the stopped path
          stays inside $[-b, a]$, so $\mathbb{E}[B_\tau] = 0$. That reads
          $ap - b(1 - p) = 0$, and $p = b/(a+b)$: each barrier's chance is
          the *other* barrier's distance over the total.

      - part: How long the trade stays open
        ask: >
          Now the expected time until the trade closes. Which martingale
          carries $\tau$ into an equation you can solve?
        choices:
          - text: >
              $B_t$ again, read more carefully.
            feedback: >
              $\mathbb{E}[B_\tau] = 0$ involves only where the path exits, not
              when. No amount of care extracts $\tau$ from it.
          - text: >
              $\exp(\lambda B_t - \lambda^{2}t/2)$, since time sits in the
              exponent.
            feedback: >
              Stopping it gives $\mathbb{E}[e^{\lambda B_\tau -
              \lambda^{2}\tau/2}] = 1$, an equation for a transform of $\tau$;
              the mean can be dug out by differentiating twice in $\lambda$,
              with work. Another martingale has $t$ appearing linearly.
          - text: >
              $B_t^{2} - t$, since time appears in it linearly.
            correct: true
            feedback: >
              Optional stopping gives $\mathbb{E}[B_\tau^{2} - \tau] = 0$, so
              $\mathbb{E}[\tau] = \mathbb{E}[B_\tau^{2}]$, and you already know
              the exit law.
        feedback: >
          One martingale for where, one for when: $B_t$ gives the exit
          probability, $B_t^{2} - t$ the exit time.
      - ask: >
          What is $\mathbb{E}[\tau]$, in hours?
        expects: "15"
        hint: >
          $B_\tau^{2}$ is $25$ with probability $3/8$ and $9$ with probability
          $5/8$.
        feedback: >
          $\mathbb{E}[\tau] = 25 \cdot \tfrac{3}{8} + 9 \cdot \tfrac{5}{8} =
          \tfrac{75 + 45}{8} = 15$, which is $5 \times 3$. In general
          $a^{2}\tfrac{b}{a+b} + b^{2}\tfrac{a}{a+b} = ab$.
      - teach: >
          So the two-sided exit problem is solved by two martingales:
          $\Pr(\text{hit } a \text{ first}) = b/(a+b)$ and
          $\mathbb{E}[\tau] = ab$. Symmetric barriers $a = b$ give a coin flip
          and $\mathbb{E}[\tau] = a^{2}$, the continuous version of the $k/N$
          and $k(N-k)$ answers for gambler's ruin.

      - part: When stopping is not legal
        ask: >
          Remove the stop-loss and keep only the target at $+5$. Optional
          stopping would claim $\mathbb{E}[B_\tau] = 0$, yet $B_\tau = 5$ on
          every path. What has gone wrong?
        choices:
          - text: >
              Nothing: the contradiction shows the target is never hit.
            feedback: >
              The target is hit with probability $1$ — the running maximum
              eventually passes every level. The contradiction is in applying
              the theorem, not in the path.
          - text: >
              The stopped P&L is unbounded below and $\tau$ has infinite mean,
              so the theorem's hypotheses fail.
            correct: true
            feedback: >
              Before closing, the P&L can sink arbitrarily far, and the wait
              for $+5$ has infinite expectation. With both barriers the
              stopped path lived in $[-3, 5]$, and that bound is what made the
              equation legal.
          - text: >
              Optional stopping needs the martingale $B_t^{2} - t$, not $B_t$.
            feedback: >
              Either martingale needs the same check. $B_t$ is a fine
              martingale; it is the stopping time that has become too wild.
        feedback: >
          Before writing $\mathbb{E}[M_\tau] = M_0$, say why it is allowed: here,
          a bounded stopped process and an exit time with finite mean.
      - ask: >
          Back to two barriers, with the stop widened to $-45$ and the target
          still $+5$. What is the expected time to close, in hours?
        expects: "225"
        hint: >
          $\mathbb{E}[\tau] = ab$.
        feedback: >
          $5 \times 45 = 225$ hours, and the target now wins with probability
          $45/50 = 0.9$. Push the stop to $-\infty$: the target becomes certain
          while $ab \to \infty$. That is the certain-but-infinite-mean hitting
          time, seen from the two-barrier side.
      - teach: >
          Said aloud in an interview: "$B_t$ is a martingale and the stopped
          path is bounded, so $\mathbb{E}[B_\tau] = 0$ gives $p = b/(a+b)$;
          $B_t^{2} - t$ is a martingale, so $\mathbb{E}[\tau] =
          \mathbb{E}[B_\tau^{2}] = ab$." Name the martingale and the reason
          stopping is legal before you write either equation.

  - node: quant-processes.brownian.bm-with-drift
    hook: >
      "Why does it take years, not months, to statistically confirm a
      trading edge" has an exact answer once you write the strategy's
      cumulative P&L as drift plus Brownian noise and compare how each term
      grows.
    explanation: >
      Arithmetic Brownian motion tilts the driftless process by a
      deterministic linear term: $X_t=x_0+\mu t+\sigma B_t$. Since $B_t$ has
      independent increments, so does $X_t$, and $X_t\sim N(x_0+\mu
      t,\,\sigma^2t)$ follows immediately from the base process's normality
      plus the fixed shift and scale.

      The two terms grow at genuinely different rates: the signal, $\mu t$,
      grows linearly in time, while the noise, $\sigma\sqrt t$, grows only as
      a square root. Their ratio is $\mu t/(\sigma\sqrt t)=(\mu/\sigma)\sqrt
      t$ — a quantity that grows without bound, but only at the crawling
      $\sqrt t$ rate. Read annually, $\mu/\sigma$ is exactly the Sharpe
      ratio, and its slow growth is the entire reason a real trading edge is
      statistically invisible over a short track record even when it's
      genuinely there.

      The same construction applied to the log price rather than the raw
      price, $\log S_t=\log S_0+\mu t+\sigma B_t$, is geometric Brownian
      motion — the standard continuous-time model for a positive asset price,
      built by exponentiating this exact object.
    worked: >
      A strategy with $\mu=12\%$ and $\sigma=20\%$ per year has Sharpe ratio
      $0.6$. Separating its drift from zero at three standard errors needs
      $0.6\sqrt t=3$, i.e. $\sqrt t=5$, so $t=25$ years — a strategy with a
      genuine, moderate edge needs a quarter-century of track record before
      the signal clears three noise units.
    interview: >
      "Write down Brownian motion with drift and explain why detecting an
      edge is slow" wants $X_t=\mu t+\sigma B_t$ stated cold, followed by the
      $(\mu/\sigma)\sqrt t$ Sharpe-growth argument — the interviewer is
      testing whether you can connect a formula to the practical "why," not
      just recite it.
    pitfalls: >
      Assuming a longer backtest linearly improves confidence in an edge —
      confidence only accumulates at rate $\sqrt t$, not $t$. Comparing
      Sharpe ratios computed over mismatched horizons (daily versus annual)
      without converting first silently compares different quantities.
    recap: >
      $X_t=\mu t+\sigma B_t$ has signal growing like $t$ and noise growing
      only like $\sqrt t$, so their ratio — the Sharpe ratio — grows like
      $\sqrt t$, which is why real edges take a long track record to confirm
      statistically.
    dialogue:
      - part: Two points of edge, eight of noise
        teach: >
          A strategy's cumulative return $X_t$, with $t$ in years and $X_0 =
          0$, gains $0.02$ a year on average. On top of that it carries noise:
          over any window the random part is Gaussian, with variance $0.08^{2}
          = 0.0064$ per year of window, and the random parts over
          non-overlapping windows are independent.
      - ask: >
          What is the standard deviation of $X_4$, the cumulative return after
          four years?
        expects: "0.16"
        hint: >
          Variances of independent yearly pieces add. The average gain shifts
          the centre and has no effect on the spread.
        feedback: >
          The variance is $4 \times 0.0064 = 0.0256$, so the standard deviation
          is $\sqrt{0.0256} = 0.16$: twice one year's $0.08$, not four times.
      - ask: >
          What is the probability the strategy is under water after four
          years, $\Pr(X_4 < 0)$? Use $\Phi(0.5) = 0.6915$.
        expects: "0.3085"
        tolerance: 0.0005
        hint: >
          $X_4$ is normal with mean $4 \times 0.02$ and the standard deviation
          you just found.
        feedback: >
          $X_4 \sim N(0.08, 0.16^{2})$, so
          $\Pr(X_4 < 0) = \Phi(-0.08/0.16) = 1 - \Phi(0.5) = 0.3085$. Four
          years in, a genuinely profitable strategy is losing almost one time
          in three.
      - ask: >
          Which formula is this process, with $B$ a standard Brownian motion?
        choices:
          - text: >
              $X_t = 0.02t + 0.0064B_t$
            feedback: >
              $0.0064$ is the yearly *variance*. A multiplier $\sigma$ on $B_t$
              multiplies the variance by $\sigma^{2}$, so this one has yearly
              standard deviation $0.0064$, about twelve times too small.
          - text: >
              $X_t = 0.02t + 0.08B_t$
            correct: true
            feedback: >
              $0.08B_t$ is $N(0, 0.0064t)$ with independent, stationary
              Gaussian increments, and $0.02t$ adds the average gain.
          - text: >
              $X_t = 0.02t + 0.08tZ$, for one standard normal $Z$
            feedback: >
              Then the noise would have standard deviation $0.08t$, growing
              like $t$: $0.32$ at four years instead of $0.16$. And a single
              $Z$ makes every year's noise the same draw.
        feedback: >
          A straight line plus a scaled Brownian motion: the noise is all
          carried by $B$.
      - teach: >
          This is arithmetic Brownian motion, or Brownian motion with drift:
          $X_t = x_0 + \mu t + \sigma B_t$, with drift $\mu$ per unit time and
          volatility $\sigma > 0$. Its increments are independent, an
          increment over a window of length $h$ is $N(\mu h, \sigma^{2}h)$,
          and $X_t \sim N(x_0 + \mu t, \sigma^{2}t)$.

      - part: Signal against noise
        ask: >
          After how many years does the expected gain $0.02t$ first equal one
          standard deviation of $X_t$?
        expects: "16"
        hint: >
          Set $0.02t = 0.08\sqrt{t}$ and solve for $\sqrt{t}$.
        feedback: >
          $\sqrt{t} = 0.08/0.02 = 4$, so $t = 16$ years. At one year the gain
          is a quarter of the noise; it takes sixteen to make it a full one.
      - reflect: >
          Doubling the horizon doubles the expected gain. What does it do to
          the ratio of gain to noise, and what does that mean for anyone
          trying to tell this strategy apart from a zero-edge one by its track
          record?
        hint: >
          Write the ratio $\mu t/(\sigma\sqrt{t})$ and simplify.
        answer: >
          The ratio is $(\mu/\sigma)\sqrt{t}$, so doubling the horizon
          multiplies it by only $\sqrt{2} \approx 1.41$. Signal grows like $t$,
          noise like $\sqrt{t}$, and their ratio crawls up like $\sqrt{t}$.
          A small edge therefore stays buried in noise for years: each extra
          year of track record buys less evidence than the one before.
      - teach: >
          The per-year ratio $\mu/\sigma$ is the Sharpe ratio, here
          $0.02/0.08 = 0.25$. Over $t$ years the drift stands
          $(\mu/\sigma)\sqrt{t}$ standard deviations from zero, which is how
          far a track record of length $t$ can separate this strategy from one
          with no edge.
      - ask: >
          How many years until the drift stands two standard deviations from
          zero?
        expects: "64"
        hint: >
          $0.25\sqrt{t} = 2$.
        feedback: >
          $\sqrt{t} = 8$, so $t = 64$ years. Doubling the evidence from one to
          two standard deviations cost four times the track record, $16$ to
          $64$.

      - part: What counts as drift plus noise
        ask: >
          A colleague models the same strategy as $Y_t = 0.02t + 0.08\sqrt{t}\,Z$
          with one standard normal $Z$ drawn at the start. $Y_t$ has the same
          mean and variance as $X_t$ at every $t$. Which property of
          Brownian motion with drift fails?
        choices:
          - text: >
              Gaussian values: $\sqrt{t}\,Z$ is not normal.
            feedback: >
              $0.02t + 0.08\sqrt{t}\,Z$ is normal for every fixed $t$, with
              exactly the right mean and variance. Each snapshot passes.
          - text: >
              Independent increments: every period's noise is the same $Z$.
            correct: true
            feedback: >
              $Y_4 - Y_1 = 0.06 + 0.08Z$ is perfectly correlated with
              $Y_1 = 0.02 + 0.08Z$. A good first year predicts a good next three,
              which the real process never does.
          - text: >
              Continuity: the path jumps when $Z$ is drawn.
            feedback: >
              $t \mapsto 0.02t + 0.08\sqrt{t}\,Z$ is continuous for every $Z$.
              The failure is in how different times relate, not in any single
              path's shape.
        feedback: >
          Matching every marginal $N(\mu t, \sigma^{2}t)$ is not enough. The
          independent increments are what make it a process rather than a
          family of snapshots.
      - ask: >
          Back to $X_t = 0.02t + 0.08B_t$. What is the probability the strategy
          loses money between the end of year $5$ and the end of year $9$? Use
          $\Phi(0.5) = 0.6915$.
        expects: "0.3085"
        tolerance: 0.0005
        hint: >
          What does the law of an increment depend on?
        feedback: >
          $X_9 - X_5 \sim N(0.02 \times 4, 0.0064 \times 4)$, the same law as
          $X_4$, so the answer is $1 - \Phi(0.5) = 0.3085$ again. Only the
          window's length matters, not when it starts or how the first five
          years went.
      - ask: >
          An analyst whose edge is decaying proposes
          $V_t = 0.04\sqrt{t} + 0.08B_t$. Is it a Brownian motion with drift?
        choices:
          - text: >
              Yes: the drift is just a different deterministic function.
            feedback: >
              The definition asks for $\mu t$, linear in time. With
              $0.04\sqrt{t}$, a one-year window from year $0$ has mean $0.04$
              and one from year $3$ has mean $0.04(2 - \sqrt{3}) \approx
              0.011$.
          - text: >
              No: its increments are no longer independent.
            feedback: >
              Adding a deterministic curve to $0.08B_t$ cannot create
              dependence; increments over disjoint windows stay independent.
              The failure is elsewhere.
          - text: >
              No: an increment's law depends on when the window starts, not
              only on its length.
            correct: true
            feedback: >
              Independent Gaussian increments survive, but stationarity does
              not: the mean of $V_{t+1} - V_t$ is
              $0.04(\sqrt{t+1} - \sqrt{t})$, shrinking with $t$.
        feedback: >
          Exactly one clause fails: stationary increments, which require the
          drift to be linear in $t$. Applied to a log price instead of a price,
          the same $\mu t + \sigma B_t$ becomes geometric Brownian motion.

  - node: quant-processes.brownian.drift-hitting
    hook: >
      "What's the chance my strategy ever draws down $X\%$ even though it has
      a positive edge" is a desk-standard question, and the clean exponential
      answer comes from finding the one nonzero $\theta$ that turns the
      exponential martingale driftless.
    explanation: >
      For $X_t=\mu t+\sigma B_t$, the moment generating function
      $\mathbb{E}[e^{\theta X_t}]=e^{(\theta\mu+\theta^2\sigma^2/2)t}$ makes
      $e^{\theta X_t}$ a martingale exactly when the exponent's coefficient of
      $t$ vanishes — at $\theta=0$ trivially, and at the nontrivial root
      $\theta=-2\mu/\sigma^2$. That second root does the real work: it is the
      exact amount of exponential discounting needed to cancel the drift's
      steady push, leaving a genuinely fair game to apply optional stopping
      to.

      Running optional stopping with that root at the exit time from
      $(-b,a)$ gives $p\,e^{\theta a}+(1-p)e^{-\theta b}=1$, so
      $p=\dfrac{1-e^{-\theta b}}{e^{\theta a}-e^{-\theta b}}$ — and letting
      $\mu\to0$ (so $\theta\to0$) recovers the driftless answer $b/(a+b)$
      exactly, confirming the construction is a genuine generalization rather
      than a different formula.

      The one-sided limits are the version worth memorizing outright: for
      $\mu>0$, the chance of ever falling to $-b$ is $e^{-2\mu b/\sigma^2}$ —
      a positive edge doesn't prevent a drawdown, it only suppresses its
      probability exponentially in the drawdown size. Symmetrically, for
      $\mu<0$, $\Pr(\sup_tX_t\ge a)=e^{-2|\mu|a/\sigma^2}$.
    worked: >
      With $\mu=6\%$ and $\sigma=30\%$ per year, $2\mu/\sigma^2=2(0.06)/
      0.09\approx1.333$. The chance of ever suffering a $15\%$ drawdown is
      $e^{-1.333\times0.15}=e^{-0.2}\approx0.819$ — over $80\%$, despite the
      positive drift, because a modest edge against sizable volatility barely
      dents how often a moderate drawdown occurs.
    interview: >
      "Given a positive Sharpe ratio, what's the probability of ever seeing a
      $b\%$ drawdown" is answered directly with $e^{-2\mu b/\sigma^2}$; a
      sharp follow-up asks you to check that letting $\mu\to0$ recovers the
      plain two-barrier ruin formula, confirming you understand it as the
      general case, not a separate fact.
    pitfalls: >
      Using the one-sided drawdown formula when $\mu$ has the wrong sign for
      the event asked about — with $\mu<0$ that downside event is certain,
      and the exponential formula instead governs the upside. Forgetting
      that the two-sided formula needs both barriers finite for optional
      stopping to be legal at all.
    recap: >
      The nonzero root $\theta=-2\mu/\sigma^2$ of the exponential martingale
      turns a drifted process driftless for optional-stopping purposes,
      giving $e^{-2\mu b/\sigma^2}$ for the chance of an eventual drawdown of
      size $b$ under positive drift.
    dialogue:
      - part: A fund with an edge and a kill switch
        teach: >
          A fund's log-equity follows $X_t = 0.05t + 0.25B_t$, with $t$ in
          years and $X_0 = 0$. The risk committee will close it if it ever
          falls $0.25$ below where it started.
      - ask: >
          Without drift, the fund would hit $-0.25$ with probability $1$. With
          this drift, the chance of ever being closed is
        choices:
          - text: >
              still $1$: Brownian motion reaches every level eventually.
            feedback: >
              That was the driftless path, which keeps returning. Here
              $X_t/t \to 0.05$, so the path is eventually carried upward and
              away for good; a path that survives the early years may never
              come back down.
          - text: >
              $0$: the drift is positive, so the fund only goes up.
            feedback: >
              Over the first year the drift adds $0.05$ while the noise has
              standard deviation $0.25$. Early on the noise dominates, and a
              fall of $0.25$ is entirely possible before the drift takes over.
          - text: >
              strictly between $0$ and $1$.
            correct: true
            feedback: >
              Noise wins early, drift wins late. Which side of that race the
              fund lands on is the probability to compute.
        feedback: >
          Driftless, every level is certain. A drift turns the far side into
          a genuine probability, and finding it needs a new tool.
      - ask: >
          The driftless proof stopped the martingale $B_t$. Here $X_t$ is not a
          martingale, but $X_t - 0.05t = 0.25B_t$ is. Stop it at the exit from
          a band $(-0.25, a)$. Why does that not give the exit probability?
        choices:
          - text: >
              Optional stopping fails because $X_t - 0.05t$ is unbounded.
            feedback: >
              With two finite barriers and a finite-mean exit time the stopping
              is legal. The trouble is what the equation contains, not whether
              it holds.
          - text: >
              It gives $\mathbb{E}[X_\tau] = 0.05\,\mathbb{E}[\tau]$, which
              contains the unknown $\mathbb{E}[\tau]$ as well as $p$.
            correct: true
            feedback: >
              Subtracting the drift puts $t$ into the martingale, and
              stopping turns that $t$ into $\tau$. One equation, two unknowns.
          - text: >
              It gives $p = 0.25/(a + 0.25)$, the driftless answer, which is
              wrong under drift.
            feedback: >
              It would give that only if $\mathbb{E}[X_\tau] = 0$, which is
              false here: the drift pushes the expected exit value up by
              $0.05$ per year spent inside the band.
        feedback: >
          What is needed is a martingale that is a function of $X_t$ alone,
          with no $t$ in it, so that stopping it produces an equation in $p$
          only.
      - reflect: >
          You want a function $f(X_t)$, free of $t$, whose expectation never
          changes. Which family of functions would you try, and why might one
          member of it work?
        hint: >
          You know $\mathbb{E}[e^{\theta Z}]$ exactly for a normal $Z$.
        answer: >
          Exponentials $e^{\theta X_t}$. The normal moment generating function
          gives $\mathbb{E}[e^{\theta X_t}] = e^{(\theta\mu +
          \theta^{2}\sigma^{2}/2)t}$, and the exponent's coefficient is a
          quadratic in $\theta$ with a nonzero root. At that root the
          expectation is constant in $t$, and independent increments upgrade
          that to the martingale property. The penalty the exponential's
          curvature charges cancels the drift's push.
      - ask: >
          For $\mu = 0.05$ and $\sigma = 0.25$, what is the nonzero $\theta$
          with $\theta\mu + \theta^{2}\sigma^{2}/2 = 0$?
        expects: "-1.6"
        hint: >
          Divide by $\theta$: $\mu + \theta\sigma^{2}/2 = 0$.
        feedback: >
          $\theta = -2\mu/\sigma^{2} = -0.1/0.0625 = -1.6$. So
          $e^{-1.6X_t}$ is a martingale: it weights low values more, exactly
          enough to offset the upward drift.
      - teach: >
          In general $e^{\theta X_t}$ is a martingale for $\theta = 0$ and
          $\theta = -2\mu/\sigma^{2}$. Stopped at the exit from $(-b, a)$, it
          stays bounded, and optional stopping gives
          $p\,e^{\theta a} + (1 - p)e^{-\theta b} = 1$, where $p$ is the
          chance of reaching $a$ first. As $\mu \to 0$ this returns
          $b/(a+b)$.

      - part: Taking the ceiling away
        ask: >
          The committee has no upper barrier: the question is whether $-0.25$
          is *ever* reached. Send $a \to \infty$ in the stopping equation, with
          $\theta = -1.6$. What happens to the term $p\,e^{\theta a}$?
        choices:
          - text: >
              It tends to $0$, since $\theta < 0$ and $p \le 1$.
            correct: true
            feedback: >
              $e^{-1.6a} \to 0$, and $p$ is a probability. The equation
              collapses to $(1 - p)e^{-\theta b} = 1$, where $1 - p$ is now the
              chance of ever reaching $-b$.
          - text: >
              It blows up, so the equation breaks and the limit is useless.
            feedback: >
              That would happen with $\theta > 0$. The nonzero root has the
              opposite sign to $\mu$, so with positive drift $e^{\theta a}$
              decays.
          - text: >
              It stays near $p$, since $p$ tends to $1$.
            feedback: >
              $p$ is the chance of reaching a ceiling that is moving away; it
              tends to $1 - \Pr(\text{ever reach } -b)$, which is less than
              $1$. And $e^{\theta a}$ tends to $0$ regardless.
        feedback: >
          So $\Pr(\text{ever reach } -b) = e^{\theta b} = e^{-2\mu b/\sigma^{2}}$
          when $\mu > 0$.
      - ask: >
          What is the probability the fund is ever closed? Use
          $e^{-0.4} = 0.6703$.
        expects: "0.6703"
        tolerance: 0.0005
        hint: >
          $2\mu/\sigma^{2} = 1.6$ and $b = 0.25$.
        feedback: >
          $e^{-1.6 \times 0.25} = e^{-0.4} = 0.6703$. A fund with a real edge
          has a two-in-three chance of a drawdown equal to one year's
          volatility.
      - ask: >
          Same drift, volatility halved to $0.125$. What is the probability
          now? Use $e^{-1.6} = 0.2019$.
        expects: "0.2019"
        tolerance: 0.0005
        hint: >
          $\sigma^{2}$ sits in the denominator of the exponent.
        feedback: >
          $2\mu/\sigma^{2} = 0.1/0.015625 = 6.4$, so the probability is
          $e^{-6.4 \times 0.25} = e^{-1.6} = 0.2019$. Halving $\sigma$
          quadruples the exponent: the old answer to the fourth power,
          $0.6703^{4} \approx 0.2019$.

      - part: Which way the drift points
        ask: >
          Flip the drift: $X_t = -0.05t + 0.25B_t$. What is the chance of ever
          falling to $-0.25$?
        choices:
          - text: >
              $e^{-0.4} = 0.6703$, the same as before by symmetry.
            feedback: >
              The exponential governs the event working *against* the drift.
              Here the drift carries the path down, toward $-0.25$; the
              symmetric statement is about rising to $+0.25$.
          - text: >
              $1$
            correct: true
            feedback: >
              $X_t/t \to -0.05$, so the path ends up below every level, and by
              continuity it passes through $-0.25$ on the way.
          - text: >
              $0$, because the formula needs $\mu > 0$.
            feedback: >
              The formula needs $\mu > 0$ to say anything; without it, the
              event goes with the drift and is certain, not impossible.
        feedback: >
          Check the sign first. Against the drift, $e^{-2|\mu| b/\sigma^{2}}$;
          with the drift, probability $1$. Under negative drift the exponential
          answers the upside, $\Pr(\sup_t X_t \ge a) = e^{-2|\mu|a/\sigma^{2}}$.
      - ask: >
          As $\mu \to 0$ with $\sigma = 0.25$ and $b = 0.25$ fixed,
          $e^{-2\mu b/\sigma^{2}}$ tends to $1$. What does that agree with?
        choices:
          - text: >
              Nothing: the formula is only valid for $\mu$ bounded away from
              $0$.
            feedback: >
              The formula holds for every $\mu > 0$, and its limit is
              meaningful: it lands exactly on a fact you already know.
          - text: >
              The two-sided answer $b/(a+b)$ with $a = b$, which is $1/2$.
            feedback: >
              That limit keeps a ceiling at $a$. The one-sided formula has no
              ceiling, so its driftless limit is the one-sided fact.
          - text: >
              A driftless Brownian motion reaches every level with probability
              $1$.
            correct: true
            feedback: >
              The exponential suppression fades as the edge vanishes, and
              certainty returns. The formula interpolates continuously between
              the drifted and driftless worlds.
        feedback: >
          Said aloud: "with drift $\mu > 0$ the chance of ever drawing down $b$
          is $e^{-2\mu b/\sigma^{2}}$, from optional stopping on
          $e^{-2\mu X_t/\sigma^{2}}$; it tends to $1$ as $\mu \to 0$, and
          halving the volatility raises it to the fourth power."

  - node: quant-processes.brownian.vol-scaling
    hook: >
      "Vol of $16$ means about a percent a day" is desk shorthand every
      interview volatility-conversion question is secretly testing, and it's
      just the $\sqrt T$ scaling rule run in one direction or the other.
    explanation: >
      Because $\operatorname{Var}(B_t)=t$, variances over disjoint time
      periods simply add — no covariance term to worry about, since the
      periods' increments are independent. Standard deviations, being square
      roots of variance, therefore add in quadrature rather than linearly:
      $\sigma(T)=\sigma(1)\sqrt T$. Reach for this identity every time a
      quoted volatility needs to move from one horizon to another.

      The exponent $T$ is a count of independent periods, not calendar time,
      which is why the standard desk factor is $\sqrt{252}\approx16$ — $252$
      trading days, not $365$ — and the identity keeps working below a day:
      with $6.5$ trading hours in a session, hourly and annual volatility are
      $\sqrt{252\times6.5}=\sqrt{1638}\approx40.5$ apart, so a $20\%$ annual
      volatility implies roughly $20/40.5\approx0.49\%$ per trading hour.

      Drift, by contrast, is linear in $T$, not $\sqrt T$ — the mean of the
      drift term scales as $t$, so the ratio $\mu/\sigma$ (the Sharpe ratio)
      itself scales as $\sqrt T$: a daily Sharpe multiplies by
      $\sqrt{252}\approx16$ to annualize, the identical factor as the
      volatility conversion, for a structurally different reason. All of this
      leans on one silent assumption: the periods being added must be
      genuinely uncorrelated. A trending series accumulates risk faster than
      $\sqrt T$; a mean-reverting one accumulates slower.
    worked: >
      A fund reports weekly return volatility of $3\%$. Annualizing over
      $52$ weeks: $\sqrt{52}\approx7.21$, so annual volatility is
      $3\%\times7.21\approx21.6\%$ — the identical rule as the daily case,
      just with $52$ swapped in for $252$.
    interview: >
      "Convert this daily (or weekly, or monthly) volatility to annual, or
      the reverse" is answered on the spot with $\sigma(T)=\sigma(1)\sqrt T$,
      and $\sqrt{252}\approx16$ produced from memory as the standard
      daily-to-annual factor.
    pitfalls: >
      Scaling drift by $\sqrt T$ instead of $T$, or vice versa for
      volatility — the two quantities scale at genuinely different rates and
      mixing them up flips the Sharpe ratio computation. Applying the rule to
      a serially correlated return series, where the independence the whole
      identity leans on has already failed.
    recap: >
      Volatility scales as $\sigma(1)\sqrt T$ and drift scales as
      $\mu(1)T$, so Sharpe ratios scale as $\sqrt T$ too; $\sqrt{252}\approx
      16$ is the standard daily-to-annual conversion factor for all three.
    dialogue:
      - part: Four days, added up the slow way
        teach: >
          A stock's daily return has standard deviation $0.02$, and returns on
          different trading days are independent. A risk report needs the
          spread of the return over longer stretches.
      - ask: >
          What is the standard deviation of the total return over $4$ trading
          days?
        expects: "0.04"
        hint: >
          Independent pieces add in variance, not in standard deviation.
        feedback: >
          Each day has variance $0.02^{2} = 0.0004$. Four independent days add
          to $0.0016$, and $\sqrt{0.0016} = 0.04$.
      - ask: >
          A colleague writes $4 \times 0.02 = 0.08$. What has gone wrong?
        choices:
          - text: >
              Nothing: risk over four days is four days of risk.
            feedback: >
              Expected return over four days is four days' worth, but spread
              is not. Up days and down days partly cancel, and $0.08$ ignores
              the cancellation.
          - text: >
              Adding standard deviations assumes the four days move in
              lockstep; independent days add variances.
            correct: true
            feedback: >
              $0.08$ is the answer only for perfectly correlated days, where
              every day repeats the first. Independence kills every
              covariance term, leaving the variances to add.
          - text: >
              The four days should be averaged, so the answer stays $0.02$.
            feedback: >
              Averaging would give the spread of the *mean* daily return,
              $0.02/2 = 0.01$. The question asks for the total, which spreads
              out as days accumulate.
        feedback: >
          Square, add, take the root. The cancellation between independent
          days is the entire reason spread grows slower than time.
      - reflect: >
          You squared $0.02$, multiplied by $4$ and took the root. Over $T$
          independent days, what does that procedure collapse to, and what
          does the collapse depend on?
        hint: >
          $\sqrt{T\sigma^{2}}$.
        answer: >
          $\sqrt{T\sigma^{2}} = \sigma\sqrt{T}$: the daily volatility times the
          square root of the number of days, with no squaring needed. It rests
          entirely on the variances adding, which needs the days to be
          uncorrelated. That is $\operatorname{Var}(B_t) = t$ for Brownian
          motion, read with $t$ counted in independent periods.
      - teach: >
          The rule is $\sigma(T) = \sigma(1)\sqrt{T}$, used whenever a quoted
          volatility moves between horizons. $T$ counts independent trading
          periods, so daily to annual uses $252$ trading days, not $365$:
          $\sqrt{252} \approx 15.87 \approx 16$. That is the desk shorthand
          "vol of $16$ is about a percent a day".

      - part: Converting both ways
        ask: >
          What is this stock's annual volatility? Use $\sqrt{252} \approx
          15.87$.
        expects: "0.3175"
        tolerance: 0.003
        hint: >
          Multiply the daily figure by $\sqrt{252}$.
        feedback: >
          $0.02 \times 15.87 \approx 0.3175$, about $32\%$ a year. The rule of
          $16$ gives $0.32$ in your head.
      - ask: >
          An option on a different stock trades at an implied volatility of
          $0.48$ annual. What daily standard deviation does that imply? Give
          three decimal places.
        expects: "0.030"
        tolerance: 0.0005
        hint: >
          Divide by $\sqrt{252}$, or by $16$ for the quick version.
        feedback: >
          $0.48/15.87 \approx 0.0302$, about $3\%$ a day; the rule of $16$ gives
          exactly $0.03$. Quoting it this way tells you what a typical day's
          move should look like on the screen.
      - ask: >
          The first stock also has an average daily return of $0.0005$. What
          is its average annual return?
        choices:
          - text: >
              $0.0005 \times 15.87 \approx 0.008$
            feedback: >
              That scales the drift like a volatility. Means add without any
              cancellation: $252$ days of $0.0005$ each is $252 \times 0.0005$.
          - text: >
              $0.0005 \times 252 = 0.126$
            correct: true
            feedback: >
              Expectations add linearly, so drift scales like $T$. Volatility
              grew by $15.87$; drift grows by $252$.
          - text: >
              $0.0005$, since a mean is a per-day rate either way.
            feedback: >
              A per-day rate held for $252$ days accumulates. The annual drift
              is the sum of the daily ones.
        feedback: >
          Drift scales like $T$, volatility like $\sqrt{T}$. Their ratio
          therefore scales like $\sqrt{T}$.
      - ask: >
          What is its annual Sharpe ratio, annual drift over annual
          volatility? Give three decimal places.
        expects: "0.397"
        tolerance: 0.005
        hint: >
          Either divide $0.126$ by $0.3175$, or scale the daily Sharpe ratio.
        feedback: >
          The daily Sharpe ratio is $0.0005/0.02 = 0.025$, and
          $0.025 \times 15.87 \approx 0.397$, the same as $0.126/0.3175$. Sharpe
          ratios annualize by the same $\sqrt{252}$ as volatility, for a
          different reason: $252$ on top, $\sqrt{252}$ underneath.

      - part: When the days are not independent
        ask: >
          Suppose instead that consecutive daily returns have correlation
          $-0.5$, each day still with standard deviation $0.02$. What is the
          standard deviation of a two-day return?
        expects: "0.02"
        hint: >
          $\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)
          + 2\operatorname{Cov}(X, Y)$.
        feedback: >
          The covariance is $-0.5 \times 0.0004 = -0.0002$, so the variance is
          $0.0004 + 0.0004 - 0.0004 = 0.0004$ and the standard deviation is
          $0.02$: two days carry no more spread than one. The square-root
          rule would have said $0.02\sqrt{2} \approx 0.028$.
      - ask: >
          A trend-following book has positively correlated daily returns. Its
          daily volatility times $16$ will
        choices:
          - text: >
              overstate its annual volatility.
            feedback: >
              That is the mean-reverting case, where negative covariances
              cancel spread. Positive correlation adds covariance terms on top
              of the variances.
          - text: >
              understate its annual volatility.
            correct: true
            feedback: >
              Every pair of days contributes a positive covariance, so the
              annual variance exceeds $252$ daily variances. Trends compound
              risk faster than $\sqrt{T}$.
          - text: >
              be exact anyway, since the daily volatility already includes the
              correlation.
            feedback: >
              The daily volatility describes one day in isolation. How days
              co-move only shows up when they are added, which is exactly
              where the $\sqrt{T}$ rule assumes it away.
        feedback: >
          The rule is only as good as the independence of the periods.
          Mean reversion scales slower than $\sqrt{T}$, trending faster. Said
          aloud in an interview: "variances add over independent periods, so
          volatility scales with $\sqrt{T}$; $\sqrt{252}$ is about $16$, so a
          vol of $32$ is $2\%$ a day."

  - node: quant-processes.brownian.arcsine
    hook: >
      "In a long, fair coin-flipping game, roughly what fraction of the time
      is one player ahead" has a genuinely surprising answer — not "about
      half," but "usually almost all of it, for one side or the other."
    explanation: >
      With probability $1$, the set of times the path is exactly at $0$
      during $[0,1]$ has Lebesgue measure $0$ yet is infinite and
      uncountable — self-similarity means that immediately after any zero,
      there are infinitely many more zeros nearby, arbitrarily close in time.
      This is the same mechanism behind hitting any level having infinite
      expected waiting time despite happening for certain: crossings recur,
      but the gaps between them have a heavy enough tail that long stretches
      with no crossing at all are typical, not rare.

      Let $A$ be the fraction of $[0,1]$ during which the path is positive.
      The arcsine law gives $\Pr(A\le x)=\frac2\pi\arcsin\sqrt x$, with
      density $1/(\pi\sqrt{x(1-x)})$ — a density that is U-shaped, piling up
      near both $x=0$ and $x=1$, and thin in the middle. The mean of $A$ is
      exactly $1/2$ by symmetry, but for a U-shaped density the mean is
      precisely the least typical outcome, not the most likely one.

      The same heavy-tailed-gaps intuition that makes hitting time have
      infinite mean is what makes leads sticky here: once one side pulls
      ahead, the long gaps between zero crossings mean it tends to stay ahead
      for a large share of the remaining time, not a symmetric half.
    worked: >
      What's the chance one side leads for at least $75\%$ of the game
      (equivalently, is behind for at most $25\%$)?
      $\Pr(A\le0.25)=\frac2\pi\arcsin\sqrt{0.25}=\frac2\pi\arcsin(0.5)=
      \frac2\pi\cdot\frac\pi6=\frac13$ exactly. By symmetry
      $\Pr(A\ge0.75)=\frac13$ too, so there is a full $2/3$ chance the game
      ends up lopsided at least $75/25$ in one direction or the other — a
      near-even split is the minority outcome.
    interview: >
      "Over a long fair game, what fraction of the time is the winner
      actually ahead" tests whether you reach for "about half" (wrong) or
      name the arcsine law and its U-shaped density explicitly — "leads are
      sticky" is the one-line answer to have ready.
    pitfalls: >
      Assuming a fair, symmetric game implies a roughly even split of lead
      time — the density is lowest exactly at $1/2$, the intuitive guess.
      Treating the mean $1/2$ as describing a typical outcome; for this
      U-shaped law the mean is an outlier, not a mode.
    recap: >
      The fraction of time one side leads in a fair game follows the
      U-shaped arcsine law, so a near-even split is the rare outcome and one
      side usually dominates almost the whole game.
    dialogue:
      - part: Two desks, one year
        teach: >
          Two desks run equally good, independent books with no edge. The lead
          of desk A over desk B, over a year rescaled to $[0, 1]$, follows a
          Brownian motion started at $0$. Let $A$ be the fraction of the year
          during which desk A is ahead.
      - ask: >
          What is $\mathbb{E}[A]$?
        expects: "0.5"
        hint: >
          $A = \int_0^1 \mathbf{1}\{B_t > 0\}\,dt$. Take the expectation inside
          the integral.
        feedback: >
          $\mathbb{E}[A] = \int_0^1 \Pr(B_t > 0)\,dt = \int_0^1
          \tfrac{1}{2}\,dt = 1/2$. On average desk A leads half the year,
          exactly as fairness suggests.
      - ask: >
          Which is more likely: desk A leads for between $40\%$ and $60\%$ of
          the year, or desk A leads for less than $10\%$ of it?
        choices:
          - text: >
              Between $40\%$ and $60\%$: the mean is $1/2$, so values near it
              are the common ones.
            feedback: >
              For a bell-shaped law that would be right. Here the middle band
              has probability $0.128$ and the bottom tenth has $0.205$: the
              narrower band at the edge wins. The mean is not where the mass
              is.
          - text: >
              Less than $10\%$.
            correct: true
            feedback: >
              $\Pr(A < 0.1) \approx 0.205$, against $\Pr(0.4 \le A \le 0.6)
              \approx 0.128$, on a band twice as wide. And desk B leading over
              $90\%$ of the year is another $0.205$.
          - text: >
              Equally likely: the game is fair, so no split is favoured.
            feedback: >
              Fairness makes $A$ and $1 - A$ equally likely, a symmetry about
              $1/2$. It says nothing about whether $A$ sits near $1/2$ or near
              the edges, and the two events here are not mirror images.
        feedback: >
          Lopsided years are the norm. The mean of $1/2$ comes from averaging
          years where A dominates with years where B does.
      - reflect: >
          Why would one desk tend to stay ahead? Think about a moment when the
          lead has just moved away from $0$, and what you know about how long
          a Brownian path takes to come back to a level.
        hint: >
          The expected time to hit a level is infinite.
        answer: >
          Once the lead is away from $0$, returning to $0$ is a hitting
          problem, and hitting times have a $t^{-3/2}$ tail with infinite mean.
          Most returns are quick, but a substantial share of excursions are
          very long, and one long excursion on one side swallows most of the
          year. Lead changes come in quick bursts near $0$ separated by long
          stretches of one side ahead. So $A$ piles up near $0$ and $1$.

      - part: The arcsine law
        teach: >
          The precise statement is the arcsine law:
          $\Pr(A \le x) = \tfrac{2}{\pi}\arcsin\sqrt{x}$, with density
          $1/(\pi\sqrt{x(1-x)})$ on $(0, 1)$. The density is U-shaped, with
          its modes at $0$ and $1$ and its minimum at the mean $1/2$. The
          last zero before time $1$ and the time of the maximum obey the same
          law.
      - ask: >
          What is $\Pr(A \le 0.2)$, the chance desk A leads at most a fifth of
          the year? Use $\arcsin\sqrt{0.2} = 0.4636$.
        expects: "0.2952"
        tolerance: 0.0005
        hint: >
          Multiply by $2/\pi \approx 0.6366$.
        feedback: >
          $\tfrac{2}{\pi} \times 0.4636 \approx 0.2952$. Nearly three times in
          ten, desk A is ahead for no more than about ten weeks.
      - ask: >
          What is the probability that one desk or the other leads for at
          least $80\%$ of the year?
        expects: "0.5903"
        tolerance: 0.001
        hint: >
          Desk B leading at least $80\%$ is desk A leading at most $20\%$. By
          symmetry, $A$ and $1 - A$ have the same law.
        feedback: >
          $\Pr(A \le 0.2) + \Pr(A \ge 0.8) = 2 \times 0.2952 = 0.5903$. More
          often than not, one side leads at least four-fifths of the year.
      - ask: >
          What is $\Pr(0.4 \le A \le 0.6)$, a near-even year? Use
          $\arcsin\sqrt{0.4} = 0.6847$.
        expects: "0.1282"
        tolerance: 0.001
        hint: >
          $\arcsin\sqrt{0.6} = \pi/2 - \arcsin\sqrt{0.4}$, or use the symmetry
          of $A$ and $1 - A$: subtract both tails from $1$.
        feedback: >
          Each tail $\Pr(A < 0.4)$ is $\tfrac{2}{\pi} \times 0.6847 \approx
          0.4359$, so the middle is $1 - 2 \times 0.4359 = 0.1282$. A uniform
          law would put $0.2$ there; the arcsine law puts barely an eighth.

      - part: Zeros, and what a lead proves
        ask: >
          The lead starts at $0$. During the first $0.001$ of the year, how
          many times is it back at $0$?
        choices:
          - text: >
              None, typically: the path needs time to leave and come back.
            feedback: >
              By scaling, the chance of a return to $0$ during
              $(0, \varepsilon)$ is the same for every $\varepsilon$, however
              small. The path takes both signs immediately after time $0$, so
              by continuity it passes through $0$ in every such window.
          - text: >
              Infinitely many, packed into a set of total length $0$.
            correct: true
            feedback: >
              Self-similarity makes the path recross immediately after each
              visit: the zero set has infinitely many points in every
              $(0, \varepsilon)$, is uncountable, and still has Lebesgue
              measure $0$.
          - text: >
              About one, on average, since the window is so short.
            feedback: >
              A short window does not make zeros rare for Brownian motion,
              because the path wiggles at every scale. Shrinking the window and
              rescaling gives back the same picture.
        feedback: >
          Zeros come in dense clusters around which the path spends no time at
          all, separated by long one-sided excursions. That is the arcsine law
          seen from the path.
      - ask: >
          Desk A leads for over $90\%$ of the year. The head of trading
          concludes desk A is the more skilled. How much does the lead itself
          support that?
        choices:
          - text: >
              Strongly: with no skill, a $90\%$ lead would be very rare.
            feedback: >
              With no skill at all, one desk or the other leads at least
              $90\%$ of the time with probability
              $\tfrac{4}{\pi}\arcsin\sqrt{0.1} \approx 0.41$. That is not
              rare.
          - text: >
              Hardly: under pure luck a lead that lopsided happens to one side
              or the other about $41\%$ of the time.
            correct: true
            feedback: >
              Long leads are what fair contests produce. Skill shows in the
              drift, which a single year of who-was-ahead barely measures.
          - text: >
              Not at all, because the lead must be equally often positive and
              negative under no skill.
            feedback: >
              That is the "near-even split" intuition the arcsine law refutes.
              Under no skill, $A$ is equally likely to be near $0$ as near $1$,
              which is not the same as near $1/2$.
        feedback: >
          Time in the lead is a poor measure of edge, because fair games make
          it lopsided.
      - ask: >
          The time in $[0, 1]$ at which desk A's lead is largest follows the
          same arcsine law. Is the peak more likely in the first tenth of the
          year or in the middle fifth, $[0.4, 0.6]$?
        choices:
          - text: >
              The middle fifth: it is twice as long.
            feedback: >
              Length helps only under a flat law. With the arcsine density the
              first tenth carries about $0.205$, the middle fifth about
              $0.128$.
          - text: >
              The first tenth.
            correct: true
            feedback: >
              $0.205$ against $0.128$, the same numbers as for time in the
              lead. A peak right at the start, after which the lead only
              shrinks, is common.
          - text: >
              Equally likely, since the maximum has no reason to prefer any
              time.
            feedback: >
              It prefers the ends. A path that rises early and drifts back, or
              one that rises late, puts its maximum near an endpoint.
        feedback: >
          In an interview: "time ahead follows the arcsine law,
          $\tfrac{2}{\pi}\arcsin\sqrt{x}$, U-shaped with its minimum at $1/2$;
          leads are sticky because returns to $0$ have heavy-tailed waiting
          times."
