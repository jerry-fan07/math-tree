unit: quant-probability.joint
opening: >
  A single random variable only ever tells you about itself; the moment a
  desk problem involves two quantities that move together — a hedge, a
  spread, a portfolio — you need the joint law, and this unit builds the
  toolkit for handling it. It opens with joint pmfs, densities and
  marginals, then independence and the quick support test that can rule it
  out on sight. The long middle section is covariance and correlation:
  their algebra, their bounds, and the single most common conceptual trap
  in the whole subject — mistaking zero correlation for zero dependence.
  From there, variance of a sum exposes exactly where dependence enters a
  risk calculation, convolution gives the law of a sum outright, and a
  short technique handles the expected max and min of two variables with
  no independence assumption at all. The unit closes with the bivariate
  and multivariate normal, the one family where correlation really does
  tell the whole story.
lessons:
  - node: quant-probability.joint.joint-law
    hook: >
      "Give me the joint distribution" is the interviewer checking whether
      you reach for a single table or density instead of trying to patch
      two separate one-variable answers together.
    explanation: >
      A joint pmf or density is the same object as a single-variable one,
      just indexed by a pair instead of a point: it assigns mass or
      density to every outcome $(x,y)$, and the two marginals are what's
      left after you stop caring about one coordinate — sum or integrate
      it away. Nothing new is defined here beyond bookkeeping over pairs
      instead of points.

      The one fact worth sitting with is directional: the joint pins down
      both marginals uniquely, by construction, but the two marginals
      never pin down the joint. Summing out $y$ throws away exactly the
      information about how $x$ and $y$ co-occur, and that information
      cannot be recovered afterward from the marginals alone.

      So whenever a problem states "$X$ is such-and-such and $Y$ is
      such-and-such" without saying how they relate, treat it as
      genuinely underdetermined — many different joints share those same
      two marginals, and they can disagree sharply on any question that
      involves both variables at once, like $\Pr(X=Y)$.
    worked: >
      Let $(X,Y)$ each take values in $\{0,1\}$. Joint A: $p(0,0)=0.4$,
      $p(1,1)=0.4$, $p(0,1)=p(1,0)=0.1$. Joint B: all four cells equal
      $0.25$. Both give the same marginals, $p_X(0)=p_X(1)=0.5$ and
      $p_Y(0)=p_Y(1)=0.5$ — check: Joint A's row and column sums are
      $0.5,0.5$ in both directions. Yet $\Pr(X=Y)=p(0,0)+p(1,1)=0.8$ under
      Joint A against $\Pr(X=Y)=0.5$ under Joint B: identical marginals,
      opposite answers to a question about the pair.
    interview: >
      Any prompt that gives you two marginal distributions and asks for a
      joint quantity (a sum, a max, an equality) is testing whether you
      say "not determined — depends on the joint" instead of guessing.
      State the two candidate joints only if the interviewer wants the gap
      demonstrated concretely.
    pitfalls: >
      Assuming independence by default whenever a problem only states
      marginals is the single most common shortcut that silently answers
      the wrong question. Confusing "the joint determines the marginals"
      (always true) with its converse (false) is an easy one-line error
      under time pressure.
    recap: >
      A joint law determines both marginals by summing or integrating out
      the other coordinate, but two variables sharing the same marginals
      can have wildly different joints.
    dialogue:
      - part: A hundred days of two stocks
        teach: >
          Your desk logged $100$ trading days for two stocks. Both rose on $40$
          days, only the first rose on $20$, only the second rose on $10$, and
          both fell on $30$. Write $X = 1$ on days the first stock rose and
          $X = 0$ otherwise, and $Y$ the same way for the second.
      - ask: >
          On what fraction of the days did the first stock rise?
        expects: "0.6"
        hint: >
          Count every day it rose, whatever the second stock did.
        feedback: >
          $40 + 20 = 60$ days out of $100$, so $0.6$. You added the two counts
          with $X = 1$ and ignored $Y$ entirely.
      - ask: >
          On what fraction of the days did the second stock rise?
        expects: "0.5"
        feedback: >
          $40 + 10 = 50$ days, so $0.5$ — the same move with the roles swapped.
      - ask: >
          A colleague kept only the two numbers $0.6$ and $0.5$ and deleted the
          log. Asked on what fraction of days both stocks rose, what can she
          honestly say?
        choices:
          - text: >
              $0.3$: multiply $0.6$ by $0.5$.
            feedback: >
              Multiplying is right only if the two stocks have nothing to do
              with each other, and she has no grounds for assuming that. The
              log says $0.4$.
          - text: >
              $0.5$: both cannot rise more often than the second one does.
            feedback: >
              $0.5$ is a ceiling, not an answer: it would need every up day of
              the second stock to be an up day of the first. The log says
              $0.4$.
          - text: >
              No single number: different logs share the totals $0.6$ and
              $0.5$.
            correct: true
            feedback: >
              Move $10$ days from both-rose to only-the-first, and $10$ from
              both-fell to only-the-second. The counts become $30, 30, 20, 20$:
              the first stock still rose $60$ times and the second $50$, but
              both rose on only $30$ days.
        feedback: >
          Two totals cannot say how the up days line up against each other. The
          four counts can.
      - reflect: >
          To get $0.6$ you added across the second stock's outcomes. Say what
          that addition threw away, and why no cleverness recovers it from the
          two totals alone.
        answer: >
          Adding over $Y$ keeps how often $X$ took each value and discards
          which value of $Y$ came with it — the co-occurrence. Many four-cell
          tables share the same row and column totals, as the shifted log
          showed, so the totals are compatible with many different answers to
          any question about the pair. The four-cell table is the joint law;
          the two totals are its marginals.

      - part: The table, and what lives in its margins
        teach: >
          The four-cell table is the joint pmf of $(X,Y)$:
          $p(x,y) = \Pr(X = x, Y = y)$, nonnegative and summing to $1$ over all
          pairs. Each row sum $p_X(x) = \sum_y p(x,y)$ is the marginal pmf of
          $X$ — written in the table's margin, hence the name — and the column
          sums give $p_Y$. The joint fixes both marginals; the marginals do not
          fix the joint.
      - ask: >
          Keep $\Pr(X = 1) = 0.6$ and $\Pr(Y = 1) = 0.5$, and let
          $t = \Pr(X = 1, Y = 1)$ vary. What is the smallest value $t$ can take?
        expects: "0.1"
        hint: >
          Write the other three cells in terms of $t$ and see which one goes
          negative first.
        feedback: >
          The cells are $p(1,1) = t$, $p(1,0) = 0.6 - t$, $p(0,1) = 0.5 - t$
          and $p(0,0) = 1 - t - (0.6 - t) - (0.5 - t) = t - 0.1$. That last cell
          is nonnegative only when $t \ge 0.1$: on at least $10$ days in $100$
          both stocks must rise.
      - ask: >
          And the largest value $t$ can take?
        expects: "0.5"
        feedback: >
          $p(0,1) = 0.5 - t \ge 0$ caps $t$ at $0.5$, where every up day of the
          second stock is an up day of the first. Every $t$ between $0.1$ and
          $0.5$ gives a legitimate table with the same two totals.
      - ask: >
          Which question about these two stocks do the totals $0.6$ and $0.5$
          answer on their own?
        choices:
          - text: >
              How often the two moved in the same direction
            feedback: >
              That is $p(1,1) + p(0,0) = 2t - 0.1$, anywhere from $0.1$ to $0.9$
              as $t$ ranges. The totals cannot settle it.
          - text: >
              How often at least one of them rose
            feedback: >
              That is $1 - p(0,0) = 1.1 - t$, anywhere from $0.6$ to $1$. It
              mentions both stocks, so it needs the joint.
          - text: >
              How often the first stock fell
            correct: true
            feedback: >
              $1 - 0.6 = 0.4$, read from one marginal. A question about one
              variable lives in its margin.
        feedback: >
          The dividing line: a question about one variable needs only its
          marginal; a question that mentions both needs the joint.

      - part: The sum becomes an integral
        ask: >
          Now a continuous pair: $(X,Y)$ has joint density $f(x,y) = x + y$ on
          the unit square $0 < x < 1$, $0 < y < 1$, and $0$ elsewhere. Do to
          $y$ what you did to the table's columns, and give the density of $X$
          at $x = 1/2$.
        expects: "1"
        hint: >
          A sum over the values of $y$ becomes an integral over $y$.
        feedback: >
          $f_X(x) = \int_0^1 (x + y)\,dy = x + 1/2$, so $f_X(1/2) = 1$.
          Integrating $y$ out is the continuous row sum.
      - ask: >
          What is $\Pr(X < 1/2)$?
        expects: "3/8"
        feedback: >
          $\int_0^{1/2} (x + 1/2)\,dx = 1/8 + 1/4 = 3/8$. Once the marginal is
          in hand, $Y$ has left the problem.

      - part: A table that is not one
        ask: >
          Back to the stocks. Someone wants totals $0.6$ and $0.5$ with the two
          rarely rising together, sets $p(1,1) = 0.05$, and fills in the other
          three cells to match the totals. What is wrong with the result?
        choices:
          - text: >
              Its row and column totals are off.
            feedback: >
              They were filled in to match: $p(1,0) = 0.55$ and
              $p(0,1) = 0.45$ give totals $0.6$ and $0.5$ exactly.
          - text: >
              Its cells do not sum to $1$.
            feedback: >
              The last cell was chosen to make the total $1$, so total mass is
              fine.
          - text: >
              One cell is negative.
            correct: true
            feedback: >
              $p(0,0) = 0.05 - 0.1 = -0.05$. Only nonnegativity fails, and it
              fails because $0.05$ sits below the floor of $0.1$ you found.
        feedback: >
          Marginals constrain the joint without determining it: here they pin
          $\Pr(X = 1, Y = 1)$ to $[0.1, 0.5]$. In an interview, two marginals and
          a question about the pair get the answer "not determined — it depends
          on the joint", followed by the range when you can give it.

  - node: quant-probability.joint.independence-rvs
    hook: >
      Independence is invoked constantly and checked rarely — the working
      test here is the fast, honest way to actually verify it instead of
      assuming it because the problem "feels" independent.
    explanation: >
      Independence says the joint carries no extra information beyond the
      two marginals — it factors, $p(x,y)=p_X(x)p_Y(y)$ or
      $f(x,y)=f_X(x)f_Y(y)$, so knowing $X$'s value changes nothing about
      $Y$'s distribution. The equivalent event statement,
      $\Pr(X\in A,Y\in B)=\Pr(X\in A)\Pr(Y\in B)$ for every $A,B$, is the
      same claim applied to arbitrary sets rather than single points.

      The practical shortcut is the working test: you don't need the
      correctly normalized marginals to check factorization, only that the
      joint density splits as some nonnegative $g(x)$ times some
      nonnegative $h(y)$. Whatever constant is missing from $g$ or $h$
      individually gets absorbed once you actually integrate each one to
      $1$, so the split alone is the entire test.

      Mutual independence of more than two variables is strictly stronger
      than every pair being independent on its own — the joint must factor
      across every subset simultaneously, not just pairwise — and once
      independence holds, it passes through functions for free: $g(X)$ and
      $h(Y)$ stay independent no matter how nonlinear $g,h$ are.
    worked: >
      Let $f(x,y)=4xy$ on the unit square $0<x<1,0<y<1$. This splits as
      $g(x)h(y)=(x)(y)$ with the constant $4$ distributed however you
      like — the split alone confirms independence. Integrating out
      confirms the marginals directly: $f_X(x)=\int_0^1 4xy\,dy=2x$ and
      $f_Y(y)=2y$, and indeed $f_X(x)f_Y(y)=4xy=f(x,y)$. As a check,
      $\Pr(X<0.5,Y<0.5)=\int_0^{0.5}\int_0^{0.5}4xy\,dx\,dy=0.25\times0.25
      =0.0625$, exactly $\Pr(X<0.5)\Pr(Y<0.5)$.
    interview: >
      "Are $X$ and $Y$ independent?" almost always wants the factorization
      test stated and applied, not a verbal argument about the setup.
      Naming the working-test shortcut — split first, normalize later —
      signals you're not about to grind through two separate integrals
      unnecessarily.
    pitfalls: >
      Checking independence only at a couple of sample points instead of
      confirming the factorization holds identically over the whole
      support gives false confidence. Trying to verify $g,h$ are already
      normalized densities before comparing wastes a step the working test
      makes unnecessary.
    recap: >
      $X,Y$ are independent exactly when the joint factors into a function
      of $x$ alone times a function of $y$ alone — check the split, and
      let the normalizing constants take care of themselves.
    dialogue:
      - part: Two tables with the same margins
        teach: >
          Two joint tables for $(X,Y)$, with $X \in \{0, 1\}$ and
          $Y \in \{0, 1, 2\}$, each written as its row for $X = 0$ and then its
          row for $X = 1$. Table P: $(0.12, 0.18, 0.10)$ and
          $(0.18, 0.27, 0.15)$. Table Q: $(0.20, 0.10, 0.10)$ and
          $(0.10, 0.35, 0.15)$. Both have $\Pr(X = 1) = 0.6$ and the same
          column totals $0.3, 0.45, 0.25$.
      - ask: >
          In table P, what is $\Pr(Y = 0 \mid X = 0)$?
        expects: "0.3"
        hint: >
          Divide the cell by its row total.
        feedback: >
          $0.12 / 0.4 = 0.3$.
      - ask: >
          Still in table P, what is $\Pr(Y = 0 \mid X = 1)$?
        expects: "0.3"
        feedback: >
          $0.18 / 0.6 = 0.3$ — the same, and equal to the column total
          $\Pr(Y = 0) = 0.3$. Try $Y = 1$: $0.18/0.4 = 0.27/0.6 = 0.45$. In P,
          whatever $X$ shows, your forecast for $Y$ does not move.
      - ask: >
          Now table Q: what is $\Pr(Y = 0 \mid X = 0)$?
        expects: "0.5"
        feedback: >
          $0.20 / 0.4 = 0.5$, against $0.10 / 0.6 = 1/6$ given $X = 1$. In Q,
          seeing $X$ moves your forecast for $Y = 0$ from $0.5$ to $1/6$ —
          although Q has exactly the same marginals as P.
      - reflect: >
          Table P has a property you can check cell by cell without dividing
          anything. Find it, and say why it amounts to "seeing $X$ never
          changes the forecast for $Y$".
        hint: >
          Compare each cell of P with its row total and its column total.
        answer: >
          Every cell of P is its row total times its column total:
          $0.12 = 0.4 \times 0.3$, $0.27 = 0.6 \times 0.45$, and so on. The
          forecast $\Pr(Y = y \mid X = x) = p(x,y)/p_X(x)$ equals $p_Y(y)$ for
          every $x$ exactly when $p(x,y) = p_X(x)\,p_Y(y)$. In Q the corner
          cell is $0.20$, not $0.4 \times 0.3 = 0.12$, and that is the
          dependence.

      - part: Factoring, and a test that skips the constants
        teach: >
          $X$ and $Y$ are independent when
          $\Pr(X \in A, Y \in B) = \Pr(X \in A)\Pr(Y \in B)$ for all sets $A$
          and $B$: every event about $X$ is independent of every event about
          $Y$. Equivalently the joint factors into its marginals,
          $p(x,y) = p_X(x)\,p_Y(y)$, or $f(x,y) = f_X(x)\,f_Y(y)$ for
          densities. P is independent; Q is not, with identical marginals.
      - ask: >
          A density is $f(x,y) = c\,x\,y^{2}$ on the unit square and $0$
          elsewhere, with the constant $c$ not yet found. Are $X$ and $Y$
          independent?
        choices:
          - text: >
              Cannot tell until $c$ is computed.
            feedback: >
              $c$ is one number and can ride along with either factor. Whatever
              its value, $f$ is a function of $x$ times a function of $y$.
          - text: >
              No: both variables appear in one formula.
            feedback: >
              Appearing together is not the problem; being tangled together
              is. A function of $x$ times a function of $y$ is exactly what
              independence looks like.
          - text: >
              Yes: $f$ splits as $(c\,x) \cdot (y^{2})$.
            correct: true
            feedback: >
              Any split $g(x)h(y)$ with $g, h \ge 0$ is enough. Normalizing the
              pieces into the true marginals $2x$ and $3y^{2}$ only moves
              constants around, and forces $c = 6$.
        feedback: >
          That is the working test: independence holds exactly when the
          density splits as $g(x)h(y)$ for some nonnegative $g, h$. You never
          have to normalize first.
      - ask: >
          With $c = 6$, what is $\Pr(X < 1/2,\ Y > 1/2)$?
        expects: "7/32"
        hint: >
          Independence splits the event into one condition on $X$ and one on
          $Y$.
        feedback: >
          $\Pr(X < 1/2) = \int_0^{1/2} 2x\,dx = 1/4$ and
          $\Pr(Y > 1/2) = \int_{1/2}^{1} 3y^{2}\,dy = 1 - 1/8 = 7/8$, so the
          answer is $(1/4)(7/8) = 7/32$. One double integral became two single
          ones.

      - part: A density that will not split
        ask: >
          Now $f(x,y) = x + y$ on the unit square. Compute the ratio
          $f(1, y)/f(1/2, y)$ at $y = 0.1$ and at $y = 0.9$. What does the
          comparison tell you?
        choices:
          - text: >
              Nothing: the support is the full square, so they are independent.
            feedback: >
              A square support is a requirement, not a proof. The density
              inside it must still split.
          - text: >
              Independent: $x + y$ separates cleanly into an $x$ part and a $y$
              part.
            feedback: >
              Separating into a sum is not separating into a product.
              Independence needs the product.
          - text: >
              Dependent: the ratio is about $1.83$ at $y = 0.1$ and about
              $1.36$ at $y = 0.9$.
            correct: true
            feedback: >
              $1.1/0.6 \approx 1.83$ and $1.9/1.4 \approx 1.36$. If
              $f = g(x)h(y)$, the ratio would be $g(1)/g(1/2)$ for every $y$. It
              moves, so no split exists.
        feedback: >
          Fix two values of $x$ and watch their ratio as $y$ varies: a constant
          ratio is what a product looks like, and any change in it proves
          dependence.

      - part: Three variables, where pairs are not enough
        ask: >
          $X$ and $Y$ are independent fair signs, each $\pm 1$ with probability
          $1/2$, and $Z = XY$. What is $\Pr(X = 1, Z = 1)$?
        expects: "1/4"
        hint: >
          With $X = 1$, the event $Z = 1$ says something about $Y$.
        feedback: >
          $X = 1$ and $Z = 1$ force $Y = 1$, so the probability is $1/4$. And
          $Z$ is itself $\pm 1$ with probability $1/2$ each, so this equals
          $\Pr(X = 1)\Pr(Z = 1)$. The same check passes for every pair among
          $X, Y, Z$: they are pairwise independent.
      - ask: >
          What is $\Pr(X = 1, Y = 1, Z = -1)$?
        expects: "0"
        feedback: >
          $X = Y = 1$ forces $Z = 1$, so the event is impossible, while
          factoring would demand $(1/2)^{3} = 1/8$. Mutual independence of
          $X_1, \dots, X_n$ needs the joint to factor across every subset at
          once; pairwise independence is strictly weaker, and here any two of
          the three determine the third.
      - ask: >
          $X$ and $Y$ are independent. Are $X^{2}$ and $e^{Y}$ independent?
        choices:
          - text: >
              Not necessarily: squaring can create dependence.
            feedback: >
              Squaring throws information about $X$ away; it cannot invent a
              link to $Y$ that was never there.
          - text: >
              Yes: every event about $X^{2}$ is an event about $X$, and every
              event about $e^{Y}$ is an event about $Y$.
            correct: true
            feedback: >
              $\{X^{2} \le 4\}$ is just $\{-2 \le X \le 2\}$. The product rule
              holds for all sets, so it holds for these.
          - text: >
              Only if both functions are linear.
            feedback: >
              The definition quantifies over every pair of sets $A, B$, and
              nonlinear functions only change which sets you are looking at.
        feedback: >
          Independence passes through any function of each variable
          separately: $g(X)$ and $h(Y)$ are independent whenever $X$ and $Y$
          are.

  - node: quant-probability.joint.support-rectangle-test
    hook: >
      This is the five-second check to run before any algebra: a glance at
      the support can kill independence outright, or tell you the real
      work is still ahead.
    explanation: >
      If $X$ and $Y$ are independent, the region where the joint density
      is positive has to be a rectangle $S_X\times S_Y$, because
      $f_X(x)f_Y(y)>0$ turns on independently in each coordinate. So the
      moment a support's shape ties the two coordinates together — a
      disc, a triangle, any region where the allowed range of $y$ shifts
      as $x$ moves — independence is dead before you write a single
      integral.

      The test only cuts one way. A rectangular support is necessary for
      independence but never sufficient: the density can still be
      non-constant and non-factoring inside a perfectly rectangular
      region, and at that point you're back to actually checking the
      factorization.

      Treat this as a triage step, not a proof of independence — it's a
      fast way to close out "are they independent" questions that are
      actually geometry questions in disguise, saving the factorization
      check for supports that survive the first look.
    worked: >
      Let $(X,Y)$ be uniform on the unit disc $x^2+y^2\le1$. The support
      is a disc, not a rectangle, so $X,Y$ are dependent with no further
      computation. Concretely: at $X=0.99$, $Y$ is confined to
      $|y|\le\sqrt{1-0.9801}\approx0.141$, while at $X=0$, $Y$ ranges over
      all of $[-1,1]$ — the allowed spread of $Y$ visibly depends on the
      value of $X$, which is exactly what dependence means.
    interview: >
      "Are these two independent?" for a uniform-on-a-region setup should
      be answered by inspecting the support shape first — naming
      "rectangle" or "not a rectangle" out loud before any integral is
      what the interviewer is checking for.
    pitfalls: >
      Declaring independence just because the support happens to be a
      rectangle skips the half of the test that still needs the density to
      factor. Missing that an unbounded region (like the whole plane) can
      still be a "rectangle" in this sense — $\mathbb{R}\times\mathbb{R}$
      counts — and wrongly assuming unboundedness rules the test out.
    recap: >
      A non-rectangular support proves dependence instantly; a rectangular
      one only earns the right to check whether the density actually
      factors.
    dialogue:
      - part: A dart under a parabola
        teach: >
          A dart lands uniformly at random in the region under the curve
          $y = x^{2}$ for $0 < x < 1$, that is, in
          $\{0 < x < 1,\ 0 < y < x^{2}\}$. Its coordinates are $(X, Y)$. An
          interviewer asks whether $X$ and $Y$ are independent.
      - ask: >
          The region has area $1/3$. What is the joint density on it?
        expects: "3"
        feedback: >
          Uniform means constant, and the constant must integrate to $1$ over
          area $1/3$: $f = 3$ on the region and $0$ off it.
      - ask: >
          What is the marginal density $f_X(0.2)$?
        expects: "0.12"
        hint: >
          For a fixed $x$, the dart's $y$ runs from $0$ up to $x^{2}$.
        feedback: >
          $f_X(x) = \int_0^{x^{2}} 3\,dy = 3x^{2}$, so
          $f_X(0.2) = 3(0.04) = 0.12$.
      - ask: >
          What is the joint density at the point $(0.2, 0.5)$?
        expects: "0"
        feedback: >
          $0.5 > 0.2^{2} = 0.04$, so the point lies above the parabola, off the
          region: $f(0.2, 0.5) = 0$.
      - ask: >
          The other marginal works out to $f_Y(y) = 3(1 - \sqrt{y})$, so
          $f_Y(0.5) \approx 0.88$. What does the point $(0.2, 0.5)$ settle?
        choices:
          - text: >
              Independent: both marginals are positive there.
            feedback: >
              Positive marginals make the product positive; the joint is $0$.
              That disagreement is the opposite of independence.
          - text: >
              Nothing: a single point cannot decide independence.
            feedback: >
              It is not a single point. Everywhere near $(0.2, 0.5)$ the joint
              is $0$ while $f_X f_Y$ is about $0.11$, so the factorization
              fails on a patch of positive area.
          - text: >
              Dependent: $f = 0$ there while $f_X(0.2)f_Y(0.5) \approx 0.11$.
            correct: true
            feedback: >
              $0.12 \times 0.88 \approx 0.11 \ne 0$, and the same holds on a
              whole neighbourhood of the point. The joint does not factor.
        feedback: >
          The slow route works: two integrals, then a place where the
          factorization breaks.
      - reflect: >
          Look at the point that did the damage. Could you have found it — and
          the verdict — before computing either marginal? Say what feature of
          the region you were really using.
        answer: >
          $f_X(0.2) > 0$ only because $x = 0.2$ can occur, and $f_Y(0.5) > 0$
          only because $y = 0.5$ can occur, so their product is positive at
          that pairing. But the region pairs $x = 0.2$ only with $y < 0.04$.
          Any region whose allowed $y$-range moves with $x$ contains such a
          pairing, so the shape alone decides it. The integrals only confirmed
          what the picture said.

      - part: Read the shape first
        teach: >
          The support test. If $X$ and $Y$ are independent,
          $f(x,y) = f_X(x)f_Y(y)$ is positive exactly when both factors are,
          so the support is a product set $S_X \times S_Y$ — a rectangle,
          possibly unbounded. Turned around: a support whose $y$-range shifts
          with $x$ — a triangle, a disc, a region under a curve — means
          dependence, with no algebra at all.
      - ask: >
          $(X,Y)$ is uniform on the slanted strip
          $\{0 < x < 2,\ x < y < x + 1\}$. Over all darts, $Y$ ranges over
          $(0, 3)$. Given $X = 1.5$, what is the largest value $Y$ can take?
        expects: "2.5"
        feedback: >
          $y < x + 1 = 2.5$, and also $y > 1.5$. Learning $X$ shrank $Y$'s
          possible range from $(0, 3)$ to $(1.5, 2.5)$: dependent, read
          straight off the slant.
      - ask: >
          Every vertical slice of that strip has length $1$, so $X$ is uniform
          on $(0, 2)$. Does that rescue independence?
        choices:
          - text: >
              Yes: a uniform $X$ carries no information about anything.
            feedback: >
              A uniform marginal says nothing about how $X$ pairs with $Y$.
              $X = 0.1$ forces $Y < 1.1$, while $X = 1.9$ forces $Y > 1.9$.
          - text: >
              Only if $Y$ is uniform as well.
            feedback: >
              $Y$ is not uniform here — its density rises, stays flat, then
              falls on $(0, 3)$ — and even a uniform $Y$ could not repair a
              support that slides.
          - text: >
              No: equal slice lengths say nothing about where the slices sit.
            correct: true
            feedback: >
              The slices all have length $1$ but slide upward with $x$. A
              product set needs every slice to be the same set $S_Y$.
        feedback: >
          The test asks whether each vertical slice of the support is the same
          set, not merely the same size.

      - part: A rectangle only earns the next check
        ask: >
          The density $f(x,y) = \tfrac{4}{5}(1 + xy)$ lives on the unit square,
          so its support is a rectangle and the shape test is silent. Finish
          the job: compute $f(1, y)/f(0, y)$ at $y = 1/2$.
        expects: "1.5"
        feedback: >
          $(1 + 1/2)/1 = 1.5$, while at $y = 0$ the same ratio is $1$. A
          factored density $g(x)h(y)$ would give $g(1)/g(0)$ at every $y$, so
          this one does not factor: dependent, on a perfectly rectangular
          support.
      - ask: >
          So what does a rectangular support prove on its own?
        choices:
          - text: >
              Independence, once the density is positive everywhere on it.
            feedback: >
              $\tfrac{4}{5}(1 + xy)$ is positive on the whole square, and $X$
              and $Y$ are still dependent.
          - text: >
              Dependence, since most densities on a square do not factor.
            feedback: >
              $6xy^{2}$ on the same square does factor. The shape gives no
              verdict in either direction.
          - text: >
              Nothing yet: it is necessary for independence, and the
              factorization still has to be checked.
            correct: true
            feedback: >
              The test runs one way. A non-rectangle proves dependence; a
              rectangle only lets you proceed.
        feedback: >
          Necessary, not sufficient: a rectangle is a pass to the factorization
          check, never a verdict.
      - ask: >
          A density proportional to $e^{-x^{2} - y^{2} - xy}$ is positive on
          the whole plane. What does the support test say?
        choices:
          - text: >
              Dependent: the plane is not a bounded rectangle.
            feedback: >
              $\mathbb{R} \times \mathbb{R}$ is a product set. Unbounded
              rectangles count.
          - text: >
              Nothing: the support $\mathbb{R} \times \mathbb{R}$ is a product
              set.
            correct: true
            feedback: >
              The test is silent, and the verdict comes from the exponent: the
              $xy$ term stops $e^{-x^{2} - y^{2} - xy}$ from splitting as
              $g(x)h(y)$, so the pair is dependent — the factorization check
              talking, not the shape.
          - text: >
              Independent: a density positive everywhere cannot tie the
              coordinates together.
            feedback: >
              The coordinates can be tied together through the density's
              values, not just its support. The $xy$ term does exactly that.
        feedback: >
          Unbounded supports are rectangles when they are products of
          intervals; the whole plane always passes the shape test.
      - teach: >
          In an interview, say the shape out loud first: "the support is not a
          product set, so they are dependent" settles a triangle or a disc
          before any integral. If the support is a rectangle, say so, and move
          on to whether the density splits.

  - node: quant-probability.joint.covariance
    hook: >
      $\operatorname{Cov}(X,Y)=\mathbb{E}[XY]-\mathbb{E}[X]\mathbb{E}[Y]$
      is the one line you compute with every time — knowing it's the same
      object as the centered-product definition is what lets you recover
      it cold.
    explanation: >
      Start from the intuitive definition,
      $\operatorname{Cov}(X,Y)=\mathbb{E}[(X-\mathbb{E}[X])(Y-\mathbb{E}[Y])]$:
      expand the product and apply linearity termwise (valid for any $X,Y$,
      no independence required) to get
      $\mathbb{E}[XY]-\mathbb{E}[X]\mathbb{E}[Y]-\mathbb{E}[X]\mathbb{E}[Y]
      +\mathbb{E}[X]\mathbb{E}[Y]=\mathbb{E}[XY]-\mathbb{E}[X]\mathbb{E}[Y]$.
      One moment computation and one subtraction, exactly the same
      shortcut that turns variance's definition into a usable formula.

      Read the sign directly off the definition: positive covariance means
      $X$ and $Y$ tend to sit on the same side of their own means together,
      negative means opposite sides, and either can vanish entirely if one
      variable is constant, since a constant has nothing to co-vary with.

      The number itself carries the units of $X$ times the units of $Y$,
      so a covariance of $2$ means nothing on its own until you know what's
      being measured — doubling the scale of $X$ doubles the covariance
      with no change in how related the variables actually are. That
      units problem is exactly what correlation exists to fix.
    worked: >
      Roll two fair dice; let $Y$ be the first die and $X=Y+D_2$ the
      total. Summing directly over the $36$ equally likely pairs,
      $\mathbb{E}[Y^{2}]=91/6$ and $\mathbb{E}[YD_2]=(21\times21)/36=49/4$,
      so $\mathbb{E}[XY]=\mathbb{E}[Y^{2}]+\mathbb{E}[YD_2]
      =91/6+49/4=329/12$. With $\mathbb{E}[X]=7$ and $\mathbb{E}[Y]=3.5$,
      $\operatorname{Cov}(X,Y)=329/12-24.5=35/12\approx2.92$ — positive,
      as it should be, since a higher first die pushes the total up too.
    interview: >
      "Compute the covariance" should trigger
      $\mathbb{E}[XY]-\mathbb{E}[X]\mathbb{E}[Y]$ immediately, not the
      centered-product form worked out term by term. A quick follow-up
      asks you to read the sign of a covariance before computing it, from
      the setup alone.
    pitfalls: >
      Reporting a raw covariance as if its magnitude alone measured
      strength of association ignores that it scales with the units of
      both variables — a covariance of $1000$ can be a weaker relationship
      than a covariance of $0.01$ measured on different scales. Forgetting
      that $\operatorname{Cov}(X,X)=\operatorname{Var}(X)$ leads to
      re-deriving variance from scratch when it's just this formula's
      special case.
    recap: >
      Covariance reduces in practice to $\mathbb{E}[XY]
      -\mathbb{E}[X]\mathbb{E}[Y]$, a signed, unit-carrying measure of
      whether two variables deviate from their means together — $35/12$
      for a die and the total it contributes to.
    dialogue:
      - part: Do these two move together?
        teach: >
          Four equally likely scenarios for tomorrow's moves of two stocks, in
          ticks, written $(X, Y)$: $(4, 5)$, $(2, 1)$, $(0, 3)$ and
          $(-2, -1)$. The means are $\mathbb{E}[X] = 1$ and
          $\mathbb{E}[Y] = 2$. A trader asks whether the two tend to move
          together.
      - ask: >
          In how many of the four scenarios do both stocks land on the same
          side of their own means — both above, or both below?
        expects: "2"
        hint: >
          Subtract the means first: each scenario becomes a pair of
          deviations.
        feedback: >
          The deviations are $(3, 3)$, $(1, -1)$, $(-1, 1)$ and $(-3, -3)$. The
          first and last agree in sign; the middle two disagree. Two and two.
      - ask: >
          Two scenarios agree and two disagree. Do the stocks tend to move
          together?
        choices:
          - text: >
              No tendency: it is two against two.
            feedback: >
              Counting ignores size. The agreeing scenarios are $3$-tick moves
              on both sides; the disagreeing ones are $1$-tick wiggles.
          - text: >
              Yes: when they move far, they move far together.
            correct: true
            feedback: >
              The big deviations agree in sign and the small ones do not, so a
              fair score should come out positive.
          - text: >
              Cannot say without more scenarios.
            feedback: >
              These four equally likely scenarios are the whole distribution.
              The answer is in them; counting signs just cannot see it.
        feedback: >
          You need a score that weighs each scenario by how far both stocks
          moved, with a sign that says whether they agreed.
      - reflect: >
          Design that score: one number per scenario, positive when the two
          land on the same side of their means, negative on opposite sides,
          larger for bigger moves. Then average it over the four scenarios.
        answer: >
          Multiply the deviations: $(X - \mathbb{E}[X])(Y - \mathbb{E}[Y])$.
          Agreeing signs give a positive product, opposite signs a negative
          one, and sizes multiply. Here the products are $9, -1, -1, 9$, which
          average to $4$. That average is the covariance.

      - part: The definition, and the form you compute
        teach: >
          For $X, Y$ with finite variances,
          $\operatorname{Cov}(X,Y) = \mathbb{E}[(X - \mathbb{E}[X])(Y - \mathbb{E}[Y])]$.
          Expanding the product and taking expectations term by term gives
          the form you actually compute,
          $\operatorname{Cov}(X,Y) = \mathbb{E}[XY] - \mathbb{E}[X]\mathbb{E}[Y]$.
          Taking $Y = X$ gives $\operatorname{Cov}(X,X) = \operatorname{Var}(X)$.
      - ask: >
          Check the short form on the four scenarios. What is
          $\mathbb{E}[XY]$?
        expects: "6"
        feedback: >
          $(20 + 2 + 0 + 2)/4 = 6$, and $6 - 1 \times 2 = 4$: the same
          covariance as the average of centred products.
      - ask: >
          Expanding $(X - \mathbb{E}[X])(Y - \mathbb{E}[Y])$ gives four terms,
          three of which involve both means. Why is the result
          $\mathbb{E}[XY] - \mathbb{E}[X]\mathbb{E}[Y]$, with the product of
          means subtracted only once?
        choices:
          - text: >
              Because $X$ and $Y$ are independent, so the cross terms vanish.
            feedback: >
              No independence is used anywhere; the scenarios above are not
              independent. Only linearity of expectation is at work.
          - text: >
              Because the two middle terms each have mean
              $\mathbb{E}[X]\mathbb{E}[Y]$, and the last term is that constant
              again: $-2 + 1 = -1$ copy.
            correct: true
            feedback: >
              $\mathbb{E}[X \cdot \mathbb{E}[Y]] = \mathbb{E}[X]\mathbb{E}[Y]$,
              likewise for the other middle term, and the constant term adds
              one copy back.
          - text: >
              Because centred variables have mean $0$, so the middle terms are
              $0$.
            feedback: >
              The middle terms are $-X\,\mathbb{E}[Y]$ and
              $-\mathbb{E}[X]\,Y$, which are not centred. Each has mean
              $-\mathbb{E}[X]\mathbb{E}[Y]$, not $0$.
        feedback: >
          Linearity alone: two copies of $\mathbb{E}[X]\mathbb{E}[Y]$
          subtracted, one added back. It is the same move that turns the
          definition of variance into $\mathbb{E}[X^{2}] - \mathbb{E}[X]^{2}$.

      - part: Signs and sizes by hand
        ask: >
          Flip a fair coin four times. $X$ counts heads in flips $1$ to $3$ and
          $Y$ counts heads in flips $2$ to $4$. What is
          $\operatorname{Cov}(X,Y)$?
        expects: "0.5"
        hint: >
          Write $X$ and $Y$ as sums of the flip indicators, multiply out
          $\mathbb{E}[XY]$, and use that an indicator squared is itself.
        feedback: >
          $XY$ expands into $9$ products of indicators. The two squares (flips
          $2$ and $3$) each have mean $1/2$; the other $7$ products are of
          different flips, each with mean $1/4$. So
          $\mathbb{E}[XY] = 1 + 7/4 = 11/4$, and
          $\operatorname{Cov}(X,Y) = 11/4 - (3/2)(3/2) = 2/4 = 0.5$ — one
          quarter for each shared flip.
      - ask: >
          Ten fair flips. $X$ counts heads and $Y$ counts tails. Without
          computing anything, what is the sign of $\operatorname{Cov}(X,Y)$?
        choices:
          - text: >
              Positive: both count outcomes of the same flips.
            feedback: >
              Sharing flips is not the same as moving together. Every extra
              head is one fewer tail.
          - text: >
              Negative: whenever $X$ is above its mean $5$, $Y$ is below it.
            correct: true
            feedback: >
              $Y = 10 - X$, so the deviations are exact mirror images and every
              centred product is $\le 0$. In fact
              $\operatorname{Cov}(X,Y) = -\operatorname{Var}(X) = -2.5$.
          - text: >
              Zero: heads and tails are equally likely.
            feedback: >
              Equal likelihood makes the means equal; it says nothing about
              co-movement. Here the two move in perfect opposition.
        feedback: >
          The sign is read off the definition: same side of the means pushes it
          up, opposite sides push it down.
      - ask: >
          Back to the four stock scenarios, with covariance $4$. The first
          stock is re-quoted in hundredths of a tick, so every $X$ is
          multiplied by $100$. What is the new covariance?
        expects: "400"
        feedback: >
          Every deviation of $X$ is $100$ times larger, so every centred
          product is too: $400$. Nothing about how the stocks move together
          changed — only the units. Covariance carries the units of $X$ times
          those of $Y$, which is why a bare covariance cannot be compared
          across problems.
      - ask: >
          $Y$ is the constant $7$, and $X$ is any variable with finite
          variance. What is $\operatorname{Cov}(X,Y)$?
        choices:
          - text: >
              $7\,\mathbb{E}[X]$
            feedback: >
              That is $\mathbb{E}[XY]$. Subtract
              $\mathbb{E}[X]\mathbb{E}[Y] = 7\,\mathbb{E}[X]$ and nothing is
              left.
          - text: >
              It depends on how large $\operatorname{Var}(X)$ is.
            feedback: >
              Every centred product has a factor $Y - 7 = 0$, however much $X$
              moves.
          - text: >
              $0$
            correct: true
            feedback: >
              A constant never leaves its mean, so every centred product is
              $0$. There is nothing for $X$ to move together with.
        feedback: >
          Covariance with a constant is $0$, whichever constant: it measures
          joint deviation, and a constant does not deviate.

  - node: quant-probability.joint.covariance-bilinearity
    hook: >
      Every covariance of a linear combination — a portfolio, a spread, a
      hedge ratio — reduces to this one expansion rule, which is why it's
      worth being able to apply without re-deriving it each time.
    explanation: >
      Bilinearity falls straight out of the definition: centering
      $aX+b$ removes $b$ entirely, since $\mathbb{E}[aX+b]=a\mathbb{E}[X]+b$
      shifts by the same $b$, leaving $(aX+b)-\mathbb{E}[aX+b]
      =a(X-\mathbb{E}[X])$ with no trace of the constant. Multiplying two
      such centered, scaled differences and taking expectation pulls both
      constants $a,c$ straight out front, giving
      $\operatorname{Cov}(aX+b,cY+d)=ac\operatorname{Cov}(X,Y)$.

      The general sum version is the same idea applied twice: expand each
      linear combination into its terms, multiply everything out, and
      collect — every cross-term becomes a coefficient times a pairwise
      covariance,
      $\operatorname{Cov}(\sum_i a_iX_i,\sum_j b_jY_j)
      =\sum_i\sum_j a_ib_j\operatorname{Cov}(X_i,Y_j)$. There is no
      independence hypothesis anywhere in this — it's pure algebra on the
      centered variables.

      This turns every covariance-of-a-combination question into
      bookkeeping: write out the coefficient grid, look up or compute each
      pairwise covariance once, and sum weighted entries — never
      re-derive the expansion from the definition each time.
    worked: >
      Suppose $\operatorname{Var}(A)=4$, $\operatorname{Var}(B)=9$,
      $\operatorname{Cov}(A,B)=2$. Then
      $\operatorname{Cov}(2A+B,\,A-3B)
      =2(1)\operatorname{Var}(A)+2(-3)\operatorname{Cov}(A,B)
      +1(1)\operatorname{Cov}(B,A)+1(-3)\operatorname{Var}(B)
      =2(4)-6(2)+2-3(9)=8-12+2-27=-29$. Adding constants anywhere in
      either combination — say $2A+B+5$ — changes nothing about this
      answer, since bilinearity already discards them.
    interview: >
      "What's the covariance of these two portfolios" wants the
      coefficient-grid expansion stated explicitly, not an attempt to
      simulate or reason about it qualitatively. Naming that added
      constants drop out immediately, before computing anything, is a
      quick fluency signal.
    pitfalls: >
      Dropping the cross terms $a_ib_j\operatorname{Cov}(X_i,Y_j)$ for
      $i\ne j$ and treating covariance as if it distributed like a plain
      sum of individual variances is the most common slip. Forgetting the
      sign on a negative coefficient — treating $\operatorname{Cov}(A,-3B)$
      as $+3\operatorname{Cov}(A,B)$ — silently flips the answer.
    recap: >
      Covariance expands bilinearly over linear combinations and ignores
      added constants entirely, turning any combination's covariance into
      a weighted sum over a coefficient grid.
    dialogue:
      - part: Fees and units
        teach: >
          Two stocks' daily moves $X$ and $Y$ have $\operatorname{Var}(X) = 4$,
          $\operatorname{Var}(Y) = 2$ and $\operatorname{Cov}(X,Y) = 1.5$. The
          risk system reports positions with fixed fees added and in assorted
          units, and you are asked for covariances of the reported numbers.
      - ask: >
          The first position is reported as $X + 10$. What is
          $\operatorname{Cov}(X + 10, Y)$?
        expects: "1.5"
        hint: >
          Go back to the definition: what does adding $10$ do to
          $X - \mathbb{E}[X]$?
        feedback: >
          $1.5$, unchanged. $X + 10$ has mean $\mathbb{E}[X] + 10$, so its
          centred version is still $X - \mathbb{E}[X]$. The fee never reaches
          the covariance. If you answered $11.5$, you added the constant to a
          quantity that only ever sees deviations.
      - ask: >
          It is reported instead in units three times smaller, as $3X$. What
          is $\operatorname{Cov}(3X, Y)$?
        expects: "4.5"
        feedback: >
          The centred version of $3X$ is $3(X - \mathbb{E}[X])$, so every
          centred product triples: $3 \times 1.5 = 4.5$.
      - reflect: >
          Why did the $10$ vanish while the $3$ came straight out front? Answer
          in terms of what each does to the centred variable
          $X - \mathbb{E}[X]$.
        answer: >
          A shift moves $X$ and its mean by the same amount, so the centred
          variable is untouched and the shift disappears. A scale multiplies
          the centred variable, and linearity of expectation pulls that factor
          out of the average product. Constants that add vanish; constants that
          multiply come out front. Because the same holds in each argument,
          covariance expands over sums like a product does.

      - part: Expand, then collect
        teach: >
          Covariance is bilinear and ignores shifts:
          $\operatorname{Cov}(aX + b,\, cY + d) = ac\operatorname{Cov}(X,Y)$,
          and in general
          $\operatorname{Cov}\left(\sum_i a_i X_i,\, \sum_j b_j Y_j\right) = \sum_i \sum_j a_i b_j \operatorname{Cov}(X_i, Y_j)$.
          No independence is assumed anywhere — it is linearity of expectation
          applied to centred variables.
      - ask: >
          What is $\operatorname{Cov}(X + Y,\ Y)$?
        expects: "3.5"
        feedback: >
          $\operatorname{Cov}(X, Y) + \operatorname{Cov}(Y, Y) = 1.5 + 2 = 3.5$.
          The term $\operatorname{Cov}(Y,Y)$ is just $\operatorname{Var}(Y)$.
      - ask: >
          What is $\operatorname{Cov}(X + 2Y,\ 3X - Y)$?
        expects: "15.5"
        hint: >
          Lay out a $2 \times 2$ grid: each term on the left against each term
          on the right.
        feedback: >
          $X$ against $3X$: $3 \times 4 = 12$. $X$ against $-Y$: $-1.5$. $2Y$
          against $3X$: $6 \times 1.5 = 9$. $2Y$ against $-Y$:
          $-2 \times 2 = -4$. Total $12 - 1.5 + 9 - 4 = 15.5$.
      - ask: >
          What is $\operatorname{Cov}(5 - X,\ Y)$?
        expects: "-1.5"
        feedback: >
          Here $a = -1$ and the $5$ drops out: $-1 \times 1.5 = -1.5$. A
          negative coefficient flips the sign; dropping it is the commonest
          slip in these expansions.

      - part: Two cases worth knowing
        ask: >
          What is $\operatorname{Cov}(X + Y,\ X - Y)$?
        expects: "2"
        feedback: >
          The grid gives
          $\operatorname{Var}(X) - \operatorname{Cov}(X,Y) + \operatorname{Cov}(Y,X) - \operatorname{Var}(Y)$,
          and the two cross terms cancel: $4 - 2 = 2$. With equal variances
          the sum and the difference would be uncorrelated, whatever the
          covariance.
      - ask: >
          You hold one unit of $X$ and want to short $h$ units of $Y$ so that
          the position $X - hY$ has zero covariance with $Y$. What is $h$?
        expects: "0.75"
        hint: >
          Expand $\operatorname{Cov}(X - hY,\ Y)$ and set it to $0$.
        feedback: >
          $\operatorname{Cov}(X - hY, Y) = 1.5 - 2h = 0$ gives
          $h = 1.5/2 = 0.75$. In general $h = \operatorname{Cov}(X,Y)/\operatorname{Var}(Y)$:
          the hedge ratio falls out of one line of bilinearity.

      - part: Where the expansion stops
        ask: >
          Can $\operatorname{Cov}(X^{2}, Y)$ be computed from
          $\operatorname{Var}(X) = 4$, $\operatorname{Var}(Y) = 2$ and
          $\operatorname{Cov}(X,Y) = 1.5$?
        choices:
          - text: >
              Yes: it is $\operatorname{Cov}(X,Y)^{2}$, by bilinearity.
            feedback: >
              Bilinearity handles sums and constant multiples, not products of
              a variable with itself. $X^{2}$ is not a linear combination of
              $X$.
          - text: >
              No: $X^{2}$ is not a linear combination of $X$, so the expansion
              has nothing to grip.
            correct: true
            feedback: >
              $\operatorname{Cov}(X^{2}, Y) = \mathbb{E}[X^{2}Y] - \mathbb{E}[X^{2}]\mathbb{E}[Y]$
              involves a third-order moment of the joint law, which these
              three second-order numbers do not contain.
          - text: >
              Yes: it is $2\operatorname{Cov}(X,Y)$, since squaring doubles.
            feedback: >
              Squaring does not double anything here. That rule mixes up
              $X^{2}$ with $2X$.
        feedback: >
          Bilinearity is about linear combinations. The moment a nonlinear
          function appears, you are back to computing from the joint law.

  - node: quant-probability.joint.independence-zero-covariance
    hook: >
      This is the direction of the implication interviewers actually rely
      on day to day — independent legs of a trade have zero covariance by
      construction, which is what makes risk calculations on independent
      pieces so clean.
    explanation: >
      When $X,Y$ are independent, the joint density or pmf factors, so the
      double sum or integral defining $\mathbb{E}[XY]$ separates into a
      product of two single-variable integrals:
      $\mathbb{E}[XY]=\mathbb{E}[X]\mathbb{E}[Y]$. Subtracting this from
      itself in the covariance formula leaves
      $\operatorname{Cov}(X,Y)=0$ immediately — no cancellation to check,
      the factorization does all the work.

      The same argument runs for any functions of the two variables:
      $\mathbb{E}[g(X)h(Y)]=\mathbb{E}[g(X)]\mathbb{E}[h(Y)]$ whenever both
      sides are finite, since independence of $X,Y$ passes through to
      independence of $g(X),h(Y)$. This is the fact that makes computing
      moments of transformed independent variables painless.

      The implication runs one direction only, and treating it as
      reversible is the single most common conceptual error in this
      subbranch: zero covariance rules out a linear relationship between
      $X$ and $Y$, but says nothing whatsoever about nonlinear dependence,
      which can be total.
    worked: >
      Let $X\sim\text{Bernoulli}(0.3)$ and $Y\sim\text{Bernoulli}(0.6)$ be
      independent. Then $XY=1$ exactly when both are $1$, so
      $\mathbb{E}[XY]=\Pr(X=1,Y=1)=\Pr(X=1)\Pr(Y=1)=(0.3)(0.6)=0.18$ by
      independence. Since $\mathbb{E}[X]\mathbb{E}[Y]=(0.3)(0.6)=0.18$
      too, $\operatorname{Cov}(X,Y)=0.18-0.18=0$, exactly as the general
      argument predicts.
    interview: >
      "If two trades are independent, what's their covariance?" wants an
      immediate "zero," with the factorization reason stated in one
      sentence — not a computation from scratch. The sharper follow-up
      flips the question: "if covariance is zero, are they independent?"
      and the correct answer is no.
    pitfalls: >
      Concluding independence from an observed covariance of zero reverses
      an implication that only runs one way. Applying the factorization
      shortcut $\mathbb{E}[XY]=\mathbb{E}[X]\mathbb{E}[Y]$ to variables you
      haven't actually verified are independent quietly assumes the
      conclusion.
    recap: >
      Independence forces $\mathbb{E}[XY]=\mathbb{E}[X]\mathbb{E}[Y]$ and
      hence zero covariance, but the converse fails — zero covariance
      only rules out linear association.
    dialogue:
      - part: A die and a coin
        teach: >
          Roll a fair die and, separately, flip a fair coin. Let $X$ be the
          face and $Y = 1$ for heads, $0$ for tails, so the $12$ outcomes are
          equally likely.
      - ask: >
          What is $\mathbb{E}[XY]$?
        expects: "1.75"
        hint: >
          $XY$ is the face on heads and $0$ on tails.
        feedback: >
          The six heads outcomes contribute $1 + 2 + \cdots + 6 = 21$, each with
          probability $1/12$: $21/12 = 1.75$. That is exactly
          $\mathbb{E}[X]\mathbb{E}[Y] = 3.5 \times 0.5$, so
          $\operatorname{Cov}(X,Y) = 0$.
      - reflect: >
          $\mathbb{E}[XY]$ came out equal to $\mathbb{E}[X]\mathbb{E}[Y]$. Write
          $\mathbb{E}[XY]$ as a double sum over the values $x$ and $y$, and say
          what the die-and-coin setup let you do to that sum.
        answer: >
          $\mathbb{E}[XY] = \sum_x \sum_y x\,y\,p(x,y)$. Independence makes
          $p(x,y) = p_X(x)\,p_Y(y)$, and then the double sum separates:
          $\sum_x x\,p_X(x) \cdot \sum_y y\,p_Y(y) = \mathbb{E}[X]\mathbb{E}[Y]$.
          Nothing about dice or coins was used — only the factored joint. The
          same split works with $g(x)$ and $h(y)$ in place of $x$ and $y$.

      - part: Factored joint, factored expectation
        teach: >
          If $X$ and $Y$ are independent with finite means, then
          $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$, and more generally
          $\mathbb{E}[g(X)h(Y)] = \mathbb{E}[g(X)]\,\mathbb{E}[h(Y)]$ when both
          sides are finite: the double sum or integral separates. Subtracting
          gives $\operatorname{Cov}(X,Y) = 0$. Independent variables are
          uncorrelated.
      - ask: >
          Same die and coin. What is $\mathbb{E}[X^{2} \cdot 2^{Y}]$?
        expects: "91/4"
        hint: >
          Split it into an expectation over the die and one over the coin.
        feedback: >
          $\mathbb{E}[X^{2}] = 91/6$ and $\mathbb{E}[2^{Y}] = (1 + 2)/2 = 3/2$,
          so the product is $91/4 = 22.75$. Twelve outcomes collapsed into two
          one-variable averages.

      - part: Take independence away
        ask: >
          Keep the die, but now let $Y = 1$ when the face is at least $4$ and
          $0$ otherwise. $Y$ is still $1$ with probability $1/2$. What is
          $\operatorname{Cov}(X,Y)$?
        expects: "0.75"
        feedback: >
          $\mathbb{E}[XY] = (4 + 5 + 6)/6 = 2.5$, against
          $\mathbb{E}[X]\mathbb{E}[Y] = 1.75$, so the covariance is $0.75$. Same
          marginals as the coin, different joint.
      - ask: >
          Which step of the separation argument fails for this $Y$?
        choices:
          - text: >
              Linearity of expectation, because $Y$ now depends on $X$.
            feedback: >
              Linearity never needs independence. The step that breaks is
              earlier and more specific.
          - text: >
              The means: $\mathbb{E}[Y]$ is no longer $1/2$.
            feedback: >
              $\mathbb{E}[Y] = 3/6 = 1/2$ still. The marginals are exactly the
              same as with the coin.
          - text: >
              The factoring: $p(x,y)$ is no longer $p_X(x)\,p_Y(y)$, so the
              double sum does not split.
            correct: true
            feedback: >
              $p(6, 1) = 1/6$, while $p_X(6)p_Y(1) = 1/12$. The joint puts its
              mass where large faces meet $Y = 1$, and the sum stays tangled.
        feedback: >
          The whole proof is one step — a factored joint makes a factored sum —
          so when the joint stops factoring, the conclusion has no support.

      - part: The converse fails
        ask: >
          Now $(X,Y)$ is uniform on the four points $(1,0)$, $(-1,0)$, $(0,1)$
          and $(0,-1)$. What is $\operatorname{Cov}(X,Y)$?
        expects: "0"
        feedback: >
          At every point one coordinate is $0$, so $XY = 0$ always; and both
          means are $0$ by symmetry. The covariance is $0$.
      - ask: >
          What is $\Pr(X = 0, Y = 0)$?
        expects: "0"
        feedback: >
          The origin is not one of the four points. But $\Pr(X = 0) = 1/2$ and
          $\Pr(Y = 0) = 1/2$, so independence would require $1/4$. Learning
          $X = 1$ tells you $Y = 0$ for certain: dependent, with covariance
          exactly $0$.
      - ask: >
          Which statement holds for every pair with finite variances?
        choices:
          - text: >
              $\operatorname{Cov}(X,Y) = 0$ if and only if $X$ and $Y$ are
              independent.
            feedback: >
              The four-point pair has zero covariance and is dependent, so the
              "if" direction is false.
          - text: >
              $\operatorname{Cov}(X,Y) = 0$ implies independence, but not the
              other way round.
            feedback: >
              Backwards. The die and coin show independence giving zero
              covariance; the four points show zero covariance without
              independence.
          - text: >
              Independence implies $\operatorname{Cov}(X,Y) = 0$, and the
              converse fails.
            correct: true
            feedback: >
              Zero covariance only says no linear association is left. The
              four points have plenty of association; none of it is linear.
        feedback: >
          In an interview: "independent trades have zero covariance, because
          the expectation of the product factors". When the follow-up asks
          whether zero covariance means independence, the answer is no, with a
          counterexample ready.

  - node: quant-probability.joint.correlation
    hook: >
      $\rho$ is the number that actually gets quoted on a desk, precisely
      because covariance's raw value depends on units nobody can compare
      across problems — knowing where the $[-1,1]$ bound comes from is
      what lets you sanity-check any reported correlation on sight.
    explanation: >
      Dividing by $\sigma_X\sigma_Y$ turns covariance into a dimensionless
      number: rescaling $X\to aX$ multiplies both the numerator's
      covariance and the denominator's $\sigma_X$ by $|a|$ (or by $a$
      itself in the covariance, with a matching sign), so the ratio is
      unaffected by the units either variable happens to be measured in.

      The bound $-1\le\rho\le1$ is Cauchy–Schwarz applied to the two
      centered variables $X-\mu_X$ and $Y-\mu_Y$: their inner product is
      bounded by the product of their norms, and dividing through by
      exactly those norms is what correlation already does. Equality
      $|\rho|=1$ happens exactly when one centered variable is a scalar
      multiple of the other — an exact line, $Y=aX+b$ with probability
      $1$ — and the sign of $\rho$ then matches the sign of $a$.

      Because it is unit-free, $\rho$ is the number that transfers across
      problems: a correlation of $0.4$ means the same thing whether $X,Y$
      are measured in ticks, dollars, or basis points, which is exactly
      what makes it comparable and quotable in a way covariance never is.
    worked: >
      Continuing the die example: with $Y$ the first die and
      $X=Y+D_2$ the total, $\operatorname{Cov}(X,Y)=35/12$ from before.
      Since the two dice are independent, $\operatorname{Var}(X)
      =\operatorname{Var}(Y)+\operatorname{Var}(D_2)=35/12+35/12=35/6$,
      while $\operatorname{Var}(Y)=35/12$. So
      $\rho=\dfrac{35/12}{\sqrt{(35/12)(35/6)}}
      =\dfrac{35/12}{35/\sqrt{72}}=\dfrac{\sqrt{72}}{12}
      =\dfrac{6\sqrt2}{12}=\dfrac{\sqrt2}{2}\approx0.707$ — a single die
      correlates with the total of two dice at exactly $1/\sqrt2$,
      regardless of how many sides the dice have.
    interview: >
      "What's the correlation between one component and the sum it
      belongs to?" is a classic setup for testing whether you can compute
      $\rho$ cleanly using variance-of-a-sum, rather than trying to eyeball
      the answer. Stating the bound $[-1,1]$ and what equality means is
      the expected framing before any number appears.
    pitfalls: >
      Reporting a computed $\rho$ outside $[-1,1]$ and not treating it as
      an automatic sign of an arithmetic error skips the cheapest sanity
      check available. Assuming $|\rho|=1$ requires the two variables to
      be literally equal, rather than related by any exact affine map
      $Y=aX+b$, misses that shifts and negative slopes are allowed too.
    recap: >
      Correlation is covariance rescaled to $[-1,1]$ by the two standard
      deviations, hitting an endpoint exactly under an exact linear
      relation — a single die correlates with the sum of two dice at
      $1/\sqrt2$.
    dialogue:
      - part: Two desks, two covariances
        teach: >
          Two desks report how tightly their pairs move. The FX desk: the
          covariance of daily EUR and GBP moves, measured in pips, is $120$.
          The equity desk: the covariance of two stocks' daily moves, in
          dollars, is $0.8$.
      - ask: >
          Which pair is more tightly linked?
        choices:
          - text: >
              The FX pair: $120$ is far bigger than $0.8$.
            feedback: >
              $120$ is in pips squared and $0.8$ in dollars squared. Quote the
              FX moves in hundredths of a pip and the $120$ becomes $1.2$ million,
              with nothing about the currencies changed.
          - text: >
              The equity pair: $0.8$ is closer to $1$.
            feedback: >
              Covariance has no reason to stay near $1$; it carries whatever
              units the variables do. Closeness to $1$ means nothing yet.
          - text: >
              Neither number can be compared with the other as it stands.
            correct: true
            feedback: >
              Each covariance is in its own units, and rescaling either
              variable rescales its covariance. Something has to strip the
              units out first.
        feedback: >
          A covariance carries the units of $X$ times those of $Y$. To compare
          across desks you need a version with no units at all.
      - ask: >
          The FX desk adds that the standard deviations are $20$ pips for EUR
          and $10$ pips for GBP. Measure each move in units of its own standard
          deviation, $X/20$ and $Y/10$. What is the covariance now?
        expects: "0.6"
        feedback: >
          Bilinearity: $\operatorname{Cov}(X/20,\, Y/10) = 120/200 = 0.6$.
      - ask: >
          The equity desk's standard deviations are $2$ dollars and $0.5$
          dollars. Do the same. What is the covariance of the standardized
          moves?
        expects: "0.8"
        feedback: >
          $0.8/(2 \times 0.5) = 0.8$. On the same footing, the equity pair
          ($0.8$) is more tightly linked than the FX pair ($0.6$) — the
          opposite of what the raw numbers suggested.
      - reflect: >
          Why does dividing by both standard deviations make the answer
          comparable across desks? Say what happens to it if the FX desk
          switches from pips to hundredths of a pip.
        answer: >
          Rescaling $X$ by $a > 0$ multiplies $\operatorname{Cov}(X,Y)$ by $a$
          and $\sigma_X$ by $a$, so their ratio does not move: switching to
          hundredths of a pip multiplies the covariance and $\sigma_X$ by $100$
          each, and the standardized number stays $0.6$. What is left
          is a pure number describing how the two move together, whatever the
          units. That number is the correlation.

      - part: Correlation and its bounds
        teach: >
          For $X, Y$ with finite, nonzero variances, the correlation is
          $\rho_{XY} = \operatorname{Cov}(X,Y)/(\sigma_X \sigma_Y)$. It is
          dimensionless, it always lies in $[-1, 1]$, and
          $|\rho_{XY}| = 1$ exactly when $Y = aX + b$ with probability $1$,
          with $\rho$ taking the sign of $a$.
      - ask: >
          What guarantees $|\operatorname{Cov}(X,Y)| \le \sigma_X \sigma_Y$, and
          so $|\rho| \le 1$?
        choices:
          - text: >
              Cauchy–Schwarz applied to the centred variables $U = X - \mu_X$
              and $V = Y - \mu_Y$: $\mathbb{E}[UV]^{2} \le \mathbb{E}[U^{2}]\,\mathbb{E}[V^{2}]$.
            correct: true
            feedback: >
              $\mathbb{E}[UV]$ is the covariance and
              $\mathbb{E}[U^{2}]\,\mathbb{E}[V^{2}]$ is $\sigma_X^{2}\sigma_Y^{2}$.
              Equality in Cauchy–Schwarz needs $V$ to be a multiple of $U$ —
              which is the exact-line case.
          - text: >
              Variances are nonnegative.
            feedback: >
              True, but it bounds each variance separately and says nothing
              about how large their covariance can be.
          - text: >
              Covariance is symmetric in $X$ and $Y$.
            feedback: >
              Symmetry says $\operatorname{Cov}(X,Y) = \operatorname{Cov}(Y,X)$;
              it puts no bound on the size.
        feedback: >
          The bound is Cauchy–Schwarz on the centred variables; the endpoints
          are its equality case, an exact linear relation.
      - ask: >
          $Y = 7 - 3X$ exactly, and $\operatorname{Var}(X) = 4$. What is
          $\operatorname{Corr}(X, Y)$?
        expects: "-1"
        feedback: >
          $\operatorname{Cov}(X, 7 - 3X) = -3 \times 4 = -12$ and
          $\sigma_Y = 3 \times 2 = 6$, so $\rho = -12/(2 \times 6) = -1$. An
          exact line with negative slope sits at the endpoint $-1$, whatever
          the slope's size.
      - ask: >
          Back on the FX desk, $\rho = 0.6$. What is
          $\operatorname{Corr}(-2X + 5,\ Y)$?
        expects: "-0.6"
        feedback: >
          The $5$ drops out. The factor $-2$ multiplies the covariance by $-2$
          and the standard deviation by $|-2| = 2$, so only its sign survives:
          $-0.6$. In general
          $\operatorname{Corr}(aX + b,\, cY + d) = \operatorname{sgn}(ac)\,\rho_{XY}$.
          Short twice as much EUR and the link to GBP is just as tight,
          pointed the other way.

      - part: Numbers that cannot be correlations
        ask: >
          A junior computes $\operatorname{Cov}(X,Y) = 13$ from data with
          $\operatorname{Var}(X) = 4$ and $\operatorname{Var}(Y) = 25$, and
          reports $\rho = 1.3$. What do you conclude?
        choices:
          - text: >
              The relation is unusually strong — stronger than a straight line.
            feedback: >
              Nothing is stronger than an exact line, which is $|\rho| = 1$.
              Cauchy–Schwarz rules $1.3$ out for every possible joint law.
          - text: >
              Something upstream is wrong: $|\operatorname{Cov}|$ cannot exceed
              $\sigma_X\sigma_Y = 10$.
            correct: true
            feedback: >
              The covariance, or one of the variances, was computed wrongly —
              a dropped term or a mismatched sample, say. Any $|\rho| > 1$ is
              an arithmetic error, never a finding.
          - text: >
              $\rho > 1$ means $Y$ moves more than $X$ does.
            feedback: >
              Relative size of moves is $\sigma_Y/\sigma_X$, which correlation
              divides out. It cannot push $\rho$ past $1$.
        feedback: >
          The bound is the cheapest sanity check available: a computed
          correlation outside $[-1, 1]$ means recompute.
      - ask: >
          $Y$ is the constant $3$. What is $\operatorname{Corr}(X, Y)$?
        choices:
          - text: >
              $0$, since the covariance is $0$.
            feedback: >
              The covariance is $0$, but so is $\sigma_Y$, and $0/0$ is not
              $0$.
          - text: >
              Undefined: $\sigma_Y = 0$.
            correct: true
            feedback: >
              The definition asks for nonzero variances. With a constant there
              is nothing to standardize by, and no correlation to speak of.
          - text: >
              $1$, since $Y = 0 \cdot X + 3$ is an exact line.
            feedback: >
              A line with slope $0$ is not the exact-line case — the
              endpoint statement needs $a \ne 0$ — and the ratio is $0/0$.
        feedback: >
          Correlation exists only when both variances are positive. That is the
          one clause a constant fails.

  - node: quant-probability.joint.correlation-linear-only
    hook: >
      Quoting $\rho=0.3$ as "moderately correlated" without squaring it
      first is the most common way candidates overstate a correlation's
      actual strength — the interviewer is listening for whether you catch
      that yourself.
    explanation: >
      $\rho$ answers exactly one question: how tightly does the joint
      cloud of points hug a straight line. It has no opinion on curved
      relationships at all, so a correlation of exactly $0$ is entirely
      consistent with one variable being a deterministic, nonlinear
      function of the other — the linear-fit machinery simply can't see
      that kind of structure.

      Reading magnitude honestly means squaring: $\rho^{2}$ is the
      fraction of $Y$'s variance a linear fit in $X$ removes, so a
      correlation that sounds respectable in isolation often removes
      surprisingly little variance — $\rho=0.3$ accounts for only $9\%$,
      not $30\%$, of what's actually going on.

      That said, a small $\rho$ is not automatically worthless in trading:
      a modest edge applied across many independent bets compounds, so the
      threshold for "useful" correlation in a repeated-bet setting is far
      below what "useful" would mean for a single one-shot prediction.
    worked: >
      Continuing the die-and-sum example: $\rho=\sqrt2/2$ between a single
      die and the total of two dice gives $\rho^{2}=1/2$ — a linear fit
      using the total explains exactly half the variance in either
      individual die. Contrast a trading signal with $\rho=0.15$ against
      next-period returns: $\rho^{2}=0.0225$, so it explains barely over
      $2\%$ of the variance, yet a signal that small, applied consistently
      across thousands of independent bets, can still be the entire basis
      of a profitable strategy.
    interview: >
      "Is a correlation of $0.4$ strong?" should be answered by squaring
      it on the spot — $16\%$ of variance explained — rather than reacting
      to the raw number. A sharper follow-up asks for a scenario where
      $\rho=0$ but the variables are completely dependent.
    pitfalls: >
      Treating $\rho=0$ as proof of "no relationship" instead of "no
      linear relationship" misses curved dependence entirely. Comparing
      raw $\rho$ values across contexts (a $0.05$ trading signal versus a
      $0.05$ physical measurement correlation) without asking how many
      independent repetitions are involved conflates two very different
      notions of "small."
    recap: >
      $\rho$ measures linear co-movement only, and $\rho^{2}$ is the
      honest read of its strength — a small $\rho$ repeated over many
      independent bets can still be worth a great deal.
    dialogue:
      - part: A signal at one half
        teach: >
          A researcher's signal $X$ and next-day returns $Y$ are both scaled to
          variance $1$, and the returns are built as $Y = 0.5X + N$, where the
          noise $N$ is independent of $X$. The best straight-line forecast of
          $Y$ from $X$ is therefore $0.5X$.
      - ask: >
          What is $\operatorname{Corr}(X, Y)$?
        expects: "0.5"
        feedback: >
          $\operatorname{Cov}(X, 0.5X + N) = 0.5\operatorname{Var}(X) + 0 = 0.5$,
          and both standard deviations are $1$, so $\rho = 0.5$.
      - ask: >
          Predict before computing: what fraction of the variance of $Y$ does
          the forecast $0.5X$ account for?
        choices:
          - text: >
              About $71\%$: correlation is a square root of something.
            feedback: >
              The square root runs the other way. $0.71$ would be the
              correlation needed to explain half the variance.
          - text: >
              Half, since $\rho = 0.5$.
            feedback: >
              That reads $\rho$ as a share of variance. Correlation is a ratio
              of standard deviations; variance is the square of one.
          - text: >
              A quarter.
            correct: true
            feedback: >
              $\operatorname{Var}(0.5X) = 0.25$, out of $\operatorname{Var}(Y) = 1$.
              The remaining $0.75$ is the noise.
        feedback: >
          A correlation of one half leaves three quarters of the variance
          unexplained.
      - reflect: >
          Why does the explained share come out as $\rho^{2}$ and not $\rho$?
          Say it in terms of what variance does to a scale factor.
        answer: >
          The forecast is $\rho X$ in standardized units, and variance is
          quadratic in scale: $\operatorname{Var}(\rho X) = \rho^{2}$.
          Correlation lives at the level of standard deviations, explained
          variance at the level of variances, so moving between them squares.
          That is why mid-range correlations sound stronger than they are.

      - part: What correlation measures, and what its square says
        teach: >
          $\rho$ measures one thing: how close the joint cloud sits to a
          straight line. $\rho^{2}$ is the fraction of $Y$'s variance the best
          linear fit in $X$ removes. It is blind to curved dependence, and it
          says nothing about which variable drives the other.
      - ask: >
          A factor has correlation $-0.6$ with a fund's returns. What fraction
          of the fund's return variance does a linear fit on the factor remove?
        expects: "0.36"
        feedback: >
          $(-0.6)^{2} = 0.36$. The sign says which way the line slopes; the
          share explained depends only on $\rho^{2}$, here $36\%$.

      - part: A perfect relation with zero correlation
        ask: >
          A trader's straddle pays $Y = |X|$, where the underlying's move $X$
          is $-2, -1, 0, 1$ or $2$ ticks, each with probability $1/5$. Predict
          $\operatorname{Corr}(X, Y)$.
        choices:
          - text: >
              Near $1$: $Y$ is completely determined by $X$.
            feedback: >
              Determined, yes, but not along a line. On the left $Y$ falls as
              $X$ rises, on the right it rises, and correlation averages the
              two slopes.
          - text: >
              Exactly $0$.
            correct: true
            feedback: >
              The V-shape is symmetric: whatever the right arm contributes to
              the covariance, the left arm cancels.
          - text: >
              Negative, because half the moves are losses.
            feedback: >
              The losing moves pair with the same payoffs as the winning ones,
              so they pull with equal force in opposite directions.
        feedback: >
          The best straight line through a symmetric V is flat.
      - ask: >
          Confirm it: what is $\operatorname{Cov}(X, |X|)$?
        expects: "0"
        feedback: >
          $\mathbb{E}[X] = 0$ and
          $\mathbb{E}[X|X|] = (-4 - 1 + 0 + 1 + 4)/5 = 0$, so the covariance is
          $0$. Yet knowing $X$ tells you $Y$ exactly. Zero correlation means
          no linear relation, not no relation.
      - ask: >
          Across stocks, daily trading volume and daily volatility have
          $\rho = 0.8$. What does that number establish?
        choices:
          - text: >
              That heavy volume causes volatility.
            feedback: >
              Correlation is symmetric in the two variables, so it cannot point
              an arrow. News could drive both at once.
          - text: >
              That $80\%$ of volatility's variance is explained by volume.
            feedback: >
              Square it: a linear fit removes $64\%$, not $80\%$.
          - text: >
              That the two sit close to a rising line, with a linear fit
              removing $64\%$ of the variance.
            correct: true
            feedback: >
              That is all $\rho = 0.8$ says. Direction of causation and curved
              structure are separate questions it does not answer.
        feedback: >
          Read $\rho$ as closeness to a line, square it for strength, and ask
          about causes separately.

      - part: Small, but repeated
        ask: >
          Signal A has $\rho = 0.04$ with next-period returns and can be traded
          on $5000$ independent bets a year. Signal B has $\rho = 0.3$ and is
          traded once a year. Which is likely worth more?
        choices:
          - text: >
              B: it explains $9\%$ of the variance, against A's $0.16\%$.
            feedback: >
              Per bet, yes. But a year of A is $5000$ small edges whose gains
              add, while the noise of independent bets partly cancels. One bet
              on B, however good, is still one roll of the dice.
          - text: >
              A: a small edge repeated across many independent bets adds up.
            correct: true
            feedback: >
              Expected profit grows with the number of bets, and noise grows
              more slowly when the bets are independent. That is how desks make
              money on correlations that would look worthless in a single
              forecast.
          - text: >
              Neither: correlations below $0.5$ are noise.
            feedback: >
              There is no threshold where correlation stops counting. What
              matters is the edge per bet and how many independent times you
              get to apply it.
        feedback: >
          $\rho^{2}$ is the honest read of one forecast. Whether a small $\rho$
          is valuable depends on how often you get to use it.

  - node: quant-probability.joint.uncorrelated-not-independent
    hook: >
      This is the example every interviewer keeps in their back pocket to
      test whether "uncorrelated" and "independent" have actually been
      kept separate in your head, or just live as synonyms.
    explanation: >
      Zero covariance only forbids one specific kind of structure — a
      linear one. Nothing stops a variable from being fully, deterministically
      determined by another through a symmetric, nonlinear function while
      the linear signal that covariance measures happens to cancel out
      exactly.

      The mechanism is always the same shape: pick $X$ symmetric about its
      mean and let $Y$ be an even function of $X$, like $X^{2}$. Every
      positive deviation of $X$ from its mean is matched by an equally
      likely negative deviation producing the identical $Y$, so the
      covariance's defining sum cancels term by term even though $Y$'s
      exact value is fully pinned down by $X$.

      The fastest way to spot this trap in a stated problem is to check
      for an even function of a symmetric variable — squares, absolute
      values, anything invariant under $X\to-X$ — since that symmetry is
      precisely what forces the linear signal to vanish while leaving all
      the real dependence intact.
    worked: >
      Let $X$ be uniform on $\{-1,0,1\}$ and $Y=X^{2}$, so $Y=0$ when
      $X=0$ and $Y=1$ otherwise. Then $\mathbb{E}[X]=0$ and
      $\mathbb{E}[XY]=\mathbb{E}[X^{3}]
      =\frac{(-1)^{3}+0^{3}+1^{3}}{3}=0$, so
      $\operatorname{Cov}(X,Y)=0$. Yet $Y$ is completely determined by
      $X$: unconditionally $\Pr(Y=1)=2/3$, but given $X=0$,
      $\Pr(Y=1\mid X=0)=0$ exactly — the dependence is total, the
      correlation is exactly zero.
    interview: >
      "Give an example where $\operatorname{Corr}(X,Y)=0$ but $X,Y$ are
      dependent" is asked almost verbatim. The fastest correct response
      names any even function of a symmetric variable and states why the
      odd-moment cancellation happens, rather than reaching for a formula.
    pitfalls: >
      Assuming this only works for continuous, symmetric-interval
      variables like a uniform on $[-1,1]$ misses that any symmetric
      distribution with a finite third moment produces the same
      cancellation. Confusing "zero correlation, total dependence" with
      "zero correlation, some dependence" understates how extreme the gap
      between the two concepts can be.
    recap: >
      A symmetric variable and its square have correlation exactly zero
      while one completely determines the other — zero correlation rules
      out linear structure and nothing else.
    dialogue:
      - part: A move and its square
        teach: >
          A stock's move $X$, in ticks, is $-2, -1, 0, 1, 2$ with probabilities
          $0.1, 0.2, 0.4, 0.2, 0.1$. A risk system tracks $Y = X^{2}$, the
          squared move. Clearly $X$ determines $Y$. The interviewer asks for
          their correlation.
      - ask: >
          $\mathbb{E}[X] = 0$ by symmetry, so
          $\operatorname{Cov}(X, Y) = \mathbb{E}[XY] = \mathbb{E}[X^{3}]$. What
          is it?
        expects: "0"
        feedback: >
          $(-8)(0.1) + (-1)(0.2) + 0 + (1)(0.2) + (8)(0.1) = 0$. The covariance,
          and so the correlation, is exactly $0$.
      - ask: >
          What is $\Pr(Y = 4)$?
        expects: "0.2"
        feedback: >
          $Y = 4$ when $X = \pm 2$: $0.1 + 0.1 = 0.2$.
      - ask: >
          What is $\Pr(Y = 4 \mid X = 0)$?
        expects: "0"
        feedback: >
          $X = 0$ forces $Y = 0$. Learning $X$ moved the probability of $Y = 4$
          from $0.2$ to $0$ — and given $X = 2$ it moves to $1$.
      - ask: >
          So which describes $X$ and $Y$?
        choices:
          - text: >
              Independent, since they are uncorrelated.
            feedback: >
              Independence would leave $\Pr(Y = 4 \mid X = 0)$ at $0.2$. It
              went to $0$.
          - text: >
              Dependent, so they must be correlated after all.
            feedback: >
              The covariance is exactly $0$ — you computed it. Dependence does
              not force correlation.
          - text: >
              Uncorrelated, yet as dependent as two variables can be.
            correct: true
            feedback: >
              $Y$ is a function of $X$, and their correlation is $0$. Both
              facts hold at once.
        feedback: >
          Zero correlation and total dependence sit side by side in one pair.

      - part: Where the zero comes from
        reflect: >
          The cancellation in $\mathbb{E}[X^{3}]$ came from somewhere. Which
          two features of the setup produced it, and which outcomes cancel
          against which?
        answer: >
          $X$ is symmetric about $0$, so $x$ and $-x$ are equally likely; and
          $Y$ is an even function of $X$, so $x$ and $-x$ give the same $Y$.
          Their contributions $x \cdot y$ and $(-x) \cdot y$ to
          $\mathbb{E}[XY]$ cancel in pairs. The dependence is real; it is just
          not linear, and covariance only sees the linear part.
      - teach: >
          Any $X$ symmetric about $0$ with a finite third moment, paired with
          $Y = X^{2}$, has $\operatorname{Cov}(X, Y) = \mathbb{E}[X^{3}] = 0$
          while $X$ determines $Y$ completely. Any even function of $X$ works
          the same way. Zero correlation rules out linear structure and nothing
          else.

      - part: Break one ingredient at a time
        ask: >
          Drop the symmetry: $X$ uniform on $\{0, 1, 2\}$, still $Y = X^{2}$.
          What is $\operatorname{Cov}(X, Y)$?
        expects: "4/3"
        feedback: >
          $\mathbb{E}[X] = 1$, $\mathbb{E}[Y] = 5/3$ and
          $\mathbb{E}[X^{3}] = 9/3 = 3$, so the covariance is
          $3 - 5/3 = 4/3$. On $\{0, 1, 2\}$ the parabola only rises, and a
          rising curve has a positive linear trend.
      - ask: >
          Drop the evenness instead: the original symmetric $X$, with
          $Y = X^{3}$. What is $\operatorname{Cov}(X, Y)$?
        expects: "3.6"
        hint: >
          $\mathbb{E}[X] = 0$, so you need $\mathbb{E}[X \cdot X^{3}]$.
        feedback: >
          $\mathbb{E}[X^{4}] = 16(0.1) + 1(0.2) + 0 + 1(0.2) + 16(0.1) = 3.6$.
          An odd function keeps the sign of $X$, so the pairs reinforce instead
          of cancelling.
      - ask: >
          Which pair is uncorrelated even though $Y$ is a function of $X$?
        choices:
          - text: >
              $X$ standard normal, $Y = X + X^{2}$
            feedback: >
              $\operatorname{Cov}(X, X + X^{2}) = \operatorname{Var}(X) + \mathbb{E}[X^{3}] = 1$.
              The linear part survives.
          - text: >
              $X$ uniform on $[0, 2]$, $Y = X^{2}$
            feedback: >
              $\mathbb{E}[X^{3}] - \mathbb{E}[X]\mathbb{E}[X^{2}] = 2 - 4/3 = 2/3$.
              $X$ is not symmetric about $0$, and on $[0, 2]$ the square only
              rises.
          - text: >
              $X$ standard normal, $Y = \cos X$
            correct: true
            feedback: >
              $\cos$ is even and the normal is symmetric about $0$, so
              $\mathbb{E}[X\cos X] = 0$ and the covariance vanishes.
        feedback: >
          The recipe needs both pieces: a variable symmetric about $0$ and an
          even function of it.
      - teach: >
          Asked for a pair with zero correlation that is dependent, the answer
          to say aloud is one line: "$X$ symmetric about zero and $Y = X^{2}$;
          the covariance is $\mathbb{E}[X^{3}] = 0$, but $X$ determines $Y$."

  - node: quant-probability.joint.variance-sum
    hook: >
      This is where dependence stops being an abstract worry and becomes
      a concrete correction term in every portfolio-risk calculation you
      will ever run.
    explanation: >
      Expand $\operatorname{Var}(\sum_iX_i)
      =\operatorname{Cov}(\sum_iX_i,\sum_jX_j)$ using bilinearity: every
      ordered pair $(i,j)$ contributes $\operatorname{Cov}(X_i,X_j)$, the
      diagonal pairs $i=j$ give the variances since
      $\operatorname{Cov}(X_i,X_i)=\operatorname{Var}(X_i)$, and the
      off-diagonal pairs pair up as $(i,j)$ and $(j,i)$ with equal
      covariances, contributing the factor of $2$ in front of the
      $i<j$ sum.

      Unlike expectation, which is additive no matter what, variance only
      adds when the cross-terms happen to vanish — and with $n$ variables
      there are $n$ diagonal terms against $n(n-1)$ off-diagonal ones, so
      for a large collection the covariance structure, not the individual
      variances, dominates the total.

      This is exactly the object behind portfolio risk: the variance of a
      sum of positions is never just the sum of their individual risks
      unless those positions are provably uncorrelated, and the gap
      between the two is entirely the covariance cross-terms.
    worked: >
      Three assets have $\operatorname{Var}=4,9,16$ with
      $\operatorname{Cov}(1,2)=1$, $\operatorname{Cov}(1,3)=2$,
      $\operatorname{Cov}(2,3)=-1$. Then
      $\operatorname{Var}(X_1+X_2+X_3)=(4+9+16)+2(1+2-1)=29+2(2)=33$ —
      noticeably more than the $29$ you'd get by (wrongly) ignoring the
      cross-terms, even though one of the three pairwise covariances is
      negative.
    interview: >
      "What's the variance of this sum of correlated positions" always
      wants the diagonal-plus-cross-terms decomposition named explicitly.
      A common follow-up asks you to state how many cross-terms exist for
      $n$ variables, to check you're not silently dropping them.
    pitfalls: >
      Summing individual variances and stopping there, without asking
      whether the variables are actually uncorrelated, is the default
      wrong answer under time pressure. Forgetting the factor of $2$ on
      the cross-term sum (writing $\sum_{i<j}$ instead of
      $2\sum_{i<j}$) undercounts by exactly half the correction.
    recap: >
      Variance of a sum equals the sum of variances only after adding
      $2\sum_{i<j}\operatorname{Cov}(X_i,X_j)$ — with three assets and one
      negative pairwise covariance, the total still came out above the
      naive sum.
    dialogue:
      - part: Two traders, one book
        teach: >
          Two traders' daily P&L, in thousands: $X$ has standard deviation $3$
          and $Y$ has standard deviation $4$. The desk head wants the standard
          deviation of the combined P&L $X + Y$. One junior says $7$; another
          says $5$.
      - ask: >
          Who is right?
        choices:
          - text: >
              The first: standard deviations add, $3 + 4 = 7$.
            feedback: >
              That holds only if the two P&Ls move in perfect lockstep. If one
              trader's bad days fall on the other's good days, the book is far
              quieter than $7$.
          - text: >
              The second: $\sqrt{3^{2} + 4^{2}} = 5$.
            feedback: >
              That adds the variances and nothing else — right only when the
              two have zero covariance, which nobody has said.
          - text: >
              Neither can be judged yet: it depends on how $X$ and $Y$ move
              together.
            correct: true
            feedback: >
              Both answers are correct for some joint behaviour, and the two
              standard deviations alone cannot say which.
        feedback: >
          The missing input is the covariance.
      - ask: >
          Suppose $\operatorname{Cov}(X, Y) = 6$. What is
          $\operatorname{Var}(X + Y)$?
        expects: "37"
        hint: >
          Write $\operatorname{Var}(X + Y)$ as $\operatorname{Cov}(X + Y,\ X + Y)$
          and expand.
        feedback: >
          The four terms of the expansion are $\operatorname{Var}(X) = 9$,
          $\operatorname{Var}(Y) = 16$, and $\operatorname{Cov}(X,Y) = 6$ twice:
          $9 + 16 + 12 = 37$, a standard deviation of about $6.08$.
      - reflect: >
          Where did the $12$ come from, and why does it appear with a $2$ in
          front? Say what the expansion of $\operatorname{Cov}(X + Y, X + Y)$
          produces term by term.
        answer: >
          Bilinearity gives four terms: $\operatorname{Cov}(X,X)$,
          $\operatorname{Cov}(X,Y)$, $\operatorname{Cov}(Y,X)$ and
          $\operatorname{Cov}(Y,Y)$. The outer two are the variances; the
          middle two are the same covariance, once for each order. Variance is
          not additive: the cross-terms are exactly where the dependence
          between the two books enters.

      - part: The cross-terms are the dependence
        teach: >
          For finite-variance variables,
          $\operatorname{Var}\left(\sum_{i=1}^{n} X_i\right) = \sum_{i} \operatorname{Var}(X_i) + 2\sum_{i<j}\operatorname{Cov}(X_i, X_j)$,
          and with weights
          $\operatorname{Var}\left(\sum_i a_i X_i\right) = \sum_i \sum_j a_i a_j \operatorname{Cov}(X_i, X_j)$.
          For two variables,
          $\operatorname{Var}(X \pm Y) = \operatorname{Var}(X) + \operatorname{Var}(Y) \pm 2\operatorname{Cov}(X,Y)$.
      - ask: >
          What covariance would make the first junior's $7$ correct?
        expects: "12"
        feedback: >
          $9 + 16 + 2c = 49$ gives $c = 12 = 3 \times 4$, correlation $1$: the
          two P&Ls move in lockstep. The second junior's $5$ needs $c = 0$.
          Every answer from $1$ to $7$ is possible, depending on $c$.
      - ask: >
          With $\operatorname{Cov}(X, Y) = 6$ again, what is
          $\operatorname{Var}(X - Y)$?
        expects: "13"
        feedback: >
          $9 + 16 - 2(6) = 13$. The weights are $1$ and $-1$, so the cross-term
          picks up $(1)(-1) = -1$. Positive covariance makes a sum noisier and
          a difference quieter.
      - ask: >
          Three positions have variances $1$, $4$ and $9$, with
          $\operatorname{Cov}(X_1, X_2) = 1$,
          $\operatorname{Cov}(X_1, X_3) = -1$ and
          $\operatorname{Cov}(X_2, X_3) = 3$. What is
          $\operatorname{Var}(X_1 + X_2 - X_3)$?
        expects: "12"
        hint: >
          Each cross-term carries the product of its two weights.
        feedback: >
          Variances: $1 + 4 + 9 = 14$. Cross-terms:
          $2[(1)(1)(1) + (1)(-1)(-1) + (1)(-1)(3)] = 2(1 + 1 - 3) = -2$. Total
          $12$. Shorting $X_3$ turned its positive covariance with $X_2$ into a
          variance reducer.

      - part: Why covariances dominate big books
        ask: >
          A book has $20$ positions. In the double sum
          $\sum_i \sum_j a_i a_j \operatorname{Cov}(X_i, X_j)$, how many terms
          have $i \ne j$?
        expects: "380"
        feedback: >
          $20 \times 19 = 380$ off-diagonal terms against $20$ variances. With
          $n$ positions it is $n(n-1)$ against $n$, so in a large book the
          covariances, not the individual variances, set the risk.
      - ask: >
          A risk report computes
          $\operatorname{Var}(X + Y + Z) = \sum \operatorname{Var} + \sum_{i<j}\operatorname{Cov}(X_i, X_j)$.
          What has gone wrong?
        choices:
          - text: >
              Nothing: each pair is counted once, as it should be.
            feedback: >
              In the full double sum each unordered pair appears twice, as
              $(i,j)$ and $(j,i)$. Summing over $i < j$ keeps only one of them.
          - text: >
              The covariance terms should not be there for a sum.
            feedback: >
              They are there whenever the positions are correlated; dropping
              them is the opposite error.
          - text: >
              The cross-terms need a factor $2$: the report counts each pair
              once instead of twice.
            correct: true
            feedback: >
              With all covariances positive it understates the cross-term
              contribution by exactly half.
        feedback: >
          Either sum over all ordered pairs $i \ne j$, or over $i < j$ with a
          factor $2$. Mixing the two conventions halves the dependence.

  - node: quant-probability.joint.variance-independent-sum
    hook: >
      "Diversification reduces risk" quietly assumes correlation, not just
      independence of direction — this node is where that assumption
      either pays off or backfires, in exact numbers.
    explanation: >
      When every pair of variables is uncorrelated — a strictly weaker
      condition than mutual independence, since only the pairwise
      covariances need to vanish — every cross-term in the variance-of-a-sum
      formula drops out, leaving the clean additive rule
      $\operatorname{Var}(\sum_iX_i)=\sum_i\operatorname{Var}(X_i)$. For
      $n$ iid copies of variance $\sigma^{2}$ this is $n\sigma^{2}$, the
      source of the familiar $\sqrt n$ scaling of a sum's spread.

      The formula for a difference is where intuition most often goes
      wrong: uncorrelated $X,Y$ give
      $\operatorname{Var}(X-Y)=\operatorname{Var}(X)+\operatorname{Var}(Y)$,
      with a plus sign, not a minus — subtracting one noisy quantity from
      another never cancels their variances, it adds them, because the
      minus sign inside $\operatorname{Var}(-Y)$ disappears under the
      square in the definition.

      This is precisely why a "hedge" built from two uncorrelated legs
      does nothing to reduce risk and can make it worse per unit of
      exposure: a spread only gets quieter than its legs when the legs are
      genuinely positively correlated, so the covariance term the previous
      node introduced actively subtracts something.
    worked: >
      Two uncorrelated return streams each have variance $0.04$ (standard
      deviation $20\%$). Their spread has
      $\operatorname{Var}(X-Y)=0.04+0.04=0.08$, so the spread's standard
      deviation is $\sqrt{0.08}\approx0.283$, or $28.3\%$ — noisier than
      either leg on its own, even though the position nets two supposedly
      offsetting bets. Only if $\operatorname{Cov}(X,Y)$ were positive
      would the spread's variance drop below $0.08$.
    interview: >
      "If I go long one uncorrelated asset and short another, is my risk
      lower?" is testing exactly this sign trap. The correct instinct is
      to state immediately that variances add for a difference of
      uncorrelated legs, so the position is not automatically safer.
    pitfalls: >
      Assuming pairwise uncorrelated is the same hypothesis as mutually
      independent overstates what's needed — the additive variance rule
      only needs the weaker pairwise condition. Reflexively subtracting
      variances for $\operatorname{Var}(X-Y)$ instead of adding them is the
      single most common arithmetic error in this whole subbranch.
    recap: >
      Pairwise zero covariance is enough for variances to add, giving the
      $\sqrt n$ scaling for sums — but it also means an uncorrelated
      "hedge" makes a spread noisier than either leg, not quieter.
    dialogue:
      - part: A hedge that is not one
        teach: >
          You buy one stock and short another. Each has a daily standard
          deviation of $2\%$, and their daily returns are uncorrelated. A
          colleague calls the position a hedge, since the two legs point in
          opposite directions.
      - ask: >
          What is the daily standard deviation of the position $X - Y$, in
          percent?
        expects: "2.828"
        tolerance: 0.001
        hint: >
          Use the variance of a difference, with the covariance set to $0$.
        feedback: >
          $\operatorname{Var}(X - Y) = 4 + 4 - 2(0) = 8$, so the standard
          deviation is $\sqrt{8} \approx 2.828\%$ — larger than either leg's
          $2\%$. The "hedge" is noisier than holding one stock.
      - ask: >
          Why does the minus sign in $X - Y$ not reduce the variance?
        choices:
          - text: >
              It does, but only once the means are subtracted.
            feedback: >
              Means never enter a variance. The sign question is about how
              $-Y$ spreads, not where it is centred.
          - text: >
              $\operatorname{Var}(-Y) = (-1)^{2}\operatorname{Var}(Y)$: flipping
              a variable's sign leaves its spread unchanged.
            correct: true
            feedback: >
              A short leg is exactly as noisy as a long one. Only a cross-term
              could make the two cancel, and here the covariance is $0$.
          - text: >
              Because the two stocks have the same standard deviation.
            feedback: >
              With $2\%$ and $3\%$ the spread would have variance
              $4 + 9 = 13$, still the sum. Equal sizes are not the point.
        feedback: >
          With no covariance, variances add for differences just as for sums.
      - reflect: >
          What would have to be true of the two stocks for the long-short
          position to be quieter than a single leg? Say which term in the
          variance formula has to do the work.
        answer: >
          $\operatorname{Var}(X - Y) = \operatorname{Var}(X) + \operatorname{Var}(Y) - 2\operatorname{Cov}(X,Y)$,
          so only a positive covariance can pull the spread's variance below
          the sum. The legs have to move together, strongly enough to beat the
          extra leg's own variance. Opposite positions hedge only when the
          underlying moves are positively correlated.

      - part: When every cross-term vanishes
        teach: >
          If $X_1, \dots, X_n$ are pairwise uncorrelated, every cross-term
          drops and $\operatorname{Var}\left(\sum_i X_i\right) = \sum_i \operatorname{Var}(X_i)$.
          Only the pair covariances need to vanish — independence supplies
          that, but is more than is needed. For $n$ iid copies of variance
          $\sigma^{2}$ the sum has variance $n\sigma^{2}$.
      - ask: >
          Back to the two $2\%$ stocks, now with correlation $\rho$. Above what
          value of $\rho$ is the long-short position quieter than one leg?
        expects: "0.5"
        hint: >
          The covariance is $\rho \times 2 \times 2$. Compare the spread's
          variance with one leg's variance of $4$.
        feedback: >
          $\operatorname{Var}(X - Y) = 8 - 8\rho$, which drops below $4$ only
          when $\rho > 0.5$. A pair trade on two names correlated at $0.3$
          still adds risk.
      - ask: >
          A trader's $16$ trades this week are uncorrelated, each with standard
          deviation $3$ (thousand). What is the standard deviation of the
          week's total?
        expects: "12"
        feedback: >
          $16 \times 9 = 144$, and $\sqrt{144} = 12$: four times one trade's
          risk for sixteen times as many trades. In general the standard
          deviation of a sum of $n$ iid copies is $\sigma\sqrt{n}$.
      - ask: >
          Average $25$ iid measurements, each with standard deviation $10$.
          What is the standard deviation of the average?
        expects: "2"
        feedback: >
          The sum has variance $25 \times 100 = 2500$, and dividing by $25$
          divides the variance by $625$: $\operatorname{Var} = 4$, standard
          deviation $2$. That is $\sigma/\sqrt{n}$.

      - part: Pairwise is enough
        ask: >
          $X$ and $Y$ are independent fair signs, each $\pm 1$, and $Z = XY$.
          The three are pairwise independent but not mutually independent.
          What is $\operatorname{Var}(X + Y + Z)$?
        expects: "3"
        hint: >
          Either use the additive rule, or list the four equally likely
          outcomes.
        feedback: >
          The sums are $3$ for $(1, 1, 1)$ and $-1$ for the other three
          outcomes. Mean $0$, and $\mathbb{E}[S^{2}] = (9 + 1 + 1 + 1)/4 = 3$ —
          exactly $1 + 1 + 1$.
      - ask: >
          Why did the additive rule hold even though $Z$ is a function of $X$
          and $Y$?
        choices:
          - text: >
              It did not; the agreement at $3$ is a coincidence.
            feedback: >
              It is no coincidence. The rule's hypothesis is met, and the
              direct calculation confirms it.
          - text: >
              The rule needs only each pair's covariance to be $0$, and each
              pair here is independent.
            correct: true
            feedback: >
              The expansion of the variance only ever contains pairs, so only
              pairwise covariances matter. Mutual independence is never used.
          - text: >
              The rule holds for any three variables with variance $1$.
            feedback: >
              Take $Y = Z = X$: then $\operatorname{Var}(3X) = 9$, not $3$.
              Without the zero covariances the cross-terms come back.
        feedback: >
          Pairwise uncorrelated is the whole hypothesis. In an interview, "long
          one uncorrelated asset, short another" gets the answer that the
          variances add, so the spread is noisier than either leg.

  - node: quant-probability.joint.covariance-matrix
    hook: >
      Every portfolio-variance formula a desk actually uses is this
      matrix's quadratic form in disguise — building $\Sigma$ once and
      reading off $a'\Sigma a$ replaces re-deriving variance-of-a-sum for
      every new set of weights.
    explanation: >
      $\Sigma$ just packages every pairwise covariance from the previous
      two nodes into one symmetric table: the diagonal entries are
      ordinary variances, and entry $(i,j)$ off the diagonal is
      $\operatorname{Cov}(X_i,X_j)$. Symmetry follows because covariance is
      symmetric in its two arguments — there's no directionality to
      encode.

      Positive semidefiniteness isn't a separate fact to verify; it's the
      weighted variance-of-a-sum formula from two nodes back read as a
      matrix product: for any weight vector $a$, $a'\Sigma a$ is exactly
      $\operatorname{Var}(a'X)$, the variance of the portfolio with those
      weights, and a variance can never be negative. $\Sigma$ is singular
      exactly when some nonzero weighted combination of the coordinates is
      a constant with probability $1$ — an exact linear redundancy among
      the variables.

      Affine transformations of the whole vector transform $\Sigma$ the
      same way a single variance transforms under rescaling, generalized to
      matrices: $\operatorname{Cov}(AX+b)=A\Sigma A'$, which is the tool
      behind computing the risk of any linear combination of assets
      without redoing the sum-of-covariances expansion by hand each time.
    worked: >
      Two assets have $\operatorname{Var}(1)=4$, $\operatorname{Var}(2)=9$,
      $\operatorname{Cov}(1,2)=3$. For weights $a=(2,1)$, the portfolio
      variance is $a'\Sigma a=a_1^{2}\Sigma_{11}+2a_1a_2\Sigma_{12}
      +a_2^{2}\Sigma_{22}=4(4)+2(2)(1)(3)+1(9)=16+12+9=37$ — read directly
      off the matrix entries, with no need to re-expand
      $\operatorname{Var}(2X_1+X_2)$ from the bilinearity rule from
      scratch.
    interview: >
      "Write down the covariance matrix for this portfolio" is checking
      whether you can build $\Sigma$ from stated variances and covariances
      without hesitation, and then use $a'\Sigma a$ directly for the
      variance of any weighted combination.
    pitfalls: >
      Forgetting that $\Sigma$ must be symmetric and accidentally writing
      $\operatorname{Cov}(1,2)\ne\operatorname{Cov}(2,1)$ in the two
      off-diagonal slots produces an inconsistent matrix. Treating a
      singular $\Sigma$ as a computational quirk rather than a signal that
      some linear combination of the assets is literally redundant misses
      real information about the position.
    recap: >
      The covariance matrix packages every pairwise covariance
      symmetrically, and its quadratic form $a'\Sigma a$ is nothing more
      than the variance of the weighted combination $a'X$ — here $37$ for
      weights $(2,1)$.
    dialogue:
      - part: Three proposed tables
        teach: >
          Two assets: $X$ has variance $4$ and $Y$ has variance $25$. Three
          analysts each propose a $2 \times 2$ covariance table, written as
          rows. P: $(4, 3)$ and $(3, 25)$. Q: $(4, 12)$ and $(12, 25)$. R:
          $(4, 3)$ and $(-3, 25)$.
      - ask: >
          Take table Q at face value, so $\operatorname{Cov}(X, Y) = 12$. What
          variance does it assign to the position $5X - 2Y$?
        expects: "-40"
        hint: >
          Variance of a weighted sum: squared weights on the variances, plus
          twice the product of weights on the covariance.
        feedback: >
          $25(4) + 4(25) + 2(5)(-2)(12) = 100 + 100 - 240 = -40$. A negative
          variance: no pair of random variables has table Q as its covariances.
      - ask: >
          Which of the three tables could be the covariance table of a real
          pair $(X, Y)$?
        choices:
          - text: >
              P and R: both keep $|\operatorname{Cov}|$ small.
            feedback: >
              R lists $\operatorname{Cov}(X,Y) = 3$ and
              $\operatorname{Cov}(Y,X) = -3$, but those are the same number.
              A covariance table has to be symmetric.
          - text: >
              Only P.
            correct: true
            feedback: >
              It is symmetric, and $|3| \le 2 \times 5$, so every position's
              variance comes out nonnegative.
          - text: >
              All three: any table with the right variances on the diagonal
              works.
            feedback: >
              Q fails on the position $5X - 2Y$, and R on symmetry. The
              diagonal is only the start.
        feedback: >
          Q fails one requirement, R another. P passes both.
      - reflect: >
          Say exactly what you were checking about each table, and why each
          check is forced on any genuine covariance table.
        answer: >
          Symmetry, because $\operatorname{Cov}(X,Y) = \operatorname{Cov}(Y,X)$
          always. And that every weighted position $aX + bY$ gets a
          nonnegative variance, because the weighted variance formula reads
          those variances straight off the table and a variance cannot be
          negative. Table Q passes symmetry but fails the second check; R
          fails the first.

      - part: The matrix and its quadratic form
        teach: >
          For a random vector $X = (X_1, \dots, X_n)$, the covariance matrix
          $\Sigma$ has entries $\Sigma_{ij} = \operatorname{Cov}(X_i, X_j)$:
          variances on the diagonal, and symmetric. For weights $a$,
          $a'\Sigma a = \operatorname{Var}(a'X) \ge 0$, so $\Sigma$ is positive
          semidefinite. Affine maps transform it as
          $\operatorname{Cov}(AX + b) = A\Sigma A'$.
      - ask: >
          Under table P, what is $\operatorname{Var}(3X - Y)$?
        expects: "43"
        feedback: >
          $a = (3, -1)$:
          $a'\Sigma a = 9(4) + 2(3)(-1)(3) + 1(25) = 36 - 18 + 25 = 43$.
      - ask: >
          A fourth table S has rows $(4, 10)$ and $(10, 25)$. What variance
          does it give $5X - 2Y$?
        expects: "0"
        feedback: >
          $100 + 100 - 2(5)(2)(10) = 0$. No negative variance this time, but a
          zero one.
      - ask: >
          What does that zero say about the assets?
        choices:
          - text: >
              That table S is invalid, like Q.
            feedback: >
              Zero is allowed; only negative is not. S is positive
              semidefinite, just not positive definite.
          - text: >
              That $X$ and $Y$ are uncorrelated.
            feedback: >
              The covariance is $10 = 2 \times 5$: correlation $1$, the
              opposite of uncorrelated.
          - text: >
              That $5X - 2Y$ is constant with probability $1$: the assets obey
              an exact linear relation.
            correct: true
            feedback: >
              A variable with zero variance is constant. So $Y$ is an exact
              affine function of $X$, and $\Sigma$ is singular — its
              determinant $4 \times 25 - 10^{2}$ is $0$.
        feedback: >
          $\Sigma$ is singular exactly when some nonzero combination $a'X$ has
          variance $0$ — a redundancy in the book, not a numerical accident.

      - part: Changing coordinates
        ask: >
          Under table P, form the pair $U = X + Y$ and $V = X - Y$, which is
          $A(X, Y)'$ for the matrix $A$ with rows $(1, 1)$ and $(1, -1)$. What
          is the off-diagonal entry of their covariance matrix $A\Sigma A'$?
        expects: "-21"
        hint: >
          The off-diagonal entry is $\operatorname{Cov}(U, V)$; expand it.
        feedback: >
          $\operatorname{Cov}(X + Y, X - Y) = 4 - 3 + 3 - 25 = -21$: the
          cross-covariances cancel, leaving $\operatorname{Var}(X) - \operatorname{Var}(Y)$.
          The product $A\Sigma A'$ does the same bookkeeping for every entry at
          once; its diagonal holds $\operatorname{Var}(U) = 35$ and
          $\operatorname{Var}(V) = 23$.

  - node: quant-probability.joint.correlation-transitivity
    hook: >
      "If $A$ and $B$ are highly correlated, and so are $B$ and $C$, must
      $A$ and $C$ be correlated too?" is a trap question with a
      counterintuitive, exactly computable answer.
    explanation: >
      Correlations among three variables cannot be chosen independently of
      each other, because the $3\times3$ correlation matrix — built from
      $\rho_{XY},\rho_{YZ},\rho_{XZ}$ on its off-diagonals and ones on its
      diagonal — must itself be positive semidefinite, being a covariance
      matrix in disguise. Requiring its determinant to stay nonnegative
      pins the third correlation to a specific interval once the other two
      are fixed.

      That interval is
      $\rho_{XZ}\in\left[\rho_{XY}\rho_{YZ}
      -\sqrt{(1-\rho_{XY}^{2})(1-\rho_{YZ}^{2})},\;
      \rho_{XY}\rho_{YZ}+\sqrt{(1-\rho_{XY}^{2})(1-\rho_{YZ}^{2})}\right]$,
      derived directly from the determinant condition — worth recognizing
      as a Cauchy–Schwarz-flavored bound rather than memorizing outright.

      The width of that interval shrinks as $\rho_{XY}$ and $\rho_{YZ}$
      individually grow, so two strong pairwise correlations only start to
      force $\rho_{XZ}$ to be positive once both legs individually exceed
      $1/\sqrt2\approx0.707$ — below that threshold, a common middle
      variable is not enough to rule out an inverse relationship between
      the outer two.
    worked: >
      Suppose $\operatorname{Corr}(X,Y)=\operatorname{Corr}(Y,Z)=0.5$.
      The bound gives $\rho_{XZ}\in\left[0.25-\sqrt{0.75\times0.75},\,
      0.25+\sqrt{0.75\times0.75}\right]=[0.25-0.75,\,0.25+0.75]
      =[-0.5,\,1]$ — even at a moderate common correlation of $0.5$ with
      each, $X$ and $Z$ could be negatively correlated at $-0.5$.
    interview: >
      "If $\operatorname{Corr}(X,Y)$ and $\operatorname{Corr}(Y,Z)$ are
      both $0.5$, what can you say about $\operatorname{Corr}(X,Z)$?" is
      testing whether you know correlation doesn't chain like an ordering
      relation. Stating the PSD-determinant reasoning, even without the
      exact formula memorized, is the substantive part of the answer.
    pitfalls: >
      Assuming two strong positive correlations with a common variable
      force the third pairwise correlation to be positive is false in
      general — only once both legs individually exceed $1/\sqrt2$ is
      positivity guaranteed. Treating correlation as if it obeyed a
      triangle-inequality-style transitivity, the way physical distances
      do, misreads what positive semidefiniteness actually constrains.
    recap: >
      Correlation is not transitive: pairwise correlations of $0.5$ and
      $0.5$ through a common variable still permit the outer two variables
      to be correlated as low as $-0.5$.
    dialogue:
      - part: An index and its two parts
        teach: >
          $X$ and $Z$ are two stocks' standardized daily moves, independent,
          each with variance $1$. An index tracks their sum, $Y = X + Z$.
      - ask: >
          What is $\operatorname{Corr}(X, Y)$, to four decimal places?
        expects: "0.7071"
        tolerance: 0.0005
        hint: >
          $\operatorname{Cov}(X, X + Z)$ by bilinearity, and
          $\operatorname{Var}(Y)$ by adding variances.
        feedback: >
          $\operatorname{Cov}(X, X + Z) = 1 + 0 = 1$ and $\sigma_Y = \sqrt{2}$,
          so $\rho = 1/\sqrt{2} \approx 0.7071$. By symmetry
          $\operatorname{Corr}(Y, Z)$ is the same.
      - ask: >
          $X$ is correlated with the index at $0.71$, and the index with $Z$ at
          $0.71$. What is $\operatorname{Corr}(X, Z)$?
        choices:
          - text: >
              At least $0.5$, the product $0.71 \times 0.71$.
            feedback: >
              Correlations do not multiply along a chain. $X$ and $Z$ were
              built independent.
          - text: >
              $0$.
            correct: true
            feedback: >
              By construction. Each leg is strongly tied to the index through a
              different half of it, and the two halves have nothing to do with
              each other.
          - text: >
              Positive, though maybe small: two positive links force a positive
              third.
            feedback: >
              The construction gives exactly $0$, and the next question pushes
              it negative.
        feedback: >
          Strong correlation with a common middle variable does not make the
          outer two correlated.
      - ask: >
          Now give $X$ and $Z$ correlation $-0.68$, still with variance $1$
          each, and $Y = X + Z$. What is $\operatorname{Corr}(X, Y)$?
        expects: "0.4"
        hint: >
          $\operatorname{Var}(Y) = 1 + 1 + 2(-0.68)$.
        feedback: >
          $\operatorname{Cov}(X, Y) = 1 - 0.68 = 0.32$ and
          $\operatorname{Var}(Y) = 2 - 1.36 = 0.64$, so $\sigma_Y = 0.8$ and
          $\rho = 0.32/0.8 = 0.4$. Both legs are correlated at $+0.4$, and the
          outer pair at $-0.68$.
      - reflect: >
          With both legs at $0.4$, what stops you pushing
          $\operatorname{Corr}(X, Z)$ all the way to $-1$? Say what object has
          to stay legal.
        answer: >
          At $-1$, $X + Z$ would be constant, so the index $Y$ would have
          variance $0$ and no correlation with anything. More generally the
          three variables have a $3 \times 3$ correlation matrix, and it is a
          covariance matrix of standardized variables, so it must be positive
          semidefinite. That requirement caps how far the third correlation can
          move once the other two are fixed.

      - part: The interval the matrix allows
        teach: >
          With $a = \rho_{XY}$, $b = \rho_{YZ}$ and $c = \rho_{XZ}$, the
          correlation matrix has determinant
          $1 - a^{2} - b^{2} - c^{2} + 2abc$, and positive semidefiniteness
          needs it nonnegative. Solved for $c$:
          $c \in \left[ab - \sqrt{(1 - a^{2})(1 - b^{2})},\ ab + \sqrt{(1 - a^{2})(1 - b^{2})}\right]$.
          Correlation is not transitive.
      - ask: >
          With both legs at $0.4$, what is the lowest possible
          $\operatorname{Corr}(X, Z)$?
        expects: "-0.68"
        feedback: >
          $0.16 - \sqrt{0.84 \times 0.84} = 0.16 - 0.84 = -0.68$ — exactly the
          value your index construction reached. That construction sits on the
          boundary, where the determinant is $0$.
      - ask: >
          Why is it the determinant of the $3 \times 3$ matrix that matters,
          rather than Cauchy–Schwarz applied to $X$ and $Z$ alone?
        choices:
          - text: >
              Cauchy–Schwarz on $X$ and $Z$ only gives $|c| \le 1$; the
              constraint linking $c$ to $a$ and $b$ comes from all three
              variables at once.
            correct: true
            feedback: >
              Every weighted combination of $X, Y, Z$ needs nonnegative
              variance. Pairs alone allow any $c$ in $[-1, 1]$; the triple
              cuts that down.
          - text: >
              The determinant is just a shortcut for checking each pair
              separately.
            feedback: >
              Each pair separately is fine at $a = b = 0.4$, $c = -0.9$, yet
              that matrix has determinant
              $1 - 0.16 - 0.16 - 0.81 - 0.288 < 0$. The failure is joint.
          - text: >
              Because correlations multiply along a chain, and the determinant
              tracks the product.
            feedback: >
              They do not multiply: the index example had legs of $0.71$ and
              an outer correlation of $0$. The product $ab$ is only the centre
              of the allowed interval.
        feedback: >
          The constraint is positive semidefiniteness of the whole matrix; for
          three variables it comes down to one determinant.

      - part: When positivity is forced
        ask: >
          Legs of $0.96$ and $0.6$. What is the lowest possible
          $\operatorname{Corr}(X, Z)$?
        expects: "0.352"
        hint: >
          $1 - 0.96^{2} = 0.0784 = 0.28^{2}$ and $1 - 0.6^{2} = 0.8^{2}$.
        feedback: >
          $ab = 0.576$ and $\sqrt{0.0784 \times 0.64} = 0.28 \times 0.8 = 0.224$,
          so the interval is $[0.352,\ 0.8]$. One very strong leg is enough to
          force the outer correlation positive here.
      - ask: >
          Both legs equal $r$. What is the smallest $r$ that forces
          $\operatorname{Corr}(X, Z) \ge 0$?
        choices:
          - text: >
              $r = 0.5$
            feedback: >
              At $0.5$ the lower end is $0.25 - 0.75 = -0.5$, still negative.
          - text: >
              $r = 1/\sqrt{2} \approx 0.707$
            correct: true
            feedback: >
              The lower end is $r^{2} - (1 - r^{2}) = 2r^{2} - 1$, which reaches
              $0$ at $r^{2} = 1/2$. The index example sat exactly there.
          - text: >
              Only $r = 1$
            feedback: >
              At $r = 0.8$ the interval is already $[0.28, 1]$, entirely
              positive. You need less than perfect legs.
        feedback: >
          Below $1/\sqrt{2}$ on both legs, the outer pair can be negatively
          correlated. In an interview, give the interval, name the
          positive-semidefinite constraint behind it, and point out that the
          outer correlation can be negative.

  - node: quant-probability.joint.equicorrelation-bound
    hook: >
      "Can I build a basket where every asset is negatively correlated
      with every other?" has a hard numerical answer that gets stricter
      the more assets you add — a fact every basket-construction question
      is quietly testing.
    explanation: >
      If $X_1,\dots,X_n$ each have variance $\sigma^{2}$ and every pair
      shares the same correlation $\rho$, the variance-of-a-sum formula
      collapses to a clean closed form: there are $n$ diagonal terms of
      $\sigma^{2}$ and $n(n-1)$ off-diagonal terms of
      $\rho\sigma^{2}$, giving
      $\operatorname{Var}(\sum_iX_i)=n\sigma^{2}(1+(n-1)\rho)$.

      A variance can never be negative, so this forces
      $\rho\ge-1/(n-1)$ — a floor that gets stricter as $n$ grows, because
      the number of negative cross-terms needed to cancel the $n$ positive
      diagonal terms grows faster than the diagonal itself. At $n=2$ the
      floor is $-1$, fully attainable; as $n\to\infty$ the floor rises all
      the way to $0$.

      The asymmetry with the upper end is the point worth remembering:
      $\rho=1$ (every variable equal) is always attainable for any $n$,
      but universal mutual negative correlation becomes essentially
      impossible once the collection is even moderately large — everything
      can move together, but not everything can move apart from
      everything else simultaneously.
    worked: >
      For $n=5$ equally correlated variables, the floor is
      $\rho\ge-1/4$. At exactly $\rho=-1/4$,
      $\operatorname{Var}(\sum X_i)=5\sigma^{2}(1+4(-1/4))
      =5\sigma^{2}(1-1)=0$ — the sum is forced to be constant with
      probability $1$, the boundary case where the semidefiniteness
      constraint binds exactly and no more negative correlation is
      possible among the five.
    interview: >
      "Can you have five stocks that are all pairwise negatively
      correlated at $-0.4$?" should be answered by checking against
      $-1/(n-1)=-1/4$ immediately — since $-0.4<-1/4$, the answer is no,
      no such configuration exists.
    pitfalls: >
      Assuming any negative common correlation is achievable for any group
      size ignores that the floor $-1/(n-1)$ tightens toward $0$ as the
      group grows — a value that's fine for $3$ assets can be
      mathematically impossible for $10$. Forgetting that the bound only
      applies under the equicorrelation assumption (every pair sharing
      exactly the same $\rho$) and misapplying it to a general, unequal
      correlation structure gives a wrong constraint.
    recap: >
      Equally correlated variables satisfy $\rho\ge-1/(n-1)$, so at $n=5$
      the floor is already $-1/4$ and mutual negative correlation becomes
      essentially impossible as the group grows.
    dialogue:
      - part: Three strategies that all disagree
        teach: >
          A portfolio manager wants three strategies, each with variance $1$,
          every pair correlated at $-0.6$, so that whatever one loses the other
          two tend to make back.
      - ask: >
          What would $\operatorname{Var}(X_1 + X_2 + X_3)$ be?
        expects: "-0.6"
        hint: >
          Three variances, and six ordered pairs each contributing a
          covariance of $-0.6$.
        feedback: >
          $3 + 6(-0.6) = 3 - 3.6 = -0.6$.
      - ask: >
          What does that number tell the manager?
        choices:
          - text: >
              The combined book is perfectly hedged, and then some.
            feedback: >
              A variance below $0$ is not a very good hedge; it is not a
              variance at all. Nothing can have it.
          - text: >
              Three strategies with these numbers cannot exist.
            correct: true
            feedback: >
              Every real triple of random variables has a nonnegative variance
              for its sum. These correlations describe no triple at all.
          - text: >
              The strategies just need larger variances to make it work.
            feedback: >
              Scale every variance by $\sigma^{2}$ and the sum's variance is
              $-0.6\,\sigma^{2}$ — still negative. Correlation, not size, is
              the problem.
        feedback: >
          Mutual negative correlation is limited by arithmetic, before any
          market data comes in.
      - reflect: >
          Do the same count for $n$ strategies, each with variance
          $\sigma^{2}$ and every pair correlated at $\rho$. What must $\rho$
          satisfy, and why does the condition get harder as $n$ grows?
        answer: >
          There are $n$ variance terms and $n(n-1)$ covariance terms, so
          $\operatorname{Var}\left(\sum_i X_i\right) = n\sigma^{2} + n(n-1)\rho\sigma^{2} = n\sigma^{2}(1 + (n-1)\rho)$.
          Nonnegativity forces $\rho \ge -1/(n-1)$. The negative cross-terms
          grow like $n^{2}$ while the variances grow like $n$, so the
          correlation that can be tolerated shrinks toward $0$.

      - part: A floor that rises
        teach: >
          If $X_1, \dots, X_n$ each have variance $\sigma^{2} > 0$ and every
          pair has correlation $\rho$, then
          $\operatorname{Var}\left(\sum_i X_i\right) = n\sigma^{2}(1 + (n-1)\rho)$,
          so $\rho \ge -1/(n-1)$. Three variables allow $\rho \ge -1/2$; only
          two allow $\rho = -1$.
      - ask: >
          What is the floor on a common correlation among $8$ strategies?
        expects: "-1/7"
        feedback: >
          $-1/(8 - 1) = -1/7 \approx -0.143$. Eight strategies cannot all be
          correlated at $-0.2$ with one another.
      - ask: >
          The floor can be reached. Take $Z_1, Z_2, Z_3$ independent, variance
          $1$, let $\bar{Z}$ be their average, and set $X_i = Z_i - \bar{Z}$.
          What is $\operatorname{Corr}(X_1, X_2)$?
        expects: "-1/2"
        hint: >
          $\operatorname{Cov}(Z_1, \bar{Z}) = 1/3$ and
          $\operatorname{Var}(\bar{Z}) = 1/3$.
        feedback: >
          $\operatorname{Cov}(X_1, X_2) = 0 - 1/3 - 1/3 + 1/3 = -1/3$ and
          $\operatorname{Var}(X_1) = 1 - 2/3 + 1/3 = 2/3$, so the correlation
          is $-1/2$. And $X_1 + X_2 + X_3 = 0$ always: at the floor, the sum
          has variance $0$.
      - ask: >
          What is the most positive common correlation $n$ strategies can
          share?
        choices:
          - text: >
              $1/(n-1)$, mirroring the floor.
            feedback: >
              The ceiling does not shrink with $n$. Copies of one strategy are
              correlated at $1$ however many there are.
          - text: >
              $1$, for every $n$.
            correct: true
            feedback: >
              Take every $X_i$ equal: the factor $1 + (n-1)\rho$ is then $n$,
              comfortably positive.
          - text: >
              It also tends to $0$ as $n$ grows.
            feedback: >
              Only the negative side is squeezed. Positive cross-terms add to
              the variance and can never make it negative.
        feedback: >
          Everything can move together; everything cannot move apart.

      - part: Big books and unequal correlations
        ask: >
          What is the floor for $101$ equally correlated strategies?
        expects: "-0.01"
        feedback: >
          $-1/100$. In a large book, a common correlation can be negative only
          by a hair.
      - ask: >
          Four strategies: pairs $(1, 2)$ and $(3, 4)$ each have correlation
          $-0.9$, and the other four pairs have correlation $0$. The floor for
          $n = 4$ is $-1/3$. Is this configuration possible?
        choices:
          - text: >
              No: $-0.9$ is below $-1/3$.
            feedback: >
              The floor applies only when every pair shares the same
              correlation. Here they do not.
          - text: >
              Yes: it is two independent pairs, each a legal pair at $-0.9$.
            correct: true
            feedback: >
              Build $(X_1, X_2)$ and $(X_3, X_4)$ separately and independently.
              Some pairs can be very negative; what is impossible is all pairs
              at once.
          - text: >
              Only if the variances differ.
            feedback: >
              Equal variances are fine. The configuration works because the
              strongly negative pairs are kept apart from one another.
        feedback: >
          $-1/(n-1)$ is a statement about a common correlation. For unequal
          ones the test is the full positive-semidefinite check. Asked whether
          six stocks can all be correlated at $-0.25$, compare with the floor
          $-1/5$ and say no.

  - node: quant-probability.joint.convolution
    hook: >
      Whenever a "closure" fact (normal plus normal is normal, Poisson
      plus Poisson is Poisson) doesn't apply, convolution is the fallback
      that always works — slow, but it always works.
    explanation: >
      To find the density of $S=X+Y$ for independent $X,Y$, fix a target
      value $s$ and add up every way the two pieces could split to
      produce it: $X=x$ paired with $Y=s-x$, weighted by how likely each
      split is. Discretely that's
      $p_S(s)=\sum_xp_X(x)p_Y(s-x)$; continuously the sum becomes
      $f_S(s)=\int_{-\infty}^{\infty}f_X(x)f_Y(s-x)\,dx$, with the actual
      limits narrowed down by wherever both factors are simultaneously
      positive.

      Independence is what makes this valid at all — the joint density
      only splits into a product of $X$'s and $Y$'s own marginals because
      independence guarantees it; without independence you'd need to
      integrate against the true, possibly unfactorable, joint density
      instead.

      Convolution is a fallback, not a first resort: closure properties
      (sums of independent normals, independent Poissons, independent
      gammas of the same rate) skip the integral entirely, and moment
      generating functions turn the same computation into multiplying two
      functions together. Reach for convolution when none of those apply.
    worked: >
      Let $X,Y$ be independent, each uniform on $[0,1]$. For
      $0\le s\le1$, the constraint $0\le x\le1$ and $0\le s-x\le1$ forces
      $x\in[0,s]$, so $f_S(s)=\int_0^s1\,dx=s$; for $1\le s\le2$ it forces
      $x\in[s-1,1]$, so $f_S(s)=2-s$ — the familiar triangular density,
      peaking at $s=1$. As a check,
      $\Pr(X+Y\le0.5)=\int_0^{0.5}s\,ds=0.125$.
    interview: >
      "What's the distribution of the sum of these two independent
      variables?" wants you to check for a closure fact first and only
      set up the convolution integral if none applies. Stating the split
      limits correctly before integrating is the part that actually gets
      watched.
    pitfalls: >
      Forgetting to restrict the integration limits to where both
      densities are simultaneously positive integrates over regions that
      contribute nothing, or worse, misses regions that do. Reaching for
      convolution when a known closure property (normal, Poisson, gamma)
      already answers the question wastes time on an integral that isn't
      necessary.
    recap: >
      The density of a sum of independent variables is their convolution,
      $\int f_X(x)f_Y(s-x)\,dx$ — for two independent uniforms on $[0,1]$
      this is the triangular density, peaking at $s=1$.
    dialogue:
      - part: Orders from two clients
        teach: >
          In a given minute two clients send orders independently. Client A
          sends $0$, $1$ or $2$ orders with probabilities $0.5$, $0.3$, $0.2$.
          Client B sends $0$, $1$, $2$ or $3$ with probabilities $0.4$, $0.3$,
          $0.2$, $0.1$. Your system needs the law of the total.
      - ask: >
          What is the probability that exactly $2$ orders arrive in total?
        expects: "0.27"
        hint: >
          List the ways the two clients can make $2$ between them.
        feedback: >
          $(0, 2)$: $0.5 \times 0.2 = 0.10$. $(1, 1)$: $0.3 \times 0.3 = 0.09$.
          $(2, 0)$: $0.2 \times 0.4 = 0.08$. Total $0.27$.
      - ask: >
          And exactly $3$?
        expects: "0.17"
        feedback: >
          $(0, 3)$: $0.05$. $(1, 2)$: $0.06$. $(2, 1)$: $0.06$. Total $0.17$.
      - reflect: >
          The joint table has $12$ cells, but each answer used only three.
          Which cells, and how would you write the rule for a general total $s$
          as a single sum?
        answer: >
          Only the cells on the anti-diagonal $x + y = s$. For each value $x$
          of the first client, the second must send exactly $s - x$, and
          independence makes that cell $p_X(x)\,p_Y(s - x)$. So
          $\Pr(X + Y = s) = \sum_x p_X(x)\,p_Y(s - x)$: slide one pmf against
          the other and add up the overlaps.

      - part: Convolution
        teach: >
          For independent $X$ and $Y$, the law of $S = X + Y$ is the
          convolution of their laws. Discrete:
          $p_S(s) = \sum_x p_X(x)\,p_Y(s - x)$. Continuous:
          $f_S(s) = \int_{-\infty}^{\infty} f_X(x)\,f_Y(s - x)\,dx$, with the
          limits cut down to where both factors are positive.
      - ask: >
          Which step of the rule used independence?
        choices:
          - text: >
              Adding over $x$: splitting the event $\{S = s\}$ by the value of
              $X$.
            feedback: >
              That split is just additivity over disjoint pieces, true for any
              joint law.
          - text: >
              Replacing $\Pr(X = x, Y = s - x)$ by $p_X(x)\,p_Y(s - x)$.
            correct: true
            feedback: >
              Without independence each cell must come from the true joint, and
              the sum becomes $\sum_x p(x, s - x)$ instead.
          - text: >
              Nothing: the rule holds for any two variables.
            feedback: >
              Only the version with the true joint, $\sum_x p(x, s - x)$, holds
              in general. The product form is independence.
        feedback: >
          The split into cases is free; the product inside each case is the
          independence assumption.
      - ask: >
          $X$ is uniform on $[0, 1]$ and, independently, $Y$ is uniform on
          $[0, 2]$. What is the density $f_S(1.5)$ of $S = X + Y$?
        expects: "0.5"
        hint: >
          $f_Y = 1/2$ on $[0, 2]$. For which $x$ in $[0, 1]$ is $1.5 - x$ in
          $[0, 2]$?
        feedback: >
          Every $x \in [0, 1]$ works, since $1.5 - x$ stays in $[0.5, 1.5]$. So
          $f_S(1.5) = \int_0^1 1 \cdot \tfrac{1}{2}\,dx = 0.5$.
      - ask: >
          What is $f_S(2.5)$?
        expects: "0.25"
        hint: >
          Now $2.5 - x$ must not exceed $2$.
        feedback: >
          $2.5 - x \le 2$ needs $x \ge 0.5$, so the integral runs over
          $[0.5, 1]$ only: $0.5 \times \tfrac{1}{2} = 0.25$. Integrating over
          all of $[0, 1]$ would give $0.5$ — the commonest convolution error is
          forgetting to cut the limits.

      - part: Where the rule does not apply
        ask: >
          $X$ is uniform on $[0, 1]$ and $Y = 1 - X$, so $Y$ is uniform on
          $[0, 1]$ too. Convolving the two uniform densities predicts a
          triangle on $[0, 2]$. What is $X + Y$ actually?
        choices:
          - text: >
              The triangle: both marginals are uniform, so the convolution
              applies.
            feedback: >
              The convolution needs independence, not just the right
              marginals. Here $Y$ is a function of $X$.
          - text: >
              Uniform on $[0, 2]$.
            feedback: >
              $X + Y = X + 1 - X$ never leaves $1$.
          - text: >
              The constant $1$.
            correct: true
            feedback: >
              Same marginals, opposite extreme of dependence, and the sum is
              not random at all. The convolution answers a different question.
        feedback: >
          The law of a sum depends on the joint law. Convolution is the answer
          only when that joint factors.
      - ask: >
          You are asked for the law of $X + Y$, where $X \sim N(1, 4)$ and
          $Y \sim N(2, 5)$ are independent. What is the fastest correct route?
        choices:
          - text: >
              Set up $\int f_X(x)\,f_Y(s - x)\,dx$ with the two normal
              densities and complete the square.
            feedback: >
              It works, but it re-derives a closure fact you already have. Keep
              the integral for when no such fact applies.
          - text: >
              Quote the closure fact: $N(3, 9)$, since means and variances add
              for independent normals.
            correct: true
            feedback: >
              One line. Convolution is the fallback for sums no closure rule
              covers.
          - text: >
              $N(3, 20)$: multiply the variances.
            feedback: >
              Variances of independent summands add: $4 + 5 = 9$.
        feedback: >
          Check for a closure rule first; convolve only when none applies.

  - node: quant-probability.joint.convolution-poisson
    hook: >
      Pooling two independent Poisson arrival streams into one, and then
      splitting a pooled count back apart, are the same calculation read
      forwards and backwards — and it's a two-line convolution, not a
      simulation.
    explanation: >
      Convolving two independent Poisson pmfs and applying the binomial
      theorem to the resulting sum collapses everything into a single
      Poisson pmf with the rates added — $X+Y\sim
      \operatorname{Poisson}(\lambda+\mu)$ whenever $X\sim
      \operatorname{Poisson}(\lambda)$ and $Y\sim\operatorname{Poisson}(\mu)$
      are independent. This is the general convolution technique applied
      to a distribution with just enough algebraic structure (the binomial
      theorem inside the exponential's series) to close exactly.

      Reading the middle of that same derivation backwards is the more
      useful fact in practice: conditional on the pooled total $X+Y=n$,
      the split between the two sources is
      $\operatorname{Binomial}(n,\lambda/(\lambda+\mu))$ — each arrival,
      independently of the others, "came from" the first source with
      probability equal to that source's share of the combined rate.

      This pooling-then-splitting pattern shows up constantly: merge
      independent counting processes by adding rates, then recover the
      composition of any observed total using only the relative rates, no
      re-derivation needed each time.
    worked: >
      Source A arrives at rate $\lambda=4$ per minute, source B at
      $\mu=1$ per minute, independently. The pooled count is
      $T\sim\operatorname{Poisson}(5)$, so
      $\Pr(T=3)=e^{-5}5^{3}/3!=125e^{-5}/6\approx0.1404$. Given exactly
      $10$ arrivals were observed in a minute, the expected number from
      source A is $10\times(4/5)=8$, using the binomial split with
      success probability $\lambda/(\lambda+\mu)=4/5$ — no need to know
      which arrival came from which source individually.
    interview: >
      "If I pool two independent Poisson streams, what's the distribution
      of the total, and given the total, how are arrivals split between
      sources?" is asked as a pair. The rate-addition answer and the
      binomial-split answer with probability $\lambda/(\lambda+\mu)$
      should come back together, not just the first half.
    pitfalls: >
      Using the average rate $(\lambda+\mu)/2$ instead of the summed rate
      $\lambda+\mu$ for the pooled process is a common slip. Forgetting
      that the binomial split probability is $\lambda/(\lambda+\mu)$, a
      source's *share* of the total rate, not $\lambda$ or $\mu$ on its
      own, misapplies the conditional result.
    recap: >
      Independent Poisson rates add under pooling, and reading the same
      convolution backwards gives a binomial split of any observed
      total — with rates $4$ and $1$, an observed total of $10$ splits
      to an expected $8$ from the faster source.
    dialogue:
      - part: Two order streams in one minute
        teach: >
          Retail orders arrive at a Poisson rate of $1$ per minute and,
          independently, institutional orders at a Poisson rate of $2$ per
          minute. Let $X$ and $Y$ be the two counts in a given minute. Write
          your answers as multiples of $e^{-3}$.
      - ask: >
          What is $\Pr(X = 0, Y = 2)$, as a multiple of $e^{-3}$?
        expects: "2"
        feedback: >
          $e^{-1} \cdot e^{-2}\,2^{2}/2! = 2e^{-3}$. Independence multiplies
          the two Poisson probabilities, and the exponentials combine into
          $e^{-3}$.
      - ask: >
          What is $\Pr(X + Y = 2)$, as a multiple of $e^{-3}$?
        expects: "4.5"
        hint: >
          Three splits: $(0, 2)$, $(1, 1)$ and $(2, 0)$.
        feedback: >
          $(0, 2)$ gives $2e^{-3}$; $(1, 1)$ gives $e^{-1} \cdot 2e^{-2} = 2e^{-3}$;
          $(2, 0)$ gives $\tfrac{1}{2}e^{-1} \cdot e^{-2} = 0.5e^{-3}$. Total
          $4.5e^{-3}$.
      - ask: >
          Which familiar probability is $4.5e^{-3}$?
        choices:
          - text: >
              $\Pr(N = 2)$ for $N \sim \operatorname{Poisson}(1.5)$, the
              average of the two rates.
            feedback: >
              That is $e^{-1.5}\,1.5^{2}/2 \approx 0.25$, against
              $4.5e^{-3} \approx 0.22$. Pooling two streams adds their rates;
              it does not average them.
          - text: >
              $\Pr(N = 2)$ for $N \sim \operatorname{Poisson}(3)$.
            correct: true
            feedback: >
              $e^{-3}\,3^{2}/2! = 4.5e^{-3}$ exactly. The pooled count looks
              Poisson with the summed rate.
          - text: >
              $\Pr(N = 2)$ for $N \sim \operatorname{Binomial}(3, 1/2)$.
            feedback: >
              That is $3/8$, with no $e^{-3}$ in sight. Nothing caps the total
              at $3$.
        feedback: >
          One value matching is a coincidence until you see why it has to.
      - reflect: >
          Write the general term of the convolution for $\Pr(X + Y = n)$ with
          rates $\lambda$ and $\mu$, and pull $e^{-(\lambda + \mu)}/n!$ out
          front. What sum is left, and what does it add up to?
        answer: >
          $\sum_{k=0}^{n} e^{-\lambda}\tfrac{\lambda^{k}}{k!}\,e^{-\mu}\tfrac{\mu^{n-k}}{(n-k)!} = \tfrac{e^{-(\lambda+\mu)}}{n!}\sum_{k=0}^{n}\binom{n}{k}\lambda^{k}\mu^{n-k}$,
          and the remaining sum is $(\lambda + \mu)^{n}$ by the binomial
          theorem. So the total is $\operatorname{Poisson}(\lambda + \mu)$ for
          every $n$, not just $n = 2$. Here the three terms were
          $\binom{2}{k}1^{k}2^{2-k}/2! = 2, 2, 0.5$.

      - part: Pooling forward, splitting backward
        teach: >
          If $X \sim \operatorname{Poisson}(\lambda)$ and
          $Y \sim \operatorname{Poisson}(\mu)$ are independent, then
          $X + Y \sim \operatorname{Poisson}(\lambda + \mu)$. Rates add when
          independent streams are pooled. The same convolution also says how a
          known total splits between the two streams.
      - ask: >
          Given that exactly $2$ orders arrived, what is the probability that
          neither was retail, $\Pr(X = 0 \mid X + Y = 2)$?
        expects: "4/9"
        feedback: >
          $2e^{-3}/4.5e^{-3} = 4/9$. That is $(2/3)^{2}$: as if each of the two
          orders were independently institutional with probability $2/3$.
      - ask: >
          Given $X + Y = n$, what is the conditional law of the retail count
          $X$?
        choices:
          - text: >
              $\operatorname{Binomial}(n, 1/2)$: two streams, so a fair split.
            feedback: >
              The streams are not equally busy. Retail contributes one third
              of the pooled rate, and the split follows the rates.
          - text: >
              $\operatorname{Binomial}(n, 1/3)$
            correct: true
            feedback: >
              Each of the $n$ arrivals is retail with probability
              $\lambda/(\lambda + \mu) = 1/3$, independently. You just saw
              $n = 2$, $k = 0$: $(2/3)^{2} = 4/9$.
          - text: >
              Still $\operatorname{Poisson}(1)$: conditioning on the total does
              not change $X$.
            feedback: >
              Conditioning on $X + Y = n$ caps $X$ at $n$, which no Poisson
              law respects. Knowing the total changes everything about $X$.
        feedback: >
          The pooling fact and the splitting fact are the same convolution read
          in two directions.
      - ask: >
          In some minute $9$ orders arrive. What is the expected number of
          retail orders among them?
        expects: "3"
        feedback: >
          The binomial mean: $9 \times 1/3 = 3$. You do not need to know which
          order came from where.

      - part: When pooling fails
        ask: >
          Suppose instead that each institutional order triggers retail
          activity, so $X$ and $Y$ are dependent, still with Poisson marginals
          of means $1$ and $2$. What can you say about $X + Y$?
        choices:
          - text: >
              Its mean is $3$, but it need not be Poisson.
            correct: true
            feedback: >
              Means add without independence; the Poisson law does not. A
              $\operatorname{Poisson}(3)$ count has variance $3$, but
              $\operatorname{Var}(X + Y) = 1 + 2 + 2\operatorname{Cov}(X, Y)$,
              which exceeds $3$ as soon as the coupling is positive.
          - text: >
              It is $\operatorname{Poisson}(3)$, since the marginals are
              unchanged.
            feedback: >
              The convolution multiplied $\Pr(X = k)\Pr(Y = n - k)$. With
              dependence that product is the wrong joint, and the sum's law
              changes.
          - text: >
              Its mean is no longer $3$.
            feedback: >
              Linearity of expectation needs no independence:
              $\mathbb{E}[X + Y] = 1 + 2$ whatever the joint law.
        feedback: >
          In an interview, give both halves together: independent Poisson
          streams pool to $\operatorname{Poisson}(\lambda + \mu)$, and given
          the total, each arrival came from the first stream with probability
          $\lambda/(\lambda + \mu)$.

  - node: quant-probability.joint.expected-max-min
    hook: >
      This sidesteps building the actual distribution of the max or min
      entirely — no independence assumption, no order statistics, just
      two algebraic identities and one number, $\mathbb{E}|X-Y|$.
    explanation: >
      The two identities are pure algebra, true pointwise on every
      outcome, not just on average: whichever of $X,Y$ is bigger,
      $\max(X,Y)+\min(X,Y)=X+Y$ always, and
      $\max(X,Y)-\min(X,Y)=|X-Y|$ always, since the gap between the larger
      and smaller value is exactly the absolute difference.

      Taking expectations of both identities (linearity needs no
      independence) and solving the resulting $2\times2$ system for the
      two unknowns $\mathbb{E}[\max]$ and $\mathbb{E}[\min]$ gives
      $\mathbb{E}[\max(X,Y)]
      =\left(\mathbb{E}[X]+\mathbb{E}[Y]+\mathbb{E}|X-Y|\right)/2$, with
      the minimum being the same expression with the last term subtracted
      instead of added.

      Every trace of how $X$ and $Y$ depend on each other is compressed
      into the single number $\mathbb{E}|X-Y|$ — once that one quantity is
      in hand, both extremes follow from arithmetic, which is what makes
      this the fastest route to $\mathbb{E}[\max]$ or $\mathbb{E}[\min]$
      whenever $\mathbb{E}|X-Y|$ is directly computable.
    worked: >
      Let $X,Y$ be independent fair four-sided dice. Enumerating all $16$
      equally likely pairs, the sixteen values of $|i-j|$ sum to $20$
      (row sums $6,4,4,6$), so $\mathbb{E}|X-Y|=20/16=1.25$. With
      $\mathbb{E}[X]=\mathbb{E}[Y]=2.5$,
      $\mathbb{E}[\max]=(2.5+2.5+1.25)/2=3.125$ and
      $\mathbb{E}[\min]=(5-1.25)/2=1.875$ — matching the $3.125$ reached
      earlier via the tail-sum formula on $\Pr(M\ge k)$, a genuinely
      different route to the identical number.
    interview: >
      "What's the expected value of the larger of two draws?" can be
      answered two ways — this joint identity, or a tail-sum over
      survival probabilities. Naming both and picking whichever makes
      $\mathbb{E}|X-Y|$ or the tail probabilities easier to compute is
      what a fluent answer sounds like.
    pitfalls: >
      Assuming this identity needs $X,Y$ independent is an unnecessary
      restriction the algebra never requires — it holds for any pair with
      finite means, dependent or not. Computing $\mathbb{E}|X-Y|$
      incorrectly as $|\mathbb{E}[X]-\mathbb{E}[Y]|$ swaps a genuinely hard
      quantity for a trivially wrong shortcut; the two agree only when $X$
      and $Y$ never cross each other in value.
    recap: >
      Max plus min is the sum and max minus min is $|X-Y|$, so both means
      follow from the single number $\mathbb{E}|X-Y|$ — for two
      four-sided dice, $3.125$ and $1.875$, matching the tail-sum answer
      exactly.
    dialogue:
      - part: Filling against the bigger quote
        teach: >
          Two dealers quote sizes on a bond, in millions. Their quotes $(X, Y)$
          are $(1, 4)$ with probability $0.2$, $(3, 3)$ with probability $0.3$,
          $(5, 2)$ with probability $0.4$ and $(2, 6)$ with probability $0.1$.
          You always trade against the larger quote.
      - ask: >
          What is $\mathbb{E}[\max(X, Y)]$?
        expects: "4.3"
        feedback: >
          The maxima are $4, 3, 5, 6$:
          $0.8 + 0.9 + 2.0 + 0.6 = 4.3$.
      - ask: >
          What is $\mathbb{E}[\min(X, Y)]$?
        expects: "2.1"
        feedback: >
          The minima are $1, 3, 2, 2$:
          $0.2 + 0.9 + 0.8 + 0.2 = 2.1$.
      - reflect: >
          Add your two answers, then subtract them. Each result is something
          you could have found without ever taking a max or a min. What are
          they, and why does each hold outcome by outcome?
        hint: >
          Compare with $\mathbb{E}[X] + \mathbb{E}[Y]$, and look at
          $|X - Y|$ in each outcome.
        answer: >
          The sum $6.4$ is $\mathbb{E}[X] + \mathbb{E}[Y] = 3.3 + 3.1$, because
          in every outcome the max and the min are $X$ and $Y$ in some order,
          so $\max + \min = X + Y$. The difference $2.2$ is
          $\mathbb{E}|X - Y| = 3(0.2) + 0 + 3(0.4) + 4(0.1)$, because
          $\max - \min = |X - Y|$. Two equations, two unknowns: you could have
          solved for both means without listing a single max.

      - part: Two identities, one number
        teach: >
          For any $X, Y$ with finite means — no independence needed —
          $\max(X,Y) + \min(X,Y) = X + Y$ and
          $\max(X,Y) - \min(X,Y) = |X - Y|$. Taking expectations and solving,
          $\mathbb{E}[\max(X,Y)] = \left(\mathbb{E}[X] + \mathbb{E}[Y] + \mathbb{E}|X - Y|\right)/2$,
          and $\mathbb{E}[\min(X,Y)]$ is the same with a minus sign. All the
          dependence sits in $\mathbb{E}|X - Y|$.
      - ask: >
          $X$ is uniform on $[0, 1]$ and $Y = 1 - X$ — as dependent as it gets.
          What is $\mathbb{E}[\max(X, Y)]$?
        expects: "3/4"
        hint: >
          $|X - Y| = |2X - 1|$, which is uniform on $[0, 1]$.
        feedback: >
          $\mathbb{E}|2X - 1| = 1/2$, so
          $\mathbb{E}[\max] = (1/2 + 1/2 + 1/2)/2 = 3/4$. Check directly:
          $\max(X, 1 - X)$ is uniform on $[1/2, 1]$, with mean $3/4$.
      - ask: >
          And $\mathbb{E}[\min(X, Y)]$ for the same pair?
        expects: "1/4"
        feedback: >
          $(1/2 + 1/2 - 1/2)/2 = 1/4$, or $1 - 3/4$, since max and min add to
          $1$ here.
      - ask: >
          Now $X$ is uniform on $\{0, 2\}$ and, independently, $Y$ is uniform
          on $\{1, 3\}$. What is $\mathbb{E}[\min(X, Y)]$?
        expects: "0.75"
        hint: >
          Four equally likely pairs; find $\mathbb{E}|X - Y|$ first.
        feedback: >
          The pairs $(0,1), (0,3), (2,1), (2,3)$ have $|X - Y| = 1, 3, 1, 1$,
          so $\mathbb{E}|X - Y| = 1.5$. Then
          $\mathbb{E}[\min] = (1 + 2 - 1.5)/2 = 0.75$. Directly: the minima are
          $0, 0, 1, 2$, mean $0.75$.

      - part: Where the shortcut goes wrong
        ask: >
          For $X$ uniform on $[0, 1]$ and $Y = 1 - X$, someone replaces
          $\mathbb{E}|X - Y|$ by $|\mathbb{E}[X] - \mathbb{E}[Y]|$. What happens?
        choices:
          - text: >
              Nothing: the two are equal whenever the means are finite.
            feedback: >
              Here $|\mathbb{E}[X] - \mathbb{E}[Y]| = 0$ while
              $\mathbb{E}|X - Y| = 1/2$. The absolute value does not pass
              through the expectation.
          - text: >
              They get $\mathbb{E}[\max] = 1/2$, impossible because the max is
              always at least $1/2$ and usually more.
            correct: true
            feedback: >
              $|\mathbb{E}[X] - \mathbb{E}[Y]|$ only matches
              $\mathbb{E}|X - Y|$ when one variable is never below the other.
              Here $X$ and $Y$ cross constantly.
          - text: >
              A small error, since the two differ only when $X$ and $Y$ are
              dependent.
            feedback: >
              In the independent example just before, $\mathbb{E}|X - Y| = 1.5$
              against $|\mathbb{E}[X] - \mathbb{E}[Y]| = 1$. Independence is
              not what makes them agree; never crossing is.
        feedback: >
          $\mathbb{E}|X - Y|$ is the one quantity that has to be computed
          honestly — it carries all the dependence.
      - ask: >
          Can the same trick give $\mathbb{E}[\max(X, Y, Z)]$ for three
          variables?
        choices:
          - text: >
              Yes: $\left(\mathbb{E}[X + Y + Z] + \mathbb{E}|X - Y|\right)/2$.
            feedback: >
              With three variables, max plus min is no longer the sum: the
              middle value is left over, and $|X - Y|$ ignores $Z$ entirely.
          - text: >
              Not directly: max plus min now misses the middle value, so the
              two identities no longer close.
            correct: true
            feedback: >
              The pair identities are special to two variables. For more,
              go back to the distribution of the max itself.
          - text: >
              Yes: average the three pairwise formulas.
            feedback: >
              Each pairwise formula gives the mean of a pairwise max, and the
              average of $\max(X,Y)$, $\max(X,Z)$, $\max(Y,Z)$ is not
              $\max(X,Y,Z)$: with values $0, 0, 1$ it is $2/3$, not $1$.
        feedback: >
          For two variables the answer to say aloud is "max plus min is the
          sum, max minus min is the absolute difference, so I only need
          $\mathbb{E}|X - Y|$" — and it holds with no independence assumption.

  - node: quant-probability.joint.bivariate-normal
    hook: >
      "Given $X=x$, what do you expect $Y$ to be?" for jointly normal
      variables is answered by a straight line with a slope you can read
      off $\rho$ directly — the mental model every linear regression
      argument in finance quietly relies on.
    explanation: >
      Bivariate normality is defined by a closure property, not a formula:
      $(X,Y)$ is bivariate normal precisely when every linear combination
      $aX+bY$ is itself univariate normal. Once that holds, the whole
      joint law collapses to five numbers — the two means, two standard
      deviations, and the single correlation $\rho$ — nothing else about
      the joint shape needs to be specified.

      The conditional law given $X=x$ stays normal, with mean
      $\mu_Y+\rho\dfrac{\sigma_Y}{\sigma_X}(x-\mu_X)$: linear in $x$, which
      is exactly the population regression line, with slope
      $\rho\sigma_Y/\sigma_X$ set entirely by the correlation and the two
      scales. The conditional variance,
      $\sigma_Y^{2}(1-\rho^{2})$, doesn't depend on $x$ at all — knowing
      $X$ shrinks $Y$'s spread by the same fixed factor regardless of
      which value $X$ took.

      Read the slope as shrinkage: a one-standard-deviation move in $X$
      forecasts only a $\rho$-standard-deviation move in $Y$, never a full
      one unless $|\rho|=1$ — the single most useful mental habit this
      node gives you for reading any regression-style forecast.
    worked: >
      Let $\mu_X=\mu_Y=0$, $\sigma_X=2$, $\sigma_Y=3$, $\rho=0.5$. Given
      $X=4$, the conditional mean of $Y$ is
      $0+0.5\times(3/2)\times4=3$, and the conditional variance is
      $9\times(1-0.25)=6.75$, so $Y\mid X=4\sim N(3,6.75)$ — a $2$-sigma
      move in $X$ (since $\sigma_X=2$) forecasts a move to $3$ in $Y$,
      only $1$ standard deviation of $Y$'s unconditional spread, exactly
      the shrinkage $\rho=0.5$ predicts.
    interview: >
      "If $X$ moves up by one standard deviation, how much do you expect
      $Y$ to move?" is testing whether you state the answer as
      "$\rho$ standard deviations" immediately, rather than assuming a
      full one-for-one move. Naming that the conditional variance shrinks
      by $(1-\rho^{2})$ and doesn't depend on $x$ is the natural follow-up.
    pitfalls: >
      Assuming the conditional mean is linear in $x$ for any joint normal
      marginals is backwards — linearity here is a consequence of joint
      normality specifically, not something that holds for arbitrary
      normal-looking pairs. Forgetting the $(1-\rho^{2})$ factor and
      quoting $\sigma_Y^{2}$ as the conditional variance overstates the
      remaining uncertainty once $X$ is known.
    recap: >
      Five numbers fix a bivariate normal pair, and conditioning on $X$
      gives a normal $Y$ with mean linear in $x$ (regression) and variance
      $\sigma_Y^{2}(1-\rho^{2})$ — a $2$-sigma move in $X$ here forecast
      only a $1$-sigma move in $Y$, exactly as $\rho=0.5$ predicts.
    dialogue:
      - part: Part market, part its own news
        teach: >
          $X$ and $Z$ are independent standard normals. $X$ is the market's
          standardized move today, and a stock's standardized move is built as
          $Y = 0.8X + 0.6Z$: part market, part its own news.
      - ask: >
          What is $\operatorname{Var}(Y)$?
        expects: "1"
        feedback: >
          $0.64 + 0.36 = 1$, since $X$ and $Z$ are uncorrelated. $Y$ is a sum
          of independent normals, so it is standard normal too.
      - ask: >
          What is $\operatorname{Corr}(X, Y)$?
        expects: "0.8"
        feedback: >
          $\operatorname{Cov}(X, 0.8X + 0.6Z) = 0.8$, and both standard
          deviations are $1$.
      - ask: >
          The market moved $X = 2$, a two-sigma day. What is your forecast — the
          mean of $Y$ given $X = 2$?
        expects: "1.6"
        hint: >
          Given $X = 2$, what is left random in $Y = 0.8X + 0.6Z$?
        feedback: >
          $Y = 1.6 + 0.6Z$ with $Z$ still standard normal and independent of
          $X$, so the forecast is $1.6$. If you said $2$, you assumed a
          two-sigma market move brings a two-sigma stock move.
      - ask: >
          What is the variance of $Y$ given $X = 2$?
        expects: "0.36"
        feedback: >
          Only $0.6Z$ is left random: $0.6^{2} = 0.36$, against $1$ before you
          saw the market.
      - ask: >
          On a quiet day with $X = 0$, what is the variance of $Y$ given $X$?
        choices:
          - text: >
              Smaller than $0.36$, since a quiet market means a quiet stock.
            feedback: >
              The forecast moves with $X$; the leftover noise $0.6Z$ does not.
              It has variance $0.36$ whatever $X$ was.
          - text: >
              $0.36$, the same as on the two-sigma day.
            correct: true
            feedback: >
              Knowing $X$ removes the same share of $Y$'s variance every day:
              $1 - 0.8^{2} = 0.36$ is left, at any $x$.
          - text: >
              $1$, since knowing $X = 0$ tells you nothing.
            feedback: >
              $X = 0$ is information too: it pins the market part at $0$, and
              only $0.6Z$ remains.
        feedback: >
          The conditional mean slides with $x$; the conditional spread is
          fixed.
      - reflect: >
          $X$ and $Y$ are both standard normal, yet a two-sigma $X$ forecast
          only a $1.6$-sigma $Y$. Say what a one-sigma move in $X$ forecasts in
          general, and why the forecast can never be a full sigma unless the
          correlation is $\pm 1$.
        answer: >
          A one-sigma move in $X$ forecasts a $\rho$-sigma move in $Y$: the
          slope of the forecast line, in standardized units, is the
          correlation. The rest of $Y$ is noise independent of $X$, which
          averages to $0$ in the forecast. Only when that noise is absent,
          $|\rho| = 1$, does the forecast move one for one. This shrinkage is
          regression toward the mean.

      - part: Five numbers fix the law
        teach: >
          $(X, Y)$ is bivariate normal when every combination $aX + bY$ is
          normal — true here, since $aX + bY = (a + 0.8b)X + 0.6bZ$. The law is
          pinned by $\mu_X, \mu_Y, \sigma_X, \sigma_Y, \rho$. Given $X = x$,
          $Y$ is normal with mean
          $\mu_Y + \rho\,(\sigma_Y/\sigma_X)(x - \mu_X)$ and variance
          $\sigma_Y^{2}(1 - \rho^{2})$.
      - ask: >
          Bivariate normal with $\mu_X = 50$, $\sigma_X = 10$, $\mu_Y = 100$,
          $\sigma_Y = 20$ and $\rho = -0.4$. Given $X = 65$, what is the mean
          of $Y$?
        expects: "88"
        feedback: >
          $X$ is $1.5$ sigmas above its mean, so $Y$ is forecast
          $-0.4 \times 1.5 = -0.6$ sigmas from its mean:
          $100 - 0.6 \times 20 = 88$. In the formula,
          $100 + (-0.4)(20/10)(15) = 88$.
      - ask: >
          Given $X = 65$, what is the variance of $Y$?
        expects: "336"
        feedback: >
          $400(1 - 0.16) = 336$. The sign of $\rho$ does not matter for how
          much is explained, only for which way the forecast moves.

      - part: Running the regression backwards
        ask: >
          Back to the market pair with $\rho = 0.8$. The stock moved $Y = 2$.
          What is the forecast of the market move $X$?
        choices:
          - text: >
              $2.5$: invert the line $y = 0.8x$.
            feedback: >
              The line $0.8x$ forecasts $Y$ from $X$; it is not a law linking
              the two exactly. The pair is symmetric, so forecasting $X$ from
              $Y$ shrinks by $\rho$ as well.
          - text: >
              $2$: both are standard normal.
            feedback: >
              Equal marginals do not make the forecast one for one in either
              direction. That needs $\rho = 1$.
          - text: >
              $1.6$
            correct: true
            feedback: >
              The formula is symmetric in the roles: $0 + 0.8(1/1)(2) = 1.6$.
              Each direction shrinks toward the mean by the same factor $\rho$.
        feedback: >
          There are two regression lines, one for each direction, and neither
          is the inverse of the other unless $|\rho| = 1$. In an interview, "a
          one-sigma move in $X$ forecasts a $\rho$-sigma move in $Y$" is the
          sentence to have ready.

  - node: quant-probability.joint.bivariate-normal-independence
    hook: >
      This is the one corner of probability where "uncorrelated" really
      does mean "independent" — and interviewers test it by handing you
      two normal marginals with $\rho=0$ that are secretly not jointly
      normal at all.
    explanation: >
      For a genuinely bivariate normal pair, setting $\rho=0$ in the joint
      density makes the cross term in the exponent vanish, and the density
      literally factors into the product of the two normal marginal
      densities — so $\rho=0$ forces independence in this family
      specifically, unlike the general case where zero covariance never
      implies independence.

      The hypothesis doing all the work is joint normality, not merely
      "each marginal happens to be normal." Two variables can each be
      individually normal, and even uncorrelated, while their joint shape
      is nothing like the bivariate normal's elliptical contours — in
      which case the factorization argument for $\rho=0$ simply doesn't
      apply.

      The standard demonstration that the marginals-alone hypothesis isn't
      enough: take $X\sim N(0,1)$ and an independent random sign
      $S=\pm1$, and set $Y=SX$. Both $X$ and $Y$ are individually
      standard normal, and $\operatorname{Cov}(X,Y)=0$, yet
      $|Y|=|X|$ always — total dependence hiding behind zero correlation
      and two normal marginals, because the pair is never jointly normal.
    worked: >
      Portfolio returns $X,Y$ are jointly normal with $\mu_X=5\%$,
      $\sigma_X=10\%$, $\mu_Y=3\%$, $\sigma_Y=8\%$, and $\rho=0$. Because
      $\rho=0$ and the pair is jointly normal, $X,Y$ are independent, so
      $\Pr(X>15\%,\,Y>11\%)=\Pr(X>15\%)\Pr(Y>11\%)$. Both events are
      exactly one standard deviation above their means, so each has
      probability $\Pr(Z>1)\approx0.1587$, giving a joint probability of
      $0.1587^{2}\approx0.0252$ — a computation that would be invalid
      without both the joint normality and $\rho=0$.
    interview: >
      "$X$ and $Y$ are each normal and uncorrelated — are they
      independent?" is a trap unless joint normality is explicitly stated.
      The correct response asks whether the pair is jointly normal before
      answering, and can produce the $Y=SX$ counterexample if pushed.
    pitfalls: >
      Assuming any pair of individually normal, uncorrelated variables is
      automatically independent skips the joint-normality hypothesis
      entirely — it's the one thing doing all the work. Treating the
      $Y=\pm X$ counterexample as an exotic edge case rather than the
      standard rebuttal undersells how easily two normal marginals can
      hide serious dependence.
    recap: >
      Zero correlation implies independence only for genuinely jointly
      normal pairs — two normal marginals alone are not enough, as
      $Y=\pm X$ with a random sign shows.
    dialogue:
      - part: Can you multiply?
        teach: >
          Two desks' daily P&L, in standardized units, are $X$ and $Y$: jointly
          normal, each standard normal, with correlation $0$. The risk manager
          wants the probability that the first desk loses and the second loses
          more than one sigma on the same day.
      - ask: >
          Treating the two as independent, what is
          $\Pr(X < 0,\ Y < -1)$? Use $\Phi(1) \approx 0.8413$.
        expects: "0.0793"
        tolerance: 0.0005
        feedback: >
          $\Pr(X < 0) = 0.5$ and $\Pr(Y < -1) = 1 - 0.8413 = 0.1587$, so the
          product is about $0.0793$. The question is whether you were entitled
          to multiply.
      - ask: >
          What entitles you to treat them as independent?
        choices:
          - text: >
              Correlation $0$: uncorrelated variables can always be multiplied
              like this.
            feedback: >
              The four points $(\pm 1, 0)$ and $(0, \pm 1)$ have correlation $0$
              and are dependent. Zero correlation alone never licenses
              independence.
          - text: >
              Each of $X$ and $Y$ is normal.
            feedback: >
              The marginals say nothing about how the two are paired. You will
              see two standard normals with correlation $0$ that are tied
              together completely.
          - text: >
              Correlation $0$ together with joint normality.
            correct: true
            feedback: >
              Neither alone is enough. Together they are, for a reason worth
              finding.
        feedback: >
          The hypothesis is about the pair, not about each variable.
      - reflect: >
          A bivariate normal law is pinned by five numbers. Use that fact, and
          a pair you already know is independent, to show that any jointly
          normal pair with standard marginals and $\rho = 0$ is independent.
        hint: >
          Take $X$ and $Z$ independent standard normals. Is $(X, Z)$ jointly
          normal, and what are its five numbers?
        answer: >
          Independent standard normals $(X, Z)$ form a bivariate normal pair,
          since every $aX + bZ$ is a sum of independent normals and so normal.
          Its five numbers are $0, 0, 1, 1, 0$. Any other jointly normal pair
          with those five numbers has the same law, and independence is a
          property of the law. So $\rho = 0$ plus joint normality gives
          independence.

      - part: Normal marginals are not enough
        teach: >
          Jointly normal and uncorrelated implies independent. Now a different
          pair: $X$ standard normal, and $Y = X$ when $|X| > 1.54$ but
          $Y = -X$ when $|X| \le 1.54$. The cutoff, rounded, is chosen so that
          $\mathbb{E}[X^{2};\ |X| \le 1.54] = 1/2$, which makes
          $\operatorname{Cov}(X, Y) = 1/2 - 1/2 = 0$.
      - ask: >
          Is $Y$ standard normal?
        choices:
          - text: >
              No: flipping the sign on the middle of the range skews it.
            feedback: >
              The flipped region $[-1.54, 1.54]$ is symmetric, and the normal
              density is symmetric on it, so flipping it maps the law to
              itself.
          - text: >
              Yes: flipping the sign of $X$ on a symmetric set leaves its law
              unchanged.
            correct: true
            feedback: >
              $\Pr(Y \in A)$ splits over $|X| > 1.54$ and $|X| \le 1.54$, and
              on the second piece $-X$ has the same law as $X$.
          - text: >
              No: $Y$ is a function of $X$, so it cannot have the same law.
            feedback: >
              $-X$ is a function of $X$ with exactly the law of $X$. Being a
              function of $X$ says nothing about $Y$'s own law.
        feedback: >
          Two standard normal marginals, correlation $0$.
      - ask: >
          What is $\Pr(X + Y = 0)$? Use $\Phi(1.54) \approx 0.938$.
        expects: "0.876"
        tolerance: 0.002
        hint: >
          $X + Y$ is $0$ exactly on the flipped region.
        feedback: >
          $X + Y = 0$ when $|X| \le 1.54$:
          $2\Phi(1.54) - 1 \approx 0.876$.
      - ask: >
          Is $(X, Y)$ bivariate normal?
        choices:
          - text: >
              Yes: both marginals are normal.
            feedback: >
              Normal marginals are a consequence of joint normality, not a
              definition of it.
          - text: >
              Yes: the correlation is $0$, and two uncorrelated normals form a
              bivariate normal pair.
            feedback: >
              That is the claim this pair refutes. Check one combination.
          - text: >
              No: $X + Y$ sits at the single value $0$ with probability $0.876$,
              which no normal variable does.
            correct: true
            feedback: >
              A normal variable with positive variance has no atoms, and
              $X + Y$ is not constant. One non-normal combination is enough.
        feedback: >
          Joint normality asks about every combination $aX + bY$; here
          $a = b = 1$ fails it.
      - ask: >
          What is $\Pr(|Y| > 2 \mid |X| < 1)$?
        expects: "0"
        feedback: >
          $|Y| = |X|$ always, so $|X| < 1$ forces $|Y| < 1$. Unconditionally
          $\Pr(|Y| > 2) \approx 0.046$. Uncorrelated, standard normal
          marginals, and completely dependent.

      - part: Putting it to work
        ask: >
          Back to a genuinely jointly normal pair with standard marginals and
          $\rho = 0$. What is $\Pr(\max(X, Y) \le 1)$? Use
          $\Phi(1) \approx 0.8413$.
        expects: "0.7078"
        tolerance: 0.001
        feedback: >
          $\max(X, Y) \le 1$ means both are at most $1$, and independence
          gives $0.8413^{2} \approx 0.7078$.
      - ask: >
          $X$ and $Z$ are independent standard normals, $U = X + Z$ and
          $W = X - Z$. Are $U$ and $W$ independent?
        choices:
          - text: >
              No: both are built from the same $X$ and $Z$.
            feedback: >
              Sharing ingredients makes dependence possible, not certain. Check
              the covariance and the joint law.
          - text: >
              Cannot tell without the joint density of $(U, W)$.
            feedback: >
              You have enough already: the pair is jointly normal, and that
              plus one covariance settles it.
          - text: >
              Yes: $(U, W)$ is jointly normal and
              $\operatorname{Cov}(U, W) = 1 - 1 = 0$.
            correct: true
            feedback: >
              Every $aU + bW = (a + b)X + (a - b)Z$ is normal, so the pair is
              jointly normal, and uncorrelated means independent here.
        feedback: >
          For jointly normal pairs, one covariance settles independence. When
          asked whether two uncorrelated normals are independent, ask first
          whether they are jointly normal.

  - node: quant-probability.joint.multivariate-normal
    hook: >
      Every "what's the mean and variance of this weighted basket" question
      about a multivariate normal vector reduces to one line,
      $a'X\sim N(a'\mu,a'\Sigma a)$ — the entire point of packaging a
      whole vector's law into just $\mu$ and $\Sigma$.
    explanation: >
      The definition generalizes bivariate normality directly: $X=(X_1,
      \dots,X_n)$ is multivariate normal when every linear combination
      $a'X$ is univariate normal, and in that case $a'X\sim
      N(a'\mu,a'\Sigma a)$ — the mean is the ordinary weighted average
      $a'\mu$, and the variance is the covariance matrix's quadratic form
      already familiar from portfolio variance.

      Three structural consequences follow with no extra work: any
      subvector of $X$ is again multivariate normal (drop the coordinates
      you don't need), affine images stay in the family with
      $AX+b\sim N(A\mu+b,A\Sigma A')$, and any block of coordinates with
      zero cross-covariance to another block is independent of it — the
      bivariate independence fact extended block by block.

      Every valid $(\mu,\Sigma)$ pair is realizable: starting from
      independent standard normal coordinates $Z$ and any matrix $A$ with
      $AA'=\Sigma$, the vector $X=\mu+AZ$ has exactly the target mean and
      covariance, which is also the computational recipe for simulating
      correlated normal vectors from independent building blocks.
    worked: >
      Three assets have mean vector $\mu=(0.05,0.03,0.02)$, variances
      $0.04,0.09,0.01$, and covariances $\operatorname{Cov}(1,2)=0.01$,
      $\operatorname{Cov}(2,3)=0.02$, $\operatorname{Cov}(1,3)=0$. For
      portfolio weights $a=(0.5,0.3,0.2)$: $a'\mu
      =0.5(0.05)+0.3(0.03)+0.2(0.02)=0.038$, and expanding $a'\Sigma a$
      termwise gives $0.5^{2}(0.04)+0.3^{2}(0.09)+0.2^{2}(0.01)
      +2(0.5)(0.3)(0.01)+2(0.3)(0.2)(0.02)+2(0.5)(0.2)(0)=0.01+0.0081
      +0.0004+0.003+0.0024+0=0.0239$. So the portfolio return is
      $N(0.038,\,0.0239)$ — mean $3.8\%$, standard deviation
      $\approx15.5\%$.
    interview: >
      "What's the distribution of this weighted basket of correlated
      normal assets?" wants $a'X\sim N(a'\mu,a'\Sigma a)$ stated
      immediately, with $a'\Sigma a$ expanded as diagonal terms plus
      weighted pairwise covariances, not re-derived from variance-of-a-sum
      each time.
    pitfalls: >
      Computing $a'\Sigma a$ by summing only the diagonal contributions
      $a_i^{2}\Sigma_{ii}$ and forgetting the off-diagonal
      $2a_ia_j\Sigma_{ij}$ terms silently drops the entire dependence
      structure. Assuming any $(\mu,\Sigma)$ with $\Sigma$ merely symmetric
      (not positive semidefinite) is realizable ignores the constraint
      that rules out invalid covariance structures.
    recap: >
      A multivariate normal vector is fully described by $\mu$ and
      $\Sigma$, and any weighted combination is normal with variance
      $a'\Sigma a$ — for this three-asset basket, mean $3.8\%$ and
      standard deviation about $15.5\%$.
    dialogue:
      - part: Three vectors built from normals
        teach: >
          $Z_1, Z_2, Z_3$ are independent standard normals. Three random
          vectors: $A = (Z_1,\ Z_1 + Z_2,\ Z_1 - Z_3)$;
          $B = (Z_1,\ Z_2,\ Z_1 Z_2)$; and $C = (Z_1,\ Z_2,\ W)$, where
          $W = Z_1$ when $Z_2 > 0$ and $W = -Z_1$ otherwise.
      - ask: >
          $W$ is $Z_1$ times a fair sign independent of $Z_1$, so $W$ is
          standard normal. What is $\Pr(Z_1 + W = 0)$?
        expects: "0.5"
        feedback: >
          $Z_1 + W = 0$ exactly when the sign is negative, that is when
          $Z_2 \le 0$: probability $1/2$. Every coordinate of $C$ is standard
          normal, yet this combination of them sits at $0$ half the time.
      - ask: >
          Which of the three vectors deserves to be called jointly normal?
        choices:
          - text: >
              A and C: every coordinate of each is normal.
            feedback: >
              $C$'s coordinates are all normal, but $Z_1 + W$ has an atom at
              $0$, so not every combination of them is normal.
          - text: >
              A only.
            correct: true
            feedback: >
              Every combination of $A$'s coordinates is a combination of
              $Z_1, Z_2, Z_3$, hence a sum of independent normals, hence
              normal.
          - text: >
              All three: each is built from independent normals.
            feedback: >
              $B$'s third coordinate $Z_1 Z_2$ is a product, not a sum, and is
              not normal at all — its density has a spike at $0$.
        feedback: >
          $B$ fails already at a single coordinate. $C$ passes every
          coordinate and fails on a combination.
      - reflect: >
          Say exactly what you were checking, and why checking each coordinate
          separately would have passed $C$ wrongly.
        answer: >
          Whether every linear combination $a'X$ of the coordinates is normal.
          Coordinates are only the combinations with one nonzero weight, so a
          vector can have normal coordinates and still fail on
          $Z_1 + W$. Joint normality is a statement about the whole vector,
          and it is exactly what makes every portfolio of the coordinates
          normal.

      - part: Mean vector, covariance matrix, and nothing else
        teach: >
          $X = (X_1, \dots, X_n)$ is multivariate normal with mean $\mu$ and
          covariance matrix $\Sigma$ when $a'X$ is normal for every constant
          $a$; then $a'X \sim N(a'\mu,\ a'\Sigma a)$. Subvectors and affine
          images $AX + b \sim N(A\mu + b,\ A\Sigma A')$ stay in the family, and
          blocks with zero cross-covariance are independent.
      - ask: >
          Let $X_1 = 1 + Z_1$ and $X_2 = 2 + Z_1 + Z_2$. What is the variance
          of $2X_1 + X_2$?
        expects: "10"
        hint: >
          $\Sigma$ has variances $1$ and $2$ and covariance $1$; or write
          $2X_1 + X_2$ in terms of $Z_1$ and $Z_2$.
        feedback: >
          $a'\Sigma a = 4(1) + 2(2)(1)(1) + 1(2) = 10$. Directly,
          $2X_1 + X_2 = 4 + 3Z_1 + Z_2$, with variance $9 + 1 = 10$. So
          $2X_1 + X_2 \sim N(4, 10)$.
      - ask: >
          What is $\Pr(X_1 > X_2)$? Use $\Phi(1) \approx 0.8413$.
        expects: "0.1587"
        tolerance: 0.0005
        hint: >
          $X_1 - X_2$ is a linear combination, so it is normal. Find its mean
          and variance.
        feedback: >
          $X_1 - X_2 = -1 - Z_2 \sim N(-1, 1)$, so
          $\Pr(X_1 - X_2 > 0) = \Pr(Z_2 < -1) = 1 - 0.8413 = 0.1587$.
      - ask: >
          Are $X_1$ and $X_2 - X_1$ independent?
        choices:
          - text: >
              No: $X_2$ contains $Z_1$, which is all of $X_1$.
            feedback: >
              Subtracting $X_1$ removes that shared $Z_1$:
              $X_2 - X_1 = 1 + Z_2$.
          - text: >
              Yes: the pair is jointly normal and its cross-covariance is $0$.
            correct: true
            feedback: >
              $\operatorname{Cov}(X_1, X_2 - X_1) = \Sigma_{12} - \Sigma_{11} = 1 - 1 = 0$,
              and inside a multivariate normal vector zero covariance means
              independence.
          - text: >
              Only if their means are $0$.
            feedback: >
              Means are shifts, and shifts never affect independence.
        feedback: >
          Zero cross-covariance splits a multivariate normal vector into
          independent blocks — the one place where computing a covariance
          settles independence.

      - part: Building any covariance you want
        ask: >
          You want a standard normal pair with correlation $0.6$. Set
          $X_1 = Z_1$ and $X_2 = 0.6Z_1 + dZ_2$ with $d > 0$. What must $d$ be?
        expects: "0.8"
        feedback: >
          $\operatorname{Cov}(X_1, X_2) = 0.6$ already, and
          $\operatorname{Var}(X_2) = 0.36 + d^{2} = 1$ gives $d = 0.8$. This is
          $X = AZ$ with $AA' = \Sigma$: the recipe for simulating correlated
          normals from independent ones.
      - ask: >
          Can the same recipe produce a pair with variances $1$ and $1$ and
          covariance $2$?
        choices:
          - text: >
              Yes: choose $A$ with $AA'$ equal to that matrix.
            feedback: >
              No real $A$ exists. $AA'$ is always positive semidefinite, and
              this matrix gives $\operatorname{Var}(X_1 - X_2) = 1 + 1 - 4 = -2$.
          - text: >
              No: the matrix is not positive semidefinite, so no random vector
              has it as a covariance matrix.
            correct: true
            feedback: >
              Covariance $2$ exceeds $\sigma_1\sigma_2 = 1$, which would mean a
              correlation of $2$. Any symmetric PSD matrix is attainable;
              this one is not PSD.
          - text: >
              Yes, provided the means are chosen to compensate.
            feedback: >
              Means shift the vector and never touch its covariance. The
              problem is in $\Sigma$ itself.
        feedback: >
          Every $\mu$ and every symmetric positive semidefinite $\Sigma$ is
          attained by $X = \mu + AZ$; nothing else is. In an interview, the
          weighted basket's law is one line: $a'X \sim N(a'\mu,\ a'\Sigma a)$.
