unit: quant-tools.series-calculus
opening: >
  This unit is the arithmetic toolkit the rest of the tree assumes is already automatic — closed forms for the sums an interview throws at you cold, and the handful of integrals and asymptotics that turn a hard expectation into a number at the whiteboard. It runs in order: arithmetic and geometric sums and the telescoping trick that generates the power sums and harmonic numbers, Taylor expansion and the standard series and compounding limit it produces, the double-sum swap that unlocks the Gaussian integral and the Gamma and Beta functions and Stirling's approximation, and finally AM–GM and Cauchy–Schwarz alongside the habit of naming which term dominates before computing anything. By the end, seeing $t^n e^{-\lambda t}$, $(1+x/n)^n$, or a rational summand with a factorable denominator should trigger the closed form immediately, not a derivation from scratch.
lessons:
  - node: quant-tools.series-calculus.arithmetic-series
    hook: >
      "Sum the integers from $1$ to $100$" and its relatives are the single most common opening warm-up in a quant interview, and the expected answer is Gauss's pairing trick recalled instantly, not long addition.
    explanation: >
      Gauss's trick works because reversing the sum and adding it to itself turns $n$ unequal terms into $n$ identical pairs: writing $S = a_1 + a_2 + \cdots + a_n$ and $S = a_n + a_{n-1} + \cdots + a_1$ underneath, each column adds to the same total $a_1 + a_n$, so $2S = n(a_1+a_n)$ and dividing by two gives the formula. The result is really just "count times average" — an arithmetic sequence is symmetric around its midpoint, so the sum equals the number of terms times the value sitting at that midpoint.

      A second way to see $1 + \cdots + n = n(n+1)/2$ is geometric: a staircase of $1,2,\ldots,n$ unit squares, doubled by a rotated copy of itself, exactly fills an $n\times(n+1)$ rectangle, so the staircase is half that area. The odd-number case has its own visual proof worth keeping: adding the $k$-th odd number extends a $(k-1)\times(k-1)$ square into a $k\times k$ square by wrapping an L-shaped border of $2k-1$ new unit squares around it, so after $n$ steps the accumulated area is exactly $n^2$.

      The test for whether a sum is arithmetic at all is to difference consecutive terms — if $a_{k+1}-a_k$ is the same constant for every $k$, the closed form applies directly; a sum that looks complicated is very often exactly this in disguise.
    worked: >
      Sum the first $15$ positive multiples of $7$: $a_1=7$, $a_{15}=105$, $d=7$. The count-times-average formula gives $\dfrac{15(7+105)}{2} = \dfrac{15\cdot 112}{2} = 15\cdot 56 = 840$, so the fifteen multiples of $7$ from $7$ through $105$ sum to $840$.
    interview: >
      The direct form is "sum $1$ through $n$" or "sum every multiple of $k$ up to $N$" asked as a speed check; the interviewer listens for the closed form recalled in one line, not a running total. A sharper version hides the arithmetic structure inside a word problem — equally spaced payment dates, evenly spaced seat numbers — and rewards spotting the constant difference before reaching for a formula.
    pitfalls: >
      Miscounting the number of terms is the most common slip: for a sequence starting at $a$ with common difference $d$ ending at $\ell$, the count is $n=(\ell-a)/d+1$, not $\ell/d$. Applying the formula to a sequence whose differences are not actually constant silently gives a wrong answer with no warning.
    recap: >
      An arithmetic sum is the number of terms times the average of the first and last, $n(a_1+a_n)/2$, provable by pairing the sum with its own reversal.
    steps:
      - teach: >
          Gauss's trick is to write the sum twice, once forward and once
          reversed, and add the two copies vertically. Every column lands on
          the same total $a_1+a_n$, so $n$ such pairs give $2S=n(a_1+a_n)$.
      - teach: >
          Dividing by two gives the closed form $S=n(a_1+a_n)/2$: the count
          of terms times the average of the first and last. An arithmetic
          sequence is symmetric around its midpoint, and that average *is*
          the midpoint value.
      - ask: >
          An arithmetic sequence starts at $a_1=3$ with common difference
          $5$ and runs for $20$ terms. What is its sum?
        expects: "1010"
        hint: >
          Find $a_{20}=3+19\cdot5$ first, then apply count times average.
        feedback: >
          $a_{20}=3+19\cdot5=98$, so $S=\dfrac{20(3+98)}{2}=10\cdot101
          =1010$.
      - teach: >
          Before trusting the formula, count the terms correctly: for a
          sequence starting at $a$ with common difference $d$ and ending at
          $\ell$, the count is $n=(\ell-a)/d+1$, not $\ell/d$.
      - ask: >
          How many terms are in the sequence $4, 7, 10, \ldots, 100$?
        expects: "33"
        hint: >
          Apply $n=(\ell-a)/d+1$ with $a=4$, $d=3$, $\ell=100$.
        feedback: >
          $n=(100-4)/3+1=32+1=33$ terms.
      - teach: >
          Miscounting the term count is the most common slip with this
          formula — check it against the endpoints directly rather than
          guessing.
      - ask: >
          What is the sum of the first $9$ odd numbers, $1+3+5+\cdots+17$?
        expects: "81"
        hint: >
          The first $n$ odd numbers sum to $n^2$.
        feedback: >
          $9^2=81$ — the odd-number identity is this formula in disguise.
      - teach: >
          Whenever consecutive differences are constant, this closed form
          applies directly — difference the terms before reaching for
          anything harder.

  - node: quant-tools.series-calculus.geometric-series
    hook: >
      Perpetuity-style cash flow problems, and any "probability of first success by trial $k$" calculation, both collapse to this one closed form, and interviewers expect the finite and infinite cases both fluent, including exactly where $r=1$ breaks the formula.
    explanation: >
      Write $S = a + ar + \cdots + ar^{n-1}$ and multiply through by $r$ to get $rS = ar + \cdots + ar^n$. Subtracting cancels every interior term, leaving $S-rS = a - ar^n$, so $S = a\,\dfrac{1-r^n}{1-r}$ whenever $r\ne 1$ — the shift-and-subtract trick is the whole proof, and it only fails at $r=1$, where every term equals $a$ and the sum is just $na$ by inspection.

      The mental model is decay: each term is the previous one shrunk by the same factor $r$, so if $|r|<1$ the tail shrinks to nothing and $r^n\to 0$, leaving the finite formula's limit $a/(1-r)$ as the infinite sum. If $|r|\ge 1$ the terms never shrink, so the partial sums cannot settle down and the series diverges.

      The tail form follows for free: summing from $k=m$ onward is the same series with first term $ar^m$ instead of $a$, so $\sum_{k\ge m} ar^k = ar^m/(1-r)$ — useful whenever a problem's series doesn't conveniently start at $k=0$.
    worked: >
      Evaluate $\sum_{k\ge 4} (1/3)^k$. This is the tail form with $a=1$, $r=1/3$, $m=4$: $\dfrac{(1/3)^4}{1-1/3} = \dfrac{1/81}{2/3} = \dfrac{1}{81}\cdot\dfrac{3}{2} = \dfrac{1}{54}$, so the sum is $1/54 \approx 0.0185$.
    interview: >
      "Value a perpetuity that grows at rate $g$ forever, discounted at rate $r$" is this formula wearing finance clothes; so is "what's the probability the first success comes on an odd-numbered trial", summing a geometric series over every other index. The interviewer listens for whether you check $|r|<1$ before writing down the infinite-sum answer.
    pitfalls: >
      Using $a/(1-r)$ when $|r|\ge 1$ gives a finite-looking number for a series that actually diverges — always confirm $|r|<1$ first. Plugging $r=1$ into $a(1-r^n)/(1-r)$ divides by zero; that case is $na$, not a limit of the general formula.
    recap: >
      A constant ratio between terms gives $a(1-r^n)/(1-r)$ finitely and $a/(1-r)$ exactly when $|r|<1$, with the tail form $ar^m/(1-r)$ for series that start later.
    steps:
      - teach: >
          A perpetuity's value and "probability the first success lands on
          trial $k$" both collapse to this one closed form. The interviewer
          expects the finite and infinite cases both fluent, including
          exactly where $r=1$ breaks the formula.
      - teach: >
          Multiply $S=a+ar+\cdots+ar^{n-1}$ through by $r$ and subtract:
          every interior term cancels, leaving $S(1-r)=a-ar^n$, so
          $S=a\,\dfrac{1-r^n}{1-r}$ for $r\ne1$, and $S=na$ when $r=1$.
      - ask: >
          Evaluate $\sum_{k=0}^{3} 6(1/2)^k$, the sum of $6, 3, 1.5, 0.75$.
        expects: "11.25"
        hint: >
          Use $a=6$, $r=1/2$, $n=4$ terms in the finite formula.
        feedback: >
          $S=6\cdot\dfrac{1-(1/2)^4}{1-1/2}=6\cdot\dfrac{15/16}{1/2}
          =6\cdot\dfrac{15}{8}=\dfrac{90}{8}=11.25$.
      - teach: >
          If $|r|<1$ the tail shrinks to nothing, so the finite formula's
          limit $a/(1-r)$ *is* the infinite sum. The tail form
          $\sum_{k\ge m} ar^k=ar^m/(1-r)$ handles series that start later
          than $k=0$.
      - ask: >
          Evaluate the infinite sum $\sum_{k\ge 0} 5(0.2)^k$.
        expects: "6.25"
        hint: >
          Apply $a/(1-r)$ with $a=5$, $r=0.2$.
        feedback: >
          $S=\dfrac{5}{1-0.2}=\dfrac{5}{0.8}=6.25$.
      - teach: >
          Always confirm $|r|<1$ before writing down the infinite-sum answer
          — $a/(1-r)$ produces a finite-looking number even when the series
          actually diverges.
      - ask: >
          Evaluate the tail sum $\sum_{k\ge 2} (1/4)^k$.
        expects: "1/12"
        hint: >
          Use the tail form with $a=1$, $r=1/4$, $m=2$.
        feedback: >
          $S=\dfrac{(1/4)^2}{1-1/4}=\dfrac{1/16}{3/4}=\dfrac{1}{16}
          \cdot\dfrac{4}{3}=\dfrac{1}{12}$.
      - teach: >
          Decay is the mental model: each term shrinks by the same factor
          $r$, and whether that shrinkage wins or the terms sit still is
          exactly the $|r|<1$ test.

  - node: quant-tools.series-calculus.geometric-derivative
    hook: >
      "Find $\mathbb{E}[X]$ for a geometric random variable" and "evaluate $\sum n/2^n$" are the same weighted-sum problem, and differentiating the closed form you already know is faster than any direct resummation trick.
    explanation: >
      Differentiating $\sum_{k\ge 0} x^k = 1/(1-x)$ term by term is legal for $|x|<1$, strictly inside the radius of convergence, and it turns each $x^k$ into $kx^{k-1}$ — exactly the weight $k$ you want, sitting one power too low. Multiplying the differentiated identity by $x$ restores the power, giving $\sum_{k\ge 1} kx^k = x/(1-x)^2$.

      The same move iterates: differentiate $x/(1-x)^2$ again and multiply by $x$ once more, and the algebra produces $\sum_{k\ge 1} k^2x^k = x(1+x)/(1-x)^3$ — each differentiation buys one more factor of $k$ in the weight, at the cost of one more power of $(1-x)$ in the denominator.

      The general recipe is worth keeping as a reflex: differentiating a generating function pulls down a factor of the index, and integrating instead divides by it, so $\sum x^k/k$ comes from integrating $1/(1-x)$ rather than differentiating it. Recognizing which direction a weighted sum needs is the whole skill.
    worked: >
      At $x=1/3$: $\sum_{k\ge 1} k(1/3)^k = \dfrac{x}{(1-x)^2} = \dfrac{1/3}{(2/3)^2} = \dfrac{1/3}{4/9} = \dfrac{1}{3}\cdot\dfrac{9}{4} = \dfrac{3}{4}$, so the weighted sum evaluates to $3/4$.
    interview: >
      "A geometric random variable has success probability $p$ — find its mean" applies this directly to $\sum_k k(1-p)^{k-1}p$; a bare version, "evaluate $\sum n/2^n$", tests whether you reach for differentiation instead of hunting for a telescoping trick that doesn't exist here.
    pitfalls: >
      Forgetting the extra factor of $x$ after differentiating — leaving $\sum kx^{k-1}$ instead of $\sum kx^k$ — is the most common slip and throws off every downstream computation by a factor of $x$. Differentiating outside the radius of convergence, at $|x|\ge 1$, produces a formula with no convergent sum behind it.
    recap: >
      Differentiate $1/(1-x)$ term by term and rescale by $x$ to price $\sum kx^k$; at $x=1/3$ the sum is $3/4$, and integrating instead handles weights of $1/k$.
    steps:
      - teach: >
          "$\mathbb{E}[X]$ for a geometric random variable" and "evaluate
          $\sum n/2^n$" are the same weighted-sum problem, and
          differentiating the closed form you already know beats hunting
          for a resummation trick.
      - teach: >
          Differentiating $\sum_{k\ge0}x^k=1/(1-x)$ term by term, legal for
          $|x|<1$, turns $x^k$ into $kx^{k-1}$. Multiplying by $x$ restores
          the power: $\sum_{k\ge1}kx^k=x/(1-x)^2$.
      - ask: >
          Evaluate $\sum_{k\ge1} k(1/4)^k$.
        expects: "4/9"
        hint: >
          Use $x/(1-x)^2$ at $x=1/4$.
        feedback: >
          $\dfrac{1/4}{(3/4)^2}=\dfrac{1/4}{9/16}=\dfrac{1}{4}\cdot
          \dfrac{16}{9}=\dfrac{16}{36}=\dfrac{4}{9}$.
      - teach: >
          Differentiate again and multiply by $x$ once more to buy another
          factor of $k$: $\sum_{k\ge1}k^2x^k=x(1+x)/(1-x)^3$. Each pass
          costs one more power of $(1-x)$ in the denominator.
      - ask: >
          Evaluate $\sum_{k\ge1} k^2(1/4)^k$.
        expects: "20/27"
        hint: >
          Use $x(1+x)/(1-x)^3$ at $x=1/4$.
        feedback: >
          $\dfrac{(1/4)(5/4)}{(3/4)^3}=\dfrac{5/16}{27/64}=\dfrac{5}{16}
          \cdot\dfrac{64}{27}=\dfrac{320}{432}=\dfrac{20}{27}$.
      - teach: >
          Forgetting the extra factor of $x$ after differentiating —
          leaving $\sum kx^{k-1}$ instead of $\sum kx^k$ — is the most
          common slip, and it throws off the answer by a factor of $x$.
      - ask: >
          Which operation turns $\sum_{k\ge0}x^k$ into a sum weighted by
          $1/k$ instead of $k$?
        choices:
          - text: >
              Differentiate term by term.
            feedback: >
              Differentiating pulls an extra factor of $k$ down, moving
              toward *heavier* weights, the opposite direction.
          - text: >
              Integrate term by term.
            correct: true
            feedback: >
              Integrating $x^k$ raises the power by one and divides by the
              new exponent, producing exactly a $1/k$-type weight.
          - text: >
              Multiply through by $x$.
            feedback: >
              That only shifts the power by one; it never changes the
              weight attached to each term.
        feedback: >
          Differentiating a generating function pulls down a factor of the
          index; integrating instead divides by it — recognizing which
          direction a weighted sum needs is the whole skill.
      - teach: >
          At $x=1/4$ the two weighted sums come out to $4/9$ and $20/27$ —
          keep the recipe, not the numbers: differentiate and rescale for
          $\sum kx^k$, integrate for $\sum x^k/k$.

  - node: quant-tools.series-calculus.telescoping
    hook: >
      Any rational summand whose denominator factors is a telescoping sum wearing a disguise, and partial fractions is exactly the tool that manufactures the cancelling difference.
    explanation: >
      Whenever the summand can be written as $b_{k+1}-b_k$ for some sequence $b$, the sum from $k=1$ to $n$ collapses because every interior value appears once with a $+$ sign (as a $b_{k+1}$) and once with a $-$ sign one step later (as the next term's $b_k$) — only $b_{n+1}$ at the top and $-b_1$ at the bottom survive.

      Partial fractions manufactures that difference from a rational summand: split $\dfrac{1}{k(k+1)}$ into $\dfrac{1}{k}-\dfrac{1}{k+1}$ by the cover-up method, and the difference is exactly a $b_k-b_{k+1}$ pair with $b_k=1/k$. Whenever the denominator factors into pieces that differ by a fixed shift, this decomposition exists.

      Check one thing before trusting the cancellation: the shift in the decomposition must match the sum's own index step exactly. A term written as a difference of things two apart, like $\tfrac{1}{k}-\tfrac{1}{k+2}$, leaves two boundary terms uncancelled at each end, not one — treat it as its own case rather than assuming the single-term pattern.
    worked: >
      Sum $\sum_{k=1}^{4} \dfrac{2}{(2k-1)(2k+1)}$. Partial fractions give $\dfrac{2}{(2k-1)(2k+1)} = \dfrac{1}{2k-1}-\dfrac{1}{2k+1}$, so the sum telescopes to $1 - \dfrac{1}{9} = \dfrac{8}{9} \approx 0.889$.
    interview: >
      "Evaluate $\sum_{k=1}^{n} 1/(k(k+1))$" is the canonical warm-up; the interviewer wants the partial-fraction split and the words "only the first and last terms survive" said explicitly, not a guessed closed form. Product telescoping shows up too, simplifying things like $\prod_k(1-1/k^2)$ through ratios.
    pitfalls: >
      Assuming any rational summand telescopes without checking that partial fractions actually produces a matching shift wastes time on a dead end. Miscounting which boundary terms survive when the decomposition's shift is larger than the sum's index step leaves a spurious extra term in the final answer.
    recap: >
      Write the summand as a difference of consecutive sequence terms and the interior cancels completely — $\sum 2/((2k-1)(2k+1))$ over four terms collapses to $8/9$.
    steps:
      - teach: >
          Any rational summand whose denominator factors is a telescoping
          sum wearing a disguise — partial fractions is exactly the tool
          that manufactures the cancelling difference.
      - teach: >
          Whenever the summand is $b_k-b_{k+1}$ for some sequence $b$,
          every interior value cancels and only the two ends survive:
          $\sum_{k=1}^n(b_k-b_{k+1})=b_1-b_{n+1}$.
      - ask: >
          Evaluate $\sum_{k=1}^{6}\left(\dfrac{1}{k+1}-\dfrac{1}{k+2}
          \right)$.
        expects: "3/8"
        hint: >
          Only the first term's $b_1$ and the last term's $b_{n+1}$
          survive.
        feedback: >
          With $b_k=1/(k+1)$, the sum is $b_1-b_7=\dfrac12-\dfrac18
          =\dfrac38$.
      - teach: >
          Partial fractions manufactures that difference from a rational
          summand: $\dfrac{1}{k(k+1)}=\dfrac{1}{k}-\dfrac{1}{k+1}$ by the
          cover-up method, whenever the denominator's two factors differ by
          a fixed shift.
      - ask: >
          Evaluate $\sum_{k=3}^{8} \dfrac{1}{k(k+1)}$.
        expects: "2/9"
        hint: >
          Split into $\dfrac1k-\dfrac1{k+1}$ and see which terms survive
          from $k=3$ to $k=8$.
        feedback: >
          The sum telescopes to $\dfrac13-\dfrac19=\dfrac39-\dfrac19
          =\dfrac29$.
      - teach: >
          Check the shift before trusting the cancellation: it must match
          the sum's own index step. A summand written as a difference of
          things *two* apart leaves two boundary terms uncancelled at each
          end, not one.
      - ask: >
          Evaluate $\sum_{k=1}^{3}\left(\dfrac1k-\dfrac1{k+2}\right)$.
        expects: "21/20"
        hint: >
          With a shift of $2$, two terms survive at the start and two at
          the end — write them all out for $n=3$ before cancelling.
        feedback: >
          $\left(1+\dfrac12\right)-\left(\dfrac14+\dfrac15\right)
          =\dfrac32-\dfrac{9}{20}=\dfrac{21}{20}$ — treating it like the
          single-term pattern would wrongly cancel $\dfrac12$ against
          $\dfrac13$.
      - teach: >
          Product telescoping works by the identical logic, just
          multiplicatively: consecutive ratios cancel the same way
          consecutive differences do.

  - node: quant-tools.series-calculus.power-sums
    hook: >
      Variance of a discrete uniform random variable — a die roll, a random rank — needs $\sum k^2$ on the spot, and rederiving it from telescoping is faster and safer than trusting a half-remembered formula.
    explanation: >
      The closed forms for $\sum k^2$ and $\sum k^3$ fall out of telescoping applied to a higher power: summing the identity $(k+1)^3-k^3 = 3k^2+3k+1$ over $k=1,\ldots,n$ collapses the left side to $(n+1)^3-1$, and expanding the right side gives $3\sum k^2 + 3\sum k + n$ — a linear equation for $\sum k^2$ once $\sum k=n(n+1)/2$ is substituted in from the arithmetic series formula. The same trick one power up, starting from $(k+1)^4-k^4$, isolates $\sum k^3$.

      The result $\sum k^3 = (\sum k)^2$ is worth keeping as a checkable mnemonic rather than a coincidence to memorize separately — any value of $\sum k^3$ you compute should come out to a perfect square equal to $(n(n+1)/2)^2$.

      For a fast size check rather than the exact value, $\sum_{k=1}^n k^p$ grows like $n^{p+1}/(p+1)$, matching $\int_0^n x^p\,dx$ — before trusting an exact computation, checking its leading behavior matches this rate catches an algebra slip immediately.
    worked: >
      At $n=6$: $\sum k=21$, $\sum k^2 = \dfrac{6\cdot 7\cdot 13}{6}=91$, and $\sum k^3 = 21^2 = 441$ — indeed $441$ is exactly the square of $21$, confirming the mnemonic.
    interview: >
      "What's the variance of a fair die roll" needs $\sum k^2$ for $k=1$ to $6$ mid-calculation; a bare version, "sum the squares from $1$ to $50$", tests whether the formula is instant recall or a derivation from scratch. Stating the telescoping derivation unprompted signals real understanding over memorization.
    pitfalls: >
      Misremembering the constant in $n(n+1)(2n+1)/6$ — swapping the $6$ for a $3$ or dropping the $(2n+1)$ factor — is the most common recall error; rederiving via telescoping catches it. The cube-sum identity only holds for sums starting at $k=1$; it does not extend to a range like $\sum_{k=5}^{10}k^3$ without adjustment.
    recap: >
      $\sum k$, $\sum k^2$, and $\sum k^3$ are $n(n+1)/2$, $n(n+1)(2n+1)/6$, and $(n(n+1)/2)^2$, each derivable by telescoping the next power up.
    steps:
      - teach: >
          Variance of a discrete uniform random variable — a die roll, a
          random rank — needs $\sum k^2$ on the spot, and rederiving it
          from telescoping is faster and safer than trusting a
          half-remembered formula.
      - teach: >
          $\sum k=n(n+1)/2$, $\sum k^2=n(n+1)(2n+1)/6$, and $\sum k^3=
          (n(n+1)/2)^2$ — the cube sum is exactly the square of the first
          sum, worth keeping as a checkable mnemonic.
      - ask: >
          Compute $\sum_{k=1}^{10} k^2$.
        expects: "385"
        hint: >
          Use $n(n+1)(2n+1)/6$ with $n=10$.
        feedback: >
          $\dfrac{10\cdot11\cdot21}{6}=\dfrac{2310}{6}=385$.
      - teach: >
          The derivation telescopes $(k+1)^3-k^3=3k^2+3k+1$ over
          $k=1,\ldots,n$: the left side collapses to $(n+1)^3-1$, and
          solving for $\sum k^2$ once $\sum k$ is substituted in gives the
          formula.
      - ask: >
          Using the mnemonic $\sum k^3=(\sum k)^2$, what is
          $\sum_{k=1}^{10} k^3$?
        expects: "3025"
        hint: >
          $\sum_{k=1}^{10}k=55$ first.
        feedback: >
          $55^2=3025$ — a perfect square, as the mnemonic promises.
      - teach: >
          These closed forms are for sums starting at $k=1$ — a range like
          $\sum_{k=5}^{10}k^2$ needs the two full-range sums subtracted, not
          a formula applied directly to the shifted range.
      - ask: >
          Compute $\sum_{k=5}^{10} k^2$.
        expects: "355"
        hint: >
          Subtract $\sum_{k=1}^{4}k^2$ from $\sum_{k=1}^{10}k^2=385$.
        feedback: >
          $\sum_{k=1}^{4}k^2=1+4+9+16=30$, so $385-30=355$.
      - teach: >
          For a fast size check rather than an exact value, $\sum k^p$
          grows like $n^{p+1}/(p+1)$ — matching the leading behavior catches
          an algebra slip immediately.

  - node: quant-tools.series-calculus.integral-comparison
    hook: >
      When a sum has no closed form, this is the fastest way to answer "does it converge" or "how big is it roughly" without evaluating a single term.
    explanation: >
      Picture the graph of a nonincreasing $f$ with a unit-width rectangle of height $f(k)$ drawn over $[k,k+1]$: because $f$ is falling, that rectangle sits above the curve on $[k,k+1]$ and below it on $[k-1,k]$. Stacking these rectangles and comparing each to the area under the curve gives the sandwich $\int_1^{n+1} f(x)\,dx \le \sum_{k=1}^n f(k) \le f(1)+\int_1^n f(x)\,dx$ — the sum is trapped between two integrals differing by at most one term's area. A nondecreasing $f$ gives the mirror-image inequality, with the correction term $f(n)$ landing on the upper bound instead.

      The first payoff is a convergence test: if $\int_1^\infty f(x)\,dx$ is finite, the sandwich forces $\sum f(k)$ finite too, and if the integral diverges so does the sum — exactly why $\sum k^{-p}$ converges precisely when $p>1$, matching $\int_1^\infty x^{-p}\,dx$.

      The second payoff is size rather than convergence: even when a sum has no closed form, its integral gives a usable asymptotic, accurate up to one term's worth of slack.
    worked: >
      Bound $\sum_{k=1}^{100} 1/\sqrt{k}$ using $f(x)=x^{-1/2}$, which is decreasing. The lower bound is $\int_1^{101} x^{-1/2}\,dx = 2(\sqrt{101}-1) \approx 18.10$, and the upper bound is $f(1)+\int_1^{100}x^{-1/2}\,dx = 1+2(\sqrt{100}-1)=19$. The true sum, $\approx 18.59$, sits inside that trapped range as guaranteed.
    interview: >
      "Does $\sum 1/k^{1.5}$ converge — justify it in one line" is answered by naming the exponent $p=1.5>1$ and citing the integral test, not by attempting to sum the series. "Estimate $\sum_{k=1}^{10^6} 1/\sqrt{k}$ without a calculator" tests whether you reach for the integral bound instead of adding terms.
    pitfalls: >
      Using the decreasing-function inequality on an increasing function flips which side the correction term belongs on, giving a bound in the wrong direction. Applying the comparison to a function that isn't monotone on the whole range invalidates the sandwich outright — check monotonicity first, not just nonnegativity.
    recap: >
      A monotone sum is trapped between two adjacent integrals differing by one term's area — the fastest route to both a convergence verdict and a numeric estimate.
    steps:
      - teach: >
          When a sum has no closed form, sandwiching it between two
          integrals is the fastest way to answer "does it converge" or
          "how big is it roughly" without evaluating a single term.
      - teach: >
          For nonincreasing $f$, each rectangle of height $f(k)$ sits above
          the curve on $[k,k+1]$ and below it on $[k-1,k]$, giving
          $\int_1^{n+1} f\,dx \le \sum_{k=1}^n f(k) \le f(1)+\int_1^n
          f\,dx$.
      - ask: >
          Using $f(x)=x^{-2}$ (decreasing), what is the lower bound
          $\int_1^{51} x^{-2}\,dx$ on $\sum_{k=1}^{50} 1/k^2$?
        expects: "0.9804"
        tolerance: 0.0005
        hint: >
          $\int x^{-2}\,dx=-1/x$, evaluated from $1$ to $51$.
        feedback: >
          $\left[-\dfrac1x\right]_1^{51}=1-\dfrac{1}{51}\approx0.9804$.
      - teach: >
          The first payoff is a convergence test: if $\int_1^\infty
          f\,dx$ is finite the sandwich forces $\sum f(k)$ finite too, and
          vice versa — exactly why $\sum k^{-p}$ converges precisely when
          $p>1$.
      - ask: >
          Which of these converges by the integral test?
        choices:
          - text: >
              $\sum_{k\ge1} 1/k^{0.9}$
            feedback: >
              $p=0.9<1$, so $\int x^{-0.9}dx$ diverges and so does the sum.
          - text: >
              $\sum_{k\ge1} 1/\sqrt{k}$
            feedback: >
              $p=0.5<1$ — the same divergent case as the harmonic sum's
              slower cousin.
          - text: >
              $\sum_{k\ge1} 1/k^{1.2}$
            correct: true
            feedback: >
              $p=1.2>1$, so $\int_1^\infty x^{-1.2}dx$ is finite and the
              integral test certifies convergence.
          - text: >
              $\sum_{k\ge1} 1/k$
            feedback: >
              This is exactly $p=1$, the boundary case that diverges — the
              harmonic sum.
        feedback: >
          $\sum k^{-p}$ converges exactly when $p>1$, matching
          $\int_1^\infty x^{-p}\,dx$ term for term.
      - teach: >
          A nondecreasing $f$ flips which side carries the correction term:
          $\int_1^n f\,dx \le \sum_{k=1}^n f(k) \le \int_1^n f\,dx+f(n)$,
          with $f(n)$ landing on the upper bound instead of $f(1)$.
      - ask: >
          For a nondecreasing $f$, which bound in the sandwich carries the
          extra term $f(n)$?
        choices:
          - text: >
              The lower bound.
            feedback: >
              For a nondecreasing $f$ the lower bound is the bare integral
              $\int_1^n f\,dx$, with no correction term attached.
          - text: >
              The upper bound.
            correct: true
            feedback: >
              The extra rectangle sits above the curve at the far end when
              $f$ is rising, so $f(n)$ is added to the upper bound.
          - text: >
              Neither — the correction only applies to decreasing $f$.
            feedback: >
              A monotone $f$ always needs one correction term; which side
              it lands on depends on whether $f$ rises or falls.
        feedback: >
          Nondecreasing $f$ mirrors the decreasing case: the correction
          term $f(n)$ moves to the upper bound, not $f(1)$ on the lower
          one.
      - teach: >
          Check monotonicity on the whole range before trusting the
          sandwich — applying it to a function that isn't monotone
          throughout invalidates the bound outright.

  - node: quant-tools.series-calculus.harmonic-numbers
    hook: >
      A harmonic sum buried inside an expected-value answer is the tell for a coupon-collector or record-counting setup, and knowing $H_n \approx \ln n + 0.577$ lets you finish the arithmetic without a series in sight.
    explanation: >
      Applying the integral sandwich to the decreasing function $f(x)=1/x$ gives $\ln(n+1)\le H_n \le 1+\ln n$ directly — $H_n$ sits within one unit of $\ln n$ for every $n$, which already proves the sum diverges (since $\ln n\to\infty$) but only logarithmically slowly. The gap between $H_n$ and $\ln n$ settles down to a genuine constant as $n$ grows, $\gamma \approx 0.5772$, refining the crude bound into the sharper $H_n \approx \ln n + \gamma$.

      Because the growth is logarithmic, doubling $n$ only adds $\ln 2 \approx 0.693$ to $H_n$ regardless of how large $n$ already is — a useful anchor for how slowly this sum actually grows despite genuinely diverging.

      A harmonic sum in a final answer is close to a signature: it appears whenever a computation sums $1/k$ over $k=1,\ldots,n$, exactly the shape of "expected time to see something new" problems, where at each stage a shrinking fraction of outcomes is still novel.
    worked: >
      How many rolls of a fair six-sided die, on average, until every face has appeared at least once? This is $n=6$ coupons, and the expected count is $nH_n = 6\left(1+\tfrac{1}{2}+\tfrac{1}{3}+\tfrac{1}{4}+\tfrac{1}{5}+\tfrac{1}{6}\right) = 6(2.45) = 14.7$ rolls.
    interview: >
      "Expected number of draws to collect all $n$ distinct coupons" is asked almost verbatim, and $nH_n$ should come out immediately, with the reasoning that the wait for each new coupon is a geometric count. "How many random hash writes before every bucket has been hit" is the identical problem in different words.
    pitfalls: >
      $H_n$ has no elementary closed form — treating $\ln n+\gamma$ as exact rather than an excellent approximation causes trouble when a problem demands the precise value. In the coupon-collector application, quoting $H_n$ alone instead of $nH_n$ is a common off-by-a-factor-of-$n$ mistake.
    recap: >
      $H_n$ diverges but only like $\ln n + 0.577$, and it is the number that appears whenever an answer counts records or waits to collect every one of $n$ things.
    steps:
      - teach: >
          A harmonic sum buried inside an expected-value answer is the tell
          for a coupon-collector or record-counting setup — recognizing it
          turns a scary series into arithmetic.
      - teach: >
          $H_n\approx\ln n+\gamma$ with $\gamma\approx0.5772$, and because
          the growth is logarithmic, doubling $n$ only adds $\ln2
          \approx0.693$ to $H_n$ regardless of how large $n$ already is.
      - ask: >
          Estimate $H_{50}$ using $\ln n+\gamma$.
        expects: "4.489"
        tolerance: 0.01
        hint: >
          $\ln 50\approx3.912$.
        feedback: >
          $\ln50+\gamma\approx3.912+0.577=4.489$.
      - teach: >
          A harmonic sum appears whenever a computation sums $1/k$ over
          $k=1,\ldots,n$, exactly the shape of "expected time to see
          something new" — the expected count is $nH_n$, not $H_n$ alone.
      - ask: >
          How many rolls of a fair $8$-sided die, on average, until every
          face has appeared at least once?
        expects: "21.74"
        tolerance: 0.02
        hint: >
          Compute $H_8=1+\tfrac12+\cdots+\tfrac18$, then multiply by $8$.
        feedback: >
          $H_8\approx2.718$, so the expected count is $8H_8\approx8(2.718)
          =21.74$ rolls.
      - teach: >
          $H_n$ has no elementary closed form — treating $\ln n+\gamma$ as
          exact rather than an excellent approximation causes trouble when
          a problem demands the precise value.
      - ask: >
          A candidate is asked for the expected number of draws to collect
          all $12$ distinct coupons and answers $H_{12}\approx3.103$. What
          mistake did they make?
        choices:
          - text: >
              Forgot to multiply by $n$.
            correct: true
            feedback: >
              The expected count is $nH_n$, not $H_n$ alone — quoting
              $H_{12}$ by itself understates the answer roughly twelvefold.
          - text: >
              Used the wrong value of $\gamma$.
            feedback: >
              $\gamma\approx0.5772$ is standard; the error here is a
              missing factor of $n$, not a wrong constant.
          - text: >
              Computed $H_{11}$ instead of $H_{12}$.
            feedback: >
              The index is fine — $H_{12}\approx3.103$ is correct on its
              own; the problem is stopping there.
        feedback: >
          Quoting $H_n$ alone instead of $nH_n$ is a common
          off-by-a-factor-of-$n$ mistake in the coupon-collector
          application.
      - teach: >
          Keep two anchor values close at hand — $H_{10}\approx2.929$ and
          $H_{100}\approx5.187$ — so a coupon-collector answer can be
          sanity-checked without reaching for a calculator.

  - node: quant-tools.series-calculus.taylor
    hook: >
      "Estimate this function near a point without a calculator" is always a Taylor expansion question, and interviewers want the size of the truncation error justified, not just the leading approximation stated.
    explanation: >
      The polynomial $\sum_{k=0}^n f^{(k)}(a)(x-a)^k/k!$ is built to match $f$ and its first $n$ derivatives exactly at the single point $a$ — matching the zeroth derivative pins the constant term, matching the first pins the slope, and so on, so locally the polynomial and $f$ are indistinguishable to that order. The Lagrange remainder measures exactly what's left over, and its shape — the same derivative-and-factorial structure as the next term in the pattern, evaluated at some unknown point between $a$ and $x$ — says the truncation error looks like one more term of the same series, with the derivative's exact value swapped for its worst case on the interval.

      The practical reading follows directly: each additional term you keep buys roughly one more factor of $|x-a|$ in accuracy, since the omitted remainder scales like $(x-a)^{n+1}$. That's why these expansions are only trustworthy for $x$ genuinely close to $a$ — a truncated polynomial excellent at $x-a=0.1$ can be worthless at $x-a=2$, because the error term grows with the same power that made it small in the first place.

      The exponential is the one case where the remainder vanishes for every real $x$ no matter how far from $a=0$, because its derivatives never grow — most other functions are not so forgiving, and the interval where the approximation stays good must be checked, not assumed.
    worked: >
      Approximate $\sin(0.2)$ using the first two nonzero terms of its expansion at $a=0$: $\sin(0.2) \approx 0.2 - \dfrac{0.2^3}{6} = 0.2 - 0.001333 = 0.198667$. The true value is $0.198669$, so two terms already give four correct decimal places.
    interview: >
      "Estimate $\cos(0.1)$ to four decimal places by hand" wants the truncated series produced and the omitted term's size mentioned as an error bound, not a numeric guess. "Why does a two-term approximation get worse the farther you move from the expansion point" is answered by pointing at the $(x-a)^{n+1}$ factor in the remainder.
    pitfalls: >
      The remainder formula needs $f$ differentiable enough times on the whole interval between $a$ and $x$, not just at $a$ itself — a kink or blow-up in between invalidates the bound. Trusting a low-order truncation far from $a$ ignores that the remainder's growth can swamp the leading terms entirely.
    recap: >
      $f(x)$ equals its derivative-matching polynomial at $a$ plus a remainder shaped like the next omitted term — the license behind every small-displacement approximation.
    steps:
      - teach: >
          "Estimate this function near a point without a calculator" is
          always a Taylor expansion question, and the interviewer wants the
          size of the truncation error justified, not just the leading
          term.
      - teach: >
          The polynomial $\sum_{k=0}^n f^{(k)}(a)(x-a)^k/k!$ matches $f$ and
          its first $n$ derivatives at $a$. The Lagrange remainder looks
          like one more term of the pattern, evaluated at some unknown
          $\xi$ between $a$ and $x$.
      - ask: >
          Using the first two nonzero terms of its Maclaurin expansion,
          $1-x^2/2$, approximate $\cos(0.1)$.
        expects: "0.995"
        tolerance: 0.0005
        hint: >
          Plug $x=0.1$ into $1-x^2/2$.
        feedback: >
          $1-\dfrac{0.1^2}{2}=1-0.005=0.995$, matching the true value
          $0.995004$ to three decimals.
      - teach: >
          Each additional term buys roughly one more factor of $|x-a|$ in
          accuracy, since the omitted remainder scales like $(x-a)^{n+1}$ —
          exactly why these expansions only stay trustworthy near $a$.
      - ask: >
          A function has $f(2)=5$, $f'(2)=3$, $f''(2)=-4$. Estimate
          $f(2.1)$ using the quadratic Taylor polynomial at $a=2$.
        expects: "5.28"
        hint: >
          $f(2.1)\approx f(2)+f'(2)(0.1)+\dfrac{f''(2)}{2}(0.1)^2$.
        feedback: >
          $5+3(0.1)+\dfrac{-4}{2}(0.01)=5+0.3-0.02=5.28$.
      - teach: >
          The remainder formula needs $f$ differentiable enough times on
          the whole interval between $a$ and $x$, not just at $a$ itself —
          a kink or blow-up in between invalidates the bound.
      - ask: >
          A two-term Taylor approximation is excellent at $x-a=0.1$.
          Without keeping more terms, is it reliable at $x-a=2$?
        choices:
          - text: >
              Yes — the relative error stays proportionally small.
            feedback: >
              The remainder scales like $(x-a)^{n+1}$, so it grows
              sharply, not proportionally, as $x-a$ grows.
          - text: >
              No — the remainder's growth can swamp the leading terms.
            correct: true
            feedback: >
              The same power that made the error small at $x-a=0.1$ makes
              it large at $x-a=2$; nothing guarantees the approximation
              travels that far.
          - text: >
              Yes — Taylor series converge everywhere by definition.
            feedback: >
              Convergence, when it holds, is not automatic and says
              nothing about a truncated polynomial's accuracy far from
              $a$.
        feedback: >
          A truncated polynomial excellent at $x-a=0.1$ can be worthless at
          $x-a=2$, because the error term grows with the same power that
          made it small in the first place.
      - teach: >
          Keep the order of operations as a habit: identify $a$, compute
          only as many derivatives as the required accuracy demands, and
          bound the remainder before trusting the number.

  - node: quant-tools.series-calculus.standard-series
    hook: >
      These six expansions are the lookup table for "estimate this to three significant figures" questions, and the fast win is recognizing which one a disguised expression secretly is.
    explanation: >
      Each of these is exactly the Maclaurin form of Taylor's theorem — the polynomial built from derivatives at $a=0$ — applied to one particular function, a table worth having memorized rather than rederived under time pressure. The geometric series is itself a special case of the binomial series: taking $\alpha=-1$ in $(1+x)^\alpha$ gives coefficients $(-1)^k$, and evaluating at $-x$ instead of $x$ recovers $1/(1-x)=\sum x^k$ exactly — the two entries in the table are really one identity viewed two ways.

      The ranges matter as much as the formulas. $e^x$, $\sin x$, and $\cos x$ converge for every real $x$ because their derivatives stay bounded, so truncating them is safe arbitrarily far from $0$ in principle. $\ln(1+x)$ and $(1+x)^\alpha$ only converge for $|x|<1$ (with $\ln(1+x)$ scraping in at $x=1$) — trying to use either series for $x=2$ produces nonsense, not merely an inaccurate answer.

      In practice these are used for fast numerical estimates near a reference point: write the quantity as $1$ plus something small, match it to the right series, and keep two or three terms.
    worked: >
      Estimate $\ln(1.05)$ using $x=0.05$: $\ln(1.05) \approx 0.05 - \dfrac{0.05^2}{2} + \dfrac{0.05^3}{3} = 0.05 - 0.00125 + 0.0000417 \approx 0.048792$, matching the true value $0.048790$ to five decimal places.
    interview: >
      "Estimate $(1.02)^{10}$ without a calculator" is answered fastest by writing it as $e^{10\ln(1.02)}$ and expanding $\ln(1.02)$ with the series, then $e^x$ with its own series — chaining two entries from the table. A direct ask, "what's $\ln(1.05)$ to three decimals", tests the series cold.
    pitfalls: >
      Using the $\ln(1+x)$ or binomial series outside $|x|<1$ gives a numerically wrong or divergent result, unlike $e^x$, $\sin x$, $\cos x$, which are safe for any $x$. Forgetting the alternating signs in $\ln(1+x)$ is an easy slip when writing the series quickly from memory.
    recap: >
      Six Maclaurin series are worth reciting cold, each valid on its own range — $e^x$, $\sin x$, $\cos x$ everywhere, $\ln(1+x)$ and $(1+x)^\alpha$ only for $|x|<1$.
    steps:
      - teach: >
          These six expansions are the lookup table for "estimate this to
          three significant figures" questions — the fast win is
          recognizing which one a disguised expression secretly is.
      - teach: >
          $e^x$, $\sin x$, $\cos x$ converge for every real $x$, since their
          derivatives stay bounded. $\ln(1+x)$ and $(1+x)^\alpha$ only
          converge for $|x|<1$ — using either far outside that range gives
          nonsense, not merely an inaccurate answer.
      - ask: >
          Using the first two nonzero terms, estimate $\sin(0.3)$.
        expects: "0.2955"
        tolerance: 0.0005
        hint: >
          $\sin x\approx x-x^3/6$.
        feedback: >
          $0.3-\dfrac{0.3^3}{6}=0.3-0.0045=0.2955$, matching the true
          value $0.29552$ closely.
      - teach: >
          The geometric series is a special case of the binomial series:
          taking $\alpha=-1$ in $(1+x)^\alpha$ gives coefficients
          $(-1)^k$, and evaluating at $-x$ recovers $1/(1-x)=\sum x^k$
          exactly — one identity viewed two ways.
      - ask: >
          Using the first three terms of $(1+x)^{-1}=1-x+x^2-\cdots$,
          approximate $1/1.03$.
        expects: "0.9709"
        tolerance: 0.0005
        hint: >
          Plug $x=0.03$ into $1-x+x^2$.
        feedback: >
          $1-0.03+0.03^2=1-0.03+0.0009=0.9709$, close to the true
          $0.970874$.
      - teach: >
          Using the $\ln(1+x)$ or binomial series outside $|x|<1$ is the
          standard trap — unlike $e^x$, $\sin x$, $\cos x$, which are safe
          for any $x$, these two have a hard boundary.
      - ask: >
          Which truncated-series estimate is invalid because the argument
          falls outside its interval of convergence?
        choices:
          - text: >
              $e^5$ via the $e^x$ series.
            feedback: >
              $e^x$ converges for every real $x$; this is just slow to
              converge, not invalid.
          - text: >
              $\cos(50)$ via the $\cos x$ series.
            feedback: >
              $\cos x$ also converges for every real $x$ — safe anywhere.
          - text: >
              $\ln(3)$ via $\ln(1+x)$ at $x=2$.
            correct: true
            feedback: >
              $\ln(1+x)$ only converges for $-1<x\le1$; $x=2$ is outside
              that range, so the series doesn't converge to $\ln3$ at all.
          - text: >
              $\sin(10)$ via the $\sin x$ series.
            feedback: >
              $\sin x$ converges for every real $x$; the estimate would
              just need many terms to settle down.
        feedback: >
          $\ln(1+x)$ and $(1+x)^\alpha$ are the two entries with a hard
          radius of convergence; the other four are safe arbitrarily far
          from $0$.
      - teach: >
          The practical move is always the same: write the quantity as $1$
          plus something small, match it to the right series, and keep two
          or three terms.

  - node: quant-tools.series-calculus.exp-limit
    hook: >
      Continuous compounding and the "roughly $1/e$ of items get missed" heuristic behind derangements and coupon problems both come from this one limit, and the interview trap is the direction and size of the correction term.
    explanation: >
      Taking logs turns the limit into something the standard series can handle directly: $n\ln(1+x/n) = n\left(\dfrac{x}{n}-\dfrac{(x/n)^2}{2}+\cdots\right) = x - \dfrac{x^2}{2n} + O(n^{-2})$, which tends to $x$ as $n\to\infty$ since every term past the first carries a positive power of $1/n$. Exponentiating recovers $(1+x/n)^n \to e^x$, and the same expansion shows the error vanishes at a specific rate, $(1+x/n)^n = e^x\left(1-x^2/(2n)+O(n^{-2})\right)$.

      For $x>0$ that correction factor is below $1$, so the approach to $e^x$ is from underneath and it is slow — halving the gap needs roughly doubling $n$, not adding a fixed amount. Candidates who assume $(1+x/n)^n$ is already close to $e^x$ for moderate $n$ underestimate how much of the gap remains.

      The mental model worth keeping is compounding: splitting a growth rate $x$ into $n$ equal steps of $x/n$ converges to continuous compounding, and the special case $x=-1$ is exactly "each of $n$ independent trials misses a fixed target with probability $1-1/n$" — the chance every one of them misses is $(1-1/n)^n \to 1/e$.
    worked: >
      Eight independent draws, each hitting a specific item with probability $1/8$: the chance all eight miss it is $(7/8)^8$. Computing directly, $(7/8)^2 = 0.765625$, squared gives $(7/8)^4 \approx 0.586182$, squared again gives $(7/8)^8 \approx 0.343609$ — noticeably below the limiting $1/e \approx 0.367879$, confirming the slow approach from below.
    interview: >
      "If $n$ people each throw a hat into a pile and grab one at random, roughly what's the probability nobody gets their own hat back" is answered with $\approx 1/e$, from this limit at $x=-1$. "Is $(1-1/n)^n$ above or below $1/e$ for finite $n$" checks whether the direction of convergence is understood, not just the limit value.
    pitfalls: >
      Assuming $(1+x/n)^n$ is already essentially $e^x$ for a moderate $n$ like $10$ or $20$ ignores that the relative error is only $O(1/n)$, not exponentially small. The general form needs $a_n\to x$, not just $a_n$ bounded — a sequence that doesn't converge to a fixed $x$ invalidates the limit.
    recap: >
      $(1+x/n)^n \to e^x$, approaching from below when $x>0$ at rate $\sim x^2/(2n)$, and at $x=-1$ this is exactly the $1/e$ "missed every time" probability.
    steps:
      - teach: >
          Continuous compounding and the "roughly $1/e$ of items get
          missed" heuristic behind derangements and coupon problems both
          come from this one limit — the trap is the direction and size of
          the correction term.
      - teach: >
          Taking logs, $n\ln(1+x/n)=x-x^2/(2n)+O(n^{-2})\to x$, so
          exponentiating gives $(1+x/n)^n\to e^x$. The same expansion shows
          $(1+x/n)^n=e^x(1-x^2/(2n)+O(n^{-2}))$.
      - ask: >
          Five independent draws each hit a specific item with probability
          $1/5$. What is the chance all five miss it, $(4/5)^5$?
        expects: "0.32768"
        hint: >
          Compute $(4/5)^5$ directly.
        feedback: >
          $(4/5)^5=1024/3125=0.32768$.
      - teach: >
          For $x>0$ the correction factor is below $1$, so the approach to
          $e^x$ is from underneath and slow — halving the remaining gap
          needs roughly doubling $n$, not adding a fixed amount.
      - ask: >
          Compute $(1.05)^{20}$ to four decimal places.
        expects: "2.6533"
        tolerance: 0.001
        hint: >
          This is $(1+1/20)^{20}$, approaching $e\approx2.71828$ from
          below.
        feedback: >
          $(1.05)^{20}\approx2.6533$, noticeably below $e$, consistent
          with the slow from-below approach at $x=1$.
      - teach: >
          Candidates who assume $(1+x/n)^n$ is already close to $e^x$ for a
          moderate $n$ like $10$ or $20$ underestimate how much of the gap
          remains — the relative error is only $O(1/n)$, not exponentially
          small.
      - ask: >
          What is actually wrong with treating $(1+1/10)^{10}$ as
          essentially equal to $e$?
        choices:
          - text: >
              The relative error is only $O(1/n)$, not exponentially
              small.
            correct: true
            feedback: >
              At $n=10$ the gap is still a few percent of $e$ — nowhere
              near negligible.
          - text: >
              The formula only works for negative $x$.
            feedback: >
              $x=1$ is fine; the limit holds for every fixed real $x$.
          - text: >
              The limit doesn't exist for $x=1$.
            feedback: >
              It exists and equals $e$ — the issue is how slowly finite
              $n$ approaches it, not whether the limit exists.
        feedback: >
          The general form needs $a_n\to x$, and convergence is genuinely
          slow — moderate $n$ is not "close enough" by default.
      - teach: >
          This is the identity behind the classic hat-check puzzle: with
          $n$ people and $n$ hats, the chance nobody gets their own back is
          $\approx1/e$, essentially independent of how large $n$ is.

  - node: quant-tools.series-calculus.sum-exchange
    hook: >
      Swapping which index is "outer" in a double sum is the same move that turns a hard count into $\mathbb{E}[X]=\sum_k \Pr(X\ge k)$, and the only real skill is redrawing the region of index pairs correctly before flipping it.
    explanation: >
      A double sum $\sum_i\sum_j a_{ij}$ is really a single sum over the set of index pairs $(i,j)$ where $a_{ij}$ is defined; grouping that set "by rows" (fix $i$, sum over $j$) or "by columns" (fix $j$, sum over $i$) counts every pair exactly once either way, so the two totals must agree. The entire skill is sketching the region of valid pairs and reading off the correct inner limits after flipping which variable is outer — get the boundary wrong and the swap silently drops or duplicates terms.

      For finitely many terms this needs no justification. For infinitely many terms it's legal whenever every term is nonnegative, or whenever the sum of absolute values is finite — outside those hypotheses, rearranging an infinite sum can genuinely change its value, so the swap is not automatic once both indices range over infinite sets.

      This is the same principle already used implicitly: writing $k=\sum_{i=1}^k 1$ and swapping order is exactly how the arithmetic series formula can be rederived by counting, and the geometric tail form is what falls out when a swapped sum-of-integrals lands back on a geometric series.
    worked: >
      Evaluate $\sum_{i=1}^{4}\sum_{j=i}^{4} \dfrac{1}{j}$. The region is all pairs with $1\le i\le j\le 4$; summing by columns instead, for each $j$ there are exactly $j$ valid values of $i$, so the sum becomes $\sum_{j=1}^{4} j\cdot\dfrac{1}{j} = \sum_{j=1}^{4} 1 = 4$ — a swap that turns a sum of fractions into an exact integer.
    interview: >
      "Rewrite $\sum_i\sum_j a_{ij}$ with the sums in the other order" checks the region-sketching habit directly; a disguised version is deriving $\mathbb{E}[X]=\sum_{k\ge 1}\Pr(X\ge k)$ for a nonnegative integer random variable, exactly this swap applied to $X=\sum_k \mathbf{1}\{X\ge k\}$.
    pitfalls: >
      Flipping the sum without redrawing the index region — just swapping the summation symbols and keeping the same-looking bounds — almost always produces the wrong limits. Applying the swap to a series that is neither nonnegative nor absolutely summable risks changing the value entirely, not just the method of computing it.
    recap: >
      A double sum can be regrouped by rows or by columns over the same region of index pairs, legal unconditionally for finite sums and under nonnegativity or absolute summability for infinite ones.
    steps:
      - teach: >
          Swapping which index is "outer" in a double sum is the same move
          that turns a hard count into $\mathbb{E}[X]=\sum_k\Pr(X\ge k)$ —
          the only real skill is redrawing the region of index pairs
          correctly before flipping it.
      - teach: >
          A double sum is really one sum over the set of valid index
          pairs. Grouping "by rows" or "by columns" counts every pair
          exactly once either way, so the two totals must agree.
      - ask: >
          Evaluate $\sum_{i=1}^{5}\sum_{j=i}^{5} \dfrac1j$.
        expects: "5"
        hint: >
          Swap to sum by columns: for each $j$, how many valid $i$ are
          there?
        feedback: >
          For each $j$ there are exactly $j$ valid values of $i$, so the
          sum becomes $\sum_{j=1}^{5} j\cdot\dfrac1j=\sum_{j=1}^{5}1=5$.
      - teach: >
          This is legal unconditionally for finitely many terms. For
          infinitely many it needs every term nonnegative, or the sum of
          absolute values finite — outside those hypotheses the swap can
          genuinely change the value.
      - ask: >
          Using $k=\sum_{i=1}^{k}1$ and swapping order, evaluate
          $\sum_{k=1}^{7} k$.
        expects: "28"
        hint: >
          Swapped, the sum becomes $\sum_{i=1}^{7}(7-i+1)$.
        feedback: >
          $\sum_{i=1}^{7}\sum_{k=i}^{7}1=\sum_{i=1}^{7}(7-i+1)
          =7+6+5+4+3+2+1=28$.
      - teach: >
          Flipping the sum without redrawing the index region — just
          swapping the summation symbols and keeping the same-looking
          bounds — almost always produces the wrong limits.
      - ask: >
          A candidate swaps $\sum_{i=1}^{n}\sum_{j=1}^{i}a_{ij}$ into
          $\sum_{j=1}^{n}\sum_{i=1}^{n}a_{ij}$, keeping the inner bound
          $i=1$ to $n$. What went wrong?
        choices:
          - text: >
              Nothing — swapping the symbols is always enough.
            feedback: >
              The region of valid pairs is $1\le j\le i\le n$; keeping the
              same-looking bounds after swapping silently changes it.
          - text: >
              The inner sum should run $i=j$ to $n$, since $i\ge j$ on the
              original region.
            correct: true
            feedback: >
              Grouping by columns, for a fixed $j$ the valid $i$ are
              exactly those with $i\ge j$, up to $n$.
          - text: >
              The outer bound should be $i$, not $j$.
            feedback: >
              Renaming which letter is outer isn't the issue — the inner
              bound is wrong regardless of the label.
        feedback: >
          Redraw the region of pairs before flipping which variable is
          outer; the original triangle $1\le j\le i\le n$ becomes, by
          columns, $i$ ranging from $j$ to $n$.
      - teach: >
          Sketching the region first, then reading off the correct inner
          limits, is what makes a re-bracketed sum trustworthy instead of a
          guess.

  - node: quant-tools.series-calculus.gaussian-integral
    hook: >
      This constant normalizes every normal-density calculation you'll ever set up, and the interviewer wants the "square it and go polar" proof produced cold, not the number $\sqrt{2\pi}$ recited from memory.
    explanation: >
      The same idea behind recombining a double sum into one region and resumming it along a more convenient axis works for integrals too: writing $I=\int_{-\infty}^\infty e^{-x^2/2}\,dx$ and squaring gives $I^2 = \iint e^{-(x^2+y^2)/2}\,dx\,dy$, a single integral over the whole plane, and the integrand's dependence on only $x^2+y^2$ makes polar coordinates the obvious choice — something the Cartesian form completely hid.

      Switching to polar coordinates, the integrand becomes $e^{-r^2/2}$ and the area element becomes $r\,dr\,d\theta$, so $I^2 = \int_0^{2\pi}\int_0^\infty e^{-r^2/2}r\,dr\,d\theta$. The radial integral is now elementary: substituting $u=r^2/2$ turns $\int_0^\infty e^{-r^2/2}r\,dr$ into $\int_0^\infty e^{-u}\,du=1$, and the angular integral contributes a factor of $2\pi$, giving $I^2=2\pi$. Since the original integrand is strictly positive, $I$ itself must be positive, so $I=\sqrt{2\pi}$ rather than $-\sqrt{2\pi}$.

      Rescaling the exponent's coefficient and completing the square inside it extend the same computation to $\int e^{-ax^2}dx = \sqrt{\pi/a}$ and to integrals with a linear term added in the exponent, both direct corollaries of this one derivation.
    worked: >
      Evaluate $\int_{-\infty}^\infty e^{-3x^2}\,dx$ using the scaled form with $a=3$: $\sqrt{\pi/3} = \sqrt{1.0472} \approx 1.0233$.
    interview: >
      "What normalizes the standard normal density" is answered with $\sqrt{2\pi}$, but the interviewer usually wants the derivation — "derive it, don't just state it" is the explicit follow-up to watch for. Squaring and going polar should be produced without prompting.
    pitfalls: >
      Stopping at $I^2=2\pi$ without arguing $I>0$ leaves the sign technically unresolved — the positivity of the original integrand is the step that pins it down. Forgetting the extra factor of $r$ in the polar area element breaks the radial integral's elementary substitution entirely.
    recap: >
      Squaring the Gaussian integral and switching to polar coordinates turns an intractable single integral into two elementary ones, giving $\int e^{-x^2/2}dx = \sqrt{2\pi}$.
    steps:
      - teach: >
          This constant normalizes every normal-density calculation you'll
          set up, and the interviewer wants the "square it and go polar"
          proof produced cold, not the number $\sqrt{2\pi}$ recited from
          memory.
      - teach: >
          Squaring $I=\int e^{-x^2/2}dx$ gives a double integral,
          $I^2=\iint e^{-(x^2+y^2)/2}dx\,dy$, and switching to polar
          coordinates makes the radial integral elementary via $u=r^2/2$,
          leaving $I^2=2\pi$.
      - ask: >
          Evaluate $\int_{-\infty}^{\infty} e^{-5x^2}\,dx$.
        expects: "0.7927"
        tolerance: 0.0005
        hint: >
          Use the scaled form $\sqrt{\pi/a}$ with $a=5$.
        feedback: >
          $\sqrt{\pi/5}=\sqrt{0.6283}\approx0.7927$.
      - teach: >
          Since the original integrand $e^{-x^2/2}$ is strictly positive,
          $I$ itself must be positive — $I^2=2\pi$ alone doesn't pin the
          sign, only the positivity of what's being integrated does.
      - ask: >
          Why must $I>0$ be argued separately from $I^2=2\pi$?
        choices:
          - text: >
              Because $I^2=2\pi$ alone is also consistent with
              $I=-\sqrt{2\pi}$, and only the integrand's positivity rules
              that out.
            correct: true
            feedback: >
              Squaring loses the sign; the original integrand being
              strictly positive is what forces $I$ positive.
          - text: >
              Because polar coordinates only work for positive functions.
            feedback: >
              Polar coordinates work regardless of sign — the sign issue
              comes from squaring, not from switching coordinate systems.
          - text: >
              Because integration by parts requires it.
            feedback: >
              No integration by parts is used in this derivation at all.
        feedback: >
          $I^2=2\pi$ has two square roots; the integrand's strict
          positivity is the extra fact that picks $I=+\sqrt{2\pi}$.
      - teach: >
          Forgetting the extra factor of $r$ in the polar area element
          breaks the radial integral's elementary substitution entirely —
          it's what turns an unsolvable-looking integral into a solvable
          one.
      - ask: >
          Evaluate $\int_0^\infty e^{-r^2/2}\,r\,dr$.
        expects: "1"
        hint: >
          Substitute $u=r^2/2$, so $du=r\,dr$.
        feedback: >
          $\int_0^\infty e^{-u}\,du=1$ — without the factor of $r$, this
          integral has no elementary antiderivative at all.
      - teach: >
          The same completing-the-square move extends this one result to
          $\int e^{-ax^2+bx}dx=\sqrt{\pi/a}\,e^{b^2/(4a)}$, both direct
          corollaries of the same squaring-and-polar computation.

  - node: quant-tools.series-calculus.gaussian-moments
    hook: >
      Kurtosis, the fourth moment, and "what's the average of $|Z|$" are all this recursion in disguise, and mixing up which moments vanish versus which merely shrink is an instant tell of a shaky derivation.
    explanation: >
      Every odd moment $\int x^{2k+1}\varphi(x)\,dx$ vanishes for a structural reason, not a computational coincidence: $x^{2k+1}$ is odd and $\varphi$ is even, so the integrand is odd, and an odd function integrated over the symmetric interval $(-\infty,\infty)$ contributes equal and opposite area on each side of $0$.

      The even moments follow from one identity: $\varphi'(x)=-x\varphi(x)$, so $x\varphi(x)$ is literally $-\varphi'(x)$. Writing $x^{2k}\varphi(x) = x^{2k-1}\cdot(x\varphi(x)) = -x^{2k-1}\varphi'(x)$ and integrating by parts moves the derivative off $\varphi$ and onto $x^{2k-1}$, whose derivative is $(2k-1)x^{2k-2}$; the boundary term vanishes because $\varphi$ decays faster than any polynomial grows, leaving exactly $\int x^{2k}\varphi\,dx = (2k-1)\int x^{2k-2}\varphi\,dx$ — each step peels one power of $x^2$ off in exchange for a factor of $2k-1$.

      Starting the recursion at the $0$-th moment, which is $1$ since $\varphi$ integrates to $1$, unrolls it into the double factorials $(2k-1)!!$ directly.
    worked: >
      Find $\operatorname{Var}(X^2)$ for a standard normal $X$. $\mathbb{E}[X^2]=1$ and $\mathbb{E}[X^4]=3$ from the recursion, so $\operatorname{Var}(X^2) = \mathbb{E}[X^4]-(\mathbb{E}[X^2])^2 = 3-1=2$.
    interview: >
      "What's the fourth moment of a standard normal, and derive it — don't just quote $3$" expects the integration-by-parts recursion produced live. "Why is $3$ the kurtosis benchmark for 'normal-like' tails" is answered by pointing at this exact computation.
    pitfalls: >
      Treating an odd moment as merely small rather than exactly zero misses that it's a genuine symmetry argument, not an approximation. Confusing the recursion's multiplier $(2k-1)$ with a factorial-looking $(2k)!!$ is an easy slip that throws off every moment past the second.
    recap: >
      Odd Gaussian moments vanish by symmetry, and the even moments follow the recursion $(2k-1)\times$ the previous one, giving $1,1,3,15,105,\ldots$ — so $\operatorname{Var}(X^2)=2$.
    steps:
      - teach: >
          Kurtosis, the fourth moment, and "what's the average of $|Z|$"
          are all this recursion in disguise — mixing up which moments
          vanish versus which merely shrink is an instant tell of a shaky
          derivation.
      - teach: >
          Odd moments vanish by symmetry: $x^{2k+1}\varphi(x)$ is odd, and
          an odd function integrates to zero over a symmetric interval.
          Even moments follow the recursion $\mathbb{E}[X^{2k}]=(2k-1)
          \mathbb{E}[X^{2k-2}]$, from $\varphi'(x)=-x\varphi(x)$ and
          integration by parts.
      - ask: >
          Using $\mathbb{E}[X^4]=3$ and the recursion, find
          $\mathbb{E}[X^6]$.
        expects: "15"
        hint: >
          Apply the recursion with $k=3$: multiply by $2k-1$.
        feedback: >
          $\mathbb{E}[X^6]=(2\cdot3-1)\mathbb{E}[X^4]=5\cdot3=15$.
      - teach: >
          Unrolling the recursion from $\mathbb{E}[X^0]=1$ gives the double
          factorials $1,1,3,15,105,\ldots$ directly, and the same machinery
          handles the one-sided integral $\int_0^\infty xe^{-x^2/2}dx=1$.
      - ask: >
          What is $\mathbb{E}[|X|]=\sqrt{2/\pi}$ for a standard normal, to
          three decimals?
        expects: "0.798"
        tolerance: 0.001
        hint: >
          Compute $\sqrt{2/\pi}$ directly.
        feedback: >
          $\sqrt{2/\pi}=\sqrt{0.6366}\approx0.798$.
      - teach: >
          Confusing the recursion's multiplier $(2k-1)$ with a
          factorial-looking $(2k)!!$ is an easy slip that throws off every
          moment past the second.
      - ask: >
          A candidate computes $\mathbb{E}[X^6]$ as $6!!=48$. What went
          wrong?
        choices:
          - text: >
              Used the double factorial $(2k)!!$ instead of $(2k-1)!!$.
            correct: true
            feedback: >
              With $k=3$, the recursion multiplier is $2k-1=5$, giving
              $5!!=5\cdot3\cdot1=15$, not $6!!=6\cdot4\cdot2=48$.
          - text: >
              Forgot that odd moments vanish.
            feedback: >
              $X^6$ is an even moment — this is irrelevant here.
          - text: >
              Used the wrong starting value $\mathbb{E}[X^0]$.
            feedback: >
              $\mathbb{E}[X^0]=1$ is correct and isn't where the error
              entered.
        feedback: >
          The recursion's multiplier is $(2k-1)$, giving the double
          factorial $(2k-1)!!$ — not the superficially similar $(2k)!!$.
      - teach: >
          Every odd moment is exactly zero, not merely small — a genuine
          symmetry argument, and one worth stating as fact rather than
          approximation.

  - node: quant-tools.series-calculus.gamma-function
    hook: >
      Any interview integral shaped like $t^n e^{-\lambda t}$ should trigger $\Gamma$ immediately — recognizing it beats integrating by parts $n$ times live at the whiteboard.
    explanation: >
      $\Gamma(z)=\int_0^\infty t^{z-1}e^{-t}\,dt$ converges for every $z>0$: the exponential decay dominates any polynomial growth as $t\to\infty$, and near $t=0$ the power $t^{z-1}$ stays integrable as long as $z>0$. Integration by parts, taking $u=t^z$ and $dv=e^{-t}dt$, moves a derivative off the exponential and onto $t^z$: the boundary term vanishes at both ends, leaving $\Gamma(z+1) = z\int_0^\infty t^{z-1}e^{-t}\,dt = z\,\Gamma(z)$.

      Since $\Gamma(1)=\int_0^\infty e^{-t}\,dt=1$, the functional equation unrolls into $\Gamma(n)=(n-1)!$ for every positive integer $n$ — $\Gamma$ is the factorial extended to a continuous argument. Half-integers come from a different route: substituting $t=u^2$ turns $\Gamma(1/2)$ into $2\int_0^\infty e^{-u^2}\,du$, exactly half the Gaussian integral in disguise, evaluating to $\sqrt{\pi}$; the functional equation generates every other half-integer value from that one anchor.

      The identity that pays off constantly is a rescaled version: substituting $s=\lambda t$ turns $\int_0^\infty t^n e^{-\lambda t}\,dt$ into $\Gamma(n+1)/\lambda^{n+1} = n!/\lambda^{n+1}$, collapsing any polynomial-times-exponential integral to a single lookup.
    worked: >
      Evaluate $\int_0^\infty t^3 e^{-2t}\,dt$. Using $n=3$, $\lambda=2$: $\dfrac{3!}{2^4} = \dfrac{6}{16} = \dfrac{3}{8} = 0.375$.
    interview: >
      "Evaluate $\int_0^\infty x^5 e^{-3x}\,dx$" is meant to be answered in one line via $5!/3^6$, not five rounds of integration by parts. "What is $\Gamma(1/2)$, and why" checks whether the Gaussian-integral connection is remembered, not just the number $\sqrt{\pi}$.
    pitfalls: >
      $\Gamma(n)=(n-1)!$, not $n!$ — this off-by-one shift is the single most common recall error. Substituting $s=\lambda t$ without tracking the scaling correctly drops the $1/\lambda^{n+1}$ factor, leaving an answer off by a power of $\lambda$.
    recap: >
      $\Gamma(z)=\int_0^\infty t^{z-1}e^{-t}dt$ satisfies $\Gamma(z+1)=z\Gamma(z)$ with $\Gamma(n)=(n-1)!$ and $\Gamma(1/2)=\sqrt{\pi}$, and it collapses $\int t^n e^{-\lambda t}dt$ to $n!/\lambda^{n+1}$.
    steps:
      - teach: >
          Any interview integral shaped like $t^ne^{-\lambda t}$ should
          trigger $\Gamma$ immediately — recognizing it beats integrating
          by parts $n$ times live at the whiteboard.
      - teach: >
          Integration by parts gives $\Gamma(z+1)=z\Gamma(z)$, and since
          $\Gamma(1)=1$, this unrolls to $\Gamma(n)=(n-1)!$ for positive
          integers — $\Gamma$ is the factorial extended to a continuous
          argument.
      - ask: >
          Evaluate $\int_0^\infty t^4 e^{-3t}\,dt$.
        expects: "8/81"
        hint: >
          Use $n!/\lambda^{n+1}$ with $n=4$, $\lambda=3$.
        feedback: >
          $\dfrac{4!}{3^5}=\dfrac{24}{243}=\dfrac{8}{81}$.
      - teach: >
          Half-integers come from the Gaussian integral: substituting
          $t=u^2$ turns $\Gamma(1/2)$ into $2\int_0^\infty e^{-u^2}du
          =\sqrt\pi$, and the functional equation generates every other
          half-integer value from that one anchor.
      - ask: >
          Using $\Gamma(1/2)=\sqrt\pi\approx1.7725$ and the functional
          equation, compute $\Gamma(7/2)$.
        expects: "3.3234"
        tolerance: 0.001
        hint: >
          Apply $\Gamma(z+1)=z\Gamma(z)$ twice starting from
          $\Gamma(3/2)$.
        feedback: >
          $\Gamma(3/2)=0.5\sqrt\pi\approx0.8862$, $\Gamma(5/2)=1.5(0.8862)
          \approx1.3293$, $\Gamma(7/2)=2.5(1.3293)\approx3.3234$.
      - teach: >
          $\Gamma(n)=(n-1)!$, not $n!$ — this off-by-one shift is the
          single most common recall error, and it's easy to check by
          plugging a small integer directly into the functional equation.
      - ask: >
          What is $\Gamma(5)$?
        expects: "24"
        hint: >
          $\Gamma(n)=(n-1)!$.
        feedback: >
          $\Gamma(5)=(5-1)!=4!=24$ — not $5!=120$, the off-by-one trap
          this function invites.
      - teach: >
          Recognizing $t^n e^{-\lambda t}$ under an integral sign should be
          reflexive — reach for the factorial lookup before reaching for
          integration by parts.

  - node: quant-tools.series-calculus.beta-function
    hook: >
      "What's the expected value of the $k$-th smallest of $n$ uniform draws" collapses instantly to this identity, and memorizing the integer form directly beats setting up the calculus fresh in the room.
    explanation: >
      The substitution $t\mapsto 1-t$ leaves $\int_0^1 t^{a-1}(1-t)^{b-1}\,dt$ unchanged in value while swapping $a$ and $b$'s roles, which is why $B(a,b)=B(b,a)$ is visible directly from the integral, matching the symmetry already built into $\Gamma(a)\Gamma(b)/\Gamma(a+b)$.

      For nonnegative integers $m,n$, the Gamma factors collapse to factorials: $\int_0^1 t^m(1-t)^n\,dt = m!\,n!/(m+n+1)!$ — worth having memorized directly rather than rederived through $\Gamma$ each time, since it turns up constantly on its own.

      The reason it governs order statistics: among $n$ independent uniform draws on $[0,1]$, the $k$-th smallest value landing near $t$ requires $k-1$ draws below $t$, one at $t$, and $n-k$ above — a combinatorial weight times exactly $t^{k-1}(1-t)^{n-k}$, so the Beta integral is precisely the normalizing constant that makes order statistics' means and densities come out clean.
    worked: >
      Evaluate $\int_0^1 t^2(1-t)^4\,dt = \dfrac{2!\,4!}{7!} = \dfrac{2\cdot 24}{5040} = \dfrac{48}{5040} = \dfrac{1}{105}$.
    interview: >
      "What's the expected position of the minimum of $n$ independent uniform$(0,1)$ draws" is answered via a Beta integral; a bare version, "evaluate $\int_0^1 x^4(1-x)^3\,dx$ by inspection", tests whether the factorial identity is reflexive rather than requiring a fresh setup.
    pitfalls: >
      The denominator is $(m+n+1)!$, one more than the sum of the two exponents, not $(m+n)!$ — dropping the $+1$ is the most common slip. The clean factorial form only applies for nonnegative integer $a,b$; noninteger exponents need the $\Gamma$ form directly.
    recap: >
      $\int_0^1 t^m(1-t)^n\,dt = m!\,n!/(m+n+1)!$, the identity behind every clean order-statistic mean, and here it evaluates to $1/105$.
    steps:
      - teach: >
          "What's the expected value of the $k$-th smallest of $n$ uniform
          draws" collapses instantly to this identity — memorizing the
          integer form directly beats setting up the calculus fresh in the
          room.
      - teach: >
          The substitution $t\mapsto1-t$ leaves the integral unchanged
          while swapping $a$ and $b$, so $B(a,b)=B(b,a)$ is visible
          directly. For nonnegative integers, $\int_0^1 t^m(1-t)^n\,dt
          =m!\,n!/(m+n+1)!$.
      - ask: >
          Evaluate $\int_0^1 t^4(1-t)^3\,dt$.
        expects: "1/280"
        hint: >
          Use $m!\,n!/(m+n+1)!$ with $m=4$, $n=3$.
        feedback: >
          $\dfrac{4!\,3!}{8!}=\dfrac{24\cdot6}{40320}=\dfrac{144}{40320}
          =\dfrac{1}{280}$.
      - teach: >
          The reason it governs order statistics: among $n$ independent
          uniform draws, the $k$-th smallest landing near $t$ needs $k-1$
          draws below $t$, one at $t$, and $n-k$ above — a weight
          proportional to $t^{k-1}(1-t)^{n-k}$.
      - ask: >
          Among $6$ independent Uniform$(0,1)$ draws, the minimum's
          density near $t$ is proportional to $(1-t)^5$. What does
          $\int_0^1(1-t)^5\,dt$ equal?
        expects: "1/6"
        hint: >
          This is $\int_0^1 t^0(1-t)^5\,dt$: use $m=0$, $n=5$.
        feedback: >
          $\dfrac{0!\,5!}{6!}=\dfrac{120}{720}=\dfrac16$.
      - teach: >
          The denominator is $(m+n+1)!$, one more than the sum of the two
          exponents, not $(m+n)!$ — dropping the $+1$ is the most common
          slip with this identity.
      - ask: >
          A candidate evaluates $\int_0^1 t^2(1-t)^3\,dt$ as
          $\dfrac{2!\,3!}{5!}$. What went wrong?
        choices:
          - text: >
              The denominator should be $6!$, since it's $(m+n+1)!$, not
              $(m+n)!$.
            correct: true
            feedback: >
              Correctly, $\dfrac{2!\,3!}{6!}=\dfrac{12}{720}=\dfrac1{60}$
              — dropping the $+1$ gives a denominator six times too small.
          - text: >
              The numerator should have $3!$ and $2!$ swapped.
            feedback: >
              $B(a,b)=B(b,a)$, so the order of the factorials in the
              numerator doesn't matter at all.
          - text: >
              This formula only works when $m=n$.
            feedback: >
              It holds for any nonnegative integers $m,n$, equal or not.
        feedback: >
          Always check the denominator is one more than the sum of the two
          exponents — the single most common slip with this identity.
      - teach: >
          The clean factorial form only applies for nonnegative integer
          $a,b$; noninteger exponents need the $\Gamma$ form,
          $\Gamma(a)\Gamma(b)/\Gamma(a+b)$, directly.

  - node: quant-tools.series-calculus.stirling
    hook: >
      "How many digits does $100!$ have" and "approximate $\binom{2n}{n}$" both start here, and the interviewer wants the log form produced from the integral estimate, not a memorized numeric coincidence.
    explanation: >
      Writing $n! = \Gamma(n+1) = \int_0^\infty t^n e^{-t}\,dt = \int_0^\infty e^{n\ln t - t}\,dt$ turns the factorial into an integral whose exponent peaks sharply at $t=n$ and looks locally like a downward parabola there — a Gaussian bump sitting on top of the peak value. Approximating that bump by an actual Gaussian and integrating it is exactly where the $\sqrt{2\pi n}$ prefactor originates; it's the same constant as the Gaussian integral because the local shape genuinely is Gaussian.

      The log form, $\ln(n!) = n\ln n - n + \tfrac{1}{2}\ln(2\pi n) + O(1/n)$, has a leading part, $n\ln n - n$, that is exactly the integral bound $\int_1^n \ln x\,dx = n\ln n - n + 1$ on $\sum \ln k$ — the same integral-comparison sandwich used for the harmonic numbers, applied here to $f(x)=\ln x$ instead of $1/x$. Stirling's contribution beyond that estimate is the sharper correction term, $\tfrac{1}{2}\ln(2\pi n)$.

      The relative error of the leading approximation is about $1/(12n)$ — small for $n$ in the tens or hundreds, but not negligible for single-digit $n$, where a percent-level correction is easy to spot by direct comparison.
    worked: >
      Estimate $6!$: $\sqrt{2\pi\cdot 6}\,(6/e)^6 = \sqrt{12\pi}\,(6/e)^6 \approx 6.140\times 115.63 \approx 710.0$, against the true $6!=720$ — low by about $1.4\%$, matching the predicted $1/(12\cdot 6) \approx 1.39\%$.
    interview: >
      "Roughly how big is $50!$, order of magnitude" is answered by taking logs and plugging into the log form, since the raw number is unmanageable by hand. "Derive the leading term from an integral bound, not the full formula" points straight back to comparing $\sum\ln k$ to $\int\ln x\,dx$.
    pitfalls: >
      Using only the crude estimate $n\ln n - n$ and dropping the $\tfrac{1}{2}\ln(2\pi n)$ correction underestimates $\ln(n!)$ by a term that, while lower order, is not negligible for moderate $n$. Treating Stirling as exact rather than asymptotic is risky for small $n$, where the relative error is already several percent.
    recap: >
      $n! \sim \sqrt{2\pi n}(n/e)^n$, with the $\sqrt{2\pi}$ coming from the locally Gaussian peak of $\Gamma(n+1)$'s integrand and relative error about $1/(12n)$.
    steps:
      - teach: >
          "How many digits does $100!$ have" and "approximate
          $\binom{2n}{n}$" both start here, and the interviewer wants the
          log form produced from the integral estimate, not a memorized
          numeric coincidence.
      - teach: >
          $n!\sim\sqrt{2\pi n}(n/e)^n$, with log form $\ln(n!)=n\ln n-n
          +\tfrac12\ln(2\pi n)+O(1/n)$. The relative error of the leading
          term is about $1/(12n)$.
      - ask: >
          Using Stirling's log form, estimate $\ln(12!)$ to two decimal
          places.
        expects: "19.98"
        tolerance: 0.05
        hint: >
          $12\ln12-12+\tfrac12\ln(24\pi)$.
        feedback: >
          $12(2.4849)-12+0.5\ln(75.40)\approx29.82-12+2.16=19.98$,
          matching the true $\ln(12!)\approx19.99$ closely.
      - teach: >
          The leading part $n\ln n-n$ is exactly the integral bound
          $\int_1^n\ln x\,dx=n\ln n-n+1$ on $\sum\ln k$ — the same
          integral-comparison sandwich used for the harmonic numbers,
          applied here to $\ln x$ instead of $1/x$.
      - ask: >
          Estimate $4!$ using $\sqrt{2\pi n}(n/e)^n$ at $n=4$, to one
          decimal place.
        expects: "23.5"
        tolerance: 0.2
        hint: >
          Compute $\sqrt{8\pi}$ and $(4/e)^4$ separately, then multiply.
        feedback: >
          $\sqrt{8\pi}\approx5.013$ and $(4/e)^4\approx4.689$, so the
          product is $\approx23.5$, against the true $4!=24$.
      - teach: >
          Using only $n\ln n-n$ and dropping the $\tfrac12\ln(2\pi n)$
          correction underestimates $\ln(n!)$ by a term that, while lower
          order, is not negligible for moderate $n$.
      - ask: >
          Which best explains why $n\ln n-n$ alone underestimates
          $\ln(n!)$?
        choices:
          - text: >
              It's missing the $\tfrac12\ln(2\pi n)$ correction term
              entirely.
            correct: true
            feedback: >
              That correction is smaller-order than $n\ln n - n$ but not
              negligible — dropping it systematically underestimates.
          - text: >
              It should use $n\ln n+n$ instead.
            feedback: >
              The sign is right; $\ln(n!)$ genuinely has a $-n$ term from
              the peak of the Gamma integrand.
          - text: >
              $\ln(n!)$ actually equals $n\ln n-n$ exactly.
            feedback: >
              It's only the leading term of an asymptotic expansion, not
              an exact identity.
        feedback: >
          $n\ln n - n$ is the leading term of an asymptotic series; the
          $\tfrac12\ln(2\pi n)$ correction is the next term, and skipping
          it costs real accuracy at moderate $n$.
      - teach: >
          Treating Stirling as exact rather than asymptotic is riskiest for
          small $n$, where the relative error is already several percent —
          the formula earns its keep at the tens and hundreds, not below.

  - node: quant-tools.series-calculus.stirling-central-binomial
    hook: >
      "What's the probability of exactly half heads in a large number of flips" is answered cold with this one asymptotic, no exact factorial arithmetic required.
    explanation: >
      Apply Stirling to each factorial in $\binom{2n}{n} = (2n)!/(n!)^2$: the $e^{-2n}$ from $(2n)!$ exactly cancels the $e^{-2n}$ from $(n!)^2$, and the leftover power terms simplify to $2^{2n}=4^n$ once collected — the messy exponential and polynomial pieces vanish, leaving a clean $4^n$ times a square-root correction, $\binom{2n}{n} \sim 4^n/\sqrt{\pi n}$.

      Dividing by the total count of sequences, $2^{2n}=4^n$, turns this into a probability: the chance of exactly $n$ heads in $2n$ fair flips is $\approx 1/\sqrt{\pi n}$. This is the discrete cousin of a bell curve's peak height — the binomial distribution's tallest bar shrinks like $1/\sqrt{n}$ as the number of flips grows, the same square-root-of-$n$ scaling that shows up whenever a sum of many independent steps is examined near its center.
    worked: >
      In $40$ fair coin flips, estimate the probability of exactly $20$ heads. With $n=20$: $\binom{40}{20}/2^{40} \approx 1/\sqrt{20\pi} = 1/\sqrt{62.83} \approx 1/7.927 \approx 0.126$, close to the exact value $0.1254$.
    interview: >
      "In $40$ coin flips, what's the probability of exactly $20$ heads" is answered directly with $1/\sqrt{\pi n}$ at $n=20$; "how does the central binomial coefficient grow with $n$" tests whether the $4^n/\sqrt{\pi n}$ form comes out without deriving Stirling from scratch each time.
    pitfalls: >
      Dropping the $\sqrt{\pi n}$ correction and answering with $4^n$ alone is wrong by a factor that itself grows with $\sqrt{n}$. The clean cancellation is special to the exactly-central case $\binom{2n}{n}$ — a nearby coefficient like $\binom{2n}{n+1}$ needs its own similar but distinct asymptotic.
    recap: >
      $\binom{2n}{n} \sim 4^n/\sqrt{\pi n}$, so the probability of exactly half heads in $2n$ fair flips is about $1/\sqrt{\pi n}$ — roughly $12.6\%$ at $n=20$.
    steps:
      - teach: >
          "What's the probability of exactly half heads in a large number
          of flips" is answered cold with this one asymptotic, no exact
          factorial arithmetic required.
      - teach: >
          Applying Stirling to $(2n)!/(n!)^2$ cancels the exponential and
          polynomial pieces, leaving $\binom{2n}{n}\sim4^n/\sqrt{\pi n}$;
          dividing by $2^{2n}=4^n$ turns this into the probability
          $\approx1/\sqrt{\pi n}$.
      - ask: >
          In $64$ fair coin flips, estimate the probability of exactly
          $32$ heads.
        expects: "0.0997"
        tolerance: 0.001
        hint: >
          Use $1/\sqrt{\pi n}$ with $n=32$.
        feedback: >
          $1/\sqrt{32\pi}=1/\sqrt{100.53}\approx1/10.03\approx0.0997$.
      - teach: >
          This is the discrete cousin of a bell curve's peak height — the
          binomial distribution's tallest bar shrinks like $1/\sqrt n$ as
          the number of flips grows, the same scaling that shows up
          whenever a sum of many independent steps is examined near its
          center.
      - ask: >
          If the number of flips is quadrupled from $n$ to $4n$, how does
          the peak probability $1/\sqrt{\pi n}$ change?
        choices:
          - text: >
              It halves.
            correct: true
            feedback: >
              $1/\sqrt{\pi(4n)}=\tfrac12\cdot1/\sqrt{\pi n}$ — quadrupling
              the flips only halves the peak, the square-root shrinkage
              typical of a sum of independent steps.
          - text: >
              It quarters.
            feedback: >
              That would be the effect of quadrupling $n$ inside a $1/n$
              rate, not a $1/\sqrt n$ one.
          - text: >
              It stays the same.
            feedback: >
              The peak does shrink as the number of flips grows — more
              flips spread the same total probability over more outcomes.
        feedback: >
          The peak probability shrinks like $1/\sqrt n$, so quadrupling
          $n$ exactly halves it.
      - teach: >
          Dropping the $\sqrt{\pi n}$ correction and answering with $4^n$
          alone is wrong by a factor that itself grows with $\sqrt n$ — the
          correction is not a rounding nicety.
      - ask: >
          Which coefficient does $4^n/\sqrt{\pi n}$ approximate accurately?
        choices:
          - text: >
              $\binom{2n}{n}$ only.
            correct: true
            feedback: >
              The clean cancellation of the $e^{-n}$ and $n^n$ pieces is
              special to the exactly-central case $k=n$.
          - text: >
              $\binom{2n}{n+1}$ equally well.
            feedback: >
              A nearby coefficient needs its own distinct asymptotic — the
              cancellation doesn't carry over automatically.
          - text: >
              Any $\binom{2n}{k}$, for any $k$.
            feedback: >
              Far from the center the coefficient shrinks rapidly and this
              formula badly overestimates it.
        feedback: >
          The cancellation that produces $4^n/\sqrt{\pi n}$ is specific to
          the exact middle of the row, $\binom{2n}{n}$.
      - teach: >
          Both numbers come from the same Stirling substitution — no need
          to memorize the coefficient and the probability as two separate
          facts.

  - node: quant-tools.series-calculus.am-gm
    hook: >
      "Maximize a product given a fixed sum" or "minimize $x+1/x$" is AM–GM in one line, and the interviewer listens for the equality condition stated alongside the inequality, not just the bound.
    explanation: >
      The two-term case is one line of algebra: $(\sqrt a - \sqrt b)^2 \ge 0$ expands to $a+b \ge 2\sqrt{ab}$, and dividing by $2$ gives $\dfrac{a+b}{2} \ge \sqrt{ab}$, with equality exactly when $\sqrt a = \sqrt b$, i.e., $a=b$. The general $n$-term case extends this by induction, or by the concavity of $\ln$, which turns "the average of $\ln a_i$ is at most $\ln$ of the average of $a_i$" into exactly this inequality after exponentiating.

      The mental model worth keeping: holding the sum of a group of numbers fixed, spreading them apart can only shrink their product, and pulling them back together toward equal values can only grow it — so the product is maximized exactly when there's no spread left, all values equal.

      Two consequences are used constantly. Setting $a=x$, $b=1/x$ gives $x+1/x\ge 2$ for any $x>0$. And for a fixed sum $S$ split into $n$ positive parts, the product is largest exactly when every part equals $S/n$, with maximum value $(S/n)^n$ — the one-line answer to any "split a budget to maximize a product" question.
    worked: >
      Minimize $x+4/x$ for $x>0$. By AM–GM, $x+4/x \ge 2\sqrt{x\cdot(4/x)} = 2\sqrt{4} = 4$, with equality when $x=4/x$, i.e., $x=2$. So the minimum value is $4$, attained at $x=2$.
    interview: >
      "What's the minimum of $x+1/x$ for $x>0$" is meant to be answered in one line, cold. "Split a budget $S$ among $n$ investments to maximize the product of the returns" expects "split equally, giving $(S/n)^n$" without hesitation.
    pitfalls: >
      AM–GM requires nonnegative terms — applying it to negative numbers can reverse or invalidate the inequality entirely. Equality demands every term be equal simultaneously, not just that the arithmetic mean happens to match the geometric mean for some subset.
    recap: >
      The arithmetic mean is always at least the geometric mean, with equality only when every term is equal — the one-line answer to "maximize a product given a fixed sum".
    steps:
      - teach: >
          "Maximize a product given a fixed sum" or "minimize $x+1/x$" is
          AM–GM in one line, and the interviewer listens for the equality
          condition stated alongside the bound, not just the number.
      - teach: >
          The two-term case is one line: $(\sqrt a-\sqrt b)^2\ge0$ expands
          to $a+b\ge2\sqrt{ab}$, with equality exactly when $a=b$. The
          $n$-term case extends this by induction or the concavity of
          $\ln$.
      - ask: >
          Minimize $x+9/x$ for $x>0$.
        expects: "6"
        hint: >
          Apply AM–GM with $a=x$, $b=9/x$: $a+b\ge2\sqrt{ab}$.
        feedback: >
          $x+9/x\ge2\sqrt{x\cdot9/x}=2\sqrt9=6$, with equality at $x=3$.
      - teach: >
          For a fixed sum $S$ split into $n$ positive parts, the product is
          largest exactly when every part equals $S/n$, with maximum value
          $(S/n)^n$ — the one-line answer to any "split a budget to
          maximize a product" question.
      - ask: >
          Split $12$ into $4$ positive parts to maximize their product.
          What is that maximum product?
        expects: "81"
        hint: >
          Each part should equal $12/4$.
        feedback: >
          $(12/4)^4=3^4=81$.
      - teach: >
          AM–GM requires nonnegative terms — applying it to negative
          numbers can reverse or invalidate the inequality entirely, since
          the proof rests on real square roots.
      - ask: >
          For which set of numbers does AM–GM fail to apply directly?
        choices:
          - text: >
              $\{2,3,5\}$
            feedback: >
              All positive — AM–GM applies with no issue.
          - text: >
              $\{-1,4\}$
            correct: true
            feedback: >
              With a negative term present, $\sqrt{(-1)(4)}$ isn't a real
              number in general — the inequality's proof assumes real
              square roots throughout.
          - text: >
              $\{7,7,7\}$
            feedback: >
              All equal and positive — this is exactly the equality case,
              not a failure case.
        feedback: >
          AM–GM is stated for nonnegative reals; a negative term breaks the
          geometric mean before the inequality can even be evaluated.
      - teach: >
          The inequality is symmetric in a stronger sense than it looks:
          squeezing values toward each other at a fixed sum can only grow
          their product, never shrink it.

  - node: quant-tools.series-calculus.cauchy-schwarz
    hook: >
      Bounding a correlation coefficient in $[-1,1]$, or maximizing a linear combination subject to a fixed sum of squares, is this inequality every time, and the interviewer wants the discriminant proof, not a memorized formula.
    explanation: >
      For real numbers $a_i,b_i$, the function $t\mapsto \sum_i(a_i+tb_i)^2$ is a sum of squares, so it's never negative for any real $t$ — expanding it as a quadratic in $t$, $\left(\sum b_i^2\right)t^2 + 2\left(\sum a_ib_i\right)t + \sum a_i^2$, a nonnegative quadratic can have at most one real root, forcing its discriminant $\le 0$: exactly $\left(\sum a_ib_i\right)^2 \le \left(\sum a_i^2\right)\left(\sum b_i^2\right)$.

      The geometric reading is that an inner product can never exceed the product of the two vectors' lengths, with equality exactly when one vector is a scalar multiple of the other — nothing "sideways" left over. This is the source of the bound $|\rho|\le 1$ on any correlation coefficient, since a correlation is an inner product of centered variables normalized by their lengths.

      Taking every $b_i=1$ specializes it to $\left(\sum a_i\right)^2 \le n\sum a_i^2$, which rearranges to $\sqrt{\sum a_i^2/n} \ge \left(\sum a_i\right)/n$ — root-mean-square is at least the arithmetic mean, a close cousin of the AM–GM chain rather than an unrelated fact.
    worked: >
      Maximize $x+2y+2z$ subject to $x^2+y^2+z^2=9$. Cauchy–Schwarz with $(1,2,2)$ gives the bound $\sqrt{1+4+4}\cdot\sqrt{9} = 3\cdot 3 = 9$, attained when $(x,y,z)$ is proportional to $(1,2,2)$, i.e., at $(1,2,2)$ itself since that already has norm $3$.
    interview: >
      "Show that any correlation coefficient is between $-1$ and $1$" is answered by applying Cauchy–Schwarz to the centered variables, with the discriminant argument stated, not just asserted. "Maximize $\sum a_ix_i$ subject to $\sum x_i^2=1$" is the same inequality with the equality condition, parallel vectors, as the punchline.
    pitfalls: >
      Forgetting that equality requires the two vectors to be proportional — not merely that both sides happen to be positive — misses the actual maximizing point. Applying the raw, uncentered inequality directly to random variables instead of their centered, standardized versions gives a bound on the wrong quantity for a correlation claim.
    recap: >
      $(\sum a_ib_i)^2 \le (\sum a_i^2)(\sum b_i^2)$, proved from a nonnegative quadratic's discriminant, with equality only when the vectors are parallel — here it caps $x+2y+2z$ at $9$.
    steps:
      - teach: >
          Bounding a correlation coefficient in $[-1,1]$, or maximizing a
          linear combination subject to a fixed sum of squares, is this
          inequality every time — the interviewer wants the discriminant
          proof, not a memorized formula.
      - teach: >
          $t\mapsto\sum_i(a_i+tb_i)^2$ is a sum of squares, never negative
          for any real $t$. As a quadratic in $t$, that forces its
          discriminant $\le0$, which is exactly $(\sum a_ib_i)^2\le
          (\sum a_i^2)(\sum b_i^2)$.
      - ask: >
          Maximize $2x+3y$ subject to $x^2+y^2=13$.
        expects: "13"
        hint: >
          The bound is $\sqrt{2^2+3^2}\cdot\sqrt{x^2+y^2}$.
        feedback: >
          $\sqrt{4+9}\cdot\sqrt{13}=\sqrt{13}\cdot\sqrt{13}=13$, attained
          when $(x,y)$ is proportional to $(2,3)$.
      - teach: >
          Taking every $b_i=1$ specializes the inequality to
          $(\sum a_i)^2\le n\sum a_i^2$ — root-mean-square is at least the
          arithmetic mean, a close cousin of AM–GM rather than an
          unrelated fact.
      - ask: >
          By Cauchy–Schwarz with every $b_i=1$, $(\sum a_i)^2\le
          n\sum a_i^2$. For $a=(1,2,3,6)$, what is $n\sum a_i^2$?
        expects: "200"
        hint: >
          $n=4$ and $\sum a_i^2=1+4+9+36$.
        feedback: >
          $n\sum a_i^2=4\cdot50=200$, and indeed $(\sum a_i)^2=12^2=144
          \le200$.
      - teach: >
          Equality requires the two vectors to be proportional — not
          merely that both sides of the inequality happen to be positive.
      - ask: >
          A candidate shows $|\text{Corr}(X,Y)|\le1$ by applying
          Cauchy–Schwarz directly to $X$ and $Y$ themselves, not to their
          centered versions. What goes wrong?
        choices:
          - text: >
              Nothing — the bound comes out the same either way.
            feedback: >
              The bound produced constrains $\mathbb{E}[XY]$ against
              $\mathbb{E}[X^2]\mathbb{E}[Y^2]$ — a different, uncentered
              quantity from the correlation.
          - text: >
              It bounds $\mathbb{E}[XY]$ against $\mathbb{E}[X^2]
              \mathbb{E}[Y^2]$, not the covariance against the variances.
            correct: true
            feedback: >
              The correlation is an inner product of centered, normalized
              variables — applying the raw inequality to $X,Y$ skips the
              centering step entirely.
          - text: >
              Cauchy–Schwarz doesn't apply to random variables at all.
            feedback: >
              It applies fine — the issue is which quantities it's
              applied to, not whether it's applicable.
        feedback: >
          Center the variables first: the correlation bound comes from
          applying the inequality to $X-\mathbb{E}[X]$ and
          $Y-\mathbb{E}[Y]$, not to $X$ and $Y$ raw.
      - teach: >
          An inner product is capped by the product of the two vectors'
          lengths, with nothing sideways left over exactly when one vector
          is a scalar multiple of the other.

  - node: quant-tools.series-calculus.asymptotic-hierarchy
    hook: >
      "Which term dominates" is the two-second check that stops you from doing careful algebra on a piece of an expression that vanishes in the limit anyway.
    explanation: >
      Taking logs turns every comparison in the chain $\ln n \ll n^\alpha \ll c^n \ll n! \ll n^n$ into ordinary arithmetic on simpler functions: $\alpha\ln n$ grows slower than $n\ln c$ for any fixed $\alpha$ and $c>1$ because $\ln n$ itself grows slower than $n$, and $n\ln c$ grows slower than $\ln(n!) \approx n\ln n - n$ because $\ln n\to\infty$ eventually swamps the fixed constant $\ln c$ — that last comparison is exactly Stirling's log form doing the work.

      The slow end of the chain is calibrated by the harmonic numbers: $H_n \sim \ln n$ is about the gentlest genuine divergence you'll encounter, and $\sum k^{-p}$ for $p>1$ doesn't diverge at all, sitting below every term in the chain.

      The habit this buys: name the single dominant term in an expression before doing any algebra on it, so everything else becomes a correction whose size you can bound rather than a term you might casually drop without noticing it mattered.
    worked: >
      Which is bigger, $100!$ or $10^{150}$? Using Stirling's log form, $\ln(100!) \approx 100\ln 100 - 100 + \tfrac{1}{2}\ln(200\pi) \approx 460.52 - 100 + 3.22 = 363.74$. And $\ln(10^{150}) = 150\ln 10 \approx 345.39$. Since $363.74 > 345.39$, $100!$ is the larger number — in fact $100! \approx 9.3\times 10^{157}$.
    interview: >
      "Which grows faster, $n!$ or $2^n$" wants the log-ranking recited without hesitation, not a guess based on which "feels" bigger at small $n$. A sharper version asks to order several expressions at once, testing whether the full chain, not just one pairwise comparison, is available on demand.
    pitfalls: >
      Comparing raw magnitudes by hand for large arguments is numerically unstable or outright impossible — always compare logs instead. Assuming a bigger-looking base always wins ignores that the exponent's own growth rate matters more than the base; $n^n$ eventually beats any fixed $c^n$ even though $c^n$ looks faster for small $n$.
    recap: >
      Logs turn growth comparisons into arithmetic, $\ln n \ll n^\alpha \ll c^n \ll n! \ll n^n$, so naming the dominant term is a two-second check, not a derivation.
    steps:
      - teach: >
          "Which term dominates" is the two-second check that stops you
          from doing careful algebra on a piece of an expression that
          vanishes in the limit anyway.
      - teach: >
          Taking logs turns every comparison in $\ln n\ll n^\alpha\ll c^n
          \ll n!\ll n^n$ into ordinary arithmetic — Stirling's log form is
          exactly what makes the $n!$-versus-$c^n$ link concrete.
      - ask: >
          Which is bigger, $50!$ or $10^{70}$?
        choices:
          - text: >
              $50!$
            feedback: >
              $\ln(50!)\approx148.5$, while $\ln(10^{70})\approx161.2$ —
              $50!$ is actually the smaller of the two here.
          - text: >
              $10^{70}$
            correct: true
            feedback: >
              $\ln(50!)\approx50\ln50-50+\tfrac12\ln(100\pi)\approx148.5$,
              while $\ln(10^{70})=70\ln10\approx161.2$. Since
              $148.5<161.2$, $10^{70}$ is larger — factorials don't win at
              every scale, only eventually.
          - text: >
              They are about equal.
            feedback: >
              The logs differ by more than $12$, a gap of many orders of
              magnitude, not a near tie.
        feedback: >
          Comparing logs settles it: $\ln(50!)\approx148.5 <
          \ln(10^{70})\approx161.2$, so $10^{70}$ wins here — $n!$
          eventually dominates any fixed exponential, but "eventually" can
          be well past $n=50$.
      - teach: >
          The slow end of the chain is calibrated by the harmonic numbers:
          $H_n\sim\ln n$ is about the gentlest genuine divergence you'll
          meet, and $\sum k^{-p}$ for $p>1$ doesn't diverge at all.
      - ask: >
          $5!=120$ and $2^5=32$. By what multiple does $5!$ already exceed
          $2^n$ at this small $n$?
        expects: "3.75"
        hint: >
          Divide $120$ by $32$.
        feedback: >
          $120/32=3.75$ — even at $n=5$, $n!$ already exceeds $2^n$,
          consistent with $n!$ eventually dominating any fixed
          exponential.
      - teach: >
          Assuming a bigger-looking base always wins ignores that the
          exponent's own growth rate matters more than the base — a fixed
          base loses eventually to a base that grows with $n$.
      - ask: >
          $100^n$ versus $n^n$ — which eventually dominates?
        choices:
          - text: >
              $100^n$ always, since $100$ is the bigger base.
            feedback: >
              This only holds for $n<100$; a fixed base cannot keep up
              once the other base starts growing with $n$.
          - text: >
              $n^n$, since its own base keeps growing while $100$ stays
              fixed.
            correct: true
            feedback: >
              $n^n$ overtakes $100^n$ permanently once $n>100$ — the
              crossover is exactly where the two bases are equal.
          - text: >
              They grow at the same rate.
            feedback: >
              $n^n$'s growth rate itself increases with $n$; $100^n$'s
              does not, so the two rates diverge without bound.
        feedback: >
          $n^n$ eventually beats any fixed-base exponential like $100^n$,
          even though $c^n$ looks faster for small $n$ — naming the
          dominant term means checking whether the base itself is growing.
      - teach: >
          Name the dominant factor before doing any algebra on an
          expression — everything else becomes a correction you can bound,
          not a term you might drop by accident.
