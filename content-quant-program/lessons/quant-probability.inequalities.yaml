unit: quant-probability.inequalities
opening: >
  This unit collects the standard levers for turning limited information about
  a random variable — a mean, a mean and a variance, a moment generating
  function, or nothing but a list of bad events — into a bound on a tail
  probability. Markov starts the chain: the weakest bound, needing only a
  mean, and every sharper bound in the unit is Markov applied to a cleverly
  chosen transformation of $X$. Chebyshev squares first and buys $1/k^{2}$
  decay from two moments; Chernoff exponentiates first and buys exponential
  decay from the full moment generating function, at the cost of computing
  it. Jensen, the union bound, and Cauchy–Schwarz solve a different kind of
  problem — moving a function through an expectation, bounding a union
  without independence, capping a covariance — and the unit closes with a
  decision list for picking the right tool under interview pressure.
lessons:
  - node: quant-probability.inequalities.markov
    hook: >
      Markov's inequality is the fallback that always works — when a problem
      hands you nothing but a mean and a promise of nonnegativity, this is
      the one bound you can always write down, and interviewers use it to
      check you don't reach for machinery you don't have the inputs for.
    explanation: >
      Think of $\mathbb{E}[X]$ as a fixed budget of probability mass times
      value. If a chunk of that mass, however small, sat far out past $a$, it
      would drag the average up more than the rest of the distribution could
      pull it down — since $X$ can't go negative, there's no room below zero
      to compensate. Markov turns that intuition into an inequality by
      comparing $X$ to the crude approximation $a\mathbf{1}\{X \ge a\}$,
      which is $0$ where $X$ is small and $a$ where $X$ is already at least
      $a$; $X$ dominates this approximation everywhere, so its mean does
      too.

      Nonnegativity is what keeps the argument honest: allow negative
      values and a large negative outcome could pull $\mathbb{E}[X]$ below
      $a\Pr(X\ge a)$ even with the exact same upper tail, breaking the
      inequality. The rescaled form $\Pr(X \ge k\,\mathbb{E}[X]) \le 1/k$ is
      the one worth memorizing cold, since it needs no units — a variable is
      at least $k$ times its own mean with probability at most $1/k$, for
      any nonnegative $X$ whatsoever.

      Every sharper bound in this unit is secretly Markov in disguise:
      Chebyshev applies it to $(X-\mu)^{2}$, Chernoff applies it to
      $e^{tX}$. Reaching for Markov by name signals you know it's the floor,
      not the ceiling, of what's available.
    worked: >
      A queue's waiting time $W$ (minutes) is nonnegative with mean
      $\mathbb{E}[W] = 4$, no other information about its shape. Bound the
      chance a customer waits at least $20$ minutes: $\Pr(W \ge 20) \le
      4/20 = 1/5$. In the rescaled form, $20 = 5 \times 4$, so $k=5$ and the
      bound is $1/5$ directly.
    interview: >
      The trigger phrase is "given only the mean, bound this probability" —
      say the rescaled form $\Pr(X \ge k\mu) \le 1/k$ out loud and name it
      Markov before computing. A follow-up almost always asks how loose the
      bound is on a specific distribution, which is really asking you to
      recall the tightness example.
    pitfalls: >
      Applying Markov to a variable that can be negative (net P&L,
      temperature) without first shifting or taking an absolute value gives
      a meaningless or false bound. Quoting Markov's number as if it were
      the actual probability, rather than an upper bound that is often off
      by a wide margin, undersells your own answer.
    recap: >
      Markov turns a bare mean into a tail bound, $\Pr(X\ge a) \le
      \mathbb{E}[X]/a$ for nonnegative $X$, and it is the weakest bound in
      the toolkit precisely because it is the only one that always applies.
    dialogue:
      - part: A mean and nothing else
        teach: >
          A desk's order router rejects some orders every day. The daily count
          of rejections averages $6$. That is all you are told: no histogram,
          no variance, no history. Risk asks how often a day can see $48$ or
          more rejections.
      - ask: >
          Suppose one day in five had $48$ or more rejections. Those days
          alone would contribute at least how much to the long-run average
          daily count?
        expects: "9.6"
        hint: >
          A fraction $1/5$ of days, each contributing at least $48$.
        feedback: >
          $(1/5)(48) = 9.6$. The other days cannot pull that back down — a
          count is never below $0$ — so the average would be at least $9.6$,
          not $6$. One day in five is impossible.
      - ask: >
          What is the largest fraction of days that can have $48$ or more
          rejections, given the average of $6$?
        expects: "1/8"
        hint: >
          Call the fraction $p$ and repeat the last computation with $p$ in
          place of $1/5$.
        feedback: >
          The bad days contribute at least $48p$ and the rest at least $0$, so
          $48p \le 6$ and $p \le 6/48 = 1/8$. And $1/8$ is reachable: one day
          in eight at exactly $48$, the rest at $0$, has mean $6$.
      - ask: >
          Same question about the desk's daily P&L, in thousands: it averages
          $6$, and you want a ceiling on how often it reaches $48$. What can
          the mean alone promise?
        choices:
          - text: >
              At most $1/8$ of days, by the same argument.
            feedback: >
              The argument needed the other days to contribute at least $0$. A
              P&L can be negative: let it be $48$ or $-36$ with equal
              probability. The mean is $6$, and half the days reach $48$.
          - text: >
              At most $1/16$, since a P&L can miss in either direction.
            feedback: >
              Losses do not shrink the upside; they pay for it. The law that
              is $48$ or $-36$ with equal probability has mean $6$ and reaches
              $48$ on half the days.
          - text: >
              Nothing useful: losses on the other days can offset any number
              of big days.
            correct: true
            feedback: >
              Right. For any fraction $p < 1$, put $48$ on a fraction $p$ of
              days and $(6 - 48p)/(1 - p)$ on the rest; the mean is $6$.
        feedback: >
          The count and the P&L have the same mean and the same threshold.
          Only one of them yields a bound, and the difference is a sign.
      - reflect: >
          What did the rejection count have that the P&L did not, and where
          did your computation use it? Try to say it as one comparison, outcome
          by outcome, between $X$ and a simpler variable that is $0$ on most
          days.
        answer: >
          The count is never negative. On a day with $X \ge 48$ it is at least
          $48$; on any other day it is at least $0$. So on every day
          $X \ge 48\,\mathbf{1}\{X \ge 48\}$, and averaging both sides gives
          $6 \ge 48\Pr(X \ge 48)$. That is the whole argument, and the P&L
          breaks it.

      - part: One comparison, one line
        teach: >
          That is Markov's inequality. For $X \ge 0$ and $a > 0$,
          $X \ge a\,\mathbf{1}\{X \ge a\}$ on every outcome; the mean of an
          indicator is the probability of its event, so
          $\Pr(X \ge a) \le \mathbb{E}[X]/a$. With $a = k\,\mathbb{E}[X]$ it
          reads $1/k$: a nonnegative variable reaches $k$ times its mean with
          probability at most $1/k$. Your $1/8$ was $k = 8$.
      - ask: >
          Where in the comparison $X \ge a\,\mathbf{1}\{X \ge a\}$ is $X \ge 0$
          actually used?
        choices:
          - text: >
              On outcomes with $X \ge a$, to conclude $X \ge a$.
            feedback: >
              There the inequality $X \ge a$ is the definition of the event; no
              sign condition is needed.
          - text: >
              In taking expectations of both sides, which needs nonnegative
              variables.
            feedback: >
              Expectation preserves a pointwise inequality between any two
              variables with finite means. Signs play no part in that step.
          - text: >
              On outcomes with $X < a$, where the indicator is $0$ and you need
              $X \ge 0$.
            correct: true
            feedback: >
              Exactly. That is the one place a negative value could break the
              comparison, and the $-36$ days were such places.
        feedback: >
          The whole proof has one load-bearing hypothesis, spent on the
          outcomes below the threshold.
      - ask: >
          A position's holding time is nonnegative, with mean $2.5$ days. Bound
          the chance that a position is held $10$ days or longer.
        expects: "1/4"
        hint: >
          How many times the mean is $10$?
        feedback: >
          $\Pr(T \ge 10) \le 2.5/10 = 1/4$. In the rescaled form, $10$ is
          $4$ times the mean, so $k = 4$ and the bound is $1/4$.

      - part: Signed variables and honest reporting
        ask: >
          Back to the P&L. Risk now also tells you the mean absolute daily P&L,
          $\mathbb{E}[|Y|] = 5$ thousand. Bound the chance of a day with
          $|Y| \ge 25$ thousand.
        expects: "1/5"
        hint: >
          Markov wants a nonnegative variable. Is there one in sight whose
          mean you were just given?
        feedback: >
          $|Y|$ is nonnegative with mean $5$, so
          $\Pr(|Y| \ge 25) \le 5/25 = 1/5$. A signed variable is not out of
          reach — you apply Markov to a nonnegative variable built from it,
          provided you know that variable's mean.
      - ask: >
          A colleague writes in a risk memo: "one day in eight sees $48$ or
          more rejections." What is wrong with the sentence?
        choices:
          - text: >
              Nothing: Markov gave $1/8$, so that is the frequency.
            feedback: >
              Markov gave a ceiling. A count that is $5$, $6$ or $7$ every day
              has mean $6$ and never reaches $48$; it satisfies the same bound
              with room to spare.
          - text: >
              It should say "at most one day in eight", and add that the true
              rate is probably far lower.
            correct: true
            feedback: >
              Right. Only the mean went in, so only a ceiling comes out — and
              it is attained only by the spiky law with mass at $0$ and $48$.
          - text: >
              It should say "at least one day in eight", since Markov is a
              lower bound.
            feedback: >
              Markov bounds the tail from above. Nothing in the argument forces
              any day to reach $48$; the constant count $6$ never does.
        feedback: >
          Quote the bound as a bound. Whether the number is close to the truth
          depends on a shape you were not told.
      - teach: >
          Said aloud in an interview: "Only a mean, and the variable is
          nonnegative, so Markov: at most the mean over the threshold. It is a
          ceiling, usually loose." Every sharper bound in this unit reuses this
          one line on a cleverly chosen nonnegative variable — the square of
          the deviation, or an exponential.
  - node: quant-probability.inequalities.markov-tightness
    hook: >
      Knowing a bound is tight in principle, but usually far off in
      practice, is exactly what separates using Markov correctly from
      citing it as if it were exact — this is the example that makes both
      halves concrete.
    explanation: >
      The two-point law behind Markov's tightness is the same trick every
      "is this bound the best possible" question uses: put all the slack at
      the threshold itself. Concentrating probability $\mu/a$ exactly at
      $a$ (the rest at $0$) uses every unit of mean as efficiently as
      possible to inflate $\Pr(X\ge a)$ — moving any of the tail mass above
      $a$ costs more mean for the same tail probability, and moving the rest
      above $0$ costs mean while adding nothing to the tail. So no inequality
      using only $\mathbb{E}[X]$ can ever
      promise less than $\mu/a$ in the worst case.

      That worst case is also the tell for why Markov disappoints on
      ordinary distributions: it is calibrated to a law with almost no mass
      near the threshold and a spike right at it, the opposite shape of a
      die, a normal, or most things worth modeling. The gap to expect in
      practice is a small constant factor — on the fair die example Markov
      overstates the truth by $3.5\times$ — not agreement.
    worked: >
      Let $X$ be exponential with mean $1$, so $\Pr(X \ge a) = e^{-a}$
      exactly. Markov gives $\Pr(X\ge a) \le 1/a$. At $a=5$: Markov says
      $\le 0.2$, the truth is $e^{-5}\approx 0.0067$, off by a factor of
      about $30$. At $a=1$, Markov says $\le 1$ — vacuous — while the truth
      is $e^{-1}\approx 0.368$.
    interview: >
      Expect a direct follow-up after quoting Markov: "can this be improved
      knowing only the mean?" The answer is the two-point construction,
      stated fast — mass $\mu/a$ at $a$, rest at $0$ — showing the bound is
      unimprovable in the worst case even though it's usually far from the
      truth.
    pitfalls: >
      Treating "Markov is tight" as meaning "Markov is usually accurate"
      inverts the point — it is tight only for one adversarially chosen
      shape. Forgetting the bound becomes vacuous ($\ge 1$) once $a \le
      \mu$ is an easy oversight when picking a threshold to illustrate
      looseness.
    recap: >
      A two-point law makes Markov exact, proving no mean-only bound can
      beat it — and the same construction explains why it overstates the
      tails of real distributions like the exponential by an order of
      magnitude or more.
    dialogue:
      - part: Can the ceiling be touched?
        teach: >
          A variable $X \ge 0$ has mean $3$. Markov says
          $\Pr(X \ge 12) \le 3/12 = 1/4$. An interviewer asks whether that
          $1/4$ is ever actually reached, or whether it is always a ceiling
          with air under it.
      - ask: >
          Your first instinct?
        choices:
          - text: >
              Never reached: the proof threw information away, so the
              inequality must be strict.
            feedback: >
              The proof threw away $X - 12\,\mathbf{1}\{X \ge 12\}$, and that
              loss is zero on a law where $X$ is only ever $0$ or $12$. Losing
              information on some laws does not mean losing it on all.
          - text: >
              Reached, by a law built to sit exactly on the threshold.
            correct: true
            feedback: >
              Yes. The next question builds it.
          - text: >
              Reached, but only by a continuous law.
            feedback: >
              Continuity makes it harder, not easier: a continuous law spreads
              mass around the threshold, and mass anywhere other than $0$ and
              $12$ is wasted.
        feedback: >
          The question "can this bound be improved?" is always answered by
          trying to build a law that attains it.
      - ask: >
          Let $X$ take only the values $0$ and $12$. With what probability
          must it equal $12$ for the mean to be $3$?
        expects: "1/4"
        hint: >
          The mean is $12p + 0(1 - p)$.
        feedback: >
          $12p = 3$, so $p = 1/4$, and then $\Pr(X \ge 12) = 1/4$ exactly. The
          inequality is an equality.
      - ask: >
          Now move the mass sitting at $0$ up to $2$, keeping the
          probabilities $1/4$ at $12$ and $3/4$ at $2$. What is the new mean?
        expects: "4.5"
        feedback: >
          $(1/4)(12) + (3/4)(2) = 3 + 1.5 = 4.5$. The tail probability did not
          change, but it now costs $4.5$ of mean instead of $3$.
      - reflect: >
          Explain why, among all nonnegative laws with mean $3$, none can put
          more than $1/4$ on $\{X \ge 12\}$ — and why the law at $0$ and $12$
          is the one that gets there. Think of the mean as a budget.
        answer: >
          Every bit of probability at or above $12$ costs at least $12$ times
          itself in mean, and costs exactly that only when it sits at $12$.
          Every bit below $12$ adds nothing to the tail and costs at least
          $0$, exactly $0$ only at $0$. So the cheapest way to buy tail
          probability is a spike at the threshold and everything else at $0$,
          and with a budget of $3$ that buys $3/12$. No law does better, so no
          bound that knows only the mean can say less than $\mathbb{E}[X]/a$.
      - teach: >
          So Markov is tight: for any mean $\mu$ and threshold $a > \mu$, the
          two-point law with mass $\mu/a$ at $a$ and the rest at $0$ makes it
          an equality. Tight means unbeatable in the worst case. It does not
          mean accurate in a typical one, and the laws you meet are rarely
          spikes.

      - part: A law nobody built to be awkward
        ask: >
          Let $X$ be the number of heads in $6$ fair tosses, which also has
          mean $3$. What does Markov give for $\Pr(X \ge 6)$?
        expects: "1/2"
        feedback: >
          $3/6 = 1/2$.
      - ask: >
          What is the true $\Pr(X \ge 6)$?
        expects: "1/64"
        hint: >
          Six heads means every toss is a head.
        feedback: >
          All six tosses must land heads: $(1/2)^{6} = 1/64 \approx 0.016$.
      - ask: >
          By what factor does Markov's bound exceed the truth here?
        expects: "32"
        feedback: >
          $(1/2)/(1/64) = 32$. The same theorem was exact a minute ago.
      - ask: >
          Why is Markov so far off on the coin count?
        choices:
          - text: >
              Markov is a weak inequality that could be improved for every
              law with mean $3$.
            feedback: >
              Not for every law: the two-point law at $0$ and $6$ with mass
              $1/2$ at $6$ has mean $3$ and meets the bound exactly. No
              mean-only bound can go lower.
          - text: >
              It knows only the mean, so it must cover the spike law, and the
              coin count looks nothing like a spike.
            correct: true
            feedback: >
              Right. The coin count piles its mass near $3$ and leaves almost
              none at $6$; Markov cannot see that.
          - text: >
              Six is too far from the mean for Markov to be accurate; it is
              sharp only near the mean.
            feedback: >
              Near the mean Markov is at its most useless: at any threshold
              $a \le 3$ it returns $3/a \ge 1$. Being exact is a property of
              the law, not of the distance.
        feedback: >
          A bound built from one number is loose exactly when the shape it
          ignores is ordinary.

      - part: Tight at one level, not at all of them
        ask: >
          Return to the law with mass $1/4$ at $12$ and $3/4$ at $0$. What is
          its $\Pr(X \ge 8)$?
        expects: "1/4"
        feedback: >
          The only value at or above $8$ is $12$, so the probability is
          $1/4$. Markov at $8$ allows $3/8$. The law built to be exact at $12$
          is loose at $8$; to hit $3/8$ you need a different law, with mass
          $3/8$ at $8$. Tightness holds threshold by threshold, never for all
          thresholds at once.
      - ask: >
          The interviewer follows up: "Can Markov be improved if all you know
          is the mean?" The best answer?
        choices:
          - text: >
              Yes, by half for symmetric laws.
            feedback: >
              Symmetry is extra information, and a nonnegative law with mean
              $3$ that reaches $12$ cannot be symmetric about $3$ anyway.
          - text: >
              No: mass $\mu/a$ at $a$ and the rest at $0$ attains it, so any
              smaller number would be false for that law.
            correct: true
            feedback: >
              That is the full answer in one sentence: a law, and why it
              closes the question.
          - text: >
              Only for continuous laws, where Markov is never attained.
            feedback: >
              The question asks about all nonnegative laws with a given mean,
              and the two-point law is one of them. A bound must hold for it
              too.
        feedback: >
          Then say the second half unprompted: tight in the worst case, loose
          on anything realistic, and a variance would sharpen it.
  - node: quant-probability.inequalities.chebyshev
    hook: >
      This is the default answer whenever a problem gives you a mean and a
      variance and nothing about the shape of the distribution — the
      two-moment bound every "how confident can you be" question is quietly
      asking for.
    explanation: >
      Chebyshev is Markov with one substitution: apply Markov not to $X$
      itself but to the nonnegative variable $(X-\mu)^{2}$, at the level
      $t^{2}$. Markov says $\Pr((X-\mu)^{2} \ge t^{2}) \le
      \mathbb{E}[(X-\mu)^{2}]/t^{2}$, and the event $(X-\mu)^{2} \ge t^{2}$
      is exactly $|X-\mu|\ge t$, while $\mathbb{E}[(X-\mu)^{2}]$ is by
      definition the variance $\sigma^{2}$. No new machinery — squaring the
      deviation converts "how far from the mean" into a nonnegative
      quantity Markov can already bound.

      The payoff of squaring first is that the bound is automatically
      two-sided: unlike Markov, which only controls one direction,
      Chebyshev catches deviations above and below the mean in a single
      inequality, because $(X-\mu)^{2}$ doesn't care which side $X$ landed
      on. It costs nothing beyond the variance already being finite — no
      symmetry, no independence, no bounded range.

      Reach for this whenever a question supplies (or lets you compute) a
      variance and asks for a deviation bound without further shape
      assumptions — the natural second rung after Markov, trading a
      stronger hypothesis for a sharper, two-sided guarantee.
    worked: >
      A stock's daily return has mean $0$ and variance $\sigma^{2}=4$ (std
      dev $2\%$), with no assumption on shape. Bound the chance the return
      is at least $8$ in magnitude: with $t=8$, $\Pr(|X|\ge 8) \le 4/64 =
      1/16 = 0.0625$ — at most a $6.25\%$ chance of a move four standard
      deviations from the mean, using nothing but the variance.
    interview: >
      "Bound this without assuming a distribution, given a mean and
      variance" is Chebyshev by name — state $\sigma^{2}/t^{2}$ immediately
      and note it's the two-sided version, since a one-sided question calls
      for the one-sided version (Cantelli) instead.
    pitfalls: >
      Applying Chebyshev when the question actually hands you a bounded
      range or known shape wastes the sharper bounds those extra hypotheses
      would allow. Forgetting the square on $t$ — writing $\sigma^{2}/t$
      instead of $\sigma^{2}/t^{2}$ — is the most common slip under time
      pressure.
    recap: >
      Chebyshev is Markov applied to $(X-\mu)^{2}$: a distribution-free,
      two-sided bound $\sigma^{2}/t^{2}$ that costs only a finite variance.
    dialogue:
      - part: A signed variable and a variance
        teach: >
          A market maker's end-of-day inventory $X$, in lots, can be long or
          short. It averages $0$, with standard deviation $4$. Risk wants a
          ceiling on the chance that the inventory ends $12$ or more lots away
          from flat, in either direction, with no assumption about the shape.
      - ask: >
          First instinct: Markov on $X$ at level $12$. What does it give?
        choices:
          - text: >
              $\mathbb{E}[X]/12 = 0$, so it never happens.
            feedback: >
              A probability bound of $0$ for an event that plainly can happen
              is the alarm. $X$ takes negative values, and Markov's proof
              needs $X \ge 0$ on the outcomes below the threshold.
          - text: >
              Nothing: $X$ can be negative, so Markov does not apply to it.
            correct: true
            feedback: >
              Right. And even on $|X|$ it would need $\mathbb{E}[|X|]$, which
              nobody gave you.
          - text: >
              $4/12 = 1/3$, using the standard deviation as the mean.
            feedback: >
              The standard deviation is not the mean of anything Markov can
              use directly. The variable has to be nonnegative and its mean
              has to be known.
        feedback: >
          You were handed a variance, not a mean of anything nonnegative. The
          job is to find the variable that turns one into the other.
      - reflect: >
          Markov needs a nonnegative variable whose mean you know. Which
          variable built from $X$ is nonnegative and has a mean you can read
          off what you were given — and what event about it is exactly
          "$12$ or more lots away from flat"?
        hint: >
          The variance is the mean of something.
        answer: >
          $X^{2}$, or in general $(X - \mu)^{2}$: it is nonnegative whatever
          the sign of $X$, and its mean is the variance, $16$. The event
          $|X| \ge 12$ is exactly $X^{2} \ge 144$, because squaring is
          increasing on nonnegative numbers. Markov at level $144$ does the
          rest.
      - ask: >
          Carry it out: bound $\Pr(|X| \ge 12)$.
        expects: "1/9"
        tolerance: 0.0005
        feedback: >
          $\Pr(X^{2} \ge 144) \le \mathbb{E}[X^{2}]/144 = 16/144 = 1/9$. Note
          that the bound covers both tails at once: the square forgot which
          side the inventory landed on.
      - teach: >
          That is Chebyshev's inequality: Markov applied to $(X - \mu)^{2}$
          at level $t^{2}$ gives $\Pr(|X - \mu| \ge t) \le \sigma^{2}/t^{2}$
          for any law with finite variance. No shape, no symmetry, no sign
          condition on $X$.

      - part: What the proof spends
        ask: >
          Applying Markov to $(X - \mu)^{2}$ uses exactly two facts. Which
          pair?
        choices:
          - text: >
              $X \ge 0$, and $\mathbb{E}[X]$ is finite.
            feedback: >
              The inventory was signed and the proof still went through.
              Nonnegativity is needed of the variable Markov sees, which is
              the square, not $X$.
          - text: >
              $(X - \mu)^{2} \ge 0$, and its mean $\sigma^{2}$ is finite.
            correct: true
            feedback: >
              Yes. The first is automatic for every $X$; the second is the only
              assumption Chebyshev makes about the distribution.
          - text: >
              $X$ is symmetric about $\mu$, and $\sigma^{2}$ is finite.
            feedback: >
              Symmetry never enters. The square treats a deviation of $+12$
              and one of $-12$ alike, whatever their probabilities.
        feedback: >
          Finite variance is the whole price of admission.
      - ask: >
          A fund's monthly return, in percent, has mean $2$ and variance $3$.
          Bound the chance that it lands $6$ or more points from $2$.
        expects: "1/12"
        tolerance: 0.0005
        hint: >
          The deviation is $t = 6$. Square it.
        feedback: >
          $\sigma^{2}/t^{2} = 3/36 = 1/12 \approx 0.083$. Forgetting the
          square gives $3/6 = 0.5$, a bound six times too weak.
      - ask: >
          A colleague, given mean $0$ and standard deviation $2$, bounds
          $\Pr(|X| \ge 6)$ by $2/36$. Verdict?
        choices:
          - text: >
              Correct: $\sigma/t^{2}$.
            feedback: >
              The numerator is the mean of $(X - \mu)^{2}$, which is the
              variance $4$, not the standard deviation $2$.
          - text: >
              Wrong: it should be $2/6 = 1/3$.
            feedback: >
              That divides the standard deviation by the deviation, which is
              no inequality at all. Markov on the square has both quantities
              squared.
          - text: >
              Wrong: it should be $4/36 = 1/9$.
            correct: true
            feedback: >
              Variance over squared deviation. Equivalently, $6$ is $3$
              standard deviations, and the bound is $1/3^{2}$.
        feedback: >
          The units check catches it: $\sigma^{2}/t^{2}$ is a pure number,
          and $\sigma/t^{2}$ is not.

      - part: Where it stops, and where it leads
        ask: >
          A payoff has a finite mean but infinite variance — its tail thins
          out too slowly. What can you still say about $\Pr(|X - \mu| \ge t)$?
        choices:
          - text: >
              Chebyshev with the sample variance from a year of data.
            feedback: >
              The sample variance is always a finite number, but the true
              variance is infinite, so no $\sigma^{2}/t^{2}$ holds. A tail
              like $1/t^{1.5}$ eventually beats any $c/t^{2}$.
          - text: >
              Nothing at all.
            feedback: >
              The mean is still finite, and so is $\mathbb{E}[|X - \mu|]$.
              Markov applies to $|X - \mu|$ directly.
          - text: >
              Markov on $|X - \mu|$, a ceiling decaying like $1/t$; the
              $1/t^{2}$ is gone.
            correct: true
            feedback: >
              Right. Each moment you lose costs a power of $t$ in the decay.
        feedback: >
          Chebyshev buys its $1/t^{2}$ with the second moment. No second
          moment, no purchase.
      - ask: >
          The fund's returns from before are averaged over $25$ independent
          months. The average has mean $2$ and variance $3/25$. Bound the
          chance that the average lands $1$ or more points from $2$.
        expects: "0.12"
        feedback: >
          $(3/25)/1^{2} = 0.12$. One month alone could be anywhere —
          Chebyshev at $t = 1$ gives $3$, which says nothing — but averaging
          divided the variance by $25$, and the bound fell with it. This is
          the engine behind the law of large numbers.
      - teach: >
          Said aloud: "Mean and variance, no shape, two-sided — Chebyshev:
          variance over the squared deviation. It is Markov on the squared
          deviation." If the question is one-sided, say so before you halve
          anything; the one-sided version is not half of this.
  - node: quant-probability.inequalities.k-sigma
    hook: >
      This is the version you actually recite in an interview — "at most
      this percent beyond $k$ standard deviations" — and the number people
      picture from the normal curve is almost always far tighter than what
      this distribution-free guarantee can promise.
    explanation: >
      Setting $t=k\sigma$ is nothing more than plugging into Chebyshev with
      the deviation measured in units of standard deviation instead of raw
      units — the substitution turns $\sigma^{2}/t^{2}$ into the shape-free
      $1/k^{2}$, a number that no longer depends on the variable's actual
      scale.

      The looseness is the price of a guarantee that holds for every
      distribution with the given variance, including the two-point law
      that makes Chebyshev tight — a spike sitting exactly $k\sigma$ out,
      with just enough mass to hit $1/k^{2}$. Real data essentially never
      looks like that spike, which is why the bound is almost never
      approached in practice.

      Use $1/k^{2}$ as a worst-case guarantee — a claim defensible without
      knowing the shape of the data — never as an estimate of the actual
      tail. Whenever a shape assumption (normal, bounded, symmetric) is
      available, it cuts the bound by orders of magnitude, as the
      comparison to the normal tails shows.
    worked: >
      A trading desk knows its daily P&L has some variance $\sigma^{2}$ but
      refuses to assume a shape. The guaranteed bound on landing beyond
      $5\sigma$ in either direction is $1/5^{2} = 1/25 = 4\%$ — compare a
      normal's true two-sided tail at $5\sigma$, about $5.7\times10^{-7}$,
      some seventy thousand times smaller.
    interview: >
      "Give me a bound with no assumptions, in standard deviations" is the
      $k$-sigma form — answer with $1/k^{2}$ immediately, and volunteer the
      normal comparison to show you know how conservative it is.
    pitfalls: >
      Quoting a $k$-sigma bound as though it were the real tail probability
      (treating $4\%$ as the actual chance of a five-sigma move) confuses a
      distribution-free guarantee with an estimate. Using $k \le 1$ gives a
      vacuous bound above $1$, worth noticing before presenting it as a
      result.
    recap: >
      At most $1/k^{2}$ of any distribution lies beyond $k$ standard
      deviations — a guarantee for every possible shape, and hundreds to a
      trillion times weaker than the normal tail it's often mistaken for.
    dialogue:
      - part: A promise to the board
        teach: >
          A head of risk tells the board: "Whatever shape our daily P&L has, a
          move of more than three standard deviations from the mean happens on
          at most $1\%$ of days." The board asks you whether that sentence is
          defensible.
      - ask: >
          Using only Chebyshev, what is the largest fraction of days you can
          guarantee lie $3$ or more standard deviations from the mean?
        expects: "1/9"
        tolerance: 0.0005
        hint: >
          Put $t = 3\sigma$ into $\sigma^{2}/t^{2}$.
        feedback: >
          $\sigma^{2}/(3\sigma)^{2} = 1/9 \approx 11.1\%$. The scale $\sigma$
          cancels, so the answer is the same for every desk.
      - ask: >
          So is the head of risk's $1\%$ defensible?
        choices:
          - text: >
              Yes: a normal law puts only about $0.27\%$ beyond $3\sigma$, well
              under $1\%$.
            feedback: >
              That is true of a normal law, but the sentence said "whatever
              shape". The normal is one shape among many with the same
              variance.
          - text: >
              Yes: $1/9$ is only a ceiling, so the true number is smaller.
            feedback: >
              A ceiling that holds for every shape may be reached by some
              shape. If one law with this variance puts $1/9$ beyond $3\sigma$,
              "at most $1\%$ whatever the shape" is false.
          - text: >
              No: it leans on a shape. If any law with this variance puts
              $1/9$ beyond $3\sigma$, the sentence is false.
            correct: true
            feedback: >
              Right. To refute a distribution-free claim, build one
              distribution — the next question does.
        feedback: >
          "Whatever the shape" claims a guarantee, and a guarantee is refuted
          by a single law.
      - ask: >
          Build it. Put probability $p$ at each of $\mu - 3\sigma$ and
          $\mu + 3\sigma$, and the rest at $\mu$. What $p$ makes the variance
          exactly $\sigma^{2}$?
        expects: "1/18"
        tolerance: 0.0005
        hint: >
          The variance is $2p(3\sigma)^{2}$.
        feedback: >
          $2p \cdot 9\sigma^{2} = \sigma^{2}$ gives $p = 1/18$. This law has
          mean $\mu$, variance $\sigma^{2}$, and puts $2p = 1/9$ of its mass
          at exactly $3\sigma$ from the mean. The board's $1\%$ is false for
          it.
      - reflect: >
          Your ceiling of $1/9$ never used the size of $\sigma$ or the units
          of the P&L. Why not — and what number would you quote for "beyond
          $k$ standard deviations" in general?
        answer: >
          Measuring the deviation in standard deviations, $t = k\sigma$, makes
          Chebyshev's $\sigma^{2}/t^{2}$ into $\sigma^{2}/(k^{2}\sigma^{2}) =
          1/k^{2}$: the scale cancels, so the statement carries no units and
          holds for every desk at once. The same two-point construction
          with mass $1/(2k^{2})$ at $\mu \pm k\sigma$ attains it, so $1/k^{2}$
          is the best number variance alone can support.
      - teach: >
          That is the $k$-sigma bound:
          $\Pr(|X - \mu| \ge k\sigma) \le 1/k^{2}$ for every law with finite
          variance, so at least $1 - 1/k^{2}$ of the mass sits within $k$
          standard deviations. It is a guarantee for every shape at once —
          which is exactly why it is so much weaker than the normal numbers
          people carry in their heads.

      - part: Reading it both ways
        ask: >
          What fraction of any distribution is guaranteed to lie within $1.5$
          standard deviations of its mean?
        expects: "5/9"
        tolerance: 0.0005
        feedback: >
          $1 - 1/1.5^{2} = 1 - 1/2.25 = 1 - 4/9 = 5/9 \approx 0.556$. Over
          half, for every shape; a normal would put about $87\%$ there.
      - ask: >
          What does the bound say at $k = 0.8$?
        choices:
          - text: >
              At most $1/0.64 \approx 1.56$ of the mass is beyond $0.8\sigma$,
              so all of it is.
            feedback: >
              A bound above $1$ does not force anything; it is weaker than
              the statement every probability already satisfies.
          - text: >
              Nothing: for $k \le 1$ the bound is at least $1$.
            correct: true
            feedback: >
              Right. And nothing better is possible: the law at $\pm\sigma$
              with probability $1/2$ each has variance $\sigma^{2}$ and puts
              all its mass beyond $0.8\sigma$.
          - text: >
              At most $0.64$ of the mass is beyond $0.8\sigma$.
            feedback: >
              That is $k^{2}$, not $1/k^{2}$. The law at $\pm\sigma$ with
              probability $1/2$ each puts all of its mass beyond $0.8\sigma$.
        feedback: >
          The bound starts to say something only past one standard deviation.

      - part: Against the bell curve
        ask: >
          At $6\sigma$ the ceiling is $1/36$. A normal law puts about
          $2 \times 10^{-9}$ beyond $6\sigma$. Roughly how many powers of ten
          separate the two numbers?
        expects: "7"
        tolerance: 0.5
        feedback: >
          $1/36 \approx 0.028$, and $0.028/(2 \times 10^{-9}) \approx 1.4
          \times 10^{7}$: about seven orders of magnitude. That gap is what
          the normal shape is worth, and it grows without limit as $k$ does.
      - ask: >
          A stock you had modelled as normal just moved six standard
          deviations in a day. What is the sound reading?
        choices:
          - text: >
              It is a data error: the probability was $2 \times 10^{-9}$.
            feedback: >
              That probability came from the normal shape, which is the thing
              now in question. Check the data, but do not use the model being
              tested to dismiss the evidence against it.
          - text: >
              It is evidence against the normal shape; with no shape
              assumption, up to $1/36$ of days could be that far out.
            correct: true
            feedback: >
              Right. The distribution-free ceiling is the honest fallback, and
              market returns are known to have fatter tails than the normal.
          - text: >
              It contradicts Chebyshev, which caps such days at $1/36$.
            feedback: >
              One day does not violate a bound on a frequency. Chebyshev
              limits how often, not whether.
        feedback: >
          The $k$-sigma bound is the number you can promise; the normal tail
          is the number you would get if the shape were right.
      - teach: >
          Said aloud: "With no shape, at most $1/k^{2}$ beyond $k$ sigma —
          $25\%$ at two, about $11\%$ at three. A normal would be far smaller;
          that gap is the price of assuming nothing." Quote it as a ceiling,
          never as the chance of the move.
  - node: quant-probability.inequalities.cantelli
    hook: >
      The instinct to just halve Chebyshev for a one-sided question is
      wrong, and Cantelli is the fix — a genuinely sharper bound for exactly
      the "at least this much above the mean" phrasing interviewers like.
    explanation: >
      Chebyshev bounds two tails glued together, $\Pr(X-\mu\ge t) +
      \Pr(X-\mu\le -t)$, so splitting that bound in half implicitly assumes
      the two tails contribute equally — true only when the distribution is
      symmetric. A distribution can dump its entire deviation on one side,
      all the mass that would exceed $t$ concentrated above the mean, none
      below, and the two-sided bound gives no information about how that
      mass splits.

      Cantelli's proof shifts before squaring: adding $u>0$ to both sides of
      $X-\mu\ge t$ before squaring keeps the containment, since the original
      event forces $(X-\mu+u)^{2}\ge (t+u)^{2}$, and now
      ordinary Markov applies to this squared, shifted quantity. Optimizing
      the free parameter $u$ finds the shift that makes the resulting Markov
      bound as sharp as possible for this one-sided event — Markov applied
      to a family of transformations, then optimized, beating Markov applied
      blindly. Chernoff runs the identical playbook with $u$ replaced by
      exponentiation.
    worked: >
      A portfolio's daily return has mean $0$ and standard deviation
      $\sigma=2$. Bound the chance of a gain of at least $t=6$: $\sigma^{2}
      /(\sigma^{2}+t^{2}) = 4/(4+36)=4/40=0.1$. Chebyshev's two-sided bound
      at the same $t$ is $\sigma^{2}/t^{2}=4/36\approx0.111$, so naively
      halving it would (wrongly) suggest $0.056$ — below the correct,
      sharper one-sided value of $0.1$.
    interview: >
      "What's the chance of at least this much upside (or downside)" is
      one-sided — say explicitly that halving Chebyshev is not valid and
      quote $\sigma^{2}/(\sigma^{2}+t^{2})$ instead.
    pitfalls: >
      Halving the two-sided Chebyshev bound for a one-sided question can
      understate the true worst case, exactly backwards from what a
      conservative bound should do. Forgetting the mirrored form for the
      lower tail — replacing $t$ with $-t$ correctly — is an easy sign
      error.
    recap: >
      For a one-sided deviation the sharp distribution-free bound is
      $\sigma^{2}/(\sigma^{2}+t^{2})$, strictly better than Chebyshev but
      never simply half of it.
    dialogue:
      - part: Only one tail is asked about
        teach: >
          A desk's slippage per order, in basis points, has mean $1$ and
          standard deviation $3$; its shape is unknown. Execution wants a
          ceiling on the chance that an order slips by $5$ basis points or
          more — only the bad side.
      - ask: >
          Start with what you have. Chebyshev's ceiling on the two-sided event
          $|X - 1| \ge 4$?
        expects: "9/16"
        tolerance: 0.0005
        feedback: >
          $\sigma^{2}/t^{2} = 9/16 \approx 0.56$, with $t = 5 - 1 = 4$ measured
          from the mean. The one-sided event sits inside it, so $9/16$ is a
          valid answer — just not a sharp one.
      - ask: >
          A colleague halves it to $9/32 \approx 0.28$, since only one tail
          was asked about. Valid?
        choices:
          - text: >
              Yes: the two-sided bound covers two tails, so each gets half.
            feedback: >
              Each gets half only if the law is symmetric. Nothing stops a
              skewed law from putting its whole deviation on the upper side.
          - text: >
              No: a skewed law can load all of its deviation above the mean.
            correct: true
            feedback: >
              Right. The next question builds such a law and measures how much
              it puts above $5$.
          - text: >
              Yes: Chebyshev is loose anyway, so halving it is still safe.
            feedback: >
              Loose on typical laws is not loose on all of them. A ceiling has
              to hold for the worst law with this mean and variance.
        feedback: >
          Halving errs in the unsafe direction: it understates a risk.
      - ask: >
          Let $X - 1$ equal $4$ with probability $p$ and $-4p/(1 - p)$
          otherwise, so the mean is still $0$. Its variance works out to
          $16p/(1 - p)$. Which $p$ makes the variance $9$?
        expects: "9/25"
        tolerance: 0.0005
        hint: >
          Solve $16p = 9(1 - p)$.
        feedback: >
          $16p = 9 - 9p$, so $p = 9/25 = 0.36$. This law has mean $1$ and
          standard deviation $3$, and it slips $5$ or more with probability
          $0.36$ — above the halved $0.28$. Halving is refuted.
      - reflect: >
          Chebyshev squared $X - \mu$, and the square cannot tell the upper
          tail from the lower one, so part of the bound is spent on a tail
          nobody asked about. What could you do to $X - \mu$ *before*
          squaring so that the upper tail counts for more?
        hint: >
          Markov on a square works on any square, not only the square of the
          deviation itself.
        answer: >
          Shift it. For any $u > 0$, the event $X - \mu \ge t$ forces
          $(X - \mu + u)^{2} \ge (t + u)^{2}$, and Markov on that square gives
          $\Pr(X - \mu \ge t) \le \mathbb{E}[(X - \mu + u)^{2}]/(t + u)^{2} =
          (\sigma^{2} + u^{2})/(t + u)^{2}$. The shift pushes the upper tail
          further from $0$ and drags the lower tail toward it, so the square
          now favours the side you care about. Then choose $u$ to make the
          bound smallest.
      - teach: >
          That is Cantelli's inequality, or one-sided Chebyshev. The best
          shift is $u = \sigma^{2}/t$, and it gives
          $\Pr(X - \mu \ge t) \le \sigma^{2}/(\sigma^{2} + t^{2})$, with the
          mirror image for the lower tail. The law you just built attains it:
          $9/(9 + 16) = 9/25$.

      - part: The shift, by hand
        ask: >
          Any $u > 0$ gives a valid bound. With $\sigma^{2} = 9$ and $t = 4$,
          evaluate $(\sigma^{2} + u^{2})/(t + u)^{2}$ at the lazy choice
          $u = 1$.
        expects: "0.4"
        feedback: >
          $(9 + 1)/(4 + 1)^{2} = 10/25 = 0.4$: valid, better than Chebyshev's
          $0.5625$, worse than the optimum. At $u = 9/4$ it is
          $(9 + 81/16)/(25/4)^{2} = (225/16)/(625/16) = 9/25 = 0.36$.
      - ask: >
          Same slippage, mean $1$, standard deviation $3$. Bound the chance an
          order slips by $7$ basis points or more.
        expects: "1/5"
        tolerance: 0.0005
        hint: >
          Measure $t$ from the mean.
        feedback: >
          $t = 7 - 1 = 6$, so $9/(9 + 36) = 9/45 = 1/5$. Plugging in $t = 7$
          instead gives $9/58$, a bound for the wrong event that understates
          the risk.
      - ask: >
          And the other side: bound the chance that slippage is $-2$ or less,
          a price improvement of $2$ basis points or more.
        expects: "1/2"
        tolerance: 0.0005
        feedback: >
          The lower tail at distance $t = 1 - (-2) = 3$ from the mean:
          $9/(9 + 9) = 1/2$. Here Chebyshev's two-sided bound is $9/9 = 1$,
          which says nothing; one standard deviation is where Cantelli helps
          most.

      - part: When halving is allowed after all
        ask: >
          Suppose you are told the slippage law *is* symmetric about its mean.
          At $t = 2\sigma$, how do the options compare?
        choices:
          - text: >
              Halving is still invalid; only Cantelli is ever safe for one
              tail.
            feedback: >
              Symmetry is exactly the assumption halving needs: then the two
              tails are equal, so each is half of the two-sided probability,
              which Chebyshev bounds.
          - text: >
              Halving is valid now, but Cantelli is still sharper.
            feedback: >
              At $k = 2$ halving gives $1/8 = 0.125$ and Cantelli
              $1/5 = 0.2$. Past one standard deviation, $1/(2k^{2})$ is the
              smaller of the two.
          - text: >
              Halving is valid now and gives $1/8$, beating Cantelli's $1/5$.
            correct: true
            feedback: >
              Right. More information buys a sharper bound; Cantelli is what
              you use when symmetry is not given.
        feedback: >
          Match the bound to what you were told: no shape means Cantelli,
          symmetry means half of Chebyshev.
      - teach: >
          Said aloud: "One-sided, mean and variance, no symmetry: Cantelli,
          variance over variance plus $t^{2}$, with $t$ measured from the mean.
          Halving Chebyshev would assume symmetry I was not given."
  - node: quant-probability.inequalities.chebyshev-sample-size
    hook: >
      "How many samples do I need" is a direct application of Chebyshev to
      a sample mean, and knowing the formula cold — not rederiving it under
      time pressure — is what separates a fast answer from a stalled one.
    explanation: >
      The sample mean of $n$ independent draws has variance $\sigma^{2}/n$
      — averaging divides variance by $n$, because variances of independent
      pieces add and then the $1/n^{2}$ from averaging outweighs the $n$
      growth of the sum. Feeding that shrunk variance into Chebyshev,
      $\Pr(|\bar{X}-\mu|\ge \varepsilon)\le \sigma^{2}/(n\varepsilon^{2})$,
      then solving for $n$ turns a precision-and-confidence target directly
      into a required sample count: $n \ge \sigma^{2}/(\alpha
      \varepsilon^{2})$, where $\alpha$ is the tolerated failure
      probability.

      The two knobs bite differently: halving the tolerance $\varepsilon$
      quadruples the required $n$, because $\varepsilon$ enters squared,
      while halving the acceptable failure rate $\alpha$ only doubles it.
      This is why precision in any Chebyshev-style estimate is
      expensive to buy — going from two digits of accuracy to three costs
      about a hundred times the data, not ten.
    worked: >
      A sensor's reading has variance at most $\sigma^{2}=9$, and you want
      the sample mean within $\pm 0.5$ of the true value with confidence
      $99\%$ ($\alpha=0.01$), assuming nothing about the reading's
      distribution. Chebyshev requires $n \ge \sigma^{2}/(\alpha
      \varepsilon^{2}) = 9/(0.01 \times 0.25) = 9/0.0025 = 3600$ readings.
    interview: >
      "How many samples do you need for this precision" with no
      distributional assumption is exactly this formula — state $n\ge
      \sigma^{2}/(\alpha\varepsilon^{2})$ and be ready to note it's
      conservative, usually several times more data than a normal
      approximation would ask for.
    pitfalls: >
      Plugging in the target confidence level $1-\alpha$ instead of the
      failure rate $\alpha$ inverts the formula. Treating the Chebyshev
      sample size as the "right" answer, rather than a conservative,
      distribution-free upper bound, overstates how much data is really
      needed once any shape information is available.
    recap: >
      Chebyshev converts a precision-and-confidence target into a sample
      count via $n\ge\sigma^{2}/(\alpha\varepsilon^{2})$ — quadratic in the
      tolerance, linear in the failure rate, and typically several times more
      conservative than a normal-based estimate.
    dialogue:
      - part: How many orders to watch
        teach: >
          You want the fraction $p$ of incoming orders that come from one
          client. You will watch $n$ orders and report the fraction $\hat{p}$
          you saw. The desk wants $\hat{p}$ within $0.02$ of $p$ at least
          $90\%$ of the time, and you may use nothing sharper than Chebyshev.
      - ask: >
          One order is an indicator: $1$ if it is the client's, $0$ if not. Its
          variance is $p(1 - p)$. What is the largest that variance can be,
          whatever $p$ is?
        expects: "1/4"
        hint: >
          $p(1 - p)$ is a downward parabola. Where is its peak?
        feedback: >
          The peak is at $p = 1/2$, where $p(1 - p) = 1/4$. You do not know
          $p$, so you plan for the worst case.
      - ask: >
          With $n = 2500$ independent orders, the variance of $\hat{p}$ is at
          most what?
        expects: "0.0001"
        feedback: >
          Averaging $n$ independent pieces divides the variance by $n$:
          $(1/4)/2500 = 0.0001$.
      - ask: >
          Chebyshev at $n = 2500$: what ceiling does it give on
          $\Pr(|\hat{p} - p| \ge 0.02)$?
        expects: "0.25"
        feedback: >
          $0.0001/0.02^{2} = 0.0001/0.0004 = 0.25$. The desk tolerates a
          failure rate of $0.10$, so $2500$ orders is not enough.
      - reflect: >
          You need the ceiling down from $0.25$ to $0.10$ without trial and
          error. Write the ceiling as a function of $n$, the tolerance
          $\varepsilon$ and the per-order variance $\sigma^{2}$, and solve for
          the smallest $n$ that brings it to the failure rate $\alpha$.
        answer: >
          The ceiling is $\sigma^{2}/(n\varepsilon^{2})$: the variance of the
          average over the squared tolerance. It falls like $1/n$, and
          requiring it to be at most $\alpha$ gives
          $n \ge \sigma^{2}/(\alpha\varepsilon^{2})$. Here the ceiling must
          fall by a factor of $2.5$, so $n$ must grow by $2.5$.
      - teach: >
          That is the Chebyshev sample size,
          $n \ge \sigma^{2}/(\alpha\varepsilon^{2})$, with $\alpha$ the
          failure rate, not the confidence. Every quantity in it is a
          worst case: the variance bound, and Chebyshev itself, which must
          hold for every law with that variance.
      - ask: >
          What $n$ does the desk need?
        expects: "6250"
        feedback: >
          $0.25/(0.10 \times 0.0004) = 0.25/0.00004 = 6250$, which is
          $2.5 \times 2500$, as the reflection predicted.

      - part: What each knob costs
        ask: >
          The desk now wants $99\%$ instead of $90\%$, same tolerance $0.02$.
          How many orders?
        expects: "62500"
        feedback: >
          $\alpha = 0.01$: $0.25/(0.01 \times 0.0004) = 62\,500$. The failure
          rate went down by a factor of ten and $n$ went up by ten — $n$ is
          linear in $1/\alpha$.
      - ask: >
          Back at $90\%$, the desk halves the tolerance from $0.02$ to $0.01$.
          What happens to $n$?
        choices:
          - text: >
              It doubles, to $12\,500$.
            feedback: >
              That would be true if $\varepsilon$ entered once. It enters
              squared: $(0.01)^{2}$ is a quarter of $(0.02)^{2}$.
          - text: >
              It quadruples, to $25\,000$.
            correct: true
            feedback: >
              Right: $0.25/(0.10 \times 0.0001) = 25\,000$. Each extra digit of
              precision costs a hundredfold.
          - text: >
              It halves, since a smaller tolerance is easier to meet.
            feedback: >
              A smaller tolerance is harder to meet: the estimate has to land
              in a narrower window, which takes more data.
        feedback: >
          Tolerance enters squared, the failure rate enters once.
      - ask: >
          A colleague computes $0.25/(0.90 \times 0.0004) \approx 694$ orders.
          What went wrong?
        choices:
          - text: >
              Nothing: $90\%$ was the target.
            feedback: >
              The formula comes from setting Chebyshev's ceiling on the
              *failure* event equal to the tolerated failure rate, which is
              $0.10$.
          - text: >
              They used the confidence $0.90$ where the failure rate $0.10$
              belongs, and got a count nine times too small.
            correct: true
            feedback: >
              Right. Both numbers lie in $(0, 1)$, so the slip is invisible in
              the arithmetic and only the size of the answer gives it away.
          - text: >
              They forgot to square the tolerance.
            feedback: >
              The $0.0004$ in the denominator is $0.02^{2}$, already squared.
              The error is the other factor.
        feedback: >
          Read $\alpha$ as "how often may I be wrong", and the formula never
          inverts.

      - part: A safe answer, not the cheapest
        ask: >
          Is $6250$ the number of orders the desk actually needs?
        choices:
          - text: >
              Yes: Chebyshev is exact for indicator averages.
            feedback: >
              Chebyshev is attained only by a spiky law with mass at three
              points; an average of $6250$ indicators is nothing like that,
              and its true miss rate at $n = 6250$ is far below $0.10$.
          - text: >
              No, it is a guarantee: enough for every law with that variance,
              and typically several times more than this one needs.
            correct: true
            feedback: >
              Right. A sharper tool that uses the shape of the average would
              ask for far fewer orders; Chebyshev's count is the one you can
              defend without it.
          - text: >
              No, it is too small, because $p(1 - p)$ might exceed $1/4$.
            feedback: >
              $p(1 - p)$ never exceeds $1/4$; that is why $1/4$ was used.
        feedback: >
          Quote the count with its label: distribution-free, conservative.
      - teach: >
          Said aloud: "Variance of the mean is $\sigma^{2}/n$; Chebyshev gives
          $\sigma^{2}/(n\varepsilon^{2}) \le \alpha$, so
          $n \ge \sigma^{2}/(\alpha\varepsilon^{2})$. Halve the tolerance and
          the count quadruples. It is a safe count, not a tight one."
  - node: quant-probability.inequalities.jensen
    hook: >
      Every "can I move this function inside the expectation" question — is
      $\mathbb{E}[1/X]$ the same as $1/\mathbb{E}[X]$, is average volatility
      the same as volatility of the average — is Jensen, and the direction
      of the inequality is the entire answer.
    explanation: >
      Picture a convex function as a bowl: any chord connecting two points
      on its graph lies above the curve, the definition of convexity
      extended from two points to a whole distribution of points. Averaging
      the $x$-values first and evaluating $\varphi$ at that single average
      lands you on the curve itself; averaging the $\varphi$-values of many
      scattered points first lands you on or above the chords connecting
      them — and a bowl's chords never dip below the bowl. That ordering is
      the entire content of Jensen: bend after averaging gives less than
      averaging after bending, for a convex $\varphi$.

      How large the gap is depends on both how curved $\varphi$ is near
      $\mu$ and how spread out $X$ is — a nearly flat region of $\varphi$ or
      a tightly concentrated $X$ makes the two sides nearly equal, while a
      sharply curving $\varphi$ combined with a widely spread $X$ can make
      them very different. The concave case reverses everything: swap the
      sign of $\varphi$'s curvature and the inequality flips, $\mathbb{E}
      [\varphi(X)]\le\varphi(\mathbb{E}[X])$.

      Equality is the degenerate case, not the default: for strictly convex
      $\varphi$ it forces $X$ to be constant, so genuine randomness makes
      the inequality strict. The general pattern to recognize: any question
      with a nonlinear function wrapped around a random quantity — a ratio,
      a square, an exponential, a log — is asking you to name which side is
      bigger, not to compute both sides.
    worked: >
      Take $\varphi(x)=x^{4}$ (convex) and let $X$ be $-1$ or $3$ with equal
      probability. Directly, $\mathbb{E}[X^{4}] = \frac{1}{2}(1) +
      \frac{1}{2}(81) = 41$. But $\mathbb{E}[X]=1$, so $\varphi(\mathbb{E}
      [X]) = 1^{4} = 1$. Indeed $41 \ge 1$, and the gap is large exactly
      because $X$ is spread far apart and $x^{4}$ curves sharply away from
      $x=1$.
    interview: >
      The canonical prompt is "is $\mathbb{E}[f(X)]$ equal to
      $f(\mathbb{E}[X])$" for some named $f$ — answer by naming $f$'s
      convexity or concavity and stating the direction immediately, before
      attempting any computation.
    pitfalls: >
      Assuming equality — silently sliding $\varphi$ through the
      expectation — is the single most common error; it only holds for
      affine $\varphi$, or when $X$ is deterministic. Applying Jensen
      outside the interval where $\varphi$ is actually convex (many
      functions are convex on one region, concave on another) produces an
      inequality in the wrong direction.
    recap: >
      For convex $\varphi$, averaging then applying $\varphi$ gives less
      than applying $\varphi$ then averaging, $\mathbb{E}[\varphi(X)]\ge
      \varphi(\mathbb{E}[X])$, with equality only when $X$ is constant.
    dialogue:
      - part: Pay on the average, or average the pay
        teach: >
          A stock trades at $100$. Tomorrow it will be $80$ or $120$ with equal
          probability. A contract pays $\max(S - 100, 0)$ tomorrow: the amount
          by which the price $S$ exceeds $100$, or nothing.
      - ask: >
          What is the contract's expected payoff?
        expects: "10"
        feedback: >
          At $120$ it pays $20$; at $80$ it pays $0$. The average is
          $(20 + 0)/2 = 10$.
      - ask: >
          A colleague first averages the price, $\mathbb{E}[S] = 100$, and
          then applies the payoff to that. What do they get?
        expects: "0"
        feedback: >
          $\max(100 - 100, 0) = 0$. Same contract, same prices, a different
          order of operations — and a different number.
      - ask: >
          Which is the contract's expected value, and why do the two orders
          disagree?
        choices:
          - text: >
              They should agree; expectation is linear, so the colleague's $0$
              is a slip somewhere.
            feedback: >
              Linearity moves sums and constant multiples through an
              expectation. The payoff has a kink at $100$; it is not linear,
              and nothing lets it slide through.
          - text: >
              The colleague's $0$, because the stock's expected move is zero.
            feedback: >
              The contract does not pay the move; it pays the move's positive
              part. The up day pays $20$ and the down day costs nothing.
          - text: >
              The expected payoff, $10$: the payoff gains on the up day and
              does not lose symmetrically on the down day.
            correct: true
            feedback: >
              Right. The bend in the payoff turns symmetric randomness in $S$
              into a positive average.
        feedback: >
          Applying a function after averaging and averaging after applying it
          are different operations. The question is which is bigger.
      - ask: >
          Now let tomorrow's price be $60$ or $140$ with equal probability.
          The expected payoff?
        expects: "20"
        feedback: >
          $(40 + 0)/2 = 20$, while the payoff at the mean price is still $0$.
          More spread, bigger gap.
      - reflect: >
          The payoff bends upward: it is convex. Picture its graph and mark the
          two points $(80, 0)$ and $(120, 20)$. Where does the average of the
          two payoffs sit, relative to the graph at $S = 100$ — and why must
          that happen for every convex function and every two-point law?
        answer: >
          The average of the two payoffs is the midpoint of the chord joining
          the two points, $(100, 10)$, and a convex graph lies on or below its
          chords, so the graph at $100$ is at most $10$. For a general law,
          use a line instead of a chord: a convex $\varphi$ lies above some
          line through $(\mu, \varphi(\mu))$, so
          $\varphi(X) \ge \varphi(\mu) + c(X - \mu)$ outcome by outcome, and
          averaging kills the linear term.
      - teach: >
          That is Jensen's inequality: for convex $\varphi$ on an interval
          holding the values of $X$,
          $\mathbb{E}[\varphi(X)] \ge \varphi(\mathbb{E}[X])$, and for concave
          $\varphi$ it reverses. The proof is a supporting line at
          $\mu = \mathbb{E}[X]$: write
          $\varphi(X) \ge \varphi(\mu) + c(X - \mu)$ outcome by outcome, then
          take expectations.

      - part: Why the line goes through the mean
        ask: >
          Why must the supporting line be taken at $\mu = \mathbb{E}[X]$ and
          not at some other point?
        choices:
          - text: >
              Any point would do; $\mu$ just keeps the arithmetic short.
            feedback: >
              At another point $x_0$ the averaged line reads
              $\varphi(x_0) + c(\mu - x_0)$, which is the line's height at
              $\mu$, and the line sits below the graph there. You get a true
              but weaker statement, not $\varphi(\mu)$.
          - text: >
              At $\mu$ the linear term $c(X - \mu)$ has mean $0$, so what is
              left is exactly $\varphi(\mu)$.
            correct: true
            feedback: >
              Right. This is also where a finite $\mathbb{E}[X]$ is spent:
              without it there is no $\mu$ and no term to cancel.
          - text: >
              Because a convex function is differentiable only at its mean.
            feedback: >
              The payoff is differentiable everywhere except at $100$, and the
              proof never needed a derivative — any supporting slope $c$ will
              do.
        feedback: >
          Pointwise line, then expectation, then the linear term dies: three
          moves.
      - ask: >
          Concave case. A price is $64$ or $144$ with equal probability, and
          you care about $\sqrt{S}$. Compute
          $\sqrt{\mathbb{E}[S]} - \mathbb{E}[\sqrt{S}]$ to three decimal
          places.
        expects: "0.198"
        tolerance: 0.002
        feedback: >
          $\mathbb{E}[\sqrt{S}] = (8 + 12)/2 = 10$ and
          $\sqrt{\mathbb{E}[S]} = \sqrt{104} \approx 10.198$. The difference
          is about $0.198$, positive: for the concave square root, the function
          of the average is the larger side.

      - part: Where it breaks
        ask: >
          A capped contract pays $\min(\max(S - 100, 0), 20)$. The price is
          $100$ or $140$ with equal probability, so the expected payoff is
          $10$ while the payoff at the mean price $120$ is $20$. What is going
          on?
        choices:
          - text: >
              Jensen fails here; it is a rule of thumb.
            feedback: >
              Jensen is a theorem. When its conclusion fails, a hypothesis
              failed first.
          - text: >
              The capped payoff is not convex across the range of $S$: it
              bends down at $120$, so no supporting line lies below it on
              $[100, 140]$.
            correct: true
            feedback: >
              Right. Convex up to $120$, concave after; the law straddles both
              pieces, and the direction is no longer guaranteed.
          - text: >
              Jensen applies, but with the inequality reversed for capped
              payoffs.
            feedback: >
              A reversed inequality needs a concave function across the range,
              and this payoff is convex near $100$. It is neither, so Jensen
              says nothing either way.
        feedback: >
          Convexity has to hold everywhere $X$ can land, not just somewhere
          nearby.
      - ask: >
          Back to $\max(S - 100, 0)$, but now $S$ is uniform between $105$ and
          $130$. How does $\mathbb{E}[\varphi(S)]$ compare with
          $\varphi(\mathbb{E}[S])$?
        choices:
          - text: >
              Strictly greater: $S$ is random and $\varphi$ is convex.
            feedback: >
              The strict version needs strict convexity where $S$ lives. On
              $[105, 130]$ the payoff is the straight line $S - 100$.
          - text: >
              Equal: on the range of $S$ the payoff is linear.
            correct: true
            feedback: >
              Right. Both sides are $\mathbb{E}[S] - 100 = 17.5$. The bend at
              $100$ never comes into play.
          - text: >
              Smaller, since the price never falls below $100$.
            feedback: >
              Jensen's direction for a convex $\varphi$ never reverses. At
              worst the two sides are equal, which is what happens here.
        feedback: >
          The gap comes from curvature where the randomness lives. No
          curvature there, no gap.
      - teach: >
          Said aloud: "Is $\mathbb{E}[f(X)]$ equal to $f(\mathbb{E}[X])$? Only
          if $f$ is linear where $X$ lives. $f$ is convex, so the expectation
          of $f$ is bigger" — direction first, then the supporting-line reason
          if asked.
  - node: quant-probability.inequalities.jensen-second-moment
    hook: >
      This is the lookup table for the interview's favorite Jensen
      questions — reciprocal, exponential, log — and knowing the direction
      cold, without re-deriving convexity each time, is what fluency looks
      like.
    explanation: >
      Each fact here is the same move: name $\varphi$, check its curvature,
      apply Jensen. $\varphi(x)=x^{2}$ is convex everywhere, so
      $\mathbb{E}[X^{2}]\ge(\mathbb{E}[X])^{2}$ always — not a separate fact
      to memorize, it is $\operatorname{Var}(X)\ge0$ restated, since the gap
      between the two sides is exactly the variance.

      $\varphi(x)=1/x$ is convex on $x>0$ (it curves upward, steepening as
      $x$ shrinks toward $0$), so $\mathbb{E}[1/X]\ge1/\mathbb{E}[X]$
      whenever $X$ is positive — averaging the reciprocals always overstates
      the reciprocal of the average, because small values of $X$ contribute
      disproportionately large $1/X$ terms. $\varphi(x)=e^{x}$ is convex,
      giving $\mathbb{E}[e^{X}]\ge e^{\mathbb{E}[X]}$; $\ln$ is concave,
      flipping the direction to $\mathbb{E}[\ln X]\le\ln\mathbb{E}[X]$.

      The exponential and log versions are the same fact from opposite
      sides, and together they explain why a compounding return's long-run
      growth rate sits below its arithmetic average return — the log of the
      average outruns the average of the logs, and that shortfall is what
      "volatility drag" means.
    worked: >
      Let $X$ be $0$ or $2$ with equal probability, so $\mathbb{E}[X]=1$.
      Directly, $\mathbb{E}[e^{X}] = \frac{1}{2}(e^{0}+e^{2}) =
      \frac{1}{2}(1+7.389)\approx4.19$, while $e^{\mathbb{E}[X]}=e^{1}
      \approx2.72$ — confirming $\mathbb{E}[e^{X}]\ge e^{\mathbb{E}[X]}$,
      with a gap of about $1.48$ coming entirely from the spread between
      $0$ and $2$.
    interview: >
      "Is $\mathbb{E}[1/X]$ the same as $1/\mathbb{E}[X]$" (or the
      exponential or log version) is asked almost verbatim — answer "no"
      immediately, name the direction, and only then offer the convexity
      reason if asked.
    pitfalls: >
      Getting the reciprocal direction backwards (assuming averaging
      reciprocals gives something smaller) is the most common slip, since
      it runs against the intuition that more terms in the denominator
      should shrink things. Applying the exponential or log substitution to
      a variable that can be zero or negative breaks the domain $\varphi$
      needs.
    recap: >
      Squares, reciprocals, exponentials and logs each inherit a fixed
      direction of Jensen gap — $\ge$ for the convex ones, $\le$ for
      concave $\ln$ — and the square case is exactly $\operatorname{Var}
      (X)\ge0$.
    dialogue:
      - part: Average speed, average time
        teach: >
          Your commute is $60$ km. Each day traffic lets you average either
          $30$ or $90$ km/h, with equal probability. Your average speed is
          $60$ km/h, so a colleague says the trip takes one hour on average.
      - ask: >
          What is the expected trip time, in hours?
        expects: "4/3"
        tolerance: 0.001
        hint: >
          Compute the time on each kind of day first, then average.
        feedback: >
          A slow day takes $60/30 = 2$ hours and a fast day $60/90 = 2/3$ of an
          hour, so the expected time is $(2 + 2/3)/2 = 4/3$ hours, twenty
          minutes more than the colleague's hour.
      - ask: >
          Why did the colleague come in low?
        choices:
          - text: >
              Slow days must be more common than fast ones.
            feedback: >
              They are equally likely by construction. The asymmetry is in the
              function, not the probabilities.
          - text: >
              Time is $60/v$, which curves upward: a slow day costs a full
              extra hour, while a fast day saves only twenty minutes.
            correct: true
            feedback: >
              Right. The reciprocal is convex on $v > 0$, so the average of
              the times beats the time at the average speed.
          - text: >
              They should have used the median speed instead of the mean.
            feedback: >
              With two equally likely speeds the median is no better defined
              than the mean, and any single speed plugged into $60/v$ makes the
              same mistake: it pushes the function through the average.
        feedback: >
          $\mathbb{E}[1/V] \ge 1/\mathbb{E}[V]$ for positive $V$, with
          equality only when $V$ never varies.
      - ask: >
          What constant speed would give the same expected trip time of $4/3$
          hours?
        expects: "45"
        feedback: >
          $60/(4/3) = 45$ km/h. The speed that governs average time is the
          harmonic mean of $30$ and $90$, which sits well below their
          arithmetic mean of $60$.
      - reflect: >
          Before computing anything, predict the direction of each gap:
          $\mathbb{E}[X^{2}]$ against $(\mathbb{E}[X])^{2}$;
          $\mathbb{E}[e^{X}]$ against $e^{\mathbb{E}[X]}$;
          $\mathbb{E}[\ln X]$ against $\ln \mathbb{E}[X]$ for positive $X$.
          What single check settles each one?
        answer: >
          Check the curvature of the function where $X$ lives. $x^{2}$ and
          $e^{x}$ are convex everywhere, so the expectation of the function is
          the larger side; $\ln$ is concave on $x > 0$, so it is the smaller
          side. Each is Jensen with one choice of $\varphi$, and the square
          case is special: its gap is exactly $\operatorname{Var}(X)$.
      - teach: >
          These are the standard Jensen substitutions. Square:
          $\mathbb{E}[X^{2}] \ge (\mathbb{E}[X])^{2}$, which is
          $\operatorname{Var}(X) \ge 0$. Reciprocal, for $X > 0$:
          $\mathbb{E}[1/X] \ge 1/\mathbb{E}[X]$. Exponential:
          $\mathbb{E}[e^{X}] \ge e^{\mathbb{E}[X]}$. Log, for $X > 0$:
          $\mathbb{E}[\ln X] \le \ln \mathbb{E}[X]$. Each gap closes only when
          $X$ is constant.

      - part: Exponentials and logs
        ask: >
          A price is multiplied each day by $e^{Z}$, with $Z = +0.5$ or $-0.5$
          equally likely, so the expected log-return is $0$. Compute the
          expected multiplier $\mathbb{E}[e^{Z}]$ to three decimal places.
        expects: "1.128"
        tolerance: 0.001
        feedback: >
          $(e^{0.5} + e^{-0.5})/2 \approx (1.6487 + 0.6065)/2 \approx 1.128$,
          above $e^{0} = 1$. A zero average log-return still gives an average
          multiplier above one — the same reason a lognormal's mean exceeds
          $e^{\mu}$.
      - ask: >
          A position's value is multiplied each year by a random factor $G > 0$
          with $\mathbb{E}[G] = 1$ exactly, and $G$ genuinely varies. What is
          the sign of $\mathbb{E}[\ln G]$?
        choices:
          - text: >
              Zero, because the factor averages to one.
            feedback: >
              That moves $\ln$ through the expectation. Try $G = 1.5$ or
              $0.5$: $\mathbb{E}[G] = 1$, but
              $\mathbb{E}[\ln G] = (\ln 1.5 + \ln 0.5)/2 \approx -0.144$.
          - text: >
              Positive, since the up years are as likely as the down years.
            feedback: >
              That is the convex direction, and $\ln$ is concave. In the
              $1.5$ or $0.5$ example a good year and a bad year multiply to
              $0.75$, not $1$.
          - text: >
              Negative: $\ln$ is concave, so
              $\mathbb{E}[\ln G] < \ln \mathbb{E}[G] = 0$.
            correct: true
            feedback: >
              Right. The typical path shrinks even though the average factor is
              one; that shortfall is volatility drag.
        feedback: >
          The exponential and the log are one fact seen from two sides: the
          mean multiplier is pulled up, the typical growth rate is pulled
          down.

      - part: Domains, and saying it first
        ask: >
          $X$ is $-2$ or $4$ with equal probability. Is
          $\mathbb{E}[1/X] \ge 1/\mathbb{E}[X]$?
        choices:
          - text: >
              Yes: the reciprocal is convex, so Jensen applies.
            feedback: >
              Compute it: $\mathbb{E}[1/X] = (-1/2 + 1/4)/2 = -1/8$, while
              $1/\mathbb{E}[X] = 1/1 = 1$. The inequality fails.
          - text: >
              No: $1/x$ is convex only on each side of $0$, and $X$ straddles
              $0$, so Jensen does not apply.
            correct: true
            feedback: >
              Right. $1/x$ is concave on $x < 0$; across $0$ there is no
              supporting line at all. Here $-1/8$ against $1$.
          - text: >
              It is undefined, because $\mathbb{E}[X] = 0$.
            feedback: >
              $\mathbb{E}[X] = (-2 + 4)/2 = 1$, so both sides are defined. The
              trouble is the convexity hypothesis, not division by zero.
        feedback: >
          The reciprocal and log substitutions need $X > 0$. Check the domain
          before you quote the direction.
      - ask: >
          Interviewer: "$X$ is positive and random. Is $\mathbb{E}[1/X]$ equal
          to $1/\mathbb{E}[X]$?" The best answer?
        choices:
          - text: >
              "Yes, by linearity."
            feedback: >
              Linearity covers sums and constant multiples, and $1/x$ is
              neither. The commute showed the gap directly.
          - text: >
              "No: $1/x$ is convex for $x > 0$, so
              $\mathbb{E}[1/X] \ge 1/\mathbb{E}[X]$, strictly unless $X$ is
              constant."
            correct: true
            feedback: >
              Direction first, reason second, equality case last — the whole
              answer in one breath.
          - text: >
              "No: $\mathbb{E}[1/X]$ is smaller, since averaging tames the
              big values."
            feedback: >
              Backwards. The small values of $X$ produce huge reciprocals, and
              convexity says they win: the slow day dominated the commute.
        feedback: >
          The answer to "can I move the function inside?" is always no, with a
          sign — and the sign comes from the curvature.
      - teach: >
          Said aloud: name the function, name its curvature on the range of
          $X$, state the direction. Reciprocal and exponential: the average of
          the function is bigger. Log: smaller. Square: bigger, by exactly the
          variance.
  - node: quant-probability.inequalities.jensen-am-gm
    hook: >
      AM–GM shows up constantly as a standalone algebra fact, but seeing it
      fall out of Jensen in three lines is what lets you also produce the
      weighted version on the spot, which the memorized inequality alone
      doesn't give you.
    explanation: >
      The move is to manufacture a random variable out of a deterministic
      list: put probability $w_i$ on the point $x_i$, so $X$ literally
      equals one of $x_1,\dots,x_n$ chosen with those weights. Averaging is
      now a genuine expectation, $\mathbb{E}[X]=\sum_i w_ix_i$, the ordinary
      weighted arithmetic mean.

      $\ln$ is concave, so Jensen in its concave direction gives
      $\mathbb{E}[\ln X]\le\ln\mathbb{E}[X]$, which unpacked is $\sum_i
      w_i\ln x_i \le \ln\left(\sum_i w_ix_i\right)$. Exponentiating both
      sides — a strictly increasing map, so the inequality direction
      survives — turns the sum on the left into a product, $\prod_i
      x_i^{w_i}\le\sum_i w_ix_i$: the weighted geometric mean never exceeds
      the weighted arithmetic mean.

      Equal weights $w_i=1/n$ recover the version usually seen first, and
      strict concavity of $\ln$ pins equality down to exactly the case
      where every $x_i$ coincides. The randomization trick generalizes
      beyond $\ln$: any concave $\varphi$ applied this way produces a
      weighted inequality the deterministic proof, built for equal weights,
      doesn't hand you directly.
    worked: >
      Take $x=(4,9)$ with weights $w=(0.25,0.75)$. The weighted arithmetic
      mean is $0.25(4)+0.75(9)=1+6.75=7.75$. The weighted geometric mean is
      $4^{0.25}\cdot 9^{0.75} = \sqrt{2}\cdot 3\sqrt{3}\approx1.414\times
      5.196\approx7.35$, confirming $7.35\le7.75$.
    interview: >
      "Prove AM–GM" sometimes explicitly asks for the probabilistic route —
      naming the randomization trick and citing Jensen on $\ln$ is faster
      and more general than the classical induction proof, and it hands you
      the weighted version for free.
    pitfalls: >
      Forgetting the weights must be nonnegative and sum to $1$ for the
      construction to be a genuine probability distribution invalidates the
      whole argument. Applying the trick to numbers that aren't strictly
      positive breaks $\ln$'s domain before Jensen can even be invoked.
    recap: >
      Randomizing over the numbers and applying Jensen to concave $\ln$
      produces weighted AM–GM in three lines, with the classical
      equal-weights inequality as the special case.
    dialogue:
      - part: Splitting twelve three ways
        teach: >
          You split $12$ into three positive numbers $a$, $b$, $c$ and are paid
          their product $abc$. The interviewer wants the largest possible
          payout, and a proof that nothing beats it.
      - ask: >
          Try two splits: $2, 4, 6$ and $3, 4, 5$. What is the larger of the
          two products?
        expects: "60"
        feedback: >
          $2 \cdot 4 \cdot 6 = 48$ and $3 \cdot 4 \cdot 5 = 60$. The more even
          split pays more.
      - ask: >
          Guess the maximum payout.
        expects: "64"
        feedback: >
          The even split $4, 4, 4$ pays $64$. The guess is right; the proof is
          still missing.
      - ask: >
          A candidate argues: "The problem is symmetric in $a$, $b$, $c$, so
          the maximum is at $a = b = c$." Is that a proof?
        choices:
          - text: >
              Yes: a symmetric problem has a symmetric optimum.
            feedback: >
              Maximize $a^{2} + b^{2} + c^{2}$ with the same sum: also
              symmetric, yet $4, 4, 4$ gives $48$, the *minimum*, and the sum
              of squares creeps toward $144$ as one part takes nearly all of
              the $12$.
          - text: >
              No: symmetry suggests $4, 4, 4$ but proves nothing; you need an
              inequality that holds for every split.
            correct: true
            feedback: >
              Right. A symmetric problem can have its optimum anywhere; only
              an inequality closes the question.
          - text: >
              Yes, once you check that $4, 4, 4$ beats every split you tried.
            feedback: >
              Checking finitely many splits leaves infinitely many unchecked.
        feedback: >
          The proof needs a statement of the form $abc \le 64$ for all
          positive $a + b + c = 12$.
      - reflect: >
          Turn the three numbers into a random variable: let $X$ be $a$, $b$
          or $c$, each with probability $1/3$, so $\mathbb{E}[X] = 4$. Which
          function, applied inside an expectation, turns the product $abc$
          into something about $X$ — and which way does Jensen point for it?
        hint: >
          Which function turns products into sums?
        answer: >
          The logarithm. $\mathbb{E}[\ln X] = (\ln a + \ln b + \ln c)/3 =
          \ln(abc)/3$, and $\ln$ is concave, so
          $\mathbb{E}[\ln X] \le \ln \mathbb{E}[X] = \ln 4$. Hence
          $\ln(abc) \le 3\ln 4$ and $abc \le 64$, with equality only when $X$
          is constant — $a = b = c = 4$ — since $\ln$ is strictly concave.
      - teach: >
          That is AM–GM as a case of Jensen. With weights $w_i \ge 0$ summing
          to $1$ on positive numbers $x_i$, let $X = x_i$ with probability
          $w_i$; concavity of $\ln$ gives
          $\sum_i w_i \ln x_i \le \ln\left(\sum_i w_i x_i\right)$, and
          exponentiating gives $\prod_i x_i^{w_i} \le \sum_i w_i x_i$. Equal
          weights give the familiar version; unequal weights come free.

      - part: Unequal weights
        ask: >
          Now maximize $x^{2}y$ for positive $x$, $y$ with $x + y = 9$. Which
          three numbers should you feed to the equal-weights AM–GM so that
          their sum is fixed and their product is a multiple of $x^{2}y$?
        choices:
          - text: >
              $x$, $x$ and $y$.
            feedback: >
              Their product is $x^{2}y$, but their sum is $2x + y$, which
              changes with the split. The bound would still depend on $x$.
          - text: >
              $x/2$, $x/2$ and $y$.
            correct: true
            feedback: >
              Right. They sum to $x + y = 9$, and their product is
              $x^{2}y/4$.
          - text: >
              $x$ and $y$, two numbers.
            feedback: >
              Their geometric mean is $\sqrt{xy}$, which controls $xy$, not
              $x^{2}y$.
        feedback: >
          Split the terms so the sum is fixed and the product is what you
          want. Weights $(2/3, 1/3)$ on $x/2$ and $y$ say the same thing.
      - ask: >
          So what is the largest possible value of $x^{2}y$?
        expects: "108"
        hint: >
          The arithmetic mean of $x/2$, $x/2$, $y$ is $3$.
        feedback: >
          $(x/2)(x/2)y \le 3^{3} = 27$, so $x^{2}y \le 108$.
      - ask: >
          At which $x$ is $108$ attained?
        expects: "6"
        feedback: >
          Equality needs the three numbers equal: $x/2 = y$ with $x + y = 9$,
          so $x = 6$, $y = 3$, and $36 \cdot 3 = 108$. The bound is attained,
          so it is the maximum.

      - part: Where it breaks
        ask: >
          Back to splitting $12$, but now the parts may be negative. What
          happens to the maximum payout?
        choices:
          - text: >
              Still $64$: AM–GM does not care about signs.
            feedback: >
              Try $-10$, $-10$, $32$: the sum is $12$ and the product is
              $3200$. The $\ln$ in the proof needs positive numbers.
          - text: >
              There is no maximum: two large negative parts and one large
              positive part make the product as big as you like.
            correct: true
            feedback: >
              Right. $-10, -10, 32$ already pays $3200$, and $-n, -n, 12 + 2n$
              grows without limit. Positivity is a hypothesis, not a
              convenience.
          - text: >
              It drops below $64$, because negative parts shrink the product.
            feedback: >
              Two negatives make a positive. $-10, -10, 32$ pays $3200$.
        feedback: >
          Jensen on $\ln$ needs $X > 0$; without it the argument never starts.
      - ask: >
          A candidate writes the weighted bound with weights $0.5$ and $0.6$
          on the numbers $10$ and $10$:
          $10^{0.5} \cdot 10^{0.6} \le 0.5 \cdot 10 + 0.6 \cdot 10$. What is
          wrong?
        choices:
          - text: >
              Nothing: equal numbers make AM–GM an equality.
            feedback: >
              Compute it: the left side is $10^{1.1} \approx 12.6$ and the
              right side is $11$. The inequality is false.
          - text: >
              The weights sum to $1.1$, so they are not a probability law and
              Jensen does not apply.
            correct: true
            feedback: >
              Right. The proof needs $X$ to be a random variable, and weights
              that do not sum to $1$ do not define one. Here
              $12.6 > 11$.
          - text: >
              The numbers must be distinct.
            feedback: >
              Equal numbers are the equality case, not a forbidden one. The
              defect is the weights.
        feedback: >
          Before quoting weighted AM–GM, check the weights are nonnegative and
          sum to $1$.
      - teach: >
          Said aloud: "Randomize over the numbers, apply Jensen to the concave
          log, exponentiate. Equality when the numbers agree." For an
          optimization, split the terms so their sum is fixed, then read off
          where they become equal.
  - node: quant-probability.inequalities.union-bound
    hook: >
      "What's the chance something goes wrong" across many possible failure
      modes, with no way to compute how they overlap, is answered by the
      union bound — the only tool in this unit that needs zero information
      about dependence.
    explanation: >
      You already know the two-event identity $\Pr(A\cup B)=\Pr(A)+\Pr(B)-
      \Pr(A\cap B)$; dropping the subtracted intersection term (never
      negative) immediately gives $\Pr(A\cup B)\le\Pr(A)+\Pr(B)$. Chaining
      this pairwise bound across any number of events, finite or countable,
      gives the general union bound $\Pr(\bigcup_iA_i)\le\sum_i\Pr(A_i)$ —
      no assumption about how the $A_i$ overlap is ever used, because the
      bound is thrown away rather than computed.

      The intuition is a Venn diagram: summing $\Pr(A_i)$ separately counts
      every outcome once per event it belongs to, so an outcome in three
      events at once gets counted three times. That over-counting is
      exactly what makes the sum an upper bound rather than an exact
      answer, and it's also why the bound is only useful while the sum
      stays comfortably below $1$ — once double-counting could plausibly
      account for the excess over $1$, the bound has nothing left to say.

      The complementary reading is usually the one actually used: $\Pr(
      \bigcap_iA_i^{c})\ge1-\sum_i\Pr(A_i)$, so if a list of individually
      rare failure probabilities adds to something small, everything
      survives simultaneously with high probability — the standard move
      behind "nothing goes wrong across all these components" arguments.
    worked: >
      A trading system depends on $5$ independent-looking checks, each
      failing with probability $0.01$ on a given day (dependence between
      them is unknown). The chance at least one check fails is at most
      $5\times0.01=0.05$, so the chance every check passes is at least
      $1-0.05=0.95$ — a guaranteed $95\%$ reliability floor without knowing
      anything about how the checks interact.
    interview: >
      "Bound the chance at least one of these things happens" with no
      independence assumption is the union bound by reflex — sum the
      individual probabilities and say explicitly that overlap is being
      ignored, which only makes the bound conservative, never wrong.
    pitfalls: >
      Using the union bound when events are known to be disjoint wastes
      information — it's a strict equality there, not just a bound.
      Trusting the bound once the sum exceeds $1$ gives a technically true
      but useless statement ($\Pr(\cdot)\le1$ trivially).
    recap: >
      Discarding the intersection terms from inclusion–exclusion gives
      $\Pr(\bigcup_iA_i)\le\sum_i\Pr(A_i)$ for free — no independence, no
      structure — and it's sharp exactly while that sum stays well under
      $1$.
    dialogue:
      - part: Eight feeds, one data centre
        teach: >
          A pricing model reads from $8$ market-data feeds. On a given morning
          each feed is stale with probability $0.004$. The feeds share a data
          centre and some vendors, so nobody knows how their failures depend
          on one another.
      - ask: >
          A colleague reports
          $\Pr(\text{some feed stale}) = 1 - 0.996^{8} \approx 0.0316$. What
          did that computation assume?
        choices:
          - text: >
              That the feeds go stale independently.
            correct: true
            feedback: >
              Right. Multiplying the survival probabilities is the
              independence assumption, and the shared data centre is exactly
              what makes it doubtful.
          - text: >
              That no two feeds are ever stale on the same morning.
            feedback: >
              Disjoint failures would give the plain sum $0.032$. The product
              formula is the independent case.
          - text: >
              Nothing: it is the complement rule.
            feedback: >
              The complement rule gives $1 - \Pr(\text{all fresh})$; writing
              $\Pr(\text{all fresh}) = 0.996^{8}$ is where independence came
              in.
        feedback: >
          With dependence unknown, the honest question is: what is the
          *largest* this probability could be?
      - ask: >
          Suppose the feeds always fail together, on the same mornings. What
          is $\Pr(\text{some feed stale})$?
        expects: "0.004"
        feedback: >
          If they fail as one, "some feed stale" is the same event as "feed $1$
          stale": $0.004$.
      - ask: >
          Suppose instead that no two feeds are ever stale on the same
          morning. What is $\Pr(\text{some feed stale})$ now?
        expects: "0.032"
        feedback: >
          Disjoint events add: $8 \times 0.004 = 0.032$.
      - reflect: >
          Across every pattern of dependence, the answer ran from $0.004$ to
          $0.032$. Why can it never exceed $0.032$, whatever the overlap? Point
          to the term you would be throwing away.
        hint: >
          Start with two feeds and the rule for $\Pr(A \cup B)$.
        answer: >
          For two events $\Pr(A \cup B) = \Pr(A) + \Pr(B) - \Pr(A \cap B)$,
          and the subtracted overlap is never negative, so
          $\Pr(A \cup B) \le \Pr(A) + \Pr(B)$. Applying that one event at a
          time gives the sum over all eight. Summing counts each morning once
          per stale feed, so overlapping failures are over-counted and the sum
          can only be too big — and it is exact when the events are disjoint.
      - teach: >
          That is the union bound, or Boole's inequality:
          $\Pr\left(\bigcup_i A_i\right) \le \sum_i \Pr(A_i)$, for any events
          at all, with no independence. Read the other way it is a guarantee:
          $\Pr(\text{no bad event}) \ge 1 - \sum_i \Pr(A_i)$.

      - part: Reading it as a guarantee
        ask: >
          What floor can you promise on the chance that all $8$ feeds are fresh
          tomorrow morning?
        expects: "0.968"
        feedback: >
          $1 - 0.032 = 0.968$, whatever the dependence. Under independence the
          number would be $0.9684$; the union bound gives away almost nothing
          and assumes nothing.
      - ask: >
          A strategy trades on $250$ days a year, and on each day the chance of
          a fat-finger error is $1/5000$. Bound the chance of at least one
          fat-finger error in the year.
        expects: "0.05"
        feedback: >
          $250 \times 1/5000 = 0.05$. Days need not be independent — a tired
          trader can make errors on consecutive days — and the bound does not
          care.

      - part: When the sum runs past one
        ask: >
          A larger system reads $40$ feeds, each stale with probability $0.03$.
          The union bound gives $1.2$. What do you conclude?
        choices:
          - text: >
              Some feed is certain to be stale every morning.
            feedback: >
              A bound above $1$ forces nothing. If the forty feeds always fail
              together, some feed is stale only $3\%$ of the time.
          - text: >
              The bound is vacuous here; you need information about the
              overlaps to say more.
            correct: true
            feedback: >
              Right. Past $1$ the sum tells you less than the trivial bound
              does.
          - text: >
              The union bound is invalid for this many events.
            feedback: >
              It is valid for any number of events, even countably many. It is
              true here, just useless.
        feedback: >
          The union bound is excellent while the sum is small and worthless
          once it nears $1$.
      - ask: >
          Back to the $8$ feeds. Suppose you also learn that each *pair* of
          feeds is stale together with probability at most $0.0001$.
          Inclusion–exclusion cut after the pair terms gives a lower bound:
          $\Pr(\bigcup_i A_i) \ge \sum_i \Pr(A_i) - \sum_{i<j} \Pr(A_i \cap
          A_j)$. What floor does it give?
        expects: "0.0292"
        hint: >
          There are $\binom{8}{2} = 28$ pairs.
        feedback: >
          $0.032 - 28 \times 0.0001 = 0.0292$. So the chance of some stale
          feed lies between $0.0292$ and $0.032$: one more layer of
          information, and the bound becomes a bracket.
      - teach: >
          Said aloud: "No independence given, so union bound: at most the sum
          of the individual probabilities. It is conservative — overlaps only
          help — and useful while the sum is well under one."
  - node: quant-probability.inequalities.collision-bound
    hook: >
      This is the birthday problem's estimate, generalized to hashing — the
      union bound turns a hard combinatorial collision question into a
      one-line sum over pairs, and knowing when that sum is trustworthy
      versus useless is the actual skill.
    explanation: >
      Name one event per pair of items instead of reasoning about the
      collision directly: with $n$ items there are $\binom{n}{2}$ pairs,
      and pair $(i,j)$ collides — lands on the same one of $m$ labels — with
      probability exactly $1/m$, since the second item's label is uniform
      over $m$ choices independent of the first's. The union bound sums
      these $\binom{n}{2}$ probabilities without needing to know how the
      pair-events overlap through shared items, giving $\Pr(\text{some
      collision})\le\binom{n}{2}/m$ immediately.

      The bound is essentially exact whenever collisions are rare, because
      in that regime a double collision (two different pairs colliding at
      once) is a second-order event the sum barely over-counts — the same
      logic behind the Poisson approximation for rare events built from
      many weakly dependent indicators. It degrades exactly as
      $\binom{n}{2}/m$ approaches $1$, since the over-counting from shared
      items becomes a real fraction of the total.
    worked: >
      Assign $50$ people independent random codes out of $m=1000$
      possibilities. There are $\binom{50}{2}=1225$ pairs, each colliding
      with probability $1/1000$, so $\Pr(\text{some shared code})\le
      1225/1000=1.225$ — already past $1$, so the bound is worthless here;
      the true collision probability (computable directly) is about
      $0.71$. Shrinking to $n=10$ people restores usefulness:
      $\binom{10}{2}/1000=45/1000=0.045$, close to the true value of about
      $0.044$.
    interview: >
      Hashing questions ("how many items before two hash to the same
      bucket") are this bound by name — set up the $\binom{n}{2}/m$ sum
      immediately, and be ready to say when it stops being trustworthy
      rather than quoting it blindly.
    pitfalls: >
      Presenting $\binom{n}{2}/m$ as an exact probability rather than an
      upper bound overstates precision the union bound never promised.
      Applying the formula once it exceeds $1$ without flagging that the
      bound has become vacuous signals you don't know its regime of
      validity.
    recap: >
      Summing collision probability over all $\binom{n}{2}$ pairs bounds
      any-collision by $\binom{n}{2}/m$ — accurate while that quantity is
      well under $1$, meaningless once it isn't.
    dialogue:
      - part: Tags that might clash
        teach: >
          Each of $40$ orders gets a tag drawn independently and uniformly from
          $65\,536$ values, a $16$-bit number. If two orders share a tag,
          reconciliation breaks. You want a quick ceiling on the chance of
          that happening.
      - ask: >
          With just two orders, what is the probability they share a tag? Give
          it as a fraction.
        expects: "1/65536"
        feedback: >
          Whatever tag the first order got, the second matches it with
          probability $1/65\,536$.
      - ask: >
          With $40$ orders, how many pairs of orders are there?
        expects: "780"
        feedback: >
          $\binom{40}{2} = 40 \cdot 39/2 = 780$. A clash is a statement about
          a pair, so pairs, not orders, are the things to count.
      - reflect: >
          "Some clash" happens exactly when at least one of the $780$ pairs
          clashes. Turn that into a ceiling. What do you not need to know about
          how the pair-events interact — pairs $(1,2)$ and $(1,3)$ share an
          order, after all?
        answer: >
          "Some clash" is the union of the $780$ pair-events, each of
          probability $1/65\,536$, so the union bound gives
          $\Pr(\text{some clash}) \le 780/65\,536$. The union bound never
          looks at overlaps, so it does not matter that pair-events sharing an
          order are linked; you sum and move on.
      - teach: >
          That is the collision bound: $n$ items with independent uniform
          labels from $m$ values collide with probability at most
          $\binom{n}{2}/m$, one term per pair. It is the birthday problem
          without the product formula, and it is accurate exactly when
          collisions are rare.
      - ask: >
          Evaluate $780/65\,536$ to four decimal places.
        expects: "0.0119"
        tolerance: 0.0001
        feedback: >
          $780/65\,536 \approx 0.0119$: about a $1.2\%$ chance at most.

      - part: When the sum can be trusted
        ask: >
          The exact clash probability is
          $1 - \prod_{j=0}^{39}(1 - j/65\,536)$. How does it compare with the
          bound $0.0119$?
        choices:
          - text: >
              Slightly below: about $0.01183$, within one percent of the bound.
            correct: true
            feedback: >
              Right. The bound over-counts only outcomes with two or more
              clashing pairs at once, and at this size those are second-order
              rare.
          - text: >
              Far below: the union bound is always loose by a factor of two or
              more.
            feedback: >
              The over-counting is the chance of two clashes at once, which is
              tiny when one clash is already rare. Here the gap is under one
              percent of the answer.
          - text: >
              Slightly above, since the product formula includes every
              pair.
            feedback: >
              The union bound can never sit below the truth; that is what
              makes it a bound.
        feedback: >
          In the rare-collision regime the sum over pairs is not just a bound,
          it is nearly the answer.
      - ask: >
          Now $400$ orders, same $16$-bit tags. What does the bound
          $\binom{n}{2}/m$ give, to two decimal places?
        expects: "1.22"
        tolerance: 0.005
        feedback: >
          $\binom{400}{2} = 79\,800$, and $79\,800/65\,536 \approx 1.22$.
      - ask: >
          What do you tell the desk about $400$ orders?
        choices:
          - text: >
              A clash is certain.
            feedback: >
              A bound above $1$ forces nothing. The exact probability is about
              $0.70$ — likely, not certain.
          - text: >
              The bound is vacuous; the exact formula puts the clash chance
              near $0.70$, and either way $16$ bits is too few.
            correct: true
            feedback: >
              Right. Past $1$ the sum has stopped measuring anything, because
              the over-counted multiple clashes are now common.
          - text: >
              The bound is wrong at this size, so $400$ orders may well be
              safe.
            feedback: >
              The bound is true, just empty. The real chance, about $0.70$, is
              anything but safe.
        feedback: >
          Trust $\binom{n}{2}/m$ while it is well under $1$; past that, compute
          or redesign.

      - part: How the tag size scales
        ask: >
          To keep the same collision ceiling while serving $4$ times as many
          orders, by what factor must the number of possible tags grow?
        expects: "16"
        hint: >
          How does the number of pairs grow with $n$?
        feedback: >
          $\binom{n}{2} \approx n^{2}/2$, so four times the orders makes about
          sixteen times the pairs, and $m$ must grow sixteenfold to hold
          $\binom{n}{2}/m$ fixed. Answering $4$ treats clashes as a property
          of single orders; answering $2$ runs the square root the wrong way.
          Equivalently, the safe order count grows only like $\sqrt{m}$ —
          the reason $16$ bits gives out after a few hundred items.
      - teach: >
          Said aloud: "Union over pairs: at most $n$ choose $2$ over $m$. Good
          while that is small, vacuous past one, and it scales like $n^{2}$,
          so the safe count is about $\sqrt{m}$."
  - node: quant-probability.inequalities.chernoff
    hook: >
      When mean-and-variance bounds decay only polynomially and the
      question needs "exponentially unlikely," Chernoff is the escalation —
      the same Markov trick, aimed at the moment generating function
      instead of $X$ itself.
    explanation: >
      The trick is a change of variable before applying Markov: for any
      $t>0$, the events $\{X\ge a\}$ and $\{e^{tX}\ge e^{ta}\}$ are
      identical, since $e^{tx}$ is strictly increasing in $x$, and $e^{tX}$
      is always positive so Markov applies to it cleanly. That gives
      $\Pr(X\ge a)\le e^{-ta}\mathbb{E}[e^{tX}]=e^{-ta}M_X(t)$ for every
      valid $t$, and because this holds for every $t$ at once, minimizing
      the right side over $t>0$ produces the tightest bound this method can
      deliver.

      The exponential is what makes this pay off for a sum of independent
      pieces: the moment generating function of a sum of independent
      variables factors into a product of individual mgfs, so the optimized
      exponent grows linearly in the number of summands instead of surviving
      only the $1/k^{2}$-style decay of a moment-based bound. That's why
      Chernoff bounds appear whenever a question needs a tail that vanishes
      exponentially fast in $n$, not just polynomially.

      The recipe is always the same three moves — exponentiate the event,
      apply Markov, optimize the free parameter $t$ — and the only real work
      in any specific problem is computing $M_X(t)$ and solving the
      resulting minimization, often a single derivative set to zero.
    worked: >
      Let $X$ be exponential with mean $1$, so $M_X(t)=1/(1-t)$ for $t<1$.
      Bound $\Pr(X\ge5)$: minimizing $e^{-5t}/(1-t)$ over $t\in(0,1)$ gives
      $t=0.8$, and plugging back in gives $5e^{-4}\approx0.0916$. Markov
      alone only gives $\mathbb{E}[X]/5=1/5=0.2$, so exponentiating first
      already roughly halves the bound before optimizing further; the true
      value is $e^{-5}\approx0.00674$, closer than either bound but not the
      point — the point is that Chernoff beats Markov by construction.
    interview: >
      "Get an exponential tail bound" or "why does this concentrate so
      fast" calls for naming the three-step recipe — exponentiate, Markov,
      optimize $t$ — before diving into any specific mgf; interviewers
      listen for "optimize over $t$," since skipping that step leaves a
      bound valid but far from best.
    pitfalls: >
      Picking an arbitrary $t$ instead of optimizing leaves a correct but
      needlessly weak bound on the table — the whole value of the method is
      in the minimization step. Using a $t$ outside the region where
      $M_X(t)$ is finite produces a bound that isn't valid at all.
    recap: >
      Chernoff is Markov applied to $e^{tX}$ and optimized over $t$, and
      exponentiating first is precisely what turns polynomial tail decay
      into exponential decay for sums of independent pieces.
    dialogue:
      - part: Two tools that run out
        teach: >
          A desk's P&L over $25$ trading days is
          $S = X_1 + \dots + X_{25}$, with the days independent. Each $X_i$
          has mean $0$, variance $1$, and moment generating function
          $\mathbb{E}[e^{tX_i}] = e^{t^{2}/2}$. Risk wants a ceiling on
          $\Pr(S \ge 20)$.
      - ask: >
          Markov on $S$ at level $20$?
        choices:
          - text: >
              $\mathbb{E}[S]/20 = 0$.
            feedback: >
              A ceiling of $0$ on something that can happen is the alarm: $S$
              takes negative values, so Markov does not apply.
          - text: >
              It does not apply: $S$ can be negative.
            correct: true
            feedback: >
              Right. Markov needs a nonnegative variable, and a P&L is not one.
          - text: >
              $25/20$, using the variance.
            feedback: >
              Markov takes a mean, not a variance, and here it cannot take
              anything: $S$ is signed.
        feedback: >
          The first rung of the ladder is out. Try the second.
      - ask: >
          Chebyshev: $\operatorname{Var}(S) = 25$. What ceiling does it give on
          $\Pr(|S| \ge 20)$, and hence on $\Pr(S \ge 20)$?
        expects: "1/16"
        feedback: >
          $25/20^{2} = 25/400 = 1/16 = 0.0625$.
      - ask: >
          Raise the threshold to $40$: Chebyshev gives $25/1600 = 1/64$. How
          does its ceiling fall as the threshold $s$ grows?
        choices:
          - text: >
              Like $1/s^{2}$: doubling the threshold only quarters the bound.
            correct: true
            feedback: >
              Right. Two moments buy polynomial decay and nothing more, however
              far out you go.
          - text: >
              Exponentially, once $s$ is several standard deviations out.
            feedback: >
              $\sigma^{2}/s^{2}$ is a power of $s$ at every threshold. Nothing
              in two moments can produce exponential decay.
          - text: >
              It stops falling past a few standard deviations.
            feedback: >
              It keeps falling, just slowly: $1/16$ at $20$, $1/64$ at $40$,
              $1/256$ at $80$.
        feedback: >
          You were handed the whole moment generating function and used only
          the variance. The rest of it is sitting unused.
      - reflect: >
          Markov needs a nonnegative variable whose mean you know. Chebyshev
          fed it $S^{2}$. You know $\mathbb{E}[e^{tS}]$ for every $t$. What
          variable do you feed Markov now, and what event about it is exactly
          $S \ge 20$?
        hint: >
          Which function of $S$ is positive whatever the sign of $S$, and
          increasing?
        answer: >
          $e^{tS}$ for a fixed $t > 0$. It is positive for every value of $S$,
          so Markov applies, and because $e^{tx}$ is increasing,
          $\{S \ge 20\} = \{e^{tS} \ge e^{20t}\}$. Markov gives
          $\Pr(S \ge 20) \le e^{-20t}\,\mathbb{E}[e^{tS}]$ — for every
          $t > 0$ at once, so you get to pick the best $t$.
      - teach: >
          That is the Chernoff bound, in three moves: exponentiate,
          $\Pr(X \ge a) = \Pr(e^{tX} \ge e^{ta})$; apply Markov,
          $\le e^{-ta}M_X(t)$; optimize over $t > 0$. The exponential removes
          the sign condition, and the free $t$ is where the strength comes
          from.

      - part: Exponentiate, Markov, optimize
        ask: >
          What is $M_S(t) = \mathbb{E}[e^{tS}]$ for the $25$ independent days?
        choices:
          - text: >
              $25\,e^{t^{2}/2}$
            feedback: >
              Means of sums add; mgfs of sums multiply. $e^{t(X_1 + \dots)}$ is
              a product of $e^{tX_i}$, and independence lets the expectation
              split over the product.
          - text: >
              $e^{25t^{2}/2}$
            correct: true
            feedback: >
              Right: $(e^{t^{2}/2})^{25}$. Independence turns the mgf of the
              sum into a product, and that is what makes the bound strong.
          - text: >
              $e^{625t^{2}/2}$
            feedback: >
              That is the mgf of $25X_1$, one day scaled up, whose variance is
              $625$. Twenty-five independent days have variance $25$.
        feedback: >
          The bound is now $e^{-20t}e^{25t^{2}/2} = e^{g(t)}$ with
          $g(t) = -20t + 12.5t^{2}$.
      - ask: >
          Try the lazy choice $t = 1$. What is the exponent $g(1)$?
        expects: "-7.5"
        feedback: >
          $-20 + 12.5 = -7.5$, so the bound is $e^{-7.5} \approx 5.5 \times
          10^{-4}$ — already a hundred times below Chebyshev, without
          optimizing.
      - ask: >
          Which $t$ minimizes $g(t) = -20t + 12.5t^{2}$?
        expects: "0.8"
        feedback: >
          $g'(t) = -20 + 25t = 0$ at $t = 0.8$.
      - ask: >
          What is the optimized exponent $g(0.8)$?
        expects: "-8"
        feedback: >
          $-16 + 12.5 \times 0.64 = -16 + 8 = -8$. The bound is
          $e^{-8} \approx 3.4 \times 10^{-4}$, about $190$ times below
          Chebyshev's $1/16$.

      - part: What the recipe needs
        ask: >
          Hold the per-day threshold fixed and let the horizon grow: bound
          $\Pr(S \ge 0.8n)$ for $n$ days. How do the two bounds scale with
          $n$?
        choices:
          - text: >
              Both fall like $1/n$.
            feedback: >
              Chebyshev does: $n/(0.8n)^{2} = 1.5625/n$. Chernoff's exponent is
              $-(0.8n)^{2}/(2n) = -0.32n$, which is linear in $n$.
          - text: >
              Chebyshev like $1/n$; Chernoff like $e^{-0.32n}$.
            correct: true
            feedback: >
              Right. The product of $n$ mgfs makes the exponent grow linearly
              in $n$, so the bound decays exponentially in the number of
              independent pieces.
          - text: >
              Chernoff like $e^{-0.32n}$; Chebyshev stays constant.
            feedback: >
              Chebyshev does improve, because the variance $n$ grows more
              slowly than the squared threshold $0.64n^{2}$. It just improves
              polynomially.
        feedback: >
          Exponential in $n$ is the whole reason to do the algebra.
      - ask: >
          A heavy-tailed daily P&L has $\mathbb{E}[e^{tX}] = \infty$ for every
          $t > 0$, though its variance is finite. What does Chernoff give?
        choices:
          - text: >
              Nothing: the right-hand side $e^{-ta}M_X(t)$ is infinite for
              every $t > 0$. Fall back to Chebyshev.
            correct: true
            feedback: >
              Right. The mgf is the input Chernoff buys its strength with; no
              finite mgf, no exponential bound.
          - text: >
              The same $e^{-s^{2}/(2n)}$, since the mean and variance match.
            feedback: >
              That formula came from $M(t) = e^{t^{2}/2}$. With an infinite
              mgf, the tail really can be fatter than any exponential.
          - text: >
              A bound at $t = 0$, where every mgf is finite.
            feedback: >
              At $t = 0$ the bound is $e^{0} \cdot 1 = 1$: true and empty.
              The method needs some $t > 0$ with a finite mgf.
        feedback: >
          Check the mgf is finite at the $t$ you use; it is the only hypothesis
          left after exponentiating.
      - teach: >
          Said aloud: "Exponentiate, apply Markov, optimize $t$. For a sum of
          independent pieces the mgf factorises, so the exponent is linear in
          $n$ and the tail dies exponentially." Interviewers listen for
          "optimize over $t$".
  - node: quant-probability.inequalities.chernoff-binomial
    hook: >
      This is the number that justifies reaching for Chernoff at all —
      seeing the exponential bound beat the polynomial one by a widening
      factor as the threshold moves out is worth more than any amount of
      abstract "exponential decay" language.
    explanation: >
      Recentering $H$ as $S=\sum\varepsilon_i$ with $\pm1$ increments turns
      a binomial tail into a sum-of-independent-pieces tail, exactly the
      shape both Chebyshev and Chernoff are built for — Chebyshev needs
      only the variance of $S$, Chernoff needs its full moment generating
      function, available in closed form via $\mathbb{E}[e^{t\varepsilon}]
      =\cosh t$.

      The comparison isn't a fixed ratio: near the mean the two bounds are
      close, both fairly loose, but the Chernoff bound decays like
      $e^{-cs^{2}}$ in the deviation $s$ while Chebyshev only decays like
      $1/s^{2}$, so the gap between them widens without bound as the
      threshold moves further into the tail. That growth rate, not the
      bound at any single point, is the real content of "Chernoff beats
      Chebyshev" — the exponential eventually wins everywhere, and how fast
      depends on how far into the tail you look.
    worked: >
      Bound $\Pr(H\ge58)$ for the same $100$ fair tosses. Here $S\ge16$, so
      Chernoff gives $e^{-16^{2}/200}=e^{-1.28}\approx0.278$, while
      Chebyshev (with $\sigma_S=10$) gives $100/256\approx0.391$. Chernoff
      wins by a smaller margin at this closer-to-the-mean threshold — a
      normal approximation puts the true probability near $6.7\%$
      ($z\approx1.5$ after continuity correction), so both bounds are still
      generous, but Chernoff visibly closes the gap faster the further the
      threshold sits from the mean.
    interview: >
      "Bound the chance of at least $60$ heads in $100$ fair tosses" is the
      canonical prompt, and the strong answer produces both bounds and
      states which is tighter and why — the interviewer is checking you
      know Chernoff isn't automatically much better at every threshold,
      just eventually and usually decisively.
    pitfalls: >
      Reporting only the Chernoff number without the Chebyshev comparison
      misses the point of the question, which is usually about the two
      bounds' relative behavior. Forgetting the factor of $2$ inside the
      exponent — using $e^{-s^{2}/n}$ instead of $e^{-s^{2}/(2n)}$ — comes
      from mishandling the $\cosh t\le e^{t^{2}/2}$ step.
    recap: >
      Both bounds are computable from the same $\pm1$ sum, but Chernoff's
      $e^{-s^{2}/(2n)}$ decay overtakes Chebyshev's $1/s^{2}$ decay as the
      threshold moves deeper into the tail, with the gap widening the
      further out you look.
    dialogue:
      - part: Four hundred tosses, two bounds
        teach: >
          A fair coin is tossed $400$ times and $H$ counts the heads. The
          interviewer asks for a ceiling on $\Pr(H \ge 230)$, two ways, and
          which is better.
      - ask: >
          Chebyshev first. What is $\operatorname{Var}(H)$?
        expects: "100"
        feedback: >
          $np(1 - p) = 400 \times 1/4 = 100$, so $\sigma_H = 10$ heads.
      - ask: >
          Chebyshev's ceiling on $\Pr(H \ge 230)$, using the two-sided event
          $|H - 200| \ge 30$?
        expects: "1/9"
        tolerance: 0.0005
        feedback: >
          $100/30^{2} = 1/9 \approx 0.111$. The one-sided event sits inside
          the two-sided one, so the ceiling covers it.
      - ask: >
          For Chernoff, write each toss as $\varepsilon_i = \pm 1$ and
          $S = \sum_i \varepsilon_i$, so $S$ counts heads minus tails. Which
          event about $S$ is $H \ge 230$?
        choices:
          - text: >
              $S \ge 30$
            feedback: >
              $30$ is the excess of heads over their mean, but each extra head
              is also one fewer tail. $S = H - (400 - H) = 2H - 400$.
          - text: >
              $S \ge 60$
            correct: true
            feedback: >
              Right: $S = 2H - 400$, so $H \ge 230$ means $S \ge 60$.
          - text: >
              $S \ge 230$
            feedback: >
              $S$ is heads minus tails, not heads. At $230$ heads it is
              $230 - 170 = 60$.
        feedback: >
          The factor of two in the recentring is where most slips happen.
      - ask: >
          One toss has $\mathbb{E}[e^{t\varepsilon}] = \cosh t$. Which bound on
          $\cosh t$ makes the optimization a one-liner?
        choices:
          - text: >
              $\cosh t = e^{t^{2}/2}$ exactly.
            feedback: >
              Not equal: $\cosh 1 \approx 1.543$ while $e^{1/2} \approx 1.649$.
              It is an inequality, and the direction matters.
          - text: >
              $\cosh t \le 1$.
            feedback: >
              $\cosh t \ge 1$ for every $t$, with equality only at $0$.
          - text: >
              $\cosh t \le e^{t^{2}/2}$.
            correct: true
            feedback: >
              Right. Compare the series term by term:
              $t^{2k}/(2k)! \le t^{2k}/(2^{k}k!)$, because $(2k)!$ contains
              $2^{k}k!$ as a factor.
        feedback: >
          With $n$ independent tosses the bound becomes
          $\Pr(S \ge s) \le e^{-ts}(\cosh t)^{n} \le e^{-ts + nt^{2}/2}$.
      - reflect: >
          Both bounds start from the same $400$ tosses. What does Chernoff use
          that Chebyshev throws away, and what shape of decay should that buy?
        answer: >
          Chebyshev keeps only the variance of $S$. Chernoff keeps the whole
          moment generating function — every moment at once — and the
          independence that factorises it, and since each $\pm 1$ toss has an
          mgf below a normal's, $e^{t^{2}/2}$, the sum's tail is held below a
          normal-shaped $e^{-s^{2}/(2n)}$. That is exponential in $s^{2}$,
          against Chebyshev's $1/s^{2}$.
      - ask: >
          Minimizing $-ts + nt^{2}/2$ gives $t = s/n$ and the exponent
          $-s^{2}/(2n)$. Evaluate it at $s = 60$, $n = 400$.
        expects: "-4.5"
        feedback: >
          $-3600/800 = -4.5$, so Chernoff gives $e^{-4.5} \approx 0.011$,
          ten times below Chebyshev's $0.111$.

      - part: Moving the threshold out
        ask: >
          Now bound $\Pr(H \ge 260)$. Chebyshev?
        expects: "1/36"
        tolerance: 0.0005
        feedback: >
          The deviation is $60$ heads: $100/3600 = 1/36 \approx 0.028$.
      - ask: >
          And the Chernoff exponent at $260$ heads?
        expects: "-18"
        hint: >
          First find $s$.
        feedback: >
          $s = 2(260) - 400 = 120$, and $-120^{2}/800 = -18$. The bound is
          $e^{-18} \approx 1.5 \times 10^{-8}$, against Chebyshev's $0.028$:
          a factor of nearly two million. At $230$ heads it was ten.
      - ask: >
          A candidate reports $e^{-9}$ as the Chernoff bound at $230$ heads.
          Verdict?
        choices:
          - text: >
              Correct, and better than $e^{-4.5}$.
            feedback: >
              Smaller is not better if it was never proved. $e^{-9}$ is
              $e^{-s^{2}/n}$, which drops the factor of $2$ — and it is below
              the true probability, so it is not a bound at all.
          - text: >
              Wrong: they dropped the $2$ in $e^{-s^{2}/(2n)}$, claiming a
              bound about ninety times stronger than the one proved.
            correct: true
            feedback: >
              Right. The $2$ comes from $\cosh t \le e^{t^{2}/2}$. And here
              the slip is not just unproved but false: $e^{-9} \approx 0.00012$
              sits below the exact probability, about $0.0016$.
          - text: >
              Wrong: they used $s = 30$ instead of $60$.
            feedback: >
              With $s = 30$ the formula gives $e^{-900/800} \approx e^{-1.1}$,
              not $e^{-9}$. The slip here is the missing $2$.
        feedback: >
          Two arithmetic traps live here: the recentring factor in $s$ and the
          $2$ in the exponent.

      - part: What to say at the board
        ask: >
          The interviewer asks: "So what is the actual probability of $230$ or
          more heads?" The best answer?
        choices:
          - text: >
              "About $0.011$; that is the Chernoff number."
            feedback: >
              Chernoff gives a ceiling. The exact binomial sum is about
              $0.0016$, seven times smaller.
          - text: >
              "Both are ceilings. The truth is smaller than either — the exact
              binomial sum is about $0.0016$ — but Chernoff is the one that
              decays at the right rate."
            correct: true
            feedback: >
              Right. Neither bound is an estimate; the point of the comparison
              is how fast each falls as the threshold moves out.
          - text: >
              "About $0.11$, since Chebyshev assumes the least."
            feedback: >
              Assuming less makes a bound safer, not more accurate. The truth
              is about $0.0016$, seventy times below Chebyshev's number.
        feedback: >
          Report both bounds, say which is tighter, and say why: polynomial
          against exponential.
      - teach: >
          Said aloud: "Recentre to $\pm 1$, so $s$ is twice the head excess.
          Chebyshev: variance over $s$-squared. Chernoff: $e^{-s^{2}/(2n)}$.
          Near the mean they are comparable; out in the tail Chernoff wins by
          orders of magnitude."
  - node: quant-probability.inequalities.cauchy-schwarz-rv
    hook: >
      This is the inner-product inequality from linear algebra wearing a
      probability costume, and recognizing that connection is what tells
      you when to reach for it — anywhere a product of two random
      quantities needs bounding by their individual sizes.
    explanation: >
      The proof is a single clean trick: build the quadratic
      $q(t)=\mathbb{E}[(X-tY)^{2}]$ in the free variable $t$. Because it's
      an expectation of a square, $q(t)\ge0$ for every real $t$, no matter
      what $X$ and $Y$ are. Expanding gives an ordinary quadratic in $t$,
      $\mathbb{E}[Y^{2}]t^{2} - 2\mathbb{E}[XY]t + \mathbb{E}[X^{2}]$, and a
      quadratic that never dips below zero can't have two distinct real
      roots — its discriminant must be at most zero, and that discriminant
      condition, written out, is Cauchy–Schwarz.

      There's a geometric reading underneath the algebra: $tY$ ranges over
      every scalar multiple of $Y$ as $t$ varies, and $q(t)$ is minimized at
      the $t$ that makes $tY$ the closest multiple of $Y$ to $X$ in
      mean-square. The inequality says even the best such approximation
      leaves a nonnegative leftover, which caps how large $\mathbb{E}[XY]$
      can be relative to the two variables' own sizes.

      Equality is again the degenerate case: the quadratic touches zero
      only when $X$ is an exact multiple of $Y$ with probability $1$, so
      $\mathbb{E}[XY]$ reaches its ceiling only for perfectly proportional
      variables. Setting $Y=1$ specializes the whole inequality to
      $(\mathbb{E}[X])^{2}\le\mathbb{E}[X^{2}]$ — the same fact behind
      variance's nonnegativity — a hint that Cauchy–Schwarz is the more
      general engine behind several separate-looking facts.
    worked: >
      Let $X$ be $1$ or $2$ with equal probability, and let $Y=3-X$. Then
      $\mathbb{E}[XY]=0.5(1\cdot2)+0.5(2\cdot1)=2$, $\mathbb{E}[X^{2}]
      =0.5(1)+0.5(4)=2.5$, and $\mathbb{E}[Y^{2}]=0.5(4)+0.5(1)=2.5$.
      Cauchy–Schwarz claims $(\mathbb{E}[XY])^{2}\le\mathbb{E}[X^{2}]
      \mathbb{E}[Y^{2}]$: indeed $4\le2.5\times2.5=6.25$, with room to
      spare since $Y$ is an affine, not exact, multiple of $X$.
    interview: >
      "Bound $\mathbb{E}[XY]$ using only the second moments of $X$ and $Y$"
      is Cauchy–Schwarz, and naming the discriminant argument, rather than
      just citing the inequality, is what shows you can reconstruct it if a
      follow-up asks for the proof.
    pitfalls: >
      Forgetting the expectation-of-a-square step — why $q(t)\ge0$ for
      every $t$ in the first place — leaves the derivation incomplete if
      asked to justify it. Applying the inequality without checking
      $\mathbb{E}[X^{2}]$ and $\mathbb{E}[Y^{2}]$ are actually finite skips
      a real hypothesis.
    recap: >
      $(\mathbb{E}[XY])^{2}\le\mathbb{E}[X^{2}]\mathbb{E}[Y^{2}]$ falls out
      of $\mathbb{E}[(X-tY)^{2}]\ge0$ holding for every $t$, with equality
      exactly when $X$ and $Y$ are proportional.
    dialogue:
      - part: How big can a product's mean be?
        teach: >
          Two trading signals $X$ and $Y$. You know $\mathbb{E}[X^{2}] = 4$ and
          $\mathbb{E}[Y^{2}] = 9$, and nothing else — not their means, not how
          they move together. A strategy's average P&L is $\mathbb{E}[XY]$,
          and you want to know how large it could possibly be.
      - ask: >
          Try $Y = 1.5X$, which has $\mathbb{E}[Y^{2}] = 2.25 \times 4 = 9$ as
          required. What is $\mathbb{E}[XY]$?
        expects: "6"
        feedback: >
          $\mathbb{E}[XY] = 1.5\,\mathbb{E}[X^{2}] = 1.5 \times 4 = 6$.
      - ask: >
          Can some other pair with these second moments push $\mathbb{E}[XY]$
          above $6$?
        choices:
          - text: >
              Yes, up to $6.5$, since $xy \le (x^{2} + y^{2})/2$ for every pair
              of numbers.
            feedback: >
              That pointwise bound is true, so $\mathbb{E}[XY] \le 6.5$ is
              true — but it is not sharp. Rescale first:
              $xy = (\lambda x)(y/\lambda) \le (\lambda^{2}x^{2} +
              y^{2}/\lambda^{2})/2$, and the best $\lambda$ brings the ceiling
              down to $6$.
          - text: >
              Yes, without limit: nothing ties $X$ to $Y$.
            feedback: >
              The second moments tie them. $|XY| \le (X^{2} + Y^{2})/2$
              outcome by outcome already caps $\mathbb{E}[XY]$ at $6.5$.
          - text: >
              No: $6$ is the ceiling, reached by the proportional pair.
            correct: true
            feedback: >
              Right — the next step is to prove it.
        feedback: >
          The proportional pair is the best a pair can do. The proof is a
          one-line fact about quadratics.
      - reflect: >
          Look at $q(t) = \mathbb{E}[(X - tY)^{2}]$ as a function of a real
          number $t$. What do you know about $q(t)$ for every $t$, and what
          does that force on it as a quadratic in $t$?
        hint: >
          Expand the square inside the expectation.
        answer: >
          $q(t) \ge 0$ for every $t$, since it is the mean of a square.
          Expanded, $q(t) = \mathbb{E}[X^{2}] - 2t\,\mathbb{E}[XY] +
          t^{2}\,\mathbb{E}[Y^{2}]$, a quadratic that never dips below zero,
          so it cannot have two real roots: its discriminant
          $4(\mathbb{E}[XY])^{2} - 4\,\mathbb{E}[X^{2}]\mathbb{E}[Y^{2}]$ is
          at most $0$. Here that says $(\mathbb{E}[XY])^{2} \le 36$.
      - teach: >
          That is Cauchy–Schwarz for random variables: if both second moments
          are finite, $(\mathbb{E}[XY])^{2} \le \mathbb{E}[X^{2}]\,
          \mathbb{E}[Y^{2}]$. The pair $Y = 1.5X$ sat exactly on the ceiling
          of $6$, and the quadratic $q$ knows which pairs can.

      - part: The quadratic at its lowest point
        ask: >
          Suppose instead $\mathbb{E}[XY] = 5$, with the same second moments,
          so $q(t) = 4 - 10t + 9t^{2}$. What is the minimum value of $q$?
        expects: "11/9"
        tolerance: 0.001
        hint: >
          The minimum of $a - bt + ct^{2}$ is at $t = b/(2c)$.
        feedback: >
          At $t = 10/18 = 5/9$: $4 - 50/9 + 9 \cdot 25/81 = 4 - 25/9 = 11/9$.
          This is the mean-square error of the best multiple of $Y$ as a
          stand-in for $X$. Positive, so $X$ is not a multiple of $Y$ and
          $25 < 36$ with room to spare.
      - ask: >
          When is the minimum of $q$ exactly $0$?
        choices:
          - text: >
              When $X$ and $Y$ are independent.
            feedback: >
              Independent signals with mean $0$ have $\mathbb{E}[XY] = 0$, as
              far from the ceiling as possible. Independence is not what
              saturates the bound.
          - text: >
              When $X = t_0Y$ with probability $1$ for some constant $t_0$.
            correct: true
            feedback: >
              Right. $q(t_0) = 0$ says $X - t_0Y$ has mean square $0$, so it
              is $0$ with probability $1$.
          - text: >
              When $\mathbb{E}[X] = \mathbb{E}[Y]$.
            feedback: >
              Means do not enter the inequality at all; only second moments
              and the product do.
        feedback: >
          Equality is proportionality, nothing weaker.

      - part: Special cases and a broken hypothesis
        ask: >
          Set $Y = 1$. What does Cauchy–Schwarz say about $X$?
        choices:
          - text: >
              $\mathbb{E}[X] \le \mathbb{E}[X^{2}]$
            feedback: >
              False for $X = 1/2$ always: $1/2 > 1/4$. The squares are on the
              wrong side.
          - text: >
              $(\mathbb{E}[X])^{2} \le \mathbb{E}[X^{2}]$
            correct: true
            feedback: >
              Right: the variance is nonnegative, recovered from a different
              direction.
          - text: >
              $\mathbb{E}[X^{2}] \le (\mathbb{E}[X])^{2}$
            feedback: >
              Reversed. Take $X = \pm 1$ with equal probability: the left side
              is $1$ and the right side $0$.
        feedback: >
          $Y = 1$ makes $\mathbb{E}[XY] = \mathbb{E}[X]$ and
          $\mathbb{E}[Y^{2}] = 1$.
      - ask: >
          $X$ is uniform on $\{1, 2, 3\}$ and $Y = X + 1$. Compute
          $\mathbb{E}[XY]/\sqrt{\mathbb{E}[X^{2}]\,\mathbb{E}[Y^{2}]}$ to
          three decimal places.
        expects: "0.993"
        tolerance: 0.001
        feedback: >
          $\mathbb{E}[XY] = (2 + 6 + 12)/3 = 20/3$,
          $\mathbb{E}[X^{2}] = 14/3$, $\mathbb{E}[Y^{2}] = 29/3$, so the ratio
          is $20/\sqrt{406} \approx 0.993$. Close to $1$ because $X + 1$ is
          nearly a multiple of $X$ on $\{1, 2, 3\}$ — nearly, not exactly.
      - ask: >
          $\mathbb{E}[X^{2}] = 4$, but $\mathbb{E}[Y^{2}]$ is infinite. What
          does Cauchy–Schwarz say about $\mathbb{E}[XY]$?
        choices:
          - text: >
              That $|\mathbb{E}[XY]| \le 2$.
            feedback: >
              That would need $\mathbb{E}[Y^{2}] = 1$. With an infinite second
              moment the right side is infinite.
          - text: >
              Nothing: the right side is infinite, and $\mathbb{E}[XY]$ need
              not even exist.
            correct: true
            feedback: >
              Right. Finite second moments are what guarantee $XY$ is
              integrable in the first place.
          - text: >
              That $\mathbb{E}[XY]$ is infinite too.
            feedback: >
              Take $X = 0$: then $\mathbb{E}[XY] = 0$ whatever $Y$ does. The
              inequality simply stops speaking.
        feedback: >
          Check both second moments are finite before you quote it.
      - teach: >
          Said aloud: "$\mathbb{E}[(X - tY)^{2}] \ge 0$ for every $t$, so the
          discriminant is at most zero — that is Cauchy–Schwarz. Equality only
          for proportional variables." Reconstructing it beats reciting it.
  - node: quant-probability.inequalities.cs-covariance
    hook: >
      "Can a correlation be $1.3$" should trigger an instant no — this is
      the inequality that makes $[-1,1]$ a hard mathematical boundary, not
      a convention, and it's the cheapest sanity check on any reported
      covariance matrix.
    explanation: >
      Apply Cauchy–Schwarz not to $X$ and $Y$ directly but to the centred
      variables $X-\mu_X$ and $Y-\mu_Y$: their product's expectation is by
      definition $\operatorname{Cov}(X,Y)$, and their own second moments are
      by definition $\sigma_X^{2}$ and $\sigma_Y^{2}$. Cauchy–Schwarz then
      reads $(\operatorname{Cov}(X,Y))^{2}\le\sigma_X^{2}\sigma_Y^{2}$, and
      taking square roots gives $|\operatorname{Cov}(X,Y)|\le\sigma_X
      \sigma_Y$ directly — no new argument, just the right substitution
      into a fact already in hand.

      Dividing through by $\sigma_X\sigma_Y$ is exactly the definition of
      correlation, so the boundedness of $\rho$ in $[-1,1]$ isn't a separate
      fact about correlation — it's this one inequality, rescaled. Equality
      $|\rho|=1$ inherits its meaning from Cauchy–Schwarz's equality case:
      the centred variables must be exact multiples of each other, which
      unpacks to $Y=a+bX$ with probability $1$, an exact linear
      relationship, with the sign of $b$ matching the sign of $\rho$.

      Two consequences do real work at a desk. Since $\operatorname{Var}
      (X+Y)=\sigma_X^{2}+\sigma_Y^{2}+2\operatorname{Cov}(X,Y)\le\sigma_X^{2}
      +\sigma_Y^{2}+2\sigma_X\sigma_Y=(\sigma_X+\sigma_Y)^{2}$, a two-leg
      portfolio's volatility can never exceed the sum of the individual
      volatilities — combining risks can only help, never hurt, in this
      worst-case sense. And any reported correlation outside $[-1,1]$, or a
      covariance matrix implying one, is not a strange market phenomenon —
      it's an arithmetic error, full stop.
    worked: >
      A risk report claims $\sigma_X=4$, $\sigma_Y=9$, and
      $\operatorname{Cov}(X,Y)=40$. The bound requires
      $|\operatorname{Cov}(X,Y)|\le\sigma_X\sigma_Y=36$, but $40>36$ — the
      reported numbers are inconsistent and at least one of the three was
      computed wrong, without needing to know anything else about $X$ or
      $Y$.
    interview: >
      "Why can't correlation exceed $1$" is answered by naming
      Cauchy–Schwarz applied to the centred variables, not by citing it as
      a convention; a portfolio follow-up ("does diversifying always reduce
      risk") is answered by the $\sigma_{X+Y}\le\sigma_X+\sigma_Y$ triangle
      inequality that falls out immediately after.
    pitfalls: >
      Treating an out-of-range correlation as a modeling curiosity rather
      than an arithmetic red flag wastes time investigating an effect that
      doesn't exist. Assuming $|\rho|=1$ requires $Y=X$ exactly, rather than
      any affine relationship $Y=a+bX$, misses that a scaled or shifted
      linear relationship also saturates the bound.
    recap: >
      Cauchy–Schwarz applied to the centred variables gives
      $|\operatorname{Cov}(X,Y)|\le\sigma_X\sigma_Y$, which is exactly why
      $\rho\in[-1,1]$ and why a reported correlation outside that range is
      always an error.
    dialogue:
      - part: A report that cannot be right
        teach: >
          A risk system reports, for two books, $\sigma_X = 6$,
          $\sigma_Y = 10$ and $\operatorname{Cov}(X, Y) = 75$. Before anyone
          builds a hedge on these numbers, you are asked to sanity-check them.
      - ask: >
          What correlation do the three numbers imply?
        expects: "1.25"
        feedback: >
          $\rho = 75/(6 \times 10) = 75/60 = 1.25$.
      - ask: >
          What do you conclude?
        choices:
          - text: >
              The books are very strongly dependent — unusual, but possible.
            feedback: >
              No joint law of any kind has a correlation above $1$. The number
              is a symptom, not a finding about the books.
          - text: >
              At least one of the three numbers is wrong.
            correct: true
            feedback: >
              Right — typically a covariance computed on one window against
              standard deviations computed on another. The next step is to see
              why $1.25$ is impossible rather than merely odd.
          - text: >
              $Y$ moves more than proportionally with $X$, which is what
              $\rho > 1$ means.
            feedback: >
              Proportional movement, at any scale, gives $\rho = 1$ exactly.
              Scaling $Y$ by $10$ multiplies both the covariance and
              $\sigma_Y$ by $10$, leaving $\rho$ unchanged.
        feedback: >
          The ceiling $|\rho| \le 1$ is arithmetic, not empirical. The
          question is which inequality enforces it.
      - reflect: >
          Cauchy–Schwarz says $(\mathbb{E}[UV])^{2} \le
          \mathbb{E}[U^{2}]\,\mathbb{E}[V^{2}]$. Choose $U$ and $V$, built from
          $X$ and $Y$, so that the left side is the squared covariance and the
          right side is $\sigma_X^{2}\sigma_Y^{2}$.
        answer: >
          The centred variables, $U = X - \mu_X$ and $V = Y - \mu_Y$. Then
          $\mathbb{E}[UV] = \operatorname{Cov}(X, Y)$ by definition,
          $\mathbb{E}[U^{2}] = \sigma_X^{2}$ and
          $\mathbb{E}[V^{2}] = \sigma_Y^{2}$, so
          $(\operatorname{Cov}(X, Y))^{2} \le \sigma_X^{2}\sigma_Y^{2}$.
          Here that caps the covariance at $60$, and $75$ breaks it.
      - teach: >
          So $|\operatorname{Cov}(X, Y)| \le \sigma_X\sigma_Y$, and dividing
          by $\sigma_X\sigma_Y$ puts the correlation in $[-1, 1]$. The ends
          inherit Cauchy–Schwarz's equality case: the centred variables are
          proportional, which means $Y = a + bX$ with probability $1$, the
          sign of $b$ matching the sign of $\rho$.

      - part: The ends of the interval
        ask: >
          Let $Y = 5 - 2X$ with $\sigma_X = 6$. What is $\operatorname{Cov}(X, Y)$?
        expects: "-72"
        hint: >
          Constants drop out of a covariance; multiples come out.
        feedback: >
          $\operatorname{Cov}(X, 5 - 2X) = -2\operatorname{Var}(X) =
          -2 \times 36 = -72$.
      - ask: >
          And the correlation?
        expects: "-1"
        feedback: >
          $\sigma_Y = 2 \times 6 = 12$, so $\rho = -72/(6 \times 12) = -1$.
          An exact affine relationship with a negative slope sits at the
          bottom end.
      - ask: >
          $X$ is uniform on $\{-1, 0, 1\}$ and $Y = X^{2}$, so $Y$ is a
          function of $X$. Is $|\rho| = 1$?
        choices:
          - text: >
              Yes: $Y$ is completely determined by $X$.
            feedback: >
              Determined is not the same as linear.
              $\operatorname{Cov}(X, X^{2}) = \mathbb{E}[X^{3}] -
              \mathbb{E}[X]\,\mathbb{E}[X^{2}] = 0 - 0 = 0$.
          - text: >
              No: $\rho = 0$, because correlation measures only linear
              dependence.
            correct: true
            feedback: >
              Right. The ends need $Y = a + bX$; a parabola through
              symmetric points has no linear trend at all.
          - text: >
              It is undefined, since $Y$ is not random.
            feedback: >
              $Y$ is $0$ or $1$, random with variance $2/9$. The correlation
              is defined, and it is $0$.
        feedback: >
          Perfect dependence and perfect correlation are different things.

      - part: Two legs, then three
        ask: >
          Two books have $\sigma_X = 6$ and $\sigma_Y = 10$, correlation
          unknown. What is the largest possible standard deviation of
          $X + Y$?
        expects: "16"
        feedback: >
          $\operatorname{Var}(X + Y) = 36 + 100 + 2\operatorname{Cov}(X, Y)
          \le 136 + 2 \times 60 = 256$, so at most $16 = 6 + 10$. Combining
          two books never adds more risk than the sum of their volatilities.
      - ask: >
          Three assets $A$, $B$, $C$, each with variance $1$. A model reports
          correlations $\rho_{AB} = 0.9$, $\rho_{BC} = 0.9$ and
          $\rho_{AC} = -0.5$ — each inside $[-1, 1]$. Compute
          $\operatorname{Var}(A - B + C)$ from these numbers.
        expects: "-1.6"
        hint: >
          Three variances, plus twice each signed covariance:
          $-\rho_{AB} + \rho_{AC} - \rho_{BC}$.
        feedback: >
          $3 + 2(-0.9 - 0.5 - 0.9) = 3 - 4.6 = -1.6$. A variance cannot be
          negative.
      - ask: >
          What does the negative variance tell you?
        choices:
          - text: >
              The model is impossible: passing the pairwise check is
              necessary, not sufficient.
            correct: true
            feedback: >
              Right. If $A$ and $B$ move nearly together and so do $B$ and
              $C$, then $A$ and $C$ cannot move strongly apart. Every
              portfolio's variance must come out nonnegative.
          - text: >
              The variance formula fails for three or more assets.
            feedback: >
              The formula is just bilinearity of covariance, and it holds for
              any number of assets. The inputs are what fail.
          - text: >
              $A - B + C$ is a riskless portfolio.
            feedback: >
              Riskless would be variance $0$. A negative variance is not
              less than riskless; it is impossible.
        feedback: >
          The pairwise check $|\rho| \le 1$ is the cheapest test on a
          covariance matrix, and the first one to run — but not the last.
      - teach: >
          Said aloud: "Cauchy–Schwarz on the centred variables gives
          $|\operatorname{Cov}| \le \sigma_X\sigma_Y$, so $|\rho| \le 1$, with
          the ends only for exact linear relationships. A reported correlation
          outside that range is an arithmetic error, not a market event."
  - node: quant-probability.inequalities.paley-zygmund
    hook: >
      Markov only ever tells you a count can't be too big — this is the
      counterpart that proves a count is actually positive with decent
      probability, and it's the standard opening move whenever a proof
      needs to show "something exists" without constructing it.
    explanation: >
      Markov bounds a nonnegative quantity from above using only its mean;
      Paley–Zygmund bounds it from below, but needs a second ingredient —
      the second moment $\mathbb{E}[X^{2}]$ — because a mean alone says
      nothing about whether $X$ is usually near that mean or occasionally
      enormous and mostly zero. Controlling $\mathbb{E}[X^{2}]$ rules out
      the second, degenerate case: if the second moment stays comparable to
      the squared mean, $X$ can't be concentrating all its mass on a tiny,
      huge-valued sliver.

      The proof splits $\mathbb{E}[X]$ at the threshold
      $\theta\mathbb{E}[X]$ and bounds the piece above the threshold by
      Cauchy–Schwarz — the same $(\mathbb{E}[XY])^{2}\le\mathbb{E}[X^{2}]
      \mathbb{E}[Y^{2}]$ fact, applied to $X$ and the indicator of exceeding
      the threshold. At $\theta=0$ this collapses to the cleanest and
      most-used case, the second-moment method: $\Pr(X>0)\ge
      (\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}]$, needing no threshold at all,
      just "is a nonnegative count positive."

      This is the standard tool for showing a randomly constructed count is
      positive with non-vanishing probability — a random graph contains a
      certain subgraph, a randomized construction succeeds — precisely when
      the second moment doesn't blow up faster than the mean squared,
      typically because the terms making up $X$ are only weakly correlated.
    worked: >
      Let $X$ be the number of successes in $10$ independent
      $\text{Bernoulli}(0.3)$ trials, so $\mathbb{E}[X]=3$ and
      $\operatorname{Var}(X)=10(0.3)(0.7)=2.1$, giving $\mathbb{E}[X^{2}]
      =2.1+9=11.1$. The second-moment method gives $\Pr(X>0)\ge9/11.1
      \approx0.811$ — a valid, if not sharp, lower bound; the exact value
      $1-0.7^{10}\approx0.972$ confirms it without needing $X$'s full
      distribution.
    interview: >
      "Show this count is positive with probability at least such-and-such,
      without finding its distribution" is the second-moment method — quote
      $\Pr(X>0)\ge(\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}]$ and note it needs
      only two moments, the same information Chebyshev needs, but pointed
      at existence rather than concentration.
    pitfalls: >
      Applying this when $\mathbb{E}[X^{2}]$ is not actually comparable to
      $(\mathbb{E}[X])^{2}$ (a count with high variance from rare huge
      outliers) gives a vacuous or unusable bound. Confusing this
      lower-tail tool with Markov's upper-tail role treats two tools that
      answer opposite questions as interchangeable.
    recap: >
      Paley–Zygmund lower-bounds $\Pr(X>0)$ by $(\mathbb{E}[X])^{2}/
      \mathbb{E}[X^{2}]$, the standard second-moment method for proving a
      nonnegative count is positive without ever finding its distribution.
    dialogue:
      - part: Is anything there at all?
        teach: >
          A screen runs over the market each morning and flags $X$ stocks. On
          average it flags $2$. The desk wants a promise in the other direction
          from usual: that on a good share of mornings the screen flags at
          least one stock.
      - ask: >
          What does Markov give you about $\Pr(X \ge 1)$?
        choices:
          - text: >
              $\Pr(X \ge 1) \ge 1/2$, half the mean.
            feedback: >
              Markov never gives a lower bound. It caps how often a
              nonnegative variable is large; it says nothing about how often
              it is positive.
          - text: >
              Only $\Pr(X \ge 1) \le 2$: an upper bound, and an empty one.
            correct: true
            feedback: >
              Right. The desk wants a floor, and Markov only builds ceilings.
          - text: >
              $\Pr(X \ge 1) = 1$, since the average is above $1$.
            feedback: >
              An average of $2$ is compatible with most mornings flagging
              nothing, as the next question shows.
        feedback: >
          A floor on $\Pr(X > 0)$ needs more than the mean.
      - ask: >
          Here is a law with mean $2$: $X = 200$ with probability $1/100$, and
          $0$ otherwise. What is $\Pr(X > 0)$?
        expects: "1/100"
        feedback: >
          $1/100$. The mean is $200/100 = 2$, yet ninety-nine mornings in a
          hundred flag nothing. The mean alone allows any floor down to
          $0$.
      - ask: >
          What is $\mathbb{E}[X^{2}]$ for that law?
        expects: "400"
        feedback: >
          $200^{2}/100 = 400$, against $(\mathbb{E}[X])^{2} = 4$. The spike
          that hides the mean in a rare morning shows up as a huge second
          moment.
      - reflect: >
          So a small second moment should rule the spike out. Write
          $\mathbb{E}[X] = \mathbb{E}[X\,\mathbf{1}\{X > 0\}]$, which holds
          because $X \ge 0$. Bound the right side with Cauchy–Schwarz and see
          what comes out about $\Pr(X > 0)$.
        hint: >
          Cauchy–Schwarz on the product of $X$ and the indicator; the
          indicator squared is itself.
        answer: >
          $\mathbb{E}[X\,\mathbf{1}\{X > 0\}] \le
          \sqrt{\mathbb{E}[X^{2}]\,\mathbb{E}[\mathbf{1}\{X > 0\}^{2}]} =
          \sqrt{\mathbb{E}[X^{2}]\Pr(X > 0)}$. Squaring,
          $(\mathbb{E}[X])^{2} \le \mathbb{E}[X^{2}]\Pr(X > 0)$, so
          $\Pr(X > 0) \ge (\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}]$. A second
          moment close to the squared mean forces $X$ to be positive often.
      - teach: >
          That is the second-moment method, the $\theta = 0$ case of
          Paley–Zygmund. The general form aims above zero: for
          $0 \le \theta < 1$, split $\mathbb{E}[X]$ at $\theta\,\mathbb{E}[X]$,
          bound the upper piece the same way, and get
          $\Pr(X > \theta\,\mathbb{E}[X]) \ge
          (1 - \theta)^{2}(\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}]$.
      - ask: >
          The screen is retuned: mean $2$, variance $1$. What floor does the
          second-moment method put on $\Pr(X \ge 1)$?
        expects: "4/5"
        hint: >
          The formula wants $\mathbb{E}[X^{2}]$, not the variance.
        feedback: >
          $\mathbb{E}[X^{2}] = 1 + 2^{2} = 5$, so the floor is $4/5$. For a
          count, $X > 0$ and $X \ge 1$ are the same event. Plugging in the
          variance itself would give $4$, an impossible "probability".

      - part: Aiming above zero
        ask: >
          A strategy's monthly profit $X \ge 0$ has $\mathbb{E}[X] = 3$ and
          $\mathbb{E}[X^{2}] = 15$. Use Paley–Zygmund to put a floor on
          $\Pr(X > 1)$.
        expects: "4/15"
        tolerance: 0.0005
        hint: >
          Which $\theta$ makes $\theta\,\mathbb{E}[X] = 1$?
        feedback: >
          $\theta = 1/3$, so the floor is
          $(2/3)^{2} \times 9/15 = (4/9)(3/5) = 4/15 \approx 0.27$. Without
          the $(1 - \theta)^{2}$ you would get $9/15$, which is the floor for
          the larger event $X > 0$.
      - ask: >
          Why does the floor fall as $\theta$ rises?
        choices:
          - text: >
              Because the event $X > \theta\,\mathbb{E}[X]$ shrinks as the
              threshold rises, so its floor cannot grow.
            correct: true
            feedback: >
              Right. A higher bar is cleared less often, and
              $(1 - \theta)^{2}$ records how much less the argument can
              promise.
          - text: >
              Because the second moment grows with $\theta$.
            feedback: >
              $\mathbb{E}[X^{2}]$ is a fixed number; $\theta$ is your choice
              of threshold, not a property of $X$.
          - text: >
              It does not: the floor is the same for every $\theta$.
            feedback: >
              At $\theta = 0$ the floor here is $9/15 = 0.6$, at
              $\theta = 1/3$ it is $4/15$, and as $\theta \to 1$ it goes to
              $0$.
        feedback: >
          At $\theta = 1$ the method says nothing — no lower bound can promise
          a variable exceeds its own mean.

      - part: When the second moment runs away
        ask: >
          A count of rare signals has $\mathbb{E}[X] = 1$ but
          $\mathbb{E}[X^{2}] = 50$. What does the second-moment method give,
          and what is it telling you?
        choices:
          - text: >
              A floor of $1/50$: weak, because the signals arrive in
              clusters — most mornings none, some mornings many.
            correct: true
            feedback: >
              Right. A second moment far above the squared mean is the
              signature of the spiky law, and the method honestly reports how
              little it can promise.
          - text: >
              A floor of $1/50$, so the count is positive about $2\%$ of the
              time.
            feedback: >
              It is a floor, not an estimate. The count could be positive far
              more often; the method only guarantees $1/50$.
          - text: >
              A floor of $1$, since the mean is $1$.
            feedback: >
              The floor is $(\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}] = 1/50$. A
              mean of $1$ promises nothing about how often $X$ is positive.
        feedback: >
          The method works when the second moment stays within a constant
          factor of the squared mean — typically when the pieces of the count
          are only weakly correlated.
      - ask: >
          Can the second-moment floor $(\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}]$
          ever exceed $1$?
        choices:
          - text: >
              Yes, when the variance is small.
            feedback: >
              Small variance pushes the ratio toward $1$, never past it.
          - text: >
              No: $(\mathbb{E}[X])^{2} \le \mathbb{E}[X^{2}]$, which is
              Cauchy–Schwarz with $Y = 1$; it equals $1$ only for a constant
              $X$.
            correct: true
            feedback: >
              Right. The bound is $1$ exactly when $X$ never varies, and then
              a positive constant is positive with probability $1$.
          - text: >
              Yes, for counts with mean above $1$.
            feedback: >
              The ratio is scale-free: doubling $X$ multiplies top and bottom
              by $4$. Its size depends on spread, not on the mean.
        feedback: >
          The floor measures how concentrated $X$ is: $1$ for a constant,
          near $0$ for a spike.
      - teach: >
          Said aloud: "Markov bounds a count from above; to show it is
          positive, use the second moment:
          $\Pr(X > 0) \ge (\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}]$, by
          Cauchy–Schwarz on $X$ times its indicator." Name both moments, and
          check the second is not running away.
  - node: quant-probability.inequalities.choosing-a-bound
    hook: >
      The actual skill being tested at the end of an inequalities question
      is rarely the algebra — it's recognizing which hypothesis you've been
      handed and reaching for the bound calibrated to exactly that much
      information, no more and no less.
    explanation: >
      Every bound in this unit trades a stronger hypothesis for a sharper
      conclusion, and they nest: a mean alone (Markov) is the weakest input
      and gives the weakest, but universally valid, output; add a variance
      (Chebyshev) and the bound sharpens to $1/k^{2}$ decay; add the full
      moment generating function (Chernoff) and it sharpens again to
      exponential decay. Naming which rung of that ladder a problem has
      handed you — not just picking a formula — is what the question is
      actually testing.

      Two of the tools solve a different kind of problem entirely, not a
      stronger version of the same one. Jensen answers "can I move this
      function inside the expectation" — a question about a single
      nonlinear transformation, not a tail probability — and Cauchy–Schwarz
      answers "how large can a product or covariance be," a question about
      two variables together rather than the spread of one. The union
      bound is the odd one out in the other direction: it needs no moments
      at all, only a list of events, and it degrades gracefully to
      uselessness rather than becoming wrong once its one condition (the
      sum staying under $1$) fails.

      In practice the fastest read is to ask what you were given before
      asking what's being asked: a bare mean points at Markov, a mean and
      variance at Chebyshev or the one-sided version depending on
      sidedness, an mgf or a sum of independent bounded pieces at Chernoff,
      an unspecified list of bad events at the union bound, a nonlinear
      function wrapped around $X$ at Jensen, and a product or a covariance
      at Cauchy–Schwarz. Stating that reasoning out loud before writing a
      single symbol is the part being graded.
    interview: >
      Interviewers deliberately under-specify these questions to see
      whether you ask "what do I actually know here" before reaching for a
      formula — naming the available hypothesis out loud, then the matching
      bound, is worth more than fast but mismatched algebra.
    pitfalls: >
      Reaching for Chebyshev on a one-sided question instead of its
      one-sided form, or halving a two-sided bound, understates a one-sided
      risk instead of bounding it correctly. Defaulting to Chernoff
      whenever a bound is needed, even when only a mean is available,
      invents information (a moment generating function) the problem never
      supplied.
    recap: >
      Match the bound to the hypothesis you were actually given — mean,
      variance, mgf, or a bare list of events — since each tool trades a
      specific extra assumption for a specific sharper guarantee.
    dialogue:
      - part: One quantity, more information each time
        teach: >
          A desk logs trade errors, and $X$ is the count in a month. The
          interviewer will tell you more about $X$ in stages and, at each
          stage, ask for the best ceiling on $\Pr(X \ge 15)$ that the
          information supports.
      - ask: >
          Stage one: $X \ge 0$ with mean $5$, nothing else. Your ceiling?
        expects: "1/3"
        tolerance: 0.0005
        feedback: >
          Only a mean and nonnegativity: Markov, $5/15 = 1/3$. Say it is loose
          as you say it.
      - ask: >
          Stage two: the variance is $4.75$ as well, with no shape given. The
          best one-sided ceiling two moments allow?
        expects: "0.0453"
        tolerance: 0.0005
        hint: >
          One tail, so not plain Chebyshev. Measure $t$ from the mean.
        feedback: >
          Cantelli with $t = 10$: $4.75/(4.75 + 100) \approx 0.0453$.
          Chebyshev's two-sided $4.75/100 = 0.0475$ is valid but pays for a
          lower tail nobody asked about. One more number cut the ceiling by a
          factor of seven.
      - ask: >
          Stage three: $X$ is the sum of $100$ independent daily indicators,
          each $1$ with probability $0.05$. What should you predict?
        choices:
          - text: >
              Nothing new: the mean and variance already used everything.
            feedback: >
              Independence and the exact daily law hand you the moment
              generating function, which two moments never see.
          - text: >
              Chernoff now applies, and the ceiling should drop by a large
              factor, because the mgf of a sum of independent pieces
              factorises.
            correct: true
            feedback: >
              Right. Optimized, it gives about $9 \times 10^{-4}$ — some fifty
              times below Cantelli. The exact tail is about
              $1.4 \times 10^{-4}$.
          - text: >
              The union bound over the $100$ days.
            feedback: >
              That bounds "some day has an error", which has nothing to do
              with fifteen errors in total — and its sum, $100 \times 0.05 =
              5$, is vacuous anyway.
        feedback: >
          Each new piece of information bought a sharper tool: $1/3$, then
          $0.045$, then $0.0009$.
      - reflect: >
          Look back at the three stages. State the pattern: what did each
          piece of information buy, and what goes wrong if you use a tool
          whose input you were never given?
        answer: >
          A mean buys Markov's $1/k$; a variance buys Chebyshev's $1/k^{2}$,
          or Cantelli for one tail; a moment generating function, usually via
          independence, buys Chernoff's exponential decay. Each rung is
          sharper and needs more. Using a tool beyond your information is not
          bold, it is wrong: Chernoff with an invented mgf gives a number that
          may be false, and the interviewer is grading whether you noticed.
      - teach: >
          So pick the bound by what you were given. Mean and $X \ge 0$:
          Markov. Mean and variance: Chebyshev, or Cantelli for one tail. A
          sum of independent bounded pieces: Chernoff. A list of bad events
          with unknown overlap: the union bound. A nonlinear function outside
          an expectation: Jensen. A product or a covariance: Cauchy–Schwarz.

      - part: Questions that are not tail bounds
        ask: >
          Twelve months, each with $\Pr(X \ge 15) \le 0.001$, and the months
          may well be dependent. Ceiling on the chance that some month in the
          year hits $15$?
        expects: "0.012"
        feedback: >
          A list of bad events with unknown overlap: union bound,
          $12 \times 0.001 = 0.012$.
      - ask: >
          The desk's cost per error is a positive random $C$, and the planner
          uses $1/\mathbb{E}[C]$ in place of $\mathbb{E}[1/C]$. Which tool
          tells you the direction of the error?
        choices:
          - text: >
              Chebyshev, on the variance of $C$.
            feedback: >
              Chebyshev bounds how far $C$ strays from its mean; it says
              nothing about moving $1/x$ through an expectation.
          - text: >
              Jensen: $1/x$ is convex for $x > 0$, so the planner's number is
              too small.
            correct: true
            feedback: >
              Right. A function outside an expectation is Jensen's question,
              and the curvature gives the sign for free.
          - text: >
              Cauchy–Schwarz, since $C \cdot (1/C) = 1$.
            feedback: >
              Cauchy–Schwarz on $\sqrt{C}$ and $1/\sqrt{C}$ does give
              $\mathbb{E}[C]\,\mathbb{E}[1/C] \ge 1$, the same direction — but
              Jensen is the direct reading, and the one an interviewer expects.
        feedback: >
          Not every question in this unit is a tail bound. Name the kind of
          question before the tool.
      - ask: >
          Two desks' monthly error counts have standard deviations $2$ and
          $3$, correlation unknown. What is the largest possible standard
          deviation of the combined count?
        expects: "5"
        feedback: >
          A covariance with nothing known: Cauchy–Schwarz caps it at
          $2 \times 3 = 6$, so the variance is at most $4 + 9 + 12 = 25$ and
          the standard deviation at most $5$.

      - part: When the instinct misleads
        ask: >
          New information: a monthly P&L is *symmetric* about its mean $0$,
          with standard deviation $3$. Give the best ceiling on the chance
          that the P&L is $6$ or more.
        expects: "1/8"
        tolerance: 0.0005
        hint: >
          The usual warning against halving Chebyshev assumed no symmetry.
        feedback: >
          With symmetry the two tails are equal, so halving is valid:
          $(9/36)/2 = 1/8$. Cantelli's $9/(9 + 36) = 1/5$ is still true but
          weaker — it was built for a law that might be skewed. Matching the
          tool to the information cuts both ways.
      - teach: >
          Said aloud, before any algebra: "Here is what I was given; that
          calls for this bound; here is the number, and it is a ceiling."
          Naming the hypothesis is the part being graded.
