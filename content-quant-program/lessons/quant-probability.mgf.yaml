unit: quant-probability.mgf
opening: >
  Generating functions and transforms replace the awkward algebra of
  convolutions and joint sums with algebra you already know: multiplying
  polynomials and power series. This unit opens with the probability
  generating function for nonnegative-integer counts — defining
  $\mathbb{E}[s^{X}]$, reading probabilities and moments off its derivatives,
  and multiplying PGFs to handle sums of independent counts, including the
  classic loaded-dice and Sicherman-dice puzzles and compound sums built from
  a random number of terms. The second half repeats the same arc for the
  moment generating function $\mathbb{E}[e^{tX}]$, which covers any
  real-valued variable: moments from derivatives at $0$, an affine scaling
  rule that generates a whole family from one computation, products for
  independent sums, and the standard table of named laws. The unit closes on
  the two facts that make a transform a complete identification method rather
  than a computational shortcut — uniqueness, and the boundary cases where the
  MGF's convenient assumptions genuinely fail and a repair is needed.
lessons:
  - node: quant-probability.mgf.pgf
    hook: >
      Every technique in this chapter — extracting a probability, reading off
      a moment, multiplying two distributions together — starts from treating
      the pmf as coefficients of a function, so the encoding itself is the one
      idea worth internalizing first.
    explanation: >
      You already know LOTUS lets you compute $\mathbb{E}[g(X)]$ by averaging
      $g(x)$ against $X$'s pmf, for any $g$ you choose. Pick $g(x) = s^{x}$
      for a formal placeholder $s$, and the LOTUS sum becomes
      $\sum_k p_k s^{k}$ — a power series whose $k$-th coefficient is exactly
      $\Pr(X=k)$. Nothing about the distribution is discarded; the whole pmf
      has been repacked as a single function of one dummy variable.

      The repacking earns its keep later in this chapter: questions about
      probabilities and moments become questions about a function's Taylor
      coefficients and derivatives, and — the real payoff — the pmf of a sum
      of independent counts becomes an ordinary product of two PGFs instead of
      a convolution sum.

      The two structural facts worth checking first are $G_X(0)=p_0$, since
      only the constant term survives at $s=0$, and $G_X(1)=\sum_k p_k = 1$,
      the pmf's own normalization restated. Both come free from the
      definition and catch a mistyped PGF instantly. Convergence is never in
      doubt inside $(-1,1)$: coefficients are probabilities, bounded by $1$
      and summing to $1$, which forces the radius of convergence to be at
      least $1$.
    worked: >
      A four-sided die is loaded so that face $k$ comes up with probability
      $k/10$ for $k=1,2,3,4$ — that is, $0.1, 0.2, 0.3, 0.4$. Its PGF is
      $G(s) = 0.1s + 0.2s^{2} + 0.3s^{3} + 0.4s^{4}$. Checking the two free
      facts: $G(0) = 0$, matching $\Pr(X=0)=0$ since the die never shows $0$,
      and $G(1) = 0.1+0.2+0.3+0.4 = 1$, confirming the loading is a genuine
      probability distribution.
    interview: >
      "Write down the PGF of this variable" is really asking whether you see
      the definition as bookkeeping, not computation — state
      $G_X(s)=\mathbb{E}[s^{X}]$, expand it as $\sum_k p_k s^{k}$, and check
      $G(1)=1$ out loud before moving on. A common follow-up asks for
      $G_X(0)$ to see whether you know it's just $p_0$ without expanding
      anything.
    pitfalls: >
      Applying the PGF definition to a variable that isn't nonnegative-integer
      valued (continuous, or able to go negative) — it simply isn't defined
      there. Treating $s$ as if it must itself be a probability, rather than a
      free variable ranging at least over $(-1,1)$.
    recap: >
      The PGF $G_X(s)=\mathbb{E}[s^{X}]=\sum_k p_k s^{k}$ is nothing but the
      pmf written as a power series, with $G(0)=p_0$ and $G(1)=1$ as its two
      built-in checks.
    steps:
      - teach: >
          Pick $g(x) = s^{x}$ inside LOTUS and $\mathbb{E}[g(X)]$ becomes
          $\sum_k p_k s^{k}$ — the pmf repacked as coefficients of a power
          series in a placeholder variable $s$. Nothing is discarded; it is
          the same information in a different container.
      - teach: >
          $G_X(s) = \mathbb{E}[s^{X}] = \sum_{k \ge 0} p_k s^{k}$. Two checks
          come free from the definition: $G_X(0) = p_0$, since only the
          constant term survives at $s = 0$, and $G_X(1) = \sum_k p_k = 1$,
          the pmf's own normalization restated.
      - teach: >
          A spinner lands on $1$, $2$, or $3$ with probabilities $0.5$,
          $0.3$, $0.2$. Reading the probabilities straight off as
          coefficients gives $G(s) = 0.5s + 0.3s^{2} + 0.2s^{3}$.
      - ask: >
          For that spinner, what is $G(0)$?
        expects: "0"
        hint: >
          Only the constant term of $G$ survives at $s = 0$ — does this $G$
          have one?
        feedback: >
          $G(0) = 0$: every term of $0.5s + 0.3s^{2} + 0.2s^{3}$ carries a
          factor of $s$, matching $\Pr(X=0) = 0$ since the spinner never
          shows $0$.
      - teach: >
          Convergence is never in doubt on $(-1,1)$: coefficients are
          probabilities, bounded by $1$ and summing to $1$, which forces the
          radius of convergence to be at least $1$ for any genuine PGF.
      - ask: >
          In general, for any valid PGF at all, what must $G_X(1)$ equal?
        expects: "1"
        hint: >
          Substitute $s=1$ into $\sum_k p_k s^{k}$ and use what a pmf must
          satisfy.
        feedback: >
          $G_X(1) = \sum_k p_k \cdot 1^{k} = \sum_k p_k = 1$ always — it is
          the normalization of the pmf, not a fact about the particular
          distribution.
      - ask: >
          Which of these could not be a genuine PGF of some distribution on
          $\{0,1,2,\dots\}$?
        choices:
          - text: >
              $0.4 + 0.6s$
            feedback: >
              This is valid — nonnegative coefficients summing to $1$, the
              PGF of a Bernoulli$(0.6)$.
          - text: >
              $0.3 + 0.3s + 0.3s^{2}$
            correct: true
            feedback: >
              These coefficients sum to $0.9$, not $1$, so $G(1) = 0.9 \ne
              1$ — no pmf produces this.
          - text: >
              $s^{5}$
            feedback: >
              This is valid — a point mass at $5$: $G(0)=0$ and $G(1)=1$,
              both checks pass.
        feedback: >
          $G(1)=1$ is non-negotiable: it is the pmf's total probability
          restated, so any candidate PGF failing it is disqualified on
          sight.
      - teach: >
          The PGF only applies to nonnegative-integer-valued $X$ — for a
          continuous variable, or one that can go negative, $s^{X}$ is not
          even defined, so writing one down for such a variable is a category
          error, not a computation to fix.
      - teach: >
          $G_X(0)=p_0$ and $G_X(1)=1$ are the two checks worth running on any
          candidate PGF before trusting it — both come free from the
          definition and catch a mistyped one instantly.

  - node: quant-probability.mgf.pgf-probabilities
    hook: >
      In practice you never differentiate a PGF to extract a probability —
      you expand it algebraically and read the term off — but knowing why the
      two routes agree is what lets you invent the parity shortcut on the
      spot instead of memorizing it.
    explanation: >
      Coefficient extraction is nothing but Taylor's theorem: the coefficient
      of $s^{k}$ in $G_X(s)=\sum_j p_j s^{j}$ is retrieved by differentiating
      $k$ times and dividing by $k!$, since every other term either vanishes
      at $s=0$ or still carries a leftover factor of $s$. Expanding
      algebraically and reading off the coefficient does the identical job
      with less bookkeeping, which is why that's the default move.

      The parity shortcut is worth deriving once so it never needs to be
      looked up. Evaluate the series at $s=-1$: $G_X(-1)=\sum_k p_k(-1)^{k}$
      adds every even-$k$ probability and subtracts every odd-$k$ one, so
      $G_X(-1) = \Pr(X\text{ even}) - \Pr(X\text{ odd})$. Since
      $G_X(1)=1=\Pr(X\text{ even})+\Pr(X\text{ odd})$ as well, adding the two
      equations and dividing by $2$ isolates $\Pr(X\text{ even})$ with no
      further work.

      Both shortcuts — value at $0$, and the parity split at $-1$ — turn a
      question about the whole pmf into one substitution, which is faster
      than expanding a series just to read a single term.
    worked: >
      Flip a coin with $\Pr(\text{heads})=1/3$ four times and let $X$ count
      the heads: $G(s) = (2/3+s/3)^{4}$. Expanding via the binomial theorem,
      $\Pr(X=2) = \binom{4}{2}(1/3)^{2}(2/3)^{2} = 6\cdot(1/9)(4/9) = 24/81 =
      8/27$. For the parity split, $G(-1) = (2/3-1/3)^{4} = (1/3)^{4} = 1/81$,
      so $\Pr(X\text{ even}) = (1 + 1/81)/2 = 41/81 \approx 0.506$.
    interview: >
      "Given this PGF, what's $\Pr(X=k)$" wants an algebraic expansion, not a
      literal derivative computed term by term. A sharper follow-up — "is $X$
      more likely to be even or odd" — is answered instantly by the parity
      trick without touching the pmf at all.
    pitfalls: >
      Forgetting the $k!$ in the coefficient formula is an easy
      off-by-a-factorial error. Differentiating at $s=1$ or $s=-1$ as if that
      were guaranteed as safely as at points strictly inside $(-1,1)$ —
      $G_X$ is only promised to be continuous, not differentiable, at the
      endpoints.
    recap: >
      Coefficients of $G_X$ are literally the probabilities, extracted by
      Taylor's formula or, faster, by matching an algebraic expansion, and
      $(G(1)+G(-1))/2$ hands you the even/odd split for free.
    steps:
      - teach: >
          In practice you never differentiate a PGF to extract a
          probability — you expand it algebraically and read the term off.
          Knowing why the two routes agree is what lets you invent a
          shortcut on the spot instead of memorizing one.
      - teach: >
          Taylor's theorem says the coefficient of $s^{k}$ in $G_X(s)$ is
          $G_X^{(k)}(0)/k!$, since every other term either vanishes at $s=0$
          or still carries a leftover factor of $s$. Expanding and matching
          coefficients does the identical job with less bookkeeping.
      - teach: >
          Flip a coin with $\Pr(\text{heads})=1/4$ three times and let $X$
          count the heads: $G(s) = (3/4+s/4)^{3} = (27+27s+9s^{2}+s^{3})/64$.
      - ask: >
          Reading the coefficient off that expansion, what is $\Pr(X=2)$?
        expects: "9/64"
        hint: >
          It's the coefficient of $s^{2}$ in $(27+27s+9s^{2}+s^{3})/64$.
        feedback: >
          $9/64$, matching the binomial check directly:
          $\binom{3}{2}(1/4)^{2}(3/4) = 3(1/16)(3/4) = 9/64$.
      - teach: >
          The parity shortcut comes from evaluating at $s=-1$:
          $G_X(-1)=\Pr(X\text{ even})-\Pr(X\text{ odd})$, and adding the
          identity $G_X(1)=\Pr(X\text{ even})+\Pr(X\text{ odd})=1$ isolates
          $\Pr(X\text{ even}) = (1+G_X(-1))/2$ with no further work.
      - ask: >
          For that same $G$, what is $\Pr(X\text{ is even})$?
        expects: "9/16"
        hint: >
          First find $G(-1)$, then use $(1+G(-1))/2$.
        feedback: >
          $G(-1)=(3/4-1/4)^{3}=(1/2)^{3}=1/8$, so
          $\Pr(X\text{ even})=(1+1/8)/2=9/16$ — matching $\Pr(X{=}0)+\Pr(X{=}2)
          = 27/64+9/64 = 36/64 = 9/16$ directly.
      - ask: >
          Which mistake produces an off-by-a-factor error when extracting
          $p_{2}$ from $G_X$ by differentiating?
        choices:
          - text: >
              Forgetting to divide by $2!$ after differentiating twice
            correct: true
            feedback: >
              $G_X''(0)$ alone is $2p_2$, not $p_2$ — the $k!$ in Taylor's
              formula is exactly what's missing.
          - text: >
              Evaluating at $s=-1$ instead of $s=0$
            feedback: >
              $s=-1$ is the parity shortcut, a different computation
              entirely, not a mistaken substitution for coefficient
              extraction.
          - text: >
              Using $s=1$ instead of $s=0$
            feedback: >
              $s=1$ is where moments are read off, a separate technique
              covered next — not where coefficients live.
        feedback: >
          The $k!$ divisor is the one easy slip: differentiating $k$ times
          leaves a leftover factor of $k!$ that must be divided out to
          recover $p_k$ itself.
      - teach: >
          "Given this PGF, what's $\Pr(X=k)$" wants an algebraic expansion,
          not a literal derivative computed term by term — and "is $X$ more
          likely even or odd" is answered instantly by the parity trick
          without touching the pmf at all.

  - node: quant-probability.mgf.pgf-factorial-moments
    hook: >
      Two derivatives of a PGF at a single point replace two separate sums
      for $\mathbb{E}[X]$ and $\mathbb{E}[X^{2}]$ — the entire reason this
      transform is worth building in the first place.
    explanation: >
      Differentiate $G_X(s)=\sum_k p_k s^{k}$ once: $G_X'(s) = \sum_k k\,p_k
      s^{k-1}$, and every term still carries a leftover power of $s$ except
      the $k=1$ term. Setting $s=1$ removes that obstacle entirely, leaving
      $\sum_k k\,p_k = \mathbb{E}[X]$ — which is exactly why this derivative
      is read at $s=1$, not $s=0$: only there does every $s^{k-1}$ collapse to
      $1$ regardless of $k$.

      Differentiate again: $G_X''(s) = \sum_k k(k-1)\,p_k s^{k-2}$, and at
      $s=1$ this is $\sum_k k(k-1)\,p_k = \mathbb{E}[X(X-1)]$, the first
      correction to the raw second moment. Each further derivative at $s=1$
      peels off one more factor of the falling factorial, so the $r$-th
      derivative leaves $\mathbb{E}[X(X-1)\cdots(X-r+1)]$.

      Since $\mathbb{E}[X^{2}] = \mathbb{E}[X(X-1)] + \mathbb{E}[X]$,
      substituting gives $\operatorname{Var}(X) = G_X''(1) + G_X'(1) -
      (G_X'(1))^{2}$ — two derivatives at one point beat computing
      $\mathbb{E}[X^{2}]$ and $\mathbb{E}[X]$ as two separate sums.
    worked: >
      Let $X$ take values $0,1,2$ with probabilities $0.5, 0.3, 0.2$:
      $G(s)=0.5+0.3s+0.2s^{2}$. Then $G'(s)=0.3+0.4s$ gives $G'(1)=0.7 =
      \mathbb{E}[X]$, and $G''(s)=0.4$ gives $G''(1)=0.4 = \mathbb{E}[X(X-1)]$.
      So $\operatorname{Var}(X) = 0.4 + 0.7 - 0.7^{2} = 1.1 - 0.49 = 0.61$,
      matching a direct check: $\mathbb{E}[X^{2}]=1.1$ and $1.1-0.7^{2}=0.61$.
    interview: >
      "Find the mean and variance from this PGF" wants two derivatives
      evaluated at $s=1$, not an attempt to expand the full series and sum
      directly. Expect to be asked why $s=1$ rather than $s=0$ is used here.
    pitfalls: >
      Evaluating these derivatives at $s=0$ out of habit from coefficient
      extraction, instead of $s=1$. Computing
      $\operatorname{Var}(X)=G''(1)-(G'(1))^{2}$ and dropping the $+G'(1)$
      correction term that converts the factorial moment back to a raw one.
    recap: >
      One derivative of $G_X$ at $s=1$ gives the mean, two give
      $\mathbb{E}[X(X-1)]$, and combining both gives variance in a single
      line with no separate sums.
    steps:
      - teach: >
          Two derivatives of a PGF at a single point replace two separate
          sums for $\mathbb{E}[X]$ and $\mathbb{E}[X^{2}]$ — the entire
          reason this transform earns its keep.
      - teach: >
          $G_X'(s)=\sum_k k p_k s^{k-1}$, and at $s=1$ every leftover power
          of $s$ collapses to $1$ regardless of $k$, leaving
          $G_X'(1)=\mathbb{E}[X]$. Differentiating again and setting $s=1$
          leaves $G_X''(1)=\mathbb{E}[X(X-1)]$ — that's why the evaluation
          point is $s=1$, not $s=0$.
      - teach: >
          Let $X$ take values $0,1,2$ with probabilities $0.2, 0.5, 0.3$:
          $G(s) = 0.2+0.5s+0.3s^{2}$.
      - ask: >
          What is $G'(1) = \mathbb{E}[X]$ for that distribution?
        expects: "1.1"
        hint: >
          Differentiate $G(s)$ once, then set $s=1$.
        feedback: >
          $G'(s)=0.5+0.6s$, so $G'(1)=1.1$ — matching the direct sum
          $0(0.2)+1(0.5)+2(0.3)=1.1$.
      - teach: >
          Since $\mathbb{E}[X^{2}] = \mathbb{E}[X(X-1)]+\mathbb{E}[X]$,
          substituting gives $\operatorname{Var}(X) = G_X''(1)+G_X'(1) -
          (G_X'(1))^{2}$ — two derivatives at one point beat computing
          $\mathbb{E}[X^{2}]$ and $\mathbb{E}[X]$ separately.
      - ask: >
          What is $G''(1) = \mathbb{E}[X(X-1)]$ for the same distribution?
        expects: "0.6"
        hint: >
          $G'(s)=0.5+0.6s$ is linear, so its derivative is constant.
        feedback: >
          $G''(s)=0.6$ everywhere, so $G''(1)=0.6$ — matching
          $0(-1)(0.2)+0(0.5)+2(1)(0.3)=0.6$ directly.
      - ask: >
          Combining both, what is $\operatorname{Var}(X)$?
        expects: "0.49"
        hint: >
          $\operatorname{Var}(X) = G''(1)+G'(1)-(G'(1))^{2}$.
        feedback: >
          $0.6+1.1-1.1^{2} = 1.7-1.21 = 0.49$ — matching
          $\mathbb{E}[X^{2}]=1.7$ and $1.7-1.1^{2}=0.49$.
      - teach: >
          The two easy slips: evaluating these derivatives at $s=0$ out of
          habit from coefficient extraction instead of $s=1$, and dropping
          the $+G'(1)$ correction that converts the factorial moment
          $\mathbb{E}[X(X-1)]$ back into the raw moment $\mathbb{E}[X^{2}]$.
      - teach: >
          "Find the mean and variance from this PGF" wants two derivatives
          at $s=1$, not an attempt to expand the full series and sum
          directly — and expect to be asked why $s=1$ rather than $s=0$ is
          used.

  - node: quant-probability.mgf.standard-pgfs
    hook: >
      This table is expected memorized cold — but the payoff isn't
      memorization itself, it's recognizing the two series identities that
      generate every entry, since that's what lets you rebuild any one of
      them on the spot.
    explanation: >
      Every entry is produced the same way: write the pmf, multiply by
      $s^{k}$, sum. Two series identities do all the work — the binomial
      theorem for Bernoulli and binomial, and the geometric or exponential
      series for everything else: $\sum_{k\ge0} x^{k} = 1/(1-x)$ turns a
      geometric-shaped pmf into a rational function, and $\sum_{k\ge0}
      x^{k}/k! = e^{x}$ turns the Poisson pmf into an exponential. Nothing
      beyond substitution is needed once you recognize which series a pmf's
      tail matches.

      The negative binomial entry is worth noticing structurally: $(ps/(1-qs))^{r}$
      is the geometric PGF raised to the $r$-th power, because a negative
      binomial counting $r$ successes is built from $r$ independent
      geometric waiting times, and independent PGFs multiply — a preview of
      the PGF-of-a-sum rule, visible here before it's even stated.

      The one universal check across every entry is $G(1)=1$: substituting
      $s=1$ collapses each closed form back to the pmf's own normalization —
      $q+p=1$ for Bernoulli and binomial, $p/(1-q)=1$ for geometric since
      $q=1-p$, $e^{0}=1$ for Poisson — one substitution, not a proof.
    worked: >
      Check the negative binomial entry at its smallest possible value: with
      $r=2$ successes and $p=q=1/2$, at least $2$ trials are needed, so
      directly from the pmf $\Pr(X=2) = \binom{1}{1}p^{2} = 1/4$ (two
      successes, no failures). From the PGF, $(ps/(1-qs))^{2}$ expands as
      $(s/2+s^{2}/4+\cdots)^{2}$, and the only way to produce an $s^{2}$ term
      is $(s/2)\times(s/2)$, contributing $1/4$ — matching exactly.
    interview: >
      "State the PGF of a Poisson, binomial or geometric on sight" expects the
      table memorized; interviewers listen for the correct convergence domain
      on the geometric entry, not just the formula, since forgetting it is
      the tell that it was pattern-matched rather than understood.
    pitfalls: >
      Forgetting the domain restriction $|s|<1/q$ on the geometric and
      negative binomial entries — the closed form is only valid there.
      Mixing up the two geometric conventions (counting failures before the
      first success, versus the trial number of the first success), which
      shifts the PGF by a factor of $s$.
    recap: >
      Every named discrete PGF drops out of a binomial, geometric, or
      exponential series identity applied to its pmf, and $G(1)=1$ checks
      each one instantly.
    steps:
      - teach: >
          Every entry in the table is produced the same way: write the pmf,
          multiply by $s^{k}$, sum. Two series identities generate all of
          it — the binomial theorem for Bernoulli and binomial, and the
          geometric or exponential series for everything else.
      - teach: >
          The negative binomial entry, $(ps/(1-qs))^{r}$, is the geometric
          PGF raised to the $r$-th power, because $r$ independent geometric
          waiting times sum to a negative binomial and independent PGFs
          multiply — a preview of the sum rule, visible here before it is
          even stated.
      - teach: >
          Take Binomial$(3, 0.4)$: its PGF is $(0.6+0.4s)^{3}$.
      - ask: >
          Reading $G(0)$ off that PGF, what is $\Pr(X=0)$?
        expects: "0.216"
        hint: >
          $G(0)$ is the constant term, and setting $s=0$ in
          $(0.6+0.4s)^{3}$ leaves only $0.6^{3}$.
        feedback: >
          $G(0)=0.6^{3}=0.216$, matching the direct binomial count
          $\binom{3}{0}0.4^{0}0.6^{3}=0.216$.
      - teach: >
          The one universal check across every entry is $G(1)=1$:
          substituting $s=1$ collapses each closed form back to the pmf's
          own normalization — $q+p=1$ for Bernoulli and binomial,
          $p/(1-q)=1$ for geometric since $q=1-p$.
      - ask: >
          For Geometric$(p=0.25)$ with PGF $ps/(1-qs)$, what is $G(1)$?
        expects: "1"
        hint: >
          Substitute $s=1$ and use $q=1-p$.
        feedback: >
          $G(1) = p/(1-q) = p/p = 1$ for any valid $p$ — this is the
          normalization check, not a fact specific to $p=0.25$.
      - ask: >
          The geometric PGF's closed form $ps/(1-qs)$ is valid for which
          $s$?
        choices:
          - text: >
              All real $s$
            feedback: >
              The geometric series $\sum_k (qs)^{k}$ only converges for
              $|qs|<1$ — the closed form is not valid everywhere.
          - text: >
              $|s| < 1/q$
            correct: true
            feedback: >
              Correct — this is exactly where the underlying geometric
              series $\sum_{k\ge1} q^{k-1}p\,s^{k}$ converges.
          - text: >
              $s > 0$ only
            feedback: >
              The restriction is on magnitude, not sign — negative $s$
              inside $(-1/q, 1/q)$ works fine too.
        feedback: >
          Forgetting the domain restriction on the geometric and negative
          binomial entries — valid only for $|s|<1/q$ — is the standard
          slip once the formula itself is memorized.
      - teach: >
          Interviewers listen for the correct convergence domain on the
          geometric entry, not just the formula — forgetting it is the tell
          that a table entry was pattern-matched rather than derived.

  - node: quant-probability.mgf.pgf-sums
    hook: >
      This one line is why the whole subject exists: turning the awkward
      convolution sum for a distribution's total into ordinary polynomial
      multiplication.
    explanation: >
      Independence is exactly the hypothesis multiplication needs. $s^{X}$ is
      a function of $X$ alone and $s^{Y}$ a function of $Y$ alone, so
      independence of $X$ and $Y$ carries over to independence of $s^{X}$ and
      $s^{Y}$, and expectations of independent products factor:
      $\mathbb{E}[s^{X}s^{Y}] = \mathbb{E}[s^{X}]\,\mathbb{E}[s^{Y}]$. That one
      line is the whole proof, and everything downstream in this chapter —
      dice problems, compound sums, additive families of named laws — is this
      fact applied repeatedly.

      Contrast with the direct route: finding the pmf of $X+Y$ by hand means
      the convolution sum $\Pr(X+Y=m)=\sum_k\Pr(X=k)\Pr(Y=m-k)$, one
      computation per value of $m$. Multiplying two polynomials and reading
      off coefficients performs the same computation all at once, which is
      why the PGF route wins whenever both PGFs are already in closed form.

      The rule extends immediately to $n$ iid copies, $G_{S_n}(s)=G_X(s)^{n}$,
      by applying the two-variable rule $n-1$ times — no new idea, just
      induction on the same factorization.
    worked: >
      $X\sim\text{Bernoulli}(0.5)$ and $Y\sim\text{Bernoulli}(0.3)$
      independent: $G_X(s)=0.5+0.5s$, $G_Y(s)=0.7+0.3s$, so $G_X(s)G_Y(s) =
      0.35+0.5s+0.15s^{2}$. Reading the $s^{1}$ coefficient,
      $\Pr(X+Y=1)=0.5$, matching a direct check:
      $\Pr(X=1,Y=0)+\Pr(X=0,Y=1) = 0.5(0.7)+0.5(0.3) = 0.5$.
    interview: >
      "What's the PGF of the sum of two independent counts" wants the
      immediate answer "multiply the two PGFs." A common follow-up asks you
      to extract one specific coefficient of the product rather than the
      whole resulting pmf.
    pitfalls: >
      Applying $G_{X+Y}=G_XG_Y$ to counts that are merely correlated, not
      independent — the product rule needs genuine independence. Forgetting
      that the product is only guaranteed valid on the overlap of the two
      individual radii of convergence, though this rarely binds in practice.
    recap: >
      Independence turns the sum's PGF into the product $G_X(s)G_Y(s)$,
      replacing a convolution sum with polynomial multiplication.
    steps:
      - teach: >
          Independence is exactly the hypothesis multiplication needs:
          $s^{X}$ and $s^{Y}$ are independent functions of independent
          variables, so their expectation factors,
          $\mathbb{E}[s^{X}s^{Y}]=\mathbb{E}[s^{X}]\mathbb{E}[s^{Y}]$. That
          one line is the whole proof.
      - teach: >
          $G_{X+Y}(s)=G_X(s)G_Y(s)$ for independent counts, and it extends
          to $n$ iid copies as $G_{S_n}(s)=G_X(s)^{n}$ by applying the rule
          $n-1$ times.
      - teach: >
          $X\sim\text{Bernoulli}(0.6)$ and $Y\sim\text{Bernoulli}(0.2)$
          independent: $G_X(s)=0.4+0.6s$ and $G_Y(s)=0.8+0.2s$.
      - ask: >
          What is $\Pr(X+Y=0)$, the constant term of $G_X(s)G_Y(s)$?
        expects: "0.32"
        hint: >
          Multiply the constant terms of $G_X$ and $G_Y$.
        feedback: >
          $G_X(s)G_Y(s) = 0.32+0.56s+0.12s^{2}$, so
          $\Pr(X+Y=0)=0.32$ — matching $\Pr(X=0,Y=0)=0.4(0.8)=0.32$
          directly.
      - teach: >
          Contrast with the direct route: finding the pmf of $X+Y$ by hand
          means the convolution $\Pr(X+Y=m)=\sum_k\Pr(X=k)\Pr(Y=m-k)$, one
          computation per value of $m$. Multiplying the two polynomials does
          every value of $m$ at once.
      - ask: >
          Reading the same product, what is $\Pr(X+Y=1)$?
        expects: "0.56"
        hint: >
          It's the coefficient of $s^{1}$ in $0.32+0.56s+0.12s^{2}$.
        feedback: >
          $0.56$ — matching the direct check
          $\Pr(X=1,Y=0)+\Pr(X=0,Y=1)=0.6(0.8)+0.4(0.2)=0.48+0.08=0.56$.
      - ask: >
          For which pair could you not apply $G_{X+Y}=G_XG_Y$ directly?
        choices:
          - text: >
              Two independent Poisson counts
            feedback: >
              Independence is exactly what's needed, so the rule applies
              directly here.
          - text: >
              Two counts that are correlated but not independent
            correct: true
            feedback: >
              Correct — the factoring step $\mathbb{E}[s^{X}s^{Y}] =
              \mathbb{E}[s^{X}]\mathbb{E}[s^{Y}]$ genuinely needs
              independence, not merely zero correlation.
          - text: >
              $n$ iid copies of the same count
            feedback: >
              This is exactly the extension $G_{S_n}=G_X^{n}$, a repeated
              application of the same rule.
        feedback: >
          Applying $G_{X+Y}=G_XG_Y$ to counts that are merely correlated is
          the standard misuse — the product rule needs genuine independence.
      - teach: >
          This one line is why the transform is worth building at all:
          dice problems, compound sums, and additive families of named laws
          are all this fact applied repeatedly.

  - node: quant-probability.mgf.loaded-dice
    hook: >
      This is the best-known generating-function interview question, and the
      one nontrivial fact behind it — an odd-degree real polynomial always
      has a real root — is worth internalizing on its own, since it's the
      whole engine.
    explanation: >
      The proof has exactly one nontrivial ingredient: a real polynomial of
      odd degree always has a real root, since it takes arbitrarily large
      values of opposite sign as $s\to\pm\infty$ and is continuous, so it must
      cross zero somewhere. Everything else is bookkeeping — matching degrees
      shows both dice's leftover factors $h_1,h_2$ must have odd degree $5$,
      and matching coefficients pins down exactly what polynomial they'd need
      to multiply to.

      The target is $1+s+\cdots+s^{10}$, and factoring
      $s^{11}-1=(s-1)(1+s+\cdots+s^{10})$ shows its roots are exactly the
      eleventh roots of unity other than $1$ — and since $11$ is odd, $-1$
      isn't among them (only even orders contain $-1$), so none of those
      roots is real. A polynomial with zero real roots can never be the
      product of two real polynomials each guaranteed a real root, which is
      the contradiction.

      The pattern generalizes: whenever a target sum-distribution's
      generating polynomial has no real roots, it blocks any factorization
      into two dice polynomials whose forced degrees include an odd one — the
      specific numbers here are incidental to the mechanism.
    worked: >
      Shrink the argument to two-sided dice (coins) with faces $1$ and $2$,
      loaded however you like: can the sum be uniform on $\{2,3,4\}$? Writing
      $G_i(s)=s\,h_i(s)$ with $h_i(s)=p_{i,1}+p_{i,2}s$ linear, the target is
      $G_1G_2 = (s^{2}+s^{3}+s^{4})/3 = s^{2}(1+s+s^{2})/3$, so
      $h_1(s)h_2(s) = (1+s+s^{2})/3$ — a product of two real linear factors,
      which always has real roots. But $1+s+s^{2}$ has discriminant
      $1-4=-3<0$, no real roots at all. Contradiction: no loading of two
      coins makes $\{2,3,4\}$ uniform either.
    interview: >
      The interviewer wants you to reach for polynomial factorization and
      root-counting, not brute-force casework over every loading. Stating the
      odd-degree-implies-real-root fact out loud is the signal that you
      understand the mechanism, not just the memorized conclusion.
    pitfalls: >
      Searching over loadings by trial and error — the space of loadings is
      continuous and unbounded, so no finite search settles it. Assuming the
      argument transfers unchanged to a die with a different number of sides
      without rechecking whether the forced degree is actually odd, since
      that's what makes the real-root fact bite.
    recap: >
      No loading of two dice makes their sum uniform, because the uniform
      target's generating polynomial has no real roots while any two-dice
      factorization forces one factor of odd degree, which must have one.
    steps:
      - teach: >
          The proof has exactly one nontrivial ingredient: a real polynomial
          of odd degree always has a real root, since it takes arbitrarily
          large values of opposite sign as $s\to\pm\infty$ and is
          continuous, so it must cross zero somewhere.
      - teach: >
          Writing $G_i(s)=s\,h_i(s)$, matching degrees against the target
          polynomial pins down what degree each leftover factor $h_i$ must
          have, and factoring the target's roots as roots of unity shows
          whether any of them are real.
      - teach: >
          Try two four-sided dice (faces $1$ to $4$, loaded however you
          like): can their sum be uniform on $\{2,\dots,8\}$? Each $h_i$ has
          degree at most $3$, and the target's degree-$8$ polynomial
          $s^{2}(1+s+\cdots+s^{6})/7$ forces $\deg h_1+\deg h_2 = 6$.
      - ask: >
          Since each $h_i$ has degree at most $3$ and the two degrees sum to
          $6$, what must each one's degree equal?
        expects: "3"
        hint: >
          Two numbers, each at most $3$, that sum to $6$.
        feedback: >
          Each must be exactly $3$ — the only way two numbers bounded by
          $3$ can sum to $6$.
      - teach: >
          Degree $3$ is odd, so each $h_i$ must have a real root. But
          $1+s+\cdots+s^{6} = (s^{7}-1)/(s-1)$ has roots at the seventh
          roots of unity other than $1$, none of them real since $7$ is odd
          (so $-1$, the only real root of unity besides $1$, is not among
          them).
      - ask: >
          Does this mean no loading of two four-sided dice can make their
          sum uniform on $\{2,\dots,8\}$?
        choices:
          - text: >
              Yes — the same contradiction as the six-sided case
            correct: true
            feedback: >
              Correct: an odd-degree factor is forced, guaranteeing a real
              root, but the target polynomial has none.
          - text: >
              No, because degree-$3$ polynomials do not always have real
              roots
            feedback: >
              They do — odd degree guarantees at least one real root, with
              no exceptions.
          - text: >
              No, because $7$ is prime so the argument does not apply
            feedback: >
              Primality of $7$ is not what matters; what matters is that
              $7$ is odd, so $-1$ is not a seventh root of unity.
        feedback: >
          The mechanism transfers unchanged here: the forced degree is odd,
          guaranteeing a real root the rootless target polynomial cannot
          supply.
      - teach: >
          Searching over loadings by trial and error never settles this —
          the space of loadings is continuous and unbounded, so no finite
          search can rule out every case the way one root-counting argument
          does.
      - ask: >
          Now try two five-sided dice (faces $1$ to $5$): the sum ranges
          over $9$ values, and matching degrees against
          $s^{2}(1+s+\cdots+s^{8})/9$ forces $\deg h_1+\deg h_2=8$ with
          each at most $4$. What degree does each $h_i$ get forced to?
        expects: "4"
        hint: >
          Two numbers, each at most $4$, that sum to $8$.
        feedback: >
          Each must be $4$ — but $4$ is even, so the odd-degree-implies-
          real-root fact does not automatically apply, and this case is not
          settled by the same one-line argument. Checking that the forced
          degree is genuinely odd before reusing the argument is exactly the
          step easy to skip.
      - teach: >
          No loading of two dice makes their sum uniform, because the
          uniform target's polynomial has no real roots while any two-dice
          factorization forces an odd-degree factor, which must have one.

  - node: quant-probability.mgf.sicherman-dice
    hook: >
      Once you know two dice's generating polynomial fully factors into
      irreducible pieces, the natural next question is whether a different
      grouping of those pieces gives an entirely different pair of dice with
      the same sum — and it does.
    explanation: >
      The trick rests on one observation: the sum's law depends only on the
      product $G_1(s)G_2(s)$, and a product doesn't care how its factors are
      grouped. A standard die's generating polynomial (using unnormalized
      face counts, so $G(1)=6$) factors completely as
      $s(1+s)(1+s+s^{2})(1-s+s^{2})$, so two standard dice together supply
      eight irreducible pieces — two copies each of these four factors — and
      any split of those eight pieces into two groups of total degree $5$
      each reproduces exactly the same product, hence the same sum law.

      Not every split is a die, though. Each resulting polynomial needs every
      coefficient nonnegative (a face count can't be negative), needs a
      factor of $s$ present (no face is labeled $0$), and needs to total $6$
      at $s=1$ (six faces). Most groupings fail one of these; the two
      nontrivial splits that survive are the standard dice themselves and the
      Sicherman pair.

      Because the product is unchanged, every coefficient of $s^{k}$ in it —
      the count of ways to roll total $k$ — is unchanged too, so the entire
      sum distribution is preserved, not just its mean.
    worked: >
      Verify a total besides seven: on standard dice, $\Pr(\text{sum}=5) =
      4/36 = 1/9$, from pairs $(1,4),(2,3),(3,2),(4,1)$. On the Sicherman
      faces $\{1,2,2,3,3,4\}$ and $\{1,3,4,5,6,8\}$, the pairs summing to $5$
      are $a=1,b=4$ (one way), $a=2,b=3$ (two ways, since the first die has
      two $2$-faces), and $a=4,b=1$ (one way) — $a=3$ would need $b=2$,
      absent from the second die. That's $1+2+0+1=4$ ways out of $36$, again
      $1/9$.
    interview: >
      "Find another pair of dice with the same sum distribution as standard
      dice" is the canonical follow-up once the impossibility problem is
      solved. Naming the polynomial-factoring technique, and knowing
      "Sicherman dice" as the answer, signals real depth.
    pitfalls: >
      Assuming any regrouping of the eight irreducible factors works — most
      fail the nonnegative-coefficient or six-faces constraint and aren't
      valid dice at all. Forgetting to check the resulting faces are all
      positive integers before declaring a split valid.
    recap: >
      Regrouping the four irreducible factors of two standard dice's
      generating polynomials differently, while keeping every coefficient a
      valid face count, produces the Sicherman dice — a different pair with
      the identical sum distribution.
    steps:
      - teach: >
          The sum's law depends only on the product $G_1(s)G_2(s)$, and a
          product does not care how its factors are grouped — so a
          different split of the same irreducible pieces can give a
          genuinely different pair of dice with the identical sum law.
      - teach: >
          Two standard dice supply eight irreducible pieces — two copies
          each of $s$, $(1+s)$, $(1+s+s^{2})$, $(1-s+s^{2})$. Grouping them
          into the Sicherman split gives faces $\{1,2,2,3,3,4\}$ and
          $\{1,3,4,5,6,8\}$.
      - ask: >
          On the Sicherman dice, what is $\Pr(\text{sum}=2)$?
        expects: "1/36"
        hint: >
          Only one pair of faces, one from each die, can sum to $2$.
        feedback: >
          Only $a=1,b=1$ works, each appearing once on its die, so it's
          $1$ way out of $36$ — matching the standard dice exactly.
      - teach: >
          Not every split of the eight pieces is a valid die: each resulting
          polynomial needs every coefficient nonnegative, a factor of $s$
          present (no face labeled $0$), and it must total $6$ at $s=1$
          (six faces).
      - ask: >
          Which of these is *not* one of the three conditions a regrouping
          must satisfy?
        choices:
          - text: >
              Every coefficient must be nonnegative
            feedback: >
              This is required — a face count can never be negative.
          - text: >
              Every face value must be at most $6$
            correct: true
            feedback: >
              Nothing bounds a face's value — the Sicherman die
              $\{1,3,4,5,6,8\}$ has a face labeled $8$, well past $6$.
          - text: >
              The polynomial must carry a factor of $s$
            feedback: >
              This is required — without it, one face would be labeled
              $0$.
          - text: >
              The polynomial must equal $6$ at $s=1$
            feedback: >
              This is required — it's exactly the statement that each die
              has six faces.
        feedback: >
          Nothing in the argument bounds face values by $6$; that
          assumption belongs to the standard die specifically, not to a
          valid regrouping in general.
      - ask: >
          What is $\Pr(\text{sum}=9)$ on the Sicherman dice?
        expects: "1/9"
        hint: >
          Pair up $a\in\{1,2,2,3,3,4\}$ with $b\in\{1,3,4,5,6,8\}$ summing to
          $9$.
        feedback: >
          $a=1,b=8$ ($1$ way), $a=3,b=6$ ($2$ ways, since $3$ appears twice),
          $a=4,b=5$ ($1$ way) — $4$ ways out of $36$, again $1/9$, matching
          the standard dice.
      - teach: >
          Most groupings of the eight pieces fail one of the three
          conditions and are not valid dice at all — only the standard
          split and the Sicherman split survive among the nontrivial ones.
      - teach: >
          Because the product $G_1G_2$ is literally unchanged by the
          regrouping, every coefficient of $s^{k}$ — the count of ways to
          roll total $k$ — is unchanged too, so the entire sum distribution
          is preserved, not just its mean.

  - node: quant-probability.mgf.pgf-random-sums
    hook: >
      Whenever a total is built from "a random number of things, each
      contributing its own random amount" — claims, arrivals, defaults — its
      PGF is a composition, and recognizing that shape turns a hard
      conditioning argument into substitution.
    explanation: >
      Condition on $N$ first: given $N=n$, $S$ is a sum of $n$ iid copies of
      $X$, and because independent PGFs multiply, $\mathbb{E}[s^{S}\mid N=n]
      = G_X(s)^{n}$. Averaging that conditional PGF over the randomness in
      $N$ itself means substituting $G_X(s)$ in for the variable $G_N$
      eats, since $G_N(u)=\mathbb{E}[u^{N}]$ evaluated at $u=G_X(s)$ is
      precisely $\mathbb{E}[G_X(s)^{N}]$. That substitution is composition,
      $G_S = G_N\circ G_X$.

      Differentiating a composition uses the chain rule:
      $G_S'(s) = G_N'(G_X(s))\,G_X'(s)$, and at $s=1$, since $G_X(1)=1$, this
      collapses to $G_N'(1)G_X'(1) = \mathbb{E}[N]\,\mathbb{E}[X]$ — the mean
      of a randomly stopped sum falls out of one differentiation, no separate
      argument needed.

      Recognizing the shape matters more than the algebra: any "random count
      of random contributions" setup is a composition, and reading off
      $\mathbb{E}[S]$ or a specific probability is substitution, not a fresh
      derivation each time.
    worked: >
      Let $N$ be $0$ with probability $0.4$ or $2$ with probability $0.6$,
      and each $X_i\sim\text{Bernoulli}(0.5)$ independently. Then
      $G_S(s) = G_N(G_X(s)) = 0.4 + 0.6(0.5+0.5s)^{2} = 0.55+0.3s+0.15s^{2}$,
      so $\Pr(S=0)=0.55$ — matching a direct check,
      $0.4+0.6(0.5)^{2}=0.55$. The mean: $\mathbb{E}[N]=1.2$,
      $\mathbb{E}[X]=0.5$, so $\mathbb{E}[S]=0.6$, matching $G_S'(1)=0.6$.
    interview: >
      "If the number of arrivals is itself random, what's the mean of the
      total" wants immediate recognition of the composition $G_N(G_X(s))$ and
      the shortcut $\mathbb{E}[N]\mathbb{E}[X]$, not an attempt to build the
      joint distribution from scratch.
    pitfalls: >
      Composing in the wrong order, $G_X(G_N(s))$ instead of $G_N(G_X(s))$ —
      the inner function must be the per-item PGF, the outer the count's.
      Forgetting the $X_i$ must be independent of $N$ and of each other for
      the conditional power $G_X(s)^{n}$ to hold.
    recap: >
      A randomly stopped sum's PGF is the composition $G_S=G_N\circ G_X$, and
      one chain-rule differentiation at $s=1$ recovers
      $\mathbb{E}[S]=\mathbb{E}[N]\mathbb{E}[X]$.
    steps:
      - teach: >
          Whenever a total is built from "a random number of things, each
          contributing its own random amount" — claims, arrivals, defaults —
          its PGF is a composition, not a product.
      - teach: >
          Conditioning on $N=n$ gives $\mathbb{E}[s^{S}\mid N=n]=G_X(s)^{n}$,
          and averaging that over $N$'s own randomness is substituting
          $G_X(s)$ into $G_N$: $G_S(s)=G_N(G_X(s))$.
      - teach: >
          Let $N$ be $1$ with probability $0.3$ or $3$ with probability
          $0.7$, and each $X_i\sim\text{Bernoulli}(0.4)$ independently:
          $G_N(u)=0.3u+0.7u^{3}$ and $G_X(s)=0.6+0.4s$.
      - ask: >
          What is $\Pr(S=0)$ for that setup?
        expects: "0.3312"
        tolerance: 0.0005
        hint: >
          Compute $G_S(s)=G_N(G_X(s))$ and read the constant term.
        feedback: >
          $G_S(s)=0.3(0.6+0.4s)+0.7(0.6+0.4s)^{3}$, whose constant term is
          $0.3312$ — matching directly:
          $\Pr(N{=}1)(0.6)+\Pr(N{=}3)(0.6)^{3}=0.3(0.6)+0.7(0.216)=0.3312$.
      - teach: >
          Differentiating the composition by the chain rule gives
          $G_S'(s)=G_N'(G_X(s))G_X'(s)$, and at $s=1$, since $G_X(1)=1$,
          this collapses to $G_N'(1)G_X'(1)=\mathbb{E}[N]\mathbb{E}[X]$ — no
          separate argument needed.
      - ask: >
          What is $\mathbb{E}[S]$ for the same setup?
        expects: "0.96"
        hint: >
          $\mathbb{E}[S]=\mathbb{E}[N]\,\mathbb{E}[X]$.
        feedback: >
          $\mathbb{E}[N]=1(0.3)+3(0.7)=2.4$ and $\mathbb{E}[X]=0.4$, so
          $\mathbb{E}[S]=2.4(0.4)=0.96$.
      - ask: >
          Which is the correct composition for $G_S$?
        choices:
          - text: >
              $G_X(G_N(s))$
            feedback: >
              This reverses the order — the inner function must be the
              per-item PGF, the outer the count's.
          - text: >
              $G_N(G_X(s))$
            correct: true
            feedback: >
              Correct — condition on $N$ first, giving $G_X(s)^{N}$, then
              average over $N$ by substituting into $G_N$.
          - text: >
              $G_N(s)\cdot G_X(s)$
            feedback: >
              That's the rule for a *fixed* number of summands, not a
              random count — a random $N$ needs composition, not a
              product.
        feedback: >
          The count's generating function is the outer function, and the
          per-item generating function is what gets substituted in.
      - teach: >
          Recognizing the shape matters more than the algebra: any "random
          count of random contributions" setup is a composition, and reading
          off $\mathbb{E}[S]$ or a probability is substitution, not a fresh
          derivation each time.

  - node: quant-probability.mgf.mgf
    hook: >
      The PGF only reaches nonnegative-integer counts — the moment
      generating function extends the same trick to any real-valued variable,
      provided one real assumption actually holds, which is the detail
      interviewers probe first.
    explanation: >
      The PGF's exponent $s^{x}$ needs $x$ to be a nonnegative integer to
      make sense as a power. Real-valued $X$ needs a different exponent
      structure, and $e^{tx}$ is the natural choice: it's defined for every
      real $x$, and its Taylor series $e^{tx}=\sum_k (tx)^{k}/k!$ packages
      every power of $x$ at once, so averaging it against $X$'s law bundles
      every moment into one function of $t$.

      For a nonnegative-integer $X$, the two transforms are the same object
      through different windows: substituting $s=e^{t}$ turns
      $G_X(s)=\mathbb{E}[s^{X}]$ into $\mathbb{E}[(e^{t})^{X}] =
      \mathbb{E}[e^{tX}] = M_X(t)$. The point of a second transform is only
      to cover variables the PGF can't reach.

      The existence caveat is the genuinely new bookkeeping. $M_X(0)=1$
      always, but nothing guarantees $M_X(t)<\infty$ for $t\ne0$ — a heavy
      right tail can send $\mathbb{E}[e^{tX}]$ to infinity for every $t>0$.
      Convexity of $e^{tx}$ guarantees the set where $M_X$ is finite is an
      interval containing $0$, but that interval can collapse to the single
      point $\{0\}$, where the MGF exists in name only.
    worked: >
      Let $X$ be uniform on $[0,1]$, density $f(x)=1$. By LOTUS, $M_X(t) =
      \int_0^1 e^{tx}\,dx = (e^{t}-1)/t$ for $t\ne0$, with the limit as
      $t\to0$ equal to $1$, matching $M_X(0)=1$. Since $e^{tx}$ is bounded on
      $[0,1]$ for every real $t$, this integral is finite for every $t$ — the
      MGF exists everywhere, not merely near $0$.
    interview: >
      "Define the MGF and state when it's guaranteed to exist" tests whether
      you state the finite-neighborhood-of-$0$ hypothesis unprompted. A
      common follow-up asks whether every random variable has an MGF, and the
      answer is no.
    pitfalls: >
      Quoting $M_X(t)=\mathbb{E}[e^{tX}]$ without ever checking it's finite
      on an interval — the object is only useful once existence is confirmed.
      Confusing $M_X(0)=1$ (always true) with $M_X$ finite elsewhere (never
      automatic).
    recap: >
      The MGF $M_X(t)=\mathbb{E}[e^{tX}]$ generalizes the PGF to any
      real-valued $X$, agreeing with $G_X(e^{t})$ on the nonnegative
      integers, and is only as useful as the neighborhood of $t=0$ on which
      it's actually finite.
    steps:
      - teach: >
          The PGF's exponent $s^{x}$ needs $x$ to be a nonnegative integer.
          $e^{tx}$ is defined for every real $x$, so it's the natural
          replacement once $X$ can be any real number.
      - teach: >
          $M_X(t)=\mathbb{E}[e^{tX}]$, always finite at $t=0$ since
          $M_X(0)=1$. But nothing else is guaranteed: the set where $M_X$ is
          finite is an interval containing $0$ that can collapse to just
          $\{0\}$.
      - teach: >
          Let $X$ be uniform on $[0,2]$, density $f(x)=1/2$. By LOTUS,
          $M_X(t) = \int_0^{2} e^{tx}(1/2)\,dx = (e^{2t}-1)/(2t)$ for
          $t\ne0$, with the limit as $t\to0$ equal to $1$.
      - ask: >
          In general, for any random variable at all, what must $M_X(0)$
          equal?
        expects: "1"
        hint: >
          $M_X(0) = \mathbb{E}[e^{0\cdot X}]$.
        feedback: >
          $M_X(0)=\mathbb{E}[e^{0}]=\mathbb{E}[1]=1$ always — this holds no
          matter what the underlying distribution is.
      - teach: >
          For a nonnegative-integer $X$ the two transforms are the same
          object through different windows: substituting $s=e^{t}$ turns
          $G_X(s)=\mathbb{E}[s^{X}]$ into $M_X(t)=\mathbb{E}[e^{tX}]$.
      - ask: >
          $X\sim\text{Bernoulli}(0.3)$ has PGF $G_X(s)=0.7+0.3s$. Using
          $M_X(t)=G_X(e^{t})$, what is $M_X(\ln 2)$?
        expects: "1.3"
        hint: >
          $e^{\ln 2}=2$, so substitute $s=2$ into $G_X(s)$.
        feedback: >
          $M_X(\ln 2)=G_X(2)=0.7+0.3(2)=1.3$.
      - ask: >
          Which variable is guaranteed to have $M_X(t)<\infty$ for every
          real $t$?
        choices:
          - text: >
              A variable bounded on a finite interval, like uniform on
              $[0,2]$
            correct: true
            feedback: >
              Correct — $e^{tx}$ stays bounded whenever $x$ ranges over a
              bounded set, no matter how large $t$ is, so the expectation
              is always finite.
          - text: >
              Any variable with finite mean
            feedback: >
              A finite mean says nothing about how fast the tails decay —
              it does not control $\mathbb{E}[e^{tX}]$ for $t\ne0$.
          - text: >
              Any variable with finite variance
            feedback: >
              Same problem as finite mean — a finite second moment alone
              does not bound the MGF away from $t=0$.
        feedback: >
          Boundedness is the safe case: $e^{tx}$ can never blow up on a
          bounded support, whatever $t$ is.
      - teach: >
          "Define the MGF and state when it's guaranteed to exist" tests
          whether you state the finite-neighborhood-of-$0$ hypothesis
          unprompted — not every random variable has one.

  - node: quant-probability.mgf.mgf-moments
    hook: >
      Two derivatives at a single point, $t=0$, replace two separate
      integrals for $\mathbb{E}[X]$ and $\mathbb{E}[X^{2}]$ — this is where
      the transform genuinely pays for itself.
    explanation: >
      Expand $e^{tX}$ in its own Taylor series in $t$: $e^{tX} = \sum_k X^{k}
      t^{k}/k!$. Averaging term by term, justified once $M_X$ is finite on an
      interval around $0$, gives $M_X(t) = \sum_k \mathbb{E}[X^{k}]\,
      t^{k}/k!$ — an ordinary Taylor series in $t$ whose coefficients are the
      moments divided by $k!$. Differentiating $k$ times at $t=0$ reads off
      that coefficient times $k!$, which is $\mathbb{E}[X^{k}]$.

      This is the one convention difference worth keeping straight against
      the PGF: the PGF's variable $s$ is the outcome exponent itself, so its
      moments sit at $s=1$; the MGF's exponent variable $t$ is a separate
      dummy, so its moments sit naturally at $t=0$.

      Taking logs first is often faster: because $\ln$ turns a product into a
      sum, and $M_X(t)\approx 1+\mathbb{E}[X]t+\cdots$ near $t=0$, the
      cumulant generating function $K_X=\ln M_X$ has $K_X'(0)=\mathbb{E}[X]$
      and $K_X''(0)=\operatorname{Var}(X)$ directly, skipping the subtraction
      $\mathbb{E}[X^{2}]-(\mathbb{E}[X])^{2}$ the raw-moment route needs.
    worked: >
      Bernoulli$(0.3)$: $M(t)=0.7+0.3e^{t}$, so $M'(0)=0.3=\mathbb{E}[X]$ and
      $M''(0)=0.3=\mathbb{E}[X^{2}]$, giving $\operatorname{Var}(X) =
      0.3-0.3^{2}=0.21$. The cumulant route agrees: $K(t)=\ln(0.7+0.3e^{t})$
      gives $K'(0)=0.3$ and $K''(0)=0.21$ directly, without ever squaring
      $M'(0)$.
    interview: >
      "Derive the mean and variance of this law from its MGF" wants two
      derivatives at $0$, or logs first for the faster variance.
      Interviewers listen for the log shortcut named unprompted.
    pitfalls: >
      Differentiating at $t=1$ out of habit carried over from the PGF's
      derivative-at-$s=1$ convention — the MGF's moments sit at $t=0$.
      Forgetting that term-by-term differentiation of the Taylor series needs
      the finiteness-on-an-interval hypothesis to be justified.
    recap: >
      $M_X^{(k)}(0)=\mathbb{E}[X^{k}]$ turns every moment into a derivative
      at one point, and $K_X=\ln M_X$ hands you the mean and variance
      directly, skipping the usual subtraction.
    steps:
      - teach: >
          Two derivatives at a single point, $t=0$, replace two separate
          integrals for $\mathbb{E}[X]$ and $\mathbb{E}[X^{2}]$ — this is
          where the transform genuinely pays for itself.
      - teach: >
          Expanding $e^{tX}=\sum_k X^{k}t^{k}/k!$ term by term gives
          $M_X(t)=\sum_k\mathbb{E}[X^{k}]t^{k}/k!$, an ordinary Taylor
          series whose coefficients are moments over $k!$. Note the
          convention flip from the PGF: moments sit at $t=0$ here, not
          $s=1$, because $t$ is a separate dummy variable, not the outcome
          exponent itself.
      - teach: >
          Let $X$ take values $1$ and $3$ with probabilities $0.7$ and
          $0.3$: $M(t)=0.7e^{t}+0.3e^{3t}$.
      - ask: >
          What is $M'(0)=\mathbb{E}[X]$ for that distribution?
        expects: "1.6"
        hint: >
          $M'(t)=0.7e^{t}+0.9e^{3t}$; evaluate at $t=0$.
        feedback: >
          $M'(0)=0.7+0.9=1.6$ — matching the direct sum
          $1(0.7)+3(0.3)=1.6$.
      - teach: >
          Taking logs first is often faster: the cumulant generating
          function $K_X=\ln M_X$ has $K_X'(0)=\mathbb{E}[X]$ and
          $K_X''(0)=\operatorname{Var}(X)$ directly, skipping the
          subtraction $\mathbb{E}[X^{2}]-(\mathbb{E}[X])^{2}$.
      - ask: >
          What is $\operatorname{Var}(X)$ for the same distribution?
        expects: "0.84"
        hint: >
          Find $M''(0)=\mathbb{E}[X^{2}]$ first, then subtract
          $(M'(0))^{2}$.
        feedback: >
          $M''(t)=0.7e^{t}+2.7e^{3t}$, so $M''(0)=3.4=\mathbb{E}[X^{2}]$ —
          matching $1(0.7)+9(0.3)=3.4$ directly. Then
          $\operatorname{Var}(X)=3.4-1.6^{2}=0.84$.
      - ask: >
          Where should you evaluate MGF derivatives to extract moments?
        choices:
          - text: >
              $t=0$
            correct: true
            feedback: >
              Correct — the Taylor expansion of $e^{tX}$ in $t$ has its
              moments as coefficients read off at $t=0$.
          - text: >
              $t=1$
            feedback: >
              This is the PGF's convention carried over by habit — the PGF
              reads moments at $s=1$ because $s$ is the outcome exponent;
              the MGF's $t$ is a separate dummy variable.
          - text: >
              $s=0$
            feedback: >
              The MGF's variable is $t$, not $s$ — mixing up the two
              transforms' notation.
        feedback: >
          $M_X^{(k)}(0)=\mathbb{E}[X^{k}]$: every moment sits at $t=0$, the
          opposite convention from where PGF moments sit.
      - teach: >
          "Derive the mean and variance of this law from its MGF" wants two
          derivatives at $0$, or logs first for the faster variance —
          interviewers listen for the log shortcut named unprompted.

  - node: quant-probability.mgf.mgf-scaling
    hook: >
      One computation on a standardized shape buys the MGF of an entire
      location-scale family for free — this is the actual mechanism, not a
      coincidence, behind why every named continuous law has one canonical
      member worth memorizing.
    explanation: >
      Derive the rule directly: $M_{aX+b}(t) = \mathbb{E}[e^{t(aX+b)}] =
      \mathbb{E}[e^{bt}e^{(at)X}] = e^{bt}\mathbb{E}[e^{(at)X}] =
      e^{bt}M_X(at)$ — pull the constant $e^{bt}$ outside the expectation
      (it carries no randomness) and recognize what's left as $M_X$ evaluated
      at the rescaled argument $at$. The domain shifts to match: finite
      exactly where $at$ lies in $X$'s own domain of finiteness.

      This is the whole mechanism behind "compute one member, get the family
      for free." Standardizing $Z=(X-\mu)/\sigma$ sets $a=1/\sigma$,
      $b=-\mu/\sigma$; once one shape's standardized MGF is known in closed
      form, every location-scale member of that family is a substitution
      away.

      Setting $a=-1,b=0$ gives the mirror rule $M_{-X}(t)=M_X(-t)$, so a
      distribution symmetric about $0$ — where $-X$ and $X$ share a law —
      must have an even $M_X$. Checking evenness is a fast way to catch an
      algebra slip in a computed MGF for any symmetric law.
    worked: >
      $X\sim\text{Bernoulli}(0.4)$ has $M_X(t)=0.6+0.4e^{t}$. Let
      $Y=3X-1$: the rule gives $M_Y(t) = e^{-t}M_X(3t) = e^{-t}(0.6+0.4e^{3t})
      = 0.6e^{-t}+0.4e^{2t}$. Checking directly: $Y=-1$ with probability
      $0.6$ (when $X=0$) or $Y=2$ with probability $0.4$ (when $X=1$), giving
      $M_Y(t)=0.6e^{-t}+0.4e^{2t}$ — matching exactly.
    interview: >
      "If you know $M_X$, what's $M_{aX+b}$" checks the derivation, not just
      the formula — pull $e^{bt}$ out of the expectation on the spot rather
      than quoting the rule. Expect a follow-up asking you to identify an
      entire family from one standardized MGF.
    pitfalls: >
      Writing $M_{aX+b}(t)=aM_X(t)+b$, treating the MGF as if it transforms
      like $X$ itself, instead of the correct $e^{bt}M_X(at)$. Forgetting the
      domain rescales too — $M_X$ finite on $|t|<h$ only guarantees
      $M_{aX+b}$ finite on $|t|<h/|a|$.
    recap: >
      $M_{aX+b}(t)=e^{bt}M_X(at)$ falls out of pulling a constant through the
      expectation, and it's the single fact that turns one standardized
      computation into an entire location-scale family of MGFs.
    steps:
      - teach: >
          One computation on a standardized shape buys the MGF of an entire
          location-scale family for free — this is the actual mechanism
          behind why every named continuous law has one canonical member
          worth memorizing.
      - teach: >
          $M_{aX+b}(t) = \mathbb{E}[e^{t(aX+b)}] = e^{bt}\mathbb{E}[e^{(at)X}]
          = e^{bt}M_X(at)$: pull the constant $e^{bt}$ outside the
          expectation, and recognize the rest as $M_X$ evaluated at the
          rescaled argument $at$.
      - teach: >
          $X\sim\text{Bernoulli}(0.25)$ has $M_X(t)=0.75+0.25e^{t}$. Let
          $Y=2X+3$.
      - ask: >
          What is the coefficient on $e^{5t}$ in $M_Y(t)$?
        expects: "0.25"
        hint: >
          Use $M_Y(t)=e^{3t}M_X(2t)$ and find which term produces $e^{5t}$.
        feedback: >
          $M_Y(t)=e^{3t}(0.75+0.25e^{2t}) = 0.75e^{3t}+0.25e^{5t}$, so the
          coefficient is $0.25$ — matching $\Pr(Y=5)=\Pr(X=1)=0.25$, since
          $Y=2(1)+3=5$.
      - teach: >
          Standardizing $Z=(X-\mu)/\sigma$ sets $a=1/\sigma$, $b=-\mu/\sigma$
          — once one shape's standardized MGF is known, every location-scale
          member of that family is a substitution away. Setting $a=-1,b=0$
          gives the mirror rule $M_{-X}(t)=M_X(-t)$, so a law symmetric
          about $0$ must have an even MGF.
      - ask: >
          What is the coefficient on $e^{3t}$ in that same $M_Y(t)$?
        expects: "0.75"
        hint: >
          It's the term coming from $X=0$.
        feedback: >
          $0.75$, matching $\Pr(Y=3)=\Pr(X=0)=0.75$, since $Y=2(0)+3=3$.
      - ask: >
          Which is the correct formula for $M_{aX+b}(t)$ in terms of $M_X$?
        choices:
          - text: >
              $aM_X(t)+b$
            feedback: >
              This treats the MGF as if it transforms the same way $X$
              itself does — it does not.
          - text: >
              $e^{bt}M_X(at)$
            correct: true
            feedback: >
              Correct — pulling the constant $e^{bt}$ out of the
              expectation and rescaling the argument to $at$.
          - text: >
              $M_X(at)+b$
            feedback: >
              This drops the multiplicative factor $e^{bt}$ entirely.
        feedback: >
          $M_{aX+b}(t)=e^{bt}M_X(at)$ — derive it on the spot from pulling
          $e^{bt}$ through the expectation rather than quoting it cold.
      - teach: >
          Checking evenness of a computed MGF is a fast sanity check for any
          law symmetric about $0$: if $M_X(-t)\ne M_X(t)$ there, an algebra
          slip crept in somewhere.

  - node: quant-probability.mgf.mgf-sums
    hook: >
      This is the payoff line of the whole subject stated plainly:
      independent sums turn into ordinary multiplication, and it's the
      fastest way to name a sum's distribution without ever building it from
      a convolution.
    explanation: >
      Independence of $X,Y$ makes $e^{tX}$ and $e^{tY}$ independent, since
      they're separate functions of independent variables, so
      $M_{X+Y}(t)=\mathbb{E}[e^{t(X+Y)}]=\mathbb{E}[e^{tX}e^{tY}]
      =\mathbb{E}[e^{tX}]\,\mathbb{E}[e^{tY}]=M_X(t)M_Y(t)$, valid on the
      overlap of their domains. This is the exact mirror of the PGF sum rule
      with $s^{X}$ replaced by $e^{tX}$ — the same mechanism, independent
      functions of independent variables have factoring expectations.

      Taking logs turns this into addition: $\ln$ of a product is a sum of
      logs, so cumulant generating functions add across independent
      summands, $K_{X+Y}=K_X+K_Y$, which is exactly why cumulants are
      additive with no cross terms to track.

      Two things this rule needs and doesn't give: it genuinely requires
      independence, not merely zero covariance — the factoring step used
      independence of the exponentials directly, and uncorrelated variables
      need not satisfy it. And the converse fails: matching
      $M_{X+Y}=M_XM_Y$ never certifies independence on its own.
    worked: >
      $X$ takes $0$ or $1$ with probabilities $0.6, 0.4$, and independently
      $Y$ takes $0$ or $2$ with probabilities $0.7, 0.3$. Then $M_X(t)=
      0.6+0.4e^{t}$, $M_Y(t)=0.7+0.3e^{2t}$, so $M_X(t)M_Y(t) =
      0.42+0.28e^{t}+0.18e^{2t}+0.12e^{3t}$. Reading the $e^{t}$ coefficient,
      $\Pr(X+Y=1)=0.28$, matching directly:
      $\Pr(X=1,Y=0)=0.4(0.7)=0.28$.
    interview: >
      "What's the MGF of the sum of two independent laws" tests the reflex
      to multiply. A common follow-up asks whether zero correlation alone
      would suffice — it doesn't, independence is genuinely used.
    pitfalls: >
      Applying $M_{X+Y}=M_XM_Y$ to variables that are merely uncorrelated —
      correlation zero doesn't make the cross-expectation factor. Treating a
      matching product MGF as proof the variables are independent, when it's
      only a necessary consequence, not a characterization.
    recap: >
      Independent MGFs multiply, $M_{X+Y}=M_XM_Y$, turning a convolution into
      ordinary multiplication — but the rule needs genuine independence and
      its converse never holds.
    steps:
      - teach: >
          This is the payoff line of the whole subject stated plainly:
          independent sums turn into ordinary multiplication, and it's the
          fastest way to name a sum's distribution without building it from
          a convolution.
      - teach: >
          Independence of $X,Y$ makes $e^{tX}$ and $e^{tY}$ independent, so
          $M_{X+Y}(t)=\mathbb{E}[e^{tX}]\mathbb{E}[e^{tY}]=M_X(t)M_Y(t)$ on
          the overlap of their domains — the exact mirror of the PGF sum
          rule with $s^{X}$ replaced by $e^{tX}$.
      - teach: >
          $X$ takes $0$ or $1$ with probabilities $0.3, 0.7$, and
          independently $Y$ takes $0$ or $3$ with probabilities $0.5,0.5$:
          $M_X(t)=0.3+0.7e^{t}$ and $M_Y(t)=0.5+0.5e^{3t}$.
      - ask: >
          What is $\Pr(X+Y=0)$, the constant term of $M_X(t)M_Y(t)$?
        expects: "0.15"
        hint: >
          Multiply the constant terms of $M_X$ and $M_Y$.
        feedback: >
          $M_X(t)M_Y(t) = 0.15+0.35e^{t}+0.15e^{3t}+0.35e^{4t}$, so
          $\Pr(X+Y=0)=0.15$ — matching $\Pr(X=0,Y=0)=0.3(0.5)=0.15$.
      - teach: >
          Two things this rule needs and doesn't give: it genuinely requires
          independence, not merely zero covariance — the factoring step used
          independence of the exponentials directly. And the converse
          fails: matching $M_{X+Y}=M_XM_Y$ never certifies independence on
          its own.
      - ask: >
          What is $\Pr(X+Y=4)$, reading the same product?
        expects: "0.35"
        hint: >
          It's the coefficient of $e^{4t}$.
        feedback: >
          $0.35$ — matching $\Pr(X=1,Y=3)=0.7(0.5)=0.35$ directly.
      - ask: >
          If $M_{X+Y}=M_XM_Y$ holds for some pair $X,Y$, can you conclude
          they're independent?
        choices:
          - text: >
              Yes, always
            feedback: >
              The converse never holds — a matching product MGF is a
              necessary consequence of independence, not a sufficient
              condition for it.
          - text: >
              No — a matching product MGF is a necessary consequence of
              independence, but it doesn't certify it
            correct: true
            feedback: >
              Correct — the rule runs one direction only.
          - text: >
              Only if $X$ and $Y$ are also uncorrelated
            feedback: >
              Zero correlation is a separate, weaker condition and doesn't
              enter the converse question at all.
        feedback: >
          Independence implies $M_{X+Y}=M_XM_Y$, but the implication does
          not reverse.
      - teach: >
          Taking logs turns the product into a sum: cumulant generating
          functions add across independent summands,
          $K_{X+Y}=K_X+K_Y$, with no cross terms to track.

  - node: quant-probability.mgf.standard-mgfs
    hook: >
      This table is expected memorized cold, but the domain column is what
      actually separates a candidate who understands the transform from one
      who's pattern-matched a formula sheet.
    explanation: >
      Every entry drops out of the same LOTUS computation done directly.
      Exponential$(\lambda)$ is the clearest: $M(t) = \int_0^{\infty}
      e^{tx}\lambda e^{-\lambda x}\,dx = \lambda\int_0^{\infty}
      e^{-(\lambda-t)x}\,dx$, and this converges to $\lambda/(\lambda-t)$
      exactly when $\lambda-t>0$, i.e. $t<\lambda$; for $t\ge\lambda$ the
      integrand no longer decays and the integral is infinite.

      That one computation explains the entire one-sided-domain pattern: any
      law whose tail decays like $e^{-\lambda x}$ can only absorb an extra
      $e^{tx}$ growth factor up to rate $t=\lambda$ before the product stops
      decaying — geometric, exponential and gamma all cut off at their own
      decay rate, while Bernoulli, binomial, Poisson and normal have tails
      that vanish faster than any exponential rate, so no $t$ ever breaks
      them.

      The normal entry needs a genuine integral trick (completing the square
      in the Gaussian density) rather than a geometric-style sum, but the
      mechanism producing "finite for all $t$" is the same tail argument: a
      Gaussian tail decays faster than any exponential.
    worked: >
      Geometric$(p=0.5)$ on $\{1,2,\dots\}$ has $M(t) = 0.5e^{t}/(1-0.5e^{t})$,
      valid only for $t<\ln 2\approx0.693$. At $t=0.6$: $0.5e^{0.6}\approx
      0.911$, so $M(0.6)\approx0.911/(1-0.911)\approx10.2$ — finite but
      already large. At $t=0.7$, just past the boundary: $0.5e^{0.7}\approx
      1.007>1$, so the defining sum $\sum_k (0.5e^{0.7})^{k-1}(0.5)e^{0.7}$
      diverges — the MGF genuinely stops existing exactly where the
      restriction says it should.
    interview: >
      "State the MGF of a Poisson, exponential or normal" is asked directly
      and fast — fluency means naming the domain restriction unprompted for
      exponential and geometric, since forgetting it signals rote memory.
    pitfalls: >
      Quoting the exponential or geometric MGF as valid "for all $t$" —
      copying the always-finite pattern of Bernoulli, binomial, Poisson and
      normal onto laws with an actual tail cutoff. Mixing up which parameter
      bounds $t$: the rate $\lambda$ for exponential and gamma, versus
      $\ln(1/q)$ for geometric.
    recap: >
      Every entry in the table is one LOTUS computation, and whether the
      domain is "all $t$" or cuts off at the law's own tail-decay rate is
      determined entirely by how fast that tail decays.
    steps:
      - teach: >
          This table is expected memorized cold, but the domain column is
          what actually separates a candidate who understands the transform
          from one who has pattern-matched a formula sheet.
      - teach: >
          Every entry drops out of the same LOTUS integral done directly.
          Exponential$(\lambda)$ is the clearest: $M(t) =
          \lambda\int_0^{\infty} e^{-(\lambda-t)x}\,dx = \lambda/(\lambda-t)$,
          convergent exactly when $t<\lambda$ — past that the integrand no
          longer decays.
      - teach: >
          Take Exponential$(\lambda=2)$: $M(t)=2/(2-t)$, valid for $t<2$.
      - ask: >
          What is $M(1)$ for that exponential?
        expects: "2"
        hint: >
          Substitute $t=1$ into $2/(2-t)$.
        feedback: >
          $M(1) = 2/(2-1) = 2$.
      - teach: >
          Any law whose tail decays like $e^{-\lambda x}$ can only absorb an
          extra $e^{tx}$ growth factor up to rate $t=\lambda$ — geometric,
          exponential and gamma all cut off at their own decay rate, while
          Bernoulli, binomial, Poisson and normal have tails that vanish
          faster than any exponential rate, so no $t$ ever breaks them.
      - ask: >
          Which of these has an MGF finite for every real $t$?
        choices:
          - text: >
              Exponential$(\lambda)$
            feedback: >
              This cuts off at $t=\lambda$ — its tail decays at exactly
              rate $\lambda$, so beyond that the integral diverges.
          - text: >
              Poisson$(\lambda)$
            correct: true
            feedback: >
              Correct — the Poisson pmf decays faster than any exponential
              rate ($1/k!$ beats any $c^{k}$), so its MGF
              $\exp(\lambda(e^{t}-1))$ is finite for every $t$.
          - text: >
              Geometric$(p)$
            feedback: >
              This cuts off at $t=\ln(1/q)$, matching its own geometric
              decay rate.
        feedback: >
          Whether the domain is "all $t$" or a one-sided cutoff is
          determined entirely by how fast the law's own tail decays.
      - ask: >
          What happens to $M(t)=2/(2-t)$ for Exponential$(2)$ as
          $t\to2^{-}$?
        choices:
          - text: >
              It approaches a finite limit
            feedback: >
              The denominator $2-t$ shrinks toward $0$ while the numerator
              stays fixed at $2$ — the ratio cannot stay bounded.
          - text: >
              It diverges to infinity
            correct: true
            feedback: >
              Correct — the MGF genuinely stops existing exactly where the
              restriction $t<\lambda$ says it should.
          - text: >
              It becomes negative
            feedback: >
              $2/(2-t)$ stays positive throughout $t<2$; it blows up rather
              than changing sign.
        feedback: >
          The cutoff at $t=\lambda$ is not a technicality — the MGF is
          genuinely infinite past it.
      - teach: >
          Fluency here means naming the domain restriction unprompted for
          exponential and geometric — forgetting it signals the table was
          memorized by rote rather than derived from the tail.

  - node: quant-probability.mgf.identification
    hook: >
      Once two transforms agree, you're done — this is what makes "compute
      the MGF and match it to the table" a complete method of identifying an
      unknown law, not just a heuristic.
    explanation: >
      The PGF version needs no extra hypothesis and is genuinely elementary:
      a power series is entirely determined by its coefficients, and two
      power series agreeing on any interval, however small, agree termwise.
      Since $G_X$'s coefficients are exactly $X$'s pmf, matching PGFs
      anywhere inside their common radius of convergence already forces the
      two pmfs to be identical.

      MGF uniqueness is a strictly deeper fact. $M_X$ is not a power series
      restricted to countably many integer-indexed coefficients the way
      $G_X$ is, so recovering the law genuinely requires an inversion
      argument relating the transform back to a pmf or density — which is
      why this result is only stated here, not proved.

      The payoff is a recipe: compute an unknown law's transform, match the
      closed form against a recognizable formula, and the law is determined —
      no separate argument needed. But the MGF version needs the finiteness
      hypothesis on a genuine neighborhood of $0$; having every individual
      moment finite is strictly weaker and never substitutes for confirming
      the transforms actually match.
    worked: >
      Suppose $X$ has PGF $G_X(s)=0.2+0.3s+0.5s^{2}$ and $Y$'s PGF is only
      known to agree with $G_X$'s on the tiny interval $(-0.1,0.1)$. Because
      both are finite power series agreeing at infinitely many points in that
      interval, every coefficient must match: $\Pr(Y=0)=0.2$, $\Pr(Y=1)=0.3$,
      $\Pr(Y=2)=0.5$, identical to $X$ — even though agreement was only
      confirmed on a small interval near $0$.
    interview: >
      "How do you know this is a [named distribution]" wants "its transform
      matches the known form on an interval around $0$" as the complete
      justification. Interviewers listen for candidates who don't hedge by
      also checking moments individually, since that's unnecessary once the
      transforms match.
    pitfalls: >
      Treating agreement of individual moments, even infinitely many, as
      equivalent to matching the transform — it's strictly weaker and can
      fail to pin down the law. Invoking MGF uniqueness without first
      confirming both MGFs are finite on a shared neighborhood of $0$.
    recap: >
      Equal PGFs on any interval, or equal and genuinely finite MGFs near
      $t=0$, force equal distributions — matching a transform is a complete
      proof of identity, not just supporting evidence.
    steps:
      - teach: >
          Once two transforms agree, you're done — this is what makes
          "compute the transform and match it to the table" a complete
          method of identifying an unknown law, not just a heuristic.
      - teach: >
          The PGF version needs no extra hypothesis: a power series is
          entirely determined by its coefficients, so two PGFs agreeing on
          any interval, however small, force every coefficient — every
          probability — to match. MGF uniqueness is strictly deeper and
          needs the finiteness hypothesis on a genuine neighborhood of $0$.
      - teach: >
          Suppose $G_X(s)=0.1+0.4s+0.5s^{2}$, and $Y$'s PGF is only known to
          agree with $G_X$'s on the tiny interval $(-0.05, 0.05)$.
      - ask: >
          What must $\Pr(Y=2)$ equal?
        expects: "0.5"
        hint: >
          Two power series agreeing on any interval, however small, agree
          termwise.
        feedback: >
          $0.5$ — agreement on $(-0.05,0.05)$ already forces every
          coefficient to match, so $\Pr(Y=2)=\Pr(X=2)=0.5$ even though only
          a tiny interval near $0$ was confirmed.
      - teach: >
          The payoff is a recipe: compute an unknown law's transform, match
          the closed form against a recognizable formula, and the law is
          determined. But the MGF version needs the finiteness hypothesis
          confirmed first — it is not decoration.
      - ask: >
          Two variables have every individual moment equal,
          $\mathbb{E}[X^{k}]=\mathbb{E}[Y^{k}]$ for every $k$. Does this
          guarantee they share a distribution?
        choices:
          - text: >
              Yes, matching moments always suffices
            feedback: >
              Matching every individual moment is strictly weaker than
              matching the transform itself, and can fail to pin down the
              law.
          - text: >
              No — moment-matching is strictly weaker than matching the
              full transform
            correct: true
            feedback: >
              Correct — this is exactly the gap the finiteness hypothesis
              closes.
          - text: >
              Only if both variables are nonnegative-integer valued
            feedback: >
              This qualifier is beside the point — the gap between
              moment-matching and transform-matching exists regardless.
        feedback: >
          Individually matching every moment never substitutes for
          confirming the transforms themselves agree.
      - ask: >
          What must be confirmed before invoking MGF uniqueness on two
          variables?
        choices:
          - text: >
              Both MGFs are finite on a genuine interval around $0$, not
              just at isolated points
            correct: true
            feedback: >
              Correct — this is the standing hypothesis the theorem
              requires.
          - text: >
              All individual moments of both variables exist
            feedback: >
              That is the weaker condition that does not substitute for
              genuine finiteness on an interval.
          - text: >
              Nothing extra — matching values at one point suffices
            feedback: >
              A single matching value proves nothing; agreement must hold on
              an interval, not a point.
        feedback: >
          MGF uniqueness needs finiteness on a real neighborhood of $0$
          confirmed on both sides before it can be invoked.
      - teach: >
          "How do you know this is a [named distribution]" wants "its
          transform matches the known form on an interval around $0$" as
          the complete justification — no separate moment check needed once
          the transforms match.

  - node: quant-probability.mgf.additive-families
    hook: >
      This is where the toolkit cashes out: naming the sum of two named laws
      by eye, from the shape of a product, is one of the fastest moves
      available at a desk.
    explanation: >
      What makes a family "additive" isn't a coincidence to memorize case by
      case — it's a direct reading of the table's algebraic shape. Poisson's
      MGF $e^{\lambda(e^{t}-1)}$ multiplies to $e^{(\lambda_1+\lambda_2)
      (e^{t}-1)}$, still Poisson with rates added; normal's
      $\exp(\mu t+\sigma^{2}t^{2}/2)$ multiplies to a normal MGF with means
      and variances added; any family whose MGF is an exponential of
      something linear or quadratic in a shared parameter closes under
      addition this way.

      A matching transform is already a complete proof of identity, so
      recognizing the algebraic shape of a product is itself the whole
      argument — no separate reasoning about the shape of a sum's pmf or
      density is ever needed.

      The one thing that must be shared for the trick to fire is whichever
      parameter the family's shape treats as fixed: exponentials-to-gamma
      need the same rate $\lambda$ in every summand — different rates give a
      genuinely different, non-gamma law — and the same discipline applies to
      any other additive family.
    worked: >
      $X\sim\text{Binomial}(4,0.5)$ and $Y\sim\text{Binomial}(3,0.5)$
      independent, same success probability: $M_X(t)M_Y(t) =
      (0.5+0.5e^{t})^{4}(0.5+0.5e^{t})^{3} = (0.5+0.5e^{t})^{7}$, exactly the
      Binomial$(7,0.5)$ MGF, so $X+Y\sim\text{Binomial}(7,0.5)$. Reading off
      one probability, $\Pr(X+Y=0) = (0.5)^{7} = 1/128 \approx 0.0078$.
    interview: >
      "What's the distribution of the sum of two independent [named laws]"
      wants the two table MGFs multiplied and the resulting shape recognized
      by eye. A sharp follow-up changes one parameter to check you notice
      when the shared-parameter condition breaks.
    pitfalls: >
      Assuming any two members of the same family add cleanly regardless of
      parameters — binomials need the same $p$, exponentials-to-gamma need
      the same $\lambda$. Forgetting the shortcut still needs independence,
      exactly as the underlying product rule does.
    recap: >
      Multiplying two table MGFs and recognizing the product's shape
      identifies a sum's law instantly — Binomial$(4,0.5)$ plus
      Binomial$(3,0.5)$ is Binomial$(7,0.5)$ — provided the shared parameter
      genuinely matches.
    steps:
      - teach: >
          This is where the toolkit cashes out: naming the sum of two named
          laws by eye, from the shape of a product, is one of the fastest
          moves available at a desk.
      - teach: >
          What makes a family "additive" is a direct reading of the table's
          algebraic shape: any family whose MGF is an exponential of
          something linear or quadratic in a shared parameter closes under
          addition, since multiplying two such exponentials adds the
          exponents.
      - teach: >
          $X\sim N(2,1)$ and $Y\sim N(-1,3)$ independent:
          $M_X(t)=\exp(2t+t^{2}/2)$ and $M_Y(t)=\exp(-t+1.5t^{2})$.
      - ask: >
          What is $\mathbb{E}[X+Y]$?
        expects: "1"
        hint: >
          The linear coefficient of $t$ in the product's exponent is the
          mean.
        feedback: >
          $M_X(t)M_Y(t)=\exp(t+2t^{2})$, and the exponent's linear term is
          $(2-1)t=t$ — matching $\mathbb{E}[X]+\mathbb{E}[Y]=2+(-1)=1$.
      - teach: >
          The one thing that must be shared for the trick to fire is
          whichever parameter the family's shape treats as fixed —
          exponentials-to-gamma need the same rate $\lambda$ in every
          summand; a matching transform is already a complete proof of
          identity, so recognizing the shape of the product is the whole
          argument.
      - ask: >
          What is $\operatorname{Var}(X+Y)$?
        expects: "4"
        hint: >
          The exponent's quadratic coefficient is $\sigma^{2}/2$.
        feedback: >
          The quadratic coefficients add: $0.5+1.5=2$, and since the normal
          MGF's exponent is $\sigma^{2}t^{2}/2$, the variance is
          $2(2)=4$ — matching $\operatorname{Var}(X)+\operatorname{Var}(Y)=1+3=4$.
      - ask: >
          $X\sim\text{Exponential}(2)$ and $Y\sim\text{Exponential}(3)$ are
          independent. Is $X+Y$ gamma-distributed via this shortcut?
        choices:
          - text: >
              Yes, always — gamma with shape $2$ and rate $5$
            feedback: >
              The exponentials-to-gamma shortcut needs the same rate in
              every summand; these have different rates.
          - text: >
              No — the shortcut needs a shared rate $\lambda$, and these
              have different rates
            correct: true
            feedback: >
              Correct — with mismatched rates, $M_X(t)M_Y(t)$ does not
              reduce to any single named table entry.
          - text: >
              Yes, gamma with shape $2$ and rate $2$
            feedback: >
              This ignores $Y$'s rate entirely — both rates enter the
              product, and they do not match.
        feedback: >
          Assuming any two members of the same family add cleanly regardless
          of parameters is the standard slip — binomials need the same $p$,
          exponentials-to-gamma need the same $\lambda$.
      - teach: >
          The shortcut still needs independence, exactly as the underlying
          product rule does — a matched shared parameter alone is not
          enough without it.

  - node: quant-probability.mgf.mgf-nonexistence
    hook: >
      The MGF's existence isn't a technicality to wave past — it's precisely
      the boundary between distributions with at least exponentially light
      tails and every heavier-tailed law used to model real losses.
    explanation: >
      For $t>0$ with $M_X(t)<\infty$, apply Markov's inequality — for
      nonnegative $Y$ and $a>0$, $\Pr(Y\ge a)\le\mathbb{E}[Y]/a$ — to
      $Y=e^{tX}$ and $a=e^{tx}$: since $e^{tX}$ is increasing in $X$ for
      $t>0$, $\Pr(X>x)=\Pr(e^{tX}>e^{tx})\le \mathbb{E}[e^{tX}]/e^{tx} =
      M_X(t)e^{-tx}$. Optimizing this bound over every valid $t>0$ is the
      Chernoff technique, and it's only available when $M_X(t)$ is finite for
      some $t>0$ at all.

      Read backward, this is why heavy tails kill the MGF: an exponentially
      decaying tail bound is only possible when the tail itself decays at
      least that fast, so any law whose true tail is heavier than every
      exponential rate — lognormal, Pareto, Student's $t$ on the right,
      Cauchy on both sides — has $M_X(t)=\infty$ for every $t>0$ (or every
      $t\ne0$, if the tail is heavy on both sides).

      The implication runs the other way too: $|x|^{k}\le k!\,e^{h|x|}/h^{k}$
      bounds a polynomial by an exponential for large $|x|$, so finiteness of
      $M_X$ on $(-h,h)$ forces $\mathbb{E}|X|^{k}<\infty$ for every $k$ at
      once — stronger than checking moments one at a time.
    worked: >
      Take $\Pr(X=n) = C/n^{5}$ for $n=1,2,3,\dots$, with $C$ chosen so the
      probabilities sum to $1$ — light enough that $\mathbb{E}[X]$ and even
      $\mathbb{E}[X^{3}]$ are finite. Yet for any $t>0$, the $n$-th term of
      $M_X(t)=C\sum_n e^{tn}/n^{5}$ grows without bound, since $e^{tn}$ is
      exponential in $n$ while $n^{5}$ is only polynomial, so the series
      diverges to $+\infty$. Every polynomial tail, however light, kills the
      MGF for every positive $t$.
    interview: >
      "Does the lognormal have an MGF? Does it have all its moments?" checks
      whether you keep the two questions separate — every moment can be
      finite while the MGF is infinite for every positive $t$.
    pitfalls: >
      Assuming "all moments finite" implies the MGF exists — it doesn't, and
      the lognormal is the standing counterexample. Forgetting the Chernoff
      bound only uses whichever $t>0$ makes $M_X(t)$ finite; with no such
      $t$, there's nothing to optimize.
    recap: >
      An MGF finite near $0$ is equivalent to an exponentially light tail,
      delivering the Chernoff bound and forcing every moment finite —
      heavy-tailed laws simply fail this test.
    steps:
      - teach: >
          The MGF's existence is not a technicality to wave past — it is
          precisely the boundary between distributions with exponentially
          light tails and every heavier-tailed law used to model real
          losses.
      - teach: >
          For $t>0$ with $M_X(t)<\infty$, applying Markov's inequality to
          $e^{tX}$ gives $\Pr(X>x)\le M_X(t)e^{-tx}$ — an exponentially
          decaying tail bound, available only when some such $t$ exists at
          all.
      - teach: >
          Suppose $M_X(1)=4$ is known to be finite.
      - ask: >
          What upper bound does this give for $\Pr(X\ge2)$?
        expects: "0.5413"
        tolerance: 0.0005
        hint: >
          $\Pr(X\ge2)=\Pr(e^{X}\ge e^{2})\le\mathbb{E}[e^{X}]/e^{2}$.
        feedback: >
          $\Pr(X\ge2)\le M_X(1)/e^{2} = 4/e^{2}\approx 4/7.389\approx
          0.5413$.
      - teach: >
          Read backward, heavy tails kill the MGF: any law whose true tail
          is heavier than every exponential rate has $M_X(t)=\infty$ for
          every $t>0$, since an exponentially decaying bound is only
          possible when the tail itself decays at least that fast.
      - ask: >
          $\Pr(X=n)=C/n^{4}$ for $n=1,2,3,\dots$, light enough that
          $\mathbb{E}[X]$ and $\mathbb{E}[X^{2}]$ are both finite. Does
          $M_X(t)$ exist for any $t>0$?
        choices:
          - text: >
              Yes, since the moments are all finite
            feedback: >
              Finite individual moments say nothing about the MGF — every
              polynomial tail, however light, still loses to $e^{tn}$ as
              $n\to\infty$.
          - text: >
              No — for any $t>0$, $e^{tn}$ eventually dominates the
              polynomial decay $1/n^{4}$
            correct: true
            feedback: >
              Correct — the series $\sum_n e^{tn}/n^{4}$ diverges for every
              $t>0$, so the MGF is infinite there despite every finite
              moment.
          - text: >
              Only for very small $t$, close to $0$
            feedback: >
              There is no such window — exponential growth eventually beats
              any fixed polynomial decay rate, for every positive $t$.
        feedback: >
          A polynomial tail, however light, always loses to $e^{tn}$
          eventually — the MGF fails for every $t>0$ regardless of how many
          moments are finite.
      - ask: >
          If $M_X$ is finite on $(-h,h)$ for some $h>0$, what can you
          conclude about $\mathbb{E}|X|^{10}$?
        choices:
          - text: >
              It is finite
            correct: true
            feedback: >
              Correct — $|x|^{k}\le k!\,e^{h|x|}/h^{k}$ bounds any power by
              an exponential, so finiteness on an interval forces every
              moment finite at once.
          - text: >
              It might be infinite
            feedback: >
              Finiteness on a genuine interval around $0$ is strictly
              stronger than that — it forces every moment finite
              simultaneously.
          - text: >
              It has to be checked separately
            feedback: >
              That is exactly what the interval hypothesis makes
              unnecessary — one bound covers every power at once.
        feedback: >
          Finiteness of the MGF on an interval is stronger than checking
          moments one at a time — it delivers all of them together.
      - teach: >
          "Does the lognormal have an MGF? Does it have all its moments?"
          checks whether you keep the two questions separate — every moment
          can be finite while the MGF is infinite for every positive $t$.

  - node: quant-probability.mgf.characteristic-function
    hook: >
      Knowing this exists, and exactly why it never fails where the MGF can,
      matters more at this level than computing with it — it's the tool that
      makes the general limit theorems possible for laws the MGF can't touch.
    explanation: >
      The property that makes $e^{itX}$ universally safe where $e^{tX}$ isn't
      is boundedness: $|e^{itX}| = |\cos(tX)+i\sin(tX)| = 1$ for every real
      $t$ and every outcome, since $\cos^{2}+\sin^{2}=1$ pins the magnitude to
      exactly $1$. Averaging a quantity that never exceeds $1$ in magnitude
      can never diverge, so $\varphi_X(t)=\mathbb{E}[e^{itX}]$ exists for
      every random variable and every real $t$ — no tail-weight assumption
      required.

      It isn't a different object from the MGF, just its restriction to the
      imaginary axis made safe: $\varphi_X(t) = \mathbb{E}[\cos(tX)] +
      i\,\mathbb{E}[\sin(tX)]$ is two real expectations of bounded functions
      packaged as one complex number, so ordinary LOTUS applies to each piece
      separately.

      The two theorems that made the MGF valuable transfer over with the side
      conditions stripped: independent summands still multiply, $\varphi_{X+Y}
      =\varphi_X\varphi_Y$, and equal characteristic functions still force
      equal distributions, with no finiteness hypothesis to verify. That
      unconditional uniqueness is why limit theorems are built on
      characteristic functions rather than MGFs.
    worked: >
      Bernoulli$(0.5)$ has $\varphi(t)=0.5+0.5e^{it}$. At $t=\pi/2$: $\varphi
      (\pi/2) = 0.5+0.5(\cos(\pi/2)+i\sin(\pi/2)) = 0.5+0.5i$, magnitude
      $\sqrt{0.5^{2}+0.5^{2}} = \sqrt{0.5}\approx0.707$ — comfortably below
      $1$, as any average of unit-magnitude complex numbers must be.
    interview: >
      "What do you do when the MGF doesn't exist" is answered by naming the
      characteristic function and stating why it always exists. Full
      computational fluency is rarely expected at this level, but knowing
      it's the standard repair is.
    pitfalls: >
      Assuming a distribution with no MGF, like Cauchy, has no transform at
      all — the characteristic function always exists. Trying to
      differentiate $\varphi_X$ at $0$ to extract moments of a variable whose
      moments don't exist, since differentiating can fail even though
      $\varphi_X$ itself is perfectly well-defined.
    recap: >
      The characteristic function $\mathbb{E}[e^{itX}]$ exists for every real
      random variable and every real $t$, because $|e^{itX}|=1$ keeps the
      integrand bounded, and it inherits the MGF's product and uniqueness
      rules with no hypotheses left to check.
    steps:
      - teach: >
          Knowing this exists, and exactly why it never fails where the MGF
          can, matters more at this level than computing with it — it's the
          tool the general limit theorems are built on.
      - teach: >
          $|e^{itX}| = |\cos(tX)+i\sin(tX)| = 1$ for every real $t$ and
          every outcome, since $\cos^{2}+\sin^{2}=1$. Averaging a quantity
          that never exceeds $1$ in magnitude can never diverge, so
          $\varphi_X(t)=\mathbb{E}[e^{itX}]$ exists for every random
          variable and every real $t$ — no tail-weight assumption required.
      - teach: >
          Bernoulli$(0.2)$: $\varphi(t) = 0.8+0.2e^{it}$.
      - ask: >
          What is $\varphi(\pi)$ for that variable?
        expects: "0.6"
        hint: >
          $e^{i\pi} = -1$.
        feedback: >
          $\varphi(\pi) = 0.8+0.2(-1) = 0.6$.
      - teach: >
          The two theorems that made the MGF valuable transfer over with the
          side conditions stripped: independent summands still multiply,
          $\varphi_{X+Y}=\varphi_X\varphi_Y$, and equal characteristic
          functions still force equal distributions, with no finiteness
          hypothesis to verify.
      - ask: >
          What is $|\varphi(\pi/2)|$ for the same variable?
        expects: "0.8246"
        tolerance: 0.0005
        hint: >
          $e^{i\pi/2}=i$, so $\varphi(\pi/2)=0.8+0.2i$; find its magnitude.
        feedback: >
          $\varphi(\pi/2)=0.8+0.2i$, magnitude $\sqrt{0.8^{2}+0.2^{2}} =
          \sqrt{0.68}\approx0.8246$ — comfortably below $1$, as any average
          of unit-magnitude complex numbers must be.
      - ask: >
          Does the Cauchy distribution, which has no MGF for any $t\ne0$,
          have a characteristic function?
        choices:
          - text: >
              No — if the MGF fails, so does the characteristic function
            feedback: >
              This is the common misconception the repair exists to fix —
              the two transforms have entirely different existence
              conditions.
          - text: >
              Yes — $\varphi_X(t)=e^{-|t|}$ exists for every real $t$
              despite the Cauchy having no mean
            correct: true
            feedback: >
              Correct — boundedness of $|e^{itX}|$ never depends on the
              tail, so the characteristic function is unaffected by the
              Cauchy's heavy tails.
          - text: >
              Only for $t=0$
            feedback: >
              It exists for every real $t$, not just $t=0$ — that is the
              entire point of the repair.
        feedback: >
          The characteristic function is unconditional: it exists for every
          random variable, heavy-tailed or not, which is exactly why it
          repairs every case where the MGF fails.
      - teach: >
          Trying to differentiate $\varphi_X$ at $0$ to extract moments of a
          variable whose moments do not exist is the standard misuse —
          $\varphi_X$ itself is always well-defined, but differentiating it
          can still fail.
