unit: quant-probability.mgf
opening: >
  Generating functions and transforms replace the awkward algebra of
  convolutions and joint sums with algebra you already know: multiplying
  polynomials and power series. This unit opens with the probability
  generating function for nonnegative-integer counts — defining
  $\mathbb{E}[s^{X}]$, reading probabilities and moments off its derivatives,
  and multiplying PGFs to handle sums of independent counts, including the
  classic loaded-dice and Sicherman-dice puzzles and compound sums built from
  a random number of terms. The second half repeats the same arc for the
  moment generating function $\mathbb{E}[e^{tX}]$, which covers any
  real-valued variable: moments from derivatives at $0$, an affine scaling
  rule that generates a whole family from one computation, products for
  independent sums, and the standard table of named laws. The unit closes on
  the two facts that make a transform a complete identification method rather
  than a computational shortcut — uniqueness, and the boundary cases where the
  MGF's convenient assumptions genuinely fail and a repair is needed.
lessons:
  - node: quant-probability.mgf.pgf
    hook: >
      Every technique in this chapter — extracting a probability, reading off
      a moment, multiplying two distributions together — starts from treating
      the pmf as coefficients of a function, so the encoding itself is the one
      idea worth internalizing first.
    explanation: >
      You already know LOTUS lets you compute $\mathbb{E}[g(X)]$ by averaging
      $g(x)$ against $X$'s pmf, for any $g$ you choose. Pick $g(x) = s^{x}$
      for a formal placeholder $s$, and the LOTUS sum becomes
      $\sum_k p_k s^{k}$ — a power series whose $k$-th coefficient is exactly
      $\Pr(X=k)$. Nothing about the distribution is discarded; the whole pmf
      has been repacked as a single function of one dummy variable.

      The repacking earns its keep later in this chapter: questions about
      probabilities and moments become questions about a function's Taylor
      coefficients and derivatives, and — the real payoff — the pmf of a sum
      of independent counts becomes an ordinary product of two PGFs instead of
      a convolution sum.

      The two structural facts worth checking first are $G_X(0)=p_0$, since
      only the constant term survives at $s=0$, and $G_X(1)=\sum_k p_k = 1$,
      the pmf's own normalization restated. Both come free from the
      definition and catch a mistyped PGF instantly. Convergence is never in
      doubt inside $(-1,1)$: coefficients are probabilities, bounded by $1$
      and summing to $1$, which forces the radius of convergence to be at
      least $1$.
    worked: >
      A four-sided die is loaded so that face $k$ comes up with probability
      $k/10$ for $k=1,2,3,4$ — that is, $0.1, 0.2, 0.3, 0.4$. Its PGF is
      $G(s) = 0.1s + 0.2s^{2} + 0.3s^{3} + 0.4s^{4}$. Checking the two free
      facts: $G(0) = 0$, matching $\Pr(X=0)=0$ since the die never shows $0$,
      and $G(1) = 0.1+0.2+0.3+0.4 = 1$, confirming the loading is a genuine
      probability distribution.
    interview: >
      "Write down the PGF of this variable" is really asking whether you see
      the definition as bookkeeping, not computation — state
      $G_X(s)=\mathbb{E}[s^{X}]$, expand it as $\sum_k p_k s^{k}$, and check
      $G(1)=1$ out loud before moving on. A common follow-up asks for
      $G_X(0)$ to see whether you know it's just $p_0$ without expanding
      anything.
    pitfalls: >
      Applying the PGF definition to a variable that isn't nonnegative-integer
      valued (continuous, or able to go negative) — it simply isn't defined
      there. Treating $s$ as if it must itself be a probability, rather than a
      free variable ranging at least over $(-1,1)$.
    recap: >
      The PGF $G_X(s)=\mathbb{E}[s^{X}]=\sum_k p_k s^{k}$ is nothing but the
      pmf written as a power series, with $G(0)=p_0$ and $G(1)=1$ as its two
      built-in checks.
    dialogue:
      - part: A clean wafer, at any inspection rate
        teach: >
          A silicon wafer carries $X$ defects: none with probability $0.4$,
          one with probability $0.4$, two with probability $0.2$. Each defect,
          independently, turns out harmless with probability $0.6$. The wafer
          ships only if every one of its defects is harmless.
      - ask: >
          What is the probability the wafer ships?
        expects: "0.712"
        hint: >
          Condition on the number of defects. With $k$ defects, all $k$ must
          be harmless.
        feedback: >
          With $k$ defects the chance all are harmless is $0.6^{k}$, so the
          answer is $0.4(1) + 0.4(0.6) + 0.2(0.36) = 0.4 + 0.24 + 0.072 =
          0.712$. You averaged $0.6^{X}$ against the pmf of $X$ — LOTUS with
          $g(x) = 0.6^{x}$.
      - ask: >
          The plant manager wants the answer for every possible harmless rate
          $s$, not just $0.6$. Which function of $s$ gives it?
        choices:
          - text: >
              $s^{0.8}$, since the mean number of defects is $0.8$
            feedback: >
              Putting the mean inside the power is the tempting shortcut, and
              it is wrong: at $s = 0.6$ it gives $0.6^{0.8} \approx 0.66$, not
              $0.712$. The average of $s^{X}$ is not $s$ raised to the average
              of $X$.
          - text: >
              $0.4 + 0.4s + 0.2s$
            feedback: >
              Two defects must both be harmless, which happens with probability
              $s \cdot s = s^{2}$, not $s$. At $s = 0.6$ this gives $0.76$, too
              high.
          - text: >
              $0.4 + 0.4s + 0.2s^{2}$
            correct: true
            feedback: >
              Right: $\mathbb{E}[s^{X}] = \sum_k \Pr(X = k)\,s^{k}$. At
              $s = 0.6$ it returns the $0.712$ you computed.
        feedback: >
          One LOTUS sum with $g(x) = s^{x}$ answers the question at every rate
          at once. The result is a polynomial whose coefficients are exactly
          the defect probabilities.
      - ask: >
          Now the inspection is ruthless: no defect is ever harmless, $s = 0$.
          What does the function give?
        expects: "0.4"
        hint: >
          Which terms of $0.4 + 0.4s + 0.2s^{2}$ survive at $s = 0$?
        feedback: >
          Only the constant term survives, so the value is $0.4$ — the chance
          the wafer has no defects at all, $\Pr(X = 0)$. That is the only way
          to ship when every defect is fatal.
      - ask: >
          And at $s = 1$, where every defect is harmless?
        expects: "1"
        feedback: >
          $0.4 + 0.4 + 0.2 = 1$: every wafer ships. At $s = 1$ the function
          just adds up the pmf, so it returns $1$ whatever the defect law
          was.
      - reflect: >
          Suppose someone handed you only the polynomial
          $0.4 + 0.4s + 0.2s^{2}$ and nothing about wafers. What could you
          recover from it, and why would that make it worth writing down for
          any count, not just this one?
        answer: >
          Everything. The coefficient of $s^{k}$ is $\Pr(X = k)$, so the whole
          pmf can be read back off the polynomial; nothing about the
          distribution was thrown away. It is the law of $X$ stored as one
          function of a dummy variable $s$, and functions can be evaluated,
          differentiated and multiplied — operations that a list of
          probabilities does not invite.

      - part: The name, and its two free checks
        teach: >
          For $X$ taking values in $\{0, 1, 2, \dots\}$ with $p_k = \Pr(X = k)$,
          the probability generating function is
          $G_X(s) = \mathbb{E}[s^{X}] = \sum_{k \ge 0} p_k s^{k}$. The harmless
          rate was one reading of $s$; in general $s$ is a free variable, not a
          probability. You have already found its two free readings:
          $G_X(0) = p_0$ and $G_X(1) = 1$. Because the coefficients are at most
          $1$ and sum to $1$, the series converges at least on $(-1, 1)$.
      - ask: >
          A trader's number of fills in a minute is $1$, $2$ or $4$ with
          probabilities $0.2$, $0.6$, $0.2$. Which is its PGF?
        choices:
          - text: >
              $0.2 + 0.6s + 0.2s^{2}$
            feedback: >
              This lists the probabilities in order and forgets which values
              they belong to. The exponent is the value, so $0.2$ sits on
              $s^{1}$ and the last $0.2$ on $s^{4}$; here $G(0) = 0.2$ would
              claim zero fills happen, and they never do.
          - text: >
              $0.2s + 0.6s^{2} + 0.2s^{3}$
            feedback: >
              Close, but the third value is $4$, not $3$. The gap at $3$ is a
              zero coefficient, and the exponents must jump to $s^{4}$.
          - text: >
              $0.2s + 0.6s^{2} + 0.2s^{4}$
            correct: true
            feedback: >
              Exponent equals value, coefficient equals probability. $G(0) = 0$,
              since zero fills is impossible, and $G(1) = 1$.
        feedback: >
          Writing a PGF is bookkeeping: one term $p_k s^{k}$ per possible value
          $k$, with the missing values carrying coefficient $0$.
      - ask: >
          Each fill, independently, clears the risk check with probability
          $0.5$. Using that PGF, what is the probability every fill in the
          minute clears?
        expects: "0.2625"
        tolerance: 0.0005
        hint: >
          The question is $\mathbb{E}[0.5^{X}]$ — evaluate the PGF at
          $s = 0.5$.
        feedback: >
          $G(0.5) = 0.2(0.5) + 0.6(0.25) + 0.2(0.0625) = 0.1 + 0.15 + 0.0125 =
          0.2625$. Evaluating a PGF at a number between $0$ and $1$ always has
          this reading: the chance that every one of $X$ independent trials
          succeeds.

      - part: Spotting a fake
        ask: >
          A colleague proposes $G(s) = 0.6 + 0.6s - 0.2s^{2}$ as a PGF and
          points out that $G(1) = 1$. Is it one?
        choices:
          - text: >
              Yes: $G(1) = 1$ is the check, and it passes.
            feedback: >
              $G(1) = 1$ is necessary, not sufficient. Read the coefficients:
              it claims $\Pr(X = 2) = -0.2$, and no probability is negative.
          - text: >
              No: $G(0) = 0.6$, and a PGF must vanish at $0$.
            feedback: >
              $G(0) = p_0$ may be anything from $0$ to $1$; the wafer's PGF had
              $G(0) = 0.4$. The flaw is elsewhere.
          - text: >
              No: the coefficient of $s^{2}$ is negative.
            correct: true
            feedback: >
              Every coefficient is a probability, so each must lie in
              $[0, 1]$. The normalization passes and the candidate still
              fails.
        feedback: >
          A genuine PGF has nonnegative coefficients summing to $1$. Running
          $G(1) = 1$ catches a mistyped normalization; reading the
          coefficients catches the rest.
      - ask: >
          A stock moves $-1$, $0$ or $+1$ tick in a second, with probabilities
          $0.3$, $0.4$, $0.3$. What goes wrong with $\mathbb{E}[s^{X}]$ as a
          PGF here?
        choices:
          - text: >
              Nothing: it is $0.3s^{-1} + 0.4 + 0.3s$, a PGF like any other.
            feedback: >
              The $s^{-1}$ term blows up at $s = 0$, so $G(0) = p_0$ fails and
              this is not a power series in $s$. The definition needs values in
              $\{0, 1, 2, \dots\}$.
          - text: >
              It is not a power series: the value $-1$ produces an $s^{-1}$
              term. Shift to $X + 1$, which lives on $\{0, 1, 2\}$.
            correct: true
            feedback: >
              Right. $X + 1$ has PGF $0.3 + 0.4s + 0.3s^{2}$, a genuine one,
              and every question about $X$ is a question about $X + 1$.
          - text: >
              $s^{X}$ cannot be computed at all when $X$ is negative.
            feedback: >
              $s^{-1} = 1/s$ is perfectly computable for $s \ne 0$. The trouble
              is narrower: the expression stops being a power series, and it
              is undefined at $s = 0$.
        feedback: >
          The PGF is built for counts. A variable that can go negative, or is
          continuous, needs either a shift onto $\{0, 1, 2, \dots\}$ or a
          different transform.
      - teach: >
          In an interview, "write down the PGF" is bookkeeping said aloud: one
          term per value, coefficient equals probability, and then
          $G(1) = 1$ checked before anything else. Everything this chapter
          does next — extracting probabilities, reading off moments,
          multiplying distributions — is an operation on that one function.

  - node: quant-probability.mgf.pgf-probabilities
    hook: >
      In practice you never differentiate a PGF to extract a probability —
      you expand it algebraically and read the term off — but knowing why the
      two routes agree is what lets you invent the parity shortcut on the
      spot instead of memorizing it.
    explanation: >
      Coefficient extraction is nothing but Taylor's theorem: the coefficient
      of $s^{k}$ in $G_X(s)=\sum_j p_j s^{j}$ is retrieved by differentiating
      $k$ times and dividing by $k!$, since every other term either vanishes
      at $s=0$ or still carries a leftover factor of $s$. Expanding
      algebraically and reading off the coefficient does the identical job
      with less bookkeeping, which is why that's the default move.

      The parity shortcut is worth deriving once so it never needs to be
      looked up. Evaluate the series at $s=-1$: $G_X(-1)=\sum_k p_k(-1)^{k}$
      adds every even-$k$ probability and subtracts every odd-$k$ one, so
      $G_X(-1) = \Pr(X\text{ even}) - \Pr(X\text{ odd})$. Since
      $G_X(1)=1=\Pr(X\text{ even})+\Pr(X\text{ odd})$ as well, adding the two
      equations and dividing by $2$ isolates $\Pr(X\text{ even})$ with no
      further work.

      Both shortcuts — value at $0$, and the parity split at $-1$ — turn a
      question about the whole pmf into one substitution, which is faster
      than expanding a series just to read a single term.
    worked: >
      Flip a coin with $\Pr(\text{heads})=1/3$ four times and let $X$ count
      the heads: $G(s) = (2/3+s/3)^{4}$. Expanding via the binomial theorem,
      $\Pr(X=2) = \binom{4}{2}(1/3)^{2}(2/3)^{2} = 6\cdot(1/9)(4/9) = 24/81 =
      8/27$. For the parity split, $G(-1) = (2/3-1/3)^{4} = (1/3)^{4} = 1/81$,
      so $\Pr(X\text{ even}) = (1 + 1/81)/2 = 41/81 \approx 0.506$.
    interview: >
      "Given this PGF, what's $\Pr(X=k)$" wants an algebraic expansion, not a
      literal derivative computed term by term. A sharper follow-up — "is $X$
      more likely to be even or odd" — is answered instantly by the parity
      trick without touching the pmf at all.
    pitfalls: >
      Forgetting the $k!$ in the coefficient formula is an easy
      off-by-a-factorial error. Differentiating at $s=1$ or $s=-1$ as if that
      were guaranteed as safely as at points strictly inside $(-1,1)$ —
      $G_X$ is only promised to be continuous, not differentiable, at the
      endpoints.
    recap: >
      Coefficients of $G_X$ are literally the probabilities, extracted by
      Taylor's formula or, faster, by matching an algebraic expansion, and
      $(G(1)+G(-1))/2$ hands you the even/odd split for free.
    dialogue:
      - part: A pmf you can only see through G
        teach: >
          A risk desk logs $X$ trade breaks a day. The pmf was never written
          down; all that survives is its generating function,
          $G(s) = (1 + s + s^{2})^{2}/9$.
      - ask: >
          What is the probability of a day with no breaks?
        expects: "1/9"
        hint: >
          Which probability does $G(0)$ return?
        feedback: >
          $G(0) = (1 + 0 + 0)^{2}/9 = 1/9$. At $s = 0$ only the constant term
          of the series survives, and the constant term is $p_0$.
      - ask: >
          What is $\Pr(X = 2)$?
        expects: "1/3"
        hint: >
          Square $1 + s + s^{2}$ and read the coefficient of $s^{2}$.
        feedback: >
          $(1 + s + s^{2})^{2} = 1 + 2s + 3s^{2} + 2s^{3} + s^{4}$, so
          $\Pr(X = 2) = 3/9 = 1/3$. The $3$ counts the ways to make $2$ from
          two factors: $0 + 2$, $1 + 1$, $2 + 0$.
      - ask: >
          Expanding worked because the polynomial was small. Is there a value
          of $s$ that isolates $p_2$ for every PGF, the way $s = 0$ isolates
          $p_0$?
        choices:
          - text: >
              $s = 2$, since the value is $2$
            feedback: >
              $G(2) = (1 + 2 + 4)^{2}/9 = 49/9$, which is not even a
              probability. Substituting a value mixes every term together, it
              does not pick one out.
          - text: >
              $s = 1$, where the series is simplest
            feedback: >
              $G(1) = 1$ for every PGF: it adds all the coefficients, the
              opposite of isolating one.
          - text: >
              None: $s = 0$ isolates the constant term, and every other $s$
              keeps all the terms mixed.
            correct: true
            feedback: >
              Right. Substitution alone can only reach $p_0$. To reach $p_2$
              you must first do something to $G$ that moves $p_2$ into the
              constant position.
        feedback: >
          Evaluation at $0$ reads the constant term and nothing else. The
          question is how to turn the $s^{2}$ term into a constant term.
      - reflect: >
          $G(s) = p_0 + p_1 s + p_2 s^{2} + p_3 s^{3} + \cdots$. What could you
          do to $G$, and at which point would you then evaluate, so that
          everything except $p_2$ disappears? What number would be left
          multiplying $p_2$?
        answer: >
          Differentiate twice, then set $s = 0$. Two derivatives kill $p_0$
          and $p_1 s$ outright, turn $p_2 s^{2}$ into the constant $2p_2$, and
          leave every higher term with at least one factor of $s$, which
          vanishes at $0$. So $G''(0) = 2!\,p_2$ — divide by $2!$ and $p_2$
          is isolated. This is Taylor's formula for the coefficients of a
          power series.

      - part: Differentiate, then divide by k factorial
        teach: >
          That is the general statement: $\Pr(X = k) = G_X^{(k)}(0)/k!$. The
          $k$-th derivative turns $p_k s^{k}$ into the constant $k!\,p_k$,
          annihilates the lower terms, and leaves the higher ones with a
          leftover power of $s$. In practice you rarely differentiate: you
          expand and read the coefficient, which is the same operation with
          less bookkeeping. The formula is what guarantees the reading.
      - ask: >
          Differentiate $G$ three times. What becomes of the term $p_5 s^{5}$
          when you then set $s = 0$?
        choices:
          - text: >
              It becomes $60p_5$.
            feedback: >
              $60p_5 s^{2}$ is the third derivative, and that is right as far
              as it goes. Setting $s = 0$ then kills it: the leftover $s^{2}$
              is what makes the higher terms vanish.
          - text: >
              It becomes $0$, because the third derivative of a fifth power is
              zero.
            feedback: >
              The third derivative of $s^{5}$ is $60s^{2}$, not $0$; a power
              drops to zero only after more derivatives than its degree. The
              term vanishes for a different reason.
          - text: >
              It becomes $0$, because a factor $s^{2}$ remains and $s = 0$.
            correct: true
            feedback: >
              Right. Lower terms die by differentiation, higher terms die by
              evaluation at $0$, and only the $k$-th term survives both.
        feedback: >
          The two mechanisms split the work: derivatives remove the terms below
          $k$, the point $s = 0$ removes the terms above it.
      - ask: >
          A second desk has $G(s) = (1 + s + s^{2})^{4}/81$. What is
          $\Pr(X = 3)$?
        expects: "16/81"
        tolerance: 0.0005
        hint: >
          Count the ways to pick one exponent from $\{0, 1, 2\}$ in each of four
          factors so they total $3$: three $1$s and a $0$, or one $2$, one $1$
          and two $0$s.
        feedback: >
          Three $1$s and a $0$: $4$ arrangements. One $2$, one $1$, two $0$s:
          $4 \times 3 = 12$ arrangements. So the coefficient of $s^{3}$ is
          $16$ and $\Pr(X = 3) = 16/81 \approx 0.198$.
      - ask: >
          A candidate differentiates that $G$ three times at $0$ and reports
          $\Pr(X = 3) = 96/81$. What went wrong?
        choices:
          - text: >
              Nothing: derivatives are exact, and expansion is only an
              approximation.
            feedback: >
              Both routes are exact and must agree. And $96/81$ exceeds $1$,
              which no probability can.
          - text: >
              They forgot to divide by $3! = 6$.
            correct: true
            feedback: >
              $G'''(0) = 3!\,p_3 = 6 \times 16/81 = 96/81$. The factorial is
              the leftover from differentiating $s^{3}$ three times.
          - text: >
              They should have evaluated at $s = 1$, not $s = 0$.
            feedback: >
              $G'''(1)$ is a factorial moment of $X$, a different quantity.
              Coefficients live at $s = 0$.
        feedback: >
          A "probability" above $1$ is the fastest tell of the missing $k!$.
          Keep the formula as $p_k = G^{(k)}(0)/k!$, factorial included.

      - part: Even or odd, without the pmf
        ask: >
          A third count has $G(s) = (1 + 2s)^{3}/27$. Before touching its pmf,
          evaluate $G(-1)$.
        expects: "-1/27"
        feedback: >
          $G(-1) = (1 - 2)^{3}/27 = -1/27$. A negative value from a PGF —
          which means $G(-1)$ cannot be a probability. Something else is being
          measured.
      - ask: >
          What does $G(-1) = \sum_k p_k (-1)^{k}$ measure?
        choices:
          - text: >
              $\Pr(X = -1)$
            feedback: >
              $X$ never takes negative values, and a probability is never
              $-1/27$. The sign comes from $(-1)^{k}$, not from a value of $X$.
          - text: >
              $\Pr(X \text{ even}) - \Pr(X \text{ odd})$
            correct: true
            feedback: >
              Right. Each even $k$ contributes $+p_k$ and each odd $k$
              contributes $-p_k$, so here odd outcomes outweigh even ones by
              $1/27$.
          - text: >
              $\Pr(X \text{ odd})$
            feedback: >
              The even terms do not vanish at $s = -1$; they come in with a
              plus sign. The sum is a difference of two probabilities.
        feedback: >
          You also know $G(1) = \Pr(X \text{ even}) + \Pr(X \text{ odd}) = 1$.
          Two equations, two unknowns: adding them gives
          $\Pr(X \text{ even}) = (1 + G(-1))/2$.
      - ask: >
          So what is $\Pr(X \text{ even})$ for this count?
        expects: "13/27"
        tolerance: 0.0005
        hint: >
          $(1 + G(-1))/2$, with $G(-1) = -1/27$.
        feedback: >
          $(1 - 1/27)/2 = (26/27)/2 = 13/27 \approx 0.481$. Check by expanding:
          $(1 + 2s)^{3} = 1 + 6s + 12s^{2} + 8s^{3}$, so the even terms give
          $(1 + 12)/27 = 13/27$.
      - teach: >
          Said aloud in an interview: "the coefficient of $s^{k}$ is the
          probability, and I'll expand rather than differentiate". When the
          question turns to parity, one substitution answers it —
          $(1 + G(-1))/2$ — without listing a single probability.

  - node: quant-probability.mgf.pgf-factorial-moments
    hook: >
      Two derivatives of a PGF at a single point replace two separate sums
      for $\mathbb{E}[X]$ and $\mathbb{E}[X^{2}]$ — the entire reason this
      transform is worth building in the first place.
    explanation: >
      Differentiate $G_X(s)=\sum_k p_k s^{k}$ once: $G_X'(s) = \sum_k k\,p_k
      s^{k-1}$, and every term still carries a leftover power of $s$ except
      the $k=1$ term. Setting $s=1$ removes that obstacle entirely, leaving
      $\sum_k k\,p_k = \mathbb{E}[X]$ — which is exactly why this derivative
      is read at $s=1$, not $s=0$: only there does every $s^{k-1}$ collapse to
      $1$ regardless of $k$.

      Differentiate again: $G_X''(s) = \sum_k k(k-1)\,p_k s^{k-2}$, and at
      $s=1$ this is $\sum_k k(k-1)\,p_k = \mathbb{E}[X(X-1)]$, the first
      correction to the raw second moment. Each further derivative at $s=1$
      peels off one more factor of the falling factorial, so the $r$-th
      derivative leaves $\mathbb{E}[X(X-1)\cdots(X-r+1)]$.

      Since $\mathbb{E}[X^{2}] = \mathbb{E}[X(X-1)] + \mathbb{E}[X]$,
      substituting gives $\operatorname{Var}(X) = G_X''(1) + G_X'(1) -
      (G_X'(1))^{2}$ — two derivatives at one point beat computing
      $\mathbb{E}[X^{2}]$ and $\mathbb{E}[X]$ as two separate sums.
    worked: >
      Let $X$ take values $0,1,2$ with probabilities $0.5, 0.3, 0.2$:
      $G(s)=0.5+0.3s+0.2s^{2}$. Then $G'(s)=0.3+0.4s$ gives $G'(1)=0.7 =
      \mathbb{E}[X]$, and $G''(s)=0.4$ gives $G''(1)=0.4 = \mathbb{E}[X(X-1)]$.
      So $\operatorname{Var}(X) = 0.4 + 0.7 - 0.7^{2} = 1.1 - 0.49 = 0.61$,
      matching a direct check: $\mathbb{E}[X^{2}]=1.1$ and $1.1-0.7^{2}=0.61$.
    interview: >
      "Find the mean and variance from this PGF" wants two derivatives
      evaluated at $s=1$, not an attempt to expand the full series and sum
      directly. Expect to be asked why $s=1$ rather than $s=0$ is used here.
    pitfalls: >
      Evaluating these derivatives at $s=0$ out of habit from coefficient
      extraction, instead of $s=1$. Computing
      $\operatorname{Var}(X)=G''(1)-(G'(1))^{2}$ and dropping the $+G'(1)$
      correction term that converts the factorial moment back to a raw one.
    recap: >
      One derivative of $G_X$ at $s=1$ gives the mean, two give
      $\mathbb{E}[X(X-1)]$, and combining both gives variance in a single
      line with no separate sums.
    dialogue:
      - part: Where the mean hides in G
        teach: >
          A quoting engine sends $X$ requotes a second: $0$, $1$, $2$ or $3$
          with probabilities $0.1$, $0.3$, $0.4$, $0.2$. Its generating
          function is $G(s) = 0.1 + 0.3s + 0.4s^{2} + 0.2s^{3}$.
      - ask: >
          Straight from the pmf, what is $\mathbb{E}[X]$?
        expects: "1.7"
        feedback: >
          $0(0.1) + 1(0.3) + 2(0.4) + 3(0.2) = 0.3 + 0.8 + 0.6 = 1.7$.
      - ask: >
          Differentiate: $G'(s) = 0.3 + 0.8s + 0.6s^{2}$. At which $s$ does
          $G'(s)$ equal the $1.7$ you just found?
        choices:
          - text: >
              $s = 0$, where coefficients are read
            feedback: >
              $G'(0) = 0.3$, which is $p_1$ — the coefficient reading from
              Reading probabilities off a PGF. Here the factors of $s$ are in
              the way, not helping.
          - text: >
              $s = 1$
            correct: true
            feedback: >
              $G'(1) = 0.3 + 0.8 + 0.6 = 1.7$. Each term of $G'$ is
              $k p_k s^{k-1}$, and at $s = 1$ every power of $s$ becomes $1$,
              leaving $\sum_k k p_k$.
          - text: >
              $s = -1$
            feedback: >
              $G'(-1) = 0.3 - 0.8 + 0.6 = 0.1$: the signs alternate, so the
              terms partly cancel. Only one point lets all of them through
              unchanged.
        feedback: >
          Differentiation brings down the factor $k$; setting $s = 1$ erases
          the leftover power. What remains is the definition of the mean.
      - ask: >
          Differentiate once more, $G''(s) = 0.8 + 1.2s$. What is $G''(1)$?
        expects: "2"
        feedback: >
          $G''(1) = 0.8 + 1.2 = 2$.
      - ask: >
          The direct sum gives $\mathbb{E}[X^{2}] = 0.3 + 1.6 + 1.8 = 3.7$, not
          $2$. So what did $G''(1)$ compute?
        choices:
          - text: >
              $\mathbb{E}[X^{2}]$, with an arithmetic slip somewhere
            feedback: >
              Both numbers are right. Differentiating $s^{k}$ twice brings down
              $k(k-1)$, not $k^{2}$, so $G''(1)$ is a different average.
          - text: >
              $\operatorname{Var}(X)$
            feedback: >
              $\operatorname{Var}(X) = 3.7 - 1.7^{2} = 0.81$, not $2$. The
              second derivative does not subtract the squared mean.
          - text: >
              $\mathbb{E}[X(X-1)]$
            correct: true
            feedback: >
              Right: $\sum_k k(k-1)p_k = 2(0.4) + 6(0.2) = 2$. And indeed
              $3.7 - 1.7 = 2$, since $X(X-1) = X^{2} - X$.
        feedback: >
          Each derivative at $1$ brings down one more factor of a falling
          product: $k$, then $k(k-1)$. The second derivative is a factorial
          moment, one correction away from the raw one.
      - reflect: >
          You hold $G'(1) = \mathbb{E}[X]$ and $G''(1) = \mathbb{E}[X(X-1)]$.
          How do you get $\operatorname{Var}(X)$ from those two numbers alone,
          and what is it here?
        answer: >
          Add $G'(1)$ to $G''(1)$ to turn $\mathbb{E}[X^{2}] - \mathbb{E}[X]$
          back into $\mathbb{E}[X^{2}]$, then subtract the squared mean:
          $\operatorname{Var}(X) = G''(1) + G'(1) - G'(1)^{2}$. Here that is
          $2 + 1.7 - 2.89 = 0.81$, matching $3.7 - 1.7^{2}$. Two derivatives
          at one point replace two separate sums.

      - part: Every derivative at one, at once
        teach: >
          In general $G_X^{(r)}(1) = \mathbb{E}[X(X-1)\cdots(X-r+1)]$, the
          $r$-th factorial moment, and
          $\operatorname{Var}(X) = G_X''(1) + G_X'(1) - (G_X'(1))^{2}$. For an
          infinite series, the derivative at $1$ means the limit as
          $s \uparrow 1$; every term is nonnegative and increasing in $s$, so
          the limit always exists in $[0, \infty]$ and equals the moment,
          finite or not.
      - ask: >
          A second engine has $G(s) = (1 + s + s^{2})^{3}/27$, with no pmf in
          sight. What is $\mathbb{E}[X]$?
        expects: "3"
        hint: >
          Chain rule: $G'(s) = 3(1 + s + s^{2})^{2}(1 + 2s)/27$. Then set
          $s = 1$.
        feedback: >
          $G'(1) = 3 \cdot 3^{2} \cdot 3/27 = 81/27 = 3$. No expansion of the
          seven-term polynomial was needed.
      - ask: >
          What is $G''(1)$ for the same engine?
        expects: "8"
        hint: >
          Product rule on $3(1 + s + s^{2})^{2}(1 + 2s)/27$: one term from
          differentiating the square, one from differentiating $1 + 2s$.
        feedback: >
          $G''(s) = [6(1 + s + s^{2})(1 + 2s)^{2} + 6(1 + s + s^{2})^{2}]/27$,
          so $G''(1) = [6 \cdot 3 \cdot 9 + 6 \cdot 9]/27 = (162 + 54)/27 = 8$.
      - ask: >
          So what is $\operatorname{Var}(X)$?
        expects: "2"
        feedback: >
          $G''(1) + G'(1) - G'(1)^{2} = 8 + 3 - 3^{2} = 2$. Two derivatives of a
          closed form, against expanding to seven coefficients and summing
          twice.

      - part: Two ways the formula goes wrong
        ask: >
          Another candidate on the same engine reports
          $\operatorname{Var}(X) = G''(1) - G'(1)^{2} = 8 - 9 = -1$. What is
          the diagnosis?
        choices:
          - text: >
              They dropped the $+G'(1)$ that turns $\mathbb{E}[X(X-1)]$ back
              into $\mathbb{E}[X^{2}]$.
            correct: true
            feedback: >
              $G''(1)$ is $\mathbb{E}[X^{2}] - \mathbb{E}[X]$, so subtracting
              the squared mean from it undercounts by exactly
              $\mathbb{E}[X] = 3$. A negative variance is the alarm.
          - text: >
              They should have evaluated the derivatives at $s = 0$.
            feedback: >
              $G'(0)$ and $G''(0)$ are $p_1$ and $2p_2$, coefficients rather
              than moments. The point $s = 1$ was right; the formula was not.
          - text: >
              Nothing: a variance can come out negative for a skewed count.
            feedback: >
              A variance is an average of squares, $\mathbb{E}[(X - \mu)^{2}]$,
              so it is never negative, skewed or not.
        feedback: >
          Mean from one derivative, factorial moment from two, and the
          $+G'(1)$ correction between them: $8 + 3 - 9 = 2$.
      - ask: >
          A count has $p_k = 1/(k(k+1))$ for $k \ge 1$. These sum to $1$, by
          telescoping. What does $G'(s) = \sum_{k \ge 1} s^{k-1}/(k+1)$ do as
          $s \uparrow 1$?
        choices:
          - text: >
              It tends to a finite limit, since $G$ is a valid PGF.
            feedback: >
              A valid PGF is only promised to be continuous at $s = 1$, not
              differentiable there. At $s = 1$ this series is
              $1/2 + 1/3 + 1/4 + \cdots$, which diverges.
          - text: >
              It grows without bound, matching $\mathbb{E}[X] = \infty$.
            correct: true
            feedback: >
              Right. $\mathbb{E}[X] = \sum_k k/(k(k+1)) = \sum_k 1/(k+1)$, the
              harmonic tail. The derivative is infinite exactly when the
              moment is, so the identity still holds — in $[0, \infty]$.
          - text: >
              The limit is undefined, so the method says nothing here.
            feedback: >
              The terms are nonnegative and increase with $s$, so the limit
              exists; it is $+\infty$. The method reports the infinite mean
              correctly.
        feedback: >
          A heavy-tailed count shows up as a PGF that is fine at $s = 1$ but
          has an infinite slope there. Before quoting a variance, make sure
          $G''$ is finite at $1$.
      - teach: >
          Asked "mean and variance from this PGF", say: "$G'(1)$ is the mean,
          $G''(1)$ is $\mathbb{E}[X(X-1)]$, so the variance is
          $G''(1) + G'(1) - G'(1)^{2}$" — and if asked why $s = 1$ and not
          $s = 0$: at $1$ every leftover power of $s$ becomes $1$, at $0$ all
          but one term vanish.

  - node: quant-probability.mgf.standard-pgfs
    hook: >
      This table is expected memorized cold — but the payoff isn't
      memorization itself, it's recognizing the two series identities that
      generate every entry, since that's what lets you rebuild any one of
      them on the spot.
    explanation: >
      Every entry is produced the same way: write the pmf, multiply by
      $s^{k}$, sum. Two series identities do all the work — the binomial
      theorem for Bernoulli and binomial, and the geometric or exponential
      series for everything else: $\sum_{k\ge0} x^{k} = 1/(1-x)$ turns a
      geometric-shaped pmf into a rational function, and $\sum_{k\ge0}
      x^{k}/k! = e^{x}$ turns the Poisson pmf into an exponential. Nothing
      beyond substitution is needed once you recognize which series a pmf's
      tail matches.

      The negative binomial entry is worth noticing structurally: $(ps/(1-qs))^{r}$
      is the geometric PGF raised to the $r$-th power, because a negative
      binomial counting $r$ successes is built from $r$ independent
      geometric waiting times, and independent PGFs multiply — a preview of
      the PGF-of-a-sum rule, visible here before it's even stated.

      The one universal check across every entry is $G(1)=1$: substituting
      $s=1$ collapses each closed form back to the pmf's own normalization —
      $q+p=1$ for Bernoulli and binomial, $p/(1-q)=1$ for geometric since
      $q=1-p$, $e^{0}=1$ for Poisson — one substitution, not a proof.
    worked: >
      Check the negative binomial entry at its smallest possible value: with
      $r=2$ successes and $p=q=1/2$, at least $2$ trials are needed, so
      directly from the pmf $\Pr(X=2) = \binom{1}{1}p^{2} = 1/4$ (two
      successes, no failures). From the PGF, $(ps/(1-qs))^{2}$ expands as
      $(s/2+s^{2}/4+\cdots)^{2}$, and the only way to produce an $s^{2}$ term
      is $(s/2)\times(s/2)$, contributing $1/4$ — matching exactly.
    interview: >
      "State the PGF of a Poisson, binomial or geometric on sight" expects the
      table memorized; interviewers listen for the correct convergence domain
      on the geometric entry, not just the formula, since forgetting it is
      the tell that it was pattern-matched rather than understood.
    pitfalls: >
      Forgetting the domain restriction $|s|<1/q$ on the geometric and
      negative binomial entries — the closed form is only valid there.
      Mixing up the two geometric conventions (counting failures before the
      first success, versus the trial number of the first success), which
      shifts the PGF by a factor of $s$.
    recap: >
      Every named discrete PGF drops out of a binomial, geometric, or
      exponential series identity applied to its pmf, and $G(1)=1$ checks
      each one instantly.
    dialogue:
      - part: An order that keeps retrying
        teach: >
          A stubborn order is resubmitted until it fills. Each attempt fills
          with probability $0.25$, independently of the others, and $X$ is the
          number of the attempt that finally fills — $1$, $2$, $3$, and so on
          without end.
      - ask: >
          What is $\Pr(X = 3)$?
        expects: "0.140625"
        tolerance: 0.0005
        feedback: >
          Two misses and then a fill: $0.75^{2} \times 0.25 = 0.5625 \times
          0.25 = 0.140625$. In general $\Pr(X = k) = 0.75^{k-1}(0.25)$.
      - ask: >
          Which series is $\mathbb{E}[s^{X}]$?
        choices:
          - text: >
              $\sum_{k \ge 0} 0.75^{k}(0.25)\,s^{k}$
            feedback: >
              That is the PGF of the number of *misses* before the fill, which
              starts at $0$. It is $X - 1$, and its PGF is the right answer
              divided by $s$ — the two geometric conventions differ by exactly
              that factor.
          - text: >
              $\sum_{k \ge 1} 0.25^{k-1}(0.75)\,s^{k}$
            feedback: >
              This swaps the roles: it describes waiting for a *miss* that
              happens with probability $0.75$. The repeated factor should be
              the miss probability $0.75$, once per failed attempt.
          - text: >
              $\sum_{k \ge 1} 0.75^{k-1}(0.25)\,s^{k}$
            correct: true
            feedback: >
              One term per value $k \ge 1$, coefficient $\Pr(X = k)$, exponent
              $k$. Correct, and of no use yet: it has infinitely many terms.
        feedback: >
          The PGF of any named law starts this way: write the pmf, attach
          $s^{k}$, sum. The work is in summing.
      - reflect: >
          That series never ends. What identity you already know would
          collapse it into a closed form, and what condition on $s$ does the
          collapse need?
        hint: >
          Pull $0.25s$ out front and look at what is left.
        answer: >
          The geometric series. Factoring out $0.25s$ leaves
          $\sum_{k \ge 1} (0.75s)^{k-1} = 1/(1 - 0.75s)$, so
          $G(s) = 0.25s/(1 - 0.75s)$. The identity needs $|0.75s| < 1$, so the
          closed form is valid only for $|s| < 1/0.75 \approx 1.33$ — a
          condition that comes with the formula, not after it.
      - ask: >
          Using $G(s) = 0.25s/(1 - 0.75s)$, evaluate $G(0.6)$.
        expects: "0.2727"
        tolerance: 0.0005
        feedback: >
          $G(0.6) = 0.15/(1 - 0.45) = 0.15/0.55 \approx 0.2727$. And $G(1) =
          0.25/0.25 = 1$, as every PGF must.

      - part: One series identity per row
        ask: >
          Errors on a desk are Poisson with mean $2.5$ a day:
          $\Pr(X = k) = e^{-2.5}2.5^{k}/k!$. Which closed form is
          $\sum_{k \ge 0} e^{-2.5}2.5^{k}s^{k}/k!$?
        choices:
          - text: >
              $e^{2.5s}$
            feedback: >
              That drops the constant $e^{-2.5}$ that every term carries. At
              $s = 1$ it gives $e^{2.5} \approx 12.2$, failing $G(1) = 1$ on
              sight.
          - text: >
              $e^{-2.5}/(1 - 2.5s)$
            feedback: >
              That applies the geometric series, but the terms carry $1/k!$,
              which the geometric series has no room for. The $k!$ is the
              signature of the exponential series.
          - text: >
              $e^{2.5(s-1)}$
            correct: true
            feedback: >
              $\sum_k (2.5s)^{k}/k! = e^{2.5s}$, times the constant
              $e^{-2.5}$. At $s = 1$ it is $e^{0} = 1$.
        feedback: >
          A $k!$ in the denominator points to $\sum_k x^{k}/k! = e^{x}$, and
          the result is $e^{\lambda(s-1)}$ for Poisson$(\lambda)$, valid for
          every $s$.
      - ask: >
          Five independent orders each fill with probability $0.3$, and $X$
          counts the fills. Which is $G_X(s)$?
        choices:
          - text: >
              $0.7^{5} + 0.3^{5}s^{5}$
            feedback: >
              That keeps only the all-miss and all-fill outcomes. $X$ can be
              $1$ through $4$ as well, each with its $\binom{5}{k}$ ways.
          - text: >
              $(0.7 + 0.3s)^{5}$
            correct: true
            feedback: >
              $\sum_k \binom{5}{k}(0.3s)^{k}0.7^{5-k}$ is the binomial theorem
              read backwards. $G(0) = 0.7^{5}$, the chance of no fills.
          - text: >
              $(0.3 + 0.7s)^{5}$
            feedback: >
              The variable $s$ must ride on the event being counted. Here it
              rides on the misses, so this is the PGF of the number of
              unfilled orders.
        feedback: >
          The binomial theorem sums the binomial pmf in one line, giving
          $(q + ps)^{n}$; Bernoulli is $n = 1$.
      - teach: >
          That is the whole table, one identity per row, with $q = 1 - p$.
          Bernoulli$(p)$: $q + ps$. Binomial$(n, p)$: $(q + ps)^{n}$.
          Geometric$(p)$ on $\{1, 2, \dots\}$: $ps/(1 - qs)$, for
          $|s| < 1/q$. Negative binomial, the trial of the $r$-th success:
          $(ps/(1 - qs))^{r}$, same domain. Poisson$(\lambda)$:
          $e^{\lambda(s-1)}$. Uniform on $\{1, \dots, n\}$:
          $(s + \cdots + s^{n})/n = s(1 - s^{n})/(n(1 - s))$, a finite
          geometric sum. Every row equals $1$ at $s = 1$.
      - ask: >
          A fair eight-sided die shows $1$ to $8$. Use the uniform row to find
          $\mathbb{E}[2^{X}] = G(2)$.
        expects: "63.75"
        tolerance: 0.005
        hint: >
          $G(s) = s(1 - s^{8})/(8(1 - s))$ at $s = 2$. Watch the two negative
          signs.
        feedback: >
          $G(2) = 2(1 - 256)/(8(1 - 2)) = (-510)/(-8) = 63.75$. Directly:
          $(2 + 4 + \cdots + 256)/8 = 510/8$. A polynomial PGF is finite at
          every $s$, so its closed form can be used anywhere.

      - part: Where a closed form stops telling the truth
        ask: >
          Back to the stubborn order. Plugging $s = 2$ into
          $0.25s/(1 - 0.75s)$ gives $0.5/(1 - 1.5) = -1$. What is
          $\mathbb{E}[2^{X}]$ really?
        choices:
          - text: >
              $-1$: the formula is the PGF.
            feedback: >
              $2^{X}$ is positive, so its average cannot be negative. The
              formula equals the series only where the geometric series
              converged, $|s| < 1/0.75$, and $2$ is outside.
          - text: >
              Infinite: the terms $0.25 \cdot 2 \cdot 1.5^{k-1}$ grow without
              bound.
            correct: true
            feedback: >
              Right. At $s = 2$ the series is
              $\sum_k 0.75^{k-1}(0.25)2^{k}$, whose terms grow like $1.5^{k}$.
              The closed form keeps producing numbers past the point where it
              stopped meaning anything.
          - text: >
              Undefined, because a PGF only accepts $|s| \le 1$.
            feedback: >
              This series converges for every $|s| < 1/0.75$, beyond $1$; the
              radius is at least $1$, not exactly $1$. At $s = 2$ it fails for
              a specific reason: the tail decays like $0.75^{k}$, and $2^{k}$
              outruns it.
        feedback: >
          The domain $|s| < 1/q$ is part of the geometric and negative
          binomial rows. Quoting the formula without it is the tell an
          interviewer listens for.
      - ask: >
          A colleague writes the Poisson$(\lambda)$ PGF as $e^{\lambda(1-s)}$.
          Which substitution exposes the slip fastest?
        choices:
          - text: >
              $s = 1$: it should give $1$.
            feedback: >
              $e^{\lambda(1-1)} = 1$, so the wrong formula passes this check.
              $G(1) = 1$ is necessary, not sufficient.
          - text: >
              $s = 0$: it gives $e^{\lambda} > 1$, but $G(0)$ is a probability.
            correct: true
            feedback: >
              $G(0) = p_0 = e^{-\lambda}$, and a value above $1$ cannot be any
              probability. The flipped sign shows up the moment you read the
              constant term.
          - text: >
              $s = -1$: it should give the parity split.
            feedback: >
              It would eventually, since $(1 + e^{2\lambda})/2$ exceeds $1$,
              but that is a slower route to a test $s = 0$ settles at once.
        feedback: >
          Run both free checks on any table entry you reconstruct: $G(1) = 1$
          and $0 \le G(0) \le 1$. Between them they catch most slips of sign
          and constant.

  - node: quant-probability.mgf.pgf-sums
    hook: >
      This one line is why the whole subject exists: turning the awkward
      convolution sum for a distribution's total into ordinary polynomial
      multiplication.
    explanation: >
      Independence is exactly the hypothesis multiplication needs. $s^{X}$ is
      a function of $X$ alone and $s^{Y}$ a function of $Y$ alone, so
      independence of $X$ and $Y$ carries over to independence of $s^{X}$ and
      $s^{Y}$, and expectations of independent products factor:
      $\mathbb{E}[s^{X}s^{Y}] = \mathbb{E}[s^{X}]\,\mathbb{E}[s^{Y}]$. That one
      line is the whole proof, and everything downstream in this chapter —
      dice problems, compound sums, additive families of named laws — is this
      fact applied repeatedly.

      Contrast with the direct route: finding the pmf of $X+Y$ by hand means
      the convolution sum $\Pr(X+Y=m)=\sum_k\Pr(X=k)\Pr(Y=m-k)$, one
      computation per value of $m$. Multiplying two polynomials and reading
      off coefficients performs the same computation all at once, which is
      why the PGF route wins whenever both PGFs are already in closed form.

      The rule extends immediately to $n$ iid copies, $G_{S_n}(s)=G_X(s)^{n}$,
      by applying the two-variable rule $n-1$ times — no new idea, just
      induction on the same factorization.
    worked: >
      $X\sim\text{Bernoulli}(0.5)$ and $Y\sim\text{Bernoulli}(0.3)$
      independent: $G_X(s)=0.5+0.5s$, $G_Y(s)=0.7+0.3s$, so $G_X(s)G_Y(s) =
      0.35+0.5s+0.15s^{2}$. Reading the $s^{1}$ coefficient,
      $\Pr(X+Y=1)=0.5$, matching a direct check:
      $\Pr(X=1,Y=0)+\Pr(X=0,Y=1) = 0.5(0.7)+0.5(0.3) = 0.5$.
    interview: >
      "What's the PGF of the sum of two independent counts" wants the
      immediate answer "multiply the two PGFs." A common follow-up asks you
      to extract one specific coefficient of the product rather than the
      whole resulting pmf.
    pitfalls: >
      Applying $G_{X+Y}=G_XG_Y$ to counts that are merely correlated, not
      independent — the product rule needs genuine independence. Forgetting
      that the product is only guaranteed valid on the overlap of the two
      individual radii of convergence, though this rarely binds in practice.
    recap: >
      Independence turns the sum's PGF into the product $G_X(s)G_Y(s)$,
      replacing a convolution sum with polynomial multiplication.
    dialogue:
      - part: Two desks, one total
        teach: >
          Desk A logs $X$ breaks a day: $0$, $1$ or $2$ with probabilities
          $0.3$, $0.5$, $0.2$. Desk B, run independently, logs $Y$: $0$ or $1$
          with probabilities $0.6$, $0.4$. Risk only cares about the total
          $X + Y$.
      - ask: >
          What is $\Pr(X + Y = 2)$?
        expects: "0.32"
        hint: >
          List the pairs $(x, y)$ with $x + y = 2$, and use independence to
          multiply.
        feedback: >
          Two pairs: $(2, 0)$ and $(1, 1)$. So
          $0.2(0.6) + 0.5(0.4) = 0.12 + 0.20 = 0.32$.
      - ask: >
          And $\Pr(X + Y = 1)$?
        expects: "0.42"
        feedback: >
          Pairs $(1, 0)$ and $(0, 1)$: $0.5(0.6) + 0.3(0.4) = 0.30 + 0.12 =
          0.42$. Each total needs its own sum over pairs — the convolution
          $\Pr(X + Y = m) = \sum_k \Pr(X = k)\Pr(Y = m - k)$.
      - reflect: >
          Multiply the two generating functions,
          $(0.3 + 0.5s + 0.2s^{2})(0.6 + 0.4s)$, and look at the coefficients
          of $s$ and $s^{2}$. Why do the numbers you just computed show up
          there?
        answer: >
          The product is $0.18 + 0.42s + 0.32s^{2} + 0.08s^{3}$. Expanding
          pairs every term $p_j s^{j}$ of the first factor with every term
          $q_k s^{k}$ of the second, and the pair lands on $s^{j+k}$. So the
          coefficient of $s^{m}$ collects exactly the pairs with $j + k = m$,
          weighted by $p_j q_k$ — the convolution, done for every $m$ at once.
          Multiplying polynomials *is* convolving their coefficient lists.

      - part: Why the product is the PGF of the total
        teach: >
          For independent counts $X$ and $Y$,
          $G_{X+Y}(s) = G_X(s)\,G_Y(s)$, and for $n$ independent copies of $X$
          the total has PGF $G_X(s)^{n}$. The proof is one line:
          $G_{X+Y}(s) = \mathbb{E}[s^{X+Y}] = \mathbb{E}[s^{X}s^{Y}] =
          \mathbb{E}[s^{X}]\,\mathbb{E}[s^{Y}]$.
      - ask: >
          Which equality in that chain is the one that spends independence?
        choices:
          - text: >
              $s^{X+Y} = s^{X}s^{Y}$
            feedback: >
              That is the law of exponents, true for every pair of numbers. It
              holds whether $X$ and $Y$ are related or not.
          - text: >
              $\mathbb{E}[s^{X}s^{Y}] = \mathbb{E}[s^{X}]\,\mathbb{E}[s^{Y}]$
            correct: true
            feedback: >
              Right. $s^{X}$ is a function of $X$ alone and $s^{Y}$ of $Y$
              alone, so they are independent, and the expectation of a product
              of independent variables factors. Without independence this step
              is simply false.
          - text: >
              $\mathbb{E}[s^{X+Y}] = \mathbb{E}[s^{X}] + \mathbb{E}[s^{Y}]$,
              by linearity
            feedback: >
              That equality is not in the chain, and it is false: at $s = 1$
              the left side is $1$ and the right side is $2$. Linearity splits
              a sum inside the expectation, and $s^{X+Y}$ is a product.
        feedback: >
          Everything else in the proof is algebra. Independence is used once,
          to factor an expectation of a product.
      - ask: >
          Desk A runs two independent days. What is the probability its
          two-day total is $2$?
        expects: "0.37"
        hint: >
          Square $0.3 + 0.5s + 0.2s^{2}$ and keep only the $s^{2}$ terms.
        feedback: >
          The $s^{2}$ coefficient of $(0.3 + 0.5s + 0.2s^{2})^{2}$ comes from
          $0.5s \cdot 0.5s$ and from $0.3 \cdot 0.2s^{2}$ twice:
          $0.25 + 2(0.06) = 0.37$.
      - ask: >
          Desk B runs three independent days. What is the probability of
          exactly two breaks in total?
        expects: "0.288"
        hint: >
          The total has PGF $(0.6 + 0.4s)^{3}$.
        feedback: >
          The $s^{2}$ coefficient of $(0.6 + 0.4s)^{3}$ is
          $\binom{3}{2}(0.4)^{2}(0.6) = 3(0.16)(0.6) = 0.288$. Three iid
          Bernoulli counts give the binomial PGF, as they should.

      - part: When the product lies
        ask: >
          Now take $X$ Bernoulli$(0.5)$ and let $Y$ be the same count as $X$:
          $Y = X$. The product $(0.5 + 0.5s)^{2}$ has $s$-coefficient $0.5$.
          What is $\Pr(X + Y = 1)$ really?
        expects: "0"
        feedback: >
          $X + Y = 2X$ is $0$ or $2$, never $1$. The true PGF is
          $\mathbb{E}[s^{2X}] = 0.5 + 0.5s^{2}$, not the product. The factoring
          step failed because $s^{X}$ and $s^{Y}$ are the same variable, as
          dependent as two variables can be.
      - ask: >
          Subtler: $X$ is uniform on $\{0, 1, 2\}$ and $Y = 1$ exactly when
          $X = 1$, else $Y = 0$. Then $\operatorname{Cov}(X, Y) = 1/3 - 1 \cdot
          1/3 = 0$. Can you multiply their PGFs to get the law of $X + Y$?
        choices:
          - text: >
              Yes: zero correlation is all the factoring step needs.
            feedback: >
              Zero correlation factors $\mathbb{E}[XY]$, a single product. The
              PGF needs $\mathbb{E}[s^{X}s^{Y}]$ to factor for every $s$, which
              is a far stronger demand.
          - text: >
              No: the product claims $\Pr(X + Y = 1) = 1/3$, but $X + Y$ is
              never $1$.
            correct: true
            feedback: >
              $X = 0$ gives total $0$, while $X = 1$ and $X = 2$ both give
              total $2$. The product
              $\frac{1 + s + s^{2}}{3} \cdot \frac{2 + s}{3}$ has
              $s$-coefficient $2/9 + 1/9 = 1/3$. Uncorrelated, dependent, and
              the rule fails.
          - text: >
              Only near $s = 1$, where both PGFs are close to $1$.
            feedback: >
              At $s = 1$ both sides are $1$ for any pair at all, so agreement
              there proves nothing. The coefficients are what carry the law,
              and the product puts mass $1/3$ on a total that never occurs.
        feedback: >
          The product rule needs genuine independence. Zero correlation is one
          number vanishing; independence is every function of $X$ being
          independent of every function of $Y$.
      - teach: >
          Asked for the law of a sum of independent counts, say "multiply the
          PGFs" and then extract only the coefficient you are asked for,
          rather than expanding the whole product. The same move, repeated, is
          what settles the loaded-dice puzzle and identifies sums of named
          laws.

  - node: quant-probability.mgf.loaded-dice
    hook: >
      This is the best-known generating-function interview question, and the
      one nontrivial fact behind it — an odd-degree real polynomial always
      has a real root — is worth internalizing on its own, since it's the
      whole engine.
    explanation: >
      The proof has exactly one nontrivial ingredient: a real polynomial of
      odd degree always has a real root, since it takes arbitrarily large
      values of opposite sign as $s\to\pm\infty$ and is continuous, so it must
      cross zero somewhere. Everything else is bookkeeping — matching degrees
      shows both dice's leftover factors $h_1,h_2$ must have odd degree $5$,
      and matching coefficients pins down exactly what polynomial they'd need
      to multiply to.

      The target is $1+s+\cdots+s^{10}$, and factoring
      $s^{11}-1=(s-1)(1+s+\cdots+s^{10})$ shows its roots are exactly the
      eleventh roots of unity other than $1$ — and since $11$ is odd, $-1$
      isn't among them (only even orders contain $-1$), so none of those
      roots is real. A polynomial with zero real roots can never be the
      product of two real polynomials each guaranteed a real root, which is
      the contradiction.

      The pattern generalizes: whenever a target sum-distribution's
      generating polynomial has no real roots, it blocks any factorization
      into two dice polynomials whose forced degrees include an odd one — the
      specific numbers here are incidental to the mechanism.
    worked: >
      Shrink the argument to two-sided dice (coins) with faces $1$ and $2$,
      loaded however you like: can the sum be uniform on $\{2,3,4\}$? Writing
      $G_i(s)=s\,h_i(s)$ with $h_i(s)=p_{i,1}+p_{i,2}s$ linear, the target is
      $G_1G_2 = (s^{2}+s^{3}+s^{4})/3 = s^{2}(1+s+s^{2})/3$, so
      $h_1(s)h_2(s) = (1+s+s^{2})/3$ — a product of two real linear factors,
      which always has real roots. But $1+s+s^{2}$ has discriminant
      $1-4=-3<0$, no real roots at all. Contradiction: no loading of two
      coins makes $\{2,3,4\}$ uniform either.
    interview: >
      The interviewer wants you to reach for polynomial factorization and
      root-counting, not brute-force casework over every loading. Stating the
      odd-degree-implies-real-root fact out loud is the signal that you
      understand the mechanism, not just the memorized conclusion.
    pitfalls: >
      Searching over loadings by trial and error — the space of loadings is
      continuous and unbounded, so no finite search settles it. Assuming the
      argument transfers unchanged to a die with a different number of sides
      without rechecking whether the forced degree is actually odd, since
      that's what makes the real-root fact bite.
    recap: >
      No loading of two dice makes their sum uniform, because the uniform
      target's generating polynomial has no real roots while any two-dice
      factorization forces one factor of odd degree, which must have one.
    dialogue:
      - part: Rigging two tetrahedral dice
        teach: >
          Two four-sided dice show faces $1$ to $4$. You may load each one
          however you like — any four nonnegative weights summing to $1$, and
          the two dice need not match. The goal: make the total uniform on
          $\{2, 3, \dots, 8\}$, each of the seven totals with probability
          $1/7$.
      - ask: >
          Start with both dice fair. What is the probability of a total of
          $5$?
        expects: "1/4"
        tolerance: 0.0005
        feedback: >
          Four of the $16$ pairs make $5$: $(1,4)$, $(2,3)$, $(3,2)$, $(4,1)$.
          So $4/16 = 1/4$, well above the target $1/7 \approx 0.143$, while a
          total of $2$ gets only $1/16$. Fair dice pile weight in the middle.
      - ask: >
          A colleague tries ten thousand random loadings and none comes within
          $0.01$ of uniform. What has that established?
        choices:
          - text: >
              That no loading works, to any practical confidence.
            feedback: >
              The loadings form a continuous six-parameter family; ten
              thousand samples are a finite dust in it, and a solution could
              sit in a sliver the search never touched. Searching cannot prove
              impossibility.
          - text: >
              Nothing either way: it neither finds a loading nor rules one out.
            correct: true
            feedback: >
              Right. To settle "no loading works" you need an argument that
              covers every loading at once — which means turning the question
              into one about a single algebraic object.
          - text: >
              That a loading exists but needs weights near $0$ or $1$.
            feedback: >
              Failing to find one is not evidence for one in a particular
              corner. The search has simply not addressed the question.
        feedback: >
          The space of loadings is continuous, so trial and error cannot close
          the case. The generating functions of the two dice can.
      - reflect: >
          Die $i$ has PGF $G_i(s) = w_{i1}s + w_{i2}s^{2} + w_{i3}s^{3} +
          w_{i4}s^{4}$, and the dice are independent. Restate "the total is
          uniform on $\{2, \dots, 8\}$" as an equation between polynomials.
          What would have to be true?
        answer: >
          The total has PGF $G_1(s)G_2(s)$, so you need
          $G_1(s)G_2(s) = (s^{2} + s^{3} + \cdots + s^{8})/7$. Pull one factor
          of $s$ out of each die, $G_i(s) = s\,h_i(s)$ with $h_i$ of degree at
          most $3$, and the question becomes whether
          $h_1(s)h_2(s) = (1 + s + \cdots + s^{6})/7$ can hold for real
          polynomials $h_1, h_2$ with nonnegative coefficients. Rigging the
          dice is now factoring a polynomial.

      - part: A question about roots
        ask: >
          $\deg h_1 + \deg h_2$ must equal $6$, and each is at most $3$. What
          degree is each $h_i$ forced to have?
        expects: "3"
        feedback: >
          Two numbers at most $3$ that add to $6$ are both $3$. In dice terms,
          each die must give face $4$ positive weight, or the total $8$ is
          unreachable.
      - ask: >
          Why must a real polynomial of degree $3$ have a real root?
        choices:
          - text: >
              Every real polynomial has at least one real root.
            feedback: >
              $1 + s^{2}$ has none. Degree matters: the claim is special to
              odd degree.
          - text: >
              By the fundamental theorem of algebra.
            feedback: >
              That guarantees complex roots — three of them for a cubic — but
              says nothing about any being real. Something about odd degree
              has to be used.
          - text: >
              Its leading term dominates, so it has opposite signs as
              $s \to +\infty$ and $s \to -\infty$, and by continuity it crosses
              zero.
            correct: true
            feedback: >
              Right: the intermediate value theorem. An odd power changes sign
              when $s$ does, so the two ends point opposite ways.
        feedback: >
          Odd degree is the whole engine: each $h_i$ has some real $r_i$ with
          $h_i(r_i) = 0$, so $h_1h_2$ must vanish at a real point.
      - ask: >
          Now the target, $1 + s + \cdots + s^{6} = (s^{7} - 1)/(s - 1)$. How
          many real roots does it have?
        expects: "0"
        hint: >
          Its roots are seventh roots of unity, minus one of them. Which real
          numbers are seventh roots of unity?
        feedback: >
          The roots are the seventh roots of unity other than $1$. The only
          real candidates are $\pm 1$: $1$ is excluded, and $(-1)^{7} = -1$,
          so $-1$ is not a seventh root of unity. Indeed at $s = -1$ the
          polynomial equals $1$. No real roots.
      - teach: >
          So the contradiction closes: $h_1h_2$ must vanish at a real point,
          and $(1 + s + \cdots + s^{6})/7$ never does. No loading of two
          four-sided dice makes the total uniform. The six-sided puzzle is the
          same argument with $h_i$ of degree $5$ and target
          $1 + s + \cdots + s^{10}$, whose roots are the eleventh roots of
          unity other than $1$ — none of them real.

      - part: Where the argument needs odd degree
        ask: >
          Try three-sided dice, faces $1$ to $3$, aiming at a uniform total on
          $\{2, \dots, 6\}$. What degree is each $h_i$ forced to have now?
        expects: "2"
        feedback: >
          The target is $h_1h_2 = (1 + s + s^{2} + s^{3} + s^{4})/5$, of degree
          $4$, and each $h_i$ has degree at most $2$. So both are quadratics.
      - ask: >
          Does the real-root argument still settle the three-sided case?
        choices:
          - text: >
              Yes: the target still has no real roots, so it still cannot
              factor.
            feedback: >
              The target has no real roots, but a real quadratic need not
              have one either — $1 + s + s^{2}$ has none. Two root-free
              quadratics can multiply to a root-free quartic, so no
              contradiction appears.
          - text: >
              No: a quadratic need not have a real root, so nothing forces
              $h_1h_2$ to vanish.
            correct: true
            feedback: >
              Right. The engine was odd degree, and degree $2$ removes it. The
              question is open again until something else decides it.
          - text: >
              Yes, because $5$ is odd just as $11$ was.
            feedback: >
              The parity that matters is the degree of each $h_i$, which is
              $2$ here. The count of totals being odd is what made the target
              root-free; it does nothing to force a root on the dice.
        feedback: >
          Recheck that the forced degree is odd before reusing the argument.
          For the three-sided dice a different obstacle decides it.
      - ask: >
          Over the reals the only quadratic split is
          $1 + s + s^{2} + s^{3} + s^{4} = (1 + 1.618s + s^{2})(1 - 0.618s +
          s^{2})$, up to constant factors. What does that tell you about the
          dice?
        choices:
          - text: >
              A loading exists, with weights in the ratios $1 : 1.618 : 1$ and
              $1 : -0.618 : 1$.
            feedback: >
              The second die would need face $2$ to have negative weight,
              which no die can. The factorization exists; the dice do not.
          - text: >
              No loading exists: one factor has a negative coefficient, and
              every face weight must be nonnegative.
            correct: true
            feedback: >
              Right. The roots argument fails here, but the
              nonnegative-coefficient constraint still blocks every loading.
              Same verdict, different reason.
          - text: >
              Nothing, since the constants could be chosen to fix the sign.
            feedback: >
              Scaling by positive constants keeps the $-0.618$ negative, and
              scaling by negative ones makes the outer coefficients negative
              instead. No constant rescues it.
        feedback: >
          A die's PGF is constrained twice: it is a real polynomial, and its
          coefficients are nonnegative. Odd degree lets the first constraint
          do all the work; for even degree you need the second.
      - teach: >
          In the interview, skip the casework and say: "the total's PGF is the
          product of the dice's, so I would need $h_1h_2$ to equal the uniform
          polynomial; each $h_i$ has odd degree, so a real root; the uniform
          polynomial's roots are non-real roots of unity. Contradiction." The
          odd-degree sentence is the one they are listening for.

  - node: quant-probability.mgf.sicherman-dice
    hook: >
      Once you know two dice's generating polynomial fully factors into
      irreducible pieces, the natural next question is whether a different
      grouping of those pieces gives an entirely different pair of dice with
      the same sum — and it does.
    explanation: >
      The trick rests on one observation: the sum's law depends only on the
      product $G_1(s)G_2(s)$, and a product doesn't care how its factors are
      grouped. A standard die's generating polynomial (using unnormalized
      face counts, so $G(1)=6$) factors completely as
      $s(1+s)(1+s+s^{2})(1-s+s^{2})$, so two standard dice together supply
      eight irreducible pieces — two copies each of these four factors — and
      any split of those eight pieces into two groups of total degree $5$
      each reproduces exactly the same product, hence the same sum law.

      Not every split is a die, though. Each resulting polynomial needs every
      coefficient nonnegative (a face count can't be negative), needs a
      factor of $s$ present (no face is labeled $0$), and needs to total $6$
      at $s=1$ (six faces). Most groupings fail one of these; the two
      nontrivial splits that survive are the standard dice themselves and the
      Sicherman pair.

      Because the product is unchanged, every coefficient of $s^{k}$ in it —
      the count of ways to roll total $k$ — is unchanged too, so the entire
      sum distribution is preserved, not just its mean.
    worked: >
      Verify a total besides seven: on standard dice, $\Pr(\text{sum}=5) =
      4/36 = 1/9$, from pairs $(1,4),(2,3),(3,2),(4,1)$. On the Sicherman
      faces $\{1,2,2,3,3,4\}$ and $\{1,3,4,5,6,8\}$, the pairs summing to $5$
      are $a=1,b=4$ (one way), $a=2,b=3$ (two ways, since the first die has
      two $2$-faces), and $a=4,b=1$ (one way) — $a=3$ would need $b=2$,
      absent from the second die. That's $1+2+0+1=4$ ways out of $36$, again
      $1/9$.
    interview: >
      "Find another pair of dice with the same sum distribution as standard
      dice" is the canonical follow-up once the impossibility problem is
      solved. Naming the polynomial-factoring technique, and knowing
      "Sicherman dice" as the answer, signals real depth.
    pitfalls: >
      Assuming any regrouping of the eight irreducible factors works — most
      fail the nonnegative-coefficient or six-faces constraint and aren't
      valid dice at all. Forgetting to check the resulting faces are all
      positive integers before declaring a split valid.
    recap: >
      Regrouping the four irreducible factors of two standard dice's
      generating polynomials differently, while keeping every coefficient a
      valid face count, produces the Sicherman dice — a different pair with
      the identical sum distribution.
    dialogue:
      - part: Same totals, different faces
        teach: >
          A game designer wants two fair four-sided dice, labelled with
          positive integers other than $1, 2, 3, 4$, whose total behaves
          exactly like the total of two standard four-sided dice — every total
          with its usual probability.
      - ask: >
          For two standard four-sided dice, what is the probability of a total
          of $6$?
        expects: "3/16"
        tolerance: 0.0005
        feedback: >
          Three of the $16$ pairs: $(2,4)$, $(3,3)$, $(4,2)$. So $3/16$. Any
          relabelled pair must reproduce this, and every other total too.
      - ask: >
          Write a die's face counts as a polynomial: the standard die is
          $s + s^{2} + s^{3} + s^{4}$. Which is its factorization into
          integer-coefficient pieces that cannot be split further?
        choices:
          - text: >
              $s(1 + s)^{3}$
            feedback: >
              That expands to $s + 3s^{2} + 3s^{3} + s^{4}$ — a die with three
              $2$s and three $3$s. The middle coefficients are wrong.
          - text: >
              $s(1 + s)(1 + s^{2})$
            correct: true
            feedback: >
              $(1 + s)(1 + s^{2}) = 1 + s + s^{2} + s^{3}$, times $s$. The
              pieces $1 + s$ and $1 + s^{2}$ do not factor further over the
              integers.
          - text: >
              $s(1 - s^{4})/(1 - s)$
            feedback: >
              True as an identity, but it is a quotient, not a product of
              polynomial pieces. You cannot hand half of a quotient to each
              die.
        feedback: >
          Two standard dice therefore have total polynomial
          $s^{2}(1 + s)^{2}(1 + s^{2})^{2}$: six pieces on the table.
      - reflect: >
          The total's distribution is read off the product of the two dice's
          polynomials. So what freedom does the designer have, and what limits
          it?
        answer: >
          Only the product matters, and a product does not care how its factors
          are grouped. So any way of dealing the six pieces into two piles
          gives a pair of dice with the same total — *if* each pile is a
          legitimate die: nonnegative integer coefficients (face counts), a
          factor of $s$ (no face labelled $0$), and value $4$ at $s = 1$ (four
          faces).

      - part: Dealing out the pieces
        teach: >
          This is the Sicherman construction: factor the standard pair's
          polynomial completely, regroup the factors into two piles, and keep
          only piles that are dice. Each pile gets exactly one $s$. At $s = 1$,
          both $1 + s$ and $1 + s^{2}$ equal $2$, which fixes how many pieces
          each pile can hold.
      - ask: >
          How many of the four pieces $1 + s$, $1 + s$, $1 + s^{2}$,
          $1 + s^{2}$ must each die get, to have four faces?
        expects: "2"
        feedback: >
          Each piece contributes a factor $2$ at $s = 1$, and each die needs
          the value $4 = 2 \times 2$. So two pieces apiece.
      - ask: >
          Deal both copies of $1 + s$ to die A and both copies of $1 + s^{2}$
          to die B. What are die B's faces?
        choices:
          - text: >
              $\{1, 2, 2, 3\}$
            feedback: >
              That is die A: $s(1 + s)^{2} = s + 2s^{2} + s^{3}$.
          - text: >
              $\{1, 3, 3, 5\}$
            correct: true
            feedback: >
              $s(1 + s^{2})^{2} = s + 2s^{3} + s^{5}$: one $1$, two $3$s, one
              $5$. Every coefficient nonnegative, four faces, all positive.
          - text: >
              $\{1, 2, 3, 4\}$
            feedback: >
              That is the standard die, $s(1 + s)(1 + s^{2})$, which takes one
              copy of each piece. Dealing both $1 + s^{2}$ to one die gives
              something new.
        feedback: >
          Die A is $\{1, 2, 2, 3\}$ and die B is $\{1, 3, 3, 5\}$ — the
          four-sided Sicherman pair.
      - ask: >
          With faces $\{1, 2, 2, 3\}$ and $\{1, 3, 3, 5\}$, what is the
          probability of a total of $6$?
        expects: "3/16"
        tolerance: 0.0005
        hint: >
          For each face of die A, which face of die B completes $6$, and how
          many copies of each are there?
        feedback: >
          A $1$ with the $5$: $1 \times 1 = 1$ way. A $3$ with a $3$: $1 \times
          2 = 2$ ways. A $2$ would need a $4$, which die B lacks. Total $3$ ways
          of $16$, so $3/16$ — exactly the standard value, as the product
          promised.

      - part: Piles that are not dice
        ask: >
          Suppose die A takes both factors of $s$, so die B is
          $(1 + s)(1 + s^{2}) = 1 + s + s^{2} + s^{3}$. What goes wrong?
        choices:
          - text: >
              Nothing: B is a fair die with four faces.
            feedback: >
              It has four faces and is fair, but read the constant term: one
              face is labelled $0$, which the positive-face rule forbids.
          - text: >
              Die B has a face labelled $0$.
            correct: true
            feedback: >
              The constant term $1$ is $s^{0}$: a face showing $0$. Die A, with
              $s^{2}$, has every label shifted up by one to compensate.
          - text: >
              Die B has a negative coefficient.
            feedback: >
              Every coefficient of $1 + s + s^{2} + s^{3}$ is $1$. The problem
              is where the exponents start, not their signs.
        feedback: >
          Each die needs exactly one factor of $s$, so the smallest label on
          each is $1$.
      - ask: >
          Now deal $(1 + s)^{2}(1 + s^{2})$ to die A and only $1 + s^{2}$ to die
          B, one $s$ each. How many faces would die A need?
        expects: "8"
        feedback: >
          At $s = 1$ die A's polynomial is $1 \cdot 2 \cdot 2 \cdot 2 = 8$ and
          die B's is $2$. The totals come out right, but as an eight-sided die
          paired with a two-sided coin, not two four-sided dice.
      - teach: >
          The six-sided version is the interview answer:
          $s(1 + s)(1 + s + s^{2})(1 - s + s^{2})$ per die, and moving both
          copies of $1 - s + s^{2}$ onto one die gives $\{1, 2, 2, 3, 3, 4\}$
          and $\{1, 3, 4, 5, 6, 8\}$. Say "the sum depends only on the product
          of the generating polynomials, so regroup the factors" — and then
          check the three die conditions out loud.

  - node: quant-probability.mgf.pgf-random-sums
    hook: >
      Whenever a total is built from "a random number of things, each
      contributing its own random amount" — claims, arrivals, defaults — its
      PGF is a composition, and recognizing that shape turns a hard
      conditioning argument into substitution.
    explanation: >
      Condition on $N$ first: given $N=n$, $S$ is a sum of $n$ iid copies of
      $X$, and because independent PGFs multiply, $\mathbb{E}[s^{S}\mid N=n]
      = G_X(s)^{n}$. Averaging that conditional PGF over the randomness in
      $N$ itself means substituting $G_X(s)$ in for the variable $G_N$
      eats, since $G_N(u)=\mathbb{E}[u^{N}]$ evaluated at $u=G_X(s)$ is
      precisely $\mathbb{E}[G_X(s)^{N}]$. That substitution is composition,
      $G_S = G_N\circ G_X$.

      Differentiating a composition uses the chain rule:
      $G_S'(s) = G_N'(G_X(s))\,G_X'(s)$, and at $s=1$, since $G_X(1)=1$, this
      collapses to $G_N'(1)G_X'(1) = \mathbb{E}[N]\,\mathbb{E}[X]$ — the mean
      of a randomly stopped sum falls out of one differentiation, no separate
      argument needed.

      Recognizing the shape matters more than the algebra: any "random count
      of random contributions" setup is a composition, and reading off
      $\mathbb{E}[S]$ or a specific probability is substitution, not a fresh
      derivation each time.
    worked: >
      Let $N$ be $0$ with probability $0.4$ or $2$ with probability $0.6$,
      and each $X_i\sim\text{Bernoulli}(0.5)$ independently. Then
      $G_S(s) = G_N(G_X(s)) = 0.4 + 0.6(0.5+0.5s)^{2} = 0.55+0.3s+0.15s^{2}$,
      so $\Pr(S=0)=0.55$ — matching a direct check,
      $0.4+0.6(0.5)^{2}=0.55$. The mean: $\mathbb{E}[N]=1.2$,
      $\mathbb{E}[X]=0.5$, so $\mathbb{E}[S]=0.6$, matching $G_S'(1)=0.6$.
    interview: >
      "If the number of arrivals is itself random, what's the mean of the
      total" wants immediate recognition of the composition $G_N(G_X(s))$ and
      the shortcut $\mathbb{E}[N]\mathbb{E}[X]$, not an attempt to build the
      joint distribution from scratch.
    pitfalls: >
      Composing in the wrong order, $G_X(G_N(s))$ instead of $G_N(G_X(s))$ —
      the inner function must be the per-item PGF, the outer the count's.
      Forgetting the $X_i$ must be independent of $N$ and of each other for
      the conditional power $G_X(s)^{n}$ to hold.
    recap: >
      A randomly stopped sum's PGF is the composition $G_S=G_N\circ G_X$, and
      one chain-rule differentiation at $s=1$ recovers
      $\mathbb{E}[S]=\mathbb{E}[N]\mathbb{E}[X]$.
    dialogue:
      - part: A random number of random defaults
        teach: >
          A credit desk buys a pool of $N$ loans, where $N$ is $1$, $2$ or $3$
          with probabilities $0.3$, $0.5$, $0.2$. Each loan defaults with
          probability $0.2$, independently of the others and of $N$. Let $S$
          be the number of defaults in the pool.
      - ask: >
          What is the probability of no defaults at all?
        expects: "0.6624"
        tolerance: 0.0005
        hint: >
          Condition on $N$. With $n$ loans, all must survive.
        feedback: >
          $0.3(0.8) + 0.5(0.8)^{2} + 0.2(0.8)^{3} = 0.24 + 0.32 + 0.1024 =
          0.6624$.
      - ask: >
          Fix $N = 2$. Write $G_X(s) = 0.8 + 0.2s$ for one loan. Which is the
          PGF of $S$ given $N = 2$?
        choices:
          - text: >
              $2(0.8 + 0.2s)$
            feedback: >
              Doubling the PGF gives $2$ at $s = 1$, so it is not a PGF. Adding
              independent counts multiplies their PGFs; it never adds or scales
              them.
          - text: >
              $(0.8 + 0.2s)^{2}$
            correct: true
            feedback: >
              Two independent loans: the PGF of their total is the product,
              $G_X(s)^{2}$. In general, given $N = n$, it is $G_X(s)^{n}$.
          - text: >
              $0.8 + 0.2s^{2}$
            feedback: >
              That is the PGF of $2X_1$ — one loan counted twice. Two separate
              loans can produce exactly one default, and this has no $s^{1}$
              term.
        feedback: >
          Given $N = n$, the defaults are a sum of $n$ independent loans, with
          PGF $G_X(s)^{n}$. What remains is to average over $N$.
      - reflect: >
          So $G_S(s) = \mathbb{E}[G_X(s)^{N}]$: the average, over $N$, of a
          fixed number raised to the power $N$. You have seen an average of
          that shape before. What is it, written with $G_N$?
        hint: >
          $G_N(u) = \mathbb{E}[u^{N}]$. What plays the role of $u$?
        answer: >
          It is $G_N$ evaluated at $u = G_X(s)$: $\mathbb{E}[u^{N}]$ with
          $u = G_X(s)$. So $G_S(s) = G_N(G_X(s))$ — the count's PGF with the
          per-item PGF substituted in. A random number of summands turns into
          composition.

      - part: The count's PGF, fed the item's
        teach: >
          For $S = X_1 + \cdots + X_N$, with $N$ and the $X_i$ independent
          counts and the $X_i$ identically distributed, $G_S = G_N \circ G_X$.
          Here $G_N(u) = 0.3u + 0.5u^{2} + 0.2u^{3}$, and
          $G_S(s) = G_N(0.8 + 0.2s)$; at $s = 0$ this returns the $0.6624$ you
          computed.
      - ask: >
          A colleague writes $G_X(G_N(s))$ instead. What does that formula
          describe?
        choices:
          - text: >
              The same law: composition commutes.
            feedback: >
              It does not. Here $G_X(G_N(0)) = 0.8 + 0.2 \times 0 = 0.8$, while
              $G_S(0) = 0.6624$. Order matters.
          - text: >
              The roles swapped: a sum of $X$ copies of $N$ — with probability
              $0.2$ one pool size, otherwise $0$.
            correct: true
            feedback: >
              Right. The outer function is the one whose variable counts the
              summands, so it must be $G_N$; the inner one describes a single
              summand, so it must be $G_X$.
          - text: >
              $N + X$, a single loan added to the count.
            feedback: >
              The PGF of $N + X$, for independent $N$ and $X$, is the product
              $G_N(s)G_X(s)$, not a composition of either order.
        feedback: >
          Read the composition from outside in: "how many summands" wraps
          around "what each summand is".
      - ask: >
          Differentiate $G_S = G_N \circ G_X$ at $s = 1$ by the chain rule.
          What is $\mathbb{E}[S]$ for the loan pool?
        expects: "0.38"
        hint: >
          $G_S'(1) = G_N'(G_X(1))\,G_X'(1)$, and $G_X(1) = 1$.
        feedback: >
          $G_S'(1) = G_N'(1)G_X'(1) = \mathbb{E}[N]\,\mathbb{E}[X]$. Here
          $\mathbb{E}[N] = 0.3 + 1.0 + 0.6 = 1.9$ and $\mathbb{E}[X] = 0.2$,
          so $\mathbb{E}[S] = 0.38$.
      - ask: >
          What is the probability of exactly one default in the pool?
        expects: "0.2968"
        tolerance: 0.0005
        hint: >
          The coefficient of $s$ in $G_N(G_X(s))$ is $G_S'(0) =
          G_N'(G_X(0))\,G_X'(0) = G_N'(0.8)(0.2)$.
        feedback: >
          $G_N'(u) = 0.3 + 1.0u + 0.6u^{2}$, so $G_N'(0.8) = 0.3 + 0.8 + 0.384
          = 1.484$, and $1.484 \times 0.2 = 0.2968$. Direct check:
          $0.3(0.2) + 0.5(2)(0.2)(0.8) + 0.2(3)(0.2)(0.64) = 0.06 + 0.16 +
          0.0768 = 0.2968$.

      - part: What composition needs, and what it buys
        ask: >
          New rule: the desk checks loans one at a time, at most two, and
          stops at the first default. So $N = 1$ if loan $1$ defaults and
          $N = 2$ otherwise, giving $G_N(u) = 0.2u + 0.8u^{2}$. Composition
          predicts $\Pr(S = 0) = G_N(0.8) = 0.672$, but the truth is
          $0.8^{2} = 0.64$. What broke?
        choices:
          - text: >
              $N$ depends on the loans' outcomes, so given $N = n$ the defaults
              are no longer $n$ independent Bernoulli$(0.2)$ draws.
            correct: true
            feedback: >
              Right. Given $N = 1$, loan $1$ certainly defaulted, so
              $\mathbb{E}[s^{S} \mid N = 1] = s$, not $0.8 + 0.2s$. The step
              $\mathbb{E}[s^{S} \mid N = n] = G_X(s)^{n}$ needs $N$ independent
              of the $X_i$.
          - text: >
              The loans are no longer identically distributed.
            feedback: >
              Each loan still defaults with probability $0.2$. What changed is
              that the number of loans counted is decided by the loans
              themselves.
          - text: >
              The composition should be $G_X(G_N(s))$ for a stopping rule.
            feedback: >
              The order is the same for every random sum. The failure is the
              independence of $N$ from the summands, which no reordering
              repairs.
        feedback: >
          Composition requires $N$ independent of the summands. A count that
          peeks at the outcomes — stop at the first default, stop when a
          target is hit — is outside the formula.
      - ask: >
          Orders arrive as Poisson$(\lambda)$, $G_N(u) = e^{\lambda(u-1)}$, and
          each fills independently with probability $p$. What is the law of the
          number of fills?
        choices:
          - text: >
              Binomial$(\lambda, p)$, since each arrival is a trial
            feedback: >
              The number of trials is random, not $\lambda$, and $\lambda$ need
              not be an integer. Compose: $e^{\lambda(q + ps - 1)}$ has no
              binomial shape.
          - text: >
              Poisson$(\lambda p)$
            correct: true
            feedback: >
              $G_N(G_X(s)) = e^{\lambda(q + ps - 1)} = e^{\lambda p(s-1)}$, since
              $q - 1 = -p$. That is the Poisson$(\lambda p)$ PGF: thinning a
              Poisson stream leaves a Poisson stream.
          - text: >
              Poisson$(\lambda)$, since thinning only relabels arrivals
            feedback: >
              Fewer arrivals become fills, so the mean falls to $\lambda p$ by
              $\mathbb{E}[N]\mathbb{E}[X]$. The law stays Poisson, but the
              rate does not.
        feedback: >
          One substitution identifies the thinned law. Any "random count of
          random contributions" question is a composition first and a
          calculation second.

  - node: quant-probability.mgf.mgf
    hook: >
      The PGF only reaches nonnegative-integer counts — the moment
      generating function extends the same trick to any real-valued variable,
      provided one real assumption actually holds, which is the detail
      interviewers probe first.
    explanation: >
      The PGF's exponent $s^{x}$ needs $x$ to be a nonnegative integer to
      make sense as a power. Real-valued $X$ needs a different exponent
      structure, and $e^{tx}$ is the natural choice: it's defined for every
      real $x$, and its Taylor series $e^{tx}=\sum_k (tx)^{k}/k!$ packages
      every power of $x$ at once, so averaging it against $X$'s law bundles
      every moment into one function of $t$.

      For a nonnegative-integer $X$, the two transforms are the same object
      through different windows: substituting $s=e^{t}$ turns
      $G_X(s)=\mathbb{E}[s^{X}]$ into $\mathbb{E}[(e^{t})^{X}] =
      \mathbb{E}[e^{tX}] = M_X(t)$. The point of a second transform is only
      to cover variables the PGF can't reach.

      The existence caveat is the genuinely new bookkeeping. $M_X(0)=1$
      always, but nothing guarantees $M_X(t)<\infty$ for $t\ne0$ — a heavy
      right tail can send $\mathbb{E}[e^{tX}]$ to infinity for every $t>0$.
      Convexity of $e^{tx}$ guarantees the set where $M_X$ is finite is an
      interval containing $0$, but that interval can collapse to the single
      point $\{0\}$, where the MGF exists in name only.
    worked: >
      Let $X$ be uniform on $[0,1]$, density $f(x)=1$. By LOTUS, $M_X(t) =
      \int_0^1 e^{tx}\,dx = (e^{t}-1)/t$ for $t\ne0$, with the limit as
      $t\to0$ equal to $1$, matching $M_X(0)=1$. Since $e^{tx}$ is bounded on
      $[0,1]$ for every real $t$, this integral is finite for every $t$ — the
      MGF exists everywhere, not merely near $0$.
    interview: >
      "Define the MGF and state when it's guaranteed to exist" tests whether
      you state the finite-neighborhood-of-$0$ hypothesis unprompted. A
      common follow-up asks whether every random variable has an MGF, and the
      answer is no.
    pitfalls: >
      Quoting $M_X(t)=\mathbb{E}[e^{tX}]$ without ever checking it's finite
      on an interval — the object is only useful once existence is confirmed.
      Confusing $M_X(0)=1$ (always true) with $M_X$ finite elsewhere (never
      automatic).
    recap: >
      The MGF $M_X(t)=\mathbb{E}[e^{tX}]$ generalizes the PGF to any
      real-valued $X$, agreeing with $G_X(e^{t})$ on the nonnegative
      integers, and is only as useful as the neighborhood of $t=0$ on which
      it's actually finite.
    dialogue:
      - part: A transform for a P&L
        teach: >
          A strategy's daily P&L, in thousands, is $X = -1$ with probability
          $0.4$ and $X = +2$ with probability $0.6$. The risk manager wants
          what the PGF gave you for counts: the whole law stored in one
          function she can differentiate and multiply.
      - ask: >
          Why will $\mathbb{E}[s^{X}]$ not serve as that function here?
        choices:
          - text: >
              $X$ is not an integer.
            feedback: >
              Both values, $-1$ and $2$, are integers. The obstacle is the
              sign of one of them.
          - text: >
              The value $-1$ produces an $s^{-1}$ term, so it is not a power
              series, and a continuous P&L would not even give integer powers.
            correct: true
            feedback: >
              Right. Here $\mathbb{E}[s^{X}] = 0.4s^{-1} + 0.6s^{2}$, which
              blows up at $s = 0$. The PGF was built for counts, and P&Ls are
              not counts.
          - text: >
              A PGF needs $\mathbb{E}[X] = 0$.
            feedback: >
              No PGF fact needs a zero mean — every count other than the
              constant $0$ has a positive one. The trouble is the negative
              value.
        feedback: >
          A transform for real-valued variables needs a kernel defined for
          every real $x$. The natural candidate is $e^{tx}$.
      - ask: >
          Try it: compute $\mathbb{E}[e^{tX}]$ at $t = 1$.
        expects: "4.5806"
        tolerance: 0.0005
        feedback: >
          LOTUS: $0.4e^{-1} + 0.6e^{2} \approx 0.4(0.36788) + 0.6(7.38906) =
          0.14715 + 4.43343 = 4.5806$. Defined, finite, and depending on the
          whole law.
      - reflect: >
          Why $e^{tX}$ rather than some other kernel defined on all of
          $\mathbb{R}$? Expand $e^{tX}$ as a Taylor series in $t$ and average
          term by term. What does the resulting function of $t$ carry?
        answer: >
          $e^{tX} = \sum_k X^{k}t^{k}/k!$, so averaging gives
          $\sum_k \mathbb{E}[X^{k}]\,t^{k}/k!$ — every moment of $X$, each
          sitting on its own power of $t$. One function of $t$ holds the mean,
          the second moment and all the rest, which is what earns it the name.
          The averaging term by term is the step that needs care.

      - part: The name, and how it meets the PGF
        teach: >
          The moment generating function is $M_X(t) = \mathbb{E}[e^{tX}]$,
          defined at those real $t$ where the expectation is finite. Always
          $M_X(0) = 1$. Everything built on it assumes more: that $M_X(t)$ is
          finite for all $|t| < h$, for some $h > 0$ — "the MGF exists in a
          neighbourhood of $0$". For a count, $e^{tX} = (e^{t})^{X}$, so
          $M_X(t) = G_X(e^{t})$.
      - ask: >
          A count has $G(s) = 0.5 + 0.5s^{3}$. What is $M_X(\ln 3)$?
        expects: "14"
        hint: >
          $M_X(t) = G_X(e^{t})$, and $e^{\ln 3} = 3$.
        feedback: >
          $M_X(\ln 3) = G(3) = 0.5 + 0.5(27) = 14$. Same object, read through
          the substitution $s = e^{t}$.

      - part: Where the expectation is finite
        ask: >
          $X$ is exponential with rate $4$: density $4e^{-4x}$ for $x > 0$.
          Then $M_X(t) = \int_0^\infty 4e^{(t-4)x}\,dx = 4/(4 - t)$ for
          $t < 4$. What is $M_X(2)$?
        expects: "2"
        feedback: >
          $4/(4 - 2) = 2$. The integrand is $4e^{-2x}$, comfortably
          integrable.
      - ask: >
          What is $M_X(5)$ for the same variable?
        choices:
          - text: >
              $4/(4 - 5) = -4$
            feedback: >
              $e^{5X}$ is positive, so its average cannot be negative. The
              closed form was derived for $t < 4$ and says nothing beyond.
          - text: >
              $+\infty$: the integrand $4e^{x}$ grows, and the integral
              diverges.
            correct: true
            feedback: >
              Right. At $t = 5$ the exponential growth of $e^{5x}$ beats the
              tail's decay $e^{-4x}$. The MGF is finite on $(-\infty, 4)$ and
              infinite from $4$ on.
          - text: >
              $1$, since $M_X$ always equals $1$ somewhere
            feedback: >
              $M_X(0) = 1$ is guaranteed at $t = 0$ only. Elsewhere it is
              whatever the integral is — here, infinite.
        feedback: >
          The MGF can be infinite. Where it is finite is a property of the
          law's tails, and has to be checked rather than assumed.
      - ask: >
          Some $X$ has $M_X(-1) < \infty$ and $M_X(2) < \infty$. Must $M_X(1)$
          be finite?
        choices:
          - text: >
              No: finiteness is checked one $t$ at a time.
            feedback: >
              It is checked one $t$ at a time, but the answers are linked. For
              every real $x$, $e^{x}$ is at most $e^{-x}$ (when $x < 0$) or
              $e^{2x}$ (when $x \ge 0$).
          - text: >
              Only if $X \ge 0$.
            feedback: >
              The bound $e^{x} \le e^{-x} + e^{2x}$ holds for every real $x$,
              negative or not, so no sign condition is needed.
          - text: >
              Yes: $e^{x} \le e^{-x} + e^{2x}$ for every $x$, so
              $M_X(1) \le M_X(-1) + M_X(2)$.
            correct: true
            feedback: >
              Right. The same domination works for any $t$ between two finite
              points, so the set where $M_X$ is finite is an interval, and it
              always contains $0$.
        feedback: >
          The finite set is an interval containing $0$. The only question is
          how wide — and it can be as narrow as a single point.
      - ask: >
          $X$ has density $x^{-2}$ on $x \ge 1$. For which $t$ is $M_X(t)$
          finite?
        choices:
          - text: >
              Every $t$, since the density integrates to $1$.
            feedback: >
              The density integrates, but $e^{tx}x^{-2}$ need not: for $t > 0$
              the exponential beats the polynomial decay $x^{-2}$ and the
              integral diverges.
          - text: >
              Only $t \le 0$.
            correct: true
            feedback: >
              For $t \le 0$, $e^{tx} \le 1$ and the integral is at most $1$.
              For any $t > 0$ it diverges. A tail decaying like a power is too
              heavy for any positive $t$.
          - text: >
              Only $t < 1$, by analogy with the exponential.
            feedback: >
              The exponential with rate $4$ allowed $t < 4$ because its tail
              was $e^{-4x}$. A power tail $x^{-2}$ decays slower than every
              exponential, so no positive $t$ survives.
        feedback: >
          Finite on $(-\infty, 0]$, which contains no interval around $0$: the
          standing hypothesis already fails.
      - ask: >
          Flip a fair coin to give that variable a random sign, so the density
          is $x^{-2}/2$ for $|x| \ge 1$. Where is $M_X$ finite now?
        choices:
          - text: >
              Only at $t = 0$.
            correct: true
            feedback: >
              Right. Positive $t$ hits the heavy right tail, negative $t$ the
              heavy left one. Only $M_X(0) = 1$ survives: an MGF in name only.
          - text: >
              On $(-1, 1)$, by symmetry.
            feedback: >
              Symmetry makes $M_X(t) = M_X(-t)$, so both sides are equally
              infinite. It does not create a finite neighbourhood.
          - text: >
              Nowhere, not even at $0$.
            feedback: >
              At $t = 0$ the integrand is the density itself, so
              $M_X(0) = 1$ for every random variable without exception.
        feedback: >
          That is why the hypothesis is stated every time: an MGF is only
          useful when it is finite on some $(-h, h)$. In an interview, define
          $\mathbb{E}[e^{tX}]$ and state that condition in the same breath.

  - node: quant-probability.mgf.mgf-moments
    hook: >
      Two derivatives at a single point, $t=0$, replace two separate
      integrals for $\mathbb{E}[X]$ and $\mathbb{E}[X^{2}]$ — this is where
      the transform genuinely pays for itself.
    explanation: >
      Expand $e^{tX}$ in its own Taylor series in $t$: $e^{tX} = \sum_k X^{k}
      t^{k}/k!$. Averaging term by term, justified once $M_X$ is finite on an
      interval around $0$, gives $M_X(t) = \sum_k \mathbb{E}[X^{k}]\,
      t^{k}/k!$ — an ordinary Taylor series in $t$ whose coefficients are the
      moments divided by $k!$. Differentiating $k$ times at $t=0$ reads off
      that coefficient times $k!$, which is $\mathbb{E}[X^{k}]$.

      This is the one convention difference worth keeping straight against
      the PGF: the PGF's variable $s$ is the outcome exponent itself, so its
      moments sit at $s=1$; the MGF's exponent variable $t$ is a separate
      dummy, so its moments sit naturally at $t=0$.

      Taking logs first is often faster: because $\ln$ turns a product into a
      sum, and $M_X(t)\approx 1+\mathbb{E}[X]t+\cdots$ near $t=0$, the
      cumulant generating function $K_X=\ln M_X$ has $K_X'(0)=\mathbb{E}[X]$
      and $K_X''(0)=\operatorname{Var}(X)$ directly, skipping the subtraction
      $\mathbb{E}[X^{2}]-(\mathbb{E}[X])^{2}$ the raw-moment route needs.
    worked: >
      Bernoulli$(0.3)$: $M(t)=0.7+0.3e^{t}$, so $M'(0)=0.3=\mathbb{E}[X]$ and
      $M''(0)=0.3=\mathbb{E}[X^{2}]$, giving $\operatorname{Var}(X) =
      0.3-0.3^{2}=0.21$. The cumulant route agrees: $K(t)=\ln(0.7+0.3e^{t})$
      gives $K'(0)=0.3$ and $K''(0)=0.21$ directly, without ever squaring
      $M'(0)$.
    interview: >
      "Derive the mean and variance of this law from its MGF" wants two
      derivatives at $0$, or logs first for the faster variance.
      Interviewers listen for the log shortcut named unprompted.
    pitfalls: >
      Differentiating at $t=1$ out of habit carried over from the PGF's
      derivative-at-$s=1$ convention — the MGF's moments sit at $t=0$.
      Forgetting that term-by-term differentiation of the Taylor series needs
      the finiteness-on-an-interval hypothesis to be justified.
    recap: >
      $M_X^{(k)}(0)=\mathbb{E}[X^{k}]$ turns every moment into a derivative
      at one point, and $K_X=\ln M_X$ hands you the mean and variance
      directly, skipping the usual subtraction.
    dialogue:
      - part: Moments locked inside M
        teach: >
          A market maker's inventory change over a minute, $X$, has moment
          generating function $M(t) = 0.2 + 0.5e^{t} + 0.3e^{2t}$, finite for
          every $t$.
      - ask: >
          Read the law off $M$ — each $e^{xt}$ term is the value $x$ — and
          compute $\mathbb{E}[X]$ directly.
        expects: "1.1"
        feedback: >
          $X$ is $0$, $1$, $2$ with probabilities $0.2$, $0.5$, $0.3$, so
          $\mathbb{E}[X] = 0.5 + 0.6 = 1.1$.
      - ask: >
          Now $M'(t) = 0.5e^{t} + 0.6e^{2t}$. At which $t$ does it return
          $1.1$?
        choices:
          - text: >
              $t = 1$, as with the PGF
            feedback: >
              $M'(1) = 0.5e + 0.6e^{2} \approx 5.79$. The PGF's moments sit at
              $s = 1$ because $s$ is raised to the power $X$; here $t$
              multiplies $X$ inside $e^{tX}$, so the neutral point is different.
          - text: >
              $t = 0$
            correct: true
            feedback: >
              $M'(0) = 0.5 + 0.6 = 1.1$. Each $e^{xt}$ differentiates to
              $xe^{xt}$, and at $t = 0$ the exponentials all become $1$.
          - text: >
              No single $t$; you need to integrate $M'$.
            feedback: >
              One evaluation does it: at $t = 0$ every $e^{xt}$ is $1$ and only
              the factor $x$ brought down by differentiation remains.
        feedback: >
          $t = 0$ is where $e^{tx} = 1$ for every $x$, as $s = 1$ was for the
          PGF. That is why MGF moments live at $0$.
      - ask: >
          What does $M''(0)$ equal here?
        expects: "1.7"
        feedback: >
          $M''(t) = 0.5e^{t} + 1.2e^{2t}$, so $M''(0) = 1.7$. Directly,
          $\mathbb{E}[X^{2}] = 0.5(1) + 0.3(4) = 1.7$. No falling factorial
          this time: the second derivative is the raw second moment.
      - reflect: >
          Why does the $k$-th derivative at $0$ give exactly
          $\mathbb{E}[X^{k}]$, for any law and not only this one? Think of
          $M$ as a Taylor series in $t$.
        answer: >
          $e^{tX} = \sum_k X^{k}t^{k}/k!$, so averaging term by term gives
          $M(t) = \sum_k \mathbb{E}[X^{k}]\,t^{k}/k!$. A power series' $k$-th
          derivative at $0$ is $k!$ times its $t^{k}$ coefficient, which is
          $\mathbb{E}[X^{k}]$. The moments are the Taylor coefficients, up to
          the $k!$ — provided averaging term by term is allowed.

      - part: The statement, and the hypothesis it spends
        teach: >
          If $M_X(t) < \infty$ for all $|t| < h$, some $h > 0$, then every
          moment of $X$ is finite, $M_X$ is infinitely differentiable on
          $(-h, h)$, and $M_X^{(k)}(0) = \mathbb{E}[X^{k}]$. Equivalently,
          $M_X(t) = \sum_k \mathbb{E}[X^{k}]\,t^{k}/k!$ near $0$.
      - ask: >
          Which step of that argument consumes the hypothesis that $M_X$ is
          finite on $(-h, h)$?
        choices:
          - text: >
              $M_X(0) = 1$.
            feedback: >
              That holds for every random variable with no hypothesis at all.
              It is the value at a single point, not anything about a
              neighbourhood.
          - text: >
              Exchanging $\mathbb{E}$ with the infinite sum, or with
              $d/dt$.
            correct: true
            feedback: >
              Right. Finiteness on both sides of $0$ dominates $|X|^{k}e^{t X}$
              uniformly for $t$ near $0$, which is what licenses the swap.
              Without it the series can diverge for every $t \ne 0$.
          - text: >
              Writing the Taylor series $e^{tx} = \sum_k (tx)^{k}/k!$.
            feedback: >
              That series converges for every real $tx$ — it is a fact about
              the exponential, needing nothing from $X$. The risk is in
              averaging it.
        feedback: >
          The algebra is free; the interchange of limit and expectation is
          what the hypothesis pays for.
      - ask: >
          $X$ is uniform on $[0, 2]$, so $M(t) = (e^{2t} - 1)/(2t)$ for
          $t \ne 0$. Find $\mathbb{E}[X^{2}]$.
        expects: "4/3"
        tolerance: 0.0005
        hint: >
          Differentiating that quotient twice at $0$ is messy. Expand
          $e^{2t}$ instead, divide by $2t$, and read the $t^{2}$ coefficient.
        feedback: >
          $(e^{2t} - 1)/(2t) = \sum_{k \ge 0} (2t)^{k}/(k+1)! =
          1 + t + (2/3)t^{2} + \cdots$. The $t^{2}$ coefficient is
          $\mathbb{E}[X^{2}]/2!$, so $\mathbb{E}[X^{2}] = 2 \times 2/3 = 4/3$.
          Reading coefficients beats differentiating a $0/0$ form.

      - part: Logs first, then the variance
        ask: >
          A desk's fill count has $M(t) = (0.7 + 0.3e^{t})^{4}$. Let
          $K(t) = \ln M(t) = 4\ln(0.7 + 0.3e^{t})$. What is $K''(0)$?
        expects: "0.84"
        hint: >
          $K'(t) = 1.2e^{t}/(0.7 + 0.3e^{t})$. Differentiate once more with the
          quotient rule, then set $t = 0$.
        feedback: >
          $K''(t) = 1.2e^{t}(0.7)/(0.7 + 0.3e^{t})^{2} = 0.84e^{t}/(0.7 +
          0.3e^{t})^{2}$, so $K''(0) = 0.84$. And $K'(0) = 1.2$, the mean.
      - ask: >
          The raw route gives $M'(0) = 1.2$ and $M''(0) = 2.28$. What is
          $\operatorname{Var}(X)$, and what does it say about $K''(0)$?
        choices:
          - text: >
              $2.28$: the second derivative is the variance.
            feedback: >
              $M''(0) = \mathbb{E}[X^{2}]$, the raw second moment. The variance
              still needs the squared mean subtracted.
          - text: >
              $0.84$, the same number $K''(0)$ gave directly.
            correct: true
            feedback: >
              $2.28 - 1.2^{2} = 0.84$. Taking logs first did the subtraction
              for you: $K''(0) = M''(0) - M'(0)^{2}$ whenever $M(0) = 1$.
          - text: >
              $1.08$, from $M''(0) - M'(0)$.
            feedback: >
              That subtracts the mean, not its square — a mix-up with the
              PGF's factorial-moment correction. The MGF gives raw moments, so
              $\operatorname{Var} = M''(0) - M'(0)^{2}$.
        feedback: >
          $K = \ln M$ is the cumulant generating function:
          $K'(0) = \mathbb{E}[X]$ and $K''(0) = \operatorname{Var}(X)$. When
          $M$ is a power or an exponential, logs first is the faster route.
      - ask: >
          $X$ has density $x^{-2}$ on $x \ge 1$, whose MGF is finite only for
          $t \le 0$. Can you read $\mathbb{E}[X]$ off as $M'(0)$?
        choices:
          - text: >
              Yes: the derivative at $0$ from the left still exists.
            feedback: >
              As $t \uparrow 0$ the slope grows without bound, matching
              $\mathbb{E}[X] = \int_1^\infty x \cdot x^{-2}\,dx = \infty$.
              There is no finite moment to read.
          - text: >
              No: $M$ is not finite on any interval around $0$, and indeed
              $\mathbb{E}[X] = \infty$.
            correct: true
            feedback: >
              Right. The hypothesis fails, and the conclusion fails with it:
              this law does not even have a finite mean.
          - text: >
              Yes, because $M'(0) = \mathbb{E}[X]$ for every variable.
            feedback: >
              Only under the standing hypothesis. Here $M$ is infinite for all
              $t > 0$, so it has no two-sided derivative at $0$ at all.
        feedback: >
          The moment formula is a consequence of finiteness on $(-h, h)$, not a
          free identity. In an interview, say the hypothesis before you
          differentiate — and differentiate at $0$, never at $1$.

  - node: quant-probability.mgf.mgf-scaling
    hook: >
      One computation on a standardized shape buys the MGF of an entire
      location-scale family for free — this is the actual mechanism, not a
      coincidence, behind why every named continuous law has one canonical
      member worth memorizing.
    explanation: >
      Derive the rule directly: $M_{aX+b}(t) = \mathbb{E}[e^{t(aX+b)}] =
      \mathbb{E}[e^{bt}e^{(at)X}] = e^{bt}\mathbb{E}[e^{(at)X}] =
      e^{bt}M_X(at)$ — pull the constant $e^{bt}$ outside the expectation
      (it carries no randomness) and recognize what's left as $M_X$ evaluated
      at the rescaled argument $at$. The domain shifts to match: finite
      exactly where $at$ lies in $X$'s own domain of finiteness.

      This is the whole mechanism behind "compute one member, get the family
      for free." Standardizing $Z=(X-\mu)/\sigma$ sets $a=1/\sigma$,
      $b=-\mu/\sigma$; once one shape's standardized MGF is known in closed
      form, every location-scale member of that family is a substitution
      away.

      Setting $a=-1,b=0$ gives the mirror rule $M_{-X}(t)=M_X(-t)$, so a
      distribution symmetric about $0$ — where $-X$ and $X$ share a law —
      must have an even $M_X$. Checking evenness is a fast way to catch an
      algebra slip in a computed MGF for any symmetric law.
    worked: >
      $X\sim\text{Bernoulli}(0.4)$ has $M_X(t)=0.6+0.4e^{t}$. Let
      $Y=3X-1$: the rule gives $M_Y(t) = e^{-t}M_X(3t) = e^{-t}(0.6+0.4e^{3t})
      = 0.6e^{-t}+0.4e^{2t}$. Checking directly: $Y=-1$ with probability
      $0.6$ (when $X=0$) or $Y=2$ with probability $0.4$ (when $X=1$), giving
      $M_Y(t)=0.6e^{-t}+0.4e^{2t}$ — matching exactly.
    interview: >
      "If you know $M_X$, what's $M_{aX+b}$" checks the derivation, not just
      the formula — pull $e^{bt}$ out of the expectation on the spot rather
      than quoting the rule. Expect a follow-up asking you to identify an
      entire family from one standardized MGF.
    pitfalls: >
      Writing $M_{aX+b}(t)=aM_X(t)+b$, treating the MGF as if it transforms
      like $X$ itself, instead of the correct $e^{bt}M_X(at)$. Forgetting the
      domain rescales too — $M_X$ finite on $|t|<h$ only guarantees
      $M_{aX+b}$ finite on $|t|<h/|a|$.
    recap: >
      $M_{aX+b}(t)=e^{bt}M_X(at)$ falls out of pulling a constant through the
      expectation, and it's the single fact that turns one standardized
      computation into an entire location-scale family of MGFs.
    dialogue:
      - part: Ticks into dollars
        teach: >
          A scalper's P&L over one trade is $X = -1$ or $X = +1$ tick, each
          with probability $1/2$, so $M_X(t) = (e^{-t} + e^{t})/2$. Each tick is
          worth $5$ dollars and every trade earns a fixed $10$-dollar rebate, so
          the dollar P&L is $Y = 5X + 10$.
      - ask: >
          $Y$ is $5$ or $15$, each with probability $1/2$. Compute $M_Y(0.1)$
          directly.
        expects: "3.0652"
        tolerance: 0.0005
        feedback: >
          $M_Y(0.1) = (e^{0.5} + e^{1.5})/2 \approx (1.64872 + 4.48169)/2 =
          3.0652$.
      - ask: >
          Which expression in $M_X$ gives $M_Y(t)$ for every $t$?
        choices:
          - text: >
              $5M_X(t) + 10$
            feedback: >
              That transforms the MGF the way $Y$ transforms $X$, and the MGF
              does not work that way. At $t = 0$ it gives $15$, but every MGF
              equals $1$ at $0$.
          - text: >
              $e^{5t}M_X(10t)$
            feedback: >
              The roles are swapped. At $t = 0.1$ this is
              $e^{0.5}(e^{-1} + e^{1})/2 \approx 2.54$, not $3.0652$. The shift
              should sit in the exponential prefactor, the scale inside $M_X$.
          - text: >
              $e^{10t}M_X(5t)$
            correct: true
            feedback: >
              $e^{10t}(e^{-5t} + e^{5t})/2 = (e^{5t} + e^{15t})/2$, exactly
              $M_Y$. At $t = 0.1$ it returns $3.0652$.
        feedback: >
          The shift becomes a prefactor $e^{10t}$ and the scale multiplies the
          argument. Neither touches $M_X$ the way they touch $X$.
      - reflect: >
          Derive it rather than remember it: start from
          $\mathbb{E}[e^{t(aX + b)}]$. What comes out of the expectation, and
          what is left inside?
        answer: >
          $e^{t(aX + b)} = e^{bt}e^{(at)X}$. The factor $e^{bt}$ is not random,
          so it leaves the expectation, and what remains is
          $\mathbb{E}[e^{(at)X}] = M_X(at)$. So
          $M_{aX+b}(t) = e^{bt}M_X(at)$, finite exactly when $at$ lies where
          $M_X$ is finite. Three lines, and the interviewer wants to hear all
          three.

      - part: One computation, a whole family
        teach: >
          The rule is $M_{aX+b}(t) = e^{bt}M_X(at)$. Its main use: compute one
          member of a family and get the rest by substitution. Completing the
          square in the Gaussian integral gives $M_Z(t) = e^{t^{2}/2}$ for a
          standard normal $Z$, and every normal is $\mu + \sigma Z$.
      - ask: >
          $X = 2 + 3Z$ is normal with mean $2$ and standard deviation $3$.
          Which is $M_X(t)$?
        choices:
          - text: >
              $\exp(2t + 3t^{2}/2)$
            feedback: >
              The scale enters through $M_Z(3t) = e^{(3t)^{2}/2}$, so it is
              squared: $9t^{2}/2$. Writing $3$ instead of $9$ mixes up the
              standard deviation and the variance.
          - text: >
              $\exp(2 + 9t^{2}/2)$
            feedback: >
              The shift contributes $e^{bt} = e^{2t}$, not $e^{2}$. At $t = 0$
              this gives $e^{2}$ instead of $1$.
          - text: >
              $\exp(2t + 9t^{2}/2)$
            correct: true
            feedback: >
              $e^{2t}M_Z(3t) = e^{2t}e^{9t^{2}/2}$. In general
              $\exp(\mu t + \sigma^{2}t^{2}/2)$.
        feedback: >
          The whole normal family from one integral:
          $M_X(t) = \exp(\mu t + \sigma^{2}t^{2}/2)$.
      - ask: >
          For that $X = 2 + 3Z$, what is $M_X(0.2)$?
        expects: "1.786"
        tolerance: 0.0005
        feedback: >
          $\exp(2(0.2) + 9(0.04)/2) = \exp(0.4 + 0.18) = e^{0.58} \approx
          1.7860$.

      - part: Signs, mirrors and domains
        ask: >
          Take $a = -1$, $b = 0$. What is $M_{-X}(t)$?
        choices:
          - text: >
              $1/M_X(t)$
            feedback: >
              Negating $X$ does not invert the expectation:
              $\mathbb{E}[e^{-tX}]$ is not $1/\mathbb{E}[e^{tX}]$. For the
              scalper, $M_X$ is even, so $1/M_X$ would give $M_{-X}(1) \approx
              0.65$ while the truth is $M_X(1) \approx 1.54$.
          - text: >
              $M_X(-t)$
            correct: true
            feedback: >
              $e^{0}M_X(-t)$. Negating the variable reflects the MGF.
          - text: >
              $-M_X(t)$
            feedback: >
              An MGF is an average of positive numbers, so it is never
              negative. At $t = 0$ this gives $-1$.
        feedback: >
          The mirror rule $M_{-X}(t) = M_X(-t)$. If $X$ and $-X$ have the same
          law, $M_X$ must be even — as the scalper's $(e^{-t} + e^{t})/2$ is.
      - ask: >
          A colleague says $X$ is symmetric about $0$ and reports
          $M_X(t) = (e^{-2t} + 2 + e^{3t})/4$. What do you tell them?
        choices:
          - text: >
              Fine: it equals $1$ at $t = 0$.
            feedback: >
              $M_X(0) = 1$ is required of every MGF, symmetric or not. The
              symmetry claim needs a different test.
          - text: >
              It is not even — $M_X(-t)$ swaps $e^{-2t}$ for $e^{2t}$ — so
              either the MGF or the symmetry claim is wrong.
            correct: true
            feedback: >
              The law it encodes puts mass $1/4$ at $-2$ and $1/4$ at $+3$, not
              at $\pm 2$ or $\pm 3$. One substitution, $t \to -t$, catches it.
          - text: >
              Fine, as long as its mean is $0$.
            feedback: >
              Its mean is $M_X'(0) = (-2 + 3)/4 = 1/4$, not $0$. And a zero
              mean would still not make a law symmetric.
        feedback: >
          For a law claimed symmetric, check $M_X(-t) = M_X(t)$ before
          anything else. It costs one substitution.
      - ask: >
          $X$ is exponential with rate $4$, so $M_X(u) = 4/(4 - u)$, finite for
          $u < 4$. Let $Y = -3X$. Then $M_Y(t) = M_X(-3t)$ is finite exactly
          for $t > c$. What is $c$?
        expects: "-4/3"
        tolerance: 0.0005
        hint: >
          You need $-3t < 4$. Dividing by a negative number flips the
          inequality.
        feedback: >
          $-3t < 4$ means $t > -4/3$. The negative scale flips the domain to
          the other side of $0$, and the factor $3$ shrinks it: the tail of $Y$
          now runs to the left, three times as long, so it is negative $t$
          that eventually breaks.
      - teach: >
          Asked "if you know $M_X$, what is $M_{aX+b}$?", derive it aloud in
          the three lines from the reflection, then say where it is finite:
          wherever $at$ lands inside the domain of $M_X$.

  - node: quant-probability.mgf.mgf-sums
    hook: >
      This is the payoff line of the whole subject stated plainly:
      independent sums turn into ordinary multiplication, and it's the
      fastest way to name a sum's distribution without ever building it from
      a convolution.
    explanation: >
      Independence of $X,Y$ makes $e^{tX}$ and $e^{tY}$ independent, since
      they're separate functions of independent variables, so
      $M_{X+Y}(t)=\mathbb{E}[e^{t(X+Y)}]=\mathbb{E}[e^{tX}e^{tY}]
      =\mathbb{E}[e^{tX}]\,\mathbb{E}[e^{tY}]=M_X(t)M_Y(t)$, valid on the
      overlap of their domains. This is the exact mirror of the PGF sum rule
      with $s^{X}$ replaced by $e^{tX}$ — the same mechanism, independent
      functions of independent variables have factoring expectations.

      Taking logs turns this into addition: $\ln$ of a product is a sum of
      logs, so cumulant generating functions add across independent
      summands, $K_{X+Y}=K_X+K_Y$, which is exactly why cumulants are
      additive with no cross terms to track.

      Two things this rule needs and doesn't give: it genuinely requires
      independence, not merely zero covariance — the factoring step used
      independence of the exponentials directly, and uncorrelated variables
      need not satisfy it. And the converse fails: matching
      $M_{X+Y}=M_XM_Y$ never certifies independence on its own.
    worked: >
      $X$ takes $0$ or $1$ with probabilities $0.6, 0.4$, and independently
      $Y$ takes $0$ or $2$ with probabilities $0.7, 0.3$. Then $M_X(t)=
      0.6+0.4e^{t}$, $M_Y(t)=0.7+0.3e^{2t}$, so $M_X(t)M_Y(t) =
      0.42+0.28e^{t}+0.18e^{2t}+0.12e^{3t}$. Reading the $e^{t}$ coefficient,
      $\Pr(X+Y=1)=0.28$, matching directly:
      $\Pr(X=1,Y=0)=0.4(0.7)=0.28$.
    interview: >
      "What's the MGF of the sum of two independent laws" tests the reflex
      to multiply. A common follow-up asks whether zero correlation alone
      would suffice — it doesn't, independence is genuinely used.
    pitfalls: >
      Applying $M_{X+Y}=M_XM_Y$ to variables that are merely uncorrelated —
      correlation zero doesn't make the cross-expectation factor. Treating a
      matching product MGF as proof the variables are independent, when it's
      only a necessary consequence, not a characterization.
    recap: >
      Independent MGFs multiply, $M_{X+Y}=M_XM_Y$, turning a convolution into
      ordinary multiplication — but the rule needs genuine independence and
      its converse never holds.
    dialogue:
      - part: Two signals, one position
        teach: >
          Two independent signals feed one position. Signal $X$ is $-1$ or $+1$
          with probability $1/2$ each, so $M_X(t) = (e^{-t} + e^{t})/2$. Signal
          $Y$ is $0$ or $2$ with probability $1/2$ each, so
          $M_Y(t) = (1 + e^{2t})/2$. The position is $X + Y$.
      - ask: >
          $X + Y$ takes the values $-1$, $1$, $1$, $3$, each pair with
          probability $1/4$. Compute $M_{X+Y}(1)$ directly.
        expects: "6.4725"
        tolerance: 0.0005
        feedback: >
          $(e^{-1} + 2e + e^{3})/4 \approx (0.36788 + 5.43656 + 20.08554)/4 =
          25.88998/4 \approx 6.4725$.
      - ask: >
          Now compute $M_X(1) \times M_Y(1)$.
        expects: "6.4725"
        tolerance: 0.0005
        feedback: >
          $M_X(1) = (e^{-1} + e)/2 \approx 1.54308$ and
          $M_Y(1) = (1 + e^{2})/2 \approx 4.19453$, whose product is
          $\approx 6.4725$ — the same number, from two one-variable
          computations instead of four joint outcomes.
      - reflect: >
          Why did the product of the two MGFs reproduce the MGF of the sum?
          Write $e^{t(X+Y)}$ another way and say which fact about $X$ and $Y$
          you then need.
        answer: >
          $e^{t(X+Y)} = e^{tX}e^{tY}$. Because $X$ and $Y$ are independent, so
          are $e^{tX}$ and $e^{tY}$ — each is a function of one variable — and
          the expectation of a product of independent variables is the
          product of the expectations. So $M_{X+Y}(t) = M_X(t)M_Y(t)$: the law
          of exponents does the algebra and independence does the rest.

      - part: Products for sums, sums for logs
        teach: >
          For independent $X$ and $Y$ whose MGFs are finite on a common
          interval $|t| < h$, $M_{X+Y}(t) = M_X(t)M_Y(t)$ there, and $n$
          independent copies give $M_X(t)^{n}$. This is the convolution of two
          laws done as a multiplication. Its fine print: independence is
          used, and the product is only promised where both factors are
          finite.
      - ask: >
          Four independent copies of $Y$ are summed. Their MGF is
          $((1 + e^{2t})/2)^{4}$. What is the probability the total is $4$?
        expects: "3/8"
        tolerance: 0.0005
        hint: >
          Expand $(1 + e^{2t})^{4}$ and find the coefficient of $e^{4t}$.
        feedback: >
          $(1 + e^{2t})^{4}/16$ has $e^{4t}$-coefficient $\binom{4}{2}/16 =
          6/16 = 3/8$: two of the four copies show $2$. Each term $e^{xt}$
          carries the probability of the value $x$, just as $s^{k}$ did.
      - ask: >
          Take logs: $K = \ln M$. What does the product rule become for
          cumulant generating functions?
        choices:
          - text: >
              $K_{X+Y} = K_X K_Y$
            feedback: >
              The log of a product is a sum, not a product. Both $K_X$ and
              $K_Y$ vanish at $0$, so their product has zero slope there and
              could not carry the mean of $X + Y$.
          - text: >
              $K_{X+Y} = K_X + K_Y$
            correct: true
            feedback: >
              Right. Differentiating twice at $0$ gives
              $\operatorname{Var}(X + Y) = \operatorname{Var}(X) +
              \operatorname{Var}(Y)$, and every higher cumulant adds the same
              way.
          - text: >
              $K_{X+Y} = \ln(K_X + K_Y)$
            feedback: >
              That takes the log twice. One log turns the product
              $M_XM_Y$ into the sum $\ln M_X + \ln M_Y$.
        feedback: >
          Cumulants of independent sums add with no cross terms — the log of
          the product rule.
      - ask: >
          $X$ is exponential with rate $4$, $M_X$ finite for $t < 4$. $W$ is
          minus an exponential with rate $3$, $M_W$ finite for $t > -3$. They
          are independent. Where is $M_{X+W}$ promised finite?
        choices:
          - text: >
              Everywhere: the two tails cancel.
            feedback: >
              Tails do not cancel in an MGF. For $t \ge 4$ the factor $M_X(t)$
              is already infinite, and the right tail of $X$ is still in the
              sum.
          - text: >
              On $(-3, 4)$, where both are finite.
            correct: true
            feedback: >
              Right. The product is finite exactly on the overlap of the two
              domains — here an interval around $0$, so the sum still has a
              usable MGF.
          - text: >
              On $t < 4$, the domain of $X$.
            feedback: >
              For $t \le -3$ the factor $M_W(t)$ is infinite. The constraint
              comes from both sides: $t < 4$ for $X$ and $t > -3$ for $W$.
        feedback: >
          The product rule holds on the common interval. A sum's MGF is no
          better behaved than its worse summand on each side.

      - part: What independence buys, and what it does not
        ask: >
          $X$ is uniform on $\{-2, 0, 2\}$ and $Y = X^{2}$. They are
          uncorrelated: $\mathbb{E}[XY] = \mathbb{E}[X^{3}] = 0 =
          \mathbb{E}[X]\mathbb{E}[Y]$. Does $M_X M_Y$ give the MGF of $X + Y$?
        choices:
          - text: >
              Yes: zero correlation makes the cross term vanish.
            feedback: >
              Zero correlation factors $\mathbb{E}[XY]$ and nothing else. The
              MGF needs $\mathbb{E}[e^{tX}e^{tY}]$ to factor for every $t$, a
              statement about every moment at once.
          - text: >
              No: the product has an $e^{-2t}$ term, claiming $X + Y = -2$ is
              possible, but $X + Y$ is only ever $0$, $2$ or $6$.
            correct: true
            feedback: >
              $X = -2$ gives $2$, $X = 0$ gives $0$, $X = 2$ gives $6$. The
              product $\frac{e^{-2t} + 1 + e^{2t}}{3} \cdot \frac{1 + 2e^{4t}}{3}$
              puts mass $1/9$ on $-2$, a value the sum never takes.
          - text: >
              Yes, because $X$ and $Y$ are each bounded.
            feedback: >
              Boundedness makes every MGF finite; it does not make anything
              factor. $Y$ is a function of $X$, as dependent as can be.
        feedback: >
          The product rule needs independence, not zero correlation.
      - ask: >
          A colleague finds $M_{X+Y}(t) = M_X(t)M_Y(t)$ for every $t$ and
          concludes $X$ and $Y$ are independent. Is the conclusion justified?
        choices:
          - text: >
              Yes: independence implies the identity and the identity implies
              independence.
            feedback: >
              Only the first half holds. The identity is a statement about one
              variable, $X + Y$, and cannot pin down the joint law of the pair
              — there are dependent pairs for which it holds.
          - text: >
              Yes, provided the MGFs are finite near $0$.
            feedback: >
              Finiteness makes the three MGFs usable objects. It says nothing
              about how $X$ and $Y$ are coupled.
          - text: >
              No: the identity only constrains the law of the sum, and
              dependent pairs can satisfy it.
            correct: true
            feedback: >
              Right. Independence is sufficient for the product rule, not
              necessary. To establish independence you need the joint law, not
              the law of one combination of the two.
        feedback: >
          In an interview: "independent MGFs multiply; zero correlation is not
          enough; and the converse fails." The three clauses together are the
          full answer.

  - node: quant-probability.mgf.standard-mgfs
    hook: >
      This table is expected memorized cold, but the domain column is what
      actually separates a candidate who understands the transform from one
      who's pattern-matched a formula sheet.
    explanation: >
      Every entry drops out of the same LOTUS computation done directly.
      Exponential$(\lambda)$ is the clearest: $M(t) = \int_0^{\infty}
      e^{tx}\lambda e^{-\lambda x}\,dx = \lambda\int_0^{\infty}
      e^{-(\lambda-t)x}\,dx$, and this converges to $\lambda/(\lambda-t)$
      exactly when $\lambda-t>0$, i.e. $t<\lambda$; for $t\ge\lambda$ the
      integrand no longer decays and the integral is infinite.

      That one computation explains the entire one-sided-domain pattern: any
      law whose tail decays like $e^{-\lambda x}$ can only absorb an extra
      $e^{tx}$ growth factor up to rate $t=\lambda$ before the product stops
      decaying — geometric, exponential and gamma all cut off at their own
      decay rate, while Bernoulli, binomial, Poisson and normal have tails
      that vanish faster than any exponential rate, so no $t$ ever breaks
      them.

      The normal entry needs a genuine integral trick (completing the square
      in the Gaussian density) rather than a geometric-style sum, but the
      mechanism producing "finite for all $t$" is the same tail argument: a
      Gaussian tail decays faster than any exponential.
    worked: >
      Geometric$(p=0.5)$ on $\{1,2,\dots\}$ has $M(t) = 0.5e^{t}/(1-0.5e^{t})$,
      valid only for $t<\ln 2\approx0.693$. At $t=0.6$: $0.5e^{0.6}\approx
      0.911$, so $M(0.6)\approx0.911/(1-0.911)\approx10.2$ — finite but
      already large. At $t=0.7$, just past the boundary: $0.5e^{0.7}\approx
      1.007>1$, so the defining sum $\sum_k (0.5e^{0.7})^{k-1}(0.5)e^{0.7}$
      diverges — the MGF genuinely stops existing exactly where the
      restriction says it should.
    interview: >
      "State the MGF of a Poisson, exponential or normal" is asked directly
      and fast — fluency means naming the domain restriction unprompted for
      exponential and geometric, since forgetting it signals rote memory.
    pitfalls: >
      Quoting the exponential or geometric MGF as valid "for all $t$" —
      copying the always-finite pattern of Bernoulli, binomial, Poisson and
      normal onto laws with an actual tail cutoff. Mixing up which parameter
      bounds $t$: the rate $\lambda$ for exponential and gamma, versus
      $\ln(1/q)$ for geometric.
    recap: >
      Every entry in the table is one LOTUS computation, and whether the
      domain is "all $t$" or cuts off at the law's own tail-decay rate is
      determined entirely by how fast that tail decays.
    dialogue:
      - part: A payoff that grows with the wait
        teach: >
          A resting quote survives for an exponential time $T$ with rate $4$
          per second: density $4e^{-4x}$ for $x > 0$. A desk structures a
          payoff worth $e^{tT}$, so its fair value is the MGF $M_T(t)$.
      - ask: >
          Compute $M_T(1) = \int_0^\infty e^{x} \cdot 4e^{-4x}\,dx$.
        expects: "4/3"
        tolerance: 0.0005
        feedback: >
          $4\int_0^\infty e^{-3x}\,dx = 4/3 \approx 1.3333$. In general
          $\int_0^\infty e^{tx}\lambda e^{-\lambda x}\,dx = \lambda/(\lambda -
          t)$ — here $4/(4 - 1)$.
      - ask: >
          For which $t$ is $M_T(t) = 4/(4 - t)$ actually finite?
        choices:
          - text: >
              $|t| < 4$
            feedback: >
              Negative $t$ is harmless: $T > 0$, so $e^{tT} \le 1$ whenever
              $t \le 0$. Only the right side has a cutoff.
          - text: >
              $t < 4$
            correct: true
            feedback: >
              The integrand is $4e^{-(4 - t)x}$, which decays exactly when
              $4 - t > 0$. At $t = 4$ it is the constant $4$, and the integral
              diverges.
          - text: >
              Every $t \ne 4$, where the formula makes sense
            feedback: >
              For $t > 4$ the formula returns a negative number, while
              $e^{tT} > 0$. The formula outlives the integral it came from.
        feedback: >
          The exponential's MGF stops at $t = \lambda$, the rate at which its
          tail decays. The domain is part of the entry.
      - ask: >
          Fills in a second are Poisson$(\lambda)$:
          $\Pr(N = k) = e^{-\lambda}\lambda^{k}/k!$. Which is
          $\sum_k e^{-\lambda}\lambda^{k}e^{tk}/k!$?
        choices:
          - text: >
              $\exp(\lambda(e^{t} - 1))$, for every $t$
            correct: true
            feedback: >
              $\sum_k (\lambda e^{t})^{k}/k! = e^{\lambda e^{t}}$, times
              $e^{-\lambda}$. The exponential series converges for every
              argument, so there is no cutoff.
          - text: >
              $\exp(\lambda(t - 1))$, for every $t$
            feedback: >
              The $k$-th term carries $e^{tk} = (e^{t})^{k}$, so what gets
              summed is $\lambda e^{t}$, not $\lambda t$. At $t = 0$ this
              wrong form gives $e^{-\lambda}$ instead of $1$.
          - text: >
              $\exp(\lambda(e^{t} - 1))$, for $t < \ln\lambda$
            feedback: >
              The exponential series $\sum_k x^{k}/k!$ converges for every $x$;
              the $k!$ overwhelms any geometric growth $(\lambda e^{t})^{k}$.
              There is no cutoff to find.
        feedback: >
          Poisson: $\exp(\lambda(e^{t} - 1))$ for all $t$. Two derivations,
          two different domains.
      - reflect: >
          The exponential's MGF dies at $t = 4$; the Poisson's never dies. What
          property of a law decides where its MGF stops being finite?
        answer: >
          How fast the tail decays. $e^{tx}$ grows at exponential rate $t$, so
          a tail decaying like $e^{-\lambda x}$ can absorb it only while
          $t < \lambda$. A Poisson tail decays like $\lambda^{k}/k!$, and a
          normal tail like $e^{-x^{2}/2}$ — both faster than every
          exponential — so no $t$ breaks them. Exponential, gamma and
          geometric cut off at their own decay rate.

      - part: The table, domains included
        teach: >
          With $q = 1 - p$: Bernoulli$(p)$: $q + pe^{t}$, all $t$.
          Binomial$(n, p)$: $(q + pe^{t})^{n}$, all $t$. Poisson$(\lambda)$:
          $\exp(\lambda(e^{t} - 1))$, all $t$. Geometric$(p)$ on
          $\{1, 2, \dots\}$: $pe^{t}/(1 - qe^{t})$, for $t < \ln(1/q)$.
          Exponential$(\lambda)$: $\lambda/(\lambda - t)$, for $t < \lambda$.
          Gamma, shape $n$, rate $\lambda$: $(\lambda/(\lambda - t))^{n}$,
          for $t < \lambda$. Normal$(\mu, \sigma^{2})$:
          $\exp(\mu t + \sigma^{2}t^{2}/2)$, all $t$.
      - ask: >
          A gamma variable has shape $3$ and rate $2$. What is $M(1)$?
        expects: "8"
        feedback: >
          $(2/(2 - 1))^{3} = 2^{3} = 8$, and $t = 1$ is inside the domain
          $t < 2$.
      - ask: >
          $X$ is Binomial$(3, 0.4)$. What is $M_X(\ln 2)$, that is,
          $\mathbb{E}[2^{X}]$?
        expects: "2.744"
        tolerance: 0.0005
        feedback: >
          $(0.6 + 0.4e^{\ln 2})^{3} = (0.6 + 0.8)^{3} = 1.4^{3} = 2.744$. The
          entry comes from the binomial theorem:
          $\sum_k \binom{3}{k}(0.4e^{t})^{k}0.6^{3-k} = (0.6 + 0.4e^{t})^{3}$.
      - ask: >
          $X$ is normal with mean $1$ and variance $0.25$. What is $M_X(2)$?
        expects: "12.1825"
        tolerance: 0.0005
        feedback: >
          $\exp(1 \cdot 2 + 0.25 \cdot 4/2) = \exp(2 + 0.5) = e^{2.5} \approx
          12.1825$. No domain to check: a normal MGF is finite everywhere.

      - part: Reading the domain column
        ask: >
          The geometric entry $pe^{t}/(1 - qe^{t})$ comes from summing
          $\sum_{k \ge 1} q^{k-1}p\,e^{tk}$. What condition does that sum need?
        choices:
          - text: >
              $qe^{t} < 1$, so the ratio of the geometric series is below $1$
            correct: true
            feedback: >
              Right: $t < \ln(1/q)$. The tail $q^{k}$ decays at rate
              $\ln(1/q)$ per step, and $e^{tk}$ must grow slower.
          - text: >
              $t < p$, by analogy with the exponential's $t < \lambda$
            feedback: >
              The analogy is right in spirit — the cutoff is the tail's decay
              rate — but the geometric tail is $q^{k} = e^{-k\ln(1/q)}$, so the
              rate is $\ln(1/q)$, not $p$.
          - text: >
              None: a discrete law's MGF is finite everywhere.
            feedback: >
              That holds for finitely many values, like Bernoulli and binomial.
              The geometric takes infinitely many, and its tail is only
              exponentially light.
        feedback: >
          The bound to quote is $t < \ln(1/q)$ for the geometric and
          $t < \lambda$ for exponential and gamma.
      - ask: >
          A candidate says "every MGF on the table is finite for all $t$". Which
          entry is the quickest counterexample, and why?
        choices:
          - text: >
              Normal, since its tails are infinite
            feedback: >
              Normal tails reach to infinity, but they decay like
              $e^{-x^{2}/2}$, faster than any $e^{tx}$ grows. Its MGF is
              finite for every $t$.
          - text: >
              Poisson, since its values are unbounded
            feedback: >
              Unbounded values are not enough: the $1/k!$ in the Poisson pmf
              beats any exponential, so the Poisson MGF is finite everywhere.
          - text: >
              Exponential, since its tail decays only at rate $\lambda$
            correct: true
            feedback: >
              Right. At $t = \lambda$ the integrand stops decaying and the
              integral diverges. Gamma and geometric fail the same way.
        feedback: >
          In an interview, state the domain with the formula for exponential,
          gamma and geometric. Leaving it off is the tell that the table was
          memorized rather than derived.

  - node: quant-probability.mgf.identification
    hook: >
      Once two transforms agree, you're done — this is what makes "compute
      the MGF and match it to the table" a complete method of identifying an
      unknown law, not just a heuristic.
    explanation: >
      The PGF version needs no extra hypothesis and is genuinely elementary:
      a power series is entirely determined by its coefficients, and two
      power series agreeing on any interval, however small, agree termwise.
      Since $G_X$'s coefficients are exactly $X$'s pmf, matching PGFs
      anywhere inside their common radius of convergence already forces the
      two pmfs to be identical.

      MGF uniqueness is a strictly deeper fact. $M_X$ is not a power series
      restricted to countably many integer-indexed coefficients the way
      $G_X$ is, so recovering the law genuinely requires an inversion
      argument relating the transform back to a pmf or density — which is
      why this result is only stated here, not proved.

      The payoff is a recipe: compute an unknown law's transform, match the
      closed form against a recognizable formula, and the law is determined —
      no separate argument needed. But the MGF version needs the finiteness
      hypothesis on a genuine neighborhood of $0$; having every individual
      moment finite is strictly weaker and never substitutes for confirming
      the transforms actually match.
    worked: >
      Suppose $X$ has PGF $G_X(s)=0.2+0.3s+0.5s^{2}$ and $Y$'s PGF is only
      known to agree with $G_X$'s on the tiny interval $(-0.1,0.1)$. Because
      both are finite power series agreeing at infinitely many points in that
      interval, every coefficient must match: $\Pr(Y=0)=0.2$, $\Pr(Y=1)=0.3$,
      $\Pr(Y=2)=0.5$, identical to $X$ — even though agreement was only
      confirmed on a small interval near $0$.
    interview: >
      "How do you know this is a [named distribution]" wants "its transform
      matches the known form on an interval around $0$" as the complete
      justification. Interviewers listen for candidates who don't hedge by
      also checking moments individually, since that's unnecessary once the
      transforms match.
    pitfalls: >
      Treating agreement of individual moments, even infinitely many, as
      equivalent to matching the transform — it's strictly weaker and can
      fail to pin down the law. Invoking MGF uniqueness without first
      confirming both MGFs are finite on a shared neighborhood of $0$.
    recap: >
      Equal PGFs on any interval, or equal and genuinely finite MGFs near
      $t=0$, force equal distributions — matching a transform is a complete
      proof of identity, not just supporting evidence.
    dialogue:
      - part: Is this variable exponential?
        teach: >
          A simulation draws $U$ uniform on $(0, 1)$ and outputs
          $Y = -\ln U$. The author claims $Y$ is exponential with rate $1$,
          whose MGF is $\int_0^\infty e^{tx}e^{-x}\,dx = 1/(1 - t)$ for $t < 1$.
      - ask: >
          $e^{tY} = U^{-t}$. Compute $M_Y(0.5) = \mathbb{E}[U^{-0.5}] =
          \int_0^1 u^{-1/2}\,du$.
        expects: "2"
        feedback: >
          $\int_0^1 u^{-1/2}\,du = [2u^{1/2}]_0^1 = 2$, and $1/(1 - 0.5) = 2$
          too. In general $\int_0^1 u^{-t}\,du = 1/(1 - t)$ for $t < 1$ —
          exactly the exponential's MGF, on the same interval.
      - reflect: >
          $M_Y$ and the exponential MGF agree on all of $t < 1$. Does that
          settle that $Y$ is exponential? What would have to be true about
          MGFs in general for it to settle it — and why is the analogous claim
          for PGFs easier to believe?
        answer: >
          It settles it only if an MGF that is finite near $0$ determines the
          law: no two different laws may share one. For PGFs that is
          elementary, because the coefficients of a power series are its
          derivatives at $0$ divided by $k!$, and those coefficients are the
          pmf. An MGF is not indexed by integer coefficients that way, so the
          MGF claim is a genuinely deeper theorem — an inversion argument —
          and it is the one you need here.

      - part: The uniqueness theorem
        teach: >
          Uniqueness, stated without proof: if $M_X(t) = M_Y(t)$, finite, for
          all $|t| < h$ with some $h > 0$, then $X$ and $Y$ have the same
          distribution. For counts, $G_X = G_Y$ on any interval inside
          $(-1, 1)$ forces $p_k = q_k$ for every $k$, with no extra hypothesis.
          So $-\ln U$ is exponential with rate $1$ — the inverse-transform
          method, proved by transforms.
      - ask: >
          Two counts have PGFs that agree on $(0, 0.1)$. What forces their pmfs
          to agree?
        choices:
          - text: >
              Both PGFs equal $1$ at $s = 1$.
            feedback: >
              Every PGF does. That rules out nothing and is not even in the
              interval where they agree.
          - text: >
              The values on $(0, 0.1)$ determine every derivative at $0$, and
              $p_k = G^{(k)}(0)/k!$.
            correct: true
            feedback: >
              Right. Values on an interval reaching $0$ fix the derivatives
              there, and the derivatives are the probabilities, up to $k!$.
          - text: >
              Two polynomials agreeing at infinitely many points are equal.
            feedback: >
              True for polynomials, but a PGF can be an infinite series. The
              argument has to work through the coefficients, which it does via
              the derivatives at $0$.
        feedback: >
          The PGF case is coefficient matching. The MGF case needs the deeper
          theorem — and its hypothesis.
      - ask: >
          A count has $M_X(t) = e^{2t}(0.5 + 0.5e^{t})^{2}$, finite everywhere.
          What is $\Pr(X = 3)$?
        expects: "0.5"
        hint: >
          Expand into a sum of terms $c\,e^{xt}$. Each one is the MGF piece of
          mass $c$ at value $x$.
        feedback: >
          $e^{2t}(0.25 + 0.5e^{t} + 0.25e^{2t}) = 0.25e^{2t} + 0.5e^{3t} +
          0.25e^{4t}$. That is the MGF of the law putting $0.25, 0.5, 0.25$ on
          $2, 3, 4$, and by uniqueness it is the only law with this MGF. So
          $\Pr(X = 3) = 0.5$.
      - ask: >
          Now $W = -(\ln U)/4$. Then $M_W(t) = \mathbb{E}[U^{-t/4}] =
          4/(4 - t)$ for $t < 4$. An exponential with rate $\lambda$ has MGF
          $\lambda/(\lambda - t)$ for $t < \lambda$. What is $W$?
        choices:
          - text: >
              Exponential with rate $1/4$
            feedback: >
              That law has MGF $(1/4)/((1/4) - t)$, finite only for $t < 1/4$.
              Dividing $Y$ by $4$ shrinks it, which raises the rate to $4$ and
              lowers the mean to $1/4$.
          - text: >
              Exponential with rate $4$
            correct: true
            feedback: >
              $4/(4 - t)$ matches $\lambda/(\lambda - t)$ with $\lambda = 4$ on
              the whole interval $t < 4$. Uniqueness does the rest.
          - text: >
              Not exponential, since it is a rescaled exponential
            feedback: >
              A rescaled exponential is still exponential; its MGF says so.
              Matching the transform is the whole argument.
        feedback: >
          Compute the transform, match it to a known one on an interval around
          $0$, name the law. That recipe is complete.

      - part: What agreement must cover
        ask: >
          A standard normal $X$ and a uniform $V$ on $[-\sqrt{3}, \sqrt{3}]$
          both have mean $0$ and variance $1$. $M_X(1) = e^{0.5} \approx
          1.6487$. Compute $M_V(1) = (e^{\sqrt{3}} - e^{-\sqrt{3}})/(2\sqrt{3})$.
        expects: "1.5806"
        tolerance: 0.0005
        feedback: >
          $(5.65223 - 0.17692)/3.46410 \approx 1.5806$. Different from
          $1.6487$, so the laws differ, despite matching two moments.
      - ask: >
          What does that comparison show about proving two laws equal or
          different?
        choices:
          - text: >
              Matching mean and variance is enough to identify a law.
            feedback: >
              The normal and this uniform match both and are plainly different
              laws — one is bounded, the other is not. Two moments are a small
              part of a transform.
          - text: >
              One point of disagreement proves the laws differ; proving them
              equal takes agreement on a whole interval around $0$.
            correct: true
            feedback: >
              Right. Equal laws have equal MGFs everywhere, so a single
              mismatch refutes equality. The converse needs the theorem, and
              the theorem needs an interval.
          - text: >
              Agreement at $t = 0$ and $t = 1$ would have proved them equal.
            feedback: >
              Every MGF equals $1$ at $0$, and agreeing at a couple of points
              is far short of agreeing on an interval. The theorem asks for
              all $|t| < h$.
        feedback: >
          Disagreement anywhere: different laws. Agreement on $(-h, h)$, with
          both finite there: same law.
      - ask: >
          $X$ has density $x^{-2}/2$ for $|x| \ge 1$, and $Y$ has density
          $|x|^{-3}$ for $|x| \ge 1$. Both MGFs are infinite for every
          $t \ne 0$ and equal $1$ at $0$. Same law?
        choices:
          - text: >
              Yes: the MGFs agree at every $t$.
            feedback: >
              They "agree" only in the sense that both are $+\infty$, which
              carries no information. The theorem needs the common value to be
              finite on an interval around $0$, and here it is finite at one
              point.
          - text: >
              No: the densities differ, and the transform was never finite
              near $0$, so uniqueness never applied.
            correct: true
            feedback: >
              Right. With heavy tails on both sides, the MGF is $1$ at $0$ and
              infinite elsewhere for both laws, so it cannot tell them apart.
              That is a failed hypothesis, not a counterexample to the theorem.
          - text: >
              Cannot tell without computing more moments.
            feedback: >
              The densities are given, and they differ: $x^{-2}/2$ is not
              $|x|^{-3}$. What fails is the MGF's ability to see it.
        feedback: >
          In an interview, "its transform matches on an interval around $0$" is
          a complete identification — said together with the finiteness. Drop
          the finiteness and the method is silent.

  - node: quant-probability.mgf.additive-families
    hook: >
      This is where the toolkit cashes out: naming the sum of two named laws
      by eye, from the shape of a product, is one of the fastest moves
      available at a desk.
    explanation: >
      What makes a family "additive" isn't a coincidence to memorize case by
      case — it's a direct reading of the table's algebraic shape. Poisson's
      MGF $e^{\lambda(e^{t}-1)}$ multiplies to $e^{(\lambda_1+\lambda_2)
      (e^{t}-1)}$, still Poisson with rates added; normal's
      $\exp(\mu t+\sigma^{2}t^{2}/2)$ multiplies to a normal MGF with means
      and variances added; any family whose MGF is an exponential of
      something linear or quadratic in a shared parameter closes under
      addition this way.

      A matching transform is already a complete proof of identity, so
      recognizing the algebraic shape of a product is itself the whole
      argument — no separate reasoning about the shape of a sum's pmf or
      density is ever needed.

      The one thing that must be shared for the trick to fire is whichever
      parameter the family's shape treats as fixed: exponentials-to-gamma
      need the same rate $\lambda$ in every summand — different rates give a
      genuinely different, non-gamma law — and the same discipline applies to
      any other additive family.
    worked: >
      $X\sim\text{Binomial}(4,0.5)$ and $Y\sim\text{Binomial}(3,0.5)$
      independent, same success probability: $M_X(t)M_Y(t) =
      (0.5+0.5e^{t})^{4}(0.5+0.5e^{t})^{3} = (0.5+0.5e^{t})^{7}$, exactly the
      Binomial$(7,0.5)$ MGF, so $X+Y\sim\text{Binomial}(7,0.5)$. Reading off
      one probability, $\Pr(X+Y=0) = (0.5)^{7} = 1/128 \approx 0.0078$.
    interview: >
      "What's the distribution of the sum of two independent [named laws]"
      wants the two table MGFs multiplied and the resulting shape recognized
      by eye. A sharp follow-up changes one parameter to check you notice
      when the shared-parameter condition breaks.
    pitfalls: >
      Assuming any two members of the same family add cleanly regardless of
      parameters — binomials need the same $p$, exponentials-to-gamma need
      the same $\lambda$. Forgetting the shortcut still needs independence,
      exactly as the underlying product rule does.
    recap: >
      Multiplying two table MGFs and recognizing the product's shape
      identifies a sum's law instantly — Binomial$(4,0.5)$ plus
      Binomial$(3,0.5)$ is Binomial$(7,0.5)$ — provided the shared parameter
      genuinely matches.
    dialogue:
      - part: Two order flows, one total
        teach: >
          Desk A receives orders as a Poisson count with mean $1.5$ per
          minute; desk B, independently, a Poisson count with mean $2.5$.
          Risk wants the law of the combined count $T = X + Y$ in one minute,
          not just its mean.
      - ask: >
          Find $\Pr(T = 0)$, to four decimal places.
        expects: "0.0183"
        tolerance: 0.0005
        hint: >
          A total of zero needs both desks to be quiet.
        feedback: >
          $\Pr(X = 0)\Pr(Y = 0) = e^{-1.5}e^{-2.5} = e^{-4} \approx 0.0183$,
          by independence.
      - ask: >
          Find $\Pr(T = 1)$, to four decimal places.
        expects: "0.0733"
        tolerance: 0.0005
        hint: >
          The single order came from desk A or from desk B.
        feedback: >
          $\Pr(X = 1, Y = 0) + \Pr(X = 0, Y = 1) = 1.5e^{-1.5}e^{-2.5} +
          e^{-1.5}\,2.5e^{-2.5} = 4e^{-4} \approx 0.0733$.
      - ask: >
          Done the same way, $\Pr(T = 6)$ is a sum over the ways to split six
          orders between the desks. How many products of two Poisson
          probabilities does it add?
        expects: "7"
        feedback: >
          The splits are $(0,6), (1,5), \dots, (6,0)$: seven terms. $\Pr(T =
          50)$ would need $51$. The convolution works, but it rebuilds the
          law one value at a time.
      - ask: >
          $e^{-4}$ and $4e^{-4}$ are exactly what a Poisson with mean $4$
          gives at $0$ and $1$. Does that establish $T \sim$ Poisson$(4)$?
        choices:
          - text: >
              Yes: two values of the pmf match, and the mean is $4$ as well.
            feedback: >
              Put $e^{-4}$ on $0$, $4e^{-4}$ on $1$, and the remaining mass
              anywhere you like with mean adjusted to $4$: that law matches
              all three facts and is not Poisson. Finitely many values never
              pin down a law on infinitely many points.
          - text: >
              No: you would need every value of the pmf, or one object that
              encodes all of them at once.
            correct: true
            feedback: >
              Right. Checking value by value never ends; the question is
              what single computation carries the whole pmf.
          - text: >
              Yes: a sum of many small counts is approximately Poisson.
            feedback: >
              That is a limit heuristic, and "approximately" is not the
              question. Two summands is not many, and the claim here is
              exact.
        feedback: >
          The guess is good. What is missing is a proof that covers every
          $k$ at once.
      - reflect: >
          You know the MGF of each desk's count, and the two are independent.
          What could you compute once, without any convolution, that would
          settle the entire law of $T$ — and what would let you read the law
          off the answer?
        hint: >
          What does independence do to $\mathbb{E}[e^{t(X + Y)}]$?
        answer: >
          Multiply the MGFs: independence gives $M_T(t) = M_X(t)M_Y(t) =
          e^{1.5(e^{t} - 1)}e^{2.5(e^{t} - 1)} = e^{4(e^{t} - 1)}$, finite for
          every $t$. That is the Poisson$(4)$ MGF, and an MGF finite near $0$
          determines the law, so $T \sim$ Poisson$(4)$ — every value of the
          pmf at once, with no sum over splits.

      - part: Multiply, then read the shape
        teach: >
          This is the whole method. For independent summands the MGF of the
          sum is the product of the MGFs; if the product has the shape of a
          table entry on an interval around $0$, uniqueness names the law.
          Poisson exponents $\lambda(e^{t} - 1)$ simply add, so
          Poisson$(\lambda_1)$ plus Poisson$(\lambda_2)$ is
          Poisson$(\lambda_1 + \lambda_2)$. A family closes under addition
          when multiplying two of its MGFs lands back in the family — which
          happens when the parameters sit in an exponent and the rest of the
          formula is shared.
      - ask: >
          Now $\Pr(T = 6)$, to four decimal places.
        expects: "0.1042"
        tolerance: 0.0005
        hint: >
          Read it straight off the Poisson$(4)$ pmf.
        feedback: >
          $e^{-4}\,4^{6}/6! = 4096e^{-4}/720 \approx 5.6889 \times 0.018316
          \approx 0.1042$. One term, not seven.
      - ask: >
          Two independent books have daily P&L $U$ and $V$ with
          $M_U(t) = \exp(0.5t + t^{2})$ and $M_V(t) = \exp(-1.5t + 3.5t^{2})$.
          What is the standard deviation of $U + V$?
        expects: "3"
        hint: >
          Multiply, then match the exponent to $\mu t + \sigma^{2}t^{2}/2$.
        feedback: >
          The product is $\exp(-t + 4.5t^{2})$, so $\mu = -1$ and
          $\sigma^{2}/2 = 4.5$, giving $\sigma^{2} = 9$: $U + V \sim N(-1,
          9)$ with standard deviation $3$. Means add and variances add, and
          the product says the sum is normal, which linearity alone never
          could.
      - ask: >
          What is $\Pr(U + V > 2)$, to four decimal places?
        expects: "0.1587"
        tolerance: 0.0005
        hint: >
          Standardize with the mean and standard deviation you just found.
        feedback: >
          $(2 - (-1))/3 = 1$, so the answer is $\Pr(Z > 1) \approx 0.1587$.
          Without the transform you would know the mean and the variance of
          $U + V$ but not that the tail is normal.
      - ask: >
          A ticket passes through three independent stages, each taking an
          exponential time with rate $4$ per hour. The product of their MGFs
          is $(4/(4 - t))^{3}$ for $t < 4$. What is the total time?
        choices:
          - text: >
              Exponential with rate $12$.
            feedback: >
              That is the *first* of three exponential clocks to ring — the
              minimum, whose rates add. The total waits for all three, and
              its MGF is a cube, not $12/(12 - t)$.
          - text: >
              Exponential with rate $4/3$, which has mean $3/4$.
            feedback: >
              The mean is right and the law is not. Its MGF
              $(4/3)/((4/3) - t)$ is finite only for $t < 4/3$, while the
              product is finite up to $t = 4$; the two transforms differ.
          - text: >
              Gamma with shape $3$ and rate $4$.
            correct: true
            feedback: >
              Right. $(\lambda/(\lambda - t))^{n}$ is the gamma MGF of shape
              $n$; same-rate exponentials add their shapes, mean $3/4$ hour.
          - text: >
              Approximately normal, since it is a sum.
            feedback: >
              Three summands is far from many, and the exact answer is on the
              table. A normal MGF would be the exponential of a quadratic in
              $t$, and $(4/(4 - t))^{3}$ is not.
        feedback: >
          Poisson rates add, normal means and variances add, same-rate
          exponentials stack into a gamma. Each is one multiplication.

      - part: When the product is not on the table
        ask: >
          $X \sim$ Binomial$(6, 0.3)$ and $Y \sim$ Binomial$(4, 0.5)$ are
          independent. A colleague says $X + Y \sim$ Binomial$(10, 0.38)$,
          since that has the right mean, $3.8$. Compute
          $\operatorname{Var}(X + Y)$.
        expects: "2.26"
        hint: >
          A Binomial$(n, p)$ has variance $np(1 - p)$, and variances of
          independent summands add.
        feedback: >
          $6(0.3)(0.7) + 4(0.5)(0.5) = 1.26 + 1 = 2.26$. Binomial$(10,
          0.38)$ has variance $10(0.38)(0.62) = 2.356$. The colleague's law
          is wrong.
      - ask: >
          What exactly stops the product
          $(0.7 + 0.3e^{t})^{6}(0.5 + 0.5e^{t})^{4}$ from naming a binomial?
        choices:
          - text: >
              Binomial MGFs do not multiply; the product rule is for
              continuous laws.
            feedback: >
              The product rule holds for any independent pair, discrete or
              not. The product is the correct MGF of $X + Y$; it just is not
              on the table.
          - text: >
              The two bases differ, so the product is not $(q + pe^{t})^{n}$
              for any single $p$.
            correct: true
            feedback: >
              Right. The exponents $6$ and $4$ add only when the base is
              shared. With one base, Binomial$(6, p)$ plus Binomial$(4, p)$
              is Binomial$(10, p)$.
          - text: >
              It does name one, with $p$ the weighted average $0.38$; the
              variance gap is rounding.
            feedback: >
              $2.356$ against $2.26$ is no rounding error, and the zero
              probabilities disagree too: $0.7^{6}0.5^{4} \approx 0.0074$
              against $0.62^{10} \approx 0.0084$.
        feedback: >
          The shared part of the formula must really be shared: the same $p$
          for binomials, the same rate for exponentials and gammas. Poisson
          and normal have no such fixed part, which is why they always add.
      - ask: >
          $Z$ is standard normal, $X = Z$ and $Y = -Z$. Each has MGF
          $e^{t^{2}/2}$, and the product is $e^{t^{2}}$, the $N(0, 2)$ MGF.
          Is $X + Y \sim N(0, 2)$?
        choices:
          - text: >
              Yes: the product is the $N(0, 2)$ MGF, and uniqueness does the
              rest.
            feedback: >
              The product equals $M_{X+Y}$ only for independent summands, and
              these are as dependent as two variables can be. Uniqueness was
              applied to the wrong transform.
          - text: >
              Yes: a sum of normals is always normal.
            feedback: >
              Here $X + Y = 0$ on every outcome, a point mass with variance
              $0$. Sums of normals are normal under independence, not in
              general.
          - text: >
              No: $X + Y = 0$, whose MGF is $1$; the product rule needed
              independence, and there is none.
            correct: true
            feedback: >
              Right. $\mathbb{E}[e^{t(X+Y)}] = \mathbb{E}[e^{0}] = 1$, not
              $e^{t^{2}}$. The shortcut inherits every hypothesis of the
              product rule.
        feedback: >
          Said aloud in an interview: "independent, so the MGFs multiply;
          the product is the Poisson MGF with rate $\lambda_1 + \lambda_2$, so
          the sum is Poisson by uniqueness" — naming independence and the
          shared parameter before the answer.

  - node: quant-probability.mgf.mgf-nonexistence
    hook: >
      The MGF's existence isn't a technicality to wave past — it's precisely
      the boundary between distributions with at least exponentially light
      tails and every heavier-tailed law used to model real losses.
    explanation: >
      For $t>0$ with $M_X(t)<\infty$, apply Markov's inequality — for
      nonnegative $Y$ and $a>0$, $\Pr(Y\ge a)\le\mathbb{E}[Y]/a$ — to
      $Y=e^{tX}$ and $a=e^{tx}$: since $e^{tX}$ is increasing in $X$ for
      $t>0$, $\Pr(X>x)=\Pr(e^{tX}>e^{tx})\le \mathbb{E}[e^{tX}]/e^{tx} =
      M_X(t)e^{-tx}$. Optimizing this bound over every valid $t>0$ is the
      Chernoff technique, and it's only available when $M_X(t)$ is finite for
      some $t>0$ at all.

      Read backward, this is why heavy tails kill the MGF: an exponentially
      decaying tail bound is only possible when the tail itself decays at
      least that fast, so any law whose true tail is heavier than every
      exponential rate — lognormal, Pareto, Student's $t$ on the right,
      Cauchy on both sides — has $M_X(t)=\infty$ for every $t>0$ (or every
      $t\ne0$, if the tail is heavy on both sides).

      The implication runs the other way too: $|x|^{k}\le k!\,e^{h|x|}/h^{k}$
      bounds a polynomial by an exponential for large $|x|$, so finiteness of
      $M_X$ on $(-h,h)$ forces $\mathbb{E}|X|^{k}<\infty$ for every $k$ at
      once — stronger than checking moments one at a time.
    worked: >
      Take $\Pr(X=n) = C/n^{5}$ for $n=1,2,3,\dots$, with $C$ chosen so the
      probabilities sum to $1$ — light enough that $\mathbb{E}[X]$ and even
      $\mathbb{E}[X^{3}]$ are finite. Yet for any $t>0$, the $n$-th term of
      $M_X(t)=C\sum_n e^{tn}/n^{5}$ grows without bound, since $e^{tn}$ is
      exponential in $n$ while $n^{5}$ is only polynomial, so the series
      diverges to $+\infty$. Every polynomial tail, however light, kills the
      MGF for every positive $t$.
    interview: >
      "Does the lognormal have an MGF? Does it have all its moments?" checks
      whether you keep the two questions separate — every moment can be
      finite while the MGF is infinite for every positive $t$.
    pitfalls: >
      Assuming "all moments finite" implies the MGF exists — it doesn't, and
      the lognormal is the standing counterexample. Forgetting the Chernoff
      bound only uses whichever $t>0$ makes $M_X(t)$ finite; with no such
      $t$, there's nothing to optimize.
    recap: >
      An MGF finite near $0$ is equivalent to an exponentially light tail,
      delivering the Chernoff bound and forcing every moment finite —
      heavy-tailed laws simply fail this test.
    dialogue:
      - part: One number about a loss
        teach: >
          A risk model reports a single fact about tomorrow's loss $L$, in
          millions: $\mathbb{E}[e^{L/2}] = 3$. Nothing else — no mean, no
          variance, no sign constraint on $L$. The desk wants an upper bound
          on $\Pr(L \ge 10)$.
      - ask: >
          On the event $L \ge 10$, the quantity $e^{L/2}$ is at least what?
          Two decimal places.
        expects: "148.41"
        tolerance: 0.01
        hint: >
          $e^{L/2}$ is increasing in $L$.
        feedback: >
          $L \ge 10$ forces $e^{L/2} \ge e^{5} \approx 148.41$. On that event
          the variable whose mean you know is enormous.
      - reflect: >
          $e^{L/2}$ is positive everywhere, at least $148.41$ on the event
          $L \ge 10$, and averages $3$. Turn those three facts into a bound on
          $\Pr(L \ge 10)$, and say why each fact is needed.
        hint: >
          Throw away everything outside the event, and keep a lower bound on
          what is left.
        answer: >
          $3 = \mathbb{E}[e^{L/2}] \ge \mathbb{E}[e^{L/2}\,\mathbf{1}\{L \ge
          10\}] \ge e^{5}\Pr(L \ge 10)$, so $\Pr(L \ge 10) \le 3e^{-5}$.
          Positivity lets you drop the part off the event without increasing
          the mean; the lower bound on the event gives the $e^{5}$; the
          finite average makes the bound a number. It is Markov's inequality,
          applied to $e^{L/2}$ rather than to $L$, which need not be
          positive.
      - ask: >
          What is the bound $3e^{-5}$, to four decimal places?
        expects: "0.0202"
        tolerance: 0.0005
        feedback: >
          $3 \times 0.006738 \approx 0.0202$. A two percent ceiling from one
          number about the transform.
      - ask: >
          Which facts about the exponent $t = 1/2$ did the argument actually
          use?
        choices:
          - text: >
              That $t$ is small, so $e^{tL}$ is close to $1 + tL$.
            feedback: >
              No expansion was used anywhere. The same argument runs at
              $t = 5$ if $\mathbb{E}[e^{5L}]$ is finite.
          - text: >
              That $t > 0$, so $L \ge 10$ is the event $e^{tL} \ge e^{10t}$,
              and that $M_L(t)$ is finite.
            correct: true
            feedback: >
              Right. A negative $t$ reverses the inequality and bounds the
              left tail instead; an infinite $M_L(t)$ bounds nothing.
          - text: >
              That $L \ge 0$, as Markov's inequality requires.
            feedback: >
              $L$ can be negative here. The positivity Markov needs is that of
              $e^{tL}$, which holds whatever the sign of $L$ — that is
              exactly why you apply it to the exponential.
        feedback: >
          At any threshold $x$ the bound reads $3e^{-x/2}$: it decays
          exponentially in $x$.

      - part: Tails too heavy for any exponent
        teach: >
          In general: if $M_X(t) < \infty$ for some $t > 0$, then
          $\Pr(X \ge x) \le M_X(t)e^{-tx}$ for every $x$, an exponentially
          decaying right tail. Read backwards, this is the proposition: a law
          whose right tail decays slower than every exponential has
          $M_X(t) = \infty$ for every $t > 0$. Finiteness near $0$ is not a
          technicality; it is a statement about the tail. Choosing $t$ to
          make the bound as small as possible is the Chernoff argument, which
          the probability inequalities take up.
      - ask: >
          $X$ has density $3x^{-4}$ on $x \ge 1$, so $\Pr(X > x) = x^{-3}$.
          Its mean is $3/2$ and $\mathbb{E}[X^{2}] = 3$. Is $M_X(0.01)$
          finite?
        choices:
          - text: >
              Yes: at $t = 0.01$ the factor $e^{0.01x}$ is negligible.
            feedback: >
              Negligible for a while, not forever. The integrand
              $3x^{-4}e^{0.01x}$ eventually grows, and an integral of a
              growing positive function to $\infty$ diverges.
          - text: >
              Yes: the first two moments are finite, so the MGF is finite near
              $0$.
            feedback: >
              The MGF asks for $\mathbb{E}[e^{tX}]$, which outgrows every
              power of $X$. Two finite moments say nothing about it.
          - text: >
              No: $x^{-3}$ is slower than every exponential, so no $t > 0$
              works.
            correct: true
            feedback: >
              Right. If $M_X(0.01)$ were finite, the tail would sit below a
              constant times $e^{-0.01x}$, and $x^{-3}$ does not.
        feedback: >
          A polynomial tail always loses to $e^{tx}$ in the end, however
          small $t$ is.
      - ask: >
          Small $t$ only delays the divergence. At what $x$ does the
          integrand $3x^{-4}e^{0.01x}$ stop decreasing and start to grow?
        expects: "400"
        hint: >
          Differentiate its logarithm, $\ln 3 - 4\ln x + 0.01x$.
        feedback: >
          $-4/x + 0.01 = 0$ at $x = 400$. Beyond it the integrand grows
          without bound, so $M_X(0.01) = \infty$. A smaller $t$ moves the
          turning point to $4/t$, never to infinity.
      - ask: >
          For which $t$ is $M_X(t)$ finite, for this same $X$?
        choices:
          - text: >
              For no $t$ other than $0$.
            feedback: >
              For $t < 0$, $e^{tX} \le 1$ because $X \ge 1 > 0$, so the mean is
              at most $1$. The left side is fine.
          - text: >
              For $t \le 0$ only.
            correct: true
            feedback: >
              Right. The right tail is heavy and the left tail does not exist,
              so the MGF is finite on a half-line and on no interval
              $(-h, h)$ around $0$.
          - text: >
              For $|t| < h$ with some small $h$, as for every law.
            feedback: >
              That is the hypothesis, not a fact. On $t > 0$ it fails here at
              every $t$, which the turning point just showed.
        feedback: >
          A half-line is not a neighborhood of $0$. Every theorem of this
          unit that assumes finiteness on $(-h, h)$ is silent for this $X$.

      - part: What finiteness buys, and what it does not
        ask: >
          The moment theorem would have produced every moment. For this $X$,
          what is the smallest $k$ with $\mathbb{E}[X^{k}] = \infty$?
        expects: "3"
        hint: >
          $\mathbb{E}[X^{k}] = \int_1^\infty 3x^{k - 4}\,dx$.
        feedback: >
          The integral is finite for $k - 4 < -1$, so $\mathbb{E}[X] = 3/2$
          and $\mathbb{E}[X^{2}] = 3$, but at $k = 3$ it is $\int_1^\infty
          3x^{-1}\,dx = \infty$. The missing MGF cost real moments.
      - ask: >
          Now a different $X$ with $M_X(0.5) = 3$ and $M_X(-0.5) = 2$. Using
          $e^{|x|/2} \le e^{x/2} + e^{-x/2}$ and $|x|^{3} \le 3!\,e^{h|x|}/h^{3}$
          with $h = 1/2$, bound $\mathbb{E}|X|^{3}$.
        expects: "240"
        hint: >
          With $h = 1/2$, the constant $3!/h^{3}$ is $6 \times 8$.
        feedback: >
          $\mathbb{E}|X|^{3} \le 48\,\mathbb{E}[e^{|X|/2}] \le 48(3 + 2) =
          240$. The same bound works for every $k$, so finiteness on
          $(-1/2, 1/2)$ makes every moment finite at once.
      - ask: >
          The converse: $\Pr(X = n)$ is proportional to $e^{-\sqrt{n}}$ for
          $n = 0, 1, 2, \dots$, a tail that beats every power, so every
          moment is finite. Is $M_X(t)$ finite for some $t > 0$?
        choices:
          - text: >
              Yes: every moment is finite, and the MGF is built from the
              moments.
            feedback: >
              The series $\sum_k t^{k}\mathbb{E}[X^{k}]/k!$ can diverge even
              when each term is finite. Here it does, because the moments grow
              too fast.
          - text: >
              Yes, for $t$ small enough.
            feedback: >
              The terms are proportional to $e^{tn - \sqrt{n}}$, and $tn$ beats
              $\sqrt{n}$ for every $t > 0$: the terms grow, and the sum
              diverges.
          - text: >
              No: $e^{-\sqrt{n}}$ decays slower than every exponential.
            correct: true
            feedback: >
              Right. Finite moments, infinite MGF for every $t > 0$ — the
              implication runs only one way.
        feedback: >
          In an interview, keep the two questions apart: "all moments
          finite" is weaker than "MGF finite near $0$". Heavy-tailed laws
          such as the Pareto and the lognormal have no MGF on $t > 0$, and
          that is why every MGF argument states the hypothesis.

  - node: quant-probability.mgf.characteristic-function
    hook: >
      Knowing this exists, and exactly why it never fails where the MGF can,
      matters more at this level than computing with it — it's the tool that
      makes the general limit theorems possible for laws the MGF can't touch.
    explanation: >
      The property that makes $e^{itX}$ universally safe where $e^{tX}$ isn't
      is boundedness: $|e^{itX}| = |\cos(tX)+i\sin(tX)| = 1$ for every real
      $t$ and every outcome, since $\cos^{2}+\sin^{2}=1$ pins the magnitude to
      exactly $1$. Averaging a quantity that never exceeds $1$ in magnitude
      can never diverge, so $\varphi_X(t)=\mathbb{E}[e^{itX}]$ exists for
      every random variable and every real $t$ — no tail-weight assumption
      required.

      It isn't a different object from the MGF, just its restriction to the
      imaginary axis made safe: $\varphi_X(t) = \mathbb{E}[\cos(tX)] +
      i\,\mathbb{E}[\sin(tX)]$ is two real expectations of bounded functions
      packaged as one complex number, so ordinary LOTUS applies to each piece
      separately.

      The two theorems that made the MGF valuable transfer over with the side
      conditions stripped: independent summands still multiply, $\varphi_{X+Y}
      =\varphi_X\varphi_Y$, and equal characteristic functions still force
      equal distributions, with no finiteness hypothesis to verify. That
      unconditional uniqueness is why limit theorems are built on
      characteristic functions rather than MGFs.
    worked: >
      Bernoulli$(0.5)$ has $\varphi(t)=0.5+0.5e^{it}$. At $t=\pi/2$: $\varphi
      (\pi/2) = 0.5+0.5(\cos(\pi/2)+i\sin(\pi/2)) = 0.5+0.5i$, magnitude
      $\sqrt{0.5^{2}+0.5^{2}} = \sqrt{0.5}\approx0.707$ — comfortably below
      $1$, as any average of unit-magnitude complex numbers must be.
    interview: >
      "What do you do when the MGF doesn't exist" is answered by naming the
      characteristic function and stating why it always exists. Full
      computational fluency is rarely expected at this level, but knowing
      it's the standard repair is.
    pitfalls: >
      Assuming a distribution with no MGF, like Cauchy, has no transform at
      all — the characteristic function always exists. Trying to
      differentiate $\varphi_X$ at $0$ to extract moments of a variable whose
      moments don't exist, since differentiating can fail even though
      $\varphi_X$ itself is perfectly well-defined.
    recap: >
      The characteristic function $\mathbb{E}[e^{itX}]$ exists for every real
      random variable and every real $t$, because $|e^{itX}|=1$ keeps the
      integrand bounded, and it inherits the MGF's product and uniqueness
      rules with no hypotheses left to check.
    dialogue:
      - part: A transform that cannot blow up
        teach: >
          A spread $X$ has tails so heavy on both sides that $M_X(t) = \infty$
          for every $t \ne 0$; it has no mean. You still want a transform of
          it: some $\mathbb{E}[g_t(X)]$ that is finite for every real $t$, for
          this law and for any other.
      - ask: >
          Which of these is finite at $t = 1$ for every random variable $X$
          whatsoever?
        choices:
          - text: >
              $\mathbb{E}[e^{tX}]$
            feedback: >
              That is the MGF, and for this $X$ it is infinite at $t = 1$.
              $e^{x}$ is unbounded, so a heavy enough right tail drives the
              mean to infinity.
          - text: >
              $\mathbb{E}[\cos(tX)]$
            correct: true
            feedback: >
              Right. $|\cos(tx)| \le 1$ for every $x$, so the mean lies in
              $[-1, 1]$ whatever the tails do.
          - text: >
              $\mathbb{E}[X^{2}]$
            feedback: >
              Unbounded in $x$ too: this $X$ has no mean, so its second
              moment is certainly infinite.
          - text: >
              $\mathbb{E}[e^{-t|X|}]$
            feedback: >
              Bounded by $1$ for $t \ge 0$, but at $t = -1$ it is
              $\mathbb{E}[e^{|X|}]$, infinite here. A transform must work for
              every real $t$.
        feedback: >
          Bounded integrands are the only safe ones. The question is whether a
          bounded one can still do the MGF's job.
      - ask: >
          Test it on sums. $X$ and $Y$ are independent, each $0$ or $1$ with
          probability $1/2$. Compute $\mathbb{E}[\cos(\pi(X + Y)/2)]$.
        expects: "0"
        hint: >
          $X + Y$ is $0$, $1$ or $2$ with probabilities $1/4, 1/2, 1/4$.
        feedback: >
          $\frac{1}{4}\cos 0 + \frac{1}{2}\cos(\pi/2) + \frac{1}{4}\cos\pi =
          0.25 + 0 - 0.25 = 0$.
      - ask: >
          Now the product $\mathbb{E}[\cos(\pi X/2)]\,\mathbb{E}[\cos(\pi
          Y/2)]$.
        expects: "0.25"
        feedback: >
          Each factor is $\frac{1}{2}\cos 0 + \frac{1}{2}\cos(\pi/2) = 0.5$, so
          the product is $0.25$, not $0$. The cosine transform does not
          multiply over independent sums: $\cos(a + b) = \cos a\cos b - \sin
          a\sin b$, and the sine term is missing. Here
          $\mathbb{E}[\sin(\pi X/2)]^{2} = 0.25$ is exactly the gap.
      - reflect: >
          $e^{t(x + y)} = e^{tx}e^{ty}$ is why the MGF multiplies, and the
          cosine alone loses that because of the sine cross-term. How could
          you package $\cos$ and $\sin$ together so that the sum's transform
          is a plain product again, while staying bounded?
        hint: >
          Which single function of $\theta$ has $\cos\theta$ and
          $\sin\theta$ as its two parts?
        answer: >
          Use $e^{i\theta} = \cos\theta + i\sin\theta$. Then
          $e^{it(x + y)} = e^{itx}e^{ity}$ exactly — the addition formulas
          for $\cos$ and $\sin$ are this identity written out — and
          $|e^{itx}| = 1$, so it is bounded. Averaging it gives a transform
          that multiplies over independent sums and is finite for every law.

      - part: The characteristic function
        teach: >
          The characteristic function is $\varphi_X(t) = \mathbb{E}[e^{itX}] =
          \mathbb{E}[\cos tX] + i\,\mathbb{E}[\sin tX]$, two real expectations
          of bounded functions. Because $|e^{itX}| = 1$, it is finite for
          every real $t$ and every $X$. It keeps both rules that made the MGF
          useful, with no side conditions: $\varphi_{X+Y} =
          \varphi_X\varphi_Y$ for independent summands, and equal
          characteristic functions force equal laws. Scaling works as before:
          $\varphi_{aX}(t) = \varphi_X(at)$.
      - ask: >
          A signed trade $X$ is $+1$ with probability $0.7$ and $-1$ with
          probability $0.3$. What is $|\varphi_X(\pi/2)|$?
        expects: "0.4"
        hint: >
          $e^{i\pi/2} = i$ and $e^{-i\pi/2} = -i$.
        feedback: >
          $\varphi_X(\pi/2) = 0.7i + 0.3(-i) = 0.4i$, of magnitude $0.4$. In
          general $\varphi_X(t) = \cos t + 0.4i\sin t$.
      - ask: >
          And $\varphi_X(\pi)$ for the same trade?
        expects: "-1"
        hint: >
          $e^{i\pi} = e^{-i\pi} = -1$.
        feedback: >
          $0.7(-1) + 0.3(-1) = -1$. Both values $\pm 1$ land on the same point
          of the unit circle at $t = \pi$, so the average sits on the circle
          too.
      - ask: >
          Can $|\varphi_X(t)|$ exceed $1$ for some law and some $t$?
        choices:
          - text: >
              Yes, for laws with large values, as $|M_X(t)|$ can.
            feedback: >
              Large values of $X$ only move $e^{itX}$ around the unit circle;
              they never lengthen it. Size of $X$ is exactly what the
              characteristic function ignores.
          - text: >
              No: an average of points on the unit circle lies in the unit
              disc.
            correct: true
            feedback: >
              Right. $|\mathbb{E}[e^{itX}]| \le \mathbb{E}|e^{itX}| = 1$.
              Equality, as at $t = \pi$ for the trade, means the values all
              land on one point of the circle.
          - text: >
              Yes, for heavy-tailed laws such as the one you started with.
            feedback: >
              The tail never enters: the integrand has modulus $1$ on every
              outcome. That is the whole reason the transform exists.
        feedback: >
          The bound $|\varphi_X| \le 1$ is the existence proof in one line.
      - ask: >
          Two independent standard Cauchy variables have $\varphi(t) =
          e^{-|t|}$. Their average is $A = (X + Y)/2$. Compute $\varphi_A(1)$,
          to four decimal places.
        expects: "0.3679"
        tolerance: 0.0005
        hint: >
          $\varphi_A(t) = \varphi_X(t/2)\,\varphi_Y(t/2)$.
        feedback: >
          $e^{-1/2}e^{-1/2} = e^{-1} \approx 0.3679$. For every $t$,
          $\varphi_A(t) = e^{-|t|/2}e^{-|t|/2} = e^{-|t|}$.
      - ask: >
          What is the law of the average $A$?
        choices:
          - text: >
              Cauchy, but narrower by a factor $\sqrt{2}$, as averaging
              always gives.
            feedback: >
              The $\sqrt{2}$ comes from adding variances, and the Cauchy has
              none. Here $\varphi_A(t) = e^{-|t|}$, not $e^{-|t|/\sqrt{2}}$.
          - text: >
              Approximately normal, since it is an average.
            feedback: >
              Averaging pulls toward normal only when the variance is finite.
              The transform says exactly what $A$ is, and it is not normal:
              a normal would have $\varphi$ of the form $e^{-ct^{2}}$.
          - text: >
              Standard Cauchy again, exactly the law of one draw.
            correct: true
            feedback: >
              Right. $\varphi_A = \varphi_X$, and uniqueness needs no
              hypothesis here. Averaging Cauchy draws buys no precision at
              all.
        feedback: >
          No MGF could have shown this: the Cauchy has none. The
          characteristic function settles it in one line.

      - part: What it does not give you
        ask: >
          $\varphi(t) = e^{-|t|}$ has a corner at $t = 0$. With the MGF, the
          first derivative at $0$ gave the mean. What does the corner say?
        choices:
          - text: >
              The mean is $0$, since the law is symmetric and $\varphi$ is
              real.
            feedback: >
              Symmetry gives a median of $0$, not a mean. The Cauchy's mean
              does not exist, because $\mathbb{E}|X| = \infty$.
          - text: >
              $\varphi$ is not differentiable at $0$, which is consistent with
              the Cauchy having no mean.
            correct: true
            feedback: >
              Right. The characteristic function always exists; its
              derivatives at $0$ need moments to exist. No moment, no
              derivative.
          - text: >
              The right derivative is $-1$, so the mean is $i$ times that.
            feedback: >
              A one-sided slope is not a derivative, and the left slope is
              $+1$. Reading a moment off a corner gives a number that means
              nothing.
        feedback: >
          In an interview, "what do you use when the MGF doesn't exist?" is
          answered in one breath: the characteristic function
          $\mathbb{E}[e^{itX}]$, finite for every law because $|e^{itX}| =
          1$, multiplying over independent sums and identifying the law with
          no conditions.
