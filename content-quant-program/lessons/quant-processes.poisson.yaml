unit: quant-processes.poisson
opening: >
  Poisson processes are the default model for events that happen one at a time
  with no memory — trade prints, phone calls, defaults, radioactive decays.
  The unit opens with two equivalent definitions, the whole-window count
  axioms and the local infinitesimal-rate picture, then lands on the single
  fact that makes everything else algebra instead of calculus: the gaps
  between arrivals are iid exponential. From there it covers the two
  operations interviews lean on — superposition (merging streams) and
  thinning (splitting one stream by a coin flip) — and the fact that
  conditioning on the count strips the rate out entirely, leaving arrival
  times that are just uniform points. It closes with the inspection paradox,
  length-biased sampling, and the compound and non-homogeneous extensions
  used to model random sums and time-varying rates.
lessons:
  - node: quant-processes.poisson.pp
    hook: >
      Every "events happen independently at a constant rate" setup — trade
      prints, phone calls, decays — is silently invoking this exact set of
      axioms, and an interviewer expects the three properties named, not just
      the Poisson pmf recited back.
    explanation: >
      A single Poisson distribution only describes one window. A process
      ties every window together at once, and consistency across windows is
      exactly what the three axioms buy: independent increments say what
      happens in one time block carries no information about another
      disjoint block; stationary increments say the law of a window depends
      on its length, never on where it starts; and the count over a
      length-$t$ window being $\operatorname{Poisson}(\lambda t)$ is the same
      distribution already known, now attached to every window simultaneously.

      The mean and variance $\lambda t$ follow immediately from that last
      axiom — no new computation needed, just the Poisson fact restated at
      each $t$. The real content is the first two axioms: they force the
      counts over any two disjoint windows to be independent Poisson
      variables, so a long interval can be chopped into blocks and each
      block's count analyzed on its own.

      Carry the mental model of arrivals as a fine, independent mist falling
      through time at density $\lambda$ per unit time — nothing about
      elapsed time or window boundaries changes the local rate.
    worked: >
      At $\lambda = 6$ per hour, a $20$-minute window has mean $6 \cdot
      1/3 = 2$, so $\Pr(N = 2) = e^{-2} \cdot 2^{2}/2! = 2e^{-2} \approx
      0.2707$. Independence across disjoint windows means the next $20$
      minutes is an unrelated fresh $\operatorname{Poisson}(2)$, so
      $\Pr(\text{2 in the first window and 1 in the second}) = (2e^{-2})
      (2e^{-2}) = 4e^{-4} \approx 0.0733$.
    interview: >
      "Define a Poisson process" wants the three axioms named in order, not
      the pmf alone; volunteering that disjoint-window counts are
      independent before being asked is what separates a strong answer.
    pitfalls: >
      Treating stationarity as automatic once increments are independent is
      wrong — a process whose rate drifts over time can still have
      independent increments, and that is the non-homogeneous case, not this
      one. Writing $N(t) \sim \operatorname{Poisson}(\lambda)$ and dropping
      the window length $t$ is the other common slip.
    recap: >
      A Poisson process ties every window's count together through
      independent, stationary increments, each $\operatorname{Poisson}
      (\lambda t)$ — three axioms, not one formula.
    steps:
      - teach: >
          "Events happen independently at a constant rate" is exactly this
          set of axioms in disguise, and an interviewer wants the three
          properties named, not the Poisson pmf recited from memory.
      - teach: >
          A Poisson process of rate $\lambda$ demands three things: increments
          over disjoint intervals are independent, increments are stationary
          (a window's law depends on its length, never where it starts), and
          $N(t+s) - N(s) \sim \operatorname{Poisson}(\lambda t)$.
      - ask: >
          Which property says that a window's count has the same law no
          matter where along the timeline the window sits?
        choices:
          - text: >
              Independent increments
            feedback: >
              Independence says one window's count carries no information
              about a different, disjoint window — it says nothing about
              whether the law itself shifts with position.
          - text: >
              Stationary increments
            correct: true
            feedback: >
              Stationarity is exactly this: the law of $N(t+s) - N(s)$
              depends on the length $t$, never on the starting point $s$.
          - text: >
              $N(t+s) - N(s) \sim \operatorname{Poisson}(\lambda t)$
            feedback: >
              This names the distribution of a single window's count; it is
              stationarity that says every same-length window shares it.
        feedback: >
          Stationary increments is the "same law regardless of position"
          property; independent increments is the separate "no information
          across windows" property.
      - teach: >
          The mean and variance follow immediately: $\mathbb{E}[N(t)] =
          \operatorname{Var}(N(t)) = \lambda t$ — no new computation, just
          the Poisson fact restated at each $t$.
      - ask: >
          Quotes post to an exchange as a Poisson process at $\lambda = 12$
          per hour. What is $\Pr(N = 2)$ over a $10$-minute window?
        expects: "0.2707"
        tolerance: 0.0005
        hint: >
          Convert the window to hours to get the mean $\lambda t$, then
          apply the Poisson pmf.
        feedback: >
          The window is $1/6$ hour, so the mean is $12 \cdot 1/6 = 2$, and
          $\Pr(N=2) = e^{-2} \cdot 2^{2}/2! = 2e^{-2} \approx 0.2707$.
      - teach: >
          Independent increments is the real content: counts over any two
          disjoint windows are independent Poisson variables, so a long
          interval splits into blocks that can be analyzed one at a time.
      - ask: >
          Same $\lambda = 12$ per hour. What is the probability of exactly
          $2$ quotes in the first $10$ minutes and exactly $0$ quotes in the
          next $5$ minutes?
        expects: "0.0996"
        tolerance: 0.0005
        hint: >
          The two windows are disjoint, so multiply their separate Poisson
          probabilities.
        feedback: >
          The second window has mean $12 \cdot 1/12 = 1$, so
          $\Pr(N_1=2)\Pr(N_2=0) = (2e^{-2})(e^{-1}) = 2e^{-3} \approx
          0.0996$ — independence across disjoint windows is what lets the
          two multiply.
      - teach: >
          A process whose rate drifts over time can still have independent
          increments — that combination is the non-homogeneous case, not
          this one. Stationarity is the axiom doing the "constant rate" work.

  - node: quant-processes.poisson.infinitesimal-definition
    hook: >
      When a problem hands you a hazard or failure rate instead of a
      distribution, this is the definition that turns "chance $\lambda\,dt$
      per instant" directly into Poisson counts without re-deriving anything.
    explanation: >
      The whole-window axioms describe the process from the outside; this
      characterization builds it from the inside, instant by instant. In a
      tiny window of length $h$, an arrival happens with probability about
      $\lambda h$ and two arrivals essentially never happen together — that
      second condition, orderliness, is what rules out simultaneous arrivals
      and keeps the counting process integer-valued in a well-behaved way.

      The load-bearing move is chopping $[0,t]$ into $n$ equal slots of
      length $t/n$: each slot independently holds one arrival with
      probability about $\lambda t/n$ and (by orderliness) essentially never
      more than one, so $N(t)$ behaves like a sum of $n$ independent
      near-Bernoulli trials — a binomial that becomes exactly
      $\operatorname{Poisson}(\lambda t)$ as $n \to \infty$. That is the same
      count law the whole-window definition demands, so the two definitions
      agree.

      Reach for this form whenever a problem states a rate that changes
      instant to instant rather than handing you a clean distributional
      claim — it is the natural language for building the process up from
      local behavior.
    worked: >
      A process has $\Pr(N(h) = 1) = 20h + o(h)$ for $h$ in seconds, with
      orderliness holding — so it is Poisson at rate $\lambda = 20$ per
      second. Over a $100$-millisecond window the mean count is
      $20 \cdot 0.1 = 2$, so the chance of no arrivals in that window is
      $e^{-2} \approx 0.1353$.
    interview: >
      "What's the chance of an arrival in a small interval $dt$" is testing
      whether $\lambda\,dt$ comes out immediately, along with naming
      orderliness as the reason two arrivals can't coincide.
    pitfalls: >
      Forgetting the $o(h)$ qualifier and treating $\lambda h$ as an exact
      probability breaks down for larger $h$ — it is only a first-order
      approximation. Skipping the orderliness condition lets batch arrivals
      sneak in, which the ordinary Poisson process forbids by construction.
    recap: >
      A local rule — chance $\lambda\,dt$ of one arrival per instant, never
      two at once — is equivalent to the whole-window Poisson axioms, and is
      the form to use when a rate, not a distribution, is given.
    steps:
      - teach: >
          When a problem hands you a hazard or failure rate instead of a
          named distribution, this is the definition that turns "chance
          $\lambda\,dt$ per instant" directly into Poisson counts.
      - teach: >
          In a window of length $h$, one arrival happens with probability
          about $\lambda h$, and $\Pr(N(h) \ge 2) = o(h)$ — orderliness,
          which rules out two arrivals landing at the same instant.
      - ask: >
          Which condition specifically rules out two arrivals happening at
          the same instant?
        choices:
          - text: >
              $\Pr(N(h) = 1) = \lambda h + o(h)$
            feedback: >
              This bounds the chance of exactly one arrival in $h$; it says
              nothing on its own about two arrivals coinciding.
          - text: >
              $\Pr(N(h) \ge 2) = o(h)$
            correct: true
            feedback: >
              This is orderliness: the chance of two or more arrivals in a
              shrinking window vanishes faster than the window itself.
          - text: >
              Increments are independent and stationary
            feedback: >
              These describe how counts relate across different windows and
              over time, not whether arrivals can coincide within one.
        feedback: >
          Orderliness, $\Pr(N(h) \ge 2) = o(h)$, is what forbids
          simultaneous arrivals; the other condition only bounds single
          arrivals.
      - teach: >
          Chopping $[0,t]$ into $n$ equal slots of length $t/n$ makes $N(t)$
          a sum of $n$ near-independent Bernoulli trials, each holding one
          arrival with probability about $\lambda t/n$ — a binomial that
          becomes exactly $\operatorname{Poisson}(\lambda t)$ as $n \to
          \infty$.
      - ask: >
          A process satisfies $\Pr(N(h) = 1) = 12h + o(h)$ for $h$ in
          minutes, with orderliness holding. What is $\lambda$, in arrivals
          per minute?
        expects: "12"
        hint: >
          $\lambda$ is read directly off the coefficient of $h$ in the
          local rule.
        feedback: >
          By the definition itself, $\lambda$ is exactly that coefficient:
          $12$ arrivals per minute.
      - teach: >
          Reach for this local form whenever a problem states a rate rather
          than handing you a clean distributional claim — it is the natural
          language for building the process up from instant-by-instant
          behavior.
      - ask: >
          With that same $\lambda = 12$ per minute, what is $\Pr(N = 0)$
          over a $15$-second window?
        expects: "0.0498"
        tolerance: 0.0005
        hint: >
          Convert $15$ seconds to minutes to get the mean, then apply the
          Poisson pmf.
        feedback: >
          The window is $0.25$ minute, so the mean is $12 \cdot 0.25 = 3$,
          and $\Pr(N=0) = e^{-3} \approx 0.0498$.
      - teach: >
          Dropping the $o(h)$ qualifier and treating $\lambda h$ as exact
          fails for larger $h$; skipping orderliness lets batch arrivals
          sneak in, which the ordinary Poisson process forbids by
          construction.

  - node: quant-processes.poisson.interarrival
    hook: >
      Recognizing "time between events" language as an exponential gap,
      instantly and without re-deriving it, is the single most reused reflex
      in this unit.
    explanation: >
      The first gap is forced by the process definition itself: no arrival
      by time $t$ means $N(t) = 0$, so $\Pr(X_1 > t) = \Pr(N(t) = 0) =
      e^{-\lambda t}$ — exactly the exponential survival function, with no
      extra assumption needed.

      The load-bearing step is that this same argument reruns after every
      arrival. Independent, stationary increments mean the process observed
      after any arrival looks, in distribution, exactly like a fresh
      Poisson process started at that instant — so the wait for the next
      arrival, counted from there, again satisfies $\Pr(X_2 > t) =
      e^{-\lambda t}$, independent of $X_1$. Chaining this arrival by
      arrival is why every gap is iid $\operatorname{Exp}(\lambda)$.

      The converse — building a Poisson process by laying down iid
      exponential gaps — is the standard way to simulate one: draw
      exponentials, cumulative-sum them into arrival times, and the counting
      process they generate automatically satisfies all three axioms.
    worked: >
      Calls arrive at a help line at $\lambda = 10$ per minute, so the mean
      gap is $1/10$ minute $= 6$ seconds. The probability a gap exceeds $3$
      seconds ($0.05$ minute) is $e^{-10 \cdot 0.05} = e^{-0.5} \approx
      0.6065$.
    interview: >
      "What's the distribution of time between arrivals" wants
      $\operatorname{Exp}(\lambda)$ stated immediately, with the
      one-line justification that $\Pr(X_1 > t) = \Pr(N(t) = 0)$; a strong
      answer also volunteers that the converse construction is how these
      processes get simulated.
    pitfalls: >
      Treating only the first gap as exponential and reasoning separately
      about later gaps wastes time — independence and stationarity hand you
      every gap at once, with no new argument needed. Confusing "gaps are
      independent" with "arrival times are independent" is the other slip;
      the times $T_n$ are sums of the gaps and are strongly dependent.
    recap: >
      Every gap between Poisson arrivals is independent
      $\operatorname{Exp}(\lambda)$, because the process restarts identically
      after each arrival, and the converse builds a Poisson process from iid
      exponential gaps.
    steps:
      - teach: >
          Recognizing "time between events" language as an exponential gap,
          instantly and without re-deriving it, is the single most reused
          reflex in this unit.
      - teach: >
          The first gap is forced by the process itself: no arrival by time
          $t$ means $N(t) = 0$, so $\Pr(X_1 > t) = \Pr(N(t) = 0) =
          e^{-\lambda t}$ — the exponential survival function, no extra
          assumption needed.
      - ask: >
          Buses arrive at a stop as a Poisson process at $\lambda = 4$ per
          hour. What is the mean gap between buses, in minutes?
        expects: "15"
        hint: >
          The mean of an $\operatorname{Exp}(\lambda)$ gap is $1/\lambda$.
        feedback: >
          $1/\lambda = 1/4$ hour $= 15$ minutes.
      - teach: >
          The same argument reruns after every arrival: independent,
          stationary increments mean the process restarts identically at
          each arrival, so every gap is independent and
          $\operatorname{Exp}(\lambda)$, not just the first one.
      - ask: >
          Which statement is true of the gaps $X_1, X_2, \dots$ and the
          arrival times $T_1, T_2, \dots$ of a Poisson process?
        choices:
          - text: >
              The gaps are iid, but the arrival times are strongly dependent
            correct: true
            feedback: >
              Each gap is a fresh, independent $\operatorname{Exp}
              (\lambda)$ draw, but $T_n = X_1 + \cdots + X_n$ is a running
              sum, so knowing $T_{n-1}$ constrains $T_n$.
          - text: >
              Both the gaps and the arrival times are iid
            feedback: >
              $T_n$ is a sum of the gaps up to it, so a large $T_{n-1}$
              forces a large $T_n$ — the times cannot be independent.
          - text: >
              Only $X_1$ is exponential; later gaps depend on how long the
              process has already run
            feedback: >
              Independence and stationarity hand you every gap at once, with
              no new argument needed after the first.
        feedback: >
          The gaps are iid $\operatorname{Exp}(\lambda)$; the arrival times
          are sums of those gaps and are strongly dependent on each other.
      - teach: >
          The converse also holds: laying down iid $\operatorname{Exp}
          (\lambda)$ gaps and cumulative-summing them builds a process that
          satisfies all three Poisson axioms — the standard way to simulate
          one.
      - ask: >
          Same buses, $\lambda = 4$ per hour. What is the probability a gap
          exceeds $10$ minutes?
        expects: "0.5134"
        tolerance: 0.0005
        hint: >
          Convert $10$ minutes to hours and use $\Pr(X > t) = e^{-\lambda
          t}$.
        feedback: >
          $10$ minutes is $1/6$ hour, so $\Pr(X > 1/6) = e^{-4/6} =
          e^{-2/3} \approx 0.5134$.
      - teach: >
          Reasoning about later gaps as if they need a separate argument
          wastes time in an interview — the restart property hands you every
          gap simultaneously, identically distributed to the first.

  - node: quant-processes.poisson.arrival-times
    hook: >
      "How long until the $n$-th arrival" and "how many arrivals by time
      $t$" sound like different questions, but the count–time duality makes
      them the exact same event stated two ways.
    explanation: >
      Since $T_n$ sums $n$ iid $\operatorname{Exp}(\lambda)$ gaps, its mean
      and variance follow from additivity alone — $\mathbb{E}[T_n] = n/
      \lambda$ and $\operatorname{Var}(T_n) = n/\lambda^{2}$ — with no
      distributional argument required, since means and variances of
      independent sums always add regardless of shape.

      The load-bearing idea is the duality itself: "the $n$-th arrival has
      occurred by $t$" and "at least $n$ arrivals have occurred by $t$" are
      literally the same event, $\{T_n \le t\} = \{N(t) \ge n\}$, because
      both describe exactly the same set of outcomes. That lets you read the
      Erlang cdf straight off the already-known Poisson pmf by summing tail
      probabilities, instead of integrating the Erlang density directly.

      This duality is a two-way tool: whenever a problem is awkward in one
      description — a messy sum of exponentials, or a Poisson tail sum —
      switch to the other side and the computation often collapses.
    worked: >
      Buses arrive at $\lambda = 3$ per hour. The $5$th bus is expected at
      $\mathbb{E}[T_5] = 5/3$ hour $= 100$ minutes. Using the duality,
      $\Pr(T_2 \le 1\text{ hour}) = \Pr(N(1) \ge 2) = 1 - e^{-3} - 3e^{-3} =
      1 - 4e^{-3} \approx 0.8009$.
    interview: >
      "Expected time to the $n$-th event" is answered with $n/\lambda$
      instantly; when asked for a probability like $\Pr(T_n \le t)$, naming
      the duality and switching to the Poisson tail sum is the fast, correct
      path.
    pitfalls: >
      Integrating the Erlang density directly to answer a duality question
      is needless work once $\{T_n \le t\} = \{N(t) \ge n\}$ is recognized.
      Mixing up which inequality direction matches which event — $T_n \le t$
      is "at least $n$," not "exactly $n$" — is the other common slip.
    recap: >
      $T_n$ is $\operatorname{Gamma}(n, \lambda)$ with mean $n/\lambda$, and
      $\{T_n \le t\} = \{N(t) \ge n\}$ converts between waiting-time and
      counting-process questions for free.
    steps:
      - teach: >
          "How long until the $n$-th arrival" and "how many arrivals by
          time $t$" sound like different questions, but the count–time
          duality makes them the same event stated two ways.
      - teach: >
          $T_n$ sums $n$ iid $\operatorname{Exp}(\lambda)$ gaps, so
          $\mathbb{E}[T_n] = n/\lambda$ and $\operatorname{Var}(T_n) =
          n/\lambda^{2}$ follow from additivity alone — no distributional
          argument required.
      - ask: >
          Buses arrive at $\lambda = 6$ per hour. What is the expected time
          of the $3$rd bus, in minutes?
        expects: "30"
        hint: >
          Use $\mathbb{E}[T_n] = n/\lambda$ and convert hours to minutes.
        feedback: >
          $\mathbb{E}[T_3] = 3/6$ hour $= 0.5$ hour $= 30$ minutes.
      - teach: >
          The load-bearing idea is the duality itself: "the $n$-th arrival
          has occurred by $t$" and "at least $n$ arrivals have occurred by
          $t$" describe the exact same set of outcomes, $\{T_n \le t\} =
          \{N(t) \ge n\}$.
      - ask: >
          Which event is $\{T_n \le t\}$ equal to?
        choices:
          - text: >
              $\{N(t) \ge n\}$
            correct: true
            feedback: >
              "The $n$-th arrival has happened by $t$" is literally "at
              least $n$ arrivals have happened by $t$" — the same set of
              outcomes.
          - text: >
              $\{N(t) = n\}$
            feedback: >
              That would say exactly $n$ arrivals have occurred, but the
              $n$-th arrival having occurred allows for more arrivals after
              it, still within $[0,t]$.
          - text: >
              $\{N(t) < n\}$
            feedback: >
              This is the complementary event — fewer than $n$ arrivals by
              $t$ means the $n$-th arrival has *not* yet occurred.
        feedback: >
          $\{T_n \le t\} = \{N(t) \ge n\}$: the same event read as a
          waiting-time statement or a counting statement.
      - teach: >
          The duality is a two-way tool: a messy sum of exponentials or an
          awkward Poisson tail sum can each be traded for the other side,
          and the computation often collapses.
      - ask: >
          Same buses, $\lambda = 6$ per hour. Using the duality, what is
          $\Pr(T_2 \le 20\text{ minutes})$?
        expects: "0.5940"
        tolerance: 0.0005
        hint: >
          Convert $\{T_2 \le t\}$ to $\{N(t) \ge 2\}$ and read the
          answer off the Poisson pmf at $20$ minutes.
        feedback: >
          $20$ minutes is $1/3$ hour, mean $6 \cdot 1/3 = 2$, so
          $\Pr(N(1/3) \ge 2) = 1 - e^{-2} - 2e^{-2} = 1 - 3e^{-2} \approx
          0.5940$.
      - teach: >
          Integrating the Erlang density directly to answer a duality
          question is needless work once $\{T_n \le t\} = \{N(t) \ge
          n\}$ is recognized — the Poisson tail sum is already the answer.

  - node: quant-processes.poisson.fresh-start
    hook: >
      "It's been ten minutes since the last one — surely it's due" is the
      gambler's fallacy restated for a Poisson process, and this property is
      exactly why the reasoning is wrong.
    explanation: >
      The interarrival result already shows the process restarts
      identically right after an arrival; fresh start says the restart
      happens at any fixed time you pick, arrival or not, and moreover at
      any stopping time — a moment defined only by what has happened so far,
      like "the third arrival" or "the first time the count hits $k$."
      Conditional on everything known up to that moment, the future is
      again a full, independent copy of the same Poisson process.

      The restriction to stopping times is the load-bearing subtlety: "the
      instant just before the next arrival" is defined by looking into the
      future, so it is not a stopping time, and the restart property does
      not apply there — which is exactly the setup behind the inspection
      paradox.

      Read operationally, this says an exponential clock never accumulates
      a head start: however long since the last arrival, the wait for the
      next one is a completely fresh $\operatorname{Exp}(\lambda)$ draw.
    worked: >
      A sensor logs pings at $\lambda = 0.2$ per minute. You check the log
      and see it has been $10$ minutes of silence. The expected further wait
      is still $1/\lambda = 5$ minutes, not less. $\Pr(\text{wait} > 3
      \text{ min}) = e^{-0.2 \cdot 3} = e^{-0.6} \approx 0.5488$, exactly
      what a fresh $\operatorname{Exp}(0.2)$ gives.
    interview: >
      "A component has run for $x$ hours without failing — how much longer
      on average" wants $1/\lambda$ immediately, with the reasoning stated
      as "the process restarts at any fixed time," not just the number.
    pitfalls: >
      Applying the restart property to a time chosen using hindsight — such
      as "just before the next arrival" — is invalid; that instant is not a
      stopping time. Assuming the property needs the process to restart at
      an arrival specifically, rather than at any fixed or stopping time, is
      an unnecessarily narrow reading.
    recap: >
      Conditional on the past up to any fixed time or stopping time, a
      Poisson process starts over as an independent, identical copy of
      itself — an arrival is never overdue.
    steps:
      - teach: >
          "It's been ten minutes since the last one — surely it's due" is
          the gambler's fallacy restated for a Poisson process, and this
          property is exactly why the reasoning fails.
      - teach: >
          Conditional on everything known up to any fixed time, or any
          stopping time — a moment defined only by what has happened so
          far, like "the third arrival" — the future is again a full,
          independent copy of the same process.
      - ask: >
          A sensor pings at $\lambda = 0.5$ per minute. You check the log
          and see it has been $8$ minutes of silence. What is the expected
          further wait until the next ping, in minutes?
        expects: "2"
        hint: >
          The elapsed silence is irrelevant; the further wait is a fresh
          $\operatorname{Exp}(\lambda)$ draw.
        feedback: >
          The restart property says the further wait is $\operatorname{Exp}
          (0.5)$ regardless of the $8$ minutes already elapsed, with mean
          $1/0.5 = 2$ minutes.
      - teach: >
          The restriction to stopping times is the load-bearing subtlety:
          "the instant just before the next arrival" is defined by looking
          into the future, so the restart property does not apply there.
      - ask: >
          Which of these is *not* a valid stopping time at which to apply
          the restart property?
        choices:
          - text: >
              The $4$th arrival epoch
            feedback: >
              This is determined entirely by what has already happened —
              a valid stopping time.
          - text: >
              The first time the count reaches $10$
            feedback: >
              This too depends only on the history so far, once it occurs —
              a valid stopping time.
          - text: >
              The instant immediately before the next arrival
            correct: true
            feedback: >
              Identifying this instant requires knowing when the next
              arrival will happen — it depends on the future, so it is not a
              stopping time.
        feedback: >
          A stopping time is defined only by the past and present; "just
          before the next arrival" is defined by the future, so the restart
          property fails there.
      - teach: >
          Read operationally, an exponential clock never accumulates a head
          start: however long since the last arrival, the wait for the next
          one is a completely fresh draw.
      - ask: >
          Same sensor, $\lambda = 0.5$ per minute, $8$ minutes of silence
          already observed. What is $\Pr(\text{further wait} > 4
          \text{ min})$?
        expects: "0.1353"
        tolerance: 0.0005
        hint: >
          Apply the exponential survival function to the fresh draw; the
          elapsed $8$ minutes plays no role.
        feedback: >
          $\Pr(\text{wait} > 4) = e^{-0.5 \cdot 4} = e^{-2} \approx
          0.1353$, exactly what a fresh $\operatorname{Exp}(0.5)$ gives.
      - teach: >
          Assuming the restart needs an actual arrival to trigger it, rather
          than working at any fixed or stopping time, is an unnecessarily
          narrow reading of the property.

  - node: quant-processes.poisson.superposition
    hook: >
      "What's the chance the next event from any of these several streams
      happens within $x$ minutes" collapses to a single rate the instant you
      recognize superposition.
    explanation: >
      Merging independent Poisson streams stays Poisson because the counts
      combine cleanly: for two independent streams, $\Pr(N_1(t) + N_2(t) =
      k) = \sum_{j=0}^{k} \Pr(N_1(t)=j)\Pr(N_2(t)=k-j)$. Substituting the
      Poisson pmfs, factoring out $e^{-(\lambda_1+\lambda_2)t}/k!$, and
      applying the binomial theorem to $\sum_j \binom{k}{j}(\lambda_1 t)^j
      (\lambda_2 t)^{k-j}$ collapses the sum to $((\lambda_1+\lambda_2)t)^k$
      — exactly the $\operatorname{Poisson}(\lambda_1+\lambda_2)$ pmf.
      Independent increments and stationarity survive the merge because each
      component already has them and the components don't interact.

      More than two streams merge the same way pairwise, so $k$ independent
      streams superpose to rate $\lambda_1 + \cdots + \lambda_k$.

      Independence is a real hypothesis, not bookkeeping: double-listing a
      single stream's arrivals also produces mean rate $2\lambda$, but the
      "arrivals" now come in coincident pairs and the merged process is not
      Poisson at all.
    worked: >
      Three independent order-flow feeds arrive at $4$, $6$, and $10$ per
      minute, total rate $20$ per minute. The wait for the next order from
      any feed is $\operatorname{Exp}(20)$, mean $3$ seconds, and the chance
      none arrives in the next $2$ seconds ($1/30$ minute) is $e^{-20/30} =
      e^{-2/3} \approx 0.5134$.
    interview: >
      "Merge $k$ independent Poisson streams" wants the summed rate stated
      immediately, and a sharp candidate flags that independence — not just
      matching means — is what makes the merge Poisson at all.
    pitfalls: >
      Assuming any two arrival streams with the same total rate merge the
      same way ignores that dependence between them can wreck the Poisson
      property entirely. Forgetting that "rates add" requires the summed
      rate, not an average, understates how fast the merged stream actually
      fires.
    recap: >
      Independent Poisson streams merge into a Poisson stream at the summed
      rate, so the wait for "the next of any type" uses $\lambda_1 + \cdots
      + \lambda_k$ directly.
    steps:
      - teach: >
          "What's the chance the next event from any of these several
          streams happens within $x$ minutes" collapses to a single rate
          the moment you recognize superposition.
      - teach: >
          Merging independent Poisson streams stays Poisson at the summed
          rate $\lambda_1 + \cdots + \lambda_k$ — independence and
          stationarity survive the merge because each component already has
          them and the streams don't interact.
      - ask: >
          Two independent order-flow feeds arrive at $5$ and $7$ per minute.
          What is the mean wait, in seconds, for the next order from either
          feed?
        expects: "5"
        hint: >
          The merged stream runs at the summed rate; the mean wait is the
          reciprocal.
        feedback: >
          The merged rate is $5+7=12$ per minute, so the mean wait is
          $1/12$ minute $= 5$ seconds.
      - teach: >
          Independence is a real hypothesis, not bookkeeping: double-listing
          a single stream's arrivals also gives mean rate $2\lambda$, but
          the "arrivals" come in coincident pairs and the result is not a
          Poisson process at all.
      - ask: >
          Which of these merges into a valid Poisson process?
        choices:
          - text: >
              Two genuinely independent Poisson streams, rates
              $\lambda_1$ and $\lambda_2$
            correct: true
            feedback: >
              Independence is exactly what the superposition result
              requires, and it holds here.
          - text: >
              A single Poisson stream, with every arrival listed twice
            feedback: >
              This doubles the mean rate but produces coincident pairs, not
              a Poisson process — the independence hypothesis fails.
          - text: >
              Two Poisson streams that share a common underlying trigger, so
              a spike in one always coincides with a spike in the other
            feedback: >
              Shared triggers break independence between the streams, so the
              merged counts are not Poisson even though each stream alone
              is.
        feedback: >
          Superposition needs genuine independence between the component
          streams — matching means alone is not sufficient.
      - teach: >
          When a question asks for "the next event of any type," the summed
          rate answers it directly — there's no need to track which stream
          it came from until the type itself is asked about.
      - ask: >
          Same two feeds, rates $5$ and $7$ per minute. What is the
          probability that no order arrives from either feed in the next
          $5$ seconds?
        expects: "0.3679"
        tolerance: 0.0005
        hint: >
          Convert $5$ seconds to minutes and apply the Poisson pmf at the
          summed rate.
        feedback: >
          $5$ seconds is $1/12$ minute, so the mean is $12 \cdot 1/12 = 1$,
          and $\Pr(N=0) = e^{-1} \approx 0.3679$.
      - teach: >
          "Rates add" means the summed rate, not an average — using an
          average silently understates how fast the merged stream actually
          fires.

  - node: quant-processes.poisson.thinning
    hook: >
      Splitting one stream into independent sub-streams by an independent
      coin flip per arrival is the move behind "buy vs. sell prints" and
      "escalated vs. resolved tickets" questions alike.
    explanation: >
      Condition on $N(t) = n$: since each of the $n$ arrivals is labeled
      type $i$ independently with probability $p_i$, the type-$i$ count
      given $N(t)=n$ is $\operatorname{Binomial}(n, p_i)$. Unconditioning
      over $N(t) \sim \operatorname{Poisson}(\lambda t)$ and simplifying —
      the $e^{-\lambda t(1-p_i)}$ factor from the binomial's complement
      recombines with the sum over the remaining arrivals into
      $e^{\lambda t(1-p_i)}$ — leaves exactly $\Pr(N_i(t)=k) =
      e^{-\lambda p_i t}(\lambda p_i t)^k / k!$: a clean
      $\operatorname{Poisson}(\lambda p_i)$ process.

      The surprising part is independence across types. For two types, the
      joint pmf $\Pr(N_1(t)=j, N_2(t)=k) = \Pr(N(t)=j+k)\binom{j+k}{j}p^j
      (1-p)^k$ factors, term for term, into the product of the two marginal
      Poisson pmfs — so learning the type-$1$ count tells you nothing about
      the type-$2$ count, even though the two together determine the total.

      This independence is fragile: it depends on the total being Poisson,
      and on the labels being independent of everything else, including the
      arrival times.
    worked: >
      Calls arrive at $50$ per hour, and $30\%$ independently escalate to
      tier $2$, giving a tier-$2$ rate of $15$ per hour. Over a $12$-minute
      window ($0.2$ hour), the mean tier-$2$ count is $3$, so $\Pr(N=2) =
      e^{-3} \cdot 9/2 \approx 0.2240$.
    interview: >
      "Split a Poisson stream by an independent coin flip" wants both
      pieces named — each part is Poisson at the scaled rate, and the parts
      are mutually independent — since the independence claim is what
      interviewers probe hardest.
    pitfalls: >
      Letting the label depend on arrival time or on other arrivals breaks
      the whole result; the labels must be iid and independent of the
      process. Treating the type-$i$ rate as $\lambda$ instead of $\lambda
      p_i$ when computing a window probability silently overcounts.
    recap: >
      Coin-flip labelling splits a Poisson process into mutually independent
      Poisson processes at rates $\lambda p_i$, an independence that is
      special to a Poisson total.
    steps:
      - teach: >
          Splitting one stream into independent sub-streams by an
          independent coin flip per arrival is the move behind "buy vs.
          sell prints" and "escalated vs. resolved tickets" questions alike.
      - teach: >
          Label each arrival independently as type $i$ with probability
          $p_i$. Conditioning on $N(t)=n$ gives a $\operatorname{Binomial}
          (n,p_i)$ type-$i$ count, and unconditioning over the Poisson
          $N(t)$ collapses this to a clean $\operatorname{Poisson}(\lambda
          p_i)$ process.
      - ask: >
          Calls arrive at $80$ per hour, and $25\%$ independently escalate
          to tier $2$. What is the tier-$2$ arrival rate, in calls per hour?
        expects: "20"
        hint: >
          Scale the total rate by the labeling probability.
        feedback: >
          $\lambda p = 80 \cdot 0.25 = 20$ per hour.
      - teach: >
          The surprising part is independence across types: learning the
          type-$1$ count in a window tells you nothing about the type-$2$
          count there, even though the two together determine the total.
      - ask: >
          You learn that $50$ calls escalated to tier $2$ in an hour. What
          does that tell you about the number of calls that did *not*
          escalate that hour?
        choices:
          - text: >
              Nothing — the two counts are independent
            correct: true
            feedback: >
              Thinning makes the type counts mutually independent, so the
              tier-$2$ count carries zero information about the other type,
              even though both come from the same original stream.
          - text: >
              It must be lower than usual, since a large share escalated
            feedback: >
              There is no such trade-off: the two counts are independent
              Poisson variables, not constrained against each other except
              through the (random) total.
          - text: >
              It is exactly determined, since the total call volume is fixed
            feedback: >
              The total call volume is itself random, not fixed — thinning
              doesn't assume or produce a known total.
        feedback: >
          Thinning's independence across types is the whole point: one
          type's count says nothing about the other's.
      - teach: >
          This independence is fragile — it depends on the total stream
          being Poisson and on the labels being independent of the arrival
          times and of each other.
      - ask: >
          Same calls, tier-$2$ rate $20$ per hour. What is the probability
          of exactly $3$ tier-$2$ escalations in a $15$-minute window?
        expects: "0.1404"
        tolerance: 0.0005
        hint: >
          Convert the window to hours to get the mean, then apply the
          Poisson pmf.
        feedback: >
          The window is $0.25$ hour, mean $20 \cdot 0.25 = 5$, so
          $\Pr(N=3) = e^{-5} \cdot 5^{3}/3! \approx 0.1404$.
      - teach: >
          Using the original rate $\lambda$ instead of the scaled $\lambda
          p_i$ when computing a window probability silently overcounts —
          the type-$i$ process runs at $\lambda p_i$, not $\lambda$.

  - node: quant-processes.poisson.thinning-example
    hook: >
      This is the template for any "arrivals of one type, split by an
      independent attribute" interview question — recognize the split,
      apply the scaled rate, and every downstream count or wait falls out.
    explanation: >
      The pattern to internalize: once an attribute of each arrival
      (buy/sell, escalated/resolved, in-the-money/out) is independent of
      arrival timing and of other arrivals, thinning applies immediately —
      no need to track the original stream at all once you're asking about
      one side.

      That means questions about counts, waits, and probabilities within a
      single side reduce to ordinary single-rate Poisson computations at the
      scaled rate, exactly as if that side had always been its own
      independent process. Cross-side questions — "how many of each" — stay
      independent too, so a large count on one side carries zero information
      about the other.

      The one thing to check before applying any of this is the independence
      assumption itself: if the attribute correlates with time of day or
      with nearby arrivals, as it typically does in real order flow, the
      thinned pieces are no longer Poisson and the shortcut breaks.
    worked: >
      A market maker's fills arrive at $450$ per hour, each independently at
      the bid with probability $0.6$. Bid fills form a
      $\operatorname{Poisson}(270)$-per-hour process, rate $4.5$ per minute.
      The chance of exactly $5$ bid fills in a given minute is $e^{-4.5}
      \cdot 4.5^{5}/5! \approx 0.1709$, and the expected wait for the next
      bid fill is $1/4.5$ minute $\approx 13.3$ seconds.
    interview: >
      "A stream splits by an independent attribute — find the rate of one
      side and the chance of $k$ in a window" is answered by scaling the
      rate first and then treating that side as an ordinary Poisson process,
      with no reference back to the original stream.
    pitfalls: >
      Forgetting to rescale the window when converting an hourly rate to a
      per-minute one is the most common arithmetic slip here. Assuming real
      order flow satisfies the independence hypothesis is a modeling error
      worth flagging explicitly in an interview answer.
    recap: >
      Once a per-arrival attribute is independent of timing, thinning turns
      "one side of a split stream" into an ordinary Poisson process at the
      scaled rate, with no need to track the other side.
    steps:
      - teach: >
          This is the template for any "arrivals of one type, split by an
          independent attribute" interview question — recognize the split,
          apply the scaled rate, and everything downstream is ordinary
          single-rate Poisson.
      - teach: >
          Once an attribute of each arrival is independent of timing and of
          other arrivals, questions about one side reduce to ordinary
          Poisson computations at the scaled rate — no need to track the
          original stream at all.
      - ask: >
          Trades arrive at $240$ per hour, and each is independently a block
          trade with probability $0.25$. What is the block-trade rate, in
          trades per hour?
        expects: "60"
        hint: >
          Scale the total rate by the probability, same move as ordinary
          thinning.
        feedback: >
          $240 \cdot 0.25 = 60$ block trades per hour.
      - teach: >
          Cross-side questions stay independent too: a large count of block
          trades in a window carries zero information about the count of
          non-block trades there.
      - ask: >
          Before applying this shortcut to real order flow, what must you
          verify?
        choices:
          - text: >
              That the attribute (e.g. block vs. non-block) is independent
              of arrival timing and of other arrivals
            correct: true
            feedback: >
              This is exactly the hypothesis thinning needs — without it,
              the split pieces are no longer Poisson.
          - text: >
              That the two rates are numerically equal
            feedback: >
              Thinning works for any split probability $p$; the two sides
              need not fire at the same rate.
          - text: >
              That the process has been running for a long time already
            feedback: >
              Poisson processes have no memory and no warm-up period — how
              long the process has run is irrelevant here.
        feedback: >
          The independence of the attribute from timing and from other
          arrivals is the one assumption to check before trusting the
          shortcut.
      - teach: >
          Real order flow is typically correlated with time of day and with
          nearby prints, which breaks that independence — treat the model
          as a baseline, not a description.
      - ask: >
          Same block-trade rate, $60$ per hour. What is the probability of
          exactly $2$ block trades in a $4$-minute window?
        expects: "0.1465"
        tolerance: 0.0005
        hint: >
          Convert $60$ per hour to a per-minute rate before finding the
          mean for a $4$-minute window.
        feedback: >
          $60$ per hour is $1$ per minute, so the mean over $4$ minutes is
          $4$, and $\Pr(N=2) = e^{-4} \cdot 4^{2}/2! \approx 0.1465$.
      - teach: >
          Forgetting to rescale the window when converting an hourly rate to
          a per-minute one is the most common arithmetic slip in this kind
          of problem.

  - node: quant-processes.poisson.rate-race
    hook: >
      "Two independent clocks are running — which fires first, and how many
      of one type happen before the other's first hit" is answered without a
      single integral once you see it as superposition plus thinning.
    explanation: >
      Superposition says the merged stream of both clocks is
      $\operatorname{Poisson}(\lambda_1+\lambda_2)$, so the time to the very
      next event of either type is $\operatorname{Exp}(\lambda_1+\lambda_2)$
      with no further work. Thinning then says each event of that merged
      stream is independently type $1$ with probability $\lambda_1/
      (\lambda_1+\lambda_2)$ — the winner's identity is a fair coin flip on
      each event, independent of when the event happens.

      Repeating that same coin flip event after event is what turns "number
      of type-$1$ events before the first type-$2$ event" into a geometric
      count on $\{0,1,2,\dots\}$: each trial is "type $1$" (failure, keep
      going) with probability $\lambda_1/(\lambda_1+\lambda_2)$ or "type $2$"
      (success, stop) with probability $\lambda_2/(\lambda_1+\lambda_2)$,
      giving mean $\lambda_1/\lambda_2$.

      The reasoning chains two earlier results rather than introducing new
      machinery — that's the intended shortcut here.
    worked: >
      With $\lambda_1 = 5$ and $\lambda_2 = 7$ per hour, the next event is
      type $1$ with probability $5/12 \approx 0.4167$, and the mean number
      of type-$1$ events before the first type-$2$ event is $5/7 \approx
      0.7143$. The chance at least $2$ type-$1$ events precede the first
      type-$2$ event is $(1-7/12)^2 = (5/12)^2 = 25/144 \approx 0.1736$.
    interview: >
      "Two independent Poisson clocks race — who wins and how long" wants
      $\lambda_i/(\lambda_1+\lambda_2)$ and $\operatorname{Exp}(\lambda_1+
      \lambda_2)$ stated together; naming superposition and thinning
      explicitly signals you see the structure, not just the formula.
    pitfalls: >
      Believing the winner's identity becomes less certain the longer the
      race runs is wrong — independence of the winning type from the
      winning time holds at every instant. Swapping which rate goes in the
      numerator of the geometric mean, $\lambda_1/\lambda_2$ versus $\lambda_2
      /\lambda_1$, flips which type is "counted."
    recap: >
      A race between independent Poisson clocks is superposition (the next
      event is $\operatorname{Exp}(\lambda_1+\lambda_2)$) plus thinning (the
      winner is type $i$ with probability $\lambda_i/\sum\lambda_j$) chained
      together.
    steps:
      - teach: >
          "Two independent clocks are running — which fires first, and how
          many of one type happen before the other's first hit" is answered
          without a single integral once you see it as superposition plus
          thinning.
      - teach: >
          Superposition gives the time to the next event of either type,
          $\operatorname{Exp}(\lambda_1+\lambda_2)$; thinning gives its
          type, independently type $1$ with probability $\lambda_1/
          (\lambda_1+\lambda_2)$.
      - ask: >
          Independent clocks fire at $\lambda_1 = 3$ and $\lambda_2 = 9$
          per hour. What is the probability the next event is type $1$?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          Use $\lambda_1/(\lambda_1+\lambda_2)$.
        feedback: >
          $3/(3+9) = 3/12 = 1/4$.
      - teach: >
          Repeating that same coin flip event after event turns "number of
          type-$1$ events before the first type-$2$ event" into a geometric
          count, each trial landing type $1$ with probability $\lambda_1/
          (\lambda_1+\lambda_2)$.
      - ask: >
          Which expression gives the mean number of type-$1$ events
          preceding the first type-$2$ event?
        choices:
          - text: >
              $\lambda_1/\lambda_2$
            correct: true
            feedback: >
              The geometric count on $\{0,1,2,\dots\}$ built from
              "type-$1$ = keep going, type-$2$ = stop" has this mean.
          - text: >
              $\lambda_2/\lambda_1$
            feedback: >
              This has the rates swapped — it would say a *faster* type-$1$
              clock produces *fewer* type-$1$ events before type $2$, which
              is backwards.
          - text: >
              $\lambda_1/(\lambda_1+\lambda_2)$
            feedback: >
              This is the per-event probability the next arrival is type
              $1$, not the mean count of type-$1$ events before type $2$.
        feedback: >
          The mean count is $\lambda_1/\lambda_2$ — larger $\lambda_1$
          relative to $\lambda_2$ means more type-$1$ events typically
          precede the first type-$2$ event.
      - teach: >
          This reasoning chains two earlier results — superposition for the
          timing, thinning for the type — rather than introducing new
          machinery.
      - ask: >
          Same rates, $\lambda_1 = 3$, $\lambda_2 = 9$ per hour. What is
          the probability that at least $2$ type-$1$ events precede the
          first type-$2$ event?
        expects: "1/16"
        tolerance: 0.0005
        hint: >
          "At least $2$ type-$1$ first" means the first two events of the
          merged race are both type $1$.
        feedback: >
          Each event is independently type $1$ with probability $1/4$, so
          the first two both being type $1$ has probability $(1/4)^2 =
          1/16$.
      - teach: >
          The winner's identity is fixed at $\lambda_i/\sum\lambda_j$
          from the very first instant and does not drift as the race runs
          longer — "it's been a while, surely type $2$ is due" is exactly
          the fallacy fresh start already ruled out.

  - node: quant-processes.poisson.conditional-uniformity
    hook: >
      "Given that $n$ events happened in this window, where are they" is
      answered by forgetting the rate entirely and treating the arrivals as
      $n$ points dropped uniformly at random.
    explanation: >
      Chop $[0,t]$ into $m$ tiny equal slots. Each slot independently holds
      an arrival with probability roughly $\lambda t/m$ — the same
      probability for every slot, by stationarity — so conditional on
      exactly $n$ of the $m$ slots being occupied, every one of the
      $\binom{m}{n}$ ways to choose which $n$ slots is equally likely; that
      is uniform placement. Letting $m \to \infty$ turns the discrete slots
      into $n$ iid $\operatorname{Uniform}(0,t)$ points, and the rate
      $\lambda$ has canceled out of the argument entirely — it governed how
      many slots got picked, not which ones.

      The mean $\mathbb{E}[T_k \mid N(t)=n] = kt/(n+1)$ follows from a
      symmetry argument: $n$ uniform points split $[0,t]$ into $n+1$ gaps
      that are exchangeable and sum to $t$, so by symmetry each gap has
      mean $t/(n+1)$, and $T_k$ is exactly the sum of the first $k$ gaps.

      The binomial consequence is immediate once arrivals are uniform
      points: each of the $n$ points independently lands in a subinterval
      of length $s$ with probability $s/t$, so the count there given $N(t)=n$
      is $\operatorname{Binomial}(n, s/t)$.
    worked: >
      Emails arrive at $\lambda = 5$ per hour, and exactly $4$ arrive in a
      given hour. $\mathbb{E}[T_2 \mid N=4] = 2 \cdot 60/5 = 24$ minutes.
      Using the binomial consequence, $\Pr(N(20\text{ min})=1 \mid N(60
      \text{ min})=4) = \binom{4}{1}(1/3)(2/3)^3 = 32/81 \approx 0.3951$.
    interview: >
      "Given $n$ arrivals in $[0,t]$, describe their positions" wants
      "$n$ iid uniforms on $[0,t]$" stated immediately, with the observation
      that $\lambda$ has dropped out — a detail interviewers specifically
      check for.
    pitfalls: >
      Re-deriving with $\lambda$ still present, rather than recognizing it
      cancels, wastes time and usually introduces an error. Treating $T_1,
      \dots,T_n$ as independent, rather than as dependent order statistics
      with $T_1 < \cdots < T_n$, corrupts any joint computation.
    recap: >
      Given $N(t)=n$, the arrival times have exactly the law of $n$ iid
      uniform points on $[0,t]$ — the rate drops out, leaving pure geometry.
    steps:
      - teach: >
          "Given that $n$ events happened in this window, where are they"
          is answered by forgetting the rate entirely and treating the
          arrivals as $n$ points dropped uniformly at random.
      - teach: >
          Chopping $[0,t]$ into tiny equal slots, each holds an arrival with
          the same probability, so conditional on exactly $n$ slots being
          occupied, every choice of which $n$ is equally likely — uniform
          placement, with $\lambda$ canceling out entirely.
      - ask: >
          Emails arrive at $\lambda = 8$ per hour, and exactly $5$ arrive
          in a given hour. Does $\lambda$ affect where those $5$ arrival
          times fall within the hour?
        choices:
          - text: >
              No — conditional on the count, the positions are $5$ iid
              uniform points regardless of $\lambda$
            correct: true
            feedback: >
              $\lambda$ governs how many arrivals occur, not where they
              land once the count is fixed — it cancels out of the
              conditional law entirely.
          - text: >
              Yes — a higher $\lambda$ pushes the arrival times earlier
            feedback: >
              The conditional law of the positions is exactly $n$ uniform
              points on $[0,t]$ for any $\lambda > 0$; $\lambda$ drops out
              of the derivation.
          - text: >
              Only when $n$ is large
            feedback: >
              The cancellation of $\lambda$ holds for every $n$, not just
              large ones — it's exact, not an approximation.
        feedback: >
          $\lambda$ never appears in the conditional law of the positions —
          it decided how many points there are, not where they sit.
      - teach: >
          The mean $\mathbb{E}[T_k \mid N(t)=n] = kt/(n+1)$ follows from
          symmetry: $n$ uniform points split $[0,t]$ into $n+1$ exchangeable
          gaps summing to $t$, so each gap has mean $t/(n+1)$.
      - ask: >
          Same emails, $N(t)=5$ arrivals in a $60$-minute hour. What is
          $\mathbb{E}[T_3 \mid N=5]$, in minutes?
        expects: "30"
        hint: >
          Use $\mathbb{E}[T_k \mid N=n] = kt/(n+1)$.
        feedback: >
          $\mathbb{E}[T_3 \mid N=5] = 3 \cdot 60/6 = 30$ minutes.
      - teach: >
          The binomial consequence follows immediately: each of the $n$
          uniform points independently lands in a subinterval of length $s$
          with probability $s/t$, giving $\operatorname{Binomial}(n, s/t)$.
      - ask: >
          Same $N(60\text{ min})=5$. What is $\Pr(N(15\text{ min})=2 \mid
          N(60\text{ min})=5)$?
        expects: "135/512"
        tolerance: 0.0005
        hint: >
          Use $\operatorname{Binomial}(5, 15/60)$.
        feedback: >
          $s/t = 15/60 = 1/4$, so $\binom{5}{2}(1/4)^2(3/4)^3 = 10 \cdot
          1/16 \cdot 27/64 = 135/512 \approx 0.2637$.
      - teach: >
          Treating $T_1,\dots,T_n$ as independent, rather than as dependent
          order statistics with $T_1 < \cdots < T_n$, corrupts any joint
          computation built on them.

  - node: quant-processes.poisson.uniformity-waiting
    hook: >
      Turning "given the count, arrivals are uniform" into an actual
      person-minutes or inventory number is a two-line calculation once you
      see it as a sum over order-statistic means.
    explanation: >
      Conditional on $N(t)=n$, each $\mathbb{E}[T_k \mid N(t)=n] = kt/(n+1)$
      is already known, so summing over $k=1,\dots,n$ gives the total
      conditional wait $\sum_k \mathbb{E}[T_k] = t/(n+1) \cdot n(n+1)/2 =
      nt/2$ — an arithmetic series, no new integration.

      A second, unconditional quantity is worth carrying separately: the
      aggregate time-in-system of everyone who arrives during $[0,t]$,
      measured up to $t$, is $\sum_i (t-T_i)$. Rather than condition on
      $N(t)$ and sum, treat each instant $ds$ as contributing $\lambda\,ds$
      expected arrivals in expectation, each worth $(t-s)$ of remaining
      time, and integrate directly: $\int_0^t \lambda(t-s)\,ds = \lambda
      t^2/2$ — the same trick used to add up contributions from a stream
      without ever conditioning on how many arrived.

      Both numbers use the same conditional-uniformity fact, just aggregated
      two different ways — one before unconditioning, one built to skip
      conditioning altogether.
    worked: >
      Packages arrive at $\lambda = 6$ per hour, and exactly $5$ arrive in a
      given hour. Given that, $\mathbb{E}[T_k \mid N=5] = 10k$ minutes for
      $k=1,\dots,5$, so the conditional total wait is $10(1+2+3+4+5) = 150$
      minutes. Unconditionally, the expected aggregate time-in-system over
      that hour is $\lambda t^2/2 = 6(1)^2/2 = 3$ hours $= 180$ minutes.
    interview: >
      "Total waiting time of everyone who shows up in $[0,t]$" is answered
      with $\lambda t^2/2$ directly, via the instant-by-instant integration
      argument rather than conditioning on $N(t)$ first.
    pitfalls: >
      Conflating the conditional total $nt/2$ (a fixed $n$) with the
      unconditional $\lambda t^2/2$ (which already averages over a random
      $N(t)$) answers the wrong question. Assuming $T_1,\dots,T_n$ can be
      summed as if independent, rather than as dependent order statistics
      that happen to have a simple mean, only works for first-moment
      questions, not variances.
    recap: >
      Given $n$ arrivals in $[0,t]$ their total waiting sums the
      order-statistic means to $nt/2$, while the unconditional aggregate
      time-in-system integrates directly to $\lambda t^2/2$.
    steps:
      - teach: >
          Turning "given the count, arrivals are uniform" into an actual
          person-minutes or inventory number is a two-line calculation once
          you see it as a sum over order-statistic means.
      - teach: >
          Conditional on $N(t)=n$, each $\mathbb{E}[T_k \mid N(t)=n] =
          kt/(n+1)$ is already known, so summing over $k=1,\dots,n$ gives
          the total conditional wait $nt/2$ — an arithmetic series, no new
          integration.
      - ask: >
          Packages arrive at a warehouse, and exactly $7$ arrive in a given
          hour ($t=60$ minutes). What is the total conditional waiting time
          of those $7$ packages, in minutes?
        expects: "210"
        hint: >
          Use the total conditional wait $nt/2$; note $\lambda$ does not
          enter.
        feedback: >
          $nt/2 = 7 \cdot 60/2 = 210$ minutes.
      - teach: >
          A different, unconditional quantity is the aggregate
          time-in-system of everyone who arrives during $[0,t]$: integrating
          $\lambda\,ds$ expected arrivals at each instant, each worth
          $(t-s)$ of remaining time, gives $\lambda t^{2}/2$ directly,
          without conditioning on $N(t)$ first.
      - ask: >
          Packages arrive at $\lambda = 4$ per hour. What is the expected
          aggregate time-in-system, in minutes, of everyone who arrives
          during a $1$-hour window?
        expects: "120"
        hint: >
          Use $\lambda t^{2}/2$ and convert hours to minutes.
        feedback: >
          $\lambda t^{2}/2 = 4 \cdot 1/2 = 2$ hours $= 120$ minutes.
      - teach: >
          Both numbers use the same conditional-uniformity fact, just
          aggregated two different ways — one after fixing $n$, one built to
          skip conditioning altogether.
      - ask: >
          You're told $N(t)=n$ and asked for the total waiting time of
          everyone who arrived. Which formula answers that question?
        choices:
          - text: >
              $nt/2$
            correct: true
            feedback: >
              This sums the order-statistic means $kt/(n+1)$ for $k=1,
              \dots,n$ — the right tool once $n$ is given.
          - text: >
              $\lambda t^{2}/2$
            feedback: >
              This is the *unconditional* aggregate, which already averages
              over a random $N(t)$ rather than using the given $n$.
          - text: >
              $\lambda t$
            feedback: >
              This is just the mean count $\mathbb{E}[N(t)]$, not a total
              waiting time at all.
        feedback: >
          Given $N(t)=n$, the total wait is $nt/2$; the unconditional
          $\lambda t^{2}/2$ answers a different question that isn't
          conditioned on a known count.
      - teach: >
          Conflating the conditional total $nt/2$ with the unconditional
          $\lambda t^{2}/2$ answers the wrong question — one fixes $n$, the
          other averages over it.

  - node: quant-processes.poisson.inspection-paradox
    hook: >
      Arriving at a random time and expecting to wait half the average gap
      is the single most common intuition failure this unit corrects —
      you wait the full average gap, every time.
    explanation: >
      Fix a clock time and apply the fresh-start property directly: the
      forward wait to the next arrival is $\operatorname{Exp}(\lambda)$,
      mean $1/\lambda$, regardless of how long it has been since the
      previous arrival — showing up "late" in a gap buys nothing. Running
      the same process backward from that fixed time is exactly as
      memoryless, so the elapsed time since the previous arrival is also
      $\operatorname{Exp}(\lambda)$, mean $1/\lambda$.

      The gap you land inside is the sum of those two pieces, forward plus
      backward, and since both are independent $\operatorname{Exp}(\lambda)$
      draws, that sum is $\operatorname{Gamma}(2,\lambda)$ with mean
      $2/\lambda$ — double the average gap $1/\lambda$ between consecutive
      arrivals in general.

      There's no contradiction: a fixed clock time is more likely to fall
      inside a long gap than a short one, so the gap you happen to land in
      is a biased sample of all the gaps, not a typical one.
    worked: >
      Buses run at $\lambda = 10$ per hour, mean gap $6$ minutes. Arriving
      at any fixed time, the wait for the next bus is $\operatorname{Exp}
      (10)$, so $\Pr(\text{wait} > 10 \text{ min}) = e^{-10/6} \approx
      0.1889$. The gap straddling your arrival has mean $2/10$ hour $=12$
      minutes; it exceeds $15$ minutes ($0.25$ hour) exactly when fewer than
      $2$ buses arrive in that $0.25$-hour window, so $\Pr(\text{that gap} >
      0.25) = \Pr(N(0.25) \le 1) = e^{-2.5}(1+2.5) \approx 0.2873$, read
      straight off the Poisson pmf.
    interview: >
      "You show up at a random time — how long do you wait for the bus, on
      average" wants $1/\lambda$ stated with the fresh-start justification,
      and a strong answer volunteers the doubled straddling-gap fact
      unprompted.
    pitfalls: >
      Assuming the wait shrinks because you might have "just missed" a bus
      confuses the forward wait with the backward one — both are full
      $\operatorname{Exp}(\lambda)$ draws, independent of each other.
      Reporting the straddling gap's mean as $1/\lambda$ instead of
      $2/\lambda$ conflates it with an ordinary gap.
    recap: >
      At any fixed time your wait for the next arrival averages the full
      $1/\lambda$, and the gap you land inside averages $2/\lambda$ — double
      an ordinary gap.
    steps:
      - teach: >
          Arriving at a random time and expecting to wait half the average
          gap is the single most common intuition failure this unit
          corrects — you wait the full average gap, every time.
      - teach: >
          Fix a clock time and apply the fresh-start property: the forward
          wait to the next arrival is $\operatorname{Exp}(\lambda)$, mean
          $1/\lambda$, regardless of how long it has been since the
          previous arrival.
      - ask: >
          Buses run at $\lambda = 8$ per hour. Arriving at a fixed clock
          time, what is $\Pr(\text{wait for next bus} > 12
          \text{ minutes})$?
        expects: "0.2019"
        tolerance: 0.0005
        hint: >
          Convert $12$ minutes to hours and apply the exponential survival
          function.
        feedback: >
          $12$ minutes is $0.2$ hour, so $\Pr(\text{wait} > 0.2) =
          e^{-8 \cdot 0.2} = e^{-1.6} \approx 0.2019$.
      - teach: >
          Running the process backward from that fixed time is exactly as
          memoryless, so the elapsed time since the previous arrival is also
          $\operatorname{Exp}(\lambda)$ — the gap you land inside is the
          sum of two independent $\operatorname{Exp}(\lambda)$ pieces,
          mean $2/\lambda$.
      - ask: >
          You've already been waiting $5$ minutes at the stop for the same
          $\lambda = 8$-per-hour buses. What is your expected further wait?
        choices:
          - text: >
              Less than $1/\lambda$, since you've already waited some of it
            feedback: >
              This confuses the forward wait with the backward one — the
              forward wait resets completely and doesn't shrink with
              elapsed time.
          - text: >
              $1/\lambda$, exactly as if you had just arrived
            correct: true
            feedback: >
              Fresh start says the forward wait is a brand-new $\operatorname
              {Exp}(\lambda)$ draw no matter how long you've already
              waited.
          - text: >
              $2/\lambda$, because of the inspection paradox
            feedback: >
              $2/\lambda$ is the mean of the whole straddling gap
              (backward plus forward), not the forward wait alone.
        feedback: >
          The forward wait is always a fresh $\operatorname{Exp}(\lambda)$
          draw with mean $1/\lambda$; the doubled $2/\lambda$ belongs to
          the straddling gap, not the remaining wait.
      - teach: >
          There's no contradiction: a fixed clock time is more likely to
          fall inside a long gap than a short one, so the gap you land in is
          a biased sample of all the gaps, not a typical one.
      - ask: >
          Same buses, $\lambda = 8$ per hour. What is the probability the
          gap straddling your arrival exceeds $20$ minutes?
        expects: "0.2548"
        tolerance: 0.0005
        hint: >
          The straddling gap exceeds $x$ exactly when fewer than $2$ buses
          arrive in a window of length $x$ — use $\Pr(N(x) \le 1)$.
        feedback: >
          $20$ minutes is $1/3$ hour, mean $8/3$, so $\Pr(N \le 1) =
          e^{-8/3}(1 + 8/3) \approx 0.2548$, read straight off the Poisson
          pmf.
      - teach: >
          Reporting the straddling gap's mean as $1/\lambda$ instead of
          $2/\lambda$ conflates it with an ordinary gap between consecutive
          arrivals.

  - node: quant-processes.poisson.length-bias
    hook: >
      Any statistic gathered by "sample a random point in time" rather than
      "list the items" — a queue length, a class size, a gap — is quietly
      biased toward the larger items, and this is the general form of the
      inspection paradox behind that bias.
    explanation: >
      The inspection paradox showed the exponential case: a fixed time is
      more likely to land in a long gap than a short one. The general
      version applies to any iid gaps with mean $\mathbb{E}[X]$ and any
      shape: an interval of length $x$ is over-represented in exact
      proportion to $x$ itself, since longer intervals occupy more of the
      timeline for a random point to fall into, giving the size-biased
      density $xf(x)/\mathbb{E}[X]$.

      The mean of that biased law is $\mathbb{E}[X^2]/\mathbb{E}[X]$, and
      writing $\mathbb{E}[X^2] = \operatorname{Var}(X) + \mathbb{E}[X]^2$
      splits it into $\mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$ —
      the ordinary mean plus a penalty driven entirely by variability. Zero
      variance (a deterministic timetable) means zero penalty; the more the
      gaps vary, the larger the bias.

      The same bias inflates the class size a randomly sampled student
      reports, since students in bigger classes are more likely to be the
      one you asked, and the queue length a randomly arriving customer sees
      versus a snapshot at a random arrival.
    worked: >
      Suppose gaps are iid, equal to $5$ minutes with probability $1/2$ and
      $25$ minutes with probability $1/2$, so $\mathbb{E}[X] = 15$ and
      $\mathbb{E}[X^2] = 0.5(25) + 0.5(625) = 325$, giving
      $\operatorname{Var}(X) = 325 - 225 = 100$. The size-biased mean is
      $15 + 100/15 \approx 21.67$ minutes — the interval a random time lands
      in averages nearly $7$ minutes longer than a randomly listed gap.
    interview: >
      "Why does the average class size reported by students exceed the
      school's true average class size" wants $\mathbb{E}[X] +
      \operatorname{Var}(X)/\mathbb{E}[X]$ named as the general mechanism,
      not just "because of buses."
    pitfalls: >
      Applying the exponential's specific "double the mean" shortcut to a
      non-exponential gap distribution is wrong in general; the correct
      penalty is $\operatorname{Var}(X)/\mathbb{E}[X]$, which only equals
      $\mathbb{E}[X]$ (giving the factor of two) for the exponential.
      Forgetting that a deterministic timetable has zero size-bias penalty
      is an easy sanity check to skip.
    recap: >
      Sampling by hitting an interval with a random point, rather than
      listing intervals, inflates the mean seen by $\operatorname{Var}(X)/
      \mathbb{E}[X]$ — pure variability is the whole penalty.
    steps:
      - teach: >
          Any statistic gathered by "sample a random point in time" rather
          than "list the items" — a queue length, a class size, a gap — is
          quietly biased toward the larger items.
      - teach: >
          The general size-biased density is $xf(x)/\mathbb{E}[X]$: an
          interval of length $x$ is over-represented in exact proportion to
          $x$ itself, since longer intervals occupy more of the timeline for
          a random point to fall into.
      - ask: >
          Gaps between arrivals are exactly $10$ minutes every time (a
          deterministic timetable). What is the size-biased mean gap seen by
          a random point in time, in minutes?
        expects: "10"
        hint: >
          The size-bias penalty is $\operatorname{Var}(X)/\mathbb{E}[X]$,
          and a deterministic timetable has zero variance.
        feedback: >
          $\operatorname{Var}(X)=0$ here, so the biased mean equals the
          ordinary mean: $10$ minutes, no penalty.
      - teach: >
          In general the biased mean is $\mathbb{E}[X] + \operatorname
          {Var}(X)/\mathbb{E}[X]$ — the ordinary mean plus a penalty driven
          entirely by variability in the gaps.
      - ask: >
          Gaps are iid: $4$ minutes with probability $0.3$, $20$ minutes
          with probability $0.7$. What is the size-biased mean gap, in
          minutes?
        expects: "18.7368"
        tolerance: 0.0005
        hint: >
          First find $\mathbb{E}[X]$ and $\operatorname{Var}(X)$, then
          apply $\mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$.
        feedback: >
          $\mathbb{E}[X] = 0.3(4)+0.7(20) = 15.2$, $\mathbb{E}[X^2] =
          0.3(16)+0.7(400) = 284.8$, so $\operatorname{Var}(X) = 284.8 -
          15.2^2 = 53.76$, giving a biased mean of $15.2 + 53.76/15.2
          \approx 18.7368$.
      - teach: >
          The identical bias inflates the class size a random student
          reports and the queue length a random arriving customer sees,
          since bigger classes and longer queues are more likely to be the
          one sampled.
      - ask: >
          Why does the average class size reported by students exceed the
          school's true average class size?
        choices:
          - text: >
              Because bigger classes contain more students, so they're
              proportionally over-represented among students asked
            correct: true
            feedback: >
              This is exactly size-biased sampling: a class of size $x$ is
              sampled by a random student in proportion to $x$ itself.
          - text: >
              Because teachers systematically underreport small classes
            feedback: >
              No reporting error is needed — the bias is purely a sampling
              artifact of asking students rather than listing classes.
          - text: >
              Because students in small classes are more likely to drop out
            feedback: >
              The bias appears even with fixed, unchanging class rosters —
              it comes from who gets asked, not who leaves.
        feedback: >
          The mechanism is $\mathbb{E}[X] + \operatorname{Var}(X)/
          \mathbb{E}[X]$, general to any interval sampled by a random
          point rather than listed directly.
      - teach: >
          Applying the exponential's specific "double the mean" shortcut to
          a non-exponential gap distribution is wrong in general — that
          factor of two only holds because $\operatorname{Var}(X) =
          \mathbb{E}[X]^2$ for the exponential.

  - node: quant-processes.poisson.compound
    hook: >
      "Total dollar volume traded" or "total claims paid" over a random
      number of Poisson arrivals is a random sum in disguise, and the
      variance formula has a term that a fixed-count model would miss
      entirely.
    explanation: >
      $S(t) = \sum_{i=1}^{N(t)} Y_i$ is exactly the random-sum setup with
      $N(t) \sim \operatorname{Poisson}(\lambda t)$ as the random count.
      Plugging $\mathbb{E}[N(t)] = \operatorname{Var}(N(t)) = \lambda t$
      into the general random-sum formulas gives $\mathbb{E}[S(t)] =
      \lambda t \mu$ directly, and $\operatorname{Var}(S(t)) = \lambda
      t\sigma^2 + \lambda t\mu^2 = \lambda t(\sigma^2+\mu^2)$ — the two
      variance terms collapse into one because the Poisson count's variance
      equals its mean.

      That collapse is the point worth carrying: $\sigma^2 + \mu^2 =
      \mathbb{E}[Y^2]$, so the variance is driven by the second moment of
      the mark, not just its variance, purely because the count itself is
      random rather than fixed. A model with a deterministic count $n$
      would give $\operatorname{Var} = n\sigma^2$ only, missing the
      $\mu^2$ contribution entirely.

      This is the standard model for aggregate volume, claim totals, or any
      quantity built by summing a random number of similar-sized pieces.
    worked: >
      Insurance claims arrive at $50$ per day, with claim size mean $3000$
      and standard deviation $1000$. Daily total claims have mean $50
      \cdot 3000 = 150{,}000$ and variance $50(1000^2+3000^2) =
      50(10{,}000{,}000) = 500{,}000{,}000$, so the standard deviation is
      $\sqrt{500{,}000{,}000} \approx 22{,}361$.
    interview: >
      "Mean and variance of total volume over a random number of Poisson
      arrivals" wants $\lambda t \mu$ and $\lambda t\,\mathbb{E}[Y^2]$
      stated directly, with the reasoning that the count's variance equals
      its mean for the Poisson case specifically.
    pitfalls: >
      Using $\lambda t \sigma^2$ alone and dropping the $\lambda t \mu^2$
      term treats the count as fixed when it is random — a systematic
      underestimate of the true variance. The formula's collapse to
      $\lambda t \mathbb{E}[Y^2]$ is specific to a Poisson count; a
      differently-distributed random count needs the full two-term
      random-sum formula.
    recap: >
      Summing iid marks over Poisson arrivals gives mean $\lambda t \mu$ and
      variance $\lambda t\,\mathbb{E}[Y^2]$, the two-term random-sum formula
      collapsed because a Poisson count's variance equals its mean.
    steps:
      - teach: >
          "Total dollar volume traded" or "total claims paid" over a random
          number of Poisson arrivals is a random sum in disguise, and its
          variance has a term a fixed-count model would miss entirely.
      - teach: >
          Plugging $\mathbb{E}[N(t)] = \operatorname{Var}(N(t)) = \lambda
          t$ into the general random-sum formulas gives $\mathbb{E}[S(t)] =
          \lambda t \mu$, and the two variance terms collapse into
          $\operatorname{Var}(S(t)) = \lambda t(\sigma^2+\mu^2)$ because
          the Poisson count's variance equals its mean.
      - ask: >
          Trade sizes have mean $100$ shares and standard deviation $40$
          shares. What is $\mathbb{E}[Y^2]$ for a single trade size?
        expects: "11600"
        hint: >
          Use $\mathbb{E}[Y^2] = \operatorname{Var}(Y) + \mathbb{E}[Y]^2$.
        feedback: >
          $\mathbb{E}[Y^2] = 40^2 + 100^2 = 1600+10000 = 11600$.
      - teach: >
          That collapse, $\sigma^2+\mu^2 = \mathbb{E}[Y^2]$, is the point
          worth carrying: the variance is driven by the second moment of the
          mark, not just its variance, purely because the arrival count is
          random rather than fixed.
      - ask: >
          Trades arrive at $300$ per hour with the same size distribution
          (mean $100$, sd $40$ shares). What is the variance of total hourly
          volume?
        expects: "3480000"
        hint: >
          Use $\operatorname{Var}(S(t)) = \lambda t\,\mathbb{E}[Y^2]$
          with $t=1$ hour.
        feedback: >
          $\operatorname{Var}(S) = 300 \cdot 11600 = 3{,}480{,}000$.
      - teach: >
          This is the standard model for aggregate volume, claim totals, or
          any quantity built by summing a random number of similar-sized
          pieces.
      - ask: >
          A colleague computes the variance of total volume as $\lambda t
          \sigma^2$ only, dropping the $\lambda t \mu^2$ term. What does
          that mistake do to the estimate?
        choices:
          - text: >
              Systematically underestimates the true variance
            correct: true
            feedback: >
              Dropping $\lambda t \mu^2$ treats the arrival count as
              fixed at its mean rather than random, which removes a
              strictly positive source of variance.
          - text: >
              Systematically overestimates the true variance
            feedback: >
              The dropped term is strictly positive (unless $\mu=0$), so
              omitting it can only reduce the computed variance below the
              true value.
          - text: >
              Has no effect, since $\mu^2$ is small relative to $\sigma^2$
            feedback: >
              There's no general size relationship between $\mu^2$ and
              $\sigma^2$ — for this trade-size example $\mu^2=10000$
              actually exceeds $\sigma^2=1600$.
        feedback: >
          $\lambda t \sigma^2$ alone treats the count as deterministic;
          the random count contributes its own variance term, $\lambda t
          \mu^2$, which the shortcut misses.
      - teach: >
          The exact collapse to $\lambda t\,\mathbb{E}[Y^2]$ is specific
          to a Poisson count; a differently-distributed random count needs
          the full two-term random-sum formula instead.

  - node: quant-processes.poisson.nonhomogeneous
    hook: >
      Real arrival rates move with the clock — busier at market open, quiet
      overnight — and this is the minimal change that keeps Poisson counts
      usable once the rate stops being constant.
    explanation: >
      Only stationarity is dropped; independent increments and the local
      "chance $\lambda(t)\,dt$ per instant" picture survive unchanged. The
      count over $(a,b]$ is still Poisson, just with mean equal to the
      accumulated rate $m(b)-m(a) = \int_a^b \lambda(u)\,du$ rather than
      $\lambda(b-a)$ — you integrate the varying rate exactly the way you'd
      sum a constant one over a fixed window.

      Because the rate now depends on when you are, gaps are no longer iid
      — a gap starting during a busy period is typically shorter than one
      starting during a quiet one — so the clean interarrival-times result
      genuinely breaks, and only independence of future from past survives
      from the fresh-start property, not a shared distribution.

      The load-bearing trick for working with these processes is a time
      change: running the clock on $m$ instead of on ordinary time turns
      the non-homogeneous process into a standard rate-$1$ Poisson process,
      which is exactly how you'd simulate one — draw rate-$1$ arrivals and
      map each epoch back through $m^{-1}$.
    worked: >
      Let $\lambda(t) = 2t$ for $t \in [0,3]$ hours, so $m(t) = t^2$. The
      expected number of arrivals in $[1,2]$ is $m(2)-m(1) = 4-1 = 3$, so
      $\Pr(\text{no arrivals in } [1,2]) = e^{-3} \approx 0.0498$. The
      expected count in $[0,1]$ is $m(1) = 1$, so $\Pr(N=2 \text{ in }[0,1])
      = e^{-1}/2 \approx 0.1839$.
    interview: >
      "Arrival rate is $\lambda(t)$, not constant — how many events do you
      expect between $a$ and $b$" wants $\int_a^b \lambda(u)\,du$ stated
      directly, distinguishing it from the constant-rate shortcut
      $\lambda(b-a)$.
    pitfalls: >
      Multiplying a snapshot rate $\lambda(t)$ by the window width instead
      of integrating badly misestimates the count whenever the rate moves
      appreciably across the window. Assuming interarrival gaps stay iid
      exponential here is a leftover habit from the constant-rate case that
      no longer holds.
    recap: >
      A non-homogeneous Poisson process keeps independent increments and
      Poisson counts with mean $\int \lambda$, and a time change on $m$
      converts it back to a standard rate-$1$ process.
    steps:
      - teach: >
          Real arrival rates move with the clock — busier at market open,
          quiet overnight — and this is the minimal change that keeps
          Poisson counts usable once the rate stops being constant.
      - teach: >
          Only stationarity is dropped: independent increments survive, and
          the count over $(a,b]$ is still Poisson, now with mean equal to
          the accumulated rate $m(b)-m(a) = \int_a^b \lambda(u)\,du$
          rather than $\lambda(b-a)$.
      - ask: >
          For a rate $\lambda(t)$ that varies with $t$, which expression
          equals $\mathbb{E}[N(b) - N(a)]$?
        choices:
          - text: >
              $\int_a^b \lambda(u)\,du$
            correct: true
            feedback: >
              The mean count accumulates the varying rate exactly the way a
              constant rate would be summed over a fixed window.
          - text: >
              $\lambda(b) \cdot (b-a)$
            feedback: >
              This uses only the rate at the endpoint $b$, ignoring how the
              rate moved across the rest of the window.
          - text: >
              $\lambda(a) \cdot (b-a)$
            feedback: >
              This uses only the rate at the starting point $a$ and misses
              everything the rate does afterward.
        feedback: >
          Only the integral $\int_a^b \lambda(u)\,du$ correctly
          accumulates a rate that changes across the window; either endpoint
          snapshot ignores that movement.
      - teach: >
          Because the rate now depends on when you are, gaps are no longer
          iid — a gap starting during a busy period is typically shorter
          than one starting during a quiet one — so only independence of
          future from past survives from the fresh-start property.
      - ask: >
          Let $\lambda(t) = 4t$ for $t \in [0,3]$ hours. What is the
          expected number of arrivals in $[0,1]$?
        expects: "2"
        hint: >
          Compute $m(t) = \int_0^t 4u\,du$ and evaluate $m(1)-m(0)$.
        feedback: >
          $m(t) = 2t^2$, so $m(1)-m(0) = 2 - 0 = 2$.
      - teach: >
          The load-bearing trick for working with these processes is a time
          change: running the clock on $m$ instead of ordinary time turns
          the process into a standard rate-$1$ Poisson process, exactly how
          you'd simulate one.
      - ask: >
          Same $\lambda(t) = 4t$ on $[0,3]$. What is $\Pr(\text{no
          arrivals in } [0,1])$?
        expects: "0.1353"
        tolerance: 0.0005
        hint: >
          Use the mean count found for $[0,1]$ with the ordinary Poisson
          pmf.
        feedback: >
          The mean over $[0,1]$ is $2$, so $\Pr(N=0) = e^{-2} \approx
          0.1353$.
      - teach: >
          Multiplying a snapshot rate $\lambda(t)$ by the window width
          instead of integrating badly misestimates the count whenever the
          rate moves appreciably across the window.

  - node: quant-processes.poisson.clumping
    hook: >
      A scatter plot of Poisson arrivals looks bunched and uneven to nearly
      everyone who sees one, and mistaking that normal clustering for a
      "real" burst is the trap this node exists to close.
    explanation: >
      The exponential gap density $\lambda e^{-\lambda x}$ is largest at
      $x=0$ and decreasing from there, so short gaps are the single most
      likely outcome, not a rare anomaly — a visible cluster of close-together
      points is exactly what memoryless arrivals look like, not evidence
      something unusual happened.

      Counts wobble for a related reason: $\operatorname{Var}(N(t)) =
      \lambda t$ makes the typical deviation from the mean equal to
      $\sqrt{\lambda t}$, which grows slower than the mean itself — so an
      expected $100$
      arrivals routinely turns up as $90$ or $115$, a swing that looks large
      relative to nothing but feels significant on its own.

      The test that runs the other direction is the one to actually use:
      compute the index of dispersion $\operatorname{Var}(N)/\mathbb{E}[N]$
      from data. A ratio near $1$ is consistent with Poisson; well above $1$
      signals genuine clustering beyond what randomness alone produces, and
      well below $1$ signals something closer to a timetable.
    worked: >
      At $\lambda = 8$ per hour, a gap under a fifth of the mean ($1/40$
      hour $= 1.5$ minutes) occurs with probability $1 - e^{-0.2} \approx
      0.1813$ — nearly one in five gaps looks "suspiciously" short. Over
      $t=4$ hours, $\mathbb{E}[N] = 32$ with typical deviation $\sqrt{32}
      \approx 5.66$, so counts of $26$ to $38$ are unremarkable.
    interview: >
      "Does this event data look Poisson, or is it clustering" wants the
      index of dispersion $\operatorname{Var}(N)/\mathbb{E}[N]$ named as the
      actual test, not a visual judgment about whether points "look" evenly
      spread.
    pitfalls: >
      Judging clustering by eye from a scatter of points is unreliable —
      genuine Poisson arrivals produce visible clumps routinely. Treating
      any single observed count that differs from the mean by more than a
      little as evidence of a changed rate ignores that $\sqrt{\lambda t}$
      swings are expected, not exceptional.
    recap: >
      Exponential gaps make visible clustering the Poisson norm, and the
      index of dispersion $\operatorname{Var}(N)/\mathbb{E}[N] \approx 1$,
      not a visual check, is the actual test for whether a stream is
      Poisson.
    steps:
      - teach: >
          A scatter plot of Poisson arrivals looks bunched and uneven to
          nearly everyone who sees one, and mistaking that normal
          clustering for a "real" burst is the trap this node closes.
      - teach: >
          The exponential gap density $\lambda e^{-\lambda x}$ is largest
          at $x=0$ and decreasing from there, so short gaps are the single
          most likely outcome — a visible cluster of close-together points
          is exactly what memoryless arrivals look like.
      - ask: >
          At $\lambda = 15$ per hour, what is the probability that a gap is
          under a tenth of the mean gap?
        expects: "0.0952"
        tolerance: 0.0005
        hint: >
          The mean gap is $1/\lambda$; find a tenth of it and apply the
          exponential cdf.
        feedback: >
          The mean gap is $1/15$ hour, a tenth of which is $1/150$ hour, so
          $\Pr(X < 1/150) = 1 - e^{-15/150} = 1 - e^{-0.1} \approx
          0.0952$.
      - teach: >
          Counts wobble for a related reason: $\operatorname{Var}(N(t)) =
          \lambda t$ makes the typical deviation from the mean $\sqrt
          {\lambda t}$, which grows slower than the mean itself.
      - ask: >
          Same $\lambda = 15$ per hour, over $t = 9$ hours. What is the
          typical deviation (standard deviation) of the count $N(t)$?
        expects: "11.6190"
        tolerance: 0.0005
        hint: >
          $\operatorname{Var}(N(t)) = \lambda t$; take the square root.
        feedback: >
          $\operatorname{Var}(N(9)) = 15 \cdot 9 = 135$, so the standard
          deviation is $\sqrt{135} \approx 11.6190$.
      - teach: >
          The test that runs the other direction is the one to actually
          use: the index of dispersion $\operatorname{Var}(N)/\mathbb{E}
          [N]$ computed from data, not a visual impression of the points.
      - ask: >
          You compute $\operatorname{Var}(N)/\mathbb{E}[N] \approx 2.3$
          from observed event data. What does that suggest?
        choices:
          - text: >
              Genuine clustering beyond what Poisson randomness alone
              produces
            correct: true
            feedback: >
              For a Poisson process this ratio is exactly $1$; a ratio well
              above $1$ signals extra clustering the model doesn't explain.
          - text: >
              The stream is under-dispersed, closer to a timetable
            feedback: >
              Under-dispersion (closer to deterministic spacing) would show
              up as a ratio *below* $1$, not above it.
          - text: >
              The stream is definitely Poisson
            feedback: >
              A Poisson stream has $\operatorname{Var}(N)/\mathbb{E}[N]
              \approx 1$; a ratio of $2.3$ is well away from that
              benchmark.
        feedback: >
          A dispersion ratio well above $1$ is the actual evidence for
          clustering — nothing a scatter plot alone can establish reliably.
      - teach: >
          Judging clustering by eye from a scatter of points is unreliable,
          and treating any single observed count that differs from the mean
          by a bit as evidence of a changed rate ignores that $\sqrt{
          \lambda t}$ swings are expected, not exceptional.
