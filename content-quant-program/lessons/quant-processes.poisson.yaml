unit: quant-processes.poisson
opening: >
  Poisson processes are the default model for events that happen one at a time
  with no memory — trade prints, phone calls, defaults, radioactive decays.
  The unit opens with two equivalent definitions, the whole-window count
  axioms and the local infinitesimal-rate picture, then lands on the single
  fact that makes everything else algebra instead of calculus: the gaps
  between arrivals are iid exponential. From there it covers the two
  operations interviews lean on — superposition (merging streams) and
  thinning (splitting one stream by a coin flip) — and the fact that
  conditioning on the count strips the rate out entirely, leaving arrival
  times that are just uniform points. It closes with the inspection paradox,
  length-biased sampling, and the compound and non-homogeneous extensions
  used to model random sums and time-varying rates.
lessons:
  - node: quant-processes.poisson.pp
    hook: >
      Every "events happen independently at a constant rate" setup — trade
      prints, phone calls, decays — is silently invoking this exact set of
      axioms, and an interviewer expects the three properties named, not just
      the Poisson pmf recited back.
    explanation: >
      A single Poisson distribution only describes one window. A process
      ties every window together at once, and consistency across windows is
      exactly what the three axioms buy: independent increments say what
      happens in one time block carries no information about another
      disjoint block; stationary increments say the law of a window depends
      on its length, never on where it starts; and the count over a
      length-$t$ window being $\operatorname{Poisson}(\lambda t)$ is the same
      distribution already known, now attached to every window simultaneously.

      The mean and variance $\lambda t$ follow immediately from that last
      axiom — no new computation needed, just the Poisson fact restated at
      each $t$. The real content is the first two axioms: they force the
      counts over any two disjoint windows to be independent Poisson
      variables, so a long interval can be chopped into blocks and each
      block's count analyzed on its own.

      Carry the mental model of arrivals as a fine, independent mist falling
      through time at density $\lambda$ per unit time — nothing about
      elapsed time or window boundaries changes the local rate.
    worked: >
      At $\lambda = 6$ per hour, a $20$-minute window has mean $6 \cdot
      1/3 = 2$, so $\Pr(N = 2) = e^{-2} \cdot 2^{2}/2! = 2e^{-2} \approx
      0.2707$. Independence across disjoint windows means the next $20$
      minutes is an unrelated fresh $\operatorname{Poisson}(2)$, so
      $\Pr(\text{2 in the first window and 1 in the second}) = (2e^{-2})
      (2e^{-2}) = 4e^{-4} \approx 0.0733$.
    interview: >
      "Define a Poisson process" wants the three axioms named in order, not
      the pmf alone; volunteering that disjoint-window counts are
      independent before being asked is what separates a strong answer.
    pitfalls: >
      Treating stationarity as automatic once increments are independent is
      wrong — a process whose rate drifts over time can still have
      independent increments, and that is the non-homogeneous case, not this
      one. Writing $N(t) \sim \operatorname{Poisson}(\lambda)$ and dropping
      the window length $t$ is the other common slip.
    recap: >
      A Poisson process ties every window's count together through
      independent, stationary increments, each $\operatorname{Poisson}
      (\lambda t)$ — three axioms, not one formula.
    dialogue:
      - part: One window at a time
        teach: >
          Quote requests hit a pricing server one at a time, independently, at
          an average of $12$ per hour. You are asked about the window from
          10:00 to 10:15, and you model its count as a Poisson variable.
      - ask: >
          What mean do you give that Poisson variable?
        expects: "3"
        hint: >
          A quarter of an hour at $12$ per hour.
        feedback: >
          $12 \cdot 1/4 = 3$. The mean scales with the length of the window,
          which is why the count over a window of length $t$ is written
          $\operatorname{Poisson}(\lambda t)$ and never
          $\operatorname{Poisson}(\lambda)$.
      - ask: >
          What is the probability that no request arrives between 10:00 and
          10:15? Give four decimals.
        expects: "0.0498"
        tolerance: 0.0005
        hint: >
          The Poisson pmf at $0$ is $e^{-\mu}$.
        feedback: >
          $\Pr(N = 0) = e^{-3} \approx 0.0498$. One window, one known
          distribution: nothing new yet.
      - ask: >
          Now two windows: what is the probability of no request from 10:00 to
          10:15 *and* none from 10:15 to 10:30?
        choices:
          - text: >
              $e^{-3} \cdot e^{-3} = e^{-6}$, since each window is
              $\operatorname{Poisson}(3)$.
            feedback: >
              Multiplying assumes the two windows are independent, and "each
              window is $\operatorname{Poisson}(3)$" does not say so. A server
              that drew one $\operatorname{Poisson}(3)$ number and then logged
              that same count in every quarter hour has the same law in each
              window, and its chance of two empty windows is $e^{-3}$, not
              $e^{-6}$.
          - text: >
              It cannot be settled from the law of each window alone.
            correct: true
            feedback: >
              Right. A distribution for each window says nothing about how two
              windows move together, and the joint probability lives exactly
              there.
          - text: >
              $e^{-3}$, since an empty first window makes an empty second one
              likely.
            feedback: >
              That is the answer for the repeating server, and $e^{-6}$ is the
              answer for independent windows. Both models give each window a
              $\operatorname{Poisson}(3)$ law, so the per-window law alone
              cannot pick between them.
        feedback: >
          A Poisson count for one window is a fact about one window. To answer
          questions spanning several, the windows have to be tied together.

      - part: What ties the windows together
        reflect: >
          Say what you would have to assume about the windows so that the
          two-window question has one answer, and so that the count from 10:00
          to 10:30 is itself Poisson with mean $6$.
        hint: >
          Two separate demands: one about how disjoint windows relate, one
          about whether 10:15 differs from 9:00.
        answer: >
          Counts in disjoint windows must be independent, so the joint
          probability factors into $e^{-6}$. And the law of a window must
          depend only on its length, not on where it starts, so 10:15 to 10:30
          behaves like any other quarter hour. Then the half-hour count is a
          sum of two independent $\operatorname{Poisson}(3)$ variables, which
          is $\operatorname{Poisson}(6)$, and its chance of being $0$ is
          $e^{-6}$ again: the two routes agree.
      - teach: >
          That is the definition. A counting process $N(t)$ starts at $0$,
          steps up by whole numbers, and $N(b) - N(a)$ counts arrivals in
          $(a,b]$. It is a Poisson process of rate $\lambda$ when three things
          hold for every choice of windows: increments over disjoint windows
          are independent; increments are stationary, so a window's law depends
          on its length alone; and a window of length $t$ holds a
          $\operatorname{Poisson}(\lambda t)$ count. One distribution, attached
          to every window at once and consistently.
      - ask: >
          Under all three axioms, what is the probability of exactly $2$
          requests from 10:00 to 10:15 and none from 10:15 to 10:30? Give four
          decimals.
        expects: "0.0112"
        tolerance: 0.0005
        hint: >
          Disjoint windows: multiply the two Poisson pmfs, each with mean $3$.
        feedback: >
          $\Pr(N = 2) = e^{-3} \cdot 3^{2}/2! = 4.5e^{-3}$ for the first window
          and $e^{-3}$ for the second, so the answer is
          $4.5e^{-6} \approx 0.0112$. Independence is what licenses the product,
          stationarity what gives the second window mean $3$ as well.
      - ask: >
          What is the variance of the number of requests between 13:00 and
          13:40?
        expects: "8"
        hint: >
          Find the mean first; a Poisson variable's variance equals it.
        feedback: >
          $40$ minutes at $12$ per hour is a mean of $12 \cdot 2/3 = 8$, and a
          Poisson count has variance equal to its mean, so $8$. Stationarity
          means 13:00 is no different from 10:00.

      - part: Testing the clauses one at a time
        ask: >
          A second server behaves differently: requests arrive independently,
          disjoint windows are independent and each window's count is Poisson,
          but the rate is $12$ per hour before noon and $30$ per hour after.
          Which axiom does it break?
        choices:
          - text: >
              Independent increments.
            feedback: >
              The windows are still independent of one another: what happens
              at 9:00 tells you nothing about 15:00. That clause survives.
          - text: >
              Stationary increments.
            correct: true
            feedback: >
              A quarter hour at 10:00 has mean $3$ and a quarter hour at 14:00
              has mean $7.5$, so the law of a window depends on where it
              starts. Only that clause fails.
          - text: >
              The Poisson law of each window.
            feedback: >
              Each window's count is still Poisson, just with a mean that
              depends on the clock. The Poisson shape survives; the single rate
              does not.
        feedback: >
          A drifting rate with independent windows is a real and useful model,
          the non-homogeneous Poisson process. It is not a Poisson process of
          any single rate $\lambda$.
      - ask: >
          A third server logs every request twice, so each true arrival
          produces two entries at the same instant. Its entries average $24$
          per hour. Is the count of entries a Poisson process of rate $24$?
        choices:
          - text: >
              Yes: the mean rate is $24$ and disjoint windows stay independent.
            feedback: >
              The rate matches and independence survives, but look at a single
              quarter hour: the entry count is $2 \cdot \operatorname{Poisson}(3)$,
              always even, with mean $6$ and variance $4 \cdot 3 = 12$. A
              Poisson count with mean $6$ has variance $6$ and can be odd.
          - text: >
              No: the count over a window is not Poisson.
            correct: true
            feedback: >
              Right. Doubling a Poisson count keeps independence and
              stationarity but destroys the third clause: the count is even and
              its variance is twice its mean.
          - text: >
              No: the increments are no longer stationary.
            feedback: >
              Every quarter hour still has the same law,
              $2 \cdot \operatorname{Poisson}(3)$, wherever it starts. The
              broken clause is the Poisson law itself.
        feedback: >
          Each clause can fail on its own, which is why an interviewer wants
          all three named: independent, stationary, Poisson with mean
          $\lambda t$.
      - teach: >
          In an interview, "define a Poisson process" is answered with the
          three clauses in one breath, then the consequence that earns them:
          counts in disjoint windows are independent Poisson variables, so a
          long horizon can be cut into blocks and each block handled alone.
  - node: quant-processes.poisson.infinitesimal-definition
    hook: >
      When a problem hands you a hazard or failure rate instead of a
      distribution, this is the definition that turns "chance $\lambda\,dt$
      per instant" directly into Poisson counts without re-deriving anything.
    explanation: >
      The whole-window axioms describe the process from the outside; this
      characterization builds it from the inside, instant by instant. In a
      tiny window of length $h$, an arrival happens with probability about
      $\lambda h$ and two arrivals essentially never happen together — that
      second condition, orderliness, is what rules out simultaneous arrivals
      and keeps the counting process integer-valued in a well-behaved way.

      The load-bearing move is chopping $[0,t]$ into $n$ equal slots of
      length $t/n$: each slot independently holds one arrival with
      probability about $\lambda t/n$ and (by orderliness) essentially never
      more than one, so $N(t)$ behaves like a sum of $n$ independent
      near-Bernoulli trials — a binomial that becomes exactly
      $\operatorname{Poisson}(\lambda t)$ as $n \to \infty$. That is the same
      count law the whole-window definition demands, so the two definitions
      agree.

      Reach for this form whenever a problem states a rate that changes
      instant to instant rather than handing you a clean distributional
      claim — it is the natural language for building the process up from
      local behavior.
    worked: >
      A process has $\Pr(N(h) = 1) = 20h + o(h)$ for $h$ in seconds, with
      orderliness holding — so it is Poisson at rate $\lambda = 20$ per
      second. Over a $100$-millisecond window the mean count is
      $20 \cdot 0.1 = 2$, so the chance of no arrivals in that window is
      $e^{-2} \approx 0.1353$.
    interview: >
      "What's the chance of an arrival in a small interval $dt$" is testing
      whether $\lambda\,dt$ comes out immediately, along with naming
      orderliness as the reason two arrivals can't coincide.
    pitfalls: >
      Forgetting the $o(h)$ qualifier and treating $\lambda h$ as an exact
      probability breaks down for larger $h$ — it is only a first-order
      approximation. Skipping the orderliness condition lets batch arrivals
      sneak in, which the ordinary Poisson process forbids by construction.
    recap: >
      A local rule — chance $\lambda\,dt$ of one arrival per instant, never
      two at once — is equivalent to the whole-window Poisson axioms, and is
      the form to use when a rate, not a distribution, is given.
    dialogue:
      - part: A rate where you wanted a distribution
        teach: >
          A satellite link's operator gives you only this: over any short
          stretch of $h$ days the chance of a dropout is about $0.25h$, two
          dropouts in the same short stretch essentially never happen, and
          stretches that do not overlap behave independently. You need the
          chance of no dropout in the next $6$ days.
      - ask: >
          A junior applies "chance $0.25h$" to the whole stretch at once, with
          $h = 6$. What number does the rule hand back as the chance of a
          dropout?
        expects: "1.5"
        hint: >
          Multiply.
        feedback: >
          $0.25 \cdot 6 = 1.5$, a "probability" above $1$. The rule cannot be
          meant for stretches this long.
      - ask: >
          What exactly went wrong?
        choices:
          - text: >
              The rate $0.25$ per day must be wrong.
            feedback: >
              The rate is fine; $1.5$ is a perfectly good *expected number* of
              dropouts in $6$ days. The trouble is reading an expected count
              as a probability.
          - text: >
              "About $0.25h$" is only accurate when $h$ is small; over a long
              stretch it double-counts the ways to get several dropouts.
            correct: true
            feedback: >
              Right. For short stretches one dropout is the only thing that
              happens, so chance and expected count agree. Over $6$ days
              several dropouts are likely, and $0.25 \cdot 6$ counts each of
              them.
          - text: >
              Nothing, once you cap it: a dropout in $6$ days is certain.
            feedback: >
              Capping at $1$ claims the link cannot survive $6$ days, and
              nothing in the setup forces that. A rule that needs patching at
              the edge was being used outside its range.
        feedback: >
          The local rule is first order. To use it over $6$ days you need a way
          to apply it only to short stretches and then combine them.

      - part: Six days cut into slots
        teach: >
          Cut the $6$ days into $60$ slots of $0.1$ day. In each slot the rule
          applies honestly: a dropout with chance about $0.025$, never two, and
          slots independent of one another.
      - ask: >
          Treating each slot as an independent trial with chance $0.025$, what
          is the probability that all $60$ slots are clean? Give four decimals.
        expects: "0.2189"
        tolerance: 0.0005
        hint: >
          Every one of $60$ independent slots must miss.
        feedback: >
          $(1 - 0.025)^{60} \approx 0.2189$.
      - ask: >
          Now cut finer: $600$ slots of $0.01$ day, each with chance $0.0025$.
          What is the probability of no dropout? Give four decimals.
        expects: "0.2227"
        tolerance: 0.0005
        hint: >
          Same computation with the new slot count and chance.
        feedback: >
          $(1 - 0.0025)^{600} \approx 0.2227$. The answer is settling as the
          slots shrink; it is converging to something.
      - reflect: >
          With $n$ slots, what distribution does the number of dropouts follow,
          and what does it become as $n$ grows? So what is the exact chance of
          no dropout in $6$ days?
        hint: >
          Count successes in $n$ independent trials, each with chance $1.5/n$.
        answer: >
          The count over $n$ slots is $\operatorname{Binomial}(n, 1.5/n)$:
          $n$ independent trials whose expected total stays at $1.5$. As $n$
          grows that binomial converges to $\operatorname{Poisson}(1.5)$, the
          rare-events limit. So the chance of no dropout is
          $e^{-1.5} \approx 0.2231$, which is where $0.2189$ and $0.2227$ were
          heading.
      - teach: >
          That is the infinitesimal rate characterization. A counting process
          with independent stationary increments is a Poisson process of rate
          $\lambda$ exactly when, as $h \downarrow 0$,
          $\Pr(N(h) = 1) = \lambda h + o(h)$ and $\Pr(N(h) \ge 2) = o(h)$. The
          slot argument is the proof idea: the local rule makes the count over
          $[0,t]$ a binomial with $n$ slots and chance $\lambda t/n$, whose
          limit is $\operatorname{Poisson}(\lambda t)$, the whole-window law.

      - part: What each condition paid for
        ask: >
          Which step of the slot argument needed $\Pr(N(h) \ge 2) = o(h)$, the
          orderliness condition?
        choices:
          - text: >
              Treating different slots as independent trials.
            feedback: >
              That is independent increments: disjoint slots are disjoint
              windows. Orderliness says nothing about how slots relate.
          - text: >
              Giving every slot the same chance, wherever it sits in the $6$
              days.
            feedback: >
              That is stationarity. The day-$5$ slot behaves like the day-$1$
              slot because only a window's length matters.
          - text: >
              Counting dropouts by counting dirty slots, as if no slot held
              two.
            correct: true
            feedback: >
              Right. A slot is a yes-or-no trial only if two dropouts in one
              short slot are negligible; without that, the binomial undercounts
              and the limit need not be Poisson.
        feedback: >
          Three ingredients, three jobs: independence makes the slots separate
          trials, stationarity gives them one chance, orderliness makes each a
          single yes-or-no.
      - ask: >
          With the Poisson law in hand, what is the probability of exactly one
          dropout in the $6$ days? Give four decimals.
        expects: "0.3347"
        tolerance: 0.0005
        hint: >
          Poisson pmf at $1$ with mean $1.5$.
        feedback: >
          $1.5 \, e^{-1.5} \approx 0.3347$. The local rule alone could never
          have produced this number.
      - ask: >
          Back to a short stretch: $h = 0.04$ day. The local rule says the
          chance of exactly one dropout is about $0.01$. What is the exact
          chance under the Poisson law? Give four decimals.
        expects: "0.0099"
        tolerance: 0.00005
        hint: >
          Mean $0.25 \cdot 0.04$, then the pmf at $1$.
        feedback: >
          $0.01 \, e^{-0.01} \approx 0.0099$. The gap from $0.01$ is about
          $0.0001$, roughly $(\lambda h)^{2}$, and it shrinks faster than $h$.
          That is what the $o(h)$ in the statement allows for: $\lambda h$ is a
          first-order description, never an exact one.

      - part: When the local picture is not enough
        ask: >
          An engineer adds that right after a dropout the link is shaky: for
          the next day the chance of another dropout per short stretch is
          about $2h$, before settling back to $0.25h$. Is the dropout count
          still a Poisson process?
        choices:
          - text: >
              Yes: there is still a local chance proportional to $h$ and no
              double dropouts.
            feedback: >
              A local rate exists, but it depends on what already happened.
              The characterization needs independent increments, and here the
              past changes the future window's chance.
          - text: >
              No: independent increments fail, because a dropout raises the
              chance of another soon after.
            correct: true
            feedback: >
              Right. Dropouts now cluster, and the count over a window depends
              on whether the previous window had one. The binomial-slot
              argument dies at its first step.
          - text: >
              No: orderliness fails, because dropouts can now coincide.
            feedback: >
              Two dropouts in the same short stretch are still negligible: the
              chance is $2h$ for one, not a positive chance of two at once.
              Orderliness survives; independence does not.
        feedback: >
          Reach for the local form when you are handed a hazard rate, but check
          that the rate is the same whatever has happened so far. A rate that
          reacts to past arrivals is a self-exciting process, not a Poisson
          one.
  - node: quant-processes.poisson.interarrival
    hook: >
      Recognizing "time between events" language as an exponential gap,
      instantly and without re-deriving it, is the single most reused reflex
      in this unit.
    explanation: >
      The first gap is forced by the process definition itself: no arrival
      by time $t$ means $N(t) = 0$, so $\Pr(X_1 > t) = \Pr(N(t) = 0) =
      e^{-\lambda t}$ — exactly the exponential survival function, with no
      extra assumption needed.

      The load-bearing step is that this same argument reruns after every
      arrival. Independent, stationary increments mean the process observed
      after any arrival looks, in distribution, exactly like a fresh
      Poisson process started at that instant — so the wait for the next
      arrival, counted from there, again satisfies $\Pr(X_2 > t) =
      e^{-\lambda t}$, independent of $X_1$. Chaining this arrival by
      arrival is why every gap is iid $\operatorname{Exp}(\lambda)$.

      The converse — building a Poisson process by laying down iid
      exponential gaps — is the standard way to simulate one: draw
      exponentials, cumulative-sum them into arrival times, and the counting
      process they generate automatically satisfies all three axioms.
    worked: >
      Calls arrive at a help line at $\lambda = 10$ per minute, so the mean
      gap is $1/10$ minute $= 6$ seconds. The probability a gap exceeds $3$
      seconds ($0.05$ minute) is $e^{-10 \cdot 0.05} = e^{-0.5} \approx
      0.6065$.
    interview: >
      "What's the distribution of time between arrivals" wants
      $\operatorname{Exp}(\lambda)$ stated immediately, with the
      one-line justification that $\Pr(X_1 > t) = \Pr(N(t) = 0)$; a strong
      answer also volunteers that the converse construction is how these
      processes get simulated.
    pitfalls: >
      Treating only the first gap as exponential and reasoning separately
      about later gaps wastes time — independence and stationarity hand you
      every gap at once, with no new argument needed. Confusing "gaps are
      independent" with "arrival times are independent" is the other slip;
      the times $T_n$ are sums of the gaps and are strongly dependent.
    recap: >
      Every gap between Poisson arrivals is independent
      $\operatorname{Exp}(\lambda)$, because the process restarts identically
      after each arrival, and the converse builds a Poisson process from iid
      exponential gaps.
    dialogue:
      - part: Waiting for the first message
        teach: >
          A client's messages arrive as a Poisson process at $15$ per hour.
          You start watching at 10:00 sharp.
      - ask: >
          What is the probability that nothing arrives between 10:00 and 10:08?
          Give four decimals.
        expects: "0.1353"
        tolerance: 0.0005
        hint: >
          Eight minutes at $15$ per hour is a Poisson count with what mean?
        feedback: >
          $15 \cdot 8/60 = 2$, so $\Pr(N = 0) = e^{-2} \approx 0.1353$.
      - ask: >
          Call $X_1$ the wait from 10:00 to the first message, in hours. What
          is $\Pr(X_1 > t)$?
        choices:
          - text: >
              $15t \, e^{-15t}$
            feedback: >
              That is the chance of *exactly one* message by $t$. "The first
              message comes after $t$" means *no* message by $t$.
          - text: >
              $1 - e^{-15t}$
            feedback: >
              That is $\Pr(X_1 \le t)$, the chance the first message has
              already come. The survival function is its complement.
          - text: >
              $e^{-15t}$
            correct: true
            feedback: >
              Right. "First message after $t$" is the event $N(t) = 0$, so
              $\Pr(X_1 > t) = e^{-15t}$: the survival function of an
              $\operatorname{Exp}(15)$ variable.
        feedback: >
          The first gap is exponential with no extra assumption: it is read
          straight off the count in $[0,t]$.
      - ask: >
          What is the expected wait for the first message, in minutes?
        expects: "4"
        hint: >
          An $\operatorname{Exp}(\lambda)$ variable has mean $1/\lambda$.
        feedback: >
          $1/15$ hour, which is $4$ minutes.

      - part: The clock after an arrival
        ask: >
          The first message lands at 10:03. What is the probability that the
          next one takes more than $8$ further minutes, that is, nothing from
          10:03 to 10:11?
        choices:
          - text: >
              Less than $e^{-2}$: three minutes have already been used up, so
              a long further wait is less likely.
            feedback: >
              The three minutes before 10:03 are a different window. Nothing
              about the window that follows depends on how long the first wait
              took.
          - text: >
              It cannot be computed: 10:03 was picked by the process itself, so
              the window after it is not an ordinary window.
            feedback: >
              A fair worry, and it has an answer. Knowing the first message
              came at 10:03 is knowledge about $[0, 3]$ minutes only, and the
              window after it is disjoint from that.
          - text: >
              $e^{-2}$, exactly as before.
            correct: true
            feedback: >
              Right. The window from 10:03 to 10:11 is $8$ minutes long and
              disjoint from everything you conditioned on, so it holds a
              $\operatorname{Poisson}(2)$ count and is empty with chance
              $e^{-2}$.
        feedback: >
          The second gap has the same law as the first and does not care what
          the first was.
      - reflect: >
          Say precisely why learning "the first message came at 10:03" leaves
          the window from 10:03 to 10:11 untouched. Which axioms do the work?
        hint: >
          What part of the timeline does the event "first arrival at 10:03"
          describe?
        answer: >
          "First arrival at 10:03" is decided entirely by the process on
          $[0, 3]$ minutes: nothing before 10:03, something at 10:03. The
          window after it is disjoint, so independent increments make it
          independent of that information, and stationarity gives it the law
          of any $8$-minute window. The clock restarts at the arrival, and the
          same argument runs again after every later arrival.
      - teach: >
          That is the theorem. With $X_1 = T_1$ and $X_n = T_n - T_{n-1}$, the
          gaps of a rate-$\lambda$ Poisson process are independent and each is
          $\operatorname{Exp}(\lambda)$. The first gap is the count at zero;
          every later gap is the first gap of a restarted copy, and
          memorylessness is what makes each restart look identical. The
          converse holds too: lay down iid $\operatorname{Exp}(\lambda)$ gaps
          and the resulting count is a Poisson process of rate $\lambda$,
          which is how one is simulated.

      - part: Gaps are independent, times are not
        ask: >
          At $15$ messages per hour, what is the probability that a given gap
          is shorter than $2$ minutes? Give four decimals.
        expects: "0.3935"
        tolerance: 0.0005
        hint: >
          Two minutes is $1/30$ hour; use the exponential cdf.
        feedback: >
          $1 - e^{-15/30} = 1 - e^{-0.5} \approx 0.3935$. Two in five gaps are
          under half the mean gap.
      - ask: >
          Are the arrival times $T_1$ and $T_2$ independent?
        choices:
          - text: >
              Yes: the theorem says the process restarts at every arrival.
            feedback: >
              The restart makes the *gaps* independent. $T_2 = T_1 + X_2$
              contains $T_1$ itself, so a late first arrival forces a late
              second one.
          - text: >
              No: $T_2 = T_1 + X_2$, so $T_2$ moves with $T_1$.
            correct: true
            feedback: >
              Right. Arrival times are partial sums of independent gaps, and
              partial sums sharing terms are dependent.
          - text: >
              No: $T_1$ and $T_2$ are dependent because $X_1$ and $X_2$ are.
            feedback: >
              The gaps are independent; that is the theorem. The dependence
              between times comes from the shared term $X_1$, not from any
              link between gaps.
        feedback: >
          Keep the two straight: gaps independent, times cumulative and
          dependent.
      - ask: >
          Measuring in minutes, what is $\operatorname{Cov}(T_1, T_2)$?
        expects: "16"
        hint: >
          Expand $\operatorname{Cov}(X_1, X_1 + X_2)$.
        feedback: >
          $\operatorname{Cov}(X_1, X_1 + X_2) = \operatorname{Var}(X_1) + 0$,
          and an exponential with mean $4$ minutes has variance $4^{2} = 16$.
      - ask: >
          A different feed sends a message every $4$ minutes, give or take a
          few seconds of jitter. Its mean gap is $4$ minutes, the same as the
          client's. What is wrong with modelling it as a rate-$15$ Poisson
          process?
        choices:
          - text: >
              Nothing: a Poisson process is pinned down by its rate.
            feedback: >
              The rate is pinned down, but the feed is not Poisson. Under the
              model, $8$ quiet minutes happen with chance $e^{-2} \approx 0.135$;
              on this feed they essentially never happen.
          - text: >
              The gaps are nearly constant, not exponential, so the counts in
              windows are far less variable than Poisson.
            correct: true
            feedback: >
              Right. By the converse, a Poisson process *is* its iid
              exponential gaps. Gaps clustered at $4$ minutes give a
              near-timetable, and every Poisson calculation about it will be
              wrong.
          - text: >
              Only the first gap is wrong; the later gaps are exponential by the
              restart argument.
            feedback: >
              The restart argument uses the Poisson axioms, which this feed
              never satisfied. Its gaps are all near $4$ minutes, the first
              included.
        feedback: >
          "Time between events" in an interview is $\operatorname{Exp}(\lambda)$
          only when the process is Poisson; say so, with the one-line reason
          $\Pr(X_1 > t) = \Pr(N(t) = 0)$.
  - node: quant-processes.poisson.arrival-times
    hook: >
      "How long until the $n$-th arrival" and "how many arrivals by time
      $t$" sound like different questions, but the count–time duality makes
      them the exact same event stated two ways.
    explanation: >
      Since $T_n$ sums $n$ iid $\operatorname{Exp}(\lambda)$ gaps, its mean
      and variance follow from additivity alone — $\mathbb{E}[T_n] = n/
      \lambda$ and $\operatorname{Var}(T_n) = n/\lambda^{2}$ — with no
      distributional argument required, since means and variances of
      independent sums always add regardless of shape.

      The load-bearing idea is the duality itself: "the $n$-th arrival has
      occurred by $t$" and "at least $n$ arrivals have occurred by $t$" are
      literally the same event, $\{T_n \le t\} = \{N(t) \ge n\}$, because
      both describe exactly the same set of outcomes. That lets you read the
      Erlang cdf straight off the already-known Poisson pmf by summing tail
      probabilities, instead of integrating the Erlang density directly.

      This duality is a two-way tool: whenever a problem is awkward in one
      description — a messy sum of exponentials, or a Poisson tail sum —
      switch to the other side and the computation often collapses.
    worked: >
      Buses arrive at $\lambda = 3$ per hour. The $5$th bus is expected at
      $\mathbb{E}[T_5] = 5/3$ hour $= 100$ minutes. Using the duality,
      $\Pr(T_2 \le 1\text{ hour}) = \Pr(N(1) \ge 2) = 1 - e^{-3} - 3e^{-3} =
      1 - 4e^{-3} \approx 0.8009$.
    interview: >
      "Expected time to the $n$-th event" is answered with $n/\lambda$
      instantly; when asked for a probability like $\Pr(T_n \le t)$, naming
      the duality and switching to the Poisson tail sum is the fast, correct
      path.
    pitfalls: >
      Integrating the Erlang density directly to answer a duality question
      is needless work once $\{T_n \le t\} = \{N(t) \ge n\}$ is recognized.
      Mixing up which inequality direction matches which event — $T_n \le t$
      is "at least $n$," not "exactly $n$" — is the other common slip.
    recap: >
      $T_n$ is $\operatorname{Gamma}(n, \lambda)$ with mean $n/\lambda$, and
      $\{T_n \le t\} = \{N(t) \ge n\}$ converts between waiting-time and
      counting-process questions for free.
    dialogue:
      - part: Four fills before lunch
        teach: >
          A desk is working an order that completes on its fourth fill. Fills
          arrive as a Poisson process at $6$ per hour, starting now.
      - ask: >
          How long, in minutes, do you expect to wait for the fourth fill?
        expects: "40"
        hint: >
          The wait is a sum of four gaps; each has mean $1/\lambda$.
        feedback: >
          $T_4 = X_1 + X_2 + X_3 + X_4$, each gap with mean $1/6$ hour $= 10$
          minutes, so $\mathbb{E}[T_4] = 4/6$ hour $= 40$ minutes.
      - ask: >
          What is the standard deviation of that wait, in minutes?
        expects: "20"
        hint: >
          Variances of independent gaps add; an exponential's variance is its
          mean squared.
        feedback: >
          Each gap has variance $10^{2} = 100$ square minutes, and the four are
          independent, so $\operatorname{Var}(T_4) = 400$ and the standard
          deviation is $20$ minutes. In symbols,
          $\operatorname{Var}(T_n) = n/\lambda^{2}$.
      - ask: >
          A colleague writes $T_4 = 4X_1$ and reports a standard deviation of
          $40$ minutes. Where does that go wrong?
        choices:
          - text: >
              Nowhere: the four gaps have the same distribution, so their sum
              is four times one of them.
            feedback: >
              Same distribution is not same value. $4X_1$ bets everything on
              one draw; four independent gaps partly cancel, so the sum varies
              less: variance $4 \cdot 100$, not $16 \cdot 100$.
          - text: >
              It treats the four gaps as one gap repeated, which multiplies the
              variance by $16$ instead of $4$.
            correct: true
            feedback: >
              Right. Independent gaps add variances, giving $400$ and a
              standard deviation of $20$; one gap scaled by $4$ gives $1600$
              and $40$.
          - text: >
              The mean is wrong too: $4X_1$ has mean $160$ minutes.
            feedback: >
              $4X_1$ has mean $4 \cdot 10 = 40$, the right mean. Only the
              spread is wrong, which is why this slip survives a sanity check
              on the mean.
        feedback: >
          Means of sums need nothing; variances of sums need independence, and
          the gaps have it.

      - part: The probability the integral hides
        teach: >
          The desk now wants the chance the fourth fill comes within the first
          $30$ minutes. $T_4$ has density $\lambda^{4} t^{3} e^{-\lambda t}/3!$,
          and integrating that from $0$ to $1/2$ hour takes three rounds of
          integration by parts.
      - reflect: >
          Before integrating anything: say the event "the fourth fill has come
          by minute $30$" in terms of the number of fills by minute $30$.
        hint: >
          If the fourth fill has come, how many fills have there been?
        answer: >
          The fourth fill has come by minute $30$ exactly when at least four
          fills have happened by minute $30$. So
          $\{T_4 \le 1/2\} = \{N(1/2) \ge 4\}$: the same set of outcomes,
          described once by a waiting time and once by a count. And the count
          is $\operatorname{Poisson}(3)$, whose pmf you already have.
      - ask: >
          So what is the probability the fourth fill comes within $30$
          minutes? Give four decimals.
        expects: "0.3528"
        tolerance: 0.0005
        hint: >
          One minus the chance of $0$, $1$, $2$ or $3$ fills, with mean $3$.
        feedback: >
          $\Pr(N(1/2) \ge 4) = 1 - e^{-3}(1 + 3 + 9/2 + 27/6)
          = 1 - 13e^{-3} \approx 0.3528$. No integral needed.
      - teach: >
          That is the count–time duality. The $n$-th arrival time
          $T_n$ is a sum of $n$ iid $\operatorname{Exp}(\lambda)$ gaps, an
          Erlang (Gamma) variable with mean $n/\lambda$ and variance
          $n/\lambda^{2}$, and $\{T_n \le t\} = \{N(t) \ge n\}$ because both
          sides describe the same outcomes. Read right to left, it hands over
          the Erlang cdf as a Poisson tail:
          $\Pr(T_n \le t) = 1 - \sum_{k=0}^{n-1} e^{-\lambda t}(\lambda t)^{k}/k!$.

      - part: Reading it in both directions
        ask: >
          Which event is the same as "the fourth fill has *not* come by minute
          $30$"?
        choices:
          - text: >
              $\{N(1/2) < 3\}$
            feedback: >
              That leaves out the outcomes with exactly three fills, where the
              fourth has still not come. Off by one.
          - text: >
              $\{N(1/2) = 3\}$
            feedback: >
              Three fills is one way for the fourth not to have come, but so is
              zero, one or two. "Not yet" is a whole tail, not one value.
          - text: >
              $\{N(1/2) \le 3\}$
            correct: true
            feedback: >
              Right: the complement of $\{N(1/2) \ge 4\}$. Its probability is
              $13e^{-3} \approx 0.6472$.
        feedback: >
          The duality flips cleanly: $\{T_n > t\} = \{N(t) \le n - 1\}$. Most
          slips here are off by one, so write the event before the number.
      - ask: >
          Same desk, same rate. What is the probability that the *second* fill
          has not arrived by minute $20$? Give four decimals.
        expects: "0.4060"
        tolerance: 0.0005
        hint: >
          Turn it into "at most one fill in $20$ minutes", and find the mean.
        feedback: >
          $\{T_2 > 1/3\} = \{N(1/3) \le 1\}$ with mean $6/3 = 2$, so the
          chance is $e^{-2}(1 + 2) = 3e^{-2} \approx 0.4060$.
      - ask: >
          What is $\Pr(T_3 \le t) - \Pr(T_4 \le t)$?
        choices:
          - text: >
              $\Pr(N(t) = 3)$
            correct: true
            feedback: >
              Right. $\{T_3 \le t\} = \{N(t) \ge 3\}$ contains
              $\{T_4 \le t\} = \{N(t) \ge 4\}$, and what is left over is
              exactly three arrivals by $t$.
          - text: >
              $\Pr(N(t) = 4)$
            feedback: >
              The difference consists of outcomes where the third arrival has
              come and the fourth has not, so there have been exactly three,
              not four.
          - text: >
              The density of the gap $X_4$ at $t$.
            feedback: >
              A difference of two cdfs at the same $t$ is a probability, not a
              density, and it concerns how many arrivals there have been by $t$,
              not how long the fourth gap is.
        feedback: >
          "The third has come and the fourth has not" is "exactly three by
          $t$": the duality turns differences of waiting-time cdfs into single
          Poisson probabilities.
      - teach: >
          In an interview, "how long until the $n$-th event" gets $n/\lambda$
          at once, and "what is the chance the $n$-th event comes by $t$" gets
          the duality named aloud, followed by a short Poisson tail sum rather
          than an integral.
  - node: quant-processes.poisson.fresh-start
    hook: >
      "It's been ten minutes since the last one — surely it's due" is the
      gambler's fallacy restated for a Poisson process, and this property is
      exactly why the reasoning is wrong.
    explanation: >
      The interarrival result already shows the process restarts
      identically right after an arrival; fresh start says the restart
      happens at any fixed time you pick, arrival or not, and moreover at
      any stopping time — a moment defined only by what has happened so far,
      like "the third arrival" or "the first time the count hits $k$."
      Conditional on everything known up to that moment, the future is
      again a full, independent copy of the same Poisson process.

      The restriction to stopping times is the load-bearing subtlety: "the
      instant just before the next arrival" is defined by looking into the
      future, so it is not a stopping time, and the restart property does
      not apply there — which is exactly the setup behind the inspection
      paradox.

      Read operationally, this says an exponential clock never accumulates
      a head start: however long since the last arrival, the wait for the
      next one is a completely fresh $\operatorname{Exp}(\lambda)$ draw.
    worked: >
      A sensor logs pings at $\lambda = 0.2$ per minute. You check the log
      and see it has been $10$ minutes of silence. The expected further wait
      is still $1/\lambda = 5$ minutes, not less. $\Pr(\text{wait} > 3
      \text{ min}) = e^{-0.2 \cdot 3} = e^{-0.6} \approx 0.5488$, exactly
      what a fresh $\operatorname{Exp}(0.2)$ gives.
    interview: >
      "A component has run for $x$ hours without failing — how much longer
      on average" wants $1/\lambda$ immediately, with the reasoning stated
      as "the process restarts at any fixed time," not just the number.
    pitfalls: >
      Applying the restart property to a time chosen using hindsight — such
      as "just before the next arrival" — is invalid; that instant is not a
      stopping time. Assuming the property needs the process to restart at
      an arrival specifically, rather than at any fixed or stopping time, is
      an unnecessarily narrow reading.
    recap: >
      Conditional on the past up to any fixed time or stopping time, a
      Poisson process starts over as an independent, identical copy of
      itself — an arrival is never overdue.
    dialogue:
      - part: Three quiet days
        teach: >
          A thinly traded bond prints as a Poisson process at $2$ per day. It
          has not printed for $3$ days, and a colleague says it is due.
      - ask: >
          Looking forward from the start of those three days, what was the
          chance of a $3$-day drought? Give four decimals.
        expects: "0.0025"
        tolerance: 0.00005
        hint: >
          Three days at $2$ per day is a Poisson count with mean $6$.
        feedback: >
          $e^{-6} \approx 0.0025$. A drought this long was a one-in-four-hundred
          event, which is exactly why it feels like something must give.
      - ask: >
          Given the drought, how does the chance of a print in the next half
          day compare with $1 - e^{-1}$, the chance for any half day?
        choices:
          - text: >
              Higher: after a rare drought, a print is overdue.
            feedback: >
              Nothing in the model stores the drought. The next half day is a
              window disjoint from the last three days, so its count is
              $\operatorname{Poisson}(1)$ whatever those days held.
          - text: >
              Lower: three quiet days show the bond has gone quiet.
            feedback: >
              Inside the model the rate is known to be $2$ per day, and the
              drought changes nothing. Outside it, a drought is evidence the
              rate itself has fallen; that is a fair challenge to the model,
              not a calculation within it.
          - text: >
              The same.
            correct: true
            feedback: >
              Right. The next half day holds a $\operatorname{Poisson}(1)$
              count no matter what happened before it.
        feedback: >
          The past window and the future window are disjoint, and a Poisson
          process keeps no record across them.
      - ask: >
          So what is the chance of a print in the next half day? Give four
          decimals.
        expects: "0.6321"
        tolerance: 0.0005
        hint: >
          One minus the chance of an empty $\operatorname{Poisson}(1)$ window.
        feedback: >
          $1 - e^{-1} \approx 0.6321$, the same as on any half day.

      - part: Restarting the clock
        reflect: >
          You conditioned on more than a count: you know the whole history,
          including that the last print was exactly $3$ days ago. Why does no
          detail of that history change the process from now on?
        hint: >
          Every fact you know is about one part of the timeline. Which part?
        answer: >
          Everything you know, however detailed, is about the process on
          $[0, s]$, where $s$ is now. Every future window lies after $s$, so
          independent increments make the future independent of all of it,
          and stationarity gives the future the same law as a process starting
          fresh. The shifted process $u \mapsto N(s + u) - N(s)$ is a new
          rate-$2$ Poisson process, and the wait to the next print is
          $\operatorname{Exp}(2)$ however long the drought.
      - teach: >
          That is the fresh-start property, and it reaches further than fixed
          times. It also holds at a stopping time: a moment you can recognise
          when it arrives, using only what has happened so far, such as "the
          fifth print" or "the first time two prints land within an hour".
          It fails at a moment defined by looking ahead, such as "the instant
          just before the next print", because knowing you are there tells you
          something about the future.
      - ask: >
          At which of these moments does the restart *fail*?
        choices:
          - text: >
              Noon on Friday.
            feedback: >
              A fixed clock time uses no information at all. The process after
              noon is a fresh rate-$2$ process.
          - text: >
              The last print before Friday's close.
            correct: true
            feedback: >
              Right. You only know a print was the last one before the close
              once the close arrives with nothing further, so the moment is
              defined by the future. Standing there, you already know the next
              print is after the close.
          - text: >
              The moment of the fifth print of the week.
            feedback: >
              When the fifth print happens you know it is the fifth: that is a
              stopping time, and the process restarts there.
          - text: >
              The first time two prints land within an hour of each other.
            feedback: >
              You recognise this moment when the second of the pair prints,
              using only the past. It is a stopping time and the restart holds.
        feedback: >
          The test is whether you could stand at the moment and know you are
          there without peeking ahead.
      - ask: >
          Starting at the moment of the third print, how many days do you
          expect to wait for the fifth?
        expects: "1"
        hint: >
          The third print is a stopping time. What does the process look like
          after it?
        feedback: >
          The process restarts at the third print, so the fifth is the second
          arrival of a fresh rate-$2$ process: expected wait $2/2 = 1$ day.

      - part: Moments that know the future
        ask: >
          Take the stretch from the last print before Friday's close to the
          next print after it. Is its length $\operatorname{Exp}(2)$?
        choices:
          - text: >
              Yes: every gap of a Poisson process is $\operatorname{Exp}(2)$.
            feedback: >
              Every gap counted in order is. This one was chosen *because* it
              contains the close, and that selection tilts it toward long gaps.
          - text: >
              No: it must cover the rest of Friday after that print, so it is
              stretched by how it was chosen.
            correct: true
            feedback: >
              Right. The stretch is at least the time from that print to the
              close, plus a fresh $\operatorname{Exp}(2)$ wait after the close.
              The restart holds at the close, a fixed time, but not at the
              print before it.
          - text: >
              No: it is shorter than $\operatorname{Exp}(2)$, because a print
              just before the close leaves little room.
            feedback: >
              The print can be just before the close or long before it, and
              after the close the wait is a full fresh exponential. Picking a
              gap by where it sits in time favours long gaps, not short ones.
        feedback: >
          Fresh start is a statement about stopping times, and the gap that
          straddles a fixed moment is not one of them.
      - ask: >
          A component's lifetime is exponential with mean $2$ years. It has
          run for $5$ years. Under that model, how does its expected remaining
          life compare with a new one's?
        choices:
          - text: >
              Shorter: five years of wear have used part of it.
            feedback: >
              Wear is exactly what an exponential lifetime leaves out. Its
              failure chance per short stretch is the same at year $5$ as at
              year $0$.
          - text: >
              The same: $2$ years.
            correct: true
            feedback: >
              Right. As good as new until it dies: the remaining life is a fresh
              exponential with mean $2$ years.
          - text: >
              Longer: surviving five years proves it is a good unit.
            feedback: >
              That reasoning needs the units to differ, with the rate unknown.
              Within the model every unit has the same rate, so survival
              carries no information.
        feedback: >
          In an interview, "how much longer on average" after any amount of
          waiting is $1/\lambda$, said together with its reason: the process
          restarts at any fixed time.
  - node: quant-processes.poisson.superposition
    hook: >
      "What's the chance the next event from any of these several streams
      happens within $x$ minutes" collapses to a single rate the instant you
      recognize superposition.
    explanation: >
      Merging independent Poisson streams stays Poisson because the counts
      combine cleanly: for two independent streams, $\Pr(N_1(t) + N_2(t) =
      k) = \sum_{j=0}^{k} \Pr(N_1(t)=j)\Pr(N_2(t)=k-j)$. Substituting the
      Poisson pmfs, factoring out $e^{-(\lambda_1+\lambda_2)t}/k!$, and
      applying the binomial theorem to $\sum_j \binom{k}{j}(\lambda_1 t)^j
      (\lambda_2 t)^{k-j}$ collapses the sum to $((\lambda_1+\lambda_2)t)^k$
      — exactly the $\operatorname{Poisson}(\lambda_1+\lambda_2)$ pmf.
      Independent increments and stationarity survive the merge because each
      component already has them and the components don't interact.

      More than two streams merge the same way pairwise, so $k$ independent
      streams superpose to rate $\lambda_1 + \cdots + \lambda_k$.

      Independence is a real hypothesis, not bookkeeping: double-listing a
      single stream's arrivals also produces mean rate $2\lambda$, but the
      "arrivals" now come in coincident pairs and the merged process is not
      Poisson at all.
    worked: >
      Three independent order-flow feeds arrive at $4$, $6$, and $10$ per
      minute, total rate $20$ per minute. The wait for the next order from
      any feed is $\operatorname{Exp}(20)$, mean $3$ seconds, and the chance
      none arrives in the next $2$ seconds ($1/30$ minute) is $e^{-20/30} =
      e^{-2/3} \approx 0.5134$.
    interview: >
      "Merge $k$ independent Poisson streams" wants the summed rate stated
      immediately, and a sharp candidate flags that independence — not just
      matching means — is what makes the merge Poisson at all.
    pitfalls: >
      Assuming any two arrival streams with the same total rate merge the
      same way ignores that dependence between them can wreck the Poisson
      property entirely. Forgetting that "rates add" requires the summed
      rate, not an average, understates how fast the merged stream actually
      fires.
    recap: >
      Independent Poisson streams merge into a Poisson stream at the summed
      rate, so the wait for "the next of any type" uses $\lambda_1 + \cdots
      + \lambda_k$ directly.
    dialogue:
      - part: Three venues, one tape
        teach: >
          A stock prints on three venues, independently, each as a Poisson
          process: $6$, $9$ and $15$ prints per minute. You watch the
          consolidated tape, which shows every print from all three.
      - ask: >
          What is the probability that the tape shows nothing in the next $4$
          seconds? Give four decimals.
        expects: "0.1353"
        tolerance: 0.0005
        hint: >
          Each venue must be quiet. Find each venue's mean over $4$ seconds,
          then use independence.
        feedback: >
          Over $4$ seconds the means are $0.4$, $0.6$ and $1$, so the chance
          all three are quiet is $e^{-0.4} e^{-0.6} e^{-1} = e^{-2} \approx 0.1353$.
          The exponents added: the tape went quiet as if it ran at
          $30$ per minute.
      - ask: >
          Now the chance of exactly $2$ prints on the tape in those $4$
          seconds. Done venue by venue, you sum over every way to split the
          $2$ prints among the three venues. How many splits are there?
        expects: "6"
        hint: >
          Both on one venue (three ways), or one each on two venues.
        feedback: >
          $(2,0,0)$, $(0,2,0)$, $(0,0,2)$, $(1,1,0)$, $(1,0,1)$, $(0,1,1)$: six
          terms, each a product of three Poisson probabilities. For $5$ prints
          among ten venues it would be $2002$ terms.

      - part: Is the tape itself Poisson?
        reflect: >
          The empty-window answer came out as if the tape were a single stream
          at $30$ per minute. Make a guess about the tape as a whole, and say
          which facts about the venues would have to carry over for the guess
          to be right.
        hint: >
          A Poisson process is three clauses. Which ones does the tape need?
        answer: >
          Guess: the tape is a Poisson process at $6 + 9 + 15 = 30$ per minute.
          It needs three things. Its windows must be independent: a tape
          window is built from the venues' windows over the same stretch, and
          disjoint stretches of independent venues are independent. Its law
          must depend only on window length, which each venue already gives.
          And a window's tape count, a sum of independent Poisson counts, must
          itself be Poisson with the summed mean, which is the one thing to
          check.
      - ask: >
          Check that last fact on a small case. One stream has mean $1$ in a
          window and an independent one has mean $1$ too. Summing over the
          three splits, what is the probability their total is $2$? Give four
          decimals.
        expects: "0.2707"
        tolerance: 0.0005
        hint: >
          Splits $(2,0)$, $(1,1)$, $(0,2)$; each term is a product of two
          Poisson pmfs with mean $1$.
        feedback: >
          $e^{-1}\tfrac{1}{2} \cdot e^{-1} + e^{-1} \cdot e^{-1}
          + e^{-1} \cdot e^{-1}\tfrac{1}{2} = 2e^{-2} \approx 0.2707$, and the
          $\operatorname{Poisson}(2)$ pmf at $2$ is $e^{-2} \cdot 4/2 = 2e^{-2}$.
          They agree.
      - teach: >
          They always agree, and that is superposition. In general
          $\Pr(N_1 + N_2 = k) = \sum_{j} \Pr(N_1 = j)\Pr(N_2 = k - j)$; pull out
          $e^{-(\lambda_1 + \lambda_2)t}/k!$ and what remains is
          $\sum_j \binom{k}{j}(\lambda_1 t)^{j}(\lambda_2 t)^{k-j}
          = ((\lambda_1 + \lambda_2)t)^{k}$ by the binomial theorem. So
          independent Poisson processes of rates $\lambda_1, \dots, \lambda_k$
          merge into a Poisson process of rate $\lambda_1 + \cdots + \lambda_k$,
          and every Poisson fact applies to the merged stream directly.
      - ask: >
          Back to the tape. What is the probability of at least $3$ prints in
          the next $4$ seconds? Give four decimals.
        expects: "0.3233"
        tolerance: 0.0005
        hint: >
          The tape count is $\operatorname{Poisson}(2)$; subtract the chances of
          $0$, $1$ and $2$.
        feedback: >
          $1 - e^{-2}(1 + 2 + 2) = 1 - 5e^{-2} \approx 0.3233$. One Poisson
          tail, no splits.
      - ask: >
          What is the expected wait, in seconds, for the next print on the
          tape?
        expects: "2"
        hint: >
          The tape's gaps are exponential at the merged rate.
        feedback: >
          The tape is Poisson at $30$ per minute, so its gaps are
          $\operatorname{Exp}(30)$ with mean $1/30$ minute $= 2$ seconds.
      - ask: >
          Someone proposes the merged rate is the average, $10$ per minute,
          "since a print comes from one venue at a time". What is the flaw?
        choices:
          - text: >
              None: each print belongs to one venue, so the tape runs at a
              typical venue's pace.
            feedback: >
              In any minute the tape shows every venue's prints, about
              $6 + 9 + 15 = 30$ of them on average. Averaging rates would lose
              two thirds of them.
          - text: >
              Rates add because expected counts add: the tape's expected count
              in a minute is the sum of the venues'.
            correct: true
            feedback: >
              Right. Expected counts add for any streams, independent or not;
              independence is what makes the merged stream Poisson as well.
          - text: >
              The merged rate is the fastest venue's, $15$ per minute, since
              that venue dominates the tape.
            feedback: >
              The slower venues still print, and their prints appear on the
              tape too. The fastest venue alone gives $15$, not $30$.
        feedback: >
          The rate of a merge is never in doubt. Whether the merge is Poisson
          is the real question, and the next case is where it fails.

      - part: When the merge stops being Poisson
        ask: >
          Two data vendors each relay every print from the $6$-per-minute
          venue, and you merge their feeds without deduplicating. The merged
          feed averages $12$ entries per minute. Is it a Poisson process of
          rate $12$?
        choices:
          - text: >
              Yes: each vendor's feed is Poisson at $6$, and rates add.
            feedback: >
              Rates do add, and the mean of $12$ is right. But superposition
              needs the feeds to be independent, and these two are the same
              feed copied.
          - text: >
              Yes, provided the two vendors' clocks are slightly out of sync.
            feedback: >
              A small lag turns each coincident pair into two entries a moment
              apart, still a pair that a Poisson process would almost never
              produce. The entries in a window are still essentially
              $2 \cdot \operatorname{Poisson}(\mu)$.
          - text: >
              No: entries come in coincident pairs, so a window's count is
              always even and has variance twice its mean.
            correct: true
            feedback: >
              Right. In $4$ seconds the count is
              $2 \cdot \operatorname{Poisson}(0.4)$: mean $0.8$, variance
              $4 \cdot 0.4 = 1.6$. A Poisson count with mean $0.8$ has variance
              $0.8$.
        feedback: >
          Independence of the components is a hypothesis, not bookkeeping: the
          right mean and the wrong process can coexist. In an interview, state
          the summed rate and say in the same breath that the streams are
          independent.
  - node: quant-processes.poisson.thinning
    hook: >
      Splitting one stream into independent sub-streams by an independent
      coin flip per arrival is the move behind "buy vs. sell prints" and
      "escalated vs. resolved tickets" questions alike.
    explanation: >
      Condition on $N(t) = n$: since each of the $n$ arrivals is labeled
      type $i$ independently with probability $p_i$, the type-$i$ count
      given $N(t)=n$ is $\operatorname{Binomial}(n, p_i)$. Unconditioning
      over $N(t) \sim \operatorname{Poisson}(\lambda t)$ and simplifying —
      the sum over the number of other-type arrivals, with its
      $(1-p_i)^{m}$ factors, totals $e^{\lambda t(1-p_i)}$, which cancels
      that much of the $e^{-\lambda t}$ — leaves exactly $\Pr(N_i(t)=k) =
      e^{-\lambda p_i t}(\lambda p_i t)^k / k!$: a clean
      $\operatorname{Poisson}(\lambda p_i)$ process.

      The surprising part is independence across types. For two types, the
      joint pmf $\Pr(N_1(t)=j, N_2(t)=k) = \Pr(N(t)=j+k)\binom{j+k}{j}p^j
      (1-p)^k$ factors, term for term, into the product of the two marginal
      Poisson pmfs — so learning the type-$1$ count tells you nothing about
      the type-$2$ count, even though the two together determine the total.

      This independence is fragile: it depends on the total being Poisson,
      and on the labels being independent of everything else, including the
      arrival times.
    worked: >
      Calls arrive at $50$ per hour, and $30\%$ independently escalate to
      tier $2$, giving a tier-$2$ rate of $15$ per hour. Over a $12$-minute
      window ($0.2$ hour), the mean tier-$2$ count is $3$, so $\Pr(N=2) =
      e^{-3} \cdot 9/2 \approx 0.2240$.
    interview: >
      "Split a Poisson stream by an independent coin flip" wants both
      pieces named — each part is Poisson at the scaled rate, and the parts
      are mutually independent — since the independence claim is what
      interviewers probe hardest.
    pitfalls: >
      Letting the label depend on arrival time or on other arrivals breaks
      the whole result; the labels must be iid and independent of the
      process. Treating the type-$i$ rate as $\lambda$ instead of $\lambda
      p_i$ when computing a window probability silently overcounts.
    recap: >
      Coin-flip labelling splits a Poisson process into mutually independent
      Poisson processes at rates $\lambda p_i$, an independence that is
      special to a Poisson total.
    dialogue:
      - part: Who walks in, and who buys
        teach: >
          Customers enter a shop as a Poisson process at $10$ per hour. Each
          one, independently of everything else, buys something with
          probability $0.4$ and otherwise only browses.
      - ask: >
          What is the probability that nobody buys in a given hour? Give four
          decimals.
        expects: "0.0183"
        tolerance: 0.0005
        hint: >
          Condition on $n$ customers walking in: all $n$ must browse. Then sum
          over $n$, and recognise the series for $e^{x}$.
        feedback: >
          $\sum_{n \ge 0} e^{-10}\tfrac{10^{n}}{n!}(0.6)^{n}
          = e^{-10} e^{6} = e^{-4} \approx 0.0183$. The browsing chance folded
          into the exponent.
      - ask: >
          $e^{-4}$ is the chance an empty window gets from one distribution in
          particular. What does that suggest about the number of buyers in an
          hour?
        choices:
          - text: >
              It is $\operatorname{Binomial}(10, 0.4)$: ten customers, each
              buying with chance $0.4$.
            feedback: >
              Ten is only the average number of customers. A binomial needs a
              fixed number of trials, and its chance of zero buyers would be
              $0.6^{10} \approx 0.006$, not $e^{-4} \approx 0.018$.
          - text: >
              It is $\operatorname{Poisson}(4)$.
            correct: true
            feedback: >
              Right. A $\operatorname{Poisson}(4)$ count is $0$ with chance
              $e^{-4}$, and the same series computation at any $k$ returns
              $e^{-4}4^{k}/k!$.
          - text: >
              It is not Poisson: discarding browsers removes some of the
              randomness.
            feedback: >
              Discarding adds randomness, if anything: on top of how many walk
              in, there is now who buys. The result is still Poisson, at a
              smaller mean.
        feedback: >
          Buyers arrive at $10 \cdot 0.4 = 4$ per hour, browsers at $6$. The
          surprising part is how the two streams relate.

      - part: Do buyers and browsers know about each other?
        ask: >
          In a given hour, how are the number of buyers and the number of
          browsers related?
        choices:
          - text: >
              Negatively dependent: they share one total, so more of one leaves
              room for fewer of the other.
            feedback: >
              That is the right instinct for a *fixed* total. Here the total is
              not fixed, and a big buyer count is partly evidence that more
              customers came in, which pushes the other way.
          - text: >
              Independent.
            correct: true
            feedback: >
              Right, and it is not obvious. Two opposite effects cancel exactly,
              and only because the total is Poisson.
          - text: >
              Positively dependent: a busy hour raises both.
            feedback: >
              With a fixed rate there are no busy hours in the sense of a
              higher rate, only lucky ones. And within a lucky hour, a big
              buyer count leaves less of the total for browsers, which pushes
              the other way.
        feedback: >
          Learning the buyer count tells you nothing about the browser count,
          even though the two add up to the total.
      - reflect: >
          Name the two effects of learning "many buyers this hour" on your
          forecast of browsers, and say why they could cancel exactly here.
        hint: >
          One works through the total, one through the split of a given total.
        answer: >
          Many buyers is evidence that more customers came in, which raises the
          browser forecast. But for a given total, more buyers means fewer
          browsers, which lowers it. With a Poisson total these two cancel
          exactly. Algebraically, the joint pmf
          $\Pr(N = j + k)\binom{j+k}{j}p^{j}(1-p)^{k}$ splits as
          $e^{-\lambda p}(\lambda p)^{j}/j! \cdot e^{-\lambda(1-p)}(\lambda(1-p))^{k}/k!$,
          because $e^{-\lambda}\lambda^{j+k}$ and $(j+k)!$ come apart into the
          two factors.
      - ask: >
          Check it on numbers. What is the probability of exactly $1$ buyer and
          exactly $2$ browsers in an hour? Give four decimals.
        expects: "0.0033"
        tolerance: 0.00005
        hint: >
          Three customers, then choose which one buys.
        feedback: >
          $\Pr(N = 3) \cdot 3(0.4)(0.6)^{2} = e^{-10}\tfrac{1000}{6} \cdot 0.432
          = 72e^{-10} \approx 0.0033$. The product of the marginals is
          $4e^{-4} \cdot 18e^{-6} = 72e^{-10}$, the same number.
      - teach: >
          That is thinning. Label each arrival of a rate-$\lambda$ Poisson
          process as type $i$ with probability $p_i$, independently of the
          other labels and of the arrival times. Then the type-$i$ arrivals
          form a Poisson process of rate $\lambda p_i$, and the type processes
          are mutually independent. The rates are the easy part; the
          independence is what interviewers probe.

      - part: Where the split stops being clean
        ask: >
          Suppose instead you are told exactly $10$ customers came in this
          hour. What is $\operatorname{Cov}(B, R)$, buyers against browsers?
        expects: "-2.4"
        hint: >
          With $10$ fixed, $R = 10 - B$ and $B$ is binomial.
        feedback: >
          $\operatorname{Cov}(B, 10 - B) = -\operatorname{Var}(B)
          = -10(0.4)(0.6) = -2.4$. A fixed total makes them perfectly
          negatively dependent; independence needs the total to be Poisson.
      - ask: >
          Now suppose evening customers are more likely to buy than morning
          ones, while arrivals stay Poisson at $10$ per hour. What happens to
          the buyer stream?
        choices:
          - text: >
              Nothing: it is still Poisson at $4$ per hour, since the average
              buying chance is unchanged.
            feedback: >
              An evening hour now has more expected buyers than a morning hour,
              so the buyer stream's law depends on where a window sits. That is
              stationarity failing.
          - text: >
              Buyer counts are no longer Poisson at all.
            feedback: >
              Each customer is still labelled independently, so a window's
              buyer count is still Poisson. Its mean, though, depends on the
              time of day.
          - text: >
              It has a rate that follows the clock, so it is no longer a
              Poisson process with a single rate.
            correct: true
            feedback: >
              Right. Labels that depend on arrival time keep the counts Poisson
              but break stationarity, so "rate $\lambda p$" no longer
              describes the stream.
        feedback: >
          The hypothesis that labels are independent of arrival times is
          doing real work.
      - ask: >
          Arrivals stay Poisson at $10$ per hour, but now half the time a
          customer simply copies the choice of whoever walked in just before.
          Each customer still buys with probability $0.4$ overall. Which part
          of the thinning result fails?
        choices:
          - text: >
              The labels are no longer independent of one another, so buyers
              come in runs and the buyer stream is not Poisson.
            correct: true
            feedback: >
              Right. A buyer now makes the next customer more likely to buy, so
              buyers bunch beyond what independent labels produce, and a
              buyer window carries information about the next one.
          - text: >
              Only the rate, which is no longer $10 \cdot 0.4 = 4$ per hour.
            feedback: >
              Each customer still buys with chance $0.4$, so buyers still
              average $4$ per hour. The rate is fine; the runs are not.
          - text: >
              Nothing: each customer still buys with probability $0.4$.
            feedback: >
              The marginal chance is unchanged, but thinning needs the labels
              independent of each other, and copied labels move together.
        feedback: >
          Thinning needs independent labels, independent of the clock, on a
          Poisson stream. Drop any one and the clean split goes.
  - node: quant-processes.poisson.thinning-example
    hook: >
      This is the template for any "arrivals of one type, split by an
      independent attribute" interview question — recognize the split,
      apply the scaled rate, and every downstream count or wait falls out.
    explanation: >
      The pattern to internalize: once an attribute of each arrival
      (buy/sell, escalated/resolved, in-the-money/out) is independent of
      arrival timing and of other arrivals, thinning applies immediately —
      no need to track the original stream at all once you're asking about
      one side.

      That means questions about counts, waits, and probabilities within a
      single side reduce to ordinary single-rate Poisson computations at the
      scaled rate, exactly as if that side had always been its own
      independent process. Cross-side questions — "how many of each" — stay
      independent too, so a large count on one side carries zero information
      about the other.

      The one thing to check before applying any of this is the independence
      assumption itself: if the attribute correlates with time of day or
      with nearby arrivals, as it typically does in real order flow, the
      thinned pieces are no longer Poisson and the shortcut breaks.
    worked: >
      A market maker's fills arrive at $450$ per hour, each independently at
      the bid with probability $0.6$. Bid fills form a
      $\operatorname{Poisson}(270)$-per-hour process, rate $4.5$ per minute.
      The chance of exactly $5$ bid fills in a given minute is $e^{-4.5}
      \cdot 4.5^{5}/5! \approx 0.1709$, and the expected wait for the next
      bid fill is $1/4.5$ minute $\approx 13.3$ seconds.
    interview: >
      "A stream splits by an independent attribute — find the rate of one
      side and the chance of $k$ in a window" is answered by scaling the
      rate first and then treating that side as an ordinary Poisson process,
      with no reference back to the original stream.
    pitfalls: >
      Forgetting to rescale the window when converting an hourly rate to a
      per-minute one is the most common arithmetic slip here. Assuming real
      order flow satisfies the independence hypothesis is a modeling error
      worth flagging explicitly in an interview answer.
    recap: >
      Once a per-arrival attribute is independent of timing, thinning turns
      "one side of a split stream" into an ordinary Poisson process at the
      scaled rate, with no need to track the other side.
    dialogue:
      - part: Splitting the tape
        teach: >
          A tape prints as a Poisson process at $240$ per hour, and each print
          is independently a buy with probability $0.75$, otherwise a sell.
          The questions come per minute.
      - ask: >
          At what rate, in prints per minute, do buys arrive?
        expects: "3"
        hint: >
          Thin first, then convert the hour into minutes.
        feedback: >
          $240 \cdot 0.75 = 180$ buys per hour, which is $3$ per minute. Sells
          run at $60$ per hour, $1$ per minute, and by thinning the two streams
          are independent Poisson processes.
      - ask: >
          What is the probability of at least $2$ sell prints in a given
          minute? Give four decimals.
        expects: "0.2642"
        tolerance: 0.0005
        hint: >
          Sells in a minute are $\operatorname{Poisson}(1)$; subtract the chances
          of $0$ and $1$.
        feedback: >
          $1 - e^{-1} - e^{-1} = 1 - 2e^{-1} \approx 0.2642$. Once the side is
          split off, the original tape never appears in the computation.
      - ask: >
          What is the expected wait, in seconds, for the next sell print?
        expects: "60"
        hint: >
          The sell stream's gaps are exponential at its own rate.
        feedback: >
          Sells are Poisson at $1$ per minute, so the wait is
          $\operatorname{Exp}(1)$ in minutes: mean $60$ seconds, however many
          buys print in the meantime.
      - ask: >
          What is the probability that no buy prints in the next $20$ seconds?
          Give four decimals.
        expects: "0.3679"
        tolerance: 0.0005
        hint: >
          Twenty seconds is a third of a minute.
        feedback: >
          The buy count over $1/3$ minute has mean $3 \cdot 1/3 = 1$, so the
          chance of none is $e^{-1} \approx 0.3679$.

      - part: One side tells you nothing about the other
        ask: >
          In the last minute buys came in a burst, well above $3$. A trader says
          sells must have been thin that same minute, since the buys took up
          the tape. What is the verdict?
        choices:
          - text: >
              Right: the minute's prints are shared, so a buy burst crowds out
              sells.
            feedback: >
              Crowding out needs a fixed number of prints to share. The total
              here is Poisson, and by thinning the buy and sell counts in a
              window are independent: the burst carries no information about
              sells.
          - text: >
              Wrong the other way: a buy burst means the whole tape was busy,
              so sells were probably heavy too.
            feedback: >
              The tape runs at a fixed $240$ per hour in this model, so there
              is no busy regime for a burst to reveal. The two effects you
              might expect cancel exactly, and the sell count stays
              $\operatorname{Poisson}(1)$.
          - text: >
              Wrong: under the model the sell count that minute is still
              $\operatorname{Poisson}(1)$, whatever the buys did.
            correct: true
            feedback: >
              Right. Independence of the split streams is the whole content of
              thinning.
        feedback: >
          In an interview, saying "the buy and sell streams are independent, so
          the burst tells me nothing" is the sentence being listened for.
      - reflect: >
          Next you want the chance that the coming minute has no sell prints
          and exactly $3$ buy prints. One route goes through the whole tape;
          another never touches it. Describe the short route, and say what
          licenses it.
        hint: >
          What did thinning hand you about the two sides together?
        answer: >
          Treat each side as its own Poisson process and multiply: the chance
          of no sells at rate $1$ per minute times the chance of $3$ buys at
          rate $3$ per minute. The license is the independence half of
          thinning, which makes the joint probability factor. The long route
          asks for exactly $3$ prints on the whole tape and then all three
          being buys; it must give the same number.
      - ask: >
          What is the probability that the next minute has no sell prints and
          exactly $3$ buy prints? Give four decimals.
        expects: "0.0824"
        tolerance: 0.0005
        hint: >
          The two sides are independent; multiply their pmfs.
        feedback: >
          $e^{-1} \cdot e^{-3}3^{3}/3! = 4.5e^{-4} \approx 0.0824$. Through the
          total it is the chance of exactly $3$ prints, all buys:
          $e^{-4}\tfrac{4^{3}}{6} \cdot 0.75^{3} = 4.5e^{-4}$, the same number
          the long way round.

      - part: What the model leaves out
        ask: >
          A junior writes the chance of no sell print in the next minute as
          $e^{-60}$. What went wrong?
        choices:
          - text: >
              The hourly sell rate, $60$, was used as the mean for a one-minute
              window.
            correct: true
            feedback: >
              Right. The mean is rate times window length in the same units:
              $60 \cdot 1/60 = 1$, so the chance is $e^{-1} \approx 0.37$, not
              essentially zero.
          - text: >
              The junior should have used the buy rate, since buys dominate the
              tape.
            feedback: >
              The question is about sells, so the sell rate is right. The slip
              is in the units: $60$ per hour is $1$ per minute.
          - text: >
              Nothing: $60$ sells per hour makes a quiet minute essentially
              impossible.
            feedback: >
              One sell per minute on average leaves a quiet minute more than a
              third of the time. $e^{-60}$ is the chance of a quiet *hour*.
        feedback: >
          Convert the rate to the window's units before anything else; it is
          the commonest slip in tape questions.
      - ask: >
          On a real tape, buys tend to follow buys: a large order is worked as
          a run of prints on one side. Which hypothesis of the split does that
          break?
        choices:
          - text: >
              The total tape being Poisson, and nothing else.
            feedback: >
              Even if the tape's timing stayed Poisson, runs of same-side prints
              break something else: whether one print's side tells you about
              the next.
          - text: >
              That each print's side is independent of the other prints' sides.
            correct: true
            feedback: >
              Right. With runs, a buy makes the next print more likely a buy,
              so buys arrive in clumps and the two sides stop being
              independent Poisson streams.
          - text: >
              None: the long-run buy fraction is still $0.75$, which is all
              thinning uses.
            feedback: >
              Thinning uses more than the fraction: it needs the labels
              independent of each other and of the arrival times. Runs violate
              the first.
        feedback: >
          Real order flow is clustered and its side is autocorrelated, so this
          split is a baseline, not a description. Saying so unprompted is part
          of a strong answer.
  - node: quant-processes.poisson.rate-race
    hook: >
      "Two independent clocks are running — which fires first, and how many
      of one type happen before the other's first hit" is answered without a
      single integral once you see it as superposition plus thinning.
    explanation: >
      Superposition says the merged stream of both clocks is
      $\operatorname{Poisson}(\lambda_1+\lambda_2)$, so the time to the very
      next event of either type is $\operatorname{Exp}(\lambda_1+\lambda_2)$
      with no further work. Thinning then says each event of that merged
      stream is independently type $1$ with probability $\lambda_1/
      (\lambda_1+\lambda_2)$ — the winner's identity is a fair coin flip on
      each event, independent of when the event happens.

      Repeating that same coin flip event after event is what turns "number
      of type-$1$ events before the first type-$2$ event" into a geometric
      count on $\{0,1,2,\dots\}$: each trial is "type $1$" (failure, keep
      going) with probability $\lambda_1/(\lambda_1+\lambda_2)$ or "type $2$"
      (success, stop) with probability $\lambda_2/(\lambda_1+\lambda_2)$,
      giving mean $\lambda_1/\lambda_2$.

      The reasoning chains two earlier results rather than introducing new
      machinery — that's the intended shortcut here.
    worked: >
      With $\lambda_1 = 5$ and $\lambda_2 = 7$ per hour, the next event is
      type $1$ with probability $5/12 \approx 0.4167$, and the mean number
      of type-$1$ events before the first type-$2$ event is $5/7 \approx
      0.7143$. The chance at least $2$ type-$1$ events precede the first
      type-$2$ event is $(1-7/12)^2 = (5/12)^2 = 25/144 \approx 0.1736$.
    interview: >
      "Two independent Poisson clocks race — who wins and how long" wants
      $\lambda_i/(\lambda_1+\lambda_2)$ and $\operatorname{Exp}(\lambda_1+
      \lambda_2)$ stated together; naming superposition and thinning
      explicitly signals you see the structure, not just the formula.
    pitfalls: >
      Believing the winner's identity becomes less certain the longer the
      race runs is wrong — independence of the winning type from the
      winning time holds at every instant. Swapping which rate goes in the
      numerator of the geometric mean, $\lambda_1/\lambda_2$ versus $\lambda_2
      /\lambda_1$, flips which type is "counted."
    recap: >
      A race between independent Poisson clocks is superposition (the next
      event is $\operatorname{Exp}(\lambda_1+\lambda_2)$) plus thinning (the
      winner is type $i$ with probability $\lambda_i/\sum\lambda_j$) chained
      together.
    dialogue:
      - part: Two dealers, one race
        teach: >
          Two dealers stream quotes independently as Poisson processes: dealer
          A at $2$ per minute, dealer B at $6$ per minute. You want A to quote
          twice before B quotes at all.
      - ask: >
          First step: what is the probability that the very first quote comes
          from A?
        expects: "1/4"
        hint: >
          Each dealer's wait for a first quote is exponential. Which is
          smaller?
        feedback: >
          A's first wait is $\operatorname{Exp}(2)$ and B's is
          $\operatorname{Exp}(6)$, independent, and the smaller of two
          independent exponentials belongs to the first with probability
          $2/(2 + 6) = 1/4$.
      - ask: >
          A quotes first. What is the probability that A quotes again before B
          quotes at all?
        choices:
          - text: >
              Less than $1/4$: B's clock has been running the whole time, so B
              is now closer to quoting.
            feedback: >
              B's wait is exponential, and an exponential wait is memoryless:
              given B has not quoted yet, its remaining wait is a fresh
              $\operatorname{Exp}(6)$, however long it has already run.
          - text: >
              $1/4$ again.
            correct: true
            feedback: >
              Right. At A's quote, A's next gap is a fresh
              $\operatorname{Exp}(2)$ and, by memorylessness, B's remaining
              wait is a fresh $\operatorname{Exp}(6)$. The second race is an
              exact copy of the first.
          - text: >
              More than $1/4$: A has shown it is quoting quickly.
            feedback: >
              A's rate is fixed at $2$ per minute. A quick first quote is luck,
              not information, and A's next wait is a fresh
              $\operatorname{Exp}(2)$.
        feedback: >
          Each race restarts from scratch after every quote.
      - ask: >
          So what is the probability that A quotes twice before B quotes at
          all?
        expects: "1/16"
        hint: >
          Two independent races, each won by A with the same chance.
        feedback: >
          $(1/4)^{2} = 1/16$. No integral appeared, because each race was a
          restart of the last.

      - part: One stream, a coin on every quote
        reflect: >
          Find a way to see both dealers as a single stream of quotes, each
          carrying a label "A" or "B". What is that stream, how is each label
          chosen, and why does that make every label independent of the past
          and of the timing?
        hint: >
          Merge the dealers, then run the splitting result backwards.
        answer: >
          Merged, the quotes form a Poisson process at $2 + 6 = 8$ per minute,
          by superposition. Now take any rate-$8$ Poisson process and label
          each arrival "A" with probability $1/4$ by an independent coin:
          thinning says the A and B arrivals are independent Poisson processes
          at $2$ and $6$, which is exactly the pair of dealers. So the pair
          *is* a rate-$8$ stream with an independent $1/4$-coin on every quote,
          and a coin flip knows nothing about when it happens or what came
          before.
      - teach: >
          That is the rate race. With independent Poisson processes of rates
          $\lambda_1$ and $\lambda_2$, the next arrival overall comes after
          $\operatorname{Exp}(\lambda_1 + \lambda_2)$ time and is type 1 with
          probability $\lambda_1/(\lambda_1 + \lambda_2)$, independent of when
          it comes and of everything before. Superposition gives the time,
          thinning gives the label.
      - ask: >
          The first quote of the day arrives within $2$ seconds of the open,
          unusually fast. What is now the probability it came from A?
        choices:
          - text: >
              Below $1/4$: a fast quote probably came from the fast dealer, B.
            feedback: >
              It feels right, and it is the classic slip. The label is a coin
              flipped independently of the merged stream's timing, so the time
              of the first quote carries no information about who sent it.
          - text: >
              It cannot be known without the joint density of the two waits.
            feedback: >
              It can, and the answer is clean: winner and winning time are
              independent, so conditioning on the time changes nothing.
          - text: >
              Still $1/4$.
            correct: true
            feedback: >
              Right. For exponential clocks, who wins is independent of when
              the race ends, so a fast finish says nothing about the winner.
        feedback: >
          The independence of label and time is the surprising half of the
          result, and the one interviewers probe.

      - part: Counting A's before the first B
        ask: >
          What is the expected number of A quotes before B's first quote?
        expects: "1/3"
        hint: >
          Each quote is A with chance $1/4$, independently; you stop at the
          first B.
        feedback: >
          The count of A's before the first B is geometric on
          $\{0, 1, 2, \dots\}$ with stopping chance $3/4$, so its mean is
          $(1/4)/(3/4) = 1/3$, which is $\lambda_1/\lambda_2 = 2/6$.
      - ask: >
          What is the probability of exactly one A quote before B's first
          quote?
        expects: "3/16"
        hint: >
          An A, then a B.
        feedback: >
          $(1/4)(3/4) = 3/16$.
      - ask: >
          How many seconds, on average, until the first quote from either
          dealer?
        expects: "7.5"
        hint: >
          The merged stream's rate.
        feedback: >
          The merged stream runs at $8$ per minute, so the first quote comes
          after $\operatorname{Exp}(8)$ minutes, mean $60/8 = 7.5$ seconds.

      - part: When the coin stops being fair
        ask: >
          Now suppose B quotes on a fixed timer, every $10$ seconds exactly,
          while A stays Poisson at $2$ per minute. Is the next quote still from
          A with a fixed probability?
        choices:
          - text: >
              Yes, $2/8$: the average rates are unchanged.
            feedback: >
              The average rates match, but B is no longer Poisson, so the merged
              stream is not a thinned Poisson process and the coin argument
              does not apply.
          - text: >
              No: the chance depends on how long it has been since B's last
              quote.
            correct: true
            feedback: >
              Right. Just after B quotes, A has a full $10$ seconds and wins
              with chance $1 - e^{-2/6} \approx 0.28$; with $1$ second to go,
              A wins with chance $1 - e^{-2/60} \approx 0.03$. B's timer has a
              memory, so the label is no longer an independent coin.
          - text: >
              No: A now never wins, since B quotes so regularly.
            feedback: >
              A still gets in whenever its exponential wait beats B's remaining
              time, which happens often just after B quotes.
        feedback: >
          The race result needs both clocks memoryless. In an interview, name
          superposition for the time and thinning for the label, and the
          answer comes out as $\lambda_i/\sum_j \lambda_j$ with no integral.
  - node: quant-processes.poisson.conditional-uniformity
    hook: >
      "Given that $n$ events happened in this window, where are they" is
      answered by forgetting the rate entirely and treating the arrivals as
      $n$ points dropped uniformly at random.
    explanation: >
      Chop $[0,t]$ into $m$ tiny equal slots. Each slot independently holds
      an arrival with probability roughly $\lambda t/m$ — the same
      probability for every slot, by stationarity — so conditional on
      exactly $n$ of the $m$ slots being occupied, every one of the
      $\binom{m}{n}$ ways to choose which $n$ slots is equally likely; that
      is uniform placement. Letting $m \to \infty$ turns the discrete slots
      into $n$ iid $\operatorname{Uniform}(0,t)$ points, and the rate
      $\lambda$ has canceled out of the argument entirely — it governed how
      many slots got picked, not which ones.

      The mean $\mathbb{E}[T_k \mid N(t)=n] = kt/(n+1)$ follows from a
      symmetry argument: $n$ uniform points split $[0,t]$ into $n+1$ gaps
      that are exchangeable and sum to $t$, so by symmetry each gap has
      mean $t/(n+1)$, and $T_k$ is exactly the sum of the first $k$ gaps.

      The binomial consequence is immediate once arrivals are uniform
      points: each of the $n$ points independently lands in a subinterval
      of length $s$ with probability $s/t$, so the count there given $N(t)=n$
      is $\operatorname{Binomial}(n, s/t)$.
    worked: >
      Emails arrive at $\lambda = 5$ per hour, and exactly $4$ arrive in a
      given hour. $\mathbb{E}[T_2 \mid N=4] = 2 \cdot 60/5 = 24$ minutes.
      Using the binomial consequence, $\Pr(N(20\text{ min})=1 \mid N(60
      \text{ min})=4) = \binom{4}{1}(1/3)(2/3)^3 = 32/81 \approx 0.3951$.
    interview: >
      "Given $n$ arrivals in $[0,t]$, describe their positions" wants
      "$n$ iid uniforms on $[0,t]$" stated immediately, with the observation
      that $\lambda$ has dropped out — a detail interviewers specifically
      check for.
    pitfalls: >
      Re-deriving with $\lambda$ still present, rather than recognizing it
      cancels, wastes time and usually introduces an error. Treating $T_1,
      \dots,T_n$ as independent, rather than as dependent order statistics
      with $T_1 < \cdots < T_n$, corrupts any joint computation.
    recap: >
      Given $N(t)=n$, the arrival times have exactly the law of $n$ iid
      uniform points on $[0,t]$ — the rate drops out, leaving pure geometry.
    dialogue:
      - part: One click, somewhere in the minute
        teach: >
          A Geiger counter clicks as a Poisson process at $3$ per minute. You
          are told that exactly one click happened in a particular one-minute
          window, and nothing else.
      - ask: >
          What is the probability that the click came in the first $15$
          seconds of that minute?
        expects: "1/4"
        hint: >
          Divide the chance of "one click in the first $15$ seconds and none in
          the other $45$" by the chance of "one click in the minute".
        feedback: >
          Disjoint windows are independent, so the numerator is
          $0.75e^{-0.75} \cdot e^{-2.25} = 0.75e^{-3}$, and the denominator is
          $3e^{-3}$. The ratio is $0.75/3 = 1/4$, the fraction of the minute
          that $15$ seconds covers.
      - ask: >
          Now a hotter source: the counter clicks at $30$ per minute, and again
          exactly one click happened in the minute. What is the chance it came
          in the first $15$ seconds?
        choices:
          - text: >
              Less than $1/4$: at a high rate a click should have come early,
              so a lone click is more likely late.
            feedback: >
              Redo the ratio at rate $30$: $7.5e^{-7.5}e^{-22.5}$ over
              $30e^{-30}$, which is $7.5/30 = 1/4$. The exponentials are
              identical top and bottom and cancel.
          - text: >
              Still $1/4$.
            correct: true
            feedback: >
              Right. With rate $\lambda$ the ratio is
              $(\lambda/4)e^{-\lambda}/(\lambda e^{-\lambda}) = 1/4$, so the
              rate cancels entirely.
          - text: >
              More than $1/4$: a fast counter clicks early.
            feedback: >
              A fast counter clicks *often*. Given that it clicked only once,
              the rate has nothing left to say about where: the ratio is
              $7.5e^{-30}/(30e^{-30}) = 1/4$.
        feedback: >
          Given the count, the rate drops out of where the click sits. The rate
          decides how many; it does not decide where.

      - part: Two clicks, and the pattern
        ask: >
          At any rate $\lambda$ per minute, you are told exactly $2$ clicks
          happened in a $10$-minute window. What is the probability both came
          in the first $5$ minutes?
        expects: "1/4"
        hint: >
          Same ratio: two in the first half and none in the second, over two
          in all ten minutes.
        feedback: >
          $\tfrac{e^{-5\lambda}(5\lambda)^{2}/2 \cdot e^{-5\lambda}}{e^{-10\lambda}(10\lambda)^{2}/2}
          = 25/100 = 1/4$, which is $(1/2)^{2}$: as if each click had
          independently picked a half with probability $1/2$.
      - reflect: >
          In both computations the rate cancelled, and the answer looked like
          independent uniform choices. Describe where $n$ clicks sit given
          that exactly $n$ landed in $[0, t]$, and give a reason the rate
          disappears.
        hint: >
          Chop $[0, t]$ into many tiny equal slots, each holding a click with
          the same small chance.
        answer: >
          They sit like $n$ independent uniform points on $[0, t]$, sorted.
          Chop $[0, t]$ into $m$ tiny slots: each holds a click independently
          with the same chance, so given exactly $n$ slots are occupied, every
          choice of $n$ slots out of $m$ is equally likely. That is uniform
          placement. The rate set how many slots got picked, and once you
          condition on that number it has nothing left to influence.
      - teach: >
          That is conditional uniformity. Given $N(t) = n$, the ordered arrival
          times $(T_1, \dots, T_n)$ have exactly the law of the order
          statistics of $n$ iid $\operatorname{Uniform}(0, t)$ variables. Two
          consequences do most of the work: $\mathbb{E}[T_k \mid N(t) = n]
          = kt/(n+1)$, and for $s < t$ the count in $[0, s]$ given
          $N(t) = n$ is $\operatorname{Binomial}(n, s/t)$, since each point
          lands there independently with probability $s/t$.

      - part: Sorted points, by hand
        ask: >
          Given exactly $2$ clicks in the $10$-minute window, are $T_1$ and
          $T_2$ independent $\operatorname{Uniform}(0, 10)$ variables?
        choices:
          - text: >
              Yes: the theorem says the clicks are independent uniforms.
            feedback: >
              The *unordered* clicks are. $T_1$ is the earlier of the two, so
              $T_1 < T_2$ always, and two independent uniforms would cross half
              the time.
          - text: >
              No: $T_1$ is uniform on $(0, 10)$ and $T_2$ is then uniform on
              $(T_1, 10)$.
            feedback: >
              $T_1$ is not uniform. It is the minimum of two uniforms, so it
              leans early: $\Pr(T_1 > x) = ((10 - x)/10)^{2}$, and its mean is
              $10/3$, not $5$.
          - text: >
              No: they are the sorted values of two independent uniforms, so
              they are dependent and neither is uniform.
            correct: true
            feedback: >
              Right. Independence belongs to the unlabelled points; sorting
              them creates the order statistics, with
              $\mathbb{E}[T_1] = 10/3$ and $\mathbb{E}[T_2] = 20/3$.
        feedback: >
          Keep the two pictures apart: unordered points are iid uniform, the
          ordered times are their order statistics.
      - ask: >
          Given exactly $4$ clicks in a $10$-minute window, what is the
          expected time, in minutes, of the third click?
        expects: "6"
        hint: >
          Four uniform points cut the window into five pieces of equal expected
          length.
        feedback: >
          $\mathbb{E}[T_3 \mid N(10) = 4] = 3 \cdot 10/5 = 6$ minutes: three of
          the five equal-mean pieces.
      - ask: >
          Given exactly $5$ clicks in an hour, what is the probability that
          none of them fell in the last $15$ minutes? Give an exact fraction.
        expects: "243/1024"
        hint: >
          Each of the five independently avoids the last quarter.
        feedback: >
          Each click avoids the last quarter of the hour with probability
          $3/4$, independently, so the answer is $(3/4)^{5} = 243/1024
          \approx 0.2373$. The rate never entered.

      - part: When the rate moves
        ask: >
          The source is moved closer halfway through a minute: the counter
          clicks at $3$ per minute in the first half and $6$ per minute in the
          second, with disjoint windows still independent and Poisson. Given
          exactly one click in the minute, what is the chance it came in the
          first half?
        expects: "1/3"
        hint: >
          Means $1.5$ and $3$ for the two halves; redo the ratio.
        feedback: >
          $\tfrac{1.5e^{-1.5} \cdot e^{-3}}{4.5e^{-4.5}} = 1.5/4.5 = 1/3$, not
          $1/2$. The exponentials still cancel, but the rate in front does not.
      - ask: >
          So which hypothesis was conditional uniformity quietly using?
        choices:
          - text: >
              Independent increments.
            feedback: >
              The moved source still has independent increments, and the ratio
              still factored over the two halves. Independence survived; the
              answer changed anyway.
          - text: >
              Stationarity: every slot of the window has the same chance of a
              click.
            correct: true
            feedback: >
              Right. With a moving rate, given the count the points are still
              independent, but spread in proportion to the rate: the second
              half carries $2/3$ of the weight.
          - text: >
              That the count is exactly one.
            feedback: >
              With any count $n$ the same thing happens: each point lands in
              the first half with chance $1/3$, independently. The size of $n$
              is not the issue.
        feedback: >
          In an interview, "given $n$ arrivals in $[0, t]$, where are they" is
          answered "$n$ iid uniforms, sorted", with the remark that $\lambda$
          has dropped out because the rate is constant.
  - node: quant-processes.poisson.uniformity-waiting
    hook: >
      Turning "given the count, arrivals are uniform" into an actual
      person-minutes or inventory number is a two-line calculation once you
      see it as a sum over order-statistic means.
    explanation: >
      Conditional on $N(t)=n$, each $\mathbb{E}[T_k \mid N(t)=n] = kt/(n+1)$
      is already known, so summing over $k=1,\dots,n$ gives the total
      conditional wait $\sum_k \mathbb{E}[T_k] = t/(n+1) \cdot n(n+1)/2 =
      nt/2$ — an arithmetic series, no new integration.

      A second, unconditional quantity is worth carrying separately: the
      aggregate time-in-system of everyone who arrives during $[0,t]$,
      measured up to $t$, is $\sum_i (t-T_i)$. Rather than condition on
      $N(t)$ and sum, treat each instant $ds$ as contributing $\lambda\,ds$
      expected arrivals in expectation, each worth $(t-s)$ of remaining
      time, and integrate directly: $\int_0^t \lambda(t-s)\,ds = \lambda
      t^2/2$ — the same trick used to add up contributions from a stream
      without ever conditioning on how many arrived.

      Both numbers use the same conditional-uniformity fact, just aggregated
      two different ways — one before unconditioning, one built to skip
      conditioning altogether.
    worked: >
      Packages arrive at $\lambda = 6$ per hour, and exactly $5$ arrive in a
      given hour. Given that, $\mathbb{E}[T_k \mid N=5] = 10k$ minutes for
      $k=1,\dots,5$, so the conditional total wait is $10(1+2+3+4+5) = 150$
      minutes. Unconditionally, the expected aggregate time-in-system over
      that hour is $\lambda t^2/2 = 6(1)^2/2 = 3$ hours $= 180$ minutes.
    interview: >
      "Total waiting time of everyone who shows up in $[0,t]$" is answered
      with $\lambda t^2/2$ directly, via the instant-by-instant integration
      argument rather than conditioning on $N(t)$ first.
    pitfalls: >
      Conflating the conditional total $nt/2$ (a fixed $n$) with the
      unconditional $\lambda t^2/2$ (which already averages over a random
      $N(t)$) answers the wrong question. Assuming $T_1,\dots,T_n$ can be
      summed as if independent, rather than as dependent order statistics
      that happen to have a simple mean, only works for first-moment
      questions, not variances.
    recap: >
      Given $n$ arrivals in $[0,t]$ their total waiting sums the
      order-statistic means to $nt/2$, while the unconditional aggregate
      time-in-system integrates directly to $\lambda t^2/2$.
    dialogue:
      - part: Four trucks in two hours
        teach: >
          Trucks reach a loading dock as a Poisson process. During a two-hour
          window exactly $4$ trucks arrived. A crew was on the dock from the
          start of the window, and for each truck it logged the time from the
          start until that truck arrived.
      - ask: >
          What is the expected arrival time, in minutes from the start, of the
          first truck?
        expects: "24"
        hint: >
          Four uniform points cut $120$ minutes into five pieces of equal
          expected length.
        feedback: >
          Given $N = 4$ the times are sorted uniforms on $[0, 120]$, so
          $\mathbb{E}[T_1] = 120/5 = 24$ minutes.
      - ask: >
          And the expected arrival time of the fourth truck?
        expects: "96"
        hint: >
          Four of the five pieces.
        feedback: >
          $\mathbb{E}[T_4] = 4 \cdot 120/5 = 96$ minutes. The last truck is not
          expected at the end of the window: a fifth of it is left over on
          average.
      - ask: >
          What is the expected total of the four logged times, in minutes?
        expects: "240"
        hint: >
          Add $\mathbb{E}[T_k] = 24k$ for $k = 1, \dots, 4$.
        feedback: >
          $24(1 + 2 + 3 + 4) = 240$ minutes. In general,
          $\tfrac{t}{n+1} \cdot \tfrac{n(n+1)}{2} = nt/2$.
      - reflect: >
          $240 = 4 \cdot 60$: each truck contributes, on average, half the
          window. Find a way to see that without any order statistics.
        hint: >
          Does the total care which truck was first?
        answer: >
          The total $T_1 + \cdots + T_4$ adds up the same four times however
          you label them, so it equals the sum of the *unordered* arrival
          times, and those are four independent uniforms on $[0, 120]$, each
          with mean $60$. Sorting only matters for questions about a
          particular truck, such as the first or the last; a symmetric total
          can be computed on the unsorted points.

      - part: Spread, not just mean
        ask: >
          Using the unsorted picture, what is the variance of the total of the
          four logged times, in square minutes?
        expects: "4800"
        hint: >
          A $\operatorname{Uniform}(0, t)$ variable has variance $t^{2}/12$.
        feedback: >
          Four independent uniforms on $[0, 120]$:
          $4 \cdot 120^{2}/12 = 4 \cdot 1200 = 4800$, a standard deviation of
          about $69$ minutes.
      - ask: >
          A colleague instead adds up the variances of $T_1, T_2, T_3, T_4$
          one by one and gets $1920$. Why is that too small?
        choices:
          - text: >
              It is not too small: the sorted times are four of the uniform
              points, so their variances add.
            feedback: >
              They are the same four points, but *as sorted*: $T_1$ is always
              the smallest, $T_4$ the largest. Each sorted time varies less
              than a raw uniform, and they move together, so their variances
              alone miss the covariances.
          - text: >
              The order statistics are positively correlated, and adding
              variances drops all the covariance terms.
            correct: true
            feedback: >
              Right. A late $T_1$ forces late $T_2$, $T_3$, $T_4$. The
              covariances make up the gap from $1920$ to $4800$; unsorting the
              sum handles them for free.
          - text: >
              The colleague should have used $\operatorname{Var}(T_k) = 120^{2}/12$
              for each, giving $4800$.
            feedback: >
              That reaches $4800$ by pretending each sorted time is a raw
              uniform, which none of them is: $T_1$ has variance $384$ square
              minutes, far below $1200$. The total comes out right only because
              it equals the unsorted sum.
        feedback: >
          Means of the sorted times can be added freely. For spread, unsort
          first.

      - part: Waiting without knowing the count
        teach: >
          Now a batch auction that clears at the end of a $30$-minute window.
          Orders arrive as a Poisson process at $10$ per hour, and each order
          waits from its arrival until the clear. Nobody tells you how many
          orders came.
      - ask: >
          What is the expected total waiting, in order-minutes, summed over
          all orders in the window?
        expects: "75"
        hint: >
          Condition on the count $n$: each order then waits $15$ minutes on
          average. Then average over $n$.
        feedback: >
          Given $n$ orders, each arrival time is uniform on $[0, 30]$, so each
          waits $15$ minutes on average and the total averages $15n$. The
          count has mean $10 \cdot 1/2 = 5$, so the answer is $15 \cdot 5 = 75$.
          The same number comes from integrating instant by instant:
          $\int_0^{30} \tfrac{1}{6}(30 - s)\,ds = \tfrac{1}{6} \cdot 450 = 75$,
          that is $\lambda t^{2}/2$ with $\lambda$ per minute.
      - ask: >
          The window doubles to $60$ minutes at the same rate. What is the
          expected total waiting now?
        expects: "300"
        hint: >
          $\lambda t^{2}/2$, or redo the conditioning.
        feedback: >
          $\tfrac{1}{6} \cdot 60^{2}/2 = 300$ order-minutes: four times as much,
          because twice as many orders each wait twice as long.
      - ask: >
          Back in the $30$-minute auction you learn that exactly $8$ orders
          came. A colleague still quotes $75$ order-minutes. What is the
          verdict?
        choices:
          - text: >
              Right: $75$ is the expected total, and the count does not change
              an expectation already computed.
            feedback: >
              $75$ averages over the unknown count. Once the count is known to
              be $8$, the total is $8$ uniform waits, each with mean $15$.
          - text: >
              Wrong: given $8$ orders, the expected total is $8 \cdot 15 = 120$.
            correct: true
            feedback: >
              Right. $nt/2$ answers the conditional question, $\lambda t^{2}/2$
              the unconditional one. They agree only when $n$ equals the
              expected count.
          - text: >
              Wrong: the total should be $8 \cdot 30 = 240$, since each order
              waits up to the clear.
            feedback: >
              Up to the clear, yes, but an order arriving at a uniform time
              waits $15$ minutes on average, not the full $30$.
        feedback: >
          Read the question for whether the count is given: $nt/2$ if it is,
          $\lambda t^{2}/2$ if it is not.
  - node: quant-processes.poisson.inspection-paradox
    hook: >
      Arriving at a random time and expecting to wait half the average gap
      is the single most common intuition failure this unit corrects —
      you wait the full average gap, every time.
    explanation: >
      Fix a clock time and apply the fresh-start property directly: the
      forward wait to the next arrival is $\operatorname{Exp}(\lambda)$,
      mean $1/\lambda$, regardless of how long it has been since the
      previous arrival — showing up "late" in a gap buys nothing. Running
      the same process backward from that fixed time is exactly as
      memoryless, so the elapsed time since the previous arrival is also
      $\operatorname{Exp}(\lambda)$, mean $1/\lambda$.

      The gap you land inside is the sum of those two pieces, forward plus
      backward, and since both are independent $\operatorname{Exp}(\lambda)$
      draws, that sum is $\operatorname{Gamma}(2,\lambda)$ with mean
      $2/\lambda$ — double the average gap $1/\lambda$ between consecutive
      arrivals in general.

      There's no contradiction: a fixed clock time is more likely to fall
      inside a long gap than a short one, so the gap you happen to land in
      is a biased sample of all the gaps, not a typical one.
    worked: >
      Buses run at $\lambda = 10$ per hour, mean gap $6$ minutes. Arriving
      at any fixed time, the wait for the next bus is $\operatorname{Exp}
      (10)$, so $\Pr(\text{wait} > 10 \text{ min}) = e^{-10/6} \approx
      0.1889$. The gap straddling your arrival has mean $2/10$ hour $=12$
      minutes; it exceeds $15$ minutes ($0.25$ hour) exactly when fewer than
      $2$ buses arrive in that $0.25$-hour window, so $\Pr(\text{that gap} >
      0.25) = \Pr(N(0.25) \le 1) = e^{-2.5}(1+2.5) \approx 0.2873$, read
      straight off the Poisson pmf.
    interview: >
      "You show up at a random time — how long do you wait for the bus, on
      average" wants $1/\lambda$ stated with the fresh-start justification,
      and a strong answer volunteers the doubled straddling-gap fact
      unprompted.
    pitfalls: >
      Assuming the wait shrinks because you might have "just missed" a bus
      confuses the forward wait with the backward one — both are full
      $\operatorname{Exp}(\lambda)$ draws, independent of each other.
      Reporting the straddling gap's mean as $1/\lambda$ instead of
      $2/\lambda$ conflates it with an ordinary gap.
    recap: >
      At any fixed time your wait for the next arrival averages the full
      $1/\lambda$, and the gap you land inside averages $2/\lambda$ — double
      an ordinary gap.
    dialogue:
      - part: Turning up at 8:37
        teach: >
          Buses reach a stop as a Poisson process at $3$ per hour and have been
          running since early morning, so the average gap between buses is
          $20$ minutes. You turn up at 8:37, a time that has nothing to do with
          the buses.
      - ask: >
          How long do you expect to wait for the next bus?
        choices:
          - text: >
              $10$ minutes: on average you land in the middle of a gap.
            feedback: >
              That would be right for a fixed timetable. Here the next bus is
              governed by the window after 8:37, which knows nothing about how
              the previous gap began: no bus in the next $w$ minutes has
              chance $e^{-w/20}$, an exponential with mean $20$.
          - text: >
              It depends on how long ago the last bus came, which you do not
              know.
            feedback: >
              Even if you knew, it would not matter: 8:37 is a fixed time, and
              by the fresh start the process after it ignores its history.
          - text: >
              $20$ minutes.
            correct: true
            feedback: >
              Right. From a fixed time the wait is a fresh
              $\operatorname{Exp}(3)$ in hours, mean $20$ minutes, the full
              average gap.
        feedback: >
          Showing up at a random time buys you nothing: you wait the whole
          average gap.
      - ask: >
          What is the probability you wait more than $30$ minutes? Give four
          decimals.
        expects: "0.2231"
        tolerance: 0.0005
        hint: >
          No bus in a half hour at $3$ per hour.
        feedback: >
          $e^{-3 \cdot 1/2} = e^{-1.5} \approx 0.2231$.
      - ask: >
          Now look back. How long, in minutes, do you expect it has been since
          the previous bus?
        expects: "20"
        hint: >
          "No bus in the last $b$ minutes" is an empty window ending at 8:37.
        feedback: >
          The chance of no bus in the $b$ minutes before 8:37 is $e^{-b/20}$,
          since that is just a window of length $b$. So the time back is also
          exponential with mean $20$ minutes, and it is independent of the
          wait ahead, which uses a disjoint window.

      - part: A forty-minute gap
        ask: >
          So what is the expected length, in minutes, of the gap you are
          standing in, from the previous bus to the next?
        expects: "40"
        hint: >
          Back plus ahead.
        feedback: >
          $20 + 20 = 40$ minutes: twice the average gap between buses.
      - reflect: >
          Both numbers are right: gaps average $20$ minutes, and the gap you
          land in averages $40$. How can that be?
        hint: >
          Picture a day of gaps, some short and some long, laid end to end on
          the clock. Where does a randomly chosen moment tend to fall?
        answer: >
          "A gap" listed in order is a typical gap, mean $20$. "The gap
          containing 8:37" is chosen by dropping a point on the clock, and a
          long gap covers more of the clock, so it is more likely to be hit.
          The gap you land in is sampled in proportion to its length, which
          pulls its mean up to $40$. No contradiction: two different ways of
          picking a gap.
      - teach: >
          That is the inspection paradox. For a Poisson process of rate
          $\lambda$, the wait from a fixed time is $\operatorname{Exp}(\lambda)$
          and so is the time back, independently, so the straddling gap is a
          sum of two exponentials with mean $2/\lambda$. Its density is
          $\lambda^{2}xe^{-\lambda x}$, the ordinary gap density
          $\lambda e^{-\lambda x}$ reweighted by the length $x$.

      - part: Checking the bias by hand
        ask: >
          A toy day: one gap of $10$ minutes, then one of $30$, so the average
          gap is $20$. You arrive at a uniformly random moment of those $40$
          minutes. What is the expected length of the gap you land in?
        expects: "25"
        hint: >
          You land in the $30$-minute gap with probability $30/40$.
        feedback: >
          $\tfrac{10}{40} \cdot 10 + \tfrac{30}{40} \cdot 30 = 2.5 + 22.5 = 25$
          minutes, not $20$. Weighting each gap by its own length is the whole
          mechanism; exponential gaps are just extreme enough to double it.
      - ask: >
          Back at the real stop at 8:37: what is the probability that the
          previous bus left more than $20$ minutes ago *and* the next is more
          than $20$ minutes away? Give four decimals.
        expects: "0.1353"
        tolerance: 0.0005
        hint: >
          Back and ahead are independent exponentials with mean $20$.
        feedback: >
          $e^{-1} \cdot e^{-1} = e^{-2} \approx 0.1353$. In about one visit in
          seven you sit inside a gap of over $40$ minutes this way alone.

      - part: When the past is cut short
        ask: >
          On a different route the buses only start at 8:30, as a Poisson
          process from then on at the same rate. You arrive at 8:37. What
          happens to the expected gap you land in, measured back to the last
          bus, or to 8:30 if none has come?
        choices:
          - text: >
              Still $40$ minutes: the process is the same Poisson process.
            feedback: >
              Ahead of you, yes: the wait is still a fresh exponential with
              mean $20$. But looking back you can never see more than $7$
              minutes, to the 8:30 start.
          - text: >
              It falls below $40$, because the time back is capped at $7$
              minutes.
            correct: true
            feedback: >
              Right. The look-back is $\min(B, 7)$ with $B$ exponential of mean
              $20$, whose mean is $20(1 - e^{-7/20}) \approx 5.9$, so the gap
              averages about $25.9$ minutes. The doubling needs a process that
              has been running long before you arrive.
          - text: >
              Exactly $20$: with a fresh start at 8:30 there is no bias.
            feedback: >
              The wait ahead still has mean $20$ by itself, and the gap also
              includes the stretch back to the last bus or to 8:30. The gap is
              shorter than $40$, but longer than $20$.
        feedback: >
          In an interview, "how long do you wait for the bus" gets $1/\lambda$
          with the fresh-start reason, and a strong answer adds unprompted that
          the gap you landed in averages $2/\lambda$.
  - node: quant-processes.poisson.length-bias
    hook: >
      Any statistic gathered by "sample a random point in time" rather than
      "list the items" — a queue length, a class size, a gap — is quietly
      biased toward the larger items, and this is the general form of the
      inspection paradox behind that bias.
    explanation: >
      The inspection paradox showed the exponential case: a fixed time is
      more likely to land in a long gap than a short one. The general
      version applies to any iid gaps with mean $\mathbb{E}[X]$ and any
      shape: an interval of length $x$ is over-represented in exact
      proportion to $x$ itself, since longer intervals occupy more of the
      timeline for a random point to fall into, giving the size-biased
      density $xf(x)/\mathbb{E}[X]$.

      The mean of that biased law is $\mathbb{E}[X^2]/\mathbb{E}[X]$, and
      writing $\mathbb{E}[X^2] = \operatorname{Var}(X) + \mathbb{E}[X]^2$
      splits it into $\mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$ —
      the ordinary mean plus a penalty driven entirely by variability. Zero
      variance (a deterministic timetable) means zero penalty; the more the
      gaps vary, the larger the bias.

      The same bias inflates the class size a randomly sampled student
      reports, since students in bigger classes are more likely to be the
      one you asked, and the queue length a randomly arriving customer sees
      versus a snapshot at a random arrival.
    worked: >
      Suppose gaps are iid, equal to $5$ minutes with probability $1/2$ and
      $25$ minutes with probability $1/2$, so $\mathbb{E}[X] = 15$ and
      $\mathbb{E}[X^2] = 0.5(25) + 0.5(625) = 325$, giving
      $\operatorname{Var}(X) = 325 - 225 = 100$. The size-biased mean is
      $15 + 100/15 \approx 21.67$ minutes — the interval a random time lands
      in averages nearly $7$ minutes longer than a randomly listed gap.
    interview: >
      "Why does the average class size reported by students exceed the
      school's true average class size" wants $\mathbb{E}[X] +
      \operatorname{Var}(X)/\mathbb{E}[X]$ named as the general mechanism,
      not just "because of buses."
    pitfalls: >
      Applying the exponential's specific "double the mean" shortcut to a
      non-exponential gap distribution is wrong in general; the correct
      penalty is $\operatorname{Var}(X)/\mathbb{E}[X]$, which only equals
      $\mathbb{E}[X]$ (giving the factor of two) for the exponential.
      Forgetting that a deterministic timetable has zero size-bias penalty
      is an easy sanity check to skip.
    recap: >
      Sampling by hitting an interval with a random point, rather than
      listing intervals, inflates the mean seen by $\operatorname{Var}(X)/
      \mathbb{E}[X]$ — pure variability is the whole penalty.
    dialogue:
      - part: A random share, a random trade
        teach: >
          A thin stock traded three times today: $100$ shares, $300$ shares
          and $1600$ shares, so the average trade was $2000/3 \approx 667$
          shares. Now pick one of the $2000$ shares traded today at random, and
          ask how big the trade it belonged to was.
      - ask: >
          Before computing: how does the expected size of that trade compare
          with $667$?
        choices:
          - text: >
              About the same: every trade is equally likely to be the one.
            feedback: >
              Every *share* is equally likely, not every trade. The $1600$-share
              trade holds $80\%$ of the shares, so it is the trade you will
              usually find.
          - text: >
              Larger: big trades contain more shares, so a random share is
              more likely to sit in one.
            correct: true
            feedback: >
              Right. Sampling a share samples trades in proportion to their
              size.
          - text: >
              Smaller: most trades are small, and a random share is probably in
              one of them.
            feedback: >
              Most *trades* are small, but most *shares* are in the big trade:
              $1600$ of the $2000$.
        feedback: >
          Count what you are sampling. Picking a share is not picking a trade.
      - ask: >
          What is the expected size, in shares, of the trade a random share
          belongs to?
        expects: "1330"
        hint: >
          The share lands in a trade of size $x$ with probability $x/2000$.
        feedback: >
          $\tfrac{100}{2000} \cdot 100 + \tfrac{300}{2000} \cdot 300
          + \tfrac{1600}{2000} \cdot 1600 = 5 + 45 + 1280 = 1330$ shares, about
          twice the average trade.
      - reflect: >
          Write that computation for a general list of sizes, or a size
          distribution with mean $\mathbb{E}[X]$. What does the sampled mean
          become, and what decides how far it sits above $\mathbb{E}[X]$?
        hint: >
          Each size gets weight proportional to itself. Then use
          $\mathbb{E}[X^{2}] = \operatorname{Var}(X) + \mathbb{E}[X]^{2}$.
        answer: >
          Weighting each size by itself gives
          $\mathbb{E}[X^{2}]/\mathbb{E}[X]$, and splitting the second moment
          turns that into $\mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$.
          The excess is the variance over the mean: if every size were the
          same there would be no bias at all, and the more the sizes vary, the
          more the big ones dominate what you see.
      - teach: >
          That is length-biased sampling. Whenever intervals or groups are
          sampled by hitting them with a point (a random moment, a random
          share, a random passenger) rather than by listing them, an item of
          size $x$ is picked in proportion to $x$. The picked size has density
          $xf(x)/\mathbb{E}[X]$ and mean
          $\mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$. Bus gaps hit
          by your arrival time are the classic case.

      - part: Variability is the whole penalty
        ask: >
          Buses run on an exact $8$-minute timetable, and you arrive at a
          random moment. What is your expected wait, in minutes?
        expects: "4"
        hint: >
          With no variance, the gap you land in is just $8$ minutes.
        feedback: >
          $\operatorname{Var}(X) = 0$, so you land in an $8$-minute gap and, at
          a uniform point of it, wait $4$ minutes on average. Here the "half a
          gap" intuition is exactly right.
      - ask: >
          Now the gaps are exponential with the same $8$-minute mean. What is
          the expected length of the gap you land in?
        expects: "16"
        hint: >
          An exponential's variance is its mean squared.
        feedback: >
          $8 + 8^{2}/8 = 16$ minutes. For the exponential the penalty equals
          the mean, which is where "the gap you land in is twice the average"
          comes from.
      - ask: >
          Now the gaps are uniform between $0$ and $16$ minutes, still with
          mean $8$. What is the expected length of the gap you land in?
        expects: "32/3"
        tolerance: 0.005
        hint: >
          A uniform on $[0, 16]$ has variance $16^{2}/12$.
        feedback: >
          $\operatorname{Var}(X) = 256/12 = 64/3$, so the sampled mean is
          $8 + (64/3)/8 = 8 + 8/3 = 32/3 \approx 10.67$ minutes. Not double:
          the factor of two belongs to the exponential, not to every gap law.
      - ask: >
          Three bus routes all average $8$ minutes between buses: a strict
          timetable, uniform gaps, and Poisson buses. Which statement is
          right?
        choices:
          - text: >
              The gap you land in averages $16$ minutes on every route, since
              the means match.
            feedback: >
              You just computed $8$, about $10.7$ and $16$. Matching means pin
              down nothing; the penalty is $\operatorname{Var}(X)/\mathbb{E}[X]$.
          - text: >
              The more the gaps vary, the longer the gap you land in: $8$ on
              the timetable, about $10.7$ with uniform gaps, $16$ with Poisson
              buses.
            correct: true
            feedback: >
              Right. Same mean, different variances, different experiences at
              the stop: riders feel variability as waiting.
          - text: >
              The timetable is worst: with every gap $8$ minutes, you can never
              land in a short one.
            feedback: >
              You can never land in a short one, but you never land in a long
              one either. A fixed $8$-minute gap is the smallest the sampled
              gap can average.
        feedback: >
          The intuition "I land in a typical gap" holds only for a
          timetable. Any spread in the gaps is paid for by the person who
          arrives at random.

      - part: Where the same bias hides
        ask: >
          A hospital wants the average length of stay. An analyst visits on a
          random day and records how long each current patient's stay
          eventually lasts. What does that estimate?
        choices:
          - text: >
              Something larger than the average stay, because long stays are
              more likely to be in progress on a given day.
            correct: true
            feedback: >
              Right. A patient staying $20$ days is present on $20$ times as
              many days as one staying $1$ day. Listing discharges instead
              gives each stay one entry and an unbiased average.
          - text: >
              The average stay, since the day was chosen at random.
            feedback: >
              A random day is a random point in time, and points in time land
              in long stays more often. Randomness in the day is exactly what
              creates the bias.
          - text: >
              Something smaller than the average stay, because many current
              patients have only just arrived.
            feedback: >
              Some current patients have only just arrived, but the analyst
              records each one's eventual full stay, not the time spent so far,
              and full stays sampled by a random day are length-biased upward.
        feedback: >
          Ask how each item got into the sample. Sampled by time, intervals
          are weighted by length; sampled by event, they are not.
  - node: quant-processes.poisson.compound
    hook: >
      "Total dollar volume traded" or "total claims paid" over a random
      number of Poisson arrivals is a random sum in disguise, and the
      variance formula has a term that a fixed-count model would miss
      entirely.
    explanation: >
      $S(t) = \sum_{i=1}^{N(t)} Y_i$ is exactly the random-sum setup with
      $N(t) \sim \operatorname{Poisson}(\lambda t)$ as the random count.
      Plugging $\mathbb{E}[N(t)] = \operatorname{Var}(N(t)) = \lambda t$
      into the general random-sum formulas gives $\mathbb{E}[S(t)] =
      \lambda t \mu$ directly, and $\operatorname{Var}(S(t)) = \lambda
      t\sigma^2 + \lambda t\mu^2 = \lambda t(\sigma^2+\mu^2)$ — the two
      variance terms collapse into one because the Poisson count's variance
      equals its mean.

      That collapse is the point worth carrying: $\sigma^2 + \mu^2 =
      \mathbb{E}[Y^2]$, so the variance is driven by the second moment of
      the mark, not just its variance, purely because the count itself is
      random rather than fixed. A model with a deterministic count $n$
      would give $\operatorname{Var} = n\sigma^2$ only, missing the
      $\mu^2$ contribution entirely.

      This is the standard model for aggregate volume, claim totals, or any
      quantity built by summing a random number of similar-sized pieces.
    worked: >
      Insurance claims arrive at $50$ per day, with claim size mean $3000$
      and standard deviation $1000$. Daily total claims have mean $50
      \cdot 3000 = 150{,}000$ and variance $50(1000^2+3000^2) =
      50(10{,}000{,}000) = 500{,}000{,}000$, so the standard deviation is
      $\sqrt{500{,}000{,}000} \approx 22{,}361$.
    interview: >
      "Mean and variance of total volume over a random number of Poisson
      arrivals" wants $\lambda t \mu$ and $\lambda t\,\mathbb{E}[Y^2]$
      stated directly, with the reasoning that the count's variance equals
      its mean for the Poisson case specifically.
    pitfalls: >
      Using $\lambda t \sigma^2$ alone and dropping the $\lambda t \mu^2$
      term treats the count as fixed when it is random — a systematic
      underestimate of the true variance. The formula's collapse to
      $\lambda t \mathbb{E}[Y^2]$ is specific to a Poisson count; a
      differently-distributed random count needs the full two-term
      random-sum formula.
    recap: >
      Summing iid marks over Poisson arrivals gives mean $\lambda t \mu$ and
      variance $\lambda t\,\mathbb{E}[Y^2]$, the two-term random-sum formula
      collapsed because a Poisson count's variance equals its mean.
    dialogue:
      - part: An hour at the cash machine
        teach: >
          Withdrawals at a cash machine arrive as a Poisson process at $20$ per
          hour. The amounts, in dollars, are iid with mean $60$ and standard
          deviation $30$, independent of when and how often people come.
      - ask: >
          What is the expected total withdrawn in an hour, in dollars?
        expects: "1200"
        hint: >
          Expected number of withdrawals times expected amount.
        feedback: >
          $\mathbb{E}[S] = \mathbb{E}[N]\mu = 20 \cdot 60 = 1200$. The mean of a
          random sum needs nothing more than the two means.
      - ask: >
          A colleague puts the variance of the hourly total at
          $20 \cdot 30^{2} = 18\,000$ square dollars. What has the colleague
          assumed?
        choices:
          - text: >
              That exactly $20$ withdrawals happen every hour.
            correct: true
            feedback: >
              Right. $n\sigma^{2}$ is the variance of a sum of a *fixed* number
              $n$ of amounts. The number of withdrawals here is
              $\operatorname{Poisson}(20)$, and its own randomness is missing.
          - text: >
              That the amounts are independent of one another.
            feedback: >
              They are independent, and the colleague is right to use it. The
              gap is elsewhere: the count was treated as fixed.
          - text: >
              Nothing; that is the variance.
            feedback: >
              An hour with $28$ withdrawals totals about $1680$ dollars and an
              hour with $12$ about $720$, before any variation in amounts. That
              spread is not in $20 \cdot 30^{2}$.
        feedback: >
          Two sources of randomness: how much each person takes, and how many
          people come.
      - reflect: >
          Condition on the count $N$ and use the law of total variance. What
          does each of its two terms contribute here?
        hint: >
          Given $N = n$, the total has mean $n\mu$ and variance $n\sigma^{2}$.
        answer: >
          $\operatorname{Var}(S) = \mathbb{E}[\operatorname{Var}(S \mid N)]
          + \operatorname{Var}(\mathbb{E}[S \mid N])
          = \mathbb{E}[N]\sigma^{2} + \operatorname{Var}(N)\mu^{2}$. The first
          term is the colleague's: amounts varying with the count held
          fixed. The second is the count varying, each extra withdrawal
          moving the total by about $\mu$. For a Poisson count
          $\operatorname{Var}(N) = \mathbb{E}[N]$, so the two terms share a
          factor and combine.
      - ask: >
          So what is the variance of the hourly total, in square dollars?
        expects: "90000"
        hint: >
          $20 \cdot 30^{2} + 20 \cdot 60^{2}$.
        feedback: >
          $20 \cdot 900 + 20 \cdot 3600 = 18\,000 + 72\,000 = 90\,000$. The
          term the colleague dropped is four times the one kept.
      - ask: >
          And the standard deviation, in dollars?
        expects: "300"
        hint: >
          Square root.
        feedback: >
          $\sqrt{90\,000} = 300$ dollars, against $\sqrt{18\,000} \approx 134$
          for the fixed-count model.
      - teach: >
          That is the compound Poisson process. With iid marks $Y_i$ of mean
          $\mu$ and variance $\sigma^{2}$, independent of a rate-$\lambda$
          Poisson process, $S(t) = \sum_{i=1}^{N(t)} Y_i$ has
          $\mathbb{E}[S(t)] = \lambda t\mu$ and
          $\operatorname{Var}(S(t)) = \lambda t(\sigma^{2} + \mu^{2})
          = \lambda t\,\mathbb{E}[Y^{2}]$. The variance runs on the second
          moment of the mark, because the count is random.

      - part: A check on a yes-or-no mark
        ask: >
          Now let $Y_i = 1$ if a withdrawal is over the daily limit, which
          happens with probability $0.1$, and $0$ otherwise. Then $S$ counts
          over-limit withdrawals in an hour. What variance does the compound
          formula give?
        expects: "2"
        hint: >
          $\mathbb{E}[Y^{2}]$ for a $0$-or-$1$ mark is the chance of a $1$.
        feedback: >
          $\lambda t\,\mathbb{E}[Y^{2}] = 20 \cdot 0.1 = 2$, and the mean is
          $\lambda t\mu = 2$ as well. Variance equal to mean is the signature
          of a Poisson count, and that is right: picking out Poisson arrivals
          by independent coin flips leaves a Poisson stream, here at $2$ per
          hour. Without the $\mu^{2}$ term the formula would have given
          $20 \cdot 0.09 = 1.8$.
      - ask: >
          Which step of the collapse to $\lambda t\,\mathbb{E}[Y^{2}]$ used
          the count being Poisson?
        choices:
          - text: >
              $\mathbb{E}[S] = \mathbb{E}[N]\mu$.
            feedback: >
              That holds for any count independent of the marks, Poisson or
              not.
          - text: >
              $\operatorname{Var}(N) = \mathbb{E}[N]$, which let
              $\mathbb{E}[N]\sigma^{2}$ and $\operatorname{Var}(N)\mu^{2}$
              share a factor.
            correct: true
            feedback: >
              Right. With any other count the two terms keep separate factors
              and must be computed separately.
          - text: >
              The marks being independent of one another.
            feedback: >
              Independence of the marks gives $\operatorname{Var}(S \mid N = n)
              = n\sigma^{2}$, which every random sum uses. It is not the
              Poisson-specific step.
        feedback: >
          The two-term random-sum formula is general; the one-term version is
          its Poisson special case.

      - part: When the count is not Poisson
        ask: >
          Suppose the hourly count still averages $20$ but alternates between
          busy and quiet hours, so its variance is $60$. Amounts are as before.
          What is the variance of the hourly total, in square dollars?
        expects: "234000"
        hint: >
          Back to $\mathbb{E}[N]\sigma^{2} + \operatorname{Var}(N)\mu^{2}$.
        feedback: >
          $20 \cdot 900 + 60 \cdot 3600 = 18\,000 + 216\,000 = 234\,000$, a
          standard deviation of about $484$ dollars. Plugging into
          $\lambda t\,\mathbb{E}[Y^{2}]$ would have given $90\,000$, badly
          understating the risk of a cash-out.
      - teach: >
          In an interview, "mean and variance of total volume over Poisson
          arrivals" gets $\lambda t\mu$ and $\lambda t\,\mathbb{E}[Y^{2}]$,
          with the reason said aloud: the count's variance equals its mean,
          so the count's own randomness adds $\lambda t\mu^{2}$ to the
          familiar $\lambda t\sigma^{2}$.
  - node: quant-processes.poisson.nonhomogeneous
    hook: >
      Real arrival rates move with the clock — busier at market open, quiet
      overnight — and this is the minimal change that keeps Poisson counts
      usable once the rate stops being constant.
    explanation: >
      Only stationarity is dropped; independent increments and the local
      "chance $\lambda(t)\,dt$ per instant" picture survive unchanged. The
      count over $(a,b]$ is still Poisson, just with mean equal to the
      accumulated rate $m(b)-m(a) = \int_a^b \lambda(u)\,du$ rather than
      $\lambda(b-a)$ — you integrate the varying rate exactly the way you'd
      sum a constant one over a fixed window.

      Because the rate now depends on when you are, gaps are no longer iid
      — a gap starting during a busy period is typically shorter than one
      starting during a quiet one — so the clean interarrival-times result
      genuinely breaks, and only independence of future from past survives
      from the fresh-start property, not a shared distribution.

      The load-bearing trick for working with these processes is a time
      change: running the clock on $m$ instead of on ordinary time turns
      the non-homogeneous process into a standard rate-$1$ Poisson process,
      which is exactly how you'd simulate one — draw rate-$1$ arrivals and
      map each epoch back through $m^{-1}$.
    worked: >
      Let $\lambda(t) = 2t$ for $t \in [0,3]$ hours, so $m(t) = t^2$. The
      expected number of arrivals in $[1,2]$ is $m(2)-m(1) = 4-1 = 3$, so
      $\Pr(\text{no arrivals in } [1,2]) = e^{-3} \approx 0.0498$. The
      expected count in $[0,1]$ is $m(1) = 1$, so $\Pr(N=2 \text{ in }[0,1])
      = e^{-1}/2 \approx 0.1839$.
    interview: >
      "Arrival rate is $\lambda(t)$, not constant — how many events do you
      expect between $a$ and $b$" wants $\int_a^b \lambda(u)\,du$ stated
      directly, distinguishing it from the constant-rate shortcut
      $\lambda(b-a)$.
    pitfalls: >
      Multiplying a snapshot rate $\lambda(t)$ by the window width instead
      of integrating badly misestimates the count whenever the rate moves
      appreciably across the window. Assuming interarrival gaps stay iid
      exponential here is a leftover habit from the constant-rate case that
      no longer holds.
    recap: >
      A non-homogeneous Poisson process keeps independent increments and
      Poisson counts with mean $\int \lambda$, and a time change on $m$
      converts it back to a standard rate-$1$ process.
    dialogue:
      - part: A rate that climbs toward the close
        teach: >
          In the two minutes before an auction closes, orders arrive one at a
          time, disjoint stretches behave independently, and the chance of an
          order in a short stretch of length $dt$ at time $t$ is about
          $6t\,dt$, with $t$ in minutes from $0$ to $2$. The rate climbs from
          $0$ to $12$ per minute.
      - ask: >
          How many orders do you expect in the final minute, from $t = 1$ to
          $t = 2$?
        expects: "9"
        hint: >
          Add up the expected orders over the short stretches: integrate the
          rate.
        feedback: >
          $\int_1^2 6t\,dt = 3 \cdot 2^{2} - 3 \cdot 1^{2} = 9$. The expected
          count is the area under the rate.
      - ask: >
          A colleague takes the rate at the start of that minute, $6$ per
          minute, and expects $6$ orders. What is wrong?
        choices:
          - text: >
              Nothing: a rate times a length is an expected count.
            feedback: >
              Only for a constant rate. Here it climbs from $6$ to $12$ across
              the minute, so a snapshot at the start misses every order the
              steeper part brings.
          - text: >
              The rate changes across the minute, so the snapshot must be
              replaced by the integral of the rate.
            correct: true
            feedback: >
              Right. $6$ undercounts and the end-of-minute rate, $12$,
              overcounts; the integral gives $9$.
          - text: >
              The colleague should have used the end-of-minute rate, $12$, since
              orders bunch near the close.
            feedback: >
              That swaps one snapshot for another and overcounts. Only the
              integral weighs every part of the minute correctly.
        feedback: >
          With a moving rate, the expected count over $(a, b]$ is
          $\int_a^b \lambda(u)\,du$.
      - ask: >
          What is the probability of no orders at all in the first minute, from
          $t = 0$ to $t = 1$? Give four decimals.
        expects: "0.0498"
        tolerance: 0.0005
        hint: >
          Chop the minute into slots; each must be empty. The product of
          $1 - 6t\,dt$ over slots becomes the exponential of minus the
          integral.
        feedback: >
          $\int_0^1 6t\,dt = 3$, and the product of many factors
          $1 - 6t\,dt$ tends to $e^{-3} \approx 0.0498$.

      - part: The count is still Poisson
        reflect: >
          With a constant rate, the slot argument turned the count over a
          window into a binomial, then a Poisson. Rerun it with slots whose
          chances differ. What law does the count over $(a, b]$ get, and what
          replaces $\lambda t$?
        hint: >
          Many independent slots, each with a small chance of its own; what
          matters in the limit is the total of those chances.
        answer: >
          The count is a sum of many independent yes-or-no slots with small,
          unequal chances $\lambda(u)\,du$. In the rare-events limit such a sum
          is Poisson with mean equal to the total of the chances, so the count
          over $(a, b]$ is $\operatorname{Poisson}(\int_a^b \lambda(u)\,du)$.
          The constant rate's $\lambda t$ was just this integral for a flat
          $\lambda$.
      - teach: >
          That is a non-homogeneous Poisson process. Given an intensity
          $\lambda(t) \ge 0$, set $m(t) = \int_0^t \lambda(u)\,du$. The process
          has independent increments, and
          $N(b) - N(a) \sim \operatorname{Poisson}(m(b) - m(a))$. Here
          $m(t) = 3t^{2}$, and the constant-rate process is the case
          $m(t) = \lambda t$.

      - part: What survives a moving rate
        ask: >
          Which clause of the ordinary Poisson process definition has been
          dropped?
        choices:
          - text: >
              Independent increments.
            feedback: >
              Disjoint stretches are still independent; the definition keeps
              that clause on purpose.
          - text: >
              The Poisson law of a window's count.
            feedback: >
              Counts are still Poisson, just with mean $m(b) - m(a)$ instead of
              $\lambda(b - a)$.
          - text: >
              Stationarity: a window's law now depends on where it sits.
            correct: true
            feedback: >
              Right. The minute from $0$ to $1$ has mean $3$; the minute from
              $1$ to $2$ has mean $9$.
        feedback: >
          One clause dropped, and the rate becomes a function.
      - ask: >
          With a constant rate, the gaps between arrivals are iid exponential.
          Are the gaps between orders here?
        choices:
          - text: >
              Yes, with rate equal to the average intensity, $6$ per minute.
            feedback: >
              Averaging the rate erases exactly what changed. A gap starting
              near the close, at rate about $12$, tends to be much shorter than
              one starting near $t = 0$, where the rate is almost nothing.
          - text: >
              No: how long a gap lasts depends on when it starts.
            correct: true
            feedback: >
              Right. The gaps are neither identically distributed nor
              exponential. What survives is only that the future is
              independent of the past.
          - text: >
              Yes, because increments are still independent.
            feedback: >
              Independence makes the future ignore the past, but the future
              itself now depends on the clock. Iid gaps need stationarity too.
        feedback: >
          Exponential-gap shortcuts are a constant-rate luxury.
      - ask: >
          A time change restores the constant rate: run the clock on $m$ and
          the process becomes a rate-$1$ Poisson process. To simulate, draw
          rate-$1$ arrivals and map each through $m^{-1}$. A rate-$1$ arrival
          at $6.75$ lands at what time $t$, in minutes?
        expects: "1.5"
        hint: >
          Solve $3t^{2} = 6.75$.
        feedback: >
          $t^{2} = 2.25$, so $t = 1.5$ minutes. Equal steps in $m$ become
          shorter and shorter steps in $t$ as the rate climbs, which is the
          bunching toward the close.

      - part: One clause short
        ask: >
          Now the exchange adds a reaction: for half a minute after each order,
          the chance of another rises by $2\,dt$ on top of $6t\,dt$. Is this a
          non-homogeneous Poisson process?
        choices:
          - text: >
              Yes: there is still a local rate at every instant.
            feedback: >
              There is, but it depends on when the last orders came. A
              non-homogeneous Poisson process has an intensity fixed in
              advance, a function of the clock alone.
          - text: >
              No: increments are no longer independent, since an order raises
              the chance of more soon after.
            correct: true
            feedback: >
              Right. Exactly one clause fails. The rate now reacts to the
              process's own history, which makes it self-exciting, and counts
              in adjacent windows are positively correlated.
          - text: >
              No: the rate now jumps by $2$, and an intensity has to be a
              smooth function of time.
            feedback: >
              Smoothness was never required; an intensity with jumps is fine,
              provided it is fixed in advance. What fails is independence of
              disjoint stretches.
        feedback: >
          In an interview, "the rate depends on time" gets
          $\int_a^b \lambda(u)\,du$ as the Poisson mean. "The rate depends on
          what already happened" is a different model, and saying so is the
          point.
  - node: quant-processes.poisson.clumping
    hook: >
      A scatter plot of Poisson arrivals looks bunched and uneven to nearly
      everyone who sees one, and mistaking that normal clustering for a
      "real" burst is the trap this node exists to close.
    explanation: >
      The exponential gap density $\lambda e^{-\lambda x}$ is largest at
      $x=0$ and decreasing from there, so short gaps are the single most
      likely outcome, not a rare anomaly — a visible cluster of close-together
      points is exactly what memoryless arrivals look like, not evidence
      something unusual happened.

      Counts wobble for a related reason: $\operatorname{Var}(N(t)) =
      \lambda t$ makes the typical deviation from the mean equal to
      $\sqrt{\lambda t}$, which grows slower than the mean itself — so an
      expected $100$
      arrivals routinely turns up as $90$ or $115$, a swing that looks large
      relative to nothing but feels significant on its own.

      The test that runs the other direction is the one to actually use:
      compute the index of dispersion $\operatorname{Var}(N)/\mathbb{E}[N]$
      from data. A ratio near $1$ is consistent with Poisson; well above $1$
      signals genuine clustering beyond what randomness alone produces, and
      well below $1$ signals something closer to a timetable.
    worked: >
      At $\lambda = 8$ per hour, a gap under a fifth of the mean ($1/40$
      hour $= 1.5$ minutes) occurs with probability $1 - e^{-0.2} \approx
      0.1813$ — nearly one in five gaps looks "suspiciously" short. Over
      $t=4$ hours, $\mathbb{E}[N] = 32$ with typical deviation $\sqrt{32}
      \approx 5.66$, so counts of $26$ to $38$ are unremarkable.
    interview: >
      "Does this event data look Poisson, or is it clustering" wants the
      index of dispersion $\operatorname{Var}(N)/\mathbb{E}[N]$ named as the
      actual test, not a visual judgment about whether points "look" evenly
      spread.
    pitfalls: >
      Judging clustering by eye from a scatter of points is unreliable —
      genuine Poisson arrivals produce visible clumps routinely. Treating
      any single observed count that differs from the mean by more than a
      little as evidence of a changed rate ignores that $\sqrt{\lambda t}$
      swings are expected, not exceptional.
    recap: >
      Exponential gaps make visible clustering the Poisson norm, and the
      index of dispersion $\operatorname{Var}(N)/\mathbb{E}[N] \approx 1$,
      not a visual check, is the actual test for whether a stream is
      Poisson.
    dialogue:
      - part: What random arrivals look like
        teach: >
          Messages reach a desk as a Poisson process at $30$ per hour, so the
          gaps between them average $2$ minutes. Picture the next $100$ gaps.
      - ask: >
          Guess first: about how many of those $100$ gaps are shorter than $20$
          seconds, a sixth of the average?
        choices:
          - text: >
              About $2$: gaps that short should be rare flukes.
            feedback: >
              That is the picture of evenly spaced arrivals with a little
              jitter. Exponential gaps are nothing like that: short gaps are
              their most common kind.
          - text: >
              About $15$.
            correct: true
            feedback: >
              Right, and most people guess far lower. The exact count is next.
          - text: >
              About $8$: a sixth of the mean should catch roughly a twelfth of
              the gaps.
            feedback: >
              That reasoning treats the gaps as spread evenly around the mean.
              Their density is highest at $0$, so short gaps are
              over-represented.
        feedback: >
          The eye expects random arrivals to be evenly spread; they are not.
      - ask: >
          What is the expected number of the $100$ gaps shorter than $20$
          seconds? Give two decimals.
        expects: "15.35"
        tolerance: 0.05
        hint: >
          A gap is $\operatorname{Exp}(1/2)$ in minutes; $20$ seconds is $1/3$
          minute.
        feedback: >
          $\Pr(X < 1/3) = 1 - e^{-1/6} \approx 0.1535$, so about $15.35$ of
          $100$: roughly one gap in six or seven is under a sixth of the average.
      - ask: >
          And the expected number longer than $6$ minutes, three times the
          average? Give two decimals.
        expects: "4.98"
        tolerance: 0.05
        hint: >
          The survival function at $6$ minutes.
        feedback: >
          $100e^{-6/2} = 100e^{-3} \approx 4.98$. Short gaps outnumber long
          ones three to one, and together they make the picture: bunches
          separated by droughts.
      - ask: >
          Which gap length is the most likely, in the sense that the gap
          density is highest there?
        choices:
          - text: >
              Near $2$ minutes, the average gap.
            feedback: >
              The mean is where a symmetric density peaks. The exponential
              density $\lambda e^{-\lambda x}$ is decreasing, so it is highest
              at $x = 0$, far from the mean.
          - text: >
              Near $0$.
            correct: true
            feedback: >
              Right. $\lambda e^{-\lambda x}$ is largest at $x = 0$: a very
              short gap is the single most likely kind.
          - text: >
              Near $1.39$ minutes, the median gap.
            feedback: >
              The median, $2\ln 2 \approx 1.39$ minutes, splits the gaps into
              halves; it is not where they are densest. The density still
              peaks at $0$.
        feedback: >
          An exponential piles its mass near zero and spreads its tail far
          out.
      - reflect: >
          A plot of Poisson arrivals looks clustered to nearly everyone. Using
          what you just computed, say why, and what a plot of *evenly* spread
          points would actually tell you about the process behind it.
        hint: >
          What would the gap density need to look like for points to come out
          evenly spaced?
        answer: >
          Exponential gaps put the most weight on very short gaps and still
          allow long ones, so a memoryless stream naturally shows tight
          bunches separated by droughts. Bunching is what independence looks
          like. Evenly spaced points would need gaps concentrated near the
          mean, a timetable or something that pushes arrivals apart, and that
          is a departure from Poisson, not an example of it.
      - teach: >
          That is the clumping intuition. Points of a Poisson process are not
          evenly spread, and short gaps and visible bunches are the norm, not
          evidence of a burst. Counts wobble too: with
          $\operatorname{Var}(N(t)) = \lambda t$, the typical deviation of a
          count is $\sqrt{\lambda t}$.

      - part: Counts wobble too
        ask: >
          Over a $7.5$-hour day the desk expects $225$ messages. What is the
          standard deviation of the day's count?
        expects: "15"
        hint: >
          A Poisson count's variance equals its mean.
        feedback: >
          $\sqrt{225} = 15$. Days between about $195$ and $255$ are entirely
          ordinary, two standard deviations either side.
      - ask: >
          The desk logs $205$ messages on Monday and $243$ on Tuesday. The
          manager asks what changed. What is the best answer?
        choices:
          - text: >
              Something did: $38$ more messages is a $19\%$ jump.
            feedback: >
              The jump is measured against nothing. Both days are within about
              $1.3$ standard deviations of $225$, and the difference of two
              independent days has standard deviation $15\sqrt{2} \approx 21$,
              so $38$ is under two of those.
          - text: >
              Possibly nothing: both counts are well inside the ordinary
              wobble of a rate-$30$ day.
            correct: true
            feedback: >
              Right. $205$ and $243$ sit $1.3$ and $1.2$ standard deviations
              from the mean. A rate change would need much more evidence than
              one pair of days.
          - text: >
              Monday was quiet, so Tuesday made up the shortfall.
            feedback: >
              Disjoint days are independent; nothing makes up for anything.
              That is the gambler's fallacy in counting form.
        feedback: >
          Counts of a few hundred routinely swing by tens. Swings of
          $\sqrt{\lambda t}$ are expected, not news.

      - part: The test that runs the other way
        ask: >
          Three desks each log counts over many disjoint $10$-minute windows.
          The sample mean and variance per window are $(6, 6.3)$ at desk A,
          $(6, 18)$ at desk B and $(6, 1.2)$ at desk C. Which desk shows
          genuine clustering?
        choices:
          - text: >
              Desk A.
            feedback: >
              Variance over mean is $6.3/6 \approx 1.05$, right where a Poisson
              stream sits. Its plot will look clumpy, and the clumps are just
              randomness.
          - text: >
              Desk C.
            feedback: >
              $1.2/6 = 0.2$, well *below* $1$: the counts are steadier than
              Poisson, the signature of something close to a timetable.
          - text: >
              Desk B.
            correct: true
            feedback: >
              Right. $18/6 = 3$, well above $1$: windows vary far more than a
              Poisson stream allows, which is what genuine bursts produce.
        feedback: >
          The index of dispersion $\operatorname{Var}(N)/\mathbb{E}[N]$ is the
          yardstick: near $1$ is Poisson, well above is clustering, well below
          is regularity. In an interview, name it instead of judging a scatter
          plot by eye.
