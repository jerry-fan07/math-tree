unit: quant-puzzles.nim-games
opening: >
  This unit collects the interview games you can solve completely rather than merely reason about: take-away piles, races to a target, Nim, and simple grid games, all finite and impartial enough that the winner is knowable in advance. It builds one recursive tool — labelling every position as a win or a loss for whoever moves next — then specializes it: periodic patterns in subtraction games, the mirroring trick for two equal piles, and Bouton's XOR rule for Nim with any number of piles. It closes with two set pieces that push past explicit tables: strategy stealing, which proves a winner exists without ever naming the move, worked on Chomp, and the Sprague–Grundy value, which lets several unrelated games be combined and solved as one.
lessons:
  - node: quant-puzzles.nim-games.combinatorial-game
    hook: >
      Every game in this unit gets solved by the same two-value trick, but that trick only works because the game is impartial, finite, and free of chance — checking those three facts before reaching for backward induction is the first thing an interviewer wants to see.
    explanation: >
      A game qualifies for the machinery in this unit only if it clears four hurdles at once: it is finite, bounded in length and guaranteed to terminate; two-player and alternating; perfect-information with no chance device, so both players see the whole position and no die or hidden card ever enters play; and impartial — the set of legal moves from a position depends only on the position itself, never on whose turn it is. Nim and every take-away game satisfy this last condition automatically, since "remove some counters from a pile" is available identically to either player; a game like chess fails it, since only the mover's own color can move, so the same board position offers different legal moves depending on who's asked.

      The normal-play convention says the player who cannot move loses, equivalently the player who removes the last object wins; misère play swaps the two and is generally the harder analysis, so always confirm which convention a stated problem intends before solving. Because the game is finite, has no draws, and is perfect information, it is determined: exactly one of the two players can force a win regardless of how well the other plays. That single fact collapses the whole interview problem to two questions — which player wins, and what move proves it — with no payoffs to compute and nothing to mix, unlike the payoff-matrix games elsewhere in this course.
    worked: >
      Take "a single pile of six counters; each turn remove one or two counters; the player who takes the last counter wins." It clears every hurdle: finite, since the pile only shrinks; two-player and alternating by the rules as stated; perfect information and chance-free, since both players see the pile size and no die or card enters the rules; and impartial, since "remove one or two" is available to whichever player is on move, not tied to a color or role. Contrast a variant where only the first player may ever remove two at a time — that variant is no longer impartial, because the menu of legal moves now depends on who is asking, and none of this unit's techniques — mirroring, the XOR rule, backward labelling — are licensed to touch it until it's rewritten as a fair, symmetric rule.
    interview: >
      "Here's a game — who wins?" is always preceded, in a careful answer, by naming the convention out loud: confirm normal play (last move wins) versus misère (last move loses), and confirm the move set doesn't secretly depend on which player is speaking. Skipping straight to a guessed strategy without this check is the fastest tell of a candidate pattern-matching instead of reasoning.
    pitfalls: >
      Assuming "last to move wins" without asking — many interviewers state a game in misère form ("the player forced to take the last object loses") precisely to see if you check. Treating a game with player-specific pieces or roles as impartial just because it alternates turns; alternation alone doesn't make the legal-move set independent of the mover.
    recap: >
      A position qualifies for this unit's tools exactly when it's finite, alternating, chance-free, and impartial under a stated normal- or misère-play convention — and being finite and drawless already guarantees one side can force the win.
    dialogue:
      - part: Fifteen matches and the question behind the question
        teach: >
          An interviewer lays $15$ matches on the table. "We alternate. On your
          turn you remove $1$ or $2$ matches. Whoever takes the last match
          wins. Who wins?" Before anyone thinks about strategy, look hard at
          the game itself.
      - ask: >
          What is the largest number of turns this game can possibly last?
        expects: "15"
        hint: >
          What is the least a single turn can remove?
        feedback: >
          Every turn removes at least $1$ match, so after at most $15$ turns
          the table is bare. Fifteen turns of one match each is the longest
          possible game.
      - ask: >
          And the fewest turns it can last?
        expects: "8"
        hint: >
          Take $2$ every time for as long as you can.
        feedback: >
          Seven turns of $2$ remove $14$ matches and one more turn takes the
          last one: $8$ turns. Every play of the game lasts between $8$ and
          $15$ turns.
      - ask: >
          Can a play of this game end without a winner?
        choices:
          - text: >
              Yes: if both players play perfectly, the sensible result is a
              draw.
            feedback: >
              There is no draw to reach. Within $15$ turns the matches run out,
              and whoever removed the last one has won. Perfect play decides
              *who* wins, not *whether* someone does.
          - text: >
              It depends on who moves first.
            feedback: >
              Who moves first may change *which* player wins, but not whether
              somebody does: every play ends, by turn $15$ at the latest, with
              one player holding the last match.
          - text: >
              No: the pile shrinks every turn, so someone takes the last match
              within $15$ turns.
            correct: true
            feedback: >
              Right. Termination plus a rule that names a winner whenever play
              stops means every game has exactly one winner.
        feedback: >
          A game that must end, and that always ends with a winner, is the
          kind where "who wins?" has a definite answer. Keep that in mind:
          the interviewer is about to change the rules.

      - part: Four house rules, three of them fatal
        teach: >
          The interviewer offers four variations. (a) On your turn you may
          remove $1$ or $2$ matches, or pass. (b) Before each turn a coin is
          flipped: heads, the mover removes $1$; tails, the mover removes $2$.
          (c) You remove $1$ or $2$; the interviewer removes $1$, $2$ or $3$.
          (d) Both players remove $1$, $2$ or $4$.
      - ask: >
          In which variation can a single game go on forever?
        choices:
          - text: >
              (d): the larger take of $4$ changes the length of the game.
            feedback: >
              A bigger take makes the game *shorter*, never longer. Every turn
              in (d) still removes at least $1$ match, so it ends within $15$
              turns.
          - text: >
              (a): two players who keep passing never empty the pile.
            correct: true
            feedback: >
              Right. With passing allowed, nothing forces the pile down, and
              "pass, pass, pass" is a legal game that never ends. There is no
              last move to win with.
          - text: >
              (b): the coin can keep coming up the wrong way.
            feedback: >
              Heads or tails, the mover removes at least $1$ match, so (b) also
              ends within $15$ turns. The coin does break something, just not
              termination.
        feedback: >
          Passing destroys termination. Without it there is no end of the game
          to reason backwards from.
      - ask: >
          What does "who can force a win?" mean in variation (b)?
        choices:
          - text: >
              Nothing: neither player ever makes a choice, so the winner is
              decided by the coin.
            correct: true
            feedback: >
              Right. Every move is dictated by a flip. The only honest question
              is "with what probability does the first player win?", a
              question about the coin, not about skill.
          - text: >
              The same as before: whoever wins the original game wins (b).
            feedback: >
              In the original game players choose how many to take; in (b) the
              coin chooses. Whatever the original strategy was, nobody in (b)
              can follow it.
          - text: >
              The player who moves first, because they get more flips.
            feedback: >
              More flips is not more control. Whoever moves first, every flip
              is a chance event neither player can influence.
        feedback: >
          A chance device turns "who wins" into "how likely". The games this
          unit solves have no coin, no die and no hidden card.
      - ask: >
          Variation (c), with $3$ matches left. If it is the interviewer's turn,
          how many matches are left after the interviewer's best move?
        expects: "0"
        hint: >
          What is the interviewer allowed to take that you are not?
        feedback: >
          The interviewer takes all $3$ and wins on the spot. Facing the very
          same $3$ matches, you could take only $1$ or $2$ and would hand the
          interviewer a pile they can clear. One pile, two different games,
          depending only on whose turn it is.
      - reflect: >
          Variation (d) keeps everything the original had, while (a), (b) and
          (c) each lose something. Say exactly what you were checking about
          each variation, one property per failure.
        answer: >
          Three checks. Play must end: (a) fails, since passing can go on
          forever. No chance device, and nothing hidden, so a position plus a
          choice of move determines what happens next: (b) fails, the coin
          chooses. The legal moves must depend only on the position, not on
          who is moving: (c) fails, since $3$ matches offer the interviewer a
          move they do not offer you. Variation (d) passes all three, and so
          does the original.
      - teach: >
          Those are the hypotheses of this unit. A game qualifies when it is
          finite, two-player and alternating, of perfect information with no
          chance device, and impartial: the set of legal moves is a function
          of the position alone. Under normal play the player unable to move
          loses, which is "last match wins"; misère play reverses it. A finite
          game of this kind cannot be drawn, so exactly one player can force a
          win, and the only questions left are which one and how.

      - part: Clause by clause on new games
        ask: >
          Noughts and crosses: finite, alternating, nothing hidden, no dice.
          Which hypothesis does it fail?
        choices:
          - text: >
              Finiteness: a game can drag on.
            feedback: >
              The board has $9$ squares and every move fills one, so a game
              lasts at most $9$ moves.
          - text: >
              Impartiality: from the same board, one player may place only
              crosses and the other only noughts.
            correct: true
            feedback: >
              Right. The menu of moves depends on who is moving. That is also
              why it can be drawn: its winner is decided by a line, not by who
              moves last, so normal play does not apply either.
          - text: >
              None: it qualifies.
            feedback: >
              Hand the same board to each player and they have different
              moves, one placing crosses and the other noughts. The class
              needs both players to have the same options from every
              position.
        feedback: >
          Games where each player owns their own pieces, like noughts and
          crosses or chess, are partizan. This unit's labels do not apply to
          them.
      - ask: >
          Back to the original $15$ matches, but a coin flip decides who moves
          first. Does that flip take the game out of the class?
        choices:
          - text: >
              Yes: any coin anywhere makes it a game of chance.
            feedback: >
              The coin is tossed once, before play, to assign seats. Once
              play starts, nothing random happens, and from each seat the
              outcome under best play is fixed.
          - text: >
              No: the coin only assigns seats, and the game played after it
              has no chance in it.
            correct: true
            feedback: >
              Right. "Who wins?" is answered seat by seat: you work out
              whether the first or the second seat can force a win. The coin
              only decides which seat you end up in.
          - text: >
              Yes: it changes which player can force a win.
            feedback: >
              It changes which *person* sits in the winning seat, not which
              seat that is. The game itself is untouched.
        feedback: >
          Chance before the game is harmless; chance inside it is not. The
          test is whether a position and a chosen move determine the next
          position.
      - ask: >
          The interviewer says: "Same $15$ matches, take $1$ or $2$, but whoever
          takes the last match *loses*." What has changed?
        choices:
          - text: >
              Only the convention: the positions and moves are identical, and
              this is the misère version.
            correct: true
            feedback: >
              Right. It is still finite and impartial; only the rule deciding
              the winner has flipped. Answers worked out for normal play do
              not carry over automatically, which is why you confirm the
              convention before solving.
          - text: >
              It is no longer impartial, because the loser is now singled out.
            feedback: >
              Both players still have identical moves from every pile size.
              Impartiality is about the moves, not about who is declared the
              winner.
          - text: >
              Nothing that matters: the same player wins either way.
            feedback: >
              Flipping the convention often flips the winner, and it can move
              the winning strategy around in less obvious ways. Never assume
              the normal-play answer transfers.
        feedback: >
          Saying the convention out loud, "last match wins, correct?", is the
          first sentence of a good answer, before any strategy.

  - node: quant-puzzles.nim-games.np-positions
    hook: >
      Once a game is confirmed finite and impartial, "who wins" stops being a guess and becomes a two-label bookkeeping exercise — everything else in this unit is just a faster way to compute the same P/N labels.
    explanation: >
      Label a position by who wins it under optimal play, using labels named for the player about to move: a P-position is a win for the previous player, so whoever is on move there loses; an N-position is a win for the next player, so whoever is on move there wins. The label is forced, not chosen, by one recursive rule run from the very end of the game backward: a terminal position with no legal move is a P-position by the normal-play convention; a position is an N-position if at least one available move leads to a P-position; a position is a P-position if every available move leads to an N-position.

      This is working backwards made completely mechanical: instead of guessing forward from the start, you first label the terminal positions, then any position all of whose moves land on already-labelled positions, and so on, moving strictly toward the start. Finiteness is what makes the recursion terminate cleanly — every position is some bounded number of moves from a terminal one, so the labelling bottoms out rather than running forever, and it never needs to guess, since each rule only inspects already-known labels of strictly later positions.

      Once every position carries a label, playing correctly from an N-position is mechanical too: some move reaches a P-position by the very definition of N, so find it and take it, then repeat from wherever the opponent is forced to reply. The label alone doesn't hand you that move — it only guarantees one exists — so identifying it is separate work, done position by position.
    worked: >
      Take "a pile of four counters; each turn remove one or two; last to take wins." Label from the bottom: $n=0$ has no move, so it's P. $n=1$ can move to $0$ (P), so $n=1$ is N. $n=2$ can move to $1$ (N) or $0$ (P); reaching the P-position $0$ makes $n=2$ an N. $n=3$ can move to $2$ (N) or $1$ (N) only — every move lands on N, so $n=3$ is P. $n=4$ can move to $3$ (P) or $2$ (N); reaching $3$ makes $n=4$ an N, and the winning move from $4$ is to remove one counter, leaving your opponent at the P-position $3$.
    interview: >
      "Who wins, and how do you know?" wants the recursion stated explicitly — terminal is P, an N needs one escape to P, a P has no escape — not a hunch about who "has more room." Interviewers listen for whether you build the labels from the end of the game or try to reason forward from the start, which usually collapses into guessing.
    pitfalls: >
      Labelling a position N because one move "looks good" without confirming it actually lands on an already-established P-position — every N claim needs a specific witnessing move. Labelling a position P after checking only some of its moves; the P rule requires every move to reach N, so a single unchecked move can silently overturn the label.
    recap: >
      Terminal positions are P; a position is N if some move reaches a P, and P if every move reaches an N — label backward from the end and the winner falls out for free.
    dialogue:
      - part: A token heading for the corner
        teach: >
          A token sits on a grid at column $3$, row $2$, written $(3,2)$. A
          move slides it one square left, one square down, or one square
          diagonally down-left, never off the grid. Whoever slides it onto the
          corner $(0,0)$ wins; the player then facing $(0,0)$ has no move. It
          is your move from $(3,2)$.
      - ask: >
          Start small. From $(1,0)$, $(0,1)$ or $(1,1)$ the mover reaches the
          corner at once and wins. From $(2,0)$, can the mover win?
        choices:
          - text: >
              Yes: slide left to $(1,0)$, one step from the corner.
            feedback: >
              One step from the corner is exactly where you do not want to
              leave your opponent: from $(1,0)$ *they* slide onto $(0,0)$ and
              win.
          - text: >
              No: the only move is to $(1,0)$, and from there the opponent
              reaches the corner.
            correct: true
            feedback: >
              Right. Down and diagonal would leave the grid, so $(1,0)$ is
              forced, and it hands the opponent the win.
          - text: >
              Yes: it is two squares from the corner, an even distance, so the
              mover can always arrange to finish.
            feedback: >
              The mover cannot arrange anything here: there is a single legal
              move, and it lands on a square from which the opponent wins.
        feedback: >
          $(2,0)$ is a square you never want to be asked to move from, and by
          the same argument neither is $(0,2)$.
      - ask: >
          From $(2,1)$, which square should the mover slide to?
        choices:
          - text: >
              $(1,0)$, diagonally: it is closest to the corner.
            feedback: >
              Closest to the corner is the trap. From $(1,0)$ the opponent
              steps onto $(0,0)$ and wins.
          - text: >
              $(1,1)$, to the left.
            feedback: >
              From $(1,1)$ the opponent slides diagonally onto the corner and
              wins.
          - text: >
              $(2,0)$, straight down.
            correct: true
            feedback: >
              Right. You just showed $(2,0)$ is a square from which the mover
              loses, so handing it over wins.
        feedback: >
          The good move is not the one that gets nearest the goal; it is the
          one that leaves the opponent on a square you already know is bad for
          whoever moves from it.
      - ask: >
          From $(2,2)$ the mover has three moves: $(1,2)$, $(2,1)$ and
          $(1,1)$. How many of them leave the opponent on a square from which
          the opponent loses?
        expects: "0"
        hint: >
          You have already settled $(2,1)$ and $(1,1)$. For $(1,2)$, check its
          moves the way you checked $(2,1)$.
        feedback: >
          None. From $(1,1)$ the opponent hits the corner; from $(2,1)$ they
          slide to $(2,0)$; from $(1,2)$ they slide to $(0,2)$. Every move from
          $(2,2)$ hands the opponent a winning reply, so the mover there loses.
      - reflect: >
          You have now decided five squares without playing a single game to
          the end. State the rule you were using to call a square good or bad
          for the player about to move, and say where the rule has to start.
        answer: >
          It starts at the corner: a square with no move at all is bad for
          whoever faces it. After that, a square is good if *some* move from it
          lands on a bad square, and bad if *every* move from it lands on a
          good square. Each verdict only uses verdicts for squares closer to
          the corner, so the labels fill in from the end of the game
          backwards.
      - teach: >
          Those verdicts have names, given from the point of view of the
          player about to move. A P-position is a win for the *previous*
          player: the mover loses. An N-position is a win for the *next*
          player: the mover wins. A terminal position is P; a position is N if
          at least one move reaches a P; it is P if every move reaches an N. So
          $(2,0)$ and $(2,2)$ are P, and $(2,1)$ is N.

      - part: Labelling the whole board
        ask: >
          Now the real question. Is the starting square $(3,2)$ an N-position
          or a P-position, and what do you play?
        choices:
          - text: >
              P: all three moves lead somewhere the opponent can win from.
            feedback: >
              Check the diagonal: $(3,2)$ slides to $(2,2)$, which you showed is
              a P-position. One move to a P is all an N-position needs.
          - text: >
              N: slide left to $(2,2)$.
            correct: true
            feedback: >
              Right. $(2,2)$ is P, so handing it over wins. The other two moves,
              to $(3,1)$ and $(2,1)$, both leave the opponent an N-position.
          - text: >
              N: slide diagonally to $(2,1)$, getting closer to the corner.
            feedback: >
              $(2,1)$ is an N-position: the opponent slides to $(2,0)$ and
              you are the one stuck.
        feedback: >
          $(3,2)$ is N, and the winning move is the one that reaches a
          P-position. Play then continues the same way: from wherever the
          opponent goes, find the move back onto a P.
      - ask: >
          Label every square with both coordinates between $0$ and $3$, sixteen
          in all. How many of them are P-positions?
        expects: "4"
        hint: >
          Work outward from the corner, row by row. A square is P only when
          every one of its moves lands on an N.
        feedback: >
          The P-positions are $(0,0)$, $(2,0)$, $(0,2)$ and $(2,2)$. Every
          other square has a move onto one of them: $(3,0)$ and $(3,1)$ reach
          $(2,0)$, $(3,2)$, $(3,3)$ and $(2,3)$ reach $(2,2)$, and so on.
      - ask: >
          A classmate tries to decide $(3,3)$ first, before anything else.
          What stops them?
        choices:
          - text: >
              Nothing: $(3,3)$ is far from the corner, so the mover has the
              most freedom and must win.
            feedback: >
              Freedom is not a verdict. $(3,3)$ does turn out to be N, but only
              because one of its moves reaches the P-position $(2,2)$, which
              must be known first.
          - text: >
              Its label depends on the labels of $(2,3)$, $(3,2)$ and $(2,2)$,
              which are not known yet.
            correct: true
            feedback: >
              Right. Every label is a statement about the labels one move
              later, so the work runs from the corner outwards. Forward from
              the start, you would be guessing.
          - text: >
              The board is too big: you would have to play out every game.
            feedback: >
              You never play out a game. Each square is decided once, from its
              three neighbours, so sixteen squares take sixteen small checks.
        feedback: >
          Labels are forced from the end of the game backwards. Because the
          game is finite, that process reaches every position, including the
          start.

      - part: Two slips and a flipped convention
        ask: >
          A candidate says: "$(3,3)$ is a P-position, because sliding to
          $(2,3)$ or to $(3,2)$ hands the opponent an N-position." What is
          wrong?
        choices:
          - text: >
              Nothing: both moves really do reach N-positions.
            feedback: >
              They do, but a P label needs *every* move checked. The third
              move, the diagonal, is the one that matters.
          - text: >
              They checked two of three moves; the diagonal reaches $(2,2)$, a
              P-position, so $(3,3)$ is N.
            correct: true
            feedback: >
              Right. A P claim is a claim about all moves, and one unchecked
              move can overturn it.
          - text: >
              $(2,3)$ is actually a P-position, so the argument fails there.
            feedback: >
              $(2,3)$ slides down to $(2,2)$, a P-position, so it is N. The
              candidate's slip is elsewhere: they never looked at the
              diagonal.
        feedback: >
          N needs one witnessing move to a P; P needs every move to land on an
          N. The two rules fail in opposite ways, so check them differently.
      - ask: >
          Change one rule: whoever slides the token onto the corner now
          *loses*. What label does $(0,0)$ get, from the point of view of the
          player facing it?
        choices:
          - text: >
              P: a square with no moves is always a P-position.
            feedback: >
              That rule is the normal-play convention. Here the player facing
              $(0,0)$ has no move, but the opponent just lost by moving there,
              so the player facing it has won.
          - text: >
              N: the opponent just lost by moving there, so the player facing
              it has won.
            correct: true
            feedback: >
              Right. Under this misère rule the terminal position is a win for
              the player facing it, and every label above it shifts: $(1,0)$,
              whose only move is onto the corner, becomes a P-position.
          - text: >
              It has no label, since nobody moves from it.
            feedback: >
              Every position gets a label, terminal ones included. The
              terminal label is where the whole recursion starts, so it has
              to be pinned down first.
        feedback: >
          "Terminal is P" is the normal-play convention written as a label.
          Change the convention and the recursion starts from a different
          seed, so every label above it must be recomputed.

  - node: quant-puzzles.nim-games.backward-labelling
    hook: >
      When a take-away game collapses to one integer $n$, you don't need a clever invariant on the first try — writing the P/N table out by hand for a dozen values of $n$ almost always reveals the pattern before you've had to think hard at all.
    explanation: >
      Whenever a game reduces to a single integer state $n$ with a fixed menu of legal moves, build the win/lose table directly: compute the label of $n=0$, then $1$, then $2$, and so on, using the P-position/N-position backward rule — the label of $n$ depends only on the already-known labels of the smaller states a legal move can reach from $n$. Six to eight entries are usually enough to see a pattern, because the recursion is genuinely local: the label of $n$ never looks further back than the largest single move allows.

      That locality is exactly why the pattern repeats: the label of $n$ is a function only of the small window of labels just behind it, and that window can take only finitely many shapes, so some window must eventually recur. Once it does, every label from that point on is forced to repeat too, since the same window produces the same next label every time — this is what turns "I notice a pattern" into "the pattern is proven," and it's worth stating explicitly rather than trusting a few lucky-looking entries.

      Reading a winning move off the finished table is then direct: to move from an N-position $n$, look among the reachable smaller values for the one labelled P, and take exactly the move that lands there.
    worked: >
      Take "remove one or two counters; last to take wins." $n=0$: no move, P. $n=1$: reaches $0$ (P), so N. $n=2$: reaches $1$ (N) or $0$ (P); reaching $0$ makes it N. $n=3$: reaches $2$ (N) or $1$ (N) only — all N, so $3$ is P. $n=4$: reaches $3$ (P), so N. $n=5$: reaches $4$ (N) or $3$ (P), so N. The window $(P,N,N)$ at $n=3,4,5$ already matches the window at $n=0,1,2$, so the pattern — P exactly at multiples of $3$ — repeats forever. From $n=17$: $17 = 3\times 5 + 2$, so $17$ is N; remove $2$ to leave $15$, a multiple of $3$, and thereafter answer any opponent move of $1$ or $2$ by taking $2$ or $1$ respectively, restoring a multiple of $3$ every time.
    interview: >
      "What if the take set isn't one-to-three?" is the standard follow-up once you've quoted a memorized pattern — the interviewer wants to watch you actually build the table live for a new rule, not recite a formula that happened to apply to a different game.
    pitfalls: >
      Declaring a period after only two or three repeats of what looks like a cycle; the safe check is a window as wide as the largest legal move, confirmed to reproduce the following label exactly. Forgetting that a move can't remove more counters than the pile holds — when tabulating $n$'s label, only consult reachable values $n-s \ge 0$, not the full move set blindly.
    recap: >
      Build the P/N table from $n=0$ upward using the backward rule until a full window of labels repeats — the repeat is forced to continue forever, and reading off a winning move is then a table lookup.
    dialogue:
      - part: Thirty-four counters, read forwards
        teach: >
          A pile of $34$ counters. A move removes exactly $1$, $4$ or $6$
          counters, and whoever takes the last counter wins. You are to move,
          and the interviewer wants your move and the reason for it.
      - ask: >
          Try reading the game forwards. Counting your move and the
          opponent's reply, how many different two-move sequences are there?
        expects: "9"
        feedback: >
          Three choices for you, three for the reply: $3 \times 3 = 9$. Each
          further pair of moves multiplies the count by $9$ again, so ten
          moves deep there are $3^{10} = 59049$ lines.
      - ask: >
          How many *different pile sizes* can those $9$ sequences leave?
        expects: "6"
        hint: >
          Only the total removed matters. Which totals can two takes from
          $\{1, 4, 6\}$ make?
        feedback: >
          The totals are $2, 5, 7, 8, 10, 12$, so the pile is one of $32, 29,
          27, 26, 24, 22$. Taking $1$ then $4$ and taking $4$ then $1$ land
          on the same pile, $29$, and the game from $29$ does not care how it
          got there.
      - reflect: >
          The lines multiply by $3$ every move, but the piles they reach are
          just the numbers below $34$, each reached over and over. What should
          you compute instead of lines, and in what order?
        answer: >
          A verdict per pile size, computed once. Whether a pile of $n$ is a
          win for the mover depends only on the verdicts for $n-1$, $n-4$ and
          $n-6$, so start at $n = 0$ and work upward: each answer is ready by
          the time a larger pile needs it. That is $35$ small checks instead
          of tens of thousands of lines.

      - part: The table from zero
        teach: >
          That is the technique: tabulate the P/N label of $n = 0, 1, 2,
          \dots$ in order, each from the labels a legal move can reach. Here
          $n = 0$ is P, since there is no move, and $n = 1$ is N, since it
          reaches $0$. Then $n = 2$ can only reach $1$, an N, so it is P.
      - ask: >
          Carry the table on to $n = 10$. How many of the labels for
          $n = 0, 1, \dots, 10$ are P?
        expects: "5"
        hint: >
          A pile of $n$ can reach $n-1$, $n-4$ and $n-6$, whichever are at
          least $0$. P only if every one of them is N.
        feedback: >
          The labels read P N P N N P N P N N P. For example $n = 4$ reaches
          $0$, a P, so it is N; $n = 5$ reaches only $4$ and $1$, both N, so
          it is P; $n = 10$ reaches $9$, $6$ and $4$, all N, so it is P. The
          P-positions are $0, 2, 5, 7, 10$: five of them.
      - ask: >
          The P-positions so far are $0, 2, 5, 7, 10$. Which rule fits them?
        choices:
          - text: >
              P exactly at the even $n$.
            feedback: >
              $4$ is even and N (take $4$ to reach $0$), and $5$ is odd and P.
              Parity is not it.
          - text: >
              P exactly at the multiples of $5$.
            feedback: >
              That catches $0, 5, 10$ and misses $2$ and $7$, which are just
              as much P-positions.
          - text: >
              P exactly when $n \equiv 0$ or $2 \pmod 5$.
            correct: true
            feedback: >
              Right: the block P N P N N repeats with period $5$. Note it is
              not $\max S + 1 = 7$, so no formula would have handed you this.
          - text: >
              P exactly at the multiples of $7$, the largest take plus one.
            feedback: >
              $7$ is P but $14$ is not ($14 \equiv 4 \pmod 5$, and taking $4$
              reaches $10$). The "largest take plus one" formula belongs to
              take sets with no gaps; this one has gaps.
        feedback: >
          The table shows a pattern after eleven entries. The interviewer's
          next question is how you know it continues.
      - ask: >
          Why is the pattern certain to continue forever once it has repeated
          over $n = 5, \dots, 10$?
        choices:
          - text: >
              Any pattern that has appeared twice in a row is a law.
            feedback: >
              Two apparent repeats can be a coincidence, and some take sets
              produce exactly that. What proves it is a reason, not a count of
              repetitions.
          - text: >
              The label of $n$ depends only on the $6$ labels just before it,
              and the six at $n = 5, \dots, 10$ match the six at $n = 0, \dots,
              5$.
            correct: true
            feedback: >
              Right. The largest take is $6$, so the label of $n$ is a
              function of the six labels before it. A window of six that
              recurs forces the next label to recur, then the next, by
              induction, forever.
          - text: >
              The label of $n$ depends on $3$ earlier labels, one per legal
              move, and three labels have repeated.
            feedback: >
              The three labels it reads are $n-1$, $n-4$ and $n-6$, which
              spread over six positions. A matching window has to be six
              wide, the largest take, not three.
        feedback: >
          Confirm a period with a window as wide as the largest take. Here
          that means checking up to $n = 10$; the period then runs forever by
          induction.

      - part: Back to thirty-four
        ask: >
          $34 \equiv 4 \pmod 5$, so it is an N-position. Which pile size should
          your move leave?
        expects: "30"
        hint: >
          You can leave $33$, $30$ or $28$. Which is $0$ or $2 \pmod 5$?
        feedback: >
          $33 \equiv 3$ and $28 \equiv 3$ are N; $30 \equiv 0$ is P. Take $4$
          and leave $30$.
      - ask: >
          The opponent takes $4$ from your $30$, leaving $26$. How many of your
          three replies win?
        expects: "3"
        hint: >
          Check $25$, $22$ and $20$ against the rule.
        feedback: >
          $25 \equiv 0$, $22 \equiv 2$ and $20 \equiv 0$ are all P-positions,
          so all three replies win. With gaps in the take set there need not be
          a single "restoring" reply; the table tells you which moves work.
      - ask: >
          The interviewer changes the takes to $\{1, 2, 6\}$. The labels for
          $n = 0, \dots, 5$ come out P N N P N N, the familiar multiples-of-$3$
          pattern. Is $n = 6$ a P-position?
        choices:
          - text: >
              Yes: the multiples-of-$3$ pattern has already repeated once.
            feedback: >
              It has repeated over a window of three, but the largest take is
              $6$, and the take of $6$ has not been used yet. From $6$ it
              reaches $0$.
          - text: >
              No: $n = 6$ can take $6$ and reach $0$, a P-position, so it is N.
            correct: true
            feedback: >
              Right. The pattern breaks the moment the big take comes into
              range. The table goes on P N N P N N N, and that block of seven
              repeats: P exactly at $n \equiv 0$ or $3 \pmod 7$.
          - text: >
              It cannot be decided without the labels beyond $6$.
            feedback: >
              The label of $6$ only uses smaller piles, $5$, $4$ and $0$, all
              already known. The table never looks forward.
        feedback: >
          A pattern is only confirmed once a window as wide as the largest
          take has repeated. Before that, a big take that has not yet come
          into range can still overturn it.
      - teach: >
          Said aloud: "Losing positions for the mover are $n \equiv 0$ or $2
          \pmod 5$. I built the table to ten, and the label of $n$ only reads
          the six before it, so the period is proved. From $34$, I take $4$
          and leave $30$."

  - node: quant-puzzles.nim-games.subtraction-game-period
    hook: >
      "Prove the pattern repeats forever" is a fair follow-up to any table you've just built, and the honest answer is a pigeonhole argument, not "I checked a few more values and it held."
    explanation: >
      Fix a finite set of allowed take sizes $S$ and play "remove some $s \in S$ from a pile of $n$; last to take wins." The label of $n$ is a function only of the labels of $n-s$ for the $s \in S$ with $s \le n$ — a window of width $\max S$ behind $n$ — and that window can take only finitely many shapes, one of two labels per slot. With more values of $n$ than possible window shapes, some shape must repeat by pigeonhole; and because the labelling rule is a deterministic function of the window, a repeated window forces every label after it to repeat too. That's the actual proof behind "the pattern always settles down," not just an observation about a few computed rows.

      Two shapes of $S$ are worth having memorized rather than re-derived every time. If $S = \{1, 2, \dots, k\}$, the P-positions are exactly the multiples of $k+1$: from a multiple, any move of size $1$ through $k$ lands strictly between two consecutive multiples, so it's forced onto a non-multiple; from a non-multiple $n$, removing $n \bmod (k+1)$ — a legal size, since it's between $1$ and $k$ — restores a multiple. If instead $S = \{1,3,4\}$, tabulating gives P-positions at $n \equiv 0$ or $2 \pmod 7$ — a genuinely different, longer period than $\max S + 1 = 5$, a reminder that only the consecutive-integer case reduces to that clean formula; anything else needs the table.
    worked: >
      Take $S = \{1,2,3,4,5\}$ on a pile of $50$: since $S$ is the full run $1$ through $5$, the P-positions are multiples of $6$. Here $50 = 6\times 8 + 2$, so $50$ is an N-position: remove $2$ counters to leave $48$, a multiple of $6$. From there, whatever the opponent removes — some $s$ between $1$ and $5$ — reply with $6-s$, which restores a multiple of $6$ every time, until the opponent is left facing the pile at $0$ and cannot move.
    interview: >
      Handed an arbitrary take set, an interviewer is watching for two things in order: do you recognize the consecutive-run case and quote multiples of $k+1$ immediately, and, if the set isn't consecutive, do you fall back to building the table rather than guessing a formula that doesn't apply.
    pitfalls: >
      Assuming every subtraction game has period exactly $\max S + 1$ — true only for the consecutive-run case; $S=\{1,3,4\}$ already has period $7$, not $5$. Quoting "multiples of $k+1$" for a set that isn't the full run $1$ through $k$ — a single missing value, like $S=\{1,2,4\}$, breaks the clean formula and needs its own table.
    recap: >
      Any fixed take-set subtraction game becomes periodic by pigeonhole on the window of recent labels; the run $S=\{1,\dots,k\}$ gives the clean multiples-of-$(k+1)$ pattern, but any other $S$ needs its own table and can have a longer period.
    dialogue:
      - part: Eighty-three counters, takes up to seven
        teach: >
          A pile of $83$ counters. A move removes anywhere from $1$ to $7$
          counters, and whoever takes the last counter wins. You are to move.
          The interviewer wants the move, and then a proof that it wins.
      - ask: >
          How many counters do you take?
        expects: "3"
        hint: >
          Work backwards from the end. What is the smallest pile you would
          love to hand your opponent, other than $0$?
        feedback: >
          A pile of $8$ is a loss for the mover: any take of $1$ to $7$ leaves
          $1$ to $7$, which the other player clears. The same holds for $16,
          24, \dots$, so you want to leave a multiple of $8$. Since $83 = 80 +
          3$, take $3$ and leave $80$.
      - ask: >
          You leave $80$, and the opponent takes $k$ counters. Why can you
          always get back to a multiple of $8$?
        choices:
          - text: >
              Copy them: take $k$ as well.
            feedback: >
              That leaves $80 - 2k$, a multiple of $8$ only when $k = 4$. Copying
              is the right idea for two equal piles, not for one pile and a
              modulus.
          - text: >
              Take $8 - k$, which is always between $1$ and $7$.
            correct: true
            feedback: >
              Right. The pair of moves removes exactly $8$, so you land on
              $72$, and $8 - k$ is a legal take because $1 \le k \le 7$.
          - text: >
              Always take $7$, the most you can.
            feedback: >
              After a take of $3$ by the opponent, your $7$ leaves $70$, not a
              multiple of $8$. The reply has to depend on what they took.
        feedback: >
          That is one half of the proof: from a non-multiple of $8$ you can
          always restore one.
      - ask: >
          Facing $72$, could the opponent ever hand you a multiple of $8$?
        choices:
          - text: >
              Yes, by taking $8$.
            feedback: >
              The largest take is $7$. Taking $8$ is exactly what the rules
              forbid, and it is why $8$ is the modulus.
          - text: >
              No: any take of $1$ to $7$ leaves $65$ to $71$, strictly between
              two multiples of $8$.
            correct: true
            feedback: >
              Right. From a multiple of $k+1$, every take of $1$ to $k$ lands
              strictly between it and the next multiple down.
          - text: >
              Only if they take nothing, which is not allowed.
            feedback: >
              True as far as it goes, but every legal take, not just the
              empty one, fails to reach a multiple of $8$. That is the point
              to state: all of $65$ to $71$ are non-multiples.
        feedback: >
          Both halves together: from a multiple of $8$ every move leaves a
          non-multiple, and from a non-multiple some move restores one. With
          takes $\{1, \dots, k\}$ the P-positions are exactly the multiples of
          $k+1$.

      - part: A take set with gaps
        ask: >
          Now the takes are $\{2, 4, 7\}$; a pile of $0$ or $1$ has no move.
          Label $n = 0, 1, \dots, 8$. How many of these nine are P-positions?
        expects: "3"
        hint: >
          Piles $0$ and $1$ have no move at all. After that, $n$ reaches $n-2$,
          $n-4$ and $n-7$ where these are at least $0$.
        feedback: >
          The labels read P P N N N N P N N. Piles $0$ and $1$ are terminal,
          so P. $2$ to $5$ each reach $0$ or $1$, so N. $6$ reaches only $4$
          and $2$, both N, so P. $7$ reaches $0$ and $8$ reaches $6$, so both
          are N. Three P-positions: $0$, $1$, $6$.
      - reflect: >
          No formula predicted that table, and you could tabulate any finite
          take set the same way. Why must the labels of *every* finite take
          set eventually repeat forever, whatever pattern they show at first?
        hint: >
          What does the label of $n$ actually depend on, and how many
          different things can that be?
        answer: >
          The label of $n$ is determined by the $\max S$ labels just before it,
          since no move reaches further back. A block of $\max S$ labels, each
          P or N, can take only $2^{\max S}$ shapes, so among the first
          $2^{\max S} + 1$ blocks two must be identical. Since each block
          determines the label after it, the labels following those two blocks
          agree forever. That is pigeonhole, and it is the whole proof.
      - teach: >
          That is the proposition. For any finite take set $S$, the P/N
          labels are *eventually* periodic: the window of the last $\max S$
          labels determines the next one, and only $2^{\max S}$ windows exist,
          so one recurs and everything after it repeats. "Eventually" matters,
          because the start of the table can sit outside the cycle. With no
          gaps, $S = \{1, \dots, k\}$, the cycle is the clean one you just
          proved: multiples of $k+1$.
      - ask: >
          For $S = \{2, 4, 7\}$, how many different windows of labels are
          possible, the bound pigeonhole puts on how long the table can go
          before repeating?
        expects: "128"
        feedback: >
          The window is $\max S = 7$ labels wide, each P or N: $2^{7} = 128$
          shapes. In practice the repeat comes far sooner, but the bound is
          what makes the argument a proof.
      - ask: >
          Carried further, the $\{2, 4, 7\}$ table continues P N N P N N P N N
          from $n = 6$ onwards. Which description is right?
        choices:
          - text: >
              P exactly at the multiples of $3$.
            feedback: >
              $n = 3$ is a multiple of $3$ and N (take $2$ to reach the
              terminal pile $1$), and $n = 1$ is P without being a multiple.
              The rule fails at the start.
          - text: >
              From $n = 4$ on, P exactly at the multiples of $3$; below that,
              only $0$ and $1$ are P.
            correct: true
            feedback: >
              Right. The cycle P N N takes over once the small piles stop
              mattering; $0$, $1$ and $3$ are the exceptions before it. That
              is what "eventually periodic" means in practice.
          - text: >
              Period $7$, the largest take.
            feedback: >
              The largest take sets the window width, not the period. The
              period here is $3$, much shorter than the window.
        feedback: >
          The window bounds when the cycle must begin and how long it can be;
          only the table tells you what it is.
      - ask: >
          Same takes, $\{2, 4, 7\}$. From a pile of $50$, which pile size
          should you leave?
        expects: "48"
        hint: >
          You can leave $48$, $46$ or $43$.
        feedback: >
          $48$ is a multiple of $3$ and well past the start of the cycle, so it
          is P. $46$ and $43$ are $\equiv 1 \pmod 3$, so N. Take $2$ and leave
          $48$.

      - part: Where the clean formula stops
        ask: >
          The takes are $\{1, 2, 4\}$. A candidate reasons "the largest take is
          $4$, so the losing piles are the multiples of $5$". Which is right?
        choices:
          - text: >
              Multiples of $5$, as the candidate says.
            feedback: >
              From $5$ you can take $2$ and leave $3$, which is P (it reaches
              only $2$ and $1$, both N). So $5$ is N, and the candidate's
              formula fails at its first test.
          - text: >
              Multiples of $3$.
            correct: true
            feedback: >
              Right. $0$ is P, $1$ and $2$ are N, $3$ is P, and from any
              multiple of $3$ the takes $1, 2, 4$ leave remainders $2, 1, 2$:
              never a multiple. From a non-multiple, a take of $1$ or $2$
              restores one.
          - text: >
              Multiples of $4$.
            feedback: >
              From $4$ you can take $1$ and leave $3$, a P-position, so $4$ is
              N.
        feedback: >
          "Multiples of $k+1$" is a theorem about the gapless set $\{1, \dots,
          k\}$. Remove a single take and it no longer applies; build the
          table.
      - ask: >
          Which hypothesis does the periodicity proof use in an essential way?
        choices:
          - text: >
              That $S$ is finite, so a window of $\max S$ labels exists and has
              finitely many shapes.
            correct: true
            feedback: >
              Right. With infinitely many takes allowed, a label can depend on
              labels arbitrarily far back, there is no finite window, and
              pigeonhole has nothing to count.
          - text: >
              That $S$ contains $1$.
            feedback: >
              $\{2, 4, 7\}$ has no $1$ and is still eventually periodic. A
              missing $1$ only adds terminal positions at the bottom of the
              table.
          - text: >
              That $S$ has no gaps.
            feedback: >
              Gaps change *which* period you get, not whether there is one:
              $\{2, 4, 7\}$ and $\{1, 2, 4\}$ both settle down.
        feedback: >
          Finite $S$ means a finite window, and a finite window means
          pigeonhole. That is all the proof needs.

  - node: quant-puzzles.nim-games.race-to-n
    hook: >
      "Do you want to go first?" is a trap question in the race-to-$N$ setup — the honest answer depends on a single mod computation, and answering "first" out of habit loses exactly the games where it's the wrong call.
    explanation: >
      The running total's distance to the goal behaves exactly like a subtraction-game pile: it starts at the goal value, each turn some amount from $1$ to $m$ is removed from that distance (added to the total), and whoever reduces the distance to exactly $0$ — says the goal number — wins under normal play. That's precisely the consecutive-run case just proved, with take-set $\{1,\dots,m\}$, so its P-positions transfer directly: the distance is a losing position for whoever must move from it exactly when it's a multiple of $m+1$.

      The procedure is then one computation: let $r$ be the goal reduced modulo $m+1$. If $r \ne 0$, the starting distance (the goal itself) is not a multiple of $m+1$, so it's an N-position and the first player wins — go first, open by saying $r$, which trims the distance down to the nearest multiple of $m+1$, and thereafter answer any opponent move of $k$ with $m+1-k$, restoring a multiple of $m+1$ every turn until the opponent faces distance $0$ with nothing left to say. If $r = 0$, the starting distance is already a multiple of $m+1$ — a losing position for whoever must move from it — so go second instead, and apply the identical reply rule to whatever the first player opens with.

      The two failure modes here are both off-by-one errors: using modulus $m$ instead of $m+1$, and counting control points forward from $0$ instead of backward from the goal, which silently shifts every one of them.
    worked: >
      "Add a number from $1$ to $4$ to a running total starting at $0$; whoever says $30$ wins." Here $m=4$, so the modulus is $5$, and $30 \bmod 5 = 0$ — the goal is already a multiple of $5$, so the first player is stuck in a losing position: go second. Whatever the opening player says, $k$, reply with $5-k$: if they say $3$, reply $2$, reaching a running total of $5$; if they then say $4$, reply $1$, reaching $10$; continuing this way lands on $15, 20, 25$, and finally $30$ on your turn — the second player wins every time, the opposite conclusion from the goal-$100$-by-$10$ version, purely because $30 \equiv 0 \pmod 5$ while $100 \equiv 1 \pmod{11}$.
    interview: >
      "We're racing to $N$, adding $1$ through $m$ each turn — go first or second?" is asked almost verbatim; the interviewer wants the modulus $m+1$ named immediately, the residue of the goal computed on the spot, and a concrete reply rule stated, not just a correct yes-or-no on who wins.
    pitfalls: >
      Reflexively choosing to go first — a goal that's already a multiple of $m+1$, like $30 \bmod 5 = 0$, is exactly the case where first is the losing seat. Using $m$ instead of $m+1$ as the modulus, which silently shifts every control point and produces a wrong opening number even when the go-first-or-second call happens to still be right.
    recap: >
      A race to $N$ adding $1$ through $m$ is a subtraction game on the distance to $N$: compute $N \bmod (m+1)$, go first and open with that residue if it's nonzero, go second and mirror otherwise.
    dialogue:
      - part: Racing to sixty
        teach: >
          "We take turns adding a whole number from $1$ to $8$ to a running
          total that starts at $0$; the total may never pass $60$. Whoever
          says $60$ wins. Do you want to go first or second?"
      - ask: >
          Start at the end. What total do you want your opponent to be facing,
          on their turn, so that whatever they add you can then say $60$?
        expects: "51"
        hint: >
          From that total, their additions of $1$ to $8$ must all land within
          reach of $60$.
        feedback: >
          From $51$ they can reach only $52$ through $59$, and each of those is
          within $8$ of $60$, so you finish. Leave them on $50$ and they add
          $1$ to stand on $51$ themselves; leave them on $52$ or more and they
          say $60$ directly.
      - ask: >
          One step further back: what total do you want to hand them so that
          you can then reach $51$?
        expects: "42"
        feedback: >
          The same argument, shifted: from $42$ they reach $43$ through $50$,
          each within $8$ of $51$. The control totals step down by $9$:
          $60, 51, 42, \dots$
      - ask: >
          Keep stepping down by $9$. What is the smallest control total above
          $0$?
        expects: "6"
        hint: >
          Which number between $1$ and $9$ leaves the same remainder as $60$
          on division by $9$?
        feedback: >
          $60, 51, 42, 33, 24, 15, 6$. Below $6$ comes $-3$, so $6$ is the
          first one, and $60 = 6 \times 9 + 6$.
      - ask: >
          So which seat do you take?
        choices:
          - text: >
              Second: let the opponent open, then react.
            feedback: >
              Moving second hands the opponent the chance to say $6$, the
              first control total, and from then on they hold every control
              total down to $60$.
          - text: >
              First, and say $8$, the biggest step toward $60$.
            feedback: >
              $8$ is not a control total. The opponent adds $7$, says $15$, and
              now they are the one walking the ladder $15, 24, \dots, 60$.
          - text: >
              First, and say $6$.
            correct: true
            feedback: >
              Right. You stand on the first control total immediately and
              never leave the ladder.
        feedback: >
          Go first, say $6$, and from then on always land on a total that is
          $6$ more than a multiple of $9$.
      - ask: >
          You said $6$; the opponent adds $3$ and says $9$. What number do you
          add?
        expects: "6"
        hint: >
          Your target is the next control total, $15$.
        feedback: >
          $15 - 9 = 6$. In general, after their $k$ you add $9 - k$, so each
          round adds exactly $9$. Since $1 \le k \le 8$, the reply $9 - k$ is
          always a legal addition.

      - part: The race is a pile in disguise
        reflect: >
          You have solved this race before, in disguise. Which game is it, and
          what plays the part of the pile?
        answer: >
          The distance left to $60$ is a pile of counters. Each turn removes
          $1$ to $8$ from it, and whoever brings it to exactly $0$ wins: a
          subtraction game with takes $\{1, \dots, 8\}$. Its losing piles are
          the multiples of $9$, so the totals to stand on are those whose
          distance to $60$ is a multiple of $9$, the totals $\equiv 60 \equiv 6
          \pmod 9$.
      - teach: >
          So the general recipe for racing to $N$ in steps of $1$ to $m$:
          compute $r = N \bmod (m+1)$. If $r \ne 0$, go first, say $r$, and
          answer each $k$ with $m + 1 - k$. If $r = 0$, the starting total is
          already a control total, so go second and use the same reply.

      - part: A second race and two traps
        ask: >
          A new race: add $1$ to $5$ each turn, and whoever says $42$ wins.
          Which seat do you want?
        choices:
          - text: >
              First, opening with $2$.
            feedback: >
              $2$ would be right if the modulus were $5$, but steps of $1$ to
              $5$ mean modulus $6$, and $42 = 7 \times 6$ leaves remainder $0$.
              The opponent replies $4$ to say $6$ and takes over the ladder.
          - text: >
              Second, answering each $k$ with $6 - k$.
            correct: true
            feedback: >
              Right. $42 \bmod 6 = 0$, so $0$ is already a control total. The
              opener has to leave it, and you restore $6, 12, \dots, 42$.
          - text: >
              First, opening with $5$ to get ahead.
            feedback: >
              Getting ahead does not matter; landing on a control total does.
              After your $5$ the opponent adds $1$ and says $6$.
        feedback: >
          A remainder of $0$ means the first seat loses. Answering "first"
          reflexively is the classic mistake on this question.
      - ask: >
          Back to the race to $60$ in steps of $1$ to $8$. A candidate divides by
          $8$ instead of $9$, gets $60 \bmod 8 = 4$, and opens with $4$. What
          should the opponent add?
        expects: "2"
        hint: >
          Which control total is within reach of $4$?
        feedback: >
          The opponent adds $2$ and says $6$, the real first control total,
          and wins from there. Modulus $m$ instead of $m + 1$ shifts every
          control total and hands the ladder to the other player.
      - ask: >
          Misère version: steps of $1$ to $8$, but whoever says $60$ *loses*.
          You go first. What number do you open with?
        expects: "5"
        hint: >
          Saying $60$ loses, so the total you want to say is $59$: whoever
          says it forces the opponent to say $60$.
        feedback: >
          Now $59$ is the target, so the control totals are $59, 50, 41, 32,
          23, 14, 5$, and $59 = 6 \times 9 + 5$. Open with $5$ and reply $9 -
          k$. The misère race is just a normal race to $N - 1$.
      - teach: >
          Said aloud: "Steps up to $8$, so I work mod $9$. $60$ leaves
          remainder $6$, so I go first, say $6$, and answer every $k$ with $9 -
          k$; that keeps me on $6, 15, 24, \dots, 60$."

  - node: quant-puzzles.nim-games.nim-rules
    hook: >
      "Piles of stones, take any number from one pile, last to take wins" is the single most-recycled interview setup in this entire topic, and every version of it — however it's dressed up — reduces to exactly this definition.
    explanation: >
      Nim is played with several piles of counters; a move chooses exactly one pile and removes any positive number of counters from it, anywhere from a single counter up to the whole pile, and under normal play the player who removes the last counter overall wins. A position is fully described by the multiset of pile sizes — the piles have no identity beyond their size, so order doesn't matter and an emptied pile can simply be dropped from the list.

      A single pile is the base case and it's immediate: whoever moves takes the whole pile and wins on the spot, since there's nothing left to stop them. Multiple piles are where the game stops being obvious — with piles of sizes $a_1, \dots, a_m$, there are $a_1 + \dots + a_m$ distinct single-pile moves available from the start alone, far too many to eyeball a winning line by inspection once $m$ grows past two or three.

      Nim earns its central place in this unit for a reason beyond being a fun puzzle: it's the instance every other impartial game under normal play eventually gets compared to, which is why it's worth memorizing the rules cold — most interview questions that look unrelated turn out to be Nim wearing a costume.
    worked: >
      From piles $(2,3)$, the legal moves are: take $1$ or $2$ from the first pile, giving $(1,3)$ or $(0,3)$, or take $1$, $2$, or $3$ from the second, giving $(2,2)$, $(2,1)$, or $(2,0)$ — five options, one pile touched per move, any positive amount from it. Play one line to the end: from $(2,3)$, take $2$ from the second pile to reach $(2,1)$; the opponent takes $1$ from the first pile, reaching $(1,1)$; you take the whole first pile, reaching $(0,1)$; the opponent must take the last counter from the remaining pile, and having taken it, wins this particular line. Total counters strictly fall on every move — $5,3,2,1,0$ — which is what guarantees the game can't go on forever, regardless of how either side plays.
    interview: >
      Interviewers open Nim questions by stating piles and asking "who wins, and what's the move" — but the first thing worth confirming out loud is the convention: last counter wins (normal) or last counter loses (misère), since both are common phrasings and the analysis genuinely differs.
    pitfalls: >
      Removing counters from more than one pile in a single turn — illegal; exactly one pile per move, any positive amount from it. Assuming normal play by default when the prompt actually states the misère form ("whoever takes the last stone loses") without saying so explicitly.
    recap: >
      Nim is piles of counters where one move empties or shrinks exactly one pile and the last counter taken wins under normal play — trivial with one pile, and the reference point every other impartial game gets measured against.
    dialogue:
      - part: Three piles on the table
        teach: >
          Three piles of coins sit on the table: $1$, $4$ and $6$. On your turn
          you pick one pile and remove as many coins from it as you like, at
          least one and at most the whole pile. Whoever takes the last coin
          wins. It is your turn.
      - ask: >
          How many different moves do you have?
        expects: "11"
        hint: >
          Count pile by pile. How many different amounts can you take from a
          pile of $a$?
        feedback: >
          A pile of $a$ offers $a$ moves, taking $1$ through $a$. So $1 + 4 + 6 =
          11$ moves in all.
      - ask: >
          Which of these is *not* a move?
        choices:
          - text: >
              Take all $6$ coins from the six-pile.
            feedback: >
              Legal: any amount up to the whole pile. The position afterwards
              is just the two piles $1$ and $4$.
          - text: >
              Take $1$ coin from the four-pile and $1$ from the six-pile.
            correct: true
            feedback: >
              Right. A move touches exactly one pile. Two coins from two piles
              is two moves, and you only get one per turn.
          - text: >
              Take the single coin in the one-pile.
            feedback: >
              Legal: the whole pile, which happens to be one coin.
          - text: >
              Take $3$ from the four-pile, leaving $1$.
            feedback: >
              Legal: one pile, a positive amount, no more than it holds.
        feedback: >
          One pile per move, any positive amount up to the whole pile, and no
          passing.
      - ask: >
          You take the whole six-pile, and someone records the position as
          $(1, 4, 0)$. Your opponent writes it as $(4, 1)$. Are these the same
          position?
        choices:
          - text: >
              No: the piles are listed in a different order.
            feedback: >
              Piles have no names and no places. A move picks *some* pile, so
              which one is written first changes nothing about what either
              player can do.
          - text: >
              No: one has three piles and the other two.
            feedback: >
              An empty pile offers no moves, so it might as well not be there.
              Every move from $(1, 4, 0)$ is a move from $(4, 1)$, and the
              reverse.
          - text: >
              Yes: order does not matter and an empty pile can be dropped.
            correct: true
            feedback: >
              Right. Everything a player can do is determined by the
              collection of nonempty pile sizes, with repeats counted.
        feedback: >
          A position is the multiset of nonempty pile sizes: $(1, 4, 0)$,
          $(4, 1)$ and $(1, 4)$ all name the same position.

      - part: The smallest positions, and what you were checking
        ask: >
          A single pile of $9$ coins, your move. How many coins do you take?
        expects: "9"
        feedback: >
          All of them: you take the last coin and win on the spot. One pile is
          always a win for the mover, which is why the interesting positions
          have two or more piles.
      - ask: >
          Two piles of $1$ coin each, your move. Who wins?
        choices:
          - text: >
              You do: you move first, and moving first is an advantage.
            feedback: >
              You have only one kind of move: take one of the single coins.
              Your opponent then takes the other, which is the last coin.
          - text: >
              Your opponent: whatever you take, they take the last coin.
            correct: true
            feedback: >
              Right. Both of your moves leave a single coin, and a single pile
              is a win for whoever faces it.
          - text: >
              Nobody: the game is symmetric, so it is a draw.
            feedback: >
              Nim cannot be drawn. The coins run out after exactly two moves,
              and whoever takes the second coin wins.
        feedback: >
          With more than one pile, being on move can be a curse. Finding out
          when is the subject of every Nim question.
      - reflect: >
          Look back at the move you ruled out. What exactly were you checking
          about a proposed move, and what about a position did you decide does
          *not* matter?
        answer: >
          Three things about a move: it touches exactly one pile, it removes at
          least one coin, and it removes no more than that pile holds. About a
          position, only the sizes of the nonempty piles matter: not their
          order, not empty piles, not how the position arose. Together with
          "last coin wins", that is the entire game.
      - teach: >
          That game is Nim: piles of counters; a move picks one pile and
          removes any positive number from it, up to the whole pile; under
          normal play the player taking the last counter wins. A position is
          the multiset of pile sizes. Nim matters beyond itself: every finite
          impartial game under normal play turns out to behave like a single
          Nim pile, so it is the reference game for this whole unit.

      - part: Which of these is still Nim
        ask: >
          A variant: same piles, same "last coin wins", but a move may remove
          at most $3$ coins. Is this Nim?
        choices:
          - text: >
              Yes: it still uses one pile per move.
            feedback: >
              One pile per move is one clause of three. "Any positive number up
              to the whole pile" is gone, so from a pile of $6$ you can no
              longer clear it.
          - text: >
              No: the cap breaks "any number up to the whole pile"; it is a
              different take-away game.
            correct: true
            feedback: >
              Right. It is still finite and impartial, so it can still be
              solved, but its answers are not Nim's answers.
          - text: >
              No: it is no longer impartial.
            feedback: >
              Both players still face the same cap from the same piles, so it
              is impartial. What changed is the move rule itself.
        feedback: >
          A cap on the take turns each pile into a separate subtraction game.
          Change any one clause and you are playing a different game.
      - ask: >
          Another variant: the moves of Nim exactly, but whoever takes the last
          coin *loses*. Which clause has changed?
        choices:
          - text: >
              The move rule: you are now forced to leave at least one coin.
            feedback: >
              Taking the last coin is still a legal move; it just loses. The
              moves are exactly Nim's.
          - text: >
              None: this is the same game.
            feedback: >
              From two single coins, the mover now *wins*: they take one, and
              the opponent must take the last. The answer to "who wins" has
              flipped, so something changed.
          - text: >
              Only the convention: it is misère Nim.
            correct: true
            feedback: >
              Right. Same positions, same moves, opposite winning rule. The
              two games usually agree in the middle and part ways at the end,
              which is why you confirm the convention before anything else.
        feedback: >
          "Last counter wins" is part of the definition of Nim. Interviewers
          often state the misère form on purpose; ask which one they mean.

  - node: quant-puzzles.nim-games.equal-piles-mirroring
    hook: >
      "Two piles, same size — who wins?" is answered before you've computed anything, the instant you recognize a symmetry you can restore every single turn; spotting that is faster than any table.
    explanation: >
      Two equal piles of $a$ counters each is a loss for the player to move, by direct construction: whatever the opponent removes from one pile, remove exactly that many from the other. Every position handed back this way has two equal piles again, so the invariant "the piles are equal" survives every one of the mirrorer's replies, while the total counter count strictly drops on every single move by either player. Because the game must terminate and the mirrorer always restores the invariant, the empty position $(0,0)$ — a loss for whoever is asked to move from it — is always something the mirrorer hands to the opponent, never something the mirrorer is forced to face themselves.

      That construction is itself a full P/N proof, not just a cute trick: it exhibits, from every $(a,a)$, that every move leads somewhere the opponent (now facing unequal piles) can be answered back to equal — which is exactly what makes $(a,a)$ a P-position. Unequal piles $(a,b)$ with $a \ne b$ are consequently N-positions, and the winning move is visible immediately: take $|a-b|$ counters from the larger pile to equalize them, handing the opponent the P-position just proved to be a loss.

      The transferable procedure is: find an invariant that's symmetric between the players, check that any single move by the opponent can always be answered by a legal move restoring it, and check that some quantity strictly decreases so the exchange can't stall forever — the coins-on-a-round-table game and many mirroring puzzles beyond Nim all follow this exact three-part check.
    worked: >
      Take piles $(9,4)$. They're unequal, so equalize first: remove $5$ from the larger pile, reaching $(4,4)$ — now mirror. Say the opponent takes $3$ from one pile, reaching $(1,4)$; take $3$ from the other, reaching $(1,1)$. The opponent takes $1$, reaching $(0,1)$; take the remaining $1$, reaching $(0,0)$ — you take the last counter and win. The opponent was never once handed an equal pair to break out of, and the total strictly fell every step: $13, 8, 5, 2, 1, 0$.
    interview: >
      "Two piles, is it worth going first?" is testing whether equal-versus-unequal registers instantly, without table-building; a strong answer states the equalizing move for unequal piles in the same breath as naming who wins, since the move and the answer are the same fact here.
    pitfalls: >
      Mirroring blindly from an already-unequal starting position — the copy move only works once the piles are equal, so an unequal start needs one equalizing move first, made by whichever player is actually facing it. Assuming this argument extends to three or more piles without change; equal-pairs mirroring is specific to exactly two piles, and the general multi-pile case needs the XOR rule instead.
    recap: >
      Equal Nim piles are a loss for the mover — mirror every move in the other pile — and unequal piles are a win, by equalizing them with one move first.
    dialogue:
      - part: Two piles of ten, and a choice of seat
        teach: >
          Two piles of $10$ coins each. A move takes any positive number of
          coins from one pile; whoever takes the last coin wins. The
          interviewer offers you the choice: "Do you want to move first or
          second?"
      - ask: >
          Suppose you move second, and the interviewer opens by taking $4$ from
          the left pile, leaving $(6, 10)$. How many coins would you take from
          the right pile to leave a position shaped exactly like the one they
          just faced, only smaller?
        expects: "4"
        feedback: >
          Take $4$ from the right pile: $(6, 6)$. The interviewer is back
          where they started, two equal piles, with fewer coins.
      - ask: >
          You keep doing that: every time they take some coins from one pile,
          you take the same number from the other. Can the interviewer ever be
          the one to take the last coin?
        choices:
          - text: >
              Yes: eventually they will empty a pile, and then the other pile
              is theirs to finish.
            feedback: >
              When they empty one pile, you copy and empty the other: equal
              piles of $a$ become $(0, a)$, and you take all $a$. The last
              coin is yours.
          - text: >
              No: after each of your replies the piles are equal, so whenever
              they move there is a coin left for you to copy.
            correct: true
            feedback: >
              Right. They face equal piles, so if they take anything from one,
              the other still holds at least that much, and your copy is
              always legal. They can never take the last coin, because they
              never face a single nonempty pile.
          - text: >
              It depends on how many they take each time.
            feedback: >
              Copying works whatever they take. Large or small, the amount
              they remove from one pile is available in the other.
        feedback: >
          Copying never runs out of moves, and the game must end because the
          coin count falls every turn. When it ends, it is the interviewer who
          is stuck.
      - reflect: >
          Say in two sentences why copying cannot fail. What is true every
          time it is the interviewer's turn, and why must the game end with
          them stuck?
        answer: >
          Every time it is their turn the piles are equal, because you made
          them so, and from equal piles any move can be copied. The total falls
          on every move, so the game ends, and since you always have a reply,
          the player left with no move at $(0, 0)$ is them. Equal piles are
          a loss for the player to move.
      - teach: >
          That is the mirroring strategy, and it is a complete P/N argument.
          Two equal Nim piles $(a, a)$ are a P-position: the second player
          copies every move into the other pile. Two unequal piles $(a, b)$
          are an N-position: take $|a - b|$ from the larger pile to make them
          equal, and become the copier. So at $(10, 10)$, you choose to move
          second.

      - part: Unequal piles, and a copier who starts too early
        ask: >
          Piles $(13, 8)$, your move. How many coins do you take from the
          thirteen-pile?
        expects: "5"
        feedback: >
          $13 - 8 = 5$, leaving $(8, 8)$. From now on you copy.
      - ask: >
          After a few rounds the piles are $(3, 3)$, and the interviewer takes
          the whole left pile. How many coins do you take?
        expects: "3"
        feedback: >
          Copy: take all $3$ from the right pile. That is the last coin, and
          you win.
      - ask: >
          A friend plays $(13, 8)$ as the *second* player and announces "I will
          copy every move". The opener takes $5$ from the thirteen-pile,
          leaving $(8, 8)$. What goes wrong for the friend?
        choices:
          - text: >
              Nothing: copying the $5$ keeps things balanced.
            feedback: >
              Copying the $5$ from the eight-pile leaves $(8, 3)$, unequal,
              handed to the opener, who takes $5$ and is the copier from then
              on.
          - text: >
              The opener has just equalized; now the friend faces $(8, 8)$, a
              P-position, and any move they make can be copied against them.
            correct: true
            feedback: >
              Right. Copying is a strategy for the player who *hands over*
              equal piles, not for whoever announces it. From unequal piles,
              the mover equalizes first; the friend was never in the copying
              seat.
          - text: >
              The friend should copy from the same pile instead.
            feedback: >
              Taking another $5$ from the pile the opener just used leaves
              $(3, 8)$, still unequal and still the opener's to equalize.
        feedback: >
          Mirroring belongs to whoever hands over equal piles. From an unequal
          start, that is the first player, after one equalizing move.

      - part: Where copying breaks
        ask: >
          The interviewer adds a rule: a move may either take from one pile as
          usual, or take the *same* number from both piles. Piles $(6, 6)$, and
          you move second, planning to copy. What happens?
        choices:
          - text: >
              Copying still wins: the new move keeps the piles equal, which is
              what you want.
            feedback: >
              It keeps them equal on *your* turn. The interviewer takes $6$
              from both piles, the last coins are gone, and they have won
              before you move.
          - text: >
              It fails: the interviewer takes $6$ from both piles and wins at
              once.
            correct: true
            feedback: >
              Right. Copying needs every opponent move to break the symmetry,
              so you can restore it. A move that preserves the symmetry leaves
              you facing it, and here it simply ends the game.
          - text: >
              It fails only because the piles are even.
            feedback: >
              Parity is irrelevant: with the new rule, $(a, a)$ is a win for
              the mover for every $a$, by clearing both piles.
        feedback: >
          The mirror argument has a hidden hypothesis: no move maps a
          symmetric position to a symmetric one. That holds in Nim and fails
          as soon as a "do it to both" move is allowed.
      - ask: >
          The same idea outside Nim: players alternately place identical coins
          flat on a round table, without overlap; whoever cannot place loses.
          The first player wins by mirroring through the centre. Why must the
          first coin go exactly on the centre?
        choices:
          - text: >
              The centre is the only spot whose mirror image is itself, so it
              must be used up before mirroring can start.
            correct: true
            feedback: >
              Right. After it is taken, every legal placement has a free
              mirror image, and the first player becomes the copier, exactly
              as with two equal piles.
          - text: >
              A coin in the centre blocks the most space.
            feedback: >
              Blocking space is not the point; the opponent's spot could be
              anywhere. If the centre were free, the opponent could take it,
              and it has no mirror image to copy onto.
          - text: >
              It does not have to: any first move followed by copying works.
            feedback: >
              With the centre still free, copying is not safe for anyone: a
              coin later placed on the centre has no mirror image to answer
              it. Only once the centre is used does every placement have a
              free partner, so the first player uses it at once.
        feedback: >
          Mirroring needs a pairing of moves with no move paired to itself. In
          Nim the two piles provide it; on the table, the centre is the one
          spot that has to be removed first.

  - node: quant-puzzles.nim-games.nim-xor
    hook: >
      Three or more piles kill the mirroring trick outright, and Bouton's theorem is the fix: one bitwise computation replaces what would otherwise be an intractable table, and it's the single fact every interviewer expects cold.
    explanation: >
      Write each pile size in binary and define the nim-sum as the bitwise XOR of all the pile sizes, column by column with no carries: $a_1 \oplus a_2 \oplus \dots \oplus a_m$. Bouton's theorem says a Nim position is a P-position — a loss for whoever must move — exactly when its nim-sum is $0$, and proving it is exactly the two-direction P/N check applied with the nim-sum as the witness instead of a table.

      From nim-sum $0$: any legal move changes the size of exactly one pile, and changing one number while holding the rest fixed always changes the XOR of the whole set — if it didn't, that pile's new size would have to equal its old size, which a legal move (a strict decrease) never does. So every move out of a zero-nim-sum position lands on a nonzero one: P leads only to N.

      From nim-sum $s \ne 0$: take the highest set bit of $s$. Since that bit appears in the total XOR, an odd number of piles carry it, so at least one pile $a$ has that bit set. Because it's the highest set bit of $s$, all the bits of $a$ above it are unchanged by XOR-ing with $s$, and that bit itself flips from $1$ to $0$, so $a \oplus s < a$ — a strictly smaller, legal pile size. Removing $a - (a \oplus s)$ counters from that pile zeroes the nim-sum exactly. So every nonzero position has an explicit move to a zero one: N always has an escape to P.
    worked: >
      Take $(2,4,7)$: in binary, $2=010$, $4=100$, $7=111$; XOR-ing all three columns gives $2 \oplus 4 = 6$, then $6 \oplus 7 = 1$. The nim-sum is $1$, nonzero, so the mover wins. The highest (only) set bit of $1$ is bit $0$; among the piles, $7=111$ has that bit set ($2$ and $4$ don't, being even), so take pile $7$: $7 \oplus 1 = 6$, meaning remove $7-6=1$ counter from it. The new position is $(2,4,6)$, and checking: $2 \oplus 4 = 6$, $6 \oplus 6 = 0$ — nim-sum zero, the P-position just handed to the opponent.
    interview: >
      Any prompt with three or more piles is fishing for the nim-sum by name — state it as "XOR the pile sizes in binary; zero means the mover loses" within the first ten seconds, since hesitating here is the clearest sign of not knowing the rule cold.
    pitfalls: >
      Computing the piles' ordinary decimal sum, or a column AND, instead of a column XOR — the whole theorem is specific to XOR and none of these substitutes preserves it. Forgetting that "some pile carries the leading bit" only guarantees existence, not uniqueness — several piles can carry it, and any one of them supports a winning move.
    recap: >
      A Nim position is a loss for the mover exactly when the XOR of its pile sizes is $0$ — a single move always exists to zero a nonzero nim-sum, and no move can keep a zero one at zero.
    dialogue:
      - part: Three small piles that refuse to be won
        teach: >
          Nim with three piles: $1$, $2$ and $3$ coins. Take any positive
          number from one pile; whoever takes the last coin wins. It is your
          move, and the interviewer asks for your winning move.
      - ask: >
          First, a smaller position. Two piles of $2$, your move. Who wins?
        choices:
          - text: >
              You do: take a whole pile and leave a single pile of $2$.
            feedback: >
              A single pile is a win for whoever faces it: the opponent takes
              both coins.
          - text: >
              You do: take $1$ coin and leave $(1, 2)$.
            feedback: >
              From $(1, 2)$ the opponent takes $1$ from the two-pile, leaving
              $(1, 1)$. You take one coin, they take the last.
          - text: >
              Your opponent: both of your options lose.
            correct: true
            feedback: >
              Right. Up to order your moves give $(2)$ or $(1, 2)$, and each
              has a winning reply: clear the pile, or reduce to $(1, 1)$.
        feedback: >
          $(1, 1)$ and $(2, 2)$ are P-positions: the mover loses.
      - ask: >
          Back to $(1, 2, 3)$. You have $6$ moves. How many of them leave your
          opponent a winning reply?
        expects: "6"
        hint: >
          For each move, look for a reply that reaches $(1, 1)$, $(2, 2)$ or no
          coins at all.
        feedback: >
          All six. $(2, 3)$ and $(1, 2, 2)$ are answered by $(2, 2)$. $(1, 3)$,
          $(1, 1, 3)$, $(1, 1, 2)$ and $(1, 2)$ are answered by $(1, 1)$. So
          $(1, 2, 3)$ is a P-position: there is no winning move to find.
      - ask: >
          A tempting explanation: "$(1, 2, 3)$ loses because the largest pile
          equals the sum of the other two." Test it on $(2, 3, 5)$, where
          $5 = 2 + 3$. How many coins can you take from the five-pile to leave
          a P-position?
        expects: "4"
        hint: >
          Is there a P-position you already know that you could reach?
        feedback: >
          Take $4$, leaving $(2, 3, 1)$, which is $(1, 2, 3)$ in another order:
          a P-position. So $(2, 3, 5)$ is an N-position, and the sum rule is
          dead. Something finer is going on.
      - reflect: >
          Write the P-positions you know in binary, one pile per line: $(1,
          1)$, $(2, 2)$ and $(1, 2, 3)$, which is $01$, $10$, $11$. Look down
          each column. What do all three have in common?
        hint: >
          Count the $1$s in each column.
        answer: >
          Every column has an even number of $1$s. For $(1, 2, 3)$: the units
          column holds $1$ and $1$, the twos column holds $1$ and $1$. Equal
          piles have identical rows, so their columns pair off trivially.
          Losing positions look like positions where every binary column
          balances.
      - teach: >
          That balance has a name. The nim-sum $a_1 \oplus a_2 \oplus \dots
          \oplus a_m$ adds the piles' binary digits column by column modulo
          $2$, with no carries; it is $0$ exactly when every column has an even
          count. Bouton's theorem: a Nim position is a P-position exactly when
          its nim-sum is $0$. Check: $2 \oplus 3 \oplus 5 = 1 \oplus 5 = 4$,
          not $0$, and $(2, 3, 5)$ was indeed a win.

      - part: Why the balance decides the game
        ask: >
          The first half of the proof: from nim-sum $0$, why must every move
          produce a nonzero nim-sum?
        choices:
          - text: >
              A move makes the total smaller, and a smaller total has a
              nonzero nim-sum.
            feedback: >
              $(1, 1)$ has a smaller total than $(1, 2, 3)$ and nim-sum $0$.
              The size of the total says nothing about the columns.
          - text: >
              A move changes one pile; its new size differs from the old in at
              least one binary digit, and that column's count of $1$s changes
              by one, becoming odd.
            correct: true
            feedback: >
              Right. Only one row of the column table changes, so any column
              where it changed flips from even to odd. A balanced position
              cannot stay balanced.
          - text: >
              Because the second player can always copy the move.
            feedback: >
              Copying is a two-equal-piles argument. $(1, 2, 3)$ has no pile
              to copy into, and the column argument is what covers it.
        feedback: >
          From a P-candidate every move leads to an N-candidate. The other half
          is the harder one: from a nonzero nim-sum, a move back to zero must
          always exist.
      - ask: >
          Piles $(4, 7, 9)$. What is the nim-sum?
        expects: "10"
        hint: >
          In binary, $4 = 0100$, $7 = 0111$, $9 = 1001$.
        feedback: >
          Column by column: eights $0 + 0 + 1$, odd; fours $1 + 1 + 0$, even;
          twos $0 + 1 + 0$, odd; units $0 + 1 + 1$, even. That is $1010$, so
          the nim-sum is $10$, and $(4, 7, 9)$ is an N-position.
      - ask: >
          To zero a nim-sum of $s$, change one pile $a$ to $a \oplus s$: that
          flips exactly the odd columns. Here $s = 10$. Find the pile that can
          make this change, and give its new size.
        expects: "3"
        hint: >
          The new size has to be smaller than the old one. Which pile has a $1$
          in the eights column?
        feedback: >
          Only $9 = 1001$ has a $1$ in the leading column of $s = 1010$. Then
          $9 \oplus 10 = 0011 = 3$: take $6$ coins from the nine-pile and leave
          $(4, 7, 3)$, with $4 \oplus 7 = 3$ and $3 \oplus 3 = 0$.
      - ask: >
          Why not change the seven-pile instead? It has a $1$ in the twos
          column of $s$.
        choices:
          - text: >
              $7 \oplus 10 = 13$, larger than $7$: that "move" would add coins.
            correct: true
            feedback: >
              Right. Flipping the eights column turns a $0$ into a $1$ in
              $7$, which makes it bigger. Only a pile with a $1$ in the
              *leading* column of $s$ is guaranteed to get smaller.
          - text: >
              It would work just as well; any pile carrying a bit of $s$ does.
            feedback: >
              The target would be $7 \oplus 10 = 13$, and you cannot grow a
              pile from $7$ to $13$. A pile has to carry the leading bit of
              $s$.
          - text: >
              Because the largest pile must always be the one reduced.
            feedback: >
              Size is not the test; the leading bit is. In $(4, 7, 9)$ the
              largest pile happens to carry it, but often the carrier is a
              smaller pile.
        feedback: >
          The second half of the proof: the leading bit of $s \ne 0$ is odd in
          its column, so some pile $a$ has it. In $a \oplus s$ that bit turns
          off and only lower bits change, so $a \oplus s < a$, a legal move
          to nim-sum $0$.

      - part: A rule change that breaks it
        ask: >
          The interviewer allows a new kind of move: take coins from one pile
          *or from two piles at once*. Piles $(1, 1)$, nim-sum $0$. Who wins
          now, and which step of the proof broke?
        choices:
          - text: >
              The second player still wins: the nim-sum is $0$.
            feedback: >
              The mover takes both coins in one move and wins on the spot.
              The theorem is about Nim's moves, and these are not Nim's
              moves.
          - text: >
              The mover wins, and "a move changes only one pile" failed: a
              two-pile move can keep every column even.
            correct: true
            feedback: >
              Right. Changing two rows can flip a column twice and leave it
              balanced, so a zero nim-sum is no longer a trap. The theorem
              leans on exactly that one-pile clause.
          - text: >
              The mover wins, because the leading-bit step fails.
            feedback: >
              The leading-bit step still finds a zeroing move. What breaks is
              the other half: from nim-sum $0$, the opponent is no longer
              forced to unbalance a column.
        feedback: >
          Both halves of the proof use the rules: one pile per move, any amount
          down. Change the move rule and the nim-sum stops predicting the
          winner.

  - node: quant-puzzles.nim-games.nim-move-recipe
    hook: >
      Knowing Bouton's theorem and being able to execute it at the table under time pressure are different skills — this is the four-step drill that turns the XOR rule into an actual move, every time, including the misère twist near the end of the game.
    explanation: >
      Executing the winning move is four steps, run in order: write every pile size in binary; XOR the columns to get the nim-sum $s$; if $s = 0$, there's no move that helps — ask to move second instead; otherwise find the leading (highest) set bit of $s$, pick any pile whose binary representation has that bit set, and replace that pile's size $a$ with $a \oplus s$. The pile choice is never ambiguous about legality — the proof behind Bouton's theorem guarantees $a \oplus s < a$ whenever $a$ carries the leading bit of $s$, so the replacement is always a strict, legal decrease, never a request to add counters.

      Misère Nim, where taking the last counter loses instead of wins, follows the identical recipe with one exception saved for the very end: keep zeroing the nim-sum exactly as in normal play until the position has at most one pile of size greater than $1$. At that moment switch goals — instead of zeroing the nim-sum, make your move leave an odd number of piles of size exactly $1$ for the opponent, since from then on every move is forced (take a whole singleton pile), and a mover facing an odd count of singletons is the one left holding the last, losing counter.
    worked: >
      Normal play on $(5,6,9)$: binary, $5=0101$, $6=0110$, $9=1001$; $5 \oplus 6 = 3$, then $3 \oplus 9 = 10$ ($1010$ in binary). The nim-sum is $10$, leading bit at position $3$ (value $8$). Among the piles, only $9=1001$ carries that bit; $9 \oplus 10 = 3$, so remove $9-3=6$ counters from the third pile, leaving $(5,6,3)$. Check: $5 \oplus 6 = 3$, $3 \oplus 3 = 0$ — the nim-sum is zero, confirming the move.
    interview: >
      Interviewers watch the execution, not just the final move — narrate the binary, the column XOR, the leading bit, and the specific pile out loud, and if the setup is misère, say so and flag the endgame switch before you're asked about it.
    pitfalls: >
      Removing $s$ counters from the chosen pile instead of setting it to $a \oplus s$ — those are different numbers whenever $a \oplus s \ne a - s$, and the wrong one doesn't zero the nim-sum. Under misère play, reducing the last big pile to zero out of habit — from $(1,1,5)$ that leaves $(1,1)$, an even two singletons, which hands the loss straight back to you; reducing it to $(1,1,1)$ instead leaves an odd three, which is what actually wins.
    recap: >
      Binary the piles, XOR them, replace a pile carrying the nim-sum's leading bit with $a \oplus s$ — identical under misère until one pile remains above $1$, where the goal flips to leaving an odd number of singletons.
    dialogue:
      - part: Thirty seconds on three piles
        teach: >
          Nim on piles $(3, 8, 14)$, normal play. The interviewer starts a
          timer: "Your move. You have thirty seconds, and tell me why it wins."
      - ask: >
          The slow way is to try every move and check what it leaves. How many
          moves are there to try?
        expects: "25"
        feedback: >
          $3 + 8 + 14 = 25$ moves, and checking each one means computing a
          nim-sum. That is not a thirty-second job; the point is to go straight
          to the one that works.
      - ask: >
          Start with the nim-sum of $(3, 8, 14)$.
        expects: "5"
        hint: >
          In binary: $3 = 0011$, $8 = 1000$, $14 = 1110$. Count the $1$s in each
          column.
        feedback: >
          Eights: $0 + 1 + 1$, even. Fours: $0 + 0 + 1$, odd. Twos: $1 + 0 + 1$,
          even. Units: $1 + 0 + 0$, odd. So the nim-sum is $0101 = 5$, nonzero:
          you are the one who can win.
      - reflect: >
          The nim-sum $0101$ says the fours and units columns are odd. You get
          to change exactly one pile. Which columns must that pile's binary
          change in, what does that make its new size, and which pile can
          afford it?
        hint: >
          Changing a pile's digit in an even column makes that column odd.
        answer: >
          The pile must flip its digits in exactly the odd columns, the fours
          and the units, and nowhere else: its new size is $a \oplus 5$. That
          has to be smaller than $a$, so the highest flipped digit must go from
          $1$ to $0$: the pile needs a $1$ in the fours column, the leading
          column of the nim-sum. Only $14 = 1110$ has one.
      - teach: >
          That is the whole recipe, in order. Write the piles in binary. XOR
          the columns to get $s$; if $s = 0$, ask to move second. Otherwise
          find the leading $1$ of $s$, pick any pile $a$ with a $1$ in that
          column, and reduce that pile to $a \oplus s$. Thirty seconds is
          plenty.
      - ask: >
          What size should the fourteen-pile become?
        expects: "11"
        hint: >
          Flip the fours and units digits of $1110$.
        feedback: >
          $14 \oplus 5 = 1110 \oplus 0101 = 1011 = 11$. Take $3$ coins and leave
          $(3, 8, 11)$. Check: $3 \oplus 8 = 11$, and $11 \oplus 11 = 0$.

      - part: Two ways to fumble it
        ask: >
          A candidate reasons: "The nim-sum is $5$, so I take $5$ coins from the
          fourteen-pile." What happens?
        choices:
          - text: >
              It works: removing $s$ coins is the same as reducing to $a \oplus
              s$.
            feedback: >
              $14 - 5 = 9$, but $14 \oplus 5 = 11$. The two agree only when the
              bits of $s$ all sit under $1$s of $a$, and here the units digit
              of $14$ is $0$.
          - text: >
              It leaves $(3, 8, 9)$, with nim-sum $3 \oplus 8 \oplus 9 = 2$, so
              the opponent now has the winning move.
            correct: true
            feedback: >
              Right. XOR is not subtraction. The rule is "reduce to $a \oplus
              s$", and the number of coins removed is whatever that takes, here
              $3$.
          - text: >
              It is illegal: you may not take more than $3$ from that pile.
            feedback: >
              Nim allows any amount up to the whole pile, so taking $5$ from
              $14$ is legal. It is just the wrong move.
        feedback: >
          Say the target size, not the amount: "reduce fourteen to eleven".
          The amount follows from it.
      - ask: >
          Another candidate notices that $3 = 0011$ also has a $1$ in a column
          where $s$ has one, the units, and tries to change the three-pile.
          What goes wrong?
        choices:
          - text: >
              $3 \oplus 5 = 6$, larger than $3$: the "move" would add coins.
            correct: true
            feedback: >
              Right. The pile has a $0$ in the fours column, so flipping it
              there turns a $0$ into a $1$. Only a pile with a $1$ in the
              *leading* column of $s$ is sure to shrink.
          - text: >
              Nothing: any pile sharing a $1$ with $s$ will do.
            feedback: >
              The target is $3 \oplus 5 = 6$, and you cannot turn a pile of
              $3$ into $6$. Sharing a lower bit is not enough.
          - text: >
              The three-pile is too small to matter in the nim-sum.
            feedback: >
              Small piles matter as much as large ones; $3$ contributes to two
              columns. The problem is only that it lacks the leading bit of
              $s$.
        feedback: >
          Pick the pile by the leading bit of $s$. If several piles carry it,
          any of them works; if a pile does not carry it, it never works.

      - part: The misère ending
        ask: >
          Now the same game under misère play: whoever takes the last coin
          *loses*. From $(3, 8, 14)$, is your first move different?
        choices:
          - text: >
              Yes: misère reverses everything, so you should avoid nim-sum $0$.
            feedback: >
              Misère differs only at the very end. With several piles larger
              than $1$, the normal-play move is still the right one.
          - text: >
              No: while two or more piles exceed $1$, misère play uses the
              normal recipe, so you still leave $(3, 8, 11)$.
            correct: true
            feedback: >
              Right. You keep zeroing the nim-sum until the moment when only
              one pile is bigger than $1$. That is where the two games part.
          - text: >
              Yes: in misère you should take the most coins you can.
            feedback: >
              Grabbing coins has no reason behind it. The middle of a misère
              game is played exactly like normal Nim.
        feedback: >
          Misère Nim: follow the normal recipe until exactly one pile exceeds
          $1$; then switch.
      - ask: >
          Misère, and the position is $(1, 1, 1, 4)$: one big pile and three
          singletons. To what size should you reduce the four-pile?
        expects: "0"
        hint: >
          Once only singletons remain, every move takes one of them. You want
          your opponent to be left with the last one.
        feedback: >
          Take the whole four-pile, leaving three singletons. Your opponent
          takes one, you take one, and they must take the last coin and lose.
          An odd number of singletons is a loss for the player facing it.
      - ask: >
          Misère, position $(1, 1, 4)$: two singletons and the big pile. What
          do you do with the four-pile?
        choices:
          - text: >
              Take all $4$, as before.
            feedback: >
              That leaves two singletons. Your opponent takes one, and you are
              left with the last coin.
          - text: >
              Reduce it to $1$, leaving three singletons.
            correct: true
            feedback: >
              Right. The big pile lets you choose the parity: reduce to $0$ or
              to $1$, whichever leaves an *odd* number of singletons.
          - text: >
              Zero the nim-sum as in normal play: $1 \oplus 1 \oplus 4 = 4$, so
              reduce it to $0$.
            feedback: >
              That is the normal-play move, and it leaves $(1, 1)$, an even
              count: in misère, you then take the last coin. At the last big
              pile, the normal recipe is exactly what you must stop doing.
        feedback: >
          At the last big pile, leave an odd number of singletons: reduce it to
          $0$ if the count of singletons is already odd, to $1$ if it is even.

  - node: quant-puzzles.nim-games.strategy-stealing
    hook: >
      Some interview games can be proven won by the first player without ever naming the move — strategy stealing is how, and knowing when it applies, and when it silently doesn't, separates a real answer from a lucky guess.
    explanation: >
      The shape of the argument is proof by contradiction, not construction. Since the game is finite, drawless, and perfect information, one player is guaranteed to have a forcing win. Suppose, for contradiction, it's the second player, with some winning strategy $\sigma$. Let the first player make any legal opening move, then adopt $\sigma$ as if they were actually the second player responding to it — if $\sigma$ ever calls for the exact move already sitting on the board from that free opening, just make any other legal move instead and continue. Following $\sigma$ this way produces a genuine win, but it's a win reached by the real first player, which contradicts $\sigma$ being a winning strategy for whoever moves second. So the assumption fails, and by determinacy the win belongs to the first player instead.

      Two conditions have to hold or the "just make another move instead" patch is illegal: an extra move already on the board must never hurt you, so treating the wasted opening as a free bonus never costs anything later, and every reply $\sigma$ calls for must remain an available legal move in the real position, not just in some idealized copy of the game. Both hold for ordinary Nim-family games; they can fail where "having more" is a liability, so check them before invoking the technique. What the argument does not deliver is worth stating in the same breath as the conclusion: no move is named, and for genuinely hard games no explicit winning strategy is known at all, even though existence is settled completely.
    worked: >
      Hex: each move colors one empty cell in your own color, and the first player to complete a chain of their color connecting their two opposite sides wins. Hex has a topological fact baked in — one player's connecting chain existing is exactly equivalent to the other's not existing — so it can never draw, and an extra cell in your color never blocks a connection, so both hypotheses hold. Suppose the second player had a winning strategy $\sigma$. The first player colors an arbitrary cell, then plays as "second player" using $\sigma$ against the real opponent's replies, substituting any other legal cell whenever $\sigma$ names the one already colored. That produces a win for the real first player, contradicting $\sigma$'s assumed guarantee — so the first player wins Hex on any board size, with no move ever named.
    interview: >
      "Show the first player wins, you don't need to say how" is the literal ask behind puzzles like Hex or symmetric-board games — the interviewer is checking that you produce the contradiction cleanly and explicitly verify the two hypotheses, rather than reflexively citing "symmetry" the way you would for mirrored Nim piles.
    pitfalls: >
      Invoking strategy stealing without checking that an extra move truly never hurts — in games with limited resources or where overcommitting is punished, the patched strategy can be illegal or actively bad. Trying to extract an actual winning move from the argument; it proves existence only, and claiming to also know the move overstates what the proof delivers.
    recap: >
      In a finite, drawless game where an extra move never hurts, assuming the second player wins and stealing that strategy after a wasted first move produces a contradiction — so the first player wins, with no move ever named.
    dialogue:
      - part: Nine numbers and a progression
        teach: >
          The numbers $1$ to $9$ lie on the table. Two players alternately
          claim one unclaimed number. The first to hold three numbers in
          arithmetic progression, like $2, 5, 8$, wins. Take on trust that
          however all nine are split between two players, one side holds such
          a triple, so the game cannot be drawn. "Show me the first player
          wins."
      - ask: >
          The brute-force route labels every position. As an upper bound, in
          how many different orders can all nine numbers be claimed?
        expects: "362880"
        feedback: >
          $9! = 362880$. Many games end early, but even a pruned tree is far
          too big to label at a whiteboard, and the interviewer did not ask
          for the winning move anyway, only for who wins.
      - ask: >
          Before any cleverness: the game is finite and cannot be drawn. What
          does that alone tell you?
        choices:
          - text: >
              The first player wins, since they hold one more number at the
              end.
            feedback: >
              Holding five numbers to four is suggestive, not a proof; plenty
              of games are lost by the player who moves first.
          - text: >
              Exactly one of the two players can force a win, but not which.
            correct: true
            feedback: >
              Right. P/N labelling, run on the huge tree, would give the
              start a label: N or P. You need to rule out P without running
              it.
          - text: >
              With best play, it is a draw.
            feedback: >
              Draws are impossible here: whoever holds a progression when the
              numbers run out has already won.
        feedback: >
          One of the two players has a winning strategy. The task is to show
          it cannot be the second.
      - reflect: >
          Suppose, for contradiction, that the second player has a winning
          strategy: a rule saying how to answer any sequence of claims. How
          could the *first* player use that very rule?
        hint: >
          The first player has one number more than the rule expects. Can that
          ever hurt them?
        answer: >
          Claim any number, call it the spare, and then pretend to be the
          second player: apply the rule to the opponent's claims as if the
          spare were not on the table. Holding an extra number can never stop
          you from completing a progression, and if the rule ever says "claim
          the spare", claim any other free number, which becomes the new spare.
          The first player then wins too. Both players cannot have winning
          strategies, so the assumption was false.
      - teach: >
          That is strategy stealing. In a finite game with no draws, suppose
          the second player has a winning strategy; let the first player make
          an arbitrary move and then follow it, treating the extra move as a
          spare. The theft is legitimate when an extra move can never hurt and
          every reply the strategy calls for is still available. Then both
          players would have winning strategies, which is absurd; so the second
          player has none, and with no draws the first player wins. No move is
          ever named.

      - part: Checking that the theft is legal
        ask: >
          Following the stolen rule, the first player is told to claim $7$, but
          $7$ is the spare they already hold. What do they do?
        choices:
          - text: >
              Pass this turn, since the rule's move is already made.
            feedback: >
              There is no passing in this game. The fix has to be a legal
              claim.
          - text: >
              Claim any other free number; it becomes the new spare.
            correct: true
            feedback: >
              Right. The rule's position is reached (they already hold $7$),
              and they gain yet another extra number, which again cannot hurt.
              A free number exists, since otherwise the game would be over.
          - text: >
              Abandon the stolen rule from here on.
            feedback: >
              No need: one substitute claim keeps the first player exactly in
              the position the rule expects, plus a spare.
        feedback: >
          This is the clause "every reply the strategy calls for is still
          available", repaired by the spare. Where no such repair exists, the
          argument fails.
      - ask: >
          Why can the spare never cost the first player the game?
        choices:
          - text: >
              Winning only requires *holding* a progression, so an extra number
              can complete one but never prevents one.
            correct: true
            feedback: >
              Right. Nothing in the rules penalizes holding numbers. The spare
              also takes a number away from the opponent, which can only help.
          - text: >
              Because the first player chose it at random.
            feedback: >
              The choice is arbitrary, but that is not why it is harmless. A
              random number would be harmful in a game where holding numbers
              can lose.
          - text: >
              Because the game is impartial.
            feedback: >
              It is not: each player's numbers are their own, as in noughts and
              crosses. Strategy stealing never needs impartiality, only that an
              extra move is harmless.
        feedback: >
          "Extra never hurts" is a fact about the winning condition, and you
          must check it game by game.
      - ask: >
          The argument is complete. What does it tell you about the first
          player's best opening claim?
        choices:
          - text: >
              It is the spare, whichever number that was.
            feedback: >
              The spare was arbitrary on purpose. The contradiction proves a
              winning strategy exists; it never shows that this particular
              opening is part of one.
          - text: >
              Nothing: the proof shows a winning strategy exists and names no
              move.
            correct: true
            feedback: >
              Right. Strategy stealing is non-constructive. Finding the actual
              winning move is a separate computation, and for some games it has
              never been done.
          - text: >
              It is $5$, the middle number, by the symmetry of the argument.
            feedback: >
              $5$ may well be a strong opening, but nothing in the argument
              says so. The proof treats every opening the same way.
        feedback: >
          Say both halves aloud: "the first player wins" and "the argument does
          not tell me how".

      - part: When the theft fails
        ask: >
          Shrink the board to $1$ to $8$. The split $\{1, 2, 5, 6\}$ against
          $\{3, 4, 7, 8\}$ gives neither side a progression. What does strategy
          stealing now prove?
        choices:
          - text: >
              Still that the first player wins.
            feedback: >
              The contradiction only shows the second player has no winning
              strategy. With draws possible, "no win for the second player"
              leaves room for a draw.
          - text: >
              Only that the second player cannot force a win: the first player
              can at least draw.
            correct: true
            feedback: >
              Right. Determinacy now has three outcomes, not two, so ruling one
              out does not settle which of the other two holds.
          - text: >
              Nothing, because the theft is no longer legal.
            feedback: >
              The theft is as legal as before: extra numbers still never hurt.
              What weakens is the conclusion, because draws are possible.
        feedback: >
          The "no draws" hypothesis is what turns "the second player cannot
          win" into "the first player wins".
      - ask: >
          Avoidance version on $1$ to $9$: whoever first holds three in
          progression *loses*. Does strategy stealing show the first player
          wins?
        choices:
          - text: >
              Yes: the argument never used the winning condition.
            feedback: >
              It used it exactly once, to say an extra number cannot hurt.
              Here an extra number can complete a progression and lose you
              the game.
          - text: >
              No: holding an extra number can now hurt, so the spare is a
              liability and the theft breaks.
            correct: true
            feedback: >
              Right. The first player following the stolen rule may be forced
              into a progression by the spare that the rule never accounted
              for.
          - text: >
              No: the game is now partizan.
            feedback: >
              It was partizan before too, and that never mattered. The broken
              clause is "an extra move never hurts".
        feedback: >
          Check "extra never hurts" before stealing. In avoidance games and in
          games where tempo matters, it fails.
      - ask: >
          A pile of $3$ counters, remove $1$ or $2$, last counter wins. Its P/N
          labels: $0$ is P, $1$ and $2$ are N, so $3$ is P and the first
          player loses. Why does strategy stealing not prove the opposite?
        choices:
          - text: >
              The opening move is not a harmless spare: it changes the pile,
              and taking a counter can hand the opponent a winning position.
            correct: true
            feedback: >
              Right. There is no "extra piece" sitting idle on the board. The
              opening move alters the position the stolen strategy would face,
              and here every opening hands over an N-position.
          - text: >
              The game can be drawn.
            feedback: >
              It cannot: the pile empties within three moves, and whoever takes
              the last counter wins.
          - text: >
              Strategy stealing only works on boards, not on piles.
            feedback: >
              The form of the game is irrelevant. What fails is the clause that
              an extra move never hurts.
        feedback: >
          Strategy stealing is a theorem with hypotheses. In take-away games an
          extra move can hurt, and the P/N table, not stealing, is the tool.

  - node: quant-puzzles.nim-games.chomp
    hook: >
      Chomp is the sharpest illustration in this unit of what strategy stealing actually buys you: a fully settled winner on every board, and, outside a few small special cases, zero idea what the winning move is.
    explanation: >
      Chomp is played on an $m \times n$ grid with a poisoned square in the bottom-left corner; a move names any remaining square and eats it along with every square above it and to its right, and whoever is forced to eat the poison loses. The single square in the top-right corner is special: it sits above and to the right of every other square on the board, so eating any other square necessarily eats the top-right one too — no other move can leave the top-right square standing. That domination is exactly what makes the top-right square a safe "wasted" opening move for stealing: whatever winning reply the hypothetical second-player strategy would have made to any first move already removes that corner, so pre-eating it costs the first player nothing.

      The $1 \times 1$ board is the one excluded case, and it's excluded for a mundane reason rather than a subtlety in the argument: with only the poisoned square present, the player to move has no other option and must eat it immediately, losing on the spot — there's no room for a first move to steal from.

      What's genuinely striking about Chomp is how little the existence proof buys in practice: outside a handful of small or highly structured boards, nobody has ever found an explicit winning strategy, even though the strategy-stealing argument settles the winner with certainty for every board bigger than $1 \times 1$. That gap between provably true and constructively known is rare enough in elementary game theory to be worth remembering as its own fact, independent of Chomp itself.
    worked: >
      On a $2 \times 4$ board, the known explicit rule, available only because the board has just two rows, is to eat the single square at the top-right corner first, leaving a bottom row of $4$ squares and a top row of $3$ — bottom exactly one square longer than top. From there the winning reply to any opponent move restores that same one-square gap: if the opponent shortens the top row further, cut the bottom row back to match it plus one; the gap survives every exchange because both rows can only ever shrink, and it eventually forces the opponent to be the one left with nothing to eat but the poison. So the first move on $2 \times 4$ is: eat the top-right square.
    interview: >
      "Who wins Chomp on a $5 \times 5$ board, and what's the move?" wants two separate, correctly separated answers: the winner, settled instantly by strategy stealing, and then an honest "I can't name the move in general" — unless the board is specifically $2 \times n$, where the two-row rule (eat the top-right corner, then hold the one-square gap) applies.
    pitfalls: >
      Trying to produce a general winning move by extending the $2 \times n$ heuristic to wider boards — it doesn't generalize, and no such rule is known. Forgetting to exclude $1 \times 1$, or misapplying the domination argument to some square other than the actual top-right corner, which is the only square dominated by nothing else.
    recap: >
      Strategy stealing on the dominating top-right square proves the first player wins every Chomp board bigger than $1 \times 1$ — a settled winner with, outside small special cases like $2 \times n$, no known winning move.
    dialogue:
      - part: A poisoned bar, four by six
        teach: >
          A chocolate bar of $4$ rows and $6$ columns; the bottom-left square
          is poisoned. Number squares by (row, column) from the bottom left. A
          move names a remaining square and eats it together with every square
          above it and to its right. Whoever eats the poison loses. "Who wins
          from the full bar?"
      - ask: >
          How many squares does a first bite at row $2$, column $3$ eat?
        expects: "12"
        hint: >
          It takes rows $2$ to $4$ and columns $3$ to $6$.
        feedback: >
          Three rows by four columns: $3 \times 4 = 12$ squares, a rectangle
          whose bottom-left corner is the square you named.
      - ask: >
          Which single square is eaten by *every* possible bite, whatever
          square is named?
        choices:
          - text: >
              The poison, at row $1$, column $1$.
            feedback: >
              The poison is eaten only by naming it. A bite anywhere else
              leaves it on the board.
          - text: >
              The top-left square, at row $4$, column $1$.
            feedback: >
              A bite at row $1$, column $2$ eats everything from column $2$
              rightwards and leaves the whole first column, top-left square
              included.
          - text: >
              The top-right square, at row $4$, column $6$.
            correct: true
            feedback: >
              Right. It lies above and to the right of every square, so any
              bite's rectangle reaches it.
        feedback: >
          The top-right square goes with every bite. That makes it the one
          move whose effect every other move already contains.
      - reflect: >
          Suppose the second player has a winning strategy. The first player
          opens by eating only the top-right square, and the strategy answers
          with some bite $M$. Why could the first player have played $M$
          straight from the full bar, and what follows?
        hint: >
          Compare the bar after "top-right, then $M$" with the bar after $M$
          alone.
        answer: >
          $M$ eats the top-right square anyway, so "top-right, then $M$" and
          "$M$ alone" leave exactly the same bar. If that bar is a win for the
          player who just moved, the first player can reach it in one move and
          take the winning seat. Either way the second player's strategy
          cannot exist: the top-right bite wins, or $M$ played first wins.
      - teach: >
          That is strategy stealing with the spare built into the board: the
          top-right square is eaten by any move, so the first player's opening
          never costs a thing. On every bar other than $1 \times 1$ the first
          player wins. The argument does not say whether the winning first bite
          is the top-right square or some $M$.

      - part: What the proof gives and withholds
        ask: >
          Why is the $1 \times 1$ bar excluded?
        choices:
          - text: >
              The only square is the poison, so there is no top-right bite to
              steal with, and the first player must eat the poison.
            correct: true
            feedback: >
              Right. On $1 \times 1$ the top-right square *is* the poison. The
              argument needs a harmless opening, and there is none.
          - text: >
              Square bars are excluded in general.
            feedback: >
              Nothing in the argument cares about the shape. On $4 \times 4$ or
              $7 \times 7$ the top-right square is just as harmless an opening.
          - text: >
              The argument works there too; the first player wins $1 \times 1$.
            feedback: >
              The first player's only move is to eat the poison. They lose
              immediately.
        feedback: >
          Every bar with at least two squares has a top-right square that is
          not the poison, and the argument goes through.
      - ask: >
          On the $4 \times 6$ bar, what does the argument tell you about the
          first player's winning bite?
        choices:
          - text: >
              It is the top-right square.
            feedback: >
              The argument shows the top-right bite *or* the strategy's reply
              $M$ wins as an opening, without saying which. If the top-right
              bite lost, $M$ would win instead.
          - text: >
              Only that one exists; it does not say which square to name.
            correct: true
            feedback: >
              Right. For general bars no one has a rule for the winning bite;
              existence is all you get.
          - text: >
              It is the bite that eats exactly half the bar.
            feedback: >
              Nothing in the argument mentions halves, or any particular
              square other than the top-right one, and even that one is not
              claimed to win.
        feedback: >
          In an interview, say both: "first player wins, by strategy stealing
          on the top-right square" and "I cannot name the move in general".

      - part: Two rows, played out by hand
        ask: >
          On a bar of $2$ rows and $6$ columns, an explicit strategy is known.
          You open by eating the top-right square. How many squares remain?
        expects: "11"
        feedback: >
          $12 - 1 = 11$: a bottom row of $6$ and a top row of $5$. The bottom
          row is exactly one square longer than the top, and that is the
          position you aim to hand over every time.
      - ask: >
          The opponent bites the top row at column $4$, leaving a top row of
          $3$. You restore "bottom row one longer than the top". How many
          squares are left after your bite?
        expects: "7"
        hint: >
          Which bottom-row square do you name so the bottom row has $4$
          squares?
        feedback: >
          Name the bottom-row square at column $5$; it eats columns $5$ and $6$
          of the bottom row, leaving $4$ below and $3$ above: $7$ squares.
      - ask: >
          Now the opponent bites the bottom row at column $3$, from rows of $4$
          and $3$. What do you do?
        choices:
          - text: >
              Bite the bottom row at column $2$, so the bottom row has $1$.
            feedback: >
              That leaves only the poison below and the top row with $1$
              square: the bar becomes a single column of $2$, the opponent eats
              the top square, and you are left with the poison.
          - text: >
              Eat the top row's last square, leaving $2$ below and $1$ above.
            correct: true
            feedback: >
              Right. Their bite took columns $3$ and $4$ below and column $3$
              above, leaving $2$ and $2$. Eating one top square restores the
              one-square gap.
          - text: >
              Eat the whole top row, leaving $2$ below.
            feedback: >
              The opponent then eats the square next to the poison, and the
              poison is all that is left for you.
        feedback: >
          From "bottom one longer", any bite leaves either a shorter top row or
          two equal rows, and one bite restores the gap. The gap shrinks to
          bottom $1$, top $0$: the opponent faces the poison alone.
      - teach: >
          Two rows is the exception. On bars of three or more rows, beyond
          small cases, no
          explicit strategy is known, even though stealing settles the winner
          on every one of them. "Who wins" and "how" are different questions,
          and Chomp is the cleanest place to say so.

  - node: quant-puzzles.nim-games.grundy
    hook: >
      Once you're playing two unrelated games at once and choosing which one to move in, "win or lose" per game stops being enough information — the Grundy value is the finer number that survives being combined.
    explanation: >
      For an impartial game under normal play, define the Grundy value of a position recursively as its mex — the minimum excludant, the smallest nonnegative integer missing from the set of Grundy values its options reach: $g(x) = \operatorname{mex}\{g(y) : x \to y\}$. This refines the plain P/N label rather than replacing it: $g(x) = 0$ exactly at the P-positions, matching the position-table labelling rule, but every N-position now also carries a specific positive integer instead of just the bare label "N."

      The reason for the finer number is combining games: in a disjunctive sum, where several independent games sit side by side and a turn consists of moving in exactly one of them, knowing only "P or N" for each component isn't enough to say who wins the sum — two N-positions summed can go either way depending on details a binary label throws away. The Grundy value doesn't throw that away: a position of value $g$ behaves in every respect like a single Nim pile of size $g$, and the value of a disjunctive sum is the XOR of the components' Grundy values, exactly Bouton's rule with each pile's size read off as its own Grundy value.
    worked: >
      Take the sum of two independent games: game $A$, a pile of $5$ under "remove one or two," and game $B$, an ordinary Nim pile of $3$. Tabulating $A$ by mex: $g(0)=0$, $g(1)=\operatorname{mex}\{0\}=1$, $g(2)=\operatorname{mex}\{1,0\}=2$, $g(3)=\operatorname{mex}\{2,1\}=0$, $g(4)=\operatorname{mex}\{0,2\}=1$, $g(5)=\operatorname{mex}\{1,0\}=2$ — so $g(A)=2$. An ordinary Nim pile's Grundy value is just its size, so $g(B)=3$. The sum's value is $2 \oplus 3 = 1$, nonzero, so the mover wins. To zero it, move in $B$: $B$ can reach any Grundy value from $0$ to $2$ by shrinking to that many counters, and $2$ is exactly $3 \oplus 1$, so removing one counter from $B$, leaving it at size $2$, zeroes the combined value.
    interview: >
      "This is really two games glued together, played by choosing which one to move in each turn" is the tell; the correct pointer response is "compute each side's Grundy value by mex, then XOR them," stated as a one-line reflex rather than derived from scratch under time pressure.
    pitfalls: >
      Computing mex as "one more than the largest value present" instead of "the smallest missing nonnegative integer" — $\{0,2\}$ has mex $1$, not $3$, since $1$ is the smallest number absent from the set. Forgetting mex applies to any disjunctive sum of unrelated impartial games, not just literal side-by-side Nim piles.
    recap: >
      Every impartial position's Grundy value, computed by mex, makes it behave exactly like a Nim pile of that size, and a sum of independent games has Grundy value equal to the XOR of its components'.
    dialogue:
      - part: Two games on one table
        teach: >
          Two games sit side by side. Left: a pile of $4$ counters under the
          rule "remove exactly $2$, $3$ or $4$"; a pile of $0$ or $1$ has no
          move. Right: an ordinary Nim pile of $2$. On your turn you move in
          exactly one of the two games, and whoever makes the last move overall
          wins. You are to move.
      - ask: >
          Taken alone, what is each game's label?
        choices:
          - text: >
              Left is P, right is N.
            feedback: >
              From $4$ the left game allows taking all $4$, leaving a pile with
              no move: the mover wins, so it is N.
          - text: >
              Both are N-positions.
            correct: true
            feedback: >
              Right. Left: take $4$ and leave $0$. Right: take both counters.
              Each is a win for whoever moves in it alone.
          - text: >
              Both are P-positions.
            feedback: >
              Each game has a move to a terminal position, so each is a win for
              its mover.
        feedback: >
          Two N-positions. The question is what that says about the pair.
      - ask: >
          Compare two pairs of Nim piles: $(1, 2)$ and $(2, 2)$. Every pile in
          both pairs is an N-position on its own. Who wins each pair, for the
          player to move?
        choices:
          - text: >
              The mover wins both: N beside N is N.
            feedback: >
              $(2, 2)$ has nim-sum $2 \oplus 2 = 0$, a P-position: the mover
              loses. Two N-positions side by side can be a loss for the mover.
          - text: >
              The mover loses both: two winning games cancel out.
            feedback: >
              In $(1, 2)$ the mover takes $1$ from the two-pile and leaves
              $(1, 1)$, a loss for the opponent. They do not always cancel.
          - text: >
              The mover wins $(1, 2)$ and loses $(2, 2)$.
            correct: true
            feedback: >
              Right. Same labels for the parts, opposite outcomes for the
              whole. The labels P and N throw away exactly the information
              that combining needs.
        feedback: >
          For Nim piles the missing information is the pile size, and the
          nim-sum combines sizes. So the question for the left game is: which
          Nim pile does it behave like?
      - reflect: >
          The left game is not a Nim pile. What property of a position would
          make it behave like a Nim pile of size $k$? Think about what a Nim
          pile of $k$ can move to, and what it cannot.
        hint: >
          A Nim pile of $3$ can become a pile of $2$, $1$ or $0$, but never a
          pile of $3$.
        answer: >
          A Nim pile of $k$ can move to piles of every size $0, 1, \dots, k-1$
          and to no pile of size $k$. So a position behaves like a pile of $k$
          if its moves reach positions behaving like piles of every size below
          $k$, and none behaving like a pile of $k$. That is: $k$ is the
          smallest size its options do *not* reach.
      - teach: >
          That number is the Grundy value, defined by the mex, the minimum
          excludant: $g(x) = \operatorname{mex}\{g(y) : x \to y\}$, the
          smallest nonnegative integer not among the options' values. A
          position with no moves has $g = 0$. Then $g = 0$ exactly at
          P-positions, a position of value $g$ plays like a Nim pile of $g$,
          and side-by-side games combine by XOR of their values.

      - part: Computing the left game's value
        ask: >
          For the left game, $g(0) = g(1) = 0$, since neither has a move. Then
          $g(2) = \operatorname{mex}\{g(0)\} = 1$ and $g(3) =
          \operatorname{mex}\{g(1), g(0)\} = 1$. What is $g(4)$?
        expects: "2"
        hint: >
          From $4$ the moves reach $2$, $1$ and $0$.
        feedback: >
          $g(4) = \operatorname{mex}\{g(2), g(1), g(0)\} = \operatorname{mex}\{1,
          0, 0\} = 2$. The left game plays like a Nim pile of $2$.
      - ask: >
          What is the Grundy value of the whole table, the left game beside a
          Nim pile of $2$?
        expects: "0"
        feedback: >
          $2 \oplus 2 = 0$. The table behaves like two Nim piles of $2$: a
          P-position. You are to move, and you lose against best play, even
          though each game on its own is a win for its mover.
      - ask: >
          Compute $\operatorname{mex}\{1, 2\}$.
        expects: "0"
        feedback: >
          $0$ is not in the set, so the mex is $0$. A common slip is "one more
          than the largest", which would give $3$. A position whose options all
          have nonzero value is a P-position, and its value is $0$.
      - ask: >
          Compute $\operatorname{mex}\{0, 1, 3\}$.
        expects: "2"
        feedback: >
          $0$ and $1$ are present, $2$ is missing: the mex is $2$. The $3$
          above the gap does not matter; the mex only asks for the smallest
          value missing.

      - part: Using the value, and its limits
        ask: >
          Replace the Nim pile of $2$ by a Nim pile of $6$, left game unchanged.
          The table's value is $2 \oplus 6 = 4$, so the mover wins. To what
          size should you reduce the Nim pile?
        expects: "2"
        hint: >
          You want the two values to cancel.
        feedback: >
          Reduce the Nim pile from $6$ to $2$: then $2 \oplus 2 = 0$. Moving
          in the left game instead cannot help, since its value can only drop
          to $0$ or $1$ and $6 \oplus 0$, $6 \oplus 1$ are both nonzero.
      - ask: >
          A house rule: on each turn you must move in *both* games at once.
          Does XOR of Grundy values still decide the table?
        choices:
          - text: >
              Yes: Grundy values describe each game, whatever the rule for
              combining them.
            feedback: >
              The values describe each game, but the XOR rule is a theorem
              about one particular way of combining them. Change that and the
              rule has no reason to hold.
          - text: >
              No: the XOR rule is for sums where a move acts in exactly one
              component.
            correct: true
            feedback: >
              Right. Grundy values combine by XOR only in a disjunctive sum,
              where a move is made in exactly one component. A move in both at
              once is a different combination, with different answers.
          - text: >
              Yes, but only when both values are nonzero.
            feedback: >
              Nonzero values do not rescue it. The XOR rule is derived for one
              move in one component per turn; with a different rule for
              combining, it simply does not apply.
        feedback: >
          The interview reflex is "a sum of independent games: Grundy values by
          mex, then XOR", and the word *sum* means one move in one component
          per turn.
