unit: quant-processes.random-walks
opening: >
  A random walk is nothing more than a running sum of coin flips, but nearly every process question in a quant interview — option payoffs, P&L paths, ruin, Markov chains — eventually reduces to a fact proved here. The unit opens by pinning down the walk's law and its first two moments, then builds the path-counting and reflection machinery that turns any "does it ever..." question into pure combinatorics, driving the ballot problem, first-passage times and the running maximum. A second arc studies long-run behavior — the $1/\sqrt{\pi n}$ return-to-origin asymptotic, recurrence versus transience by dimension, and the expected number of visits — before closing with two intuition results, the arcsine law and the coexistence of certain eventual profit with infinite expected waiting time, that correct the most common wrong instincts about fair games.
lessons:
  - node: quant-processes.random-walks.ssrw
    hook: >
      Every process question in this unit — drift, ruin, first passage, recurrence — is a question about this one object, so the translation "coin flips become a binomial count" has to be automatic before anything else here makes sense.
    explanation: >
      Writing $U$ for the number of up-steps among $n$ flips, $U$ is exactly the binomial variable you already know, since each flip independently contributes a head with probability $1/2$. The load-bearing step is purely algebraic: with $D=n-U$ down-steps, the position is $S_n=U-D=U-(n-U)=2U-n$, a linear rescaling of a binomial. This is why every "where is the walk" question collapses to a binomial computation you already have machinery for — you never need new probability theory, only the change of variables.
      That rescaling also explains the parity restriction: as $U$ moves by $1$, $S_n=2U-n$ moves by $2$, so $S_n$ can only land on integers with the same parity as $n$. Forgetting this is the single most common way to write a nonzero probability for an impossible outcome.
      The stationary, independent-increments property is the other half worth internalizing: $S_{n+m}-S_n$ has exactly the same law as $S_m$, independent of everything up to time $n$. That's the formal statement of "the walk forgets its history," and it's what licenses every first-step and restart argument used later in this unit.
    worked: >
      For $n=8$, $k=2$: matching $2U-8=2$ gives $U=5$, so $\Pr(S_8=2)=\binom{8}{5}2^{-8}=56/256=7/32\approx0.219$.
    interview: >
      "A trader's P&L moves $\pm1$ on each of $n$ independent trades — what's the distribution of the net position?" wants $S_n=2U-n$ stated immediately, with $U$ named as binomial$(n,1/2)$, not a from-scratch derivation.
    pitfalls: >
      Quoting $\Pr(S_n=k)$ for a $k$ of the wrong parity as some small positive number instead of exactly $0$. Writing $\binom{n}{k}$ instead of $\binom{n}{(n+k)/2}$ — confusing the target position $k$ with the number of heads needed to reach it.
    recap: >
      $S_n=2U-n$ with $U$ binomial$(n,1/2)$: every random-walk probability is a binomial probability in disguise, restricted to one parity class.
    dialogue:
      - part: A gambler's ledger after ten flips
        teach: >
          A gambler stakes one unit on each of ten flips of a fair coin: a head
          pays him $+1$, a tail costs him $1$. He starts at $0$ and writes his
          running total in a ledger after every flip, so a full ledger is a
          list of eleven numbers beginning with $0$.
      - ask: >
          How many different ledgers can the ten flips produce?
        expects: "1024"
        hint: >
          A ledger is fixed once you know the flips, and the flips are fixed
          once you know the ledger.
        feedback: >
          Each flip has two outcomes, so there are $2^{10} = 1024$ flip
          sequences, and each one writes a different ledger. Every ledger
          therefore has probability exactly $1/1024$ — they are equally likely,
          however jagged or smooth they look.
      - ask: >
          His ledger ends at $+4$. How many heads did he flip?
        expects: "7"
        hint: >
          Heads minus tails is $4$; heads plus tails is $10$.
        feedback: >
          With $U$ heads and $10 - U$ tails, the total is
          $U - (10 - U) = 2U - 10$. Setting $2U - 10 = 4$ gives $U = 7$. The
          final total pins down the number of heads, though not their order.
      - ask: >
          What is the probability that his ledger ends at $+4$?
        expects: "15/128"
        tolerance: 0.0005
        hint: >
          Count the ledgers with seven heads somewhere among the ten flips.
        feedback: >
          The seven heads can sit in any $7$ of the $10$ positions:
          $\binom{10}{7} = 120$ ledgers, each of probability $1/1024$, so
          $120/1024 = 15/128 \approx 0.117$.
      - ask: >
          What is the probability that his ledger ends at $+5$?
        choices:
          - text: >
              $\binom{10}{5}/1024 = 252/1024$
            feedback: >
              That is the number of ways to get *five heads*, which ends the
              ledger at $2(5) - 10 = 0$, not at $+5$. The binomial coefficient is
              indexed by the head count, never by the final total.
          - text: >
              Somewhere between the chance of $+4$ and the chance of $+6$
            feedback: >
              Interpolating assumes $+5$ is a possible ending. Solve for it:
              $2U - 10 = 5$ needs $U = 7.5$ heads.
          - text: >
              $0$
            correct: true
            feedback: >
              Right. $2U - 10$ is even for every whole number $U$, so after ten
              flips the total is always even. $+5$ is not unlikely; it is
              impossible.
          - text: >
              $1/1024$: only one very lucky ledger gets there
            feedback: >
              There is no such ledger. Each flip moves the total by $1$, so
              after an even number of flips the total is even.
        feedback: >
          Every flip changes the parity of the total, so after $n$ flips the
          total has the parity of $n$. Half the integers are off limits at any
          given time.
      - reflect: >
          You answered three questions about where he ends without tracing a
          single ledger. What did you reduce each question to, what is the law
          of that quantity, and how do you get back to his position?
        answer: >
          Each question became a question about the number of heads $U$, which
          is binomial with $n = 10$ trials and success probability $1/2$,
          because the flips are independent and fair. The position is the
          linear function $2U - n$ of it, so $\Pr(\text{total} = k)$ is the
          binomial probability at $U = (n + k)/2$ — and is $0$ when that is not
          a whole number.
      - part: What makes it the simple symmetric walk
        teach: >
          The ledger is the *simple symmetric random walk*: steps
          $X_1, X_2, \dots$ that are independent, each $+1$ or $-1$ with
          probability $1/2$, and the position $S_n = X_1 + \dots + X_n$ with
          $S_0 = 0$. Three clauses do the work — independent, size exactly
          one, fair — and the binomial translation you just used needs all
          three.
      - ask: >
          A robot on a rail moves $+1$ or $-1$ each second, each direction with
          probability $1/2$ on any single second. But it is wired so that every
          move reverses the previous one. Which clause fails?
        choices:
          - text: >
              None: each step is $\pm 1$ with probability $1/2$
            feedback: >
              Each step is fair on its own, but the steps are tied together.
              After the first move the whole path is forced: $0, 1, 0, 1, \dots$
              or $0, -1, 0, -1, \dots$. There are $2$ paths, not $2^{n}$.
          - text: >
              Fairness: the reversals bias the walk toward $0$
            feedback: >
              Every single step is still $+1$ or $-1$ with probability $1/2$,
              so each step is fair. The pull toward $0$ comes from somewhere
              else.
          - text: >
              Independence: each step is determined by the one before
            correct: true
            feedback: >
              Right. The marginal law of each step is fine; the joint law is
              not. Without independence $U$ is no longer binomial — here it is
              stuck near $n/2$.
        feedback: >
          Fair steps are not enough. Independence is what makes all $2^{n}$
          paths equally likely, and that is the whole engine.
      - ask: >
          A second counter steps $+1$ with probability $1/4$, $-1$ with
          probability $1/4$, and stays put with probability $1/2$. What is the
          probability it stands at $+1$ after two steps?
        expects: "1/4"
        hint: >
          List the two-step routes to $+1$: one of the steps is $+1$, and the
          other is a pause.
        feedback: >
          The routes are $(+1, 0)$ and $(0, +1)$, each with probability
          $(1/4)(1/2) = 1/8$, so the answer is $1/4$. The simple walk could
          never be at an odd site after two steps; this lazy counter breaks the
          step-size clause, and with it the parity rule.
      - part: The walk starts afresh at every time
        ask: >
          Back to the gambler's fair coin. What is the probability that his
          total after flip $9$ equals his total after flip $5$?
        expects: "3/8"
        hint: >
          Only flips $6$ through $9$ decide this.
        feedback: >
          $S_9 - S_5 = X_6 + X_7 + X_8 + X_9$ is a sum of four fresh fair steps,
          so it has the law of $S_4$. It is $0$ when two of the four are heads:
          $\binom{4}{2}/16 = 6/16 = 3/8$. The first five flips do not enter at
          all.
      - teach: >
          That is the last property to carry: increments over disjoint stretches
          of time are independent, and $S_{n+m} - S_n$ has the same law as
          $S_m$. Asked in an interview to "describe where he stands after $n$
          flips", say three things in one breath: $S_n = 2U - n$ with $U$
          binomial on $n$ fair trials, only sites with the parity of $n$ are
          possible, and the walk restarts from wherever it is.

  - node: quant-processes.random-walks.moments
    hook: >
      "What's the standard deviation of your position after $n$ trades" is asked constantly, and the $\sqrt{n}$ answer — plus the slow-decaying correlation across time — is the fact the rest of the unit's scaling arguments run on.
    explanation: >
      Each step has $X_i^2=1$ identically, so $\operatorname{Var}(X_i)=\mathbb{E}[X_i^2]=1$ with no computation needed. Linearity gives $\mathbb{E}[S_n]=0$, and because the steps are independent, variances add: $\operatorname{Var}(S_n)=\sum\operatorname{Var}(X_i)=n$, so the position's standard deviation is $\sqrt{n}$.
      The covariance is the part people don't expect: writing $S_n=S_m+(S_n-S_m)$ for $m\le n$, the increment $S_n-S_m$ is independent of $S_m$ with mean $0$, so $\operatorname{Cov}(S_m,S_n)=\operatorname{Cov}(S_m,S_m)=\operatorname{Var}(S_m)=m$. That gives $\operatorname{Cov}(S_m,S_n)=\min(m,n)$ and correlation $\sqrt{m/n}$ — a walk far in its past still correlates with its present, because the past steps are literally still counted in the present sum.
      The mental model: nothing pulls two snapshots of the walk apart quickly, because they share every step up to the earlier time. This slow, square-root decay of correlation is what makes "the walk remembers" a precise statement, not a metaphor, and it is what the next node's confusion about self-correction actually rests on.
    worked: >
      Correlation between $S_{16}$ and $S_{100}$: $\sqrt{16/100}=2/5=0.4$. Also, $\operatorname{Var}(S_{100}-S_{16})=100-16=84$, so the standard deviation of the change between day $16$ and day $100$ is $\sqrt{84}\approx9.17$.
    interview: >
      "If daily moves are iid $\pm1$, what's the correlation between the price after $16$ days and after $100$ days?" is answered directly from $\operatorname{Cov}(S_m,S_n)=\min(m,n)$, giving $\sqrt{16/100}=0.4$, without ever writing out a joint density.
    pitfalls: >
      Assuming $S_m$ and $S_n$ are independent because the walk is "memoryless step to step" — they share the first $m$ increments and are strongly dependent. Computing $\operatorname{Var}(X_i)$ from a variance formula instead of noticing $X_i^2\equiv1$ makes $\mathbb{E}[X_i^2]=1$ immediate.
    recap: >
      $\mathbb{E}[S_n]=0$, $\operatorname{Var}(S_n)=n$, and $\operatorname{Cov}(S_m,S_n)=\min(m,n)$ — the walk's entire second-order structure in one line, decaying only like $\sqrt{m/n}$.
    dialogue:
      - part: Sixty-four minutes of ticks
        teach: >
          A thinly traded stock ticks up or down by one cent every minute, each
          direction with probability $1/2$, independently of every other
          minute. You are asked how far it typically moves over the next hour
          and four minutes — $64$ ticks.
      - ask: >
          Start with one tick $X$. What is $\operatorname{Var}(X)$?
        expects: "1"
        hint: >
          What is $X^{2}$, whichever way the tick goes?
        feedback: >
          $X^{2} = 1$ on both outcomes and $\mathbb{E}[X] = 0$, so
          $\operatorname{Var}(X) = \mathbb{E}[X^{2}] - 0 = 1$. No table of
          outcomes needed.
      - ask: >
          What is the standard deviation of the total move $S_{64}$, in cents?
        expects: "8"
        hint: >
          For independent pieces, which quantity adds — the variances or the
          standard deviations?
        feedback: >
          Independent variances add: $\operatorname{Var}(S_{64}) = 64 \cdot 1 =
          64$, so the standard deviation is $\sqrt{64} = 8$. Adding standard
          deviations would give $64$, the move if every tick went the same way —
          the worst case, not the typical one.
      - part: Two snapshots of one path
        ask: >
          At minute $16$ the stock is up $6$ cents. What is your expected
          position at minute $64$?
        choices:
          - text: >
              $0$: the ticks are fair, so the expected position is always $0$
            feedback: >
              That is the expectation *before* you saw minute $16$. The first
              $16$ ticks are now known; only the remaining $48$ are random, and
              they have mean $0$ on top of the $6$ already banked.
          - text: >
              $24$: up $6$ in a quarter of the time projects to $24$
            feedback: >
              That extrapolates a trend the ticks do not have. Each future tick
              is fair whatever happened before, so the next $48$ ticks add
              nothing on average.
          - text: >
              $6$
            correct: true
            feedback: >
              Right. $S_{64} = S_{16} + (S_{64} - S_{16})$, and the second piece
              has mean $0$ whatever the first one was. The $6$ cents are carried
              forward intact.
          - text: >
              Below $6$: a stock that ran up tends to give some of it back
            feedback: >
              There is no restoring force in fair, independent ticks. The walk
              has no memory of its level, so nothing pulls it back toward $0$.
        feedback: >
          Knowing $S_{16}$ changes what you expect of $S_{64}$, so the two are
          far from independent: they share the first $16$ ticks.
      - reflect: >
          You want $\operatorname{Cov}(S_{16}, S_{64})$. How would you split
          $S_{64}$ so that the covariance can be read off without any
          computation over paths?
        hint: >
          The answer you just picked used the split.
        answer: >
          Write $S_{64} = S_{16} + (S_{64} - S_{16})$. The second piece is built
          from ticks $17$ to $64$, so it is independent of $S_{16}$ and
          contributes zero covariance. What is left is
          $\operatorname{Cov}(S_{16}, S_{16}) = \operatorname{Var}(S_{16}) = 16$.
          The covariance is exactly the variance of the shared stretch.
      - teach: >
          The same split works for any two times: for $m \le n$,
          $\operatorname{Cov}(S_m, S_n) = \operatorname{Var}(S_m) = m$, so
          $\operatorname{Cov}(S_m, S_n) = \min(m, n)$. Dividing by the standard
          deviations $\sqrt{m}$ and $\sqrt{n}$ gives the correlation
          $\sqrt{m/n}$, and the increment over the gap has variance $n - m$.
      - ask: >
          What is the correlation between $S_{16}$ and $S_{64}$?
        expects: "1/2"
        tolerance: 0.0005
        feedback: >
          $\operatorname{Cov} / (\operatorname{sd} \cdot \operatorname{sd}) =
          16/(4 \cdot 8) = 1/2$, which is $\sqrt{16/64}$. A quarter of the way
          through, the path already carries half the correlation it will ever
          have with its endpoint.
      - ask: >
          What is the variance of the move from minute $16$ to minute $64$?
        expects: "48"
        feedback: >
          It is a sum of $48$ independent ticks, so its variance is
          $64 - 16 = 48$ and its standard deviation $\sqrt{48} \approx 6.93$ —
          most of the hour's uncertainty is still ahead at minute $16$.
      - part: How long the memory lasts
        ask: >
          What is the correlation between the move over minutes $1$ to $16$ and
          the move over minutes $17$ to $64$?
        expects: "0"
        feedback: >
          The two moves are built from disjoint sets of ticks, so they are
          independent and their correlation is $0$. Disjoint increments are
          uncorrelated; overlapping positions like $S_{16}$ and $S_{64}$ are not.
      - ask: >
          How many minutes $n$ must pass before the correlation between
          $S_{25}$ and $S_n$ falls to $0.1$?
        expects: "2500"
        hint: >
          Solve $\sqrt{25/n} = 0.1$.
        feedback: >
          $25/n = 0.01$, so $n = 2500$: a hundred times the original horizon to
          cut the correlation to a tenth. Correlation decays like a square root,
          which is why the walk remembers its past for so long.
      - ask: >
          Now suppose the stock also sits still half the time: each minute it
          ticks $+1$ with probability $1/4$, $-1$ with probability $1/4$, and
          $0$ with probability $1/2$. What is $\operatorname{Var}(S_{64})$?
        expects: "32"
        hint: >
          Recompute the variance of one minute's move first.
        feedback: >
          One minute now has $\mathbb{E}[X^{2}] = 1/4 + 1/4 = 1/2$, so
          $\operatorname{Var}(S_{64}) = 64 \cdot 1/2 = 32$. "Variance equals
          $n$" was a fact about steps with $X^{2} = 1$; the additivity behind it
          survives, the constant does not.
      - teach: >
          Mean $0$, variance $n$, covariance $\min(m, n)$: with those three you
          can answer any second-moment question about the walk by splitting
          positions into shared and disjoint stretches of steps. Said aloud: the
          standard deviation grows like $\sqrt{n}$, and two snapshots are
          correlated by the square root of the ratio of their times.

  - node: quant-processes.random-walks.sqrt-n-scaling
    hook: >
      The classic gotcha: "it's a fair coin, so the lead should even out over time" sounds like the law of large numbers but is actually false for the quantity people mean — this node is where that confusion gets resolved for good.
    explanation: >
      From the previous node, $\operatorname{sd}(S_n)=\sqrt{n}$, so to double the typical distance from the origin you need four times as many steps — displacement scales like $\sqrt{n}$, not like $n$. Two different limits live side by side and get conflated constantly: the *fraction* of heads, $S_n/n$, shrinks to $0$ because the denominator grows linearly while the numerator's typical size grows only as $\sqrt{n}$; the *raw* lead $|S_n|$ itself grows without bound, because nothing in the moments computation supplies a restoring force — every new step adds an independent zero-mean contribution to the variance, never subtracts one.
      The mental model: think of the walk as diluted, not corrected. A large early lead does not get erased; it just becomes a smaller fraction of an ever-larger total, while its absolute size keeps drifting via ordinary $\sqrt{n}$ noise. "The odds even out" is true only in the ratio sense.
    worked: >
      After $n=40{,}000$ flips, $\operatorname{sd}(S_n)=200$. A surplus of $S_n=200$ heads-over-tails is exactly one standard deviation — unremarkable — and corresponds to $20{,}100$ heads out of $40{,}000$, a fraction of $0.5025$: visibly close to $1/2$ even though the raw lead of $200$ is not shrinking at all.
    interview: >
      "After a long run of fair coin flips, is a lead of $X$ surprising?" wants the lead compared to $\sqrt{n}$, not to $n$ or to zero — and a clean statement that the head *fraction* converges while the head *count minus tail count* does not.
    pitfalls: >
      Treating a growing raw lead as evidence the coin is biased, without first normalizing by $\sqrt{n}$. Citing the law of large numbers to claim the walk "comes back toward zero" — LLN governs $S_n/n$, and says nothing about $S_n$ itself, which is unbounded.
    recap: >
      Displacement scales as $\sqrt{n}$: the head fraction converges to $1/2$ while the absolute lead diverges, because variance only ever accumulates.
    dialogue:
      - part: Predict the lead
        teach: >
          Two friends flip a fair coin, one point to Ann per head and one to
          Ben per tail, and a scoreboard shows Ann's lead (negative when she
          trails). Over many evenings of $100$ flips, the size of the final
          lead is typically about $10$ — that is its standard deviation,
          $\sqrt{100}$.
      - ask: >
          How many flips per evening would make the typical size of the lead
          $20$?
        expects: "400"
        hint: >
          The standard deviation after $n$ flips is $\sqrt{n}$.
        feedback: >
          $\sqrt{n} = 20$ gives $n = 400$. Doubling the flips only multiplies
          the typical lead by $\sqrt{2} \approx 1.41$; to double it you need
          four times the flips. Answering $200$ assumes the lead grows in
          proportion to $n$, which it does not.
      - ask: >
          One evening they flip $2500$ times and Ann finishes $80$ ahead. How
          should you read that?
        choices:
          - text: >
              The coin is probably biased: $80$ is a big lead
            feedback: >
              Big compared with what? The standard deviation after $2500$
              flips is $50$, so $80$ is $1.6$ of them. A fair coin produces a
              lead at least that large, either way, in about $11\%$ of
              evenings.
          - text: >
              A $1.6$-standard-deviation lead, which a fair coin gives in about
              one evening in nine
            correct: true
            feedback: >
              Right. Measure the lead in units of $\sqrt{n} = 50$, then read the
              normal table: $\Pr(|Z| \ge 1.6) \approx 0.11$.
          - text: >
              Small: $80$ is barely $3\%$ of $2500$
            feedback: >
              Dividing by $n$ makes every lead look small eventually. The
              lead's natural scale is $\sqrt{n} = 50$, not $n$, and on that
              scale $80$ is noticeable.
        feedback: >
          Any lead is judged against $\sqrt{n}$. Against $n$ everything looks
          tiny; against $0$ everything looks suspicious.
      - part: Two limits that are not the same
        ask: >
          In that evening, what fraction of the $2500$ flips were heads?
        expects: "0.516"
        hint: >
          Heads plus tails is $2500$; heads minus tails is $80$.
        feedback: >
          Heads $= (2500 + 80)/2 = 1290$, a fraction of $1290/2500 = 0.516$.
      - ask: >
          Suppose instead they kept going to $250{,}000$ flips. What is the
          typical size of the lead now?
        expects: "500"
        feedback: >
          $\sqrt{250{,}000} = 500$. The typical lead is ten times what it was at
          $2500$ flips; it has grown, not settled.
      - ask: >
          Ann is $80$ ahead after $2500$ flips, and $247{,}500$ more flips are
          coming. What is her expected lead at the end?
        choices:
          - text: >
              $0$: over that many flips the lead evens out
            feedback: >
              Each future flip has mean $0$, so the future adds $0$ to her lead
              on average — it does not subtract $80$. Nothing in a fair coin
              knows she is ahead.
          - text: >
              More than $80$: leads build momentum
            feedback: >
              The coin has no memory of the score. Future flips are fair and
              independent of the past, so they add nothing on average.
          - text: >
              $80$, with a spread of about $500$ around it
            correct: true
            feedback: >
              Right. The lead she has is kept on average, and the new flips pile
              on a standard deviation of $\sqrt{247{,}500} \approx 497$. The $80$
              is not erased; it is swamped.
        feedback: >
          The lead is never corrected. Its expected value stays where it is,
          and its spread keeps growing like $\sqrt{n}$.
      - reflect: >
          Over a long game the fraction of heads closes in on $1/2$, yet the
          lead itself is never pulled back. What makes the fraction converge,
          if nothing is correcting the lead?
        answer: >
          Dilution. The fraction is $1/2 + S_n/(2n)$, and $S_n$ is typically of
          size $\sqrt{n}$ while the denominator is $n$, so the deviation shrinks
          like $1/\sqrt{n}$. The numerator keeps wandering and grows without
          bound; it just grows more slowly than the count it is divided by. The
          law of large numbers is a statement about $S_n/n$, never about $S_n$.
      - teach: >
          That is the $\sqrt{n}$ scaling. The walk's displacement lives on the
          scale $\sqrt{n}$, and $S_n/\sqrt{n}$ is approximately standard normal,
          so about $68\%$ of games end within one $\sqrt{n}$ of $0$ and about
          $95\%$ within two. The fraction $S_n/n$ goes to $0$; the lead $|S_n|$
          does not.
      - part: Reading a lead correctly
        ask: >
          After $90{,}000$ fair flips, roughly what is the probability that the
          lead, in either direction, is at most $600$?
        expects: "0.95"
        tolerance: 0.01
        hint: >
          Convert $600$ into standard deviations first.
        feedback: >
          The standard deviation is $\sqrt{90{,}000} = 300$, so $600$ is two of
          them, and $\Pr(|Z| \le 2) \approx 0.95$. A lead of $600$ sounds
          enormous and is the edge of ordinary.
      - ask: >
          Fix the number $100$. As the number of fair flips $n$ grows without
          bound, what happens?
        choices:
          - text: >
              $\Pr(|S_n| \le 100) \to 0$, while $\Pr(|S_n/n| \le 0.01) \to 1$
            correct: true
            feedback: >
              Right. At $n = 10^{6}$, $100$ is a tenth of a standard deviation,
              so $\Pr(|S_n| \le 100) \approx 0.08$; and $|S_n/n| \le 0.01$ means
              a lead of up to $10{,}000$, ten standard deviations, which is all
              but certain.
          - text: >
              $\Pr(|S_n| \le 100) \to 1$, since the coin is fair and evens out
            feedback: >
              The opposite. $100$ is a fixed number while the spread
              $\sqrt{n}$ grows, so the window $[-100, 100]$ covers a vanishing
              share of the distribution.
          - text: >
              Both probabilities go to $1$: the lead and the fraction settle
              together
            feedback: >
              Only the fraction settles. The raw lead escapes any fixed window,
              because its spread $\sqrt{n}$ grows without bound.
        feedback: >
          The two limits pull in opposite directions: the fraction of heads
          converges, and the lead escapes every fixed bound. In an interview,
          say both halves.

  - node: quant-processes.random-walks.biased-walk
    hook: >
      "You have a small statistical edge — how many trades until it's visible?" is answered by comparing a linear drift to a $\sqrt{n}$ noise floor, and the crossover point is a formula worth having cold.
    explanation: >
      With $\Pr(X_i=+1)=p$, linearity still gives $\mathbb{E}[S_n]=n(p-q)$ directly, exactly as in the fair case but with a nonzero per-step mean. The variance changes too: $\operatorname{Var}(X_i)=1-(p-q)^2=4pq$ (since $(p+q)^2=1$ forces $(p-q)^2=1-4pq$), so independence again gives $\operatorname{Var}(S_n)=4pqn$.
      The load-bearing comparison is drift against noise: the drift $n(p-q)$ grows linearly in $n$, while the standard deviation $\sqrt{4pqn}$ grows only like $\sqrt{n}$, so their ratio is $\sqrt{n}\,(p-q)/\sqrt{4pq}$ — unbounded, but growing slowly. Setting that ratio to $1$ gives the crossover scale $n_0=4pq/(p-q)^2$: below $n_0$ the edge is buried in noise, above it the edge dominates by a growing multiple.
      This is the "small edge, many trades" model: an edge that is invisible in a handful of trials becomes overwhelming given enough of them, purely because signal accumulates linearly while noise only accumulates as a square root.
    worked: >
      At $p=0.55$, $q=0.45$: $n_0=4(0.2475)/(0.1)^2=99$ trades to reach a one-sigma edge. After $n=2500$ trades ($\approx25.3\times n_0$), the ratio scales by $\sqrt{25.3}\approx5.03$: drift $=2500(0.1)=250$, standard deviation $=\sqrt{4(0.2475)(2500)}=\sqrt{2475}\approx49.75$, so the edge sits at $250/49.75\approx5.0$ standard deviations — decisively visible.
    interview: >
      "With a $55\%$ edge per trade, how many trades until you're statistically confident?" wants $n_0=4pq/(p-q)^2$ produced directly, plus the remark that going from one sigma to five sigmas of confidence costs a $25\times$ increase in sample size, not a $5\times$ one.
    pitfalls: >
      Using $\operatorname{Var}(X_i)=1$, the fair-coin value, when the walk is biased — it's $4pq<1$ whenever $p\ne1/2$. Reading "drift wins eventually" as "the walk is ahead at every $n$" — it's an asymptotic, almost-sure statement, and noise can dominate at small $n$ even with a real edge.
    recap: >
      Mean $n(2p-1)$ against standard deviation $\sqrt{4pqn}$: the edge needs on the order of $4pq/(p-q)^2$ trades before signal beats noise, and confidence grows only as $\sqrt{n}$ after that.
    dialogue:
      - part: A loaded coin, four flips
        teach: >
          A coin lands heads with probability $3/4$. You score $+1$ per head
          and $-1$ per tail, starting at $0$, and flip it four times.
      - ask: >
          What is the probability that you finish at $+2$?
        expects: "27/64"
        tolerance: 0.0005
        hint: >
          Finishing at $+2$ needs three heads and one tail. What is the chance
          of any one such sequence?
        feedback: >
          There are $\binom{4}{3} = 4$ sequences with three heads, and each has
          probability $(3/4)^{3}(1/4) = 27/256$. So the answer is
          $4 \cdot 27/256 = 108/256 = 27/64 \approx 0.422$.
      - ask: >
          A colleague says: "four of the sixteen paths end at $+2$, so the
          answer is $1/4$." What went wrong?
        choices:
          - text: >
              The paths are not equally likely; each path to $+2$ weighs
              $(3/4)^{3}(1/4)$, not $1/16$
            correct: true
            feedback: >
              Right. The count of $4$ is still correct, and all four paths share
              one weight, because a path's weight depends only on how many of
              its steps go up.
          - text: >
              Nothing: counting paths gives probabilities for any coin
            feedback: >
              Counting works only when every path has the same probability. Here
              the path HHHH has $(3/4)^{4} \approx 0.32$ and TTTT has
              $(1/4)^{4} \approx 0.004$ — eighty-one times less likely.
          - text: >
              The count is wrong: it should be $\binom{4}{2} = 6$
            feedback: >
              $\binom{4}{2}$ counts sequences with two heads, which finish at
              $0$. Ending at $+2$ needs three heads, and $\binom{4}{3} = 4$ is
              the right count.
        feedback: >
          Count the paths, then weight them: paths that end in the same place
          have the same number of up-steps, so they share a weight
          $p^{u}q^{n-u}$.
      - ask: >
          What is the expected position after the four flips?
        expects: "2"
        feedback: >
          One flip has mean $(+1)(3/4) + (-1)(1/4) = 1/2$, and linearity gives
          $4 \cdot 1/2 = 2$. The walk now drifts.
      - ask: >
          What is the variance of a single step?
        expects: "3/4"
        tolerance: 0.0005
        hint: >
          $X^{2} = 1$ still, but the mean is no longer $0$.
        feedback: >
          $\operatorname{Var}(X) = \mathbb{E}[X^{2}] - (\mathbb{E}[X])^{2} =
          1 - 1/4 = 3/4$. Using the fair coin's value $1$ here is the classic
          slip: a loaded step is *less* uncertain, because it mostly goes one
          way.
      - part: The biased walk, named
        teach: >
          This is the *biased random walk*: independent steps, $+1$ with
          probability $p$ and $-1$ with probability $q = 1 - p$. The up-step
          count is binomial with success probability $p$, the mean is
          $n(p - q)$, and since $1 - (p - q)^{2} = 4pq$ the variance is
          $4pqn$. With $p = 3/4$ that is $4 \cdot 3/16 = 3/4$ per step, as you
          found.
      - part: A small edge against the noise
        ask: >
          A card counter wins each hand of one unit with probability $0.52$ and
          loses it otherwise, independently. After $100$ hands, what is the
          standard deviation of her profit?
        expects: "9.99"
        tolerance: 0.02
        hint: >
          Per hand the variance is $4pq$.
        feedback: >
          $4pq = 4(0.52)(0.48) = 0.9984$, so the variance is $99.84$ and the
          standard deviation $\approx 9.99$. Against an expected profit of
          $100(0.04) = 4$, the edge is less than half a standard deviation.
      - reflect: >
          The expected profit grows in proportion to the number of hands $n$;
          the standard deviation grows like $\sqrt{n}$. How does their ratio
          behave, and how would you find the number of hands at which the edge
          first equals one standard deviation?
        answer: >
          The ratio is $n(p - q)/\sqrt{4pqn} = \sqrt{n}\,(p - q)/\sqrt{4pq}$: it
          grows without bound, but only like $\sqrt{n}$. Setting it to $1$ gives
          $n_0 = 4pq/(p - q)^{2}$, here $0.9984/0.0016 = 624$ hands. Below
          that the edge is buried in the noise; above it, it shows.
      - ask: >
          After $10{,}000$ hands, how many standard deviations is her expected
          profit?
        expects: "4"
        tolerance: 0.01
        hint: >
          $10{,}000$ is about sixteen times $624$.
        feedback: >
          Drift $10{,}000(0.04) = 400$; standard deviation
          $\sqrt{0.9984 \cdot 10{,}000} \approx 99.92$; ratio $\approx 4.0$.
          Sixteen times the crossover buys only four times the signal-to-noise:
          confidence grows like $\sqrt{n}$.
      - ask: >
          After $400$ hands she is behind. Does that show her edge was never
          real?
        choices:
          - text: >
              Yes: with a positive edge you should be ahead at every point
            feedback: >
              An edge is a statement about the mean, not about every path. At
              $400$ hands the drift is $16$ against a standard deviation of
              about $20$.
          - text: >
              Yes: $400$ hands is well past the $n_0$ of $624$
            feedback: >
              $400$ is *below* $624$, so the edge has not even reached one
              standard deviation yet. And past $n_0$ the walk can still be
              behind, just less often.
          - text: >
              No: at $400$ hands the edge is about $0.8$ standard deviations,
              so a real edge is behind roughly one time in five
            correct: true
            feedback: >
              Right. $16/19.98 \approx 0.8$, and $\Pr(Z < -0.8) \approx 0.21$.
              Being behind at $400$ is weak evidence of anything.
        feedback: >
          The edge wins only asymptotically: for $p \ne 1/2$ the walk heads to
          $\pm\infty$ almost surely, but at any finite $n$ the noise can still
          hide it.
      - teach: >
          Asked how long a small edge takes to show, say: the drift is linear,
          the noise is $\sqrt{4pqn}$, so the edge needs on the order of
          $4pq/(p - q)^{2}$ trades to match one standard deviation, and every
          doubling of confidence costs four times the trades. With an absorbing
          barrier — a bankroll that can hit zero — this walk becomes gambler's
          ruin.

  - node: quant-processes.random-walks.path-counting
    hook: >
      This is the single biggest simplification in the whole unit: any "what's the probability of..." question about the symmetric walk stops being a probability question and becomes a counting question.
    explanation: >
      Every $n$-step path has probability exactly $2^{-n}$, since each of its $n$ independent $\pm1$ steps occurs with probability $1/2$ regardless of the path's shape. That means any event's probability is just (number of paths satisfying it)$/2^n$ — from here on, computing a probability and counting a set of paths are the same task.
      The basic count follows immediately: a path from $(0,a)$ to $(n,b)$ exists exactly when $n$ and $b-a$ share parity, and there are $\binom{n}{(n+b-a)/2}$ of them, because the path is fully determined by choosing which steps go up. For constrained counts — stay positive, avoid a level, touch a level — the strategy is always the same: find a bijection between the constrained paths and some unconstrained set you already know how to count. That bijection idea, not any new probability tool, is the engine behind the rest of this unit.
      The biased walk breaks the "every path is equally likely" fact, but not the counting method: paths sharing an endpoint still share the weight $p^uq^{n-u}$, so a favorable-path count still isolates the constraint — you just multiply by that shared weight instead of by $2^{-n}$.
    worked: >
      $\Pr(S_8=4)$: matching $(n+k)/2=6$ up-steps needed, so there are $\binom{8}{6}=28$ favorable paths out of $2^8=256$, giving $\Pr(S_8=4)=28/256=7/64\approx0.109$.
    interview: >
      "What's the probability the walk is at $+4$ after $8$ steps?" is meant to be answered by naming the up-step count and writing the binomial coefficient immediately — the interviewer is checking that probability and path-counting are one move, not two.
    pitfalls: >
      Skipping the parity check before writing $\binom{n}{(n+k)/2}$, producing a non-integer index for an impossible outcome. Applying a symmetric-walk path count directly as a probability for the biased walk without multiplying by the path's actual weight $p^uq^{n-u}$.
    recap: >
      Every $n$-step path has probability $2^{-n}$, so probabilities are path counts: $\binom{n}{(n+b-a)/2}$ routes from height $a$ to height $b$.
    dialogue:
      - part: Doing it the slow way
        teach: >
          A fair walk starts at height $1$ and takes $4$ steps of $\pm 1$. You
          want the probability that it ends at height $3$, and you are willing
          to write paths out by hand.
      - ask: >
          How many of the $16$ four-step paths end at height $3$?
        expects: "4"
        hint: >
          A net rise of $2$ in $4$ steps means three ups and one down. Where can
          the down go?
        feedback: >
          The single down-step can be step $1$, $2$, $3$ or $4$: DUUU, UDUU,
          UUDU, UUUD. Four paths.
      - ask: >
          What is the probability that the walk ends at height $3$?
        expects: "1/4"
        tolerance: 0.0005
        feedback: >
          Every four-step path has probability $(1/2)^{4} = 1/16$, so the
          probability is $4/16 = 1/4$. The probability was never the hard part:
          it is the count divided by $2^{4}$.
      - ask: >
          Now the walk takes $12$ steps from height $1$, and you want it to end
          at height $5$. Writing out $4096$ paths is not an option. What did
          your list of four actually depend on?
        choices:
          - text: >
              The order in which ups and downs occurred
            feedback: >
              The order is what made the four paths different, but the count
              only needed *which positions* held the down-step. Every order with
              the right number of ups is in, whatever it looks like.
          - text: >
              Only how many steps went up, and which ones
            correct: true
            feedback: >
              Right. The endpoint fixes the number of up-steps, and a path is
              nothing but a choice of which steps those are.
          - text: >
              The starting height $1$ and the final height $3$ separately
            feedback: >
              Starting at $11$ and ending at $13$ gives the same four paths
              shifted up by $10$. Only the net rise $3 - 1 = 2$ mattered.
        feedback: >
          A path is a choice of positions for its up-steps. Counting paths is
          counting subsets.
      - reflect: >
          Write the number of $n$-step paths from height $a$ to height $b$ as a
          formula, and say when it is $0$.
        hint: >
          Call the number of up-steps $u$ and the number of down-steps $d$. Two
          equations pin them down.
        answer: >
          $u + d = n$ and $u - d = b - a$, so $u = (n + b - a)/2$, and the paths
          are the ways to choose those $u$ positions: $\binom{n}{(n + b - a)/2}$.
          When $n$ and $b - a$ have different parity, $u$ is not a whole number
          and there are no paths at all. Only the difference $b - a$ enters.
      - part: Probabilities are counts
        teach: >
          That is *path counting*. Each $n$-step path of the fair walk has
          probability $2^{-n}$ whatever its shape, so every probability is
          (number of favourable paths)$/2^{n}$, and a path from $a$ to $b$ is
          chosen by picking its $(n + b - a)/2$ up-steps. Probability questions
          about the walk are now counting questions.
      - ask: >
          How many $12$-step paths run from height $1$ to height $5$?
        expects: "495"
        feedback: >
          $u = (12 + 4)/2 = 8$, so there are $\binom{12}{8} = 495$ paths, and
          the probability is $495/4096 \approx 0.121$.
      - ask: >
          How many $8$-step paths run from height $3$ to height $0$?
        expects: "0"
        hint: >
          Check parity before reaching for a binomial coefficient.
        feedback: >
          The net change $-3$ is odd and $n = 8$ is even, so $u = (8 - 3)/2 =
          2.5$: no such path exists. Writing $\binom{8}{2.5}$, or rounding it,
          is the error the parity check exists to catch.
      - part: When the count is not the whole answer
        ask: >
          A coin lands heads with probability $2/3$; the walk steps up on heads.
          What is the probability that it ends at $+1$ after $5$ steps from $0$?
        expects: "80/243"
        tolerance: 0.0005
        hint: >
          The count of paths is the same as for a fair coin. What is the weight
          of each one?
        feedback: >
          Ending at $+1$ needs $3$ ups and $2$ downs: $\binom{5}{3} = 10$ paths,
          each of weight $(2/3)^{3}(1/3)^{2} = 8/243$, so the answer is
          $80/243 \approx 0.329$. The paths are no longer equally likely, but
          all paths to one endpoint share a weight, so the count still does the
          work.
      - ask: >
          Back to the fair walk from height $1$ to height $3$ in $4$ steps. How
          many of the four paths never drop below height $1$?
        expects: "3"
        feedback: >
          DUUU drops to $0$ on its first step; UDUU, UUDU and UUUD never go
          below $1$. So $3$ of the $4$. A constraint on the *route* changes the
          count, and the binomial formula alone cannot see it.
      - ask: >
          Which of these counts does the formula $\binom{n}{(n + b - a)/2}$ not
          give you directly?
        choices:
          - text: >
              Paths from $0$ that end at an odd height after $11$ steps
            feedback: >
              That is a sum of endpoint counts — for $11$ steps every height is
              odd, so all $2^{11}$ paths qualify. The formula handles any
              endpoint condition.
          - text: >
              Paths from $0$ to $6$ in $20$ steps
            feedback: >
              That is the formula exactly: $\binom{20}{13} = 77{,}520$.
          - text: >
              Paths from $0$ to $6$ in $20$ steps that never touch $-1$
            correct: true
            feedback: >
              Right. Endpoint conditions are binomial coefficients; conditions
              on the whole route are not. Those are counted by matching the
              constrained paths one-to-one with an unconstrained set — a
              bijection.
        feedback: >
          Path counting reduces route constraints to finding the right
          bijection, and the most useful one, folding a path at the first time
          it touches a level, is the Reflection principle.

  - node: quant-processes.random-walks.reflection
    hook: >
      Every "does the walk ever reach a level" question in an interview is this one bijection wearing a different costume — ballot counting, first passage and the running maximum are all reflection aimed at a different target.
    explanation: >
      Fix a level $a\ge1$ and reflect a path's tail — everything after its first visit to $a$ — about the horizontal line at height $a$. This is an involution (reflecting twice returns the original path), so it is automatically a bijection on the set it's applied to.
      The key fact that makes it useful is what the image set turns out to be: any path ending above $a$ must already have crossed $a$ at some earlier step, since the walk moves by $\pm1$ and cannot jump over a level. So the "touches $a$" condition, once you reflect, becomes automatic rather than something you have to track — reflecting a path touching $a$ and ending at $b<a$ produces a path ending at $2a-b>a$, and every path ending at $2a-b$ arises this way. That converts a constrained count (touches $a$, ends at $b$) into an unconstrained one (ends at $2a-b$), which path counting already answers: $\binom{n}{(n+2a-b)/2}$.
      The mental model: don't try to track "did it touch $a$" directly. Fold the picture over at the first crossing and read the answer off the endpoint alone.
    worked: >
      Paths of length $7$ touching level $2$ and ending at $-1$: the reflected endpoint is $2(2)-(-1)=5$, so the count is $\binom{7}{(7+5)/2}=\binom{7}{6}=7$ paths out of $2^7=128$, giving probability $7/128\approx0.055$.
    interview: >
      "What's the probability a random walk ever crosses a barrier by time $n$?" is answered by reflecting to eliminate the "ever crosses" condition entirely, turning it into an endpoint count — the interviewer wants the bijection stated, not a case-by-case enumeration.
    pitfalls: >
      Applying the formula with $a<1$ or with the endpoint on the wrong side ($b\ge a$) — the setup requires $a\ge1$ and $b<a$. Worrying about paths that touch $a$ more than once and trying to inclusion–exclude over the touches — the bijection at the *first* hitting time already handles this with no double-counting.
    recap: >
      Reflect a path after its first visit to a level and restricted-path counts become unrestricted-path counts — the central trick of the subject.
    dialogue:
      - part: Touching a level, counted by hand
        teach: >
          A fair walk takes $6$ steps from $0$. You want the paths that reach
          height $+2$ at some point and still finish back at $0$.
      - ask: >
          First, ignoring the level: how many $6$-step paths end at $0$?
        expects: "20"
        feedback: >
          Three ups and three downs: $\binom{6}{3} = 20$ paths.
      - ask: >
          How many of those $20$ paths touch $+2$ along the way?
        expects: "6"
        hint: >
          Sort them by when they first reach $+2$: at step $2$ (they start UU),
          or at step $4$. Then count how each can get from $+2$ back to $0$ in
          the steps left.
        feedback: >
          First hit at step $2$: UU, then $4$ steps from $+2$ to $0$ with one up
          and three downs, $\binom{4}{1} = 4$ ways. First hit at step $4$: UDUU
          or DUUU, then DD, $2$ ways. Total $4 + 2 = 6$.
      - ask: >
          Now $40$ steps, touching $+7$ and ending at $-3$. How would the case
          split you just did scale?
        choices:
          - text: >
              Badly: it needs a fresh constrained count for every case
            correct: true
            feedback: >
              Right. What is wanted is a way to turn "touches $+7$" into a
              condition on the endpoint alone, which the binomial coefficient
              can count.
          - text: >
              Fine: split by the first hitting time and multiply, as before
            feedback: >
              Each case needs the number of paths that reach $+7$ *for the first
              time* at step $k$ — itself a constrained count, harder than the
              one you started with. The split moves the difficulty, it does not
              remove it.
          - text: >
              Fine: multiply the count ending at $-3$ by the chance of ever
              touching $+7$
            feedback: >
              That treats "touches $+7$" and "ends at $-3$" as independent.
              They are not: a path that ends low is less likely to have been
              high.
        feedback: >
          The direct approach tracks the whole route. The trick is to stop
          tracking it.
      - reflect: >
          Take the path UUDDDU from your six. After its first visit to $+2$,
          flip every remaining step, up for down. Where does the new path end?
          Do the same to the other five, and say what set the six new paths
          form.
        hint: >
          Flipping the tail mirrors it in the horizontal line at height $2$.
        answer: >
          UUDDDU keeps its first two steps, and its tail DDDU becomes UUUD,
          giving UUUUUD, which ends at $4$. Every tail went from $2$ down to
          $0$, so every folded tail goes from $2$ up to $4$: all six new paths
          end at $2 \cdot 2 - 0 = 4$, and they are all different. There are
          exactly $\binom{6}{5} = 6$ paths ending at $4$, so the folded paths are
          *all* of them. "Touches $+2$ and ends at $0$" has become simply "ends
          at $4$".
      - teach: >
          This is the *reflection principle*. For a level $a \ge 1$ and an
          endpoint $b < a$, reflecting the part of a path after its first visit
          to $a$ about the line at height $a$ matches the paths that touch $a$
          and end at $b$ one-to-one with all paths that end at $2a - b$. So
          their number is $\binom{n}{(n + 2a - b)/2}$, an unconstrained count.
      - part: Why the fold is one-to-one
        ask: >
          The fold needs every path ending at $2a - b$ to have a first visit to
          $a$, or there would be nothing to unfold. Why is that guaranteed?
        choices:
          - text: >
              Because $b < a$
            feedback: >
              $b$ is the endpoint of the *original* path. The question is about
              the image paths, which end at $2a - b$, and they have to get there
              from $0$.
          - text: >
              It is not guaranteed; the formula is approximate
            feedback: >
              It is exact. You checked it on $6$ paths, and the reason it always
              works is about how the walk moves.
          - text: >
              Steps are $\pm 1$, so a path from $0$ to $2a - b > a$ cannot jump
              over $a$
            correct: true
            feedback: >
              Right. A walk that moves one unit at a time passes through every
              level between its start and its end. This is the one place the
              step size matters.
        feedback: >
          Every path ending above $a$ has touched $a$, so the unfold is always
          defined: reflect after its first visit to $a$, and you recover a path
          ending at $b$.
      - ask: >
          A path may touch $+2$ three times before ending at $0$. Does the fold
          count it more than once?
        choices:
          - text: >
              Yes: subtract the paths with repeat visits, by inclusion–exclusion
            feedback: >
              No correction is needed. The fold is applied at one moment only,
              the first visit, so each path has exactly one image.
          - text: >
              No: the first visit is a single time, and the folded path has the
              same first visit
            correct: true
            feedback: >
              Right. The steps before the first visit are untouched, so folding
              the image again at its first visit to $a$ returns the original.
              The map is its own inverse, hence a bijection.
          - text: >
              Yes, but the overcount cancels against paths that never return
            feedback: >
              There is no overcount to cancel. Each path is folded at exactly
              one time.
        feedback: >
          Using the *first* hitting time is what makes the map well defined and
          reversible at once.
      - part: Folding by hand
        ask: >
          How many $9$-step paths from $0$ touch $+3$ and end at $-1$?
        expects: "9"
        feedback: >
          Fold to $2(3) - (-1) = 7$: you need $(9 + 7)/2 = 8$ ups, so
          $\binom{9}{8} = 9$ paths.
      - ask: >
          What is the probability that an $11$-step fair walk touches $+2$ and
          ends at $-3$?
        expects: "55/2048"
        tolerance: 0.0001
        feedback: >
          Fold to $2(2) - (-3) = 7$: $(11 + 7)/2 = 9$ ups, $\binom{11}{9} = 55$
          paths, so the probability is $55/2^{11} = 55/2048 \approx 0.0269$.
      - ask: >
          A walk starts at height $2$ and takes $8$ steps back to height $2$.
          How many of those paths never touch $0$?
        expects: "42"
        hint: >
          Count the ones that do touch $0$ by folding the part *before* the
          first visit to $0$: a start at $2$ becomes a start at $-2$.
        feedback: >
          All paths from $2$ to $2$: $\binom{8}{4} = 70$. Those touching $0$
          match the paths from $-2$ to $2$, which need $(8 + 4)/2 = 6$ ups:
          $\binom{8}{6} = 28$. So $70 - 28 = 42$ never touch $0$. This barrier
          form of the fold is how "stays positive" gets counted.
      - part: Where the fold does not apply
        ask: >
          A candidate counts $6$-step paths that touch $+2$ and end at $+4$ with
          $\binom{6}{(6 + 4 - 4)/2} = \binom{6}{3} = 20$. What is the right count?
        choices:
          - text: >
              $20$: the formula holds for any endpoint
            feedback: >
              There are only $\binom{6}{5} = 6$ paths ending at $+4$ at all, so
              $20$ of them cannot touch anything. The fold sends the endpoint
              $b$ to $2a - b$, and when $b > a$ that lands *below* $a$, on paths
              that need not have touched $a$.
          - text: >
              $6$: every path ending at $+4$ already passed $+2$
            correct: true
            feedback: >
              Right. With $b \ge a$ the constraint is automatic, so the count is
              simply $\binom{6}{5} = 6$. The theorem's hypothesis $b < a$ is
              exactly the case where touching is not free.
          - text: >
              $0$: a path cannot both touch $+2$ and end above it
            feedback: >
              It can — UUUUUD touches $+2$ at step $2$ and ends at $+4$. Every
              path ending at $+4$ does.
        feedback: >
          Check the side of the level before folding. Above it, every path
          qualifies; below it, fold.

  - node: quant-processes.random-walks.ballot
    hook: >
      "Was the front-runner ever behind" is a constantly recurring framing — vote counts, P&L that must never dip negative, a game score — and it resolves to one clean fraction via reflection.
    explanation: >
      Recast the vote count as a path: $p$ up-steps for A, $q$ down-steps for B, ending at height $p-q$. "A strictly ahead at every stage" is exactly "the path stays strictly positive after the first step."
      Reflection handles the complementary bad event. A path's first step is down with probability $q/(p+q)$ (by symmetry among the $p+q$ positions of the down-steps), and every such path automatically touches $0$ later since it must climb back up to end at $p-q>0$. Reflecting a bad path that instead starts up — one that touches $0$ before recovering — at its first return to $0$ produces a path that starts down, and this map is a bijection between the two kinds of bad path. So bad paths of both kinds are equinumerous, giving total bad probability $2q/(p+q)$, and the good probability is $1-2q/(p+q)=(p-q)/(p+q)$.
      The reusable pattern: whenever "always ahead" needs to be counted, split the bad event by the sign of the first step and reflect one half onto the other — this is the exact argument reused, with different bookkeeping, in first passage and the running maximum.
    worked: >
      With $p=7$ votes to $q=4$: $\Pr(\text{A always strictly ahead})=(7-4)/(7+4)=3/11\approx0.273$.
    interview: >
      "In a vote count that ends $p$ to $q$, what's the probability the winner was ahead the whole way?" wants $(p-q)/(p+q)$ produced directly from the reflection argument, and a clean distinction from the weaker "never trailing, ties allowed" version, $(p-q+1)/(p+1)$.
    pitfalls: >
      Applying the formula when $p\le q$ — it requires a strict final lead $p>q$. Conflating the strict-ahead answer $(p-q)/(p+q)$ with the weak never-trailing answer $(p-q+1)/(p+1)$; these are different questions with different numbers.
    recap: >
      A leads wire-to-wire with probability $(p-q)/(p+q)$ — one reflection bijection splitting bad paths by their first step.
    dialogue:
      - part: Small elections, counted by hand
        teach: >
          A club election ends $3$ votes for Ada and $1$ for Bo. The four
          ballots are shuffled and read out one at a time, so Bo's ballot is
          equally likely to be read first, second, third or fourth.
      - ask: >
          What is the probability that Ada is strictly ahead after every ballot
          read?
        expects: "1/2"
        tolerance: 0.0005
        hint: >
          Write the four orders out, and track Ada's lead after each ballot.
        feedback: >
          AAAB and AABA keep Ada ahead throughout. ABAA ties at $1$–$1$, and
          BAAA puts Bo ahead at once. So $2$ of $4$, probability $1/2$.
      - ask: >
          Now the result is $4$ to $2$. Of the $\binom{6}{2} = 15$ orders, what
          fraction keep Ada strictly ahead throughout?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          The first two ballots are forced. Why?
        feedback: >
          Ada must win the first ballot, and then the second too, or it is a
          tie. After AA she leads by $2$ with $2$ A's and $2$ B's left, $6$
          arrangements, and only BB first brings her back to $0$. So $5$ of
          $15$, which is $1/3$.
      - ask: >
          With $p$ votes for Ada and $q$ for Bo, $p > q$, which formula fits
          both of your answers?
        choices:
          - text: >
              $q/p$
            feedback: >
              $3$ to $1$ gives $1/3$, but you found $1/2$. And $q/p$ grows as Bo
              gets more votes, the wrong direction.
          - text: >
              $p/(p + q)$
            feedback: >
              That is the chance the first ballot is Ada's, $3/4$ for the first
              election. Winning the first ballot is necessary, not sufficient.
          - text: >
              $(p - q)/(p + q)$
            correct: true
            feedback: >
              $2/4 = 1/2$ and $2/6 = 1/3$. The margin, as a share of the total
              vote, is the probability of leading wire to wire.
          - text: >
              $(p - q)/p$
            feedback: >
              That gives $2/3$ for the first election and $1/2$ for the second;
              you found $1/2$ and $1/3$.
        feedback: >
          A prediction from two cases. Now the reason.
      - part: Counting the bad counts
        ask: >
          In the $4$-to-$2$ election, what fraction of orders start with one of
          Bo's ballots?
        expects: "1/3"
        tolerance: 0.0005
        feedback: >
          Each of the $6$ ballots is equally likely to be read first, and $2$
          are Bo's: $2/6 = 1/3$. Every such order is bad for Ada at once.
      - reflect: >
          Bad orders make up $2/3$ in total, so the bad orders that *start
          with Ada* are another $1/3$ — exactly as many as those that start
          with Bo. Find a one-to-one map between the two kinds that explains
          why.
        hint: >
          A bad order that starts with Ada must tie at some point. What could
          you swap up to the first tie?
        answer: >
          Draw the count as a path, $+1$ per Ada ballot and $-1$ per Bo ballot.
          A bad path starting up must return to $0$; swap every ballot before
          that first return, which reflects the path's start and makes it begin
          down. Conversely a path starting down ends at $p - q > 0$, so it must
          cross $0$; swap everything before its first visit to $0$ and it
          begins up and touches $0$. The two kinds of bad path are matched one
          to one, so bad paths are $2q/(p + q)$ of all.
      - teach: >
          That is the *ballot theorem*: if Ada finishes with $p$ votes and Bo
          with $q < p$, and the ballots are read in uniformly random order,
          Ada is strictly ahead throughout with probability
          $1 - 2q/(p + q) = (p - q)/(p + q)$. The proof is the Reflection
          principle aimed at the first tie.
      - ask: >
          The map needs every order that starts with Bo to tie later. Why must
          it?
        choices:
          - text: >
              Because Bo is ahead after the first ballot
            feedback: >
              That makes the order bad, but it does not by itself produce a
              later tie. The tie comes from where the path has to finish.
          - text: >
              The path starts at $-1$, ends at $p - q > 0$, and moves by $1$ at
              a time, so it passes $0$
            correct: true
            feedback: >
              Right. Without a visit to $0$ there is nowhere to fold, and the
              strict margin $p > q$ is what guarantees one.
          - text: >
              It need not; those orders are just subtracted separately
            feedback: >
              If some B-first orders never tied, the map would miss them and
              the two kinds of bad orders would not match. The proof needs the
              tie, and it always exists.
        feedback: >
          The hypothesis $p > q$ is used twice: Ada must be able to be ahead at
          the end, and every B-first path must cross $0$ on its way there.
      - part: A real count, and the variants
        ask: >
          A referendum ends $10$ votes to $4$. What is the probability that the
          winning side led after every ballot?
        expects: "3/7"
        tolerance: 0.0005
        feedback: >
          $(10 - 4)/(10 + 4) = 6/14 = 3/7 \approx 0.429$.
      - ask: >
          How many of the $\binom{14}{4} = 1001$ possible orders is that?
        expects: "429"
        feedback: >
          $3/7$ of $1001$ is $429$. Enumerating $1001$ orders by hand is
          hopeless; one subtraction and one fold did it.
      - ask: >
          Back to $3$ to $1$. What is the probability that Ada is *never
          behind*, ties allowed?
        expects: "3/4"
        tolerance: 0.0005
        feedback: >
          AAAB, AABA and ABAA all qualify — ABAA ties at $1$–$1$ but never
          trails — and only BAAA fails, so $3/4$. The weak version has its own
          formula, $(p - q + 1)/(p + 1) = 3/4$, and confusing it with
          $(p - q)/(p + q) = 1/2$ is a different answer to a different question.
      - ask: >
          In the $10$-to-$4$ referendum, the ballots come in sealed boxes, and
          the box holding all $10$ winning votes happens to be opened first.
          Does $3/7$ still apply?
        choices:
          - text: >
              No: the order is not uniformly random, and here the winner leads
              throughout with probability $1$
            correct: true
            feedback: >
              Right. The theorem is a count over equally likely orders; change
              the order law and the count says nothing.
          - text: >
              Yes: the formula depends only on the final tally
            feedback: >
              It depends on the tally *and* on every order being equally likely.
              Opened first, the winning box puts that side ahead from the start
              and it never looks back.
          - text: >
              No: the answer becomes $(p - q + 1)/(p + 1)$
            feedback: >
              That is the never-trailing version under a uniform order — still
              uniform. Here the order is fixed, so the winner simply leads
              throughout.
        feedback: >
          In an interview, say the hypotheses with the number: final margin
          $p > q$, uniformly random order, strictly ahead. Then
          $(p - q)/(p + q)$, by reflecting the bad paths at their first tie.

  - node: quant-processes.random-walks.first-passage
    hook: >
      "Certain to happen eventually, yet the expected wait is infinite" is tested directly here, and it's the same trap that recurs throughout the unit whenever a $\Pr=1$ statement meets a heavy tail.
    explanation: >
      The hitting-time theorem $\Pr(T_a=n)=\frac{a}{n}\Pr(S_n=a)$ is a reflection consequence: among all paths ending at $a$ at time $n$, only a fraction $a/n$ reach $a$ for the *first* time at step $n$ rather than earlier, the same kind of "first crossing" bookkeeping that drove the ballot problem.
      Because the walk can only move one level at a time, reaching level $a$ means passing through every intermediate level $1,\dots,a-1$ first, and the walk restarts fresh (by stationary independent increments) after each one — so $T_a$ is a sum of $a$ independent copies of $T_1$. That decomposition means understanding the single-level case fully answers the general case by addition.
      $\Pr(T_a<\infty)=1$ for the symmetric walk — every level is reached eventually — but the waiting-time tail decays only like $n^{-3/2}$, a polynomial tail slow enough that $\mathbb{E}[T_a]=\sum_n n\Pr(T_a=n)$ diverges. "Certain" and "fast" are unrelated claims here.
    worked: >
      $\Pr(T_2=4)=\frac{2}{4}\Pr(S_4=2)$. Since $\Pr(S_4=2)=\binom{4}{3}2^{-4}=4/16=1/4$, this gives $\Pr(T_2=4)=\frac12\cdot\frac14=1/8$.
    interview: >
      "How many flips until your cumulative winnings first hit $+5$?" wants two facts stated together: the level is reached with probability $1$, but the expected number of flips is infinite — and the reason is the decomposition into $5$ independent copies of the one-level wait, each already infinite-mean.
    pitfalls: >
      Inferring finite expected waiting time from $\Pr(T_a<\infty)=1$ — probability-one events can have infinite mean. Using $n$ of the wrong parity for $T_a=n$; $n$ and $a$ must match parity exactly as $S_n$ does.
    recap: >
      $\Pr(T_a=n)=(a/n)\Pr(S_n=a)$: the level is hit with certainty, but as a sum of $a$ infinite-mean pieces, the wait has infinite expectation too.
    dialogue:
      - part: The first time he is three ahead
        teach: >
          A gambler bets one unit per flip of a fair coin and walks away the
          first time he is $3$ units ahead. Call that flip $T_3$. He cannot
          leave before flip $3$, and he may never leave at all.
      - ask: >
          What is $\Pr(T_3 = 5)$?
        expects: "3/32"
        tolerance: 0.0005
        hint: >
          He must be at $+3$ after flip $5$, which takes four wins and one
          loss. Which placements of the loss would have sent him home earlier?
        feedback: >
          The loss can fall on flip $1$, $2$, $3$, $4$ or $5$. If it falls on
          flip $4$ or $5$, he was already at $+3$ after flip $3$. That leaves
          DUUUU, UDUUU and UUDUU: $3$ paths of probability $1/32$, so $3/32$.
      - ask: >
          Of the $5$ paths that are at $+3$ at flip $5$, what fraction arrive
          there for the first time?
        expects: "3/5"
        tolerance: 0.0005
        feedback: >
          $3$ of $5$. Hold on to that ratio: it is the level divided by the
          time, $3/5$.
      - reflect: >
          A first arrival at $a$ on step $n$ means: at $a - 1$ after step
          $n - 1$, never having touched $a$, then one step up. Which tool from
          the Reflection principle counts the middle condition, and what does
          it give?
        hint: >
          Count all paths to $a - 1$, then remove the ones that touched $a$.
        answer: >
          Paths from $0$ to $a - 1$ in $n - 1$ steps, minus those that touched
          $a$ on the way; folding at the first visit sends the second set to
          paths ending at $2a - (a - 1) = a + 1$. With $u = (n + a)/2$ that is
          $\binom{n-1}{u-1} - \binom{n-1}{u}$, and a line of algebra shows this
          equals $(a/n)\binom{n}{u}$. For $a = 3$, $n = 5$: $\binom{4}{3} -
          \binom{4}{4} = 3$, and $(3/5) \cdot 5 = 3$.
      - teach: >
          That is the *hitting-time theorem*: with
          $T_a = \min\{n \ge 1 : S_n = a\}$ and $a \ge 1$,
          $\Pr(T_a = n) = (a/n)\Pr(S_n = a)$ for $n \ge a$ of the same parity
          as $a$. Of all the ways to *be* at $a$ at time $n$, a fraction $a/n$
          are first arrivals.
      - ask: >
          What is $\Pr(T_3 = 7)$?
        expects: "9/128"
        tolerance: 0.0005
        hint: >
          Start from $\Pr(S_7 = 3)$.
        feedback: >
          $\Pr(S_7 = 3) = \binom{7}{5}/128 = 21/128$, and $3/7$ of that is
          $9/128 \approx 0.070$. Only $9$ of the $21$ paths at $+3$ arrived on
          the last step.
      - part: Certain, but not soon
        ask: >
          Is the gambler sure to reach $+3$ eventually?
        choices:
          - text: >
              No: with positive probability the walk drifts down and stays down
            feedback: >
              A fair walk has no drift to stay down with. Fold the paths that
              touch $3$ and end below it, and $\Pr(T_3 > n) = \Pr(-3 \le S_n <
              3)$ — the chance of sitting in a fixed window, which goes to $0$
              as $S_n$ spreads out like $\sqrt{n}$.
          - text: >
              Yes, with probability $1$
            correct: true
            feedback: >
              Right. By the fold, $\Pr(T_3 > n) = \Pr(-3 \le S_n < 3)$, the
              chance of being in a window of six sites, and that goes to $0$.
          - text: >
              Only with probability $1/2$, since the first step is down half
              the time
            feedback: >
              A first step down only delays him. From $-1$ the walk still has
              every chance to climb, and it does, with probability $1$.
        feedback: >
          Every level of the fair walk is reached with probability $1$. That is
          a statement about *whether*, not *when*.
      - ask: >
          A gambler who quits the first time he is $1$ ahead: what is the
          probability he is still playing after $4$ flips?
        expects: "3/8"
        tolerance: 0.0005
        hint: >
          Use the window: $\Pr(T_1 > n) = \Pr(-1 \le S_n < 1)$.
        feedback: >
          With $n = 4$ the window holds only $S_4 = 0$ (odd values are
          impossible), so $\Pr(T_1 > 4) = \binom{4}{2}/16 = 3/8$. Listing the
          paths that stay at or below $0$ gives the same six.
      - ask: >
          Since the gambler reaches $+1$ with probability $1$, what is
          $\mathbb{E}[T_1]$?
        choices:
          - text: >
              Finite: anything that happens with probability $1$ has a finite
              expected waiting time
            feedback: >
              Probability $1$ says the wait is finite on almost every path; the
              mean also needs the long waits to be rare enough. Here
              $\Pr(T_1 > n)$ is roughly the chance $S_n$ sits at one site, of
              order $1/\sqrt{n}$ — far too slow.
          - text: >
              About $2$, since half the time it takes one flip
            feedback: >
              Half the time it takes one flip, but the other half the gambler
              may go far below $0$ first, and those long excursions dominate the
              average.
          - text: >
              Infinite: $\Pr(T_1 > n)$ decays only like $1/\sqrt{n}$
            correct: true
            feedback: >
              Right. $\mathbb{E}[T_1] = \sum_{n \ge 0} \Pr(T_1 > n)$, and a
              series of terms of size $1/\sqrt{n}$ diverges. Equivalently,
              $\Pr(T_1 = n)$ decays like $n^{-3/2}$, too heavy a tail for a mean.
        feedback: >
          Certain and infinite in mean at once. Holding both is the point of
          this node.
      - ask: >
          Why is $T_3$ the sum of three independent copies of $T_1$?
        choices:
          - text: >
              To reach $+3$ the walk passes $+1$, then $+2$; after each first
              visit it starts afresh
            correct: true
            feedback: >
              Right. Steps of size $1$ force it through every level, and
              independent increments mean the climb from $+1$ to $+2$ is a new
              copy of the climb from $0$ to $+1$.
          - text: >
              Because $3 = 1 + 1 + 1$ and $S_n$ is linear in the steps
            feedback: >
              Linearity is about positions at fixed times. $T_3$ is a random
              time; the decomposition comes from passing through levels, not
              from adding steps.
          - text: >
              It is not: the three climbs share steps, so they are dependent
            feedback: >
              They use disjoint stretches of the walk — the first climb ends
              exactly where the second begins — so they are independent.
        feedback: >
          So $\mathbb{E}[T_3] = 3\,\mathbb{E}[T_1] = \infty$ as well, and the
          single-level case answers every level.
      - part: When the coin is unfair
        ask: >
          The coin now wins with probability $p = 1/3$. What happens to the
          chance of ever being $2$ ahead?
        choices:
          - text: >
              Still $1$: every level is eventually reached
            feedback: >
              That was the fair walk. With $p < 1/2$ the walk drifts to
              $-\infty$, and a path that heads down early may never come back
              up.
          - text: >
              It becomes $(p/q)^{2} = 1/4$
            correct: true
            feedback: >
              Right. Each new level is reached with probability $p/q = 1/2$,
              and the two climbs are independent, so $(1/2)^{2} = 1/4$.
          - text: >
              It becomes $p^{2} = 1/9$, the chance of two straight wins
            feedback: >
              Two straight wins is one way to get there, not the only one. He
              can lose first and still climb back; $(p/q)^{2} = 1/4$ counts all
              of them.
        feedback: >
          With a losing edge, $\Pr(T_a < \infty) = (p/q)^{a}$. Said aloud for a
          fair coin: the level is reached with probability $1$, the expected
          wait is infinite, and $\Pr(T_a = n) = (a/n)\Pr(S_n = a)$ gives the
          exact law.

  - node: quant-processes.random-walks.max-distribution
    hook: >
      "What's the probability the walk ever reaches new territory by time $n$" sounds like it needs the maximum's own distribution built from scratch — reflection instead reads it straight off the endpoint law.
    explanation: >
      The key identity is that the events $\{M_n\ge a\}$ and $\{T_a\le n\}$ are literally the same event — the running maximum reaches $a$ exactly when the hitting time of $a$ is at most $n$. That converts a question about a maximum into a question about an endpoint, which reflection already answers.
      Every path ending above $a$ has necessarily crossed $a$ already (the walk can't jump over a level), so it counts directly toward $\{M_n\ge a\}$; every path ending exactly at $a$ also counts, but reflecting the paths that touch $a$ and end below it produces exactly the "ends above $a$" paths a second time — hence the factor of two and the correction: $\Pr(M_n\ge a)=2\Pr(S_n\ge a)-\Pr(S_n=a)$.
      The mental model is: don't track the maximum directly — reflect every overshoot back down, and the endpoint alone tells you whether the level was ever touched. The reflection argument needs $a\ge1$: at $a=0$ there is nothing to fold, since $M_n\ge0$ holds by definition. The formula still returns the right value $1$ there, because $\Pr(S_n\ge0)+\Pr(S_n\ge1)=\Pr(S_n\ge0)+\Pr(S_n\le-1)=1$ by symmetry; below $0$ it gives nonsense.
    worked: >
      For $n=6$, $a=2$: $\Pr(S_6\ge2)=\Pr(S_6=2)+\Pr(S_6=4)+\Pr(S_6=6)=15/64+6/64+1/64=22/64$, and $\Pr(S_6=2)=15/64$. So $\Pr(M_6\ge2)=2(22/64)-15/64=29/64\approx0.453$.
    interview: >
      "Does a cumulative random walk ever cross a resistance level $a$ within $n$ steps?" is answered by converting the maximum question to an endpoint question via $\{M_n\ge a\}=\{T_a\le n\}$, not by trying to characterize the maximum's law directly.
    pitfalls: >
      Applying the formula at a level below the start — for $a<0$ the event $M_n\ge a$ is certain since $S_0=0$, and the formula can return a "probability" above $1$; at $a=0$ it gives the correct $1$ only by symmetry, since the reflection proof needs $a\ge1$. Forgetting the $-\Pr(S_n=a)$ correction and simply doubling $\Pr(S_n\ge a)$, which overcounts paths ending exactly at $a$.
    recap: >
      $\Pr(M_n\ge a)=2\Pr(S_n\ge a)-\Pr(S_n=a)$ — the high-water mark of the walk, read off the endpoint law by reflection.
    dialogue:
      - part: The high-water mark of four steps
        teach: >
          A fair walk takes $4$ steps from $0$. Its high-water mark $M_4$ is the
          highest height it reaches, counting the start, so $M_4 \ge 0$ always.
          You want the chance that the high-water mark is at least $2$.
      - ask: >
          What is $\Pr(M_4 \ge 2)$?
        expects: "3/8"
        tolerance: 0.0005
        hint: >
          Paths that start UU reach $2$ at once. Which others reach it later?
        feedback: >
          The $4$ paths starting UU, plus UDUU and DUUU, which reach $2$ on the
          last step: $6$ paths, $6/16 = 3/8$.
      - ask: >
          $\Pr(S_4 \ge 2) = 5/16$, one path short of $\Pr(M_4 \ge 2)$. Which path
          reaches $2$ without ending at $2$ or above?
        choices:
          - text: >
              UDUU
            feedback: >
              UDUU ends at $2$, so it is already in $\Pr(S_4 \ge 2)$.
          - text: >
              DUUD
            feedback: >
              DUUD climbs only to $1$. It never reaches $2$, so it is in neither
              count.
          - text: >
              UUDD
            correct: true
            feedback: >
              Right. UUDD touches $2$ at step $2$ and ends at $0$. Its fold after
              the first visit to $2$ is UUUU, which ends at $4$.
        feedback: >
          The high-water mark sees paths that went up and came back; the
          endpoint does not. Those are exactly the paths the Reflection
          principle counts.
      - reflect: >
          Split $\{M_n \ge a\}$ into paths that end at $a$ or above, and paths
          that touch $a$ but end below it. Count the second kind with the
          fold, and write $\Pr(M_n \ge a)$ in terms of the endpoint $S_n$ alone.
        hint: >
          Folding after the first visit to $a$ sends an endpoint $b < a$ to
          $2a - b$. Where do all those images lie?
        answer: >
          The fold matches paths that touch $a$ and end below it with paths that
          end strictly above $a$ — every such path touched $a$ on its way up. So
          the second kind has probability $\Pr(S_n > a) = \Pr(S_n \ge a + 1)$, and
          $\Pr(M_n \ge a) = \Pr(S_n \ge a) + \Pr(S_n \ge a + 1)$. A question about
          the whole path has become a question about where it ends.
      - teach: >
          That is the *law of the running maximum*. Since
          $\{M_n \ge a\} = \{T_a \le n\}$ — the high-water mark reaches $a$
          exactly when the walk has hit $a$ by time $n$ — reflection gives, for
          $a \ge 1$, $\Pr(M_n \ge a) = \Pr(S_n \ge a) + \Pr(S_n \ge a + 1) =
          2\Pr(S_n \ge a) - \Pr(S_n = a)$.
      - part: Reading the maximum off the endpoint
        ask: >
          What is $\Pr(M_8 \ge 4)$?
        expects: "23/128"
        tolerance: 0.0005
        hint: >
          You need $\Pr(S_8 \ge 4)$ and $\Pr(S_8 \ge 5)$.
        feedback: >
          $\Pr(S_8 \ge 4) = (28 + 8 + 1)/256 = 37/256$, and since $S_8$ is even,
          $\Pr(S_8 \ge 5) = \Pr(S_8 \ge 6) = 9/256$. The sum is $46/256 = 23/128
          \approx 0.180$.
      - ask: >
          Subtract the formula at $a + 1$ from the formula at $a$. What is
          $\Pr(M_n = a)$?
        choices:
          - text: >
              $\Pr(S_n = a)$
            feedback: >
              That forgets the paths that peak at $a$ and finish lower. The
              difference of the two formulas leaves two endpoint terms, not one.
          - text: >
              $\Pr(S_n = a) + \Pr(S_n = a + 1)$
            correct: true
            feedback: >
              Right. $[\Pr(S_n \ge a) + \Pr(S_n \ge a + 1)] - [\Pr(S_n \ge a + 1) +
              \Pr(S_n \ge a + 2)]$ telescopes to the two point masses. At most one
              of them is nonzero, by parity.
          - text: >
              $2\Pr(S_n = a)$
            feedback: >
              The doubling belongs to tail probabilities, not point masses.
              Difference the formula and you get $a$ and $a + 1$, not $a$ twice.
        feedback: >
          The law of the maximum is the law of the endpoint, shifted and
          paired: one of $a$, $a + 1$ has the right parity, and that one is the
          answer.
      - ask: >
          What is $\Pr(M_8 = 4)$?
        expects: "7/64"
        tolerance: 0.0005
        feedback: >
          $\Pr(S_8 = 4) + \Pr(S_8 = 5) = 28/256 + 0 = 7/64 \approx 0.109$.
      - ask: >
          What is $\Pr(M_5 = 1)$?
        expects: "5/16"
        tolerance: 0.0005
        feedback: >
          $\Pr(S_5 = 1) + \Pr(S_5 = 2) = \binom{5}{3}/32 + 0 = 10/32 = 5/16$.
          After an odd number of steps the parity switches, so the surviving
          term is $\Pr(S_n = a)$ when $n - a$ is even and $\Pr(S_n = a + 1)$
          otherwise.
      - part: The terms people drop
        ask: >
          A candidate says touching a level is "twice as likely as ending at or
          above it", and quotes $\Pr(M_8 \ge 4) = 2 \cdot 37/256 = 74/256$. What
          went wrong?
        choices:
          - text: >
              The paths ending exactly at $4$ are counted twice;
              subtract $\Pr(S_8 = 4) = 28/256$
            correct: true
            feedback: >
              Right. $74/256 - 28/256 = 46/256$. The clean doubling holds only
              when $\Pr(S_n = a) = 0$, which happens when $n$ and $a$ have
              different parity.
          - text: >
              Nothing: the fold doubles every path that ends at or above $a$
            feedback: >
              Not every one. A path ending *exactly* at $a$ folds to another path
              ending at $2a - a = a$, not to one ending above. Doubling counts
              the $28$ paths ending at $4$ twice.
          - text: >
              The factor should be $1/2$: touching is half as likely
            feedback: >
              Touching is *more* likely than ending above — every path ending
              above has touched. The factor is at most $2$, never below $1$.
        feedback: >
          $2\Pr(S_n \ge a) - \Pr(S_n = a)$: the correction term is the whole
          difference between a right and a wrong answer whenever $n$ and $a$
          share parity.
      - ask: >
          Someone applies the same formula to the level $a = -2$ for $n = 6$ and
          gets $\Pr(S_6 \ge -2) + \Pr(S_6 \ge -1) = 57/64 + 42/64 = 99/64$. What
          is the diagnosis?
        choices:
          - text: >
              An arithmetic slip; redone carefully it comes to $57/64$
            feedback: >
              Both numbers are right. The trouble is that the formula is being
              used where its proof says nothing.
          - text: >
              The formula is right; $M_n$ can be negative, so the answer is $99/64$
              of something
            feedback: >
              No probability exceeds $1$, and $M_n \ge S_0 = 0$ by definition,
              so $\Pr(M_6 \ge -2) = 1$.
          - text: >
              The formula needs $a \ge 1$: the walk starts at $0$, so
              $M_6 \ge -2$ is certain and there is nothing to fold
            correct: true
            feedback: >
              Right. The fold acts at the first visit to $a$, and a level below
              the start is "visited" before the walk moves. A probability above
              $1$ is the formula telling you so.
        feedback: >
          Reflection counts paths that *reach* a level above the start. For the
          high-water mark in an interview: convert $\{M_n \ge a\}$ to
          $\{T_a \le n\}$, fold, and read the endpoint law — with the correction
          term when parities match.

  - node: quant-processes.random-walks.reach-level-example
    hook: >
      This is the template interviewers reuse for "does it ever cross a level" questions, and its most quotable feature — visiting a level is exactly twice as likely as finishing at or above it — is a special case, not a universal law, which is the part worth actually understanding.
    explanation: >
      The doubling in "twice as likely to visit as to end above" comes specifically from the correction term $\Pr(S_n=a)$ vanishing, and that vanishing is a parity fact: with $n$ even and $a$ odd, $S_n$ can never equal $a$ exactly, since $S_n$ only lands on integers matching $n$'s parity. When that correction term is zero, $\Pr(M_n\ge a)=2\Pr(S_n\ge a)$ exactly; when $n$ and $a$ share parity, the correction term is generally nonzero and the ratio is something other than $2$.
      That distinction is the actual interview skill here: before reaching for "it's always twice as likely," check whether the target level's parity clashes with the step count's parity — that clash is precisely what makes "touching" a level strictly easier to satisfy than "ending at or above" it, since a path can touch an odd level on its way past even though it can never rest there at an even time.
    worked: >
      For $n=8$, $a=2$ — same parity, so the doubling does *not* apply cleanly. $\Pr(S_8=2)=\binom{8}{5}2^{-8}=56/256$. $\Pr(S_8\ge2)=(56+28+8+1)/256=93/256$. So $\Pr(M_8\ge2)=2(93/256)-56/256=130/256=65/128\approx0.508$, only about $1.4\times$ larger than $\Pr(S_8\ge2)\approx0.363$ — nowhere near the factor of $2$ seen when the parities clash.
    interview: >
      "Does a walk of length $n$ ever reach level $a$?" should trigger an immediate parity check between $n$ and $a$ before deciding whether the "exactly double" shortcut is even available.
    pitfalls: >
      Assuming the factor of two between "ever touches" and "ends at or above" holds universally — it only holds when $\Pr(S_n=a)=0$ by a parity mismatch between $n$ and $a$. Forgetting to verify that mismatch before quoting the shortcut.
    recap: >
      $11/32\approx34\%$ chance of touching $+3$ in ten tosses, exactly double the ending-there-or-above probability — because $10$ and $3$ have clashing parity, which kills the correction term.
    dialogue:
      - part: Seven rounds to get two ahead
        teach: >
          You play seven rounds of a fair game, winning or losing one unit per
          round, and you will bank your winnings the moment you are $2$ units
          ahead. What is the chance that moment comes within the seven rounds?
      - ask: >
          Start with the endpoint. What is the probability of finishing the
          seven rounds exactly $2$ ahead?
        expects: "0"
        feedback: >
          After $7$ rounds the total is odd, so $\Pr(S_7 = 2) = 0$. That zero
          is about to do a lot of work.
      - ask: >
          To finish at $+2$ or above, then, you must finish at $+3$ or above.
          What is the smallest number of wins out of seven that does that?
        expects: "5"
        feedback: >
          $2U - 7 \ge 3$ gives $U \ge 5$: five, six or seven wins.
      - ask: >
          What is $\Pr(S_7 \ge 2)$?
        expects: "29/128"
        tolerance: 0.0005
        hint: >
          Add $\binom{7}{5}$, $\binom{7}{6}$ and $\binom{7}{7}$.
        feedback: >
          $(21 + 7 + 1)/128 = 29/128 \approx 0.227$.
      - ask: >
          Now the question asked: what is the probability you are $2$ ahead at
          some point within the seven rounds?
        expects: "29/64"
        tolerance: 0.0005
        hint: >
          The Law of the running maximum: $2\Pr(S_n \ge a) - \Pr(S_n = a)$.
        feedback: >
          $2 \cdot 29/128 - 0 = 58/128 = 29/64 \approx 0.453$. Nearly a coin
          flip, from a game that ends at $+2$ or better less than a quarter of
          the time.
      - reflect: >
          The answer is *exactly* twice $\Pr(S_7 \ge 2)$. Say which paths the
          fold pairs up here, and why nothing spoils the factor of two.
        answer: >
          Every path that touches $+2$ either ends above $2$ or ends below it,
          because none can end *at* $2$ after seven rounds. The fold after the
          first visit to $2$ matches the ones ending below with the ones ending
          above, so the two halves are equal and the total is twice
          $\Pr(S_7 \ge 3)$. The correction term $\Pr(S_n = a)$ is the only thing
          that could break the doubling, and parity has set it to $0$.
      - part: Same game, a level of matching parity
        ask: >
          What is the probability you are $3$ ahead at some point within the
          seven rounds?
        expects: "37/128"
        tolerance: 0.0005
        hint: >
          Now $\Pr(S_7 = 3)$ is not zero.
        feedback: >
          $\Pr(S_7 \ge 3) = 29/128$ and $\Pr(S_7 = 3) = \binom{7}{5}/128 =
          21/128$, so $2 \cdot 29/128 - 21/128 = 37/128 \approx 0.289$.
      - ask: >
          How many times $\Pr(S_7 \ge 3)$ is that?
        expects: "1.276"
        tolerance: 0.005
        feedback: >
          $37/29 \approx 1.28$. With matching parity, the $21$ paths ending
          exactly at $3$ fold onto paths ending at $3$ again, so they count only
          once, and the ratio falls well short of $2$.
      - ask: >
          A colleague's rule of thumb: "touching a level is twice as likely as
          finishing at or above it." When is it exactly right?
        choices:
          - text: >
              Always: it is the Reflection principle
            feedback: >
              The fold gives $2\Pr(S_n \ge a) - \Pr(S_n = a)$. You just saw the
              ratio come out at $1.28$ when the last term was $21/128$.
          - text: >
              When $n$ and $a$ have different parity
            correct: true
            feedback: >
              Right. Then $\Pr(S_n = a) = 0$, and $\Pr(M_n \ge a) =
              2\Pr(S_n \ge a)$ exactly. Seven rounds and level $2$; ten tosses
              and level $3$.
          - text: >
              Only in the limit of many steps
            feedback: >
              For large $n$ the correction $\Pr(S_n = a)$ does shrink, so the
              ratio approaches $2$. But with clashing parity it is exactly $2$
              already at $n = 7$.
        feedback: >
          Check parity before quoting the shortcut. That check is the interview
          skill this example exists to drill.
      - part: The fold, seen as a count
        ask: >
          Back to level $2$. What is the probability that you are $2$ ahead at
          some point but finish *below* $+2$?
        expects: "29/128"
        tolerance: 0.0005
        feedback: >
          $29/64 - 29/128 = 29/128$: exactly the probability of finishing at
          $+3$ or above. Those are the two halves the fold pairs, path for path.
      - ask: >
          Asked "what is the chance a fair walk reaches $+2$ within $7$ steps?",
          which answer do you give?
        choices:
          - text: >
              $29/128$: five or more wins out of seven
            feedback: >
              That is the chance of *finishing* at $+3$ or above. It leaves out
              every path that went up to $2$ and came back down.
          - text: >
              $\binom{7}{2}/128$: choose when the two wins happen
            feedback: >
              $\binom{7}{2}/128 = 21/128$ is the chance of exactly two wins,
              which ends the game at $-3$. Reaching $+2$ depends on the order of
              the wins, not on a fixed number of them.
          - text: >
              $29/64$, about $45\%$: twice the chance of finishing at $+3$ or
              above, since $7$ and $2$ have different parity
            correct: true
            feedback: >
              Right — the number, and the reason the shortcut is exact.
        feedback: >
          The spoken version: "convert to the running maximum, parity kills the
          correction, so it is twice $\Pr(S_7 \ge 3)$, which is $29/64$."

  - node: quant-processes.random-walks.return-origin
    hook: >
      $u_{2n}\sim1/\sqrt{\pi n}$ is the one number in this unit worth having memorized cold — it drives recurrence, first return, and expected distance, and its derivation is a clean Stirling exercise worth being able to redo on a whiteboard.
    explanation: >
      $u_{2n}=\Pr(S_{2n}=0)=\binom{2n}{n}/4^n$ falls straight out of path counting: exactly $n$ of the $2n$ steps must go up.
      Stirling's approximation, $n!\sim\sqrt{2\pi n}(n/e)^n$, turns this into an asymptotic. Applying it to both factorials in $\binom{2n}{n}=(2n)!/(n!)^2$: the numerator is $\sim\sqrt{4\pi n}(2n/e)^{2n}$ and the denominator is $\sim2\pi n(n/e)^{2n}$. The load-bearing cancellation is in the exponential parts — $(2n/e)^{2n}=4^n(n/e)^{2n}$ exactly cancels the $(n/e)^{2n}$ in the denominator's square — leaving only the square-root prefactors: $\binom{2n}{n}\sim4^n\sqrt{4\pi n}/(2\pi n)=4^n/\sqrt{\pi n}$. Dividing by $4^n$ gives $u_{2n}\sim1/\sqrt{\pi n}$.
      The mental model: this decay is polynomial, not exponential — slow. That slowness is precisely why the walk keeps drifting back near the origin far more often than intuition expects, and it's the single fact every asymptotic later in the unit is built from.
    worked: >
      $u_{40}=\binom{40}{20}/4^{20}=137{,}846{,}528{,}820/1{,}099{,}511{,}627{,}776\approx0.1254$, against the Stirling estimate $1/\sqrt{20\pi}\approx0.1261$ — agreement to three digits already at $n=20$.
    interview: >
      "What's the probability a fair random walk is back at zero after $2n$ steps, for large $n$?" wants both the exact form $\binom{2n}{n}/4^n$ and the Stirling-derived $1/\sqrt{\pi n}$, with the cancellation of the exponential parts sketched, not just quoted.
    pitfalls: >
      Forgetting the return probability is exactly $0$ at odd times rather than small. Dropping the $\sqrt{2\pi n}$ prefactor in Stirling and canceling only the exponential terms, which loses the constant and gives the wrong asymptotic entirely.
    recap: >
      $\Pr(S_{2n}=0)=\binom{2n}{n}/4^n\sim1/\sqrt{\pi n}$ — the master asymptotic of the one-dimensional walk, derived by canceling Stirling's exponential terms and keeping the square-root prefactor.
    dialogue:
      - part: Level after eight flips
        teach: >
          Two players bet one unit on each flip of a fair coin. After $8$
          flips, what is the chance that neither is ahead — that the walk
          $S_n$ of the first player's winnings is back at $0$?
      - ask: >
          What is $\Pr(S_8 = 0)$?
        expects: "35/128"
        tolerance: 0.0005
        hint: >
          Being level means exactly four wins out of eight.
        feedback: >
          $\binom{8}{4}/2^{8} = 70/256 = 35/128 \approx 0.273$.
      - ask: >
          And $\Pr(S_6 = 0)$?
        expects: "5/16"
        tolerance: 0.0005
        feedback: >
          $\binom{6}{3}/2^{6} = 20/64 = 5/16 = 0.3125$. Write
          $u_{2n} = \Pr(S_{2n} = 0) = \binom{2n}{n}/4^{n}$; odd times give $0$.
      - ask: >
          By what factor did the chance fall from $6$ flips to $8$?
        expects: "7/8"
        tolerance: 0.0005
        feedback: >
          $(35/128)/(5/16) = 35/40 = 7/8$. In general
          $u_{2n}/u_{2n-2} = (2n - 1)/(2n)$: each extra pair of flips multiplies
          the chance by a factor just below $1$.
      - ask: >
          Those factors creep toward $1$. How does $u_{2n}$ behave for large $n$?
        choices:
          - text: >
              It falls like $4^{-n}$, the chance of one particular path
            feedback: >
              One path has probability $4^{-n}$, but $\binom{2n}{n}$ paths are
              level, and that count grows almost as fast as $4^{n}$. The two
              nearly cancel.
          - text: >
              It settles at a positive constant, since the factors approach $1$
            feedback: >
              Factors $1 - 1/(2n)$ approach $1$ too slowly: their logarithms
              add like $-\tfrac{1}{2}\sum 1/n$, which goes to $-\infty$. The
              product does go to $0$.
          - text: >
              It goes to $0$, but only like a power of $n$
            correct: true
            feedback: >
              Right — the factors are close enough to $1$ that the decay is
              polynomial, not exponential. The question is which power.
        feedback: >
          The exact form is easy; the size of $\binom{2n}{n}$ is the hard part.
      - reflect: >
          Which tool tells you the size of $\binom{2n}{n} = (2n)!/(n!)^{2}$?
          Apply it and say what cancels and what survives.
        hint: >
          Stirling's formula, $n! \sim \sqrt{2\pi n}\,(n/e)^{n}$.
        answer: >
          Stirling. The numerator is $\sim \sqrt{4\pi n}\,(2n/e)^{2n}$ and the
          denominator $\sim 2\pi n\,(n/e)^{2n}$. Since $(2n/e)^{2n} =
          4^{n}(n/e)^{2n}$, the exponential parts cancel down to $4^{n}$, and
          the square-root prefactors leave $\sqrt{4\pi n}/(2\pi n) =
          1/\sqrt{\pi n}$. So $\binom{2n}{n} \sim 4^{n}/\sqrt{\pi n}$.
      - teach: >
          Dividing by $4^{n}$ gives the master asymptotic of the
          one-dimensional walk: $u_{2n} = \binom{2n}{n}/4^{n} \sim
          1/\sqrt{\pi n}$. The chance of being exactly level decays, but only
          like $n^{-1/2}$.
      - part: How good is the estimate
        ask: >
          What does $1/\sqrt{\pi n}$ give for $u_8$, that is $n = 4$?
        expects: "0.2821"
        tolerance: 0.0005
        feedback: >
          $1/\sqrt{4\pi} \approx 0.2821$ against the exact $0.2734$: about $3\%$
          high, already at eight flips.
      - ask: >
          Estimate $u_{50}$.
        expects: "0.1128"
        tolerance: 0.0005
        feedback: >
          $n = 25$: $1/\sqrt{25\pi} \approx 0.1128$, against the exact
          $\binom{50}{25}/4^{25} \approx 0.1123$. The relative error shrinks
          like $1/(8n)$.
      - ask: >
          A candidate applies Stirling but keeps only the $(n/e)^{n}$ parts,
          dropping $\sqrt{2\pi n}$. What does he conclude?
        choices:
          - text: >
              $u_{2n} \sim 1/\sqrt{\pi n}$, the same thing
            feedback: >
              The $1/\sqrt{\pi n}$ *is* the prefactors. Drop them and nothing of
              it is left.
          - text: >
              $\binom{2n}{n} \approx 4^{n}$, so $u_{2n} \approx 1$ — a walk that
              is almost always level, which is absurd
            correct: true
            feedback: >
              Right. The exponential parts cancel exactly, so *all* the
              information is in the prefactors. Keeping only the leading
              exponential is the classic way to lose the answer.
          - text: >
              $u_{2n} \approx 4^{-n}$
            feedback: >
              The $4^{n}$ from the count cancels the $4^{n}$ in the denominator;
              that is the cancellation, not the answer.
        feedback: >
          When the exponential growth of a ratio cancels, the polynomial
          prefactor is the whole answer.
      - part: What the slow decay means
        ask: >
          How many times as many flips do you need to halve the chance of being
          exactly level?
        expects: "4"
        feedback: >
          $1/\sqrt{\pi n}$ halves when $n$ quadruples. The walk spreads over
          about $\sqrt{n}$ sites, and the origin keeps a share of order
          $1/\sqrt{n}$ of the mass.
      - ask: >
          On average, how many times are the players level during the first $8$
          flips, not counting the start?
        expects: "187/128"
        tolerance: 0.0005
        hint: >
          The number of times level is a sum of indicators, one per even time.
        feedback: >
          By linearity, $u_2 + u_4 + u_6 + u_8 = 1/2 + 3/8 + 5/16 + 35/128 =
          187/128 \approx 1.46$. Each term shrinks, but like $1/\sqrt{n}$, so
          the running sum grows like $\sqrt{n}$ without bound.
      - teach: >
          That unbounded sum is what this asymptotic opens up: the first-return
          law, the expected distance and recurrence all run on
          $u_{2n} \sim 1/\sqrt{\pi n}$. In an interview, give both forms —
          $\binom{2n}{n}/4^{n}$ exactly, $1/\sqrt{\pi n}$ asymptotically — and
          say that the exponentials cancel and the square roots survive.

  - node: quant-processes.random-walks.first-return
    hook: >
      Certain to come home, yet the average trip takes infinitely long — the same "$\Pr=1$ meets a heavy tail" trap as first passage, now pinned to an exact tail exponent worth remembering.
    explanation: >
      The first-return law $f_{2n}=u_{2n-2}-u_{2n}=u_{2n}/(2n-1)$ telescopes beautifully when summed: $\sum_{n\ge1}f_{2n}=\sum_{n\ge1}(u_{2n-2}-u_{2n})=u_0-\lim_{n\to\infty}u_{2n}$. Since $u_0=1$ and $u_{2n}\sim1/\sqrt{\pi n}\to0$ by the return-to-origin asymptotic, the sum is exactly $1$ — the walk returns to its start with certainty, proved using nothing but that single asymptotic fact.
      Certainty does not mean speed: feeding the same asymptotic into $f_{2n}=u_{2n}/(2n-1)$ gives $f_{2n}\sim1/(2\sqrt{\pi}\,n^{3/2})$, so $\mathbb{E}[T_0]=\sum_n2nf_{2n}\sim\sum_n1/(\sqrt{\pi}\sqrt{n})$ — a $p$-series with $p=1/2<1$, which diverges. The expected return time is infinite even though return itself is certain.
    worked: >
      The probability the first return to the origin happens exactly at step $10$: $f_{10}=u_{10}/9$, and $u_{10}=\binom{10}{5}/4^5=252/1024=63/256$, so $f_{10}=(63/256)/9=7/256\approx0.0273$.
    interview: >
      "Prove a fair coin-flip game returns to break-even with probability $1$, but takes infinite expected time" wants the telescoping-sum argument for certainty and the $n^{-3/2}$-tail comparison-to-a-divergent-series for the infinite mean, both stated explicitly.
    pitfalls: >
      Reasoning "it returns with probability $1$, so the mean must be finite" — a non sequitur; the tail exponent, not the total probability, controls whether the mean is finite. Misplacing which of $u_{2n-2}-u_{2n}$ or $u_{2n}/(2n-1)$ uses which index — both equal $f_{2n}$, but plugging the wrong $n$ into either form is a common slip.
    recap: >
      The walk comes home with probability $1$, yet the expected time to do it is infinite: $\Pr(T_0=2n)\sim n^{-3/2}/(2\sqrt{\pi})$, a tail too heavy for a finite mean.
    dialogue:
      - part: The next time they are level
        teach: >
          Two players start level and bet one unit per flip of a fair coin. Let
          $T_0$ be the first flip after the start at which they are level again.
          It can only be even.
      - ask: >
          What is $\Pr(T_0 = 4)$?
        expects: "1/8"
        tolerance: 0.0005
        hint: >
          The path must avoid $0$ at step $2$ and be at $0$ at step $4$.
        feedback: >
          Only UUDD and DDUU qualify: UDUD and its relatives are already level
          at step $2$. So $2/16 = 1/8$.
      - ask: >
          With $u_{2n} = \Pr(S_{2n} = 0)$, compute $u_2 - u_4$.
        expects: "1/8"
        tolerance: 0.0005
        feedback: >
          $1/2 - 3/8 = 1/8$ — the same number. The chance of being level at
          step $4$ lost exactly the paths whose first return is at step $4$.
      - ask: >
          How many $6$-step paths are level for the first time at step $6$?
        expects: "4"
        hint: >
          They must stay strictly on one side for steps $1$ to $5$. Count the
          ones above $0$ and double.
        feedback: >
          Above $0$: UUDUDD and UUUDDD. Doubling for the mirror images gives
          $4$, a probability of $4/64 = 1/16$ — and $u_4 - u_6 = 3/8 - 5/16 =
          1/16$ again.
      - teach: >
          The pattern holds at every time. The first-return law is
          $f_{2n} = \Pr(T_0 = 2n) = u_{2n-2} - u_{2n}$, and since
          $u_{2n} = u_{2n-2}\cdot(2n - 1)/(2n)$, it also equals
          $u_{2n}/(2n - 1)$. The first form is for adding up; the second is
          for computing.
      - reflect: >
          Add up $f_2 + f_4 + f_6 + \cdots$ forever using the first form. What
          is the total, and which fact about $u_{2n}$ from Return to the origin
          does it need?
        hint: >
          Write out the first three terms of the sum and look at what cancels.
        answer: >
          The sum telescopes: $(u_0 - u_2) + (u_2 - u_4) + \cdots + (u_{2n-2} -
          u_{2n}) = u_0 - u_{2n} = 1 - u_{2n}$. Since $u_{2n} \sim 1/\sqrt{\pi
          n} \to 0$, the total is $1$: the players are level again with
          probability $1$. The whole argument is one cancellation and one
          limit.
      - part: Certain, and how certain
        ask: >
          What is $\Pr(T_0 = 14)$?
        expects: "33/2048"
        tolerance: 0.0001
        hint: >
          Use the computing form, $u_{14}/13$.
        feedback: >
          $u_{14} = \binom{14}{7}/4^{7} = 3432/16384$, and dividing by $13$
          gives $264/16384 = 33/2048 \approx 0.0161$.
      - ask: >
          The partial sum says $\Pr(T_0 > 2n) = u_{2n}$. Roughly what is the
          chance the players are still not level again after $400$ flips?
        expects: "0.0399"
        tolerance: 0.0005
        feedback: >
          $u_{400} \approx 1/\sqrt{200\pi} \approx 0.0399$. About one pair in
          twenty-five is still waiting after four hundred flips.
      - part: But not soon
        ask: >
          What is the median of $T_0$?
        expects: "2"
        hint: >
          What is $\Pr(T_0 = 2)$?
        feedback: >
          $\Pr(T_0 = 2) = 1/2$, so half of all games are level again at the
          very first chance. The typical return is immediate.
      - ask: >
          And $\mathbb{E}[T_0]$?
        choices:
          - text: >
              About $2$ or $3$: the median is $2$ and most returns are quick
            feedback: >
              The median ignores how long the long waits are. One pair in
              twenty-five still waits past flip $400$, one in $125$ past flip
              $10{,}000$, and those waits dominate the mean.
          - text: >
              Finite, because the tail probabilities $u_{2n}$ go to $0$
            feedback: >
              Going to $0$ is not enough. $\mathbb{E}[T_0] = \sum_n
              \Pr(T_0 > n)$, and with terms of size $1/\sqrt{n}$ that sum
              diverges.
          - text: >
              Infinite
            correct: true
            feedback: >
              Right. $f_{2n} = u_{2n}/(2n - 1) \sim 1/(2\sqrt{\pi}\,n^{3/2})$,
              so $\sum 2n f_{2n}$ has terms of order $1/\sqrt{n}$, a divergent
              series.
        feedback: >
          Median $2$, mean $\infty$. The return is certain and usually
          immediate, and the rare long excursions are long enough to make the
          average infinite.
      - ask: >
          Suppose some other process had a first-return law decaying like
          $n^{-5/2}$ instead of $n^{-3/2}$, still summing to $1$. What decides
          whether its mean return time is finite?
        choices:
          - text: >
              Whether the return probabilities add to $1$
            feedback: >
              Both laws add to $1$, and that says only that the return happens.
              The mean depends on how fast the tail thins.
          - text: >
              The tail exponent: $\sum n \cdot n^{-5/2}$ converges, so this mean
              is finite
            correct: true
            feedback: >
              Right. Multiplying by $n$ costs one power; $n^{-3/2}$ becomes
              $n^{-1/2}$ and diverges, $n^{-5/2}$ becomes $n^{-3/2}$ and
              converges.
          - text: >
              Neither has a finite mean, since both can take arbitrarily long
            feedback: >
              Unbounded is not the same as infinite mean — a geometric wait is
              unbounded with a finite mean. The tail exponent decides.
        feedback: >
          Total probability says *whether*; the tail says *when*. In an
          interview: telescoping gives certainty, the $n^{-3/2}$ tail gives an
          infinite mean.

  - node: quant-processes.random-walks.expected-distance
    hook: >
      "On average, how far from the start is the walk after $n$ steps?" has a specific constant — $\sqrt{2/\pi}\approx0.8$ times $\sqrt{n}$ — and confusing it with the standard deviation $\sqrt{n}$ itself is the exact error interviewers are checking for.
    explanation: >
      The exact identity $\mathbb{E}|S_{2n}|=2n\,u_{2n}$ turns into the headline asymptotic by substituting the return-to-origin estimate directly: $\mathbb{E}|S_{2n}|\sim2n/\sqrt{\pi n}=2\sqrt{n/\pi}=\sqrt{4n/\pi}$, matching $\sqrt{2m/\pi}$ at $m=2n$. Nothing new is needed here beyond plugging the earlier asymptotic into the exact formula.
      The constant $\sqrt{2/\pi}\approx0.798$ is not arbitrary — it is exactly the ratio $\mathbb{E}|Z|/\sigma$ for a centered normal variable $Z$, consistent with $S_m$ having standard deviation $\sqrt{m}$: the expected *distance* from the origin is smaller than the *typical scale* of fluctuation $\sqrt{m}$, because occasionally being very close to $0$ pulls the average absolute value down below the root-mean-square value.
    worked: >
      At $m=40$: $u_{40}\approx0.1254$ (from return-to-origin), so $\mathbb{E}|S_{40}|=40(0.1254)\approx5.02$, closely matching the estimate $\sqrt{2(40)/\pi}=\sqrt{80/\pi}\approx5.05$.
    interview: >
      "Roughly how far from the start will a random walk be after $n$ steps, on average?" wants $\sqrt{2n/\pi}\approx0.8\sqrt{n}$, explicitly distinguished from the standard deviation $\sqrt{n}$ — a different constant answering a different question.
    pitfalls: >
      Quoting $\sqrt{n}$ instead of $\sqrt{2n/\pi}\approx0.8\sqrt{n}$ as the expected distance — that conflates mean absolute deviation with standard deviation. Applying the even-$m$ formula $2nu_{2n}$ at an odd $m$, or vice versa; the two parities have different exact formulas.
    recap: >
      Typical distance after $m$ steps is $\sqrt{2m/\pi}\approx0.8\sqrt{m}$, obtained by feeding the return-to-origin asymptotic into an exact identity — about $5$ after $40$ steps.
    dialogue:
      - part: How far, on average
        teach: >
          A fair walk takes $4$ steps from $0$. Its standard deviation is
          $\sqrt{4} = 2$, but the question here is different: on average, how
          far from the start does it end up — what is $\mathbb{E}|S_4|$?
      - ask: >
          What is $\mathbb{E}|S_4|$?
        expects: "3/2"
        tolerance: 0.0005
        hint: >
          $S_4$ is $\pm 4$ with probability $1/16$ each, $\pm 2$ with $4/16$
          each, and $0$ with $6/16$.
        feedback: >
          $\mathbb{E}|S_4| = 4 \cdot 2/16 + 2 \cdot 8/16 + 0 = 8/16 + 16/16 = 3/2$.
          Less than the standard deviation $2$.
      - ask: >
          What is $\mathbb{E}|S_5|$?
        expects: "15/8"
        tolerance: 0.0005
        hint: >
          $|S_5|$ is $5$, $3$ or $1$ with probabilities $2/32$, $10/32$ and
          $20/32$.
        feedback: >
          $(5 \cdot 2 + 3 \cdot 10 + 1 \cdot 20)/32 = 60/32 = 15/8$. One step
          added $15/8 - 3/2 = 3/8$ — which is exactly $u_4 = \Pr(S_4 = 0)$.
      - reflect: >
          Why should one more step add exactly $\Pr(S_4 = 0)$ to the expected
          distance? Think about what the next step does to $|S|$ from a nonzero
          position, and from $0$.
        hint: >
          From $+3$, the next step makes $|S|$ either $4$ or $2$.
        answer: >
          From any nonzero position the next step moves $|S|$ up or down by
          $1$ with equal chance, so on average it changes nothing. From $0$ it
          moves $|S|$ to $1$ for certain. So $\mathbb{E}|S_{n+1}| =
          \mathbb{E}|S_n| + \Pr(S_n = 0)$: the expected distance grows only
          through visits to the origin, and $\mathbb{E}|S_m|$ is the sum of
          $\Pr(S_k = 0)$ over $k < m$.
      - ask: >
          So what is $\mathbb{E}|S_6|$?
        expects: "15/8"
        tolerance: 0.0005
        feedback: >
          $\mathbb{E}|S_5| + \Pr(S_5 = 0) = 15/8 + 0 = 15/8$. After an odd
          number of steps the walk cannot be at $0$, so the next step adds
          nothing: the expected distance climbs in a staircase.
      - teach: >
          Summing the return probabilities in closed form gives the exact
          identities $\mathbb{E}|S_{2n}| = 2n\,u_{2n}$ and
          $\mathbb{E}|S_{2n+1}| = (2n + 1)\,u_{2n}$, with $u_{2n} =
          \binom{2n}{n}/4^{n}$. Check: $6u_6 = 6 \cdot 5/16 = 15/8$. Feeding in
          $u_{2n} \sim 1/\sqrt{\pi n}$ gives $\mathbb{E}|S_m| \sim
          \sqrt{2m/\pi}$.
      - part: The constant in front
        ask: >
          Estimate $\mathbb{E}|S_{400}|$.
        expects: "15.96"
        tolerance: 0.05
        feedback: >
          $\sqrt{800/\pi} \approx 15.96$; the exact $400\,u_{400}$ is $15.95$.
      - ask: >
          An interviewer asks how far from the start a fair walk is, on average,
          after $400$ steps. A candidate says $20$. What is the issue?
        choices:
          - text: >
              $20$ answers a different question: the mean distance is about
              $16$, since $\mathbb{E}|S_n| \le \sqrt{\mathbb{E}[S_n^{2}]}$
            correct: true
            feedback: >
              Right. Averaging $|S|$ weighs the many paths near $0$ more heavily
              than averaging $S^{2}$ does, so the mean distance sits below the
              standard deviation.
          - text: >
              None: the typical distance is $\sqrt{n} = 20$
            feedback: >
              $20$ is the standard deviation, the root-mean-square distance
              $\sqrt{\mathbb{E}[S_n^{2}]}$. The question asked for the mean
              distance, $\mathbb{E}|S_n|$, which is about $16$.
          - text: >
              The answer should be larger than $20$, because $|S_n|$ cannot be
              negative
            feedback: >
              Taking absolute values keeps the mean nonnegative, but it cannot
              push it past the root-mean-square: $\mathbb{E}|X| \le
              \sqrt{\mathbb{E}[X^{2}]}$ for every $X$.
        feedback: >
          Two numbers, two questions: $\sqrt{n}$ for the spread, $\sqrt{2n/\pi}$
          for the mean distance.
      - ask: >
          For large $m$, what is $\mathbb{E}|S_m|/\sqrt{m}$, to three decimals?
        expects: "0.798"
        tolerance: 0.002
        feedback: >
          $\sqrt{2/\pi} \approx 0.798$. It is the same constant as
          $\mathbb{E}|Z|/\sigma$ for a centred normal $Z$ — the walk, scaled by
          $\sqrt{m}$, looks normal.
      - part: The staircase, exactly
        ask: >
          For which $m$ is $\mathbb{E}|S_{m+1}| = \mathbb{E}|S_m|$?
        choices:
          - text: >
              Never: every step carries the walk further on average
            feedback: >
              You found $\mathbb{E}|S_6| = \mathbb{E}|S_5|$. A step adds only
              $\Pr(S_m = 0)$, which can be $0$.
          - text: >
              Every odd $m$
            correct: true
            feedback: >
              Right. At odd times $\Pr(S_m = 0) = 0$, so the next step adds
              nothing on average. That is why the odd formula reuses $u_{2n}$:
              $\mathbb{E}|S_{2n+1}| = \mathbb{E}|S_{2n+2}|$.
          - text: >
              Every even $m$
            feedback: >
              At even times the walk can sit at $0$, and from there the next
              step adds $1$ to the distance. Even steps are where the growth
              happens.
        feedback: >
          The expected distance grows only at even times, by $u_{2n}$ each
          time.
      - ask: >
          What is $\mathbb{E}|S_7|$ exactly?
        expects: "35/16"
        tolerance: 0.0005
        hint: >
          Use the odd-time formula with $2n + 1 = 7$.
        feedback: >
          $7u_6 = 7 \cdot 5/16 = 35/16 \approx 2.19$, against $\sqrt{14/\pi}
          \approx 2.11$. Using the even formula $2n\,u_{2n}$ at an odd time is
          the slip to avoid.
      - teach: >
          Said aloud: "about $0.8\sqrt{n}$ — four-fifths of the standard
          deviation — because the expected distance grows by the chance of
          being at the origin, and that chance is $1/\sqrt{\pi n}$."

  - node: quant-processes.random-walks.nonnegative-paths
    hook: >
      "The lead never changed hands" sounds like a rare, notable event — it is in fact exactly as likely as sitting precisely at zero, a genuinely surprising coincidence worth stating outright rather than re-deriving under pressure.
    explanation: >
      The ballot theorem's reflection argument, run with $p=q=n$ instead of $p>q$, is what produces the Catalan count $C_n=\binom{2n}{n}/(n+1)$ for paths of length $2n$ that return to $0$ while never dipping below it — the same "reflect the bad half onto the other" bookkeeping, just at the boundary case.
      Dropping the requirement to end at $0$ and asking only "did the path ever dip negative" produces the striking identity $\Pr(S_1\ge0,\dots,S_{2n}\ge0)=u_{2n}$ — numerically the *same* number as the probability of being exactly at the origin at time $2n$. That equality has a bijective proof, but the number itself is the useful part: since $u_{2n}\sim1/\sqrt{\pi n}$ decays only polynomially, staying entirely on one side of zero for $2n$ steps is a "large," $\sqrt{n}$-probability event, not a rare one.
      This is the direct setup for why long one-sided runs in a fair game are typical rather than exceptional — the next node makes that a full distributional statement.
    worked: >
      For $2n=16$ tosses: $u_{16}=\binom{16}{8}/4^8=12{,}870/65{,}536\approx0.1964$. So the probability heads is never behind tails over $16$ tosses is about $19.6\%$, and the strict version (heads strictly ahead throughout) is half that, $u_{16}/2\approx0.0982$.
    interview: >
      "In $2n$ coin flips, what's the probability heads is never behind tails?" is meant to be answered instantly with $u_{2n}$ — the same number as "probability of being at zero at time $2n$" — stated as a known identity, not derived live.
    pitfalls: >
      Conflating "never behind" (ties allowed, $\ge0$ throughout, probability $u_{2n}$) with "always strictly ahead" ($>0$ throughout, probability $u_{2n}/2$) — these differ by exactly a factor of $2$. Assuming the at-zero/nonnegative-throughout coincidence extends to the biased walk — it is a symmetric-walk fact only.
    recap: >
      Catalan numbers count nonnegative excursions, and the walk stays nonnegative through $2n$ steps with probability $u_{2n}=\binom{2n}{n}/4^n$ — the same number as being exactly at the origin at time $2n$.
    dialogue:
      - part: Never behind, by hand
        teach: >
          A fair coin is tossed $4$ times while you keep score: heads minus
          tails. You want the chance that heads is never behind — the score
          stays at $0$ or above after every toss.
      - ask: >
          What is that probability?
        expects: "3/8"
        tolerance: 0.0005
        hint: >
          The first toss must be heads. List the rest.
        feedback: >
          UUUU, UUUD, UUDU, UUDD, UDUU and UDUD stay at or above $0$: $6$ of
          the $16$ paths, so $3/8$. Anything starting UDD or D dips below.
      - ask: >
          Now a different event: what is the probability that the score is
          exactly $0$ after the $4$ tosses?
        expects: "3/8"
        tolerance: 0.0005
        feedback: >
          $\binom{4}{2}/16 = 6/16 = 3/8$. The same number as "never behind",
          for two events that look nothing alike — UUUU is never behind and not
          level; DDUU is level and was behind.
      - part: Excursions that come home
        ask: >
          Of the $\binom{8}{4} = 70$ eight-step paths that end at $0$, how many
          never go below $0$?
        expects: "14"
        hint: >
          You have met these as a Catalan number.
        feedback: >
          The Catalan number $C_4 = \binom{8}{4}/5 = 14$, exactly a fifth of
          the paths that come home.
      - reflect: >
          Why a fifth? Count the paths from $0$ back to $0$ that *do* dip to
          $-1$ by folding them at their first visit to $-1$, and subtract.
        hint: >
          Folding about the line at $-1$ sends an endpoint $0$ to $2(-1) - 0$.
        answer: >
          A path that dips touches $-1$; folding everything after its first
          visit sends the endpoint $0$ to $-2$, and every path ending at $-2$
          arises once. So the dipping paths number $\binom{8}{3} = 56$, and
          $70 - 56 = 14$ never dip. In general $\binom{2n}{n} - \binom{2n}{n-1}
          = \binom{2n}{n}/(n + 1)$ — the ballot argument run at the boundary
          case of a tie.
      - teach: >
          So $C_n = \binom{2n}{n}/(n + 1)$ counts the $2n$-step paths that come
          home without dipping below $0$. Drop the requirement to come home and
          the count of paths that never dip is $\binom{2n}{n}$ — exactly the
          number that end *at* $0$. Hence $\Pr(S_1 \ge 0, \dots, S_{2n} \ge 0) =
          u_{2n} = \binom{2n}{n}/4^{n}$, the coincidence you found at $2n = 4$.
      - part: Strictly ahead, and how often
        ask: >
          Over $12$ tosses, what is the probability that heads is never behind?
        expects: "231/1024"
        tolerance: 0.0005
        feedback: >
          $u_{12} = \binom{12}{6}/4^{6} = 924/4096 = 231/1024 \approx 0.226$.
          Better than one in five.
      - ask: >
          The strict version — heads ahead after *every* toss — has probability
          exactly half of that. Why half?
        choices:
          - text: >
              By symmetry: heads ahead throughout and tails ahead throughout are
              equally likely
            feedback: >
              Those two events are equally likely, but they do not add up to
              "never behind" — never behind includes ties. Symmetry alone does
              not give the factor.
          - text: >
              The last toss must be heads, which halves the count
            feedback: >
              UUUD is strictly ahead after every toss and ends on a tail. The
              toss that is forced is the first one, not the last.
          - text: >
              The first toss must be heads; after that the walk from $1$ must
              never drop below $1$, which is a never-behind event of $2n - 1$
              steps
            correct: true
            feedback: >
              Right. That second event has the same probability $u_{2n}$: at the
              odd time $2n - 1$ a nonnegative path is at $1$ or higher, so its
              last step cannot break it. Half times $u_{2n}$.
        feedback: >
          Strictly ahead throughout has probability $u_{2n}/2$; never behind has
          $u_{2n}$. Confusing them costs exactly a factor of $2$.
      - ask: >
          So over $12$ tosses, what is the probability heads leads after every
          toss?
        expects: "231/2048"
        tolerance: 0.0005
        feedback: >
          $u_{12}/2 = 231/2048 \approx 0.113$. Directly: $462$ of the $4096$
          paths.
      - ask: >
          A coin lands heads $70\%$ of the time. Over $2$ tosses, does "never
          behind" still have the probability of "level at the end"?
        choices:
          - text: >
              No: $0.7$ against $0.42$
            correct: true
            feedback: >
              Right. The identity matches sets of the same size, and only for
              the fair coin does equal size mean equal probability.
          - text: >
              Yes: the identity is a fact about path counts
            feedback: >
              The counts still match, but with a biased coin the paths no longer
              weigh the same. Never behind is $\Pr(\text{first is heads}) =
              0.7$; level is $2(0.7)(0.3) = 0.42$.
          - text: >
              Yes, after renormalising by $p$
            feedback: >
              There is no rescaling that fixes it: the two events have different
              shapes, and a biased coin weights those shapes differently.
        feedback: >
          The coincidence $\Pr(\text{never behind}) = \Pr(\text{level})$ is a
          symmetric-walk fact.
      - ask: >
          Over $1000$ fair tosses, roughly what is the chance heads is never
          behind?
        expects: "0.0252"
        tolerance: 0.0005
        feedback: >
          $u_{1000} \approx 1/\sqrt{500\pi} \approx 0.0252$, about one game in
          forty. Staying on one side is a $1/\sqrt{n}$ event, not an exponentially
          rare one, which is why "the lead never changed hands" happens far more
          often than intuition expects.

  - node: quant-processes.random-walks.recurrence-dimension
    hook: >
      "Does a random walk on a grid always find its way back?" has a clean yes/no answer that flips at dimension three — a favorite "does your intuition survive higher dimensions" question, and the flip is entirely about one exponent.
    explanation: >
      The recurrence criterion, $\sum_n\Pr(S_n=0)=\infty$, converts a hard probabilistic question into an elementary series-convergence test once you know how $\Pr(S_n=0)$ decays in each dimension. In one dimension, $u_{2n}\sim1/\sqrt{\pi n}$, and $\sum1/\sqrt{n}$ is a $p$-series with $p=1/2\le1$: it diverges, so the walk is recurrent.
      In two dimensions, rotating the lattice $45$ degrees decomposes the walk into two independent one-dimensional walks along the new axes, so returning to the origin means both coordinates return simultaneously: $u_{2n}\sim(1/\sqrt{\pi n})^2=1/(\pi n)$. That's the harmonic series, $p=1$ — still divergent, so still recurrent, but only barely, right at the boundary of the test.
      In three dimensions the decay steepens to $u_{2n}\sim cn^{-3/2}$, a $p=3/2>1$ series that converges — the walk becomes transient. The entire recurrent/transient split comes down to whether that one exponent crosses $1$, which is Kakutani's line: a drunk man finds his way home, but a drunk bird may not.
    worked: >
      Comparing partial sums makes the boundary concrete: $\sum_{n=1}^{1000}n^{-1/2}\approx61.8$ and is still climbing (as it must, since it diverges like $\sqrt{N}$), while $\sum_{n=1}^{1000}n^{-3/2}\approx2.55$, already within $0.07$ of its limit $\zeta(3/2)\approx2.612$ — the whole remaining tail is only about $2/\sqrt{1000}\approx0.063$.
    interview: >
      "Does a random walk on a $2$D grid return to its start? What about $3$D?" wants "yes with probability $1$" for $2$D and "no, positive probability of escaping forever" for $3$D, justified by the $\sum\Pr(S_n=0)$ criterion and the exponent crossing $1$ at $d=3$, not vague intuition about "more room to wander."
    pitfalls: >
      Assuming higher dimensions are "more likely" to return because there's more room to explore — that's backwards; more room is exactly why the walk escapes. Treating $2$D as quantitatively similar to $1$D just because both are recurrent — $2$D's return probability decays like $1/n$ against $1$D's $1/\sqrt{n}$, so $2$D excursions away from the origin are typically far longer.
    recap: >
      Recurrent in one and two dimensions, transient from three on — the split is exactly where the return-probability decay exponent crosses $1$ in $\sum_n\Pr(S_n=0)$.
    dialogue:
      - part: A walker on a grid
        teach: >
          A walker on an endless city grid steps north, south, east or west,
          each with probability $1/4$, independently, from the corner where she
          started. Will she ever be back at that corner?
      - ask: >
          What is the probability she is back at the start after $2$ steps?
        expects: "1/4"
        tolerance: 0.0005
        feedback: >
          Whatever the first step, the second must undo it: probability $1/4$.
          On a line the same chance is $1/2$.
      - ask: >
          A bird on a three-dimensional lattice has six directions, each with
          probability $1/6$. What is its chance of being back after $2$ steps?
        expects: "1/6"
        tolerance: 0.0005
        feedback: >
          Again the second step must undo the first: $1/6$. Each added
          dimension adds directions to wander off in.
      - reflect: >
          Being back at time $n$ is not the same event as ever coming back. If
          you only knew $\Pr(S_n = 0)$ for every $n$, how could you tell whether
          the walker returns with certainty? Think about the expected number of
          visits to the start.
        hint: >
          The number of visits is a sum of indicators, one for each time $n$.
        answer: >
          By linearity the expected number of visits is $\sum_{n \ge 0}
          \Pr(S_n = 0)$. If return is certain, the walk restarts at each return
          and comes back again and again, so the visits are infinite. If there
          is a fixed chance of never returning, each visit is another chance to
          escape, and the expected number of visits is finite. So the walk is
          recurrent exactly when $\sum_n \Pr(S_n = 0)$ diverges.
      - teach: >
          That criterion turns the question into one about a series, and the
          answer is *Pólya's recurrence theorem*: the simple symmetric walk on
          $\mathbb{Z}^{d}$ returns to its start with probability $1$ when
          $d = 1$ or $d = 2$, and with probability strictly less than $1$ when
          $d \ge 3$. Everything hangs on how fast $\Pr(S_{2n} = 0)$ decays.
      - ask: >
          On the line, $u_{2n} \sim 1/\sqrt{\pi n}$. Does $\sum_n u_{2n}$
          converge?
        choices:
          - text: >
              No: it is a $p$-series with $p = 1/2 \le 1$
            correct: true
            feedback: >
              Right, so the walk on the line is recurrent: back at $0$ with
              probability $1$, and then again, forever.
          - text: >
              Yes: the terms go to $0$
            feedback: >
              Terms going to $0$ is necessary, not sufficient. $\sum 1/\sqrt{n}$
              is a $p$-series with $p = 1/2$, and it diverges; its partial sums
              grow like $2\sqrt{N}$.
          - text: >
              You cannot tell from an asymptotic; you need the exact values
            feedback: >
              For positive terms, $u_{2n}/(1/\sqrt{\pi n}) \to 1$ is enough: the
              two series converge or diverge together. The asymptotic is
              precisely what the criterion needs.
        feedback: >
          One dimension: slow decay, divergent series, recurrent.
      - part: Two dimensions as two walks
        ask: >
          Rotate the grid by $45$ degrees: track $x + y$ and $x - y$. What does
          one step of the walker do to that pair?
        choices:
          - text: >
              Only one of them changes, by $\pm 1$
            feedback: >
              An east step $(+1, 0)$ changes $x + y$ by $+1$ *and* $x - y$ by
              $+1$. Every grid step moves both.
          - text: >
              They change by $\pm 2$ or $0$
            feedback: >
              That is $2x$ and $2y$ under a different step rule. For $x + y$
              and $x - y$, check east: $(+1, +1)$.
          - text: >
              Each changes by $\pm 1$, and the four steps give the four sign
              pairs, so they are two independent fair walks
            correct: true
            feedback: >
              Right. East gives $(+1, +1)$, west $(-1, -1)$, north $(+1, -1)$,
              south $(-1, +1)$: each sign pair with probability $1/4$, which is
              what two independent fair $\pm 1$ steps produce.
        feedback: >
          The walker is at the start exactly when both rotated walks are at
          $0$, so $\Pr(S_{2n} = 0) = u_{2n}^{2}$ in two dimensions.
      - ask: >
          What is the walker's probability of being back at the start after
          $6$ steps?
        expects: "25/256"
        tolerance: 0.0005
        feedback: >
          $u_6^{2} = (5/16)^{2} = 25/256 \approx 0.098$. Checking at $2$ steps:
          $u_2^{2} = (1/2)^{2} = 1/4$, as you found.
      - ask: >
          Using $u_{2n}^{2} \sim 1/(\pi n)$, roughly what is the probability of
          being back at the start after $400$ steps?
        expects: "0.0016"
        tolerance: 0.0001
        feedback: >
          $1/(200\pi) \approx 0.0016$, against $1/\sqrt{200\pi} \approx 0.040$
          on the line — twenty-five times rarer. The series is now harmonic,
          $\sum 1/n$, which still diverges, so the walk is still recurrent —
          but only just, and its excursions are far longer.
      - part: Three dimensions, and the line between
        ask: >
          In three dimensions $\Pr(S_{2n} = 0) \sim c\,n^{-3/2}$. What does the
          criterion say?
        choices:
          - text: >
              Recurrent: every lattice point can still be reached, so the start
              will be
            feedback: >
              Reachable is not the same as reached. The expected number of
              visits, $\sum c\,n^{-3/2}$, is finite, so with positive
              probability the bird never comes back.
          - text: >
              Recurrent, but more slowly than in two dimensions
            feedback: >
              Faster decay of the return chance is exactly what breaks
              recurrence. $n^{-3/2}$ is a convergent $p$-series, and convergence
              is the whole verdict: transient.
          - text: >
              Transient: $\sum n^{-3/2}$ converges, so the expected number of
              visits is finite and the return probability is below $1$
            correct: true
            feedback: >
              Right. The exponent crossed $1$. The return probability is about
              $0.3405$: two times in three the bird is gone for good.
        feedback: >
          The exponent of the decay is $d/2$. It is at most $1$ for $d \le 2$
          (divergent, recurrent) and above $1$ for $d \ge 3$ (convergent,
          transient).
      - ask: >
          A colleague argues that a walk in more dimensions should come back
          *more* reliably, because it has more routes home. What is wrong?
        choices:
          - text: >
              Nothing; the theorem is the other way round in high dimensions
            feedback: >
              The theorem says $d \ge 3$ is transient, so the colleague has the
              direction backwards.
          - text: >
              More routes home come with many more routes away: the walk spreads
              over a region of $n^{d/2}$ sites, and the start's share shrinks
              like $n^{-d/2}$
            correct: true
            feedback: >
              Right. More room is exactly why the walk escapes. In one
              dimension it spreads over about $\sqrt{n}$ sites; in three, about
              $n^{3/2}$.
          - text: >
              Only the number of steps matters, not the dimension
            feedback: >
              Two steps already differ: back with probability $1/2$, $1/4$ and
              $1/6$ in dimensions $1$, $2$ and $3$.
        feedback: >
          Kakutani's line, to close on in an interview: a drunk man finds his
          way home, but a drunk bird may not. The reason is one exponent
          crossing $1$.

  - node: quant-processes.random-walks.expected-visits
    hook: >
      Turning "is it recurrent" into "how many times, on average, does it come back" replaces a yes/no with an actual number — and that number swings from infinite to about $1.5$ just by adding two dimensions.
    explanation: >
      Every visit to the origin is a fresh restart of the walk, so the number of visits $V$ (counting time $0$) is geometric: needing at least $k$ visits means returning $k-1$ more times, each independently with probability $R$ (the probability of ever returning at all), giving $\Pr(V=k)=R^{k-1}(1-R)$ and the standard geometric mean $\mathbb{E}[V]=1/(1-R)$.
      That mean has a second expression worth knowing: $\mathbb{E}[V]=\sum_{n\ge0}\Pr(S_n=0)$, summing the exact return-origin sequence over all time — a Green's-function identity connecting the visit count directly to the analytic quantity from earlier in the unit. The dichotomy from recurrence follows immediately: $R=1$ in one and two dimensions forces $\mathbb{E}[V]=\infty$ (matching the divergent sum used to prove recurrence there), while $R\approx0.3405$ in three dimensions gives a small, genuinely finite number.
    worked: >
      In three dimensions, $R\approx0.3405$, so the full geometric tail is computable, not just its mean: $\Pr(V=1)=1-R\approx0.6595$ (never returns at all), $\Pr(V=2)=R(1-R)\approx0.2246$ (returns exactly once), $\Pr(V=3)=R^2(1-R)\approx0.0765$, and so on — consistent with the mean $\mathbb{E}[V]=1/(1-R)\approx1.516$.
    interview: >
      "What's the expected number of times a $3$D random walk revisits its starting point?" wants the geometric-restart argument, $\Pr(V=k)=R^{k-1}(1-R)$, stated explicitly — not just the number $1.52$ recited from memory.
    pitfalls: >
      Treating "finite expected visits" and "recurrence is all-or-nothing" as in tension — they're not: a finite mean like $1.52$ just means the geometric tail thins out fast, while recurrence itself remains a strict infinitely-often-or-finitely-often dichotomy. Forgetting to count time $0$ as the first visit when computing $V$.
    recap: >
      Visits are geometric with mean $1/(1-R)$, tying directly to $\sum_n\Pr(S_n=0)$ — infinite in one and two dimensions, about $1.5$ in three.
    dialogue:
      - part: Counting visits home
        teach: >
          A walk on the integers steps up with probability $0.7$ and down with
          probability $0.3$. Its chance of *ever* returning to its start is
          known to be $R = 1 - |p - q| = 0.6$. Let $V$ be the number of times it
          is at the start, counting time $0$.
      - ask: >
          What is $\Pr(V = 1)$, the chance it never comes back?
        expects: "0.4"
        tolerance: 0.0005
        feedback: >
          $V = 1$ means the visit at time $0$ is the only one: $1 - R = 0.4$.
      - ask: >
          What is $\Pr(V = 2)$, exactly one return?
        expects: "0.24"
        tolerance: 0.0005
        hint: >
          At the moment it returns, where is the walk, and what does its future
          look like?
        feedback: >
          It must return ($0.6$) and then, starting afresh from the start,
          never return again ($0.4$): $0.6 \times 0.4 = 0.24$.
      - ask: >
          Why may you multiply there? The first return might have taken $2$
          steps or $2000$.
        choices:
          - text: >
              You may not; a long first excursion makes a second return less
              likely
            feedback: >
              The walk has no memory of how long it was away. Once back at the
              start, its future steps are fresh independent steps from the same
              place, whatever came before.
          - text: >
              At a return the walk is at the start again, and the steps after it
              are independent of the steps before it
            correct: true
            feedback: >
              Right. Each return is a restart, so "returns again" has the same
              probability $R$ every time, independently of the history.
          - text: >
              Because $R$ is a long-run average over many walks
            feedback: >
              The multiplication is exact, not an average: it rests on the walk
              restarting at the moment of return.
        feedback: >
          Each visit is a fresh start, so each further return is another
          independent trial with success probability $R$.
      - reflect: >
          Write down $\Pr(V = k)$ for every $k$, name the distribution, and say
          what it makes $\mathbb{E}[V]$.
        answer: >
          $V = k$ means $k - 1$ returns followed by an escape:
          $\Pr(V = k) = R^{k-1}(1 - R)$. That is geometric with success
          probability $1 - R$, the chance of escaping, so $\mathbb{E}[V] =
          1/(1 - R)$. Every visit is another coin flip for escape, and the walk
          keeps flipping until it escapes.
      - teach: >
          So $V$ is geometric and $\mathbb{E}[V] = 1/(1 - R)$. Writing $V$ as a
          sum of indicators $\mathbf{1}\{S_n = 0\}$ gives the same mean a second
          way: $\mathbb{E}[V] = \sum_{n \ge 0}\Pr(S_n = 0)$, the Green's
          function. One side is about whether the walk returns, the other about
          when it is home — and they must agree.
      - part: Visits, returns, and the start
        ask: >
          For the walk with $R = 0.6$, what is $\mathbb{E}[V]$?
        expects: "2.5"
        tolerance: 0.0005
        feedback: >
          $1/(1 - 0.6) = 2.5$.
      - ask: >
          And the expected number of *returns*, not counting time $0$?
        expects: "1.5"
        tolerance: 0.0005
        feedback: >
          $2.5 - 1 = 1.5$. Equivalently $R/(1 - R) = 0.6/0.4$. Forgetting
          whether the start is counted is the commonest off-by-one here.
      - ask: >
          What is the probability it is at the start at least $3$ times,
          counting time $0$?
        expects: "0.36"
        tolerance: 0.0005
        feedback: >
          At least two returns: $R^{2} = 0.36$. Geometric tails are powers,
          $\Pr(V \ge k) = R^{k-1}$.
      - part: All or nothing
        ask: >
          Now the fair walk on the line, where $R = 1$. What is $\Pr(V = k)$
          for each finite $k$?
        choices:
          - text: >
              $0$ for every $k$: it returns infinitely often with probability
              $1$
            correct: true
            feedback: >
              Right. $R^{k-1}(1 - R) = 0$ for every $k$, so $V = \infty$ almost
              surely — matching $\sum_n \Pr(S_n = 0) = \infty$, the divergent
              series of Pólya's recurrence theorem.
          - text: >
              Small but positive, decaying slowly in $k$
            feedback: >
              With $R = 1$ the escape probability $1 - R$ is $0$, and every
              finite $k$ needs an escape. There is no slow decay — just $0$.
          - text: >
              Undefined, since the mean is infinite
            feedback: >
              The law is perfectly defined: all the mass sits at $V = \infty$.
              An infinite mean is what that looks like.
        feedback: >
          Recurrent means infinitely many visits almost surely, not just one
          return.
      - ask: >
          Does the fair walk on the line also visit $+1000$ infinitely often?
        choices:
          - text: >
              No: it visits $0$ infinitely often, but far sites only finitely
              often
            feedback: >
              The walk reaches $+1000$ with probability $1$, and from there the
              same argument applies: it returns to $+1000$ infinitely often.
          - text: >
              With probability $1/2$, since it may drift off to $-\infty$
            feedback: >
              A fair walk does not drift off: it is recurrent, so it keeps
              coming back to every level it has left.
          - text: >
              Yes, with probability $1$, and every other integer too
            correct: true
            feedback: >
              Right. Reaching $+1000$ is certain, and from there the walk is a
              translated copy of itself, recurrent at its new start.
        feedback: >
          In one dimension the fair walk visits every integer infinitely often.
      - ask: >
          In three dimensions the expected number of visits is finite. Could
          some three-dimensional walk still visit its start infinitely often
          with probability $1/2$?
        choices:
          - text: >
              No: $\Pr(V = \infty) = \lim_k R^{k}$, which is $0$ when $R < 1$
              and $1$ when $R = 1$
            correct: true
            feedback: >
              Right. There is no middle ground: finitely many visits almost
              surely, or infinitely many almost surely.
          - text: >
              Yes: a finite mean is compatible with a positive chance of
              infinitely many visits
            feedback: >
              A positive chance of $V = \infty$ would make $\mathbb{E}[V]$
              infinite. And here the chance is $\lim R^{k} = 0$.
          - text: >
              Yes, if it gets lucky early
            feedback: >
              Early luck only adds a few returns. Each later return still needs
              another success of probability $R < 1$, and infinitely many
              successes have probability $0$.
        feedback: >
          Recurrence is all or nothing. In an interview, derive the geometric
          law from restarts, then quote $1/(1 - R)$ — infinite on the line and
          the plane, about $1.5$ in three dimensions.

  - node: quant-processes.random-walks.arcsine-law
    hook: >
      "Your friend was ahead the whole game — they must be skilled" is exactly backwards: the arcsine law says lopsided fair games are the *typical* outcome, not evidence of anything.
    explanation: >
      Staying nonnegative through $2n$ steps was already shown to be a large, $\sqrt{n}$-probability event, not a rare one — the arcsine law upgrades that single fact into a full distributional statement about the *fraction* of time spent on the positive side, and that fraction turns out to be U-shaped, concentrated near the extremes $0$ and $1$ rather than near $1/2$.
      The mechanism is visible in the law of the last tie: its density is proportional to $u_{2k}u_{2n-2k}$, and since each $u$ term decays like $1/\sqrt{k}$, this product is smallest in the middle (where both factors are moderate) and largest at the extremes (where one factor is close to $u_0=1$). A last tie very early or very late is far more likely than one near the midpoint — which is exactly why one side dominates almost the entire game so often.
    worked: >
      $\Pr(\text{fraction of time ahead}\le0.10)=\frac{2}{\pi}\arcsin\sqrt{0.10}\approx\frac{2}{\pi}(0.3217)\approx0.205$. By symmetry the same probability applies to being ahead at least $90\%$ of the time, so roughly $41\%$ of fair games see one side dominate at least nine-tenths of the game.
    interview: >
      "Over a long run of a fair coin-flip game, what fraction of the time is one side ahead?" — the naive "close to half" answer is wrong; the correct answer cites the U-shaped arcsine density and states outright that lopsided dominance, not balance, is the common case.
    pitfalls: >
      Reaching for a law-of-large-numbers instinct here — it doesn't apply, because "which side is ahead at time $t$" is wildly dependent across $t$, unlike an iid sequence. Reading a one-sided track record in a genuinely fair process as evidence of skill, when a fair process already produces such runs at high frequency.
    recap: >
      The share of time spent ahead is U-shaped, not bell-shaped: about $41\%$ of fair games have one side ahead at least $90\%$ of the time.
    dialogue:
      - part: Predict the share of time ahead
        teach: >
          Ann and Ben bet one unit on each of a long run of fair coin flips —
          say $10{,}000$ of them. Afterwards you look at the fraction $F$ of the
          game during which Ann was ahead.
      - ask: >
          Before any computation: where is $F$ most likely to land?
        choices:
          - text: >
              Near $1/2$: the coin is fair, so each player leads about half the
              time
            feedback: >
              That is the intuition this node exists to break. A fair coin
              makes $F$ symmetric about $1/2$, but not concentrated there — its
              values near $1/2$ are the *least* likely ones.
          - text: >
              Near $0$ or near $1$: one player leads almost the whole game
            correct: true
            feedback: >
              Right, and strikingly so. The rest of this dialogue shows why the
              extremes win.
          - text: >
              Anywhere between $0$ and $1$ with equal chance
            feedback: >
              Closer than "near $1/2$", but the truth is more lopsided still:
              the law piles up at both ends.
        feedback: >
          The test of a prediction is a computation. Start small.
      - ask: >
          Shrink the game to $6$ flips and look at the *last* time the players
          are level, which can be time $0$, $2$, $4$ or $6$. What is the chance
          the last tie is at time $0$ — they are never level again?
        expects: "5/16"
        tolerance: 0.0005
        hint: >
          From First return to the origin: the chance of no return through
          time $2n$ is $u_{2n}$.
        feedback: >
          $u_6 = \binom{6}{3}/64 = 20/64 = 5/16$. By the same count, the last
          tie is at time $6$ — level at the end — with probability $u_6 = 5/16$
          as well.
      - ask: >
          What is the chance the last tie is at time $2$?
        expects: "3/16"
        tolerance: 0.0005
        hint: >
          Level at time $2$, and then never level again over the remaining $4$
          flips, which start afresh.
        feedback: >
          $u_2 \cdot u_4 = (1/2)(3/8) = 3/16$, and time $4$ is the same by
          symmetry. So the law is $5/16, 3/16, 3/16, 5/16$: heavier at the ends
          than in the middle, already at six flips.
      - reflect: >
          The last tie at time $2k$ has probability $u_{2k}\,u_{2n-2k}$. Using
          $u_{2m} \sim 1/\sqrt{\pi m}$ and $u_0 = 1$, explain why this is
          largest at the ends and smallest in the middle, and what that says
          about who leads.
        answer: >
          At $k = 0$ one factor is $u_0 = 1$ and the other is about
          $1/\sqrt{\pi n}$. At $k = n/2$ both factors are about
          $1/\sqrt{\pi n/2}$, and their product, about $2/(\pi n)$, is far
          smaller. So the last tie is likely early or late, rarely in the
          middle — and after the last tie nobody changes the lead. An early
          last tie means one player leads for almost the whole game.
      - teach: >
          This is the *arcsine law*. Over $2n$ fair flips, as $n$ grows, the
          fraction of time $F$ on the positive side satisfies $\Pr(F \le x) \to
          (2/\pi)\arcsin\sqrt{x}$, whose density is U-shaped, and the time of
          the last tie, as a fraction of the game, has the same law. Lopsided
          leads are the typical outcome of a fair game.
      - part: Reading the arcsine
        ask: >
          What is the probability that Ann leads at most a quarter of the time,
          $\Pr(F \le 1/4)$?
        expects: "1/3"
        tolerance: 0.001
        feedback: >
          $(2/\pi)\arcsin\sqrt{1/4} = (2/\pi)\arcsin(1/2) = (2/\pi)(\pi/6) =
          1/3$. A quarter of the range holds a third of the probability.
      - ask: >
          What is the probability that $F$ lands in the middle half,
          $1/4 \le F \le 3/4$?
        expects: "1/3"
        tolerance: 0.001
        hint: >
          By symmetry $\Pr(F \ge 3/4) = \Pr(F \le 1/4)$.
        feedback: >
          $1 - 1/3 - 1/3 = 1/3$. The middle half of the possible fractions
          gets one third of the probability, and the two outer quarters get two
          thirds between them.
      - part: Track records
        ask: >
          Model a fund manager with no skill as a fair walk against her
          benchmark. Over a long record, what is the probability she is ahead
          of the benchmark at least $80\%$ of the time?
        expects: "0.295"
        tolerance: 0.002
        feedback: >
          $1 - (2/\pi)\arcsin\sqrt{0.8} \approx 1 - (2/\pi)(1.1071) \approx
          0.295$. Nearly three managers in ten with no skill at all are ahead
          four-fifths of the time.
      - ask: >
          Her pitch: "I have been ahead of the benchmark $80\%$ of the time."
          How much does that say about skill?
        choices:
          - text: >
              A lot: a fair process would split the time near $50$–$50$
            feedback: >
              The fair process puts about $29.5\%$ of its mass at $F \ge 0.8$,
              and as much again at $F \le 0.2$. A one-sided record is the
              common case.
          - text: >
              Nothing, because $F$ is uniform under no skill
            feedback: >
              $F$ is not uniform — under uniformity this record would occur
              $20\%$ of the time, not $29.5\%$. The arcsine law makes the case
              against the pitch even stronger.
          - text: >
              Little: about $30\%$ of skill-free records look at least this good
            correct: true
            feedback: >
              Right. Time spent ahead is a poor statistic for skill; a fair game
              produces long one-sided runs routinely.
        feedback: >
          Long leads are what fairness looks like.
      - ask: >
          The fraction of heads does settle near $1/2$. Why does the fraction
          of time ahead not do the same?
        choices:
          - text: >
              "Ahead at time $t$" is almost the same event at nearby times, so
              the indicators are far from independent and do not average out
            correct: true
            feedback: >
              Right. A law of large numbers needs something like independence
              across terms. Who leads at time $t$ and at time $t + 1$ almost
              always agree, so the average inherits the stickiness of the lead.
          - text: >
              It does, only much more slowly
            feedback: >
              The limit law is the arcsine law at every scale, not a slowly
              narrowing bell. More flips never concentrate $F$ near $1/2$.
          - text: >
              Because the walk is biased toward whoever leads
            feedback: >
              The coin is fair at every flip. The stickiness comes from
              dependence across time, not from any bias.
        feedback: >
          In an interview: "U-shaped, not bell-shaped — the sign of the walk is
          sticky, so one side usually leads most of the time; in two fair
          games out of three, one player leads for at least three-quarters of
          the game."

  - node: quant-processes.random-walks.fair-but-slow
    hook: >
      "You're certain to end up ahead eventually" is technically true and practically useless as a plan — this node is where interviewers test whether you can hold "certain," "fair," and "unbounded" as true at once without contradiction.
    explanation: >
      Three facts sit together without conflict. At every fixed $n$, $\mathbb{E}[S_n]=0$ — the game is fair moment to moment. First return's telescoping argument extends to any target level: the walk reaches $+a$ with probability $1$ for the same reason it returns to $0$ with probability $1$. Yet $T_a$ is a sum of $a$ independent copies of $T_1$, and $T_1$ already has infinite mean, so $\mathbb{E}[T_a]=\infty$ for every $a$ — adding more infinite-mean pieces cannot produce a finite sum.
      The "sure win" is bought with unbounded time and unbounded drawdown along the way, and taking away either assumption destroys it: capping the bankroll turns the problem into gambler's ruin, where the guarantee can genuinely fail, and capping the patience means quitting before the certain event arrives. Risk limits are therefore written in capital and time directly, never in "wait until the probability of loss is low" — that probability can already be exactly the value you want and still describe an unworkable plan.
    worked: >
      By the return-to-origin tail, $\Pr(T_1>N)\sim1/\sqrt{\pi N/2}$; at $N=10^6$ this is about $1/\sqrt{\pi\cdot500{,}000}\approx0.0008$ — small on any given day, yet that same $n^{-1/2}$ tail is exactly what makes the average wait across all outcomes infinite.
    interview: >
      "A fair coin game has no stopping rule except 'quit once ahead' — is this a sure thing?" wants "yes, probability $1$," immediately followed by "but expected duration and expected required bankroll are both infinite," and the observation that a finite real bankroll turns this into gambler's ruin, where the guarantee is no longer automatic.
    pitfalls: >
      Treating "probability $1$ of eventual profit" as license to size a real, finite bankroll against the strategy — that is exactly the setup gambler's ruin analyzes, and the guarantee can fail there. Confusing "fair" ($\mathbb{E}[S_n]=0$ at each fixed time) with "protected from large excursions" — both extreme luck and its opposite are fully compatible with fairness.
    recap: >
      Probability-$1$ profit with infinite expected waiting time and unbounded drawdown along the way — the reason "certain to win eventually" is not by itself a strategy.
    dialogue:
      - part: Quit when ahead
        teach: >
          A gambler bets one unit on each flip of a fair coin and has one rule:
          walk away the first moment he is $1$ unit ahead. He has no deadline
          and, for now, unlimited credit.
      - ask: >
          Is he sure to walk away a winner?
        choices:
          - text: >
              No: a fair game cannot guarantee a profit
            feedback: >
              At any *fixed* time it cannot, on average. But his stopping time is
              not fixed. If his first flip loses he is at $-1$, the walk returns
              to his start with probability $1$, and from there he has a fresh
              half-chance on the next flip; repeated fresh chances succeed
              eventually.
          - text: >
              Only half the time: if the first flip loses, he is behind
            feedback: >
              Being behind is temporary. By First return to the origin he is back
              at $0$ with probability $1$, and then the game restarts.
          - text: >
              Yes, with probability $1$
            correct: true
            feedback: >
              Right. Every time he is level he gets a new fair flip; the chance
              of failing forever is $\lim (1/2)^{k} = 0$.
        feedback: >
          A certain profit of $1$ unit from a fair coin. The rest of this
          dialogue finds the bill.
      - part: The bill at a fixed time
        ask: >
          After $2$ flips he has quit with probability $1/2$ (a first-flip win).
          What is the average position of the gamblers still playing?
        expects: "-1"
        feedback: >
          Still playing means DU (at $0$) or DD (at $-2$), equally likely: the
          average is $-1$. And $(1/2)(+1) + (1/2)(-1) = 0$.
      - ask: >
          Whatever the rule, each flip he bets on is a fair flip, and the rule
          decides whether to bet using only the past. What are his expected
          winnings after exactly $6$ flips, counting $+1$ if he has already
          quit?
        expects: "0"
        feedback: >
          His winnings are a sum of six terms, each "bet or not, decided
          beforehand" times a fair $\pm 1$, so each has mean $0$. At any fixed
          time the game is still fair: $\mathbb{E}[\text{winnings}] = 0$.
      - ask: >
          By flip $6$ he has quit with probability $11/16$. What is the average
          position of those still playing?
        expects: "-11/5"
        tolerance: 0.0005
        hint: >
          The quitters hold $+1$; the overall mean is $0$.
        feedback: >
          $(11/16)(1) + (5/16)m = 0$ gives $m = -11/5 = -2.2$. Fewer gamblers
          are still playing than at flip $2$, and they are deeper in the hole.
      - reflect: >
          The profit is certain, and the game is fair at every fixed time. Say
          where the losses are hiding, and what happens to them as time goes
          on.
        answer: >
          They sit with the gamblers who have not yet quit. As time passes that
          group shrinks, but its average loss deepens just enough to keep the
          overall mean at $0$. The certain $+1$ is collected only by waiting
          out drawdowns that are unbounded, for a time that is unbounded too:
          the cost is paid in capital and patience, not in probability.
      - teach: >
          Three facts, held together: $\mathbb{E}[S_n] = 0$ at every fixed time;
          the gambler reaches $+1$ with probability $1$; and the expected time
          to get there, and the worst drawdown on the way, are both infinite.
          The "sure win" is bought with unbounded time and unbounded capital.
      - part: Take away the time or the capital
        ask: >
          What is his expected waiting time?
        choices:
          - text: >
              Infinite: after a first loss he needs a return to level, and that
              wait alone has infinite mean
            correct: true
            feedback: >
              Right. The return to $0$ from $-1$ has the infinite-mean law of
              First return to the origin, so his whole wait does too.
          - text: >
              Finite, since he is certain to quit
            feedback: >
              Certain is not the same as quick. Half the time his first flip
              loses, and then he must first get back to $0$ — a first return,
              whose expected time is already infinite.
          - text: >
              $2$ flips: he wins on the first flip half the time
            feedback: >
              The median is short; the mean is not. The rare long losing
              stretches are long enough to make the average infinite.
        feedback: >
          Take away the patience — a deadline — and the fixed-time fairness
          returns: expected winnings $0$.
      - ask: >
          Now take away the credit instead: he has $3$ units and is ruined if he
          falls to $-3$. What is the probability he walks away a winner?
        expects: "3/4"
        tolerance: 0.0005
        hint: >
          He stops at $+1$ or at $-3$, and the game is still fair: his expected
          final position is $0$.
        feedback: >
          $p(+1) + (1 - p)(-3) = 0$ gives $p = 3/4$. The "certain" win is now a
          three-in-four chance of $+1$ against a one-in-four chance of losing
          everything — expected value $0$. This is gambler's ruin.
      - ask: >
          A desk proposes a risk rule: "hold a losing position until the
          probability of recovering is above $99\%$." What is wrong with it?
        choices:
          - text: >
              Nothing: a high recovery probability makes the position safe
            feedback: >
              In a fair walk the recovery probability is $1$ from any loss, so
              the rule never triggers — and it says nothing about how deep the
              loss goes or how long it lasts.
          - text: >
              It is written in probability, which can be $1$ while the time and
              drawdown are unbounded; limits must be in capital and time
            correct: true
            feedback: >
              Right. The probability can already be exactly what you want and
              still describe an unworkable plan. A stop-loss and a holding-period
              limit are what bind.
          - text: >
              $99\%$ is too low; it should be $99.9\%$
            feedback: >
              Raising the threshold does not help when the probability is
              already $1$. The missing quantities are the size and duration of
              the drawdown.
        feedback: >
          In an interview: "yes, probability $1$ — but infinite expected time
          and unbounded drawdown, and with a finite bankroll it becomes gambler's
          ruin with expected profit $0$."
