unit: quant-processes.random-walks
opening: >
  A random walk is nothing more than a running sum of coin flips, but nearly every process question in a quant interview — option payoffs, P&L paths, ruin, Markov chains — eventually reduces to a fact proved here. The unit opens by pinning down the walk's law and its first two moments, then builds the path-counting and reflection machinery that turns any "does it ever..." question into pure combinatorics, driving the ballot problem, first-passage times and the running maximum. A second arc studies long-run behavior — the $1/\sqrt{\pi n}$ return-to-origin asymptotic, recurrence versus transience by dimension, and the expected number of visits — before closing with two intuition results, the arcsine law and the coexistence of certain eventual profit with infinite expected waiting time, that correct the most common wrong instincts about fair games.
lessons:
  - node: quant-processes.random-walks.ssrw
    hook: >
      Every process question in this unit — drift, ruin, first passage, recurrence — is a question about this one object, so the translation "coin flips become a binomial count" has to be automatic before anything else here makes sense.
    explanation: >
      Writing $U$ for the number of up-steps among $n$ flips, $U$ is exactly the binomial variable you already know, since each flip independently contributes a head with probability $1/2$. The load-bearing step is purely algebraic: with $D=n-U$ down-steps, the position is $S_n=U-D=U-(n-U)=2U-n$, a linear rescaling of a binomial. This is why every "where is the walk" question collapses to a binomial computation you already have machinery for — you never need new probability theory, only the change of variables.
      That rescaling also explains the parity restriction: as $U$ moves by $1$, $S_n=2U-n$ moves by $2$, so $S_n$ can only land on integers with the same parity as $n$. Forgetting this is the single most common way to write a nonzero probability for an impossible outcome.
      The stationary, independent-increments property is the other half worth internalizing: $S_{n+m}-S_n$ has exactly the same law as $S_m$, independent of everything up to time $n$. That's the formal statement of "the walk forgets its history," and it's what licenses every first-step and restart argument used later in this unit.
    worked: >
      For $n=8$, $k=2$: matching $2U-8=2$ gives $U=5$, so $\Pr(S_8=2)=\binom{8}{5}2^{-8}=56/256=7/32\approx0.219$.
    interview: >
      "A trader's P&L moves $\pm1$ on each of $n$ independent trades — what's the distribution of the net position?" wants $S_n=2U-n$ stated immediately, with $U$ named as binomial$(n,1/2)$, not a from-scratch derivation.
    pitfalls: >
      Quoting $\Pr(S_n=k)$ for a $k$ of the wrong parity as some small positive number instead of exactly $0$. Writing $\binom{n}{k}$ instead of $\binom{n}{(n+k)/2}$ — confusing the target position $k$ with the number of heads needed to reach it.
    recap: >
      $S_n=2U-n$ with $U$ binomial$(n,1/2)$: every random-walk probability is a binomial probability in disguise, restricted to one parity class.
    steps:
      - teach: >
          Every fact in this unit — drift, first passage, recurrence — is
          really a statement about $S_n$, so the translation has to be
          automatic: with $U$ up-steps among $n$ flips, $S_n=2U-n$ turns a walk
          question into a binomial one you already know how to compute.
      - teach: >
          $U$ is binomial$(n,1/2)$, since each flip independently contributes
          an up-step with probability $1/2$. Substituting $U=(n+k)/2$ into the
          binomial mass function gives $\Pr(S_n=k)=\binom{n}{(n+k)/2}2^{-n}$,
          defined only when $k$ and $n$ share parity.
      - ask: >
          A fair walk takes $n=6$ steps. What is $\Pr(S_6=2)$?
        expects: "15/64"
        tolerance: 0.0005
        hint: >
          Solve $2U-6=2$ for the number of up-steps $U$ needed, then plug into
          $\binom{6}{U}2^{-6}$.
        feedback: >
          $U=4$ up-steps reach $S_6=2$, so $\Pr(S_6=2)=\binom{6}{4}2^{-6}=15/64
          \approx0.234$.
      - teach: >
          That parity restriction is not a footnote — as $U$ moves by $1$,
          $S_n$ moves by $2$, so the walk can only ever sit on integers
          matching $n$'s parity. A nonzero probability at the wrong parity is
          always a computation error, not a rare event.
      - ask: >
          What is $\Pr(S_5=2)$?
        expects: "0"
        hint: >
          Check whether $5$ and $2$ have the same parity before reaching for
          the binomial coefficient.
        feedback: >
          $5$ is odd and $2$ is even, so no sequence of $5$ steps of size
          $\pm1$ can land there: $\Pr(S_5=2)=0$, no binomial coefficient
          needed.
      - teach: >
          The other half of the definition is stationarity: $S_{n+m}-S_n$ has
          exactly the law of $S_m$, independent of everything up to time $n$.
          That is the formal version of "the walk forgets its history," and
          every restart argument later in this unit leans on it.
      - ask: >
          After $n=9$ steps a walk has taken $U=6$ up-steps. What is $S_9$?
        expects: "3"
        hint: >
          Use $S_n=2U-n$ directly — no binomial coefficient is needed here.
        feedback: >
          $S_9=2(6)-9=3$: once you know the up-step count, the position is pure
          algebra.
      - teach: >
          The recurring slip is writing $\binom{n}{k}$ instead of
          $\binom{n}{(n+k)/2}$ — confusing the target position $k$ with the
          number of up-steps needed to reach it. Always solve for $U$ first.
      - teach: >
          Keep the translation as the default first move on any process
          question: write $S_n$ as $2U-n$, name $U$'s binomial parameters, and
          reach for the binomial toolbox you already have — no new probability
          theory is ever required here.

  - node: quant-processes.random-walks.moments
    hook: >
      "What's the standard deviation of your position after $n$ trades" is asked constantly, and the $\sqrt{n}$ answer — plus the slow-decaying correlation across time — is the fact the rest of the unit's scaling arguments run on.
    explanation: >
      Each step has $X_i^2=1$ identically, so $\operatorname{Var}(X_i)=\mathbb{E}[X_i^2]=1$ with no computation needed. Linearity gives $\mathbb{E}[S_n]=0$, and because the steps are independent, variances add: $\operatorname{Var}(S_n)=\sum\operatorname{Var}(X_i)=n$, so the position's standard deviation is $\sqrt{n}$.
      The covariance is the part people don't expect: writing $S_n=S_m+(S_n-S_m)$ for $m\le n$, the increment $S_n-S_m$ is independent of $S_m$ with mean $0$, so $\operatorname{Cov}(S_m,S_n)=\operatorname{Cov}(S_m,S_m)=\operatorname{Var}(S_m)=m$. That gives $\operatorname{Cov}(S_m,S_n)=\min(m,n)$ and correlation $\sqrt{m/n}$ — a walk far in its past still correlates with its present, because the past steps are literally still counted in the present sum.
      The mental model: nothing pulls two snapshots of the walk apart quickly, because they share every step up to the earlier time. This slow, square-root decay of correlation is what makes "the walk remembers" a precise statement, not a metaphor, and it is what the next node's confusion about self-correction actually rests on.
    worked: >
      Correlation between $S_{16}$ and $S_{100}$: $\sqrt{16/100}=2/5=0.4$. Also, $\operatorname{Var}(S_{100}-S_{16})=100-16=84$, so the standard deviation of the change between day $16$ and day $100$ is $\sqrt{84}\approx9.17$.
    interview: >
      "If daily moves are iid $\pm1$, what's the correlation between the price after $16$ days and after $100$ days?" is answered directly from $\operatorname{Cov}(S_m,S_n)=\min(m,n)$, giving $\sqrt{16/100}=0.4$, without ever writing out a joint density.
    pitfalls: >
      Assuming $S_m$ and $S_n$ are independent because the walk is "memoryless step to step" — they share the first $m$ increments and are strongly dependent. Computing $\operatorname{Var}(X_i)$ from a variance formula instead of noticing $X_i^2\equiv1$ makes $\mathbb{E}[X_i^2]=1$ immediate.
    recap: >
      $\mathbb{E}[S_n]=0$, $\operatorname{Var}(S_n)=n$, and $\operatorname{Cov}(S_m,S_n)=\min(m,n)$ — the walk's entire second-order structure in one line, decaying only like $\sqrt{m/n}$.
    steps:
      - teach: >
          "How uncertain is your position after $n$ trades" is answered by one
          number, and it grows only like $\sqrt{n}$ — the fact every later
          scaling argument in this unit is built on.
      - teach: >
          Each step has $X_i^2=1$ identically, so $\operatorname{Var}(X_i)=1$
          with no computation needed. Independence then lets variances add:
          $\operatorname{Var}(S_n)=\sum\operatorname{Var}(X_i)=n$, so the
          standard deviation of the position is $\sqrt{n}$.
      - ask: >
          What is $\operatorname{Var}(S_{49})$?
        expects: "49"
        hint: >
          Each of the $49$ independent steps contributes variance $1$.
        feedback: >
          Independence means the variances simply add:
          $\operatorname{Var}(S_{49})=49\cdot1=49$.
      - teach: >
          Writing $S_n=S_m+(S_n-S_m)$ for $m\le n$, the increment $S_n-S_m$ is
          independent of $S_m$ with mean $0$, so
          $\operatorname{Cov}(S_m,S_n)=\operatorname{Var}(S_m)=m$. That gives
          $\operatorname{Cov}(S_m,S_n)=\min(m,n)$ and correlation $\sqrt{m/n}$:
          the two snapshots share every step up to the earlier time, so nothing
          pulls them apart quickly.
      - ask: >
          What is the correlation between $S_9$ and $S_{25}$?
        expects: "3/5"
        tolerance: 0.0005
        hint: >
          The correlation is $\sqrt{m/n}$ with $m$ the earlier time.
        feedback: >
          $\sqrt{9/25}=3/5=0.6$: the walk at time $9$ still correlates strongly
          with the walk at time $25$, because it shares those first $9$ steps.
      - teach: >
          This slow, square-root decay is what makes "the walk remembers" a
          precise statement rather than a metaphor — and it is exactly the
          mechanism the next node's "the lead should even out" confusion runs
          into.
      - ask: >
          What is $\operatorname{Var}(S_{25}-S_9)$?
        expects: "16"
        hint: >
          The increment from time $9$ to time $25$ is independent of $S_9$,
          with its own variance equal to the number of steps in between.
        feedback: >
          $\operatorname{Var}(S_{25}-S_9)=25-9=16$, so the standard deviation
          of that change is $4$.
      - teach: >
          Do not assume $S_m$ and $S_n$ are independent because the walk is
          "memoryless step to step" — that memorylessness is about single
          increments, not about full positions, which share every increment up
          to the earlier time.
      - teach: >
          $\mathbb{E}[S_n]=0$, $\operatorname{Var}(S_n)=n$, and
          $\operatorname{Cov}(S_m,S_n)=\min(m,n)$: the walk's entire
          second-order structure in one line, decaying only like $\sqrt{m/n}$.

  - node: quant-processes.random-walks.sqrt-n-scaling
    hook: >
      The classic gotcha: "it's a fair coin, so the lead should even out over time" sounds like the law of large numbers but is actually false for the quantity people mean — this node is where that confusion gets resolved for good.
    explanation: >
      From the previous node, $\operatorname{sd}(S_n)=\sqrt{n}$, so to double the typical distance from the origin you need four times as many steps — displacement scales like $\sqrt{n}$, not like $n$. Two different limits live side by side and get conflated constantly: the *fraction* of heads, $S_n/n$, shrinks to $0$ because the denominator grows linearly while the numerator's typical size grows only as $\sqrt{n}$; the *raw* lead $|S_n|$ itself grows without bound, because nothing in the moments computation supplies a restoring force — every new step adds an independent zero-mean contribution to the variance, never subtracts one.
      The mental model: think of the walk as diluted, not corrected. A large early lead does not get erased; it just becomes a smaller fraction of an ever-larger total, while its absolute size keeps drifting via ordinary $\sqrt{n}$ noise. "The odds even out" is true only in the ratio sense.
    worked: >
      After $n=40{,}000$ flips, $\operatorname{sd}(S_n)=200$. A surplus of $S_n=200$ heads-over-tails is exactly one standard deviation — unremarkable — and corresponds to $20{,}100$ heads out of $40{,}000$, a fraction of $0.5025$: visibly close to $1/2$ even though the raw lead of $200$ is not shrinking at all.
    interview: >
      "After a long run of fair coin flips, is a lead of $X$ surprising?" wants the lead compared to $\sqrt{n}$, not to $n$ or to zero — and a clean statement that the head *fraction* converges while the head *count minus tail count* does not.
    pitfalls: >
      Treating a growing raw lead as evidence the coin is biased, without first normalizing by $\sqrt{n}$. Citing the law of large numbers to claim the walk "comes back toward zero" — LLN governs $S_n/n$, and says nothing about $S_n$ itself, which is unbounded.
    recap: >
      Displacement scales as $\sqrt{n}$: the head fraction converges to $1/2$ while the absolute lead diverges, because variance only ever accumulates.
    steps:
      - teach: >
          "It's a fair coin, so the lead should even out over time" sounds like
          the law of large numbers but is false for the quantity people mean —
          this node is where that confusion gets resolved for good.
      - teach: >
          Since $\operatorname{sd}(S_n)=\sqrt{n}$, distance from the origin
          scales like $\sqrt{n}$, not like $n$: to double the typical distance
          you need four times as many steps, not twice as many.
      - ask: >
          After $n=10{,}000$ flips, what is $\operatorname{sd}(S_n)$?
        expects: "100"
        hint: >
          $\operatorname{sd}(S_n)=\sqrt{n}$.
        feedback: >
          $\operatorname{sd}(S_{10{,}000})=\sqrt{10{,}000}=100$.
      - teach: >
          Two limits get conflated constantly. The *fraction* of heads,
          $S_n/n$, shrinks to $0$ because the denominator grows linearly while
          the numerator's typical size grows only as $\sqrt{n}$. The *raw* lead
          $|S_n|$ itself grows without bound, because nothing supplies a
          restoring force — every new step adds an independent zero-mean
          contribution to the variance, never subtracts one.
      - ask: >
          A walk shows $S_n=300$ after $n=10{,}000$ flips. How many standard
          deviations from zero is that?
        expects: "3"
        hint: >
          Divide the lead by the standard deviation you just computed.
        feedback: >
          $300/100=3$: a three-sigma lead, unusual but far from impossible in a
          fair game.
      - teach: >
          Rescaled, $S_n/\sqrt{n}$ is asymptotically standard normal, so the
          walk is diluted rather than corrected: a large early lead does not
          get erased, it just becomes a smaller fraction of an ever-larger
          total while its absolute size keeps drifting by ordinary $\sqrt{n}$
          noise.
      - ask: >
          With that same $S_n=300$ after $n=10{,}000$ flips, what fraction of
          the flips were heads?
        expects: "0.515"
        tolerance: 0.0005
        hint: >
          The number of heads is $(n+S_n)/2$; divide by $n$.
        feedback: >
          Heads $=(10{,}000+300)/2=5{,}150$, so the fraction is
          $5{,}150/10{,}000=0.515$ — visibly close to $1/2$ even though the raw
          lead of $300$ never shrinks.
      - teach: >
          The law of large numbers only governs $S_n/n$; it says nothing about
          $S_n$ itself, which is unbounded. Citing it to claim the walk "comes
          back toward zero" is the trap — the ratio settles, the difference
          never does.
      - teach: >
          Displacement scales as $\sqrt{n}$: the head fraction converges to
          $1/2$ while the absolute lead diverges, because variance only ever
          accumulates.

  - node: quant-processes.random-walks.biased-walk
    hook: >
      "You have a small statistical edge — how many trades until it's visible?" is answered by comparing a linear drift to a $\sqrt{n}$ noise floor, and the crossover point is a formula worth having cold.
    explanation: >
      With $\Pr(X_i=+1)=p$, linearity still gives $\mathbb{E}[S_n]=n(p-q)$ directly, exactly as in the fair case but with a nonzero per-step mean. The variance changes too: $\operatorname{Var}(X_i)=1-(p-q)^2=4pq$ (since $(p+q)^2=1$ forces $(p-q)^2=1-4pq$), so independence again gives $\operatorname{Var}(S_n)=4pqn$.
      The load-bearing comparison is drift against noise: the drift $n(p-q)$ grows linearly in $n$, while the standard deviation $\sqrt{4pqn}$ grows only like $\sqrt{n}$, so their ratio is $\sqrt{n}\,(p-q)/\sqrt{4pq}$ — unbounded, but growing slowly. Setting that ratio to $1$ gives the crossover scale $n_0=4pq/(p-q)^2$: below $n_0$ the edge is buried in noise, above it the edge dominates by a growing multiple.
      This is the "small edge, many trades" model: an edge that is invisible in a handful of trials becomes overwhelming given enough of them, purely because signal accumulates linearly while noise only accumulates as a square root.
    worked: >
      At $p=0.55$, $q=0.45$: $n_0=4(0.2475)/(0.1)^2=99$ trades to reach a one-sigma edge. After $n=2500$ trades ($\approx25.3\times n_0$), the ratio scales by $\sqrt{25.3}\approx5.03$: drift $=2500(0.1)=250$, standard deviation $=\sqrt{4(0.2475)(2500)}=\sqrt{2475}\approx49.75$, so the edge sits at $250/49.75\approx5.0$ standard deviations — decisively visible.
    interview: >
      "With a $55\%$ edge per trade, how many trades until you're statistically confident?" wants $n_0=4pq/(p-q)^2$ produced directly, plus the remark that going from one sigma to five sigmas of confidence costs a $25\times$ increase in sample size, not a $5\times$ one.
    pitfalls: >
      Using $\operatorname{Var}(X_i)=1$, the fair-coin value, when the walk is biased — it's $4pq<1$ whenever $p\ne1/2$. Reading "drift wins eventually" as "the walk is ahead at every $n$" — it's an asymptotic, almost-sure statement, and noise can dominate at small $n$ even with a real edge.
    recap: >
      Mean $n(2p-1)$ against standard deviation $\sqrt{4pqn}$: the edge needs on the order of $4pq/(p-q)^2$ trades before signal beats noise, and confidence grows only as $\sqrt{n}$ after that.
    steps:
      - teach: >
          "You have a small statistical edge — how many trades until it's
          visible?" is answered by comparing a linear drift to a $\sqrt{n}$
          noise floor, and the crossover point is a formula worth having cold.
      - teach: >
          With $\Pr(X_i=+1)=p$, linearity gives $\mathbb{E}[S_n]=n(p-q)$, and
          since $\operatorname{Var}(X_i)=1-(p-q)^2=4pq$, independence gives
          $\operatorname{Var}(S_n)=4pqn$: drift grows linearly in $n$, noise
          only as $\sqrt{n}$.
      - ask: >
          At $p=0.6$, $q=0.4$, what is $\mathbb{E}[S_{50}]$?
        expects: "10"
        hint: >
          $\mathbb{E}[S_n]=n(p-q)$.
        feedback: >
          $\mathbb{E}[S_{50}]=50(0.6-0.4)=50(0.2)=10$.
      - teach: >
          Setting drift equal to noise, $n(p-q)=\sqrt{4pqn}$, and solving gives
          the crossover scale $n_0=4pq/(p-q)^2$: below $n_0$ the edge is buried
          in noise, above it the edge dominates by a growing multiple.
      - ask: >
          What is $n_0$ for $p=0.6$, $q=0.4$?
        expects: "24"
        hint: >
          Plug $p=0.6$, $q=0.4$ into $4pq/(p-q)^2$.
        feedback: >
          $n_0=4(0.6)(0.4)/(0.6-0.4)^2=0.96/0.04=24$ trades to reach a
          one-sigma edge.
      - teach: >
          Because the ratio of drift to noise grows like $\sqrt{n}$, going from
          a one-sigma edge to a $k$-sigma edge costs a factor of $k^2$ more
          trades, not a factor of $k$.
      - ask: >
          Still at $p=0.6$, $q=0.4$ (so $n_0=24$), by what factor does the
          sigma-edge grow when you go from $n_0$ trades to $n=96$ trades?
        expects: "2"
        hint: >
          The edge in standard deviations scales as $\sqrt{n/n_0}$.
        feedback: >
          $n/n_0=96/24=4$, and $\sqrt{4}=2$: quadrupling the trade count only
          doubles the edge's visibility in sigma terms.
      - teach: >
          Two traps: using $\operatorname{Var}(X_i)=1$, the fair-coin value,
          when the walk is biased — it is $4pq<1$ whenever $p\ne1/2$ — and
          reading "drift wins eventually" as "ahead at every $n$," when it is
          really an asymptotic, almost-sure statement that noise can still
          dominate early on.
      - teach: >
          Mean $n(2p-1)$ against standard deviation $\sqrt{4pqn}$: the edge
          needs on the order of $4pq/(p-q)^2$ trades before signal beats noise,
          and confidence past that grows only as $\sqrt{n}$.

  - node: quant-processes.random-walks.path-counting
    hook: >
      This is the single biggest simplification in the whole unit: any "what's the probability of..." question about the symmetric walk stops being a probability question and becomes a counting question.
    explanation: >
      Every $n$-step path has probability exactly $2^{-n}$, since each of its $n$ independent $\pm1$ steps occurs with probability $1/2$ regardless of the path's shape. That means any event's probability is just (number of paths satisfying it)$/2^n$ — from here on, computing a probability and counting a set of paths are the same task.
      The basic count follows immediately: a path from $(0,a)$ to $(n,b)$ exists exactly when $n$ and $b-a$ share parity, and there are $\binom{n}{(n+b-a)/2}$ of them, because the path is fully determined by choosing which steps go up. For constrained counts — stay positive, avoid a level, touch a level — the strategy is always the same: find a bijection between the constrained paths and some unconstrained set you already know how to count. That bijection idea, not any new probability tool, is the engine behind the rest of this unit.
      The biased walk breaks the "every path is equally likely" fact, but not the counting method: paths sharing an endpoint still share the weight $p^uq^{n-u}$, so a favorable-path count still isolates the constraint — you just multiply by that shared weight instead of by $2^{-n}$.
    worked: >
      $\Pr(S_8=4)$: matching $(n+k)/2=6$ up-steps needed, so there are $\binom{8}{6}=28$ favorable paths out of $2^8=256$, giving $\Pr(S_8=4)=28/256=7/64\approx0.109$.
    interview: >
      "What's the probability the walk is at $+4$ after $8$ steps?" is meant to be answered by naming the up-step count and writing the binomial coefficient immediately — the interviewer is checking that probability and path-counting are one move, not two.
    pitfalls: >
      Skipping the parity check before writing $\binom{n}{(n+k)/2}$, producing a non-integer index for an impossible outcome. Applying a symmetric-walk path count directly as a probability for the biased walk without multiplying by the path's actual weight $p^uq^{n-u}$.
    recap: >
      Every $n$-step path has probability $2^{-n}$, so probabilities are path counts: $\binom{n}{(n+b-a)/2}$ routes from height $a$ to height $b$.
    steps:
      - teach: >
          This is the biggest simplification in the unit: any "what's the
          probability of..." question about the symmetric walk stops being a
          probability question and becomes a counting question.
      - teach: >
          Every $n$-step path has probability exactly $2^{-n}$, so any event's
          probability is just (number of paths satisfying it)$/2^n$. A path
          from $(0,a)$ to $(n,b)$ exists exactly when $n$ and $b-a$ share
          parity, and there are $\binom{n}{(n+b-a)/2}$ of them — choose which
          steps go up.
      - ask: >
          How many $10$-step paths from $0$ end at height $4$?
        expects: "120"
        hint: >
          Solve $(n+b-a)/2$ for the number of up-steps, with $n=10$, $b=4$,
          $a=0$.
        feedback: >
          The path needs $(10+4)/2=7$ up-steps, so there are
          $\binom{10}{7}=120$ of them.
      - teach: >
          For constrained counts — stay positive, avoid a level, touch a level
          — the strategy is always the same: find a bijection between the
          constrained paths and an unconstrained set you already know how to
          count. That bijection idea, not any new probability tool, drives the
          rest of this unit.
      - ask: >
          What is $\Pr(S_{10}=4)$?
        expects: "15/128"
        tolerance: 0.0005
        hint: >
          Divide the path count you just found by $2^{10}$.
        feedback: >
          $120/1024=15/128\approx0.117$: the counting problem you already
          solved is the whole probability.
      - teach: >
          The biased walk breaks "every path is equally likely," but not the
          counting method: paths sharing an endpoint still share the weight
          $p^uq^{n-u}$, so a favorable-path count still isolates the constraint
          — you multiply by that shared weight instead of by $2^{-n}$.
      - ask: >
          How many $7$-step paths from $0$ end at height $4$?
        expects: "0"
        hint: >
          Check whether $7$ and $4$ share parity before reaching for a binomial
          coefficient.
        feedback: >
          $7$ is odd and $4$ is even, so $(n+b-a)/2$ is not an integer — no
          such path exists, and the count is $0$, not a small positive number.
      - teach: >
          Skipping the parity check before writing $\binom{n}{(n+k)/2}$ is the
          standard way this goes wrong: it produces a non-integer index for an
          event that is actually impossible.
      - teach: >
          Every $n$-step path has probability $2^{-n}$, so probabilities are
          path counts: $\binom{n}{(n+b-a)/2}$ routes from height $a$ to height
          $b$.

  - node: quant-processes.random-walks.reflection
    hook: >
      Every "does the walk ever reach a level" question in an interview is this one bijection wearing a different costume — ballot counting, first passage and the running maximum are all reflection aimed at a different target.
    explanation: >
      Fix a level $a\ge1$ and reflect a path's tail — everything after its first visit to $a$ — about the horizontal line at height $a$. This is an involution (reflecting twice returns the original path), so it is automatically a bijection on the set it's applied to.
      The key fact that makes it useful is what the image set turns out to be: any path ending above $a$ must already have crossed $a$ at some earlier step, since the walk moves by $\pm1$ and cannot jump over a level. So the "touches $a$" condition, once you reflect, becomes automatic rather than something you have to track — reflecting a path touching $a$ and ending at $b<a$ produces a path ending at $2a-b>a$, and every path ending at $2a-b$ arises this way. That converts a constrained count (touches $a$, ends at $b$) into an unconstrained one (ends at $2a-b$), which path counting already answers: $\binom{n}{(n+2a-b)/2}$.
      The mental model: don't try to track "did it touch $a$" directly. Fold the picture over at the first crossing and read the answer off the endpoint alone.
    worked: >
      Paths of length $7$ touching level $2$ and ending at $-1$: the reflected endpoint is $2(2)-(-1)=5$, so the count is $\binom{7}{(7+5)/2}=\binom{7}{6}=7$ paths out of $2^7=128$, giving probability $7/128\approx0.055$.
    interview: >
      "What's the probability a random walk ever crosses a barrier by time $n$?" is answered by reflecting to eliminate the "ever crosses" condition entirely, turning it into an endpoint count — the interviewer wants the bijection stated, not a case-by-case enumeration.
    pitfalls: >
      Applying the formula with $a<1$ or with the endpoint on the wrong side ($b\ge a$) — the setup requires $a\ge1$ and $b<a$. Worrying about paths that touch $a$ more than once and trying to inclusion–exclude over the touches — the bijection at the *first* hitting time already handles this with no double-counting.
    recap: >
      Reflect a path after its first visit to a level and restricted-path counts become unrestricted-path counts — the central trick of the subject.
    steps:
      - teach: >
          Every "does the walk ever reach a level" question in an interview is
          this one bijection wearing a different costume — ballot counting,
          first passage and the running maximum are all reflection aimed at a
          different target.
      - teach: >
          Fix a level $a\ge1$ and reflect a path's tail — everything after its
          first visit to $a$ — about the horizontal line at height $a$.
          Reflecting twice returns the original path, so this is automatically
          a bijection on the set it's applied to.
      - teach: >
          Since the walk moves by $\pm1$, it cannot jump over a level: any path
          ending above $a$ has already crossed it. So "touches $a$" becomes
          automatic once you reflect — a path touching $a$ and ending at $b<a$
          maps to a path ending at $2a-b>a$, and every path ending at $2a-b$
          arises this way. That turns a constrained count into an unconstrained
          one: $\binom{n}{(n+2a-b)/2}$.
      - ask: >
          $n=9$ steps, level $a=2$, endpoint $b=-3$. How many paths touch $a$
          and end at $b$?
        expects: "9"
        hint: >
          First find the reflected endpoint $2a-b$, then count unconstrained
          paths ending there.
        feedback: >
          The reflected endpoint is $2(2)-(-3)=7$, so the count is
          $\binom{9}{(9+7)/2}=\binom{9}{8}=9$.
      - ask: >
          With the same $n=9$, $a=2$, $b=-3$, what is the probability a path
          touches level $2$ and ends at $-3$?
        expects: "9/512"
        tolerance: 0.0005
        hint: >
          Divide the count you just found by $2^9$.
        feedback: >
          $9/512\approx0.0176$ — the same count, turned into a probability by
          dividing by the total number of paths.
      - teach: >
          Don't try to track "did it touch $a$" directly. Fold the picture over
          at the first crossing and read the answer off the endpoint alone —
          that is the entire trick, every time.
      - ask: >
          For which of these setups does $\binom{n}{(n+2a-b)/2}$ directly
          apply?
        choices:
          - text: >
              $a=0$, $b=-2$
            feedback: >
              The construction requires $a\ge1$: a "level" at $0$ is the walk's
              own starting height, and the first-hitting-time argument breaks
              down there.
          - text: >
              $a=3$, $b=5$
            feedback: >
              This needs $b<a$, and here $b=5>a=3$ — the endpoint has to sit
              below the level being reflected about.
          - text: >
              $a=3$, $b=1$
            correct: true
            feedback: >
              $a=3\ge1$ and $b=1<3$: both requirements hold, so the reflection
              count applies as written.
        feedback: >
          The formula needs $a\ge1$ and $b<a$ — a positive level, reflected
          about, with the endpoint strictly below it.
      - teach: >
          Reflect a path after its first visit to a level and restricted-path
          counts become unrestricted-path counts — the central trick of the
          subject, reused with different bookkeeping in every result that
          follows.

  - node: quant-processes.random-walks.ballot
    hook: >
      "Was the front-runner ever behind" is a constantly recurring framing — vote counts, P&L that must never dip negative, a game score — and it resolves to one clean fraction via reflection.
    explanation: >
      Recast the vote count as a path: $p$ up-steps for A, $q$ down-steps for B, ending at height $p-q$. "A strictly ahead at every stage" is exactly "the path stays strictly positive after the first step."
      Reflection handles the complementary bad event. A path's first step is down with probability $q/(p+q)$ (by symmetry among the $p+q$ positions of the down-steps), and every such path automatically touches $0$ later since it must climb back up to end at $p-q>0$. Reflecting a bad path that instead starts up — one that touches $0$ before recovering — at its first return to $0$ produces a path that starts down, and this map is a bijection between the two kinds of bad path. So bad paths of both kinds are equinumerous, giving total bad probability $2q/(p+q)$, and the good probability is $1-2q/(p+q)=(p-q)/(p+q)$.
      The reusable pattern: whenever "always ahead" needs to be counted, split the bad event by the sign of the first step and reflect one half onto the other — this is the exact argument reused, with different bookkeeping, in first passage and the running maximum.
    worked: >
      With $p=7$ votes to $q=4$: $\Pr(\text{A always strictly ahead})=(7-4)/(7+4)=3/11\approx0.273$.
    interview: >
      "In a vote count that ends $p$ to $q$, what's the probability the winner was ahead the whole way?" wants $(p-q)/(p+q)$ produced directly from the reflection argument, and a clean distinction from the weaker "never trailing, ties allowed" version, $(p-q+1)/(p+1)$.
    pitfalls: >
      Applying the formula when $p\le q$ — it requires a strict final lead $p>q$. Conflating the strict-ahead answer $(p-q)/(p+q)$ with the weak never-trailing answer $(p-q+1)/(p+1)$; these are different questions with different numbers.
    recap: >
      A leads wire-to-wire with probability $(p-q)/(p+q)$ — one reflection bijection splitting bad paths by their first step.
    steps:
      - teach: >
          "Was the front-runner ever behind" is a constantly recurring framing
          — vote counts, P&L that must never dip negative, a game score — and
          it resolves to one clean fraction via reflection.
      - teach: >
          Recast the vote count as a path: $p$ up-steps for A, $q$ down-steps
          for B, ending at height $p-q$. "A strictly ahead at every stage" is
          exactly "the path stays strictly positive after the first step".
      - teach: >
          A path's first step is down with probability $q/(p+q)$, and every
          such path automatically touches $0$ later since it must climb back up
          to end at $p-q>0$. Reflecting a bad path that instead starts up —
          touching $0$ before recovering — at its first return to $0$ produces
          a path that starts down, a bijection between the two kinds of bad
          path. Bad paths of both kinds are equinumerous, so total bad
          probability is $2q/(p+q)$ and the good probability is
          $1-2q/(p+q)=(p-q)/(p+q)$.
      - ask: >
          A finishes $9$ votes to B's $5$. What's the probability A is strictly
          ahead at every stage of the count?
        expects: "2/7"
        tolerance: 0.0005
        hint: >
          Use $(p-q)/(p+q)$ with $p=9$, $q=5$.
        feedback: >
          $(9-5)/(9+5)=4/14=2/7\approx0.286$.
      - teach: >
          This is the reusable pattern, not a one-off trick: whenever "always
          ahead" needs counting, split the bad event by the sign of the first
          step and reflect one half onto the other — the exact argument reused,
          with different bookkeeping, in first passage and the running maximum.
      - ask: >
          Same count, $p=9$, $q=5$. What's the probability A is never behind
          (ties allowed) throughout the count?
        expects: "1/2"
        tolerance: 0.0005
        hint: >
          This is the weak version, $(p-q+1)/(p+1)$, not the strict version.
        feedback: >
          $(9-5+1)/(9+1)=5/10=1/2$ — noticeably larger than the strict-ahead
          answer of $2/7$, since ties no longer count against A.
      - teach: >
          The formula requires a strict final lead, $p>q$ — if the count ends
          tied or B ahead, "A strictly ahead throughout" is either degenerate
          or impossible, and the derivation's climb-back-to-$p-q>0$ step no
          longer holds.
      - ask: >
          What question does $(p-q)/(p+q)$ answer?
        choices:
          - text: >
              A is strictly ahead at every stage of the count
            correct: true
            feedback: >
              Right — this is the strict, wire-to-wire version.
          - text: >
              A is ahead or tied at every stage of the count
            feedback: >
              That's the weak version, $(p-q+1)/(p+1)$ — a different, larger
              probability, since it allows ties.
          - text: >
              A wins the overall count
            feedback: >
              That's already guaranteed by $p>q$ and isn't in question — the
              formula answers something harder, about every intermediate stage.
        feedback: >
          $(p-q)/(p+q)$ is specifically the strict, never-tied, never-trailing
          probability — confusing it with the weak version is the standard
          slip.

  - node: quant-processes.random-walks.first-passage
    hook: >
      "Certain to happen eventually, yet the expected wait is infinite" is tested directly here, and it's the same trap that recurs throughout the unit whenever a $\Pr=1$ statement meets a heavy tail.
    explanation: >
      The hitting-time theorem $\Pr(T_a=n)=\frac{a}{n}\Pr(S_n=a)$ is a reflection consequence: among all paths ending at $a$ at time $n$, only a fraction $a/n$ reach $a$ for the *first* time at step $n$ rather than earlier, the same kind of "first crossing" bookkeeping that drove the ballot problem.
      Because the walk can only move one level at a time, reaching level $a$ means passing through every intermediate level $1,\dots,a-1$ first, and the walk restarts fresh (by stationary independent increments) after each one — so $T_a$ is a sum of $a$ independent copies of $T_1$. That decomposition means understanding the single-level case fully answers the general case by addition.
      $\Pr(T_a<\infty)=1$ for the symmetric walk — every level is reached eventually — but the waiting-time tail decays only like $n^{-3/2}$, a polynomial tail slow enough that $\mathbb{E}[T_a]=\sum_n n\Pr(T_a=n)$ diverges. "Certain" and "fast" are unrelated claims here.
    worked: >
      $\Pr(T_2=4)=\frac{2}{4}\Pr(S_4=2)$. Since $\Pr(S_4=2)=\binom{4}{3}2^{-4}=4/16=1/4$, this gives $\Pr(T_2=4)=\frac12\cdot\frac14=1/8$.
    interview: >
      "How many flips until your cumulative winnings first hit $+5$?" wants two facts stated together: the level is reached with probability $1$, but the expected number of flips is infinite — and the reason is the decomposition into $5$ independent copies of the one-level wait, each already infinite-mean.
    pitfalls: >
      Inferring finite expected waiting time from $\Pr(T_a<\infty)=1$ — probability-one events can have infinite mean. Using $n$ of the wrong parity for $T_a=n$; $n$ and $a$ must match parity exactly as $S_n$ does.
    recap: >
      $\Pr(T_a=n)=(a/n)\Pr(S_n=a)$: the level is hit with certainty, but as a sum of $a$ infinite-mean pieces, the wait has infinite expectation too.
    steps:
      - teach: >
          "Certain to happen eventually, yet the expected wait is infinite" is
          tested directly here, and it's the same trap that recurs throughout
          the unit whenever a $\Pr=1$ statement meets a heavy tail.
      - teach: >
          The hitting-time theorem $\Pr(T_a=n)=\frac{a}{n}\Pr(S_n=a)$ is a
          reflection consequence: among all paths ending at $a$ at time $n$,
          only a fraction $a/n$ reach $a$ for the *first* time at step $n$
          rather than earlier — the same "first crossing" bookkeeping that
          drove the ballot problem.
      - teach: >
          Because the walk can only move one level at a time, reaching level
          $a$ means passing through every intermediate level first, and the
          walk restarts fresh after each one — so $T_a$ is a sum of $a$
          independent copies of $T_1$. Understanding the single-level case
          fully answers the general case by addition.
      - ask: >
          $T_7$, the first time the walk hits $+7$, is a sum of how many
          independent copies of $T_1$?
        expects: "7"
        hint: >
          The walk must pass through levels $1,2,\dots,7$ in order, restarting
          after each one.
        feedback: >
          $T_7=T_1^{(1)}+\cdots+T_1^{(7)}$, seven independent copies of the
          one-level wait — one for each intermediate level.
      - ask: >
          What is $\Pr(T_3=5)$?
        expects: "3/32"
        tolerance: 0.0005
        hint: >
          First find $\Pr(S_5=3)$, then multiply by $a/n=3/5$.
        feedback: >
          $\Pr(S_5=3)=\binom{5}{4}2^{-5}=5/32$, so
          $\Pr(T_3=5)=\frac{3}{5}\cdot\frac{5}{32}=3/32\approx0.094$.
      - teach: >
          $\Pr(T_a<\infty)=1$ for the symmetric walk — every level is reached
          eventually — but the waiting-time tail decays only like $n^{-3/2}$,
          slow enough that $\mathbb{E}[T_a]=\sum_nn\Pr(T_a=n)$ diverges.
          "Certain" and "fast" are unrelated claims here.
      - ask: >
          Which statement is true of the fair walk's first passage to level
          $a\ge1$?
        choices:
          - text: >
              $\Pr(T_a<\infty)=1$ and $\mathbb{E}[T_a]<\infty$
            feedback: >
              $\Pr(T_a<\infty)=1$ is right, but the mean is not finite — the
              tail decays too slowly for that.
          - text: >
              $\Pr(T_a<\infty)=1$ and $\mathbb{E}[T_a]=\infty$
            correct: true
            feedback: >
              Right — certain to happen, yet the $n^{-3/2}$ tail makes the
              expected waiting time infinite.
          - text: >
              $\Pr(T_a<\infty)<1$
            feedback: >
              For the fair walk every level is reached eventually with
              probability exactly $1$; this only fails for the biased walk with
              $p<1/2$.
        feedback: >
          Certainty of arrival and finiteness of the mean waiting time are
          independent facts — the fair walk has the first without the second.
      - teach: >
          Two traps: inferring finite expected waiting time from
          $\Pr(T_a<\infty)=1$, and using an $n$ of the wrong parity for $T_a=n$
          — $n$ and $a$ must match parity exactly as $S_n$ does.
      - teach: >
          $\Pr(T_a=n)=(a/n)\Pr(S_n=a)$: the level is hit with certainty, but as
          a sum of $a$ infinite-mean pieces, the wait has infinite expectation
          too.

  - node: quant-processes.random-walks.max-distribution
    hook: >
      "What's the probability the walk ever reaches new territory by time $n$" sounds like it needs the maximum's own distribution built from scratch — reflection instead reads it straight off the endpoint law.
    explanation: >
      The key identity is that the events $\{M_n\ge a\}$ and $\{T_a\le n\}$ are literally the same event — the running maximum reaches $a$ exactly when the hitting time of $a$ is at most $n$. That converts a question about a maximum into a question about an endpoint, which reflection already answers.
      Every path ending above $a$ has necessarily crossed $a$ already (the walk can't jump over a level), so it counts directly toward $\{M_n\ge a\}$; every path ending exactly at $a$ also counts, but reflecting the paths that touch $a$ and end below it produces exactly the "ends above $a$" paths a second time — hence the factor of two and the correction: $\Pr(M_n\ge a)=2\Pr(S_n\ge a)-\Pr(S_n=a)$.
      The mental model is: don't track the maximum directly — reflect every overshoot back down, and the endpoint alone tells you whether the level was ever touched. The formula breaks at $a=0$, because $M_n\ge0$ is true by definition at time $0$ regardless of $n$, so that boundary case has to be handled by direct reasoning, not this formula.
    worked: >
      For $n=6$, $a=2$: $\Pr(S_6\ge2)=\Pr(S_6=2)+\Pr(S_6=4)+\Pr(S_6=6)=15/64+6/64+1/64=22/64$, and $\Pr(S_6=2)=15/64$. So $\Pr(M_6\ge2)=2(22/64)-15/64=29/64\approx0.453$.
    interview: >
      "Does a cumulative random walk ever cross a resistance level $a$ within $n$ steps?" is answered by converting the maximum question to an endpoint question via $\{M_n\ge a\}=\{T_a\le n\}$, not by trying to characterize the maximum's law directly.
    pitfalls: >
      Applying the formula at $a=0$, where it fails — $M_n\ge0$ always holds since $S_0=0$, so this boundary needs direct reasoning or a complement argument instead. Forgetting the $-\Pr(S_n=a)$ correction and simply doubling $\Pr(S_n\ge a)$, which overcounts paths ending exactly at $a$.
    recap: >
      $\Pr(M_n\ge a)=2\Pr(S_n\ge a)-\Pr(S_n=a)$ — the high-water mark of the walk, read off the endpoint law by reflection.
    steps:
      - teach: >
          "What's the probability the walk ever reaches new territory by time
          $n$" sounds like it needs the maximum's own distribution built from
          scratch — reflection instead reads it straight off the endpoint law.
      - teach: >
          The events $\{M_n\ge a\}$ and $\{T_a\le n\}$ are literally the same
          event — the running maximum reaches $a$ exactly when the hitting time
          of $a$ is at most $n$. That converts a question about a maximum into
          a question about an endpoint, which reflection already answers.
      - teach: >
          Every path ending above $a$ has necessarily crossed it already, so it
          counts directly toward $\{M_n\ge a\}$; reflecting the paths that
          touch $a$ and end below it produces the "ends above $a$" paths a
          second time — hence $\Pr(M_n\ge a)=2\Pr(S_n\ge a)-\Pr(S_n=a)$, with
          the second term correcting for paths ending exactly at $a$.
      - ask: >
          $n=10$, $a=6$. What is $\Pr(M_{10}\ge6)$?
        expects: "67/1024"
        tolerance: 0.0005
        hint: >
          Find $\Pr(S_{10}\ge6)$ and $\Pr(S_{10}=6)$ separately, then combine.
        feedback: >
          $\Pr(S_{10}\ge6)=(45+10+1)/1024=56/1024$ and $\Pr(S_{10}=6)=45/1024$,
          so $\Pr(M_{10}\ge6)=2(56/1024)-45/1024=67/1024\approx0.065$.
      - teach: >
          The formula breaks at $a=0$: $M_n\ge0$ is true by definition, since
          $S_0=0$, regardless of $n$. That boundary case needs direct
          reasoning, not the reflection formula.
      - ask: >
          What is $\Pr(M_n\ge0)$, for any $n$?
        choices:
          - text: >
              $1$
            correct: true
            feedback: >
              Right — the walk starts at height $0$, so its running maximum is
              always at least $0$ by definition, for every $n$.
          - text: >
              $2\Pr(S_n\ge0)-\Pr(S_n=0)$
            feedback: >
              That's the general formula misapplied at its own boundary — it
              isn't valid at $a=0$, which is exactly why this case needs
              separate reasoning.
          - text: >
              It depends on $n$
            feedback: >
              $S_0=0$ regardless of how many steps follow, so the maximum is
              pinned at $\Pr(M_n\ge0)=1$ for every $n$, with no dependence on
              it.
        feedback: >
          $M_n\ge0$ holds trivially because the walk starts at $0$ — no
          reflection argument is needed, or valid, at this boundary.
      - teach: >
          The mental model: don't track the maximum directly — reflect every
          overshoot back down, and the endpoint alone tells you whether the
          level was ever touched.
      - ask: >
          $n=8$, $a=6$. What is $\Pr(M_8\ge6)$?
        expects: "5/128"
        tolerance: 0.0005
        hint: >
          $\Pr(S_8\ge6)=(8+1)/256$ and $\Pr(S_8=6)=8/256$.
        feedback: >
          $\Pr(S_8\ge6)=9/256$, $\Pr(S_8=6)=8/256$, so
          $\Pr(M_8\ge6)=2(9/256)-8/256=10/256=5/128\approx0.039$.
      - teach: >
          $\Pr(M_n\ge a)=2\Pr(S_n\ge a)-\Pr(S_n=a)$ — the high-water mark of
          the walk, read off the endpoint law by reflection, valid for every
          $a\ge1$.

  - node: quant-processes.random-walks.reach-level-example
    hook: >
      This is the template interviewers reuse for "does it ever cross a level" questions, and its most quotable feature — visiting a level is exactly twice as likely as finishing at or above it — is a special case, not a universal law, which is the part worth actually understanding.
    explanation: >
      The doubling in "twice as likely to visit as to end above" comes specifically from the correction term $\Pr(S_n=a)$ vanishing, and that vanishing is a parity fact: with $n$ even and $a$ odd, $S_n$ can never equal $a$ exactly, since $S_n$ only lands on integers matching $n$'s parity. When that correction term is zero, $\Pr(M_n\ge a)=2\Pr(S_n\ge a)$ exactly; when $n$ and $a$ share parity, the correction term is generally nonzero and the ratio is something other than $2$.
      That distinction is the actual interview skill here: before reaching for "it's always twice as likely," check whether the target level's parity clashes with the step count's parity — that clash is precisely what makes "touching" a level strictly easier to satisfy than "ending at or above" it, since a path can touch an odd level on its way past even though it can never rest there at an even time.
    worked: >
      For $n=8$, $a=2$ — same parity, so the doubling does *not* apply cleanly. $\Pr(S_8=2)=\binom{8}{5}2^{-8}=56/256$. $\Pr(S_8\ge2)=(56+28+8+1)/256=93/256$. So $\Pr(M_8\ge2)=2(93/256)-56/256=130/256=65/128\approx0.508$, only about $1.4\times$ larger than $\Pr(S_8\ge2)\approx0.363$ — nowhere near the factor of $2$ seen when the parities clash.
    interview: >
      "Does a walk of length $n$ ever reach level $a$?" should trigger an immediate parity check between $n$ and $a$ before deciding whether the "exactly double" shortcut is even available.
    pitfalls: >
      Assuming the factor of two between "ever touches" and "ends at or above" holds universally — it only holds when $\Pr(S_n=a)=0$ by a parity mismatch between $n$ and $a$. Forgetting to verify that mismatch before quoting the shortcut.
    recap: >
      $11/32\approx34\%$ chance of touching $+3$ in ten tosses, exactly double the ending-there-or-above probability — because $10$ and $3$ have clashing parity, which kills the correction term.
    steps:
      - teach: >
          This is the template interviewers reuse for "does it ever cross a
          level" questions, and its most quotable feature — visiting a level is
          exactly twice as likely as finishing at or above it — is a special
          case, not a universal law, which is the part worth actually
          understanding.
      - teach: >
          The doubling comes specifically from the correction term $\Pr(S_n=a)$
          vanishing, and that vanishing is a parity fact: when $n$ and $a$ have
          opposite parity, $S_n$ can never equal $a$ exactly, so $\Pr(M_n\ge
          a)=2\Pr(S_n\ge a)$ exactly. When $n$ and $a$ share parity, the
          correction term is generally nonzero and the ratio is something other
          than $2$.
      - ask: >
          Over $n=9$ steps, level $a=2$ (opposite parity to $n$). What is
          $\Pr(S_9=2)$?
        expects: "0"
        hint: >
          $9$ is odd, $2$ is even.
        feedback: >
          Opposite parity means the walk can never sit exactly at $2$ after $9$
          steps, so $\Pr(S_9=2)=0$ — and the correction term in the maximum
          formula vanishes.
      - ask: >
          Still $n=9$, $a=2$: $\Pr(S_9\ge2)=65/256$. What is $\Pr(M_9\ge2)$?
        expects: "65/128"
        tolerance: 0.0005
        hint: >
          With $\Pr(S_9=2)=0$, the formula collapses to a plain doubling.
        feedback: >
          $\Pr(M_9\ge2)=2(65/256)-0=65/128\approx0.508$ — exactly double
          $\Pr(S_9\ge2)$, since the correction term vanished.
      - teach: >
          Before reaching for "it's always twice as likely," check whether the
          target level's parity clashes with the step count's parity. That
          clash is precisely what makes "touching" a level strictly easier than
          "ending at or above" it — a path can pass through an odd level on its
          way by even though it can never rest there at an even time.
      - ask: >
          Same $n=9$, but now level $a=3$ (same parity as $n$): $\Pr(S_9\ge3)=
          65/256$ and $\Pr(S_9=3)=21/128$. What is $\Pr(M_9\ge3)$?
        expects: "11/32"
        tolerance: 0.0005
        hint: >
          This time the correction term is nonzero — don't just double.
        feedback: >
          $\Pr(M_9\ge3)=2(65/256)-42/256=88/256=11/32\approx0.344$, only about
          $1.35$ times $\Pr(S_9\ge3)$ — nowhere near the clean factor of $2$
          seen when the parities clashed.
      - teach: >
          Assuming the factor of two holds universally, without first checking
          that $\Pr(S_n=a)=0$ by a parity mismatch, is the standard way this
          shortcut gets misapplied.
      - teach: >
          $11/32\approx34\%$ chance of touching $+3$ in ten tosses, exactly
          double the ending-there-or-above probability — because $10$ and $3$
          have clashing parity, which kills the correction term.

  - node: quant-processes.random-walks.return-origin
    hook: >
      $u_{2n}\sim1/\sqrt{\pi n}$ is the one number in this unit worth having memorized cold — it drives recurrence, first return, and expected distance, and its derivation is a clean Stirling exercise worth being able to redo on a whiteboard.
    explanation: >
      $u_{2n}=\Pr(S_{2n}=0)=\binom{2n}{n}/4^n$ falls straight out of path counting: exactly $n$ of the $2n$ steps must go up.
      Stirling's approximation, $n!\sim\sqrt{2\pi n}(n/e)^n$, turns this into an asymptotic. Applying it to both factorials in $\binom{2n}{n}=(2n)!/(n!)^2$: the numerator is $\sim\sqrt{4\pi n}(2n/e)^{2n}$ and the denominator is $\sim2\pi n(n/e)^{2n}$. The load-bearing cancellation is in the exponential parts — $(2n/e)^{2n}=4^n(n/e)^{2n}$ exactly cancels the $(n/e)^{2n}$ in the denominator's square — leaving only the square-root prefactors: $\binom{2n}{n}\sim4^n\sqrt{4\pi n}/(2\pi n)=4^n/\sqrt{\pi n}$. Dividing by $4^n$ gives $u_{2n}\sim1/\sqrt{\pi n}$.
      The mental model: this decay is polynomial, not exponential — slow. That slowness is precisely why the walk keeps drifting back near the origin far more often than intuition expects, and it's the single fact every asymptotic later in the unit is built from.
    worked: >
      $u_{40}=\binom{40}{20}/4^{20}=137{,}846{,}528{,}820/1{,}099{,}511{,}627{,}776\approx0.1254$, against the Stirling estimate $1/\sqrt{20\pi}\approx0.1261$ — agreement to three digits already at $n=20$.
    interview: >
      "What's the probability a fair random walk is back at zero after $2n$ steps, for large $n$?" wants both the exact form $\binom{2n}{n}/4^n$ and the Stirling-derived $1/\sqrt{\pi n}$, with the cancellation of the exponential parts sketched, not just quoted.
    pitfalls: >
      Forgetting the return probability is exactly $0$ at odd times rather than small. Dropping the $\sqrt{2\pi n}$ prefactor in Stirling and canceling only the exponential terms, which loses the constant and gives the wrong asymptotic entirely.
    recap: >
      $\Pr(S_{2n}=0)=\binom{2n}{n}/4^n\sim1/\sqrt{\pi n}$ — the master asymptotic of the one-dimensional walk, derived by canceling Stirling's exponential terms and keeping the square-root prefactor.
    steps:
      - teach: >
          $u_{2n}\sim1/\sqrt{\pi n}$ is the one number in this unit worth
          having memorized cold — it drives recurrence, first return, and
          expected distance, and its derivation is a clean Stirling exercise
          worth being able to redo on a whiteboard.
      - teach: >
          $u_{2n}=\Pr(S_{2n}=0)=\binom{2n}{n}/4^n$ falls straight out of path
          counting: exactly $n$ of the $2n$ steps must go up.
      - ask: >
          What is $u_6$, exactly?
        expects: "5/16"
        tolerance: 0.0005
        hint: >
          $u_6=\binom{6}{3}/4^3$.
        feedback: >
          $\binom{6}{3}=20$ and $4^3=64$, so $u_6=20/64=5/16=0.3125$.
      - teach: >
          Stirling's approximation, $n!\sim\sqrt{2\pi n}(n/e)^n$, turns the
          exact formula into an asymptotic. Applying it to both factorials in
          $\binom{2n}{n}=(2n)!/(n!)^2$, the load-bearing step is that
          $(2n/e)^{2n}=4^n(n/e)^{2n}$ exactly cancels the $(n/e)^{2n}$ in the
          denominator's square, leaving only the square-root prefactors:
          $\binom{2n}{n}\sim4^n\sqrt{4\pi n}/(2\pi n)=4^n/\sqrt{\pi n}$.
          Dividing by $4^n$ gives $u_{2n}\sim1/\sqrt{\pi n}$.
      - ask: >
          What is $u_{30}$, to four decimals?
        expects: "0.1445"
        tolerance: 0.0005
        hint: >
          $u_{30}=\binom{30}{15}/4^{15}$; compare it against the Stirling
          estimate $1/\sqrt{15\pi}$ once you have it.
        feedback: >
          The exact value is $u_{30}=\binom{30}{15}/4^{15}\approx0.1445$,
          already close to the Stirling estimate $1/\sqrt{15\pi}\approx0.1457$
          at $n=15$.
      - teach: >
          This decay is polynomial, not exponential — slow. That slowness is
          precisely why the walk keeps drifting back near the origin far more
          often than intuition expects, and it's the single fact every
          asymptotic later in the unit is built from.
      - ask: >
          What is $\Pr(S_7=0)$?
        choices:
          - text: >
              $0$
            correct: true
            feedback: >
              Right — returns are impossible at odd times; only even times have
              $S_n=0$ well defined by parity.
          - text: >
              $\binom{7}{3}/2^7\approx0.273$
            feedback: >
              This misapplies the return formula at an odd index — $u_{2n}$ is
              only defined for even times, since $S_n=0$ requires $n$ even.
          - text: >
              $1/\sqrt{7\pi}$
            feedback: >
              The Stirling estimate approximates $u_{2n}$ at even times only;
              plugging an odd time into it is a category error, not just an
              approximation.
        feedback: >
          Parity forbids any return at an odd time, exactly, not approximately
          — the probability is $0$.
      - teach: >
          Dropping the $\sqrt{2\pi n}$ prefactor and canceling only the
          exponential terms loses the constant entirely and gives the wrong
          asymptotic — the prefactor is not optional bookkeeping.
      - teach: >
          $\Pr(S_{2n}=0)=\binom{2n}{n}/4^n\sim1/\sqrt{\pi n}$ — the master
          asymptotic of the one-dimensional walk, derived by canceling
          Stirling's exponential terms and keeping the square-root prefactor.

  - node: quant-processes.random-walks.first-return
    hook: >
      Certain to come home, yet the average trip takes infinitely long — the same "$\Pr=1$ meets a heavy tail" trap as first passage, now pinned to an exact tail exponent worth remembering.
    explanation: >
      The first-return law $f_{2n}=u_{2n-2}-u_{2n}=u_{2n}/(2n-1)$ telescopes beautifully when summed: $\sum_{n\ge1}f_{2n}=\sum_{n\ge1}(u_{2n-2}-u_{2n})=u_0-\lim_{n\to\infty}u_{2n}$. Since $u_0=1$ and $u_{2n}\sim1/\sqrt{\pi n}\to0$ by the return-to-origin asymptotic, the sum is exactly $1$ — the walk returns to its start with certainty, proved using nothing but that single asymptotic fact.
      Certainty does not mean speed: feeding the same asymptotic into $f_{2n}=u_{2n}/(2n-1)$ gives $f_{2n}\sim1/(2\sqrt{\pi}\,n^{3/2})$, so $\mathbb{E}[T_0]=\sum_n2nf_{2n}\sim\sum_n1/(\sqrt{\pi}\sqrt{n})$ — a $p$-series with $p=1/2<1$, which diverges. The expected return time is infinite even though return itself is certain.
    worked: >
      The probability the first return to the origin happens exactly at step $10$: $f_{10}=u_{10}/9$, and $u_{10}=\binom{10}{5}/4^5=252/1024=63/256$, so $f_{10}=(63/256)/9=7/256\approx0.0273$.
    interview: >
      "Prove a fair coin-flip game returns to break-even with probability $1$, but takes infinite expected time" wants the telescoping-sum argument for certainty and the $n^{-3/2}$-tail comparison-to-a-divergent-series for the infinite mean, both stated explicitly.
    pitfalls: >
      Reasoning "it returns with probability $1$, so the mean must be finite" — a non sequitur; the tail exponent, not the total probability, controls whether the mean is finite. Misplacing which of $u_{2n-2}-u_{2n}$ or $u_{2n}/(2n-1)$ uses which index — both equal $f_{2n}$, but plugging the wrong $n$ into either form is a common slip.
    recap: >
      The walk comes home with probability $1$, yet the expected time to do it is infinite: $\Pr(T_0=2n)\sim n^{-3/2}/(2\sqrt{\pi})$, a tail too heavy for a finite mean.
    steps:
      - teach: >
          Certain to come home, yet the average trip takes infinitely long —
          the same "$\Pr=1$ meets a heavy tail" trap as first passage, now
          pinned to an exact tail exponent worth remembering.
      - teach: >
          The first-return law has two equivalent forms:
          $f_{2n}=u_{2n-2}-u_{2n}=u_{2n}/(2n-1)$. The first telescopes when
          summed; the second is the one to compute a single value with.
      - ask: >
          Using $u_3=5/16$ and $u_4=35/128$, what is $f_8$?
        expects: "5/128"
        tolerance: 0.0005
        hint: >
          $f_8=u_{2(4)-2}-u_{2(4)}=u_6-u_8$, and $u_6=u_3$, $u_8=u_4$ in this
          indexing.
        feedback: >
          $f_8=u_6-u_8=5/16-35/128=40/128-35/128=5/128\approx0.039$, and the
          ratio form agrees: $u_8/(2\cdot4-1)=(35/128)/7=5/128$.
      - teach: >
          Summed over all $n$, the telescoping form gives
          $\sum_{n\ge1}f_{2n}=\sum_{n\ge1}(u_{2n-2}-u_{2n})=u_0-\lim_nu_{2n}$.
          Since $u_0=1$ and $u_{2n}\to0$ by the return-to-origin asymptotic,
          this sum is exactly $1$: the walk returns to its start with
          certainty, using nothing but that one asymptotic fact.
      - ask: >
          Why does the walk return to the origin with probability exactly $1$?
        choices:
          - text: >
              Because the telescoping sum of $f_{2n}$ equals $u_0-\lim_nu_{2n}
              =1-0$
            correct: true
            feedback: >
              Right — the entire proof is that one telescoping sum, using only
              $u_0=1$ and $u_{2n}\to0$.
          - text: >
              Because $u_{2n}$ equals $1$ for every $n$
            feedback: >
              The opposite is true: $u_{2n}$ shrinks toward $0$ as $n$ grows.
              It's $u_0$, not every $u_{2n}$, that equals $1$.
          - text: >
              Because the walk is symmetric, so it must return
            feedback: >
              Symmetry alone doesn't prove certainty of return — it's exactly
              as symmetric in three dimensions, where the walk is transient.
        feedback: >
          The telescoping identity is the whole proof: $u_0=1$, $u_{2n}\to0$,
          so the sum of first-return probabilities is exactly $1$.
      - teach: >
          Certainty does not mean speed. Feeding the same asymptotic into
          $f_{2n}=u_{2n}/(2n-1)$ gives $f_{2n}\sim1/(2\sqrt{\pi}\,n^{3/2})$, so
          $\mathbb{E}[T_0]=\sum_n2nf_{2n}\sim\sum_n1/(\sqrt{\pi}\sqrt{n})$ — a
          $p$-series with $p=1/2<1$, which diverges.
      - ask: >
          What is $f_{14}$, the probability the first return happens exactly at
          step $14$?
        expects: "33/2048"
        tolerance: 0.0005
        hint: >
          $u_7=\binom{14}{7}/4^7=429/2048$; then $f_{14}=u_7/(2\cdot7-1)$.
        feedback: >
          $f_{14}=u_7/13=(429/2048)/13=33/2048\approx0.0161$.
      - teach: >
          Reasoning "it returns with probability $1$, so the mean must be
          finite" is a non sequitur — the tail exponent, not the total
          probability, controls whether the mean is finite. Also watch the
          indices: $u_{2n-2}-u_{2n}$ and $u_{2n}/(2n-1)$ both equal $f_{2n}$,
          but plugging the wrong $n$ into either form is a common slip.
      - teach: >
          The walk comes home with probability $1$, yet the expected time to do
          it is infinite: $\Pr(T_0=2n)\sim n^{-3/2}/(2\sqrt{\pi})$, a tail too
          heavy for a finite mean.

  - node: quant-processes.random-walks.expected-distance
    hook: >
      "On average, how far from the start is the walk after $n$ steps?" has a specific constant — $\sqrt{2/\pi}\approx0.8$ times $\sqrt{n}$ — and confusing it with the standard deviation $\sqrt{n}$ itself is the exact error interviewers are checking for.
    explanation: >
      The exact identity $\mathbb{E}|S_{2n}|=2n\,u_{2n}$ turns into the headline asymptotic by substituting the return-to-origin estimate directly: $\mathbb{E}|S_{2n}|\sim2n/\sqrt{\pi n}=2\sqrt{n/\pi}=\sqrt{4n/\pi}$, matching $\sqrt{2m/\pi}$ at $m=2n$. Nothing new is needed here beyond plugging the earlier asymptotic into the exact formula.
      The constant $\sqrt{2/\pi}\approx0.798$ is not arbitrary — it is exactly the ratio $\mathbb{E}|Z|/\sigma$ for a centered normal variable $Z$, consistent with $S_m$ having standard deviation $\sqrt{m}$: the expected *distance* from the origin is smaller than the *typical scale* of fluctuation $\sqrt{m}$, because occasionally being very close to $0$ pulls the average absolute value down below the root-mean-square value.
    worked: >
      At $m=40$: $u_{40}\approx0.1254$ (from return-to-origin), so $\mathbb{E}|S_{40}|=40(0.1254)\approx5.02$, closely matching the estimate $\sqrt{2(40)/\pi}=\sqrt{80/\pi}\approx5.05$.
    interview: >
      "Roughly how far from the start will a random walk be after $n$ steps, on average?" wants $\sqrt{2n/\pi}\approx0.8\sqrt{n}$, explicitly distinguished from the standard deviation $\sqrt{n}$ — a different constant answering a different question.
    pitfalls: >
      Quoting $\sqrt{n}$ instead of $\sqrt{2n/\pi}\approx0.8\sqrt{n}$ as the expected distance — that conflates mean absolute deviation with standard deviation. Applying the even-$m$ formula $2nu_{2n}$ at an odd $m$, or vice versa; the two parities have different exact formulas.
    recap: >
      Typical distance after $m$ steps is $\sqrt{2m/\pi}\approx0.8\sqrt{m}$, obtained by feeding the return-to-origin asymptotic into an exact identity — about $5$ after $40$ steps.
    steps:
      - teach: >
          "On average, how far from the start is the walk after $n$ steps?" has
          a specific constant — $\sqrt{2/\pi}\approx0.8$ times $\sqrt{n}$ — and
          confusing it with the standard deviation $\sqrt{n}$ itself is the
          exact error interviewers are checking for.
      - teach: >
          The exact identity is $\mathbb{E}|S_{2n}|=2n\,u_{2n}$ for even times
          and $\mathbb{E}|S_{2n+1}|=(2n+1)\,u_{2n}$ for odd ones — both built
          from the same return-to-origin quantity $u_{2n}$ you already know how
          to compute.
      - ask: >
          Using $u_4=35/128$, what is $\mathbb{E}|S_8|$?
        expects: "35/16"
        tolerance: 0.0005
        hint: >
          Here $2n=8$, so multiply $u_4$ by $2n=8$.
        feedback: >
          $\mathbb{E}|S_8|=8\,u_4=8(35/128)=280/128=35/16=2.1875$.
      - teach: >
          Substituting the asymptotic $u_{2n}\sim1/\sqrt{\pi n}$ into the exact
          identity gives $\mathbb{E}|S_{2n}|\sim2n/\sqrt{\pi n}=2\sqrt{n/\pi}$,
          matching $\sqrt{2m/\pi}$ at $m=2n$ — nothing new is needed beyond
          plugging the earlier asymptotic into the exact formula.
      - ask: >
          Using the asymptotic estimate, what is $\mathbb{E}|S_{50}|$, to four
          decimals?
        expects: "5.6419"
        tolerance: 0.0005
        hint: >
          $\mathbb{E}|S_m|\approx\sqrt{2m/\pi}$ with $m=50$.
        feedback: >
          $\sqrt{2(50)/\pi}=\sqrt{100/\pi}\approx5.6419$.
      - teach: >
          The constant $\sqrt{2/\pi}\approx0.798$ is not arbitrary — it is
          exactly the ratio $\mathbb{E}|Z|/\sigma$ for a centered normal $Z$.
          Occasionally being very close to $0$ pulls the average absolute value
          down below the root-mean-square value $\sqrt{m}$, which is why the
          expected distance is smaller than the typical fluctuation scale.
      - ask: >
          Which is larger for a walk after $m$ steps: the standard deviation
          $\sqrt{m}$, or the expected distance $\mathbb{E}|S_m|$?
        choices:
          - text: >
              The standard deviation $\sqrt{m}$
            correct: true
            feedback: >
              Right — $\mathbb{E}|S_m|\approx0.798\sqrt{m}$ is strictly
              smaller, because occasional near-zero values pull the average
              down.
          - text: >
              They are equal
            feedback: >
              They differ by a factor of $\sqrt{2/\pi}\approx0.798$, not equal
              — mean absolute deviation and standard deviation measure
              different things here.
          - text: >
              The expected distance $\mathbb{E}|S_m|$
            feedback: >
              This has the direction backwards: the mean absolute value is
              pulled down by occasional returns near the origin, so it's the
              smaller of the two.
        feedback: >
          $\mathbb{E}|S_m|\approx0.798\sqrt{m}$ is always below the standard
          deviation $\sqrt{m}$ — a different constant answering a different
          question.
      - teach: >
          Two traps: quoting $\sqrt{m}$ instead of $\sqrt{2m/\pi}$ as the
          expected distance, and applying the even-$m$ identity $2n\,u_{2n}$ at
          an odd $m$, or vice versa — the two parities have different exact
          formulas.
      - teach: >
          Typical distance after $m$ steps is
          $\sqrt{2m/\pi}\approx0.8\sqrt{m}$, obtained by feeding the
          return-to-origin asymptotic into an exact identity.

  - node: quant-processes.random-walks.nonnegative-paths
    hook: >
      "The lead never changed hands" sounds like a rare, notable event — it is in fact exactly as likely as sitting precisely at zero, a genuinely surprising coincidence worth stating outright rather than re-deriving under pressure.
    explanation: >
      The ballot theorem's reflection argument, run with $p=q=n$ instead of $p>q$, is what produces the Catalan count $C_n=\binom{2n}{n}/(n+1)$ for paths of length $2n$ that return to $0$ while never dipping below it — the same "reflect the bad half onto the other" bookkeeping, just at the boundary case.
      Dropping the requirement to end at $0$ and asking only "did the path ever dip negative" produces the striking identity $\Pr(S_1\ge0,\dots,S_{2n}\ge0)=u_{2n}$ — numerically the *same* number as the probability of being exactly at the origin at time $2n$. That equality has a bijective proof, but the number itself is the useful part: since $u_{2n}\sim1/\sqrt{\pi n}$ decays only polynomially, staying entirely on one side of zero for $2n$ steps is a "large," $\sqrt{n}$-probability event, not a rare one.
      This is the direct setup for why long one-sided runs in a fair game are typical rather than exceptional — the next node makes that a full distributional statement.
    worked: >
      For $2n=16$ tosses: $u_{16}=\binom{16}{8}/4^8=12{,}870/65{,}536\approx0.1964$. So the probability heads is never behind tails over $16$ tosses is about $19.6\%$, and the strict version (heads strictly ahead throughout) is half that, $u_{16}/2\approx0.0982$.
    interview: >
      "In $2n$ coin flips, what's the probability heads is never behind tails?" is meant to be answered instantly with $u_{2n}$ — the same number as "probability of being at zero at time $2n$" — stated as a known identity, not derived live.
    pitfalls: >
      Conflating "never behind" (ties allowed, $\ge0$ throughout, probability $u_{2n}$) with "always strictly ahead" ($>0$ throughout, probability $u_{2n}/2$) — these differ by exactly a factor of $2$. Assuming the at-zero/nonnegative-throughout coincidence extends to the biased walk — it is a symmetric-walk fact only.
    recap: >
      Catalan numbers count nonnegative excursions, and the walk stays nonnegative through $2n$ steps with probability $u_{2n}=\binom{2n}{n}/4^n$ — the same number as being exactly at the origin at time $2n$.
    steps:
      - teach: >
          "The lead never changed hands" sounds like a rare, notable event — it
          is in fact exactly as likely as sitting precisely at zero, a
          genuinely surprising coincidence worth stating outright rather than
          re-deriving under pressure.
      - teach: >
          Running the ballot theorem's reflection argument with $p=q=n$ instead
          of $p>q$ produces the Catalan count $C_n=\binom{2n}{n}/(n+1)$ for
          paths of length $2n$ that return to $0$ while never dipping below it
          — the same "reflect the bad half onto the other" bookkeeping, just at
          the boundary case.
      - ask: >
          How many $18$-step paths from $0$ return to $0$ while never dipping
          negative?
        expects: "4862"
        hint: >
          Use the Catalan count with $2n=18$, so $n=9$.
        feedback: >
          $C_9=\binom{18}{9}/10=48{,}620/10=4{,}862$.
      - teach: >
          Dropping the requirement to end at $0$ and asking only "did the path
          ever dip negative" gives the striking identity
          $\Pr(S_1\ge0,\dots,S_{2n}\ge0)=u_{2n}$ — numerically the *same*
          number as the probability of being exactly at the origin at time
          $2n$. Since $u_{2n}\sim1/\sqrt{\pi n}$ decays only polynomially,
          staying entirely on one side of zero for $2n$ steps is a "large,"
          $\sqrt{n}$-probability event, not a rare one.
      - ask: >
          What is $\Pr(S_1\ge0,\dots,S_{20}\ge0)$, to four decimals?
        expects: "0.1762"
        tolerance: 0.0005
        hint: >
          This equals $u_{20}=\binom{20}{10}/4^{10}$.
        feedback: >
          $u_{20}=184{,}756/1{,}048{,}576\approx0.1762$ — the same number as
          $\Pr(S_{20}=0)$.
      - teach: >
          The strict version — the lead staying strictly positive throughout,
          not just nonnegative — is exactly half of that: $u_{2n}/2$.
      - ask: >
          What is $\Pr(S_1>0,\dots,S_{20}>0)$, to four decimals?
        expects: "0.0881"
        tolerance: 0.0005
        hint: >
          Halve the previous answer.
        feedback: >
          $u_{20}/2\approx0.1762/2\approx0.0881$.
      - teach: >
          Conflating "never behind" ($\ge0$ throughout, probability $u_{2n}$)
          with "always strictly ahead" ($>0$ throughout, probability
          $u_{2n}/2$) is the standard slip. And the
          at-zero/nonnegative-throughout coincidence is a symmetric-walk fact
          only — it does not carry over to the biased walk.
      - teach: >
          Catalan numbers count nonnegative excursions, and the walk stays
          nonnegative through $2n$ steps with probability
          $u_{2n}=\binom{2n}{n}/4^n$ — the same number as being exactly at the
          origin at time $2n$.

  - node: quant-processes.random-walks.recurrence-dimension
    hook: >
      "Does a random walk on a grid always find its way back?" has a clean yes/no answer that flips at dimension three — a favorite "does your intuition survive higher dimensions" question, and the flip is entirely about one exponent.
    explanation: >
      The recurrence criterion, $\sum_n\Pr(S_n=0)=\infty$, converts a hard probabilistic question into an elementary series-convergence test once you know how $\Pr(S_n=0)$ decays in each dimension. In one dimension, $u_{2n}\sim1/\sqrt{\pi n}$, and $\sum1/\sqrt{n}$ is a $p$-series with $p=1/2\le1$: it diverges, so the walk is recurrent.
      In two dimensions, rotating the lattice $45$ degrees decomposes the walk into two independent one-dimensional walks along the new axes, so returning to the origin means both coordinates return simultaneously: $u_{2n}\sim(1/\sqrt{\pi n})^2=1/(\pi n)$. That's the harmonic series, $p=1$ — still divergent, so still recurrent, but only barely, right at the boundary of the test.
      In three dimensions the decay steepens to $u_{2n}\sim cn^{-3/2}$, a $p=3/2>1$ series that converges — the walk becomes transient. The entire recurrent/transient split comes down to whether that one exponent crosses $1$, which is Kakutani's line: a drunk man finds his way home, but a drunk bird may not.
    worked: >
      Comparing partial sums makes the boundary concrete: $\sum_{n=1}^{1000}n^{-1/2}\approx61.8$ and is still climbing (as it must, since it diverges like $\sqrt{N}$), while $\sum_{n=1}^{1000}n^{-3/2}\approx2.61$, already essentially at its limit $\zeta(3/2)\approx2.612$.
    interview: >
      "Does a random walk on a $2$D grid return to its start? What about $3$D?" wants "yes with probability $1$" for $2$D and "no, positive probability of escaping forever" for $3$D, justified by the $\sum\Pr(S_n=0)$ criterion and the exponent crossing $1$ at $d=3$, not vague intuition about "more room to wander."
    pitfalls: >
      Assuming higher dimensions are "more likely" to return because there's more room to explore — that's backwards; more room is exactly why the walk escapes. Treating $2$D as quantitatively similar to $1$D just because both are recurrent — $2$D's return probability decays like $1/n$ against $1$D's $1/\sqrt{n}$, so $2$D excursions away from the origin are typically far longer.
    recap: >
      Recurrent in one and two dimensions, transient from three on — the split is exactly where the return-probability decay exponent crosses $1$ in $\sum_n\Pr(S_n=0)$.
    steps:
      - teach: >
          "Does a random walk on a grid always find its way home?" has a clean
          yes/no answer that flips at dimension three — a favorite
          "does-your-intuition-survive-higher-dimensions" question, and the
          flip is entirely about one exponent.
      - teach: >
          The recurrence criterion, $\sum_n\Pr(S_n=0)=\infty$, converts a hard
          probabilistic question into an elementary series-convergence test. In
          one dimension, $u_{2n}\sim1/\sqrt{\pi n}$, and $\sum1/\sqrt{n}$ is a
          $p$-series with $p=1/2\le1$: it diverges, so the walk is recurrent.
      - teach: >
          In two dimensions, rotating the lattice $45$ degrees decomposes the
          walk into two independent one-dimensional walks, so returning to the
          origin means both coordinates return simultaneously:
          $u_{2n}\sim(1/\sqrt{\pi n})^2=1/(\pi n)$ — the harmonic series,
          $p=1$, still divergent, so still recurrent, but only barely. In three
          dimensions the decay steepens to $u_{2n}\sim cn^{-3/2}$, a $p=3/2>1$
          series that converges — the walk becomes transient.
      - ask: >
          The pattern $u_{2n}\sim cn^{-d/2}$ matches all three known cases
          (exponents $1/2$, $1$, $3/2$ for $d=1,2,3$). What exponent would you
          predict for the walk on $\mathbb{Z}^4$?
        expects: "2"
        hint: >
          Continue the pattern $d/2$ to $d=4$.
        feedback: >
          $d/2=4/2=2$: each extra dimension adds $1/2$ to the exponent,
          matching $1/2,1,3/2,2,\dots$ for $d=1,2,3,4$.
      - ask: >
          Is the simple random walk on $\mathbb{Z}^4$ recurrent or transient?
        choices:
          - text: >
              Recurrent
            feedback: >
              With exponent $2>1$, $\sum_nn^{-2}$ converges, which is exactly
              the transience criterion — not recurrence.
          - text: >
              Transient
            correct: true
            feedback: >
              Right — exponent $2>1$ makes $\sum_n\Pr(S_n=0)$ converge, so by
              the recurrence criterion the walk is transient.
          - text: >
              Can't tell without simulation
            feedback: >
              The series-convergence criterion settles it directly, the same
              way it settled $d=1,2,3$ — no simulation needed.
        feedback: >
          Once the exponent $d/2$ exceeds $1$, the return-probability series
          converges and the walk is transient — true for every $d\ge3$.
      - teach: >
          The wrong instinct is that more dimensions mean more room to wander,
          so return should be *harder* to avoid. It's backwards: more room is
          exactly why the walk escapes and never has to come back.
      - ask: >
          Which statement about $2$D versus $1$D recurrence is correct?
        choices:
          - text: >
              Both are recurrent, but $2$D excursions away from the origin are
              typically far longer, since its decay is only $1/n$ against
              $1$D's $1/\sqrt{n}$
            correct: true
            feedback: >
              Right — both series diverge, but $2$D's return probability
              shrinks faster, so the walk spends much longer stretches away
              from $0$.
          - text: >
              $2$D decays faster than $1$D, so it's more strongly recurrent
            feedback: >
              It has the direction backwards: $1/n$ shrinks faster than
              $1/\sqrt{n}$, so $2$D's excursions away from the origin are
              longer, not shorter — and once a series diverges, "more strongly
              recurrent" isn't a meaningful comparison anyway.
          - text: >
              $2$D is only "conditionally recurrent," unlike $1$D
            feedback: >
              Both are unconditionally recurrent — $2$D's return probability
              series diverges outright, just more slowly than $1$D's.
        feedback: >
          Recurrence is yes/no in both dimensions, but $2$D sits right at the
          boundary of the test while $1$D diverges comfortably — that shows up
          as much longer excursions in $2$D.
      - teach: >
          Recurrent in one and two dimensions, transient from three on — the
          split is exactly where the return-probability decay exponent crosses
          $1$ in $\sum_n\Pr(S_n=0)$.

  - node: quant-processes.random-walks.expected-visits
    hook: >
      Turning "is it recurrent" into "how many times, on average, does it come back" replaces a yes/no with an actual number — and that number swings from infinite to about $1.5$ just by adding two dimensions.
    explanation: >
      Every visit to the origin is a fresh restart of the walk, so the number of visits $V$ (counting time $0$) is geometric: needing at least $k$ visits means returning $k-1$ more times, each independently with probability $R$ (the probability of ever returning at all), giving $\Pr(V=k)=R^{k-1}(1-R)$ and the standard geometric mean $\mathbb{E}[V]=1/(1-R)$.
      That mean has a second expression worth knowing: $\mathbb{E}[V]=\sum_{n\ge0}\Pr(S_n=0)$, summing the exact return-origin sequence over all time — a Green's-function identity connecting the visit count directly to the analytic quantity from earlier in the unit. The dichotomy from recurrence follows immediately: $R=1$ in one and two dimensions forces $\mathbb{E}[V]=\infty$ (matching the divergent sum used to prove recurrence there), while $R\approx0.3405$ in three dimensions gives a small, genuinely finite number.
    worked: >
      In three dimensions, $R\approx0.3405$, so the full geometric tail is computable, not just its mean: $\Pr(V=1)=1-R\approx0.6595$ (never returns at all), $\Pr(V=2)=R(1-R)\approx0.2246$ (returns exactly once), $\Pr(V=3)=R^2(1-R)\approx0.0765$, and so on — consistent with the mean $\mathbb{E}[V]=1/(1-R)\approx1.516$.
    interview: >
      "What's the expected number of times a $3$D random walk revisits its starting point?" wants the geometric-restart argument, $\Pr(V=k)=R^{k-1}(1-R)$, stated explicitly — not just the number $1.52$ recited from memory.
    pitfalls: >
      Treating "finite expected visits" and "recurrence is all-or-nothing" as in tension — they're not: a finite mean like $1.52$ just means the geometric tail thins out fast, while recurrence itself remains a strict infinitely-often-or-finitely-often dichotomy. Forgetting to count time $0$ as the first visit when computing $V$.
    recap: >
      Visits are geometric with mean $1/(1-R)$, tying directly to $\sum_n\Pr(S_n=0)$ — infinite in one and two dimensions, about $1.5$ in three.
    steps:
      - teach: >
          Turning "is it recurrent" into "how many times, on average, does it
          come back" replaces a yes/no with an actual number — and that number
          swings from infinite to about $1.5$ just by adding two dimensions.
      - teach: >
          Every visit to the origin is a fresh restart of the walk, so the
          number of visits $V$ (counting time $0$) is geometric: needing at
          least $k$ visits means returning $k-1$ more times, each independently
          with probability $R$ (the probability of ever returning at all),
          giving $\Pr(V=k)=R^{k-1}(1-R)$ and mean $\mathbb{E}[V]=1/(1-R)$.
      - ask: >
          In three dimensions, $R\approx0.3405$. What is $\Pr(V=4)$, to four
          decimals?
        expects: "0.0260"
        tolerance: 0.0005
        hint: >
          $\Pr(V=4)=R^3(1-R)$.
        feedback: >
          $R^3(1-R)\approx(0.3405)^3(0.6595)\approx0.0260$.
      - teach: >
          The mean has a second expression worth knowing:
          $\mathbb{E}[V]=\sum_{n\ge0}\Pr(S_n=0)$, summing the exact
          return-origin sequence over all time — a Green's-function identity
          connecting the visit count directly to the return-probability
          quantity from earlier in the unit. The dichotomy from recurrence
          follows immediately: $R=1$ in one and two dimensions forces
          $\mathbb{E}[V]=\infty$, while $R\approx0.3405$ in three dimensions
          gives a small, genuinely finite number.
      - ask: >
          In three dimensions, what is the probability the walk returns to the
          origin at least once, i.e. $\Pr(V\ge2)$?
        expects: "0.3405"
        tolerance: 0.0005
        hint: >
          $V\ge2$ means at least one return happened.
        feedback: >
          $\Pr(V\ge2)=1-\Pr(V=1)=1-(1-R)=R=0.3405$ — by definition, $R$ *is*
          the probability of ever returning at all.
      - teach: >
          "Finite expected visits" and "recurrence is all-or-nothing" are not
          in tension: a finite mean like $1.52$ just means the geometric tail
          thins out fast, while recurrence itself remains a strict
          infinitely-often-or-finitely-often dichotomy. Also remember to count
          time $0$ as the first visit when computing $V$.
      - ask: >
          In one dimension, $R=1$. What is $\mathbb{E}[V]$?
        choices:
          - text: >
              Infinite
            correct: true
            feedback: >
              Right — $1/(1-R)=1/(1-1)$ blows up, matching the fact that the
              walk visits the origin infinitely often with probability $1$ in
              one dimension.
          - text: >
              $1/(1-1)=0$
            feedback: >
              $1/(1-R)$ grows without bound as $R\to1$, it does not go to $0$ —
              check the direction of the limit.
          - text: >
              A finite number around $2$
            feedback: >
              That would require $R$ noticeably below $1$; in one dimension
              $R=1$ exactly, since the walk returns with certainty.
        feedback: >
          With $R=1$, $\mathbb{E}[V]=1/(1-R)=\infty$: the one-dimensional walk
          visits the origin infinitely often with probability $1$.
      - teach: >
          Visits are geometric with mean $1/(1-R)$, tying directly to
          $\sum_n\Pr(S_n=0)$ — infinite in one and two dimensions, about $1.5$
          in three.

  - node: quant-processes.random-walks.arcsine-law
    hook: >
      "Your friend was ahead the whole game — they must be skilled" is exactly backwards: the arcsine law says lopsided fair games are the *typical* outcome, not evidence of anything.
    explanation: >
      Staying nonnegative through $2n$ steps was already shown to be a large, $\sqrt{n}$-probability event, not a rare one — the arcsine law upgrades that single fact into a full distributional statement about the *fraction* of time spent on the positive side, and that fraction turns out to be U-shaped, concentrated near the extremes $0$ and $1$ rather than near $1/2$.
      The mechanism is visible in the law of the last tie: its density is proportional to $u_{2k}u_{2n-2k}$, and since each $u$ term decays like $1/\sqrt{k}$, this product is smallest in the middle (where both factors are moderate) and largest at the extremes (where one factor is close to $u_0=1$). A last tie very early or very late is far more likely than one near the midpoint — which is exactly why one side dominates almost the entire game so often.
    worked: >
      $\Pr(\text{fraction of time ahead}\le0.10)=\frac{2}{\pi}\arcsin\sqrt{0.10}\approx\frac{2}{\pi}(0.3217)\approx0.205$. By symmetry the same probability applies to being ahead at least $90\%$ of the time, so roughly $41\%$ of fair games see one side dominate at least nine-tenths of the game.
    interview: >
      "Over a long run of a fair coin-flip game, what fraction of the time is one side ahead?" — the naive "close to half" answer is wrong; the correct answer cites the U-shaped arcsine density and states outright that lopsided dominance, not balance, is the common case.
    pitfalls: >
      Reaching for a law-of-large-numbers instinct here — it doesn't apply, because "which side is ahead at time $t$" is wildly dependent across $t$, unlike an iid sequence. Reading a one-sided track record in a genuinely fair process as evidence of skill, when a fair process already produces such runs at high frequency.
    recap: >
      The share of time spent ahead is U-shaped, not bell-shaped: about $41\%$ of fair games have one side ahead at least $90\%$ of the time.
    steps:
      - teach: >
          "Your friend was ahead the whole game — they must be skilled" is
          exactly backwards: the arcsine law says lopsided fair games are the
          *typical* outcome, not evidence of anything.
      - teach: >
          Staying nonnegative through $2n$ steps was already shown to be a
          large, $\sqrt{n}$-probability event, not a rare one. The arcsine law
          upgrades that single fact into a full distributional statement about
          the *fraction* of time spent on the positive side, and that fraction
          is U-shaped: concentrated near the extremes $0$ and $1$, not near
          $1/2$.
      - ask: >
          What is $\Pr(\text{fraction of time ahead}\le0.25)$?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          Use $\frac{2}{\pi}\arcsin\sqrt{x}$ with $x=0.25$, and notice
          $\arcsin(0.5)=\pi/6$.
        feedback: >
          $\frac{2}{\pi}\arcsin\sqrt{0.25}=\frac{2}{\pi}\arcsin(0.5)
          =\frac{2}{\pi}\cdot\frac{\pi}{6}=1/3$.
      - teach: >
          The density is symmetric about $1/2$, so the same closed form applies
          on either side of the midpoint — plugging in a value above $1/2$
          works exactly the same way as one below it.
      - ask: >
          What is $\Pr(\text{fraction of time ahead}\le0.75)$?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          $\arcsin\sqrt{0.75}=\arcsin(\sqrt3/2)=\pi/3$.
        feedback: >
          $\frac{2}{\pi}\arcsin\sqrt{0.75}=\frac{2}{\pi}\cdot\frac{\pi}{3}
          =2/3$.
      - teach: >
          The mechanism is visible in the law of the last tie: its density is
          proportional to $u_{2k}u_{2n-2k}$, and since each $u$ term decays
          like $1/\sqrt{k}$, this product is smallest when both factors are
          moderate and largest at the extremes, where one factor is close to
          $u_0=1$. A last tie very early or very late is far more likely than
          one near the midpoint — exactly why one side dominates almost the
          entire game so often.
      - ask: >
          The last-tie density is proportional to $u_{2k}u_{2n-2k}$. Where is
          it smallest?
        choices:
          - text: >
              Near $k=n/2$
            correct: true
            feedback: >
              Right — with both factors moderate rather than one of them near
              $u_0=1$, the product $u_{2k}u_{2n-2k}$ is at its smallest near
              the midpoint.
          - text: >
              Near the extremes $k\approx0$ or $k\approx n$
            feedback: >
              That's backwards — near an extreme, one factor is close to
              $u_0=1$, which makes the product *largest*, not smallest.
          - text: >
              It's constant in $k$
            feedback: >
              Each $u$ term decays with its own index, so the product genuinely
              varies with $k$ — it is not flat.
        feedback: >
          The product $u_{2k}u_{2n-2k}$ dips in the middle and peaks at the
          extremes, which is exactly why lopsided games — and early or late
          last ties — are the common case.
      - teach: >
          Reaching for a law-of-large-numbers instinct here is the trap: it
          doesn't apply, because "which side is ahead at time $t$" is wildly
          dependent across $t$, unlike an iid sequence. Reading a one-sided
          track record in a genuinely fair process as evidence of skill is
          exactly this error — a fair process already produces such runs at
          high frequency.
      - teach: >
          The share of time spent ahead is U-shaped, not bell-shaped: about
          $41\%$ of fair games have one side ahead at least $90\%$ of the time.

  - node: quant-processes.random-walks.fair-but-slow
    hook: >
      "You're certain to end up ahead eventually" is technically true and practically useless as a plan — this node is where interviewers test whether you can hold "certain," "fair," and "unbounded" as true at once without contradiction.
    explanation: >
      Three facts sit together without conflict. At every fixed $n$, $\mathbb{E}[S_n]=0$ — the game is fair moment to moment. First return's telescoping argument extends to any target level: the walk reaches $+a$ with probability $1$ for the same reason it returns to $0$ with probability $1$. Yet $T_a$ is a sum of $a$ independent copies of $T_1$, and $T_1$ already has infinite mean, so $\mathbb{E}[T_a]=\infty$ for every $a$ — adding more infinite-mean pieces cannot produce a finite sum.
      The "sure win" is bought with unbounded time and unbounded drawdown along the way, and taking away either assumption destroys it: capping the bankroll turns the problem into gambler's ruin, where the guarantee can genuinely fail, and capping the patience means quitting before the certain event arrives. Risk limits are therefore written in capital and time directly, never in "wait until the probability of loss is low" — that probability can already be exactly the value you want and still describe an unworkable plan.
    worked: >
      By the return-to-origin tail, $\Pr(T_1>N)\sim1/\sqrt{\pi N/2}$; at $N=10^6$ this is about $1/\sqrt{\pi\cdot500{,}000}\approx0.0008$ — small on any given day, yet that same $n^{-1/2}$ tail is exactly what makes the average wait across all outcomes infinite.
    interview: >
      "A fair coin game has no stopping rule except 'quit once ahead' — is this a sure thing?" wants "yes, probability $1$," immediately followed by "but expected duration and expected required bankroll are both infinite," and the observation that a finite real bankroll turns this into gambler's ruin, where the guarantee is no longer automatic.
    pitfalls: >
      Treating "probability $1$ of eventual profit" as license to size a real, finite bankroll against the strategy — that is exactly the setup gambler's ruin analyzes, and the guarantee can fail there. Confusing "fair" ($\mathbb{E}[S_n]=0$ at each fixed time) with "protected from large excursions" — both extreme luck and its opposite are fully compatible with fairness.
    recap: >
      Probability-$1$ profit with infinite expected waiting time and unbounded drawdown along the way — the reason "certain to win eventually" is not by itself a strategy.
    steps:
      - teach: >
          "You're certain to end up ahead eventually" is technically true and
          practically useless as a plan — this node is where interviewers test
          whether you can hold "certain," "fair," and "unbounded" as true at
          once without contradiction.
      - teach: >
          Three facts sit together. At every fixed $n$, $\mathbb{E}[S_n]=0$ —
          the game is fair moment to moment. First return's telescoping
          argument extends to any target level: the walk reaches $+a$ with
          probability $1$ for the same reason it returns to $0$ with
          probability $1$.
      - teach: >
          Yet $T_a$ is a sum of $a$ independent copies of $T_1$, and $T_1$
          already has infinite mean, so $\mathbb{E}[T_a]=\infty$ for every $a$
          — adding more infinite-mean pieces cannot produce a finite sum.
      - ask: >
          What is $\mathbb{E}[T_5]$, the expected time to first reach $+5$?
        choices:
          - text: >
              Infinite
            correct: true
            feedback: >
              Right — $T_5$ is a sum of five copies of $T_1$, and $T_1$ already
              has infinite mean, so the sum is infinite too.
          - text: >
              $5\,\mathbb{E}[T_1]$, a large but finite number
            feedback: >
              $\mathbb{E}[T_1]$ is itself infinite, so five times it is not a
              large finite number — it stays infinite.
          - text: >
              Can't be determined without simulation
            feedback: >
              The decomposition into independent one-level waits, combined with
              the known $n^{-3/2}$ tail of $T_1$, settles this directly.
        feedback: >
          Summing $a$ infinite-mean pieces always gives infinite mean, whatever
          $a$ is.
      - ask: >
          By the return-to-origin tail, $\Pr(T_1>N)\sim1/\sqrt{\pi N/2}$. What
          is this estimate at $N=250{,}000$, to four decimals?
        expects: "0.0016"
        tolerance: 0.0005
        hint: >
          Plug $N=250{,}000$ directly into $1/\sqrt{\pi N/2}$.
        feedback: >
          $1/\sqrt{\pi(250{,}000)/2}=1/\sqrt{392{,}699}\approx0.0016$ — small
          on any given day, and yet this same $n^{-1/2}$ tail is exactly what
          makes the average wait across all outcomes infinite.
      - teach: >
          The "sure win" is bought with unbounded time and unbounded drawdown
          along the way, and taking away either assumption destroys it: capping
          the bankroll turns the problem into gambler's ruin, where the
          guarantee can genuinely fail. Risk limits are therefore written in
          capital and time directly, never in "the probability of loss is
          already small" — that probability can already be exactly the value
          you want and still describe an unworkable plan.
      - ask: >
          A trader adopts "hold until $100$ ahead," but with an actual finite
          bankroll of $50$. What happens to the probability-$1$ guarantee?
        choices:
          - text: >
              It can now fail — this becomes a gambler's-ruin problem, where
              ruin before reaching $+100$ is a real possibility
            correct: true
            feedback: >
              Right — a finite bankroll is exactly the extra assumption
              gambler's ruin adds, and it breaks the probability-$1$ guarantee.
          - text: >
              Nothing changes; probability $1$ still holds regardless of
              bankroll
            feedback: >
              The probability-$1$ proof relies on unbounded capital to survive
              the drawdown along the way — a real, finite bankroll removes
              exactly that assumption.
          - text: >
              The guarantee becomes probability $0$ instead
            feedback: >
              It becomes some probability strictly between $0$ and $1$ (the
              gambler's-ruin formula), not $0$ outright.
        feedback: >
          Removing the unbounded-bankroll assumption is precisely what turns a
          probability-$1$ plan into a gambler's-ruin problem with a real chance
          of failure.
      - teach: >
          Treating "probability $1$ of eventual profit" as license to size a
          real, finite bankroll against the strategy is exactly the setup
          gambler's ruin analyzes — the guarantee is not automatic there. And
          "fair" ($\mathbb{E}[S_n]=0$ at each fixed time) is not the same claim
          as "protected from large excursions": both extreme luck and its
          opposite are fully compatible with fairness.
      - teach: >
          Probability-$1$ profit with infinite expected waiting time and
          unbounded drawdown along the way — the reason "certain to win
          eventually" is not by itself a strategy.
