unit: quant-statistics.bayesian
opening: >
  Bayesian inference treats an unknown parameter as a random variable and
  updates a prior into a posterior every time data arrives — one mechanical
  move underneath every technique in this unit. The arc runs from the raw
  definitions (parameter as random, likelihood, the prior-times-likelihood
  update, and its odds form) through the machinery that makes updating
  tractable in closed form (conjugate families, the beta-binomial and
  normal-normal pairs, and the pseudo-count arithmetic they reduce to) to the
  judgment calls a working Bayesian has to make (the rule of succession,
  shrinkage, choosing and stress-testing a prior, and reading a credible
  interval correctly). It sits right after conditional probability and Bayes'
  theorem in the probability tree, and the frequentist machinery this unit's
  methods get measured against comes later.
lessons:
  - node: quant-statistics.bayesian.parameter-as-random
    hook: >
      The instant an interviewer asks "what's your prior on X," they've
      already committed you to treating an unknown constant as though it had
      a distribution — refusing that framing costs you the rest of the
      conversation.
    explanation: >
      Bayes' theorem, which you already have for two events, reverses
      conditioning: it turns $\Pr(A \mid B)$ into a rearrangement of
      $\Pr(B \mid A)$. The Bayesian stance applies the same idea to a
      parameter $\theta$ instead of an event $B$ — you choose to write
      $\pi(\theta)$, a density over the parameter space, playing the role
      $\Pr(B)$ played before. Nothing about the algebra changes; what changes
      is your willingness to put a distribution on something that used to be
      treated as a fixed constant.

      The consequence is that probability stops meaning "long-run frequency
      of a repeatable procedure" and starts meaning "degree of belief given
      what's currently known." A frequentist can say a procedure covers the
      true, fixed parameter 95% of the time across repeated experiments, but
      never that $\theta$ itself, once fixed, has a 95% chance of lying in a
      particular interval — that sentence requires $\theta$ to be random,
      which only the Bayesian stance grants.

      Practically, "what's your prior" is a request for two numbers: a
      centre you'd actually bet on, and a spread describing how sure you are.
      Both must define a genuine density over the whole parameter space — a
      shape on $[0,1]$ for a probability, a shape on the real line for an
      unbounded quantity — not a single point guess.
    worked: >
      You're pricing a new checkout flow's conversion rate $p$ before any
      data exists. As a frequentist you can only say $p$ is some fixed
      unknown number the flow either does or doesn't have. As a Bayesian you
      commit to a density — say one that puts 90% of its mass between 0.03
      and 0.07, centred near 0.05 — so $\Pr(0.03 \le p \le 0.07) = 0.9$
      becomes a legitimate statement about the parameter itself, not about a
      sampling procedure you haven't run yet.
    interview: >
      "What's your prior on X" or "how confident are you before seeing any
      data" checks whether you answer with a distribution — a centre and a
      spread — rather than a single point guess or a refusal to commit; a
      strong answer also states what evidence would move you off it.
    pitfalls: >
      Answering "what's your prior" with a single number instead of a
      centre-and-spread pair leaves the density unspecified. Treating
      $\Pr(\theta \in [a,b])$ as a claim about repeated trials, rather than
      about belief, undoes the entire framework in the next breath.
    recap: >
      The Bayesian move is putting a genuine density on the unknown parameter
      itself, which turns "degree of belief" into a legitimate probability
      statement no frequentist procedure can make about a fixed parameter.
    dialogue:
      - part: A coin pulled from a jar
        teach: >
          A jar holds ten coins. Seven are fair; three are weighted to land
          heads with probability $0.9$. You pull one out without looking at
          it, and call its heads-probability $\theta$. Before any toss,
          $\theta$ is either $0.5$ or $0.9$, and you do not know which.
      - ask: >
          What probability do you put on $\theta = 0.9$?
        expects: "3/10"
        feedback: >
          Three of the ten coins are weighted, and every coin was equally
          likely to be drawn, so $\Pr(\theta = 0.9) = 3/10$. That is a
          probability *about the coin's bias*, not about a toss.
      - ask: >
          What is the probability that the first toss of your coin lands
          heads?
        expects: "0.62"
        hint: >
          Split on which kind of coin you are holding.
        feedback: >
          By total probability, $0.7 \cdot 0.5 + 0.3 \cdot 0.9 = 0.35 + 0.27
          = 0.62$. The answer averages the toss probability over your
          uncertainty about $\theta$.
      - ask: >
          The toss lands heads. What probability do you now put on
          $\theta = 0.9$?
        expects: "27/62"
        hint: >
          Bayes' rule: the heads-and-weighted path over all heads paths.
        feedback: >
          $\Pr(\theta = 0.9 \mid H) = 0.27/0.62 = 27/62 \approx 0.435$, up
          from $0.3$. One toss moved your belief about the bias.
      - ask: >
          A colleague objects: "The coin in your hand has one definite bias.
          Saying it is $0.9$ with probability $27/62$ is meaningless." What
          is the right reply?
        choices:
          - text: >
              He is right: once the coin is drawn, the only honest
              probabilities for $\theta = 0.9$ are $0$ and $1$.
            feedback: >
              By that standard a face-down card already dealt has no
              probability of being an ace either. Its identity is fixed; your
              information about it is not, and that is what the number
              describes.
          - text: >
              The number is fine, but it should still be $3/10$: a toss
              cannot change the coin's bias.
            feedback: >
              The bias did not change, and nobody said it did. Your
              information changed: heads is more likely under $0.9$ than under
              $0.5$, so the heads you saw is evidence, and $27/62$ is what
              Bayes' rule makes of it.
          - text: >
              $27/62$ measures what you know: it is the price at which you
              would be indifferent to a bet that the coin is weighted.
            correct: true
            feedback: >
              The bias is fixed; your knowledge of it is not. A probability on
              $\theta$ is a statement about belief given the evidence, and it
              moves when the evidence does.
        feedback: >
          You have just treated an unknown constant as a random variable and
          updated it with Bayes' rule. The jar made that easy, because it
          handed you the starting distribution.

      - part: No jar this time
        reflect: >
          A stranger takes a coin from his pocket. There is no jar and no
          count of coin types. An interviewer asks: "what is the probability
          its bias is above $0.6$?" What did the jar supply that you now have
          to supply yourself, and is the question still a legitimate one?
        hint: >
          Before the first toss, what were you averaging over?
        answer: >
          The jar supplied a distribution for $\theta$ before any data. With
          no jar you supply it yourself, as a statement of belief: most
          pocket coins are close to fair, so you would put most of the mass
          near $0.5$ with a small spread. The question is legitimate once
          probability is read as degree of belief. Read as a long-run
          frequency, it is not, since $\theta$ is one fixed number and
          nothing about it repeats.
      - teach: >
          That is the Bayesian stance. The unknown parameter $\theta$ is
          treated as a random variable, and the prior $\pi(\theta)$ is the
          distribution you hold before seeing data. The jar was a prior handed
          to you; the stranger's coin needs one you choose. Either way it must
          be a genuine distribution on the parameter space: nonnegative,
          total mass $1$, and no mass on values $\theta$ cannot take.
      - ask: >
          For the stranger's coin, four colleagues propose priors on
          $\theta \in [0, 1]$. Which one is a genuine prior?
        choices:
          - text: >
              $\theta = 0.5$ exactly.
            feedback: >
              That is a point, not a spread: it says you are certain. By Bayes'
              rule any value with prior probability $0$ keeps probability $0$,
              so a thousand heads in a row could not move you off $0.5$.
          - text: >
              Density $2$ on $[0, 1]$.
            feedback: >
              Its total mass is $2 \cdot 1 = 2$, not $1$. A shape can be
              rescaled into a prior, but as written it claims every bias is
              twice as likely as anything can be.
          - text: >
              Density $6\theta(1 - \theta)$ on $[0, 1]$.
            correct: true
            feedback: >
              Nonnegative on $[0, 1]$, and $\int_0^1 6\theta(1-\theta)\,d\theta
              = 3 - 2 = 1$. It peaks at $0.5$ and thins toward the ends: a
              centre and a spread.
          - text: >
              Uniform on $[-0.5, 1.5]$.
            feedback: >
              It integrates to $1$, but half its mass sits on biases below
              $0$ or above $1$, which no coin has. A prior lives on the
              parameter space and nowhere else.
        feedback: >
          A prior is a full distribution over the values the parameter can
          take. A single number, a shape that does not total $1$, and mass on
          impossible values each fail one requirement.
      - ask: >
          Under the prior $6\theta(1 - \theta)$, what is the probability that
          the stranger's coin has bias above $0.6$?
        expects: "0.352"
        hint: >
          An antiderivative of $6\theta - 6\theta^{2}$ is $3\theta^{2} -
          2\theta^{3}$.
        feedback: >
          $[3\theta^{2} - 2\theta^{3}]_{0.6}^{1} = 1 - (1.08 - 0.432) = 1 -
          0.648 = 0.352$. That is exactly the question the interviewer asked,
          and under the Bayesian stance it has a number for an answer.

      - part: Two sentences that look alike
        ask: >
          An analyst reports a frequentist $90\%$ confidence interval
          $(0.18, 0.26)$ for a strategy's true hit rate. Which sentence may she
          make about it?
        choices:
          - text: >
              There is a $90\%$ chance the true hit rate lies in
              $(0.18, 0.26)$.
            feedback: >
              That puts a probability on the hit rate itself, which requires
              a distribution over it — a prior, and a Bayesian update. Her
              procedure never had one.
          - text: >
              $90\%$ of the intervals her procedure would build, over repeated
              samples, contain the true hit rate.
            correct: true
            feedback: >
              In the frequentist reading the rate is fixed and the interval is
              random, so the $90\%$ belongs to the procedure.
          - text: >
              The true hit rate is $0.22$ with probability $90\%$.
            feedback: >
              No continuous distribution puts $90\%$ on a single point, and
              the frequentist reading puts no probability on the rate at all.
        feedback: >
          Only the Bayesian stance lets a probability sentence have the
          parameter as its subject. The frequentist sentence is about the
          method that produced the interval.
      - ask: >
          An interviewer asks for your prior on a new analyst's hit rate on
          directional calls. You answer "$0.55$". What is missing?
        choices:
          - text: >
              Nothing: a prior is a best guess, and $0.55$ is yours.
            feedback: >
              A best guess fixes a centre and nothing else. A prior of
              "$0.55$ give or take $0.02$" and one of "$0.55$ give or take
              $0.2$" react to ten calls in completely different ways.
          - text: >
              A justification from data, since a prior must come from past
              frequencies.
            feedback: >
              A prior may draw on past data, but it does not have to: it is a
              statement of belief. The stranger's coin had no data at all.
          - text: >
              A spread: how sure you are about $0.55$.
            correct: true
            feedback: >
              A prior is a distribution, so it needs a centre and a width. The
              width decides how far the first few calls will move you.
        feedback: >
          "What's your prior" asks for a shape, said in two numbers: where you
          centre it and how tightly. Said aloud: "around $0.55$, and I would
          be surprised by anything outside $0.45$ to $0.65$."

  - node: quant-statistics.bayesian.likelihood
    hook: >
      The likelihood is the one object every formula in this unit multiplies
      against a prior, and mistaking it for a distribution over $\theta$ —
      expecting it to integrate to 1 — breaks every calculation built on top
      of it.
    explanation: >
      Start from the sampling model $p(x \mid \theta)$, the ordinary
      conditional density of the data given the parameter — the same formula
      you'd use to simulate data forward if $\theta$ were known. The
      likelihood function is that identical formula, $L(\theta) = p(x \mid
      \theta)$, but read with the observed data $x$ held fixed and $\theta$
      left free to vary.

      Because it's a function of $\theta$ for one fixed dataset, nothing
      requires it to sum or integrate to 1 over $\theta$ — it's a shape, not
      a probability distribution, and asking "what's the probability that
      $\theta$ equals this value under the likelihood" is a category error
      the notation invites but the definition forbids.

      That freedom is what makes likelihoods easy to work with: any factor
      that doesn't involve $\theta$ can be dropped, since posterior
      comparisons only ever care about the shape as $\theta$ varies, not the
      overall scale. Conditionally independent observations multiply their
      likelihoods, so log-likelihoods add — the chain rule applied one data
      point at a time.
    worked: >
      Flip a coin of unknown bias $p$ five times and see 3 heads, 2 tails.
      The full sampling probability is $\binom{5}{3}p^{3}(1-p)^{2}$, but
      $\binom{5}{3}=10$ doesn't involve $p$, so the likelihood kernel is
      $L(p) = p^{3}(1-p)^{2}$. Compare two candidate biases: $L(0.5) = 0.125
      \times 0.25 = 0.03125$ and $L(0.7) = 0.343 \times 0.09 = 0.03087$ —
      nearly tied, and neither number means anything standalone; only their
      ratio, about 1.012, carries information about which bias the data
      favors.
    interview: >
      "Write down the likelihood for this data" checks two things: that you
      condition on $\theta$ with the data fixed, not the reverse, and that
      you immediately strip the $\theta$-free normalizing constant rather
      than carrying it through unnecessary algebra.
    pitfalls: >
      Treating $L(\theta)$ as though it must integrate to 1 over $\theta$,
      then trying to normalize it before combining with a prior, doubles up a
      step Bayes' theorem already handles. Carrying a $\theta$-free constant
      like $\binom{n}{k}$ through the whole derivation instead of dropping it
      early wastes algebra without changing any conclusion.
    recap: >
      The likelihood is the sampling model read as a function of the
      parameter with the data fixed — a shape you compare by ratio, not a
      distribution, and any $\theta$-free factor is dead weight to drop
      immediately.
    dialogue:
      - part: Three heads in four tosses
        teach: >
          A coin of unknown bias $\theta$ is tossed four times and shows three
          heads and one tail. You are weighing two candidates: a fair coin,
          $\theta = 0.5$, and a weighted one, $\theta = 0.75$.
      - ask: >
          If $\theta = 0.5$, what is the probability of exactly three heads in
          four tosses?
        expects: "1/4"
        feedback: >
          $\binom{4}{3}(0.5)^{3}(0.5) = 4/16 = 1/4$.
      - ask: >
          If $\theta = 0.75$, what is the probability of the same result?
        expects: "27/64"
        tolerance: 0.0005
        feedback: >
          $\binom{4}{3}(0.75)^{3}(0.25) = 4 \cdot \frac{27}{64} \cdot
          \frac{1}{4} = 27/64 \approx 0.422$.
      - ask: >
          By what factor is the observed result more probable under
          $\theta = 0.75$ than under $\theta = 0.5$?
        expects: "27/16"
        tolerance: 0.0005
        feedback: >
          $(27/64)/(1/4) = 27/16 = 1.6875$. The data favour the weighted coin
          by a factor of about $1.7$: real, but mild.

      - part: A function that is not a distribution
        teach: >
          You have been evaluating one formula, $4\theta^{3}(1 - \theta)$, at
          two values of $\theta$ while the data stayed fixed at three heads in
          four. Nothing stops you from evaluating it at every $\theta$ in
          $[0, 1]$.
      - ask: >
          What is $\int_0^1 4\theta^{3}(1 - \theta)\,d\theta$?
        expects: "1/5"
        hint: >
          Expand to $4\theta^{3} - 4\theta^{4}$ and integrate term by term.
        feedback: >
          $4\left(\frac{1}{4} - \frac{1}{5}\right) = 4 \cdot \frac{1}{20} =
          1/5$.
      - ask: >
          What does the total of $1/5$ tell you?
        choices:
          - text: >
              An arithmetic slip somewhere: any probability formula must total
              $1$.
            feedback: >
              It does total $1$ — summed over the five possible head counts
              with $\theta$ held fixed. Integrated over $\theta$ with the
              data held fixed, there is no reason it should.
          - text: >
              Read as a function of $\theta$, the formula is not a probability
              distribution over $\theta$.
            correct: true
            feedback: >
              It is a distribution over the data for each fixed $\theta$. Turn
              it around — data fixed, $\theta$ varying — and it is just a
              curve, whose area means nothing in particular.
          - text: >
              The probability that $\theta$ lies in $[0, 1]$ is $1/5$.
            feedback: >
              $\theta$ lies in $[0, 1]$ for certain. Reading the area as a
              probability about $\theta$ is exactly the confusion to avoid:
              no distribution on $\theta$ has entered yet.
        feedback: >
          The same formula answers two different questions. Over outcomes, with
          $\theta$ fixed, it is a distribution. Over $\theta$, with the data
          fixed, it is a curve whose only use is comparing heights.
      - reflect: >
          Suppose you had written down the exact sequence, heads, heads, tail,
          heads, instead of just the count. How would the two probabilities
          change, and how would the factor of $27/16$ change? What does that
          say about the leading $4$?
        hint: >
          How many sequences have three heads, and does that number depend on
          $\theta$?
        answer: >
          The probability of one specific sequence is $\theta^{3}(1 - \theta)$,
          so each value loses the factor $4$: $1/16$ and $27/256$. The ratio is
          still $27/16$. The $4$ counts orderings and does not involve
          $\theta$, so it scales every candidate equally and never changes a
          comparison. Any such factor can be thrown away.
      - teach: >
          That curve has a name. The likelihood is the sampling model read
          backwards: $L(\theta) = p(x \mid \theta)$ with the data $x$ fixed and
          $\theta$ free. It is compared by ratios, never by area, and any factor
          free of $\theta$ may be dropped. What is left for $k$ heads in $n$
          tosses is the kernel $\theta^{k}(1 - \theta)^{n - k}$.

      - part: What you keep and what you drop
        ask: >
          A die is rolled five times and shows a six on exactly two of them.
          With $\theta$ the probability of a six, which is a likelihood for
          $\theta$?
        choices:
          - text: >
              $(1/6)^{2}(5/6)^{3}$
            feedback: >
              That is one number: the likelihood evaluated at a fair die,
              $\theta = 1/6$. The likelihood is the whole function of
              $\theta$, so that you can compare a fair die with a loaded one.
          - text: >
              $\theta^{2}$
            feedback: >
              The three rolls that were not sixes are data too. Each has
              probability $1 - \theta$, and that factor depends on $\theta$,
              so it stays.
          - text: >
              $\theta^{2}(1 - \theta)^{3}$
            correct: true
            feedback: >
              The full sampling probability is $\binom{5}{2}\theta^{2}(1 -
              \theta)^{3}$; dropping the $10$, which is free of $\theta$, leaves
              the kernel.
        feedback: >
          Drop what does not involve $\theta$; keep every factor that does,
          including the ones from the failures.
      - ask: >
          Back to the coin. Two more tosses, independent of the first four,
          give one head and one tail. Using all six tosses, by what factor do
          the data now favour $\theta = 0.75$ over $\theta = 0.5$?
        expects: "81/64"
        tolerance: 0.0005
        hint: >
          Independent batches multiply their likelihoods, so their ratios
          multiply too.
        feedback: >
          The new pair contributes $(0.75 \cdot 0.25)/(0.5 \cdot 0.5) = 3/4$,
          so the total is $\frac{27}{16} \cdot \frac{3}{4} = 81/64 \approx
          1.27$. Directly: the kernel is now $\theta^{4}(1 - \theta)^{2}$, and
          $(0.75^{4} \cdot 0.25^{2})/0.5^{6} = 81/64$. On the log scale the two
          batches simply add.

      - part: Reading the shape aloud
        ask: >
          After the six tosses, a colleague says: "$L(0.75)$ is bigger than
          $L(0.5)$, so the probability that the coin is weighted is higher than
          the probability that it is fair." What is wrong?
        choices:
          - text: >
              Nothing: the larger likelihood always means the more probable
              value.
            feedback: >
              If nineteen coins in twenty from this source are fair, a factor
              of $81/64$ in the data does not overturn that. The likelihood
              compares how well each value explains the data; it does not
              weigh how plausible each value was to begin with.
          - text: >
              He compared likelihoods without first normalising them to
              integrate to $1$.
            feedback: >
              Normalising divides both values by the same constant, so the
              comparison is unchanged. The problem is not the scale.
          - text: >
              $L$ gives the probability of the data under each $\theta$, not
              the probability of each $\theta$; that also needs a prior.
            correct: true
            feedback: >
              The likelihood says the six tosses are about $1.27$ times as
              likely under the weighted coin. Turning that into a probability
              that the coin is weighted takes Bayes' rule, and Bayes' rule
              needs a prior.
        feedback: >
          The likelihood is the evidence, not the verdict. Asked to write it
          down in an interview, say "the probability of the data as a function
          of the parameter, constants dropped", and write the kernel.

  - node: quant-statistics.bayesian.posterior
    hook: >
      This is the one line that does the actual work of every Bayesian
      calculation in this unit — everything after it is recognizing which
      named family the product of prior and likelihood collapses into.
    explanation: >
      Bayes' theorem restates a familiar fact: multiply prior by likelihood,
      divide by whatever constant makes the result integrate to 1. The
      marginal likelihood $p(x) = \int p(x \mid \theta)\pi(\theta)\,d\theta$
      is exactly that constant — it doesn't depend on $\theta$, so it can
      never distinguish one $\theta$ from another, and dropping it turns an
      equality into the proportionality $\pi(\theta \mid x) \propto
      \pi(\theta)L(\theta)$.

      The five-step recipe compresses to arithmetic: state the prior, write
      the likelihood kernel, multiply and collect powers of $\theta$,
      recognize the result as a named density (reading its normalizer off a
      table instead of integrating), then report the posterior mean and
      spread — the actual answer to nearly every Bayesian interview question.
      Steps three and four are where the real work happens.

      When no named family fits, or the parameter space is a small finite
      list of hypotheses rather than a continuum, step four collapses to
      literally summing the unnormalized weights and dividing — the discrete
      case of the same recipe, no integral required either way.
    worked: >
      A batch of parts comes from one of two machines, equally likely a
      priori: machine A produces defects at rate 0.1, machine B at rate 0.4.
      Inspect one part and find it defective. Prior times likelihood:
      machine A scores $0.5 \times 0.1 = 0.05$, machine B scores $0.5 \times
      0.4 = 0.2$. These sum to 0.25 — no named family needed, just add the
      two numbers — so the posterior is $0.05/0.25 = 0.2$ on machine A and
      $0.2/0.25 = 0.8$ on machine B.
    interview: >
      "Update this prior on the following data" wants the five-step recipe
      stated out loud — prior times likelihood, normalize — and the
      interviewer listens for whether you recognize a named posterior family
      instead of setting up an integral you don't need to solve.
    pitfalls: >
      Actually computing $\int p(x\mid\theta)\pi(\theta)\,d\theta$ by hand
      when the posterior shape is already recognizable wastes time the
      interview doesn't give you. Reporting the unnormalized product
      $\pi(\theta)L(\theta)$ as the posterior, forgetting the final
      normalization, gives numbers that don't sum or integrate to 1.
    recap: >
      Posterior is proportional to prior times likelihood, with the marginal
      likelihood as a $\theta$-free normalizing constant computed last, by
      recognizing a named shape or, in the discrete case, by summing.
    dialogue:
      - part: An urn with an unknown count
        teach: >
          An urn holds three balls, each red or blue. You do not know how many
          are red, and you give each count $0$, $1$, $2$, $3$ prior probability
          $1/4$. You draw a ball, note its colour, put it back, and draw again.
          Both draws are red.
      - ask: >
          If the urn holds exactly two red balls, what is the probability of
          two reds in two draws?
        expects: "4/9"
        feedback: >
          Each draw is red with probability $2/3$, independently because the
          ball goes back: $(2/3)^{2} = 4/9$.
      - ask: >
          What is the posterior probability that all three balls are red?
        expects: "9/14"
        tolerance: 0.0005
        hint: >
          For each count, multiply its prior by the chance of two reds, then
          divide by the total.
        feedback: >
          Prior times likelihood for $0, 1, 2, 3$ red: $\frac{1}{4} \cdot 0$,
          $\frac{1}{4} \cdot \frac{1}{9}$, $\frac{1}{4} \cdot \frac{4}{9}$,
          $\frac{1}{4} \cdot 1$. Those are $0, \frac{1}{36}, \frac{4}{36},
          \frac{9}{36}$, totalling $\frac{14}{36} = \frac{7}{18}$. So
          $\Pr(3 \text{ red} \mid \text{data}) = \frac{9/36}{14/36} = 9/14$.
      - ask: >
          What role did the total $7/18$ play in that calculation?
        choices:
          - text: >
              It is the probability that the urn holds three red balls.
            feedback: >
              That was $9/14$. The $7/18$ is the probability of the data, two
              reds, averaged over all four counts.
          - text: >
              It is one divisor shared by all four counts: it rescales the
              products so they add to $1$, and changes no comparison.
            correct: true
            feedback: >
              The posterior odds of three red against two red are $9 : 4$
              before you divide and after. All the information about the count
              was already in the products.
          - text: >
              It is the likelihood of the three-red hypothesis.
            feedback: >
              That likelihood is $1$: an all-red urn gives two reds for sure.
              The $7/18$ is not attached to any one hypothesis.
        feedback: >
          The denominator in Bayes' rule is the same for every hypothesis. Its
          only job is to make the posterior total $1$.

      - part: When the list of hypotheses is a continuum
        teach: >
          Replace the urn by a coin with heads-probability $\theta$ and a
          uniform prior on $[0, 1]$, and toss it twice: two heads. Prior times
          likelihood is $1 \cdot \theta^{2}$ at every $\theta$. Dividing by the
          total now means dividing by $\int_0^1 \theta^{2}\,d\theta$, and for
          most priors and data that integral is not one you want to do in an
          interview.
      - reflect: >
          Could you get the posterior density without ever computing the
          denominator? What do you know about the posterior that pins down the
          constant in front of $\theta^{2}$?
        hint: >
          The posterior is a density on $[0, 1]$.
        answer: >
          The posterior must be $c\,\theta^{2}$ for some constant $c$, because
          the denominator is free of $\theta$. It must also integrate to $1$,
          which fixes $c$ — and if you recognise $\theta^{2}$ as the shape of
          a density you already know, you can read $c$ off its formula. Here
          $c = 3$. You never need the marginal probability of the data as a
          separate number.
      - teach: >
          That is the update in its working form: $\pi(\theta \mid x) \propto
          \pi(\theta)\,L(\theta)$. The recipe is mechanical: state the prior,
          write the likelihood kernel, multiply and collect powers, recognise
          the shape and read off its normalising constant, then report the
          posterior mean and spread. The urn ran the same recipe, with
          "recognise" replaced by "add four numbers".

      - part: The recipe, one step at a time
        ask: >
          A new coin has prior density $2\theta$ on $[0, 1]$: you lean towards
          heads. It shows two heads and a tail in three tosses. The posterior
          is proportional to $\theta^{a}(1 - \theta)^{b}$. What is $a$?
        expects: "3"
        hint: >
          The likelihood kernel is $\theta^{2}(1 - \theta)$; multiply by the
          prior and drop constants.
        feedback: >
          $2\theta \cdot \theta^{2}(1 - \theta) \propto \theta^{3}(1 -
          \theta)$, so $a = 3$ and $b = 1$. One power of $\theta$ came from the
          prior, two from the heads.
      - ask: >
          The posterior is $c\,\theta^{3}(1 - \theta)$. What is $c$?
        expects: "20"
        hint: >
          Either integrate $\theta^{3} - \theta^{4}$ over $[0, 1]$, or
          recognise a Beta density.
        feedback: >
          $\int_0^1 (\theta^{3} - \theta^{4})\,d\theta = \frac{1}{4} -
          \frac{1}{5} = \frac{1}{20}$, so $c = 20$. Recognised instead:
          $\theta^{3}(1 - \theta)$ is the $\mathrm{Beta}(4, 2)$ kernel, whose
          constant is $\frac{5!}{3!\,1!} = 20$.
      - ask: >
          What is the posterior mean of $\theta$?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          $\int_0^1 20\,\theta \cdot \theta^{3}(1 - \theta)\,d\theta$, or the
          mean of $\mathrm{Beta}(4, 2)$.
        feedback: >
          $20\left(\frac{1}{5} - \frac{1}{6}\right) = \frac{20}{30} = 2/3$,
          which is also $4/(4 + 2)$, the Beta mean. Step five is the number
          the interviewer actually wanted.
      - ask: >
          At which $\theta$ is the posterior density highest?
        expects: "3/4"
        tolerance: 0.0005
        hint: >
          Differentiate $\theta^{3}(1 - \theta)$; the constant does not move
          the peak.
        feedback: >
          $\frac{d}{d\theta}(\theta^{3} - \theta^{4}) = 3\theta^{2} -
          4\theta^{3} = 0$ at $\theta = 3/4$. The peak and the mean differ
          because the posterior is skewed; finding the peak never needed $c$.

      - part: Where the shortcut goes wrong
        ask: >
          A colleague takes the same data and prior, first rescales the
          likelihood $\theta^{2}(1 - \theta)$ so it integrates to $1$, then
          multiplies by the prior $2\theta$ and reports the product as the
          posterior density. What is wrong?
        choices:
          - text: >
              Nothing: both factors are now densities, so their product is
              one.
            feedback: >
              A product of two densities is not a density. Here the
              rescaled likelihood is $12\theta^{2}(1 - \theta)$, and the
              product $24\theta^{3}(1 - \theta)$ integrates to $24/20 = 1.2$.
          - text: >
              Rescaling the likelihood changed its shape, so the posterior
              comes out wrong.
            feedback: >
              Multiplying by a constant changes height, not shape. The product
              is proportional to the right posterior; it is just not scaled
              correctly.
          - text: >
              The shape is right, but the product still has to be normalised;
              as reported it integrates to $1.2$.
            correct: true
            feedback: >
              Normalising the likelihood was wasted effort. The one
              normalisation that matters comes last, on the product, and
              recognising $\theta^{3}(1 - \theta)$ as $\mathrm{Beta}(4, 2)$
              does it for free.
        feedback: >
          Constants can be dropped anywhere along the way and restored once,
          at the end. Said aloud: "posterior is prior times likelihood, I
          collect powers, recognise the family and read off its mean."

  - node: quant-statistics.bayesian.posterior-odds
    hook: >
      Running a live update in your head — after a trade, a tell, a
      confirming signal — means never touching the normalizing constant at
      all, and the odds form is why that's possible.
    explanation: >
      You already have Bayes' theorem in odds form for two plain events;
      nothing changes when the "events" being compared are hypotheses about a
      parameter. Write posterior-probability Bayes for $H_1$ and separately
      for $H_0$, divide one by the other, and the shared marginal likelihood
      in both denominators cancels exactly, leaving posterior odds equal to
      prior odds times a likelihood ratio.

      That cancellation is the whole appeal: no integral, no normalizing
      constant, ever needs computing. Multiple independent pieces of evidence
      chain by multiplying their likelihood ratios in, and because
      multiplying positive numbers is addition after a log, taking logs turns
      a run of evidence into a running additive score — the only form of
      Bayesian updating that's practical to do without paper.

      Converting back to a probability at the end is one line, $p = O/(1+O)$
      for odds $O$ written as a single ratio; skip it only if the question
      explicitly wants odds.
    worked: >
      Prior odds are 2 to 3 that a trading signal is genuinely predictive
      rather than noise. If predictive, it calls the next day's direction
      correctly with probability 0.7; if noise, with probability 0.5. It's
      right four days running. The likelihood ratio per correct call is
      $0.7/0.5 = 1.4$, so four calls compound to $1.4^{4} \approx 3.842$.
      Posterior odds are $2 \times 3.842 : 3 \approx 7.68:3$, about 2.56 to
      1, giving $\Pr(\text{predictive}) \approx 2.56/3.56 \approx 0.719$.
    interview: >
      "Prior odds are X to Y, each piece of evidence has likelihood ratio
      $r$ — what's the posterior after $n$ pieces" is answered instantly as
      $r^{n}$ times the prior odds, converted to a probability only if
      asked; the interviewer checks you never reach for the marginal
      likelihood.
    pitfalls: >
      Multiplying probabilities directly instead of odds reintroduces the
      normalizing constant the odds form exists to avoid. Applying $r^{n}$
      when the pieces of evidence aren't conditionally independent overstates
      the update — each factor assumes the others add genuinely new
      information.
    recap: >
      Posterior odds equal prior odds times the likelihood ratio, with
      repeated independent evidence compounding that ratio multiplicatively —
      the version of Bayes that needs no normalizing constant.
    dialogue:
      - part: A die that might be loaded
        teach: >
          A casino die is either fair or loaded. The loaded version shows a six
          half the time and each other face with probability $1/10$. Before
          any roll you think it is loaded with probability $1/5$. The first
          roll is a six.
      - ask: >
          What is the probability now that the die is loaded?
        expects: "3/7"
        tolerance: 0.0005
        hint: >
          Prior times probability of a six, for each kind of die, then divide
          by the total.
        feedback: >
          Loaded: $\frac{1}{5} \cdot \frac{1}{2} = \frac{1}{10}$. Fair:
          $\frac{4}{5} \cdot \frac{1}{6} = \frac{2}{15}$. So
          $\Pr(\text{loaded} \mid 6) = \frac{1/10}{1/10 + 2/15} =
          \frac{3}{3 + 4} = 3/7$.
      - ask: >
          The second roll is also a six. What is the probability now that the
          die is loaded?
        expects: "9/13"
        tolerance: 0.0005
        feedback: >
          Loaded: $\frac{1}{5} \cdot \frac{1}{4} = \frac{1}{20}$. Fair:
          $\frac{4}{5} \cdot \frac{1}{36} = \frac{1}{45}$. The ratio is
          $\frac{1/20}{1/45} = \frac{9}{4}$, so the probability is
          $\frac{9}{13}$. Another denominator, computed and thrown away.
      - ask: >
          Write each stage as odds, loaded to fair: $1 : 4$ before rolling,
          $3 : 4$ after one six, $9 : 4$ after two. What did each six do to the
          odds?
        choices:
          - text: >
              Each six added the same amount to the odds.
            feedback: >
              The first six added $\frac{2}{4}$ and the second added
              $\frac{6}{4}$. The steps grow, so the rule is not additive on
              this scale.
          - text: >
              Each six multiplied the odds by $3$.
            correct: true
            feedback: >
              $\frac{1}{4} \to \frac{3}{4} \to \frac{9}{4}$. The factor $3$ is
              $\frac{1/2}{1/6}$: how much more likely a six is under the loaded
              die than under the fair one.
          - text: >
              Each six multiplied the probability of loaded by the same
              factor.
            feedback: >
              $\frac{1}{5} \to \frac{3}{7}$ is a factor of $\frac{15}{7}$, and
              $\frac{3}{7} \to \frac{9}{13}$ is $\frac{21}{13}$. Probabilities
              cannot keep multiplying, since they stop at $1$; odds can.
        feedback: >
          On the odds scale, a six has a fixed price, independent of where you
          stood before it.
      - reflect: >
          Why is a six worth exactly a factor of $3$ in odds, wherever you
          started — and what happened to the denominators you computed twice?
        hint: >
          Write Bayes' rule for "loaded" and for "fair", then divide one by
          the other.
        answer: >
          Bayes' rule gives $\Pr(L \mid x) = \Pr(x \mid L)\Pr(L)/\Pr(x)$ and
          the same with $F$ in place of $L$. Divide, and the common
          $\Pr(x)$ cancels: the posterior odds are the prior odds times
          $\Pr(x \mid L)/\Pr(x \mid F)$. That ratio depends only on the
          observation and the two hypotheses, never on the prior, which is why
          each six is worth $3$ no matter what came before.

      - part: Prior odds times the Bayes factor
        teach: >
          That is the odds form of the update: $\frac{\Pr(H_1 \mid
          x)}{\Pr(H_0 \mid x)} = \frac{\Pr(H_1)}{\Pr(H_0)} \cdot \frac{p(x
          \mid H_1)}{p(x \mid H_0)}$. The second factor is the Bayes factor of
          the evidence. Conditionally independent observations multiply their
          Bayes factors, so on the log scale each one adds a fixed amount to
          the running score.
      - ask: >
          The third roll is a three. What is the Bayes factor of that roll,
          loaded against fair?
        expects: "3/5"
        hint: >
          How likely is a three under each die?
        feedback: >
          $\frac{1/10}{1/6} = \frac{6}{10} = 3/5$. A non-six is evidence
          *against* the loaded die, so its factor is below $1$.
      - ask: >
          After six, six, three, what is the probability that the die is
          loaded?
        expects: "27/47"
        tolerance: 0.0005
        feedback: >
          Odds: $\frac{1}{4} \cdot 3 \cdot 3 \cdot \frac{3}{5} =
          \frac{27}{20}$. Odds of $27 : 20$ are a probability of $\frac{27}{27
          + 20} = 27/47 \approx 0.574$. One multiplication per roll, one
          division at the end.

      - part: Keeping score in your head
        ask: >
          Starting again from prior odds $1 : 4$, you roll the die ten times.
          What is the smallest number of sixes among the ten that makes
          "loaded" more likely than "fair"?
        expects: "5"
        hint: >
          With $s$ sixes, the odds are $\frac{1}{4} \cdot 3^{s} \cdot
          (3/5)^{10 - s}$. Try values of $s$.
        feedback: >
          $s = 4$: $\frac{1}{4} \cdot 81 \cdot 0.6^{6} \approx \frac{1}{4} \cdot
          81 \cdot 0.0467 \approx 0.94$, just short. $s = 5$: $\frac{1}{4}
          \cdot 243 \cdot 0.6^{5} \approx \frac{1}{4} \cdot 243 \cdot 0.0778
          \approx 4.7$. So five sixes. Each six that replaces a non-six
          multiplies the odds by $3/(3/5) = 5$, which is why one roll swings it
          from $0.94$ to $4.7$.

      - part: When the factors are not independent
        ask: >
          A friend watches the same single roll on two camera feeds. Both show
          a six, and he multiplies the odds by $3$ for each feed. What is wrong?
        choices:
          - text: >
              Nothing: two observations, two factors of $3$.
            feedback: >
              Given the die's type, the second feed is not a new draw: it
              shows a six with probability $1$ once the first feed does. Its
              Bayes factor is $1/1 = 1$.
          - text: >
              The second feed is the same evidence seen twice; given the die,
              it is not independent of the first, so it adds a factor of $1$.
            correct: true
            feedback: >
              Multiplying Bayes factors assumes each observation is
              conditionally independent of the rest given the hypothesis. A
              copy of an observation fails that, and multiplying anyway
              turns a factor of $3$ into a factor of $9$.
          - text: >
              He should have added the two factors, $3 + 3 = 6$, rather than
              multiplied.
            feedback: >
              Adding is right for log-factors, not factors. Here the honest
              total factor is $3$, because there was only one roll.
        feedback: >
          The odds form is only as good as the independence behind it. Said
          aloud in an interview: "prior odds one to four, each six is a factor
          of three, each other face a factor of three-fifths — so after six,
          six, three I'm at twenty-seven to twenty."

  - node: quant-statistics.bayesian.sequential-updating
    hook: >
      Realizing you don't need to store the raw history, only the current
      posterior, is the moment Bayesian updating stops being a batch
      calculation and starts being a live one.
    explanation: >
      Bayes' theorem doesn't care how many observations you multiply into the
      likelihood at once. If $x_1$ and $x_2$ are conditionally independent
      given $\theta$, the batch posterior is proportional to $\pi(\theta)
      p(x_1 \mid \theta) p(x_2 \mid \theta)$ — and updating once on $x_1$,
      then feeding that result back in as the prior for $x_2$, multiplies in
      exactly the same two factors, just in two passes.

      Two things follow. The order the evidence arrives in doesn't matter,
      since the product is the same either way — only the final combination
      of factors decides the posterior. And the current posterior is a
      complete summary of everything observed so far: nothing about the raw
      data needs to be kept, because feeding the posterior forward as the
      next prior reproduces exactly what a full recomputation would give.

      This is the formal justification for revising a running belief one
      observation at a time rather than waiting to recompute from scratch —
      a quote gets revised after every fill, a model's confidence after every
      new signal, without ever reopening the earlier data.
    worked: >
      Two candidate machines, prior 50/50: A defects at rate 0.1, B at
      0.4. Inspect two parts, both defective. Batch: likelihoods $0.1^{2} =
      0.01$ and $0.4^{2} = 0.16$, giving posterior weights 0.005 and 0.08,
      which normalize to $\Pr(B) = 0.08/0.085 = 16/17 \approx 0.941$.
      Sequential: after the first defect, $\Pr(B) = 0.2/0.25 = 0.8$; feeding
      that in as the new prior for the second defect gives weights $0.2
      \times 0.1 = 0.02$ and $0.8 \times 0.4 = 0.32$, normalizing to
      $0.32/0.34 = 16/17$ — identical.
    interview: >
      "Do you need to see all the data at once, or can you update as it
      arrives" tests whether you can state that batch and sequential
      updating agree exactly under conditional independence, and that the
      running posterior alone is a sufficient summary.
    pitfalls: >
      Re-deriving the posterior from scratch every time a new observation
      arrives, instead of feeding the current posterior in as the next
      prior, is correct but wastes the entire point of the result. The
      equivalence requires conditional independence given $\theta$ — a
      repeated read from the same broken sensor breaks the clean
      multiplication.
    recap: >
      Updating on a batch of conditionally independent data at once, or one
      observation at a time with each posterior feeding forward as the next
      prior, gives exactly the same answer either way.
    dialogue:
      - part: Marbles, one draw at a time
        teach: >
          A bag holds four marbles. Either it is bag $W$, with three white and
          one black, or bag $B$, with one white and three black; you think each
          equally likely. You draw a marble, note its colour, put it back, and
          repeat. The draws come out white, white, black.
      - ask: >
          After the first draw, white, what is the probability that you hold
          bag $W$?
        expects: "3/4"
        feedback: >
          $\frac{1}{2} \cdot \frac{3}{4} = \frac{3}{8}$ against $\frac{1}{2}
          \cdot \frac{1}{4} = \frac{1}{8}$, so $\Pr(W) = \frac{3/8}{4/8} =
          3/4$.
      - ask: >
          Treat $3/4$ as your new starting belief. After the second draw,
          also white, what is the probability of bag $W$?
        expects: "9/10"
        feedback: >
          $\frac{3}{4} \cdot \frac{3}{4} = \frac{9}{16}$ against $\frac{1}{4}
          \cdot \frac{1}{4} = \frac{1}{16}$, so $\Pr(W) = 9/10$.
      - ask: >
          Starting from $9/10$, the third draw is black. What is the
          probability of bag $W$ now?
        expects: "3/4"
        feedback: >
          $\frac{9}{10} \cdot \frac{1}{4} = \frac{9}{40}$ against
          $\frac{1}{10} \cdot \frac{3}{4} = \frac{3}{40}$, so $\Pr(W) =
          \frac{9}{12} = 3/4$.

      - part: All at once
        ask: >
          Forget the running numbers. Start from the original $1/2$ and update
          on all three draws together. What is the probability of bag $W$?
        expects: "3/4"
        hint: >
          The probability of white, white, black under each bag is a product
          of three factors.
        feedback: >
          Bag $W$: $\frac{3}{4} \cdot \frac{3}{4} \cdot \frac{1}{4} =
          \frac{9}{64}$. Bag $B$: $\frac{1}{4} \cdot \frac{1}{4} \cdot
          \frac{3}{4} = \frac{3}{64}$. With equal priors, $\Pr(W) =
          \frac{9}{9 + 3} = 3/4$ — the same number the three small updates
          reached.
      - reflect: >
          Three updates in a row and one update on the batch gave the same
          answer. Was that luck with these numbers, or must it happen? Say why.
        hint: >
          Write the posterior after the first draw as "prior times one
          factor", then update it again.
        answer: >
          It must happen. After the first draw the posterior is proportional
          to $\pi(\theta)\,p(x_1 \mid \theta)$. Using it as the prior for the
          second draw multiplies in $p(x_2 \mid \theta)$, and so on. The
          sequential route ends at $\pi(\theta)\,p(x_1 \mid \theta)\,p(x_2
          \mid \theta)\,p(x_3 \mid \theta)$, which is exactly the batch
          product, because the draws are independent given the bag. The
          normalising at each stage only rescales.
      - teach: >
          Today's posterior is tomorrow's prior. When observations are
          conditionally independent given $\theta$, updating one at a time and
          updating on the whole batch give the same posterior, because both
          are proportional to the prior times the product of the individual
          likelihoods. A product does not care about the order of its factors.

      - part: What you need to remember
        ask: >
          A colleague saw the same three draws in the order black, white,
          white. Where does he end up?
        choices:
          - text: >
              Higher than $3/4$: his last two draws were white, and recent
              draws weigh most.
            feedback: >
              No draw weighs more for being recent. Each multiplies the same
              factor into the product, $3/4$ or $1/4$ under bag $W$, wherever
              it falls in the sequence.
          - text: >
              At $3/4$, the same as you.
            correct: true
            feedback: >
              His path runs $\frac{1}{2} \to \frac{1}{4} \to \frac{1}{2} \to
              \frac{3}{4}$. Different stops along the way, same product at the
              end.
          - text: >
              Lower than $3/4$: the black draw hit him first, when his belief
              was least committed, so it moved him further.
            feedback: >
              It moved him further at that moment, and the two whites then
              moved him further back. The black draw
              still contributes its factor of $1/4$ against $3/4$, and the
              product is the same.
        feedback: >
          The order in which conditionally independent evidence arrives is
          irrelevant: only which factors were multiplied in.
      - ask: >
          After two hundred draws you want to update on the next one. What is
          the least you must have kept?
        choices:
          - text: >
              The full sequence of two hundred colours, in order.
            feedback: >
              The order does not matter, so the sequence holds information you
              will never use. Everything the data says about the bag is
              already inside your current posterior.
          - text: >
              Only the most recent draw.
            feedback: >
              One draw is far too little: the next update needs your whole
              current belief, which depends on all two hundred draws.
          - text: >
              Your current posterior probability of bag $W$.
            correct: true
            feedback: >
              One number. Multiply the next draw's likelihood into it and you
              are exactly where a recomputation from all the data would put
              you.
        feedback: >
          The running posterior is a complete summary. This is the formal
          content of moving your quote after every fill: each fill is one more
          factor multiplied into the view you already hold.

      - part: When the draws are not independent
        ask: >
          Now the draws are made *without* replacement. You draw white, then
          white. Starting from $1/2$, what is the probability of bag $W$?
        expects: "1"
        hint: >
          How many white marbles does bag $B$ hold?
        feedback: >
          Bag $W$: $\frac{3}{4} \cdot \frac{2}{3} = \frac{1}{2}$. Bag $B$
          has one white marble, so a second white is impossible:
          $\frac{1}{4} \cdot 0 = 0$. The posterior on $W$ is $1$.
      - ask: >
          Someone handles the no-replacement case by feeding $3/4$ in as the
          prior and multiplying by the single-draw factor again, landing on
          $9/10$. What went wrong?
        choices:
          - text: >
              Sequential updating only works with replacement, so he should
              have done the batch calculation instead.
            feedback: >
              Sequential updating still works. What changes is the factor for
              the second draw: it must be $\Pr(x_2 \mid \theta, x_1)$, the
              chance of white given the bag *and* the white already removed.
          - text: >
              He reused the single-draw likelihood, but given the bag the
              second draw depends on the first; its factor is $2/3$ against
              $0$, not $3/4$ against $1/4$.
            correct: true
            feedback: >
              Without replacement the draws are not conditionally independent
              given the bag. The update still chains, but each factor has to
              condition on what has already left the bag.
          - text: >
              Nothing: $9/10$ is right, since the composition of the bag has
              not changed.
            feedback: >
              The composition left in the bag has changed — one white is out.
              Bag $B$ has no white left, and no number short of $1$ survives
              that.
        feedback: >
          Multiplying in the same per-draw factor is the conditionally
          independent case. When observations depend on one another given
          $\theta$, the chain survives only if each factor conditions on the
          earlier data.

  - node: quant-statistics.bayesian.conjugate
    hook: >
      Conjugacy is the difference between an interview answer you can
      compute in your head and one that needs an integral you were never
      going to finish in the time given.
    explanation: >
      A family of priors is conjugate to a likelihood when multiplying a
      member of the family by the likelihood always lands back inside the
      same family — only the parameters move, never the shape. Since
      posterior is proportional to prior times likelihood, this is a
      statement about kernels: if the prior kernel and the likelihood kernel
      are both powers of the same building blocks, their product is too, and
      you read off the new parameters by matching exponents instead of
      integrating anything.

      The standard pairs cover most of what interviews ask: Beta prior with
      a Bernoulli or binomial likelihood, Gamma prior with a Poisson
      likelihood, normal prior with a normal likelihood of known variance. In
      each case the update is literal bookkeeping — add successes and
      failures to the Beta's two parameters, add counts and exposure to the
      Gamma's.

      The prior's parameters then read as pseudo-observations: a
      $\mathrm{Beta}(a,b)$ prior behaves exactly like having already seen
      $a+b$ imaginary tosses, $a$ of which came up heads, before any real
      data arrived. That reading is what makes a chosen prior defensible —
      you can state, out loud, how many observations your belief is worth.
    worked: >
      Take a $\mathrm{Beta}(3,5)$ prior on a success probability $p$, kernel
      $p^{2}(1-p)^{4}$, and observe 4 successes and 1 failure in 5 trials,
      likelihood kernel $p^{4}(1-p)^{1}$. Multiplying kernels adds
      exponents: $p^{2+4}(1-p)^{4+1} = p^{6}(1-p)^{5}$, exactly a
      $\mathrm{Beta}(7,6)$ kernel — no integral, just $3+4=7$ and $5+1=6$.
      The prior's $3+5=8$ pseudo-tosses is what it means for the Beta
      parameters to already carry a sample size before any data arrives.
    interview: >
      "Why do people use Beta priors for probabilities" or "what does
      conjugate mean" wants the kernel-matching argument in one sentence —
      the posterior stays in the same family because both prior and
      likelihood are powers of $p$ and $1-p$ — followed by the pseudo-count
      reading.
    pitfalls: >
      Assuming every prior is conjugate to every likelihood is false — most
      pairs aren't, and outside the standard list you're back to numerical
      integration or simulation. Conjugacy guarantees the family is
      preserved, not that the update is trivial to state without checking
      which parameter absorbs which piece of the data.
    recap: >
      A conjugate prior and likelihood multiply into a posterior in the same
      family, so updating is just moving parameters — usually by adding
      counts — never re-deriving a shape from scratch.
    dialogue:
      - part: Three priors, one batch of data
        teach: >
          Each quote you post is filled independently with unknown probability
          $\theta$. Out of $5$ quotes, $2$ are filled, so the likelihood kernel
          is $\theta^{2}(1 - \theta)^{3}$. Three colleagues bring three priors:
          (a) density proportional to $\theta(1 - \theta)^{4}$; (b) uniform on
          $[0, 1]$; (c) density proportional to $e^{-\theta}$ on $[0, 1]$.
      - ask: >
          Under prior (a), the posterior is a $\mathrm{Beta}(\alpha, \beta)$
          density. What is $\beta$?
        expects: "8"
        hint: >
          Multiply the kernels and collect powers of $1 - \theta$.
        feedback: >
          $\theta(1 - \theta)^{4} \cdot \theta^{2}(1 - \theta)^{3} =
          \theta^{3}(1 - \theta)^{7}$, the $\mathrm{Beta}(4, 8)$ kernel, since a
          $\mathrm{Beta}(\alpha, \beta)$ kernel is $\theta^{\alpha - 1}(1 -
          \theta)^{\beta - 1}$. So $\beta = 8$.
      - ask: >
          What is the posterior mean of $\theta$ under prior (a)?
        expects: "1/3"
        tolerance: 0.0005
        feedback: >
          A $\mathrm{Beta}(4, 8)$ has mean $\frac{4}{4 + 8} = 1/3$. You never
          integrated anything: the shape told you the family, and the family
          told you the mean.
      - ask: >
          Under prior (b), the posterior is proportional to $\theta^{2}(1 -
          \theta)^{3}$. Did the update keep (b) inside its family?
        choices:
          - text: >
              No: the prior was flat and the posterior is curved, so the shape
              changed.
            feedback: >
              Flat and curved are both members of one family. The uniform
              density is $\mathrm{Beta}(1, 1)$, and the posterior is
              $\mathrm{Beta}(3, 4)$.
          - text: >
              Yes: uniform is $\mathrm{Beta}(1, 1)$, and the posterior is
              $\mathrm{Beta}(3, 4)$.
            correct: true
            feedback: >
              The uniform prior is the Beta with both exponents zero. The data
              added $2$ and $3$ to them.
          - text: >
              Only once the likelihood is normalised to integrate to $1$.
            feedback: >
              Normalising the likelihood rescales it and changes nothing
              about the shape. The posterior is a Beta either way.
        feedback: >
          The family is "Beta densities", and uniform is one of them. Updating
          moved the two parameters and left the family alone.
      - ask: >
          Under prior (c), what is the posterior?
        choices:
          - text: >
              $\mathrm{Beta}(3, 4)$, since $e^{-\theta}$ is a constant that can
              be dropped.
            feedback: >
              Only factors free of $\theta$ can be dropped, and $e^{-\theta}$
              runs from $1$ down to $0.37$ across $[0, 1]$. It tilts the
              posterior towards small $\theta$.
          - text: >
              A density proportional to $e^{-\theta}$ again, since updating
              preserves the prior's shape.
            feedback: >
              Nothing guarantees that. The product $e^{-\theta}\theta^{2}(1 -
              \theta)^{3}$ looks nothing like $e^{-\theta}$; it is zero at both
              ends.
          - text: >
              $e^{-\theta}\theta^{2}(1 - \theta)^{3}$ up to a constant: no
              family you know, so its mean needs a numerical integral.
            correct: true
            feedback: >
              The posterior exists and is perfectly valid. It just has no
              name, so the normalising constant and the mean have to be
              computed rather than read off.
        feedback: >
          Two priors gave a posterior you could read off; one gave an integral.
      - reflect: >
          What do priors (a) and (b) have in common with the likelihood that
          prior (c) lacks? Say why that property makes the posterior land in a
          named family.
        hint: >
          Look at what each prior's density is built from.
        answer: >
          Priors (a) and (b) are built from the same pieces as the likelihood,
          a power of $\theta$ times a power of $1 - \theta$. Multiplying such
          things adds the exponents, so the product is again a power of
          $\theta$ times a power of $1 - \theta$: a Beta kernel. Prior (c)
          brings in $e^{-\theta}$, which no power of $\theta$ or $1 - \theta$
          can absorb, so the product falls outside every family you know.

      - part: Families that survive their own data
        teach: >
          A family of priors is conjugate to a likelihood when every posterior
          lands back in the family. Then updating moves parameters and never
          changes shape. The standard pairs: Beta with binomial data; Gamma
          with Poisson counts; normal with normal data of known variance. The
          prior's parameters read as imaginary data: a $\mathrm{Beta}(a, b)$
          prior behaves like $a + b$ earlier trials of which $a$ succeeded.
      - ask: >
          Read prior (a) that way. How many imaginary quotes is it worth?
        expects: "7"
        feedback: >
          Prior (a) is $\mathrm{Beta}(2, 5)$: $2$ imaginary fills and $5$
          imaginary misses, $7$ quotes in all. The posterior
          $\mathrm{Beta}(4, 8)$ is those $7$ plus the $5$ real quotes, $2$ and
          $3$ added to the right counts.
      - ask: >
          The times between trades in a stock are independent exponential
          waits with unknown rate $\lambda$. Four waits total $6$ minutes, so
          the likelihood is $\lambda^{4}e^{-6\lambda}$. Which prior family is
          conjugate to it?
        choices:
          - text: >
              Beta, the standard prior for an unknown rate.
            feedback: >
              Beta lives on $[0, 1]$; it is the prior for a probability. A
              rate per minute can be any positive number.
          - text: >
              Gamma, with density proportional to $\lambda^{a - 1}e^{-b\lambda}$.
            correct: true
            feedback: >
              The likelihood is a power of $\lambda$ times an exponential in
              $\lambda$, and so is a Gamma kernel. Their product is too: the
              powers add and the exponents add.
          - text: >
              Uniform on $[0, 10]$, so the likelihood alone sets the shape.
            feedback: >
              The posterior is then $\lambda^{4}e^{-6\lambda}$ cut off at
              $10$: a truncated shape, not uniform. A flat prior does not stay
              flat.
        feedback: >
          Match the building blocks. The exponential likelihood is built from
          $\lambda^{n}$ and $e^{-\lambda T}$, and the Gamma is the family made
          of exactly those.
      - ask: >
          Take a Gamma prior on $\lambda$ with shape $3$ and rate $2$, density
          proportional to $\lambda^{2}e^{-2\lambda}$. After the four waits
          totalling $6$ minutes, what is the posterior mean of $\lambda$?
        expects: "7/8"
        tolerance: 0.0005
        hint: >
          Multiply the kernels, then read off the new shape and rate. A Gamma
          with shape $s$ and rate $r$ has mean $s/r$.
        feedback: >
          $\lambda^{2}e^{-2\lambda} \cdot \lambda^{4}e^{-6\lambda} =
          \lambda^{6}e^{-8\lambda}$: shape $7$, rate $8$, mean $7/8$ trades per
          minute. Shape gained the $4$ waits, rate gained the $6$ minutes.

      - part: A pair that is not conjugate
        ask: >
          Which of these prior–likelihood pairs is *not* conjugate?
        choices:
          - text: >
              A normal prior on an unknown mean, with normal data of known
              variance.
            feedback: >
              That is one of the standard pairs. Both are exponentials of
              quadratics in the mean, and so is their product.
          - text: >
              A normal prior on a coin's bias, with binomial data.
            correct: true
            feedback: >
              The prior is an exponential of a quadratic in $\theta$; the
              likelihood is $\theta^{k}(1 - \theta)^{n - k}$. Their product is
              neither normal nor Beta. A normal on a bias also puts mass
              outside $[0, 1]$.
          - text: >
              A Beta prior on a coin's bias, with data from $3$ separate
              batches of tosses.
            feedback: >
              Each batch adds its heads and tails to the Beta's parameters.
              Three batches are three rounds of the same bookkeeping.
        feedback: >
          Conjugacy is a property of the pair, not of the prior. Said aloud in
          an interview: "Beta is conjugate to the binomial because both are
          powers of $p$ and $1 - p$, so the update just adds counts."

  - node: quant-statistics.bayesian.beta-prior
    hook: >
      Every Beta-prior problem reduces to picking two numbers, and the
      numbers that matter are never $a$ and $b$ directly — they're the mean
      you'd bet on and the sample size your belief is worth.
    explanation: >
      You already know the Beta density and its moments; what earns Beta a
      place as the default prior on $[0,1]$ is a reparametrization of those
      same two numbers into ones a person can actually choose. Instead of
      picking $a$ and $b$ directly, fix the mean $a/(a+b)$ you'd defend as
      your best guess, and separately fix the pseudo-count $a+b$, how many
      imaginary observations that guess is worth — then solve back for $a$
      and $b$.

      This is also why the special cases matter: $\mathrm{Beta}(1,1)$ is the
      flat, maximally uncommitted case (mean 0.5, pseudo-count only 2),
      raising $a+b$ while holding the mean fixed tightens the density around
      that mean without moving its centre, and $\mathrm{Beta}(1/2,1/2)$ is
      the U-shaped Jeffreys prior that pushes mass toward the two extremes
      rather than the middle.

      The mode formula $(a-1)/(a+b-2)$, valid only for $a,b>1$, is worth
      flagging as a trap: below that threshold the density isn't even
      unimodal in the interior, so quoting a mode there is meaningless.
    worked: >
      You want a prior on a conversion rate centred at 0.3 and worth 10
      pseudo-observations. Solve $a+b=10$ and $a/(a+b)=0.3$: $a=3$, $b=7$,
      so the prior is $\mathrm{Beta}(3,7)$. Its mean is $3/10=0.3$ by
      construction; its mode is $(3-1)/(3+7-2)=2/8=0.25$, pulled below the
      mean since the density is right-skewed with $b>a$; its variance is
      $\frac{3 \times 7}{10^{2}\times 11}=21/1100\approx 0.0191$, a standard
      deviation near 0.138.
    interview: >
      "How would you set a Beta prior for this probability" wants you to
      name a defensible mean and pseudo-count, solve for $a$ and $b$ on the
      spot, and state at least one moment — the interviewer checks you
      parametrize by belief, not by memorized $a,b$ values.
    pitfalls: >
      Picking $a$ and $b$ directly by intuition, without checking what mean
      and pseudo-count they imply, usually produces an accidentally over- or
      under-confident prior. Quoting the mode formula when $a\le 1$ or $b\le
      1$ reports a number for a density that doesn't have an interior
      maximum there.
    recap: >
      Parametrize a Beta prior by the mean you'd bet on and the pseudo-count
      your belief is worth, then solve for $a$ and $b$ — not the other way
      around.
    dialogue:
      - part: Three priors with one centre
        teach: >
          Three desks set priors on the fill probability $\theta$ of a new
          venue. Desk one uses $\mathrm{Beta}(1, 4)$, desk two
          $\mathrm{Beta}(4, 16)$, desk three $\mathrm{Beta}(20, 80)$. Each says
          its prior is "about one in five".
      - ask: >
          What is the mean of desk two's prior?
        expects: "0.2"
        feedback: >
          $\frac{4}{4 + 16} = 0.2$. Desks one and three give $\frac{1}{5}$ and
          $\frac{20}{100}$: the same centre, three times over.
      - ask: >
          What is the standard deviation of desk three's prior,
          $\mathrm{Beta}(20, 80)$?
        expects: "0.0398"
        tolerance: 0.0005
        hint: >
          The variance of $\mathrm{Beta}(a, b)$ is
          $\frac{ab}{(a + b)^{2}(a + b + 1)}$.
        feedback: >
          $\frac{20 \cdot 80}{100^{2} \cdot 101} = \frac{1600}{1010000}
          \approx 0.00158$, so the standard deviation is about $0.040$. Desk
          one's $\mathrm{Beta}(1, 4)$ has standard deviation about $0.163$,
          four times as wide.
      - ask: >
          The venue fills $6$ of its first $10$ quotes. Whose posterior mean
          moves furthest from $0.2$?
        choices:
          - text: >
              All three move the same distance, since they share a mean and
              see the same data.
            feedback: >
              Desk one ends at $\mathrm{Beta}(7, 8)$, mean $7/15 \approx
              0.47$. Desk three ends at $\mathrm{Beta}(26, 84)$, mean
              $26/110 \approx 0.24$. Same centre, very different reactions.
          - text: >
              Desk three, since its prior is the most precise and so reacts
              most precisely.
            feedback: >
              Precision in the prior is resistance to data. Desk three's
              $100$ imaginary quotes outweigh $10$ real ones, and its mean
              barely reaches $0.24$.
          - text: >
              Desk one, whose prior is worth only $5$ imaginary quotes.
            correct: true
            feedback: >
              $\mathrm{Beta}(1, 4)$ plus $6$ fills and $4$ misses is
              $\mathrm{Beta}(7, 8)$, mean $7/15 \approx 0.47$: ten real quotes
              swamp five imaginary ones.
        feedback: >
          The three priors agree on the centre and disagree about how much
          that centre is worth. That second number is what decides the
          reaction to data.
      - reflect: >
          Setting a Beta prior from scratch, which two numbers would you rather
          choose than $a$ and $b$? Say how you would recover $a$ and $b$ from
          them.
        hint: >
          The desks agreed on one number and differed on another.
        answer: >
          The prior mean $m = a/(a + b)$, which is the rate you would bet on,
          and the strength $s = a + b$, which is how many quotes your belief
          is worth. Then $a = ms$ and $b = (1 - m)s$. Desk one is $m = 0.2$,
          $s = 5$; desk three is $m = 0.2$, $s = 100$.

      - part: A mean and a strength
        teach: >
          That is how a $\mathrm{Beta}(a, b)$ prior on an unknown probability is
          chosen: fix the mean $a/(a + b)$ you would defend and the
          pseudo-count $a + b$ your belief is worth. In those terms the
          variance is $m(1 - m)/(s + 1)$, so at a fixed centre the prior
          tightens like $1/(s + 1)$.
      - ask: >
          You believe a client's order-cancel rate is around $0.15$, and you
          would weigh that belief like $40$ observed orders. What is $a$?
        expects: "6"
        feedback: >
          $a = ms = 0.15 \cdot 40 = 6$, and $b = 0.85 \cdot 40 = 34$. The prior
          is $\mathrm{Beta}(6, 34)$: six imaginary cancels in forty orders.
      - ask: >
          Keeping the centre at $0.15$, what pseudo-count $a + b$ halves that
          prior's standard deviation?
        expects: "163"
        hint: >
          The variance is $m(1 - m)/(s + 1)$. Halving the standard deviation
          quarters the variance.
        feedback: >
          The variance must fall by a factor of $4$, so $s + 1$ must rise from
          $41$ to $164$: $s = 163$. Twice the certainty costs four times the
          evidence, a rule that comes back every time a sample size is chosen.

      - part: Special shapes and a broken formula
        ask: >
          Which Beta is the uniform distribution on $[0, 1]$?
        choices:
          - text: >
              $\mathrm{Beta}(0, 0)$, since a uniform prior adds no imaginary
              data.
            feedback: >
              The density $\theta^{-1}(1 - \theta)^{-1}$ has infinite area, so
              it is not a distribution at all. Zero exponents in the density
              mean $a = b = 1$, not $a = b = 0$.
          - text: >
              $\mathrm{Beta}(1, 1)$
            correct: true
            feedback: >
              Its density is $\theta^{0}(1 - \theta)^{0} = 1$. Read as
              pseudo-counts it is one imaginary success and one imaginary
              failure: centred at $1/2$, worth $2$ observations.
          - text: >
              $\mathrm{Beta}(2, 2)$, the symmetric one.
            feedback: >
              $\mathrm{Beta}(2, 2)$ is symmetric but humped: density
              $6\theta(1 - \theta)$, zero at the ends. Symmetric is not
              flat.
        feedback: >
          Flat is not the same as empty: read as pseudo-counts, the uniform
          prior is worth two observations.
      - ask: >
          A colleague plugs $\mathrm{Beta}(1/2, 1/2)$ into the mode formula
          $(a - 1)/(a + b - 2)$ and gets $(-1/2)/(-1) = 1/2$. What is true
          of this prior at $\theta = 1/2$?
        choices:
          - text: >
              It is the mode, as computed: the prior is symmetric about
              $1/2$, so the peak must be there.
            feedback: >
              Symmetric about $1/2$ means either a peak or a trough there. The
              density is proportional to $\theta^{-1/2}(1 - \theta)^{-1/2}$,
              which is infinite at $0$ and at $1$.
          - text: >
              The formula gives a number, so the prior is unimodal; the
              colleague only rounded wrong.
            feedback: >
              The arithmetic is right; the formula is not valid here. It locates
              an interior maximum only when $a > 1$ and $b > 1$.
          - text: >
              It is where the density is *lowest*: this prior is U-shaped, and
              the mode formula needs $a, b > 1$.
            correct: true
            feedback: >
              $\theta^{-1/2}(1 - \theta)^{-1/2}$ is smallest at $1/2$ and rises
              to infinity at both ends. This is the Jeffreys prior, which leans
              towards rates near $0$ or $1$.
        feedback: >
          The Beta covers humps, flat lines and U-shapes. Before quoting a mode,
          check which one you have. In an interview, set a Beta prior out loud
          as "mean $m$, worth $s$ observations", then solve for $a$ and $b$.

  - node: quant-statistics.bayesian.beta-binomial
    hook: >
      This is the single calculation every conjugate-prior interview
      question is secretly asking you to reproduce — memorize the mechanics
      here and every Beta-related question in this unit becomes an instance
      of it.
    explanation: >
      Multiply the Beta prior's kernel by the binomial likelihood's kernel
      and collect powers of $p$: $p^{a-1}(1-p)^{b-1} \cdot p^{k}(1-p)^{n-k} =
      p^{a+k-1}(1-p)^{b+n-k-1}$, precisely the kernel of a
      $\mathrm{Beta}(a+k,\,b+n-k)$ density. Reading off the new parameters is
      arithmetic, not integration: heads get added to $a$, tails get added
      to $b$.

      The posterior mean $(a+k)/(a+b+n)$ is worth stating immediately once
      the new parameters are known, since it's usually the actual number an
      interview question wants. It's always a compromise between the prior's
      belief and what the data alone would say — a fact the next step in
      this unit turns into an explicit formula.
    worked: >
      Continue with the $\mathrm{Beta}(3,7)$ prior from before (mean 0.3,
      worth 10 pseudo-tosses) and observe 7 successes in 20 new trials. Add
      successes to $a$ and failures to $b$: posterior is
      $\mathrm{Beta}(3+7,\,7+13) = \mathrm{Beta}(10,20)$. The posterior mean
      is $10/30 = 1/3 \approx 0.333$, and the posterior variance is
      $\frac{10 \times 20}{30^{2}\times 31} = 200/27900 \approx 0.00717$, a
      standard deviation near 0.0847. The raw sample proportion was $7/20 =
      0.35$; belief lands just short of it, pulled toward the prior's 0.3.
    interview: >
      "You have a Beta prior and observe $k$ successes in $n$ trials — what's
      the posterior" is answered in one line, $\mathrm{Beta}(a+k, b+n-k)$,
      immediately followed by the mean; a good follow-up asks for the
      variance too, testing whether you have the Beta moment formulas on
      hand.
    pitfalls: >
      Adding $k$ to both $a$ and $b$, instead of adding the failures $n-k$
      to $b$, is the most common bookkeeping slip. Reporting the raw sample
      proportion $k/n$ as the answer, forgetting the prior contributed
      anything, throws away the entire point of the update.
    recap: >
      A Beta prior updated by $k$ successes in $n$ trials is exactly
      $\mathrm{Beta}(a+k, b+n-k)$ — add heads to $a$, tails to $b$ — with
      posterior mean $(a+k)/(a+b+n)$.
    dialogue:
      - part: Twelve quotes on a new venue
        teach: >
          You start quoting on a new venue. Before any data, your belief about
          its fill probability $\theta$ is $\mathrm{Beta}(3, 9)$: density
          proportional to $\theta^{2}(1 - \theta)^{8}$, centred at $1/4$. The
          first twelve quotes, independent given $\theta$, bring $5$ fills and
          $7$ misses.
      - ask: >
          Multiply the prior kernel by the likelihood kernel
          $\theta^{5}(1 - \theta)^{7}$. The product is $\theta^{m}(1 -
          \theta)^{r}$. What is $r$?
        expects: "15"
        hint: >
          Powers of the same base add.
        feedback: >
          $\theta^{2}(1 - \theta)^{8} \cdot \theta^{5}(1 - \theta)^{7} =
          \theta^{7}(1 - \theta)^{15}$, so $r = 15$ and $m = 7$.
      - ask: >
          Which density is the posterior?
        choices:
          - text: >
              $\mathrm{Beta}(7, 15)$
            feedback: >
              Those are the exponents, and a $\mathrm{Beta}(\alpha, \beta)$
              kernel is $\theta^{\alpha - 1}(1 - \theta)^{\beta - 1}$. Add one
              to each: the prior $\theta^{2}(1 - \theta)^{8}$ was
              $\mathrm{Beta}(3, 9)$, not $\mathrm{Beta}(2, 8)$.
          - text: >
              $\mathrm{Beta}(5, 7)$
            feedback: >
              That is the data's counts alone, as if the prior had never been
              there. Even a flat prior would give $\mathrm{Beta}(6, 8)$, and
              yours was worth twelve quotes.
          - text: >
              $\mathrm{Beta}(8, 16)$
            correct: true
            feedback: >
              Exponents $7$ and $15$ are parameters $8$ and $16$. The $5$
              fills went onto the $3$ and the $7$ misses onto the $9$.
        feedback: >
          The product of two Beta-shaped kernels is a Beta kernel, so the
          normalising constant comes free with the name. No integral was
          done.
      - ask: >
          What is the posterior mean of $\theta$?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          A $\mathrm{Beta}(\alpha, \beta)$ has mean $\alpha/(\alpha + \beta)$.
        feedback: >
          $8/(8 + 16) = 8/24 = 1/3$. Your prior said $1/4$; the twelve quotes
          filled at $5/12 \approx 0.417$; belief lands between them.

      - part: Where the third comes from
        reflect: >
          A colleague says $1/3$ is biased: the venue filled $5$ of $12$, so
          report $5/12$. Look at the numerator and denominator of $8/24$.
          What are they counting, and what is the prior doing to the answer?
        hint: >
          Read $\mathrm{Beta}(3, 9)$ as quotes you had already seen.
        answer: >
          $8$ is fills and $24$ is quotes, real and imaginary together: the
          prior behaves like $12$ earlier quotes with $3$ fills, and the
          posterior mean is the pooled fill rate $(3 + 5)/(12 + 12)$. The
          prior is not bias added after the fact; it is earlier evidence, and
          here it weighs exactly as much as the twelve real quotes. Report
          $5/12$ and you have thrown that evidence away.
      - teach: >
          That is the whole beta–binomial update. A $\mathrm{Beta}(a, b)$
          prior and $k$ successes in $n$ independent trials give the posterior
          $\mathrm{Beta}(a + k,\, b + n - k)$: successes onto $a$, failures
          onto $b$. Its mean is $(a + k)/(a + b + n)$, total successes over
          total trials with the prior's pseudo-counts included, and its
          variance is the Beta variance at the new parameters.
      - ask: >
          Starting from $\mathrm{Beta}(8, 16)$, how many fills in the next
          $12$ quotes would put the posterior mean at exactly $1/2$?
        expects: "10"
        hint: >
          After $f$ fills the mean is $(8 + f)/(24 + 12)$.
        feedback: >
          $(8 + f)/36 = 1/2$ gives $f = 10$. Ten fills in twelve quotes, a
          rate of $0.83$, to pull a belief worth $24$ quotes up to a half.

      - part: Spread, and the next batch
        ask: >
          What is the posterior standard deviation of $\theta$ under
          $\mathrm{Beta}(8, 16)$?
        expects: "0.0943"
        tolerance: 0.0005
        hint: >
          The variance of $\mathrm{Beta}(\alpha, \beta)$ is
          $\alpha\beta/((\alpha + \beta)^{2}(\alpha + \beta + 1))$.
        feedback: >
          $\frac{8 \cdot 16}{24^{2} \cdot 25} = \frac{128}{14400} \approx
          0.00889$, so the standard deviation is about $0.0943$. The prior
          $\mathrm{Beta}(3, 9)$ had $\frac{27}{144 \cdot 13} \approx 0.0144$,
          a standard deviation of about $0.120$. Twelve quotes took a fifth off
          it.
      - ask: >
          The next $8$ quotes bring $6$ fills. Starting from
          $\mathrm{Beta}(8, 16)$, what is the posterior mean now?
        expects: "7/16"
        tolerance: 0.0005
        feedback: >
          $\mathrm{Beta}(8 + 6,\, 16 + 2) = \mathrm{Beta}(14, 18)$, mean
          $14/32 = 7/16 \approx 0.438$. Starting from $\mathrm{Beta}(3, 9)$ with
          all $20$ quotes, $11$ fills, lands on the same $\mathrm{Beta}(14,
          18)$: the counts just accumulate.

      - part: Two ways to get it wrong
        ask: >
          Another desk, from the same $\mathrm{Beta}(3, 9)$ and the same first
          twelve quotes, reports $\mathrm{Beta}(8, 14)$. What did it do?
        choices:
          - text: >
              It added the $5$ fills to both parameters.
            correct: true
            feedback: >
              $3 + 5 = 8$ and $9 + 5 = 14$. The second parameter takes the
              misses, $n - k = 7$, not the fills again; the slip makes the venue
              look better than the data says, mean $4/11$ instead of $1/3$.
          - text: >
              It added the $12$ quotes to the second parameter.
            feedback: >
              That gives $\mathrm{Beta}(8, 21)$, a different slip: counting
              every quote as a miss. $14$ is $9 + 5$.
          - text: >
              Nothing: $\mathrm{Beta}(8, 14)$ and $\mathrm{Beta}(8, 16)$ are
              close enough to be the same update.
            feedback: >
              The means are $4/11 \approx 0.364$ and $1/3$, and the error
              compounds with every batch. The bookkeeping is the whole
              computation, so it has to be exact.
        feedback: >
          Successes onto $a$, failures onto $b$, and the two always add up to
          $n$.
      - ask: >
          At noon the venue changes its matching rules. From
          $\mathrm{Beta}(3, 9)$, the morning brings $2$ fills in $10$ quotes and
          the afternoon $8$ fills in $10$. A colleague reports
          $\mathrm{Beta}(13, 19)$. What is wrong?
        choices:
          - text: >
              The update should run in two stages, morning posterior as the
              afternoon prior, which gives a different answer.
            feedback: >
              Two stages give $\mathrm{Beta}(5, 17)$ and then
              $\mathrm{Beta}(13, 19)$: the same place. Staging is not the
              problem.
          - text: >
              The update assumes one $\theta$ behind every quote. With the rules
              changed there are two, and pooling the counts blends them.
            correct: true
            feedback: >
              Adding counts is valid only for trials that are independent given
              a single fixed $\theta$. A morning rate near $0.2$ and an
              afternoon rate near $0.8$ pooled into $13/32 \approx 0.41$
              describe neither regime.
          - text: >
              Nothing: the order of the data never matters to a Bayesian.
            feedback: >
              Order is irrelevant only when every observation depends on the
              same $\theta$. Here the afternoon quotes are evidence about a
              different number.
        feedback: >
          The beta–binomial arithmetic is exact for one unknown probability and
          conditionally independent trials. When the probability itself moves,
          the counts stop being exchangeable.
      - teach: >
          Said aloud in an interview: "prior $\mathrm{Beta}(3, 9)$, five fills
          in twelve, so the posterior is $\mathrm{Beta}(8, 16)$ — mean a third,
          standard deviation about nine points. The raw rate was $0.42$, and
          belief lands short of it because the prior was worth twelve quotes."

  - node: quant-statistics.bayesian.posterior-mean-weights
    hook: >
      Whenever an interviewer asks how much a small sample should move your
      belief, this decomposition is the answer they want — a literal
      weighted average, with the weights spelled out in pseudo-counts.
    explanation: >
      Split the beta-binomial posterior mean algebraically:
      $(a+k)/(a+b+n)$ rewrites as $[(a+b)/(a+b+n)]\cdot[a/(a+b)] +
      [n/(a+b+n)]\cdot[k/n]$, exactly a weighted average of the prior mean
      $a/(a+b)$ and the sample proportion $k/n$, with weights $(a+b)/(a+b+n)$
      and $n/(a+b+n)$ that sum to 1 by construction.

      The weights are the whole story: the prior's influence is proportional
      to its own pseudo-count $a+b$, and the data's influence is
      proportional to the real sample size $n$, competing on equal footing
      in the same denominator. As $n$ grows without bound the data weight
      tends to 1 and the posterior mean converges to the sample proportion
      regardless of where the prior started; for small $n$ the prior
      dominates.

      This decomposition turns "should I trust this early result" into an
      arithmetic question — compute the two weights, and how much the data
      has actually moved your belief is right there as a ratio.
    worked: >
      Continue the $\mathrm{Beta}(3,7)$ prior (pseudo-count 10) updated by 7
      successes in 20 trials. Weights are $10/30=1/3$ for the prior and
      $20/30=2/3$ for the data. Check: $(1/3)(0.3) + (2/3)(0.35) = 0.1 +
      0.2333\ldots = 1/3 \approx 0.333$, matching the posterior mean computed
      directly from $\mathrm{Beta}(10,20)$ — the data, carrying twice the
      prior's weight, pulls the answer most of the way from 0.3 toward 0.35,
      but not all the way.
    interview: >
      "How much should this sample move your prior belief" is answered by
      naming the two weights, pseudo-count over total and sample size over
      total, and computing the actual convex combination — not just saying
      "somewhere in between."
    pitfalls: >
      Weighting the prior and data equally regardless of their pseudo-counts
      ignores exactly the information the formula is built to use.
      Forgetting that the weights must sum to 1 risks a decomposition that
      doesn't reconstruct the actual posterior mean.
    recap: >
      The posterior mean is a weighted average of the prior mean and the
      sample proportion, weighted by pseudo-count against real sample size —
      the honest measure of how much a given amount of data should move you.
    dialogue:
      - part: Thirty trades against a prior worth twenty
        teach: >
          Your prior on a new strategy's win rate is $\mathrm{Beta}(6, 14)$:
          centred at $0.3$ and worth $20$ trades. The strategy then wins $18$
          of its first $30$ trades, a raw rate of $0.6$.
      - ask: >
          What is the posterior mean of the win rate?
        expects: "0.48"
        feedback: >
          The posterior is $\mathrm{Beta}(6 + 18,\, 14 + 12) = \mathrm{Beta}(24,
          26)$, with mean $24/50 = 0.48$.
      - ask: >
          The prior said $0.3$ and the data alone say $0.6$. What fraction of
          the way from $0.3$ to $0.6$ did the posterior mean travel?
        expects: "0.6"
        hint: >
          Distance travelled over distance available.
        feedback: >
          $(0.48 - 0.3)/(0.6 - 0.3) = 0.18/0.3 = 0.6$. The posterior went
          three-fifths of the way to the data.
      - reflect: >
          That $0.6$ is not a coincidence: the same number can be built from
          the counts $20$ and $30$. How? And can you split $(a + k)/(a + b +
          n)$ so that the prior mean $a/(a + b)$ and the raw rate $k/n$ appear
          in it explicitly?
        hint: >
          Write $a$ as $(a + b) \cdot \frac{a}{a + b}$ and $k$ as $n \cdot
          \frac{k}{n}$.
        answer: >
          $30/(20 + 30) = 0.6$: the data's share of all the trades, real and
          imaginary. In general $a + k = (a + b)\frac{a}{a + b} + n\frac{k}{n}$,
          and dividing by $a + b + n$ gives $\frac{a + b}{a + b + n} \cdot
          \frac{a}{a + b} + \frac{n}{a + b + n} \cdot \frac{k}{n}$. The
          posterior mean is a weighted average of the prior mean and the raw
          rate, each weighted by how many trades it stands for.

      - part: A weighted average, with the weights in counts
        teach: >
          The beta–binomial posterior mean interpolates: $\frac{a + k}{a + b
          + n} = (1 - w)\frac{a}{a + b} + w\,\frac{k}{n}$ with data weight $w =
          \frac{n}{a + b + n}$. The prior's pull is its pseudo-count $a + b$,
          the data's pull is the real count $n$, and they compete in one
          denominator. As $n \to \infty$, $w \to 1$ and the posterior mean
          converges to the raw rate.
      - ask: >
          What guarantees that the posterior mean always lands between the
          prior mean and the raw rate $k/n$?
        choices:
          - text: >
              The Beta prior is conjugate, so updating preserves the prior
              mean's position.
            feedback: >
              Conjugacy keeps the posterior in the Beta family; it says nothing
              about where the mean goes. Here the mean moved from $0.3$ to
              $0.48$.
          - text: >
              The data outweigh the prior, $n > a + b$.
            feedback: >
              It holds for any $n \ge 1$. One win against $\mathrm{Beta}(6, 14)$
              gives $7/21 = 1/3$, still between $0.3$ and $1$, with the data
              carrying weight only $1/21$.
          - text: >
              The two weights are nonnegative and add to $1$.
            correct: true
            feedback: >
              A weighted average with nonnegative weights summing to $1$ cannot
              leave the segment between its two inputs. Both weights are counts
              over the same total.
        feedback: >
          Between, always, and the weights say exactly where.
      - ask: >
          A second strategy carries prior $\mathrm{Beta}(9, 3)$, centred at
          $0.75$, and wins $7$ of its first $28$ trades. What weight does the
          data carry?
        expects: "0.7"
        feedback: >
          The prior is worth $9 + 3 = 12$ trades, so $w = 28/(12 + 28) =
          28/40 = 0.7$.
      - ask: >
          Using that weight, what is the second strategy's posterior mean?
        expects: "0.4"
        hint: >
          The raw rate is $7/28$.
        feedback: >
          $0.3 \cdot 0.75 + 0.7 \cdot 0.25 = 0.225 + 0.175 = 0.4$. Directly:
          $(9 + 7)/(12 + 28) = 16/40 = 0.4$. Both routes have to agree.

      - part: How the weights move
        ask: >
          Back to the first strategy's $\mathrm{Beta}(6, 14)$. How many trades
          must it log before the data carry $90\%$ of the weight?
        expects: "180"
        hint: >
          Solve $n/(20 + n) = 0.9$.
        feedback: >
          $n = 0.9(20 + n)$ gives $0.1n = 18$, so $n = 180$. Nine times the
          prior's pseudo-count buys a $90\%$ share.
      - ask: >
          A colleague holds the same centre with far more conviction:
          $\mathrm{Beta}(60, 140)$, worth $200$ trades. On the same $18$ wins in
          $30$, what is his posterior mean, to three decimals?
        expects: "0.339"
        tolerance: 0.0005
        feedback: >
          $(60 + 18)/(200 + 30) = 78/230 \approx 0.339$. The data weight is
          only $30/230 \approx 0.13$, so thirty trades move him from $0.3$ to
          $0.34$ where they moved you to $0.48$.
      - ask: >
          A third strategy has your prior $\mathrm{Beta}(6, 14)$ but wins $21$
          of $30$, a more surprising record than $18$. What weight do its data
          get?
        choices:
          - text: >
              More than $0.6$: a surprising result is stronger evidence.
            feedback: >
              The weight is $n/(a + b + n) = 30/50$ whatever $k$ is. A larger
              $k$ moves the answer further, because the raw rate it is
              averaged with is further out, not because its share grows.
          - text: >
              Exactly $0.6$, the same as before.
            correct: true
            feedback: >
              Posterior mean $0.4 \cdot 0.3 + 0.6 \cdot 0.7 = 0.54$, and
              directly $27/50 = 0.54$. The weights are fixed by the counts
              before you look at the results.
          - text: >
              Less than $0.6$: extreme records are more likely to be noise.
            feedback: >
              In the beta–binomial the share depends only on $n$ and $a + b$.
              The discounting of an extreme record is already in the fixed
              $40\%$ pull towards $0.3$; there is no extra penalty for
              surprise.
        feedback: >
          How far the data move you depends on how far out they land; what
          share they get depends only on how many there are.

      - part: The shortcut that ignores the counts
        ask: >
          For the first strategy, a colleague splits the difference between
          $0.3$ and $0.6$ and reports $0.45$. What has he assumed without
          saying so?
        choices:
          - text: >
              Nothing: with no strong view of the prior's strength, equal
              weights are the neutral choice.
            feedback: >
              Equal weights are a strong view: they declare the prior worth
              exactly as much as the data. A neutral choice would be a small
              pseudo-count, which favours the data.
          - text: >
              That the prior is worth exactly $30$ trades, as much as the
              data.
            correct: true
            feedback: >
              Weights of one half each mean $a + b = n$. The prior was worth
              $20$, so he overweighted it and landed below the right $0.48$.
          - text: >
              That the posterior median, not the mean, is wanted.
            feedback: >
              The median of $\mathrm{Beta}(24, 26)$ is also about $0.48$. The
              $0.45$ comes from the weights, not from the choice of centre.
        feedback: >
          Every split between a prior and a sample is a claim about their
          relative counts. Make the claim explicit.
      - teach: >
          Said aloud: "the posterior mean is a weighted average of my prior
          $0.3$ and the observed $0.6$, weights twenty to thirty, so it lands
          three-fifths of the way across, at $0.48$. Another hundred and fifty
          trades and the prior is down to a tenth of the weight."

  - node: quant-statistics.bayesian.succession
    hook: >
      This is the two-second sanity check for any estimate-a-probability-
      from-a-tiny-sample question — it's why a perfect or a zero track
      record never becomes a probability of exactly 1 or 0.
    explanation: >
      Take the flattest Beta prior, $\mathrm{Beta}(1,1)$, uniform on $[0,1]$,
      and update by $k$ successes in $n$ trials the ordinary way: the
      posterior is $\mathrm{Beta}(k+1,\,n-k+1)$, one imaginary success and
      one imaginary failure added to the tally before anything else happens.

      The chance the next trial succeeds isn't a separate calculation —
      since $p$ is itself the chance of success, averaging over the
      posterior's belief about $p$ gives exactly the posterior mean,
      $(k+1)/(n+2)$. That single formula answers "predict the next
      observation" and "what do you currently believe $p$ is" at once.

      What the rule buys you is a refusal to output the degenerate
      frequentist extremes: with zero successes so far, the frequentist
      estimate $k/n$ is a flat 0, but one failure was never proof that
      success is impossible — the rule reports something small but strictly
      positive, and symmetrically caps a perfect record strictly below 1.
    worked: >
      A new trading strategy wins its first 2 backtested trades out of 2 (a
      raw hit rate of 100%). Laplace's rule gives $\Pr(\text{next trade
      wins}) = (2+1)/(2+2) = 3/4 = 0.75$ — high, since two wins is real
      evidence, but nowhere near the naive 100% two data points can't
      actually support.
    interview: >
      "The strategy has won every trade so far — do you believe it always
      wins" tests whether you reach for $(k+1)/(n+2)$ instead of quoting the
      raw 100%; the strong answer states the number and explains why a flat
      prior refuses certainty from finite data.
    pitfalls: >
      Reporting the raw proportion $k/n$ instead of $(k+1)/(n+2)$ silently
      assumes an infinitely confident prior, not the flat one the rule
      requires. The rule only applies starting from $\mathrm{Beta}(1,1)$ —
      a different prior's pseudo-count changes the formula to the general
      posterior mean $(a+k)/(a+b+n)$.
    recap: >
      With a flat prior, the next trial succeeds with probability
      $(k+1)/(n+2)$ — a small, finite sample can never push belief all the
      way to certainty in either direction.
    dialogue:
      - part: Seven clean nights
        teach: >
          A new overnight reconciliation job has run seven nights and
          succeeded on all seven. The risk desk asks you for one number: the
          probability that it succeeds tonight.
      - ask: >
          The raw success rate is $7/7 = 1$. What does reporting $1$ commit you
          to?
        choices:
          - text: >
              Nothing worrying: $1$ is the maximum-likelihood estimate, and
              seven nights is all the data there is.
            feedback: >
              It is the maximum-likelihood estimate, and that is the problem:
              the data are seven nights, and the number claims to know what
              happens on every night ever.
          - text: >
              That a failure tonight is impossible, so you would take any odds,
              however long, against one.
            correct: true
            feedback: >
              A probability of $1$ prices failure at zero. Seven successes are
              good evidence the job is reliable; they are no evidence at all
              that it cannot fail.
          - text: >
              That the job will run exactly seven more times.
            feedback: >
              The rate says nothing about how many nights are left. What it
              does say is that the next night cannot fail.
        feedback: >
          A finite record cannot justify certainty. The question is what
          number it does justify.
      - ask: >
          Put a uniform prior on the job's per-night success probability $p$,
          nights independent given $p$. What is the posterior mean of $p$ after
          the seven successes?
        expects: "8/9"
        tolerance: 0.0005
        hint: >
          The uniform density on $[0, 1]$ is $\mathrm{Beta}(1, 1)$.
        feedback: >
          $\mathrm{Beta}(1 + 7,\, 1 + 0) = \mathrm{Beta}(8, 1)$, with mean
          $8/9 \approx 0.889$.
      - reflect: >
          The desk asked for the probability that *tonight* succeeds, not for
          your estimate of $p$. Why is the answer to their question exactly the
          posterior mean — and not the posterior's peak, which for
          $\mathrm{Beta}(8, 1)$ sits at $p = 1$?
        hint: >
          If you knew $p$, what would the chance of success tonight be? Now you
          do not know $p$.
        answer: >
          Given $p$, tonight succeeds with probability $p$. Not knowing $p$,
          you average that over everything $p$ could be, weighted by the
          posterior: $\Pr(\text{success} \mid \text{data}) = \int_0^1
          p\,\pi(p \mid \text{data})\,dp = \mathbb{E}[p \mid \text{data}]$. The
          peak is one value of $p$; the forecast has to account for all of
          them, including the ones where the job fails one night in five.

      - part: One imaginary success, one imaginary failure
        teach: >
          That is Laplace's rule of succession. With a uniform prior and $k$
          successes in $n$ conditionally independent trials, the posterior is
          $\mathrm{Beta}(k + 1,\, n - k + 1)$, and the chance the next trial
          succeeds is its mean, $\frac{k + 1}{n + 2}$. Operationally: add one
          success and one failure to the tally, then divide.
      - ask: >
          A junior's first ten cold calls produced no meetings. What does the
          rule give for the chance the eleventh does?
        expects: "1/12"
        tolerance: 0.0005
        feedback: >
          $(0 + 1)/(10 + 2) = 1/12 \approx 0.083$. Small, as ten misses
          deserve, but not the flat $0$ the raw rate gives.
      - ask: >
          A strategy has won $13$ of its $20$ trades. What does the rule give
          for the next trade?
        expects: "7/11"
        tolerance: 0.0005
        feedback: >
          $(13 + 1)/(20 + 2) = 14/22 = 7/11 \approx 0.636$, against a raw
          $0.65$. Away from the extremes the rule barely moves the raw rate.
      - ask: >
          Back to the job. How many consecutive successful nights does it need
          before the rule puts tonight's success at $0.99$ or more?
        expects: "98"
        hint: >
          Solve $(n + 1)/(n + 2) \ge 0.99$.
        feedback: >
          $n + 1 \ge 0.99n + 1.98$ gives $0.01n \ge 0.98$, so $n = 98$, where
          the rule gives $99/100$. Ninety-seven nights give $98/99 \approx
          0.9899$, just short.
      - ask: >
          Instead, on night eight the job fails. What does the rule give for
          night nine?
        expects: "4/5"
        feedback: >
          $k = 7$, $n = 8$: $(7 + 1)/(8 + 2) = 8/10 = 4/5$. One failure drops
          you from $8/9 \approx 0.889$ to $0.8$; the raw rate drops from $1$ to
          $0.875$.

      - part: Where a flat prior is the wrong prior
        ask: >
          An engineer tells you that jobs of this type, across the firm,
          succeed on about $99\%$ of nights. Should you still quote $8/9$ after
          seven clean nights?
        choices:
          - text: >
              Yes: Laplace's rule is the Bayesian answer, and the engineer's
              number is not data on this job.
            feedback: >
              The rule is the Bayesian answer *under a flat prior*. If you
              believe the firm-wide record, the flat prior is not your belief,
              and $8/9$ is not your answer.
          - text: >
              No: quote $0.99$, since the firm's record is far larger than seven
              nights.
            feedback: >
              That throws the seven nights away. The firm-wide rate belongs in
              the prior, and the job's own record still updates it.
          - text: >
              No: encode the firm's record as a prior centred near $0.99$ with
              real weight, and report $(a + k)/(a + b + n)$.
            correct: true
            feedback: >
              The rule is the special case $a = b = 1$ of the general posterior
              mean. With real prior information, use it.
        feedback: >
          $(k + 1)/(n + 2)$ is what a flat prior says, and a flat prior is a
          choice, not an absence of one.
      - ask: >
          Applied with no data at all, the rule says a brand-new exchange
          has a $1/2$ chance of an outage on its first trading day. What is
          the lesson?
        choices:
          - text: >
              $1/2$ is right: with no data, every probability is equally
              plausible.
            feedback: >
              You do have information: almost every exchange opens without an
              outage. A flat prior ignores it, and $1/2$ is the result.
          - text: >
              The rule breaks down at $n = 0$, since it divides by zero.
            feedback: >
              The denominator is $n + 2 = 2$. The rule gives a number; the
              number is just a bad one here.
          - text: >
              The flat prior is an assumption, and for rare events it is a poor
              one; the prior has to come from what you actually know.
            correct: true
            feedback: >
              With no data the rule returns the prior mean, $1/2$, and nothing
              else. The rule earns its keep when the record is lopsided and the
              prior really is vague.
        feedback: >
          The rule removes the absurd $0$ and $1$ from a thin record. It does
          not remove the need to say what you believed before the record
          began.
      - teach: >
          Said aloud: "seven for seven, so with a flat prior it is eight over
          nine, about $0.89$ — not $1$, because seven nights cannot rule out a
          failure. If I know jobs like this fail far less often, I would
          centre the prior there instead."

  - node: quant-statistics.bayesian.shrinkage
    hook: >
      The best-looking number in a small sample is disproportionately
      likely to belong to the luckiest case rather than the best one, and
      shrinkage is the one-line fix every thin-track-record question is
      testing for.
    explanation: >
      Every conjugate update has the same geometry underneath: the posterior
      estimate sits strictly between the prior's guess and the raw sample
      statistic, positioned by the fraction (prior weight)/(prior weight +
      data weight) — thin data means a small data weight, so the pull toward
      the prior dominates.

      The practical reading is a discount rule: whenever you see an extreme
      statistic built from few observations, ask what a reasonable prior
      centred at the population average would do to it, and expect the
      honest estimate to land noticeably closer to that average. The more
      extreme the raw statistic and the thinner the sample behind it, the
      larger the correction has to be, since an extreme outcome from a small
      sample is more likely to be partly noise than an equally extreme
      outcome from a large one.

      This is why, across a population of candidates or strategies, the
      single best-looking short-run number tends to overstate the true
      quality of whoever produced it — the ranking is partly sorting on luck,
      and shrinkage is the correction that partly undoes that sort.
    worked: >
      A new sales rep closes 8 of the first 10 calls, a raw 80% close rate.
      Against a population prior of $\mathrm{Beta}(15,15)$ (centred at 50%,
      worth 30 pseudo-calls), the posterior is $\mathrm{Beta}(23,17)$, mean
      $23/40 = 0.575$ — the impressive 80% raw rate is discounted to 57.5%
      once weighed against 30 pseudo-calls of population history, because 10
      real calls aren't enough to overturn what everyone else's record
      already says.
    interview: >
      "A new hire's numbers look great after a week — do you believe them"
      tests whether you invoke shrinkage explicitly, naming the prior's
      pseudo-count against the sample size, rather than dismissing the
      number entirely or accepting it at face value.
    pitfalls: >
      Treating the raw sample statistic as the honest estimate, with no
      discount toward the population prior, overweights whatever the thin
      sample happened to show. Applying heavy shrinkage to a genuinely large
      sample is the opposite error — once the data weight dominates, the
      correction should shrink to near nothing.
    recap: >
      A thin sample's estimate is pulled toward the prior in proportion to
      how thin it is, so an extreme short-run number should always be
      discounted before it's believed.
    dialogue:
      - part: The best of forty strategies
        teach: >
          Forty new strategies each ran for ten days. The leader called the
          day's direction right on $9$ of its $10$ days. Past cohorts say
          strategies like these have true daily hit rates bunched tightly
          around $50\%$, about as if each rate were drawn from
          $\mathrm{Beta}(25, 25)$.
      - ask: >
          Over its next ten days, about how many days do you expect the leader
          to call right?
        choices:
          - text: >
              About $9$: that is its demonstrated rate.
            feedback: >
              That treats ten days as if they settled the rate. Its record was
              selected as the best of forty, and ten days of a near-coin can
              easily look like that.
          - text: >
              About $6$.
            correct: true
            feedback: >
              Better than a coin, because nine of ten is real evidence; far
              below nine, because the evidence is thin and the population sits
              at a half.
          - text: >
              About $5$: everything is a coin, and the record means nothing.
            feedback: >
              Nine of ten is more likely under a rate of $0.6$ than under
              $0.5$, so it has to move you somewhat. Ignoring it is the opposite
              error.
        feedback: >
          Now put a number on the intuition.
      - ask: >
          Updating $\mathrm{Beta}(25, 25)$ on $9$ right and $1$ wrong, what is
          the leader's posterior mean hit rate?
        expects: "17/30"
        tolerance: 0.0005
        feedback: >
          $\mathrm{Beta}(34, 26)$, mean $34/60 = 17/30 \approx 0.567$: about
          $5.7$ right days out of the next ten.
      - ask: >
          Suppose a strategy's true hit rate is exactly $0.5$. What is the
          probability that it calls at least $9$ of $10$ days right?
        expects: "11/1024"
        tolerance: 0.0005
        hint: >
          Count the ways to get exactly $9$ and exactly $10$.
        feedback: >
          $\binom{10}{9} + \binom{10}{10} = 11$ sequences out of $2^{10} =
          1024$, so $11/1024 \approx 0.0107$.
      - ask: >
          If all forty strategies were pure coins, what is the chance that at
          least one of them shows $9$ or more right out of $10$?
        expects: "0.351"
        tolerance: 0.005
        hint: >
          Complement: none of the forty does.
        feedback: >
          $1 - (1013/1024)^{40} \approx 1 - 0.649 = 0.351$. A record like the
          leader's turns up by pure luck about a third of the time in a cohort
          this size.
      - reflect: >
          Put the two facts together: the leader's record is extreme, and
          extreme ten-day records appear by luck alone in a cohort like this.
          Why should your estimate for the leader be pulled towards $0.5$, and
          what decides how hard?
        hint: >
          The posterior mean is a weighted average. Of what, with what
          weights?
        answer: >
          An extreme record from few observations is part skill and part
          noise, and being picked as the best of forty selects for noise. The
          prior carries what the population says about the skill part. The
          estimate is the weighted average $\frac{50}{60} \cdot 0.5 +
          \frac{10}{60} \cdot 0.9$: the pull towards the prior is the prior's
          pseudo-count over the total, $50/60$, so thin data get pulled hard.

      - part: Thin data borrows from the prior
        teach: >
          That pull is shrinkage. Every conjugate update puts the estimate
          strictly between the prior guess and the raw statistic, pulled
          towards the prior by the fraction (prior weight)/(prior weight + data
          weight). The thinner the data, the larger that fraction, which is
          why a short track record, of a strategy or a person, should be
          discounted towards the population average before it is believed.
      - ask: >
          Had the leader instead called $90$ of $100$ days right, what would
          its posterior mean be under the same $\mathrm{Beta}(25, 25)$?
        expects: "23/30"
        tolerance: 0.0005
        feedback: >
          $(25 + 90)/(50 + 100) = 115/150 = 23/30 \approx 0.767$. The same
          $90\%$ raw rate, now pulled back only a third of the way, because
          the prior is $50$ days against $100$.
      - ask: >
          Strategy A was right on $9$ of $10$ days; strategy B on $62$ of
          $100$. Under the $\mathrm{Beta}(25, 25)$ prior, which has the higher
          posterior mean?
        choices:
          - text: >
              A: $90\%$ is far above $62\%$.
            feedback: >
              A is $34/60 \approx 0.567$; B is $87/150 = 0.58$. A's ten days
              are pulled five-sixths of the way back to $0.5$, B's hundred
              only a third.
          - text: >
              B
            correct: true
            feedback: >
              $87/150 = 0.58$ against $34/60 \approx 0.567$. The more modest
              record on ten times the data is the better bet.
          - text: >
              They tie: shrinkage pulls both to the prior mean.
            feedback: >
              Shrinkage pulls each in proportion to its own thinness, and
              neither all the way. They land at $0.567$ and $0.58$.
        feedback: >
          Rank by posterior mean, not raw rate, whenever the samples differ in
          size. The raw ranking sorts partly on luck.

      - part: When the pull should be weak
        ask: >
          A colleague learns the lesson too well and pulls every record
          halfway to $0.5$. Applied to a strategy with $900$ right days out of
          $1000$, what is wrong?
        choices:
          - text: >
              Nothing: shrinkage is a fixed discount for overconfidence.
            feedback: >
              The discount is not fixed. It is $50/(50 + n)$, which for $n =
              1000$ is under $5\%$.
          - text: >
              With $1000$ days the data dominate: the posterior mean is
              $925/1050 \approx 0.88$, not the $0.7$ his rule gives.
            correct: true
            feedback: >
              A thousand days are almost no luck. Shrinkage that ignores the
              sample size throws away the very evidence that earned the
              record.
          - text: >
              He should pull halfway towards $0.9$ instead.
            feedback: >
              The pull is always towards the prior; $0.9$ is the data. The fix
              is a smaller pull, sized by $n$.
        feedback: >
          Heavy shrinkage on thin data, almost none on thick data: the
          fraction does the sizing.
      - ask: >
          The leader's next ten days come in at $6$ right. Your manager says
          the strategy has broken. What do you tell him?
        choices:
          - text: >
              He is right: it dropped from $90\%$ to $60\%$, so something
              changed.
            feedback: >
              Nothing need have changed. The first ten days were selected as
              the best of forty, so they overstated the rate; six of ten is
              close to the $0.567$ you forecast.
          - text: >
              That six of ten is about what the shrunk estimate predicted; the
              nine of ten was mostly luck selected from forty strategies.
            correct: true
            feedback: >
              The fall was foreseeable. The best number in a thin sample
              belongs disproportionately to the luckiest candidate, and the
              next sample regresses towards the centre.
          - text: >
              It proves the prior was wrong, since the record did not hold up.
            feedback: >
              It is what the prior expected. A record that held at nine of ten
              would have been the surprise.
        feedback: >
          Shrinkage and the disappointment that follows a lucky streak are one
          phenomenon seen from two sides.
      - teach: >
          Said aloud: "nine of ten is ten days against a population worth about
          fifty, so I would pull it five-sixths of the way back: call it $57\%$.
          With a thousand days I would barely touch it."

  - node: quant-statistics.bayesian.normal-normal
    hook: >
      Precision, not variance, is the currency a normal-normal update
      actually trades in — every new reading adds directly to a running
      precision total before anyone touches the mean.
    explanation: >
      With a normal prior $N(\mu_0,\sigma_0^{2})$ on $\theta$ and $n$
      independent normal observations of known variance $\sigma^{2}$, the
      posterior is again normal — the defining conjugate fact — and the
      cleanest way to see why is to work in precision, $1/\text{variance}$,
      rather than variance itself: precisions simply add,
      $1/\sigma_0^{2} + n/\sigma^{2}$, one term from the prior and one from
      all $n$ data points combined.

      The posterior mean falls straight out once precision is the unit: it's
      the precision-weighted average of the prior mean and the sample mean,
      $(\mu_0/\sigma_0^{2} + n\bar{x}/\sigma^{2}) / (1/\sigma_0^{2} +
      n/\sigma^{2})$ — each source contributes its mean times its own
      precision, divided by the total precision to keep it an honest
      average.

      The data's contribution scales with $n$, not with a single
      observation's precision alone — ten independent readings carry ten
      times one reading's precision, which is exactly why more data narrows
      the posterior even when each individual measurement is noisy.
    worked: >
      A trader's prior fair-value estimate for a security is 100 points with
      standard deviation 15. Nine independent quotes, each with known noise
      standard deviation 10, average 115. Precisions: prior $1/15^{2} =
      1/225 \approx 0.00444$, data $9/10^{2} = 0.09$, summing to about
      0.09444. Posterior variance is $1/0.09444 \approx 10.59$. Posterior
      mean is $(100/225 + 9\times115/100)/0.09444 \approx (0.444 +
      10.35)/0.09444 \approx 114.28$ — close to the quotes' average, since
      nine quotes carry far more combined precision than the prior.
    interview: >
      "You have a prior estimate and $n$ noisy independent readings — what's
      your updated estimate" wants precisions added first, then the
      precision-weighted mean; naming it "precision-weighted average" out
      loud signals fluency here.
    pitfalls: >
      Averaging variances instead of precisions, or weighting the prior and
      sample mean equally regardless of $n$, both silently misweight the
      two sources. Forgetting that the data's precision scales with $n$
      understates how much $n$ readings actually inform the answer.
    recap: >
      Normal prior plus normal data gives a normal posterior whose
      precisions add and whose mean is the precision-weighted average of
      prior mean and sample mean.
    dialogue:
      - part: A prior and three dealer quotes
        teach: >
          Your prior on the fair value $\theta$ of an illiquid bond is $N(100,
          2^{2})$. Three dealers send quotes, each equal to $\theta$ plus
          independent normal noise with standard deviation $3$. The three
          quotes average $107$.
      - ask: >
          Given $\theta$, what is the variance of the average of the three
          quotes?
        expects: "3"
        hint: >
          Each quote has variance $9$; averaging $n$ independent ones divides
          the variance by $n$.
        feedback: >
          $9/3 = 3$. The average is one reading of $\theta$ with variance $3$,
          a little less noisy than your prior, whose variance is $4$.
      - ask: >
          You now hold two normal readings of $\theta$: the prior, centred at
          $100$ with variance $4$, and the quote average, $107$ with variance
          $3$. Where should your posterior centre sit?
        choices:
          - text: >
              At $103.5$, halfway between them.
            feedback: >
              Halfway treats the two as equally reliable. The quote average has
              the smaller variance, so it deserves the larger say.
          - text: >
              Above $103.5$, nearer $107$.
            correct: true
            feedback: >
              The less noisy reading pulls harder. How much harder is the
              question the algebra answers.
          - text: >
              Below $103.5$, nearer $100$, since the prior came first.
            feedback: >
              Order carries no weight; noise does. The prior is the noisier of
              the two.
        feedback: >
          The direction is clear. The exact point comes from multiplying the
          two densities.
      - reflect: >
          The posterior is proportional to $\exp(-(\theta - 100)^{2}/8) \cdot
          \exp(-(\theta - 107)^{2}/6)$. Look only at the $\theta^{2}$ term in
          the combined exponent. What does it tell you about the posterior's
          shape and its variance, and how did the two variances combine?
        hint: >
          A normal with variance $v$ has $-\theta^{2}/(2v)$ in its exponent.
        answer: >
          The exponent is a quadratic in $\theta$ with $\theta^{2}$
          coefficient $-\frac{1}{2}\left(\frac{1}{4} + \frac{1}{3}\right)$, so
          the posterior is normal, and its $1/\text{variance}$ is $\frac{1}{4}
          + \frac{1}{3}$. The reciprocals of the variances added. Completing
          the square puts the centre at the average of $100$ and $107$ weighted
          by those reciprocals.

      - part: Precisions add
        teach: >
          Call $1/\text{variance}$ the precision. With prior $N(\mu_0,
          \sigma_0^{2})$ and $n$ independent $N(\theta, \sigma^{2})$
          observations, $\sigma^{2}$ known, the posterior is normal with
          precision $\frac{1}{\sigma_0^{2}} + \frac{n}{\sigma^{2}}$ and mean
          $\frac{\mu_0/\sigma_0^{2} + n\bar{x}/\sigma^{2}}{1/\sigma_0^{2} +
          n/\sigma^{2}}$: each source's mean weighted by its precision.
      - ask: >
          What is the posterior precision for the bond?
        expects: "7/12"
        tolerance: 0.0005
        feedback: >
          $\frac{1}{4} + \frac{3}{9} = \frac{1}{4} + \frac{1}{3} =
          \frac{7}{12} \approx 0.583$.
      - ask: >
          What is the posterior mean?
        expects: "104"
        hint: >
          The weights are each precision over $7/12$.
        feedback: >
          The prior gets $\frac{1/4}{7/12} = \frac{3}{7}$ and the quotes
          $\frac{1/3}{7/12} = \frac{4}{7}$, so $\frac{3}{7} \cdot 100 +
          \frac{4}{7} \cdot 107 = \frac{300 + 428}{7} = 104$.
      - ask: >
          What is the posterior standard deviation, to three decimals?
        expects: "1.309"
        tolerance: 0.0005
        feedback: >
          $\sqrt{12/7} \approx 1.309$. Smaller than the prior's $2$ and smaller
          than the quote average's $\sqrt{3} \approx 1.73$: combining two
          readings beats either.

      - part: Precision is the currency
        ask: >
          A trade print reveals $\theta$ with noise standard deviation $1$.
          How many dealer quotes is one such print worth?
        expects: "9"
        feedback: >
          A print has precision $1$; a quote has precision $1/9$. Precision is
          what adds, so one print counts as nine quotes, though its standard
          deviation is only three times smaller.
      - ask: >
          Suppose twelve quotes had arrived instead of three, still averaging
          $107$. What would the posterior mean be, to two decimals?
        expects: "105.89"
        tolerance: 0.005
        feedback: >
          Data precision $12/9 = 4/3$; total $\frac{1}{4} + \frac{4}{3} =
          \frac{19}{12}$. Mean $\frac{100 \cdot 3 + 107 \cdot 16}{19} =
          \frac{2012}{19} \approx 105.89$. Four times the quotes take the
          data's weight from $4/7$ to $16/19$.

      - part: Two ways to misweight
        ask: >
          A colleague says the posterior variance should lie between $3$ and
          $4$, since the posterior is a compromise between the two sources.
          What is wrong?
        choices:
          - text: >
              Nothing: the posterior variance is the average of the two,
              $3.5$.
            feedback: >
              Averaging variances is the slip. Precisions add, so the posterior
              variance is $12/7 \approx 1.71$, below both.
          - text: >
              The *mean* is a compromise; the variance is not. Two independent
              readings make you surer than either, so the variance falls
              below both.
            correct: true
            feedback: >
              $1/(1/4 + 1/3) = 12/7$. Information accumulates; it never
              averages out to a middle level of certainty.
          - text: >
              The posterior variance should be the smaller of the two, $3$.
            feedback: >
              That would mean the prior added nothing. It adds precision
              $1/4$, so the result is below $3$.
        feedback: >
          Means are weighted averages; precisions are sums.
      - ask: >
          It turns out all three dealers mark off the same screen price and
          add only a little noise of their own. What happens to the update you
          just ran?
        choices:
          - text: >
              Nothing changes: three quotes are three quotes.
            feedback: >
              The update assumed independent noise. Shared noise does not
              average away, so the three quotes carry little more than one.
          - text: >
              The mean is still right, only the variance is off.
            feedback: >
              Both are off. The weight $4/7$ on the quotes came from their
              claimed precision; with that precision overstated, the quotes
              pulled the mean too far as well.
          - text: >
              It overstated the quotes' precision: their errors are shared, so
              their average has variance near $9$, not $3$.
            correct: true
            feedback: >
              The $n/\sigma^{2}$ term assumes the noise is independent given
              $\theta$. Correlated readings add much less precision, and the
              posterior should be wider and closer to $100$.
        feedback: >
          Precisions add only for independent information. Counting one
          source three times is the usual way to be overconfident.
      - teach: >
          Said aloud: "prior precision a quarter, three quotes at a ninth each
          give a third, total seven-twelfths. The mean puts four-sevenths on
          the quotes: $104$, with standard deviation about $1.3$."

  - node: quant-statistics.bayesian.precision-weighting
    hook: >
      Any time a desk has two independent reads on the same fair value — its
      own model and the market's quote — this is the one-line rule for
      combining them, and equal-weighting the two leaves money on the table.
    explanation: >
      This is the normal-normal posterior mean stripped of its Bayesian
      framing: given two independent unbiased estimates $\hat{\theta}_1,
      \hat{\theta}_2$ of the same quantity with variances $v_1,v_2$, the
      minimum-variance combination is $(\hat{\theta}_1/v_1 +
      \hat{\theta}_2/v_2)/(1/v_1 + 1/v_2)$ — the same formula as combining a
      prior mean and a sample mean, just with neither estimate singled out
      as "the prior."

      The combined variance, $1/(1/v_1 + 1/v_2)$, is smaller than either
      input variance on its own — merging two independent noisy signals is
      never worse than trusting the better one alone, which is the entire
      payoff of combining them rather than picking a favourite.

      The weight each estimate receives is proportional to its own
      precision, so the more confident source dominates the blend, and equal
      weighting is only correct in the special case where both sources share
      the same variance.
    worked: >
      Two independent fair-value estimates: 50 with standard deviation 4
      ($v_1=16$) and 56 with standard deviation 3 ($v_2=9$). Weights are
      proportional to $1/16$ and $1/9$, normalizing to $9/25=0.36$ and
      $16/25=0.64$. The blend is $0.36\times50 + 0.64\times56 = 18+35.84 =
      53.84$, with combined variance $1/(1/16+1/9) = 144/25 = 5.76$, a
      standard deviation of 2.4 — tighter than either input's 3 or 4, and
      pulled closer to 56 since that estimate is the more precise one.
    interview: >
      "You have your own model's fair value and the market's — how do you
      combine them" wants the precision-weighted formula immediately, plus
      the observation that the blend is more confident than either input
      alone.
    pitfalls: >
      Averaging the two estimates equally, ignoring which one is more
      precise, throws away real information whenever the variances differ.
      Assuming the two estimates are independent when they share a common
      error source overstates how much the combined variance should shrink.
    recap: >
      Combine two independent unbiased estimates by weighting each by its
      own precision — the blend beats both inputs, and the more confident
      source pulls harder.
    dialogue:
      - part: Two marks on one swap
        teach: >
          Your desk's model marks an illiquid swap at $60$, with standard
          deviation $2$. An independent broker marks it at $73$, with standard
          deviation $3$. Both marks are unbiased and their errors are
          independent. Risk wants one number.
      - ask: >
          You average the two equally and report $66.5$. What is the variance
          of that equal-weight blend?
        expects: "3.25"
        hint: >
          $\Var\left(\tfrac{1}{2}A + \tfrac{1}{2}B\right) = \tfrac{1}{4}\Var(A)
          + \tfrac{1}{4}\Var(B)$ for independent $A$, $B$.
        feedback: >
          $\frac{1}{4}(4) + \frac{1}{4}(9) = \frac{13}{4} = 3.25$. Better than
          the model alone, whose variance is $4$.
      - ask: >
          Try $0.7$ on the model and $0.3$ on the broker instead. What is the
          variance of that blend?
        expects: "2.77"
        tolerance: 0.0005
        feedback: >
          $0.49 \cdot 4 + 0.09 \cdot 9 = 1.96 + 0.81 = 2.77$. Leaning on the
          more precise mark beat the equal split by almost half a unit of
          variance.
      - reflect: >
          With weight $w$ on the model, the blend's variance is $4w^{2} + 9(1 -
          w)^{2}$. Which $w$ makes it smallest? Then do it for general
          variances $v_1$ and $v_2$, and say what each weight turns out to be
          proportional to.
        hint: >
          Set the derivative in $w$ to zero.
        answer: >
          $8w - 18(1 - w) = 0$ gives $w = 18/26 = 9/13 \approx 0.69$. In
          general $2v_1 w - 2v_2(1 - w) = 0$ gives $w = \frac{v_2}{v_1 + v_2}
          = \frac{1/v_1}{1/v_1 + 1/v_2}$. Each estimate's weight is proportional
          to its precision, $1/\text{variance}$, so the steadier source gets
          the larger share.

      - part: Weight by precision
        teach: >
          That is the rule for merging two independent unbiased estimates
          $\hat{\theta}_1$, $\hat{\theta}_2$ with variances $v_1$, $v_2$:
          $\frac{\hat{\theta}_1/v_1 + \hat{\theta}_2/v_2}{1/v_1 + 1/v_2}$, with
          variance $\frac{1}{1/v_1 + 1/v_2}$, smaller than either input. Equal
          weights are right only when the variances are equal.
      - ask: >
          What is the precision-weighted mark for the swap?
        expects: "64"
        feedback: >
          Weights $9/13$ and $4/13$: $\frac{9 \cdot 60 + 4 \cdot 73}{13} =
          \frac{540 + 292}{13} = \frac{832}{13} = 64$. The equal split said
          $66.5$, leaning too far towards the noisier broker.
      - ask: >
          What is the variance of that blend?
        expects: "36/13"
        tolerance: 0.0005
        feedback: >
          $\frac{1}{1/4 + 1/9} = \frac{36}{13} \approx 2.769$, just under the
          $2.77$ from your guess of $0.7$. Near the optimum the variance is
          flat, so a rough weight costs little; a wrong direction costs a lot.

      - part: The same rule, in other clothes
        ask: >
          Read the model mark as a prior, $N(60, 2^{2})$, and the broker's mark
          as one observation of the fair value with noise standard deviation
          $3$. What posterior mean does Normal–normal updating give?
        expects: "64"
        feedback: >
          Precisions $1/4$ and $1/9$, the same weights, the same $64$. The
          posterior mean is precision weighting in which one of the two
          estimates happens to be called the prior.
      - ask: >
          A third independent, unbiased mark arrives at $90$, but it is very
          rough: standard deviation $30$. Does folding it in make the blend
          worse?
        choices:
          - text: >
              Yes: $90$ is far from the others, so it drags the blend off.
            feedback: >
              Its weight is $\frac{1/900}{1/4 + 1/9 + 1/900} = \frac{1}{326}$,
              which moves the blend from $64$ to about $64.08$. A rough source
              gets a tiny say.
          - text: >
              Yes: any noisy input adds variance.
            feedback: >
              With equal weights it would. With precision weights the blend's
              variance is $1/(\text{total precision})$, and precision only
              grows: $900/326 \approx 2.761$, down from $2.769$.
          - text: >
              No: it adds a little precision and gets a little weight, so the
              blend improves slightly.
            correct: true
            feedback: >
              Total precision rises from $13/36$ to $326/900$. An independent
              unbiased source can never hurt a precision-weighted blend.
        feedback: >
          Weights proportional to precision make the merge safe: bad sources
          are not excluded, just quietly discounted.
      - ask: >
          Back to two marks. How small would the broker's standard deviation
          have to be for his mark to take $90\%$ of the weight against the
          model's standard deviation of $2$?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          His precision must be nine times the model's $1/4$.
        feedback: >
          $1/v_2 = 9 \cdot \frac{1}{4} = \frac{9}{4}$, so $v_2 = 4/9$ and the
          standard deviation is $2/3$. A $90\%$ share needs three times the
          model's accuracy, not nine.

      - part: When the formula lies
        ask: >
          You learn the broker builds his mark by taking your desk's published
          model output and adjusting it. What happens to the blend?
        choices:
          - text: >
              Nothing: he still has his own noise, so his mark still adds
              information.
            feedback: >
              Some, but his error now contains yours. The formula counts the
              shared part twice.
          - text: >
              The errors are correlated, so the formula overstates the blend's
              precision and the stated $36/13$ is too small.
            correct: true
            feedback: >
              The variance $1/(1/v_1 + 1/v_2)$ assumes independent errors.
              Two marks sharing one error source are closer to one mark than
              two, and the honest variance is larger.
          - text: >
              The blend's centre is biased, but its variance is fine.
            feedback: >
              The variance is the part that breaks first: the formula's
              shrinking variance came entirely from independence.
        feedback: >
          Independent is the load-bearing word. Correlated sources need their
          covariance in the weights.
      - ask: >
          Another broker is very precise, standard deviation $1$, but you know
          his marks run systematically $5$ high. What should you do before
          blending?
        choices:
          - text: >
              Blend as usual: his precision earns him the weight.
            feedback: >
              Then $80\%$ of a $5$-point bias goes straight into your mark.
              Precision measures scatter around his centre, not distance from
              the truth.
          - text: >
              Drop him: a biased source cannot be used.
            feedback: >
              A known bias can be removed. Subtract $5$ and he is the best
              source you have.
          - text: >
              Subtract the $5$ first, then weight by precision.
            correct: true
            feedback: >
              The formula is for *unbiased* estimates. Correct the bias, then
              his precision of $1$ earns him the weight it deserves.
        feedback: >
          Precision weighting needs two things from every input: no known bias,
          and errors independent of the others.
      - teach: >
          Said aloud: "weight each mark by one over its variance. Variances
          four and nine give weights nine-thirteenths and four-thirteenths, so
          $64$, with variance $36/13$, better than either mark alone."

  - node: quant-statistics.bayesian.posterior-predictive
    hook: >
      Quoting the posterior mean's own uncertainty as the uncertainty on the
      next observation is the single most common mistake once someone's
      learned to compute a posterior — the predictive distribution is always
      wider.
    explanation: >
      A posterior tells you about the parameter; forecasting a new data
      point $\tilde{x}$ instead requires averaging the sampling model over
      every value $\theta$ could still be, weighted by how likely the
      posterior says each is: $p(\tilde{x}\mid x) = \int p(\tilde{x} \mid
      \theta)\,\pi(\theta \mid x)\,d\theta$. That integral tracks two
      separate sources of uncertainty, not one.

      This is why the predictive distribution is always at least as wide as
      plugging the posterior mean straight into the sampling model: on top
      of ordinary sampling noise, it also carries whatever uncertainty
      remains about $\theta$ itself. Ignoring that second source and quoting
      a plug-in interval understates how uncertain the forecast really is.

      In this unit's conjugate families the integral is never performed by
      hand. For beta-binomial, the chance the next trial succeeds collapses
      to exactly the posterior mean; for normal-normal, the predictive
      variance is the posterior variance plus the sampling variance, the two
      uncertainties simply summing.
    worked: >
      Continuing the $\mathrm{Beta}(10,20)$ posterior from before (prior
      $\mathrm{Beta}(3,7)$ updated by 7 successes in 20 trials): the chance
      the next single trial succeeds is exactly the posterior mean, $10/30 =
      1/3$ — the integral defining the posterior predictive collapses to a
      number you already had.
    interview: >
      "What's your prediction interval for the next observation" checks
      whether you widen a plug-in interval by the extra parameter
      uncertainty rather than reporting the posterior's own spread, which
      only measures uncertainty about $\theta$, not about the next data
      point.
    pitfalls: >
      Reporting the posterior's spread on $\theta$ as though it were the
      spread on the next observation skips the sampling noise entirely. In
      the normal case, adding standard deviations instead of variances when
      combining posterior and sampling uncertainty gives the wrong number.
    recap: >
      The posterior predictive integrates the sampling model against the
      posterior, always coming out wider than a plug-in guess because it
      carries both parameter uncertainty and sampling noise.
    dialogue:
      - part: A range for tomorrow
        teach: >
          After a month of updating, a desk's posterior on a book's true mean
          daily P&L $\theta$, in thousands, is $N(4, 1^{2})$. Given $\theta$,
          each day's P&L is $N(\theta, 3^{2})$. Risk asks for a $95\%$ range
          for *tomorrow's* P&L.
      - ask: >
          A junior answers $4 \pm 1.96 \cdot 1$, about $(2.0, 6.0)$. What has
          he given a range for?
        choices:
          - text: >
              Tomorrow's P&L, as asked.
            feedback: >
              Even if $\theta$ were known exactly, one day's P&L scatters with
              standard deviation $3$ around it. A range of width $\pm 2$
              cannot hold it $95\%$ of the time.
          - text: >
              The mean daily P&L $\theta$, not any single day's.
            correct: true
            feedback: >
              The posterior describes what you know about $\theta$. Tomorrow is
              one noisy draw around $\theta$, and that noise is missing from his
              range.
          - text: >
              Nothing coherent: a posterior cannot give ranges.
            feedback: >
              It gives a perfectly good range, a credible range for $\theta$.
              The fault is answering a question about $\theta$ when the
              question was about tomorrow.
        feedback: >
          A forecast of the next observation and a statement about the
          parameter are different objects.
      - ask: >
          Write tomorrow as $\theta + \varepsilon$, with $\theta \sim N(4, 1)$
          from the posterior and independent noise $\varepsilon \sim N(0, 9)$.
          What is the variance of tomorrow's P&L?
        expects: "10"
        hint: >
          Variances of independent pieces add.
        feedback: >
          $1 + 9 = 10$: one unit from not knowing $\theta$, nine from the
          day's own noise.
      - ask: >
          So what standard deviation should go into tomorrow's range, to
          three decimals?
        expects: "3.162"
        tolerance: 0.0005
        feedback: >
          $\sqrt{10} \approx 3.162$, and the range is $4 \pm 1.96 \cdot 3.162$,
          about $(-2.2, 10.2)$. A second junior who plugged in $\theta = 4$
          would have used $3$.
      - reflect: >
          The plug-in forecast uses standard deviation $3$; you got $3.162$.
          What is the extra width paying for, and in what situation would it
          stop being a rounding error?
        hint: >
          Compare the posterior's variance with the day's own variance.
        answer: >
          It pays for not knowing $\theta$. Plugging in $4$ pretends the
          parameter is known, so it carries only the day's noise. The extra
          is small here because the posterior variance, $1$, is small next to
          the sampling variance, $9$. With thin data the posterior variance is
          large, and then the plug-in interval badly understates the risk.

      - part: Averaging the model over the posterior
        teach: >
          That forecast is the posterior predictive distribution: $p(\tilde{x}
          \mid x) = \int p(\tilde{x} \mid \theta)\,\pi(\theta \mid x)\,d\theta$,
          the sampling model averaged over everything $\theta$ might still be.
          For normal–normal it is normal with the posterior mean and variance
          $\sigma_{\mathrm{post}}^{2} + \sigma^{2}$. It is always at least as
          wide as the plug-in forecast.
      - ask: >
          A venue's fill probability $p$ has posterior $\mathrm{Beta}(7, 3)$.
          What is the predictive probability that the next order fills?
        expects: "7/10"
        hint: >
          Given $p$, the chance is $p$. Average that over the posterior.
        feedback: >
          $\mathbb{E}[p] = 7/10$. For a single yes-or-no trial, the predictive
          and the plug-in agree: the average of $p$ is the posterior mean.
      - ask: >
          What is the predictive probability that the next *two* orders split,
          one fill and one miss?
        expects: "21/55"
        tolerance: 0.0005
        hint: >
          Given $p$ the chance is $2p(1 - p)$. You need $\mathbb{E}[p^{2}]$,
          which is the variance plus the squared mean.
        feedback: >
          $\mathbb{E}[p^{2}] = \frac{7 \cdot 3}{10^{2} \cdot 11} + 0.49 =
          \frac{28}{55}$, so $2\left(\frac{7}{10} - \frac{28}{55}\right) =
          \frac{21}{55} \approx 0.382$. The plug-in answer is $2 \cdot 0.7 \cdot
          0.3 = 0.42$.
      - ask: >
          Why is the predictive chance of a split, $0.382$, below the plug-in
          $0.42$?
        choices:
          - text: >
              The predictive is always smaller than the plug-in.
            feedback: >
              Not for every event. The chance both orders fill is $\frac{28}{55}
              \approx 0.509$ predictive against $0.49$ plug-in: larger.
          - text: >
              Not knowing $p$ ties the two orders together: if $p$ is high both
              tend to fill, if low both tend to miss, so the split loses mass.
            correct: true
            feedback: >
              Given $p$ the orders are independent; averaged over an uncertain
              $p$ they are positively correlated. Mass moves from the middle to
              the extremes, which is what "wider" means for counts.
          - text: >
              A rounding difference: with exact arithmetic they agree.
            feedback: >
              $21/55$ and $21/50$ are both exact. The gap is
              $\mathrm{Var}(p) = 21/1100$, doubled.
        feedback: >
          Parameter uncertainty is invisible in one trial and shows up as soon
          as you forecast two.

      - part: Quoting the wrong spread
        ask: >
          Back to the book. If risk uses the junior's range $(2.0, 6.0)$ as a
          $95\%$ range for daily P&L, how often will a day fall outside it?
        choices:
          - text: >
              About $5\%$ of days, as advertised.
            feedback: >
              That would need a predictive standard deviation of $1$. With
              $\sqrt{10}$, the half-width $1.96$ is only $0.62$ standard
              deviations.
          - text: >
              About $10\%$ of days.
            feedback: >
              Much worse than that. A half-width of $0.62$ standard deviations
              covers only about $46\%$ of the predictive mass.
          - text: >
              More than half of all days.
            correct: true
            feedback: >
              $2(1 - \Phi(1.96/\sqrt{10})) \approx 2(1 - \Phi(0.62)) \approx
              0.54$. A posterior range quoted as a prediction range is not a
              little too tight; it is wrong.
        feedback: >
          Quoting a prediction interval straight off the posterior is the
          standard mistake, and the miss rate shows why.
      - ask: >
          As the desk accumulates years of data, what does the predictive
          standard deviation for one day tend to?
        choices:
          - text: >
              $0$: with enough data you know everything.
            feedback: >
              That is the posterior standard deviation of $\theta$, which does
              go to $0$. Tomorrow's own noise does not shrink with history.
          - text: >
              $3$, the day's own noise.
            correct: true
            feedback: >
              $\sqrt{\sigma_{\mathrm{post}}^{2} + 9} \to \sqrt{9} = 3$. Data can
              remove parameter uncertainty, never sampling noise.
          - text: >
              It stays at $\sqrt{10}$.
            feedback: >
              The $1$ inside the root is the posterior variance, and it shrinks
              as data arrive. Only the $9$ is permanent.
        feedback: >
          Two sources of uncertainty, and only one of them is yours to reduce.
      - teach: >
          Said aloud: "for the next observation I add the posterior variance
          to the noise variance: one plus nine, so a standard deviation of
          $\sqrt{10}$, about $3.2$ — not the posterior's $1$, and a bit more than
          the plug-in $3$."

  - node: quant-statistics.bayesian.prior-choice
    hook: >
      "Just use a uniform prior, it's uninformative" doesn't survive its own
      reparametrization, and knowing exactly why separates a defensible
      prior from a lazy one.
    explanation: >
      Flatness is a property of the coordinates you happened to write the
      prior in, not of the belief itself. If $p$ is uniform on $[0,1]$, the
      log-odds transform $\log(p/(1-p))$ maps that interval onto the whole
      real line — and a constant density can't exist on an unbounded set at
      all, so whatever shape the log-odds end up having, it manifestly isn't
      flat. The same belief looks maximally noncommittal in one
      parametrization and sharply opinionated in another, so "no
      information" was never a property the prior alone could claim.

      The working discipline sidesteps the whole question of what
      "uninformative" even means: pick a prior mean you'd actually bet on,
      pick a pseudo-count that honestly reflects how much evidence that
      belief is worth, and check whether a different, equally plausible
      prior would have led to a different decision. If it would, the data on
      hand is too thin to act on regardless of which prior gets used.

      One rule survives every parametrization: never put zero density on a
      value that's genuinely possible. A likelihood, however extreme, only
      ever multiplies the prior — it can shrink a small prior weight toward
      zero, but it can never revive a value that started at exactly zero.
    worked: >
      You observe 3 successes in 4 trials and must decide whether to act on
      "the true rate exceeds 0.6." Under a flat $\mathrm{Beta}(1,1)$ prior,
      the posterior is $\mathrm{Beta}(4,2)$, mean $4/6 \approx 0.667$ — act.
      Under a more skeptical $\mathrm{Beta}(5,5)$ prior (worth 10
      pseudo-trials, centred at 0.5), the posterior is $\mathrm{Beta}(8,6)$,
      mean $8/14 \approx 0.571$ — don't act. The decision flips between two
      defensible priors, exactly the signal that 4 trials is too little data
      to have earned the decision either way.
    interview: >
      "Why not just use a flat prior and let the data speak" is answered by
      pointing out flatness isn't parametrization-invariant, then
      demonstrating the stress test — recompute under one alternative
      reasonable prior and see whether the conclusion survives.
    pitfalls: >
      Calling a uniform prior "objective" or "assumption-free" ignores that
      the same belief looks informative under a reparametrization like
      log-odds. Assigning literally zero prior probability to a value that's
      merely thought unlikely is an irreversible mistake — no evidence can
      lift it back off zero.
    recap: >
      A prior is a choice to be defended and stress-tested, not a default —
      flatness depends on parametrization, and zero prior mass is a
      permanent commitment no data can undo.
    dialogue:
      - part: Two analysts who know nothing
        teach: >
          Two analysts both say they have no information about a new
          strategy's daily hit probability $p$. Ann puts a uniform prior on
          $p$. Bo thinks in terms of two good days in a row, $q = p^{2}$, and
          puts a uniform prior on $q$. Each calls their prior uninformative.
      - ask: >
          Under Bo's prior, what is the probability that $p < 0.5$?
        expects: "1/4"
        hint: >
          $p < 0.5$ exactly when $q < 0.25$.
        feedback: >
          $\Pr(p < 0.5) = \Pr(q < 0.25) = 0.25$. Ann says $0.5$. Bo's prior,
          written in terms of $p$, has density $2p$: it leans towards good
          strategies.
      - ask: >
          Which analyst's prior is the uninformative one?
        choices:
          - text: >
              Ann's: $p$ is the natural parameter, and her prior is flat in it.
            feedback: >
              Bo finds $q$ natural, and his prior is flat in $q$. Written in
              terms of $q$, Ann's prior has density $\frac{1}{2\sqrt{q}}$,
              piling up near $q = 0$. Each looks opinionated in the other's
              coordinates.
          - text: >
              Neither: flat in one coordinate is sloped in another, so
              "flat" does not mean "no information".
            correct: true
            feedback: >
              They disagree by a factor of two about $\Pr(p < 0.5)$ while both
              claiming ignorance. Flatness is a property of the coordinate you
              wrote the prior in.
          - text: >
              Bo's: he spreads mass evenly over the more relevant quantity.
            feedback: >
              Relevance is a matter of taste. Ann can say the same about hers,
              and the two priors are not the same belief.
        feedback: >
          The same holds for the log-odds $\log(p/(1 - p))$: uniform in $p$ is
          far from uniform there. "No information" is not a property a prior
          can have in every parametrisation at once.
      - reflect: >
          If flatness cannot certify a prior as neutral, what can you do
          instead, so that the prior you pick is defensible and your decision
          does not hinge on an arbitrary choice?
        hint: >
          Think of what you would say if challenged on the prior, and what you
          would check before acting.
        answer: >
          Stop looking for a neutral prior and choose one you can defend: a
          centre you would actually bet on and a pseudo-count for how much
          that belief is worth. Then stress-test it: rerun the update under a
          different prior a reasonable colleague might hold. If the decision
          survives, the prior did not matter much; if it flips, the data are
          too thin to act on, whichever prior you used.

      - part: Pick a prior, then try to break it
        teach: >
          That is the working discipline for choosing a prior. Pick a mean
          and a pseudo-count you would defend; recompute under a plausible
          alternative; act only if the decision survives. If a canonical
          choice is wanted for a proportion, Jeffreys' $\mathrm{Beta}(1/2,
          1/2)$ is the one that does not depend on the parametrisation. And
          never put zero mass on a value that is possible.
      - ask: >
          The desk deploys a strategy if its posterior mean hit rate exceeds
          $0.55$. It has hit on $14$ of $20$ days. Under a sceptical
          $\mathrm{Beta}(15, 15)$ prior, what is the posterior mean?
        expects: "29/50"
        feedback: >
          $\mathrm{Beta}(29, 21)$, mean $29/50 = 0.58$. Under a flat prior it
          would be $15/22 \approx 0.68$.
      - ask: >
          Under Jeffreys' $\mathrm{Beta}(1/2, 1/2)$, what is the posterior mean
          for the same $14$ of $20$?
        expects: "29/42"
        tolerance: 0.0005
        feedback: >
          $\mathrm{Beta}(14.5, 6.5)$, mean $14.5/21 = 29/42 \approx 0.690$.
          Flat, Jeffreys and sceptical all clear $0.55$: the decision survives
          the stress test, so deploy.
      - ask: >
          A second strategy has hit on $4$ of $6$ days. Under the same
          sceptical $\mathrm{Beta}(15, 15)$, what is its posterior mean?
        expects: "19/36"
        tolerance: 0.0005
        feedback: >
          $\mathrm{Beta}(19, 17)$, mean $19/36 \approx 0.528$, below $0.55$.
          Under a flat prior it is $5/8 = 0.625$, above.
      - ask: >
          So the second strategy clears the bar under the flat prior and fails
          it under the sceptical one. What do you conclude?
        choices:
          - text: >
              Deploy: the flat prior is the objective one, so its answer
              counts.
            feedback: >
              You just saw that flatness is not objectivity. The flat prior is
              one defensible belief among several, and it is the most generous
              of them here.
          - text: >
              Hold off and collect more data: six days cannot settle a
              decision that two reasonable priors disagree on.
            correct: true
            feedback: >
              A flip between defensible priors says the prior is still doing
              the deciding. More days will make the priors agree.
          - text: >
              Do not deploy: the sceptical prior is safer, so its answer counts.
            feedback: >
              Choosing whichever prior gives the cautious answer is a decision
              rule, not inference. The honest finding is that the data do not
              yet decide.
        feedback: >
          The stress test does not choose a prior for you. It tells you
          whether the choice matters.

      - part: Zero is forever
        ask: >
          A risk manager sets a prior on the first strategy's hit rate with
          zero density above $0.8$, reasoning that no strategy is that good.
          The strategy then hits on $30$ of its next $30$ days. What is the
          posterior probability that $p > 0.8$?
        expects: "0"
        feedback: >
          The posterior is prior times likelihood, and the prior is $0$ above
          $0.8$. Zero times anything is zero. Thirty straight hits only pile
          the posterior up against the wall at $0.8$.
      - ask: >
          What should the risk manager have done instead?
        choices:
          - text: >
              Nothing: enough data will eventually overrule the prior.
            feedback: >
              Not this prior. No amount of data can lift a value off zero
              prior mass; the posterior stays capped at $0.8$ forever.
          - text: >
              Put small but positive mass above $0.8$, so strong evidence can
              still reach it.
            correct: true
            feedback: >
              A Beta prior centred low with modest weight does this: it doubts
              rates above $0.8$ without forbidding them, and thirty straight
              hits can then win the argument.
          - text: >
              Use a flat prior, which is always the safe default.
            feedback: >
              Flat is one cure for the zero, but it throws away his real view
              that high rates are rare. The fix is to keep that view and make
              it soft.
        feedback: >
          Unlikely and impossible are different beliefs, and the prior should
          say which one you hold.
      - teach: >
          Said aloud: "flat isn't neutral — it depends on how you parametrise.
          I would pick a mean and a pseudo-count I can defend, rerun under a
          sceptical alternative, and act only if both agree. And I never put
          zero mass on anything that could happen."

  - node: quant-statistics.bayesian.credible-interval
    hook: >
      Every candidate who says "a 95% confidence interval means there's a
      95% chance the parameter is in here" is describing a credible interval
      instead — stating precisely why those differ is the actual test.
    explanation: >
      With a full posterior in hand, a 95% credible interval is any set
      carrying 95% of the posterior's mass — most often the equal-tailed
      interval running from the posterior's 2.5% to 97.5% quantiles, or, for
      a single shortest set, the highest-density region. Its interpretation
      is the intuitive one: given this prior and this data, $\theta$ lies in
      the interval with probability 0.95, a direct statement about $\theta$
      because $\theta$ is, in this framework, genuinely random.

      A confidence interval answers a structurally different question even
      when the numbers happen to match. There, $\theta$ is fixed and the
      interval is what's random — the claim is that the procedure generating
      the interval covers the true $\theta$ 95% of the time across
      hypothetical repetitions, not that this particular interval has a 95%
      chance of containing $\theta$. Once computed, from a frequentist's
      standpoint it either does or doesn't contain $\theta$; there's no
      probability left to assign to it.

      The two coincide numerically in the common case of a normal model with
      a weak prior and large $n$, which is precisely why the misreading is
      so persistent — the number matches, but the sentence describing what
      it means does not transfer across frameworks.
    worked: >
      Suppose updating has already produced a posterior on a parameter
      that's well approximated by a normal shape with mean 0.4 and standard
      deviation 0.05. A 95% equal-tailed credible interval is $0.4 \pm 1.96
      \times 0.05 = 0.4 \pm 0.098$, about $(0.302, 0.498)$ — and because
      $\theta$ itself is the random object here, it's correct to say
      $\theta$ has roughly a 95% chance of lying in that exact range, given
      the prior and data used to build it.
    interview: >
      "What does a 95% credible interval mean, and how does it differ from a
      confidence interval" wants the exact contrast — random parameter
      versus random interval — stated crisply, not "they're basically the
      same."
    pitfalls: >
      Reading a frequentist confidence interval as though it made the
      credible interval's probability statement about the parameter is the
      single most common misreading in applied statistics. Computing a
      credible interval as mean plus or minus 1.96 standard deviations when
      the posterior is visibly skewed ignores that the honest interval need
      not be symmetric at all.
    recap: >
      A credible interval really does contain the parameter with the stated
      probability, given the prior and data; a confidence interval makes a
      claim about the covering procedure instead, and the two only coincide
      by numerical accident.
    dialogue:
      - part: One head, and an interval to report
        teach: >
          A coin of unknown bias $\theta$ gets a uniform prior and is tossed
          once: heads. Prior times likelihood is $1 \cdot \theta$, so the
          posterior density is $2\theta$ on $[0, 1]$, and $\Pr(\theta \le t
          \mid \text{heads}) = t^{2}$. You are asked for an interval that holds
          $\theta$ with probability $0.9$.
      - ask: >
          What posterior probability does the interval $[0.1, 0.9]$ hold?
        expects: "0.8"
        hint: >
          $\Pr(a \le \theta \le b) = b^{2} - a^{2}$.
        feedback: >
          $0.81 - 0.01 = 0.8$. Trimming $0.1$ off each end trims unequal
          amounts of probability: $0.01$ at the bottom, where the density is
          low, and $0.19$ at the top.
      - ask: >
          Cut the interval so that exactly $5\%$ of the posterior lies below it
          and $5\%$ above. What is its lower endpoint?
        expects: "0.2236"
        tolerance: 0.0005
        hint: >
          Solve $t^{2} = 0.05$.
        feedback: >
          $\sqrt{0.05} \approx 0.2236$, and the upper endpoint is $\sqrt{0.95}
          \approx 0.9747$. The interval $(0.224, 0.975)$ holds $0.9$.
      - ask: >
          The interval $[0.316, 1]$, with $0.316 \approx \sqrt{0.1}$, also holds
          posterior probability $0.9$. How does it compare with $(0.224,
          0.975)$?
        choices:
          - text: >
              It is not a valid answer: a $90\%$ interval must leave $5\%$ in
              each tail.
            feedback: >
              Nothing forces equal tails. Any set holding $90\%$ of the
              posterior qualifies; equal tails is one convention.
          - text: >
              It is shorter, because it gives up the low end, where the density
              $2\theta$ is smallest, and keeps the high end, where it is
              largest.
            correct: true
            feedback: >
              Length $0.684$ against $0.751$. Built from the highest density
              downwards, it is the shortest set holding $90\%$.
          - text: >
              It is longer, since it reaches all the way to $1$.
            feedback: >
              $1 - 0.316 = 0.684$, while $0.975 - 0.224 = 0.751$. Reaching an
              end does not make it longer; it is the shorter of the two.
        feedback: >
          Several intervals hold the same probability. Two are standard: equal
          tails, and the highest-density region.
      - reflect: >
          You have been saying "$\theta$ lies in $(0.224, 0.975)$ with
          probability $0.9$". What makes that sentence legitimate here, and
          would it still be legitimate for a frequentist interval with the
          very same endpoints?
        hint: >
          What has a distribution in each framework?
        answer: >
          Here $\theta$ has a posterior distribution, and the sentence is a
          statement about it: the posterior mass of the interval is $0.9$.
          A frequentist treats $\theta$ as fixed and the interval as the random
          object. Once one interval is computed it either contains $\theta$ or
          does not, and the $90\%$ belongs to the procedure that built it, not
          to this interval.

      - part: What the interval claims
        teach: >
          A $90\%$ credible interval is any set holding $90\%$ of the posterior
          mass. By convention it is either equal-tailed, between the $5\%$ and
          $95\%$ posterior quantiles, or the highest-density region, the
          shortest such set. Its reading is the intuitive one: given this prior
          and this data, $\theta$ is inside with probability $0.9$. A
          confidence interval claims something else: of the intervals its
          procedure would produce, $90\%$ cover the fixed true value.
      - ask: >
          A simulation fixes the true bias at $\theta = 0.3$, reruns an
          experiment $1000$ times, and builds a $95\%$ confidence interval
          from each run. On average, how many of the $1000$ intervals contain
          $0.3$?
        expects: "950"
        feedback: >
          $0.95 \cdot 1000 = 950$. That is the whole content of "$95\%$
          confidence": a long-run hit rate of the interval-building procedure,
          with $\theta$ held fixed.
      - ask: >
          One of those $1000$ intervals is $(0.21, 0.37)$. What is the
          probability that it contains the true $\theta$?
        choices:
          - text: >
              $0.95$, its confidence level.
            feedback: >
              The $0.95$ described the procedure across many runs. This
              interval is one finished run, and $\theta = 0.3$ is known in the
              simulation.
          - text: >
              $1$: $\theta$ is $0.3$, and $0.3$ lies inside.
            correct: true
            feedback: >
              In the frequentist reading a computed interval simply contains
              $\theta$ or does not. Another run's interval might miss and score
              $0$; there is no $0.95$ left for any single one.
          - text: >
              It cannot be known without more runs.
            feedback: >
              More runs say more about the procedure. About this interval,
              everything is already known: it contains $0.3$.
        feedback: >
          Confidence is a property of a recipe. Credibility is a property of a
          belief about $\theta$.
      - ask: >
          In which situation are the credible and confidence intervals for the
          same data furthest apart numerically?
        choices:
          - text: >
              A weak prior and a large sample.
            feedback: >
              That is where they nearly coincide: the likelihood dominates the
              posterior, and both intervals hug the same estimate. It is why
              the misreading survives.
          - text: >
              A strong prior and a small sample.
            correct: true
            feedback: >
              Then the posterior sits partly on the prior, and the credible
              interval is pulled towards the prior's centre, while the
              confidence interval uses the data alone.
          - text: >
              They always coincide; only the wording differs.
            feedback: >
              The wording always differs; the numbers coincide only when the
              prior has little say.
        feedback: >
          Matching endpoints never make the two sentences mean the same thing.

      - part: The shortcut that leaves the parameter space
        ask: >
          For the one-head posterior, a colleague takes the mean $2/3$ and the
          standard deviation $\sqrt{1/18} \approx 0.236$ and reports a $95\%$
          interval of $2/3 \pm 1.96 \cdot 0.236$, about $(0.205, 1.129)$. What
          is wrong?
        choices:
          - text: >
              Nothing: mean plus or minus $1.96$ standard deviations is the
              $95\%$ interval.
            feedback: >
              Only for a normal posterior. This one is the triangle $2\theta$,
              and the recipe has put the upper end at $1.129$, a bias no coin
              can have.
          - text: >
              It should use $1.645$, since the posterior is one-sided.
            feedback: >
              Changing the multiplier keeps the wrong shape. The interval must
              come from this posterior's quantiles.
          - text: >
              The posterior is skewed and bounded; take the quantiles instead:
              $(\sqrt{0.025}, \sqrt{0.975}) \approx (0.158, 0.987)$.
            correct: true
            feedback: >
              The honest interval is lopsided around $2/3$ and stays inside
              $[0, 1]$. Symmetric intervals belong to symmetric posteriors.
        feedback: >
          A credible interval is read off the posterior's own quantiles; the
          normal recipe is a shortcut that works only when the posterior is
          close to normal.
      - teach: >
          Said aloud: "a $95\%$ credible interval holds $95\%$ of my posterior,
          so given the prior and data the parameter is in it with probability
          $0.95$. A confidence interval says $95\%$ of intervals built this way
          cover the fixed truth. Same endpoints when the prior is weak and the
          sample big, never the same sentence."
