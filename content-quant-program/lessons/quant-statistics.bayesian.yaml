unit: quant-statistics.bayesian
opening: >
  Bayesian inference treats an unknown parameter as a random variable and
  updates a prior into a posterior every time data arrives — one mechanical
  move underneath every technique in this unit. The arc runs from the raw
  definitions (parameter as random, likelihood, the prior-times-likelihood
  update, and its odds form) through the machinery that makes updating
  tractable in closed form (conjugate families, the beta-binomial and
  normal-normal pairs, and the pseudo-count arithmetic they reduce to) to the
  judgment calls a working Bayesian has to make (the rule of succession,
  shrinkage, choosing and stress-testing a prior, and reading a credible
  interval correctly). It sits right after conditional probability and Bayes'
  theorem in the probability tree, and the frequentist machinery this unit's
  methods get measured against comes later.
lessons:
  - node: quant-statistics.bayesian.parameter-as-random
    hook: >
      The instant an interviewer asks "what's your prior on X," they've
      already committed you to treating an unknown constant as though it had
      a distribution — refusing that framing costs you the rest of the
      conversation.
    explanation: >
      Bayes' theorem, which you already have for two events, reverses
      conditioning: it turns $\Pr(A \mid B)$ into a rearrangement of
      $\Pr(B \mid A)$. The Bayesian stance applies the same idea to a
      parameter $\theta$ instead of an event $B$ — you choose to write
      $\pi(\theta)$, a density over the parameter space, playing the role
      $\Pr(B)$ played before. Nothing about the algebra changes; what changes
      is your willingness to put a distribution on something that used to be
      treated as a fixed constant.

      The consequence is that probability stops meaning "long-run frequency
      of a repeatable procedure" and starts meaning "degree of belief given
      what's currently known." A frequentist can say a procedure covers the
      true, fixed parameter 95% of the time across repeated experiments, but
      never that $\theta$ itself, once fixed, has a 95% chance of lying in a
      particular interval — that sentence requires $\theta$ to be random,
      which only the Bayesian stance grants.

      Practically, "what's your prior" is a request for two numbers: a
      centre you'd actually bet on, and a spread describing how sure you are.
      Both must define a genuine density over the whole parameter space — a
      shape on $[0,1]$ for a probability, a shape on the real line for an
      unbounded quantity — not a single point guess.
    worked: >
      You're pricing a new checkout flow's conversion rate $p$ before any
      data exists. As a frequentist you can only say $p$ is some fixed
      unknown number the flow either does or doesn't have. As a Bayesian you
      commit to a density — say one that puts 90% of its mass between 0.03
      and 0.07, centred near 0.05 — so $\Pr(0.03 \le p \le 0.07) = 0.9$
      becomes a legitimate statement about the parameter itself, not about a
      sampling procedure you haven't run yet.
    interview: >
      "What's your prior on X" or "how confident are you before seeing any
      data" checks whether you answer with a distribution — a centre and a
      spread — rather than a single point guess or a refusal to commit; a
      strong answer also states what evidence would move you off it.
    pitfalls: >
      Answering "what's your prior" with a single number instead of a
      centre-and-spread pair leaves the density unspecified. Treating
      $\Pr(\theta \in [a,b])$ as a claim about repeated trials, rather than
      about belief, undoes the entire framework in the next breath.
    recap: >
      The Bayesian move is putting a genuine density on the unknown parameter
      itself, which turns "degree of belief" into a legitimate probability
      statement no frequentist procedure can make about a fixed parameter.

    steps:
      - teach: >
          A frequentist treats an unknown quantity like a coin's bias $p$ as a fixed
          constant nobody happens to know, and lets probability attach only to how data
          would be sampled — never to the constant itself. The Bayesian move is to treat
          $p$ as a random variable and place a prior distribution $\pi(\theta)$ directly
          on it.
      - teach: >
          That single move changes what a probability sentence can mean. $\Pr(\theta \in
          [a,b]) = 0.9$ becomes a legitimate statement about your belief in $\theta$; a
          frequentist can only make the parallel claim about the *procedure* that produced
          an interval, never about the one fixed parameter sitting inside it.
      - teach: >
          Concretely, stating a prior means committing to a genuine density over the whole
          parameter space — a shape on $[0,1]$ for a probability, a shape on $\mathbb{R}$
          for an unbounded quantity — not a single guess. It has to be a real
          distribution: nonnegative everywhere and integrating to $1$.
      - ask: >
          An analyst reports a 90% interval $(0.04, 0.06)$ for a website's true
          click-through rate, built the frequentist way. Which sentence can she
          legitimately make about it?
        choices:
          - text: >
              There's a 90% chance the true rate lies inside $(0.04, 0.06)$.
            feedback: >
              That's the Bayesian sentence — it puts a probability on the fixed rate
              itself, which the frequentist framework never allows.
          - text: >
              The true rate equals $0.05$ with probability 90%.
            feedback: >
              Same error restated: a fixed constant cannot carry a probability under this
              framework, whatever number is quoted.
          - text: >
              90% of the intervals this procedure builds, across repeated samples, would
              contain the true rate.
            correct: true
            feedback: >
              Right — the randomness lives in the interval-producing procedure, not in the
              fixed rate it targets.
        feedback: >
          Only the Bayesian stance lets probability attach to the parameter itself; the
          frequentist can describe only the long-run behavior of the procedure that
          generated the interval.
      - teach: >
          This is why "what's your prior" is really a request for two numbers, not one: a
          centre you would actually bet on, and a spread describing how sure you are. Both
          are needed to pin down a specific density, not just a location.
      - ask: >
          A candidate asked "what's your prior on the probability this merger closes"
          answers with a single number: $0.6$. What is missing?
        choices:
          - text: >
              Nothing — 0.6 fully specifies the prior.
            feedback: >
              A bare number pins one point; it says nothing about how confident that guess
              is, so it isn't a density over $[0,1]$ at all.
          - text: >
              A spread describing the confidence behind 0.6, so the answer is a full
              density rather than one point.
            correct: true
            feedback: >
              Right — a prior is a shape over the whole parameter space; the centre alone
              under-specifies it.
          - text: >
              The interviewer's own prior, so the two can be averaged.
            feedback: >
              Averaging with someone else's belief isn't the fix; the gap is the missing
              spread on the candidate's own prior.
        feedback: >
          A legitimate prior is a density over the whole parameter space, not a single
          point guess — centre and spread are both required.
      - teach: >
          The reverse mistake is just as common: once $\theta$ carries a distribution,
          treating $\Pr(\theta \in [a,b])$ as a claim about repeated trials rather than
          about belief collapses the Bayesian sentence back into the frequentist one it
          was built to replace.
      - teach: >
          Nothing about the algebra of Bayes' theorem changes when the object being
          conditioned on is a parameter instead of an event — only the willingness to put
          a real distribution on something previously treated as fixed, which is what
          every later step in this unit builds on.

  - node: quant-statistics.bayesian.likelihood
    hook: >
      The likelihood is the one object every formula in this unit multiplies
      against a prior, and mistaking it for a distribution over $\theta$ —
      expecting it to integrate to 1 — breaks every calculation built on top
      of it.
    explanation: >
      Start from the sampling model $p(x \mid \theta)$, the ordinary
      conditional density of the data given the parameter — the same formula
      you'd use to simulate data forward if $\theta$ were known. The
      likelihood function is that identical formula, $L(\theta) = p(x \mid
      \theta)$, but read with the observed data $x$ held fixed and $\theta$
      left free to vary.

      Because it's a function of $\theta$ for one fixed dataset, nothing
      requires it to sum or integrate to 1 over $\theta$ — it's a shape, not
      a probability distribution, and asking "what's the probability that
      $\theta$ equals this value under the likelihood" is a category error
      the notation invites but the definition forbids.

      That freedom is what makes likelihoods easy to work with: any factor
      that doesn't involve $\theta$ can be dropped, since posterior
      comparisons only ever care about the shape as $\theta$ varies, not the
      overall scale. Conditionally independent observations multiply their
      likelihoods, so log-likelihoods add — the chain rule applied one data
      point at a time.
    worked: >
      Flip a coin of unknown bias $p$ five times and see 3 heads, 2 tails.
      The full sampling probability is $\binom{5}{3}p^{3}(1-p)^{2}$, but
      $\binom{5}{3}=10$ doesn't involve $p$, so the likelihood kernel is
      $L(p) = p^{3}(1-p)^{2}$. Compare two candidate biases: $L(0.5) = 0.125
      \times 0.25 = 0.03125$ and $L(0.7) = 0.343 \times 0.09 = 0.03087$ —
      nearly tied, and neither number means anything standalone; only their
      ratio, about 1.012, carries information about which bias the data
      favors.
    interview: >
      "Write down the likelihood for this data" checks two things: that you
      condition on $\theta$ with the data fixed, not the reverse, and that
      you immediately strip the $\theta$-free normalizing constant rather
      than carrying it through unnecessary algebra.
    pitfalls: >
      Treating $L(\theta)$ as though it must integrate to 1 over $\theta$,
      then trying to normalize it before combining with a prior, doubles up a
      step Bayes' theorem already handles. Carrying a $\theta$-free constant
      like $\binom{n}{k}$ through the whole derivation instead of dropping it
      early wastes algebra without changing any conclusion.
    recap: >
      The likelihood is the sampling model read as a function of the
      parameter with the data fixed — a shape you compare by ratio, not a
      distribution, and any $\theta$-free factor is dead weight to drop
      immediately.

    steps:
      - teach: >
          $L(\theta) = p(x \mid \theta)$ is the ordinary sampling density, but read with
          the data $x$ frozen and $\theta$ left to vary — the same formula that would
          simulate data forward if $\theta$ were known, just pointed the other way.
      - teach: >
          Because $x$ is fixed and $\theta$ varies, nothing forces $L(\theta)$ to sum or
          integrate to $1$ over $\theta$ — it is a shape you compare by ratio, not a
          probability distribution over the parameter. Asking "what's the probability
          $\theta$ equals this value under $L$" is a question the definition does not
          support.
      - teach: >
          Flip a coin of unknown bias $p$ six times and see 4 heads, 2 tails. The full
          sampling probability is $\binom{6}{4}p^{4}(1-p)^{2}$, and since
          $\binom{6}{4}=15$ does not involve $p$, it can be dropped, leaving the kernel
          $L(p) = p^{4}(1-p)^{2}$.
      - ask: >
          For that kernel $L(p) = p^{4}(1-p)^{2}$, what is $L(0.5)$?
        expects: "1/64"
        hint: >
          Since $0.5^{4}\cdot 0.5^{2} = 0.5^{6}$, this is just a power of one-half.
        feedback: >
          $L(0.5) = 0.5^{4}(0.5)^{2} = 0.5^{6} = 1/64 = 0.015625$ — a single number,
          meaningful only once compared against another candidate bias.
      - teach: >
          Likelihood values are only ever meaningful in comparison: two candidates'
          likelihoods are compared by their ratio, and any $\theta$-free constant common
          to both cancels in that ratio anyway — exactly why it is safe to drop such
          factors before they are ever computed.
      - ask: >
          Using the kernel $L(p)=p^{4}(1-p)^{2}$ from the six tosses, what is the ratio
          $L(0.6)/L(0.4)$?
        expects: "2.25"
        hint: >
          Write the ratio as $(0.6/0.4)^{2}$ once the shared powers of $p$ and $1-p$
          cancel.
        feedback: >
          $L(0.6)/L(0.4) = (0.6/0.4)^{2} = 1.5^{2} = 2.25$: bias $0.6$ is $2.25$ times as
          consistent with 4 heads in 6 tosses as bias $0.4$ is — the only thing a
          likelihood value means is this kind of ratio.
      - teach: >
          Conditionally independent observations multiply their likelihoods, so taking
          logs turns that product into a sum — log-likelihoods add one observation at a
          time, which is the version of this you can actually accumulate live.
      - ask: >
          Which statement about the likelihood function is correct?
        choices:
          - text: >
              $L(\theta)$ must integrate to 1 over $\theta$, so it should be normalized
              before use.
            feedback: >
              False — $\theta$ is not the variable the sampling model treats as random;
              $L(\theta)$ need not integrate to anything in particular over $\theta$.
          - text: >
              A factor of $L(\theta)$ that does not involve $\theta$ can be dropped
              without changing which value of $\theta$ the likelihood favors.
            correct: true
            feedback: >
              Right — such a factor is the same number for every $\theta$, so it never
              affects the ratio between two candidates.
          - text: >
              Two conditionally independent observations' likelihoods should be averaged,
              not multiplied.
            feedback: >
              They multiply — the joint sampling probability of independent events is the
              product of the individual ones, which is exactly what $L(\theta)$ inherits.
        feedback: >
          A $\theta$-free constant is dead weight: it cancels in every ratio, which is why
          it is standard to drop it before doing any algebra.
      - teach: >
          Every later Bayesian calculation multiplies a prior by exactly this object, so
          treating $L(\theta)$ as a $\theta$-free-constant-stripped shape, not a
          distribution, is what keeps the rest of the unit's algebra clean.

  - node: quant-statistics.bayesian.posterior
    hook: >
      This is the one line that does the actual work of every Bayesian
      calculation in this unit — everything after it is recognizing which
      named family the product of prior and likelihood collapses into.
    explanation: >
      Bayes' theorem restates a familiar fact: multiply prior by likelihood,
      divide by whatever constant makes the result integrate to 1. The
      marginal likelihood $p(x) = \int p(x \mid \theta)\pi(\theta)\,d\theta$
      is exactly that constant — it doesn't depend on $\theta$, so it can
      never distinguish one $\theta$ from another, and dropping it turns an
      equality into the proportionality $\pi(\theta \mid x) \propto
      \pi(\theta)L(\theta)$.

      The five-step recipe compresses to arithmetic: state the prior, write
      the likelihood kernel, multiply and collect powers of $\theta$,
      recognize the result as a named density (reading its normalizer off a
      table instead of integrating), then report the posterior mean and
      spread — the actual answer to nearly every Bayesian interview question.
      Steps three and four are where the real work happens.

      When no named family fits, or the parameter space is a small finite
      list of hypotheses rather than a continuum, step four collapses to
      literally summing the unnormalized weights and dividing — the discrete
      case of the same recipe, no integral required either way.
    worked: >
      A batch of parts comes from one of two machines, equally likely a
      priori: machine A produces defects at rate 0.1, machine B at rate 0.4.
      Inspect one part and find it defective. Prior times likelihood:
      machine A scores $0.5 \times 0.1 = 0.05$, machine B scores $0.5 \times
      0.4 = 0.2$. These sum to 0.25 — no named family needed, just add the
      two numbers — so the posterior is $0.05/0.25 = 0.2$ on machine A and
      $0.2/0.25 = 0.8$ on machine B.
    interview: >
      "Update this prior on the following data" wants the five-step recipe
      stated out loud — prior times likelihood, normalize — and the
      interviewer listens for whether you recognize a named posterior family
      instead of setting up an integral you don't need to solve.
    pitfalls: >
      Actually computing $\int p(x\mid\theta)\pi(\theta)\,d\theta$ by hand
      when the posterior shape is already recognizable wastes time the
      interview doesn't give you. Reporting the unnormalized product
      $\pi(\theta)L(\theta)$ as the posterior, forgetting the final
      normalization, gives numbers that don't sum or integrate to 1.
    recap: >
      Posterior is proportional to prior times likelihood, with the marginal
      likelihood as a $\theta$-free normalizing constant computed last, by
      recognizing a named shape or, in the discrete case, by summing.

    steps:
      - teach: >
          Every later technique in this unit is a special case of one line: multiply prior
          by likelihood, then divide by whatever constant makes the result a genuine
          distribution again. Recognizing that constant, not computing it, is the entire
          skill.
      - teach: >
          Bayes' theorem for a parameter reads $\pi(\theta\mid x) =
          p(x\mid\theta)\pi(\theta)/p(x)$, and the denominator $p(x)=\int
          p(x\mid\theta)\pi(\theta)\,d\theta$ carries no $\theta$ — it can never
          distinguish one $\theta$ from another, so dropping it turns the equality into
          the proportionality $\pi(\theta\mid x)\propto \pi(\theta)L(\theta)$.
      - teach: >
          In the discrete case — a short list of hypotheses instead of a continuum — step
          four of the recipe collapses to literally summing the unnormalized weights and
          dividing, no integral anywhere. Two candidate suppliers, prior weights $0.4$ and
          $0.6$, each get multiplied by their own likelihood of the observed data, and the
          two products are normalized to sum to $1$.
      - ask: >
          Parts come from supplier A (prior $0.4$, defect rate $0.05$) or supplier B
          (prior $0.6$, defect rate $0.2$). One inspected part is defective. What is the
          unnormalized weight, prior times likelihood, for supplier A?
        expects: "0.02"
        hint: >
          Multiply supplier A's prior probability by its defect rate.
        feedback: >
          $0.4\times 0.05=0.02$ — this is prior times likelihood for A, not yet a
          posterior probability, since it hasn't been divided by the normalizing sum.
      - ask: >
          Supplier B's unnormalized weight is $0.6\times0.2=0.12$. What is the posterior
          probability that the defective part came from supplier B?
        expects: "6/7"
        tolerance: 0.0005
        hint: >
          Normalize B's weight against the sum of both suppliers' weights.
        feedback: >
          $0.12/(0.02+0.12) = 0.12/0.14 = 6/7\approx 0.857$ — dividing by the sum of both
          unnormalized weights is exactly the discrete stand-in for dividing by $p(x)$.
      - teach: >
          The five-step recipe compresses whenever a named family is recognized: state the
          prior, write the likelihood kernel, multiply and collect powers, read off the
          normalizer from the matching named density instead of integrating, then report
          the posterior mean and spread.
      - ask: >
          Which is the correct posterior probability for supplier A?
        choices:
          - text: >
              $0.02$, the raw prior-times-likelihood weight
            feedback: >
              That's the unnormalized weight, not a probability — it ignores supplier B's
              competing weight entirely.
          - text: >
              $0.02/0.14 = 1/7$, the weight divided by the sum of both weights
            correct: true
            feedback: >
              Right — normalizing by the sum of both unnormalized weights is exactly the
              discrete stand-in for dividing by $p(x)$.
          - text: >
              $0.4$, since that was the prior
            feedback: >
              That's the prior weight before any data was seen — the whole point of
              updating is that it changes once the defective part is observed.
        feedback: >
          Posterior probability requires dividing every unnormalized weight by the sum of
          all of them — here $0.02/0.14 = 1/7$ for A and $6/7$ for B.
      - teach: >
          Whether the parameter space is a continuum recognized as a named density or a
          short list of discrete hypotheses summed by hand, the pattern is identical:
          multiply prior by likelihood, then rescale so the result is a genuine
          distribution again.

  - node: quant-statistics.bayesian.posterior-odds
    hook: >
      Running a live update in your head — after a trade, a tell, a
      confirming signal — means never touching the normalizing constant at
      all, and the odds form is why that's possible.
    explanation: >
      You already have Bayes' theorem in odds form for two plain events;
      nothing changes when the "events" being compared are hypotheses about a
      parameter. Write posterior-probability Bayes for $H_1$ and separately
      for $H_0$, divide one by the other, and the shared marginal likelihood
      in both denominators cancels exactly, leaving posterior odds equal to
      prior odds times a likelihood ratio.

      That cancellation is the whole appeal: no integral, no normalizing
      constant, ever needs computing. Multiple independent pieces of evidence
      chain by multiplying their likelihood ratios in, and because
      multiplying positive numbers is addition after a log, taking logs turns
      a run of evidence into a running additive score — the only form of
      Bayesian updating that's practical to do without paper.

      Converting back to a probability at the end is one line, $p = O/(1+O)$
      for odds $O$ written as a single ratio; skip it only if the question
      explicitly wants odds.
    worked: >
      Prior odds are 2 to 3 that a trading signal is genuinely predictive
      rather than noise. If predictive, it calls the next day's direction
      correctly with probability 0.7; if noise, with probability 0.5. It's
      right four days running. The likelihood ratio per correct call is
      $0.7/0.5 = 1.4$, so four calls compound to $1.4^{4} \approx 3.842$.
      Posterior odds are $2 \times 3.842 : 3 \approx 7.68:3$, about 2.56 to
      1, giving $\Pr(\text{predictive}) \approx 2.56/3.56 \approx 0.719$.
    interview: >
      "Prior odds are X to Y, each piece of evidence has likelihood ratio
      $r$ — what's the posterior after $n$ pieces" is answered instantly as
      $r^{n}$ times the prior odds, converted to a probability only if
      asked; the interviewer checks you never reach for the marginal
      likelihood.
    pitfalls: >
      Multiplying probabilities directly instead of odds reintroduces the
      normalizing constant the odds form exists to avoid. Applying $r^{n}$
      when the pieces of evidence aren't conditionally independent overstates
      the update — each factor assumes the others add genuinely new
      information.
    recap: >
      Posterior odds equal prior odds times the likelihood ratio, with
      repeated independent evidence compounding that ratio multiplicatively —
      the version of Bayes that needs no normalizing constant.

    steps:
      - teach: >
          Recomputing a full posterior from scratch after every new trade tick, tell, or
          confirming signal is impossible in real time — the odds form of Bayes' theorem
          exists precisely so updating never touches a normalizing constant at all.
      - teach: >
          Write ordinary Bayes for $H_1$ and again for $H_0$ and divide one by the other:
          the shared marginal likelihood in both denominators cancels exactly, leaving
          posterior odds equal to prior odds times a likelihood ratio, $\Pr(H_1\mid
          x)/\Pr(H_0\mid x) = [\Pr(H_1)/\Pr(H_0)]\cdot[p(x\mid H_1)/p(x\mid H_0)]$.
      - teach: >
          Multiple independent pieces of evidence chain by multiplying their likelihood
          ratios into the running odds, and because multiplying positive numbers becomes
          addition after a log, a run of evidence turns into a running additive score —
          the only version of this update that's practical to carry in your head.
      - ask: >
          A desk suspects a pricing model is mis-calibrated. Prior odds are $1$ to $4$
          that it is. If mis-calibrated, an outlier P&L day occurs with probability $0.3$;
          if fine, with probability $0.1$. What is the likelihood ratio for one outlier
          day?
        expects: "3"
        hint: >
          Divide the mis-calibrated probability by the fine probability.
        feedback: >
          $0.3/0.1 = 3$ — an outlier day is three times as likely under "mis-calibrated"
          as under "fine".
      - ask: >
          Three outlier days occur in a row, each conditionally independent given the
          model's true state. What are the posterior odds, mis-calibrated to fine, written
          as the single ratio $O$ in "$O$ to $1$"?
        expects: "6.75"
        hint: >
          Multiply the prior odds ratio $1/4$ by the cubed likelihood ratio $3^{3}$.
        feedback: >
          $3^{3}=27$, and $(1/4)\times 27 = 27/4 = 6.75$ — posterior odds of $6.75$ to
          $1$, i.e. $27$ to $4$, favoring a mis-calibrated model.
      - ask: >
          Convert those posterior odds to a probability that the model is mis-calibrated.
        expects: "27/31"
        tolerance: 0.0005
        hint: >
          $p = O/(1+O)$ using $O=6.75$, or equivalently $27/(27+4)$ from the two odds
          numbers directly.
        feedback: >
          $p = 27/(27+4) = 27/31\approx 0.871$ — the same answer either from $O/(1+O)$
          with $O=6.75$ or directly from the $27$-to-$4$ odds.
      - teach: >
          The odds form buys its convenience by working entirely in ratios: multiplying
          raw probabilities together instead of odds silently reintroduces the normalizing
          constant the method exists to avoid, and compounding a likelihood ratio across
          evidence that shares a common cause overstates the update, since each factor
          assumes the others are genuinely new information.
      - teach: >
          Posterior odds are prior odds times a likelihood ratio, evidence compounds by
          multiplication (addition in logs), and converting back to a probability is the
          one extra line — needed only when the question asks for it.

  - node: quant-statistics.bayesian.sequential-updating
    hook: >
      Realizing you don't need to store the raw history, only the current
      posterior, is the moment Bayesian updating stops being a batch
      calculation and starts being a live one.
    explanation: >
      Bayes' theorem doesn't care how many observations you multiply into the
      likelihood at once. If $x_1$ and $x_2$ are conditionally independent
      given $\theta$, the batch posterior is proportional to $\pi(\theta)
      p(x_1 \mid \theta) p(x_2 \mid \theta)$ — and updating once on $x_1$,
      then feeding that result back in as the prior for $x_2$, multiplies in
      exactly the same two factors, just in two passes.

      Two things follow. The order the evidence arrives in doesn't matter,
      since the product is the same either way — only the final combination
      of factors decides the posterior. And the current posterior is a
      complete summary of everything observed so far: nothing about the raw
      data needs to be kept, because feeding the posterior forward as the
      next prior reproduces exactly what a full recomputation would give.

      This is the formal justification for revising a running belief one
      observation at a time rather than waiting to recompute from scratch —
      a quote gets revised after every fill, a model's confidence after every
      new signal, without ever reopening the earlier data.
    worked: >
      Two candidate machines, prior 50/50: A defects at rate 0.1, B at
      0.4. Inspect two parts, both defective. Batch: likelihoods $0.1^{2} =
      0.01$ and $0.4^{2} = 0.16$, giving posterior weights 0.005 and 0.08,
      which normalize to $\Pr(B) = 0.08/0.085 = 16/17 \approx 0.941$.
      Sequential: after the first defect, $\Pr(B) = 0.2/0.25 = 0.8$; feeding
      that in as the new prior for the second defect gives weights $0.2
      \times 0.1 = 0.02$ and $0.8 \times 0.4 = 0.32$, normalizing to
      $0.32/0.34 = 16/17$ — identical.
    interview: >
      "Do you need to see all the data at once, or can you update as it
      arrives" tests whether you can state that batch and sequential
      updating agree exactly under conditional independence, and that the
      running posterior alone is a sufficient summary.
    pitfalls: >
      Re-deriving the posterior from scratch every time a new observation
      arrives, instead of feeding the current posterior in as the next
      prior, is correct but wastes the entire point of the result. The
      equivalence requires conditional independence given $\theta$ — a
      repeated read from the same broken sensor breaks the clean
      multiplication.
    recap: >
      Updating on a batch of conditionally independent data at once, or one
      observation at a time with each posterior feeding forward as the next
      prior, gives exactly the same answer either way.

    steps:
      - teach: >
          The moment you realize you don't need to store the raw history, only the current
          posterior, updating stops being a batch calculation run once at the end of the
          day and becomes a live one run after every new observation.
      - teach: >
          If $x_1$ and $x_2$ are conditionally independent given $\theta$, the batch
          posterior is proportional to $\pi(\theta)p(x_1\mid\theta)p(x_2\mid\theta)$ — and
          updating once on $x_1$, then feeding that posterior back in as the prior for
          $x_2$, multiplies in exactly the same two factors, just across two passes
          instead of one.
      - teach: >
          Two machines, prior $0.3$ on A and $0.7$ on B, with defect rates $0.2$ and
          $0.05$. Inspect two parts and find both defective — the same two likelihood
          factors get multiplied in whether both parts are processed at once or the update
          is run twice in a row.
      - ask: >
          Processing both defects as one batch: A's unnormalized weight is $0.3\times
          0.2^{2}$ and B's is $0.7\times 0.05^{2}$. What is A's unnormalized weight?
        expects: "0.012"
        hint: >
          $0.3\times0.04$.
        feedback: >
          $0.3\times 0.2^{2}=0.3\times0.04=0.012$.
      - ask: >
          Now update sequentially instead: after only the first defective part, what is
          the posterior probability the parts came from machine A?
        expects: "12/19"
        tolerance: 0.0005
        hint: >
          Normalize $0.3\times0.2$ against $0.3\times0.2+0.7\times0.05$.
        feedback: >
          $0.06/(0.06+0.035)=0.06/0.095=12/19\approx0.632$ — this posterior now becomes
          the prior for the second part.
      - ask: >
          Feed that $12/19$ forward as the new prior and update on the second defective
          part. What is the final posterior probability of machine A?
        expects: "48/55"
        tolerance: 0.0005
        hint: >
          Multiply $12/19$ by $0.2$ for A and $7/19$ by $0.05$ for B, then normalize the
          two.
        feedback: >
          Normalizing gives $48/55\approx0.873$ for A — identical to updating on both
          defects at once, exactly as the equivalence predicts.
      - teach: >
          Two consequences follow: the order conditionally independent evidence arrives in
          never matters, since the product of factors is the same either way, and the
          running posterior alone is a complete summary — nothing about the raw data needs
          to be kept once it has been folded in.
      - teach: >
          The equivalence leans entirely on conditional independence given $\theta$: a
          second reading from the same stuck sensor, or a question that only rephrases the
          first, isn't new information and breaks the clean multiplication, even though
          re-deriving from scratch each time stays safe, just wasteful.
      - teach: >
          Whether a full batch is computed at the end or the running posterior is revised
          after every observation, conditionally independent evidence produces exactly the
          same answer — the formal justification for moving a quote after every fill
          instead of waiting until end of day.

  - node: quant-statistics.bayesian.conjugate
    hook: >
      Conjugacy is the difference between an interview answer you can
      compute in your head and one that needs an integral you were never
      going to finish in the time given.
    explanation: >
      A family of priors is conjugate to a likelihood when multiplying a
      member of the family by the likelihood always lands back inside the
      same family — only the parameters move, never the shape. Since
      posterior is proportional to prior times likelihood, this is a
      statement about kernels: if the prior kernel and the likelihood kernel
      are both powers of the same building blocks, their product is too, and
      you read off the new parameters by matching exponents instead of
      integrating anything.

      The standard pairs cover most of what interviews ask: Beta prior with
      a Bernoulli or binomial likelihood, Gamma prior with a Poisson
      likelihood, normal prior with a normal likelihood of known variance. In
      each case the update is literal bookkeeping — add successes and
      failures to the Beta's two parameters, add counts and exposure to the
      Gamma's.

      The prior's parameters then read as pseudo-observations: a
      $\mathrm{Beta}(a,b)$ prior behaves exactly like having already seen
      $a+b$ imaginary tosses, $a$ of which came up heads, before any real
      data arrived. That reading is what makes a chosen prior defensible —
      you can state, out loud, how many observations your belief is worth.
    worked: >
      Take a $\mathrm{Beta}(3,5)$ prior on a success probability $p$, kernel
      $p^{2}(1-p)^{4}$, and observe 4 successes and 1 failure in 5 trials,
      likelihood kernel $p^{4}(1-p)^{1}$. Multiplying kernels adds
      exponents: $p^{2+4}(1-p)^{4+1} = p^{6}(1-p)^{5}$, exactly a
      $\mathrm{Beta}(7,6)$ kernel — no integral, just $3+4=7$ and $5+1=6$.
      The prior's $3+5=8$ pseudo-tosses is what it means for the Beta
      parameters to already carry a sample size before any data arrives.
    interview: >
      "Why do people use Beta priors for probabilities" or "what does
      conjugate mean" wants the kernel-matching argument in one sentence —
      the posterior stays in the same family because both prior and
      likelihood are powers of $p$ and $1-p$ — followed by the pseudo-count
      reading.
    pitfalls: >
      Assuming every prior is conjugate to every likelihood is false — most
      pairs aren't, and outside the standard list you're back to numerical
      integration or simulation. Conjugacy guarantees the family is
      preserved, not that the update is trivial to state without checking
      which parameter absorbs which piece of the data.
    recap: >
      A conjugate prior and likelihood multiply into a posterior in the same
      family, so updating is just moving parameters — usually by adding
      counts — never re-deriving a shape from scratch.

    steps:
      - teach: >
          Conjugacy is the difference between reading a posterior off in one line and
          setting up an integral you were never going to finish inside an interview's time
          limit.
      - teach: >
          A family of priors is conjugate to a likelihood when multiplying any member of
          the family by the likelihood lands back inside the same family — only the
          parameters move, never the shape. Since posterior is proportional to prior times
          likelihood, this is purely a statement about kernels: matching powers of the
          same building blocks is enough, with no integral required.
      - teach: >
          The standard pairs cover nearly everything interviews ask: Beta prior with a
          Bernoulli or binomial likelihood, Gamma prior with a Poisson likelihood, normal
          prior with a normal likelihood of known variance. In each case updating is
          literal bookkeeping — add successes and failures to the Beta's two parameters,
          add counts and exposure to the Gamma's.
      - ask: >
          A $\mathrm{Beta}(2,6)$ prior has kernel $p^{1}(1-p)^{5}$. You observe $3$
          successes and $2$ failures, with likelihood kernel $p^{3}(1-p)^{2}$. What power
          of $p$ does the product carry?
        expects: "4"
        hint: >
          Add the two exponents on $p$.
        feedback: >
          $1+3=4$, so the product carries $p^{4}$ — the new Beta's first parameter is one
          more than this, i.e. $5$.
      - ask: >
          Continuing that update, what is the second parameter, $b$, of the resulting
          posterior $\mathrm{Beta}(a,b)$?
        expects: "8"
        hint: >
          Add the exponent on $(1-p)$, which is $5+2=7$, to get $b-1=7$.
        feedback: >
          $5+2=7$ on $(1-p)$, so $b=8$: the posterior is $\mathrm{Beta}(5,8)$, found
          purely by adding successes to $a$ and failures to $b$.
      - teach: >
          The prior's own parameters read as pseudo-observations: a $\mathrm{Beta}(a,b)$
          prior behaves exactly like having already seen $a+b$ imaginary tosses, $a$ of
          them heads, before any real data arrived — which is what makes a chosen prior
          defensible: you can state, out loud, how many observations it's worth.
      - ask: >
          Which statement about conjugacy is correct?
        choices:
          - text: >
              Every prior is conjugate to every likelihood, since Bayes' theorem always
              produces some posterior.
            feedback: >
              Bayes' theorem always produces *a* posterior, but only for the standard
              pairs does that posterior stay in the same family as the prior — most pairs
              aren't conjugate at all.
          - text: >
              Conjugacy guarantees the posterior family is preserved, but which parameter
              absorbs which piece of data still has to be worked out.
            correct: true
            feedback: >
              Right — knowing the family survives doesn't hand you the bookkeeping for
              free; matching exponents (or the equivalent) still has to be done.
          - text: >
              A $\mathrm{Beta}(2,6)$ prior is worth $2$ pseudo-tosses.
            feedback: >
              The pseudo-count is $a+b=8$, not $a$ alone — both parameters count as
              imaginary observations.
        feedback: >
          Conjugacy is a guarantee about the *family*, not a guarantee that the update is
          obvious without checking which parameter each piece of data feeds — and the
          pseudo-count is always $a+b$.
      - teach: >
          Whenever the prior and likelihood kernels are built from the same powers, the
          posterior is found by matching exponents and moving parameters — never by
          re-deriving a shape or touching an integral.

  - node: quant-statistics.bayesian.beta-prior
    hook: >
      Every Beta-prior problem reduces to picking two numbers, and the
      numbers that matter are never $a$ and $b$ directly — they're the mean
      you'd bet on and the sample size your belief is worth.
    explanation: >
      You already know the Beta density and its moments; what earns Beta a
      place as the default prior on $[0,1]$ is a reparametrization of those
      same two numbers into ones a person can actually choose. Instead of
      picking $a$ and $b$ directly, fix the mean $a/(a+b)$ you'd defend as
      your best guess, and separately fix the pseudo-count $a+b$, how many
      imaginary observations that guess is worth — then solve back for $a$
      and $b$.

      This is also why the special cases matter: $\mathrm{Beta}(1,1)$ is the
      flat, maximally uncommitted case (mean 0.5, pseudo-count only 2),
      raising $a+b$ while holding the mean fixed tightens the density around
      that mean without moving its centre, and $\mathrm{Beta}(1/2,1/2)$ is
      the U-shaped Jeffreys prior that pushes mass toward the two extremes
      rather than the middle.

      The mode formula $(a-1)/(a+b-2)$, valid only for $a,b>1$, is worth
      flagging as a trap: below that threshold the density isn't even
      unimodal in the interior, so quoting a mode there is meaningless.
    worked: >
      You want a prior on a conversion rate centred at 0.3 and worth 10
      pseudo-observations. Solve $a+b=10$ and $a/(a+b)=0.3$: $a=3$, $b=7$,
      so the prior is $\mathrm{Beta}(3,7)$. Its mean is $3/10=0.3$ by
      construction; its mode is $(3-1)/(3+7-2)=2/8=0.25$, pulled below the
      mean since the density is right-skewed with $b>a$; its variance is
      $\frac{3 \times 7}{10^{2}\times 11}=21/1100\approx 0.0191$, a standard
      deviation near 0.138.
    interview: >
      "How would you set a Beta prior for this probability" wants you to
      name a defensible mean and pseudo-count, solve for $a$ and $b$ on the
      spot, and state at least one moment — the interviewer checks you
      parametrize by belief, not by memorized $a,b$ values.
    pitfalls: >
      Picking $a$ and $b$ directly by intuition, without checking what mean
      and pseudo-count they imply, usually produces an accidentally over- or
      under-confident prior. Quoting the mode formula when $a\le 1$ or $b\le
      1$ reports a number for a density that doesn't have an interior
      maximum there.
    recap: >
      Parametrize a Beta prior by the mean you'd bet on and the pseudo-count
      your belief is worth, then solve for $a$ and $b$ — not the other way
      around.

    steps:
      - teach: >
          Every Beta-prior problem an interview poses reduces to picking two numbers, and
          the two that matter are never $a$ and $b$ themselves — they're a mean you'd
          actually bet on and a pseudo-count saying how many observations that belief is
          worth.
      - teach: >
          Instead of choosing $a$ and $b$ directly, fix the mean $a/(a+b)$ you'd defend as
          your best guess and the pseudo-count $a+b$, the number of imaginary observations
          that guess is worth, then solve the two equations back for $a$ and $b$.
      - teach: >
          $\mathrm{Beta}(1,1)$ is the flat, maximally uncommitted case — mean $0.5$, but a
          pseudo-count of only $2$ — and raising $a+b$ while holding the mean fixed
          tightens the density around that same centre without moving it;
          $\mathrm{Beta}(1/2,1/2)$ instead pushes mass toward the two extremes, the
          U-shaped Jeffreys prior.
      - ask: >
          You want a prior on a fill probability centred at $0.4$ and worth $15$
          pseudo-observations. What is $a$?
        expects: "6"
        hint: >
          $a = \text{mean}\times\text{pseudo-count}$.
        feedback: >
          $a = 0.4\times15 = 6$, and $b = 15-6=9$: the prior is $\mathrm{Beta}(6,9)$.
      - ask: >
          For that $\mathrm{Beta}(6,9)$ prior, what is its mode, $(a-1)/(a+b-2)$?
        expects: "5/13"
        tolerance: 0.0005
        hint: >
          $(6-1)/(15-2)$.
        feedback: >
          $(6-1)/(6+9-2)=5/13\approx0.3846$ — below the mean of $0.4$, since $b>a$ makes
          the density right-skewed.
      - teach: >
          That mode formula only holds for $a,b>1$: below that threshold the density isn't
          unimodal in the interior at all, so quoting a mode there — for a
          $\mathrm{Beta}(1/2,1/2)$ prior, say — reports a number for a shape that doesn't
          have one.
      - ask: >
          A candidate is asked for a Beta prior on a probability and answers "let's use
          $\mathrm{Beta}(0.5, 3)$" with no further justification. What's the strongest
          objection?
        choices:
          - text: >
              Beta priors can't have a parameter below 1.
            feedback: >
              They can — $\mathrm{Beta}(1/2,1/2)$ is a standard named case. Parameters
              below 1 are legal, just differently shaped.
          - text: >
              Nothing was said about what mean or pseudo-count those numbers imply, so the
              choice can't be defended.
            correct: true
            feedback: >
              Right — $a=0.5,b=3$ implies a mean of $1/7$ and a pseudo-count of $3.5$;
              picking $a,b$ by intuition without checking what they imply is exactly the
              failure mode this reparametrization exists to prevent.
          - text: >
              The mode formula gives a clean number for this prior, so it's fine.
            feedback: >
              The mode formula needs $a,b>1$; with $a=0.5$ it doesn't even apply, so this
              isn't a valid defense.
        feedback: >
          Picking $a$ and $b$ directly, without checking the mean and pseudo-count they
          imply, is the standard way an accidentally over- or under-confident prior slips
          through.
      - teach: >
          Parametrize a Beta prior by the mean you'd bet on and the pseudo-count your
          belief is worth, then solve for $a$ and $b$, and treat the mode formula as valid
          only once both parameters clear $1$.

  - node: quant-statistics.bayesian.beta-binomial
    hook: >
      This is the single calculation every conjugate-prior interview
      question is secretly asking you to reproduce — memorize the mechanics
      here and every Beta-related question in this unit becomes an instance
      of it.
    explanation: >
      Multiply the Beta prior's kernel by the binomial likelihood's kernel
      and collect powers of $p$: $p^{a-1}(1-p)^{b-1} \cdot p^{k}(1-p)^{n-k} =
      p^{a+k-1}(1-p)^{b+n-k-1}$, precisely the kernel of a
      $\mathrm{Beta}(a+k,\,b+n-k)$ density. Reading off the new parameters is
      arithmetic, not integration: heads get added to $a$, tails get added
      to $b$.

      The posterior mean $(a+k)/(a+b+n)$ is worth stating immediately once
      the new parameters are known, since it's usually the actual number an
      interview question wants. It's always a compromise between the prior's
      belief and what the data alone would say — a fact the next step in
      this unit turns into an explicit formula.
    worked: >
      Continue with the $\mathrm{Beta}(3,7)$ prior from before (mean 0.3,
      worth 10 pseudo-tosses) and observe 7 successes in 20 new trials. Add
      successes to $a$ and failures to $b$: posterior is
      $\mathrm{Beta}(3+7,\,7+13) = \mathrm{Beta}(10,20)$. The posterior mean
      is $10/30 = 1/3 \approx 0.333$, and the posterior variance is
      $\frac{10 \times 20}{30^{2}\times 31} = 200/27900 \approx 0.00717$, a
      standard deviation near 0.0847. The raw sample proportion was $7/20 =
      0.35$; belief lands just short of it, pulled toward the prior's 0.3.
    interview: >
      "You have a Beta prior and observe $k$ successes in $n$ trials — what's
      the posterior" is answered in one line, $\mathrm{Beta}(a+k, b+n-k)$,
      immediately followed by the mean; a good follow-up asks for the
      variance too, testing whether you have the Beta moment formulas on
      hand.
    pitfalls: >
      Adding $k$ to both $a$ and $b$, instead of adding the failures $n-k$
      to $b$, is the most common bookkeeping slip. Reporting the raw sample
      proportion $k/n$ as the answer, forgetting the prior contributed
      anything, throws away the entire point of the update.
    recap: >
      A Beta prior updated by $k$ successes in $n$ trials is exactly
      $\mathrm{Beta}(a+k, b+n-k)$ — add heads to $a$, tails to $b$ — with
      posterior mean $(a+k)/(a+b+n)$.

    steps:
      - teach: >
          This is the one calculation every conjugate-prior interview question is quietly
          asking you to reproduce — get comfortable here and every Beta-related question
          in this unit becomes an instance of it.
      - teach: >
          Multiply the Beta prior's kernel by the binomial likelihood's kernel and collect
          powers of $p$: $p^{a-1}(1-p)^{b-1}\cdot p^{k}(1-p)^{n-k} =
          p^{a+k-1}(1-p)^{b+n-k-1}$, exactly the kernel of $\mathrm{Beta}(a+k,\,b+n-k)$ —
          heads add to $a$, tails add to $b$, and nothing is ever integrated.
      - teach: >
          Continue the $\mathrm{Beta}(6,9)$ prior from before (mean $0.4$, worth $15$
          pseudo-tosses) and observe $9$ successes in $15$ new trials. The $6$ failures
          add to $b$ and the $9$ successes add to $a$, so the posterior is
          $\mathrm{Beta}(6+9,\,9+6) = \mathrm{Beta}(15,15)$.
      - ask: >
          For that posterior $\mathrm{Beta}(15,15)$, what is the posterior mean?
        expects: "0.5"
        hint: >
          $(a+k)/(a+b+n) = 15/30$.
        feedback: >
          $15/30=0.5$ — the fresh data pulled the prior's $0.4$ mean past the sample
          midpoint, landing exactly at $0.5$.
      - ask: >
          What is the raw sample proportion of successes in those $15$ new trials?
        expects: "3/5"
        tolerance: 0.0005
        hint: >
          $9/15$ simplifies.
        feedback: >
          $9/15=3/5=0.6$ — higher than the posterior mean of $0.5$, since belief is still
          anchored partly by the $0.4$-centred prior.
      - teach: >
          The posterior mean is always a compromise between what the prior believed and
          what the fresh data alone would say — never equal to either one outright once
          both carry real weight, a fact the next step in this unit turns into an explicit
          formula.
      - ask: >
          A prior $\mathrm{Beta}(4,4)$ is updated by $6$ successes and $2$ failures. What
          is the resulting posterior?
        choices:
          - text: >
              $\mathrm{Beta}(10,6)$
            correct: true
            feedback: >
              Right — add the $6$ successes to $a$: $4+6=10$; add the $2$ failures to $b$:
              $4+2=6$.
          - text: >
              $\mathrm{Beta}(6,10)$
            feedback: >
              This swaps successes and failures — $6$ successes belong added to $a$, not
              $b$.
          - text: >
              $\mathrm{Beta}(4,4)$ scaled by the sample proportion
            feedback: >
              The update adds counts to the existing parameters; it never rescales them by
              a proportion.
        feedback: >
          Add successes to $a$ and failures to $b$ — $\mathrm{Beta}(4+6,\,4+2)=
          \mathrm{Beta}(10,6)$ — the bookkeeping is the entire computation.
      - teach: >
          A Beta prior updated by $k$ successes in $n$ trials is
          $\mathrm{Beta}(a+k,\,b+n-k)$ with posterior mean $(a+k)/(a+b+n)$ — the single
          mechanical fact underneath nearly every Beta-conjugate interview question.

  - node: quant-statistics.bayesian.posterior-mean-weights
    hook: >
      Whenever an interviewer asks how much a small sample should move your
      belief, this decomposition is the answer they want — a literal
      weighted average, with the weights spelled out in pseudo-counts.
    explanation: >
      Split the beta-binomial posterior mean algebraically:
      $(a+k)/(a+b+n)$ rewrites as $[(a+b)/(a+b+n)]\cdot[a/(a+b)] +
      [n/(a+b+n)]\cdot[k/n]$, exactly a weighted average of the prior mean
      $a/(a+b)$ and the sample proportion $k/n$, with weights $(a+b)/(a+b+n)$
      and $n/(a+b+n)$ that sum to 1 by construction.

      The weights are the whole story: the prior's influence is proportional
      to its own pseudo-count $a+b$, and the data's influence is
      proportional to the real sample size $n$, competing on equal footing
      in the same denominator. As $n$ grows without bound the data weight
      tends to 1 and the posterior mean converges to the sample proportion
      regardless of where the prior started; for small $n$ the prior
      dominates.

      This decomposition turns "should I trust this early result" into an
      arithmetic question — compute the two weights, and how much the data
      has actually moved your belief is right there as a ratio.
    worked: >
      Continue the $\mathrm{Beta}(3,7)$ prior (pseudo-count 10) updated by 7
      successes in 20 trials. Weights are $10/30=1/3$ for the prior and
      $20/30=2/3$ for the data. Check: $(1/3)(0.3) + (2/3)(0.35) = 0.1 +
      0.2333\ldots = 1/3 \approx 0.333$, matching the posterior mean computed
      directly from $\mathrm{Beta}(10,20)$ — the data, carrying twice the
      prior's weight, pulls the answer most of the way from 0.3 toward 0.35,
      but not all the way.
    interview: >
      "How much should this sample move your prior belief" is answered by
      naming the two weights, pseudo-count over total and sample size over
      total, and computing the actual convex combination — not just saying
      "somewhere in between."
    pitfalls: >
      Weighting the prior and data equally regardless of their pseudo-counts
      ignores exactly the information the formula is built to use.
      Forgetting that the weights must sum to 1 risks a decomposition that
      doesn't reconstruct the actual posterior mean.
    recap: >
      The posterior mean is a weighted average of the prior mean and the
      sample proportion, weighted by pseudo-count against real sample size —
      the honest measure of how much a given amount of data should move you.

    steps:
      - teach: >
          When an interviewer asks how much a small sample should move a prior belief,
          this decomposition is the answer they're fishing for — a literal weighted
          average with the weights spelled out in pseudo-counts.
      - teach: >
          Splitting the beta-binomial posterior mean algebraically, $(a+k)/(a+b+n)$
          rewrites as $[(a+b)/(a+b+n)]\cdot[a/(a+b)] + [n/(a+b+n)]\cdot[k/n]$ — exactly a
          weighted average of the prior mean $a/(a+b)$ and the sample proportion $k/n$,
          with weights that sum to $1$ by construction.
      - teach: >
          The weights are the whole story: the prior's share is proportional to its own
          pseudo-count $a+b$, the data's share to the real sample size $n$, competing in
          the same denominator — so as $n$ grows without bound the data weight tends to
          $1$ and the posterior mean converges to the sample proportion no matter where
          the prior started.
      - ask: >
          A $\mathrm{Beta}(4,16)$ prior (pseudo-count $20$, mean $0.2$) is updated by $5$
          successes in $10$ trials. What weight does the prior carry, $(a+b)/(a+b+n)$?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          $20/(20+10)$.
        feedback: >
          $20/30=2/3$ — the prior, worth $20$ pseudo-observations, outweighs the $10$ real
          ones two to one.
      - ask: >
          What is the raw sample proportion $k/n$ in those $10$ trials?
        expects: "0.5"
        hint: >
          $5/10$.
        feedback: >
          $5/10=0.5$.
      - ask: >
          Using those two weights and the prior mean $0.2$, what is the weighted-average
          posterior mean?
        expects: "0.3"
        hint: >
          $(2/3)(0.2) + (1/3)(0.5)$.
        feedback: >
          $(2/3)(0.2)+(1/3)(0.5) = 2/15+1/6 = 0.3$ — matching the direct posterior mean
          $(4+5)/(20+10)=9/30=0.3$ computed straight from the updated Beta parameters,
          confirming the decomposition.
      - teach: >
          The trap is weighting prior and data equally regardless of their pseudo-counts —
          treating a prior worth $2$ pseudo-observations the same as one worth $200$
          throws away exactly the information this formula exists to use, and a
          decomposition whose two weights don't sum to $1$ can't reconstruct the true
          posterior mean at all.
      - teach: >
          The posterior mean is a weighted average of the prior mean and the sample
          proportion, weighted by pseudo-count against real sample size — turning "how
          much should this data move me" into an arithmetic question with a specific
          numeric answer.

  - node: quant-statistics.bayesian.succession
    hook: >
      This is the two-second sanity check for any estimate-a-probability-
      from-a-tiny-sample question — it's why a perfect or a zero track
      record never becomes a probability of exactly 1 or 0.
    explanation: >
      Take the flattest Beta prior, $\mathrm{Beta}(1,1)$, uniform on $[0,1]$,
      and update by $k$ successes in $n$ trials the ordinary way: the
      posterior is $\mathrm{Beta}(k+1,\,n-k+1)$, one imaginary success and
      one imaginary failure added to the tally before anything else happens.

      The chance the next trial succeeds isn't a separate calculation —
      since $p$ is itself the chance of success, averaging over the
      posterior's belief about $p$ gives exactly the posterior mean,
      $(k+1)/(n+2)$. That single formula answers "predict the next
      observation" and "what do you currently believe $p$ is" at once.

      What the rule buys you is a refusal to output the degenerate
      frequentist extremes: with zero successes so far, the frequentist
      estimate $k/n$ is a flat 0, but one failure was never proof that
      success is impossible — the rule reports something small but strictly
      positive, and symmetrically caps a perfect record strictly below 1.
    worked: >
      A new trading strategy wins its first 2 backtested trades out of 2 (a
      raw hit rate of 100%). Laplace's rule gives $\Pr(\text{next trade
      wins}) = (2+1)/(2+2) = 3/4 = 0.75$ — high, since two wins is real
      evidence, but nowhere near the naive 100% two data points can't
      actually support.
    interview: >
      "The strategy has won every trade so far — do you believe it always
      wins" tests whether you reach for $(k+1)/(n+2)$ instead of quoting the
      raw 100%; the strong answer states the number and explains why a flat
      prior refuses certainty from finite data.
    pitfalls: >
      Reporting the raw proportion $k/n$ instead of $(k+1)/(n+2)$ silently
      assumes an infinitely confident prior, not the flat one the rule
      requires. The rule only applies starting from $\mathrm{Beta}(1,1)$ —
      a different prior's pseudo-count changes the formula to the general
      posterior mean $(a+k)/(a+b+n)$.
    recap: >
      With a flat prior, the next trial succeeds with probability
      $(k+1)/(n+2)$ — a small, finite sample can never push belief all the
      way to certainty in either direction.

    steps:
      - teach: >
          This is the two-second sanity check behind any
          estimate-a-probability-from-a-tiny-sample question — it's the reason a perfect
          or a zero track record never collapses to a probability of exactly $1$ or $0$.
      - teach: >
          Starting from the flattest Beta prior, $\mathrm{Beta}(1,1)$, uniform on $[0,1]$,
          and updating by $k$ successes in $n$ trials the ordinary beta-binomial way gives
          $\mathrm{Beta}(k+1,\,n-k+1)$ — one imaginary success and one imaginary failure
          added to the tally before anything else happens.
      - teach: >
          The chance the next trial succeeds isn't a separate calculation: since $p$
          itself is the chance of success, averaging it over the posterior's belief gives
          exactly the posterior mean, $(k+1)/(n+2)$ — one formula answers both "predict
          the next trial" and "what do you currently believe $p$ is".
      - ask: >
          A quality-control station inspects its first $6$ items and passes all $6$. What
          does Laplace's rule give for the probability the next item passes?
        expects: "7/8"
        tolerance: 0.0005
        hint: >
          $(6+1)/(6+2)$.
        feedback: >
          $(6+1)/(6+2)=7/8=0.875$ — high, since $6$ clean inspections is real evidence,
          but strictly short of the naive $100\%$ the raw rate would claim.
      - ask: >
          A different rep closes $0$ of the first $3$ pitches. What does the rule give for
          the probability the next pitch closes?
        expects: "1/5"
        tolerance: 0.0005
        hint: >
          $(0+1)/(3+2)$.
        feedback: >
          $(0+1)/(3+2)=1/5=0.2$ — small, reflecting the bad start, but never the
          frequentist estimate's flat $0$.
      - teach: >
          The rule buys exactly this refusal to output degenerate extremes: three failures
          in a row is not proof success is impossible, and it starts from
          $\mathrm{Beta}(1,1)$ specifically — a different prior's own pseudo-count changes
          the formula back to the general posterior mean $(a+k)/(a+b+n)$.
      - ask: >
          Which statement about Laplace's rule is correct?
        choices:
          - text: >
              It applies starting from any Beta prior, not just $\mathrm{Beta}(1,1)$.
            feedback: >
              It's specifically the $\mathrm{Beta}(1,1)$ case; a different starting prior
              gives the general weighted formula instead of $(k+1)/(n+2)$.
          - text: >
              Reporting the raw proportion $k/n$ silently assumes an infinitely confident,
              degenerate prior rather than a flat one.
            correct: true
            feedback: >
              Right — $k/n$ is what you get in the limit of a prior with pseudo-count $0$,
              which is not the honest $\mathrm{Beta}(1,1)$ starting point.
          - text: >
              With no data at all, the rule returns $0$.
            feedback: >
              With $k=n=0$ it returns $(0+1)/(0+2)=1/2$ — maximal uncertainty, not zero.
        feedback: >
          $k/n$ implicitly assumes zero pseudo-observations of prior belief; Laplace's
          rule instead starts from a real, if flat, prior worth two pseudo-observations,
          which is exactly what keeps the answer off the degenerate extremes.
      - teach: >
          With a flat prior, the next trial succeeds with probability $(k+1)/(n+2)$ — a
          finite sample, however lopsided, can never push belief all the way to certainty
          in either direction.

  - node: quant-statistics.bayesian.shrinkage
    hook: >
      The best-looking number in a small sample is disproportionately
      likely to belong to the luckiest case rather than the best one, and
      shrinkage is the one-line fix every thin-track-record question is
      testing for.
    explanation: >
      Every conjugate update has the same geometry underneath: the posterior
      estimate sits strictly between the prior's guess and the raw sample
      statistic, positioned by the fraction (prior weight)/(prior weight +
      data weight) — thin data means a small data weight, so the pull toward
      the prior dominates.

      The practical reading is a discount rule: whenever you see an extreme
      statistic built from few observations, ask what a reasonable prior
      centred at the population average would do to it, and expect the
      honest estimate to land noticeably closer to that average. The more
      extreme the raw statistic and the thinner the sample behind it, the
      larger the correction has to be, since an extreme outcome from a small
      sample is more likely to be partly noise than an equally extreme
      outcome from a large one.

      This is why, across a population of candidates or strategies, the
      single best-looking short-run number tends to overstate the true
      quality of whoever produced it — the ranking is partly sorting on luck,
      and shrinkage is the correction that partly undoes that sort.
    worked: >
      A new sales rep closes 8 of the first 10 calls, a raw 80% close rate.
      Against a population prior of $\mathrm{Beta}(15,15)$ (centred at 50%,
      worth 30 pseudo-calls), the posterior is $\mathrm{Beta}(23,17)$, mean
      $23/40 = 0.575$ — the impressive 80% raw rate is discounted to 57.5%
      once weighed against 30 pseudo-calls of population history, because 10
      real calls aren't enough to overturn what everyone else's record
      already says.
    interview: >
      "A new hire's numbers look great after a week — do you believe them"
      tests whether you invoke shrinkage explicitly, naming the prior's
      pseudo-count against the sample size, rather than dismissing the
      number entirely or accepting it at face value.
    pitfalls: >
      Treating the raw sample statistic as the honest estimate, with no
      discount toward the population prior, overweights whatever the thin
      sample happened to show. Applying heavy shrinkage to a genuinely large
      sample is the opposite error — once the data weight dominates, the
      correction should shrink to near nothing.
    recap: >
      A thin sample's estimate is pulled toward the prior in proportion to
      how thin it is, so an extreme short-run number should always be
      discounted before it's believed.

    steps:
      - teach: >
          The best-looking number in a small sample is disproportionately likely to belong
          to the luckiest case rather than the truly best one — shrinkage is the one-line
          correction every thin-track-record question is testing for.
      - teach: >
          Every conjugate update has the same geometry underneath: the posterior estimate
          sits strictly between the prior's guess and the raw sample statistic, positioned
          by the fraction (prior weight)/(prior weight + data weight) — thin data means a
          small data weight, so the pull toward the prior dominates.
      - teach: >
          The practical reading is a discount rule: whenever an extreme statistic is built
          from few observations, ask what a reasonable prior centred at the population
          average would do to it, and expect the honest estimate to land noticeably closer
          to that average — the more extreme the raw number and the thinner the sample
          behind it, the larger that correction has to be.
      - ask: >
          A new market-maker's quote gets filled $9$ times out of the first $10$ attempts.
          Against a population prior $\mathrm{Beta}(20,20)$ (mean $0.5$, worth $40$
          pseudo-fills), what is the posterior's first parameter, $a$?
        expects: "29"
        hint: >
          Add the $9$ successes to $20$.
        feedback: >
          $20+9=29$; the $1$ failure adds to $b$: $20+1=21$, giving
          $\mathrm{Beta}(29,21)$.
      - ask: >
          What is the posterior mean fill probability?
        expects: "0.58"
        hint: >
          $29/(29+21)$.
        feedback: >
          $29/50=0.58$ — the impressive raw $90\%$ fill rate is discounted all the way
          down to $58\%$ once weighed against $40$ pseudo-fills of population history.
      - ask: >
          Check that a second way: the prior carries weight $40/50$ and the data carries
          weight $10/50$. What is $(40/50)(0.5) + (10/50)(0.9)$?
        expects: "0.58"
        hint: >
          $0.8\times0.5 + 0.2\times0.9$.
        feedback: >
          $0.4+0.18=0.58$ — matches the posterior mean computed directly from
          $\mathrm{Beta}(29,21)$, confirming the discount is exactly the weighted-average
          shrinkage the previous step predicts.
      - teach: >
          The opposite mistake matters just as much: applying this same heavy discount to
          a genuinely large sample is wrong, since once the data's weight $n/(a+b+n)$
          dominates the prior's, the correction should shrink toward nothing rather than
          staying large.
      - teach: >
          A thin sample's estimate is pulled toward the prior in direct proportion to how
          thin it is — which is why the single best-looking short-run number in a
          population usually overstates the true quality of whoever produced it, and
          should be discounted before it's believed.

  - node: quant-statistics.bayesian.normal-normal
    hook: >
      Precision, not variance, is the currency a normal-normal update
      actually trades in — every new reading adds directly to a running
      precision total before anyone touches the mean.
    explanation: >
      With a normal prior $N(\mu_0,\sigma_0^{2})$ on $\theta$ and $n$
      independent normal observations of known variance $\sigma^{2}$, the
      posterior is again normal — the defining conjugate fact — and the
      cleanest way to see why is to work in precision, $1/\text{variance}$,
      rather than variance itself: precisions simply add,
      $1/\sigma_0^{2} + n/\sigma^{2}$, one term from the prior and one from
      all $n$ data points combined.

      The posterior mean falls straight out once precision is the unit: it's
      the precision-weighted average of the prior mean and the sample mean,
      $(\mu_0/\sigma_0^{2} + n\bar{x}/\sigma^{2}) / (1/\sigma_0^{2} +
      n/\sigma^{2})$ — each source contributes its mean times its own
      precision, divided by the total precision to keep it an honest
      average.

      The data's contribution scales with $n$, not with a single
      observation's precision alone — ten independent readings carry ten
      times one reading's precision, which is exactly why more data narrows
      the posterior even when each individual measurement is noisy.
    worked: >
      A trader's prior fair-value estimate for a security is 100 points with
      standard deviation 15. Nine independent quotes, each with known noise
      standard deviation 10, average 115. Precisions: prior $1/15^{2} =
      1/225 \approx 0.00444$, data $9/10^{2} = 0.09$, summing to about
      0.09444. Posterior variance is $1/0.09444 \approx 10.59$. Posterior
      mean is $(100/225 + 9\times115/100)/0.09444 \approx (0.444 +
      10.35)/0.09444 \approx 114.28$ — close to the quotes' average, since
      nine quotes carry far more combined precision than the prior.
    interview: >
      "You have a prior estimate and $n$ noisy independent readings — what's
      your updated estimate" wants precisions added first, then the
      precision-weighted mean; naming it "precision-weighted average" out
      loud signals fluency here.
    pitfalls: >
      Averaging variances instead of precisions, or weighting the prior and
      sample mean equally regardless of $n$, both silently misweight the
      two sources. Forgetting that the data's precision scales with $n$
      understates how much $n$ readings actually inform the answer.
    recap: >
      Normal prior plus normal data gives a normal posterior whose
      precisions add and whose mean is the precision-weighted average of
      prior mean and sample mean.

    steps:
      - teach: >
          Precision, not variance, is the currency this update actually trades in — every
          new reading adds directly onto a running precision total before the mean is ever
          touched.
      - teach: >
          With a normal prior $N(\mu_0,\sigma_0^{2})$ on $\theta$ and $n$ independent
          normal observations of known variance $\sigma^{2}$, the posterior is again
          normal, and working in precision $1/\text{variance}$ shows why: precisions
          simply add, $1/\sigma_0^{2} + n/\sigma^{2}$, one term from the prior and one
          from all $n$ data points combined.
      - teach: >
          The posterior mean falls straight out once precision is the unit: it's the
          precision-weighted average of the prior mean and the sample mean,
          $(\mu_0/\sigma_0^{2} + n\bar{x}/\sigma^{2}) / (1/\sigma_0^{2} + n/\sigma^{2})$ —
          each source contributes its mean times its own precision, divided by the total
          to keep it an honest average.
      - ask: >
          A prior for a security's fair value is $N(50, 5^{2})$. What is the prior's
          precision, $1/\sigma_0^{2}$?
        expects: "0.04"
        hint: >
          $1/25$.
        feedback: >
          $1/5^{2}=1/25=0.04$.
      - ask: >
          Four independent readings, each with known noise standard deviation $4$, are
          taken. What is their combined precision, $n/\sigma^{2}$?
        expects: "0.25"
        hint: >
          $4/4^{2}$.
        feedback: >
          $4/16=0.25$ — over six times the prior's own precision of $0.04$, since four
          readings' worth of information now sits on the data side.
      - ask: >
          Those $4$ readings average $\bar{x}=60$. What is the posterior mean?
        expects: "58.6207"
        tolerance: 0.0005
        hint: >
          $(\mu_0/\sigma_0^{2} + n\bar{x}/\sigma^{2}) / (1/\sigma_0^{2}+n/\sigma^{2}) =
          (50\times0.04 + 4\times60/16)/(0.04+0.25)$.
        feedback: >
          $(2+15)/0.29 \approx 58.621$ — pulled well toward the data's $60$, since the
          four readings' combined precision, $0.25$, outweighs the prior's, $0.04$.
      - teach: >
          The data's contribution scales with $n$, not with one observation's precision
          alone — averaging variances instead of precisions, or weighting the prior and
          sample mean equally regardless of $n$, both silently misweight the two sources.
      - teach: >
          Normal prior plus normal data gives a normal posterior whose precisions add and
          whose mean is the precision-weighted average of prior mean and sample mean — the
          entire calculation is arithmetic once precision is the unit in play.

  - node: quant-statistics.bayesian.precision-weighting
    hook: >
      Any time a desk has two independent reads on the same fair value — its
      own model and the market's quote — this is the one-line rule for
      combining them, and equal-weighting the two leaves money on the table.
    explanation: >
      This is the normal-normal posterior mean stripped of its Bayesian
      framing: given two independent unbiased estimates $\hat{\theta}_1,
      \hat{\theta}_2$ of the same quantity with variances $v_1,v_2$, the
      minimum-variance combination is $(\hat{\theta}_1/v_1 +
      \hat{\theta}_2/v_2)/(1/v_1 + 1/v_2)$ — the same formula as combining a
      prior mean and a sample mean, just with neither estimate singled out
      as "the prior."

      The combined variance, $1/(1/v_1 + 1/v_2)$, is smaller than either
      input variance on its own — merging two independent noisy signals is
      never worse than trusting the better one alone, which is the entire
      payoff of combining them rather than picking a favourite.

      The weight each estimate receives is proportional to its own
      precision, so the more confident source dominates the blend, and equal
      weighting is only correct in the special case where both sources share
      the same variance.
    worked: >
      Two independent fair-value estimates: 50 with standard deviation 4
      ($v_1=16$) and 56 with standard deviation 3 ($v_2=9$). Weights are
      proportional to $1/16$ and $1/9$, normalizing to $9/25=0.36$ and
      $16/25=0.64$. The blend is $0.36\times50 + 0.64\times56 = 18+35.84 =
      53.84$, with combined variance $1/(1/16+1/9) = 144/25 = 5.76$, a
      standard deviation of 2.4 — tighter than either input's 3 or 4, and
      pulled closer to 56 since that estimate is the more precise one.
    interview: >
      "You have your own model's fair value and the market's — how do you
      combine them" wants the precision-weighted formula immediately, plus
      the observation that the blend is more confident than either input
      alone.
    pitfalls: >
      Averaging the two estimates equally, ignoring which one is more
      precise, throws away real information whenever the variances differ.
      Assuming the two estimates are independent when they share a common
      error source overstates how much the combined variance should shrink.
    recap: >
      Combine two independent unbiased estimates by weighting each by its
      own precision — the blend beats both inputs, and the more confident
      source pulls harder.

    steps:
      - teach: >
          Whenever a desk holds two independent reads on the same fair value — its own
          model and the market's quote — this is the one-line rule for combining them, and
          weighting the two equally leaves money on the table.
      - teach: >
          Given two independent unbiased estimates $\hat{\theta}_1,\hat{\theta}_2$ of the
          same quantity with variances $v_1,v_2$, the minimum-variance combination is
          $(\hat{\theta}_1/v_1+\hat{\theta}_2/v_2)/(1/v_1+1/v_2)$ — exactly the
          normal-normal posterior mean formula, just with neither estimate singled out as
          "the prior".
      - teach: >
          The combined variance, $1/(1/v_1+1/v_2)$, comes out smaller than either input
          variance on its own — merging two independent noisy signals is never worse than
          trusting the better one alone, and the weight each receives is proportional to
          its own precision, so the more confident source dominates.
      - ask: >
          Two independent fair-value estimates: $80$ with standard deviation $6$, and $74$
          with standard deviation $2$. What is the combined variance, $1/(1/36+1/4)$?
        expects: "3.6"
        hint: >
          $1/36+1/4=5/18$, then invert.
        feedback: >
          $1/36+1/4=5/18$, so the combined variance is $18/5=3.6$ — smaller than either
          input variance, $36$ or $4$.
      - ask: >
          What weight does the $74$ estimate, the more precise one, receive in the blend?
        expects: "0.9"
        hint: >
          Its weight is $(1/4)$ divided by the total precision $5/18$.
        feedback: >
          $(1/4)/(5/18)=18/20=0.9$ — the more precise estimate takes $90\%$ of the weight.
      - ask: >
          What is the blended estimate?
        expects: "74.6"
        hint: >
          $0.1\times80+0.9\times74$.
        feedback: >
          $0.1\times80+0.9\times74=8+66.6=74.6$ — pulled almost all the way to the more
          precise $74$, exactly as its $90\%$ weight predicts.
      - teach: >
          Averaging the two estimates equally regardless of which is more precise throws
          away real information the moment the variances differ, and the whole result
          assumes the two estimates are independent — sharing a common error source
          overstates how much the combined variance should shrink.
      - teach: >
          Combine two independent unbiased estimates by weighting each by its own
          precision: the blend beats both inputs on variance, and the more confident
          source pulls harder.

  - node: quant-statistics.bayesian.posterior-predictive
    hook: >
      Quoting the posterior mean's own uncertainty as the uncertainty on the
      next observation is the single most common mistake once someone's
      learned to compute a posterior — the predictive distribution is always
      wider.
    explanation: >
      A posterior tells you about the parameter; forecasting a new data
      point $\tilde{x}$ instead requires averaging the sampling model over
      every value $\theta$ could still be, weighted by how likely the
      posterior says each is: $p(\tilde{x}\mid x) = \int p(\tilde{x} \mid
      \theta)\,\pi(\theta \mid x)\,d\theta$. That integral tracks two
      separate sources of uncertainty, not one.

      This is why the predictive distribution is always at least as wide as
      plugging the posterior mean straight into the sampling model: on top
      of ordinary sampling noise, it also carries whatever uncertainty
      remains about $\theta$ itself. Ignoring that second source and quoting
      a plug-in interval understates how uncertain the forecast really is.

      In this unit's conjugate families the integral is never performed by
      hand. For beta-binomial, the chance the next trial succeeds collapses
      to exactly the posterior mean; for normal-normal, the predictive
      variance is the posterior variance plus the sampling variance, the two
      uncertainties simply summing.
    worked: >
      Continuing the $\mathrm{Beta}(10,20)$ posterior from before (prior
      $\mathrm{Beta}(3,7)$ updated by 7 successes in 20 trials): the chance
      the next single trial succeeds is exactly the posterior mean, $10/30 =
      1/3$ — the integral defining the posterior predictive collapses to a
      number you already had.
    interview: >
      "What's your prediction interval for the next observation" checks
      whether you widen a plug-in interval by the extra parameter
      uncertainty rather than reporting the posterior's own spread, which
      only measures uncertainty about $\theta$, not about the next data
      point.
    pitfalls: >
      Reporting the posterior's spread on $\theta$ as though it were the
      spread on the next observation skips the sampling noise entirely. In
      the normal case, adding standard deviations instead of variances when
      combining posterior and sampling uncertainty gives the wrong number.
    recap: >
      The posterior predictive integrates the sampling model against the
      posterior, always coming out wider than a plug-in guess because it
      carries both parameter uncertainty and sampling noise.

    steps:
      - teach: >
          Quoting the posterior mean's own spread as the uncertainty on the next
          observation is the single most common mistake right after someone's learned to
          compute a posterior — the predictive distribution is always wider than that.
      - teach: >
          A posterior describes belief about $\theta$; forecasting a new data point
          $\tilde x$ instead means averaging the sampling model over every value $\theta$
          could still take, weighted by the posterior: $p(\tilde x\mid x)=\int p(\tilde
          x\mid\theta)\,\pi(\theta\mid x)\,d\theta$ — an integral tracking two separate
          sources of uncertainty at once, not one.
      - teach: >
          In this unit's conjugate families the integral is never actually performed: for
          beta-binomial, the chance the next trial succeeds collapses to exactly the
          posterior mean; for normal-normal, the predictive variance is the posterior
          variance plus the sampling variance, the two simply summing.
      - ask: >
          A posterior on a coin's bias is $\mathrm{Beta}(12,8)$. What is the predictive
          probability the next flip is heads?
        expects: "0.6"
        hint: >
          It's exactly the posterior mean, $12/(12+8)$.
        feedback: >
          $12/20=0.6$ — for beta-binomial the predictive probability collapses to the
          posterior mean itself, no separate integral needed.
      - ask: >
          A normal posterior for a parameter has mean $40$ and variance $2$. A new
          observation carries known sampling variance $5$. What is the predictive variance
          for that new observation?
        expects: "7"
        hint: >
          Add the posterior variance to the sampling variance.
        feedback: >
          $2+5=7$ — wider than the sampling variance alone, because it also carries the
          leftover uncertainty about $\theta$ itself.
      - ask: >
          A trader has a posterior on fair value with standard deviation $2$ and knows
          individual price quotes carry sampling noise of standard deviation $3$. What is
          the right standard deviation to quote for the next single price?
        choices:
          - text: >
              $2$, the posterior's own spread
            feedback: >
              That's the uncertainty about the parameter alone; it ignores the extra
              sampling noise a single new quote carries on top.
          - text: >
              $3$, the sampling noise alone
            feedback: >
              That ignores the leftover uncertainty about the parameter itself,
              understating the true spread.
          - text: >
              $\sqrt{2^{2}+3^{2}} = \sqrt{13}\approx3.61$
            correct: true
            feedback: >
              Right — predictive variance is posterior variance plus sampling variance,
              $4+9=13$, so the predictive standard deviation is $\sqrt{13}\approx3.61$,
              wider than either source alone.
        feedback: >
          The posterior predictive always carries both sources of uncertainty: parameter
          uncertainty from the posterior and sampling noise from the model — variances
          add, not standard deviations.
      - teach: >
          The beta-binomial shortcut is special: predictive probability for a single
          future coin flip equals the posterior mean only because a Bernoulli outcome's
          own variance is already baked into $p(1-p)$; for a normal forecast, always add
          the raw sampling variance $\sigma^{2}$ separately rather than assuming any
          shortcut carries over.
      - teach: >
          The posterior predictive integrates the sampling model against the posterior,
          always coming out wider than a plug-in guess, because it carries parameter
          uncertainty and sampling noise at once rather than either alone.

  - node: quant-statistics.bayesian.prior-choice
    hook: >
      "Just use a uniform prior, it's uninformative" doesn't survive its own
      reparametrization, and knowing exactly why separates a defensible
      prior from a lazy one.
    explanation: >
      Flatness is a property of the coordinates you happened to write the
      prior in, not of the belief itself. If $p$ is uniform on $[0,1]$, the
      log-odds transform $\log(p/(1-p))$ maps that interval onto the whole
      real line — and a constant density can't exist on an unbounded set at
      all, so whatever shape the log-odds end up having, it manifestly isn't
      flat. The same belief looks maximally noncommittal in one
      parametrization and sharply opinionated in another, so "no
      information" was never a property the prior alone could claim.

      The working discipline sidesteps the whole question of what
      "uninformative" even means: pick a prior mean you'd actually bet on,
      pick a pseudo-count that honestly reflects how much evidence that
      belief is worth, and check whether a different, equally plausible
      prior would have led to a different decision. If it would, the data on
      hand is too thin to act on regardless of which prior gets used.

      One rule survives every parametrization: never put zero density on a
      value that's genuinely possible. A likelihood, however extreme, only
      ever multiplies the prior — it can shrink a small prior weight toward
      zero, but it can never revive a value that started at exactly zero.
    worked: >
      You observe 3 successes in 4 trials and must decide whether to act on
      "the true rate exceeds 0.6." Under a flat $\mathrm{Beta}(1,1)$ prior,
      the posterior is $\mathrm{Beta}(4,2)$, mean $4/6 \approx 0.667$ — act.
      Under a more skeptical $\mathrm{Beta}(5,5)$ prior (worth 10
      pseudo-trials, centred at 0.5), the posterior is $\mathrm{Beta}(8,6)$,
      mean $8/14 \approx 0.571$ — don't act. The decision flips between two
      defensible priors, exactly the signal that 4 trials is too little data
      to have earned the decision either way.
    interview: >
      "Why not just use a flat prior and let the data speak" is answered by
      pointing out flatness isn't parametrization-invariant, then
      demonstrating the stress test — recompute under one alternative
      reasonable prior and see whether the conclusion survives.
    pitfalls: >
      Calling a uniform prior "objective" or "assumption-free" ignores that
      the same belief looks informative under a reparametrization like
      log-odds. Assigning literally zero prior probability to a value that's
      merely thought unlikely is an irreversible mistake — no evidence can
      lift it back off zero.
    recap: >
      A prior is a choice to be defended and stress-tested, not a default —
      flatness depends on parametrization, and zero prior mass is a
      permanent commitment no data can undo.

    steps:
      - teach: >
          "Just use a uniform prior, it's uninformative" doesn't survive its own
          reparametrization — knowing exactly why separates a defensible prior from a lazy
          default.
      - teach: >
          Flatness is a property of the coordinates the prior happens to be written in,
          not of the belief itself: if $p$ is uniform on $[0,1]$, the log-odds transform
          $\log(p/(1-p))$ maps that interval onto the whole real line, and a constant
          density can't even exist on an unbounded set — so whatever shape the log-odds
          end up with, it manifestly isn't flat.
      - teach: >
          The working discipline sidesteps the whole question of what "uninformative"
          means: pick a prior mean you'd actually bet on, pick a pseudo-count that
          honestly reflects how much evidence that belief is worth, then check whether an
          equally plausible alternative prior would flip the decision — if it would, the
          data on hand is too thin to act on regardless of which prior gets used.
      - ask: >
          You observe $4$ successes in $5$ trials and want to know whether the true rate
          exceeds $0.7$. Under a flat $\mathrm{Beta}(1,1)$ prior, what is the posterior
          mean?
        expects: "5/7"
        tolerance: 0.0005
        hint: >
          Posterior is $\mathrm{Beta}(1+4,1+1)$.
        feedback: >
          $\mathrm{Beta}(5,2)$, mean $5/7\approx0.714$ — over the $0.7$ threshold, so this
          prior says act.
      - ask: >
          Under a more skeptical $\mathrm{Beta}(6,6)$ prior (worth $12$ pseudo-trials,
          centred at $0.5$), what is the posterior mean?
        expects: "10/17"
        tolerance: 0.0005
        hint: >
          Posterior is $\mathrm{Beta}(6+4,6+1)$.
        feedback: >
          $\mathrm{Beta}(10,7)$, mean $10/17\approx0.588$ — under the $0.7$ threshold, so
          this prior says don't act. The decision flips between two defensible priors,
          exactly the stress test's point: $5$ trials is too little data to have earned
          either answer.
      - teach: >
          The one rule that survives every parametrization is never assigning zero prior
          mass to a value that's genuinely possible — a likelihood, however extreme, only
          ever multiplies the prior, so it can shrink a small weight toward zero but can
          never revive a value that started at exactly zero.
      - ask: >
          Which is the correct objection to calling a $\mathrm{Beta}(1,1)$ prior
          "objective" or "assumption-free"?
        choices:
          - text: >
              It puts more mass near $0.5$ than near the extremes.
            feedback: >
              It doesn't — $\mathrm{Beta}(1,1)$ is exactly flat on $[0,1]$; the objection
              isn't about its shape on that scale.
          - text: >
              The same belief looks sharply informative once reparametrized, for instance
              onto the log-odds scale, so "no information" was never a property of the
              prior alone.
            correct: true
            feedback: >
              Right — flatness is a coordinate-dependent property, not an absolute one,
              which is why "uninformative" can't be claimed without naming a
              parametrization.
          - text: >
              It assigns zero mass to $p=0$ and $p=1$, so it's actually informative there.
            feedback: >
              Endpoints of a continuous density carry zero mass regardless of the prior
              chosen; that isn't the objection to flatness.
        feedback: >
          Flatness only ever holds in one particular parametrization; the same belief
          looks opinionated in another, which is why "uninformative" isn't a property a
          prior can claim on its own.
      - teach: >
          A prior is a choice to be defended and stress-tested, never a default — flatness
          depends on parametrization, and zero prior mass is a permanent commitment no
          data can undo.

  - node: quant-statistics.bayesian.credible-interval
    hook: >
      Every candidate who says "a 95% confidence interval means there's a
      95% chance the parameter is in here" is describing a credible interval
      instead — stating precisely why those differ is the actual test.
    explanation: >
      With a full posterior in hand, a 95% credible interval is any set
      carrying 95% of the posterior's mass — most often the equal-tailed
      interval running from the posterior's 2.5% to 97.5% quantiles, or, for
      a single shortest set, the highest-density region. Its interpretation
      is the intuitive one: given this prior and this data, $\theta$ lies in
      the interval with probability 0.95, a direct statement about $\theta$
      because $\theta$ is, in this framework, genuinely random.

      A confidence interval answers a structurally different question even
      when the numbers happen to match. There, $\theta$ is fixed and the
      interval is what's random — the claim is that the procedure generating
      the interval covers the true $\theta$ 95% of the time across
      hypothetical repetitions, not that this particular interval has a 95%
      chance of containing $\theta$. Once computed, from a frequentist's
      standpoint it either does or doesn't contain $\theta$; there's no
      probability left to assign to it.

      The two coincide numerically in the common case of a normal model with
      a weak prior and large $n$, which is precisely why the misreading is
      so persistent — the number matches, but the sentence describing what
      it means does not transfer across frameworks.
    worked: >
      Suppose updating has already produced a posterior on a parameter
      that's well approximated by a normal shape with mean 0.4 and standard
      deviation 0.05. A 95% equal-tailed credible interval is $0.4 \pm 1.96
      \times 0.05 = 0.4 \pm 0.098$, about $(0.302, 0.498)$ — and because
      $\theta$ itself is the random object here, it's correct to say
      $\theta$ has roughly a 95% chance of lying in that exact range, given
      the prior and data used to build it.
    interview: >
      "What does a 95% credible interval mean, and how does it differ from a
      confidence interval" wants the exact contrast — random parameter
      versus random interval — stated crisply, not "they're basically the
      same."
    pitfalls: >
      Reading a frequentist confidence interval as though it made the
      credible interval's probability statement about the parameter is the
      single most common misreading in applied statistics. Computing a
      credible interval as mean plus or minus 1.96 standard deviations when
      the posterior is visibly skewed ignores that the honest interval need
      not be symmetric at all.
    recap: >
      A credible interval really does contain the parameter with the stated
      probability, given the prior and data; a confidence interval makes a
      claim about the covering procedure instead, and the two only coincide
      by numerical accident.

    steps:
      - teach: >
          Every candidate who says "a 95% confidence interval means there's a 95% chance
          the parameter is inside it" is actually describing a credible interval — stating
          precisely why the two differ is the real test.
      - teach: >
          With a full posterior in hand, a 95% credible interval is any set carrying 95%
          of the posterior's mass — most often the equal-tailed interval from the
          posterior's 2.5% to 97.5% quantiles. Its reading is the intuitive one: given
          this prior and this data, $\theta$ lies in the interval with probability $0.95$,
          a direct statement about $\theta$ because $\theta$ is, in this framework,
          genuinely random.
      - teach: >
          A confidence interval answers a structurally different question even when the
          numbers happen to match: there $\theta$ is fixed and the interval is what's
          random, so the claim is that the procedure covers the true $\theta$ in $95\%$ of
          hypothetical repetitions — once one particular interval is computed, a
          frequentist has no probability left to attach to whether it personally contains
          $\theta$.
      - ask: >
          A posterior is well approximated by a normal shape with mean $120$ and standard
          deviation $3$. What is the lower endpoint of the equal-tailed 95% credible
          interval, $120 - 1.96\times3$?
        expects: "114.12"
        hint: >
          $1.96\times3=5.88$.
        feedback: >
          $120-5.88=114.12$.
      - ask: >
          What is the upper endpoint?
        expects: "125.88"
        hint: >
          $120+1.96\times3$.
        feedback: >
          $120+5.88=125.88$ — so $\Pr(114.12\le\theta\le125.88)=0.95$, a direct statement
          about $\theta$ itself given this prior and data.
      - ask: >
          A frequentist computes a 95% confidence interval $(114.12, 125.88)$ for the same
          quantity and it happens to match the credible interval numerically. Which
          statement is correct?
        choices:
          - text: >
              This particular interval has a 95% chance of containing the true value.
            feedback: >
              That's the credible interval's reading. For a fixed, unknown parameter and a
              random interval, a frequentist can't attach a probability to whether one
              already-computed interval covers it.
          - text: >
              The procedure that generated this interval would cover the true, fixed value
              in 95% of repeated samples — a claim about the procedure, not about this
              specific interval.
            correct: true
            feedback: >
              Right — this is exactly the frequentist's claim, and it's a different
              sentence from the credible interval's even when the endpoints match.
          - text: >
              The two intervals always coincide exactly, so the distinction never matters
              in practice.
            feedback: >
              They coincide only in the common case of a weak prior and large $n$ — the
              interpretations remain different regardless, and the numbers can diverge
              whenever the prior carries real weight.
        feedback: >
          The credible interval makes a probability statement about $\theta$; the
          confidence interval makes one about the interval-producing procedure. They can
          share endpoints under a weak prior and large $n$ without ever sharing a meaning.
      - teach: >
          Computing a credible interval as mean plus or minus $1.96$ standard deviations
          is only valid when the posterior is genuinely close to normal — for a visibly
          skewed posterior, like a Beta far from $0.5$, the honest interval need not be
          symmetric at all, and the equal-tailed or highest-density region has to be built
          from the actual quantiles instead.
      - teach: >
          A credible interval really does contain the parameter with the stated
          probability, given the prior and data used to build it; a confidence interval
          makes a claim about the covering procedure instead, and the two coincide only by
          numerical accident.
