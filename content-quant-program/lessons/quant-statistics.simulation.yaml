unit: quant-statistics.simulation
opening: >
  Simulation turns an intractable expectation or integral into an arithmetic
  average you can actually compute, and this unit builds that idea from the
  ground up: the uniform stream every sampler is built from, Monte Carlo
  estimation itself, and the $\sigma/\sqrt{n}$ error rate that governs every
  number it produces. From there it branches into manufacturing more
  complicated random variables — inverse transform, discrete tables,
  rejection sampling, Box–Muller for normals, Cholesky for correlated ones —
  and into the bootstrap, which turns the same machine on your own data to
  estimate a statistic's sampling error with no formula at all. It closes
  with the discipline of buying accuracy with structure instead of more
  samples: antithetic variates, control variates, importance sampling, and
  the seeding hygiene that keeps a simulation honest and reproducible.
lessons:
  - node: quant-statistics.simulation.uniform-prng
    hook: >
      Interviewers who ask how a computer generates randomness are checking
      whether you know the honest answer is that it doesn't — every sampler
      downstream, including the fancy ones, is a reshaping of one
      deterministic stream.
    explanation: >
      You already know the target law this stream is supposed to imitate:
      $\mathrm{Uniform}(0,1)$, equal density everywhere on the interval. A
      computer can't draw from it directly, so it runs a state machine
      instead — an internal state advances by a fixed deterministic rule and
      each state is mapped to an output built to pass every statistical test
      you'd think to run against genuine independent uniforms. Fix the seed
      and the entire infinite output sequence is fixed with it: two programs
      given the same seed produce bit-for-bit identical "random" numbers.

      "Random" is therefore a property of the output's statistics, not of the
      generating mechanism, which is pure arithmetic. Since the rule maps a
      finite state space to itself, the sequence must eventually revisit a
      state and repeat exactly — periodicity isn't a bug, it's a structural
      certainty, and the only real lever is choosing a rule whose period
      dwarfs anything you'll ever draw. The classical weak generator's flaw
      is exactly structural: plot consecutive output pairs and they fall on a
      small number of parallel lines rather than filling the square, a defect
      invisible if you only ever look at one draw at a time.

      The one fact worth carrying into everything else in this unit: inverse
      transform, rejection sampling, Box–Muller, bootstrap resampling — every
      one of them is a deterministic function applied to this same stream, so
      any statistical weakness in the stream itself propagates into every
      sampler built on top of it.
    worked: >
      Take the tiny generator $x_{k+1} = (5x_k + 3) \bmod 16$ seeded at
      $x_0 = 1$. Iterating gives $x_1 = 8$, $x_2 = 11$, $x_3 = 10$, with
      outputs $U_k = x_k/16$: $U_1 = 0.5$, $U_2 = 0.6875$, $U_3 = 0.625$ — a
      completely determined sequence once the seed is fixed. Continuing the
      recursion returns to $x_{16} = 1 = x_0$ exactly sixteen steps later, so
      this multiplier and increment achieve the best possible period for
      modulus $16$: the full $16$ states, before repeating.
    interview: >
      "How would you generate random numbers in code, and what does
      'random' even mean there" tests whether you answer with determinism
      plus statistical indistinguishability rather than philosophizing; a
      fast follow-up, "why not just use a linear congruential generator," is
      answered by naming the lattice structure visible in consecutive tuples.
    pitfalls: >
      Judging a generator's quality from a histogram of single draws misses
      the lattice defect entirely — it only shows up once you plot
      consecutive pairs or triples. Treating "pseudorandom" as
      "unpredictable" is wrong: given the seed, or enough consecutive outputs
      to infer the state, the entire future stream is computable exactly,
      which is exactly why PRNGs are unsafe for cryptography.
    recap: >
      A PRNG is a deterministic, eventually periodic map from a seed to a
      stream that merely passes the statistical tests you care about, and
      every other sampling method is a transformation of that one stream.
    steps:
      - teach: >
          A computer cannot literally draw from the continuum of
          $\mathrm{Uniform}(0,1)$ — it has no source of true randomness built in.
          Everything downstream, however fancy, starts from a state machine built to
          produce output that merely *looks* random.
      - teach: >
          The mechanism is a deterministic rule: the state advances by
          $s_{k+1}=T(s_k)$ and each state maps to an output $U_k=g(s_k)$. Fix the seed
          and the entire infinite sequence is fixed with it — two runs with the same
          seed produce bit-for-bit identical output.
      - ask: >
          Take the generator $x_{k+1}=(7x_k+4)\bmod 10$, seeded at $x_0=3$. What is
          $x_1$?
        expects: "5"
        hint: >
          Apply the rule once: $x_1=(7\cdot3+4)\bmod10$.
        feedback: >
          $7\cdot3+4=25$, and $25\bmod10=5$, so $x_1=5$ and the first output is
          $U_1=x_1/10=0.5$.
      - teach: >
          Because the rule maps a *finite* state space to itself, the sequence must
          eventually revisit a state and repeat exactly — periodicity is structural,
          not a flaw. The real lever is a rule whose period dwarfs anything you'll
          ever draw, and the weak classical generator's flaw is exactly this: plot
          consecutive output pairs and they fall on a few parallel lines, not fill the
          square.
      - ask: >
          For that same generator, $x_{k+1}=(7x_k+4)\bmod10$ seeded at $x_0=3$, after
          how many steps does the state first return to $x_0$?
        expects: "4"
        hint: >
          Iterate: $x_1=5$, then keep applying the rule until you land back on $3$.
        feedback: >
          $x_1=5$, $x_2=(7\cdot5+4)\bmod10=39\bmod10=9$,
          $x_3=(7\cdot9+4)\bmod10=67\bmod10=7$,
          $x_4=(7\cdot7+4)\bmod10=53\bmod10=3=x_0$ — the state repeats after $4$
          steps, well short of the $10$ states available, unlike a generator tuned to
          hit its full period.
      - teach: >
          "Pseudorandom" means only "passes the statistical tests you care about" — it
          does not mean unpredictable. Given the seed, or even enough consecutive
          outputs to infer the state, the whole future stream is computable exactly,
          which is why PRNGs are unsafe for cryptography.
      - ask: >
          What actually exposes a weak linear congruential generator's lattice defect?
        choices:
          - text: >
              A histogram of single draws
            feedback: >
              Single draws can look perfectly uniform even from a badly structured
              generator — the defect is invisible one draw at a time.
          - text: >
              Plotting consecutive output pairs or triples against each other
            correct: true
            feedback: >
              This is exactly how the lattice structure shows up: the points fall on a
              small number of parallel lines or planes instead of filling the space.
          - text: >
              A long period by itself
            feedback: >
              A long period does not prevent visible lattice structure — the two
              properties are independent, and a generator can have both a long period and
              a coarse lattice.
        feedback: >
          The lattice defect lives in the joint structure of consecutive outputs, not
          in any single draw's distribution or in the period length alone.
      - teach: >
          Carry one fact into everything else in this unit: inverse transform,
          rejection sampling, Box–Muller, the bootstrap — every one of them is a
          deterministic function of this same stream, so any statistical weakness here
          propagates into every sampler built on top of it.

  - node: quant-statistics.simulation.monte-carlo
    hook: >
      "Estimate an expectation you can't integrate by just sampling it"
      sounds like a hack until you can say precisely why it's unbiased and
      what licenses the average to converge — that justification is what
      separates a real answer from a guess.
    explanation: >
      Take "draw $X_i$ from the law of $X$" as available for now — the
      mechanics of building that draw from the uniform stream are the next
      several nodes. The estimator $\hat{\theta}_n = \frac{1}{n}\sum h(X_i)$
      replaces an expectation you cannot evaluate in closed form with an
      arithmetic average you can always compute, for any $h$ at all — ugly,
      piecewise, high-dimensional, it doesn't matter.

      Unbiasedness is one line of linearity, worth reproducing cold:
      $\mathbb{E}[\hat{\theta}_n] = \frac{1}{n}\sum \mathbb{E}[h(X_i)] =
      \frac{1}{n}(n\theta) = \theta$, exactly, for every single $n$ — this
      needs no large-$n$ argument at all, only that each draw individually
      has the right expectation. What large $n$ buys separately is
      consistency: the individual fluctuations start to cancel, so the
      average settles near $\theta$ with high probability, a rate quantified
      next.

      The indicator trick folds probabilities into the same machine for
      free: since $\Pr(A) = \mathbb{E}[\mathbf{1}\{A\}]$, estimating a
      probability is nothing but running Monte Carlo with
      $h(X) = \mathbf{1}\{X \in A\}$ and reading off the observed frequency —
      no separate theory needed. Reach for simulation specifically when a
      closed-form sum or integral is out of reach: state spaces too large to
      enumerate, dimension too high for quadrature, or path-dependent
      payoffs with no formula at all.
    worked: >
      Estimate $p = \Pr(\text{sum of two fair dice} > 8)$ by simulation.
      Roll $10$ simulated pairs and record how many exceed $8$; suppose $3$
      do. Then $\hat{p} = 3/10 = 0.3$, using the indicator trick with
      $h = \mathbf{1}\{\text{sum}>8\}$. The true value is
      $10/36 \approx 0.278$ (the sums $9,10,11,12$ come from $4+3+2+1=10$
      outcomes), so this tiny run already lands in the right neighborhood,
      though nowhere near precise — sharpening that is the next node's
      subject.
    interview: >
      The interviewer often disguises this as "how would you estimate this
      probability or expectation if you can't compute it by hand" — name the
      estimator, state unbiasedness in one line, and mention the indicator
      trick unprompted whenever the target is a probability.
    pitfalls: >
      Quoting unbiasedness as something that "kicks in for large $n$"
      confuses it with consistency — it holds exactly at every $n$.
      Simulating $h(X)$ under a convenient stand-in law instead of $X$'s
      actual law silently estimates a different $\theta$; correcting for a
      deliberate mismatch is what importance sampling exists for later.
    recap: >
      Monte Carlo is an average of simulated $h(X_i)$'s standing in for its
      own expectation — unbiased at every $n$ by linearity, and turned into a
      probability estimate for free via the indicator trick.
    steps:
      - teach: >
          "Estimate an expectation you can't integrate by just sampling it" sounds
          like a hack until you can justify it in one line: why is the average
          unbiased, and what licenses it to converge at all.
      - teach: >
          The estimator is $\hat\theta_n=\frac1n\sum h(X_i)$ for $X_i$ drawn
          independently from $X$'s law. Unbiasedness is exact linearity,
          $\mathbb{E}[\hat\theta_n]=\theta$, at *every* $n$ — no large-sample argument
          required for that identity itself.
      - ask: >
          A fair die is rolled $20$ times to estimate $p=\Pr(X\ge5)$; $7$ of the rolls
          land on $5$ or $6$. What is $\hat p$?
        expects: "0.35"
        hint: >
          Divide the successes by the number of trials.
        feedback: >
          $\hat p=7/20=0.35$ — Monte Carlo with $h(X)=\mathbf1\{X\ge5\}$, reading off
          the observed frequency directly.
      - teach: >
          The indicator trick folds probabilities into the same machine for free:
          since $\Pr(A)=\mathbb{E}[\mathbf1\{A\}]$, estimating a probability is
          nothing but running Monte Carlo with $h(X)=\mathbf1\{X\in A\}$ — no separate
          theory needed.
      - ask: >
          You want to estimate $\Pr(A)$ by simulation for some event $A$. What should
          $h(X)$ be?
        choices:
          - text: >
              $X$ itself
            feedback: >
              Averaging $X$ estimates $\mathbb{E}[X]$, a different quantity entirely, not
              the probability of $A$.
          - text: >
              $\mathbf1\{X\in A\}$
            correct: true
            feedback: >
              This is the indicator trick: its expectation is exactly $\Pr(A)$, so
              averaging it is Monte Carlo for the probability with no extra machinery.
          - text: >
              $\Pr(A)$ itself, computed on each draw
            feedback: >
              That's circular — $\Pr(A)$ is the unknown quantity you're trying to
              estimate.
        feedback: >
          $h(X)=\mathbf1\{X\in A\}$ turns any probability into an ordinary Monte Carlo
          average, since $\Pr(A)=\mathbb{E}[\mathbf1\{A\}]$.
      - teach: >
          Keep unbiasedness and consistency separate: unbiasedness is exact at every
          $n$ by linearity alone, while consistency — the average settling near
          $\theta$ with high probability — is what large $n$ actually buys, via the
          law of large numbers.
      - ask: >
          A colleague says $\hat\theta_{10}$ is "only approximately unbiased" because
          $n=10$ is small. Is that right?
        choices:
          - text: >
              Yes — bias shrinks as $n$ grows
            feedback: >
              That describes consistency, a different property; unbiasedness doesn't
              depend on $n$ at all.
          - text: >
              No — $\mathbb{E}[\hat\theta_n]=\theta$ exactly for every $n$, including
              $n=10$
            correct: true
            feedback: >
              Linearity of expectation gives this exactly, with no large-sample argument
              needed — the estimator is unbiased at $n=1$ just as much as at $n=10{,}000$.
          - text: >
              Yes — the central limit theorem hasn't kicked in yet
            feedback: >
              The CLT governs the *shape* of the fluctuations around $\theta$, not whether
              the mean is exactly $\theta$.
        feedback: >
          Unbiasedness holds exactly at every $n$; confusing it with consistency,
          which genuinely does need large $n$, is the standard slip.
      - teach: >
          Reach for simulation specifically when a closed-form sum or integral is out
          of reach: a state space too large to enumerate, a dimension too high for
          quadrature, or a path-dependent payoff with no formula at all.

  - node: quant-statistics.simulation.mc-error
    hook: >
      Every Monte Carlo answer without a standard error is only half an
      answer, and the fact that cost scales like the square of the precision
      you want is the single most quoted number in a simulation interview.
    explanation: >
      This follows from applying variance-of-a-sum directly to the
      estimator: $\hat{\theta}_n$ is $\frac{1}{n}$ times a sum of $n$ iid
      terms $h(X_i)$, each with variance $\sigma^{2}$. Independence kills the
      cross-covariance terms, so the sum has variance $n\sigma^{2}$, and
      dividing by $n^{2}$ for the average gives
      $\operatorname{Var}(\hat{\theta}_n) = \sigma^{2}/n$ exactly — no
      large-$n$ needed for this identity itself.

      Large $n$ enters only through the central limit theorem: standardizing
      turns the fluctuation of $\hat{\theta}_n$ around $\theta$ into an
      approximately normal quantity with standard deviation
      $\sigma/\sqrt{n}$, which is where the $1.96$ multiplier for a $95\%$
      band comes from — the identical machinery as any sample-mean
      confidence interval, relabeled with $h(X)$ as the observation.

      The number worth having automatic: to shrink the half-width by a
      factor of $k$, $n$ must grow by $k^{2}$. Cutting $\sigma$ via a smarter
      estimator, this unit's later subject, is usually far cheaper than
      simply running more paths — the same $\sqrt{n}$ logic that governs
      every other estimate in the tree, applied here to simulation cost.
    worked: >
      Suppose $\sigma^{2} = 0.25$, as for a coin-flip indicator. A standard
      error of $0.025$ needs $n = 0.25/0.025^{2} = 400$. Tightening to a
      standard error of $0.0025$ — ten times smaller — needs
      $n = 0.25/0.0025^{2} = 40{,}000$: exactly the square of that factor,
      not ten times as many draws.
    interview: >
      "How many simulated paths do you need for a given precision" is
      answered by inverting $\sigma/\sqrt{n}$ for $n$; a strong candidate
      reports $\hat{\sigma}$ alongside $\hat{\theta}$ unprompted, since a
      point estimate with no error bar isn't complete here.
    pitfalls: >
      Reporting only $\hat{\theta}_n$ with no $\hat{\sigma}$ or interval is
      an incomplete answer by this unit's standard. Doubling $n$ and
      expecting the error to halve is a common slip — it only shrinks by
      $\sqrt{2} \approx 1.41$; halving the error needs quadrupling $n$.
    recap: >
      The Monte Carlo standard error is $\sigma/\sqrt{n}$ exactly, so
      squeezing out one more correct digit multiplies the sample size by
      $100$.
    steps:
      - teach: >
          An estimate with no error bar is only half an answer, and the number every
          simulation interview wants quoted cold is how cost scales with precision.
      - teach: >
          Variance-of-a-sum gives it directly: $\hat\theta_n$ is $\frac1n$ times a sum
          of $n$ iid terms with variance $\sigma^2$ each, independence kills the cross
          terms, so $\operatorname{Var}(\hat\theta_n)=\sigma^2/n$ exactly. The CLT
          then makes $\hat\theta_n\pm1.96\hat\sigma/\sqrt n$ an asymptotic $95\%$
          interval.
      - ask: >
          Suppose $\sigma^2=0.64$. How many draws $n$ are needed for a standard error
          of $0.02$?
        expects: "1600"
        hint: >
          Set $\sigma^2/n$ equal to the target standard error squared and solve for
          $n$.
        feedback: >
          $n=\sigma^2/\mathrm{SE}^2=0.64/0.02^2=0.64/0.0004=1600$.
      - teach: >
          The number worth having automatic: shrinking the half-width by a factor of
          $k$ costs $k^2$ times the samples, since the error goes like $n^{-1/2}$ —
          the identical $\sqrt n$ logic behind every sample-mean confidence interval
          in the tree, applied here to simulation cost.
      - ask: >
          If you need the confidence interval's half-width cut by a factor of $5$, by
          what factor must $n$ grow?
        expects: "25"
        hint: >
          The relationship is $n\propto k^2$ for a half-width shrunk by $k$.
        feedback: >
          $k=5$ gives $k^2=25$ — a five-times-tighter interval costs twenty-five times
          the draws.
      - teach: >
          Doubling $n$ does *not* halve the standard error — a common slip. Since
          $\mathrm{SE}\propto1/\sqrt n$, doubling $n$ shrinks it only by a factor of
          $1/\sqrt2$; halving the error outright needs quadrupling $n$.
      - ask: >
          By what factor does the standard error shrink when $n$ is doubled, to four
          decimal places?
        expects: "0.7071"
        tolerance: 0.0005
        hint: >
          The new-to-old ratio is $\sqrt n/\sqrt{2n}$.
        feedback: >
          $\sqrt n/\sqrt{2n}=1/\sqrt2\approx0.7071$ — nowhere near the $0.5$ a naive
          "double $n$, halve the error" guess would give.
      - teach: >
          Report $\hat\sigma$ alongside $\hat\theta_n$ every time — it costs nothing
          to compute and it's the only way a reader can judge how much to trust the
          point estimate.

  - node: quant-statistics.simulation.dimension-independence
    hook: >
      "Why simulate instead of just integrating numerically" has a sharp
      numeric answer, and knowing the crossover dimension — not just "Monte
      Carlo is more flexible" — is what makes the answer land.
    explanation: >
      A deterministic grid's cost explodes with dimension because covering a
      $d$-dimensional cube at fixed resolution multiplies that resolution
      across every axis — $m$ nodes per axis becomes $m^{d}$ evaluations
      total, purely combinatorial, with no randomness involved anywhere.

      Monte Carlo's cost never sees the dimension explicitly: $\sigma^{2}$ is
      just the variance of $h(X)$ for whatever random vector $X$ is, and the
      $\sigma/\sqrt{n}$ formula from the previous node doesn't care whether
      $X$ lives in two dimensions or two hundred. Past the crossover
      dimension, adding axes keeps taxing the grid method exponentially while
      the simulation-based estimate pays nothing extra at all.

      The practical reading: any payoff depending on many time steps —
      path-dependent options, multi-period risk scenarios — has one axis of
      randomness per time step, so its effective dimension is enormous
      exactly where the curse of dimensionality bites hardest and Monte
      Carlo's dimension-blindness is most valuable.
    worked: >
      Take $d = 8$ with a modest $m = 20$ grid points per axis. Grid cost is
      $n = 20^{8} \approx 2.56 \times 10^{10}$ evaluations, for an error of
      order $m^{-2} = 1/400 = 0.0025$. Monte Carlo hitting that same error
      with $\sigma = 1$ needs $n = (1/0.0025)^{2} = 160{,}000$ draws — about
      $1.6\times 10^{5}$ versus $2.56\times 10^{10}$, roughly five orders of
      magnitude apart, purely from the dimension.
    interview: >
      "Why not just discretize the integral on a grid" is the standard
      prompt; name the $m^{d}$ cost and the crossover near $d=4$ explicitly,
      then point at path-dependent payoffs as the case where $d$ is silently
      enormous.
    pitfalls: >
      Assuming Monte Carlo is "better" outright is wrong — below about four
      dimensions a good deterministic quadrature rule genuinely wins, and
      simulation is the fallback for high dimension, not a universal
      upgrade. Forgetting that the number of time steps in a path-dependent
      payoff counts as dimension is a common miscount — a fifty-step path is
      a fifty-dimensional problem.
    recap: >
      Grid methods pay $m^{d}$, exponential in dimension; Monte Carlo pays
      $\sigma/\sqrt{n}$ regardless of dimension, which flips the ranking past
      about four or five dimensions.
    steps:
      - teach: >
          "Why simulate instead of just discretizing the integral" has a sharp numeric
          answer, and naming the crossover dimension — not just "Monte Carlo is more
          flexible" — is what makes the answer land.
      - teach: >
          A deterministic grid's cost is purely combinatorial: $m$ nodes per axis in
          $d$ dimensions costs $n=m^d$ evaluations total, exploding exponentially in
          $d$ with no randomness involved anywhere.
      - ask: >
          A grid with $m=15$ points per axis is used in $d=3$ dimensions. How many
          evaluations does it cost?
        expects: "3375"
        hint: >
          Cost is $m^d$.
        feedback: >
          $15^3=3375$ evaluations, purely from the grid's combinatorics.
      - teach: >
          Monte Carlo's cost never sees $d$ explicitly — $\sigma^2$ is just the
          variance of $h(X)$, whatever dimension $X$ lives in — while a second-order
          grid rule has error of order $m^{-2}=n^{-2/d}$, so the two rates cross
          exactly where $2/d=1/2$.
      - ask: >
          Solve $2/d=1/2$ for $d$: at what dimension does the grid's $n^{-2/d}$ error
          rate stop beating Monte Carlo's $n^{-1/2}$?
        expects: "4"
        hint: >
          Cross-multiply and solve the equation directly.
        feedback: >
          $2/d=1/2\iff d=4$ — below four dimensions a good deterministic rule wins;
          past it, Monte Carlo's dimension-blind rate takes over.
      - teach: >
          This isn't "Monte Carlo always wins": below about four dimensions quadrature
          genuinely wins on cost. The practical trap is undercounting $d$ — a
          path-dependent payoff has one axis of randomness per time step, so a
          fifty-step path is a fifty-dimensional problem.
      - ask: >
          A payoff depends on $50$ simulated time steps. Which method should you reach
          for?
        choices:
          - text: >
              A deterministic product-rule grid
            feedback: >
              At an effective dimension of $50$, far past the crossover near $d=4$, a
              grid's $m^{50}$ cost is hopeless.
          - text: >
              Monte Carlo
            correct: true
            feedback: >
              Its error depends only on $\sigma$ and $n$, never on dimension, so it pays
              nothing extra for the $50$ correlated time steps.
          - text: >
              Either — they cost about the same here
            feedback: >
              They diverge by many orders of magnitude once $d$ is this far past four; it
              isn't close.
        feedback: >
          Fifty time steps means fifty dimensions of randomness, well past where grid
          methods collapse under the curse of dimensionality — exactly where
          simulation is the default.
      - teach: >
          The reading to keep: grid cost is exponential in $d$; Monte Carlo cost is
          $\sigma/\sqrt n$ regardless of $d$ — and that flip is what makes simulation
          the workhorse for basket payoffs and multi-factor risk.

  - node: quant-statistics.simulation.estimate-pi
    hook: >
      This toy example opens every simulation course, and its real value in
      an interview is a two-minute proof that you can set up an estimator,
      its variance, and the sample size it needs, entirely from scratch.
    explanation: >
      The dartboard uses the indicator trick from Monte Carlo estimation
      directly: draw $X,Y$ uniform on the unit square and set
      $h = \mathbf{1}\{X^{2}+Y^{2}\le 1\}$. Then $\mathbb{E}[h]$ is exactly
      the area of the quarter disc inside the unit square, $\pi/4$, since
      throws are uniform over an area-$1$ region and probability equals area
      there.

      Because $h$ is an indicator, $h(X,Y)$ is itself Bernoulli($p$) with
      $p=\pi/4$, so its variance is the plain Bernoulli formula $p(1-p)$
      rather than anything specific to circles — estimating any probability
      by simulation always inherits Bernoulli variance, whatever the
      geometric dressing.

      Multiplying by $4$ to recover $\pi$ from $p$ rescales the standard
      deviation by $4$ too, by linearity — that's exactly where the factor of
      $4$ out front of the standard error comes from, chaining the ordinary
      $\sigma/\sqrt{n}$ rule through a constant rescaling, not a separate
      calculation.
    worked: >
      Simulate $n=1000$ darts and suppose $786$ land inside the quarter disc,
      so $\hat{p}=0.786$ and $\hat{\pi}=4\times0.786=3.144$. The standard
      error here is $4\sqrt{0.786\times0.214/1000}\approx4\times0.01297
      \approx0.0519$ — consistent with the $1.64/\sqrt{1000}\approx0.0519$
      formula — so this run's third digit is well within the noise the error
      bar already predicted.
    interview: >
      "Estimate $\pi$ by simulation" is a classic warm-up; the strong answer
      states the Bernoulli variance and the sample size needed for a target
      precision unprompted, rather than stopping at "throw darts and count."
    pitfalls: >
      Reporting $\hat{\pi}$ with no error bar drops exactly the information
      that makes the precision-versus-cost tradeoff meaningful. Forgetting
      the factor-of-$4$ rescaling when converting the standard error, not
      just the point estimate, from $p$ to $\pi$.
    recap: >
      $\hat{\pi}=4$ times the observed hit fraction is Monte Carlo with a
      circle indicator, inheriting Bernoulli variance $p(1-p)$ and paying the
      usual $\sigma/\sqrt{n}$ price, scaled by $4$.
    steps:
      - teach: >
          This toy example opens every simulation course, and its real value in an
          interview is a two-minute proof that you can set up an estimator, its
          variance, and its required sample size entirely from scratch.
      - teach: >
          Draw $X,Y$ uniform on the unit square and set $h=\mathbf1\{X^2+Y^2\le1\}$;
          since throws are uniform over an area-$1$ region, $\mathbb{E}[h]$ is exactly
          the quarter disc's area, $\pi/4$, so $\hat\pi=4\hat p$ for the observed hit
          fraction $\hat p$.
      - ask: >
          Simulate $n=2000$ darts and suppose $1550$ land inside the quarter disc.
          What is $\hat\pi$?
        expects: "3.1"
        hint: >
          First get $\hat p=$ hits$/n$, then multiply by $4$.
        feedback: >
          $\hat p=1550/2000=0.775$, so $\hat\pi=4\times0.775=3.1$.
      - teach: >
          Because $h$ is an indicator, $h(X,Y)$ is Bernoulli($p$) with $p=\pi/4$,
          inheriting the plain Bernoulli variance $p(1-p)$ — and rescaling by $4$ to
          get $\hat\pi$ rescales the standard error by $4$ too, giving the standing
          approximation $1.64/\sqrt n$.
      - ask: >
          Using the $1.64/\sqrt n$ approximation, what standard error does $n=2000$
          darts give, to four decimal places?
        expects: "0.0367"
        tolerance: 0.0005
        hint: >
          Divide $1.64$ by $\sqrt{2000}$.
        feedback: >
          $1.64/\sqrt{2000}\approx1.64/44.72\approx0.0367$.
      - teach: >
          Reporting $\hat\pi$ with no error bar drops exactly the information that
          makes the precision-versus-cost tradeoff meaningful — and forgetting the
          factor-of-$4$ rescaling on the *error*, not just the point estimate, is the
          standard slip.
      - ask: >
          How many darts, using the $1.64/\sqrt n$ approximation, are needed for a
          standard error of $0.01$?
        expects: "26896"
        hint: >
          Solve $1.64/\sqrt n=0.01$ for $n$.
        feedback: >
          $n=(1.64/0.01)^2=164^2=26{,}896$ throws for that precision.
      - teach: >
          A famously terrible way to compute $\pi$ — but a clean, complete
          illustration of the whole simulation pipeline: estimator, its inherited
          variance, and the sample size its precision costs.

  - node: quant-statistics.simulation.inverse-transform
    hook: >
      "Simulate from this law — just look up the formula" is exactly this
      technique, and the interview wants the map derived on the spot, not
      recited from memory.
    explanation: >
      You already have the uniform stream; the missing piece is turning a
      $\mathrm{Uniform}(0,1)$ draw into a draw from any target law $F$. Since
      $F$ is nondecreasing, define its quantile function $q(u)$ as the
      smallest $x$ with $F(x)\ge u$, and set $X=q(U)$.

      Why this works, worth reproducing in one line: $q(U)\le x$ exactly when
      $U\le F(x)$, since $q$ and $F$ are order-inverses of each other by
      construction, and that second event has probability $F(x)$ because $U$
      is uniform — so $\Pr(X\le x)=F(x)$, which is the entire proof. Nothing
      about $F$ needs to be continuous or strictly increasing; the
      "smallest $x$" phrasing absorbs flat spots and jumps automatically,
      which is why the identical recipe covers discrete laws too.

      Mechanically: write $F$, solve $F(x)=u$ for $x$, and you have a
      one-line sampler. The normal is the standing counterexample — its CDF
      has no closed-form inverse, which is precisely the gap the next
      transform-based technique in this unit exists to route around.
    worked: >
      Take the density $f(x)=3x^{2}$ on $(0,1)$, with CDF $F(x)=x^{3}$.
      Solving $u=x^{3}$ gives $x=u^{1/3}$, so $X=U^{1/3}$. Drawing $U=0.512$
      gives $X=0.512^{1/3}=0.8$, since $0.8^{3}=0.512$ exactly — one cube
      root per draw, the whole sampler.
    interview: >
      "How would you sample from this named law given only a uniform
      generator" is answered by writing its CDF and inverting it live; a
      sharp follow-up asks why this fails for the normal, exactly the
      no-closed-form-inverse point.
    pitfalls: >
      Trying to invert $F$ for a law whose CDF has no closed form, instead
      of recognizing that as the trigger for a different technique.
      Forgetting that $1-U$ is uniform too, which is what lets the
      exponential sampler be written with either sign convention without
      redoing the derivation.
    recap: >
      $X=q(U)$ for the quantile function $q$ of any target CDF $F$ has law
      exactly $F$, because $q(U)\le x$ and $U\le F(x)$ are the same event —
      invert the CDF, feed uniforms, done.
    steps:
      - teach: >
          "Simulate from this named law, given only a uniform generator" is exactly
          this technique, and the interview wants the map derived live, not recited
          from memory.
      - teach: >
          Define the quantile function $q(u)$ as the smallest $x$ with $F(x)\ge u$,
          and set $X=q(U)$. The proof is one line: $q(U)\le x\iff U\le F(x)$, an event
          of probability $F(x)$ since $U$ is uniform — so $\Pr(X\le x)=F(x)$, with no
          continuity of $F$ required.
      - ask: >
          For $X\sim\mathrm{Exponential}(\lambda=2)$, use $X=-\ln(U)/\lambda$ with a
          fresh draw $U=0.2$. What is $X$, to four decimal places?
        expects: "0.8047"
        tolerance: 0.0005
        hint: >
          Plug $U=0.2$ and $\lambda=2$ into $X=-\ln(U)/\lambda$.
        feedback: >
          $X=-\ln(0.2)/2\approx1.6094/2\approx0.8047$.
      - teach: >
          Mechanically the recipe never changes: write $F$, solve $F(x)=u$ for $x$,
          feed uniforms. It covers discrete laws too, since the "smallest $x$"
          phrasing absorbs flat spots and jumps automatically.
      - ask: >
          The standard Cauchy sampler is $X=\tan(\pi(U-1/2))$. What does $U=0.75$
          give?
        expects: "1"
        hint: >
          Simplify the angle first: $\pi(0.75-0.5)=\pi/4$.
        feedback: >
          $\tan(\pi(0.75-0.5))=\tan(\pi/4)=1$ — one tangent per draw, the whole
          sampler.
      - teach: >
          The normal is the standing counterexample: its CDF has no closed-form
          inverse, so $F(x)=u$ can't be solved for $x$ in elementary terms.
      - ask: >
          Why does inverse transform sampling break down for the standard normal?
        choices:
          - text: >
              Its CDF isn't monotonic
            feedback: >
              The normal CDF is strictly increasing everywhere — monotonicity isn't the
              problem.
          - text: >
              Its CDF has no closed-form inverse
            correct: true
            feedback: >
              $\Phi(x)=u$ simply can't be solved for $x$ in elementary functions, which is
              exactly the gap Box–Muller exists to route around.
          - text: >
              Uniform draws can't feed a continuous target law
            feedback: >
              They can — every other continuous law in this unit is sampled exactly this
              way.
        feedback: >
          The recipe itself never fails for the normal; only the algebraic step of
          inverting $\Phi$ by hand does.
      - teach: >
          Once $F$ is written down, inversion is a one-line sampler for an enormous
          family of laws — exponential, Cauchy, Pareto, Weibull — all clean, all the
          identical mechanism.

  - node: quant-statistics.simulation.discrete-sampling
    hook: >
      This is inverse transform with $F$ replaced by a step function, and
      the interview version usually asks you to build the cumulative table
      and locate a specific $U$ by hand under time pressure.
    explanation: >
      A discrete law is a CDF that only jumps, flat everywhere else, so
      inverse transform specializes cleanly: build the cumulative sums
      $c_j=p_1+\cdots+p_j$, and $X=q(U)$ becomes "return $v_j$ for the
      smallest $j$ with $U\le c_j$" — literally scanning the step function
      from the left until you cross $U$.

      The scan's expected cost is the expected number of comparisons before
      stopping, $\sum_j j p_j$; putting the largest probabilities first
      minimizes it, since the likeliest outcomes get found fastest. A binary
      search on the precomputed table instead finds the right interval in
      $O(\log k)$ comparisons regardless of ordering, at the price of an
      $O(k)$ setup to build the table once.

      Two special cases deserve to be memorized rather than re-derived under
      pressure: a single cutoff at $p$ gives Bernoulli($p$) via
      $\mathbf{1}\{U<p\}$, and $m$ equal cutoffs give a fair $m$-sided die via
      $\lceil mU\rceil$ — both are this exact mechanism collapsed to the
      simplest possible table.
    worked: >
      Take probabilities $(0.05, 0.35, 0.25, 0.20, 0.15)$ on values $1$
      through $5$. Cumulative sums are $0.05, 0.40, 0.65, 0.85, 1.00$. Draw
      $U=0.71$: it exceeds $0.05$, $0.40$, and $0.65$ but not $0.85$, so the
      smallest $j$ with $U\le c_j$ is $j=4$, returning the value $4$.
    interview: >
      "Sample from this discrete distribution given a uniform generator"
      wants the cumulative table built live and the comparison against $U$
      done correctly; a follow-up on cost is answered with $O(\log k)$ via
      binary search versus $O(k)$ via linear scan.
    pitfalls: >
      Comparing $U$ against the raw probabilities $p_j$ instead of the
      cumulative sums $c_j$ silently samples the wrong law. Leaving the
      table in an arbitrary order for a linear scan, instead of sorting
      largest-first, needlessly inflates the expected comparison count.
    recap: >
      Cut $[0,1]$ into consecutive intervals of length $p_1,\ldots,p_k$ and
      report which one $U$ lands in — inverse transform applied to a step
      function, $O(\log k)$ per draw with a binary search.
    steps:
      - teach: >
          This is inverse transform with $F$ replaced by a step function, and the
          interview version usually asks you to build the cumulative table and locate
          a specific $U$ by hand, under time pressure.
      - teach: >
          Build cumulative sums $c_j=p_1+\cdots+p_j$ and return $v_j$ for the smallest
          $j$ with $U\le c_j$ — literally scanning the step function from the left
          until you cross $U$.
      - ask: >
          Probabilities $(0.2, 0.1, 0.4, 0.3)$ sit on values $1,2,3,4$. Draw $U=0.55$.
          Which value is returned?
        expects: "3"
        hint: >
          Build the cumulative sums first, then find the smallest one at or above $U$.
        feedback: >
          Cumulative sums are $0.2, 0.3, 0.7, 1.0$. $U=0.55$ exceeds $0.2$ and $0.3$
          but not $0.7$, so the smallest $j$ with $U\le c_j$ is $j=3$, returning value
          $3$.
      - teach: >
          Two special cases are worth memorizing rather than re-deriving: a single
          cutoff at $p$ gives Bernoulli($p$) via $\mathbf1\{U<p\}$, and $m$ equal
          cutoffs give a fair $m$-sided die via $\lceil mU\rceil$ — both are this
          exact mechanism collapsed to its simplest table.
      - ask: >
          Using $\lceil6U\rceil$ for a fair six-sided die, what does $U=0.67$ return?
        expects: "5"
        hint: >
          Multiply by $6$ and round up.
        feedback: >
          $6\times0.67=4.02$, and $\lceil4.02\rceil=5$.
      - teach: >
          The trap is comparing $U$ against the raw probabilities $p_j$ instead of the
          cumulative sums $c_j$ — the intervals no longer partition $[0,1]$ correctly,
          and the sampler silently draws from the wrong law.
      - ask: >
          A candidate compares $U$ directly against each raw $p_j$ instead of against
          the cumulative sums $c_j$. What happens?
        choices:
          - text: >
              Nothing — it still samples the right law
            feedback: >
              The comparisons no longer partition $[0,1]$ into the correct intervals, so
              this changes which value gets returned.
          - text: >
              It silently samples the wrong law
            correct: true
            feedback: >
              Without accumulating the sums, the intervals compared against $U$ don't have
              the right lengths or boundaries, and the error shows up nowhere obvious.
          - text: >
              It just runs an $O(k)$ scan instead of $O(\log k)$
            feedback: >
              The cost difference between linear scan and binary search is real but
              separate — this mistake is about correctness, not speed.
        feedback: >
          Comparing against $c_j$, not $p_j$, is what makes the intervals partition
          $[0,1]$ correctly in the first place.
      - teach: >
          Sort the table largest-probability-first for a linear scan — it minimizes
          the expected comparison count $\sum_j jp_j$ — or pay an $O(k)$ setup once
          for an $O(\log k)$ binary search on every later draw.

  - node: quant-statistics.simulation.alias-method
    hook: >
      "Can you sample from this fixed discrete law in $O(1)$ time" is the
      follow-up once the cumulative-table answer's $O(\log k)$ draw cost gets
      pushed on, and the alias method is the only standard answer.
    explanation: >
      Even a binary search costs $O(\log k)$ on every single draw. The alias
      method instead pays a one-time $O(k)$ setup so every later draw costs a
      fixed $O(1)$ — two uniforms, no search — which only pays for itself
      when the same fixed law gets sampled many, many times.

      The construction reshapes the law into $k$ columns of equal width
      $1/k$, each holding at most two outcomes stacked to height $1$: rescale
      each probability to $q_i=kp_i$ (these average to $1$ since the $p_i$
      sum to $1$), then repeatedly take a deficient cell ($q_i<1$) and a
      surplus cell ($q_j>1$), topping the deficient one up to height $1$ with
      mass borrowed from the surplus one and recording that outcome as its
      alias. Every cell ends up fully accounted for, holding its own outcome
      plus at most one alias.

      Drawing is then trivial: pick a column uniformly with
      $i=\lceil kU_1\rceil$, then a second uniform $U_2$ decides whether you
      land in that column's own retained mass or its alias — no search of
      any kind, because the table already did the work at setup.
    worked: >
      Take probabilities $(0.5, 0.25, 0.25)$ on $3$ outcomes, so $k=3$ and
      $q=(1.5, 0.75, 0.75)$. Column $2$ is deficient by $0.25$, topped up
      with $0.25$ borrowed from column $1$'s surplus and aliased to $1$;
      column $1$'s remaining surplus is exactly used up on column $3$'s
      identical deficiency, also aliased to $1$. Draw $U_1=0.4$:
      $i=\lceil3\times0.4\rceil=2$. With $U_2=0.6\le0.75$, return outcome
      $2$ itself; had $U_2$ been $0.9>0.75$, the draw would return the
      alias, outcome $1$.
    interview: >
      "How do you sample in constant time from a fixed distribution" is
      answered by naming the $O(k)$ setup / $O(1)$ draw tradeoff and
      sketching the deficient-surplus pairing — the interviewer checks you
      know when the setup pays off, not just that the method exists.
    pitfalls: >
      Rebuilding the alias table for a one-off draw wastes the setup cost —
      the cumulative-table search is simpler and just as fast in total for a
      single use. Forgetting that $q_i=kp_i$, not $p_i$ itself, is easy to
      drop under time pressure and breaks the height-$1$ columns.
    recap: >
      Rescale probabilities by $k$, pair every deficient cell with a surplus
      one until each of the $k$ columns holds at most two outcomes at height
      $1$, and after that setup every draw costs exactly two uniforms and no
      search.
    steps:
      - teach: >
          "Can you sample from this fixed discrete law in $O(1)$ time" is the
          follow-up once the cumulative-table answer's $O(\log k)$ per-draw cost gets
          pushed on, and the alias method is the only standard answer.
      - teach: >
          Setup rescales $q_i=kp_i$ (these average $1$), then repeatedly pairs a
          deficient cell ($q_i<1$) with a surplus cell ($q_j>1$), topping the
          deficient one up to height $1$ with mass borrowed from the surplus one and
          recording that donor as its alias — a one-time $O(k)$ cost. A draw then
          needs no search at all: pick column $i=\lceil kU_1\rceil$, and a second
          uniform $U_2$ decides between that column's own outcome and its alias.
      - ask: >
          A $3$-outcome law has its alias table already built: column $1$ is pure
          outcome $1$ (retained height $1$, no alias); column $2$ retains outcome $2$
          up to height $0.9$ and aliases the rest to outcome $1$; column $3$ retains
          outcome $3$ up to height $0.6$ and aliases the rest to outcome $1$. Draw
          with $U_1=0.75$, $U_2=0.5$: which outcome comes back?
        expects: "3"
        hint: >
          First find the column with $i=\lceil3U_1\rceil$, then check $U_2$ against
          that column's own retained height.
        feedback: >
          $i=\lceil3\times0.75\rceil=3$. Column $3$ retains its own outcome up to
          height $0.6$, and $U_2=0.5\le0.6$, so the draw returns outcome $3$ itself,
          no alias needed.
      - teach: >
          Once the table is built it encodes everything — the draw needs no search of
          any kind, only an index and one threshold test, which is exactly why the
          setup only pays for itself when the same fixed law is sampled many, many
          times.
      - ask: >
          Same table (column $3$ retains outcome $3$ up to height $0.6$, aliasing the
          rest to outcome $1$). With $U_1=0.75$ again but $U_2=0.85$, which outcome is
          returned?
        expects: "1"
        hint: >
          Compare $U_2$ against column $3$'s retained height, $0.6$.
        feedback: >
          $U_2=0.85>0.6$, so the draw falls in column $3$'s alias region and returns
          outcome $1$ instead of outcome $3$.
      - teach: >
          Rebuilding the alias table for a one-off draw wastes the setup cost — the
          plain cumulative-table search is simpler and just as fast in total for a
          single use.
      - ask: >
          You need exactly one draw from a distribution you'll never sample again. Is
          building an alias table a good idea?
        choices:
          - text: >
              Yes — $O(1)$ draws always beat $O(\log k)$
            feedback: >
              That ignores the $O(k)$ setup cost, which a single draw never recovers.
          - text: >
              No — the cumulative-table search is simpler and just as fast in total for
              one use
            correct: true
            feedback: >
              The alias method's advantage only shows up once the $O(k)$ setup is
              amortized over many draws of the same fixed law.
          - text: >
              It doesn't matter, both cost the same either way
            feedback: >
              They don't: the alias method pays extra setup cost up front that a single
              draw never earns back.
        feedback: >
          The alias method is worth its setup only when the same fixed law is sampled
          many times — for a one-off, skip it.
      - teach: >
          Forgetting that $q_i=kp_i$, not $p_i$ itself, is easy to drop under time
          pressure and breaks the height-$1$ columns the entire construction depends
          on.

  - node: quant-statistics.simulation.rejection
    hook: >
      When a density can't be inverted, or is known only up to its
      normalizing constant — the norm for a Bayesian posterior — rejection
      sampling is the fallback to name immediately, along with its real
      price: the expected number of attempts.
    explanation: >
      Picture the target density $f$ and an envelope $Mg(x)$ sitting
      entirely above it everywhere, for some proposal $g$ you already know
      how to sample (via inverse transform, say). Sampling a point uniformly
      under the graph of $Mg$ and discarding every point that lands above $f$
      but under $Mg$ leaves exactly the points that fell under $f$ — and a
      uniform draw under an entire density's graph is, in fact, a draw from
      that density. That single geometric fact is the whole proof.

      Implementing "sample under $Mg$, keep what's also under $f$" per draw
      needs no plotting: draw $Y\sim g$, draw an independent uniform $U$, and
      accept if $U\le f(Y)/(Mg(Y))$ — exactly the height fraction the point
      needs to fall within to sit under both curves.

      Each attempt succeeds independently with probability exactly $1/M$
      (integrate $f/(Mg)$ against $g$ and the $M$'s cancel), so the number of
      attempts before one acceptance is geometric with mean $M$. The whole
      method's cost is set by how tightly the envelope hugs the target, so
      choosing $M$ as small as $f\le Mg$ allows is the entire art of using
      it well.
    worked: >
      Take target $f(x)=x/2$ on $(0,2)$ with proposal $g$ uniform on
      $(0,2)$, density $1/2$. The ratio $f/g=x$ peaks at $x=2$, so $M=2$ is
      the tightest valid envelope, giving acceptance probability
      $1/M=50\%$. Accept $Y$ if $U\le f(Y)/(Mg(Y))=Y/2$. Draw $Y=1.4$,
      $U=0.65$: since $0.65\le1.4/2=0.7$, accept $X=1.4$.
    interview: >
      "How do you sample from a density you can only evaluate up to a
      constant" is the standard Bayesian-posterior prompt; the interviewer
      listens for the acceptance ratio written correctly and the
      geometric-with-mean-$M$ cost stated unprompted.
    pitfalls: >
      Choosing $M$ smaller than the true maximum of $f/g$ anywhere biases
      every accepted sample, even at one violated point. Picking a proposal
      whose tails are thinner than $f$'s forces $M$ to infinity — no valid
      envelope exists — the same fat-tails requirement that resurfaces later
      for importance sampling.
    recap: >
      Draw under a scaled envelope $Mg$, accept with probability
      $f(Y)/(Mg(Y))$, and the accepted points are distributed exactly as
      $f$ — at a cost of $M$ attempts per acceptance.
    steps:
      - teach: >
          When a density can't be inverted, or is known only up to its normalizing
          constant — the norm for a Bayesian posterior — rejection sampling is the
          fallback to name immediately, along with its real price: the expected number
          of attempts.
      - teach: >
          Pick a proposal $g$ you can already sample and a constant $M$ with $f(x)\le
          Mg(x)$ everywhere. Draw $Y\sim g$ and an independent uniform $U$; accept
          $X=Y$ if $U\le f(Y)/(Mg(Y))$, otherwise discard and retry — sampling
          uniformly under the graph of $Mg$ and keeping what also falls under $f$.
      - ask: >
          Target $f(x)=\frac38x^2$ on $(0,2)$, proposal $g$ uniform on $(0,2)$
          (density $1/2$), envelope constant $M=3$. What is the acceptance threshold
          $f(Y)/(Mg(Y))$ at $Y=1.6$?
        expects: "0.64"
        hint: >
          Substitute $Y=1.6$ into $f(Y)/(Mg(Y))$ and simplify.
        feedback: >
          $f(1.6)=\frac38(1.6)^2=0.96$, and $Mg(1.6)=3\times0.5=1.5$, so the threshold
          is $0.96/1.5=0.64$.
      - teach: >
          Each attempt succeeds independently with probability exactly $1/M$ —
          integrate $f/(Mg)$ against $g$ and the $M$'s cancel — so the number of
          attempts before an acceptance is geometric with mean $M$.
      - ask: >
          For that same envelope, $M=3$, what is the probability a single attempt is
          accepted, as a fraction?
        expects: "1/3"
        hint: >
          Acceptance probability is $1/M$.
        feedback: >
          $1/M=1/3$ — on average $3$ attempts per accepted draw.
      - teach: >
          Choosing $M$ smaller than the true maximum of $f/g$ anywhere biases every
          accepted sample, even at one violated point; a proposal with thinner tails
          than $f$'s forces $M$ to infinity and leaves no valid envelope at all.
      - ask: >
          You pick $M$ slightly smaller than the true maximum of $f(x)/g(x)$ at one
          point. What happens to the accepted sample's distribution?
        choices:
          - text: >
              Nothing — it's still exactly distributed as $f$
            feedback: >
              The proof that accepted points follow $f$ exactly relies on $f\le Mg$
              holding everywhere.
          - text: >
              It's biased — the accept rule can never trigger where $f>Mg$, understating
              the density there
            correct: true
            feedback: >
              Wherever $f(x)>Mg(x)$, the acceptance ratio $f(x)/(Mg(x))$ exceeds $1$ and
              can never be satisfied, so that region is systematically under-sampled.
          - text: >
              It only slows down the acceptance rate, without bias
            feedback: >
              A too-small $M$ isn't just slower — it removes mass from wherever $f$ pokes
              above the envelope.
        feedback: >
          $M$ must dominate $f/g$ everywhere, not just typically — falling short at
          even one point biases the accepted sample.
      - teach: >
          The whole method's cost is set by how tightly the envelope hugs the target,
          so choosing $M$ as small as $f\le Mg$ allows is the entire art of using it
          well.

  - node: quant-statistics.simulation.box-muller
    hook: >
      This exists purely because the normal's CDF has no closed-form
      inverse, and it's the standard answer to "generate a normal from a
      uniform generator" — the interview wants the polar-coordinates
      reasoning, not just the two formulas.
    explanation: >
      The move is a change of viewpoint: instead of inverting the normal CDF
      directly, which is impossible in closed form, work with a pair of
      independent standard normals at once and describe that pair in polar
      coordinates. For independent standard bivariate normal $(Z_1,Z_2)$,
      symmetry makes the angle uniform on $[0,2\pi)$ exactly, with no
      dependence on the radius, since the joint density depends only on
      $Z_1^{2}+Z_2^{2}$.

      The squared radius $R^{2}=Z_1^{2}+Z_2^{2}$ turns out to be
      Exponential($1/2$) — take that as given here. Running inverse
      transform sampling on that exponential law is exactly where
      $-2\ln U_1$ comes from: $R=\sqrt{-2\ln U_1}$.

      So the construction runs the polar picture backwards: sample the angle
      directly as uniform ($\Theta=2\pi U_2$), sample the radius via inverse
      transform on its known law, and convert back to Cartesian coordinates
      — $Z_1=R\cos\Theta$, $Z_2=R\sin\Theta$ — which are, by construction,
      independent standard normals, two for the price of two uniforms.
    worked: >
      Take $U_1=0.5$, $U_2=0.25$. Then
      $R=\sqrt{-2\ln0.5}=\sqrt{2\ln2}\approx1.1774$, and
      $\Theta=2\pi\times0.25=\pi/2$. So $Z_1=R\cos(\pi/2)=1.1774\times0=0$,
      and $Z_2=R\sin(\pi/2)=1.1774\times1=1.1774$ — one exact zero and one
      nonzero standard normal draw from this single pair of uniforms.
    interview: >
      "Generate a normal random variable from a uniform generator" is the
      canonical prompt; a strong answer states the polar-coordinates
      reasoning — uniform angle, exponential squared radius — before writing
      the two formulas, and knows this is needed precisely because
      $\Phi^{-1}$ has no closed form.
    pitfalls: >
      Producing only one normal per pair of uniforms by discarding $Z_2$
      wastes half the draws — both coordinates are valid, independent
      output. Confusing this with rejection sampling: Box–Muller accepts
      every pair of uniforms it draws; the Marsaglia polar variant is the
      one that adds an accept/reject loop instead of the two trig calls.
    recap: >
      Two uniforms become two independent standard normals by sampling the
      angle as uniform on $[0,2\pi)$ and the squared radius via inverse
      transform on its exponential law, then converting back to Cartesian
      coordinates.
    steps:
      - teach: >
          This exists purely because the normal's CDF has no closed-form inverse, and
          it's the standard answer to "generate a normal from a uniform generator" —
          the interview wants the polar-coordinates reasoning, not just the two
          formulas.
      - teach: >
          For independent standard bivariate normal $(Z_1,Z_2)$, symmetry makes the
          angle uniform on $[0,2\pi)$, and the squared radius $R^2=Z_1^2+Z_2^2$ turns
          out to be Exponential($1/2$) — running inverse transform on that exponential
          law is exactly where $R=\sqrt{-2\ln U_1}$ comes from.
      - ask: >
          For $U_1=0.2$, what is $R=\sqrt{-2\ln U_1}$, to four decimal places?
        expects: "1.7941"
        tolerance: 0.0005
        hint: >
          Compute $-2\ln(0.2)$ first, then take the square root.
        feedback: >
          $-2\ln(0.2)\approx3.2189$, and $\sqrt{3.2189}\approx1.7941$.
      - teach: >
          The construction runs the polar picture backwards: sample the angle directly
          as $\Theta=2\pi U_2$, sample the radius by inverse transform, and convert
          back to Cartesian coordinates, $Z_1=R\cos\Theta$ and $Z_2=R\sin\Theta$ — two
          independent standard normals for the price of two uniforms.
      - ask: >
          With $U_1=0.2$ (so $R\approx1.7941$) and $U_2=0.3$, what is $Z_2=R\sin(2\pi
          U_2)$, to four decimal places?
        expects: "1.7063"
        tolerance: 0.0005
        hint: >
          First get $\Theta=2\pi\times0.3$, then compute $R\sin\Theta$.
        feedback: >
          $\Theta=0.6\pi\approx1.8850$ radians, $\sin(1.8850)\approx0.9511$, and
          $1.7941\times0.9511\approx1.7063$.
      - teach: >
          Producing only one normal per pair of uniforms by discarding $Z_2$ wastes
          half the draws — both coordinates are valid, independent output, unlike the
          Marsaglia polar variant, which trades the two trig calls for an actual
          accept/reject loop.
      - ask: >
          A colleague keeps only $Z_1$ from every pair of uniforms and throws away
          $Z_2$. What's wrong with that?
        choices:
          - text: >
              Nothing — $Z_2$ is redundant once you have $Z_1$
            feedback: >
              $Z_2$ carries no less information than $Z_1$ — both are independent standard
              normal output from the same pair of uniforms.
          - text: >
              It wastes half of every generated pair — $Z_2$ is an equally valid,
              independent standard normal
            correct: true
            feedback: >
              Both $Z_1=R\cos\Theta$ and $Z_2=R\sin\Theta$ are independent $N(0,1)$ draws;
              discarding one throws away a free sample.
          - text: >
              $Z_1$ and $Z_2$ are correlated, so keeping both would double-count
            feedback: >
              They're independent by construction — that's the entire point of the
              polar-coordinates argument.
        feedback: >
          Keep both coordinates — Box–Muller accepts every pair of uniforms it draws
          and returns two usable normals from it.
      - teach: >
          Rescale with $\mu+\sigma Z$ to reach any $N(\mu,\sigma^2)$ — once you have a
          standard normal stream, every other normal law is one affine transform away.

  - node: quant-statistics.simulation.correlated-normals
    hook: >
      "Simulate two assets with correlation $\rho$" is a common desk-adjacent
      ask, and the one-line answer needs to come with the reason it has
      exactly that variance, not just the formula.
    explanation: >
      Start from two independent standard normals, which you already know
      how to produce, and build a correlated pair by mixing rather than
      transforming each one separately: keep the first coordinate as $Z_1$
      itself, and set the second to $\rho Z_1+\sqrt{1-\rho^{2}}Z_2$. Checking
      the two moments that matter confirms this does what's promised: the
      second coordinate's variance is
      $\rho^{2}\operatorname{Var}(Z_1)+(1-\rho^{2})\operatorname{Var}(Z_2)
      =\rho^{2}+(1-\rho^{2})=1$ exactly, using independence to drop the
      cross term, and its covariance with $Z_1$ is $\rho$, since the
      $\sqrt{1-\rho^{2}}Z_2$ piece contributes nothing to that covariance.

      The $d$-dimensional version is the same idea done with matrices: factor
      the target covariance $\Sigma$ as $LL^{T}$ with $L$ lower-triangular —
      guaranteed to exist because a covariance matrix is always positive
      semidefinite — and set $X=\mu+LZ$ for a vector $Z$ of independent
      standard normals. Then $\operatorname{Cov}(X)=L\operatorname{Cov}(Z)
      L^{T}=LL^{T}=\Sigma$ by the same bilinearity argument as the
      two-dimensional case, just carried in matrix form; the formula above
      is exactly the $2\times2$ Cholesky factor written out by hand.

      One wrinkle to flag: an estimated correlation or covariance matrix from
      real data can come back slightly non-positive-semidefinite from noise
      or missing data, in which case Cholesky fails outright — the fix is an
      eigendecomposition $\Sigma=Q\Lambda Q^{T}$, clipping negative
      eigenvalues to zero and taking $L=Q\Lambda^{1/2}$ as a repaired square
      root.
    worked: >
      Take $\rho=0.6$, and suppose a draw gives $Z_1=1$, $Z_2=2$. The
      correlated pair's second coordinate is
      $0.6\times1+\sqrt{1-0.36}\times2=0.6+0.8\times2=0.6+1.6=2.2$, so the
      simulated pair is $(1, 2.2)$ — equivalently the $2\times2$ Cholesky
      factor with entries $0.6$ and $0.8=\sqrt{1-0.6^{2}}$ applied to
      $(1,2)$.
    interview: >
      "Simulate two correlated normal random variables, or a
      $d$-dimensional multivariate normal, given only a standard normal
      generator" is answered with Cholesky named by name; a common follow-up
      asks what happens with a noisy, non-PSD covariance estimate.
    pitfalls: >
      Applying Cholesky to a matrix that isn't actually positive
      semidefinite, common with a noisy sample covariance, gives a silent
      failure or garbage output instead of the eigenvalue-clipping fix.
      Building the pair as $\rho Z_1+Z_2$ without the $\sqrt{1-\rho^{2}}$
      scaling gives the second coordinate variance $\rho^{2}+1$, not $1$, so
      the marginal law is no longer standard normal.
    recap: >
      A correlated normal vector is an independent standard normal vector
      pushed through the Cholesky factor of the target covariance,
      $\Sigma=LL^{T}$; in two dimensions that's exactly
      $\rho Z_1+\sqrt{1-\rho^{2}}Z_2$.
    steps:
      - teach: >
          "Simulate two assets with correlation $\rho$" is a common desk-adjacent ask,
          and the one-line answer needs to come with the reason it has exactly that
          variance, not just the formula.
      - teach: >
          Keep $Z_1$ as the first coordinate and set the second to $\rho
          Z_1+\sqrt{1-\rho^2}Z_2$ for independent standard normals $Z_1,Z_2$. Its
          variance is $\rho^2+(1-\rho^2)\operatorname{Var}(Z_2)=1$ exactly, using
          independence to drop the cross term, and its covariance with $Z_1$ is
          $\rho$.
      - ask: >
          Take $\rho=0.5$ and a draw $Z_1=-1$, $Z_2=3$. What is the correlated pair's
          second coordinate, to four decimal places?
        expects: "2.0981"
        tolerance: 0.0005
        hint: >
          Compute $\rho Z_1+\sqrt{1-\rho^2}Z_2$ directly.
        feedback: >
          $0.5\times(-1)+\sqrt{1-0.25}\times3=-0.5+0.8660\times3\approx-0.5+2.5981\approx2.0981$.
      - teach: >
          The $d$-dimensional version is the same idea in matrix form: factor
          $\Sigma=LL^T$ with $L$ lower-triangular, the Cholesky factor — guaranteed to
          exist since a covariance matrix is always positive semidefinite — and set
          $X=\mu+LZ$, giving $\operatorname{Cov}(X)=LL^T=\Sigma$.
      - ask: >
          By the same identity, for $\rho=0.8$, what is the exact variance of the
          second coordinate $\rho Z_1+\sqrt{1-\rho^2}Z_2$?
        expects: "1"
        hint: >
          The identity $\rho^2+(1-\rho^2)=1$ holds for every value of $\rho$.
        feedback: >
          $\rho^2+(1-\rho^2)=1$ regardless of $\rho$ — the construction always yields
          a standard normal marginal, whatever correlation it's built to carry.
      - teach: >
          An estimated covariance matrix from real data can come back slightly
          non-positive-semidefinite from noise, in which case Cholesky fails outright;
          the fix is an eigendecomposition $\Sigma=Q\Lambda Q^T$, clipping negative
          eigenvalues to zero and taking $L=Q\Lambda^{1/2}$.
      - ask: >
          You build the pair as $\rho Z_1+Z_2$ instead of $\rho
          Z_1+\sqrt{1-\rho^2}Z_2$. What is the resulting variance of the second
          coordinate?
        choices:
          - text: >
              $1$
            feedback: >
              That's the variance of the *correct* construction — dropping
              $\sqrt{1-\rho^2}$ changes the answer.
          - text: >
              $\rho^2+1$
            correct: true
            feedback: >
              Without the scaling, $\operatorname{Var}(\rho Z_1+Z_2)=\rho^2+1$, which
              exceeds $1$ for any $\rho\ne0$ — the marginal is no longer standard normal.
          - text: >
              $1-\rho^2$
            feedback: >
              This would be the variance if the $Z_1$ term were dropped entirely, not the
              effect of the missing square root.
        feedback: >
          The $\sqrt{1-\rho^2}$ scaling on $Z_2$ is what keeps the second coordinate's
          variance at exactly $1$; omitting it inflates the variance instead.
      - teach: >
          In two dimensions the Cholesky factor is exactly the entries $\rho$ and
          $\sqrt{1-\rho^2}$ written out by hand — the matrix machinery is the
          identical bilinearity argument, just carried in general form.

  - node: quant-statistics.simulation.bootstrap
    hook: >
      "You have one sample and a statistic — how do you get its standard
      error without a formula" is answered by the bootstrap, and the
      interview wants the substitution principle stated precisely: resample
      the data itself in place of the unknown population.
    explanation: >
      You're stuck because the sampling distribution of
      $\hat{\theta}=T(X_1,\ldots,X_n)$ depends on the true, unknown $F$, and
      you only get to see it once. The bootstrap's move: since the empirical
      distribution $\hat{F}_n$ — each observed value gets mass $1/n$ — is your
      best available stand-in for $F$, simulate from $\hat{F}_n$ instead, and
      use Monte Carlo, exactly the machinery already built in this unit, to
      see how $T$ behaves under repeated sampling.

      Sampling from $\hat{F}_n$ concretely means resampling the actual data
      with replacement: draw $n$ values from the observed
      $X_1,\ldots,X_n$, allowing repeats, compute the statistic on that
      resample, and repeat the whole thing $B$ times to get replicates
      $\hat{\theta}_1^{*},\ldots,\hat{\theta}_B^{*}$. Their spread stands in
      for $\hat{\theta}$'s true sampling distribution — the sample standard
      deviation of the replicates estimates the standard error, and their
      $2.5\%$/$97.5\%$ percentiles give an interval, with no variance formula
      ever required.

      Keep the two sources of error separate: $B$ controls only how
      precisely you've approximated the resampling distribution, pure
      simulation noise, driven down cheaply by taking $B$ large since
      resampling is fast — while the real statistical uncertainty, how far
      $\hat{\theta}$ itself sits from the true $\theta$, is fixed by $n$, and
      no amount of resampling manufactures information the original $n$
      observations didn't contain.
    worked: >
      Data $\{2,4,6,8,10\}$, $n=5$, sample mean $6$. For the mean
      specifically, the bootstrap variance has a clean closed form: it
      equals the empirical variance, dividing by $n$, divided again by $n$.
      The empirical variance here is $(16+4+0+4+16)/5=8$, so the bootstrap
      standard error is $\sqrt{8/5}=\sqrt{1.6}\approx1.265$ — matching, up to
      the $n$ versus $n-1$ divisor convention, the ordinary standard-error
      formula, confirming the resampling machinery reproduces a known answer
      before trusting it on a statistic with no formula at all.
    interview: >
      "How would you get a confidence interval for an estimator with no
      known variance formula" is answered by naming the resample-with-
      replacement procedure and the substitution of $\hat{F}_n$ for $F$
      explicitly; a follow-up on what $B$ controls is answered by naming it
      as pure simulation noise, separate from $n$'s statistical noise.
    pitfalls: >
      Resampling without replacement just reproduces the original sample as
      a permutation and manufactures zero new information — "with
      replacement" is not optional, it's the entire mechanism. Believing a
      larger $B$ fixes an inherently small or biased sample confuses
      simulation noise, which $B$ controls, with statistical precision,
      which $n$ alone determines.
    recap: >
      The bootstrap resamples the observed data with replacement in place of
      drawing from the unknown true distribution, and the scatter of the
      resulting replicated statistics estimates its real sampling error.
    steps:
      - teach: >
          "You have one sample and a statistic — how do you get its standard error
          without a formula" is answered by the bootstrap, and the interview wants the
          substitution principle stated precisely: resample the data itself in place
          of the unknown population.
      - teach: >
          The sampling distribution of $\hat\theta=T(X_1,\ldots,X_n)$ depends on the
          unknown $F$, so substitute the empirical distribution $\hat F_n$ — mass
          $1/n$ on each observed value — for $F$: draw $n$ values with replacement,
          compute the statistic, and repeat $B$ times.
      - ask: >
          Data $\{10, 12, 14, 18, 26\}$, $n=5$. What is the empirical variance
          $\frac1n\sum(x_i-\bar x)^2$?
        expects: "32"
        hint: >
          Find the mean first, then average the squared deviations from it.
        feedback: >
          $\bar x=(10+12+14+18+26)/5=16$. Squared deviations are $36,16,4,4,100$,
          summing to $160$, and $160/5=32$.
      - teach: >
          For the mean specifically, the bootstrap variance has a clean closed form —
          the empirical variance divided by $n$ again — and $B$ controls only how
          precisely that resampling distribution is approximated, pure simulation
          noise, entirely separate from the statistical uncertainty that $n$ alone
          sets.
      - ask: >
          Using that same data ($n=5$, empirical variance $32$), what is the bootstrap
          standard error of the mean, to four decimal places?
        expects: "2.5298"
        tolerance: 0.0005
        hint: >
          Bootstrap variance of the mean is the empirical variance divided by $n$;
          then take the square root.
        feedback: >
          $32/5=6.4$, and $\sqrt{6.4}\approx2.5298$.
      - teach: >
          Resampling without replacement just reproduces the original sample as a
          permutation and manufactures zero new information — "with replacement" is
          the entire mechanism, not an optional detail.
      - ask: >
          You increase $B$ from $1000$ to $100{,}000$ resamples, but the original
          sample still has only $n=5$ observations. What happens to your estimate of
          $\hat\theta$'s true standard error?
        choices:
          - text: >
              It gets much more accurate, since it now reflects the true population
            feedback: >
              This conflates simulation noise with statistical precision — $B$ never sees
              more of the population than the original $5$ observations already contain.
          - text: >
              The simulation noise in approximating the resampling distribution shrinks,
              but the underlying statistical uncertainty, set by $n=5$, is unchanged
            correct: true
            feedback: >
              $B$ only controls how precisely you've approximated $\hat F_n$'s resampling
              distribution; no amount of resampling manufactures information the original
              $5$ points didn't contain.
          - text: >
              Nothing changes at all
            feedback: >
              Something does change — the Monte Carlo noise in the bootstrap estimate
              itself shrinks — just not the statistical uncertainty from having only
              $n=5$.
        feedback: >
          Keep the two error sources separate: $B$ is simulation noise, driven down
          cheaply; $n$ is statistical uncertainty, fixed by the data you actually
          have.
      - teach: >
          The spread of the $B$ replicates stands in for $\hat\theta$'s true sampling
          distribution with no variance formula ever required — their $2.5\%$/$97.5\%$
          percentiles give an interval just as directly.

  - node: quant-statistics.simulation.bootstrap-caveats
    hook: >
      Interviewers who've seen the bootstrap taught once love asking "does
      this always work," and the sample maximum is the fastest concrete
      counterexample to have ready.
    explanation: >
      The bootstrap's validity rests on the statistic being a smooth
      functional of the underlying distribution — small changes to $F$
      produce small, well-behaved changes to $T(F)$ — which holds for means,
      variances, correlations and regression coefficients, the bread and
      butter of applied statistics.

      It breaks specifically when the statistic is governed by the extreme
      edge of the data rather than the bulk, because $\hat{F}_n$, unlike the
      true $F$, has hard edges exactly at the observed min and max and
      nothing beyond them. The sample maximum makes this concrete: a
      resample reproduces the true observed maximum with probability
      $1-(1-1/n)^{n}$, converging to $1-1/e\approx0.632$ — so instead of a
      smooth spread around the truth, the bootstrap distribution of the
      maximum carries a large literal spike sitting exactly at the one
      number already observed, and never resembles the true variability of
      an extreme value.

      Two further, unrelated failure modes are worth having ready rather
      than conflating with the tail issue: resampling with replacement
      treats every draw as independent, so on time-series or otherwise
      dependent data it silently destroys the serial correlation that made
      the original data informative — the fix is a block bootstrap,
      resampling contiguous chunks instead of single points — and no version
      of resampling can undo a systematically biased original sample;
      $\hat{F}_n$ faithfully reproduces whatever survivorship or look-ahead
      contamination is already in the data handed to it.
    worked: >
      Take $n=4$ observations. A single bootstrap resample of size $4$
      misses the true maximum entirely with probability
      $(1-1/4)^{4}=(0.75)^{4}=0.3164$, so it contains the max with
      probability $1-0.3164=0.6836$ — already close to the limiting
      $63.2\%$ even at this tiny $n$, confirming the spike at the observed
      maximum isn't a large-sample artifact.
    interview: >
      "Does the bootstrap work for this statistic" is answered by
      classifying it as a smooth functional or an extreme-value one; "what
      if your data is a time series" is answered by naming the block
      bootstrap directly as the fix for destroyed serial correlation.
    pitfalls: >
      Applying the plain iid bootstrap to time-series data without switching
      to a block bootstrap scrambles the dependence structure the original
      statistic relied on. Expecting the bootstrap to fix a biased sample is
      wrong — it reproduces $\hat{F}_n$ exactly, survivorship bias and all,
      with no mechanism to correct for what was never observed.
    recap: >
      The bootstrap is trustworthy for smooth functionals of $F$ but not for
      extremes — the resampled maximum repeats the one observed maximum
      about $63.2\%$ of the time, a spike no amount of resampling removes.
    steps:
      - teach: >
          Interviewers who've seen the bootstrap taught once love asking "does this
          always work", and the sample maximum is the fastest concrete counterexample
          to have ready.
      - teach: >
          The bootstrap is trustworthy for smooth functionals of $F$ — means,
          variances, correlations, regression coefficients — but breaks when the
          statistic is governed by the extreme edge of the data, because $\hat F_n$
          has hard edges exactly at the observed min and max and nothing beyond them.
      - ask: >
          For $n=6$ observations, what is the probability a bootstrap resample of size
          $n$ contains the true observed maximum, to four decimal places?
        expects: "0.6651"
        tolerance: 0.0005
        hint: >
          The probability it's *missed* is $(1-1/n)^n$; subtract from $1$.
        feedback: >
          $(1-1/6)^6=(5/6)^6\approx0.3349$, so the probability it's included is
          $1-0.3349\approx0.6651$.
      - teach: >
          As $n$ grows this converges to a fixed limit rather than shrinking toward
          $0$ or $1$ — a permanent spike in the bootstrap distribution of the maximum
          sitting exactly at the one value already observed, never resembling the true
          variability of an extreme.
      - ask: >
          As $n\to\infty$, what does the probability that a resample contains the true
          maximum converge to, to four decimal places?
        expects: "0.6321"
        tolerance: 0.0005
        hint: >
          The limit is $1-1/e$.
        feedback: >
          $1-1/e\approx1-0.3679\approx0.6321$ — no amount of increasing $n$ shrinks
          this spike away.
      - teach: >
          Two further, unrelated failure modes: resampling with replacement treats
          every draw as independent, so on time-series data it silently destroys the
          serial correlation the original data carried — the fix is a block bootstrap,
          resampling contiguous chunks instead of single points.
      - ask: >
          Your data is a daily time series with strong autocorrelation, and you
          resample individual days independently with replacement, iid style. What
          breaks?
        choices:
          - text: >
              Nothing — the bootstrap handles any data the same way
            feedback: >
              The plain iid bootstrap assumes exchangeable observations; a dependent time
              series violates that assumption outright.
          - text: >
              The resampling destroys the serial correlation the original data carried, so
              use a block bootstrap instead
            correct: true
            feedback: >
              Independent resampling of single days scrambles whatever dependence
              structure made the sequence informative — resampling contiguous blocks
              preserves it.
          - text: >
              It automatically fixes any survivorship bias in the series
            feedback: >
              No version of resampling repairs a systematically biased sample — $\hat F_n$
              faithfully reproduces whatever contamination is already in the data.
        feedback: >
          Dependent data needs a block bootstrap; no amount of resampling, block or
          otherwise, can undo a biased original sample.
      - teach: >
          Classify the statistic before trusting the bootstrap: a smooth functional of
          $F$ is safe, but anything living at the edge of the support or the extreme
          tail needs a different tool entirely.

  - node: quant-statistics.simulation.variance-reduction
    hook: >
      "How would you speed up this simulation" almost always means "cut the
      variance per draw," not "run more paths," and the interview wants the
      cost-adjusted argument for why, not just the buzzwords.
    explanation: >
      Since $\operatorname{Var}(\hat{\theta}_n)=\sigma^{2}/n$, halving
      $\sigma^{2}$ and halving $n$ produce the exact same estimator variance
      — so any device that halves $\sigma^{2}$ for less than double the
      per-draw computational cost is a strict win, and one that costs more
      than double is a loss, however cleverly it's marketed. The right
      single number to optimize is variance times cost per sample, never
      variance alone.

      Each standard device earns its keep by recovering some structure the
      naive estimator throws away for free: antithetic variates exploit the
      built-in symmetry of the uniform stream itself; control variates
      exploit a second, correlated quantity whose true mean happens to be
      known exactly; importance sampling exploits knowing in advance roughly
      where in the sample space the payoff actually lives, instead of
      wasting draws elsewhere.

      A fourth option, often the largest win of all though it isn't a named
      technique here: analytically integrating out whatever part of the
      randomness you can in closed form, and simulating only what's left —
      every dimension removed this way costs literally zero variance and
      zero draws, strictly better than any reweighting trick applied to it.
    worked: >
      A baseline estimator has $\sigma_0^{2}=1$, cost $1$ per sample, and a
      budget for $1200$ unit-cost samples, giving variance
      $1/1200\approx0.000833$. A proposed trick halves the variance to
      $0.5$ but triples the per-sample cost to $3$; the same budget now buys
      only $1200/3=400$ samples, giving variance $0.5/400=0.00125$ — worse
      than the baseline, despite genuinely halving the per-draw variance,
      because the cost tripled faster than the variance fell.
    interview: >
      "How would you make this simulation more efficient" wants variance
      times cost named as the actual figure of merit within the first
      sentence, followed by whichever of the three structural tricks fits
      the payoff described.
    pitfalls: >
      Reporting "I halved the variance" as self-evidently good, without
      stating the change in per-sample cost, ignores that a trick can lower
      variance and still lose on a fixed budget. Reaching for a
      variance-reduction trick before checking whether part of the
      randomness can just be integrated out analytically skips the usually
      biggest free win.
    recap: >
      The right figure of merit is variance times cost per sample, not
      variance alone, and antithetic variates, control variates and
      importance sampling each recover a different piece of structure the
      naive estimator throws away.
    steps:
      - teach: >
          "How would you speed up this simulation" almost always means "cut the
          variance per draw", not "run more paths", and the interview wants the
          cost-adjusted argument for why, not just the buzzwords.
      - teach: >
          Since $\operatorname{Var}(\hat\theta_n)=\sigma^2/n$, halving $\sigma^2$ and
          halving $n$ give the exact same estimator variance — so the right single
          number to optimize is variance times cost per sample, never variance alone.
      - ask: >
          A budget buys $1000$ unit-cost samples. A technique quadruples the
          per-sample cost to $4$. How many samples does the same budget now buy?
        expects: "250"
        hint: >
          Divide the budget by the new per-sample cost.
        feedback: >
          $1000/4=250$ samples at the higher cost.
      - teach: >
          Each standard device recovers some structure the naive estimator throws away
          for free: antithetic variates exploit the uniform stream's built-in
          symmetry, control variates exploit a correlated quantity with known mean,
          and importance sampling exploits knowing where the payoff actually lives —
          with analytically integrating out part of the randomness, often the largest
          win of all, costing zero draws for whatever it removes.
      - ask: >
          A technique cuts per-draw variance from $1$ to $0.3$ but quadruples the
          per-sample cost to $4$. What is its variance times cost figure of merit?
        expects: "1.2"
        hint: >
          Multiply the new variance by the new cost per sample.
        feedback: >
          $0.3\times4=1.2$ — worse than the baseline's merit of $1\times1=1$, despite
          genuinely cutting the per-draw variance.
      - teach: >
          Reporting "I halved the variance" as self-evidently good, without stating
          the change in per-sample cost, ignores that a trick can lower variance and
          still lose on a fixed budget.
      - ask: >
          A technique's variance times cost figure of merit works out to $1.2$, versus
          a baseline of $1$ (variance $1$, cost $1$). Should you adopt it?
        choices:
          - text: >
              Yes — it lowers the per-draw variance, and lower variance is always better
            feedback: >
              Lower variance alone ignores the higher per-sample cost; on a fixed budget
              that higher cost buys fewer samples than the variance cut saves.
          - text: >
              No — its variance times cost is higher, so for a fixed budget it delivers
              worse final variance than the baseline
            correct: true
            feedback: >
              $1.2>1$ means, samples-for-samples, the baseline reaches a lower final
              variance for the same budget despite its higher per-draw variance.
          - text: >
              It depends on how large $n$ is
            feedback: >
              Variance times cost is the figure of merit precisely because it's scale-free
              — the comparison doesn't depend on the size of the budget.
        feedback: >
          Variance times cost per sample is the only comparison that matters — a trick
          can cut variance and still be a net loss.
      - teach: >
          Reaching for a variance-reduction trick before checking whether part of the
          randomness can simply be integrated out analytically skips the usually
          biggest free win available.

  - node: quant-statistics.simulation.antithetic
    hook: >
      Given one uniform draw, getting a second observation almost for free is
      exactly antithetic variates, and the interview trap is a payoff where
      the trick silently makes things worse instead of better.
    explanation: >
      Every simulated output, however complicated its construction, is
      ultimately some function $Y=h(U)$ of the underlying uniform draw — so
      it comes with a free mirror image for the price of one extra function
      call: run $h$ at $1-U$ as well, giving $Y_2=h(1-U)$ with exactly the
      same marginal law as $Y_1=h(U)$, since $1-U$ is uniform too, and
      average the pair.

      The paired average's variance,
      $\operatorname{Var}(A)=\sigma^{2}(1+\rho)/2$ with
      $\rho=\operatorname{Corr}(Y_1,Y_2)$, beats two independent draws
      (which give $\sigma^{2}/2$) exactly when $\rho<0$ — and $\rho<0$ is
      guaranteed whenever $h$ is monotone in $U$, because large $U$ and
      small $1-U$ then push $h(U)$ and $h(1-U)$ to opposite ends of their
      range in lockstep, mechanically inducing negative correlation with no
      extra argument needed.

      The trap is a non-monotone payoff: something large both when $U$ is
      small and when $U$ is large has $Y_1$ and $Y_2$ moving together rather
      than oppositely, so $\rho$ can turn positive — at which point $1+\rho$
      exceeds $1$, and pairing the draws actively increases variance
      relative to two independent uniforms, the opposite of the intended
      effect.
    worked: >
      Take $h(u)=u^{3}$, with true mean $\mathbb{E}[U^{3}]=1/4=0.25$. A
      single raw draw at $U=0.2$ gives $h(0.2)=0.008$, wildly off on its
      own. Its antithetic partner at $1-U=0.8$ gives $h(0.8)=0.512$, and the
      paired average is $(0.008+0.512)/2=0.26$ — already within $0.01$ of the
      true $0.25$ from a single pair, because $h$ is monotone increasing and
      the two evaluations land on opposite sides of the mean by
      construction.
    interview: >
      "How would you cut variance with essentially no extra sampling cost"
      is answered by naming antithetic variates and the $U$/$1-U$ pairing;
      the follow-up, "when could this backfire," is answered by naming a
      non-monotone payoff and $\rho$ turning positive.
    pitfalls: >
      Applying antithetics automatically without checking monotonicity is
      risky — a payoff symmetric around some interior point can have
      positive $\rho$, actively hurting. Miscounting the cost as an extra
      full simulation path rather than one extra function evaluation per
      pair overstates the price of the trick.
    recap: >
      Evaluate the payoff at both $U$ and $1-U$ and average: the pair's
      variance is $\sigma^{2}(1+\rho)/2$, a win exactly when the payoff is
      monotone enough to force $\rho$ negative.
    steps:
      - teach: >
          Given one uniform draw, getting a second observation almost for free is
          exactly antithetic variates, and the interview trap is a payoff where the
          trick silently makes things worse instead of better.
      - teach: >
          Every simulated output is $Y=h(U)$ for some function of the uniform draw, so
          it comes with a free mirror image: evaluate $h$ at $1-U$ too — which has the
          identical marginal law, since $1-U$ is uniform — and average the pair,
          $A=(Y_1+Y_2)/2$.
      - ask: >
          For $h(u)=\sqrt u$ and a fresh draw $U=0.36$, what is the antithetic paired
          average $A=(h(U)+h(1-U))/2$?
        expects: "0.7"
        hint: >
          Compute $h(0.36)$ and $h(0.64)$ separately, then average.
        feedback: >
          $h(0.36)=\sqrt{0.36}=0.6$ and $h(0.64)=\sqrt{0.64}=0.8$, so
          $A=(0.6+0.8)/2=0.7$ — already close to the true mean $\mathbb{E}[\sqrt
          U]=2/3\approx0.6667$ from a single pair.
      - teach: >
          The paired average's variance is $\operatorname{Var}(A)=\sigma^2(1+\rho)/2$
          with $\rho=\operatorname{Corr}(Y_1,Y_2)$, beating two independent draws'
          $\sigma^2/2$ exactly when $\rho<0$ — guaranteed whenever $h$ is monotone,
          since large $U$ and small $1-U$ push $h(U)$ and $h(1-U)$ to opposite ends of
          their range in lockstep.
      - ask: >
          For $\sigma^2=5$ and $\rho=-0.6$, what is
          $\operatorname{Var}(A)=\sigma^2(1+\rho)/2$?
        expects: "1"
        hint: >
          Substitute directly into the formula.
        feedback: >
          $5\times(1-0.6)/2=5\times0.4/2=1$ — well below the independent-pair variance
          of $\sigma^2/2=2.5$.
      - teach: >
          A non-monotone payoff is the trap: something that's the same at $U$ and
          $1-U$, like a straddle-shaped function, has $Y_1=Y_2$ moving together rather
          than oppositely, so $\rho$ can turn positive — and $1+\rho$ then exceeds
          $1$, actively increasing variance relative to two independent uniforms.
      - ask: >
          A payoff $h(u)=|u-0.5|$ is symmetric around $u=0.5$, so $h(u)=h(1-u)$
          exactly for every $u$. What happens to antithetic pairing here?
        choices:
          - text: >
              It still helps, since $U$ and $1-U$ are different draws
            feedback: >
              Different draws of $U$, yes — but $h(U)$ and $h(1-U)$ are *identical*
              numbers every time, since the payoff is symmetric around $0.5$.
          - text: >
              $\rho=1$ exactly, since $Y_1=Y_2$ always, so pairing gives no variance
              reduction at all
            correct: true
            feedback: >
              $Y_1=Y_2$ makes $\rho=1$, so
              $\operatorname{Var}(A)=\sigma^2(1+1)/2=\sigma^2$ — the same variance as a
              single draw, and worse than two independent draws' $\sigma^2/2$.
          - text: >
              It guarantees a variance reduction, since $h$ is still a valid function of
              $U$
            feedback: >
              Monotonicity is what guarantees $\rho<0$; this payoff is the opposite of
              monotone around $u=0.5$.
        feedback: >
          Non-monotone, symmetric-around-the-midpoint payoffs are exactly where
          antithetic pairing stops helping and can even hurt — check monotonicity
          before reaching for the trick.
      - teach: >
          The whole trick costs one extra function evaluation per pair, not an extra
          simulation path — cheap enough that checking monotonicity first is the only
          real diligence it requires.

  - node: quant-statistics.simulation.control-variates
    hook: >
      A correlated quantity whose true mean you already know in closed form
      is the setup control variates want you to spot immediately — most
      desk pricing problems have one sitting in plain sight, a related
      instrument with a known formula.
    explanation: >
      The idea needs one ingredient beyond the target $Y$: a second
      simulated quantity $C$, produced on the same run, whose true mean
      $\mu_C$ is known exactly in closed form. Averaging
      $Y_i - b(C_i-\mu_C)$ instead of $Y_i$ alone stays unbiased for
      $\theta=\mathbb{E}[Y]$ for any constant $b$, since
      $\mathbb{E}[C_i-\mu_C]=0$ subtracts a term with mean zero — the only
      question is how to pick $b$ to help rather than hurt.

      Writing the per-draw variance as a function of $b$,
      $\operatorname{Var}(Y)-2b\operatorname{Cov}(Y,C)+b^{2}
      \operatorname{Var}(C)$, is a plain quadratic, minimized where its
      derivative vanishes: $b^{*}=\operatorname{Cov}(Y,C)/
      \operatorname{Var}(C)$, exactly the least-squares regression slope of
      $Y$ on $C$. Plugging $b^{*}$ back in collapses the variance to
      $\operatorname{Var}(Y)(1-\rho^{2})$ with
      $\rho=\operatorname{Corr}(Y,C)$ — the residual left over after
      regressing out everything $C$ explains about $Y$.

      That $1-\rho^{2}$ factor is the complement of an $R^{2}$, so the
      payoff scales the way regression $R^{2}$ does: a control correlated at
      $\rho=0.9$ removes $81\%$ of the variance, but $\rho=0.5$ removes only
      $25\%$ — weak correlation buys very little, which is why finding a $C$
      both strongly correlated with $Y$ and genuinely known, not just
      estimable, is the entire craft; $b^{*}$ itself is normally estimated
      from a small pilot run.
    worked: >
      Suppose $\operatorname{Var}(Y)=4$, $\mu_C$ is known exactly,
      $\operatorname{Var}(C)=9$, and $\operatorname{Cov}(Y,C)=4.8$. Then
      $b^{*}=4.8/9\approx0.533$, and $\rho=4.8/\sqrt{4\times9}=4.8/6=0.8$.
      The controlled variance is
      $\operatorname{Var}(Y)(1-\rho^{2})=4\times(1-0.64)=4\times0.36=1.44$ —
      down from $4$, a $64\%$ cut, exactly $\rho^{2}$.
    interview: >
      "You're pricing something by simulation and a related, exactly-priced
      instrument moves with it — how do you use that" is a direct
      control-variates prompt; the interviewer wants the regression slope
      $b^{*}$ and the $\rho^{2}$ variance reduction stated, not just "use a
      correlated variable."
    pitfalls: >
      Using a $b$ other than the optimal regression slope keeps the
      estimator unbiased but not minimum-variance, and a poorly chosen $b$
      can even increase it. Picking a $C$ that's merely correlated with $Y$
      but whose "known" mean is itself only estimated breaks the
      unbiasedness argument, which needs $\mu_C$ exact.
    recap: >
      Subtract $b^{*}(C-\mu_C)$ for a correlated, exactly-known-mean
      quantity $C$, at the regression-slope choice
      $b^{*}=\operatorname{Cov}(Y,C)/\operatorname{Var}(C)$, and the
      variance drops by the factor $1-\rho^{2}$.
    steps:
      - teach: >
          A correlated quantity whose true mean you already know in closed form is the
          setup control variates want you to spot immediately — most desk pricing
          problems have one sitting in plain sight, a related instrument with a known
          formula.
      - teach: >
          Average $Y_i-b(C_i-\mu_C)$ instead of $Y_i$ alone: unbiased for any constant
          $b$, since $\mathbb{E}[C_i-\mu_C]=0$. The per-draw variance is a quadratic
          in $b$, minimized at $b^*=\operatorname{Cov}(Y,C)/\operatorname{Var}(C)$ —
          the regression slope of $Y$ on $C$.
      - ask: >
          Suppose $\operatorname{Var}(Y)=10$, $\operatorname{Var}(C)=4$,
          $\operatorname{Cov}(Y,C)=4$. What is $b^*$?
        expects: "1"
        hint: >
          Divide the covariance by $\operatorname{Var}(C)$.
        feedback: >
          $b^*=\operatorname{Cov}(Y,C)/\operatorname{Var}(C)=4/4=1$.
      - teach: >
          At $b^*$ the variance collapses to $\operatorname{Var}(Y)(1-\rho^2)$ with
          $\rho=\operatorname{Corr}(Y,C)$ — the residual left over after regressing
          out everything $C$ explains, so the saving is exactly the $R^2$ of that
          regression.
      - ask: >
          For that same setup ($\operatorname{Var}(Y)=10$,
          $\rho^2=\operatorname{Cov}(Y,C)^2/(\operatorname{Var}(Y)\operatorname{Var}(C))=16/40=0.4$),
          what is the controlled estimator's variance?
        expects: "6"
        hint: >
          Multiply $\operatorname{Var}(Y)$ by $(1-\rho^2)$.
        feedback: >
          $10\times(1-0.4)=10\times0.6=6$ — a $40\%$ cut, exactly $\rho^2$.
      - teach: >
          Finding a $C$ both strongly correlated with $Y$ and genuinely known, not
          just estimable, is the entire craft: weak correlation buys very little,
          since $\rho=0.5$ removes only $25\%$ of the variance against $\rho=0.9$'s
          $81\%$.
      - ask: >
          You use a $C$ that's strongly correlated with $Y$, but whose "known" mean
          $\mu_C$ is actually itself only estimated from a pilot run rather than known
          in closed form. What breaks?
        choices:
          - text: >
              Nothing, as long as $\rho$ is high
            feedback: >
              The unbiasedness argument, not the variance reduction, is what depends on
              $\mu_C$ — a high $\rho$ doesn't rescue it.
          - text: >
              The unbiasedness argument needs $\mu_C$ exact — if it's only estimated,
              $\mathbb{E}[C_i-\mu_C]\ne0$ in general, and the estimator inherits that bias
            correct: true
            feedback: >
              Unbiasedness of $Y_i-b(C_i-\mu_C)$ relies entirely on
              $\mathbb{E}[C_i-\mu_C]=0$, which needs $\mu_C$ known exactly, not merely
              estimated.
          - text: >
              It only affects the variance reduction, not the bias
            feedback: >
              It's the reverse: the choice of $b$ affects variance, but an inexact $\mu_C$
              corrupts the unbiasedness itself.
        feedback: >
          The control variate's mean must be known exactly — an estimated $\mu_C$
          silently reintroduces the bias the method is supposed to avoid.
      - teach: >
          In practice $b^*$ itself is estimated from a small pilot run — the exact
          optimum isn't needed, since any $b$ near it stays unbiased and still
          captures most of the reduction.

  - node: quant-statistics.simulation.importance-sampling
    hook: >
      Estimating a probability so small that naive simulation would need
      hundreds of millions of draws is the standard setup for importance
      sampling, and the interview wants the likelihood-ratio weight written
      correctly, not just "sample more from the tail."
    explanation: >
      The algebraic move is a single insertion: multiply and divide the
      integrand by a second density $g$ you're free to choose, turning
      $\mathbb{E}_f[h(X)]$ into $\mathbb{E}_g[h(X)w(X)]$ with weight
      $w=f/g$ — the same expectation, rewritten under a different sampling
      law, with a correction weight attached to undo the distortion.
      Simulating from $g$ and averaging $h$ times $w$ is unbiased for the
      original target under exactly one condition: $g$ must be positive
      everywhere $hf$ is nonzero, or that region of probability mass is
      silently dropped with no warning.

      The entire point of choosing $g$ deliberately is to put draws where
      $h(X)$ actually matters instead of spending the budget on outcomes
      that contribute nothing — precisely the rare-event regime: if an
      event's true probability is on the order of $10^{-7}$, a naive
      sampler needs on the order of $10^{7}$ to $10^{8}$ draws just to see a
      handful of occurrences, while sampling directly from a law
      concentrated near the event and reweighting needs only thousands.

      The danger runs the opposite direction from a thin proposal: if $f/g$
      is unbounded anywhere, the weighted estimator can have infinite
      variance while its simulated output looks perfectly calm — occasional
      enormous weights corrupt the average with no visible warning sign in a
      short run — so the standing rule is to give $g$ tails at least as
      heavy as $f$'s, never thinner.
    worked: >
      Estimate $\theta=\Pr(X>7)$ for $X\sim\mathrm{Exponential}(\text{rate
      }1)$; the true value is $e^{-7}\approx0.000912$. Sample instead from
      $g=\mathrm{Exponential}(\text{rate }1/7)$, mean $7$, with weight
      $w(x)=f(x)/g(x)=7e^{-6x/7}$. A representative draw at $x=8$ under $g$
      gives weight $w(8)=7e^{-48/7}\approx7\times0.00105\approx0.00737$,
      already the right order of magnitude versus the true $0.000912$ from a
      single draw, whereas a naive Exponential($1$) sampler needs on the
      order of $1/0.000912\approx1097$ draws on average just to see one
      success at all.
    interview: >
      "How would you estimate a very rare event's probability by
      simulation" is importance sampling by name; a fast follow-up, "what
      could go wrong with your choice of $g$," checks for the
      heavy-tailed-proposal condition specifically.
    pitfalls: >
      Choosing a proposal with lighter tails than the true $f$ leaves the
      weight ratio unbounded, and the estimator can carry infinite variance
      while a short run shows no sign of trouble. Forgetting the weight
      $w=f/g$ entirely and just averaging $h(X)$ under $g$ estimates
      $\mathbb{E}_g[h(X)]$, the wrong quantity, not the original target
      under $f$.
    recap: >
      Sample from a law $g$ that visits the important region and reweight
      by $w=f/g$ to stay unbiased for the original target — the standard
      cure for rare-event probabilities naive Monte Carlo can't see in a
      reasonable budget.
    steps:
      - teach: >
          Estimating a probability so small that naive simulation would need hundreds
          of millions of draws is the standard setup for importance sampling, and the
          interview wants the likelihood-ratio weight written correctly, not just
          "sample more from the tail".
      - teach: >
          Multiply and divide the integrand by a second density $g$ you choose freely:
          $\mathbb{E}_f[h(X)]=\mathbb{E}_g[h(X)w(X)]$ with weight $w=f/g$. The one
          hard requirement is $g(x)>0$ wherever $h(x)f(x)\ne0$, or that region of
          probability mass is silently dropped.
      - ask: >
          $X\sim\mathrm{Exponential}(\text{rate }1)$, and you sample instead from
          $g=\mathrm{Exponential}(\text{rate }1/5)$ with weight
          $w(x)=f(x)/g(x)=5e^{-4x/5}$. What is $w(6)$, to four decimal places?
        expects: "0.0411"
        tolerance: 0.0005
        hint: >
          Substitute $x=6$ into $w(x)=5e^{-4x/5}$.
        feedback: >
          $w(6)=5e^{-24/5}=5e^{-4.8}\approx5\times0.00823\approx0.0411$.
      - teach: >
          The point is to put draws where $h(X)$ actually matters — the standard
          rare-event regime: if a true probability is order $10^{-7}$, a naive sampler
          needs on the order of $10^7$ to $10^8$ draws just to see a handful of
          occurrences, while sampling from a law concentrated near the event and
          reweighting needs only thousands.
      - ask: >
          For $X\sim\mathrm{Exponential}(\text{rate }1)$, what is the true value of
          $\Pr(X>5)=e^{-5}$, to four decimal places?
        expects: "0.0067"
        tolerance: 0.0005
        hint: >
          Evaluate $e^{-5}$ directly.
        feedback: >
          $e^{-5}\approx0.0067$ — a naive sampler needs roughly $1/0.0067\approx149$
          draws on average just to see one success, which only worsens as the
          threshold moves further into the tail.
      - teach: >
          The danger runs the opposite direction from a thin proposal: if $f/g$ is
          unbounded anywhere, the weighted estimator can have infinite variance while
          its simulated output looks perfectly calm, so give $g$ tails at least as
          heavy as $f$'s, never thinner.
      - ask: >
          You choose a proposal $g$ with lighter tails than $f$'s, to concentrate more
          draws near the mode. What's the risk?
        choices:
          - text: >
              None — lighter tails just waste a few draws near the mode
            feedback: >
              The danger isn't wasted draws near the mode — it's what happens far in the
              tail, where the weight can blow up.
          - text: >
              The weight $f/g$ can become unbounded, and the estimator can have infinite
              variance while a short run looks perfectly stable
            correct: true
            feedback: >
              Wherever $g$'s tail is thinner than $f$'s, $f/g\to\infty$, and rare enormous
              weights can corrupt the average with no visible warning sign in a short run.
          - text: >
              It's fine as long as $g$ still integrates to $1$
            feedback: >
              Being a valid density is necessary but says nothing about tail thickness —
              the risk is specifically about the tails.
        feedback: >
          Give $g$ tails at least as heavy as $f$'s — a thinner-tailed proposal can
          produce an estimator with infinite variance that gives no visible warning.
      - teach: >
          This is the standard cure for rare-event estimation: sample from a law that
          actually visits the important region, and undo the distortion with the
          likelihood-ratio weight.

  - node: quant-statistics.simulation.seeding
    hook: >
      "How do you make sure your backtest is reproducible" and "how do you
      fairly compare two trading strategies in simulation" are both answered
      by seed discipline, and the second one is a genuine free efficiency
      gain, not just hygiene.
    explanation: >
      Every result upstream in this unit is only ever a deterministic
      function of some seed, so failing to record it — letting the generator
      default to a clock-based start — throws away the one thing that made
      the whole exercise reproducible in the first place. The seed is part
      of the result, not an implementation detail to omit.

      Running components in parallel raises a second, easy-to-miss hazard:
      if two workers aren't given provably disjoint streams, via a
      counter-based generator's jump-ahead or explicit separate seeds, their
      supposedly independent draws can silently overlap, manufacturing
      correlation between components assumed independent and corrupting
      every downstream variance calculation that relied on that
      independence.

      Deliberately reusing the identical seed across two runs, by contrast,
      is a genuine technique: running two competing strategies on exactly
      the same simulated market path cancels the simulation noise common to
      both, so the estimated difference between them converges far faster
      than either strategy's own level would on its own — the same
      variance-reduction logic as a control variate, applied by construction
      rather than by regression. The trap runs the other way: tuning a
      parameter against results from a single fixed seed is overfitting to
      that one random realization, indistinguishable from a genuine
      improvement until checked against fresh seeds.
    interview: >
      "How do you make a simulation result reproducible" and "how would you
      fairly compare two strategies in a Monte Carlo backtest" are both
      seeding questions — the first wants explicit seed logging named
      directly, the second wants common random numbers named as the
      mechanism, not just "use more paths."
    pitfalls: >
      Tuning any parameter, or comparing two strategies, using only one
      seed's worth of draws and treating the result as final skips the
      confirmation on fresh seeds that catches overfitting to the
      generator. Assuming parallel workers are automatically independent
      just because they're separate processes ignores that, without an
      explicit disjoint-stream scheme, they can replay overlapping segments
      of the same underlying sequence.
    recap: >
      Log the seed, keep parallel streams provably disjoint, and reuse a
      seed on purpose — common random numbers — to compare two simulated
      variants far more precisely than either alone, but never tune against
      a single seed.
    steps:
      - teach: >
          "How do you make sure your backtest is reproducible" and "how do you fairly
          compare two trading strategies in simulation" are both answered by seed
          discipline, and the second one is a genuine free efficiency gain, not just
          hygiene.
      - teach: >
          Every result in this unit is only ever a deterministic function of some
          seed, so letting the generator default to a clock-based start throws away
          the one thing that made the exercise reproducible in the first place — the
          seed is part of the result, not an implementation detail to omit.
      - ask: >
          Your backtest, run with a clock-based default seed, produced a Sharpe ratio
          of $1.8$. Six months later a colleague reruns "the same" backtest and gets
          $1.3$. What's the most likely explanation?
        choices:
          - text: >
              The market data must have changed underneath the backtest
            feedback: >
              Possible in general, but the far more common culprit, given a clock-based
              seed, is that the run isn't even reproducing the same simulated paths.
          - text: >
              The generator was never seeded explicitly, so a different random stream
              drove each run
            correct: true
            feedback: >
              With a clock-based default, the seed — and so the entire simulated path —
              was never recorded, so "the same backtest" was actually run on two different
              streams.
          - text: >
              The random number generator itself must be broken
            feedback: >
              The generator is working exactly as built — it's the missing seed record
              that broke reproducibility, not the arithmetic.
        feedback: >
          A simulation result you cannot reproduce is not a result — set the seed
          explicitly and record it with the output.
      - teach: >
          Give each independent component its own stream — a counter-based generator's
          jump-ahead, or explicit separate seeds — so that adding a parallel worker
          cannot silently overlap two streams and manufacture correlation between
          components assumed independent.
      - ask: >
          You launch $8$ parallel Monte Carlo workers, each seeded from the wall-clock
          time in milliseconds when it starts. What's the risk?
        choices:
          - text: >
              None — $8$ different clock reads guarantee $8$ different, independent
              streams
            feedback: >
              Workers launched close together can read nearly identical millisecond
              timestamps, and even distinct seeds don't guarantee the underlying streams
              don't overlap without an explicit disjoint-stream scheme.
          - text: >
              Workers started close together can collide or overlap in the underlying
              stream, manufacturing correlation between components assumed independent
            correct: true
            feedback: >
              Without a counter-based jump-ahead or explicitly disjoint seeds, parallel
              workers can replay overlapping segments of the same sequence, corrupting
              every downstream calculation that relied on independence.
          - text: >
              It only matters once you have more than $100$ workers
            feedback: >
              The collision risk depends on the seeding scheme, not on the worker count
              crossing some threshold.
        feedback: >
          Parallel workers need a provably disjoint-stream scheme — a clock-based seed
          per worker doesn't guarantee that on its own.
      - teach: >
          Deliberately reusing the identical seed across two runs is a genuine
          technique, not a mistake: running two competing strategies on exactly the
          same simulated path — common random numbers — cancels the simulation noise
          common to both, so their difference converges far faster than either
          strategy's own level would on its own.
      - ask: >
          You tune a trading strategy's parameter against $2000$ simulated paths, all
          generated from a single fixed seed, and it looks great. Is that enough to
          trust the result?
        choices:
          - text: >
              Yes — $2000$ paths is a large enough sample
            feedback: >
              The path *count* isn't the issue here — every one of those $2000$ paths came
              from the same single random realization of the seed.
          - text: >
              No — tuning against one seed's realization is overfitting to that particular
              random draw; confirm the improvement holds on fresh seeds
            correct: true
            feedback: >
              A parameter tuned to look good on a single seed is indistinguishable from a
              genuine improvement until checked against seeds it wasn't tuned on.
          - text: >
              Yes, since the seed only affects reproducibility, not correctness
            feedback: >
