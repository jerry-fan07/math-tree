unit: quant-statistics.simulation
opening: >
  Simulation turns an intractable expectation or integral into an arithmetic
  average you can actually compute, and this unit builds that idea from the
  ground up: the uniform stream every sampler is built from, Monte Carlo
  estimation itself, and the $\sigma/\sqrt{n}$ error rate that governs every
  number it produces. From there it branches into manufacturing more
  complicated random variables — inverse transform, discrete tables,
  rejection sampling, Box–Muller for normals, Cholesky for correlated ones —
  and into the bootstrap, which turns the same machine on your own data to
  estimate a statistic's sampling error with no formula at all. It closes
  with the discipline of buying accuracy with structure instead of more
  samples: antithetic variates, control variates, importance sampling, and
  the seeding hygiene that keeps a simulation honest and reproducible.
lessons:
  - node: quant-statistics.simulation.uniform-prng
    hook: >
      Interviewers who ask how a computer generates randomness are checking
      whether you know the honest answer is that it doesn't — every sampler
      downstream, including the fancy ones, is a reshaping of one
      deterministic stream.
    explanation: >
      You already know the target law this stream is supposed to imitate:
      $\mathrm{Uniform}(0,1)$, equal density everywhere on the interval. A
      computer can't draw from it directly, so it runs a state machine
      instead — an internal state advances by a fixed deterministic rule and
      each state is mapped to an output built to pass every statistical test
      you'd think to run against genuine independent uniforms. Fix the seed
      and the entire infinite output sequence is fixed with it: two programs
      given the same seed produce bit-for-bit identical "random" numbers.

      "Random" is therefore a property of the output's statistics, not of the
      generating mechanism, which is pure arithmetic. Since the rule maps a
      finite state space to itself, the sequence must eventually revisit a
      state and repeat exactly — periodicity isn't a bug, it's a structural
      certainty, and the only real lever is choosing a rule whose period
      dwarfs anything you'll ever draw. The classical weak generator's flaw
      is exactly structural: plot consecutive output pairs and they fall on a
      small number of parallel lines rather than filling the square, a defect
      invisible if you only ever look at one draw at a time.

      The one fact worth carrying into everything else in this unit: inverse
      transform, rejection sampling, Box–Muller, bootstrap resampling — every
      one of them is a deterministic function applied to this same stream, so
      any statistical weakness in the stream itself propagates into every
      sampler built on top of it.
    worked: >
      Take the tiny generator $x_{k+1} = (5x_k + 3) \bmod 16$ seeded at
      $x_0 = 1$. Iterating gives $x_1 = 8$, $x_2 = 11$, $x_3 = 10$, with
      outputs $U_k = x_k/16$: $U_1 = 0.5$, $U_2 = 0.6875$, $U_3 = 0.625$ — a
      completely determined sequence once the seed is fixed. Continuing the
      recursion returns to $x_{16} = 1 = x_0$ exactly sixteen steps later, so
      this multiplier and increment achieve the best possible period for
      modulus $16$: the full $16$ states, before repeating.
    interview: >
      "How would you generate random numbers in code, and what does
      'random' even mean there" tests whether you answer with determinism
      plus statistical indistinguishability rather than philosophizing; a
      fast follow-up, "why not just use a linear congruential generator," is
      answered by naming the lattice structure visible in consecutive tuples.
    pitfalls: >
      Judging a generator's quality from a histogram of single draws misses
      the lattice defect entirely — it only shows up once you plot
      consecutive pairs or triples. Treating "pseudorandom" as
      "unpredictable" is wrong: given the seed, or enough consecutive outputs
      to infer the state, the entire future stream is computable exactly,
      which is exactly why PRNGs are unsafe for cryptography.
    recap: >
      A PRNG is a deterministic, eventually periodic map from a seed to a
      stream that merely passes the statistical tests you care about, and
      every other sampling method is a transformation of that one stream.
    dialogue:
      - part: A random number made of arithmetic
        teach: >
          A colleague's script gets its "random" numbers from the rule
          $x_{k+1} = (3x_k + 2) \bmod 10$, starting from $x_0 = 1$, and hands
          out $U_k = x_k/10$ as uniforms on $(0,1)$.
      - ask: >
          What is $U_1$?
        expects: "0.5"
        hint: >
          Apply the rule once to $x_0 = 1$, then divide by $10$.
        feedback: >
          $3 \cdot 1 + 2 = 5$ and $5 \bmod 10 = 5$, so $x_1 = 5$ and
          $U_1 = 5/10 = 0.5$.
      - ask: >
          You rerun the script tomorrow, again starting from $x_0 = 1$. What
          is $U_1$ on the second run?
        choices:
          - text: >
              Something new: a random number should differ run to run.
            feedback: >
              Nothing in $(3x_k + 2) \bmod 10$ consults the world. The same
              input goes through the same arithmetic, so the same $5$ comes
              out — and so does every later value.
          - text: >
              $0.5$ again, and every later value repeats too.
            correct: true
            feedback: >
              The starting value fixes the entire stream. Two runs from the
              same start agree digit for digit, forever.
          - text: >
              $0.5$ again, but later values may drift apart.
            feedback: >
              Each value is computed from the previous one alone, so once the
              first agrees, the second must, and so on down the line. There is
              nowhere for a difference to enter.
        feedback: >
          The stream is a pure function of its starting value. That sounds
          like a defect; for a simulation it is a gift, since a result can be
          rerun and checked exactly.
      - ask: >
          Keep iterating from $x_0 = 1$. After how many steps does the state
          first come back to $1$?
        expects: "4"
        hint: >
          Write out $x_1, x_2, \dots$ until a $1$ reappears.
        feedback: >
          $x_1 = 5$, $x_2 = 17 \bmod 10 = 7$, $x_3 = 23 \bmod 10 = 3$,
          $x_4 = 11 \bmod 10 = 1$. From here the stream is $0.5, 0.7, 0.3, 0.1$
          over and over.
      - ask: >
          The script averages $1000$ of its draws to estimate
          $\mathbb{E}[U]$, which is $0.5$ for a true uniform. What does it
          report?
        expects: "0.4"
        hint: >
          $1000$ draws is a whole number of cycles.
        feedback: >
          $1000$ draws are exactly $250$ passes through $0.5, 0.7, 0.3, 0.1$,
          so the average is $(0.5 + 0.7 + 0.3 + 0.1)/4 = 1.6/4 = 0.4$. Drawing
          a million would change nothing: the error is built into the cycle,
          not a matter of sample size.

      - part: What "random" was supposed to mean
        reflect: >
          This stream is deterministic, and so is every stream a computer
          makes. If determinism is not what disqualified it, what did — and
          what should "random" mean for a stream like this?
        hint: >
          Think about which questions about the output it answered wrongly.
        answer: >
          What failed was its statistics: four values cycling, so averages,
          frequencies and pairs all come out wrong. "Random" for a simulation
          can only mean that the output *behaves* like independent uniforms on
          every test you care about — right frequencies, no visible pattern
          between successive draws, no repeat within any run you will make.
          The mechanism is allowed to be arithmetic; the output is judged.
      - teach: >
          That is the whole definition. A pseudorandom generator keeps an
          internal state that advances by a fixed rule, $s_{k+1} = T(s_k)$,
          and turns each state into an output $U_k = g(s_k)$. The seed fixes
          the entire stream, so it is exactly reproducible, and "random" means
          only that $U_1, U_2, \dots$ pass the statistical tests you care
          about as independent uniforms. Your colleague's rule is a linear
          congruential generator, $x_{k+1} = (a x_k + c) \bmod m$ with
          $U_k = x_k/m$ — the textbook example, and a weak one.
      - ask: >
          A generator's state is a $64$-bit integer, so it has $2^{64}$
          possible states. Which statement is guaranteed?
        choices:
          - text: >
              With that many states the stream never repeats.
            feedback: >
              The rule maps a finite set into itself. Within $2^{64} + 1$
              steps two states must coincide, and from then on the stream
              retraces itself exactly. Large is not infinite.
          - text: >
              The stream eventually cycles, with a period of at most $2^{64}$.
            correct: true
            feedback: >
              Pigeonhole: some state recurs within $2^{64} + 1$ steps, and
              since each state determines the next, everything after it
              repeats. The design goal is a period no run will ever approach.
          - text: >
              The period is exactly $2^{64}$.
            feedback: >
              That is the best case, not a guarantee. Your colleague's rule
              had $10$ states and a period of $4$; a careless rule wastes most
              of its state space.
        feedback: >
          Every pseudorandom stream is eventually periodic. Choosing a
          generator is partly choosing a period that dwarfs anything you will
          draw.

      - part: Tests one draw at a time cannot see
        teach: >
          A better rule: $x_{k+1} = (9x_k + 1) \bmod 16$. Started at $0$ it
          runs $0, 1, 10, 11, 4, 5, 14, 15, 8, 9, 2, 3, 12, 13, 6, 7$ and only
          then returns to $0$.
      - ask: >
          Over one full period, how many times does each of the $16$ possible
          values appear?
        expects: "1"
        feedback: >
          The list above contains each of $0, 1, \dots, 15$ exactly once, so a
          histogram of single draws is perfectly flat — flatter, in fact, than
          $16$ genuinely random draws almost ever are.
      - ask: >
          Now look at consecutive pairs $(x_k, x_{k+1})$. Independent draws
          could produce any of the $16 \times 16 = 256$ possible pairs. How
          many different pairs does this generator ever produce?
        expects: "16"
        hint: >
          Once you know $x_k$, how many choices are there for $x_{k+1}$?
        feedback: >
          $x_{k+1}$ is a function of $x_k$, so each of the $16$ states has
          exactly one successor: $16$ pairs out of $256$. Plotted on the unit
          square, consecutive pairs occupy a sixteenth of the cells, lined up
          along a few parallel lines — the lattice structure that is the
          classic defect of linear congruential generators.
      - ask: >
          Which check would have caught the problem with this second
          generator?
        choices:
          - text: >
              A histogram of single draws.
            feedback: >
              It came out perfectly flat. Single draws see only the marginal
              law, and the defect lives in how one draw relates to the next.
          - text: >
              A plot of each draw against the next one.
            correct: true
            feedback: >
              The pairs fall on a handful of lines instead of filling the
              square. Real generators have the same flaw at finer scale, which
              is why tests look at pairs, triples and higher tuples.
          - text: >
              Measuring the period.
            feedback: >
              The period is $16$, the most this state space allows. A full
              period guarantees each value once per cycle; it says nothing
              about the pattern between successive values.
        feedback: >
          "Passes the tests you care about" has teeth only if the tests look
          at joint behaviour. That is why practice uses Mersenne Twister or
          the PCG and xoshiro families, not a textbook linear congruential
          generator.
      - ask: >
          A generator passes every statistical test you throw at it, on single
          draws and on tuples. A colleague wants to use it to generate
          passwords. Is it fit for that?
        choices:
          - text: >
              Yes: output that passes every test is as good as truly random.
            feedback: >
              It is as good for averaging, which is what the tests measure.
              Passwords need something else: that nobody can predict them.
          - text: >
              No: enough consecutive outputs reveal the state, and then every
              future output is computable.
            correct: true
            feedback: >
              The stream is a deterministic function of its state. An attacker
              who infers the state from observed outputs can generate every
              password that comes next.
          - text: >
              Only if it is reseeded from the clock each time.
            feedback: >
              A clock reading has only a few thousand plausible values around
              any given moment; an attacker simply tries them all.
        feedback: >
          Statistical randomness and unpredictability are different
          properties. A simulation needs only the first, and buys
          reproducibility with it.
      - teach: >
          Every sampler that follows in this unit — inverse transform,
          rejection, Box–Muller, the bootstrap — is a deterministic function
          applied to this one stream. A flaw in the stream passes straight
          through to all of them.

  - node: quant-statistics.simulation.monte-carlo
    hook: >
      "Estimate an expectation you can't integrate by just sampling it"
      sounds like a hack until you can say precisely why it's unbiased and
      what licenses the average to converge — that justification is what
      separates a real answer from a guess.
    explanation: >
      Take "draw $X_i$ from the law of $X$" as available for now — the
      mechanics of building that draw from the uniform stream are the next
      several nodes. The estimator $\hat{\theta}_n = \frac{1}{n}\sum h(X_i)$
      replaces an expectation you cannot evaluate in closed form with an
      arithmetic average you can always compute, for any $h$ at all — ugly,
      piecewise, high-dimensional, it doesn't matter.

      Unbiasedness is one line of linearity, worth reproducing cold:
      $\mathbb{E}[\hat{\theta}_n] = \frac{1}{n}\sum \mathbb{E}[h(X_i)] =
      \frac{1}{n}(n\theta) = \theta$, exactly, for every single $n$ — this
      needs no large-$n$ argument at all, only that each draw individually
      has the right expectation. What large $n$ buys separately is
      consistency: the individual fluctuations start to cancel, so the
      average settles near $\theta$ with high probability, a rate quantified
      next.

      The indicator trick folds probabilities into the same machine for
      free: since $\Pr(A) = \mathbb{E}[\mathbf{1}\{A\}]$, estimating a
      probability is nothing but running Monte Carlo with
      $h(X) = \mathbf{1}\{X \in A\}$ and reading off the observed frequency —
      no separate theory needed. Reach for simulation specifically when a
      closed-form sum or integral is out of reach: state spaces too large to
      enumerate, dimension too high for quadrature, or path-dependent
      payoffs with no formula at all.
    worked: >
      Estimate $p = \Pr(\text{sum of two fair dice} > 8)$ by simulation.
      Roll $10$ simulated pairs and record how many exceed $8$; suppose $3$
      do. Then $\hat{p} = 3/10 = 0.3$, using the indicator trick with
      $h = \mathbf{1}\{\text{sum}>8\}$. The true value is
      $10/36 \approx 0.278$ (the sums $9,10,11,12$ come from $4+3+2+1=10$
      outcomes), so this tiny run already lands in the right neighborhood,
      though nowhere near precise — sharpening that is the next node's
      subject.
    interview: >
      The interviewer often disguises this as "how would you estimate this
      probability or expectation if you can't compute it by hand" — name the
      estimator, state unbiasedness in one line, and mention the indicator
      trick unprompted whenever the target is a probability.
    pitfalls: >
      Quoting unbiasedness as something that "kicks in for large $n$"
      confuses it with consistency — it holds exactly at every $n$.
      Simulating $h(X)$ under a convenient stand-in law instead of $X$'s
      actual law silently estimates a different $\theta$; correcting for a
      deliberate mismatch is what importance sampling exists for later.
    recap: >
      Monte Carlo is an average of simulated $h(X_i)$'s standing in for its
      own expectation — unbiased at every $n$ by linearity, and turned into a
      probability estimate for free via the indicator trick.
    dialogue:
      - part: A price nobody can enumerate
        teach: >
          An interviewer offers a game. Ten fair dice are rolled and you are
          paid the largest number of dice showing the same face: the roll
          $3, 3, 5, 1, 3, 6, 2, 5, 3, 4$ pays $4$, for the four threes. What
          should you pay to play?
      - ask: >
          To price it exactly you would list every equally likely outcome and
          its payoff. How many outcomes is that?
        choices:
          - text: >
              $60$: ten dice times six faces.
            feedback: >
              That counts (die, face) labels, not rolls. Each die has $6$
              faces independently of the others, so the counts multiply.
          - text: >
              $\binom{15}{5} = 3003$: the possible collections of faces,
              ignoring order.
            feedback: >
              Those are the distinct collections, but they are not equally
              likely: ten sixes arises one way, while one particular mix of
              faces arises hundreds of thousands of ways. Averaging over them unweighted
              gives the wrong price.
          - text: >
              $6^{10}$, about $6 \times 10^{7}$.
            correct: true
            feedback: >
              Ordered rolls are the equally likely outcomes, and there are
              $6^{10} = 60466176$ of them. A computer could grind through
              that; with twenty dice, or a payoff depending on a price path,
              no computer could.
        feedback: >
          Exact enumeration grows exponentially in the number of dice. The
          way out is not to look at every outcome.
      - ask: >
          Instead you play the game five times in simulation. The payoffs are
          $3, 2, 4, 3, 3$. What is your estimate of the fair price?
        expects: "3"
        feedback: >
          $(3 + 2 + 4 + 3 + 3)/5 = 15/5 = 3$. You looked at $5$ outcomes out of
          sixty million and still produced a number.

      - part: Why an average of five is honest
        reflect: >
          Call the true fair price $\theta$. Before any data arrive, what is
          the expected value of your five-game average, and what fact are you
          using to say so?
        hint: >
          What is the expected payoff of each single simulated game?
        answer: >
          Exactly $\theta$. Each simulated game is a fresh draw of the same
          game, so each payoff has mean $\theta$, and by linearity of
          expectation the average of five such payoffs has mean
          $(5\theta)/5 = \theta$. Nothing about five being small enters. The
          average can land far from $\theta$ on any given run; it is not
          tilted to one side.
      - teach: >
          That is Monte Carlo estimation. To evaluate $\theta =
          \mathbb{E}[h(X)]$ when no formula is in reach, draw $X_1, \dots,
          X_n$ independently from the law of $X$ and report
          $\hat{\theta}_n = \frac{1}{n}\sum_{i=1}^{n} h(X_i)$. Linearity makes
          it unbiased, $\mathbb{E}[\hat{\theta}_n] = \theta$, at every $n$. The
          law of large numbers adds the second property: as $n$ grows, the
          average settles at $\theta$. Here $X$ is the roll of ten dice and
          $h$ reads off the largest face count.
      - ask: >
          A colleague says: "Five games is nothing. Your estimate is biased
          until $n$ is in the thousands." What is the accurate reply?
        choices:
          - text: >
              He is right: unbiasedness is a large-sample property.
            feedback: >
              You derived it at $n = 5$ with one line of linearity. Settling
              down near $\theta$ is the large-sample property — consistency —
              and he has merged the two.
          - text: >
              It is unbiased at $n = 5$; what five games lack is precision,
              and only more games buy that.
            correct: true
            feedback: >
              Centred and noisy are different complaints. The second one is
              real, and the next question is how fast the noise shrinks.
          - text: >
              It is unbiased only because the five games were independent.
            feedback: >
              Linearity of expectation needs no independence: five copies of
              the same game, however correlated, average to mean $\theta$.
              Independence is what makes the noise shrink, not what centres
              the estimate.
        feedback: >
          Unbiased means right on average over repeated runs, at every $n$.
          Consistent means close with high probability once $n$ is large.

      - part: Probabilities are averages too
        ask: >
          From the same five games, $3, 2, 4, 3, 3$, estimate the probability
          that the game pays $4$ or more.
        expects: "0.2"
        hint: >
          Score each game $1$ if it paid at least $4$ and $0$ otherwise.
        feedback: >
          One game of five qualifies, so the estimate is $1/5 = 0.2$. Scoring
          each game $1$ or $0$ and averaging is Monte Carlo with
          $h = \mathbf{1}\{\text{payoff} \ge 4\}$, because
          $\Pr(A) = \mathbb{E}[\mathbf{1}\{A\}]$. The estimate of a probability
          is just the observed frequency.
      - ask: >
          A longer run of $2000$ simulated games has $811$ paying $4$ or more.
          What is the estimate now?
        expects: "0.4055"
        tolerance: 0.0005
        feedback: >
          $811/2000 = 0.4055$. The exact answer, from a full enumeration, is
          about $0.403$. The five-game $0.2$ was not biased, only unlucky;
          the long run sits close.
      - ask: >
          Which of these is the *least* natural job for Monte Carlo?
        choices:
          - text: >
              The expected payoff of an option on the average of $250$ daily
              prices.
            feedback: >
              Path-dependent, $250$ dimensions, no closed form: the textbook
              case for simulation.
          - text: >
              The probability that a portfolio of $40$ correlated loans loses
              more than $10\%$.
            feedback: >
              A huge joint state space and a messy event. Count the simulated
              scenarios where the loss exceeds $10\%$ — exactly the indicator
              trick.
          - text: >
              The expected value of one fair die.
            correct: true
            feedback: >
              $3.5$, by a six-term sum. Simulating a quantity with a formula
              adds noise and teaches nothing; Monte Carlo is for when the sum
              or integral is out of reach.
        feedback: >
          Reach for simulation when the state space is large, the dimension is
          high, or the payoff depends on a whole path.

      - part: Averaging the wrong game
        ask: >
          To save random numbers, a colleague simulates the dice game by
          rolling five dice and counting each of them twice. Every one of his
          ten "dice" is still a fair die on its own. What does his average
          converge to?
        choices:
          - text: >
              The fair price: each die is fair, so nothing has changed.
            feedback: >
              Each die is fair on its own, but the payoff depends on how the
              ten dice relate. In his game every face comes in pairs, so the
              payoff is always even and never below $2$ — a different game.
          - text: >
              The fair price, just with more noise.
            feedback: >
              Noise would wash out as $n$ grows. This does not: his average
              converges, precisely, to the expectation of the game he
              actually simulated.
          - text: >
              The fair price of a different game, so the estimate is biased
              however long he runs.
            correct: true
            feedback: >
              Monte Carlo is unbiased for $\mathbb{E}[h(X)]$ under the law you
              sample. Sample the wrong joint law and you estimate the wrong
              number, perfectly.
        feedback: >
          The guarantee is only as good as the draws: the $X_i$ must come from
          the law of $X$ itself, joint structure included.
      - teach: >
          Said aloud in an interview: "I would simulate the game $n$ times and
          average the payoffs. That is unbiased at every $n$ by linearity, and
          the law of large numbers makes it converge." Then the interviewer
          asks how large $n$ must be — and an answer without an error bar is
          only half an answer.

  - node: quant-statistics.simulation.mc-error
    hook: >
      Every Monte Carlo answer without a standard error is only half an
      answer, and the fact that cost scales like the square of the precision
      you want is the single most quoted number in a simulation interview.
    explanation: >
      This follows from applying variance-of-a-sum directly to the
      estimator: $\hat{\theta}_n$ is $\frac{1}{n}$ times a sum of $n$ iid
      terms $h(X_i)$, each with variance $\sigma^{2}$. Independence kills the
      cross-covariance terms, so the sum has variance $n\sigma^{2}$, and
      dividing by $n^{2}$ for the average gives
      $\operatorname{Var}(\hat{\theta}_n) = \sigma^{2}/n$ exactly — no
      large-$n$ needed for this identity itself.

      Large $n$ enters only through the central limit theorem: standardizing
      turns the fluctuation of $\hat{\theta}_n$ around $\theta$ into an
      approximately normal quantity with standard deviation
      $\sigma/\sqrt{n}$, which is where the $1.96$ multiplier for a $95\%$
      band comes from — the identical machinery as any sample-mean
      confidence interval, relabeled with $h(X)$ as the observation.

      The number worth having automatic: to shrink the half-width by a
      factor of $k$, $n$ must grow by $k^{2}$. Cutting $\sigma$ via a smarter
      estimator, this unit's later subject, is usually far cheaper than
      simply running more paths — the same $\sqrt{n}$ logic that governs
      every other estimate in the tree, applied here to simulation cost.
    worked: >
      Suppose $\sigma^{2} = 0.25$, as for a coin-flip indicator. A standard
      error of $0.025$ needs $n = 0.25/0.025^{2} = 400$. Tightening to a
      standard error of $0.0025$ — ten times smaller — needs
      $n = 0.25/0.0025^{2} = 40{,}000$: exactly the square of that factor,
      not ten times as many draws.
    interview: >
      "How many simulated paths do you need for a given precision" is
      answered by inverting $\sigma/\sqrt{n}$ for $n$; a strong candidate
      reports $\hat{\sigma}$ alongside $\hat{\theta}$ unprompted, since a
      point estimate with no error bar isn't complete here.
    pitfalls: >
      Reporting only $\hat{\theta}_n$ with no $\hat{\sigma}$ or interval is
      an incomplete answer by this unit's standard. Doubling $n$ and
      expecting the error to halve is a common slip — it only shrinks by
      $\sqrt{2} \approx 1.41$; halving the error needs quadrupling $n$.
    recap: >
      The Monte Carlo standard error is $\sigma/\sqrt{n}$ exactly, so
      squeezing out one more correct digit multiplies the sample size by
      $100$.
    dialogue:
      - part: Four times the paths
        teach: >
          You price a payoff by averaging $100$ simulated paths. Rerun with
          fresh seeds many times and the estimates scatter around the true
          value with a standard deviation of $0.4$. The desk finds $0.4$ too
          loose, so you raise the run to $400$ paths.
      - ask: >
          What is the scatter of the $400$-path estimate?
        choices:
          - text: >
              $0.1$: four times the paths, a quarter of the error.
            feedback: >
              That would hold if the error fell like $1/n$. It does not: the
              extra paths partly cancel each other's noise rather than
              eliminating it, and the scatter falls more slowly than that.
          - text: >
              $0.2$: four times the paths, half the error.
            correct: true
            feedback: >
              The scatter falls like $1/\sqrt{n}$: four times the paths,
              $\sqrt{4} = 2$ times tighter.
          - text: >
              Still $0.4$: each path is just as noisy as before.
            feedback: >
              Each *path* is just as noisy, but the estimate is an average,
              and averages of independent noise are calmer than any one
              term.
        feedback: >
          Quadrupling $n$ halves the scatter. Hold on to that ratio; it is the
          whole cost structure of simulation.
      - ask: >
          Starting again from $100$ paths and a scatter of $0.4$: how many
          paths bring the scatter down to $0.05$?
        expects: "6400"
        hint: >
          $0.05$ is $8$ times tighter than $0.4$.
        feedback: >
          Eight times tighter needs $8^{2} = 64$ times the paths:
          $100 \times 64 = 6400$. Linear thinking would have said $800$, and
          would have left the scatter at $0.4/\sqrt{8} \approx 0.14$.

      - part: Where the square root comes from
        reflect: >
          Say why the scatter of an average of $n$ independent draws falls
          like $1/\sqrt{n}$ rather than $1/n$. Work with the variance, not the
          standard deviation.
        hint: >
          What is the variance of a sum of $n$ independent terms, and what
          does dividing by $n$ do to a variance?
        answer: >
          The sum of $n$ independent draws, each with variance $\sigma^{2}$,
          has variance $n\sigma^{2}$: independence kills every cross term.
          Dividing by $n$ divides the variance by $n^{2}$, leaving
          $\sigma^{2}/n$. The standard deviation is the square root,
          $\sigma/\sqrt{n}$. The sum's spread grows like $\sqrt{n}$ while the
          division is by $n$, and the difference is the square root.
      - teach: >
          That is the Monte Carlo error. With $\sigma^{2} =
          \operatorname{Var}(h(X)) < \infty$, the estimator has
          $\operatorname{Var}(\hat{\theta}_n) = \sigma^{2}/n$ exactly, so its
          standard error is $\sigma/\sqrt{n}$. You never know $\sigma$, but the
          sample standard deviation $\hat{\sigma}$ of the $h(X_i)$ costs
          nothing to compute, and the central limit theorem makes
          $\hat{\theta}_n \pm 1.96\,\hat{\sigma}/\sqrt{n}$ an asymptotic $95\%$
          interval. In your pricing run, $\sigma = 0.4\sqrt{100} = 4$ per path.
      - ask: >
          Which step of $\operatorname{Var}(\hat{\theta}_n) = \sigma^{2}/n$
          would fail if the draws were correlated?
        choices:
          - text: >
              $\mathbb{E}[\hat{\theta}_n] = \theta$.
            feedback: >
              That is the mean, not the variance, and it holds by linearity
              whatever the dependence. Correlated draws leave the estimator
              unbiased.
          - text: >
              The variance of the sum equals the sum of the variances.
            correct: true
            feedback: >
              Without independence the covariances stay in:
              $\operatorname{Var}(\sum h(X_i)) = n\sigma^{2} + \sum_{i \ne j}
              \operatorname{Cov}(h(X_i), h(X_j))$, and positive correlation
              makes the true error larger than $\sigma/\sqrt{n}$.
          - text: >
              Pulling the $1/n$ out as $1/n^{2}$.
            feedback: >
              $\operatorname{Var}(cY) = c^{2}\operatorname{Var}(Y)$ for any
              constant and any $Y$. That step never fails.
        feedback: >
          Independence is load-bearing for the error bar, not for the
          estimate. Remember that when draws get reused.

      - part: An error bar by hand
        ask: >
          A run of $n = 1600$ paths gives an average payoff of $12.30$ with
          sample standard deviation $\hat{\sigma} = 8$ across the paths. What
          standard error do you report?
        expects: "0.2"
        feedback: >
          $\hat{\sigma}/\sqrt{n} = 8/\sqrt{1600} = 8/40 = 0.2$.
      - ask: >
          What is the half-width of the $95\%$ interval around $12.30$?
        expects: "0.392"
        tolerance: 0.0005
        feedback: >
          $1.96 \times 0.2 = 0.392$, so the interval is about
          $12.30 \pm 0.39$, or $[11.91, 12.69]$.
      - ask: >
          The desk wants one more correct digit: a half-width ten times
          smaller. How many paths in total?
        expects: "160000"
        hint: >
          Ten times tighter means how many times the paths?
        feedback: >
          The half-width scales like $1/\sqrt{n}$, so ten times tighter needs
          $10^{2} = 100$ times the paths: $1600 \times 100 = 160000$. Each
          extra digit costs a factor of $100$.

      - part: When the error bar lies
        ask: >
          To save time a colleague generates $1000$ draws, uses each of them
          $10$ times, and reports $\hat{\sigma}/\sqrt{10000}$ as the standard
          error. By what factor is the reported error too small?
        expects: "3.1623"
        tolerance: 0.001
        hint: >
          How many independent draws are really in the average?
        feedback: >
          Repeating every draw $10$ times leaves the average unchanged — it is
          still the mean of $1000$ independent values — so the true standard
          error is $\sigma/\sqrt{1000}$. The reported one is
          $\sigma/\sqrt{10000}$, smaller by $\sqrt{10} \approx 3.1623$. The
          copies are perfectly correlated, which is exactly the step that
          breaks.
      - ask: >
          A payoff has a heavy tail: its mean is finite but its variance is
          infinite. What happens as you add paths?
        choices:
          - text: >
              The error is still $\sigma/\sqrt{n}$, just with a large
              $\sigma$.
            feedback: >
              There is no $\sigma$ to plug in. The hypothesis
              $\sigma^{2} < \infty$ is gone, and with it the rate.
          - text: >
              The average never converges.
            feedback: >
              A finite mean is enough for the law of large numbers, so the
              average does converge. It is the speed and the error bar that
              are lost.
          - text: >
              The average still converges, but more slowly than $1/\sqrt{n}$,
              and $\hat{\sigma}$ jumps every time a huge draw arrives.
            correct: true
            feedback: >
              The sample standard deviation never settles, so any interval
              built from it is fiction. Watch for $\hat{\sigma}$ that keeps
              growing with $n$: it is the signature of an infinite variance.
        feedback: >
          The error formula needs finite variance and independent draws.
          Drop either and the average may still be unbiased while the error
          bar beside it means nothing.
      - teach: >
          The sentence an interviewer wants: "The error is $\sigma/\sqrt{n}$,
          so ten times the accuracy costs a hundred times the paths." It is
          also why shrinking $\sigma$ beats raising $n$: halving $\sigma$ is
          worth four times the paths.

  - node: quant-statistics.simulation.dimension-independence
    hook: >
      "Why simulate instead of just integrating numerically" has a sharp
      numeric answer, and knowing the crossover dimension — not just "Monte
      Carlo is more flexible" — is what makes the answer land.
    explanation: >
      A deterministic grid's cost explodes with dimension because covering a
      $d$-dimensional cube at fixed resolution multiplies that resolution
      across every axis — $m$ nodes per axis becomes $m^{d}$ evaluations
      total, purely combinatorial, with no randomness involved anywhere.

      Monte Carlo's cost never sees the dimension explicitly: $\sigma^{2}$ is
      just the variance of $h(X)$ for whatever random vector $X$ is, and the
      $\sigma/\sqrt{n}$ formula from the previous node doesn't care whether
      $X$ lives in two dimensions or two hundred. Past the crossover
      dimension, adding axes keeps taxing the grid method exponentially while
      the simulation-based estimate pays nothing extra at all.

      The practical reading: any payoff depending on many time steps —
      path-dependent options, multi-period risk scenarios — has one axis of
      randomness per time step, so its effective dimension is enormous
      exactly where the curse of dimensionality bites hardest and Monte
      Carlo's dimension-blindness is most valuable.
    worked: >
      Take $d = 8$ with a modest $m = 20$ grid points per axis. Grid cost is
      $n = 20^{8} \approx 2.56 \times 10^{10}$ evaluations, for an error of
      order $m^{-2} = 1/400 = 0.0025$. Monte Carlo hitting that same error
      with $\sigma = 1$ needs $n = (1/0.0025)^{2} = 160{,}000$ draws — about
      $1.6\times 10^{5}$ versus $2.56\times 10^{10}$, roughly five orders of
      magnitude apart, purely from the dimension.
    interview: >
      "Why not just discretize the integral on a grid" is the standard
      prompt; name the $m^{d}$ cost and the crossover near $d=4$ explicitly,
      then point at path-dependent payoffs as the case where $d$ is silently
      enormous.
    pitfalls: >
      Assuming Monte Carlo is "better" outright is wrong — below about four
      dimensions a good deterministic quadrature rule genuinely wins, and
      simulation is the fallback for high dimension, not a universal
      upgrade. Forgetting that the number of time steps in a path-dependent
      payoff counts as dimension is a common miscount — a fifty-step path is
      a fifty-dimensional problem.
    recap: >
      Grid methods pay $m^{d}$, exponential in dimension; Monte Carlo pays
      $\sigma/\sqrt{n}$ regardless of dimension, which flips the ranking past
      about four or five dimensions.
    dialogue:
      - part: One budget, two integrators
        teach: >
          You must integrate a smooth function over a cube and can afford
          $10000$ function evaluations. Spend them on a grid with $m$ points
          per axis and a second-order rule, whose error is about $m^{-2}$; or
          on $10000$ random points, whose Monte Carlo error is $\sigma/\sqrt{n}$
          with, say, $\sigma = 1$.
      - ask: >
          In one dimension the grid has $m = 10000$ points. By what factor is
          its error smaller than Monte Carlo's?
        expects: "1000000"
        hint: >
          Compute $m^{-2}$ and $1/\sqrt{n}$ separately.
        feedback: >
          Grid: $10000^{-2} = 10^{-8}$. Monte Carlo: $1/\sqrt{10000} = 0.01$.
          The ratio is $0.01/10^{-8} = 10^{6}$. In one dimension simulation
          is absurd.
      - ask: >
          Same $10000$ evaluations, but the function now lives on a
          $4$-dimensional cube. How many grid points per axis can you afford?
        expects: "10"
        hint: >
          A grid with $m$ points per axis in $4$ dimensions has $m^{4}$ points.
        feedback: >
          $m^{4} = 10000$ gives $m = 10$. The budget is shared out across
          every axis.
      - ask: >
          What is the grid's error now?
        expects: "0.01"
        feedback: >
          $m^{-2} = 10^{-2} = 0.01$ — exactly Monte Carlo's $0.01$. The
          million-fold advantage is gone at four dimensions.
      - ask: >
          Push to $8$ dimensions with the same $10000$ evaluations. What
          happens to the Monte Carlo error?
        choices:
          - text: >
              It grows: the same points are spread over a far bigger space.
            feedback: >
              The volume of the unit cube is $1$ in every dimension, and more
              to the point the formula $\sigma/\sqrt{n}$ has no $d$ in it.
              With the same $\sigma$ the error is the same $0.01$.
          - text: >
              It stays at $0.01$.
            correct: true
            feedback: >
              Meanwhile the grid gets $10000^{1/8} \approx 3$ points per axis
              and an error near $0.1$. Monte Carlo is now ten times better and
              the gap widens with every axis.
          - text: >
              It halves, because $8$ dimensions give more independent
              coordinates to average.
            feedback: >
              The extra coordinates feed into one value $h(X_i)$ per draw. The
              average is still over $n = 10000$ scalars, and its error is
              still $\sigma/\sqrt{n}$.
        feedback: >
          The grid's error depends on the dimension; Monte Carlo's does not.

      - part: Where the dimension went
        reflect: >
          Why does the dimension never enter the Monte Carlo error, when it
          enters the grid's so brutally? Say what each method is spending its
          evaluations on.
        hint: >
          What kind of object is $h(X_i)$, whatever the dimension of $X_i$?
        answer: >
          A grid must resolve every axis, so the points per axis are the $d$-th
          root of the budget, and accuracy per axis collapses as $d$ grows.
          A Monte Carlo draw is one point of the whole cube turned into one
          number $h(X_i)$; the estimate is an average of $n$ such numbers, and
          its variance $\sigma^{2}/n$ sees only the spread of that number. The
          dimension can matter only by changing $\sigma$.
      - teach: >
          In general: a product grid with $m$ points per axis costs
          $n = m^{d}$, and a second-order rule's error $m^{-2}$ is
          $n^{-2/d}$. That beats Monte Carlo's $n^{-1/2}$ only while
          $2/d > 1/2$, that is for $d < 4$. Past four or five dimensions
          quadrature drowns in the curse of dimensionality while Monte Carlo's
          error stays $\sigma/\sqrt{n}$, depending on $\sigma$ and $n$ alone.

      - part: Counting dimensions honestly
        ask: >
          An option pays on the average of a stock's closing prices over
          $252$ trading days, each day's move driven by its own random shock.
          How many dimensions does the pricing integral have?
        expects: "252"
        feedback: >
          One random input per step, so $d = 252$. A grid with even $2$ points
          per axis would need $2^{252}$ evaluations. Path-dependent payoffs
          are exactly where the dimension is enormous, and quietly so.
      - ask: >
          A colleague concludes that Monte Carlo is simply the better
          integrator. Which job refutes him?
        choices:
          - text: >
              Pricing a basket option on $30$ correlated stocks.
            feedback: >
              Thirty dimensions: far past the crossover, and simulation's home
              ground. This supports him.
          - text: >
              A smooth integral over the unit square.
            correct: true
            feedback: >
              In $d = 2$ a second-order grid has error $n^{-1}$ against
              Monte Carlo's $n^{-1/2}$: with $10000$ evaluations, $10^{-4}$
              against $10^{-2}$. Below four dimensions quadrature wins.
          - text: >
              The $252$-day average-price option.
            feedback: >
              $252$ dimensions. No grid can touch it, which is why every desk
              simulates it.
        feedback: >
          Monte Carlo is the method for high dimension, not a universal
          upgrade.
      - ask: >
          The payoff is $h = 2U_1 \cdot 2U_2 \cdots 2U_d$ for independent
          uniforms, whose mean is $1$ in every dimension. Does "the dimension
          does not enter" make $d = 50$ as cheap as $d = 2$?
        choices:
          - text: >
              Yes: the error is $\sigma/\sqrt{n}$ whatever $d$ is.
            feedback: >
              The formula holds, but $\sigma$ is not a fixed constant here.
              $\mathbb{E}[h^{2}] = (4/3)^{d}$, so $\sigma^{2} = (4/3)^{d} - 1$,
              which is about $0.78$ at $d = 2$ and about $1.8 \times 10^{6}$
              at $d = 50$.
          - text: >
              No: the dimension never enters the formula, but it can enter
              through $\sigma$.
            correct: true
            feedback: >
              $\sigma^{2} = (4/3)^{d} - 1$ grows exponentially here. The
              rate $n^{-1/2}$ is dimension-free; the constant in front of it
              need not be.
          - text: >
              No: Monte Carlo needs $n$ to grow in proportion to $d$.
            feedback: >
              Nothing in $\sigma^{2}/n$ scales with $d$ directly. The cost
              here comes entirely through $\sigma$, and for a well-behaved
              payoff it may not come at all.
        feedback: >
          Monte Carlo is blind to dimension and sensitive only to $\sigma$,
          which is why the only lever worth pulling is $\sigma$ itself.
      - teach: >
          Said in an interview: "A grid costs $m^{d}$, so its error is
          $n^{-2/d}$; Monte Carlo is $n^{-1/2}$ whatever $d$ is. The crossover
          is around four dimensions, and a path with $252$ steps is a
          $252$-dimensional integral."

  - node: quant-statistics.simulation.estimate-pi
    hook: >
      This toy example opens every simulation course, and its real value in
      an interview is a two-minute proof that you can set up an estimator,
      its variance, and the sample size it needs, entirely from scratch.
    explanation: >
      The dartboard uses the indicator trick from Monte Carlo estimation
      directly: draw $X,Y$ uniform on the unit square and set
      $h = \mathbf{1}\{X^{2}+Y^{2}\le 1\}$. Then $\mathbb{E}[h]$ is exactly
      the area of the quarter disc inside the unit square, $\pi/4$, since
      throws are uniform over an area-$1$ region and probability equals area
      there.

      Because $h$ is an indicator, $h(X,Y)$ is itself Bernoulli($p$) with
      $p=\pi/4$, so its variance is the plain Bernoulli formula $p(1-p)$
      rather than anything specific to circles — estimating any probability
      by simulation always inherits Bernoulli variance, whatever the
      geometric dressing.

      Multiplying by $4$ to recover $\pi$ from $p$ rescales the standard
      deviation by $4$ too, by linearity — that's exactly where the factor of
      $4$ out front of the standard error comes from, chaining the ordinary
      $\sigma/\sqrt{n}$ rule through a constant rescaling, not a separate
      calculation.
    worked: >
      Simulate $n=1000$ darts and suppose $786$ land inside the quarter disc,
      so $\hat{p}=0.786$ and $\hat{\pi}=4\times0.786=3.144$. The standard
      error here is $4\sqrt{0.786\times0.214/1000}\approx4\times0.01297
      \approx0.0519$ — consistent with the $1.64/\sqrt{1000}\approx0.0519$
      formula — so this run's third digit is well within the noise the error
      bar already predicted.
    interview: >
      "Estimate $\pi$ by simulation" is a classic warm-up; the strong answer
      states the Bernoulli variance and the sample size needed for a target
      precision unprompted, rather than stopping at "throw darts and count."
    pitfalls: >
      Reporting $\hat{\pi}$ with no error bar drops exactly the information
      that makes the precision-versus-cost tradeoff meaningful. Forgetting
      the factor-of-$4$ rescaling when converting the standard error, not
      just the point estimate, from $p$ to $\pi$.
    recap: >
      $\hat{\pi}=4$ times the observed hit fraction is Monte Carlo with a
      circle indicator, inheriting Bernoulli variance $p(1-p)$ and paying the
      usual $\sigma/\sqrt{n}$ price, scaled by $4$.
    dialogue:
      - part: Darts at a unit square
        teach: >
          Your only tool is a stream of uniforms, and the interviewer wants
          $\pi$. Take two uniforms as a point $(X, Y)$ in the unit square and
          score it $1$ if $X^{2} + Y^{2} \le 1$, $0$ otherwise.
      - ask: >
          What is the probability that one point scores $1$?
        choices:
          - text: >
              $\pi$
            feedback: >
              $\pi$ is the area of the whole unit disc, which is not even a
              probability. Only the quarter of it with $x, y \ge 0$ lies in the
              square.
          - text: >
              $\pi/4$
            correct: true
            feedback: >
              The point is uniform on a region of area $1$, so the probability
              is the area of the quarter disc inside it, $\pi/4 \approx
              0.7854$.
          - text: >
              $\pi/2$
            feedback: >
              That would be half the disc. The square $[0,1]^{2}$ catches
              only the quarter in the first quadrant.
        feedback: >
          Probability is area here, so the hit rate $p = \pi/4$ carries $\pi$,
          and $\pi = 4p$.
      - ask: >
          You throw $400$ points and $316$ score. What is your estimate of
          $\pi$?
        expects: "3.16"
        feedback: >
          $\hat{p} = 316/400 = 0.79$ and $\hat{\pi} = 4 \times 0.79 = 3.16$.
          Right in the first decimal. Whether that is luck or skill needs an
          error bar.

      - part: How wrong is 3.16?
        reflect: >
          Before any circle-specific calculation: what kind of random
          variable is one point's score, and what does that tell you about
          its variance?
        hint: >
          It takes only two values.
        answer: >
          It is a Bernoulli variable, $1$ with probability $p$ and $0$
          otherwise, so its variance is $p(1-p)$. The geometry enters only
          through $p$; estimating any probability by simulation inherits this
          same Bernoulli variance, whatever the dressing.
      - ask: >
          With $p = \pi/4 \approx 0.7854$, what is $p(1-p)$, the variance of
          one score?
        expects: "0.1686"
        tolerance: 0.0005
        feedback: >
          $0.7854 \times 0.2146 \approx 0.1686$.
      - ask: >
          What is the standard error of $\hat{\pi}$ after $400$ points?
        expects: "0.0821"
        tolerance: 0.0005
        hint: >
          Find the standard error of $\hat{p}$ first, then remember what
          $\hat{\pi}$ is.
        feedback: >
          $\hat{p}$ has standard error $\sqrt{0.1686/400} \approx 0.0205$, and
          $\hat{\pi} = 4\hat{p}$ multiplies it by $4$: about $0.0821$.
          Equivalently, $4\sqrt{0.1686} \approx 1.64$, so the standard error
          is $1.64/\sqrt{n} = 1.64/20 = 0.082$.
      - ask: >
          Your $3.16$ sits $0.018$ above $\pi$. What is the verdict?
        choices:
          - text: >
              Something is wrong: a miss in the second decimal is large.
            feedback: >
              Large against what? Against a standard error of $0.082$ it is
              tiny. Judging an estimate without its error bar is exactly the
              mistake the error bar prevents.
          - text: >
              Entirely ordinary: about a quarter of one standard error.
            correct: true
            feedback: >
              $0.018/0.082 \approx 0.22$. A run this close is the norm;
              misses three or four times larger would still be unremarkable.
          - text: >
              Suspiciously good: $400$ points should not get this close.
            feedback: >
              Within one standard error happens about $68\%$ of the time, and
              this is well inside it. Nothing suspicious.
        feedback: >
          At $n = 400$ the second decimal of $\hat{\pi}$ is noise. Getting it
          right reliably is a question of $n$.

      - part: The price of each decimal
        ask: >
          How many points bring the standard error of $\hat{\pi}$ down to
          $0.01$?
        expects: "27000"
        tolerance: 300
        hint: >
          Solve $1.64/\sqrt{n} = 0.01$.
        feedback: >
          $\sqrt{n} = 1.64/0.01 = 164$, so $n \approx 164^{2} \approx 26900$,
          about $2.7 \times 10^{4}$. With the unrounded $1.6422$ it is about
          $26970$.
      - ask: >
          And a standard error of $0.001$, one more decimal?
        expects: "2700000"
        tolerance: 30000
        feedback: >
          Ten times tighter costs $100$ times the points:
          $(1.64/0.001)^{2} \approx 2.7 \times 10^{6}$. The square-root rate
          makes the dartboard a famously terrible way to compute $\pi$.
      - ask: >
          A colleague proposes a different estimator: draw a single uniform
          $U$ and average $4\sqrt{1 - U^{2}}$ over the draws. Its mean is also
          $\pi$. Is it better?
        choices:
          - text: >
              No: it is the same experiment written differently, with the same
              error.
            feedback: >
              It replaces the $0$-or-$1$ score at each $x$ by its exact
              average over $y$, the height of the quarter circle. Same mean,
              less randomness: its variance is $16 \times 2/3 - \pi^{2}
              \approx 0.80$, against $16 \times 0.1686 \approx 2.70$ for the
              darts.
          - text: >
              Yes: it removes the randomness in $Y$, cutting the standard
              error from about $1.64/\sqrt{n}$ to about $0.89/\sqrt{n}$.
            correct: true
            feedback: >
              Its variance is $16\,\mathbb{E}[1 - U^{2}] - \pi^{2} = 32/3 -
              \pi^{2} \approx 0.80$, so the same accuracy takes about $3.4$
              times fewer draws.
          - text: >
              No: it is biased, because $\sqrt{\cdot}$ is not linear.
            feedback: >
              Nothing nonlinear is applied to an average. $\int_{0}^{1}
              4\sqrt{1 - x^{2}}\,dx$ is four times the quarter-disc area,
              exactly $\pi$, so each draw has mean $\pi$.
        feedback: >
          Computing part of the randomness exactly instead of simulating it
          shrinks $\sigma$ — a lever you will meet again.
      - teach: >
          Said in an interview: "Throw $n$ points in the unit square;
          $\hat{\pi}$ is $4$ times the fraction inside the quarter circle.
          Each throw is Bernoulli with $p = \pi/4$, so the standard error is
          $4\sqrt{p(1-p)/n} \approx 1.64/\sqrt{n}$ — about $10^{5}$ throws for
          two decimals." Buffon's needle is the same estimate in older
          costume.

  - node: quant-statistics.simulation.inverse-transform
    hook: >
      "Simulate from this law — just look up the formula" is exactly this
      technique, and the interview wants the map derived on the spot, not
      recited from memory.
    explanation: >
      You already have the uniform stream; the missing piece is turning a
      $\mathrm{Uniform}(0,1)$ draw into a draw from any target law $F$. Since
      $F$ is nondecreasing, define its quantile function $q(u)$ as the
      smallest $x$ with $F(x)\ge u$, and set $X=q(U)$.

      Why this works, worth reproducing in one line: $q(U)\le x$ exactly when
      $U\le F(x)$, since $q$ and $F$ are order-inverses of each other by
      construction, and that second event has probability $F(x)$ because $U$
      is uniform — so $\Pr(X\le x)=F(x)$, which is the entire proof. Nothing
      about $F$ needs to be continuous or strictly increasing; the
      "smallest $x$" phrasing absorbs flat spots and jumps automatically,
      which is why the identical recipe covers discrete laws too.

      Mechanically: write $F$, solve $F(x)=u$ for $x$, and you have a
      one-line sampler. The normal is the standing counterexample — its CDF
      has no closed-form inverse, which is precisely the gap the next
      transform-based technique in this unit exists to route around.
    worked: >
      Take the density $f(x)=3x^{2}$ on $(0,1)$, with CDF $F(x)=x^{3}$.
      Solving $u=x^{3}$ gives $x=u^{1/3}$, so $X=U^{1/3}$. Drawing $U=0.512$
      gives $X=0.512^{1/3}=0.8$, since $0.8^{3}=0.512$ exactly — one cube
      root per draw, the whole sampler.
    interview: >
      "How would you sample from this named law given only a uniform
      generator" is answered by writing its CDF and inverting it live; a
      sharp follow-up asks why this fails for the normal, exactly the
      no-closed-form-inverse point.
    pitfalls: >
      Trying to invert $F$ for a law whose CDF has no closed form, instead
      of recognizing that as the trigger for a different technique.
      Forgetting that $1-U$ is uniform too, which is what lets the
      exponential sampler be written with either sign convention without
      redoing the derivation.
    recap: >
      $X=q(U)$ for the quantile function $q$ of any target CDF $F$ has law
      exactly $F$, because $q(U)\le x$ and $U\le F(x)$ are the same event —
      invert the CDF, feed uniforms, done.
    dialogue:
      - part: A uniform in, a waiting time out
        teach: >
          A desk models the wait $T$ until the next large order, in minutes,
          by the CDF $F(t) = 1 - 1/(1+t)^{2}$ for $t \ge 0$. All you have is
          a stream of uniforms on $(0,1)$, and you need draws of $T$.
      - ask: >
          Start with what the draws must look like. What fraction of them
          should come out at most $1$ minute?
        expects: "0.75"
        feedback: >
          $F(1) = 1 - 1/2^{2} = 0.75$. Whatever you build, three draws in four
          must land at or below $1$.
      - ask: >
          Suppose you turn each uniform $U$ into a wait by some increasing
          function, so bigger $U$ gives a longer wait. Which uniforms must be
          the ones that produce waits of at most $1$ minute?
        choices:
          - text: >
              Those with $U \le 0.25$.
            feedback: >
              Those are a quarter of the uniforms, and you need three quarters.
              $0.25$ is the chance of waiting *longer* than a minute.
          - text: >
              Those with $U \le 0.75$.
            correct: true
            feedback: >
              An increasing map sends the lowest uniforms to the shortest
              waits, and exactly $75\%$ of uniforms lie below $0.75$. So the
              map must send $U = 0.75$ to exactly $t = 1$.
          - text: >
              It depends on the function, so no particular uniforms.
            feedback: >
              Increasing pins it down. The uniforms producing waits of at
              most $1$ form an interval $(0, c]$, and it must have probability
              $0.75$, so $c = 0.75$.
        feedback: >
          The uniform $0.75$ has to become the wait $1$, because
          $F(1) = 0.75$.
      - reflect: >
          The same argument works at every $t$: the uniform $F(t)$ must
          become the wait $t$. What, then, is the function that turns $U$
          into $T$, and how would you find it for any CDF?
        hint: >
          If the map sends $F(t)$ to $t$, how is it related to $F$?
        answer: >
          It is the inverse of $F$: the map sends $u$ to the $t$ with
          $F(t) = u$. To build it, write $F$, solve $F(t) = u$ for $t$, and
          feed uniforms in. Then $T \le t$ happens exactly when $U \le F(t)$,
          which has probability $F(t)$ — the law you wanted.

      - part: Inverting, and why it is exact
        teach: >
          That is inverse transform sampling. For any CDF $F$ take the
          quantile function $q(u) = \inf\{x : F(x) \ge u\}$, which is
          $F^{-1}$ when $F$ is continuous and increasing, and set $X = q(U)$.
          Then $X$ has CDF exactly $F$, because $q(U) \le x$ holds precisely
          when $U \le F(x)$.
      - ask: >
          Which function samples the wait $T$?
        choices:
          - text: >
              $T = 1 - 1/(1 + U)^{2}$
            feedback: >
              That pushes the uniform through $F$ itself, the wrong direction.
              Its outputs never exceed $1$, so no draw would ever be a wait
              longer than a minute.
          - text: >
              $T = 1/\sqrt{1 - U} - 1$
            correct: true
            feedback: >
              From $u = 1 - 1/(1+t)^{2}$: $(1+t)^{2} = 1/(1-u)$, so
              $t = 1/\sqrt{1-u} - 1$. At $u = 0.75$ it gives $1/0.5 - 1 = 1$,
              as it must.
          - text: >
              $T = \sqrt{1 - U}$
            feedback: >
              It never exceeds $1$ and decreases in $U$. Check it at $u = 0.75$:
              it gives $0.5$, but the uniform $0.75$ has to become the wait
              $1$.
        feedback: >
          Write $F$, solve $F(t) = u$, and the sampler is one line.
      - ask: >
          The stream hands you $U = 0.84$. What wait does the sampler
          return?
        expects: "1.5"
        feedback: >
          $1 - 0.84 = 0.16$, $\sqrt{0.16} = 0.4$, and $1/0.4 - 1 = 1.5$
          minutes. Check: $F(1.5) = 1 - 1/2.5^{2} = 1 - 0.16 = 0.84$.
      - ask: >
          The one-line proof says $\Pr(q(U) \le x) = \Pr(U \le F(x)) = F(x)$.
          What justifies the last equality?
        choices:
          - text: >
              $F$ is continuous.
            feedback: >
              Continuity of $F$ is never used. $F(x)$ is just some number in
              $[0, 1]$, and the step holds for every such number.
          - text: >
              $U$ is uniform on $(0,1)$, so $\Pr(U \le c) = c$ for every $c$
              in $[0,1]$.
            correct: true
            feedback: >
              The uniform's CDF is the identity, and that is the whole proof.
              It is why the uniform is the primitive every sampler starts
              from.
          - text: >
              $U$ and $X$ are independent.
            feedback: >
              $X = q(U)$ is a function of $U$, as dependent as it gets. The
              step needs only the law of $U$.
        feedback: >
          No continuity of $F$ is needed in this direction, so the recipe
          works for laws with jumps and flat spots too.
      - ask: >
          A colleague writes the sampler as $T = 1/\sqrt{U} - 1$, saving a
          subtraction. Is it valid?
        choices:
          - text: >
              No: it is decreasing in $U$, so it produces a different law.
            feedback: >
              Decreasing changes which uniforms map to which waits, not how
              often each wait appears. Run it as $q(1 - U)$, and $1 - U$ is
              itself uniform.
          - text: >
              Yes: $1 - U$ is uniform too, so substituting it changes nothing
              about the law.
            correct: true
            feedback: >
              $T = q(1 - U)$ with $1 - U$ uniform. The exponential sampler
              $-\ln(U)/\lambda$ uses the same move.
          - text: >
              Only approximately, for $U$ near $1$.
            feedback: >
              The substitution is exact in law: $1 - U$ and $U$ have the same
              distribution, so $q(1-U)$ and $q(U)$ do as well.
        feedback: >
          Individual draws differ; their law is the same.

      - part: Jumps, flat spots, and the normal
        teach: >
          A loss $L$ is uniform on $(0,3)$ with probability $0.2$, exactly
          $3$ with probability $0.4$, and uniform on $(3,5)$ with probability
          $0.4$. Its CDF climbs from $0$ to $0.2$ on $[0,3)$, jumps to $0.6$ at
          $3$, and climbs to $1$ on $[3, 5]$.
      - ask: >
          The quantile function is fed $U = 0.45$. What value of $L$ comes out?
        expects: "3"
        hint: >
          Find the smallest $x$ with $F(x) \ge 0.45$.
        feedback: >
          $F$ is below $0.45$ for every $x < 3$ and equals $0.6$ at $3$, so
          $q(0.45) = 3$. Every uniform in $(0.2, 0.6]$ lands on $3$ — a band
          of width $0.4$, exactly the atom's probability. The infimum in the
          definition of $q$ is what makes the jump work.
      - ask: >
          Why does nobody write a one-line inverse transform sampler for the
          standard normal?
        choices:
          - text: >
              Its support is the whole line, so $q(U)$ would be infinite.
            feedback: >
              $q(u)$ is finite for every $u$ in $(0,1)$; only $u = 0$ or $1$
              would map to $\pm\infty$, and those have probability zero.
          - text: >
              The method needs a bounded density.
            feedback: >
              The waiting-time law above has unbounded support and the method
              ran fine. The proof used nothing but the uniform's CDF.
          - text: >
              Its CDF has no closed-form inverse, so $q$ has no formula.
            correct: true
            feedback: >
              The method is valid for the normal, but $q$ must be computed
              numerically. That gap is exactly why a dedicated normal sampler,
              Box–Muller, exists.
        feedback: >
          Inverse transform always works in principle; in practice it is as
          cheap as your formula for $q$.
      - teach: >
          Said in an interview: "Write the CDF, solve $F(x) = u$ for $x$, and
          feed uniforms. It works because $q(U) \le x$ is the same event as
          $U \le F(x)$, which has probability $F(x)$."

  - node: quant-statistics.simulation.discrete-sampling
    hook: >
      This is inverse transform with $F$ replaced by a step function, and
      the interview version usually asks you to build the cumulative table
      and locate a specific $U$ by hand under time pressure.
    explanation: >
      A discrete law is a CDF that only jumps, flat everywhere else, so
      inverse transform specializes cleanly: build the cumulative sums
      $c_j=p_1+\cdots+p_j$, and $X=q(U)$ becomes "return $v_j$ for the
      smallest $j$ with $U\le c_j$" — literally scanning the step function
      from the left until you cross $U$.

      The scan's expected cost is the expected number of comparisons before
      stopping, $\sum_j j p_j$; putting the largest probabilities first
      minimizes it, since the likeliest outcomes get found fastest. A binary
      search on the precomputed table instead finds the right interval in
      $O(\log k)$ comparisons regardless of ordering, at the price of an
      $O(k)$ setup to build the table once.

      Two special cases deserve to be memorized rather than re-derived under
      pressure: a single cutoff at $p$ gives Bernoulli($p$) via
      $\mathbf{1}\{U<p\}$, and $m$ equal cutoffs give a fair $m$-sided die via
      $\lceil mU\rceil$ — both are this exact mechanism collapsed to the
      simplest possible table.
    worked: >
      Take probabilities $(0.05, 0.35, 0.25, 0.20, 0.15)$ on values $1$
      through $5$. Cumulative sums are $0.05, 0.40, 0.65, 0.85, 1.00$. Draw
      $U=0.71$: it exceeds $0.05$, $0.40$, and $0.65$ but not $0.85$, so the
      smallest $j$ with $U\le c_j$ is $j=4$, returning the value $4$.
    interview: >
      "Sample from this discrete distribution given a uniform generator"
      wants the cumulative table built live and the comparison against $U$
      done correctly; a follow-up on cost is answered with $O(\log k)$ via
      binary search versus $O(k)$ via linear scan.
    pitfalls: >
      Comparing $U$ against the raw probabilities $p_j$ instead of the
      cumulative sums $c_j$ silently samples the wrong law. Leaving the
      table in an arbitrary order for a linear scan, instead of sorting
      largest-first, needlessly inflates the expected comparison count.
    recap: >
      Cut $[0,1]$ into consecutive intervals of length $p_1,\ldots,p_k$ and
      report which one $U$ lands in — inverse transform applied to a step
      function, $O(\log k)$ per draw with a binary search.
    dialogue:
      - part: Four outcomes and one uniform
        teach: >
          A ride-share simulator needs the number of passengers per booking:
          $1$ with probability $0.2$, $2$ with probability $0.5$, $3$ with
          probability $0.2$ and $4$ with probability $0.1$. Each booking
          gets one uniform $U$ on $(0,1)$.
      - ask: >
          Turn the uniform into a passenger count however you like, as long
          as each count comes out with its probability. Under the natural
          scheme, what does $U = 0.63$ give?
        expects: "2"
        hint: >
          Lay the four probabilities end to end along $[0,1]$, in the order
          $1, 2, 3, 4$, and see which piece $0.63$ lands in.
        feedback: >
          The pieces are $[0, 0.2]$ for $1$, $(0.2, 0.7]$ for $2$,
          $(0.7, 0.9]$ for $3$ and $(0.9, 1]$ for $4$. $0.63$ lies in the
          second, so $2$ passengers. Each piece is exactly as long as its
          probability, which is why the counts come out right.
      - ask: >
          A colleague's code instead returns the first count $j$ with
          $U \le p_j$, comparing against the raw probabilities
          $0.2, 0.5, 0.2, 0.1$. What does it do with $U = 0.63$?
        choices:
          - text: >
              Returns $2$, same as yours.
            feedback: >
              $0.63 > 0.5$, so the comparison for $2$ fails, and every later
              one fails too.
          - text: >
              Returns $4$, the last entry.
            feedback: >
              $0.63 > 0.1$ as well. Nothing in the loop ever says yes.
          - text: >
              Falls off the end of the table without returning anything.
            correct: true
            feedback: >
              Every $U$ above $0.5$ fails all four tests. Even where it does
              return, the law is wrong: count $2$ comes out for $U$ in
              $(0.2, 0.5]$, probability $0.3$ rather than $0.5$.
        feedback: >
          The comparison has to be against the running totals, the right-hand
          ends of the pieces: $0.2, 0.7, 0.9, 1$.
      - reflect: >
          Those running totals should look familiar. What are they, as a
          function of the passenger count, and which sampling method is your
          "find the piece" rule an instance of?
        hint: >
          What is $\Pr(\text{count} \le 2)$?
        answer: >
          They are the CDF of the count at $1, 2, 3, 4$: $F(2) = 0.7$, and so
          on. "Return the smallest $j$ whose running total is at least $U$" is
          exactly $q(U) = \inf\{x : F(x) \ge U\}$, inverse transform sampling
          with a step CDF. That is why it is correct: the piece for value $j$
          has length $p_j$, so it is hit with probability $p_j$.

      - part: The cumulative table
        teach: >
          The general recipe: for probabilities $p_1, \dots, p_k$ on values
          $v_1, \dots, v_k$, form the cumulative sums $c_j = p_1 + \dots +
          p_j$, draw $U$, and return $v_j$ for the smallest $j$ with
          $U \le c_j$. Two tables are worth knowing cold: one cutoff at $p$
          gives a Bernoulli, $\mathbf{1}\{U < p\}$, and $m$ equal pieces give a
          fair die, $\lceil mU \rceil$.
      - ask: >
          A fair six-sided die is simulated as $\lceil 6U \rceil$. What face
          does $U = 0.38$ give?
        expects: "3"
        feedback: >
          $6 \times 0.38 = 2.28$, and $\lceil 2.28 \rceil = 3$. The pieces are
          sixths, and $0.38$ falls in the third, $(2/6, 3/6]$.
      - ask: >
          Scanning the passenger table from the left in the order
          $1, 2, 3, 4$, the scan stops at the $j$-th comparison when the
          answer is the $j$-th entry. What is the expected number of
          comparisons per draw?
        expects: "2.2"
        hint: >
          Weight each stopping position by its probability.
        feedback: >
          $1(0.2) + 2(0.5) + 3(0.2) + 4(0.1) = 0.2 + 1.0 + 0.6 + 0.4 = 2.2$.
          Half the time the answer is $2$, yet every scan pays first for a
          test against count $1$.
      - ask: >
          Reorder the table so the scan is as cheap as possible. What is the
          expected number of comparisons now?
        expects: "1.9"
        hint: >
          Which entry should be checked first?
        feedback: >
          Most likely first: order $2, 1, 3, 4$ gives
          $1(0.5) + 2(0.2) + 3(0.2) + 4(0.1) = 1.9$. The cutoffs change with
          the order, but any order is a valid table — the pieces are just laid
          down differently.

      - part: Large tables, and a table that leaks
        ask: >
          An empirical return distribution has $k = 1048576 = 2^{20}$
          outcomes. A linear scan averages hundreds of thousands of
          comparisons. A binary search on the cumulative table needs about
          how many per draw?
        expects: "20"
        hint: >
          Each comparison halves the range of possible answers.
        feedback: >
          $\log_{2} 2^{20} = 20$. The table costs $O(k)$ to build once, and
          every draw after that costs $O(\log k)$ — the right trade whenever
          the law is sampled more than a handful of times.
      - ask: >
          Your table's cumulative sums are computed in floating point, and
          the last one comes out as $0.9999999998$ instead of $1$. What can
          go wrong?
        choices:
          - text: >
              Nothing: a gap of $2 \times 10^{-10}$ is negligible.
            feedback: >
              Negligible in probability, fatal in code: over $10^{10}$ draws
              you expect about two uniforms above the last cutoff, the search
              finds no answer, and the run crashes or returns garbage.
          - text: >
              A uniform above $0.9999999998$ matches no entry; set the last
              cutoff to exactly $1$.
            correct: true
            feedback: >
              Forcing $c_k = 1$ guarantees every $U$ in $(0,1)$ finds a piece.
              The error moves into the last outcome's probability, by
              $2 \times 10^{-10}$, which nothing will ever detect.
          - text: >
              Every outcome's probability is now slightly too small.
            feedback: >
              Only the gap above the last cutoff is unaccounted for; every
              earlier piece keeps its length. The danger is the gap itself.
        feedback: >
          The cumulative table has to cover $[0,1]$ completely, or some
          uniform has nowhere to go.
      - teach: >
          Said in an interview: "Build the cumulative sums, draw $U$, and
          return the first value whose cumulative sum reaches $U$ — inverse
          transform on a step CDF, $O(\log k)$ per draw with a binary search."
          If the interviewer pushes for constant time per draw, that is a
          different construction, the alias method.

  - node: quant-statistics.simulation.alias-method
    hook: >
      "Can you sample from this fixed discrete law in $O(1)$ time" is the
      follow-up once the cumulative-table answer's $O(\log k)$ draw cost gets
      pushed on, and the alias method is the only standard answer.
    explanation: >
      Even a binary search costs $O(\log k)$ on every single draw. The alias
      method instead pays a one-time $O(k)$ setup so every later draw costs a
      fixed $O(1)$ — two uniforms, no search — which only pays for itself
      when the same fixed law gets sampled many, many times.

      The construction reshapes the law into $k$ columns of equal width
      $1/k$, each holding at most two outcomes stacked to height $1$: rescale
      each probability to $q_i=kp_i$ (these average to $1$ since the $p_i$
      sum to $1$), then repeatedly take a deficient cell ($q_i<1$) and a
      surplus cell ($q_j>1$), topping the deficient one up to height $1$ with
      mass borrowed from the surplus one and recording that outcome as its
      alias. Every cell ends up fully accounted for, holding its own outcome
      plus at most one alias.

      Drawing is then trivial: pick a column uniformly with
      $i=\lceil kU_1\rceil$, then a second uniform $U_2$ decides whether you
      land in that column's own retained mass or its alias — no search of
      any kind, because the table already did the work at setup.
    worked: >
      Take probabilities $(0.5, 0.25, 0.25)$ on $3$ outcomes, so $k=3$ and
      $q=(1.5, 0.75, 0.75)$. Column $2$ is deficient by $0.25$, topped up
      with $0.25$ borrowed from column $1$'s surplus and aliased to $1$;
      column $1$'s remaining surplus is exactly used up on column $3$'s
      identical deficiency, also aliased to $1$. Draw $U_1=0.4$:
      $i=\lceil3\times0.4\rceil=2$. With $U_2=0.6\le0.75$, return outcome
      $2$ itself; had $U_2$ been $0.9>0.75$, the draw would return the
      alias, outcome $1$.
    interview: >
      "How do you sample in constant time from a fixed distribution" is
      answered by naming the $O(k)$ setup / $O(1)$ draw tradeoff and
      sketching the deficient-surplus pairing — the interviewer checks you
      know when the setup pays off, not just that the method exists.
    pitfalls: >
      Rebuilding the alias table for a one-off draw wastes the setup cost —
      the cumulative-table search is simpler and just as fast in total for a
      single use. Forgetting that $q_i=kp_i$, not $p_i$ itself, is easy to
      drop under time pressure and breaks the height-$1$ columns.
    recap: >
      Rescale probabilities by $k$, pair every deficient cell with a surplus
      one until each of the $k$ columns holds at most two outcomes at height
      $1$, and after that setup every draw costs exactly two uniforms and no
      search.
    dialogue:
      - part: A billion draws from one fixed law
        teach: >
          An order-flow simulator draws the type of every event from the same
          fixed law: outcome $1$, a market order, with probability $0.45$;
          outcome $2$, a limit order, $0.30$; outcome $3$, a cancel, $0.15$;
          outcome $4$, a modify, $0.10$. A day's run makes $10^{9}$ draws, and
          the law never changes.
      - ask: >
          With the cumulative table you already know, which outcome does the
          uniform $U = 0.80$ produce?
        expects: "3"
        hint: >
          The cutoffs are the running totals of $0.45, 0.30, 0.15, 0.10$.
        feedback: >
          The cutoffs are $0.45, 0.75, 0.90, 1$. $0.80$ is above $0.75$ and at
          most $0.90$, so the draw is outcome $3$, a cancel.
      - ask: >
          Over the $10^{9}$ draws, which part of that sampler is wasted work?
        choices:
          - text: >
              Generating the uniforms: one per draw is more randomness than
              four outcomes need.
            feedback: >
              Every draw needs at least one uniform's worth of randomness;
              there is no saving there. The waste is in what happens after
              the uniform arrives.
          - text: >
              Building the cumulative table.
            feedback: >
              That is done once, at cost $O(k)$, and then reused $10^{9}$
              times. It is the cheapest part of the run.
          - text: >
              Every draw searches the same table again, rediscovering
              boundaries that never move.
            correct: true
            feedback: >
              For four outcomes the search is two comparisons; for a law on
              $2^{20}$ price levels it is $20$ comparisons, each a likely cache
              miss, on every one of the $10^{9}$ draws. The law is fixed, so
              all that searching keeps answering the same question.
        feedback: >
          A fair die needs no search at all: $\lceil 4U \rceil$ jumps straight
          to the answer. The question is whether a loaded law can be made to
          behave like that.
      - ask: >
          A colleague tries exactly that: return outcome $\lceil 4U \rceil$.
          How often does his sampler produce a market order?
        expects: "0.25"
        feedback: >
          $\lceil 4U \rceil = 1$ when $U \le 0.25$, so a quarter of the time,
          against the $0.45$ required. One uniform pick among four equal slots
          can only produce the uniform law; the loading has to live somewhere
          else.

      - part: Flattening the skyline
        reflect: >
          Draw four columns of width $1/4$, column $i$ of height $4p_i$:
          heights $1.8, 1.2, 0.6, 0.4$. Column $i$ has area $p_i$, so a point
          dropped uniformly under this skyline lands in column $i$ with
          probability $p_i$. The heights average exactly $1$. How could you
          make every column height $1$ without changing how much area each
          outcome owns — and what would a draw look like then?
        hint: >
          The tall columns have exactly as much excess as the short ones are
          missing.
        answer: >
          Cut the excess off the tall columns and pour it into the short ones,
          keeping each piece labelled with its outcome. A short column then
          holds its own outcome up to its old height and some other outcome
          above it; every column is a rectangle of height $1$. A point uniform
          in that $4 \times 1$ rectangle is two uniforms: $\lceil 4U_1
          \rceil$ picks the column, and $U_2$ says whether you are below the
          cut (its own outcome) or above it (the other one). One comparison,
          no search.
      - teach: >
          That is Walker's alias method. Setup: rescale to $q_i = k p_i$,
          which average $1$. While some cell is deficient, $q_i < 1$, pair it
          with a surplus cell, $q_j > 1$: cell $i$ keeps its own outcome up to
          height $q_i$, the gap $1 - q_i$ is filled with mass borrowed from
          $j$, $j$ is recorded as the *alias* of cell $i$, and $q_j$ drops by
          $1 - q_i$. Draw: $i = \lceil kU_1 \rceil$, then return $i$ if $U_2$
          is at most cell $i$'s retained height, and its alias otherwise.
          Setup is $O(k)$, every draw is $O(1)$.
      - ask: >
          Build the table for the order-flow law. First top up the cancel
          cell, height $0.6$, from the market cell, height $1.8$. What is the
          market cell's height afterwards?
        expects: "1.4"
        feedback: >
          The cancel cell is short by $1 - 0.6 = 0.4$, so the market cell
          gives $0.4$: $1.8 - 0.4 = 1.4$. Cell $3$ now retains $0.6$ and
          aliases to outcome $1$.
      - ask: >
          Next top up the modify cell, height $0.4$, again from the market
          cell. What is the market cell's height now?
        expects: "0.8"
        feedback: >
          The modify cell needs $0.6$, so $1.4 - 0.6 = 0.8$. Cell $4$ retains
          $0.4$ and aliases to outcome $1$ — and the market cell, which
          started as the tallest, is now short.
      - ask: >
          The market cell sits at $0.8$. What does the setup do with it?
        choices:
          - text: >
              It has failed: a donor dropped below $1$, so restart with a
              different pairing order.
            feedback: >
              Nothing has failed. A donor is just a cell; once it gives away
              more than its excess it becomes deficient like any other, and
              joins the queue to be topped up.
          - text: >
              Tops it up from the limit cell: market retains $0.8$ and
              aliases to outcome $2$, and the limit cell ends at exactly $1$.
            correct: true
            feedback: >
              The limit cell had $1.2$ and gives $0.2$, landing on $1$ with no
              alias. Final table: cell $1$ retains $0.8$, alias $2$; cell $2$
              is pure; cell $3$ retains $0.6$, alias $1$; cell $4$ retains
              $0.4$, alias $1$.
          - text: >
              Leaves it at $0.8$: the missing $0.2$ is rounding.
            feedback: >
              It is a fifth of a column, about $0.05$ of probability. Leave it
              and every draw landing in that gap has no outcome to return.
        feedback: >
          A cell can donate and later be topped up itself; that is how its
          column ends with two outcomes, its own and one alias.
      - ask: >
          Why is the setup guaranteed to end with every cell at height
          exactly $1$, whatever order the pairs are taken in?
        choices:
          - text: >
              A surplus cell never becomes deficient, so donors never run out.
            feedback: >
              The market cell just did. The guarantee cannot rest on donors
              staying tall.
          - text: >
              There are always as many deficient cells as surplus ones.
            feedback: >
              Here there were two of each by coincidence. The law $(0.7, 0.1,
              0.1, 0.1)$ has heights $2.8, 0.4, 0.4, 0.4$: one donor, three
              deficient cells, and the setup still works.
          - text: >
              Each pairing finishes one cell for good, and the unfinished
              heights still average $1$, so the last unfinished cell must be
              exactly $1$.
            correct: true
            feedback: >
              A pairing only moves mass between cells, so the average of the
              unfinished heights stays $1$; a deficient cell below $1$ forces
              a surplus cell above it to exist. After at most $k - 1$ pairings
              one cell remains, and its height is its own average: $1$.
        feedback: >
          At most $k - 1$ pairings, each $O(1)$: the setup is $O(k)$, and each
          column holds its own outcome plus at most one alias.

      - part: Checking the table, then drawing
        ask: >
          Each cell is picked with probability $1/4$. From the final table,
          what is the probability that a draw returns a market order?
        expects: "0.45"
        hint: >
          Market mass sits in three columns: its own retained part and two
          alias regions.
        feedback: >
          Cell $1$ retains $0.8$ of market; cells $3$ and $4$ alias their top
          $0.4$ and $0.6$ to market. $(0.8 + 0.4 + 0.6)/4 = 1.8/4 = 0.45$,
          exactly $p_1$. Pouring mass between columns never changed how much
          each outcome owned.
      - ask: >
          A draw gives $U_1 = 0.58$ and $U_2 = 0.7$. Which outcome comes back?
        expects: "1"
        hint: >
          Find the cell with $\lceil 4U_1 \rceil$, then compare $U_2$ with that
          cell's retained height.
        feedback: >
          $\lceil 4 \times 0.58 \rceil = \lceil 2.32 \rceil = 3$, the cancel
          cell, which retains $0.6$. $U_2 = 0.7 > 0.6$, so the draw falls in
          the alias region and returns outcome $1$, a market order. Two
          uniforms, one multiplication, one comparison.

      - part: When the setup does not pay
        ask: >
          For which job is the alias method the wrong tool?
        choices:
          - text: >
              $10^{9}$ draws from a fixed law on $1000$ outcomes.
            feedback: >
              This is its home ground: an $O(1000)$ setup amortised over a
              billion draws, each of which saves a ten-step binary search.
          - text: >
              One draw from a law on $10^{6}$ outcomes that will never be used
              again.
            correct: true
            feedback: >
              The setup costs $O(10^{6})$ and buys a single draw. Building the
              cumulative table is also $O(10^{6})$, but it is simpler, and the
              one search after it costs $20$ comparisons. For a one-off the two
              are the same order of work, and the plain table wins on
              simplicity.
          - text: >
              $10^{6}$ draws from a fixed law on $50$ outcomes.
            feedback: >
              Fixed law, many draws: the $O(50)$ setup is paid back almost
              immediately. The alias method fits, though with $50$ outcomes
              the binary search it replaces was only six comparisons.
        feedback: >
          The trade is $O(k)$ once against $O(\log k)$ per draw. It pays
          exactly when the same fixed law is sampled many times.
      - teach: >
          Said in an interview: "Rescale to $q_i = kp_i$, pair each short
          column with a tall one until every column has height $1$ and holds
          at most two outcomes. Then a draw is $\lceil kU_1 \rceil$ for the
          column and $U_2$ against its cut: $O(k)$ setup, $O(1)$ per draw,
          worth it only for a fixed law sampled many times."

  - node: quant-statistics.simulation.rejection
    hook: >
      When a density can't be inverted, or is known only up to its
      normalizing constant — the norm for a Bayesian posterior — rejection
      sampling is the fallback to name immediately, along with its real
      price: the expected number of attempts.
    explanation: >
      Picture the target density $f$ and an envelope $Mg(x)$ sitting
      entirely above it everywhere, for some proposal $g$ you already know
      how to sample (via inverse transform, say). Sampling a point uniformly
      under the graph of $Mg$ and discarding every point that lands above $f$
      but under $Mg$ leaves exactly the points that fell under $f$ — and a
      uniform draw under an entire density's graph is, in fact, a draw from
      that density. That single geometric fact is the whole proof.

      Implementing "sample under $Mg$, keep what's also under $f$" per draw
      needs no plotting: draw $Y\sim g$, draw an independent uniform $U$, and
      accept if $U\le f(Y)/(Mg(Y))$ — exactly the height fraction the point
      needs to fall within to sit under both curves.

      Each attempt succeeds independently with probability exactly $1/M$
      (integrate $f/(Mg)$ against $g$ and the $M$'s cancel), so the number of
      attempts before one acceptance is geometric with mean $M$. The whole
      method's cost is set by how tightly the envelope hugs the target, so
      choosing $M$ as small as $f\le Mg$ allows is the entire art of using
      it well.
    worked: >
      Take target $f(x)=x/2$ on $(0,2)$ with proposal $g$ uniform on
      $(0,2)$, density $1/2$. The ratio $f/g=x$ peaks at $x=2$, so $M=2$ is
      the tightest valid envelope, giving acceptance probability
      $1/M=50\%$. Accept $Y$ if $U\le f(Y)/(Mg(Y))=Y/2$. Draw $Y=1.4$,
      $U=0.65$: since $0.65\le1.4/2=0.7$, accept $X=1.4$.
    interview: >
      "How do you sample from a density you can only evaluate up to a
      constant" is the standard Bayesian-posterior prompt; the interviewer
      listens for the acceptance ratio written correctly and the
      geometric-with-mean-$M$ cost stated unprompted.
    pitfalls: >
      Choosing $M$ smaller than the true maximum of $f/g$ anywhere biases
      every accepted sample, even at one violated point. Picking a proposal
      whose tails are thinner than $f$'s forces $M$ to infinity — no valid
      envelope exists — the same fat-tails requirement that resurfaces later
      for importance sampling.
    recap: >
      Draw under a scaled envelope $Mg$, accept with probability
      $f(Y)/(Mg(Y))$, and the accepted points are distributed exactly as
      $f$ — at a cost of $M$ attempts per acceptance.
    dialogue:
      - part: A posterior with no inverse
        teach: >
          A uniform prior on a fill rate $\theta$, then $2$ fills in $4$
          orders, leaves a posterior proportional to $\theta^{2}(1-\theta)^{2}$
          on $(0,1)$. Normalised it is $f(x) = 30x^{2}(1-x)^{2}$, with CDF
          $F(x) = 10x^{3} - 15x^{4} + 6x^{5}$. A risk model wants a million
          draws of it, and you have a stream of uniforms.
      - ask: >
          Inverse transform is the first thing to try. What stands in the
          way?
        choices:
          - text: >
              $F$ is a polynomial, so $q(U)$ is not a valid sample.
            feedback: >
              Inverse transform works for any CDF at all; a polynomial is as
              good as any. The trouble is computing $q$, not whether it is
              valid.
          - text: >
              Solving $10x^{3} - 15x^{4} + 6x^{5} = u$ for $x$ has no formula,
              so every draw needs a numerical root-find.
            correct: true
            feedback: >
              A quintic has no general closed-form root. You could run a few
              Newton steps per draw, but there is a way to sample $f$ using
              nothing beyond evaluating it.
          - text: >
              The support is bounded, and inverse transform needs the whole
              line.
            feedback: >
              The rate-$\lambda$ exponential lives on a half-line and inverts
              in one line. Support plays no role in the proof.
        feedback: >
          You can evaluate $f$ anywhere; you cannot invert $F$. The method
          wanted is one that only ever evaluates $f$.
      - ask: >
          Fence the graph of $f$ inside a rectangle over $[0,1]$, as short as
          possible. How tall must it be?
        expects: "1.875"
        hint: >
          The graph is symmetric about $x = 1/2$.
        feedback: >
          The peak is at $x = 1/2$: $f(1/2) = 30 \cdot \tfrac{1}{4} \cdot
          \tfrac{1}{4} = 30/16 = 1.875$. The box is $[0,1] \times [0, 1.875]$.
      - reflect: >
          Throw darts uniformly into that box — two uniforms per dart — and
          keep only those landing under the graph of $f$. What is the law of
          the $x$-coordinate of a kept dart, and why?
        hint: >
          Given that a dart was kept, how likely is it to lie over an
          interval $[a, b]$?
        answer: >
          Its density is exactly $f$. A kept dart is uniform on the region
          under the graph, so the chance it lies over $[a, b]$ is the area
          under $f$ there divided by the total area under $f$, which is $1$:
          that is $\int_a^b f(x)\,dx$. Discarding the darts above the curve
          costs time and nothing else; the survivors are draws from $f$.

      - part: Darts under an envelope
        teach: >
          That is rejection sampling. Choose a proposal density $g$ you can
          already sample and a constant $M$ with $f(x) \le M g(x)$ for all
          $x$. Draw $Y \sim g$ and an independent uniform $U$; accept $X = Y$
          if $U \le f(Y)/(M g(Y))$, otherwise discard and start over. Accepted
          values have density exactly $f$. Your box is the case $g = 1$ on
          $(0,1)$ and $M = 1.875$: $Y$ is the dart's $x$, and $U M g(Y)$ is its
          height.
      - ask: >
          What is the probability that a single dart is kept? Give a fraction.
        expects: "8/15"
        hint: >
          Compare the area under the curve with the area of the box.
        feedback: >
          The area under $f$ is $1$ and the box has area $1.875$, so
          $1/1.875 = 8/15 \approx 0.533$. That is $1/M$.
      - ask: >
          On average, how many darts does each accepted draw cost?
        expects: "1.875"
        feedback: >
          Each dart is kept independently with probability $8/15$, so the
          number of darts per acceptance is geometric with mean $15/8 =
          1.875 = M$. A million draws cost about $1.875$ million proposals.
      - ask: >
          With a general proposal, $\Pr(\text{accept}) = \int g(y) \cdot
          f(y)/(M g(y))\,dy$. Why is this $1/M$ whatever $g$ is?
        choices:
          - text: >
              It is not: the uniform proposal is special, and other $g$ give
              other rates.
            feedback: >
              Write it out: $g(y)$ multiplies and divides, leaving
              $\int f(y)\,dy / M$. Nothing about the uniform was used.
          - text: >
              $g$ cancels, and $f$ integrates to $1$, leaving $1/M$.
            correct: true
            feedback: >
              So the cost is set by $M$ alone, and the art is a proposal that
              hugs $f$ closely enough that $M$ can be near $1$.
          - text: >
              Because $U$ is uniform, every proposal is accepted with
              probability $1/M$.
            feedback: >
              $U$ being uniform makes a proposal at $y$ accepted with
              probability $f(y)/(M g(y))$, which varies with $y$. Only the
              average over $y$ comes out as $1/M$.
        feedback: >
          The number of attempts per accepted draw is geometric with mean $M$:
          the envelope's tightness is the whole cost.

      - part: Without the normalising constant
        ask: >
          Suppose you never worked out the $30$ and know only
          $\tilde{f}(x) = x^{2}(1-x)^{2}$, as is usual for a posterior. Can you
          still run the sampler?
        choices:
          - text: >
              No: $M$ is defined through $f$, so the constant must be
              integrated out first.
            feedback: >
              The rule only ever uses the ratio $f(Y)/(Mg(Y))$. Scale $f$ by
              any constant and choose $M$ against the scaled version, and the
              ratio is unchanged.
          - text: >
              Yes: accept when $U \le \tilde{f}(Y)/\max \tilde{f}$, and the
              unknown constant cancels.
            correct: true
            feedback: >
              $\max \tilde{f} = 1/16$, so the rule is $U \le 16Y^{2}(1-Y)^{2}$,
              the same test as before. What you lose is the acceptance rate:
              $1/M$ needs the constant.
          - text: >
              Yes, but the draws come out with density $\tilde{f}$, which is
              not a probability density.
            feedback: >
              The kept darts are uniform under the graph; rescaling the graph
              vertically does not change where they sit horizontally. Their
              law is the normalised $f$.
        feedback: >
          Rejection sampling needs $f$ only up to a constant, which is why it
          is the standing answer for a posterior you cannot normalise.
      - ask: >
          A proposal arrives at $Y = 0.3$. What is the acceptance threshold
          $16Y^{2}(1-Y)^{2}$?
        expects: "0.7056"
        tolerance: 0.0001
        feedback: >
          $16 \times 0.09 \times 0.49 = 0.7056$. A uniform $U = 0.62$ keeps
          the draw; $U = 0.75$ throws it away and you propose again.

      - part: Envelopes that leak
        ask: >
          A colleague lowers the box to height $1.5$ to raise the acceptance
          rate, reasoning that only a sliver of the graph pokes above it.
          What happens?
        choices:
          - text: >
              Faster sampling and the same law: a lower box only discards
              fewer darts.
            feedback: >
              Where $f(x) > 1.5$ the test $U \le f(x)/1.5$ always passes, so
              those $x$ are kept at rate $1$ instead of at rate proportional
              to $f$. The tallest part of the density is flattened.
          - text: >
              The draws are biased: values near $1/2$, where $f > 1.5$, come
              out too rarely.
            correct: true
            feedback: >
              $f > 1.5$ on roughly $(0.34, 0.66)$, and there the graph sticks
              out of the box. The middle of the distribution is clipped, and
              no number of draws fixes it.
          - text: >
              The sampler loops forever, since no dart can be kept above the
              box.
            feedback: >
              Darts are kept constantly; the problem is the law they follow.
              The box only needs to cover $f$ to be correct, and this one
              does not.
        feedback: >
          $f \le Mg$ must hold everywhere. Fail it anywhere and the sampler is
          quietly wrong there.
      - ask: >
          Target: the half-Cauchy density $2/(\pi(1+x^{2}))$ on $x > 0$.
          Proposal: the rate-$1$ exponential, which inverse transform samples
          as $-\ln U$. What is the best envelope constant $M$?
        choices:
          - text: >
              $M = 2/\pi$, the ratio at $x = 0$.
            feedback: >
              The ratio $f/g = 2e^{x}/(\pi(1+x^{2}))$ is $2/\pi$ at $0$ and
              then grows without bound. An envelope must cover the ratio
              everywhere, not where it starts.
          - text: >
              There is none: $f/g$ grows like $e^{x}/x^{2}$, so no finite $M$
              covers it.
            correct: true
            feedback: >
              The exponential's tail dies much faster than the Cauchy's. Any
              proposal for rejection needs tails at least as heavy as the
              target's.
          - text: >
              About $2$, found numerically by checking $x$ up to $10$.
            feedback: >
              At $x = 10$ the ratio is $2e^{10}/(101\pi) \approx 139$, and it
              keeps climbing. Checking a finite range is how a broken envelope
              slips into production.
        feedback: >
          Light-tailed proposals cannot envelope heavy-tailed targets. Swap
          the roles — exponential target, Cauchy proposal — and a finite $M$
          exists.
      - teach: >
          Said in an interview: "Pick a proposal I can sample and an $M$ with
          $f \le Mg$ everywhere; accept $Y$ when $U \le f(Y)/(Mg(Y))$. The
          accepted points are uniform under $f$, so they have density $f$, and
          each costs $M$ attempts on average. It needs $f$ only up to a
          constant."

  - node: quant-statistics.simulation.box-muller
    hook: >
      This exists purely because the normal's CDF has no closed-form
      inverse, and it's the standard answer to "generate a normal from a
      uniform generator" — the interview wants the polar-coordinates
      reasoning, not just the two formulas.
    explanation: >
      The move is a change of viewpoint: instead of inverting the normal CDF
      directly, which is impossible in closed form, work with a pair of
      independent standard normals at once and describe that pair in polar
      coordinates. For independent standard bivariate normal $(Z_1,Z_2)$,
      symmetry makes the angle uniform on $[0,2\pi)$ exactly, with no
      dependence on the radius, since the joint density depends only on
      $Z_1^{2}+Z_2^{2}$.

      The squared radius $R^{2}=Z_1^{2}+Z_2^{2}$ turns out to be
      Exponential($1/2$) — take that as given here. Running inverse
      transform sampling on that exponential law is exactly where
      $-2\ln U_1$ comes from: $R=\sqrt{-2\ln U_1}$.

      So the construction runs the polar picture backwards: sample the angle
      directly as uniform ($\Theta=2\pi U_2$), sample the radius via inverse
      transform on its known law, and convert back to Cartesian coordinates
      — $Z_1=R\cos\Theta$, $Z_2=R\sin\Theta$ — which are, by construction,
      independent standard normals, two for the price of two uniforms.
    worked: >
      Take $U_1=0.5$, $U_2=0.25$. Then
      $R=\sqrt{-2\ln0.5}=\sqrt{2\ln2}\approx1.1774$, and
      $\Theta=2\pi\times0.25=\pi/2$. So $Z_1=R\cos(\pi/2)=1.1774\times0=0$,
      and $Z_2=R\sin(\pi/2)=1.1774\times1=1.1774$ — one exact zero and one
      nonzero standard normal draw from this single pair of uniforms.
    interview: >
      "Generate a normal random variable from a uniform generator" is the
      canonical prompt; a strong answer states the polar-coordinates
      reasoning — uniform angle, exponential squared radius — before writing
      the two formulas, and knows this is needed precisely because
      $\Phi^{-1}$ has no closed form.
    pitfalls: >
      Producing only one normal per pair of uniforms by discarding $Z_2$
      wastes half the draws — both coordinates are valid, independent
      output. Confusing this with rejection sampling: Box–Muller accepts
      every pair of uniforms it draws; the Marsaglia polar variant is the
      one that adds an accept/reject loop instead of the two trig calls.
    recap: >
      Two uniforms become two independent standard normals by sampling the
      angle as uniform on $[0,2\pi)$ and the squared radius via inverse
      transform on its exponential law, then converting back to Cartesian
      coordinates.
    dialogue:
      - part: A normal from uniforms
        teach: >
          A risk script needs ten million standard normal shocks a day, and
          all it has is a uniform stream. A colleague's shortcut:
          $Z = U_1 + U_2 + \dots + U_{12} - 6$, twelve uniforms per shock.
      - ask: >
          What is the variance of his $Z$?
        expects: "1"
        hint: >
          A uniform on $(0,1)$ has variance $1/12$.
        feedback: >
          Twelve independent uniforms, each of variance $1/12$, sum to
          variance $1$, and subtracting $6$ centres the mean at $0$. Mean and
          variance are right, and the central limit theorem makes the
          histogram look like a bell.
      - ask: >
          What is wrong with it for a risk model?
        choices:
          - text: >
              Nothing: by the central limit theorem the sum is exactly normal.
            feedback: >
              The theorem is a limit, and twelve terms is not the limit. The
              sum has a piecewise-polynomial density that only resembles the
              normal near the middle.
          - text: >
              Its mean is off, since the uniforms are on $(0,1)$ rather than
              symmetric.
            feedback: >
              The sum has mean $12 \times 0.5 = 6$, and the $-6$ removes it
              exactly. The defect is not in the first two moments.
          - text: >
              It can never exceed $6$, and its tails are already too thin well
              before that.
            correct: true
            feedback: >
              $\Pr(Z > 4)$ comes out about $8.5 \times 10^{-6}$ against the
              normal's $3.2 \times 10^{-5}$, and $\Pr(Z > 5)$ about $140$ times
              too small. A risk model lives in exactly that tail, and pays
              twelve uniforms per shock for the privilege.
        feedback: >
          Approximately normal is not good enough where the tail is the
          answer. You want an exact normal.
      - ask: >
          The exact route you know is inverse transform, $Z = \Phi^{-1}(U)$.
          Why is that not the standard answer?
        choices:
          - text: >
              $\Phi^{-1}(U)$ would not be exactly normal, since $\Phi$ has no
              formula.
            feedback: >
              The proof $\Pr(\Phi^{-1}(U) \le z) = \Pr(U \le \Phi(z)) =
              \Phi(z)$ needs no formula. The draws would be exactly normal;
              computing them is the trouble.
          - text: >
              $\Phi$ has no closed form, so neither does $\Phi^{-1}$, and each
              draw needs a numerical approximation.
            correct: true
            feedback: >
              Libraries do ship careful rational approximations to
              $\Phi^{-1}$. But there is an exact route with one logarithm, one
              square root and two trig calls, which comes from looking at two
              normals at once.
          - text: >
              The normal's support is the whole line, so $\Phi^{-1}(U)$ can be
              infinite.
            feedback: >
              Only $U = 0$ or $U = 1$ map to $\pm\infty$, and they have
              probability zero. The support is no obstacle.
        feedback: >
          One normal has no clean inverse. Two of them turn out to be easier.

      - part: Two normals in polar coordinates
        reflect: >
          Independent standard normals $Z_1, Z_2$ have joint density
          $\frac{1}{2\pi} e^{-(z_1^{2} + z_2^{2})/2}$. What does the shape of
          that density say about the point $(Z_1, Z_2)$ in polar coordinates
          — in particular, about its angle?
        hint: >
          The density depends on $z_1$ and $z_2$ only through one quantity.
        answer: >
          It depends only on $z_1^{2} + z_2^{2}$, the squared distance from the
          origin, so it is unchanged by rotation. The angle $\Theta$ is
          therefore uniform on $[0, 2\pi)$, and it is independent of the
          radius $R$: knowing how far out the point is says nothing about the
          direction. If you can draw the radius with the right law, a uniform
          angle finishes the job and gives two normals at once.
      - ask: >
          Before finding the law of $R^{2} = Z_1^{2} + Z_2^{2}$, pin its mean.
          What is $\mathbb{E}[R^{2}]$?
        expects: "2"
        feedback: >
          $\mathbb{E}[Z_1^{2}] = \operatorname{Var}(Z_1) = 1$, and the same
          for $Z_2$, so $\mathbb{E}[R^{2}] = 2$. In polar coordinates
          $\Pr(R > \rho) = \int_{\rho}^{\infty} s\, e^{-s^{2}/2}\,ds =
          e^{-\rho^{2}/2}$, so $\Pr(R^{2} > r) = e^{-r/2}$: $R^{2}$ is
          exponential with mean $2$.
      - ask: >
          By inverse transform, which function of a uniform $U_1$ has the law
          of $R^{2}$, with $\Pr(R^{2} > r) = e^{-r/2}$?
        choices:
          - text: >
              $-\ln(U_1)/2$
            feedback: >
              That has $\Pr(-\ln(U_1)/2 > r) = \Pr(U_1 < e^{-2r}) = e^{-2r}$:
              exponential with mean $1/2$, not $2$. The rate and the mean have
              been swapped.
          - text: >
              $e^{-U_1/2}$
            feedback: >
              That pushes the uniform through the tail function itself, the
              wrong direction. Its values lie in $(0.6, 1)$, while $R^{2}$ is
              unbounded.
          - text: >
              $-2\ln U_1$
            correct: true
            feedback: >
              $\Pr(-2\ln U_1 > r) = \Pr(U_1 < e^{-r/2}) = e^{-r/2}$. Solving
              $1 - e^{-r/2} = u$ gives $-2\ln(1-u)$, and $1 - U_1$ is uniform
              too.
        feedback: >
          So $R = \sqrt{-2\ln U_1}$, and the angle needs only $2\pi U_2$.
      - teach: >
          That is the Box–Muller transform. From two independent uniforms set
          $R = \sqrt{-2\ln U_1}$ and $\Theta = 2\pi U_2$; then
          $Z_1 = R\cos\Theta$ and $Z_2 = R\sin\Theta$ are independent standard
          normals. It is the polar description of the bivariate normal, run
          backwards. For $N(\mu, \sigma^{2})$ use $\mu + \sigma Z$.

      - part: Two shocks by hand
        ask: >
          The stream gives $U_1 = 0.3$. What is $R$, to four decimal places?
        expects: "1.5518"
        tolerance: 0.0005
        hint: >
          $\ln 0.3 \approx -1.2040$.
        feedback: >
          $-2\ln 0.3 \approx 2.4079$, and $\sqrt{2.4079} \approx 1.5518$.
      - ask: >
          With $U_2 = 0.375$, what is $Z_1$, to four decimal places?
        expects: "-1.0973"
        tolerance: 0.0005
        hint: >
          $2\pi \times 0.375$ is three quarters of $\pi$.
        feedback: >
          $\Theta = 0.75\pi$, where $\cos\Theta = -\sqrt{2}/2 \approx
          -0.7071$, so $Z_1 \approx 1.5518 \times (-0.7071) \approx -1.0973$.
          And $Z_2 = 1.5518 \times 0.7071 \approx 1.0973$ comes free.
      - ask: >
          $Z_1$ and $Z_2$ are built from the same $R$. Are they independent?
        choices:
          - text: >
              No: a large $R$ makes both large in size, so $\lvert Z_1 \rvert$
              and $\lvert Z_2 \rvert$ are correlated.
            feedback: >
              That would be true for most radius laws — with $R = 1$ fixed,
              $Z_1^{2} + Z_2^{2} = 1$ and the two are tied together. For this
              exact law the joint density of $(R\cos\Theta, R\sin\Theta)$ is
              $\frac{1}{2\pi}e^{-(z_1^{2}+z_2^{2})/2}$, which factors.
          - text: >
              Yes, because $U_1$ and $U_2$ are independent.
            feedback: >
              Independent inputs do not make independent outputs: both outputs
              use both inputs. The reason is the specific law of $R$.
          - text: >
              Yes: the pair has the bivariate normal density, which factors
              into two standard normal densities.
            correct: true
            feedback: >
              The construction reproduces the rotation-invariant density
              exactly, and that density is a product. Keep both: discarding
              $Z_2$ throws away a free normal.
        feedback: >
          Independence comes from the radius law being exactly right, which
          is why the $-2\ln U_1$ cannot be tinkered with.

      - part: Where it goes wrong
        ask: >
          A colleague writes $R = \sqrt{-\ln U_1}$, dropping the $2$. What is
          the variance of his $Z_1$?
        expects: "0.5"
        hint: >
          $\operatorname{Var}(Z_1) = \mathbb{E}[R^{2}]\,\mathbb{E}[\cos^{2}
          \Theta]$, with $R$ and $\Theta$ independent.
        feedback: >
          His $R^{2} = -\ln U_1$ has mean $1$, and $\mathbb{E}[\cos^{2}\Theta]
          = 1/2$, so $\operatorname{Var}(Z_1) = 1 \times 1/2 = 0.5$. The
          right version has $\mathbb{E}[R^{2}] = 2$ and variance $1$. His
          draws are normal with standard deviation $0.71$ — wrong in a way no
          histogram's shape will flag.
      - ask: >
          The Marsaglia polar variant avoids the trig calls: draw $(V_1,
          V_2)$ uniform on the square $[-1, 1]^{2}$ and keep it only if it
          lands inside the unit disc. What fraction of points is kept, to
          four decimal places?
        expects: "0.7854"
        tolerance: 0.0005
        feedback: >
          Disc area $\pi$ over square area $4$: $\pi/4 \approx 0.7854$. A kept
          point's direction is a uniform angle, so $V_1/\sqrt{S}$ and
          $V_2/\sqrt{S}$, with $S = V_1^{2} + V_2^{2}$, are its cosine and
          sine for free — a rejection loop traded for two trig calls.
      - teach: >
          Said in an interview: "$\Phi^{-1}$ has no closed form, so take two
          normals at once. Their joint density is rotation-invariant, so the
          angle is uniform and $R^{2}$ is exponential with mean $2$, which is
          $-2\ln U_1$ by inverse transform. Then $Z_1 = R\cos(2\pi U_2)$ and
          $Z_2 = R\sin(2\pi U_2)$."

  - node: quant-statistics.simulation.correlated-normals
    hook: >
      "Simulate two assets with correlation $\rho$" is a common desk-adjacent
      ask, and the one-line answer needs to come with the reason it has
      exactly that variance, not just the formula.
    explanation: >
      Start from two independent standard normals, which you already know
      how to produce, and build a correlated pair by mixing rather than
      transforming each one separately: keep the first coordinate as $Z_1$
      itself, and set the second to $\rho Z_1+\sqrt{1-\rho^{2}}Z_2$. Checking
      the two moments that matter confirms this does what's promised: the
      second coordinate's variance is
      $\rho^{2}\operatorname{Var}(Z_1)+(1-\rho^{2})\operatorname{Var}(Z_2)
      =\rho^{2}+(1-\rho^{2})=1$ exactly, using independence to drop the
      cross term, and its covariance with $Z_1$ is $\rho$, since the
      $\sqrt{1-\rho^{2}}Z_2$ piece contributes nothing to that covariance.

      The $d$-dimensional version is the same idea done with matrices: factor
      the target covariance $\Sigma$ as $LL^{T}$ with $L$ lower-triangular —
      guaranteed to exist because a covariance matrix is always positive
      semidefinite — and set $X=\mu+LZ$ for a vector $Z$ of independent
      standard normals. Then $\operatorname{Cov}(X)=L\operatorname{Cov}(Z)
      L^{T}=LL^{T}=\Sigma$ by the same bilinearity argument as the
      two-dimensional case, just carried in matrix form; the formula above
      is exactly the $2\times2$ Cholesky factor written out by hand.

      One wrinkle to flag: an estimated correlation or covariance matrix from
      real data can come back slightly non-positive-semidefinite from noise
      or missing data, in which case Cholesky fails outright — the fix is an
      eigendecomposition $\Sigma=Q\Lambda Q^{T}$, clipping negative
      eigenvalues to zero and taking $L=Q\Lambda^{1/2}$ as a repaired square
      root.
    worked: >
      Take $\rho=0.6$, and suppose a draw gives $Z_1=1$, $Z_2=2$. The
      correlated pair's second coordinate is
      $0.6\times1+\sqrt{1-0.36}\times2=0.6+0.8\times2=0.6+1.6=2.2$, so the
      simulated pair is $(1, 2.2)$ — equivalently the $2\times2$ Cholesky
      factor with entries $0.6$ and $0.8=\sqrt{1-0.6^{2}}$ applied to
      $(1,2)$.
    interview: >
      "Simulate two correlated normal random variables, or a
      $d$-dimensional multivariate normal, given only a standard normal
      generator" is answered with Cholesky named by name; a common follow-up
      asks what happens with a noisy, non-PSD covariance estimate.
    pitfalls: >
      Applying Cholesky to a matrix that isn't actually positive
      semidefinite, common with a noisy sample covariance, gives a silent
      failure or garbage output instead of the eigenvalue-clipping fix.
      Building the pair as $\rho Z_1+Z_2$ without the $\sqrt{1-\rho^{2}}$
      scaling gives the second coordinate variance $\rho^{2}+1$, not $1$, so
      the marginal law is no longer standard normal.
    recap: >
      A correlated normal vector is an independent standard normal vector
      pushed through the Cholesky factor of the target covariance,
      $\Sigma=LL^{T}$; in two dimensions that's exactly
      $\rho Z_1+\sqrt{1-\rho^{2}}Z_2$.
    dialogue:
      - part: Two stocks that move together
        teach: >
          You simulate the standardised daily returns of two stocks, each
          $N(0,1)$, with correlation $0.28$. Box–Muller hands you independent
          standard normals $Z_1, Z_2$. Take $X = Z_1$ for the first stock. A
          colleague proposes $Y = 0.28 Z_1 + 0.72 Z_2$ for the second, weights
          summing to $1$ like a portfolio.
      - ask: >
          What is $\operatorname{Var}(Y)$ under his recipe?
        expects: "0.5968"
        tolerance: 0.0001
        hint: >
          $Z_1$ and $Z_2$ are independent, so no cross term.
        feedback: >
          $0.28^{2} + 0.72^{2} = 0.0784 + 0.5184 = 0.5968$. Weights summing to
          $1$ preserve the mean, but variances add as squares, so the second
          stock comes out with standard deviation about $0.77$, not $1$.
      - ask: >
          What correlation does his pair actually have, to four decimal
          places?
        expects: "0.3624"
        tolerance: 0.0005
        hint: >
          $\operatorname{Cov}(X, Y) = 0.28$; divide by both standard
          deviations.
        feedback: >
          $\operatorname{Cov}(Z_1, Y) = 0.28\operatorname{Var}(Z_1) = 0.28$, so
          the correlation is $0.28/\sqrt{0.5968} \approx 0.28/0.7725 \approx
          0.3624$. Shrinking $Y$'s variance inflated the correlation: both
          targets missed.
      - reflect: >
          Write $Y = aZ_1 + bZ_2$. Which two conditions pin down $a$ and $b$,
          and what are they for correlation $0.28$?
        hint: >
          Compute $\operatorname{Cov}(Z_1, Y)$ and $\operatorname{Var}(Y)$ in
          terms of $a$ and $b$.
        answer: >
          $\operatorname{Cov}(Z_1, Y) = a$, which must be $0.28$, and
          $\operatorname{Var}(Y) = a^{2} + b^{2}$, which must be $1$. So
          $a = 0.28$ and $b = \sqrt{1 - 0.0784} = 0.96$. The coefficient on
          $Z_1$ sets the correlation; the coefficient on $Z_2$ tops the
          variance back up to $1$ with fresh, independent noise.

      - part: The two-dimensional recipe
        teach: >
          In general, $(Z_1,\; \rho Z_1 + \sqrt{1 - \rho^{2}}\,Z_2)$ is a
          standard bivariate normal pair with correlation $\rho$: the second
          coordinate has variance $\rho^{2} + (1 - \rho^{2}) = 1$ and
          covariance $\rho$ with the first. It is genuinely normal, not just
          correlated, because it is a linear map of independent normals.
      - ask: >
          A draw gives $Z_1 = 1.5$ and $Z_2 = -0.5$. What is the second
          stock's return $Y$?
        expects: "-0.06"
        feedback: >
          $0.28 \times 1.5 + 0.96 \times (-0.5) = 0.42 - 0.48 = -0.06$. The
          first stock jumped $1.5$ standard deviations; the second, only
          mildly tied to it, barely moved.

      - part: More than two assets
        ask: >
          Now two factors with covariance matrix rows $(9, 6)$ and
          $(6, 20)$. You look for a lower-triangular $L$ with rows $(3, 0)$
          and $(b, c)$ so that $X = LZ$ has covariance $LL^{T}$ equal to the
          target. The off-diagonal entry of $LL^{T}$ is $3b$. What is $b$?
        expects: "2"
        feedback: >
          $3b = 6$, so $b = 2$. The first row already gives
          $\operatorname{Var}(X_1) = 3^{2} = 9$.
      - ask: >
          The bottom-right entry of $LL^{T}$ is $b^{2} + c^{2}$. What is $c$?
        expects: "4"
        feedback: >
          $4 + c^{2} = 20$, so $c = 4$. Then $X_1 = 3Z_1$ and
          $X_2 = 2Z_1 + 4Z_2$: variance $4 + 16 = 20$, covariance $3 \times 2
          = 6$. You solved for $L$ one entry at a time, top-left to
          bottom-right.
      - teach: >
          That is the Cholesky factorisation. To draw $X \sim N(\mu, \Sigma)$
          in $d$ dimensions, factor $\Sigma = LL^{T}$ with $L$ lower
          triangular and set $X = \mu + LZ$ for a vector $Z$ of independent
          standard normals. The factor exists because a covariance matrix is
          positive semidefinite. The two-dimensional recipe is the Cholesky
          factor of the correlation matrix with rows $(1, \rho)$ and
          $(\rho, 1)$: rows $(1, 0)$ and $(\rho, \sqrt{1 - \rho^{2}})$.
      - ask: >
          Why does $X = \mu + LZ$ have covariance $LL^{T}$?
        choices:
          - text: >
              Because $L$ is lower triangular.
            feedback: >
              Triangularity makes $L$ cheap to compute and to apply, but any
              $A$ with $AA^{T} = \Sigma$ works, the symmetric square root
              included. The covariance identity does not care about shape.
          - text: >
              $\operatorname{Cov}(LZ) = L\operatorname{Cov}(Z)L^{T} = L I L^{T}
              = LL^{T}$.
            correct: true
            feedback: >
              Covariance is bilinear, and independent standard normals have
              identity covariance. Adding $\mu$ shifts the mean and leaves the
              covariance alone.
          - text: >
              Each $X_i$ has variance equal to the square of the $i$-th
              diagonal entry of $L$.
            feedback: >
              In your factor $X_2 = 2Z_1 + 4Z_2$ has variance $20$, not
              $4^{2} = 16$. Every entry of the row contributes, squared and
              summed.
        feedback: >
          Mixing independent noise through any square root of $\Sigma$
          reproduces $\Sigma$; Cholesky is the cheapest square root to find.

      - part: When the matrix will not factor
        ask: >
          A desk's estimated correlation matrix for assets A, B, C has
          A–B $0.9$, A–C $0.9$ and B–C $-0.5$, ones on the diagonal. Cholesky
          crashes. What variance does this matrix assign to the position
          "long A, short B, short C", weights $(1, -1, -1)$?
        expects: "-1.6"
        hint: >
          $w^{T}\Sigma w$: the three variances plus twice each covariance times
          the two weights.
        feedback: >
          $1 + 1 + 1 + 2(1)(-1)(0.9) + 2(1)(-1)(0.9) + 2(-1)(-1)(-0.5) = 3 -
          1.8 - 1.8 - 1 = -1.6$. A negative variance: the matrix is not
          positive semidefinite, no real distribution has it, and no $L$ can
          exist. If A tracks both B and C closely, B and C cannot move
          against each other.
      - ask: >
          How do you repair the matrix so you can simulate?
        choices:
          - text: >
              Set the offending correlation, B–C, to $0$.
            feedback: >
              The matrix with B–C $= 0$ is still not positive semidefinite:
              its smallest eigenvalue is about $-0.27$. Editing one entry by
              hand rarely lands inside the valid set.
          - text: >
              Eigendecompose $\Sigma = Q\Lambda Q^{T}$, clip negative
              eigenvalues to $0$, and use $L = Q\Lambda^{1/2}$.
            correct: true
            feedback: >
              Clipping removes exactly the impossible directions — here one
              eigenvalue of about $-0.55$ — and $L L^{T} = Q\Lambda Q^{T}$ is a
              valid covariance close to the estimate. $L$ is no longer
              triangular, and it does not need to be.
          - text: >
              Run Cholesky anyway, taking the absolute value whenever it needs
              the square root of a negative number.
            feedback: >
              Then $LL^{T}$ is no longer the matrix you factored, and the
              simulated correlations are something nobody chose. The input
              was impossible, and patching the arithmetic hides that.
        feedback: >
          Noisy or pairwise-estimated correlation matrices often come back
          slightly non-positive-semidefinite. Clip the eigenvalues, not the
          entries.
      - teach: >
          Said in an interview: "Factor $\Sigma = LL^{T}$ by Cholesky and set
          $X = \mu + LZ$; the covariance is $L I L^{T} = \Sigma$. For two
          variables that is $\rho Z_1 + \sqrt{1 - \rho^{2}}\,Z_2$. If the
          estimate is not positive semidefinite, clip its negative
          eigenvalues first."

  - node: quant-statistics.simulation.bootstrap
    hook: >
      "You have one sample and a statistic — how do you get its standard
      error without a formula" is answered by the bootstrap, and the
      interview wants the substitution principle stated precisely: resample
      the data itself in place of the unknown population.
    explanation: >
      You're stuck because the sampling distribution of
      $\hat{\theta}=T(X_1,\ldots,X_n)$ depends on the true, unknown $F$, and
      you only get to see it once. The bootstrap's move: since the empirical
      distribution $\hat{F}_n$ — each observed value gets mass $1/n$ — is your
      best available stand-in for $F$, simulate from $\hat{F}_n$ instead, and
      use Monte Carlo, exactly the machinery already built in this unit, to
      see how $T$ behaves under repeated sampling.

      Sampling from $\hat{F}_n$ concretely means resampling the actual data
      with replacement: draw $n$ values from the observed
      $X_1,\ldots,X_n$, allowing repeats, compute the statistic on that
      resample, and repeat the whole thing $B$ times to get replicates
      $\hat{\theta}_1^{*},\ldots,\hat{\theta}_B^{*}$. Their spread stands in
      for $\hat{\theta}$'s true sampling distribution — the sample standard
      deviation of the replicates estimates the standard error, and their
      $2.5\%$/$97.5\%$ percentiles give an interval, with no variance formula
      ever required.

      Keep the two sources of error separate: $B$ controls only how
      precisely you've approximated the resampling distribution, pure
      simulation noise, driven down cheaply by taking $B$ large since
      resampling is fast — while the real statistical uncertainty, how far
      $\hat{\theta}$ itself sits from the true $\theta$, is fixed by $n$, and
      no amount of resampling manufactures information the original $n$
      observations didn't contain.
    worked: >
      Data $\{2,4,6,8,10\}$, $n=5$, sample mean $6$. For the mean
      specifically, the bootstrap variance has a clean closed form: it
      equals the empirical variance, dividing by $n$, divided again by $n$.
      The empirical variance here is $(16+4+0+4+16)/5=8$, so the bootstrap
      standard error is $\sqrt{8/5}=\sqrt{1.6}\approx1.265$ — matching, up to
      the $n$ versus $n-1$ divisor convention, the ordinary standard-error
      formula, confirming the resampling machinery reproduces a known answer
      before trusting it on a statistic with no formula at all.
    interview: >
      "How would you get a confidence interval for an estimator with no
      known variance formula" is answered by naming the resample-with-
      replacement procedure and the substitution of $\hat{F}_n$ for $F$
      explicitly; a follow-up on what $B$ controls is answered by naming it
      as pure simulation noise, separate from $n$'s statistical noise.
    pitfalls: >
      Resampling without replacement just reproduces the original sample as
      a permutation and manufactures zero new information — "with
      replacement" is not optional, it's the entire mechanism. Believing a
      larger $B$ fixes an inherently small or biased sample confuses
      simulation noise, which $B$ controls, with statistical precision,
      which $n$ alone determines.
    recap: >
      The bootstrap resamples the observed data with replacement in place of
      drawing from the unknown true distribution, and the scatter of the
      resulting replicated statistics estimates its real sampling error.
    dialogue:
      - part: One sample, one median, no formula
        teach: >
          Five fills on a new venue took $3, 7, 8, 12$ and $30$ milliseconds.
          The median is $8$. The desk asks how much that $8$ would move if you
          collected five more fills and recomputed it.
      - ask: >
          If you had unlimited access to the venue, how would you answer with
          Monte Carlo?
        choices:
          - text: >
              Take the standard deviation of the five times and divide by
              $\sqrt{5}$.
            feedback: >
              That is the standard error of the *mean*. The median has no such
              formula, and with a $30$ in the data the two behave very
              differently: the mean chases the $30$, the median ignores it.
          - text: >
              Recompute the median of the same five times many times and look
              at the spread.
            feedback: >
              The same five numbers give the same median every time: zero
              spread. Variability comes from drawing new samples, not from
              recomputing on the old one.
          - text: >
              Collect many fresh samples of five fills, take each one's median,
              and use the spread of those medians.
            correct: true
            feedback: >
              That simulates the median's sampling distribution directly: draw
              from the true fill-time law $F$, apply the statistic, repeat.
        feedback: >
          The answer is a Monte Carlo over samples drawn from $F$. The catch
          is that you have no $F$ to draw from — only five numbers.
      - reflect: >
          You cannot draw fresh fills from $F$. Using only the five numbers you
          have, what distribution could you draw from in its place, and what
          does "a fresh sample of five" from it look like?
        hint: >
          What is the most natural distribution that the five observations
          themselves define?
        answer: >
          The empirical distribution $\hat{F}_5$, which puts mass $1/5$ on each
          observed value. One draw from it picks one of the five times at
          random; a sample of five is five such picks, independently — so with
          replacement, and repeats are allowed. $\hat{F}_5$ is the best
          available estimate of $F$, so the spread of medians computed on
          these samples estimates the spread you could not observe.

      - part: Resampling the sample
        teach: >
          That is the bootstrap. Given an iid sample $X_1, \dots, X_n$ and a
          statistic $\hat{\theta} = T(X_1, \dots, X_n)$, substitute the
          empirical distribution $\hat{F}_n$ for the unknown $F$: draw $B$
          resamples of size $n$ with replacement, compute
          $\hat{\theta}^{*}_b$ on each, and read the sampling distribution off
          the replicates. Their standard deviation estimates the standard
          error of $\hat{\theta}$, and their $2.5\%$ and $97.5\%$ quantiles
          give a percentile interval.
      - ask: >
          A colleague resamples the five fill times *without* replacement.
          What does he get?
        choices:
          - text: >
              The same thing with less noise, since no value is double-counted.
            feedback: >
              Five draws without replacement from five values use every value
              exactly once. There is no noise left at all, which is the
              problem.
          - text: >
              The original five in a shuffled order, so every replicated median
              is $8$.
            correct: true
            feedback: >
              A permutation of the data has the same median, so the bootstrap
              standard error comes out $0$. Drawing with replacement is the
              mechanism, not a detail.
          - text: >
              A smaller sample each time, which overstates the variability.
            feedback: >
              Each resample still has five values; without replacement they
              are forced to be the original five. The variability vanishes
              rather than growing.
        feedback: >
          With replacement, some times repeat and some go missing, and that
          is exactly the sampling variability you wanted to imitate.
      - ask: >
          How many equally likely ordered resamples of size $5$ can be drawn
          from the five fill times?
        expects: "3125"
        feedback: >
          Each of the $5$ positions takes any of the $5$ values: $5^{5} =
          3125$. The bootstrap distribution is a definite, finite
          distribution over these; $B$ random resamples are a Monte Carlo
          approximation of it, which is why $B$ of $1000$ to $10000$ suffices.
      - ask: >
          How many different values can a resampled median take?
        expects: "5"
        hint: >
          The median of five numbers is one of the five.
        feedback: >
          Every resample consists of the observed times, and its median is
          its third-smallest entry, so the replicated median is always one of
          $3, 7, 8, 12, 30$. With $n = 5$ the bootstrap distribution of the
          median is a lumpy five-point law, and a percentile interval's
          endpoints are data points.

      - part: Checking it on a mean
        ask: >
          Test the machine where you know the answer. Data $\{4, 10\}$,
          statistic the mean. List all four ordered resamples and their means.
          What is the standard deviation of those four means, to four decimal
          places?
        expects: "2.1213"
        tolerance: 0.0005
        hint: >
          The resamples are $(4,4), (4,10), (10,4), (10,10)$.
        feedback: >
          The means are $4, 7, 7, 10$, centred at $7$, with variance
          $(9 + 0 + 0 + 9)/4 = 4.5$ and standard deviation $\sqrt{4.5}
          \approx 2.1213$. The empirical variance of the data is $9$ (dividing
          by $n$), and $9/2 = 4.5$: the bootstrap reproduced $\hat{\sigma}^{2}/n$.
      - ask: >
          For a mean, the bootstrap standard error with $B \to \infty$ is
          $\sqrt{\hat{\sigma}^{2}/n}$, with $\hat{\sigma}^{2}$ the empirical
          variance dividing by $n$. What is it for the mean of the five fill
          times, to four decimal places?
        expects: "4.2237"
        tolerance: 0.0005
        hint: >
          The mean is $12$; square the deviations from it.
        feedback: >
          Deviations $-9, -5, -4, 0, 18$ square to $81, 25, 16, 0, 324$,
          summing to $446$. $\hat{\sigma}^{2} = 446/5 = 89.2$, divided by $5$
          is $17.84$, and $\sqrt{17.84} \approx 4.2237$. For the mean the
          bootstrap only confirms a formula; for the median it supplies the
          answer no formula gives.

      - part: What resampling cannot buy
        ask: >
          The bootstrap standard error of the median comes out large, and the
          desk wants it smaller. What helps?
        choices:
          - text: >
              Raising $B$ from $2000$ to $200000$ resamples.
            feedback: >
              More resamples pin down the bootstrap distribution of these five
              numbers more precisely. That distribution is wide because five
              fills say little about $F$, and it stays wide.
          - text: >
              Collecting more fills, since the statistical error is set by
              $n$.
            correct: true
            feedback: >
              $B$ controls only the simulation noise in approximating the
              bootstrap distribution. The width of that distribution is the
              statistical uncertainty, and only more data narrows it.
          - text: >
              Resampling ten values each time instead of five.
            feedback: >
              Resamples of size $10$ imitate a sample of $10$, which you do
              not have, and report a standard error for data you never
              collected. The resample size must match $n$.
        feedback: >
          Two errors, two dials: $B$ drives down simulation noise cheaply, and
          only $n$ moves the statistical error. Resampling manufactures no
          information the sample did not contain.
      - teach: >
          Said in an interview: "Treat the sample as the population. Resample
          $n$ points with replacement, recompute the statistic, repeat a few
          thousand times; the standard deviation of the replicates is the
          standard error, and their $2.5\%$ and $97.5\%$ quantiles are an
          interval. $B$ controls simulation noise, $n$ controls everything
          else."

  - node: quant-statistics.simulation.bootstrap-caveats
    hook: >
      Interviewers who've seen the bootstrap taught once love asking "does
      this always work," and the sample maximum is the fastest concrete
      counterexample to have ready.
    explanation: >
      The bootstrap's validity rests on the statistic being a smooth
      functional of the underlying distribution — small changes to $F$
      produce small, well-behaved changes to $T(F)$ — which holds for means,
      variances, correlations and regression coefficients, the bread and
      butter of applied statistics.

      It breaks specifically when the statistic is governed by the extreme
      edge of the data rather than the bulk, because $\hat{F}_n$, unlike the
      true $F$, has hard edges exactly at the observed min and max and
      nothing beyond them. The sample maximum makes this concrete: a
      resample reproduces the true observed maximum with probability
      $1-(1-1/n)^{n}$, converging to $1-1/e\approx0.632$ — so instead of a
      smooth spread around the truth, the bootstrap distribution of the
      maximum carries a large literal spike sitting exactly at the one
      number already observed, and never resembles the true variability of
      an extreme value.

      Two further, unrelated failure modes are worth having ready rather
      than conflating with the tail issue: resampling with replacement
      treats every draw as independent, so on time-series or otherwise
      dependent data it silently destroys the serial correlation that made
      the original data informative — the fix is a block bootstrap,
      resampling contiguous chunks instead of single points — and no version
      of resampling can undo a systematically biased original sample;
      $\hat{F}_n$ faithfully reproduces whatever survivorship or look-ahead
      contamination is already in the data handed to it.
    worked: >
      Take $n=4$ observations. A single bootstrap resample of size $4$
      misses the true maximum entirely with probability
      $(1-1/4)^{4}=(0.75)^{4}=0.3164$, so it contains the max with
      probability $1-0.3164=0.6836$ — already close to the limiting
      $63.2\%$ even at this tiny $n$, confirming the spike at the observed
      maximum isn't a large-sample artifact.
    interview: >
      "Does the bootstrap work for this statistic" is answered by
      classifying it as a smooth functional or an extreme-value one; "what
      if your data is a time series" is answered by naming the block
      bootstrap directly as the fix for destroyed serial correlation.
    pitfalls: >
      Applying the plain iid bootstrap to time-series data without switching
      to a block bootstrap scrambles the dependence structure the original
      statistic relied on. Expecting the bootstrap to fix a biased sample is
      wrong — it reproduces $\hat{F}_n$ exactly, survivorship bias and all,
      with no mechanism to correct for what was never observed.
    recap: >
      The bootstrap is trustworthy for smooth functionals of $F$ but not for
      extremes — the resampled maximum repeats the one observed maximum
      about $63.2\%$ of the time, a spike no amount of resampling removes.
    dialogue:
      - part: Bootstrapping the largest order
        teach: >
          An exchange caps order size at some unknown $\theta$ lots. Ten
          observed orders, sizes drawn from a continuous law on $(0, \theta)$,
          have largest size $940$, and you estimate $\theta$ by that sample
          maximum. To attach an error bar, you bootstrap the maximum: resample
          the ten sizes with replacement and take each resample's largest.
      - ask: >
          What is the largest value a bootstrap replicate of the maximum can
          ever take?
        expects: "940"
        feedback: >
          A resample is built from the ten observed sizes, so its maximum is
          at most $940$. The true cap $\theta$ is above $940$, and no
          replicate will ever look there.
      - ask: >
          What is the probability that a single resample of size $10$
          contains the $940$, to four decimal places?
        expects: "0.6513"
        tolerance: 0.0005
        hint: >
          Find the chance that all ten picks miss it.
        feedback: >
          Each pick misses it with probability $0.9$, so all ten miss with
          probability $0.9^{10} \approx 0.3487$, and the resample contains it
          with probability $1 - 0.3487 = 0.6513$. Whenever it does, the
          replicate equals $940$ exactly.
      - ask: >
          So about $65\%$ of the replicates are exactly $940$ and none exceed
          it. How does that compare with the true sampling distribution of the
          maximum of ten fresh orders?
        choices:
          - text: >
              It is a fair approximation, and a larger $B$ makes it a good one.
            feedback: >
              More resamples reproduce the same picture more precisely: the
              spike at $940$ and the empty region above it are features of
              the bootstrap distribution itself, not of simulation noise.
          - text: >
              It overstates the uncertainty, since a third of resamples miss
              the top order and come out too low.
            feedback: >
              The real fault runs the other way. The true maximum has no atom
              anywhere and spreads up toward $\theta$; the bootstrap piles mass
              on one point and assigns none to values above it.
          - text: >
              It looks nothing like it: the truth is continuous with no atom,
              while the bootstrap has a $65\%$ spike at $940$ and nothing above.
            correct: true
            feedback: >
              A fresh sample's maximum equals exactly $940$ with probability
              zero. The bootstrap's version of "how the maximum varies" is a
              spike at the one number already seen.
        feedback: >
          The replicates of the maximum cannot mimic how a new sample's
          maximum would fall, because they are stuck inside the observed
          range.
      - ask: >
          With $n$ observations the chance of containing the observed maximum
          is $1 - (1 - 1/n)^{n}$. What does it tend to as $n \to \infty$, to
          four decimal places?
        expects: "0.6321"
        tolerance: 0.0005
        hint: >
          $(1 - 1/n)^{n} \to e^{-1}$.
        feedback: >
          $1 - e^{-1} \approx 1 - 0.3679 = 0.6321$. The spike does not shrink
          with more data: at $n = 10$ it is $65.1\%$, at $n = 10^{6}$ it is
          $63.2\%$. This is not a small-sample problem.
      - reflect: >
          The same resampling recovered the standard error of a mean
          perfectly. What does the maximum depend on that the empirical
          distribution gets wrong, and why does the mean escape?
        hint: >
          Where does $\hat{F}_n$ differ most from the true $F$?
        answer: >
          The maximum is governed entirely by the edge of the support, and
          that is exactly where $\hat{F}_n$ is worst: it has a hard boundary
          at the observed maximum and zero mass beyond, while the true $F$
          has mass right up to $\theta$. The mean depends on every observation
          a little and on none of them much, so the small differences between
          $\hat{F}_n$ and $F$ move it only slightly. The bootstrap works when
          the statistic is a smooth function of the distribution, and fails
          when one edge point decides it.

      - part: Smooth statistics and edge statistics
        teach: >
          The bootstrap is consistent when the statistic is a smooth
          functional of the distribution — means, variances, correlations,
          regression coefficients, quantiles at points of positive density. It
          fails when the statistic is governed by the edge of the support or
          the extreme tail, as the maximum is. Edges are not its only weak
          spot, as the next two situations show.
      - ask: >
          In any bootstrap with large $n$, *every* observation is missing from
          about $37\%$ of resamples and present in about $63\%$. Why does that
          not wreck the bootstrap of a mean?
        choices:
          - text: >
              The missing observations average out because $B$ is large.
            feedback: >
              $B$ is not the reason: even the exact bootstrap distribution,
              $B = \infty$, has every point missing $37\%$ of the time. The
              reason is how much each point matters to the statistic.
          - text: >
              Each observation moves the mean by only $1/n$ of its size, so
              whether a particular point appears barely changes the replicate.
            correct: true
            feedback: >
              The mean's replicate is a sum of many small contributions, and
              their random inclusion produces exactly the sampling variance you
              wanted. For the maximum, one point is the whole statistic.
          - text: >
              It does wreck it; the bootstrap standard error of a mean is
              biased upward by $37\%$.
            feedback: >
              For the mean the bootstrap reproduces $\hat{\sigma}^{2}/n$, the
              plug-in standard error. Random inclusion is the mechanism, not a
              defect.
        feedback: >
          Random inclusion of each point is the bootstrap's engine. It is
          harmless when no single point dominates the statistic, and fatal
          when one does.

      - part: Days that are not independent
        ask: >
          A price feed updates every two hours but is logged hourly, so $200$
          readings come in $100$ identical consecutive pairs. You run the iid
          bootstrap on the mean of the $200$ readings. By what factor does it
          understate the true standard error, to four decimal places?
        expects: "1.4142"
        tolerance: 0.0005
        hint: >
          How many independent values are really in the mean?
        feedback: >
          The mean of $200$ readings is the mean of $100$ independent values,
          with standard error $\sigma/\sqrt{100}$. The iid bootstrap scatters
          the $200$ readings independently and reports about
          $\sigma/\sqrt{200}$. The ratio is $\sqrt{2} \approx 1.4142$.
      - ask: >
          What repairs the bootstrap for a dependent series?
        choices:
          - text: >
              Resample individual readings as before, then sort each resample
              back into time order.
            feedback: >
              Sorting by timestamp orders the points but does not restore which
              readings were neighbours. The pairs are already broken when the
              points are drawn one at a time.
          - text: >
              Resample blocks of consecutive readings, so that dependence within
              each block survives.
            correct: true
            feedback: >
              That is the block bootstrap. Blocks at least as long as the
              dependence keep neighbours together; here, blocks of two aligned
              with the pairs make it exact.
          - text: >
              Increase $B$ until the standard error stabilises.
            feedback: >
              It stabilises at the wrong value. $B$ removes simulation noise;
              the bias comes from treating dependent readings as independent.
        feedback: >
          Resampling single points iid destroys serial correlation. On time
          series, resample blocks.

      - part: Faithful to a biased sample
        ask: >
          A database lists $60$ hedge funds, all still running after ten
          years. The bootstrap $95\%$ interval for their mean annual return is
          $6\%$ to $9\%$. What does it tell you about the mean return of funds
          like these at launch?
        choices:
          - text: >
              It lies between $6\%$ and $9\%$ with about $95\%$ confidence.
            feedback: >
              The funds that closed were never in the data, so $\hat{F}_n$ is
              the law of survivors. The interval is honest about that law and
              silent about the funds that failed.
          - text: >
              Little: the interval measures sampling noise around the
              survivors' mean, and survivorship bias moves the centre, which no
              resampling can detect.
            correct: true
            feedback: >
              The bootstrap reproduces $\hat{F}_n$ faithfully, bias included.
              Survivorship and look-ahead are problems with what was sampled,
              and resampling only re-reads the same sample.
          - text: >
              The interval is too narrow, and a larger $B$ would widen it to
              cover the truth.
            feedback: >
              $B$ controls only simulation noise. The interval is centred in
              the wrong place, and no number of resamples moves its centre.
        feedback: >
          The bootstrap estimates sampling variability, never sampling bias.
      - teach: >
          Said in an interview: "The bootstrap works for smooth statistics.
          The maximum is the counterexample: a resample contains the observed
          maximum with probability $1 - (1 - 1/n)^{n} \to 63.2\%$ and can
          never exceed it. It also breaks on dependent data, where you use a
          block bootstrap, and it cannot fix a biased sample."

  - node: quant-statistics.simulation.variance-reduction
    hook: >
      "How would you speed up this simulation" almost always means "cut the
      variance per draw," not "run more paths," and the interview wants the
      cost-adjusted argument for why, not just the buzzwords.
    explanation: >
      Since $\operatorname{Var}(\hat{\theta}_n)=\sigma^{2}/n$, halving
      $\sigma^{2}$ and halving $n$ produce the exact same estimator variance
      — so any device that halves $\sigma^{2}$ for less than double the
      per-draw computational cost is a strict win, and one that costs more
      than double is a loss, however cleverly it's marketed. The right
      single number to optimize is variance times cost per sample, never
      variance alone.

      Each standard device earns its keep by recovering some structure the
      naive estimator throws away for free: antithetic variates exploit the
      built-in symmetry of the uniform stream itself; control variates
      exploit a second, correlated quantity whose true mean happens to be
      known exactly; importance sampling exploits knowing in advance roughly
      where in the sample space the payoff actually lives, instead of
      wasting draws elsewhere.

      A fourth option, often the largest win of all though it isn't a named
      technique here: analytically integrating out whatever part of the
      randomness you can in closed form, and simulating only what's left —
      every dimension removed this way costs literally zero variance and
      zero draws, strictly better than any reweighting trick applied to it.
    worked: >
      A baseline estimator has $\sigma_0^{2}=1$, cost $1$ per sample, and a
      budget for $1200$ unit-cost samples, giving variance
      $1/1200\approx0.000833$. A proposed trick halves the variance to
      $0.5$ but triples the per-sample cost to $3$; the same budget now buys
      only $1200/3=400$ samples, giving variance $0.5/400=0.00125$ — worse
      than the baseline, despite genuinely halving the per-draw variance,
      because the cost tripled faster than the variance fell.
    interview: >
      "How would you make this simulation more efficient" wants variance
      times cost named as the actual figure of merit within the first
      sentence, followed by whichever of the three structural tricks fits
      the payoff described.
    pitfalls: >
      Reporting "I halved the variance" as self-evidently good, without
      stating the change in per-sample cost, ignores that a trick can lower
      variance and still lose on a fixed budget. Reaching for a
      variance-reduction trick before checking whether part of the
      randomness can just be integrated out analytically skips the usually
      biggest free win.
    recap: >
      The right figure of merit is variance times cost per sample, not
      variance alone, and antithetic variates, control variates and
      importance sampling each recover a different piece of structure the
      naive estimator throws away.
    dialogue:
      - part: Two ways to halve an error bar
        teach: >
          An overnight pricing run of $10000$ paths takes one hour and reports
          a standard error of $0.04$. Risk wants $0.02$ by the morning.
      - ask: >
          By brute force, how many paths does a standard error of $0.02$
          take?
        expects: "40000"
        hint: >
          The standard error is $\sigma/\sqrt{n}$.
        feedback: >
          Half the error needs four times the paths: $40000$, four hours of
          compute. Doubling $n$ would only have reached $0.04/\sqrt{2} \approx
          0.028$.
      - ask: >
          The other lever is $\sigma$. Keeping $10000$ paths, by what factor
          must the per-path *variance* fall to reach $0.02$?
        expects: "4"
        feedback: >
          Halving $\sigma/\sqrt{n}$ at fixed $n$ means halving $\sigma$, which
          divides $\sigma^{2}$ by $4$. Cutting the per-path variance by $4$ is
          worth exactly quadrupling $n$.
      - ask: >
          A colleague's trick cuts the per-path variance by that factor of
          $4$, but each path now takes three times as long. Should you use
          it?
        choices:
          - text: >
              No: each path is three times slower, so the run gets slower.
            feedback: >
              Slower per path, but you need far fewer paths. Compare total
              time to reach $0.02$: $10000$ slow paths take $3$ hours, against
              $4$ hours of brute force.
          - text: >
              Yes: $10000$ paths at triple cost is $3$ hours, against $4$ for
              brute force.
            correct: true
            feedback: >
              The trick wins, but by $25\%$, not by the factor of $4$ its
              variance cut suggests. The cost per path ate most of the gain.
          - text: >
              Yes: it cuts the variance four times, so it is four times faster.
            feedback: >
              That ignores the tripled cost per path. Four times less variance
              at three times the cost is a net gain of $4/3$, not $4$.
        feedback: >
          A variance cut is worth exactly as much as the extra paths it
          replaces, minus whatever it adds to the cost of each one.
      - reflect: >
          You will compare many schemes like this. What single number,
          built from the per-path variance and the per-path cost, decides
          which is better on a fixed compute budget — and why that one?
        hint: >
          With budget $C$ and cost $c$ per path, how many paths do you get,
          and what is the estimator's variance?
        answer: >
          Variance times cost per path. A budget $C$ buys $n = C/c$ paths, so
          the estimator's variance is $\sigma^{2}/n = \sigma^{2}c/C$:
          proportional to $\sigma^{2}c$ whatever the budget. The baseline here
          scores $1 \times 1$ in relative units and the trick
          $\tfrac{1}{4} \times 3 = 0.75$, the same $25\%$ saving. A scheme
          that lowers $\sigma^{2}$ but raises $\sigma^{2}c$ is a loss.

      - part: Variance times cost
        teach: >
          That is the whole economics of variance reduction. Since
          $\operatorname{Var}(\hat{\theta}_n) = \sigma^{2}/n$, halving the
          variance of one draw is worth exactly doubling $n$ — and it is
          usually far cheaper. The figure of merit is $\sigma^{2}$ times the
          cost per sample; never quote a variance reduction without the cost
          that bought it.
      - ask: >
          The baseline has per-path variance $2$ at cost $1$. Scheme A has
          variance $0.8$ at cost $1.5$. On the same budget, what is the ratio
          of A's estimator variance to the baseline's?
        expects: "0.6"
        feedback: >
          Merits: $0.8 \times 1.5 = 1.2$ against $2 \times 1 = 2$, a ratio of
          $1.2/2 = 0.6$. A gives $40\%$ less variance for the same compute, or
          the same error bar in $60\%$ of the time.
      - ask: >
          Scheme B cuts the per-path variance by $99\%$, but each path costs
          $200$ times as much. Against the baseline, it is
        choices:
          - text: >
              a huge win: $99\%$ less variance.
            feedback: >
              $0.01 \times 200 = 2$ against the baseline's $1$. On any fixed
              budget B's estimate has twice the variance.
          - text: >
              twice as bad on a fixed budget.
            correct: true
            feedback: >
              Its merit is $0.01 \times 200 = 2$. A dramatic variance number
              can hide a losing trade; the product tells the truth.
          - text: >
              impossible to judge without knowing the budget.
            feedback: >
              The ratio of estimator variances is $(\sigma^{2}_B c_B)/(\sigma^{2}
              c)$ for every budget, because both runs divide by the same $C$.
              The comparison is scale-free.
        feedback: >
          Variance per draw is half the story; cost per draw is the other
          half.

      - part: Where the cheap wins come from
        ask: >
          You price an option on the *arithmetic* average of a stock path.
          The option on the *geometric* average of the same path has an exact
          closed-form price, and its payoff tracks the arithmetic one
          closely. What structure does that offer?
        choices:
          - text: >
              A quantity strongly correlated with the payoff whose mean is
              known exactly, so its simulated error can be subtracted off.
            correct: true
            feedback: >
              Each path's geometric payoff misses its known mean by an amount
              that tells you how far that path's arithmetic payoff probably
              missed too. That is the idea behind control variates.
          - text: >
              Knowledge of where the payoff lives, so the paths can be steered
              there.
            feedback: >
              That describes importance sampling, which matters when most paths
              pay nothing. Here most paths pay, and the gift is a twin payoff
              with a known price.
          - text: >
              The symmetry of the uniform stream, so each path has a mirror
              image.
            feedback: >
              Mirror paths are available for any payoff; they are antithetic
              variates. The closed-form twin is a different and usually larger
              gift.
        feedback: >
          Each standard device recovers something the naive estimator throws
          away: symmetry (antithetic variates), a correlated quantity with
          known mean (control variates), or where the payoff lives
          (importance sampling).
      - ask: >
          A fourth lever: compute part of the randomness exactly. To estimate
          $\Pr(X + Y > 1.5)$ for independent uniforms, you could simulate both
          and score $0$ or $1$. Instead, given $X = 0.8$, what is the exact
          probability that $Y > 1.5 - X$?
        expects: "0.3"
        feedback: >
          $\Pr(Y > 0.7) = 0.3$. Averaging $\max(0, X - 0.5)$ over simulated
          $X$ instead of $0$-or-$1$ scores has the same mean, $0.125$, with
          per-draw variance about $0.026$ against $0.109$ — four times less, at
          no extra cost. Removing a source of randomness can only remove
          variance, which is why integrating out what you can is often the
          largest win of all.
      - teach: >
          Said in an interview: "The error is $\sigma/\sqrt{n}$, so halving
          the variance is worth doubling the paths. I compare schemes by
          variance times cost per path, then look for structure the naive
          estimator ignores: a symmetry, a correlated quantity with a known
          mean, where the payoff lives, or randomness I can integrate out by
          hand."

  - node: quant-statistics.simulation.antithetic
    hook: >
      Given one uniform draw, getting a second observation almost for free is
      exactly antithetic variates, and the interview trap is a payoff where
      the trick silently makes things worse instead of better.
    explanation: >
      Every simulated output, however complicated its construction, is
      ultimately some function $Y=h(U)$ of the underlying uniform draw — so
      it comes with a free mirror image for the price of one extra function
      call: run $h$ at $1-U$ as well, giving $Y_2=h(1-U)$ with exactly the
      same marginal law as $Y_1=h(U)$, since $1-U$ is uniform too, and
      average the pair.

      The paired average's variance,
      $\operatorname{Var}(A)=\sigma^{2}(1+\rho)/2$ with
      $\rho=\operatorname{Corr}(Y_1,Y_2)$, beats two independent draws
      (which give $\sigma^{2}/2$) exactly when $\rho<0$ — and $\rho<0$ is
      guaranteed whenever $h$ is monotone in $U$, because large $U$ and
      small $1-U$ then push $h(U)$ and $h(1-U)$ to opposite ends of their
      range in lockstep, mechanically inducing negative correlation with no
      extra argument needed.

      The trap is a non-monotone payoff: something large both when $U$ is
      small and when $U$ is large has $Y_1$ and $Y_2$ moving together rather
      than oppositely, so $\rho$ can turn positive — at which point $1+\rho$
      exceeds $1$, and pairing the draws actively increases variance
      relative to two independent uniforms, the opposite of the intended
      effect.
    worked: >
      Take $h(u)=u^{3}$, with true mean $\mathbb{E}[U^{3}]=1/4=0.25$. A
      single raw draw at $U=0.2$ gives $h(0.2)=0.008$, wildly off on its
      own. Its antithetic partner at $1-U=0.8$ gives $h(0.8)=0.512$, and the
      paired average is $(0.008+0.512)/2=0.26$ — already within $0.01$ of the
      true $0.25$ from a single pair, because $h$ is monotone increasing and
      the two evaluations land on opposite sides of the mean by
      construction.
    interview: >
      "How would you cut variance with essentially no extra sampling cost"
      is answered by naming antithetic variates and the $U$/$1-U$ pairing;
      the follow-up, "when could this backfire," is answered by naming a
      non-monotone payoff and $\rho$ turning positive.
    pitfalls: >
      Applying antithetics automatically without checking monotonicity is
      risky — a payoff symmetric around some interior point can have
      positive $\rho$, actively hurting. Miscounting the cost as an extra
      full simulation path rather than one extra function evaluation per
      pair overstates the price of the trick.
    recap: >
      Evaluate the payoff at both $U$ and $1-U$ and average: the pair's
      variance is $\sigma^{2}(1+\rho)/2$, a win exactly when the payoff is
      monotone enough to force $\rho$ negative.
    dialogue:
      - part: Two draws, one integral
        teach: >
          An interviewer asks you to estimate $\ln 2 = \int_0^1 \frac{du}{1+u}
          \approx 0.6931$ by simulation, as the average of $h(U) = 1/(1+U)$
          over uniform draws. You are allowed exactly two evaluations of $h$.
      - ask: >
          Two independent uniforms come out $0.1$ and $0.3$. What is your
          estimate, to four decimal places?
        expects: "0.8392"
        tolerance: 0.0005
        feedback: >
          $h(0.1) = 1/1.1 \approx 0.9091$ and $h(0.3) = 1/1.3 \approx 0.7692$,
          averaging $0.8392$ — off by $0.146$.
      - ask: >
          Why is it so far off?
        choices:
          - text: >
              The estimator is biased at $n = 2$.
            feedback: >
              The average of $h(U_i)$ is unbiased at every $n$. Over many runs
              it centres on $\ln 2$; this run was unlucky, not tilted.
          - text: >
              Both uniforms landed in the low half, so both values of the
              decreasing $h$ came out high and nothing offset them.
            correct: true
            feedback: >
              Independent draws are free to cluster on one side, and here they
              did. Their errors added instead of cancelling.
          - text: >
              Two evaluations can never do better than this; only more draws
              help.
            feedback: >
              More draws would help, but you have two. The question is whether
              you can choose the second one more cleverly than at random.
        feedback: >
          With independent draws, a pair on the same side of $1/2$ happens
          half the time.
      - reflect: >
          Keep two evaluations, but build the second uniform from the first
          instead of drawing it fresh. Which choice guarantees the two land on
          opposite sides of $1/2$, and why is the estimate still unbiased?
        hint: >
          Which simple function of a uniform is again uniform?
        answer: >
          Use $1 - U$. If $U$ is low, $1 - U$ is high, so for this decreasing
          $h$ one value lands above the mean and one below, and their errors
          partly cancel. $1 - U$ is itself uniform, so $h(1 - U)$ has exactly
          the same mean as $h(U)$, and the average of the two is unbiased. The
          pair is dependent on purpose.

      - part: Mirrored draws
        teach: >
          That is antithetic variates. Evaluate $Y_1 = h(U)$ and
          $Y_2 = h(1 - U)$ and average, $A = (Y_1 + Y_2)/2$. Both have the
          target mean, and $\operatorname{Var}(A) = \sigma^{2}(1 + \rho)/2$
          with $\rho = \operatorname{Corr}(Y_1, Y_2)$. Two independent draws
          give $\sigma^{2}/2$, so for the same two evaluations the variance is
          multiplied by $1 + \rho$.
      - ask: >
          Take $U = 0.1$ and its mirror $0.9$. What is $A$, to four decimal
          places?
        expects: "0.7177"
        tolerance: 0.0005
        feedback: >
          $h(0.1) \approx 0.9091$ and $h(0.9) = 1/1.9 \approx 0.5263$, so
          $A \approx 0.7177$. The same low first draw that produced $0.8392$
          is now offset by its mirror, and the error falls from $0.146$ to
          $0.025$.
      - ask: >
          Where does $\operatorname{Var}(A) = \sigma^{2}(1 + \rho)/2$ come from?
        choices:
          - text: >
              $\operatorname{Var}(Y_1 + Y_2) = \sigma^{2} + \sigma^{2} +
              2\rho\sigma^{2}$, divided by $4$.
            correct: true
            feedback: >
              It is the variance of a sum with the covariance term kept. The
              whole method exists to make that cross term negative.
          - text: >
              Independence of $Y_1$ and $Y_2$, with a correction for $\rho$.
            feedback: >
              $Y_1$ and $Y_2$ are deliberately dependent: $Y_2$ is a function
              of the same $U$. There is no independence anywhere; the formula
              is the general variance of a sum.
          - text: >
              $\operatorname{Var}(A) = \sigma^{2}(1 - \rho)/2$, so positive
              correlation helps.
            feedback: >
              The cross term is $+2\operatorname{Cov}(Y_1, Y_2)$. Positive
              correlation adds variance; negative correlation removes it.
        feedback: >
          The variance of a pair average falls below $\sigma^{2}/2$ exactly
          when the covariance is negative.
      - ask: >
          For $h(u) = 1/(1+u)$, $\rho \approx -0.94$. Compared with two
          independent draws, the variance is multiplied by what?
        expects: "0.06"
        tolerance: 0.002
        feedback: >
          $1 + \rho \approx 1 - 0.94 = 0.06$. The same accuracy needs about
          $1/0.06 \approx 16$ times fewer evaluations, for the price of
          computing $1 - U$.
      - ask: >
          What guarantees $\rho < 0$ here?
        choices:
          - text: >
              $U$ and $1 - U$ have correlation $-1$, and any function of them
              inherits a negative correlation.
            feedback: >
              Not any function. $h(u) = (u - 1/2)^{2}$ gives $h(U) = h(1 - U)$
              exactly, correlation $+1$. Correlation of the inputs does not
              pass through an arbitrary $h$.
          - text: >
              $h$ is convex.
            feedback: >
              $(u - 1/2)^{2}$ is convex too, and its mirrored values are
              identical. Convexity is not the property that matters.
          - text: >
              $h$ is monotone, so when $h(U)$ is above its mean, $h(1 - U)$ is
              pushed below it.
            correct: true
            feedback: >
              For monotone $h$ the two evaluations move in opposite directions
              as $U$ varies, and the covariance is guaranteed non-positive. A
              payoff monotone in every input inherits the guarantee.
        feedback: >
          Monotone payoffs are where antithetics are safe. Elsewhere, check
          $\rho$ before trusting them.

      - part: When the mirror hurts
        ask: >
          A straddle pays $\lvert S_T - K \rvert$ with $S_T = K + 10Z$ and
          $Z = \Phi^{-1}(U)$. Mirroring $U$ to $1 - U$ sends $Z$ to $-Z$.
          Compared with two independent draws, by what factor does antithetic
          pairing multiply the variance?
        expects: "2"
        hint: >
          What is the payoff at $-Z$?
        feedback: >
          $\lvert -10Z \rvert = \lvert 10Z \rvert$, so $Y_2 = Y_1$ exactly and
          $\rho = 1$. The variance is multiplied by $1 + \rho = 2$: the pair
          carries one draw's information for the cost of two.
      - ask: >
          A colleague argues antithetics can never hurt, because
          $\sigma^{2}(1 + \rho)/2 \le \sigma^{2}$ for every $\rho$. What is
          wrong?
        choices:
          - text: >
              Nothing: the pair average never has more variance than a single
              draw.
            feedback: >
              True, and beside the point. The pair cost two evaluations, and
              two independent evaluations would have given $\sigma^{2}/2$.
          - text: >
              He compares with one draw; the pair costs two evaluations, so the
              benchmark is $\sigma^{2}/2$, and any $\rho > 0$ loses to it.
            correct: true
            feedback: >
              Compared on equal evaluations, the factor is $1 + \rho$. The
              straddle doubles the variance against the honest benchmark.
          - text: >
              The formula is wrong for $\rho > 0$.
            feedback: >
              The formula holds for every $\rho$. The error is in the
              benchmark, not the algebra.
        feedback: >
          Always compare variance at equal cost: antithetics win exactly when
          $\rho < 0$.
      - teach: >
          Said in an interview: "Pair each $U$ with $1 - U$ and average. Both
          halves have the right mean, and the pair's variance is
          $\sigma^{2}(1 + \rho)/2$, so against two independent draws the
          variance is multiplied by $1 + \rho$. Monotone payoffs make $\rho$
          negative; a straddle makes it $+1$."

  - node: quant-statistics.simulation.control-variates
    hook: >
      A correlated quantity whose true mean you already know in closed form
      is the setup control variates want you to spot immediately — most
      desk pricing problems have one sitting in plain sight, a related
      instrument with a known formula.
    explanation: >
      The idea needs one ingredient beyond the target $Y$: a second
      simulated quantity $C$, produced on the same run, whose true mean
      $\mu_C$ is known exactly in closed form. Averaging
      $Y_i - b(C_i-\mu_C)$ instead of $Y_i$ alone stays unbiased for
      $\theta=\mathbb{E}[Y]$ for any constant $b$, since
      $\mathbb{E}[C_i-\mu_C]=0$ subtracts a term with mean zero — the only
      question is how to pick $b$ to help rather than hurt.

      Writing the per-draw variance as a function of $b$,
      $\operatorname{Var}(Y)-2b\operatorname{Cov}(Y,C)+b^{2}
      \operatorname{Var}(C)$, is a plain quadratic, minimized where its
      derivative vanishes: $b^{*}=\operatorname{Cov}(Y,C)/
      \operatorname{Var}(C)$, exactly the least-squares regression slope of
      $Y$ on $C$. Plugging $b^{*}$ back in collapses the variance to
      $\operatorname{Var}(Y)(1-\rho^{2})$ with
      $\rho=\operatorname{Corr}(Y,C)$ — the residual left over after
      regressing out everything $C$ explains about $Y$.

      That $1-\rho^{2}$ factor is the complement of an $R^{2}$, so the
      payoff scales the way regression $R^{2}$ does: a control correlated at
      $\rho=0.9$ removes $81\%$ of the variance, but $\rho=0.5$ removes only
      $25\%$ — weak correlation buys very little, which is why finding a $C$
      both strongly correlated with $Y$ and genuinely known, not just
      estimable, is the entire craft; $b^{*}$ itself is normally estimated
      from a small pilot run.
    worked: >
      Suppose $\operatorname{Var}(Y)=4$, $\mu_C$ is known exactly,
      $\operatorname{Var}(C)=9$, and $\operatorname{Cov}(Y,C)=4.8$. Then
      $b^{*}=4.8/9\approx0.533$, and $\rho=4.8/\sqrt{4\times9}=4.8/6=0.8$.
      The controlled variance is
      $\operatorname{Var}(Y)(1-\rho^{2})=4\times(1-0.64)=4\times0.36=1.44$ —
      down from $4$, a $64\%$ cut, exactly $\rho^{2}$.
    interview: >
      "You're pricing something by simulation and a related, exactly-priced
      instrument moves with it — how do you use that" is a direct
      control-variates prompt; the interviewer wants the regression slope
      $b^{*}$ and the $\rho^{2}$ variance reduction stated, not just "use a
      correlated variable."
    pitfalls: >
      Using a $b$ other than the optimal regression slope keeps the
      estimator unbiased but not minimum-variance, and a poorly chosen $b$
      can even increase it. Picking a $C$ that's merely correlated with $Y$
      but whose "known" mean is itself only estimated breaks the
      unbiasedness argument, which needs $\mu_C$ exact.
    recap: >
      Subtract $b^{*}(C-\mu_C)$ for a correlated, exactly-known-mean
      quantity $C$, at the regression-slope choice
      $b^{*}=\operatorname{Cov}(Y,C)/\operatorname{Var}(C)$, and the
      variance drops by the factor $1-\rho^{2}$.
    dialogue:
      - part: A twin with a known price
        teach: >
          You price a call by simulating the stock's terminal price $S_T$ and
          averaging the payoff $Y$. A short run averages $6.20$ for the
          payoff. On the same paths, $S_T$ averaged $104$ — but the mean of
          $S_T$ is the forward price, known exactly: $100$.
      - ask: >
          What does the $104$ suggest about the $6.20$?
        choices:
          - text: >
              Nothing: $S_T$ is not what you are estimating.
            feedback: >
              It is not the target, but it rode on the same paths. The paths
              you drew ran $4$ high on average, and a call pays more on high
              paths.
          - text: >
              That $6.20$ is probably too high: the paths ran high, and the
              payoff rises with $S_T$.
            correct: true
            feedback: >
              You know exactly how wrong the paths were about $S_T$. Because
              the payoff moves with $S_T$, that known error tells you which
              way, and roughly how far, the payoff estimate is off.
          - text: >
              That $6.20$ is probably too low, since the average was pulled
              toward the forward.
            feedback: >
              Nothing pulled it toward the forward; it overshot the forward by
              $4$. High paths mean high call payoffs, so the error is upward.
        feedback: >
          A quantity with a known mean, simulated alongside the target, reports
          the run's luck.
      - ask: >
          Across paths the payoff rises by about $0.6$ per unit of $S_T$. Using
          that, what corrected estimate would you report?
        expects: "3.8"
        hint: >
          How much payoff do $4$ excess units of $S_T$ account for?
        feedback: >
          The excess $104 - 100 = 4$ accounts for about $0.6 \times 4 = 2.4$
          of payoff, so the corrected estimate is $6.20 - 2.4 = 3.80$.
      - reflect: >
          The correction you just applied was $-0.6\,(\bar{S}_T - 100)$. Why
          can subtracting a term like this never bias the estimate, whatever
          multiplier you use — and how should the multiplier be chosen?
        hint: >
          What is the expected value of $\bar{S}_T - 100$?
        answer: >
          The subtracted term has mean zero, because $100$ is the exact mean
          of $S_T$; so the corrected average has the same mean as the plain
          one for every multiplier $b$. The multiplier only changes the
          variance, and it should be the slope of the payoff on $S_T$ — how
          much $Y$ moves per unit of $S_T$ — so that the part of $Y$'s noise
          that $S_T$ explains is removed and nothing else.

      - part: The best multiplier
        teach: >
          That is the method of control variates. With a control $C$ of known
          mean $\mu_C$ on every run, average $Y_i - b(C_i - \mu_C)$: unbiased
          for every constant $b$, with per-draw variance
          $\operatorname{Var}(Y) - 2b\operatorname{Cov}(Y,C) +
          b^{2}\operatorname{Var}(C)$. The quadratic is smallest at
          $b^{*} = \operatorname{Cov}(Y,C)/\operatorname{Var}(C)$, the
          regression slope of $Y$ on $C$, where the variance is
          $\operatorname{Var}(Y)(1 - \rho^{2})$ with
          $\rho = \operatorname{Corr}(Y,C)$.
      - ask: >
          A pilot run gives $\operatorname{Var}(Y) = 25$, $\operatorname{Var}(C)
          = 16$ and $\operatorname{Cov}(Y,C) = 14$. What is $b^{*}$?
        expects: "0.875"
        feedback: >
          $b^{*} = 14/16 = 0.875$.
      - ask: >
          What is the per-draw variance of the controlled estimator?
        expects: "12.75"
        hint: >
          Find $\rho = \operatorname{Cov}(Y,C)/\sqrt{\operatorname{Var}(Y)
          \operatorname{Var}(C)}$ first.
        feedback: >
          $\rho = 14/\sqrt{25 \times 16} = 14/20 = 0.7$, so $\rho^{2} = 0.49$
          and the variance is $25 \times 0.51 = 12.75$. Directly:
          $25 - 2(0.875)(14) + 0.875^{2}(16) = 25 - 24.5 + 12.25 = 12.75$.
      - ask: >
          Where does the factor $1 - \rho^{2}$ come from?
        choices:
          - text: >
              Subtracting $C$ removes its variance from $Y$'s: $25 - 16 = 9$.
            feedback: >
              With $b = 1$ the variance is $25 - 2(14) + 16 = 13$, not $9$, and
              the best $b$ gives $12.75$. Variances do not subtract; the
              covariance term does the work.
          - text: >
              At $b^{*}$ the variance is $\operatorname{Var}(Y) -
              \operatorname{Cov}(Y,C)^{2}/\operatorname{Var}(C)$, and the
              subtracted part is $\rho^{2}\operatorname{Var}(Y)$.
            correct: true
            feedback: >
              Plug $b^{*}$ into the quadratic: the last two terms combine to
              $-\operatorname{Cov}^{2}/\operatorname{Var}(C)$. The fraction
              removed is $\rho^{2}$, the $R^{2}$ of regressing $Y$ on $C$.
          - text: >
              $\rho^{2}$ is the share of $\operatorname{Var}(Y)$ that $C$
              cannot explain, and that share is removed.
            feedback: >
              Reversed. $\rho^{2}$ is the share $C$ *does* explain; that is
              what the control removes, and $1 - \rho^{2}$ is what is left.
        feedback: >
          The controlled estimator keeps only the residual of a regression of
          $Y$ on $C$.

      - part: What a correlation is worth
        ask: >
          With a control at $\rho = 0.7$, one controlled path is worth about
          $1/0.51 \approx 2$ plain paths. How many plain paths is one
          controlled path worth at $\rho = 0.99$?
        expects: "50.25"
        tolerance: 0.05
        feedback: >
          $1/(1 - 0.99^{2}) = 1/0.0199 \approx 50.25$. The gain is wildly
          nonlinear in $\rho$: $0.5$ buys a $25\%$ cut, $0.7$ about half, and
          only correlations near $1$ give orders of magnitude. Finding a
          control that tight and exactly priced is the whole art.
      - ask: >
          A colleague takes the pilot's $b^{*}$ but flips its sign, using
          $b = -0.875$. What per-draw variance does he get?
        expects: "61.75"
        feedback: >
          $25 + 2(0.875)(14) + 0.875^{2}(16) = 25 + 24.5 + 12.25 = 61.75$, about
          two and a half times the plain $25$. Still unbiased, but a bad $b$
          can make the estimator much worse.
      - ask: >
          On a new product nobody knows $\mathbb{E}[C]$ exactly, so a colleague
          uses the sample mean $\bar{C}$ of the same run in place of $\mu_C$.
          What does that do?
        choices:
          - text: >
              It works almost as well, since $\bar{C}$ is close to $\mu_C$.
            feedback: >
              Write it out: $\bar{Y} - b(\bar{C} - \bar{C}) = \bar{Y}$. The
              correction is identically zero, so the estimator is the plain
              average.
          - text: >
              It biases the estimator toward $\bar{C}$.
            feedback: >
              It does nothing at all, biased or otherwise: the subtracted term
              is $b(\bar{C} - \bar{C}) = 0$ on every run.
          - text: >
              The correction cancels exactly, and you are back to the plain
              average.
            correct: true
            feedback: >
              The control's value lies entirely in comparing what the run saw
              with what you know independently. Without an exact $\mu_C$ there
              is nothing to compare against.
        feedback: >
          A control needs a mean known exactly, from a formula — a forward, a
          closed-form price, a moment of the inputs.
      - teach: >
          Said in an interview: "Find something on the same paths with a known
          mean, and subtract $b(C - \mu_C)$. It stays unbiased for any $b$; the
          best $b$ is the regression slope $\operatorname{Cov}(Y,C)/
          \operatorname{Var}(C)$, estimated from a pilot, and it cuts the
          variance by the factor $1 - \rho^{2}$."

  - node: quant-statistics.simulation.importance-sampling
    hook: >
      Estimating a probability so small that naive simulation would need
      hundreds of millions of draws is the standard setup for importance
      sampling, and the interview wants the likelihood-ratio weight written
      correctly, not just "sample more from the tail."
    explanation: >
      The algebraic move is a single insertion: multiply and divide the
      integrand by a second density $g$ you're free to choose, turning
      $\mathbb{E}_f[h(X)]$ into $\mathbb{E}_g[h(X)w(X)]$ with weight
      $w=f/g$ — the same expectation, rewritten under a different sampling
      law, with a correction weight attached to undo the distortion.
      Simulating from $g$ and averaging $h$ times $w$ is unbiased for the
      original target under exactly one condition: $g$ must be positive
      everywhere $hf$ is nonzero, or that region of probability mass is
      silently dropped with no warning.

      The entire point of choosing $g$ deliberately is to put draws where
      $h(X)$ actually matters instead of spending the budget on outcomes
      that contribute nothing — precisely the rare-event regime: if an
      event's true probability is on the order of $10^{-7}$, a naive
      sampler needs on the order of $10^{7}$ to $10^{8}$ draws just to see a
      handful of occurrences, while sampling directly from a law
      concentrated near the event and reweighting needs only thousands.

      The danger runs the opposite direction from a thin proposal: if $f/g$
      is unbounded anywhere, the weighted estimator can have infinite
      variance while its simulated output looks perfectly calm — occasional
      enormous weights corrupt the average with no visible warning sign in a
      short run — so the standing rule is to give $g$ tails at least as
      heavy as $f$'s, never thinner.
    worked: >
      Estimate $\theta=\Pr(X>7)$ for $X\sim\mathrm{Exponential}(\text{rate
      }1)$; the true value is $e^{-7}\approx0.000912$. Sample instead from
      $g=\mathrm{Exponential}(\text{rate }1/7)$, mean $7$, with weight
      $w(x)=f(x)/g(x)=7e^{-6x/7}$. A representative draw at $x=8$ under $g$
      gives weight $w(8)=7e^{-48/7}\approx7\times0.00105\approx0.00737$,
      already the right order of magnitude versus the true $0.000912$ from a
      single draw, whereas a naive Exponential($1$) sampler needs on the
      order of $1/0.000912\approx1097$ draws on average just to see one
      success at all.
    interview: >
      "How would you estimate a very rare event's probability by
      simulation" is importance sampling by name; a fast follow-up, "what
      could go wrong with your choice of $g$," checks for the
      heavy-tailed-proposal condition specifically.
    pitfalls: >
      Choosing a proposal with lighter tails than the true $f$ leaves the
      weight ratio unbounded, and the estimator can carry infinite variance
      while a short run shows no sign of trouble. Forgetting the weight
      $w=f/g$ entirely and just averaging $h(X)$ under $g$ estimates
      $\mathbb{E}_g[h(X)]$, the wrong quantity, not the original target
      under $f$.
    recap: >
      Sample from a law $g$ that visits the important region and reweight
      by $w=f/g$ to stay unbiased for the original target — the standard
      cure for rare-event probabilities naive Monte Carlo can't see in a
      reasonable budget.
    dialogue:
      - part: A rare event and a blind sampler
        teach: >
          A trader with no skill makes $20$ independent calls, each right with
          probability $1/2$. How likely is a season of $18$ or more right?
          Exactly, it is $211/2^{20} \approx 2.01 \times 10^{-4}$ — and you
          want to test a simulation method here, where you can check it,
          before using it on events with no formula.
      - ask: >
          You simulate $10000$ seasons of the unskilled trader. How many
          seasons of $18$ or more do you expect to see?
        expects: "2.01"
        tolerance: 0.01
        feedback: >
          $10000 \times 2.012 \times 10^{-4} \approx 2.01$. The estimate is
          built on about two hits: a run that sees $0$ reports probability $0$,
          and one that sees $4$ reports double the truth.
      - ask: >
          Where is the naive sampler's effort going?
        choices:
          - text: >
              Into an estimator that is biased for rare events.
            feedback: >
              The hit frequency is unbiased at every $n$. The problem is not
              its centre but its spread relative to so small a target.
          - text: >
              Into the $99.98\%$ of seasons that miss the event and add a $0$
              that teaches almost nothing.
            correct: true
            feedback: >
              The answer depends only on the seasons that land in the event,
              and the sampler almost never visits them. For $10\%$ relative
              accuracy it would need about half a million seasons.
          - text: >
              Nowhere wasteful: every season is equally informative, and only
              more seasons help.
            feedback: >
              A season that misses is one more $0$ in an average whose
              information lives in the rare $1$s. Seasons are not equally
              informative when the event is rare.
        feedback: >
          To estimate a rare event you need to see it, and the natural law of
          the experiment hides it.
      - reflect: >
          Suppose you simulate a skilled trader instead, right $90\%$ of the
          time, who reaches $18$ often. How could his seasons still estimate
          the *unskilled* trader's probability?
        hint: >
          Compare how likely a given season is under each trader.
        answer: >
          Weight each simulated season by the ratio of its probability under
          the unskilled trader to its probability under the skilled one. A
          season the skilled trader makes common but the unskilled trader
          makes rare gets a small weight. Each season in the event then counts
          in proportion to how often the unskilled trader would have produced
          it, rather than how often the skilled one did — which is what the
          unskilled probability needs.

      - part: Sampling where it matters
        teach: >
          That is importance sampling. For a target law $f$ and any sampling
          law $g$, $\mathbb{E}_f[h(X)] = \mathbb{E}_g[h(X)w(X)]$ with weight
          $w = f/g$: sample from $g$ and average $h \cdot w$. The one hard
          requirement is $g(x) > 0$ wherever $h(x)f(x) \ne 0$. The point is to
          choose $g$ so that draws land where $h \cdot f$ is large.
      - ask: >
          A simulated season of the skilled trader has exactly $18$ right.
          What is its weight $w = 0.5^{20}/(0.9^{18} \times 0.1^{2})$, to six
          decimal places?
        expects: "0.000635"
        tolerance: 0.000002
        hint: >
          $0.5^{20} \approx 9.537 \times 10^{-7}$ and $0.9^{18} \approx 0.1501$.
        feedback: >
          $0.9^{18} \times 0.01 \approx 0.0015010$, and $9.537 \times 10^{-7} /
          0.0015010 \approx 0.000635$. The season counts for $1$ under the
          indicator but contributes only $0.000635$ to the average, because
          the unskilled trader would produce it about $1/1575$ as often.
      - ask: >
          What fraction of the skilled trader's seasons have $18$ or more
          right, to three decimal places?
        expects: "0.677"
        tolerance: 0.001
        hint: >
          Add the binomial probabilities of $18$, $19$ and $20$ successes with
          $p = 0.9$.
        feedback: >
          $190(0.9^{18})(0.1^{2}) + 20(0.9^{19})(0.1) + 0.9^{20} \approx 0.2852
          + 0.2702 + 0.1216 = 0.677$. Two seasons in three now land in the
          event. The weighted estimator's relative variance per draw drops
          from about $4970$ to about $1.9$: some $2600$ times fewer seasons
          for the same accuracy.
      - ask: >
          Write $A$ for the set of seasons with $18$ or more right. Why is the
          weighted average unbiased for the unskilled probability of $A$?
        choices:
          - text: >
              Because the skilled trader's law is close to the unskilled one.
            feedback: >
              It is nowhere near: $0.677$ against $0.0002$ for the event
              itself. Closeness is not needed — the weights correct for any
              difference.
          - text: >
              $\mathbb{E}_g[\mathbf{1}_A f/g] = \sum_{x \in A} g(x) f(x)/g(x) =
              \sum_{x \in A} f(x)$: the $g$ cancels wherever it is positive.
            correct: true
            feedback: >
              The cancellation needs $g(x) > 0$ at every $x$ in the event; that
              single condition is the whole proof.
          - text: >
              Because the weights average to $1$ under $g$.
            feedback: >
              They do, $\mathbb{E}_g[f/g] = 1$, but that is the case $h = 1$.
              Unbiasedness for the event comes from the same cancellation,
              applied to $\mathbf{1}_A f$.
        feedback: >
          Importance sampling changes where you look, and the weights repay
          exactly what the change distorted.

      - part: Proposals that lie
        ask: >
          A colleague's proposal is a trader who is never wrong on the first
          call. What happens to the estimate?
        choices:
          - text: >
              Nothing: seasons with a wrong first call are rare anyway.
            feedback: >
              Rare under the skilled trader, but not under the target. Of the
              $211$ seasons in the event, $20$ have the first call wrong —
              about $9.5\%$ of the probability.
          - text: >
              It silently converges to about $9.5\%$ below the truth.
            correct: true
            feedback: >
              $g = 0$ on every season with a wrong first call, so the $20$ such
              seasons in the event are never sampled. The estimator converges
              to $191/2^{20}$ instead of $211/2^{20}$, with no warning.
          - text: >
              The weights become infinite on those seasons.
            feedback: >
              The weight $f/g$ would be infinite there, but those seasons are
              never drawn, so no infinite weight ever appears. The failure is
              silent, which is worse.
        feedback: >
          $g$ must be positive wherever $h \cdot f$ is. A missed region is not
          down-weighted; it is dropped.
      - ask: >
          Another colleague goes further and samples a trader right $99\%$ of
          the time. Compared with the $90\%$ trader, his estimator is
        choices:
          - text: >
              better: almost every season lands in the event.
            feedback: >
              Most land on $20$ right, which carries little of the target's
              probability. The seasons with exactly $18$ right hold $190/211$
              of it, and he samples them only about $1.6\%$ of the time, each
              with a weight near $0.011$.
          - text: >
              about the same: any proposal that reaches the event works.
            feedback: >
              Every such proposal is unbiased; their variances differ by
              orders of magnitude. The relative variance per draw is about
              $1.9$ at $90\%$ and about $50$ at $99\%$.
          - text: >
              about $27$ times worse, because rare large weights now dominate
              the average.
            correct: true
            feedback: >
              The relative variance per draw is about $50$ against $1.9$. The
              best proposal makes the event common without making its
              important parts rare.
        feedback: >
          Overshooting is the classic way to spoil importance sampling: the
          weights become uneven, and a few draws carry the whole estimate.
      - ask: >
          In continuous problems the same danger has a sharper form. You
          estimate a tail probability of a heavy-tailed $f$, sampling from a
          normal $g$ centred in the tail. What do you see?
        choices:
          - text: >
              A clear blow-up in the first few hundred draws, so the problem is
              easy to spot.
            feedback: >
              The draws that carry the huge weights are the rare ones far out
              in $g$'s thin tail. A short run usually sees none of them, and
              looks calm.
          - text: >
              Nothing wrong: unbiasedness holds, so the estimate converges at
              the usual rate.
            feedback: >
              Unbiasedness holds, but the rate needs finite variance, and
              $\mathbb{E}_g[(hf/g)^{2}]$ can be infinite here.
          - text: >
              A stable-looking estimate that jumps when a rare far draw arrives,
              because $f/g$ is unbounded and the variance can be infinite.
            correct: true
            feedback: >
              A normal tail dies like $e^{-x^{2}/2}$, so $f/g$ grows without
              bound for any heavier-tailed $f$. Give $g$ tails at least as
              heavy as $f$'s.
        feedback: >
          The variance of an importance sampler lives where $g$ is small and
          $f$ is not. Fat-tailed proposals keep it finite.
      - teach: >
          Said in an interview: "Sample from a law $g$ that visits the event
          and reweight by $f/g$; it stays unbiased as long as $g$ is positive
          wherever $h f$ is. For a normal tail, shift the mean into the tail.
          Do not overshoot, and never give $g$ thinner tails than $f$."

  - node: quant-statistics.simulation.seeding
    hook: >
      "How do you make sure your backtest is reproducible" and "how do you
      fairly compare two trading strategies in simulation" are both answered
      by seed discipline, and the second one is a genuine free efficiency
      gain, not just hygiene.
    explanation: >
      Every result upstream in this unit is only ever a deterministic
      function of some seed, so failing to record it — letting the generator
      default to a clock-based start — throws away the one thing that made
      the whole exercise reproducible in the first place. The seed is part
      of the result, not an implementation detail to omit.

      Running components in parallel raises a second, easy-to-miss hazard:
      if two workers aren't given provably disjoint streams, via a
      counter-based generator's jump-ahead or explicit separate seeds, their
      supposedly independent draws can silently overlap, manufacturing
      correlation between components assumed independent and corrupting
      every downstream variance calculation that relied on that
      independence.

      Deliberately reusing the identical seed across two runs, by contrast,
      is a genuine technique: running two competing strategies on exactly
      the same simulated market path cancels the simulation noise common to
      both, so the estimated difference between them converges far faster
      than either strategy's own level would on its own — the same
      variance-reduction logic as a control variate, applied by construction
      rather than by regression. The trap runs the other way: tuning a
      parameter against results from a single fixed seed is overfitting to
      that one random realization, indistinguishable from a genuine
      improvement until checked against fresh seeds.
    interview: >
      "How do you make a simulation result reproducible" and "how would you
      fairly compare two strategies in a Monte Carlo backtest" are both
      seeding questions — the first wants explicit seed logging named
      directly, the second wants common random numbers named as the
      mechanism, not just "use more paths."
    pitfalls: >
      Tuning any parameter, or comparing two strategies, using only one
      seed's worth of draws and treating the result as final skips the
      confirmation on fresh seeds that catches overfitting to the
      generator. Assuming parallel workers are automatically independent
      just because they're separate processes ignores that, without an
      explicit disjoint-stream scheme, they can replay overlapping segments
      of the same underlying sequence.
    recap: >
      Log the seed, keep parallel streams provably disjoint, and reuse a
      seed on purpose — common random numbers — to compare two simulated
      variants far more precisely than either alone, but never tune against
      a single seed.
    dialogue:
      - part: A delta by finite difference
        teach: >
          You want a call's delta by simulation: price it with spot $100$ and
          again with spot $101$, $10000$ paths each, and take the difference.
          A path's payoff has standard deviation about $20$, and the true
          delta is about $0.6$.
      - ask: >
          With fresh, independent random numbers for the two runs, what is the
          standard error of the difference, to four decimal places?
        expects: "0.2828"
        tolerance: 0.0005
        hint: >
          Variances of independent estimates add.
        feedback: >
          Each price has standard error $20/\sqrt{10000} = 0.2$, so the
          difference has $\sqrt{0.2^{2} + 0.2^{2}} = \sqrt{0.08} \approx
          0.2828$. The delta of $0.6$ is barely two standard errors from
          zero: the estimate is nearly useless.
      - ask: >
          A colleague reruns both prices from the *same* seed, so path $i$ of
          the bumped run sees exactly the shocks of path $i$ of the base run.
          What do you predict?
        choices:
          - text: >
              A worse estimate: the two runs are no longer independent, so the
              error bar is invalid.
            feedback: >
              Dependence does not invalidate anything; it changes the variance
              of the difference to $\sigma_1^{2} + \sigma_2^{2} -
              2\operatorname{Cov}$. Here the covariance is large and positive,
              which is the good direction.
          - text: >
              The same error: each run still has standard error $0.2$.
            feedback: >
              Each run does, but the difference does not. The $-2\operatorname{Cov}$
              term was zero before and is now nearly as large as the variances.
          - text: >
              A far sharper difference: the market noise hits both prices
              alike and cancels when you subtract.
            correct: true
            feedback: >
              A path that ends high makes both calls pay a lot; a path that
              ends low makes both pay little. That shared noise cancels in the
              difference, leaving only the effect of the bump.
        feedback: >
          Reusing random numbers on purpose, to compare two variants, is
          called common random numbers.
      - ask: >
          With the shared seed the paired payoffs have correlation about
          $0.999$. What is the standard error of the difference now, to four
          decimal places?
        expects: "0.0089"
        tolerance: 0.0002
        feedback: >
          $\sqrt{0.2^{2} + 0.2^{2} - 2(0.999)(0.2)(0.2)} = \sqrt{0.08 \times
          0.001} \approx 0.0089$, about $32$ times smaller than $0.2828$. With
          independent streams you would need about $1000$ times the paths to
          match it.
      - reflect: >
          The seed alone decided whether those two runs shared their noise.
          What does that imply for rerunning last month's result, and for
          eight parallel workers that are meant to be independent?
        hint: >
          The seed is an input to the run, like the spot price.
        answer: >
          The seed is part of the result's specification. Set it explicitly
          and log it, and last month's run is reproducible to the last digit;
          leave it to a clock-based default and it is gone. And sharing works
          in both directions: two workers whose streams coincide or overlap
          share noise exactly as the bumped runs did, but now silently,
          because everything downstream assumes independence. Each
          independent component needs its own, provably separate stream.

      - part: One seed per result, one stream per component
        teach: >
          The discipline, then. Set the seed explicitly and record it with the
          output. Give each independent component its own stream, provably
          separate from every other, so that adding a worker cannot overlap
          two streams. And reuse seeds deliberately — common random numbers —
          when comparing variants.
      - ask: >
          Eight workers each seed themselves with the current time in whole
          seconds, and all start within the same second. Each runs $5000$
          paths, and the report treats the $40000$ paths as independent. By
          what factor is the reported standard error too small, to four
          decimal places?
        expects: "2.8284"
        tolerance: 0.0005
        hint: >
          How many different paths were actually simulated?
        feedback: >
          All eight workers got the same seed, so the $40000$ paths are $8$
          copies of the same $5000$. The true standard error is
          $\sigma/\sqrt{5000}$ and the reported one $\sigma/\sqrt{40000}$, off
          by $\sqrt{8} \approx 2.8284$ — and eight times the compute bought
          nothing.
      - ask: >
          How should the eight workers get their random numbers?
        choices:
          - text: >
              Seeds $1$ through $8$: different seeds give different streams.
            feedback: >
              Different starting points, not guaranteed separate streams. With
              many generators the stream from seed $2$ can run into the stretch
              seed $1$ is using, and nearby seeds can start out correlated.
              Distinct seeds promise nothing about overlap.
          - text: >
              A counter-based generator keyed by worker number, or jump-ahead
              to provably disjoint blocks of one stream.
            correct: true
            feedback: >
              Both give each worker a stretch of random numbers that cannot
              meet another's, by construction. The master seed is still one
              number to log.
          - text: >
              Reseed from the clock before every path, so nothing can repeat.
            feedback: >
              Clock readings repeat and cluster, which is exactly how the eight
              workers above collided; and the run can never be reproduced.
        feedback: >
          Independence between workers has to be designed in, not hoped for.

      - part: Seeds that mislead
        ask: >
          You add a new risk factor to a simulation, driven by the same single
          stream. A portfolio that does not depend on that factor now prices
          differently. Why?
        choices:
          - text: >
              The new factor is correlated with the old ones.
            feedback: >
              The portfolio does not read the new factor at all. Its price
              moved because of which uniforms the old factors now receive.
          - text: >
              The new factor consumes uniforms from the shared stream, so every
              later draw shifts and the old factors see different numbers.
            correct: true
            feedback: >
              Same seed, different consumption, different paths. The result is
              still a valid estimate, but you can no longer tell a real change
              from a reshuffle of noise. Separate streams per component keep
              unrelated results fixed.
          - text: >
              The generator is not deterministic after all.
            feedback: >
              It is perfectly deterministic; that is why the shift is
              systematic. Same seed and same consumption order give the same
              numbers, and the consumption order changed.
        feedback: >
          Give each component its own stream, and adding one leaves the others
          untouched.
      - ask: >
          You try $50$ values of a stop-loss level, all on the same $2000$
          paths from one seed, and the best beats the baseline by $0.3$. On
          fresh seeds its edge shrinks to $0.05$. What happened?
        choices:
          - text: >
              The fresh seeds happened to be unlucky.
            feedback: >
              Possible once; systematic every time. The first seed was the one
              selected on, and that is where the luck was.
          - text: >
              Picking the best of $50$ on one realisation selected the level
              whose noise on those paths happened to be favourable.
            correct: true
            feedback: >
              Overfitting to the generator. Common random numbers sharpen each
              comparison, but taking a maximum over many of them on the same
              paths finds the noise as well as the signal. Confirm on fresh
              seeds.
          - text: >
              Reusing one seed for all $50$ comparisons biased each of them.
            feedback: >
              Each comparison on the shared paths is unbiased, and sharper
              than with independent streams. The bias enters when you select
              the winner and report its estimate.
        feedback: >
          Reuse a seed to compare; refresh it to confirm.
      - teach: >
          Said in an interview: "I set and log the seed, give every parallel
          worker a provably disjoint stream, and run competing variants on
          common random numbers so the shared noise cancels in the
          difference. Anything tuned on one seed gets re-checked on fresh
          ones."
