unit: quant-probability.conditioning
opening: >
  Conditioning turns a single random variable into a whole family of
  forecasts, one per value of whatever you've observed, and this unit builds
  the machinery to manipulate that family rigorously. It opens with
  conditioning on an event and then on a variable, arrives at
  $\mathbb{E}[X\mid Y]$ itself — a random variable, not a number — and its
  algebra, then proves the two identities that do almost all the work
  downstream: the tower property, which says a forecast is unbiased on
  average, and the law of total variance, which splits risk into within- and
  between-group pieces. The back half turns theory into technique:
  conditioning on the first step of a process to set up an equation, the mean
  and variance of a randomly-stopped sum, and a run of fully worked examples —
  truncated exponentials and uniforms, regime mixtures, exchangeable shares of
  a total — that are exactly the shape interview questions take.
lessons:
  - node: quant-probability.conditioning.conditional-given-event
    hook: >
      Every "expected value given that ..." question in an interview is this
      move, and it's the base case the rest of the unit — conditional
      distributions, $\mathbb{E}[X\mid Y]$, the tower property — is built
      from.
    explanation: >
      Conditioning on an event throws away every outcome outside $A$ and
      rescales what's left so probabilities inside $A$ still sum to $1$ —
      divide by $\Pr(A)$. $\mathbb{E}[X\mid A]$ is just the ordinary
      expectation computed in that shrunk world: average $x$ against the
      renormalised law $\Pr(X=x\mid A)$.

      The load-bearing algebra is one step: $\sum_x x\Pr(X=x\mid A) = \sum_x
      x\Pr(X=x,A)/\Pr(A) = \mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$, pulling the
      constant $\Pr(A)$ out of the sum. This form — expectation of $X$ times
      the indicator, divided by $\Pr(A)$ — is the one worth keeping in your
      hands, since it never requires writing out the whole restricted
      distribution when only the mean is wanted.

      The general pattern behind "given that," "restricted to," "among
      those who": average $X$ over the qualifying subset only, weighted the
      same way probabilities inside that subset are weighted. A pension's
      expected payout given survival to retirement, a trade's expected P&L
      given a signal fired, a queue's expected wait given no cancellation yet
      — all the same computation.
    worked: >
      Roll two fair dice and let $X$ be their sum. Condition on $A =
      \{\text{first die shows } 3\}$: given $A$, the second die is still
      uniform on $\{1,\dots,6\}$, so $X = 3 + \text{second die}$ and
      $\mathbb{E}[X\mid A] = 3+\mathbb{E}[\text{second die}] = 3+3.5 = 6.5$.
      Directly: the six equally likely outcomes under $A$ give sums
      $4,5,6,7,8,9$, averaging to $39/6 = 6.5$, matching.
    interview: >
      "What's the expected value of $X$ given that [some event] happened" is
      answered by restricting to the event and averaging inside it — state
      $\mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$ once, then compute directly by
      restriction whenever the outcomes stay easy to enumerate, since
      interviewers reward the faster route.
    pitfalls: >
      Averaging $X$ over $A$ with the unconditional probabilities instead of
      the rescaled ones understates every conditional mean — you must divide
      by $\Pr(A)$, not just sum $x\Pr(X=x,A)$. The formula needs $\Pr(A)>0$;
      a conditioning event with zero probability makes the expression
      $0/0$, not zero.
    recap: >
      $\mathbb{E}[X\mid A] = \mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$ is
      expectation computed after restricting to and rescaling within $A$ —
      here, a die's sum given its first face is $3$ averages to $6.5$.
    dialogue:
      - part: The average win
        teach: >
          A single trade pays $X$, in thousands: it loses $1$ with probability
          $0.5$, makes $2$ with probability $0.3$, and makes $6$ with
          probability $0.2$. Your risk manager wants one number: the average
          gain on the trades that make money.
      - ask: >
          A colleague writes $0.3(2) + 0.2(6) = 1.8$. Is $1.8$ the average
          gain on winning trades?
        choices:
          - text: >
              Yes: each gain is weighted by its probability, as an expectation
              should be.
            feedback: >
              Those are probabilities in the world of all trades, and they add
              to $0.5$. The other half of the weight sits on the losers, each
              counted as a gain of $0$. Every winner makes at least $2$, so an
              average win of $1.8$ cannot be right.
          - text: >
              No: the two winning outcomes should count equally, giving
              $(2 + 6)/2 = 4$.
            feedback: >
              Equal weights throw away what you know. A $2$ happens $0.3/0.2 =
              1.5$ times as often as a $6$, and that stays true among the
              winners, so the average win sits below the midpoint $4$, nearer
              the $2$.
          - text: >
              No: the weights $0.3$ and $0.2$ add to only $0.5$, so they are
              not a distribution over the winners.
            correct: true
            feedback: >
              Right. The weights are the right shape and the wrong size: half
              the probability is still parked on the losing outcome.
        feedback: >
          $1.8$ is the winners' total contribution to the overall mean, spread
          over every trade, losers included. It is not an average over the
          winners.
      - reflect: >
          What weights should $2$ and $6$ get, and what single operation on
          $0.3$ and $0.2$ produces them? Say why that operation and not
          another.
        hint: >
          Among the winners, the relative frequencies do not change. Only the
          total has to.
        answer: >
          Among winning trades a $2$ is still $1.5$ times as likely as a $6$,
          so the weights must stay in ratio $3:2$, and they must add to $1$
          because a winner is certainly one of the two. Dividing both by
          their sum, $\Pr(\text{win}) = 0.5$, does exactly that: $0.6$ and
          $0.4$. Throw away the outcomes outside the event, scale the
          survivors up by $1/\Pr(\text{win})$.
      - ask: >
          What is the average gain on winning trades?
        expects: "3.6"
        feedback: >
          $0.6(2) + 0.4(6) = 1.2 + 2.4 = 3.6$. It is also $1.8/0.5$: your
          colleague's number divided by the probability he forgot.

      - part: Restrict, rescale, average
        teach: >
          You have rebuilt conditioning on an event. For an event $A$ with
          $\Pr(A) > 0$, the conditional law of $X$ given $A$ puts mass
          $\Pr(X = x \mid A) = \Pr(X = x, A)/\Pr(A)$ on each value: nothing
          outside $A$, the old ratios inside it, total $1$. Averaging against
          that law and pulling the constant $1/\Pr(A)$ out of the sum gives
          $\mathbb{E}[X \mid A] = \mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$. The
          $1.8$ was the numerator; the $0.5$ was the denominator nobody wrote.
      - ask: >
          Same trade, new event: $A = \{X \ne 6\}$. Listing probabilities for
          $-1$, $2$ and $6$ in that order, which is the law of $X$ given $A$?
        choices:
          - text: >
              $0.5$, $0.3$, $0$
            feedback: >
              The $6$ is gone and the ratio $5:3$ survives, but the total is
              $0.8$. That is restriction without rescaling, the same slip as
              the $1.8$.
          - text: >
              $0.5$, $0.3$, $0.2$
            feedback: >
              That is the unconditional law; nothing was restricted. Given
              $X \ne 6$, a $6$ is impossible and must get $0$.
          - text: >
              $0.5$, $0.5$, $0$
            feedback: >
              It adds to $1$ and drops the $6$, but it hands all of the $6$'s
              mass to the $2$. A loss was $5/3$ times as likely as a $2$
              before, and knowing the trade did not make $6$ says nothing to
              change that.
          - text: >
              $0.625$, $0.375$, $0$
            correct: true
            feedback: >
              $0.5/0.8$ and $0.3/0.8$: zero outside $A$, ratio $5:3$ kept,
              total $1$.
        feedback: >
          Three clauses, checked on every candidate: no mass outside $A$,
          ratios inside $A$ unchanged, total $1$. Dividing by $\Pr(A)$ is the
          one operation that delivers all three.
      - ask: >
          What is $\mathbb{E}[X \mid X \ne 6]$?
        expects: "1/8"
        hint: >
          Average against the law you just picked, or compute
          $\mathbb{E}[X\mathbf{1}\{A\}]$ and divide by $\Pr(A)$.
        feedback: >
          $\mathbb{E}[X\mathbf{1}\{A\}] = 0.5(-1) + 0.3(2) = 0.1$ and
          $\Pr(A) = 0.8$, so the answer is $0.1/0.8 = 0.125$. Against the
          law: $0.625(-1) + 0.375(2) = 0.125$, the same number.
      - ask: >
          The colleague's $1.8$ fails a sanity check you can run on any
          conditional mean in two seconds. Which?
        choices:
          - text: >
              $\mathbb{E}[X \mid A]$ must exceed the unconditional mean
              $\mathbb{E}[X] = 1.3$.
            feedback: >
              Conditioning can move the mean either way: you just found
              $\mathbb{E}[X \mid X \ne 6] = 0.125$, well below $1.3$.
          - text: >
              $\mathbb{E}[X \mid A]$ must lie between the smallest and largest
              values $X$ takes on $A$.
            correct: true
            feedback: >
              It is an average against a genuine distribution on $A$, so it
              lands in $[2, 6]$ for the winners. $1.8$ is below $2$, and that
              alone convicts it.
          - text: >
              $\mathbb{E}[X \mid A]$ must be at most $\mathbb{E}[X]$, since
              conditioning removes outcomes.
            feedback: >
              Removing the losing outcome raised the mean from $1.3$ to $3.6$.
              Throwing outcomes away can push the average anywhere inside the
              range of what is left.
        feedback: >
          A conditional mean is a real average over $A$. If yours falls
          outside the values $X$ takes there, a $\Pr(A)$ went missing.

      - part: The same move with a density
        ask: >
          Now $X$ is continuous, with density $2x$ on $(0, 1)$, and
          $A = \{X < 1/2\}$. Which is the density of $X$ given $A$, on
          $(0, 1/2)$?
        choices:
          - text: >
              $2x$
            feedback: >
              Restricted but not rescaled: $\int_0^{1/2} 2x\,dx = 1/4$, so
              this "density" carries total mass $1/4$.
          - text: >
              $4x$
            feedback: >
              This divides by $1/2$, the length of the new interval. Rescaling
              is by $\Pr(A)$, and $\Pr(X < 1/2) = 1/4$ because the density is
              thin near $0$.
          - text: >
              $8x$
            correct: true
            feedback: >
              $\Pr(A) = (1/2)^{2} = 1/4$, so the density becomes
              $2x/(1/4) = 8x$, which integrates to $4(1/2)^{2} = 1$ on
              $(0, 1/2)$.
          - text: >
              $4$, uniform on $(0, 1/2)$
            feedback: >
              It integrates to $1$, but it flattens the shape. Inside $A$ the
              old density still says values near $1/2$ are more likely than
              values near $0$, and conditioning keeps those ratios.
        feedback: >
          The continuous case is the same three clauses: $f(x)\mathbf{1}\{x
          \in A\}/\Pr(A)$ is zero off $A$, proportional to $f$ on it, and
          integrates to $1$.
      - ask: >
          What is $\mathbb{E}[X \mid X < 1/2]$ for that density?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          Integrate $x \cdot 8x$ over $(0, 1/2)$.
        feedback: >
          $\int_0^{1/2} 8x^{2}\,dx = 8(1/2)^{3}/3 = 1/3$. It lies above the
          midpoint $1/4$ of the interval, as it should: the conditional density
          leans to the right.

      - part: The one hypothesis
        ask: >
          Back to the trade that pays $-1$, $2$ or $6$. An analyst asks for
          $\mathbb{E}[X \mid X = 4]$. What do you tell him?
        choices:
          - text: >
              It is $0$: no trade makes $4$, so the contribution is nothing.
            feedback: >
              The numerator $\mathbb{E}[X\mathbf{1}\{X = 4\}]$ is $0$, but so
              is the denominator. The expression is $0/0$, and $0$ is not a
              value of $X$ on the event, so it fails the range check as well.
          - text: >
              It is undefined: $\Pr(X = 4) = 0$, so there is no conditional
              law to average against.
            correct: true
            feedback: >
              The definition asks for $\Pr(A) > 0$ because the rescaling step
              divides by it. With nothing in $A$, there is nothing to rescale.
          - text: >
              It is $4$, since $X = 4$ on the event.
            feedback: >
              The event contains no outcome, so "$X = 4$ on the event" is
              true vacuously, and so is "$X = 17$ on the event". The formula
              divides by $\Pr(A) = 0$ and returns no number at all.
        feedback: >
          The whole definition rests on one hypothesis, $\Pr(A) > 0$. Drop it
          and the rescaling has nothing to divide by.
      - teach: >
          In an interview, "given that" is your cue to say the two pieces out
          loud: "$\mathbb{E}[X\mathbf{1}\{A\}]$ is $1.8$, $\Pr(A)$ is $0.5$, so
          $3.6$." Saying the denominator is how the interviewer hears that you
          did not forget it.

  - node: quant-probability.conditioning.conditional-distribution
    hook: >
      The moment a problem says "given $Y=y$," it's handing you a whole new
      distribution for $X$, not just a number — build it once and every
      conditional question about $X$ becomes a plain computation inside it.
    explanation: >
      Slicing the joint law at $Y=y$ and renormalising by $\Pr(Y=y)$ (or
      $f_Y(y)$) is exactly conditioning on the event $\{Y=y\}$, applied to
      $X$ — the same rescaling as "Conditioning on an event," just done
      outcome-by-outcome for every $y$ instead of once. What's new is
      bookkeeping: a family of distributions, one $p_{X\mid Y}(\cdot\mid y)$
      per value $y$ can take, not a single restricted law.

      The continuous case forces a change of definition, not just of
      notation: $\{Y=y\}$ has probability zero, so dividing by $\Pr(Y=y)$ is
      meaningless. Instead $f_{X\mid Y}(x\mid y) = f(x,y)/f_Y(y)$ is
      *defined* to be the ratio of densities, and it's checked directly to
      integrate to $1$ in $x$ for each fixed $y$ — a genuine density,
      arrived at without ever conditioning on a probability-zero event.

      Reversing the ratio gives the chain rule $f(x,y) = f_{X\mid Y}(x\mid
      y)f_Y(y)$, the standard recipe for building a joint law top-down: draw
      $Y$ from its marginal, then draw $X$ from the conditional law attached
      to that $Y$. Every hierarchical model — a random parameter followed by
      data given the parameter — is written exactly this way.
    worked: >
      Let $Y$ be uniform on $\{1,2,3\}$ and, given $Y=y$, let $X$ be uniform
      on $\{1,\dots,y\}$. Then $p_{X\mid Y}(x\mid 2) = 1/2$ for $x\in\{1,2\}$,
      so $\mathbb{E}[X\mid Y=2]=1.5$; and $p_{X\mid Y}(x\mid 3)=1/3$ for
      $x\in\{1,2,3\}$, so $\mathbb{E}[X\mid Y=3]=2$. Three different
      distributions for $X$, one per value of $Y$, each a legitimate law in
      its own right.
    interview: >
      "Given the parameter/regime/count is $y$, what does $X$ look like"
      wants you to name the whole conditional law, not jump straight to a
      mean — stating $p_{X\mid Y}(\cdot\mid y)$ or $f_{X\mid Y}(\cdot\mid y)$
      explicitly signals you understand it's a distribution, and it sets up
      the chain rule for building joint models.
    pitfalls: >
      In the continuous case, conditioning "on $Y=y$" is a definition (a
      ratio of densities), not a literal restriction to a probability-zero
      event — don't try to justify it the way you justify the discrete case.
      Also, $f_{X\mid Y}(\cdot\mid y)$ is only defined where $f_Y(y)>0$;
      plugging in a $y$ the marginal never reaches is undefined, not zero.
    recap: >
      Slicing the joint law at $Y=y$ and renormalising gives a full
      distribution for $X$ per value of $y$, and reversing that ratio is the
      standard way to build a joint law from "draw $Y$, then draw $X$ given
      $Y$."
    dialogue:
      - part: Slicing a table
        teach: >
          You rest two limit orders before the open. Let $Y = 1$ if the market
          opens up and $Y = 0$ if it opens down, and let $X$ be how many of
          your orders fill. The joint law: opening down, $X = 0, 1, 2$ with
          probabilities $0.06, 0.12, 0.12$; opening up, $X = 0, 1, 2$ with
          probabilities $0.35, 0.28, 0.07$.
      - ask: >
          The market opened down. What is the probability both orders fill?
        expects: "0.4"
        hint: >
          The down row is the event $\{Y = 0\}$. What is its probability?
        feedback: >
          $\Pr(Y = 0) = 0.06 + 0.12 + 0.12 = 0.3$, so
          $\Pr(X = 2 \mid Y = 0) = 0.12/0.3 = 0.4$. Reading $0.12$ straight off
          the table is the joint probability, not the conditional one.
      - ask: >
          The market opened up. What is the probability at least one order
          fills?
        expects: "0.5"
        feedback: >
          The up row totals $0.7$, so its conditional law is $0.5, 0.4, 0.1$,
          and $\Pr(X \ge 1 \mid Y = 1) = 0.4 + 0.1 = 0.5$.
      - ask: >
          Is the number of fills independent of the direction of the open?
        choices:
          - text: >
              No: the two rescaled rows are different distributions.
            correct: true
            feedback: >
              Independence would mean every row, once rescaled, is the same
              law. Here the down-open law puts most of its weight on fills and
              the up-open law on no fill.
          - text: >
              Yes: $\Pr(X = 1 \mid Y)$ is $0.4$ in both rows.
            feedback: >
              One value agreeing is not enough. $\Pr(X = 2 \mid Y = 0) = 0.4$
              but $\Pr(X = 2 \mid Y = 1) = 0.1$: knowing the open changes the
              chance of a double fill fourfold.
          - text: >
              Yes: the rows differ only because they have different totals,
              $0.3$ and $0.7$.
            feedback: >
              Different totals are just the law of $Y$. After dividing each row
              by its total the shapes are still different, $0.2, 0.4, 0.4$
              against $0.5, 0.4, 0.1$.
        feedback: >
          The table holds not one distribution for $X$ but one per value of
          $Y$, and comparing those slices is how you see dependence.

      - part: A slice of probability zero
        ask: >
          Now $(X, Y)$ is continuous, with joint density $x + y$ on the unit
          square. Try the recipe from conditioning on an event:
          $\Pr(X \le 1/2 \mid Y = 1/2) = \Pr(X \le 1/2, Y = 1/2)/\Pr(Y = 1/2)$.
          What does it give?
        choices:
          - text: >
              $0/0$: the event $\{Y = 1/2\}$ has probability zero, so the
              formula says nothing.
            correct: true
            feedback: >
              Exactly the hypothesis $\Pr(A) > 0$ failing. Yet the line
              $y = 1/2$ visibly carries a profile of density: something should
              be the law of $X$ there.
          - text: >
              $1/2$, since half the slice lies to the left of $1/2$.
            feedback: >
              That treats the slice as flat. Along $y = 1/2$ the density is
              $x + 1/2$, heavier on the right, so the answer is not $1/2$ —
              and the formula you were handed does not produce it anyway.
          - text: >
              $0$, since $\Pr(Y = 1/2) = 0$ makes the event impossible.
            feedback: >
              The numerator is $0$, and so is the denominator. A continuous
              $Y$ hits every single value with probability $0$, yet it lands
              somewhere.
        feedback: >
          Conditioning on an event needs the event to have positive
          probability, and for a continuous $Y$ no value does.
      - reflect: >
          Along the line $y = 1/2$ the joint density is $x + 1/2$. What could
          you divide that profile by so it becomes a density in $x$, and why
          is that the right thing to divide by?
        hint: >
          Integrate the profile over $x$. Which marginal quantity is that?
        answer: >
          Divide by its own integral, $\int_0^1 (x + 1/2)\,dx$, which is
          exactly the marginal density $f_Y(1/2)$. Then the profile
          integrates to $1$ and keeps its shape, the same restrict-and-rescale
          as before. It is also what conditioning on the thin strip
          $1/2 \le Y \le 1/2 + h$ gives as $h \to 0$: the strip has
          probability about $f_Y(1/2)h$, the joint mass near $x$ is about
          $f(x, 1/2)h$, and the $h$ cancels.
      - teach: >
          That is the conditional distribution. In the discrete case,
          $p_{X \mid Y}(x \mid y) = p(x, y)/p_Y(y)$ wherever $p_Y(y) > 0$: the
          law of $X$ given the event $\{Y = y\}$, one for each $y$. In the
          continuous case the event has probability $0$, so the same ratio is
          taken as a definition: $f_{X \mid Y}(x \mid y) = f(x, y)/f_Y(y)$
          wherever $f_Y(y) > 0$, a genuine density in $x$ for each fixed $y$.
      - ask: >
          For the density $x + y$ on the unit square, what is $f_Y(1/2)$?
        expects: "1"
        feedback: >
          $f_Y(1/2) = \int_0^1 (x + 1/2)\,dx = 1/2 + 1/2 = 1$. So on this
          particular slice $f_{X \mid Y}(x \mid 1/2) = x + 1/2$, the profile
          itself, already integrating to $1$.
      - ask: >
          What is $\Pr(X \le 1/2 \mid Y = 1/2)$?
        expects: "3/8"
        hint: >
          Integrate $x + 1/2$ from $0$ to $1/2$.
        feedback: >
          $\int_0^{1/2} (x + 1/2)\,dx = 1/8 + 1/4 = 3/8$, below the $1/2$ a
          flat slice would give, because the profile leans right.
      - ask: >
          With the same density, what is $f_{X \mid Y}(x \mid 3/2)$?
        choices:
          - text: >
              $0$, because the square stops at $y = 1$.
            feedback: >
              A conditional density of $0$ everywhere would integrate to $0$,
              not $1$; it is not a density at all.
          - text: >
              $(x + 3/2)/2$, by plugging into the ratio.
            feedback: >
              The joint density is $0$ off the square, so the formula $x + y$
              does not apply at $y = 3/2$. And $f_Y(3/2) = 0$.
          - text: >
              Undefined: $f_Y(3/2) = 0$, so there is no ratio to take.
            correct: true
            feedback: >
              The conditional density is defined only where the marginal is
              positive. A value $Y$ never takes gets no conditional law.
        feedback: >
          The definition has its one hypothesis in the denominator, just as
          conditioning on an event did: $f_Y(y) > 0$.

      - part: Building a joint law from the top
        ask: >
          A different desk models the open the other way round: it opens up
          with probability $0.6$, and given an up open, both orders fill with
          probability $0.15$. What is the probability of an up open with both
          orders filled?
        expects: "0.09"
        feedback: >
          Reverse the ratio: $p(x, y) = p_{X \mid Y}(x \mid y)\,p_Y(y)$, so
          $\Pr(Y = 1, X = 2) = 0.15 \times 0.6 = 0.09$.
      - ask: >
          You are given $f_{X \mid Y}(x \mid y)$ for every $y$. What more do
          you need to write down the joint density $f(x, y)$?
        choices:
          - text: >
              Nothing: the conditional densities already pin down the pair.
            feedback: >
              They say how $X$ behaves on each slice, not how much weight each
              slice carries. Two models with the same slices and different
              laws for $Y$ have different joint densities.
          - text: >
              The marginal density $f_X$.
            feedback: >
              $f_X$ is a consequence of the joint law, not an input to it, and
              it does not say how often each slice $y$ occurs.
          - text: >
              The marginal density $f_Y$.
            correct: true
            feedback: >
              The chain rule $f(x, y) = f_{X \mid Y}(x \mid y)f_Y(y)$: weight
              each slice by how likely its $y$ is.
        feedback: >
          "Draw $Y$, then draw $X$ given $Y$" is how hierarchical models are
          written, and the chain rule is what turns that recipe into a joint
          law.
      - teach: >
          When an interviewer says "given $Y = y$", name the whole conditional
          law before reaching for a mean: "given $y$, $X$ has density
          $f(x, y)/f_Y(y)$". Every conditional question about $X$ is then an
          ordinary computation inside that law.

  - node: quant-probability.conditioning.conditional-expectation
    hook: >
      The interview-killing distinction is $\mathbb{E}[X\mid Y=3]$, a
      number, versus $\mathbb{E}[X\mid Y]$, a random variable — mixing them
      up breaks every identity that follows in this unit.
    explanation: >
      For each fixed $y$, $g(y) = \mathbb{E}[X\mid Y=y]$ is an ordinary
      number, computed by averaging against the conditional law attached to
      that $y$ — nothing new here beyond plugging into the previous node's
      family of distributions one $y$ at a time.

      The move that matters is composing $g$ with the random variable $Y$
      itself: $\mathbb{E}[X\mid Y] := g(Y)$. Before $Y$ is observed, you
      don't know which number $g(y)$ you'll get, so $\mathbb{E}[X\mid Y]$ is
      genuinely random — a function of $Y$ alone, completely determined once
      $Y$ is known, but unknown beforehand exactly like $Y$ itself.

      Read it as a forecast: $\mathbb{E}[X\mid Y]$ is "my best guess at $X$,
      as a rule that updates once I see $Y$" — before observing $Y$ you can
      already write down what your estimate of $X$ will be for every
      possible outcome, and observing $Y$ just tells you which branch of
      that rule you landed on. This is why $\mathbb{E}[X\mid Y]$ can be
      added, squared, or averaged like any other random variable — it
      appears on both sides of the tower property precisely because it is
      one, not a placeholder for "the number you'd get if you conditioned."

      It is defined only up to values $y$ that $Y$ never takes — nothing
      forces $g$ to be sensible off the support of $Y$, since those values
      never get used.
    worked: >
      Let $N$ be the number showing on a fair die and, given $N=n$, let $X$
      be uniform on $\{1,\dots,n\}$. Then $g(n) = \mathbb{E}[X\mid N=n] =
      (n+1)/2$, so $\mathbb{E}[X\mid N] = (N+1)/2$ — a random variable taking
      value $1$ when $N=1$, value $3.5$ when $N=6$, and so on, still random
      until the die is rolled.
    interview: >
      "Is $\mathbb{E}[X\mid Y]$ a number or a random variable" is asked
      almost verbatim; the fluent answer distinguishes it from
      $\mathbb{E}[X\mid Y=y]$ in one breath and states that
      $\mathbb{E}[X\mid Y]$ is a function of $Y$, hence random exactly to
      the extent $Y$ is.
    pitfalls: >
      Writing $\mathbb{E}[X\mid Y]=c$ for a constant $c$ silently assumes
      independence, which hasn't been given — check the algebra of
      conditional expectation before collapsing it. Treating
      $\mathbb{E}[X\mid Y=y]$ and $\mathbb{E}[X\mid Y]$ as interchangeable
      notation loses exactly the distinction the tower property and total
      variance depend on.
    recap: >
      $\mathbb{E}[X\mid Y] = g(Y)$ packages the numbers $\mathbb{E}[X\mid
      Y=y]$ into a single random variable — your forecast of $X$ as a rule
      that resolves once $Y$ is observed.
    dialogue:
      - part: A forecast written before the roll
        teach: >
          A four-sided die is rolled and shows $Y$, from $1$ to $4$. Then $Y$
          ordinary six-sided dice are rolled, and $X$ is their total. You are
          asked to forecast $X$.
      - ask: >
          Suppose you have seen the four-sided die show $3$. What is your
          forecast, $\mathbb{E}[X \mid Y = 3]$?
        expects: "10.5"
        feedback: >
          Given $Y = 3$, $X$ is the total of three fair dice, so its mean is
          $3 \times 3.5 = 10.5$.
      - ask: >
          Now the four-sided die has not been rolled yet, and your manager
          wants "the forecast of $X$ given the four-sided die", written down
          now. Which answer is complete?
        choices:
          - text: >
              $10.5$
            feedback: >
              That is the forecast after a $3$. The die has not been rolled,
              and if it shows a $1$ that number will be badly wrong.
          - text: >
              $8.75$, the average of $3.5$, $7$, $10.5$ and $14$.
            feedback: >
              That is the forecast of someone who will never see the
              four-sided die. Your manager asked for one that uses it, and
              $8.75$ is the same whatever the die shows.
          - text: >
              $3.5$ times whatever the four-sided die shows.
            correct: true
            feedback: >
              A rule, written before the roll, that turns into a number the
              moment $Y$ is seen: $3.5$, $7$, $10.5$ or $14$.
        feedback: >
          The forecast that uses $Y$ cannot be a single number written before
          $Y$ is known. It has to be a recipe in $Y$.
      - reflect: >
          The complete answer, $3.5Y$, is not a number. What kind of object
          is it, and where does its randomness come from?
        answer: >
          It is a function of $Y$ evaluated at the random $Y$: a random
          variable. It is determined completely once $Y$ is seen, and before
          that it is as uncertain as $Y$ itself, taking the value $3.5y$ with
          probability $\Pr(Y = y)$. All its randomness is borrowed from $Y$;
          none comes from the six-sided dice, which have been averaged away.

      - part: Two objects with one name
        teach: >
          That object is the conditional expectation. For each $y$, the number
          $g(y) = \mathbb{E}[X \mid Y = y]$ is an ordinary mean, taken against
          the conditional law of $X$ given $Y = y$. Then $\mathbb{E}[X \mid Y]$
          is defined as $g(Y)$: the same function, fed the random $Y$. Here
          $g(y) = 3.5y$, so $\mathbb{E}[X \mid Y] = 3.5Y$. One is a number you
          can quote; the other is a forecast that moves with the data.
      - ask: >
          How many different values can $\mathbb{E}[X \mid Y]$ take in this
          game?
        expects: "4"
        feedback: >
          One per value of $Y$: $3.5$, $7$, $10.5$, $14$. The conditional
          expectation can never take more values than $Y$ does.
      - ask: >
          What is the probability that $\mathbb{E}[X \mid Y] \ge 10$?
        expects: "1/2"
        hint: >
          Which values of $Y$ produce a forecast of at least $10$?
        feedback: >
          $3.5Y \ge 10$ exactly when $Y \ge 3$, which has probability
          $2/4 = 1/2$. The forecast inherits its distribution from $Y$.
      - ask: >
          Same four-sided die, but now $X$ is the number of sixes among the
          $Y$ dice. Which is $\mathbb{E}[X \mid Y]$?
        choices:
          - text: >
              $1/6$
            feedback: >
              That is the chance each die shows a six. Three dice produce
              more sixes on average than one, so the forecast must grow with
              $Y$.
          - text: >
              $5/12$
            feedback: >
              That is $\mathbb{E}[X]$, the forecast that ignores $Y$:
              $\mathbb{E}[Y]/6 = 2.5/6$. A constant cannot be the forecast
              given $Y$ when $Y$ plainly matters.
          - text: >
              $Y/6$
            correct: true
            feedback: >
              Given $Y = y$, $X$ is binomial with $y$ trials and success
              chance $1/6$, mean $y/6$. Feed in the random $Y$.
        feedback: >
          Find $g(y)$ by fixing $y$ and computing an ordinary mean, then
          replace $y$ by $Y$. Both steps are needed.

      - part: Any shape, and only where Y lives
        ask: >
          Back to the joint density $x + y$ on the unit square, where
          $f_{X \mid Y}(x \mid y) = (x + y)/(1/2 + y)$. What is
          $\mathbb{E}[X \mid Y = 0]$?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          At $y = 0$ the conditional density is $2x$.
        feedback: >
          $\int_0^1 x \cdot 2x\,dx = 2/3$. In general
          $g(y) = (1/3 + y/2)/(1/2 + y)$, which falls from $2/3$ at $y = 0$ to
          $5/9$ at $y = 1$: $\mathbb{E}[X \mid Y] = g(Y)$ need not be linear in
          $Y$, or anything else in particular.
      - ask: >
          In the dice game, a candidate writes $\mathbb{E}[X \mid Y] = 8.75$.
          What is the verdict?
        choices:
          - text: >
              Correct: $8.75$ is the expected value of $X$, and conditioning
              does not change expectations.
            feedback: >
              Conditioning on $Y = 1$ gives $3.5$ and on $Y = 4$ gives $14$.
              The conditional mean visibly moves with $Y$.
          - text: >
              Wrong: $8.75$ is $\mathbb{E}[X]$, and writing a constant claims
              $Y$ tells you nothing about the mean of $X$.
            correct: true
            feedback: >
              A constant forecast would mean every slice $Y = y$ has the same
              mean, and here no two slices do.
          - text: >
              Half right: it is correct on average, so it is an acceptable
              shorthand.
            feedback: >
              A forecast that is right on average and wrong on every roll is
              not a shorthand for one that is right on each roll. The two
              objects answer different questions.
        feedback: >
          $\mathbb{E}[X \mid Y]$ collapses to a constant only when $Y$ carries
          no information about the mean of $X$. Asserting a constant asserts
          that.
      - ask: >
          In the dice game, what is $\mathbb{E}[X \mid Y = 5]$?
        choices:
          - text: >
              $17.5$, from $g(y) = 3.5y$.
            feedback: >
              The formula extends to $y = 5$, but nothing in the problem does:
              $Y$ never shows $5$, so there is no conditional law there to
              average.
          - text: >
              Undefined, and it never matters: $Y$ takes only the values $1$
              to $4$.
            correct: true
            feedback: >
              $g$ is pinned down only on values $Y$ actually takes. Off them
              you may set it to anything, because $g(Y)$ never evaluates
              there.
          - text: >
              $0$, since the event has probability zero.
            feedback: >
              An impossible event does not make the conditional mean zero; it
              makes it unconstrained. $0$ is no more right than $17.5$.
        feedback: >
          $\mathbb{E}[X \mid Y]$ is defined only up to values $Y$ never takes,
          which costs nothing because those values are never used.
      - teach: >
          Asked "is $\mathbb{E}[X \mid Y]$ a number or a random variable?",
          say both objects in one breath: "$\mathbb{E}[X \mid Y = y]$ is a
          number for each $y$; $\mathbb{E}[X \mid Y]$ is that function applied
          to $Y$, so it is random exactly as far as $Y$ is."

  - node: quant-probability.conditioning.conditional-expectation-rules
    hook: >
      These four rules are what actually gets used in an interview —
      recognising "this factor is already known given $Y$" or "these are
      independent" turns a page of conditioning into one line.
    explanation: >
      Each rule is conditional expectation inheriting a property of ordinary
      expectation, applied inside the conditional law for each fixed $y$ and
      repackaged as a random variable in $Y$. Linearity is nothing but
      linearity of the ordinary average, done separately for every $y$.
      Taking out what's known works because, once $Y=y$ is fixed,
      $h(Y)=h(y)$ is a plain constant inside that averaging, and constants
      factor out of an expectation.

      Independence collapsing $\mathbb{E}[X\mid Y]$ to $\mathbb{E}[X]$ is
      the sharpest rule to recognise fast: if $Y$ carries no information
      about $X$, the conditional law of $X$ given $Y=y$ is the same
      distribution for every $y$ — $X$'s own marginal law — so its mean
      doesn't depend on $y$ at all; the "random variable" $g(Y)$ is secretly
      the constant $\mathbb{E}[X]$.

      The last rule, $\mathbb{E}[h(Y)\mid Y]=h(Y)$, says conditioning on $Y$
      can't change anything already determined by $Y$ — there's no residual
      randomness left to average over. It looks trivial stated abstractly,
      but it's the rule that recurs constantly inside multi-step
      calculations where part of the expression is already a function of
      the conditioning variable.
    worked: >
      Let $Y$ be the number of items sold in a day and $X$ be the profit per
      item, independent of $Y$ with $\mathbb{E}[X]=4$, and let the day's
      fixed rent be a constant $100$. The day's total profit is $YX-100$.
      Taking out what's known applied to $YX$ gives $\mathbb{E}[YX\mid Y] =
      Y\,\mathbb{E}[X\mid Y]$, and independence collapses $\mathbb{E}[X\mid
      Y]$ to $\mathbb{E}[X]=4$, so $\mathbb{E}[YX-100\mid Y] = 4Y-100$. On a
      day with $Y=25$ items sold, this evaluates to $4(25)-100=0$ —
      break-even at exactly $25$ items, read off the linear rule without
      ever specifying $X$'s full distribution.
    interview: >
      "Simplify $\mathbb{E}[Y^{2}X\mid Y]$" is testing whether you instantly
      pull $Y^{2}$ out as known and leave $\mathbb{E}[X\mid Y]$ alone — say
      "$Y^{2}$ is determined by the conditioning, so it comes out" rather
      than expanding anything.
    pitfalls: >
      Pulling $X$ itself out of $\mathbb{E}[h(Y)X\mid Y]$ alongside $h(Y)$
      is the classic slip — only functions of the conditioning variable
      factor out, never the variable being averaged. Applying the
      independence rule just because $X$ and $Y$ "seem unrelated," without
      independence actually holding, is unjustified; state the hypothesis.
    recap: >
      Conditional expectation is linear, lets you factor out anything
      already determined by $Y$, collapses to $\mathbb{E}[X]$ under
      independence, and leaves functions of $Y$ untouched — four moves that
      cover most conditioning algebra.
    dialogue:
      - part: A payout you can price after the roll
        teach: >
          A fair six-sided die shows $Y$. Separately, three fair coins are
          tossed and $H$ counts the heads, so the coins know nothing about the
          die. The game pays $Y^{2}H - 2Y$.
      - ask: >
          The die has landed on $4$. What is the expected payout now?
        expects: "16"
        hint: >
          With $Y = 4$ fixed, only $H$ is still random.
        feedback: >
          The payout is $16H - 8$, and $\mathbb{E}[H] = 3/2$, so
          $16(1.5) - 8 = 16$.
      - ask: >
          And if the die had landed on $1$?
        expects: "-0.5"
        feedback: >
          The payout is $H - 2$, with mean $1.5 - 2 = -0.5$. The game is a
          loser on a $1$ and a winner on a $4$.
      - reflect: >
          To get $16$ you made several moves without a second thought. Name
          each one, and say what made it legal.
        hint: >
          What happened to $Y^{2}$, to $-2Y$, and to the mean of $H$ once the
          die was known?
        answer: >
          You split the mean of a sum into a sum of means, which is linearity.
          You pulled $16 = Y^{2}$ outside the mean of $16H$, legal because once
          $Y$ is known it is a constant. You left $-8 = -2Y$ alone, because a
          known quantity has nothing left to average. And you used
          $\mathbb{E}[H] = 1.5$ unchanged, legal only because the coins ignore
          the die. Those four moves are the whole algebra of conditional
          expectation.

      - part: Four rules, and why they hold
        teach: >
          Written as statements about random variables, with all means finite:
          linearity, $\mathbb{E}[aX + bZ \mid Y] = a\mathbb{E}[X \mid Y] +
          b\mathbb{E}[Z \mid Y]$; taking out what is known,
          $\mathbb{E}[h(Y)X \mid Y] = h(Y)\mathbb{E}[X \mid Y]$; independence,
          $\mathbb{E}[X \mid Y] = \mathbb{E}[X]$ when $X$ and $Y$ are
          independent; and $\mathbb{E}[h(Y) \mid Y] = h(Y)$.
      - ask: >
          What makes taking out what is known true?
        choices:
          - text: >
              $h(Y)$ and $X$ are independent, so the mean of the product
              factors.
            feedback: >
              No independence is needed, and none is claimed. The rule holds
              when $X$ depends heavily on $Y$, as you will see in a moment.
          - text: >
              $\mathbb{E}[h(Y)X] = \mathbb{E}[h(Y)]\,\mathbb{E}[X]$ for any
              pair of variables.
            feedback: >
              That unconditional factoring is false in general: take
              $h(Y) = Y$ and $X = Y$, where it would say
              $\mathbb{E}[Y^{2}] = (\mathbb{E}[Y])^{2}$.
          - text: >
              Fixing $Y = y$ makes $h(Y) = h(y)$ a constant, and constants come
              out of an ordinary expectation.
            correct: true
            feedback: >
              Every rule is an ordinary fact about means, applied inside the
              conditional law for each fixed $y$ and then read as a function
              of $Y$.
        feedback: >
          The proof of each rule is one line: fix $y$, use the ordinary
          property of expectation, let $y$ vary again.
      - ask: >
          Which is $\mathbb{E}[Y^{2}H - 2Y \mid Y]$ for the original game?
        choices:
          - text: >
              $Y^{2}H - 2Y$
            feedback: >
              Nothing has been averaged: $H$ is still inside, so this is the
              payout itself, not a forecast that is a function of $Y$.
          - text: >
              $1.5\,\mathbb{E}[Y^{2}] - 2\mathbb{E}[Y]$
            feedback: >
              That averages the die away as well, giving the unconditional
              mean. Given $Y$, the die is known and stays as $Y$.
          - text: >
              $1.5Y^{2} - 2Y$
            correct: true
            feedback: >
              Linearity splits it, $Y^{2}$ comes out, independence turns
              $\mathbb{E}[H \mid Y]$ into $1.5$, and $-2Y$ passes through. At
              $Y = 4$ it is $16$, as you found.
        feedback: >
          The forecast is a function of $Y$ alone. If an $H$ survives, a step
          was skipped.

      - part: When the coins listen to the die
        ask: >
          Change the game: the die shows $Y$, and then $Y$ fair coins are
          tossed, with $H$ the number of heads. Now $H$ depends on $Y$. What is
          $\mathbb{E}[YH \mid Y = 4]$?
        expects: "8"
        hint: >
          Given $Y = 4$, four coins are tossed.
        feedback: >
          $\mathbb{E}[YH \mid Y = 4] = 4\,\mathbb{E}[H \mid Y = 4] = 4 \times 2
          = 8$. Taking out what is known worked although $H$ and $Y$ are
          strongly dependent.
      - ask: >
          In this new game a candidate writes $\mathbb{E}[H \mid Y] =
          \mathbb{E}[H] = 1.75$. What is the verdict?
        choices:
          - text: >
              Correct: $\mathbb{E}[H] = \mathbb{E}[Y]/2 = 1.75$.
            feedback: >
              $\mathbb{E}[H] = 1.75$ is right, but it is not
              $\mathbb{E}[H \mid Y]$. Given $Y = 6$ you expect $3$ heads, not
              $1.75$.
          - text: >
              Wrong: the independence rule needs independence, and here the
              number of coins is the die.
            correct: true
            feedback: >
              $\mathbb{E}[H \mid Y] = Y/2$, which moves with $Y$. Collapsing
              it to a constant asserts that $Y$ says nothing about $H$.
          - text: >
              Wrong, but only because it should be $\mathbb{E}[H \mid Y] = 3$,
              the most heads possible on average.
            feedback: >
              $3$ is the forecast after a $6$. Given $Y$, the forecast is
              $Y/2$, which runs from $0.5$ to $3$.
        feedback: >
          Of the four rules, only independence has a hypothesis you must
          check. State it before using it.
      - ask: >
          A candidate simplifies $\mathbb{E}[Y^{2}H \mid Y]$ to $Y^{2}H$. What
          went wrong?
        choices:
          - text: >
              Nothing: both $Y^{2}$ and $H$ are random, so both stay.
            feedback: >
              Given $Y$, the factor $Y^{2}$ is known and the factor $H$ is not.
              Only the unknown factor is averaged, and it was not.
          - text: >
              $H$ was pulled out alongside $Y^{2}$, but $H$ is the thing being
              averaged.
            correct: true
            feedback: >
              The right answer is $Y^{2}\,\mathbb{E}[H \mid Y] = Y^{3}/2$ in
              the new game. Only functions of $Y$ come out.
          - text: >
              $Y^{2}$ should have stayed inside, since only constants factor
              out.
            feedback: >
              Given $Y$, a function of $Y$ is a constant. That is the whole
              content of taking out what is known.
        feedback: >
          The test for what comes out is one question: is it determined by
          $Y$? $Y^{2}$ is; $H$ is not.
      - ask: >
          Still in the new game, which is
          $\mathbb{E}[\mathbb{E}[H \mid Y] \cdot H \mid Y]$?
        choices:
          - text: >
              $\mathbb{E}[H^{2} \mid Y]$
            feedback: >
              That treats $\mathbb{E}[H \mid Y]$ as if it were $H$. It is a
              forecast of $H$, not $H$.
          - text: >
              $(Y/2)\,H$
            feedback: >
              $Y/2$ came out correctly, but the remaining $H$ was never
              averaged.
          - text: >
              $Y^{2}/4$
            correct: true
            feedback: >
              $\mathbb{E}[H \mid Y] = Y/2$ is a function of $Y$, so it comes
              out, leaving $(Y/2)\,\mathbb{E}[H \mid Y] = Y^{2}/4$.
          - text: >
              $1.75^{2}$
            feedback: >
              That applies the independence rule twice to a pair that is not
              independent.
        feedback: >
          A conditional expectation given $Y$ is itself a function of $Y$, so
          it is known given $Y$ and can be taken out. That move does a lot of
          work in the proofs ahead.
      - teach: >
          Asked to simplify $\mathbb{E}[Y^{2}X \mid Y]$, an interviewer wants
          one sentence: "$Y^{2}$ is known given $Y$, so it comes out, and
          $\mathbb{E}[X \mid Y]$ stays unless I know $X$ is independent of
          $Y$."

  - node: quant-probability.conditioning.indicator-conditional
    hook: >
      "What's the probability of $A$" and "what's the expected number of
      $A$-type events" are the same computation wearing different words, and
      seeing that saves you from learning two separate toolkits.
    explanation: >
      An indicator $\mathbf{1}\{A\}$ takes only the values $0$ and $1$, and
      its expectation given anything is, by the ordinary definition of
      expectation, $1\cdot\Pr(A\mid\cdot)+0\cdot\Pr(A^{c}\mid\cdot) =
      \Pr(A\mid\cdot)$ — conditional expectation applied to an indicator is
      conditional probability by construction, not by a separate theorem.

      Concretely, $\mathbb{E}[\mathbf{1}\{A\}\mid Y]$ is the random variable
      whose value at $Y=y$ is the number $\Pr(A\mid Y=y)$ — the ordinary
      conditional probability of $A$ given the event $\{Y=y\}$, nothing new
      needing to be defined. This node just names the special case.

      Practically, this collapses two toolkits into one: any fact proved
      later in this unit about conditional expectations — how they average,
      how they split variance — applies automatically to conditional
      probabilities once you first write $\Pr(A\mid Y) =
      \mathbb{E}[\mathbf{1}\{A\}\mid Y]$. "What's the chance of $A$" and
      "what's the expected number of $A$-type events" become, after that
      substitution, literally the same computation.
    worked: >
      Roll a fair die to get $Y$, then flip a fair coin $Y$ times; let $A$
      be "at least one flip lands heads." For $Y=3$,
      $\mathbb{E}[\mathbf{1}\{A\}\mid Y=3] = \Pr(A\mid Y=3) = 1-(1/2)^{3} =
      7/8$, since $A^{c}$ given $Y=3$ means all three flips are tails,
      probability $(1/2)^{3}$. The expectation of the indicator and the
      conditional probability are not two separate quantities to compute —
      they're the same $7/8$ by definition.
    interview: >
      When a question asks for a probability but the natural route only
      makes sense in expectation language — a continuous conditioning
      variable, a sum you'd rather average — say "write it as
      $\mathbb{E}[\mathbf{1}\{A\}\mid Y]$" out loud; it signals probability
      and expectation aren't two subjects here.
    pitfalls: >
      Trying to prove a fact about conditional probabilities from scratch,
      instead of reusing an already-proved conditional-expectation identity
      via the indicator trick, wastes time on an interview clock. This
      substitution is licensed only for indicators of genuine events, not
      for general "probability-like" quantities dressed up the same way.
    recap: >
      $\Pr(A\mid Y) = \mathbb{E}[\mathbf{1}\{A\}\mid Y]$ means every tool
      built for conditional expectations is already a tool for conditional
      probabilities, with no separate theory required.
    dialogue:
      - part: Two questions with one answer
        teach: >
          You route an order to $Y$ venues, where $Y$ is equally likely to be
          $1$, $2$ or $3$. Each venue fills it independently with probability
          $0.4$. Let $A$ be the event that at least one venue fills, and let
          $F = \mathbf{1}\{A\}$, which is $1$ on a fill and $0$ otherwise.
      - ask: >
          Given $Y = 2$, what is the probability that at least one venue
          fills?
        expects: "0.64"
        hint: >
          Go through the complement: both venues miss.
        feedback: >
          Both miss with probability $0.6^{2} = 0.36$, so
          $\Pr(A \mid Y = 2) = 1 - 0.36 = 0.64$.
      - ask: >
          Given $Y = 2$, what is $\mathbb{E}[F \mid Y = 2]$?
        expects: "0.64"
        feedback: >
          $F$ is $1$ with conditional probability $0.64$ and $0$ otherwise, so
          its conditional mean is $1(0.64) + 0(0.36) = 0.64$. The same number
          twice.
      - reflect: >
          Why must those two numbers agree, for every value of $Y$ and every
          event $A$, and not just in this example?
        answer: >
          An indicator takes only the values $0$ and $1$, so its mean under
          any law, conditional or not, is $1 \cdot \Pr(A) + 0 \cdot
          \Pr(A^{c}) = \Pr(A)$ for that law. Fix $Y = y$ and apply that to the
          conditional law: $\mathbb{E}[\mathbf{1}\{A\} \mid Y = y] =
          \Pr(A \mid Y = y)$. There is nothing to prove beyond the definition
          of an expectation.

      - part: One toolkit, not two
        teach: >
          So $\mathbb{E}[\mathbf{1}\{A\} \mid Y] = \Pr(A \mid Y)$: the random
          variable whose value at $Y = y$ is $\Pr(A \mid Y = y)$. Here
          $\Pr(A \mid Y) = 1 - 0.6^{Y}$. The payoff is that every rule you have
          for conditional expectations is, without a new proof, a rule for
          conditional probabilities.
      - ask: >
          What is $\Pr(A)$, before $Y$ is known?
        expects: "0.608"
        hint: >
          Average $\Pr(A \mid Y = y)$ over the three equally likely values of
          $y$.
        feedback: >
          $\Pr(A \mid Y = y)$ is $0.4$, $0.64$ and $0.784$ for $y = 1, 2, 3$,
          and total probability gives $(0.4 + 0.64 + 0.784)/3 = 1.824/3 =
          0.608$. You averaged the random variable $\Pr(A \mid Y)$ over $Y$.
      - ask: >
          If anything fills, you collect a rebate of $Y$ dollars, one rebate
          however many venues fill. Given $Y = 3$, what is the expected rebate
          in dollars?
        expects: "2.352"
        hint: >
          The rebate is $Y\mathbf{1}\{A\}$. What can come out given $Y$?
        feedback: >
          Taking out what is known: $\mathbb{E}[Y\mathbf{1}\{A\} \mid Y] =
          Y\Pr(A \mid Y)$. At $Y = 3$ that is $3(1 - 0.216) = 3(0.784) =
          2.352$.
      - ask: >
          Which statement about conditional probabilities comes free from the
          rules for conditional expectation?
        choices:
          - text: >
              If $A$ is independent of $Y$, then $\Pr(A \mid Y) = \Pr(A)$.
            correct: true
            feedback: >
              The independence rule applied to the indicator: if
              $\mathbf{1}\{A\}$ is independent of $Y$, its conditional mean is
              its plain mean, $\Pr(A)$.
          - text: >
              $\Pr(A \cup B \mid Y) = \Pr(A \mid Y) + \Pr(B \mid Y)$ for any
              events $A$, $B$.
            feedback: >
              Linearity applies to $\mathbf{1}\{A \cup B\}$, which equals
              $\mathbf{1}\{A\} + \mathbf{1}\{B\} - \mathbf{1}\{A \cap B\}$, so
              the overlap term survives unless $A$ and $B$ are disjoint.
          - text: >
              $\Pr(A \mid Y) \ge \Pr(A)$, because conditioning adds
              information.
            feedback: >
              Information can lower a probability as easily as raise it: here
              $\Pr(A \mid Y = 1) = 0.4$ sits below $\Pr(A) = 0.608$.
        feedback: >
          Write the probability as the mean of an indicator, apply the rule,
          and read the answer back as a probability.

      - part: Where the substitution stops
        ask: >
          Let $N$ be the number of venues that fill. What is
          $\mathbb{E}[N \mid Y = 3]$?
        expects: "1.2"
        feedback: >
          $N$ given $Y = 3$ is binomial with $3$ trials and success chance
          $0.4$, so its mean is $3(0.4) = 1.2$.
      - ask: >
          $\mathbb{E}[N \mid Y = 3] = 1.2$, more than $1$. Why is it not a
          conditional probability, when $\mathbb{E}[F \mid Y = 3]$ was?
        choices:
          - text: >
              It is one; probabilities above $1$ just mean the event is very
              likely.
            feedback: >
              No probability exceeds $1$. The number $1.2$ is an expected
              count, and it is allowed to.
          - text: >
              $N$ is not an indicator: it can be $2$ or $3$, so its mean
              counts multiple fills more than once.
            correct: true
            feedback: >
              The identity needs a variable that is $1$ on the event and $0$
              off it. $N = F$ only when at most one fill is possible.
          - text: >
              It would be one if the venues were not independent.
            feedback: >
              Dependence changes the value of $\mathbb{E}[N \mid Y]$, not what
              kind of object it is. A count with values above $1$ is never an
              indicator.
        feedback: >
          "Expected number of $A$-type events" and "probability of $A$" are the
          same computation exactly when the count is an indicator; otherwise
          the count is a sum of indicators, and its mean is a sum of
          probabilities.
      - teach: >
          When a probability resists you, say "write it as
          $\mathbb{E}[\mathbf{1}\{A\} \mid Y]$" out loud and condition. It
          tells the interviewer you see probability and expectation as one
          subject, and it hands you every conditioning move at once.

  - node: quant-probability.conditioning.tower
    hook: >
      This is the single identity you'll use most in this unit — "condition
      on the first thing, average back" is the plan behind most hard
      interview probability questions, and the tower property is why
      averaging back is legitimate.
    explanation: >
      The claim: averaging the conditional forecasts $\mathbb{E}[X\mid Y]$
      over the possible values of $Y$, weighted by how likely each is,
      returns exactly the unconditional mean $\mathbb{E}[X]$. In the
      discrete case this is literally the law of total expectation,
      $\mathbb{E}[X] = \sum_y \mathbb{E}[X\mid Y=y]\Pr(Y=y)$ — expand
      $\mathbb{E}[X\mid Y=y]$ using the conditional law, and the double sum
      over $x$ and $y$ collapses back to $\sum_x x\Pr(X=x)$ by regrouping,
      since summing $\Pr(X=x,Y=y)$ over $y$ recovers $\Pr(X=x)$.

      Applying it to $X=\mathbf{1}\{A\}$ recovers the law of total
      probability exactly: $\mathbb{E}[\mathbf{1}\{A\}\mid Y=y]$ is just
      $\Pr(A\mid Y=y)$ by definition of conditioning on $\{Y=y\}$, so
      $\Pr(A) = \sum_y \Pr(A\mid Y=y)\Pr(Y=y)$ falls straight out of the
      discrete form above — total variance's within/between split, met
      next, is another instance of this one theorem, not a separate fact.

      The intuitive content is that a forecast cannot be biased on average:
      whatever rule updates your estimate of $X$ once $Y$ is revealed,
      averaging that rule's output over every possible $Y$ has to land back
      on the unconditional mean, because you haven't actually gained or
      lost information by construction — you're re-deriving the same
      average a different way.
    worked: >
      A student's exam score depends on which of two study methods they
      used, each equally likely: method $A$ yields a mean score of $70$,
      method $B$ a mean score of $85$. By the tower property,
      $\mathbb{E}[\text{score}] = 0.5(70)+0.5(85) = 77.5$ — averaging the
      two conditional means with the method probabilities as weights
      recovers the overall expected score directly, with no need to know
      the full score distribution under either method.
    interview: >
      "How do you compute an unconditional expectation when the problem
      naturally splits into cases" is answered by naming the tower property
      and writing the weighted sum of conditional means immediately — the
      interviewer is checking you reach for conditioning as a first move,
      not a last resort.
    pitfalls: >
      Averaging the conditional means with the wrong weights — counts
      instead of probabilities, or a forgotten case — silently corrupts the
      total. The identity needs $\mathbb{E}|X|<\infty$; without it,
      $\mathbb{E}[X\mid Y]$ can fail to be well-defined for some $y$ and the
      averaging step has nothing to work with.
    recap: >
      $\mathbb{E}[\mathbb{E}[X\mid Y]] = \mathbb{E}[X]$ — averaging the
      conditional forecasts over $Y$'s distribution recovers the
      unconditional mean, and total probability is the special case where
      $X$ is an indicator.
    dialogue:
      - part: A stick broken twice
        teach: >
          A stick of length $1$ is broken at a uniformly random point, and you
          keep the left piece, of length $Y$. That piece is broken at a
          uniformly random point along it, and you keep its left piece, of
          length $X$. The interviewer wants $\mathbb{E}[X]$.
      - ask: >
          Suppose the first break left $Y = 0.6$. What is
          $\mathbb{E}[X \mid Y = 0.6]$?
        expects: "0.3"
        feedback: >
          Given $Y = 0.6$, the second break is uniform on $(0, 0.6)$, so $X$
          is too, with mean $0.3$. In general $\mathbb{E}[X \mid Y] = Y/2$.
      - ask: >
          The direct route to $\mathbb{E}[X]$ goes through the distribution of
          $X$. What is it?
        choices:
          - text: >
              Uniform on $(0, 1)$, since both breaks are uniform.
            feedback: >
              $X$ is at most $Y$, which is itself usually well short of $1$.
              Small values are far more likely than large ones, so $X$ cannot
              be flat on $(0, 1)$.
          - text: >
              Uniform on $(0, 1/2)$, since on average you keep half.
            feedback: >
              $X$ can exceed $1/2$: if $Y = 0.9$ and the second break falls
              late, it does. Averages do not fix supports.
          - text: >
              Neither: it is some lopsided law you would have to derive first.
            correct: true
            feedback: >
              It has density $-\ln x$ on $(0, 1)$, which takes an integral to
              find. Fine at a desk, slow at a whiteboard, and as it turns out
              unnecessary.
        feedback: >
          The law of $X$ is the hard object here. The conditional law of $X$
          given $Y$ is the easy one.
      - reflect: >
          You know $\mathbb{E}[X \mid Y = y] = y/2$ for every $y$, and you
          know how $Y$ is distributed. How could you get $\mathbb{E}[X]$
          without ever finding the law of $X$, and why should that work?
        hint: >
          You have met this move for probabilities, splitting on cases and
          weighting each case by its chance.
        answer: >
          Average the conditional forecasts, weighting each value of $Y$ by
          how likely it is: $\mathbb{E}[X] = \mathbb{E}[Y/2]$. It works for the
          same reason the law of total probability does: splitting on the
          value of $Y$ partitions the outcomes, each piece contributes its own
          average times its own probability, and the pieces add back up to
          the whole.
      - ask: >
          What is $\mathbb{E}[X]$?
        expects: "1/4"
        feedback: >
          $\mathbb{E}[X] = \mathbb{E}[Y/2] = (1/2)(1/2) = 1/4$. No density of
          $X$ was needed.

      - part: Averaging the forecasts
        teach: >
          That is the tower property: if $\mathbb{E}|X| < \infty$ then
          $\mathbb{E}[\mathbb{E}[X \mid Y]] = \mathbb{E}[X]$. A forecast cannot
          be biased on average. For discrete $Y$ it reads $\mathbb{E}[X] =
          \sum_y \mathbb{E}[X \mid Y = y]\Pr(Y = y)$, the law of total
          expectation, and with $X = \mathbf{1}\{A\}$ it is exactly the law of
          total probability.
      - ask: >
          For discrete $Y$, write $\mathbb{E}[X \mid Y = y] = \sum_x x\,p(x,
          y)/p_Y(y)$ and multiply by $p_Y(y)$. Summing over $y$, which step
          finishes the proof?
        choices:
          - text: >
              The $p_Y(y)$ cancels, leaving $\sum_y \sum_x x\,p(x, y)$; summing
              $p(x, y)$ over $y$ gives $p_X(x)$, so this is $\sum_x x\,p_X(x)$.
            correct: true
            feedback: >
              Swap the order of summation and the marginal appears. That
              regrouping is the whole proof.
          - text: >
              Each $\sum_x x\,p(x, y)/p_Y(y)$ equals $\mathbb{E}[X]$, so the
              weighted sum is $\mathbb{E}[X]$ times $\sum_y p_Y(y) = 1$.
            feedback: >
              Each slice's mean is $\mathbb{E}[X \mid Y = y]$, which in the
              stick problem ran from near $0$ to near $1/2$. They agree with
              $\mathbb{E}[X]$ only when $Y$ is uninformative.
          - text: >
              Independence of $X$ and $Y$ lets the double sum factor.
            feedback: >
              No independence is assumed, and the stick pieces are strongly
              dependent. The identity holds for any joint law with
              $\mathbb{E}|X| < \infty$.
        feedback: >
          Conditioning slices the joint law; weighting the slices by
          $p_Y(y)$ and summing glues it back together. Nothing is gained or
          lost.
      - ask: >
          Break the kept piece a third time, at a uniform point along it, and
          keep the left part, of length $Z$. What is $\mathbb{E}[Z]$?
        expects: "1/8"
        hint: >
          What is $\mathbb{E}[Z \mid X]$?
        feedback: >
          $\mathbb{E}[Z \mid X] = X/2$, so $\mathbb{E}[Z] = \mathbb{E}[X]/2 =
          1/8$. Each break halves the mean, one tower step at a time.
      - ask: >
          Back to two breaks. What is $\Pr(X < 1/4)$? Use the indicator form:
          average $\Pr(X < 1/4 \mid Y)$ over $Y$.
        expects: "0.5966"
        tolerance: 0.001
        hint: >
          Given $Y = y$, the chance is $1$ if $y \le 1/4$ and $1/(4y)$
          otherwise.
        feedback: >
          $\int_0^{1/4} 1\,dy + \int_{1/4}^{1} \frac{1}{4y}\,dy = 1/4 +
          (1/4)\ln 4 \approx 0.25 + 0.3466 = 0.5966$. Most of the mass of $X$
          sits below its mean of $1/4$, the lopsidedness you were spared.

      - part: Wrong weights, and a missing hypothesis
        ask: >
          Half of a city's buses carry $10$ passengers and half carry $50$.
          A passenger is picked at random from everyone riding. What is the
          expected size of that passenger's bus?
        choices:
          - text: >
              $30$, averaging $10$ and $50$ with weights $1/2$ each.
            feedback: >
              Those are the chances for a randomly picked bus. The experiment
              picks a passenger, and $50$-passenger buses hold five sixths of
              all passengers.
          - text: >
              $130/3 \approx 43.3$
            correct: true
            feedback: >
              Under the passenger experiment the weights are $1/6$ and $5/6$,
              so $(1/6)(10) + (5/6)(50) = 130/3$.
          - text: >
              $50$, since a random passenger is almost surely on a big bus.
            feedback: >
              Five in six of them are, not all. One passenger in six rides a
              $10$-seat bus, and that pulls the mean down to about $43.3$.
        feedback: >
          The weights in the tower are $\Pr(Y = y)$ under the experiment you
          are actually running. Swap in the probabilities of a different
          experiment and the identity breaks.
      - ask: >
          $\Pr(Y = k) = 2^{-k}$ for $k = 1, 2, \dots$, and given $Y = k$,
          $X$ is $+2^{k}$ or $-2^{k}$ with probability $1/2$ each. So
          $\mathbb{E}[X \mid Y] = 0$. A candidate concludes $\mathbb{E}[X] =
          0$ by the tower property. What is the verdict?
        choices:
          - text: >
              Right: $\mathbb{E}[\mathbb{E}[X \mid Y]] = \mathbb{E}[0] = 0$.
            feedback: >
              The tower needs $\mathbb{E}|X| < \infty$, and here
              $\mathbb{E}|X| = \sum_k 2^{-k} \cdot 2^{k} = \infty$.
          - text: >
              Right by symmetry: $X$ and $-X$ have the same law.
            feedback: >
              Symmetry suggests $0$, but the positive part alone has mean
              $\sum_k 2^{-k}(1/2)2^{k} = \infty$, and so does the negative
              part. The mean would be $\infty - \infty$.
          - text: >
              Wrong: $\mathbb{E}|X| = \infty$, so $\mathbb{E}[X]$ does not
              exist, and the tower property does not apply.
            correct: true
            feedback: >
              Every conditional mean is finite and every one is $0$, yet there
              is no unconditional mean to recover. The hypothesis is doing
              real work.
        feedback: >
          Two ways to misuse the tower: weights from the wrong experiment, and
          an $X$ with no mean to begin with.
      - teach: >
          In an interview, the move is a sentence before it is a computation:
          "condition on $Y$, where the problem is easy, then average back over
          $Y$." For the stick: "given the first piece, the second averages
          half of it, so a quarter overall."

  - node: quant-probability.conditioning.tower-nested
    hook: >
      "I conditioned on more information, then averaged some of it back out
      — did I gain anything?" comes up in every multi-stage argument, and
      the answer, "no, you land exactly on the coarser forecast," is what
      licenses peeling layers off one at a time.
    explanation: >
      $\mathbb{E}[\mathbb{E}[X\mid Y,Z]\mid Y]$ starts from the finer
      forecast using both $Y$ and $Z$, then averages out $Z$ while keeping
      $Y$ fixed — and the claim is this equals $\mathbb{E}[X\mid Y]$, the
      forecast that never used $Z$. Conditioning on extra information and
      then discarding it by averaging cannot manufacture an advantage:
      whatever edge $Z$ gave you inside the slice $Y=y$ washes out once you
      average over $Z$'s distribution within that slice, by the ordinary
      tower property applied inside the world where $Y=y$ is fixed.

      The plain tower property is the special case where the outer
      conditioning variable is replaced by nothing — averaging out
      everything you conditioned on leaves the fully unconditional mean,
      consistent with this more general smoothing statement.

      The practical use is architectural: when a problem has several layers
      of randomness — a regime, then a signal, then an outcome — condition
      on whichever layer makes the innermost expectation trivial, then work
      outward one layer at a time, using this rule to confirm that averaging
      a fine forecast down to a coarse one is always legitimate and never
      needs re-deriving.
    worked: >
      Roll two independent fair dice, $Y$ the first and $Z$ the second, and
      let $X=Y+Z$. Trivially $\mathbb{E}[X\mid Y,Z]=Y+Z$, since both dice are
      already known. Fix $Y=4$ and average out $Z$: $\mathbb{E}[4+Z\mid
      Y=4] = 4+\mathbb{E}[Z] = 7.5$, using independence of $Z$ from $Y$.
      This matches $\mathbb{E}[X\mid Y=4]$ computed directly the same way —
      conditioning on $Z$ and averaging it back out reproduced the coarser
      forecast $7.5$ exactly.
    interview: >
      "You're allowed to peek at an extra signal but must forget it before
      acting — does that peek help on average" tests this rule directly; the
      sharp answer is "no, averaging a finer conditional expectation back
      down to the coarser conditioning always returns the coarser one,
      exactly."
    pitfalls: >
      The outer conditioning variable must be a subset of the inner one
      ($Y$ alone, versus $Y$ and $Z$ together) — averaging $\mathbb{E}[X\mid
      Y,Z]$ down to a variable unrelated to $Y,Z$ has no such guarantee.
      Trying to run this the other way — building $\mathbb{E}[X\mid Y,Z]$
      out of $\mathbb{E}[X\mid Y]$ — is not licensed; information can't be
      manufactured in that direction either.
    recap: >
      Conditioning on more and then averaging back down to less returns
      exactly the coarser conditional expectation — the rule that lets
      multi-stage arguments peel off layers of information without penalty.
    dialogue:
      - part: Two announcements, five minutes apart
        teach: >
          At 2:00 the central bank's tone is revealed: hawkish with
          probability $0.4$, dovish otherwise. At 2:05 you see whether yields
          rose: after a hawkish tone they rise with probability $0.8$, after a
          dovish one with probability $0.3$. Call the tone $Y$, the yield move
          $Z$ and the desk's P&L $X$. Once both are known, the expected P&L is
          $5$ (hawkish, rise), $-5$ (hawkish, no rise), $2$ (dovish, rise) or
          $-1$ (dovish, no rise).
      - ask: >
          It is 2:01. The tone was hawkish; yields are not out yet. What is
          your forecast of the desk's P&L?
        expects: "3"
        hint: >
          Average the two hawkish numbers, weighted by how likely each yield
          move is after a hawkish tone.
        feedback: >
          $0.8(5) + 0.2(-5) = 4 - 1 = 3$.
      - ask: >
          A colleague gets $0$ instead: across all days yields rise half the
          time, since $0.4(0.8) + 0.6(0.3) = 0.5$, so he weights $5$ and $-5$
          equally. What went wrong?
        choices:
          - text: >
              Nothing: $0.5$ is the probability that yields rise, so it is the
              right weight.
            feedback: >
              It is the right weight on a day whose tone you do not know. At
              2:01 you know the tone was hawkish, and on hawkish days yields
              rise $80\%$ of the time.
          - text: >
              He should have averaged all four numbers, since any of them
              could still happen.
            feedback: >
              The two dovish outcomes cannot happen any more: the tone is out.
              Only the hawkish branch is live.
          - text: >
              He averaged out the yield move with its unconditional law
              instead of its law given a hawkish tone.
            correct: true
            feedback: >
              Averaging out $Z$ while keeping $Y$ must use the law of $Z$
              given $Y$. Yields depend on the tone, so the two laws differ.
        feedback: >
          Throwing away the yield information is fine; throwing away the tone
          by accident is not.
      - reflect: >
          Your $3$ was built from the 2:05 forecasts and then averaged back
          over the yield move. A rival never planned to look at yields and
          computed $\mathbb{E}[X \mid \text{hawkish}]$ straight from the joint
          law. Must you agree? Why?
        answer: >
          Yes. Inside the world where the tone is hawkish, your computation is
          the ordinary tower property: averaging the forecasts given the yield
          move over that move's conditional law returns the mean of $X$ in that
          world, which is exactly the rival's number. Peeking at yields and
          then averaging the peek away cannot leave you with anything the
          rival lacks.

      - part: The coarser information wins
        teach: >
          That is nested conditioning: for integrable $X$,
          $\mathbb{E}[\mathbb{E}[X \mid Y, Z] \mid Y] = \mathbb{E}[X \mid Y]$.
          Forecast with the finer information, average out what you then
          forget, and the coarser forecast is what remains. The plain tower
          property is the case where you forget everything:
          $\mathbb{E}[\mathbb{E}[X \mid Y, Z]] = \mathbb{E}[X]$.
      - ask: >
          It is 1:59 and nothing is known. What is the desk's expected P&L?
        expects: "1.14"
        hint: >
          You need the dovish forecast first.
        feedback: >
          Dovish: $0.3(2) + 0.7(-1) = -0.1$. Then $0.4(3) + 0.6(-0.1) = 1.2 -
          0.06 = 1.14$. Averaging all four outcomes with their joint
          probabilities $0.32, 0.08, 0.18, 0.42$ gives the same $1.14$.
      - ask: >
          What makes the nested identity hold for each fixed $Y = y$?
        choices:
          - text: >
              $Z$ is independent of $Y$, so averaging out $Z$ does not touch
              $Y$.
            feedback: >
              Here $Z$ depends strongly on $Y$, $0.8$ against $0.3$, and the
              identity held. No independence is needed.
          - text: >
              The ordinary tower property, run inside the conditional law
              given $Y = y$, with $Z$ playing the role of the conditioning
              variable.
            correct: true
            feedback: >
              Fix $y$; in that world $\mathbb{E}[X \mid Y = y, Z]$ is a
              forecast given $Z$, and averaging it over $Z$ gives the mean of
              $X$ in that world.
          - text: >
              Linearity: the average of the forecasts is the forecast of the
              average.
            feedback: >
              Linearity splits sums; it does not say which law to average
              against. The load-bearing step is the tower property in the
              slice $Y = y$.
        feedback: >
          Nested conditioning is the tower property applied one layer in. Each
          layer peels off the same way.

      - part: Peeling layers off
        ask: >
          Roll a fair die to get $Y$. Toss $Y$ fair coins and let $Z$ be the
          number of heads. Then roll $Z$ fair dice and let $X$ be their total.
          What is $\mathbb{E}[X \mid Y = 4]$?
        expects: "7"
        hint: >
          Condition on everything first: what is $\mathbb{E}[X \mid Y, Z]$?
        feedback: >
          $\mathbb{E}[X \mid Y, Z] = 3.5Z$, trivially. Averaging out $Z$ given
          $Y = 4$, where $\mathbb{E}[Z \mid Y = 4] = 2$, gives $3.5 \times 2 =
          7$.
      - ask: >
          And $\mathbb{E}[X]$, before the first die is rolled?
        expects: "6.125"
        feedback: >
          $\mathbb{E}[X \mid Y] = 3.5(Y/2) = 1.75Y$, and $\mathbb{E}[Y] = 3.5$,
          so $\mathbb{E}[X] = 1.75 \times 3.5 = 6.125$. Three layers, each
          peeled from the inside out.

      - part: Which way the rule runs
        ask: >
          Back at the central bank. A trader who missed the tone sees at 2:05
          that yields rose. What is her forecast of the desk's P&L?
        expects: "3.92"
        hint: >
          Given a rise, how likely is each tone? Then average out the tone.
        feedback: >
          $\Pr(\text{hawkish} \mid \text{rise}) = 0.32/0.5 = 0.64$, so her
          forecast is $0.64(5) + 0.36(2) = 3.2 + 0.72 = 3.92$. She kept $Z$ and
          averaged out $Y$: the coarser information is now the yield move, and
          the weights are the law of the tone given that move.
      - ask: >
          At 2:01 you know $\mathbb{E}[X \mid \text{hawkish}] = 3$. Can you
          recover the 2:05 forecasts $5$ and $-5$ from it?
        choices:
          - text: >
              Yes: undo the averaging with the weights $0.8$ and $0.2$.
            feedback: >
              One equation, two unknowns. $0.8a + 0.2b = 3$ is solved by
              $(5, -5)$, by $(3, 3)$, and by infinitely many other pairs.
          - text: >
              No: many pairs of finer forecasts average to the same coarser
              one.
            correct: true
            feedback: >
              Averaging destroys information, and it cannot be undone. The
              rule runs one way: fine to coarse.
          - text: >
              Yes, by applying nested conditioning in reverse.
            feedback: >
              The identity says the coarse forecast is an average of the fine
              ones. It has no reverse; a forecast given $Y$ alone does not know
              what $Z$ would have added.
        feedback: >
          The outer conditioning must use less information than the inner.
          You can forget; you cannot un-forget.
      - teach: >
          In an interview with several layers, say the plan first: "condition
          on everything, where the inside is trivial, then average out one
          layer at a time." The nested identity is why each averaging step is
          legitimate.

  - node: quant-probability.conditioning.conditional-variance
    hook: >
      "How much uncertainty is left once you know $Y$" is a question every
      risk desk asks about every signal, and conditional variance is the
      object that answers it exactly.
    explanation: >
      $\operatorname{Var}(X\mid Y)$ is built exactly like ordinary variance,
      but every expectation inside the formula is replaced by a conditional
      one: it's $\mathbb{E}[(X-\mathbb{E}[X\mid Y])^{2}\mid Y]$, the average
      squared deviation from the conditional mean, computed inside the
      conditional law at each fixed $y$. Expanding the square gives the
      computational form $\mathbb{E}[X^{2}\mid Y]-(\mathbb{E}[X\mid
      Y])^{2}$, the same algebra that turns ordinary variance into
      $\mathbb{E}[X^{2}]-(\mathbb{E}[X])^{2}$, done inside each slice.

      Like $\mathbb{E}[X\mid Y]$, this is a random variable — a function of
      $Y$ alone — and it's nonnegative for every value of $Y$ since it's an
      average of squares. It measures the residual uncertainty about $X$
      once $Y$ has been revealed: not "how spread out is $X$ overall," but
      "how spread out is $X$ within the specific slice $Y=y$ you land in."

      When $X$ and $Y$ are independent, the conditional law of $X$ given
      $Y=y$ is the same for every $y$ — $X$'s own marginal law — so
      $\operatorname{Var}(X\mid Y)$ collapses to the constant
      $\operatorname{Var}(X)$: knowing $Y$ leaves exactly as much
      uncertainty as not knowing it.
    worked: >
      A stock's daily return has an unknown regime $Y$ (calm or volatile,
      each with probability $0.5$). Given calm, returns have mean $0$ and
      variance $1$; given volatile, mean $0$ and variance $9$. Then
      $\operatorname{Var}(X\mid Y)$ takes value $1$ when $Y=\text{calm}$ and
      $9$ when $Y=\text{volatile}$ — a two-valued random variable, not a
      single number, capturing that the residual risk genuinely depends on
      the regime.
    interview: >
      "Once you observe the regime, how much risk is left" is answered by
      naming $\operatorname{Var}(X\mid Y)$ as a function of $Y$, not a
      single figure — a common follow-up asks you to compute
      $\mathbb{E}[X^{2}\mid Y]$ minus the squared conditional mean, since
      that's what you'd actually compute by hand.
    pitfalls: >
      Reporting a single number for $\operatorname{Var}(X\mid Y)$ instead of
      a function of $Y$ drops exactly the information the object is built
      to carry. Forgetting to square the conditional mean before
      subtracting reproduces the same slip as with ordinary variance.
    recap: >
      $\operatorname{Var}(X\mid Y) = \mathbb{E}[X^{2}\mid
      Y]-(\mathbb{E}[X\mid Y])^{2}$ is the leftover spread of $X$ once $Y$
      is known, itself random in $Y$, and it collapses to plain
      $\operatorname{Var}(X)$ exactly when $Y$ carries no information.
    dialogue:
      - part: What is left once you see the book
        teach: >
          A stock's next move $X$, in ticks, depends on the order book. When
          the book is thick, $X$ is $-1$ or $+1$, equally likely. When it is
          thin, $X$ is $-1$ or $+5$, equally likely. Each state has
          probability $1/2$, and you can see the book before the move.
      - ask: >
          The book is thin. What is your forecast of the move?
        expects: "2"
        feedback: >
          $\mathbb{E}[X \mid \text{thin}] = (-1 + 5)/2 = 2$. Overall the mean
          move is $\mathbb{E}[X] = (0 + 2)/2 = 1$.
      - ask: >
          A risk analyst measures the uncertainty on a thin book as the
          average squared distance from $1$, the overall mean move, and gets
          $10$. You measure it from $2$ and get $9$. Which is the uncertainty
          that remains once you know the book is thin?
        choices:
          - text: >
              $10$: risk is always measured from the overall mean.
            feedback: >
              On a thin book you forecast $2$, not $1$. The extra $(2 - 1)^{2}
              = 1$ in the analyst's number is the gap between two forecasts,
              which is not uncertainty once you have seen the book.
          - text: >
              $9$: on a thin book the move scatters around $2$, and that
              scatter is what you cannot predict.
            correct: true
            feedback: >
              $((-1 - 2)^{2} + (5 - 2)^{2})/2 = 9$. Every bit of it is noise you
              still face after seeing the book.
          - text: >
              They are the same quantity measured two ways, so either will do.
            feedback: >
              They differ by exactly $(2 - 1)^{2}$: the squared distance
              between the two centres. Which centre you use changes the
              answer.
        feedback: >
          Spread is measured around your best forecast. Once the book is
          known, your forecast is the conditional mean.
      - reflect: >
          Say exactly what you computed to get $9$: around what centre, and
          averaged under which law?
        answer: >
          The squared deviation from the conditional mean $\mathbb{E}[X \mid
          \text{thin}] = 2$, averaged under the conditional law of $X$ given a
          thin book. It is the ordinary variance, computed entirely inside the
          world where the book is thin. Both the centre and the weights come
          from that world.

      - part: Spread around the forecast
        teach: >
          That is conditional variance: $\operatorname{Var}(X \mid Y) =
          \mathbb{E}[(X - \mathbb{E}[X \mid Y])^{2} \mid Y]$. Expanding the
          square inside each slice gives the form you compute,
          $\mathbb{E}[X^{2} \mid Y] - (\mathbb{E}[X \mid Y])^{2}$, the same
          algebra as for ordinary variance. Like $\mathbb{E}[X \mid Y]$, it is
          a function of $Y$, and it is nonnegative for every value of $Y$.
      - ask: >
          Take the joint density $x + y$ on the unit square, where given
          $Y = 0$ the conditional density of $X$ is $2x$ and
          $\mathbb{E}[X \mid Y = 0] = 2/3$. What is
          $\operatorname{Var}(X \mid Y = 0)$?
        expects: "1/18"
        tolerance: 0.0005
        hint: >
          Find $\mathbb{E}[X^{2} \mid Y = 0]$ first.
        feedback: >
          $\mathbb{E}[X^{2} \mid Y = 0] = \int_0^1 x^{2} \cdot 2x\,dx = 1/2$, so
          the conditional variance is $1/2 - (2/3)^{2} = 1/2 - 4/9 = 1/18$.
      - ask: >
          Back to the order book, with $Y$ the state of the book. Which is
          $\operatorname{Var}(X \mid Y)$?
        choices:
          - text: >
              $5$, the average of the two conditional variances.
            feedback: >
              That averages over the state of the book, which you are supposed
              to know. $5$ is a number about the whole day, not the
              uncertainty given what you see.
          - text: >
              $\operatorname{Var}(X)$, since $X$ is the same variable either
              way.
            feedback: >
              $\operatorname{Var}(X)$ ignores the book entirely. Given a thick
              book the move is only $\pm 1$; the remaining spread there is
              $1$, not $\operatorname{Var}(X)$.
          - text: >
              $1$ when the book is thick and $9$ when it is thin.
            correct: true
            feedback: >
              A two-valued random variable, revealed with the book: thick
              gives $(1 + 1)/2 - 0^{2} = 1$, thin gives $(1 + 25)/2 - 2^{2} =
              9$.
        feedback: >
          The residual risk depends on which world you land in, so the object
          that records it is a function of $Y$, not a single figure.

      - part: The clause each mistake drops
        ask: >
          A colleague computes the thin-book variance as
          $\mathbb{E}[X^{2} \mid \text{thin}] - \mathbb{E}[X \mid
          \text{thin}]$ and reports $11$. What went wrong?
        choices:
          - text: >
              Nothing: the second moment minus the mean is the variance.
            feedback: >
              The mean must be squared: $13 - 2^{2} = 9$. Without the square
              the units do not even match, ticks squared minus ticks.
          - text: >
              The conditional mean was not squared before subtracting.
            correct: true
            feedback: >
              $\mathbb{E}[X^{2} \mid Y] - (\mathbb{E}[X \mid Y])^{2} = 13 - 4 =
              9$. The same slip as with ordinary variance, done inside a slice.
          - text: >
              He should have used the unconditional second moment,
              $\mathbb{E}[X^{2}] = 7$.
            feedback: >
              Mixing a whole-day moment with a thin-book mean centres nothing
              correctly: $7 - 4 = 3$ is not the thin-book spread either. Every
              piece must come from the same conditional law.
        feedback: >
          Both terms come from the conditional law, and the mean is squared.
          Drop either and the answer stops being a variance.
      - ask: >
          Now suppose instead that the move $X$ is independent of the book
          $Y$, with $\operatorname{Var}(X) = 4$. What is
          $\operatorname{Var}(X \mid Y)$?
        choices:
          - text: >
              The constant $4$, whatever the book shows.
            correct: true
            feedback: >
              Independence makes every conditional law equal to the law of
              $X$, so every slice has variance $4$.
          - text: >
              $0$: once you condition, the uncertainty is gone.
            feedback: >
              Conditioning removes only the uncertainty $Y$ explains. An
              independent $Y$ explains none of it.
          - text: >
              It depends on the value of $Y$, like any conditional variance.
            feedback: >
              It is a function of $Y$, but here a constant one: all slices
              share the law of $X$, so they share its spread.
        feedback: >
          Seeing an independent variable leaves exactly as much uncertainty as
          not seeing it.
      - ask: >
          In the order-book model, what is $\operatorname{Var}(X)$, the
          whole-day variance of the move?
        expects: "6"
        hint: >
          The four outcomes $-1, 1, -1, 5$ are equally likely.
        feedback: >
          $\mathbb{E}[X^{2}] = (1 + 1 + 1 + 25)/4 = 7$ and $\mathbb{E}[X] = 1$,
          so $\operatorname{Var}(X) = 6$. That is more than the average
          residual of $5$: seeing the book removes part of the risk, and the law
          of total variance says exactly how much.
      - teach: >
          Asked "how much risk is left once you know the regime", answer with
          a function of the regime, not a figure: "$1$ on a thick book, $9$
          on a thin one". Then compute each as $\mathbb{E}[X^{2} \mid Y]$ minus
          the squared conditional mean.

  - node: quant-probability.conditioning.total-variance
    hook: >
      "How would you decompose the risk of a metric that depends on an
      unobserved regime" is answered in one line by this theorem, and it's
      why pooled variance is never just the average of within-group
      variances.
    explanation: >
      Expand $\operatorname{Var}(X) = \mathbb{E}[X^{2}]-(\mathbb{E}[X])^{2}$
      and apply the tower property to each piece:
      $\mathbb{E}[X^{2}]=\mathbb{E}[\mathbb{E}[X^{2}\mid Y]]$ and
      $(\mathbb{E}[X])^{2} = (\mathbb{E}[\mathbb{E}[X\mid Y]])^{2}$.
      Rewriting $\mathbb{E}[X^{2}\mid Y]$ as $\operatorname{Var}(X\mid
      Y)+(\mathbb{E}[X\mid Y])^{2}$ — conditional variance's own definition,
      rearranged — and regrouping the two occurrences of $(\mathbb{E}[X\mid
      Y])^{2}$ produces exactly $\operatorname{Var}(\mathbb{E}[X\mid Y])$
      alongside $\mathbb{E}[\operatorname{Var}(X\mid Y)]$: bookkeeping once
      the tower property is granted.

      Read the two pieces as within-group and between-group variation:
      $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ is the average spread inside
      each value of $Y$, and $\operatorname{Var}(\mathbb{E}[X\mid Y])$ is
      the spread of the group means themselves as $Y$ varies. This is the
      split behind why a mixture of regimes is riskier than any single
      regime alone.

      Because both summands are variances of real random variables, both
      are nonnegative, giving two free bounds:
      $\operatorname{Var}(\mathbb{E}[X\mid Y]) \le \operatorname{Var}(X)$ (a
      forecast is never more spread out than the thing it forecasts) and
      $\mathbb{E}[\operatorname{Var}(X\mid Y)] \le \operatorname{Var}(X)$
      (conditioning on average never increases the leftover spread).
    worked: >
      Revisit the calm/volatile regime: $\Pr(Y=\text{calm}) =
      \Pr(Y=\text{volatile}) = 0.5$, both regimes have mean return $0$,
      variances $1$ and $9$. Within-group: $\mathbb{E}[\operatorname{Var}(X
      \mid Y)] = 0.5(1)+0.5(9) = 5$. Between-group: both conditional means
      are $0$, so $\operatorname{Var}(\mathbb{E}[X\mid Y]) = 0$. Total
      $\operatorname{Var}(X) = 5$ — all the risk here is within-regime,
      since the regimes share the same mean; the between-group term only
      appears once the group means actually differ.
    interview: >
      "Why isn't the variance of a mixture just the weighted average of the
      component variances" is answered by naming the missing between-group
      term $\operatorname{Var}(\mathbb{E}[X\mid Y])$ explicitly — the
      interviewer wants you to identify that differing group means, not
      just differing group spreads, add extra variance.
    pitfalls: >
      Reporting $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ alone as the total
      variance understates risk whenever the conditional means actually
      differ across $Y$. The theorem needs only $\mathbb{E}[X^{2}]<\infty$,
      not independence or any distributional assumption on $Y$.
    recap: >
      $\operatorname{Var}(X) = \mathbb{E}[\operatorname{Var}(X\mid Y)] +
      \operatorname{Var}(\mathbb{E}[X\mid Y])$ splits total risk into
      average within-regime spread plus the spread of regime means — both
      terms nonnegative, both bounded by $\operatorname{Var}(X)$.
    dialogue:
      - part: Two tight groups, one wide pool
        teach: >
          A strategy has six kinds of day, equally likely. On the three quiet
          days it makes $1$, $2$ or $3$; on the three news days it makes $7$,
          $8$ or $9$. Let $X$ be the day's P&L and let $Y$ record whether
          there was news.
      - ask: >
          Within the quiet days alone, what is the variance of $X$? (The news
          days give the same answer.)
        expects: "2/3"
        tolerance: 0.0005
        feedback: >
          Mean $2$, squared deviations $1, 0, 1$, so
          $\operatorname{Var}(X \mid \text{quiet}) = 2/3$. The news days are
          the same shape shifted by $6$, so they also give $2/3$.
      - ask: >
          Over all six days pooled, what is $\operatorname{Var}(X)$?
        expects: "29/3"
        tolerance: 0.0005
        hint: >
          $\mathbb{E}[X] = 5$. Average the squares and subtract $25$.
        feedback: >
          $\mathbb{E}[X^{2}] = (1 + 4 + 9 + 49 + 64 + 81)/6 = 208/6$, so
          $\operatorname{Var}(X) = 208/6 - 25 = 29/3 \approx 9.67$, about
          fifteen times the spread inside either group.
      - reflect: >
          Inside each group the variance is only $2/3$, but the pool's is
          $29/3$. Where does the extra $9$ come from? Say what it is the
          variance of.
        hint: >
          The two groups are tight, but where are they centred?
        answer: >
          From the distance between the groups. Quiet days centre on $2$ and
          news days on $8$, so the group mean itself is a random variable,
          $2$ or $8$ with probability $1/2$ each, and its variance is
          $\mathbb{E}[(\text{group mean} - 5)^{2}] = 9$. The pool's spread is
          the spread inside the groups plus the spread of where the groups
          sit: $2/3 + 9 = 29/3$.

      - part: Within plus between
        teach: >
          That is the law of total variance: if $\mathbb{E}[X^{2}] < \infty$,
          then $\operatorname{Var}(X) = \mathbb{E}[\operatorname{Var}(X \mid
          Y)] + \operatorname{Var}(\mathbb{E}[X \mid Y])$. The first term is
          the average spread inside each value of $Y$; the second is the
          spread of the group means. Here they are $2/3$ and $9$.
      - ask: >
          Start from $\operatorname{Var}(X) = \mathbb{E}[X^{2}] -
          (\mathbb{E}[X])^{2}$. Which move produces the two terms?
        choices:
          - text: >
              Square the tower property: $(\mathbb{E}[X])^{2} =
              \mathbb{E}[(\mathbb{E}[X \mid Y])^{2}]$.
            feedback: >
              The square of an average is not the average of the squares. The
              difference between $\mathbb{E}[(\mathbb{E}[X \mid Y])^{2}]$ and
              $(\mathbb{E}[\mathbb{E}[X \mid Y]])^{2}$ is exactly
              $\operatorname{Var}(\mathbb{E}[X \mid Y])$, the term this move
              would lose.
          - text: >
              Apply the tower to $\mathbb{E}[X^{2}]$ and to $\mathbb{E}[X]$,
              then write $\mathbb{E}[X^{2} \mid Y] = \operatorname{Var}(X \mid
              Y) + (\mathbb{E}[X \mid Y])^{2}$.
            correct: true
            feedback: >
              Then $\operatorname{Var}(X) = \mathbb{E}[\operatorname{Var}(X
              \mid Y)] + \mathbb{E}[(\mathbb{E}[X \mid Y])^{2}] -
              (\mathbb{E}[\mathbb{E}[X \mid Y]])^{2}$, and the last two terms
              are the variance of $\mathbb{E}[X \mid Y]$.
          - text: >
              Assume $X$ and $Y$ independent, so that their variances add.
            feedback: >
              With $X$ independent of $Y$ the between term is $0$, and the
              identity says nothing interesting. Here news and P&L are as
              dependent as can be, and the identity still holds.
        feedback: >
          Two applications of the tower property and the definition of
          conditional variance, rearranged. No assumption beyond a finite
          second moment.
      - ask: >
          A stick of length $1$ is broken at a uniform point, leaving $Y$, and
          that piece is broken at a uniform point, leaving $X$. Given $Y$,
          $X$ is uniform on $(0, Y)$. What is $\operatorname{Var}(X)$?
        expects: "7/144"
        tolerance: 0.0005
        hint: >
          Given $Y$, the uniform on $(0, Y)$ has mean $Y/2$ and variance
          $Y^{2}/12$. For $Y$ uniform on $(0, 1)$, $\mathbb{E}[Y^{2}] = 1/3$
          and $\operatorname{Var}(Y) = 1/12$.
        feedback: >
          Within: $\mathbb{E}[Y^{2}/12] = (1/3)/12 = 1/36$. Between:
          $\operatorname{Var}(Y/2) = (1/12)/4 = 1/48$. Total $1/36 + 1/48 =
          7/144 \approx 0.0486$. A continuous $Y$ is no harder than a
          two-group one.

      - part: Free bounds, and wrong weights
        ask: >
          A model reports $\operatorname{Var}(X) = 4$ for a payoff, and says
          its signal-based forecasts $\mathbb{E}[X \mid Y]$ have variance $5$.
          What is the verdict?
        choices:
          - text: >
              Plausible: a very informative signal produces widely spread
              forecasts.
            feedback: >
              However informative the signal, the forecast's variance is one
              of two nonnegative pieces adding to $\operatorname{Var}(X)$. It
              cannot exceed the whole.
          - text: >
              Plausible if $\mathbb{E}[\operatorname{Var}(X \mid Y)] = -1$.
            feedback: >
              A conditional variance is an average of squares for every
              value of $Y$, so its mean cannot be negative.
          - text: >
              Impossible: $\operatorname{Var}(\mathbb{E}[X \mid Y]) \le
              \operatorname{Var}(X)$ always.
            correct: true
            feedback: >
              A forecast is never more spread out than the thing it forecasts.
              The model has a bug.
        feedback: >
          Both terms are nonnegative, so each is at most
          $\operatorname{Var}(X)$. That is a free sanity check on any model
          that reports both.
      - ask: >
          Back to the six kinds of day, but now news is rarer: each quiet day
          has probability $1/4$ and each news day $1/12$. The within-group
          variances are still $2/3$. What is $\operatorname{Var}(X)$ now?
        expects: "89/12"
        tolerance: 0.0005
        hint: >
          The group mean is $2$ with probability $3/4$ and $8$ with probability
          $1/4$.
        feedback: >
          The overall mean is $0.75(2) + 0.25(8) = 3.5$, so the between term is
          $0.75(2 - 3.5)^{2} + 0.25(8 - 3.5)^{2} = 1.6875 + 5.0625 = 6.75$.
          Total $2/3 + 6.75 = 89/12 \approx 7.42$. Weighting the group means
          equally would have kept the old $9$; the weights are the
          probabilities of $Y$.
      - ask: >
          Which hypothesis does the law of total variance actually need?
        choices:
          - text: >
              $Y$ must be discrete, so that "groups" make sense.
            feedback: >
              The stick had a continuous $Y$ and the law gave $7/144$, which a
              direct computation confirms.
          - text: >
              Only $\mathbb{E}[X^{2}] < \infty$.
            correct: true
            feedback: >
              That makes every variance in sight finite. Nothing about the
              law of $Y$ or the dependence between them is assumed.
          - text: >
              $X$ given $Y$ must be normal.
            feedback: >
              No distributional shape enters the proof, only the tower
              property and the definition of conditional variance.
        feedback: >
          The law of total variance is bookkeeping on top of the tower
          property, and it is as general as the tower property is.
      - teach: >
          Asked why a mixture's variance is not the average of its parts'
          variances, name the missing term: "the average variance is the
          within part; the spread of the group means is the between part, and
          it is real risk."

  - node: quant-probability.conditioning.best-predictor
    hook: >
      "What's the best possible forecast of $X$ given $Y$, in mean-square
      error" is answered by $\mathbb{E}[X\mid Y]$, full stop, no linearity
      assumed — the theoretical justification behind every regression and
      every trading signal built on conditioning.
    explanation: >
      The claim is a genuine optimisation: among every function $g$ of $Y$
      with finite second moment, not just linear ones, $g(Y)=\mathbb{E}[X
      \mid Y]$ minimises $\mathbb{E}[(X-g(Y))^{2}]$. The load-bearing step
      is a decomposition: write $X-g(Y) = (X-\mathbb{E}[X\mid
      Y])+(\mathbb{E}[X\mid Y]-g(Y))$, square it, and expand. The cross term
      vanishes because the residual $X-\mathbb{E}[X\mid Y]$ is orthogonal to
      every function of $Y$, $\mathbb{E}[(X-\mathbb{E}[X\mid Y])h(Y)]=0$ for
      any $h$ — itself the tower property combined with taking out what's
      known.

      With the cross term gone, $\mathbb{E}[(X-g(Y))^{2}] =
      \mathbb{E}[(X-\mathbb{E}[X\mid Y])^{2}] + \mathbb{E}[(\mathbb{E}[X\mid
      Y]-g(Y))^{2}]$, a sum of two nonnegative pieces where only the second
      depends on your choice of $g$. It's smallest, namely $0$, exactly when
      $g(Y)=\mathbb{E}[X\mid Y]$, leaving the minimum error as the first
      piece, $\mathbb{E}[\operatorname{Var}(X\mid Y)]$.

      This is why linear regression is only ever an approximation: it
      restricts the search to affine functions $g(Y)=a+bY$, a strictly
      smaller set than "all functions of $Y$," so the best affine predictor
      can only tie or lose to $\mathbb{E}[X\mid Y]$ — it ties exactly when
      the joint law is bivariate normal, since there the true best predictor
      already is linear.
    worked: >
      Let $Y$ be uniform on $\{1,2,3\}$ and, given $Y=y$, let $X\sim
      \operatorname{Uniform}\{1,\dots,y\}$, so $\mathbb{E}[X\mid
      Y]=(Y+1)/2$ and $\operatorname{Var}(X\mid Y=y) = (y^{2}-1)/12$.
      Among all guessing rules, this minimises mean-squared error; the
      minimum error itself is $\mathbb{E}[\operatorname{Var}(X\mid Y)] =
      \left(0+\tfrac{3}{12}+\tfrac{8}{12}\right)/3 = 11/36$, and a constant
      guess like $g(Y)=2$ has strictly larger mean-squared error than
      $11/36$.
    interview: >
      "Why is $\mathbb{E}[X\mid Y]$ called the best predictor, and best in
      what sense" checks that you can state mean-squared error explicitly
      and that no linearity is assumed — a common follow-up asks when linear
      regression achieves the same minimum, and the bivariate normal is the
      expected answer.
    pitfalls: >
      Assuming the optimality is only among linear predictors misses the
      entire content of the result — it's among all functions of $Y$.
      Forgetting the orthogonality step is the usual reason people can't
      reproduce the proof: the cross term vanishing is not obvious without
      invoking that the residual is orthogonal to every function of $Y$.
    recap: >
      No function of $Y$, linear or not, beats $\mathbb{E}[X\mid Y]$ under
      squared-error loss, and the leftover error is exactly
      $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ — why regression is always
      an approximation to something already optimal.
    dialogue:
      - part: Guessing a payoff from a signal
        teach: >
          A signal $Y$ is $-1$, $0$ or $1$, equally likely. A payoff is
          $X = 3Y^{2} + \varepsilon$, where the noise $\varepsilon$ is
          independent of $Y$ with mean $0$ and variance $1$. You must commit to
          a rule $g(Y)$ for guessing $X$, and you are scored by the mean
          squared error $\mathbb{E}[(X - g(Y))^{2}]$.
      - ask: >
          First ignore the signal and always guess $\mathbb{E}[X] = 2$. What is
          your mean squared error?
        expects: "3"
        hint: >
          The error of guessing the mean is $\operatorname{Var}(X)$. Here
          $3Y^{2}$ is $3$ with probability $2/3$ and $0$ otherwise.
        feedback: >
          $\operatorname{Var}(3Y^{2}) = 9 \cdot (2/3)(1/3) = 2$, and the
          independent noise adds $1$, so the error is $3$.
      - ask: >
          Now use the signal and guess $g(Y) = 3Y^{2}$. What is your mean
          squared error?
        expects: "1"
        feedback: >
          The error is $X - 3Y^{2} = \varepsilon$, so the mean squared error is
          $\mathbb{E}[\varepsilon^{2}] = 1$. The signal removed two thirds of
          it.
      - ask: >
          Can any other rule $g(Y)$ beat an error of $1$?
        choices:
          - text: >
              Yes: shift it, say $3Y^{2} + 0.5$, to hedge against the noise.
            feedback: >
              The error becomes $\varepsilon - 0.5$, with mean square
              $1 + 0.25$. A shift that does not follow the noise only adds
              to it.
          - text: >
              Yes: a cleverer rule that also uses the sign of $Y$.
            feedback: >
              What is left over, $\varepsilon$, is independent of $Y$ and so
              of its sign. No function of $Y$ can track it.
          - text: >
              No: what is left is noise that no function of $Y$ can predict.
            correct: true
            feedback: >
              Right. What remains is to see why that intuition is exact.
        feedback: >
          The remaining error is the part of $X$ that $Y$ carries no
          information about.
      - reflect: >
          Write any rule's error as $X - g(Y) = (X - 3Y^{2}) + (3Y^{2} - g(Y))$
          and square it. Which term has to vanish for $3Y^{2}$ to be the
          winner, and why does it?
        hint: >
          The first bracket is $\varepsilon$. The second is some function of
          $Y$.
        answer: >
          The cross term, $2\mathbb{E}[\varepsilon\,(3Y^{2} - g(Y))]$. It
          vanishes because $\varepsilon$ has mean zero and is independent of
          $Y$, so it is uncorrelated with every function of $Y$. What remains
          is $1 + \mathbb{E}[(3Y^{2} - g(Y))^{2}]$: the unavoidable error plus
          a nonnegative penalty that is zero only when $g(Y) = 3Y^{2}$.

      - part: The best predictor of any shape
        teach: >
          In general the winner is $\mathbb{E}[X \mid Y]$, which here is
          $3Y^{2}$. If $\mathbb{E}[X^{2}] < \infty$, then among all $g$ with
          $\mathbb{E}[g(Y)^{2}] < \infty$, $g(Y) = \mathbb{E}[X \mid Y]$
          uniquely minimises $\mathbb{E}[(X - g(Y))^{2}]$, and the minimum is
          $\mathbb{E}[\operatorname{Var}(X \mid Y)]$. The proof is your split,
          with one fact doing the work: $\mathbb{E}[(X - \mathbb{E}[X \mid
          Y])h(Y)] = 0$ for every function $h$.
      - ask: >
          Why is the residual $X - \mathbb{E}[X \mid Y]$ orthogonal to every
          $h(Y)$, in general and not just when the noise is independent?
        choices:
          - text: >
              Condition on $Y$: $h(Y)$ comes out, leaving $h(Y)(\mathbb{E}[X
              \mid Y] - \mathbb{E}[X \mid Y]) = 0$, and the tower finishes.
            correct: true
            feedback: >
              Taking out what is known, then the tower property. No
              independence anywhere.
          - text: >
              The residual is always independent of $Y$.
            feedback: >
              Not in general. If $X$ is $\pm 1$ when $Y = 0$ and $\pm 3$ when
              $Y = 1$, each sign equally likely, the residual's size depends on
              $Y$. Orthogonality holds anyway.
          - text: >
              The residual has mean zero.
            feedback: >
              Mean zero makes it orthogonal to constants only. Orthogonality
              to every function of $Y$ is a much stronger statement, and needs
              the conditioning argument.
        feedback: >
          The residual is uncorrelated with everything you can compute from
          $Y$. That is what "best" means under squared error.
      - ask: >
          Using the split, what is the mean squared error of the rule
          $g(Y) = 2 + Y$?
        expects: "11/3"
        tolerance: 0.0005
        hint: >
          The error is $1$ plus the average of $(3Y^{2} - 2 - Y)^{2}$ over the
          three values of $Y$.
        feedback: >
          $3Y^{2} - 2 - Y$ is $2$, $-2$ and $0$ at $Y = -1, 0, 1$, with squares
          $4, 4, 0$ averaging $8/3$. Total $1 + 8/3 = 11/3$.

      - part: Where other forecasts lose
        ask: >
          Restrict yourself to straight lines $a + bY$. Which line has the
          smallest mean squared error?
        choices:
          - text: >
              $3Y$, which follows the signal.
            feedback: >
              At $Y = -1$ it guesses $-3$ for a payoff averaging $3$. Its error
              is $1 + (36 + 0 + 0)/3 = 13$, worse than ignoring $Y$.
          - text: >
              The flat line $2$.
            correct: true
            feedback: >
              $X$ behaves identically at $Y = 1$ and $Y = -1$, so any tilt
              helps one side exactly as much as it hurts the other. The best
              line is flat, with error $3$, and sees none of the signal.
          - text: >
              The flat line $3$, which is right whenever $Y \ne 0$.
            feedback: >
              Right two times in three, but off by $3$ at $Y = 0$: error
              $1 + (0 + 9 + 0)/3 = 4$. The flat line $2$ splits the difference
              and pays only $1 + (1 + 4 + 1)/3 = 3$.
        feedback: >
          The best line has error $3$; the best function has error $1$. No
          linearity is assumed in the theorem, and here the difference is
          everything.
      - ask: >
          Suppose you are scored by mean absolute error,
          $\mathbb{E}|X - g(Y)|$, instead. Is $\mathbb{E}[X \mid Y]$ still the
          best rule?
        choices:
          - text: >
              Yes: the best predictor is best under any sensible loss.
            feedback: >
              Take $X$ that is $0$ with probability $0.9$ and $10$ otherwise:
              mean $1$, median $0$. Guessing $1$ has absolute error
              $0.9(1) + 0.1(9) = 1.8$; guessing $0$ has $1$.
          - text: >
              No: under absolute error the conditional median wins. The
              theorem is about squared error.
            correct: true
            feedback: >
              The proof used squares: the cross term only exists when you
              expand a square.
          - text: >
              Only if $X$ given $Y$ is skewed.
            feedback: >
              For a symmetric conditional law the mean and median agree, so
              then $\mathbb{E}[X \mid Y]$ happens to win both. The theorem
              still only covers squared error.
        feedback: >
          "Best predictor" always comes with a loss attached. For conditional
          expectation, that loss is squared error.
      - teach: >
          Asked "best in what sense?", say "mean squared error, over every
          function of $Y$, not just lines". For a bivariate normal pair the
          best predictor happens to be linear, so a straight-line fit loses
          nothing there; in general it can lose everything, as here.

  - node: quant-probability.conditioning.projection-view
    hook: >
      Every fact proved so far in this unit — linearity, the orthogonality
      step behind the best-predictor property, total variance — falls out
      of one picture: conditional expectation is a right angle.
    explanation: >
      Treat square-integrable random variables as vectors, with inner
      product $\langle U,V\rangle = \mathbb{E}[UV]$ — "orthogonal" then
      means $\mathbb{E}[UV]=0$, and "length squared" means
      $\mathbb{E}[U^{2}]$. The functions of $Y$ form a subspace of this
      vector space, and the orthogonality fact used to prove $\mathbb{E}[X
      \mid Y]$ is the best mean-square predictor — that $X-\mathbb{E}[X\mid
      Y]$ is perpendicular to every function of $Y$ — says exactly that
      $\mathbb{E}[X\mid Y]$ is the orthogonal projection of $X$ onto that
      subspace, in the ordinary Euclidean sense of "closest point in a
      subspace."

      Every property in the unit becomes geometry. Linearity of conditional
      expectation is linearity of projection. $\mathbb{E}[\mathbb{E}[X\mid
      Y]\mid Y]=\mathbb{E}[X\mid Y]$ (projecting an already-projected vector
      changes nothing) is idempotence. Nested conditioning,
      $\mathbb{E}[\mathbb{E}[X\mid Y,Z]\mid Y]=\mathbb{E}[X\mid Y]$, is
      projecting onto the smaller subspace of functions of $Y$ alone, which
      sits inside the larger subspace of functions of $(Y,Z)$ — projecting
      onto a subspace of a subspace collapses to one projection onto the
      smaller one.

      Total variance becomes the Pythagorean theorem: $X = \mathbb{E}[X\mid
      Y] + (X-\mathbb{E}[X\mid Y])$ splits $X$ into a piece inside the
      subspace and a piece orthogonal to it, so squared lengths add — the
      variance identity is exactly that statement once means are subtracted
      off correctly. Linear regression is the same projection restricted to
      the smaller subspace of affine functions of $Y$, which is why it can
      only lose length compared to the full projection onto all functions
      of $Y$.
    interview: >
      "Why does $\mathbb{E}[X\mid Y]$ minimise mean-squared error" answered
      with "it's an orthogonal projection, and the closest point in a
      subspace is always the perpendicular foot" is the fastest, most
      memorable version of the best-predictor argument, and naming total
      variance as Pythagoras in the same breath signals real fluency.
    pitfalls: >
      The inner product $\langle U,V\rangle=\mathbb{E}[UV]$ requires both to
      have finite second moment — this picture is only valid for
      square-integrable random variables, not general ones with only a
      finite first moment. Don't over-extend the metaphor to claims about
      probabilities or events directly; it applies to expectations and
      mean-square distance specifically.
    recap: >
      Conditional expectation is orthogonal projection onto the subspace of
      functions of $Y$, with mean-square distance as the metric — best
      predictor is "closest point," idempotence is "projecting twice does
      nothing," and total variance is Pythagoras.
    dialogue:
      - part: Random variables as lists of numbers
        teach: >
          The world has three equally likely states. A payoff $X$ pays $1$,
          $5$ and $6$ in states one, two and three, so write it as the list
          $(1, 5, 6)$. A signal $Y$ tells you only whether you are in state
          three. Measure the distance between two lists $U$ and $V$ by
          $\mathbb{E}[(U - V)^{2}]$, the average squared gap.
      - ask: >
          Your signal says "not state three". What is
          $\mathbb{E}[X \mid Y]$ there?
        expects: "3"
        feedback: >
          States one and two remain, equally likely, so the forecast is
          $(1 + 5)/2 = 3$. In state three it is $6$. As a list,
          $\mathbb{E}[X \mid Y] = (3, 3, 6)$.
      - ask: >
          Which lists are functions of $Y$, that is, things you could compute
          from the signal alone?
        choices:
          - text: >
              Lists whose first two entries are equal.
            correct: true
            feedback: >
              The signal cannot tell state one from state two, so anything
              computed from it must agree there: $(a, a, b)$ for any $a$, $b$.
          - text: >
              Lists whose three entries are all equal.
            feedback: >
              Those are the constants, computable with no signal at all. The
              signal does separate state three, so its entry may differ.
          - text: >
              Any list at all.
            feedback: >
              $X = (1, 5, 6)$ itself is not one: computing it would need
              telling state one from state two, which the signal cannot do.
        feedback: >
          The functions of $Y$ form a flat two-dimensional subspace, the lists
          $(a, a, b)$, inside the three-dimensional space of all lists.
      - reflect: >
          Of all lists $(a, a, b)$, which is closest to $X = (1, 5, 6)$ in
          average squared gap? Look at the leftover, $X$ minus that list, and
          say what is special about it.
        hint: >
          Choose $a$ to fit $1$ and $5$ as well as possible, and $b$ to fit $6$.
        answer: >
          The closest is $(3, 3, 6)$, which is $\mathbb{E}[X \mid Y]$. The
          leftover is $(-2, 2, 0)$, and it is perpendicular to every list
          $(a, a, b)$: the average of the entrywise products is
          $(-2a + 2a + 0 \cdot b)/3 = 0$. The best forecast is where a
          perpendicular dropped from $X$ meets the subspace, as in school
          geometry.

      - part: Conditioning is a right angle
        teach: >
          With the inner product $\langle U, V \rangle = \mathbb{E}[UV]$,
          random variables with finite second moment are vectors, and the
          functions of $Y$ form a subspace. $\mathbb{E}[X \mid Y]$ is the
          orthogonal projection of $X$ onto it: the closest point, with the
          residual $X - \mathbb{E}[X \mid Y]$ perpendicular to the whole
          subspace. What you just found by hand is the general picture.
      - ask: >
          Here $\mathbb{E}[X^{2}] = 62/3$ and $\mathbb{E}[(\mathbb{E}[X \mid
          Y])^{2}] = 18$. What does Pythagoras predict for the squared length
          of the residual, $\mathbb{E}[(X - \mathbb{E}[X \mid Y])^{2}]$?
        expects: "8/3"
        tolerance: 0.0005
        feedback: >
          $62/3 - 54/3 = 8/3$, and directly $(4 + 4 + 0)/3 = 8/3$. It is also
          $\mathbb{E}[\operatorname{Var}(X \mid Y)]$: variance $4$ off state
          three, with probability $2/3$. Subtract the means first and the same
          right angle becomes the law of total variance.
      - ask: >
          The smallest subspace is the constants $(c, c, c)$, the functions
          of no information at all. Projecting $X$ onto it gives which $c$?
        expects: "4"
        feedback: >
          The closest constant in average squared gap is the mean,
          $(1 + 5 + 6)/3 = 4$. Projection onto the constants is
          $\mathbb{E}[X]$.
      - ask: >
          Now project $\mathbb{E}[X \mid Y] = (3, 3, 6)$ onto the constants.
          What do you get, and which identity is that?
        choices:
          - text: >
              $(3, 3, 6)$ unchanged: projecting twice does nothing.
            feedback: >
              Projecting twice onto the same subspace does nothing. The
              constants are a smaller subspace, and $(3, 3, 6)$ is not in it.
          - text: >
              $4$, the same as projecting $X$ directly: the tower property.
            correct: true
            feedback: >
              $(3 + 3 + 6)/3 = 4$. Projecting onto a subspace and then onto a
              smaller one inside it is the same as projecting onto the smaller
              one. That is $\mathbb{E}[\mathbb{E}[X \mid Y]] = \mathbb{E}[X]$.
          - text: >
              $5$, the average of $3$ and $6$.
            feedback: >
              That weights the two values of the forecast equally. The
              forecast is $3$ in two states out of three, so its mean is $4$.
        feedback: >
          Nested conditioning is a subspace inside a subspace; idempotence is
          projecting onto the same subspace twice. The geometry carries both.

      - part: Where the picture misleads
        ask: >
          The residual $(-2, 2, 0)$ is perpendicular to every function of $Y$.
          Is it independent of $Y$?
        choices:
          - text: >
              Yes: perpendicular to every function of $Y$ means unrelated to
              $Y$.
            feedback: >
              Off state three the residual is $\pm 2$; in state three it is
              always $0$. Knowing $Y$ tells you its size, so it is not
              independent.
          - text: >
              Only if $X$ is normal.
            feedback: >
              No assumption about $X$ would make this residual independent:
              its size given $Y$ is $2$ or $0$ in this very example.
          - text: >
              No: it is uncorrelated with every function of $Y$, but its
              spread still depends on $Y$.
            correct: true
            feedback: >
              The picture is about inner products, which are means of
              products. Independence is a statement about whole laws, and the
              geometry does not see it.
        feedback: >
          The picture captures second moments: means, variances, correlations.
          Claims about whole laws or single events need more than geometry.
      - ask: >
          Let $Y$ be $0$ off state three and $1$ in it. Does the best straight
          line $a + bY$ predict $X$ worse than $\mathbb{E}[X \mid Y]$ here?
        choices:
          - text: >
              No: with $Y$ taking two values, every function of $Y$ is a line
              in $Y$.
            correct: true
            feedback: >
              The subspace of lines is the whole subspace of functions of $Y$,
              so both projections land on $(3, 3, 6)$.
          - text: >
              It cannot be compared, because lines and conditional means live
              in different spaces.
            feedback: >
              Both are lists of three numbers. Regression projects onto the
              lines in $Y$, a subspace of the functions of $Y$, so they are
              directly comparable.
          - text: >
              Yes: a line is always a coarser predictor than the conditional
              mean.
            feedback: >
              It is never better, but it can tie. Lines in $Y$ are the lists
              $(a, a, a + b)$, which is every list of the form $(a, a, b)$.
        feedback: >
          Linear regression is projection onto a smaller subspace. It loses
          exactly when that subspace misses $\mathbb{E}[X \mid Y]$, which
          needs $Y$ to take at least three values.
      - teach: >
          Asked why $\mathbb{E}[X \mid Y]$ minimises mean squared error, the
          picture answers in a breath: "it is the orthogonal projection onto
          the functions of $Y$, and the closest point in a subspace is the foot
          of the perpendicular." Total variance is Pythagoras.

  - node: quant-probability.conditioning.conditioning-reduces-variance
    hook: >
      "Is this signal worth having" is answered by how much of
      $\operatorname{Var}(X)$ the term $\operatorname{Var}(\mathbb{E}[X\mid
      Y])$ actually claims — this node turns total variance into a genuine
      tool for valuing information.
    explanation: >
      Total variance gives $\mathbb{E}[\operatorname{Var}(X\mid Y)] \le
      \operatorname{Var}(X)$ immediately, since the other summand
      $\operatorname{Var}(\mathbb{E}[X\mid Y])$ is nonnegative — on average,
      the leftover uncertainty after learning $Y$ can't exceed the
      uncertainty you started with, with equality exactly when
      $\mathbb{E}[X\mid Y]$ is a constant and $Y$ carries no information
      about $X$'s mean at all.

      The word "average" is essential and easy to misread: the inequality
      is about $\mathbb{E}[\operatorname{Var}(X\mid Y)]$, not about
      $\operatorname{Var}(X\mid Y=y)$ for any particular $y$. A signal that
      usually clarifies the picture can still land you, on an unlucky draw,
      in a regime where the residual variance exceeds the unconditional
      variance — a piece of news that resolves most scenarios cleanly but
      occasionally reveals you're in the one genuinely murky case.

      The trading reading turns the identity into a valuation formula: a
      signal $Y$ is worth having exactly to the degree that
      $\operatorname{Var}(\mathbb{E}[X\mid Y])$ is a large share of
      $\operatorname{Var}(X)$, since that ratio is literally the fraction of
      total variance the signal explains — the same quantity called $R^{2}$
      once specialised to linear regression.
    worked: >
      A weather signal $Y$ (rain forecast probability) has
      $\operatorname{Var}(X)=4$ for tomorrow's rainfall amount, with
      $\mathbb{E}[\operatorname{Var}(X\mid Y)]=3.6$ and hence
      $\operatorname{Var}(\mathbb{E}[X\mid Y])=0.4$. The forecast explains
      $0.4/4=10\%$ of the variance — a weak but genuine signal; a second
      sensor with $\mathbb{E}[\operatorname{Var}(X\mid Y)]=1$ would explain
      $75\%$ and be worth far more, even though both satisfy the same
      inequality $\mathbb{E}[\operatorname{Var}(X\mid Y)]\le 4$.
    interview: >
      "Is this indicator actually useful, or just noise dressed up as a
      signal" is answered by estimating what share of $\operatorname{Var}
      (X)$ the term $\operatorname{Var}(\mathbb{E}[X\mid Y])$ claims, not by
      checking the inequality holds (it always does) — the interviewer
      wants the ratio, not the sign.
    pitfalls: >
      Concluding that conditioning on $Y$ helps in every realized instance
      because it helps on average is exactly the trap this node warns
      against — a specific value of $Y$ can leave you worse off. Treating
      $\mathbb{E}[\operatorname{Var}(X\mid Y)] \le \operatorname{Var}(X)$ as
      informative on its own, without computing how much smaller, misses
      whether a signal is strong or negligible.
    recap: >
      Conditioning cannot raise expected uncertainty, but a particular
      realization of the signal can — and $\operatorname{Var}(\mathbb{E}[X
      \mid Y])/\operatorname{Var}(X)$ is what actually prices how valuable a
      signal is.
    dialogue:
      - part: A signal that usually helps
        teach: >
          Before earnings, an analyst's read $Y$ on a stock's move $X$ comes
          in three kinds. "Up", with probability $0.45$: $X$ has mean $2$ and
          variance $1$. "Down", with probability $0.45$: mean $-2$, variance
          $1$. "Murky", with probability $0.1$: mean $0$, variance $10$.
      - ask: >
          Before you see the read, what is $\operatorname{Var}(X)$?
        expects: "5.5"
        hint: >
          Within-group plus between-group. The overall mean is $0$.
        feedback: >
          Within: $0.9(1) + 0.1(10) = 1.9$. Between: the group means $2, -2,
          0$ around $0$ give $0.9(4) + 0.1(0) = 3.6$. Total $5.5$.
      - ask: >
          Will seeing the read always leave you less uncertain about $X$ than
          the $5.5$ you start with?
        choices:
          - text: >
              Yes: more information can only reduce uncertainty.
            feedback: >
              On a murky read the variance left is $10$, nearly twice the
              $5.5$ you had before looking.
          - text: >
              No, and not even on average: a bad read can mislead you.
            feedback: >
              Single reads can leave more uncertainty, but on average the
              read leaves $1.9$, far below $5.5$.
          - text: >
              Not always: a murky read leaves $10$. But on average, yes.
            correct: true
            feedback: >
              The average residual is $0.9(1) + 0.1(10) = 1.9$. One reading in
              ten makes things worse, and the other nine more than pay for it.
        feedback: >
          Two different claims hide in "information reduces uncertainty": one
          about every reading, which is false, and one about the average,
          which is about to turn out always true.
      - reflect: >
          A murky read leaves $10$, more than $5.5$. Why can the average over
          reads, $\mathbb{E}[\operatorname{Var}(X \mid Y)]$, never exceed
          $\operatorname{Var}(X)$, for any signal at all?
        hint: >
          You split $5.5$ into two pieces a moment ago.
        answer: >
          By the law of total variance, $\operatorname{Var}(X)$ is
          $\mathbb{E}[\operatorname{Var}(X \mid Y)]$ plus
          $\operatorname{Var}(\mathbb{E}[X \mid Y])$, and the second piece is
          a variance, so it is never negative. The average residual is what is
          left after removing it. Nothing constrains a single reading, which
          is why the murky read can be bad; the bound is on the average only.

      - part: On average, never worse
        teach: >
          So $\mathbb{E}[\operatorname{Var}(X \mid Y)] \le
          \operatorname{Var}(X)$, strictly unless $\mathbb{E}[X \mid Y]$ is
          constant, while $\operatorname{Var}(X \mid Y = y)$ may well exceed
          $\operatorname{Var}(X)$ for some $y$. The size of the gap,
          $\operatorname{Var}(\mathbb{E}[X \mid Y])$, is the variance the
          forecast explains, and its share of $\operatorname{Var}(X)$ is what
          a signal is worth.
      - ask: >
          What share of $\operatorname{Var}(X)$ does the analyst's read
          explain? Give a decimal.
        expects: "0.6545"
        tolerance: 0.001
        feedback: >
          $3.6/5.5 \approx 0.6545$: about two thirds of the variance of the
          move is explained by the read.
      - ask: >
          When does $\mathbb{E}[\operatorname{Var}(X \mid Y)]$ equal
          $\operatorname{Var}(X)$ exactly?
        choices:
          - text: >
              Exactly when $X$ and $Y$ are independent.
            feedback: >
              Independence is enough, but not needed. A $Y$ that changes the
              spread of $X$ without moving its mean also gives equality, and
              it is far from independent.
          - text: >
              Exactly when $\mathbb{E}[X \mid Y]$ is constant.
            correct: true
            feedback: >
              Then $\operatorname{Var}(\mathbb{E}[X \mid Y]) = 0$, and total
              variance leaves nothing between the two sides.
          - text: >
              Exactly when $\operatorname{Var}(X \mid Y)$ is constant.
            feedback: >
              The up and down reads leave the same variance, $1$, yet the
              average residual $1.9$ is far below $5.5$. Equal residuals do
              not stop the means from moving.
        feedback: >
          What matters is whether the signal moves the forecast. A signal that
          never changes the forecast explains nothing.

      - part: A signal that explains nothing
        ask: >
          On a different stock, an analyst only ever says "calm"
          (probability $0.9$; mean $0$, variance $2$) or "wild" (probability
          $0.1$; mean $0$, variance $20$). What share of
          $\operatorname{Var}(X)$ does this read explain?
        expects: "0"
        feedback: >
          Both forecasts are $0$, so $\operatorname{Var}(\mathbb{E}[X \mid
          Y]) = 0$ and the share is $0$. The average residual, $0.9(2) +
          0.1(20) = 3.8$, equals $\operatorname{Var}(X)$.
      - ask: >
          Is this analyst worthless to a trader?
        choices:
          - text: >
              Yes: a signal that explains none of the variance carries no
              information.
            feedback: >
              It carries information about the spread: on a wild read the
              variance is ten times larger. It is not independent of $X$, just
              useless for forecasting its level.
          - text: >
              No: it cannot forecast the move, but it says how much risk you
              are running, which matters for sizing.
            correct: true
            feedback: >
              The explained share prices a signal as a forecast of $X$. A
              volatility signal is worth something else, and the share is
              blind to it.
          - text: >
              No: a wild read leaves variance $20$, far above $3.8$, so it
              says which way the move will go.
            feedback: >
              The forecast after a wild read is still $0$. A large residual
              says the move will be big, not which way it will go.
        feedback: >
          The variance share answers one question, how well $Y$ forecasts $X$.
          Ask it only when that is the question.
      - teach: >
          Asked "is this indicator useful?", do not answer "it reduces
          variance", which every signal does on average. Give the share:
          "it explains about two thirds of the variance of the move, though
          one reading in ten leaves me worse off."

  - node: quant-probability.conditioning.condition-first-step
    hook: >
      "Set up an equation for the unknown by conditioning on the very first
      thing that can happen" solves a huge share of process and game
      interview questions in three lines, and it's the single most reusable
      technique in this part of the interview.
    explanation: >
      The mechanics: identify the first random event $Y$ once the process
      starts — the first toss, the first draw, whichever of several clocks
      rings first — enumerate its outcomes and their probabilities, then
      evaluate the target quantity conditional on each outcome using
      whatever makes the rest of the problem tractable (often: the
      remainder of the process looks just like the original problem,
      restarted). Recombine with the tower property, averaging the
      conditional values by the first step's probabilities.

      This is so often the right move rather than direct enumeration
      because "conditional on each first-step outcome" frequently collapses
      the remaining problem back to the same unknown quantity you started
      with — the process is memoryless or self-similar after one step —
      turning an infinite sum over all possible outcomes into a single
      algebraic equation in one unknown.

      Multi-state versions — several distinguishable states, each with its
      own first-step analysis — produce not one equation but a linear
      system, one equation per state, solved together; that system-building
      step is exactly what linear recurrences and first-step analysis
      formalise for repeated use.
    worked: >
      Two players alternately toss a coin biased $p=0.6$ toward heads; the
      first to toss heads wins, and $q$ is the probability the starter
      wins. Condition on the starter's first toss: with probability $0.6$
      the starter wins immediately; with probability $0.4$ it's a tail, and
      the opponent is now in the starter's original position, so the
      original starter's win probability from there is $1-q$. So
      $q=0.6+0.4(1-q)$, giving $1.4q=1.0$ and $q=5/7$.
    interview: >
      Any "two players/particles/processes alternate or race, what's the
      probability the first one wins" question is solved by conditioning on
      the first step and noticing the position resets — say "condition on
      step one, and the remaining game is the same problem with the roles
      swapped" before writing any equation.
    pitfalls: >
      Forgetting that after certain first-step outcomes the roles swap (the
      responder becomes the new starter) is the most common setup error —
      get the recursion's structure right before solving it. This technique
      needs the restart property to collapse to one unknown; without it you
      get a genuinely different equation per stage and need the full
      linear-system machinery instead.
    recap: >
      Split on the first event, write the target's value conditional on
      each branch, average by the tower property — the biased alternating
      coin above gives the starter a $5/7$ chance to win in one short
      equation.
    dialogue:
      - part: Deuce, the slow way
        teach: >
          A tennis game is at deuce. You win each point independently with
          probability $0.6$, and the game ends when one player is two points
          ahead. The interviewer wants the probability that you win the game.
      - ask: >
          What is the probability you win the next two points, and with them
          the game?
        expects: "0.36"
        feedback: >
          $0.6 \times 0.6 = 0.36$. Your rival wins both with probability
          $0.16$, and the remaining $0.48$ is a split, which puts you back at
          deuce.
      - ask: >
          What is the probability you have won the game within the first four
          points?
        expects: "0.5328"
        hint: >
          Either you win the first two points, or they split and you win the
          next two.
        feedback: >
          $0.36 + 0.48 \times 0.36 = 0.36 + 0.1728 = 0.5328$. Six points adds
          $0.48^{2} \times 0.36$, and so on: the slow way is an infinite
          series, one term per return to deuce.
      - reflect: >
          Every split puts you back at deuce, facing exactly the game you
          started with. How could you use that to get the answer without
          summing anything?
        hint: >
          Call the answer $p$. What is your chance of winning after a split?
        answer: >
          After a split your chance of winning is $p$ again, the very number
          you are looking for. So condition on the first two points: win both
          ($0.36$), lose both ($0.16$), or split ($0.48$) and face $p$ once
          more. That gives one equation, $p = 0.36 + 0.48p$, and the whole
          infinite series is hiding inside it.
      - ask: >
          Solve it: what is $p$?
        expects: "9/13"
        tolerance: 0.0005
        feedback: >
          $0.52p = 0.36$, so $p = 36/52 = 9/13 \approx 0.692$. The series
          agrees: $0.36(1 + 0.48 + 0.48^{2} + \cdots) = 0.36/0.52$.

      - part: Condition on what happens first
        teach: >
          That is the technique: pick the first thing that happens, list its
          outcomes and their probabilities, write the target conditionally on
          each, and recombine with the tower property. It closes in one line
          whenever some branch restarts the original problem, because then
          the conditional value is the unknown itself.
      - ask: >
          Condition on a single point instead, and let $a$ be your chance of
          winning from "advantage you". Which equation is right?
        choices:
          - text: >
              $a = 0.6 + 0.4p$
            correct: true
            feedback: >
              Win the point and the game is yours; lose it and you are at
              deuce. With a matching equation $b = 0.6p$ from "advantage
              rival" and $p = 0.6a + 0.4b$, the system gives $p = 9/13$ again.
          - text: >
              $a = 0.6$
            feedback: >
              That counts only the immediate win. Losing the point from
              advantage does not lose the game; it sends you back to deuce.
          - text: >
              $a = 0.6 + 0.4(1 - p)$
            feedback: >
              Nothing swaps here: after losing the point you are back at deuce
              as yourself, with chance $p$, not your rival's chance $1 - p$.
        feedback: >
          The finer the first step, the more states, and the more equations.
          Get each branch's state exactly right before solving anything.
      - ask: >
          How many points does the game last on average, starting from deuce?
        expects: "50/13"
        tolerance: 0.0005
        hint: >
          Condition on the next two points. Each costs one point, and a split
          restarts the count.
        feedback: >
          $E = 2 + 0.48E$, so $E = 2/0.52 = 50/13 \approx 3.85$. The same move
          works for expectations as for probabilities.

      - part: When the restart fails
        ask: >
          Which version of deuce does not collapse to a finite set of
          equations?
        choices:
          - text: >
              Each point is a fair coin, $p = 0.5$.
            feedback: >
              The restart is intact; the equation $p = 0.25 + 0.5p$ gives
              $1/2$.
          - text: >
              You must be three points ahead to win, not two.
            feedback: >
              More states, but finitely many, and each split still lands in
              one of them. A larger system, still closed.
          - text: >
              You tire: after every return to deuce, your point chance drops
              by $0.05$.
            correct: true
            feedback: >
              Each return to deuce is a different game, so the conditional
              value after a split is a new unknown every time. The restart
              that closed the equation is gone.
        feedback: >
          The technique always gives you correct equations. It gives you
          finitely many only when the process returns to states it has seen.
      - ask: >
          You and a rival alternate free throws, you first. You make each
          with probability $0.5$, your rival with probability $0.25$, and the
          first make wins. What is your chance of winning?
        expects: "0.8"
        hint: >
          Condition on the first round of two shots. After two misses, who
          shoots first?
        feedback: >
          You win at once with probability $0.5$; both miss with probability
          $0.5 \times 0.75 = 0.375$ and you are first again. So $q = 0.5 +
          0.375q$ and $q = 0.5/0.625 = 0.8$. Conditioning on a single shot
          would hand the rival the first shot, a different state; the full
          round is the step that restarts.
      - teach: >
          In an interview, say the plan before the algebra: "condition on the
          first two points; a split puts us back at deuce, so
          $p = 0.36 + 0.48p$." Naming the restart is what the interviewer is
          listening for.

  - node: quant-probability.conditioning.random-sums
    hook: >
      "The number of trades/claims/customers today is itself random" is the
      setup behind most "law of total X" questions about aggregate risk,
      and this proposition is the one-line answer for both the mean and the
      variance of the total.
    explanation: >
      Condition on $N$ and treat it as a fixed number $n$: $S=X_1+\dots+
      X_N$ becomes an ordinary sum of $n$ iid terms, so $\mathbb{E}[S\mid
      N=n]=n\mu$ and $\operatorname{Var}(S\mid N=n)=n\sigma^{2}$ by the
      standard formulas for sums of iid variables — nothing about
      randomness in $N$ complicates this step, since $N$ is held fixed
      inside the conditioning. Writing this as $\mathbb{E}[S\mid N]=N\mu$
      and $\operatorname{Var}(S\mid N)=N\sigma^{2}$ packages both as random
      variables in $N$.

      The tower property turns $\mathbb{E}[S\mid N]=N\mu$ directly into
      $\mathbb{E}[S]=\mathbb{E}[N]\mu$. The variance needs total variance:
      $\operatorname{Var}(S) = \mathbb{E}[\operatorname{Var}(S\mid N)] +
      \operatorname{Var}(\mathbb{E}[S\mid N]) = \mathbb{E}[N]\sigma^{2} +
      \operatorname{Var}(N\mu) = \mathbb{E}[N]\sigma^{2} +
      \mu^{2}\operatorname{Var}(N)$ — the within-group term is average
      per-term noise scaled by how many terms there typically are, and the
      between-group term is new: the extra variance contributed purely by
      not knowing $N$ in advance.

      That second term is the entire point: a process with a fixed count
      $\mathbb{E}[N]$ has variance only $\mathbb{E}[N]\sigma^{2}$, so
      treating a random count as if it were its average silently drops
      $\operatorname{Var}(N)\mu^{2}$ of real variance. Independence of $N$
      from the sequence is essential throughout; if the count is chosen by
      watching the $X_i$ as they arrive, the martingale machinery is needed
      instead.
    worked: >
      An insurer receives $N$ claims a month with $\mathbb{E}[N]=50$,
      $\operatorname{Var}(N)=20$, and each claim's payout is independent of
      $N$ and of other claims with mean $\mu=3\,000$ dollars and variance
      $\sigma^{2}=4\,000\,000$. Then $\mathbb{E}[S]=50\cdot 3\,000 =
      150\,000$ dollars and $\operatorname{Var}(S) = 50(4\,000\,000) +
      20(3\,000)^{2} = 200\,000\,000+180\,000\,000 = 380\,000\,000$, so the
      standard deviation is $\sqrt{380\,000\,000} \approx 19\,494$ dollars —
      the random claim count contributes nearly as much variance as the
      claim sizes themselves here.
    interview: >
      "The number of $X$ is itself random — find the mean and variance of
      the total" is answered by conditioning on the count first, applying
      the tower property for the mean and total variance for the variance,
      and stating explicitly that $\operatorname{Var}(N)\mu^{2}$ is what a
      fixed-count model would miss.
    pitfalls: >
      Assuming $\operatorname{Var}(S)=\mathbb{E}[N]\sigma^{2}$ alone,
      ignoring the second term entirely, is the standard error — it
      silently assumes $N$ is deterministic. Independence of $N$ from the
      $X_i$ sequence is a hypothesis, not automatic; a count correlated
      with the sizes needs a different treatment.
    recap: >
      Conditioning on the random count gives $\mathbb{E}[S]=\mathbb{E}[N]
      \mu$ and $\operatorname{Var}(S)=\mathbb{E}[N]\sigma^{2}+
      \operatorname{Var}(N)\mu^{2}$ — the second term is the extra risk a
      fixed-count model would miss entirely.
    dialogue:
      - part: A count that is itself random
        teach: >
          In an hour a market maker gets $N$ customer orders, where $N$ is $1$
          or $3$ with probability $1/2$ each. Each order earns $0$ or $2$, in
          hundreds of dollars, with probability $1/2$ each, independently of
          the other orders and of $N$. Let $S$ be the hour's total.
      - ask: >
          What is $\mathbb{E}[S]$?
        expects: "2"
        feedback: >
          Given $N = n$ the total averages $n \times 1$, so $\mathbb{E}[S \mid
          N] = N$ and the tower gives $\mathbb{E}[S] = \mathbb{E}[N] = 2$.
      - ask: >
          A colleague says $\operatorname{Var}(S) = 2$: on average two
          orders, each with variance $1$. What do you say?
        choices:
          - text: >
              Right: variances of independent orders add, and there are two on
              average.
            feedback: >
              That is the variance for exactly two orders. Your hour has one
              order or three, and that uncertainty is risk too.
          - text: >
              Too high: averaging over $N$ smooths the total.
            feedback: >
              Not knowing how many orders arrive adds uncertainty; it does not
              remove any.
          - text: >
              Too low: it ignores that the number of orders is itself random.
            correct: true
            feedback: >
              A one-order hour averages $1$ and a three-order hour averages
              $3$. That swing in the hour's mean is variance the colleague
              left out.
        feedback: >
          A random count makes $\mathbb{E}[S \mid N]$ random, and the law of
          total variance charges for that.
      - reflect: >
          For a general random sum, with $N$ independent of iid orders of mean
          $\mu$ and variance $\sigma^{2}$, what are $\mathbb{E}[S \mid N]$ and
          $\operatorname{Var}(S \mid N)$? What must $\operatorname{Var}(S)$
          then be?
        hint: >
          Given $N = n$, the total is an ordinary sum of $n$ iid orders.
        answer: >
          Given $N = n$, $S$ is a sum of $n$ iid orders, so it has mean $n\mu$
          and variance $n\sigma^{2}$: $\mathbb{E}[S \mid N] = N\mu$ and
          $\operatorname{Var}(S \mid N) = N\sigma^{2}$. The law of total
          variance then gives $\mathbb{E}[N\sigma^{2}] + \operatorname{Var}(N
          \mu) = \mathbb{E}[N]\sigma^{2} + \mu^{2}\operatorname{Var}(N)$: noise
          within the orders, plus the swing from not knowing how many.
      - ask: >
          What is $\operatorname{Var}(S)$ for the market maker's hour?
        expects: "3"
        feedback: >
          $\mathbb{E}[N]\sigma^{2} + \mu^{2}\operatorname{Var}(N) = 2(1) +
          1^{2}(1) = 3$. The colleague's $2$ is the first term alone.

      - part: Two sources of risk
        teach: >
          The random-sum formulas: with $X_1, X_2, \dots$ iid of mean $\mu$
          and variance $\sigma^{2}$, and $N$ independent of them with finite
          mean and variance, $S = X_1 + \cdots + X_N$ has
          $\mathbb{E}[S] = \mathbb{E}[N]\mu$ and $\operatorname{Var}(S) =
          \mathbb{E}[N]\sigma^{2} + \operatorname{Var}(N)\mu^{2}$. The second
          term is what a fixed count misses.
      - ask: >
          Where exactly does the independence of $N$ from the orders enter?
        choices:
          - text: >
              In $\mathbb{E}[N\mu] = \mu\,\mathbb{E}[N]$.
            feedback: >
              $\mu$ is a constant; it comes out of any expectation. That step
              needs nothing.
          - text: >
              Nowhere essential: it only simplifies the algebra.
            feedback: >
              Drop it and the conditional step can fail outright, with no
              algebra to rescue it.
          - text: >
              In claiming that, given $N = n$, the orders are still $n$ iid
              draws from their original law.
            correct: true
            feedback: >
              If $N$ carried information about the orders, conditioning on it
              would change their law, and $\mathbb{E}[S \mid N] = N\mu$ would
              be false.
        feedback: >
          The proof is two lines of conditioning, and independence is what
          makes the first line true.
      - ask: >
          A trader makes $N$ trades a day, $N$ Poisson with mean $4$, so
          $\operatorname{Var}(N) = 4$. Each trade's P&L, independent of the
          count and of the others, has mean $3$ and variance $16$, in
          thousands. What is the standard deviation of the day's P&L, in
          thousands?
        expects: "10"
        feedback: >
          $\operatorname{Var}(S) = 4(16) + 4(3^{2}) = 64 + 36 = 100$, so the
          standard deviation is $10$, against a mean of $4 \times 3 = 12$. The
          count contributes $36$ of the $100$.

      - part: When the count peeks
        ask: >
          Two fair bets of $\pm 1$ are placed, but the trader books the second
          bet only if it won; otherwise only the first is booked. So $N$ is
          $1$ or $2$, and $\mu = 0$. What is $\mathbb{E}[S]$ of the booked
          total?
        expects: "0.5"
        hint: >
          Condition on the second bet.
        feedback: >
          If the second bet won, $S = X_1 + 1$, with mean $1$; if it lost,
          $S = X_1$, with mean $0$. So $\mathbb{E}[S] = 0.5(1) + 0.5(0) =
          0.5$.
      - ask: >
          The formula $\mathbb{E}[N]\mu$ gives $0$, not $0.5$. Why does it
          fail?
        choices:
          - text: >
              $N$ was chosen by looking at the bets, so given $N = 2$ the
              second bet is no longer a fair $\pm 1$.
            correct: true
            feedback: >
              Given $N = 2$, the second bet is a sure $+1$. Conditioning on
              the count changed the law of the summands, which is exactly what
              independence forbids.
          - text: >
              $N$ takes too few values for the formula to apply.
            feedback: >
              The formula holds for any count independent of the summands,
              with as few as two values, as the market maker's hour showed.
          - text: >
              The bets have mean $0$, and the formula needs $\mu \ne 0$.
            feedback: >
              With $\mu = 0$ and an honest count the booked total would
              average $0$. The failure here is the count, not the mean.
        feedback: >
          A count that peeks at the summands is not independent of them, and
          the formulas lose their footing. Counts set by a stopping rule need
          more careful machinery.
      - teach: >
          In an interview: "condition on the count. Given $N$, it is a plain
          sum, so mean $N\mu$ and variance $N\sigma^{2}$; the tower and total
          variance give $\mathbb{E}[N]\mu$ and $\mathbb{E}[N]\sigma^{2} +
          \operatorname{Var}(N)\mu^{2}$, and the second term is what a fixed
          count would miss."

  - node: quant-probability.conditioning.random-sums-desk
    hook: >
      The two-line variance split here is the fastest way to answer "how
      much does an uncertain trade count actually add to your day's risk,"
      and the answer is usually "less than you'd guess."
    explanation: >
      This is the mean and variance of a random sum plugged into a single
      concrete desk: $N$ trades with a given mean and variance, each trade
      an iid draw with its own mean and standard deviation, independent of
      $N$. The two variance contributors separate cleanly —
      $\mathbb{E}[N]\sigma^{2}$ from trade-level noise,
      $\operatorname{Var}(N)\mu^{2}$ from not knowing how many trades will
      happen — and comparing their sizes is the entire exercise.

      The comparison usually favors trade-level noise by a wide margin
      whenever a single trade's mean $\mu$ is small relative to its
      standard deviation $\sigma$, since the count's contribution scales
      with $\mu^{2}$ while the trade-noise term scales with $\sigma^{2}$ — a
      strategy with thin per-trade edge and fat per-trade risk is dominated
      by $\sigma$, and randomness in the trade count barely registers.

      The practical use of splitting the two terms is diagnostic: if a desk
      wants to shrink its P&L variance, the split tells you whether to
      target trade-level risk (position sizing, hedging) or count-level
      risk (execution consistency, capacity limits) — attacking the wrong
      one wastes effort.
    worked: >
      A different desk profile: $\mathbb{E}[N]=200$,
      $\operatorname{Var}(N)=400$, and each trade has mean $\mu=5$ dollars,
      standard deviation $\sigma=8$ dollars. Then $\mathbb{E}[S]=200\cdot 5
      = 1\,000$ dollars and $\operatorname{Var}(S) = 200(64)+400(25) =
      12\,800+10\,000 = 22\,800$, so the standard deviation is
      $\sqrt{22\,800}\approx 151$ dollars — the count's contribution
      ($10\,000$) is nearly as large as the trade-level noise ($12\,800$)
      here, since this trade's edge $\mu=5$ is large relative to its own
      noise $\sigma=8$.
    interview: >
      "Does a more volatile trade count matter more for a high-frequency,
      thin-edge strategy or a low-frequency, fat-edge one" is answered by
      comparing $\mathbb{E}[N]\sigma^{2}$ against $\operatorname{Var}(N)
      \mu^{2}$ directly — a strong answer states that count variance
      matters more exactly when $\mu$ is large relative to $\sigma$.
    pitfalls: >
      Assuming the count's contribution is always negligible, because it
      often is for thin-edge strategies, misses cases like this desk where
      $\mu$ is comparable to $\sigma$ and the count term rivals trade-level
      noise. Reporting variance instead of standard deviation when asked
      "how much extra risk in dollars" misstates the units by a square.
    recap: >
      With $\mathbb{E}[N]=200$, $\operatorname{Var}(N)=400$, $\mu=5$,
      $\sigma=8$ dollars, the standard deviation is about $151$ dollars, and
      here the uncertain count contributes almost as much variance as
      trade-level noise — because $\mu$ is large relative to $\sigma$.
    dialogue:
      - part: One day on a busy desk
        teach: >
          A desk makes $N$ trades a day, with $\mathbb{E}[N] = 400$ and a
          standard deviation of $30$, so $\operatorname{Var}(N) = 900$. Each
          trade's P&L is independent of the count and of the others, with mean
          $1.5$ dollars and standard deviation $6$ dollars. Risk wants the
          desk's daily numbers.
      - ask: >
          What is the expected daily P&L, in dollars?
        expects: "600"
        feedback: >
          $\mathbb{E}[S] = \mathbb{E}[N]\mu = 400 \times 1.5 = 600$.
      - ask: >
          The trade-level term of the variance is $\mathbb{E}[N]\sigma^{2}$.
          What is it?
        expects: "14400"
        feedback: >
          $400 \times 6^{2} = 14400$. This is the noise you would have even if
          the count were fixed at $400$.
      - ask: >
          The count-level term is $\operatorname{Var}(N)\mu^{2}$. What is it?
        expects: "2025"
        feedback: >
          $900 \times 1.5^{2} = 2025$. This is the price of not knowing in
          advance whether the desk will trade $370$ times or $430$.
      - ask: >
          What is the standard deviation of daily P&L, in dollars?
        expects: "128.16"
        tolerance: 0.05
        feedback: >
          $\sqrt{14400 + 2025} = \sqrt{16425} \approx 128.16$. With the count
          fixed at $400$ it would be $\sqrt{14400} = 120$.

      - part: Which risk to attack
        reflect: >
          The count term, $2025$, is about a seventh of the trade term,
          $14400$. What property of a single trade keeps it small here, and
          what would have to change for the count to dominate?
        hint: >
          Divide the count term by the trade term and group what is left.
        answer: >
          The ratio is $(\operatorname{Var}(N)/\mathbb{E}[N]) \cdot
          (\mu/\sigma)^{2} = 2.25 \times (1.5/6)^{2} \approx 0.14$. A trade's
          edge of $1.5$ is small against its noise of $6$, and that ratio
          enters squared. For the count to dominate, the edge per trade has to
          be large relative to its noise, or the count far more dispersed
          than its mean.
      - teach: >
          So the comparison is per-trade edge against per-trade noise, scaled
          by how dispersed the count is. For a Poisson count,
          $\operatorname{Var}(N) = \mathbb{E}[N]$, and the ratio is simply
          $(\mu/\sigma)^{2}$: a thin-edge, high-frequency desk barely notices
          its trade count; a fat-edge desk feels it.
      - ask: >
          A low-frequency desk makes a Poisson number of trades with mean
          $5$; each trade has mean $4$ and standard deviation $2$. What
          fraction of $\operatorname{Var}(S)$ comes from the count?
        expects: "0.8"
        hint: >
          Here $\operatorname{Var}(N) = 5$ too.
        feedback: >
          Count term $5 \times 4^{2} = 80$, trade term $5 \times 2^{2} = 20$,
          so the count supplies $80/100 = 0.8$. With $(\mu/\sigma)^{2} = 4$,
          the count is four times the trade noise.
      - ask: >
          The busy desk wants to cut its daily variance. Which lever does the
          most?
        choices:
          - text: >
              Make the trade count steadier, with tighter execution and
              capacity limits.
            feedback: >
              Even a perfectly fixed count removes only the $2025$, about
              $12\%$ of the $16425$.
          - text: >
              Cut per-trade risk, by sizing or hedging each trade.
            correct: true
            feedback: >
              The trade term is $14400$ of the $16425$. Halving $\sigma$ cuts
              it to $3600$, far more than any change to the count could.
          - text: >
              Trade more often, so that the noise averages out.
            feedback: >
              More trades raise $\mathbb{E}[N]\sigma^{2}$ in proportion. Noise
              averages out in the mean per trade, not in the total.
        feedback: >
          The split tells you where the risk lives before you spend effort
          removing it.

      - part: Saying it in dollars
        ask: >
          Risk asks: "how many dollars of daily standard deviation does the
          random count add?" Which answer is right?
        choices:
          - text: >
              $2025$
            feedback: >
              That is variance, in dollars squared. Reported as dollars it
              overstates the effect enormously.
          - text: >
              $45$, the square root of $2025$.
            feedback: >
              Standard deviations do not add: $120 + 45 = 165$ is not
              $128.16$. Only variances split into pieces that add.
          - text: >
              About $8$: $128.16 - 120$.
            correct: true
            feedback: >
              Compare the total standard deviation with and without the
              count term. The random count adds about $7\%$ to the spread.
        feedback: >
          Split in variance, answer in standard deviation, and take the
          difference of square roots, never the square root of a piece.
      - teach: >
          In the interview version, "does a volatile trade count matter more
          for a high-frequency or a low-frequency desk", answer with the
          ratio: "the count term over the trade term is $(\mu/\sigma)^{2}$
          for a Poisson count, so it matters when the edge per trade is large
          against its noise."

  - node: quant-probability.conditioning.truncated-mean
    hook: >
      "Given it's already lasted this long, how much longer should you
      expect to wait" is a memorylessness stress test — exponential says the
      past is irrelevant, uniform says it isn't, and confusing the two is
      the classic trap.
    explanation: >
      For $X\sim\operatorname{Exp}(\lambda)$, the tail probability
      $\Pr(X>t+s\mid X>t) = \Pr(X>t+s)/\Pr(X>t) = e^{-\lambda(t+s)}/
      e^{-\lambda t} = e^{-\lambda s}$ depends only on $s$, not on $t$ — the
      elapsed time cancels completely out of the ratio, the load-bearing
      algebraic step. So the overshoot $X-t$, conditional on having
      survived to $t$, has exactly the same $\operatorname{Exp}(\lambda)$
      law it started with, and its mean is $1/\lambda$ regardless of $t$,
      giving $\mathbb{E}[X\mid X>t] = t+1/\lambda$.

      The uniform case runs the opposite way precisely because it lacks
      that cancellation: conditioning $U\sim\operatorname{Uniform}(0,1)$ on
      $\{U>t\}$ restricts to the interval $(t,1)$, and since the density was
      already flat, the restricted law is exactly $\operatorname{Uniform}
      (t,1)$ — its mean is the interval's midpoint, $(1+t)/2$, and the
      remaining expected wait $(1-t)/2$ shrinks toward $0$ as $t\to 1$.

      The general lesson: $\mathbb{E}[X\mid X>t]-t$, the expected remaining
      wait, is constant in $t$ exactly for the memoryless exponential, and
      this single computation is the standard way an interview checks
      whether you actually understand memorylessness rather than just
      reciting the definition.
    worked: >
      A machine's time to failure is $\operatorname{Exp}(\lambda)$ with
      mean $1/\lambda=4$ years; given it has already run for $6$ years, the
      expected total lifetime is $6+4=10$ years — three more years of
      survival added exactly three more years to the answer. Contrast a
      component with a uniform lifetime on $(0,8)$ years: given it has
      survived $6$ years, its conditional mean lifetime is $(8+6)/2=7$
      years, only $1$ more year expected beyond the $6$ already elapsed —
      the uniform component is "aging," its expected remaining life
      shrinking the longer it survives.
    interview: >
      "A part has survived $t$ years already — what's its expected total
      lifetime" tests memorylessness directly for an exponential ("no
      penalty or bonus for age, just add the mean"), and swapping in a
      uniform or bounded lifetime is the natural follow-up to check you
      don't blindly reuse $t+1/\lambda$ where it doesn't apply.
    pitfalls: >
      Applying $t+1/\lambda$ to a non-exponential lifetime is the single
      most common error this node exists to prevent — memorylessness is a
      special property of the exponential, not a general fact about
      conditioning on survival. Forgetting the uniform's support is bounded
      above and computing a remaining-wait formula that ignores the upper
      endpoint breaks the calculation.
    recap: >
      Exponential survival adds no information — $\mathbb{E}[X\mid X>t] =
      t+1/\lambda$ always — while a bounded uniform's remaining expected
      wait genuinely shrinks as $t$ grows, $(1+t)/2$ on $(0,1)$.
    dialogue:
      - part: A quiet tape
        teach: >
          The time $X$ until the next trade in a thin stock is exponential
          with mean $3$ minutes. You have been watching for $5$ minutes and
          nothing has printed.
      - ask: >
          Before computing anything: how much longer do you expect to wait?
        choices:
          - text: >
              Less than $3$ minutes: after $5$ quiet minutes a trade is
              overdue.
            feedback: >
              "Overdue" assumes the clock remembers how long it has run. The
              exponential's does not, as the next computation shows.
          - text: >
              More than $3$ minutes: a quiet tape tends to stay quiet.
            feedback: >
              That would be true if quiet stretches came in slow and fast
              kinds and survival hinted at the slow kind. A single
              exponential has only one kind.
          - text: >
              Exactly $3$ minutes, as if you had just sat down.
            correct: true
            feedback: >
              The exponential is memoryless: $5$ quiet minutes tell you
              nothing about the remaining wait.
        feedback: >
          The claim is checkable in one line, and the line is worth knowing
          by heart.
      - ask: >
          What is $\Pr(X > 7 \mid X > 5)$, the chance of at least $2$ more
          quiet minutes?
        expects: "0.5134"
        tolerance: 0.0005
        hint: >
          $\Pr(X > x) = e^{-x/3}$. Divide.
        feedback: >
          $e^{-7/3}/e^{-5/3} = e^{-2/3} \approx 0.5134$, exactly
          $\Pr(X > 2)$. The $5$ cancels: given survival to $t$, the overshoot
          $X - t$ is again exponential with mean $3$.
      - ask: >
          What is $\mathbb{E}[X \mid X > 5]$, in minutes?
        expects: "8"
        feedback: >
          The $5$ minutes already gone, plus a fresh exponential overshoot
          with mean $3$: $5 + 3 = 8$. In general
          $\mathbb{E}[X \mid X > t] = t + 1/\lambda$.

      - part: A bus with a deadline
        ask: >
          A bus arrives at a time uniform on $(0, 20)$ minutes. You have
          waited $12$ minutes. What is your expected total wait, in minutes?
        expects: "16"
        hint: >
          Given $X > 12$, the arrival is uniform on $(12, 20)$.
        feedback: >
          Restricting a flat density to $(12, 20)$ leaves it flat there, with
          mean $(12 + 20)/2 = 16$. Only $4$ more minutes are expected.
      - ask: >
          Given you have waited $12$ minutes, what is the probability the bus
          arrives within the next $4$?
        expects: "0.5"
        feedback: >
          $4/8 = 0.5$. Before you had waited at all, the chance of an arrival
          within $4$ minutes was $4/20 = 0.2$. Waiting has made the bus more
          imminent.
      - reflect: >
          The trade clock's remaining wait stays at $3$ however long you
          watch; the bus's falls from $10$ to $4$ after $12$ minutes, and to
          $1$ after $18$. What does the exponential have that the uniform
          lacks?
        hint: >
          Compare $\Pr(X > t + s)/\Pr(X > t)$ for the two.
        answer: >
          For the exponential, $\Pr(X > t + s)/\Pr(X > t) = e^{-\lambda s}$:
          the elapsed time cancels from the ratio, so the future looks the
          same from every $t$. For the uniform the ratio is $(20 - t - s)/(20
          - t)$, which depends on $t$, because a hard deadline at $20$ gets
          closer as you wait. The bus must come by then; the trade never has
          to.

      - part: Neither memoryless nor ageing
        ask: >
          Now quiet stretches come in two kinds, equally often: "lunch",
          exponential with mean $9$ minutes, and "busy", exponential with mean
          $1$ minute. After $5$ quiet minutes, what is the expected remaining
          wait?
        choices:
          - text: >
              $5$ minutes, the average of $9$ and $1$, since each piece is
              memoryless.
            feedback: >
              Each piece is memoryless, but the mixture is not: surviving $5$
              minutes is strong evidence you are at lunch, and that shifts the
              weights.
          - text: >
              Close to $9$ minutes: survival makes "lunch" almost certain.
            correct: true
            feedback: >
              The chances of $5$ quiet minutes are $e^{-5/9} \approx 0.574$
              at lunch and $e^{-5} \approx 0.007$ when busy, so lunch has
              conditional probability about $0.988$ and the remaining wait is
              about $0.988(9) + 0.012(1) \approx 8.9$.
          - text: >
              Less than $5$ minutes: the busy kind ends quickly.
            feedback: >
              The busy kind usually ended long before minute $5$. Given that
              the tape is still quiet, you are almost surely not in it.
        feedback: >
          A mixture of exponentials gets younger as it ages: the longer it
          survives, the more it looks like its slowest piece. Memorylessness
          belongs to a single exponential, not to things built from them.
      - ask: >
          For which lifetimes is the expected remaining wait,
          $\mathbb{E}[X \mid X > t] - t$, the same for every $t$?
        choices:
          - text: >
              Any lifetime with a flat density, since nothing about it changes
              over time.
            feedback: >
              The bus is flat and its remaining wait falls from $10$ to $1$. A
              flat density on a bounded interval ages fastest of all near the
              end.
          - text: >
              The exponential.
            correct: true
            feedback: >
              Among continuous lifetimes, a constant expected remaining wait
              forces the exponential. It is the one law with no memory.
          - text: >
              Any lifetime with mean $1/\lambda$.
            feedback: >
              The bus has a mean of $10$, and its remaining wait still
              shrinks. The mean alone says nothing about how the remaining
              wait moves.
        feedback: >
          Exponential: constant. Bounded uniform: shrinking. A mixture of
          exponentials: growing. The conditional mean given survival tells
          the three apart.
      - teach: >
          Asked "it has lasted $t$ already, how long in total?", check the law
          before answering. For an exponential, say "memoryless, so
          $t + 1/\lambda$"; for anything with a ceiling, restrict and average
          on what is left.

  - node: quant-probability.conditioning.regime-mixture
    hook: >
      "Mixing two calm-looking regimes still gives you extra risk from the
      fact that their means differ" is the numeric gut-check every total
      variance calculation should pass before trusting it.
    explanation: >
      This is the law of total variance applied to a two-point regime
      variable $Y$: compute $\mathbb{E}[X]$ as the probability-weighted
      average of the regime means, then split $\operatorname{Var}(X)$ into
      $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ (the weighted average of the
      regime variances) plus $\operatorname{Var}(\mathbb{E}[X\mid Y])$,
      which for a two-point $Y$ with conditional means $m_1,m_2$ and
      probabilities $p,1-p$ simplifies to $p(1-p)(m_1-m_2)^{2}$ — a formula
      worth memorising for exactly this shape.

      The comparison worth internalising: naively averaging the two regime
      variances, ignoring that the means differ, always understates the
      true total variance whenever $m_1\ne m_2$, since it drops the entire
      between-group term. The gap grows with how far apart the regime means
      are and with how balanced the regime probabilities are — maximised,
      for fixed means, at $p=0.5$.

      This two-regime shape recurs constantly: bull and bear markets, on
      and off promotional pricing, day and night traffic — anywhere a
      variable's mean shifts between a small number of states, the
      between-group term is not an edge case to check for, it's the default
      source of extra variance.
    worked: >
      A trading strategy is "on" with probability $0.3$, earning mean P&L
      $10$ dollars with standard deviation $4$ dollars, and "off" with
      probability $0.7$, earning mean $0$ with standard deviation $1$
      dollar. Then $\mathbb{E}[X] = 0.3(10)+0.7(0) = 3$. Within-group:
      $\mathbb{E}[\operatorname{Var}(X\mid Y)] = 0.3(16)+0.7(1) = 5.5$.
      Between-group: $p(1-p)(m_1-m_2)^{2} = (0.3)(0.7)(10)^{2} = 21$. Total
      $\operatorname{Var}(X)=26.5$, standard deviation
      $\sqrt{26.5}\approx 5.15$ dollars — averaging the two variances alone
      ($5.5$) would have understated the true variance by nearly a factor
      of five, because almost all the risk here comes from not knowing
      whether the strategy is on.
    interview: >
      "A strategy is only sometimes active — how do you find its overall
      P&L variance" is answered by naming the two-point total-variance
      formula directly, $\mathbb{E}[\operatorname{Var}(X\mid Y)] +
      p(1-p)(m_1-m_2)^{2}$, rather than averaging the component variances.
    pitfalls: >
      Averaging the two regime variances and stopping there is the error
      this example exists to make vivid, understating risk here by nearly
      $5\times$. Using the wrong weights in the between-group term, or
      forgetting to square the mean difference, mis-states its contribution.
    recap: >
      An on/off strategy with regime probabilities $0.3/0.7$ and means
      $10/0$ dollars has standard deviation about $5.15$ dollars, almost
      entirely from the between-regime term $21$ — averaging the component
      variances alone would have badly understated the risk.
    dialogue:
      - part: Normal days and event days
        teach: >
          A strategy has two kinds of day. Normal days, with probability
          $0.9$: P&L of mean $2$ and standard deviation $3$. Event days, with
          probability $0.1$: mean $-8$ and standard deviation $10$. Let $X$ be
          the day's P&L and $Y$ the kind of day. Risk wants the standard
          deviation of $X$.
      - ask: >
          What is the mean daily P&L?
        expects: "1"
        feedback: >
          $0.9(2) + 0.1(-8) = 1.8 - 0.8 = 1$.
      - ask: >
          What is the within-regime term, $\mathbb{E}[\operatorname{Var}(X
          \mid Y)]$?
        expects: "18.1"
        feedback: >
          $0.9(3^{2}) + 0.1(10^{2}) = 8.1 + 10 = 18.1$. The event days, one
          in ten, supply more than half of it.
      - ask: >
          What is the between-regime term, $\operatorname{Var}(\mathbb{E}[X
          \mid Y])$?
        expects: "9"
        hint: >
          The regime mean is $2$ with probability $0.9$ and $-8$ with
          probability $0.1$, around an overall mean of $1$.
        feedback: >
          $0.9(2 - 1)^{2} + 0.1(-8 - 1)^{2} = 0.9 + 8.1 = 9$.
      - ask: >
          What is the standard deviation of daily P&L?
        expects: "5.2058"
        tolerance: 0.001
        feedback: >
          $\sqrt{18.1 + 9} = \sqrt{27.1} \approx 5.2058$.

      - part: A shortcut, and the naive answers
        reflect: >
          The between term came out $9$, which is also $0.9 \times 0.1 \times
          10^{2}$. Why does a two-regime mean always give $p(1-p)(m_1 -
          m_2)^{2}$, and what does that say about when it is largest?
        hint: >
          The regime mean is $m_2$ plus $(m_1 - m_2)$ times a Bernoulli
          variable.
        answer: >
          The regime mean equals $m_2 + (m_1 - m_2)B$ with $B$ Bernoulli($p$),
          so its variance is $(m_1 - m_2)^{2}p(1 - p)$. It grows with the
          square of the gap between the regime means, and for a fixed gap it
          is largest at $p = 1/2$, when you are least sure which regime you
          are in.
      - teach: >
          So for two regimes, $\operatorname{Var}(X) = \mathbb{E}[\operatorname{Var}(X
          \mid Y)] + p(1 - p)(m_1 - m_2)^{2}$, a formula worth having ready.
          The naive answers are the ones that stop early: averaging the
          standard deviations gives $0.9(3) + 0.1(10) = 3.7$, and averaging
          the variances, then taking the root, gives $\sqrt{18.1} \approx
          4.25$.
      - ask: >
          What does $\sqrt{18.1} \approx 4.25$ leave out?
        choices:
          - text: >
              The gap between the regime means, which is $9$ of the $27.1$.
            correct: true
            feedback: >
              A third of the variance comes from not knowing whether today
              will average $+2$ or $-8$. Averaging the variances drops it.
          - text: >
              The fat tail of event days.
            feedback: >
              Event-day spread is inside the $18.1$: it contributes $10$ of
              it. The tail is counted.
          - text: >
              Nothing material: the difference is rounding.
            feedback: >
              $4.25$ against $5.21$ is an understatement of almost a fifth in
              standard deviation, a third in variance.
        feedback: >
          Averaging standard deviations understates further still, at $3.7$.
          Only within plus between gives the risk.
      - ask: >
          If event days came one in four instead, with the same regime means
          and standard deviations, what would the between term be?
        expects: "18.75"
        feedback: >
          $0.25 \times 0.75 \times 10^{2} = 18.75$, more than double the $9$.
          As $p$ moves toward $1/2$ the uncertainty about the regime grows,
          and so does the term.

      - part: Where the risk really lives
        ask: >
          Back to event days one in ten. The desk can halve the event-day
          standard deviation, from $10$ to $5$, or hedge so that event days
          average $0$ instead of $-8$, keeping their standard deviation. Which
          cuts the variance more?
        choices:
          - text: >
              Halving the event-day standard deviation.
            feedback: >
              Within drops to $8.1 + 0.1(25) = 10.6$; between stays $9$.
              Total $19.6$, a good cut but not the best.
          - text: >
              Hedging the event-day mean to $0$.
            correct: true
            feedback: >
              The gap shrinks from $10$ to $2$, so between falls to $0.09
              \times 4 = 0.36$; within stays $18.1$. Total $18.46$.
          - text: >
              They are about the same, since both tame event days.
            feedback: >
              They hit different terms: one the event-day spread, the other
              the gap between regime means. Here closing the gap wins,
              $18.46$ against $19.6$.
        feedback: >
          The between term is risk like any other, and sometimes the cheapest
          to remove.
      - teach: >
          Asked for the variance of a sometimes-active or two-regime P&L, say
          the formula first: "average within-regime variance plus
          $p(1 - p)$ times the squared gap in means." Then point out that
          averaging the variances alone would have understated the risk.

  - node: quant-probability.conditioning.exchangeable-share
    hook: >
      "Given the total, what's the expected value of just one of the
      contributing pieces" is answered instantly by symmetry whenever the
      pieces are exchangeable — no distribution ever needs to be computed.
    explanation: >
      Symmetry, not independence, is the hypothesis: if $X_1,\dots,X_n$ are
      exchangeable, permuting their labels doesn't change the joint law, so
      relabelling inside the conditioning event $\{S=s\}$ leaves everything
      unchanged too — every $\mathbb{E}[X_i\mid S]$ must equal every other
      one, since nothing in the setup distinguishes index $i$ from index
      $j$ once you know only their sum.

      The rest is one line of algebra: summing the (all equal) conditional
      expectations over $i=1,\dots,n$ gives $\sum_i \mathbb{E}[X_i\mid S] =
      \mathbb{E}[\sum_i X_i\mid S] = \mathbb{E}[S\mid S] = S$, using
      linearity and the rule that a function of $S$ passes through
      conditioning on $S$ unchanged. Since all $n$ terms on the left are
      identical, each one equals $S/n$ — no distributional computation, no
      need to even know the individual $X_i$'s marginal law.

      The result is special to the sum, not a general symmetry fact:
      conditioning on $\max(X_1,\dots,X_n)$ or on $X_1-X_2$ instead of $S$
      does not give a clean closed form this way, because those statistics
      don't interact with "sum of conditional expectations equals
      conditional expectation of the sum" the same way — the sum is exactly
      the one function of the $X_i$ for which linearity turns "add up $n$
      equal unknowns" into "solve for one."
    worked: >
      Deal five cards from a well-shuffled standard deck and let $X_i$ be
      the numeric value of the $i$-th card (ace $=1$, ..., king $=13$),
      exchangeable since the deck is uniformly shuffled. Given the five
      cards sum to $S=40$, each card's conditional expected value is
      $\mathbb{E}[X_i\mid S=40] = 40/5 = 8$ — true for every one of the
      five cards individually, without ever working out which specific
      hands sum to $40$.
    interview: >
      "Given the total of $n$ symmetric draws, what's the expected value of
      one specific draw" should be answered immediately with $S/n$ and the
      one-line symmetry argument — interviewers use this to check whether
      you reach for symmetry before reaching for a distributional
      computation that isn't needed.
    pitfalls: >
      Applying $S/n$ when the $X_i$ are not exchangeable — different
      distributions, or non-symmetric dependence — has no justification;
      the equal-conditional-expectation step is exactly where it breaks.
      Trying the same trick on $\max(X_i)$ or a difference like $X_1-X_2$
      doesn't work; the clean closed form is special to conditioning a
      summand on the sum.
    recap: >
      Given the total $S$ of $n$ exchangeable variables, each one's
      conditional expectation is $S/n$ by symmetry alone — five cards
      summing to $40$ give each card conditional mean $8$, no distribution
      needed.
    dialogue:
      - part: Three coins and their total
        teach: >
          Three fair coins are tossed; $X_i$ is $1$ if coin $i$ lands heads and
          $0$ otherwise, and $S = X_1 + X_2 + X_3$. You are not shown the
          coins, only told that $S = 2$.
      - ask: >
          What is $\mathbb{E}[X_1 \mid S = 2]$?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          List the equally likely outcomes with exactly two heads.
        feedback: >
          The outcomes are HHT, HTH and THH, equally likely. Coin one is heads
          in two of the three, so $\mathbb{E}[X_1 \mid S = 2] = 2/3$.
      - ask: >
          What is $\mathbb{E}[X_1 + X_2 + X_3 \mid S = 2]$?
        expects: "2"
        feedback: >
          The sum is $S$, and given $S = 2$ it is $2$ for certain. By
          linearity it is also $\mathbb{E}[X_1 \mid S = 2] + \mathbb{E}[X_2
          \mid S = 2] + \mathbb{E}[X_3 \mid S = 2]$.
      - reflect: >
          You found $2/3$ by listing. Without listing anything, and for any
          number of coins and any total, why must each coin's conditional
          mean be $S/n$?
        hint: >
          Is there anything that distinguishes coin one from coin three once
          you know only the total?
        answer: >
          Nothing distinguishes the coins: relabelling them changes neither
          their joint law nor the total, so all the $\mathbb{E}[X_i \mid S]$
          must be equal. Their sum is $\mathbb{E}[S \mid S] = S$ by linearity
          and because $S$ is known given $S$. So $n$ equal numbers add to $S$,
          and each is $S/n$. Here, $2/3$.

      - part: Equal shares by symmetry
        teach: >
          The rule: if $X_1, \dots, X_n$ are exchangeable, meaning their joint
          law is unchanged by any relabelling, and $S$ has finite mean, then
          $\mathbb{E}[X_i \mid S] = S/n$ for every $i$. No distribution is
          ever computed: symmetry makes the shares equal, linearity makes them
          add to $S$.
      - ask: >
          A candidate argues: "each $X_i$ has mean $\mathbb{E}[S]/n$, so
          $\mathbb{E}[X_i \mid S] = \mathbb{E}[S]/n$." What is wrong?
        choices:
          - text: >
              Nothing: it is the same rule written with the mean of $S$.
            feedback: >
              For the three coins $\mathbb{E}[S]/3 = 1/2$, but given $S = 2$
              you found $2/3$. The candidate's answer ignores the total you
              were told.
          - text: >
              It needs the $X_i$ to be independent, which was not assumed.
            feedback: >
              Independence is not the problem. The answer is a constant, so
              it cannot respond to the observed total at all.
          - text: >
              It averages the total away: the shares must add to $S$ itself,
              by linearity and $\mathbb{E}[S \mid S] = S$, not to its mean.
            correct: true
            feedback: >
              $S$ is known given $S$, so it passes through the conditioning
              untouched. That is what makes the answer $S/n$, a random
              variable, rather than a constant.
        feedback: >
          Averaging $S/n$ over $S$ does give $\mathbb{E}[S]/n$, as the tower
          property demands, but the conditional share is $S/n$ before that
          averaging.
      - ask: >
          A teller serves four customers in a row; their service times are
          iid exponential. The four took $10$ minutes in total. What is the
          expected length of the first service, in minutes?
        expects: "2.5"
        feedback: >
          $10/4 = 2.5$. The exponential law never entered: iid variables are
          exchangeable, and that is all the rule needs.
      - ask: >
          Three cards are drawn without replacement from ten cards numbered
          $1$ to $10$, and they total $15$. What is the expected value of the
          first card drawn?
        choices:
          - text: >
              It cannot be found by the rule: draws without replacement are
              not independent.
            feedback: >
              Independence is not the hypothesis. Every ordering of the three
              cards is equally likely, so the draws are exchangeable, and
              that is enough.
          - text: >
              $5$
            correct: true
            feedback: >
              The three draws are exchangeable, so each has conditional mean
              $15/3 = 5$.
          - text: >
              $5.5$, the mean of the ten cards.
            feedback: >
              That ignores the total. Knowing the three cards sum to $15$,
              well below the $16.5$ you would expect, pulls each one down.
        feedback: >
          Exchangeability, not independence, carries the argument. Dealing
          from a deck or sampling without replacement qualifies.

      - part: Where equal shares fail
        ask: >
          Two coins are tossed: coin one is fair, coin two lands heads with
          probability $0.9$. Exactly one head appears. What is
          $\mathbb{E}[X_1 \mid S = 1]$?
        expects: "0.1"
        hint: >
          Compare the chances of heads-tails and tails-heads.
        feedback: >
          Heads-tails has probability $0.5 \times 0.1 = 0.05$ and tails-heads
          $0.5 \times 0.9 = 0.45$, so $\mathbb{E}[X_1 \mid S = 1] =
          0.05/0.5 = 0.1$, not $1/2$. The coins are independent but not
          exchangeable, and the head almost surely came from the biased one.
      - ask: >
          Two fair coins again, but now you are told $M = \max(X_1, X_2) =
          1$: at least one head. Does each coin's conditional mean equal
          $M/2 = 1/2$?
        choices:
          - text: >
              Yes: the coins are exchangeable, so they share the information
              equally.
            feedback: >
              They do share it equally, but the shares need not add to $1$.
              Linearity adds up to $\mathbb{E}[X_1 + X_2 \mid M]$, which is not
              $M$.
          - text: >
              No: each is $2/3$.
            correct: true
            feedback: >
              Given at least one head, the outcomes HH, HT, TH are equally
              likely and coin one is heads in two of them. The two shares are
              equal, but they add to $4/3$, not to $M$.
          - text: >
              No: each is $1$, since a head appeared.
            feedback: >
              In TH, coin one is tails. A head appeared, but not necessarily
              on coin one.
        feedback: >
          The rule needs the conditioning statistic to be the sum, because
          only for the sum do the equal shares add to something known.
          Exchangeability gives equal shares; the sum tells you what they add
          to.
      - teach: >
          Asked "given the total of $n$ symmetric draws, what is one of them
          worth?", answer $S/n$ at once and give the two-line reason:
          "exchangeable, so all equal; they add to $\mathbb{E}[S \mid S] = S$."
          Then say which hypothesis you used, and that it is the sum.
