unit: quant-probability.conditioning
opening: >
  Conditioning turns a single random variable into a whole family of
  forecasts, one per value of whatever you've observed, and this unit builds
  the machinery to manipulate that family rigorously. It opens with
  conditioning on an event and then on a variable, arrives at
  $\mathbb{E}[X\mid Y]$ itself — a random variable, not a number — and its
  algebra, then proves the two identities that do almost all the work
  downstream: the tower property, which says a forecast is unbiased on
  average, and the law of total variance, which splits risk into within- and
  between-group pieces. The back half turns theory into technique:
  conditioning on the first step of a process to set up an equation, the mean
  and variance of a randomly-stopped sum, and a run of fully worked examples —
  truncated exponentials and uniforms, regime mixtures, exchangeable shares of
  a total — that are exactly the shape interview questions take.
lessons:
  - node: quant-probability.conditioning.conditional-given-event
    hook: >
      Every "expected value given that ..." question in an interview is this
      move, and it's the base case the rest of the unit — conditional
      distributions, $\mathbb{E}[X\mid Y]$, the tower property — is built
      from.
    explanation: >
      Conditioning on an event throws away every outcome outside $A$ and
      rescales what's left so probabilities inside $A$ still sum to $1$ —
      divide by $\Pr(A)$. $\mathbb{E}[X\mid A]$ is just the ordinary
      expectation computed in that shrunk world: average $x$ against the
      renormalised law $\Pr(X=x\mid A)$.

      The load-bearing algebra is one step: $\sum_x x\Pr(X=x\mid A) = \sum_x
      x\Pr(X=x,A)/\Pr(A) = \mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$, pulling the
      constant $\Pr(A)$ out of the sum. This form — expectation of $X$ times
      the indicator, divided by $\Pr(A)$ — is the one worth keeping in your
      hands, since it never requires writing out the whole restricted
      distribution when only the mean is wanted.

      The general pattern behind "given that," "restricted to," "among
      those who": average $X$ over the qualifying subset only, weighted the
      same way probabilities inside that subset are weighted. A pension's
      expected payout given survival to retirement, a trade's expected P&L
      given a signal fired, a queue's expected wait given no cancellation yet
      — all the same computation.
    worked: >
      Roll two fair dice and let $X$ be their sum. Condition on $A =
      \{\text{first die shows } 3\}$: given $A$, the second die is still
      uniform on $\{1,\dots,6\}$, so $X = 3 + \text{second die}$ and
      $\mathbb{E}[X\mid A] = 3+\mathbb{E}[\text{second die}] = 3+3.5 = 6.5$.
      Directly: the six equally likely outcomes under $A$ give sums
      $4,5,6,7,8,9$, averaging to $39/6 = 6.5$, matching.
    interview: >
      "What's the expected value of $X$ given that [some event] happened" is
      answered by restricting to the event and averaging inside it — state
      $\mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$ once, then compute directly by
      restriction whenever the outcomes stay easy to enumerate, since
      interviewers reward the faster route.
    pitfalls: >
      Averaging $X$ over $A$ with the unconditional probabilities instead of
      the rescaled ones understates every conditional mean — you must divide
      by $\Pr(A)$, not just sum $x\Pr(X=x,A)$. The formula needs $\Pr(A)>0$;
      a conditioning event with zero probability makes the expression
      $0/0$, not zero.
    recap: >
      $\mathbb{E}[X\mid A] = \mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$ is
      expectation computed after restricting to and rescaling within $A$ —
      here, a die's sum given its first face is $3$ averages to $6.5$.
    steps:
      - teach: >
          Conditioning on $A$ throws away every outcome outside it and
          rescales what remains so probabilities inside $A$ still sum to $1$
          — divide by $\Pr(A)$. $\mathbb{E}[X\mid A]$ is nothing but the
          ordinary expectation computed inside that shrunk, renormalised
          world.
      - teach: >
          The formula packages that rescaling in one line: $\mathbb{E}[X\mid
          A] = \mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$. Multiply $X$ by the
          indicator to zero out everything outside $A$, take the ordinary
          expectation, then divide by $\Pr(A)$ to undo the rescaling.
      - ask: >
          A coin lands heads with probability $0.4$ and is flipped three
          times; let $X$ be the number of heads. Condition on $A =
          \{\text{the first flip is heads}\}$. What is $\mathbb{E}[X\mid
          A]$?
        expects: "1.8"
        hint: >
          Given $A$, the first flip contributes one head for certain, and
          the other two flips are still independent fair-ish coin tosses
          with probability $0.4$ each.
        feedback: >
          Given $A$, $X = 1 + Y$ where $Y$ is the number of heads in the
          remaining two flips, a $\text{Binomial}(2, 0.4)$ variable with
          mean $0.8$. So $\mathbb{E}[X\mid A] = 1 + 0.8 = 1.8$.
      - teach: >
          The same move answers "given that," "restricted to," and "among
          those who" wherever they appear: average $X$ only over the
          qualifying outcomes, weighted exactly as probability is weighted
          inside that subset — a pension's payout given survival, a queue's
          wait given no cancellation, are the same computation.
      - ask: >
          Roll one fair die and let $X$ be the face shown. Condition on $A
          = \{X \text{ is prime}\}$. What is $\mathbb{E}[X\mid A]$?
        expects: "3.333"
        tolerance: 0.001
        hint: >
          The primes among $\{1,\dots,6\}$ are $2$, $3$, $5$, each equally
          likely given $A$.
        feedback: >
          $A = \{2,3,5\}$, each with conditional probability $1/3$, so
          $\mathbb{E}[X\mid A] = (2+3+5)/3 = 10/3 \approx 3.333$.
      - teach: >
          Two traps sit right in the formula. Averaging over $A$ with the
          unconditional probabilities $\Pr(X=x)$ instead of the rescaled
          $\Pr(X=x\mid A)$ understates every conditional mean — the
          division by $\Pr(A)$ is not optional. And the formula needs
          $\Pr(A) > 0$; conditioning on a probability-zero event leaves
          $0/0$, not zero.
      - ask: >
          $\Pr(A) = 0$ for some event $A$. What is $\mathbb{E}[X\mid A]$?
        choices:
          - text: >
              $0$
            feedback: >
              There is no outcome to average over with weight zero
              everywhere — the ratio is $0/0$, not $0$.
          - text: >
              $\mathbb{E}[X]$
            feedback: >
              That would be the unconditional mean; a probability-zero
              conditioning event gives no valid renormalisation to fall
              back on.
          - text: >
              Undefined
            correct: true
            feedback: >
              $\mathbb{E}[X\mid A] = \mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$
              divides by $\Pr(A)$, and dividing by zero leaves the
              expression undefined.
          - text: >
              $1$
            feedback: >
              Nothing in the formula produces $1$ here; this confuses a
              probability with an expectation.
        feedback: >
          The formula requires $\Pr(A) > 0$ — a zero-probability
          conditioning event has no renormalised world to average inside.
      - teach: >
          Whenever a question says "given that," write $\mathbb{E}[X\mid A]
          = \mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$ once, then compute directly
          by restriction whenever the outcomes stay easy to enumerate — the
          formula and the shortcut are the same idea.

  - node: quant-probability.conditioning.conditional-distribution
    hook: >
      The moment a problem says "given $Y=y$," it's handing you a whole new
      distribution for $X$, not just a number — build it once and every
      conditional question about $X$ becomes a plain computation inside it.
    explanation: >
      Slicing the joint law at $Y=y$ and renormalising by $\Pr(Y=y)$ (or
      $f_Y(y)$) is exactly conditioning on the event $\{Y=y\}$, applied to
      $X$ — the same rescaling as "Conditioning on an event," just done
      outcome-by-outcome for every $y$ instead of once. What's new is
      bookkeeping: a family of distributions, one $p_{X\mid Y}(\cdot\mid y)$
      per value $y$ can take, not a single restricted law.

      The continuous case forces a change of definition, not just of
      notation: $\{Y=y\}$ has probability zero, so dividing by $\Pr(Y=y)$ is
      meaningless. Instead $f_{X\mid Y}(x\mid y) = f(x,y)/f_Y(y)$ is
      *defined* to be the ratio of densities, and it's checked directly to
      integrate to $1$ in $x$ for each fixed $y$ — a genuine density,
      arrived at without ever conditioning on a probability-zero event.

      Reversing the ratio gives the chain rule $f(x,y) = f_{X\mid Y}(x\mid
      y)f_Y(y)$, the standard recipe for building a joint law top-down: draw
      $Y$ from its marginal, then draw $X$ from the conditional law attached
      to that $Y$. Every hierarchical model — a random parameter followed by
      data given the parameter — is written exactly this way.
    worked: >
      Let $Y$ be uniform on $\{1,2,3\}$ and, given $Y=y$, let $X$ be uniform
      on $\{1,\dots,y\}$. Then $p_{X\mid Y}(x\mid 2) = 1/2$ for $x\in\{1,2\}$,
      so $\mathbb{E}[X\mid Y=2]=1.5$; and $p_{X\mid Y}(x\mid 3)=1/3$ for
      $x\in\{1,2,3\}$, so $\mathbb{E}[X\mid Y=3]=2$. Three different
      distributions for $X$, one per value of $Y$, each a legitimate law in
      its own right.
    interview: >
      "Given the parameter/regime/count is $y$, what does $X$ look like"
      wants you to name the whole conditional law, not jump straight to a
      mean — stating $p_{X\mid Y}(\cdot\mid y)$ or $f_{X\mid Y}(\cdot\mid y)$
      explicitly signals you understand it's a distribution, and it sets up
      the chain rule for building joint models.
    pitfalls: >
      In the continuous case, conditioning "on $Y=y$" is a definition (a
      ratio of densities), not a literal restriction to a probability-zero
      event — don't try to justify it the way you justify the discrete case.
      Also, $f_{X\mid Y}(\cdot\mid y)$ is only defined where $f_Y(y)>0$;
      plugging in a $y$ the marginal never reaches is undefined, not zero.
    recap: >
      Slicing the joint law at $Y=y$ and renormalising gives a full
      distribution for $X$ per value of $y$, and reversing that ratio is the
      standard way to build a joint law from "draw $Y$, then draw $X$ given
      $Y$."
    steps:
      - teach: >
          Conditioning on $Y=y$ hands you a whole distribution for $X$, not
          a single number — build $p_{X\mid Y}(\cdot\mid y)$ or $f_{X\mid
          Y}(\cdot\mid y)$ once, and every question about $X$ given that $y$
          becomes a plain computation inside it.
      - teach: >
          In the discrete case, slice the joint law at $Y=y$ and rescale by
          $\Pr(Y=y)$: $p_{X\mid Y}(x\mid y) = p(x,y)/p_Y(y)$. It is exactly
          conditioning on the event $\{Y=y\}$, done for $X$ at every value
          of $y$ in turn.
      - ask: >
          Let $Y\in\{1,2\}$ with $\Pr(Y=1)=0.4$ and $\Pr(Y=2)=0.6$, and
          suppose $\Pr(X=5, Y=2)=0.18$. What is $p_{X\mid Y}(5\mid 2)$?
        expects: "0.3"
        hint: >
          Divide the joint probability by the marginal $\Pr(Y=2)$.
        feedback: >
          $p_{X\mid Y}(5\mid 2) = \Pr(X=5,Y=2)/\Pr(Y=2) = 0.18/0.6 = 0.3$.
      - teach: >
          The continuous case forces a genuine redefinition, not just new
          notation: $\{Y=y\}$ has probability zero, so dividing by
          $\Pr(Y=y)$ is meaningless. Instead $f_{X\mid Y}(x\mid y) =
          f(x,y)/f_Y(y)$ is *defined* as a ratio of densities, wherever
          $f_Y(y)>0$, and it integrates to $1$ in $x$ like any genuine
          density.
      - ask: >
          Which of these correctly describes $f_{X\mid Y}(x\mid y)$ for a
          continuous pair $(X,Y)$?
        choices:
          - text: >
              $\Pr(X=x\mid Y=y)$, computed directly since $\{Y=y\}$ has
              positive probability
            feedback: >
              $\{Y=y\}$ has probability $0$ for a continuous $Y$, so this
              direct restriction is undefined — the density ratio is a
              separate definition, not a literal restriction.
          - text: >
              $f(x,y)/f_Y(y)$, wherever $f_Y(y)>0$
            correct: true
            feedback: >
              This is exactly the definition: a ratio of densities, valid
              at every $y$ the marginal density reaches.
          - text: >
              $f(x,y)\cdot f_Y(y)$
            feedback: >
              This multiplies rather than divides — it does not renormalise
              to a density integrating to $1$ in $x$.
          - text: >
              $f_Y(y)/f(x,y)$
            feedback: >
              The ratio is inverted; this need not even integrate to a
              finite value in $x$.
        feedback: >
          $f_{X\mid Y}(x\mid y) = f(x,y)/f_Y(y)$, defined wherever
          $f_Y(y)>0$, because $\{Y=y\}$ itself carries no probability to
          condition on directly.
      - teach: >
          Reversing the ratio gives the chain rule $f(x,y) = f_{X\mid
          Y}(x\mid y)f_Y(y)$ — the standard recipe for building a joint law
          top-down: draw $Y$ from its marginal, then draw $X$ from the
          conditional law attached to that $Y$.
      - ask: >
          Let $Y$ be uniform on $\{2,3,4\}$ and, given $Y=y$, let $X$ be
          uniform on $\{1,\dots,y\}$. What is $\mathbb{E}[X\mid Y=4]$?
        expects: "2.5"
        hint: >
          A uniform law on $\{1,\dots,y\}$ has mean $(y+1)/2$.
        feedback: >
          $p_{X\mid Y}(x\mid 4) = 1/4$ for $x\in\{1,2,3,4\}$, so
          $\mathbb{E}[X\mid Y=4] = (1+2+3+4)/4 = (4+1)/2 = 2.5$.
      - teach: >
          When a problem says "given the parameter/regime/count is $y$,"
          name the whole conditional law first, not just its mean — stating
          $p_{X\mid Y}(\cdot\mid y)$ or $f_{X\mid Y}(\cdot\mid y)$
          explicitly is what sets up the chain rule for building a joint
          model.

  - node: quant-probability.conditioning.conditional-expectation
    hook: >
      The interview-killing distinction is $\mathbb{E}[X\mid Y=3]$, a
      number, versus $\mathbb{E}[X\mid Y]$, a random variable — mixing them
      up breaks every identity that follows in this unit.
    explanation: >
      For each fixed $y$, $g(y) = \mathbb{E}[X\mid Y=y]$ is an ordinary
      number, computed by averaging against the conditional law attached to
      that $y$ — nothing new here beyond plugging into the previous node's
      family of distributions one $y$ at a time.

      The move that matters is composing $g$ with the random variable $Y$
      itself: $\mathbb{E}[X\mid Y] := g(Y)$. Before $Y$ is observed, you
      don't know which number $g(y)$ you'll get, so $\mathbb{E}[X\mid Y]$ is
      genuinely random — a function of $Y$ alone, completely determined once
      $Y$ is known, but unknown beforehand exactly like $Y$ itself.

      Read it as a forecast: $\mathbb{E}[X\mid Y]$ is "my best guess at $X$,
      as a rule that updates once I see $Y$" — before observing $Y$ you can
      already write down what your estimate of $X$ will be for every
      possible outcome, and observing $Y$ just tells you which branch of
      that rule you landed on. This is why $\mathbb{E}[X\mid Y]$ can be
      added, squared, or averaged like any other random variable — it
      appears on both sides of the tower property precisely because it is
      one, not a placeholder for "the number you'd get if you conditioned."

      It is defined only up to values $y$ that $Y$ never takes — nothing
      forces $g$ to be sensible off the support of $Y$, since those values
      never get used.
    worked: >
      Let $N$ be the number showing on a fair die and, given $N=n$, let $X$
      be uniform on $\{1,\dots,n\}$. Then $g(n) = \mathbb{E}[X\mid N=n] =
      (n+1)/2$, so $\mathbb{E}[X\mid N] = (N+1)/2$ — a random variable taking
      value $1$ when $N=1$, value $3.5$ when $N=6$, and so on, still random
      until the die is rolled.
    interview: >
      "Is $\mathbb{E}[X\mid Y]$ a number or a random variable" is asked
      almost verbatim; the fluent answer distinguishes it from
      $\mathbb{E}[X\mid Y=y]$ in one breath and states that
      $\mathbb{E}[X\mid Y]$ is a function of $Y$, hence random exactly to
      the extent $Y$ is.
    pitfalls: >
      Writing $\mathbb{E}[X\mid Y]=c$ for a constant $c$ silently assumes
      independence, which hasn't been given — check the algebra of
      conditional expectation before collapsing it. Treating
      $\mathbb{E}[X\mid Y=y]$ and $\mathbb{E}[X\mid Y]$ as interchangeable
      notation loses exactly the distinction the tower property and total
      variance depend on.
    recap: >
      $\mathbb{E}[X\mid Y] = g(Y)$ packages the numbers $\mathbb{E}[X\mid
      Y=y]$ into a single random variable — your forecast of $X$ as a rule
      that resolves once $Y$ is observed.
    steps:
      - teach: >
          For each fixed $y$, $g(y) = \mathbb{E}[X\mid Y=y]$ is an ordinary
          number, found by averaging against the conditional law attached
          to that one value of $y$ — nothing beyond plugging into the
          previous node's family of distributions.
      - teach: >
          The move that matters is composing $g$ with $Y$ itself:
          $\mathbb{E}[X\mid Y] := g(Y)$. Before $Y$ is observed you don't
          know which $g(y)$ you'll get, so $\mathbb{E}[X\mid Y]$ is a
          genuinely random forecast — a rule that resolves once $Y$ is
          known, not a number you can quote in advance.
      - ask: >
          A study records $Y$, hours slept, and $X$, next-day focus score.
          Which of these is a random variable rather than a fixed number?
        choices:
          - text: >
              $\mathbb{E}[X\mid Y=7]$
            feedback: >
              This fixes $Y$ at the specific value $7$, so it's an ordinary
              number — no randomness left to resolve.
          - text: >
              $\mathbb{E}[X\mid Y]$
            correct: true
            feedback: >
              This is $g(Y)$, a function of the still-unobserved $Y$ — its
              value isn't known until $Y$ is.
          - text: >
              $\mathbb{E}[X]$
            feedback: >
              The unconditional mean is a single fixed number by
              definition.
          - text: >
              $\Pr(Y=7)$
            feedback: >
              This is a fixed probability, one number, not a function of an
              unobserved quantity.
        feedback: >
          $\mathbb{E}[X\mid Y] = g(Y)$ is the one built from the
          still-random $Y$ — everything else here is already a specific
          number.
      - teach: >
          Because $\mathbb{E}[X\mid Y]$ is a genuine random variable, it can
          be added, squared, or averaged like any other — that is exactly
          why it can sit on both sides of an identity like the tower
          property, rather than standing in for "the number you'd get after
          conditioning."
      - ask: >
          Let $M$ be the result of a fair four-sided die and, given $M=m$,
          let $X$ be uniform on $\{1,\dots,2m\}$. What is $\mathbb{E}[X\mid
          M=3]$?
        expects: "3.5"
        hint: >
          A uniform law on $\{1,\dots,k\}$ has mean $(k+1)/2$; here
          $k=2m$.
        feedback: >
          $g(m) = \mathbb{E}[X\mid M=m] = (2m+1)/2$, so $g(3) = 7/2 = 3.5$.
      - teach: >
          $\mathbb{E}[X\mid Y]$ is defined only up to values $y$ that $Y$
          never takes — nothing forces $g$ to behave sensibly off $Y$'s
          support, since those values are never actually used.
      - ask: >
          Someone writes $\mathbb{E}[X\mid Y] = c$ for a fixed constant
          $c$, with no other justification given. What does this silently
          assume?
        choices:
          - text: >
              That $X$ and $Y$ are independent
            correct: true
            feedback: >
              $\mathbb{E}[X\mid Y]$ collapses to the constant
              $\mathbb{E}[X]$ exactly when $Y$ carries no information about
              $X$ — that's independence, and it needs to be checked, not
              assumed.
          - text: >
              That $\mathbb{E}|X|<\infty$
            feedback: >
              Integrability is needed for $\mathbb{E}[X\mid Y]$ to be
              well-defined at all, but it doesn't by itself force the
              result to be constant.
          - text: >
              That $Y$ is discrete
            feedback: >
              Discreteness of $Y$ has nothing to do with whether the
              conditional mean happens to be constant in $y$.
          - text: >
              Nothing — this is always true
            feedback: >
              It's true only when $Y$ carries no information about $X$'s
              mean; in general $g(y)$ genuinely varies with $y$.
        feedback: >
          Collapsing $\mathbb{E}[X\mid Y]$ to a constant is licensed only by
          independence — writing it without checking that hypothesis is the
          standard slip.
      - teach: >
          Keep the notation apart every time: $\mathbb{E}[X\mid Y=3]$ is a
          number you could quote right now, $\mathbb{E}[X\mid Y]$ is a
          forecast that still moves with the data — conflating them breaks
          the tower property and total variance later in this unit.

  - node: quant-probability.conditioning.conditional-expectation-rules
    hook: >
      These four rules are what actually gets used in an interview —
      recognising "this factor is already known given $Y$" or "these are
      independent" turns a page of conditioning into one line.
    explanation: >
      Each rule is conditional expectation inheriting a property of ordinary
      expectation, applied inside the conditional law for each fixed $y$ and
      repackaged as a random variable in $Y$. Linearity is nothing but
      linearity of the ordinary average, done separately for every $y$.
      Taking out what's known works because, once $Y=y$ is fixed,
      $h(Y)=h(y)$ is a plain constant inside that averaging, and constants
      factor out of an expectation.

      Independence collapsing $\mathbb{E}[X\mid Y]$ to $\mathbb{E}[X]$ is
      the sharpest rule to recognise fast: if $Y$ carries no information
      about $X$, the conditional law of $X$ given $Y=y$ is the same
      distribution for every $y$ — $X$'s own marginal law — so its mean
      doesn't depend on $y$ at all; the "random variable" $g(Y)$ is secretly
      the constant $\mathbb{E}[X]$.

      The last rule, $\mathbb{E}[h(Y)\mid Y]=h(Y)$, says conditioning on $Y$
      can't change anything already determined by $Y$ — there's no residual
      randomness left to average over. It looks trivial stated abstractly,
      but it's the rule that recurs constantly inside multi-step
      calculations where part of the expression is already a function of
      the conditioning variable.
    worked: >
      Let $Y$ be the number of items sold in a day and $X$ be the profit per
      item, independent of $Y$ with $\mathbb{E}[X]=4$, and let the day's
      fixed rent be a constant $100$. The day's total profit is $YX-100$.
      Taking out what's known applied to $YX$ gives $\mathbb{E}[YX\mid Y] =
      Y\,\mathbb{E}[X\mid Y]$, and independence collapses $\mathbb{E}[X\mid
      Y]$ to $\mathbb{E}[X]=4$, so $\mathbb{E}[YX-100\mid Y] = 4Y-100$. On a
      day with $Y=25$ items sold, this evaluates to $4(25)-100=0$ —
      break-even at exactly $25$ items, read off the linear rule without
      ever specifying $X$'s full distribution.
    interview: >
      "Simplify $\mathbb{E}[Y^{2}X\mid Y]$" is testing whether you instantly
      pull $Y^{2}$ out as known and leave $\mathbb{E}[X\mid Y]$ alone — say
      "$Y^{2}$ is determined by the conditioning, so it comes out" rather
      than expanding anything.
    pitfalls: >
      Pulling $X$ itself out of $\mathbb{E}[h(Y)X\mid Y]$ alongside $h(Y)$
      is the classic slip — only functions of the conditioning variable
      factor out, never the variable being averaged. Applying the
      independence rule just because $X$ and $Y$ "seem unrelated," without
      independence actually holding, is unjustified; state the hypothesis.
    recap: >
      Conditional expectation is linear, lets you factor out anything
      already determined by $Y$, collapses to $\mathbb{E}[X]$ under
      independence, and leaves functions of $Y$ untouched — four moves that
      cover most conditioning algebra.
    steps:
      - teach: >
          Each rule is conditional expectation inheriting a property of
          ordinary expectation, applied inside the conditional law for each
          fixed $y$ and repackaged as a random variable in $Y$. Linearity is
          nothing but linearity of the ordinary average, done separately
          for every $y$.
      - teach: >
          Taking out what's known works because, once $Y=y$ is fixed,
          $h(Y)=h(y)$ is a plain constant inside that averaging, and
          constants factor out of an expectation: $\mathbb{E}[h(Y)X\mid Y]
          = h(Y)\mathbb{E}[X\mid Y]$.
      - ask: >
          Which factors out of $\mathbb{E}[Y^{3}\sin(Y)\,X \mid Y]$?
        choices:
          - text: >
              $Y^{3}\sin(Y)$
            correct: true
            feedback: >
              Both factors are functions of the conditioning variable $Y$,
              so together they are already known given $Y$ and factor out
              whole.
          - text: >
              $X$
            feedback: >
              $X$ is the variable being averaged, not a function of the
              conditioning variable — it never factors out on its own.
          - text: >
              $Y^{3}\sin(Y)\,X$, the whole expression
            feedback: >
              $X$ is not determined by $Y$, so it cannot be pulled outside
              the conditional expectation along with the rest.
          - text: >
              Nothing factors out
            feedback: >
              $Y^{3}\sin(Y)$ is a function of $Y$ alone, so it is exactly a
              known constant once $Y$ is fixed.
        feedback: >
          $\mathbb{E}[Y^{3}\sin(Y)X\mid Y] = Y^{3}\sin(Y)\,\mathbb{E}[X\mid
          Y]$ — everything that is a function of $Y$ comes out, and only
          $X$ stays inside.
      - teach: >
          Independence collapsing $\mathbb{E}[X\mid Y]$ to $\mathbb{E}[X]$
          is the sharpest rule to recognise fast: if $Y$ carries no
          information about $X$, the conditional law of $X$ given $Y=y$ is
          the same for every $y$, so its mean doesn't depend on $y$ at all.
      - ask: >
          Let $Y$ and $Z$ be independent, with $\mathbb{E}[Z]=6$. Using
          linearity and taking out what's known, $\mathbb{E}[3Y^{2}Z - 20
          \mid Y] = 3Y^{2}\mathbb{E}[Z] - 20$. Evaluated at $Y=5$, what
          number does this give?
        expects: "430"
        hint: >
          Compute $3(5)^{2}(6) - 20$.
        feedback: >
          $3(25)(6) - 20 = 450 - 20 = 430$.
      - teach: >
          The last rule, $\mathbb{E}[h(Y)\mid Y]=h(Y)$, says conditioning on
          $Y$ can't change anything already determined by $Y$ — there's no
          residual randomness left to average over, and it recurs
          constantly inside multi-step calculations.
      - ask: >
          Which is the correct simplification of $\mathbb{E}[h(Y)X\mid
          Y]$?
        choices:
          - text: >
              $h(Y)X$
            feedback: >
              This pulls $X$ out too, but $X$ is the variable being
              averaged, not a known constant given $Y$ — only $h(Y)$
              factors out.
          - text: >
              $h(Y)\,\mathbb{E}[X\mid Y]$
            correct: true
            feedback: >
              $h(Y)$ is already exactly determined given $Y$, so it factors
              out, leaving $\mathbb{E}[X\mid Y]$ untouched inside.
          - text: >
              $\mathbb{E}[h(Y)]\,\mathbb{E}[X\mid Y]$
            feedback: >
              Unnecessary and wrong: $h(Y)$ is already known exactly given
              $Y$, so there is no need to take its own expectation.
          - text: >
              $\mathbb{E}[X\mid Y]$
            feedback: >
              This drops the known factor $h(Y)$ entirely.
        feedback: >
          Only functions of the conditioning variable factor out whole:
          $\mathbb{E}[h(Y)X\mid Y] = h(Y)\mathbb{E}[X\mid Y]$.
      - teach: >
          These four rules are what actually gets used: linearity, take out
          what's known, independence collapses to $\mathbb{E}[X]$, and
          $\mathbb{E}[h(Y)\mid Y]=h(Y)$ — recognising which applies turns a
          page of conditioning into one line.

  - node: quant-probability.conditioning.indicator-conditional
    hook: >
      "What's the probability of $A$" and "what's the expected number of
      $A$-type events" are the same computation wearing different words, and
      seeing that saves you from learning two separate toolkits.
    explanation: >
      An indicator $\mathbf{1}\{A\}$ takes only the values $0$ and $1$, and
      its expectation given anything is, by the ordinary definition of
      expectation, $1\cdot\Pr(A\mid\cdot)+0\cdot\Pr(A^{c}\mid\cdot) =
      \Pr(A\mid\cdot)$ — conditional expectation applied to an indicator is
      conditional probability by construction, not by a separate theorem.

      Concretely, $\mathbb{E}[\mathbf{1}\{A\}\mid Y]$ is the random variable
      whose value at $Y=y$ is the number $\Pr(A\mid Y=y)$ — the ordinary
      conditional probability of $A$ given the event $\{Y=y\}$, nothing new
      needing to be defined. This node just names the special case.

      Practically, this collapses two toolkits into one: any fact proved
      later in this unit about conditional expectations — how they average,
      how they split variance — applies automatically to conditional
      probabilities once you first write $\Pr(A\mid Y) =
      \mathbb{E}[\mathbf{1}\{A\}\mid Y]$. "What's the chance of $A$" and
      "what's the expected number of $A$-type events" become, after that
      substitution, literally the same computation.
    worked: >
      Roll a fair die to get $Y$, then flip a fair coin $Y$ times; let $A$
      be "at least one flip lands heads." For $Y=3$,
      $\mathbb{E}[\mathbf{1}\{A\}\mid Y=3] = \Pr(A\mid Y=3) = 1-(1/2)^{3} =
      7/8$, since $A^{c}$ given $Y=3$ means all three flips are tails,
      probability $(1/2)^{3}$. The expectation of the indicator and the
      conditional probability are not two separate quantities to compute —
      they're the same $7/8$ by definition.
    interview: >
      When a question asks for a probability but the natural route only
      makes sense in expectation language — a continuous conditioning
      variable, a sum you'd rather average — say "write it as
      $\mathbb{E}[\mathbf{1}\{A\}\mid Y]$" out loud; it signals probability
      and expectation aren't two subjects here.
    pitfalls: >
      Trying to prove a fact about conditional probabilities from scratch,
      instead of reusing an already-proved conditional-expectation identity
      via the indicator trick, wastes time on an interview clock. This
      substitution is licensed only for indicators of genuine events, not
      for general "probability-like" quantities dressed up the same way.
    recap: >
      $\Pr(A\mid Y) = \mathbb{E}[\mathbf{1}\{A\}\mid Y]$ means every tool
      built for conditional expectations is already a tool for conditional
      probabilities, with no separate theory required.
    steps:
      - teach: >
          An indicator $\mathbf{1}\{A\}$ takes only the values $0$ and $1$,
          so its expectation given anything is, by the ordinary definition,
          $1\cdot\Pr(A\mid\cdot)+0\cdot\Pr(A^{c}\mid\cdot) = \Pr(A\mid
          \cdot)$ — conditional probability by construction, not by a
          separate theorem.
      - teach: >
          Concretely, $\mathbb{E}[\mathbf{1}\{A\}\mid Y]$ is the random
          variable whose value at $Y=y$ is $\Pr(A\mid Y=y)$: the ordinary
          conditional probability of $A$, nothing new needing to be
          defined.
      - ask: >
          Roll a fair die to get $Y$, then flip a fair coin $Y$ times. Let
          $A$ be "at least one flip lands heads." What is
          $\mathbb{E}[\mathbf{1}\{A\}\mid Y=4]$?
        expects: "15/16"
        hint: >
          Work through the complement: all four flips land tails.
        feedback: >
          $\Pr(A\mid Y=4) = 1-(1/2)^{4} = 15/16$, and by definition this
          equals $\mathbb{E}[\mathbf{1}\{A\}\mid Y=4]$.
      - teach: >
          The practical value: any fact already proved about conditional
          expectations — how they average, how they split variance —
          applies automatically to conditional probabilities once you
          write $\Pr(A\mid Y) = \mathbb{E}[\mathbf{1}\{A\}\mid Y]$ first.
      - ask: >
          Write $\Pr(A)$ using the tower property and the indicator trick.
        choices:
          - text: >
              $\mathbb{E}[\mathbb{E}[\mathbf{1}\{A\}\mid Y]]$
            correct: true
            feedback: >
              This is exactly the tower property applied to the indicator,
              which equals $\mathbb{E}[\mathbf{1}\{A\}] = \Pr(A)$.
          - text: >
              $\mathbb{E}[\Pr(A)\mid Y]$
            feedback: >
              Circular — $\Pr(A)$ is the quantity being computed, and it's
              already a constant, not something left to condition on.
          - text: >
              $\Pr(A\mid Y)$
            feedback: >
              This is a random variable in $Y$, not the fixed number
              $\Pr(A)$, unless it is averaged over $Y$ first.
          - text: >
              $\mathbf{1}\{A\}\cdot \Pr(Y)$
            feedback: >
              This mixes an indicator with $\Pr(Y)$, a quantity with no
              defined meaning here.
        feedback: >
          $\Pr(A) = \mathbb{E}[\mathbb{E}[\mathbf{1}\{A\}\mid Y]]$ — the
          tower property applied to the indicator of $A$.
      - teach: >
          The substitution is licensed only for indicators of genuine
          events, not for general "probability-like" quantities dressed up
          the same way — check that $A$ is actually an event before
          reaching for this trick.
      - ask: >
          A fair coin decides which die to roll: heads gives a fair
          six-sided die, tails a fair eight-sided die. Let $Y$ record which
          die was used and $A$ be "the roll shows a value greater than
          $4$." What is $\mathbb{E}[\mathbf{1}\{A\}\mid Y=8]$?
        expects: "0.5"
        hint: >
          Count how many of the eight-sided die's faces exceed $4$.
        feedback: >
          Four of the eight faces ($5,6,7,8$) exceed $4$, so $\Pr(A\mid
          Y=8)=4/8=0.5$, which equals $\mathbb{E}[\mathbf{1}\{A\}\mid
          Y=8]$.
      - teach: >
          Whenever a probability is awkward to compute directly but the
          expectation of an indicator is easy — a continuous conditioning
          variable, or a sum you'd rather average — say "write it as
          $\mathbb{E}[\mathbf{1}\{A\}\mid Y]$" out loud; probability and
          expectation are not two separate subjects here.

  - node: quant-probability.conditioning.tower
    hook: >
      This is the single identity you'll use most in this unit — "condition
      on the first thing, average back" is the plan behind most hard
      interview probability questions, and the tower property is why
      averaging back is legitimate.
    explanation: >
      The claim: averaging the conditional forecasts $\mathbb{E}[X\mid Y]$
      over the possible values of $Y$, weighted by how likely each is,
      returns exactly the unconditional mean $\mathbb{E}[X]$. In the
      discrete case this is literally the law of total expectation,
      $\mathbb{E}[X] = \sum_y \mathbb{E}[X\mid Y=y]\Pr(Y=y)$ — expand
      $\mathbb{E}[X\mid Y=y]$ using the conditional law, and the double sum
      over $x$ and $y$ collapses back to $\sum_x x\Pr(X=x)$ by regrouping,
      since summing $\Pr(X=x,Y=y)$ over $y$ recovers $\Pr(X=x)$.

      Applying it to $X=\mathbf{1}\{A\}$ recovers the law of total
      probability exactly: $\mathbb{E}[\mathbf{1}\{A\}\mid Y=y]$ is just
      $\Pr(A\mid Y=y)$ by definition of conditioning on $\{Y=y\}$, so
      $\Pr(A) = \sum_y \Pr(A\mid Y=y)\Pr(Y=y)$ falls straight out of the
      discrete form above — total variance's within/between split, met
      next, is another instance of this one theorem, not a separate fact.

      The intuitive content is that a forecast cannot be biased on average:
      whatever rule updates your estimate of $X$ once $Y$ is revealed,
      averaging that rule's output over every possible $Y$ has to land back
      on the unconditional mean, because you haven't actually gained or
      lost information by construction — you're re-deriving the same
      average a different way.
    worked: >
      A student's exam score depends on which of two study methods they
      used, each equally likely: method $A$ yields a mean score of $70$,
      method $B$ a mean score of $85$. By the tower property,
      $\mathbb{E}[\text{score}] = 0.5(70)+0.5(85) = 77.5$ — averaging the
      two conditional means with the method probabilities as weights
      recovers the overall expected score directly, with no need to know
      the full score distribution under either method.
    interview: >
      "How do you compute an unconditional expectation when the problem
      naturally splits into cases" is answered by naming the tower property
      and writing the weighted sum of conditional means immediately — the
      interviewer is checking you reach for conditioning as a first move,
      not a last resort.
    pitfalls: >
      Averaging the conditional means with the wrong weights — counts
      instead of probabilities, or a forgotten case — silently corrupts the
      total. The identity needs $\mathbb{E}|X|<\infty$; without it,
      $\mathbb{E}[X\mid Y]$ can fail to be well-defined for some $y$ and the
      averaging step has nothing to work with.
    recap: >
      $\mathbb{E}[\mathbb{E}[X\mid Y]] = \mathbb{E}[X]$ — averaging the
      conditional forecasts over $Y$'s distribution recovers the
      unconditional mean, and total probability is the special case where
      $X$ is an indicator.
    steps:
      - teach: >
          Averaging the conditional forecasts $\mathbb{E}[X\mid Y]$ over the
          possible values of $Y$, weighted by how likely each is, returns
          exactly the unconditional mean $\mathbb{E}[X]$ — the law of total
          expectation, $\mathbb{E}[X] = \sum_y \mathbb{E}[X\mid
          Y=y]\Pr(Y=y)$.
      - teach: >
          The load-bearing step: expand $\mathbb{E}[X\mid Y=y]$ using the
          conditional law and sum over $y$ — the double sum over $x$ and $y$
          collapses back to $\sum_x x\Pr(X=x)$, since summing
          $\Pr(X=x,Y=y)$ over every $y$ recovers $\Pr(X=x)$.
      - ask: >
          A factory's daily defect count depends on which of two machines
          ran: machine $A$, probability $0.6$, yields mean defects $3$;
          machine $B$, probability $0.4$, yields mean defects $8$. What is
          the unconditional expected defect count?
        expects: "5"
        hint: >
          Weight each machine's mean by the probability that machine ran.
        feedback: >
          $\mathbb{E}[X] = 0.6(3) + 0.4(8) = 1.8 + 3.2 = 5$.
      - teach: >
          Applying the identity to $X=\mathbf{1}\{A\}$ recovers the law of
          total probability exactly, since $\mathbb{E}[\mathbf{1}\{A\}\mid
          Y=y]=\Pr(A\mid Y=y)$ by definition — total variance's split, met
          next, is another instance of this same theorem.
      - ask: >
          Applying the tower property to $X=\mathbf{1}\{A\}$ recovers which
          identity?
        choices:
          - text: >
              The law of total probability
            correct: true
            feedback: >
              $\mathbb{E}[\mathbf{1}\{A\}\mid Y=y] = \Pr(A\mid Y=y)$, so
              averaging over $Y$ gives $\Pr(A) = \sum_y \Pr(A\mid
              Y=y)\Pr(Y=y)$ directly.
          - text: >
              Bayes' rule
            feedback: >
              Bayes' rule inverts the order of conditioning; nothing here
              reverses $A$ and $Y$.
          - text: >
              The law of total variance
            feedback: >
              That is a separate theorem built on top of the tower
              property, not the direct consequence of plugging in an
              indicator.
          - text: >
              The independence rule for conditional expectation
            feedback: >
              Nothing here assumes $A$ and $Y$ are independent.
        feedback: >
          Plugging $X=\mathbf{1}\{A\}$ into the tower property is exactly
          the law of total probability.
      - teach: >
          The intuitive content: whatever rule updates your estimate of $X$
          once $Y$ is revealed, averaging that rule's output over every
          possible $Y$ has to land back on the unconditional mean — you
          haven't gained or lost information, only re-derived the same
          average a different way.
      - ask: >
          A signal is weak, medium, or strong with probabilities $0.5$,
          $0.3$, $0.2$, giving conditional mean returns $1$, $4$, $10$
          respectively. What is the unconditional expected return?
        expects: "3.7"
        hint: >
          Weight each conditional mean by the probability of its case.
        feedback: >
          $0.5(1) + 0.3(4) + 0.2(10) = 0.5 + 1.2 + 2 = 3.7$.
      - teach: >
          Averaging the conditional means with the wrong weights — counts
          instead of probabilities, or a forgotten case — silently corrupts
          the total, and the identity itself needs $\mathbb{E}|X|<\infty$ to
          make sense.

  - node: quant-probability.conditioning.tower-nested
    hook: >
      "I conditioned on more information, then averaged some of it back out
      — did I gain anything?" comes up in every multi-stage argument, and
      the answer, "no, you land exactly on the coarser forecast," is what
      licenses peeling layers off one at a time.
    explanation: >
      $\mathbb{E}[\mathbb{E}[X\mid Y,Z]\mid Y]$ starts from the finer
      forecast using both $Y$ and $Z$, then averages out $Z$ while keeping
      $Y$ fixed — and the claim is this equals $\mathbb{E}[X\mid Y]$, the
      forecast that never used $Z$. Conditioning on extra information and
      then discarding it by averaging cannot manufacture an advantage:
      whatever edge $Z$ gave you inside the slice $Y=y$ washes out once you
      average over $Z$'s distribution within that slice, by the ordinary
      tower property applied inside the world where $Y=y$ is fixed.

      The plain tower property is the special case where the outer
      conditioning variable is replaced by nothing — averaging out
      everything you conditioned on leaves the fully unconditional mean,
      consistent with this more general smoothing statement.

      The practical use is architectural: when a problem has several layers
      of randomness — a regime, then a signal, then an outcome — condition
      on whichever layer makes the innermost expectation trivial, then work
      outward one layer at a time, using this rule to confirm that averaging
      a fine forecast down to a coarse one is always legitimate and never
      needs re-deriving.
    worked: >
      Roll two independent fair dice, $Y$ the first and $Z$ the second, and
      let $X=Y+Z$. Trivially $\mathbb{E}[X\mid Y,Z]=Y+Z$, since both dice are
      already known. Fix $Y=4$ and average out $Z$: $\mathbb{E}[4+Z\mid
      Y=4] = 4+\mathbb{E}[Z] = 7.5$, using independence of $Z$ from $Y$.
      This matches $\mathbb{E}[X\mid Y=4]$ computed directly the same way —
      conditioning on $Z$ and averaging it back out reproduced the coarser
      forecast $7.5$ exactly.
    interview: >
      "You're allowed to peek at an extra signal but must forget it before
      acting — does that peek help on average" tests this rule directly; the
      sharp answer is "no, averaging a finer conditional expectation back
      down to the coarser conditioning always returns the coarser one,
      exactly."
    pitfalls: >
      The outer conditioning variable must be a subset of the inner one
      ($Y$ alone, versus $Y$ and $Z$ together) — averaging $\mathbb{E}[X\mid
      Y,Z]$ down to a variable unrelated to $Y,Z$ has no such guarantee.
      Trying to run this the other way — building $\mathbb{E}[X\mid Y,Z]$
      out of $\mathbb{E}[X\mid Y]$ — is not licensed; information can't be
      manufactured in that direction either.
    recap: >
      Conditioning on more and then averaging back down to less returns
      exactly the coarser conditional expectation — the rule that lets
      multi-stage arguments peel off layers of information without penalty.
    steps:
      - teach: >
          $\mathbb{E}[\mathbb{E}[X\mid Y,Z]\mid Y]$ starts from the finer
          forecast using both $Y$ and $Z$, then averages $Z$ back out while
          keeping $Y$ fixed — and the claim is this lands exactly on
          $\mathbb{E}[X\mid Y]$, the forecast that never used $Z$ at all.
      - teach: >
          The plain tower property is the special case where the outer
          conditioning variable is replaced by nothing at all — averaging
          out everything you conditioned on leaves the fully unconditional
          mean, consistent with this more general smoothing statement.
      - ask: >
          Roll two independent fair dice, $Y$ the first and $Z$ the second,
          and let $X=Y+Z$. Compute $\mathbb{E}[\mathbb{E}[X\mid Y,Z]\mid
          Y=2]$.
        expects: "5.5"
        hint: >
          $\mathbb{E}[X\mid Y,Z]=Y+Z$ since both dice are already known;
          fix $Y=2$ and average $Z$ out.
        feedback: >
          $\mathbb{E}[2+Z\mid Y=2] = 2+\mathbb{E}[Z] = 2+3.5 = 5.5$,
          matching $\mathbb{E}[X\mid Y=2]$ computed directly.
      - teach: >
          The practical use is architectural: when a problem has several
          layers of randomness, condition on whichever layer makes the
          innermost expectation trivial, then work outward one layer at a
          time, using this rule to confirm averaging a fine forecast down
          is always legitimate.
      - ask: >
          You're allowed to peek at an extra signal $Z$ but must forget it
          before acting on $Y$ alone. Does that peek change your forecast
          on average?
        choices:
          - text: >
              Yes, peeking always improves the forecast you end up acting
              on
            feedback: >
              Averaging the finer forecast back down to $Y$ exactly
              reproduces $\mathbb{E}[X\mid Y]$ — nothing is gained once $Z$
              is averaged back out.
          - text: >
              No — averaging $\mathbb{E}[X\mid Y,Z]$ back down to $Y$
              returns exactly $\mathbb{E}[X\mid Y]$
            correct: true
            feedback: >
              This is nested conditioning stated directly: conditioning on
              more and then averaging back down to less cannot manufacture
              an advantage.
          - text: >
              It depends on whether $Y$ and $Z$ are correlated
            feedback: >
              The identity holds regardless of any relationship between $Y$
              and $Z$ — no independence assumption is needed.
          - text: >
              Only if $Z$ is discrete
            feedback: >
              Nothing about the identity depends on $Z$ being discrete
              versus continuous.
        feedback: >
          Peeking and then averaging the peek back out changes nothing —
          you land exactly on $\mathbb{E}[X\mid Y]$.
      - teach: >
          The outer conditioning variable must be a genuine subset of the
          inner one — $Y$ alone versus $Y$ and $Z$ together. Building the
          finer $\mathbb{E}[X\mid Y,Z]$ out of the coarser $\mathbb{E}[X\mid
          Y]$ is not licensed in the other direction; information can't be
          manufactured either way.
      - ask: >
          Which of these is *not* licensed by nested conditioning?
        choices:
          - text: >
              $\mathbb{E}[\mathbb{E}[X\mid Y,Z]\mid Y] = \mathbb{E}[X\mid
              Y]$
            feedback: >
              This is exactly the identity itself — fully licensed.
          - text: >
              Recovering $\mathbb{E}[X\mid Y,Z]$ from $\mathbb{E}[X\mid
              Y]$ alone
            correct: true
            feedback: >
              Going from a coarser forecast to a finer one has no
              justification here — averaging can only smooth a fine
              forecast down, never sharpen a coarse one back up.
          - text: >
              $\mathbb{E}[\mathbb{E}[X\mid Y]\mid Y] = \mathbb{E}[X\mid
              Y]$
            feedback: >
              This is the outer-conditioning-on-nothing-new case, and it
              holds.
          - text: >
              $\mathbb{E}[\mathbb{E}[X\mid Y,Z]] = \mathbb{E}[X]$
            feedback: >
              This is the plain tower property, averaging out everything
              — licensed.
        feedback: >
          You can always smooth a finer conditional expectation down to a
          coarser one, never manufacture a finer one from a coarser one.

  - node: quant-probability.conditioning.conditional-variance
    hook: >
      "How much uncertainty is left once you know $Y$" is a question every
      risk desk asks about every signal, and conditional variance is the
      object that answers it exactly.
    explanation: >
      $\operatorname{Var}(X\mid Y)$ is built exactly like ordinary variance,
      but every expectation inside the formula is replaced by a conditional
      one: it's $\mathbb{E}[(X-\mathbb{E}[X\mid Y])^{2}\mid Y]$, the average
      squared deviation from the conditional mean, computed inside the
      conditional law at each fixed $y$. Expanding the square gives the
      computational form $\mathbb{E}[X^{2}\mid Y]-(\mathbb{E}[X\mid
      Y])^{2}$, the same algebra that turns ordinary variance into
      $\mathbb{E}[X^{2}]-(\mathbb{E}[X])^{2}$, done inside each slice.

      Like $\mathbb{E}[X\mid Y]$, this is a random variable — a function of
      $Y$ alone — and it's nonnegative for every value of $Y$ since it's an
      average of squares. It measures the residual uncertainty about $X$
      once $Y$ has been revealed: not "how spread out is $X$ overall," but
      "how spread out is $X$ within the specific slice $Y=y$ you land in."

      When $X$ and $Y$ are independent, the conditional law of $X$ given
      $Y=y$ is the same for every $y$ — $X$'s own marginal law — so
      $\operatorname{Var}(X\mid Y)$ collapses to the constant
      $\operatorname{Var}(X)$: knowing $Y$ leaves exactly as much
      uncertainty as not knowing it.
    worked: >
      A stock's daily return has an unknown regime $Y$ (calm or volatile,
      each with probability $0.5$). Given calm, returns have mean $0$ and
      variance $1$; given volatile, mean $0$ and variance $9$. Then
      $\operatorname{Var}(X\mid Y)$ takes value $1$ when $Y=\text{calm}$ and
      $9$ when $Y=\text{volatile}$ — a two-valued random variable, not a
      single number, capturing that the residual risk genuinely depends on
      the regime.
    interview: >
      "Once you observe the regime, how much risk is left" is answered by
      naming $\operatorname{Var}(X\mid Y)$ as a function of $Y$, not a
      single figure — a common follow-up asks you to compute
      $\mathbb{E}[X^{2}\mid Y]$ minus the squared conditional mean, since
      that's what you'd actually compute by hand.
    pitfalls: >
      Reporting a single number for $\operatorname{Var}(X\mid Y)$ instead of
      a function of $Y$ drops exactly the information the object is built
      to carry. Forgetting to square the conditional mean before
      subtracting reproduces the same slip as with ordinary variance.
    recap: >
      $\operatorname{Var}(X\mid Y) = \mathbb{E}[X^{2}\mid
      Y]-(\mathbb{E}[X\mid Y])^{2}$ is the leftover spread of $X$ once $Y$
      is known, itself random in $Y$, and it collapses to plain
      $\operatorname{Var}(X)$ exactly when $Y$ carries no information.
    steps:
      - teach: >
          $\operatorname{Var}(X\mid Y)$ is built exactly like ordinary
          variance, but every expectation inside is replaced by a
          conditional one: $\mathbb{E}[(X-\mathbb{E}[X\mid Y])^{2}\mid Y]$.
          Expanding the square gives the computational form
          $\mathbb{E}[X^{2}\mid Y]-(\mathbb{E}[X\mid Y])^{2}$.
      - teach: >
          Like $\mathbb{E}[X\mid Y]$, this is a random variable — a
          function of $Y$ alone, nonnegative for every value of $Y$. It
          measures the uncertainty left about $X$ within the specific
          slice $Y=y$ you land in, not the overall spread of $X$.
      - ask: >
          Given $Y=4$, let $X$ be uniform on $\{1,2,3,4\}$. What is
          $\operatorname{Var}(X\mid Y=4)$?
        expects: "1.25"
        hint: >
          Compute $\mathbb{E}[X\mid Y=4]$ and $\mathbb{E}[X^{2}\mid Y=4]$
          separately, then subtract the square of the first from the
          second.
        feedback: >
          $\mathbb{E}[X\mid Y=4]=2.5$ and $\mathbb{E}[X^{2}\mid
          Y=4]=(1+4+9+16)/4=7.5$, so $\operatorname{Var}(X\mid Y=4) =
          7.5-2.5^{2} = 7.5-6.25 = 1.25$.
      - teach: >
          When $X$ and $Y$ are independent, the conditional law of $X$
          given $Y=y$ is the same for every $y$ — $X$'s own marginal law —
          so $\operatorname{Var}(X\mid Y)$ collapses to the constant
          $\operatorname{Var}(X)$: knowing $Y$ leaves exactly as much
          uncertainty as not knowing it.
      - ask: >
          A signal $Y$ can take three different values. Which statement
          about $\operatorname{Var}(X\mid Y)$ is correct in general?
        choices:
          - text: >
              It is a single fixed number, since variance is always a
              number
            feedback: >
              Ordinary variance is a number, but the conditional version is
              built from a family of slices — it inherits randomness from
              $Y$.
          - text: >
              It is a random variable, generally taking a different value
              for each possible value of $Y$
            correct: true
            feedback: >
              $\operatorname{Var}(X\mid Y)$ is a function of $Y$ — it
              reports the residual spread within each slice, and those
              slices need not agree.
          - text: >
              It always equals $\operatorname{Var}(X)$
            feedback: >
              That collapse happens only under independence — in general
              the residual spread genuinely depends on the regime.
          - text: >
              It is undefined unless $X$ and $Y$ are independent
            feedback: >
              The definition needs only $\mathbb{E}[X^{2}]<\infty$; it is
              defined regardless of any relationship between $X$ and $Y$.
        feedback: >
          $\operatorname{Var}(X\mid Y)$ is a random variable, and reporting
          a single number instead drops exactly the information it is built
          to carry.
      - teach: >
          The usual slip is forgetting to square the conditional mean
          before subtracting — the same error as with ordinary variance,
          now hiding inside a conditional computation.
      - ask: >
          A trader's daily P&L on a risk-on day has $\mathbb{E}[X\mid
          Y=\text{on}] = 2$ and $\mathbb{E}[X^{2}\mid Y=\text{on}] = 29$.
          What is $\operatorname{Var}(X\mid Y=\text{on})$?
        expects: "25"
        hint: >
          Subtract the square of the conditional mean from
          $\mathbb{E}[X^{2}\mid Y=\text{on}]$.
        feedback: >
          $\operatorname{Var}(X\mid Y=\text{on}) = 29 - 2^{2} = 29 - 4 =
          25$.
      - teach: >
          Once $Y$ is revealed, $\operatorname{Var}(X\mid Y)$ is the
          residual risk of a position given the regime — not one number for
          the whole problem, but a function that reports a different figure
          in every regime.

  - node: quant-probability.conditioning.total-variance
    hook: >
      "How would you decompose the risk of a metric that depends on an
      unobserved regime" is answered in one line by this theorem, and it's
      why pooled variance is never just the average of within-group
      variances.
    explanation: >
      Expand $\operatorname{Var}(X) = \mathbb{E}[X^{2}]-(\mathbb{E}[X])^{2}$
      and apply the tower property to each piece:
      $\mathbb{E}[X^{2}]=\mathbb{E}[\mathbb{E}[X^{2}\mid Y]]$ and
      $(\mathbb{E}[X])^{2} = (\mathbb{E}[\mathbb{E}[X\mid Y]])^{2}$.
      Rewriting $\mathbb{E}[X^{2}\mid Y]$ as $\operatorname{Var}(X\mid
      Y)+(\mathbb{E}[X\mid Y])^{2}$ — conditional variance's own definition,
      rearranged — and regrouping the two occurrences of $(\mathbb{E}[X\mid
      Y])^{2}$ produces exactly $\operatorname{Var}(\mathbb{E}[X\mid Y])$
      alongside $\mathbb{E}[\operatorname{Var}(X\mid Y)]$: bookkeeping once
      the tower property is granted.

      Read the two pieces as within-group and between-group variation:
      $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ is the average spread inside
      each value of $Y$, and $\operatorname{Var}(\mathbb{E}[X\mid Y])$ is
      the spread of the group means themselves as $Y$ varies. This is the
      split behind why a mixture of regimes is riskier than any single
      regime alone.

      Because both summands are variances of real random variables, both
      are nonnegative, giving two free bounds:
      $\operatorname{Var}(\mathbb{E}[X\mid Y]) \le \operatorname{Var}(X)$ (a
      forecast is never more spread out than the thing it forecasts) and
      $\mathbb{E}[\operatorname{Var}(X\mid Y)] \le \operatorname{Var}(X)$
      (conditioning on average never increases the leftover spread).
    worked: >
      Revisit the calm/volatile regime: $\Pr(Y=\text{calm}) =
      \Pr(Y=\text{volatile}) = 0.5$, both regimes have mean return $0$,
      variances $1$ and $9$. Within-group: $\mathbb{E}[\operatorname{Var}(X
      \mid Y)] = 0.5(1)+0.5(9) = 5$. Between-group: both conditional means
      are $0$, so $\operatorname{Var}(\mathbb{E}[X\mid Y]) = 0$. Total
      $\operatorname{Var}(X) = 5$ — all the risk here is within-regime,
      since the regimes share the same mean; the between-group term only
      appears once the group means actually differ.
    interview: >
      "Why isn't the variance of a mixture just the weighted average of the
      component variances" is answered by naming the missing between-group
      term $\operatorname{Var}(\mathbb{E}[X\mid Y])$ explicitly — the
      interviewer wants you to identify that differing group means, not
      just differing group spreads, add extra variance.
    pitfalls: >
      Reporting $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ alone as the total
      variance understates risk whenever the conditional means actually
      differ across $Y$. The theorem needs only $\mathbb{E}[X^{2}]<\infty$,
      not independence or any distributional assumption on $Y$.
    recap: >
      $\operatorname{Var}(X) = \mathbb{E}[\operatorname{Var}(X\mid Y)] +
      \operatorname{Var}(\mathbb{E}[X\mid Y])$ splits total risk into
      average within-regime spread plus the spread of regime means — both
      terms nonnegative, both bounded by $\operatorname{Var}(X)$.
    steps:
      - teach: >
          $\operatorname{Var}(X) = \mathbb{E}[\operatorname{Var}(X\mid
          Y)] + \operatorname{Var}(\mathbb{E}[X\mid Y])$ splits total risk
          into two pieces: the average spread inside each value of $Y$
          (within-group), plus the spread of the group means themselves as
          $Y$ varies (between-group).
      - teach: >
          The proof is bookkeeping once the tower property is granted:
          expand $\operatorname{Var}(X)=\mathbb{E}[X^{2}]-(\mathbb{E}[X])^{2}$,
          apply the tower property to each piece, and rewrite
          $\mathbb{E}[X^{2}\mid Y]$ as $\operatorname{Var}(X\mid
          Y)+(\mathbb{E}[X\mid Y])^{2}$ — regrouping produces exactly the
          two named terms.
      - ask: >
          A day is type $A$ with probability $0.3$, giving return mean $4$
          and variance $2$, or type $B$ with probability $0.7$, giving mean
          $-1$ and variance $6$. What is $\mathbb{E}[\operatorname{Var}(X
          \mid Y)]$, the within-group term?
        expects: "4.8"
        hint: >
          Weight each type's variance by the probability of that type.
        feedback: >
          $\mathbb{E}[\operatorname{Var}(X\mid Y)] = 0.3(2)+0.7(6) =
          0.6+4.2 = 4.8$.
      - teach: >
          The between-group term needs the overall mean first:
          $\operatorname{Var}(\mathbb{E}[X\mid Y])$ is the variance of the
          conditional means themselves, treating each group mean as a value
          taken with the group's probability.
      - ask: >
          For the same day-type setup — $\mathbb{E}[X]=0.3(4)+0.7(-1)=0.5$
          — what is $\operatorname{Var}(\mathbb{E}[X\mid Y])$, the
          between-group term?
        expects: "5.25"
        hint: >
          Average the squared deviation of each group's mean from $0.5$,
          weighted by that group's probability.
        feedback: >
          $0.3(4-0.5)^{2}+0.7(-1-0.5)^{2} = 0.3(12.25)+0.7(2.25) =
          3.675+1.575 = 5.25$.
      - teach: >
          Because both summands are variances of real random variables,
          both are nonnegative: $\operatorname{Var}(\mathbb{E}[X\mid Y])
          \le \operatorname{Var}(X)$, a forecast is never more spread out
          than the thing it forecasts, and $\mathbb{E}[\operatorname{Var}(X
          \mid Y)] \le \operatorname{Var}(X)$, conditioning never increases
          leftover spread on average.
      - ask: >
          Why isn't the variance of a mixture of regimes just the
          probability-weighted average of the component variances?
        choices:
          - text: >
              Because that average drops the between-group term entirely
              whenever the regime means differ
            correct: true
            feedback: >
              Averaging only the variances is exactly
              $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ — it's missing
              $\operatorname{Var}(\mathbb{E}[X\mid Y])$, which is nonzero
              whenever the group means aren't identical.
          - text: >
              Because variances of different regimes can't be averaged at
              all
            feedback: >
              They can be averaged — that average is exactly the correct
              within-group term, just not the whole answer.
          - text: >
              Because the probabilities must be squared before weighting
            feedback: >
              Nothing in the identity squares the mixing probabilities;
              they enter linearly as weights.
          - text: >
              Because the formula only applies when $Y$ is continuous
            feedback: >
              The identity needs only $\mathbb{E}[X^{2}]<\infty$; it holds
              for a discrete regime variable exactly as shown here.
        feedback: >
          The missing piece is always the between-group term
          $\operatorname{Var}(\mathbb{E}[X\mid Y])$ — real whenever the
          regime means differ, and the entire reason mixtures carry extra
          risk.
      - teach: >
          Total variance here is $4.8+5.25=10.05$ — reporting the
          within-group term $4.8$ alone would understate the day's true
          risk by more than the within-group piece itself.

  - node: quant-probability.conditioning.best-predictor
    hook: >
      "What's the best possible forecast of $X$ given $Y$, in mean-square
      error" is answered by $\mathbb{E}[X\mid Y]$, full stop, no linearity
      assumed — the theoretical justification behind every regression and
      every trading signal built on conditioning.
    explanation: >
      The claim is a genuine optimisation: among every function $g$ of $Y$
      with finite second moment, not just linear ones, $g(Y)=\mathbb{E}[X
      \mid Y]$ minimises $\mathbb{E}[(X-g(Y))^{2}]$. The load-bearing step
      is a decomposition: write $X-g(Y) = (X-\mathbb{E}[X\mid
      Y])+(\mathbb{E}[X\mid Y]-g(Y))$, square it, and expand. The cross term
      vanishes because the residual $X-\mathbb{E}[X\mid Y]$ is orthogonal to
      every function of $Y$, $\mathbb{E}[(X-\mathbb{E}[X\mid Y])h(Y)]=0$ for
      any $h$ — itself the tower property combined with taking out what's
      known.

      With the cross term gone, $\mathbb{E}[(X-g(Y))^{2}] =
      \mathbb{E}[(X-\mathbb{E}[X\mid Y])^{2}] + \mathbb{E}[(\mathbb{E}[X\mid
      Y]-g(Y))^{2}]$, a sum of two nonnegative pieces where only the second
      depends on your choice of $g$. It's smallest, namely $0$, exactly when
      $g(Y)=\mathbb{E}[X\mid Y]$, leaving the minimum error as the first
      piece, $\mathbb{E}[\operatorname{Var}(X\mid Y)]$.

      This is why linear regression is only ever an approximation: it
      restricts the search to affine functions $g(Y)=a+bY$, a strictly
      smaller set than "all functions of $Y$," so the best affine predictor
      can only tie or lose to $\mathbb{E}[X\mid Y]$ — it ties exactly when
      the joint law is bivariate normal, since there the true best predictor
      already is linear.
    worked: >
      Let $Y$ be uniform on $\{1,2,3\}$ and, given $Y=y$, let $X\sim
      \operatorname{Uniform}\{1,\dots,y\}$, so $\mathbb{E}[X\mid
      Y]=(Y+1)/2$ and $\operatorname{Var}(X\mid Y=y) = (y^{2}-1)/12$.
      Among all guessing rules, this minimises mean-squared error; the
      minimum error itself is $\mathbb{E}[\operatorname{Var}(X\mid Y)] =
      \left(0+\tfrac{3}{12}+\tfrac{8}{12}\right)/3 = 11/36$, and a constant
      guess like $g(Y)=2$ has strictly larger mean-squared error than
      $11/36$.
    interview: >
      "Why is $\mathbb{E}[X\mid Y]$ called the best predictor, and best in
      what sense" checks that you can state mean-squared error explicitly
      and that no linearity is assumed — a common follow-up asks when linear
      regression achieves the same minimum, and the bivariate normal is the
      expected answer.
    pitfalls: >
      Assuming the optimality is only among linear predictors misses the
      entire content of the result — it's among all functions of $Y$.
      Forgetting the orthogonality step is the usual reason people can't
      reproduce the proof: the cross term vanishing is not obvious without
      invoking that the residual is orthogonal to every function of $Y$.
    recap: >
      No function of $Y$, linear or not, beats $\mathbb{E}[X\mid Y]$ under
      squared-error loss, and the leftover error is exactly
      $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ — why regression is always
      an approximation to something already optimal.
    steps:
      - teach: >
          The claim is a genuine optimisation: among every function $g$ of
          $Y$ with finite second moment — not just linear ones —
          $g(Y)=\mathbb{E}[X\mid Y]$ minimises $\mathbb{E}[(X-g(Y))^{2}]$.
          No structure on $g$ is assumed in advance.
      - teach: >
          The load-bearing step is a decomposition: write $X-g(Y) =
          (X-\mathbb{E}[X\mid Y])+(\mathbb{E}[X\mid Y]-g(Y))$ and square it.
          The cross term vanishes because the residual $X-\mathbb{E}[X\mid
          Y]$ is orthogonal to every function of $Y$ — itself the tower
          property combined with taking out what's known.
      - ask: >
          Which fact is the vanishing cross term actually built on?
        choices:
          - text: >
              $\mathbb{E}[(X-\mathbb{E}[X\mid Y])\,h(Y)] = 0$ for every
              function $h$
            correct: true
            feedback: >
              This orthogonality of the residual to every function of $Y$
              is exactly what makes the cross term disappear when the
              square is expanded.
          - text: >
              $\mathbb{E}[X\mid Y]$ is always a linear function of $Y$
            feedback: >
              No linearity is assumed anywhere in the proof — that's the
              entire point of the result.
          - text: >
              $X$ and $Y$ are independent
            feedback: >
              Independence is never assumed; the identity holds for any
              joint law with finite second moments.
          - text: >
              $\operatorname{Var}(X\mid Y) = 0$
            feedback: >
              That would mean $X$ is a deterministic function of $Y$, a
              very special case, not a general hypothesis of this result.
        feedback: >
          The residual $X-\mathbb{E}[X\mid Y]$ is orthogonal to every
          function of $Y$ — that orthogonality is what kills the cross
          term.
      - teach: >
          With the cross term gone, the mean-squared error splits into two
          nonnegative pieces, only one of which depends on your choice of
          $g$. That piece is smallest, namely $0$, exactly when
          $g(Y)=\mathbb{E}[X\mid Y]$, leaving the minimum error
          $\mathbb{E}[\operatorname{Var}(X\mid Y)]$.
      - ask: >
          Let $Y$ take values $2$ and $4$, each with probability $0.5$,
          and, given $Y=y$, let $X$ be uniform on $\{1,\dots,y\}$. What is
          the minimum possible mean-squared error, $\mathbb{E}[
          \operatorname{Var}(X\mid Y)]$?
        expects: "0.75"
        hint: >
          A uniform law on $\{1,\dots,y\}$ has variance $(y^{2}-1)/12$;
          average that over $Y$'s two values.
        feedback: >
          $\operatorname{Var}(X\mid Y=2)=(4-1)/12=0.25$ and
          $\operatorname{Var}(X\mid Y=4)=(16-1)/12=1.25$, so
          $\mathbb{E}[\operatorname{Var}(X\mid Y)] = 0.5(0.25)+0.5(1.25) =
          0.75$.
      - teach: >
          This is why linear regression is only ever an approximation: it
          restricts the search to affine functions $g(Y)=a+bY$, a strictly
          smaller set than "all functions of $Y$," so the best affine
          predictor can only tie or lose to $\mathbb{E}[X\mid Y]$.
      - ask: >
          Under what condition does the best affine predictor tie the true
          best predictor $\mathbb{E}[X\mid Y]$?
        choices:
          - text: >
              When $X$ and $Y$ are jointly bivariate normal
            correct: true
            feedback: >
              The bivariate normal is exactly the case where the true best
              predictor $\mathbb{E}[X\mid Y]$ already happens to be affine
              in $Y$, so restricting to affine functions loses nothing.
          - text: >
              Always, for any joint law
            feedback: >
              In general $\mathbb{E}[X\mid Y]$ is a nonlinear function of
              $Y$, and the affine predictor strictly loses whenever that's
              the case.
          - text: >
              Never — regression is always strictly worse
            feedback: >
              When the true best predictor already happens to be affine,
              the affine search finds it exactly and loses nothing.
          - text: >
              Only when $X$ and $Y$ are independent
            feedback: >
              Under independence $\mathbb{E}[X\mid Y]$ is the constant
              $\mathbb{E}[X]$, which is affine, but this is a far narrower
              condition than the general tie case.
        feedback: >
          Regression ties the optimum exactly when $\mathbb{E}[X\mid Y]$ is
          already affine in $Y$ — guaranteed by the bivariate normal, the
          standard case interviewers expect.
      - teach: >
          Under squared-error loss, $\mathbb{E}[X\mid Y]$ is unbeatable by
          any function of $Y$, linear or not — every trading signal and
          every regression built on conditioning is chasing this same
          target.

  - node: quant-probability.conditioning.projection-view
    hook: >
      Every fact proved so far in this unit — linearity, the orthogonality
      step behind the best-predictor property, total variance — falls out
      of one picture: conditional expectation is a right angle.
    explanation: >
      Treat square-integrable random variables as vectors, with inner
      product $\langle U,V\rangle = \mathbb{E}[UV]$ — "orthogonal" then
      means $\mathbb{E}[UV]=0$, and "length squared" means
      $\mathbb{E}[U^{2}]$. The functions of $Y$ form a subspace of this
      vector space, and the orthogonality fact used to prove $\mathbb{E}[X
      \mid Y]$ is the best mean-square predictor — that $X-\mathbb{E}[X\mid
      Y]$ is perpendicular to every function of $Y$ — says exactly that
      $\mathbb{E}[X\mid Y]$ is the orthogonal projection of $X$ onto that
      subspace, in the ordinary Euclidean sense of "closest point in a
      subspace."

      Every property in the unit becomes geometry. Linearity of conditional
      expectation is linearity of projection. $\mathbb{E}[\mathbb{E}[X\mid
      Y]\mid Y]=\mathbb{E}[X\mid Y]$ (projecting an already-projected vector
      changes nothing) is idempotence. Nested conditioning,
      $\mathbb{E}[\mathbb{E}[X\mid Y,Z]\mid Y]=\mathbb{E}[X\mid Y]$, is
      projecting onto the smaller subspace of functions of $Y$ alone, which
      sits inside the larger subspace of functions of $(Y,Z)$ — projecting
      onto a subspace of a subspace collapses to one projection onto the
      smaller one.

      Total variance becomes the Pythagorean theorem: $X = \mathbb{E}[X\mid
      Y] + (X-\mathbb{E}[X\mid Y])$ splits $X$ into a piece inside the
      subspace and a piece orthogonal to it, so squared lengths add — the
      variance identity is exactly that statement once means are subtracted
      off correctly. Linear regression is the same projection restricted to
      the smaller subspace of affine functions of $Y$, which is why it can
      only lose length compared to the full projection onto all functions
      of $Y$.
    interview: >
      "Why does $\mathbb{E}[X\mid Y]$ minimise mean-squared error" answered
      with "it's an orthogonal projection, and the closest point in a
      subspace is always the perpendicular foot" is the fastest, most
      memorable version of the best-predictor argument, and naming total
      variance as Pythagoras in the same breath signals real fluency.
    pitfalls: >
      The inner product $\langle U,V\rangle=\mathbb{E}[UV]$ requires both to
      have finite second moment — this picture is only valid for
      square-integrable random variables, not general ones with only a
      finite first moment. Don't over-extend the metaphor to claims about
      probabilities or events directly; it applies to expectations and
      mean-square distance specifically.
    recap: >
      Conditional expectation is orthogonal projection onto the subspace of
      functions of $Y$, with mean-square distance as the metric — best
      predictor is "closest point," idempotence is "projecting twice does
      nothing," and total variance is Pythagoras.
    steps:
      - teach: >
          Treat square-integrable random variables as vectors, with inner
          product $\langle U,V\rangle = \mathbb{E}[UV]$ — "orthogonal"
          means $\mathbb{E}[UV]=0$ and "length squared" means
          $\mathbb{E}[U^{2}]$. The functions of $Y$ form a subspace of this
          vector space.
      - teach: >
          The orthogonality fact behind the best-predictor property — that
          $X-\mathbb{E}[X\mid Y]$ is perpendicular to every function of $Y$
          — says exactly that $\mathbb{E}[X\mid Y]$ is the orthogonal
          projection of $X$ onto that subspace, in the ordinary Euclidean
          sense of "closest point in a subspace."
      - ask: >
          Which geometric fact corresponds to $\mathbb{E}[\mathbb{E}[X\mid
          Y]\mid Y]=\mathbb{E}[X\mid Y]$?
        choices:
          - text: >
              Idempotence — projecting an already-projected vector changes
              nothing
            correct: true
            feedback: >
              $\mathbb{E}[X\mid Y]$ already lies in the subspace of
              functions of $Y$, so projecting it onto that same subspace a
              second time leaves it fixed.
          - text: >
              Orthogonality of the residual to the subspace
            feedback: >
              That fact is what proves $\mathbb{E}[X\mid Y]$ is the closest
              point in the first place, a separate statement from
              projecting twice.
          - text: >
              The Pythagorean theorem
            feedback: >
              Pythagoras is the geometric reading of total variance, not of
              projecting an already-projected vector.
          - text: >
              Linearity of projection
            feedback: >
              Linearity concerns how projection treats sums and scalar
              multiples, not what happens when you project the same vector
              twice.
        feedback: >
          Projecting a vector already inside the target subspace changes
          nothing — that is idempotence, and it's why conditioning twice on
          the same $Y$ is a no-op.
      - teach: >
          Nested conditioning becomes projecting onto a subspace of a
          subspace, which collapses to one projection onto the smaller one.
          Total variance becomes Pythagoras: $X = \mathbb{E}[X\mid Y] +
          (X-\mathbb{E}[X\mid Y])$ splits $X$ into an in-subspace piece and
          an orthogonal piece, so squared lengths add.
      - ask: >
          Total variance read as Pythagoras corresponds to which
          decomposition?
        choices:
          - text: >
              The squared length of $X$ equals the squared length of
              $\mathbb{E}[X\mid Y]$ plus the squared length of the residual
              $X-\mathbb{E}[X\mid Y]$
            correct: true
            feedback: >
              This is exactly Pythagoras applied to the right-angle split
              of $X$ into its projection and the orthogonal residual, and
              it's total variance once means are handled correctly.
          - text: >
              Total variance equals the product of the within- and
              between-group terms
            feedback: >
              The two terms add, not multiply — that's what makes it
              Pythagoras rather than some other identity.
          - text: >
              The residual $X-\mathbb{E}[X\mid Y]$ is parallel to the
              subspace of functions of $Y$
            feedback: >
              The residual is orthogonal to that subspace, not parallel to
              it — parallel would mean no information was left out.
          - text: >
              Projecting $X$ always increases its length
            feedback: >
              Projection onto a subspace never increases length; it can
              only shrink or preserve it, which is exactly why
              $\operatorname{Var}(\mathbb{E}[X\mid Y]) \le
              \operatorname{Var}(X)$.
        feedback: >
          Splitting $X$ into its projection and the orthogonal residual and
          summing their squared lengths is Pythagoras — and it is literally
          the law of total variance.
      - teach: >
          The inner product $\langle U,V\rangle=\mathbb{E}[UV]$ requires
          both vectors to have finite second moment — this picture is only
          valid for square-integrable random variables, and it applies to
          expectations and mean-square distance specifically, not to
          probabilities or events on their own.
      - ask: >
          This projection picture cannot be safely applied, without
          modification, to a random variable with which property?
        choices:
          - text: >
              Only a finite first moment, not a finite second moment
            correct: true
            feedback: >
              The inner product $\mathbb{E}[UV]$ and the squared length
              $\mathbb{E}[U^{2}]$ both need finite second moments to be
              well-defined — a variable with only $\mathbb{E}|X|<\infty$
              doesn't have a length in this picture.
          - text: >
              Discreteness
            feedback: >
              Discrete random variables with finite second moment fit the
              picture without any modification.
          - text: >
              Independence from $Y$
            feedback: >
              Independence just makes the projection collapse to the
              constant $\mathbb{E}[X]$ — it fits the picture fine.
          - text: >
              Being bounded between $0$ and $1$
            feedback: >
              A bounded variable automatically has finite second moment, so
              it fits the picture without issue.
        feedback: >
          Square-integrability — a finite second moment — is what the whole
          inner-product picture rests on.
      - teach: >
          Linear regression is the same projection restricted to the
          smaller subspace of affine functions of $Y$, which is why it can
          only lose length compared to the full projection onto every
          function of $Y$ — the geometry behind why regression is always an
          approximation.

  - node: quant-probability.conditioning.conditioning-reduces-variance
    hook: >
      "Is this signal worth having" is answered by how much of
      $\operatorname{Var}(X)$ the term $\operatorname{Var}(\mathbb{E}[X\mid
      Y])$ actually claims — this node turns total variance into a genuine
      tool for valuing information.
    explanation: >
      Total variance gives $\mathbb{E}[\operatorname{Var}(X\mid Y)] \le
      \operatorname{Var}(X)$ immediately, since the other summand
      $\operatorname{Var}(\mathbb{E}[X\mid Y])$ is nonnegative — on average,
      the leftover uncertainty after learning $Y$ can't exceed the
      uncertainty you started with, with equality exactly when
      $\mathbb{E}[X\mid Y]$ is a constant and $Y$ carries no information
      about $X$'s mean at all.

      The word "average" is essential and easy to misread: the inequality
      is about $\mathbb{E}[\operatorname{Var}(X\mid Y)]$, not about
      $\operatorname{Var}(X\mid Y=y)$ for any particular $y$. A signal that
      usually clarifies the picture can still land you, on an unlucky draw,
      in a regime where the residual variance exceeds the unconditional
      variance — a piece of news that resolves most scenarios cleanly but
      occasionally reveals you're in the one genuinely murky case.

      The trading reading turns the identity into a valuation formula: a
      signal $Y$ is worth having exactly to the degree that
      $\operatorname{Var}(\mathbb{E}[X\mid Y])$ is a large share of
      $\operatorname{Var}(X)$, since that ratio is literally the fraction of
      total variance the signal explains — the same quantity called $R^{2}$
      once specialised to linear regression.
    worked: >
      A weather signal $Y$ (rain forecast probability) has
      $\operatorname{Var}(X)=4$ for tomorrow's rainfall amount, with
      $\mathbb{E}[\operatorname{Var}(X\mid Y)]=3.6$ and hence
      $\operatorname{Var}(\mathbb{E}[X\mid Y])=0.4$. The forecast explains
      $0.4/4=10\%$ of the variance — a weak but genuine signal; a second
      sensor with $\mathbb{E}[\operatorname{Var}(X\mid Y)]=1$ would explain
      $75\%$ and be worth far more, even though both satisfy the same
      inequality $\mathbb{E}[\operatorname{Var}(X\mid Y)]\le 4$.
    interview: >
      "Is this indicator actually useful, or just noise dressed up as a
      signal" is answered by estimating what share of $\operatorname{Var}
      (X)$ the term $\operatorname{Var}(\mathbb{E}[X\mid Y])$ claims, not by
      checking the inequality holds (it always does) — the interviewer
      wants the ratio, not the sign.
    pitfalls: >
      Concluding that conditioning on $Y$ helps in every realized instance
      because it helps on average is exactly the trap this node warns
      against — a specific value of $Y$ can leave you worse off. Treating
      $\mathbb{E}[\operatorname{Var}(X\mid Y)] \le \operatorname{Var}(X)$ as
      informative on its own, without computing how much smaller, misses
      whether a signal is strong or negligible.
    recap: >
      Conditioning cannot raise expected uncertainty, but a particular
      realization of the signal can — and $\operatorname{Var}(\mathbb{E}[X
      \mid Y])/\operatorname{Var}(X)$ is what actually prices how valuable a
      signal is.
    steps:
      - teach: >
          Total variance gives $\mathbb{E}[\operatorname{Var}(X\mid Y)]
          \le \operatorname{Var}(X)$ immediately, since the other summand
          $\operatorname{Var}(\mathbb{E}[X\mid Y])$ is nonnegative — on
          average, the leftover uncertainty after learning $Y$ can't exceed
          the uncertainty you started with.
      - teach: >
          The word "average" is essential and easy to misread: the
          inequality is about $\mathbb{E}[\operatorname{Var}(X\mid Y)]$,
          not about $\operatorname{Var}(X\mid Y=y)$ for any one particular
          $y$ — an unlucky draw of the signal can leave the residual
          variance larger than the unconditional variance.
      - ask: >
          A weather signal usually clarifies tomorrow's rainfall, but on
          one specific forecast reading the residual variance turns out
          higher than the unconditional variance. Does this contradict the
          total variance inequality?
        choices:
          - text: >
              No — the inequality is about the average over $Y$, not any
              one specific value of $Y$
            correct: true
            feedback: >
              $\mathbb{E}[\operatorname{Var}(X\mid Y)] \le
              \operatorname{Var}(X)$ says nothing about
              $\operatorname{Var}(X\mid Y=y)$ for a particular $y$ — a
              signal that usually clarifies the picture can still land you
              in a genuinely murky case.
          - text: >
              Yes — this should never happen
            feedback: >
              It can and does happen for specific values of $Y$; only the
              average across $Y$ is guaranteed not to exceed
              $\operatorname{Var}(X)$.
          - text: >
              No, because $\operatorname{Var}(X\mid Y=y) \le
              \operatorname{Var}(X)$ always holds
            feedback: >
              That pointwise inequality is not part of the theorem and can
              fail for individual values of $y$.
          - text: >
              Yes — averages must dominate every individual instance
            feedback: >
              An average bounding an individual instance is not a general
              fact; total variance only bounds the average itself.
        feedback: >
          Only the average $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ is
          bounded by $\operatorname{Var}(X)$ — a specific realization of
          $Y$ is free to leave you worse off.
      - teach: >
          The trading reading turns the identity into a valuation formula:
          a signal $Y$ is worth having exactly to the degree that
          $\operatorname{Var}(\mathbb{E}[X\mid Y])$ is a large share of
          $\operatorname{Var}(X)$ — that ratio is literally the fraction of
          total variance the signal explains.
      - ask: >
          A demand-forecast signal $Y$ has $\operatorname{Var}(X)=10$ for
          next week's sales, with $\mathbb{E}[\operatorname{Var}(X\mid
          Y)]=7$. What fraction of the variance does the signal explain,
          as a decimal?
        expects: "0.3"
        hint: >
          The explained share is $\operatorname{Var}(\mathbb{E}[X\mid
          Y])/\operatorname{Var}(X)$, and $\operatorname{Var}(\mathbb{E}[X
          \mid Y]) = \operatorname{Var}(X) -
          \mathbb{E}[\operatorname{Var}(X\mid Y)]$.
        feedback: >
          $\operatorname{Var}(\mathbb{E}[X\mid Y]) = 10-7=3$, so the
          explained share is $3/10=0.3$.
      - teach: >
          Concluding that conditioning helps in every realized instance
          because it helps on average is exactly the trap — the
          inequality's sign always holds, so checking the sign alone
          misses whether a signal is strong or negligible.
      - ask: >
          A second signal has $\mathbb{E}[\operatorname{Var}(X\mid
          Y)]=9.5$ for the same $\operatorname{Var}(X)=10$. What fraction
          of the variance does this signal explain, as a decimal?
        expects: "0.05"
        hint: >
          Same formula as before, with the new within-group term.
        feedback: >
          $\operatorname{Var}(\mathbb{E}[X\mid Y]) = 10-9.5=0.5$, so the
          explained share is $0.5/10=0.05$ — a far weaker signal than the
          first one, even though both satisfy the same inequality.
      - teach: >
          "Is this indicator useful, or just noise dressed up as a signal"
          is answered by that ratio, not by checking the inequality holds —
          it always does, so the interviewer wants the size of the share,
          not its sign.

  - node: quant-probability.conditioning.condition-first-step
    hook: >
      "Set up an equation for the unknown by conditioning on the very first
      thing that can happen" solves a huge share of process and game
      interview questions in three lines, and it's the single most reusable
      technique in this part of the interview.
    explanation: >
      The mechanics: identify the first random event $Y$ once the process
      starts — the first toss, the first draw, whichever of several clocks
      rings first — enumerate its outcomes and their probabilities, then
      evaluate the target quantity conditional on each outcome using
      whatever makes the rest of the problem tractable (often: the
      remainder of the process looks just like the original problem,
      restarted). Recombine with the tower property, averaging the
      conditional values by the first step's probabilities.

      This is so often the right move rather than direct enumeration
      because "conditional on each first-step outcome" frequently collapses
      the remaining problem back to the same unknown quantity you started
      with — the process is memoryless or self-similar after one step —
      turning an infinite sum over all possible outcomes into a single
      algebraic equation in one unknown.

      Multi-state versions — several distinguishable states, each with its
      own first-step analysis — produce not one equation but a linear
      system, one equation per state, solved together; that system-building
      step is exactly what linear recurrences and first-step analysis
      formalise for repeated use.
    worked: >
      Two players alternately toss a coin biased $p=0.6$ toward heads; the
      first to toss heads wins, and $q$ is the probability the starter
      wins. Condition on the starter's first toss: with probability $0.6$
      the starter wins immediately; with probability $0.4$ it's a tail, and
      the opponent is now in the starter's original position, so the
      original starter's win probability from there is $1-q$. So
      $q=0.6+0.4(1-q)$, giving $1.4q=1.0$ and $q=5/7$.
    interview: >
      Any "two players/particles/processes alternate or race, what's the
      probability the first one wins" question is solved by conditioning on
      the first step and noticing the position resets — say "condition on
      step one, and the remaining game is the same problem with the roles
      swapped" before writing any equation.
    pitfalls: >
      Forgetting that after certain first-step outcomes the roles swap (the
      responder becomes the new starter) is the most common setup error —
      get the recursion's structure right before solving it. This technique
      needs the restart property to collapse to one unknown; without it you
      get a genuinely different equation per stage and need the full
      linear-system machinery instead.
    recap: >
      Split on the first event, write the target's value conditional on
      each branch, average by the tower property — the biased alternating
      coin above gives the starter a $5/7$ chance to win in one short
      equation.
    steps:
      - teach: >
          The mechanics: identify the first random event $Y$ once the
          process starts, enumerate its outcomes and their probabilities,
          then evaluate the target quantity conditional on each outcome
          using whatever makes the rest of the problem tractable, and
          recombine with the tower property.
      - teach: >
          This works so often because "conditional on each first-step
          outcome" frequently collapses the remaining problem back to the
          same unknown you started with — the process is memoryless or
          self-similar after one step — turning an infinite sum over
          outcomes into a single algebraic equation.
      - ask: >
          Two players alternately roll a fair six-sided die; the first to
          roll a $6$ wins, and $q$ is the probability the starter wins.
          What is $q$?
        expects: "6/11"
        hint: >
          Condition on the first roll: either it's a $6$, or it isn't and
          the roles are the same as at the start, just swapped.
        feedback: >
          $q = 1/6 + (5/6)(1-q)$, so $q + (5/6)q = 1$, giving $(11/6)q=1$
          and $q=6/11$.
      - teach: >
          Multi-state versions — several distinguishable states, each with
          its own first-step analysis — produce not one equation but a
          linear system, one equation per state, solved together.
      - ask: >
          Two players alternately toss a coin, first head wins; $q$ is the
          starter's win probability. After the starter's first toss is a
          tail, what is the correct next term in the recursion for $q$?
        choices:
          - text: >
              $q$ again, since the coin itself is memoryless
            feedback: >
              The coin being memoryless doesn't mean whose turn it is stays
              the same — after a tail the turn has passed to the opponent.
          - text: >
              $1-q$, since the opponent is now in the starter's original
              position
            correct: true
            feedback: >
              After a tail, the opponent becomes the new starter, with win
              probability $q$ from there — so the original starter's
              chance of eventually winning is $1-q$.
          - text: >
              $0$, since the starter has already lost this round
            feedback: >
              Losing the first toss doesn't end the game; the process
              continues with the roles swapped.
          - text: >
              $p$, the probability of heads
            feedback: >
              This substitutes a raw probability where a recursive
              win-probability term belongs.
        feedback: >
          Forgetting the role swap after a losing first outcome is the
          single most common setup error in this technique.
      - teach: >
          This technique needs the restart property to collapse to one
          unknown — without it, each stage gives a genuinely different
          equation, and the full linear-system machinery is needed instead.
      - ask: >
          Two players alternately toss a coin biased $p=0.25$ toward
          heads; first head wins. What is the starter's win probability?
        expects: "4/7"
        hint: >
          Condition on the first toss: with probability $p$ the starter
          wins immediately; otherwise the opponent becomes the new
          starter.
        feedback: >
          $q = 0.25 + 0.75(1-q)$ gives $1.75q = 1$, so $q = 4/7 \approx
          0.571$.
      - teach: >
          Any "two players/particles/processes alternate or race" question
          is this move: condition on the first step, notice the position
          resets, and solve the single equation that falls out.

  - node: quant-probability.conditioning.random-sums
    hook: >
      "The number of trades/claims/customers today is itself random" is the
      setup behind most "law of total X" questions about aggregate risk,
      and this proposition is the one-line answer for both the mean and the
      variance of the total.
    explanation: >
      Condition on $N$ and treat it as a fixed number $n$: $S=X_1+\dots+
      X_N$ becomes an ordinary sum of $n$ iid terms, so $\mathbb{E}[S\mid
      N=n]=n\mu$ and $\operatorname{Var}(S\mid N=n)=n\sigma^{2}$ by the
      standard formulas for sums of iid variables — nothing about
      randomness in $N$ complicates this step, since $N$ is held fixed
      inside the conditioning. Writing this as $\mathbb{E}[S\mid N]=N\mu$
      and $\operatorname{Var}(S\mid N)=N\sigma^{2}$ packages both as random
      variables in $N$.

      The tower property turns $\mathbb{E}[S\mid N]=N\mu$ directly into
      $\mathbb{E}[S]=\mathbb{E}[N]\mu$. The variance needs total variance:
      $\operatorname{Var}(S) = \mathbb{E}[\operatorname{Var}(S\mid N)] +
      \operatorname{Var}(\mathbb{E}[S\mid N]) = \mathbb{E}[N]\sigma^{2} +
      \operatorname{Var}(N\mu) = \mathbb{E}[N]\sigma^{2} +
      \mu^{2}\operatorname{Var}(N)$ — the within-group term is average
      per-term noise scaled by how many terms there typically are, and the
      between-group term is new: the extra variance contributed purely by
      not knowing $N$ in advance.

      That second term is the entire point: a process with a fixed count
      $\mathbb{E}[N]$ has variance only $\mathbb{E}[N]\sigma^{2}$, so
      treating a random count as if it were its average silently drops
      $\operatorname{Var}(N)\mu^{2}$ of real variance. Independence of $N$
      from the sequence is essential throughout; if the count is chosen by
      watching the $X_i$ as they arrive, the martingale machinery is needed
      instead.
    worked: >
      An insurer receives $N$ claims a month with $\mathbb{E}[N]=50$,
      $\operatorname{Var}(N)=20$, and each claim's payout is independent of
      $N$ and of other claims with mean $\mu=3\,000$ dollars and variance
      $\sigma^{2}=4\,000\,000$. Then $\mathbb{E}[S]=50\cdot 3\,000 =
      150\,000$ dollars and $\operatorname{Var}(S) = 50(4\,000\,000) +
      20(3\,000)^{2} = 200\,000\,000+180\,000\,000 = 380\,000\,000$, so the
      standard deviation is $\sqrt{380\,000\,000} \approx 19\,494$ dollars —
      the random claim count contributes nearly as much variance as the
      claim sizes themselves here.
    interview: >
      "The number of $X$ is itself random — find the mean and variance of
      the total" is answered by conditioning on the count first, applying
      the tower property for the mean and total variance for the variance,
      and stating explicitly that $\operatorname{Var}(N)\mu^{2}$ is what a
      fixed-count model would miss.
    pitfalls: >
      Assuming $\operatorname{Var}(S)=\mathbb{E}[N]\sigma^{2}$ alone,
      ignoring the second term entirely, is the standard error — it
      silently assumes $N$ is deterministic. Independence of $N$ from the
      $X_i$ sequence is a hypothesis, not automatic; a count correlated
      with the sizes needs a different treatment.
    recap: >
      Conditioning on the random count gives $\mathbb{E}[S]=\mathbb{E}[N]
      \mu$ and $\operatorname{Var}(S)=\mathbb{E}[N]\sigma^{2}+
      \operatorname{Var}(N)\mu^{2}$ — the second term is the extra risk a
      fixed-count model would miss entirely.
    steps:
      - teach: >
          Condition on $N$ and treat it as a fixed number $n$: $S=X_1+
          \dots+X_N$ becomes an ordinary sum of $n$ iid terms, so
          $\mathbb{E}[S\mid N=n]=n\mu$ and $\operatorname{Var}(S\mid
          N=n)=n\sigma^{2}$ by the standard formulas — randomness in $N$
          doesn't complicate this step, since $N$ is held fixed inside the
          conditioning.
      - teach: >
          The tower property turns $\mathbb{E}[S\mid N]=N\mu$ directly
          into $\mathbb{E}[S]=\mathbb{E}[N]\mu$. The variance needs total
          variance: $\operatorname{Var}(S) =
          \mathbb{E}[N]\sigma^{2}+\operatorname{Var}(N)\mu^{2}$ — average
          per-term noise scaled by the typical count, plus a new term for
          not knowing $N$ in advance.
      - ask: >
          A call center receives $N$ calls per hour with
          $\mathbb{E}[N]=40$, and each call's handling time is independent
          of $N$ and of other calls, with mean $\mu=5$ minutes. What is the
          expected total handling time per hour, in minutes?
        expects: "200"
        hint: >
          Apply $\mathbb{E}[S]=\mathbb{E}[N]\mu$.
        feedback: >
          $\mathbb{E}[S] = \mathbb{E}[N]\mu = 40(5) = 200$ minutes.
      - teach: >
          The second variance term is the entire point: a process with a
          fixed count $\mathbb{E}[N]$ has variance only
          $\mathbb{E}[N]\sigma^{2}$, so treating a random count as if it
          were its average silently drops $\operatorname{Var}(N)\mu^{2}$ of
          real variance.
      - ask: >
          Continuing the call-center example, $\operatorname{Var}(N)=64$
          and each call's handling time has variance $\sigma^{2}=9$
          minutes-squared. What is $\operatorname{Var}(S)$, the variance
          of total handling time?
        expects: "1960"
        hint: >
          Add the within-group term $\mathbb{E}[N]\sigma^{2}$ to the
          between-group term $\operatorname{Var}(N)\mu^{2}$.
        feedback: >
          $\operatorname{Var}(S) = 40(9) + 64(5)^{2} = 360 + 1600 = 1960$.
      - teach: >
          Independence of $N$ from the sequence $X_1, X_2, \dots$ is
          essential throughout; if the count is chosen by watching the
          $X_i$ as they arrive, the martingale machinery is needed instead.
      - ask: >
          A trading desk's daily trade count is set by a rule that watches
          trade sizes as they occur and decides when to stop trading for
          the day. Which formula for $\operatorname{Var}(S)$ still
          applies?
        choices:
          - text: >
              The same formula, $\mathbb{E}[N]\sigma^{2}+
              \operatorname{Var}(N)\mu^{2}$
            feedback: >
              This formula's derivation leans on $N$ being independent of
              the sequence — a stopping rule that watches the $X_i$
              violates exactly that hypothesis.
          - text: >
              Neither formula applies without further machinery, since $N$
              is no longer independent of the sequence
            correct: true
            feedback: >
              A count chosen by watching the $X_i$ as they arrive is
              correlated with the sequence by construction — this needs the
              martingale version, not the independent-count formulas.
          - text: >
              $\operatorname{Var}(S) = N\sigma^{2}$, since $N$ is now known
              in advance
            feedback: >
              $N$ is not known in advance here — it is determined only as
              trades unfold, which is exactly what breaks independence.
          - text: >
              $\operatorname{Var}(S) = 0$, since choosing $N$ removes all
              randomness
            feedback: >
              $S$ is still a sum of random trade sizes; choosing when to
              stop doesn't make the total deterministic.
        feedback: >
          Independence of $N$ from the $X_i$ sequence is a hypothesis, not
          automatic — a count correlated with the sizes needs the
          martingale treatment.
      - teach: >
          Whenever "the number of $X$ is itself random," condition on the
          count first, apply the tower property for the mean and total
          variance for the variance, and name $\operatorname{Var}(N)\mu^{2}$
          explicitly as what a fixed-count model would miss.

  - node: quant-probability.conditioning.random-sums-desk
    hook: >
      The two-line variance split here is the fastest way to answer "how
      much does an uncertain trade count actually add to your day's risk,"
      and the answer is usually "less than you'd guess."
    explanation: >
      This is the mean and variance of a random sum plugged into a single
      concrete desk: $N$ trades with a given mean and variance, each trade
      an iid draw with its own mean and standard deviation, independent of
      $N$. The two variance contributors separate cleanly —
      $\mathbb{E}[N]\sigma^{2}$ from trade-level noise,
      $\operatorname{Var}(N)\mu^{2}$ from not knowing how many trades will
      happen — and comparing their sizes is the entire exercise.

      The comparison usually favors trade-level noise by a wide margin
      whenever a single trade's mean $\mu$ is small relative to its
      standard deviation $\sigma$, since the count's contribution scales
      with $\mu^{2}$ while the trade-noise term scales with $\sigma^{2}$ — a
      strategy with thin per-trade edge and fat per-trade risk is dominated
      by $\sigma$, and randomness in the trade count barely registers.

      The practical use of splitting the two terms is diagnostic: if a desk
      wants to shrink its P&L variance, the split tells you whether to
      target trade-level risk (position sizing, hedging) or count-level
      risk (execution consistency, capacity limits) — attacking the wrong
      one wastes effort.
    worked: >
      A different desk profile: $\mathbb{E}[N]=200$,
      $\operatorname{Var}(N)=400$, and each trade has mean $\mu=5$ dollars,
      standard deviation $\sigma=8$ dollars. Then $\mathbb{E}[S]=200\cdot 5
      = 1\,000$ dollars and $\operatorname{Var}(S) = 200(64)+400(25) =
      12\,800+10\,000 = 22\,800$, so the standard deviation is
      $\sqrt{22\,800}\approx 151$ dollars — the count's contribution
      ($10\,000$) is nearly as large as the trade-level noise ($12\,800$)
      here, since this trade's edge $\mu=5$ is large relative to its own
      noise $\sigma=8$.
    interview: >
      "Does a more volatile trade count matter more for a high-frequency,
      thin-edge strategy or a low-frequency, fat-edge one" is answered by
      comparing $\mathbb{E}[N]\sigma^{2}$ against $\operatorname{Var}(N)
      \mu^{2}$ directly — a strong answer states that count variance
      matters more exactly when $\mu$ is large relative to $\sigma$.
    pitfalls: >
      Assuming the count's contribution is always negligible, because it
      often is for thin-edge strategies, misses cases like this desk where
      $\mu$ is comparable to $\sigma$ and the count term rivals trade-level
      noise. Reporting variance instead of standard deviation when asked
      "how much extra risk in dollars" misstates the units by a square.
    recap: >
      With $\mathbb{E}[N]=200$, $\operatorname{Var}(N)=400$, $\mu=5$,
      $\sigma=8$ dollars, the standard deviation is about $151$ dollars, and
      here the uncertain count contributes almost as much variance as
      trade-level noise — because $\mu$ is large relative to $\sigma$.
    steps:
      - teach: >
          The mean and variance of a random sum, plugged into one desk: $N$
          trades with a given mean and variance, each trade an iid draw
          independent of $N$. The two variance contributors separate
          cleanly: $\mathbb{E}[N]\sigma^{2}$ from trade-level noise, and
          $\operatorname{Var}(N)\mu^{2}$ from not knowing how many trades
          will happen.
      - teach: >
          The comparison usually favors trade-level noise by a wide margin
          when a trade's mean $\mu$ is small relative to its standard
          deviation $\sigma$, since the count's contribution scales with
          $\mu^{2}$ while the trade-noise term scales with $\sigma^{2}$.
      - ask: >
          A desk has $\mathbb{E}[N]=50$, $\operatorname{Var}(N)=25$, and
          each trade has mean $\mu=1$ dollar, standard deviation $\sigma=20$
          dollars. What is $\operatorname{Var}(S)$?
        expects: "20025"
        hint: >
          Add $\mathbb{E}[N]\sigma^{2}$ to $\operatorname{Var}(N)\mu^{2}$.
        feedback: >
          $\operatorname{Var}(S) = 50(20)^{2} + 25(1)^{2} = 20\,000 + 25 =
          20\,025$.
      - teach: >
          The split is diagnostic: if a desk wants to shrink its P&L
          variance, it tells you whether to target trade-level risk
          (position sizing, hedging) or count-level risk (execution
          consistency, capacity limits) — attacking the wrong one wastes
          effort.
      - ask: >
          For the desk above ($\mu=1$, $\sigma=20$), which source of risk
          dominates?
        choices:
          - text: >
              Trade-level noise, since $\mu$ is small relative to $\sigma$
            correct: true
            feedback: >
              $\mathbb{E}[N]\sigma^{2}=20\,000$ dwarfs
              $\operatorname{Var}(N)\mu^{2}=25$ — a strategy with thin
              per-trade edge and fat per-trade risk is dominated by
              $\sigma$.
          - text: >
              Count uncertainty, since $\operatorname{Var}(N)$ is
              relatively large
            feedback: >
              $\operatorname{Var}(N)\mu^{2}=25$ is tiny next to
              $\mathbb{E}[N]\sigma^{2}=20\,000$ precisely because $\mu$ is
              so small — the size of $\operatorname{Var}(N)$ alone doesn't
              settle it.
          - text: >
              They contribute exactly equally
            feedback: >
              $20\,000$ and $25$ are nowhere close to equal.
          - text: >
              It can't be determined without more information
            feedback: >
              The split $\mathbb{E}[N]\sigma^{2}$ versus
              $\operatorname{Var}(N)\mu^{2}$ is exactly the information
              needed, and it's already computable from what's given.
        feedback: >
          Trade-level noise dominates whenever $\mu$ is small relative to
          $\sigma$, since the count term scales with $\mu^{2}$.
      - teach: >
          Assuming the count's contribution is always negligible, because
          it often is for thin-edge strategies, misses cases where $\mu$ is
          comparable to $\sigma$ — the original desk here, with $\mu=5$
          against $\sigma=8$, is exactly such a case.
      - ask: >
          A third desk has $\mathbb{E}[N]=10$, $\operatorname{Var}(N)=9$,
          and each trade has mean $\mu=50$ dollars, standard deviation
          $\sigma=5$ dollars. What is $\operatorname{Var}(S)$?
        expects: "22750"
        hint: >
          Here $\mu$ is large relative to $\sigma$ — expect the count term
          to dominate instead.
        feedback: >
          $\operatorname{Var}(S) = 10(5)^{2}+9(50)^{2} = 250+22\,500 =
          22\,750$ — count uncertainty now dominates completely. Reporting
          "extra risk in dollars" as $22\,750$ itself would also misstate
          the units by a square; the standard deviation is
          $\sqrt{22\,750}\approx 150.8$ dollars.
      - teach: >
          Comparing $\mathbb{E}[N]\sigma^{2}$ against
          $\operatorname{Var}(N)\mu^{2}$ directly answers "does a more
          volatile trade count matter more here" — count variance matters
          more exactly when $\mu$ is large relative to $\sigma$.

  - node: quant-probability.conditioning.truncated-mean
    hook: >
      "Given it's already lasted this long, how much longer should you
      expect to wait" is a memorylessness stress test — exponential says the
      past is irrelevant, uniform says it isn't, and confusing the two is
      the classic trap.
    explanation: >
      For $X\sim\operatorname{Exp}(\lambda)$, the tail probability
      $\Pr(X>t+s\mid X>t) = \Pr(X>t+s)/\Pr(X>t) = e^{-\lambda(t+s)}/
      e^{-\lambda t} = e^{-\lambda s}$ depends only on $s$, not on $t$ — the
      elapsed time cancels completely out of the ratio, the load-bearing
      algebraic step. So the overshoot $X-t$, conditional on having
      survived to $t$, has exactly the same $\operatorname{Exp}(\lambda)$
      law it started with, and its mean is $1/\lambda$ regardless of $t$,
      giving $\mathbb{E}[X\mid X>t] = t+1/\lambda$.

      The uniform case runs the opposite way precisely because it lacks
      that cancellation: conditioning $U\sim\operatorname{Uniform}(0,1)$ on
      $\{U>t\}$ restricts to the interval $(t,1)$, and since the density was
      already flat, the restricted law is exactly $\operatorname{Uniform}
      (t,1)$ — its mean is the interval's midpoint, $(1+t)/2$, and the
      remaining expected wait $(1-t)/2$ shrinks toward $0$ as $t\to 1$.

      The general lesson: $\mathbb{E}[X\mid X>t]-t$, the expected remaining
      wait, is constant in $t$ exactly for the memoryless exponential, and
      this single computation is the standard way an interview checks
      whether you actually understand memorylessness rather than just
      reciting the definition.
    worked: >
      A machine's time to failure is $\operatorname{Exp}(\lambda)$ with
      mean $1/\lambda=4$ years; given it has already run for $6$ years, the
      expected total lifetime is $6+4=10$ years — three more years of
      survival added exactly three more years to the answer. Contrast a
      component with a uniform lifetime on $(0,8)$ years: given it has
      survived $6$ years, its conditional mean lifetime is $(8+6)/2=7$
      years, only $1$ more year expected beyond the $6$ already elapsed —
      the uniform component is "aging," its expected remaining life
      shrinking the longer it survives.
    interview: >
      "A part has survived $t$ years already — what's its expected total
      lifetime" tests memorylessness directly for an exponential ("no
      penalty or bonus for age, just add the mean"), and swapping in a
      uniform or bounded lifetime is the natural follow-up to check you
      don't blindly reuse $t+1/\lambda$ where it doesn't apply.
    pitfalls: >
      Applying $t+1/\lambda$ to a non-exponential lifetime is the single
      most common error this node exists to prevent — memorylessness is a
      special property of the exponential, not a general fact about
      conditioning on survival. Forgetting the uniform's support is bounded
      above and computing a remaining-wait formula that ignores the upper
      endpoint breaks the calculation.
    recap: >
      Exponential survival adds no information — $\mathbb{E}[X\mid X>t] =
      t+1/\lambda$ always — while a bounded uniform's remaining expected
      wait genuinely shrinks as $t$ grows, $(1+t)/2$ on $(0,1)$.
    steps:
      - teach: >
          For $X\sim\operatorname{Exp}(\lambda)$, the elapsed time cancels
          completely out of $\Pr(X>t+s\mid X>t) = e^{-\lambda s}$ — so the
          overshoot $X-t$, given survival to $t$, has exactly the same
          $\operatorname{Exp}(\lambda)$ law it started with, and its mean
          is $1/\lambda$ regardless of $t$: $\mathbb{E}[X\mid X>t] =
          t+1/\lambda$.
      - teach: >
          The uniform case runs the opposite way precisely because it lacks
          that cancellation: conditioning $U\sim\operatorname{Uniform}(0,1)$
          on $\{U>t\}$ restricts to $\operatorname{Uniform}(t,1)$, whose
          mean is the interval's midpoint $(1+t)/2$ — the remaining
          expected wait shrinks toward $0$ as $t\to 1$.
      - ask: >
          A server's time between crashes is exponential with mean
          $1/\lambda = 12$ hours. Given it has already run for $9$ hours
          without crashing, what is the expected total time until the next
          crash, in hours?
        expects: "21"
        hint: >
          Memorylessness means the elapsed $9$ hours buys neither a penalty
          nor a bonus.
        feedback: >
          $\mathbb{E}[X\mid X>9] = 9+1/\lambda = 9+12 = 21$ hours.
      - teach: >
          The general lesson: $\mathbb{E}[X\mid X>t]-t$, the expected
          remaining wait, is constant in $t$ exactly for the memoryless
          exponential — this single computation is the standard way an
          interview checks you understand memorylessness rather than just
          reciting the definition.
      - ask: >
          A component's lifetime is uniform on $(0,10)$ years. Given it has
          survived $4$ years, what is its conditional expected total
          lifetime, in years?
        expects: "7"
        hint: >
          Conditioning on survival past $4$ restricts to a uniform law on
          $(4,10)$; its mean is the interval's midpoint.
        feedback: >
          $\mathbb{E}[X\mid X>4] = (10+4)/2 = 7$ years.
      - teach: >
          Applying $t+1/\lambda$ to a non-exponential lifetime is the
          single most common error this node exists to prevent —
          memorylessness is a special property of the exponential, and the
          uniform's remaining-wait formula must respect its bounded upper
          endpoint instead.
      - ask: >
          Which lifetime distribution has an expected *remaining* wait
          that does not depend on how long you've already waited?
        choices:
          - text: >
              Exponential
            correct: true
            feedback: >
              This is memorylessness exactly: $\mathbb{E}[X\mid X>t]-t =
              1/\lambda$ for every $t$.
          - text: >
              Uniform
            feedback: >
              The uniform "ages" — its remaining expected wait $(1-t)/2$
              shrinks as $t$ grows, the opposite of memoryless.
          - text: >
              Neither, without knowing the specific parameters
            feedback: >
              Memorylessness is a structural property of the exponential
              family, true for every value of $\lambda$, not something
              that depends on the particular parameter chosen.
          - text: >
              Both behave identically
            feedback: >
              They behave oppositely: exponential remaining wait is
              constant in $t$, uniform remaining wait shrinks in $t$.
        feedback: >
          Only the exponential's conditional expectation adds no
          information beyond the mean waiting time itself.
      - teach: >
          "A part has survived $t$ years — what's its expected total
          lifetime" tests memorylessness for an exponential ("no penalty or
          bonus for age, just add the mean"), and swapping in a bounded
          lifetime is the natural follow-up to check you don't reuse
          $t+1/\lambda$ where it doesn't apply.

  - node: quant-probability.conditioning.regime-mixture
    hook: >
      "Mixing two calm-looking regimes still gives you extra risk from the
      fact that their means differ" is the numeric gut-check every total
      variance calculation should pass before trusting it.
    explanation: >
      This is the law of total variance applied to a two-point regime
      variable $Y$: compute $\mathbb{E}[X]$ as the probability-weighted
      average of the regime means, then split $\operatorname{Var}(X)$ into
      $\mathbb{E}[\operatorname{Var}(X\mid Y)]$ (the weighted average of the
      regime variances) plus $\operatorname{Var}(\mathbb{E}[X\mid Y])$,
      which for a two-point $Y$ with conditional means $m_1,m_2$ and
      probabilities $p,1-p$ simplifies to $p(1-p)(m_1-m_2)^{2}$ — a formula
      worth memorising for exactly this shape.

      The comparison worth internalising: naively averaging the two regime
      variances, ignoring that the means differ, always understates the
      true total variance whenever $m_1\ne m_2$, since it drops the entire
      between-group term. The gap grows with how far apart the regime means
      are and with how balanced the regime probabilities are — maximised,
      for fixed means, at $p=0.5$.

      This two-regime shape recurs constantly: bull and bear markets, on
      and off promotional pricing, day and night traffic — anywhere a
      variable's mean shifts between a small number of states, the
      between-group term is not an edge case to check for, it's the default
      source of extra variance.
    worked: >
      A trading strategy is "on" with probability $0.3$, earning mean P&L
      $10$ dollars with standard deviation $4$ dollars, and "off" with
      probability $0.7$, earning mean $0$ with standard deviation $1$
      dollar. Then $\mathbb{E}[X] = 0.3(10)+0.7(0) = 3$. Within-group:
      $\mathbb{E}[\operatorname{Var}(X\mid Y)] = 0.3(16)+0.7(1) = 5.5$.
      Between-group: $p(1-p)(m_1-m_2)^{2} = (0.3)(0.7)(10)^{2} = 21$. Total
      $\operatorname{Var}(X)=26.5$, standard deviation
      $\sqrt{26.5}\approx 5.15$ dollars — averaging the two variances alone
      ($5.5$) would have understated the true variance by nearly a factor
      of five, because almost all the risk here comes from not knowing
      whether the strategy is on.
    interview: >
      "A strategy is only sometimes active — how do you find its overall
      P&L variance" is answered by naming the two-point total-variance
      formula directly, $\mathbb{E}[\operatorname{Var}(X\mid Y)] +
      p(1-p)(m_1-m_2)^{2}$, rather than averaging the component variances.
    pitfalls: >
      Averaging the two regime variances and stopping there is the error
      this example exists to make vivid, understating risk here by nearly
      $5\times$. Using the wrong weights in the between-group term, or
      forgetting to square the mean difference, mis-states its contribution.
    recap: >
      An on/off strategy with regime probabilities $0.3/0.7$ and means
      $10/0$ dollars has standard deviation about $5.15$ dollars, almost
      entirely from the between-regime term $21$ — averaging the component
      variances alone would have badly understated the risk.
    steps:
      - teach: >
          This is the law of total variance applied to a two-point regime
          $Y$: compute $\mathbb{E}[X]$ as the probability-weighted average
          of the regime means, then split $\operatorname{Var}(X)$ into
          $\mathbb{E}[\operatorname{Var}(X\mid Y)]$, the weighted average of
          the regime variances, plus a between-group term that simplifies
          to $p(1-p)(m_1-m_2)^{2}$ for probabilities $p,1-p$ and means
          $m_1,m_2$ — worth memorising for exactly this shape.
      - ask: >
          A marketing campaign is "active" with probability $0.4$, giving
          sales mean $20$ and standard deviation $3$, or "inactive" with
          probability $0.6$, giving mean $5$ and standard deviation $2$.
          What is $\mathbb{E}[\operatorname{Var}(X\mid Y)]$, the
          within-group term?
        expects: "6"
        hint: >
          Weight each state's variance by its probability.
        feedback: >
          $\mathbb{E}[\operatorname{Var}(X\mid Y)] = 0.4(3^{2})+0.6(2^{2})
          = 3.6+2.4 = 6$.
      - teach: >
          Naively averaging the two regime variances, ignoring that the
          means differ, always understates the true total variance
          whenever $m_1\ne m_2$, since it drops the entire between-group
          term — a gap that grows with how far apart the means are and how
          balanced the probabilities are, maximised at $p=0.5$.
      - ask: >
          For the same campaign, what is the between-group term
          $\operatorname{Var}(\mathbb{E}[X\mid Y])$?
        expects: "54"
        hint: >
          Use $p(1-p)(m_1-m_2)^{2}$ with $p=0.4$, $m_1=20$, $m_2=5$.
        feedback: >
          $(0.4)(0.6)(20-5)^{2} = 0.24(225) = 54$.
      - teach: >
          This two-regime shape recurs constantly — bull and bear markets,
          on and off promotional pricing, day and night traffic — anywhere
          a variable's mean shifts between a small number of states, the
          between-group term is the default source of extra variance, not
          an edge case to check for.
      - ask: >
          What is the total $\operatorname{Var}(X)$ for the campaign
          example above?
        expects: "60"
        hint: >
          Add the within-group and between-group terms just computed.
        feedback: >
          $\operatorname{Var}(X) = 6+54 = 60$ — averaging the two variances
          alone ($6$) would have understated the true variance tenfold,
          because almost all the risk here comes from not knowing which
          regime is active.
      - teach: >
          Averaging the two regime variances and stopping there is the
          standard error this shape makes vivid; using the wrong weights in
          the between-group term, or forgetting to square the mean
          difference, mis-states its contribution just as badly.

  - node: quant-probability.conditioning.exchangeable-share
    hook: >
      "Given the total, what's the expected value of just one of the
      contributing pieces" is answered instantly by symmetry whenever the
      pieces are exchangeable — no distribution ever needs to be computed.
    explanation: >
      Symmetry, not independence, is the hypothesis: if $X_1,\dots,X_n$ are
      exchangeable, permuting their labels doesn't change the joint law, so
      relabelling inside the conditioning event $\{S=s\}$ leaves everything
      unchanged too — every $\mathbb{E}[X_i\mid S]$ must equal every other
      one, since nothing in the setup distinguishes index $i$ from index
      $j$ once you know only their sum.

      The rest is one line of algebra: summing the (all equal) conditional
      expectations over $i=1,\dots,n$ gives $\sum_i \mathbb{E}[X_i\mid S] =
      \mathbb{E}[\sum_i X_i\mid S] = \mathbb{E}[S\mid S] = S$, using
      linearity and the rule that a function of $S$ passes through
      conditioning on $S$ unchanged. Since all $n$ terms on the left are
      identical, each one equals $S/n$ — no distributional computation, no
      need to even know the individual $X_i$'s marginal law.

      The result is special to the sum, not a general symmetry fact:
      conditioning on $\max(X_1,\dots,X_n)$ or on $X_1-X_2$ instead of $S$
      does not give a clean closed form this way, because those statistics
      don't interact with "sum of conditional expectations equals
      conditional expectation of the sum" the same way — the sum is exactly
      the one function of the $X_i$ for which linearity turns "add up $n$
      equal unknowns" into "solve for one."
    worked: >
      Deal five cards from a well-shuffled standard deck and let $X_i$ be
      the numeric value of the $i$-th card (ace $=1$, ..., king $=13$),
      exchangeable since the deck is uniformly shuffled. Given the five
      cards sum to $S=40$, each card's conditional expected value is
      $\mathbb{E}[X_i\mid S=40] = 40/5 = 8$ — true for every one of the
      five cards individually, without ever working out which specific
      hands sum to $40$.
    interview: >
      "Given the total of $n$ symmetric draws, what's the expected value of
      one specific draw" should be answered immediately with $S/n$ and the
      one-line symmetry argument — interviewers use this to check whether
      you reach for symmetry before reaching for a distributional
      computation that isn't needed.
    pitfalls: >
      Applying $S/n$ when the $X_i$ are not exchangeable — different
      distributions, or non-symmetric dependence — has no justification;
      the equal-conditional-expectation step is exactly where it breaks.
      Trying the same trick on $\max(X_i)$ or a difference like $X_1-X_2$
      doesn't work; the clean closed form is special to conditioning a
      summand on the sum.
    recap: >
      Given the total $S$ of $n$ exchangeable variables, each one's
      conditional expectation is $S/n$ by symmetry alone — five cards
      summing to $40$ give each card conditional mean $8$, no distribution
      needed.
    steps:
      - teach: >
          Symmetry, not independence, is the hypothesis: if
          $X_1,\dots,X_n$ are exchangeable, permuting their labels doesn't
          change the joint law, so relabelling inside $\{S=s\}$ leaves
          everything unchanged too — every $\mathbb{E}[X_i\mid S]$ must
          equal every other one.
      - teach: >
          The rest is one line of algebra: $\sum_i \mathbb{E}[X_i\mid S] =
          \mathbb{E}[\sum_i X_i\mid S] = \mathbb{E}[S\mid S] = S$. Since all
          $n$ terms on the left are identical, each one equals $S/n$ — no
          distributional computation, no need to even know the individual
          $X_i$'s marginal law.
      - ask: >
          Roll four fair dice. Given their sum is $S=18$, what is
          $\mathbb{E}[X_1\mid S=18]$, the conditional mean of the first
          die?
        expects: "4.5"
        hint: >
          Symmetry makes every die's conditional mean given the total
          equal — divide the total by the number of dice.
        feedback: >
          By symmetry $\mathbb{E}[X_1\mid S=18] = S/n = 18/4 = 4.5$, true
          for every one of the four dice individually.
      - teach: >
          The result is special to the sum, not a general symmetry fact:
          conditioning on $\max(X_1,\dots,X_n)$ or on $X_1-X_2$ instead
          gives no such clean split, because those statistics don't
          interact with linearity the same way the sum does.
      - ask: >
          Which of these conditioning targets does *not* give a clean
          $S/n$-style closed form for exchangeable $X_1,\dots,X_n$?
        choices:
          - text: >
              $S = X_1+\dots+X_n$
            feedback: >
              This is exactly the case that works, giving
              $\mathbb{E}[X_i\mid S]=S/n$.
          - text: >
              $\max(X_1,\dots,X_n)$
            correct: true
            feedback: >
              The maximum doesn't interact with linearity the way the sum
              does — summing the conditional expectations of the $X_i$
              given the max doesn't collapse to anything as clean as $S/n$.
          - text: >
              Both give clean closed forms
            feedback: >
              Only the sum does; the maximum has no such formula.
          - text: >
              Neither gives a clean closed form
            feedback: >
              The sum does give one — that clean closed form is the entire
              content of this node.
        feedback: >
          The sum is exactly the one function of the $X_i$ for which
          linearity turns "add up $n$ equal unknowns" into "solve for
          one" — the maximum and pairwise differences don't share that
          property.
      - teach: >
          Applying $S/n$ when the $X_i$ are not exchangeable — different
          distributions, or non-symmetric dependence — has no
          justification; the equal-conditional-expectation step is exactly
          where it breaks.
      - ask: >
          A bag contains balls numbered $1$ through $20$; six are drawn
          without replacement, and $X_i$ is the number on the $i$-th ball
          drawn (exchangeable, since the draws are symmetric). Given the
          six balls drawn sum to $S=75$, what is $\mathbb{E}[X_3\mid
          S=75]$?
        expects: "12.5"
        hint: >
          The draw order doesn't matter for exchangeability — divide the
          total by the number of balls drawn.
        feedback: >
          $\mathbb{E}[X_3\mid S=75] = 75/6 = 12.5$, the same value every
          one of the six balls' conditional means takes.
      - teach: >
          "Given the total of $n$ symmetric draws, what's the expected
          value of one specific draw" should be answered immediately with
          $S/n$ and the one-line symmetry argument, not a distributional
          computation that isn't needed.
