unit: quant-puzzles.prob-paradoxes
opening: >
  This unit collects the probability puzzles interviews use to test whether
  you understand conditioning or just execute it. Every entry has the same
  anatomy: a plausible answer that ignores how the information was generated,
  and a correct answer that falls out once you name the generating protocol
  and weight hypotheses by the likelihood of the exact report received. The
  first two nodes hand you that discipline in general form; the rest are
  worked instances — Monty Hall and its variants, Bertrand's box, the
  boy–girl and Tuesday-boy puzzles, the airplane seat, the two envelopes, and
  Simpson's paradox — each a different way informal reasoning discards
  information the correct calculation needs.
lessons:
  - node: quant-puzzles.prob-paradoxes.protocol-matters
    hook: >
      Every probability "paradox" brought to an interview is an incomplete
      sentence: the interviewer names an event but not the mechanism that
      produced it, and dividing before filling that gap gets correct
      arithmetic to the wrong answer.
    explanation: >
      The ratio definition of conditional probability presupposes that the
      conditioning event is a well-defined subset of a fixed sample space. A
      verbal report — "he opened door $3$," "at least one is a boy" — is not
      automatically such an event; it becomes one only once you fix the space
      of (true state, possible report) pairs the report was drawn from.

      Three pieces belong on the table before you touch a fraction: the state
      of the world and its prior, the rule by which an observer selects and
      reports, and the report you actually received. Two different rules that
      happen to generate identical words carve that report into different
      events on different sample spaces, hence different posteriors.

      This is why arguments about these puzzles run forever without
      resolving: each side is implicitly filling in a different rule for the
      reporting step and then computing correctly inside their own version.
      There is no single answer to "at least one is a boy" until the
      selection rule is pinned down.

      Interview craft: say out loud which protocol you're assuming before
      computing, so the interviewer can correct you if they meant something
      else, then note how the answer would change under the alternative
      reading.
    worked: >
      Two independent backtests each succeed with probability $1/2$, giving
      four equally likely outcomes $SS, SF, FS, FF$. Protocol one: a
      colleague screens for "at least one succeeded" and tells you only that.
      Removing $FF$ leaves three equally likely cases, so
      $\Pr(SS \mid \text{report}) = 1/3$. Protocol two: the colleague always
      reports test one's specific result, and it happened to be success.
      Conditioning on "test one $= S$" leaves $SS, SF$ equally likely, so
      $\Pr(SS \mid \text{report}) = 1/2$ — identical words, two different
      generating rules, two different numbers.
    interview: >
      "How would you answer a probability question phrased as 'at least one
      of two things is true'" is answered by stating that the number depends
      on the selection mechanism and naming the question you'd ask before
      computing anything.
    pitfalls: >
      Answering the moment you hear the report, without stating the protocol
      you're assuming. Defaulting to "screening" for every "at least one"
      phrasing when many canonical interview setups (Monty Hall, meeting one
      child at random) instead fix a report channel that fires whether or not
      the condition holds.
    recap: >
      Name the sampling and reporting rule before conditioning — identical
      words support genuinely different numbers under different rules, and
      naming the rule is the entire fix.
    steps:
      - teach: >
          A probability *paradox* almost never comes from bad arithmetic; it
          comes from a sentence that names an event without naming the
          procedure that produced it. Before you touch a fraction, three pieces
          belong on the table.
      - teach: >
          Write down the state of the world and its prior, the rule by which an
          observer selects and reports, and the report you actually received.
          Only once those three are fixed is $\Pr(\text{state} \mid
          \text{report})$ a well-defined number at all.
      - ask: >
          A colleague flips two fair coins and tells you "at least one landed
          heads." You want $\Pr(\text{both heads})$. What do you need to know
          before you can compute it?
        choices:
          - text: >
              The prior probability that a coin lands heads
            feedback: >
              That's already given: each coin is fair. The prior isn't what's
              missing here.
          - text: >
              Whether your colleague was screening for "at least one heads" and
              reporting only when it held, or was going to report one specific
              coin's result regardless
            correct: true
            feedback: >
              This is exactly it — the same four words support different
              conditional probabilities depending on which rule generated them.
          - text: >
              How many coins were flipped
            feedback: >
              You're already told: two. The count isn't in question, the
              reporting rule is.
        feedback: >
          Naming the selection-and-report rule is the entire first move —
          without it "at least one heads" isn't a well-defined conditioning
          event yet.
      - teach: >
          Two different reporting rules that happen to produce identical words
          carve out different events on different sample spaces, so they earn
          different posteriors. The discipline generalizes to any "at least
          one" or "I was told $X$" phrasing.
      - ask: >
          Two fair six-sided dice are rolled. A colleague screens for the
          report "at least one die shows a $6$" and tells you exactly that.
          Under this protocol, what is $\Pr(\text{both dice show } 6 \mid
          \text{report})$?
        expects: "1/11"
        hint: >
          Count the outcomes among the $36$ equally likely pairs that satisfy
          "at least one $6$," then ask how many of those have both dice showing
          $6$.
        feedback: >
          Eleven of the $36$ ordered pairs show at least one $6$ —
          inclusion-exclusion gives $6+6-1=11$ — and exactly one of those,
          $(6,6)$, has both. Screening preserves the relative weights among the
          $36$ pairs, so $\Pr(\text{both} \mid \text{report}) = 1/11$.
      - teach: >
          Say the protocol you're assuming out loud before computing, then note
          how the number would change under the alternative reading. That habit
          is worth more in an interview than any single formula.
      - teach: >
          The trap is answering the instant you hear the report. "Screening" is
          not the default reading for every "at least one" phrasing — plenty of
          canonical setups, meeting one child at random among them, fix a
          report channel that fires whether or not the condition holds.

  - node: quant-puzzles.prob-paradoxes.full-observation
    hook: >
      The line separating a paradox's wrong answer from its right one is
      whether you counted how many reports a hypothesis could have produced,
      or only whether it permits the one you got.
    explanation: >
      Once the protocol is fixed, each hypothesis $H$ induces a specific
      probability $\Pr(O \mid H)$ of producing the exact observation $O$ you
      received — not just whether $O$ is possible under $H$. Weighting each
      hypothesis by prior times this likelihood, then normalizing, is Bayes'
      theorem; the paradoxes live entirely in getting the likelihood right.

      The naive error treats every hypothesis consistent with $O$ as equally
      supported, as if $\Pr(O \mid H)$ were $1$ whenever $O$ is merely
      possible under $H$. But a hypothesis under which several different
      reports could have come out has its probability mass split across
      them, so the report you actually received earns it only a fraction of
      its prior; a hypothesis forced to produce exactly this report keeps its
      prior whole.

      Mechanically: for each hypothesis, enumerate every report the protocol
      could generate under it, and read off the chance it generates precisely
      the one observed. Multiply by the prior, normalize across hypotheses.

      This one asymmetry — how many ways a hypothesis could have produced
      what you saw — is the entire engine behind the puzzles ahead: it is why
      a forced reveal counts as stronger evidence than a free one.
    worked: >
      Urn $A$ holds $3$ balls labeled $1, 2, 3$; urn $B$ holds $5$ balls
      labeled $1$ through $5$. Pick an urn uniformly, then a ball uniformly;
      you're told the label is $2$. Both urns could produce a $2$, so the
      reflex is to call it $50/50$. But $\Pr(2 \mid A) = 1/3$ while
      $\Pr(2 \mid B) = 1/5$, so $\Pr(A \mid 2) = (1/3)/(1/3 + 1/5) = 5/8$ —
      the smaller urn, having fewer ways to produce something other than a
      $2$, gets more than half the posterior weight.
    interview: >
      When told "you observed $X$," compute how likely each hypothesis was
      to produce $X$ specifically, not just whether $X$ was possible under
      it — this is the single move that separates the people who get Monty
      Hall right from the people who call it $50/50$.
    pitfalls: >
      Treating "possible under $H$" as "equally likely given $H$" is the
      uniform-over-consistent-hypotheses fallacy. Stopping at prior times
      likelihood without normalizing across every hypothesis leaves an
      unnormalized score, not a probability.
    recap: >
      Weight each hypothesis by how likely it was to generate the exact
      report you got, not merely by whether the report was possible — that
      difference is the entire content of these puzzles.
    steps:
      - teach: >
          The gap between a paradox's wrong answer and its right one is almost
          always this: did you count how many reports a hypothesis could have
          produced, or only whether it permits the one you got?
      - teach: >
          Once the protocol is fixed, each hypothesis $H$ induces a specific
          $\Pr(O \mid H)$, the chance it produces the exact observation $O$,
          not just whether $O$ is possible under $H$. Weight prior times this
          likelihood and normalize across hypotheses — that is Bayes' theorem,
          and the paradoxes live entirely in getting the likelihood right.
      - teach: >
          A hypothesis under which several different reports could have come
          out has its prior mass split across them, so the one you actually
          received earns only a fraction of it; a hypothesis forced to produce
          exactly this report keeps its prior whole.
      - ask: >
          Urn $C$ holds $2$ balls labeled $1,2$; urn $D$ holds $6$ balls
          labeled $1$ through $6$. Pick an urn uniformly, then a ball
          uniformly, and it's labeled $1$. What is $\Pr(C \mid \text{label }
          1)$?
        expects: "3/4"
        hint: >
          Compute $\Pr(1\mid C)$ and $\Pr(1\mid D)$ separately, then weight
          each urn's equal prior by its own likelihood of producing a $1$.
        feedback: >
          $\Pr(1\mid C)=1/2$ and $\Pr(1\mid D)=1/6$. With equal priors these
          likelihoods alone set the posterior: $\Pr(C\mid 1) = (1/2)/(1/2+1/6)
          = 3/4$ — the smaller urn, having fewer ways to avoid a $1$, picks up
          three-quarters of the weight.
      - ask: >
          Urn $E$ holds $4$ balls labeled $1$ through $4$; urn $F$ holds $8$
          balls labeled $1$ through $8$. Pick an urn uniformly, then a ball
          uniformly, and it's labeled $3$. What is $\Pr(E \mid \text{label }
          3)$?
        expects: "2/3"
        hint: >
          Same move as before: find $\Pr(3\mid E)$ and $\Pr(3\mid F)$, then
          weight the equal priors by those likelihoods.
        feedback: >
          $\Pr(3\mid E)=1/4$ and $\Pr(3\mid F)=1/8$. With equal priors,
          $\Pr(E\mid 3) = (1/4)/(1/4+1/8) = 2/3$.
      - teach: >
          This one asymmetry, how many ways a hypothesis could have produced
          what you saw, is the entire engine behind the coming Monty Hall,
          Bertrand's box and boy-girl arguments: a forced report is stronger
          evidence than one a hypothesis could just as easily have avoided.
      - ask: >
          Two urns could both have produced the ball you drew. Someone argues
          "both urns are consistent with what I saw, so it's $50/50$." What's
          the specific error?
        choices:
          - text: >
              There's no error — with two consistent hypotheses and no other
              information, $50/50$ is correct
            feedback: >
              It's correct only when the two hypotheses were equally likely to
              produce this exact draw — that has to be checked, not assumed.
          - text: >
              Treating "possible under $H$" as "equally likely given $H$,"
              instead of weighting by how likely each urn actually was to
              produce this exact ball
            correct: true
            feedback: >
              Exactly the uniform-over-consistent-hypotheses fallacy —
              possibility isn't likelihood.
          - text: >
              Forgetting to include the prior probability of picking each urn
            feedback: >
              The priors were already equal here by design; the mistake
              survives even when priors are stated correctly, because it's the
              likelihoods being ignored.
        feedback: >
          Consistency with the data is necessary but not sufficient — weight
          each hypothesis by exactly how likely it was to generate the report
          you got, then normalize.
      - teach: >
          Watch the other half of the mistake too: stopping at prior times
          likelihood without normalizing across every hypothesis leaves an
          unnormalized score, not a probability. The denominator is not
          optional.

  - node: quant-puzzles.prob-paradoxes.monty-hall
    hook: >
      Switching feels like it shouldn't matter once two doors are left, but
      the host's reveal is a forced move exactly when your first pick was
      wrong, and a free choice exactly when it wasn't.
    explanation: >
      Fix the protocol first: the host knows the car's location, must open a
      door you didn't pick, must reveal a goat, and always offers the switch.
      "He opened door $3$" is the report; everything downstream depends on
      those rules and nothing else.

      Score each of the three door-hides-the-car hypotheses by how likely it
      was to produce that specific report. If the car is behind your door,
      the host was free to open either remaining goat door, splitting his
      behavior between two options; if the car is behind the other specific
      unopened door, he had no choice at all — opening door $3$ was forced.
      That asymmetry is why the your-door hypothesis keeps only half its
      prior while the alternative keeps all of it.

      The fast interview version: switching wins exactly when your first pick
      was wrong, an event already fixed at $2/3$ the instant you chose,
      independent of what the host does next. The reveal only tells you which
      door to switch to, not whether switching is worthwhile.
    worked: >
      Four doors, one car; you pick door $1$, the host opens two of the
      remaining three, always revealing goats, and leaves door $2$ closed. If
      your pick is right (prior $1/4$), the host had three equally good doors
      to leave closed, so "leaves door $2$" has likelihood $1/3$; if the car
      is behind door $2$ (prior $1/4$), leaving it closed is forced,
      likelihood $1$; if the car is behind door $3$ or $4$, the host could
      never have left door $2$ closed, likelihood $0$. Posterior
      $\Pr(\text{car behind door } 1) = (1/4)(1/3) / [(1/4)(1/3) + (1/4)(1)]
      = 1/4$, so switching wins with probability $3/4$ — more doors dilute
      the host's freedom further, so switching only gets better.
    interview: >
      Monty Hall itself is rarely the real question; the test is whether you
      can adapt the likelihood argument the moment the interviewer changes a
      clause — more doors, an ignorant host, a biased host — which is why the
      shortcut "switching wins iff your first guess was wrong" is worth
      having cold.
    pitfalls: >
      Treating the host's reveal as adding no information because "he just
      showed a goat" — the point is that his action is non-uniform, not
      random. Recomputing from scratch instead of sanity-checking any
      $n$-door variant against the fast wrong-initial-guess argument.
    recap: >
      The host's forced reveal keeps the wrong-door hypotheses' priors whole
      while halving the right-door hypothesis's likelihood, which is exactly
      what pushes switching to $2/3$ — and higher still with more doors.
    steps:
      - teach: >
          Switching feels irrelevant once two doors remain, but the host's
          reveal is a forced move exactly when your first pick was wrong and a
          free choice exactly when it wasn't. That asymmetry is the entire
          mechanism.
      - teach: >
          Fix the rules first: the host knows where the car is, must open a
          door you didn't pick, must reveal a goat, and always offers the
          switch. Score each door-hides-the-car hypothesis by how likely it was
          to produce the exact door he opened, not merely whether it permits
          that outcome.
      - teach: >
          If the car is behind your own door, the host had a free choice among
          the remaining goat doors, splitting his behavior; if it's behind the
          specific other unopened door, opening the door he did was forced. The
          your-door hypothesis keeps only a fraction of its prior while the
          alternative keeps all of it.
      - ask: >
          Five doors hide one car; you pick door $1$, the host opens $3$ of the
          remaining $4$ doors, always revealing goats, and leaves door $2$
          closed. What is the probability that switching to door $2$ wins?
        expects: "4/5"
        hint: >
          If the car is behind door $1$, the host has $4$ equally good doors he
          could have left closed; if it's behind door $2$, leaving it closed is
          forced; if it's behind any other door, he couldn't have left door $2$
          closed at all.
        feedback: >
          $\Pr(\text{leaves }2\text{ closed}\mid\text{car}@1)=1/4$ and
          $\Pr(\text{leaves }2\text{ closed}\mid\text{car}@2)=1$, with
          likelihood $0$ for cars at doors $3,4,5$. Posterior
          $\Pr(\text{car}@1\mid\text{report}) = (1/4)/(1/4+1) = 1/5$, so
          switching wins $4/5$.
      - teach: >
          The fast interview version: switching wins exactly when your first
          pick was wrong, an event fixed at $(n-1)/n$ for $n$ doors the instant
          you choose, independent of which doors the host later reveals.
      - ask: >
          You pick one of $8$ doors at random; the host, who knows the layout,
          opens goats down to exactly one other closed door. Using the
          shortcut, what is the probability that switching wins?
        expects: "7/8"
        hint: >
          Switching wins exactly when your first pick was wrong — you don't
          need the likelihood argument again for this one.
        feedback: >
          Your first pick is wrong with probability $(8-1)/8 = 7/8$, and
          switching wins exactly on that event regardless of how the host
          reveals the remaining goats.
      - ask: >
          After the host's reveal, someone says "there are two closed doors
          left, so it must be $50/50$." What's the specific error?
        choices:
          - text: >
              Ignoring that the host's action was forced whenever the car isn't
              behind your original pick, so the two closed doors don't carry
              equal likelihood of having produced the reveal
            correct: true
            feedback: >
              Exactly right — the host's constraint breaks the symmetry between
              the two closed doors.
          - text: >
              The error is elsewhere — with two doors left it genuinely is
              $50/50$ once you forget which one you originally picked
            feedback: >
              Forgetting which door was yours doesn't erase the asymmetry in
              how the reveal was generated; the two doors remain unequal.
          - text: >
              Forgetting that a revealed goat door has dropped out of the
              sample space, so probability must renormalize evenly among the
              survivors
            feedback: >
              Renormalizing is right, but "evenly" is the mistake — the
              survivors keep unequal likelihoods, not equal ones.
        feedback: >
          A non-uniform host action is what breaks the naive $50/50$: score
          each surviving door by how likely it was to produce this exact
          reveal, not by counting doors.
      - teach: >
          The trap is treating a non-uniform host action as adding no
          information because "he just showed a goat." Recompute the likelihood
          argument the moment a clause changes rather than assuming the
          shortcut is decoration.

  - node: quant-puzzles.prob-paradoxes.monty-ignorant-host
    hook: >
      Change one clause — the host doesn't know where the car is — and the
      identical visible action carries no information at all; the missing
      $2/3$ didn't vanish, it moved into the rounds this host ruins.
    explanation: >
      Restate the protocol difference: an ignorant host picks uniformly
      between the two doors you didn't choose, and this time it happens to
      reveal a goat rather than the car. A knowing host's reveal is
      informative because it's forced whenever your pick is wrong; an
      ignorant host's reveal, conditional on happening to show a goat, is
      symmetric between "car is under your door" and "car is under the other
      closed door" — likelihood $1/2$ either way — because nothing about a
      goat-revealing action distinguishes the two once you already know he
      didn't reveal the car.

      A third of the time this host's random pick lands on the car and the
      round is void. Those voided rounds are exactly the rounds a knowing
      host would have used to funnel probability onto the closed door;
      remove them and the surviving games split evenly.

      The deeper point: identical visible evidence, different generating
      mechanism, different posterior. Evidence never speaks for itself — it
      has to be interpreted through the rule that produced it, and the same
      "goat revealed" report means something different depending on whether
      the revealer was trying to avoid the car or just got lucky.
    worked: >
      Keep the ignorant host but drop the uniform prior: suppose
      $\Pr(\text{car}@1) = 1/2$, $\Pr(\text{car}@2) = 1/4$,
      $\Pr(\text{car}@3) = 1/4$, you picked door $1$, and the host reveals a
      goat behind door $3$. Because his reveal has likelihood $1/2$ whenever
      it's possible at all — car@$1$: $1/2$; car@$2$: $1/2$; car@$3$: $0$,
      since revealing door $3$ would show the car — the two live likelihoods
      are equal, so the posterior odds between door $1$ and door $2$ exactly
      match their prior odds, $2{:}1$. Switching now wins only $1/3$, not
      $1/2$: with an ignorant host, the reveal carries zero discriminating
      evidence, so an uneven prior survives untouched.
    interview: >
      This variant tests whether you'll transplant the $2/3$ answer on
      reflex or actually redo the likelihood computation once a stated
      hypothesis changes — say explicitly what changed (the host's
      knowledge) and why it removes the asymmetry.
    pitfalls: >
      Quoting "switching still wins $2/3$" for any host who happens to reveal
      a goat, regardless of whether he was constrained to avoid the car.
      Forgetting that this host's action carries no discriminating evidence
      among the surviving hypotheses, so with an uneven prior the posterior
      is just that prior renormalized over survivors, not a fresh $1/2$.
    recap: >
      An ignorant host who happens to avoid the car adds no evidence between
      the two remaining doors — the voided-round accounting is what makes his
      reveal uninformative where the knowing host's identical action was
      worth $2/3$.
    steps:
      - teach: >
          Change one clause — the host doesn't know where the car is — and the
          same visible action, revealing a goat, now carries a completely
          different amount of information. The missing evidence didn't
          disappear; it moved into the rounds this host ruins by accident.
      - teach: >
          An ignorant host picks uniformly between the two doors you didn't
          choose. Conditional on his pick happening to be a goat, both
          surviving hypotheses, car behind your door or car behind the other
          closed door, produce that exact reveal with equal likelihood $1/2$.
      - ask: >
          With a uniform prior and an ignorant host who picks uniformly between
          the two doors you didn't choose, what is the probability the round is
          voided because he reveals the car?
        expects: "1/3"
        hint: >
          The car sits behind one of the two doors you didn't pick with
          probability $2/3$, and the host's random choice lands on the car door
          half the time it's available.
        feedback: >
          The car is behind one of your two unchosen doors with probability
          $2/3$, and given that, the host's uniformly random pick between them
          hits the car half the time: $(2/3)(1/2) = 1/3$.
      - teach: >
          Because the two live likelihoods are always equal for this host, the
          posterior odds between the two closed doors exactly match the prior
          odds. An ignorant host's lucky reveal adds zero discriminating
          evidence, so any prior asymmetry survives untouched.
      - ask: >
          Suppose $\Pr(\text{car}@1) = 0.5$, $\Pr(\text{car}@2) = 0.3$,
          $\Pr(\text{car}@3) = 0.2$; you picked door $1$, and the ignorant
          host, choosing uniformly between doors $2$ and $3$, reveals a goat
          behind door $3$. What is the probability switching to door $2$ wins?
        expects: "3/8"
        hint: >
          The reveal has likelihood $1/2$ under both car@$1$ and car@$2$, and
          likelihood $0$ under car@$3$ — so the posterior odds between doors
          $1$ and $2$ just reproduce the prior odds.
        feedback: >
          $\Pr(\text{reveal}\mid\text{car}@1)=1/2$ and
          $\Pr(\text{reveal}\mid\text{car}@2)=1/2$ are equal, so
          $\Pr(\text{car}@1\mid\text{reveal}) = 0.25/(0.25+0.15) = 5/8$ and
          switching wins $3/8$ — the uneven prior passes through unchanged.
      - teach: >
          The trap is quoting "switching still wins $2/3$" for any host who
          happens to reveal a goat, regardless of whether he was constrained to
          avoid the car. That number belongs to the knowing host alone.
      - ask: >
          Two setups look identical: in both, the host reveals a goat behind a
          door you didn't pick. In one, switching wins $2/3$; in the other, it
          wins $1/2$ under a uniform prior. What determines which is which?
        choices:
          - text: >
              Whether the host was more likely to open the higher-numbered door
            feedback: >
              Nothing in either protocol depends on door numbering — this isn't
              the distinguishing fact.
          - text: >
              Whether the host knew where the car was and was constrained to
              always reveal a goat, versus picked randomly and got lucky
            correct: true
            feedback: >
              Exactly the distinction — the host's knowledge, not the visible
              action, is what carries the evidence.
          - text: >
              How many doors were in the game
            feedback: >
              Both setups can use the same number of doors; door count changes
              the numbers, not which regime you're in.
        feedback: >
          Identical visible evidence, different generating mechanism, different
          posterior — "a goat was revealed" means something different depending
          on whether the revealer was avoiding the car or just got lucky.
      - teach: >
          Evidence never speaks for itself. It has to be interpreted through
          the rule that produced it, which is why the same three words carry
          $2/3$ of evidence from one host and none at all from the other.

  - node: quant-puzzles.prob-paradoxes.monty-host-bias
    hook: >
      Give the knowing host a habit — he favors one goat door when free to
      choose — and the switch probability moves, but algebra rules out it
      ever moving switching below break-even.
    explanation: >
      Keep the knowing host but add a bias parameter $q$: whenever he's free
      to choose (your door hides the car), he opens door $3$ with probability
      $q$ and door $2$ with probability $1 - q$. This carries the
      full-observation likelihood machinery through an added parameter
      instead of a fixed number.

      Recompute the likelihoods symbolically with you having picked door
      $1$: $\Pr(\text{opens } 3 \mid \text{car}@1) = q$ (his free choice),
      $\Pr(\text{opens } 3 \mid \text{car}@2) = 1$ (forced), and
      $\Pr(\text{opens } 3 \mid \text{car}@3) = 0$. Given door $3$ opens,
      $\Pr(\text{car}@1) = q/(1+q)$, so switching wins $1/(1+q)$; the mirror
      computation for door $2$ opening gives switching wins $1/(2-q)$.

      The point isn't the specific formula, it's the robustness: for every
      $q \in [0,1]$, both $1/(1+q)$ and $1/(2-q)$ are at least $1/2$ — no
      matter how skewed the host's habit, switching never underperforms
      staying. Never assume a hidden bias could flip the recommendation
      without checking the algebra first.
    worked: >
      Take $q = 1/3$, a host who leans toward opening door $2$ when free.
      If he opens door $3$ anyway — his less-favored free choice — that's
      stronger evidence you were wrong: $\Pr(\text{car}@1 \mid \text{opens }
      3) = q/(1+q) = (1/3)/(4/3) = 1/4$, so switching wins $3/4$. If he opens
      door $2$, his default, that's weaker evidence: switching wins
      $1/(2-q) = 1/(2 - 1/3) = 3/5$ — still above $1/2$ either way, and the
      rarer action for this host is the more informative one when it happens.
    interview: >
      Asked "does the host have a tell," compute $q/(1+q)$ or $1/(2-q)$ for
      the door actually opened and note that switching is safe regardless of
      which door opens — a fast, correct answer that shows you're tracking
      the mechanism rather than a memorized number.
    pitfalls: >
      Assuming a biased host could make staying strictly better — the
      algebra rules this out for every $q \in [0,1]$. Attaching the wrong
      formula to the wrong door: the door the host is less inclined to open
      is the stronger evidence when it happens anyway.
    recap: >
      A biased but knowing host shifts the switch probability between $1/2$
      and $1$, never below $1/2$ — switching weakly dominates staying
      regardless of any hidden habit.
    steps:
      - teach: >
          Give the knowing host a habit instead of a coin flip: when he's free
          to choose which goat door to open, he favors one over the other with
          some probability $q$. The switch probability now moves with $q$, but
          never below break-even.
      - teach: >
          Keep the knowing host but add bias $q$: when your door hides the car,
          he opens door $3$ with probability $q$ and door $2$ with probability
          $1-q$. Carry the same likelihood argument through symbolically
          instead of a fixed number.
      - teach: >
          With you having picked door $1$: $\Pr(\text{opens
          }3\mid\text{car}@1)=q$ while $\Pr(\text{opens }3\mid\text{car}@2)=1$
          is forced, so switching after door $3$ opens wins $1/(1+q)$; the
          mirror computation for door $2$ opening gives switching wins
          $1/(2-q)$.
      - ask: >
          With $q = 1/4$ (the host opens door $3$ with probability $1/4$ when
          free), the host opens door $3$. What is the probability switching
          wins?
        expects: "4/5"
        hint: >
          Plug $q = 1/4$ into the formula for switching's win probability given
          door $3$ opens.
        feedback: >
          Switching wins $1/(1+q) = 1/(1+1/4) = 4/5$ — door $3$ is his
          less-favored free choice, so seeing it opened anyway is strong
          evidence you were wrong.
      - teach: >
          The door the host is less inclined to open, when it happens anyway,
          is always the stronger evidence. His rarer action is more informative
          precisely because it's less likely to have been chosen freely.
      - ask: >
          With the same $q = 1/4$, the host instead opens door $2$, his default
          action. What is the probability switching wins?
        expects: "4/7"
        hint: >
          Plug $q = 1/4$ into the formula for switching's win probability given
          door $2$ opens.
        feedback: >
          Switching wins $1/(2-q) = 1/(2-1/4) = 4/7$ — weaker evidence than the
          door-$3$ case, since opening door $2$ is exactly what this host tends
          to do anyway, but still above break-even.
      - ask: >
          For every bias $q \in [0,1]$, is there some value of $q$ that makes
          staying strictly better than switching?
        choices:
          - text: >
              Yes, when $q$ is close to $1$
            feedback: >
              At $q=1$, opening door $3$ becomes uninformative (switching wins
              exactly $1/2$) but never drops below it.
          - text: >
              Yes, when $q$ is close to $0$
            feedback: >
              At $q=0$, opening door $2$ becomes uninformative (switching wins
              exactly $1/2$), again never below it.
          - text: >
              No — algebra shows $1/(1+q)$ and $1/(2-q)$ are each at least
              $1/2$ for every $q \in [0,1]$
            correct: true
            feedback: >
              Correct — both expressions bottom out at exactly $1/2$ and never
              dip below it across the whole range.
        feedback: >
          Never assume a hidden host bias could flip the recommendation toward
          staying without checking the algebra — switching weakly dominates for
          every $q$.
      - teach: >
          The takeaway generalizes past this one host: a robust strategy is one
          you can defend without knowing the interviewer's exact numbers, and
          "switching never hurts, whatever the host's tell" is exactly that
          kind of answer.

  - node: quant-puzzles.prob-paradoxes.bertrand-box
    hook: >
      "It must be the gold-gold box or the mixed box, so $1/2$" throws away
      the fact that the gold-gold box had twice as many chances to produce
      the gold coin you actually saw.
    explanation: >
      Three boxes: gold-gold, gold-silver, silver-silver. Pick a box
      uniformly, then a coin uniformly; it's gold. The full-observation move
      specializes here to counting: the gold-gold box produces "gold" with
      likelihood $1$, the mixed box with likelihood $1/2$, the silver-silver
      box with likelihood $0$ — against equal priors, the gold-gold box earns
      twice the mixed box's posterior weight, giving $2/3$, not $1/2$.

      A faster route to the same number: there are three gold coins in play
      across all boxes, and two of them sit in the gold-gold box, so the
      hidden coin is gold with probability $2/3$ directly — counting coins
      instead of boxes.

      That counting shortcut works because, here, every box holds the same
      number of coins, so drawing "a box uniformly, then a coin uniformly
      within it" is exactly the same as drawing one of the six coins
      uniformly. The correct equally-likely unit is the coin actually drawn,
      not the box category it happens to sit in — whenever a "which category"
      question secretly draws one item uniformly, count items, not
      categories.
    worked: >
      Box $P$ holds $4$ gold coins, box $Q$ holds $1$ gold and $3$ silver,
      box $R$ holds $4$ silver coins — equal-sized boxes again. Pick a box
      uniformly, a coin uniformly, it's gold: is it box $P$? Likelihoods are
      $\Pr(\text{gold} \mid P) = 1$, $\Pr(\text{gold} \mid Q) = 1/4$,
      $\Pr(\text{gold} \mid R) = 0$, giving
      $\Pr(P \mid \text{gold}) = (1/3)/(1/3 + 1/12) = 4/5$. Coin count
      confirms it: $5$ gold coins total among the $12$, $4$ of them in box
      $P$, so $4/5$ directly.
    interview: >
      "A box has two coins of one type, another has one of each, a third has
      the other type — draw a coin, it's gold, what's the other" is asked
      almost verbatim; give the coin count ($2$ of the $3$ gold coins sit in
      the gold-gold box) as the fast answer, with Bayes on box-level priors
      as the fallback once the interviewer perturbs box sizes.
    pitfalls: >
      The $1/2$ reflex, treating "gold-gold or mixed" as two equally likely
      bins. Using the count-the-coins shortcut when boxes hold unequal
      numbers of coins — it only matches the box-level Bayes answer when
      every box contributes the same number of coins to the draw.
    recap: >
      A box with more ways to produce the observed coin earns more posterior
      weight than one with fewer — count qualifying coins directly when box
      sizes match, or fall back to Bayes with box-level likelihoods when they
      don't.
    steps:
      - teach: >
          "It must be the gold-gold box or the mixed box, so $1/2$" throws away
          the fact that the gold-gold box has twice as many chances to produce
          the exact gold coin you saw. Counting chances, not categories, is the
          whole trick.
      - teach: >
          Score each box by how likely it was to produce a gold coin, not
          merely whether it can: the gold-gold box shows gold with likelihood
          $1$, the mixed box with likelihood $1/2$, and against equal priors
          the gold-gold box earns twice the mixed box's posterior weight.
      - teach: >
          When every box holds the same number of coins, drawing a box
          uniformly then a coin uniformly is exactly the same as drawing one of
          the pooled coins uniformly — so you can skip Bayes and count
          qualifying coins directly.
      - ask: >
          Box $1$ holds $3$ gold coins, box $2$ holds $2$ gold and $1$ silver,
          box $3$ holds $3$ silver coins (each box has $3$ coins). Pick a box
          uniformly, a coin uniformly, and it's gold. What is $\Pr(\text{box }
          1 \mid \text{gold})$?
        expects: "3/5"
        hint: >
          The boxes are equal-sized, so count the gold coins directly: how many
          gold coins total, and how many of them sit in box $1$?
        feedback: >
          There are $3+2+0=5$ gold coins in play, and $3$ of them sit in box
          $1$, so $\Pr(\text{box }1\mid\text{gold}) = 3/5$ — matching Bayes:
          $\Pr(\text{gold}\mid 1)=1$, $\Pr(\text{gold}\mid 2)=2/3$, giving
          $(1/3)/(1/3+2/9) = 3/5$.
      - ask: >
          Box $P$ holds $5$ gold coins, box $Q$ holds $2$ gold and $3$ silver,
          box $R$ holds $5$ silver coins (each box has $5$ coins). Pick a box
          uniformly, a coin uniformly, and it's gold. What is $\Pr(P \mid
          \text{gold})$?
        expects: "5/7"
        hint: >
          Same shortcut: equal-sized boxes mean you can count total gold coins
          and how many live in box $P$.
        feedback: >
          There are $5+2+0=7$ gold coins total, and $5$ of them sit in box $P$,
          so $\Pr(P\mid\text{gold}) = 5/7$.
      - teach: >
          That shortcut only holds when box sizes match. The moment boxes hold
          different numbers of coins, drawing "a box then a coin within it"
          stops being the same as drawing one pooled coin uniformly, and the
          box-level likelihoods have to come back.
      - ask: >
          Box $X$ has $6$ coins, $3$ gold and $3$ silver. Box $Y$ has $2$
          coins, both gold. Pick a box uniformly, then a coin uniformly; it's
          gold. Someone argues: "there are $5$ gold coins total, $2$ of them in
          box $Y$, so $\Pr(Y \mid \text{gold}) = 2/5$." What's wrong?
        choices:
          - text: >
              Nothing — $2/5$ is correct, since there are $5$ gold coins and
              $2$ live in box $Y$
            feedback: >
              This ignores that the boxes hold unequal numbers of coins, so
              pooled coin-counting no longer matches the actual draw.
          - text: >
              The coin-counting shortcut only works when every box holds the
              same number of coins; here it doesn't, and Bayes on box-level
              likelihoods gives $2/3$
            correct: true
            feedback: >
              Right — each coin in the smaller box $Y$ is individually more
              likely to be drawn than each coin in $X$, so pooled counting
              overweights $X$'s coins.
          - text: >
              The prior probability of picking each box was miscounted
            feedback: >
              The priors are correctly $1/2$ each; the flaw is in treating the
              pooled coins as equally likely to be drawn, which they aren't
              here.
        feedback: >
          $\Pr(\text{gold}\mid X)=1/2$ and $\Pr(\text{gold}\mid Y)=1$;
          weighting the equal box-priors by these likelihoods gives
          $\Pr(Y\mid\text{gold}) = (1/2)/(1/2+1/4) = 2/3$, not the $2/5$ the
          flawed coin count suggests.
      - teach: >
          The correct equally-likely unit is always the coin actually drawn,
          never the box category it happens to sit in — count qualifying coins
          when box sizes match, fall back to box-level Bayes the moment they
          don't.

  - node: quant-puzzles.prob-paradoxes.boy-girl
    hook: >
      "At least one is a boy" supports both $1/3$ and $1/2$, entirely
      depending on how the report reached you, and the argument about which
      one is "right" is really an argument about two different experiments.
    explanation: >
      Two children, $BB, BG, GB, GG$ equally likely a priori. Two different
      generating protocols for the report "a boy is involved" produce two
      different likelihood patterns and hence two different posteriors — the
      full-observation mechanism applied to a specific story.

      Protocol one, screening: families are filtered for having at least one
      boy, and you're told exactly that fact. $BB, BG, GB$ each pass the
      filter with likelihood $1$; $GG$ with likelihood $0$ — three surviving,
      equally likely cases, so $\Pr(BB) = 1/3$.

      Protocol two, meeting one child at random: the report is generated
      per-child. $BB$ reports "boy" with certainty; $BG$ and $GB$ report
      "boy" only if the randomly met child happens to be the boy, likelihood
      $1/2$ each; $GG$ never reports "boy." Weighting by these likelihoods
      gives $\Pr(BB) = (1/4)/(1/4 + 1/8 + 1/8) = 1/2$.

      The sentence "at least one is a boy" never specifies which of these
      mechanisms produced it — that ambiguity, not sloppy arithmetic, is the
      entire content of the paradox.
    worked: >
      Extend to three children under the screening protocol. Eight equally
      likely sequences run from $BBB$ to $GGG$, and "at least one boy" rules
      out only $GGG$, leaving seven equally likely families, so
      $\Pr(\text{all three boys} \mid \text{at least one boy}) = 1/7$ — far
      below a naive per-flip guess, because screening removes exactly one of
      eight cases and redistributes its mass over all seven survivors, not
      just onto the all-boys case.
    interview: >
      Ask which protocol generated the phrase before computing anything —
      were families with no boys filtered out, or did you meet one child at
      random — and produce both numbers with the mechanism that separates
      them, rather than defending one as the answer.
    pitfalls: >
      Treating "the elder is a boy" and "at least one is a boy" as the same
      information — naming a particular child collapses to the $1/2$
      protocol, an undifferentiated "at least one" collapses to $1/3$ under
      screening. Assuming interview phrasing always means screening; many
      real-world versions ("I have two kids, one of whom is a boy I just
      introduced you to") are the meeting protocol.
    recap: >
      Screening families for having a boy gives $1/3$; meeting one specific
      child who turns out to be a boy gives $1/2$ — the same sentence, two
      different generating protocols, two legitimate answers.
    steps:
      - teach: >
          "At least one is a boy" supports both $1/3$ and $1/2$, entirely
          depending on how the report reached you. The argument about which one
          is "right" is really an argument about two different experiments.
      - teach: >
          Two children give four equally likely families, $BB, BG, GB, GG$. Two
          different generating protocols for the report "a boy is involved"
          produce two different likelihood patterns and hence two different
          posteriors.
      - teach: >
          Screening: families are filtered for having at least one boy, and
          you're told exactly that fact. $BB, BG, GB$ each pass with likelihood
          $1$; $GG$ with likelihood $0$ — three equally likely survivors, so
          $\Pr(BB) = 1/3$.
      - ask: >
          Suppose each child is independently a boy with probability $0.6$ (not
          a fair coin), and families are screened for "at least one boy" under
          this same protocol. What is $\Pr(\text{both boys} \mid \text{at least
          one boy})$?
        expects: "3/7"
        hint: >
          Write the four priors with $p=0.6$: $BB, BG, GB, GG$ have
          probabilities $0.36, 0.24, 0.24, 0.16$. Screening removes only $GG$.
        feedback: >
          $\Pr(BB)=0.36$, and removing $GG$ leaves total mass $0.84$, so
          $\Pr(BB\mid\text{at least one boy}) = 0.36/0.84 = 3/7$ — every
          surviving family keeps likelihood $1$, so this is just the prior
          renormalized over survivors.
      - teach: >
          Meeting one child at random: the report is generated per-child. $BB$
          reports "boy" with certainty; $BG$ and $GB$ only if the randomly met
          child happens to be the boy, likelihood $1/2$ each; $GG$ never
          reports "boy."
      - ask: >
          Under the meeting-one-child-at-random protocol, a family has *three*
          children, each independently a boy or girl with probability $1/2$.
          You meet one child, chosen uniformly among the three, and it's a boy.
          What is $\Pr(\text{all three boys} \mid \text{report})$?
        expects: "1/4"
        hint: >
          A family with $k$ boys reports "boy" with likelihood $k/3$. Weight
          each of the $8$ equally likely families by its own $k/3$ and
          normalize.
        feedback: >
          The all-boys family reports with likelihood $1$; each two-boy family
          (three of them) with likelihood $2/3$; each one-boy family (three of
          them) with likelihood $1/3$; the no-boy family with likelihood $0$.
          Unnormalized: $1/8, \; 3\times(1/8)(2/3), \; 3\times(1/8)(1/3)$,
          summing to $1/2$; the all-boys share is $(1/8)/(1/2) = 1/4$.
      - ask: >
          A friend says: "I have two kids; the older one is a boy." What is
          $\Pr(\text{both boys})$ under this statement?
        choices:
          - text: >
              $1/3$, same as any "at least one is a boy" report
            feedback: >
              Naming a specific child — here, the older one — is not the same
              statement as an undifferentiated "at least one."
          - text: >
              $1/2$, because naming a specific child collapses to the
              identified-child protocol, leaving the other child's sex an
              independent fair coin
            correct: true
            feedback: >
              Correct — once a particular child is pinned down as a boy, the
              sibling's sex is untouched, giving $1/2$.
          - text: >
              It cannot be determined without knowing the family's screening
              history
            feedback: >
              The sentence itself already fixes the protocol by naming a
              specific child; no extra history is needed.
        feedback: >
          Naming a particular child, by birth order or by having met them,
          always collapses to the identified-child protocol and gives $1/2$;
          only an undifferentiated "at least one" under screening gives $1/3$.
      - teach: >
          The two protocols aren't competing guesses at one true number —
          they're correct answers to two different questions that happen to be
          phrased with the same four words.

  - node: quant-puzzles.prob-paradoxes.tuesday-boy
    hook: >
      A birth day sounds like an irrelevant detail tacked onto "at least one
      is a boy," but it changes the count, and the direction it moves the
      answer is predictable before you compute anything.
    explanation: >
      Keep the screening protocol fixed and sharpen the report with an
      extra, seemingly irrelevant tag — a birth day, a birth month, any
      independent detail. This tests whether you see that the detail changes
      the count even though it says nothing new about the family's sexes.

      Mechanically it's still full-observation counting over a finer sample
      space: each child is one of several equally likely (sex, tag) pairs;
      count the ordered families containing at least one tagged boy, then
      those among them with two boys, and divide.

      The trend: a rarer tag is a better filter for isolating individual
      boys than for isolating families, since a two-boy family gets two
      independent chances to satisfy a rare tag while a one-boy family gets
      only one. That pushes the ratio up from the bare-tag $1/3$ toward the
      single-child $1/2$ as the tag gets more specific, and back down to
      $1/3$ the moment the tag is dropped.

      This is a preview of a more general fact about conditioning: how
      finely you carve the event you condition on is itself part of the
      answer, not an artifact to be argued away.
    worked: >
      Swap the tag to birth month, $12$ equally likely months instead of $7$
      days. Each child is one of $24$ equally likely (sex, month) pairs, so
      $576$ equally likely ordered families. Families containing a boy born
      in the specified month number $24 + 24 - 1 = 47$; among them, two-boy
      families number $12 + 12 - 1 = 23$, giving $23/47 \approx 0.489$ —
      closer to $1/2$ than the Tuesday-boy's $13/27 \approx 0.481$, exactly
      as expected since a month is a rarer, more specific tag than a day of
      the week.
    interview: >
      The Tuesday-boy question exists to see whether you can extend the
      counting argument to an unfamiliar tag rather than recite a memorized
      $13/27$; state the general shape first — rarer tag, answer creeps
      toward $1/2$ — before grinding the specific count.
    pitfalls: >
      Assuming the extra detail is irrelevant because it "obviously" doesn't
      determine who the children are — it changes the counting because it
      changes how the evidence was generated. Forgetting the "$-1$" when
      counting families that contain the tag, which double-counts the family
      where both boys happen to satisfy it.
    recap: >
      Sharpening a screening tag from "a boy" to "a boy with an increasingly
      specific extra fact" moves the answer continuously from $1/3$ toward
      $1/2$, because a two-boy family gets two independent chances to match a
      rare tag.
    steps:
      - teach: >
          A birth day sounds like an irrelevant detail tacked onto "at least
          one is a boy," but it changes the count, and the direction it moves
          the answer is predictable before you compute anything.
      - teach: >
          Keep the screening protocol fixed and sharpen the report with an
          extra tag. Each child is one of several equally likely (sex, tag)
          pairs; count the ordered families containing at least one tagged boy,
          then those among them with two boys, and divide.
      - teach: >
          With a tag taking $m$ equally likely values, each child is one of
          $2m$ equally likely (sex, tag) pairs. Plugging $m=7$ days into the
          resulting count recovers $13/27$, and plugging in $m=12$ months
          recovers $23/47$.
      - ask: >
          Sharpen the tag to birth season instead — $4$ equally likely seasons.
          Under the screening protocol, "at least one is a boy born in a
          specified season," what is $\Pr(\text{both boys} \mid
          \text{report})$?
        expects: "7/15"
        hint: >
          Each child is one of $8$ equally likely (sex, season) pairs. Count
          ordered families containing the tagged boy, then two-boy families
          among them.
        feedback: >
          Families containing the tagged boy number $8+8-1=15$; among them,
          two-boy families number $4+4-1=7$, giving $7/15$.
      - teach: >
          As the tag gets rarer, the ratio creeps up toward $1/2$, because a
          two-boy family gets two independent chances to satisfy a rare tag
          while a one-boy family gets only one.
      - ask: >
          Strip the tag away entirely — the report is plain "at least one is a
          boy," with no extra detail (equivalently, a tag with only $m=1$
          possible value). What does $\Pr(\text{both boys} \mid \text{report})$
          reduce to?
        expects: "1/3"
        hint: >
          This is the boundary case of the same counting argument with the tag
          removed — no new computation needed, just the limit of the pattern.
        feedback: >
          With no distinguishing tag, the general count $(2m-1)/(4m-1)$ at
          $m=1$ gives $1/3$, recovering the plain boy-girl screening answer.
      - ask: >
          As the tag becomes rarer (larger $m$), does the two-boy ratio move
          toward $1/3$ or toward $1/2$, and why?
        choices:
          - text: >
              Toward $1/3$, because rarer tags carry less information
            feedback: >
              The direction is backwards — rarer tags push the ratio up, not
              down.
          - text: >
              Toward $1/2$, because a two-boy family gets two independent
              chances to satisfy a rare tag while a one-boy family gets only
              one
            correct: true
            feedback: >
              Correct — that asymmetry is exactly what drags the ratio upward
              as the tag sharpens.
          - text: >
              It stays exactly $13/27$ regardless of the tag, since that's
              fixed by the screening protocol alone
            feedback: >
              The screening protocol alone gives $1/3$; the specific value
              $13/27$ depends on the Tuesday tag's rarity and moves if the tag
              changes.
        feedback: >
          A rarer tag is a better filter for isolating individual boys than for
          isolating families, which is exactly why the ratio creeps from $1/3$
          toward $1/2$ as the tag sharpens.
      - teach: >
          The most common slip in reproducing any of these counts is forgetting
          the "$-1$" when counting families that contain the tag — it
          double-counts the family where both children happen to satisfy it.

  - node: quant-puzzles.prob-paradoxes.conditioning-fineness
    hook: >
      $1/3 \to 13/27 \to 1/2$ looks like three attempts at one true number;
      it's three different questions, and the discipline is naming which one
      you're answering.
    explanation: >
      Read the ladder as three legitimate answers to three different
      conditioning events, not competing estimates of a single quantity.
      Refining the event you condition on moves the answer precisely because
      the refinement correlates with what you're asking about — an
      irrelevant-looking detail is never actually irrelevant to the count.

      The general rule: refining an event $B$ into a smaller $B'$ moves
      $\Pr(A \mid B')$ away from $\Pr(A \mid B)$ whenever the refinement
      isn't independent of $A$, and the direction of the move is set by
      whether the extra detail is easier for the $A$-cases or the
      not-$A$-cases to satisfy — here, easier for two-boy families, hence
      upward.

      The working discipline: never quote a conditional probability without
      naming the exact event behind it. Two people can both be right while
      disagreeing, because they conditioned on different, legitimately
      nested events, and neither number is an approximation of the other.

      Run the refinement in reverse — pool strata that were kept separate
      instead of splitting them further — and the same mechanism can flip a
      comparison outright rather than merely shift a number by degrees; that
      coarse-end failure is the shape of the paradox waiting later in this
      unit.
    interview: >
      "Does refining a condition always move the probability the same
      direction, or can it reverse things" tests whether you see
      conditioning-fineness as a continuum with real structure; the strong
      answer names the direction rule — does the extra detail favor the
      group you're asking about — rather than reciting the boy–girl numbers.
    pitfalls: >
      Treating $1/3, 13/27, 1/2$ as if one must be the "real" answer and the
      others approximations or mistakes. Assuming refinement always pushes
      the answer toward one fixed bound; the direction depends entirely on
      which group the extra detail is easier to satisfy for, and it can push
      either way.
    recap: >
      A conditional probability answers exactly the event you conditioned
      on; refining or pooling that event is a real change of question, and it
      can move the number in either direction or even reverse a comparison
      outright.
    steps:
      - teach: >
          $1/3 \to 13/27 \to 1/2$ looks like three attempts at one true number.
          It's three legitimate answers to three different conditioning events,
          and the discipline is naming exactly which one you're answering.
      - teach: >
          Refining an event $B$ into a smaller $B'$ moves $\Pr(A \mid B')$ away
          from $\Pr(A \mid B)$ whenever the refinement correlates with $A$. The
          direction depends on whether the extra detail is easier for the
          $A$-cases or the not-$A$-cases to satisfy.
      - ask: >
          Three fair coins are flipped. Conditioning on "the first coin is
          heads," what is $\Pr(\text{exactly one head} \mid \text{first coin
          heads})$?
        expects: "1/4"
        hint: >
          Fixing the first coin heads leaves $4$ equally likely outcomes for
          the other two. Count how many of those $4$ give exactly one head
          overall.
        feedback: >
          With the first coin fixed heads, the $4$ equally likely continuations
          are $HHH, HHT, HTH, HTT$; only $HTT$ has exactly one head total, so
          the probability is $1/4$.
      - ask: >
          Same three coins, but now condition on the coarser event "at least
          one coin is heads." What is $\Pr(\text{exactly one head} \mid
          \text{at least one head})$?
        expects: "3/7"
        hint: >
          "At least one head" rules out only $TTT$ among the $8$ equally likely
          outcomes, leaving $7$. Count how many of those have exactly one head.
        feedback: >
          Among the $7$ equally likely outcomes consistent with "at least one
          head," three have exactly one head ($HTT, THT, TTH$), giving $3/7$ —
          a different number from the narrower first-coin conditioning, because
          refining the event changes which outcomes survive.
      - teach: >
          Never quote a conditional probability without naming the exact event
          behind it. Two people can each be right while disagreeing, because
          they conditioned on different, legitimately nested events — neither
          number approximates the other.
      - ask: >
          Refining a screening report from "at least one child is a boy" to "at
          least one child is a boy born on a Tuesday" pushed $\Pr(\text{both
          boys})$ from $1/3$ up to $13/27$. Which correctly explains why?
        choices:
          - text: >
              The Tuesday detail directly changes each child's chance of being
              a boy
            feedback: >
              A birth day is independent of sex; it can't change the individual
              probability of being a boy.
          - text: >
              A two-boy family has two independent chances to satisfy the rare
              Tuesday tag, while a one-boy family only has one, so refining the
              event favors two-boy families
            correct: true
            feedback: >
              This is the exact mechanism — the extra detail is easier for
              two-boy families to satisfy, which is what moves the ratio
              upward.
          - text: >
              Refining an event always increases the probability of whatever
              you're conditioning on, regardless of the details
            feedback: >
              Refinement can move a probability in either direction; the
              direction here is specific to which group finds the extra detail
              easier to satisfy.
        feedback: >
          Refinement moves a probability precisely because the extra detail
          correlates with the event being asked about — here, it's easier for
          two-boy families to satisfy, so the ratio rises.
      - teach: >
          Run the ladder in reverse — pool strata that were kept separate
          instead of splitting them further — and the same mechanism can flip a
          comparison outright rather than merely shift a number by degrees.
      - teach: >
          The trap is treating $1/3$, $13/27$, and $1/2$ as though one of them
          must be the "real" answer with the others mere approximations. None
          of them approximates another; each is exactly correct for its own
          conditioning event.

  - node: quant-puzzles.prob-paradoxes.airplane-seat
    hook: >
      A hundred-passenger recursion sounds unavoidable, but almost every
      seat's occupant is already decided before the process starts — only
      two seats are ever actually in doubt.
    explanation: >
      A hundred passengers board in order; the first, having lost their
      pass, sits uniformly at random, and every later passenger takes their
      own seat if free, otherwise a uniformly random free seat. Conditioning
      on the first passenger's seat directly produces a recursive mess; the
      elegant fix notices that only two seats are ever contested.

      Every random choice in the process is made by someone already
      displaced from their own seat, and every one of those choices happens
      strictly before either seat $1$ or seat $100$ has been taken — taking
      either of those two seats always ends the chain of displacement
      immediately, seat $1$ by luck and seat $100$ by forcing the last
      passenger's outcome. The first random choice that lands on seat $1$ or
      seat $100$ decides the whole process, and a uniformly random chooser
      has no reason to prefer one over the other, so each is equally likely
      to go first.

      First-step conditioning confirms this without leaning on symmetry as a
      leap of faith: writing $p_n$ for the chance the last passenger gets
      their own seat, conditioning on where passenger one sits gives the
      recurrence $p_n = 1/n + (1/n)\sum_{k=2}^{n-1} p_{n-k+1}$ with
      $p_2 = 1/2$, and it returns $1/2$ for every $n$ — the recursion does
      algebraically what the symmetry argument gives by inspection.

      The general lesson: when a chain of contingent random choices really
      only has a small set of decisive branch points, find that reduced set
      before grinding a full recursion.
    worked: >
      Feed the recursion small values directly. $p_2 = 1/2$ is the base
      case. $p_3 = 1/3 + (1/3)p_2 = 1/3 + 1/6 = 1/2$. $p_4 = 1/4 +
      (1/4)(p_3 + p_2) = 1/4 + (1/4)(1) = 1/2$. The recursion returns exactly
      $1/2$ at every step, confirming algebraically what the two-fixed-points
      symmetry argument gives by inspection — the answer never depends on
      how many passengers sit in between.
    interview: >
      The airplane seat problem tests whether you look for the reduced
      structure — only seat $1$ and seat $100$ ever decide the outcome —
      instead of trying to brute-force a hundred-term recursion live; naming
      the two special seats and the symmetry argument in under a minute is
      the strong answer, recursion as the fallback if pressed to prove it.
    pitfalls: >
      Trying to track every passenger's seat choice instead of noticing only
      two seats are ever contested. Assuming the answer depends on the
      passenger count $n$; it's exactly $1/2$ for every $n \ge 2$, which is
      worth stating as the punchline before any derivation.
    recap: >
      The chain of displaced passengers ends the instant someone takes seat
      $1$ or seat $100$, and symmetry makes each equally likely to go first,
      so the last passenger gets their own seat with probability $1/2$
      regardless of how many passengers there are.
    steps:
      - teach: >
          A hundred-passenger recursion sounds unavoidable, but almost every
          seat's occupant is already decided before the process starts. Only
          two seats are ever actually in doubt.
      - teach: >
          Every random choice in this process is made by someone already
          displaced from their own seat, and every one of those choices happens
          strictly before either seat $1$ or seat $100$ has been taken — taking
          either seat always ends the chain of displacement immediately.
      - teach: >
          A uniformly random chooser has no reason to prefer seat $1$ over seat
          $100$ whenever both are still live, so each is equally likely to be
          the one taken first. The last passenger gets their own seat exactly
          when seat $1$ goes first.
      - ask: >
          Under the same boarding rule with $250$ passengers, what is the
          probability the last passenger gets seat $250$?
        expects: "1/2"
        hint: >
          Don't set up a recursion — ask which of the two special seats, $1$ or
          $250$, gets occupied first by a random choice, and why neither is
          favored.
        feedback: >
          Every displaced passenger's random pick happens while both seat $1$
          and seat $250$ are still free, and a uniformly random chooser is
          equally likely to take either first, so the last passenger's own seat
          survives with probability $1/2$ — this doesn't depend on the
          passenger count.
      - teach: >
          When a chain of contingent random choices really only has a small set
          of decisive branch points, find that reduced set before grinding a
          full recursion — the recursion, if you write it out, only confirms
          what the reduced symmetry already gives.
      - ask: >
          With $10$ passengers boarding under the same rule, what is the
          probability that seat $1$, rather than seat $10$, is the first of the
          two special seats to be filled?
        expects: "1/2"
        hint: >
          This is the same symmetry claim from a different angle: ask which of
          the two seats a uniformly random displaced chooser takes first.
        feedback: >
          Whenever a displaced passenger's random choice includes both seat $1$
          and seat $10$ among the options, a uniformly random pick has no
          reason to favor either, so seat $1$ goes first with probability
          $1/2$.
      - ask: >
          Why is the probability the last passenger gets their own seat
          independent of how many passengers board?
        choices:
          - text: >
              Because every random choice happens after seat $1$ or seat $100$
              has already been claimed by an early passenger
            feedback: >
              Backwards — every random choice happens strictly *before* either
              of those two seats is taken; once one is taken, the process is
              already decided.
          - text: >
              Because seat $1$ and seat $100$ are always the last two seats
              considered, and whoever boards last is equally likely to be
              assigned either
            feedback: >
              This isn't how the process works — seats fill in boarding order,
              not by a final assignment step.
          - text: >
              Because every displaced passenger's random choice occurs while
              both seat $1$ and seat $100$ are still free, and a uniformly
              random chooser has no reason to prefer one over the other
            correct: true
            feedback: >
              Exactly it — the symmetry is baked into every random choice along
              the way, which is why the passenger count never enters.
        feedback: >
          The chain of displacement ends the instant someone takes seat $1$ or
          seat $100$, and every random choice before that point treats the two
          symmetrically.
      - teach: >
          The trap is trying to track every passenger's seat choice instead of
          noticing only two seats are ever contested. The answer is exactly
          $1/2$ for every $n \ge 2$, worth stating as the punchline before any
          derivation.

  - node: quant-puzzles.prob-paradoxes.airplane-seat-general
    hook: >
      The risk of losing your seat isn't spread evenly across a hundred
      passengers — it's concentrated almost entirely on the last few, and the
      exact formula says by how much.
    explanation: >
      Extend from "does the last passenger get their seat" to "does
      passenger $k$." Whenever a displaced passenger $j$ chooses, the
      surviving free seats are always seat $1$ together with seats
      $j+1, \dots, n$ — never any seat between $2$ and $j$, since those were
      already claimed by their rightful owners while free. So throughout the
      process up to when passenger $k$ boards, seat $1$ and seats
      $k, \dots, n$ are all still live — $n - k + 2$ seats, symmetric among
      themselves for the same reason as before.

      Passenger $k$ loses their seat exactly when the chain's first decisive
      draw among those $n-k+2$ special seats lands on seat $k$ itself, which
      by the same symmetry happens with probability $1/(n-k+2)$; so passenger
      $k$ succeeds with probability $1 - 1/(n-k+2)$.

      Sanity-check the extremes: $k = n$ recovers $1 - 1/2 = 1/2$; $k = 2$,
      the very first displaced passenger, succeeds with probability
      $1 - 1/n$, near-certain for large $n$, since almost the whole plane's
      worth of special seats is still competing to bump them this early.
    worked: >
      With $n = 10$ passengers: passenger $2$ keeps their seat with
      probability $1 - 1/10 = 9/10$; passenger $5$ with probability
      $1 - 1/7 = 6/7 \approx 0.857$; passenger $9$ with probability
      $1 - 1/3 = 2/3$; and passenger $10$, as before, exactly $1/2$ — the
      risk climbs steadily rather than jumping only at the very end.
    interview: >
      A natural follow-up to the base problem is "what about passenger
      fifty" — answer with $1 - 1/(n-k+2)$ directly rather than re-deriving a
      fresh recursion, and cite the two sanity checks (near-certain early,
      exactly $1/2$ at the end) to show the formula is right without
      re-deriving it live.
    pitfalls: >
      Assuming risk is spread uniformly across all $n$ passengers; it is
      heavily concentrated in the back. Misindexing the pool size as
      $n - k + 1$ instead of $n - k + 2$ — the pool always includes seat $1$
      in addition to seats $k$ through $n$, one more than their raw count.
    recap: >
      Passenger $k$ keeps their own seat with probability $1 - 1/(n-k+2)$:
      early boarders are almost always safe, and the $1/2$ of the original
      puzzle is a special case reserved for the very last one.
    steps:
      - teach: >
          The risk of losing your seat isn't spread evenly across a hundred
          passengers — it's concentrated almost entirely on the last few, and
          the exact formula says by how much.
      - teach: >
          Whenever a displaced passenger $j$ chooses, the surviving free seats
          are always seat $1$ together with seats $j+1, \dots, n$. By the time
          passenger $k$ boards, seat $1$ and seats $k, \dots, n$ are all still
          live — $n-k+2$ seats, symmetric among themselves.
      - teach: >
          Passenger $k$ loses their seat exactly when the first decisive draw
          among those $n-k+2$ special seats lands on seat $k$ itself,
          probability $1/(n-k+2)$. So passenger $k$ succeeds with probability
          $1 - 1/(n-k+2)$.
      - ask: >
          With $n = 20$ passengers, what is the probability passenger $3$ keeps
          their own seat?
        expects: "18/19"
        hint: >
          Plug $n=20$, $k=3$ into $1 - 1/(n-k+2)$.
        feedback: >
          $1 - 1/(20-3+2) = 1 - 1/19 = 18/19$ — an early passenger, so the pool
          of live special seats is still almost the whole plane.
      - teach: >
          Sanity-check the extremes: $k=n$ recovers $1-1/2=1/2$, and $k=2$, the
          first displaced passenger, succeeds with probability $1-1/n$,
          near-certain for large $n$.
      - ask: >
          With $n = 20$ passengers, what is the probability passenger $15$
          keeps their own seat?
        expects: "6/7"
        hint: >
          Plug $n=20$, $k=15$ into $1 - 1/(n-k+2)$.
        feedback: >
          $1 - 1/(20-15+2) = 1 - 1/7 = 6/7$.
      - ask: >
          For $n=20$ passengers, how many seats are still "live" (seat $1$ plus
          the not-yet-claimed high seats) by the time passenger $k=15$ boards?
        choices:
          - text: >
              $n-k+1 = 6$
            feedback: >
              This is one short — it leaves out seat $1$, which is always part
              of the live set.
          - text: >
              $n-k+2 = 7$: seat $1$ together with seats $15$ through $20$
            correct: true
            feedback: >
              Right — six high seats plus seat $1$ makes seven live seats.
          - text: >
              $n-k = 5$
            feedback: >
              This is two short — it drops seat $1$ and undercounts the high
              seats by one as well.
        feedback: >
          The pool is always seat $1$ plus seats $k$ through $n$ — that's
          $n-k+1$ high seats plus one more for seat $1$, giving $n-k+2$.
      - teach: >
          Risk is heavily concentrated in the back of the boarding order, not
          spread uniformly across all $n$ passengers — early boarders are
          almost always safe, and the coin-flip only shows up at the very end.

  - node: quant-puzzles.prob-paradoxes.two-envelopes
    hook: >
      "Switch, then switch back forever" sounds absurd precisely because it
      is, but naming exactly which step is illegal — not just that the
      conclusion is wrong — is the actual skill being tested.
    explanation: >
      One envelope holds twice the other; call yours $A$. The tempting
      argument: the other holds $2A$ or $A/2$ with probability $1/2$ each, so
      $\mathbb{E}[B] = (1/2)(2A) + (1/2)(A/2) = (5/4)A > A$ — switch, and by
      the same logic on whichever envelope you now hold, switch back forever.
      Two separate things are wrong, and telling them apart is what matters.

      Unopened, the error is that $A$ isn't a fixed number, it's a random
      variable, and the $5/4$ calculation silently lets it mean two different
      things in its two branches. Write the true pair honestly as $(x, 2x)$
      for an unknown $x$: your envelope is $x$ half the time and $2x$ half
      the time, and the other is exactly the complementary value each time.
      The tower property, averaging over which is which, gives
      $\mathbb{E}[A] = \mathbb{E}[B] = (3/2)x$ — identical, not a $5/4$ gap.

      Opened, once you've looked and hold amount $a$, the step
      $\Pr(A \text{ is the smaller} \mid A = a) = 1/2$ for every $a$ demands a
      probability law flat over an unboundedly large scale of possible $a$
      values — and no distribution assigns equal, positive weight to
      infinitely many values and still sums to $1$.

      Both failures point the same direction: this isn't a flaw in
      expectation, it's an inconsistent random variable in one telling and a
      nonexistent prior in the other.
    worked: >
      Suppose, unknown to you, the pair actually generated is $(40, 80)$.
      Whichever envelope reaches you, it holds $40$ with probability $1/2$
      and $80$ with probability $1/2$, so $\mathbb{E}[A] = (1/2)(40) +
      (1/2)(80) = 60$, and the identical argument gives $\mathbb{E}[B] = 60$
      as well — the same number, not a $5/4$ gap, because both envelopes are
      averaged over the same underlying pair rather than treating "the
      other" as always the doubled or halved version of whatever you hold.
    interview: >
      "Should you switch envelopes" checks whether you can locate the exact
      flawed step rather than assert "it's a paradox" — the sharp answer
      distinguishes the unopened case (an inconsistent random variable) from
      the opened case (an unnormalizable prior), since a follow-up almost
      always asks what changes once you've actually looked inside.
    pitfalls: >
      Concluding "the expected values are equal" without diagnosing which of
      the two errors is doing the work in a given phrasing. After opening the
      envelope, still treating "the other is equally likely to be double or
      half" as a free assumption rather than a prior that would need to be
      flat over an unbounded scale, which no distribution can supply.
    recap: >
      The $5/4$ argument either lets "your envelope's amount" quietly mean
      two different things across its two branches, or, once opened, leans on
      a uniform-over-everything prior that no probability distribution can
      supply — fix either error and the switching advantage disappears.
    steps:
      - teach: >
          "Switch, then switch back forever" sounds absurd precisely because it
          is, but naming exactly which step is illegal, not just that the
          conclusion is wrong, is the actual skill being tested.
      - teach: >
          The naive argument: the other envelope holds $2A$ or $A/2$ with
          probability $1/2$ each, so $\mathbb{E}[B] = (5/4)A$. Two separate
          things are wrong depending on whether the envelope is opened, and
          telling them apart is what matters.
      - teach: >
          Unopened, $A$ isn't a fixed number, it's a random variable, and the
          $5/4$ calculation silently lets it mean two different things in its
          two branches. Write the true pair honestly as $(x, 2x)$: the tower
          property gives $\mathbb{E}[A] = \mathbb{E}[B] = (3/2)x$, not a $5/4$
          gap.
      - ask: >
          Suppose, unknown to you, the pair actually generated is $(18, 36)$.
          What is $\mathbb{E}[A]$, your envelope's expected amount, averaging
          over which one you were handed?
        expects: "27"
        hint: >
          Whichever envelope you hold, it's $18$ half the time and $36$ half
          the time.
        feedback: >
          $\mathbb{E}[A] = (1/2)(18) + (1/2)(36) = 27$, and the identical
          argument gives $\mathbb{E}[B] = 27$ as well — the same number,
          because both envelopes are averaged over the same underlying pair.
      - ask: >
          In the unopened argument, $\mathbb{E}[B] = (1/2)(2A) + (1/2)(A/2) =
          (5/4)A$. What exactly goes wrong?
        choices:
          - text: >
              The $1/2, 1/2$ weights are wrong — the two cases aren't actually
              equally likely
            feedback: >
              In the symmetric setup the two cases genuinely are equally
              likely; that's not the flaw.
          - text: >
              $A$ is treated as a fixed number meaning the same thing in both
              branches, when it's actually a random variable taking different
              values across the two branches
            correct: true
            feedback: >
              Correct — this is exactly the error the honest $(x,2x)$
              computation fixes.
          - text: >
              Expectation isn't linear here, so the two weighted terms can't be
              added
            feedback: >
              Expectation is always linear; that isn't the source of the error.
        feedback: >
          Once $A$ is written honestly as a random variable taking value $x$ or
          $2x$ depending on which envelope you hold, the $5/4$ gap disappears.
      - teach: >
          Opened, once you've looked and hold amount $a$, the argument needs
          $\Pr(A \text{ is the smaller} \mid A = a) = 1/2$ for every possible
          $a$ — a much stronger and separate demand from the unopened error.
      - ask: >
          That opened-envelope step demands a probability law flat over an
          unbounded range of possible amounts. What does this demand that no
          probability distribution can supply?
        choices:
          - text: >
              A distribution assigning positive probability to only finitely
              many values of $a$
            feedback: >
              Finitely many possible values is fine and normalizable; that
              isn't the problem here.
          - text: >
              A distribution with equal positive weight on every value across
              an unbounded scale, which cannot sum to $1$
            correct: true
            feedback: >
              Correct — infinitely many equal positive weights can never be
              normalized, so no such prior exists.
          - text: >
              A distribution where larger amounts are strictly less likely than
              smaller ones
            feedback: >
              That kind of distribution is perfectly normalizable; it just
              isn't the one the flawed step is implicitly assuming.
        feedback: >
          "Equally likely to be the smaller or larger, whatever the observed
          amount" requires a uniform law over an unbounded scale, and no
          probability distribution can supply one.
      - teach: >
          Concluding only "the expected values are equal" without saying which
          failure, an inconsistent random variable unopened or an
          unnormalizable prior opened, is doing the work in a given phrasing
          misses the actual test.

  - node: quant-puzzles.prob-paradoxes.two-envelopes-proper-prior
    hook: >
      Put a real, normalizable distribution on the envelope amounts and the
      naive switching intuition turns out to be locally correct almost
      everywhere — except at the two boundary amounts, which erase it.
    explanation: >
      Use a genuine prior: the pair is $(2^{k}, 2^{k+1})$ with $k$ uniform on
      a finite range $\{0, \dots, N\}$, so there are finitely many possible
      pairs, each equally likely — the honest prior the naive argument was
      missing.

      For an amount seen strictly inside the possible range, the two
      candidate pairs really are equally likely given that observation, so
      switching genuinely has positive expected gain there — the naive
      intuition is locally correct once a real prior backs it.

      The two boundary amounts break the pattern completely: the smallest
      possible observed amount can only be the smaller member of its pair, so
      switching gains for certain; the largest possible observed amount can
      only be the larger member of its pair, so switching loses for certain,
      and loses a lot. Those two extreme cases carry exactly enough
      probability weight to cancel every interior gain, forcing the
      unconditional expected gain from always switching back to zero.

      Sending $N \to \infty$ recovers the original paradox: the boundary
      keeps receding, every finite observation looks interior, "always
      switch" looks locally justified everywhere you check — but the
      canceling term escapes to infinity along with it, exactly the
      unnormalizable-prior failure diagnosed already.
    worked: >
      Take $N = 2$: the pair is $(2^{k}, 2^{k+1})$ for $k$ uniform on
      $\{0, 1, 2\}$, so the three equally likely pairs are $(1,2), (2,4),
      (4,8)$. See $a = 2$: the two candidate pairs, $(1,2)$ and $(2,4)$, are
      equally likely, so switching's expected gain is
      $(1/2)(-1) + (1/2)(+2) = 1/2$, genuinely favorable. But see $a = 1$
      (only possible as the smaller of $(1,2)$): switching gains a certain
      $+1$. See $a = 8$ (only possible as the larger of $(4,8)$): switching
      loses a certain $-4$. Averaging over all three pairs, the overall
      expected gain from always switching is exactly
      $\frac{1}{2(3)}[1 + (4-1) - 4] = 0$.
    interview: >
      "Fine, put a real prior on it — now should you switch" is the natural
      follow-up once you've diagnosed the paradox; the strong answer says yes
      conditionally at interior observations, no unconditionally, and names
      the boundary cancellation as the reconciling mechanism.
    pitfalls: >
      Concluding from the interior calculation that switching is
      unconditionally favorable with a real prior — the boundary terms are
      what force the unconditional answer back to zero. Forgetting that a
      boundary's contribution scales with how extreme its payoff is, not just
      its probability, so a shrinking-probability boundary can still cancel
      an entire distribution of small interior gains.
    recap: >
      With a genuine finite prior, switching helps at every interior
      observation and hurts badly at the two boundary ones, and those
      boundary cases cancel the interior gains to exactly zero overall —
      sending the range to infinity is what makes the boundary vanish and
      revives the paradox.
    steps:
      - teach: >
          Put a real, normalizable distribution on the envelope amounts and the
          naive switching intuition turns out to be locally correct almost
          everywhere, except at the two boundary amounts, which erase it.
      - teach: >
          Use a genuine prior: the pair is $(2^{k}, 2^{k+1})$ with $k$ uniform
          on a finite range $\{0, \dots, N\}$, so there are finitely many
          possible pairs, each equally likely — the honest prior the naive
          argument lacked.
      - teach: >
          For an amount seen strictly inside the possible range, the two
          candidate pairs really are equally likely given that observation, so
          switching genuinely has positive expected gain there.
      - ask: >
          Let $N=3$: the pair is $(2^{k}, 2^{k+1})$ for $k$ uniform on
          $\{0,1,2,3\}$, giving four equally likely pairs $(1,2), (2,4), (4,8),
          (8,16)$. You observe $a=4$. What is the expected gain from switching?
        expects: "1"
        hint: >
          Only two of the four pairs can produce $a=4$: $(2,4)$, where you'd
          hold the larger value, and $(4,8)$, where you'd hold the smaller.
          Check they're equally likely given the observation.
        feedback: >
          $\Pr(\text{pair}=(2,4)\mid a=4) = \Pr(\text{pair}=(4,8)\mid a=4) =
          1/2$. Switching from $(2,4)$ loses $2$; switching from $(4,8)$ gains
          $4$. Expected gain $= (1/2)(-2) + (1/2)(4) = 1$.
      - teach: >
          The two boundary amounts break the pattern completely: the smallest
          possible observed amount can only be the smaller member of its pair,
          so switching gains for certain; the largest can only be the larger
          member, so switching loses for certain, and loses a lot.
      - ask: >
          Keep $N=3$, so the four equally likely pairs are $(1,2), (2,4),
          (4,8), (8,16)$. If you observe the largest possible amount, $a=16$,
          what is the expected gain from switching?
        expects: "-8"
        hint: >
          $a=16$ can only arise from the pair $(8,16)$, and only as the larger
          member.
        feedback: >
          Observing $16$ pins the pair to $(8,16)$ with you holding the larger
          value for certain, so switching always loses $16-8=8$: expected gain
          $-8$.
      - ask: >
          Averaged over all four possible pairs $(1,2), (2,4), (4,8), (8,16)$
          and both envelope roles, what is the unconditional expected gain from
          a policy of always switching?
        choices:
          - text: >
              Positive — interior conditional gains like the one at $a=4$
              dominate
            feedback: >
              The interior gains are real, but averaging over how often each
              amount is actually observed changes the total.
          - text: >
              Exactly zero — the boundary conditional losses and gains carry
              exactly the probability weight needed to offset every interior
              conditional gain
            correct: true
            feedback: >
              Correct, and it has to be zero: for any fixed pair, switching
              trades between its two values with equal chance of holding
              either, so each pair contributes zero in expectation on its own.
          - text: >
              Negative — the boundary loss of $8$ is the single
              largest-magnitude outcome
            feedback: >
              Magnitude alone doesn't determine the sign; the full average,
              weighted correctly, comes out to exactly zero.
        feedback: >
          The unconditional expected gain from always switching is exactly $0$:
          every interior positive conditional gain is offset once the two
          extreme, oppositely signed boundary cases are folded in with their
          correct weights.
      - teach: >
          Sending $N \to \infty$ recovers the original paradox: the boundary
          keeps receding, so every finite observation looks interior, but the
          canceling term escapes to infinity along with it.

  - node: quant-puzzles.prob-paradoxes.simpson
    hook: >
      A trader who beats a rival in every single market regime can still
      lose the pooled comparison badly, and nothing about the arithmetic is
      inconsistent — only the mix is doing the work.
    explanation: >
      This is the coarse end of the fineness ladder: pool two strata that
      were kept separate, and a comparison holding in every stratum can
      reverse in the pooled total. Nothing is inconsistent, only unnoticed,
      because a pooled rate is a weighted average and the two things being
      compared can draw on different weights.

      Mechanically: whenever one side's activity concentrates in the harder
      stratum and the other side's concentrates in the easier one, the
      harder side's overall rate gets dragged down by a stratum everyone does
      badly in, and the easier side's rate gets lifted by a stratum everyone
      does well in — the mix, not the underlying skill, is what the pooled
      number is measuring.

      Reversal is available whenever the gap between strata exceeds the gaps
      within them being compared, and the two sides' stratum weightings lean
      in opposite directions; check both conditions before trusting or
      distrusting a pooled headline number.

      The fix mirrors the fineness discipline exactly: quote the
      stratification alongside any pooled number, and when a pooled
      comparison is actually what's being asked for, standardize both sides
      to a common weighting before comparing, rather than comparing raw
      pooled totals.
    worked: >
      Two bank branches, small- and large-business loans. Branch $M$
      approves $9$ of $10$ small loans ($90\%$) and $27$ of $90$ large loans
      ($30\%$), for $36$ of $100$ overall ($36\%$). Branch $N$ approves $72$
      of $90$ small loans ($80\%$) and $5$ of $20$ large loans ($25\%$), for
      $77$ of $110$ overall (about $70\%$). $M$ beats $N$ in every category —
      $90\%$ against $80\%$, $30\%$ against $25\%$ — and still loses the
      pooled comparison badly, because $M$'s business skews nine-to-one
      toward the harder large-loan category while $N$'s skews the opposite
      way.
    interview: >
      "Can a strategy win every subgroup comparison and lose the aggregate"
      is answered "yes" immediately, with the mechanism named — a pooled rate
      is a weighted average, and the two sides' weights differ — the
      interviewer is checking you don't call it a data error.
    pitfalls: >
      Reporting only the pooled headline number when comparing two groups
      whose case mixes plausibly differ. Assuming the direction of the
      reversal tells you which side is "really" better; it tells you only
      about the mix, and answering the deeper question requires deciding
      whether the mix itself is part of what's being evaluated.
    recap: >
      A pooled comparison is a weighted average with the mix as the weights,
      and mismatched mixes can flip a comparison that holds in every
      individual stratum — stratify before trusting a pooled number.
    steps:
      - teach: >
          A trader who beats a rival in every single market regime can still
          lose the pooled comparison badly, and nothing about the arithmetic is
          inconsistent. Only the mix is doing the work.
      - teach: >
          A pooled rate is a weighted average of the stratum rates. Reversal is
          available whenever the gap between strata exceeds the gaps within
          them, and the two sides' stratum weightings lean in opposite
          directions.
      - teach: >
          Whenever one side's activity concentrates in the harder stratum and
          the other's concentrates in the easier one, the harder side's overall
          rate gets dragged down by a stratum everyone does badly in, while the
          easier side's gets lifted by a stratum everyone does well in.
      - ask: >
          Trader C wins $3$ of $5$ quiet-market trades and $40$ of $100$
          volatile trades. What is C's overall (pooled) win rate as a fraction?
        expects: "43/105"
        hint: >
          Add total wins across both regimes and divide by total trades across
          both regimes.
        feedback: >
          C wins $3+40=43$ of $5+100=105$ trades overall, a pooled rate of
          $43/105$.
      - ask: >
          Trader D wins $45$ of $100$ quiet-market trades and $1$ of $5$
          volatile trades. What is D's overall (pooled) win rate as a fraction?
        expects: "46/105"
        hint: >
          Same move: total wins over total trades, pooled across both regimes.
        feedback: >
          D wins $45+1=46$ of $100+5=105$ trades overall, a pooled rate of
          $46/105$.
      - ask: >
          C wins $60\%$ of quiet trades against D's $45\%$, and $40\%$ of
          volatile trades against D's $20\%$ — C beats D in both. Yet C's
          pooled rate, $43/105$, trails D's $46/105$. What explains the
          reversal?
        choices:
          - text: >
              It's a data error — this configuration is actually impossible
            feedback: >
              It's not impossible; the win counts given are entirely consistent
              with these rates and this reversal.
          - text: >
              C's trade volume is concentrated in the volatile regime, where
              both traders do worse, while D's is concentrated in the quiet
              regime, where both do better — the pooled numbers are weighted
              averages with different weights
            correct: true
            feedback: >
              Exactly right — C took $100$ of its $105$ trades in the harder
              regime, while D took $100$ of its $105$ in the easier one.
          - text: >
              D must actually have higher true skill, and the per-regime
              numbers understate it
            feedback: >
              Nothing about the arithmetic implies anything about "true skill";
              the reversal is an artifact of the differing trade-volume mix.
        feedback: >
          The pooled comparison is measuring the mix as much as the rates — C's
          business skews heavily toward the harder regime, D's toward the
          easier one, and that alone flips the aggregate.
      - teach: >
          The fix mirrors the fineness discipline exactly: quote the
          stratification alongside any pooled number, and standardize both
          sides to a common weighting before comparing rather than comparing
          raw pooled totals.
      - teach: >
          The trap is reporting only the pooled headline number when the case
          mixes plausibly differ. The direction of a reversal tells you about
          the mix, not about which side is "really" better.

  - node: quant-puzzles.prob-paradoxes.simpson-pnl
    hook: >
      A blended Sharpe ratio can beat a rival's while losing in every single
      year, sector, and volatility bucket — this isn't a curiosity, it's the
      default failure mode of any pooled PnL statistic.
    explanation: >
      Reversal hits every point where performance is blended across a
      market-driven or size-driven mix, and the mix itself typically shifts
      in exactly the direction that flatters or damns the headline number.
      Three concrete manifestations: blended fill quality flatters a desk
      trading mostly liquid names even if execution is mediocre in every
      individual name; an aggregate Sharpe can beat a rival's while losing in
      every single year, sector, and volatility bucket, because the periods
      weighted heaviest happen to be the ones where the mix favored it; a
      backtest can appear to improve purely because the sample composition
      shifted rather than because the underlying edge changed at all.

      Two protective habits: report every comparison stratified by whatever
      variable drives the base rate — liquidity bucket, year, regime — and
      before pooling, decide explicitly whether the stratifying variable is a
      confounder that must be controlled for, or is itself a consequence of
      the decision under evaluation. Controlling for the latter silently
      deletes the effect you were trying to measure — controlling for "which
      regime the strategy chose to trade in" when regime selection is the
      strategy erases the strategy's own decision.

      The discipline generalizes past PnL: whenever a single blended number
      ranks two things with different exposure to an underlying driver, ask
      for the stratified version first.
    worked: >
      A strategy shows a blended annual Sharpe of $1.4$, beating a
      benchmark's $1.1$. Broken out by year, the strategy trails the
      benchmark in four of five years and wins only in one volatile year
      that dominates the blended number because it contributed most of the
      total variance-weighted return. Stratified by year, the benchmark is
      the better choice in the ordinary years, and the blended number was
      answering "which one did better across the mix of years that
      happened" rather than "which one is the better strategy."
    interview: >
      "Our aggregate Sharpe beats theirs" invites the follow-up "does it
      still, stratified by year or regime" — the strong candidate asks this
      unprompted and names which protective habit, stratifying or checking
      whether the stratifier is itself part of the effect, is doing the work
      in the comparison at hand.
    pitfalls: >
      Treating a favorable blended statistic as settled evidence without
      checking whether the underlying mix shifted between the two things
      compared. Controlling for a variable that is itself a consequence of
      the strategy's own decisions, which erases the effect rather than
      isolating it.
    recap: >
      A blended PnL statistic is a weighted average over whatever mix
      actually realized, and it flatters or damns a strategy for its
      exposure to that mix as much as for its underlying edge — always ask
      for the stratified version before trusting the headline.
    steps:
      - teach: >
          A blended Sharpe ratio can beat a rival's while losing in every
          single year, sector, and volatility bucket. This isn't a curiosity —
          it's the default failure mode of any pooled PnL statistic.
      - teach: >
          Three concrete manifestations: blended fill quality flatters a desk
          trading mostly liquid names even with mediocre execution in every
          name; an aggregate Sharpe can beat a rival's while losing every
          stratum; a backtest can improve purely because the sample mix
          shifted, not the edge.
      - ask: >
          Desk X wins $70\%$ of $20$ small-cap trades and $40\%$ of $80$
          large-cap trades. What is its blended win rate as a fraction?
        expects: "23/50"
        hint: >
          Weight each stratum's rate by how many trades it contributed, then
          divide by the total trade count.
        feedback: >
          Wins: $0.7(20) + 0.4(80) = 14 + 32 = 46$ out of $100$ total trades,
          giving a blended rate of $46/100 = 23/50$.
      - teach: >
          Two protective habits: report every comparison stratified by whatever
          variable drives the base rate, and decide before pooling whether the
          stratifier is a confounder to control for or a consequence of the
          decision being evaluated.
      - ask: >
          Desk Y wins $55\%$ of $60$ quiet-regime trades and $25\%$ of $40$
          volatile-regime trades. What is its blended win rate as a fraction?
        expects: "43/100"
        hint: >
          Same weighting: total wins across both regimes divided by total
          trades.
        feedback: >
          Wins: $0.55(60) + 0.25(40) = 33 + 10 = 43$ out of $100$ total trades,
          giving $43/100$.
      - ask: >
          A desk's aggregate Sharpe beats a benchmark's only because the desk
          shifted more of its trading into a high-volatility period that
          happened to do well for everyone. Before controlling for "which
          period the desk traded in," what should you ask?
        choices:
          - text: >
              Always control for it — removing period effects isolates true
              skill
            feedback: >
              Not always: if shifting into that period was itself the
              strategy's own decision, controlling for it deletes the effect
              you're trying to measure.
          - text: >
              Whether the period-mix is a confounder to control for, or a
              consequence of the very decision, the strategy's own trade
              selection, that you're evaluating
            correct: true
            feedback: >
              Correct — this is exactly the distinction that decides whether
              stratifying clarifies or erases the effect.
          - text: >
              Nothing — aggregate Sharpe is always the right number to trust
            feedback: >
              This is precisely the failure mode the node warns against.
        feedback: >
          Controlling for a variable that is itself a consequence of the
          strategy's own decisions doesn't isolate the effect — it erases it.
      - teach: >
          Controlling for "which regime the strategy chose to trade in" when
          regime selection is the strategy erases the strategy's own decision —
          the discipline is deciding this before pooling, not after seeing a
          favorable number.

  - node: quant-puzzles.prob-paradoxes.sleeping-beauty
    hook: >
      Halfers and thirders both do the arithmetic correctly; they've just
      silently picked different sample spaces, and the puzzle never tells you
      which one it means.
    explanation: >
      A fair coin decides Sunday night; heads wakes Beauty once, on Monday;
      tails wakes her twice, Monday and Tuesday, with her memory of Monday
      erased before Tuesday so each waking feels identical. Asked her
      credence in heads upon waking, two camps compute different, internally
      consistent numbers.

      Halfers reason over the coin: she learned nothing she hadn't already
      anticipated, since she knew in advance she'd be woken and asked this
      exact question regardless of the outcome, so her credence stays at the
      prior, $1/2$ — a claim about the sample space of coin tosses.

      Thirders reason over the awakening: across many repetitions there are
      three equally frequent wakings, one following heads and two following
      tails, and from the perspective of "this waking, uniformly among all
      wakings that could be occurring right now," $\Pr(\text{heads}) = 1/3$
      — a claim about the sample space of individual awakenings, not coin
      tosses.

      The two camps aren't disagreeing about arithmetic; they've silently
      picked different sample spaces, per-experiment versus per-awakening,
      and both compute correctly on the one they picked. Resolve it the way
      you resolve any conditioning ambiguity: name the sampling unit before
      answering.
    worked: >
      Generalize: suppose tails leads to three wakings instead of two, heads
      still once. Per-awakening reasoning now gives four equally frequent
      wakings, one following heads, so that credence is $1/4$; per-experiment
      reasoning is untouched and stays $1/2$. Turning it into a bet settles
      which number governs actual payoffs: paid one unit for every awakening
      on which she correctly guesses heads, a heads-ticket is worth $1/4$ in
      expectation; paid once per completed experiment regardless of how many
      times she was asked, it's worth $1/2$ — the payoff rule, not the coin,
      decides which number is economically relevant.
    interview: >
      "What should her credence be" is really "name the sample space" — the
      interviewer is testing whether you notice the ambiguity at all, rather
      than defending one camp's number as objectively correct; converting the
      question into an explicit betting scheme is the fast way to show you
      understand why both survive.
    pitfalls: >
      Arguing for halfer or thirder as if one must be a mathematical error —
      both are internally valid, and the disagreement lives entirely in which
      sample space, experiments or awakenings, the question implicitly uses.
      Proposing a bet without specifying whether it pays per awakening or per
      experiment; the two payoff rules price an identical-sounding wager
      differently.
    recap: >
      Halfers and thirders compute correctly on two different sample spaces,
      per-experiment and per-awakening — the puzzle never names which, and
      only a stated payoff rule pins down the number that actually matters.
    steps:
      - teach: >
          Halfers and thirders both do the arithmetic correctly. They've just
          silently picked different sample spaces, and the puzzle never tells
          you which one it means.
      - teach: >
          Halfers reason over the coin: Beauty learned nothing she hadn't
          already anticipated, since she knew in advance she'd be woken and
          asked this exact question regardless of the outcome, so her credence
          stays at the prior, $1/2$.
      - teach: >
          Thirders reason over the awakening: across many repetitions there are
          three equally frequent wakings, one following heads and two following
          tails, so from "this waking, uniformly among all wakings that could
          be occurring right now," $\Pr(\text{heads}) = 1/3$.
      - ask: >
          Suppose tails leads to four wakings instead of two, with her memory
          erased between each, and heads still leads to exactly one waking.
          Reasoning per-awakening, what is her credence in heads?
        expects: "1/5"
        hint: >
          Count total equally frequent wakings across many repetitions: one
          following heads, how many following tails?
        feedback: >
          There are $1$ heads-waking and $4$ tails-wakings, five equally
          frequent wakings total, one of which follows heads: $1/5$.
      - ask: >
          Halfers get $1/2$ and thirders get $1/3$ for the credence in heads
          upon waking. Which best describes the disagreement?
        choices:
          - text: >
              Thirders made an arithmetic error; halfers are correct
            feedback: >
              Both camps compute correctly; the thirder count of three equally
              frequent wakings is not a mistake.
          - text: >
              Both are internally correct; they've implicitly chosen different
              sample spaces, coin tosses versus individual awakenings, and the
              puzzle's wording never picks one
            correct: true
            feedback: >
              Correct — this is exactly the ambiguity, resolved the same way
              every conditioning ambiguity is: name the sampling unit.
          - text: >
              The correct answer is whichever camp has more people agreeing
              with it
            feedback: >
              This isn't a matter of consensus; both computations are genuinely
              valid on their own well-defined sample space.
        feedback: >
          Neither camp is wrong — they've silently picked different sample
          spaces, per-experiment versus per-awakening, and both compute
          correctly on the one they picked.
      - ask: >
          A bookmaker offers a "heads ticket" worth one unit if the coin landed
          heads. Under which payoff rule is the ticket worth exactly $1/2$ in
          expectation?
        choices:
          - text: >
              Paid once for every awakening on which she holds the ticket
            feedback: >
              That's the per-awakening rule, which prices the ticket at the
              thirder number, not $1/2$.
          - text: >
              Paid exactly once per completed experiment, regardless of how
              many times she was woken and asked
            correct: true
            feedback: >
              Correct — paid once per experiment, the price uses the
              per-experiment sample space, where $\Pr(\text{heads})=1/2$ by
              construction.
          - text: >
              Paid twice regardless of the coin's outcome
            feedback: >
              This isn't a payoff rule tied to the coin at all, so it doesn't
              price the ticket meaningfully.
        feedback: >
          The payoff rule, not the coin, decides which sample space is
          economically relevant — that's why turning the question into an
          explicit bet is the fastest way to settle it.
      - teach: >
          Name the sampling unit before answering "what should her credence be"
          — the question is really "which sample space" wearing a disguise, and
          only a stated betting rule pins down the number that actually
          matters.
