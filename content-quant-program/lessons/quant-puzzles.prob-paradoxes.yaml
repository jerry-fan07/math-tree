unit: quant-puzzles.prob-paradoxes
opening: >
  This unit collects the probability puzzles interviews use to test whether
  you understand conditioning or just execute it. Every entry has the same
  anatomy: a plausible answer that ignores how the information was generated,
  and a correct answer that falls out once you name the generating protocol
  and weight hypotheses by the likelihood of the exact report received. The
  first two nodes hand you that discipline in general form; the rest are
  worked instances — Monty Hall and its variants, Bertrand's box, the
  boy–girl and Tuesday-boy puzzles, the airplane seat, the two envelopes, and
  Simpson's paradox — each a different way informal reasoning discards
  information the correct calculation needs.
lessons:
  - node: quant-puzzles.prob-paradoxes.protocol-matters
    hook: >
      Every probability "paradox" brought to an interview is an incomplete
      sentence: the interviewer names an event but not the mechanism that
      produced it, and dividing before filling that gap gets correct
      arithmetic to the wrong answer.
    explanation: >
      The ratio definition of conditional probability presupposes that the
      conditioning event is a well-defined subset of a fixed sample space. A
      verbal report — "he opened door $3$," "at least one is a boy" — is not
      automatically such an event; it becomes one only once you fix the space
      of (true state, possible report) pairs the report was drawn from.

      Three pieces belong on the table before you touch a fraction: the state
      of the world and its prior, the rule by which an observer selects and
      reports, and the report you actually received. Two different rules that
      happen to generate identical words carve that report into different
      events on different sample spaces, hence different posteriors.

      This is why arguments about these puzzles run forever without
      resolving: each side is implicitly filling in a different rule for the
      reporting step and then computing correctly inside their own version.
      There is no single answer to "at least one is a boy" until the
      selection rule is pinned down.

      Interview craft: say out loud which protocol you're assuming before
      computing, so the interviewer can correct you if they meant something
      else, then note how the answer would change under the alternative
      reading.
    worked: >
      Two independent backtests each succeed with probability $1/2$, giving
      four equally likely outcomes $SS, SF, FS, FF$. Protocol one: a
      colleague screens for "at least one succeeded" and tells you only that.
      Removing $FF$ leaves three equally likely cases, so
      $\Pr(SS \mid \text{report}) = 1/3$. Protocol two: the colleague always
      reports test one's specific result, and it happened to be success.
      Conditioning on "test one $= S$" leaves $SS, SF$ equally likely, so
      $\Pr(SS \mid \text{report}) = 1/2$ — identical words, two different
      generating rules, two different numbers.
    interview: >
      "How would you answer a probability question phrased as 'at least one
      of two things is true'" is answered by stating that the number depends
      on the selection mechanism and naming the question you'd ask before
      computing anything.
    pitfalls: >
      Answering the moment you hear the report, without stating the protocol
      you're assuming. Defaulting to "screening" for every "at least one"
      phrasing when many canonical interview setups (Monty Hall, meeting one
      child at random) instead fix a report channel that fires whether or not
      the condition holds.
    recap: >
      Name the sampling and reporting rule before conditioning — identical
      words support genuinely different numbers under different rules, and
      naming the rule is the entire fix.
    dialogue:
      - part: One sentence about two dice
        teach: >
          A colleague rolls two fair dice behind a screen, glances at them,
          and tells you: "There is a $6$." She wants the probability that both
          dice show $6$.
      - ask: >
          Read her sentence as the event "at least one die shows $6$" among
          the $36$ equally likely ordered pairs. What is the probability that
          both dice show $6$?
        expects: "1/11"
        hint: >
          Count the pairs containing a $6$ without counting $(6,6)$ twice.
        feedback: >
          $6 + 6 - 1 = 11$ pairs contain a $6$, and exactly one of them is
          $(6,6)$, so the answer is $(1/36)/(11/36) = 1/11$.
      - ask: >
          A second candidate answers $1/6$: "one die is a $6$, and the other
          die is fair and independent of it." Who is right?
        choices:
          - text: >
              You are: $1/11$ conditions on what she said, and $1/6$ ignores it.
            feedback: >
              $1/11$ is right for one reading of her sentence, not for every
              reading. Had she tossed a coin to pick one die and read out only
              that die, the $1/6$ argument would be exactly right — the other
              die really is untouched.
          - text: >
              The candidate is: the other die is independent, so it is a $6$
              with probability $1/6$.
            feedback: >
              "The other die" presumes you know which die is the $6$. Read as
              an event, her sentence names none: it is true on both $(6,3)$
              and $(3,6)$, and on those there is no "other" die to point at.
          - text: >
              Neither can be judged yet: it depends on what she would have
              said had the dice landed differently.
            correct: true
            feedback: >
              Both computations are correct inside their own experiment. The
              sentence does not say which experiment was run.
          - text: >
              Neither: both dice show $6$ with probability $1/36$, and her
              remark changes nothing.
            feedback: >
              $1/36$ is the prior. Her remark rules out the $25$ pairs with no
              $6$ in them, so it has to move the number.
        feedback: >
          Two careful people, two different numbers, one sentence. The
          arithmetic is not where they disagree.

      - part: Two colleagues, the same words
        teach: >
          Picture two colleagues. Sara looks at both dice and says "there is a
          $6$" exactly when at least one die shows $6$. Rafa tosses a coin to
          pick one die, looks only at that die, and says "there is a $6$"
          exactly when it shows $6$. On today's roll, either of them could
          have said the sentence you heard.
      - ask: >
          On a single roll, what is the probability that Rafa says "there is
          a $6$"?
        expects: "1/6"
        feedback: >
          Whichever die his coin picks, it is a fair die, so it shows $6$ with
          probability $1/6$. Sara, by contrast, says the sentence with
          probability $11/36$ — nearly twice as often.
      - ask: >
          Given that Rafa said it, what is the probability that both dice show
          $6$?
        expects: "1/6"
        hint: >
          On one roll, how likely is it that both dice show $6$ and Rafa says
          the sentence?
        feedback: >
          On $(6,6)$ he says it whichever die he picks, so
          $\Pr(\text{both and report}) = 1/36$. Dividing by
          $\Pr(\text{report}) = 1/6$ gives $1/6$. The candidate priced Rafa's
          game correctly; you priced Sara's.
      - reflect: >
          Sara and Rafa uttered the same words about the same dice and earned
          different answers. What did you have to know about each of them,
          beyond the words, before a number existed — and why is the bare
          sentence not yet something you can condition on?
        answer: >
          You had to know the rule each followed: what each would have said on
          every one of the $36$ rolls, coin toss included. The event you
          condition on is the set of (roll, report) outcomes in which this
          report gets made, and the rule decides that set, not the words. For
          Sara it is all $11$ pairs with a $6$ at full weight; for Rafa it
          keeps $(6,6)$ whole but only half of each of the other ten pairs,
          because on those he says it only when his coin lands on the $6$.
      - teach: >
          Fix the generating protocol before you condition. Write the
          experiment out in three pieces: the state of the world and its prior
          (the $36$ pairs at $1/36$ each); the rule by which an observer
          selects and reports (screen both dice, or read one die chosen by
          coin); the report you actually received. Only then is
          $\Pr(\text{state} \mid \text{report})$ defined: the probability of
          the state together with this report under this rule, divided by the
          probability of this report under this rule.

      - part: Pricing each protocol by hand
        ask: >
          Under Sara's protocol, given "there is a $6$", what is the
          probability that the two dice sum to at least $11$?
        expects: "3/11"
        feedback: >
          The sums of at least $11$ are $(5,6)$, $(6,5)$ and $(6,6)$. All
          three contain a $6$, and Sara reports on every one of the $11$ pairs
          with a $6$, so the answer is $3/11$.
      - ask: >
          Under Rafa's protocol, given "there is a $6$", what is the
          probability that the two dice sum to at least $11$?
        expects: "1/3"
        hint: >
          Take the same three pairs, and for each ask how likely Rafa is to
          say the sentence.
        feedback: >
          $(6,6)$ produces the report surely; $(5,6)$ and $(6,5)$ produce it
          only if his coin picks the $6$, probability $1/2$. So
          $\Pr(\text{sum} \ge 11 \text{ and report}) = (1 + 1/2 + 1/2)/36 =
          2/36$, and dividing by $\Pr(\text{report}) = 6/36$ gives $1/3$.
      - ask: >
          A third colleague, Tal, looks at both dice and announces the larger
          face: "the larger is a $6$." Whose answer for "both show $6$" does
          Tal's report reproduce?
        choices:
          - text: >
              Rafa's $1/6$: Tal also reads out a single die, the larger one.
            feedback: >
              Tal reads both dice and chooses nothing at random. His report
              fires with certainty on every pair containing a $6$ — and on no
              other pair — which is Sara's rule in different words.
          - text: >
              Sara's $1/11$
            correct: true
            feedback: >
              "The larger is a $6$" is made on exactly the $11$ pairs with a
              $6$, each with probability $1$. Same event, same answer.
          - text: >
              A new number: naming a specific face carries more information
              than "there is a $6$".
            feedback: >
              Information lives in which states produce the report and how
              often. Tal's report and Sara's are produced by the same $11$
              pairs at the same rate, so they carry the same information.
        feedback: >
          Different wording, same protocol, same number — and, from Sara and
          Rafa, the same wording with different protocols and different
          numbers. The rule is what you are conditioning on.

      - part: Naming your assumption out loud
        ask: >
          Which of these reports is already a complete experiment you could
          condition on?
        choices:
          - text: >
              A broker mentions that one of your two bonds was downgraded.
            feedback: >
              Did he check both and mention a downgrade if either had one, or
              was he only ever going to talk about the bond he covers? The
              rule is missing, and the answer moves with it.
          - text: >
              A monitor checks both of two servers nightly, each down with
              probability $1/20$ independently, and pages you whenever at least
              one is down. Tonight it paged.
            correct: true
            feedback: >
              Prior, rule and report are all stated: the page is the screening
              event "at least one down", and every conditional probability
              about the two servers is now defined.
          - text: >
              A trader says one of his two positions lost money today.
            feedback: >
              Nothing says whether he would have mentioned a loss on either
              position or was describing a particular one, and traders choose
              what they mention. No rule, no event.
        feedback: >
          A report is data only once you know what would have been reported in
          every other state of the world.
      - ask: >
          An interviewer says: "I rolled two dice, and at least one is a $6$.
          What is the probability both are?" Which answer is strongest?
        choices:
          - text: >
              $1/11$.
            feedback: >
              Probably the number intended, but you have silently assumed
              screening. If the interviewer meant a die read at random, you
              are wrong without having shown you saw the fork.
          - text: >
              $1/6$, because the dice are independent.
            feedback: >
              The dice are independent of each other; the report is not
              independent of the dice. That shortcut is only valid for a
              protocol that singles out one die.
          - text: >
              "Assuming you checked both dice and would have said so whenever
              there was a $6$: $1/11$. If you read one die at random, $1/6$."
            correct: true
            feedback: >
              State the protocol, price it, flag the alternative — ten seconds,
              and the interviewer can redirect you before you have committed.
          - text: >
              "The question is ill-posed, so I cannot answer it."
            feedback: >
              True as far as it goes, and it earns nothing. Pick the likely
              protocol, price it, and name the other one.
        feedback: >
          Every long argument about a probability paradox is two people
          pricing different games. Name yours first.

  - node: quant-puzzles.prob-paradoxes.full-observation
    hook: >
      The line separating a paradox's wrong answer from its right one is
      whether you counted how many reports a hypothesis could have produced,
      or only whether it permits the one you got.
    explanation: >
      Once the protocol is fixed, each hypothesis $H$ induces a specific
      probability $\Pr(O \mid H)$ of producing the exact observation $O$ you
      received — not just whether $O$ is possible under $H$. Weighting each
      hypothesis by prior times this likelihood, then normalizing, is Bayes'
      theorem; the paradoxes live entirely in getting the likelihood right.

      The naive error treats every hypothesis consistent with $O$ as equally
      supported, as if $\Pr(O \mid H)$ were $1$ whenever $O$ is merely
      possible under $H$. But a hypothesis under which several different
      reports could have come out has its probability mass split across
      them, so the report you actually received earns it only a fraction of
      its prior; a hypothesis forced to produce exactly this report keeps its
      prior whole.

      Mechanically: for each hypothesis, enumerate every report the protocol
      could generate under it, and read off the chance it generates precisely
      the one observed. Multiply by the prior, normalize across hypotheses.

      This one asymmetry — how many ways a hypothesis could have produced
      what you saw — is the entire engine behind the puzzles ahead: it is why
      a forced reveal counts as stronger evidence than a free one.
    worked: >
      Urn $A$ holds $3$ balls labeled $1, 2, 3$; urn $B$ holds $5$ balls
      labeled $1$ through $5$. Pick an urn uniformly, then a ball uniformly;
      you're told the label is $2$. Both urns could produce a $2$, so the
      reflex is to call it $50/50$. But $\Pr(2 \mid A) = 1/3$ while
      $\Pr(2 \mid B) = 1/5$, so $\Pr(A \mid 2) = (1/3)/(1/3 + 1/5) = 5/8$ —
      the smaller urn, having fewer ways to produce something other than a
      $2$, gets more than half the posterior weight.
    interview: >
      When told "you observed $X$," compute how likely each hypothesis was
      to produce $X$ specifically, not just whether $X$ was possible under
      it — this is the single move that separates the people who get Monty
      Hall right from the people who call it $50/50$.
    pitfalls: >
      Treating "possible under $H$" as "equally likely given $H$" is the
      uniform-over-consistent-hypotheses fallacy. Stopping at prior times
      likelihood without normalizing across every hypothesis leaves an
      unnormalized score, not a probability.
    recap: >
      Weight each hypothesis by how likely it was to generate the exact
      report you got, not merely by whether the report was possible — that
      difference is the entire content of these puzzles.
    dialogue:
      - part: A signal both bots could send
        teach: >
          Your screen shows one message: "BUY". It came from one of two bots,
          and a fair coin decided which. Bot X sends "BUY" every time it runs.
          Bot Y sends one of four signals — BUY, SELL, HOLD, WAIT — chosen
          uniformly.
      - ask: >
          Picture $800$ runs of this setup. On how many of them does the
          screen show "BUY"?
        expects: "500"
        hint: >
          About $400$ runs go to each bot. How many of each bot's runs end in
          "BUY"?
        feedback: >
          X's $400$ runs all end in "BUY"; a quarter of Y's $400$ do, which is
          $100$. So $400 + 100 = 500$ runs show "BUY".
      - ask: >
          Given the screen shows "BUY", what is the probability that bot X
          sent it?
        expects: "4/5"
        feedback: >
          Of the $500$ runs showing "BUY", $400$ came from X:
          $400/500 = 4/5$.
      - ask: >
          A colleague says: "Both bots could have sent BUY, so it is $50/50$."
          What exactly did the colleague get wrong?
        choices:
          - text: >
              Nothing: each bot is consistent with the message, and the coin
              was fair.
            feedback: >
              Consistent is not the same as equally likely. Of the $500$ runs
              showing "BUY", $400$ are X's — the frequencies are not even
              close to $50/50$.
          - text: >
              The colleague ignored the prior.
            feedback: >
              The prior is $1/2$ each, and the colleague used it. The error is
              in the other factor.
          - text: >
              The colleague scored Y as if it sends "BUY" every time.
            correct: true
            feedback: >
              Y says "BUY" on only a quarter of its runs, so the message is
              four times as likely under X as under Y. Treating "possible" as
              "certain" erased that factor of four.
        feedback: >
          The colleague asked whether each bot permits the message. The
          question that moves the number is how likely each bot was to produce
          it.

      - part: What the fifty-fifty throws away
        reflect: >
          Bot Y can perfectly well send "BUY", and still lost ground when you
          saw it. Say what you should score each hypothesis by, and why a
          hypothesis that could have produced several different messages is
          penalised when you see one of them.
        answer: >
          Score each hypothesis by its prior times the probability that it
          produces exactly the message you received. Y spreads its runs over
          four messages, so only a quarter of its prior mass lands on "BUY";
          X is forced to send "BUY", so all of its prior mass lands there.
          Seeing "BUY" is a sample from where the mass landed, and $1/2$
          against $1/8$ is $4$ to $1$.
      - teach: >
          Condition on the whole observation, weighted by its likelihood:
          $\Pr(H \mid O) \propto \Pr(O \mid H)\Pr(H)$, normalised over all
          hypotheses. $\Pr(O \mid H)$ is the chance that the protocol emits
          exactly this report when $H$ is true — rarely $1$ just because $O$
          is possible under $H$. For each hypothesis, list the reports it
          could emit, read off the chance of this one, multiply by the prior,
          and divide by the total.
      - ask: >
          The coin is replaced: now X runs with probability $1/5$ and Y with
          probability $4/5$. The screen shows "BUY". What is
          $\Pr(\text{X} \mid \text{BUY})$?
        expects: "1/2"
        feedback: >
          X scores $(1/5)(1) = 1/5$ and Y scores $(4/5)(1/4) = 1/5$, so the
          posterior is $(1/5)/(2/5) = 1/2$. The likelihood's factor of four
          exactly undid a prior tilted four to one against X.
      - ask: >
          Back to a fair choice, now among three bots, each with prior $1/3$:
          X always sends "BUY", Y sends one of four signals uniformly, and Z
          sends "BUY" or "SELL" with probability $1/2$ each. The screen shows
          "BUY". What is $\Pr(\text{X} \mid \text{BUY})$?
        expects: "4/7"
        hint: >
          The common prior cancels. Add up the three likelihoods.
        feedback: >
          The likelihoods are $1$, $1/4$ and $1/2$, totalling $7/4$, so
          $\Pr(\text{X} \mid \text{BUY}) = 1/(7/4) = 4/7$. Stopping at the
          score $1/3$ for X, without dividing by the total, gives a number
          that is not a probability.

      - part: The whole message, not the headline
        teach: >
          Two bots again, chosen by a fair coin, and now messages carry a
          size. X always sends "BUY 100". Y picks BUY or SELL with probability
          $1/2$ each, and a size from $100, 200, 300, 400, 500$ uniformly. Your
          screen reads "BUY 100".
      - ask: >
          Suppose you condition only on the bare fact "it is a buy". What is
          $\Pr(\text{X})$ then?
        expects: "2/3"
        feedback: >
          X buys with probability $1$, Y with probability $1/2$:
          $1/(1 + 1/2) = 2/3$.
      - ask: >
          Now condition on the whole message, "BUY 100". What is
          $\Pr(\text{X})$?
        expects: "10/11"
        hint: >
          How likely is Y to produce this exact message, side and size
          together?
        feedback: >
          Y produces "BUY 100" with probability $(1/2)(1/5) = 1/10$, X with
          probability $1$, so $\Pr(\text{X}) = 1/(1 + 1/10) = 10/11$.
      - ask: >
          You have two numbers, $2/3$ and $10/11$. Which is the probability
          that X sent the message?
        choices:
          - text: >
              $2/3$: the question is which bot sent it, and the size has
              nothing to do with buying or selling.
            feedback: >
              The size has nothing to do with the side, but everything to do
              with the bot: X never sends any size but $100$, Y sends it a
              fifth of the time. Dropping it throws away a factor of five.
          - text: >
              $10/11$: it uses everything the screen showed.
            correct: true
            feedback: >
              Conditioning on less than you saw answers a question about a
              coarser screen than the one in front of you.
          - text: >
              $2/3$: conditioning on extra detail is overfitting to noise.
            feedback: >
              There is no fitting here — the protocol is known exactly, and
              the size is a real part of what it emitted. Every detail whose
              likelihood differs across hypotheses is evidence.
        feedback: >
          The bare fact is a summary you made, not the observation you
          received. Condition on what was actually emitted.

      - part: Probabilities, not head counts
        ask: >
          One more change. X still always sends "BUY", but Y now sends BUY
          with probability $0.7$ and splits the remaining $0.3$ among SELL,
          HOLD and WAIT. Fair coin; the screen shows "BUY". What is
          $\Pr(\text{X} \mid \text{BUY})$?
        expects: "10/17"
        hint: >
          Y still has four possible messages. Does that matter, or does
          something else?
        feedback: >
          $1/(1 + 0.7) = 10/17$. Counting Y's four messages would have given
          $4/5$ again; what the weighting needs is the probability Y puts on
          this message, and counting only works when Y's messages are equally
          likely.
      - ask: >
          An interviewer asks how you would approach a puzzle where "several
          explanations fit what we saw". What is the ten-second answer?
        choices:
          - text: >
              "Every explanation that fits gets an equal share."
            feedback: >
              That is the colleague's $50/50$, the fallacy this whole unit is
              built around.
          - text: >
              "Rule out the explanations that cannot produce it, then use the
              prior."
            feedback: >
              Half right: impossible explanations do go to zero. But among the
              survivors the prior must still be multiplied by how likely each
              was to produce the exact observation.
          - text: >
              "Weight each by its prior times the chance it produces exactly
              this observation, then normalise."
            correct: true
            feedback: >
              That sentence is Bayes with the likelihood taken seriously, and
              it is what the interviewer is listening for.
        feedback: >
          The forced explanation keeps its prior whole; the one with options
          is charged for each option it did not use.

  - node: quant-puzzles.prob-paradoxes.monty-hall
    hook: >
      Switching feels like it shouldn't matter once two doors are left, but
      the host's reveal is a forced move exactly when your first pick was
      wrong, and a free choice exactly when it wasn't.
    explanation: >
      Fix the protocol first: the host knows the car's location, must open a
      door you didn't pick, must reveal a goat, and always offers the switch.
      "He opened door $3$" is the report; everything downstream depends on
      those rules and nothing else.

      Score each of the three door-hides-the-car hypotheses by how likely it
      was to produce that specific report. If the car is behind your door,
      the host was free to open either remaining goat door, splitting his
      behavior between two options; if the car is behind the other specific
      unopened door, he had no choice at all — opening door $3$ was forced.
      That asymmetry is why the your-door hypothesis keeps only half its
      prior while the alternative keeps all of it.

      The fast interview version: switching wins exactly when your first pick
      was wrong, an event already fixed at $2/3$ the instant you chose,
      independent of what the host does next. The reveal only tells you which
      door to switch to, not whether switching is worthwhile.
    worked: >
      Four doors, one car; you pick door $1$, the host opens two of the
      remaining three, always revealing goats, and leaves door $2$ closed. If
      your pick is right (prior $1/4$), the host had three equally good doors
      to leave closed, so "leaves door $2$" has likelihood $1/3$; if the car
      is behind door $2$ (prior $1/4$), leaving it closed is forced,
      likelihood $1$; if the car is behind door $3$ or $4$, the host could
      never have left door $2$ closed, likelihood $0$. Posterior
      $\Pr(\text{car behind door } 1) = (1/4)(1/3) / [(1/4)(1/3) + (1/4)(1)]
      = 1/4$, so switching wins with probability $3/4$ — more doors dilute
      the host's freedom further, so switching only gets better.
    interview: >
      Monty Hall itself is rarely the real question; the test is whether you
      can adapt the likelihood argument the moment the interviewer changes a
      clause — more doors, an ignorant host, a biased host — which is why the
      shortcut "switching wins iff your first guess was wrong" is worth
      having cold.
    pitfalls: >
      Treating the host's reveal as adding no information because "he just
      showed a goat" — the point is that his action is non-uniform, not
      random. Recomputing from scratch instead of sanity-checking any
      $n$-door variant against the fast wrong-initial-guess argument.
    recap: >
      The host's forced reveal keeps the wrong-door hypotheses' priors whole
      while halving the right-door hypothesis's likelihood, which is exactly
      what pushes switching to $2/3$ — and higher still with more doors.
    dialogue:
      - part: Two closed doors, three hypotheses
        teach: >
          Three doors, one car, two goats. You pick door $2$. The host knows
          where the car is, must open a door you did not pick, must show a
          goat, and always offers you the switch; when he has a choice he
          tosses a coin. He opens door $1$.
      - ask: >
          Suppose the car is behind your door, door $2$. With what probability
          does the host open door $1$?
        expects: "1/2"
        feedback: >
          Doors $1$ and $3$ both hide goats, so either is allowed, and his coin
          picks door $1$ half the time.
      - ask: >
          Suppose instead the car is behind door $3$. With what probability
          does the host open door $1$?
        expects: "1"
        feedback: >
          He may not open your door $2$, and he may not open door $3$ because
          it hides the car. Door $1$ is the only legal move: probability $1$.
          (If the car were behind door $1$, he would open it with probability
          $0$.)
      - ask: >
          Each door hid the car with prior $1/3$. Given that he opened door
          $1$, what is the probability that the car is behind your door?
        expects: "1/3"
        hint: >
          Multiply each prior by the likelihood you just found, then
          normalise.
        feedback: >
          Door $2$ scores $(1/3)(1/2) = 1/6$, door $3$ scores $(1/3)(1) = 1/3$,
          door $1$ scores $0$. So $\Pr(\text{car at } 2) = (1/6)/(1/6 + 1/3) =
          1/3$, and switching to door $3$ wins $2/3$.
      - ask: >
          A friend objects: "Two closed doors, one car — it is $1/2$ each."
          What is the flaw?
        choices:
          - text: >
              Nothing: once a goat is shown, two doors remain and symmetry
              makes them equal.
            feedback: >
              The two doors are not symmetric. Your door was shielded from
              opening by your choice, whatever was behind it; door $3$ was
              shielded only when the rules forced the host to skip it.
          - text: >
              The friend forgot that the host might have opened the car's
              door.
            feedback: >
              He never may — his rules say he shows a goat. The flaw is not a
              missing possibility but a missing weight.
          - text: >
              The friend scores both survivors as if the host was equally
              likely to open door $1$ under each.
            correct: true
            feedback: >
              Under "car at $2$" door $1$ was a coin flip; under "car at $3$"
              it was forced. A likelihood ratio of $1$ to $2$ against priors
              of $1$ to $1$ gives $1/3$ against $2/3$.
        feedback: >
          The reveal is not random: when you are wrong, the host's hand is
          forced, and a forced move is stronger evidence than a free one.

      - part: A shortcut that skips the algebra
        reflect: >
          Put the likelihoods away. Before the host does anything, which
          single event already decides whether switching will win — and why
          can nothing he then does change its probability?
        answer: >
          "My first pick was wrong." If it was wrong, the host must open the
          other goat door and leave the car closed, so switching wins; if it
          was right, switching loses. That event was settled when you chose,
          at $2/3$, and the host's rules guarantee he can show a goat and
          offer the switch whether you were right or wrong, so his doing so
          cannot move it. His door tells you where to switch, not whether.
      - ask: >
          Five doors, one car. You pick door $4$. The knowing host opens three
          goat doors, leaving door $2$ closed beside yours. What is the
          probability that switching to door $2$ wins?
        expects: "4/5"
        feedback: >
          Switching wins exactly when your first pick was wrong, which has
          probability $4/5$. Once the host leaves just one other door closed,
          that door inherits everything your door did not have.
      - ask: >
          Check it the long way. The host chooses uniformly which goat door
          to leave closed when he has a choice. If the car is behind your door
          $4$, what is the probability that the door he leaves closed is door
          $2$?
        expects: "1/4"
        feedback: >
          All four other doors hide goats, and he leaves one of them closed
          uniformly: $1/4$. If the car is behind door $2$ he must leave it,
          probability $1$. So $\Pr(\text{car at } 4) = (1/5)(1/4) /
          [(1/5)(1/4) + (1/5)(1)] = 1/5$, and switching wins $4/5$.
      - teach: >
          That is Monty Hall: a knowing host who must reveal goats and leave
          one other door closed keeps your door at its prior $1/n$, because
          his freedom under "you were right" spreads his choice over $n - 1$
          doors while "you were wrong" forces it. Switching wins $1 - 1/n$:
          $2/3$ with three doors, $99/100$ with a hundred. The shortcut and the
          likelihood calculation are the same argument, one counted and one
          weighed.

      - part: When the reveal stops meaning anything
        ask: >
          A variant: before you choose anything, the knowing host opens one of
          the three doors, showing a goat. You then pick one of the two closed
          doors, and he offers the switch. What is the probability that
          switching wins?
        expects: "1/2"
        feedback: >
          You picked between two closed doors, one of which holds the car, so
          your pick is right with probability $1/2$, and switching wins
          exactly when it is wrong: $1/2$.
      - ask: >
          Why did the $2/3$ disappear in that variant?
        choices:
          - text: >
              The host no longer knows where the car is.
            feedback: >
              He still knows — he opened a goat door on purpose. Knowledge
              alone does not create the edge.
          - text: >
              The host's move no longer had to avoid your door, so it carries
              no information about your pick.
            correct: true
            feedback: >
              The asymmetry came from his being forced to skip your door and
              the car; reveal before you choose and only the car constrains
              him.
          - text: >
              There are fewer doors in play when you choose.
            feedback: >
              Fewer doors explains why your pick is $1/2$, but the standard
              game also ends with two doors. What changed is the order of the
              moves.
        feedback: >
          The $2/3$ lives in the protocol: your pick first, then a reveal
          constrained by it.
      - ask: >
          The interviewer pushes back: "After the reveal there are just two
          doors. Why isn't it $1/2$?" Which reply settles it fastest?
        choices:
          - text: >
              "Probabilities are fixed when you choose and cannot change
              afterwards."
            feedback: >
              False in general — conditioning changes probabilities all the
              time. Here the host's door does change something: which door the
              $2/3$ sits behind.
          - text: >
              "Switching wins exactly when my first pick was wrong, which is
              $2/3$; if I was wrong, his rules force him to leave the car
              closed."
            correct: true
            feedback: >
              One sentence, no algebra, and it names the protocol it depends
              on. Offer a hundred doors if the interviewer is still unmoved.
          - text: >
              "It is a famous result; simulations confirm it."
            feedback: >
              True and worthless in an interview: it shows you remember the
              answer, not that you know why.
        feedback: >
          Say the shortcut, name the clause it relies on — the host knows and
          must show a goat — and be ready to reprice when that clause changes.

  - node: quant-puzzles.prob-paradoxes.monty-ignorant-host
    hook: >
      Change one clause — the host doesn't know where the car is — and the
      identical visible action carries no information at all; the missing
      $2/3$ didn't vanish, it moved into the rounds this host ruins.
    explanation: >
      Restate the protocol difference: an ignorant host picks uniformly
      between the two doors you didn't choose, and this time it happens to
      reveal a goat rather than the car. A knowing host's reveal is
      informative because it's forced whenever your pick is wrong; an
      ignorant host's reveal, conditional on happening to show a goat, is
      symmetric between "car is under your door" and "car is under the other
      closed door" — likelihood $1/2$ either way — because nothing about a
      goat-revealing action distinguishes the two once you already know he
      didn't reveal the car.

      A third of the time this host's random pick lands on the car and the
      round is void. Those voided rounds are exactly the rounds a knowing
      host would have used to funnel probability onto the closed door;
      remove them and the surviving games split evenly.

      The deeper point: identical visible evidence, different generating
      mechanism, different posterior. Evidence never speaks for itself — it
      has to be interpreted through the rule that produced it, and the same
      "goat revealed" report means something different depending on whether
      the revealer was trying to avoid the car or just got lucky.
    worked: >
      Keep the ignorant host but drop the uniform prior: suppose
      $\Pr(\text{car}@1) = 1/2$, $\Pr(\text{car}@2) = 1/4$,
      $\Pr(\text{car}@3) = 1/4$, you picked door $1$, and the host reveals a
      goat behind door $3$. Because his reveal has likelihood $1/2$ whenever
      it's possible at all — car@$1$: $1/2$; car@$2$: $1/2$; car@$3$: $0$,
      since revealing door $3$ would show the car — the two live likelihoods
      are equal, so the posterior odds between door $1$ and door $2$ exactly
      match their prior odds, $2{:}1$. Switching now wins only $1/3$, not
      $1/2$: with an ignorant host, the reveal carries zero discriminating
      evidence, so an uneven prior survives untouched.
    interview: >
      This variant tests whether you'll transplant the $2/3$ answer on
      reflex or actually redo the likelihood computation once a stated
      hypothesis changes — say explicitly what changed (the host's
      knowledge) and why it removes the asymmetry.
    pitfalls: >
      Quoting "switching still wins $2/3$" for any host who happens to reveal
      a goat, regardless of whether he was constrained to avoid the car.
      Forgetting that this host's action carries no discriminating evidence
      among the surviving hypotheses, so with an uneven prior the posterior
      is just that prior renormalized over survivors, not a fresh $1/2$.
    recap: >
      An ignorant host who happens to avoid the car adds no evidence between
      the two remaining doors — the voided-round accounting is what makes his
      reveal uninformative where the knowing host's identical action was
      worth $2/3$.
    dialogue:
      - part: Six hundred rounds with a host who guesses
        teach: >
          Three doors, one car. You pick door $3$. The regular host is off
          sick, and the stand-in does not know where the car is: he tosses a
          coin and opens door $1$ or door $2$. Tonight he opens door $1$, and
          it shows a goat.
      - ask: >
          Picture $600$ rounds of this game, with the car placed uniformly.
          In about how many of them does the stand-in expose the car?
        expects: "200"
        hint: >
          In how many rounds is the car behind one of the doors he might open?
        feedback: >
          The car is behind door $1$ or $2$ in $400$ rounds, and his coin
          lands on it half the time: $200$ rounds are voided by a revealed
          car.
      - ask: >
          Of the $600$ rounds, in how many does the stand-in open door $1$ and
          show a goat — rounds that look exactly like tonight?
        expects: "200"
        hint: >
          Go through the car's three positions one at a time.
        feedback: >
          Car behind door $3$: $200$ rounds, he opens door $1$ in half, $100$.
          Car behind door $2$: $200$ rounds, he opens door $1$ in half, $100$,
          showing a goat. Car behind door $1$: opening it shows the car, never
          a goat. Total $200$.
      - ask: >
          Given tonight's round, what is the probability that switching to
          door $2$ wins?
        expects: "1/2"
        feedback: >
          Of the $200$ rounds that look like tonight, $100$ have the car
          behind door $2$: $100/200 = 1/2$.
      - ask: >
          A colleague says: "Same doors, same goat as in the classic show —
          switching still wins $2/3$." What is wrong?
        choices:
          - text: >
              Nothing: the host's knowledge does not move the car, so it
              cannot move the answer.
            feedback: >
              It does not move the car; it changes what the reveal tells you.
              Under the stand-in, "car behind door $2$" survives only half its
              rounds — the other half he exposes it.
          - text: >
              The classic host's goat was guaranteed; this one was luck, and
              the luck was equally likely under both live hypotheses.
            correct: true
            feedback: >
              Whether the car is behind door $3$ or door $2$, the stand-in
              opens door $1$ onto a goat with probability $1/2$. Equal
              likelihoods leave equal priors equal.
          - text: >
              It should be $1/3$: a random reveal means you were probably the
              lucky one.
            feedback: >
              Nothing favours your door either. Your door and door $2$ each
              produce tonight's picture in $100$ of the $600$ rounds.
        feedback: >
          The visible event is identical to the classic show's. The protocol
          behind it is not, and the protocol is what you condition through.

      - part: Where the two-thirds came from
        ask: >
          Now run the classic, knowing host for $600$ rounds of the same game:
          you pick door $3$, he must show a goat, coin toss when free. In how
          many rounds does he open door $1$?
        expects: "300"
        feedback: >
          Car behind door $3$: he is free, opens door $1$ in $100$ of $200$.
          Car behind door $2$: he must open door $1$, all $200$. Car behind
          door $1$: never. Total $300$, of which $200$ are switch wins:
          $2/3$.
      - reflect: >
          The knowing host has $300$ rounds that look like tonight, the
          stand-in $200$. Which $100$ rounds are missing from the stand-in's
          count, what happened in them instead, and why does that take the
          answer from $2/3$ to $1/2$?
        answer: >
          They are the rounds with the car behind door $2$ in which the coin
          sends him to door $2$. The knowing host would have been forced to
          door $1$ there, adding $100$ switch wins to the picture; the
          stand-in opens door $2$ and exposes the car, so those rounds are
          voided. The rounds the knowing host funnels onto the closed door
          are exactly the ones the ignorant host throws away, so the
          survivors split $100$ to $100$.
      - teach: >
          In likelihoods: for the stand-in, $\Pr(\text{opens } 1,
          \text{goat} \mid \text{car at } 3) = \Pr(\text{opens } 1,
          \text{goat} \mid \text{car at } 2) = 1/2$, and $0$ for the car at
          door $1$. Equal likelihoods on the two survivors mean the reveal
          only deletes the impossible hypothesis and leaves the others in
          their prior ratio. The host's knowledge is not decoration: it is
          the mechanism that made the reveal evidence.

      - part: Testing the ignorant host
        ask: >
          Four doors, one car, uniform prior. You pick door $1$. A host who
          knows nothing opens two of doors $2$, $3$, $4$, choosing the pair
          uniformly; he opens doors $2$ and $3$, both goats. What is the
          probability that switching to door $4$ wins?
        expects: "1/2"
        hint: >
          Under each hypothesis that survives, how likely is it that he opens
          exactly doors $2$ and $3$?
        feedback: >
          He picks one of three pairs, so under "car at $1$" and "car at $4$"
          the pair $\{2, 3\}$ comes up with probability $1/3$ either way, and
          shows goats. Equal priors, equal likelihoods: $1/2$. A knowing host
          would have made switching worth $3/4$.
      - ask: >
          Back to three doors and your door $3$. A new stand-in, still
          ignorant, has a habit: he opens door $1$ with probability $3/4$ and
          door $2$ with probability $1/4$. He opens door $1$ onto a goat. What
          is switching to door $2$ worth?
        choices:
          - text: >
              $3/4$: he was very likely to open door $1$ anyway, so the car is
              probably elsewhere.
            feedback: >
              His habit is the same whichever door hides the car. Under "car
              at $3$" and "car at $2$" alike, door $1$ opens onto a goat with
              probability $3/4$.
          - text: >
              $1/2$
            correct: true
            feedback: >
              Both live likelihoods are $3/4$, so they cancel. A habit that
              ignores the car cannot carry information about it.
          - text: >
              $1/4$: he favours door $1$, so the reveal is the weak kind of
              evidence.
            feedback: >
              Weak or strong is measured by the ratio of likelihoods across
              hypotheses, and here the ratio is $1$. The reveal favours
              neither door.
        feedback: >
          What made the classic reveal evidence was its dependence on where
          the car was. Remove the knowledge and no habit of the host's can put
          it back.

      - part: Saying which host you assumed
        ask: >
          An interviewer: "The host opened a door and showed a goat. Should
          you switch?" Which answer is strongest?
        choices:
          - text: >
              "Yes, switching wins $2/3$."
            feedback: >
              Only for a host who knew and was obliged to show a goat. Say
              that clause aloud, because the interviewer may be about to
              remove it.
          - text: >
              "It doesn't matter — a goat is a goat."
            feedback: >
              True for the ignorant host, false for the knowing one, and the
              sentence did not say which host this is.
          - text: >
              "If he knew and had to show a goat, switching wins $2/3$; if he
              opened at random and got lucky, $1/2$. Either way switching
              never hurts."
            correct: true
            feedback: >
              Both protocols priced, and a decision that is right under
              either. That is the answer the interviewer is fishing for.
        feedback: >
          Same visible outcome, two protocols, two numbers — and one action
          that is safe under both.

  - node: quant-puzzles.prob-paradoxes.monty-host-bias
    hook: >
      Give the knowing host a habit — he favors one goat door when free to
      choose — and the switch probability moves, but algebra rules out it
      ever moving switching below break-even.
    explanation: >
      Keep the knowing host but add a bias parameter $q$: whenever he's free
      to choose (your door hides the car), he opens door $3$ with probability
      $q$ and door $2$ with probability $1 - q$. This carries the
      full-observation likelihood machinery through an added parameter
      instead of a fixed number.

      Recompute the likelihoods symbolically with you having picked door
      $1$: $\Pr(\text{opens } 3 \mid \text{car}@1) = q$ (his free choice),
      $\Pr(\text{opens } 3 \mid \text{car}@2) = 1$ (forced), and
      $\Pr(\text{opens } 3 \mid \text{car}@3) = 0$. Given door $3$ opens,
      $\Pr(\text{car}@1) = q/(1+q)$, so switching wins $1/(1+q)$; the mirror
      computation for door $2$ opening gives switching wins $1/(2-q)$.

      The point isn't the specific formula, it's the robustness: for every
      $q \in [0,1]$, both $1/(1+q)$ and $1/(2-q)$ are at least $1/2$ — no
      matter how skewed the host's habit, switching never underperforms
      staying. Never assume a hidden bias could flip the recommendation
      without checking the algebra first.
    worked: >
      Take $q = 1/3$, a host who leans toward opening door $2$ when free.
      If he opens door $3$ anyway — his less-favored free choice — that's
      stronger evidence you were wrong: $\Pr(\text{car}@1 \mid \text{opens }
      3) = q/(1+q) = (1/3)/(4/3) = 1/4$, so switching wins $3/4$. If he opens
      door $2$, his default, that's weaker evidence: switching wins
      $1/(2-q) = 1/(2 - 1/3) = 3/5$ — still above $1/2$ either way, and the
      rarer action for this host is the more informative one when it happens.
    interview: >
      Asked "does the host have a tell," compute $q/(1+q)$ or $1/(2-q)$ for
      the door actually opened and note that switching is safe regardless of
      which door opens — a fast, correct answer that shows you're tracking
      the mechanism rather than a memorized number.
    pitfalls: >
      Assuming a biased host could make staying strictly better — the
      algebra rules this out for every $q \in [0,1]$. Attaching the wrong
      formula to the wrong door: the door the host is less inclined to open
      is the stronger evidence when it happens anyway.
    recap: >
      A biased but knowing host shifts the switch probability between $1/2$
      and $1$, never below $1/2$ — switching weakly dominates staying
      regardless of any hidden habit.
    dialogue:
      - part: A host with a favourite door
        teach: >
          The classic game: three doors, one car, a host who knows where it is
          and must open a goat door you did not pick. You pick door $1$. You
          have watched him for weeks: when your door hides the car and he may
          open either door, he opens door $3$ four times in five. Tonight he
          opens door $3$.
      - ask: >
          If the car is behind your door $1$, what is the probability that he
          opens door $3$?
        expects: "4/5"
        feedback: >
          Both other doors hide goats, so he is free, and his habit sends him
          to door $3$ with probability $4/5$.
      - ask: >
          If the car is behind door $2$, what is the probability that he opens
          door $3$?
        expects: "1"
        feedback: >
          He may not open your door or the car's, so door $3$ is forced.
      - ask: >
          Given that he opened door $3$, what is the probability that switching
          to door $2$ wins?
        expects: "5/9"
        hint: >
          Equal priors cancel, so compare the two likelihoods directly.
        feedback: >
          Door $1$ scores $4/5$ and door $2$ scores $1$, so switching wins
          $1/(1 + 4/5) = 5/9$. Your own door is at $4/9$.
      - ask: >
          A neighbour says: "He still knows and still shows a goat, so
          switching wins $2/3$." What is wrong?
        choices:
          - text: >
              Nothing: the host's habit only matters in the third of rounds
              where you picked right, so it cannot move the number.
            feedback: >
              Those rounds are exactly the hypothesis you are weighing. The
              habit sets the likelihood of tonight's reveal under "car at $1$"
              — $4/5$ rather than $1/2$ — and that factor is the whole
              calculation.
          - text: >
              The $2/3$ assumed a coin for his free choice; this host opens
              door $3$ by habit, so door $3$ opening says less about you being
              wrong.
            correct: true
            feedback: >
              Under a coin, door $3$ was twice as likely when you were wrong
              as when you were right. Under this habit it is only $5/4$ as
              likely, so the evidence is weaker.
          - text: >
              Habits are irrelevant; switching should be exactly $1/2$ because
              he is predictable.
            feedback: >
              He would be perfectly uninformative only if he opened door $3$
              every time he was free. At four in five, door $3$ is still
              slightly more likely when you were wrong.
        feedback: >
          The host's reveal is evidence in proportion to how much more likely
          it is under one hypothesis than the other.

      - part: The door he rarely opens
        ask: >
          Another night, same host, you pick door $1$ again, and he opens door
          $2$. What is the probability that switching to door $3$ wins?
        expects: "5/6"
        hint: >
          Under "car at $1$", how likely is he to open door $2$? Under "car at
          $3$"?
        feedback: >
          Under "car at $1$" he opens door $2$ only one time in five; under
          "car at $3$" it is forced. Switching wins $1/(1 + 1/5) = 5/6$.
      - reflect: >
          His habitual door gave the switch $5/9$; his rare door gave it
          $5/6$. Why is the action he seldom takes the stronger evidence?
        answer: >
          Under "you were wrong" his reveal is always forced, likelihood $1$,
          whichever door he opens. Under "you were right" its likelihood is
          his habit's probability for that door. The evidence is the ratio of
          the two: for his habitual door it is $4/5$ to $1$, barely
          different; for his rare door it is $1/5$ to $1$, so the free
          explanation can hardly account for what you saw.
      - teach: >
          In general, with $q$ the probability that the free host opens door
          $3$: given door $3$, $\Pr(\text{car at } 1) = q/(1+q)$ and switching
          wins $1/(1+q)$; given door $2$, switching wins $1/(2-q)$. A coin is
          $q = 1/2$ and gives $2/3$ both ways. Your host is $q = 4/5$:
          $1/(9/5) = 5/9$ and $1/(6/5) = 5/6$.
      - ask: >
          Can any habit $q$ in $[0, 1]$ make staying strictly better than
          switching, on some door?
        choices:
          - text: >
              Yes: at $q = 1$, door $3$ opening favours staying.
            feedback: >
              At $q = 1$ switching wins $1/(1+1) = 1/2$ — a tie, not a loss.
              Door $3$ then carries no information, and you are back to two
              equal doors.
          - text: >
              No: the forced hypothesis has likelihood $1$ and yours at most
              $1$, so the switch is always at least $1/2$.
            correct: true
            feedback: >
              $1/(1+q) \ge 1/2$ and $1/(2-q) \ge 1/2$ for every $q$ between
              $0$ and $1$. A habit can weaken the evidence, never reverse it.
          - text: >
              Yes: a host who strongly prefers door $2$ makes door $2$ favour
              staying.
            feedback: >
              Strongly preferring door $2$ is $q$ near $0$, and then door $2$
              opening gives $1/(2-q)$ near $1/2$ — again a tie at worst, never
              below it.
        feedback: >
          Switching weakly dominates staying for every habit: the robust
          answer when an interviewer starts editing the host.

      - part: Averaging the two nights
        ask: >
          With your $q = 4/5$ host, over all rounds in which you pick door $1$,
          what is the probability that he opens door $3$?
        expects: "3/5"
        feedback: >
          Car at $1$: $(1/3)(4/5) = 4/15$. Car at $2$: $(1/3)(1) = 5/15$. Car
          at $3$: $0$. Total $9/15 = 3/5$, so he opens door $2$ with
          probability $2/5$.
      - ask: >
          Averaged over both kinds of night, what is the probability that
          switching wins?
        expects: "2/3"
        feedback: >
          $(3/5)(5/9) + (2/5)(5/6) = 1/3 + 1/3 = 2/3$. The habit moves the
          $2/3$ between nights without changing it: switching still wins
          exactly when your first pick was wrong.
      - ask: >
          The interviewer adds: "This host has a tell." What do you say?
        choices:
          - text: >
              "Then it depends on the tell, and I'd need $q$ before deciding."
            feedback: >
              You need $q$ to price the switch, not to decide. Every $q$ makes
              switching at least as good as staying.
          - text: >
              "Switch regardless. Given the door, it wins between $1/2$ and
              $1$ — the rare door is the strong signal — and averaged over
              nights it is still $2/3$."
            correct: true
            feedback: >
              Decision, range and the reason, in one breath.
          - text: >
              "Nothing changes: it is still $2/3$."
            feedback: >
              True on average, false on any particular night — and the
              interviewer asked about tonight.
        feedback: >
          A tell reshuffles the evidence between nights; it never makes
          staying the better bet.

  - node: quant-puzzles.prob-paradoxes.bertrand-box
    hook: >
      "It must be the gold-gold box or the mixed box, so $1/2$" throws away
      the fact that the gold-gold box had twice as many chances to produce
      the gold coin you actually saw.
    explanation: >
      Three boxes: gold-gold, gold-silver, silver-silver. Pick a box
      uniformly, then a coin uniformly; it's gold. The full-observation move
      specializes here to counting: the gold-gold box produces "gold" with
      likelihood $1$, the mixed box with likelihood $1/2$, the silver-silver
      box with likelihood $0$ — against equal priors, the gold-gold box earns
      twice the mixed box's posterior weight, giving $2/3$, not $1/2$.

      A faster route to the same number: there are three gold coins in play
      across all boxes, and two of them sit in the gold-gold box, so the
      hidden coin is gold with probability $2/3$ directly — counting coins
      instead of boxes.

      That counting shortcut works because, here, every box holds the same
      number of coins, so drawing "a box uniformly, then a coin uniformly
      within it" is exactly the same as drawing one of the six coins
      uniformly. The correct equally-likely unit is the coin actually drawn,
      not the box category it happens to sit in — whenever a "which category"
      question secretly draws one item uniformly, count items, not
      categories.
    worked: >
      Box $P$ holds $4$ gold coins, box $Q$ holds $1$ gold and $3$ silver,
      box $R$ holds $4$ silver coins — equal-sized boxes again. Pick a box
      uniformly, a coin uniformly, it's gold: is it box $P$? Likelihoods are
      $\Pr(\text{gold} \mid P) = 1$, $\Pr(\text{gold} \mid Q) = 1/4$,
      $\Pr(\text{gold} \mid R) = 0$, giving
      $\Pr(P \mid \text{gold}) = (1/3)/(1/3 + 1/12) = 4/5$. Coin count
      confirms it: $5$ gold coins total among the $12$, $4$ of them in box
      $P$, so $4/5$ directly.
    interview: >
      "A box has two coins of one type, another has one of each, a third has
      the other type — draw a coin, it's gold, what's the other" is asked
      almost verbatim; give the coin count ($2$ of the $3$ gold coins sit in
      the gold-gold box) as the fast answer, with Bayes on box-level priors
      as the fallback once the interviewer perturbs box sizes.
    pitfalls: >
      The $1/2$ reflex, treating "gold-gold or mixed" as two equally likely
      bins. Using the count-the-coins shortcut when boxes hold unequal
      numbers of coins — it only matches the box-level Bayes answer when
      every box contributes the same number of coins to the draw.
    recap: >
      A box with more ways to produce the observed coin earns more posterior
      weight than one with fewer — count qualifying coins directly when box
      sizes match, or fall back to Bayes with box-level likelihoods when they
      don't.
    dialogue:
      - part: A red face on the table
        teach: >
          A hat holds four cards: one red on both sides, two red on one side
          and white on the other, and one white on both sides. You draw a card
          blind and drop it on the table, each side equally likely to land
          face up. The face up is red.
      - ask: >
          How many of the four cards could be the one lying there?
        expects: "3"
        feedback: >
          The red-red card and the two red-white cards. The white-white card
          is ruled out.
      - ask: >
          A friend reasons: "It is one of three cards, and one of them is
          red-red, so the underside is red with probability $1/3$." What is
          wrong?
        choices:
          - text: >
              Nothing: each card was equally likely to be drawn, so each
              candidate is equally likely now.
            feedback: >
              Equally likely to be drawn, yes; equally likely to be lying red
              side up, no. The red-red card shows red however it lands; a
              red-white card shows red only half the time.
          - text: >
              The friend should divide by all four cards: $1/4$.
            feedback: >
              The white-white card cannot be showing red, so it belongs
              nowhere in the denominator. The error is in weighting the three
              candidates, not in counting them.
          - text: >
              The red-red card had two ways to land red side up; each
              red-white card had one.
            correct: true
            feedback: >
              The red face you see is twice as likely to have come from the
              red-red card as from any one red-white card.
        feedback: >
          "Which cards are consistent with red?" is the wrong question. "How
          likely was each card to show this red?" is the right one.
      - reflect: >
          Find a unit to count — not cards — for which "equally likely"
          really holds, so that a plain count gives the answer straight away.
          What is it, and why does it work?
        answer: >
          Faces. Each of the eight faces is equally likely to be the one face
          up — a uniform card, then a uniform side. Seeing red means the face
          up is one of the four red faces, all equally likely, and two of
          those four sit on the red-red card. Counting cards treated a
          one-red-face card the same as a two-red-face card; counting faces
          weights each card by how many ways it could produce what you saw.
      - ask: >
          What is the probability that the underside is red?
        expects: "1/2"
        feedback: >
          Two of the four red faces have red behind them: $2/4 = 1/2$. In
          likelihoods: red-red scores $(1/4)(1) = 1/4$, each red-white
          $(1/4)(1/2) = 1/8$, so red-red has $(1/4)/(1/4 + 1/8 + 1/8) = 1/2$.

      - part: Counting the items, not the boxes
        teach: >
          This is Bertrand's box. When a container is chosen uniformly and
          then an item uniformly within it, a container with more items like
          the one you saw had more ways to produce it, and Bayes weights it
          accordingly: likelihood $1$, $1/2$, $0$ for gold-gold, mixed and
          silver-silver against equal priors. Often you can skip the
          likelihoods and simply count the items that match what you saw, as
          you counted red faces.
      - ask: >
          Three bags of four marbles: bag A has $3$ blue and $1$ green, bag B
          has $1$ blue and $3$ green, bag C has $4$ green. Pick a bag
          uniformly, then a marble uniformly; it is blue. What is
          $\Pr(\text{bag A} \mid \text{blue})$?
        expects: "3/4"
        feedback: >
          Count marbles: $4$ blue marbles in play, $3$ of them in bag A, so
          $3/4$. By likelihoods: $3/4$ against $1/4$ against $0$, equal
          priors, $(3/4)/(3/4 + 1/4) = 3/4$.
      - ask: >
          What made counting marbles legitimate in that bag problem?
        choices:
          - text: >
              Counting the qualifying items always agrees with Bayes.
            feedback: >
              Only when the item is effectively drawn uniformly from all
              items. Give one bag two marbles and another ten, and a marble in
              the small bag is far more likely to be drawn than one in the
              big bag.
          - text: >
              The bags were chosen with equal probability.
            feedback: >
              Necessary but not enough: equally likely bags of unequal sizes
              still make the marbles unequally likely. Equal priors and equal sizes
              together are what make every marble a $1/12$ draw.
          - text: >
              Equal priors on equal-sized bags make every one of the $12$
              marbles equally likely to be the one drawn.
            correct: true
            feedback: >
              Then the posterior on a bag is its share of the blue marbles.
              Break either condition and you go back to priors times
              likelihoods.
        feedback: >
          The shortcut is Bayes in disguise, and it is only valid while the
          disguise holds.

      - part: When the face was chosen for you
        teach: >
          Back to the hat with its four cards. This time a dealer draws the
          card, looks at both sides, and lays it red side up whenever it has a
          red side. The face up is red.
      - ask: >
          Under the dealer's rule, what is the probability that the underside
          is red?
        expects: "1/3"
        hint: >
          How likely is each candidate card to be shown red side up now?
        feedback: >
          The dealer shows red on the red-red card and on each red-white card
          with probability $1$. Equal priors, equal likelihoods:
          $(1/4)/(1/4 + 1/4 + 1/4) = 1/3$.
      - ask: >
          The friend's $1/3$ is now right. Why?
        choices:
          - text: >
              The dealer gives the red-white cards as many ways to show red as
              the red-red card.
            correct: true
            feedback: >
              Every candidate now shows red with certainty, so the likelihoods
              are equal and the posterior is the prior over three cards. The
              face count assumed a random side; this rule removed it.
          - text: >
              The dealer's knowledge makes the cards uniform again.
            feedback: >
              Uniform is the result, not the reason. It holds because the
              three likelihoods happen to be equal under this rule; a dealer
              who showed red only on the red-red card would make the answer
              $1$.
          - text: >
              A dealer showing the card adds information, so the answer must
              move away from $1/2$.
            feedback: >
              It moves, but information is not one-directional. What the
              dealer adds is a different likelihood for each card, and here
              those likelihoods dissolve the red-red card's advantage.
        feedback: >
          The same red face, two protocols, $1/2$ and $1/3$. Bertrand's
          answer assumes the face you see was chosen at random.
      - ask: >
          An interviewer gives the classic version: gold-gold, gold-silver,
          silver-silver, a random coin from a random box is gold. What is the
          fast answer?
        choices:
          - text: >
              "$1/2$ — it is the gold-gold box or the mixed box."
            feedback: >
              The reflex the question exists to catch: two boxes consistent
              with gold, scored as if equally likely to produce it.
          - text: >
              "$2/3$: three gold coins are in play and two of them are in the
              gold-gold box, and the boxes are the same size."
            correct: true
            feedback: >
              The coin count, plus the condition that makes it legal — which
              tells the interviewer you know where it would stop working.
          - text: >
              "$2/3$, because the gold-gold box has twice the prior."
            feedback: >
              The priors are equal. It is the likelihood, $1$ against $1/2$,
              that carries the factor of two.
        feedback: >
          Count the items that could have produced what you saw, as long as
          each item was equally likely to be the one drawn.

  - node: quant-puzzles.prob-paradoxes.boy-girl
    hook: >
      "At least one is a boy" supports both $1/3$ and $1/2$, entirely
      depending on how the report reached you, and the argument about which
      one is "right" is really an argument about two different experiments.
    explanation: >
      Two children, $BB, BG, GB, GG$ equally likely a priori. Two different
      generating protocols for the report "a boy is involved" produce two
      different likelihood patterns and hence two different posteriors — the
      full-observation mechanism applied to a specific story.

      Protocol one, screening: families are filtered for having at least one
      boy, and you're told exactly that fact. $BB, BG, GB$ each pass the
      filter with likelihood $1$; $GG$ with likelihood $0$ — three surviving,
      equally likely cases, so $\Pr(BB) = 1/3$.

      Protocol two, meeting one child at random: the report is generated
      per-child. $BB$ reports "boy" with certainty; $BG$ and $GB$ report
      "boy" only if the randomly met child happens to be the boy, likelihood
      $1/2$ each; $GG$ never reports "boy." Weighting by these likelihoods
      gives $\Pr(BB) = (1/4)/(1/4 + 1/8 + 1/8) = 1/2$.

      The sentence "at least one is a boy" never specifies which of these
      mechanisms produced it — that ambiguity, not sloppy arithmetic, is the
      entire content of the paradox.
    worked: >
      Extend to three children under the screening protocol. Eight equally
      likely sequences run from $BBB$ to $GGG$, and "at least one boy" rules
      out only $GGG$, leaving seven equally likely families, so
      $\Pr(\text{all three boys} \mid \text{at least one boy}) = 1/7$ — far
      below a naive per-flip guess, because screening removes exactly one of
      eight cases and redistributes its mass over all seven survivors, not
      just onto the all-boys case.
    interview: >
      Ask which protocol generated the phrase before computing anything —
      were families with no boys filtered out, or did you meet one child at
      random — and produce both numbers with the mechanism that separates
      them, rather than defending one as the answer.
    pitfalls: >
      Treating "the elder is a boy" and "at least one is a boy" as the same
      information — naming a particular child collapses to the $1/2$
      protocol, an undifferentiated "at least one" collapses to $1/3$ under
      screening. Assuming interview phrasing always means screening; many
      real-world versions ("I have two kids, one of whom is a boy I just
      introduced you to") are the meeting protocol.
    recap: >
      Screening families for having a boy gives $1/3$; meeting one specific
      child who turns out to be a boy gives $1/2$ — the same sentence, two
      different generating protocols, two legitimate answers.
    dialogue:
      - part: A survey and a party
        teach: >
          Picture $400$ families with two children each, every child
          independently a boy or a girl with probability $1/2$. A school
          survey asks each family one question: "Do you have at least one
          boy?" You are handed one of the forms marked yes, chosen at random.
      - ask: >
          About how many of the $400$ families mark yes?
        expects: "300"
        feedback: >
          Only the girl-girl families, about $100$ of the $400$, mark no. The
          other $300$ mark yes.
      - ask: >
          Given that your form is marked yes, what is the probability that the
          family has two boys?
        expects: "1/3"
        feedback: >
          About $100$ of the $300$ yes-families are boy-boy: $1/3$. The
          boy-girl and girl-boy families pass the survey at full weight.
      - teach: >
          A second scene. The same $400$ parents come to an office party, and
          each brings one of their two children, chosen by a coin toss. A
          colleague walks in with a boy.
      - ask: >
          About how many of the $400$ parents arrive with a boy?
        expects: "200"
        hint: >
          Go family type by family type: boy-boy, boy-girl, girl-boy,
          girl-girl, about $100$ of each.
        feedback: >
          All $100$ boy-boy parents, half of the $100$ boy-girl parents and
          half of the $100$ girl-boy parents: $100 + 50 + 50 = 200$.
      - ask: >
          Given that the colleague arrived with a boy, what is the probability
          that the family has two boys?
        expects: "1/2"
        feedback: >
          $100$ of the $200$ parents who arrive with a boy are from boy-boy
          families: $1/2$.
      - ask: >
          In both scenes you learned that the family has at least one boy. Why
          are the answers different?
        choices:
          - text: >
              The party gave you more information: you actually saw the boy.
            feedback: >
              Seeing him adds nothing about his sibling by itself. What
              differs is how often each kind of family produces the report,
              not how vivid the report is.
          - text: >
              At the party, a mixed family produces "a boy walked in" only
              half the time; on the survey it marks yes every time.
            correct: true
            feedback: >
              The survey keeps $1 : 1 : 1$ weights on boy-boy, boy-girl and
              girl-boy; the party keeps $1 : 1/2 : 1/2$. Same families, two
              likelihood patterns.
          - text: >
              One of the two numbers is a mistake; the true answer is $1/3$.
            feedback: >
              Both counts are correct for their own scene. The $200$ party
              arrivals with a boy really are half boy-boy.
        feedback: >
          "At least one is a boy" is true in both scenes. What generated it is
          not the same.

      - part: Why a particular child changes the count
        reflect: >
          The boy at the party is one particular child, picked by a coin. What
          report about a named child gives the same $1/2$ — and why does
          singling out a child by a rule that ignores sex destroy the $1/3$?
        answer: >
          "The elder child is a boy" also gives $1/2$. Once a specific child
          is picked by a rule that does not look at sex, the report is a
          statement about that child alone, and the other child is a fresh
          independent coin. The survey picks no child: it asks a question
          about the pair, so boy-girl and girl-boy both pass at full weight
          against boy-boy, and that pooling is what produces $1/3$.
      - teach: >
          This is the boy–girl paradox. Screening families for a boy has
          likelihoods $1, 1, 1, 0$ on boy-boy, boy-girl, girl-boy, girl-girl
          and gives $1/3$. Meeting a uniformly chosen child who is a boy has
          likelihoods $1, 1/2, 1/2, 0$ and gives $1/2$. Neither is wrong. The
          sentence "at least one is a boy" does not say which experiment was
          run, and the point of the question is whether you ask.

      - part: Other ways to bring a child
        ask: >
          At a second party, each parent brings the elder child with
          probability $3/4$ and the younger with probability $1/4$. A parent
          arrives with a boy. What is the probability that both children are
          boys?
        expects: "1/2"
        hint: >
          Write the likelihood of "arrives with a boy" for each family,
          elder listed first.
        feedback: >
          Boy-boy: $1$. Boy-girl: the elder is the boy, $3/4$. Girl-boy: the
          younger is the boy, $1/4$. Girl-girl: $0$. With equal priors,
          $1/(1 + 3/4 + 1/4) = 1/2$. Any rule for choosing the child that
          ignores sex gives $1/2$, because the two mixed families' weights
          always add to $1$.
      - ask: >
          Which rule for choosing the child would make "a parent arrived with
          a boy" give $1/3$, the survey's answer?
        choices:
          - text: >
              Bring the younger child nine times in ten.
            feedback: >
              The weights become $1$, $1/10$, $9/10$, which still add to $2$
              over the boy-containing families: $1/2$. A lopsided rule that
              ignores sex is still a meeting protocol.
          - text: >
              Bring a boy whenever the family has one.
            correct: true
            feedback: >
              Then every family with a boy produces the report with
              certainty: likelihoods $1, 1, 1, 0$, which is the survey's
              screening in disguise.
          - text: >
              Bring whichever child is home from school that day.
            feedback: >
              If being home has nothing to do with sex, this is a coin by
              another name and gives $1/2$.
        feedback: >
          The number depends on whether the rule that produced the boy could
          see sex. If it could, you are back to screening.
      - ask: >
          At that boy-preferring party, a parent arrives with a girl. What is
          the probability that both children are girls?
        expects: "1"
        feedback: >
          A parent who brings a boy whenever there is one arrives with a girl
          only when there is no boy: girl-girl, certainly. The protocol turned
          a single sighting into complete information.

      - part: Saying it in the room
        ask: >
          An interviewer: "I have two children, and at least one is a boy.
          What is the probability both are boys?" Which answer is strongest?
        choices:
          - text: >
              "$1/3$."
            feedback: >
              The textbook number, but only under screening. If the
              interviewer was describing a son they have in mind, you have
              answered a different question.
          - text: >
              "$1/2$ — the other child is independent."
            feedback: >
              Right only if a particular child was singled out. "At least one"
              names no child, so there is no "other" one unless the protocol
              supplies it.
          - text: >
              "If that is a screened fact about the pair, $1/3$; if you are
              telling me about one particular child, $1/2$. Which did you
              mean?"
            correct: true
            feedback: >
              Both protocols, both prices, and the question that decides
              between them.
        feedback: >
          Neither $1/3$ nor $1/2$ is the answer to the sentence; each is the
          answer to an experiment.

  - node: quant-puzzles.prob-paradoxes.tuesday-boy
    hook: >
      A birth day sounds like an irrelevant detail tacked onto "at least one
      is a boy," but it changes the count, and the direction it moves the
      answer is predictable before you compute anything.
    explanation: >
      Keep the screening protocol fixed and sharpen the report with an
      extra, seemingly irrelevant tag — a birth day, a birth month, any
      independent detail. This tests whether you see that the detail changes
      the count even though it says nothing new about the family's sexes.

      Mechanically it's still full-observation counting over a finer sample
      space: each child is one of several equally likely (sex, tag) pairs;
      count the ordered families containing at least one tagged boy, then
      those among them with two boys, and divide.

      The trend: a rarer tag is a better filter for isolating individual
      boys than for isolating families, since a two-boy family gets two
      independent chances to satisfy a rare tag while a one-boy family gets
      only one. That pushes the ratio up from the bare-tag $1/3$ toward the
      single-child $1/2$ as the tag gets more specific, and back down to
      $1/3$ the moment the tag is dropped.

      This is a preview of a more general fact about conditioning: how
      finely you carve the event you condition on is itself part of the
      answer, not an artifact to be argued away.
    worked: >
      Swap the tag to birth month, $12$ equally likely months instead of $7$
      days. Each child is one of $24$ equally likely (sex, month) pairs, so
      $576$ equally likely ordered families. Families containing a boy born
      in the specified month number $24 + 24 - 1 = 47$; among them, two-boy
      families number $12 + 12 - 1 = 23$, giving $23/47 \approx 0.489$ —
      closer to $1/2$ than the Tuesday-boy's $13/27 \approx 0.481$, exactly
      as expected since a month is a rarer, more specific tag than a day of
      the week.
    interview: >
      The Tuesday-boy question exists to see whether you can extend the
      counting argument to an unfamiliar tag rather than recite a memorized
      $13/27$; state the general shape first — rarer tag, answer creeps
      toward $1/2$ — before grinding the specific count.
    pitfalls: >
      Assuming the extra detail is irrelevant because it "obviously" doesn't
      determine who the children are — it changes the counting because it
      changes how the evidence was generated. Forgetting the "$-1$" when
      counting families that contain the tag, which double-counts the family
      where both boys happen to satisfy it.
    recap: >
      Sharpening a screening tag from "a boy" to "a boy with an increasingly
      specific extra fact" moves the answer continuously from $1/3$ toward
      $1/2$, because a two-boy family gets two independent chances to match a
      rare tag.
    dialogue:
      - part: A boy born before July
        teach: >
          Two-child families. Each child is independently a boy or a girl with
          probability $1/2$, and independently born in the first or the second
          half of the year with probability $1/2$. A screener tells you only
          that this family has at least one boy born in the first half of the
          year.
      - ask: >
          Each child is one of four equally likely (sex, half-year) types. How
          many equally likely ordered families — elder's type, then younger's
          — are there?
        expects: "16"
        feedback: >
          $4 \times 4 = 16$ ordered pairs of types.
      - ask: >
          How many of the $16$ contain at least one boy born in the first
          half?
        expects: "7"
        hint: >
          Count families where the elder is such a boy, then where the younger
          is, and do not count the overlap twice.
        feedback: >
          Elder a first-half boy: $4$ families. Younger a first-half boy: $4$.
          Both: $1$. So $4 + 4 - 1 = 7$.
      - ask: >
          Of those $7$, how many are two-boy families?
        expects: "3"
        feedback: >
          Elder a first-half boy and younger a boy of either half: $2$.
          Younger a first-half boy and elder a boy of either half: $2$. Both
          first-half boys is in both lists: $2 + 2 - 1 = 3$.
      - ask: >
          What is the probability that both children are boys, given the
          report?
        expects: "3/7"
        feedback: >
          $3/7 \approx 0.43$ — above the $1/3$ of a plain "at least one boy",
          below the $1/2$ of a named child.
      - ask: >
          A colleague objects: "Birth half has nothing to do with sex, so
          adding it cannot move the answer off $1/3$." What is wrong?
        choices:
          - text: >
              Nothing: $3/7$ must come from a counting error.
            feedback: >
              The seven families can be listed and the three two-boy ones
              checked by hand. The count is right; the objection is what
              fails.
          - text: >
              A two-boy family has two chances to contain a first-half boy; a
              mixed family has only one.
            correct: true
            feedback: >
              The tag is independent of sex child by child, but the report is
              about the family, and a family with more boys meets it more
              easily.
          - text: >
              The tag identifies which child is the boy, so the answer should
              be exactly $1/2$.
            feedback: >
              It only half-identifies him: in the two-boy family where both
              were born in the first half, the report still does not say which
              boy it means. That leftover ambiguity is why the answer stops
              short of $1/2$.
        feedback: >
          Independent of sex, yes; irrelevant to the count, no.

      - part: Two chances at the tag
        reflect: >
          Do it without the $16$ families. With what probability does a
          two-boy family satisfy the report, and with what probability does a
          boy-girl family? Use that to say why a rarer tag pushes the answer
          toward $1/2$.
        answer: >
          A two-boy family satisfies it unless both boys were born in the
          second half: $1 - (1/2)^{2} = 3/4$. A mixed family needs its one boy
          in the first half: $1/2$. Weights $3/4 : 1/2 : 1/2$ give
          $3/(3 + 2 + 2) = 3/7$. For a tag of probability $t$ the two-boy
          family scores $1 - (1-t)^{2} \approx 2t$ when $t$ is small, the
          mixed ones $t$ each, so the weights tend to $2 : 1 : 1$ — the
          meeting protocol's $1/2$. At $t = 1$ they are $1 : 1 : 1$, and you
          are back to $1/3$.
      - teach: >
          This is the Tuesday-boy variant. Under screening, a report "at least
          one boy with tag $T$", where $T$ is independent of sex and has
          probability $t$ per child, scores the two-boy family
          $1 - (1-t)^{2}$ and each mixed family $t$. The answer runs from
          $1/3$ at $t = 1$ toward $1/2$ as $t \to 0$; a weekday tag,
          $t = 1/7$, lands at $13/27$.
      - ask: >
          Four equally likely seasons. You are told, by screening, that a
          family has at least one boy born in winter. What is the probability
          that both children are boys?
        expects: "7/15"
        hint: >
          Either count the $64$ ordered families, or score the families with
          $t = 1/4$.
        feedback: >
          Counting: $8 + 8 - 1 = 15$ families contain a winter boy, and
          $4 + 4 - 1 = 7$ of them have two boys, so $7/15$. Scoring:
          $1 - (3/4)^{2} = 7/16$ against $1/4$ and $1/4$, so
          $(7/16)/(7/16 + 8/16) = 7/15 \approx 0.467$.
      - ask: >
          The tag is "born on 3 March", one day in $365$. Roughly where does
          the screening answer land?
        choices:
          - text: >
              Near $1/3$: a single day is so specific it barely matters.
            feedback: >
              Backwards. A rare tag is nearly impossible for a family to meet
              twice, so it almost always points at one particular boy — and
              that pushes the answer toward $1/2$, not $1/3$.
          - text: >
              Just under $1/2$.
            correct: true
            feedback: >
              The weights are about $2t : t : t$, so the answer is a hair
              below $1/2$ — exactly, $(2 - t)/(4 - t)$ with $t = 1/365$, about
              $0.4997$.
          - text: >
              Exactly $1/2$.
            feedback: >
              Close, never equal: the two-boy family where both share the
              birthday keeps it a fraction short. Only a tag of probability
              $0$ reaches $1/2$.
        feedback: >
          The rarer the tag, the closer it comes to naming one child, and a
          named child gives $1/2$.

      - part: When the tag does nothing
        ask: >
          Change the protocol. A parent brings one of the two children to
          work, chosen by coin toss, and the child is a boy born in the first
          half of the year. What is the probability that both children are
          boys?
        expects: "1/2"
        hint: >
          For each family, how likely is the chosen child to be a first-half
          boy?
        feedback: >
          Two-boy: $1/2$, since the chosen boy must be first-half. Each mixed
          family: $(1/2)(1/2) = 1/4$. Girl-girl: $0$. So
          $(1/2)/(1/2 + 1/4 + 1/4) = 1/2$ — the tag changed nothing.
      - ask: >
          Why does the birth-half tag move the screening answer but not the
          coin-toss answer?
        choices:
          - text: >
              Under the coin toss the tag describes the chosen child only, so
              it multiplies every family's likelihood by the same $1/2$ and
              cancels.
            correct: true
            feedback: >
              A common factor drops out when you normalise. Under screening
              the tag can be met by either boy, so the two-boy family's factor
              is larger than the mixed ones'.
          - text: >
              The coin toss makes the tag irrelevant because you saw the
              child yourself.
            feedback: >
              Seeing is not the mechanism. The report under the coin toss
              singles out one child, and a tag on that child has the same
              chance $t$ whatever the sibling is.
          - text: >
              Tags only matter when they are rare, and $1/2$ is not rare.
            feedback: >
              Under screening a tag of $1/2$ moved the answer from $1/3$ to
              $3/7$. Rarity sets how far the answer moves, not whether.
        feedback: >
          A detail moves a conditional probability exactly when its
          likelihood differs across the hypotheses.
      - ask: >
          An interviewer asks the Tuesday-boy question cold. Which opening is
          strongest?
        choices:
          - text: >
              "$1/3$ — Tuesday is irrelevant to sex."
            feedback: >
              The colleague's objection, and the trap the question is built
              to spring.
          - text: >
              "Assuming the family was screened for a Tuesday boy, the answer
              sits between $1/3$ and $1/2$, near $1/2$ because the tag is
              rare: $13/27$."
            correct: true
            feedback: >
              Protocol, direction, then the number — and you can derive it
              live by scoring $1 - (6/7)^{2} = 13/49$ against $7/49$ for each
              mixed family.
          - text: >
              "$1/2$ — the Tuesday tag identifies the boy."
            feedback: >
              It nearly does, not quite; the two-Tuesday-boy family keeps it
              below $1/2$. And under a coin-toss meeting the answer would be
              $1/2$ for a different reason.
        feedback: >
          State the protocol, predict the direction from "two chances at the
          tag", then count.

  - node: quant-puzzles.prob-paradoxes.conditioning-fineness
    hook: >
      $1/3 \to 13/27 \to 1/2$ looks like three attempts at one true number;
      it's three different questions, and the discipline is naming which one
      you're answering.
    explanation: >
      Read the ladder as three legitimate answers to three different
      conditioning events, not competing estimates of a single quantity.
      Refining the event you condition on moves the answer precisely because
      the refinement correlates with what you're asking about — an
      irrelevant-looking detail is never actually irrelevant to the count.

      The general rule: refining an event $B$ into a smaller $B'$ moves
      $\Pr(A \mid B')$ away from $\Pr(A \mid B)$ whenever the refinement
      isn't independent of $A$, and the direction of the move is set by
      whether the extra detail is easier for the $A$-cases or the
      not-$A$-cases to satisfy — here, easier for two-boy families, hence
      upward.

      The working discipline: never quote a conditional probability without
      naming the exact event behind it. Two people can both be right while
      disagreeing, because they conditioned on different, legitimately
      nested events, and neither number is an approximation of the other.

      Run the refinement in reverse — pool strata that were kept separate
      instead of splitting them further — and the same mechanism can flip a
      comparison outright rather than merely shift a number by degrees; that
      coarse-end failure is the shape of the paradox waiting later in this
      unit.
    interview: >
      "Does refining a condition always move the probability the same
      direction, or can it reverse things" tests whether you see
      conditioning-fineness as a continuum with real structure; the strong
      answer names the direction rule — does the extra detail favor the
      group you're asking about — rather than reciting the boy–girl numbers.
    pitfalls: >
      Treating $1/3, 13/27, 1/2$ as if one must be the "real" answer and the
      others approximations or mistakes. Assuming refinement always pushes
      the answer toward one fixed bound; the direction depends entirely on
      which group the extra detail is easier to satisfy for, and it can push
      either way.
    recap: >
      A conditional probability answers exactly the event you conditioned
      on; refining or pooling that event is a real change of question, and it
      can move the number in either direction or even reverse a comparison
      outright.
    dialogue:
      - part: Three reports about two trades
        teach: >
          A desk runs two independent trades. Each ends in one of four equally
          likely ways: big win, small win, small loss, big loss — so $16$
          equally likely ordered pairs. You want the probability that both
          trades won. Three screeners each look at the pair and pass on
          different reports.
      - ask: >
          Screener one reports "at least one trade won". What is
          $\Pr(\text{both won} \mid \text{report})$?
        expects: "1/3"
        feedback: >
          No trade wins in $2 \times 2 = 4$ pairs, so $12$ pairs have a win;
          $2 \times 2 = 4$ have two. $4/12 = 1/3$.
      - ask: >
          Screener two reports something sharper: "at least one trade was a
          big win". Before counting, which way does the answer move from
          $1/3$?
        choices:
          - text: >
              It stays at $1/3$: "big" is a detail about size, not about
              whether the trades won.
            feedback: >
              The Tuesday-boy said the same thing about birthdays and moved
              the answer. A pair with two wins has two chances to contain a
              big win; a pair with one win has one.
          - text: >
              Up.
            correct: true
            feedback: >
              The extra detail is easier for two-win pairs to supply, so it
              tilts the posterior toward them.
          - text: >
              Down: a sharper report is a smaller event, so the probability
              falls.
            feedback: >
              The report's own probability falls, but the answer is a ratio.
              What matters is which pairs the cut removes in greater
              proportion.
        feedback: >
          Now check the prediction.
      - ask: >
          Given "at least one big win", what is the probability that both
          trades won?
        expects: "3/7"
        hint: >
          Count pairs with a big win, then the two-win pairs among them.
        feedback: >
          $4 + 4 - 1 = 7$ pairs contain a big win. Two-win pairs among them:
          big-big, big-small, small-big, so $3/7 \approx 0.43$, up from
          $1/3$.
      - ask: >
          Screener three reports "at least one trade won, and the two trades
          ended differently". What is the probability that both won?
        expects: "1/5"
        hint: >
          Start from screener one's $12$ pairs and remove the ones where both
          trades ended the same way.
        feedback: >
          Of the $12$ pairs with a win, big-big and small-small ended the
          same way, leaving $10$. Two-win pairs among them: big-small and
          small-big. $2/10 = 1/5$ — down from $1/3$.

      - part: Which way a detail pushes
        reflect: >
          Screeners two and three both sharpened screener one's report, and
          moved the answer in opposite directions. What decides the
          direction?
        answer: >
          Which group finds the extra detail easier to satisfy. Among
          two-win pairs, $3$ of $4$ contain a big win; among one-win pairs,
          only $4$ of $8$ — so "big win" favours two wins and the answer
          rises. Among two-win pairs, $2$ of $4$ ended differently; among
          one-win pairs, all $8$ did — so "ended differently" favours one win
          and the answer falls. The detail is evidence in proportion to that
          ratio.
      - teach: >
          How finely you condition is part of the answer. Refining $B$ to a
          smaller $B'$ moves $\Pr(A \mid B')$ away from $\Pr(A \mid B)$
          whenever the refinement is not independent of the target, and it
          can move either way — toward whichever side meets the extra detail
          more readily. $1/3$, $3/7$ and $1/5$ are three correct answers to
          three questions. The boy–girl ladder $1/3 \to 13/27 \to 1/2$ is the
          same thing. Quote the event with the number.
      - ask: >
          Screener four reports "at least one trade won, and this morning's
          office coin toss came up heads", the toss being independent of both
          trades. What happens to the $1/3$?
        choices:
          - text: >
              It rises, as with the big win: more detail, more information.
            feedback: >
              The toss is met with probability $1/2$ by every pair alike, so
              it cuts every group by the same factor and the ratio survives.
          - text: >
              It stays at $1/3$.
            correct: true
            feedback: >
              A detail that every hypothesis meets equally often is no
              evidence. This refinement is real but empty.
          - text: >
              It falls: the report now holds less often.
            feedback: >
              It holds half as often for every pair, so numerator and
              denominator both halve.
        feedback: >
          Independence from everything in sight is what makes a detail inert.
      - ask: >
          Screener five reports "at least one trade won and was booked before
          noon", where each trade is booked before noon with probability
          $1/2$, independently of how it ends. What is the probability that
          both won?
        expects: "3/7"
        hint: >
          Score each group by how likely it is to contain a winning trade
          booked before noon.
        feedback: >
          Two-win pairs (prior $1/4$) meet it with probability
          $1 - (1/2)^{2} = 3/4$; one-win pairs (prior $1/2$) with $1/2$. So
          $(3/16)/(3/16 + 4/16) = 3/7$. The booking time is independent of
          each trade's outcome, and still moves the answer: a tag attached to
          a winning trade is easier to find in a pair with two of them.
      - ask: >
          Which test tells you, before computing, whether a detail can move a
          conditional probability?
        choices:
          - text: >
              Whether the detail is independent of each trade's outcome.
            feedback: >
              The booking time was independent of each outcome and moved the
              answer from $1/3$ to $3/7$. Independence trade by trade is not
              the test.
          - text: >
              Whether the detail is meant to be relevant to the question.
            feedback: >
              Relevance by intention decides nothing. "Ended differently"
              sounds harmless and dropped the answer to $1/5$.
          - text: >
              Whether the hypotheses you compare meet the detail with
              different probabilities, given what you already knew.
            correct: true
            feedback: >
              That ratio is the detail's likelihood ratio. When it is $1$, as
              for the coin toss, nothing moves.
        feedback: >
          A detail is inert only if every hypothesis produces it equally
          readily.

      - part: The same mechanism, run in reverse
        ask: >
          Two analysts quote, for the same day, $\Pr(\text{both won}) = 1/3$
          and $\Pr(\text{both won}) = 3/7$. What is the right response?
        choices:
          - text: >
              One of them has made an arithmetic slip.
            feedback: >
              Both numbers above were computed correctly from the same $16$
              pairs. The disagreement is not arithmetic.
          - text: >
              Take the finer one, $3/7$: more information is always better.
            feedback: >
              Finer is right only if that is what you were actually told.
              Condition on a detail you never observed and you answer someone
              else's question.
          - text: >
              Ask each what event they conditioned on; both can be right.
            correct: true
            feedback: >
              A conditional probability is only as well defined as the event
              behind it. Neither number approximates the other.
        feedback: >
          Splitting an event moves a number. Pooling events that were kept
          apart moves it too — and when two groups are pooled with different
          mixes, a comparison between them can reverse outright. That
          coarse-end failure has a name of its own.

  - node: quant-puzzles.prob-paradoxes.airplane-seat
    hook: >
      A hundred-passenger recursion sounds unavoidable, but almost every
      seat's occupant is already decided before the process starts — only
      two seats are ever actually in doubt.
    explanation: >
      A hundred passengers board in order; the first, having lost their
      pass, sits uniformly at random, and every later passenger takes their
      own seat if free, otherwise a uniformly random free seat. Conditioning
      on the first passenger's seat directly produces a recursive mess; the
      elegant fix notices that only two seats are ever contested.

      Every random choice in the process is made by someone already
      displaced from their own seat, and every one of those choices happens
      strictly before either seat $1$ or seat $100$ has been taken — taking
      either of those two seats always ends the chain of displacement
      immediately, seat $1$ by luck and seat $100$ by forcing the last
      passenger's outcome. The first random choice that lands on seat $1$ or
      seat $100$ decides the whole process, and a uniformly random chooser
      has no reason to prefer one over the other, so each is equally likely
      to go first.

      First-step conditioning confirms this without leaning on symmetry as a
      leap of faith: writing $p_n$ for the chance the last passenger gets
      their own seat, conditioning on where passenger one sits gives the
      recurrence $p_n = 1/n + (1/n)\sum_{k=2}^{n-1} p_{n-k+1}$ with
      $p_2 = 1/2$, and it returns $1/2$ for every $n$ — the recursion does
      algebraically what the symmetry argument gives by inspection.

      The general lesson: when a chain of contingent random choices really
      only has a small set of decisive branch points, find that reduced set
      before grinding a full recursion.
    worked: >
      Feed the recursion small values directly. $p_2 = 1/2$ is the base
      case. $p_3 = 1/3 + (1/3)p_2 = 1/3 + 1/6 = 1/2$. $p_4 = 1/4 +
      (1/4)(p_3 + p_2) = 1/4 + (1/4)(1) = 1/2$. The recursion returns exactly
      $1/2$ at every step, confirming algebraically what the two-fixed-points
      symmetry argument gives by inspection — the answer never depends on
      how many passengers sit in between.
    interview: >
      The airplane seat problem tests whether you look for the reduced
      structure — only seat $1$ and seat $100$ ever decide the outcome —
      instead of trying to brute-force a hundred-term recursion live; naming
      the two special seats and the symmetry argument in under a minute is
      the strong answer, recursion as the fallback if pressed to prove it.
    pitfalls: >
      Trying to track every passenger's seat choice instead of noticing only
      two seats are ever contested. Assuming the answer depends on the
      passenger count $n$; it's exactly $1/2$ for every $n \ge 2$, which is
      worth stating as the punchline before any derivation.
    recap: >
      The chain of displaced passengers ends the instant someone takes seat
      $1$ or seat $100$, and symmetry makes each equally likely to go first,
      so the last passenger gets their own seat with probability $1/2$
      regardless of how many passengers there are.
    dialogue:
      - part: Five seats, one lost pass
        teach: >
          A small plane has $5$ seats, and passengers $1$ to $5$ board in that
          order. Passenger $1$ has lost his pass and sits in a uniformly random
          seat. Everyone after him takes their own seat if it is free, and
          otherwise a uniformly random free seat. You are passenger $5$.
      - ask: >
          With what probability does passenger $1$'s choice settle your fate
          on the spot, one way or the other?
        expects: "2/5"
        feedback: >
          Seat $1$ (probability $1/5$): nobody is ever displaced and you get
          seat $5$. Seat $5$ (probability $1/5$): you have lost. Total $2/5$.
          On seats $2$, $3$ or $4$ someone else gets displaced and the story
          continues.
      - ask: >
          Suppose passenger $1$ sits in seat $3$. Passenger $2$ takes seat
          $2$; passenger $3$ finds his seat taken. What is the probability
          that you end up in seat $5$?
        expects: "1/2"
        hint: >
          Passenger $3$ chooses uniformly among seats $1$, $4$ and $5$. Take
          each in turn.
        feedback: >
          Seat $1$: everyone else is seated correctly, you win. Seat $5$: you
          lose. Seat $4$: passenger $4$ is displaced and picks seat $1$ or
          $5$, a coin flip. Total $1/3 + (1/3)(1/2) = 1/2$.
      - ask: >
          Suppose instead passenger $1$ sits in seat $2$. What is the
          probability that you end up in seat $5$?
        expects: "1/2"
        hint: >
          Passenger $2$ picks among seats $1, 3, 4, 5$. Two of those branches
          you have essentially solved already.
        feedback: >
          Seat $1$: win. Seat $5$: lose. Seat $3$: passenger $3$ chooses among
          $1, 4, 5$, which you just found is worth $1/2$. Seat $4$: passenger
          $4$ chooses between $1$ and $5$, worth $1/2$. Total
          $(1/4)(1 + 0 + 1/2 + 1/2) = 1/2$.
      - ask: >
          Every branch you finish comes out at $1/2$, and grinding branches
          for a hundred passengers is hopeless. What did every finished branch
          have in common?
        choices:
          - text: >
              Each displaced passenger faced the same number of free seats.
            feedback: >
              Passenger $2$ faced four free seats, passenger $3$ three,
              passenger $4$ two. The counts differ; something else is
              constant.
          - text: >
              Each branch ended the moment somebody sat in seat $1$ or seat
              $5$.
            correct: true
            feedback: >
              Seat $1$ ends the chain happily — every later passenger finds
              their own seat. Seat $5$ ends it unhappily. Every other seat
              just passes the displacement on.
          - text: >
              Nothing structural: the answer depends on the passenger count,
              and five happens to give $1/2$.
            feedback: >
              The sub-branches had three and two choosers left and still gave
              $1/2$. A coincidence that survives every branch is not a
              coincidence.
        feedback: >
          Two seats decide everything. The rest of the plane is bookkeeping.

      - part: Only two seats matter
        reflect: >
          Every random choice is made by passenger $1$ or by a displaced
          passenger, uniformly among the free seats. Which two seats are
          always among those free seats while the outcome is still open — and
          why does that settle the answer without any recursion?
        answer: >
          Seat $1$ and seat $5$. While both are free the outcome is open; the
          moment either is taken it is decided — seat $1$ for you, seat $5$
          against. Every random chooser, while the outcome is open, picks
          uniformly among free seats that include both, so is exactly as
          likely to take one as the other. Whichever of the two goes first
          goes first with probability $1/2$ each, and that decides it.
      - teach: >
          This is the airplane seat problem, and the answer is $1/2$ for any
          number of passengers: the process ends the first time someone takes
          seat $1$ or seat $n$, every random chooser before then sees both
          free and treats them alike, and you win exactly when seat $1$ goes
          first. Conditioning on passenger $1$'s seat gives a first-step
          recursion that confirms it.
      - ask: >
          The load-bearing step of that recursion: if passenger $1$ sits in
          seat $3$ of $5$, the rest is a smaller copy of the same problem,
          with passenger $3$ as the lost passenger and seat $1$ standing in
          for his own seat. How many seats are in that smaller copy?
        expects: "3"
        feedback: >
          Seats $1$, $4$ and $5$ are free when passenger $3$ boards, and the
          rule from there is exactly the original one on $3$ seats. So the
          seat-$3$ branch is worth $p_3$, and in general sitting in seat $k$
          leaves a copy with $n - k + 1$ seats.

      - part: What the half rests on
        ask: >
          Now passengers $2$ to $5$ board in a shuffled order instead of by
          seat number; passenger $1$ still boards first. What is the
          probability that whoever boards last gets their own seat?
        choices:
          - text: >
              It depends on the order, so it cannot be said in general.
            feedback: >
              Run the argument: the chain still ends the moment seat $1$ or
              the last boarder's seat is taken, and every random chooser still
              sees both free. The order never enters.
          - text: >
              $1/2$
            correct: true
            feedback: >
              Nothing in the two-seat argument used seat numbers or boarding
              order — only that the two decisive seats are free and treated
              alike until one is taken.
          - text: >
              $1/5$, since the last boarder is effectively a random passenger.
            feedback: >
              Being random does not make him unlucky. The two seats that
              decide his fate are still contested symmetrically.
        feedback: >
          The $1/2$ survives any change that leaves the two decisive seats
          symmetric.
      - ask: >
          Which change would break the $1/2$?
        choices:
          - text: >
              Doubling the number of seats and passengers.
            feedback: >
              The count never entered the argument; the answer stays $1/2$.
          - text: >
              A displaced passenger who sees seat $1$ free is twice as likely
              to choose it as any other free seat.
            correct: true
            feedback: >
              Now seat $1$ beats seat $n$ to it more often than not, and you
              win with probability above $1/2$. Uniformity among the free
              seats was the symmetry.
          - text: >
              Passenger $1$ choosing his seat by rolling a fair die and
              rerolling a $6$.
            feedback: >
              On a $5$-seat plane that is a uniform choice among $5$ seats,
              the original rule.
        feedback: >
          The answer is a symmetry, and anything that treats seat $1$ and seat
          $n$ differently moves it.
      - ask: >
          Price that change on a $3$-seat plane: passenger $1$ sits uniformly,
          and a displaced passenger who sees seat $1$ free picks it with twice
          the weight of any other free seat. What is the probability that
          passenger $3$ gets seat $3$?
        expects: "5/9"
        hint: >
          Only one branch involves a displaced passenger. Who, and what are
          his options?
        feedback: >
          Seat $1$: win, $1/3$. Seat $3$: lose. Seat $2$: passenger $2$ picks
          between seats $1$ and $3$ with weights $2 : 1$, so wins $2/3$ of the
          time. Total $1/3 + (1/3)(2/3) = 5/9$.
      - ask: >
          An interviewer poses the hundred-passenger version. What is the
          strongest first sentence?
        choices:
          - text: >
              "Let $p_n$ be the probability for $n$ passengers; condition on
              where passenger $1$ sits."
            feedback: >
              Correct but slow, and you will be solving a recursion live. Keep
              it as the check, not the opening.
          - text: >
              "$1/2$: the outcome is decided by whichever of seat $1$ and seat
              $100$ is taken first, and every random chooser treats them
              alike."
            correct: true
            feedback: >
              The punchline and its reason in one breath. Offer the recursion
              if pressed.
          - text: >
              "$1/100$, since the last passenger gets whatever seat is left."
            feedback: >
              The seat left over is not uniform over all $100$: it is always
              seat $1$ or seat $100$.
        feedback: >
          Name the two seats, state the symmetry, then the number.

  - node: quant-puzzles.prob-paradoxes.airplane-seat-general
    hook: >
      The risk of losing your seat isn't spread evenly across a hundred
      passengers — it's concentrated almost entirely on the last few, and the
      exact formula says by how much.
    explanation: >
      Extend from "does the last passenger get their seat" to "does
      passenger $k$." Whenever a displaced passenger $j$ chooses, the
      surviving free seats are always seat $1$ together with seats
      $j+1, \dots, n$ — never any seat between $2$ and $j$, since those were
      already claimed by their rightful owners while free. So throughout the
      process up to when passenger $k$ boards, seat $1$ and seats
      $k, \dots, n$ are all still live — $n - k + 2$ seats, symmetric among
      themselves for the same reason as before.

      Passenger $k$ loses their seat exactly when the chain's first decisive
      draw among those $n-k+2$ special seats lands on seat $k$ itself, which
      by the same symmetry happens with probability $1/(n-k+2)$; so passenger
      $k$ succeeds with probability $1 - 1/(n-k+2)$.

      Sanity-check the extremes: $k = n$ recovers $1 - 1/2 = 1/2$; $k = 2$,
      the very first displaced passenger, succeeds with probability
      $1 - 1/n$, near-certain for large $n$, since almost the whole plane's
      worth of special seats is still competing to bump them this early.
    worked: >
      With $n = 10$ passengers: passenger $2$ keeps their seat with
      probability $1 - 1/10 = 9/10$; passenger $5$ with probability
      $1 - 1/7 = 6/7 \approx 0.857$; passenger $9$ with probability
      $1 - 1/3 = 2/3$; and passenger $10$, as before, exactly $1/2$ — the
      risk climbs steadily rather than jumping only at the very end.
    interview: >
      A natural follow-up to the base problem is "what about passenger
      fifty" — answer with $1 - 1/(n-k+2)$ directly rather than re-deriving a
      fresh recursion, and cite the two sanity checks (near-certain early,
      exactly $1/2$ at the end) to show the formula is right without
      re-deriving it live.
    pitfalls: >
      Assuming risk is spread uniformly across all $n$ passengers; it is
      heavily concentrated in the back. Misindexing the pool size as
      $n - k + 1$ instead of $n - k + 2$ — the pool always includes seat $1$
      in addition to seats $k$ through $n$, one more than their raw count.
    recap: >
      Passenger $k$ keeps their own seat with probability $1 - 1/(n-k+2)$:
      early boarders are almost always safe, and the $1/2$ of the original
      puzzle is a special case reserved for the very last one.
    dialogue:
      - part: The passengers before the last
        teach: >
          The same $5$-seat plane and the same rule: passenger $1$ sits
          uniformly at random, and everyone after takes their own seat if it
          is free, otherwise a uniformly random free seat. This time you are
          not passenger $5$. You want to know how every passenger from $2$ to
          $5$ fares.
      - ask: >
          Passenger $5$ keeps his seat with probability $1/2$. Before
          computing anything: is passenger $4$'s chance of keeping his seat
          above, equal to, or below $1/2$?
        choices:
          - text: >
              Equal: the symmetry argument gives $1/2$ to anyone who is
              displaced.
            feedback: >
              The symmetry was between seat $1$ and seat $5$, the two seats
              that decide the last passenger. Passenger $4$'s fate is decided
              by a different set of seats, and it has more members.
          - text: >
              Above.
            correct: true
            feedback: >
              The later you board, the longer the chain has had to reach you;
              passenger $4$ boards before the last passenger and is at
              strictly less risk.
          - text: >
              Below: passenger $5$ has the final say, so passenger $4$ is
              more exposed.
            feedback: >
              Passenger $5$ has no say at all — he gets whatever is left. Risk
              accumulates with boarding order, so the earlier passenger is
              safer.
        feedback: >
          Now measure it, starting at the front.
      - ask: >
          What is the probability that passenger $2$ loses his seat?
        expects: "1/5"
        feedback: >
          Only passenger $1$ can have taken seat $2$ by the time passenger $2$
          boards, and he does so with probability $1/5$.
      - ask: >
          What is the probability that passenger $3$ loses his seat?
        expects: "1/4"
        hint: >
          Either passenger $1$ took seat $3$, or passenger $1$ took seat $2$
          and the displaced passenger $2$ then took seat $3$.
        feedback: >
          $1/5$ directly, plus $(1/5)(1/4)$ through passenger $2$, who picks
          among seats $1, 3, 4, 5$. Total $1/5 + 1/20 = 1/4$.
      - ask: >
          What is the probability that passenger $4$ loses his seat?
        expects: "1/3"
        hint: >
          Split on passenger $1$'s seat: $4$, $3$ or $2$. Each of the last
          two leaves a displaced passenger choosing among a short list.
        feedback: >
          Seat $4$: $1/5$. Seat $3$: passenger $3$ picks among $1, 4, 5$, so
          $(1/5)(1/3) = 1/15$. Seat $2$: passenger $2$ picks seat $4$ with
          $1/4$, or seat $3$ with $1/4$ and then passenger $3$ picks seat $4$
          with $1/3$; that is $(1/5)(1/4 + 1/12) = 1/15$. Total
          $1/5 + 1/15 + 1/15 = 1/3$.

      - part: Which seats are still in play
        ask: >
          The loss chances run $1/5, 1/4, 1/3, 1/2$ for passengers $2$ to $5$,
          and the branching gets heavier each time. Look at the free seats a
          displaced passenger $j$ chooses among. Which seats can they be?
        choices:
          - text: >
              Any seat at all, depending on the history.
            feedback: >
              Seats $2$ to $j - 1$ are never free when passenger $j$ chooses:
              each passenger before him either found their own seat free and
              took it, or found it already taken.
          - text: >
              Seat $1$ and the seats $j + 1, \dots, n$, exactly.
            correct: true
            feedback: >
              Seat $1$ must still be free, or nobody would be displaced. And
              no seat behind $j$ can be taken yet: a random pick of one would
              have passed the displacement over $j$'s head, and $j$ would have
              found his own seat free.
          - text: >
              Only seats $j + 1, \dots, n$: seat $1$ is always gone by then.
            feedback: >
              If seat $1$ were taken, the displacement would have ended and
              passenger $j$ would not be displaced. A displaced passenger
              always sees seat $1$ free.
        feedback: >
          The free seats at every random choice are seat $1$ plus the whole
          back of the plane.
      - reflect: >
          Fix passenger $k$. Using that, say which seats are certainly free
          at every random choice made before passenger $k$ boards, and why
          passenger $k$ loses with probability one over the number of those
          seats.
        answer: >
          Seat $1$ and seats $k, k+1, \dots, n$: that is $n - k + 2$ seats,
          all free at every random choice before passenger $k$ boards. A pick
          outside them (a seat between the chooser and $k$) only hands the
          displacement to someone else who also boards before $k$. A pick
          inside them settles $k$'s fate: seat $1$ ends the chain, seat $k$
          displaces him, a seat behind him leaves seat $k$ free when he
          arrives. Every chooser treats these seats alike, so the first one
          taken is uniform among them, and it is seat $k$ with probability
          $1/(n - k + 2)$.
      - teach: >
          So passenger $k$, for $2 \le k \le n$, keeps their own seat with
          probability $1 - 1/(n - k + 2)$. At $k = n$ that is the familiar
          $1/2$; at $k = 2$ it is $1 - 1/n$. The last passenger is just the
          end of a smooth climb.
      - ask: >
          An $8$-seat plane. What is the probability that passenger $6$ keeps
          his seat?
        expects: "3/4"
        feedback: >
          The live seats are seat $1$ and seats $6, 7, 8$: four of them, so
          he loses with probability $1/4$ and keeps his seat with $3/4$.
      - ask: >
          A candidate writes the loss probability as $1/(n - k + 1)$. Which
          check exposes the slip fastest?
        choices:
          - text: >
              At $k = 2$ it gives $1/(n - 1)$, which looks too large.
            feedback: >
              It is wrong there, but "looks too large" is not a check; you
              would need to compute passenger $2$'s risk to see it.
          - text: >
              At $k = n$ it gives $1$: the last passenger would always lose.
            correct: true
            feedback: >
              And you know the last passenger loses with probability $1/2$.
              The formula forgot seat $1$, which is always live alongside
              seats $k$ to $n$.
          - text: >
              It gives a probability above $1$ for some $k$.
            feedback: >
              For $2 \le k \le n$ it stays between $0$ and $1$. The clean
              refutation is the endpoint you already know.
        feedback: >
          Count the live seats: seats $k$ to $n$ are $n - k + 1$ of them, and
          seat $1$ makes one more.

      - part: Where the risk sits
        ask: >
          On a $100$-seat plane, what is the probability that passenger $50$
          keeps their seat?
        expects: "51/52"
        feedback: >
          The live seats are seat $1$ and seats $50$ to $100$, which is $52$
          seats. So $1 - 1/52 = 51/52 \approx 0.981$. Halfway down the plane,
          the risk is still under $2\%$.
      - ask: >
          Does the formula $1 - 1/(n - k + 2)$ also give passenger $1$'s
          chance of ending up in his own seat?
        choices:
          - text: >
              Yes: at $k = 1$ it gives $1 - 1/(n + 1)$.
            feedback: >
              Passenger $1$ sits uniformly at random, so he lands in his own
              seat with probability $1/n$, not $n/(n+1)$. The argument needed
              passenger $k$ to board after the chain had begun.
          - text: >
              No: passenger $1$ chooses at random himself, so the argument
              about live seats does not apply to him.
            correct: true
            feedback: >
              The formula describes passengers who take their own seat when
              they find it free. Passenger $1$ never does; he gets seat $1$
              with probability $1/n$.
          - text: >
              Yes, and it shows passenger $1$ is the safest passenger.
            feedback: >
              He is the least likely of all to sit in his own seat, at $1/n$.
              Plugging $k = 1$ into a formula proved for $k \ge 2$ produces a
              number, not a fact.
        feedback: >
          State the range when you quote it: $2 \le k \le n$.

  - node: quant-puzzles.prob-paradoxes.two-envelopes
    hook: >
      "Switch, then switch back forever" sounds absurd precisely because it
      is, but naming exactly which step is illegal — not just that the
      conclusion is wrong — is the actual skill being tested.
    explanation: >
      One envelope holds twice the other; call yours $A$. The tempting
      argument: the other holds $2A$ or $A/2$ with probability $1/2$ each, so
      $\mathbb{E}[B] = (1/2)(2A) + (1/2)(A/2) = (5/4)A > A$ — switch, and by
      the same logic on whichever envelope you now hold, switch back forever.
      Two separate things are wrong, and telling them apart is what matters.

      Unopened, the error is that $A$ isn't a fixed number, it's a random
      variable, and the $5/4$ calculation silently lets it mean two different
      things in its two branches. Write the true pair honestly as $(x, 2x)$
      for an unknown $x$: your envelope is $x$ half the time and $2x$ half
      the time, and the other is exactly the complementary value each time.
      The tower property, averaging over which is which, gives
      $\mathbb{E}[A] = \mathbb{E}[B] = (3/2)x$ — identical, not a $5/4$ gap.

      Opened, once you've looked and hold amount $a$, the step
      $\Pr(A \text{ is the smaller} \mid A = a) = 1/2$ for every $a$ demands a
      probability law flat over an unboundedly large scale of possible $a$
      values — and no distribution assigns equal, positive weight to
      infinitely many values and still sums to $1$.

      Both failures point the same direction: this isn't a flaw in
      expectation, it's an inconsistent random variable in one telling and a
      nonexistent prior in the other.
    worked: >
      Suppose, unknown to you, the pair actually generated is $(40, 80)$.
      Whichever envelope reaches you, it holds $40$ with probability $1/2$
      and $80$ with probability $1/2$, so $\mathbb{E}[A] = (1/2)(40) +
      (1/2)(80) = 60$, and the identical argument gives $\mathbb{E}[B] = 60$
      as well — the same number, not a $5/4$ gap, because both envelopes are
      averaged over the same underlying pair rather than treating "the
      other" as always the doubled or halved version of whatever you hold.
    interview: >
      "Should you switch envelopes" checks whether you can locate the exact
      flawed step rather than assert "it's a paradox" — the sharp answer
      distinguishes the unopened case (an inconsistent random variable) from
      the opened case (an unnormalizable prior), since a follow-up almost
      always asks what changes once you've actually looked inside.
    pitfalls: >
      Concluding "the expected values are equal" without diagnosing which of
      the two errors is doing the work in a given phrasing. After opening the
      envelope, still treating "the other is equally likely to be double or
      half" as a free assumption rather than a prior that would need to be
      flat over an unbounded scale, which no distribution can supply.
    recap: >
      The $5/4$ argument either lets "your envelope's amount" quietly mean
      two different things across its two branches, or, once opened, leans on
      a uniform-over-everything prior that no probability distribution can
      supply — fix either error and the switching advantage disappears.
    dialogue:
      - part: Switch, and switch back
        teach: >
          A host fills two envelopes, one holding twice the other, and hands
          you one at random. You have not opened it. A friend argues: "Call
          yours $A$. The other holds $2A$ or $A/2$, each with probability
          $1/2$, so it is worth $(1/2)(2A) + (1/2)(A/2) = (5/4)A$. Switch."
      - ask: >
          You switch. Now apply the friend's argument to the envelope you
          hold. What does it recommend?
        choices:
          - text: >
              Stay: you have already collected the $25\%$ gain.
            feedback: >
              The argument never used anything about which envelope you hold;
              call the new one $A$ and every step goes through again, word for
              word.
          - text: >
              Switch back, and then switch again, forever.
            correct: true
            feedback: >
              An argument that says each envelope is worth $5/4$ of the other
              proves too much. Some step in it is illegal, and the job is to
              find which.
          - text: >
              Nothing: the argument only applies to the first choice.
            feedback: >
              Nothing in it mentions a first choice. Symmetric situations get
              symmetric conclusions, which is exactly the trouble.
        feedback: >
          Each envelope cannot be worth more than the other. Pin the argument
          to a concrete pair and watch where it breaks.
      - ask: >
          Suppose the pair is in fact $25$ and $50$. If you are holding the
          $25$, what does switching gain you?
        expects: "25"
        feedback: >
          You trade $25$ for $50$: a gain of $25$.
      - ask: >
          And if you are holding the $50$, what does switching gain you?
        expects: "-25"
        feedback: >
          You trade $50$ for $25$: a gain of $-25$.
      - ask: >
          You were handed either envelope with probability $1/2$. What is the
          expected gain from switching?
        expects: "0"
        feedback: >
          $(1/2)(25) + (1/2)(-25) = 0$. Given the pair, you hold $25$ or $50$
          equally often, and so does the other envelope:
          $\mathbb{E}[A] = \mathbb{E}[B] = 37.5$.
      - reflect: >
          On the pair $25$ and $50$, the friend's "$2A$" branch and "$A/2$"
          branch each describe one of your two situations. What is $A$ in
          each, and what exactly is the illegal step in $(5/4)A$?
        answer: >
          The "$2A$" branch is the world where you hold $25$, so there
          $A = 25$; the "$A/2$" branch is the world where you hold $50$, so
          there $A = 50$. Writing both with one symbol and then factoring it
          out treats $A$ as a single fixed number, when it is a random
          variable that takes different values in the two branches. Done
          honestly, the gain is $(1/2)(50 - 25) + (1/2)(25 - 50) = 0$.
      - teach: >
          Unopened, the two-envelopes argument fails by equivocation, and the
          tower property is the repair: condition on the pair $(x, 2x)$
          first. Given the pair, your envelope is $x$ or $2x$ with probability
          $1/2$ each, so $\mathbb{E}[A \mid \text{pair}] = \mathbb{E}[B \mid
          \text{pair}] = (3/2)x$, and averaging over whatever prior the host
          used gives $\mathbb{E}[A] = \mathbb{E}[B]$. No prior is needed to
          see that switching blind gains nothing.

      - part: After you open it
        teach: >
          Now you open your envelope and see $64$. The friend tries again:
          "Now $A = 64$ is a number, not a random variable. The other holds
          $128$ or $32$, each with probability $1/2$. Switch."
      - ask: >
          What does that "probability $1/2$" depend on?
        choices:
          - text: >
              Only on the host handing you an envelope at random, which he
              did.
            feedback: >
              The random handing makes you equally likely to hold either
              envelope of a given pair. It says nothing about which pair the
              host filled — and seeing $64$ is a question about that.
          - text: >
              On how likely the host was to fill $(32, 64)$ compared with
              $(64, 128)$.
            correct: true
            feedback: >
              Seeing $64$ leaves two candidate pairs, and the random handing
              gives each the same likelihood $1/2$ of showing you $64$. So the
              posterior on them is their prior ratio, and $1/2$ holds only if
              the host found them equally likely.
          - text: >
              On nothing: by symmetry it is always $1/2$.
            feedback: >
              Symmetry between the two envelopes of one pair is real.
              Symmetry between the pairs $(32, 64)$ and $(64, 128)$ is a claim
              about the host, and it can be false.
        feedback: >
          Once opened, the $1/2$ is a posterior, and a posterior needs a
          prior.
      - ask: >
          Suppose the host fills $(32, 64)$ with probability $3/4$ and
          $(64, 128)$ with probability $1/4$. You see $64$. What is the
          probability that you hold the smaller envelope?
        expects: "1/4"
        hint: >
          Each pair shows you $64$ with probability $1/2$, so the likelihoods
          cancel.
        feedback: >
          $(1/4)(1/2)$ against $(3/4)(1/2)$, so $\Pr(\text{smaller} \mid 64) =
          (1/8)/(1/8 + 3/8) = 1/4$. Here the "$1/2$" step is simply false, and
          the other envelope is more likely to hold $32$.
      - reflect: >
          For the friend's step to be right whatever amount you see — $1/2$
          at $64$, at $128$, at $256$, at every amount — what would the host's
          prior over pairs have to look like, and can it exist?
        answer: >
          Seeing $a$ leaves pairs $(a/2, a)$ and $(a, 2a)$, so the $1/2$ at
          every $a$ forces every pair on the doubling ladder to be exactly as
          likely as the next: $(1, 2)$, $(2, 4)$, $(4, 8)$ and so on without
          end, all with one common probability. Infinitely many equal
          probabilities sum to $0$ if they are $0$ and to infinity if they are
          positive, never to $1$. No such prior exists.
      - teach: >
          Opened, the argument fails because its step
          $\Pr(A \text{ is the smaller} \mid A = a) = 1/2$ for every $a$
          requires a prior flat over an unbounded scale, and no probability
          distribution is flat there. With any genuine prior, the $1/2$ fails
          at some amounts, as it did at $64$ with the host's $3/4$ and $1/4$.

      - part: Naming the broken step
        ask: >
          An interviewer asks: "So what is wrong with the switching argument?"
          Which answer is strongest?
        choices:
          - text: >
              "Expected value does not apply to a one-shot choice."
            feedback: >
              Expected value applies perfectly well; computed honestly it
              gives a switching gain of $0$ unopened. The fault is in the
              computation, not the tool.
          - text: >
              "Unopened, $A$ is used for two different amounts in the two
              branches; condition on the pair and both envelopes are worth
              $(3/2)x$. Opened, the $1/2$ needs a prior flat over all
              doublings, and none exists."
            correct: true
            feedback: >
              Two failures, each located at its exact step, and the repair
              for the first.
          - text: >
              "The $5/4$ is right, but you cannot switch forever, so you stop
              after one switch."
            feedback: >
              That accepts a false premise and patches its conclusion. The
              $5/4$ is wrong, and saying where is the whole question.
        feedback: >
          The interviewer is listening for the separation: an equivocating
          random variable unopened, a nonexistent prior opened.

  - node: quant-puzzles.prob-paradoxes.two-envelopes-proper-prior
    hook: >
      Put a real, normalizable distribution on the envelope amounts and the
      naive switching intuition turns out to be locally correct almost
      everywhere — except at the two boundary amounts, which erase it.
    explanation: >
      Use a genuine prior: the pair is $(2^{k}, 2^{k+1})$ with $k$ uniform on
      a finite range $\{0, \dots, N\}$, so there are finitely many possible
      pairs, each equally likely — the honest prior the naive argument was
      missing.

      For an amount seen strictly inside the possible range, the two
      candidate pairs really are equally likely given that observation, so
      switching genuinely has positive expected gain there — the naive
      intuition is locally correct once a real prior backs it.

      The two boundary amounts break the pattern completely: the smallest
      possible observed amount can only be the smaller member of its pair, so
      switching gains for certain; the largest possible observed amount can
      only be the larger member of its pair, so switching loses for certain,
      and loses a lot. Those two extreme cases carry exactly enough
      probability weight to cancel every interior gain, forcing the
      unconditional expected gain from always switching back to zero.

      Sending $N \to \infty$ recovers the original paradox: the boundary
      keeps receding, every finite observation looks interior, "always
      switch" looks locally justified everywhere you check — but the
      canceling term escapes to infinity along with it, exactly the
      unnormalizable-prior failure diagnosed already.
    worked: >
      Take $N = 2$: the pair is $(2^{k}, 2^{k+1})$ for $k$ uniform on
      $\{0, 1, 2\}$, so the three equally likely pairs are $(1,2), (2,4),
      (4,8)$. See $a = 2$: the two candidate pairs, $(1,2)$ and $(2,4)$, are
      equally likely, so switching's expected gain is
      $(1/2)(-1) + (1/2)(+2) = 1/2$, genuinely favorable. But see $a = 1$
      (only possible as the smaller of $(1,2)$): switching gains a certain
      $+1$. See $a = 8$ (only possible as the larger of $(4,8)$): switching
      loses a certain $-4$. Averaging over all three pairs, the overall
      expected gain from always switching is exactly
      $\frac{1}{2(3)}[1 + (4-1) - 4] = 0$.
    interview: >
      "Fine, put a real prior on it — now should you switch" is the natural
      follow-up once you've diagnosed the paradox; the strong answer says yes
      conditionally at interior observations, no unconditionally, and names
      the boundary cancellation as the reconciling mechanism.
    pitfalls: >
      Concluding from the interior calculation that switching is
      unconditionally favorable with a real prior — the boundary terms are
      what force the unconditional answer back to zero. Forgetting that a
      boundary's contribution scales with how extreme its payoff is, not just
      its probability, so a shrinking-probability boundary can still cancel
      an entire distribution of small interior gains.
    recap: >
      With a genuine finite prior, switching helps at every interior
      observation and hurts badly at the two boundary ones, and those
      boundary cases cancel the interior gains to exactly zero overall —
      sending the range to infinity is what makes the boundary vanish and
      revives the paradox.
    dialogue:
      - part: A ladder with a top
        teach: >
          This host is honest about his prior. He rolls a fair four-sided die
          to pick one of the pairs $(1, 2)$, $(2, 4)$, $(4, 8)$, $(8, 16)$,
          each with probability $1/4$, then hands you one of the two envelopes
          at random. You open yours and see $4$.
      - ask: >
          Given that you see $4$, what is the probability that you hold the
          smaller envelope?
        expects: "1/2"
        feedback: >
          A $4$ comes from $(2, 4)$ or $(4, 8)$, each prior $1/4$, each showing
          you $4$ with probability $1/2$. Equal weights: $1/2$.
      - ask: >
          What is the expected gain from switching, given that you see $4$?
        expects: "1"
        feedback: >
          $(1/2)(8 - 4) + (1/2)(2 - 4) = 2 - 1 = 1$. That is $25\%$ of $4$:
          here the friend's $5/4$ is simply true.
      - ask: >
          The same calculation at $2$ and at $8$ also favours switching. Does
          that make "always switch" a winning policy against this host?
        choices:
          - text: >
              Yes: switching wins in expectation at every amount you check.
            feedback: >
              You have not checked every amount. Two of the five possible
              amounts sit at the ends of the ladder, and the $50/50$ step
              fails at both.
          - text: >
              Not yet known: the amounts $1$ and $16$ still need checking.
            correct: true
            feedback: >
              At the ends of the ladder only one pair can produce what you
              see, so there is nothing to average.
          - text: >
              No: by symmetry switching can never gain at any amount.
            feedback: >
              It gains at $4$, with an honest prior and an honest calculation.
              Symmetry constrains the average over everything you might see,
              not the gain at each amount.
        feedback: >
          Look at the two ends.
      - ask: >
          You see $16$. What is the expected gain from switching?
        expects: "-8"
        feedback: >
          Only $(8, 16)$ contains a $16$, and you hold its larger envelope, so
          switching certainly gives you $8$: a gain of $-8$. At the other end,
          a $1$ can only be the smaller of $(1, 2)$, and switching certainly
          gains $+1$.

      - part: The top pays for everything
        reflect: >
          Before adding anything up: what must the unconditional expected gain
          of "always switch" be against this host, and why? And how can a
          single amount out of five be enough to make that happen?
        answer: >
          Zero. "Always switch" uses nothing you saw, so it is the unopened
          game, where conditioning on the pair gives $\mathbb{E}[A] =
          \mathbb{E}[B]$. The interior amounts and the bottom amount all
          favour switching, so the top must lose exactly what they gain
          together. It can, because its loss is the largest amount on the
          ladder: rare, but big.
      - ask: >
          Each of the $8$ pair-and-envelope states has probability $1/8$.
          What does the amount $16$ contribute to the unconditional expected
          gain of always switching?
        expects: "-1"
        feedback: >
          $(1/8)(-8) = -1$. The rest: seeing $1$ contributes $(1/8)(1)$,
          seeing $2$ contributes $(2/8)(1/2)$, seeing $4$ contributes
          $(2/8)(1)$, seeing $8$ contributes $(2/8)(2)$, a total of
          $1/8 + 1/8 + 2/8 + 4/8 = 1$. The top's $-1$ cancels it exactly.
      - teach: >
          With pairs $(2^{k}, 2^{k+1})$ for $k$ uniform on $\{0, \dots, N\}$,
          every interior amount $a = 2^{j}$ makes switching worth a genuine
          $+a/4$; the bottom amount gains $+1$ for certain; the top amount
          $2^{N+1}$ loses $2^{N}$ for certain. Weighted, they sum to exactly
          $0$. A genuine prior makes switching good almost everywhere and
          ruinous at one place, and the one place is enough.

      - part: Sending the top away
        ask: >
          Stretch the ladder to $10$ pairs, $(1, 2)$ up to $(512, 1024)$, each
          with probability $1/10$. What is the probability that you see
          $1024$?
        expects: "1/20"
        feedback: >
          Only the top pair, with probability $1/10$, and only if you were
          handed its larger envelope, $1/2$: $1/20$. There, always switching
          loses $512$, contributing $(1/20)(-512) = -25.6$ — the same size as
          all the gains elsewhere combined.
      - ask: >
          As the ladder grows without end, what happens to the cancelling top
          term?
        choices:
          - text: >
              It vanishes, because its probability $1/(2(N+1))$ goes to $0$.
            feedback: >
              Its probability shrinks like $1/N$, but its loss doubles with
              every step, so its contribution $-2^{N}/(2(N+1))$ grows without
              bound. It never becomes negligible while it exists.
          - text: >
              It escapes: in the limit there is no top amount, every amount
              looks interior, and $\mathbb{E}[A]$ is infinite too.
            correct: true
            feedback: >
              The limit has no largest pair to pay for the gains, and no
              finite mean to compare against. That is the original paradox:
              the boundary that kept the books balanced has left.
          - text: >
              It becomes the dominant term, so switching is bad in the limit.
            feedback: >
              The top term and the gains below it stay exactly equal in size
              at every $N$. In the limit there is no top term at all, which is
              the problem, not a stronger version of the cure.
        feedback: >
          The naive argument is the limit of honest arguments with the
          cancelling term thrown away.
      - ask: >
          An interviewer: "Fine, put a real prior on it. Now should you
          switch?" Which answer is strongest?
        choices:
          - text: >
              "No — switching is worth zero, by symmetry."
            feedback: >
              True of the policy "always switch", false of the decision at a
              given amount. At an interior amount the switch is worth $+25\%$.
          - text: >
              "Yes — with a real prior the $5/4$ argument is valid."
            feedback: >
              Valid at interior amounts only. At the top of the ladder it
              fails, and that one failure costs exactly what the rest earn.
          - text: >
              "At an interior amount, yes, worth $25\%$. At the top, no. Always
              switching earns exactly zero: the top loss cancels the interior
              gains."
            correct: true
            feedback: >
              Conditional yes, unconditional zero, and the boundary named as
              the reason the two agree.
        feedback: >
          Look at the boundary: that is where an honest prior settles the
          bill.

  - node: quant-puzzles.prob-paradoxes.simpson
    hook: >
      A trader who beats a rival in every single market regime can still
      lose the pooled comparison badly, and nothing about the arithmetic is
      inconsistent — only the mix is doing the work.
    explanation: >
      This is the coarse end of the fineness ladder: pool two strata that
      were kept separate, and a comparison holding in every stratum can
      reverse in the pooled total. Nothing is inconsistent, only unnoticed,
      because a pooled rate is a weighted average and the two things being
      compared can draw on different weights.

      Mechanically: whenever one side's activity concentrates in the harder
      stratum and the other side's concentrates in the easier one, the
      harder side's overall rate gets dragged down by a stratum everyone does
      badly in, and the easier side's rate gets lifted by a stratum everyone
      does well in — the mix, not the underlying skill, is what the pooled
      number is measuring.

      Reversal is available whenever the gap between strata exceeds the gaps
      within them being compared, and the two sides' stratum weightings lean
      in opposite directions; check both conditions before trusting or
      distrusting a pooled headline number.

      The fix mirrors the fineness discipline exactly: quote the
      stratification alongside any pooled number, and when a pooled
      comparison is actually what's being asked for, standardize both sides
      to a common weighting before comparing, rather than comparing raw
      pooled totals.
    worked: >
      Two bank branches, small- and large-business loans. Branch $M$
      approves $9$ of $10$ small loans ($90\%$) and $27$ of $90$ large loans
      ($30\%$), for $36$ of $100$ overall ($36\%$). Branch $N$ approves $72$
      of $90$ small loans ($80\%$) and $5$ of $20$ large loans ($25\%$), for
      $77$ of $110$ overall (about $70\%$). $M$ beats $N$ in every category —
      $90\%$ against $80\%$, $30\%$ against $25\%$ — and still loses the
      pooled comparison badly, because $M$'s business skews nine-to-one
      toward the harder large-loan category while $N$'s skews the opposite
      way.
    interview: >
      "Can a strategy win every subgroup comparison and lose the aggregate"
      is answered "yes" immediately, with the mechanism named — a pooled rate
      is a weighted average, and the two sides' weights differ — the
      interviewer is checking you don't call it a data error.
    pitfalls: >
      Reporting only the pooled headline number when comparing two groups
      whose case mixes plausibly differ. Assuming the direction of the
      reversal tells you which side is "really" better; it tells you only
      about the mix, and answering the deeper question requires deciding
      whether the mix itself is part of what's being evaluated.
    recap: >
      A pooled comparison is a weighted average with the mix as the weights,
      and mismatched mixes can flip a comparison that holds in every
      individual stratum — stratify before trusting a pooled number.
    dialogue:
      - part: Two surgeons, one headline
        teach: >
          A hospital publishes its surgeons' records. Ada: $51$ successful
          operations out of $100$. Ben: $79$ out of $100$. Broken down, Ada
          succeeded in $19$ of $20$ easy operations and $32$ of $80$ hard
          ones; Ben in $72$ of $80$ easy operations and $7$ of $20$ hard ones.
      - ask: >
          On hard operations, by how many percentage points does Ada's success
          rate beat Ben's?
        expects: "5"
        feedback: >
          Ada $32/80 = 40\%$, Ben $7/20 = 35\%$: $5$ points. On easy ones it
          is also Ada, $19/20 = 95\%$ against $72/80 = 90\%$.
      - ask: >
          Ada is better in both categories and loses the headline by $28$
          points. What explains it?
        choices:
          - text: >
              The table has an error: a surgeon who wins both categories must
              win overall.
            feedback: >
              Add it up: $19 + 32 = 51$ and $72 + 7 = 79$. The counts are
              consistent; the intuition that "wins both means wins overall" is
              what fails.
          - text: >
              Four out of five of Ada's operations were hard; four out of five
              of Ben's were easy.
            correct: true
            feedback: >
              Hard operations succeed about $40\%$ of the time for anyone,
              easy ones about $90\%$. Ada's headline is mostly a hard-case
              number and Ben's mostly an easy-case number.
          - text: >
              Ben is better at operations overall, which the categories miss.
            feedback: >
              Every operation is in one of the two categories, and Ada is
              ahead in each. There is no third place for Ben's advantage to
              live.
          - text: >
              Sampling noise from small numbers.
            feedback: >
              These are the complete records, not estimates. Even with
              millions of operations in the same proportions, the reversal
              would be exactly as large.
        feedback: >
          The headline compares two different mixes of work, not two
          surgeons.

      - part: A weighted average with different weights
        reflect: >
          Write each surgeon's headline rate in terms of their two category
          rates. What are the weights, and why does that make a reversal
          possible when Ada leads in both categories?
        answer: >
          Each headline is a weighted average, weighted by that surgeon's own
          mix: Ada's is $0.2(95\%) + 0.8(40\%) = 51\%$, Ben's is
          $0.8(90\%) + 0.2(35\%) = 79\%$. The gap between categories — about
          $55$ points — dwarfs the $5$-point gaps within them, and the two
          mixes lean opposite ways, so the weights decide the comparison
          rather than the rates.
      - teach: >
          This is Simpson's paradox: a comparison that holds within every
          stratum reverses when the strata are pooled, because each pooled
          rate is a weighted average of its own stratum rates and the two
          sides use different weights. It needs two things — a gap between
          strata larger than the gaps within them, and mixes leaning in
          opposite directions. The repair is to compare on a common mix.
      - ask: >
          Give Ada Ben's mix: $80\%$ easy, $20\%$ hard, at her own category
          rates. What is her pooled success rate, as a decimal?
        expects: "0.84"
        feedback: >
          $0.8(0.95) + 0.2(0.40) = 0.76 + 0.08 = 0.84$, against Ben's
          $0.79$ on the same mix.
      - ask: >
          Now give Ben Ada's mix: $20\%$ easy, $80\%$ hard, at his own
          category rates. What is his pooled success rate, as a decimal?
        expects: "0.46"
        feedback: >
          $0.2(0.90) + 0.8(0.35) = 0.18 + 0.28 = 0.46$, against Ada's $0.51$
          on the same mix. On either common mix Ada wins by $5$ points — the
          within-category gap, as it must be.

      - part: When the headline can be trusted
        ask: >
          Which change to the hospital's data would make a reversal
          impossible?
        choices:
          - text: >
              Doubling every count in the table.
            feedback: >
              Scaling every count leaves every rate and every mix unchanged,
              so the reversal survives intact.
          - text: >
              Ada and Ben doing the same proportion of easy operations.
            correct: true
            feedback: >
              With equal weights the two pooled rates are the same weighted
              average of rates Ada leads in, so Ada leads the pooled
              comparison too.
          - text: >
              Ada's lead in each category growing to $10$ points.
            feedback: >
              A bigger lead makes reversal harder but not impossible. With
              categories $55$ points apart, a lopsided enough mix still flips
              it.
        feedback: >
          Equal mixes make the pooled comparison honest. Different mixes make
          it a statement about the mix.
      - ask: >
          You need a hard operation. Which surgeon do the data favour?
        choices:
          - text: >
              Ben: $79\%$ against $51\%$.
            feedback: >
              That compares Ben's mostly easy caseload with Ada's mostly hard
              one. Your operation is hard, and on hard operations Ben
              succeeds $35\%$ of the time.
          - text: >
              Ada: $40\%$ against $35\%$ on hard operations.
            correct: true
            feedback: >
              Condition on the stratum you are in. The pooled number answers
              a question about a patient population you are not part of.
          - text: >
              Neither: the paradox means the data cannot decide.
            feedback: >
              The data decide perfectly well once you use the stratum that
              matches your case. The paradox only disqualifies the headline.
        feedback: >
          The stratified comparison is the one about your operation.
      - ask: >
          An interviewer asks: "Can a strategy beat another in every subgroup
          and still lose in aggregate?" Which answer is strongest?
        choices:
          - text: >
              "No — that would be a contradiction, so the data must be
              wrong."
            feedback: >
              Ada and Ben are the counterexample, with consistent counts. The
              interviewer is checking that you do not call it a data error.
          - text: >
              "Yes: each aggregate is a weighted average of its subgroup
              rates, and if the two strategies' mixes lean opposite ways
              across subgroups with very different base rates, the aggregate
              can flip."
            correct: true
            feedback: >
              Yes, plus the mechanism and both conditions. Offer to compare on
              a common mix as the fix.
          - text: >
              "Yes, but only with small samples."
            feedback: >
              Sample size plays no part: the reversal is pure arithmetic of
              weighted averages, and persists at any scale.
        feedback: >
          Say "yes" immediately, then name the weights.

  - node: quant-puzzles.prob-paradoxes.simpson-pnl
    hook: >
      A blended Sharpe ratio can beat a rival's while losing in every single
      year, sector, and volatility bucket — this isn't a curiosity, it's the
      default failure mode of any pooled PnL statistic.
    explanation: >
      Reversal hits every point where performance is blended across a
      market-driven or size-driven mix, and the mix itself typically shifts
      in exactly the direction that flatters or damns the headline number.
      Three concrete manifestations: blended fill quality flatters a desk
      trading mostly liquid names even if execution is mediocre in every
      individual name; an aggregate Sharpe can beat a rival's while losing in
      every single year, sector, and volatility bucket, because the periods
      weighted heaviest happen to be the ones where the mix favored it; a
      backtest can appear to improve purely because the sample composition
      shifted rather than because the underlying edge changed at all.

      Two protective habits: report every comparison stratified by whatever
      variable drives the base rate — liquidity bucket, year, regime — and
      before pooling, decide explicitly whether the stratifying variable is a
      confounder that must be controlled for, or is itself a consequence of
      the decision under evaluation. Controlling for the latter silently
      deletes the effect you were trying to measure — controlling for "which
      regime the strategy chose to trade in" when regime selection is the
      strategy erases the strategy's own decision.

      The discipline generalizes past PnL: whenever a single blended number
      ranks two things with different exposure to an underlying driver, ask
      for the stratified version first.
    worked: >
      A strategy shows a blended annual Sharpe of $1.4$, beating a
      benchmark's $1.1$. Broken out by year, the strategy trails the
      benchmark in four of five years and wins only in one volatile year
      that dominates the blended number because it contributed most of the
      total variance-weighted return. Stratified by year, the benchmark is
      the better choice in the ordinary years, and the blended number was
      answering "which one did better across the mix of years that
      happened" rather than "which one is the better strategy."
    interview: >
      "Our aggregate Sharpe beats theirs" invites the follow-up "does it
      still, stratified by year or regime" — the strong candidate asks this
      unprompted and names which protective habit, stratifying or checking
      whether the stratifier is itself part of the effect, is doing the work
      in the comparison at hand.
    pitfalls: >
      Treating a favorable blended statistic as settled evidence without
      checking whether the underlying mix shifted between the two things
      compared. Controlling for a variable that is itself a consequence of
      the strategy's own decisions, which erases the effect rather than
      isolating it.
    recap: >
      A blended PnL statistic is a weighted average over whatever mix
      actually realized, and it flatters or damns a strategy for its
      exposure to that mix as much as for its underlying edge — always ask
      for the stratified version before trusting the headline.
    dialogue:
      - part: Two desks, one blended cost
        teach: >
          Two execution desks report average slippage per order, in basis
          points; lower is better. Desk North pays $3$ on liquid names and
          $20$ on illiquid ones, and $90\%$ of its orders are liquid. Desk
          South pays $2$ on liquid names and $18$ on illiquid ones, and $30\%$
          of its orders are liquid. Management looks only at the blended
          figures.
      - ask: >
          What is Desk North's blended slippage, in basis points?
        expects: "4.7"
        feedback: >
          $0.9(3) + 0.1(20) = 2.7 + 2 = 4.7$.
      - ask: >
          What is Desk South's blended slippage, in basis points?
        expects: "13.2"
        feedback: >
          $0.3(2) + 0.7(18) = 0.6 + 12.6 = 13.2$ — nearly three times
          North's.
      - ask: >
          Management proposes routing all flow to North. What do you say?
        choices:
          - text: >
              Agree: $4.7$ against $13.2$ is not close.
            feedback: >
              South is cheaper on liquid names, $2$ against $3$, and on
              illiquid names, $18$ against $20$. Routing to North raises the
              cost of every order.
          - text: >
              Object: South is cheaper in both buckets and only looks worse
              because it handles most of the illiquid flow.
            correct: true
            feedback: >
              The blended figure is mostly a measure of how much illiquid
              flow each desk gets, not how well it executes.
          - text: >
              Split the flow evenly, since the evidence conflicts.
            feedback: >
              The evidence does not conflict once it is read correctly: within
              each bucket, South wins. Only the pooled number disagrees, and
              it is measuring the mix.
        feedback: >
          The same reversal as in Simpson's paradox, now wearing a desk's
          name.
      - ask: >
          Put South on North's mix — $90\%$ liquid — at South's own bucket
          costs. What is its blended slippage?
        expects: "3.6"
        feedback: >
          $0.9(2) + 0.1(18) = 1.8 + 1.8 = 3.6$, below North's $4.7$ on the
          same mix. Compared like for like, South is the cheaper desk.

      - part: A cause or a choice
        reflect: >
          Before trusting the stratified comparison, what do you need to know
          about how orders came to sit in each bucket? Describe a situation
          where comparing within buckets would be the wrong thing to do.
        answer: >
          Whether the bucket was imposed or chosen. If clients decide what
          gets traded and South simply receives the illiquid clients, the
          bucket is a confounder outside the desk's control: stratify, and
          judge execution within buckets. But if the thing being evaluated is
          itself the choice of bucket — a portfolio manager deciding to put
          risk into illiquid names — then the bucket is a consequence of the
          decision, and comparing within buckets deletes exactly the effect
          you meant to measure.
      - teach: >
          A pooled statistic — fill quality, hit rate, Sharpe, a backtest
          return — is a weighted average over whatever mix happened, so any
          comparison of two pooled numbers with different mixes can reverse.
          Two habits protect you. Report every comparison stratified by the
          variables that drive the base rate. And before pooling or
          stratifying, decide whether the stratifier is a confounder to
          control for, or part of the decision you are judging.
      - ask: >
          Two portfolio managers. Kai returns $6\%$ in large caps and $9\%$ in
          small caps, and chose to put $80\%$ of his risk in small caps. Lea
          returns $7\%$ and $10\%$, and put $10\%$ of hers in small caps. What
          is Kai's blended return, in percent?
        expects: "8.4"
        feedback: >
          $0.2(6) + 0.8(9) = 1.2 + 7.2 = 8.4$. Lea's is
          $0.9(7) + 0.1(10) = 6.3 + 1 = 7.3$. Lea leads in both buckets; Kai
          leads blended.
      - ask: >
          The fund asks which manager added more. Allocating between large
          and small caps is part of each manager's mandate. Which comparison
          answers the question?
        choices:
          - text: >
              The stratified one: Lea is better in both buckets, so Lea added
              more.
            feedback: >
              That controls for the very decision the fund is judging. Kai's
              tilt to small caps was his call, and it paid; stratifying
              erases it.
          - text: >
              The blended one: Kai's $8.4\%$ includes his allocation call,
              which is part of what he is paid for.
            correct: true
            feedback: >
              Here the mix is a consequence of the decision under evaluation,
              not a nuisance. If the fund wanted to judge stock selection
              alone, the stratified view would be the right one for that
              narrower question.
          - text: >
              Neither: Simpson's paradox means the data cannot rank them.
            feedback: >
              The data rank them cleanly once the question is fixed: blended
              for total contribution, stratified for selection within each
              bucket.
        feedback: >
          The desks and the managers have the same arithmetic and opposite
          answers. What decides it is whether the mix was imposed or chosen.

      - part: Asking the follow-up unprompted
        ask: >
          A colleague says: "Our desk's average fill quality beats theirs."
          What is the strongest reply?
        choices:
          - text: >
              "Is the difference statistically significant?"
            feedback: >
              A fair question, and it cannot detect a mix effect: a reversal
              driven by mix survives any sample size.
          - text: >
              "Stratified by liquidity, does it still? And who decides which
              names each desk trades?"
            correct: true
            feedback: >
              Stratify first, then ask whether the stratifier is imposed or
              chosen — the two habits in one sentence.
          - text: >
              "Congratulations."
            feedback: >
              A blended number with an unknown mix is not yet evidence about
              execution.
        feedback: >
          Never compare two pooled numbers whose mixes differ without looking
          inside them.

  - node: quant-puzzles.prob-paradoxes.sleeping-beauty
    hook: >
      Halfers and thirders both do the arithmetic correctly; they've just
      silently picked different sample spaces, and the puzzle never tells you
      which one it means.
    explanation: >
      A fair coin decides Sunday night; heads wakes Beauty once, on Monday;
      tails wakes her twice, Monday and Tuesday, with her memory of Monday
      erased before Tuesday so each waking feels identical. Asked her
      credence in heads upon waking, two camps compute different, internally
      consistent numbers.

      Halfers reason over the coin: she learned nothing she hadn't already
      anticipated, since she knew in advance she'd be woken and asked this
      exact question regardless of the outcome, so her credence stays at the
      prior, $1/2$ — a claim about the sample space of coin tosses.

      Thirders reason over the awakening: across many repetitions there are
      three equally frequent wakings, one following heads and two following
      tails, and from the perspective of "this waking, uniformly among all
      wakings that could be occurring right now," $\Pr(\text{heads}) = 1/3$
      — a claim about the sample space of individual awakenings, not coin
      tosses.

      The two camps aren't disagreeing about arithmetic; they've silently
      picked different sample spaces, per-experiment versus per-awakening,
      and both compute correctly on the one they picked. Resolve it the way
      you resolve any conditioning ambiguity: name the sampling unit before
      answering.
    worked: >
      Generalize: suppose tails leads to three wakings instead of two, heads
      still once. Per-awakening reasoning now gives four equally frequent
      wakings, one following heads, so that credence is $1/4$; per-experiment
      reasoning is untouched and stays $1/2$. Turning it into a bet settles
      which number governs actual payoffs: paid one unit for every awakening
      on which she correctly guesses heads, a heads-ticket is worth $1/4$ in
      expectation; paid once per completed experiment regardless of how many
      times she was asked, it's worth $1/2$ — the payoff rule, not the coin,
      decides which number is economically relevant.
    interview: >
      "What should her credence be" is really "name the sample space" — the
      interviewer is testing whether you notice the ambiguity at all, rather
      than defending one camp's number as objectively correct; converting the
      question into an explicit betting scheme is the fast way to show you
      understand why both survive.
    pitfalls: >
      Arguing for halfer or thirder as if one must be a mathematical error —
      both are internally valid, and the disagreement lives entirely in which
      sample space, experiments or awakenings, the question implicitly uses.
      Proposing a bet without specifying whether it pays per awakening or per
      experiment; the two payoff rules price an identical-sounding wager
      differently.
    recap: >
      Halfers and thirders compute correctly on two different sample spaces,
      per-experiment and per-awakening — the puzzle never names which, and
      only a stated payoff rule pins down the number that actually matters.
    dialogue:
      - part: A spade and three wakings
        teach: >
          On Sunday a card is drawn from a shuffled $52$-card deck and kept
          hidden. If it is a spade, the subject is woken three times during
          the week, her memory erased after each waking; otherwise she is
          woken once. Every waking feels the same, and at every waking she is
          asked for her credence that the card was a spade.
      - ask: >
          Picture $400$ runs of the experiment. About how many wakings in
          total follow a spade?
        expects: "300"
        feedback: >
          About $100$ runs draw a spade, and each produces $3$ wakings:
          $300$.
      - ask: >
          The other $300$ runs produce one waking each. Of all the wakings
          across the $400$ runs, what fraction follow a spade?
        expects: "1/2"
        feedback: >
          $300$ spade wakings out of $300 + 300 = 600$: exactly $1/2$, though
          a spade is drawn only a quarter of the time.
      - ask: >
          One camp says her credence on waking should be $1/4$: she knew she
          would be woken and asked, so waking teaches her nothing. Another
          says $1/2$. Which is right?
        choices:
          - text: >
              $1/4$: probabilities only change when you learn something, and
              she learns nothing.
            feedback: >
              The $1/4$ is right about runs: a quarter of experiments draw a
              spade. But half of all wakings follow one, and she is
              undeniably in a waking. Whether that matters depends on which
              of the two she is being asked about.
          - text: >
              $1/2$: she should count the wakings.
            feedback: >
              Right for wakings, and wakings are not the only thing she could
              be asked about. If the question is about this run's card,
              $1/4$ is the frequency.
          - text: >
              Both, about different things: $1/4$ of runs and $1/2$ of wakings
              follow a spade.
            correct: true
            feedback: >
              Both camps count correctly. They are counting different units.
        feedback: >
          The question "what is her credence?" does not say what is being
          sampled — and the two candidates give different numbers.

      - part: Naming the sampling unit
        reflect: >
          Say exactly what is being drawn uniformly at random in each camp's
          answer, and what question each number answers.
        answer: >
          The $1/4$ camp draws a run of the experiment: among runs, a quarter
          draw a spade, and the waking changes nothing because every run
          contains at least one. The $1/2$ camp draws a waking: among all
          wakings, half follow a spade, because spade runs produce three
          times as many. The first answers "how often is the card a spade?",
          the second "how often is a waking like this one a spade waking?".
          Same arithmetic, different sample spaces.
      - teach: >
          This is the Sleeping Beauty problem, in its standard form a fair
          coin with one waking on heads and two on tails: halfers answer on
          the sample space of coin tosses, thirders on the sample space of
          awakenings. A stated bet removes the ambiguity, because a bet must
          say whether it pays per waking or per experiment.
      - ask: >
          Back to the card. At every waking she is offered a ticket that pays
          $1$ if the card was a spade. What price per ticket makes it a fair
          bet?
        expects: "1/2"
        hint: >
          Per experiment, how much do the tickets pay out in expectation, and
          how many tickets are sold?
        feedback: >
          Expected payout per experiment: $(1/4)(3) = 3/4$. Expected tickets
          per experiment: $(1/4)(3) + (3/4)(1) = 3/2$. Fair price
          $(3/4)/(3/2) = 1/2$ — the per-waking credence.
      - ask: >
          Now she may buy one ticket per experiment, however many times she
          is woken, paying $1$ if the card was a spade. What is the fair
          price?
        expects: "1/4"
        feedback: >
          One ticket, paying $1$ with probability $1/4$: fair price $1/4$ —
          the per-experiment credence.

      - part: When the bet is on the table
        ask: >
          Tickets are sold at every waking at price $0.4$, paying $1$ if the
          card was a spade. She buys one at every waking. What is her expected
          profit per experiment?
        expects: "0.15"
        hint: >
          Spade runs: three tickets, each winning $0.6$. Other runs: one
          ticket, losing $0.4$.
        feedback: >
          $(1/4)(3)(0.6) + (3/4)(1)(-0.4) = 0.45 - 0.30 = 0.15$. A subject who
          priced with $1/4$ would refuse a ticket at $0.4$ and forgo this
          profit; under per-waking payment the $1/2$ is the number that
          governs money.
      - ask: >
          Which statement about the two camps is right?
        choices:
          - text: >
              The $1/4$ camp is making an error, since the per-waking bet
              proves $1/2$.
            feedback: >
              The per-experiment ticket proves $1/4$ just as firmly. Each
              bet vindicates the camp whose sampling unit it pays on.
          - text: >
              Each number is correct for its own sampling unit, and the
              payoff rule decides which one prices a given bet.
            correct: true
            feedback: >
              The coin, the deck and her information are identical across the
              two bets. Only the unit being paid on changed.
          - text: >
              The answer is the average of the two, $3/8$.
            feedback: >
              No bet is priced at $3/8$. Averaging two answers to two
              different questions answers neither.
        feedback: >
          Name the sampling unit, and the paradox becomes two ordinary
          calculations.
      - ask: >
          An interviewer asks the standard Sleeping Beauty question. Which
          answer is strongest?
        choices:
          - text: >
              "$1/3$ — there are three equally frequent awakenings and one
              follows heads."
            feedback: >
              Correct per awakening, but stated as if it were the only
              reading. The interviewer is testing whether you see the other.
          - text: >
              "$1/2$ per coin toss, $1/3$ per awakening. If she is paid per
              awakening, price heads at $1/3$; if once per experiment, at
              $1/2$."
            correct: true
            feedback: >
              Both sample spaces named, and the betting rule that selects
              between them.
          - text: >
              "$1/2$ — the coin is fair and nothing she experiences depends on
              it."
            feedback: >
              The number of awakenings depends on it. That is the whole
              puzzle, and this answer steps around it.
        feedback: >
          The question is a sample-space question in disguise. Name both and
          let the payoff rule choose.
