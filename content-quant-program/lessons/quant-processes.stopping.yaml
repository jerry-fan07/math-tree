unit: quant-processes.stopping
opening: >
  Optimal stopping turns a stream of one-at-a-time decisions — reroll or keep, hire or pass, exercise or hold — into a single repeated comparison: does what's in hand beat what continuing is worth? This unit builds that comparison from the value function and backward induction, works it fully through the fair-die reroll ladder, then swaps the finite-horizon machine for its long-horizon cousin, one-step lookahead, wherever a closed "don't bother continuing" region makes the myopic rule exactly right. It closes with the secretary problem's $1/e$ rule as the canonical rank-only, no-recall instance, a coda on how fragile that famous $37\%$ really is, and a pointer to American-option early exercise as the same idea in a finance costume.
lessons:
  - node: quant-processes.stopping.stopping-problem
    hook: >
      Every "reroll or keep," "hire now or wait," "exercise or hold" question in this branch is an instance of this one setup, and the interview tell is whether you can name its defining constraint — a stopping rule may use only what has already happened — before writing a single equation.
    explanation: >
      A stopping time already requires that quitting at time $n$ depend only on $Y_1,\dots,Y_n$, nothing later. Optimal stopping adds a payoff on top: instead of merely being allowed to stop at a non-anticipating time, you choose the non-anticipating rule that makes $\mathbb{E}[Y_\tau]$ as large as possible. That restriction is the entire content of the problem — drop it and the "optimal" rule collapses to "wait for whichever $Y_n$ turns out biggest," a rule no real decision-maker can execute, since it needs to see the future to know when to stop.

      Before any algebra, three questions fix which problem you are actually solving. Horizon: a hard deadline $N$, or can you keep looking indefinitely? Observation: do you see $Y_n$'s actual value, or only how it ranks against what came before? Recall: if you pass on $Y_n$, is it gone for good, or can you reclaim it later? Two questions phrased almost identically in English can have opposite answers here — "hire the best of $n$ candidates" is a different computation depending on whether you see salaries or only relative rank.

      The single-agent framing is worth stating explicitly, because habits from game theory import badly by mistake: there is no opponent picking a best response to your rule, only a fixed random mechanism generating $Y_1, Y_2,\dots$. Every technique this unit builds — backward induction, one-step lookahead — optimizes against chance, not against an adversary.
    worked: >
      Suppose $Y_1$ pays $8$ with probability $1/2$ and $0$ otherwise, and if you pass, $Y_2$ pays a certain $5$. The rule "stop at $n=1$ iff $Y_1 \ge 5$" reads only $Y_1$, so it is a legitimate stopping time, giving $\mathbb{E}[Y_\tau] = \tfrac12(8)+\tfrac12(5)=6.5$. Contrast "accept whichever of $Y_1,Y_2$ turns out bigger": deciding at $n=1$ under that rule needs already knowing $Y_2$, so it is not a stopping time at all, however tempting its arithmetic looks.
    interview: >
      "How would you set this problem up" is really asking for the horizon, the observation type, and the recall rule stated before the reward sequence is even discussed; "is that a valid strategy" tests whether a proposed rule secretly peeks ahead. Stating $\mathbb{E}[Y_\tau]$ with $\tau$ explicitly non-anticipating is the ten-second version.
    pitfalls: >
      Proposing a rule that compares $Y_n$ against a later, unobserved value smuggles in information you don't have — check every candidate rule against the "known only through time $n$" test. Treating the problem as adversarial, as if some opponent shaped the $Y_n$, imports game-theoretic reasoning that doesn't belong here.
    recap: >
      A stopping rule must be a non-anticipating $\tau$, and before computing anything you need the horizon, what you observe, and whether a reject can be reclaimed.
    dialogue:
      - part: Two buyers and a friend's rule
        teach: >
          You are selling a car to one of two buyers who come on consecutive
          days. Today's buyer offers $12$ or $4$ (thousand), equally likely.
          You see the offer and must accept or refuse on the spot; a refused
          buyer is gone. Tomorrow's buyer offers $6$ or $16$, equally likely,
          independent of today, and if you get that far you must accept.
      - ask: >
          A friend says: "Easy — sell to whichever buyer offers more." On
          average, what would that rule collect, in thousands?
        expects: "12.5"
        hint: >
          List the four equally likely pairs of offers and take the larger in
          each.
        feedback: >
          The pairs $(12,6)$, $(12,16)$, $(4,6)$, $(4,16)$ give larger offers
          $12, 16, 6, 16$, which average $50/4 = 12.5$. That is
          $\mathbb{E}[\max(Y_1, Y_2)]$, and it is the number to beat.
      - ask: >
          It is today, and the buyer in front of you offers $12$. What does
          your friend's rule tell you to do?
        choices:
          - text: >
              Accept, because $12$ beats the $11$ that tomorrow's buyer offers
              on average.
            feedback: >
              That is a sensible rule, but it is yours, not your friend's.
              Your friend's rule takes the larger offer, and when tomorrow
              brings $16$ the larger offer is not the $12$.
          - text: >
              Refuse, because tomorrow might bring $16$.
            feedback: >
              Tomorrow might also bring $6$, and then your friend's rule says
              the $12$ was the one to take. "Might" is not a verdict.
          - text: >
              It cannot say: its verdict depends on tomorrow's offer, which
              nobody has seen yet.
            correct: true
            feedback: >
              Right. The rule is a perfectly good description of an outcome,
              and no description of a decision: at the moment you must act it
              needs a number that does not exist yet.
          - text: >
              Accept or refuse with probability $1/2$ each.
            feedback: >
              The rule has no coin in it. Given both offers it is completely
              determined — the trouble is that you are only given one of them.
        feedback: >
          A rule you cannot carry out is not a strategy, however good its
          average looks. The $12.5$ belongs to someone who has seen the
          future.
      - ask: >
          You have to decide today knowing only today's offer. Accept $12$,
          refuse $4$. What does that rule collect on average?
        expects: "11.5"
        hint: >
          Refusing hands you tomorrow's offer. What is that worth on average?
        feedback: >
          Refusing is worth $(6 + 16)/2 = 11$. Since $12 > 11$ you keep a
          $12$, and since $4 < 11$ you refuse a $4$:
          $0.5(12) + 0.5(11) = 11.5$. The gap of $1$ to your friend's $12.5$
          is exactly the price of not seeing tomorrow.
      - reflect: >
          Both rules compare numbers. State the test that your rule passes and
          your friend's fails — a test you could run on any proposed rule
          before computing its average.
        answer: >
          Whether you stop on day $n$ has to be decided by what you have seen
          through day $n$: $Y_1, \dots, Y_n$ and nothing later. Your rule
          looks only at today's offer, so it passes. Your friend's rule, on
          day $1$, needs $Y_2$, so it fails. That is exactly the definition
          of a stopping time, applied to a decision.

      - part: The problem, said precisely
        teach: >
          This is the optimal stopping problem. Rewards $Y_1, Y_2, \dots$
          arrive one at a time; a strategy is a stopping time $\tau$, so the
          event $\{\tau = n\}$ is decided by $Y_1, \dots, Y_n$; and the goal
          is the largest $\mathbb{E}[Y_\tau]$ over all such $\tau$. Your
          friend's number, $\mathbb{E}[\max_n Y_n]$, is the prophet's: an
          upper bound that no stopping time reaches in general.
      - ask: >
          Three buyers now, offers $Y_1, Y_2, Y_3$, and you must take the
          third if you reach it. Which rule is a stopping time?
        choices:
          - text: >
              Accept buyer $1$ if her offer is the largest of the three.
            feedback: >
              On day $1$ this needs $Y_2$ and $Y_3$. It is your friend's rule
              again, with one more buyer.
          - text: >
              Accept the first buyer whose offer beats the average of all
              three offers.
            feedback: >
              The average of all three is known only on day $3$, so on days
              $1$ and $2$ the comparison cannot be made.
          - text: >
              Accept buyer $2$ if her offer beats both $Y_1$ and $Y_3$.
            feedback: >
              The comparison with $Y_1$ is fine — that is the past. The
              comparison with $Y_3$ is the future, and one forbidden input is
              enough to disqualify the rule.
          - text: >
              Refuse buyer $1$; accept buyer $2$ if $Y_2 > Y_1$; otherwise
              take buyer $3$.
            correct: true
            feedback: >
              Comparing a new offer with an old one only uses the past, so
              this is a legitimate stopping time. Whether it is a *good* one is
              a separate question.
        feedback: >
          The test is mechanical: at each day, list the numbers the rule
          consults and check that none of them has a later index. Comparisons
          with the past are allowed; comparisons with the future are not.

      - part: Three switches before any arithmetic
        ask: >
          Back to two buyers, with one sentence changed: a refused buyer
          leaves her number, and you may call her back once you have heard
          tomorrow's offer. What is the best average you can now collect?
        expects: "12.5"
        hint: >
          With call-back, what stops you from simply hearing both offers?
        feedback: >
          Nothing. You hear both and take the larger, so you collect
          $\mathbb{E}[\max(Y_1, Y_2)] = 12.5$, the friend's number. With
          recall, waiting costs nothing and the stopping problem all but
          disappears; without it, it is a genuine decision.
      - ask: >
          A colleague prices the refusal of today's $4$ at $6$, "because if you
          refuse, the second buyer will offer the worse of his two prices".
          What has gone wrong?
        choices:
          - text: >
              Nothing: planning for the worst case is the safe way to value a
              decision.
            feedback: >
              The worst case is the right valuation only when an opponent
              chooses the outcome. Here the buyer's offer is a coin flip that
              your choice does not influence, so the right price of refusing is
              the average, $11$.
          - text: >
              He has treated chance as an opponent: the offer is a coin flip
              independent of what you did, so refusing is worth its average,
              $11$.
            correct: true
            feedback: >
              Right. Optimal stopping is one agent against chance, so every
              continuation value is an expectation, never a best response.
          - text: >
              He should have used $16$, since you only refuse when you expect
              something better.
            feedback: >
              That swaps pessimism for wishful thinking. Refusing gets you
              whatever the coin produces: $6$ half the time and $16$ half the
              time.
        feedback: >
          In this case the colleague's answer still refuses the $4$, since
          $6 > 4$. Give today's buyer $8$ instead of $4$ and his rule would
          accept it, at a cost of $3$ on average against refusing.
      - ask: >
          Which pieces of information did you need to pin down before $11.5$
          was even a well-posed answer?
        choices:
          - text: >
              Only the two offer distributions.
            feedback: >
              The distributions alone did not settle it: with call-back the
              same distributions gave $12.5$, and with a third buyer the
              refusal of $12$ could be worth more than $11$.
          - text: >
              The distributions, plus how many buyers there are, whether you
              see the amount, and whether a refused buyer can be called back.
            correct: true
            feedback: >
              Horizon, observation and recall: three switches that turn the
              same English into different problems.
          - text: >
              The distributions and the number of buyers; the rest is detail.
            feedback: >
              Recall alone moved the answer from $11.5$ to $12.5$. And if you
              were told only whether tomorrow's offer beats today's, not the
              amount, rules like "accept $12$" could not even be written down.
        feedback: >
          Say the three switches aloud before the first equation: the
          horizon, what you observe, and whether a refusal can be undone.
      - teach: >
          In an interview, the setup is half the answer. "I'm choosing a
          stopping time — my decision at step $n$ can only use the first $n$
          observations — to maximize the expected payoff; finite horizon, I
          see values, no recall." Then check every rule anyone proposes for a
          peek at the future before you price it.

  - node: quant-processes.stopping.value-function
    hook: >
      This is the mechanical engine behind every rule in the unit: once you can write down $V_n$ and compare it against $Y_n$, "when should I stop" stops being a puzzle and becomes one inequality checked at every step.
    explanation: >
      $V_n$ is the best expected reward obtainable from time $n$ onward, given everything observed by then. At the deadline there is no choice left, so $V_N=Y_N$. Earlier, a rational decision-maker facing chance does exactly one of two things: bank $Y_n$, or continue and get whatever playing on optimally is worth in expectation, $\mathbb{E}[V_{n+1}\mid\mathcal{F}_n]$. $V_n$ is the better of these two numbers, and the optimal rule falls straight out: stop the first time the reward in hand meets or beats the continuation value.

      The subtlety worth internalizing is that $V_{n+1}$ already has every later decision baked in optimally — it is not "the average of what happens next," it is "the average of what happens next if you keep playing perfectly from here." That is what makes the recursion exact rather than a heuristic: comparing $Y_n$ to $V_{n+1}$ accounts for all remaining chances at once, not just the next one.

      $V_n$ can only drift downward in conditional expectation as time passes, since tomorrow's version of the game has strictly fewer chances left than today's — that "only shrinks" property is what the name supermartingale captures, and Snell envelope is just the name for the smallest such process sitting on top of the rewards.
    worked: >
      A coin pays $10$ dollars on heads (probability $0.4$) and $3$ on tails. With one flip, $V_1=\mathbb{E}[Y]=0.4(10)+0.6(3)=5.8$. With a second flip available, keep the first flip only if it clears $5.8$: heads ($10$) does, tails ($3$) doesn't, so $V_2 = 0.4(10)+0.6(5.8)=4+3.48=7.48$.
    interview: >
      Interviewers want $V_n$ and its boundary condition written down explicitly before any numbers, then the optimal rule stated as one comparison — "stop when $Y_n$ beats the continuation value" — not derived case by case.
    pitfalls: >
      Forgetting the boundary condition $V_N=Y_N$ — there is no continuation option at the deadline, you must accept whatever is in hand. Confusing the true continuation value $V_{n+1}$ with the value of just one more look, $\mathbb{E}[Y_{n+1}]$, understates continuing whenever more than one chance remains.
    recap: >
      $V_n=\max\left(Y_n,\mathbb{E}[V_{n+1}\mid\mathcal{F}_n]\right)$ with $V_N=Y_N$, and the optimal rule stops the moment $Y_n$ first meets the continuation value.
    dialogue:
      - part: A five in hand, two draws to go
        teach: >
          A machine pays $10$ with probability $0.2$, $5$ with probability
          $0.5$ and $0$ with probability $0.3$, independently on every draw.
          You get at most three draws. After each you either bank it and walk
          away, or discard it and draw again; the third draw must be banked.
          Your first draw shows $5$.
      - ask: >
          What is a single draw worth on average?
        expects: "4.5"
        feedback: >
          $0.2(10) + 0.5(5) + 0.3(0) = 2 + 2.5 + 0 = 4.5$.
      - ask: >
          A colleague says: "Bank the $5$. Discarding it gets you a draw worth
          $4.5$, and $5 > 4.5$." What has the comparison left out?
        choices:
          - text: >
              The chance of drawing a $0$, which makes discarding riskier than
              $4.5$ suggests.
            feedback: >
              The $0$ is already inside the $4.5$, weighted by its probability
              $0.3$. Risk is not the issue; the average itself is the wrong
              one.
          - text: >
              Nothing: $4.5$ is what the next draw is worth, so the comparison
              is right.
            feedback: >
              It is what the next draw is worth *if you must keep it*. You
              will not have to: a $0$ on the second draw can be thrown back for
              the third.
          - text: >
              The third draw: discarding the $5$ buys a second draw with a
              fallback behind it, not a single draw you must keep.
            correct: true
            feedback: >
              Right. Discarding buys the rest of the game, played well, and the
              rest of the game contains another decision.
        feedback: >
          To price the discard you need the value of a two-draw game, and that
          means deciding how you would play the second draw.
      - ask: >
          Suppose you discard and face the second draw, with the third behind
          it. Playing well — bank the second draw only if it beats what the
          third is worth — what is that two-draw game worth on average?
        expects: "5.85"
        hint: >
          The third draw is worth $4.5$. Which second-draw outcomes beat it?
        feedback: >
          Bank a $10$ or a $5$; throw back a $0$ for a third draw worth $4.5$.
          $0.2(10) + 0.5(5) + 0.3(4.5) = 2 + 2.5 + 1.35 = 5.85$. So the $5$ in
          hand should be discarded: $5 < 5.85$.
      - reflect: >
          The $5$ should have been compared with $5.85$, not $4.5$. Say in
          words what $5.85$ is, and why it had to be computed from the last
          draw backwards.
        answer: >
          It is the expected reward from the rest of the game *if every later
          decision is made optimally* — the continuation value, not the value
          of the next draw alone. It has to be built from the end because it
          contains those later decisions: you cannot know what the second
          draw is worth until you know what the third one is worth, and the
          third is the only one with no decision in it.

      - part: The value of the game from here
        teach: >
          Name it. With horizon $N$, let $V_n$ be the best expected reward
          obtainable from time $n$ on, given what you have seen. At the
          deadline $V_N = Y_N$, and earlier
          $V_n = \max\left(Y_n, \mathbb{E}[V_{n+1} \mid \mathcal{F}_n]\right)$.
          Here $\mathbb{E}[V_3] = 4.5$ and $\mathbb{E}[V_2] = 5.85$, and the
          optimal rule stops at the first $n$ with
          $Y_n \ge \mathbb{E}[V_{n+1} \mid \mathcal{F}_n]$.
      - ask: >
          Before the first draw, what is the whole three-draw game worth,
          $\mathbb{E}[V_1]$?
        expects: "6.68"
        hint: >
          On the first draw, which outcomes beat $5.85$?
        feedback: >
          Only a $10$ beats $5.85$. So
          $\mathbb{E}[V_1] = 0.2(10) + 0.8(5.85) = 2 + 4.68 = 6.68$. The
          ladder reads $4.5$, $5.85$, $6.68$, and a $5$ goes from "bank it"
          with two draws left to "throw it back" with three.
      - ask: >
          The first draw shows $10$. What is $V_1$ on that draw?
        choices:
          - text: >
              $6.68$
            feedback: >
              That is $\mathbb{E}[V_1]$, the game's value before you have seen
              anything. $V_1$ is a random variable: once the draw is known, so
              is $V_1$.
          - text: >
              $10$
            correct: true
            feedback: >
              $V_1 = \max(10, 5.85) = 10$. You bank it, and the game is worth
              exactly what you are holding.
          - text: >
              $5.85$
            feedback: >
              That is the continuation value — what discarding would be worth.
              With a $10$ in hand the better branch is stopping.
          - text: >
              $15.85$
            feedback: >
              You do not get both. $V_n$ is the better of stopping and
              continuing, never their sum.
        feedback: >
          $V_n$ depends on what you have seen. On a $0$ or a $5$, $V_1 = 5.85$;
          on a $10$, $V_1 = 10$. Averaging those gives back $6.68$.

      - part: Why the value only drifts down
        ask: >
          Why must $\mathbb{E}[V_{n+1} \mid \mathcal{F}_n] \le V_n$ hold at
          every $n$, in this game or any other?
        choices:
          - text: >
              Because rewards later in the game are smaller.
            feedback: >
              Here every draw has the same law, so later rewards are not
              smaller. The inequality comes from the recursion, not from the
              rewards.
          - text: >
              Because $V_n$ is the larger of $Y_n$ and
              $\mathbb{E}[V_{n+1} \mid \mathcal{F}_n]$, so it is at least the
              second of them.
            correct: true
            feedback: >
              One line: a maximum is at least each of its arguments. Having the
              option to stop now can only add value.
          - text: >
              It need not hold; $V_n$ can rise or fall in expectation.
            feedback: >
              The values $6.68 > 5.85 > 4.5$ already show the direction, and the
              recursion forces it every time.
        feedback: >
          A process that can only drift down in conditional expectation is a
          supermartingale, and $V_n$ is the smallest one sitting on top of the
          rewards: the Snell envelope. Each passing date takes one option away,
          never adds one.
      - ask: >
          A colleague sets up the same game with
          $V_3 = \max(Y_3, 4.5)$ "to be safe". What does that change?
        choices:
          - text: >
              Nothing, since $V_3$ is at least $Y_3$ anyway.
            feedback: >
              It changes $\mathbb{E}[V_3]$ from $4.5$ to $5.85$, and every
              earlier value moves with it.
          - text: >
              It invents a fourth draw: at the deadline there is nothing to
              continue into, so $V_3 = Y_3$ exactly.
            correct: true
            feedback: >
              Right. $\max(Y_3, 4.5)$ is the value of holding $Y_3$ with one
              more draw available — a four-draw game wearing a three-draw label.
          - text: >
              It makes the game more conservative, which lowers the value.
            feedback: >
              It raises the value, from $6.68$ to that of a four-draw game, by
              pretending you can throw back the final draw.
        feedback: >
          The boundary condition is where the horizon enters. Get it wrong and
          the whole recursion prices a different game.
      - teach: >
          The ten-second version: "$V_N = Y_N$; before that, $V_n$ is the max
          of the reward in hand and the expected value of continuing
          optimally; stop the first time the reward reaches the continuation
          value." The continuation value is never just the next draw's
          average while more than one draw remains.

  - node: quant-processes.stopping.backward-induction
    hook: >
      This is the value-function recursion turned into arithmetic: solve the decision you're most sure about — the very last one — first, then work backward one comparison at a time.
    explanation: >
      Every earlier value in the recursion needs the next one already known, so any order other than last-to-first requires guessing what you haven't computed yet. Name the state you carry into a stage — usually the reward currently in hand plus the number of chances left — then set the final stage's value to whatever you must accept there, since no further choice remains. Each earlier stage's value is the max of the reward in hand and the expectation of the stage after it, already solved.

      Because rewards here are typically numbers on a line, "stop or continue" collapses into a single threshold at each stage: accept anything at or above the continuation value, reroll or reject anything below it. Backward induction's real output is not one number but a ladder of thresholds, one per stage, that together implement the optimal rule.

      The mental model is ordinary dynamic programming, with one twist worth flagging: unlike a game tree, where you'd take the worst case over an adversary's replies, every continuation value here is a plain expectation over chance. Recognize the shape — a bounded number of remaining chances, a reward revealed one at a time — and backward induction is the default move.
    worked: >
      A bonus round pays $100$ (probability $0.2$), $60$ (probability $0.5$), or $20$ (probability $0.3$), for up to $3$ rounds; you must accept whatever the final round gives. Last round: $V=0.2(100)+0.5(60)+0.3(20)=56$. Two rounds left: accept anything $\ge 56$, so only $100$ and $60$ qualify, giving $V=0.2(100)+0.5(60)+0.3(56)=66.8$. Three rounds left: accept anything $\ge 66.8$, so only $100$ now qualifies, giving $V=0.2(100)+0.8(66.8)=73.44$ — notice $60$ was worth keeping with two rounds left but not with three, exactly because the continuation value itself climbed.
    interview: >
      "Walk me through solving this step by step" wants the last stage's value written first, with the boundary condition stated explicitly, then each earlier threshold produced by comparison — not an intuited final answer.
    pitfalls: >
      Solving stages out of order, or guessing an early threshold before the later stages that determine it, tangles the algebra. Reusing one stage's threshold at another stage assumes the continuation value is constant when it generally isn't — the whole point of the ladder is that it moves.
    recap: >
      Solve the last stage first, get one number, then compare each earlier stage's reward against that number to get a ladder of thresholds back to the start.
    dialogue:
      - part: Three days to sell a ticket
        teach: >
          You hold one concert ticket and three days to sell it. Each day one
          buyer makes one offer, accept or lose him. Day $1$: $90$ or $48$.
          Day $2$: $70$ or $20$. Day $3$, the day of the show: $50$ or $10$,
          and you must take it. Each pair is equally likely and the days are
          independent. On day $1$ the buyer offers $48$.
      - ask: >
          Refusing the $48$ sends you into day $2$. What is refusing actually
          worth?
        choices:
          - text: >
              $45$, the average of day $2$'s offers.
            feedback: >
              That assumes you would take day $2$'s offer whatever it is. You
              would not take a $20$ on day $2$ when day $3$ still averages $30$,
              so day $2$ is worth more than its average.
          - text: >
              $30$, the average of day $3$, since that is where you might end
              up.
            feedback: >
              You only reach day $3$ when day $2$ disappoints. Most of the
              time a good day-$2$ offer ends the sale first.
          - text: >
              More than $45$, because a $20$ on day $2$ would be refused in
              favour of day $3$.
            correct: true
            feedback: >
              Right. Day $2$ comes with its own decision, and that decision
              is worth something. To put a number on it you need day $3$
              first.
          - text: >
              $90$, since that is what you are holding out for.
            feedback: >
              $90$ only appears on day $1$, and you have just been offered
              $48$ instead. Refusing gets you days $2$ and $3$, not another
              shot at $90$.
        feedback: >
          The value of refusing depends on how you would play the later days,
          so the day-$1$ question cannot be answered on day $1$'s terms alone.
      - ask: >
          One way to settle it is brute force. A rule says, for each of days
          $1$ and $2$, which of that day's two offers you would accept — any
          subset, including none or both. How many rules are there?
        expects: "16"
        hint: >
          Count the subsets of a two-element set, once per day.
        feedback: >
          Each day has $2^{2} = 4$ choices, so $4 \times 4 = 16$ rules, each
          to be averaged over $8$ offer sequences. Ten days with five offers
          a day would give $(2^{5})^{9} = 2^{45}$ rules — about $3.5 \times
          10^{13}$.
      - reflect: >
          Most of that enumeration is wasted work. Once you are standing on
          day $2$, does your best day-$2$ decision depend on what you did on
          day $1$? Which day can you settle completely before thinking about
          any other, and what does it hand to the day before it?
        answer: >
          No — day $1$ is sunk; on day $2$ the best choice depends only on
          day $2$'s offer and on what day $3$ is worth. Day $3$ has no
          decision at all, so it can be settled first: it is worth $30$.
          That one number turns day $2$ into a single comparison, which
          produces day $2$'s value, which turns day $1$ into a single
          comparison. Instead of $16$ rules you make one comparison per day.

      - part: Solve the last day first
        teach: >
          That is backward induction. Name the state you carry into a stage —
          here the offer in hand and the days left. Write the final stage's
          value, where you must accept. For each earlier stage compute the
          continuation value $\mathbb{E}[V_{n+1}]$ and stop exactly when the
          offer reaches it, which is a threshold. Recurse to stage $1$: you get
          the game's price and the thresholds that achieve it.
      - ask: >
          On the morning of day $2$, before the buyer arrives, what is the
          ticket worth?
        expects: "50"
        hint: >
          Day $3$ is worth $(50 + 10)/2 = 30$. Which day-$2$ offers beat $30$?
        feedback: >
          Accept $70$; refuse $20$ for a day-$3$ value of $30$.
          $0.5(70) + 0.5(30) = 35 + 15 = 50$. Day $2$'s offers average only
          $45$; the option to refuse a $20$ adds $5$.
      - ask: >
          So which day-$1$ offers should you accept?
        choices:
          - text: >
              Both: each beats day $2$'s average offer of $45$.
            feedback: >
              The bar is not $45$ but $50$, the value of day $2$ played well.
              A $48$ falls short of it by $2$.
          - text: >
              Only the $90$.
            correct: true
            feedback: >
              $90 \ge 50$ is kept and $48 < 50$ is refused. The day-$1$
              threshold is the day-$2$ value.
          - text: >
              Neither: something better might come later.
            feedback: >
              Nothing later is worth more than $50$ on average, and $90$ beats
              that comfortably. Refusing $90$ throws away $40$ in expectation.
        feedback: >
          The thresholds read $50$ on day $1$, $30$ on day $2$, and "anything"
          on day $3$ — falling as the days run out.
      - ask: >
          What is the whole sale worth on the morning of day $1$?
        expects: "70"
        feedback: >
          $0.5(90) + 0.5(50) = 45 + 25 = 70$: keep a $90$, otherwise carry on
          into a day $2$ worth $50$.
      - ask: >
          A colleague skips the backward pass and accepts on day $1$ any offer
          above $45$, day $2$'s average offer. What does his rule earn?
        expects: "69"
        hint: >
          Under his rule, does he ever reach day $2$?
        feedback: >
          Both day-$1$ offers clear $45$, so he always sells on day $1$:
          $0.5(90) + 0.5(48) = 69$. He loses $1$ on average by valuing day $2$
          as if it had no decision in it.

      - part: Expectations, not opponents
        ask: >
          Another colleague insists on "rigour": since you cannot know day
          $2$'s offer, value refusing at the worst case, $20$. Why is that the
          wrong recursion here?
        choices:
          - text: >
              It is not wrong, just conservative; it gives a lower bound.
            feedback: >
              It is a lower bound on what refusing pays, and it is also a
              different rule: it would accept the $48$ because $48 > 20$,
              and earn $69$ instead of $70$.
          - text: >
              The offers are set by chance, not by an opponent reacting to
              you, so each continuation value is an average.
            correct: true
            feedback: >
              Right. Worst-case backward induction is the game-tree recursion,
              for when someone chooses the outcome against you. Here a coin
              does.
          - text: >
              He should use the best case, $70$, since you only refuse when
              you expect better.
            feedback: >
              Swapping pessimism for optimism is no fix. The coin gives $70$
              half the time and $20$ half the time; the value is the optimal
              play averaged over both.
        feedback: >
          Same machine, one difference from a game tree: at each stage you
          take an expectation over chance, not a minimum over replies.
      - ask: >
          Change one number: a promoter guarantees $40$ on the day of the show.
          Redo the pass. What is the sale worth on day $1$ now?
        expects: "72.5"
        hint: >
          Start at day $3$ again. Every value upstream moves.
        feedback: >
          Day $3$ is worth $40$. Day $2$: accept $70$, refuse $20$, so
          $0.5(70) + 0.5(40) = 55$. Day $1$: accept $90$, refuse $48$, so
          $0.5(90) + 0.5(55) = 72.5$. A change at the last stage reprices
          every threshold before it.
      - teach: >
          Said aloud: "Last day, I take whatever comes — worth $30$. Day two,
          I accept anything at least $30$, so it's worth $50$. Day one, I
          accept anything at least $50$, so the sale is worth $70$." One
          number per stage, each built from the one after it.

  - node: quant-processes.stopping.dice-game
    hook: >
      The interview version of the reroll ladder is almost always this exact die, and reciting $3.5$ / $4.25$ / $14/3$ without being able to rebuild the reasoning live is a tell that you memorized rather than derived it.
    explanation: >
      Applying backward induction to a fair die is mechanical once you see the pattern. With one roll you must accept whatever comes, so $V_1$ is just the die's mean, $3.5$. With one extra chance, reroll only if the first roll falls below the value of that one guaranteed extra roll — keep $4,5,6$, reroll $1,2,3$ — which is the threshold rule from backward induction applied to two stages.

      Extending to three rolls, the continuation value has already risen to $4.25$, so the first roll gets pickier and keeps only $5,6$; the second roll of the three, now facing exactly the two-roll problem, reverts to keeping $4$ and up. That's the general fact worth keeping: the threshold rises the further you are from the deadline and falls as chances run out, because more remaining patience makes settling for a mediocre face less attractive.

      Recognize this shape — "you may redraw up to $k$ times, keep whichever you finally accept" — whenever it appears, whatever the underlying prize is. The recipe never changes: compute the base case, then repeatedly fold in "the expected value of the better of a fresh draw and the previous stage's value."
    worked: >
      Redo the ladder for a fair $8$-sided die with only two rolls allowed. One roll: $V_1=(1+\dots+8)/8=4.5$. Two rolls: keep the first roll if it's at least $4.5$, i.e. keep $\{5,6,7,8\}$ and reroll $\{1,2,3,4\}$, giving $V_2=\frac{5+6+7+8}{8}+\frac{4}{8}(4.5)=3.25+2.25=5.5$.
    interview: >
      "You roll a die, you may reroll up to twice, keeping your final face — what's the expected value with optimal play?" wants backward induction narrated stage by stage, with the accept threshold stated explicitly at each one, not a guessed number.
    pitfalls: >
      Applying the same threshold at every stage — comparing the first roll of three against the one-roll value $3.5$ instead of the two-roll value $4.25$ — undercounts the game's true value. Averaging over the reroll outcome incorrectly, by forgetting that a rerolled face is itself governed by the previous stage's value rather than the die's flat mean, breaks the recursion.
    recap: >
      Backward induction on a fair die gives $V_1=3.5$, $V_2=4.25$ ("keep $4$+"), $V_3=14/3\approx4.67$ ("keep $5$+, then $4$+") — thresholds that get pickier the more chances remain.
    dialogue:
      - part: One roll, then two
        teach: >
          An interviewer hands you a fair twenty-sided die, faces $1$ to $20$,
          and pays you the face you finally keep. You may roll up to three
          times; after each roll you keep it and stop, or roll again, and the
          last roll must be kept. Start smaller: what if you only had one
          roll?
      - ask: >
          With exactly one roll, what is the game worth?
        expects: "10.5"
        feedback: >
          The mean face: $(1 + 20)/2 = 10.5$. With one roll there is no
          decision, so $V_1 = 10.5$.
      - ask: >
          Now two rolls. Which first rolls should you keep?
        choices:
          - text: >
              $10$ and up: anything in the top half.
            feedback: >
              A $10$ is in the top half of the faces but below $10.5$, the
              value of the roll you still have. Keeping it gives up $0.5$ on
              average.
          - text: >
              $16$ and up: be picky, keep only the top quarter.
            feedback: >
              Picky pays only if what you fall back on is good, and here it is
              one roll worth $10.5$. Keeping $16$ and up earns
              $90/20 + (15/20)(10.5) = 12.375$, less than keeping $11$ and up.
          - text: >
              $11$ and up.
            correct: true
            feedback: >
              These are exactly the faces above $10.5$, the value of the roll
              you would get by rerolling.
          - text: >
              Anything but a $1$.
            feedback: >
              A $5$ is far below the $10.5$ a reroll is worth on average.
              Keeping it costs $5.5$ in expectation.
        feedback: >
          Keep the first roll exactly when it beats the value of what rerolling
          leads to — here a single roll worth $10.5$.
      - ask: >
          What is the two-roll game worth?
        expects: "13"
        hint: >
          Kept faces contribute their sum over $20$; rerolls contribute their
          probability times $10.5$.
        feedback: >
          $11 + 12 + \dots + 20 = 155$, so kept faces give $155/20 = 7.75$;
          the other $10$ faces reroll into $10.5$, giving
          $(10/20)(10.5) = 5.25$. $V_2 = 7.75 + 5.25 = 13$.

      - part: Three rolls and a moving bar
        ask: >
          With three rolls, a friend keeps the first roll whenever it shows
          $11$ or more, "same as before". What has he missed?
        choices:
          - text: >
              Nothing: the die has not changed, so neither has the bar.
            feedback: >
              The die has not changed, but what rerolling buys has. A reroll
              now leads into a game with two rolls left.
          - text: >
              With more rolls left you should be *less* picky, since you have
              more chances to fix a bad roll.
            feedback: >
              More chances make a reroll more valuable, which makes a mediocre
              face *less* worth keeping. The bar goes up, not down.
          - text: >
              Rerolling the first of three rolls leads into the two-roll game,
              worth $13$, not into a single roll worth $10.5$.
            correct: true
            feedback: >
              Right. The bar for the first roll is the value of the game you
              would enter by rerolling, and that game just got better.
        feedback: >
          At each roll the comparison is the same — keep it if it beats the
          game behind it — but the game behind it depends on how many rolls
          remain.
      - reflect: >
          Before computing anything: your first of three rolls shows $12$.
          Your friend keeps it. What do you compare $12$ with, what do you do,
          and what does that say about the bar as more rolls remain?
        answer: >
          Compare $12$ with $13$, the value of the two-roll game that a reroll
          leads into: $12 < 13$, so reroll. The bar at each roll is the value
          of the game with one fewer roll, and that value climbs with every
          roll you add. So the thresholds are high early and fall as the
          rolls run out: be fussy early, accept anything at the end.
      - teach: >
          That is the ladder: $V_{k}$ is the expected value of the better of a
          fresh roll and $V_{k-1}$, and with $k$ rolls left you keep a face
          exactly when it is at least $V_{k-1}$. On a six-sided die the same
          ladder reads $3.5$, $4.25$, $14/3$. On this die you have
          $V_1 = 10.5$ and $V_2 = 13$ so far.
      - ask: >
          With three rolls, the first roll should be kept when it is at least
          what number?
        expects: "13"
        feedback: >
          The bar is $V_2 = 13$. A $13$ sits exactly on it: keeping or
          rerolling it gives the same expected value, so you may count it
          either way. Every face from $14$ up is kept; $12$ and below are
          rerolled.
      - ask: >
          What is the three-roll game worth?
        expects: "14.4"
        hint: >
          Kept faces $13$ to $20$ contribute their sum over $20$; the other
          twelve faces reroll into the two-roll game.
        feedback: >
          $13 + 14 + \dots + 20 = 132$, giving $132/20 = 6.6$; the other $12$
          faces reroll into $V_2 = 13$, giving $(12/20)(13) = 7.8$.
          $V_3 = 6.6 + 7.8 = 14.4$.
      - ask: >
          You rerolled the first roll. Which second rolls should you keep?
        choices:
          - text: >
              $13$ and up, the three-roll bar.
            feedback: >
              The three-roll bar was for the roll with two rolls behind it.
              Your second roll has only one roll behind it, worth $10.5$.
          - text: >
              $11$ and up.
            correct: true
            feedback: >
              You are now in exactly the two-roll game, and its bar is $10.5$.
              The threshold falls back as the rolls run out.
          - text: >
              $15$ and up, since you have already used a roll.
            feedback: >
              The used roll is sunk. What matters is what remains: one roll,
              worth $10.5$.
        feedback: >
          The policy for three rolls: keep $13$ or more on the first roll,
          $11$ or more on the second, anything on the third.

      - part: The slip that costs a point
        ask: >
          A candidate keeps $13$ and up on the first of three rolls but values
          a reroll at $10.5$, the die's mean. What number does he report for
          the game?
        expects: "12.9"
        hint: >
          Same kept faces, but the twelve rerolled faces are each worth
          $10.5$ in his sum.
        feedback: >
          $6.6 + (12/20)(10.5) = 6.6 + 6.3 = 12.9$. That is *less* than the
          two-roll value $13$, which is absurd: an extra roll can never make
          the game worth less. A rerolled face leads into the previous rung of
          the ladder, not to the die's flat mean.
      - teach: >
          The interview version: "One roll, $10.5$. Two rolls, keep $11$ and
          up, worth $13$. Three rolls, keep $13$ and up first, then $11$ and
          up, worth $14.4$." And the sanity check that catches most slips: the
          ladder must climb.

  - node: quant-processes.stopping.dice-ladder-limit
    hook: >
      This two-branch recursion is worth having cold — it tells you not just that unlimited rerolls approach $6$, but exactly how fast, which is the number an interviewer actually wants when they ask how many rerolls before you're basically guaranteed near the top.
    explanation: >
      One more roll always buys the better of the fresh face and the old game, so $V_{k+1}=\mathbb{E}[\max(X,V_k)]$ generalizes the same move used to build $V_2$ and $V_3$. As $V_k$ climbs past $4$ and then past $5$, fewer faces clear the bar, so which faces get kept — and hence which linear recursion applies — changes with $V_k$ itself.

      While $4<V_k<5$, only $5$ and $6$ beat the continuation value, giving $V_{k+1}=\frac{11}{6}+\frac{2}{3}V_k$. Once $V_k>5$, only a $6$ is worth keeping, giving $V_{k+1}=1+\frac{5}{6}V_k$ — and this second recursion has $6$ as its own fixed point ($6=1+\frac56\cdot6$), so $6-V_{k+1}=\frac56(6-V_k)$: the gap to $6$ shrinks by a constant factor every extra roll, geometric decay rather than ever reaching the ceiling exactly.

      The mental model: unlimited free rerolls with no deadline is what "wait for a $6$" looks like when you arrive at it through finite-horizon machinery instead of assuming it — the ceiling and the $5/6$-per-roll decay rate both fall straight out of the same backward-induction reasoning already built for two and three rolls.
    worked: >
      Continue past $V_5=277/54\approx5.130$, which already exceeds $5$, using $V_{k+1}=1+\frac56V_k$: $V_6\approx5.275$, $V_7\approx5.396$, $V_8\approx5.496$, $V_9\approx5.580$. So it takes $9$ rolls of patience before the expected value first climbs past $5.5$.
    interview: >
      "Does letting the reroll count go to infinity ever actually beat just waiting for a six?" wants the two-regime recursion named and the ceiling identified as exactly $6$, approached geometrically at rate $5/6$ per roll, not a vague "it gets close."
    pitfalls: >
      Applying the $4<V_k<5$ recursion once $V_k$ has already crossed $5$ uses the wrong kept set and derails the whole trajectory. Treating the limit as reached in finitely many rolls, rather than only approached, misstates what geometric convergence means — $V_k<6$ for every finite $k$.
    recap: >
      Past $V_k=5$ the recursion is $V_{k+1}=1+\frac56V_k$, so $6-V_k$ shrinks by a factor of $5/6$ every extra roll on the way to the ceiling of $6$.
    dialogue:
      - part: A spinner and more spins
        teach: >
          A fair spinner shows $1$, $2$, $3$, $4$ or $5$ and pays the number
          you finally keep. With $k$ spins allowed you may keep any spin and
          stop, or spin again; the last spin must be kept. Call the game's
          value $V_k$. One spin is worth the mean, $V_1 = 3$.
      - ask: >
          What is $V_2$?
        expects: "3.6"
        hint: >
          Keep the first spin when it beats $3$; otherwise the second spin is
          worth $3$.
        feedback: >
          Keep $4$ or $5$; on $1$, $2$ or $3$ spin again for $3$ (a $3$ is a
          tie, so either choice gives the same). $V_2 = (3 + 3 + 3 + 4 + 5)/5
          = 18/5 = 3.6$.
      - ask: >
          Predict before computing more: with unlimited free spins, what is
          the game worth?
        choices:
          - text: >
              It grows without limit as spins are added.
            feedback: >
              You can never keep more than $5$, so no number of spins pushes
              the value past $5$.
          - text: >
              $5$: with spins to spare, simply wait for a $5$.
            correct: true
            feedback: >
              Right. Waiting for a $5$ always works with no deadline, and
              nothing pays more. The question worth an interview is how fast
              the finite ladder gets there.
          - text: >
              About $4.5$, halfway between keeping $4$s and $5$s.
            feedback: >
              With unlimited spins there is no reason to settle for a $4$:
              another spin is free and a $5$ comes eventually.
        feedback: >
          The limit is the top face. The interesting part is the route: how
          the kept set shrinks and how quickly the gap to $5$ closes.
      - ask: >
          What is $V_3$?
        expects: "3.96"
        hint: >
          Now the bar is $V_2 = 3.6$. Which faces clear it?
        feedback: >
          Faces $4$ and $5$ clear $3.6$; faces $1$ to $3$ spin again into
          $V_2$. $V_3 = (3 \times 3.6 + 4 + 5)/5 = (10.8 + 9)/5 = 3.96$.

      - part: One more spin, one formula
        reflect: >
          You computed $V_2$ and $V_3$ by the same move. Write $V_{k+1}$ in
          terms of $V_k$, and say at what point the formula's *shape* has to
          change.
        answer: >
          One more spin buys the better of a fresh spin and the old game, so
          $V_{k+1} = \mathbb{E}[\max(X, V_k)]$. While the set of faces above
          $V_k$ stays the same, this is a fixed linear function of $V_k$:
          kept faces contribute their own values and the rest contribute
          $V_k$. The shape changes when $V_k$ crosses a face — here when it
          passes $4$, after which a $4$ is no longer worth keeping.
      - teach: >
          That is the proposition. $V_{k+1} = \mathbb{E}[\max(X, V_k)]$, and it
          is piecewise linear in $V_k$. Here, while $3 < V_k < 4$ only $4$
          and $5$ are kept: $V_{k+1} = \frac{9}{5} + \frac{3}{5}V_k$. Once
          $V_k > 4$ only a $5$ is kept: $V_{k+1} = 1 + \frac{4}{5}V_k$. On a
          six-sided die the same two regimes sit between $4$ and $5$ and
          above $5$.
      - ask: >
          Iterated forever, the first formula would settle at its fixed point.
          Where is that, and what does it tell you about the ladder?
        choices:
          - text: >
              At $4$, so the ladder stalls just below $4$.
            feedback: >
              Solve $V = \frac{9}{5} + \frac{3}{5}V$: it gives $V = 4.5$, not
              $4$. Nothing stops the ladder at $4$.
          - text: >
              At $4.5$; since that lies above $4$, the ladder must cross $4$
              and switch formulas.
            correct: true
            feedback: >
              Right. The first regime is pulling toward $4.5$, so it carries
              $V_k$ past $4$, at which point the first formula no longer
              applies.
          - text: >
              At $5$, the top face.
            feedback: >
              $5$ is the fixed point of the *second* formula,
              $5 = 1 + \frac{4}{5}(5)$. The first one aims at $4.5$.
        feedback: >
          Each regime aims at a fixed point beyond its own boundary, so the
          ladder is handed from one regime to the next until it reaches the
          last one, whose fixed point is the top face.
      - ask: >
          What is $V_4$?
        expects: "4.176"
        tolerance: 0.0005
        feedback: >
          $V_3 = 3.96$ is still below $4$, so the first formula applies:
          $\frac{9}{5} + \frac{3}{5}(3.96) = 1.8 + 2.376 = 4.176$. The ladder
          has crossed $4$.
      - ask: >
          What is $V_5$?
        expects: "4.3408"
        tolerance: 0.0005
        hint: >
          Which regime are you in now?
        feedback: >
          $V_4 > 4$, so only a $5$ is kept:
          $1 + \frac{4}{5}(4.176) = 1 + 3.3408 = 4.3408$.

      - part: How fast the gap closes
        ask: >
          Divide the gap $5 - V_5$ by the gap $5 - V_4$. What do you get?
        expects: "0.8"
        feedback: >
          $5 - V_5 = 0.6592$ and $5 - V_4 = 0.824$, and
          $0.6592/0.824 = 0.8$. Every further spin multiplies the gap by the
          same factor.
      - ask: >
          Why exactly $4/5$?
        choices:
          - text: >
              Because $4/5$ of the faces are below $5$, and a spin that misses
              the $5$ leaves you with the old game.
            correct: true
            feedback: >
              Right. Subtract $5 = 1 + \frac{4}{5}(5)$ from
              $V_{k+1} = 1 + \frac{4}{5}V_k$ to get
              $5 - V_{k+1} = \frac{4}{5}(5 - V_k)$: the gap survives only when
              the spin misses, with probability $4/5$.
          - text: >
              Because the spinner's mean, $3$, is $3/5$ of the way to $5$.
            feedback: >
              That would give $3/5$, the slope of the *first* regime. In the
              last regime only the chance of missing the top face matters.
          - text: >
              It is a coincidence of these particular values of $V_k$.
            feedback: >
              The identity $5 - V_{k+1} = \frac{4}{5}(5 - V_k)$ holds for
              every $V_k > 4$. Any two consecutive gaps in this regime have
              ratio $4/5$.
        feedback: >
          Geometric decay: $V_k$ approaches $5$ but is below it for every
          finite $k$. On a six-sided die the factor is $5/6$, the chance of
          missing the $6$.
      - ask: >
          A colleague reports $V_5 = 4.3056$. What did he do?
        choices:
          - text: >
              He used the first formula after $V_4$ had passed $4$, so he kept
              a $4$ that is worth less than the game behind it.
            correct: true
            feedback: >
              $\frac{9}{5} + \frac{3}{5}(4.176) = 4.3056$. Keeping a $4$ when
              rerolling is worth $4.176$ throws value away, which is why his
              number is low.
          - text: >
              He forgot to keep the $5$.
            feedback: >
              Spinning past a $5$ would push his number down to about $4.14$.
              His $4.3056$ is exactly what keeping *both* $4$ and $5$ gives.
          - text: >
              Nothing; the two formulas agree near $4$.
            feedback: >
              They agree exactly at $V_k = 4$ and nowhere else above it. At
              $4.176$ they differ by $0.0352$.
        feedback: >
          Check which side of each face you are on before picking the formula.
          The kept set is decided by $V_k$, and $V_k$ moves.
      - teach: >
          Said aloud: "Each extra roll gives $\mathbb{E}[\max(X, V_k)]$.
          Once you only keep the top face, the shortfall to the top shrinks by
          the chance of missing it — $5/6$ per roll on a normal die — so the
          value approaches $6$ geometrically and never reaches it."

  - node: quant-processes.stopping.one-step-lookahead
    hook: >
      This shortcut is what makes long or infinite-horizon stopping problems tractable at all — every reroll-with-a-fee or search-with-a-cost question in this unit reduces to this one-line comparison.
    explanation: >
      Full backward induction needs a last stage to start from, so it fails outright once the horizon is long or has no end. One-step lookahead substitutes the true continuation value — which in principle needs the entire remaining optimal policy — with a far cheaper proxy: the value of taking exactly one more observation and then stopping. Stop the moment the reward in hand is at least that proxy, net of whatever continuing costs. In a search with a fee $c$ per look, price the extra look as an option on top of the offer $x$ you hold, not a replacement for it: one more look and then stopping is worth $\mathbb{E}[\max(x, Y)] - c$, so keep looking only while the expected improvement $\mathbb{E}[(Y-x)^{+}]$ exceeds $c$.

      Equivalently, name $B$ the set of situations where one more look doesn't pay for itself, and stop the first time you enter $B$. The substitution is reasonable because most of the benefit of continuing typically comes from the very next observation, with returns shrinking fast after that — sometimes this shortcut is only a good guess, and sometimes it is exactly optimal, which is what a closed absorption region pins down.

      Reach for this the instant a problem says "you may keep searching as long as you like" or "each extra look costs a fee" — that phrasing is the signal that full backward induction, which needs a hard endpoint, is off the table.
    worked: >
      Offers arrive i.i.d., worth $0$, $5$, or $10$ with equal probability, and each additional look costs $2$. Holding $0$, one more look improves you by $\mathbb{E}[(Y-0)^{+}]=5>2$, so look again; holding $5$, the improvement is $\tfrac13(5)\approx1.67<2$, so stop; holding $10$, it is $0$. Accept $5$ or $10$ and reject only $0$.
    interview: >
      "When does it stop being worth searching further?" wants the one-step comparison — expected improvement $\mathbb{E}[(Y-x)^{+}]$ against the cost of one more look — stated directly, with the resulting accept set named as a threshold, not a full re-derivation of the value function.
    pitfalls: >
      Comparing the offer in hand against $\mathbb{E}[Y_{n+1}]-c$ prices the next draw as a forced replacement rather than an option, so it stops too early from a middling offer. Treating the lookahead answer as automatically exact is the most common overreach — in general it is only a heuristic.
    recap: >
      Stop as soon as one more observation no longer pays for itself — expected improvement over what you hold, net of cost — cheap to compute, and sometimes exactly right.
    dialogue:
      - part: A bike, a fee, and no deadline
        teach: >
          You are selling a bike online. Each day the listing costs $5$ and
          brings one offer: $20$, $40$, $60$ or $100$, equally likely,
          independent from day to day. Buyers are patient: the best offer so
          far stays open. There is no deadline. Today's offer is $60$.
      - ask: >
          Backward induction starts by pricing the last stage. Where is it
          here?
        choices:
          - text: >
              The day a $100$ arrives, since nothing beats it.
            feedback: >
              That is a good day to stop, but it is a random day, not a final
              stage. Backward induction needs a date after which no choice
              remains, known in advance.
          - text: >
              There is none: any day can be followed by another, so there is
              nowhere to start the backward pass.
            correct: true
            feedback: >
              Right. The fee keeps the search from running forever, but it does
              not create a last day to anchor the recursion.
          - text: >
              Pick a cutoff, say $30$ days, and treat day $30$ as the last.
            feedback: >
              That solves a different problem, one with a deadline. It might
              approximate this one, at the cost of $30$ stages of arithmetic
              and an error you cannot see.
        feedback: >
          With no last stage, the true continuation value — the whole future
          played optimally — is out of reach by the usual route. You need a
          cheaper number to compare the $60$ against.
      - ask: >
          Here is a cheap one. Suppose you keep the listing up for exactly one
          more day and then sell to the best offer you hold. What is that worth
          on average, after the fee?
        expects: "65"
        hint: >
          You end up with the larger of $60$ and tomorrow's offer.
        feedback: >
          Tomorrow's offer of $20$, $40$ or $60$ leaves you at $60$; a $100$
          lifts you to $100$. $(60 + 60 + 60 + 100)/4 - 5 = 70 - 5 = 65$. That
          beats selling now at $60$, so one more day pays.
      - ask: >
          A colleague does it differently: "Tomorrow's offer averages $55$;
          minus the $5$ fee that's $50$; $60$ beats $50$, so sell." Why does
          his number differ from yours?
        choices:
          - text: >
              He forgot the fee.
            feedback: >
              He subtracted it. His $50$ is the average offer minus the fee;
              the problem is the $55$.
          - text: >
              He priced tomorrow's offer as a replacement for the $60$; in fact
              you keep the $60$ when tomorrow is worse, so only the upside
              counts.
            correct: true
            feedback: >
              Right. Waiting one more day risks nothing you hold; it only adds
              the chance of something better. Pricing the next offer as if you
              had to take it throws away the $60$ in three cases out of four.
          - text: >
              His number is right; yours double-counts the $60$.
            feedback: >
              In three of four cases you really do end tomorrow holding $60$.
              Counting it there is not double-counting; replacing it by a $20$
              or $40$ would be an error.
        feedback: >
          Price the extra look as an option on top of what you hold, not as a
          swap for it.
      - reflect: >
          Rewrite the comparison "sell now at $x$" versus "one more look, then
          sell to the best" so it is about the *improvement* alone. What must
          the expected improvement beat for another look to be worth it?
        answer: >
          One more look then stopping is worth $\mathbb{E}[\max(x, Y)] - c$,
          and $\max(x, Y) = x + (Y - x)^{+}$. So it beats stopping exactly when
          $\mathbb{E}[(Y - x)^{+}] > c$: the expected amount by which the next
          offer improves on what you hold must exceed the cost of seeing it.
          At $x = 60$ that improvement is $10$ against a fee of $5$.

      - part: One more look, then stop
        teach: >
          That is one-step lookahead. Replace the true continuation value,
          which needs the whole optimal future, by the value of exactly one
          more observation and then stopping; stop the first time the reward in
          hand is at least that. Equivalently, let $B$ be the set of states in
          which one more look does not pay for itself, and stop on first entry
          into $B$. Here $B$ is the set of holdings $x$ with
          $\mathbb{E}[(Y - x)^{+}] \le 5$.
      - ask: >
          Which holdings are in $B$?
        choices:
          - text: >
              $60$ and $100$
            feedback: >
              At $60$ the expected improvement is $(100 - 60)/4 = 10$, which
              beats the fee of $5$. A $60$ is not yet a place to stop.
          - text: >
              Only $100$
            correct: true
            feedback: >
              At $100$ nothing can improve on you, so the improvement is $0$.
              At $60$ it is $10$, at $40$ it is $20$, at $20$ it is $35$ — all
              above $5$.
          - text: >
              $40$, $60$ and $100$: everything above the average offer
            feedback: >
              The average offer, $55$, is not the bar. At $40$ the expected
              improvement is $(20 + 60)/4 = 20$, four times the fee.
        feedback: >
          The rule is: keep listing until a $100$ arrives. The bar sits far
          above the average offer because each look is cheap relative to the
          spread of offers.
      - ask: >
          Holding $60$ today, what does "keep listing until a $100$ arrives"
          earn on average, net of fees?
        expects: "80"
        hint: >
          Each day a $100$ arrives with probability $1/4$. How many days of
          fees do you expect to pay?
        feedback: >
          The number of further days is geometric with success probability
          $1/4$, so it averages $4$, costing $4 \times 5 = 20$. You then sell
          at $100$: $100 - 20 = 80$, against $60$ for selling now and $50$ by
          the colleague's reckoning of waiting.

      - part: Which details the rule cares about
        ask: >
          Now buyers walk away the moment you pass on them: no recall. What
          happens to the rule "keep listing until a $100$ arrives"?
        choices:
          - text: >
              It loses value, because you no longer have the $60$ as a safety
              net.
            feedback: >
              The rule never used the safety net. It sells on the day a $100$
              arrives, to the buyer making that offer, and never reaches back
              for an older one.
          - text: >
              It must be loosened to accept $60$, since a refused $60$ is gone
              forever.
            feedback: >
              Losing a refused $60$ costs nothing to a rule that was never going
              to take it. The comparison at $60$ is the same: improvement $10$
              against a fee of $5$.
          - text: >
              Nothing: it never goes back for an earlier offer, so it earns the
              same with or without recall.
            correct: true
            feedback: >
              Right. A rule that waits for one fixed bar only ever accepts the
              offer in front of it, so recall is never exercised. That is why
              fee searches can be priced as if the best offer stayed open.
        feedback: >
          Recall matters to rules that want to go back. A single fixed bar
          never does.
      - ask: >
          Different setup: no fee, no recall, but the bike must be sold within
          $3$ days. Today, day $1$, the offer is $60$. Now one more look then
          stopping means taking tomorrow's offer, worth $55$, so lookahead says
          sell. What is refusing actually worth, if you play days $2$ and $3$
          well?
        expects: "67.5"
        hint: >
          Day $3$ is worth $55$. On day $2$, which offers beat $55$?
        feedback: >
          On day $2$, accept $60$ or $100$ and refuse $20$ or $40$ for day $3$'s
          $55$: $(55 + 55 + 60 + 100)/4 = 67.5$. Refusing beats $60$, so
          lookahead's "sell" is wrong here: it looked one day ahead when two
          remained.
      - teach: >
          So lookahead is cheap and, in general, only a heuristic. For the
          bike with a fee its answer is in fact optimal; for the bike with a
          deadline it was wrong by $7.5$. What separates the two cases is the subject of "When
          one-step lookahead is optimal: monotone problems". In an interview:
          "I'd keep searching while the expected improvement from one more look
          beats its cost."

  - node: quant-processes.stopping.monotone-case
    hook: >
      This is the fine print that tells you whether one-step lookahead is the actual optimal rule or merely a plausible guess — and the reroll ladder is the standard case where guessing costs real value.
    explanation: >
      Call a problem monotone if the "don't bother continuing" region $B$ is closed: once the process lands in $B$, it never leaves. The clean case is a per-look game with a fixed cost against draws from a fixed law — the comparison "is one more look worth it" is the identical computation at every visit, so $B$ can't depend on how many looks have already happened or how many remain.

      Closedness is what forces exactness. If landing in $B$ means every possible future also stays in $B$, no strategy that plans further ahead can ever escape back into "keep going" territory, so there is nothing further-lookahead reasoning could have bought you — the one-step comparison has already accounted for everything relevant, by induction backward from any horizon you like.

      The finite free-reroll ladder is the counterexample worth keeping: its true accept region shifts with how many rolls remain — keep $4$+ with two left, but only $5$+ with three — so a single fixed threshold can't be closed. A per-look fee game, by contrast, is stationary: nothing about the decision changes between visits, so the same threshold solves it forever via a single self-referential equation, $V=\mathbb{E}[\max(X,V-c)]$, rather than a shrinking ladder.
    worked: >
      Take a fee-based reroll game, fee $c=1$, on a fair $4$-sided die. Guessing the accept set $\{2,3,4\}$: $V=\frac{2+3+4}{4}+\frac14(V-1)=2+\frac{V}{4}$, so $V=8/3\approx2.67$. The resulting threshold $V-c=5/3\approx1.67$ does keep exactly $\{2,3,4\}$, confirming the guess — the same accept set works at every visit, exactly as closedness predicts.
    interview: >
      "Is greedy optimal here?" wants you to check whether the stop region can be exited once entered, not assume a heuristic is exact by default; a fixed per-look cost against i.i.d. draws is the canonical monotone example to cite.
    pitfalls: >
      Assuming a lookahead-derived threshold is automatically optimal without checking closedness silently fails on any problem with a shrinking horizon, like the plain reroll ladder. Assuming "one threshold works forever" from a stationary fee game carries over to a game whose fee or underlying law changes over time — it doesn't.
    recap: >
      Lookahead is exactly optimal when the "stop" region can't be exited once entered; the reroll ladder fails this, a stationary per-look fee game satisfies it automatically.
    dialogue:
      - part: Lookahead on a short game
        teach: >
          A prize wheel has three equal sectors paying $2$, $6$ and $10$. You
          get up to three free spins; after each you keep the prize and stop,
          or spin again, and the third spin must be kept. Try one-step
          lookahead on it: compare the spin in hand with one more spin and
          then stopping.
      - ask: >
          One more spin and then stopping means keeping that next spin. Under
          lookahead, the spin in hand is kept when it is at least what?
        expects: "6"
        feedback: >
          The next spin averages $(2 + 6 + 10)/3 = 6$, so lookahead keeps a
          $6$ or a $10$ at every spin and respins a $2$.
      - ask: >
          Now the truth. With two spins left, played optimally, what is the
          game worth?
        expects: "22/3"
        tolerance: 0.001
        hint: >
          The last spin is worth $6$. Which of the second-to-last spins beat
          $6$?
        feedback: >
          Keep $6$ or $10$, respin a $2$ into a last spin worth $6$:
          $(6 + 6 + 10)/3 = 22/3 \approx 7.33$. With two spins left, lookahead
          and backward induction agree.
      - ask: >
          Your first of three spins shows $6$. Lookahead keeps it. What does
          backward induction say?
        choices:
          - text: >
              Keep it: $6$ is the average spin, and lookahead and backward
              induction agreed one spin earlier.
            feedback: >
              They agreed with two spins left. With three, respinning leads
              into a game worth $22/3$, not into a single spin worth $6$.
          - text: >
              Spin again: $6 < 22/3$, the value of the two-spin game a respin
              leads into.
            correct: true
            feedback: >
              Right. With three spins left only a $10$ is worth keeping on the
              first spin.
          - text: >
              It is a tie, so either is fine.
            feedback: >
              A tie would need $6 = 22/3$. Keeping the $6$ gives up $4/3$ on
              that branch.
        feedback: >
          Lookahead compared the $6$ with one more spin; the honest comparison
          is with two more spins, played well.
      - ask: >
          Over three spins, lookahead's rule earns $70/9$ and the optimal rule
          earns $74/9$. How much does lookahead leave on the table?
        expects: "4/9"
        tolerance: 0.001
        hint: >
          Check one of them: optimal keeps only a $10$ on the first spin and
          otherwise moves into the $22/3$ game.
        feedback: >
          Optimal: $10/3 + (2/3)(22/3) = 30/9 + 44/9 = 74/9$. Lookahead keeps
          $6$ or $10$ first: $16/3 + (1/3)(22/3) = 48/9 + 22/9 = 70/9$. The
          gap is $4/9 \approx 0.44$.

      - part: What the short game lacks
        reflect: >
          Lookahead stopped on a $6$ because one more spin, kept, was worth
          no more than $6$. But after that one more spin you would not
          necessarily stop. When does the "then stop" in "one more spin, then
          stop" fail — and what property of the stop set would make it safe?
        answer: >
          It fails when the next spin lands outside the stop set: from a $6$,
          the next spin can be a $2$, and from a $2$ you would spin again. So
          continuing is worth more than "one more, then stop" pretends. It is
          safe exactly when the stop set cannot be left: if every state you
          can move to from inside it is also inside it, then after one more
          step you really would stop, and one-step thinking sees the whole
          future.
      - teach: >
          Call the problem monotone if the lookahead set $B$ — the states
          where one more step does not pay — is closed: once the process enters
          $B$ it stays there with probability $1$. For a monotone problem with
          a finite horizon, one-step lookahead is optimal, and it stays optimal
          over an infinite horizon under a mild condition such as
          $\mathbb{E}[\sup_n Y_n] < \infty$. The wheel above is not monotone:
          a $6$ can be followed by a $2$.
      - ask: >
          What is the load-bearing step in the proof that a closed $B$ makes
          lookahead optimal?
        choices:
          - text: >
              The spins are independent, so the future does not depend on the
              present.
            feedback: >
              The wheel's spins are independent too, and lookahead failed
              there. Independence is not what the proof uses.
          - text: >
              Working back from the horizon, the optimal rule stops at every
              later state in $B$; so from $B$, continuing and then playing
              optimally is continuing one step and stopping, which by
              definition of $B$ does not beat stopping now.
            correct: true
            feedback: >
              Right. Closedness guarantees that the step you take from $B$
              lands in $B$, where the induction says you stop. The one-step
              comparison is then the full comparison.
          - text: >
              $B$ is a threshold set, of the form "at least some value".
            feedback: >
              The wheel's $B$, "at least $6$", is a threshold set as well.
              What matters is whether it can be left, not its shape.
        feedback: >
          If one more step does not pay and never will, no longer plan can
          pay either.

      - part: A fee makes the stop set closed
        ask: >
          Same wheel, but now spins are unlimited and each respin costs $2$,
          and your best spin so far stays available. Holding a $6$, what is the
          expected improvement from one more spin,
          $\mathbb{E}[(X - 6)^{+}]$?
        expects: "4/3"
        tolerance: 0.001
        feedback: >
          Only a $10$ improves on a $6$, by $4$, with probability $1/3$:
          $4/3 \approx 1.33$. That is less than the fee of $2$, so a holding of
          $6$ is in $B$. A holding of $2$ is not: its improvement is
          $(0 + 4 + 8)/3 = 4 > 2$.
      - ask: >
          $B$ is the set of holdings $\{6, 10\}$. Is it closed?
        choices:
          - text: >
              No: the next spin can be a $2$, which is outside $B$.
            feedback: >
              The state is the best spin so far, not the latest spin. A $2$
              after a $6$ leaves you holding $6$.
          - text: >
              Yes: the best spin so far can only rise, and $B$ contains every
              holding above $6$.
            correct: true
            feedback: >
              Right. A holding in $B$ moves only upward, and everything upward
              of it is in $B$ too. Once in, never out.
          - text: >
              Only if the horizon is finite.
            feedback: >
              Closedness is about where the state can move, and here it only
              moves up whatever the horizon. The infinite horizon needs only the
              mild integrability condition.
        feedback: >
          A fixed cost per look against a fixed law, with the state a running
          best, is the standard monotone problem. Lookahead's rule — stop at
          the first $6$ or $10$ — is therefore optimal.
      - ask: >
          Starting from scratch, what does "stop at the first $6$ or $10$"
          earn, net of fees?
        expects: "7"
        hint: >
          Each spin stops with probability $2/3$. How many respins do you
          expect, and what is an accepted prize worth on average?
        feedback: >
          The number of spins is geometric with mean $3/2$, so you expect
          $1/2$ a respin, costing $1$. The accepted prize averages
          $(6 + 10)/2 = 8$. Net: $8 - 1 = 7$. Since the rule never goes back
          for an old spin, it earns the same if respun prizes are forfeited.
      - ask: >
          Which change to the fee game would break closedness?
        choices:
          - text: >
              The fee rises by $1$ after every respin.
            feedback: >
              A rising fee makes one more look worth *less* over time, so $B$
              only grows. A holding in $B$ stays in $B$; still monotone.
          - text: >
              The $10$ sector is changed to pay $12$.
            feedback: >
              The law is still fixed from spin to spin and the cost still
              constant, so $B$ is still an upper set the running best can only
              climb into. Still monotone.
          - text: >
              The fee falls after every respin, from $2$ to $1$ and lower.
            correct: true
            feedback: >
              Right. At a fee of $2$ a held $6$ is in $B$; once the fee drops
              to $1$, its improvement $4/3$ beats the fee and the $6$ is back in
              "keep spinning" territory. $B$ shrinks, so it can be left.
          - text: >
              A cap of $10$ spins is added.
            feedback: >
              The running best still only climbs and $B$ is unchanged, so the
              set is still closed; at the cap you stop anyway.
        feedback: >
          Ask one question before trusting a lookahead rule: can the process
          leave the stop set once it is in it? A shrinking horizon without
          recall, or a cost that falls, are the usual ways it can.

  - node: quant-processes.stopping.reroll-fee
    hook: >
      This is the fixed-point trick for collapsing an infinite-horizon reroll game into one equation, and "guess the accept set, solve for $V$, check the guess reproduces itself" is the actual recipe an interviewer wants named.
    explanation: >
      At any point in this game you either take the current draw or pay $c$ to reroll and face the exact same game again — the game has no memory of how many times you've already paid the fee. That self-similarity is why the value satisfies $V=\mathbb{E}[\max(X,V-c)]$: a genuine fixed-point equation rather than a finite ladder, since there is no last stage to anchor a backward recursion to.

      Because this per-look game looks identical at every visit, the same accept-or-reject threshold has to be right forever, which is exactly why one equation nails the whole infinite game. Solve it by guessing a threshold or accept set, substituting into the equation to get $V$ in terms of itself, solving algebraically, and then checking that the resulting threshold $V-c$ actually reproduces the accept set you guessed — an unchecked guess can be wrong even when the algebra looks clean.

      The rule that falls out, "accept iff $X\ge V-c$," is exactly the one-step-lookahead comparison — current draw against continuation value net of fee — applied to a game where that comparison never changes shape from one visit to the next.
    worked: >
      Try $c=0.25$ on the ordinary $6$-sided die. A first guess, accept $\{4,5,6\}$, gives $V=\frac{4+5+6}{6}+\frac36(V-0.25)=2.375+0.5V$, so $V=4.75$ — but then the threshold $V-c=4.5$ would keep only $\{5,6\}$, contradicting the guess. Retrying with accept $\{5,6\}$: $V=\frac{5+6}{6}+\frac46(V-0.25)=\frac53+\frac23V$, giving $V=5$, and $V-c=4.75$ does keep exactly $\{5,6\}$ — self-consistent. A quarter fee is worth $5$, tighter than the $4.50$ at a fifty-cent fee.
    interview: >
      "If it costs you $c$ to reroll, what's this game worth?" wants the fixed-point equation $V=\mathbb{E}[\max(X,V-c)]$ set up immediately, with guess-substitute-verify narrated aloud rather than a number pulled from nowhere.
    pitfalls: >
      Solving for $V$ from a guessed accept set without then checking the resulting threshold reproduces that same set — a plausible-looking guess can be self-inconsistent, as the first attempt above was. Forgetting that a rising fee can only ever lower the game's value is a useful sanity check that catches sign errors.
    recap: >
      $V=\mathbb{E}[\max(X,V-c)]$ solves an infinite reroll game with one fixed point; guess the accept set, solve for $V$, and verify the threshold $V-c$ reproduces it.
    dialogue:
      - part: Pay to draw again
        teach: >
          A bag holds five chips worth $10$, $20$, $30$, $40$ and $50$. You
          draw one. You may cash it, or pay $5$, put it back and draw again —
          as many times as you like. Try the rule "cash a $40$ or $50$, redraw
          anything else".
      - ask: >
          Under that rule, how many redraws do you pay for on average?
        expects: "1.5"
        hint: >
          Each draw ends the game with probability $2/5$.
        feedback: >
          The number of draws is geometric with success probability $2/5$, so
          it averages $5/2$. The first draw is free, leaving
          $5/2 - 1 = 1.5$ paid redraws.
      - ask: >
          What does the rule earn on average, net of fees?
        expects: "37.5"
        feedback: >
          You cash $40$ or $50$, equally likely, so $45$ on average, and pay
          $1.5 \times 5 = 7.5$ in fees: $45 - 7.5 = 37.5$.
      - ask: >
          You have just paid for a redraw. What game are you now playing?
        choices:
          - text: >
              A game with one fewer redraw left.
            feedback: >
              There is no cap on redraws, so nothing has been used up. That
              would be the free-reroll ladder, which has a last rung.
          - text: >
              A game worth $5$ less, because of the fee you just paid.
            feedback: >
              The $5$ is sunk. It lowers your total, but the game in front of
              you is the same as before you paid it.
          - text: >
              Exactly the same game you started: same bag, same fee, no
              deadline.
            correct: true
            feedback: >
              Right. The bag has no memory and there is no clock, so after
              every redraw you face an identical copy of the original game.
        feedback: >
          No last stage, so no backward induction — but something better: the
          game contains a copy of itself.
      - reflect: >
          Since a redraw puts you back in the same game, write one equation
          for the game's value $V$, and check it against the rule's $37.5$.
        answer: >
          Holding $X$, you either cash $X$ or pay $5$ for a fresh copy of the
          game, worth $V - 5$. So $V = \mathbb{E}[\max(X, V - 5)]$. For the
          rule above, $V = (40 + 50)/5 + (3/5)(V - 5)$, so
          $(2/5)V = 18 - 3 = 15$ and $V = 37.5$, matching the direct count.

      - part: One equation, checked against itself
        teach: >
          That is the fixed-point method for re-roll games with a fee:
          $V = \mathbb{E}[\max(X, V - c)]$, and the optimal rule accepts a draw
          exactly when $X \ge V - c$. Solve it by guessing the accept set,
          solving the linear equation for $V$, then checking that the
          threshold $V - c$ reproduces the guess.
      - ask: >
          For the guess $\{40, 50\}$, what threshold $V - c$ does the solution
          give?
        expects: "32.5"
        feedback: >
          $37.5 - 5 = 32.5$. Exactly $40$ and $50$ clear it, so the guess
          reproduces itself.
      - ask: >
          Now guess $\{30, 40, 50\}$. Solving the equation, what $V$ do you
          get?
        expects: "110/3"
        tolerance: 0.001
        hint: >
          $V = (30 + 40 + 50)/5 + (2/5)(V - 5)$.
        feedback: >
          $V = 24 + (2/5)V - 2$, so $(3/5)V = 22$ and
          $V = 110/3 \approx 36.67$.
      - ask: >
          Does the guess $\{30, 40, 50\}$ confirm itself?
        choices:
          - text: >
              Yes: the algebra came out cleanly, so the guess was consistent.
            feedback: >
              Clean algebra comes with every guess. The check is whether
              $V - c = 110/3 - 5 \approx 31.67$ keeps exactly the guessed
              chips — and it does not keep $30$.
          - text: >
              No: its threshold, about $31.67$, would redraw a $30$, so the
              guess contradicts itself.
            correct: true
            feedback: >
              Right. Accepting a $30$ is accepting less than the game would be
              worth if you passed on it, net of the fee.
          - text: >
              Yes, because $30$ is more than the $5$ fee.
            feedback: >
              The fee is not the bar. A redraw is worth $V - 5$, a whole game
              minus the fee, and that is what a $30$ has to beat.
        feedback: >
          Only a guess that reproduces itself solves the equation as a
          stopping problem. The others solve it for a rule you would not
          actually follow.
      - ask: >
          Each guess's $V$ is the value of a real rule: $\{50\}$ gives $30$,
          $\{30, 40, 50\}$ gives $36.67$, $\{40, 50\}$ gives $37.5$, and
          cashing everything gives $30$. Which is the game's value?
        choices:
          - text: >
              The smallest, $30$, to be safe.
            feedback: >
              Every one of these rules is available to you, so the game is
              worth at least the best of them. Picking the worst is not caution;
              it is leaving $7.5$ on the table.
          - text: >
              $37.5$: the self-consistent guess, which is also the largest.
            correct: true
            feedback: >
              Right. The optimal rule is the best rule, and its threshold
              confirms itself. The two tests agree — a useful cross-check.
          - text: >
              Their average, since you do not know which rule is right.
            feedback: >
              You choose the rule; nothing random picks it for you. The value
              is that of the best choice.
        feedback: >
          The game is worth $37.5$: cash $40$ or $50$, redraw the rest.

      - part: Moving the fee
        ask: >
          The fee rises from $5$ to $10$. Before computing: what happens to
          the value and the accept set?
        choices:
          - text: >
              The value falls and the accept set widens.
            correct: true
            feedback: >
              Right. Every redraw is dearer, so the game is worth less, and a
              chip that was worth redrawing at $5$ can be worth cashing at
              $10$.
          - text: >
              The value falls and the accept set narrows.
            feedback: >
              A narrower set means more redraws, each now costing twice as
              much. Higher fees push you to settle sooner, not later.
          - text: >
              The value rises, since you redraw less.
            feedback: >
              Redrawing less is a response to a worse deal, not a better one.
              A higher fee can never raise the value: any rule's fees just went
              up.
        feedback: >
          Use the direction as a sign check on whatever number you compute.
      - ask: >
          At a fee of $10$, what is the game worth?
        expects: "100/3"
        tolerance: 0.001
        hint: >
          Guess $\{30, 40, 50\}$ and check it.
        feedback: >
          $V = 24 + (2/5)(V - 10)$ gives $(3/5)V = 20$, so
          $V = 100/3 \approx 33.33$. The threshold $V - 10 \approx 23.33$ keeps
          exactly $30$, $40$, $50$, so the guess confirms. And $33.33 < 37.5$,
          as the sign check demands.
      - ask: >
          Back to the $5$ fee. As a cross-check, holding a $30$, what is the
          expected improvement from one more draw, $\mathbb{E}[(X - 30)^{+}]$?
        expects: "6"
        feedback: >
          A $40$ improves by $10$ and a $50$ by $20$, each with probability
          $1/5$: $(10 + 20)/5 = 6$. That beats the fee of $5$, so a $30$ is
          redrawn — the lookahead form of the same answer. Holding $40$, the
          improvement is $10/5 = 2 < 5$, so a $40$ is cashed.
      - teach: >
          In an interview: "The game after a reroll is the same game, so
          $V = \mathbb{E}[\max(X, V - c)]$. I'll guess I keep $40$ and $50$:
          that gives $V = 37.5$, threshold $32.5$, which keeps exactly $40$ and
          $50$ — consistent." Guess, solve, verify, out loud.

  - node: quant-processes.stopping.house-selling
    hook: >
      This is search-with-a-cost in its cleanest form, and the reservation price $1-\sqrt{2c}$ is exactly the kind of formula you should be able to rederive live, not recite.
    explanation: >
      Offers are i.i.d. $U(0,1)$, each look costs $c$, and you decide on the spot — no recall, an infinite horizon carried by the fee rather than a deadline. Because every look faces the identical draw and the identical cost, this is a stationary per-look-fee game, so one-step lookahead is not just a heuristic here but exactly optimal: keep searching only while the expected gain from one more look, $\mathbb{E}[(X-x)^{+}]$, still exceeds $c$.

      For $U(0,1)$, that expected gain has a clean closed form: $\mathbb{E}[(X-x)^{+}]=\int_x^1(u-x)\,du=\frac{(1-x)^{2}}{2}$, the area of the triangle of "how much better than $x$" a draw above $x$ tends to be. Setting $\frac{(1-x)^{2}}{2}=c$ and solving gives the stationary threshold $x^{*}=1-\sqrt{2c}$.

      That same $x^{*}$ is also the game's value, by the same fixed-point logic as the fee-per-look re-roll game: at the threshold you are exactly indifferent between stopping now and continuing, so the game must be worth precisely what stopping now delivers there.
    worked: >
      Take $c=0.005$: $x^{*}=1-\sqrt{2(0.005)}=1-\sqrt{0.01}=0.9$. The number of offers viewed is geometric with mean $1/(1-x^{*})=1/0.1=10$, the accepted price averages $\mathbb{E}[U\mid U\ge0.9]=0.95$, and the net payoff is $0.95-10(0.005)=0.9=x^{*}$, confirming the threshold is also the value.
    interview: >
      "You're searching for an apartment, each viewing costs time — when do you stop?" wants $x^{*}=1-\sqrt{2c}$ produced from $\mathbb{E}[(X-x)^{+}]=c$, plus the mean-number-of-looks sanity check that ties the accepted price and total cost back to $x^*$ exactly.
    pitfalls: >
      Treating one-step lookahead as exact here without noting it's because the problem is monotone — a fixed cost against a fixed law, unlike the shrinking-horizon dice ladder — is a gap in the justification, not just a stylistic one. Confusing the accepted price's average ($0.95$ here) with the game's net value ($0.9$) drops the search cost already spent.
    recap: >
      Search costing $c$ per look against $U(0,1)$ offers has reservation price and value $x^{*}=1-\sqrt{2c}$, found by setting the expected gain from one more look equal to the cost.
    dialogue:
      - part: Holding an offer
        teach: >
          You are selling a domain name. Offers arrive one at a time, each an
          independent uniform draw between $0$ and $1$ (as a fraction of the
          list price). Each offer you look at costs $0.125$ in broker fees,
          and you must accept or reject on the spot. The offer in front of you
          is $0.6$.
      - ask: >
          Price one more look the way one-step lookahead does, as an option on
          top of the $0.6$ in hand. On average, by how much does the next offer
          improve on $0.6$ — what is $\mathbb{E}[(X - 0.6)^{+}]$?
        expects: "0.08"
        hint: >
          The next offer beats $0.6$ with probability $0.4$, and when it does,
          the excess is uniform between $0$ and $0.4$.
        feedback: >
          $0.4 \times 0.2 = 0.08$: a $40\%$ chance of improving, by $0.2$ on
          average when it happens.
      - ask: >
          Is another look worth it?
        choices:
          - text: >
              Yes: the next offer could be as high as $1$.
            feedback: >
              It could, but the improvement *averages* $0.08$, and the look
              costs $0.125$ for certain. Paying $0.125$ for $0.08$ loses
              money on average.
          - text: >
              No, because the average offer, $0.5$, is below $0.6$.
            feedback: >
              Right verdict, wrong reason. That reasoning prices the next offer
              as a replacement for the $0.6$. Try it on a lower holding before
              trusting it.
          - text: >
              No: the expected improvement, $0.08$, is less than the fee of
              $0.125$.
            correct: true
            feedback: >
              Right. Pay for a look only while what it is expected to add
              exceeds what it costs.
        feedback: >
          Accept the $0.6$. The comparison is improvement against fee.
      - ask: >
          Now suppose the offer in front of you is $0.4$. What is the expected
          improvement from one more look, $\mathbb{E}[(X - 0.4)^{+}]$?
        expects: "0.18"
        feedback: >
          $0.6 \times 0.3 = 0.18$, which beats the fee of $0.125$: keep
          looking. Note that the replacement reasoning would have sold:
          $0.4$ beats the average offer net of the fee, $0.5 - 0.125 = 0.375$.
          It stops too early.
      - reflect: >
          Somewhere between $0.4$ (keep looking) and $0.6$ (sell) is a holding
          at which you are exactly indifferent. What equation pins it down,
          and why should the same number serve as the bar on every day of the
          search?
        answer: >
          Indifference means the expected improvement equals the fee:
          $\mathbb{E}[(X - x)^{+}] = 0.125$. Every look faces the same uniform
          law and the same fee, with no deadline, so the problem is monotone
          and the one-step comparison is exactly optimal — and since nothing
          about the comparison changes from day to day, neither does the bar.

      - part: The reservation price
        teach: >
          For a uniform offer, the expected improvement over a holding $x$ is
          $\mathbb{E}[(X - x)^{+}] = \int_x^1 (u - x)\,du = \frac{(1 - x)^{2}}{2}$,
          the area of a triangle. Setting it equal to the cost $c$ gives the
          reservation price $x^{*} = 1 - \sqrt{2c}$: accept the first offer at
          or above $x^{*}$.
      - ask: >
          What is $x^{*}$ at $c = 0.125$?
        expects: "0.5"
        feedback: >
          $(1 - x)^{2}/2 = 0.125$ gives $(1 - x)^{2} = 0.25$, so $1 - x = 0.5$
          and $x^{*} = 0.5$. Check: at $0.4$ the improvement was $0.18$ and at
          $0.6$ it was $0.08$, on either side of $0.125$.
      - ask: >
          On average, how many offers do you look at, the first one included?
        expects: "2"
        hint: >
          Each offer clears $0.5$ with probability $0.5$.
        feedback: >
          The count is geometric with success probability $1 - x^{*} = 0.5$,
          so its mean is $1/0.5 = 2$.
      - ask: >
          What is the accepted price, on average?
        expects: "0.75"
        feedback: >
          The accepted offer is uniform on $[0.5, 1]$, so it averages
          $0.75$.
      - ask: >
          What does the search net, accepted price minus fees?
        expects: "0.5"
        feedback: >
          $0.75 - 2 \times 0.125 = 0.75 - 0.25 = 0.5$ — exactly $x^{*}$.

      - part: Why the bar is also the value
        ask: >
          The search is worth exactly its reservation price. Why?
        choices:
          - text: >
              Because the average accepted price equals $x^{*}$.
            feedback: >
              The average accepted price is $0.75$, not $0.5$. The fees bring
              it down to $x^{*}$, and that is not a coincidence.
          - text: >
              At $x^{*}$ you are indifferent between selling, worth $x^{*}$,
              and searching on, worth the game's value — so the two are equal.
            correct: true
            feedback: >
              Right. The same fixed-point logic as in a re-roll game with a fee:
              the bar is where stopping and continuing tie, and continuing is
              the whole game.
          - text: >
              It is special to $c = 0.125$, where $x^{*}$ equals the mean
              offer.
            feedback: >
              The equality of $x^{*}$ and the mean is the coincidence here; the
              equality of $x^{*}$ and the value is not. The next question shows
              a fee where $x^{*}$ is nowhere near $0.5$.
        feedback: >
          The reservation price is the value of the search, net of every fee
          you will pay.
      - ask: >
          With a fee of $0.32$ per look, what is the reservation price?
        expects: "0.2"
        feedback: >
          $1 - \sqrt{0.64} = 1 - 0.8 = 0.2$. Expensive looks make you settle
          for far less than the average offer — the bar is not the mean.
      - ask: >
          At a fee of $0.72$, the formula gives $1 - \sqrt{1.44} = -0.2$. What
          is going on?
        choices:
          - text: >
              The formula still holds: the search is worth $-0.2$.
            feedback: >
              The formula came from setting $(1 - x)^{2}/2 = c$ for a holding
              $x$ in $[0, 1]$. Once $c > 1/2$ there is no such holding, and
              the search is worth $0.5 - 0.72 = -0.22$, not $-0.2$.
          - text: >
              Once $c > 1/2$, even a holding of $0$ is not worth improving on,
              so you accept the first offer, whatever it is.
            correct: true
            feedback: >
              Right. The largest possible improvement is $\mathbb{E}[X] = 0.5$,
              which no longer covers the fee. The first offer is final, and
              the search nets $0.5 - c$.
          - text: >
              You should look forever, since no offer clears a negative bar.
            feedback: >
              It is the reverse: every offer clears a negative bar, so the
              first one is accepted.
        feedback: >
          The formula $x^{*} = 1 - \sqrt{2c}$ is for $c \le 1/2$. Past that, the
          one-step comparison says never look again.
      - teach: >
          The interview answer: "Another look is worth $(1 - x)^{2}/2$ over
          what I hold; I stop when that drops to the cost, so I accept anything
          above $1 - \sqrt{2c}$. That's also what the search is worth — the
          expected number of looks times the cost exactly eats the gap between
          the average accepted price and the bar."

  - node: quant-processes.stopping.recall
    hook: >
      Two throwaway modeling words — "with recall" or "ranks only" — completely change which formula applies, and saying them out loud before solving is the fastest way to avoid answering a different problem than the one asked.
    explanation: >
      Recall decides how much a stopping rule actually restricts you. With recall, the payoff is $\max_{k\le n}Y_k$, so you can wait out the whole sequence and grab the best one seen so far at the very end — patience costs nothing, and the stopping aspect nearly disappears. Without recall, passing on $Y_n$ is irrevocable, which is what makes deciding when to stop a genuine problem rather than a formality.

      Observation decides how much you're told. Under full information you see $Y_n$'s actual value, drawn from a known law; under rank-only information you see only how $Y_n$ compares with everything before it. Rank-only strictly throws information away: two candidates that both happen to be "better than everything so far" look identical under this signal even if their true values are worlds apart.

      Say both switches out loud before solving, because problems that share a paragraph of English can be opposites once they're pinned down — "no recall, ranks only, win only by landing the very best" and "recall, full information, i.i.d. values" share almost no structure and essentially never share an answer.
    worked: >
      Three offers, in order, are $40\text{k}$, $70\text{k}$, $55\text{k}$. Under full information you see those numbers directly; under rank-only information you'd see only "first," "better than the last," "worse than the last" — never learning that $70\text{k}$ beat the others by tens of thousands. With recall, rejecting all three in real time costs nothing, since you can go back and take $70\text{k}$ regardless. Without recall, passing on $70\text{k}$ hoping for better loses it for good.
    interview: >
      "What do you get to observe, and can you go back?" is often the implicit question behind a stopping-problem prompt before any payoff rule is even stated; answering it up front signals you know these two switches change the entire problem.
    pitfalls: >
      Assuming full information by default whenever a problem says "candidates" or "applicants" — many classic phrasings deliberately mean rank-only. Assuming recall by default when a problem says "decide on the spot," which is the standard signal for no recall.
    recap: >
      Whether a rejected item can be reclaimed, and whether you see values or only relative ranks, are two modeling choices that determine which stopping problem you're actually solving.
    dialogue:
      - part: Four offers on a guitar
        teach: >
          You are selling a vintage guitar, and four offers arrive in this
          order: $52$, $81$, $67$, $74$ (hundreds of dollars). You decide on
          each as it comes, with the rule "accept the first offer above $85$;
          if none comes, take the last one".
      - ask: >
          If a refused buyer is gone for good, what does the rule get you?
        expects: "74"
        feedback: >
          No offer clears $85$, so you are left with the last, $74$. The $81$
          you refused is gone.
      - ask: >
          Now a refused buyer leaves his number and will still buy at the end.
          Same bar of $85$, but if nothing clears it you go back for the best
          offer you have seen. What do you get?
        expects: "81"
        feedback: >
          You call back the $81$. A bar set too high cost $7$ without
          call-back and costs nothing with it.
      - ask: >
          With call-back allowed and no cost to waiting, what is the best rule?
        choices:
          - text: >
              Accept the first offer above the average offer.
            feedback: >
              Why accept anything early? Every offer will still be available at
              the end, so stopping early can only lose the chance of something
              better.
          - text: >
              Hear every offer, then take the largest.
            correct: true
            feedback: >
              Right. With free recall the payoff is $\max_{k \le n} Y_k$, and
              patience costs nothing. There is no stopping decision left.
          - text: >
              The same as without call-back: a fixed bar, then take what comes.
            feedback: >
              A fixed bar is how you cope with *losing* refused offers. With
              recall you lose nothing by refusing.
        feedback: >
          Recall nearly dissolves the stopping problem. Without it, every
          refusal is irrevocable, and that is what makes timing matter.
      - part: What you are told
        ask: >
          Change what you see instead. Suppose each buyer tells you only how
          his offer ranks against the offers so far, never the amount. Among
          the four offers, what rank (1 for the highest) is the fourth buyer
          told?
        expects: "2"
        feedback: >
          $74$ is below $81$ and above $67$ and $52$, so it ranks $2$nd of $4$.
          The buyer making it learns nothing about whether $81$ was close.
      - ask: >
          Under that rank-only information, can you still follow "accept the
          first offer above $85$"?
        choices:
          - text: >
              Yes: a high enough rank tells you the offer is above $85$.
            feedback: >
              A rank of $1$ among four says the offer beats three others, not
              that it beats $85$. Four offers between $10$ and $20$ have ranks
              too.
          - text: >
              No: the rule needs the amount, and you are never told an amount.
            correct: true
            feedback: >
              Right. Rank-only information makes rules in terms of values
              impossible to state. All you can use is "best so far" and its
              relatives.
          - text: >
              Only with call-back allowed.
            feedback: >
              Call-back changes what you can claim, not what you know. Even
              with recall you would never learn whether any offer exceeded
              $85$.
        feedback: >
          The observation switch decides which rules exist at all.
      - reflect: >
          You changed two things about the same four offers. Name them, and
          say why each has to be settled before any computation starts.
        answer: >
          Recall: whether a refused offer can be claimed later. With it,
          patience is free and the payoff is the running maximum; without it,
          refusals are final and timing becomes the whole problem.
          Observation: whether you see the amount or only the rank against
          earlier offers. That decides which rules can even be written down.
          Both are fixed by the story, not by the algebra, so they come first.

      - part: The two switches, named
        teach: >
          With recall, a rejected reward can still be claimed later, so the
          payoff is $\max_{k \le n} Y_k$; without recall a rejection is
          irrevocable. Under full information you see each value *and* know the
          law it came from; under rank-only information you see only how each
          item compares with those before it, so absolute quality is never
          revealed. The two switches are independent: all four combinations
          occur.
      - ask: >
          A bond trader sees a stream of quotes for a block she wants to sell.
          Each quote is a price, firm only while it is on the screen, and the
          desk knows from history how such quotes are distributed. Which pair
          describes her problem?
        choices:
          - text: >
              No recall, rank-only.
            feedback: >
              She sees the price itself, not just its rank among earlier
              quotes. That is more than rank-only.
          - text: >
              Recall, full information.
            feedback: >
              "Firm only while it is on the screen" means a passed quote is
              gone: no recall.
          - text: >
              No recall, full information.
            correct: true
            feedback: >
              Right: values from a known law, and a quote passed is a quote
              lost. This is the setting of the dice and offer problems.
        feedback: >
          Read the switches off the story's small print: "firm only while on
          screen" is no recall; "a price, with a known history" is full
          information.
      - ask: >
          An art collector sells a painting by private bids. She sees each
          bid's amount, but has no idea what bids for such a painting usually
          look like. Which observation type is this?
        choices:
          - text: >
              Full information: she sees the amounts.
            feedback: >
              Full information has two clauses: the value *and* the law it came
              from. She has the first and not the second, so she cannot say
              whether a bid is high for the market.
          - text: >
              Neither, strictly: she sees values, which is more than rank-only,
              but lacks the known law that full information requires.
            correct: true
            feedback: >
              Right. She fails exactly one clause of full information. She can
              compare bids by margin, which rank-only forbids, but cannot judge
              a bid against a distribution.
          - text: >
              Rank-only: without the law, values are no better than ranks.
            feedback: >
              She can tell a bid that tops the last one by $1$ from one that
              tops it by $22$. Margins are information that rank-only throws
              away.
        feedback: >
          The classic answers assume one of the two clean cases. When a problem
          sits between them, say so before quoting either.
      - teach: >
          Before solving any stopping question, say both switches out loud.
          "No recall, and I see only ranks" and "no recall, values from a known
          law" share a paragraph of English and almost nothing else; "with
          recall" usually means waiting is free. Defaults are where wrong
          answers come from.

  - node: quant-processes.stopping.best-so-far
    hook: >
      These two probabilities — $1/i$ for being a leader, $i/n$ for a leader being champion — are the entire arithmetic engine the secretary problem runs on, and deriving them from symmetry is what lets you rebuild the $37\%$ rule from scratch under pressure.
    explanation: >
      In a uniformly random order, nothing distinguishes the $i$ positions holding the first $i$ items before the order is revealed, so the largest of those $i$ items is equally likely to sit in any of them. It sits at position $i$ itself — making item $i$ "best so far" — with probability exactly $1/i$.

      The second fact follows from a short Bayes-style argument. The event "item $i$ is a record and also the overall best" is really just "item $i$ is the overall best," since the overall best is automatically a record wherever it sits. By the same symmetry, the overall best is equally likely to occupy any of the $n$ positions, so that joint probability is $1/n$. Dividing by $\Pr(\text{record at }i)=1/i$ gives $\Pr(\text{overall best}\mid\text{record at }i)=(1/n)/(1/i)=i/n$.

      Since $i/n$ increases in $i$, a late record is far more informative than an early one — an early record is almost certainly a false start, since almost nobody else has been compared against yet. Combined with the fact that anything not currently best so far is certainly not the overall best, the whole strategy space collapses to "which record do I accept," not "which item."
    worked: >
      For $n=5$, position $3$: $\Pr(\text{record at }3)=1/3$, and given that, $\Pr(\text{it's the overall best})=3/5$. Multiplying gives $\Pr(\text{position }3\text{ holds the overall best})=\tfrac13\cdot\tfrac35=\tfrac15$ — exactly $1/n$, as it must be, since the overall best is equally likely to sit anywhere. The identity $(1/i)(i/n)=1/n$ makes itself visible at every $i$.
    interview: >
      "Why is $\Pr(i\text{ is a record})=1/i$?" is a standalone derivation question, and a follow-up, "why do later records matter more," is listening specifically for the $i/n$ reasoning rather than a hand-wave about intuition.
    pitfalls: >
      Confusing "record" with "overall best" — a record only guarantees local superiority over what's already been seen, not global superiority, and conflating the two invalidates both probabilities. Forgetting that $\Pr(\text{overall best}\mid\text{record at }i)$ needs the joint-probability trick above, rather than being derivable by inspection.
    recap: >
      In a random order, item $i$ is a record with probability $1/i$, and a record at $i$ is the true best with probability $i/n$ — late records are the ones worth trusting.
    dialogue:
      - part: Is the third one a leader?
        teach: >
          Four applicants with distinct abilities are interviewed in a
          uniformly random order. Call an applicant a *leader* if she is
          better than everyone interviewed before her; the first applicant is
          a leader automatically.
      - ask: >
          What is the probability that the third applicant is a leader?
        choices:
          - text: >
              $1/4$
            feedback: >
              $1/4$ is the chance that she is the best of all four. Being a
              leader only asks her to beat the two before her; the fourth
              applicant has not been seen and does not matter.
          - text: >
              $1/2$
            feedback: >
              $1/2$ would be right if she had one rival to beat. She has two,
              and she leads only when she is the best of the three — which
              happens one time in three.
          - text: >
              $1/3$
            correct: true
            feedback: >
              Right. She is a leader exactly when she is the best of the first
              three, and in a random order the best of those three is equally
              likely to be any of them.
          - text: >
              It depends on how many applicants come after her.
            feedback: >
              Leadership is decided by the past alone. Add a hundred
              applicants after her and the answer is still $1/3$.
        feedback: >
          In a random order, applicant $i$ is a leader with probability $1/i$
          — whatever the total number of applicants.
      - reflect: >
          Say why the answer is $1/3$ without listing orderings, and why the
          same argument gives $1/i$ for the $i$-th applicant.
        answer: >
          Before the order is revealed, nothing distinguishes the first three
          positions, so the best of the three applicants who land there is
          equally likely to be in any one of them. The third applicant leads
          exactly when that best sits in position $3$: probability $1/3$. With
          $i$ positions instead of three, it is $1/i$.

      - part: A leader late in the line
        ask: >
          Now ten applicants, random order. What is the probability that the
          fourth applicant is the best of all ten?
        expects: "1/10"
        feedback: >
          The best of all ten is equally likely to be in any of the ten
          positions, so $1/10$.
      - ask: >
          How are the events "applicant $4$ is the best of all ten" and
          "applicant $4$ is a leader" related?
        choices:
          - text: >
              They are independent.
            feedback: >
              If she is the best of all ten she is certainly a leader, so the
              first event forces the second. Independent events cannot do
              that unless one has probability $0$ or $1$.
          - text: >
              The first is contained in the second.
            correct: true
            feedback: >
              Right. The overall best beats everyone, in particular everyone
              before her, so she is a leader wherever she sits.
          - text: >
              They are the same event.
            feedback: >
              A leader at position $4$ only beats three others. Most leaders at
              position $4$ are overtaken later.
          - text: >
              They are disjoint.
            feedback: >
              Disjoint would mean the overall best is never a leader, which is
              backwards: she always is.
        feedback: >
          So "a leader and the overall best" is just "the overall best", and
          the conditional probability is a ratio of two numbers you already
          have.
      - ask: >
          Given that applicant $4$ is a leader, what is the probability that
          she is the best of all ten?
        expects: "2/5"
        hint: >
          Divide the probability of the smaller event by that of the larger.
        feedback: >
          $\Pr(\text{best} \mid \text{leader at } 4) = \frac{1/10}{1/4} =
          \frac{4}{10} = \frac{2}{5}$.
      - teach: >
          That is the proposition. For $n$ items in random order, item $i$ is
          best so far with probability $1/i$, and these events are independent
          across $i$. Given that item $i$ is best so far, it is the overall
          best with probability $i/n$. Anything not best so far is certainly
          not the overall best. A run of $n$ items throws up only about
          $\ln n$ leaders.
      - ask: >
          Same ten applicants. Given that applicant $9$ is a leader, what is
          the probability that she is the best of all?
        expects: "9/10"
        feedback: >
          $9/10$: only applicant $10$ could still beat her. A leader at
          position $4$ was the true best $40\%$ of the time; one at position
          $9$, $90\%$. Late leaders are the valuable ones.

      - part: What a rule should ever accept
        ask: >
          Applicant $6$ of ten is second-best so far. If you win only by hiring
          the overall best, should you ever hire her?
        choices:
          - text: >
              Yes, if she comes late enough, since late applicants are
              valuable.
            feedback: >
              Late *leaders* are valuable. She already lost to someone earlier,
              so she cannot be the best of all ten, at any position.
          - text: >
              No: someone before her is better, so she is certainly not the
              overall best.
            correct: true
            feedback: >
              Right. A rule that wins only on the overall best should only ever
              consider leaders.
          - text: >
              Only if the applicant who beat her has already been rejected.
            feedback: >
              Whether that applicant was rejected changes nothing about the
              ranking: she is still beaten, so she is still not the best.
        feedback: >
          The strategy space collapses: the only question is *which* leader to
          accept.
      - ask: >
          Applicant $3$ turned out to be a leader. What is the probability that
          applicant $5$ is a leader?
        choices:
          - text: >
              Less than $1/5$: applicant $3$ raised the bar.
            feedback: >
              Knowing applicant $3$ led tells you only how the first three are
              ordered among themselves. Applicant $5$ leads when the best of
              the first five sits in position $5$, and that does not depend on
              the order inside the first three. The bar did not rise either:
              the best of the first three is the same applicant wherever she
              sits.
          - text: >
              Exactly $1/5$.
            correct: true
            feedback: >
              Right. Whether applicant $5$ is best among the first five does not
              depend on the order within the first three. The leader events are
              independent.
          - text: >
              More than $1/5$: leaders cluster.
            feedback: >
              There is no clustering. The relative order of the first three
              tells you nothing about the rank of applicant $5$ among the first
              five.
        feedback: >
          Independence is what makes counts of leaders easy: their number is a
          sum of independent indicators with means $1, \tfrac12, \tfrac13,
          \dots$
      - ask: >
          A recruiter schedules interviews in order of résumé strength, weakest
          first. Which conclusion of this lesson fails?
        choices:
          - text: >
              None: the arguments never used the order.
            feedback: >
              Every one of them used the order. "The best of the first $i$ is
              equally likely to be in any of the $i$ positions" is a statement
              about a uniformly random order.
          - text: >
              The symmetry fails, so $1/i$ and $i/n$ no longer hold — if
              résumés track ability, nearly every applicant is a leader and the
              last is the best.
            correct: true
            feedback: >
              Right. With weakest-first ordering, the leader probability is
              close to $1$ at every position. Random order is the hypothesis
              that carries the whole proposition.
          - text: >
              Only the $i/n$ fact fails; $1/i$ still holds.
            feedback: >
              $1/i$ needs the same symmetry as $i/n$. Under weakest-first,
              applicant $i$ leads far more often than $1/i$.
        feedback: >
          Before quoting $1/i$ or $i/n$, check that the order really is
          uniformly random.
      - teach: >
          Said aloud: "In a random order the best of the first $i$ is equally
          likely to be anywhere among them, so $i$ is a leader with probability
          $1/i$. The overall best is always a leader, so given a leader at $i$,
          it is the best with probability $(1/n)/(1/i) = i/n$. Only leaders
          are worth taking, and late ones are worth the most."

  - node: quant-processes.stopping.secretary
    hook: >
      This is the single most quoted "do you know a cute probability result" interview question, and the actual bar is deriving the $1/e$ cutoff from the success-probability sum, not reciting "$37\%$."
    explanation: >
      Since only a record is ever worth accepting, attention narrows to cutoff rules: reject the first $r-1$ outright, then take the next record. This succeeds exactly when the overall best sits at some position $i\ge r$ and the best of the first $i-1$ items — which would otherwise have been mistakenly hired as a false record before position $i$ — happened to fall among the rejected first $r-1$. That combinatorial statement is exactly the sum $\sum_{i=r}^{n}\frac{1}{n}\cdot\frac{r-1}{i-1}$.

      Pulling $(r-1)/n$ out front leaves a harmonic-style tail, $\sum_{i=r}^{n}1/(i-1)$, which behaves like $\ln(n/r)$ for $r$ and $n$ both large. Writing $x=r/n$, the success probability behaves like $x\ln(1/x)$, and a one-line derivative check shows this is maximized at $x=1/e$, with maximum value $1/e\approx0.368$ — skip about $37\%$ of the field to calibrate, then take the next record.

      Recognize the shape — $n$ items in random order, rank-only information, no recall, win only by landing the actual best — and this reject-then-take-next-record cutoff is the template, with $r\approx n/e$ its calibration.
    worked: >
      For $n=6$, compare cutoffs directly using $P(r)=\frac{r-1}{6}\sum_{i=r}^{6}\frac{1}{i-1}$. At $r=3$: $\sum_{i=3}^{6}\frac{1}{i-1}=\frac12+\frac13+\frac14+\frac15\approx1.283$, so $P(3)=\frac26(1.283)\approx0.428$. Checking neighbors, $P(2)\approx0.381$ and $P(4)\approx0.392$, so $r=3$ is the true optimum for $n=6$ — reject the first $2$, take the next record — beating even the asymptotic $1/e\approx0.368$.
    interview: >
      "$n$ candidates interview one at a time, reject or hire on the spot, you win only by hiring the best — what's your strategy?" wants the cutoff structure stated first, then the sum-to-limit derivation ending at "reject the first $n/e$, take the next record."
    pitfalls: >
      Quoting $37\%$ for a differently scored objective, like minimizing expected rank instead of maximizing the chance of the very best — the constant is specific to this exact payoff. Misapplying the $r\ge2$ formula at the degenerate $r=1$ edge case, where the rule is just "take the first candidate outright" and the success probability is simply $1/n$.
    recap: >
      Reject the first $r-1\approx n/e$ candidates, then hire the next record — success probability tends to $1/e\approx0.368$ as $n\to\infty$, however large $n$ is.
    dialogue:
      - part: Four applicants, one hire
        teach: >
          You must hire one of four applicants, interviewed in a uniformly
          random order. After each interview you learn only how she ranks
          against those already seen, and you must hire or reject her on the
          spot. You win only if you hire the best of the four.
      - ask: >
          If you simply hire the first applicant, what is your chance of
          winning?
        expects: "1/4"
        feedback: >
          The best of four is equally likely to be in any position, so the
          first applicant is the best with probability $1/4$. Any other fixed
          position does the same.
      - ask: >
          Only leaders — applicants better than everyone before them — can be
          the best. So try "hire the first leader". What does that rule do?
        choices:
          - text: >
              It waits for a strong applicant, so it wins well over half the
              time.
            feedback: >
              The first applicant has no one to beat, so she is always a
              leader. "The first leader" is always applicant $1$.
          - text: >
              It hires applicant $1$ every time, and wins with probability
              $1/4$.
            correct: true
            feedback: >
              Right. With no one to compare her against, applicant $1$ is a
              leader by default, and the rule stops there.
          - text: >
              It never hires anyone, since no one is known to be the best.
            feedback: >
              A leader is defined relative to the past, so leaders do appear —
              the first one immediately.
        feedback: >
          Early leaders are cheap: they have beaten almost no one. Taking the
          first one wastes all the information later interviews would give.
      - reflect: >
          Fix the rule. What would you do with the first applicant or two, and
          what would you then accept?
        answer: >
          Use the first few applicants as a calibration sample: reject them
          all outright, whatever they are, and then hire the first applicant
          who beats everyone so far — which means beating the whole sample.
          A leader after the sample has been tested against a real bar, and
          leaders found later are more likely to be the true best.

      - part: Skip one, then take a leader
        ask: >
          Rule: reject applicant $1$, then hire the first leader (or the last
          applicant if no leader appears). Suppose the best of the four is in
          position $3$. What is the chance the rule hires her?
        expects: "1/2"
        hint: >
          The rule reaches position $3$ only if applicant $2$ was not a leader.
        feedback: >
          The rule passes over applicant $2$ exactly when applicant $1$ beats
          her, that is, when the better of the first two is in the rejected
          position $1$: probability $1/2$.
      - ask: >
          Now suppose the best of the four is in position $4$. What is the
          chance the rule hires her?
        expects: "1/3"
        feedback: >
          The rule must skip applicants $2$ and $3$, which happens exactly when
          the best of the first three is in the rejected position $1$:
          probability $1/3$.
      - ask: >
          Put it together. What is the rule's chance of hiring the best?
        expects: "11/24"
        hint: >
          The best is in each position with probability $1/4$. In position $1$
          the rule rejects her; in position $2$ it always hires her.
        feedback: >
          $\frac{1}{4}\left(0 + 1 + \frac{1}{2} + \frac{1}{3}\right) =
          \frac{1}{4} \cdot \frac{11}{6} = \frac{11}{24} \approx 0.458$,
          against $1/4$ for hiring blind.
      - teach: >
          That is the secretary problem's rule. Backward induction shows the
          optimum is a cutoff rule: reject the first $r - 1$, then hire the
          first leader. You win when the best is at some $i \ge r$ and the best
          of the first $i - 1$ fell in the rejected sample, so
          $P(r) = \sum_{i=r}^{n} \frac{1}{n} \cdot \frac{r - 1}{i - 1} =
          \frac{r - 1}{n}\left(\frac{1}{r - 1} + \dots + \frac{1}{n - 1}\right)$.
      - ask: >
          For four applicants, what does rejecting the first *two* give, $P(3)$?
        expects: "5/12"
        feedback: >
          $P(3) = \frac{2}{4}\left(\frac{1}{2} + \frac{1}{3}\right) =
          \frac{1}{2} \cdot \frac{5}{6} = \frac{5}{12} \approx 0.417$.
      - ask: >
          Which cutoff is best for four applicants?
        choices:
          - text: >
              Reject two, $r = 3$: a bigger sample means a better bar.
            feedback: >
              A bigger sample also means a bigger chance the best is *in* the
              sample and gets rejected. $5/12 < 11/24$.
          - text: >
              Reject one, $r = 2$.
            correct: true
            feedback: >
              $11/24 \approx 0.458$ beats $P(3) \approx 0.417$, and both beat
              $P(1) = P(4) = 1/4$.
          - text: >
              Reject three, $r = 4$, and see as much as possible.
            feedback: >
              Then you hire applicant $4$ whenever she is a leader and
              otherwise are forced to hire her anyway. Either way you hire
              applicant $4$, and win with probability $1/4$.
        feedback: >
          The sample trades calibration against the risk of throwing the best
          away. For four applicants the balance is one rejection.

      - part: Many applicants, and where 37 percent comes from
        ask: >
          For large $n$ and $r$, what does the tail
          $\frac{1}{r - 1} + \dots + \frac{1}{n - 1}$ behave like?
        choices:
          - text: >
              $n/r$
            feedback: >
              The terms are each about $1/i$, so the sum is a difference of
              harmonic numbers, which grows like a logarithm, not a ratio.
          - text: >
              $\ln(n/r)$
            correct: true
            feedback: >
              Right. It is $H_{n-1} - H_{r-2} \approx \ln n - \ln r$. So with
              $x = r/n$, $P(r) \approx x \ln(1/x)$.
          - text: >
              $\ln n$
            feedback: >
              That is the whole harmonic sum from $1$. The sum here starts at
              $1/(r - 1)$, which removes about $\ln r$.
        feedback: >
          The success probability depends on $n$ and $r$ only through the
          fraction $x = r/n$ that you skip.
      - ask: >
          Which fraction $x$ maximizes $x \ln(1/x)$, and what is the maximum?
        choices:
          - text: >
              $x = 1/2$, with maximum $\frac{1}{2}\ln 2 \approx 0.347$.
            feedback: >
              $1/2$ is a natural guess, but the derivative there is
              $\ln 2 - 1 < 0$, so a smaller sample does better.
          - text: >
              $x = 1/e$, with maximum $1/e \approx 0.368$.
            correct: true
            feedback: >
              The derivative $\ln(1/x) - 1$ vanishes at $x = 1/e$, where
              $x \ln(1/x) = (1/e) \cdot 1$. Skip about $37\%$, win about
              $37\%$ of the time.
          - text: >
              $x \to 0$, since a small sample wastes the fewest applicants.
            feedback: >
              As $x \to 0$, $x \ln(1/x) \to 0$: with no sample, the first
              leader is the first applicant, as you saw.
        feedback: >
          The two $37\%$s are different numbers that happen to coincide: the
          fraction skipped, and the chance of success.
      - ask: >
          A candidate says: "Skip the first $37\%$, then hire the next
          applicant." What does that rule win with?
        choices:
          - text: >
              About $1/e$, the same as the classic rule.
            feedback: >
              The classic rule hires the next *leader*. Hiring the next
              applicant, whoever she is, ignores the sample entirely.
          - text: >
              $1/n$: the next applicant is just a uniformly random one.
            correct: true
            feedback: >
              Right. The sample is only useful as a bar to beat; hiring
              without comparing against it is hiring blind.
          - text: >
              More than $1/e$, since it never risks running out of applicants.
            feedback: >
              It never runs out, but it also never uses what it learned. Its
              chance is $1/n$.
        feedback: >
          "Skip $n/e$" is half the rule. "Then take the first one better than
          everyone so far" is the half that does the work.
      - teach: >
          The ten-second version: "Only leaders can be the best, so use a
          cutoff: reject the first $r - 1$, then hire the first leader. That
          wins with $\frac{r-1}{n}\sum_{i=r}^{n}\frac{1}{i-1} \approx
          x\ln(1/x)$, maximized at $x = 1/e$ — skip about $37\%$ and win
          about $37\%$ of the time, for any large $n$."

  - node: quant-processes.stopping.secretary-variants
    hook: >
      The $37\%$ number answers exactly one question, and an interviewer who follows up with "what if you just want someone good, not necessarily the best" is testing whether you notice the objective changed.
    explanation: >
      Keep the same information structure — rank-only, no recall — but score by the rank of whoever you hire instead of all-or-nothing on landing rank $1$. This is a friendlier problem: as $n\to\infty$ the optimal expected rank tends to about $3.87$, because a rule no longer has to gamble everything on catching the single best — being reliably very good is rewarded, which the original objective doesn't credit at all.

      Now keep the same all-or-nothing objective but hand over actual values drawn from a known law instead of ranks. Extra information should help, and it does substantially: the chance of catching the maximum rises from $\approx0.368$ to $\approx0.580$, because each new value can be judged against the whole known distribution, not merely against the handful of predecessors personally observed.

      A third wrinkle: if $n$ itself is unknown in advance, a time-based rather than count-based cutoff still guarantees at least $1/e$ — a useful robustness fact, since real searches rarely come with a known headcount. The interview habit this all builds: restate which objective is being scored before quoting any specific constant.
    worked: >
      For $n=3$, the win-maximizing rule (reject the first, take the next record, else the last) is known to succeed with probability exactly $1/2$. Checking its expected rank across all $3!=6$ orderings of $\{1,2,3\}$ gives an average landed rank of $5/3\approx1.67$ — better than picking blind ($2$), but this is the expected rank of the win-maximizing rule specifically, not a rule optimized to minimize rank; the two objectives generally want different cutoffs.
    interview: >
      "Does more information help?" and "what if you don't need the very best, just someone good?" are the two standard follow-ups this node answers — full information raises success to $\approx0.580$, and minimizing rank targets $\approx3.87$ regardless of $n$.
    pitfalls: >
      Assuming full information helps only marginally — the jump from $0.368$ to $0.580$ is large, driven by comparing against the known law rather than only rank. Assuming the rank-only $37\%$ cutoff schedule stays optimal once the objective changes to expected rank — it doesn't.
    recap: >
      Change the payoff or hand over actual values and the rule changes with it: expected rank $\approx3.87$, full-information success $\approx0.580$, both distinct from the classic $37\%$.
    dialogue:
      - part: Someone good, not the best
        teach: >
          Six applicants, random order, ranks only, hire or reject on the
          spot. But your bonus no longer depends on hiring *the* best: you are
          scored on the expected rank of your hire, $1$ for the best and $6$
          for the worst, lower being better. Applicant $5$ has just finished,
          and she is second-best of the five so far.
      - ask: >
          Under the classic objective — win only by hiring the overall best —
          what would you do with her?
        choices:
          - text: >
              Hire her: she is late, and late candidates are valuable.
            feedback: >
              Late *leaders* are valuable. She has already lost to someone, so
              she cannot be the best of six.
          - text: >
              Reject her: she is not a leader, so she cannot be the overall
              best.
            correct: true
            feedback: >
              Right. Under all-or-nothing scoring a second-best-so-far
              applicant is worth exactly nothing.
          - text: >
              Hire her if the applicant who beat her was rejected.
            feedback: >
              That changes nothing about the ranking. She is beaten either way,
              so under the classic objective she scores zero.
        feedback: >
          The classic objective never hires a non-leader. Now score by rank
          instead.
      - ask: >
          If you hire her, what is her expected rank among all six?
        expects: "7/3"
        hint: >
          Applicant $6$ is equally likely to land in any of the $6$ slots of
          the ordering. In how many of them does she land above applicant $5$?
        feedback: >
          Applicant $6$ beats applicant $5$ in $2$ of $6$ slots (above the
          leader, or between the leader and her). Then applicant $5$ ranks $3$;
          otherwise she ranks $2$. $2 + 2/6 = 7/3 \approx 2.33$.
      - ask: >
          If you reject her, you must hire applicant $6$. What is applicant
          $6$'s expected rank?
        expects: "7/2"
        feedback: >
          In a random order, the last applicant's rank is uniform on $1$ to
          $6$, so it averages $3.5$. Hiring applicant $5$ is better by more
          than a full rank.
      - reflect: >
          Same applicant, opposite decisions. What exactly about the objective
          flipped the decision — and what does that mean for quoting "skip
          $37\%$, then take the next leader" in a new problem?
        answer: >
          All-or-nothing scoring gives a rank-$2$ hire the same score as a
          rank-$6$ hire, so only leaders matter. Rank scoring credits near
          misses, so a late non-leader can be well worth taking. The $1/e$ rule
          was derived for one payoff; change the payoff and the rule changes,
          so check which objective is being scored before quoting it.

      - part: Two more constants
        teach: >
          Minimizing expected rank, with ranks only and no recall, is a much
          friendlier problem: the optimal expected rank tends to about $3.87$
          as $n \to \infty$, so you reliably land near the top while almost
          never hitting it. Changing the *information* instead — actual values
          from a known law, same all-or-nothing objective — raises the chance
          of catching the best from $1/e \approx 0.368$ to about $0.580$.
      - ask: >
          With $1000$ applicants, the classic $1/e$ rule lands the best about
          $37\%$ of the time. Roughly what is its expected *rank*?
        choices:
          - text: >
              About $3.87$.
            feedback: >
              That is the best achievable expected rank, by a rule built for
              it. The classic rule is built for something else.
          - text: >
              More than $180$.
            correct: true
            feedback: >
              Right. With probability about $1/e$ the best is in the rejected
              sample, no leader follows, and you are forced to take the last
              applicant, whose rank averages about $500$. That branch alone
              contributes about $500/e \approx 184$.
          - text: >
              About $1.6$, since it wins $37\%$ of the time and usually lands
              close otherwise.
            feedback: >
              It often does not land close. When the best is in the sample,
              the rule runs to the end and takes whoever is last.
        feedback: >
          The all-or-nothing rule is reckless by design: it gives up the bad
          outcomes to maximize the chance of the perfect one. Score it by rank
          and it is terrible.
      - ask: >
          Full information: three applicants whose scores are independent
          uniform draws on $[0, 1]$, and you see the scores. The first scores
          $0.9$. What is the probability she is the best of the three?
        expects: "0.81"
        feedback: >
          She is the best if both others score below $0.9$:
          $0.9 \times 0.9 = 0.81$. So hire her on the spot.
      - ask: >
          Under rank-only information, what would you know about that same
          first applicant?
        choices:
          - text: >
              That she is a leader, which makes her likely to be the best.
            feedback: >
              The first applicant is always a leader. It carries no
              information at all.
          - text: >
              Nothing that distinguishes her from any other first applicant.
            correct: true
            feedback: >
              Right. Rank-only cannot tell a $0.9$ from a $0.1$ in position $1$.
              Full information lets each value be judged against the known law,
              not just against its predecessors — which is where the jump from
              $0.368$ to $0.580$ comes from.
          - text: >
              Her score, since rank-only reveals the value of a leader.
            feedback: >
              Rank-only never reveals a value, for leaders or anyone else.
        feedback: >
          More information, better odds: knowing the law turns "best so far"
          into "probably best overall" when the value is high enough.

      - part: When you do not know how many will come
        ask: >
          Applicants will turn up at independent, uniformly random times over a
          $30$-day window, but you do not know how many. What rule keeps the
          $1/e$ guarantee?
        choices:
          - text: >
              Reject the first $37\%$ of applicants, then take the next leader.
            feedback: >
              "$37\%$ of applicants" needs the number of applicants, which you
              do not have.
          - text: >
              Reject everyone who arrives before day $30/e \approx 11$, then
              take the next leader.
            correct: true
            feedback: >
              Right. A cutoff in *time* replaces the cutoff in count, and it
              still wins with probability at least $1/e$ whatever the number of
              applicants turns out to be.
          - text: >
              No rule can guarantee anything without $n$.
            feedback: >
              Time does the job $n$ used to do. The time-based cutoff gives at
              least $1/e$ for every $n$.
        feedback: >
          Not knowing $n$ costs nothing in the guarantee — provided the cutoff
          is set by the clock rather than by a count.
      - teach: >
          Before quoting $37\%$, ask two questions out loud: "Am I scored on
          landing the very best, or on how good my hire is?" and "Do I see
          ranks, or values from a known law?" The classic answer is for
          all-or-nothing and ranks; the others are $3.87$ for expected rank
          and $0.580$ with full information.

  - node: quant-processes.stopping.prophet-gap
    hook: >
      This bounds how much you could possibly be leaving on the table by not seeing the future — a useful ceiling whenever you're unsure whether some stopping rule is "good enough."
    explanation: >
      $\mathbb{E}[\max_n Y_n]$ is what a prophet with total foresight collects — an unreachable benchmark for any genuine stopping rule, which by definition can't consult values it hasn't seen yet. The natural question is how large that gap can be, and the answer is bounded: a single fixed threshold, chosen so that $\Pr(\max_n Y_n\ge t)=1/2$, already guarantees at least half the prophet's expected value.

      Splitting the prophet's expectation at the threshold makes the argument bite: $\mathbb{E}[\max_n Y_n]\le t+\mathbb{E}[(\max_n Y_n-t)^{+}]$. The threshold rule captures at least half of each piece. It banks at least $t$ whenever some $Y_n$ clears $t$, which happens with probability exactly $1/2$ by construction — half of the first term. And whichever $Y_i$ is first to clear $t$, the rule also collects that draw's own overshoot $Y_i-t$; independence makes "nothing earlier already crossed" happen with probability at least $1/2$ regardless of $Y_i$'s size, so the rule captures at least half of $\mathbb{E}[(\max_n Y_n-t)^{+}]$ too. Add the two halves back together and the rule clears half the prophet's total.

      The constant $1/2$ can't be improved, and the tightness example is instructive: $Y_1=1$ always, $Y_2=1/\varepsilon$ with probability $\varepsilon$ and $0$ otherwise. The prophet nets almost $2$, but any rule nets exactly $1$ — betting on $Y_2$ mostly gets $0$, and banking $Y_1$ upfront can't beat $1$ either way. Use the bound as a ceiling on how much cleverness in rule design is worth.
    worked: >
      Let $Y_1=4$ for sure and $Y_2=10$ with probability $0.5$, else $0$. The prophet's value is $\mathbb{E}[\max(Y_1,Y_2)]=0.5(10)+0.5(4)=7$. The threshold with $\Pr(\max\ge t)=1/2$ is $t=10$: reject $Y_1=4$ since it's below $10$, then take $Y_2$ if it's $10$, or accept $0$ if forced to. That rule nets $0.5(10)+0.5(0)=5$, a ratio of $5/7\approx0.71$ to the prophet — comfortably above the $1/2$ guarantee, since this instance isn't the adversarial worst case.
    interview: >
      "How much could a smarter rule possibly beat a simple fixed-price offer?" is the practical phrasing; the interviewer wants the factor-of-two ceiling named along with the reasoning that a single threshold already secures half.
    pitfalls: >
      Treating the $1/2$ constant as typically nearly tight — the tight example is a deliberately extreme, high-variance construction, and well-behaved distributions usually clear the bound with room to spare, as above. Forgetting the independence and nonnegativity hypotheses, without which the guarantee isn't assured at all.
    recap: >
      No stopping rule beats the prophet's $\mathbb{E}[\max_n Y_n]$, but a single fixed threshold with $\Pr(\max_n Y_n\ge t)=1/2$ already secures at least half of it, and that constant is tight.
    dialogue:
      - part: Two envelopes and a prophet
        teach: >
          Two independent rewards are revealed in turn. $Y_1$ is $0$ or $8$,
          equally likely; $Y_2$ is $2$ or $10$, equally likely. You may bank
          $Y_1$, or discard it and bank $Y_2$. A prophet, who sees both before
          choosing, plays the same game.
      - ask: >
          What does the prophet collect on average,
          $\mathbb{E}[\max(Y_1, Y_2)]$?
        expects: "7.5"
        feedback: >
          The four equally likely pairs give maxima $2$, $10$, $8$, $10$, which
          average $30/4 = 7.5$.
      - ask: >
          What does the best stopping rule collect?
        expects: "7"
        hint: >
          Discarding $Y_1$ is worth $\mathbb{E}[Y_2]$.
        feedback: >
          Discarding is worth $(2 + 10)/2 = 6$, so bank an $8$ and discard a
          $0$: $0.5(8) + 0.5(6) = 7$. Foresight is worth $0.5$ here, a ratio of
          $7/7.5 \approx 0.93$.
      - ask: >
          Now make foresight as valuable as you can. $Y_1 = 1$ for sure, and
          $Y_2 = 10$ with probability $0.1$, else $0$. What does the prophet
          collect?
        expects: "1.9"
        feedback: >
          The prophet takes the $10$ when it comes and the $1$ otherwise:
          $0.1(10) + 0.9(1) = 1 + 0.9 = 1.9$.
      - ask: >
          And the best stopping rule?
        choices:
          - text: >
              $1.9$, by waiting for the $10$.
            feedback: >
              Waiting means discarding $Y_1$ first, and then you get $Y_2$,
              which averages $0.1(10) = 1$. Only the prophet can wait for the
              $10$ without risking the $0$.
          - text: >
              $1$, whichever way you play.
            correct: true
            feedback: >
              Right. Banking $Y_1$ gives $1$; discarding gives
              $\mathbb{E}[Y_2] = 1$. The prophet gets $1.9$ by knowing which
              case he is in.
          - text: >
              $0.1$, since the $10$ is so unlikely.
            feedback: >
              You can always bank the certain $1$. No rule needs to do worse
              than $1$.
        feedback: >
          Shrink the probability and grow the prize, keeping their product at
          $1$, and the prophet approaches $2$ while you stay at $1$.
      - reflect: >
          Pushing that construction gets the ratio close to $2$ but never past
          it. For any independent, nonnegative rewards, what *simple* rule
          could you imagine guaranteeing half of the prophet's take — and how
          would you choose its one parameter?
        answer: >
          A single fixed threshold: bank the first reward that clears $t$.
          Choose $t$ so that some reward clears it with probability exactly
          $1/2$. Then half the time you collect at least $t$, and when the
          prophet does well because some reward overshoots $t$, you are
          usually still around to collect that overshoot yourself.

      - part: Half, with one threshold
        teach: >
          That is the prophet inequality. If $Y_1, \dots, Y_N$ are independent
          and nonnegative with known laws, a threshold $t$ with
          $\Pr(\max_n Y_n \ge t) = 1/2$ already gives
          $\mathbb{E}[Y_\tau] \ge \frac{1}{2}\mathbb{E}[\max_n Y_n]$, and the
          constant $\frac{1}{2}$ cannot be improved — your $1$-against-$1.9$
          example, pushed to the limit, shows why.
      - ask: >
          For the two envelopes, $\Pr(\max \ge 10) = 1/2$, so take $t = 10$.
          What does "bank the first reward of at least $10$" collect?
        expects: "6"
        hint: >
          $Y_1$ never reaches $10$, so you always move on to $Y_2$.
        feedback: >
          You always discard $Y_1$ and bank $Y_2$: $(2 + 10)/2 = 6$. That is
          above half the prophet, $3.75$ — less than the optimal $7$, but a
          single number set without solving anything.
      - ask: >
          The proof splits the prophet's take as
          $\mathbb{E}[\max_n Y_n] \le t + \mathbb{E}[(\max_n Y_n - t)^{+}]$.
          The rule gets $t$ half the time, covering half the first piece. For
          the second, it collects the overshoot of whichever $Y_i$ first
          clears $t$. Which fact guarantees it is still around to collect it?
        choices:
          - text: >
              Independence: whether some earlier reward already cleared $t$
              does not depend on $Y_i$, and has probability at most $1/2$.
            correct: true
            feedback: >
              Right. With probability at least $1/2$ no earlier reward crossed,
              whatever size $Y_i$ turns out to be, so the rule captures at
              least half of each overshoot — at least half the second piece.
          - text: >
              Nonnegativity: overshoots are never negative.
            feedback: >
              Nonnegativity is used elsewhere: when nothing clears $t$ the rule
              may be stuck with a small reward, and nonnegativity makes sure
              that is never a loss. It does not keep the rule waiting.
          - text: >
              The threshold is set at the median of the maximum.
            feedback: >
              That gives "some reward clears $t$ with probability $1/2$". It
              does not by itself stop an early crossing from correlating with a
              large later overshoot; independence does.
        feedback: >
          Half of $t$ plus half of the overshoot is half the prophet. The two
          hypotheses both carry weight.

      - part: When the guarantee fails
        ask: >
          Double or nothing: a pot starts at $1$. Each round you may take the
          pot, or leave it, and a fair coin then doubles it or wipes it out —
          after which every later reward is $0$. Four rounds, so the pot
          could reach $8$, and in round $4$ you must take what is there. What
          does the prophet collect?
        expects: "2.5"
        hint: >
          The prophet takes the pot in the last round before a wipe-out.
        feedback: >
          The pot survives to round $n$ with probability $1/2^{n-1}$. The
          prophet collects $1$, $2$, $4$ when the wipe-out comes after round
          $1$, $2$, $3$ (probabilities $1/2$, $1/4$, $1/8$) and $8$ if it never
          comes ($1/8$): $0.5 + 0.5 + 0.5 + 1 = 2.5$.
      - ask: >
          Every stopping rule here collects exactly $1$ — the pot is a fair
          game, so optional stopping fixes its expected value. Which hypothesis
          of the prophet inequality has failed?
        choices:
          - text: >
              Nonnegativity.
            feedback: >
              Every reward is $0$ or more. That hypothesis holds.
          - text: >
              Independence: a wipe-out zeroes every later reward, so the
              rewards are tied together.
            correct: true
            feedback: >
              Right. With dependence the ratio is $1/2.5 = 0.4$, below
              $\frac{1}{2}$, and adding rounds pushes it toward $0$: with $N$
              rounds the prophet gets $(N + 1)/2$.
          - text: >
              The horizon is too short for the threshold to work.
            feedback: >
              More rounds make the gap worse, not better. The trouble is the
              dependence, not the length.
        feedback: >
          Drop independence and foresight can be worth any multiple.
      - teach: >
          Use it as a ceiling: "With independent nonnegative rewards, even a
          prophet can't beat a single well-chosen threshold by more than a
          factor of two — so before building a clever rule, I'd check how much
          room there is."

  - node: quant-processes.stopping.early-exercise
    hook: >
      "When is it optimal to exercise an American option early?" is an optimal-stopping question wearing a finance costume, and the vocabulary — intrinsic value, continuation value — is a direct relabeling of what you already know.
    explanation: >
      Intrinsic value at a date is just the reward you'd get by stopping now, exercising the option; continuation value is the expected payoff of holding on, computed exactly the way one-step lookahead computes a continuation value elsewhere in this unit. The optimal exercise policy is the stopping time at which intrinsic value first overtakes continuation value — the same comparison, run at every decision point.

      On a binomial tree this is literally backward induction: value the final date's payoff, then at every earlier node take the max of intrinsic value and the discounted expectation of continuing, rolling backward to today. The only genuinely new ingredient finance adds is discounting future cash by the risk-free rate; the recursive structure is the machinery already built.

      The standard fact that a non-dividend-paying American call is never exercised early is exactly the statement that its continuation value dominates intrinsic value everywhere, so the "first overtake" comparison never fires — holding the option keeps the same upside while your cash still earns interest, so there's never a reason to give that up early. An American put has no equivalent shield, since a stock's price is bounded below by zero while its potential upside is not, so waiting can genuinely cost you interest on a payoff you could lock in today; its exercise boundary is real.
    interview: >
      "Is it ever optimal to exercise an American call early, no dividends?" wants "no — continuation value dominates everywhere" with the one-line reasoning above; a follow-up on puts wants "yes, a real exercise boundary" contrasted immediately.
    pitfalls: >
      Assuming the "never exercise early" fact carries over to puts, or to dividend-paying calls — both break the dominance argument that makes it true for the plain call. Treating this as requiring new option-pricing formulas rather than recognizing it as the same stopping comparison already known, just discounted.
    recap: >
      Early exercise is optimal stopping: exercise when intrinsic value first overtakes continuation value, which is why a non-dividend call is never exercised early but a put can be.
    dialogue:
      - part: A put deep in the money
        teach: >
          A stock at $50$ moves each period to $1.2$ or $0.8$ times its price.
          Your desk's model weights the up move $0.6$ and the down move $0.4$,
          and brings a payoff one period back by dividing by $1.04$. You hold
          an American put with strike $52$, expiring in two periods: at any
          date you may exercise and receive $52$ minus the stock price. After
          one period the stock has fallen to $40$.
      - ask: >
          Exercising now pays $52 - 40 = 12$. What is holding to expiry worth
          today?
        expects: "10"
        hint: >
          Next period the stock is $48$ or $32$, and the put then pays $4$ or
          $20$.
        feedback: >
          $(0.6 \times 4 + 0.4 \times 20)/1.04 = (2.4 + 8)/1.04 = 10.4/1.04
          = 10$.
      - ask: >
          So, exercise or hold?
        choices:
          - text: >
              Hold: an option is always worth more alive than dead.
            feedback: >
              That is the instinct, and the numbers just refuted it: holding is
              worth $10$, exercising $12$. "Alive is worth more" is true of
              some options, not all.
          - text: >
              Exercise: $12$ in hand beats $10$ for holding on.
            correct: true
            feedback: >
              Right. Intrinsic value has overtaken continuation value, so this
              is the moment to stop.
          - text: >
              Hold, because the stock may fall further, to $32$.
            feedback: >
              That possibility is already inside the $10$, weighted by its
              $0.4$. Even counting it, holding is worth less.
        feedback: >
          The decision is a single comparison: what stopping pays now against
          what continuing is worth.
      - reflect: >
          Where do the $2$ go? Look at both prices the stock can reach next
          period, and say what holding buys you that exercising does not —
          and what it costs.
        answer: >
          Both next-period prices, $48$ and $32$, are below the strike, so the
          put finishes in the money either way: holding gives no protection
          you lack by exercising now. All it does is postpone receiving the
          $52$ by a period, and postponing $52$ costs
          $52 - 52/1.04 = 2$. Deep in the money, a put is mostly a delayed
          payment of the strike, and delay is costly.

      - part: The same comparison, renamed
        teach: >
          This is optimal stopping in a finance costume. Intrinsic value is
          the reward for stopping now; continuation value is the discounted
          expectation of holding on; the optimal exercise time is the first
          date at which intrinsic value overtakes continuation value. On a
          tree that is backward induction: value the final date, then at each
          earlier node take the larger of intrinsic and discounted
          continuation, rolling back to today.
      - ask: >
          At the other node after one period the stock is at $60$. What is the
          put worth there?
        expects: "1.538"
        tolerance: 0.001
        hint: >
          Next period the stock is $72$ or $48$. Exercising now pays nothing.
        feedback: >
          Continuation: $(0.6 \times 0 + 0.4 \times 4)/1.04 = 1.6/1.04
          \approx 1.538$; intrinsic is $\max(52 - 60, 0) = 0$. Hold.
      - ask: >
          What is the American put worth today, with the stock at $50$?
        expects: "5.503"
        tolerance: 0.005
        hint: >
          The node values are $1.538$ after an up move and $12$ after a down
          move — exercise was optimal there. Compare with exercising today.
        feedback: >
          Continuation: $(0.6 \times 1.538 + 0.4 \times 12)/1.04 =
          (0.923 + 4.8)/1.04 \approx 5.503$, against $2$ for exercising today,
          so hold. Had you been forbidden to exercise early, the down node
          would be worth $10$, not $12$, and the put about $4.73$.

      - part: Why the call never fires
        ask: >
          Same tree, an American *call* with strike $52$. At the node where the
          stock is $60$, exercising pays $8$. What is holding worth there?
        expects: "11.538"
        tolerance: 0.005
        feedback: >
          Next period the call pays $72 - 52 = 20$ or $0$:
          $(0.6 \times 20)/1.04 = 12/1.04 \approx 11.538 > 8$. Hold.
      - ask: >
          For a stock paying no dividends, continuation beats intrinsic at
          every node of a call's tree. Why?
        choices:
          - text: >
              Because the up move is more likely than the down move.
            feedback: >
              The weights matter for the numbers, not for the conclusion. The
              conclusion comes from interest on the strike and the right to
              walk away, neither of which depends on which move is likelier.
          - text: >
              Exercising pays the strike early, losing interest on it, and
              gives up protection if the stock later falls below the strike;
              without dividends, owning the stock early gains nothing.
            correct: true
            feedback: >
              Right. Holding keeps the same upside, keeps the strike earning
              interest, and keeps the right to walk away. Every term favours
              waiting.
          - text: >
              Because a call's intrinsic value is zero before expiry.
            feedback: >
              At the $60$ node it is $8$, not zero. The point is that
              continuation, $11.54$, is larger still.
        feedback: >
          The put is the mirror image with the shield removed: exercising a
          put *receives* the strike early, and deep in the money there is
          little protection left to give up.
      - ask: >
          Now the stock pays a large dividend just after the first period,
          going only to whoever owns the stock then. Does "never exercise a
          call early" survive?
        choices:
          - text: >
              Yes: the argument did not mention dividends.
            feedback: >
              It did — "owning the stock early gains nothing" is exactly what
              a dividend breaks.
          - text: >
              No: exercising just before the dividend captures it, which can
              outweigh the interest and protection given up.
            correct: true
            feedback: >
              Right. With a dividend, intrinsic value can overtake continuation
              just before the payment, so the exercise boundary becomes real
              for calls too.
          - text: >
              It survives, but the call is worth less.
            feedback: >
              The call is worth less to a holder who waits, which is precisely
              why waiting can stop being optimal.
        feedback: >
          The "never early" fact belongs to one instrument under one condition.
          Check the condition before quoting it.
      - teach: >
          In an interview: "Early exercise is optimal stopping — exercise the
          first time intrinsic value beats discounted continuation. For a call
          on a non-dividend stock that never happens, so it's worth the same as
          the European. For a put deep in the money it can, because holding
          only delays receiving the strike."
