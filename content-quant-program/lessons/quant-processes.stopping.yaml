unit: quant-processes.stopping
opening: >
  Optimal stopping turns a stream of one-at-a-time decisions — reroll or keep, hire or pass, exercise or hold — into a single repeated comparison: does what's in hand beat what continuing is worth? This unit builds that comparison from the value function and backward induction, works it fully through the fair-die reroll ladder, then swaps the finite-horizon machine for its long-horizon cousin, one-step lookahead, wherever a closed "don't bother continuing" region makes the myopic rule exactly right. It closes with the secretary problem's $1/e$ rule as the canonical rank-only, no-recall instance, a coda on how fragile that famous $37\%$ really is, and a pointer to American-option early exercise as the same idea in a finance costume.
lessons:
  - node: quant-processes.stopping.stopping-problem
    hook: >
      Every "reroll or keep," "hire now or wait," "exercise or hold" question in this branch is an instance of this one setup, and the interview tell is whether you can name its defining constraint — a stopping rule may use only what has already happened — before writing a single equation.
    explanation: >
      A stopping time already requires that quitting at time $n$ depend only on $Y_1,\dots,Y_n$, nothing later. Optimal stopping adds a payoff on top: instead of merely being allowed to stop at a non-anticipating time, you choose the non-anticipating rule that makes $\mathbb{E}[Y_\tau]$ as large as possible. That restriction is the entire content of the problem — drop it and the "optimal" rule collapses to "wait for whichever $Y_n$ turns out biggest," a rule no real decision-maker can execute, since it needs to see the future to know when to stop.

      Before any algebra, three questions fix which problem you are actually solving. Horizon: a hard deadline $N$, or can you keep looking indefinitely? Observation: do you see $Y_n$'s actual value, or only how it ranks against what came before? Recall: if you pass on $Y_n$, is it gone for good, or can you reclaim it later? Two questions phrased almost identically in English can have opposite answers here — "hire the best of $n$ candidates" is a different computation depending on whether you see salaries or only relative rank.

      The single-agent framing is worth stating explicitly, because habits from game theory import badly by mistake: there is no opponent picking a best response to your rule, only a fixed random mechanism generating $Y_1, Y_2,\dots$. Every technique this unit builds — backward induction, one-step lookahead — optimizes against chance, not against an adversary.
    worked: >
      Suppose $Y_1$ pays $8$ with probability $1/2$ and $0$ otherwise, and if you pass, $Y_2$ pays a certain $5$. The rule "stop at $n=1$ iff $Y_1 \ge 5$" reads only $Y_1$, so it is a legitimate stopping time, giving $\mathbb{E}[Y_\tau] = \tfrac12(8)+\tfrac12(5)=6.5$. Contrast "accept whichever of $Y_1,Y_2$ turns out bigger": deciding at $n=1$ under that rule needs already knowing $Y_2$, so it is not a stopping time at all, however tempting its arithmetic looks.
    interview: >
      "How would you set this problem up" is really asking for the horizon, the observation type, and the recall rule stated before the reward sequence is even discussed; "is that a valid strategy" tests whether a proposed rule secretly peeks ahead. Stating $\mathbb{E}[Y_\tau]$ with $\tau$ explicitly non-anticipating is the ten-second version.
    pitfalls: >
      Proposing a rule that compares $Y_n$ against a later, unobserved value smuggles in information you don't have — check every candidate rule against the "known only through time $n$" test. Treating the problem as adversarial, as if some opponent shaped the $Y_n$, imports game-theoretic reasoning that doesn't belong here.
    recap: >
      A stopping rule must be a non-anticipating $\tau$, and before computing anything you need the horizon, what you observe, and whether a reject can be reclaimed.
    steps:
      - teach: >
          A stopping time already requires that quitting at time $n$ depend
          only on $Y_1,\dots,Y_n$ — nothing later. Optimal stopping adds a
          goal on top of that restriction: among every rule obeying it, choose
          the one that makes $\mathbb{E}[Y_\tau]$ as large as possible.
      - teach: >
          Drop the non-anticipating restriction and the "optimal" rule
          collapses to "take whichever $Y_n$ turns out biggest" — arithmetic
          that needs the future already known, and no real decision-maker can
          execute it. The restriction is the entire content of the problem,
          not a footnote on it.
      - ask: >
          Suppose $Y_1$ pays $6$ with probability $0.5$ and $0$ otherwise, and
          if you pass, $Y_2$ pays a certain $4$. Which of these is a valid
          stopping rule?
        choices:
          - text: >
              Stop at $n=1$ iff $Y_1 \ge 4$
            correct: true
            feedback: >
              This decision only ever looks at $Y_1$, which has already been
              observed at time $n=1$ — exactly what a non-anticipating rule
              requires.
          - text: >
              Stop at $n=1$ iff $Y_2 > Y_1$
            feedback: >
              Deciding at $n=1$ this way needs already knowing $Y_2$, which
              hasn't happened yet — this rule peeks ahead and isn't a
              stopping time at all.
          - text: >
              Always take whichever of $Y_1$, $Y_2$ turns out larger
            feedback: >
              Same defect as the option above: picking the larger of the two
              after the fact requires foresight a real decision-maker doesn't
              have at time $n=1$.
          - text: >
              Stop at $n=1$ iff $Y_1$ is at least the threshold computed after
              seeing $Y_2$
            feedback: >
              The threshold itself is being built from $Y_2$, which hasn't
              been observed yet at decision time — the same non-anticipating
              violation in different clothing.
        feedback: >
          A stopping rule may only use what's already happened. "Stop at $n=1$
          iff $Y_1\ge4$" passes that test; anything that needs $Y_2$'s value
          to decide at $n=1$ fails it, however natural the comparison looks on
          paper.
      - teach: >
          There is no opponent picking a best response to your rule here —
          only a fixed random mechanism generating $Y_1, Y_2, \dots$. Every
          technique this unit builds optimizes against chance, and importing
          game-theoretic reasoning (worst case over an adversary's replies)
          answers a different question.
      - ask: >
          $Y_1$ pays $12$ with probability $0.3$ and $2$ otherwise, and if you
          pass, $Y_2$ pays a certain $5$. Under the rule "stop at $n=1$ iff
          $Y_1 \ge 5$", what is $\mathbb{E}[Y_\tau]$?
        expects: "7.1"
        hint: >
          Condition on whether $Y_1$ clears the threshold: when it does, you
          stop and keep it; when it doesn't, you continue and collect the
          certain $Y_2$.
        feedback: >
          $Y_1=12$ clears $5$ and is kept; $Y_1=2$ doesn't, so you continue to
          $Y_2=5$. $\mathbb{E}[Y_\tau]=0.3(12)+0.7(5)=3.6+3.5=7.1$.
      - teach: >
          The three switches interact: change any one and you may be solving a
          different problem even though the English describing it barely
          changed. Pin all three before reaching for a formula, not just the
          one that feels most obviously in play.
      - ask: >
          A trading desk gets one price quote per day for a position it wants
          to unload, must decide immediately, and once a quote is passed on
          it's gone for good. Which pair of switches describes this?
        choices:
          - text: >
              No recall, full information
            correct: true
            feedback: >
              'Once passed on it's gone for good' is exactly no recall, and a
              price quote is the actual number itself, not merely a comparison
              — that's full information.
          - text: >
              Recall, full information
            feedback: >
              The quote being gone once you pass on it is the definition of no
              recall, not recall.
          - text: >
              No recall, rank-only
            feedback: >
              You're told the quote's own price, a real number — that's full
              information, not merely how it compares to earlier quotes.
          - text: >
              Recall, rank-only
            feedback: >
              Both switches are backwards here: the quote is gone once passed
              on, and you see its actual value, not just its rank.
        feedback: >
          Say both switches out loud before computing anything: whether a
          reject can be reclaimed, and whether you see values or only relative
          standing.
      - teach: >
          The habit that survives every technique in this unit: name the
          horizon, the observation type, and the recall rule before the reward
          sequence is even discussed out loud. Comparing $Y_n$ against a later
          value you haven't seen is the one mistake to check every proposed
          rule against.

  - node: quant-processes.stopping.value-function
    hook: >
      This is the mechanical engine behind every rule in the unit: once you can write down $V_n$ and compare it against $Y_n$, "when should I stop" stops being a puzzle and becomes one inequality checked at every step.
    explanation: >
      $V_n$ is the best expected reward obtainable from time $n$ onward, given everything observed by then. At the deadline there is no choice left, so $V_N=Y_N$. Earlier, a rational decision-maker facing chance does exactly one of two things: bank $Y_n$, or continue and get whatever playing on optimally is worth in expectation, $\mathbb{E}[V_{n+1}\mid\mathcal{F}_n]$. $V_n$ is the better of these two numbers, and the optimal rule falls straight out: stop the first time the reward in hand meets or beats the continuation value.

      The subtlety worth internalizing is that $V_{n+1}$ already has every later decision baked in optimally — it is not "the average of what happens next," it is "the average of what happens next if you keep playing perfectly from here." That is what makes the recursion exact rather than a heuristic: comparing $Y_n$ to $V_{n+1}$ accounts for all remaining chances at once, not just the next one.

      $V_n$ can only drift downward in conditional expectation as time passes, since tomorrow's version of the game has strictly fewer chances left than today's — that "only shrinks" property is what the name supermartingale captures, and Snell envelope is just the name for the smallest such process sitting on top of the rewards.
    worked: >
      A coin pays $10$ dollars on heads (probability $0.4$) and $3$ on tails. With one flip, $V_1=\mathbb{E}[Y]=0.4(10)+0.6(3)=5.8$. With a second flip available, keep the first flip only if it clears $5.8$: heads ($10$) does, tails ($3$) doesn't, so $V_2 = 0.4(10)+0.6(5.8)=4+3.48=7.48$.
    interview: >
      Interviewers want $V_n$ and its boundary condition written down explicitly before any numbers, then the optimal rule stated as one comparison — "stop when $Y_n$ beats the continuation value" — not derived case by case.
    pitfalls: >
      Forgetting the boundary condition $V_N=Y_N$ — there is no continuation option at the deadline, you must accept whatever is in hand. Confusing the true continuation value $V_{n+1}$ with the value of just one more look, $\mathbb{E}[Y_{n+1}]$, understates continuing whenever more than one chance remains.
    recap: >
      $V_n=\max\left(Y_n,\mathbb{E}[V_{n+1}\mid\mathcal{F}_n]\right)$ with $V_N=Y_N$, and the optimal rule stops the moment $Y_n$ first meets the continuation value.
    steps:
      - teach: >
          $V_n$ packages "everything worth knowing about continuing" into a
          single number: the best expected reward obtainable from time $n$
          onward. Once you have it, "should I stop" stops being a puzzle and
          becomes one comparison against $Y_n$.
      - teach: >
          $V_N=Y_N$, since no choice remains at the deadline. Earlier,
          $V_n=\max\left(Y_n,\mathbb{E}[V_{n+1}\mid\mathcal{F}_n]\right)$ —
          bank the reward in hand, or take the expected value of playing on
          optimally, whichever is larger.
      - ask: >
          A biased coin pays $20$ on heads (probability $0.25$) and $4$ on
          tails. With only one flip available, what is $V_1$?
        expects: "8"
        hint: >
          With one flip you must accept whatever comes — weight each payoff
          by its probability.
        feedback: >
          $V_1=\mathbb{E}[Y]=0.25(20)+0.75(4)=5+3=8$.
      - teach: >
          $V_{n+1}$ is not "the average of what happens next" — it is "the
          average of what happens next if you keep playing perfectly from here
          on." That is what makes comparing $Y_n$ to $V_{n+1}$ exact rather
          than a shortcut: it accounts for every remaining chance at once, not
          just the next one.
      - ask: >
          With two flips of that same coin available, keep the first flip only
          if it clears $V_1=8$; otherwise play the second flip. What is $V_2$?
        expects: "11"
        hint: >
          Heads ($20$) clears $8$ and gets kept; tails ($4$) doesn't, so you
          continue and collect $V_1$ in expectation.
        feedback: >
          $V_2=0.25(20)+0.75(8)=5+6=11$ — heads is kept, tails continues into
          the second flip.
      - teach: >
          $V_n$ can only drift downward in conditional expectation as $n$
          increases, since tomorrow's version of the game always has fewer
          chances left than today's. That "only shrinks" property is exactly
          what the name supermartingale captures, and the Snell envelope is
          just the smallest such process sitting on top of the rewards.
      - ask: >
          With several chances still left, what should $Y_n$ be compared
          against to decide whether to stop?
        choices:
          - text: >
              $\mathbb{E}[Y_{n+1}]$, the average of just the very next look
            feedback: >
              This ignores every chance past $n+1$ — it understates the true
              continuation value whenever more than one chance remains.
          - text: >
              $\mathbb{E}[V_{n+1}\mid\mathcal{F}_n]$, the value of playing on
              optimally
            correct: true
            feedback: >
              This already has every later decision baked in optimally, which
              is exactly what makes the comparison exact.
          - text: >
              The largest value $Y_{n+1}$ could possibly take
            feedback: >
              That's an upper bound on one future draw, not the expected value
              of continuing to play optimally across every remaining chance.
          - text: >
              $V_N$, the value at the final stage
            feedback: >
              The boundary value only applies right at the deadline — using
              it at an earlier stage ignores how many chances actually remain.
        feedback: >
          The correct comparison is always against the true continuation value
          $\mathbb{E}[V_{n+1}\mid\mathcal{F}_n]$, never a single-look
          substitute — confusing the two is the standard way to misprice a
          stopping problem.
      - teach: >
          Forgetting $V_N=Y_N$ is the most common setup error: there is no
          continuation option at the deadline, so whatever is in hand there
          must be accepted. Everywhere earlier, the rule is the same one
          comparison, repeated: stop the moment $Y_n$ first meets the
          continuation value.

  - node: quant-processes.stopping.backward-induction
    hook: >
      This is the value-function recursion turned into arithmetic: solve the decision you're most sure about — the very last one — first, then work backward one comparison at a time.
    explanation: >
      Every earlier value in the recursion needs the next one already known, so any order other than last-to-first requires guessing what you haven't computed yet. Name the state you carry into a stage — usually the reward currently in hand plus the number of chances left — then set the final stage's value to whatever you must accept there, since no further choice remains. Each earlier stage's value is the max of the reward in hand and the expectation of the stage after it, already solved.

      Because rewards here are typically numbers on a line, "stop or continue" collapses into a single threshold at each stage: accept anything at or above the continuation value, reroll or reject anything below it. Backward induction's real output is not one number but a ladder of thresholds, one per stage, that together implement the optimal rule.

      The mental model is ordinary dynamic programming, with one twist worth flagging: unlike a game tree, where you'd take the worst case over an adversary's replies, every continuation value here is a plain expectation over chance. Recognize the shape — a bounded number of remaining chances, a reward revealed one at a time — and backward induction is the default move.
    worked: >
      A bonus round pays $100$ (probability $0.2$), $60$ (probability $0.5$), or $20$ (probability $0.3$), for up to $3$ rounds; you must accept whatever the final round gives. Last round: $V=0.2(100)+0.5(60)+0.3(20)=56$. Two rounds left: accept anything $\ge 56$, so only $100$ and $60$ qualify, giving $V=0.2(100)+0.5(60)+0.3(56)=66.8$. Three rounds left: accept anything $\ge 66.8$, so only $100$ now qualifies, giving $V=0.2(100)+0.8(66.8)=73.44$ — notice $60$ was worth keeping with two rounds left but not with three, exactly because the continuation value itself climbed.
    interview: >
      "Walk me through solving this step by step" wants the last stage's value written first, with the boundary condition stated explicitly, then each earlier threshold produced by comparison — not an intuited final answer.
    pitfalls: >
      Solving stages out of order, or guessing an early threshold before the later stages that determine it, tangles the algebra. Reusing one stage's threshold at another stage assumes the continuation value is constant when it generally isn't — the whole point of the ladder is that it moves.
    recap: >
      Solve the last stage first, get one number, then compare each earlier stage's reward against that number to get a ladder of thresholds back to the start.
    steps:
      - teach: >
          Every earlier value in the recursion needs the next one already
          known, so solving in any order but last-to-first means guessing a
          number you haven't computed yet. Backward induction just makes that
          necessity explicit: solve the stage you're most sure about first.
      - teach: >
          Name the state you carry into a stage — usually the reward in hand
          plus the chances left. Set the final stage's value to whatever must
          be accepted there, then let each earlier stage's value be the max of
          its own reward and the expectation of the (already-solved) stage
          after it.
      - ask: >
          A slot machine pays $50$ (probability $0.2$), $30$ (probability
          $0.3$), or $10$ (probability $0.5$), and you must accept whatever
          the final round deals. With one round left, what is $V_1$?
        expects: "24"
        hint: >
          Weight each payout by its probability.
        feedback: >
          $V_1=0.2(50)+0.3(30)+0.5(10)=10+9+5=24$.
      - teach: >
          Because the rewards here are plain numbers, "stop or continue"
          collapses into a single threshold at each stage: accept anything at
          or above the continuation value, pass on anything below it. Backward
          induction's real output is not one number but this ladder of
          thresholds, one per stage.
      - ask: >
          With a second round available, accept the first round's payout only
          if it clears $V_1=24$; otherwise play the second round. What is
          $V_2$?
        expects: "31"
        hint: >
          Which of $50$, $30$, $10$ clear $24$?
        feedback: >
          $50$ and $30$ both clear $24$ and get kept; $10$ doesn't, so
          $V_2=0.2(50)+0.3(30)+0.5(24)=10+9+12=31$.
      - teach: >
          The recursion is ordinary dynamic programming with one twist worth
          flagging: unlike a game tree, where you'd take the worst case over
          an opponent's replies, every continuation value here is a plain
          expectation over chance. Recognizing a bounded number of remaining
          chances with a reward revealed one at a time is the cue to reach for
          this technique.
      - ask: >
          Why can't you compute the first round's accept threshold of a three-
          round game before finishing the third round's arithmetic?
        choices:
          - text: >
              You can — the thresholds don't depend on each other
            feedback: >
              They do: each earlier threshold is built from the very next
              stage's already-solved value.
          - text: >
              The first round's threshold is the continuation value of the
              two-round game, which itself needs the one-round value solved
              first
            correct: true
            feedback: >
              Exactly — every stage's threshold is the previous stage's fully
              solved value, so there's only one order that doesn't require
              guessing.
          - text: >
              The problem is symmetric across rounds, so any solving order
              works
            feedback: >
              The rounds aren't symmetric — the continuation value climbs the
              further you are from the deadline, which is exactly what a
              shrinking ladder of thresholds reflects.
          - text: >
              The first round has no threshold, only later rounds do
            feedback: >
              Every round short of the deadline has a threshold — including
              the first, which is the number this technique is built to find.
        feedback: >
          Backward induction is forced, not stylistic: each stage's threshold
          is literally defined in terms of the next stage's value, so skipping
          ahead means guessing a number that hasn't been computed yet.
      - teach: >
          Reusing one stage's threshold at another stage assumes the
          continuation value stays constant — it doesn't, and the whole point
          of the ladder is that it climbs the further you are from the
          deadline. Solve last-to-first, one comparison at a time, and the
          thresholds fall out on their own.

  - node: quant-processes.stopping.dice-game
    hook: >
      The interview version of the reroll ladder is almost always this exact die, and reciting $3.5$ / $4.25$ / $14/3$ without being able to rebuild the reasoning live is a tell that you memorized rather than derived it.
    explanation: >
      Applying backward induction to a fair die is mechanical once you see the pattern. With one roll you must accept whatever comes, so $V_1$ is just the die's mean, $3.5$. With one extra chance, reroll only if the first roll falls below the value of that one guaranteed extra roll — keep $4,5,6$, reroll $1,2,3$ — which is the threshold rule from backward induction applied to two stages.

      Extending to three rolls, the continuation value has already risen to $4.25$, so the first roll gets pickier and keeps only $5,6$; the second roll of the three, now facing exactly the two-roll problem, reverts to keeping $4$ and up. That's the general fact worth keeping: the threshold rises the further you are from the deadline and falls as chances run out, because more remaining patience makes settling for a mediocre face less attractive.

      Recognize this shape — "you may redraw up to $k$ times, keep whichever you finally accept" — whenever it appears, whatever the underlying prize is. The recipe never changes: compute the base case, then repeatedly fold in "the expected value of the better of a fresh draw and the previous stage's value."
    worked: >
      Redo the ladder for a fair $8$-sided die with only two rolls allowed. One roll: $V_1=(1+\dots+8)/8=4.5$. Two rolls: keep the first roll if it's at least $4.5$, i.e. keep $\{5,6,7,8\}$ and reroll $\{1,2,3,4\}$, giving $V_2=\frac{5+6+7+8}{8}+\frac{4}{8}(4.5)=3.25+2.25=5.5$.
    interview: >
      "You roll a die, you may reroll up to twice, keeping your final face — what's the expected value with optimal play?" wants backward induction narrated stage by stage, with the accept threshold stated explicitly at each one, not a guessed number.
    pitfalls: >
      Applying the same threshold at every stage — comparing the first roll of three against the one-roll value $3.5$ instead of the two-roll value $4.25$ — undercounts the game's true value. Averaging over the reroll outcome incorrectly, by forgetting that a rerolled face is itself governed by the previous stage's value rather than the die's flat mean, breaks the recursion.
    recap: >
      Backward induction on a fair die gives $V_1=3.5$, $V_2=4.25$ ("keep $4$+"), $V_3=14/3\approx4.67$ ("keep $5$+, then $4$+") — thresholds that get pickier the more chances remain.
    steps:
      - teach: >
          Recognize this shape the instant it appears: "you may redraw up to
          $k$ times, keep whichever you finally accept," whatever the
          underlying prize actually is. The recipe never changes, only the
          numbers do.
      - teach: >
          With one roll you must accept whatever comes, so $V_1$ is just the
          die's mean. With one extra chance, reroll only if the first roll
          falls below the value of that guaranteed extra roll — a threshold
          rule, straight out of backward induction applied to two stages.
      - ask: >
          A fair $10$-sided die (faces $1$ through $10$) pays its face value,
          with only one roll allowed. What is $V_1$?
        expects: "5.5"
        hint: >
          It's the plain mean of the faces.
        feedback: >
          $(1+2+\dots+10)/10=55/10=5.5$.
      - teach: >
          The threshold rises the further you are from the deadline and falls
          as chances run out, because more remaining patience makes settling
          for a mediocre face less attractive. That's the fact worth keeping,
          not any one die's specific numbers.
      - ask: >
          With two rolls of that same $10$-sided die, keep the first roll only
          if it clears $V_1=5.5$. What is $V_2$?
        expects: "6.75"
        hint: >
          Which faces clear $5.5$, and what does a rerolled face end up worth
          in expectation?
        feedback: >
          Keep $\{6,\dots,10\}$: $(6+7+8+9+10)/10=4$. Reroll $\{1,\dots,5\}$,
          worth $5.5$ in expectation. $V_2=4+0.5(5.5)=4+2.75=6.75$.
      - teach: >
          The recipe never changes: compute the base case, then repeatedly
          fold in "the expected value of the better of a fresh draw and the
          previous stage's value." Whatever the prize is — dice, offers,
          anything on a line — that one fold is the entire technique.
      - ask: >
          With three rolls of that same $10$-sided die, which faces should the
          very first roll keep, given $V_2=6.75$?
        choices:
          - text: >
              $\{6,7,8,9,10\}$
            feedback: >
              That's the two-roll threshold ($5.5$), not tight enough for
              three rolls remaining.
          - text: >
              $\{7,8,9,10\}$
            correct: true
            feedback: >
              These clear $V_2=6.75$; $6$ doesn't, so it should be rerolled
              with two more chances still ahead.
          - text: >
              $\{8,9,10\}$
            feedback: >
              Too strict — $7$ already clears $6.75$ and is worth keeping.
          - text: >
              $\{5,6,7,8,9,10\}$
            feedback: >
              This reuses the one-roll baseline ($5.5$) instead of the two-
              roll continuation value ($6.75$) — too permissive this early.
        feedback: >
          Compare the first roll against $V_2$, the value of the two rolls
          still to come, not against any earlier stage's number — keep
          $\{7,8,9,10\}$, reroll everything else.
      - teach: >
          Applying the same threshold at every stage — comparing an early
          roll against a later stage's value, or vice versa — undercounts or
          overcounts the game. Backward induction on a die gives thresholds
          that get pickier the further you are from the deadline, and sloppier
          as chances run out.

  - node: quant-processes.stopping.dice-ladder-limit
    hook: >
      This two-branch recursion is worth having cold — it tells you not just that unlimited rerolls approach $6$, but exactly how fast, which is the number an interviewer actually wants when they ask how many rerolls before you're basically guaranteed near the top.
    explanation: >
      One more roll always buys the better of the fresh face and the old game, so $V_{k+1}=\mathbb{E}[\max(X,V_k)]$ generalizes the same move used to build $V_2$ and $V_3$. As $V_k$ climbs past $4$ and then past $5$, fewer faces clear the bar, so which faces get kept — and hence which linear recursion applies — changes with $V_k$ itself.

      While $4<V_k<5$, only $5$ and $6$ beat the continuation value, giving $V_{k+1}=\frac{11}{6}+\frac{2}{3}V_k$. Once $V_k>5$, only a $6$ is worth keeping, giving $V_{k+1}=1+\frac{5}{6}V_k$ — and this second recursion has $6$ as its own fixed point ($6=1+\frac56\cdot6$), so $6-V_{k+1}=\frac56(6-V_k)$: the gap to $6$ shrinks by a constant factor every extra roll, geometric decay rather than ever reaching the ceiling exactly.

      The mental model: unlimited free rerolls with no deadline is what "wait for a $6$" looks like when you arrive at it through finite-horizon machinery instead of assuming it — the ceiling and the $5/6$-per-roll decay rate both fall straight out of the same backward-induction reasoning already built for two and three rolls.
    worked: >
      Continue past $V_5=277/54\approx5.130$, which already exceeds $5$, using $V_{k+1}=1+\frac56V_k$: $V_6\approx5.275$, $V_7\approx5.396$, $V_8\approx5.496$, $V_9\approx5.580$. So it takes $9$ rolls of patience before the expected value first climbs past $5.5$.
    interview: >
      "Does letting the reroll count go to infinity ever actually beat just waiting for a six?" wants the two-regime recursion named and the ceiling identified as exactly $6$, approached geometrically at rate $5/6$ per roll, not a vague "it gets close."
    pitfalls: >
      Applying the $4<V_k<5$ recursion once $V_k$ has already crossed $5$ uses the wrong kept set and derails the whole trajectory. Treating the limit as reached in finitely many rolls, rather than only approached, misstates what geometric convergence means — $V_k<6$ for every finite $k$.
    recap: >
      Past $V_k=5$ the recursion is $V_{k+1}=1+\frac56V_k$, so $6-V_k$ shrinks by a factor of $5/6$ every extra roll on the way to the ceiling of $6$.
    steps:
      - teach: >
          Unlimited free rerolls with no deadline reads like it should just
          mean "wait for a $6$" — this recursion tells you not only that, but
          exactly how fast you get there, which is the number worth having
          cold.
      - teach: >
          One more roll always buys the better of a fresh face and the old
          game, so $V_{k+1}=\mathbb{E}[\max(X,V_k)]$ extends the same move
          used to build $V_2$ and $V_3$. As $V_k$ climbs past $4$ and then
          past $5$, fewer faces clear the bar, so which faces get kept — and
          which linear recursion applies — changes with $V_k$ itself.
      - ask: >
          Suppose at some stage of the ladder $V_k=4.8$ (still between $4$ and
          $5$). Applying $V_{k+1}=\frac{11}{6}+\frac{2}{3}V_k$, what is
          $V_{k+1}$?
        expects: "5.0333"
        tolerance: 0.0005
        hint: >
          Substitute $V_k=4.8$ directly into the formula and simplify.
        feedback: >
          $\frac{11}{6}+\frac{2}{3}(4.8)=1.8333+3.2=5.0333$.
      - teach: >
          Once $V_k$ passes $5$, only a $6$ is worth keeping, giving the
          second recursion $V_{k+1}=1+\frac{5}{6}V_k$. That recursion has $6$
          as its own fixed point, so $6-V_{k+1}=\frac{5}{6}(6-V_k)$ — the gap
          to $6$ shrinks by a constant factor every extra roll, a geometric
          approach rather than ever landing on the ceiling exactly.
      - ask: >
          Now suppose $V_k=5.4$ (past $5$). Applying
          $V_{k+1}=1+\frac{5}{6}V_k$, what is $V_{k+1}$?
        expects: "5.5"
        hint: >
          This regime only keeps a $6$; substitute directly.
        feedback: >
          $1+\frac{5}{6}(5.4)=1+4.5=5.5$.
      - teach: >
          This is "wait for a $6$" arrived at through finite-horizon machinery
          rather than assumed outright — the ceiling of $6$ and the
          $5/6$-per-roll decay rate both fall straight out of the same
          backward-induction reasoning already used for two and three rolls.
      - ask: >
          As $k\to\infty$, what happens to $V_k$?
        choices:
          - text: >
              It reaches exactly $6$ at some finite $k$
            feedback: >
              Geometric decay never reaches its fixed point in finitely many
              steps — $V_k<6$ for every finite $k$.
          - text: >
              It approaches $6$ but never reaches it in finitely many rolls,
              with the gap shrinking by a factor of $5/6$ each roll
            correct: true
            feedback: >
              This is exactly what $6-V_{k+1}=\frac{5}{6}(6-V_k)$ says: a
              geometric approach, not an arrival.
          - text: >
              It oscillates around $6$ indefinitely
            feedback: >
              The recursion is monotone once $V_k$ passes $5$ — it climbs
              steadily toward $6$, it doesn't oscillate.
          - text: >
              It approaches $5$, since faces $5$ and $6$ are both eventually
              kept
            feedback: >
              Once $V_k$ exceeds $5$, only a $6$ stays worth keeping — the
              ceiling is $6$, not $5$.
        feedback: >
          $V_k\to6$ geometrically, never arriving in finitely many rolls —
          the sanity check is that waiting indefinitely for a $6$ pays exactly
          $6$ and costs nothing but patience.
      - teach: >
          Applying the $4<V_k<5$ recursion once $V_k$ has already crossed $5$
          uses the wrong kept set and derails the whole trajectory — always
          check which side of the fixed point you're on before picking the
          formula.

  - node: quant-processes.stopping.one-step-lookahead
    hook: >
      This shortcut is what makes long or infinite-horizon stopping problems tractable at all — every reroll-with-a-fee or search-with-a-cost question in this unit reduces to this one-line comparison.
    explanation: >
      Full backward induction needs a last stage to start from, so it fails outright once the horizon is long or has no end. One-step lookahead substitutes the true continuation value — which in principle needs the entire remaining optimal policy — with a far cheaper proxy: the value of taking exactly one more observation and then stopping. Stop the moment the reward in hand already beats $\mathbb{E}[Y_{n+1}\mid\mathcal{F}_n]$, net of whatever continuing costs.

      Equivalently, name $B$ the set of situations where one more look doesn't pay for itself, and stop the first time you enter $B$. The substitution is reasonable because most of the benefit of continuing typically comes from the very next observation, with returns shrinking fast after that — sometimes this shortcut is only a good guess, and sometimes it is exactly optimal, which is what a closed absorption region pins down.

      Reach for this the instant a problem says "you may keep searching as long as you like" or "each extra look costs a fee" — that phrasing is the signal that full backward induction, which needs a hard endpoint, is off the table.
    worked: >
      Offers arrive i.i.d., worth $0$, $5$, or $10$ with equal probability, and each additional look costs $2$. One-step lookahead compares the offer in hand against $\mathbb{E}[Y]-c=5-2=3$: accept any offer $\ge 3$, meaning accept $5$ or $10$ and reject only $0$.
    interview: >
      "When does it stop being worth searching further?" wants the one-step comparison against $\mathbb{E}[Y_{n+1}]$ net of cost stated directly, with the resulting accept set named as a threshold, not a full re-derivation of the value function.
    pitfalls: >
      Comparing against $\mathbb{E}[Y_{n+1}]$ while forgetting to net out the cost of continuing biases the accept set too wide. Treating the lookahead answer as automatically exact is the most common overreach — in general it is only a heuristic.
    recap: >
      Stop as soon as the reward in hand beats the expected value of one more observation net of cost — cheap to compute, and sometimes exactly right.
    steps:
      - teach: >
          Reach for this the instant a problem says "search as long as you
          like" or "each extra look costs a fee" — that phrasing signals full
          backward induction, which needs a hard endpoint, is off the table.
      - teach: >
          Stop the moment the reward in hand already beats
          $\mathbb{E}[Y_{n+1}\mid\mathcal{F}_n]$, net of whatever continuing
          costs. Equivalently, name $B$ the set of situations where one more
          look doesn't pay for itself, and stop the first time you enter $B$.
      - ask: >
          Offers arrive i.i.d., equally likely to be $0$, $3$, $6$, $9$, or
          $12$, and each additional look costs $2$. What is the one-step
          lookahead accept threshold?
        expects: "4"
        hint: >
          Subtract the cost from the mean offer.
        feedback: >
          Mean offer $=(0+3+6+9+12)/5=6$; net of the $2$ cost, the threshold
          is $6-2=4$.
      - teach: >
          The substitution — one more look instead of the full remaining
          policy — is reasonable because most of the benefit of continuing
          usually comes from the very next observation. It is, in general,
          only a heuristic: sometimes it's exactly optimal, and what pins that
          down is next.
      - ask: >
          Using the threshold of $4$ from above, which offers from
          $\{0,3,6,9,12\}$ get accepted?
        choices:
          - text: >
              $\{6,9,12\}$
            correct: true
            feedback: >
              Each of these clears the net threshold of $4$.
          - text: >
              $\{3,6,9,12\}$
            feedback: >
              $3$ is below the threshold of $4$ — rejecting it and continuing
              is worth more.
          - text: >
              $\{9,12\}$
            feedback: >
              Too strict — $6$ already clears the threshold of $4$.
          - text: >
              All five offers
            feedback: >
              Ignoring the threshold defeats the point of the rule — $0$ and
              $3$ both fall below it.
        feedback: >
          Accept anything at or above the net threshold: $\{6,9,12\}$, reject
          $\{0,3\}$.
      - teach: >
          Nothing about this substitution guarantees exactness on its own —
          treating a lookahead answer as automatically the true optimum is the
          most common overreach. Whether it happens to be exact is a separate,
          checkable fact, covered next.
      - ask: >
          Same offers $\{0,3,6,9,12\}$, but the cost per look rises to $4$.
          What is the new accept threshold?
        expects: "2"
        hint: >
          The mean offer hasn't changed — only the cost being netted out has.
        feedback: >
          $6-4=2$.
      - teach: >
          Comparing against $\mathbb{E}[Y_{n+1}]$ while forgetting to net out
          the cost of continuing biases the accept set too wide. Stop as soon
          as the reward in hand beats one more look's expected value net of
          cost — cheap to compute, and sometimes exactly right.

  - node: quant-processes.stopping.monotone-case
    hook: >
      This is the fine print that tells you whether one-step lookahead is the actual optimal rule or merely a plausible guess — and the reroll ladder is the standard case where guessing costs real value.
    explanation: >
      Call a problem monotone if the "don't bother continuing" region $B$ is closed: once the process lands in $B$, it never leaves. The clean case is a per-look game with a fixed cost against draws from a fixed law — the comparison "is one more look worth it" is the identical computation at every visit, so $B$ can't depend on how many looks have already happened or how many remain.

      Closedness is what forces exactness. If landing in $B$ means every possible future also stays in $B$, no strategy that plans further ahead can ever escape back into "keep going" territory, so there is nothing further-lookahead reasoning could have bought you — the one-step comparison has already accounted for everything relevant, by induction backward from any horizon you like.

      The finite free-reroll ladder is the counterexample worth keeping: its true accept region shifts with how many rolls remain — keep $4$+ with two left, but only $5$+ with three — so a single fixed threshold can't be closed. A per-look fee game, by contrast, is stationary: nothing about the decision changes between visits, so the same threshold solves it forever via a single self-referential equation, $V=\mathbb{E}[\max(X,V-c)]$, rather than a shrinking ladder.
    worked: >
      Take a fee-based reroll game, fee $c=1$, on a fair $4$-sided die. Guessing the accept set $\{2,3,4\}$: $V=\frac{2+3+4}{4}+\frac14(V-1)=2+\frac{V}{4}$, so $V=8/3\approx2.67$. The resulting threshold $V-c=5/3\approx1.67$ does keep exactly $\{2,3,4\}$, confirming the guess — the same accept set works at every visit, exactly as closedness predicts.
    interview: >
      "Is greedy optimal here?" wants you to check whether the stop region can be exited once entered, not assume a heuristic is exact by default; a fixed per-look cost against i.i.d. draws is the canonical monotone example to cite.
    pitfalls: >
      Assuming a lookahead-derived threshold is automatically optimal without checking closedness silently fails on any problem with a shrinking horizon, like the plain reroll ladder. Assuming "one threshold works forever" from a stationary fee game carries over to a game whose fee or underlying law changes over time — it doesn't.
    recap: >
      Lookahead is exactly optimal when the "stop" region can't be exited once entered; the reroll ladder fails this, a stationary per-look fee game satisfies it automatically.
    steps:
      - teach: >
          This is the fine print that tells you whether one-step lookahead is
          the actual optimum or merely a plausible guess — and the reroll
          ladder is the standard case where guessing costs real value.
      - teach: >
          Call a problem monotone if the "don't bother continuing" region $B$
          is closed: once the process lands in $B$, it never leaves. If one
          more step doesn't pay and never will again, no further-lookahead
          plan can buy back anything the one-step comparison already accounted
          for.
      - ask: >
          Which of these is monotone — its stop region $B$ closed?
        choices:
          - text: >
              A free reroll ladder capped at $3$ rolls
            feedback: >
              Its accept set shifts with how many rolls remain (keep $4$+ with
              two left, only $5$+ with three) — not closed.
          - text: >
              A per-look game with a fixed fee $c$ against i.i.d. draws from a
              fixed law, unlimited horizon
            correct: true
            feedback: >
              The comparison "is one more look worth it" is identical at every
              visit, so $B$ can't depend on how many looks have already
              happened.
          - text: >
              A reroll game where the fee itself increases every time it's
              paid
            feedback: >
              Nonstationary — the comparison changes shape from visit to
              visit, so closedness isn't automatic.
          - text: >
              A search whose deadline shortens by one day after every rejected
              offer
            feedback: >
              A shrinking deadline behaves like the finite reroll ladder —
              the comparison changes as the deadline approaches, so $B$
              needn't be closed.
        feedback: >
          Monotonicity needs the per-visit comparison to never change shape —
          a stationary per-look fee against a fixed law is the clean case;
          anything with a shrinking horizon generally isn't.
      - teach: >
          If landing in $B$ means every possible future also stays in $B$, no
          strategy that plans further ahead can ever escape back into "keep
          going" territory. There is nothing further-lookahead reasoning could
          have bought you — the one-step comparison has already accounted for
          everything relevant.
      - ask: >
          A fair $5$-sided die (faces $1$-$5$) is played with a $1$-unit fee
          per reroll. Guessing the accept set $\{3,4,5\}$: what is $V$?
        expects: "10/3"
        tolerance: 0.0005
        hint: >
          Substitute the guessed accept set's mean and the fee into
          $V=\mathbb{E}[\max(X,V-c)]$, then solve the resulting linear
          equation.
        feedback: >
          $V=\frac{3+4+5}{5}+\frac{2}{5}(V-1)=2+\frac{2}{5}V \Rightarrow
          \frac{3}{5}V=2 \Rightarrow V=\frac{10}{3}\approx3.33$.
      - teach: >
          An unchecked guess can be wrong even when the algebra looks
          perfectly clean — the resulting threshold $V-c$ has to actually
          reproduce the accept set you started from, or the guess needs
          revising.
      - ask: >
          What is the resulting threshold $V-c$ for the game above, and does
          it reproduce $\{3,4,5\}$?
        expects: "7/3"
        tolerance: 0.0005
        hint: >
          Subtract the fee from the $V$ you just solved for.
        feedback: >
          $V-c=\frac{10}{3}-1=\frac{7}{3}\approx2.33$, and faces $\ge2.33$ are
          exactly $\{3,4,5\}$ — the guess is confirmed.
      - teach: >
          Lookahead is exactly optimal only when the stop region can't be
          exited once entered; the reroll ladder fails this test, while a
          stationary per-look fee game against a fixed law satisfies it
          automatically.

  - node: quant-processes.stopping.reroll-fee
    hook: >
      This is the fixed-point trick for collapsing an infinite-horizon reroll game into one equation, and "guess the accept set, solve for $V$, check the guess reproduces itself" is the actual recipe an interviewer wants named.
    explanation: >
      At any point in this game you either take the current draw or pay $c$ to reroll and face the exact same game again — the game has no memory of how many times you've already paid the fee. That self-similarity is why the value satisfies $V=\mathbb{E}[\max(X,V-c)]$: a genuine fixed-point equation rather than a finite ladder, since there is no last stage to anchor a backward recursion to.

      Because this per-look game looks identical at every visit, the same accept-or-reject threshold has to be right forever, which is exactly why one equation nails the whole infinite game. Solve it by guessing a threshold or accept set, substituting into the equation to get $V$ in terms of itself, solving algebraically, and then checking that the resulting threshold $V-c$ actually reproduces the accept set you guessed — an unchecked guess can be wrong even when the algebra looks clean.

      The rule that falls out, "accept iff $X\ge V-c$," is exactly the one-step-lookahead comparison — current draw against continuation value net of fee — applied to a game where that comparison never changes shape from one visit to the next.
    worked: >
      Try $c=0.25$ on the ordinary $6$-sided die. A first guess, accept $\{4,5,6\}$, gives $V=\frac{4+5+6}{6}+\frac36(V-0.25)=2.375+0.5V$, so $V=4.75$ — but then the threshold $V-c=4.5$ would keep only $\{5,6\}$, contradicting the guess. Retrying with accept $\{5,6\}$: $V=\frac{5+6}{6}+\frac46(V-0.25)=\frac53+\frac23V$, giving $V=5$, and $V-c=4.75$ does keep exactly $\{5,6\}$ — self-consistent. A quarter fee is worth $5$, tighter than the $4.50$ at a fifty-cent fee.
    interview: >
      "If it costs you $c$ to reroll, what's this game worth?" wants the fixed-point equation $V=\mathbb{E}[\max(X,V-c)]$ set up immediately, with guess-substitute-verify narrated aloud rather than a number pulled from nowhere.
    pitfalls: >
      Solving for $V$ from a guessed accept set without then checking the resulting threshold reproduces that same set — a plausible-looking guess can be self-inconsistent, as the first attempt above was. Forgetting that a rising fee can only ever lower the game's value is a useful sanity check that catches sign errors.
    recap: >
      $V=\mathbb{E}[\max(X,V-c)]$ solves an infinite reroll game with one fixed point; guess the accept set, solve for $V$, and verify the threshold $V-c$ reproduces it.
    steps:
      - teach: >
          This collapses an infinite-horizon reroll game into one equation,
          because the game has no memory of how many times you've already paid
          the fee — it looks identical at every visit.
      - teach: >
          $V=\mathbb{E}[\max(X,V-c)]$: accept the current draw only if it
          beats the continuation value net of the fee. Solve it by guessing an
          accept set or threshold, substituting to get $V$ in terms of itself,
          solving algebraically, then checking the resulting threshold $V-c$
          actually reproduces the guess.
      - ask: >
          A fair $6$-sided die is rerolled at a fee of $0.6$ per reroll.
          Guessing the accept set $\{4,5,6\}$: what is $V$?
        expects: "4.4"
        hint: >
          Substitute the guessed accept set's mean and the fee into
          $V=\mathbb{E}[\max(X,V-c)]$, then solve the linear equation for $V$.
        feedback: >
          $V=\frac{4+5+6}{6}+\frac{3}{6}(V-0.6)=2.2+0.5V \Rightarrow V=4.4$.
      - teach: >
          The rule "accept iff $X\ge V-c$" is exactly the one-step-lookahead
          comparison — current draw against continuation value net of fee —
          applied to a game where that comparison never changes shape from one
          visit to the next. That's the whole reason one fixed-point equation,
          not a ladder, solves it.
      - ask: >
          What threshold $V-c$ does the solution above give, and does it
          reproduce $\{4,5,6\}$?
        expects: "3.8"
        hint: >
          Subtract the fee from the $V$ just solved.
        feedback: >
          $V-c=4.4-0.6=3.8$, and faces $\ge3.8$ are exactly $\{4,5,6\}$ — the
          guess is confirmed.
      - teach: >
          Solving for $V$ from a guessed accept set without checking that the
          resulting threshold reproduces the same set is the standard way this
          technique goes wrong — a plausible-looking guess can still be self-
          inconsistent.
      - ask: >
          Same die, same $0.6$ fee — does guessing the narrower accept set
          $\{5,6\}$ self-confirm?
        choices:
          - text: >
              Yes — solving gives $V=4.3$ and a threshold of $3.7$, which
              keeps exactly $\{5,6\}$
            feedback: >
              The algebra does give $V=4.3$, but the resulting threshold $3.7$
              also clears face $4$ — it doesn't reproduce the guessed set.
          - text: >
              No — the resulting threshold clears face $4$ too, so the true
              accept set is $\{4,5,6\}$
            correct: true
            feedback: >
              Exactly — the narrower guess understates the accept set,
              matching the $\{4,5,6\}$ solution found earlier.
          - text: >
              It's impossible to tell without a third guess
            feedback: >
              One substitution is enough — solve for $V$, compute $V-c$, and
              compare it against the guessed set directly.
          - text: >
              Yes, because both $5$ and $6$ individually exceed the fee $0.6$
            feedback: >
              Comparing a face to the raw fee isn't the check — the
              comparison is against the fixed-point threshold $V-c$, not the
              fee alone.
        feedback: >
          Guessing too narrow a set is caught the same way guessing too wide a
          one is: solve, compute $V-c$, and see whether it reproduces exactly
          the set you guessed.
      - teach: >
          A rising fee can only ever lower the game's value — a useful sign
          check: raising the fee from $0.25$ to $0.6$ on a $6$-sided die
          dropped its value, not raised it.

  - node: quant-processes.stopping.house-selling
    hook: >
      This is search-with-a-cost in its cleanest form, and the reservation price $1-\sqrt{2c}$ is exactly the kind of formula you should be able to rederive live, not recite.
    explanation: >
      Offers are i.i.d. $U(0,1)$, each look costs $c$, and you decide on the spot — no recall, an infinite horizon carried by the fee rather than a deadline. Because every look faces the identical draw and the identical cost, this is a stationary per-look-fee game, so one-step lookahead is not just a heuristic here but exactly optimal: keep searching only while the expected gain from one more look, $\mathbb{E}[(X-x)^{+}]$, still exceeds $c$.

      For $U(0,1)$, that expected gain has a clean closed form: $\mathbb{E}[(X-x)^{+}]=\int_x^1(u-x)\,du=\frac{(1-x)^{2}}{2}$, the area of the triangle of "how much better than $x$" a draw above $x$ tends to be. Setting $\frac{(1-x)^{2}}{2}=c$ and solving gives the stationary threshold $x^{*}=1-\sqrt{2c}$.

      That same $x^{*}$ is also the game's value, by the same fixed-point logic as the fee-per-look re-roll game: at the threshold you are exactly indifferent between stopping now and continuing, so the game must be worth precisely what stopping now delivers there.
    worked: >
      Take $c=0.005$: $x^{*}=1-\sqrt{2(0.005)}=1-\sqrt{0.01}=0.9$. The number of offers viewed is geometric with mean $1/(1-x^{*})=1/0.1=10$, the accepted price averages $\mathbb{E}[U\mid U\ge0.9]=0.95$, and the net payoff is $0.95-10(0.005)=0.9=x^{*}$, confirming the threshold is also the value.
    interview: >
      "You're searching for an apartment, each viewing costs time — when do you stop?" wants $x^{*}=1-\sqrt{2c}$ produced from $\mathbb{E}[(X-x)^{+}]=c$, plus the mean-number-of-looks sanity check that ties the accepted price and total cost back to $x^*$ exactly.
    pitfalls: >
      Treating one-step lookahead as exact here without noting it's because the problem is monotone — a fixed cost against a fixed law, unlike the shrinking-horizon dice ladder — is a gap in the justification, not just a stylistic one. Confusing the accepted price's average ($0.95$ here) with the game's net value ($0.9$) drops the search cost already spent.
    recap: >
      Search costing $c$ per look against $U(0,1)$ offers has reservation price and value $x^{*}=1-\sqrt{2c}$, found by setting the expected gain from one more look equal to the cost.
    steps:
      - teach: >
          The reservation price $1-\sqrt{2c}$ is exactly the kind of formula
          you should be able to rederive live, not recite from memory.
      - teach: >
          Offers are i.i.d. $U(0,1)$, each look costs $c$, and every look
          faces the identical draw and identical cost — a stationary per-
          look-fee game. One-step lookahead is therefore not a heuristic here
          but exactly optimal: keep searching only while
          $\mathbb{E}[(X-x)^{+}]$ still exceeds $c$.
      - teach: >
          For $U(0,1)$, $\mathbb{E}[(X-x)^{+}]=\int_x^1(u-x)\,du=
          \frac{(1-x)^{2}}{2}$ — the area of the triangle of "how much better
          than $x$" a draw above $x$ tends to be. Setting this equal to $c$
          and solving gives the stationary threshold $x^{*}=1-\sqrt{2c}$.
      - ask: >
          Take $c=0.08$. What is $x^{*}$?
        expects: "0.6"
        hint: >
          Solve $\frac{(1-x)^{2}}{2}=c$ for $x$.
        feedback: >
          $(1-x)^{2}=0.16 \Rightarrow 1-x=0.4 \Rightarrow x^{*}=0.6$.
      - teach: >
          That same $x^{*}$ is also the game's value, by the same fixed-point
          logic as the fee-per-reroll game: at the threshold you're exactly
          indifferent between stopping and continuing, so the game must be
          worth precisely what stopping there delivers.
      - ask: >
          With $c=0.08$ (so $x^{*}=0.6$), the number of offers viewed is
          geometric with success probability $1-x^{*}$. What's its mean?
        expects: "2.5"
        hint: >
          The mean of a geometric count is one over its success probability.
        feedback: >
          $1/(1-0.6)=1/0.4=2.5$.
      - ask: >
          The accepted price averages $\mathbb{E}[U\mid U\ge0.6]=0.8$. What is
          the net payoff — accepted price minus total expected search cost —
          and does it match $x^{*}$?
        expects: "0.6"
        hint: >
          Subtract the mean number of looks times the cost per look from the
          accepted price's average.
        feedback: >
          $0.8-2.5(0.08)=0.8-0.2=0.6=x^{*}$, confirming the threshold is also
          the value.
      - teach: >
          Treating lookahead as exact here without noting *why* — a fixed
          cost against a fixed law, unlike the shrinking-horizon dice ladder
          — is a gap in the justification. And don't confuse the accepted
          price's average with the game's net value: the search cost already
          spent has to come out.

  - node: quant-processes.stopping.recall
    hook: >
      Two throwaway modeling words — "with recall" or "ranks only" — completely change which formula applies, and saying them out loud before solving is the fastest way to avoid answering a different problem than the one asked.
    explanation: >
      Recall decides how much a stopping rule actually restricts you. With recall, the payoff is $\max_{k\le n}Y_k$, so you can wait out the whole sequence and grab the best one seen so far at the very end — patience costs nothing, and the stopping aspect nearly disappears. Without recall, passing on $Y_n$ is irrevocable, which is what makes deciding when to stop a genuine problem rather than a formality.

      Observation decides how much you're told. Under full information you see $Y_n$'s actual value, drawn from a known law; under rank-only information you see only how $Y_n$ compares with everything before it. Rank-only strictly throws information away: two candidates that both happen to be "better than everything so far" look identical under this signal even if their true values are worlds apart.

      Say both switches out loud before solving, because problems that share a paragraph of English can be opposites once they're pinned down — "no recall, ranks only, win only by landing the very best" and "recall, full information, i.i.d. values" share almost no structure and essentially never share an answer.
    worked: >
      Three offers, in order, are $40\text{k}$, $70\text{k}$, $55\text{k}$. Under full information you see those numbers directly; under rank-only information you'd see only "first," "better than the last," "worse than the last" — never learning that $70\text{k}$ beat the others by tens of thousands. With recall, rejecting all three in real time costs nothing, since you can go back and take $70\text{k}$ regardless. Without recall, passing on $70\text{k}$ hoping for better loses it for good.
    interview: >
      "What do you get to observe, and can you go back?" is often the implicit question behind a stopping-problem prompt before any payoff rule is even stated; answering it up front signals you know these two switches change the entire problem.
    pitfalls: >
      Assuming full information by default whenever a problem says "candidates" or "applicants" — many classic phrasings deliberately mean rank-only. Assuming recall by default when a problem says "decide on the spot," which is the standard signal for no recall.
    recap: >
      Whether a rejected item can be reclaimed, and whether you see values or only relative ranks, are two modeling choices that determine which stopping problem you're actually solving.
    steps:
      - teach: >
          Two throwaway modeling words — "with recall" or "ranks only" —
          completely change which formula applies. Saying them out loud before
          solving is the fastest way to avoid answering a different problem
          than the one asked.
      - teach: >
          With recall, the payoff is $\max_{k\le n}Y_k$, so you can wait out
          the whole sequence and grab the best one seen so far at the very end
          — patience costs nothing. Without recall, passing on $Y_n$ is
          irrevocable, which is what makes deciding when to stop a genuine
          problem.
      - ask: >
          Four offers arrive in order: $30\text{k}$, $65\text{k}$,
          $45\text{k}$, $50\text{k}$. With recall, what's the most (in
          thousands) you could walk away with by waiting out the whole
          sequence and going back for the best?
        expects: "65"
        hint: >
          With recall, the whole sequence is available at the end — take the
          maximum.
        feedback: >
          $\max(30,65,45,50)=65$, so $65\text{k}$.
      - teach: >
          Under full information you see $Y_n$'s actual value, drawn from a
          known law; under rank-only information you see only how $Y_n$
          compares with everything before it. Rank-only strictly throws
          information away — two candidates that both look "better than
          everything so far" can be worlds apart in true value.
      - ask: >
          A hiring manager sees only whether each candidate is better or worse
          than everyone interviewed so far, and once a candidate is passed
          over the position is filled and gone. Which pair of switches is
          this?
        choices:
          - text: >
              Recall, full information
            feedback: >
              Both switches are wrong: the position is filled and gone once
              passed over, and only a comparison is seen, not a value.
          - text: >
              No recall, rank-only
            correct: true
            feedback: >
              The position being gone once passed over is no recall, and
              seeing only "better or worse than so far" is rank-only.
          - text: >
              Recall, rank-only
            feedback: >
              The position is filled and gone once passed over — that's no
              recall, not recall.
          - text: >
              No recall, full information
            feedback: >
              Only a comparison is observed, not an actual value — that's
              rank-only, not full information.
        feedback: >
          "Once passed over it's gone" is no recall; "only better or worse
          than so far" is rank-only — both switches point the same direction
          here.
      - teach: >
          The two switches vary independently, so a problem stated in a single
          paragraph of English can hide either combination. "No recall, ranks
          only, land the very best" and "recall, full information, i.i.d.
          values" can look similar in prose and share almost no structure.
      - ask: >
          Under rank-only information, why can two candidates that are each
          "better than everything so far" look identical even though their
          true values differ by a lot?
        choices:
          - text: >
              Because rank-only information discards magnitude — you only
              ever learn a comparison, never the underlying value
            correct: true
            feedback: >
              Exactly — the signal you receive is "better than what came
              before," which is the same message whether the margin is tiny or
              enormous.
          - text: >
              Because rank-only implies no recall as well
            feedback: >
              The two switches vary independently — rank-only says nothing
              about whether a reject can be reclaimed.
          - text: >
              Because ranks are always tied under full information
            feedback: >
              This doesn't describe either information type correctly — full
              information reveals the actual values, ranks or not.
          - text: >
              Because full information always equals rank-only when there's no
              recall
            feedback: >
              Recall and observation are separate switches — no recall says
              nothing about whether you see values or only ranks.
        feedback: >
          Rank-only information is strictly weaker than full information: it
          tells you a comparison happened, never by how much.
      - teach: >
          Don't default to full information just because a problem says
          "candidates" or "applicants" — many classic phrasings deliberately
          mean rank-only. And don't default to recall unless nothing in the
          problem signals otherwise — "decide on the spot" is the standard
          phrase for no recall.

  - node: quant-processes.stopping.best-so-far
    hook: >
      These two probabilities — $1/i$ for being a leader, $i/n$ for a leader being champion — are the entire arithmetic engine the secretary problem runs on, and deriving them from symmetry is what lets you rebuild the $37\%$ rule from scratch under pressure.
    explanation: >
      In a uniformly random order, nothing distinguishes the $i$ positions holding the first $i$ items before the order is revealed, so the largest of those $i$ items is equally likely to sit in any of them. It sits at position $i$ itself — making item $i$ "best so far" — with probability exactly $1/i$.

      The second fact follows from a short Bayes-style argument. The event "item $i$ is a record and also the overall best" is really just "item $i$ is the overall best," since the overall best is automatically a record wherever it sits. By the same symmetry, the overall best is equally likely to occupy any of the $n$ positions, so that joint probability is $1/n$. Dividing by $\Pr(\text{record at }i)=1/i$ gives $\Pr(\text{overall best}\mid\text{record at }i)=(1/n)/(1/i)=i/n$.

      Since $i/n$ increases in $i$, a late record is far more informative than an early one — an early record is almost certainly a false start, since almost nobody else has been compared against yet. Combined with the fact that anything not currently best so far is certainly not the overall best, the whole strategy space collapses to "which record do I accept," not "which item."
    worked: >
      For $n=5$, position $3$: $\Pr(\text{record at }3)=1/3$, and given that, $\Pr(\text{it's the overall best})=3/5$. Multiplying gives $\Pr(\text{position }3\text{ holds the overall best})=\tfrac13\cdot\tfrac35=\tfrac15$ — exactly $1/n$, as it must be, since the overall best is equally likely to sit anywhere. The identity $(1/i)(i/n)=1/n$ makes itself visible at every $i$.
    interview: >
      "Why is $\Pr(i\text{ is a record})=1/i$?" is a standalone derivation question, and a follow-up, "why do later records matter more," is listening specifically for the $i/n$ reasoning rather than a hand-wave about intuition.
    pitfalls: >
      Confusing "record" with "overall best" — a record only guarantees local superiority over what's already been seen, not global superiority, and conflating the two invalidates both probabilities. Forgetting that $\Pr(\text{overall best}\mid\text{record at }i)$ needs the joint-probability trick above, rather than being derivable by inspection.
    recap: >
      In a random order, item $i$ is a record with probability $1/i$, and a record at $i$ is the true best with probability $i/n$ — late records are the ones worth trusting.
    steps:
      - teach: >
          These two facts power the entire secretary calculation ahead —
          rederive them from symmetry rather than memorizing them, since the
          reasoning is what actually survives under pressure.
      - teach: >
          In a uniformly random order, nothing distinguishes the $i$ positions
          holding the first $i$ items before the order is revealed, so the
          largest of those $i$ items is equally likely to sit in any of them.
          It sits at position $i$ itself — making item $i$ a record — with
          probability exactly $1/i$.
      - ask: >
          In a random order of $9$ items, what is $\Pr(\text{item }6\text{ is
          a record})$?
        expects: "1/6"
        tolerance: 0.0005
        hint: >
          This probability depends only on $i$, not on how many items follow
          it.
        feedback: >
          By symmetry, the largest of the first $6$ items is equally likely to
          be any of the $6$, so $\Pr=1/6$.
      - teach: >
          'Item $i$ is a record and also the overall best' is really just
          'item $i$ is the overall best,' since the overall best is
          automatically a record wherever it sits. By the same symmetry that
          gives the overall best probability $1/n$ of sitting at position $i$,
          dividing by $\Pr(\text{record at }i)=1/i$ gives $\Pr(\text{overall
          best}\mid\text{record at }i)=i/n$.
      - ask: >
          In a random order of $9$ items, given that item $6$ is a record,
          what is $\Pr(\text{it's the overall best})$?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          This conditional probability is $i/n$.
        feedback: >
          $6/9=2/3$.
      - teach: >
          Since $i/n$ increases in $i$, a late record is far more informative
          than an early one — an early record is almost certainly a false
          start, since almost nobody has been compared against yet. Anything
          not currently a record is certainly not the overall best, which
          collapses the whole strategy space to "which record to accept."
      - ask: >
          Using the two facts above for $n=9$, $i=6$, what is the
          unconditional $\Pr(\text{position }6\text{ holds the overall
          best})$?
        expects: "1/9"
        tolerance: 0.0005
        hint: >
          Multiply $\Pr(\text{record at }6)$ by $\Pr(\text{overall
          best}\mid\text{record at }6)$.
        feedback: >
          $(1/6)(2/3)=1/9$ — exactly $1/n$, as it must be, since the overall
          best is equally likely to sit anywhere among the $9$ positions.
      - teach: >
          Don't conflate "record" with "overall best" — a record only
          guarantees local superiority over what's already been seen, not
          global superiority. And $\Pr(\text{overall best}\mid\text{record at
          }i)$ needs the joint-probability trick above; it isn't derivable by
          inspection.

  - node: quant-processes.stopping.secretary
    hook: >
      This is the single most quoted "do you know a cute probability result" interview question, and the actual bar is deriving the $1/e$ cutoff from the success-probability sum, not reciting "$37\%$."
    explanation: >
      Since only a record is ever worth accepting, attention narrows to cutoff rules: reject the first $r-1$ outright, then take the next record. This succeeds exactly when the overall best sits at some position $i\ge r$ and the best of the first $i-1$ items — which would otherwise have been mistakenly hired as a false record before position $i$ — happened to fall among the rejected first $r-1$. That combinatorial statement is exactly the sum $\sum_{i=r}^{n}\frac{1}{n}\cdot\frac{r-1}{i-1}$.

      Pulling $(r-1)/n$ out front leaves a harmonic-style tail, $\sum_{i=r}^{n}1/(i-1)$, which behaves like $\ln(n/r)$ for $r$ and $n$ both large. Writing $x=r/n$, the success probability behaves like $x\ln(1/x)$, and a one-line derivative check shows this is maximized at $x=1/e$, with maximum value $1/e\approx0.368$ — skip about $37\%$ of the field to calibrate, then take the next record.

      Recognize the shape — $n$ items in random order, rank-only information, no recall, win only by landing the actual best — and this reject-then-take-next-record cutoff is the template, with $r\approx n/e$ its calibration.
    worked: >
      For $n=6$, compare cutoffs directly using $P(r)=\frac{r-1}{6}\sum_{i=r}^{6}\frac{1}{i-1}$. At $r=3$: $\sum_{i=3}^{6}\frac{1}{i-1}=\frac12+\frac13+\frac14+\frac15\approx1.283$, so $P(3)=\frac26(1.283)\approx0.428$. Checking neighbors, $P(2)\approx0.381$ and $P(4)\approx0.392$, so $r=3$ is the true optimum for $n=6$ — reject the first $2$, take the next record — beating even the asymptotic $1/e\approx0.368$.
    interview: >
      "$n$ candidates interview one at a time, reject or hire on the spot, you win only by hiring the best — what's your strategy?" wants the cutoff structure stated first, then the sum-to-limit derivation ending at "reject the first $n/e$, take the next record."
    pitfalls: >
      Quoting $37\%$ for a differently scored objective, like minimizing expected rank instead of maximizing the chance of the very best — the constant is specific to this exact payoff. Misapplying the $r\ge2$ formula at the degenerate $r=1$ edge case, where the rule is just "take the first candidate outright" and the success probability is simply $1/n$.
    recap: >
      Reject the first $r-1\approx n/e$ candidates, then hire the next record — success probability tends to $1/e\approx0.368$ as $n\to\infty$, however large $n$ is.
    steps:
      - teach: >
          The actual bar here is deriving the $37\%$ cutoff from the success-
          probability sum, not reciting it — an interviewer who asks a
          follow-up is checking exactly that.
      - teach: >
          Since only a record is ever worth accepting, the strategy space
          narrows to cutoff rules: reject the first $r-1$ outright, then take
          the next record. This succeeds exactly when the overall best sits at
          some position $i\ge r$ *and* the best of the first $i-1$ items fell
          among the rejected first $r-1$.
      - ask: >
          For $n=5$, using $P(r)=\frac{r-1}{n}\sum_{i=r}^{n}\frac{1}{i-1}$,
          what is $P(3)$?
        expects: "13/30"
        tolerance: 0.0005
        hint: >
          $\sum_{i=3}^{5}\frac{1}{i-1}=\frac12+\frac13+\frac14$.
        feedback: >
          $\sum_{i=3}^{5}\frac{1}{i-1}=\frac{13}{12}$, so
          $P(3)=\frac{2}{5}\cdot\frac{13}{12}=\frac{13}{30}\approx0.433$.
      - teach: >
          Pulling $(r-1)/n$ out front leaves a harmonic-style tail behaving
          like $\ln(n/r)$ for large $r$ and $n$. Writing $x=r/n$, the success
          probability behaves like $x\ln(1/x)$, maximized at $x=1/e$.
      - ask: >
          Evaluate $x\ln(1/x)$ at $x=1/e$, the claimed maximizer.
        expects: "0.3679"
        tolerance: 0.0005
        hint: >
          $\ln(1/x)$ at $x=1/e$ is $\ln(e)=1$.
        feedback: >
          $\ln(1/x)=\ln(e)=1$, so $x\ln(1/x)=1/e\approx0.3679$.
      - teach: >
          Recognize the shape — $n$ items in random order, rank-only
          information, no recall, win only by landing the actual best — and
          this reject-then-take-next-record cutoff is the template, with
          $r\approx n/e$ its calibration.
      - ask: >
          For $n=5$, which cutoff $r$ maximizes the success probability?
        choices:
          - text: >
              $r=1$
            feedback: >
              This takes the first candidate outright, succeeding only with
              probability $1/n=0.2$ — the calibration step is skipped
              entirely.
          - text: >
              $r=2$
            feedback: >
              $P(2)\approx0.417$ is close but not the maximum among these
              four.
          - text: >
              $r=3$
            correct: true
            feedback: >
              $P(3)=13/30\approx0.433$, the highest among the candidates for
              $n=5$.
          - text: >
              $r=5$
            feedback: >
              This rejects everyone but the last, succeeding only with
              probability $1/n=0.2$ — no calibration happens at all.
        feedback: >
          Comparing neighboring cutoffs directly shows $r=3$ wins for $n=5$,
          consistent with $n/e\approx1.84$ rounding up to a cutoff near
          $2$-$3$.
      - teach: >
          Quoting $37\%$ for a differently scored objective — like minimizing
          expected rank instead of maximizing the chance of the very best —
          is the standard trap, since the constant is specific to this exact
          payoff. The degenerate $r=1$ edge case also breaks the general
          formula: there, the rule is just "take the first candidate,"
          succeeding with probability $1/n$.

  - node: quant-processes.stopping.secretary-variants
    hook: >
      The $37\%$ number answers exactly one question, and an interviewer who follows up with "what if you just want someone good, not necessarily the best" is testing whether you notice the objective changed.
    explanation: >
      Keep the same information structure — rank-only, no recall — but score by the rank of whoever you hire instead of all-or-nothing on landing rank $1$. This is a friendlier problem: as $n\to\infty$ the optimal expected rank tends to about $3.87$, because a rule no longer has to gamble everything on catching the single best — being reliably very good is rewarded, which the original objective doesn't credit at all.

      Now keep the same all-or-nothing objective but hand over actual values drawn from a known law instead of ranks. Extra information should help, and it does substantially: the chance of catching the maximum rises from $\approx0.368$ to $\approx0.580$, because each new value can be judged against the whole known distribution, not merely against the handful of predecessors personally observed.

      A third wrinkle: if $n$ itself is unknown in advance, a time-based rather than count-based cutoff still guarantees at least $1/e$ — a useful robustness fact, since real searches rarely come with a known headcount. The interview habit this all builds: restate which objective is being scored before quoting any specific constant.
    worked: >
      For $n=3$, the win-maximizing rule (reject the first, take the next record, else the last) is known to succeed with probability exactly $1/2$. Checking its expected rank across all $3!=6$ orderings of $\{1,2,3\}$ gives an average landed rank of $5/3\approx1.67$ — better than picking blind ($2$), but this is the expected rank of the win-maximizing rule specifically, not a rule optimized to minimize rank; the two objectives generally want different cutoffs.
    interview: >
      "Does more information help?" and "what if you don't need the very best, just someone good?" are the two standard follow-ups this node answers — full information raises success to $\approx0.580$, and minimizing rank targets $\approx3.87$ regardless of $n$.
    pitfalls: >
      Assuming full information helps only marginally — the jump from $0.368$ to $0.580$ is large, driven by comparing against the known law rather than only rank. Assuming the rank-only $37\%$ cutoff schedule stays optimal once the objective changes to expected rank — it doesn't.
    recap: >
      Change the payoff or hand over actual values and the rule changes with it: expected rank $\approx3.87$, full-information success $\approx0.580$, both distinct from the classic $37\%$.
    steps:
      - teach: >
          The $37\%$ number answers exactly one question — an interviewer who
          follows up with "what if you just want someone good, not necessarily
          the best" is testing whether you notice the objective changed.
      - teach: >
          Keep the same information structure — rank-only, no recall — but
          score by the rank of whoever you hire instead of all-or-nothing on
          landing rank $1$. This is a friendlier problem: as $n\to\infty$ the
          optimal expected rank tends to about $3.87$, because being reliably
          very good is now rewarded, which the original objective doesn't
          credit at all.
      - ask: >
          You'll be scored by how close in rank your hire is to the best, not
          by whether you land the very best exactly. As $n\to\infty$, what
          does the optimal expected rank tend to?
        choices:
          - text: >
              $1/e\approx0.368$
            feedback: >
              That's a success probability for the all-or-nothing objective,
              not a rank — the units don't even match.
          - text: >
              $\approx3.87$
            correct: true
            feedback: >
              This is the expected-rank objective's asymptotic constant.
          - text: >
              $\approx0.580$
            feedback: >
              That's the full-information success probability, a different
              information structure and a different objective.
          - text: >
              $1$
            feedback: >
              That would mean guaranteeing the literal best every single time,
              which no finite-information rule can promise.
        feedback: >
          Changing what's scored changes which constant applies —
          $\approx3.87$ belongs to the minimize-expected-rank objective
          specifically.
      - teach: >
          Now keep the all-or-nothing objective but hand over actual values
          instead of ranks. Extra information helps substantially: the chance
          of catching the maximum rises from $\approx0.368$ to $\approx0.580$,
          because each new value can be judged against the whole known
          distribution, not merely against a handful of predecessors.
      - ask: >
          Full information raises the success probability from about $0.368$
          to about $0.580$. What is the size of that gain?
        expects: "0.212"
        tolerance: 0.0005
        hint: >
          Subtract the rank-only success probability from the full-information
          one.
        feedback: >
          $0.580-0.368=0.212$.
      - teach: >
          A third wrinkle: if $n$ itself is unknown in advance, a time-based
          rather than count-based cutoff still guarantees at least $1/e$ — a
          useful robustness fact, since real searches rarely arrive with a
          known headcount.
      - ask: >
          If $n$ isn't known in advance, what happens to the win-probability
          guarantee compared to the known-$n$ case?
        choices:
          - text: >
              It drops below $1/e$, since a percentage cutoff can't be
              calibrated without $n$
            feedback: >
              A count-based percentage cutoff can't be built, but a time-based
              cutoff can — and it still guarantees at least $1/e$.
          - text: >
              A time-based cutoff still guarantees at least $1/e$
            correct: true
            feedback: >
              Swapping a count-based rule for a time-based one recovers the
              same $1/e$ floor without needing $n$.
          - text: >
              The problem becomes unsolvable — no rule can guarantee any
              fixed probability
            feedback: >
              The problem stays solvable; it just needs a cutoff rule that
              doesn't depend on knowing $n$.
          - text: >
              The guarantee rises above $1/e$, since not knowing $n$ removes
              an assumption
            feedback: >
              Not knowing $n$ removes information, not a constraint — it
              can't improve the guarantee.
        feedback: >
          Not knowing $n$ costs nothing if the cutoff rule is time-based
          rather than count-based: the $1/e$ floor still holds.
      - teach: >
          The interview habit worth building: restate which objective is being
          scored before quoting any specific constant. Assuming the rank-only
          $37\%$ cutoff schedule stays optimal once the objective changes to
          expected rank is the standard mistake.

  - node: quant-processes.stopping.prophet-gap
    hook: >
      This bounds how much you could possibly be leaving on the table by not seeing the future — a useful ceiling whenever you're unsure whether some stopping rule is "good enough."
    explanation: >
      $\mathbb{E}[\max_n Y_n]$ is what a prophet with total foresight collects — an unreachable benchmark for any genuine stopping rule, which by definition can't consult values it hasn't seen yet. The natural question is how large that gap can be, and the answer is bounded: a single fixed threshold, chosen so that $\Pr(\max_n Y_n\ge t)=1/2$, already guarantees at least half the prophet's expected value.

      Splitting the prophet's expectation at the threshold makes the argument bite: $\mathbb{E}[\max_n Y_n]\le t+\mathbb{E}[(\max_n Y_n-t)^{+}]$. The threshold rule captures at least half of each piece. It banks at least $t$ whenever some $Y_n$ clears $t$, which happens with probability exactly $1/2$ by construction — half of the first term. And whichever $Y_i$ is first to clear $t$, the rule also collects that draw's own overshoot $Y_i-t$; independence makes "nothing earlier already crossed" happen with probability at least $1/2$ regardless of $Y_i$'s size, so the rule captures at least half of $\mathbb{E}[(\max_n Y_n-t)^{+}]$ too. Add the two halves back together and the rule clears half the prophet's total.

      The constant $1/2$ can't be improved, and the tightness example is instructive: $Y_1=1$ always, $Y_2=1/\varepsilon$ with probability $\varepsilon$ and $0$ otherwise. The prophet nets almost $2$, but any rule nets exactly $1$ — betting on $Y_2$ mostly gets $0$, and banking $Y_1$ upfront can't beat $1$ either way. Use the bound as a ceiling on how much cleverness in rule design is worth.
    worked: >
      Let $Y_1=4$ for sure and $Y_2=10$ with probability $0.5$, else $0$. The prophet's value is $\mathbb{E}[\max(Y_1,Y_2)]=0.5(10)+0.5(4)=7$. The threshold with $\Pr(\max\ge t)=1/2$ is $t=10$: reject $Y_1=4$ since it's below $10$, then take $Y_2$ if it's $10$, or accept $0$ if forced to. That rule nets $0.5(10)+0.5(0)=5$, a ratio of $5/7\approx0.71$ to the prophet — comfortably above the $1/2$ guarantee, since this instance isn't the adversarial worst case.
    interview: >
      "How much could a smarter rule possibly beat a simple fixed-price offer?" is the practical phrasing; the interviewer wants the factor-of-two ceiling named along with the reasoning that a single threshold already secures half.
    pitfalls: >
      Treating the $1/2$ constant as typically nearly tight — the tight example is a deliberately extreme, high-variance construction, and well-behaved distributions usually clear the bound with room to spare, as above. Forgetting the independence and nonnegativity hypotheses, without which the guarantee isn't assured at all.
    recap: >
      No stopping rule beats the prophet's $\mathbb{E}[\max_n Y_n]$, but a single fixed threshold with $\Pr(\max_n Y_n\ge t)=1/2$ already secures at least half of it, and that constant is tight.
    steps:
      - teach: >
          This bounds how much you could possibly be leaving on the table by
          not seeing the future — a useful ceiling whenever you're unsure
          whether some stopping rule is "good enough."
      - teach: >
          A prophet with total foresight collects $\mathbb{E}[\max_n Y_n]$, an
          unreachable benchmark for any genuine stopping rule. A single fixed
          threshold $t$, chosen so $\Pr(\max_n Y_n\ge t)=1/2$, already
          guarantees at least half of that value.
      - teach: >
          Splitting the prophet's expectation at $t$ makes the argument bite:
          the rule banks at least $t$ whenever some $Y_n$ clears it, which
          happens with probability exactly $1/2$ by construction, and it also
          collects at least half of whichever draw's own overshoot past $t$
          first occurs. Add the two halves back together and the rule clears
          half the prophet's total.
      - ask: >
          $Y_1=5$ for sure, and $Y_2=12$ with probability $0.5$, else $0$.
          What is the prophet's value $\mathbb{E}[\max(Y_1,Y_2)]$?
        expects: "8.5"
        hint: >
          Weight the two outcomes of $Y_2$, using $\max(5,0)=5$ when $Y_2=0$.
        feedback: >
          $0.5(12)+0.5(5)=6+2.5=8.5$.
      - ask: >
          Using the threshold $t=12$ (so $\Pr(\max\ge t)=0.5$): reject $Y_1=5$
          since it's below $t$, then take $Y_2$ if it's $12$, or accept the
          forced $0$ otherwise. What does this rule net?
        expects: "6"
        hint: >
          Weight the two outcomes of $Y_2$ the same way, but this rule never
          gets to keep $Y_1$.
        feedback: >
          $0.5(12)+0.5(0)=6$.
      - teach: >
          The constant $1/2$ can't be improved. The tight example: $Y_1=1$
          always, and $Y_2=1/\varepsilon$ with probability $\varepsilon$, else
          $0$. The prophet nets almost $2$, but every rule nets exactly $1$.
      - ask: >
          In that tight example, why can't any rule beat $1$?
        choices:
          - text: >
              Betting on $Y_2$ mostly gets $0$ (probability $1-\varepsilon$),
              and banking $Y_1=1$ upfront caps you at exactly $1$ either way
            correct: true
            feedback: >
              Exactly — whichever way you play it, the rule's own expected
              payoff never exceeds $1$.
          - text: >
              Because $\varepsilon$ is too small to matter
            feedback: >
              The whole point is that the rare huge payoff exactly balances
              against its rarity — it isn't negligible, it's precisely
              calibrated.
          - text: >
              Because the prophet also only nets $1$ in this example
            feedback: >
              The prophet nets almost $2$ here — that's precisely the gap
              this example is built to illustrate.
          - text: >
              Because $Y_1$ and $Y_2$ aren't independent in this example
            feedback: >
              They are independent; the tightness comes from the payoff
              structure, not a dependence violation.
        feedback: >
          Every rule is stuck choosing between a safe $1$ and a bet that
          mostly pays $0$ — the prophet's advantage is seeing which one wins
          before deciding.
      - teach: >
          The tight example is a deliberately extreme, high-variance
          construction — well-behaved instances, like the $5$/$12$ example
          above (ratio $6/8.5\approx0.71$), usually clear the bound with room
          to spare. The guarantee also needs independence and nonnegativity;
          without them it isn't assured at all.

  - node: quant-processes.stopping.early-exercise
    hook: >
      "When is it optimal to exercise an American option early?" is an optimal-stopping question wearing a finance costume, and the vocabulary — intrinsic value, continuation value — is a direct relabeling of what you already know.
    explanation: >
      Intrinsic value at a date is just the reward you'd get by stopping now, exercising the option; continuation value is the expected payoff of holding on, computed exactly the way one-step lookahead computes a continuation value elsewhere in this unit. The optimal exercise policy is the stopping time at which intrinsic value first overtakes continuation value — the same comparison, run at every decision point.

      On a binomial tree this is literally backward induction: value the final date's payoff, then at every earlier node take the max of intrinsic value and the discounted expectation of continuing, rolling backward to today. The only genuinely new ingredient finance adds is discounting future cash by the risk-free rate; the recursive structure is the machinery already built.

      The standard fact that a non-dividend-paying American call is never exercised early is exactly the statement that its continuation value dominates intrinsic value everywhere, so the "first overtake" comparison never fires — holding the option keeps the same upside while your cash still earns interest, so there's never a reason to give that up early. An American put has no equivalent shield, since a stock's price is bounded below by zero while its potential upside is not, so waiting can genuinely cost you interest on a payoff you could lock in today; its exercise boundary is real.
    interview: >
      "Is it ever optimal to exercise an American call early, no dividends?" wants "no — continuation value dominates everywhere" with the one-line reasoning above; a follow-up on puts wants "yes, a real exercise boundary" contrasted immediately.
    pitfalls: >
      Assuming the "never exercise early" fact carries over to puts, or to dividend-paying calls — both break the dominance argument that makes it true for the plain call. Treating this as requiring new option-pricing formulas rather than recognizing it as the same stopping comparison already known, just discounted.
    recap: >
      Early exercise is optimal stopping: exercise when intrinsic value first overtakes continuation value, which is why a non-dividend call is never exercised early but a put can be.
    steps:
      - teach: >
          The vocabulary changes but the comparison doesn't: this is the exact
          stop-versus-continue call from earlier in the unit, relabeled in a
          finance costume.
      - teach: >
          Intrinsic value is what you'd get by exercising right now;
          continuation value is the expected payoff of holding on. The optimal
          exercise policy is the stopping time at which intrinsic value first
          overtakes continuation value — literally the value-function
          comparison, applied here.
      - ask: >
          At some date, intrinsic value is $7$ and the discounted continuation
          value is $4$. What is the value at that node?
        expects: "7"
        hint: >
          It's the same $\max$ comparison the value function uses everywhere
          else in this unit.
        feedback: >
          $\max(7,4)=7$ — exercise, since intrinsic already clears
          continuation.
      - teach: >
          On a binomial tree this is literally backward induction: value the
          final date's payoff, then at every earlier node take the max of
          intrinsic value and the discounted expectation of continuing,
          rolling backward to today. The only genuinely new ingredient is
          discounting future cash by the risk-free rate.
      - ask: >
          At another date, intrinsic value is $5$ and the discounted
          continuation value is $9$. What is the value at that node?
        expects: "9"
        hint: >
          Same comparison as before — which of the two numbers is larger?
        feedback: >
          $\max(5,9)=9$ — hold, since continuation still dominates.
      - teach: >
          The standard fact that a non-dividend-paying American call is never
          exercised early is exactly the statement that continuation value
          dominates intrinsic value everywhere for that instrument. Holding
          keeps the same upside while your cash still earns interest, so the
          comparison never flips.
      - ask: >
          Why doesn't an American put share that same guarantee?
        choices:
          - text: >
              A put's intrinsic value has no equivalent shield — a stock's
              price is bounded below by zero while its upside isn't, so
              waiting can genuinely cost interest on a payoff you could lock
              in today
            correct: true
            feedback: >
              This is exactly why a put's exercise boundary is real: the
              dominance argument that protects a call doesn't carry over.
          - text: >
              Puts are never exercised early either, by the same argument
            feedback: >
              This contradicts the node's own fact — puts have a real, non-
              degenerate exercise boundary.
          - text: >
              Puts have no continuation value to compare against
            feedback: >
              Every American-style instrument has a continuation value —
              that's what makes early exercise a genuine question for either
              instrument.
          - text: >
              The binomial tree doesn't apply to puts
            feedback: >
              The same backward-induction roll-back applies to both calls and
              puts; only the conclusion about early exercise differs.
        feedback: >
          A call's upside is unbounded while a stock's downside is capped at
          zero, which is what makes continuation dominate everywhere for a
          non-dividend call; a put has no such shield.
      - teach: >
          Don't assume "never exercise early" carries over to puts or to
          dividend-paying calls — both break the dominance argument that
          makes it true for the plain non-dividend call. This is the same
          stopping comparison already known, not a new pricing formula.
