unit: quant-finance.instruments
opening: >
  This unit is the vocabulary layer beneath everything else in quant finance:
  the contracts and mechanics that no-arbitrage pricing, option theory and
  Greeks all assume you already know cold. It opens with discounting, the
  time-value-of-money tool that bond pricing immediately builds on, then
  covers the two core asset classes — equity (with indices and ETFs as its
  packaged form) and bonds (price, yield, duration) — before turning to the
  two families of forward obligation and their operational reality (margin,
  daily marking). It closes with options as the first payoff that isn't a
  straight line, then short selling, leverage, and the linear-vs-optionality
  lens that will classify every instrument priced for the rest of the
  program.
lessons:
  - node: quant-finance.instruments.discounting
    hook: >
      Every price you will ever compute in this program is a present value,
      and continuous compounding is the default convention behind almost all
      of them — an interviewer who hears you hesitate on $e^{rT}$ has learned
      most of what they need to know.
    explanation: >
      Recall the limit $(1+x/n)^{n} \to e^{x}$: discrete compounding at rate
      $r$, $n$ times a year, is exactly that expression with $x = rT$ split
      across $n$ periods, so letting $n \to \infty$ hands you continuous
      compounding for free — it is not a separate assumption about how money
      grows, it is the same growth process pushed to its limit.

      Because more frequent compounding always compounds a positive rate to a
      larger sum, continuous compounding is the ceiling: for fixed $r$ and
      $T$, $FV = PVe^{rT}$ is at least as large as $PV(1+r/n)^{nT}$ for any
      finite $n$. That ordering is worth holding as a sanity check — if a
      computed continuous-compounding figure comes out below the
      annual-compounding one, a sign or exponent slipped somewhere.

      The reason pricing formulas default to continuous compounding isn't
      elegance for its own sake — it's additivity. Taking logs turns
      $FV = PVe^{rT}$ into $\ln FV = \ln PV + rT$, so chaining growth over
      back-to-back horizons is adding exponents, not multiplying growth
      factors; that additive structure is what makes rates over different
      periods combine cleanly later in the program.
    worked: >
      200 dollars at $r = 6\%$ compounded continuously for 8 years grows to
      $200e^{0.48} \approx 323.21$ dollars, versus $200(1.06)^{8} \approx
      318.77$ dollars compounded annually — continuous compounding again
      gives the larger figure, here by about $4.44$ dollars, a bigger gap
      than a shorter horizon would show because the compounding-frequency
      effect itself compounds over more years.
    interview: >
      Expect "grow $X$ dollars at rate $r$ continuously for $T$ years" or the
      reverse, "what's the present value of $C$ dollars in $T$ years" —
      either direction should come back instantly as $PVe^{rT}$ or $Ce^{-rT}$
      with no hesitation over which exponent sign goes where.
    pitfalls: >
      Using $r$ as a whole percent instead of a decimal inside the exponent —
      $e^{0.06 \times 8}$, not $e^{6 \times 8}$. Discounting with a positive
      exponent or growing with a negative one — the sign is the only thing
      that separates $PV = Ce^{-rT}$ from $FV = PVe^{rT}$, and flipping it
      silently gives a number of the wrong order of magnitude.
    recap: >
      Continuous compounding is the $n \to \infty$ limit of ordinary
      compounding, $FV = PVe^{rT}$, and it is always the largest figure for a
      fixed nominal rate.
    dialogue:
      - part: Three banks, one quoted rate
        teach: >
          Three banks each quote $10\%$ a year on a 1,000-dollar deposit held
          for one year. Bank A credits all the interest once, at year-end. Bank
          B credits $5\%$ every six months, and the first half-year's interest
          earns interest in the second.
      - ask: >
          What does Bank B hand back after one year, in dollars?
        expects: "1102.50"
        tolerance: 0.005
        hint: >
          After six months the balance is $1000 \times 1.05$. The second
          credit is $5\%$ of that.
        feedback: >
          $1000 \times 1.05^{2} = 1102.50$ dollars: the 100 dollars Bank A pays,
          plus $5\%$ of the first 50 dollars of interest, which is 2.50.
      - ask: >
          Bank C credits $10/12\%$ every month. Before computing anything,
          where does its year-end balance land?
        choices:
          - text: >
              Exactly 1,100 dollars, since the quoted rate is still $10\%$.
            feedback: >
              The quoted rate is the same, but the timing is not. Bank B
              already beat 1,100 by crediting early; crediting earlier still
              can only help.
          - text: >
              Near 1,200 dollars: twelve credits instead of two, so the extra
              keeps scaling up.
            feedback: >
              The extra is interest on interest, and the interest is only about
              100 dollars to begin with. Going from one credit to two added
              2.50; there is no room for another 97.
          - text: >
              About 1,104.71 dollars: a little above Bank B, with a smaller
              gain than the step from A to B.
            correct: true
            feedback: >
              $1000(1 + 0.1/12)^{12} \approx 1104.71$. More frequent crediting
              always helps a positive rate, but each refinement helps less than
              the last.
          - text: >
              Exactly 1,102.50 dollars, the same as Bank B: once interest
              compounds at all, frequency stops mattering.
            feedback: >
              Monthly crediting puts interest to work from February on, not
              July. That earlier start is worth another 2.21 dollars here.
        feedback: >
          A, B, C pay 1,100, 1,102.50 and 1,104.71: rising, but by shrinking
          steps. The sequence is $1000(1 + 0.1/n)^{n}$ for $n = 1, 2, 12$.
      - reflect: >
          Now let a bank credit daily, then every second, then without pause.
          Does the balance grow without bound? If not, what number does it
          settle on, and why that one?
        hint: >
          You have met $(1 + x/n)^{n}$ before, as $n$ grows.
        answer: >
          It settles. $(1 + x/n)^{n} \to e^{x}$, so with $x = 0.1$ the balance
          tends to $1000e^{0.1} \approx 1105.17$ dollars. Daily crediting
          already gets within two cents of that. The limit is the most a
          $10\%$ quote can ever pay in a year: the ceiling on the whole family
          of banks.

      - part: The limit as the convention
        teach: >
          That limit is continuous compounding. Crediting rate $r$ some $n$
          times a year for $T$ years gives $PV(1 + r/n)^{nT}$, and as
          $n \to \infty$ this tends to $FV = PVe^{rT}$. Run it backwards and a
          cash flow $C$ due at time $T$ is worth $PV = Ce^{-rT}$ today. The
          sign of the exponent is the direction of travel in time: positive to
          grow forward, negative to discount back.
      - ask: >
          1,000 dollars sits at a continuously compounded $10\%$ for three
          years. What is it worth at the end, in dollars? Use
          $e^{0.3} \approx 1.349859$.
        expects: "1349.86"
        tolerance: 0.01
        hint: >
          $r$ and $T$ multiply inside the exponent.
        feedback: >
          $1000e^{0.1 \times 3} = 1000e^{0.3} \approx 1349.86$ dollars.
      - ask: >
          A payment of 2,000 dollars arrives four years from now. At a
          continuously compounded $5\%$, what is it worth today, in dollars?
          Use $e^{-0.2} \approx 0.818731$.
        expects: "1637.46"
        tolerance: 0.01
        hint: >
          You are moving backwards in time, so the exponent is negative.
        feedback: >
          $2000e^{-0.05 \times 4} = 2000e^{-0.2} \approx 1637.46$ dollars. A
          sanity check: less than 2,000, as money that arrives later must be.

      - part: Why the limit is the one desks use
        ask: >
          A deposit grows at a continuously compounded $4\%$ for two years and
          then at $6\%$ for three more. What single continuously compounded
          rate, held for all five years, ends in the same place? Answer as a
          decimal.
        expects: "0.052"
        hint: >
          Write both stages as one power of $e$ and compare the exponent with
          $5r$.
        feedback: >
          $e^{0.04 \times 2} \cdot e^{0.06 \times 3} = e^{0.08 + 0.18} =
          e^{0.26}$, and $5r = 0.26$ gives $r = 0.052$. Exponents add, so the
          five-year rate is the time-weighted average of the two.
      - ask: >
          Same two stages, but annually compounded: $4\%$ for two years, then
          $6\%$ for three. Is the equivalent flat annual rate over five years
          also exactly $5.2\%$?
        choices:
          - text: >
              Yes: the averaging argument does not care how the rate is quoted.
            feedback: >
              It does. $1.04^{2} \times 1.06^{3} \approx 1.288203$, while
              $1.052^{5} \approx 1.288483$. The products differ, so the rates
              do too.
          - text: >
              No: it is slightly above $5.2\%$, because annual compounding
              rewards the later, higher rate.
            feedback: >
              The direction is wrong. $1.052^{5}$ already overshoots the
              two-stage product $1.288203$, so the flat rate that matches it
              must sit below $5.2\%$.
          - text: >
              No: it is slightly below $5.2\%$, because growth factors
              multiply and their geometric mean is below the plain average.
            correct: true
            feedback: >
              The equivalent rate is $1.288203^{1/5} - 1 \approx 5.195\%$.
              Close, but no longer the clean average: annual factors multiply,
              they do not add.
        feedback: >
          This is why pricing formulas default to $e^{rT}$. Under continuous
          compounding $\ln FV = \ln PV + rT$, so rates over back-to-back
          horizons add. Every other convention makes you multiply factors and
          take roots.

      - part: Catching the slips before the interviewer does
        ask: >
          A colleague prices 5,000 dollars due in three years at a
          continuously compounded $6\%$ and reports $5000e^{0.18} \approx
          5986.09$ dollars. What went wrong?
        choices:
          - text: >
              The rate should enter as $6$, not $0.06$.
            feedback: >
              $e^{18}$ is about $66$ million; the decimal $0.06$ was right. The
              size of the answer is not the problem; its side of 5,000 is.
          - text: >
              The exponent's sign is flipped: that is a future value, not a
              present value.
            correct: true
            feedback: >
              A present value of money due later must be below face. The
              correct figure is $5000e^{-0.18} \approx 4176.35$ dollars.
          - text: >
              Continuous compounding is the wrong tool; it should be
              $5000/1.06^{3}$.
            feedback: >
              That is a different convention, not a fix. With the rate quoted
              continuously compounded, $e^{-rT}$ is exactly right, once the
              sign is.
          - text: >
              Nothing: $5986.09$ is the right answer.
            feedback: >
              A promise of 5,000 dollars later cannot be worth more than 5,000
              dollars now when rates are positive. Anyone would sell it to you
              for less.
        feedback: >
          Ask one question before trusting any discounting answer: is the
          number on the side of the cash flow it should be? Present values
          sit below, future values above.
      - ask: >
          A bank quotes $5\%$ compounded annually. What continuously
          compounded rate gives the same one-year growth? Use $\ln 1.05
          \approx 0.048790$, and answer as a decimal.
        expects: "0.0488"
        tolerance: 0.0001
        hint: >
          Set $e^{r} = 1.05$ and solve for $r$.
        feedback: >
          $e^{r} = 1.05$ gives $r = \ln 1.05 \approx 0.0488$. The continuous
          rate is lower, because continuous compounding squeezes more growth
          out of every unit of quoted rate.
      - teach: >
          In an interview, say the convention out loud before the number:
          "continuously compounded, so $Ce^{-rT}$". It shows you know the same
          quoted rate means different money under different conventions, and
          it fixes the sign of the exponent before you write it.

  - node: quant-finance.instruments.equity
    hook: >
      "Did you make money on that stock?" is a trick question the moment a
      dividend is involved, and the fix is knowing that total return is
      always price return plus dividend yield, not price change alone.
    explanation: >
      A share carries no promise at all — no maturity date, no guaranteed
      payment, and a dividend that the board can raise, cut, or skip outright
      depending on the company's results and priorities. That is the whole
      reason equity is riskier than a bond from the same issuer: a bondholder
      has a contractual claim to specific cash flows, while a shareholder
      only has a residual claim, paid after every creditor and preferred
      holder is satisfied, on whatever is left.

      Total return packages the two ways a share can pay you into one number,
      $R = (P_1 - P_0 + D)/P_0$, and it always splits cleanly into a price
      return $(P_1-P_0)/P_0$ and a dividend yield $D/P_0$. Reporting only the
      price change silently drops half the picture — a stock that is flat or
      even down in price can still be a winning position once the dividend
      is counted.

      Treat the split as diagnostic, not just arithmetic: a return dominated
      by dividend yield behaves very differently from one dominated by price
      appreciation, since one component is roughly known in advance and the
      other is not.
    worked: >
      A stock bought at 80 dollars, paying a 2-dollar dividend, ending the
      period at 79 dollars: $R = (79 - 80 + 2)/80 = 1/80 = 1.25\%$. The price
      return alone is $-1.25\%$ — a loss — but the $2.5\%$ dividend yield
      more than offsets it, for a net gain despite the falling price.
    interview: >
      A favorite trap: "the stock price didn't move all year, so you made
      nothing" — the correct reflex is to ask about dividends before
      answering, since a flat price with a dividend is a strictly positive
      total return.
    pitfalls: >
      Computing return from price alone and ignoring declared dividends.
      Treating a dividend as contractually owed like a bond coupon — it is
      declared at the board's discretion each period and can be reduced or
      omitted with no default involved.
    recap: >
      Total return is price return plus dividend yield, and because equity
      promises neither payment, either piece can dominate or vanish
      independently of the other.
    dialogue:
      - part: Did you lose money
        teach: >
          You bought one share at 40 dollars. A year later it trades at 38.80,
          and during the year the company paid you 2 dollars of dividends per
          share. A friend looks at the price chart and says you lost money.
      - ask: >
          Counting everything the share put in your pocket, how many dollars
          did you gain or lose on it? Use a minus sign for a loss.
        expects: "0.80"
        hint: >
          Two things happened to you: the price moved, and cash arrived.
        feedback: >
          The price fell $38.80 - 40 = -1.20$ dollars and the dividend paid
          $+2$, so you are up $-1.20 + 2 = 0.80$ dollars a share.
      - ask: >
          As a return on the 40 dollars you paid, what is that, as a decimal?
        expects: "0.02"
        feedback: >
          $0.80/40 = 0.02$, a $2\%$ gain. Returns are measured against what you
          put in, $P_0$.
      - ask: >
          Your friend's figure was $-3\%$. Where does it come from?
        choices:
          - text: >
              From $-1.20/38.80$: the price change measured against today's
              price.
            feedback: >
              That gives about $-3.09\%$, and it divides by the wrong price.
              The friend's slip is not the denominator; it is what was left
              out of the numerator.
          - text: >
              From $-1.20/40$: the price change alone, with the dividend
              ignored.
            correct: true
            feedback: >
              Exactly the price chart's view. It is a true number, just not the
              return: the 2 dollars of dividends never appear on a price chart.
          - text: >
              From $(-1.20 - 2)/40$: the dividend counted as a cost, since cash
              left the company.
            feedback: >
              That would be $-8\%$, not $-3\%$. And the dividend left the
              company to arrive in your account; to you it is income.
        feedback: >
          The friend computed a real quantity, the price return, and called it
          the return.
      - reflect: >
          Write one formula for the return over a holding period that could
          not have misled your friend, using $P_0$, $P_1$ and the dividend
          $D$. Then split it into two pieces that each mean something.
        answer: >
          $R = (P_1 - P_0 + D)/P_0$, which splits as
          $(P_1 - P_0)/P_0 + D/P_0$: a price return plus a dividend yield.
          Here that is $-3\% + 5\% = 2\%$. Either piece can carry the whole
          result, and either can be negative or zero while the total is not.

      - part: Two ways a share pays you
        teach: >
          That is total return, and the two pieces are the price return and
          the dividend yield. They behave differently because a share
          promises nothing: no maturity date, no fixed payment. A dividend is
          declared by the board when it chooses, and can be raised, cut or
          skipped. What a share holds is a fractional claim on the company's
          assets, earnings and votes.
      - ask: >
          A share bought at 25 dollars pays 0.25 dollars of dividends and is
          sold at 27.50. What is the total return, as a decimal?
        expects: "0.11"
        hint: >
          Price change plus dividend, over the purchase price.
        feedback: >
          $(27.50 - 25 + 0.25)/25 = 2.75/25 = 0.11$: a $10\%$ price return and
          a $1\%$ dividend yield.
      - ask: >
          A share bought at 50 dollars pays 1.50 dollars of dividends and is
          sold at 46. What is the total return, as a decimal?
        expects: "-0.05"
        feedback: >
          $(46 - 50 + 1.50)/50 = -2.50/50 = -0.05$. A $3\%$ dividend yield
          softens an $8\%$ price drop, but it cannot cover it. Counting
          dividends is honesty, not optimism.

      - part: Last in line, and no cap
        teach: >
          A company is wound up. Its assets fetch 70 million dollars. It owes
          bondholders 60 million and preferred shareholders 15 million. The
          common shareholders own the rest of the company.
      - ask: >
          How many millions of dollars reach the common shareholders?
        expects: "0"
        hint: >
          Pay the claims in order: debt first, then preferred, then common.
        feedback: >
          Bondholders take 60, leaving 10. Preferred holders are owed 15 and
          take all 10. Nothing is left for common equity: $0$.
      - ask: >
          Now suppose the assets had fetched 90 million instead. How many
          millions reach the common shareholders?
        expects: "15"
        feedback: >
          $90 - 60 - 15 = 15$ million. Twenty extra million of assets became
          fifteen for common equity once the preferred holders were made
          whole: equity is the residual, paid after everyone with a promise.
      - ask: >
          And if the assets had fetched 200 million, who gets the extra 110
          million over the 90-million case?
        choices:
          - text: >
              Split pro rata among bondholders, preferred and common, by the
              size of each claim.
            feedback: >
              Bondholders were promised 60 million and preferred holders 15.
              They had already been paid in full at 90 million, and a promise
              paid in full earns nothing more.
          - text: >
              The common shareholders, all of it.
            correct: true
            feedback: >
              They now take $200 - 75 = 125$ million. The claim that is paid
              last is also the only one without a ceiling.
          - text: >
              The bondholders first, since they rank highest.
            feedback: >
              Ranking first means being paid first, not being paid more. A
              bond's payments are fixed by contract at 60 million.
        feedback: >
          The same position explains both sides: last in line, so wiped out
          first in a bad outcome, and with no cap, so it keeps everything above
          the fixed claims in a good one. That is why a share is riskier than a
          bond from the same company, and why it has more upside.
      - teach: >
          Asked whether a flat stock made money, ask about dividends before
          answering: "total return is price return plus dividend yield, so a
          flat price with a 2 percent dividend is a 2 percent gain".

  - node: quant-finance.instruments.indices-etfs
    hook: >
      "If a stock is 1 percent of an index and it halves, what happens to the
      index?" is a pure weight-times-return calculation, and it's the
      fastest way an interviewer checks whether you actually understand
      cap-weighting rather than just knowing the word.
    explanation: >
      An index is a fixed rule for turning a basket of prices into one
      number, and market-cap weighting is the most common rule: each
      constituent's pull on the index is proportional to its market value.
      The direct consequence is that the index's return is a weighted average
      of the constituents' returns, weighted by market cap share — a giant
      constituent moving a little moves the index roughly as much as a tiny
      constituent moving a lot.

      Because the index is only a number, not a security, you cannot trade
      it directly — you trade the constituents themselves or a fund built to
      track it. An ETF is that tradable wrapper: it trades all day like a
      share while holding a basket of underlying assets. What keeps its
      market price from drifting away from the value of what it holds is
      creation and redemption — authorized participants can hand the fund a
      basket of the underlying assets in exchange for new ETF shares, or the
      reverse, whenever a profitable gap opens between the ETF's price and
      its net asset value, which closes the gap by arbitrage rather than by
      any promise from the fund itself.

      Read every index move as "sum of weight times return" and every ETF
      price as "kept near net asset value by an arbitrage loop, not
      guaranteed to equal it exactly at every instant."
    worked: >
      A two-stock cap-weighted index: X at 950 of market cap, Y at 50, total
      1,000. If Y jumps $40\%$ while X is flat, the index moves by about
      $(50/1000)\times40\% = 2\%$. If instead X alone rises just $3\%$ while
      Y is flat, the index moves by about $(950/1000)\times3\% = 2.85\%$ — a
      small move in the giant beats a huge move in the minnow.
    interview: >
      Expect "estimate the index's move given one constituent's move and its
      weight" as a mental-math check, and "why doesn't the ETF's price ever
      drift far from its NAV" as the conceptual follow-up — the answer is
      creation/redemption arbitrage, not regulation.
    pitfalls: >
      Assuming you can buy "the index" itself — only the fund shares or the
      underlying constituents are tradable. Treating ETF price and NAV as
      always identical rather than kept close by an arbitrage mechanism that
      needs capital and time to act, so a gap can persist briefly under
      stress.
    recap: >
      An index's move is a cap-weighted average of its constituents' returns;
      an ETF is the tradable wrapper, held near its net asset value by
      creation/redemption arbitrage.
    dialogue:
      - part: Three companies, one number
        teach: >
          An index tracks the combined market value of three companies, scaled
          to read 1,000 points this morning. Megacorp is worth 800 billion
          dollars, Midco 150 billion and Smallco 50 billion. Today Smallco
          jumps $20\%$, Megacorp slips $2\%$, and Midco does not move.
      - ask: >
          By how many billions of dollars did the three companies' combined
          value change today? Use a minus sign for a fall.
        expects: "-6"
        hint: >
          Turn each percentage into dollars of that company's value first.
        feedback: >
          Smallco gains $0.20 \times 50 = 10$ billion and Megacorp loses
          $0.02 \times 800 = 16$ billion, so the total changes by
          $10 - 16 = -6$ billion.
      - ask: >
          Where does the index close, in points?
        expects: "994"
        feedback: >
          The combined value fell from 1,000 to 994 billion, a $0.6\%$ fall, so
          the index closes at $994$.
      - ask: >
          A colleague averages the three moves, $(20\% + 0\% - 2\%)/3 = 6\%$,
          and says the index rose $6\%$. What is wrong?
        choices:
          - text: >
              Nothing: an average of the members' returns is the index return.
            feedback: >
              The index closed down at 994. An average that counts Smallco as
              heavily as Megacorp describes some other index, not this one.
          - text: >
              The average treats a 50-billion company and an 800-billion company
              as equally important.
            correct: true
            feedback: >
              In this index a company counts in proportion to its value.
              Smallco's $20\%$ is $20\%$ of a sliver; Megacorp's $2\%$ is $2\%$
              of almost everything.
          - text: >
              Midco should be left out, since it did not move.
            feedback: >
              Leaving Midco out gives $(20\% - 2\%)/2 = 9\%$, which is further
              from the truth. A flat member still holds part of the value.
        feedback: >
          An equal-weight average answers "how did the typical stock do?"; this
          index answers "how did the money in these three stocks do?"
      - reflect: >
          Without adding up dollars of market value, write the index's $-0.6\%$
          as a combination of the three returns $20\%$, $0\%$ and $-2\%$. What
          plays the part of each company's weight?
        answer: >
          Each return is multiplied by that company's share of the total
          value: $0.05 \times 20\% + 0.15 \times 0\% + 0.80 \times (-2\%) =
          1\% - 1.6\% = -0.6\%$. The index return is a weighted average of the
          members' returns, and the weights are the market-value shares.

      - part: The weighting rule, and its drift
        teach: >
          An index is a fixed rule for turning a basket of prices into one
          number. This one is market-cap weighted: each member's weight is its
          market value over the total, so the index return is
          $\sum_i w_i r_i$. The S&P 500 is built this way. Weights are not
          fixed numbers; they move as prices move.
      - ask: >
          After today's moves, what is Smallco's weight in the index, as a
          decimal? Round to four places.
        expects: "0.0604"
        tolerance: 0.0005
        hint: >
          Smallco's new value, over the new total.
        feedback: >
          Smallco is now worth $50 \times 1.2 = 60$ billion out of 994, a
          weight of $60/994 \approx 0.0604$. A stock that rises gains weight
          on its own; no one has to trade to keep a cap-weighted index current.
      - ask: >
          A member makes up $4\%$ of a cap-weighted index and falls $25\%$ in
          a day while every other member is flat. What is the index's return,
          as a decimal?
        expects: "-0.01"
        feedback: >
          $0.04 \times (-0.25) = -0.01$, a $1\%$ fall. A quarter of the value
          of a small member is a small slice of the whole.

      - part: Buying something that is only a number
        ask: >
          You want to own the three-company index in a single trade. What can
          you actually buy?
        choices:
          - text: >
              The index itself, at 994 per unit.
            feedback: >
              The index is the output of a formula, not a security. No one
              issues it and no exchange lists it.
          - text: >
              A fund that holds the three stocks in index proportions and
              trades on an exchange like a share.
            correct: true
            feedback: >
              That is an exchange-traded fund, an ETF. Buying it buys a slice
              of the basket in one trade.
          - text: >
              Nothing: you have to buy the three stocks separately.
            feedback: >
              You may, and that does replicate the index, but it is three
              trades with weights you must keep current. A fund does it for
              you.
        feedback: >
          The index is a number; an ETF is the tradable wrapper around the
          basket it describes. Its net asset value (NAV) is what the basket
          it holds is worth, per fund share.
      - teach: >
          An ETF's own price is set by trading, so it can drift from its NAV.
          Some large dealers have a special right: they may hand the fund the
          underlying basket and receive new fund shares, or hand in fund
          shares and receive the basket. One afternoon a fund's NAV is 50.00
          dollars a share while the fund trades at 49.80.
      - ask: >
          You are one of those dealers. Which trade locks in a profit?
        choices:
          - text: >
              Buy the basket of stocks, hand it in for new fund shares, and
              sell those shares.
            feedback: >
              That pays 50.00 for something you then sell for 49.80: a loss of
              20 cents. It is the right trade only when the fund trades above
              its NAV.
          - text: >
              Buy fund shares at 49.80, hand them in for the basket, and sell
              the basket.
            correct: true
            feedback: >
              You pay 49.80 and receive stocks worth 50.00. Buy the cheap side,
              convert, sell the dear side.
          - text: >
              Short the fund and wait for the fund to raise its price to NAV.
            feedback: >
              The fund does not set its own market price, and shorting the
              cheap side bets the gap widens. Nothing here forces convergence
              except the dealers' trade.
        feedback: >
          The fund is the cheap side, so buy it and convert it into what it is
          worth.
      - ask: >
          Ignoring trading costs, how many dollars does that trade make per
          fund share?
        expects: "0.20"
        feedback: >
          $50.00 - 49.80 = 0.20$ dollars. And it pushes the gap shut as it is
          done: buying fund shares lifts their price, and selling the basket
          leans on the stocks. These dealers are authorized participants, and
          the two conversions are creation and redemption.
      - ask: >
          In a market panic, a bond ETF trades $3\%$ below its NAV for a whole
          day. What is the likeliest reason the arbitrage did not close it?
        choices:
          - text: >
              The fund broke a legal promise to trade at NAV.
            feedback: >
              There is no such promise. Price and NAV are held together only by
              the arbitrage, never by guarantee.
          - text: >
              The underlying bonds were hard to sell at their quoted prices,
              so the NAV overstated what a dealer could actually get.
            correct: true
            feedback: >
              The arbitrage needs the dealer to sell the basket at NAV. When
              the basket's own market is thin or its quotes are stale, the
              profit is not really there, and the gap stays.
          - text: >
              Authorized participants are forbidden to trade on volatile days.
            feedback: >
              No rule stops them. What stops them is that the trade stops
              paying once costs and risk exceed the gap.
        feedback: >
          Creation and redemption keep an ETF close to NAV, not equal to it:
          the gap can open as wide as the cost of doing the arbitrage.

  - node: quant-finance.instruments.bond-pricing
    hook: >
      A bond is nothing more than several PV calculations added together, and
      an interviewer handing you a coupon schedule is really just checking
      whether you'll reach for the discounting tool you already have instead
      of a memorized "bond formula."
    explanation: >
      Recall that a single cash flow $C$ at time $T$ is worth $PV = Ce^{-rT}$
      or, with the periodic discounting that matches a bond's coupon
      schedule, $C/(1+y)^{t}$. A coupon bond is just a stack of such cash
      flows — a coupon $cF$ at every period plus the face value $F$ back at
      maturity — so its price is nothing but the sum of each piece's present
      value at the market's required rate $y$: $P = \sum_t cF/(1+y)^t +
      F/(1+y)^T$. There is no new machinery here beyond discounting applied
      repeatedly.

      The premium/discount/par language is just a comparison of two rates.
      If the bond's coupon rate exceeds what the market currently demands
      ($c > y$), those above-market coupons make the bond worth more than
      face value — a premium. If the coupon falls short of what the market
      demands ($c < y$), the bond is worth less than face value to
      compensate — a discount. When $c = y$ exactly, discounting the coupons
      at the same rate they're paid leaves the price at exactly $F$: par.

      A zero-coupon bond is the special case $c = 0$: every coupon term
      vanishes and only the single discounted face value survives,
      $P = F/(1+y)^T$ — the simplest possible bond, and a useful check case
      whenever the general formula feels opaque.
    worked: >
      A 3-year, $4\%$ annual-coupon, 100-dollar-face bond priced at $y=6\%$:
      cash flows of 4, 4, and 104 at $t=1,2,3$ have present values
      $4/1.06\approx3.77$, $4/1.1236\approx3.56$, and $104/1.191016\approx
      87.32$. Summing gives $P \approx 94.65$ dollars — a discount to face,
      exactly as expected since the $4\%$ coupon falls short of the $6\%$
      the market demands.
    interview: >
      "Price this bond given its coupon, maturity, and yield" is asked cold,
      with the expectation you set up the summation immediately rather than
      recall a formula by name, and "why would this bond trade below par"
      should come back instantly as coupon-versus-yield, not something about
      credit risk.
    pitfalls: >
      Discounting with the coupon rate instead of the market yield — they
      play completely different roles, one contractual and one market-set.
      Forgetting the face value term at the final period, so only the
      coupons get summed. Reaching for continuous discounting $e^{-rT}$
      instead of the periodic $(1+y)^{-t}$ that matches the bond's actual
      coupon frequency.
    recap: >
      A bond's price is the sum of every promised cash flow's present value
      at the market yield — premium, par, or discount is just coupon rate
      compared to that yield.
    dialogue:
      - part: Pricing an IOU you already understand
        teach: >
          A company sells a piece of paper that pays 6 dollars one year from
          now and 106 dollars two years from now, and nothing else. Investors
          will lend to this company only if they earn $5\%$ a year, compounded
          annually.
      - ask: >
          What is the 6-dollar payment due in one year worth today, in
          dollars?
        expects: "5.71"
        tolerance: 0.005
        hint: >
          Discount one year at $5\%$: divide by $1.05$.
        feedback: >
          $6/1.05 \approx 5.71$ dollars. That is the amount which, lent at
          $5\%$ for a year, grows into 6.
      - ask: >
          What is the whole piece of paper worth today, in dollars?
        expects: "101.86"
        tolerance: 0.01
        hint: >
          Discount the 106 by two years of $5\%$, then add the two present
          values.
        feedback: >
          $6/1.05 + 106/1.05^{2} \approx 5.71 + 96.15 = 101.86$ dollars. Each
          promised payment is worth its own present value, and present values
          add.
      - ask: >
          The paper is a 100-dollar bond with a $6\%$ coupon. Why is it worth
          more than 100?
        choices:
          - text: >
              It pays $6 + 106 = 112$ dollars in total, which is more than 100.
            feedback: >
              Any bond pays back more than face in total. At an $8\%$ required
              rate the same 112 dollars would be worth only about 96.43 today:
              the total has to be discounted before it says anything.
          - text: >
              It pays $6\%$ a year when lenders only demand $5\%$, so buyers
              compete the price up.
            correct: true
            feedback: >
              The extra point of coupon each year is a gift relative to the
              market, and the price above 100 is what that gift is worth
              today.
          - text: >
              Bonds always trade above face, because face is only repaid at
              the end.
            feedback: >
              Repaying face at the end is a reason for a lower price, not a
              higher one: 100 two years away is worth only about 90.70 today
              at $5\%$.
        feedback: >
          Above 100 because the coupon beats the rate the market demands.
      - reflect: >
          Without computing anything, at what required rate would this bond be
          worth exactly 100 dollars? Say why that rate and no other.
        hint: >
          Think of lending 100 dollars yourself at that rate for two years.
        answer: >
          At $6\%$. Lend 100 at $6\%$ and you get 6 of interest after one year
          and 106 at the end of the second: exactly the bond's payments. So
          100 today and the bond's cash flows are the same thing at that rate.
          When the coupon rate equals the required rate, the bond is worth
          face, which is called pricing at par.

      - part: The price is a sum of present values
        teach: >
          A coupon bond with face $F$ and coupon rate $c$ pays $cF$ each period
          for $T$ periods and returns $F$ at the end. Discounted at the market's
          required rate $y$, its price is
          $P = \sum_{t=1}^{T} cF/(1+y)^{t} + F/(1+y)^{T}$. It trades at a
          premium when $c > y$, at a discount when $c < y$, and at par when
          $c = y$.
      - ask: >
          Market rates rise and lenders now demand $8\%$. What is the same
          bond, 6 in one year and 106 in two, worth now, in dollars?
        expects: "96.43"
        tolerance: 0.01
        feedback: >
          $6/1.08 + 106/1.08^{2} \approx 5.56 + 90.88 = 96.43$ dollars. The
          coupon now falls short of the market rate, so the bond trades at a
          discount.
      - ask: >
          A bond with no coupons at all pays 100 dollars in three years. At a
          required $5\%$, what is it worth today, in dollars?
        expects: "86.38"
        tolerance: 0.01
        feedback: >
          $100/1.05^{3} \approx 86.38$ dollars. A zero-coupon bond is the case
          $c = 0$: every coupon term vanishes and only the discounted face
          survives. Whatever the rate, it trades below face.

      - part: Two slips that cost the answer
        ask: >
          Pricing the $6\%$ bond at an $8\%$ market rate, a candidate writes
          $6/1.06 + 106/1.06^{2} = 100$. What went wrong?
        choices:
          - text: >
              They discounted at the coupon rate instead of the market's
              required rate.
            correct: true
            feedback: >
              The coupon rate sets the cash flows; the market rate discounts
              them. Discounting a bond's flows at its own coupon rate always
              returns face, whatever the market is doing.
          - text: >
              Nothing: a $6\%$ bond is worth 100 by definition.
            feedback: >
              Face value is fixed by contract; price is not. At $8\%$ the same
              flows are worth 96.43, as you just computed.
          - text: >
              They should have discounted continuously, $e^{-0.06t}$.
            feedback: >
              A switch of convention does not fix using the wrong rate. With
              annual coupons, annual discounting at the market yield is the
              natural match.
        feedback: >
          Two rates, two jobs. Swap them and every bond prices at par.
      - ask: >
          A candidate prices a three-year, $5\%$ annual-coupon bond with 100
          dollars of face at an $8\%$ market rate and gets about 12.89 dollars.
          What is missing?
        choices:
          - text: >
              A fourth coupon, since the bond pays at the start as well.
            feedback: >
              Coupons are paid at the end of each period, three of them for
              three years. One more coupon would add about 5, not the 79 that
              is missing.
          - text: >
              The face value repaid at maturity, worth about 79.38 today.
            correct: true
            feedback: >
              $4.63 + 4.29 + 3.97 \approx 12.89$ is the coupons alone. Adding
              $100/1.08^{3} \approx 79.38$ gives about 92.27, below face since
              $5\% < 8\%$.
          - text: >
              Nothing: a high market rate can make a bond nearly worthless.
            feedback: >
              The face value alone is worth about 79 at $8\%$. A price of 13
              would need a required rate above $100\%$ a year.
        feedback: >
          The last cash flow is $cF + F$, not $cF$. For most bonds the face
          value is most of the price.
      - teach: >
          Asked to price a bond, write the cash flows on a timeline first,
          then discount each at the yield. "Why does it trade below par" has a
          one-line answer: the coupon is below what the market demands.

  - node: quant-finance.instruments.bond-ytm
    hook: >
      Bonds with wildly different coupons and maturities get compared on one
      number at every desk, and being able to say what that number actually
      solves for — not just recite its name — is the real interview check.
    explanation: >
      Bond pricing runs forward: given a yield, sum the discounted cash flows
      to get a price. Yield to maturity runs the same equation backward:
      given the market's observed price, find the single flat rate $y$ that
      makes the same sum equal to that price. It is an internal-rate-of-return
      idea applied to a bond's specific cash flow schedule — a break-even
      discount rate, not a separate quantity from the price you already know
      how to compute.

      Every term in the pricing sum shrinks as $y$ grows, since each is a
      cash flow divided by a positive power of $(1+y)$, so the whole sum —
      the price — is a strictly decreasing function of yield with no
      exceptions or special cases. That single fact is the entire content of
      "price and yield move in opposite directions," and it is also why the
      price-yield relationship curves rather than sitting on a straight line:
      the higher-power terms shrink faster than the linear ones as $y$ rises,
      bending the curve rather than tilting it evenly.

      Practically, yields let you compare a 2-year 3% coupon bond against a
      10-year 7% coupon bond on equal footing, because the coupon and
      maturity differences are already absorbed into one comparable rate —
      which is why bonds are quoted by price but discussed and compared by
      yield.
    worked: >
      A 2-year, $7\%$ annual-coupon, 100-dollar-face bond priced at 101:
      solving $7/(1+y) + 107/(1+y)^2 = 101$ is a quadratic in $(1+y)$,
      $101(1+y)^2 - 7(1+y) - 107 = 0$, giving $1+y \approx 1.0645$, so
      $y \approx 6.45\%$ — below the $7\%$ coupon, consistent with the price
      sitting above par.
    interview: >
      "How would you find YTM by hand, no calculator" tests whether you know
      it's generally found by trial-and-error or interpolation, except for
      the 1- and 2-period cases, which reduce to linear and quadratic
      equations you can actually solve on paper.
    pitfalls: >
      Confusing YTM with current yield (coupon divided by price) — the two
      coincide only near par and diverge meaningfully once price moves away
      from face value. Treating the price-yield relationship as a straight
      line for a large rate move, when it is convex — a linear guess is only
      a local approximation, refined properly by duration.
    recap: >
      Yield to maturity is the single rate that reconciles a bond's market
      price with its promised cash flows, and price and yield always move in
      opposite directions.
    dialogue:
      - part: What rate is the buyer earning
        ask: >
          A one-year bond will pay a single 108 dollars at maturity, coupon and
          face together. It trades at 102 dollars today. What annual rate does
          a buyer who holds it to maturity earn? Answer as a decimal to four
          places.
        expects: "0.0588"
        tolerance: 0.0005
        hint: >
          Which rate $y$ makes $108/(1+y)$ equal $102$?
        feedback: >
          $1 + y = 108/102 \approx 1.0588$, so $y \approx 0.0588$, or
          $5.88\%$. With one cash flow, the rate falls straight out of the
          price.
      - ask: >
          Now a two-year bond with 100 dollars of face and a $10\%$ coupon: it
          pays 10 in one year and 110 in two. First price it at a rate of
          $10\%$. What do you get, in dollars?
        expects: "100"
        feedback: >
          $10/1.1 + 110/1.21 = 9.09 + 90.91 = 100$. The coupon rate equals the
          discount rate, so the bond is at par.
      - ask: >
          The market price of that bond is actually 96.62 dollars. Is the rate
          that discounts its cash flows to 96.62 above or below $10\%$?
        choices:
          - text: >
              Below $10\%$: a cheaper bond is a worse deal, so it must earn less.
            feedback: >
              Cheaper for the same promised 10 and 110 is a better deal. You
              pay less and receive the same, so your rate of return is higher.
          - text: >
              Above $10\%$: you need harsher discounting to pull the price down
              from 100 to 96.62.
            correct: true
            feedback: >
              At $10\%$ the flows are worth 100, too much. Every term shrinks
              as the rate rises, so the matching rate sits higher.
          - text: >
              You cannot tell without knowing whether the price fell because
              of the first payment or the second.
            feedback: >
              You do not need to apportion the drop. One rate discounts both
              payments, and the total falls as that rate rises.
        feedback: >
          Too high a price at your trial rate means raise the rate. That gives
          you a direction to search in.
      - ask: >
          Price the bond at $12\%$. What do you get, in dollars?
        expects: "96.62"
        tolerance: 0.01
        hint: >
          $1.12^{2} = 1.2544$.
        feedback: >
          $10/1.12 + 110/1.2544 \approx 8.93 + 87.69 = 96.62$ dollars. That is
          the market price, so $12\%$ is the rate.
      - reflect: >
          You searched for a single rate that discounts the bond's flows to its
          market price, and found one. Why can there never be two such rates
          for an ordinary bond, and what does that say about how its price and
          the rate move together?
        hint: >
          What happens to each term $C_t/(1+y)^{t}$ as $y$ rises?
        answer: >
          Every term is a positive cash flow divided by a positive power of
          $1 + y$, so every term falls as $y$ rises, and so does their sum.
          A strictly decreasing function hits each price at most once, so the
          rate is unique. The same fact says price and rate always move in
          opposite directions, for every bond with positive cash flows.

      - part: The rate gets a name
        teach: >
          That rate is the yield to maturity: the single $y$ with
          $P = \sum_t cF/(1+y)^{t} + F/(1+y)^{T}$ for the observed price $P$.
          Bond pricing runs from yield to price; YTM runs the same equation
          from price to yield. For one or two periods you can solve it by
          hand; beyond that it is found by trial, the way you just did.
      - ask: >
          Now the yield on the same bond falls to $8\%$. What is its price, in
          dollars?
        expects: "103.57"
        tolerance: 0.01
        hint: >
          $1.08^{2} = 1.1664$.
        feedback: >
          $10/1.08 + 110/1.1664 \approx 9.26 + 94.31 = 103.57$ dollars. Lower
          yield, higher price, as the reflection predicted.
      - ask: >
          From a $10\%$ yield, two points up cost the bond 3.38 dollars and two
          points down gained it 3.57. What does the mismatch tell you about
          price as a function of yield?
        choices:
          - text: >
              It is a straight line, and the mismatch is rounding.
            feedback: >
              The gap is 0.19 dollars, far beyond rounding to the cent. A
              straight line would give equal moves for equal steps either way.
          - text: >
              It curves, bowing upwards, so falling yields help more than
              rising yields hurt.
            correct: true
            feedback: >
              The price–yield curve is convex. Terms like $110/(1+y)^{2}$ bend,
              and the far-dated ones bend most.
          - text: >
              It curves the other way, so the bond loses more on a rise than it
              gains on a fall.
            feedback: >
              The numbers say the opposite: the gain on a fall, 3.57, is the
              larger of the two.
        feedback: >
          Price falls as yield rises, and not along a straight line: the
          relationship is convex.

      - part: A yield that is not the yield
        ask: >
          At 96.62, a colleague quotes the bond's yield as coupon over price,
          $10/96.62 \approx 10.35\%$, not $12\%$. What has that figure left
          out?
        choices:
          - text: >
              The 3.38 dollars the buyer gains as the price climbs back to the
              100 of face repaid at maturity.
            correct: true
            feedback: >
              Coupon over price, the current yield, counts only the income. A
              bond bought below face also pays you the climb to face, and YTM
              includes it.
          - text: >
              Nothing: the two are just different conventions for the same
              rate.
            feedback: >
              They are different quantities. They agree only when the price is
              face value, when there is no climb to count.
          - text: >
              The reinvestment of the coupons, which is why YTM is lower.
            feedback: >
              YTM is the higher of the two here, 12 against 10.35. The gap is
              the discount to face, not reinvestment.
        feedback: >
          Current yield and YTM coincide at par and part ways as the price
          moves away from face. Quoted bond yields mean YTM.
      - teach: >
          Asked what yield to maturity is, say what it solves for: "the one
          discount rate that makes the promised cash flows worth today's
          price". Then the inverse price–yield move follows in one sentence:
          each term falls as the rate rises.

  - node: quant-finance.instruments.duration
    hook: >
      "Rates rise 1 percent — roughly how much does this bond's price fall?"
      is answered by one number, and producing it cold, from the cash flows
      up, is one of the most common fixed-income interview asks.
    explanation: >
      Yield to maturity establishes that price falls as yield rises; duration
      puts a size on that fall. Macaulay duration, $D = \sum_t t\cdot PV_t/P$,
      weights each cash flow's timing by the fraction of the bond's price it
      represents — it is literally the center of mass of the bond's payment
      schedule along the time axis. A bond with more of its value sitting in
      distant payments has a higher Macaulay duration, because those distant
      $t$'s get more weight.

      Modified duration, $D_{mod} = D/(1+y)$, rescales that center-of-mass
      number into something directly usable: it is the (negative) slope of
      price against yield near the bond's current price, so
      $\%\Delta P \approx -D_{mod}\,\Delta y$ turns a rate move straight into
      a percentage price move with one multiplication. Because it is a
      tangent-line approximation to a curved relationship, it is exact only
      in the limit of an infinitesimal yield change — for any finite move it
      is a first-order estimate, not the true answer.

      The intuition to keep: longer maturities and lower coupons both push
      more of a bond's value into the far future, raising Macaulay duration
      and therefore rate sensitivity — a 30-year zero is far more
      rate-sensitive than a 2-year high-coupon bond of the same price.
    worked: >
      A 3-year, $5\%$ annual-coupon, 100-dollar-face bond priced at par
      ($y=5\%$) pays 5, 5, and 105 at $t=1,2,3$, with present values
      $4.76$, $4.54$, and $90.70$. Macaulay duration is
      $(1\times4.76+2\times4.54+3\times90.70)/100 \approx 2.86$ years, so
      $D_{mod}\approx2.86/1.05\approx2.72$. A rise in yield to $6\%$ should
      cut the price by about $2.72\%$, to roughly $97.28$; repricing directly
      at $6\%$ gives about $97.33$ — the true price sits a touch above the
      linear estimate, exactly the convexity gap duration always leaves on
      the table.
    interview: >
      Expect "roughly what does this bond do if rates move 1 percent" as the
      canonical ask, answered as $D_{mod}\times\Delta y$ in one breath, plus
      "does duration go up or down with maturity/coupon" as an immediate
      follow-up.
    pitfalls: >
      Quoting Macaulay duration when asked for price sensitivity — only
      modified duration, divided by $(1+y)$, is the usable slope. Trusting
      the linear estimate for a large yield move without flagging that the
      true, convex price sits above the straight-line prediction in both
      directions.
    recap: >
      Modified duration is the slope of price against yield, built from a
      weighted-average cash-flow timing — accurate for small rate moves, and
      always a slight underestimate of the true convex price.
    dialogue:
      - part: Same price, same yield, different fall
        teach: >
          Two bonds both trade at 100 dollars and both yield $10\%$. Bond Z
          pays nothing until a single 121 dollars in two years. Bond C pays a
          10-dollar coupon in one year and 110 in two. Overnight, yields on
          both jump to $11\%$.
      - ask: >
          What is Bond Z worth now, in dollars? Use $1.11^{2} = 1.2321$.
        expects: "98.21"
        tolerance: 0.01
        feedback: >
          $121/1.2321 \approx 98.21$ dollars, a fall of 1.79.
      - ask: >
          What is Bond C worth now, in dollars?
        expects: "98.29"
        tolerance: 0.01
        hint: >
          Discount the 10 by one year at $11\%$ and the 110 by two.
        feedback: >
          $10/1.11 + 110/1.2321 \approx 9.01 + 89.28 = 98.29$ dollars, a fall
          of 1.71.
      - ask: >
          Same price, same yield, same move in yield, yet Bond Z fell further.
          Why?
        choices:
          - text: >
              Bond Z has the larger face value, 121 against 100.
            feedback: >
              Face value cannot be the reason: both bonds cost exactly 100
              today, so the same money is at risk in each. Scale both up or
              down and the percentage falls do not change.
          - text: >
              All of Bond Z's value arrives in year two, while part of Bond C's
              arrives in year one.
            correct: true
            feedback: >
              A payment two years out is discounted by $(1+y)^{2}$, so it reacts
              to $y$ about twice as hard as a payment one year out. Bond C
              keeps 9 dollars of its value in the less sensitive year-one slot.
          - text: >
              Zero-coupon bonds are riskier borrowers, so they fall further.
            feedback: >
              No borrower appears here at all: both prices came from the same
              yield applied to fixed cash flows. The gap is pure arithmetic of
              timing.
        feedback: >
          Rate sensitivity is about *when* the money arrives. The later the
          value, the harder a change in the discount rate bites.
      - reflect: >
          Design a single number, measured in years, for how late a bond pays
          you on average, so that Bond Z scores exactly 2 and Bond C scores a
          little less. How should each payment's date be weighted?
        hint: >
          A 10-dollar coupon and a 110-dollar final payment should not count
          equally. Weight by what each is worth today.
        answer: >
          Average the payment dates, weighting each by its share of today's
          price: $D = \sum_t t \cdot PV_t / P$. Bond Z has all its value at
          $t = 2$, so $D = 2$. Bond C has a little at $t = 1$, so it scores
          just under 2. It is the centre of mass of the payments along the
          time axis.

      - part: From an average date to a slope
        teach: >
          That number is the Macaulay duration. Bond C's present values at
          $10\%$ are $10/1.1 \approx 9.09$ at year one and
          $110/1.21 \approx 90.91$ at year two, out of a price of 100.
      - ask: >
          What is Bond C's Macaulay duration, in years? Round to two places.
        expects: "1.91"
        tolerance: 0.005
        feedback: >
          $(1 \times 9.09 + 2 \times 90.91)/100 \approx 1.91$ years: just under
          Bond Z's 2, as designed.
      - ask: >
          Why should an average date predict price sensitivity? Take a single
          term of the price, $C/(1+y)^{t}$, and differentiate it with respect
          to $y$. What comes out?
        choices:
          - text: >
              $-C/(1+y)^{t+1}$
            feedback: >
              That is the derivative when $t = 1$ only. The power $t$ comes
              down as a factor: $d/dy\,(1+y)^{-t} = -t(1+y)^{-t-1}$.
          - text: >
              $-t\,C/(1+y)^{t+1}$
            correct: true
            feedback: >
              That is $-t \cdot PV_t/(1+y)$: each term's slope is its present
              value times its date, over $1 + y$.
          - text: >
              $t\,C/(1+y)^{t-1}$
            feedback: >
              The sign is wrong, and so is the power. Raising $y$ shrinks each
              term, so the slope must be negative.
        feedback: >
          Summing over all terms gives $dP/dy = -\sum_t t \cdot PV_t/(1+y)
          = -P \cdot D/(1+y)$. The price-weighted dates appear on their own:
          the average date is the slope in disguise.
      - teach: >
          So define modified duration $D_{mod} = D/(1+y)$. Then
          $dP/dy = -D_{mod} P$, and for a small move,
          $\%\Delta P \approx -D_{mod}\,\Delta y$. Duration is exactly the
          negative slope of price against yield, rescaled to percent. It is a
          tangent line, so it is exact only for an infinitesimal move.
      - ask: >
          Bond C's unrounded duration is $1.9091$, so
          $D_{mod} = 1.9091/1.1 \approx 1.7355$. For the one-point rise from
          $10\%$ to $11\%$, what price does duration predict, in dollars?
        expects: "98.26"
        tolerance: 0.01
        feedback: >
          $100 \times (1 - 1.7355 \times 0.01) \approx 98.26$ dollars. The true
          price you computed was 98.29.
      - ask: >
          The duration estimate, 98.26, sits below the true 98.29. Why?
        choices:
          - text: >
              Rounding in $D_{mod}$.
            feedback: >
              Carry $D_{mod}$ to six places and the estimate is still 98.26.
              The gap is in the method, not the digits.
          - text: >
              It should have used Macaulay duration, 1.91, instead.
            feedback: >
              That predicts $100(1 - 0.0191) = 98.09$, further off. Macaulay
              duration is the average date; only the modified version is the
              slope.
          - text: >
              The price–yield curve is convex, so its tangent line runs below
              it on both sides.
            correct: true
            feedback: >
              Duration follows the tangent; the true price bends up away from
              it. The estimate undershoots the true price for a rise in yield
              and for a fall.
        feedback: >
          Duration is a first-order estimate. What it leaves out is curvature,
          which always works in the holder's favour.

      - part: Where the straight line strays
        ask: >
          Bond Z has $D = 2$ and $D_{mod} = 2/1.1 \approx 1.8182$. Yields leap
          three points, from $10\%$ to $13\%$. What price does duration
          predict, in dollars?
        expects: "94.55"
        tolerance: 0.01
        feedback: >
          $100 \times (1 - 1.8182 \times 0.03) \approx 94.55$ dollars. The true
          price is $121/1.13^{2} \approx 94.76$, so the estimate is off by
          0.21. For the one-point move it was off by only 0.025: triple the
          move and the error grows about ninefold, as a curvature error should.
      - ask: >
          Three bonds all yield $8\%$: a 5-year zero, a 5-year bond with an
          $8\%$ coupon, and a 2-year zero. Which ranks them from most to least
          rate-sensitive?
        choices:
          - text: >
              5-year coupon bond, 5-year zero, 2-year zero.
            feedback: >
              Coupons pull value forward in time. The 5-year coupon bond's
              duration is about 4.31 years, below the zero's 5.
          - text: >
              5-year zero, 5-year coupon bond, 2-year zero.
            correct: true
            feedback: >
              Durations of 5, about 4.31, and 2. A zero's duration is its
              maturity; coupons pull it below.
          - text: >
              5-year zero, 2-year zero, 5-year coupon bond.
            feedback: >
              Coupons pull the 5-year bond's duration down to about 4.31, not
              below 2. Most of its value is still the face repaid in year five.
        feedback: >
          Longer maturity and lower coupon both push value into the far future
          and raise duration.
      - teach: >
          The interview version: "modified duration times the yield move,
          with a minus sign; a bit conservative, because the curve is convex".
          Say which duration you mean. Macaulay is in years; modified is the
          slope.

  - node: quant-finance.instruments.forward-future
    hook: >
      "List the differences between a forward and a future" is close to a
      guaranteed opener in any derivatives interview, and the strong answer
      is a short checklist, not a paragraph.
    explanation: >
      Both are obligations, not choices — a long forward or future commits
      you to buy at the fixed price no matter where the market ends up, and a
      short commits you to sell, with no walk-away option on either side.
      That obligation is the defining property to hold onto, since the next
      instrument in this unit breaks exactly that symmetry.

      A forward is a private, over-the-counter agreement between two named
      counterparties: customized to whatever size, date, and terms they
      negotiate, carrying each side's exposure to the other's default, and
      settling once, at expiry. A future is the identical obligation
      standardized — fixed contract size, expiry, and deliverable grade — and
      moved onto an exchange, where a clearinghouse interposes itself as
      counterparty to every trade, removing bilateral default risk, and the
      position is marked to market daily, with gains and losses paid in cash
      each night instead of accumulating until expiry.

      The total payoff over the life of the trade is the same either way —
      standardization and daily settlement change when you receive the money
      and who bears counterparty risk, not how much you ultimately make.
    worked: >
      A trader long a forward at 50, and separately long a future at 50, on
      an asset that ends at 58: the forward pays $58-50=8$ once, at expiry.
      The future instead credits the same total in pieces as it's marked
      daily — say $+2$ on day 1 (price to 52), $+3$ on day 2 (price to 55),
      $+3$ on day 3 at expiry (price to 58) — summing to the identical 8, just
      received along the way instead of all at once.
    interview: >
      Expect the checklist answer — OTC versus exchange, bilateral default
      risk versus a clearinghouse, single settlement versus daily
      mark-to-market — and a follow-up on why a trader might still prefer a
      forward (customization a standard contract can't match) over a future.
    pitfalls: >
      Describing a future as having no credit risk at all — the
      clearinghouse and daily margining are the mitigation, not an absence of
      risk. Treating "long" as any kind of choice — there is no optionality
      here; the trade happens at the fixed price regardless of the market.
    recap: >
      A forward is a private, single-settlement obligation to trade later at
      a fixed price; a future is the same obligation standardized, centrally
      cleared, and settled in cash every day.
    dialogue:
      - part: A handshake about delivery day
        teach: >
          A bakery and a wheat farmer agree today that in three months the
          bakery will buy 1,000 bushels from the farmer at 7 dollars a bushel,
          whatever wheat costs by then. No money changes hands today.
      - ask: >
          On delivery day wheat costs 8.20 dollars a bushel. How many dollars
          better off is the bakery than if it had bought at the market price?
        expects: "1200"
        feedback: >
          It pays 7 for wheat worth 8.20: $(8.20 - 7) \times 1000 = 1200$
          dollars. The farmer is 1,200 dollars worse off by the same
          arithmetic.
      - ask: >
          Suppose instead wheat ends at 6.10. What happens to the bakery?
        choices:
          - text: >
              It walks away and buys at 6.10 in the market; nothing was paid
              up front, so nothing is lost.
            feedback: >
              The agreement is a promise to buy, not a right to. Walking away
              is a breach of contract, and the farmer is owed the difference.
          - text: >
              It must still buy at 7, which is 900 dollars worse than the
              market.
            correct: true
            feedback: >
              $(6.10 - 7) \times 1000 = -900$ dollars. The bakery took the
              price risk off the table in both directions: no gain from a fall,
              no pain from a rise.
          - text: >
              It may cancel by paying a small fee agreed in advance.
            feedback: >
              No fee or exit was agreed. A deal with a paid exit would be a
              different contract, one that this handshake is not.
        feedback: >
          Both sides are bound. The bakery is long: it must buy. The farmer is
          short: he must sell.
      - ask: >
          Back in the 8.20 world. What is the bakery's biggest worry as
          delivery day approaches?
        choices:
          - text: >
              That wheat keeps rising after delivery.
            feedback: >
              After delivery the bakery owns the wheat; a further rise is good
              for it. The worry is before then.
          - text: >
              That the farmer, now 1,200 dollars out of pocket on the deal,
              fails to deliver or goes bust.
            correct: true
            feedback: >
              The bakery's gain is only as good as the farmer's ability and
              willingness to pay it. That is counterparty default risk.
          - text: >
              That the agreed price of 7 can be renegotiated by the farmer.
            feedback: >
              The price is fixed by the agreement; neither side can reset it
              alone. The farmer's realistic escape is not to perform at all.
        feedback: >
          A private promise carries the other side's credit. The side that is
          winning is the one exposed, and the longer the wait, the bigger the
          amount it is exposed to can grow.
      - reflect: >
          Redesign the deal so that neither side needs to trust the other, and
          so that a loss cannot pile up unpaid for three months. What two
          changes would you make?
        hint: >
          Who could stand between them? And how often could the score be
          settled?
        answer: >
          Put a well-capitalised middleman between them, so each side's
          contract is with it and not with each other. And settle gains and
          losses in cash every day, so no more than one day's move is ever
          owed. Doing that at scale needs standard contracts that thousands of
          traders can match: fixed size, fixed date, fixed grade. That is a
          futures exchange.

      - part: The same promise, cleared and settled daily
        teach: >
          The handshake is a forward: a private (over-the-counter) agreement,
          customised to the two parties, carrying each one's default risk, and
          settled once at expiry. A future is the same obligation standardised
          and traded on an exchange. A clearinghouse becomes the counterparty
          to both sides, and the position is marked to market every day: each
          day's gain or loss is paid in cash that evening.
      - ask: >
          You are long one wheat future on 5,000 bushels at 7.00. The daily
          settlement prices are 7.10, then 6.95, then 7.30. What cash flow
          lands in your account on day two, in dollars? Use a minus sign for a
          payment out.
        expects: "-750"
        hint: >
          Each day settles the move since the previous day's settlement.
        feedback: >
          $(6.95 - 7.10) \times 5000 = -750$ dollars. Day one paid you
          $(7.10 - 7.00) \times 5000 = 500$; day two takes back 750.
      - ask: >
          Over all three days, what is your total cash, in dollars?
        expects: "1500"
        feedback: >
          $500 - 750 + 1750 = 1500$ dollars, which is $(7.30 - 7.00) \times
          5000$: exactly what a forward at 7.00 settling at 7.30 would pay at
          the end. Daily settlement changes when you are paid, not how much.
      - ask: >
          Which of these is *not* a difference between a forward and a future?
        choices:
          - text: >
              Who you face: one named counterparty, or a clearinghouse.
            feedback: >
              That is a real difference, and the one that removes bilateral
              default risk.
          - text: >
              When gains are paid: once at expiry, or every day.
            feedback: >
              Real too. It is what you just tracked on the wheat future.
          - text: >
              Whether you must trade at the agreed price.
            correct: true
            feedback: >
              Both are obligations. Long a forward or long a future, you buy
              at the fixed price whatever the market does.
          - text: >
              Whether size and date can be tailored.
            feedback: >
              A real difference: forwards are customised, futures are
              standard.
        feedback: >
          Same obligation, different plumbing.

      - part: Why anyone still signs a forward
        ask: >
          An airline needs 37,500 barrels of jet fuel delivered to one airport
          on 14 August. Exchange contracts are 1,000 barrels of crude oil,
          expiring monthly. Which hedge matches its need most closely?
        choices:
          - text: >
              Futures, always: no counterparty risk beats any mismatch.
            feedback: >
              The mismatch is real money. Crude is not jet fuel, 37.5 is not a
              whole number of contracts, and the expiry is not 14 August. Each
              gap leaves unhedged risk.
          - text: >
              A forward with a fuel supplier for exactly that amount, product,
              place and date.
            correct: true
            feedback: >
              Customisation is the forward's whole advantage. The airline
              accepts the supplier's credit risk in exchange for a hedge that
              fits.
          - text: >
              Neither: hedges only make sense for speculators.
            feedback: >
              A hedger is exactly the user a forward was invented for: someone
              who wants a price fixed, not a bet.
        feedback: >
          Futures win on liquidity and credit; forwards win on fit.
      - ask: >
          A candidate says a future has no credit risk at all. Is that right?
        choices:
          - text: >
              Yes: the clearinghouse guarantees every trade, so the risk is
              gone.
            feedback: >
              The risk is moved and shrunk, not deleted. A one-day move larger
              than the posted collateral, or a failing clearing member, still
              has to be absorbed by someone.
          - text: >
              No: it is mitigated by the clearinghouse and daily settlement,
              not eliminated.
            correct: true
            feedback: >
              At most one day's loss is ever outstanding, and a well-funded
              central counterparty stands behind it. Small, not zero.
          - text: >
              No: a future carries more credit risk than a forward.
            feedback: >
              Daily settlement caps the unpaid amount at one day's move,
              against months of accumulation in a forward. The future has
              less.
        feedback: >
          Mitigated, not eliminated, is the precise answer.
      - teach: >
          Asked for the differences, give the checklist in one breath:
          over-the-counter versus exchange, customised versus standard,
          bilateral credit versus clearinghouse, settled once versus marked
          daily. Then add the thing they share: both are obligations, with no
          walk-away.

  - node: quant-finance.instruments.futures-margin
    hook: >
      "Walk me through what happens to your account over three losing days"
      is the standard way this gets tested, and the trap is topping the
      account back up to maintenance instead of all the way to initial.
    explanation: >
      A future is marked to market daily, and margin is the collateral
      buffer that absorbs those daily swings — initial margin is a small
      percentage of contract value posted to open the position, not a
      down payment toward owning the underlying. Each night the exchange
      settles the day's price change in cash directly into or out of the
      margin account, so the account balance drifts with the market every
      single day the position stays open.

      Maintenance margin is the floor: once the balance falls below it, a
      margin call requires depositing enough to bring the account back up to
      the initial margin level — not merely back above maintenance — or the
      position gets closed out by the broker. Think of maintenance margin as
      the trigger and initial margin as both the starting requirement and
      the target every call restores to; conflating the two is the most
      common slip.

      Because losses are deducted continuously rather than saved up, futures
      P&L is realized in real time, in contrast to a forward's single
      settlement at expiry from the previous node — the margin mechanism is
      precisely what daily marking requires to actually function.
    worked: >
      Initial margin 8,000 dollars, maintenance margin 6,000 dollars, on a
      short position: the price rises 2,100 dollars over three days, so the
      account loses 2,100, leaving 5,900 — below the 6,000 maintenance floor.
      The margin call requires depositing $8{,}000-5{,}900=2{,}100$ dollars
      to restore the account to the full 8,000 initial level, not just above
      6,000.
    interview: >
      Given initial margin, maintenance margin, and a sequence of price
      moves, expect to track the running balance, flag exactly when it
      breaches maintenance, and compute the top-up back to initial without
      being told to.
    pitfalls: >
      Topping up only to the maintenance level rather than all the way back
      to initial. Treating initial margin as a cap on possible losses — it
      isn't; losses can run through it many times over if calls go unmet, up
      to the point of forced liquidation.
    recap: >
      Futures margin is collateral against daily marks, not a down payment —
      a call restores the account to initial margin whenever daily losses
      breach maintenance.
    dialogue:
      - part: Three evenings of losses
        teach: >
          You go long one stock-index future at 4,000 points, at 50 dollars per
          point, so the contract controls 200,000 dollars of index. You open an
          account with the exchange holding 12,000 dollars. Each evening the
          exchange moves that day's gain or loss into or out of the account in
          cash.
      - ask: >
          Day one settles at 3,970. What is your account balance that evening,
          in dollars?
        expects: "10500"
        hint: >
          Points lost, times 50 dollars a point.
        feedback: >
          $30$ points $\times 50 = 1500$ dollars out, leaving
          $12000 - 1500 = 10500$.
      - ask: >
          Day two settles at 3,948. What is the balance now, in dollars?
        expects: "9400"
        feedback: >
          The move is measured from yesterday's settlement, 3,970: $22 \times
          50 = 1100$ dollars out, leaving $10500 - 1100 = 9400$.
      - ask: >
          Day three settles at 3,935. What is the balance now, in dollars?
        expects: "8750"
        feedback: >
          $13 \times 50 = 650$ dollars out, leaving $9400 - 650 = 8750$. The
          index has fallen less than $2\%$, and over a quarter of the deposit is
          gone.
      - reflect: >
          The exchange now holds 8,750 dollars against a 196,750-dollar
          contract, and a bad day could take several thousand. If you ran the
          exchange, when would you demand more cash, and how much would you
          demand?
        hint: >
          A trigger, and a target. Should they be the same number?
        answer: >
          Set a floor: once the balance drops below it, demand a top-up. But
          top up to the original level, not just to the floor, or the very
          next small loss trips the floor again and the buffer is always one
          bad day from empty. Two numbers, then: a trigger and a restore level.

      - part: Trigger and target
        teach: >
          The deposit is the initial margin: collateral against daily losses,
          not a down payment on the index. Its floor is the maintenance margin,
          here 9,000 dollars. When the evening balance is below maintenance,
          you get a margin call: deposit enough to restore the account to the
          initial margin, or the broker closes the position.
      - ask: >
          Your balance is 8,750 dollars. How much does the margin call require
          you to deposit, in dollars?
        expects: "3250"
        hint: >
          The target is the initial margin.
        feedback: >
          $12000 - 8750 = 3250$ dollars. Depositing only 250 to reach
          maintenance is the classic slip: it leaves you with 9,000 and one
          more bad tick from the next call.
      - ask: >
          After your deposit, day four settles at 3,990. What is the balance,
          in dollars?
        expects: "14750"
        feedback: >
          $(3990 - 3935) \times 50 = 2750$ dollars in, so
          $12000 + 2750 = 14750$. Gains are credited as promptly as losses
          were debited.
      - ask: >
          You have put in 15,250 dollars in total and the account holds 14,750.
          What is your profit or loss on the trade so far, in dollars? Use a
          minus sign for a loss.
        expects: "-500"
        feedback: >
          $14750 - 15250 = -500$ dollars, which is exactly
          $(3990 - 4000) \times 50$: ten points below your entry. The daily
          cash flows add up to the position's whole P&L; nothing is saved up
          for expiry.

      - part: When the buffer is not enough
        ask: >
          A trader ignores a margin call. What happens?
        choices:
          - text: >
              Nothing until expiry: the position just carries the deficit
              forward.
            feedback: >
              Carrying unpaid losses forward is exactly what daily settlement
              exists to stop. An unmet call does not wait.
          - text: >
              The broker closes the position, and the trader still owes any
              shortfall beyond the account.
            correct: true
            feedback: >
              The call is a demand, not a suggestion. Liquidation stops new
              losses; it does not cancel the ones already made.
          - text: >
              The trader loses the initial margin and nothing more; that is the
              most a future can cost.
            feedback: >
              Initial margin is collateral, not a cap. Losses are whatever the
              market move is, as the next question shows.
        feedback: >
          A call is met in cash or the position is closed out.
      - ask: >
          Your account holds 14,750 dollars with the index at 3,990. Overnight
          news gaps it down to 3,680 at the next settlement. What is the
          balance, in dollars?
        expects: "-750"
        hint: >
          The settlement does not stop at zero.
        feedback: >
          $310 \times 50 = 15500$ dollars out, so $14750 - 15500 = -750$. The
          account is negative: you owe 750 dollars beyond everything you
          posted. A one-day move of under $8\%$ did it.
      - teach: >
          Margin questions are bookkeeping: track the balance day by day,
          measure each move from the previous settlement, flag the first close
          below maintenance, and restore to initial, not to maintenance. Say
          "collateral, not a down payment" before anyone asks.

  - node: quant-finance.instruments.option-vocab
    hook: >
      "Define a call and a put, then tell me the maximum loss for the buyer
      versus the seller" is close to a guaranteed opener, and the buyer/
      seller asymmetry is the part candidates rush past.
    explanation: >
      A forward or future is an obligation with no way out; an option is the
      opposite — a right, never an obligation, to trade the underlying at a
      fixed strike $K$ by expiry $T$. A call is the right to buy, a put the
      right to sell; European exercise is allowed only at expiry, American
      exercise at any time up to and including it. Think of an option as a
      forward with a built-in walk-away clause: the holder simply declines to
      exercise whenever it would be unfavorable, and the premium is exactly
      what that one-sided choice costs to buy.

      That walk-away clause is what makes the buyer's and seller's positions
      fundamentally different, not just mirror images. The buyer (long)
      pays the premium up front and can never owe more than that premium,
      however badly the underlying moves — the loss is capped by
      construction. The seller (short, or writer) collects the premium but
      takes on the obligation to perform whenever the buyer chooses to
      exercise, with no equivalent cap of their own.

      Long and short here describe who holds the right versus who holds the
      obligation — the same long/short language from forwards and futures,
      but now attached to an asymmetric payoff instead of a symmetric one.
    worked: >
      A European put, strike 40, premium 3, 6 months to expiry. If the stock
      settles at 32, the holder exercises: payoff $40-32=8$, minus the
      3-dollar premium, nets 5. If instead it settles at 45, the holder lets
      it expire worthless: payoff 0, net $-3$, the premium and nothing more.
      The writer's outcomes mirror this exactly: $-5$ in the first case,
      $+3$ in the second.
    interview: >
      Expect cold recall of call/put and European/American, immediately
      followed by "what can the buyer lose, what can the seller lose" — the
      strong answer names the premium cap for the buyer before being asked
      about the seller's side.
    pitfalls: >
      Forgetting that only the holder (buyer) has a choice — the writer's
      outcome is entirely determined by what the buyer decides. Assuming
      American always trades meaningfully above European — the size of any
      early-exercise premium depends on the underlying and is a pricing
      question for later, not part of the definition itself.
    recap: >
      An option buyer pays a premium for the right, never the obligation, to
      trade at the strike — capping the buyer's loss at that premium while
      the writer carries the open-ended side.
    dialogue:
      - part: A forward with a way out
        teach: >
          A stock trades at 80. A dealer offers you two deals for three months
          from now. Deal F: you must buy one share at 80. Deal R: you pay 4
          dollars today, and in three months you may buy one share at 80 if you
          want to.
      - ask: >
          The stock ends at 71. What is your profit or loss on Deal F, in
          dollars per share? Use a minus sign for a loss.
        expects: "-9"
        feedback: >
          You must pay 80 for a share worth 71: $71 - 80 = -9$. Deal F is a
          forward, and a forward does not care that you would rather not.
      - ask: >
          Same ending, 71. What is your profit or loss on Deal R, counting the
          4 dollars you paid?
        expects: "-4"
        hint: >
          Would you choose to buy at 80 a share you can get for 71?
        feedback: >
          You decline to buy, so the deal pays $0$, and you are out only the
          4 dollars: $-4$.
      - ask: >
          Now the stock ends at 93. What is your profit or loss on Deal R?
        expects: "9"
        feedback: >
          You buy at 80 a share worth 93, a payoff of 13, less the 4 paid:
          $93 - 80 - 4 = 9$. Deal F would have made 13; the 4 dollars is the
          cost of the exit you did not use.
      - ask: >
          However far the stock falls, what is the most you can lose on
          Deal R?
        choices:
          - text: >
              80 dollars, if the stock goes to zero.
            feedback: >
              That is Deal F's worst case. With Deal R, a stock at zero is
              simply a share you decline to buy at 80.
          - text: >
              4 dollars, the amount paid up front.
            correct: true
            feedback: >
              The payoff is never below zero because you only act when it
              helps you. The price of entry is the whole downside.
          - text: >
              Unlimited, like any derivative.
            feedback: >
              Some positions are unlimited, but not this side of this one. You
              pay once and can never be asked for more.
        feedback: >
          Deal F's loss runs as low as $-80$; Deal R's stops at $-4$.
      - reflect: >
          Deal R pays the same as Deal F when the stock rises and far better
          when it falls. What exactly do the 4 dollars buy, and why could no
          dealer offer Deal R for free?
        answer: >
          They buy the right to walk away: a choice the forward does not give.
          Deal R is never worse than Deal F before the fee, and sometimes much
          better, so at a price of zero everyone would take it and nobody would
          write it. The 4 dollars is the price of that one-sided choice, paid
          to whoever takes on the obligation to perform.

      - part: Calls, puts, and who holds the right
        teach: >
          Deal R is an option: the right, not the obligation, to trade the
          underlying at a fixed strike price $K$ on or before an expiry $T$. A
          right to buy is a call; a right to sell is a put. The buyer, or
          holder, is long the option and pays the premium. The seller, or
          writer, is short: it collects the premium and must perform if the
          holder exercises. A European option is exercised only at expiry; an
          American one, any time up to it.
      - ask: >
          You hold a put struck at 30, bought for a premium of 1.50. At expiry
          the stock is at 26.40. What is your net profit per share, in dollars?
        expects: "2.10"
        hint: >
          A put lets you sell at 30.
        feedback: >
          You sell at 30 a share worth 26.40, a payoff of 3.60, less the 1.50
          premium: $30 - 26.40 - 1.50 = 2.10$ dollars.
      - ask: >
          The same put, but the stock ends at 33. What do you do, and where do
          you end up?
        choices:
          - text: >
              Exercise and sell at 30: net $-3 - 1.50 = -4.50$.
            feedback: >
              Selling at 30 something worth 33 loses 3 more. A holder exercises
              only when it helps, which is the whole point of holding a right.
          - text: >
              Let it expire: net $-1.50$, the premium.
            correct: true
            feedback: >
              A put pays when the stock is below the strike. Above it, the
              right is worthless and you keep your loss to the premium.
          - text: >
              Let it expire and get the premium back, since you never used it.
            feedback: >
              The premium paid for the right to choose, and you had that right
              all along. It is spent whether or not you exercise.
        feedback: >
          Only the holder decides, and the holder never decides against
          themselves.
      - ask: >
          Return to Deal R, the call struck at 80 sold for 4. A takeover bid
          sends the stock to 130. What is the writer's profit or loss per
          share, in dollars?
        expects: "-46"
        feedback: >
          The writer must deliver at 80 a share worth 130, losing 50, and keeps
          the 4 premium: $4 - 50 = -46$. Push the stock higher and the loss
          keeps growing. The holder's loss is capped at the premium; the
          writer's gain is capped at the premium.

      - part: Who decides, and when
        ask: >
          You hold a European call struck at 80, expiring in June. In March the
          stock is at 95. Can you exercise now?
        choices:
          - text: >
              Yes: any option can be exercised as soon as it pays.
            feedback: >
              That describes an American option. "European" is a statement
              about when exercise is allowed: at expiry only.
          - text: >
              No: a European option is exercised only at expiry, though you may
              sell the option itself today.
            correct: true
            feedback: >
              The exercise date is fixed; the contract is still tradable. The
              name is about timing, not about where it trades.
          - text: >
              Yes, because it is in the money by 15 dollars.
            feedback: >
              How far in the money it is does not change the exercise rule.
              In March you can sell the call, but not exercise it.
        feedback: >
          European and American describe when the holder may exercise, nothing
          else.
      - ask: >
          You wrote a put struck at 75. At expiry the stock is at 70 and the
          holder exercises. Can you decline to buy?
        choices:
          - text: >
              Yes: both sides of an option have a choice.
            feedback: >
              The choice is what the holder paid for, and only the holder has
              it. Paying for it was the whole transaction.
          - text: >
              Yes, by handing back the premium.
            feedback: >
              The premium is not a deposit. You sold an obligation, and it
              cannot be returned for a refund.
          - text: >
              No: you must buy at 75 a share worth 70.
            correct: true
            feedback: >
              The writer's outcome is decided entirely by the holder. You lose
              5 on the share, offset by whatever premium you collected.
        feedback: >
          Long holds the right; short holds the obligation. In an interview,
          name the buyer's capped loss first and then say the writer has the
          open side.

  - node: quant-finance.instruments.short-selling
    hook: >
      "What's the maximum loss on a short position?" has a one-word answer —
      unbounded — and that single fact is why brokers treat shorting as
      categorically riskier than owning stock.
    explanation: >
      Shorting starts with borrowing, not selling: a trader borrows shares
      from a broker's inventory or another client's account, paying a borrow
      fee for as long as the position is open, and sells them immediately at
      the current price. What's owed back to the lender is shares, not cash —
      profit comes from later buying identical shares back at a lower price
      and returning them, the mirror image of buy-low-sell-high with the
      order reversed in time.

      Two costs run the entire time the position is open, independent of
      whether the trade eventually works: the borrow fee itself, which
      spikes for stock that's hard to borrow, and any dividends the
      underlying stock pays, which the short seller owes back to the lender
      since the lender is missing out on them. Neither cost depends on price
      direction — they accrue regardless.

      The risk asymmetry against owning stock is structural, not incidental:
      a long position's price floor is zero, so the maximum loss is the
      amount invested, while a short position's buy-back price has no
      ceiling, so the maximum loss is unbounded. That asymmetry is exactly
      why brokers demand margin against short positions and can force a
      buy-in — a short squeeze — if posted collateral runs short.
    worked: >
      Short 100 shares at 30 dollars (proceeds 3,000), holding 6 months at a
      borrow cost of about 30 dollars and owing a 0.50-dollar dividend per
      share (50 dollars) paid during that time, then buying back at 22:
      profit is $(30-22)\times100 - 30 - 50 = 720$ dollars. If instead the
      stock is forced to be bought back at 55, the loss is already
      $(30-55)\times100 = -2{,}500$ before fees — and keeps growing without
      limit the higher the price runs.
    interview: >
      "What happens to a short if the stock triples" tests whether unbounded
      loss comes back instantly, and "what does a short pay besides the
      buy-back price" checks whether borrow fees and owed dividends get
      named unprompted.
    pitfalls: >
      Computing short P&L from price difference alone, forgetting the
      running borrow fee and any dividends owed. Assuming the maximum loss
      is "100 percent," as with a long position — there is no price ceiling,
      so there is no such cap.
    recap: >
      Shorting is renting and selling borrowed shares to buy them back
      cheaper, paying fees and dividends the whole time — and unlike owning
      stock, the loss has no ceiling.
    dialogue:
      - part: Selling shares you do not own
        teach: >
          A stock trades at 120 and you think it is overpriced, but you own
          none. A broker lends you 200 shares out of another client's account,
          for a fee. You sell them at once. Later you must hand back 200
          shares, not money.
      - ask: >
          The stock falls to 105. You buy 200 shares and return them. Before
          any costs, what is your profit, in dollars?
        expects: "3000"
        feedback: >
          You sold at 120 and bought back at 105: $(120 - 105) \times 200 =
          3000$ dollars. Sell high, buy low, in the reverse order in time.
      - ask: >
          While you were short, the company paid a dividend of 1.20 dollars a
          share. Who pays the lender for it?
        choices:
          - text: >
              Nobody: the shares were sold, so there was no one to pay.
            feedback: >
              The lender still expects to be as well off as if they had never
              lent. Lending the shares cannot cost them their dividend.
          - text: >
              The company pays the lender as usual.
            feedback: >
              The company pays whoever holds the shares now, which is the buyer
              you sold to. The lender's shares are in someone else's account.
          - text: >
              You do: the buyer you sold to receives the real dividend, so you
              owe the lender a matching payment.
            correct: true
            feedback: >
              Two people now hold claims to that dividend, and only one share
              exists. The short seller makes up the difference.
        feedback: >
          A short owes the lender every dividend paid while the position is
          open.
      - ask: >
          The borrow fee came to 85 dollars in total. Counting the dividend
          and the fee, what is your net profit on the trade, in dollars?
        expects: "2675"
        hint: >
          The dividend costs 1.20 on each of the 200 borrowed shares.
        feedback: >
          $3000 - 1.20 \times 200 - 85 = 3000 - 240 - 85 = 2675$ dollars. The
          two running costs do not care which way the price went.

      - part: The other direction
        ask: >
          Go back to the start, and this time the stock climbs to 150 before
          you buy back. Before costs, what is your profit or loss, in dollars?
          Use a minus sign for a loss.
        expects: "-6000"
        feedback: >
          $(120 - 150) \times 200 = -6000$ dollars. You must buy back at
          whatever the market asks.
      - reflect: >
          A friend bought 200 shares at 120 on the same day. Compare the worst
          that can happen to their position with the worst that can happen to
          yours, and say what makes them different.
        hint: >
          How low can a share price go? How high?
        answer: >
          Your friend's worst case is the stock going to zero: a loss of
          $120 \times 200 = 24000$ dollars, everything invested and no more.
          Your worst case has no number at all, because the price you must pay
          to buy back has no ceiling. The positions are mirror images in
          price, but price is bounded below by zero and not bounded above.

      - part: Borrowed, owed, and unbounded
        teach: >
          This is a short sale: borrow shares, sell them now, buy them back
          later to return. While it is open you pay a borrow fee, which spikes
          for stock that is hard to borrow, and you owe any dividends. Because
          the loss has no ceiling, brokers demand margin against a short, and
          can force you to buy back if your collateral runs short.
      - ask: >
          A surprise bid triples the stock to 360. Before costs, what is the
          loss on your 200-share short, in dollars? Use a minus sign.
        expects: "-48000"
        feedback: >
          $(120 - 360) \times 200 = -48000$ dollars: twice the 24,000 you
          received from the sale, and a quadrupling would make it three times.
          "The most I can lose is what I sold it for" is the long's rule, not
          the short's.
      - ask: >
          A stock that many traders are short starts rising fast. What tends
          to happen next?
        choices:
          - text: >
              It falls back quickly, because so many traders are betting
              against it.
            feedback: >
              The bets are already placed; their selling happened when they
              opened. What is left to come is their buying.
          - text: >
              Margin calls and forced buy-backs make shorts buy, which pushes
              the price higher still.
            correct: true
            feedback: >
              That feedback loop is a short squeeze. Every short's exit is a
              purchase, and they are all forced to exit together.
          - text: >
              Nothing in particular: each short can simply hold on until the
              price comes back.
            feedback: >
              Only while the collateral lasts. A rising price drains the
              margin account, and the broker does not wait for a recovery.
        feedback: >
          Unbounded loss plus margin means a short can be forced out at the
          worst moment.
      - ask: >
          Suppose instead the stock sits at exactly 120 for a full year. Your
          borrow fee is $2\%$ a year of the 24,000-dollar position, and the
          company pays two dividends of 1.20 a share. What is your profit or
          loss for the year, in dollars?
        expects: "-960"
        feedback: >
          Fee: $0.02 \times 24000 = 480$. Dividends: $2 \times 1.20 \times 200
          = 480$. Total $-960$ dollars with the price unchanged. A short that
          is merely right eventually is still paying rent every day it waits.

  - node: quant-finance.instruments.leverage
    hook: >
      "You're levered 5x and the position drops 8 percent — what's your
      loss on capital?" is pure arithmetic once you see leverage as a
      multiplier on your own capital, not on the position itself.
    explanation: >
      Buying on margin means funding part of a position with a broker's loan
      instead of paying its full price in cash, and leverage is simply the
      ratio of position size to the capital you actually committed. The
      dollar profit or loss is earned on the full position size, but it's
      measured as a percentage against your smaller equity base — that
      mismatch between "size that moves" and "capital that's being tracked"
      is exactly why percentage gains and losses scale up by roughly the
      leverage ratio, in both directions equally.

      That amplification is before financing costs: the borrowed portion of
      the position accrues interest the entire time it's outstanding,
      regardless of which way the trade goes, so the real return on capital
      is always a bit worse than the raw leverage-ratio arithmetic suggests.

      The other side of leverage is forced timing: if account equity falls
      below the maintenance margin, the broker issues a margin call or
      liquidates the position outright, the same mechanism as a futures
      margin call applied to a stock account. A drawdown that would have
      recovered given time can instead become a locked-in loss the moment it
      breaches that threshold.
    worked: >
      4,000 dollars of own capital, borrowed up to 20,000 dollars of stock
      (5x leverage, $20\%$ margin). An $8\%$ drop costs $20{,}000\times0.08=
      1{,}600$ dollars on the position, which is $1{,}600/4{,}000=40\%$ of
      capital — matching $5\times8\%=40\%$ before financing costs. An $8\%$
      rise gains the same 40 percent on capital, before subtracting interest
      on the borrowed 16,000.
    interview: >
      Expect "given leverage $N$ and a move of $k$ percent, what happens to
      your equity" answered instantly as roughly $N\times k\%$, plus an
      unprompted mention that financing costs and margin-call risk both cut
      against the raw multiple.
    pitfalls: >
      Reporting the leverage-ratio arithmetic as the final answer while
      ignoring financing costs on the borrowed capital, a real and continuous
      drag. Forgetting that a loss well short of wiping out all capital can
      still breach maintenance margin and force liquidation before any
      recovery is possible.
    recap: >
      Leverage multiplies both gains and losses on your own capital by
      roughly the leverage ratio, before financing costs — and a margin call
      can force an exit at the worst possible moment regardless of your
      long-run view.
    dialogue:
      - part: Same stock, two accounts
        teach: >
          Ana and Ben both like a stock at 50 dollars, and each has 10,000
          dollars. Ana buys 200 shares with her cash. Ben puts in his 10,000,
          borrows 30,000 more from his broker, and buys 800 shares.
      - ask: >
          The stock rises $5\%$ to 52.50. What is Ana's return on her 10,000,
          as a decimal?
        expects: "0.05"
        feedback: >
          $200 \times 2.50 = 500$ dollars on 10,000: $0.05$. Unlevered, her
          return is the stock's return.
      - ask: >
          Ignoring interest on the loan, what is Ben's return on his 10,000, as
          a decimal?
        expects: "0.2"
        hint: >
          His gain is earned on 800 shares, but measured against his own
          10,000.
        feedback: >
          $800 \times 2.50 = 2000$ dollars on 10,000 of his own money: $0.20$.
          The loan is still 30,000, so the whole gain is his.
      - ask: >
          Had the stock fallen $5\%$ instead, what would Ben's return have
          been, as a decimal?
        expects: "-0.2"
        feedback: >
          $800 \times (-2.50) = -2000$ dollars, or $-0.20$. The lender is
          owed 30,000 regardless, so the whole loss lands on Ben too.
      - reflect: >
          Ben's return is a fixed multiple of Ana's, up or down. What is the
          multiple, and where in the setup does it come from?
        answer: >
          Four. Ben's gains and losses are earned on a 40,000-dollar position
          but measured against 10,000 of his own capital, and the lender's
          30,000 neither shares in the gain nor absorbs the loss. The multiple
          is position size over own capital, $40000/10000 = 4$, and it scales
          the downside exactly as it scales the upside.

      - part: Leverage, and what it costs
        teach: >
          Buying with borrowed money is buying on margin, and the ratio of
          position size to your own capital is the leverage: Ben is $4\times$
          levered, with $25\%$ margin. The return on your capital is roughly
          the leverage times the asset's return, before the interest on what
          you borrowed.
      - ask: >
          The $5\%$ rise took three months, and Ben's broker charges $8\%$ a
          year on the 30,000 loan. After interest, what is Ben's return on
          capital, as a decimal?
        expects: "0.14"
        hint: >
          Three months is a quarter of a year of interest on 30,000.
        feedback: >
          Interest is $30000 \times 0.08 \times 0.25 = 600$ dollars, so the
          return is $(2000 - 600)/10000 = 0.14$. Still well ahead of Ana's
          $0.05$, but not the $0.20$ the leverage arithmetic promised.
      - ask: >
          How far must the stock fall, as a fraction of its price, to wipe out
          Ben's 10,000 entirely?
        expects: "0.25"
        hint: >
          His capital is a quarter of the position.
        feedback: >
          A fall of $25\%$ costs $0.25 \times 40000 = 10000$ dollars, all of his
          capital. At leverage $L$, a move of $1/L$ against you is total loss.
          Ana would need the stock to go to zero.

      - part: The forced exit
        ask: >
          The stock falls to 45. Ben still owes 30,000. What is his equity,
          the value of his own stake, in dollars?
        expects: "6000"
        feedback: >
          The shares are worth $800 \times 45 = 36000$, less the 30,000 loan:
          $6000$ dollars. A $10\%$ fall has cost him $40\%$ of his capital.
      - ask: >
          Ben's broker requires equity of at least $25\%$ of the position's
          value. At 45, Ben's 6,000 is under $17\%$ of 36,000, he has no more
          cash, and the broker sells his shares. A month later the stock is at
          55. Where does Ben stand?
        choices:
          - text: >
              Up 4,000 dollars: 800 shares gained 5 dollars from where he
              bought them.
            feedback: >
              He no longer owns the shares. They were sold at 45, and the
              recovery happened to someone else's position.
          - text: >
              Down 4,000 dollars, locked in when the broker sold at 45.
            correct: true
            feedback: >
              He received 36,000, repaid 30,000, and kept 6,000 of his
              10,000. Ana, never forced to sell, is now up $10\%$.
          - text: >
              Back to 10,000 dollars: the broker must buy the shares back once
              the price recovers.
            feedback: >
              A liquidation is a sale, not a pause. Nothing obliges anyone to
              restore the position.
        feedback: >
          The margin call turned a temporary drawdown into a permanent loss.
      - ask: >
          A colleague says, "leverage just multiplies returns: hold a 4x
          position to the same date and you get four times the stock's return."
          What is wrong with that?
        choices:
          - text: >
              Nothing, as long as the stock ends higher than it started.
            feedback: >
              Ben's stock ended higher, at 55, and he still lost 4,000. The
              path matters, not just the end point.
          - text: >
              It ignores financing costs and the chance of being forced out
              along the way.
            correct: true
            feedback: >
              Interest drags on every day the loan is open, and a margin call
              can end the trade before the date ever arrives.
          - text: >
              Leverage multiplies gains but not losses, so it is better than
              four times.
            feedback: >
              The lender is repaid in full either way, so losses are multiplied
              exactly as much as gains, as Ben's $-0.20$ showed.
        feedback: >
          Interview answer: "about $L$ times the move on capital, less
          financing, provided the margin call does not get you first".

  - node: quant-finance.instruments.linear-vs-optional-payoff
    hook: >
      The fastest sanity check on any new instrument in an interview is one
      question — does its payoff move in a straight line, or does it bend? —
      and this node is the filing system that sorts everything covered so
      far into exactly two bins.
    explanation: >
      Stocks, forwards, and futures all pay off linearly: profit or loss
      moves one-for-one (or by a fixed multiplier) with the underlying, in
      either direction, with no floor or ceiling built into the contract
      itself. Options are the one instrument here that isn't linear — the
      payoff bends at the strike, because the holder simply declines to
      exercise whenever it would be unfavorable, which is the walk-away
      clause from the option vocabulary node made geometric.

      That single distinction drives how each is priced. A linear
      instrument's payoff can be replicated exactly by holding the
      underlying itself, so it's priced purely by directional no-arbitrage
      replication — no view on how likely any particular outcome is needed.
      An option's payoff cannot be replicated by a fixed position in the
      underlying alone, since the kink means the right amount of exposure
      changes as the price moves; pricing it has to additionally value that
      one-sided choice, which is exactly where volatility becomes a priced
      input rather than an afterthought.

      Before reaching for any pricing tool on a new instrument, ask this
      question first: is the payoff a straight line through the current
      price, or does it bend somewhere? The answer decides which entire
      toolkit — replication or option pricing — actually applies.
    worked: >
      A forward struck at 100 versus a call struck at 100, both long. At
      $S=80$: the forward pays $80-100=-20$, the call pays $\max(80-100,0)
      =0$. At $S=130$: the forward pays $30$, and so does the call. Below the
      strike the forward keeps losing linearly while the call's payoff
      floors flat at zero — the kink made numeric.
    interview: >
      "Is this payoff linear or does it have optionality" is often the first
      classification question in a derivatives round — answer instantly and
      name where the kink sits (the strike) and why (the right, not the
      obligation, to exercise).
    pitfalls: >
      Assuming a short position in a linear instrument is somehow bounded —
      shorting a stock or future only flips the sign of the same straight
      line; the loss is still unbounded, just on the other side. Treating
      "capped loss" as a property of the option contract itself rather than
      of being long it — the writer of that same option sits on the
      unbounded (or premium-collecting but still exposed) side of the kink.
    recap: >
      Linear instruments move dollar-for-dollar with the underlying in both
      directions; options bend at the strike because the holder can decline
      — check for that kink before reaching for a pricing tool.
    dialogue:
      - part: Three positions, one stock
        teach: >
          A stock trades at 70. Three traders each take one position for a
          year: Kai buys a share at 70, Lena goes long a forward to buy at 70,
          and Mo buys a call struck at 70. Ignore what Mo paid for the call;
          look only at what each position is worth at the end.
      - ask: >
          The stock ends the year at 60. What is Lena's forward worth at
          expiry, in dollars? Use a minus sign for a loss.
        expects: "-10"
        feedback: >
          She must pay 70 for a share worth 60: $60 - 70 = -10$. Kai's share
          has also lost 10.
      - ask: >
          Same ending, 60. What is Mo's call worth at expiry, in dollars?
        expects: "0"
        feedback: >
          Mo will not pay 70 for a share worth 60, so he lets the call expire:
          $\max(60 - 70, 0) = 0$.
      - ask: >
          Picture each position's payoff plotted against the final price,
          from 0 up to 140. Which are straight lines all the way across?
        choices:
          - text: >
              All three: each gains a dollar for every dollar the stock rises.
            feedback: >
              Above 70 they do, but below 70 Mo's payoff stays at $0$ whatever
              the price does. A line that goes flat on one side is not one
              straight line.
          - text: >
              Kai's and Lena's, but not Mo's.
            correct: true
            feedback: >
              The share and the forward move dollar for dollar with the stock
              in both directions. Mo's call bends at 70.
          - text: >
              Only Kai's: a forward is a contract, not an asset, so its value
              jumps around.
            feedback: >
              At expiry the forward is worth $S - 70$ for every final price
              $S$: one straight line, parallel to Kai's.
        feedback: >
          Two lines and one bent line.
      - ask: >
          A fourth trader is short the forward at 70. Is that position's loss
          bounded?
        choices:
          - text: >
              Yes: it is the opposite of Lena's, and Lena can lose at most 70.
            feedback: >
              Flipping a line flips which side is unbounded. Lena's worst case
              is a price of zero; the short's worst case is a price with no
              ceiling.
          - text: >
              Yes, because a forward settles only once.
            feedback: >
              Settling once says when the loss is paid, not how large it is.
              At 200 the short pays 130.
          - text: >
              No: the short loses a dollar for every dollar the stock rises,
              without limit.
            correct: true
            feedback: >
              A straight line through every price has no floor on one side or
              the other. Going short moves the danger; it does not remove it.
        feedback: >
          Linear means one-for-one in both directions, with no built-in cap on
          either side.
      - reflect: >
          Mo's call matches Lena's forward above 70 and goes flat below it.
          What about the contract puts the bend exactly at 70? And if you were
          the one selling Mo that bend, what would you want your price for it
          to depend on?
        answer: >
          The bend is at the strike because Mo has a choice and only uses it
          when it helps: below 70 he declines. Selling him that choice means
          giving up every gain a forward seller would have made below 70, so
          its price should depend on how far below 70 the stock might
          plausibly go. That is a question about how much the stock moves, its
          volatility, not about which way it is expected to move.

      - part: Lines get replicated, kinks get priced
        teach: >
          Stocks, forwards and futures are linear: profit or loss moves one for
          one with the underlying, either way, with no floor or ceiling in the
          contract. A linear payoff can be built from the underlying itself,
          so it is priced by no-arbitrage replication alone. An option's
          payoff has a kink at the strike, and its price must also value the
          one-sided choice: that is where volatility enters.
      - ask: >
          Traders come to expect wilder swings in this stock, with no change
          in where they think it will end up on average. Which position's
          fair price at inception changes?
        choices:
          - text: >
              Lena's forward: a riskier stock should be harder to agree a price
              on.
            feedback: >
              The forward price comes from replication: buy the stock now and
              carry it. Nothing in that recipe depends on how much the stock
              swings.
          - text: >
              Both, by the same amount.
            feedback: >
              Only one of them has a kink for the extra swings to act on. The
              forward gains on big rises and loses on big falls in equal
              measure.
          - text: >
              Mo's call: bigger swings make the upside larger while the
              downside stays floored at zero.
            correct: true
            feedback: >
              Extra spread below 70 costs Mo nothing; extra spread above 70
              pays him. The call becomes worth more.
        feedback: >
          Volatility is priced into a payoff only through its kinks.
      - part: Finding the kink, and its owner
        ask: >
          Which of these contracts has optionality?
        choices:
          - text: >
              Short 3 oil futures, each on 1,000 barrels.
            feedback: >
              A multiplier and a minus sign: still one straight line, just
              steeper and pointing the other way.
          - text: >
              A contract paying $S - 70$ at expiry, but never less than $-5$.
            correct: true
            feedback: >
              The payoff runs along a line and then goes flat at $S = 65$: a
              kink, so it holds a choice-like floor and must be priced like an
              option.
          - text: >
              Long two forwards at 70 and short one forward at 75.
            feedback: >
              Lines added give a line: $2(S - 70) - (S - 75) = S - 65$. Steeper
              or shallower, shifted or not, there is no corner anywhere.
        feedback: >
          The test is geometric: is there a corner in the payoff anywhere?
      - ask: >
          Mo's call caps his loss at the premium. Does every position in that
          call have a capped loss?
        choices:
          - text: >
              Yes: capped loss is what makes something an option.
            feedback: >
              Capped loss belongs to the holder. The writer of Mo's call must
              deliver at 70 however high the stock goes.
          - text: >
              No: the writer's loss is unbounded as the stock rises.
            correct: true
            feedback: >
              The kink protects whoever owns the choice. The other side of the
              same contract sits on the open-ended part of the payoff.
          - text: >
              No, but only for American calls.
            feedback: >
              Exercise timing does not change the shape of the writer's payoff
              at expiry: $-\max(S - 70, 0)$, unbounded below in both styles.
        feedback: >
          Kinked is not the same as safe. In an interview, say whether the
          payoff is a line or has a kink, where the kink sits, and who owns the
          choice.
